    Engineering Institute''s Capability Maturity Model for software development (SW-CMM),[2]
    which delineates five levels that development groups may achieve in order of increasing
    effectiveness. Few groups have ever been certified at level 5\. Something to aim
    for.


    [2] [http://www.sei.cmu.edu/cmm/cmm.html](http://www.sei.cmu.edu/cmm/cmm.html)


    **2.5 The Bottom Line**


    If you''ve got good attitudes and beliefs, the right behaviors are easy to learn—they''re
    mostly details. So in the next chapter, we''ll get back to the left-brain mode
    of programming details and discuss useful behaviors.


    **Chapter 3\. Antibugging**


    "It is a capital mistake to theorize before one has data. Insensibly one begins
    to twist facts to suit theories instead of theories to suit facts."


    — *Sherlock Holmes in* A Scandal in Bohemia, *by Sir Arthur Conan Doyle*


    ![Image 18](index-23_1.jpg)


    ![Image 19](index-23_2.jpg)


    As you can tell from the chapter title, we''re not above coining horrible neologisms
    to save space. (When our publisher pays us by the word, we''ll be happy to be
    more verbose, but paying us by the word would be as sensible as measuring programmers''
    performance by how many lines of code they write.)


    *Antibugging* describes a set of programming techniques that minimize the probability
    of introducing a bug to a program at design time or input. You could also call
    it *defensive* *programming.* We''re applying the principles we developed in the
    previous chapter to come up with some good Perl development behaviors.


    **3.1 Beginning**


    Before you turn your ideas into code, describe them in natural language.


    **If you can''t say it in natural language, you won''t be able to say it in**
    **Perl.**


    The Extreme Programming methodology (mentioned in more detail in Chapter 6) is
    helpful in this respect in that by insisting that tests be written before the
    code they test, and requiring programming in pairs, it encourages this kind of
    conversation.


    I''ve seen this too many times: someone is having horrible difficulties doing
    an exercise and the code is bleeding all over the screen. Yet when I ask them
    to describe how it''s supposed to work, they can''t articulate it.


    This is a large clue that the approach wasn''t completely thought out to begin
    with.


    **3.2 Writing Code**


    Your code should be as pleasing to the eye as possible, if for no other reason
    than you should like looking at it and not recoil at the prospect of again diving
    into an eructation of characters on the screen. And let''s face it, programs need
    all the aesthetic help they can get because their primary purpose is utilitarian.
    Which of the following subroutines do you prefer?


    sub iterate (&$$){


    for ($_[1] = 0,my $i = 0;$i <= $_[2];


    $_[1] = ++$i/$_[2]){&{$_[0] };


    }


    }


    or


    sub iterate (&$$)


    {


    for ($_[1] = 0, my $i = 0;


    $i <= $_[2];


    $_[1] = ++$i / $_[2])


    ![Image 20](index-24_1.jpg)


    ![Image 21](index-24_2.jpg)


    ![Image 22](index-24_3.jpg)


    {


    &{$_[0]};


    }


    }


    **3.2.1 Style**


    The only believable comment to make about style is that you should have one. If
    you aren''t already rabidly attached to a particular style, read the perlstyle
    manual page and adopt the one shown.


    There''s no excuse for not indenting properly. I have seen many people in my classes
    struggling with an exercise, needlessly handicapped because their code was all
    hugging the left margin for grim death. Regardless of how quick, short, or temporary
    your code is, indenting it will save more time than it costs. (The Emacs cperl
    mode will autoindent simply by hitting the TAB key.)


    **Use a consistent style for each project.**


    A clean style is a good style, whatever style you choose. A suggestion: write
    your code as though you expect it to be published (and win the Turing Award)—using
    white space galore and ample comments.'
