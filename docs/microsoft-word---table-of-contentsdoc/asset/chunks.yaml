    ## 附录 A. Perl 调试器命令


    ![Image 88](img/index-160_1.jpg)


    “跟随白兔。”


    —— Trinity，《黑客帝国》


    本附录介绍了截至 `5.6.0` 版本 Perl 内部调试器中提供的命令。其大部分内容归功于 `perldebug` pod 页面和调试器内部帮助屏幕。


    ### A.1 通用语法


    以下内容适用于调试器中输入的所有命令：


    #### A.1.1 延续行


    以反斜杠（`\`）结尾的行在评估之前会与下一行合并。反斜杠不允许不允许任何空格。


    #### A.1.2 分页


    | command | 说明 |

    | :--- | :--- |

    | `command` | 运行调试器命令，并将调试器输出通过当前分页器进行处理。 |

    | `command` | 运行调试器命令，并将程序输出通过当前分页器进行处理。 |


    #### A.1.3 命令历史


    - `![n]`

    - `![pattern]`


    运行编号 `n` 的命令（默认：上一个命令）或以 `pattern` 开头的最后一个命令。如果 `n` 是负数，则是当前命令之前的第 `n` 条命令。可以使用
    `recallCommand` 选项（后文讨论）更改 `!` 字符。


    - `H [*- *number]`


    你可以使用 `H` 命令显示最后 `number` 条命令。按下向上向下方向键通常可以滚动命令历史。只有大于一个字母的命令会被存入。


    #### A.1.4 Shell 交互


    - `!! command`


    在子 shell 中运行 `command`。你可以使用 `shellBang` 选项（后文讨论）更改 `!` 字符。


    #### A.1.5 命令别名


    - `= [alias command]`


    将 `alias` 设置为 `command` 的别名；然后列出所有别名。如果省略，则列出所有别名。没有清除别名的方法。


    ## A.2 命令


    #### A.2.1 帮助


    - `h`

    - `h h`


    分别获取详细或简洁的帮助屏幕。[1]

    [1] 更准确的说是，分别获取简洁的帮助屏幕和一个极其简洁的帮助屏幕。


    - `h command`


    为指定的调试器命令获取一行帮助信息。


    - `man page`


    查看指定的手册页。如果你的系统没有 `man` 命令，它将使用 `perldoc`；该命令可以通过设置变量 `$DB::doccmd` 来覆盖。


    #### A.2.2 停止或重启


    - `q`

    - `R`


    `q` 命令退出调试器（终端上的文件结束符也是如此）。`R` 命令尝试重新运行程序，并保留你所做的状态更改。某些状态可能会丢失；断点、历史、操作、选项设置以及
    `-w`、`-I` 和 `-e` 命令行选项将被保留。


    #### A.2.3 单步


    - `n [expr]`

    - `s [expr]`

    - `<CR>`

    - `r`


    `n` 和 `s` 单步执行（分别跳过或进入子程序调用）。如果提供了 `expr`，则先执行并单步通过该表达式。单独的回车键会重复上一次 `n` 或 `s`；如果没有，则什么都不做。`r`
    执行代码直到当前子程序的最后一条语句。


    #### A.2.4 检查包数据


    - `V [package [vars]]`

    - `X [vars]`

    - `S [[! [ ]pattern]`

    - `m expr`


    `V` 列出 `package` 中的变量（默认：当前包）。`vars` 可以是空格分隔的列表。`X` 等同于 `V current_package`。`S`
    列出匹配（或带有 `!` 则不匹配）给定模式的子程序。像 `%ENV` 这样的全局变量不属于特定的包，因此不会通过 `V` 或 `X` 命令转储；请使用 `x`
    代替。


    `m` 在列表上下文中评估 `expr`并将第一个元素解释为类名或对象；然后打印可以在其上调用的方法（其包及其祖先包中的子程序）。


    #### A.2.5 检查包或局部数据


    - `p expr`

    - `x expr`


    `p` 打印 `expr`。`x` 评估 `expr`。


    #### A.2.6 显示版本信息


    - `v`


    `v` 命令显示加载模块的版本和位置。


    #### A.2.7 断点


    - `b [point [condition]]`

    - `b $var`

    - `c [point]`


    `b` 设置断点（默认：当前行）。`c` 继续执行；如果给定了位置，则设置一次性断点。`point` 是行号或一个变量。`condition` 是到达断点时评估的
    perl 表达式。


    - `b load filename`

    - `b compile sub`

    - `b postpone sub`


    `b` 的 `load` 形式在加载文件时触发。对于尚未加载的子程序，`compile` 形式在编译触发；`postpone` 形式在子程序的第一执行行设置断点。


    - `d [line]`

    - `D`


    没有通过子程序名删除断点的命令，除了 `D` 删除所有断点。`d` 删除指定行的断点（默认：当前行）。


    #### A.2.8 操作


    - `a [line [action]]`

    - `A`


    `a` 在到达指定行时执行 Perl 代码 `action`（默认：当前行）。如果 `action` 缺失，则删除该行的操作。`A` 删除所有操作。


    #### A.2.9 操作/断点显示


    - `L`


    `L` 列出所有断点和操作。


    #### A.2.10 栈显示


    - `T`


    `T` 显示栈（通往当前行的子程序列表及其相应的参数）。


    #### A.2.11 源码列表


    - `l start+ delta`

    - `l begin- end`

    - `l sub`

    - `l $var`

    - `l`

    - `-`


    `l` 列出源代码：从行号 `start` 开始的后续 `delta` 行，或者从 `begin` 到 `end`，或者从子程序第一行开始的窗口。`l` 单独使用显示下一个窗口；`-`（减）列出上一个窗口。


    - `w [line]`

    - `.`


    `w` 列出指定行的窗口（默认：当前行），`.`（点）将窗口列表指针重置为当前行。


    - `f filename`

    - `/pattern/`

    - `?pattern?`


    `f` 将查看的文件切换到指定文件（必须已加载），`filename` 必须是完整路径或匹配加载文件的正则表达式。`/pattern/` 和 `?pattern?`
    将列表指针移动到匹配模式的下一个或上一个行。


    #### A.2.12 跟踪


    - `t [expr]`


    开启跟踪模式（显示执行的行）。如果提供了 `expr`，则执行并跟踪它。


    #### A.2.13 监视点


    - `W [expr]`


    '
- fmt: '

    Watch the variable (or lvalue indicated by) `expr`. When it changes, the debugger
    reports the old and new values and break. If `expr` is omitted, delete all watchpoints.


    ### A.2.14 Prompt-Time Actions


    ```

    `< command`

    `< ?`

    `<`

    `<< command`

    ```


    `< command` specifies perl code to be executed before each debugger prompt; `<<
    command` adds a command to the list. `< ?` lists the commands, and `<` by itself
    deletes them.


    If you replace `<` with `>` in the previous list, you affect a separate set of
    commands to be executed after the debugger prompt.


    If you replace `<` with `{` in the previous list, you affect a separate set of
    debugger commands (not Perl code) to be executed before the debugger prompt. There
    is no `}` counterpart.


    ### A.2.15 Option Setting


    Several internal switches can be changed to affect different states.


    `O option`


    `O [option?]`


    `O option= value`


    An `O` command by itself lists all the current option settings; `O option?` lists
    the setting for that option. The option may be set to true (1) with the first
    command and to `value` with the last. More than one query or setting may be put
    on the line (space-separated) to affect multiple options at once. The list of
    possible options is in the next section. If an option value is a string containing
    spaces, put quotes around it.


    ### A.2.16 Perl Code


    Anything that does not fit into the previous categories is executed as Perl code
    in the DB package.


    ### A.3 Options


    When setting an option with the `O` command, it is necessary to type only enough
    initial letters to distinguish it from the other options. They are not case sensitive.


    `recallCommand`


    `shellBang`


    Change the character used for command recall or shell escape respectively. Note
    in the case of the latter that it still has to be repeated; you are changing each
    `!`, not the `!!` string.


    `pager`


    Set to `|` followed by the name of the program you want to use for paging; for
    example: `O pag=''|less''`.


    ### A.3.1 Options affecting the V, X, and x commands


    `arrayDepth`


    `hashDepth`


    Set the maximum number of elements to print.


    `quote`


    `HighBit`


    `undefPrint`


    Change the style of string dumps. The valid values for `quote` are `"` , `''`,
    or `auto`.


    `globPrint`


    This is a Boolean indicating whether to print typeglobs.


    `DumpDBFiles`


    `DumpPackages`


    `DumpReused`


    These control whether to dump the contents of arrays holding debugged files, package
    symbol tables, and reused addresses, respectively.


    `bareStringify`


    If a variable overloads its stringify operator, don''t call it; print the raw
    variable instead.


    `usageOnly`


    This causes `V` and `X` to display memory usage statistics for each package instead
    of listing variable values.


    ### A.3.2 Options Affecting Exception Handling


    `signalLevel`


    `dieLevel`


    `warnLevel`


    By changing these values from their default of 0, you can get the debugger to
    intercept signals, warnings, and dies. With a value of 1, dies even within evals
    will be intercepted; with a value of 2, dies will be intercepted even if you created
    a `$SIG{__DIE__}` handler to trap them.


    ### A.3.3 Options Affecting Control by Another Program


    `RemotePort`


    Specify a remote host and port number for remote control of the debugger in the
    format `host*: *port`.


    `tkRunning`


    Set if running under a PerlTk GUI.


    `inhibit_exit`


    According to the documentation, this controls whether the debugger allows "stepping
    off the end of the script," but it may be broken.


    `immediateStop`


    The debugger should "stop as soon as possible." If set in `PERLDB_OPTS` before
    invocation, debugging starts at the first line even if it is in a `BEGIN` block.
    This is handy for debugging used modules because normally the debugger will go
    past them before prompting.


    ### A.3.4 Miscellaneous Options


    `compactDump`


    `veryCompact`


    These affect the verbosity of the display of lists of lists.


    `frame`


    `frame` can be set to a number that is a combination of bit flags specifying certain
    information to be dumped whenever the stack frame changes (i.e., when a subroutine
    is entered or left). At the time of writing, some of the higher numbered flags
    had problems; we''ll just say that `frame=1` shows subroutine entries and `frame=2`
    shows subroutine exits as well.


    `PrintRet`


    Set this option to false to inhibit printing of return information with the `r`
    command.


    `AutoTrace`


    This is the toggle set by the `t` command.


    `maxTraceLen`


    Used to set the maximum output used for argument printing in tracing.


    `ornaments`


    This affects display of the output.; see the `Term::ReadLine` package for value
    interpretations.


    ### A.4 Environment Variables


    The following environment variables affect the operation of the debugger: `PERL5DB`


    This contains the code that starts the debugger; if absent, it defaults to `BEGIN`
    `{ require ''perl5db.pl'' }`.


    `PERLDB_OPTS`


    This variable can contain initialization commands using options, which may, for
    instance, cause the debugger to run noninteractively and dump tracing information
    to a file. See the perldebug POD page for much more information.


    `PERLDB_RESTART`


    If this variable is defined, the debugger will then look for environment variables
    whose names begin with any of the following:


    `PERLDB_VISITED`


    `PERLDB_HIST`


    `PERLDB_ON_LOAD`


    `PERLDB_POSTPONE`


    `PERLDB_INC`


    `PERLDB_FILE`


    `PERLDB_OPT`


    `PRELDB_PRETYPE`


    `PERLDB_PRE`


    `PERLDB_POST`


    `PERLDB_TYPEAHEAD`


    ![Image 89](index-169) This is used to specify a terminal to connect. `PERLDB_NOTTY`
    This is used to specify a terminal. See perldebug page for more information.


    ### Appendix B. Perls of Wisdom


    1  To get started with the documentation, type `perldoc perl`.

    3 Know yourself, then your programs will be easier.

    4 Motivate by what you want *toward,* not what you want to *get away.*

    5 If you can''t say it in natural language, you won''t be able to say it in Perl.

    6 Use a consistent style for each project.

    7 Comment the hard parts. Use POD.

    8 Declare as many of your variables as possible to be lexical.

    9 Use `-w` and `use strict` in all your programs.

    10 Use diagnostics to explain error messages.

    11 Create variables in the innermost scope possible.

    12 If you have many explicit references to `_`, use a named variable instead.

    13 When using a while loop that sets `_`, localize `_` first if it might be called
    elsewhere.

    14 Put empty parentheses after a function that could take arguments but doesn''t.

    15 Use parentheses when in doubt about precedence; they won''t hurt.

    16 Before testing the existence of a lower-level hash key, test the existence
    of the higher-level keys if there''s a chance they may be absent.

    17 Eliminate all causes of warning messages in a program before proceeding with
    development.

    18 Declare subroutines early, avoid collisions with the Perl built-in functions,
    or call them with `&`.

    19 Don''t pass arrays to built-in functions which normally expect a scalar.

    20 Don'' rely on loop variables retaining their values after the loop; save them
    explicitly if you need them.

    21 Use the `Data::Dumper` module to print out a formatted dump of any variable
    or hierarchical data structure.

    22 Migrate option setting to the most convenient input interface possible.

    23 Use one-liners for rapid prototyping of small code constructs.

    24 Examine references to hashes instead of the hashes themselves in the debugger
    to get well-formatted output.

    25 The actual syntax error in your program could occur not just on the line reported
    by Perl, but on any line preceding it.

    26 Handle only the first warning or error message output by Perl; don''t bother
    reading the others, just recompile.

