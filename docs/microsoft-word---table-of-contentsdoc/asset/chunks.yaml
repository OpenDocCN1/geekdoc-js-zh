    A common problem is running off the end of the program and getting the Debugged
    program terminated message. At that point, all your variables have been destroyed.
    If you want to inspect the state of variables after the last line of your program
    has executed, add a dummy line (a `1` by itself will work) so that you can set
    a breakpoint on it.


    ### Tip


    when examining a hash, examine a *reference* to it instead. This lets the `x`
    command see the datatype you''re inspecting instead of being handed the list that
    it evaluates to, and it can format it more appealingly:


    ```perl

    DB<1> %h = (Craig => ''Stirling'', \Sharron => ''Macready'', Richard => ''Barrett'');

    DB<2> x %h

    0 ''Sharron''

    1 ''Macready''

    2 ''Craig''

    3 ''Stirling''

    4 ''Richard''

    5 ''Barrett''

    DB<3> x \%h

    0 HASH(0x8330d5c)

    ''Craig'' => ''Stirling''

    ''Richard'' => ''Barrett''

    ''Sharron'' => ''Macready''

    ```


    ![Image 49](index-79_1.jpg)


    **Examine references to hashes instead of the hashes themselves in the debugger
    to get well-formatted output.**


    ### 7.2.3 Examining Source: `l`, `-`, `w`


    Sometimes you want more of the context of your program than just the current line.
    The following commands show you parts of your source code:


    `l`

    List successive windows of source code starting from the current line about to
    be executed.


    `l x+y`

    List `y + 1` lines of source starting from line `x`.


    `l x-y`

    List source lines `x` through `y`.


    `-`

    List successive windows of source code before the current line.


    `w`

    List a window of lines around the current line.


    `w <line>`

    List a window of lines around `line`.


    `.`

    Reset pointer for window listings to current line.


    Source lines that are breakable (i.e., lines with `*` can have a breakpoint inserted
    before them—see the following section) have a colon after the line number.


    ### 7.2.4 Playing in the Sandbox


    Since the debugger is a full-fledged Perl environment, you can type in Perl code
    on the fly to examine its effects under the debugger;[1] some people do this as
    a way of testing code quickly without having to enter it in a script or type in
    everything perfectly before hitting end-of-file. (You just saw us do this at the
    end of section 7.2.2.)


    [1] So, you might wonder, how would you enter Perl code which happened to look
    like a debugger command (because you''d defined a subroutine `l`, perhaps)? In
    versions of Perl prior to 5.6.0, if you enter leading white space before text,
    the debugger assumes it must be Perl code and not a debugger command. So be careful
    not to hit the space bar by accident before typing a debugger command. This was
    no longer true as of version 5.6.0.


    Type `perl -de 0` to enter this environment.[2] Let''s use this as a sandbox for
    testing Perl constructs:


    [2] There are many expressions other than 0 that would work equally well, of course.
    Perl just needs something innocuous to run.


    ```perl

    % perl -de 0

    DB<1> $_ = ''What_do*parens-in=split+do%again?'';

    DB<2> @a = split /(\W+)/;

    DB<3> x @a

    0 ''What_do''

    1 ''*''

    2 ''parens''

    3 ''-''

    4 ''in''

    5 ''=''

    6 ''split''

    7 ''+''

    8 ''do''

    9 ''%''

    10 ''again''

    11 ''?''

    ```


    You can even use this feature to change the values of variables in a program you
    are debugging, which can be a legitimate strategy for seeing how your program
    behaves under different circumstances. If the way your program constructs the
    value of some internal internal variable is complex and it would require numerous
    changes to the input to have it form the variable differently, then a good way
    of playing "What if?" is to stop the program at the right place in the debugger
    and change the value by hand. How would we stop it? Let''s see …


    ### 7.2.5 Breakpointing: `c`, `b`, `L`


    An important feature of a debugger is the ability to allow your program to continue
    executing until some condition is met. The most common such condition is the arrival
    of the debugger at a particular line in your source. You can tell the Perl debugger
    to run until a particular line number with the `c` (for continue) command:


    ```perl

    main::(debug.pl:4): my @parole = qw(Salutations Hello Hey);

    DB<1> c 16

    main::print_line(debug.pl:16): print "$_ Perl World\n"; DB<2>

    ```


    What the debugger actually did was set a one-time breakpoint at line 16 and then
    executed your code until it got there. If it had hit another breakpoint earlier,
    it would have stopped there first.


    So what''s a breakpoint? It''s a marker set by you immediately before a line of
    code, invisible to anyone but the perl debugger, which causes it to halt when
    it gets there and return control to you with a debugger prompt. If you have a
    breakpoint set at a line of code that gets printed out with one of the source
    examination commands listed earlier, you''ll see a `b` next to it.


    ### 7.2.6 Taking Action: `a`, `A`


    An even more advanced use of the facility to execute arbitrary code in the debugger
    is the *action* capability. With the `a` command (syntax: `a line code`), you
    can specify code to be executed just before a line would be executed. (If a breakpoint
    is set for that line, the action executes first; then you get the debugger prompt.)
    The action can be arbitrarily complicated and, unlike this facility in debuggers
    for compiled languages, lets you reach into the program itself:


    ```perl

    main::(debug.pl:4): my @parole = qw(Salutations Hello Hey);

    DB<1> a 16 s/Hey/Greetings/**

    DB<2> c

    Salutations Perl World

    Hello Perl World

    Greetings Perl World

    Done

    Debugged program terminated.

    ```

    '
