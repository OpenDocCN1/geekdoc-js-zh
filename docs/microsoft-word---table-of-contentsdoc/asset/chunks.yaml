    that Benchmark evaluates each chunk of code in a lexical scope that is separate
    from the one enclosing it. So if the code you''re testing is long enough to be
    worth strict checking, put use strict at the beginning of each chunk. This scoping
    effect also means that any lexical variables you declare in the main program won''t
    be visible inside the benchmark code chunks.


