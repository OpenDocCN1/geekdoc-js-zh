    ### 10.3.1 Flashback…


    Remember in Chapter 8 we wondered why Perl placed the error with the transposed
    for clauses on the wrong line? Now we know how to find out!


    ```

    $ perl -MO=Deparse temp.pl

    ```


    ```

    Useless use of numeric lt (<) in void context at temp.pl line 13.


    my $fmt = ''%10s '' x 5;


    printf "$fmt\n", qw(Kelvin Celsius Rankine

    Fahrenheit Reaumur);


    $fmt = ''%10.2f '' x 5;


    my $kelvin = 0;


    while ($kelvin += 10)

    {


    my $celsius = $kelvin - 273.15;

    my $rankine = $kelvin * 9 / 5;

    my $fahrenheit = $rankine - 459.67;

    my $reaumur = $celsius * 4 / 5;

    printf "$fmt\n", $kelvin, $celsius, $rankine,

    $fahrenheit, $reaumur;

    }


    continue

    {

    $kelvin < 500

    }

    ```


    Well, look at that. The dirty truth about for loops emerges: they''re nothing
    but while loops in fancy clothes. The test clause got relocated to a continue
    block, where, of course, it makes no sense, being an expression in void context.


    ### 10.4 printf Formats Don''t Impose Context


    If you''re a die-hard C programmer (and is there any other?), you might think
    that to print the number of entries in an array, since the `%d` printf format
    specifier means "number,"


    well gosh, a number is a scalar, and so that''s the context it''ll put its argument
    into: `printf "Number of entries in \@foo = %d", @foo;`


    but by now you know us too well to fall for that … yes, `@foo` is in list context
    here, because that''s what `printf` is prototyped to take. So you''ll either get
    the first entry of `@foo` printed, or a complaint if that''s not a number.


    ### 10.5 Conditional my


    ![Image 65](index-117_1.jpg)


    You have a subroutine that should set a private variable based on some condition.
    Not unreasonably, you might code something following this general form:


    ```

    sub ordinal

    {


    my $what = shift;

    my $res = ''first'' if $what == 1;

    $res = ''second'' if $what == 2;

    return $res;

    }

    ```


    But you''d be wrong. If we run this through `perl -l` with `for (1..3) { print
    ordinal($_) }`, we get the result:


    ```

    first

    second

    second

    ```


    Eh? Shouldn''t that last line be a warning about an undefined value? Regrettably,
    you''ve fallen afoul of an internal optimization in Perl[4] that keeps the storage
    assigned to lexical variables around after they''re gone, on the premise that
    they may be needed again shortly.


    The `my` statement has both a compile-time effect (declaring the variable) and
    a run-time effect (setting it to `undef`, unless the statement is qualified by
    a failed condition).


    [4] That may change in a future version.


    **Never qualify a my statement with a condition.**


    Note that this is not talking about putting `my` statements *inside* conditions:


    ```

    if ((my $tag = $element->tag) ne ''p'')

    {


    # Code using $tag

    }

    ```


    ```

    while (my ($key, $value) = each %hash) { ... }

    ```


    which is a very good idiom in that it concisely limits the scope of the new variable
    to precisely the block in which you need it.


    ### 10.6 Bringing Some Closure


    Understanding how lexical variables work is worth the effort. Suppose you have
    advanced to the stage of understanding closures—give yourself a pat on the back—and
    you decide to code a few subroutines that use a private variable that way:


    ```

    {

    my $protocol = "ftp"; # default

    sub get_proto

    {


    return $protocol;

    }


    sub set_proto

    {


    $protocol = shift;

    }

    }

    ```


