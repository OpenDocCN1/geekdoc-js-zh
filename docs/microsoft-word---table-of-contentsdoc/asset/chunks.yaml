    \nprint <<\"EOF\";\nSymlinks: $symlinks, Dirs: $dirs, Regulars: $regulars\nSockets:\
    \ $sockets, Blocks: $blocks, Chars: $chars, Others:\n$others\nEOF\n\nsub doit\n\
    ```\n[/content] (Wait, I see the text provided in the prompt actually ends at\
    \ `sub doit`. I will stop there).\n\nActually, I will provide the final output\
    \ based on the text provided.\n\n[content]\nWe can see that there's no difference\
    \ in setting an element to `undef` or `1`, but there *is* a significant improvement\
    \ in setting all the elements at once to `1` with a hash slice and an even bigger\
    \ improvement in using a hash slice to set them all to `undef` (presumably because\
    \ we aren't taking the time to form a large list on the right-hand side). This\
    \ tidbit can come in handy when we're using a hash just to test for existence;\
    \ we can set the keys using a hash slice without having to set the values and\
    \ later test for existence with `exists`.\n\nWell, wait a minute. Might there\
    \ be a performance hit from using the `exists` function rather than testing the\
    \ truth of the hash value? Why guess when we can benchmark it?\n\n```\nuse Benchmark;\n\
    \nmy %h;\n\n@h{map int rand 1000, 1..100} = (1) x 100;\n\ntimethese (1000000,\n\
    \n{ exists => '$x++ if exists $h{int rand 1000}',\n\ntrue => '$x++ if $h{int rand\
    \ 1000}',\n\n});\n```\n\nWe first fill the hash with up to 100 integer keys randomly\
    \ chosen from the range 0 to 999, and then we compare the operation of testing\
    \ an element for existence with testing one for truth. (The `$x++` is just to\
    \ give Perl something to do so we don't have to worry about whether a smart optimizer\
    \ might decide to elide our code altogether.) The results are\n\n![Image 70](index-124_1.jpg)\n\
    \nBenchmark: timing 1000000 iterations of exists, true...\n\nexists: 7 wallclock\
    \ secs ( 6.52 usr + 0.02 sys =\n6.54 CPU)\n\ntrue: 7 wallclock secs ( 6.28 usr\
    \ + 0.00 sys =\n6.28 CPU)\n\nThere is no (significant) difference.\n\n**Use the\
    \ Benchmark module to compare the relative speeds of different code strategies.**\n\
    \nWhat else can we learn from this Perl of Wisdom? Well, you may be wondering\
    \ why there was no complaint in the first Benchmark example about the hash `%h`\
    \ not being declared.\n\nWe can infer from section 3.6.1 (pointing out that `use\
    \ strict` is lexically scoped) that Benchmark evaluates each chunk of code in\
    \ a lexical scope that is separate from the one enclosing it. So if the code you're\
    \ testing is long enough to be worth strict checking, put `use strict` at the\
    \ beginning of each chunk. This scoping effect also means that any lexical variables\
    \ you declare in the main program won't be visible inside the benchmark code chunks.\n\
    \nWe should point out that there is rarely any point to benchmarking code that\
    \ isn't going to be run many, many times by your program. So if it's just code\
    \ that's going to run once, don't bother benchmarking it unless it either (a)\
    \ takes a really, really long time or (b) needs to run very, very quickly (e.g.,\
    \ has to respond to a user in real time).\n\nBenchmarking needs careful thought\
    \ and can be an art. Benchmark the wrong thing, and the conclusion you draw can\
    \ easily be the opposite of the right one. Suppose you're benchmarking code that\
    \ uses a constant function inside a loop. If you put the definition in the code\
    \ chunk, it'll get executed once for each iteration, whereas in your program it\
    \ will get executed only once. The difference between the two approaches is seen\
    \ in this benchmark, which shows how the result is changed by putting the constant\
    \ definition in the loop:\n\n```\nuse constant OUTSTR => 'The cat sat on the mat';\n\
    \ntimethese(10000000,\n\n{\n\ninconst => q(use constant INSTR =>\n'The cat sat\
    \ on the mat';\nINSTR =~ /cat/),\n\noutconst => q(OUTSTR =~ /cat/),\n\n});\n```\n\
    \ninconst: 31 wallclock secs (31.27 usr + 0.00 sys =\n31.27 CPU)\n\noutconst:\
    \ 29 wallclock secs (28.78 usr + 0.00 sys =\n28.78 CPU)\n\nNotice how we used\
    \ the `q()` operator instead of `'...'` to make a visual block out of the code\
    \ chunks.\n\nSo make the code you benchmark as close as possible to what you will\
    \ actually use in production. Make sure the machine is not heavily loaded, because\
    \ a really busy machine could spend so much time keeping its house in order that\
    \ it would skew the CPU figure.\n\nTherefore, make benchmarks short enough that\
    \ you can keep an eye on the system with `top` or the equivalent while they're\
    \ running, and so you can run them again to ensure that the results are consistent.\n\
    \n### 11.2.3 Ask de Prof\n\nOur discussion of Benchmark presumes that you know\
    \ where the critical regions of your code are. After all, if you have a subroutine\
    \ that consumes only 1 part of the time used by your program, no amount of optimization\
    \ therein will improve your overall performance by more than 1%.\n\nOne way of\
    \ finding out where your program spends the most time is with the `Devel::DProf`\
    \ module. To see it in action, we'll construct a very simple program to count\
    \ different types of file on our system:\n\n```\nuse strict;\n\nmy ($symlinks,\
    \ $dirs, $regulars,\n$sockets, $blocks, $chars, $others) = (0) x 7;\n\ndoit ('/');\n\
    \nprint <<\"EOF\";\nSymlinks: $symlinks, Dirs: $dirs, Regulars: $regulars\nSockets:\
    \ $sockets, Blocks: $blocks, Chars: $chars, Others:\n$others\nEOF\n\nsub doit\n\
    ```\n"
