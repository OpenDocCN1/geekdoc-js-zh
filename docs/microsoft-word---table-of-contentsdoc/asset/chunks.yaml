    ## 7.2.9 Programmatic Interaction with the Debugger


    You can put code in your program to force a call to the debugger at a particular
    point. For instance, suppose you''re processing a long input file line by line
    and you want to start tracing when it reaches a particular line. You could set
    a conditional breakpoint, but you could also extend the semantics of your input
    by creating "enable debugger" lines. Consider the following code:


    ```perl

    while (<INPUT>)

    {

    $DB::trace = 1, next if /debug/;

    $DB::trace = 0, next if /nodebug/;

    # more code

    }

    ```


    When run under the debugger, this enables tracing when the loop encounters an
    input line containing "debug" and ceases tracing upon reading one containing "nodebug".
    You can even force the debugger to breakpoint by setting the variable `$DB::single`
    to `1`, which also happens to provide a way you can debug code in `BEGIN` blocks
    (which otherwise are executed before control is given to the debugger).


    ## 7.2.10 Optimization


    Although the Perl debugger displays lines of code as it runs, it''s important
    to note that these are not what actually executes. Perl internally executes its
    compiled opcode tree, which doesn''t always have a contiguous mapping to the lines
    of code you typed, due to the processes of compilation and optimization. If you
    have used interactive debuggers on C code in the past...


    ## 7.2.11 Another "Gotcha"


    If you set a lexical variable as the last statement of a block, there is no way
    to see what it was after the block exits. Why would code do that? In a word, *closures.*
    For example,


    ```perl

    { # Start a closure-enclosing

    my $spam_type; # This lexical will outlive its block

    sub type_spam

    {

    # ...

    $spam_type = $complex_func();

    }

    }

    ```


    In this case, `type_spam` or some other subroutine in the closure would have a
    good reason for seeing the last. But if you''re stepping through the debugger,
    you won''t see what it gets to on the last line because, after the statement executes,
    the debugger pops out to a scope where `$spam_type` is not in scope unless


    Unfortunately, in this case, if the result of the function is not used by the
    caller, you''re out of luck.


