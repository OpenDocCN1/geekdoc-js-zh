    **13.10 Command Line Testing**


    A CGI.pm program is easily tested from the command line; as soon as the program
    calls a CGI method or creates a CGI object it will prompt


    (offline mode: enter name=value pairs on standard input)


    and you can then type a series of lines like:


    address="742 Evergreen Terrace"


    phone=555-8707


    End them with whatever character signals end-of-input to your current shell. The
    inputs you cannot provide this way are


    • File uploads.


    • Cookies: You can pass them by setting the environment variable HTTP_COOKIE to
    the name of the cookie followed by an = sign and the value of the cookie.


    • User authentication: Set the REMOTE_USER environment variable to the name of
    the authenticated user. A Web server will not pass the password the user typed
    to your program anyway.


    If your program does something different when you run it from the command line
    than when you run it through a browser, here are the things to check:


    • Path: These are probably different. Set $ENV{PATH} explicitly in your program
    to satisfy taint mode.


    • Current directory: The Web server may set this to something other than the directory
    the program is located in. Use absolute paths for filenames for input and output,
    or chdir to absolute paths first.


    • Cookies: Try disabling these in your browser to see if it makes a difference,
    or use something like our proxylog tool to see what cookie transactions take place
    over the Web.


    • Permissions and ownerships: Does your program read any files that are inaccessible
    to the UID the Web server process runs under? Does your program modify any files
    outside of scratch directories? If so, bear in mind that the Web server process
    UID


    has very little authority (hopefully). You''ll need to give write permission to
    that UID for anything like this.


    • Environment: There may be some environment variable set only in your command
    line shell (like LD_LIBRARY_PATH) that modifies the behavior of programs executed
    by your program. Compare all your environment variables with the ones reported
    by cgi-test.


    **13.11 Dying Young**


    Perhaps the most vexing problem to deal with in CGI programming is how to handle
    exceptions. If something in your program dies, it (normally) prints a message
    to STDERR


    and exits. The error message doesn''t look like an HTTP header, so if it comes
    out before you get to print the headers you''ll get a 500 Server Error. And if
    it comes out later, it won''t be in HTML (or GIF, or whatever you''re outputting)
    and will mess up the formatting of what you''re in the middle of sending.


    This is mostly addressed by the CGI::Carp module. With the statement use CGI::Carp
    qw(fatalsToBrowser); if your program ever dies, the message will be trapped and
    output to the browser.[7] So, to use a short example, consider the following CGI
    program:


    [7] If you leave out the fatalsToBrowser parameter, then output to STDERR gets
    identified and timestamped. This is healthy when you''re using a server that sends
    that to the error log—you can tell what generated each message and when.


    #!/usr/bin/perl -w


    use strict;


    use CGI qw(:standard);


    use CGI::Carp qw(fatalsToBrowser);


    my ($num_angels, $pinhead_size) = (1_000_000_000, 0);


    print header, start_html, h1(''Philosophy 101'');


    print p(<<"EOP");


    Other Web sites wonder how many angels can dance on the


    head of a pin; we calculate it for you.


    EOP


    print p(''The answer is '', $num_angels/$pinhead_size);


    print end_html;


    This will produce something like:


    **Philosophy 101**


    Other Web sites wonder how many angels can dance on the


    head of a pin; we calculate it for you


    Content-type: text/html


    Software error:


    Illegal division by zero at /home/peter/


    public_html/foo.cgi line 12.


    For help, please send mail to the webmaster.


    This doesn''t do you much good if your program is outputting an image and has
    already sent the header, but fortunately the vast majority of CGI programs output
    HTML.


    In production code, it is inadvisable to reveal error messages to end users for
    reasons of aesthetics and security. Randal Schwartz recently released a *Linux
    Magazine* column on a module called FatalsToEmail that e-mails errors to developers;
    see


    [http://www.stonehenge.com/merlyn/LinuxMag/col14.html](http://www.stonehenge.com/merlyn/LinuxMag/col14.html).
    See also Jonas Liljegren''s CPAN'
