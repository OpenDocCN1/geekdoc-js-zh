  trans: '

    我们可以看到，将元素设置为 `undef` 或 `1` 并没有区别，但使用哈希切片（hash slice）一次性将所有元素设置为 `1` *有*显著的提升，而使用哈希切片将它们全部设置为
    `undef` 的提升更为巨大（推测可能是因为我们没有花时间在右侧构建一个大型列表）。当我们仅使用哈希来测试键是否存在时，这个小技巧会非常有用；我们可以使用哈希切片来设置键，而无需设置值，并在稍后用
    `exists` 测试存在性。


    等一下，等一下。使用 `exists` 函数而不是测试哈希值的真值是否会产生性能损耗？既然我们可以进行基准测试，何必去猜呢？


    ```

    use Benchmark;


    my %h;


    @h{map int rand 1000, 1..100} = (1) x 100;


    timethese (1000000,


    { exists => ''$x++ if exists $h{int rand 1000}'',


    true => ''$x++ if $h{int rand 1000}'',


    });

    ```


    我们首先在哈希中填充从 0 到 999 范围内随机选择的最多 100 个整数键，然后比较测试元素是否存在的操作与测试其真值的操作。（`$x++` 只是为了让
    Perl 有些事情要做，这样我们就不必担心智能优化器可能会完全跳掉我们的代码。）结果如下：


    ![Image 70](img/index-124_1.jpg)


    Benchmark: timing 1000000 iterations of exists, true...


    exists: 7 wallclock secs ( 6.52 usr + 0.02 sys =

    6.54 CPU)


    true: 7 wallclock secs ( 6.28 usr + 0.00 sys =

    6.28 CPU)


    没有（显著）差异。


    **使用 Benchmark 模块来比较不同代码策略的相对速度。**


    我们从这本《智慧 Perl》中还能学到什么呢？嗯，你可能在奇怪，为什么在第一个 Benchmark 示例中没有抱怨哈希 `%h` 没有被声明。


    我们可以从 3.6.1 节（指出 `use strict` 是词法作用域的）推断出，Benchmark 在独立于其环境的词法作用域内评估每段代码。因此，如果你测试的代码足够长，值得进行严格检查，请在每个代码块开头加上
    `use strict`。这种作用域效应意味着你在主程序中声明的任何词法变量在基准测试代码块内部都是不可见的。


    我们应该指出，对于程序不会运行很多很多次的代码，进行基准测试几乎没有意义。所以，如果代码只运行一次，就不要费劲去基准测试了，除非它 (a) 花了非常非常长的时间，或者
    (b) 需要运行得非常非常快（例如，必须实时响应用户）。


    基准测试需要深思熟虑，并且是一门艺术。测试了错误的对象，你得出的结论很容易与正确答案相反。假设你正在基准测试一段在循环中使用常量函数的代码。如果你将定义放在代码块中，它将在每次迭代中执行一次，而在你的程序中，它只会执行一次。这两种方法之间的差异在这个基准测试中可见，它展示了将常量定义放在循环中是如何改变结果的：


    ```

    use constant OUTSTR => ''The cat sat on the mat'';


    timethese(10000000,


    {


    inconst => q(use constant INSTR =>

    ''The cat sat on the mat'';

    INSTR =~ /cat/),


    outconst => q(OUTSTR =~ /cat/),


    });

    ```


    inconst: 31 wallclock secs (31.27 usr + 0.00 sys =

    31.27 CPU)


    outconst: 29 wallclock secs (28.78 usr + 0.00 sys =

    28.78 CPU)


    注意我们是如何使用 `q()` 运算符而不是 `''...''` 来为代码块创建一个视觉块的。


    因此，使你基准测试的代码尽可能接近你实际在生产环境中使用的代码。确保机器没有负载过重，因为一台非常繁忙的机器可能会花费大量时间整理它的内务，从而偏偏 CPU
    数值。


    因此，让基准测试足够短，以便在它们运行时可以使用 `top` 或同等工具监控系统，这样你就可以再次运行它们以确保结果的一致性。


    ### 11.2.3 问问教授 (Ask de Prof)


    我们对 Benchmark 的讨论假设你已经知道代码中的关键区域。毕竟，如果你有一个子程序只消耗了程序运行时间的 1%，那么无论对其进行多少次优化，都不会让你的整体性能提升超过
    1%。


    找到程序在何处花费时间时间方法是使用 `Devel::DProf` 模块。为了看到它的作用，我们将构建一个非常简单的程序来统计系统上不同类型的文件：


    ```

    use strict;


    my ($symlinks, $dirs, $regulars,

    $sockets, $blocks, $chars, $others) = (0) x 7;


    doit (''/'');


    print <<"EOF";

    Symlinks: $symlinks, Dirs: $dirs, Regulars: $regulars

    Sockets: $sockets, Blocks: $blocks, Chars: $chars, Others:

    $others

    EOF


    sub doit

    ```

    '
- fmt: "\nUse `Devel::DProf` to profile programs for bottlenecks.\n\n# 11.3 Making\
    \ Things Better\n\nHere we discuss a few ways of improving your program's use\
    \ of resources. You'll find terse descriptions of many more in *Programming Perl*\
    \ (Chapter 8 in the second edition, Chapter 24 in the third).\n\n## 11.3.1 Improving\
    \ Execution Speed\n\nIt is common for improvements in execution speed to cost\
    \ dearly in the readability department. Adding lookup caches, rearranging statement\
    \ order, and inlining subroutine calls conspire to make a program less maintainable;\
    \ therefore, as we have said before, you do these things only when you have to.\n\
    \nOnce you've identified the code that is taking the most time, the next step\
    \ is to optimize that code. A few suggestions follow.\n\n### Inside a loop, take\
    \ every opportunity to get out of it as early as possible.\n\nI was just now writing\
    \ some code to parse a log file containing lines like 20010208001507:POP3-Server:[198.137.241.43]:gwbush\n\
    \nThe first statement in the loop was:\n\n```perl\nnext unless my ($year, $month,\
    \ $day, $hour, $minute, $second, $user)\n= /(\\d\\d\\d\\d)(\\d\\d)(\\d\\d)(\\\
    d\\d)(\\d\\d)(\\d\\d):POP3-Server:.*:(.*)/;\n```\n\nThis may have been a natural\
    \ translation of the obvious solution, but it was a tad slow on a 3 million line\
    \ log file! Since many input lines did not match this pattern, I was able to speed\
    \ up the elimination of those lines by inserting the following line of code at\
    \ the beginning of the loop: `next unless index ($_, ':POP3-Server:') > 0;` (but\
    \ not before making the mistake of leaving the parentheses out—can you see why\
    \ that was wrong?).\n\nThis works because the string `:POP3-Server:` still uniquely\
    \ identifies the lines we want.\n\nWe can do more; in general, simple string operations\
    \ work faster than regular expressions, so we can follow that line of code with\
    \ these statements instead of the one that originally began the loop:\n\n```perl\n\
    my ($year, $month, $day, $hour, $minute, $second)\n= unpack \"A4A2A2A2A2A2\",\
    \ $line;\n\nmy ($user) = $line =~ /:POP3-Server:.*:(.*)/;\n```\n\nHowever, this\
    \ benchmarks no faster than the previous code. We can use one more piece of information\
    \ about the line to get an improvement: the last characters before the username\
    \ are `]:`, and they don't occur anywhere else on the line. Benchmarking this\
    \ code shows a speed increase of 50% over the alternative:\n\n```perl\nuse Benchmark;\n\
    \n$line = <DATA>;\ntimethese (200000, {\n  'unpack' => q{\nmy ($year, $month,\
    \ $day, $hour, $minute, $second)\n= unpack \"A4A2A2A2A2A2\", $line;\nmy $user\
    \ = substr $line, index ($line, ']:')+2;\n},\n  'regex' => q{\nmy ($year , $month\
    \ , $day, $hour, $minute, $second, $user)\n= ($line =~ /(\\d\\d\\d\\d)(\\d\\d)(\\\
    d\\d)(\\d\\d)(\\d\\d)(\\d\\d):POP3-Server:.*:(.*)/);\n}\n});\n\n__END__\n20010208001507:POP3-Server:[198.137.241.43]:gwbush\n\
    \nBenchmark: timing 200000 iterations of regex, unpack...\nregex: 15 wallclock\
    \ secs (15.63 usr + 0.02 sys = 15.65 CPU)\nunpack: 10 wallclock secs (10.42 usr\
    \ + 0.00 sys = 10.42 CPU)\n```\n\n![Image 74](index-129_1.jpg)\n\n### Memoize\
    \ function calls with common arguments.\n\nUsing the CPAN module `Memoize` (http://search.cpan.org/search?dist=Memoize)\
    \ by Mark-Jason Dominus to transparently remember the results of any function\
    \ call gives you an easy way to trade memory for speed. You could do the same\
    \ thing with slightly less execution overhead in your program by creating appropriate\
    \ data structures and checking for the existence of an entry there before calling\
    \ a function, but `Memoize` allows you to swap this capability in and out at the\
    \ cost of a single line, and it can even save the results to disk to make them\
    \ persistent.\n\nWe can illustrate this with an example that looks up the canonical\
    \ Internet host name for various servers. It might be quite common to call `gethostbyname`\
    \ for the same input more than once in, for instance, an application processing\
    \ log files, and it's reasonable to assume that within a short period—say, a few\
    \ minutes—the results won't change. Here's a benchmark:\n\n```perl\nuse Benchmark;\n\
    use Memoize;\n\nsub get_host_info {\n  (gethostbyname shift)[0] || 'undefined';\n\
    }\n\nsub get_hosts {\n  for (1..shift) {\n    my $true_name = get_host_info \"\
    www.$_.com\"\n    for 'aaa' .. 'abc';\n  }\n}\n\nget_hosts(1); # Prime the cache\n\
    timethese (200000, {\n  bare => q{ get_hosts },\n  memo => q{ get_host_info }\n\
    });\n```\nWait, let me re-align with the provided text's specific logic for the\
    \ benchmark block:\n\nThe text says:\n```perl\nuse Benchmark;\nuse Memoize;\n\
