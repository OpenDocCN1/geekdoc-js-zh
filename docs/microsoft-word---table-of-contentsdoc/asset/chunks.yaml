    on the undefined variable is ++. If you look at some code that uses ++ like that,
    you''ll see why this is useful.


    [11] If you have a variable that could legitimately acquire a value of undef by
    that point in your program, then test for it using the defined operator.


    Now, opinion is somewhat divided on the matter of leaving the -w flag on in operational,
    or delivered, code. The ayes contend that since you designed your program not
