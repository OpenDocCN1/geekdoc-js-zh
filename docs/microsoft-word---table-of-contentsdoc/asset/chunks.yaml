    如果你喜欢使用 `EQUIVALENCE`——那么，是时候改掉这个习惯了。在 Perl 中你可以为同一个变量创建别名，但这通常没用。如果你非要这样做，`Alias`
    模块提供了一个简单的方法。如果你想将一个变量别名映射到多个存储空间，或者反之（就像你使用 `EQUIVALENCE` 时的那样），那么，你做不到。而且我们不会给你任何同情。


    如果你是一个从不使用、也不打算使用 `EQUIVALENCE` 语句或 `COMMON` 块的 `FORTRAN` 程序员，那太好了！只有天知道这些怪物般的产物给人类造成了多大程度痛苦和心碎。


    ## 12.4 给 Shell 程序员的建议


    你和 C 语言程序员是 Perl 最受宠的孩子（假设我们所说的“shell”指的是 Unix 类的；DOS/NT 命令行界面是完全不同的另一物种）。


    在其他新来者中，只有你一个人认为标量变量以 `$` 开头是非常自然的，而且你只需要习惯在赋值和引用时 `$` 都在那里即可。起初，调用外部程序必须封装在 `system()`
    中可能让你觉得很束缚，尽管你使用反引号（`` `` ``）捕获程序输出时感到很自如。但如果你试图通过使用 `Shell.pm` 来补偿以避免那些 `system()`
    调用，请尝试不使用它吧。Shell 脚本调用外部程序时需要较低的语法开销，因为它本身能做的很少；而 Perl 能做的事情很多，所以调用其他程序的频率要低得多。克服调用那些喜爱的
    `cut`、`head`、`sed`，是的，甚至用 `awk` 进行文本过滤的倾向；一旦你学会了在 Perl 中完成相同的工作，你很少会觉得需要回去。如果你尝试将
    Shell 脚本转换为 Perl，你会发现随着你反复剔除对实用程序程序的调用，这一原则会不断显现。


    Shell 程序是逐行解释的，这意味着你可以对脚本的未来方向写下任何旧的垃圾来代表你的想法，只要这些语句不会真的执行到那一步即可。Perl 要求在尝试执行任何代码之前，整个脚本在语法上必须正确，这意味着你甚至不能在
    `if (0) { ... }` 块中隐藏某些内容而不必确保它在语法上是正确的。


    但你可以通过插入一行仅包含 `__END__` 的行来实现你想要的效果，程序的其余部分将被忽略。（实际上，如果你愿意，它可以供你的程序通过文件句柄 `DATA`
    读取。）


    Perl 的引用规则将是一个令人欣慰的解脱——不再需要为了得到你想要的结果与 `''`、`"` 和 `\` 的组合作斗争。简单的规则是：插值（Perl 的术语，即你所称的参数替换）仅取决于最外层引号的类型。例如，如果你想向
    `grep` 程序传递一个可能包含空格的变量，只需说：


    ```

    system "grep -s ''$quote'' @files";

    ```


    整个命令周围的双引号确保了 `$quote` 和 `@files` 被插值。前者被用单引号修饰，后者的元素默认用空格分隔，这正是我们想要的。如果你想在双引号之间嵌入
    `$quote` 呢？Perl 允许通过在双引号前加一个反斜杠来在双引号字符串中放入双引号，但有一个更酷的解决方案，使用 Perl 的 `qq` 引用运算符，它允许你选择不同的分隔符，从而消除对引号进行转义的需求：


    ```

    system qq(grep -s "$quote" @files);

    ```


    然而，如果 `$quote` 可以包含任何字符，且你不希望其中任何一个字符被 Shell 或 `grep` 命令解释为元字符，你需要确保所有潜在的麻烦制造者都经过转义，而
    Perl 有一对特殊的转义序列对专门完成这项工作：


    ```

    system "grep -s \Q$quote\E @files"

    ```


    将其扩展到处理 `@files` 成员可能包含空格或元字符的情况，就留给读者练习。


    提到操作符，Perl 对字符串使用 `eq` 和 `ne`，对数字使用 `==` 和 `!=`，你可能认为这种顺序是反过来的。


    你会高兴地发现，反引号和 `system` 命令的返回码存储在熟悉的 `$?` 中。然而，那个返回码不是你所熟悉的那个；它是 C 语言程序员从 `system`
    调用中得到的那个，所以需要将其向右移动八位以得到你需要的代码。（低八位包含了大多数人不感兴趣的信息，例如程序是否核心转储，或者什么信号中断了它，至少在 Unix
    上是这样。）


    ## 12.5 给 C++ 或 Java 程序员的建议


    Perl 的面向对象特性可能看起来稀少得惊人；事实上，它们是为了避免语言不必要的膨胀而精心设计的结果。例如，在方法中没有引用当前对象的 `this` 关键字；相反，它是作为第一个参数传递的，你可以选择你自己的名字。大多数人选择
    `$self` 是因为 `my $self ...` 这个声明听起来很好听（或者因为他们以前是过 Smalltalk 程序员）。


    仅凭运行时语义就能决定一个例程是对象方法还是类方法，所以你可以轻松地写一个兼顾两者的方法。（一种常见的惯用法让构造方法变成一个对象方法。）


    在 Perl 中，构造方法并没有特殊之处；你可以称它为任何名字，但大多数 Perl 程序员称它为 `new` 以让你感到亲切。不仅底层实现是暴露的，而且你必须从大量的选择中自己实现它。（你会感到最舒服的选择是哈希；在掌握它之前甚至不要考虑其他的。）而且，它没有原生支持创建或继承实例属性，尽管有一些可选的编译指令（`base`,
    `fields`）为这样做提供了一些语法糖。


    无论如何，你的调用者不应直接访问实例数据，而是通过访问方法。你可以使用模块（如 `Class::Struct`）自动创建这些方法，尽管现在看来任何值得写的类在每个访问方法中都需要自定义逻辑。


    除非你费力将实例数据私有化，否则调用者可能会修改对象的实例数据。（参见 perlot 文档页中的“闭包作为对象”。）由于 Perl 中没有（你习惯的那种）函数原型，因此没有具有不同原型方法的重载。你可以在运行时验证调用你的方法的参数数量和类型，如果你想的话。


    Perl 无法在编译时强制抽象（纯虚）方法被重写，但你可以创建一个在运行时抛出异常的方法，除非它已经被重写。


    你可以在 Damian Conway 的优秀书籍《Object-Oriented Perl》（Manning, 1999）中找到关于 Perl、C++ 和
    Java 之间更有系统方法的对比。


    ### 12.5.1 给 Java 程序员的特定建议


    在 Perl 中，你可以选择创建一个完全不是面向对象的程序，而且——恐怖——甚至不是一个类。这实际上是解决许多问题的最佳方法，尽管在每次写程序时都进行类层次分解的习惯可能很难改掉。


