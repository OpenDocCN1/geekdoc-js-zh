    # 附录 B：我们的“智慧之言”列表


    我们将花费大量时间回顾问题示例以及你可能如何调试这些问题。


    ## 获取 Perl


    虽然这不是一本关于如何构建或构建 perl 的书，[1] 但我们至少欠你一些最基础的指导，教你如何获取一个你自己的 perl。


    [1] 这不是拼写错误。按照惯例，大写的 `Perl` 指的是抽象的语言，而小写的 `perl` 指的是运行 Perl 程序的程序。


    - 对于 Windows 机器，获取免费的 `ActivePerl` 分发版：[`www.activeState.com/ActivePerl/download.htm`](http://www.activeState.com/ActivePerl/download.htm)

    - 对于 Macintosh：[`www.cpan.org/ports/index.html#mac`](http://www.cpan.org/ports/index.html#mac)

    - 对于适用于所有其他机器的二进制发行版：[`www.cpan.org/ports/`](http://www.cpan.org/ports/)

    - 获取 `perl` 本身的源码：[`www.cpan.org/src/`](http://www.cpan.org/src/)


    在受支持的 Unix 架构上从源码编译 `perl` 只需在下载并解压正确的文件后执行以下命令：


    ```bash

    ./Configure

    make

    make test

    make install # 如果 make test 成功

    ```


    ![Image 3](img/index-5_1.jpg)


    ![Image 4](img/index-5_2.jpg)


    `Configure` 步骤会向你提出无数个问题，大多数人根本不知道其中许多问题在说什么；但 `Configure` 推荐的默认答案通常是正确的。


    出于教育目的，你可能想要构建一个启用了调试功能的 `perl`。（在这里我们指的是允许你使用特殊的 `-DDEBUGGING` 标志来输出信息的 perl，这些信息告诉你
    `perl` 正在对你的程序做什么。这与 Perl 内置的交互式调试器无关——我们在第 7 章会讨论它——所有的 perl 都有那个功能。）如果你想这样做，请从源码编译
    `perl`，当 `Configure` 询问“Any additional cc flags?”时，将它已经显示的括号内的内容作为默认值粘贴进去，并添加
    `-DDEBUGGING`。更多信息请参见 `perlrun` POD 页面（后文介绍）。


    我们偶尔会提到不是 Perl 核心发行版的一部分但在全面 Perl 归档网络（CPAN）上可以找到模块。关于如何从 CPAN 查找、下载和安装模块的说明，请参阅
    http://www.cpan.org/misc/cpan-faq.html](http://www.cpan.org/misc/cpan-faq.html)。


    ## 排版规范


    我们在本书中使用了以下规范：


    - 标准文本：Times Roman

    - 作者注释：Arial

    - 代码示例和 URL：Courier

    - 用户输入：**粗体 Courier**


    有时我们的代码示例在原句中没有换行的地方有了换行。在这些换行会导致问题或不明显的地方，我们在行末尾放置了一个反斜杠（`\`），表示该行应与下一行合并。


    偶尔，我们希望让你知道是我们中的谁在对你说话，所以我们使用了这种风格的注释来让你知道。（顺便说一下，这是 Ed。）那些页边图标是我妻的姐姐 Ann Palmer
    为本书创作的精彩插画的一部分。（顺便说一下，这是 Peter。）


    ## 延伸参考


    访问本书的网站 [位于 http://www.perldebugged.com](http://www.perldebugged.com)。


    通过以下资源（按用性粗略排序）获取 Perl 编程介绍：


    ![Image 5](img/index-6_1.jpg)


    - *Learning Perl*, 第 2 版，Randal Schwartz 和 Tom Christiansen 编写（O''Reilly & Associates,
    1997）

    - *Programming Perl*, 第 3 版，Larry Wall, Tom Christiansen 和 Jon Orwant 编写（O''Reilly
    & Associates, 2000）

    - *Perl, the Programmer''s Companion*,Nigel Chapman 编写（John Wiley & Sons, 1998）

    - *Elements of Programming with Perl*,Andrew Johnson 编写（Manning Publications,
    1999）

    - *Effective Perl Programming*,Joseph Hall 与 Randal Schwartz 编写（Addison-Wesley,
    1998）


    ## Perl 版本


    在书中，我们指的是 Perl 的最新“稳定”版本，截至本书时为 `5.6.0`。


    我们所说的大部分内容在旧版本的 Perl 5 上也可以直接运行，但不适用于 Perl 4。


    如果你使用任何早于 `5.004_04` 的 Perl 版本，你应该升级；`5.003` 存在安全问题和内存泄漏等问题。你可以通过传递 `-v` 标志查找你的
    `perl` 版本号：


    ```bash

    perl -v

    ```


    This is perl, v5.6.0 built for i586-linux

    Copyright 1987-2000, Larry Wall

    [...]


    如果存在 `-v` 标志，Perl 将不会执行命令行上指定命名的脚本。可以通过 `-V` 标志获取关于你的 `perl` 配置的更详细描述；如果你提交错误报告，该功能会自动将此信息包含在你的报告中。[2]


    [2] 使用随 `perl` 附的 `perlbug` 程序。


    一个独立的开发轨道用于你的 `perl` 发行版包含一个。在第四届 Perl 会议（加利福尼亚，2000 年 7 月）上宣布 Perl 开发开始认真，向后兼容性并不妨碍某些事情。如果你发现你有一个且并不想要它，你可能访问了错误的
    FTP。


    ## 致谢


    我想感谢 David Noble 让我了解调试器的复杂性。我最感谢我的妻子 Grace 在这段忙碌时间的支持与爱。


    ![Image 6](img/index-7_1.jpg)


    ![Image 7](img/index-7_2.jpg)


    一如既往，感谢我的奶奶 Charles D. Wright 让我玩电脑并阅读书籍，感谢最初联系我关于项目的 O''Brien。


    此外，我们感谢编辑 Mike Hendrickson 及其同事 Julie Debaggis 和 Marcy Barnes 的持续支持、耐心和理解，他们在我们承担风险时并引导我们进入作者领域。在
    Addison-Wesley 的其他人员中，我们感谢 Cathy Comer, Mary Cotillo, Jacquelyn Doucette, John
    Fuller, Karin Hansen, Katie Noyes, Heather Olszyk 和 Heather Peterson。


    我们感谢 Elaine Ashton 的评审和截图，感谢 Brad Appleton, Sean M. Burke, Joseph Hall, Jarkko
    Hietaniemi, Michael G. Schwern 以及其他评审者的建设性建议，这些建议极大地改进了本书。任何剩余错误都不归他们。


    # 第 1 章：引言


    “良好的开始是成功的一半。”

    ——玛·波平


    ## 1.1 现实


    遗憾对于编程世界（以及程序员）来说，软件开发在项目被宣布完成（这是一个日益任意且通常不准确的标签）后仍在继续。维护和调试花费的时间可能比原始编码更多，特别是因为负责程序维护的人员可能不是原始程序员。这意味着我们花费大量时间来推断代码中发现的某些算法的细节：它是如何实现的，为什么要这样做，以及为什么它现在不起工作了。[1]


    [1] 在这方面的一部里程碑著作是 Fred Brooks 写的《人人神谭》（Addison-Wesley, 1995）。


