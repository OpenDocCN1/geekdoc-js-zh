    splain, and it appends the longer explanation to each error message as though
    you''d used diagnostics in the first place.


    **3.7 Tips for Reducing Complexity**


    "Complexity is the enemy, and our aim is to kill it."


    — *Jan Baan*


    One of Perl''s greatest strengths is its expressiveness and extreme conciseness.
    Complexity is the bane of software development: when a program grows beyond a
    certain size, it becomes much harder to test, maintain, read, or extend. Unfortunately,
    today''s problems mean this is true for every program we need. Anything you can
    do to minimize the complexity of your program will pay handsome dividends.


    The complexity of a program is a function of several factors:


    • The number of distinct lexical tokens


    • The number of characters


    • The number of branches in which control can pass to a different point


    • The number of distinct program objects in scope at any time Whenever a language
    allows you to change some code to reduce any of these factors, you reduce complexity.


    **3.7.1 Lose the Temporary Variables**


    The poster child for complexity is the temporary variable. Any time a language
    intrudes between you and the solution you visualize, it diminishes your ability
    to implement the solution. All languages do this to some degree; Perl less than
    most.[13] In most languages, you swap two variables a and b with the following
    algorithm:


    [13] We want to say "less than the rest," but we just *know* what sort of letters
    we''d get ...


    Declare temp to be of the same type as a and b


    temp = a;


    a = b;


    b = temp;


    But most languages are not Perl:


    ($b, $a) = ($a, $b);


    Iterating over an array usually requires an index variable and a count of how
    many things are currently stored in the array:


    int i;


    for (i = 0; i < count_lines; i++)


    {


    strcat (line[i], suffix);


    }


    Whereas in Perl, you have the foreach construct borrowed from the shell: foreach
    my $line (@lines) { $line .= $suffix }


