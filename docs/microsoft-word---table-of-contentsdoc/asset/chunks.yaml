  trans: '


    - 27 148 不要在一个程序的不同位置输入相同的文本，并依赖于让它们保持同步。

    - 28 150 尽可能让错误在编译时而不是运行时发生。

    - 29 153 了解你的操作系统。

    - 30 157 通过捕获异常并优雅地处理它们，来使你的程序变得“无弹性的”。

    - 31 163 `readdir()` 返回目录中的文件名列表，但这些文件名并不包含目录本身的限定限定路径。

    - 32 170 `Deparse` 模块通常可以解释 `perl` 是如何解析你的代码的。

    - 33 170 永远不要让 `my` 语句带有条件。

    - 34 174 首先为了代码的可读性和维护性优化代码；只有在对运行版本进行性能分析并发现需要时，才进行性能优化。

    - 35 181 使用 `Benchmark` 模块比较不同代码策略的相对速度。

    - 36 185 使用 `Devel::DProf` 对程序进行性能分析以寻找瓶颈。

    - 37 185 在循环内部，利用一切机会尽早退出循环。

    - 38 187 对带有常用参数的函数调用进行记忆化（Memoize）。

    - 39 189 尽可能在 Perl 中完成一切，而不是调用外部程序。

    - 40 191 不要创建不列表。

    - 41 193 避免不必要的拷贝。

    - 42 194 避免使用临时文件。

    - 43 201 使用 `Exporter` 将常用的常量组放在自己的模块中，并在需要的地方使用这些模块。

    - 44 212 如果可能的话，为你正在开发的 Web 服务器获取交互式登录权限。如果不行，请考虑使用其他服务。

    - 45 217 从一开始就创建带有污染检查（taint checking）的 CGI 程序。在现有程序上后期添加 `-T` 是既枯燥又沮丧的。

    - 46 218 从命令行运行你的 CGI 程序，检查它是否以正确的顺序产生了正确的输出。


