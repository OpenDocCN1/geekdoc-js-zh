    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"


    DB<1> **n**


    1+2=3


    Debugged program terminated...


    DB<1> **q**


    What did we observe? The debugger prints the one-line program: main::(-e:1): $x=1;
    $y=2; $z=$x+$y; print"$x+$y=$z\n"


    4 times until the expected program output 1+2=3\. Why? The debugger displays the
    next line of code perl executes, not the next command. The program consists of
    four executable


    commands, but they''re all on the same line; therefore we see the line each time
    the debugger executes a commend.


    Recast the program to one command per line:


    $x = 1;


    $y = 2;


    $z = $x+$y;


    print"$x+$y=$z\n";


    Then use the debugger. You can either put the four lines in a file or use a shell
    like the Bourne shell that allows you to type new lines between single quotes.


    % **perl -d dbformat.pl**


    main::(dbformat.pl:1):$x=1;


    DB<1> **n**


    main::(dbformat.pl:2):$y=2;


    DB<1> **n**


    main::(dbformat.pl:3):$z=$x+$y;


    DB<1> **n**


    main::(dbformat.pl:4):print"$x+$y=$z\n";


    DB<1> **n**


    1+2=3


    Debugged program terminated...


    DB<1> **q**


    This is easier to follow. The debugger functioned as it was designed to in both
    cases, but a style difference made it harder to interpret the debugger''s output
    for the one-liner.


    **3.3 Observation**


    One of the most important skills you can hone as a developer is the power of observation.


    The biggest lesson to learn is how *not* to make things up. One way to learn this
    is to spend a stint answering calls on a help desk. Because so many of the people
    who call give such blatantly incomplete, inaccurate, or imaginary information,
    you will quickly realize the proper ways to describe a problem.


    Why is this important to you as a developer? It''s about better communication,
    and better understanding. *Better communication* because when you''re working
    with someone else, you have to convey your ideas and experiences to them in the
    slow, limited medium of speech rather than in the lightning fast way in which
    richly expressive thoughts zip around in your head. Until development teams can
    use mind melds to communicate, you have to make the best of the bandwidth bottleneck
    called your tongue. *Better understanding* because whenever you articulate something
    inaccurately, even if you''re the only one listening, part of you will take it
    at face value and then get confused.


    How does this "making things up" show up? Let''s say someone is running a program
    containing the following code for sending a report back to them: open MAIL, "|$SENDMAIL
    $address"'
