- fmt: "\nSuccess! Problem located and identified. Case closed. (No, there's no substitute\
    \ for looking over the code with a Mark I eyeball. However, if you have reams\
    \ of code to search, you can reduce the amount you have to check by removing or\
    \ commenting out parts of it selectively until you see the error message change.)\n\
    \nNow let's consider another missing semicolon that's far more insidious: use\
    \ strict\n\n```perl\nmy $message = \"Hello World\\n\";\n\nprint $message;\n\n\
    exit;\n```\n\nThis program compiles fine; it even runs without error. Unfortunately,\
    \ it also runs without output. What happened to the contents of `$message`? A\
    \ long or a short way can be used to debug this problem. Let's try the long way\
    \ first (the reason for this choice will become apparent in due course).\n\nWe'll\
    \ fire up the debugger (see Chapter 7). The first (meaningful) output from the\
    \ debugger is\n\n```\nmain::(-:3): print $message;\nDB<1>\n```\n\nHmm. Something's\
    \ wrong here. The debugger halted at the first executable line of code. (A `use`\
    \ statement is a compile time directive, so we don't expect to see that in the\
    \ debugger.) Why aren't we seeing the assignment to `$message`? No wonder when\
    \ we examine `$message` there's nothing there:\n\n```\nDB<1> x $message\n0 undef\n\
    ```\n\nFor some reason, line 2 isn't considered executable. It isn't commented\
    \ out, so it must be being executed at compile time instead. Hmm again. That rings\
    \ a bell. Wait a minute, it comes right after a `use` statement. Could it be that\
    \ Perl is considering it to be part of the `use` statement?\n\nAt this point,\
    \ we discover the missing semicolon and probably are too relieved to care about\
    \ why it happened. But for the curious among you, here's an explanation: the absence\
    \ of the semicolon and the fact that all white space (including newlines) looks\
    \ the same to Perl means that lines 1 and 2 parse as\n\n```perl\nuse strict my\
    \ $message = \"Hello World\\n\";\n```\n\nIf we look at the specification for the\
    \ `use` statement, we see that it is `use Module *LIST`\n\nSo the name of the\
    \ module can be followed by a list—and an assignment is a valid member of a list!\
    \ Because evaluation occurs in the scope of the `use` statement, `my $message\
    \ = \"Hello Perl World\\n\"` ends up scoped inside the implicit `BEGIN` block\
    \ created by `use`, and hence disappears by the next line because it was a lexical\
    \ variable.\n\nThe debugger demonstration shows the long way to find our typo,\
    \ but in this case a shorter error analysis method exists. The `-w` flag produces\
    \ warnings for the more common Perl programming problems. Run the program with\
    \ the `-w` flag and Perl returns `Name \"main::message\" used only once: possible\
    \ typo at typo.pl line 3.`\n\n`Use of uninitialized value at typo.pl line 3.`\n\
    \nAs we now know, the assignment of `$message` happens in the wrong place due\
    \ to the typo.\n\nThe warning alerts us to the fact that when `$message` *is*\
    \ used, it doesn't yet contain a defined value.\n\nThis example should trouble\
    \ you. If you put `use strict` in all your programs (and if you aren't doing so\
    \ already, you will by the time you finish this book), you should be wondering\
    \ now whether the strictness is in effect. To check, remove `my` from the `$message`\
    \ assignment. If strictness is in effect, Perl will complain that `$message` lacks\
    \ an explicit package name.\n\n```perl\nuse strict\n\n$message = \"Hello World\"\
    ;\n\nprint \"$message\\n\";\n\nexit;\n```\n\nOn running, Perl returns: `Hello\
    \ World`. Surprise! The typo prevents strictness from becoming enabled. The absence\
    \ of the `my` keyword allows the assignment to succeed.\n\n(Since it's global,\
    \ the fact that the assignment happens in an invisible `BEGIN` block doesn't matter.)\n\
    \nThis is one of the most insidious errors conceivable: a single character mistake\
    \ that causes no warning and no error yet prevents the very error checking the\
    \ programmer was trying to enable.\n\n### 8.1.2 A Puzzle\n\nHere's another example\
    \ of deletion. Can you figure out what's wrong?\n\n```perl\nuse strict;\n\nsub\
    \ foo\n{\n    my $sref = shift;\n    foreach my $d (@)\n    {\n        find ($sref,\
    \ $d);\n    }\n}\n\nsub find { }\n```\n\nThe result:\n\n```\nGlobal symbol \"\
    $d\" requires explicit package name at typo.pl line 6.\nsyntax error at typo.pl\
    \ line 7, near \"}\"\nsyntax error at typo.pl line 8, near \"}\"\nExecution of\
    \ typo.pl aborted due to compilation errors.\n```\n\n`foreach my $d (@)` should\
    \ instead be `foreach my $d (@_)`. Well, `(@)` is a valid variable in Perl—a strange\
    \ variable to be sure, and not the kind of thing you want to be using intentionally—but\
    \ a variable nevertheless. This robbed the `foreach` list of its closing parenthesis\
    \ and caused a wonderful cascade of nonsense.\n\n### 8.1.3 Insertion\n\nInsertion\
    \ typos probably occur as often as deletion typos, though with different pathologies.\n\
    \nAn additional character in a variable name is flagged by Perl (if you used `-w`),\
    \ and a misspelled command generates a run-time exception. An insertion typo becomes\
    \ dangerous when the typo is still a valid Perl statement but executes an unexpected\
    \ function.\n\nConsider a program with one extraneous character:\n\n```perl\n\
    use strict;\n\nmy $x = 1;\n\nmy $y = 2;\n\n$x == $y;\n\nprint \"$x,$y\\n\";\n\
    ```\n\nRun the program and Perl prints: `1,2`. No errors or warnings are given;\
    \ this is expected, since each program statement is valid Perl. Now consider a\
    \ program that differs from the previous one by one character:\n\n```perl\nuse\
    \ strict;\n\nmy $x = 1;\n\nmy $y = 2;\n\n$x = $y;\n\nprint \"$x,$y\\n\";\n```\n\
    \nWhen run, Perl prints: `2,2`. The first program was an assignment to `$x`, the\
    \ latter a Boolean test. The former `$x=$y` was intended, but the first program\
    \ performed `$x=$y` (Wait, the logic is reversed here). This reveals yet another\
    \ reason to use `-w` in every program: with it, Perl can warn us that our mistake\
    \ resulted in essentially useless operation. Run our first program with `-w` and\
    \ Perl returns:\n\n`Useless use of numeric eq in a void context. File 'typo1.pl';\
    \ Line 4.`\n\n### 8.1.4 Alteration\n\nLet's examine another single typo:\n\n```perl\n\
    use strict;\n\n$message = \"Hello World';\n\nprint \"$message\\n\";\n\nexit;\n\
    ```\n\nOn running, Perl returns the following:\n\n```\nScalar found where operator\
    \ expected at typo.pl line 3, at end of line (Might be a runaway multi-line \"\
    \" string starting on line 2) (Do you need to predeclare print?)\nsyntax error\
    \ at typo.pl line 3, near \"print \"$\nGlobal symbol \"message\" requires explicit\
    \ package name at typo.pl line 3.\nBackslash found where operator expected at\
    \ typo.pl line 3,\nnear \"$message \\\" (Missing operator before \\?)\nBareword\
    \ \"n\" not allowed while \"strict subs\" in use at typo.pl line 3.\nString found\
    \ where operator expected at typo.pl line 3, at end of line (Missing semicolon\
    \ on previous line?)\nCan't find string terminator '\"' anywhere before EOF at\
    \ typo.pl\nline 3.\n```\n\nSeven error messages from one typo! Let's concentrate\
    \ on the first error and ignore the rest for now. The first error complains about\
    \ a scalar on line 3 instead of a typo. Luckily, we get a hint about the error:\n\
    \n`Might be a runaway multi-line \"\" string starting on line 2`\n\nThis suggests\
    \ paying special attention to the use of quote marks on line 2, where we find\
    \ the string delimited by a double quote (\") and a single quote ('). String delimiters\
    \ must match at the beginning and end. Since there are no interpolated variables\
    \ or digraphs in this string, either kind of quote will work, as long as we use\
    \ the same one at each end of the string.\n\nHandle only the first warning or\
    \ error message output by Perl; don't bother reading the others, just recompile.\n"
  raw: 'Success! Problem located and identified. Case closed. (No, there''s no substitute
    for looking over the code with a Mark I eyeball. However, if you have reams of
    code to search, you can reduce the amount you have to check by removing or commenting
    out parts of it selectively until you see the error message change.)


    Now let''s consider another missing semicolon that''s far more insidious: use
    strict


    my $message = "Hello World\n";


    print $message;


    exit;


    This program compiles fine; it even runs without error. Unfortunately, it also
    runs without output. What happened to the contents of $message? A long or a short
    way can be used to debug this problem. Let''s try the long way first (the reason
    for this choice will become apparent in due course).


    We''ll fire up the debugger (see Chapter 7). The first (meaningful) output from
    the debugger is


    main::(-:3): print $message;


    DB<1>


    Hmm. Something''s wrong here. The debugger halted at the first executable line
    of code. (A use statement is a compile time directive, so we don''t expect to
    see that in the debugger.) Why aren''t we seeing the assignment to $message? No
    wonder when we examine $message there''s nothing there:


    DB<1> **x** **$message**


    0 undef


    For some reason, line 2 isn''t considered executable. It isn''t commented out,
    so it must be being executed at compile time instead. Hmm again. That rings a
    bell. Wait a minute, it comes right after a use statement. Could it be that Perl
    is considering it to be part of the use statement?


    At this point, we discover the missing semicolon and probably are too relieved
    to care about why it happened. But for the curious among you, here''s an explanation:
    the absence of the semicolon and the fact that all white space (including newlines)
    looks the same to Perl means that lines 1 and 2 parse as


    use strict my $message = "Hello World\n";


    If we look at the specification for the use statement, we see that it is use Module
    *LIST*


    So the name of the module can be followed by a list—and an assignment is a valid
    member of a list! Because evaluation occurs in the scope of the use statement,
    my $message =


    "Hello Perl World\n"; ends up scoped inside the implicit BEGIN block created by
    use, and hence disappears by the next line because it was a lexical variable.


    The debugger demonstration shows the long way to find our typo, but in this case
    a shorter error analysis method exists. The -w flag produces warnings for the
    more common Perl programming problems. Run the program with the -w flag and Perl
    returns Name "main::message" used only once: possible typo at typo.pl line 3.


    Use of uninitialized value at typo.pl line 3.


    As we now know, the assignment of $message happens in the wrong place due to the
    typo.


    The warning alerts us to the fact that when $message *is* used, it doesn''t yet
    contain a defined value.


    This example should trouble you. If you put use strict in all your programs (and
    if you aren''t doing so already, you will by the time you finish this book), you
    should be wondering now whether the strictness is in effect. To check, remove
    my from the $message assignment. If strictness is in effect, Perl will complain
    that $message lacks an explicit package name.


    use strict


    $message = "Hello World";


    print "$message\n";


    exit;


    On running, Perl returns: Hello World. Surprise! The typo prevents strictness
    from becoming enabled. The absence of the my keyword allows the assignment to
    succeed.


    (Since it''s global, the fact that the assignment happens in an invisible BEGIN
    block doesn''t matter.)


    This is one of the most insidious errors conceivable: a single character mistake
    that causes no warning and no error yet prevents the very error checking the programmer
    was trying to enable.


    **8.1.2 A Puzzle**


    Here''s another example of deletion. Can you figure out what''s wrong?


    use strict;


    sub foo


    {


    my $sref = shift;


    foreach my $d (@)


    {


    find ($sref, $d);


    }


    }


    sub find { }


    The result:


    Global symbol "$d" requires explicit package name at typo.pl line 6.


    syntax error at typo.pl line 7, near "}"


    syntax error at typo.pl line 8, near "}"


    Execution of typo.pl aborted due to compilation errors.


    foreach my $d (@) should instead be foreach my $d (@_). Well, @) is a valid variable
    in Perl—a strange variable to be sure, and not the kind of thing you want to be
    using intentionally—but a variable nevertheless. This robbed the foreach list
    of its closing parenthesis and caused a wonderful cascade of nonsense.


    **8.1.3 Insertion**


    Insertion typos probably occur as often as deletion typos, though with different
    pathologies.


    An additional character in a variable name is flagged by Perl (if you used -w),
    and a misspelled command generates a run-time exception. An insertion typo becomes
    dangerous when the typo is still a valid Perl statement but executes an unexpected
    function.


    Consider a program with one extraneous character: use strict;


    my $x = 1;


    my $y = 2;


    $x == $y;


    print "$x,$y\n";


    Run the program and Perl prints: 1,2\. No errors or warnings are given; this is
    expected, since each program statement is valid Perl. Now consider a program that
    differs from the previous one by one character:


    use strict;


    my $x = 1;


    my $y = 2;


    $x = $y;


    print "$x,$y\n";


    When run, Perl prints: 2,2\. Output from the second program shows the value of
    $x set to the value of $y, whereas the first performs no such operation. What
    did the first program do?


    In line 4, $x=$y was intended, but $x==$y was coded. The former is an assignment
    to modify $x, the latter a Boolean test that modifies neither $x nor $y—a particularly
    nasty problem as both commands are correct Perl syntax, and both execute without
    a complaint, with or without use strict.


    All this is very elementary, of course, until you wonder "What if I use -w?" Run
    our first program with -w and Perl returns:


    Useless use of numeric eq in a void context.


    File ''typo1.pl''; Line 4.


    This reveals yet another reason to use -w in every program: with it, Perl can
    warn us that while our mistake resulted in syntactically valid Perl, it was odd
    Perl. It can''t raise a red flag stating "An extra = on line 4!" but it can point
    out that we''ve executed an essentially useless operation.


    **8.1.4 Alteration**


    Let''s examine another single typo program:


    use strict;


    $message = "Hello World'';


    print "$message\n";


    exit;


    On running, Perl returns the following:


    Scalar found where operator expected at typo.pl line 3, at end of line (Might
    be a runaway multi-line "" string starting on


    ![Image 57](index-95_1.jpg)


    line 2) (Do you need to predeclare print?)


    syntax error at typo.pl line 3, near "print "$message "


    Global symbol "message" requires explicit package name at typo.pl line 3.


    Backslash found where operator expected at typo.pl line 3,


    near


    "$message \" (Missing operator before \?)


    Bareword "n" not allowed while "strict subs" in use at typo.pl line 3.


    String found where operator expected at typo.pl line 3, at end of line (Missing
    semicolon on previous line?)


    Can''t find string terminator ''"'' anywhere before EOF at


    typo.pl


    line 3.


    Seven error messages from one typo! Let''s concentrate on the first error and
    ignore the rest for now. The first error complains about a scalar on line 3 instead
    of a typo. Luckily, we get a hint about the error:


    Might be a runaway multi-line "" string starting on line 2


    This suggests paying special attention to the use of quote marks on line 2, where
    we find the string delimited by a double quote (") and a single quote (''). String
    delimiters must match at the beginning and end. Since there are no interpolated
    variables or digraphs in this string, either kind of quote will work, as long
    as we use the same one at each end of the string.


    **Handle only the first warning or error message output by Perl; don''t** **bother
    reading the others, just recompile.**'
  toc: []
  trans: "\n成功！问题已定位并识别。案件结案。（不，没有什么东西能替代用“一代人的肉眼”来仔细检查代码。然而，如果你有海量的代码需要搜索，可以通过选择性地删除或注释掉部分代码，直到错误消息发生变化，从而减少需要检查的内容。）\n\
    \n现在让我们考虑另一个隐蔽的缺失分号：`use strict`\n\n```perl\nmy $message = \"Hello World\\n\"\
    ;\n\nprint $message;\n\nexit;\n```\n\n这个程序可以正常编译，甚至运行也没有错误。遗憾的是，它运行后没有任何输出。`$message`\
    \ 的内容去哪儿了？可以使用长方法或短方法来调试此问题。让我们先尝试长方法（选择这个方法的理由就会显而易见）。\n\n我们将启动调试器（见第 7 章）。调试器的第一个（有意义的）输出是：\n\
    \n```\nmain::(-:3): print $message;\nDB<1>\n```\n\n嗯。这里有点不对。调试器停止在了第一行可执行的代码上。（`use`\
    \ 语句是一个编译时直接指令，所以我们不期望在调试器中看到它。）为什么我们没有看到对 `$message` 的赋值？难怪当我们检查 `$message` 时，那里什么都没有：\n\
    \n```\nDB<1> x $message\n0 undef\n```\n\n出于某种原因，第 2 行未被视为可执行代码。它没有被注释掉，所以它一定是在编译时执行的。再次嗯。这听起来很耳。等一下，它紧跟在一个\
    \ `use` 语句后面。难道 Perl 将它视为 `use` 语句的一部分了吗？\n\n此时，我们发现了缺失的分号，可能由于太松了一口气而没去理会它是如何发生的。但对于你们中好奇的人，这里有一个解释：分号的缺失以及所有空格（包括换行符）在\
    \ Perl 看来都是相同的，这意味着第 1 行和第 2 行解析为：\n\n```perl\nuse strict my $message = \"Hello\
    \ World\\n\";\n```\n\n如果我们查看 `use` 语句的规范，可以看到它是 `use Module *LIST`\n\n因此，模块名后面跟着一个列表——而赋值是列表的有效成员！因为求值是在\
    \ `use` 语句的作用域内，`my $message = \"Hello Perl World\\n\"` 最终作用域在 `use` 创建的隐式 `BEGIN`\
    \ 块内部，因此由于它是局部变量，在下一行就消失了。\n\n调试器演示了寻找我们拼写错误的长方法，但在这种情况下存在一种更短的错误分析方法。`-w` 标志会对常见的\
    \ Perl 编程问题产生警告。使用 `-w` 标志运行程序，Perl 返回：`Name \"main::message\" used only once:\
    \ possible typo at typo.pl line 3.`\n\n`Use of uninitialized value at typo.pl\
    \ line 3.`\n\n正如我们现在所知，由于拼写错误，`$message` 的赋值发生在错误的地方。\n\n警告提醒我们，当 `$message` *被*\
    \ 使用时，它尚未包含一个定义值。\n\n这个例子应该让你感到困扰。如果你在所有程序中都加上了 `use strict`（如果你还没有这样做，在你读完这本书时你也会这么做的），你现在应该怀疑严格模式是否生效。要检查这一点，请从\
    \ `$message` 赋值中移除 `my`。如果严格模式生效，Perl 将抱怨 `$message` 缺少显式的包名。\n\n```perl\nuse\
    \ strict\n\n$message = \"Hello World\";\n\nprint \"$message\\n\";\n\nexit;\n```\n\
    \n运行后，Perl 返回：`Hello World`。惊喜吧！拼写错误阻止了严格模式的开启。`my` 关键字的缺失允许赋值成功。\n\n（由于它是全局的，赋值发生在不可见的\
    \ `BEGIN` 块中的这一事实并不重要。）\n\n这是能想象到的最隐蔽的错误之一：一个字符的错误既没有产生警告也没有产生错误，却阻止了程序员试图开启的错误检查功能。\n\
    \n### 8.1.2 谜题\n\n这是另一个删除类的例子。你能看出哪里出了问题吗？\n\n```perl\nuse strict;\n\nsub foo\n\
    {\n    my $sref = shift;\n    foreach my $d (@)\n    {\n        find ($sref, $d);\n\
    \    }\n}\n\nsub find { }\n```\n\n结果是：\n\n```\nGlobal symbol \"$d\" requires explicit\
    \ package name at typo.pl line 6.\nsyntax error at typo.pl line 7, near \"}\"\n\
    syntax error at typo.pl line 8, near \"}\"\nExecution of typo.pl aborted due to\
    \ compilation errors.\n```\n\n`foreach my $d (@)` 应该是 `foreach my $d (@_)`。嗯，`(@)`\
    \ 在 Perl 中是一个有效的变量——虽然这是一个奇怪的变量，而且不是你刻意想要使用的类型——但它终归是一个变量。这夺走了 `foreach` 列表的右括号，并导致了一场奇妙的连锁反应。\n\
    \n### 8.1.3 插入\n\n插入类拼写错误的发生频率可能与删除类错误相当，尽管病理机制不同。\n\n变量名中的额外字符会被 Perl 标记（如果你使用了\
    \ `-w`），而拼写错误的命令会产生运行时异常。当拼写错误仍然是一个有效的 Perl 语句但执行了意外的功能时，插入类错误就会变得危险。\n\n考虑一个包含多余字符的程序：\n\
    \n```perl\nuse strict;\n\nmy $x = 1;\n\nmy $y = 2;\n\n$x == $y;\n\nprint \"$x,$y\\\
    n\";\n```\n\n运行程序，Perl 输出 `1,2`。没有产生错误或警告；这是预料之中的，因为每个语句都是有效的 Perl。现在考虑一个与上一个差了一个字符的程序：\n\
    \n```perl\nuse strict;\n\nmy $x = 1;\n\nmy $y = 2;\n\n$x = $y;\n\nprint \"$x,$y\\\
    n\";\n```\n\n运行后，Perl 输出 `2,2`。第一个程序是赋值给 `$x`，后者是布尔测试。前者本意是 `$x=$y`，但逻辑反反了。这揭示了在每个程序中使用\
    \ `-w` 的另一个理由：使用 `-w` 运行第一个程序，Perl 会警告我们的错误导致了本质的操作：`Useless use of numeric eq\
    \ in a void context. File 'typo1.pl'; Line 4.`\n\n### 8.1.4 修改\n\n让我们来看另一个单字符错误：\n\
    \n```perl\nuse strict;\n\n$message = \"Hello World';\n\nprint \"$message\\n\"\
    ;\n\nexit;\n```\n\n运行期间，Perl 返回以下内容：\n\n```\nScalar found where operator expected\
    \ at typo.pl line 3, at end of line (Might be a runaway multi-line string starting\
    \ on line 2) (Do you need to predeclare print?)\nsyntax error at typo.pl line\
    \ 3, near \"print \"$\nGlobal symbol \"message\" requires explicit package name\
    \ at typo.pl line 3.\nBackslash found where operator expected at typo.pl line\
    \ 3,\nnear \"$message \\\" (Missing operator before \\?)\nBareword \"n\" not allowed\
    \ while \"strict subs\" in use at typo.pl line 3.\nString found where operator\
    \ expected at typo.pl line 3, at end of line (Missing semicolon on previous line?)\n\
    Can't find string terminator '\"' anywhere before EOF at typo.pl\nline 3.\n```\n\
    \n一个错误产生了条信息！让我们专注于第一个错误，暂时忽略其他的。第一个错误抱怨第 3 行有一个标量而不是错误。幸运的是，我们得到了一个关于错误的提示：\n\
    \n`Might be a runaway multi-line \"\" string starting on line 2`\n\n这提示我们要关注第\
    \ 2 行引号的使用，在那里我们发现字符串由双引号（\")和单引号（'）界定。字符串边界符在前后必须匹配。由于此字符串中没有插值变量或双字节字符，任何类型的引号都可以，只要在字符串的两端使用同一种即可。\n\
    \n只处理 Perl 输出的第一个警告或错误消息；不要去读其他的，重新编译即可。\n\n"
- fmt: "\nError messages after the first one may be a cascade effect and therefore\
    \ may be eliminated by removing the cause of the first message. It's usually not\
    \ worth the time to analyze each message to determine whether this is the case.\n\
    \n### 8.1.5 Transposition\n\nRegular expressions provide a fertile breeding ground\
    \ for typos. Suppose you want to match and save the last string of letters preceded\
    \ by white space on a line:\n\n```\n/\\s([a-z])+$/i\n```\n\nLooks right, eh? Try\
    \ it on an example, though:\n\n```perl\nwhile (<DATA>)\n{\n  print \"Match = $1\\\
    n\" if /\\s([a-z])+$/i;\n}\n\n__END__\nThe boy stood on the burning duck\nWhat\
    \ comes out but\nMatch = k\n```\n\nOops. We wanted the last word, not the last\
    \ letter. Here's an approach to debugging this problem: We printed `$1`, which\
    \ is the text saved between parentheses. We can ignore whatever else the regex\
    \ contains and focus on what's between the parens, i.e., `[a-z]`, which we immediately\
    \ recognize as a character class that hasn't been qualified with a quantifier.\
    \ Therefore it can represent only one character, which is what we got. (When saving\
    \ parentheses match more than once in a regex because of a quantifier, only the\
    \ last match gets saved. One might wish for a switch that would return all the\
    \ matches in a list.) As with most typos, identifying it is 90% of the goal. The\
    \ fix is easy to predict: `/\\s([a-z]+)$/i`.\n\nHere's a higher-level sort of\
    \ transposition. Can you tell what it is before reading the explanation?\n\n```perl\n\
    #!/usr/bin/perl -w\nuse strict;\nmy $fmt = \"%10s \"x5;\nprintf \"$fmt\\n\", qw(Kelvin\
    \ Celsius Rankine Fahrenheit Reaumur);\n$fmt = \"%10.2f \"x5;\nfor (my $kelvin\
    \ = 0; $kelvin += 10; $kelvin < 500)\n{\n  my $celsius = $kelvin - 273.15;\n \
    \ my $rankine = $kelvin * 9 / 5;\n  my $fahrenheit = $rankine - 459.67;\n  my\
    \ $reaumur = $celsius * 4 / 5;\n  printf \"$fmt\\n\",$kelvin,$celsius,$rankine,$fahrenheit,\
    \ $reaumur;\n}\n```\n\nRun this, and it does not terminate! You will be calculating\
    \ temperatures beyond those experienced in the Big Bang. But the very first line\
    \ of output is `Useless use of numeric lt (<) in void context at temp.pl line\
    \ 13`. \n\nWeird. Line 13 is the `printf` statement, and it has no `<`. According\
    \ to Perl of Wisdom #24, we should start scanning backwards until we find one.\
    \ There it is at the beginning of the `for` statement: forgvivably, we transposed\
    \ the test and iterative clauses.\n\nIf you'd like to know why Perl fingered line\
    \ 13 and not line 7 (the `for` statement), you'll find an explanation in Chapter\
    \ 10.\n\n### 8.2 A Menagerie of Typos\n\n![Image 58](index-97_1.jpg)\n\nAt this\
    \ point, we're going to go on a tour of typo examples with different diagnoses.\n\
    \n#### 8.2.1 Quotable Quotes\n\nOur first program sets up a hash `%quotation`\
    \ indexed by author and then goes on: `while (my ($author, $quote) = each %quotation)\n\
    {\n  print 'Quote of the Day: \"$quote\" by $author\\n';\n}\n```\n\nThis runs,\
    \ but takes us too literally:\n\n`Quote of the Day: \"$quote\" by $author\\nQuote\
    \ of the Day: \"$quote\" by $author\\nQuote of the Day: \"$quote\" by $author\\\
    n...`\n\nAha! Nothing is being interpolated because we're using single quotes.\
    \ We change them to double quotes:\n\n```perl\n3 while (my ($author, $quote) =\
    \ each %quotation)\n4 {\n5 print \"Quote of the Day: \"$quote\" by $author\\n\"\
    ; 6 }\n```\n\nYikes, now we get three errors:\n\n`Scalar found where operator\
    \ expected at typo.pl line 4, near \"\"Quote of the Day: \"$quote\" (Missing operator\
    \ before $quote?)`\n`syntax error at typo.pl line 4, near \"\"Quote of the Day:\
    \ \"$quote\"`\n`String found where operator expected at typo.pl line 4, near \"\
    $quote\" by $author\\n\"\" (Missing operator before \" by $author\\n\"?)`\n`Execution\
    \ of typo.pl aborted due to compilation errors.`\n\nOnce again, we consider only\
    \ the first message. Whenever Perl provides a hint after the error, read it carefully.\
    \ Perl suggests that we omitted an operator before `$quote`, but why would it\
    \ expect an operator in the middle of a string? Aha—we must not be in a string\
    \ any more.\n\nAt this point I would have pointed out that the syntax coloring\
    \ feature of Emacs `cperl mode` would have shown this, but I promised Ed not to\
    \ make fractious text editor advertisements.\n\nAt least we don't have to look\
    \ far to find the problem; the string ended prematurely one character before `$quote`.\
    \ There is, of course, more than one way to fix it. We could escape the `\"` inside\
    \ the string with backslashes, or we could use the spiffy `qq` operator, which\
    \ allows us to pick any delimiter to use for a double-quoted string:\n\n```perl\n\
    while (my ($author, $quote) = each %quotation)\n{\n  print qq(Quote of the Day:\
    \ \"$quote\" by $author\\n);\n}\n```\n\n#### 8.2.2 A Capital Typo\n\nOur next\
    \ horror feature is The Program That Wouldn't Die:\n\n```perl\n#!/usr/bin/perl\n\
    use Getopt::Std;\nsub usage\n{\n  print \"Allowable options: -a, -c, -e, -n count,\
    \ -u\\n\";\n  Exit;\n}\nusage() unless getopts('acen:u');\nprint \"Starting program\
    \ $0\\n\";\n```\n\nLet's run it:\n\n`% typo.pl -q`\n`Unknown option: q`\n`Allowable\
    \ options: -a, -c, -e, -n count, -u`\n`Starting program typo.pl`\n\nWhy did this\
