  trans: '


    `error`（错误）与 `exception`（异常）之间的区别在本书中可能一直淡带过，但现在我们需要明确这一点。`error` 仅仅意味着出现了一些问题；例如，系统例程可能会返回一个值，表示它无法执行你要求的操作。一个良好的程序此时会建立一些错误处理并检查返回代码（稍后会详述）。但程序仍在运行。


    当某些代码声明发生了不可忍的情况时（用术语说是“抛出”，“thrown”），就会发生 `exception`。除非你明确知道如何处理（或“捕获”）该 `exception`，否则
    Perl 将不会允许你的程序继续运行。此时，你的程序可能正处于任意深度嵌套的子程序调用和 `{}` 块中间。它会在任何地方停止执行，并开始沿着堆栈向上回溯，检查每一层是否有声明可以捕获该异常的处理器。如果一直到顶层仍未找到这样的处理程序，它将执行默认异常处理程序，在
    Perl 中，这意味着使用 `die` 打印消息并退出。


    来自 Perl 的运行时异常可能是内置的、由 `use strict` 引起的，或者是由你生成的。`-w` 标志可能会导致显示运行时警告消息，但你的程序将继续执行。如果你遵循良好的编码实践，你应该担心这种可能性，因为这可能表明
    Perl 正在处理错误数据（本应该定义但未定义的数据）。如果你想确保 Perl 在生成此类警告时停止，可以在程序的开头附近放置此伪信号处理器：[2]


    [2] 这是 `warn` 和 `print STDERR` 之间区别变得显而易见的少数情况之一；前者被这种类信号处理器捕获，而后者不是。


    ```

    local $SIG{__WARN__} = sub { die $_[0] }

    ```


    并且 Perl 在打印警告后退出。


    ## 9.1 符号引用 (Symbolic References)


    既然你已经在所有程序中都加入了 `use strict`，让我们让我们来看看它可能生成的运行时异常类。其中一个例子就是使用符号引用。


    什么是符号引用（symbolic reference）？它是指一个标量包含一个命名另一个变量的字符串，而你尝试将该标量当作 `hard`（硬）引用来使用。如果你没有使用
    `strict` 或者选择性地禁用了 `use strict` 中防止该行为的组件，这是可以生效的。[3]


    [3] 你通过 `no strict ''refs''` 语句实现这一点。


    在 Perl 4 中，将变量名存储在另一个变量中是执行某些非常常见任务的唯一方法（并且要求你也使用 `eval`）。但自 Perl 5 引入硬引用以来，几乎没有你需要使用符号引用的情况。然而，可能有更多时候你*认为*自己需要它。所以，让我们检查其中一些情况。


    接下来的程序是一个假设的蔬菜店库存计数器，它读取由水果或蔬菜以及该物品购买和销售的箱数组成的数据，数据在换行时用空格分隔。[4]


    [4] 注意，我们违背了自己的的缩进风格，将 `if` 语句块每个放在了一行，并省略了它们唯一语句后的分号。这说明，有时如果打破规则能给你带来更高的可读性等优势，那么没必要做风格的奴隶。


    ```

    1 $fruit_cases_bought = 0;

    2 $fruit_cases_sold = 0;

    3 $vegetables_cases_bought = 0;

    4 $vegetables_cases_sold = 0;

    5 %vegetable = map { ($_, 1) } qw(carrots broccoli

    6 kale spinach leeks);

    7 %fruit = map { ($_, 1) } qw(apples kumquats

    8 pears bananas kiwis);

    9 while (<DATA>)

    10 {

    11 ($food, $cases_bought, $cases_sold) = split;

    12 if (exists $vegetable{$food}) { $type = ''vegetable'' }

    13 elsif (exists $fruit{$food}) { $type = ''fruit'' }

    14 else { warn "I don''t know the food type $food\n" }

    15

    16 if (defined $type)

    17 {

    18 ${$type.''_cases_bought''} += $cases_bought;

    19 ${$type.''_cases_sold''} += $cases_sold;

    20 }

    21 }

    22

    23 print $vegetable_cases_bought - $vegetable_cases_sold,

    24 " cases of vegetables on hand\n";

    25

    26 print $fruit_cases_bought - $fruit_cases_sold,

    27 " cases of fruit on hand\n";

    ```


    这种代码对于一个程序员来说非常常见，他们乐于识别出不同水果和蔬菜变量集的相同性质，并将其用法抽象到某种程度，以至于可以使用相同的代码进行求和。然而，符号引用并不是必要的：它们不仅破坏了
    `use strict`，而且不作用于作用域变量（lexical variables），这也就是为什么这个程序没有任何 `my` 关键字。嗯，这不符合“Perl
    智慧第 8 条”，所以我们应该寻找一种不使用动态变量的方法编写这个程序。


    我们不需要远远寻找。每当你想要创建并行变量集时，请改用哈希表，其键为变量名中发生变化的部分。这里是新程序：


    ```

    1 my $cases_bought = (fruit => 0, vegetables => 0);

    2 my $cases_sold = (fruit => 0, vegetables => 0);

    3 my %vegetable = map { ($_, 1) } qw(carrots broccoli

    4 kale spinach leeks);

    5 my %fruit = map { ($_, 1) } qw(apples kumquats

    6 kiwis);

    7 while (<>)

    8 {

    9 my ($food, $bought, $sold) = split;

    10 my $type;

    11

    12 if (exists $vegetable{$food}) { $type = ''vegetables'' }

    13 elsif (exists $fruit{$food}) { $type = ''fruit'' }

    14 else { warn "I don''t know the food type $food\n" }

    15

    16 if (defined $type)

    17 {

    18 $cases_bought->{$type} += $bought;

    19 $cases_sold->{$type} += $sold;

    20 }

    21 }

    22

    23 foreach my $type (qw(fruit vegetables))

    24 {

    25 print $cases_bought->{$type} - $cases_sold->{$type},

    26 " cases on hand\n";

    27 }

    ```


    现在，如果你觉得第一个例子应该使用哈希表，请注意掉入这个陷阱比你想象的要容易，尤其是当你有一堆可以类似处理的差异变量时。**不要在程序的不同地方输入相同的文本并依赖于保持同步。**
    或者至少，我们希望在发生此类拼写错误时代码拒绝运行。[5]


    [5] 得益于 `-w`，当我们打印一个不存在的项时，它会在第 26 行生成警告。


    Perl 5 提供了一种新的数据类型——*伪哈希*（pseudo-hash），我们可以用它来实现这一点。在下面的列表中，结构上似乎没有变化。但如果你犯了我们刚刚讨论的拼写错误，Perl
    不会运行，而是会输出错误：No such array field at grerocer.pl line 16, <> chunk 1，即使我们在第 11
    和 21 行以相同的方式拼错了 vegetables。


    ```

    1 my $cases_bought = [{vegetables => 1, fruit => 2}, 0, 0];

    2 my $cases_sold = [{vegetables => 1, fruit => 2}, 0, 0];

    3 my %vegetable = map { ($_, 1) } qw(carrots broccoli

    4 kale spinach leeks);

    5 my %fruit = map { ($_, 1) } qw(apples kumquats

    6 kiwis);

    7 while (<>)

    8 {

    9 my ($food, $bought, $sold) = split;

    10 my $type;

    11

    12 if (exists $vegetable{$food}) { $type = ''vegetables'' }

    13 elsif (exists $fruit{$food}) { $type = ''fruit'' }

    14 else { warn "I don''t know the food type $food\n" }

    15

    16 if (defined $type)

    17 {

    18 $cases_bought->{$type} += $bought;

    19 $cases_sold->{$type} += $sold;

    20 }

    21 }

    22 foreach my $type (qw(fruit vegetables))

    23 {

    24 print $cases_bought->{$type} - $cases_sold->{$type},

    25 " cases on hand\n";

    26 }

    ```


    '
- fmt: "\nA pseudo-hash bears some explanation, since it's so new.[6] If the first\
    \ element of an array is a reference to a hash, the other elements of that array\
    \ can be accessed not just by their indices, but by using a reference to the array\
    \ as though it were a hash reference whose keys were taken from that first element.\
    \ The hash referenced by the first element must map the keys you wish to use to\
    \ the indices of the values in the array. This is much easier to understand with\
    \ an example:\n\n[6] As of perl version `5.005_03`. It is not only new, it's experimental,\
    \ so check the documentation for any version of Perl later than `5.6.0` that you\
    \ have to see if it's still in there. It appears from the latest discussions that\
    \ it is unlikely to survive to Perl 6; however, being able to create hashes whose\
    \ keys are fixed is so useful that the capability to do this is likely to persist\
    \ in some form.\n\n```\n$sound = [ { dog => 1, cat => 2, bird => 3},\n'bark',\
    \ 'meow', 'tweet' ];\n```\n\nYou must ensure that the numbers that are the values\
    \ in the anonymous hash correspond to the positions of the corresponding values,\
    \ but now you can say `$sound->{dog}` to yield 'bark'. You could also get at it\
    \ with `$sound->[1]`, but that's missing the point of a pseudo-hash. What you\
    \ can't do is put a new key in the pseudo-hash in this fashion: `$sound->{frog}\
    \ = 'ribbit';` because that will generate an error (putting a new key in the pseudo-hash\
    \ is possible but harder than that). But if your application doesn't require inserting\
    \ new keys at run time, this feature of the pseudo-hash will ensure that you are\
    \ instantly alerted if you mistype a key.\n\nBecause pseudo-hashes have an uncertain\
    \ future, we won't make a Perl of Wisdom out of them just yet. Evaluate the benefits\
    \ of using them on a case-by-case basis. We have been making a more general point\
    \ here that *is* worth a Perl of Wisdom: **Force as many errors as possible to\
    \ occur at compile time rather than at run time.**\n\nThis little program can\
    \ be bulletproofed even further. It still requires the repetition of the keys\
    \ `vegetables` and `fruit` in the pseudo-hashes and input recognition loop. If\
    \ we could bind them together somehow, we'd have less of a chance of coming up\
    \ with a compile-time error.\n\nEnter our latest revision. Here we've done some\
    \ more radical surgery. You'll notice that we've removed the need to refer to\
    \ the hash keys while going around the input loop by creating the single hash\
    \ `%food_type` to map from an inventory item to a vegetable or fruit.\n\n```\n\
    1 use fields;\n2 $_ = fields::phash(vegetables => 0, fruit => 0)\n3 for my ($cases_bought,\
    \ my $cases_sold);\n4 my %food_type = (map ({ ($_, 'vegetables') }\n5 qw(carrots\
    \ broccoli kale spinach leeks)), 6 map { ($_, 'fruit') }\n7 qw(apples kumquats\
    \ pears bananas kiwis)\n8 );\n9 while (<>)\n10 {\n11 my ($food, $bought, $sold)\
    \ = split;\n12 if (my $type = $food_type{$food})\n13 {\n14 $cases_bought->{$type}\
    \ += $bought;\n15 $cases_sold->{$type} += $sold; 16 }\n17 else\n18 {\n19 warn\
    \ \"I don't know the food type $food\\n\"; 20 }\n21 }\n22\n23 foreach my $type\
    \ (keys %$cases_bought)\n24 {\n25 print $cases_bought->{$type} - $cases_sold->{$type},\
    \ 26 \" cases of $type on hand\\n\";\n27 }\n```\n\nWe used a function `new` to\
    \ Perl `5.6.0`, `fields::phash`, which takes the sting out of creating pseudo-hashes,\
    \ and at the same time avoids the repetition we had on the first two lines of\
    \ our previous version. If pseudo-hashes are retained in later versions of Perl\
    \ but their implementation alters, `fields::phash` will be changed to hide that\
    \ implementation change from you. When we want to iterate over the different food\
    \ types to print our report, we just use the keys of a pseudo-hash (which means\
    \ we no longer get to pick the order, unless we sort the keys).\n\n### 9.2 Check\
    \ That Return Code!\n\nThe Perl built-in functions that might fail return a special\
    \ value to alert you that they have done so. Usually, this value is false. (Functions\
    \ that call out to the operating system to do their work will put the type of\
    \ error in the `$!` variable.) This allows a number of common colloquialisms for\
    \ checking and handling it, the most famous of which is the open-or-die idiom:\n\
    \n```perl\nopen DICT, '/usr/dict/words'\nor die \"I'm at a loss for words: $!\"\
    ;\n```\n\nThis being Perl, there are many other ways of expressing the same thing.\
    \ Pick one that works for you:\n\n```perl\nif (mkdir $tmpdir, 0755)\n{\n  copy\
    \ $dbfile, \"$tmpdir/$dbfile.$$\"\n}\nelse\n{\n  die \"Couldn't create $tmpdir\
    \ because $!\";\n}\n\ndie \"Can't chdir to $subdir: $!\" unless chdir $subdir;\
    \ \nprint chmod (0644, @files) ? \"Success!\" : \"Failure: $!\";\n```\n\n![Image\
    \ 61](index-106_1.jpg)\n\nYou're not required to stick to one idiom, mind you.\
    \ You have to be fanatical about checking return codes if you want to write quality\
    \ programs. For instance, in the preceding example, the `copy` function from `File::Copy`\
    \ also returns true or false and sets `$!` on failure.\n\nSome functions return\
    \ something besides true/false for example, `chmod`, `chown`, and `unlink` each\
    \ take a list of files to operate upon, return the number of files actually modified,\
    \ and if there were any errors set `$!` to the last one. **Know your operating\
    \ system.**\n\nA student in one of my classes encountered the following. The assignment\
    \ was to create temporary directory and a bunch of files in it, perform some operations\
    \ on them, and then remove the files and the directory. Part of his code looked\
    \ like this:\n\n```perl\nforeach $file (@files)\n{\n  open OUT,\">$file\" or die\
    \ \"Can't open $file: $!\";\n  # write something to the file\n}\ndie \"Unlink\
    \ didn't get everything: $!\" unless unlink @files == @files;\nchdir '..' or die\
    \ \"Couldn't go up a level: $!\";\nrmdir $tmpdir or die \"Couldn't rmdir $tmpdir:\
    \ $!\";\n```\n\nThe problem was that he had omitted the `close` statement from\
    \ the loop that created the files. Whenever Perl encounters an `open` statement\
    \ using an existing filehandle, it closes that filehandle for you, so all but\
    \ the last file had already been closed. On Unix, if any process has a file open,\
    \ it is not removed by `unlink` until the file is closed, so the last file had\
    \ not been removed at the time `rmdir` was executed.\n\nBut then the program exited,\
    \ which meant all its open filehandles were closed; at that point the file was\
    \ removed, destroying the evidence. Other operating systems may handle this case\
    \ differently. Because Perl uses the underlying operating system, you must be\
    \ familiar with the quirks and gotchas that apply there too.\n\n### 9.3 Taking\
    \ Exception to Yourself\n\nHaving discussed how we handle exceptions generated\
    \ by Perl, it's time to talk about how we make exceptions of our own. You're already\
    \ used to the most basic exception-generating method, which is to call `die`.\
    \ The arguments are printed, and your program exits with a nonzero return code.\
    \ (Just *which* nonzero return code is documented in gory detail under perldoc\
    \ -f die.)\n\nYou may see some additional text output by `die`, such as the line\
    \ number of code it died on.\n"
  raw: 'A pseudo-hash bears some explanation, since it''s so new.[6] If the first
    element of an array is a reference to a hash, the other elements of that array
    can be accessed not just by their indices, but by using a reference to the array
    as though it were a hash reference whose keys were taken from that first element.
    The hash referenced by the first element must map the


    keys you wish to use to the indices of the values in the array. This is much easier
    to understand with an example:


    [6] As of perl version 5.005_03\. It is not only new, it''s experimental, so check
    the documentation for any version of Perl later than 5.6.0 that you have to see
    if it''s still in there. It appears from the latest discussions that it is unlikely
    to survive to Perl 6; however, being able to create hashes whose keys are fixed
    is so useful that the capability to do this is likely to persist in some form.


    $sound = [ { dog => 1, cat => 2, bird => 3},


    ''bark'', ''meow'', ''tweet'' ];


    You must ensure that the numbers that are the values in the anonymous hash correspond
    to the positions of the corresponding values, but now you can say $sound->{dog}
    to yield


    ''bark''. You could also get at it with $sound->[1], but that''s missing the point
    of a pseudo-hash. What you *can''t* do is put a new key in the pseudo-hash in
    this fashion: $sound->{frog} = ''ribbit'';


    because that will generate an error (putting a new key in the pseudo-hash is possible
    but harder than that). But if your application doesn''t require inserting new
    keys at run time, this feature of the pseudo-hash will ensure that you are instantly
    alerted if you mistype a key.


    Because pseudo-hashes have an uncertain future, we won''t make a Perl of Wisdom
    out of them just yet. Evaluate the benefits of using them on a case-by-case basis.
    We have been making a more general point here that *is* worth a Perl of Wisdom:
    **Force as many errors as possible to occur at compile time rather than at run
    time.**


    This little program can be bulletproofed even further. It still requires the repetition
    of the keys vegetables and fruit in the pseudo-hashes and input recognition loop.
    If we could bind them together somehow, we''d have less of a chance of coming
    up with a compile-time error.


    Enter our latest revision. Here we''ve done some more radical surgery. You''ll
    notice that we''ve removed the need to refer to the hash keys while going around
    the input loop by creating the single hash %food_type to map from an inventory
    item to a vegetable or fruit.


    1 use fields;


    2 $_ = fields::phash(vegetables => 0, fruit => 0)


    3 for my ($cases_bought, my $cases_sold);


    4 my %food_type = (map ({ ($_, ''vegetables'') }


    5 qw(carrots broccoli kale spinach leeks)), 6 map { ($_, ''fruit'') }


    7 qw(apples kumquats pears bananas kiwis)


    8 );


    9 while (<>)


    10 {


    11 my ($food, $bought, $sold) = split;


    12 if (my $type = $food_type{$food})


    13 {


    14 $cases_bought->{$type} += $bought;


    15 $cases_sold->{$type} += $sold; 16 }


    17 else


    18 {


    19 warn "I don''t know the food type $food\n"; 20 }


    21 }


    22


    23 foreach my $type (keys %$cases_bought)


    24 {


    25 print $cases_bought->{$type} - $cases_sold->{$type}, 26 " cases of $type on
    hand\n";


    27 }


    We used a function new to Perl 5.6.0, fields::phash, which takes the sting out
    of creating pseudo-hashes, and at the same time avoids the repetition we had on
    the first two lines of our previous version. If pseudo-hashes are retained in
    later versions of Perl but their implementation alters, fields::phash will be
    changed to hide that implementation change from you. When we want to iterate over
    the different food types to print our report, we just use the keys of a pseudo-hash
    (which means we no longer get to pick the order, unless we sort the keys).


    **9.2 Check That Return Code!**


    The Perl built-in functions that might fail return a special value to alert you
    that they have done so. Usually, this value is false. (Functions that call out
    to the operating system to do their work will put the type of error in the $!
    variable.) This allows a number of common colloquialisms for checking and handling
    it, the most famous of which is the open-or-die idiom:


    open DICT, ''/usr/dict/words''


    or die "I''m at a loss for words: $!";


    This being Perl, there are many other ways of expressing the same thing. Pick
    one that works for you:


    if (mkdir $tmpdir, 0755)


    {


    copy $dbfile, "$tmpdir/$dbfile.$$"


    }


    else


    {


    die "Couldn''t create $tmpdir because $!";


    }


    die "Can''t chdir to $subdir: $!" unless chdir $subdir; print chmod (0644, @files)
    ? "Success!" : "Failure: $!";


    ![Image 61](index-106_1.jpg)


    You''re not required to stick to only one idiom, mind you. It''s common for people
    to choose different ones according to the way they think about the operation they''re
    expressing.


    You have to be fanatical about checking return codes if you want to write quality
    programs.


    For instance, in the first example in the preceding list, the copy function from
    File::Copy also returns true or false and sets $! on failure. It would be a strange
    sort of program that wouldn''t have a reason to ensure that this had happened.


    Some functions return something besides true/false but still set $!, for example,
    chmod, chown, and unlink each take a list of files to operate upon, return the
    number of files actually modified, and if there were any errors, set $! to the
    last one. (Unfortunately it''s not possible to tell which file(s) had problems
    without checking manually afterwards.) **Know your operating system.**


    A student in one of my classes encountered the following. The assignment was to
    create a temporary directory and a bunch of files in it, perform some operations
    on them, and then to remove the files and the directory. Part of his code looked
    something like this:


    foreach my $file (@files)


    {


    open OUT,">$file" or die "Can''t open $file: $!\n";


    # write something to the file


    }


    # Open the files in the directory and do


    something


    # with the contents


    die "Unlink didn''t get everything: $!\n" unless


    unlink @files == @files;


    chdir ''..'' or die "Couldn''t go up a level: $!\n";


    rmdir $tmpdir or die "Couldn''t rmdir $tmpdir:


    $!\n";


    Every return code dutifully checked, but the rmdir failed, and $! said,


    "Directory not empty." Yet when he looked in the directory, there were no files
    there. What was going wrong?


    The problem was that he had omitted the close statement from the loop that created
    the files. Whenever Perl encounters an open statement using an existing filehandle,
    it closes that filehandle for you, so all but the last file had already been closed.
    On Unix, if any process has a file open, it is not removed by unlink until the
    file is closed, so the last file in


    @files had not been removed at the time the rmdir was executed.


    But then the program exited, which meant that all its open filehandles were closed;
    at that point the file was removed, destroying the evidence.


    Other operating systems may handle this case differently. Because Perl uses the
    underlying operating system, you must be familiar with the quirks and gotchas
    that apply there too.


    In case you think it unlikely you''d write a program that created files and then
    removed them in the same invocation, think about temporary storage or checkpoint/restart
    capability.


    **9.3 Taking Exception to Yourself**


    Having discussed how we handle exceptions generated by Perl, it''s time to talk
    about how we make exceptions of our own. You''re already used to the most basic
    exception-generating method, which is to call die. The arguments are printed,
    and your program exits with a nonzero return code. (Just *which* nonzero return
    code is documented in gory detail under perldoc -f die.)


    You may see some additional text output by die, such as the line number of code
    it died on.'
