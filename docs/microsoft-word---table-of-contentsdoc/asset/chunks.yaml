    $ **perl -cT foo.cgi**


    **13.6 Heading Off Errors**


    The output of your program is usually parsed through the Web server (unless you
    use the increasingly rare nph feature), which adds headers like a status line
    (unless you provide one yourself), a server identification line, and a date. The
