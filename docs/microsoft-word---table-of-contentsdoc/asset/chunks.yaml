- fmt: "\n# References on Apache:\n\n* *Apache: The Definitive Guide*, 2nd edition,\
    \ by Ben & Peter Laurie (O'Reilly, 1999)\n* [http://www.apache.org/](http://www.apache.org/)\n\
    \n## 13.3 500—Server Error\n\nThe primal ed editor for Unix has one and only one\
    \ response to any kind of error condition: it prints '?'.[1] Although user interface\
    \ design has generally matured from this minimalist approach since then, it took\
    \ a giant leap backwards with the introduction of Web servers whose only response\
    \ to virtually any error is something close to\n\n![Image 83](index-144_1.jpg)\n\
    \n[1] `ed` was written by Ken Thompson. It was suggested that his car sported\
    \ a single indicator on the dashboard: a giant '?' which would light up when anything\
    \ was wrong, and the experienced driver would usually know what it meant.\n\n\
    ### Internal Server Error\n\nThe server encountered an internal error or misconfiguration\
    \ and was unable to complete your request.\n\nIt usually goes on to suggest that\
    \ you look in the server error log, but unfortunately it doesn't go to the trouble\
    \ of including the part that might be relevant.\n\n**If at all possible, get an\
    \ interactive login on the Web server for which you are developing. If you can't,\
    \ consider using a different service.**\n\nThere are several reasons for this,\
    \ starting with the fact that it is a lot easier to look at the error log file\
    \ if we can look at it with programs like `tail` or `less` than if we have to\
    \ view the whole thing through a Web page. If you can't get an interactive login,\
    \ you may nevertheless be able to figure out where your Web server keeps its log\
    \ files (the defaults are well known and commonly used) and you then can use a\
    \ CGI program like the following to look at the last ten (say) lines:\n\n```perl\n\
    #!/usr/bin/perl -Tw\n\nuse strict;\nuse CGI qw(:standard);\n\nmy $TAIL = 10;\n\
    \nprint header, start_html;\n\nmy @lines;\n\n# Change next line as needed\nmy\
    \ $file = \"/usr/local/apache/logs/error_log\";\n\nopen (IN, $file) or die p(b(\"\
    Unable to open $file: $!\")); while (<IN>)\n{\n    push @lines, $_;\n    shift\
    \ @lines if @lines > $TAIL;\n}\n\nprint p(\"Total number of lines = $.\\nLast\
    \ $TAIL lines:\\n\"); close IN;\n\nprint pre(@lines), end_html;\n```\n\nLittle\
    \ tools like this populate the black bag carried by CGI programmers from job to\
    \ job. In fact, if you can't even get Perl working on a (Unix) site that you can't\
    \ log in to, here's a Bourne shell version:\n\n```sh\n#!/usr/bin/sh\n\nLOG=/var/log/httpd/error_log\n\
    TAIL=10\n\necho \"Content-type: text/plain\"\necho\n\necho \"Total number of lines\
    \ = 'wc -l $LOG'\"\necho\n\ntail -$TAIL $LOG\n```\n\n## 13.4 Basics\n\nTo avoid\
    \ those \"Doh!\" moments, make sure that:\n\n* Your program has the execute bit\
    \ set on Unix systems. The penalty for missing this one is a 403 Forbidden error,\
    \ which is likely to make you think that the Web server can't get into the enclosing\
    \ directory instead.\n* Your program has the correct `#!` line at the beginning.\
    \ Getting it wrong will earn you a 500 Server Error.\n\nBoth of these problems\
    \ are instantly detected by running the program from the command line on the Web\
    \ server itself. If that works but you still get an error when coming through\
    \ a Web browser, the permissions for the Web server user are set up incorrectly;\
    \ contact the Web server administrator.\n\n## 13.5 Security\n\nNot long ago, security\
    \ was still considered optional by many people. Today that attitude is widely\
    \ recognized as dangerous to others as well as oneself. The issue of security\
    \ on the Internet has garnered universal attention, and one of the ways a host\
    \ can be broken into is through a poorly written CGI program.\n\nDon't let yours\
    \ be one of them.\n\n### 13.5.1 Taint mode\n\nPerl provides a powerful mechanism\
    \ for securing your CGI programs. It's called *taint mode,* and no program you\
    \ put on the Web should be without it. You invoke it with the `-T` flag, making\
    \ the first line of your scripts\n\n```perl\n#!/usr/bin/perl -wT\n```\n\n(Of course,\
    \ the path to your perl may differ.)\n\nTaint mode doesn't actually do anything\
    \ by itself to secure your program. What it does is force you to address every\
    \ place where a security hole could occur. You see, the chief cause of security\
    \ holes in CGI programs is malicious user inputs being used to affect things outside\
    \ of your program. If you've never seen how easy this is, you're in for a shock.\n\
    \nLet's say that your e-commerce Web site contains a feedback form for a user\
    \ to input their email address and a message of praise. Unfortunately, let's say\
    \ that your shipping department sent a customer a Barbie doll instead of the Sony\
    \ PlayStation he ordered, and rather than praise, this soon-to-be-former customer\
    \ has a different message for you. In the e-mail address field, he types `rm *`.\
    \ Your script, after reading the user input into a variable `$email`, reasonably\
    \ enough sends a response:\n\n```perl\nopen MAIL, \"|$SENDMAIL $email\" or die\
    \ $!;\n```\n\n(We'll talk about better ways of signaling errors shortly.) Net\
    \ result: Chaos. If you're running on DOS instead, don't think you're safe; that\
    \ user could have entered `; erase *.*`. What you need to do is check the e-mail\
    \ address that's been entered and make sure it won't cause that kind of problem.\
    \ Now, suppose we assume for a moment that valid e-mail addresses match the pattern\n\
    \n`\\w[\\w*%.:-]*@\\w[\\w.-]*\\w`\n\n(That's not quite true, but it'll do for\
    \ our example.) After setting `$email` from the user input, we could massage it:\n\
    \n```perl\n($email) = $email =~ /(\\w[\\w*%.:-]*@\\w[\\w.-]*\\w)/;\n\nunless ($email)\n\
    {\n    # Code to handle no valid email being entered\n}\n```\n\nFrom the user's\
    \ input, we extracted an e-mail address that won't cause any nasty side effects\
    \ when passed to our mail program. If we don't find anything in the input matching\
    \ that, we can treat it as if nothing at all was entered.\n\nYou might also choose\
    \ to compare the result of the match with what they entered, and if they differ,\
    \ grumble about a \"nonstandard\" address being entered. Before you use that language,\
    \ however, consider this caveat: the preceding pattern is a grossly simplified\
    \ version of what it really takes to match a valid e-mail address. The RFC 822\
    \ standard [(http://www.ietf.org/rfc0822.txt](http://www.ietf.org/rfc0822.txt))\
    \ specifies a complicated syntax that includes several ways of embedding comments\
    \ that are arguably not part of the address and unlikely to be entered by a user.\
    \ A regular expression to match it is more than 6K in length and is the *tour\
    \ de force* conclusion of Jeffrey Friedl's seminal book, *Mastering Regular Expressions*\
    \ (O'Reilly, 1997). A slighly shorter and somewhat practical approach is contained\
    \ in Chapter 9 of the second edition of *CGI Programming with Perl* by Scott Guelich,\
    \ Shishir Gundavaram, and Gunther Birznieks (O'Reilly, 2000), but even this book\
    \ acknowledges that its algorithm's value is principally. (It doesn't confirm\
    \ that the address can receive e-mail; only an attempt to send mail there can\
    \ do that.) What taint mode does is force you to launder input data as we just\
    \ described. Any data that comes from outside your program—including even environment\
    \ variables or directory listings—has associated with it a special flag that marks\
    \ it as *tainted.* Any attempt to use tainted data to affect something outside\
    \ of your program—such as input to an external program—results in a run-time exception\
    \ before that can happen. (The error will mention an \"insecure dependency.\"\
    ) And if you use a tainted variable in an expression that is assigned to another\
    \ variable, that variable becomes tainted too.\n\n![Image 84](index-147_1.jpg)\n\
    \nThe *only* way to derive untainted data from tainted data is to perform a regular\
    \ expression match with capturing parentheses on it and use the resulting `$1,\
    \ $2, etc. It is assumed that if you have gone to this much trouble, you have\
    \ constructed a regular expression that will result in safe data. Perl *does not—*\
    \ and *cannot—* check that you have really done so. If you simply do\n\n```perl\n\
    ($untainted) = $tainted =~ /(.*)/s;\n```\n"
