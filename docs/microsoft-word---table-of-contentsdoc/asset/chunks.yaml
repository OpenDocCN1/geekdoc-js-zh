- fmt: '

    Talking about resources for improving your expertise leads us to our last touchy-feely
    concept: behaviors. If you have the right attitude and a good set of beliefs,
    you need to follow up with right behaviors, or, if you prefer, "good habits."
    Check these out.


    ### 2.3.1 Neatness


    Sloppy organization leads to a sloppy mindset, which leads to sloppy code. Never
    mind how tidy your office is; do you have a bunch of files called `foo`, `tmp`,
    `fred`, `latest`, `latest2`, and so on lying around? Get rid of them or archive
    them somewhere with meaningful labels. Do you follow a consistent indentation
    style? If not, copy the style of a good programmer whose code you like until you
    feel like tweaking it for personal taste. Just be consistent!


    ### 2.3.2 Communication


    How sure are you of the requirements for the program you''re writing? Have you
    checked with the customer what they mean by the various terms they used? Have
    you explained to them what assumptions you made in interpreting their requirements?


    ### 2.3.3 Experimentation


    Time and time again, people ask, "What would happen if I did X?" when they could
    actually try it in less time than it would take to get the answer (which might
    be wrong). Don''t spend ages trying to second-guess the machine; find out. If
    there were a fourth virtue in the Perl canon, it would be `curiosity`. If you''re
    not eager to find out what would happen in some odd situation cooked up by your
    fertile mind, then cultivate the attitude of curiosity, because people who have
    it will move along the learning curve much faster than those who don''t.


    The way to feel comfortable experimenting is to know your boundaries. Many people
    are afraid of breaking the machine or destroying data. So learn which sorts of
    actions could do that, and which are safe. Find the safest playground you can.
    If you have a PC with some spare disk space, you can create extra partitions just
    for a special version of your favorite operating system if you''re afraid of hurting
    something important. A tool like `Partition Magic` will make this process easy.
    Then take something that works, and intentionally break it.


    Explore all the ways it can go wrong. If you''ve created a "throwaway" `Linux`
    on its own partitions, find out just how hard it is to damage it. After enough
    of this kind of play, you''ll have a good idea of what you can get away with and
    be much less anxious when you''re debugging in a real environment.


    Curiosity is an essential quality of the people who develop Perl and who spend
    inordinate amounts of time trying out the strangest pieces of code you''ve ever
    seen, all in an attempt to explore the boundaries of Perl, and maybe to break
    it.


    ### 2.3.4 Precision


    Perl works hard to accommodate different ways of thinking and different styles
    of programming. This *laissez faire* acceptance does not mean there aren''t rigorous
    definitions of the terminology of Perl itself, though. To communicate accurately
    with others and keep things straight in your own mind, learn the proper terms
    for everything you use and be ruthless about keeping them straight. For instance,
    there is a huge difference between lists


    ![Image 17](index-22_1.jpg)


    and arrays in Perl: make sure you know what it is.[[1]When you say "system call,"
    do you mean a call that uses the operating system or a `system()` call? When you
    say "local variables," are you referring to private variables declared with `my`
    or temporary copies of package variables declared with `our` or `local`?


    [1] See "What is the difference between a list and an array?" in `perlfaq4`.


    ### 2.4 Improve Your Craft


    If you love what you''re doing, improving your skills comes naturally. If you
    don''t, doing it better is an uphill battle. (Do you really need to do it if you
    don''t like it?) The avenues for getting better at what you do are numerous. Any
    time you feel that you''ve conquered the mountain, you might check out the Software
    Engineering Institute''s Capability Maturity Model for software development (`SW-CMM`),[2]
    which delineates five levels that development groups may achieve in order of increasing
    effectiveness. Few groups have ever been certified at level 5\. Something to aim
    for.


    [2] [http://www.sei.cmu.edu/cmm/cmm.html](http://www.sei.cmu.edu/cmm/cmm.html)


    ### 2.5 The Bottom Line


    If you''ve got good attitudes and beliefs, the right behaviors are easy to learn—they''re
    mostly details. So in the next chapter, we''ll get back to the left-brain mode
    of programming details and discuss useful behaviors.


    # Chapter 3. Antibugging


    "It is a capital mistake to theorize before one has data. Insensibly one begins
    to twist facts to suit theories instead of theories to suit facts."


    — *Sherlock Holmes in* A Scandal in Bohemia, *by Sir Arthur Conan Doyle*


    ![Image 18](index-23_1.jpg)


    ![Image 19](index-23_2.jpg)


    As you can tell from the chapter title, we''re not above coining horrible neologisms
    to save space. (When our publisher pays us by the word, we''ll be happy to be
    more verbose, but paying us by the word would be as sensible as measuring programmers''
    performance by how many lines of code they write.)


    *Antibugging* describes a set of programming techniques that minimize the probability
    of introducing a bug to a program at design time or input. You could also call
    it *defensive programming.* We''re applying the principles we developed in the
    previous chapter to come up with some good Perl development behaviors.


    ### 3.1 Beginning


    Before you turn your ideas into code, describe them in natural language.


    **If you can''t say it in natural language, you won''t be able to say it in Perl.**


    The Extreme Programming methodology (mentioned in more detail in Chapter 6) is
    helpful in this respect in by insisting that tests be written before the code
    they test, and requiring programming in pairs, it encourages this kind of conversation.


    I''ve seen this too many times: someone is having horrible difficulties doing
    an exercise and the code is bleeding all over the screen. Yet when I ask them
    to describe how it''s supposed to work, they can''t articulate it.


    This is a large clue that the approach wasn''t completely thought out to begin
    with.


    ### 3.2 Writing Code


    Your code should be as pleasing to the eye as possible, if for no other reason
    than you should like looking at it and not recoil at the prospect of again diving
    into an eructation of characters on the screen. And let''s face it, programs need
    all the aesthetic help they can get because their primary purpose is utilitarian.
    Which of the following subroutines do you prefer?


    ```

    sub iterate (&$$){


    for ($_[1] = 0,my $i = 0;$i <= $_[2];


    $_[1] = ++$i/$_[2]){&{$0] };


    }


    }

    ```


    or


    ```

    sub iterate (&$$)


    {


    for ($_[1] = 0, my $i = 0;


    $i <= $_[2];


    $_[1] = ++$i / $_[2])


    ![Image 20](index-24_1.jpg)


    ![Image 21](index-24_2.jpg)


    ![Image 22](index-24_3.jpg)


    {


    &{$_[0]};


    }


    }

    ```


    ### 3.2.1 Style


    The only believable comment to make about style is that you should have one. If
    you aren''t already rabidly attached to a particular style, read the `perlstyle`
    manual page and adopt the one shown.


    There''s no excuse for not indenting properly. I have seen many people in my classes
    struggling with an exercise, needlessly handicapped because their code was all
    hugging the left margin for grim death. Regardless of how quick, short, or temporary
    your code is, indenting it will save more time than it costs. (The Emacs `cperl`
    mode will autoindent simply by hitting the TAB key.)


    **Use a consistent style for each project.**


    A clean style is a good style, whatever style you choose. A suggestion: write
    your code as though you expect it to be published (and win the Turing Award)—using
    white space galore and ample comments.

