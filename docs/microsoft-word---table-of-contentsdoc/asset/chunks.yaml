    谈到提升专业知识的资源，让我们进入了最后一个感性的概念：行为。如果你有正确的态度和良好的信念，你就需要配合正确的行为，或者，如果你更倾向于这种说法，就是养成“良好的习惯”。来看看这些内容吧。


    ### 2.3.1 整洁


    混乱的组织会导致凌乱的心态，进而导致混乱的代码。别管你的办公室有多整洁；你是否有一堆名为 `foo`、`tmp`、`fred`、`latest`、`latest2`
    等的文件散落在到处？把它们删掉，或者归档到某个有意义的标签的地方。你遵循一致的缩进风格吗？如果没有，就复制一个你喜欢的程序员的代码风格，直到你觉得可以根据个人喜味进行微调为止。只需保持一致即可！


    ### 2.3.2 沟通


    你对正在编写的程序的需求有多几大把握？你是否向客户确认过他们使用的各种术语具体是什么意思？你是否向他们解释了你在解读他们的需求时所做的哪些假设？


    ### 2.3.3 实验


    人们一次又一次地问：“如果我做了 X 会发生什么？”，而实际上他们尝试一下所需的时间可能比得到答案的时间还要短（而且那个答案可能是错误的）。不要花大量时间去猜机器的反应；去弄清楚。如果
    Perl 典籍中还有第四种美德，那将是`好奇心`。如果你不急于发现在你那活跃的大脑构思的某些奇怪情况下会发生什么，那么请培养好奇心的态度，因为拥有好奇心的人在学习曲线上的移动会比没有的人快得多。


    感到可以放心实验的方法是知道自己的边界。许多人害怕弄机器或破坏数据。因此，学习哪些操作可能会导致这些，哪些是安全的。找到你能找到的最安全的游乐场。如果你有一台有空闲磁盘空间的
    PC，如果你担心弄坏重要的东西，可以为你最喜欢的操作系统的特殊版本创建额外的分区。像 `Partition Magic` 这样的工具会让这个过程变得简单。然后拿一个可以正常工作的东西，故意去弄坏它。


    探索它可能出错的所有方式。如果你在自己的分区上创建了一个“随用随弃”的 `Linux`，去弄清楚损坏它有多难。在经过足够的这类尝试后，你就会很清楚哪些操作是可以的，而且在真实环境中调试时会少很多焦虑。


    好奇心是开发 Perl 的人员以及那些花费大量时间尝试你见过的最奇异代码的人的必备特质，这一切都是为了探索 Perl 的边界，也许是为了弄坏它。


    ### 2.3.4 精确


    Perl 努力适应不同的思维方式和编程风格。然而，这种*随遇而安*（laissez faire）的接受并不意味着 Perl 本身的术语没有严谨的定义。为了与他人准确交流并保持脑海中思路清晰，请学习你使用的每个事物的正确术语，并严格区分它们。例如，Perl
    中的列表（lists）和数组（arrays）之间有巨大的区别：


    ![Image 17](img/index-22_1.jpg)


    确保你知道它们分别是什么。[[1]] 当你说“系统调用”时，你是指使用操作系统的调用还是 `system()` 调用？当你说“局部变量”时，是指用 `my`
    声明的私有变量，还是用 `our` 或 `local` 声明的包变量的临时？


    [1] 参见 `perlfaq4` 中的“列表和数组有什么区别？”


    ### 2.4 提高你的手艺


    如果你热爱你所做的事情，提高技能是自然而然的。如果你不喜欢，做得更好是一场艰苦的战斗。（如果你不喜欢，你真的需要做它吗？）提升业务水平的途径是很多。每当你觉得已经征服了那座山时，你可以查看软件工程研究所的软件开发能力成熟模型（`SW-CMM`）[2]，它描绘了开发小组可以实现的五个等级，按有效性递增。很少有获得过
    5 级认证。这是一个可以的目标。


    [2] [`www.sei.cmu.edu/cmm/cmm.html`](http://www.sei.cmu.edu/cmm/cmm.html)


    ### 2.5 总结


    如果你有良好的态度和信念，正确的行为很容易学习——它们大多是细节。因此在下一章中，我们将回到编程细节的左脑模式，讨论实用的行为。


    # 第 3 章 反 Bug（Antibugging）


    “在没有数据之前就建立理论是一个致命的错误。人们会不自觉地开始扭曲事实来迎合理论，而不是让理论来迎合事实。”


    —— *阿瑟·柯南·道尔爵士，《波希米亚恋人》中的洛拉克·福尔摩*


    ![Image 18](img/index-23_1.jpg)


    ![Image 19](img/index-23_2.jpg)


    从章节标题可以看出，我们不惜为了节省空间而创造出可怕的新词。（当我们的出版社按字数付我们钱时，我们会乐意更啰嗦一些，但按字数付钱就像通过代码行数来衡量程序员的表现一样愚蠢。）


    *反 Bug*（Antibugging）描述了一组编程技术，这些技术旨在设计设计或输入时减少向程序引入 bug 的概率。你也可以称之为*防御性编程*。我们正在应用在前一章中开发的原则，提出一些良好的
    Perl 开发行为。


    ### 3.1 开始


    在将你的想法转化为代码之前，先用自然语言描述它们。**如果你不能用自然语言表述，你就无法用 Perl 表述它们。**


    极捷开发方法（在第 6 章中详细介绍）在这方面很有帮助，它坚持在编写代码前编写测试，并要求结对编程，这促进了这种交流。我见过太多次这样的情况：某人在练习时遇到极大困难，是因为他们的代码在屏幕上到处都是。当我问他们代码是如何工作的时，他们无法解释清楚。


    这说明方法从一开始就没有经过充分思考。


    ### 3.2 写代码


    你的代码在视觉上应该越好看越好，即使仅仅是为了让你在看它时感到愉悦而不是退缩。你更倾向于以下哪一个子程序？


    ```

    sub iterate (&$$){


    for ($_[1] = 0,my $i = 0;$i <= _[2];


    $_[1] = ++$i/$_[2]){&{$0] };


    }


    }

    ```


    或者


    ```

    sub iterate (&$$)


    {


    for ($_[1] = 0, my $i = 0;


    $i <= _[2]);


    $_[1] = ++$i / $_[2])


    ![Image 20](img/index-24_1.jpg)


    ![Image 21](img/index-24_2.jpg)


    ![Image 22](img/index-24_3.jpg)


    {


    &{$0]};


    }


    }

    ```


    ### 3.2.1 风格


    关于风格唯一可靠的评论就是你应该拥有一种风格。如果你还没有固执地迷恋某种风格，请阅读 `perlstyle` 手页并采用所示的风格。


    不进行正确的缩进是没有借口的。我在课程中见过许多人在练习时挣扎，完全是因为他们的代码紧贴着左边距，处在等死。（Emacs 的 `cperl` 模式只需按下
    TAB 键即可自动缩进。）


    **每个项目使用一致的风格。**


    无论你选择什么风格，整洁的风格都是好的风格。建议：编写代码时就像预期它会被出版（并获得图灵奖）一样——使用大量的留白和充足注释。

    '
- fmt: '

    Pick clear variable names. In general, the less often a variable appears in your
    code (or the smaller its scope), the longer its name should be since the reader
    will need more reminding of its purpose. There''s nothing wrong though, with single-letter
    variable names for loop variables (for which they have a long and distinguished
    history) or mathematical or scientific quantities. (`$e=$m*$c**2` makes just as
    much sense as `$energy=$mass*$speed_of_light**2`; at least, it does to anyone
    who should be using code that computes it.)


    ### 3.2.2 Help from Your Editor


    For those of concerned about going blind counting and matching `()`, `{}`, and
    `[]` symbols in your programs, there are tools that can save you from the white
    cane. A smart editor that can help with some of the routine chores of beautifying
    a Perl program works wonders. If you have to reindent your code manually every
    time you remove an outer block, chances are you won''t do it. Perl gurus are fond
    of stating, "Only perl can parse Perl," and as a corollary, no editor can be smart
    enough to lay out all possible Perl programs correctly.


    Fair enough; but some of them come close enough to be useful.


    One of Peter''s favorites is `cperl`, a Perl mode for Emacs maintained by Ilya
    Zakharevich.


    The standard Perl distribution includes an `emacs` directory that contains the
    file `cperl-mode.el`. If your Emacs doesn''t already come with `cperl`, copy this
    file to wherever you store local Emacs mode files (you can set up a location just
    for yourself in the `.emacs` file in your home directory); if you find another
    version there, determine which `cperl-mode.el` is more recent. Insert the line


    ```perl

    (autoload ''perl-mode" "cperl-mode" "alternate mode for editing Perl programs"
    t)

    ```


    into your `.emacs` file to enable `cperl-mode` instead of the regular `perl-mode`
    that comes with Emacs.


    `cperl` matches up the various `()`, `[]`, and `{}` for you.[1] It also performs
    syntax coloring, so if you configure Emacs to tint all strings in `puce` and your
    entire file suddenly blushes, you know you''ve left a quote mark out somewhere.
    Most usefully, it tracks nested levels of braces, and a tap of the `TAB` key takes
    you to the correct indentation point for the line. This catches all manner of
    typos, such as the dropped semicolon on line 1:


    ```perl

    1 my $marsupial = ''wombat''

    2 my $crustacean = ''king crab'';

    ```


    which is exposed when you hit `TAB` on line 2 and instead of lining up under line
    1, the statement indents an extra level because the current statement is incomplete.


    `cperl` does have a few problems, though: if you use the Perl 4 syntax for separating
    path components in a package qualified identifier with a single quote, it may
    get confused. But just change the apostrophe (`''`) to colons (`::`), and you''re
    fine. Using certain characters (like `#` or `''`) in character classes in regular
    expressions confuses it too, but putting backslashes (`\`) in front of them (`*backwhacking*`)
    resolves the problem.


    Other editors we like are: `vim/gvim`, which does an outstanding job of syntax
    coloring and has an excellent Windows port; and `BBEdit` on the Macintosh.


    The subject of favorite editors is an intensely religious issue in software development,
    and you should expect others to disagree with your preference; as long as there
    are some equally heavyweight developers on your side, it doesn''t matter what
    you pick or what anyone else says.


    What should you expect from a good Perl editor? It should warn you when you have
    mismatched delimiters, it should automatically indent according to the style you
    want, and it should be as flexible and adaptable to your personal text-editing
    needs as possible. It neither insert characters (e.g., invisible binary formatting
    hints) nor remove any (e.g., trailing spaces) on its own without warning you and
    giving you the option to disable this functionality selectively or globally.


    ### 3.2.3 Think Double


    Whether your editor warns you of mismatched delimiters or not, here''s a handy
    tip: enter the closing delimiter at the same time you type the opening one. Then
    insert what you need between them. Work from the outside in, and your chances
    of having a grouping typo are greatly reduced. For instance, if you plan to write
    something that''ll end up as: `print table(map { Tr(map td($_), split /[:\s]+/)
    } <IN>);` (which, using `CGI.pm`, would print an HTML table from the remaining
    text coming from the filehandle `IN`, one row per line, forming table elements
    from elements separated by white space and/or colons) then your strategy for typing
    it would follow these steps:


    1. `print table();`

    2. `print table(map {} <>);`

    3. `print table(map { Tr() } <IN>);`

    4. `print table(map { Tr(map td(), split //) <IN>);`

    5. `print table(map { Tr(map td($_), split /[:\s]+/) } <IN>);`


    ### 3.2.4 Clarity


    Examine this very simple one-line program:


    ```perl

    $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n";

    ```


    This isn''t difficult to understand: initialize `$x` and `$y`, set `$z` to their
    sum, then print all three.


    Suppose we trace its execution through the debugger (see Chapter 7 for a detailed
    discussion of the debugger).


    ```bash

    % perl -de ''$x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"''

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n" DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n" DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n" DB<1> **n**

    1+2=3

    Debugged program terminated...

    DB<1> **q**

    ```


    What did we observe? The debugger prints the one-line program: `main::(-e:1):
    $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"` 1+2=3 4 times until the expected program
    output 1+2=3 Why? The debugger displays the next line of code perl executes. Recast
    the program to one command per line:


    ```perl

    $x = 1;

    $y = 2;

    $z = $x+$y;

    print"$x+$y=$z\n";

    ```


    Then use the debugger. You can either put the lines in a file or use a shell like
    the Bourne shell that allows you to type new lines between single quotes.


    ```bash

    % perl -d dbformat.pl

    ```


    How does this "making things up" show up? Let''s say someone is running a program
    containing the following code for sending a report back to them: `open MAIL, "|$SENDMAIL
    $address"`


    ...among other things; it also allows Emacs to function as a front end to the
    perl debugger. Debugging with Emacs is discussed in Chapter 7.


    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1>

    '
