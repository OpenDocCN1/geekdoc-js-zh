    just to return multivalued data. Because Perl does reference-counting garbage
    collection, you can return variables from the subroutine in which they are created
    and know that they won''t be trampled on, yet their storage will be released later
    when they''re no longer in use. And because Perl doesn''t have strong typing of
    scalars, you can fill a hierarchical data structure


