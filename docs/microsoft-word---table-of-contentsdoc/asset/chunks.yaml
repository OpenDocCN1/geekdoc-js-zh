- fmt: "\n![](cover.jpeg)\n\n![Image 1](index-1_1.jpg)\n\n# Perl Debugged\n\nBy Peter\
    \ Scott, Ed Wright\nPublisher : Addison Wesley\nPub Date : March 01, 2001\nISBN\
    \ : 0-201-70054-9\n\n## Table of Contents\nPages : 288\n\n\"This book was a joy\
    \ to read. It covered all sorts of techniques for debugging, including 'defensive'\
    \ paradigms that will eliminate bugs in the first place. As coach of the USA Programming\
    \ Team, I find the most difficult thing to teach is debugging. This is the first\
    \ text I've even heard of that attacks the problem. It does a fine job. Please\
    \ encourage these guys to write more.\" -**Rob Kolstad** \n\n`Perl Debugged` provides\
    \ the expertise and solutions developers require for coding better, faster, and\
    \ more reliably in Perl. Focusing on debugging, the most vexing aspect of programming\
    \ in Perl, this example-rich reference and how-to guide minimizes development,\
    \ troubleshooting, and maintenance time resulting in the creation of elegant and\
    \ error-free Perl code.\n\nDesigned for the novice to intermediate software developer,\
    \ `Perl Debugged` will save the programmer time and frustration in debugging Perl\
    \ programs.\n\nBased on the authors' extensive experience with the language, this\
    \ book guides developers through the entire programming process, tackling the\
    \ benefits, plights, and pitfalls of Perl programming. Beginning with a guided\
    \ tour of the Perl documentation, the book progresses to debugging, testing, and\
    \ performance issues, and also devotes a chapter to CGI programming in Perl. Throughout\
    \ the book, the authors espouse defensible paradigms for improving the accuracy\
    \ and performance of Perl code. In addition, `Perl Debugged` includes Scott and\
    \ Wright's \"Perls of Wisdom\" which summarize key ideas from each of the chapters,\
    \ and an appendix containing a comprehensive listing of Perl debugger commands.\n\
    \nIn this exceptional reference and debugging guide, the authors cover every aspect\
    \ of efficient Perl programming, including:\n\n- CGI programming-special tips\
    \ for debugging this type of Perl program\n- How to develop the proper mindset\
    \ for developing and programming effectively in Perl\n- Perl \"gotchas\"-how to\
    \ understand them, work around them, and avoid them\n- \"Antibugging\"-the authors'\
    \ rules of thumb on how to code defensively\n- The Perl debugger -the authors'\
    \ guide to using this Perl built-in Common syntax errors and how to track down\
    \ their causes\n- Semantical errors-why code may appear correct but the programs\
    \ do not work\n- How to improve the performance of resource-hungry programs\n\
    - Tips and advice for programmers moving to Perl from other language environments\n\
    \n![Image 2](index-2_1.jpg)\n\nFocusing on the process of Perl programming and\
    \ guidelines for identifying and correcting mistakes, Perl Debugged helps the\
    \ developer to write better Perl programs immediately and become better programmers\
    \ in general.\n\n## Preface\n\n\"It fills my head with ideas, only I don't really\
    \ know what they are.\"\n— Alice in in Through the Looking-Glass and What Alice\
    \ Found There **Perlness**\n\nIn the world of languages, the country of Perl is\
    \ the great melting pot which welcomes all cultures, religions, and beliefs. \"\
    Give me your tired, your poorly-supported programmers, your huddled masses yearning\
    \ to be free of artificial limitations,\" says Perl, and those who land on its\
    \ shores find an environment where they are no longer hampered by a language designer's\
    \ whimsical notions of elegant semantics and stifling syntactical purity.\n\n\
    Perl's universal availability and ease-of-use make it the most democratic programming\
    \ language. Unlike many other languages, a relative beginner can write useful\
    \ programs, whereas effective programmers in other languages normally need to\
    \ spend a lot longer to learn syntax, operators, and functions. A Perl programmer\
    \ may possess such expertise, or may be a newcomer who modified some example script\
    \ to perform a new function.\n\nBut the newcomer has another problem: lack of\
    \ debugging skills. Experience forces the canny to develop an innate knack for\
    \ debugging due to years of accumulated pain. We want to minimize that pain, because\
    \ we have suffered it. Perl's ease of use allows programmers with little knowledge\
    \ to create usable, if fragile, code. The amount of time it takes to debug a Perl\
    \ program can vary dramatically from person to person. Our goal is to help you\
    \ minimize the development, debugging, and maintenance time you need for your\
    \ own Perl programs.\n\nDo not take the title of this book to imply we are debugging\
    \ Perl itself in these pages. What few bugs exist in the Perl interpreter are\
    \ a matter of minute exotica (or exotic minutiae), rapidly squashed by the fine\
    \ volunteer crew supporting Perl. A more accurate title would have been `Debugging\
    \ Your Perl Programs`, but that felt too pedestrian and loses the \"unplugged\"\
    \ pun.\n\nWe wrote this book because we wanted you to see the development process\
    \ at work. Most books on programming contain carefully crafted examples honed\
    \ through sweaty practice to work perfectly and stand as mute testimonial to the\
    \ elegant style of the author. They don't show you the ugly, irritating process\
    \ it took to get the examples into shape; yet those examples did not in fact spring\
    \ into existence fully formed from the forehead of their creator.\n\nBecause you\
    \ will experience this same process when developing your programs, we want to\
    \ guide you through it and describe various ways around the embarrassment, humiliation,\
    \ and surprising pitfalls that stand between you and Great Programming.\n\nWithin\
    \ this book, we describe the most common and annoying mistakes a new Perl programmer\
    \ might make, and then detail the procedures to identify and correct those bugs\
    \ and any others. You should have *some* knowledge of Perl; several fine tutorials\
    \ exist to free us from the onerous responsibility of explaining scalars and arrays\
    \ and hashes and the like.\n\nThis preface includes a few references to some of\
    \ the most useful of these tutorials.\n\nWe will not attempt to define or describe\
    \ a proper programming \"style.\" Style is as unique as an individual—but a few\
    \ general rules create a common reference so that we can easily read each other's\
    \ programs.\n\nNeither is this a \"how to program\" book. Although we will probe\
    \ into the mechanics and underpinnings of the general principle of programming\
    \ at times, it is not our intention to inculcate a complete newcomer with the\
    \ mindset of the programmer's discipline.\n\n### Who Are You?\nIf you've been\
    \ programming in Perl anywhere from a week to a year and want to speed up your\
    \ development cycle, this book is for you. We'll also address some issues related\
    \ to developing in a team. This book is intended to assist those who have started\
    \ learning Perl by providing practical advice on development practices.\n\n###\
    \ What This Book Covers\nHere's what you'll find in the rest of this book:\n\n\
    - **Chapter 1:** Introduction and a guided tour of the Perl documentation\n- **Chapter\
    \ 2:** Developing the right mindset for programming and developing effectively\n\
    - **Chapter 3:** \"Gotchas\" in Perl: Working your way around some of the tricky\
    \ things to understand or get right in Perl programming\n- **Chapter 4:** Antibugging:\
    \ How to code defensively\n- **Chapter 5:** How to instrument your code\n- **Chapter\
    \ 6:** How to test your Perl programs\n- **Chapter 7:** A tour of the perl debugger:\
    \ our guide to using this built-in tool\n- **Chapter 8:** Types of syntax error\
    \ and how to track down their causes\n- **Chapter 9:** Run-time errors\n- **Chapter\
    \ 10:** Semantical errors: When your program appears to work but doesn't do the\
    \ right thing\n- **Chapter 11:** How to improve the performance of a resource-hungry\
    \ (memory, CPU cycles, and so on) program\n- **Chapter 12:** Tips and pitfalls\
    \ for people coming to Perl from other languages\n- **Chapter 13:** Common Gateway\
    \ Interface (CGI) programming: special tips for debugging this type of Perl program\n\
    - **Chapter 14:** Conclusion\n- **Appendix A:** Reference for the Perl debugger\
    \ commands\n"
