    \n当你遇到这些情况之一时，通常会知道该做什么。\n\n### 3.6.2 宽容地对待警告\n\n始终使用 `-w` 选项运行你的程序以启用警告。其中一些警告是在编译时产生的（例如，在同一作用域内声明已经声明过的\
    \ `my` 变量——你可能认为这足以让 `use strict` 失败，但 `perl` 在这方面奇地仁慈），而另一些是在运行时产生的，因为无法更早地检测到。（例如，警告你使用了未初始化或以其他方式获取了哨兵值\
    \ `undef` 的变量值。[10] `Perl` 高兴地在数值上下文中为该变量分配默认值 `0`，在字符串上下文中分配 `\"\"`，但很可能，你在那个点读取未定义的变量对来说是一个错误。）[11]\n\
    \n[10] 另一个例外：如果你对未定义变量进行的操作是 `++`，则不会发生警告。如果你查看某些这样使用 `++` 的代码，就会明白为什么这很有用。\n\n\
    [11] 如果你的变量在程序的该时间点可以合法地获取 `undef` 值，那么请使用 `defined` 操作符对其进行测试。\n\n现在，对于是否在运行中或交付的代码中保留\
    \ `-w` 标志，意见在某种程度上分歧。支持者认为，既然你设计程序使其在 `-w` 下不产生任何警告（称为 `\"-w clean\"`），那么如果它真的生成了警告，那就是错误，并且应该以这种错误的形式显示出来。反对者反驳说，即使你消除了这些可能性，有一天你的程序触发的新警告可能会被添加到\
    \ `Perl` 中，你不希望客户敏感的神经被 `Perl` 有时不合寻常的言论所冒犯。此外，有时警告可以发送到某种输出过滤器（如一个\n\n![](img/index-35_1.jpg)\n\
    \n![](img/index-35_2.jpg)\n\nWeb 服务器——我们将在第 13 章展示如何处理 CGI 程序中的错误）并产生混淆。\n\n我们在矛盾中徘徊，最终倒向了支持者的一边。编写得最好的代码也可能以我们从未预料的方式出错，[12]，而最好的工具是那些能够捕获各种错误并将其像抽绳式猫砂盆内衬一样打包给维护人员的工具。\n\
    \n在生产环境代码中找到重定向警告的方法，以便信息被保存但不必一定暴露给用户，因为如果你今天所做的某些事情在以后版本的 `Perl` 中生成了警告，它可能会导致后续\
    \ `Perl` 版本的故障。\n\n[12] *Peter:* 我曾写过一个程序，在 24/7 的实时环境中成功运行了九*年*后才遇到一个 bug。\n\n\
    `Perl 5.6.0` 增加了一个极大扩展了 `-w` 功能的功能：作用域警告。\n\n`perldoc perllexwarn` 告诉你可以如何插入 `use\
    \ warnings` 编译指令的变体，以便在作用域范围内选择性地启用和禁用类警告。由于该功能不支持 `5.6.0` 之前的版本，而且这本书并不关注对警告的精细控制，我们坚持使用\
    \ `-w` 语法。\n\n**在所有程序中使用 -w 和 use strict。**\n\n有时 `perl` 感谢 `-w` 吐出的单行信息过于简洁，一眼无法看懂。你可以通过查找\
    \ `perldiag` 手页找到对该消息更详细的解释，或者你可以在程序中插入 `use diagnostics;` 行，这会导致更详细的解释随单行信息一起打印。\n\
    \n**使用 use diagnostics 来解释错误信息。**\n\n修改你的程序或浏览 `perldiag` 的替代方案是使用随 `perl` 分发的\
    \ `splain` 程序。只需将你的程序的输出通过 `splain` 过滤，它就会为每个错误信息附加更详细的解释，就像使用了 `diagnostics`\
    \ 一样。\n\n### 3.7 减少复杂性的技巧\n\n“复杂性是敌人，我们的目标是杀死它。”\n*Jan Baan*\n\nPerl 的优势之一是它的表达能力和极度的简洁性。复杂性是软件开发的祸根：当程序增长到某种程度时，它变得更难以测试、维护、阅读或扩展。任何可以减少程序复杂性的操作都会带来丰厚的回报。程序的复杂性是以下因素的函数：\n\
    - 不同标记的数量\n- 字符的数量\n- 控制传递到不同点的分支数量\n- 在任何范围内不同的程序对象数量\n\n语言允许你修改代码以减少这些因素，你就能减少复杂性。\n\
    \n#### 3.7.1 丢弃临时变量\n\n临时变量是复杂性的典型。任何语言在你和解决方案之间的干扰都会降低解决方案的能力。所有语言在某种程度上都是如此；Perl\
    \ 例外。[13 在大多数语言中，交换变量 `a` 和 `b` 使用以下算法：\n\n```c\n[13] 我们想要说“少于剩余”\n声明一个与 a 和 b\
    \ 类型相同的 temp\ntemp = a;\na = b;\nb = temp;\n```\n\n但大多数语言不是 Perl：\n\n```perl\n\
    ($b, $a) = ($a, $b);\n```\n\n遍历数组通常需要一个索引变量和数组中存储的元素计数：\n\n```c\nint i;\nfor (i\
    \ = 0; i < count_lines; i++)\n{\nstrcat (line[i], suffix);\n}\n```\n\n而在 Perl\
    \ 中，你有从 shell 借来的 `foreach` 结构：\n\n`foreach my $line (@lines) { $line .= $suffix\
    \ }`\n\n如果你觉得必须写 `foreach` 而不是简单的 `for` 很有遗憾，那么你好运了，因为它们是彼此的同义词；所以如果你想，尽管写 `for`（Perl\
    \ 可以看出是指哪一个）。\n\n因为函数可以返回列表，你不再需要构建特殊的结构来返回多值数据。因为 Perl 执行引用计数垃圾回收，你可以从创建它们的子程序返回变量，并知道它们不会被践踏，但在它们不再被使用时其存储会被释放。由于\
    \ Perl 对标量没有强类型，你可以用异构值填充分级数据结构，而不需要构造联合数据类型和某种类型描述符。\n\n![](img/index-37_1.jpg)\n\
    \n带有异构值。\n\n"
- fmt: "\nBecause built-in functions take lists of arguments where it makes sense\
    \ to do that, you can pass them the results of other functions without having\
    \ to construct an iterative loop:\n\n```\nunlink grep /~$/, readdir DIR;\n```\n\
    \nAnd the `map` function lets you form a new list from an old one with no unnecessary\
    \ temporary variables:\n\n```perl\nopen PASSWD, '/etc/passwd' or die \"passwd:\
    \ $!\\n\";\n\nmy @usernames = map /^([^:]+)/, <PASSWD>;\n\nclose PASSWD;\n```\n\
    \nBecause Perl's arrays grow and shrink automatically and there are simple operators\
    \ for inserting, modifying, or deleting array elements, you don't need to build\
    \ linked lists and worry if you've got the traversal termination conditions right.\
    \ And because Perl has the hash data type, you can quickly locate a particular\
    \ chunk of information by key or find out whether a member of a set exists.\n\n\
    ### 3.7.2 Scope Out the Problem\n\nOf course, sometimes temporary variables are\
    \ unavoidable. Whenever you create one though, be sure and do it in the innermost\
    \ scope possible (in other words, within the most deeply nested set of braces\
    \ containing all references to the variable).\n\n**Create variables in the innermost\
    \ scope possible.**\n\nFor example, let's say somewhere in my program I am traversing\
    \ my Netscape history file and want to save the URLs visited in the last 10 days\
    \ in `@URLs`:\n\n```perl\nuse Netscape::History;\n\nmy $history = new Netscape::History;\n\
    \nmy (@URLs, $url);\n\nwhile (defined($url = $history->next_url() ))\n{\n    push\
    \ @URLs, $url if\ntime - $url->last_visit_time < 10 * 24 * 3600;\n}\n```\n\nThis\
    \ looks quite reasonable on the face of it, but what if later on in our program\
    \ we create a variable called `$history` or `$url`? We'd get the message\n\n\"\
    my\" variable `$url` masks earlier declaration in same scope\n\nwhich would cause\
    \ us to search backward in the code to find exactly which one it's referring to.\
    \ Note the clause \"in same scope\"—if in the meantime you created a variable\
    \ `$url` at a different scope, well, that may be the one you find when searching\
    \ backward with a text editor, but it won't be the right one. You may have to\
    \ check your indentation level to see the scope level.\n\nThis process could be\
    \ time-consuming. And really, the problem is in the earlier code, which created\
    \ the variables `$history` or `$url` with far too wide a scope to begin with.\
    \ We can (as of perl 5.004) put the `my` declaration of `$url` right where it\
    \ is first used in the while statement and thereby limit its scope to the while\
    \ block. As for `$history`, we can wrap a bare block around all the code to limit\
    \ the scope of those variables:\n\n```perl\nuse Netscape::History;\n\nmy @URLs;\n\
    \n{\n    my $history = new Netscape::History;\n\n    while (defined(my $url =\
    \ $history->next_url() ))\n    {\n        push @URLs, $url\n        if time -\
    \ $url->last_visit_time < 10 * 24 * 3600;\n    }\n}\n```\n\nIf you want to create\
    \ a constant value to use in several places, use `constant.pm` to make sure it\
    \ can't be overwritten:\n\n```perl\n$PI = 3.1415926535897932384;\n\nuse constant\
    \ PI => 3.1415926535897932384;\n\nmy $volume = 4/3 * PI * $radius ** 3;\n\n$PI\
    \ = 3.0; # The 'Indiana maneuver' works!\n\nPI = 3.0; # But this does not\n```\n\
    \nIn response to the last statement, Perl returns the error message, \"Can't modify\
    \ constant item in scalar assignment.\"\n\n`constant.pm` creates a subroutine\
    \ of that name which returns the value you've assigned to it, so trying to overwrite\
    \ it is like trying to assign a value to a subroutine call. Although the absurdity\
    \ of that may sound like sufficient explanation for how use constant works, in\
    \ fact, the latest version of perl allows you to assign a value to a subroutine\
    \ call, provided the result of the subroutine is a place where you could store\
    \ the value. For example, the subroutine could return a scalar variable. The term\
    \ for this feature is *lvaluable subroutine.*\n\nBut since the results of the\
    \ subroutines created by `use constant` aren't lvalues, lvaluable subroutines\
    \ won't cause problems for them.\n\n## Chapter 4. Perl Pitfalls\n\n\"Is there\
    \ any point to which you would wish to draw my attention?\"\n\n\"To the curious\
    \ incident of the dog in the night-time.\"\n\n![Image 32](index-39_1.jpg)\n\n\"\
    The dog did nothing in the night-time.\"\n\n\"That was the curious incident, remarked\
    \ Sherlock Holmes.\"\n\n— *Talking with Inspector Gregory, in* *Silver Blaze*,\
    \ *by Sir Arthur Conan Doyle* We are not out to \"get\" Perl in this chapter.\
    \ Enumerating traps people can fall into when using Perl is like finding technical\
    \ errors in the movie *Apollo 13;* people do it because they can, whereas with\
    \ many other languages (or movies), the nits would be too numerous to be worth\
    \ attempting to pick. What we are going to do is cover some of the places where\
    \ a little more knowledge would help prevent common errors. You'll find more in\
    \ the core Perl documentation section `perltrap`.\n\n### 4.1 Syntactical Sugaring\n\
    \nPerl has an unjustified reputation as a write-only language. We suspect this\
    \ is because programmers who have never seen it before think they should be able\
    \ to understand what they should. But Perl provides many concise idioms and shortcuts\
    \ that make programs much shorter, and all you need is familiarity with.\n\n####\
    \ 4.1.1 The Variable That Wasn't There\n\nA frequent source of bafflement for\
    \ newcomers is the way Perl programs seem to be talking to:\n\n```perl\nwhile\
    \ (<STDIN>)\n{\n    chomp;\n    ![Image 33](index-40_1.jpg)\n    s/#.*//\n   \
    \ next unless /\\S/;\n}\n```\n\nWhat on earth is operated on? The answer is the\
    \ special variable `$_`, which is used mainly in its absence. There are plenty\
    \ of times you *do* have to type `$_`, since it is default variable for `chomp`,\
    \ `s///`, and `m//`, and also gets set to the input line. As a rule of thumb,\
    \ the number of implicit references to `$_` should make the explicit references\
    \ worthwhile; if you have too many explicit references to `$_`, then you should\
    \ probably make them explicit references to a variable with a useful name. Otherwise\
    \ you're increasing confusion without having saved enough typing to make it worth\
    \ it.\n\n**If you have many explicit references to the same instance of $_, use\
    \ a named variable instead.**\n\nThere are also times when it's feasible to use\
    \ `$_` but not worth the trouble. For instance, if you're nesting one loop that\
    \ uses `$_` as the loop variable around another, such as:\n\n```perl\nmy @list\
    \ = qw(alpha);\n\n$_ = \"aleph\";\n\nforeach (@list)\n{\n    while (<STDIN>)\n\
    \    {\n        # do something\n    }\n}\n```\n\nWhen the smoke clears from feeding\
    \ values to the loop reading lines from STDIN, what value will `$_` have? If you\
    \ answered \"aleph\", reasoning that `$_` should have been saved while you were\
    \ going around the loops, congratulations, you're right. But before you head off\
    \ to celebrate, take a look at the contents of `@list`. It still contains one\
    \ element, but its value is now undef instead of \"alpha\". Oops\n\nThe reason\
    \ is that the `foreach` loop *aliased* `$_` to each element of its list in turn.\
    \ Therefore anything done to `$_` would get done to that array element.[1] And\
    \ while the `foreach` loop saved (or *localized*) its loop variable of `$_`, the\
    \ `while` loop didn't. So when it read a line\n\n![Image 34](index-41_1.jpg)\n\
    \nfrom STDIN, it did so into the same `$_` in use by `foreach`, which overwrote\
    \ the array element.\n\n[1] Because it's writable. Trying to change an aliased\
    \ list element that isn't an lvalue triggers the error\n\n\"Modification of a\
    \ read-only value attempted.\"\n"
  raw: 'Because built-in functions take lists of arguments where it makes sense to
    do that, you can pass them the results of other functions without having to construct
    an iterative loop: unlink grep /~$/, readdir DIR;


    And the map function lets you form a new list from an old one with no unnecessary
    temporary variables:


    open PASSWD, ''/etc/passwd'' or die "passwd: $!\n";


    my @usernames = map /^([^:]+)/, <PASSWD>;


    close PASSWD;


    Because Perl''s arrays grow and shrink automatically and there are simple operators
    for inserting, modifying, or deleting array elements, you don''t need to build
    linked lists and worry if you''ve got the traversal termination conditions right.
    And because Perl has the hash data type, you can quickly locate a particular chunk
    of information by key or find out whether a member of a set exists.


    **3.7.2 Scope Out the Problem**


    Of course, sometimes temporary variables are unavoidable. Whenever you create
    one though, be sure and do it in the innermost scope possible (in other words,
    within the most deeply nested set of braces containing all references to the variable).


    **Create variables in the innermost scope possible.**


    For example, let''s say somewhere in my program I am traversing my Netscape history
    file and want to save the URLs visited in the last 10 days in @URLs: use Netscape::History;


    my $history = new Netscape::History;


    my (@URLs, $url);


    while (defined($url = $history->next_url() ))


    {


    push @URLs, $url if


    time - $url->last_visit_time < 10 * 24 * 3600;


    }


    This looks quite reasonable on the face of it, but what if later on in our program
    we create a variable called $history or $url? We''d get the message


    "my" variable $url masks earlier declaration in same scope


    which would cause us to search backward in the code to find exactly which one
    it''s referring to. Note the clause "in same scope"—if in the meantime you created
    a variable $url at a different scope, well, that may be the one you find when
    searching backward with a text editor, but it won''t be the right one. You may
    have to check your indentation level to see the scope level.


    This process could be time-consuming. And really, the problem is in the earlier
    code, which created the variables $history or $url with far too wide a scope to
    begin with. We can (as of perl 5.004) put the my declaration of $url right where
    it is first used in the while statement and thereby limit its scope to the while
    block. As for $history, we can wrap a bare block around all the code to limit
    the scope of those variables: use Netscape::History;


    my @URLs;


    {


    my $history = new Netscape::History;


    while (defined(my $url = $history->next_url() ))


    {


    push @URLs, $url


    if time - $url->last_visit_time < 10 * 24 * 3600;


    }


    }


    If you want to create a constant value to use in several places, use constant.pm
    to make sure it can''t be overwritten:


    $PI = 3.1415926535897932384;


    use constant PI => 3.1415926535897932384;


    my $volume = 4/3 * PI * $radius ** 3;


    $PI = 3.0; # The ''Indiana maneuver'' works!


    PI = 3.0; # But this does not


    In response to the last statement, Perl returns the error message, "Can''t modify
    constant item in scalar assignment."


    constant.pm creates a subroutine of that name which returns the value you''ve
    assigned to it, so trying to overwrite it is like trying to assign a value to
    a subroutine call. Although the absurdity of that may sound like sufficient explanation
    for how use constant works, in fact, the latest version of perl allows you to
    assign a value to a subroutine call, provided the result of the subroutine is
    a place where you could store the value. For example, the subroutine could return
    a scalar variable. The term for this feature is *lvaluable subroutine.*


    But since the results of the subroutines created by use constant aren''t lvalues,
    lvaluable subroutines won''t cause problems for them.


    **Chapter 4\. Perl Pitfalls**


    "Is there any point to which you would wish to draw my attention?"


    "To the curious incident of the dog in the night-time."


    ![Image 32](index-39_1.jpg)


    "The dog did nothing in the night-time."


    "That was the curious incident, remarked Sherlock Holmes."


    — *Talking with Inspector Gregory, in* Silver Blaze, *by Sir Arthur Conan Doyle*
    We are not out to "get" Perl in this chapter. Enumerating traps people can fall
    into when using Perl is like finding technical errors in the movie *Apollo 13;*
    people do it because they can, whereas with many other languages (or movies),
    the nits would be too numerous to be worth attempting to pick. What we are going
    to do is cover some of the places where a little more knowledge would help prevent
    common errors. You''ll find more in the core Perl documentation section perltrap.


    **4.1 Syntactical Sugaring**


    Perl has an unjustified reputation as a write-only language. We suspect this is
    because programmers who have never seen it before think they should be able to
    understand what''s going on the first time they lay eyes on a statement the way
    they could with a BASIC


    program. But Perl provides many concise idioms and syntactic shortcuts that make
    programs much shorter than they would have been, and all you need is enough familiarity
    with the idioms.


    **4.1.1 The Variable That Wasn''t There**


    A frequent source of bafflement for newcomers is the way that Perl programs seem
    to be talking to themselves:


    while (<STDIN>)


    {


    chomp;


    ![Image 33](index-40_1.jpg)


    s/#.*//;


    next unless /\S/;


    # ...


    }


    This apparently defies the usual paradigm of functions operating on variables.
    What on earth is being operated on?


    The answer is the special variable $_, which is used mainly in its absence. Because
    it is a default variable for the chomp, s///, and m// functions, and also gets
    set to the next input line when a readline operator (<>) is the only thing inside
    a while clause, that code fragment (which appears to be parsing some data format
    that can contain embedded comments) can do all kinds of things with and to $_
    without ever having to mention it.


    There are plenty of times you *do* have to type $_ , of course. If the previous
    code needed to add the current line to an array, it would go on to say push @commands,
    $_; since push doesn''t take a default second argument. As a rule of thumb, the
    number of implicit references to $_ should make the explicit references worthwhile;
    if you have too many explicit references to $_, then you should probably make
    them all explicit references to a variable with a useful name. Otherwise you''re
    increasing confusion without having saved enough typing to make it worth it.


    **If you have many explicit references to the same instance of $_, use** **a named
    variable instead.**


    There are also times when it''s feasible to use $_ but not worth the trouble.
    For instance, if you''re nesting one loop that uses $_ as the loop variable around
    another, such as: my @list = qw(alpha);


    $_ = "aleph";


    foreach (@list)


    {


    while (<STDIN>)


    {


    # do something


    }


    }


    When the smoke clears from feeding values to the loop reading lines from STDIN,
    what value will $_ have? If you answered "aleph", reasoning that $_ should have
    been saved while you were going around the loops, congratulations, you''re right.
    But before you head off to celebrate, take a look at the contents of @list. It
    still contains one element, but its value is now undef instead of "alpha". Oops.


    The reason is that the foreach loop *aliased* $_ to each element of its list in
    turn. Therefore anything done to $_ would get done to that array element.[1] And
    while the foreach loop saved (or *localized*) its loop variable of $_, the while
    loop didn''t. So when it read a line


    ![Image 34](index-41_1.jpg)


    from STDIN, it did so into the same $_ in use by foreach, which overwrote the
    array element.


    [1] Because it''s writable. Trying to change an aliased list element that isn''t
    an lvalue triggers the error


    "Modification of a read-only value attempted."'
