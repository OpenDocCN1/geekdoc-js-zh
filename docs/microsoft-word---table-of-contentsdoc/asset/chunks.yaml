  raw: 'The distinction between an *error* and an *exception* may have been hitherto
    glossed over in this book, but at this point we need to make it clear. An *error*
    simply means that something went wrong; for instance, a system routine may return
    a value indicating that it can''t do what you have asked. A good program institutes
    some error handling at this point and checks the return code (more on this later).
    But the program is still running.


    An *exception* occurs (is "thrown," in the lingo) when some code declares that
    something intolerable has happened and Perl is simply not going to allow your
    program to continue running unless you specifically know how to handle (or "catch")
    the exception. At this point, your program could be in the middle of some arbitrarily
    deep nesting of subroutine calls and


    {} blocks. It ceases executing wherever it is, and starts to percolate back up
    this stack looking at each level for anything declared that could catch this exception.
    If it gets all the way to the top without finding such a handler, it executes
    a default exception handler, which in Perl''s case means printing a message with
    die and exiting.


    Run-time exceptions from Perl may be built in, caused by use strict, or generated
    by you. The -w flag can cause a run-time warning message to be displayed, but
    your program will continue executing. If you''ve followed good coding practices,
    you should be worried about this possibility, since it may indicate that Perl
    is working with bad data (data that should be defined but isn''t). If you want
    to make sure Perl halts when such a warning is generated, you can put this pseudo
    signal handler near the beginning of your program:[2]


    [2] This is one of the few times where the difference between warn and print STDERR


    becomes apparent; the former is trapped by this sort-of signal handler, the latter
    is not.


    local $SIG{__WARN__} = sub { die $_[0] }


    and Perl exits after printing the warning.


    **9.1 Symbolic References**


    Now that you''re putting use strict in all of your programs, let''s look at the
    class of run-time exceptions it can generate. One instance is from the use of
    *symbolic references.*


    What''s a symbolic reference? It''s when a scalar contains a string that names
    another variable, and you attempt to use that scalar as though it were a *hard*
    reference. This works, if you''re not using strict or have selectively disabled
    the component of use strict that prevents it.[3]


    [3] You do this with the statement no strict ''refs''.


    Now, in Perl 4, storing the name of a variable inside another variable was the
    only way to carry out certain very common tasks (and required that you also use
    eval). But since the advent of hard references in Perl 5, there is almost no situation
    in which you will need to use a symbolic reference. However, there may be many
    more occasions when you *think* that you need to. So let''s examine some of those.


    The program that follows is a hypothetical greengrocer''s inventory counter that
    reads data consisting of a fruit or vegetable and the number of cases bought and
    sold of that item, separated by spaces on new lines.[4]


    [4] Notice that we defied our own indenting style to put the if statement blocks
    on one line each, and left out the semicolon after their sole statements. This
    just goes to show that sometimes there''s no need to be a slave to style if breaking
    the rules buys you an advantage like greater readability.


    1 $fruit_cases_bought = 0;


    2 $fruit_cases_sold = 0;


    3 $vegetables_cases_bought = 0;


    4 $vegetables_cases_sold = 0;


    5 %vegetable = map { ($_, 1) } qw(carrots broccoli


    6 kale spinach leeks);


    7 %fruit = map { ($_, 1) } qw(apples kumquats


    8 pears bananas kiwis);


    9 while (<DATA>)


    10 {


    11 ($food, $cases_bought, $cases_sold) = split;


    12 if (exists $vegetable{$food}) { $type = ''vegetable'' }


    13 elsif (exists $fruit{$food}) { $type = ''fruit'' }


    14 else { warn "I don''t know the food type $food\n" }


    15


    16 if (defined $type)


    17 {


    18 ${$type.''_cases_bought''} += $cases_bought;


    19 ${$type.''_cases_sold''} += $cases_sold;


    20 }


    21 }


    22


    23 print $vegetable_cases_bought - $vegetable_cases_sold,


    24 " cases of vegetables on hand\n";


    25


    26 print $fruit_cases_bought - $fruit_cases_sold,


    27 " cases of fruit on hand\n";


    This kind of code is very common from a programmer who is happy to have identified
    the identical nature of the different sets of fruit and vegetable variables and
    abstracted their use to a degree that they can be summed with the same code. However,
    the symbolic references are not necessary: not only do they break use strict,
    but they do not work with lexical variables, which is why this program doesn''t
    have any my keywords. Well, that doesn''t sit right with Perl of Wisdom #8, so
    we should look for a way to write this program without dynamic variables.


    We don''t have to look far. Whenever you are tempted to create parallel variable
    sets, use instead a hash whose keys are the portion of your variable names that
    changes. Here''s the new program:


    1 my %cases_bought = (fruit => 0, vegetables => 0);


    2 my %cases_sold = (fruit => 0, vegetables => 0);


    3 my %vegetable = map { ($_, 1) }


    4 qw(carrots broccoli kale spinach leeks);


    5 my %fruit = map { ($_, 1) }


    6 qw(apples kumquats pears bananas kiwis);


    7


    8 while (<>)


    9 {


    10 my ($food, $bought, $sold) = split;


    11 my $type;


    12


    13 if (exists $vegetable{$food}) { $type = ''vegetables'' }


    14 elsif (exists $fruit{$food}) { $type = ''fruit'' }


    15 else { warn "I don''t know the food type $food\n" }


    16


    17 if (defined $type)


    18 {


    19 $cases_bought{$type} += $bought;


    20 $cases_sold{$type} += $sold;


    21 }


    22 }


    23


    24 foreach my $type (qw(fruit vegetables))


    25 {


    26 print $cases_bought{$type} - $cases_sold{$type},


    27 " cases of $type on hand\n";


    28 }


    Now, if it looks obvious to you that this first example should be using a hash,
    be aware that it is easier to fall into this trap than you might think, especially
    when you have a large program with a bunch of hitherto disparate variables that
    you suddenly realize can be treated similarly.


    Is this the best way to code this program? Hardly. We are repeating keys explicitly
    in two places where a typo would cause a problem. If we mistyped the strings in
    the $type assignment or the foreach—and it would be a natural mistake to type
    vegetable


    instead of vegetables—the program would still run, but it would not produce correct
    output.[5]


    [5] It *would* generate a warning, courtesy of -w, in line 26 when we went to
    print a nonexistent hash entry, unless we were lucky enough to have mistyped vegetable
    in both places.


    **Don''t enter the same text in different places in a program and depend on having
    to** **keep them in sync.**


    Or at the very least, we would like the code to refuse to run if we *did* make
    such a typo.


    Perl 5.005 provides a new datatype—the *pseudo-hash*—which we can use here to
    accomplish that. In the following listing, it appears that little has changed
    structurally. But if you commit the typos we just discussed, instead of running,
    Perl instead spits out the error: No such array field at greengrocer.pl line 16,
    <> chunk 1


    even if we misspell vegetables in the same way on both line 11 and line 21.


    1 my $cases_bought = [{vegetables => 1, fruit => 2}, 0, 0]; 2 my $cases_sold =
    [{vegetables => 1, fruit => 2}, 0, 0]; 3 my %vegetable = map { ($_, 1) } qw(carrots
    broccoli


    4 kale spinach leeks);


    5 my %fruit = map { ($_, 1) } qw(apples kumquats


    6 pears bananas kiwis);


    7 while (<>)


    8 {


    9 my ($food, $bought, $sold) = split;


    10 my $type;


    11 if (exists $vegetable{$food}) { $type = ''vegetables'' }


    12 elsif (exists $fruit{$food}) { $type = ''fruit'' }


    13 else { warn "I don''t know the food type $food\n" }


    14 if (defined $type)


    15 {


    16 $cases_bought->{$type} += $bought;


    17 $cases_sold->{$type} += $sold;


    18 }


    19 }


    20


    21 foreach my $type (qw(fruit vegetables))


    22 {


    23 print $cases_bought->{$type} - $cases_sold->{$type}, 24 " cases of $type on
    hand\n";


    25 }'
