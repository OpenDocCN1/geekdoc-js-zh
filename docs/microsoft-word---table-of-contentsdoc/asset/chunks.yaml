    ## 7.2.9 与调试器的程序化交互


    你可以在程序中编写代码，以强制在特定点调用调试器。例如，假设你正在逐行处理一个长输入文件，并希望在到达某特定行时开始追踪。你可以设置条件断点，但你也可以通过创建“启用调试器”行来扩展你输入的语义。考虑以下代码：


    ```perl

    while (<INPUT>)

    {

    $DB::trace = 1, next if /debug/;

    $DB::trace = 0, next if /nodebug/;

    # 更多代码

    }

    ```


    在调试器下运行时，这会在循环遇到包含 "debug" 的输入行时启用追踪，并在读到包含 "nodebug" 的行时停止追踪。你甚至可以通过将变量 `$DB::single`
    设置为 `1` 来强制调试器产生断点，这恰好提供了一种可以在 `BEGIN` 块中调试代码的方法（通常情况下，这些块在控制权交给调试器之前就会执行）。


    ## 7.2.10 优化


    尽管 Perl 调试器在运行时会显示代码行，但重要的是，这些并不是实际执行的内容。Perl 内部执行的是其编译后的操作码树（opcode tree），这并不总是与你输入的代码行对应，这是由于编译和优化的过程导致的。你过去对
    C 代码使用交互式调试器时……


    ## 7.2.11 另一个“坑”


    如果你将一个词法变量设置为块的最后一个语句，那么在块退出后无法查看它的值。代码为什么要这样做？用一个词来说：*闭包*（closures）。例如：


    ```perl

    { # 开始一个闭包块

    my $spam_type; # 此词法变量生命周期比块长

    sub type_spam

    {

    # ...

    $spam_type = $complex_func();

    }

    }

    ```


    在这种情况下，`type_spam` 或闭包中的其他子程序有理由看到最后。但如果你在调试器中单步执行，在语句执行后，调试器会跳到一个 `$spam_type`
    不在作用范围范围。不幸的是，在这种情况下，如果函数的结果没有被调用者使用，你就没办法。


