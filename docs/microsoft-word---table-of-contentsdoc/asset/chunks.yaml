    `$ENV{PATH}`，这通常意味着将其显式地设置为你信任的目录列表（用冒号 `:` 或分号 `;` 分隔）。


    ### 13.5.2 在污染模式下调试


    如果你对一个 `#!` 行中包含 `-T` 的程序进行语法检查，你会看到类似这样的输出：`$ **perl -c foo.cgi**


    `foo.cgi` 第 1 行太晚了无法使用 "-T"` 选项。


    这是由 Perl 实现的一个晦特性引起的，它要求在启动过程非常早阶段开启污染模式。（如果你还记得 Perl 之禅第 10 条——使用 `use diagnostics`
    来解释错误消息——你就会看到解释了。）只需加上 `-T` 即可：


    `$ **perl -cT foo.cgi**


    ### 13.6 预防错误


    你的程序的输出通常会通过 Web 服务器解析（除非你使用越来越少见的 `nph` 功能），这会添加一些头部信息，如状态行（除非你自己提供）、服务器标识行和日期。你必须记住的关键头部信息是
    `Content-type`：你必须输出这一个。


    （额……事实的真相要复杂得多，但意义不大。你可以输出任意数量的看起来像头部的行 [根据实验，任何包含冒号且冒号两边至少有一个非空格字符的行]，这些行会被服务器忠实地传递，就好像它们确实具有某种意义。只要你在输出内容之前输出一个空行，它就能通过；如果你不输出
    `Content-type` 头部，某些服务器会为你设置一个（设置为 `text/plain`）；某些浏览器会解释缺失 `Content-type` 头部意味着它的类型是
    `text/html`。这顶多仅具有学术兴趣。）


    ![Image 85](img/index-148_1.jpg)


    底线是，你程序的第一个输出必须是包含 `Content-type` 头部的头部行，并且在内容之前必须紧跟一个空行。如果你使用 `CGI.pm`，头部例程就是你正确输出头部的全部；只要你在调用其他产生输出的操作之前调用它，你就不需要担心了。但有时，Bug
    会聚集在一起对你破坏这一策略。


    **从命令行运行你的 CGI 程序，以检查它是否按正确的顺序产生了正确的输出。**


    弄清楚你的程序输送到 `STDERR` 的内容至关重要。`die` 和 `warn` 的输出就到了这里，包括来自 `use strict` 或 `-w` 的任何抱怨。流行的
    Apache 服务器将 `STDERR` 放在错误日志文件中，但 Netscape 企业服务器按照接收到的顺序将它们重定向到浏览器。那会是什么呢？让我们来看一个除了输出之外还会产生警告的简单脚本：


    ```perl

    #!/usr/bin/perl -w


    use strict;


    my $x;


    print "Content-type: text/plain\n\n";


    print "Value of \$x is $x\n";

    ```


    `foo.cgi` 第 5 行：`Use of uninitialized value in concatenation (.)`

    `Value of $x is` 但那并不是输出到 Web 服务器的顺序！因为我们正在输出到终端，`STDOUT` 默认是行缓冲的，这意味着它的输出在每个换行符处都会刷新。然而，如果输出不是发送到终端，`STDOUT`
    是全缓冲的（除非 Web 服务器另有决定），并且在输出到 `STDERR` 之后才会出来。


    结果：在同样会将 `STDERR` 发送到浏览器的服务器上尝试这样做，你将会得到 500 错误。对于服务器来说，`foo.cgi` 第 5 行有 `Use
    of uninitialized value in concatenation (.)`。`Content-type: text/html` `Value
    of $x is`。第一行看起来不像头部。呼！这需要记的东西太多了吧吗？这就是为什么我们重申：先从命令行测试你的程序，并遵循 Perl 之禅第 17 条——在继续开发之前消除所有警告。此外，在程序开头添加
    `$| = 1` 来缓冲 `STDOUT`，这样当你发送输出时，会被立即传递给 Web 服务器。


    ### 13.7 cgi-test


    ```perl

    #!/usr/bin/perl -Tw

    use strict;

    print "Content-type: text/plain\n\n";

    print "$_: $ENV{$}\n" for sort %ENV;

    print <STDIN>;

    ```


    每当你怀疑表单发送了什么时，就使用这个。只需将此脚本作为目标，你就能获得环境变量和任何通过 `POST` 发送内容的简要导出。


    ### 13.8 窃听


    有时你只想听听浏览器和服务器之间的对话。也许你正在处理缓存行为可疑的浏览器，你不想猜测获取了什么。你可以使用像 `tcpdump` 这样的连接嗅探工具来监控客户端和服务器之间的流量，但这通常需要超级用户权限来将网络接口设置为“混杂”模式。因此，尝试我们的
    `proxylog` 工具：


    ```perl

    #!/usr/bin/perl -w

    use strict;

    use Getopt::Std;

    use IO::Socket;

    use IO::Select;


    sub usage

    {

    print<<"EndUsage";

    $0 -i clientport -o serverhost:port [-v]

    - incoming port 要监听的端口

    - outgoing port 用于仅向一个客户端请求建立的端口，然后退出


    注意事项:

    - 不处理并发连接。

    - 读取是异步的，写入是同步的。

    - 大于 64K 的消息将被分段。

    EndUsage

    }

    ... (后续代码未提供)

    '
- fmt: '

    Let''s say that you want to see exactly what travels between the browser and server
    when you visit a URL like [`http://webhost/path/file.html`](http://webhost/path/file.html).
    Run this script like so:


    ```bash

    % proxylog -i 2222 -o webhost:80

    ```


    Now the script is listening on port `2222`. (You can pick any number you like—on
    a Unix system you need to be root to pick anything below `1024`—but you want to
    avoid the numbers for any well-known services your computer might already use.)[2]
    Let''s say that the machine on which you run `proxylog` is called `listener`.
    [3] Enter the URL [`http://listener:2222/path/file.html`](http://listener:2222/path/file.html)
    into your browser, and watch the transaction be printed out by `proxylog`:


    [2] Like, for instance, 6667 (IRC), or 6699 (Napster).


    [3] We''ve omitted domains like `.com` from the host names here, but you may need
    them when you run `proxylog`.


