    [content]

    真讨厌！对此我们能做什么？难道是说你不应该在一个循环内部嵌套另一个使用 `$_` 作为循环变量的循环吗？考虑以下情况：子程序 proc


    ```perl

    sub proc


    {


    while (<STDIN>)

    {


    # do something

    }

    }

    ```


    现在我们必须检查每个调用 `proc()` 及其祖先节点的地方，看它是否在 `foreach` 循环内部吗？大不必。


    我们可以做的是记住，`while` 是唯一一个不局部化 `$_` 的循环语句，因此每当我们构建一个可能处于 `$_` 已经被使用的上下文的 `while`
    语句时，我们只需要手动处理即可：


    ```perl

    sub proc


    {


    local $_;

    while (<STDIN>)

    {


    # do something

    }

    }

    ```


    现在，你可以安全地在 `foreach` 循环内部尽情地调用 `proc()` 了。


    **在使用设置了 `$_` 的 `while` 循环时，如果可能从其他地方调用，请先局部化 `$_`。**


    注意，当我们说*局部化*（localize）时，这确实需要调用 `local` 运算符，而我们通常倾向于避免使用它。原因是：你无法用 `my` 创建词法作用
    `$_`，因为它是一个特殊的伪全局变量，它不支持所有权赋值。


    ### 4.1.2 消失的括号案例


    与现有的几乎所有其他过程化语言不同，当你在 Perl 中调用函数或过程（在 Perl 术语中都称为“子程序”）时，并不总是需要将参数放在括号内。如果 Perl
    可以在没有括号的情况下判断参数是什么，你就不需要把它们放进去。这使得代码更具可读性，更说减少了输入量；例如


    ```perl

    print join '' '', reverse split /:/;

    ```


    这认为比下面的代码更有美感：


    ```perl

    print(join('' '', reverse(split(/:/))));

    ```


    并且让你感觉自己不像在写 LISP。


    另一方面，在必要时千万不要漏掉括号：


    ```perl

    my %userdb = (pjscott => "Peter Scott",


    ewright => "Ed Wright");

    print "Usernames: ", join " ", sort keys %userdb, "\n";

    ```


    结果是


    ```

    Usernames:

    ewright pjscott

    ```


    末尾没有换行符。这是因为 `sort` 的原型是 `sort optional_subroutine_or_block *LIST`，那么 Perl 如何知道
    `LIST` 在何处结束呢？只要有看起来像列表元素的项，它们就会被包含进来，这意味着 `"\n"` 会和哈希键一起被排序。因此在这种情况下，你实际上需要弯曲手指按下括号键，并输入


    ```perl

    print "Usernames: ", join " ", sort (keys %userdb), "\n";

    ```


    事实上，这种操作有不止一种方法，查看一些其他可能性是很有启发性的：


    ```perl

    print "Usernames: ", join " ", (sort keys %userdb), "\n";

    print "Usernames: ", join (" ", sort keys %userdb), "\n";

    print "Usernames: ", (join " ", sort keys %userdb), "\n";

    ```


    我们在这里使用了两种不同的方法来限制 `sort` 参数的作用范围。一种是将函数的参数放在括号内；另一种是将函数名同其参数一起放在括号内。我们通过两种不同的手段得到了相同的结果：当函数参数包含在括号内时，Perl
    执行了一条名为“如果它看起来像函数，那么它就是函数”的解析规则，括号界定了函数参数列表。当函数及其参数包含在括号内时，括号创建了一个项，防止 `sort`
    消耗该项之外的任何参数（参见 4.2 节中的表 4-1）。


    那么这个呢：


    ```perl

    print ("Usernames: ", join " ", sort keys %userdb), "\n";

    ```


    如果你在不使用 `-w` 标志的情况下尝试，你会发现换行符没有被打印。如果你加上 `-w` 标志，就会发现原因：


    ```

