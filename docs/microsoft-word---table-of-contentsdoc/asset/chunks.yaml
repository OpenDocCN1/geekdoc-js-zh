  trans: "\n\n一个交互式的、以命令行为导的调试器并没有达到“刑具”的实际定义，但对于许多本就无畏且干练程序员来说，这种区别显得过于细微——因为当被要求使用它时，他们会感到绝望而发抖畏缩。调试器本身并不邪恶，但看起来确实相当晦涩，其用法与其说是一项实用技能，不如说是一门艺术。\n\
    \n我的班里曾有人认为调试器是用来从代码中移除 bug 的工具。如果真如此就好了。因此，可能需要解释一下：与它的名称相反，调试器仅仅是一个设备，允许你增量地执行程序，同时在执行过程中有机会检查并更改它的内部状态。\n\
    \n这个概念对于 Perl 来说并不新鲜。像 Perl 这样的交互式调试器已经存在了几十年了，Perl 调试器的特殊之处在于它赋予了你对其内部的访问权限，允许你根据需要创建自定义的调试界面（后文将详细介绍）。\n\
    \n## 7.1 基本操作\n\n通常情况下，perl 会无碍地运行你的程序，但调试器提供了一种让 perl 和你共同运行程序的方法。在程序执行的任何点，你都可以让\
    \ perl 暂停并告诉你它到目前为止做了什么。将 Perl 运行时系统想象成一只老鼠，吞噬着由程序操作码（opcodes）组成的面包屑路径。调试器允许你让老鼠在你指定的点停下，并询问它消化系统的内容。如果你不喜欢某些变量的值，可以修改它们（我们不会尝试将这个比喻扩展到这一点）。\n\
    \n事实上，Perl 的调试器是一个使用通过 `-d` 开启的钩子（hooks）编写的插件。可以编写程序利用这些钩子执行除交互式命令行界面以外的操作，而且已经有几人这样做了。我们已经看到一个例子，即第\
    \ 6 章中的 Devel::Coverage，将在第 11 章中介绍 Devel::DProf。\n\n## 7.2 启动\n\n`-d` 命令行选项会让你的脚本在调试器下运行。你可以将它添加到脚本开头\
    \ `#!` 行的选项中，也可以通过显式通过 perl 运行脚本来覆盖选项。例如，如果 `wombat.pl` 目前设置了 `-w` 选项，你可以将第一行更改为：\n\
    \n```\n#!/usr/bin/perl -wd\n```\n\n或者输入：\n\n```\n% perl -wd wombat.pl\n```\n\n\
    这样可以在不修改脚本的情况下对其进行调试。与某些调试器不同，使用这个时你在命令行上为程序提供参数，而不是作为调试器命令的一部分；例如：\n\n```\n%\
    \ perl -wd wombat.pl kangaroo platypus wallaby\n```\n\n调试器会宣告自己并提供一个提示符：\n\n```\n\
    Loading DB routines from perl5db.pl version 1.07\nEmacs support available.\nEnter\
    \ h or `h' for help.\nmain::(wombat.pl:1): my $marsupial = shift;\nDB<1>\n```\n\
    \n从现在起，在重现调试会话时，我们将省略第一个提示符（以及它停止的代码）之前的所有内容。\n\n首先，让我们来看一些简单的命令。感兴趣的第一个当然是用于帮助的\
    \ `h`。它的输出有几个屏幕长，这给了我们机会提到一个应用于所有命令的选项：在任何命令之前放置一个竖线（`|`），它将把输出通过你的分页器（即一次打印一屏并等待你告知何时继续的程序——大体如此）。\n\
    \n### 7.2.1 观察代码执行：s, n, r\n\n在 `debug.pl` 中输入这个简单程序：\n\n```perl\n#!/usr/local/bin/perl\
    \ -w\nuse strict;\n\nmy @parole = qw(Salutations Hello Hey);\n\nprint_line(@parole);\n\
    \nprint \"Done\\n\";\n\n# 我们的子程序接受一个数组，然后打印\n# 每个元素的值，并附加 \"Perl World.\"。\nsub\
    \ print_line\n{\n    my @parole = @_;\n    foreach (@parole)\n    {\n        print\
    \ \"$_ Perl World\\n\";\n    }\n}\n```\n\n现在在调试器下运行它，并使用 `n`（next）命令逐语句单步执行程序：\n\
    \n```\n% perl -dw debug.pl\nmain::(debug.pl:4): my @parole = qw(Salutations Hello\n\
    Hey);\nDB<1> n\nmain::(debug.pl:6): &print_line(@parole);\nDB<1> n\nSalutations\
    \ Perl World\nHello Perl World\nHey Perl World\nmain::(debug.pl:7): print \"Done\\\
    n\";\nDB<1> n\nDone\nDebugged program terminated. Use q to quit or R to restart,\n\
    use O inhibit_exit to avoid stopping after program termination, h q, h R or h\
    \ O to get additional info.\nDB<1> q\n```\n\n在提示符之前，调试器会打印包含下一步要执行的语句的源代码行。（如果你在行中有多个可执行语句，它会在你每次输入\
    \ `n` 时都打印该行，直到执行完该行上的所有语句。）注意，我们程序的输出到终端的内容与调试器的文本交织在一起了。还要注意，当我们调用 `print_line(@parole)`\
    \ 时，我们在获得下一个提示符之前已经执行了子程序中的所有语句。\n\n（从现在起，我们不再重现调试器打印的乐观的“Debugged program terminated”结束语。）\n\
    \n假设我们想单步执行子程序内部的代码，可以使用 `s`（single step）命令。进入子程序内部的。让我们通过另一个方便的命令 `r`（return）来看看它是如何使用的：\n\
    \n```\n% perl -d debug.pl\nmain::(debug.pl:4): my @parole = qw(Salutations Hello\
    \ Hey);\nDB<1> s\nmain::(debug.pl:6): &print_line(@parole);\nDB<1> n\nmain::(debug.pl:13):\
    \ my @parole = @_;\nDB<1> n\nmain::(debug.pl:14): foreach (@parole)\nDB<1> n\n\
    main::(debug.pl:15): print \"$_ Perl World\\n\";\nDB<1> r\nSalutations Perl World\n\
    Hello Perl World\nHey Perl World\nmain::(debug.pl:7): print \"Done\\n\";\nDB<1>\
    \ s\nDone\nDebugged program terminated.\n```\n\n`r` 的效果是执行到代码结束。（这些命令字母都是拷贝自现有的\
    \ Unix 调试器且易于记忆：next, step, return）。此外，注意直接按回车键什么都不会做。）\n\n### 7.2.2 检查变量：p, x,\
    \ V\n\n单步执行代码很棒，但我们如何检查变量的值呢？使用 `p expression` 输出表达式的结果（等同于打印到 `DB::OUT`，因此表达式处于列表上下文），或使用\
    \ `x variable` 以整洁的格式打印变量并跟踪引用。再次使用这个简单程序：\n\n```\n% perl -wd debug.pl\nmain::(debug.pl:4):\
    \ my @parole = qw(Salutations Hello Hey);\nDB<1> p @parole\nDB<2> n\nmain::(debug.pl:6):\
    \ print_line(@parole);\nDB<2> p @parole\nSalutationsHelloHey\nDB<3> x @parole\n\
    0 'Salutations'\n1 'Hello'\n2 'Hey'\n```\n\n在第一个命令中，我们指示调试器打印 `@parole` 的值。然而，`@parole`\
    \ 的赋值尚未执行，所以没有任何输出。跳过赋值后用 `p` 打印；我们看到了数组的列表状态。用 `x` 打印数组，我们看到了带有索引的独立元素。\n\n你可以使用\
    \ `V` 命令查看给定包（默认：main::）的所有动态变量。这听起来没那么好用，因为不像 `x` 或 `p` 命令，它不会显示任何局部变量（即你用 `my`\
    \ 声明的变量）。然而，你希望尽可能让你的变量成为局部变量（见 Perl of Wisdom #8）。遗憾的是，没有（简单）的方法可以列出包中所有的局部变量，因此你只能打印你所知的那些。\n\
    \n"
