  raw: '(If you''re relatively new to Perl, this chapter might raise the hairs on
    the back of your neck a little. Feel free to return to it after you''ve gotten
    more comfortable with the language.) Here''s a tour of some examples of this obnoxious
    species of bug.


    **10.1 A Bit Illogical**


    Perl has several ways of saying *and* and *or:*


    **Table 10-1\. *And*, *Or*, and *Xor*** **Operators in Perl** **Operation**


    **AND**


    **OR**


    **XOR**


    bitwise (non-short-circuiting)


    &


    |


    ^


    logical (high precedence)


    &&


    ||


    logical (low precedence)


    and


    or


    xor


    (There is no high-precedence logical XOR operator.) The consequences of picking
    an operator from the wrong row are usually annoying mistakes like open (FH, $file)
    | die "Error opening $file: $!\n"; which dies whether or not the open succeeds,
    because the | operator is strictly a bitwise arithmetic or string operator, which
    evaluates both of its operands so that it can return the result of ORing their
    bits together. In this case, you want ||, which is a logical operator that evaluates
    its left-hand side and returns it if true; otherwise it evaluates and returns
    its right-hand side.


    ![Image 63](index-112_1.jpg)


    An even better choice would be the or operator introduced in Perl 5, which has
    such low precedence that you can leave out the parentheses on open:


    open FH, $file or die "Error opening $file: $!\n";


    **10.2 Reading Directories**


    This has bitten us more times than we care to admit:


    **readdir() returns the list of filenames in the directory, but they** **are not
    qualified by the directory itself.**


    Consider the following program:


    use strict;


    use File::stat;


    my $dir = shift || ''.'';


    opendir DIR, $dir or die "Error opening directory $dir: $!\n"; while (defined
    (my $file = readdir DIR))


    {


    print "File $file was last modified on "


    . localtime(stat($file)->mtime), "\n";


    }


    closedir DIR;


    It takes a directory as its argument, defaulting to the current directory. This
    program prints out the names and modification times of all the files in the current
    directory.


    If run with no arguments, the program runs fine. If we then run it with an argument
    (this example is on Unix), it appears to start working and then fails: File .
    was last modified on Sun Mar 28 14:36:27 1999


    File .. was last modified on Tue Aug 3 15:29:12 1999


    Can''t call method "mtime" without a package or object reference


    at mod_times.pl line 9.


    What happened here?


    First, we see the error refers to line 9 and that perl attempted to invoke the
    mtime method on something that wasn''t even an object. What was the object? It
    was the result of the call to stat($file) (we''re using the stat routine from
    the File::stat module here, instead of the core perl stat routine that returns
    a list; it saves us from having to look up the index of the mtime element).


    The specification of that function says that if $file doesn''t exist, stat returns
    undef, which certainly isn''t an object. Therefore $file doesn''t exist. And the
    reason it doesn''t exist is because $file doesn''t contain an absolute path and
    therefore is interpreted relative to the current directory. The current directory
    won''t contain files with the same names as the ones we read with readdir except
    by coincidence and except for the two files that every directory contains (. and
    ..). This is why we get some initial output that makes it look as though the script
    is working. It isn''t; it''s reporting the times for different . and .. from the
    ones we wanted.


    The fix is easy: just qualify $file with $dir:


    use strict;


    use File::stat;


    my $dir = shift || ''.'';


    opendir DIR, $dir or die "Error opening directory $dir: $!\n"; while (defined
    (my $file = readdir DIR)) {


    print "File $file was last modified on "


    . localtime(stat("$dir/$file")->mtime), "\n";


    }


    closedir DIR;


    This works even if $dir is relative or contains ../.[1]


    [1] Using / as a directory separator works on Unix and Windows (Perl turns it
    into a \ on the latter). A truly operating system-independent way of forming the
    path would use File::Spec and replace


    "$dir/$file" with File::Spec->catfile($dir, $file); **10.3 But What Did It Mean?**


    The following program is designed to reprint its input lines prefixed with an
    increasing date that skips weekends:


    #!/usr/bin/perl -w


    use strict;


    use Time::Local;


    my $t = timelocal(0,0,0,31,11,99); # Dec 31 1999


    while (<>)


    {


    my ($m, $d, $y) = (localtime $t)[4,3,5];


    $y %= 100;


    $m++;


    print "$m/$d/$y $_";


    dp { $t += 86400 } while (localtime $t)[6] == 0


    || (localtime $t)[6] == 6;


    }


    However, the output shows a date that doesn''t change:


    ![Image 64](index-114_1.jpg)


    12/31/99 This is the first line


    12/31/99 This is the second line


    12/31/99 This is the third line


    Running under the debugger won''t reveal anything other than the fact that $t
    isn''t being increased in the do block.


    Wait a minute. It doesn''t say do, does it? It''s a typo: dp. Yes, we could fix
    the program right now. But curiosity demands that we wonder why Perl has no objections!
    What could it be thinking we mean?


    Enter the B::Deparse module. The B stands for "back-end," which is to say, this
    module accepts input from the Perl compiler after it has created a binary opcode
    tree from a program. The whole purpose in life of B::Deparse is to turn that opcode
    tree back into Perl. For instance, you can use it to turn a subroutine reference
    into program text in the middle of a program.


    Deparse isn''t quite perfect—you may see some odd output, at times even incorrect
    output—but it''s getting there.[2] Let''s see what we get when we run it on just
    a part of the line of code that''s bugging us. Notice that we don''t invoke it
    with a use statement but rather with a funny variant of the -M option designed
    for back-end modules:


    [2] Larry Wall said that Perl 5 should be translatable into Perl 6 via a kind
    of Deparse module, so we can expect considerable progress.


    % **perl -MO=Deparse -e ''dp { $t += 86400 } while \**


    **(localtime $t)[6] == 0''**


    do { $t += 86400 }->dp while (localtime $t)[6] == 0;


    -e syntax OK


    Aha! Perl is interpreting our typo as a use of the indirect object method syntax—it
    thinks we want to call the dp method of whatever the block $t += 86400 evaluates
    to. So this is no longer a do *BLOCK* while *EXPRESSION* construct (which guarantees
    the block will be executed at least once). Instead it is a *STATEMENT* while *EXPRESSION*
    construct (where the statement is do { $t += 86400 }->dp), which means that the
    statement will be executed only if the expression is true, which in this case,
    it isn''t to begin with.


    **The Deparsemodule can often explain how perl is parsing your** **code.**


    Note: Deparse only came into the core with version 5.005, and it''s documentation
    has some additional options worth checking out, like the ability to totally parenthesize
    expressions so you can see how precedence is determined. (And if you see ''???''
    in the output, that stands for a constant in the input that was optimized by perl
    to the point where its value was not available to Deparse.)


    Here''s another example in which Deparse helps. Let''s say you''re scanning text
    to pull out URLs and want to clean them up a little by removing redundant default
    port numbers:


    my %port = (http => 80, https => 443, ftp => 79, nntp => 119, gopher => 70);


    while (<DATA>)


    {


    if (my ($url) = m#((\w+)://\S+[\w])#)


    {


    $url = ~ s#:$port{$2}/#/# if $port{$2};


    print "URL found: $url\n";


    }


