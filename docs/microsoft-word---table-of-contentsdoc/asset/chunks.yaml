    The issue of "to what extent code you publish for reuse should be object-oriented"
    has engendered fiercely partisan arguments in the Perl community, with impassioned
    advocates at both ends of the spectrum. The upshot of this is that you can take
    whatever position you want and justify it by an appeal to authority.[[4] Our rule
    of thumb is: If you''re writing something just for your own use which is not likely
    to have significant reusability, the overhead for making it object-oriented is
    unlikely to be worthwhile. If you''re writing something to be used by other people,
    an O-O interface will probably be worth the effort, considering how neatly it
    separates the interface from the implementation and relieves you of the need to
    provide any more support than simply ensuring that the interface lives up to its
    promises.


    [4] Use everything to your advantage ...


    Garbage collection in Perl does not happen asychronously, but is entirely deterministic
    (except for the order in which objects are freed during global destruction at
    the end of a program). When the reference count on an object drops to zero, it
    is destroyed immediately.


    Although Java allows you to inherit from only one concrete base class and multiple
    abstract classes, Perl makes no distinction between the two kinds of class and
    says that you can do as much multiple inheritance as you like. You may find that
    your fears about incestuous inheritance relationships do not come to pass, however.


    Reflection in Perl is accomplished by several methods. If the object `$obj` is
    implemented as a hash, you can discover its set of attributes with keys `%$obj`.
    You can find out if it supports a given method `meth` with `$obj->can(''meth'')`,
    and you can get a list of all the methods it supports by traversing the symbol
    table for the package looking for subroutines. Finally, you can construct its
    inheritance hierarchy by following the `@ISA` array package variable or by using
    the CPAN module `Class::ISA`


    `[(http://search.cpan.org/search?dist=Class-ISA](http://search.cpan.org/search?dist=Class-ISA))`
    which provides a friendly interface for that.


    Finalizer chaining does not happen automatically in Perl either—the Perl term
    for finalize is `DESTROY`—and for much the same reasons as in Java.


    In keeping with the Perl philosophy of permissiveness, there is no equivalent
    of final to prevent a method from being overridden in a derived class.


    ## 12.5.2 Specific Tips for the C++ Programmer


    The lack of strong typing which probably seemed liberating to the C programmer
    probably seems offensive to you. (Perl may seem irritatingly free-form until you
    grasp the Perl ethos.) Perl does have operator overloading, although it isn''t
    used as often as you''d think. `perldoc overload` tells you all about it.


    Because Perl doesn''t have strong typing, you won''t need to construct template
    classes for generic operations since they''re generic to begin with.


    We personally find the use of references in C++ to be annoying, because a change
    in a function prototype can change the actual value that is passed in in a call
    to the function. If you actually like this feature, you can replicate it—after
    a fashion—with what Perl calls *subroutine* *prototypes.* They won''t look like
    prototypes to you—they''re more like patterns specifying the order and types of
    arguments that can be passed—but one of the consequences is that you can construct
    a prototype that will allow a subroutine to be called with an array and receive
    a reference to that array where it would normally receive the list of all the
    elements in the array.


    We suggest you not be too hasty to avail yourself of this feature, primarily because
    unlike C++, Perl does not require prototypes to be declared in order for a program
    to work, and if yours somehow fail to get declared—or get declared too late—then
    the semantics of your program will change in wonderfully unpredictable ways.


    ## Chapter 13. Debugging CGI Programs


    ![Image 82](index-142_1.jpg)


    "Would you tell me, please, which way I ought to go from here?"


    "That depends a good deal on where you want to get to," said the Cat.


    — *Alice in Alice''s Adventures in Wonderland by Lewis Carroll* The Cheshire Cat
    was renowned for oblique comments and a propensity to vanish partially or completely
    at inconvenient times. Running Common Gateway Interface (CGI) programs through
    a Web server can leave one feeling a lot like Alice (including stretched thin
    and squashed).


    ## 13.1 CGI


    A glance at `comp.lang.perl.misc` reveals that many people don''t understand the
    difference between the CGI protocol and the Perl scripts that use it. We therefore
    consider it our civic duty to take the time to explain it here, even though we''re
    talking about something that is not Perl. (That''s the Perl connection—that it
    has nothing to do with Perl. It''s all very Gödel-like.)


    The Common Gateway Interface is a specification for how a Web server can deliver
    dynamic content. It says that you can have a URL that points not to a static file
    but to a program whose output will be sent to the browser. The user of the browser
    cannot tell the difference between a CGI program and a static file by looking
    at what the server returns; the only clue is that the URL usually looks different.
    (Instead of ending in `.html`, it probably ends in `.cgi` or contains `/cgi-bin/`.
    There''s nothing hard and fast about this rule though. It''s easy to configure
    a Web server to return static pages whose URLs look like CGI programs, and vice-versa.)
    The point, however, is that they shouldn''t care what produced the output.


    The CGI specification spells out how a program invoked in this way can have inputs
    sent by a browser (as part of the URL using an `HTTP GET` command or in HTTP content
    with a `POST` command), how the program can see those inputs (in the `QUERY_STRING`
    environment variable or in standard input respectively), how the inputs are encoded
    (a format that turns many characters into a hexadecimal representation), and what
    the program has to send in addition to the browser-visible content (HTTP headers
    specifying the type of that content).


    *Nothing in the CGI specification specifies a particular language for CGI programs.*
    This is why people who ask questions about CGI get attacked for asking them in
    a Perl newsgroup. The newsgroup the attackers want those questions taken to is
    comp.infosystems.www.authoring.cgi.


    So how can you tell whether your question or problem is Perl related or CGI related?


    - If your program produces apparently correct output when run from the command
    line, but the Web browser displays a 500 - Server Error message, it''s a CGI problem.
    If you can''t run the program from the command line on the Web server, see our
    tips that follow.

    - If your program is not picking up form inputs and you''re using `CGI.pm`, the
    Web server has a problem. Test it with our `cgi-test` program that follows. If
    you''re not using `CGI.pm`, few people are likely to assist you because you''re
    making the task unnecessarily difficult.

    - If your program takes too long to produce any output, the browser will give
    up and display a "Document contained no data" message. You may need to use a nonparsed
    header (nph) script if your Web server otherwise buffers your output, or else
    figure out how to produce output before the browser times out.


    See [http://hoohoo.ncsa.uiuc.edu/cgi/interface.html](http://hoohoo.ncsa.uiuc.edu/cgi/interface.html)
    for reference information on CGI.


    ## 13.2 Web Servers


    There are many combinations of types and versions of Web servers, platforms and
    operating systems on the World Wide Web. Their differences in behavior are outside
    the scope of this book. We aim to make our advice applicable to the widest range
    of such combinations, but when we fail, unless otherwise noted, what we say has
    been tested against a recent version of Apache on Linux.

