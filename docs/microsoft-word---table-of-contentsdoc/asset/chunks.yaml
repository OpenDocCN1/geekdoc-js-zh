  trans: "\n伪哈希（pseudo-hash）需要一些解释，因为它非常新。[6] 如果数组的第一个元素是对一个哈希的引用，那么该数组的其他元素不仅可以通过索引访问，还可以通过使用数组的引用来访问，就像使用一个哈希引用一样，其键取自该第一个元素。由第一个元素所引用的哈希必须将你想要使用的键映射到数组中值的索引。通过示例来理解这要容易得多：\n\
    \n[6] 自 perl 版本 `5.005_03` 起。它不仅是新的，还是实验性的，所以请检查你所使用的晚于 `5.6.0` 的任何 Perl 文档，查看它是否仍然存在。从最新的讨论来看，它不太可能生存到\
    \ Perl 6；然而，能够创建键是固定的哈希是非常实用的，因此这种能力可能会以某种形式持续存在。\n\n```\n$sound = [ { dog =>\
    \ 1, cat => 2, bird => 3},\n'bark', 'meow', 'tweet' ];\n```\n\n你必须确保匿名哈希中的数值对应于相应值的位置，但现在你可以说\
    \ `$sound->{dog}` 来产生 'bark'。你也可以通过 `$sound->[1]` 获取它，但这并没有体现伪哈希的意义。你不能做的是这种方式向伪哈希中放入新键：`$sound->{frog}\
    \ = 'ribbit';` 因为这将产生一个错误（在伪哈希中放入新键是可能的，但比这要困难）。但如果你的应用程序不需要在运行时插入新键，那么伪哈希的这个功能将确保如果你输错了键名，会立即收到警告。\n\
    \n由于伪哈希的未来尚不确定，我们还不会对它们总结出 Perl 之言（Perl of Wisdom）。请根据具体情况评估使用它们的收益。我们在这里提出的一个更通用的观点，这个观点*值得*成为\
    \ Perl 之言：**尽可能让错误在编译时发生，而不是在运行时发生。**\n\n这个小程序还可以进一步进行加固。它仍然需要在伪哈希和输入识别循环中重复 `vegetables`（蔬菜）和\
    \ `fruit`（水果）。如果我们能某种方式将它们绑定在一起，我们出现编译时错误的概率就会降低。\n\n来看看我们最新的修订版本。在这里，我们进行了一些更彻底的手术。你会注意到，我们通过创建一个单个哈希\
    \ `%food_type` 来将库存物品映射到蔬菜或水果，从而消除了在遍历输入循环时引用哈希键的需求。\n\n```\n1 use fields;\n2\
    \ $_ = fields::phash(vegetables => 0, fruit => 0)\n3 for my ($cases_bought, my\
    \ $cases_sold);\n4 my %food_type = (map ({ ($_, 'vegetables') }\n5 qw(carrots\
    \ broccoli kale spinach leeks)), 6 map { ($_, 'fruit') }\n7 qw(apples kumquats\
    \ pears bananas kiwis)\n8 );\n9 while (<>)\n10 {\n11 my ($food, $bought, $sold)\
    \ = split;\n12 if (my $type = $food_type{$food})\n13 {\n14 $cases_bought->{$type}\
    \ += $bought;\n15 $cases_sold->{$type} += $sold; 16 }\n17 else\n18 {\n19 warn\
    \ \"I don't know the food type $food\\n\"; 20 }\n21 }\n22\n23 foreach my $type\
    \ (keys %$cases_bought)\n24 {\n25 print $cases_bought->{$type} - $cases_sold->{$type},\
    \ 26 \" cases of $type on hand\\n\";\n27 }\n```\n\n我们为 Perl `5.6.0` 引入了一个函数 `fields::phash`，它消除了创建伪哈希的繁琐，并同时避免了我们在上一个版本前两行的重复。如果伪哈希在\
    \ Perl 的后续版本中被保留，但其实现方式发生了变化，`fields::phash` 将被修改，以向你隐藏这种实现上的变化。当我们想要遍历不同的食物类型以打印报告时，我们只需要使用伪哈希的键即可（这意味着我们不再能够选择顺序，除非我们对键进行排序）。\n\
    \n### 9.2 检查返回代码！\n\n可能会失败的 Perl 内置函数会返回一个特殊值来提醒你已经执行了。通常，这个值是虚假的。（调用操作系统执行工作的函数会将错误类型放在\
    \ `$!` 变量中。）这允许使用许多种检查和处理它的常用口语表达，其中最著名的是“打开或死亡”（open-or-die）惯用写法：\n\n```perl\n\
    open DICT, '/usr/dict/words'\nor die \"I'm at a loss for words: $!\";\n```\n\n\
    既然是 Perl，有许多其他方法可以表达相同的意思。选择一个适合你的方法即可：\n\n```perl\nif (mkdir $tmpdir, 0755)\n\
    {\n  copy $dbfile, \"$tmpdir/$dbfile.$$\"\n}\nelse\n{\n  die \"Couldn't create\
    \ $tmpdir because $!\";\n}\n\ndie \"Can't chdir to $subdir: $!\" unless chdir\
    \ $subdir; \nprint chmod (0644, @files) ? \"Success!\" : \"Failure: $!\";\n```\n\
    \n![Image 61](img/index-106_1.jpg)\n\n注意，你并不需要固守一种惯用写法。如果你想编写高质量的程序，必须对检查返回代码非常狂热。例如，在前面的例子中，`File::Copy`\
    \ 中的 `copy` 函数也返回真或假，并在失败时设置 `$!`。\n\n某些函数返回真/假以外的内容，例如，`chmod`、`chown` 和 `unlink`\
    \ 每个都接受一个文件列表进行操作，返回实际修改的文件数量，如果发生任何错误，则会将 `$!` 设置为最后一个错误。**了解你的操作系统。**\n\n我课程中的其中一个学生遇到了以下情况。作业是创建一个临时目录并在其中创建一组文件，对它们执行一些操作，然后删除文件和目录。他的代码部分看起来如下：\n\
    \n```perl\nforeach $file (@files)\n{\n  open OUT,\">$file\" or die \"Can't open\
    \ $file: $!\";\n  # 向文件写入内容\n}\ndie \"Unlink didn't get everything: $!\" unless\
    \ unlink @files == @files;\nchdir '..' or die \"Couldn't go up a level: $!\";\n\
    rmdir $tmpdir or die \"Couldn't rmdir $tmpdir: $!\";\n```\n\n问题在于他在文件的循环中省略了 `close`\
    \ 语句。每当 Perl 遇到使用现有句柄的 `open` 语句时，它会自动关闭该文件句柄，所以除了最后一个之外的所有文件都已关闭。在 Unix 上，如果有任何进程打开了文件，那么在文件关闭之前\
    \ `unlink` 无法将其删除，因此在执行 `rmdir` 时，最后一个文件尚未被删除。\n\n但随后程序退出了，这意味着它所有打开的文件句柄都被关闭了；此时文件被删除，销毁了证据。其他操作系统可能会以不同的方式处理这种情况。由于\
    \ Perl 使用底层的操作系统，你必须熟悉适用于那里的特性和陷阱。\n\n### 9.3 自行异常\n\n在讨论了如何处理 Perl 生成的异常后，现在是时候讨论我们如何产生异常了。你已经习惯了最基本的异常产生方法，即调用\
    \ `die`。参数会被打印，你的程序将以非零返回代码退出。（具体是哪个非零返回代码在 `perldoc -f die` 中有详尽文档。）\n\n你可能会看到\
    \ `die` 输出的额外文本，例如它崩溃时的代码行号。\n"
- fmt: "\nIf instead it says `(eval 13)`, it's telling you that it was executing the\
    \ thirteenth call to `eval` and prints the line number relative to the evaled\
    \ code, not the program containing the eval. If it says `<FOO> chunk 42`, it means\
    \ that you had the filehandle `FOO` open and had made 42 calls to the `readline`\
    \ function (or `<>`) on it. If you didn't change the `$/` variable so that `readline`\
    \ read more than one line at a time, newer Perls will say `<FOO> line 42` instead.\n\
    \nMaybe you're tired of tacking `' or die...'` onto every system call and just\
    \ want it to happen automatically. Well, as of version 5.005_03, you can use Lionel\
    \ Cons and Ilya Zakharevich's `Fatal.pm` and just specify for which routines you\
    \ want this magical behavior to occur. Just list them in the `use` statement:\n\
    \n```\nuse Fatal qw(open mkdir chdir);\n```\n\nThe routines have to be overridable,\
    \ which is not something easily determined by mortals (translation: you have to\
    \ look at the source). Bottom line: to see if it works, try it out on any core\
    \ function you want to use it on first.\n\nNote that while you can do this for\
    \ any function (including your own), it's not useful for the ones like `chmod`,\
    \ which return the number of files modified (unless you're only ever going to\
    \ modify one file at a time). Although you can't use it on the `exec` or `system`\
    \ calls (for esoteric reasons), if you could, it wouldn't be any good on system\
    \ because that call returns 0 in the event of success.\n\n### 9.4 Playing Catch-Up\n\
    \nLet's say that you want to go in the other direction and instead of turning\
    \ errors into exceptions, you want to know when your program is about to die.\
    \ The brute-force approach is to define a pseudo signal handler for `__DIE__`:\n\
    \n```\n$SIG{__DIE__} = sub { print \"Igor lives!\\n\" };\n```\n\nbut this is rather\
    \ ineffectual for several reasons. First, we don't know why the program is dying\
    \ (without parsing the argument, which is an arbitrary string). Second, we don't\
    \ know where the program is dying without parsing the line number out of the argument\
    \ (but when you think about it, that information is absolutely useless *inside*\
    \ your program). And third, the Faustian bargain that this handler has made lasts\
    \ only as long as it does; as soon as the handler exits, your program dies anyway.[7]\n\
    \n[7] Unlike real signal handlers, which return to whatever code was executing\
    \ when the signal arrived.\n\nFortunately, there is an approach that solves two\
    \ of these problems at the same time, which is to use the block form of the `eval`\
    \ operator. Put the code you want to check on the block, and if anything inside\
    \ it causes it to die, Perl will transfer control to the end of the block and\
    \ put the message from `die` in the special variable `$@`. For example, my `%dotfiles;`:\n\
    \n```\nwhile (my ($username, $home) = (getpwent)[0,7])\n{\n    eval\n    {\n \
    \       opendir HOME, $home or die \"$home: $!\";\n        foreach (grep -f &&\
    \ /^\\./, readdir HOME)\n        {\n            open DOT, \"$home/$_\" or die\
    \ \"$_: $!\";\n            $dotfiles{$username}{$_} = () = <DOT>;\n          \
    \  close DOT;\n        }\n        closedir HOME;\n    }; # Note the semicolon\
    \ that is required here\n    if ($@)\n    {\n        print \"Problem with $username,\
    \ reason: $@\";\n    }\n}\n```\n\nBecause we get to choose how much or how little\
    \ code goes inside the `eval` block, we can determine the granularity with which\
    \ we trap exceptions. This code—which is building a hash-of-hashes containing\
    \ line counts of dot files in users' home directories—uses `eval` to catch two\
    \ possible exceptions (the failure to open a directory or a file, respectively)\
    \ and then keeps going. To bail out as soon as we hit any problem, we would wrap\
    \ the `eval` around the `while` loop.\n\nA program will not exit if it dies for\
    \ some reason while under the care of an `eval` block.\n\nHowever, we still have\
    \ to parse `$@` after the block to find out why an exception occurred, if there\
    \ were multiple possible causes.\n\nWhat's useful about this method of exception\
    \ handling is that inside the `eval` block, we could be calling subroutines to\
    \ any depth, be deep inside a horrible mixture of our code and someone else's\
    \ libraries, and have no idea what might be going on inside them; however, if\
    \ any statement in them issues a `die`, it will get caught by that `eval` block.\n\
    \n**Bullet-proof your program by trapping exceptions and handling them gracefully.**\n\
    \nLet's stop beating around the bush. What we really want is the ability to type\
    \ exceptions and preferably also to subclass them, then catch them according to\
    \ class while passing along instance-specific data.[8] Just like in Java. While\
    \ we're at it, it should use the same `try ... throw ... catch` syntax.\n\n[8]\
    \ Not everyone thinks this way, just to be fair. If you'd rather stick with `die...\
    \ eval`, you'll be in plenty of company.\n\nIt seems that the Perl mascot could\
    \ just as well be a chameleon as a camel, since it can take on so many colors.\
    \ An implementation of the `try ... throw ... catch` capability is in the module\
    \ `Error.pm` by Graham Barr, on CPAN [(http://search.cpan.org/search?dist=Error)](http://search.cpan.org/search?dist=Error)).\
    \ It allows you to write things like:\n\n```\ntry\n{\n    # Some relational database-munging\
    \ code. Somewhere\n    # inside this something might raise an exception with\n\
    \    # a line like:\n    throw Exception::SQL('Bad statement');\n}\ncatch Exception::SQL\n\
    {\n    # Code to handle SQL exceptions\n}\ncatch Exception::IO\n{\n    # Code\
    \ to handle I/O exceptions\n}\notherwise\n{\n    # Code to handle other kinds\
    \ of exceptions\n};\n```\n\n`Exception::SQL` and `Exception::IO` are classes we\
    \ created earlier by inheriting from `Error`:\n\n```\n@Exception::SQL::ISA = 'Error';\n\
    @Exception::IO::ISA = 'Error';\n```\n\nAn alternative to `Error.pm` is Brad Appleton's\
    \ `AtExit`, which allows you to specify a handler routine to be executed whenever\
    \ the current scope is left, similar to the C++ `auto_ptr` class. For instance:\n\
    \n```\nuse AtExit;\n...\n{\n    # Code to acquire a connection\n    atexit(&cleanup);\n\
    \    # More database code which might fail\n}\n```\n\nThis ensures that no matter\
    \ how that code is exited, the cleanup subroutine to break the connection will\
    \ be run.\n\n### 9.5 Confession Is Good for the Soul\n\nSometimes your program\
    \ dies not in your code but in some module you call—suicide by association you\
    \ will. A module that wants to die is supposed to call `Carp::croak` instead,\
    \ because `croak` reports the location of death as the place the module function\
    \ was called, not the line of code in the module function containing the croak\
    \ call.\n\nSome modules don't do this. Either they call `die`, or they call another\
    \ module that croaks; either way, you're left with an error message that doesn't\
    \ tell you which line of your program caused its untimely demise.\n\nIf this happens,\
    \ here's a quick way to force it to 'fess up. Near the beginning of your program,\
    \ insert the following:\n\n```\nuse Carp qw(cluck verbose);\n$SIG{__DIE__} = sub\
    \ { confess $@ };\n$SIG{__WARN__} = sub { cluck $@ };\n```\n\nNow whenever your\
    \ program calls `die/croak` or `carp/warn` it ends up calling `confess` or `cluck`\
    \ instead, which have exactly the same effect except they print a stack trace\
    \ of how they were called that goes all the way back to your main program.\n\n\
    [9] Perl is nothing if not whimsical. Presumably in this case it helps to dispel\
    \ the air of morbidity surrounding the whole topic of program death.\n\n# 10 Semantical\
    \ Errors\n\n\"Pay attention even to trifles.\"\n\n—A Book of Five Rings, *by Miyamoto\
    \ Musashi*\n\nSemantical errors are a way of saying that when all else succeeds,\
    \ you can still be wrong.\n\nThe program compiles; it runs without any kind of\
    \ run-time exception; it just doesn't do what you intended. This is why you need\
    \ system testing (see Chapter 6).\n"
  raw: 'If instead it says (eval 13), it''s telling you that it was executing the
    thirteenth call to eval and prints the line number relative to the evaled code,
    not the program containing the eval. If it says <FOO> chunk 42, it means that
    you had the filehandle FOO open and had made 42 calls to the readline function
    (or <>) on it. If you didn''t change the $/


    variable so that readline read more than one line at a time, newer Perls will
    say <FOO> line 42 instead.


    Maybe you''re tired of tacking '' or die...'' onto every system call and just
    want it to happen automatically. Well, as of version 5.005_03, you can use Lionel
    Cons and Ilya Zakharevich''s Fatal.pm and just specify for which routines you
    want this magical behavior to occur. Just list them in the use statement:


    use Fatal qw(open mkdir chdir);


    The routines have to be *overridable,* which is not something easily determined
    by mortals (translation: you have to look at the source). Bottom line: to see
    if it works, try it out on any core function you want to use it on first.


    Note that while you can do this for any function (including your own), it''s not
    useful for the ones like chmod, which return the number of files modified (unless
    you''re only ever going to modify one file at a time). Although you can''t use
    it on the exec or system calls (for esoteric reasons), if you could, it wouldn''t
    be any good on system because that call returns 0 in the event of success.


    **9.4 Playing Catch-Up**


    Let''s say that you want to go in the other direction and instead of turning errors
    into exceptions, you want to know when your program is about to die. The brute-force
    approach is to define a pseudo signal handler for __DIE__:


    $SIG{__DIE__} = sub { print "Igor lives!\n" };


    but this is rather ineffectual for several reasons. First, we don''t know *why*
    the program is dying (without parsing the argument, which is an arbitrary string).
    Second, we don''t know *where* the program is dying without parsing the line number
    out of the argument (but when you think about it, that information is absolutely
    useless *inside* your program). And third, the Faustian bargain that this handler
    has made lasts only as long as it does; as soon as the handler exits, your program
    dies anyway.[7]


    [7] Unlike real signal handlers, which return to whatever code was executing when
    the signal arrived.


    Fortunately, there is an approach that solves two of these problems at the same
    time, which is to use the block form of the eval operator. Put the code you want
    to check on in the block, and if anything inside it causes it to die, Perl will
    transfer control to the end of the block and put the message from die in the special
    variable $@. For example, my %dotfiles;


    while (my ($username, $home) = (getpwent)[0,7])


    {


    eval


    {


    opendir HOME, $home or die "$home: $!";


    foreach (grep -f && /^\./, readdir HOME)


    {


    open DOT, "$home/$_" or die "$_: $!";


    $dotfiles{$username}{$_} = () = <DOT>;


    close DOT;


    }


    closedir HOME;


    }; # Note the semicolon that is required here


    if ($@)


    {


    print "Problem with $username, reason: $@";


    }


    }


    Because we get to choose how much or how little code goes inside the eval block,
    we can determine the granularity with which we trap exceptions. This code—which
    is building a hash-of-hashes containing line counts of dot files in users'' home
    directories—uses eval to catch two possible exceptions (the failure to open a
    directory or a file, respectively) and then keeps going. To bail out as soon as
    we hit any problem, we would wrap the eval around the while loop.


    A program will not exit if it dies for some reason while under the care of an
    eval block.


    However, we still have to parse $@ after the block to find out why an exception
    occurred, if there were multiple possible causes.


    What''s useful about this method of exception handling is that inside the eval
    block, we could be calling subroutines to any depth, be deep inside a horrible
    mixture of our code and someone else''s libraries, and have no idea what might
    be going on inside them; however, if any statement in them issues a die, it will
    get caught by that eval block.


    **Bullet-proof your program by trapping exceptions and handling them gracefully.**


    Let''s stop beating around the bush. What we really want is the ability to type
    exceptions and preferably also to subclass them, then catch them according to
    class while passing along instance-specific data.[8] Just like in Java. While
    we''re at it, it should use the same try ...


    throw ... catch syntax.


    [8] Not everyone thinks this way, just to be fair. If you''d rather stick with
    die... eval, you''ll be in plenty of company.


    It seems that the Perl mascot could just as well be a chameleon as a camel, since
    it can take on so many colors. An implementation of the try ... throw ... catch
    capability is in the module Error.pm by Graham Barr, on CPAN


    [(http://search.cpan.org/search?dist=Error](http://search.cpan.org/search?dist=Error)).
    It allows you to write things like try


    {


    # Some relational database-munging code. Somewhere


    # inside this something might raise an exception with


    # a line like:


    throw Exception::SQL (-text => ''Bad SELECT statement'');


    }


    catch Exception::SQL with


    {


    # Code to handle SQL exceptions


    }


    catch Exception::IO with


    {


    # Code to handle I/O exceptions


    }


    otherwise


    {


    # Code to handle other kinds of exceptions


    };


    Exception::SQL and Exception::IO are classes of exception that we created earlier
    by the simple expediency of inheriting from Error itself:


    @Exception::SQL::ISA = ''Error'';


    @Exception::IO::ISA = ''Error'';


    An alternative to Error.pm is Brad Appleton''s AtExit CPAN module


    [(http://search.cpan.org/search?dist=AtExit](http://search.cpan.org/search?dist=AtExit)),
    which allows you to specify a handler routine to be executed whenever the current
    scope is left for any reason, similar to the C++


    auto_ptr template class. For instance:


    use AtExit;


    ...


    {


    # Code to acquire a database connection


    atexit(\&cleanup);


    # More database code which might fail


    }


    This ensures that no matter how that code block is exited, the cleanup subroutine
    to break the connection gracefully will be run.


    **9.5 Confession Is Good for the Soul**


    Sometimes your program dies not in your code but in some module you call—suicide
    by association if you will. A module that wants to die is supposed to call Carp::croak
    instead, because croak reports the location of death as the place the module function
    was called, not the line of code in the module function containing the croak call.


    Some modules don''t do this. Either they call die, or they call another module
    that croaks; either way, you''re left with an error message that doesn''t tell
    you which line of your program caused its untimely demise.


    If this happens, here''s a quick way to force it to ''fess up. Near the beginning
    of your program, insert the following:


    use Carp qw(cluck verbose);


    $SIG{__DIE__} = sub { confess @_ };


    $SIG{__WARN__} = sub { cluck @_ };


    Now whenever your program calls die/croak or carp/warn it ends up calling confess
    or cluck[9] instead, which have exactly the same effect except they print a stack
    trace of how they were called that goes all the way back to your main program.


    [9] Perl is nothing if not whimsical. Presumably in this case it helps to dispel
    the air of morbidity surrounding the whole topic of program death.


    **Chapter 10\. Semantical Errors**


    "Pay attention even to trifles."


    —A Book of Five Rings, *by Miyamoto Musashi*


    ![Image 62](index-111_1.jpg)


    Semantical errors are a way of saying that when all else succeeds, you can still
    be wrong.


    The program compiles; it runs without any kind of run-time exception; it just
    doesn''t do what you intended. This is why you need system testing (see Chapter
    6).'
