    假设你想查看访问类似 [`http://webhost/path/file.html`](http://webhost/path/file.html) 的
    URL 时，浏览器和服务器之间确切传输了什么内容。请按如下方式运行此脚本：


    ```bash

    % proxylog -i 2222 -o webhost:80

    ```


    现在脚本正在监听端口 `2222` 。（你可以选择任何你喜欢的数字——在 Unix 系统上，你需要 root 权限才能选择 `1024` 以下的任何数字——但你希望避开你计算机可能已经在使用的任何已知服务的端口。）[2]
    假设你运行 `proxylog` 的机器名为 `listener`。[3] 在你的浏览器中输入 URL [`http://listener:2222/path/file.html`](http://listener:2222/path/file.html)，并观察
    `proxylog` 打印出的事务信息：


    [2] 例如，6667 (IRC) 或 6699 (Napster)。


    [3] 我们在这里从主机名中省略了 `.com` 等域名，但在你运行 `proxylog` 时可能需要它们。


    ### 客户端:


    ```http

    GET / HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.72 [en] (Win98; I)

    Pragma: no-cache

    Host: 204.179.152.52:2222

    Accept: image/gif, image/x-xbitmap, image/jpeg, image/pjpeg,

    image/png, */*

    Accept-Encoding: gzip

    Accept-Language: en

    Accept-Charset: iso-8859-1,*,utf-8

    ```


    ##### 服务器:


    ```http

    HTTP/1.1 200 OK

    Date: Tue, 01 Aug 2000 19:54:37 GMT

    Server: Apache/1.3.12 (Unix) (Red Hat/Linux) PHP/3.0.15

    mod_perl/1.21

    Last-Modified: Wed, 01 Mar 2000 18:37:44 GMT

    ETag: "32ae2-9cf-38bd6378"

    Accept-Ranges: bytes

    Content-Length: 2511

    Keep-Alive: timeout=15, max=100

    Connection: Keep-Alive

    Content-Type: text/html

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">

    [...]

    ```


    当获取未指定 Web 服务器的锚点或嵌入 URL（如图像）时，它们也会通过 `proxylog`。[4] 可以从 [www.perldebugged.com](http://www.perldebugged.com)
    下载 `proxylog`。


    ## 13.9 CGI.pm


    我们已经多次提到 `CGI.pm`，但现在是时候深入讨论一下它了。该模块提供了一个生成 HTML 的函数式接口[5]、处理表单输入的面向对象或函数式接口，以及支持与通过
    CGI 进行交互的任何其他可能的操作的函数。如果你关心性能——考虑到《Perl 之禅 #33》——那么你可能想要查看 `mod_perl`、`FastCGI`
    和 `CGI::Lite` 等选项。这些在本书的范围之外，以下是它们的一些参考文献：


    [5] 甚至在最近的版本中使其符合 XHTML 标准。


    • *Writing Apache Modules with Perl and C: The Apache API and mod_perl*，Lincoln
    Stein 和 Doug MacEachern 著 (O''Reilly, 1999)

    • *Writing CGI Applications with Perl*，Kevin Meltzer 和 Brent Michalski 著 (Addison-Wesley,
    2001)

    • [`www.fastcgi.com/`](http://www.fastcgi.com/)

    • [`search.cpan.org/search?dist=CGI-Lite`](http://search.cpan.org/search?dist=CGI-Lite)


    编写处理 CGI 协议的代码比看起来困难；自己编写而不是使用 `CGI.pm` 就像在有一个闪光的电动搅拌机闲置在一旁时，用叉子打奶油。[6] 我们在这里只简单提一下调试问题；关于
    `CGI.pm` 的详细文档，请查看：


    [6] 这可以做到，但对手肘来说很痛苦。


    • *Official Guide to Programming with CGI.pm*，Lincoln Stein 著 (Wiley, 1998)

    • *CGI Programming with Perl*，第 2 版，Scott Guelich, Shishir Gundavaram 和 Gunther
    Birznieks 著 (O''Reilly, 2000)


    如果有人要检查 `CGI.pm` 程序生成的 HTML（无论是为了命令行调试还是从 浏览器查看源码），你可能希望将 `use CGI` 语句改为使用 `CGI::Pretty`。这将插入换行和缩进以创建……嗯，漂亮的输出。


    ## 13.10 命令行测试


    `CGI.pm` 程序可以很容易从命令行进行测试；一旦程序调用 `CGI` 方法或创建 `CGI` 对象，它就会提示（离线模式：在标准输入上输入 name=value
    对），然后你就可以输入一系列行：


    ```text

    address="742 Evergreen Terrace"

    phone=555-8707

    ```


    用任何字符结束当前 shell 的输入。你无法提供的输入有：


    - Path: `ENV{PATH}`

    - Cookies: `ENV{COOKIE}`

    - User: `ENV{REMOTE_USER}`

    - Environment: `ENV{HTTP_HOST}`

    - Current directory: `ENV{PWD}`

    - Content: `ENV{CONTENT_TYPE}`

    - Length: `ENV{CONTENT_LENGTH}`

    - Info: `ENV{REQUEST_INFO}`

    - URI: `ENV{URI}`

    - Method: `ENV{REQUEST_METHOD}`

    - Query: `ENV{QUERY_STRING}`

    - Script: `ENV{SCRIPT_NAME}`

    - Server: `ENV{SERVER_NAME}`

    - Port: `ENV{SERVER_PORT}`

    - Protocol: `ENV{SERVER_PROTOCOL}`

    - Version: `ENV{SERVER_VERSION}`

    - Accept: `ENV{HTTP_ACCEPT}`

    - Encoding: `ENV{HTTP_ACCEPT_CODING}`

    - Language: `LANG`

    - Refer: `ENV{HTTP_REFERER}`

    - Agent: `ENV{HTTP_USER_AGENT}`

    - Connection: `ENV{HTTP_CONNECTION}`

    - Auth: `ENV{HTTP_AUTHORIZATION}`

    - Cache: `ENV{HTTP_CACHE_CONTROL}`

    - Pragma: `ENV{HTTP_PRAGMA}`

    - Proxy: `ENV{HTTP_PROXY_CONNECTION}`

    - Modified: `ENV{HTTP_MODIFIED}`

    - Etag: `ENV{HTTP_ETAG}`

    - Ranges: `ENV{HTTP_ACCEPT_RANGES}`

    - Type: `ENV{HTTP_CONTENT_TYPE}`

    - Timeout: `ENV{HTTP_TIMEOUT}`

    - Max: `ENV{HTTP_MAX}`


    ## 13.11 程序崩溃


    CGI 编程中最棘手的问题可能是如何处理异常。如果程序中的某个部分崩溃，它（通常）会向 STDERR 打印消息并退出。这主要通过 `CGI::Carp` 模块解决。通过
    `use CGI::Carp qw(fatalsToBrowser);` 语句，如果程序崩溃，消息将被捕获并输出到浏览器。[7] 如果去掉 `fatalsBrowser`
    参数，输出到 STDERR 的内容将被识别并加上时间戳。因此，为了使用一个短示例，请考虑以下：


    ```perl

    #!/usr/bin/perl -w


    use strict;


    use CGI (:standard);


    use CGI::Carp qw(fatalsToBrowser);


    my ($num_angels, $pinhead_size) = (1_000_000_000, 0);


    print header, start_html, h1(''Philosophy 101'');


    print p(<<"EOP");

    Other Web sites wonder how many angels can dance on the

    head of a pin; we calculate it for you.

    EOP


    print p(''The answer is '', $num_angels/$pinhead_size);


    print end_html;

    ```


    这将产生类似的内容：


    ```html

    **Philosophy 101**


    Other Web sites wonder how many angels can dance on the

    head of a pin; we calculate it for you


    Content-type: text/html


    Software error:


    Illegal division by zero at .../foo.cgi line 12.


    For help, please send mail to the webmaster.

    ```


    在生产代码中，出于审美和安全考虑，不建议向终端用户显示错误消息。Randal Schwartz 最近在 *Linux Magazine* 专栏发表了关于 `FatalsToEmail`
    模块的文章，可以将错误通过发送给开发者；见：


    [`www.stonehenge.com/merlyn/LinuxMag/col14.html``](http://www.stonehenge.com/merlyn/LinuxMag/col14.html)。另见
    Jonas Liljegren 的 CPAN


    '
- fmt: "\nmodule `CGI::Debug` [at http://search.cpan.org/search?dist=CGI-Debug](http://search.cpan.org/search?dist=CGI-Debug)\
    \ for some error reporting and tracing features.\n\n## 13.12 Debugger Interaction\n\
    \nIf you execute a CGI program that uses `fatalsToBrowser` under the debugger,\
    \ you may see a screenful of ugly (but benign) output like:\n\n<H1>Software error:</H1>\n\
    \n```html\n<CODE>Can't locate Term/ReadLine/Gnu.pm in @INC</CODE>\n```\n\nThe\
    \ reason for this is one of the more cobwebby areas of Perl. The Perl interactive\
    \ debugger[8] loads the `Term::ReadLine` module, which contains the lines\n\n\
    [8] In the file `perl5db.pl`, if you're curious.\n\n```perl\neval \"use Term::ReadLine::Gnu;\
    \ 1\"\nor eval \"use Term::ReadLine::Perl; 1\";\n```\n\nThis is a quite reasonable\
    \ way to load `Term::ReadLine::Gnu` if it exists, and to load `Term::ReadLine::Perl`\
    \ if it doesn't. Unfortunately, the `$SIG{__DIE__}` handler (see section 9.4)\
    \ installed by `CGI::Carp` gets called first when something dies. Even if another\
    \ mechanism to catch an exception has been put in place, that mechanism won't\
    \ get to look at it. If you want to see the effects of this for yourself, try\
    \ this program:\n\n```perl\n#!/usr/bin/perl -w\n\nuse strict;\n\nBEGIN { $SIG{__DIE__}\
    \ = sub { print \"Arrgh: @_\" } }\n\neval { my $x = 1 / @ARGV };\n\nprint \"Caught\
    \ exception: $@\";\n```\n\nThe reason we divide by `@ARGV` and not `0` is that\
    \ the optimizer performs the division at compile time if it can, and this would\
    \ obscure the point we're trying to make. The program prints\n\n`Arrgh: Illegal\
    \ division by zero at line 4.\nCaught exception: Illegal division by zero at line\
    \ 4.`\n\nIt's entirely possible (read: desirable) that this behavior will change\
    \ in a future version of Perl.\n\nIn the meantime, if you want to avoid the spew\
    \ upon starting the debugger, you can safely replace\n\n`use CGI::Carp qw(fatalsToBrowser);`\n\
    \nwith the following:\n\n```perl\nBEGIN\n{\n  unless (exists $DB::{DB})\n  {\n\
    \    require CGI::Carp;\n    import CGI::Carp qw(fatalsToBrowser);\n  }\n}\n```\n\
    \n### 13.12.1 Taint Misbehavin'\n\nIf you attempt to run a program that has taint\
    \ checking turned on under the debugger, nasty things will happen when you try\
    \ to examine or change data at the debugger prompt. This should be fixed in the\
    \ 5.6.1 release of Perl; if it isn't (or you can't wait), and you need to interactively\
    \ debug scripts you can't or don't want to remove a `-T` flag from, you'll have\
    \ to find the file `perl5db.pl` and patch it to insert the line shown in bold\
    \ below that should be at or near line 1510:\n\n```perl\nlocal $otrace = $trace;\n\
    local $osingle = $single;\nlocal $od = $^D;\n{ ($evalarg) = $evalarg =~ /(.*)/s;\
    \ }\n@res = eval \"$usercontext $evalarg;\\n\"; # '\\n' for nice \\ recursive\
    \ debug\n$trace = $otrace;\n$single = $osingle;\n```\n\n## 13.13 ptkdb\n\n![Image\
    \ 86](index-157_1.jpg)\n\nThe `ptkdb` debugger (see Chapter 7) has a way for you\
    \ to debug CGI programs as they run on the server, which is as close as it comes\
    \ to having your cake and eating it too. The following conditions must be met:\n\
    \n- The server has to have `Tk`, `PerlTk`, and `ptkdb` installed.\n- The debug\
    \ client has to be running an X Window System server. This machine doesn't have\
    \ to be the same as the one running the browser making the request, however.\n\
    - The environment variable `PTKDB_DISPLAY` on the server has to be set to the\
    \ X display of the debug client.\n- You have to be able to accomplish your debugging\
    \ without interrupting the flow of output long enough for the browser to time\
    \ out. After that time, you may be able to continue debugging the program, but\
    \ you won't see what it outputs.\n\nBecause `PTKDB_DISPLAY` has to be set very\
    \ early in the program invocation, it is no good setting it in `%ENV` or even\
    \ in a `BEGIN` block. The easiest way to circumvent this is to wrap your Perl\
    \ program in a shell script, like so:\n\n```sh\n#!/bin/sh\nPTKDB_DISPLAY=client.perldebugged.com:0\n\
    export PTKDB_DISPLAY\n/usr/bin/perl -Twd:ptkdb <<\\END_OF_CGI_PROGRAM\n\nPerl\
    \ CGI program appears here\nEND_OF_CGI_PROGRAM\n```\n\nNote that we had to include\
    \ the `-T` and `-d` options when we ran `perl`. Leaving them to the `#!` line\
    \ doesn't work.\n\nA final note: Never trust a Cheshire cat to do what you expect.\n\
    \n## Chapter 14. Conclusion\n\n\"You can never entirely stop being what you once\
    \ were. That's why it's important to be the right person today, and not put it\
    \ off till tomorrow.\"\n\n—Larry Wall, Creator of Perl\n\n![Image 87](index-158_1.jpg)\n\
    \n### 14.1 Finis\n\nDo not assume the techniques and tips described in this book\
    \ represent the mythical \"correct way to debug.\" Such a thing does not exist.\n\
    \n### 14.2 The End\n\nWe close by expanding on this. The aim was not to tell you\
    \ how to debug, rather to demonstrate it. Some of the ways that people who have\
    \ a love for Perl express it are\n\n- Golf: Competing with others to see how few\
    \ characters they can code a solution in.\n- Bowling: Competing with others to\
    \ see how long and arcane they can make the solution to a simple problem.\n- Obfuscation:\
    \ The archetypal track meet for this is the `Perl Journal`s annual contest. The\
    \ quintessential obfuscation vehicle is the `JAPH`, a piece of code which prints\
    \ \"Just another Perl hacker,\" albeit by the most impenetrable means possible.\n"
  raw: 'module CGI::Debug [at http://search.cpan.org/search?dist=CGI-Debug](http://search.cpan.org/search?dist=CGI-Debug)
    for some error reporting and tracing features.


    **13.12 Debugger Interaction**


    If you execute a CGI program that uses fatalsToBrowser under the debugger, you
    may see a screenful of ugly (but benign) output like:


    <H1>Software error:</H1>


    <CODE>Can''t locate Term/ReadLine/Gnu.pm in @INC


    The reason for this is one of the more cobwebby areas of Perl. The Perl interactive
    debugger[8] loads the Term::ReadLine module, which contains the lines


    [8] In the file perl5db.pl, if you''re curious.


    eval "use Term::ReadLine::Gnu; 1"


    or eval "use Term::ReadLine::Perl; 1";


    This is a quite reasonable way to load Term::ReadLine::Gnu if it exists, and to
    load Term::ReadLine::Perl if it doesn''t. Unfortunately, the $SIG{__DIE__} handler
    (see section 9.4) installed by CGI::Carp gets called first when something dies.
    Even if another mechanism to catch an exception has been put in place, that mechanism
    won''t get to look at it. If you want to see the effects of this for yourself,
    try this program:


    #!/usr/bin/perl -w


    use strict;


    BEGIN { $SIG{__DIE__} = sub { print "Arrgh: @_" } }


    eval { my $x = 1 / @ARGV };


    print "Caught exception: $@";


    The reason we divide by @ARGV and not 0 is that the optimizer performs the division
    at compile time if it can, and this would obscure the point we''re trying to make.
    The program prints


    Arrgh: Illegal division by zero at line 4.


    Caught exception: Illegal division by zero at line 4.


    It''s entirely possible (read: desirable) that this behavior will change in a
    future version of Perl.


    In the meantime, if you want to avoid the spew upon starting the debugger, you
    can safely replace


    use CGI::Carp qw(fatalsToBrowser);


    with the following:


    BEGIN


    {


    unless (exists $DB::{DB})


    {


    require CGI::Carp;


    import CGI::Carp qw(fatalsToBrowser);


    }


    }


    **13.12.1 Taint Misbehavin''**


    If you attempt to run a program that has taint checking turned on under the debugger,
    nasty things will happen when you try to examine or change data at the debugger
    prompt. This should be fixed in the 5.6.1 release of Perl; if it isn''t (or you
    can''t wait), and you need to interactively debug scripts you can''t or don''t
    want to remove a -T flag from, you''ll have to find the file perl5db.pl and patch
    it to insert the line shown in bold below that should be at or near line 1510:


    local $otrace = $trace;


    local $osingle = $single;


    local $od = $^D;


    **{ ($evalarg) = $evalarg =~ /(.*)/s; }**


    @res = eval "$usercontext $evalarg;\n"; # ''\n'' for nice \ recursive debug


    $trace = $otrace;


    $single = $osingle;


    **13.13 ptkdb**


    ![Image 86](index-157_1.jpg)


    The ptkdb debugger (see Chapter 7) has a way for you to debug CGI programs as
    they run on the server, which is as close as it comes to having your cake and
    eating it too. The following conditions must be met:


    • The server has to have Tk, PerlTk, and ptkdb installed.


    • The debug client has to be running an X Window System server. This machine doesn''t
    have to be the same as the one running the browser making the request, however.


    • The environment variable PTKDB_DISPLAY on the server has to be set to the X


    display of the debug client.


    • You have to be able to accomplish your debugging without interrupting the flow
    of output long enough for the browser to time out. After that time, you may be
    able to continue debugging the program, but you won''t see what it outputs.


    Because PTKDB_DISPLAY has to be set very early in the program invocation, it is
    no good setting it in %ENV or even in a BEGIN block. The easiest way to circumvent
    this is to wrap your Perl program in a shell script, like so:


    #!/bin/sh


    PTKDB_DISPLAY=client.perldebugged.com:0


    export PTKDB_DISPLAY


    /usr/bin/perl -Twd:ptkdb <<\END_OF_CGI_PROGRAM


    **Perl CGI program appears here**


    END_OF_CGI_PROGRAM


    Note that we had to include the -T and -d options when we ran perl. Leaving them
    to the


    #! line doesn''t work.


    A final note: Never trust a Cheshire cat to do what you expect.


    **Chapter 14\. Conclusion**


    "You can never entirely stop being what you once were. That''s why it''s important
    to be the right person today, and not put it off till tomorrow."


    —Larry Wall, Creator of Perl


    ![Image 87](index-158_1.jpg)


    **14.1 Finis**


    Do not assume the techniques and tips described in this book represent the mythical
    "correct way to debug." Such a thing does not exist any more than does the "right
    way to program."


    The aim was not to tell you how to debug, rather to demonstrate the procedures
    we (the authors) use to debug (successfully, for the most part).


    **14.2 The End**


    We close by expanding on a theme from Chapter 2\. When we asked ourselves why
    some people work on their skills, exercise their curiosity, and try new things
    whereas others don''t, the bottom line has to do with love. The reason people
    work constantly on improving Perl, with no direct compensation, is simply that
    they love programming and they love Perl.


    More than any other language, Perl inspires this dedication because of the way
    its design embodies the principles that programming should be fun and the language
    should do what you want. Perl is a fun language.[1] Fun to use, to learn, and
    to improve. As we said in Chapter 1, a relative amateur can use Perl to solve
    real-world problems. Perhaps this fact best demonstrates the language''s elegance.


    [1] See Damian Conway''s CPAN modules Coy.pm and


    Lingua::Romana::Perligata for quintessential examples of Fun with Perl.


    Some people don''t feel this way about Perl or even programming, and that''s just
    fine: We (the authors) aren''t artists, for that matter, which is why we didn''t
    try to do the drawings for this book. That wouldn''t have been fun. Sometimes
    we see people in this business who aren''t motivated to explore or keep up their
    skills, and it''s clear that they don''t share the same love for it that we do.
    Our wish for them is that they find this passion somewhere, whether it''s in this
    field or another; there''s no dishonor in admitting that you''ve been a square
    peg in a round hole.


    Some of the ways that people who have a love for Perl express it are


    • Golf: Competing with others to see how few characters they can code a solution
    in.


    • Bowling: Competing with others to see how long and arcane they can make the
    solution to a simple problem.


    • Obfuscation: The archetypal track meet for this is the Perl Journal''s annual
    contest at


    [http://www.tpj.com/contest.html](http://www.tpj.com/contest.html). The quintessential
    obfuscation vehicle is the JAPH, a piece of code which prints "Just another Perl
    hacker," albeit by the most impenetrable means possible.


    If you love Perl too and are wondering where other people like you hang out, here
    are some suggestions:


    • There are Perl Monger groups (local user groups) all over the world. Access
    the Web


    [site http://www.pm.org](http://www.pm.org) to find the one nearest you, and pick
    up neat Perl accessories.


    • The annual Perl conference run by O''Reilly & Associates takes place in the
    western United States in su[mmer; see http://conference.perl.com/](http://conference.perl.com/).


    • There are annual alternatives in the eastern United States and Europe, both
    called YAPC (Yet Another Perl Conference), run by volunteers. See


    [http://www.yapc.org/America/](http://www.yapc.org/America/) [and http://www.yapc.org/Europe/](http://www.yapc.org/Europe/).


    • The Fun with Perl mailing list is a place for people to send short pieces of
    code that embody some really clever or elegant way of solving a problem. Frequently
    the list plays golf with them. [See http://www.technofile.org/depts/mlists/fwp.html](http://www.technofile.org/depts/mlists/fwp.html).


    • A comprehensive listing of Perl mailing lists can be [found at http://lists.perl.org](http://lists.perl.org)
    and


    [http://www.perl.org/support/mailing_lists.html](http://www.perl.org/support/mailing_lists.html).'
