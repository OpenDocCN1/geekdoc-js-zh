  trans: '


    幸运的是，Perl 随带的文档涵盖了你可能想了解 Perl 的大部分内容。不幸的是，你可能想了解的 Perl 的所有内容多得惊人。然而，只要有一点引导，你就能很快学会如何在文档中穿行，与其他方案相比，这可以节省大量时间。文档采用
    POD（Plain Old Documentation）格式，这是一种作为 Perl 一部分的非常简单的标记语言。


    熟悉文档的使用方法是一项至关重要的调试工具。由于这一点非常重要，我们在整书中使用一种设备来突出此类提示，以引起大家的注意，这种设备被夸大其词地称为*Perl
    箴言（Perls of Wisdom）：**要熟悉文档，并能够从中找到任何内容。*


    （我们已将所有的提示收集在附录 B 的列表中，以便快速查阅。）近年来，忽视这一建议最严重的例子之一是关于 1999 年后 `localtime` 函数行为引发的骚动。许多人查看了返回的年份值，错误地认为它是由实际年份的最后两位组成的，因此他们编写了处理年份窗口的代码，或者直接在数字前面加上“19”来获取真实年份。遗憾的是，根据
    Perl 文档：


    … `$year` 是自 1900 年以来的年数，也就是说，在 2023 年，$year` 是 123，而*不是*年份的最后两位。如果你假设它是，那么你就会创建不符合
    Y2K 标准的程序——你不想那样做，对吧？


    正如你所看到的，文档编写人员由于这一解释没有引起关注而感到沮丧，增加了文本。


    1998 年，我被要求修复一个 10 多年前在 VMS 机器上编写的程序，该程序未能通过 Y2K 测试。我惊讶地发现，我编写了处理年份窗口的代码，假设 C
    `tm` 结构体返回的年份只包含最后两位，结果程序打印的日期是“19100”年。在修复程序后，我找到了编写它时使用的原始 VMS C 手册，并查询了 `localtime`。奇妙地发现，它竟然宣布年份字段包含最后两位！（（得益于控制其文档的开源流程，这样的
    bug 在 Perl 文档中不会存在太久。）


    ### 1.5.1 Windows 上的 Perl 文档


    如果你使用的是适用于 Microsoft Windows 的 ActiveState 版本的 perl，`perldoc` 页面已转换为格式良好的超链接 HTML。[7]。你可以通过“开始”按钮访问：


    [7] 参见前言中的“获取 Perl”部分，获取如何获取 ActivePerl 的信息。


    开始 -> ActivePerl -> 在线文档


    或者进入安装的 ActivePerl 根目录下的 html 目录，并打开那里的 `index.htm` 文件。`Core Perl FAQ`、`Core Perl
    Docs` 以及 `Module Docs` 下的大部分列表也包含在任何其他平台上找到的标准 perl 分发版中。如果你点击主框架中的 `Perl Documentation`，你将进入
    Perl 自身核心文档的根目录，而不是 ActiveState 创建的页面。


    这是浏览文档的一种好方法，我们非常喜欢这个界面。然而，仅仅浏览是不够的；你经常需要在一个篇大大的文档章节中精确定位某个特定部分。假设你想知道如何使用 `split`；你必须进入巨大的
    `perlfunc` 页面并向下滚动到合适的位置。为了解决这个问题，你可以使用命令行版本，让我们让我们开始 `perldoc` 之之旅吧。


    ### 1.5.2 perldoc 命令


    每个安装了 perl 分发版的系统都包含 `perldoc` 以及它引用的文件。


    如果没有，请要求安装人员再次正确地进行安装。提供一个没有文档以供正确使用的工具，在技术上不属于七大罪之一，但我们正在争取在他们的下一个版本中加入它。


    只需输入 `perldoc` 产生的输出很少，但有一个引人入胜的线索：


    ```

    % perldoc

    ```


    用法: `perldoc [-h] [-r] [-i] [-v] [-t] [-u] [-m] [-l] [-F] [-X] PageName|ModuleName|ProgramName


    perldoc -f PerlFunc


    perldoc -q FAQKeywords

    ```


    `-h` 打印更多帮助信息。也可以尝试“perldoc perldoc”来熟悉系统。


    这是关于 `perldoc` 本身如何工作的信息，如果你试图寻找更多关于 `perldoc` 程序的信息则很有用，但如果你在寻找 Perl 手册则没用。如果你尝试上述两个建议之一（`perldoc
    -h` 或 `perldoc perldoc`），你最终只会得到关于 `perldoc` 可以接受的所有选项的更详细的信息。


    ![图像 11](img/index-13_1.jpg)


    开启 Perl 语言本身文档大门的钥匙是 `perldoc perl`：


    ```

    % perldoc perl

    ```


    [...]


    为了方便访问，Perl 手册被分成了若干章节：


    - `perl`: Perl 概述（本章节）

    - `perldelta`: 自上一个版本以来 Perl 的变化

    - `perl5005delta`: 5.005 版本中的 Perl 变化

    - `perl5004delta`: 5.004 版本中的 Perl 变化

    - `perlfaq`: Perl 常见问题


    [...]


    搞定！你可以通过 `perldoc` 浏览的所有不同章节都列在你面前，这引出了我们的第二个 Perl 箴言：要开始学习文档，请输入 perldoc perl。


    之所以这样是因为 `perldoc` 章节与 Unix 手册页之间存在等效关系。在 Unix 系统上，相同的章节可以通过 `man` 命令读取，而主文档是
    `man perl`，任何 Unix 用户都会首先使用它。


    现在你可以通过输入 `perldoc` 加上章节名来浏览每一个不同的章节：


    ```

    % perldoc delta

    ```


    NAME


    delta - 5.005 的新变化


    DESCRIPTION


    此文档描述了 5.004 和此版本之间的差异


    [...]

    ```


    `perldoc perl` 下看到的章节列表已经按照逻辑顺序排列，方便浏览。以下是我们的快速提示，告诉你根据特定用途使用哪个章节：


    - **perlsyn:** Perl 程序很大程度上由函数调用或运算符处理的变量组成。变量、函数和运算符之间的内容就是语法。在这里你可以找到所有关于例如循环语句如何工作的信息，以及如何在语句后添加
    if 修饰符。

    - **perldata:** 该章节介绍了你可以在程序中创建的所有类型的变量。不过，不要在这里寻找多维数组（Perl 中称为“列表的列表”）；我们稍后会介绍。

    - **perlop:** 在这里你将学习 Perl 极其丰富的运算符，从平凡的 `+` `-` `*` `/` 到应用于字符串的后增（`++`）魔力。这里还有一些你可能想不到会出现在此处的条目：用逗号分隔列表成员、不同的字符串引号方式以及它们内部的插值原理`m//`（匹配）和
    `s///`（替换）运算符如何工作（但它们作为参数接受的正则表达式在 `perlre` 中记录）、使用反引号捕捉程序输出、从文件句柄中读取行，以及浮点数的奥秘。

    - **perlre:** 在这里你可以找到如何编写正则表达式。Perl 拥有任何地方都最强大、功能最全的正则表达式实现。该章节涵盖了从最基础到最高级的所有细节；尽情阅读直到你的头真的要爆炸了为止，剩下的部分等你恢复体力后再读吧。

    - **perllol:** 当你想知道如何实现多维数组或复杂数据结构时，这里就是你的选择。“lol”代表“列表的列表”，


    '
- fmt: "\nwhich strictly speaking is a misnomer since it really means \"arrays or\
    \ hashes of references to arrays or hashes,\" but is considerably more euphonious.\
    \ If you've come from Pascal, Fortran, or C and are wondering where records or\
    \ structs are, look no further. If you want to know all about how to make and\
    \ use the references that enable lists of lists to be built, see `perlref`.\n\n\
    *   `perlsub`: This contains everything you'd want to know about how to write\
    \ your own subroutines (functions or procedures) in Perl and far, far more, including\
    \ entries you might not expect to find, on the local command and typeglobs. Pick\
    \ the parts you need judiciously and save the eye-glazing sections for later.\n\
    \nWe've left out many of the sections to avoid overwhelming you at this stage.\
    \ Head back to `perldoc perl` when you feel up to it to see the more advanced\
    \ ones we omitted.\n\nOne less advanceded section we failed to list is `perlfunc`.\
    \ The reason is that only rarely in your career will you want to peruse `perlfunc`\
    \ in linear order.[8] That's because it consists of an alphabetical list of all\
    \ Perl's myriad built-in functions, many of which you will never need.\n\nFortunately,\
    \ the `-f` option to `perldoc` allows you to name the function you're looking\
    \ for:\n\n[8] That's an understatement. While understatement isn't a documented\
    \ virtue of Perl programmers, it appears to be a virtue of Perl authors.\n\n%\
    \ `perldoc -f split`\n\n```\nsplit /PATTERN/,EXPR,LIMIT\nsplit /PATTERN/,EXPR\n\
    split /PATTERN/\nsplit\n```\n\nSplits a string into an array of strings, and returns\
    \ it.\n\nBy default, empty leading fields are preserved, and empty trailing ones\
    \ are deleted.\n\n[...]\n\nOne last feature of `perldoc` is worth explaining.\
    \ The Perl documentation goes to superhuman lengths to answer frequently asked\
    \ questions, so much so that the FAQ comprises *nine* files. Simply scanning the\
    \ FAQ for a particular topic (and don't assume your question isn't there—it covers\
    \ some broad ground) is a daunting task. But the alternative is to risk being\
    \ scorched by a cast of thousands if you post your question to the Net. So `perldoc`\
    \ makes it a little easier for you to tell if your question is frequently asked\
    \ with the `-q` word option,[9] which searches all the frequently asked questions\
    \ (but not their answers) for word, and then shows you both the questions and\
    \ their answers:\n\n[9] Actually, the argument can be a regular expression.\n\n\
    % `perldoc -q sleep`\n\nFound in `/usr/local/perl/lib/5.6.0/pod/perlfaq8.pod`\n\
    \nHow can I `sleep()` or `alarm()` for under a second?\n\nIf you want finer granularity\
    \ than the 1 second that the `sleep()` function provides, [...]\n\nYou can see\
    \ more information about the Perl FAQ (and the FAQ itself) at [http://perlfaq.cpan.org/](http://perlfaq.cpan.org/).\n\
    \n`perldoc` can also display the source of a module with the `-m` option, which\
    \ saves you the trouble of searching `@INC` for it.\n\nBut what if you're looking\
    \ for something in the entire set of Perl documentation? Time to use the tools\
    \ your computer comes with. To find the POD files that mention \"readline,\"\n\
    \n*   On Unix (using `csh` or a variant):\n    *   % `find `perl -e '$_=\"@INC\"\
    ;s/ \\.|\\. //;print'` `\n    *   `-name \"*.pod\" -print | xargs grep -l readline`\n\
    \    *   `/usr/local/perl/lib/5.00503/pod/perldebug.pod`\n    *   `/usr/local/perl/lib/5.00503/pod/perlfaq5.pod`\n\
    \    *   `/usr/local/perl/lib/5.00503/pod/perlfunc.pod`\n    *   `/usr/local/perl/lib/5.00503/pod/perlmodlib.pod`\n\
    \    *   `/usr/local/perl/lib/5.00503/pod/perlop.pod`\n    *   `/usr/local/perl/lib/5.00503/pod/perltoc.pod`\n\
    \    *   `/usr/local/perl/lib/5.00503/pod/perltrap.pod`\n\n    Explanation: We\
    \ tell Perl to print the directories in which it searches for modules, remove\
    \ the current directory from the list, then use the list as the argument to the\
    \ `find` command to search for POD files whose names are printed by `grep` if\
    \ they contain a match. These files should all be in the same directory, so once\
    \ you know what it is, you can just `grep` in that directory and dispense with\
    \ the `find`. (But remember that `find` command if later on you want to search\
    \ all the `.pm` files for something.) To get more relevant hits for common terms,\
    \ pipe the results through another `grep` that searches for `=head;` then you'll\
    \ find matches only in headings.\n\n*   On Windows:\n    In ActiveState Perl,\
    \ navigate to the HTML directory under the root of the installation and use Tools\
    \ -> Find in the Explorer to look for all files named `*.html` containing the\
    \ text readline. If you have another build of Perl that didn't create\n    ![Image\
    \ 12](index-16_1.jpg)\n    HTML files from all the PODs, navigate to the root\
    \ of the installation and find files named `.pod`.\n\n*   On the Macintosh:\n\
    \    Use `shuck`. (See the next section.)\n\n### 1.5.3 Perl Documentation in MacPerl\n\
    \nThe Perl port to the Macintosh by Matthias Neeracher includes a simple GUI utility\
    \ application—`shuck`—to view POD files.[10] As shown in Figure 1-1, `shuck` reads\
    \ a POD file, then renders a properly formatted version of.\n\n**Figure 1-1: Theperl\
    \ viewed in shuck**\n\n### 1.6 References\n\nLearn the ins and outs of Perl (in\
    \ order of importance):\n\n*   *Programming Perl*, by LarryWall, ThomasChristen\
    \ (O'Reilly, 2000)\n*   *Object Oriented Perl*, by DamianConway (Manning, 1999)\n\
    *   *Effective Perl*, by JosephSchwartz (Addison-Wesley, 1998)\n    ![Image 13](index-17_1.jpg)\n\
    *   *The Perl Cookbook*, by ThomasTington (O'Reilly, 1998)\n*   *Mastering Regular\
    \ Expressions*, by JeffreyFriedl (O'Reilly, 1997)\n*   *Perl 5 Pocket Reference*,\
    \ 3rd ed., by JohanVomans (O'Reilly, 2000)\n*   [http://search.cpan.org/](http://search.cpan.org/)\
    \ Access to Comprehensive Archive Network\n*   [http://www.perldoc.com/](http://www.perldoc.com/)\
    \ Access to standard documentation\n\n### Chapter 2. The Zen of Perl Developing\n\
    \n\"Wild nights are my glory.\"\n\n— *A Wrinkle in Time, by Madeleine L'Engle*\n\
    \n![Image 14](index-18_1.jpg)\n\n![Image 15](index-18_2.jpg)\n\n#### First know\
    \ yourself; then your programs will be easier to know.\n\nGo out and about among\
    \ programmers, and soon you discover some are better than others—a lot better.\
    \ It has been a source of fascination to us as why there is such variation in\
    \ performance—we're talking about orders of magnitude differences in speed, accuracy,\
    \ and maintainability between the best and the worst for any given task—and we've\
    \ come to learn that most of that difference is due to *attitudes,* *beliefs,*\
    \ and *behaviors* that set them apart from the rest.\n\nYes, talent and innate\
    \ intelligence count for a lot, but less than you might think. Yes, knowledge\
    \ and experience are required for creating quality programs, but they can be enervated\
    \ by poor attitudes and limiting beliefs.\n\nThis is good news! Because wise people\
    \ know that they can change their attitudes, beliefs, and behaviors, and know\
    \ how.\n"
  raw: 'which strictly speaking is a misnomer since it really means "arrays or hashes
    of references to arrays or hashes," but is considerably more euphonious. If you''ve
    come from Pascal, Fortran, or C and are wondering where records or structs are,
    look no further. If you want to know all about how to make and use the references
    that enable lists of lists to be built, see **perlref.**


    • **perlsub:** This contains everything you''d want to know about how to write
    your own subroutines (functions or procedures) in Perl and far, far more, including
    entries you might not expect to find, on the local command and typeglobs. Pick
    the parts you need judiciously and save the eye-glazing sections for later.


    We''ve left out many of the sections to avoid overwhelming you at this stage.
    Head back to perldoc perl when you feel up to it to see the more advanced ones
    we omitted.


    One less advanced section we failed to list is perlfunc. The reason is that only
    rarely in your career will you want to peruse perlfunc in linear order.[8] That''s
    because it consists of an alphabetical list of all Perl''s myriad built-in functions,
    many of which you will never need.


    Fortunately, the -f option to perldoc allows you to name the function you''re
    looking for:


    [8] That''s an understatement. While understatement isn''t a documented virtue
    of Perl programmers, it appears to be a virtue of Perl authors.


    % **perldoc -f split**


    split /PATTERN/,EXPR,LIMIT


    split /PATTERN/,EXPR


    split /PATTERN/


    split


    Splits a string into an array of strings, and returns it.


    By default, empty leading fields are preserved, and empty


    trailing ones are deleted.


    [...]


    One last feature of perldoc is worth explaining. The Perl documentation goes to
    superhuman lengths to answer frequently asked questions, so much so that the FAQ


    comprises *nine* files. Simply scanning the FAQ for a particular topic (and don''t
    assume your question isn''t there—it covers some broad ground) is a daunting task.
    But the alternative is


    to risk being scorched by a cast of thousands if you post your question to the
    Net. So perldoc makes it a little easier for you to tell if your question is frequently
    asked with the -


    q word option,[9] which searches all the frequently asked questions (but not their
    answers) for word, and then shows you both the questions and their answers:


    [9] Actually, the argument can be a regular expression.


    % **perldoc -q sleep**


    Found in /usr/local/perl/lib/5.6.0/pod/perlfaq8.pod


    How can I sleep() or alarm() for under a second?


    If you want finer granularity than the 1 second that the


    sleep() function provides, [...]


    You can see more information about the Perl FAQ (and the FAQ itself) at


    [http://perlfaq.cpan.org/](http://perlfaq.cpan.org/).


    perldoc can also display the source of a module with the -m option, which saves
    you the trouble of searching @INC for it.


    But what if you''re looking for something in the entire set of Perl documentation?
    Time to use the tools your computer comes with. To find the POD files that mention
    "readline,"


    • On Unix (using csh or a variant):


    • % **find `perl -e ''$_="@INC";s/ \.|\. //;print''` \**


    • **-name "*.pod" -print | xargs grep -l readline**


    • /usr/local/perl/lib/5.00503/pod/perldebug.pod


    • /usr/local/perl/lib/5.00503/pod/perlfaq5.pod


    • /usr/local/perl/lib/5.00503/pod/perlfunc.pod


    • /usr/local/perl/lib/5.00503/pod/perlmodlib.pod


    • /usr/local/perl/lib/5.00503/pod/perlop.pod


    • /usr/local/perl/lib/5.00503/pod/perltoc.pod


    • /usr/local/perl/lib/5.00503/pod/perltrap.pod


    Explanation: We tell Perl to print the directories in which it searches for modules,
    remove the current directory from the list, then use the list as the argument
    to the find command to search for POD files whose names are printed by grep if
    they contain a match. These files should all be in the same directory, so once
    you know what it is, you can just grep in that directory and dispense with the
    find. (But remember that find command if later on you want to search all the .pm
    files for something.) To get more relevant hits for common terms, pipe the results
    through another grep that searches for =head; then you''ll find matches only in
    headings.


    • On Windows:


    In ActiveState Perl, navigate to the HTML directory under the root of the installation
    and use Tools -> Find in the Explorer to look for all files named *.html containing
    the text readline. If you have another build of Perl that didn''t create


    ![Image 12](index-16_1.jpg)


    HTML files from all the PODs, navigate to the root of the installation and find
    files named *.pod.


    • On the Macintosh:


    Use shuck. (See the next section.)


    **1.5.3 Perl Documentation in MacPerl**


    The Perl port to the Macintosh by Matthias Neeracher includes a simple GUI utility
    application—shuck—to view POD files.[10] As shown in Figure 1-1, shuck reads a
    POD file, then renders a properly formatted version of the file in a standard
    Mac floating window.


    [10] Again, refer to the Getting Perl section in the Preface for instructions
    on how to obtain MacPerl.


    **Figure 1-1\. The macperl POD file viewed in shuck**


    **1.6 References**


    Learn the ins and outs of Perl programming from (in rough order of importance):


    • *Programming Perl*, 3rd ed., by LarryWall, Tom Christiansen and JonOrwant (O''Reilly
    & Associates, 2000)


    • *Object Oriented Perl*, by Damian Conway (Manning Publications, 1999).


    • *Effective Perl Programming*, by Joseph Hall with RandalSchwartz (Addison-Wesley,
    1998).


    ![Image 13](index-17_1.jpg)


    • *The Perl Cookbook*, by Tom Christiansen and NathanTorkington (O''Reilly & Associates,
    1998).


    • *Mastering Regular Expressions*, by JeffreyFriedl (O''Reilly & Associates, 1997).


    • *Perl 5 Pocket Reference*, 3rd ed., by JohanVromans (O''Reilly & Associates,
    2000).


    • [http://search.cpan.org/](http://search.cpan.org/) Access to finding modules
    in the Comprehensive Perl Archive Network.


    • [http://www.perldoc.com/](http://www.perldoc.com/) Access to the standard documentation
    and much more.


    **Chapter 2\. The Zen of Perl Developing**


    "Wild nights are my glory."


    — *Mrs. Whatsit in* A Wrinkle in Time, *by Madeleine L''Engle* We''ve come to
    realize there are two sides to programming: the left-brain, formal minutiae of
    creating smart code; and the right-brain, soft, touchy-feely stuff that goes on
    in your head.


    Most programmers would rather ignore the touchy-feely stuff because it''s just
    Not Their Thing. However, we''ve found that it''s more important than the rational
    left-brain information, because it affects everything you do. So we''re going
    to cover the soft stuff first, because it''s what happens first in your head.
    This leads us to a touchy-feely Perl of Wisdom:


    ![Image 14](index-18_1.jpg)


    ![Image 15](index-18_2.jpg)


    **First know yourself; then your programs will be easier to know.**


    Go out and about among programmers, and soon you discover some are better than
    others—a lot better. It has been a source of fascination to us as to why there
    is such variation in performance—we''re talking about orders of magnitude differences
    in speed, accuracy, and maintainability between the best and the worst for any
    given task—and we''ve come to learn that most of that difference is due to *attitudes,*
    *beliefs,* and *behaviors* that set them apart from the rest.


    Yes, talent and innate intelligence count for a lot, but less than you might think.
    Yes, knowledge and experience are required for creating quality programs, but
    they can be enervated by poor attitudes and limiting beliefs.


    This isn''t just psychobabble; I see it all the time in my classes. It''s common
    to see people with a problem freeze at the keyboard, unable to take any action.
    They''re afraid that if they experiment, they''ll break something. They''re suffering
    from a limiting belief that the computer is more fragile than it really is.


    This is good news! Because wise people know that they can change their attitudes,
    beliefs, and behaviors, and know how.'
