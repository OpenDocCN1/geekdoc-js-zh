    **13.5.1 Taint mode**


    Perl provides a powerful mechanism for securing your CGI programs. It''s called
    *taint mode,* and no program you put on the Web should be without it. You invoke
    it with the -T flag, making the first line of your scripts


    #!/usr/bin/perl -wT


    (Of course, the path to your perl may differ.)


    Taint mode doesn''t actually do anything by itself to secure your program. What
    it does is force you to address every place where a security hole could occur.
    You see, the chief cause of security holes in CGI programs is malicious user inputs
