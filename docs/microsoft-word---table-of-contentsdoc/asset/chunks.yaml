  trans: '

    到目前为止，软件领域最占主要的资源成本并不是 CPU 速度、RAM 或磁盘空间；而是人。人们在开发、文档、维护、继承、阅读、移植、修改、增强、理解或调试应用程序上花费的时间，是信息技术中最宝贵且稀缺的资源。因此，我们在此之前的的建议一直集中在如何开发应用程序以最好地利用这些时间。


    此外，不要低估摩尔定律对你者的帮助。换句话说，如果你正在开发的应用程序在一年半后才会运行，那么到那时处理器的速度将翻倍，RAM 的价格将减半，磁盘驱动器的容量将增加一倍。如果你能用开发者的时间换采购资金（很奇怪的是，很多公司对员工时间的贬值程度远高于其硬件，尽管它们的银行账户并不知道这种区别），并且该问题可以通过更好的硬件更廉价地解决，那就尽管去做吧。


    以后会有很多机会练习编写高效程序，因为有时你真的没有足够的资源来运行它们，那时你就不得不让它们运行得更好。然而，无论你在开发什么，都不要假设你预先知道自己可能会耗尽哪种资源。上述的资深人士知道，即使是他们中最优秀的人，预测此类事情的能力也是臭名的不可靠的。[1]


    [1] 这并不是说资源限制在某些不是显而易见的。如果你正在归档整个万维网，你可能在开始之前就应该担心磁盘空间。（如果你*确实*在使用 `Perl` 归档整个万维网，请给我们留言；我们有几个问题要问你。）


    我们将展示如何针对速度、内存或磁盘空间优化你的程序。


    然而，这些并不是独立的变量；它们通常存在权衡（例如，以牺牲磁盘空间为代价获取内存）。同样常见的是并行增益：例如，当你改进代码风格时，由于内存访问的减少，内存占用可能会降低，执行速度可能会提高。


    ## 11.2 基准测试（Benchmark It!）


    因为通常通过观察代码很难看出瓶颈在哪里（尤其是由于瓶颈可能会根据你的硬件配置而移动），你必须能够客观地测量它们。你可能别无选择使用操作系统的原生工具，特别是测量虚拟内存的使用情况。（参见
    `Perl of Wisdom #29`）。在这方面，我们承认自己在各种 Unix 平台上的经验远比在 Macintosh 或 Windows 上丰富得多。[2]


    [2] 我们尝试在 Windows 98 上使用名为 `prcview` 的免费工具测量进程大小，结果令我们非常困惑。似乎几十个进程中的每一个都使用了至少
    20 MB 内存。


    ### 11.2.1 测量内存占用


    大多数 Unix 变体中都提供的 `top` 程序非常适合确定当前进程消耗多少处理器时间和虚拟内存。若要从脚本内部收集相同的信息，或者如果你的 `top`
    仅限 root 使用，请使用 `ps` 程序获取编号为 `pid` 的进程信息。在 `SYSV` 系统上，使用 `ps -lp pid`；在 `BSD` 系统上，使用
    `ps u pid`。（你通常可以在 `SYSV` 上重复使用 `-w` 标志或在 BSD 上使用 `w` 标志来查看更多被截断的命令列。）在每情况下，都有列标记为
    `SZ`（或 `VSZ`）和 `RSS`。粗来说，它们分别是进程正在使用的总虚拟内存和使用的物理内存量，单位都是 KB。请注意，Unix 进程分配的内存在其终止之前永远不会减少；每当它释放内存时，它只让该进程稍后再次重用。（它不会返回到其他进程使用的空池。）


    我有一个每小时报告一次体量的庞大长程序刚刚显示了：


    ```

    USER PID %CPU %MEM SZ RSS TT S START TIME COMMAND

    peter 28679 51.9 48.5 35248 30072 ? S 08:42:02

    279:33 [truncated]

    ```


    这显示它的总内存占用为 35 MB，其中 30 MB 在物理内存中。（输出经过了微调，因为 `ps` 输出的列实际上连在了一起。）因为它遇到过内存不足的问题，这提供了周期性的统计数据，告诉我它实际使用了多少。


    如果你想监控你自己的 Perl 脚本的进度，请用 `$$` 代替 `pid`：`printf "Current virtual memory: %sk\n",
    unpack(''@24A5'', (`ps u $$`)[1];`


    （你必须使用的实际 unpack 模板可能根据你的 `ps` 而不同。通过在列表上下文中对反引号使用下标，我们可以忽略 `ps$` 输出的标题行。）你可以像这样使用
    `ps` 来查看你的程序在执行时实际使用的内存。（并记住，在 Unix 上，无论你在程序中释放了多少内存，进程大小永远不会减小。你的进程永远不会比它最大的内存分配要小。）


    在 MacOS 下，从 Apple 菜单访问“关于本机”。一个图形显示了每个进程分配的内存和使用比例（见图 11-1）。


    **图 11-1. MacOS 下的内存占用**


    ### 11.2.2 测量 CPU 占用


    当然，同样的 `ps` 或 `top` 命令也会告诉你进程使用了多少 CPU 和运行时间。你也可以使用 `time` 命令查看：


    ```

    time myprog

    0.050u 0.180s 3.68

    ```


    这说明 `myprog` 花费了 3.68 秒时间，但 CPU 仅花费了 0.23 秒。


    '
- fmt: "\nWe can see that there's no difference in setting an element to `undef` or\
    \ `1`, but there *is* a significant improvement in setting all the elements at\
    \ once to `1` with a hash slice and an even bigger improvement in using a hash\
    \ slice to set them all to `undef` (presumably because we aren't taking the time\
    \ to form a large list on the right-hand side). This tidbit can come in handy\
    \ when we're using a hash just to test for existence; we can set the keys using\
    \ a hash slice without having to set the values and later test for existence with\
    \ `exists`.\n\nWell, wait a minute. Might there be a performance hit from using\
    \ the `exists` function rather than testing the truth of the hash value? Why guess\
    \ when we can benchmark it?\n\n```\nuse Benchmark;\n\nmy %h;\n\n@h{map int rand\
    \ 1000, 1..100} = (1) x 100;\n\ntimethese (1000000,\n\n{ exists => '$x++ if exists\
