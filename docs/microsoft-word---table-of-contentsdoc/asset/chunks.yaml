  trans: "\n\n仿佛这还不够似的——这些 Perl 程序员确实很懒惰[3]——Perl 还提供了更多实用工具来自动完成测试框架的构建。`h2xs` 程序会为新的\
    \ Perl 模块创建一个骨架目录树（尽管在急需情况下它也可以被用于应用程序），包括一个 `Makefile.PL` 文件和一个骨架测试脚本 `test.pl`。\n\
    \n[3] 记住，这是一种美德。\n\n当你通过 `perl` 运行此文件时（你通常需要对其进行一些修改，以反映你的模块所需的额外文件和依赖项），它会生成一个大得多的\
    \ `makefile`（尽管尺寸在今天的 makefiles 中很典型）。该 `makefile` 包含一个测试目标，它会在 `test.pl` 上运行\
    \ `Test::Harness::runtests`。如果你在创建 makefile 之前创建一个名为 `t` 的子目录，`make test` 就会将该目录下所有以\
    \ `.t` 结尾的文件都包含在 `runtests` 中。\n\n这里有一个简单的示例，展示了所有这些是如何协同运作的。假设我们要创建一个模块，导出一个将颜色名称转换为其数值的函数。在许多\
    \ Unix 系统上，文件 `rgb.txt` 中有一个转换表，通常存储在 `/usr/lib/X11`，所以我们直接将其用于。我们将此包命名为 `ColorConv`，因此从\
    \ `h2xs` 开始：\n\n```bash\nh2xs -XA -n ColorConv\nWriting ColorConv/ColorConv.pm\n\
    Writing ColorConv/Makefile.PL\nWriting ColorConv/test.pl\nWriting ColorConv/Changes\n\
    Writing ColorConv/MANIFEST\n```\n\n然后我们进入新目录 `ColorConv` 并开始编辑 `ColorConv.pm`。\n\
    \n你会发现它已经已经填充了文档占位符和一个框架，我们在接下来的版本中去掉了这些内容，以只展示我们的代码：\n\n```perl\npackage ColorConv;\n\
    \nuse strict;\n\nmy %COLOR;\n\nif (open COLORS, '/usr/lib/X11/rgb.txt')\n{\n \
    \   while (<COLORS>)\n    {\n        next unless my ($r, $g, $b, $name) = /^\\\
    s*(\\d+)\\s+(\\d+)\\s+(\\d+)\\s+(.*)/;\n        $name =~ tr/ //d;\n        $COLOR{lc\
    \ $name} = sprintf \"#%02X%02X%02X\", $r, $g, $b;\n    }\n    close COLORS;\n\
    }\nelse\n{\n    warn \"Can't open color file ($!), translations impossible\\n\"\
    ;\n}\n\nsub conv\n{\n    $COLOR{lc shift} || 'Unknown';\n}\n\n1;\n```\n\n你会注意到它还为你创建了一个\
    \ `test.pl`。虽然它默认没有使用 `Test.pm`，但我们将修改它使其使用：\n\n```perl\n#!/usr/bin/perl -w\n\n\
    use strict;\n\nuse ColorConv;\nuse Test;\n\nmy %color = (\n    bisque => '#FFE4C4',\n\
    \    tomato1 => '#FF6347',\n    red => '#FF0000',\n    green => '#00FF00',\n \
    \   blue => '#0000FF',\n    plum => '#DDA0DD',\n    puce => 'Unknown');\n\nplan\
    \ tests => scalar keys %color;\n\nfor (keys %color)\n{\n    ok(ColorConv::conv($_),\
    \ $color{$_});\n}\n```\n\n现在当我们运行它时，输出如下：\n\n```\n1..7\nok 1\nok 2\nok 3\nok 4\n\
    ok 5\nok 6\nok 7\n```\n\n如果我们现在就创建 makefile（通过 `perl Makefile.PL`），那么当我们输入 `make\
    \ test` 时就会看到这些内容。然而，如果我们先创建一个子目录 `t`，并将 `test.pl` 放在 `t/testcol.t` 中，那么在运行 `make\
    \ test` 时，我们可以通过 `Test::Harness` 获得更高层次的视角：\n\n```bash\nmake test\nPERL_DL_NONLAZY=1\
    \ /usr/bin/perl -Iblib/arch -Iblib/lib -I/usr/lib/perl5/5.6.0/i586-linux -I/usr/lib/perl5/5.6.0\
    \ -e 'use Test::Harness qw(&runtests $verbose); $verbose=0; runtests @ARGV;' t/*.t\n\
    t/testcol...........ok\nAll tests successful.\n```\n\n在这种情况下，`testcol.t` 是 `t`\
    \ 目录中唯一的 `.t` 文件。如果我们在那里放入更多文件，每一个都将按顺序运行，因此我们可以构建一套回归测试套件。\n\n你应该如何编写回归测试？这是一个简单得欺骗的问题。Jarkko\
    \ Hietaniemi 的建议是：“尝试破坏你自己的代码。给函数/程序提供太少或过多的参数、类型错误的参数（例如，在期望文件时提供目录）。在期望数字时提供\
    \ `undef`、空值或巨大的标量、字符串，反之亦然。要得‘邪恶’一点。”你会发现，当我们添加一个测试时，我们铭记了那个建议，即添加不存在的（在我们看来是不公平的）颜色\
    \ `puce` 导致了正确类型的错误。你的回归测试应该尽可能地测试你的代码可能产生的所有失败模式。\n\n当你输入 `make test` 时，Perl\
    \ 使用此框架运行大约 *12,000* 次测试。\n\n### 6.3.1 覆盖分析\n\n在此处，我们可能想确定我们是否真的测试了应用程序中的所有代码，或者遗漏了什么。CPAN\
    \ 模块 `Devel::Coverage` 由 Randy J. Ray 编写。\n\n```perl\n# 这是对逻辑的简化表示\n在此处，我们可能想确定我们是否真的测试了\n\
    # 应用程序中的代码，或者遗漏了什么。\n```\n\nCPAN 模块 `Devel::Coverage` 由 Randy J. Ray 编写。（注意：原文在此节包含了一些重复/乱码的数据字符串，已清理）。\n\
    \n### 6.4 饱和测试\n\n对于字符串输入，Perl 可以简洁地生成给定长度的随机字符串：\n\n```perl\nmy @visible = grep\
    \ /[print:]]/ map chr, 0..255;\nsub randstring { join '', map $visible[rand @visible],\
    \ 1 .. shift }\n```\n\n以及给定长度的全字母字符串：\n\n```perl\nsub permstring { 'a'x$_[0] ..\
    \ 'z'x$_[0] }\n```\n\n尽管对于长度约为五的情况这并不可用。参见 `String::Random`。\n\n### 6.5 验收测试\n\
    \n你需要向客户交付代码，我们之前构建的 makefile 包含了几个目标：\n\n- `tardist`：创建一个 Unix tar 文件（如果你不在 Unix\
    \ 上，则会将文件转换为 Unix 格式）。\n- `dist`：默认为 `DIST_DEFAULT`，后者又默认为 `tardist`。\n- `uutardist`：创建一个\
    \ uuencode 的 tar 包（适用于电子邮件）。\n- `zipdist`：使用 `ZIP` 指定的程序创建一个压缩发行文件。\n\n可以通过 `perldoc\
    \ ExtUtils::MakeMaker` 获取 makefile 的完整文档。\n\n### 6.6 References\n\n- *Improving\
    \ Software Quality*, by Lowell Jay Arthur (Wiley & Sons, 1993)\n- *Extreme Programming\
    \ Explained*, by Kent Beck (Addison-Wesley, 1999)\n- *Code Complete*, by Steve\
    \ McConnell (Microsoft Press, 1993)\n- *The Art of Software Testing*, by Glenford\
    \ J. Meyers (Wiley & Sons, 1979)\n\n"
- fmt: "\nAn interactive, command-line-oriented debugger fails the practical definition\
    \ of an instrument of torture, but this distinction appears too fine for many\
    \ otherwise fearless, capable programmers who shiver and cringe with despair when\
    \ asked to use one. Debuggers, while not inherently evil, do seem rather esoteric,\
    \ and their use more an art form than a practical skill.\n\nI've had people in\
    \ my classes who thought debuggers were tools to remove bugs from their code.\
    \ If only this were so. Therefore it probably bears explaining that, contrary\
    \ to its name, a debugger is merely a device that allows you to execute a program\
    \ incrementally while having an opportunity to examine and change its internal\
    \ state as it does so.\n\nThis concept is not new with Perl. Interactive debuggers\
    \ like the one in Perl have been around for decades, and the only thing special\
    \ about Perl's is the degree of access it gives you to its internals, allowing\
    \ you to create a customized debugging interface if you wish (more on this later).\n\
    \n## 7.1 Basic Operation\n\nNormally perl runs your program unhindered, but the\
    \ debugger is a way of allowing both perl and you to run your program together.\
    \ At any point in the execution of your program you can have perl pause and tell\
    \ you what it has done so far. Think of the Perl run-time system as a mouse that\
    \ gobbles up a trail of bread crumbs that are the opcodes of your program. The\
    \ debugger allows you to tell the mouse to stop at points of your choosing and\
    \ interrogate it as to the contents of its digestive system. And if you don't\
    \ like the values of some of the variables, you can change them (we will not attempt\
    \ to extend our metaphor to include this).\n\nIn fact, the debugger for Perl is\
    \ a plugin written using hooks enabled by the `-d` flag. It's possible to write\
    \ programs that do things with those hooks other than present an interactive command\
    \ line-oriented interface, and several people have done so. We've already seen\
    \ one example, Devel::Coverage in Chapter 6, and we'll visit Devel::DProf in Chapter\
    \ 11.\n\n## 7.2 Starting\n\nThe `-d` command line option makes your script run\
    \ under the debugger. You can either add it to the options in the `#!` line at\
    \ the beginning of your script, or you can override the options by explicitly\
    \ running the script through perl. So for example, if `wombat.pl` currently has\
    \ the `-w` option set, you can either change its first line to\n\n```\n#!/usr/bin/perl\
    \ -wd\n```\n\nor you can type\n\n```\n% perl -wd wombat.pl\n```\n\n debug it without\
    \ having to change the script. Unlike some debuggers, with this one you supply\
    \ arguments to the program on the command line, not as part of a debugger command;\
    \ for example:\n\n```\n% perl -wd wombat.pl kangaroo platypus wallaby\n```\n\n\
    The debugger will announce itself and provide a prompt:\n\n```\nLoading DB routines\
    \ from perl5db.pl version 1.07\nEmacs support available.\nEnter h or `h' for help.\n\
    main::(wombat.pl:1): my $marsupial = shift;\nDB<1>\n```\n\nFrom now on we will\
    \ elide everything before the first prompt (and the code on which it is stopped)\
    \ when reproducing debugger sessions.\n\nTo begin, let's look at some simple commands.\
    \ The very first of interest, of course, is `h` for help. The output from this\
    \ is several screens long, which gives us an opportunity to mention an option\
    \ we can apply to all commands: put a vertical bar (`|`) before any command and\
    \ it will run the output through your pager (the program that prints things one\
    \ screen at a time, waiting for you to tell it when to continue—more or less more\
    \ or less).\n\n### 7.2.1 Watch the Code Execute: s, n, r\n\nEnter this simple\
    \ program into `debug.pl`:\n\n```perl\n#!/usr/local/bin/perl -w\nuse strict;\n\
    \nmy @parole = qw(Salutations Hello Hey);\n\nprint_line(@parole);\n\nprint \"\
    Done\\n\";\n\n# Our subroutine accepts an array, then prints the\n# value of each\
    \ element appended to \"Perl World.\"\nsub print_line\n{\n    my @parole = @_;\n\
    \    foreach (@parole)\n    {\n        print \"$_ Perl World\\n\";\n    }\n}\n\
    ```\n\nNow run it under the debugger and step through the program one statement\
    \ at a time using the `n` (next) command:\n\n```\n% perl -dw debug.pl\nmain::(debug.pl:4):\
    \ my @parole = qw(Salutations Hello\nHey);\nDB<1> n\nmain::(debug.pl:6): &print_line(@parole);\n\
    DB<1> n\nSalutations Perl World\nHello Perl World\nHey Perl World\nmain::(debug.pl:7):\
    \ print \"Done\\n\";\nDB<1> n\nDone\nDebugged program terminated. Use q to quit\
    \ or R to restart,\nuse O inhibit_exit to avoid stopping after program termination,\
    \ h q, h R or h O to get additional info.\nDB<1> q\n```\n\nBefore the prompt,\
    \ the debugger prints the source line(s) containing the statement to be executed\
    \ in the next step. (If you have more than one executable statement in a line,\
    \ it prints the line each time you type `n` until it's done executing all the\
    \ statements on the line.) Notice the output of our program going to the terminal\
    \ is intermingled with the debugger text. Notice also when we called `print_line(@parole)`,\
    \ we executed all the statements in the subroutine before we got another prompt.\n\
    \n(From now on, we won't reproduce the optimistic Debugged program terminated\
    \ blurb printed by the debugger.)\n\nSuppose we wanted to step through the code\
    \ inside subroutines like `print_line`. That's the reason for `s` (single step).\
    \ Let's see how it's used, with another handy command, `r`:\n\n```\n% perl -d\
    \ debug.pl\nmain::(debug.pl:4): my @parole = qw(Salutations Hello Hey);\nDB<1>\
    \ s\nmain::(debug.pl:6): print_line(@parole);\nDB<1> n\nmain::(debug.pl:13): my\
    \ @parole = @_;\nDB<1> n\nmain::(debug.pl:14): foreach (@parole)\nDB<1> n\nmain::(debug.pl:15):\
    \ print \"$_ Perl World\\n\";\nDB<1> r\nSalutations Perl World\nHello Perl World\n\
    Hey Perl World\nmain::(debug.pl:7): print \"Done\\n\";\nDB<1> s\nDone\nDebugged\
    \ program terminated.\n```\n\nThe effect of `r` is to execute all the code up\
    \ to the end of the current. (All these command letters are copied from existing\
    \ Unix debuggers and are mnemonic—next, step, return). In addition, note that\
    \ just hitting return as a command repeats the last `n` or `s` command (and if\
    \ there hasn't been one, it does nothing).\n\n### 7.2.2 Examining Variables: p,\
    \ x, V\n\nStepping through code is dandy, but how do we check our variables' values?\
    \ Use either `p expression` to print the result of the expression (which is equivalent\
    \ to printing to `DB::OUT`, so expression is put in list context) or `x variable`,\
    \ which prints a variable in a pleasantly formatted form, following references.\
    \ Once again, with the simple program:\n\n```\n% perl -wd debug.pl\nmain::(debug.pl:4):\
    \ my @parole = qw(Salutations Hello Hey);\nDB<1> p @parole\nDB<2> n\nmain::(debug.pl:6):\
    \ print_line(@parole);\nDB<2> p @parole\nSalutationsHelloHey\nDB<3> x @parole\n\
    0 'Salutations'\n1 'Hello'\n2 'Hey'\n```\n\nIn the first command, we instruct\
    \ the debugger to print the value of `@parole`. However, the `@parole` assignment\
    \ has yet to execute, so nothing comes out. Step past the assignment and then\
    \ print the value with `p`; we see the current state of the array in a list format.\
    \ Print the array value with `x`, and we see the individual elements formatted\
    \ with array indices (a pretty print). This might look familiar if you've been\
    \ playing with the Data::Dumper module we referenced in Chapter 5\\. In fact,\
    \ the output of `x` is intentionally very similar.\n\nYou can see all of the dynamic\
    \ variables in a given package (default: main::) with the `V` command. This isn't\
    \ as useful as it sounds because, unlike the `x` or `p` commands, it won't show\
    \ you any lexical variables (which you declared with `my`). Yet you want to make\
    \ as many of your variables as possible lexical (see Perl of Wisdom #8). Unfortunately\
    \ there is no (easy) way to dump out all the lexical variables in a package, so\
    \ you're reduced to printing the ones you know about.\n"
  raw: 'An interactive, command-line-oriented debugger fails the practical definition
    of an instrument of torture, but this distinction appears too fine for many otherwise
    fearless, capable programmers who shiver and cringe with despair when asked to
    use one. Debuggers, while not inherently evil, do seem rather esoteric, and their
    use more an art form than a practical skill.


    I''ve had people in my classes who thought debuggers were tools to remove bugs
    from their code. If only this were so. Therefore it probably bears explaining
    that, contrary to its name, a debugger is merely a device that allows you to execute
    a program incrementally while having an opportunity to examine and change its
    internal state as it does so.


    This concept is not new with Perl. Interactive debuggers like the one in Perl
    have been around for decades, and the only thing special about Perl''s is the
    degree of access it gives you to its internals, allowing you to create a customized
    debugging interface if you wish (more on this later).


    **7.1 Basic Operation**


    Normally perl runs your program unhindered, but the debugger is a way of allowing
    both perl and you to run your program together. At any point in the execution
    of your program you can have perl pause and tell you what it has done so far.
    Think of the Perl run-time system as a mouse that gobbles up a trail of bread
    crumbs that are the opcodes of your program. The debugger allows you to tell the
    mouse to stop at points of your choosing and interrogate it as to the contents
    of its digestive system. And if you don''t like the values of some of the variables,
    you can change them (we will not attempt to extend our metaphor to include this).


    In fact, the debugger for Perl is a plugin written using hooks enabled by the
    -d flag. It''s possible to write programs that do things with those hooks other
    than present an interactive command line-oriented interface, and several people
    have done so. We''ve already seen one example, Devel::Coverage in Chapter 6, and
    we''ll visit Devel::DProf in Chapter 11.


    **7.2 Starting**


    The -d command line option makes your script run under the debugger. You can either
    add it to the options in the #! line at the beginning of your script, or you can
    override the options by explicitly running the script through perl. So for example,
    if wombat.pl currently has the


    -w option set, you can either change its first line to


    #!/usr/bin/perl -wd


    or you can type


    % **perl -wd wombat.pl**


    to debug it without having to change the script. Unlike some debuggers, with this
    one you supply arguments to the program on the command line, not as part of a
    debugger command; for example:


    % **perl -wd wombat.pl kangaroo platypus wallaby**


    The debugger will announce itself and provide a prompt:


    Loading DB routines from perl5db.pl version 1.07


    Emacs support available.


    Enter h or `h h'' for help.


    main::(wombat.pl:1): my $marsupial = shift;


    DB<1>


    From now on we will elide everything before the first prompt (and the code on
    which it is stopped) when reproducing debugger sessions.


    To begin, let''s look at some simple commands. The very first of interest, of
    course, is h for help. The output from this is several screens long, which gives
    us an opportunity to mention an option we can apply to all commands: put a vertical
    bar (|) before any command and it will run the output through your pager (the
    program that prints things one screen at a time, waiting for you to tell it when
    to continue—more or less more or less).


    **7.2.1 Watch the Code Execute: *s, n, r***


    Enter this simple program into debug.pl:


    #!/usr/local/bin/perl -w


    use strict;


    my @parole = qw(Salutations Hello Hey);


    print_line(@parole);


    print "Done\n";


    # Our subroutine accepts an array, then prints the


    # value of each element appended to "Perl World."


    sub print_line


    {


    my @parole = @_;


    foreach (@parole)


    {


    print "$_ Perl World\n";


    }


    }


    Now run it under the debugger and step through the program one statement at a
    time using the n (next) command:


    % **perl -dw debug.pl**


    main::(debug.pl:4): my @parole = qw(Salutations Hello


    Hey);


    DB<1> **n**


    main::(debug.pl:6): &print_line(@parole);


    DB<1> **n**


    Salutations Perl World


    Hello Perl World


    Hey Perl World


    main::(debug.pl:7): print "Done\n";


    DB<1> **n**


    Done


    Debugged program terminated. Use q to quit or R to restart,


    use


    O inhibit_exit to avoid stopping after program termination, h q, h R or h O to
    get additional info.


    DB<1> **q**


    Before the prompt, the debugger prints the source line(s) containing the statement
    to be executed in the next step. (If you have more than one executable statement
    in a line, it prints the line each time you type n until it''s done executing
    all the statements on the line.) Notice the output of our program going to the
    terminal is intermingled with the debugger text. Notice also when we called print_line(@parole),
    we executed all the statements in the subroutine before we got another prompt.


    (From now on, we won''t reproduce the optimistic Debugged program terminated blurb
    printed by the debugger.)


    Suppose we wanted to step through the code inside subroutines like print_line.
    That''s the reason for s (single step). Let''s see how it''s used, along with
    another handy stepping command, r (return):


    % **perl -d debug.pl**


    main::(debug.pl:4): my @parole = qw(Salutations Hello


    Hey);


    DB<1> **n**


    main::(debug.pl:6): print_line(@parole);


    DB<1> **s**


    main::print_line(debug.pl:13): my @parole = @_;


    DB<1> **n**


    main::print_line(debug.pl:14): foreach (@parole)


    main::print_line(debug.pl:15): {


    DB<1>


    main::print_line(debug.pl:16): print "$_ Perl World\n"; DB<1> **r**


    Salutations Perl World


    Hello Perl World


    Hey Perl World


    void context return from main::print_line


    main::(debug.pl:7): print "Done\n";


    DB<1> **s**


    Done


    Debugged program terminated.


    The effect of r is to execute all the code up to the end of the current subroutine.
    (All these command letters are copied from existing popular Unix command line
    debuggers and are mnemonic—next, step, return). In addition, note that just hitting
    carriage return as a command repeats the last n or s command (and if there hasn''t
    been one yet, it does nothing).


    **7.2.2 Examining Variables: *p, x, V***


    Stepping through code is dandy, but how do we check our variables'' values? Use
    either p *expression* to print the result of the expression (which is equivalent
    to printing to the filehandle $DB::OUT, so *expression* is put in list context)
    or x *variable* , which prints a variable in a pleasantly formatted form, following
    references. Once again, with the simple program:


    % **perl -wd debug.pl**


    main::(debug.pl:4): my @parole = qw(Salutations Hello


    Hey);


    DB<1> **p** **@parole**


    DB<2> **n**


    main::(debug.pl:6): print_line(@parole);


    DB<2> **p** **@parole**


    SalutationsHelloHey


    DB<3> **x** **@parole**


    0 ''Salutations''


    1 ''Hello''


    2 ''Hey''


    In the first command, we instruct the debugger to print the value of @parole.
    However, the


    @parole assignment has yet to execute, so nothing comes out. Step past the assignment
    and then print the value with p; we see the current state of the array in a list
    format. Print the array value with x, and we see the individual elements formatted
    with array indices (a pretty print).


    This might look familiar if you''ve been playing with the Data::Dumper module
    we referenced in Chapter 5\. In fact, the output of x is intentionally very similar.


    You can see all of the *dynamic* variables in a given package (default: main::)
    with the V


    command. This isn''t as useful as it sounds because, unlike the x or p commands,
    it won''t show you any *lexical* variables (which you declared with my). Yet you
    want to make as many of your variables as possible lexical ones (see Perl of Wisdom
    #8). Unfortunately there is no (easy) way to dump out all the lexical variables
    in a package, so you''re reduced to printing the ones you know about.'
