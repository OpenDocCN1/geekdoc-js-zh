    **7.2.10 Optimization**


    Although the Perl debugger displays lines of code as it runs, it''s important
    to note that these are not what actually executes. Perl internally executes its
    compiled opcode tree, which doesn''t always have a contiguous mapping to the lines
    of code you typed, due to the processes of compilation and optimization. If you
    have used interactive debuggers on C code in the past, you may be familiar with
    this process.


    When debugging C programs on VAX/VMS, it was common for me to want to examine
    an important variable only to get the message that the variable was not in memory
    and had been "optimized away."


    Perl has an optimizer to do as good a job as it can—in the short amount of time
    people will wait for compilation—of taking shortcuts in the code you''ve given
    it. For instance, in a process called *constant folding,* it does things like
    build a single string in places where you concatenate various constant strings
    together so that the concatenation operator need not be called at run-time.


    The optimization process also means that perl may execute opcodes in an order
    different from the order of statements in your program, and therefore when the
    debugger displays the


    current statement, you may see it jump around oddly. As recently as version 5.004_04
    of perl, this could be observed in a program like the following: 1 my @a = qw(one
    two three);


    2 while ($_ = pop @a)


    3 {


    4 print "$_\n";


    5 }


    6 1;


    See what happens when we step through this, again using perl 5.004_04 or earlier:
    main::(while.pl:1): my @a = qw(one two three);


    DB<1> **n**


    main::(while.pl:6): 1;


    DB<1>


    main::(while.pl:4): print "$_\n";


    DB<1>


    three


    main::(while.pl:2): while ($_ = pop @a)


    DB<1>


    main::(while.pl:4): print "$_\n";


    DB<1>


    two


    In fact, if we set a breakpoint for line 6 and ran to it, we''d get there before
    the loop executed at all. So it''s important to realize that under some circumstances,
    what the debugger tells you about where you are can be confusing. If this inconveniences
    you, upgrade.


    **7.2.11 Another "Gotcha"**


    If you set a lexical variable as the last statement of a block, there is no way
    to see what it was set to if the block exits to a scope that doesn''t include
    the lexical. Why would code do that? In a word, *closures.* For example,


    { # Start a closure-enclosing block


    my $spam_type; # This lexical will outlive its block


    sub type_spam


    {


    # ...


    $spam_type = $spam_types[complex_func()];


    }


    }


    In this case, either type_spam or some other subroutine in the closure block would
    have a good reason for seeing the last value of $spam_type. But if you''re stepping
    through in the debugger, you won''t see the value it gets set to on the last line
    because, after the statement executes, the debugger pops out to a scope where
    $spam_type is not in scope (unless


    ![Image 51](index-86_1.jpg)


    type_spam() was called from within the enclosing block). Unfortunately, in this
    case, if the result of the function is not used by the caller, you''re out of
    luck.


