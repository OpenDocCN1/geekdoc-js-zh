    ## 4.2 优先级殿堂


    Perl 拥有复杂的优先级排序；能够快速查阅是有帮助的（幸运的是，它是 `perldoc perlop` 输出第一个内容）。我们在这里重现了该表（表 4-1），因为我们会引用它。


    ### 表 4-1. Perl 运算符的优先级和结合性


    | 结合性 | 运算符 |

    | :--- | :--- |

    | 左结合 | 终端和列表运算符（左向） |

    | 左结合 | `->` |

    | 非结合 | `++`, `--` |

    | 右结合 | `**` |

    | 右结合 | `!`, `~` 以及一元 `+` 和 `-` |

    | 左结合 | `=~`, `!~` |

    | 左结合 | `*`, `/`, `%`, `x` |

    | 左结合 | `+`, `-`, `.` |

    | 左结合 | `<<`, `>>` |

    | 非结合 | 命名一元运算符和文件测试运算符 |

    | 非结合 | `<`, `<=`, `>=`, `lt`, `gt`, `le`, `ge` |

    | 非结合 | `==`, `!=`, `<=>`, `eq`, `ne`, `cmp` |

    | 左结合 | `&` |

    | 左结合 | `|`, `^` |

    | 左结合 | `&&` |

    | 左结合 | `||` |

    | 非结合 | `..`, `…` |

    | 右结合 | `?:` |

    | 右结合 | `=`, `op=` |

    | 左结合 | `,`, `=>` |

    | 非结合 | 列表运算符（右向） |

    | 右结合 | `not` |

    | 左结合 | `and` |

    | 左结合 | `or`, `xor` |


    *结合性*告诉你在表达式中连续出现的多个相同优先级运算符的计算顺序。因此，算术表达式 `3 - 4 + 5` 的计算方式为 `(3 - 4) + 5`，因为虽然
    `-` 和 `+` 具有相同的优先级，但它们是左结合的，这意味着最左侧的元素优先最右侧的元素。


    “非结合”（Nonassoc）意味着运算符不结合；换句话说，如果不加括号，你不能连续使用多个运算符来产生有效的含义。所以虽然某些语言允许你写 `[5]`


    [5] Peter 学习的第一语言之一是 BCPL，它允许这样做。


    ```

    if (0 <= $percent <= 100)

    ```


    Perl 不是其中之一。[6]


    [6] 目前尚未如此。这在 Perl 6 中被讨论过。


    正如 `perlop` 手页所说，“借自 C 的运算符彼此之间保持相同的优先级关系，即使 C 的优先级稍微有点古怪。”事实证明，C 的某些优先级规则之所以被选择是为了匹配其前身
    B 语言，即使那些规则也有些古怪。（向后兼容有其陷阱。）因此，C 中大多数优先级陷阱都被 Perl 继承了。例如，如果你正在检查一个包含逻辑或在一起的标志选择的变量是否等于某个候选值（我们将在第
    5 章中这样做），那么这一行：


    ```

    warn "Database opened\n" if ($opt_D & $DB_LOG != 0)

    ```


    有一个不幸的缺陷，因为它的计算方式是 `warn "Database opened\n" if ($opt_D & ($DB_LOG != 0))`。因此，如果
    `$opt_D` 是 6，而 `$DB_LOG` 是 2，那么 warn 语句将被错误地忽略，因为 `2 != 0` 结果为 1，而 `1 & 6` 是 0，即假。


    解决办法在于简单：


    ```

    warn "Database opened\n" if ($opt_D & $DB_LOG)

    ```


    代价是牺牲了微小的清晰度。


    这里另一个优先级结合函数参数周围可选括号导致我们麻烦的例子：


    ```

    vec $v, $offset, 32 = 1; # 错误

    ```


    程序员认为既然 `vec` 的原型是 `$$$`，那么其参数的处理在 32 之后就会结束，这没有意识到 `=` 的优先级高于分隔列表参数的逗号。因此 Perl
    将其解析为：


    ```

    vec($v, $offset, (32 = 1));

    ```


    并抛出错误：


    ```

    Can''t modify constant item in scalar assignment.

    ```


    还有哪些优先级陷阱在追踪 Perl 程序员？后面还有几个。


    ### 4.2.1 正则绑定


    假设你想检查数组的下一个元素是否匹配正则表达式，你写道：


    ```

    if (shift @marsupials =~

    /platypus|wallaby|(kanga)?roo|joey/) ...

    ```


    这会导致一个警告（带 `-w` 时）和一个错误：


    ```

    Applying pattern match to @array will act on scalar(@array)..

    Type of arg 1 to shift must be array (not pattern match)...

    ```


    原因：绑定运算符 `=~` 在表 4-1 中位于“命名一元运算符”之上。所以它尝试将正则表达式绑定到 `@marsupials`（这会将数组置于标量语文中，因此产生警告），然后
    shift 正则匹配的结果（导致了错误）。


    ![Image 36](img/index-48.jpg)


    幸运的是，有许多正确编写的方法，这种陷阱不太可能意外遇到。像所有的优先级误解一样，插入括号是解决它的方法之一：


    ```

    if (shift(@marsupials) =~

    /platypus|wallaby|(kanga)?roo|joey/)

    ```


    **在不确定优先级时使用括号。**


    ### 4.2.2 键上的算术


    假设你有一个哈希 `%h`，你想知道它有多少个元素，所以你输入：


    ```

    print "Number of elements: " . keys %h . "\n";

    ```


    逻辑完美地认为点号会强制键进入标量语境，从而返回 `%h` 的数量而不是列表。然而，Perl 的响应是：


    ```

    Type of arg 1 to keys must be hash (not concatenation)

    ```


    扫一眼表 4-1 我们发现“命名一元运算符”的优先级低于 `.`；因此 Perl 将语句解析为 `print "Number of elements: "
    . keys (%h."\n");`，这对于 Perl 来说毫无意义。我们可以通过将第二个点改为逗号来轻松地解决它：


    ```

    print "Number of elements: " . keys %h, "\n";

    ```


    （这个逗号被评估为表 4-1 中的“右向列表运算符”。）当然，我们可以将此推广到所有命名一元运算符（原型接受单个参数的函数）。查阅 `perlfunc` 手页以找到它们。


    ## 4.4 杂项


    ### 4.4.1 自动实例化


    你通常不会仅仅通过查看某个值来改变它的值。所以，当这种情况发生时（即使有充分理由），值得注意它以备防范。*自动实例化”（Autovivification）是一个高级的
    Perl 术语，你可以用来装装朋友。这意味着在需要时某些变量会自动为你创建。Perl 在创建多维数据结构方面语法非常友好。例如，假设你正在填充 4.1.3
    节中的哈希 `%state_info`；你有第一级键是州缩写，第二级键是州属性名称，其中之一是大城市。


    你可以直接插入这些城市的条目：


    ```

    $state_info{NY}{Megalopoles} = [''New York'',


    ''Albany'',


    ''Rochester''];

    ```


    '
- fmt: "\nWhat's remarkable about this is how easy it is. A C programmer getting to\
    \ know Perl would look at this and say, \"Er, don't you need to at least insert\
    \ a reference to a hash in the first-level value before this …?\" What they mean\
    \ is, the preceding code reveals that the values of `%state_info` are references\
    \ to hashes; if `$state_info{NY}` doesn't exist yet, then why doesn't the assignment\
    \ above blow up when it tries to dereference an undefined value to find where\
    \ the value for the second-level key `Megalopoles`? To do the same in C, a programmer\
    \ would first have to `malloc` a new `state_info` struct with a field of `NY`,\
    \ insert it into a binary tree, `malloc` another struct with a field of `Megalopoles`,\
    \ insert a pointer to it in the previous struct, then `malloc` three more structs\
    \ with the city names, link them into a list, and put a pointer to the head of\
    \ the list in the `Megalopoles` struct. Pant, pant.\n\nThat Perl doesn't blow\
    \ up is another example of its philosophy of, \"Don't throw an exception if you\
    \ can do something useful.\" When the assignment above is executed, Perl will\
    \ look to see if there is a key `NY` in the `%state_info` hash; if there isn't\
    \ (or if there is but the corresponding value is `undef`), it will create one\
    \ with a value containing a reference to an anonymous hash with a key `Megalopoles`\
    \ and a value of a reference to an anonymous array containing the three listed\
    \ cities. Now you know what autovivification is.\n\nWhat does this have to do\
    \ with the Heisenbergian lead-in to this section? Well, sometimes when you're\
    \ just looking to see if a second- (or third-, etc.) level hash key exists, Perl\
    \ can't help but create a first-level value through this autovivification process.\
    \ For instance, my `%state_info;` # So you know it's empty at this point\n\n```perl\n\
    print \"The Big Apple is here!\\n\"\n\nif exists $state_info{NY}{Megalopoles};\n\
    \nuse Data::Dumper;\n\nprint Dumper \\%state_info;\n```\n\nprints\n\n```\n$VAR1\
    \ = {\n'NY' => {}\n}\n```\n\n![Image 37](index-50_1.jpg)\n![Image 38](index-50_2.jpg)\n\
    \nIn other words, just looking to see whether the key `Megalopoles` existed caused\
    \ Perl to autovivify the intermediate hash. The documentation says that this behavior\
    \ may be fixed in a future release of Perl, but it also appears to be extremely\
    \ hard to do so.\n\n**Before testing the existence of a lower-level hash key,\
    \ test the existence of the higher-level keys if there's a chance they may be\
    \ absent.**\n\nWe'll talk more about the useful `Data::Dumper` module in Chapter\
    \ 5.\n\n## 4.4.2 split\n\nThe `split` function deserves its own section. It has\
    \ almost enough special cases to qualify as its own programming language. Our\
    \ first potential gotcha emerges when we're validating a Unix passwd file for\
    \ the correct number of fields on each line:\n\n```perl\n@ARGV = '/etc/passwd';\n\
    \nwhile (<>)\n{\n    print \"Wrong # of fields in line $.\\n\"\n    unless split\
    \ /:/ == 7;\n}\n```\n\nOur first problem is that this doesn't find any of the\
    \ lines that have the wrong number of fields; it silently fails. We've just created\
    \ another precedence problem: referring back to Table 4-1, we see that list operators\
    \ have a lower precedence than the `==` operator, and `split` is a list operator;\
    \ therefore we've just given it a first argument of `:/ == 7`.\n\nBy changing\
    \ the `unless` clause to `split(/:/) == 7`, we create working code, but, alas,\
    \ not silent code. With warnings enabled, perl prints `Use of implicit split to\
    \ @_ is deprecated` because `split` in a scalar context for legacy reasons puts\
    \ its result into the `@_` array, and this is behavior that the Perl maintainers\
    \ would like to eliminate one day.\n\nWe do not want our code to cause warnings,\
    \ however benign.\n\n**Eliminate all causes of warning messages in a program before\
    \ proceeding with further development.**\n\nClearly we cannot call `split` in\
    \ a scalar context without causing the warning; therefore we have two choices:\
    \ either disable warnings:\n\n```perl\n@ARGV = '/etc/passwd';\n\nwhile (<>)\n\
    {\n    local $^W; # Set warning flag to undef for this block\n    print \"Error\
    \ on line $.\\n\" unless split /:/ == 7;\n}\n```\n\nor call it in a list context:\n\
    \n[7] If you want to do this without using a temporary variable, we applaud the\
    \ sentiment. However, the solution is `print \"Error on line $.\\n\" unless (()\
    \ = split (/:/, $_, 7)) == 7`, which is anything but sentimental.\n\n```perl\n\
    @ARGV = '/etc/passwd';\n\nwhile (<>)\n{\n    my @split = split /:/;\n    print\
    \ \"Error on line $.\\n\" unless @split == 7;\n}\n```\n\nA common split mistake\
    \ is to supply a string literal as the first argument and expect it to split on\
    \ that string. However, the argument is still interpreted as a regular expression\
    \ and if it contains metacharacters, the behavior is unexpected. The most common\
    \ occurrence of this appears to be trying to use `split '|'` to split on a vertical\
    \ bar (which makes a good field separator), but instead it is interpreted as regex\
    \ alternation and winds up splitting on every character.\n\nThe other split gotcha\
    \ we want to bring to your attention is the behavior of a pattern of `//`. Anywhere\
    \ else you used a regex of `//`, it would mean, \"Repeat the last regular expression\"\
    \ (which is another gotcha). But in a `split`, that pattern always means, \"Split\
    \ the string.\"\n\n## 4.4.3 Reserved Words\n\nPerl reserves a few words in all-caps\
    \ for various reasons. The full list is large but includes identifiers used as\
    \ subroutines:\n\n- `AUTOLOAD`\n- `BEGIN`\n- `CHECK`\n- `CORE`\n- `DATA`\n- `DESTROY`\n\
    - `END`\n- `GLOBAL`\n- `INIT`\n- `EQ`\n- `GE`\n- `GT`\n- `LE`\n- `LT`\n- `NE`\n\
    - `CONSTANT`\n- `FILEHANDLE`\n- `LOOP`\n- `PRIDE`\n- `ENVY`\n- `GLUTTONY`\n- `LUST`\n\
    - `ANGER`\n- `GREED`\n- `SLOTH`\n- `OBFUSCATION`\n\nYou should not name any subroutine\
    \ with all-caps, because it has far greater chance of being interpreted as a special\
    \ routine. From 5.6.0, filehandles can be put into scalars with `open my $fh,\
    \ $filename;` which is much cleaner than using `FILEHANDLE`. On a related note,\
    \ be aware of the names of Perl's built-in functions or you could run into this:\n\
    \n```perl\n#!/usr/bin/perl -wl\nuse strict;\n\nsub sin\n{\n    (qw(Pride Envy\
    \ Gluttony Lust Anger Greed Sloth Obfuscation))[_0]+1;\n}\n\nprint sin(5);\n```\n\
    \nwhich produces `Ambiguous call resolved as CORE::sin(), at ./sin line 9.-958924274663138`.Perl\
    \ found a conflict between the subroutine you declared and its built-in function\
    \ `sin` (which does something different) and resolved it in favor of the latter.\
    \ Worse yet, if we had declared our version of `sin` *after* the call we made\
    \ to it, while this normally wouldn't matter, in this case it would mean we wouldn't\
    \ even get the ambiguity warning.[8]\n\n[8] In other words, there's just no escaping\
    \ the original `sin`.\n\nThere are several things we can do about this possibility.\
    \ First, we can become familiar with Perl's built-in function names so that we\
    \ don't give a subroutine the same name as one.\n\nSecond, we can declare our\
    \ subroutines before the code that uses them, so we'll be warned of any conflicts.\
    \ Note we say *declare,* not *define:* you can insert a forward declaration anywhere\
    \ by omitting the code block. This also lets you use subroutine prototypes: `sub\
    \ version ($$);` # Declares\n\n# Time passes...\n\n`version 1, 5;`\n\n![Image\
    \ 39](index-53_1.jpg)\n\n# More time passes...\n\n`sub version ($$)` # Defines\n\
    `{ my ($major, $minor) = @_; #...; }`\n\nThird, we could call all our own subroutines\
    \ with an `&` prefix, which will prevent confusion with a built-in. We don't like\
    \ this solution personally, because it's visually less appealing to us, but it\
    \ could be very useful to a newcomer.\n"
  raw: 'What''s remarkable about this is how easy it is. A C programmer getting to
    know Perl would look at this and say, "Er, don''t you need to at least insert
    a reference to a hash in the first-level value before this …?" What they mean
    is, the preceding code reveals that the values of


    %state_info are references to hashes; if $state_info{NY} doesn''t exist yet, then
    why doesn''t the assignment above blow up when it tries to dereference an undefined
    value to find where the value for the second-level key Megalopoles is? To do the
    same in C, a programmer would first have to malloc a new state_info struct with
    a field of NY, insert it into a binary tree, malloc another struct with a field
    of Megalopoles, insert a pointer to it in the previous struct, then malloc three
    more structs with the city names, link them into a list, and put a pointer to
    the head of the list in the Megalopoles struct. Pant, pant.


    That Perl doesn''t blow up is another example of its philosophy of, "Don''t throw
    an exception if you can do something useful." When the assignment above is executed,
    Perl will look to see if there is a key NY in the %state_info hash; if there isn''t
    (or if there is but the corresponding value is undef), it will create one with
    a value containing a reference to an anonymous hash with a key Megalopoles and
    a value of a reference to an anonymous array containing the three listed cities.
    Now you know what autovivification is.


    What does this have to do with the Heisenbergian lead-in to this section? Well,
    sometimes when you''re just looking to see if a second- (or third-, etc.) level
    hash key exists, Perl can''t help but create a first-level value through this
    autovivification process. For instance, my %state_info; # So you know it''s empty
    at this point


    print "The Big Apple is here!\n"


    if exists $state_info{NY}{Megalopoles};


    use Data::Dumper;


    print Dumper \%state_info;


    prints


    $VAR1 = {


    ''NY'' => {}


    ![Image 37](index-50_1.jpg)


    ![Image 38](index-50_2.jpg)


    };


    In other words, just looking to see whether the key Megalopoles existed caused
    Perl to autovivify the intermediate hash. The documentation says that this behavior
    may be fixed in a future release of Perl, but it also appears to be extremely
    hard to do so.


    **Before testing the existence of a lower-level hash key, test the** **existence
    of the higher-level keys if there''s a chance they may be** **absent.**


    We''ll talk more about the useful Data::Dumper module in Chapter 5.


    **4.4.2 split**


    The split function deserves its own section. It has almost enough special cases
    to qualify as its own programming language. Our first potential gotcha emerges
    when we''re validating a Unix passwd file for the correct number of fields on
    each line:


    @ARGV = ''/etc/passwd'';


    while (<>)


    {


    print "Wrong # of fields in line $.\n"


    unless split /:/ == 7;


    }


    Our first problem is that this does''t find any of the lines that have the wrong
    number of fields; it silently fails. We''ve just created another precedence problem:
    referring back to Table 4-1, we see that list operators have a lower precedence
    than the == operator, and split is a list operator; therefore we''ve just given
    it a first argument of /:/ == 7.


    By changing the unless clause to split(/:/) == 7, we create working code, but,
    alas, not silent code. With warnings enabled, perl prints Use of implicit split
    to


    @_ is deprecated because split in a scalar context for legacy reasons puts its
    result into the @_ array, and this is behavior that the Perl maintainers would
    like to eliminate one day.


    We do not want our code to cause warnings, however benign.


    **Eliminate all causes of warning messages in a program before** **proceeding
    with further development.**


    Clearly we cannot call split in a scalar context without causing the warning;
    therefore we have two choices: either disable warnings:


    @ARGV = ''/etc/passwd'';


    while (<>)


    {


    local $^W; # Set warning flag to undef for this block print "Error on line $.\n"
    unless split /:/ == 7;


    }


    or call it in a list context:[7]


    [7] If you want to do this without using a temporary variable, we applaud the
    sentiment. However, the solution is print "Error on line $.\n" unless (() = split
    (/:/, $_, 7)) == 7, which is anything but sentimental.


    @ARGV = ''/etc/passwd'';


    while (<>)


    {


    my @split = split /:/;


    print "Error on line $.\n" unless @split == 7;


    }


    A common split mistake is to supply a string literal as the first argument and
    expect it to split on that string. However, the argument is still interpreted
    as a regular expression and if it contains metacharacters, the behavior is unexpected.
    The most common occurrence of this appears to be trying to use split ''|'' to
    split on a vertical bar (which makes a good field separator), but instead it is
    interpreted as regex alternation and winds up splitting on every character.


    The other split gotcha we want to bring to your attention is the behavior of a
    pattern of


    //. Anywhere else you used a regex of //, it would mean, "Repeat the last regular
    expression" (which is another gotcha). But in a split, that pattern always means,
    "Split the string into separate characters."


    **4.4.3 Reserved Words**


    Perl reserves a few words in all capital letters to itself for various reasons.
    The full list is large but includes many identifiers used only as subroutines
    in tied classes, which won''t get in your way. Here are the rest:


    • AUTOLOAD


    • BEGIN


    • CHECK


    • CORE


    • DATA


    • DESTROY


    • END


    • GLOBAL


    • INIT


    The following still exist in 5.6.0 but are deprecated and unlikely to be in the
    next version:


    • EQ, GE, GT, LE, LT, NE


    Different rules govern the contexts in which each of these is given its special
    interpretation; the wisest course of action is not to use any of them for the
    customary uses of all-caps words:


    • Constants created with use constant


    • Filehandles


    • Loop labels


    You should not name any subroutine with all capital letters, because it has a
    far greater chance of being interpreted as a special Perl routine if the names
    are the same. From perl 5.6.0 onwards, filehandles can be put into scalars with
    open my $fh, $filename; which is much cleaner than using the FILEHANDLE syntax,
    especially if you want to pass $fh to a subroutine.


    On a related note, be aware of the names of Perl''s built-in functions (perldoc
    perlfunc), or you could run into this situation:


    #!/usr/bin/perl -wl


    use strict;


    sub sin


    {


    (qw(Pride Envy Gluttony Lust Anger


    Greed Sloth Obfuscation))[$_[0]+1];


    }


    print sin(5);


    which produces


    Ambiguous call resolved as CORE::sin(), qualify as such or use


    &


    at ./sin line 9.


    -0.958924274663138


    Perl found a conflict between the subroutine you declared and its built-in function
    sin (which does something rather different) and resolved it in favor of the latter.
    Worse yet, if we had declared our version of sin *after* the call we made to it,
    while this normally wouldn''t matter, in this case it would mean we wouldn''t
    even get the ambiguity warning.[8]


    [8] In other words, there''s just no escaping the original sin.


    There are several things we can do about this possibility. First, we can become
    familiar with Perl''s built-in function names so that we don''t give a subroutine
    the same name as one.


    Second, we can declare our subroutines before the code that uses them, so we''ll
    be warned of any conflicts. Note we say *declare,* not *define:* you can insert
    a forward declaration anywhere by omitting the code block. This also lets you
    use subroutine prototypes: sub version ($$); # Declares


    # Time passes...


    version 1, 5;


    ![Image 39](index-53_1.jpg)


    # More time passes...


    sub version ($$) # Defines


    {


    my ($major, $minor) = @_;


    #...


    }


    Third, we could call all our own subroutines with an & prefix, which will prevent
    confusion with a built-in. We don''t like this solution personally, because it''s
    visually less appealing to us, but it could be very useful to a newcomer.


    **Declare subroutines early, avoid collisions with the Perl built-in** **functions,
    or call them with &.**'
