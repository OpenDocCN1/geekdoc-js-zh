  trans: "\n使用 `Devel::DProf` 对程序进行性能瓶颈分析。\n\n# 11.3 让变得更好\n\n在这里我们将讨论改进程序资源利用的几种方法。你可以在\
    \ *Programming Perl* 中找到更多简短的描述（第二版第 8 章，第三版第 24 章）。\n\n## 11.3.1 提高执行速度\n\n执行速度的提升通常是以牺牲可读性为代价的。添加查找缓存、重新排列语句顺序以及内联子程序调用会共同降低程序的可维护性；因此，正如我们之前所说的，只有在别无时才做这些事情。\n\
    \n一旦你确定了耗时最长的代码，下一步就是优化这些代码。以下是几个建议。\n\n### 在循环内部，利用一切机会尽早退出循环。\n\n我刚刚正在编写一些代码来解析日志文件，其中包含类似\
    \ 20010208001507:POP3-Server:[198.137.241.43]:gwbush 的行。\n\n循环中的第一条语句是：\n\n```perl\n\
    next unless my ($year, $month, $day, $hour, $minute, $second, $user)\n= /(\\d\\\
    d\\d\\d)(\\d\\d)(\\d\\d)(\\d\\d)(\\d\\d)(\\d\\d):POP3-Server:.*:(.*)/;\n```\n\n\
    这可能是对显而易见的解决方案的自然翻译，但在处理 300 万行的日志文件时有点慢！由于许多输入行并不匹配此模式，我能够在循环开头插入以下这行代码来加速对这些行的过滤：`next\
    \ unless index ($_, ':POP3-Server:') > 0;`（在此之前，我犯了漏掉括号的错误——你能看出为什么那是错的吗？）。\n\n\
    之所以有效，是因为字符串 `:POP3-Server:` 仍然能唯一标识我们需要的的行。\n\n我们还可以做得更多；通常情况下，简单的字符串操作比正则表达式更快，因此我们可以用以下语句接替那行最初开始循环的语句：\n\
    \n```perl\nmy ($year, $month, $day, $hour, $minute, $second)\n= unpack \"A4A2A2A2A2A2\"\
    , $line;\n\nmy ($user) = $line =~ /:POP3-Server:.*:(.*)/;\n```\n\n然而，这个基准测试的结果并没有比之前的代码快。我们可以利用关于该行的另一个信息来获得改进：用户名之前的最后一个字符是\
    \ `]:`，它们在行的其他任何地方都没有出现。对这段代码进行基准测试显示，比替代方案快了 50%：\n\n```perl\nuse Benchmark;\n\
    \n$line = <DATA>;\ntimethese (200000, {\n  'unpack' => q{\nmy ($year, $month,\
    \ $day, $hour, $minute, $second)\n= unpack \"A4A2A2A2A2A2\", $line;\nmy $user\
    \ = substr $line, index ($line, ']:')+2;\n},\n  'regex' => q{\nmy ($year , $month\
    \ , $day, $hour, $minute, $second, $user)\n= ($line =~ /(\\d\\d\\d\\d)(\\d\\d)(\\\
    d\\d)(\\d\\d)(\\d\\d)(\\d\\d):POP3-Server:.*:(.*)/);\n}\n});\n\n__END__\n20010208001507:POP3-Server:[198.137.241.43]:gwbush\n\
    \nBenchmark: timing 200000 iterations of regex, unpack...\nregex: 15 wallclock\
    \ secs (15.63 usr + 0.02 sys = 15.65 CPU)\nunpack: 10 wallclock secs (10.42 usr\
    \ + 0.00 sys = 10.42 CPU)\n```\n\n![Image 74](img/index-129_1.jpg)\n\n### 对带常用参数的函数进行缓存。\n\
    \n使用 Mark-Jason Dominus 的 CPAN 模块 `Memoize` (http://search.cpan.org/search?dist=Memoize)\
    \ 可以透明地记住任何函数调的结果，为你提供了一种以内存换速度的方法。你可以通过创建适当的数据结构并在调用函数之前检查是否存在项在程序中实现相同的操作，且执行开销略小，但\
    \ `Memoize` 允许你只需一行代码即可切换此功能，甚至可以将结果保存到磁盘以使其持久化。\n\n我们可以通过一个查找各种服务器规范 Internet\
    \ 主名的示例来说说明这一点。在例如处理日志文件的应用程序中，对相同的输入多次调用 `gethostbyname` 是很常见的，假设在短时间内（比如几分钟内）结果不会改变是合理的。这里有一个基准测试：\n\
    \n```perl\nuse Benchmark;\nuse Memoize;\n\nsub get_host_info {\n  (gethostbyname\
    \ shift)[0] || 'undefined';\n}\n\nsub get_hosts {\n  for (1..shift) {\n    my\
    \ $true_name = get_host_info \"www.$_.com\"\n    for 'aaa' .. 'abc';\n  }\n}\n\
    \nget_hosts(1); # 预热缓存\ntimethese (200000, {\n  'bare' => q{ get_hosts },\n  'memo'\
    \ => q{ get_host_info }\n});\n```\n"
- fmt: "\nSome operations generate large lists when all you want to do is go through\
    \ the elements one at a time. Structured data can usually be parsed a line at\
    \ a time: `while (<INPUT>) { ... }`\n\nrather than reading the whole file:\n\n\
    ```perl\n{\nlocal $/;\n$file = <INPUT>;\n}\n```\n\nAlthough in the case of data\
    \ that's not structured by lines, that may really be your best choice. The worst\
    \ of both worlds would be to use the wrong loop statement:\n\n```perl\nfor my\
    \ $line (<INPUT>) { ... }\n```\n\nbecause that would read all the lines of the\
    \ file into a list and then iterate through them one at a time.\n\nIf you look\
    \ at that example with scorn, thinking, \"But *I* would never do *that,* \" then\
    \ how about this?\n\n```perl\nfor my $file (grep !/^\\.\\.?$/, readdir DIR) {\
    \ ... }\n```\n\nLooks like an innocent enough standard idiom, and indeed it's\
    \ quite safe, as long as you don't have any directories containing a humongous\
    \ number of entries. But if you do, be aware that it requires temporary storage\
    \ for a list nearly twice the size of those entries. If you'd like to bulletproof\
    \ the code against that contingency, try this:\n\n```perl\nwhile (defined (my\
    \ $file = readdir DIR))\n{\n    next if $file =~ /^\\.\\.?$/;\n    ...\n}\n```\n\
    \nIf you have very large hashes, consider tieing them to a database to trade memory\
    \ for speed and disk space:\n\n```perl\nuse DB_File; # There are several alternatives\
    \ to this\nmy %large_hash;\ntie %large_hash, # The hash to tie\n'DB_File', # The\
    \ type of database to use\n'database'; # The file to store the database in\n#\
    \ use %large_hash...\nuntie %large_hash; # Close the database file\n```\n\nHowever,\
    \ you could easily abnegate your savings by using a common idiom: `for my $key\
    \ (keys %large_hash) { ... }` # wrong!\n\nbecause this will cause Perl to form\
    \ in memory the list of all the keys. Use each instead, because it returns only\
    \ two things at a time (or one, in scalar context): `while (my ($key, $value)\
    \ = each %large_hash) { ... }`\n\n(Although you can't add or delete hash elements\
    \ inside the loop.) If your hash values contain references (your hash keys can't,\
    \ unless you're using the `Tie::RefHash` module), then you should use Gurusamy\
    \ Sarathy's `MLDBM` (MultiLevel Database) module from CPAN [(http://search.cpan.org/search?dist=MLDBM)](http://search.cpan.org/search?dist=MLDBM)).\
    \ Otherwise, the referents to which your references refer will not get stored\
    \ in the database.\n\n![Image 77](index-133_1.jpg)\n\n![Image 78](index-133_2.jpg)\n\
    \n**Avoid unnecessary copying.**\n\nPerl loves to copy data around. When you write\
    \ a subroutine, say `sub bake { my ($temperature, $how_long) = @_; [...] }`, \n\
    \nit's convenient to think of its first line as a kind of prototype, but in fact\
    \ it's copying data. You may need to rethink this approach when passing huge variables\
    \ to a subroutine. Caveat: While it's fine to get your data directly from `@_`,\
    \ be aware that `@_` is an alias for your original arguments; be sure you don't\
    \ modify any of them without documenting the action.\n\nFurthermore, named parameter\
    \ passing works by copying `@_` into a hash; you'll have to come up with another\
    \ way to recognize nonpositional arguments.\n\nSean M. Burke points out another\
    \ application of this principle: Once I wrote a program to do some pretty horrific\
    \ data conversion on an idiosyncratic markup language. Now, line-at-a-time processing\
    \ was right out—the notation was SGML-like, i.e., freeform with its white space.\
    \ Most or all of the manipulation was of the form\n\n```perl\n$lexicon =~ s{<subhead>(.*?)</subhead>}{handle_subhead($1)}ieg;\n\
    ```\n\nThe problem was that `$lexicon` was quite large (250+ KB), and applying\
    \ lots and lots and LOTS of such regex search and replace operations took forever!\
    \ Why? Because all the modifications of a large scalar involved copying it each\
    \ time. One day it occurred to me that no replacement operation involved crossing\
    \ entry boundaries (i.e., record boundaries), so I changed the program to chop\
    \ the lexicon into entries, and then applied the string replacements to each of\
    \ those via a `foreach`. Since each entry was only ~2KB, there was MUCH less painful\
    \ swapping, so the program ran about 50 times faster!\n\n### 11.3.3 Improving\
    \ Disk Space Usage\n\n**Avoid temporary files.**\n\nIf your operating system supports\
    \ pipes, use them. Even if your operating system doesn't support them, Perl on\
    \ your system might; try it.[5]\n\n[5] As of version 5.6.0, `fork` in Perl works\
    \ on Windows.\n\n![Image 79](index-134_1.jpg)\n\nIf one part of your program writes\
    \ a temporary file for another part to read, you can change this to use a pipe\
    \ instead, but only if you can get those two parts of your program to execute\
    \ reasonably concurrently. Otherwise you'll fill up the pipe when you write to\
    \ it, and your program will twiddle its virtual thumbs waiting for the pipe to\
    \ be unclogged. (If you've ever needed a plumber on the weekend, you know the\
    \ feeling.) If you've coded something like this, consider breaking it into two\
    \ separate programs that can be run concurrently and piped together.\n\n# Chapter\
    \ 12. Perl as a Second Language\n\n\"Through the darkness of future past, the\
    \ magician longs to see. One with me!\"— *BOB in Twin Peaks* Many people come\
    \ to Perl after learning one or more other languages. (It is debatable whether\
    \ Perl is a good choice as a first language for a new programmer. In our opinion,\
    \ it is not, and one should first learn a procedural language such as C and an\
    \ object-oriented language such as Java for no other reason than to experience\
    \ that great relief that comes you start programming in Perl.) For those of you\
    \ whose strength lies in one of the languages listed in this chapter, here are\
    \ tips specifically for you.\n\nThere is already much good information in this\
    \ respect in the pertrap manual page; we have not duplicated it here, but urge\
    \ you to look it up. You will also find *Perl: The Programmer's Companion*, by\
    \ Nigel Chapman (Wiley, 1998), to be a good introduction to Perl.\n\n## 12.1 Tips\
    \ for Everyman\n\nYou need to make certain adjustments when coming to Perl from\
    \ more familiar languages:\n\n- Variables begin with type-specifying punctuation\
    \ characters[1] referred to by some as *sigils.* It's not quite the revenge of\
    \ Hungarian notation—no mblkMessages[] here, thank goodness. The hardest thing\
    \ for a Perl beginner to assimilate is that while, for example, `@animals` is\
    \ the name of an array, `$animals[14]` is the name of a particular element in\
    \ it, and `@animals[2..7]` is the name of a slice of that array. Just remember\
    \ the rule that when you're referring to exactly one thing, it is a scalar and\
    \ therefore begins with a $, whereas multiple things are an array—sort of—and\
    \ begin with an @ sign.\n\n[1] Well, most of them. Filehandles don't, unless you\
    \ create one in a scalar with `IO::File` or the new 5.6 feature or assign a typeglob\
    \ alias. And you'd have a hard time telling the difference between an lvaluable\
    \ subroutine and a variable.\n\n- Function arguments don't have to be surrounded\
    \ by parentheses. Putting them in won't hurt, but knowing when you can leave them\
    \ out makes your program easier to read. (See \"The Case of the Vanishing Parentheses\"\
    \ in Chapter 4.)\n\n- Because Perl insists on conditional clauses being blocks,\
    \ there is no \"dangling else\" problem.\n\n## 12.2 Tips for the C Programmer\n\
    \nYou no longer must declare all your variables at the beginning of a block before\
    \ any executable code. In fact, declaring them as late as possible is good practice\
    \ because it keeps statements that belong to the same functional element together.\n"
  raw: 'Some operations generate large lists when all you want to do is go through
    the elements one at a time. Structured data can usually be parsed a line at a
    time: while (<INPUT>) { ... }


    rather than reading the whole file:


    {


    local $/;


    $file = <INPUT>;


    }


    Although in the case of data that''s not structured by lines, that may really
    be your best choice. The worst of both worlds would be to use the wrong loop statement:


    for my $line (<INPUT>) { ... }


    because that would read *all* the lines of the file into a list and then iterate
    through them one at a time.


    If you look at that example with scorn, thinking, "But *I* would never do *that,*
    " then how about this?


    for my $file (grep !/^\.\.?$/, readdir DIR) { ... }


    Looks like an innocent enough standard idiom, and indeed it''s quite safe, as
    long as you don''t have any directories containing a humongous number of entries.
    But if you do, be aware that it requires temporary storage for a list nearly twice
    the size of those entries. If you''d like to bulletproof the code against that
    contingency, try this: while (defined (my $file = readdir DIR))


    {


    next if $file =~ /^\.\.?$/;


    ...


    }


    If you have very large hashes, consider tieing them to a database to trade memory
    for speed and disk space:


    use DB_File; # There are several alternatives to this


    my %large_hash;


    tie %large_hash, # The hash to tie


    ''DB_File'', # The type of database to use


    ''database''; # The file to store the database in


    # use %large_hash...


    untie %large_hash; # Close the database file


    However, you could easily abnegate your savings by using a common idiom: for my
    $key (keys %large_hash) { ... } # wrong!


    because this will cause Perl to form in memory the list of all the keys. Use each
    instead, because it returns only two things at a time (or one, in scalar context):
    while (my ($key, $value) = each %large_hash) { ... }


    (Although you can''t add or delete hash elements inside the loop.) If your hash
    values contain references (your hash keys can''t, unless you''re using the Tie::RefHash
    module), then you should use Gurusamy Sarathy''s MLDBM (MultiLevel Database) module
    from CPAN


    [(http://search.cpan.org/search?dist=MLDBM](http://search.cpan.org/search?dist=MLDBM)).
    Otherwise, the referents to which your references refer will not get stored in
    the database.


    ![Image 77](index-133_1.jpg)


    ![Image 78](index-133_2.jpg)


    **Avoid unnecessary copying.**


    Perl loves to copy data around. When you write a subroutine, say sub bake


    {


    my ($temperature, $how_long) = @_;


    [...]


    it''s convenient to think of its first line as a kind of prototype, but in fact
    it''s copying data. You may need to rethink this approach when passing huge variables
    to a subroutine. Caveat: While it''s fine to get your data directly from @_, be
    aware that @_ is an alias for your original arguments; be sure you don''t modify
    any of them without documenting the action.


    Furthermore, named parameter passing works by copying @_ into a hash; you''ll
    have to come up with another way to recognize nonpositional arguments.


    Sean M. Burke points out another application of this principle: Once I wrote a
    program to do some pretty horrific data conversion on an idiosyncratic markup
    language. Now, line-at-a-time processing was right out—the notation was SGML-like,
    i.e., freeform with its white space. Most or all of the manipulation was of the
    form


    $lexicon =~ s{<subhead>(.*?)</subhead>}


    {handle_subhead($1)}ieg;


    The problem was that $lexicon was quite large (250+ KB), and applying lots and
    lots and LOTS of such regex search and replace operations took forever! Why? Because
    all the modifications of a large scalar involved copying it each time. One day
    it occurred to me that no replacement operation involved crossing entry boundaries
    (i.e., record boundaries), so I changed the program to chop the lexicon into entries,
    and then applied the string replacements to each of those via a foreach. Since
    each entry was only ~2KB, there was MUCH less painful swapping, so the program
    ran about 50 times faster!


    **11.3.3 Improving Disk Space Usage**


    **Avoid temporary files.**


    If your operating system supports pipes, use them. Even if your operating system
    doesn''t support them, Perl on your system might; try it.[5]


    [5] As of version 5.6.0, fork in Perl works on Windows.


    ![Image 79](index-134_1.jpg)


    If one part of your program writes a temporary file for another part to read,
    you can change this to use a pipe instead, but only if you can get those two parts
    of your program to execute reasonably concurrently. Otherwise you''ll fill up
    the pipe when you write to it, and your program will twiddle its virtual thumbs
    waiting for the pipe to be unclogged. (If you''ve ever needed a plumber on the
    weekend, you know the feeling.) If you''ve coded something like this, consider
    breaking it into two separate programs that can be run concurrently and piped
    together.


    **Chapter 12\. Perl as a Second Language**


    "Through the darkness of future past, the magician longs to see. One chants out
    between two worlds, fire walk with me!"


    — *BOB in* Twin Peaks


    Many people come to Perl after already learning one or more other computer languages.
    (It is debatable whether Perl is a good choice as a first language for a new computer
    programmer. In our opinion, it is not, and one should first learn a procedural
    language such as C and an object-oriented language such as Java if for no other
    reason than to experience that great relief that comes when you start programming
    in Perl.) For those of you whose strength lies in one of the languages listed
    in this chapter, here are tips specifically for you.


    There is already much good information in this respect in the perltrap manual
    page; we have not duplicated it here, but urge you to look it up. You will also
    find *Perl: The* *Programmer''s Companion*, by Nigel Chapman (Wiley, 1998), to
    be a good introduction to Perl.


    **12.1 Tips for Everyman**


    You need to make certain adjustments when coming to Perl from more familiar languages:


    • Variables begin with type-specifying punctuation characters[1] referred to by
    some as *sigils.* It''s not quite the revenge of Hungarian notation—no mblock


    *apmblkMessages[] here, thank goodness. The hardest thing for a Perl beginner
    to assimilate is that while, for example, @animals is the name of an array, $animals[14]
    is the name of a particular element in it, and @animals[2..7] is the name of a
    slice of that array. Just remember the rule that when you''re referring to exactly
    one thing, it''s a scalar and therefore begins with a $, whereas multiple things
    are an array—sort of—and begin with an @ sign.


    [1] Well, most of them. Filehandles don''t, unless you create one in a scalar
    with IO::FileHandle or the new 5.6 feature or assign a typeglob alias. And you''d
    have a hard time telling the difference between an lvaluable subroutine and a
    variable.


    • Function arguments don''t have to be surrounded by parentheses. Putting them
    in won''t hurt, but knowing when you can leave them out makes your program easier
    to read. (See "The Case of the Vanishing Parentheses" in Chapter 4.)


    • Because Perl insists on conditional clauses being blocks, there is no "dangling
    else"


    problem.


    **12.2 Tips for the C Programmer**


    You no longer must declare all your variables at the beginning of a block before
    any executable code. In fact, declaring them as late as possible is good practice
    because it keeps statements that belong to the same functional element together.'
