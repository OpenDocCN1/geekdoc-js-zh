    选择清晰的变量名。通常情况下，变量在代码中出现的频率越低（或其作用域越小），它的名称应该越长，因为读者需要更多的提示来记住它的用途。不过，对于循环变量使用单字母变量名（它们有着悠久且卓越的历史）或者对于数学或科学变量使用单字母变量名是没有问题的（`$e=$m*$c**2`
    和 `$energy=$mass*$speed_of_light**2` 一样合理；至少对于任何应该使用这段代码计算这些数值的人来说是如此的）。


    ### 3.2.2 编辑器的帮助


    对于那些担心在程序中通过数数来匹配 `()`、`{}` 和 `[]` 符号会累瞎眼睛的人来说，有一些工具可以让你免于使用白手杖。一个可以帮助美化 Perl
    程序等一些例性工作的智能编辑器会产生奇妙的效果。如果你每删除一个外层块都必须手动重新缩进代码，那么你很可能不会去这样做。Perl 大师们喜欢说：“只有 perl
    能解析 perl”，作为一个推论，没有编辑器足够智能到可以正确地布局所有可能的 Perl 程序。


    有道理；但其中一些已经足够接近且派用用了。


    Peter 最喜欢的之一是 `cperl`，这是一个由 Ilya Zakharevich 维护的 Emacs Perl 模式。


    标准的 Perl 分发版包含一个 `emacs` 目录，其中包含 `cperl-mode.el` 文件。如果你的 Emacs 还没有 `cperl`，请将此文件复制到你存储本地
    Emacs 模式文件的地方（你可以在家目录下的 `.emacs` 文件中为自己设置一个专门的位置）；如果你在那里发现了另一个版本，请确定哪一个 `cperl-mode.el`
    更新。将此行


    ```perl

    (autoload ''perl-mode" "cperl-mode" "alternate mode for editing Perl programs"
    t)

    ```


    插入你的 `.emacs` 文件中，以启用 `cperl-mode` 而不是 Emacs 自带的普通 `perl-mode`。


    `cperl` 会为你匹配各种 `()`、`[]` 和 `{}`。[1] 它还执行语法高亮，所以如果你配置 Emacs 将所有字符串都染成 `puce`，而你的整个文件突然变红了，你就知道某处漏掉了一个引号。最有用的是，它会跟踪括号的嵌套层，按下
    `TAB` 键即可带你到达该行的正确缩进点。这可以捕捉各种类型的拼写错误，例如第 1 行漏掉的分号：


    ```perl

    1 my $marsupial = ''wombat''

    2 my $crustacean = ''king crab'';

    ```


    当你点击第 2 行的 `TAB` 时，错误就会暴露出来：语句没有与第 1 行对齐，而是多缩进了一层，因为当前语句尚未完成。


    不过，`cperl` 也有一些问题：如果你使用 Perl 4 语法，用单引号来分隔包限定标识符中的路径组件，它可能会产生困惑。但只需将单引号（`''`）更改为冒号（`::`），就没事了。在正则表达式的字符类中使用某些字符（如
    `#` 或 `''`）也会让它感到困惑，但在它们前面加上反斜杠（`\`）（即 **backwhacking*）就能解决问题。


    我们喜欢的其他编辑器还有：`vim/gvim`，它在语法高亮方面表现出色，并有一个极佳的 Windows 版本；以及 Macintosh 上的 `BBEdit`。


    关于喜爱编辑器的主题是软件开发中一个具有宗教色彩的话题，你应该预期别人会不同意你的偏好；只要你身边有同样有分量的开发者支持你，你选择什么或别人说什么并不重要。


    你对一个良好的 Perl 编辑器应该期待什么？它应该在你的分隔符不匹配时警告你，它应该根据你想要的样式自动缩进，并且应该尽可能地对你的个人文本编辑需求保持灵活和适应。它既不会在不警告你的情况下插入字符（例如，不可见的二进制格式提示），也不会删除任何字符（例如，末尾空格），除非给你提供选择性或全局禁用此功能的选项。


    ### 3.2.3 双重检查


    无论你的编辑器是否会警告你分隔符不匹配，这里有一个实用的技巧：在输入起始分隔符的同时输入结束分隔符。然后在它们之间插入你需要的内容。从外向内操作，分组分组错误的概率将大大降低。例如，如果你计划写一段最终将变为：`print
    table(map { Tr(map td($_), split /[:\s]+/) } <IN>);`（如果使用 `CGI.pm`，这将从来自文件句柄 `IN`
    的剩余文本打印出一个 HTML 表格，每行一个，由空格和/或冒号分隔的元素形成表格元素），那么你的输入策略将遵循以下步骤：


    1. `print table();`

    2. `print table(map {} <>);`

    3. `print table(map { Tr() } <IN>);`

    4. `print table(map { Tr(map td(), split //) <IN>);`

    5. `print table(map { Tr(map td($_), split /[:\s]+/) } <IN>);`


    ### 3.2.4 清晰


    检查这个简单的单行程序：


    ```perl

    $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n";

    ```


    这并不难理解：初始化 `$x` 和 `$y`，将 `$z` 设置为它们的和，然后打印所有三个。


    假设我们通过调试器跟踪其执行（详细讨论见第 7 章）。


    ```bash

    % perl -de ''$x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"''

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1> **n**

    main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"; DB<1> **n**

    1+2=3

    Debugged program terminated...

    DB<1> **q**

    ```


    我们观察到了什么？调试器打印了单行程序：`main::(-e:1): $x=1; $y=2; $z=$x+$y; print"$x+$y=$z\n"` 打印了
    4 次 `1+2=3`。为什么？调试器显示 perl 执行的下一行代码。将程序重构为每行一个命令：


    ```perl

    $x = 1;

    $y = 2;

    $z = $x+$y;

    print"$x+$y=$z\n";

    ```


    然后使用调试器。你可以将这些行放在文件中，或者使用像 Bourne shell 那样允许在单引号内输入新行的 shell。


    ```bash

    % perl -d dbformat.pl

    ```


    这种“编造内容”是如何显示的？假设某人运行一个包含以下代码的程序用于向他们发送报告：`open MAIL, "|$SENDMAIL $address"`


    ……等等其他；它还允许 Emacs 作为 perl 调试器的前端运行。在 Emacs 中调试将在第 7 章中讨论。


