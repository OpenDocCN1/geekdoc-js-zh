  trans: "\n（如果你是 Perl 的初新手，这一章可能会让你感到有些背发凉。在你对这种语言更熟悉之后，可以随时回来这里看。）让我们来看看这种讨厌的 Bug\
    \ 品的一些示例。\n\n### 10.1 逻辑上不太通\n\nPerl 有几种方式来表示 *and*（和）和 *or*（或）：\n\n**表 10-1.\
    \ Perl 中的 *And*、*Or* 和 *Xor* 运算符**\n\n| 操作 | 类型 | 运算符 |\n| :--- | :--- | :---\
    \ |\n| AND | 位运算（非短路） | `&` |\n| OR | 逻辑（高优先级） | `&&` |\n| OR | 逻辑（低优先级） | `||`\
    \ |\n| XOR | 逻辑（低优先级） | `and`, `or`, `xor` |\n\n（没有高优先级的逻辑异或运算符。）从错误的行中选择运算符的后果通常是令人恼人的错误，例如\
    \ `open (FH, $file) | die \"Error opening $file: $!\\n\";`，无论 `open` 是否成功，它都会报错，因为\
    \ `|` 运算符严格来说是一个位运算或字符串运算符，它会计算两个操作数，以便返回它们位“或”的结果。在这种情况下，你需要 `||`，它是一个逻辑运算符，会评估其左侧，如果为真则返回它；否则它会评估并返回右侧。\n\
    \n![Image 63](img/index-112_1.jpg)\n\n更好的选择是 Perl 5 中引入的 `or` 运算符，它的优先级低到你甚至可以省略\
    \ `open` 上的括号：\n\n```\nopen FH, $file or die \"Error opening $file: $!\\n\";\n\
    ```\n\n### 10.2 读取目录\n\n这个问题让我们坑过的次数比我们愿意承认的多得多：`readdir()` 返回目录中的文件名列表，但它们并没有通过目录本身进行限定。\n\
    \n考虑以下程序：\n\n```perl\nuse strict;\nuse File::stat;\n\nmy $dir = shift || '.';\n\
    \nopendir DIR, $dir or die \"Error opening directory $dir: $!\\n\"; while (defined\
    \ (my $file = readdir DIR))\n{\n    print \"File $file was last modified on \"\
    \n    . localtime(stat($file)->mtime), \"\\n\";\n}\n\nclosedir DIR;\n```\n\n它接受目录作为参数，默认为当前目录。此程序打印当前目录中所有文件的名称和修改时间。\n\
    \n如果不带参数运行，程序运行正常。如果我们接着带一个参数运行它（此示例在 Unix 上），它似乎开始工作了然后失败了：\n`File . was last\
    \ modified on Sun Mar 28 14:36:27 1999`\n`File .. was last modified on Tue Aug\
    \ 3 15:29:12 1999`\n`Can't call method \"mtime\" without a package or object reference`\n\
    `at mod_times.pl line 9.`\n\n发生了什么？\n\n首先，我们看到错误指向第 9 行，并且 perl 试图在一个甚至不是对象上调用\
    \ `mtime` 方法。那个对象是什么？它是调用 `stat($file)` 的结果（在这里我们使用的是 `File::stat` 模块中的 `stat`\
    \ 例程，而不是返回列表的 Perl 核心 `stat` 例程；这避免了我们去查找 `mtime` 元素的索引）。\n\n该函数的规范说，如果 `$file`\
    \ 不存在，`stat` 返回 `undef`，这显然不是一个对象。因此 `$file` 不存在。它不存在的原因是 `$file` 不包含绝对路径，因此被解释为相对于当前目录。当前目录不会包含与通过\
    \ `readdir` 读取的相同的文件，除了每个目录都包含的两个文件（`.` 和 `..`）。这就是为什么我们得到了一些初始输出，看起来好像脚本在工作。其实不是；它报告的是\
    \ `.` 和 `..` 的时间，而不是我们想要的。\n\n修复方法很简单：只需对 `$file` 进行限定：\n\n```perl\nuse strict;\n\
    use File::stat;\n\nmy $dir = shift || '.';\n\nopendir DIR, $dir or die \"Error\
    \ opening directory $dir: $!\\n\"; while (defined (my $file = readdir DIR))\n\
    {\n    print \"File $file was last modified on \"\n    . localtime(stat(\"$dir/$file\"\
    )->mtime), \"\\n\";\n}\n\nclosedir DIR;\n```\n\n即使 `$dir` 是相对路径或包含 `../`，这也是有效的。使用\
    \ `/` 作为目录分隔符在 Unix 和 Windows 上都有效（在后者，Perl 会将其转换为 `\\`）。一种真正的与操作系统无关的路径方法是使用\
    \ `File::Spec` 并将\"$dir/$file\"` 替换为 `File::Spec->catfile($dir, $file)`。\n\n###\
    \ 10.3 这是什么意思？\n\n下面的程序旨在重新打印输入行，并在前面加上跳过周末的递增日期：\n\n```perl\n#!/usr/bin/perl\
    \ -w\nuse strict;\nuse Time::Local;\n\nmy $t = timelocal(0,0,0,31,11,99); # 1999\
    \ 年 12 月 31 日\nwhile (<>)\n{\n    my ($m, $d, $y) = (localtime $t)[4,3,5];\n \
    \   $y %= 100;\n    $m++;\n    print \"$m/$d/$y $_\";\n    dp { $t += 86400 }\
    \ while (localtime $t)[6] == 0\n    || (localtime $t)[6] == 6;\n}\n```\n\n然而，输出显示的日期没有变化：\n\
    \n![Image 64](img/index-114_1.jpg)\n`12/31/99 is the first line`\n`12/31/99 is\
    \ the second line`\n`12/31/99 is the third line`\n"
