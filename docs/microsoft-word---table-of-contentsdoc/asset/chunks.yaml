    ## Appendix A. Perl Debugger Commands


    ![Image 88](index-160_1.jpg)


    "Follow the white rabbit."


    — Trinity in The Matrix


    This appendix addresses the commands available in the Perl internal debugger as
    of version `5.6.0`. It owes most of its content to the `perldebug` pod page and
    the debugger internal help screen.


    ### A.1 General Syntax


    The following apply to all commands entered in the debugger:


    #### A.1.1 Continuation Lines


    A line ending in a backslash (`\`) is concatenated with the next line before evaluation.
    No white space is permitted after the backslash.


    #### A.1.2 Paging


    | command | Description |

    | :--- | :--- |

    | `command` | Run the debugger command, and pipe the debugger output through the
    current pager. |

    | `command` | Run the debugger command, and pipe the program output through the
    current pager. |


    #### A.1.3 Command History


    - `![n]`

    - `![pattern]`


    Run the command number `n` (default: previous command) or the last command that
    started with `pattern`. If `n` is negative, it is the `n` th command before the
    current one. The character can be changed from `!` using the `recallCommand` option
    (discussed later).


    - `H [*- *number]`


    You can display the last `number` commands with the `H` command. Hitting the up
    and down arrow keys usually works to scroll through the command history. Only
    commands longer than one letter are put there.


    #### A.1.4 Shell Interaction


    - `!! command`


    Run `command` in a subshell. You can change the character from `!` using the `shellBang`
    option (discussed later).


    #### A.1.5 Command Aliasing


    - `= [alias command]`


    Make `alias` an alias for `command` ; then list all aliases. If omitted, just
    list all aliases. There is no way to clear aliases.


    ## A.2 Commands


    #### A.2.1 Help


    - `h`

    - `h h`


    Get a verbose or concise help screen, respectively.[1]

    [1] It would be more accurate to say, a concise help screen and an extremely concise
    help screen, respectively.


    - `h command`


    Get a line of help for the given debugger command.


    - `man page`


    View the specified manual page. If your system doesn''t have a `man` command,
    it uses `perldoc`; the command may be overridden by setting the variable `$DB::doccmd`.


    #### A.2.2 Stopping or Restarting


    - `q`

    - `R`


    The `q` command exits the debugger (so does end-of-file on the terminal). The
    `R` command attempts to rerun the program with the state changes you made preserved.
    Some state may be lost; breakpoints, history, actions, option settings, and the
    `-w`, `-I` and `-e` command-line options will be preserved.


    #### A.2.3 Stepping


    - `n [expr]`

    - `s [expr]`

    - `<CR>`

    - `r`


    `n` and `s` single step (over or into subroutine calls respectively). If `expr`
    is provided, then execute and step through that first. A carriage return by itself
    repeats the last `n` or `s`; if there wasn''t, it does nothing. `r` executes code
    until the last statement in the current subroutine.


    #### A.2.4 Examining Package Data


    - `V [package [vars]]`

    - `X [vars]`

    - `S [[! [ ]pattern]`

    - `m expr`


    `V` lists variables in `package` (default: current package). `vars` can be a space-separated
    list. `X` is equivalent to `V current_package`. `S` lists subroutines that match
    (or with `!`, don''t match) the given pattern.


    Global variables like `%ENV` don''t live in a particular package and thus won''t
    be dumped with the `V` or `X` commands; use `x` instead.


    `m` evaluates `expr` in list context and interprets the first element as either
    a class name or an object; it then prints the methods that can be called on it
    (the subroutines in its package and ancestor packages).


    #### A.2.5 Examining Package or Lexical Data


    - `p expr`

    - `x expr`


    `p` evaluates and prints `expr`. `x` evaluates (in list context) `expr`.


    #### A.2.6 Showing Version Information


    - `v`


    The `v` command shows the versions and source locations of loaded modules.


    #### A.2.7 Breakpointing


    - `b [point [condition]]`

    - `b $var`

    - `c [point]`


    `b` sets a breakpoint (default: current line). `c` continues execution; if a location
    is given, it sets a one-time breakpoint. `point` is either a line number or a
    variable that evaluates or points to one. `condition` is a perl expression to
    evaluate whenever the breakpoint is reached.


    - `b load filename`

    - `b compile sub`

    - `b postpone sub`


    The `load` form of `b` breaks when the given file is required. For subroutines
    that haven''t been loaded yet, the `compile` form breaks when the subroutine is
    compiled; the postpone form sets a breakpoint at the first executable line of
    the given subroutine.


    - `d [line]`

    - `D`


    `There is no command to delete a breakpoint by subroutine name or to delete deferred
    breakpoints except for `D`, which deletes all breakpoints. `d` deletes the breakpoint
    at the given line (default: current line).


    #### A.2.8 Actions


    - `a [line [action]]`

    - `A`


    `a` causes the Perl code `action` to be executed whenever the given line is reached
    (default: current line). If `action` is missing, delete any action set for the
    given line. `A` deletes all actions.


    #### A.2.9 Action/Breakpoint Display


    - `L`


    `L` lists all breakpoints and actions.


    #### A.2.10 Stack Display


    - `T`


    `T displays the stack trace (a list of subroutines called on the way to the current
    line, with their respective arguments).


    #### A.2.11 Source listing


    - `l start+ delta`

    - `l begin- end`

    - `l sub`

    - `l $var`

    - `l`

    - `-`


    `l` lists lines of source code: either the next `delta` lines from line number
    `start`, or from line `begin` to line `end`, or a window starting with the first
    line of a given subroutine. `l` by itself lists the next window following the
    one just displayed; `-` (minus) lists the previous window.


    - `w [line]`

    - `.`


    `w` lists a window about the given line number (default: current line), and `.`
    (dot) resets the pointer for window listings to the current line.


    - `f filename`

    - `/pattern/`

    - `?pattern?`


    `f` switches the file being viewed to the named file (which must be loaded), and
    `filename` must be either a full path or a regular expression that will match
    a loaded filename. `/pattern/` and `?pattern?` move the pointer for listings to
    the next (or previous) line matching the pattern.


    #### A.2.12 Tracing


    - `t [expr]`


    Set trace mode on (display lines as they are executed). If `expr` is supplied,
    execute and trace through it.


    #### A.2.13 Watchpoints


    - `W [expr]`

