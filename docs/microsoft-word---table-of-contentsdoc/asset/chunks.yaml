  raw: 'Error messages after the first one may be a cascade effect and therefore may
    be eliminated by removing the cause of the first message. It''s usually not worth
    the time to analyze each message to determine whether this is the case.


    **8.1.5 Transposition**


    Regular expressions provide a fertile breeding ground for typos. Suppose you want
    to match and save the last string of letters preceded by white space on a line:


    /\s([a-z])+$/i


    Looks right, eh? Try it on an example, though:


    while (<DATA>)


    {


    print "Match = $1\n" if /\s([a-z])+$/i;


    }


    __END__


    The boy stood on the burning duck


    What comes out but


    Match = k


    Oops. We wanted the last word, not the last letter. Here''s an approach to debugging
    this problem: We printed $1, which is the text saved between parentheses. We can
    ignore whatever else the regex contains and focus on what''s between the parens,
    i.e., [a-z], which we immediately recognize as a character class that hasn''t
    been qualified with a quantifier. Therefore it can represent only one character,
    which is what we got. (When saving parentheses match more than once in a regex
    because of a quantifier, only the last match gets saved. One might wish for a
    switch that would return all the matches in a list.) As with most typos, identifying
    it is 90% of the goal. The fix is easy to predict: /\s([a-z]+)$/i.


    Here''s a higher-level sort of transposition. Can you tell what it is before reading
    the explanation?


    #!/usr/bin/perl -w


    use strict;


    my $fmt = "%10s "x5;


    printf "$fmt\n", qw(Kelvin Celsius Rankine


    Fahrenheit Reaumur);


    $fmt = "%10.2f "x5;


    for (my $kelvin = 0; $kelvin += 10; $kelvin < 500)


    {


    my $celsius = $kelvin - 273.15;


    my $rankine = $kelvin * 9 / 5;


    my $fahrenheit = $rankine - 459.67;


    my $reaumur = $celsius * 4 / 5;


    printf "$fmt\n",$kelvin,$celsius,$rankine,$fahrenheit, $reaumur;


    }


    Run this, and it does not terminate! You will be calculating temperatures beyond
    those experienced in the Big Bang. But the very first line of output is Useless
    use of numeric lt (<) in void context at temp.pl line 13.


    Weird. Line 13 is the printf statement, and it has no <. According to Perl of
    Wisdom #24, we should start scanning backwards until we find one. There it is
    at the beginning of the for statement: forgivably, we transposed the test and
    iterative clauses.


    If you''d like to know why Perl fingered line 13 and not line 7 (the for statement),
    you''ll find an explanation in Chapter 10.


    **8.2 A Menagerie of Typos**


    ![Image 58](index-97_1.jpg)


    At this point, we''re going to go on a tour of typo examples with different diagnoses.


    **8.2.1 Quotable Quotes**


    Our first program sets up a hash %quotation indexed by author and then goes on:
    while (my ($author, $quote) = each %quotation)


    {


    print ''Quote of the Day: "$quote" by $author\n'';


    }


    This runs, but takes us too literally:


    Quote of the Day: "$quote" by $author\nQuote of the Day:


    "$quote" by $author\nQuote of the Day: "$quote" by $author\n...


    Aha! Nothing is being interpolated because we''re using single quotes. We change
    them to double quotes:


    3 while (my ($author, $quote) = each %quotation)


    4 {


    5 print "Quote of the Day: "$quote" by $author\n"; 6 }


    Yikes, now we get three errors:


    Scalar found where operator expected at typo.pl line 4, near


    ""Quote of the Day: "$quote"


    (Missing operator before $quote?)


    syntax error at typo.pl line 4, near ""Quote of the Day:


    "$quote"


    String found where operator expected at typo.pl line 4, near


    "$quote" by $author\n""


    (Missing operator before " by $author\n"?)


    Execution of typo.pl aborted due to compilation errors.


    Once again, we consider only the first message. Whenever Perl provides a hint
    after the error, read it carefully. Perl suggests that we omitted an operator
    before $quote, but why would it expect an operator in the middle of a string?
    Aha—we must not be in a string any more.


    At this point I would have pointed out that the syntax coloring feature of Emacs
    cperl mode would have shown this, but I promised Ed not to make fractious text
    editor advertisements.


    At least we don''t have to look far to find the problem; the string ended prematurely
    one character before $quote. There is, of course, more than one way to fix it.
    We could escape the " inside the string with backslashes, or we could use the
    spiffy qq operator, which allows us to pick any delimiter to use for a double-quoted
    string:


    while (my ($author, $quote) = each %quotation)


    {


    print qq(Quote of the Day: "$quote" by $author\n);


    }


    **8.2.2 A Capital Typo**


    Our next horror feature is The Program That Wouldn''t Die:


    #!/usr/bin/perl


    use Getopt::Std;


    sub usage


    {


    print


    "Allowable options: -a, -c, -e, -n count, -u\n";


    Exit;


    }


    usage() unless getopts(''acen:u'');


    print "Starting program $0\n";


    Let''s run it:


    % **typo.pl -q**


    Unknown option: q


    Allowable options: -a, -c, -e, -n count, -u


    Starting program typo.pl


    Why did this program keep going even after it went into the usage error routine?
    For the answer, this is the last time we''re going to tell you:


    Put use strict and -w in all your programs!


    Because when we do, we see:


    Bareword "Exit" not allowed while "strict subs" in use at typo.pl line 8.


    Execution of typo.pl aborted due to compilation errors.


    ![Image 59](index-99_1.jpg)


    ![Image 60](index-99_2.jpg)


    We should have used exit instead of Exit. (Perl built-in functions do not contain
    capital letters, and the reserved words that do are all uppercase.) Better yet,
    we should have called die instead of print.


    **Chapter 9\. Run-time Exceptions**


    "When you have eliminated the impossible, that which remains, however improbable,
    must be the truth."


    — *Sherlock Holmes in* A Study in Scarlet, *by Sir Arthur Conan Doyle* I remember
    when I was writing my first program in an independently-compiled language (Fortran;
    before that I was just using interpreted BASIC). After much work, I got the program
    to compile without any errors.


    In glee, I turned to a co-worker and said, "All right! I''m done now!" A grin
    came over his face, and he said, "I doubt it." What awaited me at that point was
    the evil *run-time error.*


    Perl is no slouch in the run-time error reporting department, and in fact, many
    errors that would occur at compile time in other languages happen at run time
    in Perl. For example, using a string in a numeric context: a strongly typed language
    would spot at compile time the attempt to assign a string to a numeric variable,
    but in Perl a scalar can switch between a string and a number according to whim.


    We present here our bug-hunting approach to resolving run-time exceptions. There''s
    no way to know whether you''ve gotten rid of all possible run-time bugs without
    running your program under every conceivable set of inputs and environmental changes
    that might possibly affect it.[1]


    [1] Aside from proofs-of-correctness; but there again, proofs-of-correctness never
    seem to be attached to anything longer than 10 lines anyway.


    The most basic run-time error is that the program refuses to execute at all. If
    you''ve been checking your program''s syntax with Perl''s -c switch, you might
    have a program that has no syntax errors but gives you the error "Permission denied"
    when you run it. This just means that you''re running on Unix and have not yet
    set the execute permission for your program.


    You might also get "Command not found" even though you can see the program is
    there!


    Relax; this just means you have a typo in the first line of your program (the
    #! or "shebang"


    line), and it''s saying it can''t find the program you''ve put there. Perhaps
    you typed prel instead of perl again (or left out the space before the -w flag,
    which this author just did).


    While we''re at it, you might also get an error looking like .nrecognized switch:
    -, which can drive you crazy until you discover that it''s from running a program
    with DOS-style line terminations on Unix. Remove the ^Ms with a tool like dos2unix
    or perl -pi.bak


    -e ''s/\cM$//''.'
