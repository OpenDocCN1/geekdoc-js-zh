  trans: "\n\n# Apache 参考文献：\n\n* *Apache 权威指南》（Apache: The Definitive Guide），第 2\
    \ 版，Ben & Peter Laurie 著（O'Reilly, 1999）\n* [`www.apache.org/`](http://www.apache.org/)\n\
    \n## 13.3 500—服务器错误\n\nUnix 的原始编辑器 `ed` 对任何错误情况只有一种响应：打印一个 '?'。[1] 尽管从那以后，用户界面设计已从这种极简主义方法趋于成熟，但\
    \ Web 服务器的引入却使其发生了一次巨大的倒退，因为它们对几乎任何错误的响应都接近于\n\n![Image 83](img/index-144_1.jpg)\n\
    \n[1] `ed` 是由 Ken Thompson 编写的。有人建议他的汽车仪表盘上只有一个指示灯：一个巨大的 '?'，当出现任何问题时它就会亮起，经验丰富的司机通常知道那意味着什么。\n\
    \n### 内部服务器错误\n\n服务器遇到内部错误或配置错误，无法完成您的请求。\n\n它通常会建议您查看服务器错误日志，但遗憾的是，它并没有费力包含可能相关的部分。\n\
    \n**如果可能，请获取你正在开发的 Web 服务器的交互式登录权限。如果你无法登录，请考虑使用其他服务。**\n\n这有几个原因，首先，如果我们能使用 `tail`\
    \ 或 `less` 等程序查看错误日志文件，比通过 Web 页面查看整个内容要容易得多。如果你无法获取交互式登录，你仍然可能查出你的 Web 服务器存储日志文件的位置（默认值是为人知且常用的），然后你可以使用类似下面的\
    \ CGI 程序来查看最后（假设为）十行：\n\n```perl\n#!/usr/bin/perl -Tw\n\nuse strict;\nuse CGI\
    \ qw(:standard);\n\nmy $TAIL = 10;\n\nprint header, start_html;\n\nmy @lines;\n\
    \n# 根据需要修改下一行\nmy $file = \"/usr/local/apache/logs/error_log\";\n\nopen (IN, $file)\
    \ or die p(b(\"Unable to open $file: $!\")); while (<IN>)\n{\n    push @lines,\
    \ $_;\n    shift @lines if @lines > $TAIL;\n}\n\nprint p(\"Total number of lines\
    \ = $.\\nLast $TAIL lines:\\n\"); close IN;\n\nprint pre(@lines), end_html;\n\
    ```\n\n像这样的小工具装满了 CGI 程序员在不同工作间随身携带的包。事实上，如果你甚至无法在一个无法登录的 (Unix) 站点上让 Perl 运行，这里有一个\
    \ Bourne shell 的版本：\n\n```sh\n#!/usr/bin/sh\n\nLOG=/var/log/httpd/error_log\n\
    TAIL=10\n\necho \"Content-type: text/plain\"\necho\n\necho \"Total number of lines\
    \ = 'wc -l $LOG'\"\necho\n\ntail -$TAIL $LOG\n```\n\n## 13.4 基础\n\n为了避免那些“额！”的时刻，请确保：\n\
    \n* 你的程序在 Unix 系统上设置了执行位。缺少此设置的代价是产生 403 Forbidden 错误，这可能会让你误认为 Web 服务器无法进入包含该程序的目录。\n\
    * 你的程序开头有正确的 `#!` 行。写错它会导致你得到 500 服务器错误。\n\n这两个问题都可以通过在 Web 服务器上从命令行运行程序来立即检测到。如果这样做有效，但当你通过\
    \ Web 浏览器访问时仍然收到错误，说明 Web 服务器用户的权限设置不正确；请联系 Web 服务器管理员。\n\n## 13.5 安全\n\n不久前，安全仍然被许多人认为是可选的。今天，这种态度被广泛认为对他人和自己都是危险的。互联网安全问题引起了全球关注，而主机被攻破的方法之一是通过编写糟糕的\
    \ CGI 程序。\n\n不要让你的程序成为其中之一。\n\n### 13.5.1 污染模式 (Taint mode)\n\nPerl 提供了一种保护你的\
    \ CGI 程序的强大机制。它被称为*污染模式*（taint mode），你放在 Web 上的任何程序都不应该缺少它。你通过 `-T` 标志调用它，使脚本的第一行变为：\n\
    \n```perl\n#!/usr/bin/perl -wT\n```\n\n（当然，你的 perl 路径可能不同。）\n\n污染模式本身并不会对保护你的程序做任何事情。它的作用是强迫你处理每一个可能出现安全漏洞的地方。你看，CGI\
    \ 程序安全漏洞的主要原因是恶意用户输入被用于影响程序之外的事。如果你从未见过这有多简单，你将会大吃一惊。\n\n假设你的电子商务 网站包含一个反馈表单，供用户输入电子邮件地址和赞美信息。遗憾的是，假设你的发货部门给客户寄了一个芭比娃娃，而不是他订购的索尼\
    \ PlayStation 游戏机，而不是赞美，这位即将成为前任的客户对你有了另一条不同的信息。在电子邮件地址字段中，他输入了 `rm *`。你的脚本在将用户输入读入变量\
    \ `$email` 后，合理地发送了响应：\n\n```perl\nopen MAIL, \"|$SENDMAIL $email\" or die $!;\n\
    ```\n\n（我们稍后会讨论信号错误的更好方法。）结果是：混乱。如果你运行在 DOS 上，也不认为自己是安全的；那个用户可能输入了 `; erase *`。污染模式的作用是强迫你像我们刚刚描述的那样清洗输入数据。任何来自程序外部的数据（甚至是环境变量或目录列表）都带有一个特殊标记，将其标记为*已污染*。任何尝试使用污染数据影响程序外部内容的尝试（例如作为外部程序的输入）都会在发生之前导致运行时异常。（错误信息会提到“不安全依赖”。）而且，如果你在表达式中使用污染变量并赋值给另一个变量，该变量也会被污染。\n\
    \n![Image 84](img/index-147_1.jpg)\n\n从污染数据导出未污染数据的*唯一*方法是对其执行带捕获括号的正则表达式匹配，并使用生成的\
    \ `$1, $2` 等。我们假设你付出了如此努力，你已经构造了一个能够产生安全数据的正则表达式。Perl *并不—*也*无法—*检查你是否真的做到了。如果你只是简单地：\n\
    \n```perl\n($untainted) = $tainted =~ /(.*)/s;\n```\n\n"
