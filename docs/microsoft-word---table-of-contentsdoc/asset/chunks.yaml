  trans: "\n当你只是想逐个遍历元素时，某些操作会生成巨大的列表。结构化数据通常可以逐行进行解析：`while (<INPUT>) { ... }`\n\n\
    而不是读取整个文件：\n\n```perl\n{\nlocal $/;\n$file = <INPUT>;\n}\n```\n\n虽然对于那些不是按行结构化的数据来说，这可能真的是你的最佳选择。最两头兼顾的情况是使用了错误的循环语句：\n\
    \n```perl\nfor my $line (<INPUT>) { ... }\n```\n\n因为那会将文件中所有的行都读入一个列表，然后逐个地遍历它们。\n\
    \n如果你用蔑视的眼光看那个例子，心想：“但*我*绝不会做*那事*，”那么这个又呢？\n\n```perl\nfor my $file (grep !/^\\\
    .\\.?$/, readdir DIR) { ... }\n```\n\n这看起来像是一个足够无害的标准惯用法，而且确实是安全的，只要你没有任何包含海量条目的目录即可。但如果你确实有，请注意，它需要临时空间来存储一个几乎是这些条目两倍大小的列表。如果你想让代码针对这种意外情况万无一失，请尝试这个：\n\
    \n```perl\nwhile (defined (my $file = readdir DIR))\n{\n    next if $file =~ /^\\\
    .\\.?$/;\n    ...\n}\n```\n\n如果你有非常大的哈希（hashes），考虑将它们绑定（tie）到数据库，以内存换取速度和磁盘空间：\n\
    \n```perl\nuse DB_File; # 有几种替代方案\nmy %large_hash;\ntie %large_hash, # 要绑定的哈希表\n\
    'DB_File', # 使用的数据库类型\n'database'; # 存储数据库的文件\n# 使用 %large_hash...\nuntie %large_hash;\
    \ # 关闭数据库文件\n```\n\n然而，你可能会通过使用一个常见的惯用法而轻易抵消你的节省：`for my $key (keys %large_hash)\
    \ { ... }` # 错误！\n\n因为这会导致 Perl 在内存中形成所有键的列表。请使用 `each` 代替，因为它每次只返回两个值（或者在标量语境下返回一个）：`while\
    \ (my ($key, $value) = each %large_hash) { ... }`\n\n（尽管你不能在循环内部添加或删除哈希元素。）如果你的哈希值包含引用（你的哈希键不会，除非你使用了\
    \ `Tie::RefHash` 模块），那么你应该使用 Gurusamy Sarathy 来自 CPAN 上的 `MLDBM`（多级数据库）模块 [(http://search.cpan.org/search?dist=MLDBM)](http://search.cpan.org/search?dist=MLDBM)\
    \ 。否则，你的引用指向的对象将不会存储在数据库中。\n\n![Image 77](img/index-133_1.jpg)\n\n![Image 78](img/index-133_2.jpg)\n\
    \n**避免不必要的拷贝。**\n\nPerl 喜欢拷贝数据。当你写一个子程序时，例如 `sub bake { my ($temperature, $how_long)\
    \ = @_; [...] }`，将其第一行看作一种原型是很方便的，但实际上它正在复制数据。在向子程序传递巨大的变量时，你可能需要重新考虑这种方法。注意：虽然直接从\
    \ `@_` 获取数据没问题，但要注意 `@_` 是你原始参数的别名；确保你在没有记录该操作的情况下修改其中任何一个。\n\n此外，命名参数传递通过将 `@_`\
    \ 拷贝到哈希中工作；你必须另想方法来识别非位置参数。\n\nSean M. Burke 指出了这一原理的另一个应用：我曾写过一个程序，对一种奇特的标记语言进行一些相当糟糕的数据转换。现在，逐行处理是不可能的——因为那种表示法类似于\
    \ SGML，即具有自由格式的空白。大部分或所有的操作都是如下形式：\n\n```perl\n$lexicon =~ s{<subhead>(.*?)</subhead>}{handle_subhead($1)}ieg;\n\
    ```\n\n问题是 `$lexicon` 非常大（250+ KB），而且应用大量的、大量的正则搜索和替换操作花费了大量的时间！为什么？因为对大型标量的每次修改都涉及跨越条目边界（即记录边界）。有一天，我突然想到可以将词汇分成条目，然后通过\
    \ `foreach` 对这些条目中的每一个应用字符串替换。由于每个条目只有约 2KB，痛苦的交换少得多，因此程序运行速度快了大约 50 倍！\n\n###\
    \ 11.3.3 改进磁盘空间利用\n\n**避免临时文件。**\n\n如果你的操作系统支持管道（pipes），请使用它们。即使你的操作系统不支持，你系统上的\
    \ Perl 可能支持；试一试。[5]\n\n[5] 从版本 5.6.0 开始，Perl 中的 `fork` 在 Windows 上可以工作。\n\n![Image\
    \ 79](img/index-134_1.jpg)\n\n如果你程序的某部分写入一个临时文件供另一部分读取，你可以将其改为使用管道，但前提是你能让程序的这两个部分合理地并发执行。否则，当你向管道写入数据时它会被填满，你的程序将无所可事地转手指等待管道疏通。（如果你在周末需要过管道工，你就知道那种感觉了。）如果你编写了类似这样的代码，考虑将其拆分为两个可以并发运行的程序。\n\
    \n# 第 12 章 作为第二语言的 Perl\n\n“穿越未来的黑暗，魔法师渴望看到。”—— *BOB 在双峰顶* 许多人在学习了一门或多种语言后接触 Perl。（我们认为\
    \ Perl 作为第一门语言并不是一个好的选择，人们应该先学习 C 这样的过程化语言或 Java 这样的面向对象语言。）对于那些优势在于本章列出的语言的人，这里有专门针对他们的建议。\n\
    \n关于这一点，在 man 手页中已有很好的信息，我们在这里没有重复，但敦促你去查阅。你还会发现 Nigel Chapman 写的 *Perl: The Programmer's\
    \ Companion* (Wiley, 1998) 是关于 Perl 的很好的介绍。\n\n## 12.1 给每个人的建议\n\n从更熟悉的语言转向 Perl\
    \ 时，你需要进行一些调整：\n\n- 变量以类型指示符[1]（某些人称为 *sigils* 符号）开头。这并不像是匈牙利表示法的报复——谢天地这里没有 mblkMessages[]。Perl\
    \ 初学者最难理解的是，例如 `@animals` 是数组的名字，而 `$animals[14]` 是其中某个特定元素的名称，而 `@animals[2..7]`\
    \ 是该数组的一个切片的名称。只需记住规则：当你引用恰好一个东西时，它是一个标量，因此以 $ 开头；而多个东西是数组——某种程度上——并以 @ 开头。\n\n\
    [1] 嗯，大多数情况下如此。文件句柄（Filehandles）不是，除非你用 `IO::File` 或 5.6 的新功能在标量中创建一个，或者分配一个类型全局变量别名。而且你很难区分一个可左赋值的子程序和一个变量。\n\
    \n- 函数参数不需要圆括号括围。加上它们无害，但知道什么时候可以省略它们会让你的程序更易读。（参见第 4 章的“消失的括号案例”）。\n\n- 因为 Perl\
    \ 强制要求条件语句为块，所以不存在“悬空 else”问题。\n\n## 12.2 给 C 语言程序员的建议\n\n你不再必须在块的开头、任何执行代码之前声明所有变量。事实上，尽可能晚地声明是一个良好的习惯，因为可以将属于同一个功能单元的语句保持在一起。\n"
- fmt: "\nPerl's scalar variables are not strongly typed. They can switch oyster-like\
    \ between integers, floating point numbers, and strings according to your whim\
    \ (although if you ever turn a reference into a string, you can't turn it back).\
    \ Even when you assign an object of a specific class to one, nothing stops you\
    \ from overwriting it with an object of another class or something that isn't\
    \ even an object at all. Polymorphism at its best. There is (as of version 5.005)\
    \ the capability to declare to the compiler that a scalar is an object belonging\
    \ to a particular class (`my Dog $spot`), but even that is only a loose agreement\
    \ that you can break any time you feel like it.[2] (It allows for compile-time\
    \ checking of accesses to fields, which are one way of implementing instance data.)\n\
    \n[2] As of press time, Damian Conway had mooted a module which *could* restrict\
    \ a variable to a particular object class, but not even the name had been agreed\
    \ on.\n\nDynamic (i.e., nonlexical) variables have global scope unless qualified\
    \ with a `local` statement. But you won't want to program in this BASIC style\
    \ anyway; declare all variables as lexical, and the scoping rules are the same\
    \ ones you're already used to.\n\nYour days of wondering whether your frees match\
    \ your mallocs are over! It is very hard to create a memory leak accidentally\
    \ in Perl. Whenever you see code like this `$soldier = make_warrior ('squaddie');`\n\
    \n```\nsub make_warrior\n{\n    my $fighter;\n    ...\n    return $fighter;\n\
    }\n```\n\nwhich would make your heart leap into your mouth in C, relax. In C terms,\
    \ `$fighter` is being allocated from the heap, not from the stack, so it doesn't\
    \ become vulnerable as soon as the stack frame for `make_warrior` is unwound.\
    \ Furthermore, the space allocated to `$fighter` doesn't get freed as long as\
    \ there is a reference to it, and `$soldier` is such a reference. As long as something\
    \ needs the space, it remains allocated, and as soon as nothing needs it, it gets\
    \ freed. This is what you're used to spending all that time agonizing about in\
    \ C.\n\nFunctions don't need `()` after them if you have no arguments to supply\
    \ them, but if you do this with functions of your own, then their definition (or\
    \ a prototype declaration) should precede their use.\n\nAlthough in C the expressions\
    \ `a[i]` and `i[a]` are equivalent, the corresponding expressions in Perl are\
    \ not. If you find this surprising, you may need more help than we can provide.\n\
    \nWhile Perl inherits many operators (and their precedence) from C and probably\
    \ strives hardest to be accessible to the C programmer, it also strives to be\
    \ as orthogonal as possible.\n\nFor example, while Perl provides the same `&&`\
    \ and `||` operators as C, they return their inputs instead of a Boolean value.\
    \ In other words, `$a || $b` is `$a` if `$a` is true; otherwise it is `$b`. (The\
    \ operators short-circuit the same way). In another example, Perl figures anything\
    \ that could be an lvalue, should be, so a term containing the trinary `(?:)`\
    \ operator is an lvalue if its left and right parts are lvalues. The `substr`\
    \ function is an lvalue if the result of its first argument is modifiable. And\
    \ as of version 5.6.0, you can even (in an experimental feature) create a function\
    \ of your own that is an lvalue.\n\nAlthough no switch statement exists in Perl,\
    \ this hasn't stopped people from inventing several dozen ways of simulating one,\
    \ the latest being `Switch.pm`, a module presented by Damian Conway at the fourth\
    \ annual Perl Conference ([http://conference.perl.com/](http://conference.perl.com/)).\
    \ The reason there isn't a switch is that when you start implementing one, your\
    \ average switch statement seems very limited when you consider the breadth of\
    \ Perl's operators.\n\nWhy should each case be just a simple test for equality?\
    \ Why not be able to compare against a regular expression as well? (Even the Bourne\
    \ shell manages that.) Why shut out the vast set of logical comparisons? Until\
    \ `Switch.pm`, it appeared that nothing could be implemented that wouldn't look\
    \ like a poor cousin to the rest of the language. (It now seems that some version\
    \ of `Switch.pm` will be incorporated into the core Perl 6 language.) Hierarchical\
    \ data structures are thoroughly typeless (atypical?) in Perl; no more fiddling\
    \ with `union` statements to traverse heterogeneous lists. Sometimes, people are\
    \ afraid this means that they must pedantically check the type of every element\
    \ of a complex object themselves to make sure they don't dereference something\
    \ incorrectly; that is, until they realize that they were probably the ones who\
    \ constructed the object in the first place, and they can usually trust themselves.\n\
    \nDon't look for a counterpart to `struct` expecting that you'll use it nearly\
    \ as much. If you want to achieve exactly the same effect (named members of a\
    \ compound variable) you can do so with a reference to a hash (or an object);\
    \ but in practice, most of the uses you'd have for those things aren't necessary.\
    \ There's no need to write special code for linked lists (although there's a book\
    \ that shows you how if you have some exotic need[3]); Perl's arrays grow on demand\
    \ quite well enough. Most of the reasons to construct trees are taken care of\
    \ by Perl's efficient algorithm for looking up elements in hashes. (Again, if\
    \ you have a need that somehow manages to overwhelm this mechanism, the same book\
    \ provides alternatives.)\n\n[3] *Mastering Algorithms with Perl*, by Jon Orwant,\
    \ Jarkko Hietaniemi and John Macdonald (O'Reilly, 1999).\n\n## 12.3 Tips for the\
    \ FORTRAN Programmer\n\nPerl code appears odd to a FORTRAN programmer. FORTRAN\
    \ uses `()` (parentheses) exclusively for indices. An array element has the form\
    \ `ARRELM(1)`, a matrix element has the form `MATELM(1,1)`, and a subroutine call\
    \ takes the form `CALL ASUB (VALUE1, VALUE2)`, whereas Perl uses `()` (parentheses),\
    \ `[]` (brackets), and `{}` (braces) in various ways depending on data type and\
    \ function. For instance, whereas `$a[$i]` refers to an element of an array, `$a{$i}`\
    \ refers to a value in a hash. Forgetting the proper uses of these separators\
    \ is a common error for the neophyte experienced in FORTRAN.\n\nIf you use FORTRAN\
    \ for its native handling of high-precision floating point numbers (and if you\
    \ don't—what *are* you using it for?), you'll find Perl's IEEE floating point\
    \ imprecise (just as if you were to program in C). You may find solace in the\
    \ `PDL` module from CPAN or the `Math::BigFloat` module in the Perl core.\n\n\
    `COMMON` blocks are an evil way of passing around scads of global variables at\
    \ the same time and are used far often often in FORTRAN than they should be. (If\
    \ you want to define common constants used by many FORTRAN files, use a preprocessor;\
    \ this isn't the '60s.) The way to make available a set of constants that share\
    \ some theme in Perl is to put them into a module, using the `Exporter`, and then\
    \ import them where you want them:\n\n```myconsts.pm\npackage myconsts;\n\nuse\
    \ Exporter;\n\n@ISA = qw(Exporter);\n\n@EXPORT_OK = qw(PI E);\n\nuse constant\
    \ PI => 3.14159265;\n\nuse constant E => 2.71828183;\n\n1; # Modules must return\
    \ a true value\n```\n\n```mytest\n#!/usr/local/bin/perl\n\nuse myconsts qw(PI\
    \ E);\n\nprint \"PI*E = \", PI * E, \"\\n\";\n```\n\n```text\n% mytest\nPI*E =\
    \ 8.53973421775655\n```\n\nThat's worth a Perl of Wisdom:\n\n**Put common sets\
    \ of constants in their own modules using the Exporter, and use the modules where\
    \ needed.**\n"
