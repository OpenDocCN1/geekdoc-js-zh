    # Chapter 8. Syntax Errors


    "Fire bad!"

    —Frankenstein''s monster in a fit of homicidal frustration


    "Typos bad!"

    —The first programmer, same emotion


    We realize we''re tempting scorn by devoting a chapter to a subject as prosaic
    as typos, but someone must do these dirty jobs. Why? Consider this extract from
    a shift.com article by Clive Thompson:[1]


    [1] [http://www.shift.com/shiftstd/SiteMap/frames/mag7.6.asp?searchfor=7.6bombsquad](http://www.shift.com/shiftstd/SiteMap/frames/mag7.6.asp?searchfor=7.6bombsquad)


    Still, by any standard, speed kills quality. Consider the research currently being
    conducted by Watts Humphrey, a 45-year veteran of the industry and a fellow of
    the Software Engineering Institute. By studying programmers as they work, he has
    found that they make one mistake for every seven to ten lines of code—a stunning
    level of errors. And almost one-fifth of those errors are simply typos. All in
    all, coders introduce bugs at the rate of 4.2 defects per hour of programming.
    If you crack the whip and force people to move more quickly, Humphreys notes,
    things get even worse. "[The industry] can''t survive with this level of quality,"
    he adds.


    As long as we''re being prosaic, let''s go all the way and define a typo. *The
    American Heritage Dictionary* (third edition) merely states, "A typographical
    error" (which is accurate but just a bit too prosaic for our liking). So we''ll
    just say that you''ve made a typo when the characters that come out on the screen
    are not the ones that you intended to type.


    A program containing a typo can still be correct syntactically, even if not semantically,
    as the legions of typists who rely on the squiggly lines under spelling errors
    in Microsoft Word have discovered to their chagrin.[2]


    [2] And don''t expect the squiggly lines made under a clause it considers grammatically
    incorrect to save you either: Word 97 has no problem with the sentence, "Aye fought
    eyesore a putty cat."


    *Syntax* simply refers to whether the program obeys the grammar the parser expects;
    *semantics* refers to what the program means. A move in a game of chess could
    be syntactically invalid (such as moving a pawn forward six spaces), or syntactically
    valid but semantically stupid (such as a castling that puts you a move away from
    being checkmated).


    ## 8.1 Typo Pathologies


    Later we''ll tackle the more complex issues of errors committed when you typed
    exactly what you intended to type, but the program still fails to work. The trick
    is to find the typo: we present a variety of techniques for hunting them down
    and destroying them


    1. *Deletion*

    2. *Insertion*

    3. *Alteration*

    4. *Transposition*


    Let''s consider examples of each category:


    ```perl

    $message = "Hello World";

    print "$message\n"

    exit;

    ```


    The Perper compiler, like every other compiler we know, often goes somewhat further
    in your program than the actual error before reporting a problem. Since we''ve
    never met a compiler that indicated an error for a line number preceding the first
    one containing an error, we can use Perl''s report of the line number as an upper
    bound and work backwards from it. In this case, the line it reported was the last
    line of the file anyway (which often happens), but them''s the breaks.


    ### 8.1.1 Deletion


    The most common example of deletion must be the failure to place a semicolon between
    two statements. (Perl requires semicolons as statement separators, not terminators;
    the difference is that the last statement in a block does not require a trailing
    semicolon. We recommend that you insert a semicolon after every statement, even
    at the end of a block, since you never know when you might come back and insert
    another statement after.)


    ![Image 56](index-91_1.jpg)


    The strategy for fixing this problem: "syntax error" tells you that Perl has determined
    the problem to be a straightforward typo... Perl gives us an additional piece
    of information, that the next token is exit. If we''re lucky, that means that
    the error occurred immediately before that word, so that''s where we start looking.


    `syntax error at line 3, next token "exit"`


    Immediately, we notice a missing semicolon on line 2.

