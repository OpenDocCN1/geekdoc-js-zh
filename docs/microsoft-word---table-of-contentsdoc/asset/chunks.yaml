    ## 4.4.4 Secret Prototypes


    Our next pitfall concerns the "secret" function prototypes assigned to built-in
    functions. If you execute the following:


    ```perl

    my @arglist = ("My %s has %d %s\n");

    push @arglist, ''aunt'', 3, ''cats'';

    printf @arglist;

    print sprintf @arglist;

    ```


    (not that you would do something so strange, but we''re illustrating something
    that you might come across more circuitously), the result is


    My aunt has 3 cats


    4


    What''s going on? The first line is right, so what happened with the second one?


    `sprintf()` has an implicit *prototype*. If you''d written `sprintf` yourself,[9]
    you''d have begun it with:


    [9] Always an enjoyable way to spend a rainy afternoon.


    ```perl

    sub sprintf ($@)

    ```


    which is a somewhat contentious feature of Perl that allows you to emulate the
    ability of built-in functions to dispense with parentheses around their arguments
    if you so wish.


    Well, it allows you to emulate *some* built-in functions, but we''ll get to that.


    This prototype says that `sprintf` takes a scalar (either a variable or a literal
    expression) followed by a list. The first argument will therefore be interpreted
    in scalar context. And the first (and only) argument we passed in our example
    was `@arglist`, which in a scalar context yields the number of elements in the
    array: 4.


    "Okay," you say, licking your wounds but determined to come back fighting, "so
    why didn''t the same problem occur with `printf`? What''s the difference?"


    The difference is that `printf` wasn''t given the same internal prototype. (This
    may be changed in a later version of perl.) But in the case of `printf`, you couldn''t
    write a prototype for it yourself if your life depended on it, because `printf`
    can take a filehandle as a special kind of first argument:


    ```perl

    printf STDOUT "The answer is %d\n", 42;

    ```


    Note there''s no comma after it! The prototyping mechanism available to mere *users*
    of perl does not permit this.)


    Most of the built-in ("core") functions in Perl have implicit prototypes. As of
    version 5.005, you can find out what they are with the `prototype` function and
    prefixing the built-in with the string `"CORE::"`[10]


    [10] As you might have guessed, `prototype` can be used to discover prototypes
    for any function, not just built-ins.


    ```bash

    perl -le ''print prototype "CORE::substr"''

    ```


    `$$$`


    A `$` indicates a scalar is expected, and a `;` means that the following argument
    is optional. If you compare this with the perlfuncfunc entry for `substr`, you''ll
    see that it can take two, three, or four scalar arguments. If a function is so
    special that you couldn''t write a prototype for it (like `printf`), `prototype`
    returns `undef`.


    It''s unlikely that you''ll trip over anything besides `sprintf`, because the
    other prototypes for built-ins are such that if you passed an array where Perl
    was expecting some scalars, you''d get a compile-time error that there weren''t
    enough function arguments. And this is the reason those prototypes exist: to tell
    you at compile time that you haven''t provided enough arguments to a routine.


    Unfortunately there is a trade-off at work here: if you want to make sure the
    user provides two scalars as function arguments (like the built-in `crypt`) and
    throw a compile-time exception if they don''t, then you should declare that function
    with a prototype of `$$`. But then the user can''t supply an array containing
    two arguments to the function and get the result they want. (There again, what
    are the odds someone would want to supply the two arguments to `crypt` via an
    array?) Whether or not *you* use subroutine prototypes, be aware that most of
    the perl built-ins do, and that the Perl porters consider `printf` to be the interface
    in need of repair, not `sprintf`, regardless of what happened in our contrived
    example.


    If you wanted to make a more general rule out of this nitpicky point, the Perl
    of Wisdom would be


    ![Image 40](index-55_1.jpg)


    ![Image 41](index-55_2.jpg)


    ![Image 42](index-55_3.jpg)


    **Don''t pass arrays to built-in functions which normally expect a scalar.**


    ## 4.4.5 Loop Scope


    After a for loop, the loop variable has the last value it was set to (unless it
    was lexically scoped to the loop itself, in which case it no longer exists). But
    after a foreach loop (one that doesn''t lexically scope the variable to the loop),
    the variable has the value it had *before* the loop:


    ```bash

    perl -le ''my $i = 42; for ($i=0; $i<10; $i++) {} print $i''

    ```


    10


    ```bash

    perl -le ''my $i = 42; foreach $i (1..10) {} print $i''

    ```


    42


    This can be particularly nonintuitive if you break out of the foreach loop with
    `last` because you''ve found the thing you were looking for.


    **Don''t rely on loop variables retaining their values after the loop; save them
    explicitly if you need them.**


    ## Chapter 5. Tracing Code


    "1545 Relay #70 Panel F (moth) in relay. First actual case of bug being found."


    — *Admiral Grace Hopper''s Logbook September 9, 1945*


    In the phylogeny of debugging, the Protozoic approach consists of tossing


    ```perl

    print "\$variable = \$variable";

    ```


    lines into the code at various places. Before we advance up the ladder to interactive
    debuggers in Chapter 7, however, we have a lot of ground to cover. We should not
    readily disparage the humble `print` statement, because with a little tuning it
    can turn into valuable tool. By sending your tracing output to `STDERR`, you have
    left undisturbed the normal output of your program, which means it can continue
    to run as a command in a pipeline if you so desire. You can also output status
    information to `STDERR` in such a program (sometimes called a *filter*).


    It''s a good idea in this case to identify your program so that you can tell which
    command in the pipeline is talking to you:


    ```bash

    grep -li pseudo-hash //local/perl/man1/* | mytran | mail -s "Secrets you requested,
    tovarich"

    ```


    [**gyorgi@kgb.moskvax.ru**](mailto:gyorgi@kgb.moskvax.ru)


    mytran: Translating /usr/local/perl/man/man1/perldelta.1 into Russian...


    mytran: ***DEBUG*** $trans{perl} => ''zhemchuzina''


    mytran: Translating /usr/local/perl/man/man1/perldiag.1 into


    Russian...


    [...]


    You do that by inserting `$0` in your output string. `$0` is the string with which
    your program was invoked. Note that this may include leading components of an
    absolute or relative path,


    so you may want to strip off everything before the filename component. The operating
    system-independent way to do this is:


    ```perl

    use File::Basename;

    my $prog = fileparse($0);

    ```


    # $prog now contains the program name along with any suffix


    ## 5.1 Dumping Your Data


    That is all well and good for scalars and arrays, but it won''t even handle hashes,
    let alone lists of lists. A good way to deal with those is to use the `Dumper`
    function in the `Data::Dumper` module which will let you print out, nicely formatted,
    anything you give it, no matter how complex:


    ```perl

    use Data::Dumper;

    # set %state from some database or flat file

    ```

