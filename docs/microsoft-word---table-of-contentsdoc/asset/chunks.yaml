    # Appendix B: List of our "Perls of Wisdom"


    We will spend a lot of time going through examples of problems and how you might
    debug them.


    ## Getting Perl


    While this isn''t a book about how to build or build perl,[1] we owe you at least
    rudimentary instructions on how to get a perl of your own.


    [1] That''s not a typo. By convention, big-P `Perl` refers to the language in
    the abstract, whereas little-p `perl` refers to the program that runs Perl programs.


    - For Windows machines, get the free `ActivePerl` distribution: [http://www.activeState.com/ActivePerl/download.htm](http://www.activeState.com/ActivePerl/download.htm)

    - For Macintoshes: [http://www.cpan.org/ports/index.html#mac](http://www.cpan.org/ports/index.html#mac)

    - For binary distributions for all other machines: [http://www.cpan.org/ports/](http://www.cpan.org/ports/)

    - For the source of `perl` itself: [http://www.cpan.org/src/](http://www.cpan.org/src/)


    Building `perl` from source on a supported Unix architecture requires just these
    commands after you download and unpack the right file:


    ```bash

    ./Configure

    make

    make test

    make install # if the make test succeeds

    ```


    ![Image 3](index-5_1.jpg)


    ![Image 4](index-5_2.jpg)


    The `Configure` step asks you zillions of questions, and most people won''t have
    a clue what many of those questions are talking about; but the default answers
    `Configure` recommends are usually correct.


    For educational purposes, you may want to build a `perl` that has debugging enabled.
    (Here we refer to a `perl` that lets you use the special `-DDEBUGGING` flag to
    enable the output of information that tells you what `perl` is doing with your
    program. This has nothing to do with Perl''s built-in interactive debugger—which
    we discuss in Chapter 7—all perls have that.) If you want to do that, build `perl`
    from the source, and when `Configure` asks, "Any additional cc flags?" paste in
    whatever it already shows between brackets as a default and add `-DDEBUGGING`.
    See the `perlrun` POD page (explained later) for more information.


    We occasionally refer to modules that are not part of the core Perl distribution
    but that can be found on the Comprehensive Perl Archive Network (`CPAN`). For
    instructions on how to find, download, and install a module from `CPAN`, see http://www.cpan.org/misc/cpan-faq.html](http://www.cpan.org/misc/cpan-faq.html).


    ## Typographical Conventions


    We use the following conventions in this book:


    - Standard text: Times Roman

    - Author''s comments: Arial

    - Code examples and URLs: Courier

    - User input: **bold Courier**


    Sometimes our code examples have line breaks where none existed in the original.
    In places where these line breaks would cause problems or aren''t obvious, we''ve
    put a backslash (`\`) at the end of the line to indicate that the line should
    be joined with the next one.


    Occasionally, we want you to know which of us is talking to you, so we have this
    style of comment to let you know. (This is Ed, by the way.) Those marginal icons
    are part of the terrific artwork created by my wife''s sister, Ann Palmer, for
    this book. (This is Peter, by the way.)


    ## For Further Reference


    Visit this book''s Web site [at http://www.perldebugged.com](http://www.perldebugged.com).


    Get introductions to Perl programming from the following (in rough order of usefulness):


    ![Image 5](index-6_1.jpg)


    - *Learning Perl*, 2nd ed., by Randal Schwartz and Tom Christiansen (O''Reilly
    & Associates, 1997)

    - *Programming Perl*, 3rd ed., by Larry Wall Tom Christiansen, and Jon Orwant(O''Reilly
    & Associates, 2000)

    - *Perl, the Programmer''s Companion*, by Nigel Chapman (John Wiley & Sons, 1998)

    - *Elements of Programming with Perl*, by Andrew Johnson (Manning Publications,
    1999)

    - *Effective Perl Programming*, by Joseph Hall with Randal Schwartz (Addison-Wesley,
    1998)


    ## Perl Versions


    In this book, we refer to the latest "stable" version of Perl, which is `5.6.0`
    as of this writing.


    The vast majority of what we say works unaltered on older versions of Perl 5,
    but not Perl 4.


    If you use any version of Perl older than `5.004_04`, you should upgrade; `5.003`
    had issues such as security problems and memory leaks. You can find out the version
    number of your `perl` by passing it the `-v` flag:


    ```bash

    perl -v

    ```


    This is perl, v5.6.0 built for i586-linux

    Copyright 1987-2000, Larry Wall

    [...]


    Perl won''t execute a script named on the command line if the `-v` flag is present.
    A more detailed description of your `perl`''s configuration can be obtained with
    the `-V` flag; if you issue a bug report, the facility for doing that automatically
    includes this information with your report.[2]


    [2] Using the `perlbug` program included with your `perl` distribution.


    A separate development track exists for Perl; you will know if you have one of
    those versions because the release number contains an underscore followed by a
    number. It was announced at the fourth annual Perl Conference (Monterey, California,
    July 2000) that Perl development was beginning in earnest, and backward compatibility
    need not stand in the way of doing good things. If you find you have one and didn''t
    want it, the person who downloaded your probably visited the wrong FTP.


