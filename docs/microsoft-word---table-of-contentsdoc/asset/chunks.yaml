- fmt: "\nTo be blunt, a proper program is defined by the set consisting of the executable\
    \ code, comments that describe the how and why of the code, and documentation\
    \ describing the function of the program (with examples). Real men and women comment\
    \ their code!\n\n![Image 26](index-31_1.jpg)\n\n## 3.5 Developing\n\nThere's no\
    \ substitute for knowledge. Coding something you don't understand should set off\
    \ warning bells in your brain: \"What does the code I just wrote really do?\"\
    \ That's the time to experiment.\n\nI have seen too many people take a shotgun\
    \ approach to coding: they just fire a blast of characters onto the screen and\
    \ rearrange them until something works. Too often, instructors foster the mindset\
    \ that the only thing that counts is getting the right answer: I keep finding\
    \ people who put something in a program \"because it works\"—in *that* particular\
    \ situation—but don't understand what they are doing and so can't extend it to\
    \ other situations or aren't aware of how it might fail.\n\nNevertheless, there\
    \ are times when you have to do something quite beyond your current ability or\
    \ the rate at which you can learn something new. Here are some useful ways to\
    \ cheat:\n\n1. **Steal.** Tom Christiansen and Nathan Torkington have gone and\
    \ left a pile of code in a fat book[5] at your local bookstore which you can use\
    \ for anything you want and they'll never complain. If you find the task you're\
    \ trying to solve in there, have at it. You can always break your overall task\
    \ into smaller logical units that are more generic and therefore more likely to\
    \ be in the book.\n\n[5] *The Perl Cookbook* (O'Reilly & Associates, 1998).\n\n\
    2. **Mutate.** Start by using good code that does something similar to what you\
    \ want, and gradually change it to fit your needs. Even though there may be code\
    \ you don't understand in there, it may stay isolated from your changes, so you\
    \ don't have to worry about it. (Anyone who has subclassed a module is familiar\
    \ with this way of thinking.) How do you recognize good code? Emulate the best.\n\
    \nNow, whenever we've asked who to emulate, people have been reluctant to name\
    \ anyone in particular. We applaud their sense of fairness but the result is frustrating.\n\
    \nTherefore we present our totally biased, incomplete, but still useful list of\
    \ authors whose code you can find on the net, the copying of which will likely\
    \ lead to good results.[6] We've put the names in alphabetical order to avoid\
    \ any more outrage than necessary.\n\n[6] However, if you see any code posted\
    \ by these or other people with references to either golf or bowling, it means\
    \ they're competing to see who can solve the problem in either the smallest or\
    \ largest number of characters. The winner in either case is unlikely to be highly\
    \ comprehensible.\n\n[See http://www.perlfaq.com/faqs/id/154]\n\nGisle Aas\nUri\
    \ Guttman\nChip Salzenberg\nGreg Bacon\nJoseph N. Hall\nGurusamy Sarathy\nGraham\
    \ Barr\nJarkko Hietaniemi\nRandal Schwartz\nTim Bunce\nNick Ing-Simmons\nMichael\
    \ G. Schwern\nAlan Burlison\nRonald Kimball\nLincoln Stein\nNigel Chapman\nJohn\
    \ Macdonald\nMike Stok\nTom Christiansen\nTad McClellan\nNathan Torkington\nDamian\
    \ Conway\nChris Nandor\nHugo van der Sanden\nSimon Cozens\nJon Orwant\nJohan Vromans\n\
    Mark-Jason Dominus\nTom Phoenix\nLarry Wall\nJan Dubois\nJohn Porter\nIlya Zakharevich\n\
    brian d foy\nLarry Rosler\n\nNote to the obviousness-challenged: this wasn't a\
    \ popularity contest and we're not handing out awards. Of course there are dozens\
    \ of other people we could have added, and hundreds more are worthy of inclusion\
    \ in such a list if only we were aware of them all. (And if you're in that category,\
    \ we apologize to you.) We print it here because it's the kind of list we wanted,\
    \ and couldn't find, when we were beginning Perl. Arbitrary and incomplete as\
    \ it is, we believe it to be superior to no list at all.\n\nNow, when you're mutating\
    \ code, be sure and test that the original works before you change it![7] This\
    \ admonition has nothing to do with the reliability of its author, rather the\
    \ fact that everyone's environment is different, and maybe the difference between\
    \ yours and the author's is significant. (Sometimes we have spent ages trying\
    \ to find bugs in changes we made while mutating code only to find that the problem\
    \ was in the original.)\n\n[7] This and some of our other tips fall under the\
    \ category Joseph N. Hall termed \"Don't overlook the obvious\" in *Effective\
    \ Perl Programming* (Addison-Wesley, 1998).\n\nThen modify as little at a time\
    \ as possible to get something you can test. Change the parts you understand the\
    \ best first—like the names of input/output files and e-mail logging addresses—test,\
    \ and keep going with the harder parts. With luck, you'll eventually end up with\
    \ what you need without having to touch the parts you don't understand. (Anyone\
    \ who's subclassed a module and had to override the constructor and other methods\
    \ is familiar with this approach.)\n\n## 3.6 Accident Prevention\n\nThese tips\
    \ fall into the category of installing sprinklers instead of polishing your fire\
    \ hose.\n\n### 3.6.1 Be Strict\n\nPut the directive `use strict` as the first\
    \ line (after the `#!` line if there is one) of every file (including modules\
    \ you write; strictness is lexically scoped, not program scoped). Especially if\
    \ you don't understand why. This makes Perl, well, stricter about things you could\
    \ get away without that are usually mistakes. It is telling that the one group\
    \ of people whose expertise would most allow them to get away without strict (the\
    \ uppermost echelon of Perl experts) is the most adamant about its indispensability.[8]\n\
    \n[8] Except when they're entering the Obfuscated Perl Contest (www.tpj.com/contest),\
    \ which relies heavily upon not using strict. That ought to tell you something.\n\
    \n![Image 27](index-33_1.jpg)\n\nDon't think it's faster to get your program working,\
    \ then go back and insert strict, and clean up the resulting errors. It's much\
    \ slower, for two reasons: first, developing without strictness results in errors\
    \ being harder to find and taking longer to fix. Second, when you add strictness\
    \ to a lengthy program that has never been strict, the number of errors printed\
    \ is likely to be enormous, and fixing them will probably not be trivial.\n\n\
    This is not an exaggeration, particularly if your nonstrict code has graduated\
    \ to an operational environment. You may not have the option to shut things down\
    \ while you recode and retest.\n\nWhat makes `use strict` our friend is that most\
    \ of the objections it raises prevent a program that is not following good practices\
    \ from ever running. (This is called raising a compile-time exception. Although\
    \ there is one class of errors it catches only at run-time.) The biggest favor\
    \ `use strict` does for you is to force you to declare all your variables with\
    \ a `my` statement, or it will complain that you've referenced a variable without\
    \ an explicit package name. In other words, variables not declared with `my` belong\
    \ to a family of variables you seldom need to use; so seldom, in fact, that `use\
    \ strict` requires you refer to such variables by their full names, which include\
    \ the packages they live in.\n\nWhy is this such a huge favor? Because it guards\
    \ against the ravages of the common typo.\n\nConsider this code:\n\n```perl\n\
    my $enrolled_so_far = 0;\n\nforeach my $student (@students)\n{\n  foreach my $class\
    \ (keys %registry)\n  {\n\n    $enroled_so_far++, last\n    if exists $registry{$class}{$student};\n\
    \  }\n}\n\nprint \"Number of enrollees so far = $enrolled_so_far\\n\";\n``` Without\
    \ use strict, this happily runs, producing the answer \"0\" no matter what the\
    \ data.\n"
  raw: 'To be blunt, a proper program is defined by the set consisting of the executable
    code, comments that describe the how and why of the code, and documentation describing
    the function of the program (with examples). Real men and women comment their
    code!


    ![Image 26](index-31_1.jpg)


    **3.5 Developing**


    There''s no substitute for knowledge. Coding something you don''t understand should
    set off warning bells in your brain: "What does the code I just wrote really do?"
    That''s the time to experiment.


    I have seen too many people take a shotgun approach to coding: they just fire
    a blast of characters onto the screen and rearrange them until something works.
    Too often, instructors foster the mindset that the only thing that counts is getting
    the right answer: I keep finding people who put something in a program "because
    it works"—in *that* particular situation—


    but don''t understand what they are doing and so can''t extend it to other situations
    or aren''t aware of how it might fail.


    Nevertheless, there are times when you have to do something quite beyond your
    current ability or the rate at which you can learn something new. Here are some
    useful ways to cheat:


    1\. **Steal.** Tom Christiansen and Nathan Torkington have gone and left a pile
    of code in a fat book[5] at your local bookstore which you can use for anything
    you want and they''ll never complain. If you find the task you''re trying to solve
    in there, have at it.


    You can always break your overall task into smaller logical units that are more
    generic and therefore more likely to be in the book.


    [5] *The Perl Cookbook* (O''Reilly & Associates, 1998).


    2\. **Mutate.** Start by using good code that does something similar to what you
    want, and gradually change it to fit your needs. Even though there may be code
    you don''t understand in there, it may stay isolated from your changes, so you
    don''t have to worry about it. (Anyone who has subclassed a module is familiar
    with this way of thinking.) How do you recognize good code? Emulate the best.


    Now, whenever we''ve asked who to emulate, people have been reluctant to name
    anyone in particular. We applaud their sense of fairness but the result is frustrating.


    Therefore we present our totally biased, incomplete, but still useful list of
    authors whose code you can find on the net, the copying of which will likely lead
    to good results.[6] We''ve put the names in alphabetical order to avoid any more
    outrage than necessary.


    [6] However, if you see any code posted by these or other people with references
    to either golf or bowling, it means they''re competing to see who can solve the
    problem in either the smallest or largest number of characters. The winner in
    either case is unlikely to be highly comprehensible.


    [See http://www.perlfaq.com/faqs/id/154](http://www.perlfaq.com/faqs/id/154).


    Gisle Aas


    Uri Guttman


    Chip Salzenberg


    Greg Bacon


    Joseph N. Hall


    Gurusamy Sarathy


    Graham Barr


    Jarkko Hietaniemi


    Randal Schwartz


    Tim Bunce


    Nick Ing-Simmons


    Michael G. Schwern


    Alan Burlison


    Ronald Kimball


    Lincoln Stein


    Nigel Chapman


    John Macdonald


    Mike Stok


    Tom Christiansen


    Tad McClellan


    Nathan Torkington


    Damian Conway


    Chris Nandor


    Hugo van der Sanden


    Simon Cozens


    Jon Orwant


    Johan Vromans


    Mark-Jason Dominus


    Tom Phoenix


    Larry Wall


    Jan Dubois


    John Porter


    Ilya Zakharevich


    brian d foy


    Larry Rosler


    Note to the obviousness-challenged: this wasn''t a popularity contest and we''re
    not handing out awards. Of course there are dozens of other people we could have
    added, and hundreds more are worthy of inclusion in such a list if only we were
    aware of them all. (And if you''re in that category, we apologize to you.) We
    print it here because it''s the kind of list we wanted, and couldn''t find, when
    we were beginning Perl. Arbitrary and incomplete as it is, we believe it to be
    superior to no list at all.


    Now, when you''re mutating code, be sure and test that the original works before
    you change it![7] This admonition has nothing to do with the reliability of its
    author, rather the fact that everyone''s environment is different, and maybe the
    difference between yours and the author''s is significant. (Sometimes we have
    spent ages trying to find bugs in changes we made while mutating code only to
    find that the problem was in the original.)


    [7] This and some of our other tips fall under the category Joseph N. Hall termed
    "Don''t overlook the obvious"


    in *Effective Perl Programming* (Addison-Wesley, 1998).


    Then modify as little at a time as possible to get something you can test. Change
    the parts you understand the best first—like the names of input/output files and
    e-mail logging addresses—test, and keep going with the harder parts. With luck,
    you''ll eventually end up with what you need without having to touch the parts
    you don''t understand. (Anyone who''s subclassed a module and had to override
    the constructor and other methods is familiar with this approach.)


    **3.6 Accident Prevention**


    These tips fall into the category of installing sprinklers instead of polishing
    your fire hose.


    **3.6.1 Be Strict**


    Put the directive use strict as the first line (after the #! line if there is
    one) of every file (including modules you write; strictness is lexically scoped,
    not program scoped). Especially if you don''t understand why. This makes Perl,
    well, stricter about things that you could get away with without it that are nevertheless
    usually mistakes. It is telling that the one group of people whose expertise would
    most allow them to get away without using strict (the uppermost echelon of Perl
    experts) is the most adamant about its indispensability.[8]


    [8] Except when they''re entering the Obfuscated Perl Contest ([www.tpj.com/contest](http://www.tpj.com/contest)),
    which relies heavily upon not using strict. That ought to tell you something.


    ![Image 27](index-33_1.jpg)


    Don''t think it''s faster to get your program working, then go back and insert
    the use strict, and clean up the resulting errors. It''s much slower, for two
    reasons: first, developing without strictness results in errors being harder to
    find and taking longer to fix. Second, when you add strictness to a lengthy program
    that has never been strict before, the number of errors printed is likely to be
    enormous, and fixing them will probably not be trivial.


    This is not an exaggeration, particularly if your nonstrict code has graduated
    to an operational environment. You may not have the option to shut things down
    while you recode and retest.


    What makes use strict our friend is that most of the objections it raises prevent
    a program that is not following good practices from ever running. (This is called
    *raising a* *compile-time exception.* Although there is one class of errors it
    catches only at run-time.) The biggest favor use strict does for you is to force
    you to declare all your variables with a my statement, or it will complain that
    you''ve referenced a variable without an explicit package name. In other words,
    variables not declared with my belong to a family of variables you seldom need
    to use; so seldom, in fact, that use strict requires you refer to such variables
    by their full names, which include the packages they live in.


    Why is this such a huge favor? Because it guards against the ravages of the common
    typo.


    Consider this code:


    my $enrolled_so_far = 0;


    foreach my $student (@students)


    {


    foreach my $class (keys %registry)


    {


    $enroled_so_far++, last


    if exists $registry{$class}{$student};


    }


    }


    print "Number of enrollees so far = $enrolled_so_far\n"; Without use strict, this
    happily runs, producing the answer "0" no matter what the data.'
