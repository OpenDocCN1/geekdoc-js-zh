    \ = 15.65 CPU)\nunpack: 10 wallclock secs (10.42 usr + 0.00 sys = 10.42 CPU)\n\
    ```\n\n![Image 74](index-129_1.jpg)\n\n### Memoize function calls with common\
    \ arguments.\n\nUsing the CPAN module `Memoize` by Mark-Jason Dominus to transparently\
    \ remember the results of any function call gives you an easy way to trade memory\
    \ for speed. You could do the same thing with slightly less execution overhead\
    \ in your program by creating appropriate data structures and checking for the\
