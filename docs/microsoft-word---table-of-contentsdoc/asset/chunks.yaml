    This isn''t just New Age hocus-pocus; this is at the core of how successful you
    are when you get behind a keyboard. What''s your first reaction when you do that?
    Somewhere on a scale between "Oh boy—I can''t believe I get paid for this!" and
    "Rats. Work again. Can''t wait for the ball game on Saturday."


    This isn''t just measuring your reaction, it''s measuring your enthusiasm; and
    your enthusiasm is directly related to how well you do.


    Sometimes enthusiasm is caused by fear, instead of passion—when your boss tells
    you to finish a project by tomorrow or you''re fired, you wouldn''t call your
    resulting emotional state *enthusiastic,* but you would call it *motivated.* This
    is nearly as effective as enthusiasm deriving from passion, but it''s a poor substitute—the
    resulting stress, anger, and resentment will take their toll. So here''s our first
    Perl of Wisdom on enthusiasm: **Motivate yourself by what you want to move** ***toward*****,
    not what you** **want to** ***get away from*****.**


    In this line of business you are generally in enough demand that you don''t have
    to continue working for a boss who uses threats to motivate you; but if it happens
    anyway, don''t bring that anger and fear to the keyboard (because it''s harder
    to think clearly through those emotions). Think instead of what it is that your
    job brings you that makes keeping it a good thing: the health plan that keeps
    your family well, the money that keeps you fed and clothed, the opportunity to
    create beautiful things. There. Don''t you feel better when you look at it that
    way?


    Perl has some commentary about attitudes as well. (The Perl documentation waxes
    quite philosophical, theosophical, and ontological at times.) It tells us that
    the three principal virtues of a programmer are laziness, hubris, and impatience.
    Why?


    • Laziness: Because doing the same thing more than once is the sign of bad code
    design. If you''re naturally lazy, you''ll naturally balk at the idea of repeating
    yourself.


    • Hubris: A fancy word for egotistical pride. Let''s face it; you need *chutzpah*
    to be a programmer. Just to think that you can outwit something whose innards
    nobody knows *in toto,* that you can defeat the bugs known and unknown, takes
    confidence bordering on recklessness. The main reason that so many people do it
    is for the ego boost from creating something that others will associate with them.
    (This is not to denigrate the well thought out concept of "egoless programming"
    promulgated by Gerald Weinberg … but you''ll notice it hasn''t exactly caught
    on everywhere either.


    Programmers tend to be more hubristic than most.)


    • Impatience: Because you''re not doing this just for the sake of typing at a
    keyboard; you want to create something. Perl was created to satisfy the thousands
    of people who had grown tired of spending so much of their development time satisfying
    the demands of their language rather than the requirements of their solution.
    So turn on that impatience filter, and start noticing when you''re doing things
    that you shouldn''t have to. If you can see how a machine could be doing something
    you''re doing, get the machine to do it if it saves time in the long run. Life''s
    too short to waste on pointless typing.


    **2.2 Beliefs**


    By *beliefs,* we mean those silly little thoughts that we hold unspoken inside,
    which would, if exposed to the light of rationalism, fall apart in a second''s
    worth of examination. Like the belief that makes you kick the lawn mower when
    it doesn''t start even though the only outcome is to stub your toe ("This thing
    should work and I''m punishing it for misbehaving").


    Or the belief that makes you snap at your spouse for not putting the cap on the
    toothpaste tube even though you make as many mistakes of that nature as he/she
    does ("They should live up to certain standards which I punish even myself for
    not meeting"). Or, to use a more familiar example, the belief that error return
    checking can be omitted ("It''s only a little test program … nothing will go wrong").


    Beliefs can be either enabling ("I can do this!") or limiting. Check out these
    common limiting beliefs and see if anything sounds familiar:


    • "I could never be as good a programmer as so-and-so."


    • "My programs just never work right."


    • "I could never understand that complicated computer science stuff."


    How good a person you believe yourself to be is termed *self-esteem.* And yes,
    it does have a bearing on how well you program. It''s been our experience that
    the people with low self-esteem (insufficient hubris, in Perl terminology) are
    the ones who unconsciously compare themselves to the computer and come up short.
    If you think the computer''s going to beat you, you''ve handicapped yourself unnecessarily.
    You need the gall to believe that you can handle any problem it can hurl your
    way. Even the kind you''ve never met before. Of course, nothing feeds the ego
    like a track record of success, but some people who have that track record still
    don''t acknowledge it. And if you don''t have that track record yet, how can you
    get it? What resources do you have for improving your knowledge, skill, and experience?


    To sit in front of a computer with a limiting belief is to handicap yourself before
    you even begin. But it''s not always easy to tell that you have limiting beliefs,
    because they almost always go unspoken, unvoiced even in your thoughts. They just
    sit there like a faceless bureaucrat in an anonymous government office rubberstamping
    "Application Denied" on your hopes and ambitions.


    So, like an astronomer finding a black hole, you identify a limiting belief by
    its effect on what surrounds it. A good way to do this is by observing changes
    in your mood that have no good explanation. If you''re working on a program and
    realize that while you entered the office in an upbeat mood, you''re now sitting
    under a cloud of funk, ask yourself what changed, and when? If you''re aware enough
    to notice that it happened the moment you sat in front of the keyboard, what was
    going through your mind at the time?


    Like firefly flashes in the night, limiting beliefs trigger sudden negative statements
    that zip through your brain almost too quickly to notice. Was it the "Computers
    always end up beating me" thought? Or the "I''m afraid I''ll screw something up
    horribly" thought? Or one of thousands of other possibilities? Whatever it was,
    the moment you catch it, it will dissolve under the power of awareness like blowing
    on a dandelion. Because you know that whatever your history, you''re not bound
    to repeat it, and you know if you talk with the right people about what you''re
    doing, no honest mistake is going to be catastrophic.


    **2.3 Behavior**'
