  trans: "\nPerl 的标量变量（scalar variables）不是强类型的。它们可以根据你的心情像像蛎一样在整数、浮点数和字符串之间切换（尽管如果你曾经将一个引用转换为字符串，就无法将其转回去了）。即使你给一个变量赋值了一个特定类的对象，也没有什么能阻止你用另一个类的对象、甚至一个根本不是对象的东西来覆盖它。这是多态性的极致体现。（截至\
    \ 5.005 版本，已经有了能力向编译器声明某个标量是属于某个特定类的对象（如 `my Dog $spot`），但即使这也只是一个松散的约定，你可以在任何随意的时候打破它。[2]（它允许对字段访问进行编译时检查，这是实现实例数据的一种方式。）\n\
    \n[2] 截至出版时，Damian Conway 提出了一个*可以*限制变量为特定对象类的模块，但甚至名称都尚未确定。\n\n动态变量（即非词法作用域变量）除非用\
    \ `local` 语句修饰，否则它们具有全局作用域。但无论你也不想以这种 BASIC 风格进行编程；将所有变量声明为词法作用域（lexical），作用域规则就是你已经熟悉的那些。\n\
    \n你再也不用担心你的 `free` 是否匹配你的 `malloc` 了！在 Perl 中，意外创建内存泄漏是非常困难的。每当你看到像这样的代码时 `$soldier\
    \ = make_warrior ('squaddie');`：\n\n```\nsub make_warrior\n{\n    my $fighter;\n\
    \    ...\n    return $fighter;\n}\n```\n\n这在 C 语言中会让你心提到嗓子眼，放松吧。从 C 的角度来看，`$fighter`是从堆分配的，而不是栈，所以它不会在\
    \ `make_warrior` 的栈帧销回时立即变得失效。此外，只要还有对 `$fighter` 的引用，分配给它的空间就不会被释放，而 `$soldier`\
    \ 就是这样一个引用。只要有东西需要这个空间，它就会保持分配状态；一旦不再需要它，它就会被释放。这就是你在 C 中习惯花费大量时间苦结的事情。\n\n如果你没有参数要提供给函数，函数后面不需要加\
    \ `()`，但如果你对你自己的函数这样做，那么它们的定义（或原型声明）应该在它们的使用之前。\n\n虽然在 C 中中表达式 `a[i]` 和 `i[a]`\
    \ 是等价的，但在 Perl 中对应的表达式并不等价。如果你觉得这很惊讶，你可能需要比我们提供的更多的帮助。\n\n虽然 Perl 从 C 继承了许多运算符（以及它们的优先级），并可能最努力让\
    \ C 程序员更容易上手，但它也力做到尽可能正交（orthogonal）。\n\n例如，虽然 Perl 提供了与 C 相同的 `&&` 和 `||` 运算符，但它们返回的是输入值而不是布尔值。换句话说，如果\
    \ `$a` 为真，则 `$a || $b` 是 `$a`；否则它是 `$b`。（运算符以相同的方式进行短路）。在另一个例子中，Perl 认为任何可以是左值（lvalue）的东西都应该是，因此包含三元运算符\
    \ `(?:)` 的术项如果其左右部分都是左值，它就是一个左值。如果 `substr` 函数第一个参数的结果是可修改的，那么它就是一个左值。从 5.6.0\
    \ 版本开始，你甚至（在一个实验性功能中）可以创建一个自己的左值函数。\n\n尽管 Perl 中没有 `switch` 语句，但这并没有阻止人们发明几十种模拟它的方法，最新的是\
    \ `Switch.pm`，这是 Damian Conway 在第四届年度 Perl 大（[`conference.perl.com/`](http://conference.perl.com/)））上展示的模块。没有\
    \ switch 的原因是，当你开始实现一个时，考虑到 Perl 运算符的广度，你的平均 switch 语句似乎非常局限。\n\n为什么每个 `case`\
    \ 只是一个简单的等值测试？为什么不能也能与正则表达式进行比较呢？（甚至 Bourne shell 都能做到这一点。）为什么要排除庞大的逻辑比较集？在 `Switch.pm`\
    \ 出现之前，似乎没有任何可以实现的东西看起来不像语言其他部分的劣质品。（现在看来 `Switch.pm` 的某些版本将被纳入核心 Perl 6 语言中。）分层数据结构在\
    \ Perl 中是完全无类型的（非典型的吗？）；不再需要折腾 `union` 语句来遍历异构列表了。有时，人们担心这意味着他们必须按部就班地检查复杂对象的每个元素的类型，以确保不会错误地解引用某些东西；也就是说，直到他们意识到自己可能就是构造该对象的人，而且他们通常可以信任自己。\n\
    \n不要寻找 `struct` 的对应物并指望你会频繁使用它。如果你想实现完全相同的效果（复合变量的命名成员），你可以通过哈希引用（或对象）来实现；但在实践中，你对这些东西的大多数用途并不是必要的。不需要为链表编写特殊代码（尽管你有某些特殊需求\
    \ [3]，有一本书会教你怎么做）；Perl 的数组按需增长得足够好。构建树的大部分理由通过 Perl 高效查找哈希中元素的算法解决了。（再次，如果你有某种能压倒这种机制的需求，该书提供了替代方案。）\n\
    \n[3] *Mastering Algorithms with Perl*, 作者 Jon Orwant, Jarkko Hietaniemi 和 John\
    \ Macdonald (O'Reilly, 1999)。\n\n## 12.3 给 FORTRAN 程序员的提示\n\nPerl 代码对 FORTRAN\
    \ 程序员来说很奇怪。FORTRAN 专门使用 `()` 进行索引。数组元素的形式为 `ARREL(1)`，矩阵元素的形式为 `MATEL(1,1)`，子程序调用的形式为\
    \ `CALL ASUB (VALUE1, VALUE2)`，而 Perl 根据数据类型和函数以多种方式使用 `()`、`[]` 和 `{}`。例如，而 `$a[$i]`\
    \ 是数组的元素，而 `$a{$i}` 是哈希中的值。忘记这些分隔符的正确用法是 FORTRAN 新手的常见错误。\n\n如果你使用 FORTRAN 是为了其原生的高精度浮点数（如果不是——你用它干什么？），你会发现\
    \ Perl 的 IEEE 浮点数是不精确的（就像用 C 语言编程一样）。你可以在 CPAN 的 `PDL` 模块或核心的 `Math::BigFloat`\
    \ 模块中找到慰藉。\n\n`COMMON` 块是一种同时传递大量全局变量的糟糕方式，在 FORTRAN 中的使用频率远高于应该。（如果你想定义多个 FORTRAN\
    \ 文件使用的公共常量，请使用预处理器；这不是 60 年代了。）在 Perl 中提供共享主题常量集合的方法是将它们放入一个模块，使用 `Exporter`，然后在需要的地方导入：\n\
    \n```myconsts.pm\npackage myconsts;\n\nuse Exporter;\n\n@ISA = qw(Exporter);\n\
    \n@EXPORT_OK = qw(PI E);\n\nuse constant PI => 3.14159265;\n\nuse constant E =>\
    \ 2.71828183;\n\n1; # 模块必须返回真值\n```\n\n```mytest\n#!/usr/local/bin/perl\n\nuse\
    \ myconsts qw(PI E);\n\nprint \"PI*E = \", PI * E, \"\\n\";\n```\n\n```text\n\
    % mytest\nPI*E = 8.53973421775655\n```\n\n这值得作为一条 Perl 格言：\n\n**将公共的常量集合放在自己的模块中，使用\
    \ Exporter，并在需要的地方导入它们。**\n"
- fmt: '

    If you prefer to use `EQUIVALENCE`—well, it''s time to break the habit. You can
    create aliases for the same variable in Perl, but it''s rarely useful. The `Alias`
    module provides an easy way of doing this if you must. If you want to alias one
    variable to the storage space of many, or vice-versa, as you can with `EQUIVALENCE`,
    well, you can''t. And you''ll get no sympathy from us.


    If you are a `FORTRAN` programmer who never uses, nor intends to use, `EQUIVALENCE`
    statements or `COMMON` blocks, good! God only knows the measure of misery and
    heartache that has been inflicted on humanity by these monstrosities.


    ## 12.4 Tips for the Shell Programmer


    You and the C programmer are Perl''s favorite children (assuming that by "shell"
    we are talking about the Unix variety; the DOS/NT command line interface is quite
    a different beast).


    You alone among the other newcomers think it''s quite natural for scalar variables
    to start with `$`, and you just need to get used to the fact that the `$` is there
    during assignment as well as during reference. It may have seemed stifling at
    first that calls to external programs had to be wrapped in `system()`, although
    you were right at home with the use of backticks (`` ``) to capture program output.
    But if you tried to compensate by using `Shell.pm` just to avoid those `system()`
    calls, try doing without. A shell script needs a low syntactical overhead for
    calling external programs because it can do so little itself; Perl can do so much
    that calls to other programs are much less frequent. Overcome the tendency to
    call those beloved programs like `cut`, `head`, `sed`, and yes, even `awk` for
    text filtering; once you''ve learned to do the same things in Perl, you will seldom
    feel the need to go back. If you try converting a shell script to Perl, you''ll
    find this principle rearing its head as you repeatedly excise calls to utility
    programs.


    A shell program is interpreted a line at a time, which means that you can have
    any old junk representing your thoughts to date on the future direction of your
    script, as long as it won''t actually get as far as executing any of those statements.
    Perl requires that the whole script be syntactically correct before it tries executing
    any of it, which means that you can''t even hide something in an `if (0) { ...
    }` block without making sure that it is syntactically correct.


    But you can achieve the effect you want by inserting a line consisting solely
    of `__END__` and the rest of the program will be ignored. (Actually, it becomes
    available for your program to read through the filehandle `DATA` if you wish.)


    Perl''s quoting rules will be a welcome relief—no more fighting to determine the
    combination of `''`, `"`, and `\` to get what you want. The simple rule is: Interpolation
    (the Perl term for what you call parameter substitution) is determined only by
    the type of the outermost quotes. For instance, if you want to pass a variable
    that may contain spaces to the `grep` program, just say


    ```

    system "grep -s ''$quote'' @files";

    ```


    and the double quoting around the whole command ensures that `$quote` and `@files`
    are interpolated. The former is decorated with single quotes, and the elements
    of the latter are space-separated by default, exactly what we want. What if you
    want to embed `$quote` between double quotes instead? Perl allows you to put a
    double quote in a double-quoted string by preceding it with a backslash, but there
    is a cooler solution using Perl''s `qq` quoting operator, which allows you to
    choose a different delimiter and thereby eliminate the need to backwhack quotation
    marks:


    ```

    system qq(grep -s "$quote" @files);

    ```


    If `$quote` can contain absolutely any characters, however, and you don''t want
    any of them to be interpreted as metacharacters either by the shell or by the
    `grep` command, you need to make sure that all of the potential troublemakers
    are escaped, and Perl has a special escape sequence pair just for the job:


    ```

    system "grep -s \Q$quote\E @files"

    ```


    Extending this to handle the possibility of members of `@files` containing white
    space or metacharacters is left as an exercise for the reader.


    Speaking of operators, Perl uses `eq` and `ne` for strings, and `==` and `!=`
    for numbers, which you probably think is the wrong way around.


    You''ll be pleased to learn that the return code for the backticks and `system`
    command is stored in the familiar `$?`. However, that return code is not the one
    you''re used to; it''s the one that C programmers get from their `system` call,
    so shift it right by eight bits to get the code you want. (The bottom eight bits
    contain information most people aren''t interested in, like whether the program
    core dumped or what signal interrupted it, at least on Unix.)


    ## 12.5 Tips for the C++ or Java Programmer


    The object-oriented features of Perl may appear frighteningly sparse; in fact,
    they are the consequence of a careful design to avoid unnecessarily bloating the
    language. For instance, there is no `this` keyword for referring to the current
    object in a method; instead, it''s passed as the first parameter, and you can
    pick your own name. Most people pick `$self` because the declaration `my $self
    ...` has a nice ring to it (or because they are former Smalltalk programmers).


    Run-time semantics alone determine whether a routine is an object method or a
    class method, so you can easily write one that swings both ways. (A common idiom
    makes an object method out of a constructor.)


    There is nothing special about a constructor method in Perl; you can call it anything
    you want, but most Perl programmers call it `new` to make you feel welcome. Not
    only is the underlying implementation of an object exposed, but you get to implement
    it yourself from a bewildering array of choices. (The one you''ll feel most comfortable
    with is a hash; don''t even look at the others until you''ve gotten the hash under
    your belt.) And there is no native support for creating instance attributes or
    inheriting them, although there are optional pragmata (`base`, `fields`) that
    provide some syntactical sugaring for doing so.


    Regardless, your callers should not access your instance data directly but instead
    via accessor methods. You may use a module (such as `Class::Struct`) to create
    those methods automatically, although it seems that any class worth writing these
    days requires custom logic in each accessor method.


    It is possible for a caller to modify the object''s instance data directly unless
    you go to great lengths to make the instance data as private as you''re accustomed
    to. (See "Closures as Objects" in the perlot documentation page.) This is rarely
    perceived as a problem in Perl since the philosophy is that people who fiddle
    with instance data directly when the specification for the public interface to
    the class doesn''t permit it deserves whatever they get.


    Because there are no function prototypes (of the kind you''re used to) in Perl,
    there is no method overloading with different prototype signatures. You get to
    validate the number and type of arguments you''re called with at run time, if
    you want.


    You cannot enforce abstract (pure virtual) methods to be overridden at compile
    time, but you can create one that throws a run-time exception, unless it has been
    overridden.


    You''ll find more methodical comparisons among Perl, C++, and Java in Damian Conway''s
    excellent book, *Object-Oriented Perl* (Manning, 1999).


    ### 12.5.1 Specific Tips for the Java Programmer


    In Perl you have the option of creating a program that is not at all object-oriented
    and—horrors—isn''t even a class. This is actually the best approach for solving
    many problems, as hard as it may be to get out of the habit of doing a class hierarchy
    decomposition every time you write a program.

    '
