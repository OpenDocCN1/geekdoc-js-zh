    (We''ve shown only the option-parsing part.) This has a slightly different interface;
    instead of separating multiple values with commas, we must repeat the -D flag:


    % **whizzbang.pl -D WEB -D REG**


    (We could also say "-D=WEB -D=REG".)


    Getopt::Long permits many more choices than this, of course. If you have a complex
    program (particularly one worked on by multiple programmers), look to it for support
    for the kind of debug flag setting interface you''ll find useful. Brad Appleton
    says Sometimes I will have a debug flag per each important subsystem of a large
    Perl program encompassing many modules. Each one will have an integer value. Sometimes
    I will have a debug argument along the lines of


    -debug Pkg1=f1,f2,... -debug Pkg2=f3,f4,...


    If the value for Pkg1 is an integer, it sets a package-wide debug level/flag.


    Otherwise, it says which specific functions to debug in the package.


    If you''ve been thinking that "tracing code" means profiling its run-time performance,
    never fear; we will tackle that topic in Chapter 11.


    **Chapter 6\. Testing Perl Programs**


    "Run and find out."


    —The Jungle Book, Rikki-Tikki-Tavi *by Rudyard Kipling*


    ![Image 45](index-64_1.jpg)


    Hands up everyone who hates testing their code. Yes, we thought so. And who can
    blame you? The hidden beliefs that make testing so painful run deep:


    • I might find something so wrong that I have to make a radical change.


    • If I find something wrong, I''ll have to delay delivery.


    • I''m a code writer, not a code tester.


    • If I find something wrong, I''ll lose plausible deniability unless I take the
    time to fix it.


    • It''s really elegant the way it is. I don''t want to be bothered with special
    cases that no one''s likely to hit anyway.


    • Users are the best testers. They have real test cases.


    It''s a rare programmer who doesn''t have at least one of those going on (our
    hands are up too). Unfortunately, as dirty as the job is, it''s yours and no one
    else''s responsibility to make sure you deliver the very best code you can. So
    let''s wade past the discomfort and the apathy and see what we can do.


    Testing is getting more attention these days, thanks to a new methodology called
    Extreme Programming (XP), which states not only that everything shall be tested,
    but also that the tests will be written before the code they test. Here''s a breakdown
    of different types of testing:


    • *Inspection testing, or code walkthroughs.* Nothing is executed; people simply
    read the code.


    • *Unit testing.* Each individual component is tested for the expected response
    under the design conditions and for correct error responses under all other conditions.


    Although there is no clear definition of how large a component can be tested,
    it is expected that it is small enough so that you can test all or nearly all
    the possible boundary conditions and execution paths and it is relatively easy
    to test the component in isolation. In most languages, the unit is a subroutine.


    • *Integration testing.* This is testing whether a subroutine or group of subroutines
    functions according to design specifications with regards to API and linked with
    whatever other subroutines exist in a project. Issues to consider at this stage
    are namespace conflicts and memory leaks.


    • *System testing.* The entire system (or whatever you call the thing you are
    delivering) is tested against the customer''s requirements. (You did get requirements
    from the customer, didn''t you?)


    • *Regression testing.* This is the same as system testing, but the term implies
    that it is performed whenever any changes have been made to the system to ensure
    that the system still performs correctly and has not *regressed* to some other
    state.


    • *Saturation testing, or load testing.* In a system that handles arbitrary loads
    (such as Web servers) it''s important to find out what its limits are. This type
    of testing throws more and more simultaneous requests at the system until it fails
    or you have exceeded the requirements by a vast margin.


    • *Acceptance testing.* This one isn''t for you; it''s for the customer. They
    need a way to tell whether what you''ve delivered to them meets their requirements.
    In an ideal world, they write the test themselves, and warrant that it matches
    the requirements they gave you. Don''t be surprised if they ask you to write the
    tests for them, though.


    (Don''t be surprised if they ask, "What''s acceptance testing?" either.) Few projects
    include all these types of testing; the distinctions among several of them are
    blurred anyway, and it will usually be acceptable to leave some out. XP requires
    only unit testing and regression testing; code walkthroughs of a sort happen because
    programmers are required to work in pairs.


    Let''s go through each type of testing and see what it means to a Perl programmer.


    **6.1 Inspection Testing**


    Other people are going to look at your code—they may find bugs—and they are very
    likely to comment on its readability and maintainability. If you picked a consistent
    style (see Perl of Wisdom #6) and consistently commented your code, they should
    have fewer nits to pick in that department.


    You are not bound to accept every comment from the people reviewing your code
    (people who should be your peers; this process is *not* a management function),
    only the ones that make sense. The more you can keep your ego in check, the better,
    because you want to be able to learn from the process; merely showing off how
    brilliant your code is won''t do anything to improve your craft.


    A mammoth bone of contention that often arises is the issue of code clarity. If
    a neophyte programmer presents code to veterans, the latter will suggest all sorts
    of optimizations to abbreviate the code. This issue is more acute with Perl than
    perhaps with any other language ever invented. Even more vexingly, an expert programmer
    showing code to novices will hear all kinds of standard idioms attacked as "obfuscated,"
    "too clever," or


    "incomprehensible."'
