  trans: '


    一个常见的问题是程序运行到末尾并收到“Debugged program terminated（被调试的程序已终止）”的消息。此时，你所有的变量都已经被销毁了。如果你想在程序最后一行执行后检查变量的状态，可以添加一个哑行（单独写一个
    `1` 即可），这样你就可以在上面设置断点。


    ### 贴士


    在检查哈希（hash）时，请改为检查它的*引用*。这能让 `x` 命令看到你正在检查的数据类型，而不是接收它被求值后的列表，并且它可以以更美观的格式进行输出：


    ```perl

    DB<1> %h = (Craig => ''Stirling'', \Sharron => ''Macready'', Richard => ''Barrett'');

    DB<2> x %h

    0 ''Sharron''

    1 ''Macready''

    2 ''Craig''

    3 ''Stirling''

    4 ''Richard''

    5 ''Barrett''

    DB<3> x \%h

    0 HASH(0x8330d5c)

    ''Craig'' => ''Stirling''

    ''Richard'' => ''Barrett''

    ''Sharron'' => ''Macready''

    ```


    ![Image 49](img/index-79_1.jpg)


    **在调试器中检查哈希的引用而非哈希本身，可以获得格式良好的输出。**


    ### 7.2.3 检查源码：`l`, `-`, `w`


    有时你希望获取比不仅仅是当前行更多的程序上下文。以下命令可以显示你的源码部分：


    `l`

    从即将执行的当前行开始列出连续的源码窗口。


    `l x+y`

    从第 `x` 行开始列出 `y + 1` 行源码。


    `l x-y`

    列出从第 `x` 行到 `y` 行的源码。


    `-`

    列出当前之前的之前的源码窗口。


    `w`

    列出当前行周围的行窗口。


    `w <line>`

    列出 `line` 行周围的行窗口。


    `.`

    将窗口列表的指针重置为当前行。


    可以设置断点的源码行（即带有 `*` 的行可以在其前面插入断点——见下一节）在行号后有一个冒号。


    ### 7.2.4 在沙盒中运行


    由于调试器是一个功能完整的 Perl 环境，你可以随时输入 Perl 代码来检查其在调试器下的效果；[1] 有人将此作为快速测试代码的方法，而无需将其输入脚本，或在达到文件结束符之前完美地输入所有内容。（你刚刚在
    7.2.2 节末尾看到我们这样做。）


    [1] 那么，你可能会想，如何输入恰好看起来像调试器命令的 Perl 代码呢（因为你定义了一个名为 `l` 的子程序）？在 5.6.0 之前的 Perl 版本中，如果你在文本前输入空格，调试器会认为这是
    Perl 代码而非调试器命令。所以小心不要在输入调试器命令之前不小心按下空格键。从 5.6.0 版本开始，这就不再成立。


    输入 `perl -de 0` 进入此环境。[2] 让我们将其作为测试 Perl 构造的沙盒：


    [2] 当然，除了 0 之外，还有许多表达式同样有效。Perl 只需要一些无害的内容运行。


    ```perl

    % perl -de 0

    DB<1> $_ = ''What_do*parens-in=split+do%again?'';

    DB<2> @a = split /(\W+)/;

    DB<3> x @a

    0 ''What_do''

    1 ''*''

    2 ''parens''

    3 ''-''

    4 ''in''

    5 ''=''

    6 ''split''

    7 ''+''

    8 ''do''

    9 ''%''

    10 ''again''

    11 ''?''

    ```


    你甚至可以使用此功能更改你正在调试的程序中的变量值，这是一种观察程序在不同情况下行为的有效策略。如果你的程序构建某些内部变量值的方式复杂，且需要对输入进行大量修改才能使其形成不同的变量，那么玩“如果……怎样”的好方法是在调试器中正确的地方停止程序并手动修改值。我们该如何停止它呢？看看……


    ### 7.2.5 设置断点：`c`, `b`, `L`


    调试器的一个重要功能是允许程序继续执行，直到满足某些条件。最常见的条件是调试器到达源码中的某特定行。你可以使用 `c`（代表 continue，继续）命令告诉
    Perl 调试器运行到特定的行号：


    ```perl

    main::(debug.pl:4): my @parole = qw(Salutations Hello Hey);

    DB<1> c 16

    main::print_line(debug.pl:16): print "$_ Perl World\n"; DB<2>

    ```


    调试器实际上做的是在第 16 行设置了一个单次断点，然后执行你的代码直到那里。如果它在此之前遇到了另一个断点，它会先停在那里。


    那么什么是断点呢？它是你在某行代码之前立即设置的标记，对 perl 调试器以外的任何人都是不可见的，它会导致调试器到达该处时停止并将调试器提示符将控制权返回给你。如果你在之前列出的源码检查命令打印出的代码行设置了断点，你会在它旁边看到一个
    `b`。


    ### 7.2.6 执行操作：`a`, `A`


    在调试器中执行任意代码的设施的一种更高级的用法是*动作（action）*功能。通过 `a` 命令（语法为 `a line code`），你可以指定在某行即将执行之前执行的代码。（如果该行设置了断点，则动作会先执行；然后你将获得调试器提示符。）动作可以任意复杂，并且与编译语言调试器中的此类设施不同，它允许让你进入程序内部：


    ```perl

    main::(debug.pl:4): my @parole = qw(Salutations Hello Hey);

    DB<1> a 16 s/Hey/Greetings/**

    DB<2> c

    Salutations Perl World

    Hello Perl World

    Greetings Perl World

    Done

    Debugged program terminated.

    ```


