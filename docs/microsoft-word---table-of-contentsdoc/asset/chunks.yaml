    \n“运行一下就知道了。”\n—鲁德亚德·吉普林《丛林之书》，里奇·蒂基·塔维\n\n![Image 45](img/index-64_1.jpg)\n\n\
    所有讨厌测试代码的人请举手。是的，我们早就料到了。而且谁能怪你呢？那些让测试变得痛苦的隐藏观念根深蒂固：\n\n- 我可能会发现严重的错误，以至于我必须进行彻底的更改。\n\
    - 如果我发现了错误，我就得推迟交付。\n- 我是一个代码编写者，不是一个代码测试员。\n- 如果我发现了错误，除非我花时间修复它，否则我将失去合理的推卸理由。\n\
    - 现在的写法已经很优雅了。我不想被可能没人会碰到的特殊情况打扰。\n- 用户是最好的测试者。他们有真实的测试用例。\n\n很少有程序员不抱有至少一种这种想法（我们也一起举手了）。不幸的是，尽管这项工作很脏，但确保交付最优异的代码是你的责任，而不是别人的责任。所以，让我们越过这种不适感和冷漠，看看我们能做什么。\n\
    \n测试越来越受到关注，这得益于一种被称为“极端开发”（XP）的新方法，它不仅规定一切都必须经过测试，而且规定测试要在被测试的代码之前编写。以下是不同类型测试的分解：\n\
    \n- 检查测试，或代码审查。不执行任何代码；人们只需阅读代码。\n- 单元测试。对每个单独组件在设计条件下的预期响应以及在所有其他条件下的正确错误响应进行测试。虽然对于组件应该有多大没有明确的定义，但预计它应该足够小，以便你可以测试所有或几乎所有可能的边界条件和执行路径，并且相对容易隔离测试该组件。在大多数语言中，单元是一个子程序。\n\
    - 集成测试。测试一个子程序或一组子程序在 API 以及与其它子程序的连接方面，功能是否符合设计规范。\n- 系统测试。根据客户需求对整个系统（或无论你称呼它为什么什么）进行测试。\n\
    - 回归测试。这与系统测试相同，但该术语意味着当进行任何更改时都会执行，以确保系统仍然正常运行。\n- 饱和测试，或负载测试。在一个处理任意负载的系统（如\
    \ Web 服务器）中，找出其极限是有关重要的。这种测试向系统发送更多、更频繁的请求，直到系统失败或你大幅超过了需求。\n- 验收测试。这个不是给你的；它是给客户的。他们需要一种方法来判断你交付的内容是否符合他们的需求。\n\
    \nXP 只需要单元测试和回归测试；某种形式的代码审查发生是因为程序员被要求结对工作。\n\n其他人会查看你的代码——他们可能会发现 bug——而且他们很可能对代码的可读性和可维护性发表意见。如果你选择了统一的风格（参见《Perl\
    \ 之智慧 #6》）并一致地对代码进行注释，他们在这个方面可以挑的毛病就会减少。\n\n你没有义务接受评审代码的人提出的每条意见（这些人应该是你的同级；这个过程不是管理职能），只需要接受那些合理的意见。你越能控制好自尊心就越好，因为你希望在这个过程中有所学习；仅仅展示你的代码有多聪明对提高你的技艺毫无帮助。\n\
    \n"
- fmt: '

    There is no universal solution to this problem. If the practice at your business
    is to code at the level of the lowest common denominator, then the presence of
    a beginner will drag the whole team down. If the practice is to code to the level
    of the majority then the value of an expert will be diminished by an average team.
    On the other hand, the expert''s code will be useless to the company if no one
    who''s left on the team can understand it after the expert leaves (although it
    might motivate some of them to improve their skills). Only a wise manager can
    decide what''s right for their team. If you''re managing a team that harbors a
    prima donna, try suggesting to that person that the greatest wizard of all is
    the one who can present an advanced idiom in a way that makes it understandable
    to novices.[1]


    [1] If they pooh-pooh this suggestion, refer them to the writings of physicist
    Richard Feynmann, who is probably one of their heroes, and who firmly believed
    that any physical principle that was truly understood could be explained at the
    high school level.


    The one tip we can offer is to use standard idioms and styles wherever possible.
    If you code something in a way that is familiar to other people, then even if
    they don''t work at your business they can be hired, or other team members can
    learn the idiom as it is shared through books and the Internet. If a reviewer
    says you''ve coded something for which a well-known idiom exists, find out what
    that idiom is. The benefit in this respect of frequenting Internet newsgroups
    and mailing lists is huge.


    If you''re creating large systems in Perl, they should almost certainly be broken
    down along object-oriented lines. It will be much easier to understand each object
    class one at a time.


    You might also consider the CPAN module `B::Fathom`. This generates a score representing
    a measure of complexity of the code it is fed.


    ## 6.2 Unit Testing


    Perl shines at unit testing. Although there''s no empirical data to prove this,
    conversational evidence suggests that most Perl programs are short enough that
    unit testing is the same as system testing. People often report that their programs
    shrink by 90% when converted from C to Perl (our experience bears this out). A
    1000-line C program requires more heavy-duty testing than a 100-line Perl program.


    ### 6.2.1 The One-Liner


    Although not strictly in the category of unit testing, we must mention the utility
    of the oneliner. Several flags in Perl make it possible for you to test an idiom
    without even having to write a script, but instead just entering the code on the
    command line. The first of these is:


    - `-e code`: Execute code as though it were in a script. Put single quotes around
    code on Unix to prevent the shell being confused by metacharacters, and use double
    quotes on DOS.


    We can combine this with the `-w` flag if we want to enable warnings. Let''s say
    that we want to check on which way `printf` rounds `0.5`:


    ```

    perl -we ''printf "%1.1f %1.f\n", $_+.5, $_+.5 for 1..4''

    ```


    1.5 2


    2.5 2


    3.5 4


    4.5 4


    (No, that''s not a mistake; that''s the way the IEEE floating point standard says
    it should work.)


    Note by the way that the `-e` flag has to be the last one before code; you can''t
    type `perl -ew …`


    - `-p -n`: Execute code for every line from the input, and either print `$_` automatically
    when done (`-p`) or not (`-n`).


    Say you want to find out the ASCII codes generated by certain keys on your keyboard;
    you could type


    ```

    perl -pe ''s/(.)/" ".ord $1/ge''

    ```


    and then hit a key followed by a newline to see its ASCII value.


    - `-l` (the letter ''ell'', not the number one): Append an automatic newline to
    print statements. When combined with `-n` or `-p`, also automatically chomp the
    newline character off the input.


    Let''s say you want to find which users listed in a Unix `/etc/passwd` file have
    directories under `/home`:


    ```

    perl -nle ''s/:.*//; print if -d "/home/$_"'' /etc/passwd

    ```


    This can most usefully be used as a first stage in a pipeline of commands that
    then go on to do other things with its results. Or you might want a Perl program
    as the final stage of a pipeline that periodically reports how many lines it has
    read:


    ```

    ... | perl -nle ''BEGIN{ $SIG{ALRM} = \**sub{ print $.; alarm 10 }; \**alarm 10
    }''

    ```


    In this case, nothing at all is being executed in the loop for each line of input!


    The `-l` flag is particularly useful in one-liners or in short test programs in
    which you have only a handful of print statements and want to save the trouble
    of typing `\n` in all of them.


    However, don''t leave it in production code; setting a global flag like this affects
    the behavior of all print statements and will produce unpleasant results from
    using modules that don''t expect it (such as `CGI.pm` and `Benchmark`).


    - `-Mmodule`: Perform a `use module` before executing any code.


    You can use this to impose strictness on your one-liners, and also as a quick
    test to see if a module you want is installed:


    ```

    perl -MTime::HiRes -e 0

    ```


    This prints nothing if the `Time::HiRes` module is installed but complains if
    it isn''t.


    - `-c`: This flag gives you the ability to check the syntax of a Perl program
    without actually running it. Because so much error checking is deferred until
    run-time in Perl,


    ![Image 46](index-68_1.jpg)


    this is of limited use, but there are certainly times when it can save some time
    by serving as a quick sanity check.


    **Use one-liners for rapid prototyping of small code constructs.**


    Some Web shrines to the power of the one-liner have been erected at


    http://history.perl.org/oneliners/ and http://www.itknowledge.com/tpj/one-liners01.html
    (oneliners that previously appeared in *The Perl Journal*).


    ### 6.2.2 Assert Yourself


    The CPAN module `Carp::Assert`, by Michael G. Schwern, exports the routine `assert`,
    which allows you to trigger fatal exceptions with explanations during testing
    and then disable them globally before putting the application into use.


    ### 6.2.3 Design by Contract


    *Design by Contract* is an idea from Eiffel world that says you can add to your
    routines tests that express conditions that should be true before and after they
    execute, and conditions that should be true the the. The new `Class::Contract`
    module by Damian Conway provides this facility for object-oriented modules, although
    you need to use its methods for creating your objects; it would be hard to retrofit
    to an existing class.


    ## 6.3 System or Regression Testing


    Perl comes with code for testing itself, and you can use these same tools for
    your regression tests. They are deceptively simple. The `Test::Harness` module
    maintained by Andreas König exports a routine `runtests` that takes as arguments
    the names of programs to run. It looks for a header line of the form "1..*max*"
    and output lines that say either "ok *n*" or "not ok *n*", where *n* is between
    1 and *max*; all other output is ignored and discarded. When it''s done with all
    the tests, it prints a summary containing either the magic word "successful" or
    the dreaded word "FAILED."


    But wait, there''s more. The `Test` module[2] by Joshua Nathaniel Pritikin makes
    it easy for your programs to output the "ok/not ok" lines. It exports the routine
    ok, which evaluates its arguments to determine which kind of line to output (based
    on a whole slew of convenient possibilities depending on the number and type of
    arguments), and the subroutine `plan`, for outputting the header containing the
    number of tests.


    [2] Both these modules are considerably more powerful than indicated in our brief
    explanations; we''re just hitting the highlights.


    Therefore `Test` provides assertion mechanisms for outputting success/failure
    information that can then be logged from multiple scripts by `Test::Harness`,
    which will output a summary telling you whether the entire test passed or identifying
    which subtests failed.

    '
