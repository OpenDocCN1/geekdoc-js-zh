- "# Microsoft Word 目录.doc\n\n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\
  \n\n\n## 目录\n页数：288\n\n[content]\n\n“这本书读起来真是一种享受。它涵盖了各种调试技术，包括从源头上消除 Bug 的‘防御性’范式。作为美国编程小组的教练，我发现最难教的就是调试。这是我听过的第一本直接从问题本身着手的教材。它做得非常好。请鼓励这些小伙子写更多内容。”——**Rob\
  \ Kolstad** \n\n`Perl Debugged` 为开发者提供了在 Perl 中编写更佳、更快、更可靠代码所需的专业知识和解决方案。本书专注于 Perl\
  \ 编程中最令人头疼的问题——调试。这本包含丰富示例的指南和操作指南，最大限度地缩短开发、故障排除和维护时间，从而创建出优雅且无误的 Perl 代码。\n\n\
  本书专为初级到中级的软件开发者设计，`Perl Debugged` 将节省程序员在调试 Perl 程序时的时间和挫败感。\n\n基于作者对该语言丰富的经验，本书引导开发者完成整个编程过程，应对\
  \ Perl 编程中的优势、困境和陷阱。书中从 Perl 文档的引导之旅开始，逐步过渡调试、测试和性能问题，还专门安排了一个章节讲解 Perl 中的 CGI 编程。在全书中，作者推崇防御性范式以提高\
  \ Perl 代码的准确性和性能。此外，`Perl Debugged` 还包含了 Scott 和 Wright 的“智慧之珠”（Perls of Wisdom），总结了每个章节的核心思想，以及一个包含\
  \ Perl 调试器命令完整列表的附录。在这部卓越的参考书和调试指南中，作者涵盖了高效 Perl 编程的各个方面，包括：\n\n- CGI 编程——调试此类 Perl\
  \ 程序的特殊技巧\n- 如何培养在 Perl 中进行高效开发和编程的正确心态\n- Perl “陷阱”（gotchas）——如何理解它们、绕过它们并避免它们\n\
  - “反调试”（Antibugging）——作者关于如何进行防御性编码的经验法则\n- Perl 调试器——作者关于使用这一 Perl 内置工具的指南\n- 常见语法错误以及如何追踪其原因\n\
  - 语义错误——为什么代码看起来正确但程序无法正常工作\n- 如何提高资源密集型程序的性能\n- 为从其他语言环境转向 Perl 的程序员提供的提示和建议\n\n\
  [/content]\n\n![Image 2](img/index-2_1.jpg)\n\n通过专注于 Perl 编程过程以及识别和纠正错误的准则，`Perl\
  \ Debugged` 帮助开发者立即编写出更好的 Perl 程序，并在总体上成为更优秀的程序员。\n\n## 前言\n\n“我的脑子里充满了想法，但我并不知道它们到底是什么。”\n\
  —— 爱丽丝，摘自《爱丽丝镜中奇游和爱丽丝在其中发现了什么》**Perl 性**（Perlness）\n\n在语言的世界里，Perl 之国是一个巨大的熔炉，欢迎所有的文化、宗教和信仰。“带上你们疲惫的、受支持匮乏的程序员、带上那些渴望摆脱人工限制的拥挤的人群来这里吧，”\
  \ Perl 说道。那些登陆它岸边的人发现，他们不再受限于语言设计者对于优雅语义和窒息语法纯洁性的奇幻妙想。\n\nPerl 的随处可用和易用性使其成为最民主的编程语言。与其他许多语言不同，初学者也可以编写出实用的程序，而其他语言中的高效程序员通常需要花费更多的时间来学习语法、操作符和函数。一个\
  \ Perl 程序员可能拥有这种专业知识，也可能是一个修改了某些示例脚本以执行新功能的新手。\n\n但新手还有另一个问题：缺乏调试技能。经验迫使精明的人由于多年积累的痛苦而培养出内在的调试直觉。我们希望尽量减少这种痛苦，因为我们也曾深受其苦。Perl\
  \ 的易用性让知识匮乏的程序员也能创建可用（尽管脆弱）的代码。调试一个 Perl 程序所需的时间因人而异。我们的目标是帮助你最大限地减少为自己的 Perl 程序所需的开发、调试和维护时间。\n\
  \n不要认为这本书的标题意味着我们在这些页面中是在调试 Perl 本身。Perl 解释器中存在的少数 Bug 是微不足道的奇异现象（或奇特的细节），它们会由支持\
  \ Perl 的优秀志愿者团队迅速解决。一个更准确的标题应该是`调试你的 Perl 程序`（Debugging Your Perl Programs），但那感觉太平庸了，而且失去了那种“不插插头”（unplugged）的双关语趣味。\n\
  \n我们写这本书是因为我们希望让你看到开发过程的运作。大多数编程书籍都包含精心制作的示例，这些示例通过汗水实践打磨得完美无缺，作为作者优雅风格的无证词。它们没有向你展示为了让示例成型而经历的丑陋、恼人的过程；然而，这些示例实际上并不是从创造者的额脑中完整生成的。\n\
  \n由于你在开发自己的程序时也会经历同样的过程，因此我们希望引导你完成这一过程，并描述绕过阻碍在你与“伟大编程”之间的尴尬、羞辱和意外陷阱的各种方法。\n\n\
  书中，我们描述了新手 Perl 程序员可能的最常见且令人恼的错误，然后详细介绍了识别和纠正这些 Bug 以及任何其他错误的步骤。你应该对 Perl 有*一些*了解；已经有几本优秀的教程可以让我们免于解释标量、数组、哈希表等内容的沉重责任。\n\
  \n本前言提到了其中一些最实用的教程。\n\n我们不会尝试去定义或描述一种恰当的编程“风格”。风格就像个人身份一样独特——但一些通用规则可以创建一个共同的参考，以便我们能够轻松地阅读彼此的程序。\n\
  \n这也不是一本“如何编程”的书。虽然我们有时会探讨编程的机制和基础，但我们的意图并不是向完全的新手灌输编程纪律的思想。\n\n### 你是谁？\n如果你已经用\
  \ Perl 编程了一周到一年，并希望加快开发周期，那么这本书就是为你准备的。我们还将解决与团队开发相关的问题。本书旨在为开始学习 Perl 的人员提供实践建议。\n\
  \n### 本书涵盖内容\n你将在书中找到：\n\n- **第 1 章**：引言及 Perl 文档的引导之旅\n- **第 2 章**：培养正确的编程和高效开发心态\n\
  - **第 3 章**：Perl 中的“陷阱”：处理编程中某些难以理解或难以正确的问题\n- **第 4 章**：反调试：如何进行防御性编码\n- **第 5\
  \ 章**：如何对代码进行插桩\n- **第 6 章**：如何测试你的 Perl 程序\n- **第 7 章**：perl 调试器之旅：使用这一内置工具的指南\n\
  - **第 8 章**：语法错误类型以及追踪其原因的方法\n- **第 9 章**：运行时错误\n- **第 10 章**：语义错误：当程序看起来在运行但没有做正确的事时\n\
  - **第 11 章**：如何提高资源密集型（内存、CPU 周期等）程序的性能\n- **第 12 章**：从其他语言转向 Perl 的者的提示和陷阱\n- **第\
  \ 13 章**：常见网关接口（CGI）编程：调试此类 Perl 程序的特殊技巧\n- **第 14 章**：结\n- **附录 A**：Perl 调试器命令参考\n\
  \n\n\n\n\n# 附录 B：我们的“智慧之言”列表\n\n我们将花费大量时间回顾问题示例以及你可能如何调试这些问题。\n\n## 获取 Perl\n\n\
  虽然这不是一本关于如何构建或构建 perl 的书，[1] 但我们至少欠你一些最基础的指导，教你如何获取一个你自己的 perl。\n\n[1] 这不是拼写错误。按照惯例，大写的\
  \ `Perl` 指的是抽象的语言，而小写的 `perl` 指的是运行 Perl 程序的程序。\n\n- 对于 Windows 机器，获取免费的 `ActivePerl`\
  \ 分发版：[`www.activeState.com/ActivePerl/download.htm`](http://www.activeState.com/ActivePerl/download.htm)\n\
  - 对于 Macintosh：[`www.cpan.org/ports/index.html#mac`](http://www.cpan.org/ports/index.html#mac)\n\
  - 对于适用于所有其他机器的二进制发行版：[`www.cpan.org/ports/`](http://www.cpan.org/ports/)\n- 获取 `perl`\
  \ 本身的源码：[`www.cpan.org/src/`](http://www.cpan.org/src/)\n\n在受支持的 Unix 架构上从源码编译 `perl`\
  \ 只需在下载并解压正确的文件后执行以下命令：\n\n```bash\n./Configure\nmake\nmake test\nmake install #\
  \ 如果 make test 成功\n```\n\n![Image 3](img/index-5_1.jpg)\n\n![Image 4](img/index-5_2.jpg)\n\
  \n`Configure` 步骤会向你提出无数个问题，大多数人根本不知道其中许多问题在说什么；但 `Configure` 推荐的默认答案通常是正确的。\n\n\
  出于教育目的，你可能想要构建一个启用了调试功能的 `perl`。（在这里我们指的是允许你使用特殊的 `-DDEBUGGING` 标志来输出信息的 perl，这些信息告诉你\
  \ `perl` 正在对你的程序做什么。这与 Perl 内置的交互式调试器无关——我们在第 7 章会讨论它——所有的 perl 都有那个功能。）如果你想这样做，请从源码编译\
  \ `perl`，当 `Configure` 询问“Any additional cc flags?”时，将它已经显示的括号内的内容作为默认值粘贴进去，并添加\
  \ `-DDEBUGGING`。更多信息请参见 `perlrun` POD 页面（后文介绍）。\n\n我们偶尔会提到不是 Perl 核心发行版的一部分但在全面\
  \ Perl 归档网络（CPAN）上可以找到模块。关于如何从 CPAN 查找、下载和安装模块的说明，请参阅 http://www.cpan.org/misc/cpan-faq.html](http://www.cpan.org/misc/cpan-faq.html)。\n\
