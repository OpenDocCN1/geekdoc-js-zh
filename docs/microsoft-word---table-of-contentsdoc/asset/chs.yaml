  \ 1998）\n\n## Perl 版本\n\n在书中，我们指的是 Perl 的最新“稳定”版本，截至本书时为 `5.6.0`。\n\n我们所说的大部分内容在旧版本的\
  \ Perl 5 上也可以直接运行，但不适用于 Perl 4。\n\n如果你使用任何早于 `5.004_04` 的 Perl 版本，你应该升级；`5.003`\
  \ 存在安全问题和内存泄漏等问题。你可以通过传递 `-v` 标志查找你的 `perl` 版本号：\n\n```bash\nperl -v\n```\n\nThis\
  \ is perl, v5.6.0 built for i586-linux\nCopyright 1987-2000, Larry Wall\n[...]\n\
  \n如果存在 `-v` 标志，Perl 将不会执行命令行上指定命名的脚本。可以通过 `-V` 标志获取关于你的 `perl` 配置的更详细描述；如果你提交错误报告，该功能会自动将此信息包含在你的报告中。[2]\n\
  \n[2] 使用随 `perl` 附的 `perlbug` 程序。\n\n一个独立的开发轨道用于你的 `perl` 发行版包含一个。在第四届 Perl 会议（加利福尼亚，2000\
  \ 年 7 月）上宣布 Perl 开发开始认真，向后兼容性并不妨碍某些事情。如果你发现你有一个且并不想要它，你可能访问了错误的 FTP。\n\n## 致谢\n\n\
