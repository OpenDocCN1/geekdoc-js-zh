    \      <li class=\"odd\">Sullivan lowest club professional at PGA since 1969</li>\n\
    \      <li class=\"even\">PGA of America adjusts Sunday schedule at Whistling\
    \ Straits</li>\n    </ul>\n  </div>\n</div>\n```\n\nAnd with that, our extra drop-shadow\
    \ effect was complete.\n\nIf you take one away from this exercise, remember this.\
    \ By leveraging the Web browser's ability to automatically repeat background images\
    \ and also apply color to the same element, there are countless creative opportunities\
    \ to add visual depth and richness to any flat, static layout with barely any\
    \ effect on overall document weight. It takes a little patience, planning, and\
    \ experimentation.\n\n# CSS Drop-Down Menus\n\nIn the dot-com rush of the late\
    \ 1990s, the hallmark of a sophisticated, cutting-edge site was often signaled\
    \ by the inclusion of fancy drop-down navigational menus. They may have been pleasing\
    \ to the eye, but their glitchy facade often a hornet's nest of JavaScript, bloated\
    \ HTML, or even worse, proprietary browser API methods. For sites seeking the\
    \ user experience more straightforward, early drop-down solutions more often than\
    \ not added levels of frustration (especially when they failed to operate) and\
    \ unnecessary bloat.\n\nThen long came CSS and the magical :hover attribute. Gurus\
    \ Ike Meyer published tutorials on how to tap into the capabilities of an anchor\
    \ tag:hover attribute, which when used with regular ol unordered lists, could\
    \ create drop-down menus similar in appearance yet a fraction of the weight and\
    \ complexity of conventional methods.\n\nBut for the more pure CSS mens, there\
    \ was one huge problem: Internet Explorer for Windows. By far the most popular\
    \ browser accessing the Web, the browser had limited support for the :hover attribute\
    \ (and CSS in general, but that other story), and then refused to render the drop-downs.\
    \ As a result, CSS mens were relegated to a hobbyist tool set.\n\nBut that to\
    \ change in November 2003, Patrick Griffiths and Dan Webb set the CSS community\
    \ on fire with Suckerfish (www.alist.com/articles/dropdowns), a lightweight, CSS-powered\
    \ system that worked in every browser available, including Internet Explorer for\
    \ Windows. Suckerfish was not just a revelation in file weight, but in cross-browser\
    \ compatibility, compliance to Web standards, semantic richness, and accessibility.\n\
    \nSuckerfish drop-down menus were also incredibly easy to build. If you knew how\
    \ to create an unordered list inget, all of the presentation and functionality\
    \ was controlled with a small set of style properties.\n\n168"
  merge: -1
