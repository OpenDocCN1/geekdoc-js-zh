  md: "# Stuff and Nonsense: Strategies for CSS Switching\n\nFrom this, we need two\
    \ tools in our cookie-baking toolkit (we can use metaphors with the best of them).\
    \ We need to be able to set a cookie containing our user's style preference, and\
    \ then later read it. So, let's add a newly named function to our scripts.js file,\
    \ setCookie():\n\n```\n// Set the cookie\nfunction setCookie(name,value,days)\
    \ {\n  if (days) {\n    var date = new Date();\n    date.setTime(date.getTime()+(days*24*60*60*1000));\n\
    \    var expires = \"expires=\"+date.toGMTString();\n  } else\n    expires = \"\
    \";\n  }\n  document.cookie = name+\"=\n```\n\nAnd now, in our original activeCSS()\
    \ function, we can add a single line to store our user's preferences in a cookie\
    \ on the user's computer:\n\n```\n// Set the active stylesheet\nfunction activeCSS(title)\
    \ {\n  var i, oneLink;\n  for (i = 0; i < (document.getElementsByTagName(\"link\"\
    )[i]).length; i++) {\n    if (oneLink = document[i].getAttribute(\"stylesheet\"\
    ) && findWord(\"stylesheet\")) {\n      oneLink.disabled = true;\n      if (oneLink.getAttribute(\"\
    title\") == title) {\n        oneLink.disabled = false;\n      }\n    }\n  }\n\
    \  setCookie(\"style\", title, 365);\n}\n```\n\nWith this one line, half of our\
    \ work is finished! The setCookie() function accepts three arguments: a name for\
    \ the cookie (so we can reference it later), the value to be stored in the cookie,\
    \ and the number of days until the cookie expires. In the previous code snippet,\
    \ we created a cookie named \"style\", the value of which is set to the value\
    \ of the title of activeCSS(). This means if a user selects a link that specifies\
    \ activeCSS(\"Higher Contrast\") in its onclick handler (that is, it invokes activeCSS\
    \ with a title of Higher Contrast), then our \"style\" cookie will, have a value\
    \ of Higher Contrast.\n\nIn our setCookie() function, specifying the number of\
    \ days until cookie expires is optional. The latter argument is optional. In the\
    \ preceding example, we' arbitrarily decided to set the \"style\" cookie to expire\
    \ in 365 days, or one calendar year. Because the argument is optional, we could\
    \ leave it out. However, omitting it will cause the setCookie() function to create\
    \ a \"style\" cookie that expires at the end of the user's session—causing the\
    \ user's preference to be lost as soon as he or she closes the browser."
