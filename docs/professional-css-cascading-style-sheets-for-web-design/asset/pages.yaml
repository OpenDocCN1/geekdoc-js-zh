  md: "# Blogger: Rollovers and Design Improvements\n\nLet's look at that last example\
    \ and see how it might be copied.\n\n# The XHTML\n\nFollowing is the XHTML:\n\n\
    ```\n<p> If you're interested then <a href=\"*\">bung me an email</a> and we can\
    \ talk about what you want </p>\n```\n\nSo, all that's needed is a simple tag.\
    \ How about the CSS?\n\n# The CSS\n\nFollowing is the CSS:\n\n```\na {\n  border-bottom:\
    \ 1px solid #eee;\n  color: #d17e62;\n  text-decoration: none;\n}\n\na:visited\
    \ {\n  border-bottom: 1px solid #eee;\n  color: #9d604c;\n  text-decoration: none;\n\
    }\n\na:hover {\n  background-color: #ffffda;\n  border-bottom: 1px solid #ddd;\n\
    \  color: #c330;\n  text-decoration: none;\n}\n```\n\nIt's important to note the\
    \ order in which those rules are written. The first rule, a {}, affects all links.\
    \ The second rule, a:visited {}, affects the link that the user has visited again\
    \ (this is determined by the browser's cache). The third rule, a:hover {}, affects\
    \ the links that the mouse is currently hovering over.\n\nFollowing the logic\
    \ of the CSS Cascade (www.html.com/reference/css/structure.html#cascade) each\
    \ rule has precedence over the one before it. So, a normal link will have its\
    \ styles overwritten by a visited link, and a visited link will have its styles\
    \ overwritten when the user hovers over it. It is simple, but you'd be surprised\
    \ how many people get it in the wrong order.\n\n# Changing the Color and Background\
    \ Color of Links (Complex)\n\nThis is a great trick for fast, low-bandwidth rollovers,\
    \ and it's something Bowman used on the front page of Blogger. It involves nothing\
    \ more than altering the background color of an element, while keeping the image\
    \ on top of that (be an inline image or a CSS background image) the same.\n\n\
    To see it in action, Figure 3-60 shows four links on the front page of blogger.com."
