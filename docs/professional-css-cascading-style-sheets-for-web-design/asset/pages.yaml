  md: "# Chapter 8\n\n```\noneLink.disabled = true;\nif (oneLink.getAttribute(\"title\"\
    ) == title) {\n  oneLink.disabled = false;\n}\n}\n\n// findWord: Used to find\
    \ a full word (needle) in a string haystack\nfunction findWord(needle, haystack)\
    \ {\n  return haystack.match(\"\\b\" + needle + \"\\b\");\n}\n```\n\nIn this snippet,\
    \ we have two JavaScript functions, which are basically discrete chunks of functionality.\n\
    The two functions we are looking at are activeCSS() and findWord(). Each function\
    \ contains a\nseries of instances that are processed by the browser. For example,\
    \ when activeCSS is\ninvoked, it performs the tasks:\n\n+   1. It assembles all\
    \ link elements in our document (document\ngetElementsByTagName(\"link\")) and\
    \ proceeds to loop through them.\n2. For each link element, it checks to see if\
    \ there is a title available, and then evaluates\nt rel attribute to see if the\
    \ word \"stylesheet\". The findWord() function is used\nto search for a whole-word\
    \ match. This means that if someone accidentally\ntype rel=\"stylesheets\" or\
    \ the like in their link element, our function ignores them.\n3. Each link that\
    \ matches the criteria in Step 2 will be disabled (oneLink.disabled = true);\n\
    4. When the function is first invoked, an argument (or variable) is passed with\
    \ the title\ndesired \"active\" style sheet. So, as the function loops through\
    \ each of the link elements,\nit checks to if the title of the link matches the\
    \ title of the function's. If so, the link\nelement is activated.\n\nAdmittedly,\
    \ this is a bit of gloss over the functions' syntax. JavaScript is a robust and\
    \ rewarding language,\nwhile we are nonetheless froze through some of its subtleties\
    \ to get back on the CSS track.\nThe following list demonstrates the high-level\
    \ concepts at play in the CSS we've created,\nand provide a fine starting point\
    \ for further exploring JavaScript's elegant syntax.\n\nThese two functions allow\
    \ us to switch our CSS, they lie dormant until they are invoked\n(or called) by\
    \ our markup. We want our switcher to fire when a user selects a link from\n#switcher\
    \ list, the easiest place to do so is within the anchors of our switcher list.\n\
    \n```\n<div id=\"switcher\">\n<ul>\n  <li id=\"style-default\"><a href=\"stylesheet.html\"\
    \nonclick=\"activeCSS('default');\\ return false>Default style</</a></li>\n  <li\
    \ id=\"style-contrast\"><a href=\"stylesheet.html\" onclick=\"activeCSS('Higher\n\
    Contrast');\\ return false>Higher Contrast</</a></li>\n  <li id=\"style-hot\"\
    ><a href=\"stylesheet.html\" onclick=\"activeCSS('Gratuitous\nCSS');\\ return\
    \ false>Gratuitous CSS</</a></li>\n</ul>\n</div>\n```\n\n# 294"
