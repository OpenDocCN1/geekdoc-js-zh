    */\n@import url(\"hacks.mac.ie5.css\");\n/** /\n```\n\nWe've already discovered\
    \ that CSS hacks need to keep our page looking in less-than-CSS-savvy browsers,\
    \ and triggering the hacks into browser-specific files is an excellent way to\
    \ keep our core.css file clean and hack-free. If we ever decide to drop support\
    \ for a certain browser, we now need to remove only a few lines from main.css—definitely\
    \ a more appealing thought than scouring our primary style sheet rules by line,\
    \ looking for CSS hacks. Again, it's equal parts \"strategic\" and \"lazy\" here\
    \ at CSS Best Practices Headquarters.\n\nNow we've put our CSS and XHTML firmly\
    \ in place, we can delve into the mechanics of style sheet switching.\n\n# CSS\
    \ Switching\n\nOne fault of our page's current design is that legality wasn't\
