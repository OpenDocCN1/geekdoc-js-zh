    # CSS Beyond the Browser


    So, we''ve established that our document is looking quite fetching when viewed
    in a modern desktop browser. We''ve also explored a few different ways to allow
    users to change their sites'' presentation layer. What happens when we take document
    outside of the browser context? What happens when we try to print one of our hyper-styled
    designs?


    Well, we''ve selected the Gratuitous CSS skin, quite a bit—let''s look at Figure
    8-8.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_328_0.png)


    Figure 8-8: Here''s the printed version of our page (or a preview there, anyway).
    We can definitely do better.


