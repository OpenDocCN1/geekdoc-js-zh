  md: "# Bringing It All Together\n\nIn the CSS rule, I set the display to block.\
    \ Again, this allowed me to set the width of the anchor to 240 pixels, a value\
    \ I picked up by measuring the width of the graphics I created in Photoshop.\n\
    \nNext, I set the margin to zero, while setting the bottom padding to 7px. The\
    \ reason I did that was to make room for the bottom portion of the button, which\
    \ comes in the next declaration.\n\nWith the bottom graphic in place, I need to\
    \ quickly put the top graphic on links. To do this, I insert a bit of extra markup\
    \ in the menu by wrapping the span element around each of the link, but only those\
    \ links in the parent unordered list:\n\n```\n<h4 class=\"no\">Main Navigation</h4>\n\
    <ul id=\"mainnav\">\n  <li><a href=\"/\"><span>Home</a></li>\n  <li><a href=\"\
    /journal/\"><span>Journal</a></li>\n  <li><a href=\"/work/\"><span>Work</a>\n\
