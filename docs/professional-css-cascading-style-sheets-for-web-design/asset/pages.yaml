  md: '# Chapter 3


    ![](img/70fa44d3a461f43c7a35cac2b893273d_116_0.png)


    So, we know how to place them in the content section, but how? We don''t have
    any extra, blank divs to use... Hmm, could we use the h2 and p tags?


    Well, that does seem like a good idea, doesn''t it? They''re there, and they have
    no other images applied to them, why not use them?


    # Basing an Element''s Style on the Contents of That Element


    A good rule in CSS is not to use the contents of an element to absolute and total
    control over every piece of your site, you can''t be sure that the necessary content
    will be there in the styling of it. (And, if you insist that is, you''re doing
    something very odd indeed; let''s your CSS dictate the content of your site, and
    that''s certain not to go to)


    Let''s set up the .box style to be an h2 at the start, and a p tag at the end,
    applying a background-image to each one. Blogger.com has thousands of users, so
    what are the odds that every one of them will always use two elements in every
    "box" they create?


    And if we get clever and say, okay, let''s not specify actual tags in our CSS,
    let''s use :first-child and :last-child, or let''s insert a .first and .last class
    in the XML, we''ll still run into problems. Every browser understands :first-child
    and :last-child, and not every user will remember to insert .first and .last classes
    in your documents. Do they even know what classes are?


    And finally, what happens if the box contains only one element? How can you apply
    two background images to a single element? You can''t.


    92'
