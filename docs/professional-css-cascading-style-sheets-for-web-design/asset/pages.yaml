  md: '# Best Practices for XHTML and CSS


    were a matter of course. We were devoted to ensuring an excellent display in all
    graphic browsers, at the expense of bandwidth-heavy markup and inaccessible site
    designs. Of this, begs the question: What do we do about it?


    By now, if you''re thinking that there must be a better way, you''re right — there
    most certainly is. Today''s browsers have become much more intelligent, and we
    should. With greater support for cascading style sheets across the board, we no
    longer have to rely upon bandwidth-heavy markup to realize a site''s design. We
    can instead focus on abstracting presentation out of our markup, and move it into
    our cascading style sheets.


    The promise of separating from style is at the heart of standards-based Web design,
    and for one of the most compelling arguments for creating page layouts with CSS.
    By drawing a line between our pages'' content and their presentation, our pages
    will not only be drastically lighter, but far easier to maintain as.


    # # A Valid Foundation: Learning to Love Our Markup


    Let''s revisit our lonely body element one last time:


    ```

    <body margin="0" marginheight="0" leftmargin="0" toplam="0">

    ```


    Don''t worry, we won''t reread that "presentation structure" we did in the conversation
    again. We can hear snoring in the back of the audience, and aren''t about to press
    your luck.


    It is worth noting that none of these were in HTML specifications (www.w3.org/Markup/).
    marginwidth and marginheight are Netscape-only attributes and would work only
    in browser. Conversely, leftmargin and topmargin would have the same margin-trimming
    effect, they would work only in Internet Explorer. But valid or no, that didn''t
    keep us from placing in this proprietary markup on our sites. We were dealing
    with browsers offering non-standard (and often contradictory) implementations
    of HTML, and we did so with a smile on our face — as every snippet of input, proprietary
    code in our builder''s arsenal.


    And, since we used the same invalid, proprietary HTML to all browsers that visit
    our pages, one line of HTML demonstrates how tolerant browsers are of flawed markup.
    And that''s design: if we need to include a closing tag (such as <tr> or </div>)
    or introduce a proprietary element into our markup to work around a layout (as
    we did in the preceding body element), our Web browser has a recovery strategy
    in place. It has to "repair" your markup while parsing, despite any imperfect
    code found therein.


    But the real headaches arise each browser has its own internal logic for interpreting
    this invalid code, which invariably leads to unpredictable results during cross-browser
    testing. One browser might recover gracefully from a missing angle bracket, while
    another might break our entire layout because of it. These inconsistent rendering
    strategies teach one thing: Invalid code mean we spend more of our time coding
    and testing to ensure that a site displays correctly across all target browsers.
    Rather than focusing on improving our site''s design and content, we were forced
    to spend far too much time


