    # Caveats to Consider


    Now we''ve discovered that modifying the original source, we''ll consider some
    potential issues to watch out for when using Suckerfish drop-down menus:


    +   Caveat #1: Suckerfish requires JavaScript in IE/Windows. This chalk up another
    example of Internet Explorer''s lackluster support of CSS. Suckerfish is activated
    purely by CSS in Mozilla, Firefox, and Safari, but for it to work in Internet
    Explorer for Windows (IE/Windows), a little bit of JavaScript must be included
    in any document using the drop-down menus. The :hover pseudo-element is replaced
    by attaching custom behaviors to the Document Object Model (DOM). But here''s
    the rub. if your IE/Windows users have JavaScript turned off, your drop-down menus
    won''t appear. Very few people actually turn this off, but it''s a reality you
    should be aware of.


    172'
