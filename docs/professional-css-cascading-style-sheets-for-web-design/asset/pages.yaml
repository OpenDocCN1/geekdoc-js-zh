  md: 'you''d think of traits that you inherit from your family. A Web page isn''t
    all that dissimilar, in fact. There are parent-child relationships, in which elements
    inherit style properties from the elements that contain them. In fact, you can
    draw a family tree of your page''s elements, as seen in Figure 2-9.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_81_0.png)


    Figure-2-9: The markup document tree


    # Element Hierarchy


    The html element is the root element of your page, and as such, is at the base
    of our "document tree". It is the parent of its child elements—namely, the head
    and body elements, which have their own children, which in turn have their own,
    and so on down the line. Elements that share the same parent are called siblings.
    Tags placed more one level down the tree from a given point are considered descendants.
    Conversely, elements near the top of the tree can be considered ancestors to those
    that are nearer the bottom. There you have it, all the neatly arranged hierarchy
    of a family tree, without such niceties as your Uncle Eustace''s habit of telling
    off-jokes during Thanksgiving dinner.


    We''re much better at writing Web designs in this hierarchical manner, it''s easier
    to envision exactly how styles will propagate down the branches. Consider the
    following example:


    ```

    body {

    color: #000;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 12px;

    }

    ```


    According to the syntax rules we''ve already covered, we know that this rule tells
    the user agent to select all body elements and apply a serif typeface (looking
    on the client''s machine for Georgia, Times New Roman, or a generic sans-serif
    font, in order), that sized at 12 pixels and in black (#000).


    Now, applying the rules of inheritance to our document, these three properties
    will be handed down to all elements contained within the body of our document—or,
    to use the language of our document''s family tree, to all elements that are descendants
    of the body. Already we''ve demonstrated that CSS is such a powerful presentation
    engine. With four lines of a single style rule, we''ve done the work of a small
    army of font elements.'
  merge: -1
