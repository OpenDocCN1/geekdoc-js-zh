  md: '# Chapter 2


    +   1. The paragraph element with an id of footer will be displayed in white (#FFF).

    2. Those paragraphs with a class of gazette will display in green (#0C0).

    3. All others will display in a dark red (#300).


    All paragraphs in the document obey the values declared in the original p rule:
    font size of 1em, line height of 1.6ems and 10 pixels of padding. However, the
    browser''s default margin of .9em still reaches the user''s display because the
    author''s CSS did not override it.


    # Sort by Order


    Let''s assume that, for some odd reason, an author style declared these two rules,
    one after the other:


    ```

    p { color: #C00; }

    p { color: #000; }

    ```


    When multiple rules have the same specificity, weight, and origin author always
    wins. According to this rule, all paragraphs will be rendered in black. Of course,
    we could change the weight:


    ```

    p { color: #C00 !important;

    p { color: #000; }

    ```


    The rules are no longer equal because !important author rules are weighted more
    heavily than regular author rules—therefore, all will be rendered in red.


    # From Theory to Practice


