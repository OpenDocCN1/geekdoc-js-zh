  md: '# The PGA Championship


    Before moving on, here''s a tip to consider. Ensure that your design is railed
    ahead of time, preferably on a grid with elements snapped to the pixel. An effect
    like this requires you to know the exact placement of content beforehand. If you
    get ahead of yourself and try to apply effects such as these layout considerations
    are still taking place, you''ll have to retract your steps more than once. One
    of such effects is as a “sweetening” stage of your design work. A little patience
    and planning will save you many headaches and a significant amount of time down
    the road.


    # Extra Realism


    This is a good spot to include a bonus tip that can add extra visual definition
    and realism to the dropshadow effect built thus far.


    In reality (yes, that place outside your monitor), the opacity of a shadow changes
    appearing of the surface falls across. If the surface is white, the drop shadow
    would appear in gradations of light gray. If the surface is dark, the shadow would
    even appear darker. This may be rather obvious, but in the world of computer science,
    it isn''t straightforward


    With, so the PGA Championship, the concept was pushed further by multiplying the
    drop shadow''s appearance whenever it came in contact with areas of a different
    background color. Most of the content in the right column had a transparent background
    and used the color underneath, but these were a unique problem (refer to Figure
    4-1). With some sense of visual separation, it was hard for users to tell apart.
    So, the background of every other item was darkened (like alternating colors in
    a table), by manipulating the drop shadow wherever applicable.


    To do this, the original Photoshop document used to create the drop shadow was
    re-opened and the background color was changed to a slightly darker value (#88279)
    that would harmonize with the overall layout. An area 1 pixel high in the middle
    of the shadow was selected (as was done earlier for the main area shadow) and
    copied into a new document. And, as shown in Figure 4-9, the finished graphic
    looked just like the first, but a little darker.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_189_0.png)


    Figure 4-9: Shadow sitting on top of a slightly darker background and selected
    with the Rectangular tool


    For the XHTML, an unordered-list was created to map up the content. Semantically,
    list elements are perfect for wrapping grocery-list bits of data (and navigation,
    as we''ll see a little later in this chapter). When paired with a style sheet,
    they provide all kinds of presentational opportunities.


    165'
