  md: "# Best Practices for XHTML and CSS\n\nSimilar to class selectors, id selectors\
    \ enable you to select an element based on the id attribute:\n\n```\n#page-title\
    \ {\n  text-align: right;\n}\n```\n\nWhereas the class selector used a period\
    \ (.), the id selector relies on a hash (#). In this rule, we've selected the\
    \ h1 element with an id attribute whose value matches the text after the hash\
    \ (namely, “page-title”). As class selectors, we could again rely on the implicit\
    \ universal selector here, leaving the h1 out of picture altogether:\n\n```\n\
    #page-title {\n  text-align: right;\n}\n```\n\nHow are we able to do this? The\
    \ value of an element's id attribute is unique, in the context of a valid XHTML\
    \ document—no other element in our markup will share the “page-title” with our\
    \ h1. Therefore, we know that both rules will match only one element in our markup,\
    \ making the results of the two equal.\n\nNothing especially exciting, is you?\
    \ You ain't seen nothing yet, we say:\n\nThe true power of id selectors is when\
    \ they’re used as the foundation for descendant selectors, like so:\n\n```\n#content\
    \ h2 {\n  text-transform: uppercase;\n}\n```\n\nRules such as this are the foundation\
    \ of complex layouts. As CSS designers, this allows us to create styles that are\
    \ incredibly context-aware. For example, this rule will select all h2 elements\
    \ that are descendants of the element with an id of “content”, and only h2s. All\
    \ other second-level heading elements in the document will be unaffected by this\
    \ rule.\n\n# Other Selectors\n\nIn this section, we will examine some of the other\
    \ selectors available to surround “available” with quotation marks because we’re\
    \ not able to use the full power of these exciting styles. As you’ll see, another\
    \ title for this section might have been “The Best Ideas You Can’t Really Use.”\n\
    \nAs of this writing, the Windows version of Internet Explorer (MSIE/Win)—currently\
    \ the world’s most prevalent browser—does not support selectors. While other modern\
    \ enjoy support for them, many of these selectors are new as CSS2. MSI/Win’s implementation\
    \ of this specification is nascent at best. Until Internet Explorer supports them,\
    \ useful selectors cannot be relied upon for everyday commercial use.\n\nWe mention\
    \ these tools to yank the rug out from your feet, for completeness. As some point\
    \ in the (we hope) near future, these selectors will enjoy robust support from\
    \ Microsoft’s browser."
