    **Figure 7-12:** With position; relative; applied to our new container block,
    the left- and right-hand columns'' top edges are now contained within their parent.
    But what about our page''s content?


    The container div can now be considered a positioned element, it establishes a
    new context for all of the positioned elements that descend from it—you guessed
    it, the left and right column blocks. The left, top, right offsets are no longer
    relative to the dimensions of the html element, but of the container div. This
    means that as the element expands and grows horizontally, the left and right blocks
    will reposition themselves to suit. If, say, the vertical size of the header block
    increases (so Figure 7-13), then the new horizontal position of the container
    div will be reflected in its absolutely positioned children.


