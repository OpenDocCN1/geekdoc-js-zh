    # Information Architecture


    For a moment, take a look at this book that you''re holding. It comprises several
    hundred pages, each of which might contain a few (dozen worth while) concepts.
    Now, were you presented with all of these printed on one huge piece of paper in
    a random order, you''d likely ask the bookstore for your money back. There is
    no way that could easily find any information on CSS, and this would be utterly
    useless to you. Frankly, you''re spared that experience. At every stage of the
    book''s development, there has been a constant attempt to bring order out of this
    conceptual jumble, on levels both large and small. The goals of the book were
    established, and then the topics that the book needed to cover were outlined.
    From those general topics came chapters, and within each chapter came section
    outlines and headings.'
