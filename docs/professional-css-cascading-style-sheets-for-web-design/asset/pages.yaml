  md: '# Appendix B


    # Quoting Attribute Values


    All values for attributes in an element are required to be wrapped in quotation
    marks. So, you would not use this example:


    ```

    <img src="file.gif width=133 height=133 />

    ```


    Instead, you should follow this correct example:


    ```

    <img src="file.gif" width="133" height="133" />

    ```


    # No Attribute Minimization


    For some elements in HTML (as the horizontal rules tag, hr), attributes can be
    minimized, and simply listing the attribute name is valid:


    ```

    <hr noshade />

    ```


    In XHTML, however, there is no attribute minimization. When you are faced with
    an attribute that typically never needed a value, set the value of the attribute
    to the name. In the case of this example using the hr element, the value for the
    attribute is noshade:


    ```

    <hr noshade="noshade" />

    ```


    # Terminating Empty Elements


    Empty elements that do not come in pairs (such as img, br, or hr).


    Non-empty elements (such as p or h2) are fairly common in HTML. They are used
    for marking the starting and ending of content in a Web page, such as using the
    following p tag to indicate a paragraph:


    ```

    <p>That''s when I thought I should decline a second helping of her infamous spaghetti
    and meatball salad.</p>

    ```


    With XML, all elements must be terminated, empty elements must be modified.


    To keep using empty elements they must be modified slightly. Add a space and a
    forward slash at the end of the element:


    ```

    <img src="file.gif" alt="Company logo" width="125" height="36" />

    ```


    Note that including the space before the trailing slash isn''t a requirement for
    the code to be valid, but a technique to keep older browsers such as Netscape
    Navigator 4 from failing to render the element.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Rules for HTML-to-XHTML Conversion


    # Cleaning Nests


    Nesting elements properly is simple and should already be a part of any Web developer''s
    practices. In the following line, ending the strong element is outside of the
    p element.


    ```

    <p>That''s when I thought I should <strong>decline a second helping of her infamous
    spaghetti and meatball salad.</p></p>

    ```


    Whereas, this is the correct method for marking up the content:


    ```

    <p>That''s when I thought I should <strong>decline</strong> a second helping of
    her infamous spaghetti and meatball salad.</p>

    ```


    # XHTML with CSS and JavaScript Files


    Associating CSS and JavaScript files is the preferred method by which you incorporate
    presentation and behaviors to your Web pages:


    ```

    <script src="js/validator.js" type="text/javascript"></script>

    <link rel="stylesheet" href="css/layout.css" type="text/css" />

    ```


    If you must use JavaScript, wrap the code with the starting marker, `<!CDATA[`,
    and ending marker, `]]`.


    # Keep It on the Downlow


    From now, all elements and attribute names in XHTML must be set in lowercase.
    This means you should not use all uppercase, or mix uppercase and lowercase. The
    following are examples of incorrect usage:


    ```

    <HTML> </HTML>

    <Strong></Strong>

    ```


    Following is an example of correct usage:


    ```

    <body></body>

    ```


    Note that a mixture of lowercase and uppercase for the values of attributes is
    still valid:


    ```

    <a href="IWantToBelieve.html">Photos of Aliens<//a>

    ```


    # Introduce ID When Using name


    In XHTML the name attribute is deprecated and will be removed from the specification
    altogether in the future. In fact, you must use the id attribute. Until the name
    attribute is no longer a valid attribute, use id in addition to the name attribute:


    ```

    <a name="admin" id="admin">Administration at CLC</a>

    ```


    393'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Appendix B


    # Encode Ampersands


    When you are using an ampersand (&) for the value of an attribute, be sure to
    use the character entity &amp;


    When encoding ampersands, and when working with dynamic pages, pass parameters
    through the URL string in the browser like so:


    ```

    <a href="add-cart.html?isbn=0764588338&amp;id=023">Add this item to your cart/>

    ```


    # When in Doubt, Validate


    We all are human. We make mistakes with coding. To help point out troubles with
    XHTML, or to make sure what has been created is coded correctly, take your page
    to a validator such as http://validator.w3.org/ and test often.


    Also, most WYSIWYG and non-WYSIWYG Web authorizing tools have built-in validators.
    Read the documentation that came with the software to learn more about these validators.'
  merge: -1
