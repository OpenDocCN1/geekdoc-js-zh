    # Creating Fluid-Width, Round-Cornered Boxes


    The previous section looked at creating rounded corners on boxes of a known and
    fixed width (200px wide in that case). A much harder challenge is to add rounded
    corners to a box whose width you don''t know — a fluid box.


    Blogger.com uses only fixed-width boxes, but many sites on the Web use a fluid
    layout — one that changes with the width of the browser window or the size of
    the browser''s text.


    107'
