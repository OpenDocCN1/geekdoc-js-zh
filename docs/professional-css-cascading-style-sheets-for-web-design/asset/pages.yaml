  md: "# Chapter 2\n\nWhile these selectors can be relied upon to fuel professional\
    \ design projects as of the writing of this book, the day will come when browser\
    \ implementation (or the lack thereof) is no longer an issue. As they say, luck\
    \ favors the prepared.\n\n# Child Selectors\n\nWhen we discussed descendant selectors,\
    \ we discovered that we could write rules that instantly affect all elements beneath\
    \ another element. Let's assume we want to style all the paragraphs in the body\
    \ of our document:\n\n```\n<body>\n<p>I am the very model...</p>\n<div class=\"\
    news\">\n<p>Of a modern markup general.</p>\n</div>\n<p>use every attribute, be\
    \ it vegetable or mineral.</p>\n</body>\n```\n\nTo have all paragraphs display\
    \ in bold, we could write either of the following:\n\n```\np {\n  font-weight:\
    \ bold;\n}\n```\n\nor\n\n```\nbody p {\n  font-weight: bold;\n}\n```\n\nBoth would\
    \ have the same effect. As we've discussed previously, they would select all paragraphs\
    \ contained within the document's body element, at any level.\n\nBut, what if\
    \ we wanted to retain the scope of our match to a bit, and just select the paragraphs\
    \ immediately beneath the body element in our document's hierarchy?\n\nEnter child\
    \ selectors:\n\n```\nbody p {\n  font-weight: bold;\n}\n```\n\nThe greater-than\
    \ (>) instructs the user agent to select all child p elements, not all descendants.\
    \ Therefore, the paragraphs contained by the div would not be affected because\
    \ they are children of that element— not the body. However, the paragraphs immediately\
    \ before and after the div would be affected because they share the body as their\
    \ parent element.\n\n# Attribute Selectors\n\nRather than picking our form with\
    \ class attributes, the CSS specification has defined attribute selectors. These\
    \ enable us to match not only an element's class, but on any other attribute it\
    \ possesses. Denoted by a set of square brackets, attribute selectors can match\
    \ in any of the four ways shown in the following table.\n\n52"
  merge: -1
  pgno: 76
- img_proc: true
  md: "# Best Practices for XHTML and CSS\n\n| Attribute Selector Syntax | Result\
    \ |\n| --- | --- |\n| [x] | Matches when the element has the specified x attribute,\
    \ regardless of the value of that attribute. |\n| [x=y] | Matches when the element's\
    \ x attribute has a value that is exactly y. |\n| [x=-y] | Matches when the value\
    \ of the element's x attribute is a space-delimited list of words, one of which\
    \ is exactly y. |\n| [x|y] | Matches when the value of the element's x attribute\
    \ is a hyphen-separated list of words beginning with y. |\n\nSeem a bit confusing?\
    \ A few concrete examples of attribute selectors, and what they would select,\
    \ are shown in the following table.\n\n| Selector | What It Means | What It Selects\
    \ | What It Won't Select |\n| --- | --- | --- | --- |\n| p[lang] | Selects all\
    \ paragraph elements with a lang attribute. | <p lang=\"en\">\br><p lang=\"five\"\
    > | <p class=\"lang\">\br><p> |\n| p[lang=\"fr\"] | Selects all paragraph elements\
    \ whose lang attribute has a value of exactly \"fr\". | <p lang=\"fr\">\br><p\
    \ class=\"gazette\">\br>lang=\"fr\"> | <p lang=\"fr-Canada\">\br><p lang=\"french\"\
    > |\n| p[lang^=\"fr\"] | Selects all paragraph elements whose lang attribute contains\
    \ the word \"fr\". | <p lang=\"fr\">\br><p lang=\"en fr\">\br><p lang=\"la sp\
    \ fr\"> | <p lang=\"fr-Canada\">\br><p lang=\"french\"> |\n| p[lang|=\"en\"] |\
    \ Selects all paragraph elements whose lang attribute contains values that are\
    \ exactly \"en\", or begin with \"en\". | <p lang=\"en\">\br><p lang=\"en-US\"\
    >\br><p lang=\"en-cockney\"> | <p lang=\"US-en\">\br><p lang=\"eng\"> |\n\nThe\
    \ potential application for these selectors is exciting, to say least. Revisiting\
    \ our form from our work gets a lot easier:\n\n```\n<form id=\"sample\" action=\"\
    blah.html\" method=\"post\">\n<fieldset>\n<p>\n<label for=\"text-one\">Box #1:</label>\n\
    <input type=\"text\" id=\"text-one\" size=\"15\" />\n</p>\n<p>\n<label for=\"\
    text-two\">Box #2:</label>\n<input type=\"text\" id=\"text-two\" size=\"15\" />\n\
    </p>\n</form>\n```"
  merge: -1
  pgno: 77
- img_proc: true
  md: "# Chapter 2\n\n```\n</p>\n<input type=\"submit\" id=\"submit\" value=\"Submit!\"\
    \ />\n</fieldset>\n</form>\n```\n\nUsing an attribute selector, it would be very\
    \ easy for you to hone in on all input elements whose type attribute exactly matched\
    \ \"text\":\n\n```\ninput[type=\"text\"] {\n  border: 1px solid #C00;\n}\n```\n\
    \nThe advantage to this is that the <input type=\"submit\" /> element is unaffected,\
    \ and the border applied only to the desired text fields. We no longer need to\
    \ worry about our markup with class attributes. Instead, we can use XHTML as a\
    \ kind of API for our stylistic selectors that \"hook\" into the structure of\
    \ our document.\n\nLet be caused of turning our nose up at class selectors, let\
    \ us reassure that you're not guilty of semantic grandstanding. At the end of\
    \ the day, the selectors we're able to use — that is, those compatible with Microsoft's\
    \ Internet Explorer — are excellent tools, if perhaps not ideal ones. While using\
    \ classes in our form might not be the most \"semantically pure\" solution, they\
    \ afford us a great deal of flexibility and structural control in our designs\
    \ today.\n\n# Multiple Declarations\n\nNow, all of the styles we've looked at\
    \ so far have had only one declaration — thankfully, this doesn't have to be the\
    \ case. Imagine how verbose our CSS would be if we had to restrict ourselves to\
    \ only this sort of syntax: \n\n```\nh1 { color: #36C;\n  font-weight: normal;\n\
    \  letter-spacing: .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n\
    }\n```\n\nWe were bothered to read your style sheet to out, this snippet would\
    \ be an incredible cure for insomnia. It might sound like, \"Select all h1 elements,\
    \ and apply a color of #36C. Select all h1 elements, and weight the type normally.\
    \ Select all h1 elements, and span the letters by four-point em. Select all h1\
    \ elements, and apply a margin of one em. Select all h1 elements, and transform\
    \ the text to lowercase.\" Not exactly a gripping ride, is it? Rest assured,'ll\
    \ knock your kids out of Good Moon ever could.\n\nThankfully, we've got a way\
    \ out of this over-verbose mess. Multiple declarations for the same selector can\
    \ be compressed into one single-semicolon-delimited, easy-to-carry rule. With\
    \ that, let's revisit our multiple rules:\n\n```\nh1 {\n  color: #36C;\n  font-weight:\
    \ normal;\n  letter-spacing: .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n\
    }\n```\n\n25"
