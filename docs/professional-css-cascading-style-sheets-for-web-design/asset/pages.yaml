  md: '# The Planning and Development of Your Site


    # Determining Roles and Responsibilities


    No person is an island, and the same is especially true of Web contractors. Every
    project requires some level of coordination with additional people, whether they
    are members of your team, or stakeholders from the client''s company. As such,
    a successful project becomes less about providing a deliverables at a specific
    time, and more about managing the different members of the project team. Clearly
    communicating the expectations placed on every member of the project will ensure
    that deadlines are met on time, on budget, and above the client''s expectations.


    At some point in your professional career, you will be staffed on a project where
    its requirements exceed your abilities as an individual. This isn''t something
    to dread, however. Rather, discuss with your client that their project''s scope
    requires additional resources to meet the deadlines, so that you can plan your
    budget accordingly.


    In either scenario, it might be helpful to sketch out a table that outlines not
    only the various roles throughout your team, but their responsibilities as well.
    In the following table, we''ve outlined a rough sketch of what the average project
    team might look like. Even if you''re the sole resource working on a project,
    this exercise can be quite helpful. Acting in multiple roles can be a juggling
    act throughout the duration of a contract, and a table such as this can help you
    identify exactly what is required of you, and with whom you need to interact.


    | Role | Responsibilities | Deliverables |

    |---|---|--|

    | Project manager | The overall traffic manager, overseeing the progress from
    gathering requirements to delivery. Works with the client sponsor to define the
    scope and requirements of the project. | Scope statement (co-author); timelines.
    |

    | Project sponsor | This primary point-of-contact at the client company defines
    business requirements, and provides sign-off at various stages of the project.
    | Scope statement (co-author); creative brief; any additional materials deemed
    necessary for gathering of requirements. |

    | Information architect | Develops the site''s infrastructure and establishes
    guidelines that are both intuitive and scalable. | Site map; wireframes. |

    | Web designer | Establishes the site''s visual design, or "look-and-feel.\ |
    Graphic mockups; static HTML templates (as well as necessary CSS/image assets);
    style guide. |

    | Web developer | Responsible for any server-side programming when building a
    dynamic, database-driven Web site. | Functional specification; application installation/configuration.
    |

    | Database developer | Builds the database that will house the Web site''s content,
    and drive other dynamic aspects of the site. | Data model; database installation/configuration.
    |'
  merge: -1
