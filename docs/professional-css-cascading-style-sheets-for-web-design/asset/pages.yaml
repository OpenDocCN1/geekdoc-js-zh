  md: '# Stuff and Nonsense: Strategies for CSS Switching


    Server-side and JavaScript style sheet switches have existed for years. What makes
    “Invasion of the Body Switchers” different is the ability to independently switch
    screen, printer, and other media types. All with only one CSS and one JavaScript
    file. I’m proud of IOTBS and I hope that it will convince more designers with
    standards can expand their creative options.


    +   Q: We see that it''s used heavily on the site of Stuff and Nonsense (www.malakey.co.uk/).
    Have you used it on any professional projects? This is something that''s important
    to clients


    +   A: What is becoming increasingly important that our clients is offering various
    choices. Style switches “Invasion of the Body Switchers” can be used to offer
    same design things to visitor groups. By using CSS “display properties,” we can
    also hide and reveal content.


    This has been put to great effect in recent projects that target young people.
    By using the possibilities opened by IoTBS, we no longer have to choose three
    or more versions of XHTML document or even an Web Site. This reduces development
    times, which makes our business more efficient, and ultimately saves the client
    money.


    +   Q: Some designers might find it unsettling to allow users to, well, essentially
    revise their site''s design. What would you say to them? Should we let our users
    have control over the design of our pages?


    As designers or developers of Web sites, we need to remember that we are working
    for. For course it is our clients who put food on the table, but our work is ultimately
    judged by site visitors. The happier they are, the happier our clients will be
    and the better the chance that they will come back.


    The Web is unlike any other media. In television the picture stays pretty much
    the same no matter size screen you are viewing on. CRT, LCD, or Plasma, 17-inch
    portable or 52-inch widescreen, things stay pretty much the same. We have control
    over how the content is delivered and Web designers must remember that visitors''
    opinions matter more than their own.


    +   Q: After poking around a bit, it it seems that there has been a number of
    style switches online. Some of them rely client-side-JavaScript (as you do), others
    rely some back-end coding. Is there a clear benefit to either approach?


    +   A: Now you''re getting all on me! I''m only a humble designer! Many solutions
    are available to implement style sheet switching; some of them are “server-side”
    (relying on back-end languages like PHP) and others like “Invasion of the Body
    Switchers” are “client-side,” using languages like JavaScript. Which solution
    developer chooses depends on the environment where it is running and the needs
    of the client.


    It''s only a personal preference, but style sheet switching is a “client function,”
    I prefer to use client-side solutions. That said, I can give you the exclusive
    news that there will be a server-side version of “Invasion of the Body Switchers”
    coming soon.


    So, I suppose that begs the question: What is it that makes your client-side switch
    stand from the crowd?'
