  md: "# Stuff and Nonsense: Strategies for CSS Switching\n\n# Gathering Requirements\n\
    \nBefore we begin a lick of coding, we should make sure that we understand exactly\
    \ what it is we are building, as we discussed the benefits of requirements gathering\
    \ for a client project in Chapter 1, the smallest gig can benefit from some of\
    \ needs analysis. With a better understanding of what we need to build and the\
    \ goals that we are building achieve, we can code more quickly and efficiently—two\
    \ qualities that will make our clients and us quite happy.\n\nLet's take a quick\
    \ inventory of what we are working with:\n\n+   We have three link elements in\
    \ the head of our XML document that include screen-specific CSS files: a persistent\
    \ style sheet (main.css), and two alternate style sheets (contrast.css in Listing\
    \ 8-4 and the ultra-swank hot.css in Listing 8-5).\nAccordingly, at the top of\
    \ our document we've created a list of three anchors, corresponding to different\
    \ style sheets. Granted, these anchors are also useful as a roadmap in the desert,\
    \ but we're going to change that shortly.\n\nWith this in mind, what exactly should\
    \ our function do? Ideally, when a user clicks a:\n\n+   1. The function cycle\
    \ through each of the link elements in the head of our HTML, and inspect those\
    \ link to style sheets and have a title\n2. If the links matches the user selected,\
    \ then it will be set to the \"active\" CSS style.\n3. Otherwise, the link should\
    \ be set to \"disabled,\" which will prevent the browser from loading the style\
    \ sheet.\n4. Once the function has finished setting the active link element, it\
    \ should remember the user's choice. The style sheet the user selected will, therefore,\
    \ remain \"active\" as the user brows through the site, and the choice will be\
    \ remembered if the user returns to our site during a later browsing session.\n\
    \nHow, may we, will do all of this? The solution ultimately involves a fair amount\
    \ of dust and hopes—but we shouldn't get too far ahead of ourselves.\n\n# Building\
    \ the Switching Function\n\nWith our goals in mind, we can begin building our\
    \ style sheet functions. Let's create a new scripts.js, and include the following\
    \ markup in our HTML document:\n\n```\n<script type=\"text/javascript\" src=\"\
    scripts.js\"></script>\n```\n\nAs we're using the link element to include external\
    \ CSS files for our site's presentation, we can use the script element to reference\
    \ an external JavaScript file. And, in that, we can write in the first lines that\
    \ will power our CSS switcher. If JavaScript syntax looks a bit intimidating,\
    \ don't worry. We'll simply touch on some of the highlights, and get back to \"\
    Professional CSS\" malarker as quickly as possible.\n\n```\n// activeCSS: Set\
    \ the active stylesheet\nfunction activeCSS(title) {\n  var i, oneLink;\n  for\
    \ (i = 0; oneLink = document.getElementsByTagName(\"link\")[i]; oneLink; i++)\
    \ {\n    if (oneLink.getAttribute(\"title\") && findWord(\"stylesheet\")) {\n\
    \      oneLink.getAttribute(\"rel\");\n    }\n  }\n```"
