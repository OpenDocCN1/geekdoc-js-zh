- img_proc: true
  md: '# Chapter 9


    By the time the third issue rolled around, I knew that I wasn''t using the computer
    effectively. I had spent many hours hastily trying to create graphics out of thin
    air instead of coming to the computer with an agenda or a goal. The solution was
    to change how I approached a computer and my work.


    Instead of going straight to the computer on graphic designs, I took a few sheets
    of paper from the printer tray, walked past the computers and headed over to a
    workbench. Once there, I came up with ideas for story doodling, sketching, or
    brainstorming and using cluster diagrams. With the ideas for images in place,
    I went to the computer.


    The results were staggering. After several days of working only a couple of graphics,
    I spent one day coming up with concepts for the images and one to two days creating
    them. This immediate efficiency was also welcomed by my fellow staff members,
    who, having discovered that I had more free time, put me to work helping out with
    their tasks.


    To effectively use the computer, I needed a plan on how to use it. Otherwise,
    the computer was a hindrance.


    # Defining the Site’s Scope


    With the lessons of planning firmly ingrained and underscored in Chapter 1, let''s
    define the goals, deliverables, and assumptions for my new site:


    +   - Goals:


    +   - Improve aesthetic design. My current site is a simple, straightforward Web
    site built in CSS. One of the goals for the site is to be more visually appealing
    and push the CSS further.


    +   - Add a blog. To ease when updating the site, I want to implement blogging
    software. My software of choice will be WordPress because it relies on open source
    software (PHP and MySQL). Also, I''m familiar with both technologies, so I should
    be able to make tweaks to the code and integrate components of my site more easily
    than with another solution.


    +   - Provide usable navigation. The design must make navigation simple and be
    usable on text-only browsers or as on screen readers.


    +   - Update photos. With an improved design, I want to include a photo in the
    header of the page and update it when I have an interesting photo I''ve taken
    with my trusty digital camera.


    +   - Increase traffic to the site. My domain name is still the major goal. While
    the blogging software will help to manage the content, site updates must happen
    on regular basis. That means, as the sole content producer, I have to publish
    on a regular basis.


    320'
