    # Dealing with Internet Explorer


    The previous example works perfectly for users of IE. However, if you''re not
    careful, you can cause problems for the few people out there who claim IE5 for
    the Mac as their browser of choice. It turns out that this browser has an odd
    sliking for quotation marks around image filenames in CSS.


    For example, this will work:


    ```

    ul li#publish a {

    background: #fff url(icon_publish.gif) no-repeat top left;

    }

    ```


    But this will not:


    ```

    ul li#publish a {

    background: #fff url(''icon_publish.gif'') no-repeat top left;

    }

    ```


    And we will this:


    ```

    ul li#publish a {

    background: #fff url("icon_publish.gif") no-repeat top left;

    }

    ```


    Many codes like to put quotation marks around such filenames, triggering color-coding
    in their text editors, as shown in Figure 3-77. Unfortunately, it seems that by
    doing so, they''re depriving IE5 Mac users of the full, visual experience.


    139'
