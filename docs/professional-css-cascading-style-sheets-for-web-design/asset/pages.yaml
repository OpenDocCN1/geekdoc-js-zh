    limits the amount of control we can exercise over PHP''s configuration. If an
    "as-is" installation isn''t appealing to you, then the official documentation
    is the best resource out there.


    # Creating the Script


    Once we have PHP up and running on our server, we can get to work. Let''s modify
    our XML—the unordered list that contains the different style sheet options. We
    proceed by using onclick handlers to draw the list, as the landscape has changed
    somewhat:


    ```

    <ul>

    <li id="style-default"><a href="switch.php?style=default">Default style</a></li>

    <li id="style-contrast"><a href="switch.php?style=contrast">Higher contrast</a></li>

    <li id="style-hot"><a href="switch.php?style=hot">Gratuitous CSS</a></li>

    </ul>

    ```


    Now, all of our links are pointing to a named file switch.php—but what''s all
    of $style=stuff stuff in our link? The text that follows the question mark in
    the href is known as a query string; query parameters always come in name/value
    pairs, so:


    ```

    file.name?name=value

    switch.php?style=contrast

    ```


    If we want to pass name/value pairs to our script, we concatenate them with ampersands
    (&;


    ```

    Switch.php?style=contrast&amp;font=serif&amp;css=code

    ```


    In HTML, ampersands have a special meaning. They are used to signal the start
    of character entities, codes that represent a special character in HTML. For example,
    &copy; is the entity for ©;&trade; will display ™ in our browser, and so forth.
    However, when we want a literal ampersand to appear, in our query string, we need
    to use &amp;, which is the proper entity reference. Otherwise, the HTML will be
    invalid, and our query string may break—and we don''t know about our readers,
    but those two options aren''t appealing to us.


    301'
