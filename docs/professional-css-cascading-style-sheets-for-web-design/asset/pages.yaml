    our daily workflow is another matter entirely. To do so, let''s examine two critical
    items in a modern Web designer''s toolkit—and, neither of them has a magic tool
    or a palette in sight.


    # Build to a Reliable Browser


    If you build a site when testing in a browser, you''re building code that relies
    upon browser rendering. It''s as if you''re building a house on a foundation of
    sand. Once you testing on other browsers or platforms, the flaws in your work
    will become too apparent. Start, with a modern browser with an acknowledged level
    of standards-compliance. As you''ll see in this chapter, you can write hacks into
    your code that address lesser browsers'' quirks.


    This isn''t a browser''s snob, nor is it an attempt to switch your favorite browser.
    Rather, this approach will waste you time and resources when building your site.
    If you building a flawed browser''s bugs, you will spend more time debugging than
    in more standards-compliant one. As of this writing, this means one of three options:
    Opera, Safari, or a Gecko-based browser such as Camino, Mozilla, or Firefox.


