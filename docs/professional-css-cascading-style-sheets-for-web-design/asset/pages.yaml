  md: '# Chapter 3


    ![](img/70fa44d3a461f43c7a35cac2b893273d_138_0.png)


    What''s neat about this method is by using the background-image and content properties,
    we''ve managed to insert two images into a single pseudo-element. Without that
    ability this fluid layout would beyond our ''minimalist markup'' approach, and
    we''d have to resort to hacky CSS or even adding in extra divs.


    Now, having mastered the top of box, let''s do the same for the bottom corners.


    # Rounding the Bottom of the Box


    First, we create our :after pseudo-element:


    ```

    .box:after {


    }

    ```


    Next we''ll insert our bottom-left rounded-corner image into the pseudo-element,
    via the content property (see Figure 3-43):


    ```

    .box: after {

    content: url(box-bl.gif);

    }

    ```


    ![](img/70fa44d3a461f43c7a35cac2b893273d_138_1.png)


    Now we''ll add in the bottom-right rounded-corner image. We do this by setting
    a background-image on the pseudo-element and making the thing block-level, as
    shown in Figure 3-44:


    ```

    .box: after {

    background: transparent url(box-br.gif) no-repeat right;

    content: url(box-bl.gif);

    display: block;

    }

    ```'
