  md: '# FastCompany.com: Building a Flexible Three-Column Layout


    natural way to combine all of these creative impulses together. It''s a creative
    outlet as well as a technical one.


    The work of colleagues also kept me fired—being motivated by what others are doing,
    learning from their experiences, the sharing of knowledge—it''s always a wonderful
    gift-and-take community.


    Q: You must have some design influences; care to drop a few names?


    A: I think design-wise, my influences are less, than what I see and experience
    every day. Early on, I was influenced by the music packaging of indie bands, and
    later by the stellar design of Fast Company magazine and its designers. I feel
    that walking through the supermarket has an impact on design. Even if it just
    makes me think of what I like and what I don''t like. Traveling is also a big
    influence—I see architecture, design, and packaging from different parts of the
    U.S. and abroad. Just looking at anything visual has an impact on me.


    Having no design training, I confess that at times I feel like I get lucky when
    some things come out. I tend to design from the gut, based on the environments
    and experiences I''ve soaked in.


    As far as inspiration, however, there are plenty of web designers whose work I
    admire. This tends to motivate me, get me excited about people. People like Douglas
    Bowman, David Shea, and Jeffrey Zeldm, who speak for themselves.


    Q: So, what about your design process? How do you usually work?


    A: I usually start with a Photoshop canvas. I use Photoshop like a sketchbook
    with color palettes and dimensions. From there, I usually code page components,
    screen grab, and bring them into the Photoshop file. So, a combination of code
    and graphics editing me to the "mock-up" phase. When the client is happy, I begin
    putting it up.


