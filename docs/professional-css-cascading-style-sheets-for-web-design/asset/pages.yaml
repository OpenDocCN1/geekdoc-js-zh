  md: '# FastCompany.com: Building a Flexible Three-Column Layout


    The difference is marked, as Figure 7-4 shows. We''ve visually broken the parent-child
    relationship between the two divs. While the inner block is still a child of the
    outer one, we typically use CSS to override the former''s position in the normal
    document flow. Instead, we''ve positioned it absolutely, offsetting it 20 pixels
    from the topmost and rightmost edges of the body of our document.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_273_0.png)


    **Figure 7-4:** In the markup, the topmost block is a child of the bottom one.
    However, using position: absolute; removes the block from the document flow and
    positions it relative to the viewport.


    The inner block typically appears in the normal flow of the document, in the context
    established by the block-level elements that surround it in the markup. Our rule
    has redefined context, and placed it in one that is relative to the boundaries
    of the browser window. This is why the body root of our document — the html element
    — is also known as the initial containing block, as it typically provides the
    positioning context for all elements contained within.


    Furthermore, this new positioning context for #inner has redefined that of its
    children — namely, the paragraph contained therein. In other words, we''ve not
    only repositioned the div, but any and all elements contained therein. This becomes
    a bit more apparent if we add a few paragraphs to our absolutely positioned block,
    as we see in Figure 7-5.


    When two new paragraphs are added to #inner (our absolutely positioned block),
    they inherit their parent''s positioning context — which is all a fancy of saying
    that since their parent block is absolutely positioned, it will expand to contain
    its new children.


    249'
