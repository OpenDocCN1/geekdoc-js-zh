  md: "# Stuff and Nonsense: Strategies for CSS Switching\n\nOnce the cookie be set,\
    \ we simply redirect the user back to $bounce_url, which was set at the beginning\
    \ of the file. We've included some processing at the top of switch.php, examining\
    \ the user's reference (the URL of the page he or she was visiting before we switch.php).\
    \ If the user was referred from a $domain (if strpos($_SERVER['HTTP_REFERER'],\
    \ $domain)) then we'll simply redirect the user to it. However, if another site\
