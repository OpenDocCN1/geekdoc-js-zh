  md: '# 2

    Best Practices for XHTML and CSS


    In its early years, the Web wasn''t the most attractive thing on the planet. Created
    and for nuclear physicists, hypertext was simply a means by which content-heavy
    documents could be shared over an open, distributed network. Needless to say,
    high-caliber-heavy design wasn''t a top priority for the Web''s earliest users.
    In fact, HTML''s much-used (and, as we''ll discuss, off-abused) table element
    was created with one purpose: the display of tabular data.


    By the time we reached the heyday of late-1990s Web design, the "L" in HTML was
    often ignored. Many professionals felt that the code we used to build Web pages
    wasn''t a language *per se*, and as such, wasn''t behold to the rules and restrictions
    of a real programming language. Besides, clients weren''t paying us for "compliant,"
    "accessible," or "future-proof" code. In fact, many sites were produced with the
    requirement that they be "backward compatible." This was a misomer if there was
    ever one that simply required a consistent display in 4.0 browsers or higher.


    Browsers of that time were temporal to the least. With poor support for the specifications
    written by the World Wide Web Consortium (www.w3.org/), or for W3C, you could
    count on a page rendering differently in Browser A than in Browser B. So, while
    we were duly aware of the "standards" the W3C produced, the browsers we had to
    support were less tolerant of standards-compliant markup. In this, the divide
    between the science and the reality of the Web was far too great. We would undoubtedly
    invalidate HTML with proprietary, browser-specific markup to ensure that things
    "looked good" in our target browsers. And for a time, all was good. We had narrow
    specifications, we had deadlines, we weren''t paid for the, and as you can see,
    we had excuses.


    Of course, designers learned early on by zeroing out a table''s cellspacing, padding,
    and by, we could create complex grid-based layouts, and bring a new level of aesthetic
    appeal to our sites. Granted, given browsers'' poor support for CSS in those days,
    we had no alternative but to weigh our pages down with presentational craft. The
    result was a Web that was bogged down by the weight of its own markup, saturated
    with kilobyte-heavy pages that are hard to maintain, costly to redesign, and unknown
    to our users'' bandwidth.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Chapter 2


    Thankfully, there is a way out. XHTML and CSS are two standard technologies that
    will enable you to clear away the clutter in your pages, facilitating pages that
    are significantly lighter, more accessible, and easier to maintain. Of course,
    these two tools are only as effective as your ability to wield them. This chapter
    examines the need for XHTML and CSS, and introduces some practical strategies
    for applying them intelligently to your design.


    # Structure and Presentation:

    Shoehorned Together


    Now, let''s take a deep breath, and be honest with ourselves: Does this HTML snippet
    look familiar?


    ```

    < marginwidth="0" marginheight="0" leftmargin="0" toplam="0>

    ```


    In the heyday of Web Design, this was the way to place your pages'' content flush
    against the browser window. Without these four attributes, our designs would be
    surrounded by a margin of 10 or so pixels — and we''re sufficiently finicky where
    something like this would keep us at night.


    This approach highlights the emphasis on which "looking right" pervaded early
    Web Design. Despite HTML''s well-structured layout, our pages evolved into a kind
    of "tag soup" — a not-so-t goulash of structural and presentational markup. Because
    contemporary browsers had nonexistent or imperfect support for styling sheets,
    font elements, and deeply nested tables to control our sites'' designs. Our attribute-heavy
    body perfectly illustrates this mismatch of style and structure in our markup.
    The body element itself performs an important purpose (it contains a Web page''s
    content), the small army of attributes crammed into its opening tag is there only
    to make structure like a certain way.


    Grating, our body element might not seem all egregious — it is really worth wringing
    our hands over one line of markup? For a concrete example of the problems with
    presentation-markup, let''s look at the Harvard University home page (www.harvard.edu/).
    The site''s design (see Figure 2-1) admirably reflects the University''s well-established
    brand: a conservative, earth-toned color palette accents the distinctive Harvard
    crimson; by all accounts, it''s a successful site design and one that gathers
    more than a little traffic each day, we''re sure.


    There are a number of browser utilities you can install to quickly affect the
    display of a page as we''ve done here. For the Mozilla browsers, the Web Developer
    Toolbar (http://crispepperick.com/work/firefox/webdeveloper/) is such a tool,
    and an excellent one at that. It''s an invaluable part of our CSS toolkit, allowing
    designers to turn on borders of different page elements, quickly edit a page''s
    CSS, and easily access various code validators.


    30'
