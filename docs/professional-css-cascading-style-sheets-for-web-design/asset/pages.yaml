  md: '# Chapter 9


    Again, I start to apply styles by working from top to bottom. The first item in
    the side column is the main navigation.


    # Start of Site Navigation


    The spine for any site is the menu navigation. The Web is a loose collection of
    documents that are connected by links. The difference between any old link and
    a site''s menu can be debated by people wiser than I, but links in a site menu
    need to do a few things:


    +   - Stand out from the rest of the Web page design

    - Easy to find within a page design

    - Let the user know he or she is in the structure of a Web site


    Because I''m going to focus a lot attention to the design and execution of the
    navigation, I want to create a separate HTML page so that I don''t interfere with
    the other elements on the Web page. When I''m working on the navigation, I will
    move the HTML over the original Web page design and graft the CSS rules for the
    navigation to the main CSS file.


    So, with a new HTML page, I set up an unordered list to mirror the site map I
    worked earlier in the chapter, as shown in Figure 9-35.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_384_0.png)


    The look for menus needs to be similar to (yet stand out from) the rest of the
    design to facilitate reference by visitors.


    In my design I conjured up in Photoshop, I believe that I have the successful
    look—but the interesting part is to see if I can get CSS to help me produce it.'
