  md: "# The PGA Championship\n\nAs shown in Figure 4-12, it was easy to see the problem.\
    \ The left edge of each drop-down menu was aligned with the left edge of its list\
    \ item, and there wasn't visual separation between each option.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_195_0.png)\n\
    \nSo, some additional edits were made to the nested list items:\n\n```\n#nav li\
    \ li {\n  height:auto;\n  margin:0;\n  padding:0;\n  width:100%;\n  font-size:9px;\n\
    \  border-bottom:1px solid #F5F5F0;\n}\n```\n\nBy setting the width of each list\
    \ item boxes expanded to the width of their parent element—which, in case, was\
    \ 146px. Had the default width of the list items not modified, the browser would\
    \ have a bottom border for as long as the text contained inside. By setting the\
    \ list item to a width of 100 percent, the menu options had a uniform appearance,\
    \ regardless of how much text was contained in each item.\n\nNext, the content\
    \ was addressed:\n\n```\n#nav li span {\n  display:block;\n  margin:0;\n  padding:3px\
    \ 4px 3px 7px;\n  position:relative;\n}\n```\n\nTo better control the positioning\
    \ of each block of text within its respective list items, each option was wrapped\
    \ with a span tag because span avoided another subclass with a unique name and\
    \ made more sense than a div, paragraph tag, or what-have-you. So, the display\
    \ properties of span changed to a block element (which by default it was not).\
    \ This allowed block attributes such as margin and padding. After the padding\
    \ was successfully tweaked, the menus appeared, as shown in Figure 4-13.\n\n171"
