    ![](img/70fa44d3a461f43c7a35cac2b893273d_210_0.png)


    The headers here assign meaning to both the current page and the entire site.
    This benefits users of screen readers such as Jaws and IBM’s Home Page Reader,
    allowing rudimentary navigation from header to header. As an added bonus, many
    search engines give more weight to text inside headings.


    Because the initial letters of Integrated Student Information System (UF''s Web-based
    system to register for classes and pay tuition, which is seen inside the list
    item for acronyms) form a pronounceable word, ISIS is considered *acronym*. (ISIS
    is pronounced "eye-sis") if the initial letters formed a word called an *initialism*
    when each letter is pronounced (as in HTML), the word would be an abbreviation
    and the *abbr* tag used. The abbr elements allow contextual expansion of the text
    presented to the visitor. This should be done to describe the first occurrence
    of any acronyms or abbreviations in a document. This also explains what would
    be esoteric phrases to search engines such as Google.


    Every instance of an acronym can be annotated, but such annotation is not really
    needed and can quickly become cumbersome.


