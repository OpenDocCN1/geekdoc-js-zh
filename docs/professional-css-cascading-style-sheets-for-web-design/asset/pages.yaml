  md: '# Layout


    The layout is pretty much set in stone with the completion of the wireframe, but
    I want to take a moment to discuss the rationale behind some aspects of the layout:


    +   - **Navigation.** Based on personal observation and preference, I placed the
    navigation on the right-hand side because most people position the cursor on the
    right-hand side of the browser window while they are skimming a Web page. As soon
    as the user wants to go to a different section, the amount of distance the cursor
    must travel to reach the navigation is less when the menu is on the right compared
    to the left. The time to accomplish a task often makes a better serving experience
    for the visitor.

    - **Search box.** I placed the search box on the top of the page because that''s
    where Jakob Nielsen placed his on his site (see www.use.com). Actually, I put
    the search there as a release valve for my readers. If they can''t find what they
    are looking for a couple clicks on the navigation, they can go to the search box.
    But in these search engines of Google, I realize that people often "surf" through
    a search first.

    - **Fixed-width, 800 pixels wide.** As a designer, I like the control that having
    a fixed-width design affords me. I''m in favor of making sure the design is large
    enough to fill the screen at 800 pixels wide. This width is slightly unusual in
    Web monitors at 800 wide wide. Resolutions can expand to 800 pixels wide where
    Web pages have a viewport of no more than 792 pixels to ensure the entire page
    is visible. The ratio for having a larger page width is based on three things:

    - **Monitor resolutions** are increasing. Out of the box, new computers are coming
    with monitors that can handle higher resolutions. And the audience for my site
    is using the latest and greatest computer technologies and are able to view the
    site fine.

    - **Be bold.** When I was first starting out as a designer, I was lucky enough
    to attend a talk given by Dr. Mario Garcia, who redesigned newspapers for more
    than 30 years (see www.mariogarcia.com/Profile.asp?pageid=50). After he redesigned
    my local newspaper, he was asked by the publication to give a talk to the community
    about the redesign. One of the minor notes he made in his presentation is that
    his clients tended to be on the shy with their logos. He makes it point to make
    the logo a bold presence on the front page. In other words, don''t hesitate to
    be bold.

    - **It''s a nice number.** I''m not going to lie. Although I don''t think of myself
    as a slouch in the math department, there''s a reason I''m a designer rather than
    an engineer. I''m not big on math and 800 is a nice number to work with, especially
    in light of Microsoft''s box model (see Chapter 8) and the need to make use of
    workarounds because of it. So, making things easier on myself will help me develop
    the road.


    Now that we''ve looked at the tone of the forthcoming design, I open Photoshop
    and start working on design versions.'
