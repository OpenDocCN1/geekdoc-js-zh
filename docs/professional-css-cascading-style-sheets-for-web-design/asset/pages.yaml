  md: "# Best Practices for XHTML and CSS\n\nAccording to the CSS specification (www.w3.org/TR/CSS21/cascade.html#important-rules),\
    \ the !important rules \"create a balance of power between author and user style\
    \ sheets.\" As we mentioned, rules contained in a user style sheet are typically\
    \ weighted less than those in the author's CSS. However, the presence of an !important\
    \ rule turns this relationship on its head; a user's !important declarations are\
    \ always weighted more than the author's, as shown in Figure 2-17.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_89_0.png)\n\
    \nFigure 2-17: Style origin and the cascade, from least to most important\n\n\
    How does this affect our CSS? Let's say that a browser is trying to determine\
    \ the style for a paragraph element (p). After parsing all available style sheets—browser,\
    \ user, and author—all relevant styles are evaluated, as shown in Listings 2-1,\
    \ 2-2, and 2-3.\n\n# Listing 2-1: The Browser's Style Sheet\n\n```\np {\n  color:\
    \ #000;\n  font-size:\n  1em;\n  margin: .9em;\n}\n```"
  merge: -1
  pgno: 89
- img_proc: true
  md: "# Chapter 2\n\n# Listing 2-2: The User's Style Sheet\n\n```\np {\n  color:\
    \ #060 !important;\n}\n```\n\n# Listing 2-3: The Author's Style Sheet\n\n```\n\
    p {\n  color: #300;\n  font-size: 1.2em;\n  line-height: 1.6em;\n  padding: 10px;\n\
    }\n```\n\nLet's set aside the user style sheet for a moment. Therefore, for general\
    \ users, paragraphs will be styled according to this final, calculated result:\n\
    \n```\np {\n  color: #300;\n  font-size: 1.2em;\n  line-height: 1.6em;\n  margin:\
    \ .9em;\n  padding: 10px;\n}\n* author overwrites browser rule /*\n* author overwrites\
    \ browser rule /*\n* specified only by author /*\n* specified only by browser\
    \ /*\n* specified only by author /*\n```\n\nNow, if you views your page with the\
    \ user style sheet from Listing 2-2, the final result is changed somewhat:\n\n\
    ```\np {\n  Color: #060;\n  font-size: 1.2em;\n  line-height: 1.6em;\n  margin:\
    \ .9em;\n  padding: 10px;\n}\n* user important rule overwrites author rule /*\n\
    * author overwrites browser rule /*\n* specified only by author /*\n* specified\
    \ only by browser /*\n* specified only by author /*\n```\n\n# Sort by Specificity\n\
    \nEvery selector is given a specificity rating, which is yet another qualitative\
    \ assessment of selector's importance in the cascade (www.w3.org/CSS21/cascade.html#specificity).\
    \ The higher a rule's specificity, the more influence it is granted when your\
    \ browser fights through all the rules in the cascade. For example, id-based selectors\
    \ are inherently more specific than class-driven selectors, as the id design occurs\
    \ once in each\n\nSpecificity is calculated by the selector's syntax itself, and\
    \ is weighted for four separate factors:\n\n+   A. Whether or not the selector\
    \ is the \"style\" attribute of an element, rather than a true selector.\nB. The\
    \ number of id attributes in the selector."
