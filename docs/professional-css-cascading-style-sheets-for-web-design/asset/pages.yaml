  md: "# # Best Practices for XHTML and CSS\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_83_0.png)\n\
    \nNotice the three links in a light-gray, horizontal row, each surrounded by a\
    \ 1 pixel-thin black border. This seems rather unassuming, until you consider\
    \ the traditional markup method for creating it:\n\n```\n<!-- outer table -->\n\
    <table bgcolor=\"#000000\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n\
    <tbody>\n  <tr>\n    <td>\n      <!-- inner table -->\n      <table border=\"\
    0\" cellspacing=\"1\" cellpadding=\"3\">\n        <tbody>\n          <tr>\n  \
    \          <td bgcolor=\"#DDDDDD\"><font face=\"Verdana, Geneva, Helvetica, sans-serif\"\
    \ size=\"2\"><a href=\"home.html\">Home</a></td>\n            <td bgcolor=\"#DDDDDD\"\
    ><font face=\"Verdana, Geneva, Helvetica, sans-serif\" size=\"2\"><a href=\"about.html\"\
    >About</a></td>\n            <td bgcolor=\"#DDDDDD\"><font face=\"Verdana, Geneva,\
    \ Helvetica, sans-serif\" size=\"2\"><a href=\"products.html\">Our Products</a></td>\n\
    \          </tr>\n        </tbody>\n      </table>\n    </td>\n  </tr>\n</tbody>\n\
    </table>\n<!-- end table -->\n```\n\nThere are two tables involved in this simple\
    \ navigation bar. The first, outer table has a black background applied to it\
    \ (bgcolor=\"#000000\"). The inner table has no background color of its own, but\
    \ has a cellspacing of 1 pixel. This allows the parent table's background to bleed\
    \ through, creating the \"border\" effect around each of the navigation items.\
    \ We've also added 3 pixels of cellpadding on the inner table, so that there's\
    \ some breathing room between the text of each link and the table cell (<td>)\
    \ that it contains. Finally, the gray background color (bgcolor=\"#DDDDDD\") is\
    \ applied to each cell of the inner table, as well as a <font> element denoting\
    \ the appropriate typeface and size."
