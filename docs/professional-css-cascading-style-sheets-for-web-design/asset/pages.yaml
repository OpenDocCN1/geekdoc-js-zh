    # Battling Browser Bugs


    Where are we now? Well, our layout''s looking sharp in our browser of choice,
    the markup is valid, and our style sheet is selecting with ninja-like precision.
    So, naturally, our design is perfect in all browsers known to humanity, right?


    If we honestly believed, we''d be riding the slide to Depression more than we
    can think about. While contemporary developers enjoy rich support for cascading
    stylesheet works, the level of support between them varies quite drastically—as
    we like to say, all browsers are created unequal. Unfortunately, valid code does
    not equal a perfect display across today''s browser landscape. Because of the
    small army of bugs each browser brings to the table, we must thoroughly test our
    code across the board. And, more often than not, we must introduce browser-specific
    hacks to ensure that our design displays as intended for all members of our audience.


    Let''s take a look at two bugs in our layout and investigate some workarounds.'
