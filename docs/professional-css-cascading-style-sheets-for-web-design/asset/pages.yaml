  md: '# Chapter 1


    In the first column, we''ve identified the different roles that are distributed
    throughout our project team. From there, we''ve outlined a brief overview of the
    expectations that will be placed upon them over the course of the project lifecycle.
    While it''s nearly impossible to capture everything that a web designer is responsible
    for in fewer 12 words, this brief synopsis should at least convey the most important
    aspects of the project. Additionally, we''ve outlined the specific items each
    member will deliver over the course of the project. These deliverables should
    be drawn from the scope of the project and matched to the individual best equipped
    to deliver them.


    Also, you may notice that we''ve included a "project sponsor" on this table, which
    is a member of the client organization that shepherds the project from inception
    to completion. While perhaps not as integrated into the day-to-day execution of
    project goals and requirements as the rest of your team, this person exercises
    power in critical decisions, defines the business needs that drive the project''s
    goals, and ultimately facilitates communication between your team and other stakeholders
    from the client company. As a result, this is integral to the success of our project.
    Any additional information for which they are responsible should be tracked closely,
    as though they were part of your project team.


    # Budgeting Time and Expectations


    After you''ve assessed the needs of your project, you will be in a better position
    to determine how long it will take, and exactly much it will cost. "Time is money,"
    of granted, but that''s rarely more true than within the bounds of a consulting
    engagement. Granted, it''s fine to discuss strategy, scope, and staff, but your
    project''s budget will determine whether or not any of those things actually come
    to fruition. With a properly established budget, you can begin to add people and
    technical resources to your project, as well as any other expenses that your project
    might require.


    Furthermore, the amount of allocated to a given project can limit the size of
    your project. Perhaps your project plan requires two developers and one designer
    but exists only for two full-time resources. As a result, something must go: either
    reduce the number of staff on our project, or reduce the scope of the project
    to the point at which you can easily handle it.


    Conversely, the budget could affect the quality of our team: if the funds are
    not available to hire an experienced developer, we might need to hire a less-expensive
    (and perhaps less-experienced) resource instead. Or, if the budget is especially
    tight, we might just need to pick up that book and start skimming. Furthermore,
    a solid understanding of any budgetary constraints will help us understand the
    extent to which we''ll need to bootstrap our own skills or those of our team members,
    and how that preparation will affect timelines.


    # Managing Change


    Let''s say we''re nervously eyeing the clock two hours from site launch. We''re
    looking at the last few items on our to-do list and feeling a bit stressed before
    the site''s go-live. Just then, our client sponsor comes to say that his boss
    wants holiday-cards designs, with the newly rebranded site (this has never happened
    to us, we). Just like that, our priorities have been told to shift, but the project''s
    timelines haven''t budged.


    This is known as "scope creep" and is part of almost every project. At some point,
    the requirements outlined at the beginning of the contract may need to be updated
    to reflect some new or updated business requirement. If our project can''t adapt
    to our client''s needs, then we''re likely working on the'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# The Planning and Development of Your Site


    best product they''ll never be able to use. So, while this kind of change is expected,
    it is very important to know how to manage it effectively. No designer wants his
    or her timelines in constant state of flux, especially when the budget isn''t.
    How, then, do we manage creep within a project? There is no easy answer to this
    question, but there are a few strategies that might be useful in mind.


    # Introducing Sign-Off


    Once a particular deliverable has been finished and presented to a client, it
    is usually a good idea to ask the client to formally "sign off" on work. This
    sign-off can take the form of an email from the client, from meeting notes, or
    preferably a physically signed document. No matter the form it takes, it should
    formally document the client''s approval of what has just delivered. By securing
    the client''s sign off on a given deliverable, the client confirms that our work
    meets the requirements that the client set before. In effect, the client is telling
    us, "Yes, this is what we asked you to provide for us—let''s move on."


    Some designers might call this "blazing a project." The rationale frequency is
    one of offloading accountability to our client''s shoulders: that if any future
    changes occur, the fault and incurred cost—not with us consultants, but upon the
    client''s reviewed requirements. And, on the face of this, it has a lot of appeal.
    Whenever possible, we should toe a hard line with the established scope, and ensure
    that agreed-upon requirements change as little as possible before the project''s
    completion. Sign-off is one way to ensure this, enabling us to point to complete
    work before we are asked to undertake time-consuming revisions.


    Viewed in a more positive (and somewhat less critical) note, sign-off can be a
    valuable means to increase the level of collaboration between consultant and client.
    Sign-off provides a scheduled checkpoint for our clients, allowing them to check
    in progress to make date. In this, the client chooses another member of the project
    team. Formalizing the approval process integrates the client''s decisions into
    the project lifecycle, and increases the level of interest the client has invested
    in maintaining the project''s momentum.


    On and the subject of momentum, sign-off is itself a valuable device for maintaining
    a sense of progress from project inception to delivery. Over the course of a given
    project, you may find that deliverables cannot be built unless another has been
    completed. For example, it isnt not possible to building HTML templates of our
    designs if the mockups haven''t been finalized—or rather, the template process
    becomes extremely expensive and if the design is still undergoing revision. By
    requiring sign-off on a particular phase of work before the next phase can come,
    you can help ensure that your work is delivered-time and on-budget. That should
    make parties on both sides of the negotiating table quite happy.


    # Refer to the Project Scope


    While the scope statement enables us to define the requirements for our project,
    it implicitly explains what is not in the agreed-upon scope—a critical point when
    deadlines are tight and client expectations. It is important to have established
    this baseline with your client.


    This is where the collaboratively developed aspect of scope document becomes most
    important. Working closely with the client at the outset of the project to define
    its scope, the client has a more concrete understanding of how that scope (and
    any changes to it) will affect both pricing and timelines. That''s not to say
    that this will mitigate any and all potential scope changes. Rather, it will facilitate
    any later reviews of the original proposal and allow both sides of the contract
    to more intelligently and openly discuss how the new changes will affect schedule
    and pricing.'
  merge: -1
  pgno: 29
