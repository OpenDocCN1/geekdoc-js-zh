  md: "# Bringing It All Together\n\nI apply a padding of 25 pixels to the right-hand\
    \ side. This should be enough width for any browser’s vertical scroll bar.\n\n\
    Also, when I removed the horizontal scroll bar, I added a margin of 13 pixels\
    \ to the right side (Listing 9-4) and background color to create the list items\
    \ to the L-shaped pattern, as shown in Figure 9-54.\n\n# Listing 9-4: CSS for\
    \ the Blogroll List Items\n\n```\n#blogroll 1 {\n  background-color: #ffffff;\n\
    \  margin: 0 0 13px;\n  padding: 0 25px 0 0;\n}\n```\n\nI took out the bullets\
    \ for the list items earlier in the code, I need to place another marker to take\
    \ their place; otherwise the links are going to appear to run together. I don't\
    \ want to go back to a browser’s default markers.\n\nTo add a custom marker, I\
    \ can use the list-style-image property, but I also need to replace the previous\
    \ list-style-type declaration with a new one (as a backup, in case my image fails\
    \ to load), as in Figure 9-55:\n\n```\n#blogroll ul {\n  /* list-style-type: none;\
    \ */\n  list-style-type: disc;\n  list-style-image: url(../img/bullet_green_dark.gif);\n\
    \  margin: 0 17px 0 0;\n  padding: 0;\n  height: 100px;\n  overflow: auto;\n}\n\
    ```\n\nThe main problem with this CSS rule (as Figure 9-55 shows) is that the\
    \ marker is pushed off to the left of the screen and freely visible to the user.\
    \ This is because the left margin value of 13 pixels in Listing 9-4. Reducing\
    \ the size of the margin isn’t going to work because I need to move to the list\
    \ items elements over.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_401_0.png)\n\
    \n377"
