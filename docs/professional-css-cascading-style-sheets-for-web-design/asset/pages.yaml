    \ system administrator does one or his job properly, then this's all that's required\
    \ to be XHTML for a little PHP-fu.\n\nOnce we've changed the extension, we can\
    \ insert the following code in the head of our document:\n\n```\n<link rel=\"\
    stylesheet\" href=\"main.css\" type=\"text/css\" />\n<?php\nif ($_COOKIE['mystyle'])\
    \ {\n  <link rel=\"stylesheet\" href=\"<?php echo $_COOKIE['mystyle']; ?>.css\"\
    \ type=\"text/css\" media=\"screen\" />\n<?php}\n}?>\n```\n\n```\n<link rel=\"\
    alternate stylesheet\" title=\"Higher Contrast\" href=\"contrast.css\" />\n<link\
    \ rel=\"alternate stylesheet\" title=\"Gratuitous CSS\" href=\"hot.css\" type=\"\
    text/css\" />\n```\n\nWhen our markup document is loaded in the browser, the snippet\
    \ of PHP is inserted into the head. If \"mystyle\" cookie is set (or the value\
    \ is an empty string), then none of the code wrapped in the if {...} statement\
    \ runs. However, if our cookie is present, then a new link element is printed\
