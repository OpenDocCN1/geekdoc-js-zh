  md: "# Best Practices for XHTML and CSS\n\nborder to the first list item, and only\
    \ the first list item — we don't need that double-border effect again, thank you\
    \ very much. To do that, let's apply a class attribute to the first list item\
    \ in our markup:\n\n```\n<ul id=\"nav\">\n<li class=\"first\"><a href=\"home.html\"\
    >Home</a></li>\n<li><a href=\"about.html\">About Us</a></li>\n<li><a href=\"products.html\"\
    >Our Products</a></li>\n</ul>\n```\n\nNow that we've supplied ourselves with “hook”\
    \ into our document structure, it should be pretty straightforward to write a\
    \ style rule that applies a border to that element, and element alone:\n\n```\n\
    #nav li.first a {\n  border-width: 1px;\n}\n```\n\nFigure 2-16 shows the result.\n\
    \n![](img/70fa44d3a461f43c7a35cac2b893273d_87_0.png)\n\nFigure 2-16: The final\
    \ result\n\nAnd that's done it! Here's the entire set of rules we've written:\n\
    \n```\nul#nav, ul#nav li {\n  float: left;\n  list-style: none;\n  margin: 0;\n\
    \  padding: 0;\n}\n\nul#nav {\n  font-family: Verdana, Geneva, Helvetica, sans-serif;\n\
    \  font-size: .82em;\n  background-color: #DDD;\n}\n\nul#nav li a {\n  border-color:\
    \ #000;\n  border-width: 1px 1px 1px 0;\n  border-style: solid;\n  display: block;\n\
    \  float: left;\n  padding: 3px;\n}\n\nul#nav li.first a {\n  border-width: 1px;\n\
    }\n```"
