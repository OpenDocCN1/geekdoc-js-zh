  md: '# Chapter 4


    # # Drop-Shadow Effect


    One of the most-catching effects of the PGA Championship site was the nearly three-dimensional
    (3D), layered separation of content. The effect was subtle, but if you look closely
    at the home page (www.pga2004.com/) shown in Figure 4, the left column appears
    to hover above its surrounding content. This wasn''t just a visual trick, but
    an editorial purpose. The left column contained the most up-to-date Championship
    news and features. By giving a subtle (but noticeable) sense of visual lift, end-users
    could quickly discern where the freshest Championship content was published.


    The left column couldn''t seem "higher" than its neighbors, but needed to partially
    obscure content so that the space appeared to realistically float above the page.
    This was the idea behind the "Top Story" header at the top of the left column.
    Because it appeared to be connected to the left column, and provided the right
    edge for the beginning of a drop shadow down the page, it seemed to be part of
    the XHTML and sitting on top of the Flash movie. The illusion was just


    ![](img/70fa44d3a461f43c7a35cac2b893273d_184_0.png)


    Figure 4-1: The PGA Championship home page'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# The PGA Championship


    The total effect may look complex and bandwidth-intensive, but it was actually
    very light in byte size and code, and fairly straightforward to create with a
    little planning. This section examines the effect by using Photoshop, Flash, CSS,
    and XHTML, and offers an extra tip for pushing the effect to an even greater height.


    # Creating the Illusion


    Before we begin with the nuts and bolts, let''s back up for a moment and revisit
    the goal — to visually melt the Flash movie at the top of the page with the content
    below, and create the appearance that the left column is on a higher layer than
    its surrounding content by running a drop shadow down the document. It''s tricky
    if the shadow in the Flash movie or the XHTML were 1 pixel off, the effect would
    be ruined. But thanks to the precision of CSS and XHTML, it was possible.


    Flash movies, like any embedded content, are always square. It''s impossible for
    a Flash object to have an irregular shape. To "break the bounding box" and create
    the illusion of layers, part of the left column''s design was placed inside the
    bottom of the Flash movie and positioned (to the pixel) so, that the Flash and
    XHTML content were snapped together to each other, mastered the illusion.


    To start, a new document was created in Photoshop, and filled with the same color
    used by the Flash movie and the right column running down the right side of the
    page. A new layer ("bar") was created, a space width same as the left column was
    selected (using the Rectangular '' tool), and filled the area with the color of
    choice. A Drop Shadow layer was applied to "bar," and the shadow options were
    set to produce a look that wasn''t pronounced or heavy, but enough that it provided
    a subtle sense of separation.


    When completed, the document looked like Figure 4-2.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_185_0.png)


    Figure 4-2: Original Photoshop document magnified 200 percent for a closer look
    at the shadow


    Once the shadow looked alright, the visibility of the "background" layer was turned
    off and the Rectangular Tool was used to select the shadow itself (see Figure
    4-3). The shadow was copied to the clipboard (Edit< Copy Merged), a new Photoshop
    document with a transparent background was created, and the shadow was pasted
    inside. The graphic was saved as a PNG file and placed in the Flash movie (where
    a vector shape the same width and height of the "bar" from the Photoshop document
    already existed).


    161'
  merge: -1
