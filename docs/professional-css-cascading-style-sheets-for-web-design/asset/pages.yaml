    \ homepage ($bounce_url = $_SERVER['HTTP_REFERER']);\n\nSo, we successfully set\
    \ the cookie in record time and redirected the user back to our site. What happens\
    \ next? We need to set up some logic for handling the cookie we just baked. Let's\
    \ dive in and see what we can uncover.\n\n# Eating the Cookie\n\nThis second step\
    \ requires inserting some PHP code directly into our HTML—not onerous, but we\
