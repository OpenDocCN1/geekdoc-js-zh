  md: "# Chapter 2\n\nGranted, aren't too many occasions when you'll need to style\
    \ your little ems in this way (though, if it happens to be your particular slice\
    \ of heaven, we won't stand in your way). Instead, bear in mind that these selectors\
    \ can afford you a highly granular level of control over your pages' design. Should\
    \ you ever need to exempt sections of your content from otherwise global style\
    \ rules, you now possess the means to do so.\n\n# Class Selectors\n\nLooking for\
    \ even finer-grained control? Style sheets can hook into even more aspects of\
    \ your markup. Remember the class attribute used in the Harvard University makeover?\
    \ We used it to denote an \"item\" category of divs. Well, it's not just auspicious\
    \ timing that brings us to the class selector:\n\n```\ninput.text {\n  border:\
    \ lpx solid #C000;\n}\n```\n\nThis selector allows CSS to select elements whose\
    \ class attribute contains the value specified after the period (.). In this example,\
    \ the rule would select all input elements whose class attribute contains the\
    \ word \"text,\" like so:\n\n```\n<form id=\"sample\" action=\"blah.html\" method=\"\
    post\">\n<fieldset>\n  <label for=\"text-one\">Box 1:</label>\n  <input type=\"\
    text\" id=\"text-one\" size=\"15\" class=\"text\" />\n</p>\n  <label for=\"text-two\"\
    >Box 2:</label>\n  <input type=\"text\" id=\"text-two\" size=\"15\" class=\"text\"\
    \ />\n</p>\n  <input type=\"submit\" id=\"submit\" value=\"Submit!\" />\n</fieldset>\n\
    </form>\n```\n\nThe submit button at the end of our sample form is unaffected,\
    \ and the rule is applied to the two fields—classed, aptly enough, as be \"text.\"\
    \n\nIf we want our class selector to be more generic, we can simply omit the \"\
    input\" like so:\n\n```\n.text {\n  border: lpx solid #C000;\n}\n```\n\nThough\
    \ you might not recognize it, our universal selector is making an appearance here;\
    \ if we wanted, we could write this rule:\n\n```\n*.text {\n  border: lpx solid\
    \ #C000;\n}\n```\n\nBoth selectors achieve the same goal: both will select all\
    \ elements whose class attribute contains the word \"text\"."
