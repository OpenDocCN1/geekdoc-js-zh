  md: '# The Planning and Development of Your Site


    # Designer, Know Thy Goals


    There''s an implied "All of Them" at the end of this section heading because any
    project carries with it a small army of distinct (at, times, competing) goals.
    The Rational Unified Process, a software project management methodology (http://ibm.com/software/awdtools/rup/),
    establishes the goals for project by defining the Critical Success Factors, often
    referred to as CSFs. These factors are something like a laundry list that help
    you determine when the project has completed. Some sample CSFs might include:


    +   - Build-for-pay subscription newsletter service into site.

    - Increase traffic by 40 percent over 6 months.

    - Redesign home page to allow rotation of 728 x 60 banner ads above the company
    logo.


    There''s nothing especially surprising here, and it is, in fact, a modest list
    of business requirements that are key to the success of the project.


    Of course, things become complicated when we try to establish whose factors benefit
    a successful site. In other words, who are the project''s ‘stakeholders’? Who
    can benefit from the project''s successful completion? Conversely, who would be
    affected by a less-than-successful Web site?


    While a client might undertake a redesign to gain space for advertising on a site
    (and therefore so up the company''s advertising revenue), this requirement could
    conflict with users that are just trying to find a particular article buried beneath
    the ad. So, while your redesign might meet the established business with flying
    colors, the client''s users might mitigate the improper fallout.


    So, if business and users are in competition, to whom are we supposed to listen?
    As much as we''d like to, we can''t give you an answer to that question. We can''t
    treat business and user needs as an “either/or” scenario. Rather, it is our responsibility
    to perform a delicate balancing act between business and user goals, and both
    are represented in the work we ultimately produce.


    # Your Client''s Goals


    If your project is of any value to the client, it must advance the client''s business
    objectives. Frequently, our clients are outside of our own industry. Whether the
    client comes from the print industries, the automotive industry, or a small business
    looking to establish an online presence, they often have little experience with
    the how of Web design. After all, it''s what they''re talking to us for. We have
    been tasked to take their particular business requirements and realize them online.
    Of course, the lack of industry understanding works both ways. We have little
    experience with our clients'' industries as we do.


    Therefore, it''s important that both sides of the equation get to know each other.
    When gathering requirements for your project, find everything you can about the
    client, and the context in which the client operates. It''s not possible for us
    to know much about the client''s industry, business, and goals (both short and
    long-term). No question is too basic. We must find out as much as we can about
    the client''s industry, potential sales markets, marketing strategies, and competitors.
    This knowledge will help us as we plan and execute a project that will meet the
    client''s needs.


    Of course, as we''re gathering this information, we should explain our work as
    thoroughly and clearly as possible. We should tell our client a story about what
    this Web project might look like, from'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# # Chapter 1


    beginning to end. We can explain what we''re building, and what kinds of deliverables
    we will produce at different stages of the project. But more than explaining what
    we produce, we should explain why our projects are structured as we are—we can
    describe why a site map is important, or why design mockups must be finalized
    before any HTML is coded. In doing so, we can demystify the project lifecycle
    for our clients, and help them understand the sequence of events that lead them
    to a successful project.


    # ## Your Audience''s Needs


    If you were building a house for yourself, you could immediately dive into the
    planning without taking everyone''s goals into account. Because you are the only
    person who will be living in your little shack of resistance, you can take wild
    liberties with the structure, layout, and aesthetic of your house. Go on, put
    the bathroom in the middle of the kitchen—we won''t tell anyone, honest. Of course,
    if you ever have guests over dinner, then you''ll get some puzzled glances, and
    more than a couple questions about what you were thinking.


    However, when designing a Site, our needs and preferences are for last that we
    should consider. Rather, we design from others, for us. If we build a site site
    with world-class content, but the user can''t figure out how to navigate the home
    page, then we''ve failed not only ours, but in design as well. A successful, user-centered
    design can yield high traffic, a flourishing community of satisfied users; an
    unusable site will likely be inversely proportional to the size of your audience.


    Of course, unlike the guests at that ill-dated dinner party, it''s a bit more
    difficult to figure out what your users want. As a result, it''s easy to leave
    out the entry criteria when we make things for our sites. Inside, discuss our
    pages as a collection of features, areas of functionality, or disparate areas
    of content. That can easily be a rather cold way of assessing your—and you can
    bet that your users will give you the cold shoulder, hurrying off to find a site
    that helps them achieve their goals, rather than hindering them.


    # ## Creating Personas: Putting a Face to Your Audience


    So, how do we make a site usable when we''ve never met one of our users? Virtual
    users are often invisible to us. So, instead of thinking of them as faceless mass
    of sufferers clicking through each page of our site, we can create personas (or
    user profiles) that give us a face. Personas are model users who can help you
    understand the needs, behavior, and goals of your users. In creating these fictitious
    profiles, you can better understand and anticipate the patterns of the people
    who will actually use your site.


    Figure 1-1 shows a sample persona.


    While Frank is a fabricated user, his usefulness derives from the fact that he
    is strategically fictitious: his biography, aspirations, and professional goals
    are all drawn from trends sampled from your site''s users. By doing so, a persona
    becomes a valuable guide for the planning, design, and development process. It
    allows you to put a face to the otherwise faceless people who will be visiting
    your site, and avoid the pitfall of basing design decisions on technical or personal
