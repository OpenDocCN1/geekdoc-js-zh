  md: '# # The Planning and Development of Your Site


    or its requirements, may at least present an idea of how to move forward. However
    you decide to perform this ever-delicate balancing act between client and user
    requirements, which keeps the goals of the page at the forefront of your mind.
    Build a clear, usable interface, and the rest will fall into place.


    Sounds almost empty, doesn''t it?


    Jason Santa Maria''s "Box Methodology" (www.jsasonsantaria.com/archive/2004/05/24/grey_box_method.php)
    describes one graphic designer''s approach to planning a design. His approach
    is a compelling read, and tackles the challenge of designing a page''s architecture
    from a slightly different perspective. Whereas we took stock of the page''s content
    before considering the layout, Santa Maria takes a more visual approach. The two
    methods achieve the same goals, however—both force the designer to think in terms
    of how the layout helps the user before planning the aesthetic details of a design.


    # ## Beginning the Design


    So, the plan has been finished, the map has been approved, "interface," and the
    wireframes are set. We can finally settle all of this theoretical nonsense about
    "requirements," and "change management," and stop worrying about "notes" in "meetings"
    with "stakeholders." At long last, we will finally get into actually designing
    our site ... can''t we?


    As much as we''d like to tell you otherwise, the actual construction of a site
    requires less planning than the rest of the project. Sitting down to design and
    build a site is absolutely one of the most rewarding parts of web project. But
    that''s true. This is the phase of the project in which all of your careful planning
    and analysis pay off. That''s not to say that imposing a process on the design
    should remove any of the fun from it. Rather, some of the most compelling web
    designs are a result of the constraints placed upon them.


    That''s not to say there aren''t many talented designers who can create a stunning
    site with little or no direction. However, it''s another challenge altogether
    to create a design that simultaneously enhances a company''s brand, ensures that
    the site is super user-friendly, and aesthetically appealing. From these competing
    methods, the true beauty of web originates.


    # ## Setting the Tone for Your Site


    With a firm understanding of the scope of our project, we can then craft a design
    that speaks to the needs of both groups. In order to do so, we should establish
    the tone of our site. After all, we might settle on a different design direction
    for a small firm than we might for an online publication. Each company will have
    its own target audience, its own brand identity, and its own business requirements.
    As, an understanding of what those goals are to building a site that achieves
    them. Let''s take a brief look at one site that exemplifies this attention to
    goal-driven design:


    Cinnam Interactive (www.cinnam.nl/).


    In the early days of design, many style sheet-designs were doomed to "look like
    standards"—their layouts were basic, their palettes flat, and they were made for
    a compelling case for abandoning table-driven design techniques. Cinnam Interactive
    was one of the earliest sites to show the true power of CSS as a tool for bringing
    gorgeous designs to the web. Launched in January 2003, it featured an incredibly
    nuanced design (see Figure 1-8). The site is layered typography, beautiful use
    of color, and well-implemented enhancements are facilitated by CSS and valid XHTML,
    which ensures that the site is impressive under the hood as it is above it.'
  merge: -1
