    # Font Sizing


    Even though CSS provides greater control over the typography in a Web design,
    determining the best way to set the font sizes is not an easy thing to do. For
    designers who love typography (like myself), it''s hard not to have browsers running
    the fonts in our designs personally.


    Let''s look at some of the common problems with Web typography:


    +   - Fonts set in the value of pixels (for example, font-size: 12px;) are not
    resizable in Internet Explorer for Windows.

    - Using the value of font-size keywords isn''t an option without a workaround
    because Internet Explorer for Windows 4/5.5 sets the value of a keyword to the
    lower value. For example, a value of x-small is translated as xx-small.

    - Even with an Internet Explorer for Windows workaround (set to deliver the appropriate
    keyword values), designers wanting more control over the fonts than seven keyword
    sizes at a loss.


    332'
  merge: -1
  pgno: 356
- img_proc: true
  md: "# Bringing It All Together\n\nWithout further losing our sanity, an ingenious\
    \ method to gain greater control over Web typography comes from the clever Richard\
    \ Butter’s excellent tutorial, “How to Size Text Using Ems” (see www.clagnut.com/blog/348).\n\
    \nButter’s solution is to first set the value of the font-size in the body to\
    \ a value of 62.5%\n\n```\nbody {\n  text-align: center;\n  font-size: 62.5%;\n\
    }\n```\n\nThe rationale for this step is that current browsers apply the value\
    \ of 16 pixels to the value of the medium keyword, which is the default size for\
    \ HTML text. By setting the font-size for the body to 62.5%, that translates to\
    \ a very manageable 10 pixels for the math-challenged:\n\n```\n16px * 62.5% =\
    \ 10px\n```\n\nWith the base value of 10 pixels set, I adjust the size of the\
    \ text elsewhere in the document using only units. (One em is equal to the default\
    \ size of the nearest font.)\n\nFor example, if I want a portion of text to be\
    \ 12 pixels, I set the value of the font-size property to 1.2em.\n\n```\n16px\
    \ * 62.5% * 1.2em = 12px\n```\n\nIf I wanted to set the value of the larger 25\
    \ pixels, what would the em value be?\n\n```\n16px * 62.5% * x = 25px\n10px *\
    \ x = 25px\nx = 25/10px\nx = 2.5em\n```\n\nThere are few curiosities with this\
    \ solution that should be addressed. (You know there was going to be a catch,\
    \ right?) This after all\n\n+   - The font-size property values for input, select,\
    \ th, and td elements must be set to their appropriate size:\n\n```\ninput, select,\
    \ td {\n  font-size: 1em;\n}\n```\n\n+   - In browsers with the Gecko rendering\
    \ engine (Mozilla and Firefox, to name two), the values in this method are set\
    \ to the font-size of 12 pixels. To get a uniform size of the headers in Gecko\
    \ and non-Gecko browsers, spell out the font sizes for the headings.\n\n```\n\
    h1 {\n  font-size: 2.5em;\n}\nh2 {\n  font-size: 2em;\n}\nh3 {\n```\n\n333"
  merge: -1
  pgno: 357
- img_proc: true
  md: "```\nfont-size: 1.75em;\n}\nh4 {\nfont-size: 1.5em;\n}\nh5 {\nfont-size: 1.25em;\n\
    }\nh6 {\nfont-size: 1em;\n}\n```\n\nWhen nesting elements like list items, the\
    \ sizes of fonts are going to be sized smaller and smaller. If the font size for\
    \ a list item is .8em to get a value of 8 pixels, a value of a nested item within\
    \ that list will have a value of 6.4 pixels! Let's take a look at some examples\
    \ and math:\n\n```\n<ul>\n<li>The Parent List Item: 10px * 8px\n  <ul>\n  <li>The\
    \ Child List Item: 8px * 8em = 6.4px!</li>\n  </ul>\n</li>\n</ul>\n```\n\nTo work\
    \ around the problem, set the value of nested list items to 1em:\nli li {\nfont-size:\
    \ 1em;\n}\n\nOther than that, it's easy. Okay, it's not exactly a walk in a park\
    \ compared to using font-size keywords, but do you remember the talk about Web\
    \ typography being tortuous? So, keeping an eye on the placement of HTML elements\
    \ isn't difficult a trade-off when there is more control over the Web typography.\n\
    \nWith our solution decided, and the framing of the Web page (as shown in Listing\
    \ 9-1), it's time to start using the content from the top to the bottom starting\
    \ with the header.\n\n# Listing 9-1: The Main CSS Rules for the Page Design\n\n\
    ```\nbody {\ntext-align: center;\nfont-size: 62.5%;\nfont-family: Verdana, Helvetica,\
    \ Arial, sans-serif;\n}\n#frame {\nwidth: 800px;\nmargin: 0;\ntext-align: left;\n\
    }\ninput, select, th, td {\nfont-size: 1em;\n}\n```"
