    # The Mechanics: How It’s Supposed to Work


    Thus far, we’ve associated two separate CSS files with one document. Currently,
    they’re both being read and applied to the document with equal quality, with the
    rules of specificity resolving any conflicts that may arise between the two. However,
    to accommodate more complex scenarios we currently have, the HTML and CSS specifications
    outline structured guidelines for how multiple styles interact. Web page authors
    are given a number of ways to prioritize the styles we include via the link element.
    Let’s examine the different classes of style sheets (no pun intended), and see
    how they affect our switching scenario.


    # Persistent Style Sheets


    Persistent style sheets are always enabled. Think of them as “turned on” by default.
    The persistent CSS file will be applied in addition to any other style sheets
    that are currently active, and acts as a set of style rules that every style sheet
    in the document can draw upon.


