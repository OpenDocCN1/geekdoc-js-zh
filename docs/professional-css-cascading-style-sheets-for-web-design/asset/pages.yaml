  md: '# ESPN.com: Powerful Layout Changes


    Importance-based design has been evident in newspapers for centuries, and through
    the magic of CSS-P, it''s available on ESPN.com as well.


    +   Q: How long had the idea for using standards-based design in your mind before
    it got the green light?


    +   A: About a year. We tend to plan our redesigns about a year out, so we got
    to thinking about this around the middle of 2002. One major complicating factor
    was ESPN.com had been run out of Seattle (where I lived for its entire life, but
    the decision was to relocate it to the ESPN headquarters in Bristol, Connecticut,
    in the middle of 2003. So pretty started the redesign in Seattle and then ended
    it all the way across the country in Bristol. This moving movers, employees, code,
    production facilities, and just about everything else. I was a West guy, so I
    elected to stay in Seattle and continue employment with ESPN''s parent company,
    Disney, but a bit of staff ending up relocated. We still held on a lot of ESPN-related
    projects from the Seattle office, but it''s not a 100 percent time commitment


    +   Q: How much internal marketing did you have to convince, your own team, and
    second, your your bosses of your plan?


    +   A: There was no internal marketing within the team either that it was the
    right thing to do, and honestly, there was very little convincing of the higher-ups
    necessary. The technology teams are paid to know what best best for a technology
    standpoint. As long as a move to standards-based design did not represent any
    extra costs or sacrifices in features, then ESPN had no reason not to support
    it.


    In fact, this actually reduced our costs by a bit and let us do more with the
    site, so it wasn''t really a tough argument to make. Executives might not care
    what a div or a spacer is, but they certainly care about bandwidth bills and inventory.


    +   Q: Did you try starting a sub-site of ESPN.com? Or did you leap straight in
    the deep end and swing the high-front page over? Regardless of answer, can you
    explain your reasoning?


    +   A: ESPN.com is so enormous that you could never redesign the whole thing in
    one fell swoop and then flip a switch when you were ready. Everyone wants to do
    that, but it''s not possible, given the tens of templates implemented.


    We generally start with the front page, move on to the section pages, and then
    the story pages. I suppose it doesn''t matter too much which order this is in,
    but the speed of all pages can eventually be converted important. We wanted to
    extend with an example of our tracked fastest that all other pages could be molded.


    +   Q: Would you have done anything different, looking back?


    +   A: Well, I dont have veto power over every bit of the design/production process,
    obviously, not every decision was mine, but I think we got most of the things
    right. The one thing I guess that deappoint me is a bit how tricky things get
    with time. Every time a major redesign (not just ours), code quality goes down
    gradually until the next redesign. This for many reasons:


    +   - New people working on the site.


    +   - Changing business needs require modified layouts.


    +   - Advertising and sponsorship deals require less agility in layouts and more
    flexibility to put stuff wherever.


    +   - Third-party tracking, survey, and code finds its way into the system.


    +   - Documentation doesn''t stay current.


    +   - New features need to be shoehorned in.'
