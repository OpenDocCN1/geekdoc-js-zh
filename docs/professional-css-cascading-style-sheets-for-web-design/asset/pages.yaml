  md: '# Stuff and Nonsense: Strategies for CSS Switching


    As you can see, a little too much of our design is showing when it''s printed,
    but not to be particularly effective. Gone are the page''s background color and
    graphic, which printers won''t render by default. Additionally, the rules that
    govern the page''s layout are still fully intact. Our content appears to have
    been pushed down the page for no good. The white space at the top doesn''t serve
    any purpose, and the small sans-serif font we''ve settled on for the body copy
    might be fine on-screen (when the user can increase the size of the text as he
    or she feels), but it''s less ideal for paper. Serif fonts are generally used
    to improve legibility when reading a page, and a few points smaller than our current
    type size might not hurt. In fact, unless you''re Emily Dickinson, this printed
    version isn''t exactly appealing.


    So, ultimately we should create a design for the printed version of our page—one
    that emphasizes size over utility, without sacrificing aesthetics altogether.
    This would require no small amount of overhead on our part. The design of separate,
    "print-only" versions of pages still largely in our memory. Keeping these "design-light"
    pages in sync with their "design-full" counterparts would be an incredibly time-resource-consuming
    affair that often required complicated spreadsheets, grueling of manual editing,
    and occasionally more than a late-night swearing at the monitor (not that the
    pain is still fresh in our minds or anything).


    # Media Types: The Healing Being


    The authors of the CSS specification anticipated this problem. They introduced
    the notion of media types, a means of classifying styles to help different devices
    such as printers, computer monitors, screen readers, handheld Internet-ready devices,
    and the like. By simply earmarking our three links as containing "screen-specific
    designs that should be delivered only to graphic browsers (such as IE or Firefox),
    we avoid some of the unpleasantness we saw earlier. To do so, we specify a value
    of "screen" in the link''s media attribute:


    ```

    <link rel="stylesheet" href="main.css" type="text/css" media="screen" />

    <link rel="alternate stylesheet" title="Higher Contrast" href="contrast.css" type="text/css"
    media="screen" />

    <link rel="alternate stylesheet" title="Gratuitous CSS" href="hot.css" type="text/css"
    media="screen" />

    ```


    Now, when we preview our document in its printed view, Figure 8-9 shows us that
    things look like a bit different.


    It might not look like it, but this is, in fact, by adding the media="screen"
    attribute to our links, we''ve wedded our designs to one context—the browser and
    divorced from all others. So, when viewing a document in a different media type
    (such as a printer), we''re shown the raw, unsalted content.


    > We can also specify multiple media types for any given link element. For example,
    the Opera browser (www.opera.com/) respects the "projection" media type when browsing
    in its full-screen viewing mode. As a result, it disregards any CSS we reserve
    exclusively for the "screen" media. If we want to use our screen-specific stylesheet
    in a projection environment, we can simply add it to the media attribute with
    a comma: <link rel="stylesheet" href="main.css" type="text/css" media="screen,
    projection" />.'
