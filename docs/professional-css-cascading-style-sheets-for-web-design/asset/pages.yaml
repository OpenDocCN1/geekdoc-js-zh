  md: '# Where Else Is This Applicable?


    The short answer to the question "Where else is this technique applicable" is
    "Virtually everywhere!" Every time you insert a class or id, you should be asking
    yourself, "Is this the most efficient place for this, or can I move it higher
    up the document tree? Can I apply it to this element''s parent? How do I get the
    maximum benefit from this?


    If another real-life example will help clarify this idea, take a look at the following
    markup. (Figure 6-12 shows the result.) It''s a simple set of navigation links,
    presented as an unordered list. The class of nav has been applied to each of the
    four links, and a CSS rule written to style them. The markup is valid, and the
    CSS works just fine, but is it the best way to approach the problem?


    ![](img/70fa44d3a461f43c7a35cac2b893273d_244_0.png)'
