  md: '# Chapter 3


    Almost every page on blogger.com contains a “main” div <div id="main">, which
    sits inside the body div and holds the main content of the page, as shown in Figure
    3-54.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_146_0.png)


    Figure 3-54: <div id="main">


    This main div can be presented on its own (as in Figure 3-54), taking up all the
    available width, or it can be narrowed and displayed in conjunction with a “sidebar”
    div <div id="sidebar">, which can appear on the left or on the right of the page,
