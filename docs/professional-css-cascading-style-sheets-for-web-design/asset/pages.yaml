  md: '# ESPNN.com: Powerful Layout Changes


    ![](img/70fa44d3a461f43c7a35cac2b893273d_243_0.png)


    Figure 6-9: The story in Regular mode


    Okay, we have a subtle (but significant) change. The story, which our editors
    have decided is very important, has grown in visual stature. It now takes up more
    width on the page, and the headline font size has increased.


    So, let''s see what happens when we swap to War layout (<body id="war">), as shown
    in Figure 6-11.


    This is a big change. The headline, now deemed to be very important, has taken
    over the entire section of the layout. Its font size has increased yet again,
    and it now dominates the whole page, which is exactly what the War layout is all
    about— pushing the big story into people''s faces, giving it some oomp, letting
    the public know "This is an important story!"


    The excellent thing about this demo is how amazingly easy it was to do. All we
    did write a few additional styles and switch the id of the body element around;
    it really couldn''t be simpler. But basic as it was, it''s essentially what ESPN
    is doing to alter its homepage so dramatically—providing a huge return on a very
    small amount of work.


    219'
