  md: "# Best Practices for XHTML and CSS\n\nThis is much better. As this example\
    \ shows, we can style multiple properties of our h1 elements in one rule. This\
    \ enables us to keep our style sheets clutter-free, and the cost of managing them\
    \ way down. After all, brevity is the soul of style.\n\nWhen writing a rule with\
    \ multiple declarations, the semicolon is technically considered a delimiter —\
    \ something to separate the end of one declaration with the start of another.\
    \ As such, it's perfectly valid for you to omit the semicolon from the final rule\
    \ in a style block because there isn't any subsequent declaration. For consistency's\
    \ sake, we recommend ending every declaration with a semicolon. That, if you want\
    \ to change a declaration's position in a rule, or globally edit a property's\
    \ value, you won't need to worry about or not a semicolon is actually present.\n\
    \n# Grouping\n\nBut if we want to apply the style of our h1 rule to other elements\
    \ in our document? If we wanted all h2 and h3 elements the same style as our h1,\
    \ we could, of course, be explicit about it:\n\n```\nh1 {\n  color: #36C;\n  font-weight:\
    \ normal;\n  letter-spacing: .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n\
    }\nh2 {\n  color: #36C;\n  font-weight: normal;\n  letter-spacing: .4em;\n  margin-bottom:\
    \ 1em;\n  text-transform: lowercase;\n}\nh3 {\n  color: #36C;\n  font-weight:\
    \ normal;\n  letter-spacing: .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n\
    }\n```\n\nNo amount of code, you say? You are right. But again, the specification\
    \ has provided us with another way to keep our CSS lean and bandwidth-friendly.\
    \ Namely, when several rules share the same declarations, the selectors can be\
    \ “grouped” into one comma-delimited list. For example, we can write three header\
    \ rules into one all-encompassing rule.\n\n```\nh1, h2, h3 {\n  color: #36C;\n\
    \  font-weight: normal;\n  letter-spacing: .4em;\n  margin-bottom: 1em;\n  text-transform:\
    \ lowercase;\n}\n```\n\nThe order of the list is irrelevant. All the elements\
    \ in the selector will have the corresponding declarations applied to them."
  merge: -1
