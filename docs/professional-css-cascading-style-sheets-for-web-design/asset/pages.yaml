  md: "# Chapter 2\n\nWhile inheritance is perhaps the most powerful aspect of CSS,\
    \ it can at times also be one of the more confusing. Keep in mind that not all\
    \ properties are inherited. Margin and padding are two such examples. Those properties\
    \ are applied solely to an element, and are not inherited by its descendants.\n\
    \nFor a reference of what properties are passed down to element's descendants,\
    \ you're served by the specification itself (www.w3.org/TR/CSS21/about.html#property-defs).\n\
    \n# Overriding Inheritance\n\nIf we don't want a specific section of our document\
    \ to inherit some of its ancestors' traits Consider the following example:\n\n\
    ```\n<body>\n<p>I still like big blocks.</p>\n<ul>\n<li>..but lists are even cooler.</li>\n\
    </ul>\n</body>\n```\n\nIf the CSS rule for the body element were applied here,\
    \ then all of the text within the p and l would inherit the values declared therein.\
    \ When your client winds in and demands that list items should be in a red (with\
    \ his/her's favorite color) sans-serif typeface? Simply write a rule to select\
    \ the descendant elements you're wanted, like:\n\n```\nbody {\n  color: #000;\n\
    \  font-family: Georgia, \"Times New Roman\", serif;\n  font-size: 10px;\n}\n\
    li {\n  color: #C00;\n  font-family: Verdana, sans-serif;\n}\n```\n\nThis is our\
    \ first example of how the cascading style sheets\" works. Because the list items\
    \ are descendants of the body element, the second rule effectively breaks the\
    \ chain of inheritance, and applies the declared styles to the selected elements—here,\
    \ the li. However, because we've declared a new font size for the list items,\
    \ they'll inherit that property's value (10px) from their ancestor, the body.\
    \ The end result is that your users will see the list items in the requested red,\
    \ sans-serif font, while all other elements on the page will inherit the rules\
    \ from the body. Let's hope you, your client are happy with the result.\n\n# Putting\
    \ All It into Action\n\nLet's take another look at an example of some overworked\
    \ markup. Consider the rather bare-bones navigation bar shown in Figure 2-10."
