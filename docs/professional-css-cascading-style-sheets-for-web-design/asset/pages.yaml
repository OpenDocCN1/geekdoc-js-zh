  md: "# Chapter 9\n\nThe next step is to adjust the width and colors of the input\
    \ and submit buttons, respectively, as shown in Figure 9-16.\n\n```\nfieldset#search\
    \ form input[type=\"text\"] {\n  width: 152px;\n}\n```\n\n```\nfieldset#search\
    \ form input[type=\"submit\"] {\n  background-color: #FFFF00;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_362_0.png)\n\
    \nIf you notice, I'm using attribute selectors as mentioned in detail in Chapters\
    \ 2 and 6. This selector currently works in Netscape 6+ and Opera 5+ only. Also,\
    \ browsers such as Safari use their own GUI elements for the buttons, so styling\
    \ them is out of the question.\n\nA way around the problem of attribute selector\
    \ support is to change class selectors. Adding class attributes to both of the\
    \ input elements changes the markup:\n\n```\n<input type=\"submit\" value=\"search\"\
    \ class=\"submit\" />\n<input type=\"text\" name=\"q\" class=\"text\" />\n```\n\
    \nThen, all that is required is modifying the attribute selectors to class selectors\
    \ like:\n\n```\nfieldset#search form input.text {\n  width: 152px;\n}\n```\n\n\
    ```\nfieldset#search form input.submit {\n  background-color: #FFFF00;\n}\n```\n\
    \nPersonally, I prefer to leave the attribute selectors in place. To borrow some\
    \ language from the movie Office Space, \"It’s the browser that sucks, why do\
    \ I have to change?” But then, that's not a positive attitude, so I should not\
    \ digress and just move on."
