  md: '# Chapter 6


    It''s an inescapable aspect of running a revenue-driven media site like ESPN,
    and we are just thankful for the opportunity every two to three years to assess
    what has changed, what''s needed for the future, and what slice clean. With each,
    things get exponentially better.


    **Q:** Has this success given you the appetite and the political power to convert
    ESPN''s on-line properties to standards-based designs?


    **A:** Absolutely. Our group has been intimately involved in the standards-based
    redesigns of ABCNews.com, Disney.com, Disneymeetings.com, Wideworldsports.com,
    and other properties as well. ESPN is a technology leader within our company and
    where we do, other vertical metrics tend to follow.


    **Q:** And finally, do you envision your competitors'' making similar changes
    in the near future, or do you think your site will remain unique within your industry
    for some time to?


    **A:** You know how? When Eric Meyer interviewed me after the ESPN redesign two
    years ago, I told him that I fully expected our competitors to be behind us in
    the push toward Standards. Unfortunately, that hasn''t happened. When you name
    names, if you look at ESPN''s major competitors in the sports media space and
    ABCNews''s competitors in the mainstream media space, not a single one that has
    dropped table-based design yet. Some of these companies have gone through two
    redesigns in the last two years, including as recently January 2005, and still
    use the same coding standards. I am not blaming any particular group since there
    are so many moving parts in most of these organizations, but it would be nice
    to see more of it. Web sites are the sole property of their owners who have the
    right to do with them as they please. Eventually, everyone will come around. In
    the meantime, we''ll just keep moving ahead.


    # Importance-Based Design


    One of the nicest about ESPN.com''s new design is that there exists a mechanism
    for editors to reform the site in reaction to the importance of the news being
    presented. Mike Davidson refers to this per-article formatting as "importance-based
    design." To clarify the need for this, consider one of his responses in the previous
    interview:


    We have three major publishing modes for our front page, depending on how big
    a certain news event is, and users appreciate the importance-based design we give.
    Why we show an 18-point flat black headline for a regular season NBA game and
    the same treatment for when the Red Sox win their first World Series in a million
    years? Importance-based design has been evident in newspapers for centuries, and
    through the magic of CSS-P, it is available on ESPN.com.


    As Davidson says, this sort of thing has been around in newspapers for a long
    time. Following are two examples from the sections of The Daily Telegraph (British''s
