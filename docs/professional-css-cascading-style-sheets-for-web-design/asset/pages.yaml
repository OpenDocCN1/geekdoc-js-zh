  md: '# Chapter 6


    | Selector Syntax | Result | Selector Type |

    | --- | --- | --- |

    | E:only-of-type | Matches an E element, sibling of its type. | Structural pseudo-class
    |

    | E:target | Matches an E element that is the target of the referring URL. | User
    action pseudo-class |

    | E:lang(foo) | Matches an E element in language foo. | :lang() pseudo-class |

    | E:enabled or disabled | Matches a user interface E that is enabled or disabled.
    | UI element pseudo-class |

    | E:checked or E:intermediate | Matches a user interface E that is checked or
    in an intermediate state (like a checkbox or radio button). | UI state pseudo-class
    |

    | E:contains("foo") | Matches an E element containing the substring in its textual
    contents. | Content pseudo-class |

    | E:first-line | Matches the first formatted line of an E element. | :first-line
    pseudo-class |

    | E:first-letter | Matches the first formatted letter of an E element. | :first-letter
    pseudo-class |

    | E:selection | Matches the portion of an E that is currently selected by the
    user. | UI element fragments pseudo-elements |

    | E::before | Matches generated content before an E element. | :before-pseudo-element
    |

    | E:after | Matches generated content after an E element. | :after-pseudo-element
    |

    | E:not(s) | Matches an E element that does not match selector s. | Negation pseudo-class
    |

    | E + F | Matches an F element immediately preceded by an E element. | Direct
    adjacent combinator |

    | E ~ F | Matches an F element preceded by an E element. | Indirect adjacent combinator
    |


    Seem a confusing? Well, the next section shows a few examples of those selectors
    in action along with a description and examples of the elements they would select.


    # Examples of Exciting Selectors in Action


    The examples in this section show how these CSS selectors might be put to use
    on real HTML markup. The examples aren''t exhaustive, but for each instance, consider
    how you would achieve the same effect using today''s techniques. Most of the time
    the answer will be the liberal addition of classes and IDs to the HTML, but in
    many cases the answer is that it''s impossible to re-create this functionality
    today.


    Once you''ve done that, run through the selectors again and consider how you would
    duplicate the effects if you don''t have access to the HTML and couldn''t insert
    classes and IDs all over the place. In each and every case, short of using JavaScript,
    the answer will be that you can''t. That''s how a big tomorrow brings.


    226'
