  md: '# Chapter 2


    you to read, by your users as well. Remember our text-only screenshot from before
    (refer to Figure 2-3)? If someone has styles turned off, using generic markup
    will make it difficult for those in a non-environmental to understand the context
    of your content.


    # Toward Well-Meaning Markup


    Alternatively, we can use markup elements as they were intended—using divs and
    spans to fill in the gaps where no other elements are available. In this section,
    we''ll discuss strategies for stripping your pages markup to a well-structured,
    well-meaning markup, getting it (and you) ready for the CSS tips and strategies
    contended throughout the remainder of this book.


    In the following sections, we''ll revisit some of the HTML used in the Harvard
    Web (refer to Figure 2-1). We''ll apply some well-structured markup to the old-school
    markup, and see if we can produce something bit sleeker.


    # Familiarize Yourself with Other Markup Elements


    Here, we''re in the process of describing content, not designing it. As such,
    the more well versed you are with the XHTML markup, the more adept you become
    at accurately your site''s structure with it.


    # Headers


    Let''s look at the markup for one of the news items in the right-hand column of
    the Harvard Web site:


    ```

    <code>Illuminating the beauty of life''</code><br>Yannatos starts 4st year courting
    Harvard-Radcliffe Orchestra<a href="http://www.news.harvard.edu/gazette/2004/10.21-yannatos.html"><font
    size="-1"&gt;More&lt;/font&gt><font size="-1"&gt;br></td<td width="120

    ```


    In this news item, the content leads with a header displaying the story of featured
    story. You wouldn''t know it was a header from the markup:


    ```

    <code>Illuminating the beauty of life''</code>

    ```


    Rather than using markup to describe how the example should look to sighted users
    on desktop browsers, why not use a header element?


    ```

    <h4>Reversing Saddam''s ecocide of Iraqi marshes</h4>

    ```


    Here we''ve used an h4, which would be appropriate if there are three levels of
    headers above this in the document''s hierarchy. Now, any user agent reading this
    page will recognize the text as a header, and render it in the most effective
    way it can.


    When building your well-meaning markup, it''s helpful to think of your document
    as conforming to a kind of outline—the most important headers at the top in h1,
    beneath it are a number of h2s, beneath each of which is an h3 or two, and so
    down to h6. How you envision your document''s outline is entirely up to you. Settle
    upon a model that makes sense to you, and keep it consistent throughout your site''s
    markup.


    42'
