  md: '# Establish the Scope


    If we were asked to build a house, there are few questions we''d want answered
    before agreeing to do it. How large will the house be? What kind of budget is
    allocated for this project? All of these questions are meant to establish the
    scope of the construction project. It''s a means of gathering information about
    the project, so that you can better understand exactly how the project is, how
    much it will cost—all items that are integral to any formal contract.


    If you can''t tell, our construction metaphors aren''t exactly our strongest point.
    But while we might have sneezing through those episodes of This Old House, the
    parallels to the start of a project are uncanny. Before firing up Photoshop orsling
    one line of code, you and your client should work to produce a well-reasoned scope
    statement. This aptly named document not only determines what will be performed
    throughout the duration of the project, but also implies defines what is outside
    the scope of the project. This is an important point. When the deadlines are tight
    and the expectations high, knowing exactly what is expected of you throughout
    the course of the project will keep your budget in check, and both you and your
    client focused.


    Most frequently, the scope statement contains the following information:


    +   **Strategy.** This contains some information about the goals and business
    needs behind the project. Is the site you''re designing to increase advertising
    revenue, or show readership numbers? Is the project supposed to increase a site''s
    accessibility, or its search engine ranking?


    +   **Deliverables.** These are the products that will be created over the course
    of the project. If your project involves some level of site planning, you will
    be building a site map, or providing frames? When the project is finished, will
    you provide the client with the Photoshop files used in your designs?


    +   **Assumptions.** This is all of the conditions and constraints that were used
    to establish the scope and upon which all other timelines and goals are founded.
    Should any of these assumptions change, the scope of the project should be revised
    accordingly. For example, if client meetings encounter only 30 pages on the site
    that needs to be built, the landscape (and your estimated budget) can change drastically
    when the client informs you two weeks into the project that it has 300 pages that
    you would like to redesign.


    +   **Scope management.** No matter how extensively you document your assumptions
    and timelines, some will inevitably vary changes during the course of your project.
    Whether it''s Murphy''s law or karma, it doesn''t matter—you and your client need
    to agree upon some process for handling it. Some developers will write a detailed
    document detailing how changes are managed, and how the client approves the resulting
    changes in schedule and budget.


    This isn''t an exhaustive list, nor should it be seen as definitive. As we''ll
    no doubt have throughout the remainder of this book, each project has its own
    needs, its own goals. Because of this, each scope statement will be tailored to
    reflect this.


    However, it is important to remember that it is the project scope that forms the
    basis for whatever contract you and your client establishes. Because of this,
    the gathering of the requirements should be a highly collaborative process. You
    and your client should work closely to figure out exactly what information should
    go into the scope statement. Otherwise, if you and your client having differing
    expectations as to what falls under the auspices of the project scope, then problems
    may arise as deadlines'
