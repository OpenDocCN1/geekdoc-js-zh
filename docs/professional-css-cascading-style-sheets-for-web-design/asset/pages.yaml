  md: "# Chapter 6\n\nWe hope you've spotted adding class=\"nav\" to all four anchors\
    \ is not the most efficient thing to do. A much better approach would be to move\
    \ the class application point out the document tree to the enclosing ul, and then\
    \ alter the CSS to reflect the change (see Figure 6-13):\n\n```\nul nav li (background-color:\
    \ yellow);\n\n<ul class=\"nav\">\n  <li><a href=\"/\">Home</a></li>\n  <li><a\
    \ href=\"/archive/\">Archive</a>\\</li>\n  <li><a href=\"/about/\">About</a>/</li>\n\
    \  <li><a href=\"/contact/\">Contact</a>/</li>\n</ul>\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_246_0.png)\n\
    \n**Figure 6-13: Links still yellow**\n\nThe end result is still the same, but\
    \ the second method has several advantages over the first. First, our HTML file\
    \ will be smaller, and will download faster. Second, our markup is less cluttered\
    \ and is easier to understand and edit. Third, by applying the class to the ul,\
    \ we are able to style not only the anchors (a) but also the list-items (i) and\
    \ ul itself (see Figure 6-14):\n\n```\nul.nav (background-color: blue);\nul nav\
    \ li (background-color: pink);\nul li a (background-color: yellow);\n\n<ul class=\"\
    nav\">\n  <li><a href=\"/\">Home</a>/</li>\n  <li><a href=\"/archive/\">Archive</a>/</li>\n\
    \  <li><a href=\"/about/\">About</a>/</li>\n  <li><a href=\"/contact/\">Contact</a>/</li>\n\
    </ul>\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_246_1.png)\n\n**Figure\
    \ 6-14: Links, list-items, and the unordered-list, and all styled**\n\nOnce again,\
    \ we see a (relatively) large return for a small initial amount of work.\n\nNow,\
    \ you might scoff at this little demo and say that the difference between the\
    \ two sets of code is minimal. But if you extrapolate these ideas out to a site\
    \ that contains more than 100,000 pages (as ESPN.com does), you'll have some idea\
    \ of the savings to be made."
