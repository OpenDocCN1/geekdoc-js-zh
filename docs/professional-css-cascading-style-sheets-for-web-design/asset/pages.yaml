  md: "# Chapter 7\n\nThankfully, a quick search yields some information about a known\
    \ IE/Win bug. When dealing with a box without stated dimension (as we are with\
    \ the container div), IE/Win has some trouble initially drawing the box in such\
    \ a way to sufficiently contain its elements. To work around the issue, we must\
    \ tell IE/Win: \"Yes, the box does have a stated dimension—and if it's not too\
    \ much, we'd like it to draw it properly.\"\n\nTo end, an IE-specific workaround\
    \ around The Holly Hack (http://positioniversething.net/articles/holly.hack) comes\
    \ to the rescue:\n\n```\n* hide from Mac IE 5 \\\n* #container {\n  height: 1%;\n\
    }\n* END hide from Mac IE 5 \\*\n```\n\nNamed after its creator, Holly Berge,\
    \ the Holly Hack is in fact two hacks in one. The backlash at the end of the first\
    \ comment is a hack that causes IE/Mac to ignore everything up to the second closing\
    \ line. The selector for the body uses a universal selector (*), followed by html,\
    \ which is then followed by a selector for the problematic element—here, the container\
    \ div. As it turns out, browsers on both the Windows and Macintosh operating systems\
    \ recognize an invisible element wrapped around the <html> element. As known as\
    \ the Star HTML Hack, the use of the universal selector before the html selector\
    \ will work only in IE browsers. Because, IE/Mac isn't affected by this particular\
    \ layout, we use comment in the line to hide it from the rule.\n\nWith a height\
    \ of 1 percent all, let's see how our layout looks now (see Figure 7-24).\n\n\
    ![](img/70fa44d3a461f43c7a35cac2b893273d_296_0.png)\n\nFigure 7-24: one quick\
    \ hack later, and we're cooking with gas once more."
  merge: -1
  pgno: 296
- img_proc: true
  md: "# FastCompany.com: Building a Flexible Three-Column Layout\n\nOur 1 percent\
    \ height rule managed to kickstart IE's buggy rendering engine. By supplying it\
    \ with an initial (microscopic) height for the container block, IE knows to expand\
    \ that block to store descendants (which, honestly, it should anyway—but let's\
    \ not wait for browser to make our lives easier).\n\nAfter this bout of debugging,\
    \ we've determined that our three-column framework is holding up admirably in\
    \ all the browsers we've tested. However, what we've built so far is missing one\
    \ crucial component. Let's turn to round out our imputation of the FastCompany.com\
    \ layout, and put this three-column layout to bed.\n\n# Setting Some Boundaries:\
    \ The max-width Property\n\nThe final piece of the Fast Company puzzle is the\
    \ flexible nature of the design. Currently, our layout expands to fill the entire\
    \ width of the browser window, no matter how small (or wide) it may be. At larger\
    \ window sizes, the lines of text in our fluid design can become almost unmanageably\
    \ long, making it difficult to read. To mitigate this issue, Dan Cederholm and\
    \ the Fast Company Web team decided to apply the max-width property to the container\
    \ on each page.\n\nmax-width is a handy property that does exactly what it says:\
    \ It establishes the maximum width for a given element. Let's apply this property\
    \ to our own design and see what comes of. As the Fast Company site settled upon\
    \ a max-width of 1000 pixels, we'll follow:\n\n```\n#header, #container {\n  max-width:\
    \ 1000px;\n}\n```\n\nAfter refreshing, the difference might not be evident. However,\
    \ once we begin to increase the width of our browser window, the property's effects\
    \ are readily apparent (see Figure 7-25).\n\nAs the browser window expands or\
    \ contracts, our design remains flexible enough to suit. However, once the width\
    \ of the window exceeds 1000 pixels (the value set in our max-width property),\
    \ our page's layout stops scaling. With the max-width property, we've placed an\
    \ implicit cap on the horizontal width of our page, ensuring a level of flexibility\
    \ in our design that doesn't impede the ability of users to easily scan our content.\n\
    \nUnfortunately, max-width is a part of the style sheet that doesn't enjoy widespread\
    \ browser support. Or, to be more specific, it enjoys incredibly robust support\
    \ in your browser—unless, of course, your browser happens to be Internet Explorer.\
    \ As of the writing of this book, the most prevalent browser on the planet turns\
    \ a blind eye to this handy property, as well as other related properties such\
    \ as min-width, min-height, and max-height. Given IE's inability to interpret\
    \ them, these properties are relegated to the realm of the theoretical, of the\
    \ best ideas we can't currently rely upon."
