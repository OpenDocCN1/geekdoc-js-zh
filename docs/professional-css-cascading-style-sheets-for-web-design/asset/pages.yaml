  md: '# The Planning and

    Development of Your Site


    In the past few years, the design community has seen an explosion of sites powered
    by cascading style sheets (CSS). Highly visible brands such as Fast Company, ESPN.com,
    PGA, and Blogger have all adopted CSS for the layout of their sites, delivering
    their compelling content through this excellent Web technology. Their pages have
    become lighter and more accessible, while a few style sheets provide them global
    control over the user interface of their entire site. The potential of CSS has
    been well established by these mainstream sites, and the technology (which languished
    since its introduction in 1996) is quickly becoming the facto means by which a
    site''s design is built.


    However, while CSS has been elevated to near-buzzword status, it''s important
    to remember that style sheets are simply a tool to be used in the overall design
    and development of your Web site. Granted, that tool is an incredibly powerful
    one, but it can only facilitate high-powered, professional-looking Web sites.
    Although using style sheets can afford an unprecedented level of control over
    your site''s design, no technology is a silver bullet. Despite what technology
    tells you, adopting CSS won''t inherently make your site more usable, your design
    more compelling, or your breath more wintergreen-fresh.


    So, if we aside the buzz for a moment, we can see that CSS is an incredibly important
    aspect of a Web site''s development, it should be viewed in the context of that
    site''s entire lifecycle. In this chapter, we''ll discuss the following topics:


    +   - Understanding your project''s scope


    +   - Establishing the goals for your project


    +   - The fundamentals of information architecture


    +   - How to begin your site''s design'
