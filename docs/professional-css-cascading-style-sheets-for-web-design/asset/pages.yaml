  md: "# Best Practices for XHTML and CSS\n\n# The Solution\n\nCSS hacks provide us\
    \ with a workaround for browser inconsistencies such as this IE bug, and ensure\
    \ that we can have our layout looking sharp across the board. Typically, these\
    \ hacks declare a parsing bug in a browser's CSS implementation, allowing us to\
    \ hide or display sections of our CSS to that browser. In effect, this allows\
    \ us to serve the \"correct\" value to more CSS-compliant browsers, while delivering\
    \ the \"incorrect\" value to the ones with poor math skills.\n\nTo work around\
    \ our little IE bug, we'll resort to using some hacks to ensure our display is\
    \ looking sharp across all our target browsers:\n\n```\nphack {\n  border: 20px\
    \ solid #C00;\n  padding: 30px;\n  width: 400px;\n}\n\n* html phack {\n  width:\
    \ 500px;\n  width: 400px;\n}\n```\n\nWe've turned our single CSS rule into two.\
    \ The first rule contains the border and padding information to be applied to\
    \ the paragraph, as well as the desired width of 400 pixels.\n\nThe second rule\
    \ (with the universal selector, *) contains our hack. If we were to read out the\
    \ * html phack in plain English, it would tell us to \"Select all elements with\
    \ an id attribute of 'hack' that are descendants of an html element that is itself\
    \ a descendant of any element.\" We emphasized the last part of the rule that\
    \ is where the hack lies. Because html is the root of the HTML and XHTML documents,\
    \ it can't be a descendant of any other element. So, if this second rule wouldn't\
    \ match anything, why would it?\n\nActually, this rule will return a value in\
    \ all versions of Internet Explorer (Windows and Macintosh), which erroneously\
    \ disregards the universal selector and interpret the rule as html phack. As a\
    \ result, this is seen only by Internet Explorer, and by all other browsers. The\
    \ first property declares an \"incorrect\" value of 500 pixels, ensuring that\
    \ the buggy browsers leave space for our content. Because they put the padding\
    \ and border inside the declared, we must send a pixel width that matches a correct\
    \ browser's interpretation of the spec. And because our html phack selector is\
    \ more specific than this, the new value overrules the previous value of 400 pixels.\n\
    \nBut we can't rest on our laurels yet we have one last hack to perform. Internet\
    \ Explorer 6 on Windows and Internet Explorer 5 on Mac implement the box model\
    \ correctly, so we've just found two good browsers that \"incorrect\" value of\
    \ 500px. To remedy this, this second property contains the proper value of 400px.\
    \ However, by escaping the \"i\" with a backslash (w\\idth), we can exploit a\
    \ bug in older versions of Internet Explorer and hide this rule from that browser.\
    \ And with this hack-within-a-hack we've fixed our bug!\n\nIf your head spins\
    \ a bit, we feel your pain. Frankly, there are some excellent resources to help\
    \ you understand this and other CSS hacks. We recommend reading through the CSS-Discussion\
    \ Wiki (discussed in greater detail in the next section), which has an in-depth\
    \ analysis of the box model hack"
