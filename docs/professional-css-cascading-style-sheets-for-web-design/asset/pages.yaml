  md: '# Chapter 2


    # CSS: A Layer of Style


    As with any other language, getting your bearings in CSS is contingent upon your
    understanding of its syntax. Doing so will not improve your own fluency in writing
    style sheets, but increase your understanding of how the browser interprets the
    rules you write.


    # Selectors


    Your CSS comprises style rules that are interpreted by the browser, and then applied
    to the corresponding elements in your document. For example, consider Figure 2-8.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_72_0.png)


    Figure 2-8: A simple sample style rule. Say that times fast.


    Every CSS rule comprises these two parts: a selector, which tells the browser
    which element(s) will be modified by the rule; and a declaration block, which
    determines which properties of the element will be modified. In Figure 2-8, we
    can see that the selector comprises everything up to, but not including, the first
    curly brace (.


    The braces encompass the declaration block, which is the real meat of the rule.
    It consists of one or more declarations, as well as a property/value pair that
    decides how the elements in the selector will be styled. In Figure 2-8, color
    is the property, and #36C is its declared value.


    If you think this sounds simple, it certainly is. Commonsense logic pervades the
    syntax of CSS. But this is just the beginning. We use these simple principles
    to build increasingly complex rules, and gain more control over our sites'' presentation.


    # Type Selectors


    It''s only a couple paragraphs, but we know you missed our simple h1 rule. Let''s
    revisit it:


    ```

    h1 {

    color: #36C;

    ```


    This is what''s known as a type selector because it instructs the browser to select
    all elements of a certain type (here, all h1 found in our markup) and render them
    in a lovely blue.


    In case you were wondering, that you just heard a few thousand font elements taking
    their lasting breath.


    Wondering about that odd-looking #36C color value? That''s a simple way of noting
    hex colors. You can annotate your RGB triplets in this way if each of the hex
    pairs is the same. So, rather than typing #336CC, we instead write the red (33),
    green (66), and blue (CC) hex pairs all contain duplicate characters. We could
    similarly shorten #FFF00 to #FF0, #000000 to #000,#CC300 to #C30, and so forth.'
