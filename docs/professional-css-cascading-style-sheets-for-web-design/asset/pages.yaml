  md: '# Missteps


    After going through a 7-month process to redesign its site, UF found some things
    it would do differently.


    # Leading Only by Example


    When UF released the new site, colleges and departments around campus were clamoring
    to incorporate the techniques and manner of design used on the home page. To stay
    on schedule, the site was launched without the completion of a definitive style
    guide and set of templates to be distributed across campus.


    A set of templates has since been developed, the delay stymied Web development.
    The time to manage a shift in UF develops Web sites was when its most visible
    section was going through change.


    # "Force of Habit" or "Who Moved My Input Field?"


    With redesign, especially on a site with a large number of repeat visitors, managing
    changes becomes critical to acceptance. There are often users (especially staff
    members) whose usage is something like this:


    > "I go to the home page and click ‘Link X’, scroll down and click ‘Link Y’, what
    type I need into ‘Box Z,’ and click ‘Go.’


    While a well-tested redesign would certainly create a more usable site for any
    new visitor, repetitive users of the site (like the one quoted here) will likely
    react violently to an interrupt in their Pavlovian conditioning.


    Mismanagement and lack of attention to the transition of these repeat visitors
    can lead to a great deal of angst and wasted resources.


    While the site was shared with the test audiences, a protracted public beta might
    have alleviated some of the growing pains that came along with the redesign.


    # Summary


    The evolution of the University of Florida Web site has provided a look into some
    of the challenges awaiting change Web sites, the decisions UF made to combat them,
    and the techniques that did the job. We''ve looking at styled headers and unordered
    lists in different types of navigating and why they should be used. We''ve also
    made some modifications to widely used Flash inclusion markup to allow for both
    standards compliance and across-the-board application. We hope this will help
    you tackle your next project.


    Now let''s take a look at the move to CSS in one of world''s most popular sports
    sites, ESPN.com.'
