    # Recent Journal Entry


    # Something So Embarrassing


    My garbage can was stolen from me one night.


    One of my neighbors had a bunch of rowdy friends over one night when I was watching
    television. I didn''t think they were doing anything wrong, just being loud and
    obnoxious. Hell, my neighbor door is always playing his music loud at nights the
    very I try to get some sleep at a reasonable hour.


    The next morning I came out of my apartment holding a trash bag, staring blankly
    into the space my trash can had once occupied.


    Sure, a trash can is not the end of the world, but I finding it is missing along
    a violation you get at school. But at a bully doesn''t take your trash can.


    He politely shows you where it is and puts your full into the canister. And he
    does with a smile you can''t see. You see it, he knows there''s... beaming.


    But this is different. Someone disgraced me by taking the garbage can. And I''m
    sure somewhere in Tallahassee, someone is smiling... because they have a ... trash
    can?


    Who takes a trash can? And why mine? There were plenty of other ones in the ''hood''.


    Anyway, while I wait for my replacement, I get to toss my trash into my neighbors''
    on the slice. If they have to wait out some bad chicken or tampon because the
    trash can is already full-then!


    That''ll ''em. That''ll show em, Bwahahahahaha!


