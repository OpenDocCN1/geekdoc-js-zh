  md: '# Chapter 7


    # Summary


    Our whirlwind tour of the Fast Company layout began with a blank slate: the default,
    normal flow of an unstyled document. From there, we examined how CSS positioning
    could be used to override this default layout scheme, and allow us to remove elements
    from their normal place in the document flow. This understanding of absolute and
    relative positioning provided us with the building blocks for reconstructing the
    Fast Company layout. By using a combination of absolutely positioned blocks contained
    within a relatively positioned parent, we could create a flexible, three-column
    layout in the style of Fast Company. And with a minimal amount of CSS hacking,
    we''ve established a style foundation that''s quite smart across all modern browsers,
    one that we can flesh out with additional content and information.


    With this bulletproof framework in place, let''s look ahead to the next chapter.
    In it, we''ll allow our users to further customize our site''s design, meeting
    their needs while simultaneously furthering the needs of our own site.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 8

    Stuff and Nonsense:

    Strategies for CSS

    Switching


    We wish we had some kung-esque robes handy. This is the chapter where we tell
    our dear readers to forget all that we have taught them about CSS so far, to look
    beyond the surface of the pool and discover the truth within the truth . . or
    something like that.


    Honestly, we''re more fun at parties than we might seem.


    After seven chapters, it''s worth remembering that as convenient as it is to site
    designers, cascading style sheets can also drastically improve the online experience
    for the users of our sites. In Chapter 2, you saw briefly the cascade was written
    with our users'' needs in mind, that user sheets are ultimately given precedence
    over the author style sheets we wrote. The authors of the specification didn''t
    do this to spite that design for the Web, but to empower those who read it.


    After all, the true wonder of the Web is its universal access: an avenue through
    which a user can gain instant and complete entry to any topic, from anywhere in
    the world. In fact, much of the mantle we don as Web designers is to realize that
    promise — to make sites that are at once visually compelling and with an interface
    that presents no barrier to entry.


    However, we''ve slowly come to realize that our understanding of the audience
    has become complete at best. While we focused on setting the type on our pages
    9 pixels in the early days of the Web, our development focused on having sites
    "look right" on contemporary desktop browsers. But in recent years, our understanding
    of our users'' needs has matured. People with physical, hearing, visual, or cognitive
    disabilities have always been using our sites; it''s just taken us time to realize
    it. So, it''s only in recent years that our definition of "accessibility" has
    flow, and our site-building techniques have followed suit.'
