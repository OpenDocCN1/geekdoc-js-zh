  md: '```

    #utilNav li a {

    width: 99px;

    height: 21px;

    display: block;

    }

    ```


    We want to give the text inside a little padding to the left, but also want to
    avoid the hassles by differences in box model interpretations. We can do this
    by indenting the text in lieu of padding it:


    ```

    #utilNav li a {

    text-indent: 3px;

    width: 99px;

    height: 21px;

    display: block;

    }

    ```


    An introduction to the box model is given in Chapter 2.


    To shine up the links, we''ll add some color and an image. Placing the image in
    the lower right of each link bevel corner at 45 degrees:


    ```

    #utilNav li a {

    text-indent: 3px;

    width: 99px;

    height: 21px;

    color: #fff;

    display: block;

    background: #94a2d9 url(images/chamfer.gif) no-repeat right bottom;

    }

    ```


    Adding a splash of feedback to the links is as simple as setting the hover state.
    Here we will make color change slightly by changing the background-color but leaving
    the chamfer image intact.


    ```

    #utilNav li:hover { background-color: #566cc3; }

    ```


    # That Tr Box Model


    Using items in this way can cause problems in Internet Explorer 5 for Mac and
    Windows. We were able to avoid most of the problems by indenting the text links
    instead of padding them. That fixes the rendering in all of the browsers except
    IE5. When text is inserted inside list items, IE5 creates de facto margin outside
    the box to equal the size of the indentation, making the effective size of the
    box wider and throwing off the proper wrapping inside the container.


    A quirk in these browsers can fix the problem as easily as it was created. To
    trick IE5 for Mac and Windows into getting this extra girth it creates, simply
    float everything left:


    ```

    #utilNav li {

    width: 99px;

    line-height: 21px;

    margin: 0 0 1px 1px;

    display: inline;

    float: left;

    }

    ```'
