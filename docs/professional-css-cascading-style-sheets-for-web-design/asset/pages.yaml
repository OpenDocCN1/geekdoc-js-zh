  md: '# FastCompany—Building a Flexible Three-Column Layout


    of design and information—the artistic and the functional, I loved being to instantly
    capture information about my favorite bands, and the latest advancements in pepper
    mill technology. It was all out there.


    From there, I bought a computer again for home, and studied HTML by viewing source
    on anything and everything—learning by trial-and-error mostly. Could you say it
    (and is?) an obsession to figure out how things works.


    Over the years, this has never stopped, but it''s constantly kept me interested.
    I think the combination of being able to do something creative and at the same
    time.


    +   Q: I understand you had something to do with the standards-based redesigns
    of Fast Company and its sister site, Inc.com. What was your role, exactly?


    +   A: I came to work at Fast magazine in 2000 as Web Production Guru, my how
    I miss the job titles of the pre-dotcom boom. My position sort over the following
    three years into this design. Was a fantastic atmosphere to think with and how
    were Web designs—rounded by creative and talented people that were putting out
    a killer magazine. It was impossible not to soak up the knowledge shared by the
    entire team.


    In 2003, we began the process of redesigning both Fast Company and Inc. using
    Web bands.


    +   Q: Tell us a bit about the redesign. As one of the earliest high-profile sites
    to adopt an all-CSS design, FC set the bar high for the rest of us. What prompted
    you to style sheets?


    +   A: Around the same time I had been experimenting with CSS-based layouts on
    my personal sites for a while, we had been planning the redesigns of FC and Inc.
    to coincide with a new, homeless CMS. I had the desire to move the sites to Web
    standards, and it wasn''t until Wired News launched at 100 percent CSS-based layout
    that we started thinking of as a reality. We paved the way for commercial sites
    below.


    The reason for the switch was becoming obvious. The decreased code speed would
    up our sites, increase accessibility, make it easier accommodate different advertising
    units, and make it easier to integrate into our new CMS. The CSS-based layout
    would also make it easier to integrate partner sites, the look-and-end of a flip
    of the switch, and so on.


    +   Q: How did you approach the move with the company? There must have been a
    fair amount of selling to do.


    For information about the Wired News redesign, http://design.com/portfolio/web_interface/wired_news.html.


    +   A: I have to admit, it was rather. The courage of walking to Bob Roesler (the
    site’s director) desk, showing him the Wired News redesign and saying “I’ve been
    experimenting with this stuff—we need to do this.” And in his response, “Yes.
    We definitely need to do this,” sealed the deal. We had Wired to thank for blazing
    the trail for other commercial publications.


    Not every team is going to have that kind of support. For instance, the rest of
    the Wired team at the same time got behind the switch to standards. For instance,
    our developers David Sebastian and Bob Joy saw how simple the template structure
    could be using CSS for the site’s design, and they immediately recognized the
    advantage this would have for an application and point of view.


