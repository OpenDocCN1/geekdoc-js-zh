  md: '# Chapter 8


    The largest drawback to the max-width property is Internet Explorer''s complete
    lack of support for it. Neither the Macintosh nor the Windows version of this
    browser will understand max-width. as, we have to serve a defined width to IE.
    We''ve decided upon width: 60mm; but you might also choose a more flexible percentage
    width. Serving this alternate value to IE and can also be done through the use
    of a CSS hack, or (our favorite method) by placing the "incorrect" value in a
    separate sheet with browser-specific hacks. Chapter 2 discusses these of concepts
    in modern.


    ```

    body { font-size: 62.5% "Lucida Grande", Verdana, Geneva, Helvetica, Arial, sans-serif;
    } The property we set on the body element is a shorthand property. Here, we''ve
    declared the font-size(62.5%), line-height(1.6em) and font-family(Lucida Grande,
    Verdana, Geneva, Helvetica, Arial, sans-serif) in one handy-dandy property/value
    pair. And furthermore, these values are inherited by the body''s descendant elements,
    weve immediately applied a basic property type to the entire document with this
    one.

    ```


    The 62.5 percent value for font-size is a technique first published by Web designer
    Richard Ruff ("How to Size Text Using em",http://clagmut.blog/348/). Because the
    default font size for all browsers is 16 pixels, setting-font-size: 62.5%; on
    the body gives us a default type height of 10 pixels (16 x 62.5% = 10). With em
    (a relative unit of measurement) becomes more logical: 1em is 10px, 1em is 16px,
    9em is 9px, and so forth. Rather than using pixels throughout our document (which
    IE cannot resize), this method uses a near-perfect replacement for our typesetning,
    and also allows users to use a size that suits their needs.


    ```

    #img.portrait { float: right;} The oh-handsome portrait is aligned with the right
    of its containing paragraph. But rather than respecting marked techniques as <img
    src="blah.gif" align="right" />, we''re using the powerful CSS float model to
    achieve the same effect. We recommend that you read CSS guru Eric Meyer''s excellent
    article on "Containing Floats" (http://complexspiral.com/publications/containing-floats/)

    ```


    With a better grip on some of the more clever points in our sheet (if that might
    say), we could easily finish this code in a <style type="css">...</style> block
    in the head of our document. Of course, that would muddle our markup with presentational
    information—and honestly, who wants to hunt down style information across a few
    hundred XHTML documents? That''s right, some call it "adhering to a strict separation
    between structure and style." We call it "lazy".


    In either event, let''s create a second style sheet, and make main.css; at the
    top of that new file, we''ll use the @import command to invoke our core.css, file
    like:


    ```

    @import url("core.css");

    ```


    We''ve effectively created a "wrapper"—a CSS sheet that acts as a gateway to other
    styles. With our main.css file in hand, we can now include it—and with, core.css—in
    our HTML with one simple link element, placed in the head of our document:


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    ```


    And voilà! Our rather plain-looking document suddenly gets a bit of personality
    in Figure 8-2.


    282'
