  md: '# Chapter 6


    That sounds like quite a challenge, but as you''ll see in the next section there''s
    actually a very simple solution, and it''s a solution that you can start incorporating
    into your own sites right away.


    # Love Your <body>


    You may have guessed from the clever title of this section that the key to ESPN''s
    secret is the body element. By assigning a unique id to the body element, the
    staff at ESPN is able to use it as a starting point for making sleepy choices
    to a page. For example, to provide different headline sizes on Regular, Skirmish,
    and War pages, you may use these rules:


    ```

    body#regular h1 {font-size: 2em};

    body#skirmish h1 {font-size: 4em};

    body#war h1 {font-size: 8em};

    ```


    Once these rules are in place, it would be up to the editorial staff to decide
    which publishing mode was applicable for that day''s headline. For example, let''s
    say someone new to the team decides to publish an article in Regular mode; here
    is what the (simplified) HTML might look like:


    ```

    <html>

    <body id="regular">

    <h1>No.1 Hit Wonder</h1>


    <p>Ichiro records his 258th hit of the season, breaking George Sisler''s 84-year-old
    record.</p>


    </body>

    </html>

    ```


    Figure 6-6 shows what might look like in the browser.


    However, when the Editor-in-Chief reads the story he decides that breaking the
    all-time single-hit record is deserved of being published in Skirmish mode. So,
    what does he do? Simple: He snaps the new guy upside up the head and swaps the
    value of the body''s id attribute to skirmish. The outcome? New guy learned a
    thing or two about his boss, and the CSS rules shown earlier transform the story''s
    headline, making it larger and visually more important:


    ```

    <html>

    <body id="skirmish">

    <h1>No.1 Hit Wonder</h1>


    <p>Ichiro records his 258th hit of the season, breaking George Sisler''s 84-year-old
    record.</p>


    </body>

    </html>

    ```


    Figure 6-7 shows what might look like in the browser.


    Easy as pie.'
