    Q: And what about inspiration? When you''re staring down a tight client deadline,
    where do you get your ideas?


    A: I''m a real pop culture junkie. I love trashy pulp detective novels such as
    Mickey Spine''s Hammer. I love comics even more and with comic artists as "Sin
    City''s" Frank Miller and "Concrete" creator Paul Chadwick are few of my passions.


    You might find it unusual to hear that I am passionate about political art from
