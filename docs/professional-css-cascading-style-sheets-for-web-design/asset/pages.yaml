  md: "# Chapter 9\n\nIt would take a lot longer to scroll down the Web page, and\
    \ it would probably look a lot like the Web looked like in 1993. (I sure don't\
    \ want to re-create that for my Web site.) Thus, columns—actually, two columns.\n\
    \n# Columns in HTML\n\nFirst, let's look at the HTML for that's what will be used\
    \ to define the areas of the two columns in the Web page:\n\n```\n<body>\n<div\
    \ id=\"frame\">\n  <fieldset id=\"searchbox\">\n    [ ... content goes here...\
    \ ]\n  </fieldset>\n  <div id=\"header\">\n    [ ... content goes here... ]\n\
    \  </div>\n  <div id=\"sidecol\">\n    [ ... content goes here... ]\n  </div>\n\
    \  <div id=\"maincol\">\n    [ ... content goes here... ]\n  </div>\n</body>\n\
    ```\n\nIn this version, I decided to have the content for the side column (on\
    \ the right-hand side) come first in the HTML, while the main content (on the\
    \ left-hand side) comes later.\n\n# Side Column\n\nWhat I want to do to get the\
    \ side column is to bring the content out of the normal flow of the document.\
    \ I do this by using the position property and setting the value to absolute.\n\
    \nAbsolute positioning allows me to take a certain element and put it at a precise\
    \ point in the Web page. I'm talking pixel-perfect positioning, after the discussion\
    \ on Web typography, seems as if it is an impossibility. However, it's the truth.\n\
    \nSo, reviewing my design in Adobe Photoshop (as shown in Figure 9-22), I measure\
    \ where I want the topleft corner of the side column to start and come up with\
    \ the values 545 pixels from the left and 185 pixels from the top. Also, I double-check\
    \ my column widths and make a note from the Info palette that the width of the\
    \ side column in my design is 255 pixels.\n\n344"
  merge: -1
  pgno: 368
- img_proc: true
  md: "# # Bringing It All Together\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_369_0.png)\n\
    \nWhat is this?\nLorem ipsum dolor sit amet, consectet adipiscing\n\n**Figure\
    \ 9-22:** Using Photoshop to determine the placement for the side column\n\nI\
    \ will use these three pieces of information to write the offset properties in\
    \ the following CSS rule to help position the side column:\n\n```\n#sidecol {\n\
    \  position: absolute;\n  top: 185px;\n  left: 545px;\n  width: 255px;\n  margin:\
    \ 0;\n  padding: 0 0 1.6em;\n  background: transparent url(/assets/img/sidecol_bkgd.gif)\
    \ no-repeat top right;\n}\n```\n\nI also place in properties for the margin (set\
    \ to zero), the padding, and a background image as a flourish for the site design.\
    \ But, looking at the column in my browser, I notice a problem.\n\nWhen using\
    \ absolute positioning, the column stays in place, no matter if the browser window\
    \ is resized large or small, and what's worse, it could obscure the other content\
    \ in the Web page, as shown in Figure 9-23.\n\nUnfortunately, this is the nature\
    \ of the absolute positioning. It's impossible to set an element to be positioned\
    \ and have it move with the content as the user resizes the window (that is, if\
    \ we use absolute positioning by itself).\n\nTo solve this problem, I use another\
    \ magic trick. This time, I set the positioning to relative of the parent element\
    \ of the side column container.\n\n345"
