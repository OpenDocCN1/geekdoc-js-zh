  md: '# Blogger: Rollovers and Design Improvements


    Glance at 3-5 and you''ll notice that practically every element of the Blogger
    design has smooth, rounded corners. The sidebar, the main content panel, the buttons,
    and even the header background are all curved.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_111_0.png)


    Figure 3-5: The blogger site is full of rounded corners.


    Bowman has no crazy in his efforts to mellow the design. He''s taken subtle approach,
    matching shape and color to create a comfortable, calm, and friendly site. And,
    as we''ve already noticed, key is that those are lovely rounded corners.


    # Creating Fixed-Width, Round-Corner Boxes


    There are many ways to produce rounded corners, from the horrible, hacky use of
    tables to, lovely, advanced use of CSS. This before and after pseudo-element selectors.
    It may be a fairly advanced technique, but it''s probably the cleanest and most
    forward-looking method available as of this writing. And, with a little care,
    it can degrade nicely for older, less-capable boxes as well.


    Figure 3-6 shows part of the Blogger Tour. Take a good look at the left-hand side
    of the page, which contains a box titled "Users say..." it''s going to be our
    focus in these next sections. (Note that also all of blogger''s boxes are fixed-width,
    which means their width won''t change as you resize your window or alter your
    browser''s font-size. You can''t tell them they''re a fixed width from Figure
    3-6, but visit the site and you''ll see them.)


