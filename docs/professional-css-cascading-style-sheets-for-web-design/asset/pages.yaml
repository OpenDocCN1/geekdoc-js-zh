  md: '# The PGA Championship


    # Write the object/embed Tags Using JavaScript


    In this scenario, the object/embed elements remain as they are, but are moved
    to an external JavaScript file. Flash content is then written into the document
    using a series of document.write JavaScript methods. Validators (the W3C has an
    excellent one at http://validator.w3.org/) which is the only JavaScript element—not
    Flash''s object/embed code contained—so the object/embed tags pass with flying
    colors.


    This was the workaround used for the PGA Championship site. The XHTML not only
    remained valid, but because JavaScript was used, offered an opportunity to perform
    some light browser or plug-in detection almost (non-Flash) content be required.


    Once the external JavaScript file was created (to long reproduce here—load www.pga.com/pgachampionship/2004/js/flash_home.js
    in your web browser to see it), it was linked in the XHTML document like:


    ```

    <script type="javascript" src="http://www.pga.com/pgachampionship/2004/js/flash_home.js"></script>

    ```


    This method is not without issues. First of all, Web standards will argue that
    the JavaScript we use is exactly a Trojan that slips inside, unsupported markup
    to XHTML and passes the eyes of validators (which is exactly the point). Second,
    by relying on JavaScript to write our content, we are assuming that users have
    enabled it in their browsers (most everyone does, but disable it for extra speed
    and avoidance of ads). Finally, and every Flash movie requires its own JS file
    (not a big deal with movies, but things could quickly get out of control).


    # FlashObject


    Released few months after the 2004 PGA Championship site, FlashObject is the most
    sophisticated and robust embedding method available. Created by Geoff Stearns,
    the JavaScript package is a direct response to address the limitations of both
    of aforementioned methods, while providing simpler markup that validates as XHTML
    1.0 Transitional and.


    FlashObject offers everything a Flash developer would need—player detection, ability
    to alternate content to those without the plug-ins, to pass additional parameters
    and variables through FlashVars, div targeting embedding an swf in a specific
    area, and even a variable to bypass player detection and the display of a Flash
    movie, whether the user has the plug-in or not.


    FlashObject is also search-friendly, which you rarely see with Flash content.
    Users create a div in their document and fill it with normal HTML text, which
    can then be indexed by search engines and displayed for visitors without the plug-in.
    If a visitor has the plug-in, the div is replaced with the Flash movie. This enables
    both the haves and the have-nots to easily receive rich content, without a lot
    of work for the Web developer.


    For more information about FlashObject (which is free to download and use), see
    http://blog.decept.com/2004/10/14/web-standards-compliant-javascript-flash-detect-and-embed/.'
