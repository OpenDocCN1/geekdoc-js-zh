- img_proc: true
  md: "# The PGA Championship\n\nA few months after the initial release of Suckerfish,\
    \ Griffiths and Webb upped the ante with Son of Suckerfish Dropdowns, an even\
    \ lighter version of the original with greater compatibility and multiple drop-down\
    \ menus to boot. It was the \"Son\" flavor of Suckerfish that the PGA Championship\
    \ site used, but this discussion didn't delve into the basic structure (which\
    \ you can download examples of for free at www.httpdog.com/articles/suckerfish/drop-downs/).\
    \ We will discuss the customizations made, potential caveats, and a few general\
    \ usage tips.\n\n# Customization: Positioning the Drop-Down Menu\n\nThe first\
    \ issue encountered when modifying Suckerfish for the PGA Championship site's\
    \ navigation involved positioning of the drop-down menus. By default, the drop-down\
    \ menus appeared directly below its parent list item, depending on the height\
    \ of the graphic or text therein. In the case of the PGA Championship site, the\
    \ parent graphics were shorter than the surrounding area (to conserve weight).\
    \ So, instead of appearing below the white navigational bar (as they do in the\
    \ final form of the site), the drop-down menus were popping out below the graphical\
    \ links.\n\nThe graphical links could have been edited with extra space on the\
    \ bottom to \"push\" the drop-down menus where desired, but that would have increased\
    \ the file size of each graphic and created a \"hot\" space where no content was\
    \ present. The challenge, then, was to find a way to push the drop-down menus\
    \ below the white navigational bar without adversely affecting or changing the\
    \ existing content.\n\nThe first step was nested list (the drop-down menus) was\
    \ already using absolute positioning, so a top property was added to push them\
    \ down where they needed to be:\n\n```\n#nav ul {\n  position:absolute;\n  left:-999em;\n\
    \  top:20px;\n}\n```\n\nThis successfully moved each drop-down menu 20 pixels\
    \ below its parent list item and thus below the white bar. But a new problem emerged.\
    \ The area between the main links and the drop-down menus (the same blank area\
    \ that shouldn't have been clickable) was now disengaging the rollover when the\
    \ pointer moved. So, the next step was to find a way to maintain the visibility\
    \ of the drop-down menus when the mouse entered this vacant area.\n\nBy default,\
    \ a list element is only as tall as the content it contains. But we can change\
    \ behavior with CSS:\n\n```\n#nav li {\n  position:relative;\n  float:left;\n\
    \  margin:0 15px 0;\n  padding:0;\n  width:auto;\n  height:20px;\n}\n```\n\nThe\
    \ important part here was the height property. By specifying a custom height and\
    \ thus overriding the aforementioned default behavior, the invisible bounding\
    \ box of each list element expanded downward to"
