    In the late 1990s, I created the Web Design Pad, a mouse pad sporting the first
    ever look of the Web-safe colors in a true color arrangement that was widely sold
    throughout the U.S. and abroad. I''m also a co-moderator for Rabble, a list community
    devoted to advanced web design and development.


    I have written for New Architect Magazine, A List Apart, Digital Web, Web Reference
    and-


    Done


    ![](img/70fa44d3a461f43c7a35cac2b893273d_343_0.png)


    # # Planning Saves Time


    My first hard lesson in planning as it relates to graphic design came when I was
    a journalism student in my high school I was the graphics editor, and my responsibilities
    included creating the images for each edition of an eight-page newspaper. While
    today it''s easy to surf over a Web site and download a cheap royalty-free image
    at iStockPhoto.com, back in 1991 the process was a more laborious.


    For the first couple of issues I worked on, I gathered the list of articles from
    my staff members to determine how many images were required for the next issue.
    With the list in hand, I sat in front of the Macintosh computer with a blank Photoshop
    document.


    I first kindered to the Photoshop settings and filters to see if something would
    just to appear. When that didn''t work, I typed a couple of keywords related to
    the article in weird typefaces. Then I made another trip to the Photoshop settings
    and filters. After a few hours, I was lucky if I had a solid image or two to show
    for my effort.


    319'
