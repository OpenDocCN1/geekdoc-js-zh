    ![](img/70fa44d3a461f43c7a35cac2b893273d_118_1.png)


    Figure 3-13: New image


    Although we''ve managed to insert an image using the CSS content property, it''s
    not exactly aligned. Why is this? Remember the 8px of padding and 2px of border
    that we applied to the box earlier on? Those properties are vertically and horizontally
    offsetting the pseudo-element, by a total of 10px, as shown in Figure 3-14.


    We must find a way to counteract this offset, and move the new image into its
    correct position, at the top of the box.'
