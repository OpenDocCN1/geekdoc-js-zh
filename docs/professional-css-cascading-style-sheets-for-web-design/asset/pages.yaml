    to handle the amount of content from the site''s tri-weekly editions. The home
    page is so cluttered with featured content that users are having trouble locking
    onto areas of interest. So, as part of your redesign, WebMag 5000 has asked you
    to design the site that''s not only visually appealing, but also more usable.


    # Taking Stock Of Your Content


    If you''re a freelance professional, the word “audit” likely conjures stressful
    hours of unpleasant discussions with various tax authorities. But, in the context
    of any Web site (large or small), a content audit is the first step to bringing
    out of Web chaos. It''s a method through which you can create an inventory of
    your content, identify the strengths and weaknesses of what content your site
    contains, and begin to organize that information into discrete, user-digestible
    chunks.


