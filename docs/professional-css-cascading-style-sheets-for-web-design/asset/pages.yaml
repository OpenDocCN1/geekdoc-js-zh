  md: "# Chapter 2\n\nWe've successfully combined grouping, ID, and class selectors,\
    \ and some well-placed inheritance to turn a humble list into a horizontal navigation\
    \ menu. Instead of resting on our laurels (comfy though they are), let's consider\
    \ the benefits of this approach. It is really better than building this in a table?\n\
    \nAbsolutely. Granted, the number of lines of code hasn't changed all that, when\
    \ you call up to the XHTML and the CSS together. However, we've achieved a measure\
    \ of abstraction of our content's style from its structure. Rather than muddying\
    \ our markup with preferential presentation, we can let class styling sheets do\
    \ all the heavy lifting in our user interface. If we need to add another link\
    \ to our menu, we simply add another li to the end of our navigation list, and\
    \ CSS handles the rest of the presentation.\n\n# Understanding the Cascade\n\n\
    Now we've figured out the basics of CSS syntax, let's a closer look at the mechanics\
    \ behind it, to determine how it is that a user agent what styles are delivered\
    \ to us.\n\n# Style Origin\n\nTo do so, we must first identify the appropriate\
    \ rules because origin of the style rules determines how \"influence\" it has\
    \ in the cascade. Following are the three areas from which style sheets originate:\n\
    \n+   **User agent.** To fully conform to the CSS specification (www.w3.org/TR/CSS21/conform.html#conformance),\
    \ a user agent must apply a default sheet to a document before any other style\
    \ rules are applied. This internal set of CSS rules establishes the default display\
    \ rules for every element. This is how your browser knows to display an hi in\
    \ a garishly serif font, or to put a bullet before every unordered list item.\n\
    \n+   **The user.** That's right—your users can write CSS too. User style sheets\
    \ were introduced in the CSS2 specification, and conceived as a means of allowing\
    \ users to override an author's chosen fonts and colors for any given page. While\
    \ designers might fight the thought, this is a very important accessibility initiative.\
    \ Under certain design, some users might be unable to perceive your style. Writing\
    \ custom CSS enables users to fix font sizes that may be illegible, or avoid color/contrast\
    \ combinations that are otherwise invisible to them.\n\n+   **Author.** This are\
    \ the style sheets you include in your markup, and are the primary focus of this\
    \ book.\n\nWhen a agent is facing with style rules from these three distinct sources,\
    \ it must figure out which style sheet's rules should be presented to the end.\
    \ To do so, it assigns a certain degree of importance (or \"weight\") to each.\
    \ The listing of origins is ordered in an increasing level of importance (that\
    \ is to say, the browser's default style rules are less important than the user's,\
    \ which are in turn less important than the rules you specify in the CSS files\
    \ that reside on your user's server).\n\nHowever, both the author and the user\
    \ can define !important:\n\n```\nh2 {\n  font-size: 2em !important;\n  color:\
    \ #C00 !important;\n}\n```"
