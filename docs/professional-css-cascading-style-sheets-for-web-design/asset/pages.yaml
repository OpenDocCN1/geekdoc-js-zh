  md: "# Blogger: Rollovers and Design Improvements\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_139_0.png)\n\
    \nFigure 3-44: Inserting the bottom-right rounded-corner image\n\nWe must counteract\
    \ the 8px of padding and 2px of border we applied to the box. We do this by applying\
    \ negative bottom, right, and left margins to the pseudo-element, pulling it into\
