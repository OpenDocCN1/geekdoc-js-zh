    Sometimes, clients are aware of the benefits of standards. They really start to
    understand and get excited about a standards-based approach once they start working
    with one for their own site. The benefits are logical on paper, but they''re tactical
    once the benefits are experienced.


    No matter what CMS or scripting language is used to output code, simpler leaner
    HTML is always appreciated. It''s just easier to work with, and it''s immediately
    parsable needing to dissect multiple tables and rows. Once the basic design was
    approved and fairly stable, the fact that Google''s engineers and developers were
    able to continue making changes to the underlying code base, while we hosted the
    CSS files and making small changes to the design proved a convenient method of
    simultaneous iteration from both sides.


    # Bounding Boxes


    Sooner or later, every article, book, or workshop on CSS gets around to talking
    about the box model. It''s one of the fundamental elements of cascading style
    sheets, and if you want to strengthen your CSS-foo, you better have a good understanding
    of the box model''s ins and outs.


    To refresh your memory, here are examples to explain the box model basics. Figure
    3-1 contains a three dimensional (3D) version of the model, showing the creation
    of a simple div, and the order in which the div elements are stacked.


    It''s important to note that the box''s content, often shown to be layered "below"
    the border, is actual the topmost of all elements. In the following pages, we''ll
    see how vital that fact is in letting us create one of Blogger''s trademark looks:
    rounded corners.


    Figure 3-2 contains a series of images that show the effect padding, border, and
    margin have on the overall width and height of an element.'
