  md: '# Flash Embedding Revisited


    UF wanted to display a rotating series of three spotlights on faculty and decided
    Flash (instead of Java or JavaScript image rotators) was the way to do, as shown
    in Figure 5-11.


    Using Flash also meant it couldn''t be a deal-breaker. In other words, if the
    visitor doesn''t have Flash installed, the site still must function properly.
    To be appropriate for this site''s audience, Flash must be an augmentation of
    the site''s content—not a barrier to without Flash.


    The previous chapter discussed methods of properly including Flash into your designs.
    Let''s look at one of these in some more detail: Flash Satay (www.alistapart.com/articles/flashsatay/).


    # Flash Satay


    As discussed in Chapter 4, the Flash Satay method of including Flash in Web sites
    addresses the embed element used by older browsers and the property attributes
    commonly used inside the object element.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_223_0.png)


    ![](img/70fa44d3a461f43c7a35cac2b893273d_223_1.png)


    ![](img/70fa44d3a461f43c7a35cac2b893273d_223_2.png)


    Figure 5-11: Examples of the Flash spotlights used on the UF site'
  merge: -1
  pgno: 223
- img_proc: true
  md: "Better understand what we are trying to do, let's take a look at what a typical\
    \ piece of markup would like to include Flash on a page:\n\n```\n<object classid=\"\
    clsid:D27CB6E-AE6D-11cf-96B8-44455340000\"\nborderwidth=\"http://download.macromedia.com/pub/shockwave/cabs/flash/swf.flash\"\
    \nversion=\"6,0,0,0\" width=\"516\" height=\"194\" id=\"movie\">\n  <param name=\"\
    movie\" value=\"spotlights.swf\">\n  <embed src=\"spotlights.swf\" width=\"516\"\
    \ height=\"194\"\n  name=\"movie\" type=\"application/x-shockwave-flash\"\n  pluginpath=\"\
    http://www.macromedia.com/getflashplayer\">\nn</object>\n```\n\nThe Flash Satay\
    \ takes a big chunk out of these and leaves off with some clear markup:\n\n```\n\
    <object type=\"application/x-shockwave-flash\" data=\"loader.swf\" width=\"516\"\
    \nheight=\"194\">\n  <param name=\"movie\" value=\"loader.swf\" />\n</object>\n\
    ```\n\nThis new loader (a small file of around 4k) loads the larger movie with\
    \ all the content (Figure 5-12). This gets around an issue in IE for Windows when\
    \ the movie in the object parameter won't show, causing the visitor to wait until\
    \ the entire Flash has loaded before it starts.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_224_0.png)\n\
    \nFigure 5-12: Flash Satay uses a loader in addition to the main Flash class.\n\
    \nIf the visitor does not have Flash installed, we want to put alternate content.\
    \ The object module has a very useful method of allowing us to do that by simply\
    \ adding the alternate content after the first parameter. In this case, we'll\
    \ place an image of a campus landmark, as shown in Figure 5-13.\n\n```\n<object\
    \ type=\"application/x-shockwave-flash\" data=\"loader.swf\" width=\"516\"\nheight=\"\
    194\">\n  <param name=\"movie\" value=\"loader.swf\" />\n  <img src=\"images/tower.jpg\"\
    \ alt=\"Century Tower Photo\" width=\"516\" height=\"194\" />\n</object>\n```"
