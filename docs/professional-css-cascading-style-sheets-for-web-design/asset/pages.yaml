    \ name=\"q\" />\n      </form>\n    </fieldset>\n  </div>\n</body>\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_360_0.png)\n\
    \nYou'll notice that in Figure 9-13, the search box appears on the left, I want\
    \ it on the right of the page. To ensure that all the content within the fieldset\
    \ is styled for this particular fieldset instead of another fieldset that might\
    \ be placed in the content area of a Web page, the first step is to modify the\
    \ fieldset property with an id attribute and an appropriate value:\n\n```\n<fieldset\
    \ id=\"searchbox\">\n```\n\nWe are again the outside-in approach to designing,\
    \ the next move is to apply styles to the fieldset itself. What I want to accomplish\
    \ with the fieldset is to place the green bar at the top of the page, while aligning\
    \ the two elements to the right. So, the first CSS rule is this one, as shown\
    \ in Figure 9-14:\n\n```\nfieldset#searchbox {\n  border: none;\n  background:\
    \ #d9ff00 url(\"/assets/img/brandStripe_bkgd.gif\") repeat-x;\n  margin: 0;\n\
    \  padding: 0;\n  text-align: right;\n}\n```"
