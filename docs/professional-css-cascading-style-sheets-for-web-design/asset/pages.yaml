  md: '# Blogger: Rollovers and Design Improvements


    Today, though, is a different story. Our understanding of CSS, and the browsers’
    ability to interpret CSS, has risen to such a level that designers are asking,
    “Why do our sites have to look like this? am I limited in this way?”


    Having a Web sites that all look fundamentally the same isn''t a good advertisement
    for CSS, nor is it going to oppress our clients or bosses. Our sites are easier
    to maintain, and yes, we can make site-wide changes by altering single CSS files.
    But who cares when our work looks like every other box CSS creation out there?


    What we need, and what CSS needs to ensure its popularity, is a way of blurring
    these straight lines and rounding these corners. We must find a way to hide the
    fact that our site is made up of a series of rectangles, and present a more varied,
    more designed front. Because we can''t alter the CSS functions, we must create
    an illusion of change.


    To take an example we''re all familiar with, let''s think of photographs and the
    frames we use to display them. Photographs pretty much in one shape: rectangles,
    but photo frames come in an amazing variety of shapes. Photos displayed in these
    differently shaped frames appear to be the shape of the frame, even though they
    are still rectangular.


    Figure 3-4 shows an example of this illusion in action, using a teddy bear picture
    frame bought at a local market, and a photo of a cute child.


    The lesson to learn here is that you can take one photo, slip it into any kind
    of frame, and give the illusion of having changed the shape of that photo. That''s
    exactly what we''re trying to achieve with CSS and our site designs: hiding the
    dull, dictated, underlying structure, and instead presenting an interesting, person-alized
    front. Take one set of XHTML markup and slip it into a variety of exciting CSS-driven
    front-ends.


    The question you''re probably asking now is, “Exactly how do I apply that idea
    to my Web site?” Well, before we get into markup-specifics, let''s see how Douglas
    Bowman used it in his 2004 redesign of blogger.com.'
