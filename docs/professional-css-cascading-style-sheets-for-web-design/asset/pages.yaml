  md: '# 7


    # FastCompany.com: Building a Flexible Three-Column Layout


    By the time 2003 began in earnest, a rather sizeable snowball was rolling. In
    October of 2002, Wired News abandoned traditional table-driven layout methods
    for a CSS-driven design. At that time, Wired wasn''t the first redesign of its
    kind, but it was certainly the most highly trafficked. The site''s chief designer,
    Douglas Bowman (see Chapter 3 for a discussion of his work on the Blogger.com
    redesign) — all with standard technologies such as CSS and XHTML that would, as
    bowing new design — took a highly visible and well-established brand, and delivered
    a compelling design. Bowman put it, "lift the Web out of the dark ages" (Wired
    News, "A Site for Your Eyes")— www.wired.com/news/culture/0_1284_55675_00.html).


    For the next few months, you could almost hear the crickets chirping. Wired News
    had lifted style sheets out of the realm of academics and saber-waving standards
    advocates, and placed it squarely and confidently in the realm of mainstream media.
    Until the Wired redesign, most companies had never heard of cascading style sheets,
    much less considered them a viable alternative to the tried-and-true methods of
    designing with tables. The industry (and those of us in the saber-waving sections
    of the audience) wanted to see who, if anyone, would follow suit.


    As it turns out, we didn''t have to wait long.'
  merge: -1
  pgno: 263
