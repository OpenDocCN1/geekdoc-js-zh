  md: '# Stuff and Nonsense: Strategies for CSS Switching


    Each link element with a rel attribute set to "stylesheet" is a persistent style
    sheet—and, in fact, we''ve created two already.


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    <link rel="stylesheet" href="contrast.css" type="text/css" />

    ```


    As we add additional style sheets, any links we designate as preferred will act
    as the baseline, sharing their rules with all other included CSS files.


    # Preferred Style Sheets


    By adding a title to a persistent style sheet, we can designate a style sheet
    as *preferred*, so like:


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    <link rel="stylesheet" title="Higher Contrast" href="contrast.css" type="text/css"
    />

    ```


    Additionally, we can specify multiple "groups" of preferred style sheets by giving
    them the same title attribute. This allows the user to activate (or deactivate)
    these groups of CSS files together. Should more than one group be present, the
    first group will take precedence.


    With much as possible, preferred CSS files are enabled by default. So, in the
    previous example, our `contrast.css` file (refer to Listing 8-4) would be enabled
    when the user first visits our page (browsing, if we want our persistent `main.css`
    file). However, preferred style sheets are disabled if the user selects an alternate
    style sheet.


    # Alternate Style Sheets


    An alternate style sheet can be selected by the user, as alternatives to a CSS
    file marked as preferred by the site''s author. To designate a link as an alternate
    style sheet, it must be named with a title attribute, and its rel attribute set
    to "alternate stylesheet". As preferred style sheets, we can group links together
    by giving them identical attributes. So, in short, this is what we''ve been looking
    for—a mechanism through which users can select the design that best fits their
    needs. If we do, want `main.css` to be the default and `contrast.css` to be an
    optional, alternate CSS, then update our link elements to match:


    ```

    <link rel="stylesheet" href="main.css" type="text/css" />

    <link rel="alternate stylesheet" title="Higher Contrast" href="contrast.css" type="text/css"
    />

    ```


    Now, viewing in a browser that supports style sheet switching, the user can finally
    control the display of the page. Browsers such as Firefox or Opera include an
    option to select our alternate style sheet, as shown in Figure 8-4.'
