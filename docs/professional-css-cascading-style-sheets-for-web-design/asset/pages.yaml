    \ the heading vertically\n\nAnd, finally, we must take care of a little problem\
    \ caused by line-height.\n\nLine-height is the vertical distance between two lines\
    \ of text. Set a large line-height and it increases the vertical gap between the\
    \ lines; set a small line-height and the lines of text can start to overlap, as\
