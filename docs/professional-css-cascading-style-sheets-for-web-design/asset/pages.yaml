  md: "# Blogger: Rollovers and Design Improvements\n\n# What Does It All Mean?\n\n\
    The XHTML isn't worth examining in any more detail, but let's have a look at what\
    \ the CSS does.\n\nFigure 3-85 shows our starting point.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_175_0.png)\n\
    \nHello there, my name is Lucas. I am 3-years old and the bi-lingual monkey-child\
    \ of an English man and an Italian woman.\n\nI like cars and trucks and buses\
    \ and trains and almost anything that moves. I'm not so keen on spurs or the Welsh.\n\
    \nMy Grandma has a dog, called Poppy. She's small and cute and she widdles when\
    \ she gets excited.\n\nWhen I grow up I want to be like my Uncle... what a guy\
    \ he is...\n\nFigure 3-85: Starting point\n\nFirst off, we must remove the original\
    \ lucas.jpg image. There are a number of ways to do this using CSS, but the best-all-round\
    \ method is to set its position to absolute and then fling it far off the edge\
    \ of the screen (see Figure 3-86).\n\n```\nhtml > body div#photo-lucas img {\n\
    \  left: -5000px;\n  position: absolute;\n}\n```\n\nWe use position: absolute\
    \ and not position: relative because absolutely positioning object removes completely\
