    \ use near-black color for the text against the body's white background. The default\
    \ font size of 62.5 percent of the browser's default (roughly 10 pixels) might\
    \ be difficult to read for users suffering from visual impairments. (Even a reader\
    \ with slight myopia might have to work at reading our content.) How can we improve\
    \ the design to make it more legible, without sacrificing our original vision?\n\
    \nTo begin, let's create a separate style sheet that addresses some of these possible\
    \ pitfalls. In Listing 8-4, we created a new CSS file named contrast.css.\n\n\
    # Listing 8-4: The contrast.css Style Sheet\n\n```\nbody {\n  background: #000;\n\
