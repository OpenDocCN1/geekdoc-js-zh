  md: "# Chapter 9\n\nTo do this, I want to show only the submenu links of the sections\
    \ the user happens to be viewing. For example, I don't want the visitor to see\
    \ options for Publications while they are looking at the Work section.\n\nI go\
    \ about accomplishing this by hiding all submenu links (as shown by Figure 9-45).\
    \ To do this, I update the CSS rule that was previously used to remove the space\
    \ around the nested lists:\n\n```\nui#mainnav ul {\n  display: none; /* Hides\
    \ Submenu */\n  padding: 0;\n  margin: 0;\n  list-style: none;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_392_0.png)\n\
    \nFigure 9-45: The submenus are gone.\n\nNow that've removed all the submenus,\
    \ I need to decide a system that will bring back only the menus of pages the user\
    \ is visiting. The solution involves a couple of tweaks to the markup. First,\
    \ I need to add a marker to the page itself that identifies it as belonging to\
    \ a particular section of the site.\n\nFor example, if I want to make a page belonging\
    \ to the Publications section, I add a class attribute to the body of the Web\
    \ document like:\n\n```\n<body class=\"pub-page\">\n```\n\nNext, I need a marker\
    \ for the Publications menus. I use an id attribute in the li element contains\
    \ the Publications submenu:\n\n```\n<li id=\"pub-link\"><a href=\"/publications/\"\
    ><span>Publications</span></a></a>\n<ul>\n  <li><a href=\"/publications/books/\"\
    >Books</a></li>\n  <li><a href=\"/publications/articles/\">Articles</a></li>\n\
    \  <li><a href=\"/publications/speaking/\">Speaking Events</a></li>\n</ul>\n```\n\
    \nAnd, because I might need a marker for all the sections of the menu at some\
    \ point in the future, I include them in the other links for the main menu, as\
    \ shown in List 9-3.\n\n368"
  merge: -1
