  md: '# FastCompany. Building a Flexible Three-Column Layout


    # Macintosh Internet Explorer 5


    Upon opening our three-column layout in Internet Explorer 5 for the Macintosh,
    all seems to display just fine—that is, until we reach the very bottom of the
    browser window (see Figure 7-19). To fix this little hiccup, let''s see if we
    can isolate the bug. Because we''ve validated our style sheet and our markup,
    we can eliminate invalid code as the issue. From there, we''ll triage our troubleshooting
    approach: first, we''ll try editing parts of the markup to see if we can restrict
    the issue to one particular section. From there, we''ll see if editing style rules
    allows at that section of the document resolves the bug. Because we''ve established
    what is causing the bug, we can create better and apply a fix to it.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_291_0.png)


    Figure 7-19: How does the horizontal scroll bar there?


    Appendix D has some other things in mind, let''s see if we can''t isolate the
    bug in the markup. Since the issue is occurring on the right-hand side of the
    page, perhaps that''s a good place to start. If we temporarily remove "right"
    from the markup and reload the page, then our suspicions are confirmed: the horizontal
    scroll bar is gone! Removing the rightmost column establishes that it was at the
    head of our scroll bug (see Figure 7-20). But now that we know where of, how do
    we determine exactly what is causing it? And more importantly, how do we fix it?'
