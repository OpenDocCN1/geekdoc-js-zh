    Regardless, we''re not yet at the point where clients ask for name better Firefox,
    or Opera layouts. Each is an excellent browser in its own right, they have some
    work to do before capturing their hearts, minds, and let''s face it—the market
    share of ours.


    # The Need for Hacks


    Of course, issues are bound to arise when working with CSS-based layouts. While
    browser implementations have vastly improved over the past years, the playing
    field still isn''t level. Unless you''re supporting just one browser on one platform,
    you will mostly run into bugs when testing across different browser/platform combinations.
    Proponents of table-layout techniques interpret these issues as weaknesses in
    cascading style sheets as a viable layout method. However, the fault lies with
    the browsers, rather than the CSS specification itself.


    But while every browser has its own issues, we''re in a rather enviable position.
    Most of these issues—and their causes—have been well documented and, in many cases,
    solved outright. What follows is a fine example of one of some of the workarounds
    available to you. When the chips are down and the browsers aren''t behaving, there''s
    almost always a way out.


    # The Bug


    According to the CSS specification, every element in your document tree has a
    content area; this could be text, an image, or so forth. Padding, border, and
    margin areas may surround that content area, as shown in Figure 2-18.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_93_0.png)'
