  md: "So, in the right column of the XHTML template, an unordered list of news items\
    \ was created, like so:\n\n```\n<ul class=\"stories\">\n  <li>DiMarco and Riley\
    \ play their way into Ryder Cup</li>\n  <li>'No question' PGA will return to Whistling\
