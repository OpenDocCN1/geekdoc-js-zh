    #sidebar {\nwidth: 50%;\n}\n```\n\n> Users say... \n\"I love Blogger - it has\
    \ been a great addition to my life online!\"\n- Rosanne\n\n\"You do a wonderful\
    \ job...\nThanks for the exemplary service in pleasing must, user friendly, web\
    \ logs on the internet.\nSeriously..., I, along with thousands of other users,\
    \ definitely appreciate the service you provide.\"\n- John\n\n\"Thanks, your system\
    \ is perhaps the easiest content management application I've ever seen...\nsim\
    \ amaze how easy it is, and I've been working with computers for 20 years.\"\n\
    - Michael\n\nFigure 3-37: Setting the width of the sidebar\n\nNext well style\
    \ the box, giving it a border and some padding (to keep a gap between the text\
    \ and the border). We also add in a background color and a background image. This\
    \ image produces the gradient at the top of the box, as shown in Figure 3-38.\n\
    \n```\n.box {\nbackground: #f5ece3 url(box-tm.gif) repeat-x top left;\nborder:\
    \ 2px solid #eld4c0;\npadding: 8px;\n}\n```"
  merge: -1
