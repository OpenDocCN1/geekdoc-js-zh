  md: '# Frame the Work Within Budget


    From this, it''s important to remember that the project''s budget can be a valuable
    tool in mitigating creep. As our scope statement helps us understand what is out
    of our project''s jurisdiction, so, too, can our budget help mitigate unnecessary
    changes. If there are insufficient funds for a requested change, the issue is
    quickly rendered moot.


    Failing that, it''s worth discussing with our client exactly how this change will
    impact the budget and the project timelines. Frequently, the relationship between
    additional work and additional time is costly in the forgotten of a fast-paced
    project. By demonstrating that X amount of work will require Y dollars at billable
    hours, we can work with our client to assess exactly how much of priority scope
    change actually is. (We never project especially at lately, but please bear with
    us.)


    This might sound like what we''re trying to get out of additional work—quite the
    opposite, in fact (after we must pay for project tickets to Bali). Rather, it''s
    our responsibility as contractors to help our clients attach a quantitative measure
    of importance to work; namely, does the amount of additional time and funds the
    importance of this new project? Weighed in this manner, latest work can be assessed
    against the other parts of the project. If the scope change is ultimately decided
    to be a must-have, then we can work with our client to decide how to proceed—should
    other aspect of the project be foregone to us in this task.


    # Moving Forward


    Of course, if the client is willing to alter the scope and the budget to accommodate
    a vital change, then we need to be equally flexible. Much as we did before beginning
    the project, we need to establish the scope for the requested change. What kind
    of work will it entail? How long will it take? How many resources will it require?
    Once questions have been answered, we can accurately estimate exactly how scope
    creep will affect the project as a whole. If designing today will require three
    days of design and review, then that needs to be communicated to our client. We
    might not be able to produce what they''re asking for in the requested time, an
    open and frank discussion about how long this request will take—and how it will
    impact the larger project—will follow.


    Discussions of pricing and process are no doubt enough to have with your clients,
    it is extremely important to remain firm on these issues. If it helps, try not
    to see these discussions as a means to protect the bottom line. Rather, every
    client will try to test the limits of the project''s scope; the more you tolerate
    out-of-scope requests on short notice, the more they will anticipate and expect
    this behavior. This can lead projects to fly wildly off the original specification
    and schedule, which will in turn push back delivery dates. Neither the designer
    nor the client will be pleased with this result. Therefore, maintaining a firm
    (but fair) line on these issues will help you meet the project goals—and your
    client''s expectations—successfully.


    # Constant Communication


    Not to sound too much like a greeting card, but communication is quite the element
    that determines a project''s success. Conversely, the lack of effective communication
    can run another well-planned project astray. As the project manager, you must
    remain in constant touch with your clients about the status of the project, potential
    shifts in scope, upcoming delivery dates, and milestones. In short, the more touchpoints
    you can maintain with your client about how the project is progressing, the better.
    We''ve never been on a project that ran off track because of too much communication.
    However, we''ve definitely seen instances where insufficient communication met
    with disaster.'
  merge: -1
