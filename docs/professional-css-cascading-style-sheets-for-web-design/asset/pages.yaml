    ```


    Because this style is the style sheet brought in through @import


    This styled supplementary navigation gives us a good container in which we can
    place our utility and

    role-based navigation.


    # Styling the Utilities


    Here we want the list of utilities to flow and fill up the width of the container.
    We''ll start by setting the

    li element to display inline as we did with the lists inside the primary navigation:


    ```

    #utilNav li {

    display: inline; }

    ```


    Next, we must build the box inside of each of the utilities will resize. Because
    we have an exact

    width and height we would like to specify for each box, we''ll set that. To take
    the advantage of the default

    center vertical alignment inside the box, let''s use the line-height attribute
    to set the height.


    ```

    #utilNav li {

    width: 99px;

    line-height: 21px;

    display: inline; }

    ```


    The container is 200 pixels wide and allows us to give the list items some space.
    The 1-pixel margin

    added to the left should be matched by a 1-pixel margin on the bottom:


    ```

    #utilNav li {

    width: 99px;

    line-height: 21px;

    margin: 0 0 1px 1px;

    display: inline; }

    ```


    Now that we have list items sized and spaced, we should handle the links inside
    them. To have a ele-

    ment handle the rollover property, the default display type must be overridden
    by rendering it as a

    block. The size of the box that holds the link should match the size of the box
    created by the list item, so

    we''ll size the element of the element accordingly:'
