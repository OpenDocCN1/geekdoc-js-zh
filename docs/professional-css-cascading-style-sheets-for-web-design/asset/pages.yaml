  md: '# Chapter 6


    Now we have to ask ourselves a question: Can we move the application point even
    further up the document tree? Can we apply it to the ul, for example? The answer
    in this case, is “No.” Not only do we already have a class on the ul, but applying
    class-selected to the ul won''t help us specifically target the anchor, or would
    it? We''ll just stay where we are, and apply the class to the list-item. It gives
    us maximum benefits for the minimum amount of work.


    We hope now we can see that in each case this has a starting point and a logical
    stopping point; it just requires some mental trial-and-error to work out where
    those points are and where to apply your class or id.


    # Lesson Learned


    The lesson to learn is that this exercise will yield untold benefits from hiding
    in the placement of your ids and classes. By placing an id in the body element,
    we are quickly able to make enormous changes to a page-layout, with very little
    extra effort or markup. The further the document tree we aim, the more markup
    we will end up with, and the messier our queries will become.


    So, each time you decide to add a class or id to your HTML, ask yourself if it''s
    really necessary to target that one specific element. Is there a containing element
    to which you could apply the class/id and target the initial element, or have
    you reached the logical ceiling?


    At some point you are going to reach that ceiling, and it is important that you
    realize ahead of time it may be lower than you like. This desire to minimize the
    number of classes and ids in our documents has to be balanced against abilities
    of Web browsers in understanding CSS selectors. Sometimes we have no choice but
    to place classes on specific elements. It''s not a failure on your part, it''s
    just a side effect of having to live and work in the real world.


    However, it''s important that you retain some sort of idealism. This kind of firsthand
    thinking will become increasingly useful as our Web browsers become more adept
    at understanding advanced CSS selectors. In the coming years, we''ll be able to
    raise the application points for our CSS rules higher until our HTML becomes almost
    devoid of the mass of classes and ids we rely on.


    # A Glimpse into a Classless Future

    (Not a Socialist Manifesto)


    At the end of the previous section, we have touched briefly on the notion of “forward
    thinking”—the idea that as browsers become better adept at understanding advanced
    CSS selectors, the classes and ids so prevalent in today''s markup will soon become
    a scarce commodity. This section explores that concept in a little detail, and
    in doing so, provides a glimpse of what the future might bring.


    # The Selectors of Tomorrow


    If you may go over to the W3C''s page on selectors (www.w3.org/TR/2001/CR-css3-selectors-20011113/),
    you''ll find a whole bunch of CSS that has rarely seen the light of day in a production
    environment. That document covers selectors not only from CSS Level 1 but also
    from Level 3, the'
