  md: '# Up a Bit ... a Bit More ... Stop!


    It''s important to realize that the ideas laid here aren''t demanding that you
    never assign a class or to anchors or list-items. They''re simply trying to get
    across the idea that moving the point of class/id application further the document
    tree can have some major benefits for you.


    That said, in all instances you''ll reach a point where moving the application
    point just doesn''t make any sense and will actually make your job more difficult.
    It''s up to you to work out where that point is, and stop before you reach.


    For example, using our little list of navigation links from before, let''s say
    we wanted to style the About link in a way that stands out from the other. Where
    do we put our class?


    A poor approach would be to do this:


    ```

    ul.nav li a (background-color: green)

    ul.nav li a.selected (background-color: purple);


    <ul class="nav">

    <lia href="/">Home</a></li>

    <lia href="/archive/">Archive</a></li>

    <li class="selected"><a href="/about/">About</a></li>

    <li a href="/contact/">Contact</a></li>

    </ul>

    ```


    A better method would be to move the application point up the document tree to
    the list-item:


    ```

    ul.nav li a (background-color: green)

    ul.nav li.selected a (background-color: purple);


    <ul class="nav">

    <lia href="/">Home</a></li>

    <lia href="/archive/">Archive</a></li>

    <li class="selected"><a href="/about/">About</a></li>

    <li a href="/contact/">Contact</a></li>

    </ul>

    ```


    This would let us not only use the Anchor, but also the list-item that it contains:


    ```

    ul.nav li (background-color: yellow)

    ul.nav li a (background-color: green)

    ul.nav li.selected (background-color: red)

    ul.nav li.selected a (background-color: purple);


    <ul class="nav">

    <lia href="/">Home</a></li>

    <lia href="/archive/">Archive</a></li>

    <li class="selected"><a href="/about/">About</a></li>

    <li a href="/contact/">Contact</a></li>

    </ul>

    ```'
