    \ Being said, the h2 element must be given some padding from the top and left\
    \ edge of the section dividers:\n\n```\n#priNav h2 {\n  padding: 7px 0 20px;\n\
    \  letter-spacing: 1px;\n}\n```\n\nThe background-image, background-repeat, and\
    \ background-position properties can be combined in the background property. We\
    \ do it, this, to put a bullet (pointer.gif) in front of each h2. The upper-left\
    \ corner of the bullet is placed 9px to the right of 14 pixels below the upper-left\
    \ corner of the padding area we set. The background-color and background-attachment\
    \ properties can also be combined in the background property, but they are not\
    \ needed here.\n\n```\n#priNav h2 {\n  padding: 7px 0 20px;\n  letter-spacing:\
    \ 1px;\n  background: url(images/pointer.gif) no-repeat 9px 14px;\n}\n```\n\n\
    To ensure that (the position of a letter that drops below the baseline in letters\
    \ as p and y) doesn't affect the lines below them, we'll define the line-height:\n\
    \n```\n#priNav h2 {\n  padding: 7px 0 20px;\n  letter-spacing: 1px;\n  line-height:\
    \ 22px;\n  background: url(images/pointer.gif) no-repeat 9px 14px;\n}\n```\n\n\
    # Styling the Lists\n\nTo style our lists below each heading, we'll start by adding\
    \ the vertical complement of the padding set for the h2 elements to the ul. (The\
    \ h2 element is a block element by default.)\n\n```\n#priNav ul {\n  padding:\
    \ 0 0 7px 20px;\n}\n```\n\nNext to place the li elements after the next inside\
    \ the ul block, we'll override the li elements default block state to display\
    \ it inline:\n\n```\n#priNav li {\n  display: inline;\n}\n```\n\nTo set the height\
    \ of the list, we'll add the height property to the ul elements and line-height\
    \ to the elements:\n\n```\n#priNav ul {\n  padding: 0 0 7px 20px;\n}\n```"
