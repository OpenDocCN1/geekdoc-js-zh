  md: '# ESPN.com: Powerful Layout Changes


    # Regular


    According to Davidson, “Regular mode gets published over 90 percent of the time
    and is for the most part completely automated. The editors select a photo, write
    a headline for it, and hit publish. It’s a streamlined workflow. The Flash headline
    at the top automatically scales depending on how long of a headline we write.”


    Figure 6-3 shows an example.


    # Skirmish


    Skirmish mode occurs when there is a news event of great significance in the sports
    world.” Davidson said. “In this case, we know what’s going to happen ahead of
    time (for example, Ichiro-base player breaking the all-time single-season hits
    record), so the photo-editing department spends a bit of time putting a composition
    together in Photoshop. Once the event occurs, publish the site in Skirmish mode
    and through the magic of well-placed dives we take over the entire top story area
    with the hand-produced piece. Generally, all text in Skirmish mode is set in Photoshop.”


    Figure 6-4 shows an example.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_235_0.png)


