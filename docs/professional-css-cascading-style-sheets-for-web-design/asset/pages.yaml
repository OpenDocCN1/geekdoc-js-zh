    After creating this superbly fluent main.css file, there might be some head-scratching
    in the

    audience. But rest assured, there are very good reasons for putting this file
    in place. Although it

    wasn''t designed as such, the @import rule is a kind of litmus test for a browser''s
    support of advanced

    CSS techniques. Legacy browsers have broken CSS implementations don''t understand
    the @import

    rule, and simply dismiss it. We use this to serve high-octane style rules to modern

    browsers, while such antiquated browsers for version 4 and below Netscape and
    Internet Explorer

    will ignore the style sheets that they wouldn''t understand.


    An benefit to using this intermediary sheet is that we can multiple @import rules.

    This could come in handy if we need to break out our site''s presentation into
    multiple files (for example,

    one for layout, for another color, yet for another typography). Or even better,
    we can use this technique

    to manage our various CSS hacks, as we saw in Chapter 2. You also test the CSS
    in Listing 8-3, which may

    find that the different versions of Internet Explorer (both on the Macintosh and
    Windows platforms)

    break different aspects of the layout. We could use a battery of style sheet hacks
    within our


    core.css file to serve up alternate property values to these browsers'' broken
    CSS implementations,

    Listing 8-3 shows how we use our wrapper sheet to include browser-specific CSS
    hacks,

    which allow us to keep our main.css file clean.


