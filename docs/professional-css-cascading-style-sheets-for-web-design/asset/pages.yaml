  md: '# Chapter 8


    ![](img/70fa44d3a461f43c7a35cac2b893273d_320_0.png)


    Figure 8-7: With a JavaScript-enabled switcher, in our users we can select one
    that best suits their needs.


    # Baking a JavaScript Cookie


    As you see with our not-quite-finished CSS switcher, our browsers don''t seem
    to remember anything about a page we left off or refreshed it. The HTTP standard
    (which is the protocol over which the Web''s pages are transferred from a server
    to your desktop) was designed to be "stateless." This means each time you visit
    a page, the Web server considers it to be your first time, every time. Frankly,
    we have to fill this memory gap. It''s called a cookie, and it''s less fattening
    than baked namesake.


    A cookie is a small text file that is sent by a Web server to a browser, and contains
    small bits of important information about user''s browsing session. Cookies may
    contain user preferences, registration information, or the items placed in an
    online shopping cart, and so on. Once it receives a cookie, the browser saves
    the information on the user''s computer, and sends it to the Web server whenever
    it back.


    We''re not just fattening gums here. We''re mentioning cookies because we can
    use JavaScript to read and them. So, armed with this knowledge, we can finally
    see our way to the finish line. By adding a few more JavaScript functions to we''ve
    already written, we can build an improved style switcher, and one that will respect
    our user''s preferences across multiple pages, or visits to, our site.


    296'
