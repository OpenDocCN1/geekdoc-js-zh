  md: '# Chapter 2


    # Summary


    In coming chapters, you''ll learn real-world, professional strategies for getting
    the most out of your style sheets. We hope this chapter has shown you some of
    the foundations for high-octane XHTML/CSS design, ideas and goals that you can
    bring forward into the more applied chapters that await. By beginning with a foundation
    of valid, well-structured markup, we can use CSS to layer our pages’ presentation
    thereupon. This lightens our pages’ weight, lowers the cost of maintenance and
    future redesigns, and increases our sites’ accessibility.


    In the next chapter, we''ll take an in-depth look at the first of several companies
    to be profiled in this book, Google. Taking to heart some of these benefits, their
    recent redesign of the Blogger site makes for a compelling case study, and demonstrates
    that it''s an exciting time indeed to be pursuing CSS-driven design.'
