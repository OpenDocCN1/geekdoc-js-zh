  md: '# Bringing It All Together


    The first declaration for the margin sets 12 pixels at the top of the introductory
    text. This move is made to create some white space.


    The next rule is important when it comes to the introductory text. Since I want
    to have the graphic image of dots positioned in the upper-left corner, I need
    to position the text out so that the dots don''t interfere with the background
    image. So, in the same manner the main column content by adjusting the padding
    on the right side, I adjust the padding on the left-hand side of the introductory
    text to make room for the background image.


    The next declarations set the background image, color of the text, and the line-height
    for the text.


    The last property sets the width of the introductory text. I have set the width
    in design for the main column to 505 pixels. Even with the left-side padding of
    111 pixels, that leaves 394 pixels. Why shrink the width of the paragraph by 44
    pixels?


    The answer is that I want to create white space again because I want the visitor''s
    eye to see the logo and not be hindered by a block of text. Although there is
    40-pixel gutter between the columns, enlarging the eye at the very top of the
    main page acts as a sort of visual funnel. It diverts the eye from the header
    into the main content of the main page.


    However, by setting the width on the sides of the desc container, I run reful
    of Microsoft''s box model for Internet Explorer 5.5 for Windows, do get around
    this, I use the hack as described in Chapter 8:


    ```

    #desc

    margin: 12px 0 0 0;

    pownding: 0 0 111px;

    background: transparent url("/_assets/img/pageDesc/dots_4x3.gif") no-repeat

    16px 0;

    color: #2D6734;

    line-height: 1.5;

    width: 461px;

    voice-family: "Arial";nvoice-family: inherit;

    width: 350px;

    ```


    The first width is a false value slipped like a poison to WinIE 5.5 so it correctly
    sizes the desc container. The other browsers are able to read the second width
    property value through the voice-family hack.


    By all the other browsers" I mean all Opera, which requires an extra CSS rule
    to use itself. But this isn''t a problem. Extra CSS rules don''t cost much:


    ```

    html>#desc {

    width: 350px;

    }

    ```'
