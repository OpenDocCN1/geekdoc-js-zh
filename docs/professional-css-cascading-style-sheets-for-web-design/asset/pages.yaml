    # Dealing with Internet Explorer


    Unfortunately IE doesn''t interpret :before and :after, and, as a consequence,
    our lovely curves

    and that attractive gradient fill are lost, as shown in Figure 3-27.


    What can we do? Well, IE may not interpret :before and :after, but it does understand
    the

    background-image property. With a little bit of a rethink, we can take the image
    we used for the

    :before pseudo-element and insert it as the background to the h2.


    Let''s see how that works.'
