  md: "# Bringing It All Together\n\nAlso, this CSS rule accomplishes two other items\
    \ at the same time. It removes the background image placed in the blogroll container\
    \ from showing through the headlines left side of the text that it also adds padding\
    \ to the left of the heading and a paragraph are aligned with the text in the\
    \ main navigation, as shown in Figure 9-52.\n\n```\n#blogroll h4, #blogroll p\
    \ {\n  background-color: white;\n  margin: 0 17px 0;\n  padding: 0 0 0 13px;\n\
    }\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_399_0.png)\n\nFigure 9-52:\
    \ Revised headings for the blogroll\n\nThe next CSS rule reduces the footprint\
    \ of my blogroll, but also removes the bullets from the list items:\n\n```\n#blogroll\
    \ ul {\n  list-style-type: none;\n  margin: 0;\n  padding: 0;\n  height: 100px;\n\
    \  overflow: auto;\n}\n```\n\nI've reduced the footprint of the blogroll, but\
    \ I want to move the vertical scroll bar to the left so that the right edge of\
    \ the scroll bar is aligned with the right side of the navigation menu. I do this\
    \ by applying a margin of 17 pixels to the right side (as shown in Figure 9-53):\n\
    \n```\n#blogroll ul {\n  list-style-type: none;\n  margin: 0 17px 0;\n  padding:\
    \ 0;\n  height: 100px;\n  overflow: auto;\n}\n```\n\n375"
