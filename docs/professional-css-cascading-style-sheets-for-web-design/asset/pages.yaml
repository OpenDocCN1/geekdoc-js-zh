- img_proc: true
  md: "# Bringing It All Together\n\n# Making Room for the Logo\n\nThe next part of\
    \ the header details with the logo and the site's tagline. I'm going to add a\
    \ touch of magic with this approach, but I promise to explain why it's all done.\
    \ However, I will provide the basic markup for the image of the logo as well as\
    \ the text for the tagline (as shown in Figure 9-17):\n\n```\n<div id=\"header\"\
    >\n  <a href=\"\" title=\"Christopher Schmitt, keeping it real\nsince 1975\"><img\
    \ src=\"/assets/logo.gif\" alt=\"Christopher Schmitt\nlogo border=\"0\"/></a>\n\
    \  <p>derived from simple pleasures</</p>\n</div>\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_363_0.png)\n\
    \nFigure 9-17: The default rendering of the header pieces under the search box\n\
    \n# Breaking Down the HTML\n\nWhile the last two items (the skip to content and\
    \ the search box) could be considered part of the header, I've left them out of\
    \ the div container called \"header\" because I want the div to contain components\
    \ that I feel are essentially part of the header, the logo, and the tagline.\n\
    \nIf you recall from Chapter 5 regarding the UFL edu site redesign, the navigation\
    \ labels were set in h2 elements to give what Mark Trammell refers to as \"the\
    \ proper gravity\"—the labels played an essential part in the content of the page\
    \ as well as for the whole site. Using assisted-browsers with JAWS will get a\
    \ benefit from the improved markup, but also search engines notice the extra weight\
    \ a having element adds to the content. In this same vein, I'm wrapping the image\
    \ with an h1 element.\n\nLast, at the end of the header and tagline, notice the\
    \ HTML comment ends #header. This marker is placed at the end of closing div tags\
    \ to help in the editing of the HTML. With CSS, there is a heavy reliance on the\
    \ div elements to create the necessary hooks to stylize the content. The more\
    \ elements, the more there are closing div elements. After a while, keeping track\
    \ of all those closing div elements can make a person go cross-eyed. To help reduce\
    \ the eye strain, I place an HTML comment marker at the end of every div element.\n\
    \n339"
  merge: -1
  pgno: 363
- img_proc: true
  md: "# Chapter 9\n\n# Applying the Style\n\nWith the basic HTML set, I want to apply\
    \ the styles to the header. First, I want to remove the default margins for an\
    \ h1 element the browser supplies:\n\n```\nheader h1 {\n  margin: 0;\n}\n```\n\
    \nThe next step is to apply the photobar at the top of the header. The photobar\
    \ will be a revolving image placed right above the logo. The next CSS rule two\
    \ things we need to do: placing the image and setting enough padding (40 pixels)\
    \ to keep the background image from obscuring the logo:\n\n```\n#header {\n  background:\
    \ transparent url(\"/assets/img/photoChange001.jpg\") 0 0;\n  padding: 40px 0\
    \ 0 0;\n}\n```\n\nRemember when I talked about magic? Well, here's the trick:\
    \ I want to make my logo disappear.\n\nThe reason for this trick is that I want\
    \ to keep the logo as in Figure 9-17 when we only print out the Web page. The\
    \ logo that is currently in the default rendering is absolutely perfect for printing.\
    \ However, for my intended Web page design, it's not perfect. For color monitor\
    \ displays, I want another logo to take its place, one that takes of those colors.\n\
    \nTo pull this off, I'm going to employ an ingenious trick by applying a CSS rule\
    \ to the anchor element when the h1 element:\n\n```\n#header h1 {\n  display:\
    \ block;\n  width: 800px;\n  height: 89px;\n  background-image: transparent url(\"\
    /assets/img/logo_screen.gif\") no-repeat 0 0;\n  text-indent: -1000em;\n}\n```\n\
    \nBy default, anchor elements are inline elements that cannot accept a width declaration,\
    \ no matter how. By setting the display to block, we can tell the anchor element\
    \ to take on fixed dimensions. In this case, the anchor element will take a width\
    \ of 800 pixels and a height of 89 pixels—the very same dimensions for the new\
    \ logo. The background-image then brings in the background image, which is the\
    \ image consistent with the new logo.\n\nThe bit of magic that does the trick\
    \ is the text-indent property. By placing a negative value of 1,000 em units we\
    \ are pretty much assured the default logo image possessing the width of 494 pixels\
    \ won't ever be seen. Voila! Check out the results in Figure 9-18."
  merge: -1
  pgno: 364
