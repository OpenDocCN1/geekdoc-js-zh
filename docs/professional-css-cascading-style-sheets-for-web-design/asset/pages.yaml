    \    </ul>\n  </li>\n  <li><a href=\"/publications/\"><span>Publications</span></a>\n\
    \    <ul>\n      <li><a href=\"/publications/books/\">Books</a></li>\n      <li><a\
    \ href=\"/publications/articles/\">Articles</a></li>\n      <li><a href=\"/publications/speaking/\"\
    >Speaking Events</a></li>\n    </ul>\n  </li>\n  <li><a href=\"/shop/\"><span>Shop</a></li>\n\
    \  <li><a href=\"/about/\"><span>About</a></li>\n  <li><a href=\"/contact/\"><span>Contact</a></li>\n\
    </ul><!-- END mainnav -->\n```\n\nWith the spans in place, I now have how where\
    \ CSS can apply the top of the button background images, as shown in Figure 9-42:\n\
    \n```\n#mainnav {\n  font-size: 1.25em;\n  display: block;\n  width: 240px;\n\
    \  margin: 0;\n  padding: 0 0 0 15px;\n  background-image: transparent\n  url(\"\
    /assets/img/mainNav/nav_button_full_top.gif\");\n  no-repeat: 0;\n  color: #6E6F5E;\n\
    }\n```"
