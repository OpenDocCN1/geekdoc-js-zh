  md: '# Chapter 5


    # The Current Site


    With the expansion in usage of standards-compliant browsers, UF decided to attack
    these problems and others with a new design (see Figure 5-3). To redesign the
    site, UF needed the following:


    +   - An assessment of the university''s major audiences and development of user
    profiles (discussed in Chapter 1) to include Web technology usage and accessibility
    needs

    - Structuring the information within the site

    - In-depth user testing

    - Reviews of peer web sites


    ![](img/70fa44d3a461f43c7a35cac2b893273d_204_0.png)


    Figure 5-3: Revision of the site launched in 2004


    The current site was launched in February 2004 and receives approximately 100,000
    visits per day. The remainder of this chapter provides you with a look into how
    this new site was developed.


    # Defining the Site


    When identifying issues for a university site, issues such as the financial bottom
    line and click-through to a shopping cart take a backseat to broader issues such
    as user satisfaction and perception. This makes identifying the goals of the site''s
    fairly tricky to see the visitors, what use it, and give them what they want.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# The University of Florida


    # Building the Team


    Many members of the UF community have multiple roles. With visitors looking for
    so many different types of content coming through a single site, it was imperative
    to have the design driven by not the site''s visitors, but also the members of
    UF''s staff and faculty that deal directly with visitors. Early on, a team representing
    20 of these areas around campus developed a nested list of the visitors to the
    UF site. For example, a main type of visitor would be “student”. Within student
    would be “undergraduate,” “graduate,” “international,” and so on. Then further
    nesting: “prospective graduate,” “transfer undergraduate,” and so on. The team
    identified each task that type of visitor would perform.


    # User Research


    As most organizations, people at UF find themselves wearing many different hats.
    A staff member might also take courses and attend athletic events, while a graduate
    student may teach and be an undergraduate alumnus. This manifested itself in user
    research where visitors to the previous UF site were to guess which group they
    fell within the information they were looking for.


    Visitors would also choose different groups based on their desired membership,
    not necessarily their current role. For example, many potential UF students (namely,
    in high school) would choose the Current Students link from the UF home page instead
    of Prospective Students. When asked, the visitors gave responses that fell into
    three general categories:


    +   - I am currently a student at my high school. What does “pros” mean? I want
    to see real UF students are, not some brochure. (This type of response was the
    most prevalent—and we found the one most interesting—among potential students
    who chose something other than Prospective Students).


    It became clear quickly that the way the university classifies people, while valid
    and useful to the university, was not necessarily the way visitors classify themselves.
    This also suggests that role-based navigation should not be relied upon the primary
    means of navigating the site.


    UF needed to marry this look at visitors with the current trends in university
    sites.


    # Peer Review


    An important part of defining the site was looking at how others throughout campus
    define themselves. While many university sites primarily use a role-based navigational
    system, we knew through our research that this wouldn''t be ideal for UF. That
    being said, we could use other universities'' sites to ensure we were staying
    within the lingua franca de academia. The phrases universities use to define different
    pieces of content, if agreed upon, can serve as the basis for a primacy navigation.


    We understood from the beginning that the final structure of the UF site would
    be unique. However, looking at macroscopic trends like these pulled out the phrases
    that are common to most. UF surveyed more than a thousand university Web sites
    looking for commonly used terms. Idioms


    181'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Chapter 5


    such as "About (University/College X)," "Academics," "Admissions," and "Alumni"
    rose to the top. These matched up with the user research (namely, card sorting)
    and were adopted as many phrases within the navigation.


    Card sorting is a fairly low-tech (but very useful) method of indexing a site''s
    visitors when creating an information architecture. Essentially, test participants
    are asked to group index cards that contain short descriptions of content and
    tasks from the site, and then name these new stacks. More on this methodology
    can be found in Mike Kansky''s book Observing the User Experience: A Practitioner''s
    Guide to User Research (Morgan Kaufman, 2003).


    Many sites fell frequent use of acronyms and other proprietary phrases. While
    this is unacceptable in some cases, it would be avoided and created sparingly.
    While also noted that acronyms were rarely defined.


    # Technical Specs


    The increased download times by the myriad images of the previous design was something
    UF wanted to tackle without returning to the vanilla site launched in 1995. Also,
    the university wanted a return to (and improvement upon) the semantics in the
    initial design. If by and large, the visitors'' environment supported a shift
    to a strictly standards-compliant design, this would be UF''s path.


    # Web Standards


    Early on, the decision was made to strive for a site where content and aesthetics
    were separated. This could be implemented only if UF knew the following:


    +   - How many visitors would be adversely affected by taking a standards-based
    approach?

    - How quickly are these visitors moving away from non-compliant browsers?


    UF felt comfortable with standards-compliant markup and use of XHTML elements
    because of the following:


    +   - The steady movement of Netscape users to Netscape 7 and, ultimately, Mozilla
    or Firefox.

    - Generally speaking, users of non-compliant browsers access the Web through a
    slower connection. The decrease in load (from 50K and 30 HTTP requests to 30K,
    more import, only 3 HTTP requests for users of non-compliant browsers) heavily
    outweighs any simplification of aesthetics. This is especially true for these
    visitors who are regularly subjected to poor ancient browsers.

    - The addition of an enterprise resource management system that rejects ancient
    browsers to handle the university''s financials forces us to use modern browsers.
    (About 40% of UF home page traffic comes internally from students, faculty, and
    staff using the university''s statewide network).

    - By using style sheets, users of non-compliant browsers that do not support the
    @import rule would receive a document with the browser''s very simple default
    styling.


    182'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# The University of Florida


    # Ancient Browsers


    Of the ancient browsers, the most popular and the one causing the most concern
    was Netscape 4. In June 2003, Netscape 4 had a 2.6 percent of site traffic (approximately
    2000 visitors using Netscape 4 day) and it would be difficult to explain a page
    being "broken" to that large an audience. After tracking Netscape 4''s usage over
    a number of months, it became apparent that its usage was steadily declining at
    a rate of about 20 percent per month. This trend led to a much more acceptable
    level — 1 percent in December 2003 (see Figure 5-4).


    | Month (2003) | NS4 Usage of ufl.edu |

    |---|---|

    | June | 2.6% |

    | July | 2.2% |

    | August | 1.8% |

    | September | 1.5% |

    | October | 1.3% |

    | November | 1.1% |

    | December | 1.0% |


    Figure 5-4: Netscape 4 usage per month in the second half of 2003


    As you might guess, this movement has continued. Netscape 4 users comprised less
    than 0.15 percent of UF''s site visitors at the end of 2004.


    # Accessibility


    UF was very concerned with creating a site that was accessible to all members
    of the UF community through whichever medium they chose to use. This includes
    those who use alternative Web browsing technologies due to hearing, visual, or
    mobility impairment. A standards-based approach served as a way to advance accessibility
    as part of the entire development process, not simply an addition-before launching
    a site — or even worse, realizing a site isn''t accessible and creating a "text
    only" version.


    > More information on assistive technologies as screen readers, Braille displays,
    and talking browsers can be found in the book Building Accessible Websites by
    Joe Clark (New Riders Press, 2002).


    # Creating a Main Navigational Structure


    The University of Florida has more than a million pages on the Web covering topics
    from engineering to zoology. Its site navigation must both (at a glance) convey
    the diversity of research and teaching activity at the university and intuitive
    access to all its resources.


    An inherent drawback to rollovers as navigational tools is the concealing of the
    underlying architecture. The visitor can''t see the page''s content in its entirety.
    The visitor must guess what items are hidden beneath each branch of the structure,
    and then act on that guess to see if that section of navigation contains what
    is sought.


    183'
