  md: '# Best Practices for XHTML | CSS


    C. The number of attribute (for example, [lang], [rel], [href]) and pseudo-class
    (for example, :hover, :visited, :first-child) names in the selector. Remember
    that class selectors (such as .active) are a type of attribute selector, and are
    tallied up in this category.


    D. The element of (for example, a, ii, p) and pseudo-element (for example, :before,
    :after, and so on) names in the selector.


    With these four components in hand, it''s rather easy to calculate selector''s
    importance in the cascade. The following table shows a list of selectors, from
    least to most specific (columns A–D).


    | Selector | A | B | C | D | Specificity |

    |---|---|---|---|---||}{

    | a | 0 | 0 | 0 | 1 | 1 |

    | h3 a | 0 | 0 | 0 | 2 | 2 |

    | ul ol+li | 0 | 0 | 0 | 3 | 3 |

    | ol li.red | 0 | 0 | 1 | 3 | 13 |

    | li.red.level | 0 | 0 | 2 | 1 | 21 |

    | #other-news | 0 | 1 | 0 | 0 | 100 |

    | style="..." | 1 | 0 | 0 | 0 | 1000 |


    With this information in hand, let''s return to our humble paragraph styles from
    before, and return their specificity, as shown in Listings 2-4, 2-5, and 2-6.


    # Listing 2-4: The Browser''s Style Sheet


    ```

    p { color: #000; font-size: 1em; margin: .9em; }

    /* A:0, B:0, C:1, D:1 = specificity of 1 */

    ```


    # Listing 2-5: The User''s Style Sheet


    ```

    p { color: #060 !important; }

