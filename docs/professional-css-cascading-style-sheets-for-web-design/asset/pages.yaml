  md: 'A: I don''t necessarily think Google was thinking, "Uh-oh, our competitors
    are all using standards-design, we need to get on the ball and do the same." When
    they came to us, they had a few simple objectives in mind. They probably hadn''t
    thought out exactly how those objectives were to be achieved. But they knew we
    of helping them solve their problems and greatly improve the user experience.
    Google and Adaptive Path also know, by default, Today''s philosophy when it comes
    to implementing its designs, I think a standards-solution was probably assumed
