  md: '# Chapter 8


    "Invasion of the Body Switchers" takes a new approach to style sheet switching.
    Our approach does require abandoning conventional "stylesheet" and "alternate
    stylesheet" semantics, but this doesn''t trouble me, because:


    +   - Many browsers do not implement native style sheet switching.


    +   - Those that do not apply any persistence to a selected alternate style sheet.


    Other solutions rely on multiple style sheets, using <link /> elements and "stylesheet
    / alternate stylesheet" semantics. This adds extra server calls, but more important,
    it does not allow for different media types to be selected independently of each
    other.


    "Invasion of the Body Switchers" lets us target different media types independently,
    and gives visitors a simple interface from which select their preferences, all
    saved into a cookie until they change their mind.


    IOTBS works by using one or more unique class names to the page''s <body> tag.
    Styles are then defined using descendant selectors. The end result gives us much
    greater control over the output of our Web pages.


    **Q:** Interesting, what are these "media types" you speak of? Why would the CSS-web
    designer care about them?


    **A:** It''s sometimes for designers who want to see the Web from other media
    to understand that not is only their work not viewed "pixel perfect" by everyone,
    but that people access Web content through different media. Sometimes that it
    is our good friend the computer monitor, sometimes it is an Internet kiosk at
    the airport; sometimes a handheld computer, a projected image, or a mobile phone.
    Some people find it more difficult to read from a screen and to print out.


    In the past, for all these different media types would have been cost-prohibitive,
    if not impossible, as it required making different versions for viewing devices.
    But, with the advent of technologies that support common standards, we can create
    content that can be written once only, and then styled for different media output,
    all through the medium of CSS.


    **Q:** Stepping a bit back, we''d be interested to hear a bit more about your
    design process. How do you use?


    **A:** Our first job is to understand what the client is trying to communicate
    to her or her audience. We also get for the "personality" of the company and look
    at their brand values (if they haven''t done so themselves) that we can match
    the tone of the personality and brand values. Effective design for the Web is
    about effective communication between a client and their audience. That is why
    we focus on how and what to communicate, before we think about technical or creative
    issues.


    We start developing paper prototype designs, from sketches to layouts made in
    either Photoshop or Macromedia Fireworks. These layouts begin as simple wireframes
    and from them we build markup guides, on paper, which our developers use as them
    for XHTML.


    Some time ago, I developed a set of naming conventions for our site development,
    specific names for <div> and classes that relate to content than presentation
    (#branding rather than header). We stick tightly to these conventions so that
    the entire team understands what a particular CSS relates to. We also have conventions
    for the naming of images and this also needs development.


    314'
