    # Blogger’s Curvy Corners


    If, as a designer, you''re seeking to banish sharpness and rigidity from your
    work a natural place to start is by rounding off any pointy corners a design.
    When the site you''re working on is information-centric (as blogger.com is) and
    you''ve used boxes to compartmentalize sections of information (as blogger.com
    does) then there are a significant number of corners to smooth out.


