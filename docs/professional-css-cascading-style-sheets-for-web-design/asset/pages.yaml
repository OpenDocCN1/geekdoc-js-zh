  md: "# Stuff and Nonsense: Strategies for CSS Switching\n\nFurthermore, the browsers\
    \ that do natively support alternate style switching have only limited switching\
    \ functionality. While these browsers allow the user to switch between the default\
    \ CSS and any alternates provided by the author, they do not remember the user's\
    \ selection. This means that, if a reader selects an alternate sheet and reloads\
    \ the page or returns to it, the browser will forget the earlier choice and reinstate\
    \ the default style.\n\nObviously, neither of these scenarios will work for our\
    \ users. We're lucky that there are some additional steps we can take to bring\
    \ the full benefits of CSS switching to them.\n\n# The Reality: How It Can Work\
    \ Today\n\nWe've established that most of our audience won't be able to use in-browser\
    \ CSS switching (and those who don't have much functionality available to them)\
    \ so we must build an interface into one page that allows users to overcome these\
    \ limitations. Now, you might realize that the two client-side technologies we've\
    \ been studying up to this point aren't well equipped to handle this. While XML\
    \ and CSS excel at describing and styling content, respectively, neither was designed\
    \ to interact with the user. We can use HTML to build a list of links on the page\
    \ as follows:\n\n```\n<div id=\"switcher\">\n  <ul>\n    <li id=\"style-default\"\
    ><a href=\"switch.html\">Default style</a></a></li>\n    <li id=\"style-contrast\"\
    ><a href=\"switch.html\">Higher Contrast</a></a></li>\n    <li id=\"style-hot\"\
    ><a href=\"switch.html\">Gratuitous CSS</a></a></li>\n  </ul>\n</div>\n```\n\n\
    And we can use CSS to core.css (refer to List 8-2) to switch them accordingly,\
    \ as shown in Figure 8-6:\n\n```\n/* switcher styles */\n#switcher ul {\n  text-align:\
