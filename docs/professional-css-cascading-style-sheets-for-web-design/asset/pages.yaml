  md: "```\nDone--em.outer {\n  background: #DDF;\n  border: 4px solid #006;\n  height:\
    \ 300px;\n  margin: 120px 20px;\n  position: relative;\n}\n```\n\nAs shown in\
    \ Figure 7-6, the changes to our inner div are quite striking. Because the outermost\
    \ div is now a positioned element, it establishes a new positioning context for\
    \ all absolutely positioned elements—in this case, the #inner block. So, the offset\
    \ of right: 20px; and top: 20px; no longer position the inner div in relation\
    \ to the root of our markup, but to the container div to which we applied the\
    \ position: relative; rule. Just to hammer the point home, let's change the top:\
    \ 20px; in our #inner selector to bottom: 20px;, like so so (see Figure 7-7):\n\
    \n```\n#inner {\n  background: #FDC;\n  border: 4px solid #930;\n  position: absolute;\n\
    \  right: 20px;\n  bottom: 20px;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_275_0.png)\n\
    \nFigure 7-6: By setting the outer block to position: relative; the inner block\
    \ is positioned in relation to its parent."
