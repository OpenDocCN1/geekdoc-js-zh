    we can''t take advantage of it. While we''re no longer reliant on our readers''
    browser configuration, we''ve replaced it with a technical requirement on our
    server. Your contact''s administrator to check if it''s installed—otherwise, if
    you want some help getting PHP installed on your machine, there are plenty of
