    # War


    According to Davidson, "The last publishing mode is what''s known as War mode
    and it is reserved for only the most important news events. The Red Sox won the
    World Series, Dave Ernhardt died, and the Super Bowl preview are are all examples
    of when we''d publish in War mode. In this mode, a hand-composite Photoshop takes
    up almost the entire above-fold-area of the screen, and browser text is laid on
    top of the right side of the photo.


    Figure 6-5 shows an example.


    "People seem like both War and Skirmish modes quite a bit we use them sparsely
    to preserve their dramatic effect. Were ESPN designed with tables, features like
    War and Skirmish would not be possible without negatively affecting other parts
    of the layout, but the entire layout is CSS-P, everything slides around rather
    gracefully," Davidson said


