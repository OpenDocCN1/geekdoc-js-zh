  md: '![](img/70fa44d3a461f43c7a35cac2b893273d_201_0.png)


    # # The University of Florida


    The University of Florida (UF) is among the world''s most academically diverse
    public universities with fields of study across 16 colleges. UF, which traces
    its roots to the East Florida Seminary in 1853, has a long history of established
    programs in international education, research, and service, with extension offices
    in all 67 Florida counties.


    UF''s student body, with just shy of 50,000 students, is one of the five largest
    among U.S. universities. UF has more than 4,000 distinguished faculty members
    with nearly 100 Fulbright scholars, more than 50 eminent scholars, and numerous
    other faculty members who are nationally and internationally recognized in their
    fields.


    The University of Florida''s Web presence somewhat mirrored the trends you would
    see when looking at the Web as a whole. Shifts in the foci of Web developers (and
    the developers of the browsers in how they are viewed) can be seen by microcosm
    through the UF Web site. In this chapter, we''ll explore some of the decisions
    UF made with regard to its Web presence and take a look at the techniques used
    to carry them out. Let''s get started.


    # ## University of Florida''s Web Site


    UF posted a home page in 1995 that was typical of sites of the time. Well-built
    pages were generally structural in nature and light on aesthetics. The 1995 page,
    in fact, was rather utilitarian with links to much of the same information one
    would find on the current UF site (see Figure 5-1).'
