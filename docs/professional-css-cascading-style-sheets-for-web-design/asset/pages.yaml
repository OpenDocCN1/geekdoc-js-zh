  md: "# Chapter 2\n\nThis code is accurately nested, but it's far from valid. HTML\
    \ differentiates between block-level elements (div, p, table, and the like) and\
    \ inline elements (such as a, em, strong). Inline elements can never contain the\
    \ block-level elements, making our previous markup invalid. While browsers will\
    \ be able to read this code correctly, it is almost certain to close the anchor\
    \ element when the CSS is applied. Depending on the browser, styles might not\
    \ cascade down the text contained in the div. It could be an unpleasant surprise\
    \ if your content suddenly gained the link's underline, or visibly changed when\
    \ you hovered over it with your mouse.\n\nThis is yet another example of the importance\
    \ of validation. By beginning your document with a DOCTYPE declaration and validating\
    \ frequently, you can proactively layout bugs before they arise. This translates\
    \ into less debugging time, which in turn translates into more time you can focus\
    \ on your site's design.\n\n# Close Empty Event\n\nWhen you open an element in\
    \ HTML, you weren't always required to supply the corresponding closing element.\
    \ In fact, the HTML 4.01 specifies that elements whose ending is optional (such\
    \ as the paragraph element: www.w3.org/TR/REC-html140/struct/text.html#h-9.3.1),\
    \ required (elements such as em or strong: www.w3.org/TR/REC-html140/struct/text.html#h-9.2.1),\
    \ and, in some cases, forbidden (the good of 'br: www.w3.org/TR/REC-html140/struct/text.html#h-9.3.2).\n\
    \nThankfully, this ambiguity has been removed from XHTML, largely because of XHTML's\
    \ insistence that our markup be well formed. If you open an element, a closing\
    \ element is required—simple as that. The following is valid markup in HTML 4:\n\
    \n```\n<<ul>\n  <li>Here's a list item,\n  <li>And yet another.\n</ul>\n<p>I like\
    \ big blocks, <br>and I cannot lie.\n<p>You other coders can't deny.</p>\n```\n\
    \nHowever, the XHTML looks slightly different (the changes are shown here in bold):\n\
    \n```\n<ul>\n  <li>Here's a sample item, </li>\n  <li>And yet another. </li>\n\
    </ul>\n<p>I like big blocks, <b>br /</b> and I cannot lie.</p>\n<p>You other coders\
    \ can't deny.</</p>\n```\n\nBecause we're working in XHTML, we don't have the\
    \ option of leaving our list items (</li>) and paragraphs (<p>) open. Before starting\
    \ a new element, we will need to close each with <li></li> and </p>. However,\
    \ the sharp-eyed readers will be merging exactly what we were thinking when we\
    \ added a slash (/) to the br.\n\nTrust us: we never go slash-hahapy. Elements\
    \ such as br, img, meta, and hr are considered \"empty\" elements because they\
    \ don't contain any text content—which isn't the case for p, li, td, and in fact,\
    \ elements in the HTML specification. HTML doesn't play its favorites when it\
    \ comes to keeping our document well. So, by ending an element with />, we can\
    \ effectively close it. Structural consistency is a strong requirement for our\
    \ new markup, and XHTML certainly delivers that consistency.\n\n38"
