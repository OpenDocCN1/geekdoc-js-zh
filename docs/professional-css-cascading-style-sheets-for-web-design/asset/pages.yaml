  md: "# Blogger: Rollovers and Design Improvements\n\nSo, you see, it is really a\
    \ bad idea to base an element's style on the contents of that element. It is much\
    \ better to find a way to style it directly.\n\nLet's look at what we now know:\n\
    \n+   - We must insert the images into the box's content area.\n- We can't use\
    \ the box's contents (h2 and p tags) to style the box.\n\nIsn't that a bit of\
    \ a contradiction? How are we going to solve this problem? What if else is there\
    \ in the box's content area, except for the content user puts?\n\n# Bending Our\
    \ Own Rules with :before and :after Pseudo-Elements\n\nHurrah for CSS, and hurrah\
    \ for its surprising ability to create and insert content into a document.\n\n\
    The :before and :after pseudo-elements (www.w3.org/TR/REC-CSS2/generate.html#before-after)\
    \ are two spanking gorgeous (and fairly advanced) bits of CSS and they are exactly\
    \ what we're looking for. They allow us to insert content (in this case, two images)\
    \ into the box's content area, and style it as we wish. We're not relying on content\
    \ generated by the user to style our box. We're inserting some of ours.\n\nOnce\
    \ they've been inserted, we can treat these pseudo-elements like divs, adding\
    \ in content (via the content property), giving them padding, borders, margins,\
    \ background colors—whatever we want, and all a few additional lines in our style\
    \ sheets.\n\nNow, may you be thinking, \"Ah, didn't we just agree to use an element's\
    \ style to style the element itself? You're right, but that this section is entitled\
    \ \"Bending Our Own Rules...\" if we insert the content, and by using CSS, then\
    \ we skip all the problems mentioned in the previous section. It is (virtually)\
    \ perfect.\n\nBut enough sidelacking; let's get back to making these curves. If\
    \ we once look at our XML, we can see how our CSS is going to insert the :before\
    \ pseudo-element:\n\n```\n<div id=\"sidebar\">\n<div class=\"box\">\n  OUR : PSEUDO-ELEMENT\
    \ IS INSERTED HERE\n  <h2>Users say.../</h2>\n\n  <p><q>I love Blogger - it has\
    \ been a great addition to my life online!</q>\n  Roseanne/</p>\n\n  <p><q>You\
    \ do a wonderful job... Thanks for the exemplary service in pioneering mass, user-friendly,\
    \ web blogs on the internet. Seriously... I, along with thousands of other users,\
    \ definitely appreciate the service you provide.</q> - Josh/</p>\n\n  <p><q>Thanks,\
    \ your system is perhaps the easiest content management application I've ever\
    \ seen... It simply amazes me how easy it is, and I've been working with computers\
    \ for 20 years.</q> - Michael/</p>\n  </p>\n</div>\n</div>\n```"
