  md: "# Chapter 9\n\nOne fix could introduce more elements (such as a span or div)\
    \ into the unordered list to add more\nhooks. With those hooks, I can then associate\
    \ styles to create finer control over the margin and padding.\nThat, however well-intentioned,\
    \ would take us further away from semantic markup. To solve\nt problem, I find\
    \ a different approach.\n\nInstead of applying a custom marker to the list via\
    \ the list-style-image property, I apply\npadding to the left side of each link\
    \ in the blogroll. Then I turn off the markers altogether (like\nbefore) and apply\
    \ a background image to each link in the blogroll, as shown in Figure 9-56:\n\n\
    ```\n#blogroll a {\n  padding-left: 20px;\n  list-style-image: url(//assets/img/bullet_green_dark.gif);\n\
    }\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_402_0.png)\n\nFigure 9-56:\
    \ A better list marker\n\nWith that, the blogroll is done, with a smaller footprint\
    \ and a better-looking style.\n\n# The Footer\n\nThe footer (or what is at the\
    \ bottom of the page) is pretty straightforward. It usually contains\ns sort of\
    \ copyright or common creative license information. Web designers place links\
    \ to\nvalidators or a listing of the tools that help them maintain the page. There\
    \ is nothing fancy in terms of\ncontent:\n\n```\n<div id=\"footer\">\n<p class=\"\
    credit\"&gt;Copyright &copy; 2005 Christopher Schmitt. All rights\nreserved.<br\
    \ />\nPowered by &lt;a href=\"http://wordpress.org\" title=\"State-of-the-art\
    \ semantic\npersonal publishing platform=\"WordPress\"&gt;&lt;/a&gt;\n</p>\n</div><!--\
    \ END footer -->\n```\n\nWhen styling the footer, it's good to think about what\
    \ could happen in the content in the other sections.\nIn this case I'm concerned\
    \ about content in the main column and elements that might be floated.\nexample,\
    \ the blog post footer uses floats to balance the meta and comment areas on the\
    \ same line."
