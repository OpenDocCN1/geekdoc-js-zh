  md: '# The University of Florida


    ![](img/70fa44d3a461f43c7a35cac2b893273d_225_0.png)


    Elsewhere on the page in the navigation, there is a link to the same XHTML-based
    spotlights

    that the Flash-based spotlight movie links to. if a visitor does not have Flash
    installed, or the

    s content is still accessible.


    This works well for all Flash players, or so it would be. An unfortunately widespread
    glitch

    caused by a corrupt Flash Player X when users of IE 5.5 upgraded from IE 5.0 causes
    a

    text area to be rendered instead of the requested object (in this case, our Flash
    spotlights loader) in

    absentence of the classid attribute. For IE to play nicely with our new, sleek,
    standards-compliant

    markup, we will need to resort to a little trickery.


    # Flash Satay with Server-Side Detection


    Flash Satay suggests using the object element without an embed attribute to allow
    standards-compliant

    addition of Flash to XHTML. UF took the Flash Satay method of Flash described
    earlier

    and circumvented problems in IE 5.5 by making a minor revision: server-side browser
    detection.


    # Apache and the BrowserMatch Directive


    To handle the classid attribute properly, we must pass it only to visitors using
    Internet Explorer for

    Microsoft. We can discern what a browser is using (for the most part) through
    the request it makes

    to the server for a Web page. The server normally records some basic information
    about the

    request: the name of the file, the time, whether the request was successful, the
    size of the file (and most

    important for our needs here) the type of browser.


    The method we use assumes the site is hosted on an Apache Web server. Approximately
    two-thirds of all Web sites (including the UF site) are hosted using the Open
    Source Web server software

    Apache. This method can be modified for usage by sites hosted on Microsoft''s
    IIS or other Web servers.


    To begin, create or locate the .htaccess file in the root directory of the site
    or in the directories

    where the documents are that use Flash. The .htaccess file is a simple text file
    containing directives

    configure how a server handles and directories. If not done already, tell the
    server to parse'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 5


    the type of document used. We are using (X)HTML documents, so we will do this
    by adding an AddHandler directive for the suffix of the site''s .htaccess file:


    ```

    AddHandler server-parsed .html

    ```


    If the content is already in a server parsed format, the AddHandler directive
    is not needed.


    Now, we want to set an environment variable that will allow us to identify the
    content in our documents (namely, the classid) we want to pass to Internet Explorer
    for Windows. Inside the .htaccess file, add the following line:


    ```

    BrowserMatch MSIE msie

    ```


    This directs us to set an environment variable called msie to true if the User-Agent
    is MSI (Internet Explorer for Windows).


    Let''s take another look at the markup as it is:


    ```

    <object type="application/x-shockwave-flash" data="loader.swf" width="516" height="194"
    classid="clsid:D27CB6E6-AE6D-11cf-96B8-444533540000">

    <param name="movie" value="loader.swf" />

    <img src="images/tower.jpg" alt="Century Tower" width="516" height="194" />

    </object>

    ```


    Because we have a layout that tells us when the visitor is IE for Windows, we
    can selectively add the classid back in our server module. The code to serve the
    server would look like this:


    ```

    <object type="application/x-shockwave-flash" data="loader.swf" height="194">

    <!--[if IE(msie)]-->

    classid="clsid:D27CB6E6-AE6D-11cf-96B8-444533540000"

    <!--[endif]-->

    <param name="movie" value="loader.swf" />

    <img src="images/tower.jpg" alt="Century Tower" width="516" height="194" />

    </object>

    ```


    For more information on how to use the BrowserMatch directive, it is explained
    in more detail in the Apache documentation describing the mod_setenv module at
    http://apache.org/docs/mod_setenv.html.


    # Drawbacks and Flash to Sally with Server-Side Detection


    As mentioned in Chapter 4, if a site has a sizable number of Flash movies, the
    creation of containers for each one can be cumbersome. The UF site uses a small
    number of Flash movies (well, just), so we''re okay again.


    For the method described, the server''s site must be configured to allow directives
    and the content creator must have access to these permissions. This is the case
    of UF.


    The directive must parse through each page, delivering an additional (though)
    load on the server. This wasn''t an issue for UF because it already parses every
    page to allow for server-side includes (SSIs).'
