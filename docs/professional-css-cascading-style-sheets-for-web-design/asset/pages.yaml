  md: 'Don''t worry, you bought the right book. This Isn''t Professional Plagiarism
    we''re writing here. However, establishing and maintaining an awareness of current
    Web design trends is one of the keys to improving your craft, the most rewarding
    part of working and designing online is that there is always something new to
    learn, another excellent resource you''ve not discovered. If we''re feeling stumped
    by how to style a particular page, uninspired by a current color palette, or just
    strapped for ideas, then seeing how other designers work in the face of adversity
    is always a welcome aid. So, we need to feel as though we''re pushing up against
    the constraints of our own design skills, we to spend a bit of time browsing for
    inspiration.


    This browsing could occur on-line or off-line. Whether walking through a museum,
    browsing or surfing through some well-designed Sites, the medium you pick is less
    important than exposing yourself to well-resoned, well-executed designs for an
    hour or two. Frankly, we''re able to keep hour or two turning into eight or nine
    by visiting a number of well-known design portals, or online communities de evangelizing
    of some design''s brighter spots.


    Over the past year, a number of sites evangelizing CSS-based webs have grown up
    lately. The most recent addition is Stylegala (www.stylegala.com/). It features
    a design as compelling it with its codes. Each featured site in the gallery is
    accompanied by thoughtful critiques by Stylegala''s creator and designer-in-resident,
    David Helsing. The site''s users are allowed to vote for favorites within the
    gallery, as well provide additional commentary. The discussions are always interesting,
    and the sites are all examples of what the Web (and CSS) can do.


    Kaliber10000 (www.k10k.net/) is not such a community as an authority, providing
    a near-dyzying array of design-related sites, tips, and tutorials on an even more
    dizzying basin. Founded in 1998 and staffed by some of the brightest designers
    in the industry, Kaliber10000 provides everything from screenshots of user desktops,
    to Flash-heavy layouts. Kaliber won''t just show you your design block—rather,
    it will help you liberate it.


    # Selecting a Layout: Fixed or Liquid


    Often characterized as one of the hotly wars of Web design, the debate between
    fixed or liquid layouts is the designer''s version of “Chevy versus Ford”—each
    side has its fierce loyalists, with very little ground between the two poles.
    As we begin building our site, it''s worth acknowledging this debate, so that
    you might choose a method that fits your needs and those of your site.


    # Fixed Width


    A fixed (or "ice") layout is one whose width is constant and unchanging. No matter
    how large or small the user''s browser window encompasses, the actual width of
    the page''s content area will remain well, fixed. The benefit to this approach
    is it lends ultimate control to the designer, who always knows the dimensions
    of the canvas he or she is designing. For professionals coming from a background,
    this approach is a rather intuitive one. If the width of the content area is a
    fixed constant, then a designer can have perfectly sized graphics that work with-pixel
    precision.


    However, the success of a fixed-width design is contingent upon an assumption:
    the designer''s assumption of the width of the user''s browser window. Should
    the browser''s window become narrower than that of the page, than horizontal scroll
    bar will appear, forcing the user to manually scroll the page from left to right
    to see the site as its designer intended (see Figure 1-9).'
