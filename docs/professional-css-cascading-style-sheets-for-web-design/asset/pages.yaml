    # Main Column Content


    With the two columns set up, it''s time to take a look at the content within the
    two columns. First up is

    the in the main column.


    # My Site Says, "Hi," Does Yours?


    One of the most important things I tell my students and clients is to have an
    introductory paragraph on

    the page of your site. It''s important to let new visitors (and maybe some of
    the regulars) know

    what to expect when they come to a Web site.


    When Web developers build their own sites, sometimes we get caught up in the designing
    and devel-\oping as simple as a few quick lines describing what we are trying
    to accomplish some

    foolish.


    Not everyone can determine the purpose of a site by the design name or title.
    For example, my

    media design and publishing company name is Heatvision. What does it do? Sell
    comic books or

    sunglasses? Well, it does neither. So, to stop the confusion, I have a few lines
    that say what the company

    does:


    > Heatvision.com consults on user interface design, builds brands, offers training
    in Web

    production and design techniques, and assists in Section 508 compliance.


    Whether the goal is to sell, promote, enlighten, or entertain, we sidestep you
    and fast-\ion to focus on what really works in making a client''s message compelling
    and useful to their

    audience.


    It''s simple and to the point. People thinking I sell comics or sunglasses are
    as quick as The Flash told

    otherwise, and they can search elsewhere in the issue where they reach Superman.


    For my personal site, I want to put the following markup for the introductory
    text, as shown in

    Figure 2-9:


    ```

    <div id="desc">

    <h2>What is this site?</h2>

    <p>This is the web site for me, Christopher Schmitt. I''m an author, graduate

    student, designer, product developer, and an idea generator. After two years,

    I''m currently wrapping up my graduate studies at Florida State University in

    Interactive and New Communication Technologies.</p>

    </div><!-- END #desc -->

    ```


    349'
