    # Interviewing the Designer


    Mike Davidson is Senior Associate Director and Manager of Media Product Development
    at the Walt Disney Internet Group, in Seattle. In 2003, as Associate Art Director
    of ESPN, he was a driving force behind the ESPN.com redesign.


    +   Q: First off, are you pleased with how things have turned out?


    +   A: Absolutely. Running a site as big as ESPN is not a question of redesign
    and then throwing it out onplat. I would say that the majority of Web sites out
    there need very little "reijging" on a daily basis using only text and other simple
    data is changing. But with ESPN, entire sections on a weekly basis. Formats change
    several times a year. New sponsorships can completely change the way a page grid
    is laid. The list goes on and on.


    We work in an environment that must act swiftly to adapt to changes in our industry
    and "redesign" is just a big fresh start every to three years. How we measured
    pleased with any given redesign by how far it propelled us past our competitors
    and what were we were before. The 2003 redesign, now almost two years old, propelled
    into the world of Web standards awareness agnosticism.


    Everyone who thinks the site now in these terms. It''s not "make it works in IE,"
    but "make sure it''s coded correctly." With over 100 people on contributing to
    the site, we get everything perfect, but as the last couple of years have gone,
    we''re getting it more and right every day.


    +   Q: Which bit of the design is the team most pleased with? And which part are
    the site''s visitors pleased with?


    +   A: The most important achievement to us was simply changing the way we use
    code. It''s no longer acceptable for a newbie to come in, hang together a thread,
    and throw it onto the site for the sake of speed. We do level of pride now in
    doing things right first and second. Now that a site needs will be driven by business
    objectives first (which include timeliness), to the extent that technical teams
    can produce great work without sacrificing that timeliness, we are well ahead
    of the game.


    As far as visitors go, in my opinion, the originality of layouts we provide have
