  md: '# Chapter 1


    But there''s more at play here than simply creating an outline and then tossing
    in a few paragraphs (or at least, we hope it looks that way). Rather, that has
    been given to how the order of these content areas must make sense to you, the
    reader. Without consideration for how you will read the book—how you will interface
    with the content therein—we might have saved some time and printed everything
    out on that long sheet of paper.


    In contemporary Web-speak, information architecture (IA) is the most term used
    to refer to this process. On the face of it, information architecture is a means
    through which you define the internal organization of a Web site: to take all
    the content of your site, divide it into easily digestible chunks, and create
    a local navigation structure that makes those chunks accessible by your users.


    But in some times, IA could be seen as a glorified job for a librarian: write
    down some discrete content on an index card, and file it away in a well-labeled
    drawer that some might access it. At the heart of it, IA isn''t simply about categorizing
    and structure instead. Thinking of it as imposing order over an chaotic set of
    information, in a method that will allow others to easily interface with it. In
    fact, the word “interface” implies this two-way street between user and site.
    Your site might have the compelling content available online, but what is good
    if users can''t locate it? It''s our responsibility as designers—and yes, as information
    architects—to impose order on a seeming jungle of pages, that others might easily
    browse through out of.


    Of course, figuring exactly what that jungle contains is the first step to making
    sense of it.


