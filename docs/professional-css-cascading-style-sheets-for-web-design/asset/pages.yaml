  md: "# Blogger: Rollovers and Design Improvements\n\nHowever, it's silly having\
    \ them there, so let's write some CSS that will tell Firefox, Opera, and Safari\
    \ to remove the extra h2 styling, but that IE will skip or ignore.\n\nTo do this,\
    \ we'll use something called a child selector (www.w3.org/TR/2001/CR-css3-selectors-20011113/#child-combinators).\
    \ The child selector does exactly what its name suggests. It helps us select one\
    \ element that is the *child* (not the grandchild or other descendant) of another\
    \ element. Here's a quick example to illustrate that:\n\n```\nspan {\n  background-color:\
    \ green;\n}\n\ndiv span {\n  background-color: yellow;\n}\n\n<div>\n  <span> <!--\
    \ child of div -->\n    I will be yellow\n  </span>\n  <span> <!-- child of div\
    \ -->\n    I will also be yellow\n    <span> <!-- grandchild of div -->\n    \
    \  But I will be green\n    </span>\n  </span>\n</div>\n```\n\nIn this instance,\
    \ only the *spans* that are *children* of the *div* will have a background color\
    \ of yellow. The *span* that is a grandchild of the *div* will keep its green\
    \ background.\n\nNot only does the child selector add a bit more finesse to our\
    \ style sheet, but it has added the benefit of being one of the CSS elements that\
    \ IE doesn't interpret. Because browsers skip over rules they can't understand,\
    \ we are able to use the child selector to feed CSS to the more advanced browsers,\
    \ hiding it from IE.\n\nIn this instance we are able to use the child selector\
    \ to restore the h2 to its pre-IE we remove its background-image, reset its margin,\
    \ and set its padding back to zero. Let's do that (see Figure 3-32):\n\n```\n\
    .box > h2 {\n  background-image: none;\n  margin: 0 0 auto;\n  padding: 0;\n}\n\
    ```\n\n105"
