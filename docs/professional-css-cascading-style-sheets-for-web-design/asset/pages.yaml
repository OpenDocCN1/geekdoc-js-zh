  md: "# Chapter 7\n\nIt's at this stage that the need for well-meaning, semantically\
    \ markup becomes a bit more evident. When using style sheets to control your presentation,\
    \ it's important to consider exactly how users will access your content if they\
    \ don't have a CSS-aware browser. When presented with a page that looks the one\
    \ in Figure 7-9, users might not be presented with meticulously planned design.\
    \ However, they will use CSS to style their content; here use of horizontal rules\
    \ (hr elements) in the header and footer divs can provide a more break in the\
    \ content for users on legacy, CSS-bound browsers.\n\nFor a more detail, the two\
    \ levels of heading elements we've used in our markup. Sighted users surfing CSS\
    \ will be able to quickly tell that \"Welcome to my layout\" is weighted with\
    \ more importance than the titles of our side columns. Screen readers will announce\
    \ at what level the header has been marked up, which will enable non-sighted users\
    \ to orient themselves in the page's hierarchy And as accessibility readers are\
    \ quick to point out the biggest blind spot on the Web is Google—which is a trite\
    \ way of saying engines don't care about presentation, content. Applying this\
    \ kind of intelligent markup to your content not only helps human users navigate\
    \ your pages, but helps engines understand how they should weight and index them.\n\
    \n# A Layer of Style\n\nWith little digging out of the way, let's apply some basic\
    \ presentation rules to control our content, as shown in Listing 7-2.\n\n# Listing\
    \ 7-2: Applying CSS Rules to Our Document\n\n```\nbody {\n  color: #000\n  font:\
    \ 76%/1.5em \"Lucida Grande\", Verdana, Geneva, Helvetica, sans-serif;\n  margin:\
    \ 0;\n  padding: 0;\n}\n\nh1, h2 {\n  font-family: \"Trebuchet MS\", Verdana,\
