  md: "# Bring It All Together\n\nWhen combined with relative positioning a parent\
    \ element (such as the div frame container), absolute positioned elements can\
    \ be placed precisely and still expand with the rest of the content as the user\
    \ expands the browser. Why the frame container? Because that the element that\
    \ is setting the overall width of the Web page. Recalling what I did earlier,\
    \ I looked up offset property values for top and left by the upper-left corner\
    \ of the Photoshop document. The frame container acts as the representation of\
    \ that document, by well, framing all the Web page design elements into the 800-pixel\
    \ width.\n\nNote that you can use this setup on other elements in a Web page design\
    \ in addition to side columns. This is truly a great technique that has so many\
    \ applications. So, experiment and share with others what you find out.\n\nSo,\
    \ let's apply the position property to the frame container:\n\n```\n#frame {\n\
    \  width: 800px;\n  margin: 0 auto;\n  position: relative;\n}\n```\n\nNow, the\
    \ side column should be placed exactly where I want it in the frame container.\
    \ However, I still have the overlap issue, with the content in the left and right\
