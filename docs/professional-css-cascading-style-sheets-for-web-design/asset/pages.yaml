  md: '# Chapter 9


    ![](img/70fa44d3a461f43c7a35cac2b893273d_400_0.png)


    Figure 9-53: The shortened blogroll list


    As you can tell from Figure 9-54, the space allotted on my Web page for the links
    is smaller, but there is an addition of two scroll bars to the right and bottom
    of the list. The property overflow is the reason for both scroll bars.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_400_1.png)


    Figure 9-54: The removal of the horizontal scroll bar


    By default, the overflow property is set to auto. Typically when you have text
    that''s a bit long (such as an article), the browser expands the box to make up
    and down room for the content.


    Yet, I want to make sure that doesn''t happen. So, I put in the value of auto
    for the overflow property, which doesn''t do by itself. It''s only with the height
    property set to 100 pixels that the browser creates the scroll bar that stops
    the text from visually running on.


    While I want the smallest footprint for my blogroll, which I now have, the addition
    of two scroll bars is a bit much. I want to keep the vertical scroll bar for the
    blogroll so that users can move up and down the list of links, the horizontal
    scroll bar is fairly useless and should be removed.


    The horizontal scroll bar is showing because of the vertical scroll bar. Because
    the vertical scroll bar takes away some of the 100 pixels allocated for the width
    of the blogroll, the browser displays the horizontal scroll bar so that users
    can scroll to the right and view the content that is behind the vertical scroll
    bar.


    Even though there''s absolutely nothing about the scroll bar I want to see, the
    browser can''t make decision on its own. So, to stop the browser from showing
    the vertical scroll bar, I must reduce the size of the content area.


    376'
