  md: '# Chapter 2


    broken markup. It''s true. Our early reliance on malformed, proprietary, or otherwise
    invalid markup allowed our consistent display on old-school browsers. But in availing
    of markup hacks, we create a dependency in every page of our site. We''ve placed
    code in our documents that targets a specific browsers'' idiosyncrasies. When
    today''s browsers finally ship over the upgrade horizon and the next generation
    appears, each of with such non-standard markup? Or will the next version of Internet
    Explorer ship with a bug that refuses to render a page when it encounters the
    margin attribute on a body element?


    Yes, this is the kind of stuff we worry about. But the simple truth is that invalid
    markup creates a long-term liability that we cannot to ignore. Rather than fretting
    about how our markup hacks will perform (or won''t in one year or eight), it is
    finally time to pay attention to the “L” in.


    # XHTML: The New Hotness


    XHTML is described by the W3C as“binding the rigor of HTML to Web pages” (www.w3.org/Markup/#xhtml).
    In short, XHTML was created so that owners would have a cleaner upgrade path between
    HTML and a stricter document syntax, XML. This snippet of HTML to its XHTML equivalent:


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN"

    "http://www.w3.org/TR/html4/strict.dtd">

    <html>

    <head>

    <title>My sample page</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    </head>

    <body>

    <ul>

    <li>Here''s a sample list item,</li>

    <li>And yet another.</li>

    </ul>

    <p>Like big blocks,<br>and I cannot lie.</p>

    <p>You other codes can''t deny.</p>

    </body>

    </html>

    ```


    And, look at the XHTML:


    ```

    <DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/DTD/xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>My sample page</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    </head>

    <body>

    <ul>

    <li>Here''s a sample list item,</li>

    <li>And yet another.</li>

    </ul>

    <p>Like big blocks,<br />and I cannot lie.</p>

    <p>You other codes can''t deny.</p>

    </body>

    </html>

    ```


