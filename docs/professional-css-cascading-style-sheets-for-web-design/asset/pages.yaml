    ```\n\nThe class assigned to the unordered list element, stories, was then added\
    \ to the style sheet:\n\n```\nul.stories {\n  margin:0;\n  padding:0;\n  color:#E9ESDF;\n\
    }\n```\n\nFirst, stories assigned as a subclass of the unordered-list element.\
    \ The default properties browsers were automatically applied to the unordered-list\
    \ elements were reset. This was accomplished by setting both the margin and the\
    \ padding to zero. A color property was then added, which affected all text inside\
    \ the list.\n\nTechnically, you could leave the \"ul\" and create a standalone\
    \ class named \"stories\". Assigning classes directly to HTML elements is not\
    \ just good, but makes your style sheets easier to read. Think of elements as\
    \ inline comments that describe their function at a glance, so whether you're\
    \ returning to a style sheet months later to make an edit, or your style sheet\
    \ is shared among multiple developers, it's easy to see which classes belong to\
    \ which elements. A little organization can pay off big time down.\n\nAfter taking\
    \ care of the unordered-list object, it was time to tackle each of the list elements\
    \ inside:\n\n```\nul.stories li {\n  list-style:none;\n  margin-bottom:2px;\n\
    \  padding:4px 4px 4px 10px;\n}\n```\n\nLet's walk through this line by line.\
    \ First, the list-style property was set to none, which killed the browser's default\
    \ behavior of attaching a rounded bullet to the list. From there, a smudge of\
    \ margin was added to push the list items a little apart vertically, plus padding\
    \ (4 pixels to the top, right, and bottom, as well as 10 pixels to the left).\n\
    \nBy default, each list item generated inside the stories unordered list received\
    \ these values. At stage, they all had the same background (using color underline),\
    \ but here is where the extra effect came into play:\n\n```\nul.stories li:odd\
    \ {\n  background:#828279;\n  url(http://i.pga.com/pga/images/pgachampionship/img/bg_stories_shadow.gif)\
    \ repeat-;\n}\n```"
