  md: "# Best Practices for XHTML and CSS\n\nDon't feel bad if you didn't spot any\
    \ changes — there are more similarities than differences. And, in fact, both of\
    \ these pages will render the same in any given browser. Your users won't be able\
    \ to tell the difference between the two languages. While the similarities in\
    \ syntax outweigh the differences between XHTML and its predecessor, those differences\
    \ are quite significant.\n\n# Begin with the DOCTYPE Declaration\n\nThe first\
    \ item in the two sample pages is a DOCTYPE (geek-speak for \"document type\"\
    ) declaration. Point your browser to the URL in the DOCTYPE element:\n\n```\n\
    http://www.w3.org/TR/xhtml/xhtml-transitional.dtd\n```\n\nYou'll be presented\
    \ with a long, complex text document known as theCTYPE definition, or DTD. The\
    \ DTD outlines the rules of the language to which the ensuing markup is up to\
    \ conform. Declaring this DTD at the beginning of our markup signals what language\
    \ is used on the page to \"user agents,\" a blanket for any device or program\
    \ that can access our page. It's not just about graphical desktop browsers. Printers,\
    \ cellular telephones, and readers are all examples of user agents, and each benefits\
    \ from what markup language they encounter on the rest of the page.\n\nOnline\
    \ validation tools are another example of user agents, and (they all) benefit\
    \ from our opening DOCTYPE declaration. This allows them to assess how effectively\
    \ our code conforms to the DTD — in effect, whether it's valid or not.\n\n# Keeping\
    \ Your Markup Well Formed\n\n\"Well-formed\" is essentially a new name for an\
    \ old rule. It simply means that elements must be properly nested.\n\n```\n<p>Here's\
    \ <em><strong>opening</strong></em> paragraph!</p>\n```\n\nHere, the em is opened\
    \ first, and the strong opened second. Since the em is opened before the strong,\
    \ markup must be closed *after* the strong's final tag. If we revise our markup\
    \ to fit that's well-formed, the element means our nesting order makes a bit more\
    \ sense:\n\n```\n<p>Here's <em><strong>strong</strong></em> paragraph!</p>\n```\n\
    \nAs you've no doubt, this concept of proper nesting is an old one. While it's\
    \ never valid to validate incorrectly nested markup, it is still quite common\
    \ in pages built today. As a result, browsers become far too tolerant of tags\
    \ they feed. Every given browser will have a different strategy in place for \"\
    fix\" this incorrectly nested markup, which can offer yielding different results\
    \ once the page is rendered. XHTML is a language that demands structural soundness.\
    \ By requiring well formed, this stricter syntax enables us to control structural\
    \ inconsistencies in our code.\n\nOf course, it's important to remember that “well-formed”\
    \ does not equal “valid.\" Consider this example:\n\n```\n<a id=\"content\">\n\
    <em>\n  <div class=\"item\">\n    <p>I'm not sure what this means.</p>\n    <p>...but\
    \ at least it's well-formed.</p>\n  </div>\n</em>\n</a>\n```"
