  md: "# Chapter 8\n\nSo, with this call to setCookie(), we've managed to store the\
    \ user's selection from our list of style sheet anchors. But now that we've stored\
    \ it, how do we read the cookie and honor the preference? Well, once we have placed\
    \ the lines in our scripts.js file, it would seem that the answer is, \"simply\
    \ enough\":\n\n```\nwindow.onload = initCSS;\n\n// initCSS: there is a \"style\"\
    \ cookie, set the active stylesheet when the page\nloads\nfunction initCSS() {\n\
    \  var style = readCookie(\"style\");\n  if (style) {\n    activeCSS(style);\n\
    \  }\n}\n\n// Read the cookie\nfunction readCookie(name) {\n  var needle = name\
    \ + \"=\";\n  var cookieArray = document.cookie.split(';');\n  for(var i=0; i<\
    \ cookieArray.length;i++) {\n    var pair = cookieArray[i];\n    while (pair.charAt(0)=='\
    \ ') {\n      pair = pair.substring(1, pair.length);\n    }\n    if (pair.indexOf(needle)\
    \ == 0) {\n      return pair.substring(needle.length, pair.length);\n    }\n \
    \ }\n  return null;\n}\n```\n\nWith these last lines of JavaScript in place, we're\
    \ finally finished. Our new function, initCSS(), has two simple tasks. First,\
    \ it checks if there is a \"style\" cookie on the user's machine (var style =\
    \ readCookie(\"style\"));). If one exists (if style), then the activeCSS() is\
    \ invoked with the value of the user's cookie as its argument.\n\nBut it's the\
    \ first line of code that does the heavy lifting, even if it does ours. window.onload=initCSS;\
    \ fires our initCSS() function when the document finishes loading in the user's\
    \ browser. Now, as the user moves between the pages of our site (hypothetical\
    \ they may be), or when the user returns during a later session, we can immediately\
    \ poll for the presence of a \"style\" cookie as each of our pages comes. As the\
    \ user makes selections from our style switcher, our pages will honor them, allowing\
    \ the user to tailor not only individual pages, but an entire site to his browsing\
    \ needs.\n\nListing 8-6 shows the complete JavaScript file."
