  md: "# Chapter 7\n\n# CSS Positioning: The Fundamentals\n\nBefore we can begin replicating\
    \ Fast Company's layout, we should first step back and examine of the mechanics\
    \ behind CSS positioning. We've seen in previous chapters, every element in your\
    \ markup occupies a position within the document's flow. Block-level elements\
    \ — such as headings, divs, and paragraphs — are stacked like boxes atop each\
    \ other, expanding horizontally to the full width of their containing element.\
    \ On the other hand, inline elements are laid out horizontally within a containing\
    \ block-level element, one after another. Some example of inline elements include\
    \ links, images, and phrases as em and strong.\n\nInitially, each element in your\
    \ unstyled document is considered to have a \"static\" position — in other words,\
    \ its position has not been modified from its default. That's why paragraph is\
    \ placed beneath h2, and why image appears within div.\n\nThe official term for\
    \ this default positioning scheme is the \"normal flow\" of the document. If we\
    \ look at an unstyled HTML document, we see that boxes (such as p, h1, or div)\
    \ flow vertically within their container, stacked immediately below the preceding\
    \ one. However, inline boxes (such as span, a, or img) flow horizontally within\
    \ their container. And without any additional style rules from us, this flow will\
    \ remain intact.\n\nBut, of course, we're about to change that all. We're nothing\
    \ if predictable.\n\nWhat makes CSS such a powerful tool is its ability to override\
    \ these positioning rules, and create incredibly complex layouts without opening\
    \ a simple td. An element can be removed from its normal, static position by writing\
    \ a simple CSS selector that sets a new value for — you guessed it — the element's\
    \ position property, like so:\n\n```\n{\n  position: absolute;\n}\n```\n\nBesides\
    \ static, there are three valid values for this position property:\n\n+   - relative\n\
    \n+   - absolute\n\nSetting the property to any of the three non-static values\
    \ will give us different means of removing the element from its place in the normal\
    \ document flow, and positioning it in a different section of the document. The\
    \ mechanism at the heart of Fast Company's three-column layout uses a combination\
    \ of the two — relative and absolute positioning. Let's examine these two property\
    \ values and how we can better apply them to our own sites' designs."
  merge: -1
  pgno: 270
- img_proc: true
  md: "# FastCompany.com: Building a Flexible Three-Column Layout\n\n# Absolutely\
    \ Fabulous Positioning\n\nWhen absolutely positioned, an element's position is\
    \ specified through some combination of top, right, bottom, and left properties\
    \ as you see here:\n\n```\ndiv#content {\n  position: absolute;\n  left: 10px;\n\
    \  top: 100px;\n}\n```\n\nThe left and top properties specify offsets for the\
    \ div with an id attribute of \"content.\" Rather appearing sandwiched between\
    \ the block-level elements immediately before and after it in the markup, the\
    \ content div is removed from the document flow. But where is it, you ask?\n\n\
    To find an answer, look at the following markup structure, for the sake of brevity,\
    \ we'll assume is placed within the body of a valid XHTML document:\n\n```\n<div\
    \ id=\"outer\">\n  <p>This is a paragraph in the <outer></outer> block.</p>\n\
    \  <div id=\"inner\">\n    <p>This is a paragraph in the <inner></inner> block.</p>\n\
    \  </div>\n</div>\n```\n\nThese are two unassuming divs, one with an id of \"\
    inner\" nested inside the other (named, cleverly enough, \"outer.\"). Each div\
    \ contains one paragraph — nothing awarding winning, we're sure. Just to move\
    \ this beyond the realm of angle brackets and into a screenshot or two, let's\
    \ apply some basic style to this markup:\n\n```\n#outer {\n  background: #DDF;\n\
    \  border: 4px solid #006;\n  height: 300px;\n  margin: 120px 0 0px;\n}\n\n#inner\
    \ {\n  background: #FDC;\n  border: 4px solid #930;\n}\n```\n\nAgain, these aren't\
    \ designed to floor our clients. The first rule applies to the div with an id\
    \ of \"outer.\" We're setting an oh-so-comely blue border and background to the\
    \ div, setting its height to 300 pixels, and then increasing its margins to offset\
    \ it from its normal position (120 pixels down, and 20 pixels on each horizontal\
    \ side). The second rule simply applies a light red background color and matching\
    \ the inner div.\n\n247"
  merge: -1
  pgno: 271
- img_proc: true
  md: "# Chapter 7\n\nYes, that's right: red on blue. We never said we were discriminating\
    \ when tossing together code examples.\n\nBut before you slam this book shut in\
    \ a fit of palette-driven indignation, let's examine how these two elements appear\
    \ on the page. As you can see in Figure 7-3, we've taken the liberty of applying\
    \ some basic type information to our document (Times New Roman is 1995). But with\
    \ our (somewhat garish, we'll admit) colors and borders activated, we can see\
    \ that the divs appear in the normal document flow—the inner block is a child\
    \ of the outer block, and the page's current display reflects that.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_272_0.png)\n\
    \nHowever, by using CSS to change the value of the inner element's position property,\
    \ our design doesn't have to reflect this parent-child relationship. We can add\
    \ three brief lines to our #inner selector:\n\n```\n#inner {\n  background: #FDC;\n\
    \  border: 4px solid #930;\n  position: absolute;\n  right: 20px;\n  top: 20px;\n\
    }\n```"
