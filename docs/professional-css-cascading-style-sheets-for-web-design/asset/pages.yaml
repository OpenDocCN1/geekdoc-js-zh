    # Content and the Site Map


    With the scope, my attention turns to taking an inventory of the content. While
    it may sound like a difficult task, it''s very easy. Only if the site is medium
    to large is the process intensive.


    Considering all the material that was online (or material I wanted to have online),
    I think the hardest part is really taking an honest look at what I have to work
    with.


    > When designing for someone other than yourself, you are warned that obtaining
    content from clients is the hardest part of the Web development process.


    Where does the content come from? The choices fall into four categories:


    +   - Gathered from internal sources (and, I hope, not strewn across databases,
    Microsoft Word files, and print collateral)


    +   - Original content (previously unwritten) created by the client


    +   - Content that you pay someone to write (preferably a professional copywriter
    or technical writer)


    +   - A combination of the three


    From my experience, clients will write their own content or reduce the number
    of sections to save costs. However, paying a professional copywriter or technical
    writer to create quality has more of a chance in improving the success of a project.'
