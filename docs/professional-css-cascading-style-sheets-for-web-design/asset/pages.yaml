  md: '# Chapter 5


    Although rollovers allow a site''s visitor to see the structure one branch at
    a time, an architectural overview that requires no guessing on the part of the
    visitor can be much more useful when a site''s navigation is not completely visceral.
    The six sections that give an overview of the university are much better served
    by openly displaying some of their contents near the section headers (see Figure
    5-5).


    ![](img/70fa44d3a461f43c7a35cac2b893273d_208_0.png)


    # The XHTML


    On the UF home page, the primary navigation is not merely a means of getting from
    one page to another. It is some of the most important content of the page and
    the markup used in the navigation should reinforce that importance.


    # Unordered Lists


    Grouping similar sets of information (as is done when lists are used) allows for
    the following:


    +   - Styling through CSS

    - Semantic grouping of similar objects

    - Easier traversal through groups of content, especially in screen readers


    # Nested Unordered Lists


    At first glance, the UF primary navigation might be best handled as nested, unordered
    lists. There is an unordered list of main topics, with each topic having a set
    of links that apply to them (see Figure 5-6). This would look something like the
    following:'
