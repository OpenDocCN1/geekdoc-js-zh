  md: '# Stuff and Nonsense: Strategies for CSS Switching


    Our minicule, sans-serif typeface has been replaced with a much more attractive
    serif. Of course, we''re not ones to settle for the Model-T-of fonts we''ve opted
    to use the much more attractive Garamond or Georgia for our page''s print version,
    and whereas we previously our #blurb paragraph as a full-column block on ours,
    now we use the float to pull it out of the document flow, and give our pull quote
    much more of an “in-content” feel.


    All of this has happened independently of the progress we''ve made with our on-screen
    designs. Essentially, use of media types has allowed us to create two separate
    and distinct “views” of our page: the on-screen (aesthetic rich) version of our
    on-screen design and the off-line (content-overpanic) printed view. One markup
    document is displayed on multiple devices. Style sheets allow us to realize the
    promise of device independence, all the keeping us from those late-night sessions
    of yelling at our computer monitors.


    # The Problem with Choice


    But now that we''ve implemented our media-specific designs, we are in some respects
    back at square one. Now that we''ve allowed the users the ability to choose an
    on-screen design that works most effectively for them, we''ve imposed a print-specific
    sheet on them, with no option to choose it.


    We are asking questions. In short, the answer is, “No.” We go back to our JavaScript-
    PHP-enabled style switches and add in cases for print-specific styles. Of course,
    given the number of different media media possibilities, our scripts (and the
    UI we present to our users) could become prohibitively large and difficult to
    maintain. What we need, then, is an elegant, scalable solution that allows us
    to easily and quickly manage our alternate styles for multiple media types — and
    all without sacrificing usability.


    # Stuff and Nonsense: Building a Better Switcher


    We''re lucky that certain innovative folks are already thinking along these lines.
    Enter Stuff and Nonsense, a design studio (www.malarkey.co.uk/) Based in Wales,
    UK. (Figure 8-11 shows its home page.) A quick browse through the studio''s portfolio
    (www.malarkey.co.uk/Our_work_and_our_clients.aspx) leads to two separate realizations:
    first, that the studio has done eye-catching, beautiful work for such globally
    recognized brands as Disney and the World Wildlife Fund; the design of each of
    their portfolio sites is driven by cascading style sheets, and built upon a foundation
    of valid XHTML.'
