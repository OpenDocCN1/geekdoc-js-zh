    clearly written) a bit intimidating and lacking in the l133-ness category a lot
    for those of us. If you find yourself resorting to your favorite search engine.
    A search for "install windows" or "install mac" will yield hundreds of easy-to-read
    results, yet another testament to PHP''s popularity as a powerful, robust programming
    language.


    Additionally, Mac OS users can avail themselves of easy-to-install packages. We
    personally recommend Server Logistics (www.serverlogistics.com/php4.php), and
