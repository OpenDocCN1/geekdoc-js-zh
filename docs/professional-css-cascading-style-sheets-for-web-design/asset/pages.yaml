  md: "# Chapter 2\n\nIf seeing the box model in resplendent black-and-white leaves\
    \ scratching your head, Web designer\nJon Hicks has built a full-color, three-dimensional\
    \ diagram that might be worth checking out as well\n(www.hicksdesign.com/journal/483/3d_css_box_model/).\n\
    \nNow, the dimensions of “extra” — padding, border, and margin — add to the total\
    \ cal-\nculated width and height of the content area. Let’s look at a style that\
    \ demonstrates this in action:\n\n```\np#hack {\n  border: 20px solid #C00;\n\
    \  padding: 30px;\n  width: 400px;\n}\n```\n\nThe width declares that the content\
    \ within our paragraphs will not exceed 400 pixels. On top of\nthat, we add 10\
    \ pixels of padding and a 10 pixels-thick red border to each of the box — top,\
    \ right, bottom,\nand left. So, if we’re trying to figure out the full, calculated\
    \ width of our paragraphs, we’d move from left\nto right the box’s properties\
    \ and tell the final width:\n\n+   Left Border: 20 +\nLeft Padding: 30 +\nContent:\
    \ 400 +\nRight Padding: 30 +\nRight Border: 20 =\nTOTAL WIDTH: 500 PIXELS\n\n\
    In short, the padding and border are outside the declared width of the content\
    \ area, as the specification\nrequires.\n\nHowever, there are older versions of\
    \ Internet Explorer on Windows that have an incorrect (or more\nspecific, a “non-standard”\
    \ implementation of the box model, and put the border and\npadding inside the\
    \ declared width. Version of 6 is the first to get the calculations right, but\n\
    off if the browser is in standards-compliant — that is, if there is a DOCTYPE\
    \ at the top of your\nmarkup. Otherwise, these browsers see our declared 400 pixels\
    \ as the space into which all\nthe box’s properties — content width, padding,\
    \ and border — must be placed. So, the calculation in\nof these browsers would\
    \ look something like this:\n\n+   Declared Width: 400 -\nLeft Border: 20 -\n\
    Left Padding: 30 -\nRight Padding: 30 -\nRight Border: 20 =\nCONTENT WIDTH: 300\
    \ PIXELS\n\nWhen you’re trying to ensure a consistent design across all browsers,\
    \ a difference of 1 pixel is\nunacceptable — a few hundred are enough to make\
    \ you to run back to your trusty tables.\nThankfully, there’s way out.\n\nIt’s\
    \ worth noting that this rendering bug happens only when an element has a declared\
    \ width and either\npading or borders. Another strategy to avoid this CSS hacker\
    \ is to applying the padding to the ele-\nment’s parent and leave the width on\
    \ the child — or vice versa. Understanding the cause of a rendering\nbug is, more\
    \ important than knowing the hack or fix, and can help you more strategically\
    \ plan\nyour style’s architecture."
