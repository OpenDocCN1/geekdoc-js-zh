  md: '# Blogger: Rollovers and Design Improvements


    # Dealing with Internet Explorer


    As mentioned earlier, IE doesn''t understand the :hover selector on elements other
    than links.


    So, Firefox, Opera, Safari, and IE all understand this:


    ```

    a:hover {

    color: red;

    }

    ```


    But only Firefox, Opera, and Safari understand these:


    ```

    div:hover a {

    color: yellow;

    }

    ```


    Why is that relevant? Well, it affects what we''ve just done in this demonstration.
    Imagine that you''re using Firefox to browse a Web site. The page loads, and CSS
    turns all the text and links to mellow things out for you. You zero in a section
    that interests you. You move your mouse over it and, and, links turn bright blue.
    You can now see what''s a link and what''s plain text.


    Now, imagine you''re browsing the same site using IE. The page loads, and CSS
    turns all the text and links grey. You zero in a section that interests you. You
    move your mouse over it and nothing. No links pop out and you''re left with a
    set of unresponsive grey text. Why? IE doesn''t understand that you''re hovering
    over a div, so it can''t apply a different, brighter style to the links.


    So, you can see why we have to stop the links being turned grey right at the start
    in IE. There''s no point turning them grey if the browser can''t turn them back
    to blue at the appropriate moment. Hence, we use the child selector.


    Now, here''s the bug of using a child selector to hide styles from IE: IE for
    the PC doesn''t understand the child selector (great!), but for the Mac does!


    So any time we use to block IE, we must remember we''re blocking only IE for the
    PC, not for the Mac.


    This wouldn''t be a problem if IE5 for the Mac handled things like :hover on any
    element, but it doesn''t. It''s just as bad as its PC cousin.


    What this is that if you''re at all worried about annoying IE for the Mac users,
    be aware of CSS techniques that use the child selector to hide rules from IE.


    # Changing the Background Position on Links


    The second approach to CSS-based rollovers is one that focuses on swapping not
    just background color, but images as well, and so using the increasingly important
    method of background positioning.


    If you''ve never heard of this idea, then don''t worry; it''s easy as pie, but
    it does require a little explanation.


    147'
