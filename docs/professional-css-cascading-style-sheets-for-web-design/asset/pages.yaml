  md: '# Best Practices for XHTML and CSS


    See the space between &lt; and &gt; in the previous example? This space ensures
    that legacy browsers developed before the XHTML spec can access your content.


    # Lowercase Elements and Attributes


    The HTML specification never mandated a particular letter case for our pages''
    markup elements. As a result, developers have become accustomed to writing elements
    and their attributes in any case at:


    ```

    <P Class=Warning>Alert!</P>

    ```


    In XHTML, elements and their attributes must be written in lowercase. This is
    because XML is case-sensitive. For example, <body>, <Body>, and <BODY> would be
    considered three different elements. Because of this, the attributes of the XHTML
    specification standardized on lowercase:


    ```

    <p class="Warning">Alert!</p>

    ```


    You may notice that we''ve kept the value of Intent for your class attribute.
    This is perfectly acceptable in XHTML while attribute values may be in mixed case
    (for example, pointing the href of a case-sensitive server). However, they must
    be quoted.


    # Every Attribute Requires a Value


    Additionally, there are attributes in HTML that previously didn''t require a value:


    ```

    <input type="checkbox" checked

    <dl compact=">

    ```


    Both checked and compact are examples of "minimized" attributes. They didn''t
    require a value; it was simply enough to declare the attribute and then on. However,
    XHTML mandates that a value be supplied for all attributes. For "minimized" attributes,
    they can be easily expanded like so:


    ```

    <input type="checkbox" checked="checked">

    <dl compact="compact">

    ```


    This is a small distinction but one that''s integral to ensuring your code remains
    valid.


    # Abstracting Style from Structure


    Many standards advocate the "separation of style from structure" as the primary
    benefit of adopting CSS in your site—design—and we agree, with slight qualification.
    As you''ll see in the coming pages, there is never a true divorce between your
    markup and your style sheets. Change the style of the former, and dozens of lines
    in the latter may become obsolete.


    Because your markup and your CSS are quite interrelated, we prefer to think of
    style as abstracted from structure. Your markup primarily exists to describe what
    the content is—however, it will always contain some level of presentational information.
    The degree, however, is up to you. If you choose, you could easily offload the
    presentational work onto the XHTML— replete with font elements, tables, and spacer
    GIFs.


    On another hand, your style sheet can contain rules for all aspects of your design:
    colors, typography, images, even layout. And if these reside in an external style
    sheet file to which your'
