  md: '# Bringing It All Together


    With the foundation set I can now move forward and start working in the design
    for the navigation.


    The design I''ve built for the navigation makes use of three-dimensional-looking
    graphics. The idea of the navigation is to make the menu links look like buttons.
    However, with typical buttons in Web design, the text of the label is "trapped"
    in the image. Designers write the name of the button in Photoshop and export the
    image as a GIF or JPEG file.


    This technique has worked throughout the history of Web design and is perfectly
    acceptable practice. But if I need to edit a label or add a new button, I need
    to make another stop in Photoshop and create new images to upload, as well as
    rework the HTML, if I need to add a new image to the menu. So, I want to be sure
    to use HTML text for the labels because, well, I''m lazy. I don''t want to spend
    my entire life in Photoshop.


    To re-create from Photoshop into Web Document, I want to create a variation of
    Bowman''s excellent Sliding Doors technique (see www.alistaport.com/articles/slidingdoors/).
    Essentially, I want to separate the button graphic into two parts: a top and bottom
    part, as shown in Figure 9-38.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_387_0.png)


    Figure 9-38: Splitting the button into two parts


    Now, I''m going to extend the length of one of the images (as shown in Figure
    9–39).


    ![](img/70fa44d3a461f43c7a35cac2b893273d_387_1.png)


    Figure 9-39: Extending the top portion of the button


    Now that I have the button set, I want to create a set of similar-looking images
    to indicate that the page is currently being viewed. So, with my design for the
    buttons, I create two sets with two images each (as shown in Figure 9-40):


    +   - Off State. Two images that indicate an "off" state

    - On State. Two images that indicate an "on" state'
