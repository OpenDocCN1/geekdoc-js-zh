  md: '# FastCompany.: Building a Flexible Three-Column Layout


    The first rule is our #right selector that''ve been used throughout the chapter;
    the second rule contains the one-two property values that iron out the display
    in IE/5. Surrounding that second rule, however, is the IE/Mac Band Pass Filter
    (Chapter 2 for more information). This oddlooking sequence of characters makes
    the second rule invisible to all users except IE/Mac, ensuring that all of the
    browsers that get math right won''t be affected by a browser-specific hack.


