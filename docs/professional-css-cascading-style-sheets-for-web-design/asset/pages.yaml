  md: "# The Universal Selector\n\nAnother selector with far-reaching authority, the\
    \ universal selector, has a much broader scope than the type selector. Rather\
    \ selecting elements of a specific type, the universal selector quite simply matches\
    \ the name of any element type. Aptly, its notation is the asterisk, or wildcard\
    \ symbol, as shown here:\n\n```\n* {\n  color: #000;\n}\n```\n\nThis rule renders\
    \ the content of every element in our document in black. This is simple enough,\
    \ right? You might not encounter a rule like this too because use of the universal\
    \ selector is a bit by its intimidating scope. Furthermore, there are a few support\
    \ issues with it that might warrant testing. However, we will later discuss specific\
    \ uses for this selector, which sometimes leaves its mark not showing up at all.\n\
    \n# Descendant Selectors\n\nSuppose for a moment that we faced the following markup:\n\
    \n```\n<p>I just <em>love</em> emphasis!</p>\n<ul>\n  <li>Don't <em>you</em>?!</li>\n\
    \  <li>Oh, certainly.</li>\n  <ul>\n    <li>I <em>still</em> love it!</li>\n \
    \ </ul>\n  <li>...</li>\n</ul>\n```\n\nBy default, most browsers render em elements\
    \ in italics—nothing new. But what if we're feeling a bit arbitrary? Let's say\
    \ we want all elements in our ul to be displayed in uppercase. Using we've learned\
    \ up to this point, we could write a rule that uses a type selector, and matches\
    \ on all elements:\n\n```\nem {\n  text-transform: uppercase;\n}\n```\n\nHowever,\
    \ we want to match only the em within the ul—in other words, any ems in the opening\
    \ paragraph should be unaffected by our rule. Simply using the em in our selector\
    \ will match on all ems from our document, so we'll have to be a bit more specific:\n\
    \n```\nul {\n  text-transform: uppercase;\n}\n```\n\nThis rule begins with a descendant\
    \ selector, and tells the browser to \"select all em elements that are descendants\
    \ of ul elements.\" Just as you're a descendant of your parents, and your great-grandparents.\
    \ In this way, em elements at every level of the unordered list would get the\
    \ style applied—even those contained within the ordered list. Most important,\
    \ our rule won't select the em element in the opening p, just as we'd intended."
