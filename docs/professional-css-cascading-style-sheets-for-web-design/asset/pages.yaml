  md: '# HTML 4.01 Elements


    Before you design with CSS, the content in a Web document must be marked up with
    HTML elements. To efficiently make use of CSS, those HTML elements must be used
    correctly by placing the correct HTML element around the appropriate content.


    The following table provides a listing of all the HTML elements in the 4.01 specification
    provided by the World Wide Web Consortium (W3C), the governing body that determines
    Web-related standards. The far-left column shows the name of the element. The
    next column indicates whether the element has a start tag. The next three columns
    describe the element in more detail. If the column has an “O”, it means the part
    of the element is optional. “F” means forbidden, “E” means empty, and “D” means
    deprecated. The DTD column provides information on which Document Type Definition
    an element belongs in. If the element is found only in one kind of DTD, the key
    will be “L” for Loose DTD or “F” for Framethed DTD. The final column provides
    a text description of the element.


