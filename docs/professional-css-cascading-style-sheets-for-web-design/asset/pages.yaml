  md: "# Chapter 2\n\nFigure 2-14 shows the result.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_86_0.png)\n\
    \nFigure 2-14: Applying borders and color to our navigation list\n\nAs you can\
    \ see, we've applied the gray background color to the unordered list directly.\
    \ And by setting the font attributes on the list as well, we can use inheritance\
    \ to a sans-serif font to all elements therein. By default, anchors are rendered\
    \ as inline items. This presents a slight problem for us, because any padding\
    \ we apply will affect only their horizontal edges. Because we want 3 pixels of\
    \ padding on each side of our navigation links, we must turn our links into block-level\
    \ items with `display: block;\n\nHowever, things aren't quite right. You'll notice\
    \ that the border is too thick between the Home and About links, and between About\
    \ Us and Our Products. This is because the border on each item about its siblings,\
    \ creating a doubled-up effect when the links touch. So, we'll have to rethink\
    \ our style slightly:\n\n```\nul#nav li {\n  border-color: #000;\n  border-width:\
    \ 1px 1px 1px 0;\n  border-style: solid;\n  display: block;\n  float: left;\n\
    \  padding: 3px;\n}\n```\n\nFigure 2-15 shows the result.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_86_1.png)\n\
    \nFigure 2-15: Rethinking the borders\n\nThat's more like it. Our more verbose\
    \ border declarations (border-color, border-width, and border-style) achieve the\
    \ same effect as our earlier border: `1px solid #000;`, but the final 0 in our\
    \ border-width declaration instructs the browser to leave off the left-hand border\
    \ from each list item, whereas the top, right, and bottom edges get a 1px-wide\
    \ border applied. Now, we simply need to restore the\n\n62"
