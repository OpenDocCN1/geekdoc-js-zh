    two years ago, thinking it''s best to use "presentational names" as these. By
    naming our elements according to how they look, or where they might be positioned
    on-screen, we''re effectively wedding our markup to one particular specification.
    We should redress our site, what happens when #left div is suddenly displayed
    on the page? Or on the top?


