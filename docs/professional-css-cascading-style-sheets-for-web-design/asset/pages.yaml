  md: '# Summary


    The development of the Web page has been a long road that began with some random
    thoughts in my head and led to the finished product.


    Starting out with planning, I developed the site’s scope. With the scope in place,
    the parameters for the project were set in place as well as determining the content
    and site map. Afterward, I focused on the design of site and creating emotion
    through typography, colors, and layout.


    With the preparation finished, the process of development started. When designing
    with CSS, I followed my mantra of outside-in and top-down by applying styles to
    the body of the page, and then the header, the main column, the side column, and,
    finally, the footer.


    While the development of the Web page may seem to have taken a long time, it would
    have taken longer without the proper planning and the methodical approach to the
    production.


    Remember that when you work on your own projects, set the goal and work diligently.
    Good luck!


