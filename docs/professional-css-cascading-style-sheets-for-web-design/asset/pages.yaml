    # Styling the Blog Posts


    Much like the heading and paragraph in the introductory text, the styling of the
    text in the blog posts is a fairly straightforward exercise. Most blog posts are
    auto-generated by applications such as WordPress (see www.wordpress.org) or Movable
    Type (see www.movabletype.org).


    If you are relying along at home with a decent blogging software package, your
    mileage will vary in how closely your markup matches with yours given the differences
    in each application. However, the markup from these tools will be somewhat similar,
    although you might need to make some adjustments if you want to re-create your
    design.


