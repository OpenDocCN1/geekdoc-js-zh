  md: '# Entering the Head


    The first item in the header is a link for skipping the content portion of the
    Web page. This link allows visitors on a text browser (or people with visual disabilities)
    to skip past the repetition of hearing or seeing the logo and navigation sections
    on page, as shown in Figure 9-11.


    ```

    <body>

    <div id="frame">

    <p><a href="#content">Skip navigation.</a></p>

    </div>

    </body>

    ```


    ![](img/70fa44d3a461f43c7a35cac2b893273d_359_0.png)


    However, I want to hide this link from people seeing the visual design of the
    Web page. To do this, I create a new class selector in the style sheet with its
    sole purpose to keep certain elements of a page hidden from view:


    ```

    .no {

    display: none;

    }

    ```


    Next, I apply the class selector to the markup so that the style sheet hides the
    link and the link is gone, shown in Figure 9-12:


    ```

    <body>

    <div id="frame">

    <p class="no"><a href="#content">Skip navigation.</a></p>

    </div>

    </body>

    ```


    ![](img/70fa44d3a461f43c7a35cac2b893273d_359_1.png)'
