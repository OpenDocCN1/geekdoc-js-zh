  md: "# Chapter 9\n\nThis menu revealed is done by using the specificity in the CSS.\
    \ The CSS selector is instructed to “look” for our markers in the HTML, and, if\
    \ they exist, to apply the styles in the CSS rule. If the markers aren't there\
    \ in the HTML, then the submenu stays\n\nNow, I have the CSS rule working for\
    \ the Publications page at the moment, I want to apply other selectors for the\
    \ other options in the menu. Remember that I want to make this as trouble-free\
    \ as possible. By planning now the time I want to add submenus, I can save myself\
    \ some time in the future. When my future self be grateful that my past self did\
    \ all the work (Well, he'd be\n\nSo, the revised CSS rule looks like this:\n\n\
    ```\n.home-page ul#mainnav li#home-link ul,\n.journal-page ul#mainnav li#journal-link\
    \ ul,\n.work-page ul#mainnav li#work-link ul,\n.pub-page ul#mainnav li#pub-link\
    \ ul,\n.shop-page ul#mainnav li#shop-link ul,\n.about-page ul#mainnav li#about-link\
    \ ul,\n.contact-page ul#mainnav li#contact-link ul {\n  display: block;\n  background-image:\
    \ none;\n  margin: 0;\n  padding: 0 0 7px 0;\n}\n```\n\nThere's one more thing\
    \ to add. I want to change the button on the menu option currently being displayed.\
    \ By using the images that showcase the “on” stage, I give my users more visual\
    \ feedback as I want the location within mine\n\nTo accomplish this visual reinforcement,\
    \ I again use the markers to specifically tell CSS that I want the section currently\
    \ viewed to have different backgrounds than the other options (as shown in Figure\
    \ 9-47):\n\n```\n.home-page ul#mainnav li#home-link a,\n.journal-page ul#mainnav\
    \ li#journal-link a,\n.work-page ul#mainnav li#work-link a,\n.pub-page ul#mainnav\
    \ li#pub-link a,\n.shop-page ul#mainnav li#shop-link a,\n.about-page ul#mainnav\
    \ li#about-link a,\n.contact-page ul#mainnav li#contact-link a {\n  background:\
    \ transparent url(/_assets/img/mainNav/nav_button_on_bottom_item.gif);\n  no-repeat\
    \ left bottom;\n  margin: 0;\n  padding: 0 0 4px 0;\n}\n```\n\n370"
