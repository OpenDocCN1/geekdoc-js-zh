  md: '# Chapter 7


    Sometimes it takes showing, rather than explaining. But I think as more and more
    sites are utilizing CSS, it is only getting easier to sell the technology to clients
    and internal Web teams. It will soon, we hope, become commonplace and used.


    Q: In a time when most sites were adopting straightforward fixed-width layouts
    as they bootstrapped themselves with CSS skills, Fast Company chose to go with
    a flexible approach. What drove that decision?


    A: The decision to go flexible hinged on a few different things. Probably the
    main reason was the large advertisement that was required to "float" inside the
    article body text. At a resolution of 800 × 600, a particular unit would wrap
    the script to an almost unbearable length. But this advertisement also paid the
    bills—it was a requirement that we had to work around. So, going with a flexible-width
    layout that users with a higher screen resolution could adjust the window to a
    more readable size. We also wanted the option to be for a portion of our audience.


    But going flexible also meant a certain level of design constraint. We had to
    account for the fact the window could be at any time—and that can be challenging
    when designing.


    Q: Are there any aspects of the site''s design that you''re most proud of?


    A: I''m proud of the image-based tab navigation that I built for the site after
    the redesign was complete. I joined a few CSS techniques that were being invented
    at the time—the result was a navigation system that used semantic markup [unordered
    list], which was image-based in order to fit large number of objects in a fixed
    horizontal scale.


    I''m also proud of the lengths we took to make things easy to change and update
    later on. For instance, the little colors that sit next to the site''s headings
    are transparent, and the color filled in CSS. Changing the color palette of the
    entire site was as easy as changing a few lines of code.


    Related to that, I''m proud that the site stood the test of time. It was certainly
    never perfect, and there are many things I would do if we redesigned today—the
    fact that the core design has used so long [as of this writing] is a testament
    that it was success.


    Q: What about second thoughts? After a few years, are there any things you would''ve
    done differently?


    A: Oh, I''m sure of many things I wish I had done differently. I was still learning
    CSS during the redesign of Fast Company, and there were others generally sharing
    their knowledge and experience at the time, far more knowledge is out now. For
    instance, the accessibility concerns regarding image replacement techniques weren''t
    documented at the time. New ways to combat IE bugs weren''t invented yet. I''m
    sure, many things could have been simplified from a CSS and markup angle.


    But it''s a constant learning experience. Even the sites I build today, I''m sure
    I''ll want to change them down. The ebb and flow of the Web is what makes it interesting
    and fun.


    Q: Speaking generally so, what is it that keeps you interested in Web design?
    What keeps you fired after all years?


    A: Well, I think constant ebb and flow I mentioned is part of it. I know how there''s
    something new happening—a new technique to learn, a new technology to explore.
    It means to never settle. The flip side is that it can be frustrating unstable.
    It''s the balance between the sweet spot.


    I also love Web design because of its marriage of art and technology. I have a
    certain need to create things—anything. Music, food, photography, and so on, and
    Web design seems like a


    244'
