  md: '# Introduction


    # Conventions


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    | Boxes like this one hold important, not-to-be-forgotten information that is
    directly relevant to the surrounding text. |


    Tips, hints, tricks, and asides to the current discussion are offset and placed
    in italics like this.


    As for styles in the text:


    +   - We highlight important words when we introduce them.

    - We show keyboard strokes like this: Ctrl+A.

    - We show filenames, URLs, and the code within the text so: persistence.properties.

    - We present code in two different ways:


    ```

    In code examples we highlight new and important code with a gray background.

    ```


    The gray highlighting is not used for code that''s less important in the present
    context, or has been shown before.


    # Errata


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, such as a spelling mistake or faulty piece of code, we would
    be very grateful for your feedback. By sending in errata you may save another
    reader of frustration and at the same time you will be helping us provide higher
    quality information.


    To find the errata page for this book, go to www.wrox.com and locate the title
    using the Search box or one of the lists. Then, on the book details page, click
    the Errata link. On this page you can view all errata that have been submitted
    for this book and posted by W. A complete book list including links to each book''s
    errata is also available at www.wrox.com/misc-pages/booklist.html.


    If you don''t spot "your" error on the Book Errata page, go to www.wrox.com/contact/techsupport.shtml
    and complete the form to send us the error you have found. We''ll check the information
    and, if appropriate, post a message to the book''s errata page and fix the problem
    in subsequent editions of the book.'
  merge: -1
