  md: "# The PGA Championship\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_187_0.png)\n\
    \nFigure 4-5: The clipboard pasted into a new document and magnified for detail\n\
    \nTook care of the shadow itself, the lighter gray background that ran under the\
    \ left column had to be addressed. To do this, the canvas size of the graphic\
    \ was increased to the pixel width required and with the shadow aligned to the\
    \ right. And as shown in Figure 4-6, the transparent area was filled with the\
    \ left column's hex color, and the whole graphic was as a GIF file.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_187_1.png)\n\
    \nFigure 4-6: Final background image containing the left column's background color\
    \ and drop shadow\n\nLet's back up a moment and discuss image file formats. Why\
    \ was GIF used, but not PNG as discussed? The culprit is Internet Explorer, and\
    \ its famously poor support of PNG. Nearly eight years ago, Microsoft tweeted\
    \ in a blog post that version 4.0 of their browser would \"provide native support\"\
    \ for PNG, unlike \"other browsers [who] include PNG support as a third-party\
    \ option.\\. Sadly, it 4,0 didn't fulfill the claim, and eight years later they've\
    \ yet to fully support it in their designs—if, of course; Microsoft ever follows\
    \ through.\n\nSo, for now, GIF was the way to go for both cross-browser support\
    \ and the lossless compression non-photographic content required.\n\nNow, let's\
    \ look at the CSS again. In the style sheet, a \"container\" was created with\
    \ a div—an outer framework for positioning groups of content (which, in this case,\
    \ were the left and right columns). As content inside each column grew vertically,\
    \ the outer container expand accordingly. This is precisely why the background\
    \ image was applied to the container and not to the columns—the image would be\
    \ repeated the regardless of the interior content's length. To set this up in\
    \ CSS, the following was created in the style sheet.\n\n```\n#wrap {\n  width:740px;\n\
    \  background:#96968c\n  url(http://i.com/pga/pgachampionship/img/bg_home_content.gif)\
    \ repeat-y;\n}\n```\n\n163"
