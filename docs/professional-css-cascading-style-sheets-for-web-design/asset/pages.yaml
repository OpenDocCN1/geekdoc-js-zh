    \ that's one of the things we're trying to achieve here — calm.\n\n```\ndiv#links\
    \ {\n  color: #333;\n}\n```\n\nNext, we style the links so that they fit in the\
    \ gray text, removing anything that would make them stand out from their surroundings.\n\
    \n```\nhtml body div#links li a {\n  color: #333;\n  text-decoration: none;\n\
    }\n```\n\nWe use the child selector (>) to style the links so that IE (which doesn't\
    \ interpret rules containing the child selector) won't apply the rule. For a full\
    \ explanation of why we do this, see the following section, \"Dealing with Internet\
    \ Explorer.\"\n\nNow come two :hover rules. The first will be activated when the\
    \ user moves over the div. It will cause the links to change from gray to blue\
    \ and show their underline decoration.\n\n```\nlinks:hover li a {\n  color: #0000ff;\n\
    \  text-decoration: underline;\n}\n```\n\nThe second :hover activates when the\
    \ user moves the mouse directly over a link. It changes the text color to black,\
    \ removes the underline, and makes the background of the link bright yellow.\n\
    \n```\nlinks ul li a:hover {\n  background-color: #ffff;\n  color: #000;\n  text-decoration:\
    \ none;\n}\n```\n\nAnd that's all there is to it.\n\n146"
