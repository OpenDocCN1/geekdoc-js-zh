    # From Inventory to Hierarchy


    So, how do we begin to make sense of our Web site so that others might do the
    same? To begin, it helps to consider your site not as a mass of pages, but as
    a hierarchy of information. In fact, it''s no accident that most site maps look
    something like a tree: the home page at the top (or root) of the tree, with the
    various areas of the site branching out from it. As users traverse through the
    different levels of the tree, each branch becomes more specialized than the one
    that precedes it. Traveling from the root of the site down to the individual pages,
    the user is drilling through these branches to find the content that matters to
    them. Because of this, it''s your responsibility to make the order of these branches
    as intuitive as possible.


    So, let''s say that after an exhaustive amount of research and user interviews,
    we discover that the audience for WebMag 5000 can be broken into three types of
    users:


    +   - **Readers.** These people are most interested in the reviews, articles,
    and tutorials published on our site. They''re mainly consumers of information,
    so it''s important to give them the information they need as quickly as possible.


    +   - **Writers.** In one sense, this group is the indeed of our ''zine''. Because
    all of our writers work on a volunteer basis, we must create a prestigious home
    on our site for the features they produce. Their name—and their work—should be
    featured prominently, in the hopes that they''ll provide additional content in
    the future.'
