  md: '# Stuff and Nonsense: Strategies for CSS Switching


    The onclick attribute we introduced here is as an event handler. When the user
    performs a action or "event" (such as, in this case, a mouse click), the JavaScript
    in the attribute value is fired. So, in the preceding example, the onclick handler
    will detect when the user clicks on the anchor, and will fire in the term activeCSS().


    Strictly speaking, you could argue that use of these event handlers, such as onclick,
    onblur, onmouseover, and so on, is analogous to relying on the style attribute—that
    these lines include the structure of behavior and behavior, and can easily increase
    the cost of maintenance and support. Rather than editing your XHTML to reflect
    any changes in the JavaScript, it would be possible to use more modern JS to automatically
    generate the event handlers we will need, and however, keep the necessary editing
    between our markup and our scripting. For more information, recommend Peter Paul-Koch''s
    "Separating behavior and structure" (http://digital-web.com/articles/separating_behavior_and_structure_2/).


    However, as we look closely at the three different handlers, we can see that activeCSS()
    differs slightly. Between the parentheses, we''ve included the title of the style
    link we should activate. This is the argument we mentioned earlier and is the
    string of text that the activeCSS() function compares to the title of each link
    element.


    You may have noticed that the call to activeCSS(), the onclick handler contains
    some additional text: return false; this plays a very small (but integral) part
    in our switcher because it lets the handler not to follow the URL referenced in
    the anchor''s href attribute. Otherwise, the user would end up on stylesheet.html
    clicking any of the links.


    So, let''s do a bit of role-playing. Let''s just run through the steps that when
    we click a link. For our argument''s sake (oh, aren''t we?), let''s assume we
    use selectors select the third anchor, the onclick handler that contains the activeCSS(''Gratuitous
    CSS'');: reference:


    +   1. The three link elements are compiled into an array, and the function proceeds
    to loop over each of them. We remember that only those links that contain title
    and that have a rel attribute that contain the word "stylesheet" will be examined.
    This leaves us with the links for contrast.css (refer to Listing 8-4) and hot.css
    (refer to Listing 8-5).

    2. The first link element has a title of "Higher Contrast". The function disables
    the link element. Because its title doesn''t match our function''s (''Gratuitous
    CSS''), it stays disabled.

    3. The second link element has a title of "Gratuitous CSS". The function disables
    the link element. Because the title matches our function''s argument, the link
    is immediately reactivated.


