- img_proc: true
  md: '# Summary


    In this chapter, we''ve seen the benefits that can come from applying class or
    ids high up in the document tree and how ESPN.com uses this simple technique to
    induce drastic layout changes in their site. We''ve also looked at CSS 3, the
    CSS of tomorrow, and glimpsed the power that its advanced selectors will bring
    to our work. By obtaining an awareness of the high-end of CSS selectors, we''re
    not only preparing ourselves for tomorrow, but we''re also raising our expectations
    of the capabilities of CSS. This, in turn, leads to a more inventive and adventurous
    approach to solving CSS issues.


    In the next chapter, we''ll take a look at creating three-column layouts with
    a case study of Fastcompany.com.'
