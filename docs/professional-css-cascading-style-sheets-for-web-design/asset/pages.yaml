  md: '# Chapter 3


    # Dealing with Internet Explorer


    Unfortunately, and unlike the previous section, there''s no wonderfully easy way
    to give IE users a taste of what we''ve done here (see Figure 3-49). After a bit
    of margin-tweaking to remove the gaps at the top and bottom of the box, IE users
    will have to be satisfied with the carefully thought-out color scheme, the excellent
    use of space, and the overall feeling of calm that blogger.com''s layouts bring.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_142_0.png)


    Figure 3-49: No lovely styling for IE


    Of course, if it that IE users use your rounded corners, then you can''t use this
    technique. You''ll have to resort to the less elegant method of inserting a series
    of divs in XHTML.


    # Better Thinking Through Pseudo-Elements


    You should have a fair understanding of the capabilities of the :before and :after
    pseudo-elements. They really are wonderfully powerful.


    One of their benefits is that they allow you to change your markup mindset. No
    longer should your first thought be "Well, I have to add in a whole bunch of divs
    to build this layout." You now have a set of tools that let you say, "Can I build
    this layout without altering the XHTML markup in any way?"


    As CSS grows more powerful, and as browsers become better at interpreting it,
    this thought process become second nature to all of us.'
  merge: -1
  pgno: 142
