- img_proc: true
  md: '# Chapter 4


    ![](img/70fa44d3a461f43c7a35cac2b893273d_186_0.png)


    You might be wondering why the graphic was saved as a PNG instead of a JPEG file
    types. This is because PNG is the preferred format when importing bitmaps into
    Flash with 256 levels of transparency. This enables you to export detailed images
    from your favorite bitmap editor (Photoshop, Fireworks, and so on), import them
    into Flash, and publish movies that retain their transparent data while simultaneously
    applyingy JPEG compression. It is literally the best of both worlds — the visual
    quality of the PNG file with the small file size of a JPEG.


    With the Flash movie, next up would be replicating the shadow using CSS/XHTML.
    Because the shadow would run all the way down the length of the page, and the
    browser to automatically repeat the shadow effect for as long as there was content,
    a "replicable" section of the graphic was needed. This required a graphic that
    could be vertically tiled (one after another other) without gaps, seams, or anomalies.
    So, as shown in Figure 4-4, an 1 pixel high was selected, making sure to include
    some of the background color for a smooth blend.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_186_1.png)


    Figure 4-4: Using the Rectangular Marquee tool, a repeatable area 1 pixel high
