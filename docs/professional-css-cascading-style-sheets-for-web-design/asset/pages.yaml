  md: '# ESPN.com: Powerful Layout Changes


    The following selects selects all images that have a title attribute:


    ```

    img[title]

    ```


    Following is an example of what it selects (shown in bold):


    ```

    <img src="pants.png" />

    <img src="socks.png" title="These are my socks!" />

    <img src="shoes.png" />

    ```


    The following selects all input elements whose type has a value of text:


    ```

    input[type="text"]

    ```


    Following is an example of what it selects:


    ```

    <form>

    <input type="text" name="name" />

    <input type="text" name="email" />

    </form>

    ```


    The following selects all links whose rel attribute value is a list of space-separated
    values, one of which is exactly met:


    ```

    a[rel="*met"]

    ```


    Following is an example of what it selects:


    +   <ul>

    <li><a href="http://sideshow.com/" rel="colleague friend">Sideshow</a></li>

    <li><a href="http://mezzoblue.com/*" rel="colleague">Mezzobubble</a></li>

    <li><a href="http://photomatt.net/" rel="friend colleague">Matt</a></li>

    </ul>


    The following selects all links whose rel attribute value begins exactly with
    colleague:


    ```

    a[rel="colleague"]

    ```


    Following is an example of what it selects:


    +   <ul>

    <li><a href="http://sideshow.com/" rel="colleague friend">Sideshow</a></li>

    <li><a href="http://mezzoblue.com/*" rel="colleague">Mezzobubble</a></li>

    <li><a href="http://photomatt.net/" rel="friend colleague">Matt</a></li>

    </ul>


    The following selects all links whose rel attribute value ends exactly with colleague:


    ```

    a[rel$="colleague"]

    ```'
