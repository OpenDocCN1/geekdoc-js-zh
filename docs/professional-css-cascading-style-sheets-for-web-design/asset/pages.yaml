    \nPardon us we pause for breath—that was a bit of a rush, wasn't it? Rather than\
    \ adding a few selectors at time and discussing the visual result, we're taking\
    \ a less Socratic approach in this chapter. The focus here is less on the style\
    \ sheet contains until the end result gained by switching them. After all, CSS\
    \ is merely a placeholder, one that could easily be replaced by our own efforts.\
    \ With that, we won't bother to press this one. Following are a few techniques\
    \ well describing.\n\n+   #container (margin: 0 auto); While in the audience might\
    \ be tut-tutoring out of a div with no semantic worth, our #container establishes\
    \ a manner of controlling the width of the content within it. Setting-left and\
    \ right-hand \"auto\" (0 auto); allows us to horizontally center the div within\
    \ its parent element—the body of our markup.\n\n+   #container { max-width: 60em;\
    \ }; Setting the max-width property completes the effect, ensuring that the #container\
    \ never gets larger than 60ems. If the user reduces the size of his or her window\
    \ below the width of #container, then the div will shrink accordingly. In short,\
    \ it's a no-hassle way to gaining a truly flexible layout."
