  md: '# Chapter 7


    The visual aspect of the site''s design aside, however, the new site was a technical
    win as well. With pages that held the weight as their table-heavy predecessors,
    the site was not easier for Fast Company''s production staff to maintain, it was
    also extremely kind to users'' whose designs separated production out of the site''s
    markup and external style sheets, FastCompany.com became accessible to a wider
    range of devices that would be otherwise hindered by the site''s design. These
    devices included not only ancient browsers and such alternative technology as
    assistive and handheld equipment, but also search engines.


    So, in all, the redesign was a success — for the company, for its users, and for
    the burgeoning CSS community. Who, then, was responsible for it?


    # Meet the Designer: Dan Cederholm


    The architect behind Fast Company''s high-profile redesign was Dan Cederholm,
    a multitented designer, developer, and author. A vocal proponent of high-powered
    design using CSS and XHTML, Cederholm is also the founder and author of SimpleBits
    (http://simplebits.com/), a site that serves as a home to his Boston-area web
    design consultancy (http://simplebits.com/work/) as well as a personal journal
    of sorts (http://simplebits.com/notebook/).


    While Cederholm came into the spotlight with his one-to-all CSS redesigns of Fast
    Company and its site, Inc.com (http://inc.com/) remained prolific with such choices
    as Google, ESPN, and Staples. The reason for that is how much of Cederholm''s
    philosophy can be summed in one word: detail. A noticed aficionado of pixel, Cederholm''s
    attention to even the finest points of a page''s design is inspiring. Whether
    it is as expansive as Fast Company or as a single search results page he creates
    designs that are simultaneously beautiful, meticulous, and painfully well-coded.


    In the following question-and-answer session, Cederholm discusses some of his
    influences, his career on the Web, the impact of video games on a designer''s
    development — all giving us a glimpse into his creative process.


    +   Q: Mr. Cederholm — kindly pull up a chair.


    +   A: Why, thank you. Don''t mind if I do.


    +   Q: From reading SimpleBits, one will come to know you as many of many interests:
    you''re a prolific writer, one-time rock musician, and an aficionado of fine black
    pepper. So, how is it, exactly, that you got into Web design?


    +   A: For me, getting into Web design was an evolutionary process. One could
    trace the birth back to an obsession with early video games — the ability to control
    colored pixels on a screen. But there are a few milestones that others, and I
    imagine other designers have similar stories.


    +   My first Mac was the all-in-one Classic II, and it was used heavily that the
    AOL first surged popularity just before the Web took off. I was immediately fascinated
    by "online world" of chat rooms, e-mail, instant information, and so. After that,
    I was sitting in a desk job at a record label in the Boston area (Rounder Records)
    and for the first time had the following: a constant Internet connection, access
    to the burgeoning World Wide Web, and a disinterested in my actual job entailed.
    I was captivated by the Web — its convergence


    242'
