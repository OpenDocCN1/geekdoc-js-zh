  md: '# Blogger: Rollovers and Design Improvements


    In August 1999, a small company known as Pyra Labs released a new product called
    “Blogger” to the Web. Not only would it go on to team fame and fortune, it would
    also kick-start the blogging revolution.


    Blogger lets people like you, your friends, and really anyone publish a Web site,
    or more simply, a blog. It makes this process simple, fast, and really friendly
    indeed. It is also free, which is a bit of a bonus on the Web, where no one wants
    to pay for anything.


    In February 2003, a company Google (you might have heard of them) whipped out
    their checkbook and acquired Pyra Labs, bringing Blogger into the Google fold.
    Along with the contracts and finding something rather nice as far as Blogger Team
    was concerned: the appearance of a BlogThis! button on the Google Toolbar. The
    overwhelming number of people using the Google Toolbar each day enabled blogger.com
    to experience a huge surge in traffic. Signups had gone through the roof. But
    they didn''t. What was going on?


    A few phone calls later and user experiences Adaptive Path were on the case. With
    them designer and CSS maestro Douglas Bowman of Software. Together they would
    examine the behavior of visitors to blogger.com and realize that something fundamental
    was stopping the conversion of these new visitors to new customers: the design
    of the site itself.


    Plans were drawn up, ideas banded about, and eventually, after 6 months of development,
    a new design was released. Blogger.com had a new face, and it would come (one
    hoped) a mass of new customers.


    Bowman''s redesign of blogger.com involved a number of subtle (yet effective)
    design touches: rounded corners, rollovers on links, graphical buttons, whose
    borders faded to nothing, and a delightfully simple method of style-switching
    put in place to help visitors, but to aid the Blogger Team in the production of
    the site.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Chapter 3


    This chapter discusses some of these design touches and looks at how to re-create
    them using the cleanest XHTML and the cleverest CSS today. We also touch upon
    issues these solutions have with Internet Explorer (IE), and provide workarounds
    (where possible) for this troublesome browser.


    This chapter should provide some understanding of what is possible if your first
    thought is not, "Does this work in Internet Explorer?" rather "What is the cleanest,
    most forward-looking way I can build this?"


    The solutions provided might not be suitable for you to push into production (that
    decision is up to you), but they provide a starting point in the development process.
    Kick off with an ideal solution, and then work your way until you reach a practical
    solution. For many developers, those two points may be one and the same, in which
    case techniques described here can be slotted into the next site you build. For
    others, there may be some distance between those two points, with more weight
    being given to ensure a design 100 percent on IE and least weight given to the
    cleanliness of the solution.


    So, read the chapter, take the lessons, and decide, project by project, Web site
    by Web site, to what extent you compromise your ideal solution.


    # Interviewing the Designer


    Douglas Bowman is an influential designer whose highly publicized and hugely successful
    redesignes of sites such as Blogger, Wired News, and Adaptive Path have pushed
    him to the forefront of standards-compliant Web Design. He is the principal of
    Topdesign, a design consultancy based in San Francisco, California.


    +   **Q:** First, are you pleased with how things have turned out?


    +   **A:** I''m pleased with results of the entire project. The first measure
    of success in any project is whether or not we met the client''s goals. Usually,
    if the client is happy, I''m happy. In this case, one of the project''s goals
    was to increase user sign-ups. Another goal was to increase use (by their existing
    base) of Blogger. I can''t be specific about numbers, but I can say that end results
    exceed Google''s expectations.


    +   **Q:** Which bit of the design is the internal team most pleased with? Which
    part are the site visitors most pleased?


    +   **A:** I think probably depends on whom you ask the team. From talking with
    the developers and engineers at Google, I think they''re most pleased with the
    design system, and how easy it is to expand and tweak the pages. The design is
    simple and straightforward. Obviously, it uses simple HTML and an all-CSS layout.
    Google ended up taking the XHTML templates for the home page and registration
    pages, and used them as a base to redesign the entire application. In addition
    to the required page types Google needed from us, we also provided some generic
    templates that they''re able to quickly grab and repurpose for new sections of
    the site.'
