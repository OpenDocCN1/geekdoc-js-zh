  md: 'CSS of tomorrow. Some of today''s browsers (Firefox, Opera, Safari) already
    support bits of CSS Level 3

    (:first-child and :last-child being two examples), but on the whole, that page
    tends to dis-

    appoint the adventurous coder. That said, it''s still an important document. It
    gives us a glimpse of

    world we''ll be working in tomorrow, and if we use our brains, adds practical
    weight behind

    the idea of separating structure and style.


    Let''s take a look at some of the goodies CSS has in store for us...


    # A Big List of Exciting Selectors


    The following table shows the syntax of selectors, the result, and the selector
    type.


    | Selector Syntax | Result | Selector Type |

    | --- | --- | --- |

    | E[foo] | Matches an E element with a foo attribute. | Attribute selector |

    | E[foo="bar"] | Matches an E element whose foo attribute is exactly equal to
    "bar". | Attribute selector |

    | E[foo="bar"] | Matches an E element whose foo attribute is a list of space-separated
    values, one of which is exactly equal to "bar". | Attribute selector |

    | E[foo^="bar"] | Matches an E element whose foo attribute begins exactly with
    the string "bar". | Attribute selector |

    | E[foo$="bar"] | Matches an E element whose foo attribute ends exactly with the
    string "bar". | Attribute selector |

    | E*="bar"] | Matches an E element whose attribute value contains the substring
    "bar". | Attribute selector |

    | E[foo|="bar"] | Matches an E element whose foo attribute has a hyphen-separated
    list of values (from the left) with "bar". | Attribute selector |

    | E:nth-child(n) | Matches an E element, the nth child of its parent. | Structural
    pseudo-class |

    | E:nth-last-child(n) | Matches an E element, the nth child of its parent, counting
    from the last one. | Structural pseudo-class |

    | E:nth-of-type(n) | Matches an E element, the nth sibling of its type. | Structural
    pseudo-class |

    | E:nth-last-of-type(n) | Matches an E element, the nth-sibling of its type, counting
    from the last one. | Structural pseudo-class |

    | E:first-child | Matches an E element, first child of its parent. | Structural
    pseudo-class |

    | E:last-child | Matches an E element, last child of its parent. | Structural
    pseudo-class |

    | E:first-of-type | Matches an E element, first sibling of its type. | Structural
    pseudo-class |

    | E:last-of-type | Matches an E element, last sibling of its type. | Structural
    pseudo-class |

    | E:only-child | Matches an E element, only child of its parent. | Structural
    pseudo-class |


    Table continued on following page'
