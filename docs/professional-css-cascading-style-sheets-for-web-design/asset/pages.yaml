  md: "# Chapter 2\n\nTwenty-four lines of code — about 1KB of data — might seem rather\
    \ innocuous when contained to one code snippet in a Web design book, but consider\
    \ that the code spread across twenty pages of your site — or a hundred, a thousand.\
    \ What happens when you are asked to modify this code? Perhaps your marketing\
    \ department needs the gray background universally changed to a light green, or\
    \ they've standardized using Arial as their corporate typeface. In either event,\
    \ you'll need to edit, test, and redeploy the markup used on each of these 20,\
    \ 100, or 1,000 pages to meet their requirements.\n\nSuffice to say that this\
    \ isn't exactly an appealing prospect to us. Frankly, we can use what we've learned\
    \ about HTML and CSS to improve this navigation bar, as well as make our lives\
    \ easier. First, we'll start with some fresh markup. Rather than relying on the\
    \ bloated, font-heavy table from before, let's take a different approach.\n\n\
    ```\n<ul id=\"nav\">\n  <li class=\"first\"><a href=\"home.html\">Home</a></li>\n\
    \  <li><a href=\"about.html\">About Us</a></li>\n  <li><a href=\"products.html\"\
    >Our Products</a></li>\n</ul>\n```\n\nThat's right, this is a simple unordered\
    \ list. As mentioned earlier in the chapter, we don't need to be worried about\
    \ presentation at this level. We just need to ensure we're marking up our content\
    \ in a sensible way, which is exactly what we've done. So, we will have our humble\
    \ beginnings, as shown in Figure 2-11.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_84_0.png)\n\
    \nFirst, let's get rid of that seemingly bulleted look — that's so 1996.\n\n```\n\
    ul#nav, ul#nav {\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n```\n\n\
    Figure 2-12 shows the result.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_84_1.png)\n\
    \nFigure 2-12: An unordered list . . but sans bullets"
  merge: -1
