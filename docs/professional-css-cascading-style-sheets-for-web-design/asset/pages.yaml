    I suppose if I think about it, what examples have in common are that they both
    designed to engage an audience, drawing them into a different world. It''s about
    communicating messages and so we go back to the subject of the Web.


    Q: Are there any CSS issues that you face more regularly than others? How do you
    work through them?


    A: CSS issues are rarer for me and when one raises its ugly, there is a solution
    to be found by doing a bit of Google. Many people with bigger brains than mine—Brothercake,
    Dave Shea (http://mezzblue.com), Doug Bowman (http://topdesign.com/), and John
    Gall immediately spring to mind—have solutions to browser bugs and behaviors I
    would never have dreamt of. There are times when I curse one browser or another
    and will say "This would be sooooo easier with tables!" But those outliers are
    rarer.


    There are now ways to fix or work around almost every CSS issue and when one appears
    unexpectedly, it is important to take a logical approach, as some element combination
    with another will trigger a problem.


    Validation is extremely important and ensuring that my code validates my first
    before I even open a CSS file. If my code CSS validate and the problem still appears,
    I deconstruct the page, removing elements in turn that I can see what element
    is straining my sanity.


    Many browsers are so well-known that sites use Everything (www.positioniseeverything.net/)
    are dedicated to them. If an answer can''t found on PIE or many other sites, I
    recommend asking a question of the many experts who contribute to Eric Meyer''s
    (www.meyer.com) excellent CSS-D mailing list (http://css-discuss.org/). Ask nicely
    and you''re likely to find a helpful soul with a solution.


    Q: What exactly do you look for in a "successful" site design? Are any design
    principles you hold dearly?


    A: I suppose that I''m not the best person to judge whether or not a design is
    successful, but I do to listen to feedback from clients and customers. What matters
    to me is that the project has made good business for the client who pays my wages.
    What to me, I hope that they will keep coming back.'
