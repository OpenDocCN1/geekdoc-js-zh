    # Another Solution We (Almost) Can''t Quite Use


    As with some of the most promising features of CSS, adaption of alternate style
    sheets would be more widespread if browser support were more robust. As of this
    writing, the number of browsers that natively allow users to select alternate
    style sheets is limited to Gecko-based browsers such as Mozilla for Firefox, and
    the Opera browser. For example, Apple''s Safari has no way to select alternate
    or preferred style sheets. And, you guessed it, Internet Explorer (the browser
    known and loved the world over) won''t allow users to select the alternate interface
    we build for them. For the world''s most popular browser keeps this feature out
    of all of our users, then we have a bit more work to do.


