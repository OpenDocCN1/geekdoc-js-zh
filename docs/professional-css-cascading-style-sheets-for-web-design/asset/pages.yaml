    # Building Three Columns:

    Laying the Foundation


    Just as when we converted the Harvard University page to an all-CSS/XHTML layout
    (see Chapter 2), our three-column layout must be founded upon lightweight, well-meaning
    markup. To do so, we begin by taking a quick inventory of the content areas on
    the page (see Figure 7-8).'
