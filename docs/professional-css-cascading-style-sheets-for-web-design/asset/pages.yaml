  md: "# Chapter 3\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_150_0.png)\n\nHow easy\
    \ is that? See how easy Bowman made it for the Blogger Team to mix and match the\
    \ layout of their pages?\n\nLet's see the XHTML and CSS that allows this swapping\
    \ to occur.\n\n# The XHTML\n\nThe following is:\n\n```\n<body>\n\n<div id=\"header\"\
    >\n</div>\n\n<div id=\"body\">\n  <div id=\"main\">\n  </div>\n  <div id=\"sidebar\"\
    >\n  </div>\n</div>\n\n</body>\n```\n\n126"
  merge: -1
  pgno: 150
- img_proc: true
  md: "# Blogger: Rollovers and Design Improvements\n\n# The CSS\n\nThe following\
    \ is the CSS. (This is a simplified set of styles, dealing with layout only. Colors,\
    \ borders, and so on have been left out.)\n\n```\ndiv#body {\n  margin: auto;\n\
    \  width: 710px;\n}\nndiv#sidebar {\n  display: none;\n}\nnbody.ms div#main,\n\
    body.sm div#main {\n  width: 490px;\n}\nnbody.ms div#sidebar,\nbody.sm div#sidebar\
    \ {\n  display: block;\n  width: 200px;\n}\nnbody.ms div#main,\nbody.sm div#sidebar\
    \ {\n  float: left;\n}\nnbody.sm div#main,\nbody.sm div#sidebar {\n  float: right;\n\
    }\n```\n\n# What Does It All Mean?\n\nOkay, let's break CSS down rule by rule.\n\
    \nFirst off, let's look at the styling for the body div. The div helps constrain\
    \ everything and provides room for the two divs (main and sidebar) to side by\
    \ side (when they need to). We set its width at 710px, and set margin-left and\
    \ margin-right values to auto to center the content:\n\n```\ndiv#body {\n  margin:\
    \ 0 auto;\n  width: 710px;\n}\n```\n\nThe default style for div#sidebar. Unless\
    \ some kind of class is specified in the body tag, the sidebar div will not be\
    \ displayed and will be removed from the document flow.\n\n```\ndiv#sidebar {\n\
    \  display: none;\n}\n```"
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Chapter 3\n\nIf a class has been specified, then the following rule will\
    \ constrain the width of div#main to 490px (from its browser default of 100 percent)\
    \ to make room alongside it the sidebar:\n\n```\nbody.sm div#main,\nbody.sm div#main\
    \ {\n    width: 490px;\n}\n```\n\nIf a class has been specified, we must also\
    \ set some styles that will be applied to the sidebar div:\n\n```\nbody.ms div#sidebar,\n\
    body.sm div#sidebar {\n    display: block;\n    width: 200px;\n}\n```\n\nThe display:block\
    \ counters the display:none (which we set as our default style for the sidebar),\
    \ making it visible. We also set the sidebar's width to 200px.\n\nNow that we've\
    \ set the display and widths of the main and sidebar divs, it's time to position\
    \ them on the left or right. We'll do this by using floats, to save space in our\
    \ CSS file, we're going to combine with be four rules (two for the main div, and\
    \ two for sidebar div) into just two rules.\n\nThe first rule floats divs left.\
    \ For the main div, this rule will be applied when the body tag has the class\
    \ ms applied to it. For the sidebar div, this rule will be applied when the body\
    \ tag has class sm applied to it.\n\n```\nbody.ms div#main,\nbody.sm div#sidebar\
    \ {\n    float: left;\n}\n```\n\nThe second rule floats divs right. For the main\
    \ div, this rule will be applied when the body tag has the class sm applied to\
    \ it. For the sidebar div, this rule will be applied when the body tag has class\
    \ ms applied to it.\n\n```\nbody.ms div#sidebar {\n    float: right;\n}\n```\n\
    \nAnd that's all there is to it. By simply altering the class of the body tag,\
    \ members of the Blogger Team can easily (and quickly) affect the layout of the\
    \ page. This is yet another example of why CSS is so darned good.\n\n# 128"
  merge: -1
  pgno: 152
- img_proc: true
  md: "# CSS-Enabled Rollovers\n\nIf there's one thing that has helped to simplify\
    \ the Web, it's the humble rollover—the act of swapping one image (or color) for\
    \ another when the user moves the mouse over a section of the page. Until 2001,\
    \ the only reliable way to achieve such an effect was by breaking out JavaScript\
    \ and writing something like this:\n\n```\n<html>\n<head>\n<title></title>\n<script\
    \ type=\"text/javascript\">\n--\n{\nfunction SwapOut() {\n  document.getElementById('picture').src\
    \ = 'picture-rollover.jpg';\nreturn true;\n}\nfunction SwapBack() {\n  document.getElementById('picture').src\
    \ = 'picture.jpg';\nreturn true;\n}\n--\n</script>\n</head>\n<body>\n<p><a href=\"\
    *\" onmouseover=\"SwapOut()\" onmouseout=\"SwapBack()\"><img id=\"picture\" src=\"\
    picture.jpg\" width=\"100\" height=\"150\"></a></p>\n</body>\n</html>\n```\n\n\
    CSS, thank heavens, has given us a number of different ways to achieve the same\
    \ goal, and they're delightfully simple. Let's take a look at them....\n\n# Changing\
    \ the Color and Background Color of Links (Simple)\n\nThis is the simplest (and\
    \ most common) of all CSS rollover techniques. It is used to alert the user that\
    \ the mouse is placed over a hyperlink.\n\nFigure 3-59 shows some examples of\
    \ the rollover in action."
