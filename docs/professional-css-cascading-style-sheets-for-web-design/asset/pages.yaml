- img_proc: true
  md: "# Bringing It All Together\n\nWith the floats, however, the content in the\
    \ footer also starts to float around the meta information, as shown in Figure\
    \ 9-57.\n\ntheirs, like if they have to toss out some bad chicken or used tampon\
    \ because the trash is already full-then!\nThat'll show 'em, That'll show em,\
    \ all Bahahahahah\ngeneral site news design life\nmiscellaneous publications 2/3/2005\n\
    comments (1)\nPowered by WordPress.\nCopyright © 2005 Christopher Schmidt. All\
    \ rights reserved.\n\nFigure 9-57: The footer is raised to contain the content\
    \ in the main column container\n\nSo, the workaround is to set a clear property\
    \ for the footer container with the value of both, as in Figure 9-58:\n\n```\n\
    #footer {\n  text-align: left;\n  clear: both;\n  border-top: 1px solid #c2fa00;\n\
