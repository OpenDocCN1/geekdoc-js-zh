  md: "# Chapter 2\n\nOf course, we can be even more intelligent about consolidating\
    \ shared properties. If rules share only certain properties but not others, it's\
    \ simple enough for us to create a grouped rule with the common values, and then\
    \ leave the more unique properties in separate rules, as shown here:\n\n```\n\
    #content {\n  border: 1px solid #C00;\n  padding: 10px;\n  width: 500px;\n}\n\
    #footer {\n  padding: 10px;\n  width: 500px;\n}\n#supplement {\n  border: 1px\
    \ solid #C00;\n  padding: 10px;\n  position: absolute;\n  left: 510px;\n  width:\
    \ 200px;\n}\n```\n\nWe can see that all the previous rules share a padding of\
    \ 10 pixels. The #content and #footer rules share the same width, with a 1 pixel-thin\
    \ red border applied to the elements. With these similarities in mind, we can\
    \ consolidate like-valued properties into grouped selectors, like so:\n\n```\n\
    #content, #footer, #supplement {\n  padding: 10px;\n}\n#content, #footer {\n \
    \ width: 500px;\n}\n#content, #supplement {\n  border: 1px solid #C00;\n}\n#supplement\
    \ {\n  position: absolute;\n  left: 510px;\n  width: 200px;\n}\n```\n\nIt may\
    \ not look like we've gained all that—we're now left with 14 lines compared to\
    \ the previous example's 6, and we've even gained an extra rule to keep track\
    \ of. But the advantage to this intelligent grouping is cumulative, and will become\
    \ apparent more complex style rules. When we consolidate shared declarations,\
    \ we will edit only one rule to change the border color of the #content and #supplement\
    \ elements, to increase the width of the #content and #footer elements. Once your\
    \ stylesheets become a few dozen long but a few hundred, this grouping can be\
    \ a real times whenever it comes to edit shared values.\n\n# Inheritance\n\nWhen\
    \ writing CSS rules, bears remembering that some properties (and the values you\
    \ assign to them) will be inherited by descendant elements. In fact, it helps\
    \ to envision inheritance much in the same way"
