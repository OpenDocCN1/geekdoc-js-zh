- img_proc: true
  md: "# Chapter 5\n\n# Utility Navigation\n\nUtility Navigation is simply a set of\
    \ links to frequently used tools. At UF this includes a map of the campus, calendar\
    \ of events, campus directory, ufl.edu e-mail access, and so on. In the past,\
    \ groups of utilities have often been handled using pipes or images to separate\
    \ items. Neither adds meaning to the items used for navigation nor for the function\
    \ afforded by the browser.\n\nThe best method of applying a sensible grouping\
    \ to these types of utilities is through (you guessed it) an unordered list. Here\
    \ is what we create it like this:\n\n```\n<ul id=\"utilNav\">\n  <a href=\"http://calendar.ufl.edu/Calendar\"\
    ></a>\n  <a href=\"http://websites/Web Site Listing\"></a>\n  <a href=\"http://phonebook.ufl.edu/Directory\"\
    ></a>\n  <a href=\"http://campusmap.ufl.edu/Campus Map\"></a>\n</ul>\n```\n\n\
    Each utility has its own list item containing a containing with the id of utilNav.\
    \ The first part of the supplementary navigation; let's handle the second part.\n\
    \n# Role-Based Navigation\n\nPreviously in this chapter, we discussed the movement\
    \ from role-based navigation as a primary means of navigation in the design. That\
    \ being said, UF did not completely remove as a means of grouping information.\n\
    \nWe'll keep the role-based navigation, but downplay its importance by downing\
    \ the page in the XHTML and placing it in a box in the bottom-right corner of\
    \ the design:\n\n```\n<ul id=\"roleNav\">\n  <a href=\"/students/Students\"></a>\n\
    \  <a href=\"/faculty&amp; Staff/Staff&amp;\"></a>\n  <a href=\"/friends/Alumni,\
    \ Donors&amp; Friends&amp;\"></a>\n  <a href=\"/visitors/Parents, Patients&amp;\
    \ Visitors\"></a>\n</ul>\n```\n\nSimilar to the utility navigation, each role\
    \ is a list item inside an unordered list called roleNav.\n\n# Wrapping the Two\
    \ Together\n\nNow we've created the utility and role-based navigation, we can\
    \ group them together as supplementary navigation. We'll simply wrap it in a div\
    \ suppNav.\n\n```\n<div id=\"suppNav\">\n<ul id=\"utilNav\">\n  <a href=\"http://calendar.ufl.edu/Calendar\"\
    ></a>\n  <a href=\"http://websites/Web Site Listing\"></a>\n  <a href=\"http://phonebook.ufl.edu/Directory\"\
    ></a>\n  <a href=\"http://campusmap.ufl.edu/Campus Map\"></a>\n</ul>\n```\n```\n\
    \n192"
