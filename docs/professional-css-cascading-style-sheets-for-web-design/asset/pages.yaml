  md: '# Troubleshooting CSS Guide


    Does everything appear fine in the code, but not in the page design? Relax. CSS
    beginners and gurus alike have all been been through this. This troubleshooting
    guide will save the frustrations and help determine the cause of your CSS crisis.


    # Validation


    When you run into a problem, the first thing that must be done is to ensure that
    your HTML and CSS syntax are correct. Even if you use a product such as Macromedia
    Dreamweaver or Microsoft FrontPage can hide the markup and code while you design,
    the syntax of the software generates in the background must still be checked.


    If your Web development software does not come with its validators (check your
    software''s documentation for details), be sure to set the preferences so the
    Web development software excludes proprietary elements, like center, so that the
    validator is checking the standard DTD.


    Use the following Web sites.


    # HTML


    For HTML validation service, see http://validator.w3.org/.


    Once at this, enter into the form URL of the page that is causing your trouble.
    If you use the URL, make sure the address is actually visible on the Web, meaning
    that the file is not behind a firewall or a password-protected zone such as an
    intranet. If your HTML file falls into one of those categories, use the upload
    feature provided by the validation service.


    > For information about HTML elements, see Appendix A. If you need information
    on how to convert HTML to XHTML, see Appendix B.'
  merge: -1
  pgno: 431
- img_proc: true
  md: "# Appendix D\n\n# CSS\n\nFor CSS validation service, see http://jigsaw.w3.org/css-validator/.\n\
    \nLike the HTML validator, validation can be conducted through the submission\
    \ of a URL or uploading a style sheet. Be sure not to submit a file that includes\
    \ both CSS and HTML because that will confuse the validator and create grounds\
    \ for automatic validation of.\n\nAnother option to test CSS syntax is to copy\
    \ and paste the code in the direct input format located at the bottom of the page.\
    \ This option might be suited for your needs and might be bit faster, too, if\
    \ your CSS is not accessible on the Web, or if your file is an HTML file with\
    \ some CSS code.\n\n# Manipulating the Elements\n\nAt this stage, the syntax is\
    \ accurate, but that doesn't mean much. Even if your French is spot on, you could\
    \ still find yourself ordering your aunt's handbag for lunch to the bewilderment\
    \ of your waiter at an outdoor cafe near the Louvre.\n\nThe next move is manipulation\
    \ of the CSS itself. Use one or a combination of the following techniques to help\
    \ isolate your CSS problems.\n\n# Zeroing Out the Paddings and Margins\n\nThe\
    \ default style sheet used by browsers places default values for margins and paddings\
    \ on block-level elements. To ensure that those values are not interfering with\
    \ your design, set the margin and padding for the block-level elements to zero.\n\
    \nA fast way to zero out the padding and margins is to use the universal selector\
    \ like so:\n\n```\n* {\n  margin: 0;\n  padding: 0;\n}\n```\n\nThen, place that\
    \ CSS rule at the start of the style sheet. By placing the CSS rule at the start\
    \ of the CSS, other CSS rules that have values for padding, margin, or both in\
    \ the style sheet can override the effects of zeroing out the padding or margins.\n\
    \nLook for any changes in your page design and make any required adjustments.\n\
    \n# Applying Color to Borders and Backgrounds\n\nThe purpose of this method is\
    \ to highlight the CSS rules you are writing and see if they are indeed the design\
    \ elements of the Web page that are causing the problems. Once you have identified\
    \ the right problematic element, you can move on to the next steps in fixing the\
    \ problem."
  merge: -1
  pgno: 432
- img_proc: true
  md: "# Troubleshooting CSS Guide\n\nApply a color to the block-level element (or\
    \ elements) in your CSS that is causing grief. An example of this CSS rule might\
    \ look something like this:\n\n```\n#content #navigation {\n  border: lpx solid\
    \ red;\n}\n```\n\nThis CSS rule creates a red border around the specified block-element\
    \ to better see it in the page design. If you have already too much red in the\
    \ design to notice a red outline, true blue, or green, or simply change the background\
    \ color instead, as shown here:\n\n```\n#content #navigation {\n  background-color\
    \ green;\n}\n```\n\n# Placing Variations in Property Values\n\nAfter finding the\
    \ CSS that is causing problems, the next step is to adjust the values of the properties.\
    \ The problem that the padding is too small in one browser? Or, maybe the font\
    \ size is too small in another browser?\n\nWhen placing different values than\
    \ the ones you are using, with cartoonish large amounts. For example, change 25\
    \ px for padding to 2500px to see if the design breaks up as you should know.\n\
    \nThen the next moves should be small. Use tiny increments, for example, in adjusting\
    \ font sizes from 0.8 to .81 em.\n\n# Playing Hide and Seek\n\nThe way in which\
    \ we write CSS rules can also cause problems. CSS is set up to allow certain properties\
    \ and their values to become inherited by their children. For example, if you\
    \ set the properties for the body element, child elements within it will take\
    \ up these characteristics as well.\n\nWhile CSS has built-in conflict resolution\
    \ with the cascade, inheritance, and specificity, CSS rules can still have unintended\
    \ results in the design. If there's a problem with your design, you might have\
    \ to check the CSS rules you have written. There's a possibility that the CSS\
    \ rules are conflicting or inheriting values you don't want.\n\nIf this is the\
    \ case, simply comment out unnecessary property and value pairs from problematic\
    \ CSS rules and refresh the page design to look for changes.\n\n# Validating Again\n\
    \nAt this stage, the CSS might have been rewritten, revised, or completely mangled\
    \ during the shooting process. Double-check the validation again, just to be sure\
    \ nothing was missed."
  merge: -1
  pgno: 433
- img_proc: true
  md: '# # Appendix D


    # # Looking Outside for Help


    At this stage, if you haven''t found the cause of the CSS problem, it''s time
    to seek help. Use the following resources to investigate the problem or ask for
    help.


    # ## Web Site Resources


    This section provides information on some key Web site resources.


    # ## positioneverything.net


    Maybe the problem isn''t the CSS, but instead it is the browser. For a list and
    explanation of modern browser bugs, check out www.positioneverything.net/.


    # ## Web Developer Toolbar


    If you use Netscape 7+, Mozilla, or Firefox browsers for development, run (don''t
    walk) to Chris Pderick''s browser extension called Web Developer at www.crispederick.com/work/firefox/webdeveloper/


    Offering numerous features that benefit the Web designer and CSS wrangler, this
    an indispensable tool when troubleshooting CSS. Some of the tips mentioned in
    this troubleshooting guide can be implemented with the click of the button on
    the Web Developer''s toolbar, rather than editing code by hand.


    # ## Mailing Lists


    This section provides information on some key mailing list resources.


    # ## css-discuss


    If else has not worked to your satisfaction, try the kind folks at css-discuss.
    This is a mailing list dedicated to practical discussions of CSS-enabled design.
    The people that occupy the mailing list range from professionals to beginners,
    so chances they have seen every problem you might encounter.


    For more information on the list and instructions on how to join, see www.css-discuss.org.


    # ## Babble List


    Geared to advanced Web design issues, this community offers a lively exchange
    of information, resources, theories, and practices of designers and developers
    including CSS development. The overall goal is to hone skills and share visions
    of where this new medium is going.


    For more information on the list and instructions on how to join, see www.babblelist.com.'
  merge: -1
