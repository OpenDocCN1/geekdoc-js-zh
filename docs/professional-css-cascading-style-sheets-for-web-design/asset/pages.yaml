    ![](img/70fa44d3a461f43c7a35cac2b893273d_203_0.png)


    Figure 5-2: A revision to the University of Florida home page launched in 1999


    With each of these, the visitor would find all the information thought each of
    the different types of visitor need. Inside "Prospective Students" would be admissions
    information, directions on taking a campus tour, facts about the university, and
    so on. Each group would have similar role-targeted information. The tendency to
    shift to role-based navigation as a primary means of navigation was seen across
    both university sites and the Web at large.


    This graphics-heavy design did not come without a price. While UF received more
    than negative feedback on the aesthetics of the 1999 design, there were a number
    of complaints centered on the time needed to load the site. In this design, the
    visitor''s browser had to make more than 30 HTTP requests to the UF servers for
    various pieces of the page: HTML, images, JavaScript, and so on. Each requested
    the total time to load the site.


    The more semantic markup found in the first design was lost in these revisions.
    The unordered lists and header elements found in the first design were scrapped
    for multiple maps, JavaScript rollovers, and tables.'
