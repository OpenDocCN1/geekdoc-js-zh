    \ Harvard-Radcliffe Orchestra <a title=\"Harvard Gazette: &quot;illuminating the\
    \ beauty of life&quot;\" href=\"http://www.news.harvard.edu/gazette/2004/10.21/23-yannatos.html\"\
    >More</a></a></p>\n```\n\nHere, you can see that we've included the More link\
    \ within the paragraph —as we'll show you later in the chapter, we could easily\
    \ use CSS to move the anchor down to the next line. So, while keeping the anchor\
    \ inside the paragraph intentional, you may opt to take a different approach.\n\
    \n# Unordered Lists\n\nAs for the lists at the top of our page, what is a site's\
    \ navigation but a list of lists? We can replace the top-heavy menu with unordered\
    \ lists, each list item element containing a link to a different part of our site.\n\
    \nWith a bit of JavaScript magic, nested unordered lists can be quickly and easily\
    \ converted into dynamic drop-down menus. One of the most popular examples of\
    \ this is the “Son of Suckerfish” (SoS) menu script (http://https.com/articles/suckerfish/dropdowns/)\
    \ developed by designers Patrick Griffiths and Dan Webb. The SoS menu is a perfect\
    \ example of how behavior (JavaScript) and style (CSS) can be layered a foundation\
    \ of well-structured markup, while the whole degrading gracefully to non-JS enabled\
    \ internet devices.\n\n# Take Stock of Your Content, Not Your Graphics\n\nFirst\
    \ and foremost, you should perform an inventory of your page's contents. Taking\
    \ another look at the Harvard University page (see Figure 2-4), we can see that\
    \ the site's layout breaks down into the following outline:\n\n+   - Header\n\
    - Navigation\n  - Primary\n  - Secondary\n- Content\n  - Main Content\n  - Additional\
    \ Content\n- Footer Navigation\n- Copyright Information"
