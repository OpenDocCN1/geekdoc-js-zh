  md: '# Chapter 8


    Some designers may tell you that building an accessible site means building a
    boring site, we''d fling their pooh-pooh right back at them. Accessibility isn''t
    about large fonts or high-contrast guidelines. Some users of the Web can read
    only smaller texts, while others can see only yellow text on a black background.
    Rather, many of the design techniques explored throughout this book — semantic,
    well-structured markup, separation between content and presentation — can afford
    us incredible leverage in building professional, inspiring designs and simultaneously
    improve the accessibility of our sites for all of our users, not just a few. In
    fact, we can better realize the Web''s potential for universal access, and make
    ultra-sexy sites to boot.


    Ultimately, this is not a manifesto on accessibility, space allotments and our
    meager skills being the largest impediments. Instead, we will explore different
    techniques for democratizing our design through the style of sheet switching.
    By applying a different CSS file to a markup document, we can drastically change
    any or all aspects of its — the layout, typography, or color palette. This technique
    might hold incredible appeal to designers because it exponentially decreases the
    amount of overhead required to design a site. But, as you''ll see, this technique
    can yield incredible benefits to our site''s users, allowing them fine-grained
    control over a presentation and, in turn, better access to the content therein.
    After all, it''s about though the gates as wide open as possible.


    Let''s dive right in.


    # Laying the Foundation


    With as other matters, let''s begin with a valid XHTML document. For the purposes
    of our style sheet experiments, the document in Listing 8-1 will do so.


    Listing 8-1: The Markup Foundation for Our Style Switcher Experiments


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/xhtml-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <title>Always offer an alternative.</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    </head>

    <body>

    <div id="container">

    <div id="content">

    <h1>always offer an alternative.</h1>

    <p><span class="lead">Lorem ipsum dolor sit amet,</span> consectetuer adipiscing
    elit. Nullam tortor. Integer eros...</p>

    ```


