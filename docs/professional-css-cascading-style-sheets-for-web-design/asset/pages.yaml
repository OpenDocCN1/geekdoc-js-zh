    # The Straight Lines of the Box Model


    Given the name and nature of the box model, it’s not terribly surprising that
    the vast majority of Web sites using CSS end looking up a little “boxy” Straight
    lines abound in CSS-centric designs because the edges of CSS elements are straight.
    Pretty corners poke out everywhere from CSS-based sites because the corners of
    CSS elements are pointy, as shown in Figure 3-3. That’s just the way it is.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_108_0.png)


    Figure 3-3: All the elements of the box model have pointy corners and straight
    edges.


    In the past, designers were too busy struggling with browser bugs to confront
    this issue. When four different browsers display your markup in four different
    ways, you don’t have much time to think of life “outside the CSS box.”'
