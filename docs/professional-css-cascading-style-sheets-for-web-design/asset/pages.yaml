  md: 'As of this moment, I never need to touch the markup that makes up the navigation,
    unless I want to

    make edits. And, if I make any revisions to the menu, I simply add some basic
    HTML and then the CSS

    instantly styles the menu.


    # BlogRoll


    One of the common characteristics of a blog is the blogroll, which is a collection
    of links that the site owner

    likes to read often. With Internet technology, the links can be dynamically sorted
    by the last time they

    updated. We fake a few e-mails from friends and a nice cup of tea, a blogroll
    surfing in the

    mornings nicer.


    While keeping tabs on a lot of interesting links, a blogroll can quickly get out
    of hand. A very long list

    of links can often overshadow the main site itself. One solution would be, of
    course, to keep a short list of

    links. Why not subject myself friends to the awkward social construct of being
    virtually "defriended"

    because I want to save some space on a Web page?


    The right solution, is to keep the list, but shrinking the space allotted to the
    blogroll.


    Let''s take a look at the markup for the blogroll, as shown in Figure 9-50. (In
    the spirit of saving trees,

    I''m going to use a handful of links).


    ```

    <div id="blogroll">

    <h4>Sites I Read</h4

    <p>sorted by freshness</p>

    <ul>

    <li><a href="http://www.metafilter.net/">metafilter</a></li>

    <li><a href="http://www.meryl.net/blog/">meryl''s notes</a></li>

    <li><a href="http://www.goodblimey.com/">Good Blimey</a></li>

    <li><a href="http://www.allaboutgeorge.com/">allaboutgeorge</a></li>

    <li><a href="http://www.evread.com/">evread</a></li>

    <li><a href="http://x-pollen.com/many/">The Power of Many</a></li>

    <li><a href="http://www.stopdesign.com/">Stopdesign</a></li>

    <li><a href="http://www.merzblue.com/">merzblue</a></li>

    <li><a href="http://www.nickfinck.com/journal/">Nick Finck</a></li>

    <li><a href="http://www.bi-p-one.com/">Bi-P-one, Genius</a></li>

    <li><a href="http://www.7nights.com/asterisk/">asterisk</a></li>

    <li><a href="http://www.sideshow.com/">sideshow</a></li>

    <li><a href="http://www.veen.com/jeff/">Jeffrey Veen</a></li>

    </ul>

    </div><!-- END #blogroll. -->

    ```'
