  md: '# Chapter 4


    A specific pixel width was set with div, followed by the background attribute
    (which is all the action took place). We use a hex value that is the same as the
    background of the Flash movie and the right column, a url to the desired image,
    plus an instruction to the browser to repeat the image vertically (repeat-y) for
    the complete length of the div.


    Without repeat-y, the browser (by default) would have not only tiled the graphic
    vertically but horizontally as well. This would have caused the left edge of the
    graphic to appear after the right edge of the shadow. This obviously wouldn''t
    have worked with the design repeat-y was used to tile the image in only one direction
    (top). If your design required a horizontally tiled graphic, you could use repeat-x.


    Because CSS allows you to apply both a color and image to a single element, you
    can (with a little planning) save a few bytes from your file size by using CSS
    to draw areas of consistent color (Known as "spots" in the print world). This
    is the reason why the container''s background image was cropped at the edge of
    the drop shadow. The remainder (the dark gray area the shadow bled into) was drawn
    by the browser using the stipulated color. While this was not required (all of
    it could have been included in the background GIF), a few bytes were saved by
    doing so. As we all know, every bit helps.


    When completed, the div appeared as shown in Figure 4-7.


