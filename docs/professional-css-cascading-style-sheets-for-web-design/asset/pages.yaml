  md: '# About the Authors


    Christopher Schmitt is the principal of Heatvision, Inc., a new media publishing
    and design firm based in Tallahasse, Florida. An award-winning Web designer who
    has been working with the Web since 1993, he interned for David Siegel and Linda
    Weinman in the mid-90s as an undergraduate at State University pursuing a Fine
    Arts degree with emphasis on graphic design. He is the author of The CSS Cookbook
    (O''Reilly) and Designing CSS Web Pages (New Readers Press, 2002). He is also
    the co-author (with Michael Laaker) of Poof CSS in 10 Simple Steps or Web (Wiley,
    2004) and contributed four chapters to XML, HTML, & XHTML Magazine by Molly Holzholz
    (New Readers Press, 2001). Christopher has also written for New Architect magazine,
    A List Apart, Digital Web, and Web Reference. In 2000, he led a team to victory
    in the “Cool Site in a Day” competition, where he and five other developers built
    a fully functional, web site for a non-profit organization in eight hours. Speaking
    at conferences such as The Other Conference and SXSW, he has given talks about
    Web design, helping to spread the word about the benefits and practices of usable
    design (www.com). Maintaining a mailing list christophersmitt.com, he shows his
    true colors and most recent activities. He is 67” tall and does not play professional
    basketball, which would be a humid game of chess.


    For Me. You was my inspiration for years and, with hope, many more to come. I
    would be without your wisdom, laughter, empathy, and captivating smiles.


    Mark Tammrell of Gainesville, Florida, directs the Web presence at the University
    of Florida.


    To Kaye. Your love and abiding support make me who I am. Your joy paints me with
    vibrant swaths of color that gives memories and our future hope. You are called
    many things: doctor, lieutenant, professor, wife, but most importantly, I call
    you.


    Ethan Marcotte of Boston-founded Vertua Studios, a Web design shop focused on
    creating beautiful, user-focused sites. A steering committee member of the Web
    Standards Project, he is a leading voice in standards-based Web design. Ethan
    is also the curator of dichoshow.com, a popular web log that is equals design,
    coding, and father.


    Dunstan Orchard of Dorset, UK, and San Francisco is Senior UI Engineer at his
    online store. He is a member of The Web Standards Project, a senior developer
    for the open source blogging platform WordPress, and an occasional contributor
    to his own site at http://1976design.com/.


    I dedicate my portion of this book to my parents and to my girlfriend, Nicole.


    Todd Dominey of Atlanta founded Dominey Design (domcmeydesign.com), an interactive
    Web development and design studio that has produced original work for Budweiser,
    The Washington Post, Google, Winter Fresh, and he is also a Senior Interactive
    Designer at Turner Sports Interactive, designing and developing Web destinations
    for major PGA tournaments (including the PGA Championship and the Ryder Cup).'
