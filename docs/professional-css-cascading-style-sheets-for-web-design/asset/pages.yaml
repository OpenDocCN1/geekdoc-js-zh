  md: '# Chapter 2


    Imagine that your CSS is littered with code like this. What happens when you need
    to obsolete a given hack? Perhaps one of the problematic browsers passes over
    the upgrade horizon, or the next version of Internet Explorer will stop reading
    your style sheet when it encounters a hack for the Opera browser. At some point,
    you might need to edit your CSS and remove some of the hacks you introduced. But
    what if these hacks aren''t spread over 30 lines of CSS, but over 3,000? What
    then?


    # Hacking Artfully


    Rather than muddying our style sheet with browser-specific hacks, we''re much
    better served by placing our workarounds into browser-specific style sheets. While
    this kind of "hack quarantine" isn''t strictly necessary, it does have the benefit
    of keeping our "clean" CSS distinct from the hacks required to get it working
    in less-compliant browsers. Consider Figure 2-19.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_98_0.png)


    Figure 2-19: A more scalable hack management system


    In this model, there''s a link to our style sheet — nothing unusual. But this
    first style sheet simply acts as a gateway to multiple other style sheets, which
    are invoked through the @import rule. The first imported style sheet is the one
    that contains our site''s presentation, clean and hack-free. Thereafter, we simply
    import browser-specific style sheets that contain the hacks to ensure our style
    displays consistently across all targets.


    There are other ways to manage your hacks, of course. Mark Pilgrim describes how
    he uses agent detection on his Web server to deliver browser-specific CSS hacks
    (http://diveintmark.org/archives/2003/01/16/the_one_ife_never_tried). This kind
    of server-content negotiation is excellent, though it requires knowledge of, and
    an ability to configure, the Apache Web server and its mod_rewrite component.
    So while the technical bar''s set a bit higher than the solution offered here,
    this sort of server-solution is an excellent alternative.'
