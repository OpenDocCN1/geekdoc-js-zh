  md: '# Chapter 1


    ![](img/70fa44d3a461f43c7a35cac2b893273d_46_0.png)


    Figure 1-8: Cinnamon Interactive. Fashionable and functional, this beautiful design
    floors random showers while driving prospective clients into their portfolio.


    But it''s not the jaw-dropping aesthetics (or the code behind) that make Cinnamon
    a success. Rather, the goals of the site are beautifully reflected in its design.
    The Cinnamon shaker logo is subtly mirrored in the photography on the home page,
    which creates a heightened sense of the company band. This attention to the corporate
    identity is sure to impress not only Web surfers, but also corporate liking for
    the same level of brand safety for their own company.


    Furthermore, the bulk of the home page is dedicated to the company portfolio.
    Not only is it the first line in the site''s primary navigation (the back link
    to the “Voorpagina,” or home page), the splash graphic on the home page is one
    big link directly into their body of work. This emphasis on advertising their
    portfolio is intended not only draw interested users into some of their past projects,
    but ultimately over to the “contact” page so that they might ultimately contract
    with Cinnamon for their own design initiatives.


    # Finding Inspiration


    Of course, translating what into a design assignment isn''t always the elementary
    process. It''s like a writer under deadline, it''s easy for designers to get blocked.
    When presented with a creative brief, client requirements, and a mountain of documentation
    detailing users'' needs, a blank canvas in Photoshop can seem an almost impassable
    roadblock. So how do we get started? How do we go from requirements to sleek,
    professional-looking design in nothing flat?


    Simple—by seeing how others do it.'
