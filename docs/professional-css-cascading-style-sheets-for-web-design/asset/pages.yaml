  md: '# Chapter 9


    # Designing the Site


    With the preparation of site map, content inventory, wireframe done, it''s time
    to start design- the site.


    Based on the direction from Chapter 2, the next steps include deciding on the
    tone, looking for inspira-tion, determining the layout, and, you know, working
    on a design.


    # Emoting Is Designing


    One of the keys you learn about design is that, at its core, it''s about communicating
    emotion. All design elements that come into play with a design (whether it''s
    print, television, or the Web) reflect how the design of the message was aptly
    matched with the message itself.


    A simple way to think about the separation of design and the message is to think
    about how you com-unicate with your voice. By placing emphasis on a different
    word in sentence, you change the mean-ing of the sentence.


    Read the following sentences aloud, placing the emphasis on the words in italics:


    +   - Why did you sign the file?

    - Why did you sign the file?

    - Why did you sign the file?

    - Why did you sign the file?


    As you go through the sentences, you should hear that the meaning of the sentence
    changes from one to the next, even the words stay the same. With design, it''s
    pretty much the thing.


    A designer has a toolbox of theories and techniques to apply the right emphasis
    to get a message the proper reception from the viewers. However, an uninformed
    designer can place the emphasis poorly in a design, minimizing the effect of the
    message and causing a communication problem with the audience.


    Or, worst yet, the intended audience doesn''t receive the message at all. With
    communication, it''s the message that is received the most important message,
    no matter how good your intentions are. With any design, how you say it is as
    important as you want.


    # Setting the Tone


    As the designer, I must determine how to emphasize the message. There are elements
    of a design that a person can control to craft the right emphasis for a design,
    including typography, colors, imagery, and layout for the content. To set the
    right tone for your site, I must determine how to best use typography, colors,
    imagery, and layout for the content. I must choose these elements carefully, when
    the elements I pick together, they will set the tone of the site.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Bringing It All Together


    In my design, the overall tone I want to be is friendly so that people respond
    to the site on an informal basis. However, at the same time, I want to project
    a professional image. To achieve this, I want to have a mixture of organic characteristics
    (friendly) wished with structured, conservative elements


    To achieve the more structured, conservative approach to the site, the inherent
    nature of the CSS box model will help. Also, I will be using the SuperTiny Simcity
    style. If you have played games as SimCity or visited sites that look like k10k
    (see www.k10k.net/), I will immediately recall all of these images. This style
    is characterized by a heavy reliance on grid layout and a glorification of the
    pixelated imagery.


    To provide some balance to the conservative nature of the site, I''m going to
    employ some organic artwork. I''m going to rely on the creative use of background
    images and a special typeface that is perfect with organic characteristics.


    One problem with having an organic presentation on a Web page is that it''s inherently
    chaotic at first glance. I''m not the first one to attempt to combine an organic
    approach with a more rigid framework—I hope my design doesn''t turn out to be
    another Frankenstein.


    # Typography


    With the Web, I''m in a bit because I must use typefaces that are installed on
    both Windows and Mac OS platforms. For areas of common text (such as blog posts),
    I will use Common fonts, Georgia and Verdana, with font-matching substitutes for
    each font shown in the following.


    | Page Section | Typeface |

    | --- | --- |

    | Logo, special treatments | Not Caslon (see www.emigre.com/EF.php?fid=111) |

    | Headings | Georgia, Times New Roman, Times (serif) |

    | Content | Verdana, Arial, Helvetica (sans-serif) |


    However, for the logo (which will be my name), I want to use Not Caslon from Émigré,
    as shown in Figure 9-5.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_349_0.png)


    Figure 9-5: Not Caslon shown in the logo


    # Colors


    For this Web site, I''m using a mixture of bold, modern colors. For the organic
    feel, the leaves around my hometown serve as inspiration. The colors I''m going
    to be using bright greens and yellows, as well as brown and an orange for the
    highlight.


    Feel free to visit ChristopherSchmitt.com for a look-see the color choices and
    let me know what you think.'
