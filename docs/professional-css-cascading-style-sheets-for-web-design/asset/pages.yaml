    \ make them away.\n\nSo, always ensure your images are at least 5px high using\
    \ the techniques outlined in the following sections.\n\n# What Does It All Mean?\n\
    \nOnce again, let's take a look at each bit of the CSS.\n\n# Rounding the Top\
    \ of the Box\n\nFirst we must set the width of the sidebar div {#sidebar}. We\
