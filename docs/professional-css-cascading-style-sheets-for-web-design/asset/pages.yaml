    Not only has ESPN.com made the leap from Tag Soap and Table Layouts to CSS, but
    it was one of the first major commercial organizations to do so, flickering the
    switch back in May 2003. How did they dare to do it? Well, the numbers just made
    sense. Careful analysis of traffic logs showed'
