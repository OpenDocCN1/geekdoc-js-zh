- img_proc: true
  md: "# Chapter 3\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_136_0.png)\n\nFigure\
    \ 3-39: Producing the gradient at the top of the box\n\nNow for the clever bits.\
    \ First, let's create our :before pseudo-element:\n\n```\n.box:before (\n  )\n\
    ```\n\nNow, we'll insert our top-left rounded-corner into the pseudo-element (see\
    \ Figure 3-39):\n\n```\n.box:before (\n  content: url(box-tl.gif);\n  )\n```\n\
    \n![](img/70fa44d3a461f43c7a35cac2b893273d_136_1.png)\n\nFigure 3-39: Inserting\
    \ the top-left rounded-corner image\n\nNow we'll add in the top-right rounded-corner\
    \ image. We do this by setting a background-image on the pseudo-element, and making\
    \ the whole thing block-level (see Figure 3-40):\n\n112"
  merge: -1
  pgno: 136
- img_proc: true
  md: "```\n.box:before {\n  background: transparent url(box-tr.gif) no-repeat top\
    \ right;\n  content: url(box-tl.gif);\n  display: block;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_137_0.png)\n\
    \n**Figure 3-40: Adding the top-right rounded-corner image**\n\nWe have to counteract\
    \ the 8px of padding and 2px of border applied to the box. We do this by applying\
    \ negative top, right, and left margins to the pseudo-element, putting it into\
    \ place, as shown in Figure 3-41:\n\n```\n.box:before {\n  content: url(box-tl.gif);\n\
    \  background: transparent url(box-tr.gif) no-repeat top right;\n  display: block;\n\
    \  margin: -10px -10px 0 -10px;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_137_1.png)\n\
    \n**Figure 3-41: Counteracting the right and padding**\n\nFinally, we apply a\
    \ line-height to the pseudo-element (to fix that problem with the left-hand corner)\
    \ and a negative bottom margin, to pull the header (“Users say...”) up, and back\
    \ to its proper place, as shown in Figure 3-42:\n\n```\n.box:before {\n  background:\
    \ transparent url(box-tr.gif) no-repeat top right;\n  content: url(box-tl.gif);\n\
    \  display: block;\n  line-height: 0.1;\n  margin: -10px -10px -12px -10px;\n\
    }\n```\n\nAnd that's it. Rounded corners, a gradient background, and fluid width,\
    \ as shown in Figure 3-42."
