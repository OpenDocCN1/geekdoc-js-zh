  md: '# Chapter 7


    ![](img/70fa44d3a461f43c7a35cac2b893273d_274_0.png)


    **Figure 7-5:** Adding more content to our absolutely positioned block demonstrates
    just how far we''ve come.


    Another important thing to note in Figure 7-5 is that after increasing the height
    of our absolutely positioned block, the outer block is partially obscured. Remember
    that by applying position to the block, we removed it from the normal flow—and
    in the case of absolutely positioned elements, the browser doesn''t reserve any
    space for it within the document. Because of this, absolutely positioned elements
    are designed to overlap elements on the page, whether positioned or not. This
    is a very important issue to consider when building a layout with absolute positioning,
    and one we''ll return to later in greater detail.


    # Positioning That’s Absolutely Relative


    But what if we want to exercise a bit more control over the positioning of that
    inner block? What if we don''t want to position it relative to the browser window,
    but to the outer div? As it turns out, the absolute positioning we''ve seen so
    far is only the default behavior. If an absolutely positioned element isn''t placed
    within another positioned element—that is, if all of its ancestors are in their
    default, static positioning—then it will be placed as our example is in Figure
    7-4 relative to the boundaries established by the initial block, the body element.


    If you noticed that the last sentence contained a few "ifs," we''re happy we haven''t
    put everyone to sleep. So, if our absolutely positioned element is contained within
    another positioned element, what happens then? Let''s see what happens when we
    apply this bit of logic to the outer div, which, as we determined previously,
    is the parent to our absolutely positioned element:'
