  md: '# Chapter 3


    And voilà, this is a fix, for IE users … or is it?


    Well, it''s certainly a fix, but it is not necessarily “nice”. In this instance,
    we''re fortunate to know that (a) the h2 is padded, (b) doesn''t already have
    a background-image applied to it, and (c) we can tweak our h2s padding after the
    fact to return to its normal position. But what if we didn''t know what kind of
    content the box would contain? Could we put this out as part things? If we didn''t
    know what kind of content the box would contain? As a template for Blogger''s
    clients and still expect our IE had to work? The answer is probably not.


    Although we think it''s not a good idea to base an element''s style upon the contents
    of element rule with the use of :before and :after; we''ve totally shattered it
    with the IE-specific CSS shown previously. We''re on dangerous ground here.


    So, is the IE hacked out here “good?” In this instance, yes, it''s okay. We could
    implement it on bloggercom and guarantee it would work every time? No, we couldn''t.
    Should you use it on your site? Well, that''s up to you ...


    # Fixing the Fix


    May well be for it, but we''ve got a bit of housekeeping to do now before we can
    say it''s entirely done.


    The IE-focused CSS that we''ve just written isn''t just understood by Internet
    Explorer; it''s understood by all the main browsers. Browsers such as Firefox,
    Opera, and Safari have now three sets of images on screen: the image we inserted
    using :before, the image we inserted using :after, and the image inserted between
    the h2.


    Luckily we''ve been so accurate in our placement of these images that you can''t
    tell the top section two images applied to it, as shown in Figure 3-31.


    Users say...

    - “I love Blogger - it has a great addition to my life online!

    - Roseanne

    - “You guys a wonderful job... - Thanks for the exemplary service in pioneering
    mass, user friendly web on the internet... I, along with thousands of others,
    definitely appreciate the service you provide.

    - Josh

    - “Thanks, your system is perhaps the easiest content management application I''ve
    ever seen... it simply amazes me how easy it is, and I''ve been working with computers
    for 20 years.

    - Michael"


    .box:before {

    content: url(box-top.gif);

    }


    .box h2 {

    background: transparent url(box-top.gif);

    no-repeat left;

    }


    .box:after {

    content: url(box-btm.gif);

    }


    Figure 3-31: Advanced browsers now apply three sets of images.'
