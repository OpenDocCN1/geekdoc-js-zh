  md: "# Chapter 4\n\nfill the gap. The list items now heaved as if they contained\
    \ 20 pixels tall, but were actually much shorter. But the browser couldn't tell\
    \ the difference, and thus, the drop-down menus operated as expected.\n\nTo see\
    \ how the list items and graphical elements affected, take a look at Figure 4-11.\
    \ Using Chris Pderick's free Web Developer extension (www.chrispderick.com/work/firefox/WebDeveloper/)\
    \ for Firefox, the invisible bounding boxes of the list elements and images were\
    \ turned visible by adding a temporary black stroke. This offered a visual confirmation\
    \ of the style modifications, and to see-what-the-browser-was-seeing in real time.\
    \ The extension came in many times during development of the PGA Championship,\
    \ and it is recommended to anyone involved with Web development and design.\n\n\
    ![](img/70fa44d3a461f43c7a35cac2b893273d_194_0.png)\n\n> Figure 4-11: The PGA\
    \ Championship viewed in Firefox and with list elements outlined by the Web developer\n\
    \n# Customization: Styling the Drop-Down Menus\n\nNow that the drop-down menus\
    \ were functioning properly and appearing in the proper place, it is time to tweak\
