  md: '# Blogger: Rollovers and Design Improvements


    Well, remember that this is a background image to div#photo-lucas, the element
    that contained the original photo. But, because we threw the original photo off
    the edge of the screen, div#photo-lucas has no content, and no means no dimensions.
    So, yes, our new background image is there, we must give div#photo-lucas a width
    and a height in order to be able to see it, as shown in Figure 3-88.


    ```

    html > body div#photo-lucas {

    background: transparent url(lucas-rollover.png) no-repeat top left;

    height: 124px;

    width: 160px;

    }

    ```


    ![](img/70fa44d3a461f43c7a35cac2b893273d_177_0.png)


    Ah! There it is, very nice. Notice that the height we set corresponds to the height
    of the new rollover image (lucas-rollover.png), and the width is exactly half
    that image''s width. This way we see only one-half of lucas-rollover.png at a
    time, which is just what we want.


    With the new image on-screen, let''s position it to the right. To do that, we
    again use position: absolute (see Figure 3-89).


    ```

    html > body div#photo-lucas {

    background: transparent url(lucas-rollover.png) no-repeat top left;

    height: 124px;

    position: absolute;

    width: 160px;

    }

    ```


    153'
