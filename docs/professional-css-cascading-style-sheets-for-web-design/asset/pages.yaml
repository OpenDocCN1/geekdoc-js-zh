  md: '# Implied Boxes


    Rounded corners go a long way toward mellowing out Blogger’s box design, then
    Bowman’s second idea, the implied box, finishes the job.


    There''s really no easier way to explain what an implied box is than to show you
    one of them in situ. Figure 3-50 shows one in the front page of blogger.com.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_143_0.png)


    Figure 3-50: An implied box (top right) on blogger.com


    See it? It’s the bit in the top-right corner of the page. Figure 3-51 shows it
    close-up.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_143_1.png)


    Figure 3-51: An implied box in action in the Sign In


    There’s nothing super-clever about the CSS here. It’s the application of a simple
    background image to a form or div, but the effect is very soothing and allows
    the design to retain a level of openness while still providing a way for visually
    demarcating sections of the document. In essence, it removes visual clutter and
    lets our brains fill in the blanks. It’s a very clever move in such a busy site.'
  merge: -1
  pgno: 143
- img_proc: true
  md: "# Chapter 3\n\nHere’s the relevant CSS for that example:\n\n```\n#header {\n\
    \  background: url(ibox-login.jpg) no-repeat left top;\n  padding: 12px 15px 0;\n\
    \  width: 290px;\n}\n```\n\nFigure 3-52 shows the image being used.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_144_0.png)\n\
    \nFigure 3-52: The ibox-login.jpg image at 320 × 290\n\nSo, you don’t have to\
    \ use advanced CSS to implement a nie piece of design. This is about as simple\
    \ as it gets, and it does the job admirably.\n\n# Writing CSS That Benefits Your\
    \ Site Maintainers\n\nThere’s something clever going on at blogger.com, although\
    \ at first glance you won’t be able to tell it it is. In fact, the only people\
    \ who really appreciate this cleverly are the people who have to maintain the\
    \ site, the Blogger Team.\n\nThis section looks at styling of Blogger’s content\
    \ divs and shows how, with the addition of a simple class, the Blogger Team can\
    \ quickly (and easily) change the layout of their site by moving from one column\
    \ to two, or from sidebar positioned on the left to a sidebar positioned on the\
    \ right.\n\nTo find out how swapping-works works, we must first understand the\
    \ basic structure of Blogger’s pages.\n\n# Basic Page Structure\n\nEach of the\
    \ pages on blogger.com is divided into two sections: “header” (<div id=\"header\"\
    >) containing the logo and tagline, and a “body” (<div id=\"body\"> containing\
    \ everything else. (Don’t get that “body” confused with the body tag (<body>);\
    \ they’re two separate things.)\n\nTo put this in perspective, it’s a quick outline\
    \ of a Blogger page:\n\n```\n<html>\n<head>\n  <title></title>\n</head>\n<body>\n\
    \  <div id=\"header\">\n```"
  merge: -1
  pgno: 144
- img_proc: true
  md: "# Blogger: Rollovers and Design Improvements\n\n```\n</div>\n<div id=\"body\"\
    >\n  <div id=\"main\">\n    </div>\n\n  <div id=\"sidebar\">\n  </div>\n</div>\n\
    \n<body>\n</html>\n```\n\nWe're going to look closely at <div id=\"body\"> and\
    \ its descendants.\n\n# Inside the body div\n\nAlmost every page on blogger.com\
