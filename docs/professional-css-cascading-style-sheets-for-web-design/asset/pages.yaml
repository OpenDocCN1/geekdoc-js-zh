    # Love Your <body> Even More Tomorrow


    Now given, when the CSS selectors will let us target every element on the page
    (based on their position in the document tree, the presence and contents of their
    attributes, or simply based on their textual contents), what do you think the
    future holds for the humble class and attributes?


    Well, it would seem that the CSS of selectors provides the granularity to do away
    with such things. Why fix your markup with classes that (let''s be honest) are
    always placed specifically to your current design, when could use powerful pseudo-classes
    and attributes to target the same elements


    There is, one vital use for classes and ids that will remain, and it''s one we
    looked at in the first section of this chapter. By applying a class or id to the
    body element in each page we will be to specify which rules should be applied
    to pages. Sure, some of our CSS will be generic, but will require this rule-page
    pairing that only a class or id on the body can bring.


    So, the future holds a powerful new set of CSS selectors for us, enabling almost
    all instances of classes and ids from our markup. Our HTML will be neater, our
    CSS will be more creative, and our sites will be truly skinnable.'
