  md: '# Chapter 3


    # Summary


    This chapter began by discussing two methods of inserting rounded corners into
    boxes, complete with a glimpse at the power behind the :before and :after pseudo-elements.
    We briefly examined a way to further blur the rigid box structure that underlies
    all our sites, through the use of implied boxes. We also looked at (and bent)
    an interesting rule and discussed the pitfalls of using the content of an element
    as hooks to style the element itself.


    We then highlighted the benefits of sensible and well thought-out design. We showed
    how, with the manipulation of a simple CSS class, blogger.com''s site maintainers
    are able to select one of three layouts for a page—hiding, showing, and repositioning
    content with no fuss, and not a hint of nonsense.


    We looked at rollovers that manipulate text color and background color, and we
    looked at rollovers that manipulate the position of background images. We''ve
    seen that Internet Explorer lets us down with its incomplete support of :hover,
    and we''ve also seen that IE for the PC and IE for the Mac behave in different
    ways.


    This chapter should provide you with an understanding of the underlying principles
    of the techniques discussed, and not leave you blindly copying code examples.
    If you find that you can''t put these ideas to work on your client''s site, at
    least you can play with them, and try to duplicate your work using these techniques.
    You''ll be amazed at how simple it can be, and you''ll also be amazed at how easy
    it is to cut-and-paste one set of code to get it working.


    In the next chapter, we''ll take a look at the inner workings of a successful
    event-driven site: The PGA Championship.'
