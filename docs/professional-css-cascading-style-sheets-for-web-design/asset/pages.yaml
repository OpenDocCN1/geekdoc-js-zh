    +   - Its Web site, ESPN.com, serves between 1 and 1.3 billion pages a month (a
    figure roughly equivalent to that of the BBC’s mass of Web sites).

    - The site has approximately 15.3 million unique visitors a month.

    - These visitors spend an average of 9 minutes a day on ESPN.com.

    - ESPN.com is the largest and most popular sports Web site in the world.

    - Disney owns 80 percent of ESPN.


    That’s impressive stuff.


    So, now that we’ve established that it’s not a Mickey Mouse outfit (well, only
    80 percent Mickey Mouse), you may be wondering why its site, ESPN.com, has made
    it into a book on CSS. Surely sites large don’t make the transition from controlled,
    table-layouts to the more fluid, and less predictable (so to speak) world of CSS,
