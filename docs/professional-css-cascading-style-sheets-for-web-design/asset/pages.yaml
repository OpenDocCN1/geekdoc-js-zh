- img_proc: true
  md: '# The PGA Championship


    The PGA Championship is one of the world''s premier sporting events. Presented
    in the late summer each year by the PGA of America, the tournament is the final
    major event of the golf season, features the best players in professional golf,
    and is followed by millions of fans around the world.


    Turner Sports Interactive, a division of Time Warner, was responsible for the
    site development and editorial content during the event. The technological goal
    was to create a dynamic, rich, standards-compliant site using CSS for all layout
    and presentation, easily digestible XHTML markup, and Flash for special features.
    The creative goal was for a Web presence that was visually unique, sophisticated,
    and without any of the typical golf design clichés. A palette of desaturated,
    warm neutral tones was chosen, plus white and black to emphasize original photography
    and place much attention on the textual content as possible.


    Soon after its launch in July 2004, the PGA Championship site received overwhelmingly
    positive feedback from both golf fans and the Web-development community for its
    unique presentation, adherence to Web standards, and overall design. Traffic exploded
    on the first day of competition, as the PGA.com editorial team delivered a steady
    stream of news, scores, and multimedia content to millions of users per hour.
    Thanks to the lightweight CSS/XHTML markup, there was plenty of bandwidth to spread
    around.


    This chapter provides detailed walkthroughs of some of the techniques used for
    a few of the site''s original features. Included in this discussion are general
    CSS/XHTML tips and tricks, as well as real-world caveats to watch out for in your
    own projects. Topics discussed in this chapter include the following:


    +   - How to create the layered, drop-shadow effect using CSS and Photoshop

    - A powerful, ultra-light method for adding CSS-powered drop-down menus

    - Embedding Flash content without breaking standards compliance'
