  md: '# Chapter 7


    # Fast Company: Picking Up The Gantlet


    In April 2003, Fast Company (http://fastcompany.com/) was the next high-profile
    site to drop old, bloated page-building techniques for sleeker, standards-compliant
    methods, and it did so in style. The site serves two purposes:


    +   - It is an archive of features from the popular magazine of the same name.

    * It publishes various Web-only features, such as the FC Weblog (http://blog .fastcompany.com/).


    Balancing both these needs, the new Fast Company (FC) design was once stylish
    and easy to navigate. Users could quickly shift through content-rich pages that
    could easily become boggedged down the abundance of auditing and article content,
    as shown in Figure 7-1.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_264_0.png)


    Figure 7-1: FastCompany.com home page


    Foremore, the Company design is elementarily flexible. Rather subscribing to the
    temptation of building a fixed-width design, FC built its site to accommodate
    the user''s preferred window size (see Figure 7-2). However, notice how the width
    of the content area expands and contracts as the browser window increases or decreases
    — but only up to a point. At larger widths, the page''s layout expands, stopping
    that line lengths never remain friendly (and illegible) lengths.'
