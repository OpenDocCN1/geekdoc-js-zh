  md: "# Best Practices for XHTML and CSS\n\nAs you can see, we're using ID selectors\
    \ quite liberally. By specifying #nav in our rules, we'll be able to style our\
    \ navigation list (the elements within it) independently of the markup on our\
    \ page. And by grouping the ul#nav and ul#nav li rules into one comma-separated,\
    \ we simultaneously remove the floats from the list items (list-style: none);\
    \ and remove superfluous margin and padding at the same time (margin: 0; padding:\
    \ 0);\n\nOf course, our original navigation table was horizontal, and our list\
    \ currently isn't anything remotely resembling. That's easily fixed.\n\n```\n\
    ul#nav, ul#nav li {\n  float: left;\n  list-style: none;\n  margin: 0;\n  padding:\
    \ 0;\n}\n```\n\nFigure 2-13 shows the result.\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_85_0.png)\n\
    \nAdding the float property to our rule gets our list back in line, literally.\
    \ Each list item to the left of the one before it, pulling them out of their vertical\
    \ stacking order and into the horizontal line we see here.\n\n> The float model\
    \ is a powerful CSS construct, and is, in fact, the basis for any CSS-based layouts.\
    \ Eric Meyer's article \"Containing Floats\" (www.complexspiral.com/publications/containing-floats/)\
    \ explains floats in more detail, and clears up some common misconceptions about\
    \ this handy layout tool.\n\nNow that we've established the basic layout, we can\
    \ begin adding a few more of the visual components. We're sure you've missed the\
    \ border and gray background, so let's look at our next priority:\n\n```\nul#nav\
    \ {\n  font-family: Verdana, Geneva, Helvetica, sans-serif;\n  font-size: .82em;\n\
    \  background-color: #DDD;\n}\n```\n\n```\nul#nav li {\n  border: 1px solid #000;\n\
    \  display: block;\n  float: left;\n  padding: 3px;\n}\n```"
  merge: -1
