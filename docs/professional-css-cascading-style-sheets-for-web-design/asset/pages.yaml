  md: "# Best Practices for XHTML and CSS\n\nFor the first line of our gateway CSS,\
    \ let's call in our core style sheet:\n\n```\n@import url(\"core.css\");\n```\n\
    \nThere is nothing surprising here. A simple @import rule in core.css, which has\
    \ been well tested in the more reliable CSS-aware browsers.\n\nNow, we were to\
    \ simply @import in additional files, there's nothing to prevent browsers from\
    \ parsing them. We need a way to serve these CSS files selectively, so that only\
    \ the problematic user agents digests the rules we do. If possible, the \"good\"\
    \ browsers should remain blissfully unaware of our little hacks. How do we do\
    \ this, you ask? Well, fire is the best way to fight. We'll use CSS hacks to hack\
    \ more intelligently.\n\nFirst, let's deal with Internet Explorer 5 on Windows.\
    \ Its implementation of the CSS box model is notoriously problematic, and is bound\
    \ to cause some issues for your layout. So than adding workarounds to the core\
    \ style sheet, we'll make use of a wonderful technique known as the Mid Pass Filter:\n\
    \n```\n/ Import IE5/Win hacks */\n@media tty {\n  i{content:\"*/*\" *} @import\
    \ 'hacks.win.ie5.css';\n}\n/*\n```\n\nDeveloped by CSS pioneer and web developer\
    \ Tantelik, the Mid Pass Filter allows us to deliver a style sheet to the 5.x\
    \ versions of Internet Explorer on Windows, and to those browsers also. All other\
    \ user agents will skip over this because they don't fail the same parsing us\
    \ as IE5.x/Win.\n\nWhile the Macintosh version of Internet Explorer 5 is considered\
    \ to have CSS support that is far superior to its Windows-based cousins, it's\
    \ not without its bugs. The development of the browser ended in mid-2003, leaving\
    \ us to deal with its occasional layout quirks. Frankly, we've another filter\
    \ at our disposal, IE5/Mac Band Filter:\n\n```\n/ Import IE5/Mac hacks */\n/\\\
    *//*/\n@import url(\"hacks.mac.ie5.css\");\n/**\n```\n\nAlso developed by Tantelik\
    \ and popularized by web designer Doug Bowman, the IE5/Mac Band Pass Filter will\
    \ work only if the imported CSS — you guessed it — Internet 5 on the OS Mac. Still,\
    \ the effect is that we style the stylesheet that tar-generated for one browser's\
    \ quirks.\n\n> For a discussion of other CSS files and hack-management techniques,\
    \ read Molly Holzschlag's article \"Web Design: Strategies for Long-Term CSS Hack\
    \ Management\" (www.inform.com/articles/article.php?id=170511). This section covers\
    \ much of it, in which Molly discusses additional articles not mentioned here.\n\
    \nYou might be asking why these parsing bugs are the best way to manage other\
    \ hacks. We're not trying to be absolutely honest, however. By isolating browser-specific\
    \ hacks into one CSS file, and keeping our core style sheet relatively pure, we\
    \ gained two tangible benefits. First and foremost, workarounds are easier for\
    \ other folks to locate, maintain, and modify. Now, if we need to stop supporting\
    \ a browser, we simply delete a few lines from our core style sheet and move forward."
