  md: '# Chapter 4


    means your menus could potentially appear underneath the Flash content; obscuring
    the ability to click on any of the covered options. The solution is to include
    a wmode tag in Flash''s embed object. (Details can be found at www.macromedia.com/support/flash/ts/documents/flash_top_layer.htm).


    +   * Tip #3: Include a z-index property if your document has layers. If your
    layout is using a z-index property, your Superfish navigation must have one as,
    but on a higher level than ever. The z-index can be added to your parent''s unordered
    list, or (in the case of the PGA Championship site) you can wrap your navigation
    with a container div, and also the z-index to that element. Doing so will raise
    your navigation above the rest of the fray, so the menu drop down over anything
    they may come in contact with.


    # The Bottom Line


    So, after all, why is making Superfish recommended? The answer is simple: The
    issues noted here make Superfish the most accessible, cross-browser-friendly drop-down
    menu solution out there. It''s also far, far lighter in bytes than anything else,
    and much easier to update and maintain. If you implement the menu on a highly
    trafficked site (the PGA Championship site, for example, was hits of times per
    hour), having a light drop-down menu solution is optimal.


    # Web Standards-Compliant Flash Embedding


    One of the common problems Web developers face when creating standards-compliant
    XHTML markup embedding Flash content. Most developers simply copy and paste the
    standard set of object/embed tags creates when publishing a movie. However, because
    they loaded with all kinds of invalid attributes and elements, they wreak havoc
    on a document''s conformance to Web standards.


    Fortunately, there are workarounds. Here are the three most popular methods used
    to embed standards-compliant Flash content.


    # The Flash Satay Method


    The Satay method (www.alistart.com/articles/flashatay/) removes the embed tag
    (a proprietary element not in any W3C specification) and removes some "necessary"
    proprietary attributes in the object tag. It works great, but with one huge caveat:
    Flash movies in Internet Explorer for Windows won''t start until they are 100
    percent loaded.


    The Satay method offers a workaround, which includes fooling Internet Explorer
    for Windows by embedding an empty "container" movie set to the same parameters
    (width, height, and so on) as the "real" movie, and using the container div to
    load the actual content. Internet Explorer will fully stream the movie, and the
    markup will validate, but at a cost to any developer''s sanity — each and every
    embedded movie requires an accompanying empty container movie, creating a lot
    of extra directory trash and headaches.'
