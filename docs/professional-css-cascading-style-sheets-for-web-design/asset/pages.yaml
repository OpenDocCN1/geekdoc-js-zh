  md: "# Developing the Site\n\nNow it's time to turn our attention to building the\
    \ page template with markup and a flash of style.\n\nWhen building a page with\
    \ CSS, it's best to code the content in semantic HTML, as demonstrated in the\
    \ projects discussed in the previous chapters. That means using the appropriate\
    \ markup to reflect the contents of the element. A heading should be placed in\
    \ a heading tag; a paragraph should be placed in a p tag and so on.\n\n# Outside-In,\
    \ Top-Down Approach to CSS\n\nOnce the markup is complete, I work with the *outside-in,\
    \ top-down* approach when applying CSS properties to the HTML properties.\n\n\
    So, first I look at the page as a whole by applying CSS rules to the body element.\
    \ This is the outside-in approach. I work from the top of the page to the bottom\
    \ by working on the header, followed by the navigation, content areas, and then\
    \ the footer.\n\nFor this design, the first step is to look at centering the fixed-width\
    \ layout.\n\n# Centering the Page (and Why It Matters)\n\nBack in the mid 1990s,\
    \ my solution to center the Web site design came from the use of HTML frames.\
    \ Frames aren't very user-friendly, and if they aren't coded correctly, can lock\
    \ out disabled users or tech-browser to your site. Keeping visitors away from\
    \ a Web site is not a habit I want to keep for this new design.\n\nThankfully,\
    \ in this new millennium, we can use CSS without resorting to dreaded frames.\
    \ Let’s take a look at the markup:\n\n```\n<body>\n  <div id=\"frame\">\n    [...content\
    \ goes here... ]\n  </div>\n</body>\n```\n\nFor the `div` titled frame, we want\
    \ to set the width as well as the margins:\n\n```\n#frame {\n  width: 800px;\n\
    \  margin: 0 auto;\n}\n```\n\nThe `margin` property values are written in shorthand\
    \ and tell the browser to reduce the margins on top and bottom of the element\
    \ to zero, while automatically adjusting the `margin` on the left and right side\
    \ that they are equal, as shown in Figure 9-8."
  merge: -1
  pgno: 353
- img_proc: true
  md: "# Chapter 9\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_354_0.png)\n\nIn a\
    \ world with only perfect CSS-compliant browsers, this little of CSS is all we\
    \ need to do. However, Internet Explorer for Windows doesn't understand the auto\
    \ value for margins and thus won't center the layout in that browser, as shown\
    \ in Figure 9-9.\n\nTo work around Internet Explorer, we apply the text-align\
    \ property to the body element:\n\n```\nbody {\n  text-align: center;\n}\n```\n\
    \n330"
