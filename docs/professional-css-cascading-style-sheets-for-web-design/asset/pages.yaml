  md: "# Blogger: Rollovers and Design Improvements\n\n# # What Does It All Mean?\n\
    \nWe're not going to go through each and line of CSS because it's not all relevant\
    \ to this rollover section. However, let's look at the last few rules in detail.\n\
    \nThe first thing to note is that we've given each of the two rows classes (.odd\
    \ and .even) a background color. This lets us create our alternating rollover-color\
    \ effect.\n\n```\ntable tbody tr.odd {\n  background-color: #f7f7f7;\n}\n```\n\
    \n```\ntable tbody tr.even {\n  background-color: #fff;\n}\n```\n\nNext, we set\
    \ a rule that changes the background color of a row when the user hovers over\
    \ it:\n\n```\ntable tbody tr:hover {\n  background-color: #ffe08e;\n}\n```\n\n\
    And finally, we change the color of the text contained within the row that is\
    \ being hovered over, making it darker to stand out against its new background\
    \ color:\n\n```\ntable tbody tr:hover {\n  color: #444;\n}\n```\n\nIt really wonderfully\
    \ simple stuff.\n\n# # Changing the Color of Text\n\nThe final hover we're going\
    \ to look at in this section is highlighting text (be it plain text or linked\
    \ text) when a user hovers over a div or similar element.\n\nWhy might this be\
    \ useful? Imagine a site that contains many links. Developers usually use their\
    \ links so that they're a bright color, making them stand out from the surrounding\
    \ text. That's all very well when you have a few links per page, but what happens\
    \ if your site contains hundreds of links per page? The eyes of the user will\
    \ be assaulted by a mass of bright color as hundreds of links vie for attention.\
    \ How can you pick out the subtles of your design if all you can see is a sea\
    \ of color?\n\nThe solution (or one of them) is simple. If we hide the bright\
    \ colors of these links until the user hovers the mouse over the relevant section\
    \ of the page, then we can present us, with a much calmer site. We'll make the\
    \ links obvious only when the user is indicat-ing that he or she is interested\
    \ in that section of the page, by moving the mouse over it.\n\nFigure 3-79 shows\
    \ that approach in action.\n\n143"
