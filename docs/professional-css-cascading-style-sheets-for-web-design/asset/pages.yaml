  md: '# Blogger: Rollovers and Design Improvements


    If you were to ask a product manager, they might say that the simplified design
    is the best. Especially in regards to how much better the new home page helps
    communicate what a blog is, and the benefits of starting one immediately using
    Blogger.


    Blogger''s visitors probably don''t notice the site''s design as much. In fact,
    if we did our job right, users might have a small affinity to the look of Blogger,
    but they wouldn''t really pay much attention to the design. They should be able
    to immediately grasp the benefits, and see a clear path to publishing their blog
    in short as as much time as possible.


    Users noticed the huge increase in number of available templates from which they
    could choose for their blog. When it comes to customization, an abundance of pre-fabbed
    choices gives them lots of options with which to express their voice and personality.


    +   Later in this chapter, we will code behind the rounded corners on blogger.com,
    but provide a different solution to the one you used on the site. Our method requires
    no additional divs, but some cross-browser performance, with IE receiving no corner
    styling. If you were doing the project again would you consider such an approach,
    or as a designer, do you demand that each and every element of the design be adhered
    to?


    +   If the choice were strictly up to me, and I was the only working with the
    code, I''d go the leaner, no-additional-div option. I have the benefit of understanding
    exactly what the home page and tradeoffs are, especially how the more advanced
    CSS operates. Lean, simpler HTML is always plus, especially if HTML can be removed
    that was inserted specifically for the purpose of style hooks. Page module would
    not only be simpler, but more stable, and less reliable on a precise of classical
    browsers.


    I''ve made several choices with recent projects to get IE only a base of setting,
    and then give other more CSS-capable browsers additional advanced styles. The
    term for this approach is "Progressive Enhancement," by Steven Champion, in an
    article he wrote on a a few years ago. Some browsers accept a base design that
    functions well, give more capable browsers a more advanced design that builds
    on the base.


    But the choice isn''t only to make. In fact, the rounded corners throughout the
    site were pretty big players in helping to get Blogger a simple, friendly feeling.
    A large (possibly the majority of) users are still using IE as their default browser.
    If we had gone with the progressive enhancement approach, those IE users would
    see a page design that didn''t mesh with the Blogger "appearance."


    With other projects, getting all the design details in IE correct may not been
    important. But because Google was targeting a wider, less-touchy audience with
    this Blogger redesign—one that is also more likely to be using IE as their browser—compromising
    on design aesthetic in IE browsers for the sake of leaner HTML wouldn''t necessarily
    have been a good choice.


    +   Blogger has noticed benefits from the redesign, either financial or in the
    number of customers they''re attracting


    +   As stated previously, I can''t be specific with numbers. But I can say that
    the number of new users registrations Blogger went up dramatically after the redesign
    of the home page and registration system. Revamped the home page drove more users
    into the registration system. The simpler registration system had fewer pages
    than the previous one. And it was designed to use the guide all help to get as
    quickly and as effortlessly as possible, allowing them to set up a blog and be
    posting to it in less than 5 minutes. These changes basically guaranteed success.
    Not even Google knew how big the success would be.


