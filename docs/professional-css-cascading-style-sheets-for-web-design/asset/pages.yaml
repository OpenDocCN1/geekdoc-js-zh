  md: '# Rules for HTML-to-XHTML Conversion


    Hypertext Markup Language (HTML) is a simple language that led to the boom of
    the Web in the 1990s. However, its simplicity was also a roadblock for progress.
    The early success of HTML attracted a larger Web developer audience and spawned
    a desire to push the medium. HTML outgrew its simple upbringing.


    For example, while placing images in a Web page is easy to do with HTML, placing
    the images in a specific location on a Web page is possible without violating
    the intent of the table tag. Another example is placing the multimedia content
    in a Web page, which usually results in the use of invalid, proprietary elements
    and attributes.


    In addition, HTML contained a limited set of elements and attributes. Other industries
    such as engineering or chemical companies couldn''t mark up their formulas. Instead
    of writing an allencompassing version of HTML, the W3C worked on eensible Markup
    Language (XML), which is a flexible meta-language.


    XML provides the framework for all markup languages to be created. Other industries
    can create their own markup languages rather than face a restrictive environment
    such HTML.


    However, for most Web developers who are familiar primarily with HTML, the major
    benefits of XML (creating new elements and specifying their treatment) are not
    important. Instead, the elements found in HTML will be of the most use.


    The W3C reformulated HTML of the XML standard to create backward-compatibility,
    while making the language embrace the structure found in XML. XHTML is the essence
    of HTML defined in the XML syntax.


    In other words, XHTML is a set of rigid guidelines to allow Web developers familiar
    with HTML to write valid XML documents without being completely lost.


    ![](img/70fa44d3a461f43c7a35cac2b893273d_413_0.png)'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Appendix B


    Yet, reworking content from HTML into XHTML creates when developers move into
    a stricter coding environment. The XML syntax (or rules for coding) is less forgiving
    of coding mistakes than old-school HTML and browsers.


    To help you achieve more solid understanding of coding XHTML correctly, this appendix
    serves as a guide to transition the Web developer from an old-school HTML developer
    to a proper XHTML user.


    # The XML Declaration


    No doubt, as a Web developer you know the importance of the html element at the
    top of your Web document. With XML you may place the following line above the
    het element:


    ```

    <?xml version="1.0" encoding="iso-8859-1"?>

    ```


    That line simply states that you are using version 1.0 of XML with the character
    set of iso-8859-1.


    Note that XML declaration is recommended, but not required. Because it''s a simple
    line that goes at the top of your Web document, you wouldn''t include it? Well,
    here are some potential problems when using the XML declaration:


    +   - Some browsers might render the markup as it appears when you "view source"
    a Web Page instead of rendering the document.


    +   - Other browsers might parse the Web document as an XML tree instead of rendering
    the document.


    +   - In Internet Explorer for Windows 6.0, the browser will display the Web document
    in quirks mode, even if the Web document is valid.


    +   - If you use PHP to create dynamic pages, you might notice that the start
    of that line with the left bracket and question mark is you begin writing PHP
    code. This code, if as-is in your PHP document, confuses your server and will
    not successfully parse your page. The workaround for this situation is to use
    the echo function in PHP at the start of the first line:


    ```

    <?php echo "<?xml version=''1.0'' encoding=''iso-8859-1''\n" ?> ?>

    ```


    # Picking Your Comfort Level


    XHTML comes in three different flavors: strict, transitional and frameset. These
    varieties are based on three Document Type Definitions (DTDs). DTDs define XHTML,
    and determine which elements and attributes are allowed and how they should be
    used. Think of a DTD as a dictionary of allowable terms for a certain document.


    To create a valid XHTML document, you must include a DOCTYPE Declaration, which
    makes up a line or two at the top of your document (should you decide to use one).
    The line'
