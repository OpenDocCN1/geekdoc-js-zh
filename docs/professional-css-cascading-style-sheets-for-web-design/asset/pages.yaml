  md: "# Chapter 9\n\nLike the dedicated Web developer I am, often have the option\
    \ set to Every Visit to the Web Page. While this helps in troubleshooting problems\
    \ with building Web page designs, I don't want the browser to cache and get displaying\
    \ on an old version of a Web page when I'm trying to solve another browser issue.\n\
    \nHowever, this also means that the browser is forced to reload the image time\
    \ the cursor rolls over it, instead of relying on the cached version. So, to get\
    \ the flickering to occur, I set the option to Automatically.\n\nAnother solution\
    \ is a CSS rule that is also quite easy and doesn't rely every visitor to my Web\
    \ site to change his or her Internet Explorer settings. The CSS rule is set up\
    \ to apply the very same background image in the anchor link to the parent element.\
    \ So, as the browser refreshes the background image and the image vanishes, the\
    \ same image will show up behind it in the parent element's background:\n\n```\n\
    #header h1.logo {\n  background-image: transparent url('/assets/img/logo_screen2.gif')\
    \ no-repeat 0;\n}\n```\n\n# Moving to the Tagline\n\nWith the logo adequately\
    \ addressed, I moved to the tagline. The tagline is an HTML text, so I can change\
    \ it when it strikes my fancy without having to crack open a digital imaging software\
    \ or rack my brain learning to use PHP and the GD library to generate an image\
    \ on the fly.\n\nFor the tagline, let's apply a few declarations:\n\n```\n#p.tagline\
    \ {\n  font-family: Verdana, Arial, Helvetica, sans-serif;\n  font-size: 1.2em;\n\
    \  color: #6e2703;\n  margin: -1px 0 35px 0;\n  padding: 0 0 15px;\n  letter-spacing:\
    \ 0.3em;\n}\n```\n\nFirst, I set the tagline to the Verdana font (with appropriate\
    \ typeface backup measures), and then I set the typeface to 1.2em.\n\nNext, in\
    \ the CSS rule is a setting for the color for the text (which is set to #6e2703).\
    \ When picking colors for a design, a little trick I use is to pick colors from\
    \ other areas in the design. For this color, I went to the circles in the logo\
    \ design and used the Eye Dropper tool to pick the color. By doing this, I quickly\
    \ and painfully pick a color that works harmoniously with other colors in the\
    \ design, as shown in Figure 9-20."
