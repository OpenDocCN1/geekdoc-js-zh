  md: "# Rules for HTML-to-XHTML Conversion\n\nof code indicates what kind of DTD\
    \ you are using, and sets the groundwork for how the browser and\nvalidators should\
    \ handle your content.\n\nDefine your Web document in strict means that you will\
    \ follow the letter of the law as well as the\nspirit. You are a true believer\
    \ in XHTML and no longer to use any HTML elements that were used\nfor presentation.\
    \ With the strict DTD, you are using XHTML elements to mark up content and not\
    \ format\nthe presentation of the page. Place the following line below the XML\
    \ declaration, but before the HTML\nelement:\n\n```\n<!DOCTYPE html\nPUBLIC \"\
    -//W3C//DTD HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml/DTD/xhtml1-transitional.dtd\"\
    >\n```\n\nThe transitional DTD is best if you want to use it within XHTML, but\
    \ want some more freedom to depre-\ncated elements and attributes along the way,\
    \ or to use classic HTML tags:\n\n```\n<!DOCTYPE html\nPUBLIC \"-//W3C//DTD XHTML\
    \ 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml/DTD/xhtml1-transitional.dtd\"\
    >\n```\n\nThe frameset DTD is for the Web documents that require you to use frames\
    \ in your Web pages:\n\n```\n<!DOCTYPE html\nPUBLIC \"-//W3C//DTD XHTML 1.0 Frameset//EN\"\
    \n\"http://www.w3.org/TR/xhtml/DTD/xhtml1-frameset.dtd\">\n```\n\nNote that the\
    \ frameset DTD is to be used in Web documents that contain the frameset only.\
    \ You do not\nneed to use the frameset DTD for each Web document that comprises\
    \ a “frame” in a frameset. For those\nddocuments, you should use either a strict\
    \ or transitional DTD.\n\n# Rules for XHTML\n\nNow that you have set up the XML\
    \ declaration and the DTD, the next step is to properly format your\nWeb document.\
    \ The following sections cover how to mark up your content and use XHTML\ncorrectly.\n\
    \n# Don’t Forget the Namespace Attribute\n\nStating what type of document you’re\
    \ using at the top of the document indicates which elements\\and attributes are\
    \ allowed in the document. Along with the DOCTYPE declaration, the namespace is\
    \ an\n means of identifying your markup, in this case XHTML.\n\nIn order to identify\
    \ the namespace, place what’s called a namespace attribute, xmlns, in the html\
    \ element,\nin in the opening html tag:\n\n```\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ lang=\"en\">\n```"
