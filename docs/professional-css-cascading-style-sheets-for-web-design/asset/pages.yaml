    # Building the Box


    The primary navigation has a fixed width, we''ll set that for:


    ```

    #priNav {

    width: 248px;

    }

    ```


    We used a left float to ensure that the navigation would appear on the left, and
    the rest of the content to the right:


    ```

    #priNav {

    width: 248px;

    float: left;

    }

    ```


    The container uses a padding of 2 pixels on the left and right that should be
    matched here by adding a similar margin to the right side of the primary navigation.
    We''ll use margin instead of padding to keep the writable area of the 2 pixels
    from the edge of the main container and 2 pixels from the main content area:


    ```

    #priNav {

    width: 248px;

    float: left;

    margin-right: 2px;

    }

    ```


    To give the header''s drop-shadow gradient container some room and keep the text
    from running to the right edge of the section dividers, we''ll add padding to
    the top and right of the navigation:


    ```

    #priNav {

    width: 248px;

    float: left;

    padding: 6px 2px 0 0;

    margin-right: 2px;

    }

    ```


    That''ll do for the primary navigation''s container. Let''s move on to style elements.


    # Styling the Section Headers


    Each h2 in the primary navigation covers one of the six major areas of UF''s.
    We''ve already set the font properties for the h2 element globally, but here,
    we''ll let it breathe a little by adding letter-spacing:


    ```

    #priNav h2 {

    letter-spacing: 1px;

    }

    ```'
