  md: '# Introduction


    Designers are traditionally creative types, tending to favor the right brain,
    while programmers examine the details of a system more clearly, preferring a left-brain
    mode of thinking. So, when faced with the challenge of designing for the Web,
    designers are faced with what on the surface appears to be an oxoron, a design
    technology named cascading style sheets (CSS).


    CSS is a Web markup standard by the Worldwide Web Consortium (W3C) that enables
    Web designers and developers to define consistent styles in Web pages, and to
    apply the template to multiple pages. CSS is a valuable tool for streamlining
    and speeding up Web development, although browser compatibility issues are a major
    pitfall.


    While WYSIWYG Web pages are getting closer and closer to a complete visual authoring
    experience, those software applications aren''t truly professional. CSS tools
    by its nature that, for the most part, must be written out manually to create
    compelling work. The problem with that most designers have a hard time committing
    to writing lines of code to get their work done.


    Designers who express joy in writing PostScript by hand are hard to find. Designers
    let Adobe Illustrator (or any similar program) provide a visual authoring environment
    and hide the coding in the background. All the designer sees is the imagery, while
    the computer handles the workload.


    Another hindrance to using CSS doesn''t have anything to do with CSS itself, but
    rather the implementation of CSS in Web browsers. Browser vendors incorporated
    the technology into their browsers slowly over time. While CSS support is 100
    percent as of now, designers still run into problems when trying to shore their
    designs in older or outdated browsers. That means diving into the guts of CSS
    and coding hacks and workarounds. The bottom line translates into more time writing
    and revising, and less working in WYSIWYG tools.


    Does this mean CSS is out-of-control or unstable technology? Not in the least,
    but it takes some concerted effort to strangle professional-looking designs.


    Even if you know the basics of CSS (the properties, the acceptable values, the
    selectors, and so on), putting the technology to effective use can be difficult
    downright frustrating. CSS besties the best of us — even those who actually understand
    the W3C specifications as opposed to those who can only skim them in awe in their
    browsers.


    In the right hands, however, CSS is the tool.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    Once designers have mastered the basics of the technology, the understanding of
    its purpose, and have obtained a certain amount of experience with the technology,
    almost any design idea sketched on a cockpit-tail napkin or doctored in Adobe
    Photoshop becomes possible.


    To help you get to that point, keep Professional CSS nearby.


    Professional CSS is one of the few books on the market today addressing standards-based
    CSS on large, multi-page, well-designed, real-world sites using CSS in an integrated
    fashion. Focusing on the best-practices aspect of Web development, and using examples
    from real-world Web sites, this book uniquely offers applied, CSS-enabled solutions
    to design problems.


    # Whom This Book Is For


    Those designers who understand CSS at an intermediate to advanced level, but who
    are not clear on how to effectively develop CSS-enabled designs at a professional
    level, will benefit tremendously from the information in this book. In particular,
    the following readers will find this book most useful:


    +   - Intermediate to experienced HTML users now. Any Professional developer who
    has been exposed to CSS, but needs a better understanding of how to put the pieces
    together to create professional-level Web sites.


    +   - Professional designers. Web developers learning CSS (without any knowledge
    of traditional, 1990s-era design practices) and want to understand the best practices
    for utilizing the technology.


    # How This Book Is Structured


    Core chapters of this book focus on one designer and a Web site that designer
    worked on. Each chapter provides easily demonstrations of CSS tips and techniques
    used for the site. Additionally, designers provide greater insight into their
    process by talking about what they would have done differently.


    Following is a brief overview of how this book is organized and which co-authors
    have contributed their insights:


    +   - Chapter 1, "The Planning and Development of Your Site." To get things rolling,
    you will be familiar with all the preliminaries that professionals iron out before
    they begin working on their sites. This chapter helps you avoid problems later
    in the development of your site by properly planning what must be done.


    +   - Chapter 2, "Best Practices for HTML and CSS." Ethan Marcotte, a steering
    committee member of the Web Standards Project and a recognized leader of the standards-based
    Web design movement, shares some insights on using Extended HTML (XHTML) with
    CSS.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction


    +   Chapter 3, "Blogger: Rollovers and Design Improvements." Dunstan Orchard,
    also a member of the Web Standards Project, delves into the behind-the-scenes
    development of a new look and feel for blogger.com (a Google Web log). Orchard''s
    interview with one of the principals in the project, Douglas Bowman (an influential
    designer whose highly publicized and hugely successful redesign of several Web
    sites has pushed him to the forefront of standards-compliant Web design), provides
    some extremely valuable insight. This chapter also addresses key issues such as
    bounding boxes and rollovers.


    +   Chapter 4, "The PGA Championship." As a Senior Interactive Designer at Turner
    Sports Interactive, Todd Downey has been designing and developing Web destinations
    for Professional Golf Association (PGA) tournaments, the PGA Championship and
    the Ryder Cup. In this chapter, Downey provides a first-hand perspective on the
    ins and outs of designing a site relied upon by millions of fans all over the
    world. Key issues addressed in this chapter include drops, drop-down menus, and
    embedding Flash into a Web site.


    +   Chapter 5, "The University of Florida." Mark Tammell, who is in charge of
    directing the Web presence of one of the country''s leading universities, discusses
    how the University of Florida developed tackling browser compatibility issues,
    as well as developing navigational structures.


    +   Chapter 6, "ESPN.com: Powerful Layout Changes." Dunstan Orchard talks with
    Mike Davidson, Senior Associate Art Directory and Manager of Media Product Development
    at the Walt Disney Internet Group, about an extremely effective makeover for ESPN.com
    Orchard discusses how designers were to develop a site that provides the flexibility
    required by an organization feeding its readers up-to-date sports information.


    +   Chapter 7, "FastCompany.com: Building a Flexible Three-Column Layout." Ethan
    Marcotte sat with Dan Cederholm to discuss the extreme makeover of the Web site
    for Fast Company, publisher of a popular magazine by name. In this provocative
    interview, Marcotte presents tips on CSS positioning and, in particular, details
    surrounding three-column layouts.


    +   Chapter 8, "Stuff and Nonsense: Strategies for CSS Switching." In an interview
    with Andy Carke (Creative Director for Stuff and Nonsense), Ethan Marcotte explores
    how to improve Web site accessibility for all users to ensure universal access.
    In this chapter, Marcotte delves into CSS switching and ways to overcome pesky
    browser compatibility problems. The innovations displayed at the Stuff and Nonsense
    site provide excellent examples of these.


    +   Chapter 9, "Bring It All Together." Lead author Christopher Schmitt shows
    his own Web site development to show all the tips and techniques presented in
    the book can be put to practical use.


    Additionally, the appendices in this book provide handy access reference material
    for HTML 4.01 elements, rules for HTML-to-XHTML conversions, properties of CSS
    2.1, and a troubleshooting guide to help with common problems.'
  merge: -1
  pgno: 13
