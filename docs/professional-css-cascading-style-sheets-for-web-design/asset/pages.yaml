  md: '# FastCompany.com: Building a Flexible Three-Column Layout


    ![](img/70fa44d3a461f43c7a35cac2b893273d_277_0.png)


    For the purposes of this chapter, we''ll focus on the primary areas of the home
    page''s layout:


    +   - The horizontal header that spans the top of the page

    - The primary center column, which contains high-priority content and other features
    of interest

    - The left- and right-hand columns, which house such auxiliary content as subnavigation,
    advertising-tanners, and the like


    Think of each of these top-level blocks as a container for content — which is,
    in fact, exactly how FastCompany uses them. Within each block, we can store discrete
    chunks of content, and apply CSS rules to precisely control the presentation of
    each.


    Establishing this flexible, three-column layout is the primary goal of this chapter.
    Once that has been established, we can style the finer points of the design to
    our heart''s delight. Therefore, we will focus on establishing this layout framework—of
    header, content, left- and right-hand columns—to prepare our page for a truly
    professional-looking design.'
