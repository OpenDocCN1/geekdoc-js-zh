  md: "# Listing 9-3: The Markup for the Navigation\n\n```\n<h4 class=\"mainnav\"\
    ><a href=\"#mainnav\">Main Navigation</a></h4>\n<ul id=\"mainnav\">\n  <li id=\"\
    home-link\"><a href=\"/\"><span>Home</span></a></li>\n  <li id=\"journal-link\"\
    ><a href=\"/journal\"><span>Journal</span></a></li>\n  <li id=\"work-link\"><a\
    \ href=\"/work\"><span>Work</span></a>\n    <ul>\n      <li><a href=\"/work/print\"\
    ><span>Print</span></a></li>\n      <li><a href=\"/work/web\"><span>Web</span></a></li>\n\
    \      <li><a href=\"/work/accolades\"><span>Accolades</span></a>\n    </ul>\n\
    \  </li>\n  <li id=\"pub-link\"><a href=\"/publications\"><span>Publications</span></a>\n\
    \    <ul>\n      <li><a href=\"/publications/books\"><span>Books</span></a></li>\n\
    \      <li><a href=\"/publications/articles\"><span>Articles</span></a></li>\n\
    \      <li><a href=\"/publications/speaking\"><span>Speaking Events</span></a></li>\n\
    \    </ul>\n  </li>\n  <li id=\"shop-link\"><a href=\"/shop\"><span>Shop</span></a></li>\n\
    \  <li id=\"about-link\"><a href=\"/about\"><span>About</span></a></li>\n  <li\
    \ id=\"contact-link\"><a href=\"/contact\"><span>Contact</span></a></li>\n</ul><!--\
    \ END mainnav -->\n```\n\nNow that I have included the markers, I need to use\
    \ CSS to bring the Publications menu back so that the user can see it (as shown\
    \ in Figure 9-46) by using the display property with a value of block.\n\n```\n\
    .pub-page ul#mainnav li#pub-link ul {\n  display: block;\n  margin: 0;\n  padding:\
    \ 0 0 7px 0;\n}\n```\n\n![](img/70fa44d3a461f43c7a35cac2b893273d_393_0.png)"
