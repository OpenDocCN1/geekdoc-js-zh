    on a page that had a high degree of interactivity (such a complex form that requires
    the user to enter a sizable amount of data), you might use headers that describe
    the data contained therein (My Personal Information, My Information, Shipping
    Address, and so on).


    Armed with this high-level list, we can turn these content groupings into a rough
    wireframe that demonstrates how these relationships might play out on a page.'
