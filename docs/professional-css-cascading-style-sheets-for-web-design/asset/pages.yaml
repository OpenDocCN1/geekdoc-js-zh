  md: "# Chapter 8\n\nYou'll see shortly how these parameters play a part in our style\
    \ switcher, but for now let's create this\nswitch.php file, and paste in the following\
    \ code:\n\n```\n<?php\n$domain = \"my-site-here.com\";\n\nif (strstr($_SERVER['HTTP_REFERER'],\
    \ $domain)) {\n    $bounce_url = $_SERVER['HTTP_REFERER'];\n} else {\n    $bounce_url\
    \ = \"http://$domain/\";\n}\n\nsetcookie('style', $_GET['style'], time() + 31536000);\n\
    header(\"Location: $bounce_url\");\n```\n\nAnd that's not, really—this won't evolving\
    \ into 80 lines of code over the next 50 pages, we\nprom. In JavaScript, we had\
    \ to write custom functions to handle some of the basic tasks we needed\nout style\
    \ switcher to toggle. By many of these tasks (as reading and writing cookies)\
    \ we are already part of the language. Using these built-in functions, we can\
    \ cut down drastically on\nbloat, and let our style switcher out the door as quickly\
    \ as possible.\n\nThe meat of this cookie is the antipentine line:\n\n```\nsetcookie('style',\
    \ $_GET['style'], time() + 31536000);\n```\n\nWhereas we had to create a custom\
    \ function to set a cookie in JavaScript, it seems that PHP has the\nwork for\
    \ us. In setcookie() function is readily available to us, and snaps nicely to\
    \ our script.\nBut the one overlap with our JavaScript function is that we're\
    \ also passing three arguments\nto the function, the two being the most critical.\
    \ The first argument is, as before, simply the\nname for our cookie, and we're\
    \ sticking with \"style\".\n\nThe second argument($_GET['style']) defines what's\
    \ actually stored the value of our \"style\"\nThe $_GET array is actually a named\
    \ list, or associative array, of all the parameters passed to\na page query string.\
    \ Let's assume that our switch.php page is loaded with the URL:\n\n```\nhttp://my-site-here.com/switch.php?style=hot&cool\n\
    ```\n\nGiven that query, the $_GET['style'] is what follows the equal sign in\
    \ the style hot\nvalue/pair, or \"hot\"; similarly, $_GET['css'] would return\
    \ a value of cool. As a result, the\nsetcookie() will build a style cookie with\
    \ hot, which is exactly what we\n(and our users) want.\n\nThe time(+31536000)\
    \ might look like we need a decoder to make sense of it, but it's not quite\n\
    imimidating as it might seem. The function returns the current time, measured\
    \ in\nsecond from midnight on January 1, 1970—also called the \"Unix Epoch,\"\
    \ a common point of reference for functions dealing time-based tasks. When we\
    \ have the current time, we're adding a year's\nworth of seconds to it (60 seconds\
    \ * 60 minutes * 24 hours * 365 days = 31536000). So, with all this,\n're essentially\
    \ getting the time that is exactly one year later than the cookie was set, and\
    \ using\nto determine when the cookie expires.\n\n302"
