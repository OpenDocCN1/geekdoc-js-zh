    # 6.12.2 Installing git


    In order to install letsencrypt we need to clone the latest version from git.
    But in order to do that first need to make sure we have git installed on our system:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_78_0.png)


    We can now use git command. Keep in mind that in this example we are in bash.exe
    on Windows 10. If sudo and apt-get are not working, there is a work-around.


    First, if you are hosting your server remotely, use ssh bash.exe to log into your
    server, and all linux commands will become available over there.


    Second, if you are developing on localhost and don''t need to log into your remote
    host, you must install Ubuntu for Windows in addition to bash.exe (This is explained
    in first chapter of this book.)


    Third, if you are working directly on Linux, this doesn''t apply and apt-get should
    work out of the box. If not, it can be installed manually.


    # 6.12.3 Cloning letsencrypt


    Now we''re ready to clone the latest version of letsencrypt to our server. This
    is accomplished by running the following Linux command:


    ```

    git clone https://github.com/letsencrypt/letsencrypt /opt/letsencrypt

    ```


    ![](img/aad9680d7dc58780e0f8fc70276d7011_78_1.png)


    Figure 6.7: Again, you might want to prede this command with sudo as shown in
    the following example.'
