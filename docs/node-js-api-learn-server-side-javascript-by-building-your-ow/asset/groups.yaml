  mdcn: "\n\n标题：Node.js API\n\n版本：第一版 – 2020年2月10日\n\n类型：软件，Web 开发\n\n出版社：Learning\
    \ Curve Books\n\n印记：独立出版\n\nISBN：9798612518297\n\n作者：Greg Sidelnikov (greg.sidelnikov@gmail.com)\n\
    \n编辑、志愿者、贡献者：Grace Neufeld。\n\nLearning Curve Books 出版公司的主要目标是为 Web 设计师、软件工程师以及所有希望在\
    \ Web 开发领域获得提升的读者提供有效的教育。\n\n本版本的《Node.js – Server Setup》旨在加速为构建您自己的应用程序而设置基于\
    \ JavaScript 的 Node 服务器的学习过程。\n\n关于本书的任何问题和意见，您可以联系作者，或直接向下方列出的地址发送电子邮件给我们的办公室。\n\
    \n## 特别优惠与折扣\n\n学校、图书馆和教育机构可能享受特殊价格。请通过 hello@learningcurvebook.net 与我们的发行部门联系。\n\
    \n## Learning Curve Books™\n\nLearning Curve Books 是 Learning Curve Books, LLC\
