    This way we can avoid touching the hard drive completely (by caching frequently
    accessed data in an object.)


    Of course, the original data will still be stored on the hard drive. The difference
    is'
  - '[PAGE 93]


    # 6.14. BUILDING SCALABLE APPLICATIONS


    that when you launch your Node server, it will be copied into a JavaScript object.


    When client requests a certain resource we can simply serve it directly from that
    object. It will contain a copy of the MySQL database would contain. But your application
    will become significantly more efficient.


    You will write this object to the hard drive, so it can permanently store the
    most recent data, but not as frequently as you would with a 100% MySQL setup.


    Some databases such as MongoDB also implement similar RAM caching features. But
    they still may not be optimized for the primary purpose of your application which
    only you know. Thus missing the chance of taking advantage of the full potential
    of your server''s horsepower.


    And just like with anything else, you can either "install a package," or install
    and configure existing software, or you can learn to write your own code. Without
    the latter, you may never be able to develop the skill of building an extremely
    efficient system for serving millions of users.


    Unfortunately, this architecture will not be covered in 1st edition of this book
    due to time constraints I''ve had within which I had to finish this volume. However,
    I plan on second edition where I will go into greater detail on the subject. For
    now, the least I could do is to give you a pointer in the right direction.'
  - "[PAGE 94]\n\n# 6.15 Handle Server Clean Up\n\nThe server can exit for many reasons.\
    \ For example, it can time out based on default timeout value provided in server\
    \ settings.\n\nThere are a few cases in which your server might exit, either spontaneously\
    \ as a response to an exception, or when Ctrl + C combo is detected.\n\nYou might\
    \ want to do some code clean when that happens:\n\n```\n// Server process exit\n\
    process.on('exit', function () {\n    database.connection.end();\n    console.log('process.exit');\n\
    });\n\n// SIGINT happens when user hits Ctrl + C\nprocess.on('SIGINT', function\
    \ () {\n    console.log('Ctrl-C...');\n    database.connection.end();\n    process.exit(2);\n\
    });\n\n// Handle uncaught exception\nprocess.on('uncaughtException', function(e)\
    \ {\n    console.log(e.stack);\\n    database.connection.end();\n    process.exit(99);\n\
    });\n```\n\nLet's kill database connection every time server exits for any reason.\n\
    \n# 6.16 Master and Stage Servers\n\nAfter a production cycle or coding sprint\
    \ marathon the new code must be deployed to the main production server so that\
    \ your customers can take advantage of the new features. This is your main public\
    \ application server.\n\nYou should probably set up a secondary stage server where\
    \ you would deploy the same code. This is important for two reasons: 1) you can\
    \ show your application to"
  - '[PAGE 95]


    # 6.17. CONCLUSION


    your client, teammates, investors, friends or others who can test the new version
    of the application before the public release, and 2] you can make deployment process
    doesn''t break the main production server with new unexpected bugs.


    The stage server can be used to test integrity of the newly deployed code, without
    risking the chance of deploying erroneous code directly to master, losing customers
    and having a panic attack.


    Now you are thinking like a real production engine!


    Both master and stage are nothing more than two versions of your application running
    separately in two different locations. So I won''t talk about how to set up a
    stage server – the process is exactly the same. The difference is in where you
    push your code to.


    # 6.17 Conclusion


    At this point you should be ready to host your own secure SSL applications from
    https://www.appname.com if you indeed followed all instructions described in this
    book up to this point.


    In the next edition I will cover scaling your application and making it accessible
    by millions of simultaneous users. There is currently no set date as to when it
    will come out, but follow my work at @js_tut on Twitter for a future announcement.


    I hope that this Node API book was a faithful guide on your journey to becoming
    a software developer. Thanks for reading!'
