    \n话虽如此，在增加连接数之前，确保你的系统有足够的资源来处理它们。\n\n然而，这并不能阻止程序员使用下一节描述的连接池。连接池可能会提供相当的额外优化。只需记住，每个架构决策将取决于你的\
    \ API 服务器的实际用途。\n\n## 6.4 执行 MySQL 查询\n\n到目前为止，我们探索了通过位于我们主数据库类中的静态函数 `exec(command)`\
    \ 方法来执行 MySQL 查询的想法。\n\n但从架构上来说，这对我们的 API 并没有任何帮助。记住，在 Node 中，MySQL 查询会在回调函数中返回，该函数会在我们的主线程之外产生查询结果值。\n\
    \n如果你只想执行一两个查询，而不在乎向浏览器发送响应，那是没问题的。\n\n如果你想构建一个处理一系列唯一端点调用的 API，你可能需要认真考虑 promises。它们可以帮助你根据\
    \ MySQL 查询返回的数据对每个入站请求做出正确响应。\n\n### 6.4.1 Promises\n\nPromises 为标准的回调模式增加了一个额外的层。当\
    \ Promise 返回时，它返回的是一个 Promise 对象，而不是回调函数。这个 Promise 对象并不保证已经带有值，直到它在稍后的时间被解析（resolved），这正是它被称为\
    \ promise 的原因。你可以使用 Promise 对象上的内置 `.then` 方法来获取 MySQL 查询的结果。\n\nPromise 的 `.then`\
    \ 方法允许我们等待结果，并在结果在稍后的时间变得可用时立即解析。\n\n使用 `.then` 方法允许我们在不断将回调嵌套在回调中的时，避免嵌套回调模式（或至少减少其发生次数），因为这通常是因为一个\
    \ API 调用 取决于上一个调用返回的数据。\n\n### 基于 Promise 的 MySQL 查询\n\n那么在 Node 中，基于 promise\
    \ 的 MySQL 查询看起来像什么样？\n\n让我们在整个 API 端点往返的上下文中来看这个问题（这包括使用 API 端点请求资源并对其进行响应）。\n\
    \n### 6.4.2 往返模式\n\n在我们深入研究源代码之前，让我们先看看这一切是如何整合在一起的，从服务器监听器开始，最后从 MySQL 查询返回一个值。\n\
    \n![](img/aad9680d7dc58780e0f8fc70276d7011_62_0.png)\n\n### 6.4.3 MySQL Promise\
    \ 函数\n\n构建负责与端点相关的 MySQL 查询的函数的方法之一是将其封装在 promise 中，并使用 `resolve` 方法返回结果——仅 JSON\
    \ 格式的负载。这里是 `action.register_user` 函数的示例，但所有其他操作（登录、推文、评论等）遵循相同的模式：\n\n```\n//\
