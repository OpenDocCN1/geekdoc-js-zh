    // Generated SSL certificate files\noptions = {\nkey: fs.readFileSync(key),\n\
    cert: fs.readFileSync(cert)\n};\n// Create server using http module, and wait\
    \ for response:\nhttp.createServer(options, function (request, response) {\n \
    \ /* the rest of the code is the same */\n}).listen(port, ip);\n// Display server\
    \ is running message\nconsole.log('Running at ' + ip + ':' + port + '/');\n```\n\
    \nreplace **site.com** with your actual domain name.\n\nFor https connections\
    \ it is proper to use port **443**.\n\nYou might also need to open port **443**\
    \ on your system for this to start working. However, this is not a requirement\
    \ – any allowed port number will still work.\n\nUpdate the **index.js** file with\
    \ code above. Log into your web host. Navigate to the root directory of your application\
    \ and run **node index**. Believe it or not, if all goes well, at this point your\
    \ server will be accessible via https protocol, and the \"Not Secure\" message\
    \ in Chrome (and other browsers) will disappear.\n\n## Putting It All Together\n\
    \nNow that we are running an https server, we can finish building our API.\n\n\
    In previous chapters we worked out a pattern that can now be used to add more\
    \ end-points without modifying main server code.\n\nIn a real world environment,\
    \ you will probably be working with another library (such as React) or Angular\
    \ framework. And many software development companies choose Express as a Node\
    \ wrapper.\n\n### API Code\n\nTo keep our API organized it's best that each endpoint\
    \ follows a familiar pattern.\n\nPOST data is not available until request produces\
    \ \"end\" event. This is where we put the chunks together into actual JSON object\
    \ using the helper function.\n\nTo add support for more endpoints just follow\
    \ the same pattern. Place them inside the request.on('end') callback which ensures\
    \ POST data finished streaming.\n\n```\n// Finish reading data chunks\nrequest.on('end',\
    \ () => {\n  API.parts = request.parts;\n\n  if (identify(\"user\", \"register\"\
    )) // Register (create) user\n    action_register_user(request, json(request.chunks\
    \ ))\n    .then(content => respond(response, content));\n\n  if (identify(\"user\"\
    , \"login\")) // Log in\n    action_login(request, json(request.chunks ))\n  \
    \  .then(content => respond(response, content));\n\n  if (identify(\"user\", \"\
    logout\")) // Log out\n    action_logout(request, json(request.chunks ))\n   \
    \ .then(content => respond(response, content));\n\n  if (identify(\"user\", \"\
    delete\")) // Delete user\n    action_delete_user(request, json(request.chunks\
    \ ))\n    .then(content => respond(response, content));\n\n  if (identify(\"user\"\
    , \"get\")) // Get user data\n    action_get_user(request, json(request.chunks\
    \ ))\n    .then(content => respond(response, content));\n\n  if (identify(\"user\"\
    , \"update\")) // Update user\n    action_update_user(request, json(request.chunks\
    \ ))\n    .then(content => respond(response, content));\n\n  if (identify(\"session\"\
    , \"create\")) // Create session\n    action_create_session(request, json(request.chunks\
    \ ))\n    .then(content => respond(response, content));\n\n  if (identify(\"user\"\
    , \"authenticate\")) // Authenticate user\n    action_authenticate_user(request,\
    \ json(request.chunks ))\n    .then(content => respond(response, content));\n\
    });\n```\n"
