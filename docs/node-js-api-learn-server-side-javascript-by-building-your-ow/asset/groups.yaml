    \ of Learning Curve Books, LLC. unless otherwise stated.\n\n©2018 – 2020 Learning\
    \ Curve Books, LLC.\n\n## Node.js API\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_1_0.png)\n\
    \nLearn server-side JavaScript and build your own secure production Node server\
    \ from scratch.\n\n- Host custom application from localhost on your computer.\
    \ (local environment)\n- Host custom application on a static domain name with\
    \ HTTPS certificate. (production environment)\n- Build an API-endpoint server\
    \ - the lifeblood of custom applications.\n- Learn how to write all common API\
    \ endpoints, or download the complete source code from GitHub.\n- Authenticate\
    \ your API calls using an AuthToken generated on 2ND server.\n\nGitHub Project:\n\
    Fork or Download Complete Node API Source Code from this book: https://www.github.com/javascriptteacher/node\n\
    \n## 0.1 Node.js API – What Is This Book About?\n\nThis book is an introduction\
    \ to building your own Node server from scratch.\n\n### Express is a popular framework\
    \ that acts as a wrapper around native Node architecture, it will not be covered\
    \ by this book. There are already plenty of good tutorials and books that cover\
    \ the subject.\n\nNode API – as the title suggests – will focus on the bare bone\
    \ server architecture written directly on top of Node in vanilla JavaScript.\n\
    \nThis book is for those who enjoy the process of understanding how Node-based\
    \ web applications work from the ground up, without adding more layers of abstraction.\
    \ There are plenty of lessons to be learned here. Even for those who choose to\
    \ later move on to Express, MERN or MEAN stack architecture.\n\nWriting server-side\
    \ applications cannot be done with Node alone. At one point you will need to talk\
    \ to a database to store user data, emails and passwords, etc. For no particular\
    \ reason a decision was made to use MySQL module. If you are already familiar\
    \ with MongoDB, it shouldn't be difficult to rewrite API functions to support\
    \ it. What this book will focus on is overall API server architecture.\n\nEven\
    \ though many diverse subjects will be covered, I think it's safe to say that\
    \ ultimately this is a book for beginners. Someone who has a first-time encounter\
    \ with server-side programming in JavaScript.\n\nNode API is a book that can be\
    \ read as a tutorial walk-through: short chapters contain setup or code required\
    \ to move on to the next step. So it's important that the book is read from start\
    \ to finish in linear progression.\n\n## Node.js\n\n- 0.1 Node.js API – What Is\
