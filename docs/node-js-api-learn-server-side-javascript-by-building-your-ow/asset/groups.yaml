    \ 1}`；\n\n当你接收到请求对象时，你只能立即获取头部数据。POST 数据是单独提交的，你需要使用两个不同的事件：\"data\" 和 \"end\"\
    \ 来监听它，因为它是一个流 / 缓冲区。\n\n`request.data` 事件告诉你有正在进入的 POST 数据。但 Node 并不是直接发送整个数据对象，而是以分块（chunks）的形式流式传输。因此，你需要使用这些分块将它们组合起来。一种方法是创建一个数组，并在\
    \ \"data\" 事件的回调中将收到的每个分块推入该数组中。\n\n`request.end` 事件告诉你所有 POST 数据分块已下载完成。此时，你就可以获取\
    \ chunks 数组并将其转换为 JSON 对象。\n\n这是通过 Node 内置的 `Buffer.concat(chunks).toString()`\
    \ 方法完成的。需要使用 `.toString()` 方法将二进制分块数据转换为字符串格式。\n\n之后，你只需使用原生的 `JSON.parse` 函数将生成的字符串转换为\
    \ JavaScript 对象。我们稍后会查看它的源代码！\n\n如果 POST 数据很短，可能只会接收到一个分块。但你仍然需要作为流来拦截它。\n\n##\
    \ 6.8 流式 POST 数据\n\n让我们先将流式 POST 数据作为一个独立的示例来看一下：\n\n```javascript\nclass API\
    \ {\n  constructor() { }\n  static exec( request, response ) {\n    if (request.method\
    \ == 'POST') {\n      // 分块收集数组\n      request.chunks = [];\n\n      // 步骤 1.)\
    \ \"data\" 事件 - 开始读取 POST 分块\n      request.on('data', segment => {\n        //\
    \ 将此分块推入数组\n        request.chunks.push(segment);\n      });\n\n      // 步骤 2.)\
    \ \"end\" 事件 - POST 数据完全接收\n      request.on('end', () => {\n        request;\
    \ // 请求对象\n        response; // 对象\n        request.chunks; // 所有 POST 数据分块\n\
    \        json( request.chunks ); // 将分块转换为 JSON\n\n        // 步骤 3.) 识别 API 端点\n\
    \        // a) 执行端点动作函数\n        // b) 将结果返回给浏览器\n      });\n    }\n  }\n}\n```\n\
    \n从这里开始，我们可以完成整个往返模式的构建。\n\n（见下一页。）\n\n## 6.8 流式 POST 数据\n\n在了解了现在所做之后，让我们通过添加对一个端点的支持来升级我们的\
    \ API 类，以启用用户注册。该端点会触发我们之前编写的函数：`action_user_register`\n\n```javascript\nclass\
    \ API {\n  constructor() {\n    // 识别并执行 API 端点请求\n    static async exec(request,\
    \ response) () => {\n      console.log(\"API.exec(), parts = \", API.parts);\n\
    \      if (request.method == 'POST') {\n        request.url[0] == \"/\" ? request.url.substring(1,\
    \ request.url.length) : null;\n        request.parts = request.url.split(\"/\"\
    );\n        request.chunks = [];\n        // 开始读取 POST 数据分块\n        request.on('data',\
    \ segment => {\n          // 413 = \"请求实体过大\"\n          if (segment.length >\
    \ 16) {\n            let type = {'Content-Type': 'text/plain'};\n            response.writeHead(413,\
    \ type).end();\n          } else {\n            request.chunks.push(segment);\n\
    \          }\n        });\n        // POST 数据完全接收\n        request.on('end', ()\
    \ => {\n          API.parts = request.parts;\n          // 注册（创建用户 \"user\", \"\
    register\"）\n          json( request.chunks ); // 将分块转换为 JSON\n          // 将结果返回给浏览器\n\
    \          response.end();\n        });\n      }\n    }\n    static check(request)\
    \ {\n      // 简单的逻辑示例\n      if (request.parts[0] === \"api\") {\n        return\
    \ true;\n      }\n      return false;\n    }\n}\n```\n\n## 6.9 拦截 API 端点的模式\n\n\
    了解了我们现在做的一切，让我们通过添加对一个端点的支持来升级 API 类，启用用户注册。该端点会触发我们之前编写的函数：`action_user_register`\n\
    \n## 6.10 API 动作验证\n\n用户登录端点执行生成新的或检索现有令牌的特殊操作。\n\n许多其他端点（例如更新用户）要求在请求中携带一个身份验证令牌。这是合理的，因为如果没有令牌任何人都可以向我们的服务器调用\
    \ API。但我们只允许那些携带令牌的调用。\n\n## 6.11 通过 HTTPS 协议进行 SSL 连接\n\n现代应用程序并不要求通过安全连接托管。然而，有一个很好的理由你不应该在\
    \ HTTP 上运行生产级应用程序（我们目前为止的方法）。\n\n这意味着连接将通过被称为安全套接层或 SSL 技术进行加密。\n\nSSL 帮助你加密从计算机发送到服务器的数据。这为信用卡号、电子邮件和密码等数据提供了安全性。在\
    \ HTTP 协议下，数据是以原始形式发送的。（也许它被压缩了，但没有被加密算法加密。）\n\n这，因为除非你实现了 SSL，否则发送到服务器的数据是不安全的。而且\
    \ Chrome 和其他浏览器会在你的域名处显示“不安全”。\n\n到目前为止，我们一直使用 Node 的 http 模块。我们在 `index.js` 文件的第一行将变量\
    \ `http` 赋值为从 `require('http')` 模块导入的内容。\n\n```javascript\nlet http = require(\"\
    http\");\n```\n\n幸运的是，Node 已经有一个可用的模块来涵盖 https，切换非常简单。只需将 \"http\" 改为 \"https\"\
    ：\n\n```javascript\nlet http = require(\"https\");\n```\n\n想更改变量名也由你决定，但我们将保持不变，以免破坏我们目前为止编写的所有代码。\n\
    \n"
