    # 6.12.4 Create SSL Certificate


    Finally, we''re ready to create the SSL certificate that will ultimately enable
    us to serve files via https instead of http. Following previous steps type type
    this command to navigate to newly created letsencrypt directory:


    ```

    cd /opt/letsencrypt

    ```


    You will navigate to the folder where letsencrypt was just installed. (cd stands
    for Change Directory on Linux-based OS.)


    ![](img/aad9680d7dc58780e0f8fc70276d7011_80_0.png)


    Running the following command... sudo -H ./letsencrypt-auto certify-standalone
    -d A.com -d www.A.com (replace A.com with your domain name)


    ![](img/aad9680d7dc58780e0f8fc70276d7011_80_1.png)


    After this we use letsencrypt-auto command generating the needed certificate files
    with certbot and creating http challenges automatically! At this stage we might
    be asked several questions. I''m not going to include them here to save book space.
    Just enter your email address when asked and few other things. Choose (A)gree
    or (Y)es option every time asked.


    On the next page, let''s take a look at what actually happened once the certificate
    is generated:'
