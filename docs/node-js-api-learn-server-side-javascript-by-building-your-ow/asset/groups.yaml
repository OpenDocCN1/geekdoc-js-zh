    # NODE.JS


    ## What Is A Server?


    Just like a server at a restaurant serving a meal, a computer server is something
    that serves files over the network via a dedicated IP address.


    For many people server setup and configuration are some of the least exciting
    parts about being a software developer.


    To those who have propensity toward back-end development, it might be the holy
    grail of the application actually works.


    To front-end developers, it''s a black box that generates console errors.


    If you want to work for a start-up company as a back-end engineer, having deep
    knowledge of how servers work is required experience. But even if you are a frontend
    developer, knowing how to set up a server will expand your skill set and might
    increase chances of getting a Full Stack developer job.


    Today it is not uncommon for front-end developers to know how to work with servers.
    You''re only gaining if you learn how to set up your server.


    I also think that servers can be exciting for those with entrepreneurial mindset
    - it gives you the power to build your own custom applications. Nothing is more
    thrilling than having ability to launch the child of your imagination into the
    world.


    ## Node Server


    Setting up a Node server can be broken into three parts: 1] installation, 2] adding
    modules and other dependencies using a manifest file, and 3] writing the minimum
    required code in main index.js file to launch and run the server.


    We will offer you api.js module for registering users and authenticating HTTP
    requests - in order to read from and write to a database. This enables you to
    make virtually any application you can think of.


    This book contains examples you can simply copy and paste into Terminal on Mac
    or cmd.exe on Windows (or bash.exe on Windows 10), but you are encouraged to type
    them manually. It''s the only way to get better at the command line - the skill
    that makes you a more productive software developer.


    You might need to get a web host to deploy your server online but the process
    is the same on localhost as it is elsewhere. It''s just the hosted solution will
    additionally route your server''s localhost environment to your browser via IP
    address.


    # Chapter 1


    ## bash.exe


    Did you know that starting with Windows 10 you can work in Linux-like bash environment
    directly from your Windows computer?


    It can be enabled in Windows 10 Control Panel:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_9_0.png)


    Figure 1.1: Check Windows Subsystem for Linux (off by default.)


    There is now **bash.exe** that looks as follows when executed:


    ```

    MINGW64:/c/Users/Greg

    Greg@DESKTOP-A8J1LT3 MINw64 ~

    ls ''3D Objects''/\ansel/

    AppData/

    Desktop/

    Documents/

    Downloads/

    Favorites/

    IdeaProjects/

    ```


    Figure 1.2: Running Linux ls (list directory contents) command on Windows.


    You can run Linux-based commands on a Windows file system this way.


    In this book we will explore installing Node on Mac, Windows and Linux.


    It wouldn''t be fair to show console examples for one operating system only. The
    chapters will interchange between Windows **bash.exe** and **Terminal** on the
    Mac.


    Commands like **npm install package_name** (to install a node package with Node
    Package Manager) or **node index.js** (to run **index.js** on Node server) are
    the same on all operating systems.


    ### 1.0.1 What is bash.exe?


    **bash.exe** is based on **Project Astoria** that was developed to run Android
    programs on Windows.


    On Linux we have Wine to run Windows commands.


    But **bash.exe** is like Wine in reverse. It allows you to run Linux-based commands
    on Windows. Hence, **bash.exe** is not really the Linux kernel. It''s just a way
    to execute the same Linux binaries on Windows.


    ### 1.0.2 Ubuntu on Windows?


    But wait. Simply enabling bash.exe in Windows 10 settings isn''t enough. This
    way you only get basic commands like ls and ssh. And if logging in to your remote
    Linux host is all you need you skip this section.


    However, with current installation of bash.exe you won''t have sudo, apt, apt-get
    and many more. In order to get them, you have to get Ubuntu from Windows store.


    ![](img/aad9680d7dc58780e0f8fc70276d7011_11_0.png)


    Figure 1.3: Ubuntu for Windows.


    Ubuntu for Windows is free. Simply find it in Windows store and download it. Follow
    simple instructions to finish installation. Congrats! You can now use Ubuntu commands
    on your Windows 10 bash.exe. Can you use any Linux distribution such as Debian?
    Sure! Just look for it in Microsoft store. You can even set it up so that you
    can run multiple distribution on the same Windows computer.


    ## 1.1 Migrating From Apache to Node


    Many people are still working with PHP servers. There are good reasons for this,
    and there is absolutely nothing wrong with PHP.


    It’s just Node servers are more often used by applications that run libraries
    like React, which can speeds development of the UI components by a large %. I
    think Node is better even for solo developers building personal projects because
    you get JavaScript on front-end and back-end simultaneously.


    If you’re coming to Node from PHP you may be familiar with jQuery.ajax and fetch
    API to scripts written in PHP from your JavaScript front-end. This means that
    you just to perform a simple action, you had to know two languages!


    Having JavaScript on both front and back-end is magical – you will use the same
    language to write your server-side and front-end code!


    Although I personally still enjoy writing PHP code, in many cases Node can be
    faster than the Apache setup, but I won’t go into that.


    I do hope that you set up a Node server and build your first application will
    never want to go back.


    ## 1.2 Node Libraries and Frameworks


    It’s tempting to just install a library or a framework with one command in Terminal
    or cmd (on Windows) and watch your application magically appear in your browser
    at localhost or a dedicated IP address.


    But by doing this we are neither nor gaining experience with overall architecture
    of a server and the logic behind decisions we need to make in order to put all
    of the pieces together. If you choose that route, when errors creep up, you may
    not understand what hit you and spend hours in debugging


    In this book, we will walk through the process step by step, without the help
    of unnecessary modules, libraries of frameworks.


    If we can narrow down on key issues and avoid pitfalls, I think the process of
    setting up a server can be fun and exciting!


    ### 1.3 Running Node Server


    There is really one way of running a node server, regardless of whether you are
    doing it on localhost or on a hosted server with your static IP address.


    If you learn how to set it up on localhost, you will know how to set up elsewhere.
    The process is identical. You will only need to let your server know whether it''s
    running locally or in production environment. We''ll cover that later in this
    book.


    Some differences may exist depending on what platform and operating system you
    are using. In the next section of the book we will cover both Windows and OSX.


    # Chapter 2


    ## Installation


    There are 3 things you should worry about when installing a Node server:


    - Choosing to install Node **globally** on your Operating System or making it
    **local** to a project directory on your hard drive.

    - Configuring **package.json** manifest file – it is automatically created by
    Node installation, but it''s nice to know how it actually works, so we''ll break
    it down.

    - Understanding **node_modules** – the default directory where all Node modules
    are downloaded when you install them from command line.


    If you can understand these 3 key things about Node server, you''re making a huge
    step getting better at back-end development with JavaScript. We''ll take a look
    at each one as we move forward.


    ## Local vs Production Development Environment


    You can think of setting up Node as synonymous with setting up your development
    environment. Once you learn how to run the server on **localhost**, it can be
    deployed to a remote IP address and run on actual domain name for your application.
    Do not develop directly on production server. If you''ve never been employed as
    a software developer, you will probably want to avoid developing that habit. In
    work environment all software is developed locally first and committed to a decentralized
    version control system such as **GitHub**.

    '
