    ## 2.1 Mac


    You might want to start learning how to install programs from the command line.
    Mac & Linux may have different program installation managers. On OSX you generally
    use brew, yum or port (See macports.org) command. On Linux it''s either apt-get
    or more commonly just apt. You should probably use apt.


    The reason for some ways to install packages on Linux-based OS''s is due to many
    open-source distributions (Debian, Ubuntu, Fedora, Arch, CentOS...etc.) in each
    one unique flavor and version history.


    Technically, you can also use apt on Mac OSX, if it''s available. (It should be.)


    If you already have apt but you want brew — which some find to be better — on
    your OSX, run install linuxbrew-wrapper


    Now you can use brew to install packages such as nodejs, for example:


    Just run brew install nodejs to install Node in Terminal in OSX.


    To do the same on Linux use apt-get install nodejs in bash.


    Or simply apt install nodejs in bash. There are many differences between apt and
    apt-get, you can use either one. But apt is considered better.


    You can also try apt install nodejs in bash. And this is my preferred way.


    ### 2.1.1 apt install nodejs


    On Linux-based systems these commands install a package or program locally on
    your computer, which like running a GUI-based installer in Windows.


    All that happens is locating, downloading and copying program files to your hard
    drive.


    After installation of packages such as nodejs and mysql you usually have to configure
    and run them. We''ll go over the process in this book!


    ## 2.2 WINDOWS


    ## 2.2 Windows


    To get started on Windows, hold Window-key and press R.


    Type **cmd** and hit Enter in the box that appears.


    The command line window will open, and it looks similar to this:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_17_0.png)


    To see if node is already installed, type **node** and hit Enter:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_17_1.png)


    In this case I don''t have node installed, so let''s get started!


    ## 2.3 Installing Node on Windows


    Some older laptops or PCs might still be 32 bit. So, if you''re not sure, run
    the following command in the **cmd** window: **wmic os get osarchitecture**


    ## CHAPTER 2. INSTALLATION


    ```

    C:\WINDOWS\system32\cmd.exe

    C:\Users\Greg>wmic os get osarchitecture

    OSArchitecture

    64-bit

    C:\Users\Greg>

    ```


    Figure 2.1: Running: wmic os get osarchitecture


    Looks like my computer is 64-bit, just as I thought!

    To install Node on Windows, first head over to the official Node website:


    | LTS | | Current |

    | --- | --- | --- |

    | Recommended For Most Users | | Latest Features |

    | Windows Installer | macOS Installer | Source Code |

    | node-v10.15.3.msi | node-v10.15.3.png | node-v10.15.3.gz |

    | Windows Installer (.msi) | 32-bit | 64-bit |

    | Windows Binary (.zip) | 32-bit | 64-bit |


    Figure 2.2: URL: https://nodejs.org/en/download/


    Just choose Window Installer and 32-bit or 64-bit version. I chose 64-bit one,
    because my computer is 64-bit. Yours is too, most likely.


    ```

    node-v10.15.3-x64.msi

    16.3/16.3 MB

    ```


    Figure 2.3: Click on the downloaded file (I''m using Chrome browser here.)


    This will begin the Windows installation process. Just click Next everywhere.


    ## 2.4. CONFIGURING NODE SERVER GLOBALLY


    ![](img/aad9680d7dc58780e0f8fc70276d7011_19_0.png)


    Figure 2.4: I chose default path C:\Program Files\nodejs


    ## 2.4 Configuring Node Server Globally


    Sometimes you want to be able to call node command from any location on your hard
    drive. That''s because your root application folder can be located anywhere.


    So now that we installed Node with the Windows installer, we should be able to
    run node command from command line, right?


    ```

    C:\WINDOWS\system32\cmd.exe

    Microsoft Windows [Version 10.0.17134.706]

    (c) 2018 Microsoft Corporation. All rights reserved.


    C:\Users\Greg>node

    ''node'' is not recognized as an internal or external command,

    able program or batch file.

    C:\Users\Greg>>

    ```


    Wrong.


    We still can''t launch node globally.


    In order to run the node command, you have to be in the directory in which Node
    was installed, that''s where node.exe executable file is.


    Earlier we installed node into C:\Program Files\nodejs


    Navigate to that directory by typing: cd C:\Program Files\nodejs


    ![](img/aad9680d7dc58780e0f8fc70276d7011_20_0.png)


    Now that we''re there, execute node command:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_20_1.png)


    Your cursor will turn to right >


    This means node is running and awaiting your code! To see that Node works (almost)
    just like your JavaScript code in Chrome. That''s because Node runs on the same
    JavaScript engine (V8) in Chrome (with a few minor distinctions).


    ![](img/aad9680d7dc58780e0f8fc70276d7011_20_2.png)


    This means that we can launch node and execute JavaScript code. You can feed node
    an index.js file to execute, instead of typing the code in cmd. We''ll take a
    look at that in just moment.


    ## 2.5 ENABLE NODE TO RUN FROM DIRECTORY


    ## 2.5 Enable Node To Run Any Directory


    In previous section we ran some JavaScript code on instance node. But if you create
    new projects, they will likely be located in different folders and we have just
    seen node cannot run outside its installation folder by default.


    The solution is to include path to node.exe to your Environment Variables.


    ```

    C:\WINDOWS\system32\cmd.exe

    Microsoft Windows [Version 10.0.17134.706]

    (c) 2018 Microsoft Corporation. All rights reserved.

    C:\Users\Greg>rundll2 sysdm.cpl,EditVariables

    C:\Users\Greg>

    ```


    Figure 2.5: Running: rundll2 sysdm.cpl,EditVariables


    Running command rundll2 sysdm.cpl,EditVariables will open Windows variable editor:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_21_0.png)


    Figure 2.6: Upper half of Environment Variables window.


    ## CHAPTER 2. INSTALLATION


    In the upper box of Environment Variables window (where it says user variables
    for UserName) click on **Path** and click **Edit...**.


    In next window, click **New** and type **C:\Program Files\nodejs** on a new line:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_22_0.png)


    Figure 2.7: Upper half of Environment Variables window.


    Click **OK**, then click OK again on underlying window.


    That''s it! Now we can run node from anywhere on the hard drive:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_22_1.png)


    Figure 2.8: Now you can run node from anywhere.


    Type **node** then type `console.log("Node Anywhere.")` and watch output.


    The function `console.log` returns `undefined` because it is not an expression.
    If you want to learn more about JavaScript, check out JavaScript Grammar (www.javascriptgrammar.com)
    for a free copy.


    ## 2.6 Exit from Node


    After entering some JavaScript, we''re still stuck in Node.

    To exit, hold Ctrl and press C key two times in a row.


    ```

    Command Prompt

    C:\Users\Greg>node

    > console.log("Hello there.");

    Hello there.

    undefined

    >(To exit, press ^C again or type .exit)

    >

    C:\Users\Greg>

    ```


    ## 2.7 Congratulations!


    You have just installed Node on your computer.


    ## Chapter 3


    ## Running Applications


    So far we only installed a dormant node.exe on the hard drive.


    But how do we actually run our own application that serves index.html or any other
    file on the system when the browser makes a request to it?


    We''ll get to that in just a moment. But first, let''s set up our project directory.
    It can be located anywhere on your computer – choose wisely.


    ## 3.1 Project Home Directory


    This is my favorite part. We''re going to choose where our Node application is
    going to live on the hard drive.


    I know installed Node globally on the Operating System, but the project will usually
    be located in a local folder, like C:\app


    Let''s navigate to C:\ drive using cd C:\ command:


    ![](img/aad9680d7dc58780e0f8fc70276d7011_26_0.png)


    Then, use mkdir app to create new directory C:\app and enter it with cd app.


    ## 3.2 Running a file via Node


    Instead of typing all the code on the command line, we can pass a JavaScript file
    for node to execute.


    Create new file index.js as C:\app\index.js and type following in it:


    ```

    001 console.log(process); // Output native Node process object

    ```


    You don''t have to import or require any modules to use process object.


    It is available in the module scope of your application by default.

