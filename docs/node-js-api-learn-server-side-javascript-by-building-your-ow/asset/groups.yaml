    # Installation


    There are 3 things you should worry about when installing a Node server:


    +   1. Choosing to install Node **globally** on your Operating System or making
    it **local** to a project directory on your hard drive.


    +   2. Configuring **package.json** manifest file – it is automatically created
    by Node installation, but it''s nice to know how it actually works, so we''ll
    break it down.


    +   3. Understanding **node_modules** – the default directory where all Node modules
    are downloaded when you install them from command line.


    If you can understand these 3 key things about Node server, you''re making a huge
    step getting better at back-end development with JavaScript. We''ll take a look
    at each one as we move forward.


    # Local vs Production Development Environment


    You can think of setting up Node as synonymous with setting up your development
    environment. Once you learn how to run the server on **localhost**, it can be
    deployed to a remote IP address and run on actual domain name for your application.
    Do not develop directly on production server. If you''ve never been employed as
    a software developer, you will probably want to avoid developing that habit. In
    work environment all software is developed locally first and committed to a decentralized
    version control system such as **GitHub**. It goes without saying that your code
    should be able to work without bugs on localhost before it is pushed to the production
    server.'
