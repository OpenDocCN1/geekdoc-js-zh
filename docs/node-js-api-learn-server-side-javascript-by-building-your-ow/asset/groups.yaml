    \ of process object.\n\nThis Node process object contains all kinds of useful\
    \ configuration properties.\nFor example `process.versions.v8` tells you the V8\
    \ engine it's running on.\n\n## 3.4 ADDING PACKAGES TO INDEX.JS\n\nNode comes\
    \ with about 349 packages by default. They are also called modules. Modules are\
    \ stored in your node installation folder (C:\\Program Files\\nodejs in our case)\
    \ `node_modules`.\n\nYou might also find them in nodejs\\npm folder: C:\\Program\
    \ Files\\nodejs\\node_modules\\npm\\node_modules\\\n\nIn browser-side JavaScript\
    \ code, you can use `import / export` keywords. But in addition to that, you can\
    \ use `require` keyword to add useful modules to your app from the main NPM repository.\n\
    \nNode assumes `path` module exists in `node_modules` directory. If not, you can\
    \ install it with npm (node package manager) by running: `npm install path`\n\n\
    The package called `path` gives us the ability to work with URL paths in an easier\
    \ way. Once included `path.extname` method can parse extension part of a filename\
    \ from a string. This is a frequent need in server-side programming:\n\n```\n\
    001 let path = require('path');\n002\n003 let ext = path.extname('index.js');\n\
    004\n005 console.log(ext); // outputs '.js'\n```\n\nUpdate index.js file with\
    \ above code and run `node index.js` command:\n\n```\nc:\\app>node index.js\n\
    ```\n\n> Figure 3.3: Run: node index.js\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_29_0.png)\n\
    \n> Figure 3.4: Output: .js\n\n## 3.5 Next Steps\n\nWe've just experimented with\
    \ running JavaScript files with node, imported a package, and ran a method. You\
    \ can run any valid JavaScript file this way.\n\nBut there is still a problem.\
    \ After executing index.js the node process quits, and control is given back to\
    \ cmd. This won't help us run our application server. We need to build something\
    \ that runs continuously so we can serve a file every time someone will access\
    \ our server from their browser.\n\n## 3.6 RUNNING APPLICATION SERVER CONTINUOUSLY\n\
    \nTo continuously listen for connections we need to write server code in index.js.\
    \ Don't worry, the bare bones version is not as difficult as it may sound.\n\n\
    Adding `let http = require(\"http\")` to the very top of index.js is the first\
    \ step. When you assign a variable to a package name this way, we make the `http`\
    \ variable point to the default object defined in that package. Most packages\
    \ export a single object this, with all the properties and methods already attached\
    \ to it, so we can start using them, without worrying how they are implemented!\n\
    \nLikewise, the `http` object can be used to listen for requests.\n\nCalling `http.createServer`\
    \ makes our program enter listening state. How this actually works internally\
    \ is tied to how your Operating System implements socket connections. But by starting\
    \ we do not need to think about it.\n\n```\n001 let http = require('http');\n\
    002\n003 const ip = '127.0.0.1'; // localhost\n004 const port = 3000;\n005\n006\
    \ http.createServer(function(request, response) {\n007   console.log('request\
    \ ', request.url);\n008 }).listen(port, ip);\n009 console.log('Running at http://'\
    \ + ip + ':' + port + '/');\n```\n\n> Figure 3.5: The bare-bones Node server.\n\
    \nCopy code above into index.js and let's run it via `node index.js` command.\n\
    \n```\nC:\\app>node index.js\n```\n\nNote that we used 127.0.0.1 (it is the same\
    \ as localhost) with port 3000.\n\n## 3.7 Congratulations!\n\nThere is now a back-end\
    \ server running from your computer.\nKeep cmd window open and paste `http://127.0.0.1:3000`\
    \ into your browser.\n\n## 3.8 SERVING FILES CONTINUOUSLY\n\nTo actually serve\
    \ the file, we need additional code.\n\n```\n001 let http = require('http'); //\
    \ gives us http\n002 let fs = require('fs'); // gives us fs\n003 let path = require('path');\
    \ // gives us \"string\"\n004\n005 const ip = '127.0.0.1'; // or domain\n006 const\
    \ port = 3000; // or 80\n007\n008 // Create server using http module, and wait\
    \ for response:\n009 http.createServer(function(request, response) {\n010\n011\
    \ // Print request object, just for fun\n012 console.log('request', request);\n\
    013 // Add . to URL to convert it to local file path\n014 let file = '.' + request.url;\n\
    015 // Redirect / to serve index.html\n016 if (file == './index.html') {\n017\
    \ // Extract requested file's extension\n018 let extension = path.extname(file).toLowerCase();\n\
    019 // Define acceptable file extensions\n020 let mime = { '.html': 'text/html'\n\
    021 // If file type is not in mime, default\n022 // to octet-stream which means\
    \ \"arbitrary binary data.\"\n023 let type = mime[extension] || 'application/octet-stream';\n\
    024\n025\n026 // Read the file from the hard drive\n027 fs.readFile(file, function(error,\
    \ content) {\n028 if (error) {\n029 if (error.code == 'ENOENT') {\n030 fs.readFile('./404.html',\
    \ function(error, content) {\n031 response.writeHead(200, {'Content-Type': type});\n\
    032 }\n033 } else {\n034 response.writeHead(500);\n035 response.end('Error: '\
    \ + error.code + '\\n');\n036 response.end();\n037 }\n038 } else {\n039 response.writeHead(200,\
    \ {'Content-Type': type});\n040 response.end(content, 'utf-8');\n041 }\n042 });\n\
    043\n044 }).listen(port, ip);\n045\n046 // Display server is running message\n\
    047 console.log('Running at ' + ip + ':' + port + '/');\n```\n"
