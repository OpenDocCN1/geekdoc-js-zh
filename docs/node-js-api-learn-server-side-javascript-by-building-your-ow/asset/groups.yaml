  - '[PAGE 51]


    # 5.1. MySQL


    # Final Words


    Whenever you start a new project, if a hosted database is the only option, you
    will probably want to open your MySQL database for remote access. This way you
    can access it from your localhost environment without having to install MySQL
    server on your machine.


    However, this is usually considered bad security practice. At one point, you will
    want to limit your MySQL database access to localhost only. This means only your
    Node server can connect to the database directly.


    This still doesn''t prevent database attacks.


    Injection attacks use your API endpoints to pass actual MySQL query code into
    one of the values sent together with the POST or GET requests.


    By clever use of quote characters the query can be re-constructed to execute a
    different MySQL command which can be virtually anything.


    Keep this in mind when writing your endpoint code and generally thinking how to
    secure your database!


    # Writing MySQL Code


    Now that we have our mysql server running and waiting for incoming user connections,
    we need to write some code on our Node back-end (index.js) as a starting point
    for our MySQL-based API.


    In the next chapter of this book we will add new mysql code by starting a connection
    to the server and executing a query. From that point you can extend the API by
    implementing the CRUD pattern.


    # CRUD


    We already started api.js file earlier in this book, which – at this point – can
    only interpret certain URL patterns as API endpoints and cancel serving the file.


    But we are not still making any MySQL connections to the server. Nor are executing
    MySQL queries to actually Create, Read, Update and Delete rows – collectively
    known as the CRUD API.


    Once you implement the CRUD on your server, you will be ready to build out the
    rest of your application. Usually the CRUD gives you ability to code pretty much
    any feature on the front-end.'
- md: '

    ## 5.2 Table Specimen


    In order to execute queries on a MySQL database, we need to create a test table.
    For examples that follow we will assume that user table already exists.


    You can create it via command line, but it is recommended to get good UI-based
    database manager software such as Sequel Pro on Mac or MySQL Workbench on Windows.
    As your application-data tables begin to evolve editing them from command line
    might turn into Hell.


    ![](img/aad9680d7dc58780e0f8fc70276d7011_52_0.png)


    Because MySQL server is open for remote connection, it''s possible to log to it
    from Sequel Pro using the felix account created earlier. If you set up MySQL server
    on localhost use that as the Host. Otherwise use your web host''s database IP
    address (which very often is the IP address for your web hosting server. It makes
    sense, because technically MySQL is installed on “localhost” there.)


    ## 5.2. TABLE SPECIMEN


    Once logged into your favorite MySQL editor, create the user table that looks
    similar to the following design:


    | Field | Type | L... | U. | Z. | B. | Allow Null | Key | Default | Extra |

    |---|---|---|---|---|---|---|---|---|---|

    | id | INT | 11 | | | | | PRI | | auto_increment |

    | time | INT | 11 | | | | | | NULL | None |

    | verified | INT | 11 | | | | | | 0 | None |

    | timestamp | INT | 11 | | | | | | NULL | None |

    | email_address | CHAR | 128 | | | | | | NULL | None |

    | password | CHAR | 64 | | | | | | NULL | None |

    | token | TEXT | | | | | | | | None |

    | login_counter | INT | 11 | | | | | | 0 | None |

    | ip_address | CHAR | 255 | | | | | | NULL | None |

    | country | CHAR | 32 | | | | | | NULL | None |

    | state | CHAR | 32 | | | | | | NULL | None |

    | city | CHAR | 32 | | | | | | NULL | None |

    | zip | CHAR | 5 | | | | | | NULL | None |


    Perhaps your table can be completely different. But for users at least have a
    username and email_address columns!


    ### 5.2.1 Bird''s Eye View


    Before we move on to the next chapter, I want you to take a look at the bird''s
    eye view architecture we''ve got going so far.


    This is the mental model you will eventually arrive at after breaking down a simple
    Node server into compartments.


    ![](img/aad9680d7dc58780e0f8fc70276d7011_54_0.png)


    Our barebones server requires only http, path, fs and mysql modules.


    Note that the mysql object from MySQL package will return in a separate process
    in a callback function. So it''s a bit different from how you would expect MySQL
    to work on a PHP server.


    If we find a way to handle the result and write back to the requesting client
    from the callback, we can make API calls just as you would expect from Apache
    / PHP setup. Think of it as an extra step. This makes Node MySQL API architecture
    a bit more challenging, but also more flexible.


    ## Chapter 6


    ## Adding MySQL to api.js


    Now that we have our database running on localhost or at some remote location,
    we''re ready to integrate our MySQL code into our server, so that we can convert
    our API endpoint calls to MySQL queries.


    Go to our app.js file and add lines highlighted in green to the very top of the
    file (so that now we will have database and API classes together in the same file).


    If you think class database should be Database, go ahead and change it to your
    heart''s desires! The only reason it''s in lowercase is because we''re only using
    static methods here, and in my opinion database.create looks more elegant.


    ## CHAPTER 6. ADDING MYSQL TO API.JS


    ```javascript

    001 let mysql = require(''mysql'');

    002

    003 class database {

    004   constructor() {

    005   // Create MySQL connection

    006   static create() {

    007     let message = "Creating MySQL connection...";

    008     this.connection = mysql.createConnection({

    009       host : ''XX.XX.XX.XXX'',

    010       user : ''XXXXX'',

    011       password : ''XXXXX'',

    012       database : ''XXXXX''

    013   });

    014     this.connection.connect();

    015     console.log(message + "Ok.");

    016   }

    017   // Execute a MySQL query

    018   static exec(command) {

    019     let Q = ''SELECT email_address FROM user'';

    020     this.connection.query(Q, (error, results, fields) => {

    021       if (error) {

    022         throw error;

    023       let result = results[0];

    024       console.log("email = " + result.email_address);

    025     });

    026   }

    027 }

    028 class API {

    029   constructor() {

    030   static exec() {

    031     let Q = ''SELECT email_address FROM user'';

    032     this.connection.query(Q, (error, results, fields) => {

    033       if (error) {

    034         throw error;

    035       let result = results[0];

    036       console.log("email = " + result.email_address);

    037     });

    038   }

    039 }

    ```

    *(Note: The OCR text had significant corruption in the code block structure; I
    have cleaned up and reformatted it based on standard Node.js patterns and the
    visible fragments to make it functional/readable.)*

