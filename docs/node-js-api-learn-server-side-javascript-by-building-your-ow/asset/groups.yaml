- md: "\nThe request and response objects come all the way from initial call to http.createServer(function(request,\
    \ response)... in index.js. In other words, in Node they are created automatically\
    \ by createServer function.\n\n# 6.13 Complete Source Code\n\nTo see the complete\
    \ source code of the Node server we've built so far, you can fork it from the\
    \ public GitHub repository for this book:\n\n```\nhttps://github.com/javascriptteacher/node\n\
    ```\n\n**Note:** Before running this app on your localhost (**cmd > node index.js**)\
    \ make sure you have a running MySQL server with table in it and you included\
    \ MySQL credentials (IP, username, password and database name) in **api.js**\n\
    \n**Note:** This is not a complete application, but it has enough scaffold to\
    \ get you started fast. User API is essential to most web applications. The rest\
    \ of endpoints will depend on your app.\n\n**Note:** You should replace **md5**\
    \ with **sha3** if you need to ramp up security of your user passwords. Use **npm\
    \ install sha3** to install the SHA3 module which also includes **Keccak**.\n\n\
    After running **node index.js** you should see **index.html** **http://localhost:3000**\n\
    \n![](img/aad9680d7dc58780e0f8fc70276d7011_90_0.png)\n\nPress on the API endpoint\
    \ test buttons and watch console. Remember that each one of our endpoints returns\
    \ a JSON object. This object has a property \"success\",\n\n# 6.13. COMPLETE SOURCE\
    \ CODE\n\nwhich can be either true or false. The \"message\" property will contain\
    \ detailed information about what happened.\n\nFor example:\n\n```\n{success:\
    \ false, message: \"user with this ID does not exist.\"}\n{success: true, message:\
    \ \"user (felix) was successfully registered!\"}\n```\n\nBased on the success\
    \ value you can update the front-end.\n\nThese endpoints are ready for integration\
    \ into your own front-end UI/UX. You can call them via onclick attribute or elsewhere\
    \ from your JavaScript code.\n\n# How To Run The Server\n\nI recommend rewriting\
    \ examples in this book manually from scratch. However, for a quick demo, you\
    \ can copy the files from your GitHub repository and run your own Node server\
    \ in just under a few minutes!\n\n- Import GitHub files into your project or copy\
    \ them into one folder.\n- Navigate to that folder from command line.\n- Enter:\
    \ node.js and your index.html should be accessible via http://localhost:3000 in\
    \ your browser.\n\nFrom here, it's up to you you want to build the rest of the\
    \ front-end and which API end-points you wish to add. This depends solely on the\
    \ purpose of your application.\n\nFor example if your application requires image\
    \ uploads, you can create a new end point and make a function called action_image_upload.\n\
    \n```\n001 if (identify(\"image\", \"upload\")) // Upload image\n002 action_upload_image(request,\
    \ json(request.chunks))\n003 .then(content => respond(response, content));\n```\n\
    \nMulter is a good module that helps with file uploads from an HTML form. To get\
    \ it simply run npm install multer command in Terminal or cmd.exe/bash.exe.\n\n\
    # 6.14 Building Scalable Applications\n\nSo far we learned how to build an API\
    \ Node server that uses MySQL to perform storage and the classic CRUD data operations.\n\
    \nMySQL, MariaDB, MongoDB and other similar software might work well in the beginning\
    \ stages of your application, running on a single server.\n\nYou will be able\
    \ to host 1K - 10K users (or maybe even more) based on the amount of RAM available,\
    \ the IO rate of your SSD drive, and how well your server code is optimized. Fine\
    \ tuning your server and writing code optimized for performance can be magical\
    \ for increasing the number of users that can be served by a single instance of\
    \ your server.\n\nBut once your server’s maximum bandwidth is exhausted, it will\
    \ start coming to crawl if any more users join and start using your application.\n\
    \nIn the old days, Battle.net running Diablo I and StarCraft I used to work off\
    \ a **single server** with hundreds of thousands of users connected simultaneously.\
    \ This is an example of how limited resources encourage efficient code.\n\nIt’s\
    \ not uncommon for web applications of today to be real-time. Additional thought\
    \ and engineering must be applied if you want to build large-scale applications\
    \ that serve hundreds of thousands or even millions of simultaneous users.\n\n\
    # 6.14.1 Moving To RAM\n\nNo modern real-time application (Twitter, for example)\
    \ uses SQL databases to serve primary features to their users. The reason is quite\
    \ simple. When using SQL for everything it means there is a hard drive operation\
    \ every time someone makes a request! This can be an overkill, because you are\
    \ outsourcing the slowest part of your system to serve key features of your application.\n\
    \nOne solution is to switch to an SSD server (and to be honest, most of them already\
    \ are by today’s standards.) But what if we store all of our data in RAM instead?\
    \ This way we can avoid touching the hard drive completely (by caching frequently\
    \ accessed data in an object.)\n\nOf course, the original data will still be stored\
    \ on the hard drive. The difference is that when you launch your Node server,\
    \ it will be copied into a JavaScript object.\n\nWhen client requests a certain\
    \ resource we can simply serve it directly from that object. It will contain a\
