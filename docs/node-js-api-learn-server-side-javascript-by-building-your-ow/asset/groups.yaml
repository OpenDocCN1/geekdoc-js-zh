    \ action_register_user ( request, payload ) {\n  return new Promise((resolve,\
    \ reject) => {\n    if (!request || !request.headers || !payload)\n      reject('Error:\
    \ missing request or payload');\n    let q = `SELECT email FROM user`;\n    q\
    \ += ` WHERE email = '${payload.email}' LIMIT 1`;\n    // 检查数据库中是否已存在\n    database.connection.query(q,\
    \ (error, results) => {\n      if (error)\n        throw(error);\n      let result\
    \ = results[0];\n      if (results &&\n          results.length == 0 &&\n    \
    \      result.email == payload.email)\n        resolve({\"success\": false});\n\
    \      else {\n        // 使用 sha3 算法加密密码\n        let password_sha3 = sha3(payload.password);\n\
    \        let fields = `('email', 'password_sha3')`;\n        let values = `VALUES('${payload.email}',\
    \ '${password_sha3}')`;\n        let q = \"INSERT INTO user \" + fields + \" \"\
    \ + values,\n        database.connection.query((error, results) =>{\n        \
    \  if (error)\n            throw(error);\n          resolve({\"success\": true});\n\
    \        });\n      }\n    });).catch((error) => { console.log(error) });\n```\n\
    \n## 6.5 端点 API 架构\n\n下面是一个显示功能性 Node API 服务器最小结构的图。它与你刚才看到的图相同，只是是在执行用户登录操作的特定\
    \ API 调用用上下文中。\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_64_0.png)\n\n登录应该被视为一种特殊的\
    \ API 操作。它是唯一执行初始验证步骤的端点。\n\n## 6.6 辅助函数\n\n在这里，你将获取用户的密码，使用 SHA3 等算法对其进行加密，并与已经存储在数据库\
    \ `password.sha3` 字段下的 SHA3 加密格式的 SHA3 密码进行比较。\n\n登录的主要目的是获取 AuthToken。这将成为你执行其他身份验证操作的关键——关注、推文、转发、点赞、评论、更新用户设置等。\n\
    \n为了避免重复代码，我编写了这些函数来完成你在编写 Node API 服务器时经常遇到的各种操作。在各个地方使用这些函数有助于减少杂乱并保持代码整洁。\n\
    \n`identify(target, action)`\n\n`target` 参数是数据库表名（如 user、tweet 等）。`Action` 参数是你想要针对的目标的“什么”（get、update、delete\
    \ 等）。\n\n```\n001 // 检查 API.parts 是否匹配 URL 模式\n002 // 示例: \"api/user/get\"\n003\
    \ function identify(target, action) {\n004     return API.parts[0] == \"api\"\
    \ &&\n005     API.parts[1] == target &&\n006     API.parts[2] == action;\n007\
