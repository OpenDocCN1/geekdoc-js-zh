    # 6.1 Asynchronous Back-End Problem


    If you are coming to Node from Apache PHP server, it is inevitable that you will
    experience a paradigm shift, when trying to write your own mysql queries.


    In PHP, to execute a mysql query, all you had to do was write a script such as
    get_user.php or aQuery.ajax on the back-end.


    Then you would use fetch API and a jQuery.ajax to call that file. The result would
    be generated as part of the page content and returned inside the callback. This
    way could safely update the front end UI. We used to call this asynchronous HTTP
    requests, or "ajax" calls. It works naturally for updating the front end!


    A callback doesn''t run in the same process with the function serving the browser.
    So the file will be served before the mysql query returns! And this is the fundamental
    problem we need to solve in order to build a decent API server.


    Executing a MySQL query works exactly the same on Node. The result is returned
    via a callback function in a separate process. And that''s part of the problem,
    because we''re not on front-end anymore.


    A callback will often depend on completion of another MySQL query. So we will
    also need to execute a chain of multiple queries. And this can introduce a whole
    set of problems.


    **Solution.** If we can somehow forge the process of serving the file with the
    result we get from mysql query, we''re taking first step toward solving this problem.


    One way of solving this problem is to use promises.'
  - '[PAGE 58]


    # 6.2 Nesting Queries


    First, let''s take a look at what problem we''re trying to solve with nested queries.


    # Associative Tables


    Let''s say you want to store followers of all existing users. You can''t store
    users and followers in the same table because they are two completely different
    types of data sets.


    However, you can store followers in a separate table and "associate" it with users
    by adding userID column to it.


    This when you want to access an entry in followers table you can use the userID
    column to look up which user it belongs to.


    # Nesting Queries


    For the reason stated above, you will often need to write chains of nested queries.
    To get followers from a user account, first you will retrieve a user from users
    table. Then you will retrieve followers associated with that user''s primary ID.
    Because followers table has a link to the user via the user.id column, you should
    be able to gather a list of followers separately for that individual user.


    # 6.3 Handling Many Connections


    Default server configurations start with some arbitrary connection limits. For
    latest versions of MySQL this limit is 151 maximum connections.


    If your app connects many users at the same time, this limit will be reached and
    your program will cause the famous "too many connections" error.


    ```

    Error: ER_CON_COUNT_ERROR: Too many connections

    ```


    Figure 6.1: ER_CON_COUNT_ERROR'
  - '[PAGE 59]


    # 6.3. HANDLING MANY CONNECTIONS


    This is just a MySQL error caused by configuration limits. It doesn’t actually
    mean your server can''t handle that. In general, these limits are set by default
    every time you initiate a connection, a new thread is created.


    Creating a new thread process to serve user 1 inefficiently use up your server’s
    memory resources. Of course, once we no longer need it, this thread is eventually
    terminated by our code. But with thousands of users connecting every second you
    are creating anywhere from hundreds to thousands of threads at the same time hogging
    the CPU and possibly the hard drive.


    When developing your server you might run into configuration limits on your MySQL
    database.


    To find out the maximum number of allowed connections, enter the **mysql** prompt
    (by typing **mysql** either on mac or PC – it’s the same command) and enter the
    mysql command: **show variables like "max_connections";


    ![](img/aad9680d7dc58780e0f8fc70276d7011_59_0.png)


    Figure 6.2: **show variables like "max_connections";


    Don’t forget the **semicolon** at the end of each mysql command or it will not
    run. I’m running **set global max_connections = 300;** to double connection limit:'
