    # 3.6 Running Application Server Continuously


    To continuously listen for connections we need to write server code in index.js.
    Don''t worry, the bare bones version is not as difficult as it may sound.


    Adding let http = require("http") to the very top of index.js is the first step.
    When you assign a variable to a package name this way, we make http variable point
    to the default object defined in that package. Most packages export a single object
    this, with all the properties and methods already attached to it, so we can start
    using them, without worrying how they are implemented!


    Likewise, the http object can be used to listening for requests.


    Calling http.createServer makes our program enter listening state. How this actually
    works internally is tied to how your Operating System implements socket connections.
    But by started quick we do not need to think about.


    ```

    001 let http = require(''http'');

    002

    003 const ip = ''127.0.0.1''; // localhost

    004 const port = 3000;

    005

    006 http.createServer(function(request, response) {

    007   console.log(''request '', request.url);

    008 }).listen(port, ip);

    009 console.log(''Running at http://'' + ip + '':'' + port + ''/'');

    ```


    > Figure 3.5: The bare-bones Node server.


    Copy code above into index.js and let''s run it via node index.js command.


    ```

    C:\app>node index.js

    ```


    Note that we used 127.0.0.1 (lt is the same as localhost) with port 3000.'
