    \ LLC 版所有。\n\n©2018 – 2020 Learning Curve Books, LLC.\n\n## Node.js API\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_1_0.png)\n\
    \n学习服务器端 JavaScript 并从零开始构建自己的安全生产级 Node 服务器。\n\n- 从您电脑上的 localhost 托管自定义应用程序。（本地环境）\n\
    - 在带有 HTTPS 证书的静态域名上托管自定义应用程序。（生产环境）\n- 构建 API 端点服务器 - 自定义应用程序的命。\n- 学习如何编写所有常见的\
    \ API 端点，或从 GitHub 下载完整的源代码。\n- 使用在第二台服务器上生成的 AuthToken 对您的 API 调用进行身份验证。\n\n\
    GitHub 项目：\n从此书中分支或下载完整的 Node API 源代码：https://www.github.com/javascriptteacher/node\n\
    \n## 0.1 Node.js API – 这本书是关于什么的？\n\n这本书介绍了如何从零开始构建您自己的 Node 服务器。\n\n### Express\
    \ 是一个流行的框架，作为原生 Node 架构的封装，本书将不会涵盖它。已经有很多优秀的教程和书籍涵盖了该主题。\n\nNode API – 如标题所示 –\
    \ 将重点关注直接使用原生 JavaScript 编写在 Node 之上的裸骨架服务器架构。\n\n这本书适合那些喜欢从底层开始理解基于 Node 的 Web\
    \ 应用程序如何运作，且不希望添加更多抽象层的人。这里有许多可以学习的课程。即使对于那些以后选择转向 Express、MERN 或 MEAN 栈架构的人也是如此。\n\
    \n编写服务器端应用程序无法通过 Node 完成。在某一点，您将需要与数据库通信以存储用户数据、电子邮件和密码等。由于没有特殊原因，我们决定使用 MySQL\
    \ 模块。如果您已经熟悉 MongoDB，重写 API 函数以支持它应该并不困难。本书将重点关注整体 API 节点架构。\n\n尽管将涵盖许多不同的主题，但我认为可以说，这归结底是一本写给初学者的书。适合第一次接触\
    \ JavaScript 服务器端编程的人。\n\nNode API 是一本可以作为教程指南来阅读的书：简短章节包含了进入下一步所需的设置或代码。因此，按照线性顺序从头到尾阅读这本书至关重要。\n\
