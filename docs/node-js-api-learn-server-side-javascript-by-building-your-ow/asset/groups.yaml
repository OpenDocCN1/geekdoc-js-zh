    # Chapter 5


    # Setting Up MySQL Server


    # 5.1 MySQL


    You can run a MySQL server directly from your computer on localhost – the home
    address of your computer as part of your local development environment. Or you
    can run it on a remote server (a paid web host, for example.)


    # 5.1.1 Install MySQL Server Locally on Windows


    Remember, you have to install MySQL – the actual program to run on your computer.
    But you also have to install the accompanying mysql NPM module so your Node server
    can include it using require keyword.


    If you want to install MySQL on your computer as part of your local development
    environment, one of the fastest ways to do that is to download it from https://dev.mysql.com/downloads/installer/


    Or you can install MySQL together with the Amppps server. You can download it
    from https://www.ampps.com/ Just download it, go through the installer and in
    under a few minutes you will have MySQL running.


    I won’t go into great detail on pressing Next button on installation screen here.
    The process is pretty straightforward.'
  - '[PAGE 42]


    # 5.1.2 Install MySQL Server on Ubuntu


    The apt-get (or simply apt) command is perhaps the most popular, because apt also
    identifies dependencies, downloads and installs them, whereas dpkg does not.


    This section will walk you through the standard MySQL server configuration on
    an Ubuntu server, for no particular reason. It''s just a personal favorite.


    In the following images, I already used my Mac Terminal to log into my hosted
    web server in the cloud. But if you are running Ubuntu on your computer, the steps
    are exactly the same, except you don''t have to log in to your web host.


    To log in your web host open Terminal on your Mac and execute the command ssh
    root@XX.XX.XX and replace the X''s with your actual remote server address. Enter
    password, and you''re in!


    Once, you can start executing the following commands.


    Make sure all packages we will install up to date:


    ```

    root@localhost:sudo apt-get update

    ```


    Figure 5.1: sudo apt-get update


    This will have your Linux system updated with fresh URLs to latest packages. So
    when you install mysql in the next step most recent update will be used.


    Install the MySQL server on your system:


    ```

    root@localhost:sudo apt-get install mysql-server

    ```


    Figure 5.2: sudo apt-get install mysql-server'
