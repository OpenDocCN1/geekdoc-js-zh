    \ if you used the first method in this section without acme challenge, you should\
    \ be good to go.\n\n### 6.12.6 Adding PEM Files To Run HTTPS Server\n\nNavigate\
    \ to /etc/letsencrypt/live/site.com/ directory to verify the pem files were actually\
    \ generated by steps taken in previous section.\n\nNow that we have privkey.pem\
    \ and cert.pem generated we need to pass them to our Node server configuration\
