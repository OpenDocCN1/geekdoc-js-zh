    \nType Y and press Enter to agree and proceed.\n\n## CHAPTER 6. ADDING MYSQL TO\
    \ API.JS\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_84_0.png)\n\nTo verify our\
    \ domain name, we need to manually create the file named afBX9EvXvQqquzFooe02-22EFJ5TzcniFwCvqlaMXCA\
    \ – just the part before the dot (.) highlighted in yellow in screenshot.\n\n\
