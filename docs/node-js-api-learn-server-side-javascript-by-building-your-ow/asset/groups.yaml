    \ in some cases ACME challenges allow you to verify that you are the owner of\
    \ domain name.\n\nI repeat, skip it! I just provided it for reference.\n\nRun\
    \ certbot certonly --manual or certbot awfully --manual (note this is actually\
    \ double dash as shown below, not one dash.)\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_83_0.png)\n\
    \nIf you're hosting multiple domains, you can use the same certificate, so just\
