    \ API 端点调用。如果匹配，返回值为 true。\n\n`respond(response, content)`\n\n`response` 参数是来自服务器的响应对象，`content`\
    \ 是代表 JSON 格式对象的字符串（发送回浏览器），它通常由 MySQL 函数内部 promise 的 `resolve` 方法形成。\n\n```\n\
    // 通用 respond 函数 --\n// 向浏览器发送 JSON 对象\n// 以响应 API 请求\nfunction respond( response,\
    \ content ) {\n    console.log(\"responding =\", [ content ]\n    const jsontype\
    \ = \"{'Content-Type':'application/json'}\";\n    response.writeHead(200, jsontype);\n\
    \    response.end(content, 'utf-8');\n}\n```\n\n### json(chunks)\n\n在 Node 中，POST\
    \ 数据是流式的而不是作为单个对象接收的。因此我们需要这个 json 函数来将所有接收到的块转换为实际 JSON 对象。\n\n```\n// 将 buffer\
    \ 转换为 JSON 对象\nfunction json( chunks ) {\n    return JSON.parse(Buffer.concat(\
    \ chunks ).toString());\n}\n```\n\n图 6.6: 从流式 POST 数据块形成 JSON 对象。\n\n我刻意保持我的函数名称简短并使用通用名称。这样，当将所有内容整合在一起时，代码会变得非常整洁、易读且易于维护。\n\
