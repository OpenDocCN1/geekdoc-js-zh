- md: "\n## 6.7 SENDING POST DATA TO API ENDPOINT\n\nUsually an API endpoint expects\
    \ additional data sent together with the request.\n\nFor example, if we want to\
    \ get user data for user with user id of 1, we need to include that user id in\
    \ the POST request as additional data specified in JSON format, for example: {\"\
    user_id\": 1};\n\nWhen you receive the request object, you only get the header\
    \ data instantly. The POST data is submitted separately and you need to listen\
    \ for it using two different events: \"data\" and \"end\" because it's a stream\
    \ / buffer.\n\nThe request.data event tells you that there is POST data incoming.\
    \ But instead of sending entire data object, Node streams it in chunks. So you\
    \ need to put it together using chunks. One way of doing that is to create an\
    \ array and keep pushing each chunk received in the \"data\" event's callback\
    \ onto that array.\n\nThe request.end event tells you that all chunks of the POST\
    \ data have been finished downloading. At this point you would take the chunks\
    \ array and convert it to a JSON object.\n\nThis is done using Node's built-in\
    \ `Buffer.concat(chunks).toString()` method. The `.toString()` method is required\
    \ to convert binary chunk data to string format.\n\nAfter this you simply convert\
    \ the resulting string to a JavaScript object using the native `JSON.parse` function.\
    \ We'll see the source code for that in just a moment!\n\nIf the POST data is\
    \ short, it is possible to receive only one chunk. But you still need to intercept\
    \ it as a stream.\n\n## 6.8 Streaming POST Data\n\nLet's look at streaming POST\
    \ data as an isolated example first:\n\n```javascript\nclass API {\n  constructor()\
    \ { }\n  static exec( request, response ) {\n    if (request.method == 'POST')\
    \ {\n      // Chunk collector array\n      request.chunks = [];\n\n      // Step\
    \ 1.) \"data\" event - start reading POST chunks\n      request.on('data', segment\
    \ => {\n        // Push this chunk onto array\n        request.chunks.push(segment);\n\
