    \ about sending a response to the browser.\n\nBut if you want to build an API\
    \ that deals with a series of unique endpoint calls, you might seriously consider\
    \ using promises. They can help you to properly respond to each incoming request\
    \ with data returned from a MySQL query.\n\n### 6.4. Promises\n\nPromises add\
    \ one extra layer to the standard callback pattern. When the Promise returns,\
    \ it returns a Promise object, instead of the callback function. This Promise\
    \ object is not guaranteed to carry a value yet, until it is resolved at a later\
    \ time, which is exactly why it's called a promise. You can use the built-in .then\
    \ method on the Promise object to retrieve the results from the MySQL query.\n\
    \nThe Promise's .then method allows us to wait for the result and resolve as soon\
    \ as it becomes available if it happens at a later time.\n\nUsing .then method\
    \ allows us to avoid the nested callback pattern (or at least reduce its occurrence)\
    \ when we keep nesting callback within a callback, because one API call depends\
    \ on the data returned from the previous one.\n\n### Promise-based MySQL query\n\
    \nSo what does a promise-based MySQL query call look like in Node?\n\nLet's take\
    \ a look at that in the context of entire API endpoint round trip (Which includes\
    \ requesting a resource using an API endpoint and responding to it.)\n\n### 6.4.2\
    \ The Round-trip Pattern\n\nBefore we dive into source code, let's look at how\
    \ it all fits together, starting from server listener and finally returning a\
    \ value from MySQL query.\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_62_0.png)\n\
    \n### 6.4.3 MySQL Promise Function\n\nOne of the ways to build the function responsible\
    \ for executing the MySQL query related to an endpoint is by wrapping it in a\
    \ promise and returning the result using resolve method - just payload in JSON\
    \ format. Here is an example of just the action.register_user function, but all\
    \ other actions (login, tweet, comment, etc.) follow the pattern:\n\n```\n// Requires\
    \ payload.email = <email_address>\npayload.password = <password>\nfunction action_register_user\
    \ ( request, payload ) {\n  return new Promise((resolve, reject) => {\n    if\
    \ (!request || !request.headers || !payload)\n      reject('Error: missing request\
    \ or payload');\n    let q = `SELECT email FROM user`;\n    q += ` WHERE email\
    \ = '${payload.email}' LIMIT 1`;\n    // Check if already exists in database\n\
    \    database.connection.query(q, (error, results) => {\n      if (error)\n  \
    \      throw(error);\n      let result = results[0];\n      if (results &&\n \
    \         results.length == 0 &&\n          result.email == payload.email)\n \
    \       resolve({\"success\": false});\n      else {\n        // Encrypt password\
    \ with sha3 algorithm\n        let password_sha3 = sha3(payload.password);\n \
    \       let fields = `('email', 'password_sha3')`;\n        let values = `VALUES('${payload.email}',\
    \ '${password_sha3}')`;\n        let q = \"INSERT INTO user \" + fields + \" \"\
    \ + values,\n        database.connection.query((error, results) =>{\n        \
    \  if (error)\n            throw(error);\n          resolve({\"success\": true});\n\
    \        });\n      }\n    });).catch((error) => { console.log(error) });\n```\n\
    \n## 6.5 Endpoint API Architecture\n\nBelow is a diagram displaying the minimum\
    \ structure of a functioning Node API server. It's the same diagram as you've\
    \ just seen above, except in the context of a concrete API call to execute user\
    \ login action.\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_64_0.png)\n\nLogging\
    \ in should be treated as a special API action. It's the only endpoint that performs\
    \ the initial authentication step.\n\n## 6.6 Helper Functions\n\nThis is where\
    \ you will take user's password, encrypt it with an algorithm such as SHA3, and\
    \ compare it with the SHA3 password already stored in the database under password.sha3\
    \ in SHA3-encrypted format.\n\nThe primary purpose of logging in is to obtain\
    \ an AuthToken. This becomes your key to perform other authenticated actions –\
    \ follow, tweet, retweet, like, comment, update user settings, etc.\n\nTo avoid\
    \ rewriting code, I wrote these functions that accomplish various actions you'll\
    \ commonly come across writing your Node API server. Using them in various places\
    \ will help reduce clutter and keep your code clean.\n\n`identify(target, action)`\n\
    \ntarget argument is database table name (such as user, tweet, etc.) The Action\
    \ argument is the \"what\" you want to target (get, update, delete, etc.)\n\n\
    ```\n001 // Check if API.parts match a URL pattern\n002 // example: \"api/user/get\"\
    \n003 function identify(target, action) {\n004     return API.parts[0] == \"api\"\
    \ &&\n005     API.parts[1] == target &&\n006     API.parts[2] == action;\n007\
    \ }\n```\n\n> Figure 6.5: Identify an API endpoint request from API.parts. The\
    \ API.parts array is available globally. It represents the API endpoint call broken\
    \ down into 3 parts. If there is a match, the return value is true.\n\n`respond(response,\
    \ content)`\n\nThe response argument is the response object from the server and\
    \ content is a string representing an object in JSON format (to send back to the\
    \ browser) which is usually formed by resolve method inside a promise from MySQL\
    \ function.\n\n```\n// General use respond function --\n// Send JSON object back\
    \ to the browser\n// in response to an API request\nfunction respond( response,\
    \ content ) {\n    console.log(\"responding =\", [ content ]\n    const jsontype\
    \ = \"{'Content-Type':'application/json'}\";\n    response.writeHead(200, jsontype);\n\
    \    response.end(content, 'utf-8');\n}\n```\n\n### json(chunks)\n\nIn Node POST\
    \ data is streamed instead of received as a single object. So we need this json\
    \ function that will convert all received chunks into actual JSON object.\n\n\
    ```\n// Convert buffer to JSON object\nfunction json( chunks ) {\n    return JSON.parse(Buffer.concat(\
    \ chunks ).toString());\n}\n```\n\nFigure 6.6: Form a JSON object from the streamed\
    \ POST data chunks.\n\nI intentionally keep my function names short and use common\
    \ names. This way when putting it all together the code turns out to be so much\
    \ cleaner, readable and easy to maintain down the road.\n"
