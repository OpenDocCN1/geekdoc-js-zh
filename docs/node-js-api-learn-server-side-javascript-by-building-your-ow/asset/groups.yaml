  mdcn: "\n## 5.1. MySQL\n\n安装将开始，文件将开始下载到你的硬盘。\n此时，你将看到屏幕上流过大量的命令。\n如果被问任何问题，请输入\
    \ Y / yes 并按回车。\n\n### 允许 mysql程序的入站和出站流量：\n\n假设 mysql 安装成功，你现在可以使用 ufw 实用程序（代表\
    \ Uncomplicated Firewall，即不复杂的防火墙）。\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_43_0.png)\n\
    \n注意，我们的命令以 `sudo` 开头，这仅仅是使用另一个用户的安全权限运行任何程序（在此例中为 ufw）。\nsudo 原意是 superuser（超级用户），因为在旧版本的\
    \ Linux 版本中，它被设计为仅以超级用户（通常是 root）运行。现在，可以使用它使用系统上的任何用户名/密码对来执行命令。由于上述原因，sudo 缩写的含义被优雅地重新定义，用\
    \ user 代替了 super。\n\n不复杂的防火墙\n你可以使用 `ufw allow` 和 `ufw disallow` 命令来允许程序的入站和出站流量。在没有任何附加选项的情况下，假设你正在赋予该程序完全访问权限。ufw\
    \ 命令还有许多其他选项，你甚至可以允许特定端口的连接。如果你需要完整的文档，请在网上查询。\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_43_1.png)\n\
    \n如果你现在只输入 `mysql` 命令，你将进入 mysql 提示符。\n但是……重要的是改用 `mysql -u root -p`。\n这将让你以 root\
    \ 用户身份登录，从而赋予你特殊权限。\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_44_0.png)\n\n\
    图 5.5: mysql -u root -p\n\n系统会提示你输入 MySQL root 用户密码。输入它！\n然后你将看到 `mysql >`：\n\n\
    ![](img/aad9680d7dc58780e0f8fc70276d7011_44_1.png)\n\n图 5.6: mysql -u root -p\n\
    \n欢迎来到 mysql 提示符。这意味着你的 MySQL 服务器正在运行，并已准备好接收 MySQL 命令。你可以通过代码执行的所有标准 MySQL 命令在此提示符中也同样有效。\n\
    \n## 5.1. MYSQL\n\n### 5.1.3 显示现有数据库\n\n当 mysql 安装时，它会自动创建 `information_schema`\
    \ —— 这是添加到你的 MySQL 服务器的第一个数据库。它包含了关于你数据库的额外信息。你可以查询它，但不能更改它的任何内容。\n\n你可以输入 `SHOW\
    \ DATABASES;` 来查看当前 MySQL 服务器上存在的所有数据库。在我的机器上，我已经创建了 `lavacide` 和 `myserver`：\n\
    \n![](img/aad9680d7dc58780e0f8fc70276d7011_45_0.png)\n\n图 5.7: SHOW DATABASES;\n\
    \n### 5.1.4 创建新数据库\n\n要创建你自己的数据库，运行 `CREATE DATABASE database_name;`\n（不要忘记用 `;`\
    \ 结束你的语句，否则 mysql 提示符将跳转到下一行而不执行命令。）\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_46_0.png)\n\
    \n图 5.8: CREATE DATABASE myserver;\n\n你也可以通过运行 `Select User FROM mysql.user` 来检查当前用户。\n\
    \n![](img/aad9680d7dc58780e0f8fc70276d7011_46_1.png)\n\n图 5.9: SELECT user FROM\
    \ mysql.user.\n\n注意，mysql 命令关键字和表名是不区分大小写的。你可以输入 `Select User` 或 `SELECT user`，效果是一样的！\n\
    \n## 5.1. MySQL\n\n### 5.1.5 创建新的 MySQL 用户\n\n除了 root 用户外，我们还可以通过以下命令创建其他用户：\n\
    \n```bash\nSites -- root@localhost /\nmysql> CREATE USER 'felix'@'localhost' IDENTIFIED\
    \ BY 'Password557231!';\nQuery OK, 0 rows affected (0.00 sec)\n\nmysql> \n```\n\
    \nCREATE USER 'felix'@'localhost' IDENTIFIED BY 'Password55723!';\n\n现在我们还需要使用\
    \ `GRANT` 命令赋予此用户访问权限：\n\n```bash\nSites -- root@localhost /\nmysql> GRANT ALL\
    \ PRIVILEGES ON *.* TO 'felix'@'localhost';\nQuery OK, 0 rows affected (0.00 sec)\n\
    \nmysql> \n```\n\n#### GRANT ALL PRIVILEGES ON *.* TO 'felix'@'localhost';\n\n\
    这赋予了 felix 在数据库 (*.*) 中所有表上的管理员级权限。\n现在我们已经有了用户 felix，准备通过 localhost 地址和密码登录数据库。这是你可以在\
    \ JavaScript 代码中使用的账户，我们将进入第 6 章：将 MySQL 添加到 api.js。\n我们只需要让我们的数据库对远程访问开放。见下一页！\n\
    \n## 第 5 章，设置 MySQL 服务器\n\n### 5.1.6 让 MySQL 开放远程访问\n\n在你的 Linux bash 中输入 `nano\
    \ /etc/mysql/my.cnf` 来打开默认的 MySQL 配置。\n\n![](img/aad9680d7dc58780e0f8fc70276d7011_48_0.png)\n\
    \n```ini\n[mysqld]\n# bind-address = 127.0.0.1\nbind-address = 0.0.0.0\n```\n"
