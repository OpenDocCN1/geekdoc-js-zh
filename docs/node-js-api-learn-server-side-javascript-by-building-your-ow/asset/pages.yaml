  md: '# 6.4. EXECUTING A MYSQL QUERY


    # 6.4 Executing A MySQL Query


    So far we explored the idea of executing a MySQL query with exec(command) method
    residing on our main database class as a static function.


    But architecturally, this won''t do any good as far as our API goes. Remember
    that on Node a MySQL query returns in a callback function which produces the query
    result value away from our main execution thread.


    That''s fine if all you want to execute a query or two without caring about sending
    a response to the browser.


    But if you want to build an API that deals with a series of unique endpoint calls,
    you might seriously consider using promises. They can help you to properly respond
    to each incoming request with data returned from a MySQL query.


    # 6.4. Promises


    Promises add one extra layer to the standard callback pattern. When the Promise
    returns, it returns a Promise object, instead of the callback function. This Promise
    object is not guaranteed to carry a value yet, until it is resolved at a later
    time, which is exactly why it''s called a promise. You can use the built-in .then
    method on the Promise object to retrieve the results from the MySQL query.


    The Promise''s .then method allows us to wait for the result and resolve as soon
    as it becomes available if it happens at a later time.


    Using .then method allows us to avoid the nested callback pattern (or at least
    reduce its occurrence) when we keep nesting callback within a callback, because
    one API call depends on the data returned from the previous one.


    # Promise-based MySQL query


    So what does a promise-based MySQL query call look like in Node?


    Let''s take a look at that in the context of entire API endpoint round trip (Which
    includes requesting a resource using an API endpoint and responding to it.)'
