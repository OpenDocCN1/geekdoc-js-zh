  md: '# 6.9 A Pattern For Intercepting API End-Points


    In the code from this book we''ve chosen to let the server know that the URL is
    an API end-point by using the word “api” in the first segment of the URL. Our
    back-end is designed to treat requests that follow this pattern as an API action.
    All other patterns will attempt to simply download the file. Of course your application
    may not have to do this extra test.


    (for example: https://www.twitter.com/user/status/id may look more elegant to
    some. It''s up to your preference to define what this pattern should be!)


    ![](img/aad9680d7dc58780e0f8fc70276d7011_70_0.png)'
