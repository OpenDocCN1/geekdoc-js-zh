  md: '# 6.9. A PATTERN FOR INTERCEPTING API ENDPOINTS


    Note that first we wait for POST data stream to finish. Only then we call identify
    function to figure out the target and action details for the incoming request.
    This request is created by URL that was typed into the address bar (or called)
    programmatically using the fetch API on the front-end.


    This is our core API end-point logic. Once the code is implemented, we all have
    to do continue adding new end-points to this pattern.


    The next few pages go over source code for some of the most common API end-points
    you''ll have to build if you wish to create a user login based application (which
    is pretty much all of them).


    # 6.9.1 Other Endpoints


    So we''ve only covered register user endpoint. It would take too much space on
    printing them all here. The rest of end-points can be found in api.js in the GitHub
    repository for this book:


    https://github.com/javascriptteacher/node/


    Under: /module/api/api.js


    In this file you will find an object Action with static functions attached to
    it as follows:


    ```

    Action.register_user      = action_register_user;

    Action.login              = action_login;

    Action.logout             = action_logout;

    Action.get_user           = action_get_user;

    Action.delete_user       = action_delete_user;

    Action.update_user       = action_update_user;

    Action.authenticate_user = action_authenticate_user;

    Action.create_session     = action_create_session;

    Action.get_session        = action_get_session;

    ```


    These methods point to related functions for processing a particular action. They
    all return a Promise. The JSON message from each is then sent'
