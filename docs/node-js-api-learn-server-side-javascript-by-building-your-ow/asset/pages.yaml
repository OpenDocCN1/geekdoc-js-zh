  md: '# Chapter 5


    # Setting Up MySQL Server


    # 5.1 MySQL


    You can run a MySQL server directly from your computer on localhost – the home
    address of your computer as part of your local development environment. Or you
    can run it on a remote server (a paid web host, for example.)


    # 5.1.1 Install MySQL Server Locally on Windows


    Remember, you have to install MySQL – the actual program to run on your computer.
    But you also have to install the accompanying mysql NPM module so your Node server
    can include it using require keyword.


    If you want to install MySQL on your computer as part of your local development
    environment, one of the fastest ways to do that is to download it from https://dev.mysql.com/downloads/installer/


    Or you can install MySQL together with the Amppps server. You can download it
    from https://www.ampps.com/ Just download it, go through the installer and in
    under a few minutes you will have MySQL running.


    I won’t go into great detail on pressing Next button on installation screen here.
    The process is pretty straightforward.'
