    \nTo add support for more endpoints just follow the same pattern. Place them inside\n\
    request.on('end')' callback which ensures POST data finished streaming.\n\n```\n\
    // Finish reading POST data chunks\nrequest.on('end', () => {\n  API.parts = request.parts;\n\
