- img_proc: true
  md: '# 6.17. CONCLUSION


    your client, teammates, investors, friends or others who can test the new version
    of the application before the public release, and 2] you can make deployment process
    doesn''t break the main production server with new unexpected bugs.


    The stage server can be used to test integrity of the newly deployed code, without
    risking the chance of deploying erroneous code directly to master, losing customers
    and having a panic attack.


    Now you are thinking like a real production engine!


    Both master and stage are nothing more than two versions of your application running
    separately in two different locations. So I won''t talk about how to set up a
    stage server – the process is exactly the same. The difference is in where you
    push your code to.


    # 6.17 Conclusion


    At this point you should be ready to host your own secure SSL applications from
    https://www.appname.com if you indeed followed all instructions described in this
    book up to this point.


    In the next edition I will cover scaling your application and making it accessible
    by millions of simultaneous users. There is currently no set date as to when it
    will come out, but follow my work at @js_tut on Twitter for a future announcement.


    I hope that this Node API book was a faithful guide on your journey to becoming
    a software developer. Thanks for reading!'
