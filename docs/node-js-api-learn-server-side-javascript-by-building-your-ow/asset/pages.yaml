  md: '# 2.1 Mac


    You might want to start learning how to install programs from the command line.
    Mac & Linux may have different program installation managers. On OSX you generally
    use brew, yum or port (See macports.org) command. On Linux it''s either apt-get
    or more commonly just apt. You should probably use apt.


    The reason for some ways to install packages on Linux-based OS''s is due to many
    open-source distributions (Debian, Ubuntu, Fedora, Arch, CentOS...etc.) in each
    one unique flavor and version history.


    Technically, you can also use apt on Mac OSX, if it''s available. (It should be.)


    If you already have apt but you want brew — which some find to be better — on
    your OSX, run install linuxbrew-wrapper


    Now you can use brew to install packages such as nodejs, for example:


    Just run brew install nodejs to install Node in Terminal in OSX.


    To do the same on Linux use apt-get install nodejs in bash.


    Or simply apt install nodejs in bash. There are many differences between apt and
    apt-get, you can use either one. But apt is considered better.


    You can also try apt install nodejs in bash. And this is my preferred way.


    # 2.1.1 apt install nodejs


    On Linux-based systems these commands install a package or program locally on
    your computer, which like running a GUI-based installer in Windows.


    All that happens is locating, downloading and copying program files to your hard
    drive.


    After installation of packages such as nodejs and mysql you usually have to configure
    and run them. We''ll go over the process in this book!'
  merge: -1
  pgno: 16
