  md: '# 3.5 Next Steps


    We''ve just experimented with running JavaScript files with node, imported a package,
    and ran a method. You can run any valid JavaScriptcript file this way.


    But there is still a problem. After executing index.js the node process quits,
    and control is given back to cmd. This won''t help us run our application server.
    We need to build something that runs continuously so we can serve a file every
    time someone will access our server from their browser.'
  merge: -1
