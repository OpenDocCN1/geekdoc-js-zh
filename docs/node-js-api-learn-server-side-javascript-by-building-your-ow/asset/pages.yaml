  md: '# 6.7. SENDING POST DATA TO API ENDPOINT


    # 6.7 Sending POST Data To API Endpoint


    Usually an API endpoint expects additional data sent together with the request.


    For example, if we want to get user data for user with user id of 1, we need to
    include that user id in the POST request as additional data specified in JSON
    format, for example: {"user_id": 1};


    When you receive the request object, you only get the header data instantly. The
    POST data is submitted separately and you need to listen for it using two different
    events: "data" and "end" because it''s a stream / buffer.


    The request.data event tells you that there is POST data incoming. But instead
    of sending entire data object, Node streams it in chunks. So you need to put it
    together using chunks. One way of doing that is to create an array and keep pushing
    each chunk received in the "data" event''s callback onto that array.


    The request.end event tells you that all chunks of the POST data have been finished
    downloading. At this point you would take the chunks array and convert it to a
    JSON object.


    This is done using Node''s built-in Buffer.concat( chunks ).toString() method.
    The .toString() method is required to convert binary chunk data to string format.


    After this you simply convert the resulting string to a JavaScript object using
    the native JSON.parse function. We''ll see the source code for that in just a
    moment!


    If the POST data is short, it is possible to receive only one chunk. But you still
    need to intercept it as a stream.'
