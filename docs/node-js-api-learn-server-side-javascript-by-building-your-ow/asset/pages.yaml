  md: 'back to the back-end to validate that the API action has returned (and whether
    it failed or succeeded, which will be indicated by success property.)


    You can''t make authenticated connections without understanding the concept of
    sessions. Usually a session is stored in a separate database table with a unique
    ID, Authentication Token ID, and a link back to the user ID from which the session
    was initiated.


    So let''s open a database editor (such as Sequel Pro on Mac) and add a new table
    called session to entering database we created earlier in the book.


    # 6.10 Authenticating API Actions


    The User Login end-point performs a special action of generating a new Auth-Token,
    or retrieving one that already exists in a session table.


    Many other end-points, such as Update User require an existing authentication
    token to be passed together with the request. This makes sense, because without
    AuthToken anyone could have made an API call to our server. But we only want to
    allow those calls that carry AuthToken in the payload.


    This adds bulletproof security to our API, especially if the AuthToken was generated
    on a secondary server whose IP address is not known to the end user.


    Hence, it is recommended that a completely new server should be running separately
    solely for the purpose of generating the authentication token.'
