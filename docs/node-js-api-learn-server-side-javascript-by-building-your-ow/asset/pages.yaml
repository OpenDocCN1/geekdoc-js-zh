  md: '# 5.1. MySQL


    Installation will begin and files will start downloading to your hard drive.

    At this point you will see a stream of commands flowing on your screen.

    Type Y / yes and press Enter if you are ever asked any questions.


    # Allow incoming and outgoing traffic to/from mysql program:


    Assuming mysql installation was successful, you can now use the ufw utility program
    (Which stands for Uncomplicated Firewall.)


    ![](img/aad9680d7dc58780e0f8fc70276d7011_43_0.png)


    Note, our command starts with sudo which simply runs any program (ufw in this
    case) using security privileges of another user.

    sudo originally meant superuser because on older Linux versions it was designed
    to run only as superuser (usually root). Nowadays, you can use it to execute commands
    using any username/password pair on the system. The meaning of sudo acronym was
    gracefully re-formed to substitute user for said reason.


    Uncomplicated Firewall

    You can use ufw allow and ufw disallow commands to allow incoming and outgoing
    traffic from a program. Without any additional options it is assumed you are giving
    full access rights to this program. The ufw command has many other options, and
    you can even allow connections on a specific port. Look it up online if you need
    the complete documentation.


    ![](img/aad9680d7dc58780e0f8fc70276d7011_43_1.png)'
