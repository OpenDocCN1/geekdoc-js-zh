  md: 'Update index.js with code above and request 127.0.0.1:3000/index.html or localhost:3000/index.html
    from your browser again.


    If index.html exists in the root directory of your project (C:\app) then it will
    be served to your browser and the contents will be displayed.


    But if the requested index.html doesn''t the browser serve an empty page by inserting
    blank <html></html> tags on its own for a clean slate view.


    # Adding More MIME Types


    We now have our Node serving files of .html type. If any other type is requested,
    the file will be actually downloaded into the browser, instead of shown in the
    display view.


    This is because the file extension is not on our mime list, we serve it as application/octet-stream
    which means a binary file download.


    In order to add other files (I assume you want to start at least support for .css,
    .png, .jpg, .txt, .js and .json files to start anything meaningful with your server)
    all you have to do is to mime variable:


    ```

    001 let mime = { ''.html'': ''text/html'',

    002               ''.js'': ''text/javascript'',

    003               ''.css'': ''text/css'',

    004               ''.json'': ''application/json'',

    005               ''.png'': ''image/png'',

    006               ''.jpg'': ''image/jpg'',

    007               ''.gif'': ''image/gif'' };

    ```


    # Conclusion


    From here you will build out the rest of your server architecture. The remainder
    of this book will walk you through how to install MySQL and write code for implementing
    your own API. You can then use this API to build your application.'
