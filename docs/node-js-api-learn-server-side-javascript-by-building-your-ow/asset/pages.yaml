  md: '# 3.4. ADDING PACKAGES TO INDEX.JS


    # 3.4 Adding Packages To index.js


    Node comes with about 349 packages by default. They are also called modules. Modules
    are stored in your node installation folder (C:\Program Files\nodejs in our case)
    node_modules.


    You might also find them in nodejs\npm folder: C:\Program Files\nodejs\node_modules\npm\node_modules\


    In browser-side JavaScript code, you can use import / export keywords. But in
    addition to that, you can use require keyword to add useful modules to your app
    from the main NPM repository.


    Node assumes path module exists in node_modules directory. If not, you can install
    it with npm (node package manager) by running: npm install path


    The package called path gives us ability to work with URL paths in an easier way.
    Once included path.extname method can parse extension part of a filename from
    a string. This is a frequent need in server-side programming:


    ```

    001 let path = require(''path'');

    002

    003 let ext = path.extname(''index.js'');

    004

    005 console.log(ext); // outputs ''.js''

    ```


    Update index.js file with above code and run node index.js command:


    ```

    c:\app>node index.js

    ```


    > Figure 3.3: Run: node index.js


    ![](img/aad9680d7dc58780e0f8fc70276d7011_29_0.png)


    > Figure 3.4: Output: .js'
  merge: -1
