  md: '# 6.11. SSL CONNECTIONS VIA HTTPS PROTOCOL


    65


    # 6.11 SSL Connections via HTTPS Protocol


    Modern web-applications are not required to be hosted via secure HTTPS connections.
    However, there is a good reason you should not run production-ready applications
    over HTTP. (The way we have been doing it up to this point.)


    This means that the connection will be encrypted by something called Secure Sockets
    Layer or SSL for short.


    SSL helps you encrypt the data sent from your computer to your server. This provides
    increased security for data such as credit card numbers, emails and passwords.
    With HTTP protocol, the data is sent as-is. (Perhaps, it may have been compressed,
    but not encrypted by an encryption algorithm.)


    This is important because unless you implement SSL the data sent to the server
    is not secure. Also Chrome and other browsers will display "Not Secure" message
    to your domain name.


    So far we''ve worked with Node''s http module. We assigned the variable http to
    an import from require(''http'') module on the first line of index.js file.


    ```

    001 let http = require("http");

    ```


    Luckily for us Node already has a module available to cover https and it''s easy
    to switch. Just change "http" to "https":


    ```

    001 let http = require("https");

    ```


    It''s up to you if you want to change variable name too but we''ll leave it intact
    so we don''t break the rest of our code we''ve written so far.'
  merge: -1
