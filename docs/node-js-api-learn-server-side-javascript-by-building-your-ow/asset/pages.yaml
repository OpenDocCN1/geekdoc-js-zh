  md: '# 6.14 Building Scalable Applications


    So far we learned how to build an API Node server that uses MySQL to perform storage
    and the classic CRUD data operations.


    MySQL, MariaDB, MongoDB and other similar software might work well in the beginning
    stages of your application, running on a single server.


    You will be able to host 1K - 10K users (or maybe even more) based on the amount
    of RAM available, the IO rate of your SSD drive, and how well your server code
    is optimized. Fine tuning your server and writing code optimized for performance
    can be magical for increasing the number of users that can be served by a single
    instance of your server.


    But once your server’s maximum bandwidth is exhausted, it will start coming to
    crawl if any more users join and start using your application.


    In the old days, Battle.net running Diablo I and StarCraft I used to work off
    a **single server** with hundreds of thousands of users connected simultaneously.
    This is an example of how limited resources encourage efficient code.


    It’s not uncommon for web applications of today to be real-time. Additional thought
    and engineering must be applied if you want to build large-scale applications
    that serve hundreds of thousands or even millions of simultaneous users.


    # 6.14.1 Moving To RAM


    No modern real-time application (Twitter, for example) uses SQL databases to serve
    primary features to their users. The reason is quite simple. When using SQL for
    everything it means there is a hard drive operation every time someone makes a
    request! This can be an overkill, because you are outsourcing the slowest part
    of your system to serve key features of your application.


    One solution is to switch to an SSD server (and to be honest, most of them already
    are by today’s standards.) But what if we store all of our data in RAM instead?
    This way we can avoid touching the hard drive completely (by caching frequently
    accessed data in an object.)


    Of course, the original data will still be stored on the hard drive. The difference
    is'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# 6.14. BUILDING SCALABLE APPLICATIONS


    that when you launch your Node server, it will be copied into a JavaScript object.


    When client requests a certain resource we can simply serve it directly from that
    object. It will contain a copy of the MySQL database would contain. But your application
    will become significantly more efficient.


    You will write this object to the hard drive, so it can permanently store the
    most recent data, but not as frequently as you would with a 100% MySQL setup.


    Some databases such as MongoDB also implement similar RAM caching features. But
    they still may not be optimized for the primary purpose of your application which
    only you know. Thus missing the chance of taking advantage of the full potential
    of your server''s horsepower.


    And just like with anything else, you can either "install a package," or install
    and configure existing software, or you can learn to write your own code. Without
    the latter, you may never be able to develop the skill of building an extremely
    efficient system for serving millions of users.


    Unfortunately, this architecture will not be covered in 1st edition of this book
    due to time constraints I''ve had within which I had to finish this volume. However,
    I plan on second edition where I will go into greater detail on the subject. For
    now, the least I could do is to give you a pointer in the right direction.'
