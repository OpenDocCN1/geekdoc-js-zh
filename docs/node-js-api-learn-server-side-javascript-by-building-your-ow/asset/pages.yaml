  md: '# Chapter 4


    # Building The API


    So far we learned how to serve requested files. But if you want to build real
    web applications, you might want to integrate support for API endpoints.


    An endpoint is a URL that follows a special pattern. We can intercept this pattern
    and upon its presence we will execute an API command, instead of serving a file.


    This API command is likely to establish a database connection and either modify
    or fetch some type of data. Our server can return a JSON object containing requested
    data.


    We will take a look at how to create some API end points for our existing Node
    server. And then we will install MySQL and execute some queries. Using this pattern
    you can build out the rest of your API.


    Here is an example of an API endpoint that gets user info:


    ```

    http://localhost:3000/api/user/get

    ```


    Here is an example of an API endpoint that sets user info:


    ```

    http://localhost:3000/api/user/set

    ```


    When this type of URL is requested, we will cancel serving the file, run some
    server-side commands and return a result.'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# 4.1 Building Endpoint API\n\nLet's write our API code.\n\nPlace the following\
    \ code into a separate file api.js. It will be imported into our main server application\
    \ from index.js.\n\n```\nclass API {\n  constructor() { }\n  static exec() {\n\
    \    let parts = API.parts;\n    console.log(API.exec(), parts = \"\", API.parts);\n\
    \    if (parts[0] == \"api\") {\n      if (parts[1] == \"user\") {\n        if\
    \ (parts[2] == \"get\") {\n          // database.exec();\n        }\n      }\n\
    \    }\n    static catchAPIRequest(v) {\n      v[0] = \"/\" ? v.substring(1, v.length)\
    \ : null;\n      if (v.split(\"/\").constructor == String) {\n        if (v.split(\"\
    /\")[0] == \"api\") {\n          API.parts = v.split(\"/\");\n          return\
    \ true;\n        }\n      }\n      return false;\n    }\n  }\n}\nAPI.parts = null;\n\
    module.exports = API;\n```\n\nStatic function API.catchAPIRequest will return\
    \ true if the request.url matches our API pattern. We will cancel serving the\
    \ file as usual in this case.\n\nThe static API.parts property stores the parts\
    \ of the API call in an array. For example localhost:3000/api/user/get becomes:\
    \ ['api', 'user', 'get']. Based on these values we can tell our server what to\
    \ do (execute MySQL query, etc.)\n\nStatic function API.exec will execute the\
    \ command."
