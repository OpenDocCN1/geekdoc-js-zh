    027   if (error) {

    028     if (error.code == ''ENOENT'') {

    029       // Is this an API call, or should we serve a file?

    030       if (API.catchAPirequest(request.url))

    031         response.end(API.exec(request.url, ''utf-8''));

    032     else

    033       // Not an API call - file doesn''t exist

