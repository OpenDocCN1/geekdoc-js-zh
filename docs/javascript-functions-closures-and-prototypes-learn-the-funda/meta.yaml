  md: '# 1. Preface


    There is no doubt JavaScript has grown to become one of the most important programming
    languages today. Yet, surprisingly enough, there are many who consider methodical
    learning of JavaScript unnecessary. This is very surprising, even now in 2016
    that JavaScript has improved dramatically since 1995 when it was first released.
    This trend seems to be prevalent in many venues, but it doesn''t have to be that
    way. One of the goals of this book is to point you in the right direction by focusing
    on the three important concepts in JavaScript, namely functions, closures, and
    prototypes. Hopefully, by the end of the book you will feel comfortable with these
    concepts and find yourself enabled to go ahead and use them effectively in your
    own programs. In addition, there is a bonus chapter listing interview questions
    that are often asked in any interviews for any JavaScript or front-end related
    position. You can use that chapter to evaluate yourself and revisit the chapters
    or sections as necessary.


    # 1.1 Book overview


    In Chapter 1 we will explore all the fundamental concepts related to functions,
    including function objects, function declarations and expressions, the this keyword
    and more.


    In Chapter 2 we will learn what closures are, why they are useful, and how you
    can use them in your programs.


    In Chapter 3 we will look at probably the most important concept in JavaScript,
    that is the prototypes. We will learn what they are, why they make JavaScript
    so different than class-oriented languages, and how you can use them to simplify
    the design of your programs.


    # 1.2 How to read this book


    Every chapter of the book opens with a list of bullet points of important concepts.
    Each bullet point is explored in detail through the chapter. You may find the
    book very dry in nature, so many want to take breaks while reading. Although you
    may to read chapters out of order, or just skip through the chapters, please don''t.
    Please take your time, study each chapter slowly, and take breaks if you find
    yourself unmotivated. The book is designed this way to serve as a reference so
    that you can refer to any time in the future. Also, keep in mind that the book
    is always up-to-date with the latest spec of the language, which is currently
    ES2015. I genuinely hope you get something out of the book, and please submit
    an issue if you don''t understand something, or if you find a spelling error or
    a mistake in the code. The book is written in Markdown and is hosted on github:
    https://github.com/aminmeyghani/js-fn-book


    Happy coding :)'
  merge: -1
