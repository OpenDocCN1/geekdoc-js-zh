    \ 30\n\n# 1. Preface\n\nThere is no doubt JavaScript has grown to become one of\
    \ the most important programming languages today. Yet, surprisingly enough, there\
    \ are many who consider methodical learning of JavaScript unnecessary. This is\
    \ very surprising, even now in 2016 that JavaScript has improved dramatically\
    \ since 1995 when it was first released. this trend seems to be prevalent in many\
    \ venues, but it doesn't have to be that way. One of the goals of this book is\
    \ to point you in the right direction by focusing on the three important concepts\
    \ in JavaScript, namely functions, closures, and prototypes. Hopefully, by the\
    \ end of the book you will feel comfortable with these concepts and find yourself\
    \ enabled to go ahead and use them effectively in your own programs. In addition,\
    \ there is a bonus chapter listing interview questions that are often asked in\
    \ any interviews for any JavaScript or front-end related position. You can use\
    \ that chapter to evaluate yourself and revisit the chapters or sections as necessary.\n\
    \n# 1.1 Book overview\n\nIn Chapter 1 we will explore all the fundamental concepts\
    \ related to functions, including function objects, function declarations and\
    \ expressions, the this keyword and more.\n\nIn Chapter 2 we will learn what closures\
    \ are, why they are useful, and how you can use them in your programs.\n\nIn Chapter\
    \ 3 we will look at probably the most important concept in JavaScript, that is\
    \ the prototypes. We will learn what they are, why they make JavaScript so different\
    \ than class-oriented languages, and how you can use them to simplify the design\
    \ of your programs.\n\n# 1.2 How to read this book\n\nEvery chapter of the book\
    \ opens with a list of bullet points of important concepts. Each bullet point\
    \ is explored in detail through the chapter. You may find the book very dry in\
    \ nature, so many want to take breaks while reading. Although you may to read\
    \ chapters out of order, or just skip through the chapters, please don't. Please\
    \ take your time, study each chapter slowly, and take breaks if you find yourself\
    \ unmotivated. The book is designed this way to serve as a reference so that you\
    \ can refer to any time in the future. Also, keep in mind that the book is always\
    \ up-to-date with the latest spec of the language, which is currently ES2015.\
    \ I genuinely hope you get something out of the book, and please submit an issue\
    \ if you don't understand something, or if you find a spelling error or a mistake\
    \ in the code. The book is written in Markdown and is hosted on github: https://github.com/aminmeyghani/js-fn-book\n\
    \nHappy coding :)\n\n# 1.3 Requirements\n\nIn order to follow along with the book,\
    \ you need the following:\n\n- Google Chrome\n- Node > 5\n- A text editor (Sublime\
    \ Text is recommended, but not necessary)\n\nBelow, you can find useful information\
    \ about Chrome DevTools and installing Node. Since we will be using them throughout\
    \ the book, please take the time to make sure that you have all of them up.\n\n\
    # Using Chrome DevTools\n\nYou can run JavaScript code in Chrome DevTools. You\
    \ can use either the console or the snippets tab to create snippets of JavaScript\
    \ code. In order to use the console, open Chrome, right click on the page, and\
    \ choose inspect. Once you do that, the DevTools opens up. Once the DevTools is\
    \ open, click on the Console tab to open the Console, you can run JavaScript code\
    \ one line at a time. The screenshot below demonstrates how to find the Console\
    \ tab:\n\n# Using the Console\n\n# Preface\n\nIn addition to the Console, you\
    \ can use the snippets tab to create snippets of code and execute them. In order\
    \ to create a new snippet, click on the Snippet tab, and then right click in the\
    \ empty area to create a new snippet. The screenshot below shows you how to create\
    \ a new snippet:\n\n# Creating a snippet\n\nAfter you created a snippet, you can\
    \ write some code and execute it by either clicking on the run button on the right\
    \ hand side of the DevTools, or by using the command + enter shortcut. The screenshot\
    \ below demonstrates how to run the snippet:"
