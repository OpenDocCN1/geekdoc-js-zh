  md: "```\n/* apply each functionalities to\nDeveloper's prototype *\n[personFns,\
    \ workerFns].forEach(fn => {\n  fn.call(Developer.prototype);\n});\n```\n\nNow\
    \ we can create an instance of the Developer and call any of the methods:\n\n\
    ```\n/* create an instance and call methods */\nconst dev = Developer('Amin');\n\
    console.log(dev.getName());\nconsole.log(dev.walk());\nconsole.log(dev.work());\n\
    console.log(dev.code());\nconsole.log('Dev.is: ' + dev);\n```\n\nAfter running\
    \ the code above you should get the following output:\n\n```\nAmin\nWalking ...\n\
    Working ...\nCoding ...\nDev is: Amin\n```\n\nAnd that's how you can use functional\
    \ mixins to augment a type. Also note that the context object this, always refers\
    \ to the created instance object. Now that we have learned functional functional\
    \ mix are, let's see how we can improve the performance by forming a closure around\
    \ the mixins to cache the result of the first definition call:\n\n```\nconst personFns\
    \ = (function() {\n  function walk() { return 'Walking...' };\n  function getName()\
    \ { return this.name; }\n  return function() {\n    this.walk = walk;\n    this.getName\
    \ = getName;\n    return this;\n  }\n});\n\nconst workerFns = (function() {\n\
    \  function work() { return 'working...' };\n```"
