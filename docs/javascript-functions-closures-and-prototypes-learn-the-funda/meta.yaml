    # 5. Prototypes


    There are different ways to interpret the prototype concept in JavaScript, but
    you can explain it in very easily in one sentence:


    > “In JavaScript, prototypes are objects that facilitate linking of objects and
    delegation of methods or properties”


    That''s really it. The most confusing part about the prototype concept is just
    the terminology, but the concept itself is pretty straightforward. The diagram
    below demonstrates the idea in more detail:


    ![](img/3072f6f2d2de9ad2e2479a268fe2725b_19_0.png)


    # The Prototype Concept


    +   - The boxes represent objects

    - The arrow shows the link direction: a links to b, b links to c, c links to m

    - The links form the prototype chain which contains all the methods to all objects

    - m is the mother object which contains all methods to all objects

    - [[p]] is the internal property of an object that points to another object. Confusingly,
    this property is known as [[prototype]] in the specification

    - In this diagram, b is known as the prototype of a, c the prototype of b and
    m the prototype of c.

    - Property and method look up the prototype chain. That is, if you want to look
    up a property in a, JavaScript will first look at a itself. If it cannot find
    it there, it will then look in b. If it cannot find it in b, it will look in c.
    If it cannot find it in c, it will look in m, and eventually if it cannot find
    it in m, it will return undefined because m is the ‘mother object’ and is not
    linked to any other object.

    - But if you want to look up a property in c, JavaScript will not look into a
    or b. It will follow the link direction and if it cannot find it in c, it will
    look in m, and will return undefined if it cannot find it in m.

    - The m object is a special object which comes from Object.prototype. Don''t worry
    about it now, we have enough prototype jargon lying around already)


    That was the Prototype concept in a nutshell. Now let''s dive in and learn how
    we can link objects.'
  - "[PAGE 20]\n\n# 5.1 Linking Objects\n\nWhen you create any objects, behind the\
    \ JavaScript links your object to the 'mother object'\nautomatically:\n\n```\n\
    var user = {\n  name: 'Amin'\n};\n```\n\nRoughly speaking, this is what happens\
    \ behind the scenes:\n\n![](img/3072f6f2d2de9ad2e2479a268fe2725b_20_0.png)\n\n\
    Creating a plain old JavaScript Object\n\n+   - The user object gets linked to\
    \ the 'mother' object\n- Object m is known as the prototype of user\n- You can\
    \ get the prototype of user using the Object.getPrototypeOfOf method, that is:\
    \ Object.getPrototypeOf(user)\n- The 'mother' object is the prototype property\
    \ of the Object constructor function (WO!)\n- You can check the prototype of user\
    \ using: Object.getPrototypeOfOf(user) === Object.prototype // -> true\n\nAs you\
    \ can see, the terminology can get very confusing, so let's not get caught up\
    \ with the jargon What's important is fact that objects can link to each other\
    \ and an object can delegate responsibilities to other objects. That is the core\
    \ of the idea and don't let the jargon confuse you.\n\nNow that you know a little\
    \ bit what happens behind the scenes, let's create our own objects and link them\
    \ together. In JavaScript there are main ways to link objects. The first one has\
    \ been available ES5 and is Object.create. Let's create two objects a and b, and\
    \ link a to b. Because we are linking a to b, object b will be the prototype of\
    \ a."
- md: "\n# Prototypes\n\n```\n1 // a -> b: b is the prototype of a.\n2 // defining\
    \ object `b` who is going to be the prototype of `a`\n3 var b = {\n4   hello:\
    \ function () {\n5     return 'hello';\n6   }\n7 };\n8 // create `a` and link\
    \ it to `b`\n9 var a = Object.create(b);\n```\n\nThat's all it takes to link a\
    \ to b. So if we call a.hello(), first JavaScript will look at a, and because\
    \ the hello method does not exist on a, it will look at b and it will invoke the\
    \ method. Also remember that b is automatically linked to the Object object, so\
    \ when we call a.toString(), JavaScript will look up all the way from a to Object\
    \ and then it will invoke the method using the implementation in Object. You can\
    \ override any method, so let's provide our own toString method for a:\n\n```\n\
    1 a.toString = function () {\n2 return 'I am a.';\n3 };\n```\n\nNow when we call\
    \ a.toString we get back I am a. Now let's look at the other common way to link\
    \ objects.\n\nThe other way of linking objects is using constructor function objects.\
    \ We are going to do the same example as above, but instead we are going to use\
    \ a more common way of creating it. So first, let's create the prototype object,\
    \ that is object b. The funny thing is, to create this object first you need to\
    \ create a function:\n\n```\n1 var F = function () {};\n```\n\nThen, you need\
    \ to access to a special property on the function, which is created when you create\
    \ any function in JavaScript. This property, not surprisingly, is called prototype:\n\
    \n``` even1 var b = F.prototype;\n2 b.hello = function () {\n3 return 'hello';\n\
    4 };\n```\n\nNow that we have a prototype object, we can create object a by invoking\
    \ the F function using the new keyword:\n\n```javascript\nvar a = new F();\n```\n\
    \nBecause this pattern is so common, you don't need to create a reference to F.prototype.\
    \ You can just add methods to F.prototype and then create an object using the\
    \ function:\n\n```javascript\nvar F = function () {};\nF.prototype.hello = function\
    \ () {\n  return 'hello';\n};\nvar a = new F();\n// a -> F.prototype -> Object.prototype\
    \ -> null\n// a -> b -> null\na.hello(); // -> 'hello'\n```\n\nThat's Not! We\
    \ have linked a to b and b is the prototype of a. It might look a little bit weird\
    \ but that's the mechanism that JavaScript uses to link objects. Maybe now it\
    \ makes more sense why the Object object is Object.prototype. The reason is that\
    \ Object is a function who, just like any other function, has a properly called\
    \ prototype. So when you create a plain object for example, it gets linked to\
    \ Object.prototype. It is equivalent to the following:\n\n```javascript\nvar myObj\
    \ = Object.create(Object.prototype);\n// or\nvar myObj = new Object();\n// Object.getPrototypeOf(myObj)\
    \ === Object.prototype // -> true\n```\n\nThe great thing is that this mechanism\
    \ is consistent throughout JavaScript and that explains a lot of things about\
    \ JavaScript. Let's explore this in the next section.\n\n# 5.2 Prototype Objects\
    \ Inside JavaScript\n\nJavaScript internally has several functions as constructors\
    \ that it uses as constructors. The most common ones are:\n\n- Boolean\n- Number\n\
    - String\n- Object\n- Function\n\nNote that all of these functions, correspond\
    \ to the fundamental data types in JavaScript:\n\n## Primitive Data Types:\n\n\
    - boolean\n  - number\n  - string\n- Non-primitive Data Types\n  - object (functions\
    \ are objects too)\n\nThe most important point is that all the methods that are\
    \ available on the data types come from the value of the prototype property of\
    \ the constructor function. Also note that constructor functions always start\
    \ with an uppercase letter. Let's look at some examples.\n\nYou know that strings\
    \ are primitive values, yet you can call methods on strings:\n\n```javascript\n\
    var str = 'hello';\nstr.replace('o', 'oo'); // heloo\n```\n\nFirst of all, how\
    \ can we call the replace method on the string, if str is a primitive value? Second\
    \ of all, where does the replace method come from? In order to answer the first\
    \ question, we need to learn how JavaScript can coerce one type to another. When\
    \ you create a primitive string value and assign it to the variable str, nothing\
    \ happens until you use the dot operator on the reference. Then JavaScript coerces\
    \ the primitive string to the equivalent object by wrapping it with the corresponding\
    \ constructor function. In this case, roughly speaking, JavaScript does the following\
    \ to the primitive value:\n\n```javascript\nvar str = new String('hello');\n```\n\
    \nAnd that's why you can call the method on str because it is an object for a\
    \ short period of time until it is garbage collected. Now we know what happens\
    \ behind the scenes, it might be easier to answer the second question: where does\
    \ the replace method come from? The answer is, it comes from String.prototype\
    \ and if you think about it, the answer is consistent with what we learned in\
    \ the previous section. And since JavaScript is dynamic, you can add a method\
    \ to String.prototype object and magically all the existing strings in your code,\
    \ have a new method. This is not generally recommended, but let's demonstrate\
    \ this by adding a new method on String.prototype first that returns the first\
    \ character of a given string:\n\n```javascript\nString.prototype.first = function\
    \ () {\n  return this.charAt(0);\n}\nstr.first(); // 'h'\n```\n\nAs you can see,\
