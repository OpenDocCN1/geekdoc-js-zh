    When you use call to invoke a function, the first argument is the value of the
    context object. And the second argument is the parameters separated by commas:


    ```

    add.call({}, 1,2); // -> 3

    ```


    # Function.prototype.apply


    Using apply is similar to call, except instead of passing the arguments one by
    one separated by commas, you pass the arguments in an array:


    ```

    add.apply({}, [1,2]); // -> 3

    ```


    # Calling Function with new


    You can call a function with the new keyword when you want to use the function
    to create objects. You wouldn''t really call the sum function above with the new
    keyword. When a function is called with the new keyword, couple of things happen
    behind the scenes:


