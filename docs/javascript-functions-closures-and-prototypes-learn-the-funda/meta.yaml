  md: '# 1.3 Requirements


    In order to follow along with the book, you need the following:


    +   - Google Chrome

    - Node > 5

    - A text editor (Sublime Text is recommended, but not necessary)


    Below, you can find useful information about Chrome DevTools and installing Node.
    Since we will be using them throughout the book, please take the time to make
    sure that you have all of them up.


    # Using Chrome DevTools


    You can run JavaScript code in Chrome DevTools. You can use either the console
    or the snippets tab to create snippets of JavaScript code. In order to use the
    console, open Chrome, right click on the page, and choose inspect. Once you do
    that, the DevTools opens up. Once the DevTools is open, click on the Console tab
    to open the Console, you can run JavaScript code one line at a time. The screenshot
    below demonstrates how to find the Console tab:


    ![](img/3072f6f2d2de9ad2e2479a268fe2725b_4_0.png)


