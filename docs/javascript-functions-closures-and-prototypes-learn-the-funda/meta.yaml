    # Executing a snippet


    # Installing Node


    Node is a JavaScript run-time that you can use to execute JavaScript scripts.
    The easiest way to install and manage Node is with nvm. You can use the following
    to install NVM:


    ```

    curl -o https://raw.githubusercontent.com/creationix/nvm/v0.31.0/install.sh |
    b \

    ash

    ```


    After that, make a new terminal and make sure that nvm is installed with nvm --version.
    If you don''t get any output, try adding the following to your ~/.bash_profile
    file:


    ```

    export NVM_DIR=~/.nvm

    source $(brew --prefix nvm)/nvm.sh

    ```


    After NVM is installed, you can use it to install any Node version that you need.
    For example, to install the latest version 5, run:


    > https://github.com/creationix/nvm'
