    \ the variables maintain their previous value state. Let's demonstrate this with\
    \ a simple example. First, we need an outer function that defines a variable called\
    \ stateVal:\n\n```\nfunction makeClosure() {\n  let stateVal = 0;\n}\n```\n\n\
    And that,, we need to create another function inside that references stateVal:\n\
    \n```\nfunction makeClosure() {\n  let stateVal = 0;\n  function cl1() {\n   \
    \ stateVal += 1;\n    return stateVal;\n  }\n}\n```\n\nand then, to access the\
    \ closure function, we need to return it from makeClosure:\n\n```\nfunction makeClosure()\
    \ {\n  let stateVal = 0;\n  function cl1() {\n    stateVal += 1;\n    return stateVal;\n\
    \  }\n  return cl1;\n}\n```\n\nNow that we have our closure function, we can call\
    \ it and get access to the closure function inside:\n\n```\nconst inc = makeClosure();\n\
