    \ we use the context object to assign the color property. And then we call the\
    \ function using the new keyword and assign the result to the myCar variable.\
    \ Now, myCar is the object created by the Car constructor function.\n\n# Context\
    \ Object this\n\nThe context object, this is a dynamic object which is set dynamically\
    \ depending on the way a function is called. There are several rules to follow\
    \ in figure out what this is bound to.\n\nFirst, check if the function of interest\
    \ is called with the new keyword. If so, then this is bound to the new object\
    \ created by the function. If not, check if the function is being called with\
    \ call or apply; if so, the first argument tells you what the value of this is\
    \ bound to. If not, check if the function is called in the context of another\
    \ object (someObj.fn()), if so, then this is bound to the object. If none of these\
    \ cases are met the function is simply invoked without any context, this will\
    \ be bound to the global object in non-strict mode. However, in the strict mode,\
    \ the value of this will be undefined.\n\nLet's look at some examples and how\
    \ the context object is bound to.\n\n# Call with new\n\nThe first example, is\
    \ just a review from the previous section. That calling a function with the new\
    \ keyword. When you call a function with the new keyword, the context object is\
    \ bound to the instance object created by the function:\n\n```\nfunction Car()\
    \ {\n  this.color = 'Black';\n}\nconst myCar = new Car();\n```\n\nTo figure how\
    \ this is bound, we look at the line where the function is called. In this case,\
    \ the function is called with the new keyword, so we know that the context is\
    \ bound to the new object that is going to be returned by the function. This is\
    \ the case that you always have to check first, because it rules the other ones.\n\
    \nIn the next example, we are going to call a function with call and apply."
