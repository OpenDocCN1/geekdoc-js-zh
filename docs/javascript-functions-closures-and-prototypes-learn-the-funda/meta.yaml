  mdcn: "\n## 使用 call 或 apply\n\n让我们来看看当使用 `call` 或 `apply` 调用函数时，`this` 的值是如何绑定的。在这个示例中，我们将创建一个名为\
    \ `printMessage` 的简单函数，它将读取 `this` 上的属性并返回消息：\n\n```javascript\nfunction printMessage(msg)\
    \ {\n  return msg + ' ' + this.name;\n}\nconst message = printMessage.call({name:\
    \ 'Amin'}, 'Welcome!');\n// -> 'Welcome! Amin'\n```\n\n在上面的示例中，我们观察调用函数的那行，你可以看到是通过\
    \ `call` 调用函数，并且 `this` 的值被显式地作为第一个参数传递。因此在函数内部，`this` 将绑定到 `{name: 'Amin'}`，当我们调用函数时，它将返回以下结果：\n\
    \n- 'Welcome! Amin'\n\n`apply`的情况与上述非常相似，只是我们以数组的形式传递参数，但 `this` 的值仍然绑定到传递的第一个参数上，即：`{name\
    \ : 'Amin'}`。\n\n```javascript\nfunction printMessage(msg) {\n  return msg + '\
    \ ' + this.name;\n}\nconst message = printMessage.apply({name: 'Amin'}, ['Welcome!']);\n\
    ```\n\n输出与 `call` 示例相同，这里需要注意的关键点是：当你使用 `call` 或 `apply` 调用函数时，第一个参数是上下文对象，该对象将在函数内部作为\
    \ `this` 使用。\n\n## 隐式绑定\n\n下一个观察的情况是函数在另一个对象的上下文中被调用。首先，让我们创建一个对象并在其上定义一个方法，然后在对象的上下文中调用该方法：\n\
    \n## Functions\n\n```javascript\nconst util = {\n  name: 'Utility',\n  getName:\
    \ function () {\n    return this.name;\n  }\n};\nconst name = util.getName();\
    \ // -> Utility\n```\n\n同样，我们首先看调用函数的那行，你可以看到函数是在 `util` 对象上被调用的，即 `util.getName()`。因此，上下文对象就被隐式地绑定到了\
    \ `util` 对象上。\n\n最后一种情况是在没有任何上下文的情况下调用函数。使用上面的示例 `util` 对象，我们可以将 `getName` 函数赋值给一个变量，并在没有任何上下文的情况下调用该函数：\n\
    \n```javascript\nconst util = {\n  name: 'Utility',\n  getName: function () {\n\
    \    return this.name;\n  }\n}\nconst name = util.getName;\nconst name = name();\n\
    ```\n\n在这种情况下，当调用函数时，上下文对象默认被设置为全局对象。如果你在浏览器中，它将绑定到 `window` 对象；如果你在服务器上，它将绑定到\
    \ `global` 对象。\n\n然而，需要注意的是，在严格模式（strict mode）下，如果你像这样调用函数，`this` 的值将是 `undefined`：\n\
    \n```javascript\nfunction setName(name) {\n  'use strict';\n  this.name = name;\n\
    }\nsetName();\n```\n\n当你运行上面的函数时，我们将得到以下错误：\n\nTypeError: Cannot set property\
    \ 'name' of undefined\n\n这是因为在严格模式下，当你不带上下文调用函数时，`this` 会被设置为 `undefined`。因此，在\
    \ `undefined` 上设置属性将抛出错误。这是一件好事，因为这样你就不会无意中在全局对象上设置属性。\n\n## 3.4 作为对象的函数\n\n你可以将函数当作普通对象来使用：\n\
    \n```javascript\n1 var fnRef = function fnObject {};\n2 fnRef.someProp = 'foo';\n\
    3 fnRef.hello = function () {\n4   return 'hello';\n5 };\n```\n\n注意，你可以访问这个函数对象的属性和方法：\n\
    \n```javascript\n1 fnRef.someProp // -> 'foo'\n2 fnRef.hello() // -> 'hello'\n\
    ```\n\nTODO 更多内容即将到来 ...\n\n## 4. 闭包\n\n通常来说，闭包（closure）是一个动态引用，当内部函数使用外部函数的变量时就会创建。为了使用闭包，会返回内部函数，并且当调用闭包时，变量将保持它们之前的数值状态。让我们用一个简单的示例来演示。首先，我们需要一个定义了名为\
    \ `stateVal` 变量的外部函数：\n\n```javascript\nfunction makeClosure() {\n  let stateVal\
    \ = 0;\n}\n```\n\n然后我们需要在内部创建另一个引用 `stateVal` 的函数：\n\n```javascript\nfunction\
    \ makeClosure() {\n  let stateVal = 0;\n  function cl1() {\n    stateVal += 1;\n\
    \    return stateVal;\n  }\n}\n```\n"
