    \ () {\n    return this.name;\n  };\n}\n```\n\n```\n/* Define Worker's functionalities\
    \ */\nfunction workerFns() {\n  this.work = function () {\n    return 'Working...';\n\
    \  }\n}\n```\n\n```\n/* Define Developer's functionalities */\nfunction developerFns()\
    \ {\n  this.code = function () {\n    return 'Coding...';\n  }\n}\n```\n\nNow\
    \ we have defined the groups of functionalities, then we need to define the Developer\
    \ type:\n\n```\n/* Define the Developer type */\nfunction Developer(name) {\n\
    \  if ((this instanceof Developer)) {\n    return new Developer(name);\n  }\n\
    \  this.name = name;\n  this.toString = function () {\n    return this.name;\n\
