- md: "# Preface\n\n# 4\n\n![](img/3072f6f2d2de9ad2e2479a268fe2725b_6_0.png)\n\n#\
    \ Executing a snippet\n\n# Installing Node\n\nNode is a JavaScript run-time that\
    \ you can use to execute JavaScript scripts. The easiest way to install and manage\
    \ Node is with nvm. You can use the following to install NVM:\n\n```\ncurl -o\
    \ https://raw.githubusercontent.com/creationix/nvm/v0.31.0/install.sh | bash\n\
    ```\n\nAfter that, make a new terminal and make sure that nvm is installed with\
    \ nvm --version. If you don't get any output, try adding the following to your\
    \ ~/.bash_profile file:\n\n```\nexport NVM_DIR=~/.nvm\nsource $(brew --prefix\
    \ nvm)/nvm.sh\n```\n\nAfter NVM is installed, you can use it to install any Node\
    \ version that you need. For example, to install the latest version 5, run:\n\n\
    > https://github.com/creationix/nvm\n\nnvm install 5\n\nThat's it! Now, if you\
    \ want to set this version as your machine default, run the following:\n\nnvm\
    \ alias default 5\n\nNow that you have Node installed, you can execute Node scripts.\
    \ For example, make a file on your desktop called script.js:\n\n```\ntouch ~/Desktop/script.js\n\
    ```\n\nThen add the following to the file:\n\n```\nconsole.log('hello world');\n\
    ```\n\nThen execute the script with node ~/Desktop/script.js and you should see\
    \ the output in the terminal. That's it.\n\n# TODO\n\n# 2. Introduction\n\nFunctions,\
    \ closures, and prototypes are essential in learning JavaScript.\n\n# 3. Functions\n\
    \nFunctions are callable objects. It is very important to note that in JavaScript\
    \ functions are objects. It might be misleading because when you use the typeof\
    \ operator on a function, you get function as the output. This is one of the instances\
    \ where JavaScript lies to you. The output of typeof () should be object because\
    \ functions are objects in JavaScript. That makes functions very powerful, because\
    \ you can think of them as callable objects. You can use a function as an object,\
    \ a piece of reusable code, or a function that creates objects.\n\n### 3.1 Creating\
    \ Functions\n\nThere are two main ways of defining functions:\n\n- function declaration\n\
    - function expression\n\nIf a statement starts with the function keyword, then\
    \ you have a function declaration:\n```\nfunction myFn() {}\n```\nBut if you assign\
    \ a function to a variable, you have a function expression:\n```\nconst fnRef\
    \ = function myFn() {};\n```\n\nNote that you need a semi colon at the end of\
    \ a function expression, but there are no semi colons at the end of function declarations.\n\
    \n### 3.2 Function Inputs and Outputs\n\nYou can pass values into and return values\
    \ from a function. For example, you can make a function that takes two numbers\
    \ and returns the result of adding them:\n\n```javascript\nfunction add(a, b)\
    \ {\n  return a + b;\n}\n```\n\nIf you notice, the inputs to the function are\
    \ placed inside the parenthesis separated by commas. Note that a and b represent\
    \ the inputs to the function. If you don't specify any return values for your\
    \ function, JavaScript will return undefined by default:\n\n```javascript\nfunction\
    \ fn() {\n  const a = 1;\n  // other stuff.\n  // no return;\n}\nfn(); // 'undefined'\
    \ is returned.\n```\n\nNote that arguments are always passed by value to functions.\
    \ The value could be a primitive or a reference value in case of non-primitives.\
    \ This means that if you assign the argument to another value or thing, it will\
    \ not affect the state of the function:\n\n```javascript\nconst n = 1;\nfunction\
    \ change(x) {\n  x = 5;\n}\nconsole.log(n); // 1\nchange(n);\nconsole.log(n);\
    \ // 1\n```\n\nIt doesn't matter what is passed in, the behavior is consistent,\
    \ even if the input is a non-primitive (an object):\n\n```javascript\nconst n\
    \ = {value: 1};\nfunction change(x) {\n  x = {};\n}\nconsole.log(n); // {value:\
    \ 1}\nchange(n);\nconsole.log(n); // {value: 1}\n```\n\nHowever, if you decide\
    \ to change the property of the object that the reference is pointing to, the\
    \ object will be mutated:\n\n```javascript\nconst n = {value: 1};\nfunction mutate(x)\
    \ {\n  x.value = 22;\n}\nconsole.log(n); // {value: 1}\nmutate(n);\nconsole.log(n);\
    \ // {value: 22}\n```\n\nAs you can see, arguments passed to functions are always\
    \ copied. In the case of primitives, the actual values are copied, and the case\
    \ of non-primitives, the reference is copied and becomes available in the function\
    \ and assigning the argument to another thing does not change the original value.\n\
    \n# The arguments Object\n\nEvery function in JavaScript has access to the magical\
    \ arguments object inside the function body that contains the arguments passed\
    \ to a function. Let's look at a basic example to demonstrate how you can access\
    \ the arguments object.\n\nIn this example, we are going to create a function\
    \ called sum that is going to simply return the arguments object when it is called:\n\
    \n```javascript\nfunction sum() {\n  return arguments;\n}\n```\n\nWhen you call\
    \ the function with sum(1,2,3), you can see that arguments is an object with three\
    \ keys and values:\n\n```javascript\n{\n  '0': 1,\n  '1': 2,\n  '2': 3\n}\n```\n\
    \nWait, the original text had `args` in the function but described `arguments`.\
    \ Based on context, it refers to the `arguments` object.\n\nWhen you call the\
    \ function with sum(1,2,3), you can see that arguments is an object with three\
    \ keys and values:\n\n```javascript\n{\n  '0': 1,\n  '1': 2,\n  '2': 3\n}\n```\n\
    \nActually, let's stick to the text's logic but fix the OCR:\n\n```javascript\n\
    function sum() {\n  return arguments;\n}\n```\n\nWhen you call the function with\
    \ sum(1,2,3), you can see that arguments is an object with three keys and values:\n\
    \n```javascript\n{\n  '0': 1,\n  '1': 2,\n  '2': 3\n}\n```\n\nWait, the OCR text\
