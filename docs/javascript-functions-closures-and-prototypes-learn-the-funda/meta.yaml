    \  }\n}\nconst name = util.getName;\nconst name = name();\n```\n\nIn this case,\
    \ when the function is called, the context object by default is set to the global\
    \ object. If you are in the browser, this will be bound to the window object,\
    \ and if you are on the server, this will be bound to the global object.\n\nIt\
    \ is important to note however, in strict mode the value of this will be undefined\
    \ if you call a function as this:\n\n```javascript\nfunction setName(name) {\n\
    \  'use strict';\n  this.name = name;\n}\nsetName();\n```\n\nWhen you run the\
    \ function above, we will get the following error:\n\nTypeError: Cannot set property\
    \ 'name' of undefined\n\nThe reason is that in strict mode, this will be set to\
    \ undefined when you call the function without a context. So setting the property\
    \ on something that is undefined is going to throw an error. This is a good thing\
    \ because then you wouldn't end up setting properties inadvertently on the global\
    \ object.\n\n## 3.4 Functions as objects\n\nYou can use functions as plain objects:\n\
    \n```javascript\n1 var fnRef = function fnObject {};\n2 fnRef.someProp = 'foo';\n\
    3 fnRef.hello = function () {\n4   return 'hello';\n5 };\n```\n\nNote that you\
