    \ 30\n\n# 1 前言\n\n毫无疑问，JavaScript 已成为当今最重要的编程语言之一。然而令人惊讶的是，许多人认为有系统地学习 JavaScript\
    \ 是没有必要的。这非常令人意外，即使在现在 2016 年，JavaScript 自 1995 年首次发布以来已经有了了巨大的进步。这种趋势在很多地方似乎很普遍，但事实并非如此。本书的目标之一是通过关注\
    \ JavaScript 的三个重要概念——即函数、闭包和原型——来为你指明正确的方向。希望在读完本书后，你对这些概念感到自如，并发现能够在自己的程序中有效地使用它们。此外，书中还有一个附录章节，列出了任何\
    \ JavaScript 或前端相关职位面试中经常被问到的问题。你可以利用该章节进行自我评估，并在必要时回顾相关章节。\n\n# 1.1 本书概述\n\n\
    在第 1 章中，我们将探索与函数相关的所有基础概念，包括函数对象、函数声明和表达式、`this` 关键字等。\n\n在第 2 章中，我们将学习什么是闭包、它们为什么有用以及如何在程序中使用它们。\n\
    \n在第 3 章中，我们将研究 JavaScript 中最重要的概念，即原型。我们将学习它们是什么、为什么它们让 JavaScript 与面向类的语言不同，以及你如何使用它们来简化程序设计。\n\
    \n# 1.2 如何阅读本书\n\n本书的每一章开头都有一个重要概念列表。每个要点将在章节中详细介绍。你可能会觉得这本书本质上很枯燥，因此很多人想在阅读时休息一下。虽然你可能会跳序阅读章节，或直接跳过，但请不要这样做。请花点时间慢慢学习每一章，如果你感到没有动力就休息一下。本书这样设计的目的是作为参考工具，以便你可以在未来随时查阅。此外，请记住，本书始终与语言的最新规范（目前为\
    \ ES2015）保持同步。我真心希望你能从书中收获，如果你有任何地方的地方、发现拼写错误或代码错误，请提交 issue。本书使用 Markdown 编写并托管在\
    \ github 上：https://github.com/aminmeyghani/js-fn-book\n\n编码愉快 :)\n\n# 1.3 要求\n\
    \n为了跟上本书的学习，你需要以下内容：\n\n- Google Chrome\n- Node > 5\n- 一个文本编辑器（推荐使用 Sublime Text，但不是必须）\n\
    \n下面你可以找到关于 Chrome DevTools 和安装 Node 的有用信息。由于我们将在书中一直使用它们，请花时间确保已准备好一切。\n\n# 使用\
    \ Chrome DevTools\n\n你可以在 Chrome DevTools 中运行 JavaScript 代码。你可以使用控制台或 snippets\
    \ 标签来创建 JavaScript 代码片段。要使用控制台，打开 Chrome，在页面上点击右键并选择“检查”。这样做之后，DevTools 就会打开。DevTools\
    \ 打开后，点击 Console 标签打开控制台，你可以逐行运行 JavaScript 代码。下面的截图演示了如何找到 Console 标签：\n\n# 使用控制台\n\
    \n# 前言\n\n除了控制台，你还可以使用 snippets 标签来创建代码片段并执行它们。要创建新的片段，点击 Snippet 标签，然后在空白区域点击右键创建新片段。下面的截图向你展示如何创建新片段：\n\
    \n# 创建片段\n\n创建片段后，你可以编写一些代码并通过点击 DevTools 右侧的运行按钮或使用 `command + enter` 快捷键来执行它。下面的截图演示了如何运行片段：\n"
