  md: "# Prototypes 24\n\n```\nfunction Person () {\nPerson.prototype.walk = function\
    \ () {\n  return 'walking...';\n}\n\nfunction Worker() {\n  Worker.prototype =\
    \ Object.create(Person.prototype);\n  Worker.prototype.walk = function () {\n\
    \    return 'working...';\n  }\n}\n\nfunction Developer () {\nDeveloper.prototype\
    \ = Object.create(Worker.prototype);\nDeveloper.prototype.code = function () {\n\
    \  return 'coding...';\n}\n}\n```\n\n```\nvar dev = new Developer();\ndev.code();\
    \ // 'coding ...'\ndev.work(); // 'working ...'\ndev.walk(); // 'walking ...'\n\
    ```\n\nAlso note that you can just simply link objects together, and it would\
    \ have the same effect:\n\n```\nvar person = {\nwalk() { return 'walking...';\
    \ };\n}\n\nvar worker = Object.create(person);\nworker.work = function () {\n\
    \  return 'working';\n}\n\nvar dev = Object.create(worker);\ndev.code = function\
    \ () {\n  return 'coding...';\n}\n\ndev.code(); // 'coding ...'\ndev.work(); //\
    \ 'working ...'\ndev.walk(); // 'walking ...'\n```"
