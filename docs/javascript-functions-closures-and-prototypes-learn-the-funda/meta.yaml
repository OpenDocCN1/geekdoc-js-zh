    \n# 5.4 Functional Mixins Over Classical Inheritance\n\nThe core idea behind mixins\
    \ is that you can augment an existing entity with another. Now this entity can\
    \ be anything, a plain object, a function, or a prototype object. You can either\
    \ mixin with each other or mixin an object with functions. In this section we\
    \ are going to focus on functional mixins since they are very flexible and convenient\
    \ when working with JavaScript. In addition, functional mixins are very different\
    \ than classical inheritance and introduce a different way of thinking.\n\nThe\
    \ idea behind functional mixins is very simple: you define a bunch of functionalities,\
    \ and you specify the context to which these functions apply. Let's look at a\
    \ very simple example:\n\n> ¹https://github.com/stampit-org/stampit\n\n# Prototypes\n\
    \n```javascript\n/*\n * Define functionalities\n * Grouped by `fns` here.\n */\n\
    function fns() {\n  this.getName = function() {\n    return this.name;\n  }\n\
    }\n\n/* Define Type */\nfunction Person(name) {\n  if (!(this instanceof Person))\
    \ {\n    return new Person(name);\n  }\n  this.name = name;\n}\n\n/* Apply the\
    \ functionalities to the\n prototype object of Person */\nfns.call(Person.prototype);\n\
    \n/* make an instance of Person */\nconst person = new Person('Amin');\n\n/* call\
    \ methods */\nperson.getName() //-> 'Amin'\n```\n\nIn the above, we create a function\
    \ that contains the functionalities of a type. Then we define the type and finally\
    \ apply the functionalities to the type by calling the fns function in the context\
    \ of the type's prototype object. That's all it takes to add functionalities to\
    \ the type. The interesting thing to note here is that you can create more functions\
    \ and group other pieces of functionalities and then apply it to the type. In\
    \ order to demonstrate that, let's redo the example in the previous section with\
    \ functional mixins.\n\nIf you remember from the previous section, we created\
    \ the Developer type that had the functionalities of a Person, Worker, and Developer.\
    \ So, let's define the functionalities for each of these first:\n\n```javascript\n\
    /* Define Person's functionalities */\nfunction personFns() {\n  this.walk = function\
    \ () {\n    return 'Walking...';\n  };\n\n  this.getName = function () {\n   \
    \ return this.name;\n  };\n}\n```\n\n```javascript\n/* Define Worker's functionalities\
    \ */\nfunction workerFns() {\n  this.work = function () {\n    return 'Working...';\n\
    \  }\n}\n```\n\n```javascript\n/* Define Developer's functionalities */\nfunction\
    \ developerFns() {\n  this.code = function () {\n    return 'Coding...';\n  }\n\
    }\n```\n\nNow we have defined the groups of functionalities, then we need to define\
    \ the Developer type:\n\n```javascript\n/* Define the Developer type */\nfunction\
    \ Developer(name) {\n  if (!(this instanceof Developer)) {\n    return new Developer(name);\n\
    \  }\n  this.name = name;\n  this.toString = function () {\n    return this.name;\n\
    \  }\n}\n```\n\nAfter that, we need to apply each functionalities to the Developer’s\
    \ prototype:\n\n```javascript\n/* apply each functionalities to\nDeveloper's prototype\
    \ */\n[personFns, workerFns].forEach(fn => {\n  fn.call(Developer.prototype);\n\
    });\n```\n\nNow we can create an instance of the Developer and call any of the\
    \ methods:\n\n```javascript\n/* create an instance and call methods */\nconst\
    \ dev = Developer('Amin');\nconsole.log(dev.getName());\nconsole.log(dev.walk());\n\
    console.log(dev.work());\nconsole.log(dev.code());\nconsole.log('Dev.is: ' + dev);\n\
    ```\n\nAfter running the code above you should get the following output:\n\n```\n\
    Amin\nWalking ...\nWorking ...\nCoding ...\nDev is: Amin\n```\n\nAnd that's how\
    \ you can use functional mixins to augment a type. Also note that the context\
    \ object this, always refers to the created instance object. Now that we have\
    \ learned functional mixins, let's see how we can improve the performance by forming\
    \ a closure around the mixins to cache the result of the first definition call:\n\
    \n```javascript\nconst personFns = (function() {\n  function walk() { return 'Walking...'\
    \ };\n  function getName() { return this.name; }\n  return function() {\n    this.walk\
    \ = walk;\n    this.getName = getName;\n    return this;\n  }\n});\n\nconst workerFns\
    \ = (function() {\n  function work() { return 'working...' };\n  return function()\
    \ {\n    this.work = work;\n    return this;\n  }\n})();\n\nconst developerFns\
    \ = (function() {\n    function code() {return 'coding...'};\n    return function()\
    \ {\n        this.code = code;\n        return this;\n    }\n}());\n```\n\nAll\
    \ we did here was wrapping each function with a closure, the rest of the code\
    \ is the same. Now, the effect that this has on performance is noticeable because\
    \ when the outer function is called, the result is always cached because the inner\
    \ function references the outer function methods.\n\n# 6. Interview Questions"
  mdcn: "\n# 原型\n\n# 25\n\n区别在于我们只有一个 `Developer` 实例，并且我们没有一个函数来为我们创建更多 `Developer`\
    \ 实例。你可以将其封装在一个函数中，但 JavaScript 已经有一种机制，通过构造函数链接原型对象。\n\n另一个需要记住的重要点是 `new` 关键字。在几乎所有情况下，你希望隐藏它，而不是强迫你\
    \ API 的调用者使用 `new` 来创建实例：\n\n```javascript\nfunction Developer (name) {\n  if\
    \ (!(this instanceof Developer)) {\n    return new Developer(name);\n  }\n  this.name\
    \ = name;\n}\n```\n\n这样做，调用者就不需要使用 `new` 来调用构造函数，这样更整洁，同时也消除了将其绑定到全局对象的可能性。另一个需要注意的重要点是当使用\
    \ `new` 关键字调用函数时，它是如何绑定的。当使用 `new` 关键字调用构造函数时，上下文对象 `this` 始终指向实例。在上面的示例中，我们将传入的内容赋值给实例名称。实例将获得它们的名称，但它们将共享同一个原型，这使得可以高效地调用方法，而无需将方法复制到每个实例中。\n\
    \n这就是使用原型对象需要知道的全部内容了。然而，你应该意识到现在已经有很多优秀的库，例如 Stampit，它们比经典方法强大且灵活得多，并允许你做更多事情。在下一节中，我们将通过函数式混入（functional\
    \ mixins）探索继承的影响。\n\n# 5.4 函数式混入与经典继承\n\n混入（mixins）的核心思想是你可以用另一个实体增强现有的实体。现在这个实体可以是任何东西，一个普通对象、一个函数或原型对象。你可以让它们相互混合，也可以将一个对象与函数混合。在本节中，我们将关注函数式混入，因为它们在处理\
    \ JavaScript 时非常灵活且方便。此外，函数式混入与经典继承非常不同，引入了不同的思维方式。\n\n函数式混入背后的想法非常简单：你定义了一系列功能，并指定这些函数应用的上下文。让我们来看一个非常简单的示例：\n\
    \n> ¹https://github.com/stampit-org/stampit\n\n# 原型\n\n```javascript\n/*\n * 定义功能\n\
    \ * 在此处按 `fns` 分组。\n */\nfunction fns() {\n  this.getName = function() {\n   \
    \ return this.name;\n  }\n}\n\n/* 定义类型 */\nfunction Person(name) {\n  if (!(this\
    \ instanceof Person)) {\n    return new Person(name);\n  }\n  this.name = name;\n\
    }\n\n/* 将功能应用到 Person 的\n 原型对象 */\nfns.call(Person.prototype);\n\n/* 创建 Person\
    \ 的实例 */\nconst person = new Person('Amin');\n\n/* 调用方法 */\nperson.getName() //->\
    \ 'Amin'\n```\n\n在上面的代码中，我们创建了一个包含类型功能的函数。然后我们定义了该类型，最后通过在类型原型对象的范围内调用 `fns` 函数，将功能应用到该类型。这就是为类型添加功能的所有操作。这里值得注意的有趣点是，你可以创建更多函数并分组其他功能块，然后将其应用到该类型。为了演示这一点，让我们用函数式混入重做上一节的示例。\n\
    \n如果你还记得上一节的内容，我们创建了 `Developer` 类型，它拥有 `Person`、`Worker` 和 `Developer` 的功能。所以，让我们先定义这些每一个的功能：\n\
    \n```javascript\n/* 定义 Person 的功能 */\nfunction personFns() {\n  this.walk = function\
    \ () {\n    return 'Walking...';\n  };\n\n  this.getName = function () {\n   \
    \ return this.name;\n  };\n}\n```\n\n```javascript\n/* 定义 Worker 的功能 */\nfunction\
    \ workerFns() {\n  this.work = function () {\n    return 'Working...';\n  }\n\
    }\n```\n\n```javascript\n/* 定义 Developer 的功能 */\nfunction developerFns() {\n \
    \ this.code = function () {\n    return 'Coding...';\n  }\n}\n```\n\n现在我们已经定义了功能组，然后我们需要定义\
    \ `Developer` 类型：\n\n```javascript\n/* 定义 Developer 类型 */\nfunction Developer(name)\
    \ {\n  if (!(this instanceof Developer)) {\n    return new Developer(name);\n\
    \  }\n  this.name = name;\n  this.toString = function () {\n    return this.name;\n\
    \  }\n}\n```\n\n之后，我们需要将每项功能应用到 Developer 的原型上：\n\n```javascript\n/* 将每个功能应用到\n\
    \ Developer 的原型 */\n[personFns, workerFns].forEach(fn => {\n  fn.call(Developer.prototype);\n\
    });\n```\n\n现在我们可以创建一个 `Developer` 的实例并调用任何方法了：\n\n```javascript\n/* 创建实例并调用方法\
    \ */\nconst dev = Developer('Amin');\nconsole.log(dev.getName());\nconsole.log(dev.walk());\n\
    console.log(dev.work());\nconsole.log(dev.code());\nconsole.log('Dev.is: ' + dev);\n\
    ```\n\n运行上面的代码后，你应该得到以下输出：\n\n```\nAmin\nWalking ...\nWorking ...\nCoding ...\n\
    Dev is: Amin\n```\n\n这就是你如何使用函数式混入来增强类型的方法。还要注意，上下文对象 `this` 始终指向创建的实例对象。现在我们已经学习了函数式混入，让我们看看如何通过在混入周围形成闭包来提高性能，从而缓存第一次定义调用的结果：\n\
    \n```javascript\nconst personFns = (function() {\n  function walk() { return 'Walking...'\
    \ };\n  function getName() { return this.name; }\n  return function() {\n    this.walk\
    \ = walk;\n    this.getName = getName;\n    return this;\n  }\n});\n\nconst workerFns\
    \ = (function() {\n  function work() { return 'working...' };\n  return function()\
    \ {\n    this.work = work;\n    return this;\n  }\n})();\n\nconst developerFns\
    \ = (function() {\n    function code() {return 'coding...'};\n    return function()\
    \ {\n        this.code = code;\n        return this;\n    }\n}());\n```\n\n我们在这里所做的是将每个函数封装在闭包中，其余代码相同。现在，这种方法对性能的影响是明显的，因为当外部函数被调用时，由于内部函数引用了外部函数的方法，结果总是被缓存的。\n\
    \n# 6. 面试题\n"
