  md: "# Prototypes\n\n# 25\n\nThe difference is that we only have one instance of\
    \ the developer and we don't have a function to create more instances of a Developer\
    \ for us. You could wrap this in a function, but JavaScript already has a mechanism\
    \ and is linking prototype objects using constructor functions.\n\nAnother important\
    \ thing to remember is the new keyword. In almost all cases, you want to hide\
    \ away and not force the consumers of your API to use new to create instances:\n\
    \n```\nfunction Developer (name) {\n  if (!(this instanceof Developer)) {\n  \
    \  return new Developer(name);\n  }\n  this.name = name;\n}\n```\n\nBy doing this,\
    \ consumers won't have to call the constructor with new which is cleaner and also\
    \ eliminates the possibility of this to be bound to the global object. The other\
    \ important thing to note is how this is bound when the function is invoked with\
    \ the new keyword. When the constructor is invoked with the new keyword, the context\
    \ object, this always refers to the instance. In the example above, we assign\
    \ the name of the instance to what is passed. Instance will get their names but\
    \ they will all share the same prototype that enables efficiently call methods\
    \ without the need of copying methods to each instance.\n\nThat's pretty much\
    \ all you need to know in able to use prototype objects. However, you should be\
    \ aware of great libraries out, such as Stampit that are much more powerful and\
    \ flexible than the classical approach and allow you to do much more. In the next\
    \ section we will explore the effect of inheritance through functional mixins.\n\
    \n# 5.4 Functional Mixins Over Classical Inheritance\n\nThe core idea behind mixins\
    \ is that you can augment an existing entity with another. Now this entity can\
    \ be anything, a plain object, a function, or a prototype object. You can either\
    \ mixin with each other or mixin an object with functions. In this section we\
    \ are going to focus on functional mixins since they are very flexible and convenient\
    \ when working with JavaScript. In addition, functional mixins are very different\
    \ than classical inheritance and introduce a different way of thinking.\n\nThe\
    \ idea behind functional mixins is very simple: you define a bunch of functionalities,\
    \ and you specify the context to which these functions apply. Let's look at a\
    \ very simple example:\n\n> ¹https://github.com/stampit-org/stampit"
  merge: -1
  pgno: 27
- img_proc: true
  md: "# Prototypes\n\n```\n/*\n * Define functionalities\n * Grouped by `fns` here.\n\
    \ */\nfunction fns() {\n  this.getName = function() {\n    return this.name;\n\
    \  }\n}\n\n/* Define Type */\nfunction Person(name) {\n  if ((this instanceof\
    \ Person)) {\n    return new Person(name);\n  }\n  this.name = name;\n}\n\n/*\
    \ Apply the functionalities to the\n prototype object of Person */\nfns.call(Person.prototype);\n\
    \n/* make an instance of Person */\nconst person = new Person('Amin');\n\n/* call\
    \ methods */\nperson.getName() //-> 'Amin'\n```\n\nIn the above, we create a function\
    \ that contains the functionalities of a type. Then we define the type and finally\
    \ apply the functionalities to the type by calling the fns function in the context\
    \ of the type's prototype object. That's all it takes to add functionalities to\
    \ the type. The interesting thing to note here is that you can create more functions\
    \ and group other pieces of functionalities and then apply it to the type. In\
    \ order to demonstrate that, let's redo the example in the previous section with\
    \ functional mixins.\n\nIf you remember from the previous section, we created\
    \ the Developer type that had the functionalities of a Person, Worker, and Developer.\
    \ So, let's define the functionalities for each of these first:"
