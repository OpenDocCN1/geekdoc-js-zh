    ```javascript\n<Image source={require(\"./puppies.png\")} />\n```\n\nThe image\
    \ path is resolved exactly as JavaScript modules are resolved. So, in the preceding\
    \ example, puppies.png should be provided in the same folder as the component\
    \ that requires it.\n\nThere's some filename magic going on here, too. If you\
    \ provide puppies.ios.png and puppies.android.png, the appropriate file will be\
