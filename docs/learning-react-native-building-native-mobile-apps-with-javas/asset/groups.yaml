    \  .catch(errorCallback);\n```\n\nExample A-16. Chaining promises together is\
    \ simpler. This keeps our code cleaner and also means that we don't need to reimplement\
    \ callbacks each time we write a function.\n\n# APPENDIX B\n\n## Deploying Your\
    \ Application\n\nOnce you have built your awesome application, you'll want to\
    \ get it into the hands of your users. The process for building and deploying\
    \ your application varies by platform, and both Google and Apple update the specific\
    \ steps. However, the basic process remains the same:\n\n- Triple-check your assets:\
    \ application icon, launch screen, and so on.\n- Specify OS versions and devices.\n\
    - Create a release build.\n- Get your paperwork in order.\n- Create App Store\
    \ and Play Store listing, including promotional screenshots.\n- Send the app to\
    \ beta testers and solicit feedback.\n- Submit for review.\n- Release!\n\n## Check\
    \ Your Application Assets and Specify Target Versions and Devices\n\nIt's easy\
    \ to overlook these steps during development. You'll want to make sure that you\
    \ have a suitable icon and launch screen for your application in the correct sizes\
    \ and resolutions for all the devices you intend to target. Similarly, for any\
    \ images, video, or other assets utilized by your application, make sure you have\
    \ included versions appropriate to each device.\n\n## Create a Release Build\n\
    \nYou will need to compile your application into a production-ready build before\
    \ shipping it off to your end users. This version of your application won't have\
    \ debugging enabled and will include bundled JavaScript instead of relying on\
    \ packer. For both iOS and Android, the official React Native documentation includes\
    \ guidance on creating production-ready builds.\n\n## Complete Your Paperwork\n\
    \nIn order to distribute your application to devices, you'll probably want to\
    \ register with Google Play. Similarly, you'll need to register for an Apple Developer\
    \ account in order to submit to the App Store. As part of this process, you will\
    \ need to provide some standard information such as contact and payment information.\n\
    \n## Beta Test Your Application\n\nYou'll want to test your application on a variety\
    \ of devices and operating system versions. How does it perform in landscape versus\
    \ portrait mode? With low battery? With a slow network? What happens when you\
    \ get interrupted by push notifications?\n\nGetting your application into the\
    \ hands of real users is the best way to evaluate how your application performs\
    \ in real-world scenarios. Both the Play Store and the App Store have built-in\
    \ programs to facilitate distribution of your application to beta testers.\n\n\
    ## Create a Listing\n\nYou'll need to convince people to download your application!\
    \ Gather your promotional screenshots, select the appropriate category, and write\
    \ a compelling description. Once that's done, you can submit your application\
    \ for review.\n\n## Wait for Review\n\nAs web developers, we're used to having\
    \ more control over our deploy processes. You may be accustomed to shipping code\
    \ to production many times in a single day, where versions are usually a nonissue.\
    \ With the iOS App Store and Google Play Store, deployment is more complicated,\
    \ and new version releases typically require review. Review times vary from a\
    \ day to a couple of weeks. Thus it's important to take the submission and review\
    \ process into account during your planning phase.\n\n## Release\n\nAfter putting\
    \ in the hard work to create your application, seeing it go live (Figure B-1)\
    \ can feel exhilarating. However, releasing your application to users is just\
    \ the beginning, and you'll have to support your application post-release. Unlike\
    \ the web, where you can deploy easily and often, new mobile versions take time\
    \ and have a longer lifespan. Many iOS and Android users have no auto-updating\
    \ enabled, so every version counts. And at minimum you'll need to wait for application\
    \ review each time you wish to submit an update or bug fix. (For truly critical\
    \ bug fixes, you must request an expedited review, but use these carefully.)\n\
    \n![](img/1a32334c3c38f46e3c4219c7d228280e_231_0.png)\n\nFigure B-1. The flashcard\
    \ application, live on the Play Store\n\nAnd, finally: congratulations on shipping\
    \ your app!\n\n# Working with Expo Applications\n\nExpo is a tool that allows\
    \ you to write React Native apps without using Xcode or Android Studio. Projects\
    \ created with the Create React Native App tool are Expo projects. Expo makes\
    \ it very easy to develop on your physical device and removes many of the initial\
    \ roadblocks to getting started with React Native. Thus it's a great choice while\
    \ you're learning to develop using React Native.\n\nYou can read more about Expo\
    \ and install the Expo mobile app at expo.io.\n\n# Ejecting from Expo\n\nAny project\
    \ that relies on custom native code (either your own, or third-party modules that\
    \ instruct you to run react-native link to install them) will not work with Expo.\
    \ Expo provides a way to \"eject\" from Expo into a traditional, full React Native\
    \ project. Ejecting will create a full React Native project from your existing\
    \ Expo application. This is a one-way migration, so you won't be able to go back\
    \ to Expo-wards.\n\nYou will also need to eject from Expo if you want more control\
    \ over building and publishing your application for the iOS App Store or Google\
    \ Play Store. More information is available in the Create React Native App documentation.\n"
