    # # Summary


    In this chapter, we made some modifications to the weather application. We looked
    at the Geolocation, CameraRoll, and AsyncStorage APIs, and learned how to incorporate
    these modules into our applications.


    When React Native ships with support for a host platform API, it makes usage a
    breeze. But what happens if React Native does not yet support a given API, such
    as in the case of video playback, and you want to use a library or module that
    isn''t yet available in JavaScript? In the next chapter, we''ll take a closer
    look at this scenario.'
  - '[PAGE 127]


    # CHAPTER 7


    # Modules and Native Code


    # Project with Native Code Required


    The examples in this section apply only to projects created with react-native-init
    and ejected projects created with create-react-native-app. For more information,
    see Appendix C.


    In Chapter 6, we looked at some of the APIs that Native exposes for interacting
    with the host platform. Because support for those APIs is built into React Native,
    they''re quite easy to use. What happens when we want to use an API that isn''t
    supported by React Native?


    In this chapter, we''ll look at how to install modules written by members of the
    React community using npm. We''ll also take a closer look at one such module,
    react-native-video, and learn how the RCTBridgeModule allow you to add JavaScript
    interfaces to existing Objective-C APIs. We''ll also look at importing Java-Script
    libraries into your project, and how to manage dependencies.


    Though we will be looking at some Objective-C and Java code this chapter, don''t
    be alarmed! We''ll be taking it slowly. A full introduction to mobile development
    for iOS and Android is beyond the scope of this book, but we''ll walk through
    some examples together.


    # Installing JavaScript Libraries with npm


    Before we discuss how modules work, we should first cover how to install external
    dependencies in general. React Native uses npm to manage dependencies. npm is
    the package manager for Node.js, but the npm registry includes packages for all
    sorts of JavaScript projects, not just Node. npm uses a package.json to store
    metadata about your project, including the list of dependencies.'
