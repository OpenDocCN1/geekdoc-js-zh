    \ behaves differently from Android, which behaves yet again from Windows Phone.\n\
    \nReact Native provides a number of APIs for you to leverage as you build touch-ready\
    \ interfaces. In this section, we'll look at the <Button> component and the <TouchableOpacity>\
    \ container component, as well as lower-level APIs that give you direct access\
    \ to touch events.\n\n## Creating Basic Interactions with <Button>\n\nIf you're\
