    \ you will need to register with the XHR request.\n\n# Storing Persistent Data\
    \ with AsyncStorage\n\nApplications will need to keep track of some variety of\
    \ data persistently. How do you accomplish this with React Native?\n\nReact Native\
    \ provides us with AsyncStorage, a key-value store that is global to your application.\
    \ If you have used LocalStorage on the web, AsyncStorage would feel quite similar.\
    \ Its implementation varies by platform, but the JavaScript API is the same regardless\
    \ of whether you are using Android or iOS.\n\nLet's take a look at how to use\
    \ the React Native module.\n\nThe storage key by AsyncStorage can be any string;\
    \ it's customary to use the format @AppNative:key, like so:\n\n```\nconst STORAGE_KEY\
    \ = '@SmarterWeather:zip';\n```\n\nThe AsyncStorage module returns a response\
    \ to both getItem and setState. For the SmarterWeather app, let's store the zip\
    \ code in componentDid Mount:\n\n```\nAsyncStorage.getItem(STORAGE_KEY)\n.then((value)\
    \ => {\n  if (value !== null) {\n    this._getForecastForZip(value);\n  }\n})\n\
    .catch((error) => console.log('AsyncStorage error: ' + error.message))\n.done();\n\
    ```\n\nThen, in _getForecastForZip, we store the zip code value:\n\n```\nAsyncStorage.setItem(STORAGE_KEY,\
    \ zip)\n.then(() => console.log('Saved selection to disk: ' + zip))\n.catch((error)\
    \ => console.log('AsyncStorage error: ' + error.message))\n.done();\n```"
