    # Navigation and Structure in Larger Applications


    Now that we''ve covered many of the pieces you need to build your own React Native
    applications, let''s put everything together. Up until now, we''ve dealt with
    small examples. In this chapter, we''ll look at the structure of a larger application.
    We''ll cover how to use the <StackNavigation> component from react-navigation
    to handle transitions between different screens in an application.


    The example from this chapter will also be used in Chapter 11, where we''ll look
    at how to integrate the state management library Redux into our application.


    # The Flashcard Application


    In this chapter, we''re going to be building a flashcard application that allows
    users to create decks of cards and review them. The flashcard application is more
    complex than the sample applications we''ve built so far. It''s meant to model
    what a more fleshed-out application might look like. All the code is available
    on GitHub. This application is entirely JavaScript-based and cross-platform:meaning
    it will work on iOS or Android, and is compatible with Expo (meaning you can use
    the Create Native App).


    As illustrated in Figure 10-1, the Flashcard app has three main views:


    +   * The home page, which lists available decks and allows you to create new
    decks

    * The card creation screen

    * The review screen'
  - '[PAGE 178]


    ![](img/1a32334c3c38f46e3c4219c7d228280e_178_0.png)


    Figure 10-1. Viewing decks, card creation, and card review


    Users of the app go through two main interaction flows. The first deals with content
    creation (i.e., the creation of decks as well as cards). The content creation
    process works as follows (illustrated in Figure 10-2):


    +   1. The user taps Create Deck.

    2. The user enters a deck name, then either taps the Return button or Create Deck
    again.

    3. The user enters values for Front and Back, and then taps Create Card.

    4. After entering zero or more cards, the user may tap Done, bringing him or her
    back to the original screen. Alternatively, the user may tap Review Deck and begin
    reviewing.


    The user may also initiate card creation at a later date by tapping the + buttons
    on the home screen.'
  - '[PAGE 179]


    ![](img/1a32334c3c38f46e3c4219c7d228280e_179_0.png)


    The second main interaction flow deals with card review (illustrated in Figure
    10-3):


    +   1. The user taps the deck''s name that he/she wishes to review.

    2. The user is presented with the question screen.

    3. The user taps one of the provided options.

    4. The user receives feedback based on whether the guess was correct.

    5. To view the next review, the user reaches the "Reviews cleared!" screen.

    6. Once all reviews are completed, the user reaches the "Reviews cleared!" screen.


