    TOM CLANCY: POINT OF CONTACT


    # Hardcover NonFiction


    Michael Connelly

    THE LATE SHOW


    Figure 4-9. Viewing current best sellers, with <SectionList>


    ## Navigation


    Navigation in the context of mobile apps refers, roughly, the code that allows
    users to transition from one screen to another. On the web, this is part of the
    history API, which provides concepts such as "backward" and "forward."


    Common used components for navigation in React Native include the built-in <Navigator>
    and <Navigator> components, as well as community solutions like <StackNavigator>
    (provided by the react-navigation library).


    Navigation logic is necessary in order to move between screens in your mobile
    application. It also enables "deep linking," so that users can jump from a URL
    into a particular screen within your app.


    We''ll cover navigation in depth in Chapter 10.


    ## Other Organizational Components


    There are plenty of other organizational components, too. A few useful ones include
    <TabBarIOS> and <SegmentedControl> (illustrated in Figure 4-10) and <DrawerLayoutAndroid>
    and <ToolbarAndroid> (illustrated in Figure 4-11).


    You''ll notice that these are all named with platform-specific suffixes. That''s
    because they wrap their native APIs for platform-specific UI elements.


    Figure 4-10. An iOS segmented control (top) and an iOS tab bar (bottom)


    Figure 4-11. An Android toolbar (left) and an Android drawer (right)


    These components are very useful for organizing multiple screens within your application.
    <TabBarIOS> and <DrawerLayoutAndroid>, for example, give you an easy way to switch
    between multiple modes or functions. <SegmentedControlIOS> and <ToolbarAndroid>
    are better suited for more fine-grained controls.


    You''ll want to refer to the platform-specific design guidelines for how best
    to use these components:


    - Android Design Guide

    - iOS Human Interface Guidelines


    We''ll cover how to use platform-specific components in more depth in Chapter
    7.


    ## Summary


    In this chapter, we dug into the specifics of a variety of the most important
    components in React Native. We discussed how to use basic low-level components,
    like <Text> and <Image>, as well as more abstract components like <FlatList>,
    <SectionList>, and <TabBarIOS>. We also looked at how to use various touch-focused
    APIs and components in case you want to build your own custom touch handlers.


    At this point, you should be equipped to build basic functional applications using
    React Native! Now that you''ve acquainted yourself with the components discussed
    in this chapter, building upon them and combining them to create your own applications
    should feel remarkably similar to working with React on the web.


    Of course, building up basic functioning applications is only part of the battle.
    In the next chapter, we''ll focus on styling and how to use React Native''s implementation
    of styles to get the look and feel you want on mobile.


    ## CHAPTER 5

    ### Styles


    It''s great to be able to build functional applications, but if you can''t style
    them effectively, you won''t get very far! In Chapter 3, we built a simple weather
    application with some basic styles. While this gave us an overview of how to style
    React Native components, we skipped over many of the details. In this chapter,
    we will take a closer look at how styles work in React Native. We''ll cover how
    to create and manage your stylesheets, as well as the details of React Native''s
    implementation of CSS rules. By the end of this chapter, you should feel comfortable
    creating and styling your React Native components and applications.


    If you want to share styles between your React Native and web applications, the
    React Style project on GitHub provides a version of React Native''s style system
    for the web.


    ## Declaring and Manipulating Styles


    When working with React for the web, we typically use separate stylesheet files,
    which may be written in CSS, SASS or LESS. React Native takes a radically different
    approach, bringing styles entirely into the world of JavaScript and forcing you
    to link style objects explicitly to components. This approach tends to provoke
    reactions, as it represents a significant departure from CSS-based styling norms.


    To understand the design of React Native''s styles, we first need to consider
    some of the headaches associated with traditional CSS stylesheets.¹ CSS has a
    number of problems. All CSS rules and class names are global in scope, meaning
    that styling one component can easily break another if you''re not careful. For
    instance, if you include the popular Twitter Bootstrap library, you will introduce
    over 600 new global variables.


    ## Using Inline Styles


    Inline styles are the simplest way, syntactically, to style a component. As you
    can see in Example 5-1, the syntax for inline styles in React Native is the same
    as for the browser. Inline styles have some advantages. They''re quick and dirty,
    allowing you to rapidly experiment.


    However, you should avoid them in general because they''re less efficient. Inline
    style objects must be recreated during each render pass. Even when you need to
    modify styles in response to props or state, you don''t need to use inline styles,
    as we''ll see in a moment.


    ## Styling with Objects


    If you take a look at the inline style syntax, you will see that it''s simply
    passing an object to the style attribute. There''s no need to create the style
    object in the render method, though. Instead, you can separate it out, as shown
    in Example 5-2.


    ## Using StyleSheet.create


    You will notice that almost all of the React Native code makes use of StyleSheet.
    This function is a small piece of syntactic sugar with some added perks.


    Creating StyleSheets rather than passing raw JavaScript objects can reduce the
    number of allocations (thus benefiting performance); it also encourages you to
    organize your code more cleanly. These StyleSheets are immutable, which is usually
    helpful.


    Using StyleSheet.create is strictly optional, but in general you''ll want to use
    it.

