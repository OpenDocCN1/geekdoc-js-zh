    \ @2x and @3x, the React Native packager will select the appropriate image for\
    \ the device's screen density.\n\nIt is also possible to include web-based image\
    \ sources instead of bundling your assets with your application. For example:\n\
    \n```javascript\n<Image source={{uri: \"https://facebook.github.io/react/img/logo_og.png\"\
    }} style={{width: 400, height: 400}} />\n```\n\nWhen utilizing network resources,\
    \ you will need to specify dimensions manually.\n\nDownloading images via the\
    \ network rather than including them as assets has many advantages. During development,\
    \ for instance, it may be easier to use this approach while prototyping rather\
    \ than carefully importing all of your assets ahead of time. It also reduces the\
