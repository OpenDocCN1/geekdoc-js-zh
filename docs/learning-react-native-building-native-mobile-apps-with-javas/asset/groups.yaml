    \ add a simple overlay when pressed. The <TouchableHighlight> component also gives\
    \ you hooks for events such as onPress, onPressOut, onLongPress and like, so you\
    \ can use these events in your React applications.\n\nExample 4-3 shows how you\
    \ can wrap a component in a <TouchableHighlight> in order to give the user feedback.\n\
    \nExample 4-3. Using the <TouchableHighlight> component\n\n```javascript\n<TouchableHighlight\n\
    \  PressIn={this._onPressIn}\n  PressOut={this._onPressOut}\n  accessibilityLabel={'PUSH\
    \ ME'}\n  style={styles.touchable}>\n  <View style={styles.button}>\n    <Text\
    \ style={styles.welcome}>\n      {this.state.pressing ? \"EEK!\" : \"PUSH ME\"\
    }\n    </Text>\n  </View>\n</TouchableHighlight>\n```\n\nWhen the user taps the\
