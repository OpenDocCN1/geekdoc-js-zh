  - '[PAGE 136]


    This time, instead of subclassing NSObject RCTVideo subclasses UIView. That makes
    sense because it''s rendering a view component.


    If we look at the implementation file, RCTVideo.m, there''s a lot going on. On
    the top are instance variables, keeping track of things like volume, playback
    rate, and the AVPlayer itself:


    ```

    (AVPlayerViewController*)

    createViewController:(AVPlayer*)player

    withPlayerItem:(AVPlayerItem*)playerItem

    {

    RCTVideoViewController* playerLayer =

    [RCTVideoViewController alloc] init];

    playerLayer.showsPlaybackControls = NO;

    playerLayer.rctDelegate = self;

    playerLayer.view.frame = self.bounds;

    playerLayer.player = _player;

    playerLayer.view.frame = self.bounds;

    return playerLayer;

    }

    ```


    There are also various methods for things like calculating the duration of the
    video, loading in the video and setting it as the source, and more. Free to step
    through these methods and figure out what role they play.


    The other piece of the puzzle is the RCTManager. To create a native UI component,
    opposed to just a module, we also need a view manager. As the name implies, while
    the view actually handles rendering logic and similar tasks, the view manager
    deals with other stuff (event handling, property exports, etc.). At a minimum,
    the view manager class needs to:


    +   - RCTViewManager

    - Use the RCT_EXPORT_MODULE() macro

    - Implement the ((UIView*)view method


    The view method returns a UIView instance. In this case, we can see that it initializes
    and returns an RCTVideo:


    ```

    (UIView*)view

    {

    return [[RCTVideo alloc]

    initWithEventDispatcher:self.bridge.eventDispatcher];

    }

    ```


    The RCTManager also exports a number of properties and constants:


    ```

    #import "RCTVideoManager.h"

    #import "RCTVideo.h"

    #import <React/RCTBridge.h>

    ```'
