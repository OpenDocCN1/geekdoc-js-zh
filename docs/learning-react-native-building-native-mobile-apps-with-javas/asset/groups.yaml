    \  @\"ScaleAspectFit\": AVLayerVideoGravityResizeAspect,\n  @\"ScaleAspectFill\"\
    : AVLayerVideoGravityResizeFill\n}\n@end\n```\n\nRCTVideo 和 RCTVideoManager 共同组\
    \ RCTVideo 原生组件，我们可以从应用程序中自由使用它们。你可以看到，使用 iOS SDK 的原生模块是一项艰巨的任务，但并非不可逾越。这绝对是一个\
    \ iOS 开发经验将大有用场的地方。关于 iOS 开发的完整说明超出了本书的范围，但通过观察别人的原生模块——即使你没有 Objective-C 经验——你也应该能够开始尝试自己的原生模块开发。\n\
    \n# Java 原生模块\n\nAndroid 的原生模块行为与 iOS 的原生模块类似。你可以在文档中找到更多关于 Android 原生模块的信息。与\
