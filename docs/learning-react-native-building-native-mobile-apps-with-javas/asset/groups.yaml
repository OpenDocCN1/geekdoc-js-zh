- md: "\n# Summary\n\nIn general, debugging with React Native should feel quite similar\
    \ to debugging React code on the web. Most of the tools you are already familiar\
    \ with are available here, too, which makes the transition to React Native much\
    \ easier. That being said, React Native applications bring their own variety of\
    \ complexity, and sometimes that complexity can manifest in frustrating bugs.\
    \ Knowing how to debug your applications and becoming familiar with the error\
    \ messages produced by your environment will go a long way in helping you to cultivate\
    \ a productive workflow.\n\n# Navigation and Structure in Larger Applications\n\
    \nNow that we've covered many of the pieces you need to build your own React Native\
    \ applications, let's put everything together. Up until now, we've dealt with\
    \ small examples. In this chapter, we'll look at the structure of a larger application.\
    \ We'll cover how to use the <StackNavigation> component from react-navigation\
    \ to handle transitions between different screens in an application.\n\nThe example\
    \ from this chapter will also be used in Chapter 11, where we'll look at how to\
    \ integrate the state management library Redux into our application.\n\n# The\
    \ Flashcard Application\n\nIn this chapter, we're going to be building a flashcard\
    \ application that allows users to create decks of cards and review them. The\
    \ flashcard application is more complex than the sample applications we've built\
    \ so far. It's meant to model what a more fleshed-out application might look like.\
    \ All the code is available on GitHub. This application is entirely JavaScript-based\
    \ and cross-platform: meaning it will work on iOS or Android, and is compatible\
    \ with Expo (meaning you can use the Create Native App).\n\nAs illustrated in\
    \ Figure 10-1, the Flashcard app has three main views:\n\n- The home page, which\
    \ lists available decks and allows you to create new decks\n- The card creation\
    \ screen\n- The review screen\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_178_0.png)\n\
    \nFigure 10-1. Viewing decks, card creation, and card review\n\nUsers of the app\
    \ go through two main interaction flows. The first deals with content creation\
    \ (i.e., the creation of decks as well as cards). The content creation process\
    \ works as follows (illustrated in Figure 10-2):\n\n1. The user taps Create Deck.\n\
    2. The user enters a deck name, then either taps the Return button or Create Deck\
    \ again.\n3. The user enters values for Front and Back, and then taps Create Card.\n\
    4. After entering zero or more cards, the user may tap Done, bringing him or her\
    \ back to the original screen. Alternatively, the user may tap Review Deck and\
    \ begin reviewing.\n\nThe user may also initiate card creation at a later date\
    \ by tapping the + buttons on the home screen.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_179_0.png)\n\
    \nThe second main interaction flow deals with card review (illustrated in Figure\
    \ 10-3):\n\n1. The user taps the deck's name that he/she wishes to review.\n2.\
    \ The user is presented with the question screen.\n3. The user taps one of the\
    \ provided options.\n4. The user receives feedback based on whether the guess\
    \ was correct.\n5. To view the next review, the user reaches the \"Reviews cleared!\"\
    \ screen.\n6. Once all reviews are completed, the user reaches the \"Reviews cleared!\"\
    \ screen.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_179_1.png)\n\nWe'll be using\
    \ the flashcard app, and in particular the features just described, to talk through\
    \ some of the patterns and problems that emerge when building a more complete\
    \ application.\n\n# Project Structure\n\nHere's the structure of the flashcard\
    \ application:\n\n```\nflashcards\n  ├── icon.png\n  ├── index.js\n  └── src_checkpoint_01\n\
    \    ├── components\n      │   ├── Button.js\n      │   ├── DeckScreen\n     \
    \ │   ├── Flashcards.js\n      │   ├── Header\n      │   ├── HeadingText.js\n\
    \      │   ├── Input.js\n      │   ├── LabeledInput.js\n      │   ├── NewCardScreen\n\
    \      │   ├── NormalText.js\n      │   └── ReviewScreen\n    ├── data\n     \
    \ │   ├── Card.js\n      │   ├── Deck.js\n      │   ├── Mocks.js\n      │   └──\
    \ QuizCardView.js\n      └── styles\n          │   ├── colors.js\n          │\
    \   └── fonts.js\n  ├── src_checkpoint_02\n  │   └── ...\n  ├── src_checkpoint_03\n\
    \  │   └── ...\n  └── src_checkpoint_04\n      └── ...\n```\n\nYou'll notice that\
    \ within the flashcards directory, there are actually four folders: src_checkpoint_01,\
    \ src_checkpoint_02, src_checkpoint_03, and src_checkpoint_04. These each represent\
    \ the state of the application as we work through the development process. We're\
    \ going to begin with _src_checkpoint_01.\n\ncomponents/\nAll of our React components\
    \ live here.\n\ndata/\nThis is where you'll find our data models, representing\
    \ cards, decks, and reviews.\n\nstyles/\nHere you'll find stylesheet objects,\
    \ which are reused elsewhere.\n\n# Application Screens\n\nThere are three main\
    \ scenes that may be displayed at any given time.\nFirst, we have deck creation,\
    \ from the main deck screen. This screen will display as many decks currently\
    \ exist in the app, as shown in Figure 10-4.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_181_0.png)\n\
    \nFigure 10-4. Creating a deck from the main deck screen\n\nIn the code we're\
    \ starting with, each of these screens is implemented as a component, but they\
    \ aren't connected yet. If you try to interact with the application, it shows\
    \ a “Not implemented” warning (see Figure 10-5).\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_182_0.png)\n\
    \nFigure 10-5. If you try to interact with the application, you get a warning\n\
    \nThe root component for the application is located in components/Flashcards.js\
    \ (see Figure 10-1).\n\n```javascript\nimport React, { Component } from \"react\"\
    ;\nimport { StyleSheet, View } from \"react-native\";\n\nimport Header from \"\
    ./Header\";\nimport DeckScreen from \"./DeckScreen\";\nimport NewCardScreen from\
    \ \"./NewCardScreen\";\nimport ReviewsScreen from \"./ReviewsScreen\";\n\nclass\
    \ Flashcards extends Component {\n  renderScene() {\n    return <ReviewsScreen\
    \ />;\n  }\n\n  render() {\n    return (\n      <View style={styles.container}>\n\
    \        <Header />\n        {this.renderScene()}\n      </View>\n    );\n  }\n\
    }\n\nconst styles = StyleSheet.create({ container: { flex: 1, marginTop: 30 }\
    \ });\n\nexport default Flashcards;\n```\n\nThe deck, deck creation, and review\
    \ screen are implemented as <DeckScreen>, <NewCardScreen>, and <ReviewScreen>\
    \ components, respectively.\n\nDeckScreen, shown in Example 10-2, rendering decks\
    \ and a button for creating decks.\n\n```javascript\nimport React, { Component\
    \ } from \"react\";\nimport { View } from \"react-native\";\n\nimport { MockDecks\
    \ } from \"../../data/Mocks\";\nimport Deck from \"../Deck\";\nimport DeckCreation\
    \ from \"../DeckCreation\";\n\nclass DeckScreen extends Component {\n  static\
    \ displayName = \"DecksScreen\";\n\n  constructor(props) {\n    super(props);\n\
    \    this.state = { decks: MockDecks };\n  }\n\n  _mkDeckViews() {\n    if (!this.state.decks)\
    \ {\n      return null;\n    }\n\n    return this.state.decks.map(deck => {\n\
    \      return <Deck deck={deck} count={deck.cards.length} key={deck.id} />;\n\
    \    });\n  }\n\n  render() {\n    return (\n      <View>\n        {this.mkDeckViews()}\n\
    \        <DeckCreation />\n      </View>\n    );\n  }\n}\n\nexport default DeckScreen;\n\
    ```\n\nNewCard, shown in Example 10-3, has input fields for creating new cards.\
    \ The callbacks for handling actual card creation are not yet implemented.\n\n\
    ```javascript\nimport React, { Component } from \"react\";\nimport { StyleSheet,\
    \ View } from \"react-native\";\n\nimport DeckModel from \"../data/Deck\";\n\n\
    import Button from \"../Button\";\nimport LabeledInput from \"../LabeledInput\"\
    ;\nimport NormalText from \"../NormalText\";\nimport colors from \"../styles/colors\"\
    ;\n\nclass NewCard extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { front: \"\", back: \"\" };\n  }\n\n  _handleFront = text =>\
    \ {\n    this.setState({ front: text });\n  }\n\n  _handleBack = text => {\n \
    \   this.setState({ back: text });\n  }\n\n  _createCard = () => {\n    console.warn(\"\
    Not implemented\");\n  };\n\n  _reviewDeck = () => {\n    console.warn(\"Not implemented\"\
    );\n  };\n\n  _doneCreating = () => {\n    console.warn(\"Not implemented\");\n\
    \  };\n}\n```\n"
  mdcn: "\n\n# 总结\n\n总来说，在 React Native 中进行调试与在 Web 上调试 React 代码非常相似。你已经熟悉的大多数工具在这里也处可用，这使得向\
    \ React Native 的过渡变得简单得多。尽管如此，React Native 应用程序带来了其特有的复杂性，有时这种复杂性会表现为令人沮丧的 bug。了解如何调试你的应用程序并熟悉由开发环境产生的错误信息，将对你培养高效的工作流大有裨益。\n\
    \n# 较大型应用程序中的导航与结构\n\n现在我们已经涵盖了构建自己的 React Native 应用程序所需的许多部分，让我们把所有内容整合在一起。到目前为止，我们处理的是较小的示例。在本章中，我们将查看大型应用程序的结构。我们将介绍如何使用来自\
    \ `react-navigation` 的 `<StackNavigation>` 组件来处理应用程序中不同屏幕之间的切换。\n\n本章的示例也将将用于第\
    \ 11 章，届时我们将查看如何将状态管理库 Redux 集成到我们的应用程序中。\n\n# 闪卡应用\n\n在本章中，我们将构建一个闪卡应用，允许用户创建卡牌组并对其进行复习。该闪卡应用比我们目前为止构建的示例应用程序更复杂。它旨在模拟一个更完善的应用程序可能的样子。所有代码都可以在\
    \ GitHub 上找到。此应用程序完全基于 JavaScript 且跨平台：这意味着它可以在 iOS 或 Android 上运行，并兼容 Expo（这意味着你可以使用\
    \ Create Native App）。\n\n如图 10-1 所示，闪卡应用有三个主视图：\n\n- 主页，列出可用的卡牌组并允许你创建新卡牌组\n-\
    \ 卡片创建屏幕\n- 复习屏幕\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_178_0.png)\n\n图 10-1.\
    \ 查看卡牌组、卡片创建和卡片复习\n\n应用程序用户通过两个主要的交互流。第一个处理内容创建（即卡牌组和卡片的创建）。内容创建过程如下（如图 10-2 所示）：\n\
    \n1. 用户点击“Create Deck”（创建卡牌组）。\n2. 用户输入卡牌组名称，然后点击“Return”（返回）按钮或再次点击“Create Deck”。\n\
    3. 用户为“Front”（正面）和“Back”（背面）输入值，然后点击“Create Card”（创建卡片）。\n4. 在输入零或多张卡片后，用户可以点击“Done”（完成），让他回到原始屏幕。或者，用户可以点击“Review\
    \ Deck”（复习卡牌组）并开始复习。\n\n用户也可以在稍后通过点击主屏幕上的 + 按钮启动卡片创建。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_179_0.png)\n\
    \n第二个主要的交互流处理卡片复习（如图 10-3 所示）：\n\n1. 用户点击想要复习的卡牌组名称。\n2. 用户看到问题屏幕。\n3. 用户点击提供的选项之一。\n\
    4. 用户根据猜测是否正确接收反馈。\n5. 要查看下一次复习，用户到达“Reviews cleared!”（复习已清除！）屏幕。\n6. 一旦完成所有复习，用户将到达“Reviews\
    \ cleared!”屏幕。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_179_1.png)\n\n我们将使用这个闪卡应用，特别是刚刚描述的功能，来讨论在构建更完整的应用程序时出现的一些模式和问题。\n\
    \n# 项目结构\n\n以下是闪卡应用的结构：\n\n```\nflashcards\n  ├── icon.png\n  ├── index.js\n \
    \ └── src_checkpoint_01\n    ├── components\n      │   ├── Button.js\n      │\
    \   ├── DeckScreen\n      │   ├── Flashcards.js\n      │   ├── Header\n      │\
    \   ├── HeadingText.js\n      │   ├── Input.js\n      │   ├── LabeledInput.js\n\
    \      │   ├── NewCardScreen\n      │   ├── NormalText.js\n      │   └── ReviewScreen\n\
    \    ├── data\n      │   ├── Card.js\n      │   ├── Deck.js\n      │   ├── Mocks.js\n\
    \      │   └── QuizCardView.js\n      └── styles\n          │   ├── colors.js\n\
    \          │   └── fonts.js\n  ├── src_checkpoint_02\n  │   └── ...\n  ├── src_checkpoint_03\n\
    \  │   └── ...\n  └── src_checkpoint_04\n      └── ...\n```\n\n你会注意到在 `flashcards`\
    \ 目录内实际上有四个文件夹：`src_checkpoint_01`、`src_checkpoint_02`、`src_checkpoint_03` 和 `src_checkpoint_04`。它们每一个代表了我们在整个开发过程中应用程序的状态。我们将从\
    \ *src_checkpoint_01* 开始。\n\ncomponents/\n我们所有的 React 组件都在这里。\n\ndata/\n你将在这里找到我们的数据模型，代表卡片、卡牌组和复习。\n\
    \nstyles/\n在这里你会找到样式表对象，它们在其他地方被复用。\n\n# 应用程序屏幕\n\n有三个可以在任何时候显示的三个场景。\n首先，我们从主卡牌组屏幕进行卡牌组创建。此屏幕将显示应用程序中当前的所有卡牌组，如图\
    \ 10-4 所示。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_181_0.png)\n\n图 10-4. 创建卡牌组\n\
    \n在我们开始的代码中，这些屏幕中的每一个都是一个组件，但它们还没有连接起来（如图 10-5 所示）。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_182_0.png)\n\
    \n图 10-5. 如果你交互应用程序\n\n的根组件位于 `components/Flashcards.js`。\n\n```javascript\nimport\
    \ React, { Component } from \"react\";\nimport { View } from \"react-native\"\
    ;\n\nimport Header from \"./Header\";\nimport DeckScreen from \"./DeckScreen\"\
    ;\nimport ReviewsScreen from \"./ReviewsScreen\";\n\nclass Flashcards extends\
    \ Component {\n  renderScene() {\n    return <ReviewsScreen />;\n  }\n\n  render()\
    \ {\n    return (\n      <View style={styles.container}>\n        <Header />\n\
    \        {this.renderScene()}\n      </View>\n    );\n  }\n}\n\nconst styles =\
    \ StyleSheet.create({ container: { flex: 1, marginTop: 30 } });\n\nexport default\
    \ Flashcards;\n```\n\n卡牌组、卡片创建和复习屏幕分别是作为 `<DeckScreen>`、`<NewCardScreen>` 和 `<ReviewScreen>`\
    \ 组件实现的。\n\n```javascript\nimport React, { Component } from \"react\";\nimport\
    \ { View } from \"react-native\";\n\nimport { MockDecks } from \"../../data/Mocks\"\
    ;\nimport Deck from \"../Deck\";\nimport DeckCreation from \"../DeckCreation\"\
    ;\n\nclass DeckScreen extends Component {\n  static displayName = \"DecksScreen\"\
    ;\n\n  constructor(props) {\n    super(props);\n    this.state = { decks: MockDecks\
    \ };\n  }\n\n  _mkDeckViews() {\n    if (!this.state.decks) {\n      return null;\n\
    \    }\n\n    return this.state.decks.map(deck => {\n      return <Deck deck={deck}\
    \ count={deck.cards.length} key={deck.id} />;\n    });\n  }\n\n  render() {\n\
    \    return (\n      <View>\n        {this.mkDeckViews()}\n        <DeckCreation\
    \ />\n      </View>\n    );\n  }\n}\n\nexport default DeckScreen;\n```\n\n卡牌组，从主卡牌组屏幕创建。\n\
    \n```javascript\nimport React, { Component } from \"react\";\nimport { StyleSheet,\
    \ View } from \"react-native\";\n\nimport DeckModel from \"../data/Deck\";\n\n\
    import Button from \"../Button\";\nimport LabeledInput from \"../LabeledInput\"\
    ;\nimport NormalText from \"../NormalText\";\nimport colors from \"../styles/colors\"\
    ;\n\nclass NewCard extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { front: \"\", back: \"\" };\n  }\n\n  _handleFront = text =>\
    \ {\n    this.setState({ front: text });\n  }\n\n  _handleBack = text => {\n \
    \   this.setState({ back: text });\n  }\n\n  _createCard = () => {\n    console.warn(\"\
    Not implemented\");\n  };\n\n  _reviewDeck = () => {\n    console.warn(\"Not implemented\"\
    );\n  };\n\n  _doneCreating = () => {\n    console.warn(\"Not implemented\");\n\
    \  };\n}\n\nexport default NewCard;\n```\n\nNewCard，如示例 10-3，具有创建新卡片的输入字段。处理实际卡片创建的回调函数尚未实现。\n\
    \n"
