    # Summary and Homework


    And...that''s it! Because state management is managed by Redux, we can be confident
    that by modifying our deck reducer, we ensured that all relevant state changes
    will be persisted to AsyncStorage.


    A common critique of Redux—and similar state management libraries—is that it adds
    significant boilerplate to your application. Indeed, we had to write several files
    to integrate Redux into our flashcard application. However, by expressing state
    relationships rather than mutating state locally, "boilerplate" makes existing
    complexity much more manageable. It''s harder to write state-based bugs with Redux!
    Plus, you also get some nice bonuses like time debugging. As we saw when integrating
    AsyncStorage, making changes to your application much easier.


    Which particular state management library you use doesn''t matter much; there
    are many reasonable ways to structure a large application. However, as with any
    React application, if you don''t plan for state management, eventually you will
    probably start to encounter bugs related to state mutations and have difficulty
    making changes to existing components. This is a good sign that you need to put
    more planning into your state and data flow management.


    The flashcard application is meant to serve as a reference. In many ways, it''s
    a "mini-viable project," and there are plenty of ways it could be improved. Being
    said, there''s still plenty to explore in the codebase, and I encourage you to
    dig into it.


    If you want to get some practice working within the context of React Native, check
    out the GitHub repository and try extending the flashcard application. Here are
    some ideas to get started:


    +   * Add the ability to delete decks

    * Add a screen where you can view all cards in a deck

    * Display statistics about review performance over time

    * Experiment with different styles'
