    \  public List<ViewManager> createViewManagers(ReactApplicationContext reactContext)\
    \ {\n    return Collections.emptyList();\n  }\n}\n```\n\n这大部分是样板代码。我们不需要导入 `HelloWorld`，因为它与此处处于同一个包（com.depends.helloworld）。有两个方法我们需要实现：`createNativeModules`\
    \ 和 `createViewManagers`。React Native 使用这些方法来确定应该导出哪些模块。\n\n我们的原生模块不处理原生视图或 UI\
