    \     <Text style={styles.bigText}>\n          {this.props.temp}F\n        </Text>\n\
    \      </View>\n    );\n  }\n}\n\nconst styles = StyleSheet.create({\n  container:\
    \ { height: 130 },\n  bigText: {\n    flex: 2,\n    fontSize: 20,\n    textAlign:\
    \ \"center\",\n    margin: 10,\n    color: \"#FFFFFF\"\n  },\n  mainText: { flex:\
    \ 1, fontSize: 16, textAlign: \"center\", color: \"#FFFFFF\" }\n});\n\nexport\
    \ default Forecast;\n```\n\nImport the <Forecast> component and add it to your\
    \ app's render method, passing it props based on this.state.forecast (see Example\
    \ 3-14). We'll address\n"
