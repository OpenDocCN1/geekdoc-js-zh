  - "[PAGE 138]\n\n# Java Native Modules\n\nNative modules for Android behave similarly\
    \ to native modules for iOS. You can find more information about Android native\
    \ modules in the docs.\n\nJust as with iOS, if you install a module for Android\
    \ that includes native code, you'll want to run react-native link after adding\
    \ the module to your application's package.json file.\n\n# Writing a Java Native\
    \ Module for Android\n\nIn order to understand how Java native modules work, we'll\
    \ write our own. Just like with Objective-C, we'll start with a simple \"Hello,\
    \ World\" module.\n\nWe'll be making a directory for our HelloWorld package. It\
    \ should be a sibling to MainActivity.java Note that the directory structure may\
    \ vary between different versions of Android and React Native. The key is that\
    \ your directory needs to be in the same directory as MainActivity.java.\n\n```\n\
    mkdir android/src/main/java/com/depends/helloworld\n```\n\nNow we'll add a HelloWorldModule.java\
    \ file to that directory, as shown in Example 7-6.\n\nExample 7-6. helloworld/HelloWorldModule.java\n\
    \n```\npackage com.depends.helloworld;\n\nimport android.util.Log;\nimport com.facebook.react.bridge.ReactContextBaseJavaModule;\n\
    import com.facebook.react.bridge.ReactApplicationContext;\nimport com.facebook.react.bridge.ReactMethod;\n\
    \npublic class HelloWorldModule extends ReactContextBaseJavaModule {\n    public\
    \ HelloWorldModule(ReactApplicationContext reactContext) {\n        super(reactContext);\n\
    \    }\n\n    @Override\n    public String getName() {\n        return \"HelloWorld\"\
    ;\n    }\n\n    @ReactMethod\n    public void greeting(String message) {\n   \
    \     Log.e('HelloWorldModule\", \"Saluton, \" + message);\n    }\n```"
- md: "\nThere's quite a bit of boilerplate here. Let's take this piece by piece.\n\
    \nFirst, we begin with a package statement:\n\n```\npackage com.depends.helloworld;\n\
    ```\n\nThis is based on the file's location in the directory.\n\nNext, we import\
    \ several React Native-specific files, as well as android.util.Log. Any module\
    \ you should import the same React Native files.\n\nThen we declare our HelloWorldModule\
    \ class. It's public, meaning that external files can use it; it extends ReactContextBaseJavaModule,\
    \ meaning that inherits methods from ReactContextBaseJava:\n\n```java\npublic\
    \ class HelloWorldModule extends ReactContextBaseJavaModule { ... }\n```\n\nThere\
    \ are three methods implemented here: HelloWorldModule, getName, and greet.\n\n\
    In Java, a method with the same name as the class is called the constructor; invoke\
    \ the ReactContextJavaModule constructor with a super(reactContext) and do not\
    \ do anything else.\n\ngetName determines name we use later on to access this\
    \ module from our JavaScript code, so make sure it's correct! In this we call\
    \ it \"HelloWorld.\" Note that we add an @Override decorator here. You'll need\
    \ to implement getName for any other modules you use.\n\nFinally, greet is our\
    \ method, which we want to be available in our JavaScript code. We add a @ReactMethod\
    \ so that React Native knows when greet is called, we can log.e like so:\n\n```java\n\
    Log.e(\"HelloWorld\", \"Hello\", + name);\n```\n\nThe Log object provides different\
    \ levels of logging. The three most commonly used are INFO, WARN, and ERROR, and\
    \ are invoked with Log.i, Log.w, and Log.e, respectively. Each of these methods\
    \ takes two parameters: the \"tag\" for your log, and the message. It's standard\
    \ practice to use the class name for the tag. View the Android documentation for\
    \ more details.\n\nWe also need to create a package to wrap this module (Example\
    \ 7-7) so that we can include it in our build. It should also be a sibling to\
    \ HelloWorldModule.java.\n\nJava Native Modules | 125\n\n# Example 7-7. helloworld/HelloWorldPackage.java\n\
    \n```java\npackage com.depends.helloworld;\n\nimport com.facebook.react.ReactPackage;\n\
    import com.facebook.react.bridge.JavaScriptModule;\nimport com.facebook.react.bridge.NativeModule;\n\
    import com.facebook.react.bridge.ReactApplicationContext;\nimport com.facebook.react.uimanager.ViewManager;\n\
    \nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\
    ```\n\n```java\npublic class HelloWorldPackage implements ReactPackage {\n  @Override\n\
    \  public List<NativeModule> createNativeModules(ReactApplicationContext reactContext)\
    \ {\n    List<NativeModule> modules = new ArrayList<>();\n    modules.add(new\
    \ HelloWorldModule(reactContext));\n    return modules;\n  }\n\n  @Override\n\
    \  public List<ViewManager> createViewManagers(ReactApplicationContext reactContext)\
    \ {\n    return Collections.emptyList();\n  }\n}\n```\n\nThis is mostly boilerplate.\
    \ We do not need to import HelloWorld because it is part of the same package (com.depends.helloworld)\
    \ as this. There are two methods that we need to implement: createNativeModules\
    \ and createViewManagers. React Native uses these methods to determine what modules\
    \ should export.\n\nOur native module doesn't deal with native views or UI elements\
    \ so createViewManagers returns an empty list, whereas createNativeModules returns\
    \ a list containing an instance of HelloWorld.\n\nFinally, we need to add the\
    \ package in MainApplication.java. Import the package:\n\n```java\nimport com.depends.helloworld.HelloWorldPackage;\n\
    ```\n\nThen add HelloWorldPackage to getPackages():\n\n```java\nprotected List<ReactPackage>\
    \ getPackages() {\n  return Arrays.asList(\n    new MainReactPackage(),\n    new\
    \ ReactVideoPackage(),\n    new HelloWorldPackage()\n  );\n}\n```\n\nJust like\
    \ Native-C modules, our Java module will be available via the React.NativeModules\
    \ object. We can invoke our greeting() method from any-where within our app, like\
    \ so:\n\n```javascript\nimport {NativeModules} from \"react-native\";\nNativeModules.HelloWorld.greeting(\"\
    Bonnie\");\n```\n\nLet's filter the logs and look for our message. Run the following\
    \ from your project’s root:\n\n```bash\nadb logcat\n```\n\nYou will need to restart\
    \ the application in order to see the log message output.\n\n```bash\nreact-native\
    \ run-android\n```\n\n**Figure 7-6** the output you should see in your shell.\n\
    \n| Time | PID | Priority | Message |\n| :--- | :--- | :--- | :--- |\n| 10–11\
    \ 14:01:45.081 | 2335 | 2369 I | HelloWorld: Hello, Bonnie |\n| 10–11 14:01:45.081\
    \ | 2335 | 2369 I | HelloWorld: Hello, Bonnie |\n\n*Figure 7-6. Output from logcat*\n\
    \nNow we've written our \"Hello, World\" example from Java, let's look at the\
    \ implementation of react-native-video for Android.\n\n# Exploring react-native-video\
    \ for Java\n\nreact-native-video for Android is basically a wrapper around the\
    \ MediaPlayer API. It consists mainly of three files:\n\n- ReactVideoView.java\n\
    - ReactVideoPackage.java\n- ReactVideoManager.java\n\nThe ReactVideoPackage.java\
    \ file, shown in Example 7-8, looks very similar to our HelloWorldPackage.java\
    \ file.\n\nExample 7-8 ReactVideoPackage.java\n\n```java\npackage com.brentvatne.react;\n\
    \nimport android.app.Activity;\nimport com.facebook.react.ReactPackage;\nimport\
    \ com.facebook.react.bridge.JavaScriptModule;\nimport com.facebook.react.bridge.NativeModule;\n\
    import com.facebook.react.bridge.ReactApplicationContext;\nimport com.facebook.react.uimanager.ViewManager;\n\
    ```\n\n```java\nimport java.util.Arrays;\nimport java.util.Collections;\nimport\
    \ java.util.List;\n```\n\n```java\npublic class ReactVideoPackage implements ReactPackage\
    \ {\n\n  @Override\n  public List<NativeModule> createNativeModules(\n      ReactApplicationContext\
    \ reactContext) {\n    return Collections.emptyList();\n  }\n```\n\n```java\n\
    @Override\npublic List<View> createViewManagers(\n    ReactApplicationContext\
    \ reactContext) {\n  return Arrays.<View>asList(\n    new ReactVideoManager()\n\
    \  );\n}\n```\n\nThe main difference is that ReactVideoPackage returns ReactVideoManager\
    \ from createNativeModules, while our HelloWorldPackage returned HelloWorld from\
    \ createNativeModules. What's the difference?\n\nFor Android, any native views\
    \ are created and controlled by a ViewManager (or, more specifically, a class\
    \ that extends ViewManager). Because ReactView is a UI component, we need to return\
    \ a ViewManager. The React Native documentation on native Android UI components\
    \ has more information on the difference between exposing a native module (i.e.,\
    \ non-rendering Java code) and a UI component.\n\nLet's look at ReactVideoManager.java\
    \ next. It's a relatively long file; you can view the full source in the react-native-linear-gradient\
    \ GitHub repo. Example 7-9 shows an abbreviated version.\n\nExample 7-9. ReactVideoManager.java,\
    \ abbreviated\n\n```java\npublic class ReactVideoManager extends SimpleViewManager<ReactVideo>\
    \ {\n\n  public static final String RCT_CLASS = \"RCTVideo\";\n\n  public static\
    \ final String PROP_VOLUME = \"volume\";\n  public static final String PROP_SEEK\
    \ = \"seek\";\n  /** more props skipped here ... */\n```\n\n```java\n@Override\n\
    public String getName() {\n    return REACT_CLASS;\n}\n```\n\n```java\n@Override\n\
    protected ReactVideoView createInstance(ThemedReactContext themedReactContext)\
    \ {\n    return new ReactVideoView(themedReactContext);\n}\n```\n\n```java\n@Override\n\
    public void onDropViewInstance(ReactNavigationView view) {\n    super.onDropViewInstance(view);\n\
    \    view.cleanMediaPlayerResources();\n}\n```\n\n/** more methods skipped here\
    \ ... */\n\n```java\n@ReactProp(name = PROP_VOLUME, defaultFloat = 1.0f)\npublic\
    \ void setVolume(\n    final ReactVideoView video;\n    final float volume\n {\n\
    \    video.setVolumeModifier(volume);\n}\n```\n\n```java\n@ReactProp(name = PROP_SEEK)\n\
    public void setSeek(\n    final ReactVideoView video;\n    final float seek\n\
    \ {\n    video.seekTo(Math.round(seek * 1000.0f));\n}\n```\n\nThere are a few\
    \ things we should pay attention to here.\n\nThe first is the implementation of\
    \ getName. Just, as in our HelloWorld example, we need to implement getName in\
    \ order to be able to refer to this component from our JavaScript code.\n\nThe\
    \ next is the setVolume method and the use of the @ReactProp decorator. Here we\
    \ declare that the <Video> component will take a prop named volume (as the value\
    \ of PROP_VOLUME) and setVolume will be invoked when prop changes. In setVolume,\
    \ we check to see that the underlying view exists; or we pass the color path that\
    \ it can update. There are many methods in the implementation of ReactVideoManager\
    \ that follow this pattern.\n"
  mdcn: "\n这里有很多样板代码（boilerplate）。让我们逐一来看。\n\n首先，我们从包语句开始：\n\n```\npackage com.depends.helloworld;\n\
