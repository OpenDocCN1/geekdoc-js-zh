    # About the Author


    Bonnie Eisenman is a software engineer at Twitter with previous experience at
    Codeemy, Google, and Fog Creek Software. She has spoken at several conferences
    on topics ranging from React to musical programming and Arduinos. In her spare
    time, she enjoys building electronic musical instruments, laser-cutting chocolate,
    and learning languages.


    # Colophon


    The animal on the cover of Learning React Native is a ringtail possum (Pseudoocheirus
    peregrinus), a marsupial that is native to Australia. Ringtail possums are herbivores
    and live primarily in forested regions. It is named for its prehensile tail, which
    is often coiled at the tip.


    Ringtail possums are gray-brown in color and can grow up to 35 centimeters in
    length. The diet of the ringtail possum consists of a variety of leaves, flowers,
    and fruits. They are nocturnal and live in communal nests known as dreys. As marsupials,
    ringtail possums carry their young in pouches until they are developed enough
    to survive on their own.


    The ringtail possum population declined steeply in the 1950s but has recovered
    in recent years.


    Many of the animals on O''Reilly covers are endangered; all of them are important
    to the world. To learn more about how you can help, go to animals.oreilly.com.


    The cover image is from Shaw''s Zoology. The cover fonts are URW Typewriter and
    Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad
    Condensed; and the code font is Dalton Maag''s Ubuntu Mono.


    # Learning React Native


    Get a practical introduction to React Native, the JavaScript framework for writing
    and deploying fully featured mobile apps that render natively. The second edition
    of this hands-on guide shows how to build applications that target iOS, Android,
    and other mobile platforms besides browsers—apps that can access platform features
    such as the user, location, and local storage.


    Through code examples and step-by-step instructions, web developers and frontend
    engineers familiar with React will learn how to build and style interfaces, use
    mobile components, and debug and deploy apps. You will learn how to extend React
    Native using third-party libraries or your own Java and Objective-C libraries.


    > Learning React Native is a must read for React developers looking to expand
    into native development. Inside, Eisenman thoroughly covers everything you need
    to build production-ready native applications written in JavaScript for iOS, Android,
    and more.”—Ryan Hurley


    - Understand how React Native works under the hood with native UI components

    - Examine how React Native''s mobile-based components compare to basic HTML elements

    - Create and style your React Native components and applications

    - Take advantage of platform-specific APIs, as well as modules from the framework''s
    community

    - Incorporate platform-specific components into cross-platform apps

    - Learn common pitfalls of React Native development, and tools for dealing with
    them

    - Combine a large application''s many screens into a cohesive UX

    - Handle state management in a large app with the Redux library

