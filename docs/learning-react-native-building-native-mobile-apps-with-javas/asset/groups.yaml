    ```\n\nIf you plan on implementing your own gesture recognizers, I suggest experimenting\
    \ with this application on a real device so that you can get a feel for how these\
    \ values respond. Figure 4-3 shows a screenshot, but you'll want to experience\
    \ it on a device with a real touch screen.\n\n## Choosing how to handle touch\n\
    \nHow should you decide when to use the touch and gesture APIs discussed in this\
    \ section? It depends on what you want to build.\n\nIn order to provide your user\
    \ with basic feedback and indicate that a button or another element is \"tappable,\"\
    \ use the <TouchableHighlight> component.\n\nIn order to implement your own custom\
    \ touch interfaces, you can use PanResponder. If you are designing a game, or\
    \ an application with an unusual interface, you'll need to spend some time building\
    \ out the custom touch interactions you want.\n\nFor many applications, you won't\
    \ need to implement any custom touch handling. In the next section, we'll look\
    \ at some of the higher-level components that implement common UI patterns for\
    \ you.\n\n## Working with Lists\n\nMany mobile user interfaces feature lists as\
    \ a central element. You can see this interaction pattern in the Dropbox, Twitter,\
    \ and iOS Settings (Figure 4-4). At its heart, a list is just a scrolling container\
    \ with some child views. This deceptively simple design pattern is integral to\
    \ many mobile interfaces.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_69_0.png)\n\
    \n### Figure Figure-4. Lists as used by Dropbox, Twitter, and the iOS Settings\
    \ app\n\nReact native uses list components with convenient APIs. The <FlatList>\
    \ component is designed to work with long lists of changing but similarly structured\
    \ data. It has several performance optimizations baked in. The <SectionList> component\
    \ is designed for data that is broken into logical sections, with section headings,\
    \ similar to the iOS UITableView. Together, <FlatList> and <SectionList> cover\
    \ most common use cases but if you need to pick under the hood and add some list\
    \ handling, take a look at <VirtualizedList>.\n\nOptimizing list-rendering performance\
    \ is a tricky problem because different use cases call for different approaches.\
    \ Is your user swiping hastily through contacts to find a particular person or\
    \ are they pursuing a feed of images? Do you have a homogeneous list or is every\
    \ child different? If you perform matters, pay attention to your lists.\n\nIn\
    \ this section, we are going to build an app that displays the New York Times\
    \ Best Sellers and lets you view data about each book, as shown in Figure 4-5.\
    \ We'll build two versions, with one with <FlatList> and the other with <SectionList>.\n\
    \nIf you'd like, you can grab your own API token from the New York Times. Otherwise,\
    \ use the API token included in the sample code.\n\nWorking with Lists | 55\n\n\
    ![](img/1a32334c3c38f46e3c4219c7d228280e_70_0.png)\n\nMichael Connelly\nTHE LATE\
    \ SHOW\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_70_1.png)\n\nJohn Grisham\n\
    CAMINO ISLAND\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_70_2.png)\n\nDaniel\
    \ Silva\nHOUSE OF SPIES\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_70_3.png)\n\
    \nFigure 4-5. The BookList application we'll be building\n\n## Using the Basic\
    \ <FlatList> Component\n\nWe're going to start with the basic <FlatList> component,\
    \ which requires two props: data and renderItem.\n\n```\n<FlatList\n  data={this.state.data}\n\
    \  renderItem={this.renderItem} />\n```\n\ndata is, as the name implies, the data\
    \ that your <FlatList> will render. It should be an array where each element has\
    \ a unique key property, plus whatever other you find useful.\n\nrenderItem should\
    \ be a function that returns a component based on the data from one element of\
    \ the data array.\n\nThe basic usage of a <FlatList> is demonstrated in Example\
    \ 4-11.\n\n## Example 4-11. src/bestsellers/SimpleList.js\n\n```\nimport React,\
    \ { Component } from \"react\";\n\nimport { StyleSheet, Text, View, FlatList }\
    \ from \"react-native\";\n\nclass SimpleList extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      data: [\n        { key: \"a\"\
    \ },\n        { key: \"b\" },\n        { key: \"c\" },\n        { key: \"d\" },\n\
    \        { key: \"longer example\" },\n        { key: \"e\" },\n        { key:\
    \ \"f\" },\n        { key: \"g\" },\n        { key: \"h\" },\n        { key: \"\
    i\" },\n        { key: \"j\" },\n        { key: \"k\" },\n        { key: \"l\"\
    \ },\n        { key: \"m\" },\n        { key: \"n\" },\n        { key: \"o\" },\n\
    \        { key: \"p\" }\n      ]\n    };\n  }\n\n  renderItem = data => (\n  \
    \  return <Text style={styles.row}>{data.key}</Text>;\n  }\n\n  render() {\n \
    \   return (\n      <View style={styles.container}>\n        <FlatList data={this.state.data}\
    \ renderItem={this._renderItem} />\n      </View>\n    );\n  }\n}\n\nconst styles\
    \ = StyleSheet.create({\n  container: {\n    flex: 1,\n    justifyContent: \"\
    center\",\n});\n```\n\n```\nalignItems: \"center\",\nbackgroundColor: \"#FSFCFF\"\
    ,\nrow: { fontSize: 24, padding: 42, borderWidth: 1, borderColor: \"#DD\" }\n\
    ```\n\n```\nexport default SimpleList;\n```\n\nOne of the common \"gotchas\" of\
    \ working with <FlatList> is that renderItem gets an object with the data. We\
    \ can simplify this by destructuring the item:\n\n```javascript\nrenderItem =\
    \ ({ item }) => {\n  return <Text style={styles.row}>{item.key}</Text>;\n};\n\
    ```\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_72_0.png)\n\nFigure 4-6. The SimpleList\
    \ component.\n\n## Updating the <FlatList> Contents\n\nWhat if we want to do something\
    \ more interesting? Let's create a <FlatList> with more data. To begin with, we'll\
    \ use fake data to represent the New York Sellers list, as shown in Example 4-12.\n\
    \n```\nconst mockBooks = [\n  {\n    rank: 1,\n    title: \"GATHER PREY\",\n \
    \   author: \"John Sandford\",\n    book_image: \"http://example.com/978039916387.jpg\"\
    \n  },\n  {\n    rank: 2,\n    title: \"MEMORY MAN\",\n    author: \"David Baldacci\"\
    ,\n    book_image: \"http://example.com/978145558639.jpg\"\n  }\n];\n```\n\nThen\
    \ we'll add a component that renders basic information about each book. The <BookItem>\
    \ uses a combination of <View>, <Text>, and <Image>.\n\n```\nconst styles = StyleSheet.create({\n\
    \  book: {\n    flexDirection: \"row\",\n    backgroundColor: \"#FFFFFF\",\n \
    \   borderBottomWidth: 2,\n    padding: 5,\n    height: 175,\n  },\n  cover: {\n\
    \    flex: 1,\n    height: 150,\n    resizeMode: \"contain\",\n  },\n  info: {\n\
    \    flex: 3,\n    alignItems: \"flex-end\",\n    flexDirection: \"column\",\n\
    \    alignSelf: \"center\",\n    padding: 20,\n  },\n  author: { fontSize: 18\
    \ },\n  title: { fontSize: 18, fontWeight: \"bold\" }\n});\n```\n\n```javascript\n\
    Example 4-13. src/bestellers/BookItem.js\nimport React, { Component } from \"\
    react\";\n\nimport { StyleSheet, Text, View, Image } from \"react-native\";\n\n\
    class BookItem extends Component {\n  render() {\n    return (\n      <View style={styles.book}>\n\
    \        <Image style={styles.cover} source={{uri: this.props.coverURL}} />\n\
    \        <View style={styles.info}>\n          <Text style={styles.author}>{this.props.author}</Text>\n\
    \          <Text style={styles.title}>{this.props.title}</Text>\n        </View>\n\
    \      </View>\n    );\n  }\n}\n\nexport default BookItem;\n```\n\nIn order to\
    \ use the <BookItem> component, we need to update our _render function. A <BookItem>\
    \ expects three props: coverURL, title, and author.\n\n```javascript\n_renderItem\
    \ = ({ item }) => {\n  return (\n    <BookItem\n      coverURL={item.book_image}\n\
    \      title={item.title}\n      author={item.author}\n    />\n  );\n};\n```\n\
    \nRemember that in a <FlatList>, each element in the data array must have a unique\
    \ key property. So'll add a helper method that takes an array of objects and adds\
    \ a key property to them, as shown in Example 4-14.\n\n```javascript\n_addKeysToBooks\
    \ = books => {\n  return books.map(book => {\n    return Object.assign(book, {\
    \ key: book.title });\n  });\n};\n```\n"
