    # 硬装非虚构类


    Michael Connelly

    《晚秀》


    图 4-9. 查看当前畅销书，带有 <SectionList>


    ## 导航


    在移动应用的语境下，导航大致指的是允许用户在不同屏幕之间切换的代码。在 Web 端，这是历史 API 的一部分，它提供了诸如“后退”和“前进”等概念。


    React Native 中常用的导航组件包括内置的 <Navigator> 和 <Navigator> 组件，以及社区解决方案，如 <StackNavigator>（由
    `react-navigation` 库提供）。


    为了在移动应用程序的屏幕之间移动，导航逻辑是必不可少的。它还实现了“深度链接（deep linking）”，使用户可以从 URL 跳转到应用中的某个特定屏幕。


    我们将在第 10 章中深入讲解导航。


    ## 其他组织组件


    还有许多其他组织组件。一些实用的组件包括 <TabBarIOS> 和 <SegmentedControl>（如图 4-10 所示），以及 <DrawerLayoutAndroid>
    和 <ToolbarAndroid>（如图 4-11 所示）。


    你会注意到，这些组件都带有特定平台的后缀名称。这是因为它们为特定平台的 UI 元素封装了相应的原生 API。


    这些组件对于组织应用程序内的多个屏幕非常有用。例如，<TabBarIOS> 和 <DrawerLayoutAndroid> 为你提供了在多种模式或功能之间切换的简单方法。<SegmentedControlIOS>
    和 <ToolbarAndroid> 更适合更细粒度的控制。


    你可能需要参考特定平台的设计指南来如何更好地使用这些组件：


    - Android 设计指南

    - iOS 人机交互指南


    我们将在第 7 章中深入探讨如何使用特定平台的组件。


    ## 总结


    在这一章中，我们研究了 React Native 中许多最重要组件的细节。我们讨论了如何使用基础低级组件（如 <Text> 和 <Image>），以及更抽象的组件（如
    <FlatList>、SectionList> 和 <TabBarIOS>）。我们还查看了如何使用各种关注触摸的 API 和组件，以防你想要构建自定义的触摸处理器。


    到此为止，你已经具备了使用 React Native 构建基础功能性应用程序的能力！既然你已经熟悉了本章讨论的组件，在它们的基础上进行构建并组合以创建你自己的应用，感觉应该与在
    Web 上使用 React 非常相似。


    当然，构建基础功能性应用只是战斗的一部分。在下一章中，我们将重点关注样式以及如何使用 React Native 的样式实现在移动端获得你想要的视觉效果和体验。


    ## 第 5 章

    ### 样式


    能够构建功能性应用程序很棒，但如果你不能有效地为其设置样式，你将走不远！在第 3 章中，我们使用一些基础样式构建了一个简单的天气应用程序。虽然这让我们概述了如何为
    React Native 组件设置样式，但我们跳过了许多细节。在本章中，我们将仔细观察 React Native 中样式的工作原理。我们将涵盖如何创建和管理样式表，以及
    React Native 对 CSS 规则实现的细节。在本章结束时，你应该能够熟练地创建和设置 React Native 组件及应用程序。


    如果你想在 React Native 和 Web 之间共享样式，GitHub 上的 React Style 项目提供了适用于 Web 的 React Native
    样式系统。


    ## 声明和操作样式


    在 Web 上使用 React 时，我们通常使用单独的样式表文件，这些可以用 CSS、SASS 或 LESS 编写。React Native 了一种截然不同的方法，将样式完全引入
    JavaScript 世界，并强制你显式地将样式对象链接到组件。这种方法往往会引起反应，因为它代表了对基于 CSS 的样式规范的重要偏。


    为了理解 React Native 样式的设计，我们首先需要考虑与传统 CSS 样式表相关的一些难题。¹ CSS 有许多问题。所有 CSS 规则和类名在全局范围内有效，这意味着如果你不小心，设置一个元素的样式很容易破坏另一个。例如，如果你包含了流行的
    Twitter Bootstrap 库，你将引入超过 600 多个新的全局变量。


    ## 使用内联样式


    从语法上讲，内联样式是设置最简单的方法。如示例 5-1 所示，React Native 中内联样式的语法与浏览器相同。内联样式有一些优点：它们快速且粗暴，允许你快速进行实验。


    然而，通常你应该避免使用它们，因为它们的效率较低。即使当你需要根据 props 或状态修改样式时，也不需要使用内联样式，正如稍后看到的。


    ## 使用对象设置样式


    如果你查看内联样式语法，你会发现它只是将一个对象传递给 style 属性。不过，不需要在渲染方法中创建样式对象。相反，你可以将其分离出来，如示例 5-2 所示。


    ## 使用 StyleSheet.create


    你会注意到，几乎所有的 React Native 代码都使用了 StyleSheet。这个函数是一个带有一些额外好处的小型语法糖。


    创建 StyleSheet 而不是传递原始 JavaScript 对象可以减少分配次数（从而有利于性能）；它还鼓励你更整洁地组织代码。这些 StyleSheets
    是不可变的，这通常是有帮助的。


    使用 StyleSheet.create 严格来说是可选的，但通常你会想要它。


