    The resulting directory structure should look similar to the following:


    ```

    __tests___

    ├── android

    |   ├── app.json

    |   ├── index.android.js

    |   └── index.ios.js

    ├── ios

    |   ├── node_modules

    |   ├── package.json

    |   └── yarn.lock

    ```


    The ios and android/ directories contain boilerplate relevant to those platforms.
    Your React code is located in the index.ios.js and android.ios.js files, which
    are the respective entry points for your React application. Dependencies installed
    via npm can, as usual, be found in the node_modules/ folder.


    # Running Your App on iOS


    To run your app on iOS, start by navigating into your newly created project''s
    directory. Then you can run your React Native application like so:


    ```

    cd FirstProject

    react-native run-ios

    ```


    Alternatively, you can open your application in Xcode and launch the iOS simulator
    from here:


    ```

    open ios/FirstProject.xcodeproj

    ```


    You can also use Xcode to upload your application to a real device for testing.
    In order to do this, you will need a free Apple ID so that you can configure code
    signing.


    To configure code signing, open your project in the Xcode Project Navigator and
    select your main target, which should have the same name as your project. Next,
    select the General tab. Under the Signing menu, select your Apple developer account
    from the Team drop-down (see Figure 3-2). You will then need to repeat this step
    for the Tests target.'
