    \ the styling code in your application. We will discuss this approach further\
    \ in the next chapter.\n\n## The <Image> Component\n\nIf text is the most basic\
    \ element in an application, images are a close contender for both mobile and\
    \ the web. When writing HTML and CSS for the web, we include images in a variety\
    \ of ways: sometimes we use the <img> tag at other times we apply images via CSS,\
    \ so when we use the background-image property. In React Native, we have a similar\
