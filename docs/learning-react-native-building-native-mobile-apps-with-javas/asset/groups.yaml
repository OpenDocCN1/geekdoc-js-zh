    Note the syntax for importing native modules is a bit verbose. A common approach
    is to wrap your native module in a JavaScript module (Example 7-5).


    Example 7-5. HelloWorld.js, a JavaScript wrapper for the HelloWorld native module


    ```

    import { NativeModules } from "react-native";

    export default NativeModules.HelloWorld;

    ```


    Then, it becomes much more straightforward:


    ```

    import HelloWorld from "./HelloWorld";

    ```


    HelloWorld.js JavaScript file is also a great opportunity to add any JavaScript-script
    functionality to your module.


    Phew. Objective-C can feel verbose, and we have to keep track of a couple of different
    files. But congratulations: you''ve written a "Hello, World" for your Objective-C
    module!


    To review, an Objective-C module must do the following in order to be available
    in React Native:


    +   * Import the RCTBridgeModule header

    * Declare that your module implements the RCTBridgeModule macro

    * Call the RCT_EXPORT_MODULE() macro

    * Have at least one method that is exported using the RCT_EXPORT_METHOD macro


    Native modules can then use any API provided by the iOS SDK. (Note that the API
    you provide to React Native must be asynchronous.) Apple provides extensive documentation
    for the iOS SDK, and there are many resources available from third parties as
    well. Note that your developer licenses will come in handy here—often difficult
    to access the SDK documentation without them.


    Now that we''ve written our basic "Hello, World," let''s take a deeper look at
    how react-native-video is implemented.'
