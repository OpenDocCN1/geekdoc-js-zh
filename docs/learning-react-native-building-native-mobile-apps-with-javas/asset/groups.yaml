    the "inspect element" functionality leaves something to be desired. However, there''s
    also an in-app "inspect element" that you may find helpful. It support for viewing
    things like style and gives you a quick way to dig through the component hierarchy.
    In Figure 9-8, you can see the result of inspecting a <Button> component.'
