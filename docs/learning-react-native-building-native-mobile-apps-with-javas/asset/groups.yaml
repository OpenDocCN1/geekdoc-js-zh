    \ 等组件，而不是 `<div>` 等 HTML 元素。样式也相当不同，基于 CSS 的子集，我们用内联语法分配样式。尽管如此，这些调整是非常容易管理的。在下一章中，我们将通过构建第一个应用程序将其付诸实践！\n\
    \n## 构建你的第一个应用程序\n\n在本章中，我们将介绍如何为使用 React Native 工作设置本地开发环境。然后，我们将介绍创建一个简单应用程序的各种知识，你可以将其部署到自己的\
    \ iOS 或 Android 设备上。\n\n## 设置你的环境\n\n设置开发环境将使你能够跟随书中的示例并编写自己的应用程序。\n\n设置 React\
    \ Native 开发环境通有两种通用方法。第一种是使用名为 Create React Native App 的工具，它为你提供了更快速、更简单的安装方法，但仅支持纯\
    \ JavaScript 应用。第二种更传统的方法涉及完整安装 React Native 及其所有依赖项。将 Create React Native App\
    \ 视为便于测试和原型设计的快捷方式。\n\n关于从 React Native App 迁移到完整 React Native 项目的信息可以在 [附录 C]\
    \ 中找到。\n\n> 你应该采取哪种方法？我建议初学者出于教育目的和快速原型使用 Create React Native App。\n\n> 最终，如果你在专业地开发\
    \ React Native 应用，或者编写一个同时使用 JavaScript 和原生 Java、Objective-C 或 Swift 代码的混合应用，你将希望安装完整的\
    \ React Native 开发者设置。\n\n接下来将描述这两种方法。后续章节中的示例代码通常适用于两种方法；当某些内容与 Create Native\
    \ App 不兼容并需要完整的 React Native 项目时，将会注明。\n\n## 开发者设置：Create React Native App\n\n\
