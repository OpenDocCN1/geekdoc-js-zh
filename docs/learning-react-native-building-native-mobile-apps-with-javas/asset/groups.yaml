    \ Objective-C 或 Java）。由于 React Native 不运行在主 UI 线程上，它可以执行这些异步调用而不影响用户体验。\n\n##\
    \ 在 React Native 中创建组件\n\n所有的 React 代码都可以存在于 React 组件中。React Native 组件在很大程度上与普通的\
    \ React 组件相同，但在渲染和样式方面存在一些重要的区别。\n\n## 使用 View\n\n在为 Web 编写 React 代码时，你渲染普通的 HTML\
    \ 元素（`<div>`, `<p>`, `<span>`, `<a>` 等）。在 React Native 中，，所有这些元素都被平台特定的 React\
    \ 组件取代（见表 2-1）。最基础的是跨平台的 <View>，这是一个简单灵活的 UI 元素，可以认为类比 `<div>`。例如，在 iOS 上，<View>\
    \ 组件渲染为 `UIView`，而在 Android 上它渲染为 View。\n\n表 2-1. Web 基础元素与 React Native 的对比\n\
    \n| React | React Native |\n| :--- | :--- |\n| `<div>` | <View> |\n| `<span>`\
    \ | <Text> |\n| `<li>`, `<ul>` | <FlatList>, items |\n| `<img>` | <Image> |\n\n\
    其他组件是平台特定的。例如，DatePickerIOS 组件（如其名）渲染为标准的 iOS 日期器（图 2-5）。这是 RNTester 应用中的一个摘录，展示了\
    \ iOS 日期器。其用法如你预期的那样简单：\n\n```\n<DatePickerIOS\ndate={this.state.date}\nmode=\"\
    time\"/>\n```\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_22_0.png)\n\n由于我们所有的\
    \ UI 元素都是 React 组件而不是基础 HTML 元素，你需要显式导入要使用的每个组件。例如，我们这样引入 DatePickerIOS 组件：\n\n\
    ```\nimport { DatePickerIOS } from \"react-native\";\n```\n\nReactNative 应用包含在项目中，允许你查看所有支持的\
    \ UI 元素。我鼓励你查看 RNTester 应用中的各种元素。它还展示了许多样式选项和交互。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_23_0.png)\n\
    \n平台特定的组件和 API 在文档中带有特殊的后缀标签，例如 <TabBarIOS> 和 <ToolbarAndroid>。\n\n 使用 JSX\n\n\
    在 React Native 中，与在 React 中一样，我们使用 JSX 编写视图，将标记和控制它的 JavaScript 合并到一个文件中。JSX 在\
    \ React 首次发布时引起了强烈的反应。对于许多 Web 开发者来说，基于技术的文件开发是既定的：保持你的 CSS、HTML 和 JavaScript\
    \ 文件分离。将标记、控制逻辑甚至样式合并到一种语言中可能会令人困惑。\n\n"
