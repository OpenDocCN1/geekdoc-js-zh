    export default styles;\n\n# Summary\n\nIn this chapter, we looked at how styles\
    \ work in React Native. While many ways of styling is how CSS works on the web,\
    \ React Native introduces a different structure and approach to styling. There's\
    \ plenty of material to get here! At this point, you should be able to use styles\
    \ effectively to create the mobile UIs you need with React Native. And best of\
    \ all, experimenting with styles is: being able to hit \"reload\" in the simulator\
    \ grants us a tight feedback loop. (It's worth noting that with traditional mobile\
    \ development, editing a style would typically require rebuilding your application.\
    \ Yikes.)\n\nIf you want more practice with styles, try going back to the New\
    \ York Times Sellers list or weather applications and adjusting their styling\
    \ and layouts. As we build more sample applications in future chapters, you'll\
    \ have plenty of material to practice with, too!\n\n# CHAPTER 6\n\n# Platform\
    \ APIs\n\nWhen building mobile applications, you will naturally want to take advantage\
    \ of the host platform’s specific APIs. React Native makes it easy to access things\
    \ like the phone’s camera roll, location, and persistent storage. These platform\
    \ APIs are made available to React Native through included modules, which provide\
    \ us with easy-to-use asynchronous JavaScript interfaces to these capabilities.\n\
    \nReact Native does not wrap all of its host’s functionality by default; some\
    \ platform APIs will require you to either write your own modules, or use modules\
    \ written by others in the React Native community. We will cover that process\
    \ in Chapter 7. The docs are the best place to check if an API is supported.\n\
    \nThis chapter covers some of the available platform APIs. For our example, we’ll\
