- md: "\nNext, update Flashcards.js to load data from disk after our store is created.\n\
    \n```\nimport { readDecks } from \"../storage/decks\";\nimport { loadData } from\
    \ \"../actions/creators\";\n\nlet store = createStore(reducer);\n```\n\n```\n\
    // On application start, read saved state from disk.\nreadDecks().then((decks)\
    \ => {\n  store.dispatch(loadData(decks));\n});\n```\n\nNow that we have dispatched\
    \ the deck, we need to update our deck reducer to handle the LOAD_DATA action.\
    \ Additionally, when handling the ADD_CARD or ADD_DECK actions, this reducer will\
    \ save the deck state (see Example 11-13).\n\nExample 11-3. Updating checkpoint_04/reducers/decks.js\
    \ to save\n\n```\nimport { ADD_DECK, ADD_CARD, LOAD_DATA } from \"../actions/types\"\
    ;\nimport Deck from \"../data/deck\";\nimport { writeDecks } from \"../storage/decks\"\
    ;\n\nfunction functionWithNewCard(oldDecks, card) {\n  let newState = oldDecks.map(deck\
    \ => {\n    if (deck.deckID === card.deckID) {\n      deck.addCard(card);\n  \
    \    return deck;\n    } else {\n      return deck;\n    }\n  });\n  saveDecks(newState);\n\
    \  return newState;\n}\n\nfunction saveDecks(state) {\n  writeDecks(state);\n\
    \  return state;\n}\n\nconst reducer = (state = [], action) => {\n  switch (action.type)\
    \ {\n    case LOAD_DATA:\n      return action.data;\n    case ADD_DECK:\n    \
    \  let newState = state.concat(action.data);\n      saveDecks(newState);\n   \
    \   return newState;\n    case ADD_CARD:\n      return functionWithNewCard(state,\
    \ action.data);\n  }\n  return state;\n}\n\nexport default reducer;\n```\n\n#\
    \ Summary and Homework\n\nAnd...that's it! Because state management is managed\
    \ by Redux, we can be confident that by modifying our deck reducer, we ensured\
    \ that all relevant state changes will be persisted to AsyncStorage.\n\nA common\
    \ critique of Redux—and similar state management libraries—is that it adds significant\
    \ boilerplate to your application. Indeed, we had to write several files to integrate\
    \ Redux into our flashcard application. However, by expressing state relationships\
