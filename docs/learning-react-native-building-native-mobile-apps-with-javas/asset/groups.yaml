    \    margin: 10,\n    backgroundColor: colors.green\n  }\n});\n```\n\nNext is\
    \ the <NormalText> component, shown in Example 10-6. It's mostly ordinary text\
    \ with some styles applied to scale the font size based on window.\n\nExample\
    \ 10-6. src_checkpoint_01/components/NormalText.js\n\n```javascript\nimport React,\
