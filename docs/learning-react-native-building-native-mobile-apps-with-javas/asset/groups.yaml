    In most of the examples so far, we append our style code to the end of the main
    JavaScript file with a single call to StyleSheet.create. For example code, this
    works well enough, but it''s not something you''ll likely want to do in an actual
    application. How should we actually organize styles? In this section, we will
    take a look at ways of organizing your styles, and how to share and inherit styles.


    # Exporting Style Objects


