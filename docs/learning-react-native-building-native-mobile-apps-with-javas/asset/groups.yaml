    });\n\nexport default WeatherProject;\n```\n\n现在我们已经启动了应用程序。它应该可以在 Android 和 iOS\
    \ 上运行，无论是在模拟器中还是你的物理设备上。你想更改或改进什么？\n\n你可以在 GitHub 仓库中查看完成的应用。\n\n# 总结\n\n对于我们的第一个应用程序，我们已经涵盖了大量内容。我们引入了一个新的\
    \ UI 组件 `<TextInput>`，并学习了如何使用它来获取用户信息。我们演示了如何在 React Native 中实现基础样式，以及如何使用图像并将资源包含在应用程序中。最后，我们学习了如何使用\
    \ React Native 网络 API 从外部网络源请求数据。对于第一个应用程序来说，这不错！\n\n希望本章展示了你如何快速构建具有实用功能且在移动设备上感觉良好的\
    \ React Native 应用。\n\n如果你想进一步扩展你的应用程序，这里有一些可以尝试的内容：\n\n- 添加更多图像并根据天气预报更改它们\n-\
    \ 为邮政编码字段添加验证\n- 切换到使用更合适的键盘进行邮政编码输入\n- 显示五天天气预报\n\n一旦我们涵盖了更多主题（例如地理位置），你将能够进一步扩展天气应用。\n\
