    \  fontSize: 24,\n}\n});\n```\n\nIf we set alignItems, the children will no longer\
    \ expand to fill all available space in both directions. Because we have set flexDirection:\
    \ 'row', they will expand to fill the row. Now, they will only take up as much\
    \ vertical space as they need.\n\nThen, the alignItems value determines *where*\
    \ they are positioned along the cross-axis. The cross-axis is the axis orthogonal\
    \ to the flexdirection. In this case, the cross-axis is vertical. flex-start places\
    \ the children at the top, center centers, and flex-end places them at the bottom.\n\
    \nLet's see what happens when we set alignItems (the result is shown in Figure\
    \ 5-3):\n\n```\nconst styles = StyleSheet.create({\n  parent: {\n    flex: 1,\n\
    \    flexDirection: \"row\",\n    alignItems: \"flex-start\",\n    backgroundColor:\
    \ \"#F5FCFF\",\n    borderColor: \"#0099AA\",\n    borderWidth: 5,\n    marginTop:\
    \ 30\n  },\n  child: {\n    flex: 1,\n    borderColor: \"#AA0099\",\n    borderWidth:\
    \ 2,\n    textAlign: \"center\",\n    fontSize: 24\n  }\n});\n```\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_98_0.png)\n\
    \nFigure 5-3. Setting alignItems positions children on the cross-axis, which is\
    \ the axis orthogonal to the flexDirection; here, we use flex-start, center, and\
    \ flex-end\n\n# Using Absolute Positioning\n\nIn addition to flex, React Native\
    \ supports absolute positioning. It works as much as it does on the web. You can\
    \ enable it by setting the position property:\n\n```\nposition: absolute\n```\n\
    \nThen you can control the component's positioning with the familiar properties\
    \ left, right, top, and bottom.\n\nAn absolutely positioned child will apply these\
    \ coordinates relative to its parent's position, so you can lay out parent element\
    \ using flexbox and then use absolute position for a child within it.\n\nThere\
    \ are some limitations to this. We don't have z-index, for instance, layering\
    \ views on top of each other is a bit complicated. The last view in a stack typically\
    \ takes precedence.\n\nAbsolute positioning can be very useful. For instance,\
    \ if you want to create a container that sits below the phone's status bar, absolute\
    \ positioning makes this easy:\n\n```\ncontainer: {\n  position: \"absolute\"\
    ,\n  top: 30,\n  left: 0,\n}\n```\n\n# Putting It Together\n\nLet's try using\
    \ these positioning techniques to create a more complicated layout. Say we want\
    \ to mimic a Mondrian painting. Figure 5-4 shows the end result.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_99_0.png)\n\
    \nHow should we go about constructing this kind of layout?\n\nTo start with, we\
    \ create a parent style to act as the container. We will use absolute positioning\
    \ on the parent because it's most appropriate: we want it to fill all available\
    \ space except for a 30-pixel offset at the top to accommodate the status bar\
    \ at the top of the screen. We'll also set its flexDirection to column:\n\n```\n\
    parent: {\n  flexDirection: \"column\",\n  position: \"absolute\",\n  top: 0,\n\
    \  left: 0,\n  right: 0,\n  bottom: 0\n}\n```\n\nLooking back at the image, we\
    \ can divide the layout into larger blocks. These divisions are in many ways arbitrary,\
    \ so we'll pick an option and roll with it. Figure 5-5 shows one way we can segment\
    \ the layout.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_100_0.png)\n\nFigure\
    \ 5-5. The order in which we'll style the sections we start cutting the layout\
    \ into a top and bottom block:\n\n```\n<View style={styles.parent}>\n  <View style={styles.topBlock}>\n\
    ```\n\n```\n\n</View>\n  <View style={styles.bottomBlock}>\n```\n\nThen we add\
    \ the next layer. This includes both a \"left column\" and \"bottom right\", as\
    \ well as the actual <View> components for three, four, and five:\n\n(Note: The\
