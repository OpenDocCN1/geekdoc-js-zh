  - "[PAGE 36]\n\n```\nmargin: 10,\ninstructions: {\n  textAlign: 'center',\n  color:\
    \ '#333333',\n  marginBottom: 5,\n};\n```\n\nAs I mentioned earlier, all styling\
    \ in React Native is done with style objects rather than stylesheets. The standard\
    \ method of handling styling is by utilizing the StyleSheet library. You can see\
    \ how the style objects are defined towards the bottom of the file. Note that\
    \ only <Text> components can take-specific styles like fontSize, and that layout\
    \ logic is handled by flexbox. We will discuss how to build layouts with flexbox\
    \ at greater length in Chapter 5.\n\nThe sample application is a good demonstration\
    \ of the basic functions you will need to create React Native applications. It\
    \ mounts a React component for rendering and demonstrates the basics of styling\
    \ and rendering in React Native. It also gives us a simple way to test our development\
    \ setup and deploying to a real device. However, it's still a very basic application\
    \ with no user interaction. So now let's trying a more full-featured application.\n\
    \n# Building a Weather App\n\nIn this section, we will be building off of the\
    \ sample application to create a weather app. This will give us a chance to explore\
    \ how to utilize and combine stylesheets, flexbox, network communication, user\
    \ input, and images into a useful app we can then deploy to an Android or iOS\
    \ device.\n\nThis section may feel a bit of a blur, as it is giving you an overview\
    \ of these features rather than deep explanations of them. The weather app will\
    \ serve as a useful reference in future sections as we discuss these features\
    \ in more detail, however, don't worry if it feels like we're moving quickly!\n\
    \nAs shown in Figure 3-3, the final application includes a text field where users\
    \ can input a zip code. It will then fetch data from the OpenWeather API and display\
    \ the current weather."
