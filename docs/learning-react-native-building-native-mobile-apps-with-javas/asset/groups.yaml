    # 关于作者


    Bonnie Eisenman 是 Twitter 的一名软件工程师，此前曾在 Codeemy、Google 和 Fog Creek Software 工作过。她曾在多个会议上进行过演讲，涵盖了从
    React 到音乐编程和 Arduino 的各种主题。在空余时间里，她喜欢制作电子乐器、激光切割巧克力以及学习语言。


    # 出版后记 (Colophon)


    《Learning React Native》封面上的动物是环尾袋鼠（Pseudoocheirus peregrinus），一种原产于澳大利亚的有袋动物。环尾袋鼠是食草动物，主要生活在森林地区。它因其抓握性的尾巴而命名，尾巴末端通常会卷曲。


    环尾袋鼠呈灰褐色，长度可达 35 厘米。它们的食物包括各种叶子、花和果实。它们是夜性动物，生活在被称为 dreys 的集体巢穴中。作为有袋动物，环尾袋鼠会将幼崽留在袋子里直到它们发育到足以独立生存。


    环尾袋鼠的数量在 20 世纪 50 年代急剧，但近年来有所恢复。


    O''Reilly 封面上的许多动物都是濒危物；它们对世界都至关重要。要了解更多如何帮助，请访问 animals.oreilly.com。


    封面图片来自《Shaw''s Zoology》。封面字体为 URW Typewriter 和 Guardian Sans。正文字体是 Adobe Minion
    Pro；标题字体是 Adobe Myriad Condensed；代码字体是 Dalton Maag 的 Ubuntu Mono。


    # Learning React Native


    深入浅出地介绍 React Native，这是一种 JavaScript 框架，用于编写和部署功能完整的原生移动应用。这本实战指南的第二版展示了如何构建针对
    iOS、Android 以及浏览器之外其他移动平台的应用程序——这些应用可以访问用户、位置和本地存储等平台功能。


    通过代码示例和逐步说明，熟悉 React 的 Web 开发者和前端工程师将学习如何构建和设置界面、使用移动组件以及调试和部署应用。你将学习如何使用第三方库或自己的
    Java 和 Objective-C 库来扩展 React Native。


    > 《Learning React Native》是想要扩展到原生开发的 React 开发者的必读物。书中，Eisenman 详尽地涵盖了使用 JavaScript
    为 iOS、Android 等编写生产级原生应用所需的所有内容。”Ryan Hurley


    - 通过原生 UI 组件了解 React Native 的底层原理

    - 比较 React Native 的移动组件与基础 HTML 元素的区别

    - 创建并样式化你的 React Native 组件和应用

    - 利用平台特定 API 以及框架社区的模块

    - 将平台特定组件整合到跨平台应用中

    - 学习 React Native 开发中的常见陷阱及其处理工具

    - 将大型应用的多个屏幕整合为统一的用户体验

    - 使用 Redux 库处理大型应用的状态管理


