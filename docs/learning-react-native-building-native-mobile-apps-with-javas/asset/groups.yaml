  - '[PAGE 166]


    This “No visible for RCTRootView” issue indicates that React Native’s Objective-C
    classes are for some reason not visible to Xcode. In general, if you encounter
    “X is undefined” error messages in Xcode, where X is an RCT-prefixed class or
    otherwise part of React Native, it’s a good idea to check on the packager and
    make sure that your JavaScript dependencies are in order:


    +   1. Quit the packager.

    2. Quit Xcode.

    3. Run `npm install` from the project directory.

    4. Reopen Xcode.


    Another common problem deals with asset sizes (see Figure 9-15).


    ![](img/1a32334c3c38f46e3c4219c7d228280e_166_0.png)


    Figure 9-15. Warning regarding a missed image


    Because assets should be sized appropriately for the device they''re intended
    for (especially your application''s icon), Xcode will throw a warning if you include
    an asset of an inappropriate size.


    Decoding Xcode’s warnings may take some time at first, especially if you are unfamiliar
    with Objective-C. Some of the most confusing issues deal with the integration
    of React Native and your Xcode project, doing a clean install of React Native
    usually clears any problems.


    # Common Android Problems


    When you run react-native run-android, some error messages may appear, preventing
    you from loading your application. The two most common issues are typical missing
    Android dependencies, or a failure to build an Android Virtual Device (or plug
    in an eligible device via USB).'
  - '[PAGE 167]


    If you receive a warning about a missing package, run android and check to see
    if that package is listed as "installed". If not, install it. If it is installed
    but React Native can''t find it, follow the steps given to try and fix any issues
    with your development environment. You should also check to make sure your ANDROID_HOME
    variable is properly set and points to your installation of the Android SDK. For
    example, on my system it looks like this:


    ```

    $ echo ANDROID_HOME

    /usr/local/opt/android-sdk

    ```


    If you receive a warning about no eligible device being available as a build target,
    check your device. If you attempt to launch the emulator? If the emulator is still
    booting, the react-native run-android command will fail; give it a few seconds
    and try again. For a physical device, make sure that USB debugging is enabled.


    You may also see issues after you create a signed version of your Android app:


    ```

    ./gradle installRelease

    INSTALL_PARSE_FAILED_INCONSISTENT_CERTIFICATES:

    New package has a different signature

    ```


    You can solve this by uninstalling the old application from your device or emulator,
    and reattempting the installation. The error is caused by attempting to install
    an application with a different signing key—which happens after you generate your
    first signed APK.


    # The React Native Packer


    Because React Native depends on the packager in order to rebuild your code, issues
    with the packager will manifest in problems quickly.


    The React Native packer will launch automatically when you run your project, either
    from Xcode or react-native run-android. However, it will not quit automatically
    when you close your project. This means that if you switch devices, the packager
    will still be running—just from the root directory, so it will fail to compile
    your code. Always make sure that the packager is running from project’s root directory.
    You can launch it with npm start.


    If the React Native packer throws strange errors upon starting, chances are good
    that your development environment is in a bad state. Following the steps described,
    make sure that your local installations of npm, Node, and react-native are all
    in a good state.


    # Issues Deploying to an iOS Device


    When attempting to test your application on a real iOS device, you may encounter
    some peculiar issues.'
- md: "\nIf you are having trouble uploading to your iOS device, make sure that your\
    \ device is selected correctly as the build target. Is your device of a supported\
    \ type, based on your project settings? If your app explicitly disallows iPads,\
    \ for instance, you won't be able to deploy to an iPad.\n\nIf you are using the\
    \ React Native packager to rebuild your files as you make edits, you may see the\
    \ screen shown in Figure 9-16.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_168_0.png)\n\
    \nFigure 9-16. Could not connect to the development server\n\nThis indicates that\
    \ your application has attempted to load its bundled JavaScript from the React\
    \ Native packager but is unable to do so. In this case, run through the following\
    \ checks:\n\n- Are your computer and iOS device on the same WiFi network?\n- Is\
    \ the React Native packager running from the project directory?\n\n## Simulator\
    \ Behavior\n\nYou may also see strange behavior in the device simulator from time\
    \ to time. If your application continues to crash repeatedly or it seems changes\
    \ to your code are not being reflected on the simulator, the easiest first step\
    \ is to delete your application from the device.\n\nNote that simply deleting\
    \ your application may not have the desired effect; on many systems, your app\
    \ may leave behind files that can cause side effects later. As shown in Figure\
    \ 9-17, the most straightforward way to start over with a clean slate on iOS is\
    \ to reset the device simulator entirely, which removes all files and applications\
    \ from the simulated device.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_169_0.png)\n\
    \nFigure 9-17. *The Reset Content and Settings...* option will delete everything\
    \ from your device\n\nSimilarly, for Android emulators, you can delete the emulator\
    \ and start over with a fresh device.\n\n## Testing Your Code\n\nDebugging is\
    \ all well and good, but you'll also want to prevent errors *before* they arise\
    \ (and catch them when they inevitably do!). Automated tests and static checking\
    \ are useful tools that you'll probably want to make use of in your applications.\n\
    \n### Testing JavaScript Code\n\nMuch of the React Native code you write may not\
    \ even be aware that it's running in a mobile environment. For example, any business\
    \ logic can probably be isolated from rendering logic. That means you can test\
    \ your JavaScript code using whatever tools you prefer for ordinary JavaScript\
    \ development.\n\nIn this section, we're going to look specifically at type checking\
    \ with Flow and unit testing with Jest.\n\n## Type Checking with Flow\n\nFlow\
    \ is a JavaScript library for static type checking. It relies on type inference\
    \ to detect type errors—even in unannotated code—and allows you to slowly add\
    \ type annotations to existing projects. Type checking can help you detect possible\
    \ issues early and help enforce sane APIs between various components and modules.\n\
    \nYou can install Flow using npm:\n\n```\n$ npm install -g flow-bin\n```\n\nRunning\
    \ Flow is simple:\n\n```\n$ flow check\n```\n\nThe default application comes with\
    \ a .flowconfig file, which configures Flow's behavior. If you find many errors\
    \ related to files in node_modules, you may need to add this to your line in .flowconfig\
    \ under [ignore]:\n\n```\n.*/node_modules/*\n```\n\nYou should then be able to\
    \ run flow check without seeing any errors:\n\n```\n$ flow check\n$ Found 0 errors.\n\
    ```\n\nFeel free to use Flow as you develop your React Native applications.\n\n\
    ## Unit Testing with Jest\n\nReact Native supports testing of React components\
    \ using Jest. Jest is a unit testing framework built on top of Jasmine. It provides\
    \ aggressive mocking of dependencies, and it meshes nicely with React's testing\
    \ utilities.\n\nTo use Jest, you will first need to install:\n\n```\nnpm install\
    \ jest-cli --save-dev\n```\n\nBecause we only need jest for development, for our\
    \ production build, we install it with --save-dev flag.\n\nUpdate your package.json\
    \ file to include a test script:\n\n```json\n{\n  \"scripts\": {\n    \"test\"\
    : \"jest\"\n  }\n}\n```\n\nThis will run when you type `npm test`.\n\nNext, create\
    \ the `tests/` directory. Jest will recursively search for files in a `tests/`\
    \ directory, and run them:\n\n```\nmkdir __tests__\n```\n\nNow let's create a\
    \ new file, `tests/dummy-test.js`, and write our first test:\n\n```javascript\n\
    'use strict';\n\ndescribe('a silly test', function() {\n  it('expects true to\
    \ be true', function() {\n    expect(true).toBe(true);\n  });\n});\n```\n\nNow\
    \ if you run `npm test`, you will see that the test has passed. of course, this\
    \ is much more than testing to this trivial example. If you want to read more\
    \ about Jest, I recommend starting with the [documentation]()\n\n## Snapshot Testing\
    \ with Jest\n\nSnapshot tests are excellent for ensuring that your UI not change\
    \ unexpectedly. This makes them a good fit for React components. Plus, snapshot\
    \ tests are easy to write and require minimal configuration.\n\nSnapshot testing\
    \ for React Native requires the react-test-renderer package.\n\n```\nnpm install\
    \ --save-react-test-renderer\n```\n\n**Example 9-1** demonstrates a simple test.\n\
    \nExample 9-1. Styles/tests/FlexDemo-test.js\n\n```javascript\nimport React from\
    \ \"react\";\nimport FlexDemo from \"../FlexDemo\";\n\nimport renderer from \"\
    react-test-renderer\";\n\ntest('renders correctly', () => {\n  const tree = renderer.create(<FlexDemo\
    \ />).toJSON();\n\n  expect(tree).toMatchSnapshot();\n});\n```\n\nAs you can see,\
    \ very little code is needed to add a snapshot test. You'll also need to update\
    \ your `package.json` file to add Jest as a dependency, with the react-native\
    \ testing preset.\n\n```json\n\"dependencies\": {\n  \"jest\": \"*\",\n}\n\"jest\"\
    : {\n  \"preset\": \"react-native\"\n}\n```\n\nThe first time you run npm test,\
    \ a \"snapshot\" will be generated.\n\n```\n$ npm test\nPASS __tests__/FlexDemo-test.js\n\
    ✓ renders correctly (121ms)\n```\n\nSnapshot Summary\n\n- 1 snapshot written in\
    \ 1 test suite.\n\nThe snapshot file will look something like Example 9-2.\n\n\
    Example 9-2. The initial snapshot file\n\n```javascript\n// Jest Snapshot v1,\
    \ https://goo.gl/fBAQLP\n```\n\n```javascript\nexports['renders correctly 1']\
    \ =\n<View\nstyle={\nObject\n  \"alignItems\": \"flex-end\",\n  \"backgroundColor\"\
    : \"#F5FCFF\",\n  \"borderColor\": \"#0099AA\",\n  \"borderWidth\": 5,\n  \"flex\"\
    : 1,\n  \"flexDirection\": \"row\",\n  \"marginTop\": 30,\n}\n>\n<Text\naccessible={true}\n\
    allowFontScaling={true}\nelipseMode=\"tall\"\nstyle={\nObject\n  \"borderColor\"\
    : \"#AA0099\",\n  \"borderWidth\": 2,\n  \"flex\": 1,\n  \"fontSize\": 24,\n \
    \ \"textAlign\": \"center\"\n}\n>\n```\n\n```javascript\nChild One\n</Text>\n\
    <Text\naccessible={true}\nallowScaling={true}\nellipseSizeMode=\"tail\"\nstyle={{\n\
    \  \"borderColor\": \"#AA0099\",\n  \"borderWidth\": 2,\n  \"flex\": 1,\n  \"\
    fontSize\": 24,\n  \"textAlign\": \"center\"\n}\n>\n```\n\n```javascript\nChild\
    \ Two\n</Text>\n<Text\naccessible={true}\nallowScaling={true}\nellipseSizeMode=\"\
    tail\"\nstyle={{\n  \"borderColor\": \"#AA0099\",\n  \"borderWidth\": 2,\n  \"\
    flex\": 1,\n  \"fontSize\": 24,\n  \"textAlign\": \"center\"\n}\n>\n>\n```\n\n\
    ```javascript\nChild Three\n</Text>\n</View>;\n```\n\nDon't edit these files manually.\
    \ Instead, when you update your application, run test again. If a component renders\
    \ differently from the snapshot, Jest will fail and show you a diff between the\
    \ expected and received version of the component:\n\n```\n$ npm test\nFAIL _tests__/FlexDemo-test.js\n\
    ● renders correctly\n```\n\n```javascript\nexpect(value).toMatchSnapshot()\n```\n\
    \nReceived value does not match stored snapshot 1.\n\n+ Snapshot\n+ Received\n\
    \n```\n@@ -41,22 +41,6 @@\n }\n }\n> Child Two\n</Text>\n<Text\naccessible={true}\n\
    fontScaling={true}\nelnipseMode=\"tail\"\nstyle={\n Object {\n \"borderColor\"\
    : \"#AA0099\",\n \"borderWidth\": 2,\n \"flex\": 1,\n \"fontSize\": 24,\n \"textAlign\"\
    : \"center\",\n }\n}\n> Child Three\n</Text>\n<View>\n```\n\nat Object.<anonymous>(__tests__/FlexDemo-test.js:11:14)\n\
    \nX renders correctly (66ms)\n\nSnapshot Summary\n\n- 1 snapshot test failed in\
    \ 1 test suite.\n\nWhen inspecting the diff, you can then decide whether the changes\
    \ were in error or if you want to update your snapshot to reflect the changes.\
    \ Snapshot files should be checked into source control.\n"
  mdcn: "\n\n如果你向 iOS 设备上传内容时遇到问题，请确保已正确选择该设备作为构建目标。根据你的项目设置，你的设备是否属于支持的类型？例如，如果你的应用显式禁止使用\
    \ iPad，你将无法部署到 iPad 上。\n\n如果你正在使用 React Native packager 在编辑时重新构建文件，可能会看到图 9-16\
    \ 所示的屏幕。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_168_0.png)\n\n图 9-16. 无法连接到开发服务器\n\
    \n这表明你的应用程序尝试从 React Native packager 加载绑定的 JavaScript，但未能成功。在这种情况下，请执行以下检查：\n\n\
    - 你的电脑和 iOS 设备是否在同一个 WiFi 网络上？\n- React Native packager 是否从项目目录运行？\n\n## 模拟器行为\n\
    \n你可能偶尔会在设备模拟器中看到奇怪的行为。如果你的应用程序继续反复崩溃，或者代码的更改似乎没有反映在模拟器上，最简单的第一步是从设备上删除你的应用程序。\n\
    \n请注意，仅仅删除应用程序可能无法达到预期效果；在许多系统中，你的应用可能会留下日后可能产生副作用的文件。如图 9-17 所示，在 iOS 上从零开始并干净状态的最直接方法是完全重置设备模拟器，这将从模拟设备中删除所有文件应用程序。\n\
    \n![](img/1a32334c3c38f46e3c4219c7d228280e_169_0.png)\n\n图 9-17. *重置内容和设置... (Reset\
    \ Content and Settings...)* 选项将删除设备上的所有内容\n\n同样，对于 Android 模拟器，你可以删除模拟器并从新设备开始。\n\
    \n## 测试你的代码\n\n调试固然很好，但你也会在错误发生*之前*防止它们（并在它们不可避免发生时捕捉它们！）。自动化测试和静态检查是有用的工具，你可能希望在应用程序中使用它们。\n\
    \n### 测试 JavaScript 代码\n\n你编写的大部分 React Native 代码可能甚至不知道自己运行在移动环境中。例如，任何业务逻辑可能都可以从渲染逻辑中分离出来。这意味着你可以使用任何你喜欢的普通\
    \ JavaScript 开发工具来测试你的 JavaScript 代码。\n\n在本节中，我们将专门查看使用 Flow 进行类型检查以及使用 Jest 进行单元测试。\n\
    \n## 使用 Flow 进行类型检查\n\nFlow 是一个用于静态类型检查的 JavaScript 库。它依赖类型推断来检测类型错误——即使在未标记的代码中也是如此——并允许你向现有项目逐渐添加类型注解。类型检查可以帮助你尽早发现可能的问题，并帮助在各种组件和模块之间强制合理的\
    \ API。\n\n你可以使用 npm 安装 Flow：\n\n```\n$ npm install -g flow-bin\n```\n\n运行 Flow\
    \ 非常简单：\n\n```\n$ flow check\n```\n\n默认应用程序带有一个 .flowconfig 文件，它用于配置 Flow 的行为。如果你发现许多与\
    \ node_modules 中的文件相关的错误，你可能需要在 .flowconfig 中的 [ignore] 所在行中添加以下内容：\n\n```\n.*/node_modules/*\n\
    ```\n\n然后你应该能够运行 flow check 而不会看到任何错误：\n\n```\n$ flow check\n$ Found 0 errors.\n\
    ```\n\n在开发 React Native 应用时，请尽管使用 Flow。\n\n## 使用 Jest 进行单元测试\n\nReact Native 支持使用\
    \ Jest 测试 React 组件。Jest 是一个构建在 Jasmine 之上的单元测试框架。它提供了对依赖的激进模拟（mocking），与 React\
    \ 的测试工具完美结合。\n\n要使用 Jest，你首先需要安装：\n\n```\nnpm install jest-cli --save-dev\n```\n\
    \n由于我们只需要在开发中使用 jest，因此对于生产构建，我们使用 --save-dev 标志进行安装。\n\n更新你的 package.json 文件以包含一个测试脚本：\n\
    \n```json\n{\n  \"scripts\": {\n    \"test\": \"jest\"\n  }\n}\n```\n\n当你输入 `npm\
    \ test` 时将运行它。\n\n接下来，创建 `tests/` 目录。Jest 将递归地搜索 `tests/` 目录中的文件并运行它们：\n\n```\n\
    mkdir __tests__\n```\n\n现在，让我们创建一个新文件 `tests/dummy-test.js` 并编写我们的第一个测试：\n\n```javascript\n\
    'use strict';\n\ndescribe('a silly test', function() {\n  it('expects true to\
    \ be true', function() {\n    expect(true).toBe(true);\n  });\n});\n```\n\n现在如果你运行\
    \ `npm test`，你将看到测试已通过。当然，这对于这个微不足道的例子来说远比测试本身要多。如果你想了解更多关于 Jest 的信息，我建议从[文档]()开始\n\
    \n## 使用 Jest 进行快照测试\n\n快照测试对于确保你的 UI 不发生意外变化非常出色。这使其非常适合 React 组件。此外，快照测试很容易编写且所需配置极少。\n\
    \nReact Native 的快照测试需要 `react-test-renderer` 包。\n\n```\nnpm install --save-react-test-renderer\n\
    ```\n\n**示例 9-1** 展示了一个简单的测试。\n\n示例 9-1. Styles/tests/FlexDemo-test.js\n\n```javascript\n\
    import React from \"react\";\nimport FlexDemo from \"../FlexDemo\";\n\nimport\
    \ renderer from \"react-test-renderer\";\n\ntest('renders correctly', () => {\n\
    \  const tree = renderer.create(<FlexDemo />).toJSON();\n\n  expect(tree).toMatchSnapshot();\n\
    });\n```\n\n正如你看到的，你可以看到它渲染正确...（注：此处原文有重复，已根据翻译逻辑处理）此处翻译逻辑）误，修正：\n\nReact Native\
    \ 的快照测试需要 `react-test-renderer` 包。\n\n```\nnpm install --save-react-test-renderer\n\
    ```\n\n**示例 9-1** 展示了一个简单的测试。\n\n示例 9-1. Styles/tests/FlexDemo-test.js\n\n```javascript\n\
