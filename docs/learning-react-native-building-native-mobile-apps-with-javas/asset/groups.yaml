    ![](img/1a32334c3c38f46e3c4219c7d228280e_157_0.png)


    # ### 9-5. Console output as viewed in Chrome


    Note that you need to open the console before you will see things here.


    How does this work? When you load your React Native application with remote-JavaScript
    debugging enabled, the browser loads your React Native JavaScript code from the
    React Native packer using a standard `<script>` tag, so that you have full browser-based
    debugging control. The packager uses WebSockets to communicate between the device
    and the browser.


    We don''t need to be too concerned with the specifics; we just need to know how
    to take advantage of these tools!


    In addition to using `console.log`, you can also utilize `console.warn` or `console.error`.
    In developer builds, `console.warn` will display a yellow box at the top of your
    application, while messages from `console.error` will display a full-screen red
    message. These visual indicators will be disabled in production builds so you
    don''t need to worry about them being displayed to end users.


    # Using the JavaScript Debugger


    You can also use the JavaScript debugger just as you normally would for web-based
    React development. Open up the developer tools in Chrome and switch to the source
    tab, and your breakpoints will be activated. You can see this in action Figure
    9-6.


    Note that, similar to the JavaScript console, if you don''t already have the developer
    tools pane open, the debugger may not be activated on your breakpoints. Likewise,
    if you don''t have Debug Remote JS enabled, the debugger will not be activated.'
  - '[PAGE 158]


    ![](img/1a32334c3c38f46e3c4219c7d228280e_158_0.png)


    Figure 9-6. Using the debugger


    When using the debugger, you have access to the usual view of your source code
    from within Chrome, and you can interact with the current JavaScript context via
    the browser console as well.


    # Working with the React Developer Tools


    When you''re developing with React for the web, the React developer tools are
    quite useful. They allow you to inspect the component hierarchy, examine the props
    and state of components, and modify the state from your browser. The React developer
    tools are available as a Chrome extension.


    The React developer tools work with React Native as well. You''ll need to install
    the standalone version to use them with React Native:


    ```

    npm install -g react-devtools

    ```


    Then launch the DevTools, shown in Figure 9-7, by running:


    ```

    react-devtools

    ```'
- md: "\n## React Native Debugging Tools\n\nIn addition to the usual JavaScript-based\
    \ web debugging tools, there are also some features specific to React Native that\
    \ are relevant to debugging.\n\n### Using Inspect Element\n\nWhile you can use\
    \ the React developer tools via the browser, you may find that the \"inspect element\"\
    \ functionality leaves something to be desired. However, there's also an in-app\
    \ \"inspect element\" that you may find helpful. It supports viewing things like\
    \ style and gives you a quick way to dig through the component hierarchy. In Figure\
    \ 9-8, you can see the result of inspecting a <Button> component.\n\nFigure 9-8.\
    \ Using Inspect Element will let you click on a component to view more information.\n\
    \nThis view also displays some basic performance metrics.\n\n### Interpreting\
    \ the Red Screen of Death\n\nOne of the common sights you'll see during application\
    \ development is the Red Screen of Death. Alarming appearing aside, the Red Screen\
    \ of Death is actually a boon: it takes errors and parses them into meaningful\
    \ messages. So, learning to parse the information it displays is critical to an\
    \ effective developer workflow.\n\nFor example, a syntax error might produce the\
    \ output shown in Figure 9-9, indicating the file and line number where the error\
    \ occurred.\n\n```\nSyntaxError/Users/bonnie/lrn-code/Zebro/src/components/NormalText.js:\
    \ Unexpected token (17:2)\n\n/Users/bonnie/lrn-code/Zebro/src/components/NormalText.js:\
    \ Unexpected to~\n/Users/bonnie/lrn-code/Zebro/components/NormalText.js:17\n```\n\
    \nFigure 9-9. Red Screen of Death for a syntax error.\n\nOther common errors include\
    \ attempting to use a variable without importing or defining it. For instance,\
    \ a common issue is failing to explicitly import the <Text> component, like so:\n\
    \n```javascript\nimport React, { Component } from \"react\";\n\nexport default\
    \ class App extends Component {\n  return (\n    <View>\n      <Text>\n      \
    \  I haven't imported things properly!\n      </Text>\n    </View>\n  );\n}\n\
    ```\n\nThis results in the error message shown in Figure 9-10.\n\n```\nYou are\
    \ trying to render the global Text variable as a React element. You probably forgot\
    \ to require Text.\n\ngetInvalidGlobalUseError\n/users/bonnie/lrn-code/Ze../polyfills/document.js:11\n\
    \ndefaultProps\n/users/bonnie/lrn-code/Ze../polyfills/document.js:18\n\ncreateElement\n\
    /users/bonnie/lrn-code/Ze../reactElement.js:112\n\ncreateElement\n/users/bonnie/lrn-code/Ze../actElementValidator.js:329\n\
    \nNormalText_render\n/users/bonnie/lrn-code/components/NormalText.js:18\n\nextContext\n\
    _renderValidatedComponentWithoutOwnerOrC\n/users/bonnie/lrn-code/Ze../tCompositeComponent.js:715\n\
    \nrenderValidatedComponent\n/users/bonnie/lrn-code/Ze../tCompositeComponent.js:737\n\
    \nReactCompositeComponent__renderValidatedComponent\n/users/bonnie/lrn-code/Ze../src/test/ReactPerf.js:780\n\
    \nmountComponent\n/users/bonnie/lrn-code/Ze../tCompositeComponent.js:234\n\nReactCompositeComponent_mountComponent\n\
    /users/bonnie/lrn-code/Ze../src/test/ReactPerf.js:780\n\nDismiss (ESC) Reload\
    \ JS (XR)\n```\n\nFigure 9-10. Error message from forgetting to import <Text>.\n\
    \nAttempting to use an undeclared variable results in another error message (see\
    \ Figure 9-11).\n\nFigure 9-11. Error message from attempting to use an undeclared\
    \ variable.\n\nOf particular use are the style-related error messages. For instance,\
    \ if you pass a bad value to a StyleSheet.create call, React Native will help\
    \ inform you which values would have been appropriate (see Figure 9-12).\n\nFigure\
    \ 9-12. Error message from missetting a style property.\n\nWhile the Red Screen\
    \ of Death may look alarming, it's really there to help you, and the error messages\
    \ present useful information. For some reason you need to dismiss the screen,\
    \ pressing the Escape key in the device simulator will take you back to your application.\n\
    \n## Debugging Beyond JavaScript\n\nAs you write applications with React Native,\
    \ you will encounter errors not only in your React code but also in your application\
    \ in general. If you are new to mobile development, these issues can be frustrating.\
    \ Additionally, sometimes you'll see cryptic error messages and issues where your\
    \ JavaScript codebase meets the host platform; the combination of host platform\
    \ code and React Native can lead to confusing symptoms.\n\nLearning to debug issues\
    \ outside of pure JavaScript-based problems is critical to a productive development\
    \ process with React Native. Luckily, many of these issues are simpler than they\
    \ may seem at first glance, and we have plenty of tools to help us along the way.\n\
    \n## Common Development Environment Issues\n\nManaging your developer environment\
    \ for iOS, Android, and JavaScript can be a bit annoying, and it's not uncommon\
    \ to encounter issues with any combination of the above.\n\nIf you encounter issues\
    \ with the packager starting, or with building or running your application using\
    \ npm or react-native run-android, it's possible that you have a dependency problem.\n\
    \nIf you're having dependency issues, one common solution is to clean out your\
    \ installed npm packages and reinstall them:\n\n```bash\nrm -rf node_modules\n\
    npm install\n```\n\n## Common Xcode Problems\n\nWhen you build your iOS application,\
    \ if your application has any errors, they will appear in the Issues pane in Xcode\
    \ (Figure 9-13). You can view them by selecting the warning icon.\n\nFigure 9-13.\
    \ Viewing the issues pane.\n\nXcode will then point you to the relevant file and\
    \ line number, and highlight the issue in the IDE. Figure 9-14 shows an example\
    \ of a common error.\n\n```objc\n// xcodeLocation = [[NSBundle mainBundle] URLForWithExtension:@\"\
    bundle\"];\nRCTView *view = [[RCTView alloc] initWithFrame:CGRectZero initWith\n\
    moduleOfName:[NSBundle mainBundle] \ninterface:[[NSString valueForKey:([RootViewController)\
    \ selector:@(mainInterfaceForBundle:)] bundle:[NSBundle mainBundle]]\nlaunchOptions:launchOptions]];\n\
    ```\n\nFigure 9-14. Interface error.\n\nThis “No visible for RCTRootView” issue\
    \ indicates that React Native’s Objective-C classes are for some reason not visible\
    \ to Xcode. In general, if you encounter “X is undefined” error messages in Xcode,\
    \ where X is a RCT-prefixed class, it's a good idea to:\n\n1. Quit the packager.\n\
    2. Quit Xcode.\n3. Run `npm install`.\n4. Reopen Xcode.\n\nAnother common problem\
    \ deals with assets (see 9-15).\n\nFigure 9-15. Error message from attempting\
    \ to use an undeclared variable.\n"
