    # 第一章


    # 什么是 React Native？


    React Native 是一个 JavaScript 框架，用于为 iOS 和 Android 编写真正的、原生渲染的应用程序。它基于 React（Facebook
    用于构建用户界面的 JavaScript 库），但它的目标不是浏览器，而是移动平台。换句话说，它让开发者能够在使用熟悉的 JavaScript 库时，编写出看起来和用起来都真正“原生”的移动应用程序。此外，由于你编写的大部分代码可以在平台之间共享，React
    Native 能够轻松地同时为 Android 和 iOS 进行开发。


    与 Web 端的 React 类似，React Native 应用使用 JavaScript 和类 XML 标记混合编写，这种标记被称为 JSX。然后，在底层，React
    Native 的“桥接”（bridge）会调用 Objective-C（用于 iOS）或 Java（用于 Android）中的原生渲染 API。因此，你的应用程序将使用真实的移动
    UI 组件而不是 Webview（webviews）进行渲染，其体验与其他任何其他移动应用程序无异。React Native 为平台 API 暴露了 JavaScript
    接口，因此你的 React Native 应用可以访问摄像头或用户位置等平台功能。


    核心 React Native 项目支持为 iOS 和 Android 编写移动应用程序。社区实现还支持 Windows、Ubuntu 等更多平台。


    在本书中，我们将使用 React Native 构建 Android 和 iOS 应用。我们编写的大部分代码将是跨平台的。


    而且，是的，你可以使用 React Native 构建生产环境级别的移动应用程序。一些案例包括：Facebook、Airbnb、沃尔玛（Walmart）、百度已经在生产环境中使用它面向用户的应用程序。


    # React Native 的优势


    React Native 使用其宿主平台的标准渲染 API 进行渲染这一事实，使其与大多数现有的跨平台应用开发方法（如 Cordova 或 Ionic）区分开来。现有的移动应用方法使用
    JavaScript、HTML 和 CSS 的组合，并且通常在 webviews 内部渲染。虽然这种方法行得通，但也存在缺点，特别是在性能方面。此外，这些方法通常无法访问宿主平台的原生
    UI 元素。这些框架试图模仿原生 UI 元素，但结果通常感觉会有所出入。此外，反向工程化动画的所有细微细节需要巨大的精力，而且它们可能会很快过时。


    相比之下，React Native 实际上会将你的标记翻译为真实的原生 UI 元素，利用你所工作的任何平台上现有的视图渲染方法。此外，React 独立于主
    UI 线程工作，因此你的应用程序可以在不牺牲功能的情况下保持高性能。React Native 的更新周期与 React 相同：当 props 或状态发生变化时，React
    Native 会渲染视图。React Native 和 React 的主要区别在于，React Native 是通过其宿主平台的 UI 库来实现的，而不是使用
    HTML 和 CSS 标记。


    对于习惯于使用 React 在 Web 上工作的开发者来说，这意味着你可以使用熟悉的工具编写具有原生应用性能、外观和体验的移动应用。React Native
    在另外两个领域代表了对普通移动开发的改进：开发者体验和跨平台开发潜力。


    # 开发者体验


    如果你开发过移动应用，你可能会对 React Native 的易用性感到惊讶。React Native 团队已将强大的开发者工具和有意义的错误信息内置到框架中，使得使用健壮工具成为你开发体验的自然部分。


    例如，因为 React Native “仅仅”是 JavaScript，你不需要重新构建应用程序就能看到更改生效；相反，你可以像刷新任何其他网页一样刷新你的应用程序。等待应用程序构建所花费的这些分钟确实非常可观，相比之下，React
    Native 的快速迭代感觉就像天赐之物。


    此外，React Native 允许你利用智能调试工具和错误报告。如果你熟悉 Chrome 或 Safari 的开发者工具（图 1-1），你会很高兴地发现也可以将它们用于移动开发。同样，你可以使用任何喜欢的文本编辑器来编辑
    JavaScript。React Native 确实要求你在 Xcode 中进行 iOS 开发，或在 Android Studio 中进行 Android
    开发。


    ![](img/1a32334c3c38f4c)

    图 1-1. 在 React Native 中使用调试器


