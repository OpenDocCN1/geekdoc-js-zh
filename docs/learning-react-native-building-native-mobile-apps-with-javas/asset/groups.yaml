    # CHAPTER 4


    # Components for Mobile


    In Chapter 3, we built a simple weather app. In doing so, we touched upon the
    basics of building interfaces with React Native. In this chapter, we will take
    a closer look at the mobile-based components used for React Native, and how they
    compare to basic HTML elements. Mobile interfaces are based on different primitive
    UI elements than web pages, and thus we need to use different components.


    This chapter starts with a more detailed overview of the most basic components:
    <View>, <Image>, and <Text>. Then, we will discuss how touch and gestures factor
    into React Native components, and how to handle touch events. Next, we will cover
    higher-level components, such as the tab bars, navigators, and lists, which will
    allow you to combine other views into standard mobile interface patterns.


    # Analogies Between HTML Elements and Native Components


    When developing for the web, we make use of a variety of basic HTML elements.
    These include <div>, <span>, and <img> as well as organizational elements such
    as <ol>, <ul>, and <table>. (We could include a consideration of elements such
    as <audio>, <svg>, <canvas>, and so on, but we will ignore them for now.)


    When dealing with React Native, we don''t use these HTML elements, but we use
    a variety of components that are nearly analogous to them (Table 4-1).'
  - '[PAGE 54]


    # Table 4-1. Analogous HTML and Native components


    | HTML | React Native |

    |---|---|

    | div | <View> |

    | img | <Image> |

    | span,p | <Text> |

    | ul,li | <FlatList,child items


    Although these elements serve roughly the same purposes, they are not interchangeable.
    Let''s take a look at how these components work on mobile with React Native and
    how they differ from their browser-based counterparts.


    # Can I Share Code Between React Native and My Web App?


    Out of the box, React Native supports rendering to Android and iOS. If you want
    to render web-compatible views with React Native, check out react-native-web.

    Regardless of your approach, any JavaScript code—including React components—that
    doesn''t render basic elements can be shared. So, if your business logic is isolated
    from your rendering code, you''ll be able to reuse it.


    # The <Text> Component


    Rendering text is a deceptively basic function; nearly any application will need
    to render text somewhere. However, text within the context of React Native and
    mobile development works differently from text rendering for the web.

    When working with text in HTML, you can include raw text strings in a variety
    of elements. Furthermore, you can style them with child tags such as <strong>
    and <em>. So, you might end up with HTML snippet that looks like this:


    ```

    <p>The quick <em>brown</em> jumped over the lazy <strong>dog</strong>/></p>

    ```


    In React Native, <Text> components may have plain-text nodes as children. In other
    words, this is not valid:


    ```

    <View>

    Text doesn''t go here!

    </View>

    ```


    Instead, wrap your text in a <Text> component:


    ```

    <View>

    <Text>This is OK!</Text>

    </View>

    ```'
