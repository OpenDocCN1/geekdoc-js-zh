    \ time now exploring how it works.\n\nThe basic idea behind flexbox is that you\
    \ should be able to create predictably structured layouts, even with dynamically\
    \ sized elements. Because we're designing for mobile, we need to accommodate multiple\
    \ screen sizes and orientations, this is a useful (dare I say necessary?) feature.\n\
    \nWe'll start with a parent <View> and some children:\n\n```javascript\n<View\
    \ style={styles.parent}>\n  <text style={styles.child}>Child One </text>\n  <text\
    \ style={styles.child}>Child Two </text>\n  <text style={styles.child}>Child Three\
    \ </text>\n</View>\n```\n\nWe've applied some basic styles to the views, but we\
    \ haven't touched the positioning yet:\n\n```javascript\nconst styles = StyleSheet.create({\n\
    \  parent: {\n    backgroundColor: '#F5FCFF',\n    borderColor: '#0099AA',\n \
    \   borderWidth: 5,\n    marginTop: 30\n  },\n  child: {\n    borderColor: '#AA0099',\n\
    \    borderWidth: 2,\n    textAlign: 'center',\n    fontSize: 24\n  }\n});\n```\n\
