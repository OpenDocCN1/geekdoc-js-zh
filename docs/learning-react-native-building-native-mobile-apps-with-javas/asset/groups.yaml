    In order to effectively write native Android components, you''ll want an understanding
    of how Android handles views in general, but looking at other React Native components
    is a good place to start.


    # Cross-Platform Native Modules


    Is it possible to write a cross-platform native module?


    The answer is yes; you just have to implement your module separately for each
    platform, and provide a unified JavaScript interface. This can be a good way to
    handle native-specific optimizations while still maximizing code reuse.


    Creating a cross-platform native module doesn''t require much extra configuration.
    Once you have implemented iOS and Android versions separately, just create a folder
    containing index.js and index.android.js files. Each version should import the
    appropriate module. You can then import that folder, and React Native will pick
    up the platform-appropriate version.


    React Native won''t enforce a consistent API between the iOS and Android versions,
    so that responsibility falls on you. If you want the iOS and Android versions
    to have slightly different APIs, that''s fine.


    # Summary


    So, when is it appropriate to use native Objective-C or Java code? When is it
    a good idea to include third-party modules and libraries? In general, there are
    three main cases for native modules: taking advantage of existing Objective-C
    or Java code; writing high-performance, multithreaded code for tasks such as graphics
    processing; and exposing APIs not yet included in React Native.


    For any existing mobile projects built in Objective-C or Java, writing a native
    module can be a great way to reuse code in React Native applications. While hybrid
    applications are a bit beyond the scope of this book, they''re definitely a feasible
    approach, and you can use native modules to share functionality between JavaScript,
    Objective-C, and Java.


    Similarly, for cases where performance is critical or for specialized tasks, it
    often makes sense to work in the native language of the platform you''re developing
    for. In these cases, you can do the heavy lifting in Objective-C or Java and then
    pass the result back to your JavaScript application.


    Finally, there will inevitably be platform APIs you''ll want to use that aren''t
    yet supported by React Native. In these cases, you have two options. One is to
    turn to the'
