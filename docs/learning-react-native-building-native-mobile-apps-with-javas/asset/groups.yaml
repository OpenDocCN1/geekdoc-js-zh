  - '[PAGE 169]


    # # Simulator Behavior


    You may also see strange behavior in the device simulator from time to time. If
    your application continues to crash repeatedly or it seems changes to your code
    are not being reflected on the simulator, the easiest first step is to delete
    your application from the device.


    Note that simply deleting your application may not have the desired effect; on
    many systems, your app may leave behind files that can cause side effects later.
    As shown in Figure 9-17, the most straightforward way to start over with a clean
    slate on iOS is to reset the device simulator entirely, which removes all files
    and applications from the simulated device.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_169_0.png)


    Figure 9-17. *The Reset Content and Settings...* option will delete everything
    from your device


    Similarly, for Android emulators, you can delete the emulator and start over with
    a fresh device.


    # # Testing Your Code


    Debugging is all well and good, but you''ll also want to prevent errors *before*
    they arise (and catch them when they inevitably do!). Automated tests and static
    checking are useful tools that you''ll probably want to make use of in your applications.


    # ## Testing JavaScript Code


    Much of the React Native code you write may not even be aware that it''s running
    in a mobile environment. For example, any business logic can probably be isolated
    from rendering logic. That means you can test your JavaScript code using whatever
    tools you prefer for ordinary JavaScript development.'
  - "[PAGE 170]\n\nIn this section, we're going to look specifically at type checking\
    \ with Flow and unit testing with Jest.\n\n# Type Checking with Flow\n\nFlow is\
    \ a JavaScript library for static type checking. It relies on type inference to\
    \ detect type errors—even in unannotated code—and allows you to slowly add type\
    \ annotations to existing projects. Type checking can help you detect possible\
    \ issues early and help enforce sane APIs between various components and modules.\n\
    \nYou can install Flow using npm:\n\n```\n$ npm install -g flow-bin\n```\n\nRunning\
    \ Flow is simple:\n\n```\n$ flow check\n```\n\nThe default application comes with\
    \ a .flowconfig file, which configures Flow's behavior. If you find many errors\
    \ related to files in node_modules, you may need to add this to your line in .flowconfig\
    \ under [ignore]:\n\n```\n.*/node_modules/*\n```\n\nYou should then be able to\
    \ run flow check without seeing any errors:\n\n```\n$ flow check\n$ Found 0 errors.\n\
    ```\n\nFeel free to use Flow as you develop your React Native applications.\n\n\
    # Unit Testing with Jest\n\nReact Native supports testing of React components\
    \ using Jest. Jest is a unit testing framework built on top of Jasmine. It provides\
