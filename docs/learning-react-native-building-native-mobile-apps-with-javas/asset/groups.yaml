    \ setup and deploying to a real device. However, it's still a very basic application\
    \ with no user interaction. So now let's try a more full-featured application.\n\
    \n# Building a Weather App\n\nIn this section, we will be building off of the\
    \ sample application to create a weather app. This will give us a chance to explore\
    \ how to utilize and combine stylesheets, flexbox, network communication, user\
    \ input, and images into a useful app we can then deploy to an Android or iOS\
    \ device.\n\nThis section may feel a bit of a blur, as it is giving you an overview\
    \ of these features rather than deep explanations of them. The weather app will\
    \ serve as a useful reference in future sections as we discuss these features\
    \ in more detail, however, don't worry if it feels like we're moving quickly!\n\
    \nAs shown in Figure 3-3, the final application includes a text field where users\
    \ can input a zip code. It will then fetch data from the OpenWeather API and display\
    \ the current weather.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_37_0.png)\n\
    \nFigure 3-3. The finished weather app\n\nThe first thing we'll do is replace\
    \ the default code from our sample app. Move the initial component out to its\
    \ own file, `WeatherProject.js`.\n\nIf you created a full React Native project,\
    \ you will need to replace the contents of index.ios.js and index.android.js,\
    \ as shown in Example 3-5.\n\nExample 3-5. Simplified contents of index.ios.js\
    \ and index.android.js (they should be identical)\n\n```javascript\nimport { AppRegistry\
    \ } from \"react-native\";\nimport WeatherProject from \"../WeatherProject\";\n\
    AppRegistry.registerComponent('WeatherProject', () => WeatherProject);\n```\n\n\
    Similarly, if you created a React Native project with Create React Native App,\
    \ you will need to replace the contents of App.js, as shown in Example 3-6.\n\n\
    Example 3-6. Simplified contents of App.js for Create React Native App projects\n\
    \n```javascript\nimport WeatherProject from \"../WeatherProject\";\nexport default\
    \ WeatherProject;\n```\n\n# Handling User Input\n\nWe want the user to be able\
    \ to enter a zip code and get the forecast for that area, so we need to add a\
    \ text field for user input. We can start by adding zip code information to our\
    \ component's initial state (see Example 3-7).\n\nExample 3-7. Adding zip code\
    \ information to your component, before the render function\n\n```javascript\n\
    constructor(props) {\n  super(props);\n  this.state = { zip: \"\" };\n}\n```\n\
    \nIf you're accustomed to using React.create() to create components instead of\
    \ JavaScript classes, this may seem odd. When creating classes, we set the initial\
    \ state values for React components by mutating this.state variable in the constructor\
    \ method. If you need a review of the React component lifecycle, see the React\
    \ docs.\n\nNext, we should also change one of the <Text> components to display\
    \ this.state.zip, as shown in Example 3-8.\n\nExample 3-8. Adding a <Text> component\
    \ that displays the current zip code\n\n```javascript\n<Text style={styles.welcome}>\n\
    \  You input={this.state.zip} \n</Text>\n```\n\nWith out of the way, let's add\
    \ a <TextInput> component (see Example 3-9). This is a basic component that allows\
    \ the user to enter text.\n\nExample 3-9. The <TextInput> component is used for\
    \ entering text\n\n```javascript\n<TextInput\n  style={styles.input}\n  onChange={this._handleTextChange}/>\n\
    ```\n\nThe <TextInput> component is documented in the React Native docs, along\
    \ with its properties. You can also pass the <TextInput> additional callbacks\
    \ in order to listen to other events, such as onChange or onFocus, but we do not\
    \ need them at the moment.\n\nNote that we've added a simple style to the <TextInput>.\
    \ Add the input style to your stylesheet like so:\n\n```javascript\nconst styles\
    \ = StyleSheet.create({\n  input: {\n    fontSize: 20,\n    borderWidth: 2,\n\
    \    height: 40\n  }\n});\n```\n\nThe callback we passed to the onSubmit prop\
    \ should be added as a function on the component, as shown in Example 3-10.\n\n\
    Example 3-10. The handleText callback for <TextInput>\n\n```javascript\n_handleTextChange\
    \ = event => {\n  this.setState({zip: event.nativeEvent.text});\n};\n```\n\nBy\
    \ using fat-arrow syntax, we ensure that our callback is properly bound to the\
    \ component instance. React avoids lifecycle methods such as render, but for other\
    \ methods we need to pay attention to binding. Fat-arrow functions are covered\
    \ in.\n\nYou will also need to update your import statements, as shown in Example\
    \ 3-11.\n\nExample 3-11. Importing elements in React Native\n\n```javascript\n\
    import React, { StyleSheet, Text, TextInput } from \"react-native\";\n```\n\n\
    Now running your application using either the iOS simulator or Android emulator,\
    \ you should be able to see the zip code reflected in the <Text> component thus.\n\
    \nExample 3-12. This version of WeatherProject.js simply accepts\n\n```javascript\n\
    import React, { Component } from \"react\";\n\nclass WeatherProject extends Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = { zip: \"\" };\n\
    \  }\n\n  _handleTextChanged = event => {\n    this.setState({ zip: event.nativeEvent.text\
    \ });\n  };\n\n  render() {\n    return (\n      <View style={styles.container}>\n\
    \        <Text style={styles.welcome}>\n          You input={this.state.zip}\n\
