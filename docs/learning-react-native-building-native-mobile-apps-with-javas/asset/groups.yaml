    \ 30 像素的偏移，以适应屏幕顶部的状态栏。我们还将将其 `flexDirection` 设置为 `column`：\n\n```\nparent: {\n\
    \  flexDirection: \"column\",\n  position: \"absolute\",\n  top: 0,\n  left: 0,\n\
    \  right: 0,\n  bottom: 0\n}\n```\n\n回看图片，我们可以将布局分为较大的块。这些划分在很多方面都是任意的，所以我们选定一个方案并执行下去。图\
