    Congrats! You''ve created your first React Native app, compiled it, and gotten
    it running on a real device.


    In the next section, we''ll cover how to do a full, traditional installation of
    React Native. You can skip to “Exploring the Sample Code” on page 19 instead if
    you''d like to get started programming.


    # Developer Setup: The Traditional Approach


    Instructions for installing React Native and all of its dependencies can be found
    in the official React Native documentation.


    You can use Windows, macOS, or Linux to develop applications with React Native.
    However, macOS is required to develop iOS applications. Linux and Windows users
    can still use React Native to write Android applications.


    Because the setup instructions vary by platform and React Native version, we won''t
    go into them in detail here, but you''ll need to set up the following:


    +   * node.js

    * React Native

    * iOS development environment (Xcode)

    * Android development environment (JDK, Android SDK, Android Studio)


    If you don''t want to install developer tools for both iOS and Android, that''s
    fine—just make that you have at least one of them set up.


    # Creating Your First Application with react-native


    You can use the React Native command-line tools to create a new application. Run
    the following command to install the command-line tools:


    ```

    npm install -g react-native-cli

    ```


    Now we can generate a fresh project with all of the React Native, iOS, and Android
    boilerplate we''ll need:


    ```

    react-native init FirstProject

    ```'
