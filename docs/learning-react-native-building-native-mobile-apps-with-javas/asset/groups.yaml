    \ probably want to create your own interactive components. For that, we'll need\
    \ to use <TouchableHighlight>.\n\n## Using the <TouchableHighlight> Component\n\
    \nAny interface elements that respond to user touch (buttons, control elements,\
    \ etc.) should usually have a <TouchableHighlight> wrapper. <TouchableHighlight>\
    \ causes an overlay to appear when the view is touched, giving the user visual\
    \ feedback. This is one of the key interactions that causes a mobile application\
