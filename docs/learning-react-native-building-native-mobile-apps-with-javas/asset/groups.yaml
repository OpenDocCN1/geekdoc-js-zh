    \ and touch interactions, <FlatList> includes many performance optimizations to\
    \ speed up rendering and reduce memory usage.\n\n# Working with <SectionList>\n\
    \nThe <SectionList> component is designed for data where you have mostly items\
    \ plus optional section headings. For example, if you wanted to render different\
    \ kinds of best sellers with headings between them, a <SectionList> would be a\
    \ good choice.\n\nA <SectionList> expects sections, renderItem, and renderSectionHeader.\
    \ We'll start with sections, which should be an array where each object must have\
    \ a title and data. The data must look similar to data in <FlatList>: each element\
    \ has a unique key property.\n\nLet's update our _refreshData method to fetch\
    \ both the fiction and nonfiction lists, and update our component's state accordingly.\n\
    \n```javascript\n_refreshData = () => {\n  Promise.all([\n    NYT.fetchBooks(\"\
    hardcover-fiction\"),\n    NYT.fetchBooks(\"hardcover-nonfiction\")\n  ]).then(results\
    \ => {\n    if (results.length !== 2) {\n      console.error(\"Unexpected results\"\
    );\n    }\n\n    this.setState({\n      sections: [\n        {\n          title:\
