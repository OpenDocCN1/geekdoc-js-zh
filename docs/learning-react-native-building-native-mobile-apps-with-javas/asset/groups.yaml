    \      activeOpacity={opacity}\n      onPress={this.props.onPress}\n      style={[this.props.wideButton,\
    \ this.props.style]}>\n    >\n      {this.props.children}\n    </TouchableOpacity>\n\
    \  );\n}\n```\n\n```javascript\nButton.defaultProps = { disabled: false };\nexport\
