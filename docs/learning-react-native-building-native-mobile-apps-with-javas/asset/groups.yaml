    \ 让我们能够访问习惯的控制台和开发者工具，因此在 React Native 中调试基于 JavaScript 的问题应该感觉很熟悉。\n\n# 激活开发者选项\n\
    \n为了利用这些工具，你需要在应用内菜单中启用开发者工具（图 9-1）。你可以通过摇设备访问此菜单。在 iOS 模拟器中，你可以按 Command+D 访问菜单。在\
    \ Android 模拟器中，你可以按 Command+M（Mac）或 Control+M（Windows）。从那里开始，你可以选择 Chrome 来启用开发者工具。\n\
    \n图 9-1. 从 Android（左侧）和 iOS（右侧）查看的应用内菜单\n\n注意，开发者菜单在生产版本中是禁用的。如果你使用 Expo 应用（即用\
    \ Expo 创建的应用），相同的快捷键也会打开开发者菜单（见图 9-2）。\n\n## 使用 console.log 调试\n\n调试最基础、常见的形式之一是“打印出来看看发生了什么”的策略。对于许多\
    \ Web 开发者来说，在代码中添加 `console.log` 是工作流中无意识的一部分。JavaScript 控制台在 React Native 中开箱可用；你不需要任何特殊配置即可使用打印语句。\n\
    \n使用 Xcode 时，你将在 Xcode 控制台中看到你的控制语句（图 9-3）。注意，你可以通过调整可见面板来扩展分配给控制台的空间。\n\n图 9-3.\
    \ 在 Xcode 中查看控制台输出\n\n同样，你可以在项目根目录下运行 logcat 来查看设备的日志（图 9-4 显示了输出）：\n\n```\nadb\
    \ logcat\n10:22:13.289 F : get_init:Unknown buffer: 0xbadf0d\n10:22:13.458 I :\
    \ Starting logcat\n10:22:13.468 W : Warning Native component for \"ReactNativeView\"\
    \ with props {tag:root} --- _DEV_ --- true, true\nlevel-warning are ON; performance\
    \ optimizations are OFF\n10:22:13.502 I : Native component for \"ReactNativeView\"\
    \ with props applied\n10:22:13.528 D : Activity already freed, Ignoring focus\
    \ gain of: com.android.view.InputMethodClient$Stub\n10:22:13.542 D : CONSOLE.LOG\
    \ IN LOGCAT:\n```\n\n图 9-4. logcat 中带有 \"ReactNativeJS\" 标签的控制台输出\n\n然而，这些视图相当杂乱，并且包含了与平台特定内容相关的日志。控制台输出带有\
    \ ReactNativeJS 标签，因此我们可以运行：\n\n```bash\nadb logcat | grep ReactNativeJS\n```\n\
    \n我们可以跳转到基于浏览器的开发者工具以获得更熟悉、更简洁的体验。激活开发者菜单并选择 Debug Remote JS（远程调试 JS），然后在 Web\
    \ 浏览器中打开控制台。如图 9-5 所示，你将看到 Chrome 开发者工具的控制台输出。\n\n### 9-5. 在 Chrome 中查看控制台输出\n\
    \n注意，你需要在此处打开控制台才能看到内容。\n\n这是如何工作的？当你启用远程 JavaScript 调试加载 React Native 时，浏览器将使用标准的\
    \ `<script>` 标签从 React Native 打包器加载你的 React Native JavaScript 代码，因此你拥有完全基于浏览器的调试控制。程序使用\
    \ WebSockets 在设备和浏览器之间进行通信。\n\n我们不需要太担心细节；我们只需要知道如何利用这些工具！\n\n除了使用 `console.log`\
    \ 之外，你还可以利用 `console.warn` 或 `console.error`。在开发版本中，`console.warn` 将应用程序顶部显示一个黄色框，而来自\
    \ `console.error` 的消息将显示全屏红色消息。这些视觉指示在生产版本中会被禁用，因此你不需要担心它们被显示给终端用户。\n\n# 使用 JavaScript\
    \ 调试器\n\n你可以像通常 Web 开发一样使用 JavaScript 调试器。在 Chrome 中打开开发者工具并切换到 source（源码）标签页，你的断点就会被激活。你可以在图\
    \ 9-6 中看到其实效果。\n\n注意，与 JavaScript 控制台类似，如果你还没有打开开发者工具面板，调试器可能不会在断点处激活。同样，如果你没有启用\
    \ Debug Remote JS，调试器将不会激活。\n\n图 9-6. 使用调试器\n\n# 使用 React Developer Tools\n\n\
    当你使用 React 开发 Web 时，React 开发者工具非常好。它们允许你检查组件层次结构、查看组件的 props 和 state，并从浏览器修改状态。React\
    \ 开发者工具作为 Chrome 扩展可用。\n\nReact 开发者工具适用于 React Native。你需要安装独立版本以便与 React Native\
    \ 使用：\n\n```bash\nnpm install -g react-devtools\n```\n\n通过运行以下命令启动图 9-7 所示的开发工具：\n\
    \n```bash\nreact-devtools\n```\n\n"
