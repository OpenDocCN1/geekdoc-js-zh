- md: "\nIn many ways, these action creators act as convenience functions. For example,\
    \ the addDeck action creator takes a deck name as a parameter and then handles\
    \ the actual construction of a Deck.\n\n## Reducers\n\nActions represent things\
    \ that happened in your application. Reducers describe how your application state\
    \ changes in response to actions. A reducer is a \"pure function\": it has no\
    \ side effects, and its return value is determined only by its inputs. (Don't\
    \ call Math.random in a reducer)\n\nThe simplest reducer we could write like this:\n\
    \n```javascript\nconst reducer = (state = {}, action) => {\n  return state;\n\
    }\n```\n\nOur state is going to contain two items: an array of decks and information\
    \ about the current review. The default state will look like:\n\n```javascript\n\
    decks: [],\nCurrentReview: {\n  deckID = null,\n  questions: [],\n  currentQuestionIndex\
    \ = 0\n}\n```\n\nLet's start our first reducer by looking at the ADD_DECK action.\
    \ Looking back at actions/creators.js, we see the following:\n\n```javascript\n\
    {\n  type: ADD_DECK,\n  data: new Deck(name)\n}\n```\n\nIf we want to write a\
    \ reducer for the decks key, the signature needs to look like this:\n\n```javascript\n\
    const decksReducer = (state = [], action) => {\n  // returns some state\n}\n```\n\
    \nWe want to add the new deck from our action to the existing state, so let's\
    \ implement the deckReducer.\n\n```javascript\nconst deckReducer = (state = [],\
    \ action) => {\n  switch (action.type) {\n    case ADD_DECK:\n      return state.concat(action.data);\n\
    \  }\n  return state;\n}\n```\n\nFirst, we need a switch statement based on the\
    \ action's type. We're only handling the ADD_DECK action for now. In all other\
    \ cases we return the original state, unmodified. This is very important—don't\
    \ forget to handle the default case!\n\nThen, if the action type is in fact ADD_DECK,\
    \ we concatenate the new deck to our existing state and return it.\n\nNow let's\
    \ implement the rest of the deckReducer (see Example 11-3).\n\nExample 11-3. src_checkpoint_03/reducers/decks.js\n\
    \n```javascript\nimport { ADD_DECK, ADD_CARD } from \"../actions/types\";\n\n\
    function decksWithNewCard(oldDecks, card) {\n  return oldDecks.map(deck => {\n\
    \    if (deck.id === card.deckID) {\n      deck.addCard(card);\n      return deck;\n\
    \    } else {\n      return deck;\n    }\n  });\n}\n```\n\n```javascript\nconst\
    \ reducer = (state = [], action) => {\n  console.warn(\"Changes are not persisted\
    \ to disk\");\n  switch (action.type) {\n    case ADD_DECK:\n      return state.concat(action.data);\n\
    \    case ADD_CARD:\n      return decksWithNewCard(state, action.data);\n  }\n\
    \  return state;\n};\n```\n\n```javascript\nexport default reducer;\n```\n\nNext,\
    \ let's look at the review reducers (Example 11-4). This reducer will handle the\
    \ REVIEW_DECK, NEXT_REVIEW, and STOP_REVIEW actions. Handling STOP_REVIEW is simple:\
    \ we replace the state with the default state. For NEXT_REVIEW, we increment the\
    \ review index. Handling REVIEW_DECK is somewhat more complex because we have\
    \ to take a deck of cards and generate questions based on it.\n\nExample 11-4.\
    \ src_checkpoint_03/reducers/reviews.js\n\n```javascript\nimport { mkReviews }\
    \ from \"../data/QuizCardView\";\nimport { REVIEW_DECK, NEXT_REVIEW, STOP_REVIEW\
    \ } from \"../actions/types\";\n```\n\n```javascript\nexport const mkReviewState\
    \ = (\n  deck = null,\n  questions = [],\n  currentQuestionIndex = 0\n) => {\n\
    \  return { deckID, questions, currentQuestionIndex };\n};\n\nfunction findDeck(decks,\
    \ id) {\n  return decks.find(d => (\n    return d.id === id;\n  ));\n}\n\nfunction\
    \ generateReviews(deck) {\n  return mkReviewState(deck.id, mkReviews(deck.cards),\
    \ 0);\n}\n\nfunction nextReview(state) {\n  return mkReviewState(\n    state.deckID,\n\
    \    state.questions,\n    state.currentQuestionIndex + 1\n  );\n}\n\nconst reducer\
    \ = (state = mkReviewState(), action, decks) => {\n  switch (action.type) {\n\
    \    case REVIEW_DECK:\n      return generateReviews(findDeck(decks, action.deckID));\n\
    \    case NEXT_REVIEW:\n      return nextReview(state);\n    case STOP_REVIEW:\n\
    \      return mkReviewState();\n  }\n  return state;\n};\n\nexport default reducer;\n\
    ```\n\nNote that this reducer depends on deck information, so its signature is\
    \ slightly different than the deckReducer.\n\nNow let's wire them together. In\
    \ Redux, you only connect a single reducer to your store, so we combine these\
    \ into one reducer (see Example 11-5).\n\nExample 11-5. src_check_point_03/reducers/index.js\n\
    \n```javascript\nimport { MockDecks, MockCards } from \"../data/Mocks\";\nimport\
    \ DecksReducer from \"../decks\";\n```\n\n```javascript\nimport ReviewReducer,\
    \ { mkReviewState } from \"./reviews\";\n\nconst initialState = () => {\n  return\
    \ { decks: MockDecks, currentReview: mkReviewState() };\n};\n\nexport const reducer\
    \ = (state = initialState(), action) => {\n  let decks = DecksReducer(state.decks,\
    \ action);\n\n  return {\n    decks: decks,\n    currentReview: ReviewReducer(state.currentReview,\
    \ action, decks)\n  };\n};\n```\n\nNow that we've written Redux-specific code,\
    \ the next step is to integrate it into our actual application.\n\n## Connecting\
    \ Redux\n\nRemember how we said that state is located in a single Redux store?\
    \ Let's open up components/Flashcard.js, which is the root component for our application,\
    \ and create that store.\n\nFirst we need to import the createStore method from\
    \ redux, as well as the reducer that we created in reducers/index.js. Then we\
    \ can create the store.\n\n```javascript\nimport { createStore } from \"redux\"\
    ;\nimport { reducer } from \"../reducers/index\";\n```\n\n```javascript\nlet store\
    \ = createStore(reducer);\n```\n\nNext, in order to use this store from our application,\
    \ we need to add a <Provider> component.\n\nWrapping your application's root component\
    \ in a <Provider> makes the Redux store available to any component at any part\
    \ of the component hierarchy. Remember, state in Redux is read-only, so there's\
    \ no risk of complications from reading state at any point in the component hierarchy.\
    \ <Provider> is part of the react-redux package.\n\nLet's weigh that in. Example\
    \ 11-6 shows the full component file after we integrate our Redux store.\n\nExample\
    \ 11-6 src_checkpoint_03/components/Flashcards.js\n\n```javascript\nimport React,\
    \ { Component } from \"react\";\nimport { StyleSheet, View } from \"react-native\"\
    ;\nimport { StackNavigator } from \"react-navigation\";\nimport { createStore\
    \ } from \"redux\";\n```\n\n```javascript\nimport { Provider } from \"react-redux\"\
    ;\n\nimport { reducer } from \"../reducers/index\";\n\nimport Logo from \"../Header/Logo\"\
    ;\nimport DeckScreen from \"../DeckScreen\";\nimport NewCardScreen from \"../NewCardScreen\"\
    ;\nimport ReviewScreen from \"../ReviewScreen\";\n\nlet store = createStore(reducer);\n\
    \nlet headerOptions = {\n  headerStyle: { backgroundColor: \"#FFFFFF\" },\n  headerLeft:\
    \ <Left />\n};\n\nconst Navigator = StackNavigator({\n  Home: { screen: DeckScreen,\
    \ navigationOptions },\n  Review: { screen: ReviewScreen, navigationOptions },\n\
    \  CardCreation: {\n    screen: NewCardScreen,\n    path: \"deckID\"\n  }\n});\n\
    \nclass App extends Component {\n  render() {\n    return (\n      <Provider store={store}>\n\
    \        <Navigator />\n      </Provider>\n    );\n  }\n}\n\nexport default App;\n\
    ```\n\nNow that we've integrated Redux, let's use it to render some data. We'll\
    \ start by modifying the DeckScreen component to display decks based on the Redux\
    \ store.\n\nIn order to connect a given component to Redux store, we will use\
    \ the react-redux bindings.\n\n```javascript\nimport { connect } from \"react-redux\"\
    ;\n```\n\nThen we need to define two functions: mapStateToProps and mapDispatchToProps.\
    \ mapStateToProps describes how the Redux store's state will be provided to this\
    \ component as props. Our state includes an array of decks. We'll want to calculate\
    \ the counts here.\n\n```javascript\nconst mapStateProps = state => {\n  return\
    \ {\n    decks: state.decks,\n    counts: state.decks.reduce(\n      (sum, deck)\
    \ => {\n        sum[deck.id] = deck.cards.length;\n        return sum;\n     \
    \ }\n    )\n  };\n};\n```\n\nMeanwhile, mapDispatchToProps defines the props that\
    \ a component will receive, which can be used to dispatch actions. We need to\
    \ import our action creators and then invoke them from here.\n\n```javascript\n\
    import { addDeck, reviewDeck } from \"../../actions/creators\";\n\nconst mapDispatchProps\
    \ = dispatch => {\n  return {\n    createDeck: deckAction => {\n      dispatch(deckAction);\n\
    \    },\n    reviewDeck: deckID => {\n      dispatch(reviewDeck(deckID));\n  \
    \  }\n  };\n};\n```\n\nFinally, we need to connect() to create a Redux-connected\
    \ component.\n\nPulling it all together, we use these new props (reviewDeck, createDeck,\
    \ decks, and counts) in our component. Now, the <DecksScreen> will render based\
    \ on props received from Redux, and it will also dispatch actions instead of modifying\
    \ state directly (see Example 11-7).\n\nExample 11-7. src_checkpoint_03/DecksScreen/index.js\n\
    \n```javascript\nimport React, { Component } from 'react';\nimport { View } from\
    \ 'react-native';\n\nimport { connect } from 'react-redux';\n\nimport { Mocks\
    \ } from \"../../data/Mocks\";\nimport { addDeck, reviewDeck } from \"../../actions/creators\"\
    ;\nimport Deck from \"./Deck\";\nimport DeckCreation from \"./DeckCreation\";\n\
    \nclass DecksScreen extends Component {\n  // implementation details...\n}\n\n\
    export default connect(mapStateProps, mapDispatchProps)(DecksScreen);\n```\n"
  mdcn: "\n在许多方面，这些操作创建器（action creators）充当了便利函数。例如，`addDeck` 操作创建器接收一个名称作为参数，然后处理\
    \ `Deck` 的实际构建。\n\n## Reducers（还原器）\n\nActions 代表你的应用程序中发生的事件。Reducers 描述了应用程序状态如何响应\
    \ actions 发生变化。一个 reducer 是一个“纯函数”：它没有副作用，且其返回值仅取决于它的输入。（不要在 reducer 中调用 `Math.random`）\n\
    \n我们能写的最简单的 reducer 像如下所示：\n\n```javascript\nconst reducer = (state = {}, action)\
    \ => {\n  return state;\n}\n```\n\n我们的状态将包含两个项：decks 数组和关于当前复习的信息。默认状态看起来如下：\n\
    \n```javascript\ndecks: [],\nCurrentReview: {\n  deckID = null,\n  questions:\
    \ [],\n  currentQuestionIndex = 0\n}\n```\n\n让我们通过观察 `ADD_DECK` 操作开始编写第一个 reducer。回看\
    \ `actions/creators.js`，我们看到：\n\n```javascript\n{\n  type: ADD_DECK,\n  data:\
    \ new Deck(name)\n}\n```\n\n如果我们想为 `decks` 键编写一个 reducer，其签名需要如下：\n\n```javascript\n\
    const decksReducer = (state = [], action) => {\n  // 返回某些状态\n}\n```\n\n我们想要将 action\
    \ 中的新 deck 添加到现有状态中，因此让我们来实现 `deckReducer`。\n\n```javascript\nconst deckReducer\
    \ = (state = [], action) => {\n  switch (action.type) {\n    case ADD_DECK:\n\
    \      return state.concat(action.data);\n  }\n  return state;\n}\n```\n\n首先，我们需要一个基于\
