    \n## 选择如何处理触摸\n\n你应该如何决定何时使用本节讨论的触摸和手势 API？这取决于你想要构建的内容。\n\n为了给用户提供基础反馈，并指示按钮或其他元素是“可点击的”，请使用\
    \ `<TouchableHighlight>` 组件。\n\n为了实现你自定义的触摸界面，可以使用 `PanResponder`。如果你正在设计一个游戏或具有特殊界面的应用程序，你将需要花费一些时间来构建你想要的自定义触摸交互。\n\
    \n对于许多应用程序，你不需要实现任何自定义的触摸处理。在下一节中，我们将查看一些为你实现常用 UI 模式的高级组件。\n\n## 列表操作\n\n许多移动用户界面将列表作为核心元素。你可以在\
    \ Dropbox、Twitter 和 iOS 设置中看到这种交互模式（图 4-4）。列表的核心只是一个带有某些子视图的滚动容器。这种看似简单的设计模式是许多移动界面的不可或缺的。\n\
    \n![](img/1a32334c3c38f46e3c4219c7d228280e_69_0.png)\n\n### 图 4-4. Dropbox、Twitter\
    \ 和 iOS 设置应用中使用的列表\n\nReact native 使用带有方便 API 的列表组件。`<FlatList>` 组件设计用于处理数据变化但结构相似的长列表。它内置了多项性能优化。`<SectionList>`\
    \ 组件用于被划分为逻辑分区的数据，带有分区标题，类似于 iOS 的 `UITableView`。`<FlatList>` 和 `<SectionList>`\
    \ 共同涵盖了大多数常见用例，但如果你需要深入底层并添加一些列表处理，请查看 `<VirtualizedList>`。\n\n优化列表渲染性能是一个棘手的问题，因为不同的用例需要不同的方法。你的用户是在快速滑动联系人列表以寻找某人，还是在浏览图片流？你拥有的是同质列表，还是每个子项都不同？如果性能很重要，请留心你的列表。\n\
    \n在本节中，我们将构建一个显示《纽约时报》畅销榜的应用程序，并让你查看每本书书的数据，如图 4-5 所示。我们将构建两个版本，一个使用 `<FlatList>`，另一个使用\
    \ `<SectionList>`。\n\n如果你愿意，可以从《纽约时报》获取自己的 API 。否则，使用示例代码中包含的 API Token。\n\n列表操作\
