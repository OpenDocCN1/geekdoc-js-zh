    variables. Because CSS is not explicitly connected to the HTML elements it styles,
    dead code elimination is difficult, and it can be nontrivial to determine which
    styles will apply to a given element.


    Languages like SASS and LESS attempt to work around some of CSS''s ugly parts,
    but many of the fundamental problems remain. With React, we have the opportunity
    to keep the desirable parts of CSS, but also the freedom for significant divergence.
    React Native implements a subset of the available CSS styles, focusing on keeping
    the styling API narrow yet highly expressive. Positioning is dramatically different,
    as we will see later in this chapter. Additionally, React Native does not support
    pseudoclasses, animations, or selectors. A full list of supported properties can
    be found in the docs.


    Instead of stylesheets, in React Native we work with JavaScript-based style objects.
    One of React''s greatest strengths is that it forces you to keep your JavaScript—your
    components—modular. By bringing styles into the realm of JavaScript, React Native
    pushes us to write modular styles, too.


