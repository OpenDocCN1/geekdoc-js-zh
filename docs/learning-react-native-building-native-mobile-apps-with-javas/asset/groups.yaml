    # CHAPTER 2


    # Working with React Native


    In this chapter, we''ll cover the bridge, and review how React Native works under
    the hood. Then, we''ll look at how React Native components differ from their web
    counterparts, and cover what you''ll need to know in order to create and style
    components for mobile.


    If you''d prefer to dig into the development process and see React Native in action,
    feel free to jump ahead to Chapter 3.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_19_0.png)


    # How Does React Native Work?


    The idea of writing mobile applications in JavaScript feels a little odd. How
    is it possible to use React in a mobile environment? In order to understand the
    technical underpinnings of React Native, we first need to recall one of React''s
    concepts: the Virtual DOM.


    In React, the Virtual DOM acts as a layer between the developer''s description
    of things they ought to and the work done to actually render your application
    onto the page. To render interactive user interfaces in a browser, developers
    must edit the browser''s DOM, or Document Object Model. This is an expensive step,
    and excessive writes to the DOM have a significant impact on performance. Rather
    than directly render changes on the page, React computes the necessary changes
    in-memory and rerenders the minimal amount necessary. Figure 2-1 shows how this
    works.'
  - '[PAGE 20]


    ![](img/1a32334c3c38f46e3c4219c7d228280e_20_0.png)


    Figure 2-1. Performing calculations in the Virtual DOM limits rerendering in the
    browser''s DOM


    In the context of React on the web, developers think of the Virtual DOM as a performance
    optimization. The Virtual DOM certainly has performance benefits, but its real
    potential lies in the power of its abstraction. Placing a clean abstraction layer
    between the developer’s code and the actual rendering opens up a lot of interesting
    possibilities. What if React could render to a target other than the browser’s
    DOM? After all, React "understands" what your application is *supposed* to look
    like.


    Indeed, this is how React Native works, as shown in Figure 2-2. Instead of rendering
    to the browser’s DOM, React Native invokes Objective-C APIs to render to iOS components,
    or Java APIs to render Android components. This sets React Native apart from other
    cross-platform app development options, which often end up rendering web-based
    views.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_20_1.png)


    Figure 2-2. React can render to different targets'
  - '[PAGE 21]


    This is all possible because of the bridge, which provides React with an interface
    into the host platform''s native UI elements. React components return markup from
    their render function, which describes how they should look. With React for the
    web, this translates directly to the browser''s DOM. For React Native, this markup
    is translated to suit the host platform, so a <View> might become an iOS-specific
    UIView.


    The core React Native project supports iOS and Android. Because of the abstraction
    layer provided by the Virtual DOM, React Native can target other platforms,—someone
    needs to write the bridge. For example, there are community implementations of
    React Native for Windows and Ubuntu, so you can also use React Native to create
    desktop applications.


    # Rendering Lifecycle


    If you are accustomed to working in React, the React lifecycle should be familiar
    to you. When React runs in the browser, the render lifecycle begins by mounting
    your React components (Figure 2-3).


    | Page Renders | Mount React component to the DOM | Render React component |


    Figure 2-3. Mounting components in React


    After that, React handles the rendering and rerendering of your component as necessary
    (Figure 2-4).


    | State/props change | Compute diff in Virtual DOM | Render React component |


    Figure 2-4. Rendering components in React


    For the render stage, the developer returns HTML markup from a React render method,
    which React then renders directly into the page as necessary.


    For React Native, the lifecycle is the same, but the rendering process is slightly
    different because React Native depends on the bridge. We looked at the bridge
    briefly in Figure 2-2. The bridge translates JavaScript calls and invokes the
    host platform''s underlying APIs and UI elements (i.e., Objective-C or Java, as
    appropriate). Because React Native doesn''t run on the main UI thread, it can
    perform these asynchronous calls without impacting the user''s experience.'
  - '[PAGE 22]


    # Creating Components in React Native


    All React code can lives in React components. React Native components are largely
    the same as ordinary React components, with some important differences around
    rendering and styling.


    # Working with Views


    When writing in React for the web, you render normal HTML elements (`<div>`, `<p>`,
    `<span>`, `<a>`, etc.). With React Native, all of these elements are replaced
    by platform-specific React components (see Table 2-1). The most basic is the cross-platform
    `<View>`, a simple and flexible UI element that can be thought of as analogous
    to the `<div>`. On iOS, for instance, the `<View>` component renders to a `UIView`,
    whereas on Android it renders to a View.


    Table 2-1. Basic elements for the web compared with React Native


    | React | React Native |

    | <div> | <View> |

    | <span> | <Text> |

    | <li>, <ul> | <FlatList>, items |

    | <img> | <Image> |


    Other components are platform-specific. For instance, the DatePickerIOS component
    (predictably) renders the iOS standard date picker (Figure 2-5). Here is an excerpt
    from the RNTTester sample app, demonstrating an iOS analog an iOS date picker.
    The usage is straightforward, as you would expect:


    ```

    <DatePickerIOS

    date={this.state.date}

    mode="time"/>

    ```


    ![](img/1a32334c3c38f46e3c4219c7d228280e_22_0.png)'
  - '[PAGE 23]


    Because all of our UI elements are now React components rather than basic HTML
    elements, you will need to explicitly import each component you want to use. For
    instance, we need to import the <DatePickerIOS> component like so:


    ```

    import { DatePickerIOS } from "react-native";

    ```


    The ReactNative application, which is bundled in the React Native GitHub project,
    allows you to view all of the supported UI elements. I encourage you to examine
    the various elements included in the RNTester app. It also demonstrates many styling
    options and interactions.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_23_0.png)


    Platform-specific components and APIs have special tags in the name as a suffix
    in documentation, and typically—for example, <TabBarIOS> and <ToolbarAndroid>.


    Because these components vary from platform to platform, how you structure your
    React components becomes more important when you''re working in React Native.
    In for web, we have a mix of React components: some manage logic and their child
    components, while others render markup. If you want to reuse code when working
    in React Native, maintaining separation between these types of components becomes
    critical. A <DatePickerIOS> encapsulates the associated logic can be reused. For
    Android, However, the visual component can be swapped out on your platform. You
    can also designate platform-specific versions of components if you want, so you
    could choose a picker.ios.js and a picker.android.js file, with a separate implementation
    of the same component. We''ll cover this in “Components with Platform-Specific
    Implementations” on page 134.


    # Using JSX


    In React Native, just as in React, we write our views using JSX, combining markup
    and the JavaScript that controls it into a single file. JSX met with strong reactions
    when React first debuted. For many web developers, the development of files based
    on technologies is given: keep your CSS, HTML, and JavaScript files separate.
    The idea of combining markup, control logic, and even styling into one language
    can be confusing.


    JSX prioritizes the separation of concerns over the separation of technologies.
    In React Native, this is even more strictly enforced. In a world without the browser,
    it makes even more sense to unify your styles, markup, and behavior in a single
    file for each component. Accordingly, your .js files in React Native are in fact
    JSX files. If you''ve been using vanilla JavaScript, you will want to transition
    to JSX syntax for your work in React Native.'
- md: "\nIf you've never rendered JSX before, don't worry: it's pretty simple. As\
    \ an example, a pure-JavaScript React component for the web might look something\
    \ like this:\n\n```javascript\nclass HelloMessage extends React.Component {\n\
    \  render() {\n    return React.createElement(\n      \"div\",\n      null,\n\
    \      \"Hello \\n\" + this.props.name\n    );\n  }\n}\n```\n\nReactDOM.render(HelloMessage,\
    \ { name: \"Bonnie\" }, mountNode);\n\nWe can render this much succinctly by using\
    \ JSX. Instead of calling React.createElement and passing in a list of HTML attributes,\
    \ we use XML-like markup:\n\n```javascript\nclass HelloMessage extends Component\
    \ {\n  render() {\n    // Instead of calling createElement, we return markup\n\
    \    return <div>{this.props.name}</div>\n  }\n}\n```\n\n// We no longer need\
    \ a createElement here\nReactDOM.render(<HelloMessage name=\"Bonnie\" />, mountNode);\n\
    \nBoth of these will render the following HTML onto the page:\n\n```html\n<div>Hello\
    \ Bonnie</div>\n```\n\n## Styling Native Components\n\nOn the web, we style React\
    \ components using CSS, just as we would any other HTML element. Whether you love\
    \ it or hate it, CSS is a necessary part of the web. React also does not affect\
    \ the way we write CSS. But it makes it easier to dynamically build class names\
    \ based on props, and otherwise React is mostly agnostic about how we handle styles\
    \ on the web.\n\nNon-web platforms have a wide array of approaches to layout and\
    \ styling. We work with React Native, thankfully, we utilize one standardized\
    \ approach to styling. Part of the bridge between React and the host platform\
    \ includes the implementation of a heavily pruned subset of CSS. This narrow implementation\
    \ of CSS relies primarily on flexbox for layout, and focuses on simplicity rather\
    \ than implementing the full range of CSS rules. Unlike the web, where CSS support\
    \ varies across browsers, React Native is able to enforce consistent support of\
    \ style rules. As with the various UI elements, you can see many examples of supported\
    \ styles in the RNTester application, which is one of the examples that ships\
    \ with React Native.\n\nReact Native also insists on the use of inline styles,\
    \ which exist as JavaScript objects. The React team has advocated for this approach\
    \ before in React web applications. If you have previously experimented with inline\
    \ styles in React, the syntax will look familiar to you:\n\n```javascript\n//\
    \ Define a style...\nconst style = {\n  backgroundColor: 'white',\n  fontSize:\
    \ '16px'\n};\n\n//...and then apply it.\nconst txt = (\n  <Text style={style}>\n\
    \    A styled Text\n  </Text>\n);\n```\n\nReact Native also provides utilities\
    \ for creating and extending style objects that making inline styles a more manageable\
    \ process. We will explore these later in Chapter 5.\n\nDoes looking at inline\
    \ styles make you twitch? If you're coming from a web-based background, this is\
    \ a break from standard practices. Working with style objects, as opposed to styles,\
    \ takes some mental adjustments and changes the way you need to writing styles.\
    \ In the context of React Native, it is a useful shift. We will be discussing\
    \ best practices and workflow in Chapter 5. Just try not to be surprised when\
    \ you see them in use!\n\n## Host Platform APIs\n\nPerhaps the biggest difference\
    \ between React for the web and React Native is the way we think about host platform\
    \ APIs. On the web, we often deal with fragmentation and inconsistent adoption\
    \ of standards; still, most browsers support a common core of shared features.\
    \ With React Native, however, platform-specific APIs play a much larger role in\
    \ creating an excellent, natural-feeling user experience. There are also many\
    \ options to consider. Mobile API include everything from data storage to location\
    \ services to accessing hardware such as the camera. Unconventional platforms\
    \ lead to even more interesting APIs—what the interface look like between React\
    \ Native and a virtual reality headset, for instance?\n\nBy default, React Native\
    \ for iOS and Android includes support for many commonly used features, and React\
    \ Native can support any asynchronous API. We will take a look at many of them\
    \ throughout this book. React Native makes it straightforward and simple to use\
    \ host platform APIs, so you can experiment freely. Be sure to think about what\
    \ feels *right* for your target platform, and design with natural interactions\
    \ in mind.\n\nInevitably, the React Native bridge will not expose all platform\
    \ functionality. If you find yourself in need of an unsupported feature, you have\
    \ the option of adding it to React Native yourself. Alternatively, chances are\
    \ good that someone else has done so already, be sure to check for community implementations.\
    \ We’ll cover this in Chapter 7.\n\nIt is also worth noting that utilizing host\
    \ platform APIs has implications for code reuse. React components that need platform-specific\
    \ functionality will be platform-specific as well. Isolating and encapsulating\
    \ those components will bring added flexibility to your application. Of course,\
    \ this applies for the web, too: if you plan on sharing code between React Native\
    \ and React, keep in mind that things like the DOM do not actually exist in React\
    \ Native.\n\n## Summary\n\nWriting components for mobile is a bit different in\
    \ React Native when compared with React for the web. JSX is mandatory, and our\
    \ basic building blocks are now components such as `<View>` in lieu of HTML elements\
    \ as `<<div>>`. Styling is also quite different, based on a subset of CSS, and\
    \ we assign styles with inline syntax. Still, these adjustments are quite manageable.\
    \ In the next chapter, we’ll put this into practice as we build our first application!\n\
    \n## Building Your First Application\n\nIn this chapter, we will cover how to\
    \ set up your local development environment for working with React Native. Then\
    \ we will go through the basics of creating a simple application that you can\
    \ deploy to your own iOS or Android device.\n\n## Setting Up Your Environment\n\
    \nSetting up your development environment will enable you to follow along with\
    \ the examples in the book and write your own applications.\n\nThere are two general\
    \ approaches to setting up a development environment for React Native. The first,\
    \ a tool called Create React Native App, gives you a quicker, easier installation\
    \ but supports only pure-JavaScript applications. The second, more traditional\
    \ approach involves fully installing React Native and all of its dependencies.\
    \ Think of Create React Native App as a shortcut for easier testing and prototyping.\n\
    \nInformation on migrating from React Native App to a full React Native project\
    \ can be found in [Appendix C].\n\n> Which approach should you take? I recommend\
    \ that beginners use Create React Native App for educational purposes and quick\
    \ prototyping.\n\n> Eventually, if you're working on a React Native app professionally\
    \ or writing a hybrid app that uses both JavaScript and native Java, Objective-C,\
    \ or Swift code, you'll want to install the full React Native developer setup.\n\
    \nBoth approaches are described next. The example code in subsequent chapters\
    \ will typically work with either approach; when something is incompatible with\
    \ Create Native App and requires a full React Native project, it will be noted.\n\
    \n## Developer Setup: Create React Native App\n\nCreate Native App is a command-line\
    \ tool that allows you to quickly create and run React Native applications without\
    \ needing to install Xcode or Android Studio.\n\nIf you want to get up and running\
    \ quickly, then Create React Native App is the right choice.\n\nCreate React Native\
    \ App is a great tool, but as mentioned earlier it supports only pure-JavaScript\
    \ applications. Later in this book, we will discuss ways of integrating React\
    \ Native applications with native code written in Java or Objective-C. Don't worry:\
    \ if you begin with Create React Native App, you can still \"eject\" into a full\
    \ React Native project.\n\nLet's start by installing the create-react-native-app\
    \ package from npm. React Native uses npm, Node.js package manager to manage dependencies.\
    \ The npm registry includes packages for all sort of JavaScript projects, not\
    \ just Node.\n\n```\nnpm install -g create-react-native-app\n```\n\n## Creating\
    \ Your First Application with create-react-native-app\n\nTo create a new project\
    \ with Create React Native App, run the following command:\n\n```\ncreate-react-native-app\
    \ first-project\n```\n\nThis will install some JavaScript dependencies, as well\
    \ as the boilerplate for your application. Your project directory will look something\
    \ like this:\n\n+- App.js\n App.test.js\n README.md\n App.json\n node_modules\n\
    \ package.json\n yarn.lock\n\nThis structure looks like what you might expect\
    \ from a simple JavaScript project. There is a package.json file, which contains\
    \ metadata about the project and its dependencies. The README.md file includes\
    \ information for running the project. App.test.js includes a simple test file.\
    \ The code for your application is located in\n"
