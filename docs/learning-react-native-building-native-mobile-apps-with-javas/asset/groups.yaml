- md: "\n# Using the Platform Module\n\nThere's a second option for writing platform-specific\
    \ code: The Platform module. The API provides information about the operating\
    \ system and OS version that your application is running on.\n\n```javascript\n\
    import { Platform } from 'react-native';\n\nconsole.log(\"What OS am I using?\"\
    );\nconsole.log(Platform.OS);\n\nconsole.log(\"What version of the OS?\");\nconsole.log(Platform.Version);\
    \ // e.g., 25 for Android Nougat\n```\n\nThe Platform API can be useful when you\
    \ want to adjust a few elements on the platform but don't want to write fully\
    \ separate component implementations. One use case is for stylesheets, such as\
    \ when you have different color schemes for different platforms.\n\n```javascript\n\
    import { Platform, StyleSheet } from 'react-native';\n\nconst styles = StyleSheet.create({\n\
    \  color: (Platform.OS === \"ios\") ? \"#FF6666\" : \"#DD4444\",\n});\n```\n\n\
    # When to Use Platform-Specific Components\n\nWhen is it appropriate to use a\
    \ platform-specific component? In most cases, you'll want to do so when there's\
    \ a platform-specific interaction pattern that your application should adhere\
    \ to. If you want your application to feel truly \"native,\" it's worth paying\
    \ attention to platform-specific UI norms.\n\nApple and Google provide both human\
    \ interface guidelines for their platforms which are worth consuming:\n\n- iOS\
    \ Human Interface Guidelines\n- Android Design Reference\n\nBy creating platform-specific\
    \ versions of only certain components, you can strike a balance between code reuse\
    \ and platform-based customization. In most cases, you should only need separate\
    \ implementations of a handful of components in order to support both iOS and\
    \ Android.\n\n# Debugging and Developer Tools\n\nAs you develop your own applications,\
    \ chances are something will go wrong along the way. When it's time to debug your\
    \ applications, you happily have some React Native-specific tools that will make\
    \ the job easier. There are also nasty bugs that can crop up at the intersection\
    \ of React Native and its host. In this chapter, we'll dig into the common pitfalls\
    \ of React Native development and the tools you can use to tackle them. And because\
    \ any discussion of debugging would be incomplete without reference, we'll also\
    \ cover the basics of setting up for your React Native code.\n\n# JavaScript Debugging\
    \ Practices\n\nWhen working with React for the web, we have a number of common\
    \ JavaScript-based tools and techniques to help us debug applications. Most of\
    \ these are also available for React Native, though occasionally with some minor\
    \ adjustments. React Native gives us access to the console and developer tools\
    \ that we're accustomed to, so debugging JavaScript-based issues in React Native\
    \ should feel familiar.\n\n# Activating the Developer Options\n\nIn order to avail\
    \ yourself of these tools, you'll need to enable Developer Tools in the in-app\
    \ menu (Figure 9-1). You can access this menu by shaking the device. In the iOS\
    \ simulator, you can access the menu by pressing Command+D. In an Android emulator,\
    \ you can press Command+M (if Mac) or Control+M (if Windows). From there, you\
    \ can select Chrome to enable the Developer Tools.\n\nFigure 9-1. The in-app menu,\
    \ as viewed from Android (left) and iOS (right)\n\nNote that the developer menu\
    \ is disabled in production builds. If you’re using an Expo app (i.e., created\
    \ with Expo), the same shortcuts will open the developer menu (see Figure 9-2).\n\
    \n## Debugging with console.log\n\nOne of the most basic and common forms of debugging\
    \ is the \"print it out and see what’s happening\" tactic. For many web-based\
    \ developers, being able to add console.log to their code is an unconscious part\
    \ of their workflow. The JavaScript console works out of the box with React Native;\
    \ you don’t need to do any special configuration in order to use print statements.\n\
    \nWhen using Xcode, you will see your console statements in the Xcode console\
    \ (Figure 9-3). Note that you can expand how much room is allotted to the console\
    \ by tweaking the visible panes.\n\nFigure 9-3. Console output viewed in Xcode\n\
    \nSimilarly, you can view the logs for your device by running logcat on your project's\
    \ root (Figure 9-4 shows the output):\n\n```\nadb logcat\n10:22:13.289 F : get_init:Unknown\
    \ buffer: 0xbadf0d\n10:22:13.458 I : Starting logcat\n10:22:13.468 W : Warning\
    \ Native component for \"ReactNativeView\" with props {tag:root} --- _DEV_ ---\
    \ true, true\nlevel-warning are ON; performance optimizations are OFF\n10:22:13.502\
    \ I : Native component for \"ReactNativeView\" with props applied\n10:22:13.528\
    \ D : Activity already freed, Ignoring focus gain of: com.android.view.InputMethodClient$Stub\n\
    10:22:13.542 D : CONSOLE.LOG IN LOGCAT:\n```\n\nFigure 9-4. Console output appears\
    \ with the tag of \"ReactNativeJS\" in logcat\n\nHowever, these views are rather\
    \ cluttered and also include logging related to platform-specific things. Console\
    \ output is tagged with ReactNativeJS, so we can instead run:\n\n```bash\nadb\
    \ logcat | grep ReactNativeJS\n```\n\nWe can hop over into the browser-based developer\
    \ tools for a more familiar—and cleaner—experience. Activate the developer menu\
    \ and select Debug Remote JS, and then open the console in your web browser. As\
    \ shown in Figure 9-5, you will be able to see the console output from the Chrome\
    \ developer tools.\n\n### 9-5. Console output as viewed in Chrome\n\nNote that\
    \ you need to open the console before you will see things here.\n\nHow does this\
    \ work? When you load your React Native application with remote-JavaScript debugging\
    \ enabled, the browser loads your React Native JavaScript code from the React\
    \ Native packer using a standard `<script>` tag, so that you have full browser-based\
    \ debugging control. The packager uses WebSockets to communicate between the device\
    \ and the browser.\n\nWe don't need to be too concerned with the specifics; we\
    \ just need to know how to take advantage of these tools!\n\nIn addition to using\
    \ `console.log`, you can also utilize `console.warn` or `console.error`. In developer\
    \ builds, `console.warn` will display a yellow box at the top of your application,\
    \ while messages from `console.error` will display a full-screen red message.\
    \ These visual indicators will be disabled in production builds so you don't need\
    \ to worry about them being displayed to end users.\n\n# Using the JavaScript\
    \ Debugger\n\nYou can also use the JavaScript debugger just as you normally would\
    \ for web-based development. Open up the developer tools in Chrome and switch\
    \ to the source tab, and your breakpoints will be activated. You can see this\
    \ in action Figure 9-6.\n\nNote that, similar to the JavaScript console, if you\
    \ don't already have the developer tools pane open, the debugger may not be activated\
    \ on your breakpoints. Likewise, if you don't have Debug Remote JS enabled, the\
    \ debugger will not be activated.\n\nFigure 9-6. Using the debugger\n\n# Working\
    \ with the React Developer Tools\n\nWhen you're developing with React for the\
    \ web, the React developer tools are quite useful. They allow you to inspect the\
    \ component hierarchy, examine the props and state of components, and modify the\
    \ state from your browser. The React developer tools are available as a Chrome\
    \ extension.\n\nThe React developer tools work with React Native as well. You'll\
    \ need to install the standalone version to use them with React Native:\n\n```bash\n\
    npm install -g react-devtools\n```\n\nThen launch the DevTools, shown in Figure\
    \ 9-7, by running:\n\n```bash\nreact-devtools\n```\n"
