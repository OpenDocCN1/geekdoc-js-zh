    \ <DecksScreen>, we implement mapDispatchProps and mapStateToProps for each of\
    \ them.\n\n# Persisting Data with AsyncStorage\n\nRight now, our flashcard application\
    \ state is not persisted, if we add new decks and then restart the app, our data\
    \ is lost. Let's fix this by saving the application's state with AsyncStorage.\n\
    \nThis is an example of how Redux can shine: because our state management is centralized,\
    \ making this change simpler than it would otherwise be. remember, AsyncStorage.getItem\
    \ and AsyncStorage.setItem are both asynchronous APIs.\n\nExample 11-0. checkpoint_04/decks.js\n\
    \n```javascript\nimport { AsyncStorage } from \"react-native\";\nimport Deck from\
    \ \"../data/Deck\";\nimport { MockDecks } from \"../data/Mocks\";\n\nconst DECK_KEY\
    \ = \"flashcards-decks\";\n\nasync function read(key, deserializer) {\n  try {\n\
    \    let val = await AsyncStorage.getItem(key);\n    if (val !== null) {\n   \
    \   let readValue = JSON.parse(val).map(deserializer);\n      return readValue;\n\
    \    } else {\n      console.info(`${key} not found on disk.`);\n      return\
    \ [];\n    }\n  } catch (error) {\n    console.warn(\"AsyncStorage error: \",\
    \ error.message);\n  }\n}\n\nasync function write(key, item) {\n  try {\n    await\
    \ AsyncStorage.setItem(key, JSON.stringify(item));\n  } catch (error) {\n    console.error(\"\
    AsyncStorage error: \", error.message);\n  }\n}\n\nexport const readDecks = ()\
    \ => {\n  return read(DECK_KEY, Deck.from);\n};\n\nexport const writeDecks = decks\
    \ => {\n  return write(DECK_KEY, decks);\n};\n\n// For debug/test purposes.\n\
    const replaceData = writeDecks(MockDecks);\n```\n\nRemember that Redux state has\
    \ two elements: decks and currentReview. Because currentReview is transient information,\
    \ we only need to worry about saving decks.\n\nNow that we have an easy way of\
    \ reading and writing our decks to AsyncStorage, let's add a new action type,\
    \ LOAD_DATA, in actions/types.js, as shown in Example 11-11.\n\nExample 11-1.\
    \ Adding a new type to src_checkpoint_04/actions/types.js\n\n```javascript\nexport\
    \ const LOAD_DATA = \"LOAD_DATA\";\n```\n\nWe also need an accompanying action\
