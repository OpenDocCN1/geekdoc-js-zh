- md: "\nApp.js. To modify this project and build out your own application, you would\
    \ begin with App.js.\n\nWe will cover what this code is doing in detail once we\
    \ start building our weather application in \"Building a Weather App\" on page\
    \ 22.\n\n## Previewing Your App on iOS or Android\n\nGreat—now your application\
    \ is ready for testing. To launch your application, run:\n\n```\ncd first-project\n\
    npm start\n```\n\nYou should see the screen shown in Figure 3-1.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_29_0.png)\n\
    \nFigure 3-1. Previewing a Create React Native App by using a QR code\n\nIn order\
    \ to view your application, you'll need the Expo app for iOS or Android. Once\
    \ you have it installed, point your phone's camera at the QR code, and your React\
    \ Native app will load. Note that your phone and computer will need to be on the\
    \ same network, and able to communicate with each other.\n\nCongrats! You've created\
    \ your first React Native app, compiled it, and gotten it running on a real device.\n\
    \nIn the next section, we'll cover how to do a full, traditional installation\
    \ of React Native. You can skip to “Exploring the Sample Code” on page 19 instead\
    \ if you'd like to get started programming.\n\n## Developer Setup: The Traditional\
    \ Approach\n\nInstructions for installing React Native and all of its dependencies\
    \ can be found in the official React Native documentation.\n\nYou can use Windows,\
    \ macOS, or Linux to develop applications with React Native. However, macOS is\
    \ required to develop iOS applications. Linux and Windows users can still use\
    \ React Native to write Android applications.\n\nBecause the setup instructions\
    \ vary by platform and React Native version, we won't go into them in detail here,\
    \ but you'll need to set up the following:\n\n- node.js\n- React Native\n- iOS\
    \ development environment (Xcode)\n- Android development environment (JDK, Android\
    \ SDK, Android Studio)\n\nIf you don't want to install developer tools for both\
    \ iOS and Android, that's fine—just make that you have at least one of them set\
    \ up.\n\n## Creating Your First Application with react-native\n\nYou can use the\
    \ React Native command-line tools to create a new application. Run the following\
    \ command to install the command-line tools:\n\n```bash\nnpm install -g react-native-cli\n\
    ```\n\nNow we can generate a fresh project with all of the React Native, iOS,\
    \ and Android boilerplate we'll need:\n\n```bash\nreact-native init FirstProject\n\
    ```\n\nThe resulting directory structure should look similar to the following:\n\
    \n```\n__tests___\n├── android\n|   ├── app.json\n|   ├── index.android.js\n|\
    \   └── index.ios.js\n├── ios\n|   ├── node_modules\n|   ├── package.json\n| \
    \  └── yarn.lock\n```\n\nThe ios and android/ directories contain boilerplate\
    \ relevant to those platforms. Your React code is located in the index.ios.js\
    \ and index.android.js files, which are the respective entry points for your React\
    \ application. Dependencies installed via npm can, as usual, be found in the node_modules/\
    \ folder.\n\n## Running Your App on iOS\n\nTo run your app on iOS, start by navigating\
    \ into your newly created project's directory. Then you can run your React Native\
    \ application like so:\n\n```bash\ncd FirstProject\nreact-native run-ios\n```\n\
    \nAlternatively, you can open your application in Xcode and launch the iOS simulator\
    \ from here:\n\n```bash\nopen ios/FirstProject.xcodeproj\n```\n\nYou can also\
    \ use Xcode to upload your application to a real device for testing. In order\
    \ to do this, you will need a free Apple ID so that you can configure code signing.\n\
    \nTo configure code signing, open your project in the Xcode Project Navigator\
    \ and select your main target, which should have the same name as your project.\
    \ Next, select the General tab. Under the Signing menu, select your Apple developer\
    \ account from the Team drop-down (see Figure 3-2). You will then need to repeat\
    \ this step for the Tests target.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_32_0.png)\n\
    \nFigure 3-2: Setting the Team in Xcode will allow you to run your application\
    \ on a physical device\n\nThe first time you attempt to run your application on\
    \ any particular device, Xcode will prompt you to sign into your Apple account\
    \ and register your device for development.\n\nFor more details on how to run\
    \ your application on a real iOS device, check out Apple's official documentation.\n\
    \nNote that your iOS device and your computer must be on the same network in order\
    \ for your application to run.\n\n## Running Your App on Android\n\nIn order to\
    \ run your application on Android, you need a fully functioning Android developer\
    \ setup, including Android Studio and the Android SDK. See the Getting Started\
    \ documentation for a list of Android dependencies.\n\nTo launch your React Native\
    \ platform on Android, run:\n\n```bash\nreact-native run-android\n```\n\nYou can\
    \ also open your application in Android Studio and compile and run it from there.\n\
    \nYou can either run your application in the Android emulator or on a physical\
    \ device connected via USB. In order to run on a physical device, you will need\
    \ to enable USB debugging in your device's Developer Options. More detailed instructions\
    \ are available in the Android Studio documentation.\n\n## Exploring the Sample\
    \ Code\n\nNow that you have launched and deployed the default application, let's\
    \ figure out how it works. In this section, we will dig into the source code of\
    \ the default application and explore the structure of a React Native project.\n\
    \nIf you are using Create React Native App, open the file App.js (see Example\
    \ 3-1). If you are using a full React Native project, open up index.ios.js or\
    \ index.android.js (see Example 3-2).\n\nExample 3-1. The starter code in App.js,\
    \ for Create React Native App projects\n\n```javascript\nimport React from 'react';\n\
    import { StyleSheet, Text, View } from 'react-native';\n\nexport default class\
    \ App extends React.Component {\n  render() {\n    return (\n      <View style={styles.container}>\n\
    \        <Text>Hello, world!</Text>\n      </View>\n    );\n  }\n}\n\nconst styles\
    \ = StyleSheet.create({\n  container: {\n    flex: 1,\n    backgroundColor: \"\
    #fff\",\n    alignItems: \"center\",\n    justifyContent: \"center\"\n  }\n});\n\
    ```\n\nExample 3-2. The starter code in index.ios.js and index.android.js, for\
    \ full React Native projects\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport {\n  AppRegistry,\n  StyleSheet,\n  Text,\n  View\n} from 'react-native';\n\
    \nexport default class FirstProject extends Component {\n  render() {\n    return\
    \ (\n      <View style={styles.container}>\n        <Text style={styles.welcome}>\n\
    \          Welcome to React Native!\n        </Text>\n        <Text style={styles.instructions}>\n\
    \          To get started, edit index.ios.js\n        </Text>\n        <Text style={styles.instructions}>\n\
    \          Press Cmd+R to reload, Cmd-D or shake for dev menu\n        </Text>\n\
    \      </View>\n    );\n  }\n}\n\nconst styles = StyleSheet.create({\n  container:\
    \ {\n    flex: 1,\n    justifyContent: 'center',\n    alignItems: 'center',\n\
    \    backgroundColor: '#F5FCFF',\n  },\n  welcome: {\n    fontSize: 20,\n    textAlign:\
    \ 'center',\n    margin: 10,\n  },\n  instructions: {\n    textAlign: 'center',\n\
    \    color: '#333333',\n    marginBottom: 5,\n  }\n});\n\nAppRegistry.registerComponent('FirstProject',\
    \ () => FirstProject);\n```\n\nEither way, let's talk about what is going on.\
    \ As you can see in Example 3-3, the import statements used are a bit different\
    \ than what you might expect from a web-based React project.\n\nExample 3-3. Importing\
    \ UI elements in React Native\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport {\n  StyleSheet,\n  Text,\n  View\n} from 'react-native';\n\
    ```\n\nThere's some interesting syntax going on here. React is imported as usual,\
    \ but what is happening on the next line?\n\nOne quirk of working with React Native\
    \ is that you need to explicitly import every Native-provided module you work\
    \ with. Elements like <div> don't simply exist; instead, you need to explicitly\
    \ import components like <View> and <Text>. Library functions as StyleSheet and\
    \ AppRegistry also must be explicitly imported with this syntax. Once we start\
    \ building our own applications, will you explore the other React Native functions\
    \ that you may need to import.\n\nIf the syntax is unfamiliar to you, check out\
    \ Example A-4 in Appendix A for an explanation of destructuring in ES6.\n\nNext,\
    \ let's look at the component class in Example 3-4. This should look familiar\
    \ because it is an ordinary React component. The main difference is its use of\
    \ <Text> and <View> components instead of <div> and <span>, and the use of style\
    \ objects.\n"
