    \n## 探索示例代码\n\n现在你已经启动并部署了默认应用程序，让我们来看看它是如何工作的。在这一节中，我们将深入默认应用程序的源代码并探索 React\
    \ Native 项目的结构。\n\n如果你使用的是 Create React Native App，请打开 `App.js` 文件（见示例 3-1）。如果你使用的是完整的\
