    ```\n\nWithin index.js, we can import styles like so:\n\n```javascript\nimport\
    \ styles from \"./styles\";\n```\n\nThen we can use them in our component (Example\
    \ 5-7).\n\nExample 5-7. Importing styles from an external JavaScript file\n\n\
    ```javascript\nimport { Component } from \"react\";\nimport { StyleSheet, View,\
    \ Text } from \"react-native\";\nimport styles from \"./styles\";\n\nclass ComponentName\
    \ extends Component {\n  render() {\n    return (\n      <Text style={[styles.text,\
    \ styles.bold]}>\n        Hello, world\n      </Text>\n    );\n  }\n}\n```\n\n\
    ## Passing Styles as Props\n\nStyles may also be passed as properties on a component.\
    \ You can use this pattern to create extensible components, which can be effectively\
    \ controlled by their parents. For example, a component might take an optional\
    \ style prop (Example 5-8). This is a good way to mimic the \"cascading\" behavior\
    \ of CSS.\n\nExample 5-8. Components can receive style objects via props\n\n```javascript\n\
    import React, { Component } from \"react\";\nimport { View, Text } from \"react-native\"\
    ;\n\nclass CustomizableText extends Component {\n  render() {\n    return (\n\
    \      <Text style([{fontSize: 18}, ...this.props.style]}>\n        Hello, world\n\
    \      </Text>\n    );\n  }\n}\n```\n\nBy adding this.props.style to the end of\
    \ the styles array, we ensure that you can override the default props.\n\n## Reusing\
    \ and Sharing Styles\n\nWe typically prefer to reuse styled components rather\
    \ than reusing styles, but there are clearly some instances where you will want\
    \ to share styles between components. In this case, a common pattern is to organize\
    \ your project roughly like so:\n\n- components\n  - Button\n    - index.js\n\
    \    - styles.js\n- styles\n  - styles.js\n  - colors.js\n  - fonts.js\n\nBy having\
    \ separate directories for components and styles, you can keep the intended use\
    \ of each file clear based on context. A component's folder should contain its\
    \ React class, as well as any component-specific files. Shared styles should be\
    \ kept out of component folders. Shared styles may include things such as your\
    \ palette, fonts, standardized margins and padding, and so on.\n\nstyles/styles.js\
    \ imports the other shared files and exposes them; then your components can import\
    \ styles.js and use shared files as needed. Or you may prefer to have components\
    \ import specific stylesheets from the styles/ directory instead.\n\nBecause we've\
    \ now moved our styles into JavaScript, organizing them is really a question of\
    \ general code organization—there is no single correct approach here.\n\n## Positioning\
    \ and Designing Layouts\n\nOne of the biggest changes when working with styling\
    \ in React Native is positioning. CSS supports a proliferation of positioning\
    \ techniques. Between float, absolute positioning, tables, block layout, and more,\
    \ it's easy to get lost! React Native's approach to positioning is more focused,\
    \ relying primarily on flexbox as well as absolute positioning, with the familiar\
    \ properties of margin and padding. In this section, we'll look at how layouts\
    \ are constructed in React Native, and finish off by building a layout in the\
    \ style of Mondrian painting.\n\n## Using Layouts with Flexbox\n\nFlexbox is a\
    \ CSS3 layout mode. Unlike existing layout modes such as block and inline, flexbox\
    \ uses a directional way of constructing layouts. (That's right: finally, vertically\
    \ centering is easy!) React Native leans heavily on flexbox. If you want to read\
    \ more about the general specification, MDN documentation is a good place to start.\n\
    \nWith React Native, the following flexbox props are available:\n\n- flex\n- flexDirection\n\
    - flexWrap\n- alignSelf\n- alignItems\n\nAdditionally, these related values impact\
    \ layout:\n\n- height\n- width\n- margin\n- border\n- padding\n\nIf you have worked\
    \ with flexbox on the web before, there won't be manyే here. Because flexbox is\
