    # CHAPTER 6


    # Platform APIs


    When building mobile applications, you will naturally want to take advantage of
    the host platform’s specific APIs. React Native makes it easy to access things
    like the phone’s camera roll, roll, location, and persistent storage. These platform
    APIs are made available to React Native through included modules, which provide
    us with easy-to-use asynchronous JavaScript interfaces to these capabilities.


    React Native does not wrap all of its host’s functionality by default; some platform
    APIs will require you to either write your own modules, or use modules written
    by others in the React Native community. We will cover that process in Chapter
    7. The docs are the best place to check if an API is supported.


    This chapter covers some of the available platform APIs. For our example, we’ll
    add geolocation to the app so it detects the user’s location automatically. We
    will also add “memory” to the app so it will remember your previously searched
    locations. Finally, we’ll use the camera roll to change the background image to
    one of the user’s photos.


    While relevant code snippets will be presented in each section, the full code
    for the application is included in “The SmarterWeather Application” on page 104.


    # Using Geolocation


    For mobile applications, knowing the user’s location is often critical. It allows
    you to serve the user contextually relevant information. Many mobile applications
    make extensive use of this data.


    React Native has built-in support for geolocation. This is provided as a platform-agnostic
    “polyfill.” It returns data based on the MDN Geolocation API web specification.
    Because we’re using the Geolocation specification, you won’t need to deal with'
- md: "\nplatform-specific APIs like Location Services, and any location-aware code\
    \ you write should be fully portable.\n\n## Reading the User’s Location\n\nUsing\
    \ the Geolocation API to get a user's location is a breeze. As shown in Example\
    \ 6-1, we need to make a call to navigator.geolocation.\n\nExample 6-1. Getting\
    \ the user's location with a navigator.geolocation call\n\n```javascript\nnavigator.geolocation.getCurrentPosition(\n\
    \  (position) => {\n    console.log(position);\n  },\n  (error) => alert(error.message),\n\
    \  {enableHighAccuracy: true, timeout: 20000, maximumAge: 1000}\n);\n```\n\nThe\
    \ position will be printed to the JavaScript console; see \"Debugging with console\"\
    \ on page 141 for more information on how to work with the code.\n\nIn conformance\
    \ with the Geolocation specification, we don't import the location API as a separate\
    \ module; it is simply available for our use.\n\nThe getCurrentPosition call takes\
    \ three arguments: a success callback, an error callback, and a set of geoOptions.\
    \ Only the success callback is required.\n\nThe position object passed to the\
    \ success callback will contain coordinates, as well as a timestamp. Example 6-2\
    \ shows the format and possible values.\n\nExample 6-2. Shape of the response\
    \ returned from a getCurrentPosition call\n\n```javascript\n{\n  coords: {\n \
    \   speed:-1,\n    longitude:-122.03031802,\n    latitude:37.332955199998,\n \
    \   accuracy:500,\n    heading:-1,\n    altitude:0,\n    altitudeAccuracy:-1\n\
    \  },\n  timestamp:459780747046.385\n}\n```\n\ngeoOptions should be an object,\
    \ which optionally includes the timeout, enableHighAccuracy, and maximumAge. timeout\
    \ is probably the most relevant of the bunch when it comes to affecting your application\
    \ logic.\n\nNote that this won't actually work until you add the proper permissions\
    \ to either your Info.plist file (for iOS) or your AndroidManifest.xml file (for\
    \ Android), as we'll discuss next.\n\n## Handling Permissions\n\nLocation data\
    \ is sensitive information, and therefore will not be accessible to your application\
    \ by default. Your application should be able to handle permissions being accepted\
    \ or rejected.\n\nMost mobile platforms have some notion of location permissions.\
    \ A user may opt to block Location Services entirely on iOS, for instance, or\
    \ they may manage permissions on a per-app basis. It's important to note that\
    \ location permissions can be revoked at essentially any point in time. Your application\
    \ should always be prepared for a geolocation call to fail.\n\nIn order to access\
    \ location data, first you will need to declare that your application intends\
    \ to use location data.\n\nOn iOS, you'll need to add the key LocationWhenInUsageDescription\
    \ in your Info.plist file. This should be included by default when you create\
    \ a React Native application.\n\nOn Android, you'll need to add the following\
    \ to your AndroidManifest.xml file:\n\n```xml\n<uses-permission android:name=\"\
    android.permission.ACCESS_FINE_LOCATION\" />\n```\n\nThe first time your application\
    \ attempts to access the user's location, the user will be presented with a permissions\
    \ dialog like the one shown in Figure 6-1.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_107_0.png)\n\
    \nFigure 6-1. Location request\n\nWhile this dialog is active, neither callback\
    \ will fire; once the user selects an option, the appropriate callback will be\
    \ invoked. This setting will persist for your application, so the next time such\
    \ a check won't be necessary.\n\nIf the user denies permissions, you can fail\
    \ silently if you want, but most apps use an alert dialog to request permissions\
    \ again.\n\n## Testing Geolocation in Emulated Devices\n\nChances are, you'll\
    \ be doing most of your testing and development from within a simulator, or at\
    \ the very least, at your desk. How can you test how your app will behave at different\
    \ locations?\n\nThe iOS simulator allows you to easily spoof a different location.\
    \ By default, you'll be placed near Apple HQ in California, but you can specify\
    \ any coordinates as well by navigating to Debug -> Location -> Custom Location...,\
    \ as shown in Figure 6-2.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_108_0.png)\n\
    \nSimilarly, on Android, you can select which GPS coordinates to send (Figure\
    \ 6-3). You can even import data and control the playback speed to simulate changing\
    \ locations.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_109_0.png)\n\nFigure\
    \ 6-3. Picking a location from the Android emulator\n\nIt's good practice to try\
    \ out different locations as part of your testing process. For rigorous testing,\
    \ of course, you will want to load your application onto an actual device.\n\n\
    ## Watching the User's Location\n\nYou can also set a watch on the user's location,\
    \ and receive updates whenever it changes. This can be used to track a user's\
    \ location over time, or to ensure that your app receives the most up-to-date\
    \ position:\n\n```javascript\nthis.watchID = navigator.geolocation.watchPosition((position)\
    \ => {\n  this.setState({position: position});\n});\n```\n\nNote that you'll need\
    \ to clear the watch when your component unmounts as well:\n\n```javascript\n\
    componentWillUnmount() {\n  navigator.geolocation.clearWatch(this.watchID);\n\
    }\n```\n\n## Working Around Limitations\n\nBecause geolocation is based on the\
    \ MDN specification, it leaves out more advanced location-based features. For\
    \ example, iOS provides a Geofencing API, which allows your application to receive\
    \ notifications when the user enters or leaves a designated geographical region\
    \ (the geofence). React Native does not expose this API.\n\nThis means that if\
    \ you want to use location-based features that aren't included in the Geolocation\
    \ MDN specification, you'll need to port them yourself.\n\n## Updating the Weather\
    \ Application\n\nThe SmarterWeather application is an updated version of the weather\
    \ application, which now makes use of the Geolocation API. You can see these changes\
    \ in Figure 6-4.\n\nMost notable is a new component, <LocationButton>, which fetches\
    \ the user's current location and invokes a callback when pressed. The code for\
    \ the <LocationButton> is shown in Example 6-3.\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_110_0.png)\n\
    \nFigure 6-4. Displaying forecast based on the user's current location\n\nExample\
    \ 6-3. smarter-weather/LocationButton/index.js: when pressed, the button gets\
    \ the user's location\n\n```javascript\nimport React, { Component } from \"react\"\
    ;\n\nimport Button from \"../Button\";\nimport styles from \"./style.js\";\n\n\
    const style = { backgroundColor: \"#DDDDDD\" };\nclass LocationButton extends\
    \ Component {\n  onPress() {\n    navigator.geolocation.getCurrentPosition(\n\
    \      initialPosition => {\n        this.props.onCoords(\n          initialPosition.coords.latitude,\n\
    \          initialPosition.coords.longitude\n        );\n      },\n      error\
    \ => {\n        alert(error.message);\n      },\n      { enableHighAccuracy: true,\
    \ timeout: 20000, maximumAge: 1000 }\n    );\n  }\n\n  render() {\n    return\
    \ (\n      <Button\n        label=\"Use Current Location\"\n        style={style}\n\
    \        onPress={this.onPress.bind(this)}\n      />\n    );\n  }\n}\nexport default\
    \ LocationButton;\n```\n\nThe <Button> component used by <LocationButton> is included\
    \ at the end of this chapter; it simply wraps a <Text> component in an appropriate\
    \ <TouchableHighlight> with some basic styling.\n\nWe've also had to update the\
    \ main weather_project.js file to accommodate two kinds of queries (Example 6-4).\
    \ Frankly, the OpenWeatherMap API allows us to query by latitude and location\
    \ as well as zip code.\n\nExample 6-4. Adding getForecastCoords and getForecastZip\
    \ functions\n\n```javascript\nconst WEATHER_API_KEY = 'b32babef60ad507f893e7440a12b0b';\n\
    const API_STEM = 'http://api.openweathermap.org/data/2.5/weather?';\n```\n\n```javascript\n\
    _getForecastForZip: function(zip) {\n  this._getForecast(\n    `${API_STEM}q=${zip}&units=imperial&appid=${WEATHER_API_KEY}`\n\
    \  );\n}\n\n_getForecastCoords: function(lat, lon) {\n  this._getForecast(\n \
    \   `${API_STEM}lat=${lat}&lon=${lon}&units=imperial&appid=${WEATHER_API_KEY}`\n\
    \  );\n},\n\n_getForecast: function(url) {\n  fetch(url)\n    .then((response)\
    \ => response.json())\n    .then((responseJSON) => {\n      console.log(responseJSON);\n\
    \      this.setState({\n        forecast: {\n          main: responseJSON[0].main,\n\
    \          description: responseJSON[0].description,\n          temp: responseJSON.main.temp\n\
    \        }\n      });\n    })\n    .catch((error) => {\n      console.error(error);\n\
    \    });\n}\n```\n\nThen we include the <LocationButton> in the main view with\
    \ _getForecastCoords as the callback:\n\n```javascript\n<LocationButton onCoords={this._getForecastCoords}/>\n\
    ```\n\nRelevant updates are not shown here, as the fully updated application code\
    \ will be included at the end of this chapter.\n\nThere’s plenty of work left\
    \ to do if you wanted to add this to users—for example, a more complete app would\
    \ include better error messages and additional UI feedback. But basic location\
    \ fetching is surprisingly straightforward!\n\n## Accessing the User’s Images\
    \ and Camera\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_112_0.png)\n\nProject\
    \ with Native Code Required\n\nThe examples in this section apply only to projects\
    \ created with react-native-init, or ejected projects created with react-native-app.\
    \ For more information, Appendix C.\n\nHaving access to a phone’s local images\
    \ and camera is another critical part of many mobile applications. In this section,\
    \ we’ll explore our options for interacting with users’ image data as well as\
    \ the camera.\n"
  mdcn: "\n平台特定的 API（如位置服务 Location Services）以及你编写的任何位置位置的代码都应该具有完全的可移植性。\n\n## 读取用户的位置\n\
    \n使用 Geolocation API 获取用户位置非常轻而易举。如示例 6-1 所示，我们需要调用 `navigator.geolocation`。\n\
    \n示例 6-1. 通过 `navigator.geolocation` 调用获取用户位置\n\n```javascript\nnavigator.geolocation.getCurrentPosition(\n\
    \  (position) => {\n    console.log(position);\n  },\n  (error) => alert(error.message),\n\
    \  {enableHighAccuracy: true, timeout: 20000, maximumAge: 1000}\n);\n```\n\n位置将打印到\
    \ JavaScript 控制台；有关如何处理这些代码的更多信息，请参阅第 141 页的“使用 console 调试”。\n\n根据 Geolocation\
    \ 规范，我们没有将位置 API 作为单独模块导入；它直接可供我们使用。\n\n`getCurrentPosition` 调用接受三个参数：一个成功回调、一个错误回调以及一组\
    \ `geoOptions`。只需要成功回调即可。\n\n传递给成功回调的位置对象将包含坐标以及时间戳。示例 6-2 显示了其格式和可能的值。\n\n示例\
    \ 6-2. `getCurrentPosition` 调用返回的响应结构\n\n```javascript\n{\n  coords: {\n    speed:-1,\n\
    \    longitude:-122.03031802,\n    latitude:37.332955199998,\n    accuracy:500,\n\
    \    heading:-1,\n    altitude:0,\n    altitudeAccuracy:-1\n  },\n  timestamp:459780747046.385\n\
    }\n```\n\n`geoOptions` 应该是一个对象，可选包含 `timeout`、`enableHighAccuracy` 和 `maximumAge`。在影响应用程序逻辑方面，`timeout`\
    \ 可能是这些选项中最相关的。\n\n请注意，在向 `Info.plist` 文件（iOS）或 `AndroidManifest.xml` 文件（Android）添加适当权限之前，这实际上不会生效，我们将在下文中讨论。\n\
    \n## 处理权限\n\n位置数据是敏感信息，因此默认情况下你的应用程序无法访问。你的应用程序应该能够处理权限被接受或拒绝的情况。\n\n大多数移动平台对位置权限都有某种概念。例如，用户可能在\
    \ iOS 上选择完全阻止位置服务，或者他们可能会按应用管理权限。需要注意的是，位置权限可以在几乎任何时间被撤销。你的应用程序应该始终做好地理位置调用失败的准备。\n\
    \n为了访问位置数据，首先你需要声明你的应用程序意图使用位置数据。\n\n在 iOS 上，你需要在 `Info.plist` 文件中添加 `LocationWhenInUsageDescription`\
    \ 键。在创建 React Native 应用程序时，该项默认会被包含在。\n\n在 Android 上，你需要在 `AndroidManifest.xml`\
    \ 文件中添加以下内容：\n\n```xml\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
    \ />\n```\n\n当你的应用程序首次尝试访问用户位置时，用户将看到类似图 6-1 所示的权限对话框。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_107_0.png)\n\
    \n图 6-1. 位置请求\n\n当此对话框处于状态时，两个回调都不会触发；一旦用户选择了某个选项，就会调用相应的回调。此设置将对你的应用程序持久，因此下次进行此类检查时就不再需要了。\n\
    \n如果用户拒绝了权限，你可以选择静默失败，但大多数应用会使用警报对话框再次请求权限。\n\n## 在模拟设备中测试地理位置\n\n很有可能，你大部分的测试和开发将在模拟器中进行，或者至少在你的办公桌前。你如何测试应用在不同位置的表现呢？\n\
    \niOS 模拟器允许你轻松伪造不同的位置。默认情况下，你将被放置在加州的 Apple总部附近，但你也可以导航到 `Debug -> Location ->\
    \ Custom Location...` 来指定任何坐标，如图 6-2 所示。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_108_0.png)\n\
    \n同样，在 Android 上，你可以选择要发送哪些 GPS 坐标（图 6-3）。你甚至导入数据并控制播放速度来模拟位置的变化。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_109_0.png)\n\
    \n图 6-3. 从 Android 模拟器中选择位置\n\n在测试过程中尝试不同的位置是一个良好的习惯。当然，为了严谨的测试，你会希望将应用程序加载到实际设备上。\n\
    \n## 监听用户位置\n\n你也可以对用户位置设置监听，并在每次位置变化时接收更新。这可以用于随时间跟踪用户位置，或者确保你的应用接收最新的位置：\n\n\
    ```javascript\nthis.watchID = navigator.geolocation.watchPosition((position) =>\
    \ {\n  this.setState({position: position});\n});\n```\n\n注意，当组件卸载时，你也需要清除监听：\n\
    \n```javascript\ncomponentWillUnmount() {\n  navigator.geolocation.clearWatch(this.watchID);\n\
    }\n```\n\n## 地理位置局限性\n\n由于 Geolocation 规范，某些功能是未包含的。例如，iOS 提供了地理围栏（geofencing），允许应用程序在进入或离开指定区域时触发通知。如果你想使用这些高级功能，可能需要自己实现它们。\n\
    \n## 更新应用程序\n\n由于 Geolocation 规范，某些功能是未包含的。例如，React Native 不提供这些高级功能。如果你想使用这些高级功能，可能需要自己实现它们。\n\
    \n## 更新应用程序\n\n由于 Geolocation 规范，某些功能是未包含的。例如，React Native 不提供这些高级功能。如果你想使用这些高级功能，可能需要自己实现它们。\n\
    \n"
