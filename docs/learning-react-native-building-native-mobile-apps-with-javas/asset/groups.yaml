    \ contextually relevant information. Many mobile applications make extensive use\
    \ of this data.\n\nReact Native has built-in support for geolocation. This is\
    \ provided as a platform-agnostic “polyfill.” It returns data based on the MDN\
    \ Geolocation API web specification. Because we’re using the Geolocation specification,\
    \ you won’t need to deal with\n"
  mdcn: "\n接下来，我们将在父元素和子元素上都设置 `flex`。通过设置 `flex` 属性，我们显式地开启 flexbox 行为。`flex` 接受一个数字，该数字决定了每个子元素的相对权重；通过将其设置为\
    \ 1，我们让每个子元素的权重相等。\n\n我们还设置了 `flexDirection: 'column'`，以便子元素呈垂直排列。如果我们切换到 `flexDirection:\
    \ 'row'`，子元素将改为水平排列。这些样式的更改可以在示例 5-9 中看到。图 5-2 阐了这些值对布局影响的区别。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_96_0.png)\n\
    \n图 5-2. 设置基础 flex 属性和 `flexDirection`；将 `flexDirection` 设置为 column（左侧）并将 `flexDirection`\
    \ 设置为 row（右侧）\n\n示例 5-9 更改 `flex` 和 `flexDirection` 属性\n\n```\nconst styles =\
    \ StyleSheet.create({\n  parent: {\n    flex: 1,\n});\n```\n\n```\nflexDirection:\
    \ 'column',\nbackgroundColor: '#F5FCFF',\nborderColor: '#0099AA',\nborderWidth:\
    \ 5,\nmarginTop: 30,\n},\nchild: {\n  flex: 1,\n  borderColor: '#AA0099',\n  borderWidth:\
    \ 2,\n  textAlign: 'center',\n  fontSize: 24,\n}\n});\n```\n\n如果我们设置了 `alignItems`，子元素将不再在两个方向上扩展以填充所有可用空间。由于我们设置了\
    \ `flexDirection: 'row'`，它们将扩展以填充整行。现在，它们将只占据所需的垂直空间。\n\n然后，`alignItems` 的值决定了它们在交叉轴上的*位置*。交叉轴是与\
    \ `flexdirection` 垂直的轴。在这种情况下，交叉轴是垂直方向。`flex-start` 将子元素置于顶部，`center` 将其居中，而 `flex-end`\
    \ 将其置于底部。\n\n让我们看看设置 `alignItems` 时会发生什么（结果如图 5-3 所示）：\n\n```\nconst styles =\
    \ StyleSheet.create({\n  parent: {\n    flex: 1,\n    flexDirection: \"row\",\n\
