    \n# CHAPTER 4\n\n# Components for Mobile\n\nIn Chapter 3, we built a simple weather\
    \ app. In doing so, we touched upon the basics of building interfaces with React\
    \ Native. In this chapter, we will take a closer look at the mobile-based components\
    \ used for React Native, and how they compare to basic HTML elements. Mobile interfaces\
    \ are based on different primitive UI elements than web pages, and thus we need\
    \ to use different components.\n\nThis chapter starts with a more detailed overview\
    \ of the most basic components: <View>, <Image>, and <Text>. Then, we will discuss\
    \ how touch and gestures factor into React Native components, and how to handle\
    \ touch events. Next, we will cover higher-level components, such as the tab bars,\
    \ navigators, and lists, which will allow you to combine other views into standard\
    \ mobile interface patterns.\n\n# Analogies Between HTML Elements and Native Components\n\
    \nWhen developing for the web, we make use of a variety of basic HTML elements.\
    \ These include <div>, <span>, and <img> as well as organizational elements such\
    \ as <ol>, <ul>, and <table>. (We could include a consideration of elements such\
    \ as <audio>, <svg>, <canvas>).\n\n| HTML | React Native |\n| :--- | :--- |\n\
    | <div> | <View> |\n| <span> | <Text> |\n| <img> | <Image> |\n| <ol>, <ul> | <FlatList>\
    \ |\n| <table> | <ScrollView> |\n\nWhen developing for the web, we make use of\
    \ a variety of basic HTML elements. These include <div>, <span>, and <img> as\
    \ well as organizational elements such as <ol>, <ul>, and <table>. (We could include\
    \ a consideration of elements such as <audio>, <svg>, <canvas>).\n\n# Analogies\
    \ Between HTML Elements and Native Components\n\nWhen developing for the web,\
    \ we make use of a variety of basic HTML elements. These include <div>, <span>,\
    \ and <img> as well as organizational elements such as <ol>, <ul>, and <table>.\
    \ (We could include a consideration of elements such as <audio>, <svg>, <canvas>).\n\
    \n| HTML | React Native |\n| :--- | :--- |\n| <div> | <View> |\n| <span> | <Text>\
    \ |\n| <img> | <Image> |\n| <ol>, <ul> | <FlatList> |\n| <table> | <ScrollView>\
    \ |\n\n# Can I Share Code Between React Native and My App?\n\nOut of the box,\
    \ React Native supports Android and iOS. If you want to apply styles to web-compatible\
    \ views, you'll likely use styled components.\n\n# The <Text> Component\n\nRendering\
    \ text is a deceptively basic function; nearly any application will need to render\
    \ text somewhere. However, text within the context of React Native works differently\
    \ from web development. When working with text in HTML, you can include tags like\
    \ <strong> and <em>. So, you might end up with HTML snippet that looks like this:\n\
    \n```html\n<p>The quick <em>brown</em> jumped over the lazy <strong>dog</strong></p>\n\
    ```\n\nIn React Native, <Text> components may have plain-text nodes as children.\
    \ In other words, this is not valid:\n\n```javascript\n<View>\nText doesn't go\
    \ here!\n</View>\n```\n\nInstead, wrap your text in a <Text> component:\n\n```javascript\n\
    <View>\n<Text>This is OK!</Text>\n</View>\n```\n\nWhen dealing with <Text> components\
    \ in React Native, you no longer have access to subtags such as <strong> and <em>,\
    \ though you can apply styles to achieve similar effects. Here's how you might\
    \ achieve a similar effect by making use of inline styles:\n\n```javascript\n\
    <Text>\nThe quick <Text style={{fontStyle: \"italic\"}}>brown</Text> jumped over\
    \ the lazy <Text style={{fontWeight: \"bold\"}}>dog</Text>\n</Text>\n```\n\nThis\
    \ approach could quickly become verbose. You'll likely want to use styled components\
    \ as a shorthand for dealing with text, as shown in Example 4-1.\n\n# Example\
    \ 4-1. Creating reusable components for using text\n\n```javascript\nconst styles\
    \ = StyleSheet.create({\n  bold: {\n    fontWeight: \"bold\"\n  },\n  italic:\
    \ {\n  fontStyle: \"italic\"\n  }\n});\n```\n\n```javascript\nclass Strong extends\
    \ Component {\n  render() {\n    return (\n      <Text style={styles.bold}>\n\
    \        {this.props.children}\n      </Text>\n    );\n  }\n}\n```\n\n```javascript\n\
    class Em extends Component {\n  render() {\n    return (\n      <Text style={styles.italic}>\n\
    \        {this.props.children}\n      </Text>\n    );\n  }\n}\n```\n\nOnce you\
    \ have declared these styled components, you can freely make use of styled nesting.\
    \ Now the React Native version looks quite similar to the HTML version (see Example\
    \ 4-2).\n\n# Example 4-2. Using styled components for rendering text\n\n```javascript\n\
    <Text>\nThe quick <Em>brown</Em> fox jumped\n</Text>\n```\n"
  mdcn: "\n\n示例 3-19. WeatherProject.js 的完成代码\n\n```javascript\nimport React, { Component\
    \ } from \"react\";\n\nimport { StyleSheet, Text, View, TextInput, Image } from\
    \ \"react-native\";\n\nimport Forecast from \"./Forecast\";\nimport OpenWeatherMap\
    \ from \"./open_weather_map\"\n\nclass WeatherProject extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = { zip: \"\", forecast: null };\n  }\n\
    \n  _handleTextChange = event => {\n    let zip = event.nativeEvent.text;\n  \
    \  OpenWeatherMap.fetchForecast(zip).then(forecast => {\n      this.setState({\
    \ forecast: forecast });\n    });\n  }\n\n  render() {\n    let content = null;\n\
    \    if (this.state.forecast !== null) {\n      content = (\n        <Forecast\n\
    \          main={this.state.forecast.main}\n          description={this.state.forecast.description}\n\
    \          temp={this.state.forecast.temp}\n        />\n      );\n    }\n    return\
    \ (\n      <View style={styles.container}>\n        <Image\n          source={require(\"\
    ./flowers.png\")}\n          resizeMode=\"cover\"\n          style={styles.backdrop}\n\
    \        />\n        <View style={styles.overlay}>\n          <View style={styles.row}>\n\
    \            <Text style={styles.mainText}>\n              当前天气\n            </Text>\n\
    \          </View>\n          <View style={styles.zipContainer}>\n           \
    \ <TextInput\n              style={[styles.zipcode, styles.mainText]}\n      \
    \        onChangeText={this._handleTextChange}\n              underlineColorAndroid=\"\
    transparent\"\n            />\n          </View>\n        </View>\n      </View>\n\
    \    );\n  }\n}\n```\n\n构建天气应用 | 35\n\n```javascript\nconst baseFontSize = 16;\n\
    \nconst styles = StyleSheet.create({\n  container: { flex: 1, alignItems: \"center\"\
    , paddingTop: 30 },\n  backdrop: { flex: 1, flexDirection: \"column\" },\n  overlay:\
    \ {\n    paddingTop: 5,\n    backgroundColor: \"#000000\",\n    opacity: 0.5,\n\
    \    flexDirection: \"column\",\n    alignItems: \"center\"\n  },\n  row: {\n\
    \    flexDirection: \"row\",\n    flexWrap: \"nowrap\",\n    alignItems: \"flex-start\"\
