- md: "\nFinally, in createInstance, ReactVideoManager actually creating the view\
    \ with the correct context.\n\nIn order to effectively write native Android components,\
    \ you'll want an understanding of how Android handles views in general, but looking\
    \ at other React Native components is a good place to start.\n\n## Cross-Platform\
    \ Native Modules\n\nIs it possible to write a cross-platform native module?\n\n\
    The answer is yes; you just have to implement your module separately for each\
    \ platform, and provide a unified JavaScript interface. This can be a good way\
    \ to handle native-specific optimizations while still maximizing code reuse.\n\
    \nCreating a cross-platform native module doesn't require much extra configuration.\
    \ Once you have implemented iOS and Android versions separately, just create a\
    \ folder containing index.js and index.android.js files. Each version should import\
    \ the appropriate module. You can then import that folder, and React Native will\
    \ pick up the platform-appropriate version.\n\nReact Native won't enforce a consistent\
    \ API between the iOS and Android versions, so that responsibility falls on you.\
    \ If you want the iOS and Android versions to have slightly different APIs, that's\
    \ fine.\n\n## Summary\n\nSo, when is it appropriate to use native Objective-C\
    \ or Java code? When is it a good idea to include third-party modules and libraries?\
    \ In general, there are three main cases for native modules: taking advantage\
    \ of existing Objective-C or Java code; writing high-performance, multithreaded\
    \ code for tasks such as graphics processing; and exposing APIs not yet included\
    \ in React Native.\n\nFor any existing mobile projects built in Objective-C or\
    \ Java, writing a native module can be a great way to reuse code in React Native.\
    \ While hybrid applications are a bit beyond the scope of this book, they're definitely\
    \ a feasible approach, and you can use native modules to share functionality between\
    \ JavaScript, Objective-C, and Java.\n\nSimilarly, for cases where performance\
    \ is critical or for specialized tasks, it often makes sense to work in the native\
    \ language of the platform you're developing for. Finally, there will inevitably\
    \ be APIs you'll want to use that aren't yet supported by React Native. In these\
    \ cases, you have two options. One is to turn to the community and hope that someone\
    \ else has already solved your problem. The other is to solve the issue yourself\
    \ and hopefully contribute your solution back to the community!\n\nEven if you've\
    \ never developed for iOS or Android before, if you're planning on developing\
    \ with React Native, it's a good idea to gain knowledge of Objective-C and Java.\
    \ If you hit a wall when working with React Native, being able to dig your way\
    \ around it is an invaluable asset. The React Native community, as well as the\
    \ broader JavaScript ecosystem, will be valuable resources; reach out if you need\
    \ help.\n\n# CHAPTER 8: Platform-Specific Code\n\nIn Chapter 7 we looked at how\
    \ to write native modules with separate implementations in Java and Objective-C.\
    \ This raises two questions: first, do all React Native components have implementations\
    \ on both iOS and Android? Second, how should you handle platform-specific implementations?\n\
    \nComponents are available on all platforms, and not all interaction patterns\
    \ are appropriate for all devices. That't mean you can't use platform-specific\
    \ code in your application, though. In this section, we'll cover platform-specific\
    \ interface and implementations, as well as strategies for how to incorporate\
    \ platform-specific components into cross-platform applications.\n\nWriting cross-platform\
    \ code in React Native is not an all-or-nothing endeavor: you can mix cross-platform\
    \ and platform-specific code in your application, as we'll do in this section.\n\
    \n### iOS- or Android-Only Components\n\nSome components are available only on\
    \ a specific platform. This includes things like `<View>` or `<ToolbarAndroid>`.\
    \ They are usually platform-specific because they wrap some kind of underlying\
    \ platform-specific API. For some components, having a platform-agnostic version\
    \ doesn't make sense. For instance, the `<ToolbarAndroid>` exposes an Android-specific\
    \ API for a view type that doesn't exist on iOS anyway.\n\nPlatform-specific components\
    \ are named with an appropriate suffix: iOS or Android. If you try to include\
    \ one on the wrong platform, your application will crash.\n\nComponents can also\
    \ have platform-specific props. These are tagged in the documentation with a small\
    \ badge indicating their usage. For instance, <TextInput> has some props that\
    \ are platform-agnostic and others that are specific to iOS or Android (Figure\
    \ 8-1).\n\n| Prop | |\n| :--- | :--- |\n| ios maxLength | Limits the maximum number\
    \ of characters that can be entered. Use this instead of implementing the logic\
    \ in JS to avoid flicker. |\n| android numberOfLines | Sets the number of lines\
    \ for a TextInput. Use it with multiline set to true to be able to fill the lines.\
    \ |\n\nFigure 8-1. <TextInput> has Android and iOS-specific props\n\n### Components\
    \ with Platform-Specific Implementations\n\nSo, how do you handle platform-specific\
    \ components or props in a cross-platform application? The good news is that you\
    \ can still use these components by including them inside another component with\
    \ a platform-specific implementation; you'll be able to render the appropriate\
    \ content for each platform your app is designed for.\n\n> A platform-specific\
    \ component works only on a specific platform. For example, <Toolbar> is Android-only.\
    \ A component with platform-specific implementation might work on several platforms\
    \ but be implemented and behave differently.\n\nA very common practice is to have\
    \ a parent component that “wraps” platform-specific behavior and presents a unified\
    \ API. For elements such as navigation UI, this makes a lot of sense; the interaction\
    \ patterns vary greatly between iOS and Android.\n\nIn this section, we will discuss\
    \ how to implement platform-specific behavior in your components.\n\n### Using\
    \ Platform-Specific File Extensions\n\nRemember how React Native applications\
    \ are initialized with both an index.ios.js and an index.android.js file? This\
    \ naming convention can be used for any file to create a component that has different\
    \ implementations on Android and iOS.\n\nExample 8-1 demonstrates the Android\
    \ implementation of a simple component that shows a pop-up message.\n\nExample\
    \ 8-1. Newsflash.android.js\n\n```javascript\nimport React from \"react\"\nimport\
    \ { StyleSheet, Text, View, Alert } from \"react-native\"\n\nexport default class\
    \ App extends React.Component {\n  componentDidMount() {\n    Alert.alert(\"Hey\"\
    , \"You're on Android.\");\n  }\n\n  render() {\n    return (\n      <View style={styles.container}>\n\
    \        <Text>\n          What? I didn't say anything.\n        </Text>\n   \
    \   </View>\n    );\n  }\n}\n\nconst styles = StyleSheet.create({\n  container:\
    \ {\n    flex: 1,\n    backgroundColor: \"#fff\",\n    alignItems: \"center\"\
    ,\n    justifyContent: \"center\"\n  }\n});\n```\n\nAnd Example 8-2 shows the\
    \ iOS version.\n\nExample 8-2. Newsflash.ios.js\n\n```javascript\nimport React\
    \ from \"react\"\nimport { StyleSheet, Text, View, Alert } from \"react-native\"\
    \n\nexport default class App extends React.Component {\n  componentDidMount()\
    \ {\n    Alert.alert(\"Hey\", \"You're on iOS.\");\n  }\n\n  render() {\n    return\
    \ (\n      <View style={styles.container}>\n        <Text>\n          What? I\
    \ didn't say anything.\n        </Text>\n      </View>\n    );\n  }\n}\n\nconst\
    \ styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    backgroundColor:\
    \ \"#fff\",\n    alignItems: \"center\",\n    justifyContent: \"center\"\n  }\n\
    });\n```\n\nTo import this component, we use:\n\n```javascript\nimport Newsflash\
    \ from \"./Newsflash\";\n```\n\nNote that we left off the file extension. The\
    \ React Native packer will look for the appropriate file extension to match the\
    \ platform. On iOS, it will load Newsflash.ios.js (see Figure 8-2). On Android,\
    \ it will load Newsflash.android.js.\n\nAnd, just like that, we have a cross-platform\
    \ component that is compatible with both iOS and Android but renders differently\
    \ according to the platform.\n\nFigure 8-2. The Newsflash component for iOS\n"
  mdcn: "\n最后，在 `createInstance` 中，ReactVideoManager 实际上使用正确的上下文创建了视图。\n\n为了有效地编写原生\
    \ Android 组件，你希望了解 Android 通用的视图处理方式，但查看其他的 React Native 组件是一个很好的起点。\n\n## 跨平台原生模块\n\
    \n是否可以编写跨平台的原生模块？\n\n答案是肯定的；你只需要为每个平台分别实现你的模块，并提供一个统一的 JavaScript 接口。这是在处理平台特定优化的同时，最大化代码复用率的一种良好方法。\n\
    \n创建一个跨平台原生模块不需要很多额外的配置。一旦你分别实现了 iOS 和 Android 版本，只需创建一个包含 `index.js` 和 `index.android.js`\
    \ 文件的文件夹即可。每个版本应该导入相应的模块。然后你可以导入该文件夹，React Native 会自动选择适用于平台的版本。\n\nReact Native\
    \ 不会强制 iOS 和 Android 版本之间保持一致的 API，因此这个责任由你来承担。如果你希望 iOS 和 Android 版本具有略有不同的 API，那是可以的。\n\
    \n## 总结\n\n那么，什么时候使用原生 Objective-C 或 Java 代码是合适的？什么时候包含第三方模块和库是一个个主主意？通常情况下，原生模块有三种主要情况：利用现有的\
    \ Objective-C 或 Java 代码；为图形处理等任务编写高性能、多线程的代码；以及暴露尚未包含在 React Native 中的 API。\n\n\
    对于任何使用 Objective-C 或 Java 构建的现有移动端项目，编写原生模块是在 React Native 中复用代码的极佳方法。虽然混合应用稍微超出了本书的范围，但它们无疑是一种可行的的方法，你可以使用原生模块在\
    \ JavaScript、Objective-C 和 Java 之间共享功能。\n\n同样，对于性能至关重要或特殊任务的情况，在为你正在开发的平台原生语言中进行工作通常是有意义的。最后，你不可避免会想要使用\
    \ React Native 尚未支持的 API。在这种情况下，你有两个选择：一个是求助于社区，希望别人已经解决了你的问题；另一个是自己解决问题，并希望将你的解决方案回馈社区！\n\
    \n即使你以前从未开发过 iOS 或 Android，如果你计划使用 React Native 进行开发，那么获取 Objective-C 和 Java 的知识也是一个好主意。当你在使用\
