    \ flex: 1,\n    borderColor: \"#AA0099\",\n    borderWidth: 2,\n    textAlign:\
    \ \"center\",\n    fontSize: 24\n  }\n});\n```\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_98_0.png)\n\
