    \ Native 的定位方法更加集中，主要依赖 flexbox 以及绝对定位，以及熟悉的 margin 和 padding 属性。在本节中，我们将查看 React\
    \ Native 中如何构建布局，并以构建一个蒙德里风格的布局结束。\n\n## 使用 Flexbox 布局\n\nFlexbox 是一种 CSS3 布局模式。与\
