  - "[PAGE 24]\n\nIf you've never render JSX before, don't worry: it's pretty simple.\
    \ As an example, a pure-JavaScript React component for the web might look something\
    \ like this:\n\n```\nclass HelloMessage extends React.Component {\n  render()\
    \ {\n    return React.createElement(\n      \"div\",\n      null,\n      \"Hello\
    \ \\n      this.props.name\n    );\n  }\n}\n```\n\nReactDOM.render(HelloMessage,\
    \ { name: \"Bonnie\" }, mountNode);\n\nWe can render this much succinctly by using\
    \ JSX. Instead of calling React.createElement and passing in a list of HTML attributes,\
    \ we use XML-like markup:\n\n```\nclass HelloMessage extends Component {\n  render()\
    \ {\n    // Instead of calling createElement, we return markup\n    return <div>{this.props.name}</div>\n\
    \  }\n}\n```\n\n// We no longer need a createElement here\nReactDOM.render(<HelloMessage\
    \ name=\"Bonnie\" />, mountNode);\n\nBoth of these will render the following HTML\
    \ onto the page:\n\n```\n<div>Hello Bonnie</div>\n```\n\n# # Styling Native Components\n\
    \nOn the web, we style React components using CSS, just as we would any other\
    \ HTML element. whether you love it or hate it, CSS is a necessary part of the\
    \ web. React also does not affect the way we write CSS. But it makes it easier\
    \ to dynamically build class names based on props, and otherwise React is mostly\
    \ agnostic about how we handle styles on the web.\n\nNon-web platforms have a\
    \ wide array of approaches to layout and styling. We work with React Native, thankfully,\
    \ we utilize one standardized approach to styling. Part of the bridge between\
    \ React and the host platform includes the implementation of a heavily pruned\
    \ subset of CSS. This narrow implementation of CSS relies primarily on flexbox\
    \ for layout, and focuses on simplicity rather than implementing the full range\
    \ of CSS rules. Unlike the web, where CSS support varies across browsers, React\
    \ Native is able to enforce consistent support of style rules. As with the various\
    \ UI"
  - "[PAGE 25]\n\nelements, you can see many examples of supported styles in the RNTester\
    \ application, which is one of the examples that ships with React Native.\n\n\
    React Native also insists on the use of inline styles, which exist as JavaScript\
    \ objects. The React team has advocated for this approach before in React web\
    \ applications. If you have previously experimented with inline styles in React,\
    \ the syntax will look familiar to you:\n\n```\n// Define a style...\nconst style\
    \ = {\n  backgroundColor: 'white',\n  fontSize: '16px'\n};\n\n//...and then apply\
    \ it.\nconst txt = (\n  <Text style={style}>\n    A styled Text\n  </Text>\n);\n\
    ```\n\nReact Native also provides utilities for creating and extending style objects\
    \ that making inline styles a more manageable process. We will explore these later\
    \ in Chapter 5.\n\nDoes looking at inline styles make you twitch? If you're coming\
    \ from a web-based background, this is a break from standard practices. Working\
    \ with style objects, as opposed to styles, takes some mental adjustments and\
    \ changes the way you need to writing styles. In the context of React Native,\
    \ it is a useful shift. We will be discussing best practices and workflow in Chapter\
    \ 5. Just try not to be surprised when you see them in use!\n\n# Host Platform\
    \ APIs\n\nPerhaps the biggest difference between React for the web and React Native\
    \ is the way we think about host platform APIs. On the web, we often deal with\
    \ fragmentation and inconsistent adoption of standards; still, most browsers support\
    \ a common core of shared features. With React Native, however, platform-specific\
    \ APIs play a much larger role in creating an excellent, natural-feeling user\
    \ experience. There are also many options to consider. Mobile API include everything\
    \ from data storage to location services to accessing hardware such as the camera.\
    \ Unconventional platforms lead to even more interesting APIs—what the interface\
    \ look like between React Native and a virtual reality headset, for instance?\n\
    \nBy default, React Native for iOS and Android includes support for many commonly\
    \ used features, and React Native can support any asynchronous API. We will take\
    \ a look at many of them throughout this book. React Native makes it straightforward\
    \ and simple to use host platform APIs, so you can experiment freely. Be sure\
    \ to"
  - '[PAGE 26]


    think about what feels *right* for your target platform, and design with natural
    interactions in mind.


    Inevitably, the React Native bridge will not expose all platform functionality.
    If you find yourself in need of an unsupported feature, you have the option of
    adding it to React Native yourself. Alternatively, chances are good that someone
    else has done so already, be sure to check for community implementations. We’ll
    cover this in Chapter 7.


    It is also worth noting that utilizing host platform APIs has implications for
    code reuse. React components that need platform-specific functionality will be
    platform-specific as well. Isolating and encapsulating those components will bring
    added flexibility to your application. Of course, this applies for the web, too:
    if you plan on sharing code between React Native and React, keep in mind that
    things like the DOM do not actually exist in React Native.


    # Summary


    Writing components for mobile is a bit different in React Native when compared
    with React for the web. JSX is mandatory, and our basic building blocks are now
    components such as `<View>` in lieu of HTML elements as `<div>`. Styling is also
    quite different, based on a subset of CSS, and we assign styles with inline syntax.
    Still, these adjustments are quite manageable. In the next chapter, we’ll put
    this into practice as we build our first application!'
  - '[PAGE 27]


    # Building Your First Application


    In this chapter, we will cover how to set up your local development environment
    for working with React Native. Then we will go through the basics of creating
    a simple application that you can deploy to your own iOS or Android device.


    # Setting Up Your Environment


    Setting up your development environment will enable you to follow along with the
    examples in the book and write your own applications.


    There are two general approaches to setting up a development environment for React
    Native. The first, a tool called Create React Native App, gives you a quicker,
    easier installation but supports only pure-JavaScript applications. The second,
    more traditional approach involves fully installing React Native and all of its
    dependencies. Think of Create React Native App as a shortcut for easier testing
    and prototyping.


    Information on migrating from React Native App to a full React Native project
    can be found in [Appendix C].


    ![](img/1a32334c3c38f46e3c4219c7d228280e_27_0.png)


    > Which approach should you take? I recommend that beginners use Create React
    Native App for educational purposes and quick prototyping.


    > Eventually, if you''re working on a React Native app professionally or writing
    a hybrid app that uses both JavaScript and native Java, Objective-C, or Swift
    code, you''ll want to install the full React Native developer setup.'
