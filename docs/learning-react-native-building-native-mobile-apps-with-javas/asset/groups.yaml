    # ### Figure-4. Lists as used by Dropbox, Twitter, and the iOS Settings app


    React native use list components with convenient APIs. The <FlatList> component
    is designed to work with long lists of changing but similarly structured data.
    It has several performance optimizations baked in. The <SectionList> component
    is designed for data that is broken into logical sections, with section headings,
    similar to the iOS UITableView. Together, <FlatList> and <SectionList> cover most
    common use cases but if you need to pick under the hood and add some list handling,
    take a look at <VirtualizedList>.


    Optimizing list-rendering performance is a tricky problem because different use
    cases call for different approaches. Is your user swiping hastily through contacts
    to find a particular person or are they pursuing a feed of images? Do you have
    a homogeneous list or is every child different? If you perform matters, pay attention
    to your lists.


    In this section, we are going to build an app that displays the New York Times
    Best Sellers and lets you view data about each book, as shown in Figure 4-5. We''ll
    build two versions, with one with <FlatList> and the other with <SectionList>.


    If you''d like, you can grab your own API token from the New York Times. Otherwise,
    use the API token included in the sample code.


