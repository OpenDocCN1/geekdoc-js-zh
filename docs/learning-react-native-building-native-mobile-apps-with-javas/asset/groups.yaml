    # Summary


    In general, debugging with React Native should feel quite similar to debugging
    React code on the web. Most of the tools you are already familiar with are available
    here, too, which makes the transition to React Native much easier. That being
    said, React Native applications bring their own variety of complexity, and sometimes
    that complexity can manifest in frustrating bugs. Knowing how to debug your applications
    and becoming familiar with the error messages produced by your environment will
    go a long way in helping you to cultivate a productive workflow.'
