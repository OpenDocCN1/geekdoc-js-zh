  - '[PAGE 129]


    Let''s use lodash to print a random number:


    ```

    import _ from "lodash";nconsole.warn("Random number: " + _.random(0, 5));

    ```


    It works! But what about other modules? Can you include arbitrary packages using
    npm install?


    The answer is, yes, with some caveats. Any methods that touch the DOM, for instance,
    will fail. Integrating with existing packages may require some finailing because
    many packages make assumptions about the environment they''ll be running in. But
    in general, you can take advantage of arbitrary JavaScript packages and use npm
    to manage your dependencies like you would on any other JavaScript project.


    # Installing Third-Party Components with Native Code


    Now we''ve seen what it''s like to add an outside JavaScript library, let''s add
    a React Native component using npm. For this section, we are going to using react-native-video
    as our primary example. It''s part of the GitHub project react-native-community,
    a collection of high-quality React Native modules.


    The react-native-video component is listed in the npm registry. We can add it
    to our project with npm install:


    ```

    npm install react-native-video --save

    ```


    If we were working with traditional web development, we would done: react-native-video
    would now be available to our project. However, this module requires changes to
    our underlying iOS and Android projects, so there''s one more step:


    ```

    react-native link

    ```


    What does react-native link do? It makes modifications to the underlying iOS and
    Android projects. For iOS, this might entail edits to AppDelegate.m and the Xcode
    project file. For Android, this might include changes to MainActivity.java, settings.gradle,
    and build.gradle. Typically a module will specify this requirement in the installation
    instructions.


    Note that react-native link will work only with projects generated via create-react-native-app
    that have since been ejected. Migrating from a create-react-native-app project
    to a full Native project is discussed in "Exporting from Expo" on page 219.


    If you are not working with an autogent application, you''ll need to manually
    update your project files according to the instructions provided by the module
    authors.'
  - "[PAGE 130]\n\nNow we have installed the react-native-video module, let's test\
    \ it out. You'll need any MP4 video file for this step. I used a public-domain\
    \ video from Flickr.\n\nMP4 assets work just like images in React Native, so you\
    \ can load the video file so:\n\n```\nlet warblerVideo = require(\".warbler.mp4\"\
    );\n```\n\n# Using the Video Component\n\nWe can require the <Video> component\
    \ from our JavaScript code:\n\n```\nimport Video from \"react-native-video\"\n\
    ```\n\nThen just use component as you normally. Here, I've set a few of the optional\
    \ props:\n\n```\n<Video source={require(\".warbler.mp4\")} // Can be a URL or\
    \ a local file.\n  rate={1.0} // 0 is paused, 1 is normal.\n  volume={1.0} //\
    \ 0 is muted, 1 is normal.\n  muted={false} // Mutes the audio entirely.\n  paused={false}\
    \ // Pauses playback entirely.\n  resizeMode=\"cover\" // Fill the full screen\
    \ at aspect ratio.\n  repeat={true} // Repeat forever.\n  style={styles.background}\
    \ />\n```\n\nTa-da! We have a working video component! It should work on Android\
    \ and iOS.\n\nAs you can, including third-party modules with native code is a\
    \ straightforward process. Many such components are listed in the npm registry\
    \ and often use the prefix react-native-\\. Take a look around and see what the\
    \ community has built!\n\n# Objective-C Native Modules\n\nNow we've taken a look\
    \ at how to install and use a module that includes native code, let's dive into\
    \ how it works under the hood. We'll start with the Objective-C side of things.\n\
    \n# Writing an Objective-C Native Module for iOS\n\nNow we're using the react-native-video\
    \ module, let's look at how modules work under the hood.\n\nThe react-native-video\
    \ component is what React refers to as a native module. The React Native documentation\
    \ defines a native module as \"an Objective-C class that implements the RCTBridgeModule\
    \ protocol.\" (RCT is an abbreviation for ReactCT)."
  - "[PAGE 131]\n\nWriting Objective-C code is not part of the standard development\
    \ process with React Native, don't worry—this is not necessary stuff! But having\
    \ reading knowledge of what is going on will be helpful if you don't plan on implementing\
    \ your own modules (yet).\n\nIf you have never worked with Objective-C before,\
    \ much of the syntax will seem confusing. That's okay! We'll take things slowly.\
    \ Let's start by building a \"Hello, World\" module.\n\nObjective-C classes usually\
    \ have a header file that ends in .h, which contains the interface for a class.\
    \ The actual implementation goes in a .m file. Let's start by writing our HelloWorld.h\
    \ file, shown in Example 7-2.\n\n# Example 7-2. HelloWorld.h\n\n```\n#import <React/RCTBridgeModule.h>\n\
    \n@interface HelloWorld : NSObject<RCTBridgeModule>\n@end\n```\n\nWhat does this\
    \ do? On the first line, we import the RCTBridgeModule header. (Note that the\
    \ # symbol does not denote a comment, but rather an import statement.) On the\
    \ next line, we declare that the HelloWorld class subclasses NSObject and implements\
    \ the RCTBridgeModule interface, and end interface declaration with @end.\n\n\
    For historical reasons, many basic types in Objective-C are prefixed with NS (NSString,\
    \ NSObject, etc.).\n\nNow let's move on to the implementation (Example 7-3).\n\
    \n# Example 7-3. HelloWorld.m\n\n```\n#import \"HelloWorld.h\"\n#import <React/RCTLog.h>\n\
    \n@implementation HelloWorld\n\nRCT_EXPORT_MODULE();\n\nRCT_EXPORT_METHOD(NSString\
    \ *)name)\n{\n  RCTLogInfo(\"Saluton, %@\", name);\n}\n@end\n```"
  - '[PAGE 132]


    In a .m file, you''ll want to import the corresponding .h file, as we do here
    on the first line. I''ve also imported RCTLog.h, so that we can log things to
    the console using RCTLogInfo. When importing other headers in Objective-C, you''ll
    almost want to import the header file, not the .m file.


    The @implementation and @header indicate that the contents between them are the
    implementation of the HelloWorld class.


    The remaining lines do the work of making this React Native module. With RCT_EXPORT_MODULE(),
    we invoke a special React Native macro that makes this class accessible to the
    React Native bridge. Similarly, our method definition for greeting:name is prefixed
    with a macro, RCT_EXPORT_METHOD, which exports the method and thus we expose it
    to your JavaScript code.


    Note that Objective-C methods are named with a somewhat odd syntax. Each parameter''s
    is named in the method name. It is React Native that the JavaScript function name
    is the Objective-C name until the first colon, greeting:name becomes greeting
    in JavaScript. You may use the macro RCT_REMAP_METHOD to remap this naming if
    you like.


    Now, you might note that these files do not exist in your Xcode project (Figure
    7-1).


    ![](img/1a32334c3c38f46e3c4219c7d228280e_132_0.png)


    We need to add them to our project in order to include them in our application''s
    build. You can do this by selecting File -> Add Files to "Depends" (Figure 7-2).


    ![](img/1a32334c3c38f46e3c4219c7d228280e_132_1.png)'
- md: "\nSelect both HelloWorld.m and HelloWorld.h to add to your project (Figure\
    \ 7-3).\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_133_0.png)\n\nFigure 7-3.\
    \ Importing HelloWorld.m and HelloWorld.h to our project\n\nNow you should see\
    \ both files in your Xcode project (Figure 7-4).\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_133_1.png)\n\
    \nFigure 7-4. The updated Xcode project's file tree\n\nNow that our HelloWorld\
    \ files are imported, we can use the HelloWorld module from our JavaScript code\
    \ (Example 7-4).\n\nExample 7-4. Using the HelloWorld module from our JavaScript\
    \ code\n\n```\nimport { NativeModules } from \"react-native\";\nNativeModules.HelloWorld.greeting(\"\
    Bonnie\");\n```\n\nThe output should appear in the console (Figure 7-5), both\
    \ in Xcode and in the Chrome developer tools, if you choose to enable them.\n\n\
    ![](img/1a32334c3c38f46e3c4219c7d228280e_134_0.png)\n\nFigure 7-5. Console output,\
    \ as viewed through the Xcode interface\n\nNote the syntax for importing native\
    \ modules is a bit verbose. A common approach is to wrap your native module in\
    \ a JavaScript module (Example 7-5).\n\nExample 7-5. HelloWorld.js, a JavaScript\
    \ wrapper for the HelloWorld native module\n\n```\nimport { NativeModules } from\
    \ \"react-native\";\nexport default NativeModules.HelloWorld;\n```\n\nThen, it\
    \ becomes much more straightforward:\n\n```javascript\nimport HelloWorld from\
    \ \"./HelloWorld\";\n```\n\nHelloWorld.js JavaScript file is also a great opportunity\
    \ to add any JavaScript-script functionality to your module.\n\nPhew. Objective-C\
    \ can feel verbose, and we have to keep track of a couple of different files.\
    \ But congratulations: you've written a \"Hello, World\" for your Objective-C\
    \ module!\n\nTo review, an Objective-C module must do the following in order to\
    \ be available in React Native:\n\n- Import the RCTBridgeModule header\n- Declare\
    \ that your module implements the RCTBridgeModule macro\n- Call the RCT_EXPORT_MODULE()\
    \ macro\n- Have at least one method that is exported using the RCT_EXPORT_METHOD\
    \ macro\n\nNative modules can then use any API provided by the iOS SDK. (Note\
    \ that the API you provide to React Native must be asynchronous.) Apple provides\
    \ extensive documentation for the iOS SDK, and there are many resources available\
    \ from third parties as well. Note that your developer licenses will come in handy\
    \ here—often difficult to access the SDK documentation without them.\n\nNow that\
    \ we've written our basic \"Hello, World,\" let's take a deeper look at how react-native-video\
    \ is implemented.\n\n# Exploring react-native-video for iOS\n\nJust like the HelloWorld\
    \ module, RCTVideo is a native module, and it implements the RCTBridgeModule protocol.\
    \ You can see the full code for RCTVideo in the react-native-video GitHub repository.\
    \ We'll be looking at version 1.0. react-native-video is basically a wrapper around\
    \ the AVPlayer API provided by the iOS SDK. Let's take a closer look at how it\
    \ works, beginning with JavaScript entry Video.js.\n\nWe can see that this is\
    \ a wrapper around the native component, RCTVideo, performing some props normalization\
    \ and a bit of extra rendering logic. The native component is imported at:\n\n\
    ```javascript\nconst RCTVideo = requireNativeComponent('RCTVideo', {\n  nativeDriverOnly:\
    \ {\n    src: true,\n    seek: true,\n    fullscreen: true,\n  }\n});\n```\n\n\
    As we saw in our HelloWorld example, that means the iOS implementation of RCTVideo\
    \ component must be exported from Objective-C. Let's look at ios/RCTVideo.h:\n\
    \n```objc\n// RCTVideo.h\n#import <React/View.h>\n#import <AVFoundation/AVFoundation.h>\n\
    #import \"AVKit/AVKit.h\"\n#import \"UIKit/UIKit.h\"\n#import \"RCTVideoPlayerViewController.h\"\
    \n#import \"RCTVideoPlayerDelegate.h\";\n\n@class RCTDispatcher;\n\n@interface\
    \ RCTVideo <RCTVideoPlayerDelegate>\n\n@property (nonatomic, copy) RCTEventBlock\
    \ onVideoLoad;\n// ...\n// ... properties omitted ...\n// ...\n\n(instancetype)initWithDispatcher:(RCTDispatcher\
    \ *)eventDispatcher NS_INITIALIZER;\n\n(AVPlayerViewController*)createViewController:(AVPlayer*)player\
    \ withItem:(AVPlayerItem*)playerItem;\n\n@end\n```\n\nThis time, instead of subclassing\
    \ NSObject, RCTVideo subclasses UIView. That makes sense because it's a view component.\
    \ If we look at the implementation file, RCTVideo.m, there's a lot going on. On\
    \ the top are instance variables, keeping track of things like volume, playback\
    \ rate, and the AVPlayer itself:\n\n```objc\n(AVPlayerViewController*)\ncreateViewController:(AVPlayer*)player\n\
    withItem:(AVPlayerItem*)playerItem\n{\n  RCTPlayerViewController* playerLayer\
    \ = [[RCTPlayerViewController alloc] init];\n  playerLayer.showsPlaybackControls\
    \ = NO;\n  playerLayer.delegate = self;\n  playerLayer.view.frame = self.bounds;\n\
    \  playerLayer.player = _player;\n  playerLayer.view.frame = self.bounds;\n  return\
    \ playerLayer;\n}\n```\n\nThere are also various methods for things like calculating\
    \ the duration of the video, loading the video and setting it as source, and more.\
    \ Free to step through these methods and figure out what role they play.\n\nThe\
    \ other piece of the puzzle is RCTManager. To create a native UI component opposed\
    \ to just a module, we also need a view manager. As the name implies, while the\
    \ view handles rendering logic and similar tasks, the view manager deals with\
    \ other stuff (event handling, property exports, etc.). At minimum, the view manager\
    \ class needs to:\n\n- RCTViewManager\n- Use the RCT_EXPORT_MODULE() macro\n-\
    \ Implement the (UIView*)view method\n\nThe view method returns a UIView instance.\
    \ In this case, we can see that it initializes and returns an RCTVideo:\n\n```objc\n\
    (UIView*)view\n{\n  return [[RCTVideo alloc]\n  initWithEventDispatcher:self.bridge.eventDispatcher];\n\
    }\n```\n\nThe RCTManager also exports a number of properties and constants:\n\n\
    ```objc\n#import \"RCTVideoManager.h\"\n#import \"RCTVideo.h\"\n#import <React/RCTBridge.h>\n\
    #import <AVFoundation/AVFoundation.h>\n```\n\n```objc\n@implementation RCTVideoManager\n\
    \nRCT_EXPORT_MODULE();\n\n@synthesize bridge = _bridge;\n\n(UIView *)view\n{\n\
    \  return [[RCTVideo alloc]\n  initWithEventDispatcher:self.bridge.eventDispatcher];\n\
    }\n\n(dispatch_queue_t)methodQueue\n{\n  return dispatch_get_main_queue();\n}\n\
    \n```objc\nRCT_EXPORT_PROPERTY(src, NSDictionary);\nRCT_EXPORT_PROPERTY(resizeMode,\
    \ NSString);\nRCT_EXPORT_PROPERTY(repeat, BOOL);\nRCT_EXPORT_PROPERTY(paused,\
    \ BOOL);\nRCT_EXPORT_PROPERTY(muted, BOOL);\nRCT_EXPORT_PROPERTY(controls, BOOL);\n\
    RCT_EXPORT_PROPERTY(volume, float);\nRCT_EXPORT_PROPERTY(playInBackground, BOOL);\n\
    RCT_EXPORT_PROPERTY(playInInactive, BOOL);\nRCT_EXPORT_PROPERTY(rate, float);\n\
    /* ... more RCT_EXPORT_VIEW_PROPERTY calls omitted here... */\n```\n\n```objc\n\
    (NSDictionary *)ConstantsToExport\n{\n  @\"ScaleNone\": AVLayerVideoGravityResizeAspect,\n\
    \  @\"ScaleToFill\": AVLayerVideoGravityResize,\n  @\"ScaleAspectFit\": AVLayerVideoGravityResizeAspect,\n\
    \  @\"ScaleAspectFill\": AVLayerVideoGravityResizeFill\n}\n@end\n```\n\nTogether,\
    \ RCTVideo and RCTVideoManager comprise the RCTVideo native components, which\
    \ we can freely use from our application. As you can see, native modules that\
    \ make use of the iOS SDK is a nontrivial endeavor, though not an insurmountable\
    \ one. This is definitely one area where iOS development experience will serve\
    \ you well. A full explanation of iOS development is beyond the scale of this\
    \ book, but by looking at others' native modules—even if you don't have much Objective-C\
    \ experience—you should be able to start experimenting with your own attempts\
    \ at native module development.\n\n# Java Native Modules\n\nNative modules for\
    \ Android behave similarly to native modules for iOS. You can find more information\
    \ about Android native modules in the docs. Just as with iOS, if you install a\
    \ module for Android that includes native code, you'll want to run react-native\
    \ link after adding the module to your application's package.json file.\n"
  mdcn: "\n\n同时选择 HelloWorld.m 和 HelloWorld.h 将它们添加到你的项目项目中（图 7-3）。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_133_0.png)\n\
    \n图 7-3. 将 HelloWorld.m 和 HelloWorld.h 导入我们的项目\n\n现在，你应该可以在 Xcode 项目中看到这两个文件（图\
    \ 7-4）。\n\n![](img/1a32334c3c38f46e3c4219c7d228280e_133_1.png)\n\n图 7-4. 更新后的\
    \ Xcode 项目文件树\n\n既然 HelloWorld 文件已经导入，我们就可以从 JavaScript 代码中使用 HelloWorld 模块（示例\
