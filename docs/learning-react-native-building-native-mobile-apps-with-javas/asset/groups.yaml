    \ emphasizes a component-based approach, images must be included as <Image> components\
    \ instead of an image referenced via styles. For instance, in Chapter 3, we wanted\
    \ to use an image as a background for our weather application. Whereas in plain\
    \ HTML and CSS you would likely use the background-image property to apply a background\
    \ image, in React Native you use the <Image> as a container component, like so:\n\
    \n```javascript\n<Image source={require(\"./puppies.png\")}>\n  {/* Your content\
    \ here... */}\n</Image>\n```\n\nStyling the images themselves is fairly straightforward.\
    \ In addition to applying styles, you'll use certain props to control how the\
    \ image will be rendered. You'll often make use of the resizeMode prop, for instance,\
    \ which can be set to contain, cover, or stretch. The UIExplorer app demonstrates\
    \ this well (Figure 4-1).\n\n## Resize Mode\n`resizeMode` style prop controls\
    \ how the image is rendered within the frame.\n\n| Contain | Cover | Stretch |\n\
    | :--- | :--- | :--- |\n| ![Contain](image) | ![Cover](image) | ![Stretch](image)\
    \ |\n\nFigure 4-1. The difference between resize, cover, and contain\n\nThe <Image>\
    \ component is very flexible. You will likely make extensive use of it in your\
    \ own applications.\n\n## Working with Touch and Gestures\n\nWeb-based interfaces\
    \ are usually designed for mouse-based controllers. We use things like hover state\
    \ to indicate interactivity and respond to user interaction. For mobile, it's\
    \ touch that matters. Mobile platforms have their own norms around interactions\
