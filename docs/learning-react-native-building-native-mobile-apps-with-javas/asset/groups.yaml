- md: "\nWe'll still be using the SmarterWeather project. Let's change the background\
    \ to use an image from the user's photos.\n\n## Interacting with the CameraRoll\
    \ Module\n\nReact Native provides an interface to the camera roll, which contains\
    \ the images stored on the user's phone that were taken with the camera.\n\nInteracting\
    \ with the camera roll in its most basic form is not too complicated. First we\
    \ import the CameraRoll module, as per usual:\n\n```\nimport { CameraRoll } from\
    \ \"react-native\";\n```\n\nThen, we use the module to fetch information about\
    \ the user's photos, as shown in Example 6-5.\n\nExample 6-5. Basic usage of CameraRoll.getPhotos\n\
    \n```\nCameraRoll.getPhotos(\n  {first: 1},\n  (data) => {\n    console.log(data);\n\
    \  },\n  (error) => {\n    console.warn(error);\n  }\n);\n```\n\nWe make a call\
    \ to getPhotos with the appropriate query, and it returns some data related to\
    \ the camera roll' images.\n\nIn SmartWeather, let's replace the top-level <Image>\
    \ component with a new component, <PhotoBackdrop> (Example 6-6). For now, <PhotoBackdrop>\
    \ simply displays a photo from the user's camera roll.\n\nExample 6-6. smarter-weather/PhotoBackdrop/index.js\n\
    \n```\nimport React, { Component } from \"react\";\n\nimport { Image, CameraRoll\
    \ } from \"react-native\";\n\nimport styles from \"./style\";\n\nclass PhotoBackdrop\
    \ extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { photoSource: null };\n  }\n\n  componentDidMount() {\n    CameraRoll.getPhotos({\
    \ first: i }).then(data => {\n      this.setState({ photoSource: { uri: data.edges[3].node.image.uri\
    \ } });\n    }, error => {\n      console.warn(error);\n    });\n  }\n\n  render()\
    \ {\n    return (\n      <Image\n        style={styles.backdrop}\n        source={this.state.photoSource}\n\
    \        resizeMode=\"cover\"\n    >\n        {this.props.children}\n      </Image>\n\
    \    );\n  }\n}\n\nexport default PhotoBackdrop;\n```\n\nCameraRoll.getPhotos\
    \ takes three arguments: an object with params, a success callback, and an error\
    \ callback.\n\n## Requesting Images with GetPhotoParams variety\n\nThe getPhotoParams\
    \ object can take a variety of options. We can take a look at the React Native\
    \ source code to see which options are available to us:\n\n- **first**: Number;\
    \ the number of photos wanted in reverse order of the application (i.e., most\
    \ recent first).\n- **after**: String; a cursor that matches the page_info (end_cursor)\
    \ returned from a previous call to getPhotos.\n- **groupTypes**: String; specifies\
    \ which group to use. May be Album, Event, and so on.\n- **groupName**: String;\
    \ specifies filter on group names, such as Recent or album title.\n- **assetType**:\
    \ One of All, Photos, or Videos; specifies filter on asset type.\n- **mimeTypes**:\
    \ strings; filters based on mimetype (such as image/jpeg).\n\nIn our basic invocation\
    \ of getPhotos in Example 6-5, our getPhotoParams object was quite simple:\n\n\
    ```\n{first: 1}\n```\n\nThis means, simply we are looking for the most recent\
    \ photo.\n\n## Rendering an Image from the Camera Roll\n\nHow do we render an\
    \ image we've received from the camera roll? Let's look at that success callback:\n\
    \n```\n(data) => {\n  this.setState({\n    photoSource: {uri: data.edges[0].node.image.uri}\n\
    \  });\n}\n```\n\nThe structure of the data object is not immediately apparent,\
    \ so you'll likely want to use the debugger to inspect it. Each of the objects\
    \ in data.edges represents a photo; from there you can get the actual asset. You\
    \ may recall that the <Image> component can take a URI as its source. So, we can\
    \ render an image obtained from the camera roll by setting the source appropriately:\n\
    \n```\n<Image source={this.state.photoSource} />\n```\n\nThat's it! You can see\
    \ the resulting application in Figure 6-5.\n\nFigure 6-5. Rendering an image from\
    \ the camera roll\n\n## Uploading an Image to a Server\n\nWhat if you want to\
    \ upload a photo somewhere? React Native ships with built-in image functionality\
    \ in the XHR module. The basic approach looks like this:\n\n```\nlet formData\
    \ = new FormData();\n\nformData.append('image', this.state.photo, 'image.jpg');\n\
    \nxhr.send(formData);\n```\n\nXHR is short for XMLHttpRequest. React Native implements\
    \ the XHR API on top of the networking APIs. Similar to fetch, React Native's\
    \ XHR implementation is based on the MDN specification.\n\nUsing XHR for network\
    \ requests is somewhat more complex than the Fetch API, but the basic approach\
    \ should look like Example 6-7.\n\nExample 6-7. Basic structure for POSTing a\
    \ photo using XHR\n\n```\nlet xhr = new XMLHttpRequest();\nxhr.open('POST', 'http://server.com/post.php');\n\
    let formData = new FormData();\nformData.append('image', this.state.photo, 'image.jpg');\n\
    xhr.send(formData);\n```\n\nOmitted here are the various callbacks you will need\
    \ to register with the XHR request.\n\n## Storing Persistent Data with AsyncStorage\n\
    \nApplications will need to keep track of some variety of data persistently. How\
    \ do you accomplish this with React Native?\n\nReact Native provides us with AsyncStorage,\
    \ a key-value store that is global to your application. If you have used LocalStorage\
    \ on the web, AsyncStorage would feel quite similar. Its implementation varies\
    \ by platform, but the JavaScript API is the same regardless of whether you are\
    \ using Android or iOS.\n\nLet's take a look at how to use the AsyncStorage module.\
    \ The storage key for AsyncStorage can be any string; it's customary to use the\
    \ format @AppName:key, like so:\n\n```\nconst STORAGE_KEY = '@SmarterWeather:zip';\n\
    ```\n\nThe AsyncStorage module returns a response to both getItem and setItem.\
    \ For the SmarterWeather app, let's store the zip code in componentDid:\n\n```\n\
    AsyncStorage.getItem(STORAGE_KEY)\n.then((value) => {\n  if (value !== null) {\n\
    \    this._getForecastForZip(value);\n  }\n})\n.catch((error) => console.log('AsyncStorage\
    \ error: ' + error.message))\n.done();\n```\n\nThen, in _getForecastForZip, we\
    \ store the zip code value:\n\n```\nAsyncStorage.setItem(STORAGE_KEY, zip)\n.then(()\
    \ => console.log('Saved selection to disk: ' + zip))\n.catch((error) => console.log('AsyncStorage\
    \ error: ' + error.message))\n.done();\n```\n\nAsyncStorage also provides methods\
    \ for deleting keys, merging keys, and fetching all available keys.\n\n## The\
    \ SmarterWeather Application\n\nAll of the example code in this chapter can be\
    \ found in the SmarterWeather/ directory. The original weather application from\
    \ Chapter 3 has changed quite a bit, so let's take a look at the structure of\
    \ the entire application again (Example 6-8).\n\nExample 6-8. Contents of the\
    \ SmarterWeather project\n\n- smarter-weather\n  ├── Button\n  │   ├── index.js\n\
    \  │   └── style.js\n  ├── Forecast\n  │   └── index.js\n  ├── LocationButton\n\
    \  │   ├── index.js\n  │   └── style.js\n  ├── PhotoBackdrop\n  │   ├── flowers.png\n\
    \  │   ├── index.js\n  │   └── local_image.js\n"
  mdcn: "\n我们将继续使用 SmarterWeather 项目。让我们更改背景，以使用用户照片库中的图像。\n\n## 与 CameraRoll 模块交互\n\
    \nReact Native 提供了一个用于相机册（camera roll）的接口，其中包含了用户手机上相机拍摄的图像。\n\n与相机册交互的最基本形式并不复杂。首先，我们像照常一样导入\
    \ CameraRoll 模块：\n\n```\nimport { CameraRoll } from \"react-native\";\n```\n\n\
    然后，我们使用该模块获取用户照片的信息，如示例 6-5 所示。\n\n示例 6-5. CameraRoll.getPhotos 的基本用法\n\n```\n\
    CameraRoll.getPhotos(\n  {first: 1},\n  (data) => {\n    console.log(data);\n\
    \  },\n  (error) => {\n    console.warn(error);\n  }\n);\n```\n\n我们带有适当的查询调用 getPhotos，它会返回与相机册图像相关的数据。\n\
    \n在 SmartWeather 中，让我们将顶层的 <Image> 组件替换为新组件 <PhotoBackdrop>（示例 6-6）。目前，<PhotoBackdrop>\
    \ 仅用于显示用户相机册中的一张照片。\n\n示例 6-6. smarter-weather/PhotoBackdrop/index.js\n\n```\n\
    import React, { Component } from \"react\";\n\nimport { Image, CameraRoll } from\
    \ \"react-native\";\n\nimport styles from \"./style\";\n\nclass PhotoBackdrop\
    \ extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { photoSource: null };\n  }\n\n  componentDidMount() {\n    CameraRoll.getPhotos({\
    \ first: i }).then(data => {\n      this.setState({ photoSource: { uri: data.edges[3].node.image.uri\
    \ } });\n    }, error => {\n      console.warn(error);\n    });\n  }\n\n  render()\
    \ {\n    return (\n      <Image\n        style={styles.backdrop}\n        source={this.state.photoSource}\n\
    \        resizeMode=\"cover\"\n    >\n        {this.props.children}\n      </Image>\n\
    \    );\n  }\n}\n\nexport default PhotoBackdrop;\n```\n\nCameraRoll.getPhotos\
    \ 接受三个参数：一个包含参数的对象、一个成功回调和一个错误回调。\n\n## 使用 GetPhotoParams 变体请求图像\n\ngetPhotoParams\
    \ 对象可以接受多种选项。我们可以查看 React Native 的源码来查看有哪些可用的选项：\n\n- **first**: 数字；按应用程序的倒序想要的照片数量（即：最最近的在前）。\n\
    - **after**: 字符串；一个匹配之前的 getPhotos 调用所返回的 page_info (end_cursor) 的游标。\n- **groupTypes**:\
    \ 字符串；指定要使用的组。可以是 Album（相册）、Event（事件）等。\n- **groupName**: 字符串；对组名称进行过滤，例如 Recent（近期）或相册标题。\n\
    - **assetType**: All、Photos 或 Videos 之一；指定对资源类型进行过滤。\n- **mimeTypes**: 字符串数组；根据\
    \ mime-type（如 image/jpeg）进行过滤。\n\n在示例 6-5 的 getPhotos 基础调用中，我们的 getPhotoParams\
    \ 对象非常简单：\n\n```\n{first: 1}\n```\n\n这意味着我们简单地在寻找最近的一张照片。\n\n## 从相机册渲染图像\n\n我们如何渲染从相机册收到的图像呢？让我们来看看那个成功回调：\n\
    \n```\n(data) => {\n  this.setState({\n    photoSource: {uri: data.edges[0].node.image.uri}\n\
    \  });\n}\n```\n\ndata 对象的结构并不直观，所以你可能想使用调试器来检查它。data.edges 中的每个对象都代表一张照片；从那里你可以获取实际资源。你可能记得\
    \ <Image> 组件可以接受 URI 作为其源。因此，我们可以通过适当设置 source 来渲染从相机册获取的图像：\n\n```\n<Image source={this.state.photoSource}\
    \ />\n```\n\n就是这样！你可以在图 6-5 中看到结果应用程序。\n\n图 6-5. 从相机册渲染图像\n\n## 将图像上传到服务器\n\n\
    如果你想将照片上传到某处怎么办？React Native 在 XHR 模块中内置了图像功能。基本方法看起来如下所示：\n\n```\nlet formData\
    \ = new FormData();\n\nformData.append('image', this.state.photo, 'image.jpg');\n\
    \nxhr.send(formData);\n```\n\nXHR 是 XMLHttpRequest 的缩写。React Native 在网络 API 之上实现了\
    \ XHR API。与 fetch 类似，React Native 的 XHR 实现是基于 MDN 规范的。\n\n使用 XHR 进行网络请求比 Fetch\
    \ API 稍微复杂一些，但基本方法应该类似于示例 6-7。\n\n示例 6-7. 使用 XHR POST 照片的基本结构\n\n```\nlet xhr\
    \ = new XMLHttpRequest();\nxhr.open('POST', 'http://server.com/post.php');\nlet\
    \ formData = new FormData();\nformData.append('image', this.state.photo, 'image.jpg');\n\
    xhr.send(formData);\n```\n\n这里这里省略了你需要向 XHR 请求注册的各种回调函数。\n\n## 使用 AsyncStorage\
    \ 存储持久化数据\n\n应用程序需要持久地跟踪各种数据。在 React Native 中如何实现这一点？\n\nReact Native 为我们提供了 AsyncStorage，这是一个全局应用程序的键值存储器。如果你在\
    \ Web 端用过 LocalStorage，AsyncStorage 的感觉会非常相似。它的实现取决于平台，但无论使用 Android 还是 iOS，JavaScript\
    \ API 都是相同的。\n\n让我们看看如何使用 AsyncStorage 模块。AsyncStorage 的存储键可以是字符串；习惯上使用 AppName:key\
    \ 的格式，如下：\n\n```\nconst STORAGE_KEY = '@SmarterWeather:zip';\n```\n\nAsyncStorage\
    \ 模块对 getItem 和 setItem 都有响应。对于 SmarterWeather 应用，让我们在 componentDid 中存储邮政编码：\n\
    \n```\nAsyncStorage.getItem(STORAGE_KEY)\n.then((value) => {\n  if (value !==\
    \ null) {\n    this._getForecastForZip(value);\n  }\n})\n.catch((error) => console.log('AsyncStorage\
    \ error: ' + error.message))\n.done();\n```\n\n然后，在 _getForecastForZip 中我们存储邮政编码值：\n\
    \n```\nAsyncStorage.setItem(STORAGE_KEY, zip)\n.then(() => console.log('Saved\
    \ selection to disk: ' + zip))\n.catch((error) => console.log('AsyncStorage error:\
    \ ' + error.message))\n.done();\n```\n\nAsyncStorage 还提供了删除键、合并键和获取可用键的方法。\n\n\
    ## SmarterWeather \n\n本章的所有示例代码都可以在 SmarterWeather/ 目录下找到。第三章中的原始天气应用程序发生了很大变化，所以让我们再次查看整个应用程序的结构（示例\
