    \nFor simple cases, this pattern works fine.\n\nOur need for a more robust data\
    \ flow architecture becomes apparent when we consider a more complex interaction.\
    \ What happens when someone further down the component tree needs to impact an\
    \ application state located on a higher level? It's very easy to end up with a\
    \ tangle of spaghetti, and spend tedious callbacks through your code. Managing\
    \ active routes, handling user interactions, fetching data from the server, animating\
    \ changes—as you add more state to your application, the complexity grows, and\
    \ cascading updates can be triggered in unpredictable ways.\n\nRedux is one of\
    \ many libraries designed to make it easier to manage your application's state,\
    \ with the goal of making state predictable and easy to manage.\n\nIn Redux, state\
    \ is located in a single object, in a single store, which acts as the sole source\
    \ of truth. Components that need to render based on state connect to store and\
    \ receive the state as props. Components cannot modify state directly.\n\nChanges\
    \ to state are triggered by a set of predefined actions. A single reducer combines\
    \ the previous state and information from the action in order to calculate the\
    \ new state. Thus, logic about how your state can change, and how, is centralized\
    \ in one easy-to-debug location.\n\nAll of this will likely make more sense in\
    \ practice than in theory. Let's install Redux and look at how to add it to our\
    \ flashcard application. In addition to the redux package, we will want to install\
    \ the react-redux package, which contains the React-bindings for redux.\n\n```\n\
    npm install --save react-redux\n```\n\n# Actions\n\nFirst things: let's define\
    \ what types of actions can result in state changes. We're going to create some\
    \ string constants to represent the different types of actions (see Example 11-1)."
