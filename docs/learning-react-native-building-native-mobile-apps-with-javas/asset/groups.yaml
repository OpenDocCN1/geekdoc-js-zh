    \ NativeModules } from \"react-native\";\nNativeModules.HelloWorld.greeting(\"\
    Bonnie\");\n```\n\n输出应该出现在控制台中（图 7-5），如果你启用了它们，分别在 Xcode 和 Chrome 开发者工具中可见。\n\n\
    ![](img/1a32334c3c38f46e3c4219c7d228280e_134_0.png)\n\n图 7-5. 通过 Xcode 界面查看控制台输出\n\
    \n注意导入原生模块的语法有点冗长。一种常见的方法是将原生模块封装在一个 JavaScript 模块中（示例 7-5）。\n\n示例 7-5. HelloWorld.js，HelloWorld\
    \ 原生模块的 JavaScript 封装\n\n```javascript\nimport { NativeModules } from \"react-native\"\
    ;\nexport default NativeModules.HelloWorld;\n```\n\n然后，它就会变得简单得多：\n\n```javascript\n\
    import HelloWorld from \"./HelloWorld\";\n```\n\nHelloWorld.js JavaScript 文件也是为你的模块添加任何\
    \ JavaScript 脚本功能的绝佳机会。\n\n呼。Objective-C 感觉可能很冗长，而且我们必须跟踪几个不同的文件。但恭喜你：你为你的 Objective-C\
    \ 模块编写了一个“Hello, World”！\n\n回顾一下，Objective-C 模块必须执行以下操作才能在 React Native 中可用：\n\
    \n- 导入 RCTBridgeModule 头文件\n- 声明你的模块实现了 RCTBridgeModule 宏\n- 调用 RCT_EXPORT_MODULE()\
    \ 宏\n- 至少有一个使用 RCT_EXPORT_METHOD 宏导出的方法\n\n原生模块可以使用 iOS SDK 提供的任何 API。（注意，提供给\
    \ React Native 的 API 必须是异步的。）Apple 为 iOS SDK 提供了详尽的文档，第三方也有许多资源。注意，你的开发者许可证在这里将大有用场——如果没有它们，通常很难访问\
    \ SDK 文档。\n\n现在我们已经写基础的“Hello, World”，让我们深入看看 react-native-video 是如何实现的。\n\n#\
    \ 探索 iOS 上的 react-native-video\n\n就像 HelloWorld 模块一样，RCTVideo 是一个原生模块，它实现了 RCTBridgeModule\
    \ 协议。你可以在 react-native-video 的 GitHub 仓库中看到 RCTVideo 的完整代码。我们将查看 1.0 版本。react-native-video\
    \ 基本上是 iOS SDK 提供的 AVPlayer API 的封装。让我们更仔细看看它的工作原理，从 JavaScript 入口 Video.js 开始。\n\
    \n我们可以看到，这是对原生组件 RCTVideo 的封装，执行了一些 props（属性）归一化和一些额外的渲染逻辑。原生组件导入在：\n\n```javascript\n\
    const RCTVideo = requireNativeComponent('RCTVideo', {\n  nativeDriverOnly: {\n\
    \    src: true,\n    seek: true,\n    fullscreen: true,\n  }\n});\n```\n\n正如我们在\
    \ HelloWorld 示例中所看到的，这意味着 RCTVideo 组件的 iOS 实现部分必须从 Objective-C 导出。让我们看看 ios/RCTVideo.h：\n\
    \n```objc\n// RCTVideo.h\n#import <React/View.h>\n#import <AVFoundation/AVFoundation.h>\n\
    #import \"AVKit/AVKit.h\"\n#import \"UIKit/UIKit.h\"\n#import \"RCTVideoPlayerViewController.h\"\
    \n#import \"RCTVideoPlayerDelegate.h\";\n\n@class RCTDispatcher;\n\n@interface\
    \ RCTVideo <RCTVideoPlayerDelegate>\n\n@property (nonatomic, copy) RCTEventBlock\
    \ onVideoLoad;\n// ...\n// ... 省略了属性 ...\n// ...\n\n(instancetype)initWithDispatcher:(RCTDispatcher\
    \ *)eventDispatcher NS_INITIALIZER;\n\n(AVPlayerViewController*)createViewController:(AVPlayer*)player\
    \ withItem:(AVPlayerItem*)playerItem;\n\n@end\n```\n\n这一次，RCTVideo 没有继承自 NSObject，而是继承自\
    \ UIView。这是很有道理的，因为它是一个视图组件。如果我们看实现文件 RCTVideo.m，里面有很多操作。顶部是实例变量，用于跟踪音量、播放速率以及\
    \ AVPlayer 本身等内容：\n\n```objc\n(AVPlayerViewController*)\ncreateViewController:(AVPlayer*)player\n\
    withItem:(AVPlayerItem*)playerItem\n{\n  RCTPlayerViewController* playerLayer\
    \ = [[RCTPlayerViewController alloc] init];\n  playerLayer.showsPlaybackControls\
    \ = NO;\n  playerLayer.delegate = self;\n  playerLayer.view.frame = self.bounds;\n\
    \  playerLayer.player = _player;\n  playerLayer.view.frame = self.bounds;\n  return\
    \ playerLayer;\n}\n```\n\n还有各种方法用于诸如计算视频时长、加载视频并将其设置为源等。你可以逐单查看这些方法以了解它们的作用。\n\
    \n另一个拼图是 RCTManager。为了创建一个原生组件而不仅仅是模块，我们还需要一个 manager。正如名称所暗示，view 处理渲染逻辑，而 manager\
    \ 处理其他事务（事件处理、属性导出等）。manager 类需要：\n\n- RCTView\n- 使用 RCT_MODULE() 宏\n- 实现 (UIView)\
    \ 方法\n\nview 方法返回一个 UIView 实例。在这种情况下，我们可以看到它初始化并返回 RCTVideo：\n\n```objc\n(UIView*)view\n\
    {\n  return [[RCTVideo alloc]\n  initWithDispatcher:self.eventDispatcher];\n}\n\
    ```\n\nRCTManager 还导出了许多属性和常量：\n\n```objc\n#import \"RCTVideoManager.h\"\n#import\
    \ \"RCTVideo.h\"\n#import <React/RCTBridge.h>\n#import <AVFoundation/AVFoundation.h>\n\
    ```\n\n```objc\n@implementation RCTVideoManager\n\nRCT_EXPORT_MODULE();\n\n@synthesize\
    \ bridge = _bridge;\n\n(UIView *)view\n{\n  return [[RCTVideo alloc]\n  initWithDispatcher:self.eventDispatcher];\n\
    }\n\n(dispatch_queue_t)methodQueue\n{\n  return dispatch_get_main_queue();\n}\n\
    ```\n\n```objc\nRCT_EXPORT_PROPERTY(src, NSDictionary);\nRCT_EXPORT_PROPERTY(resizeMode,\
    \ NSString);\nRCT_EXPORT_PROPERTY(repeat, BOOL);\nRCT_EXPORT_PROPERTY(paused,\
    \ BOOL);\nRCT_EXPORT_PROPERTY(muted, BOOL);\nRCT_EXPORT_PROPERTY(controls, BOOL);\n\
    RCT_EXPORT_PROPERTY(volume, float);\nRCT_EXPORT_PROPERTY(playInBackground, BOOL);\n\
    RCT_EXPORT_PROPERTY(playInInactive, BOOL);\nRCT_EXPORT_PROPERTY(rate, float);\n\
    /* 此处省略了更多的 RCT_EXPORT_PROPERTY 调用... */\n```\n\n```objc\n(NSDictionary *)ConstantsToExport\n\
