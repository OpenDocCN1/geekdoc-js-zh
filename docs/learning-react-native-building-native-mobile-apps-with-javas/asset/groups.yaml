    Random number: \" + _.random(0, 5));\n```\n\nIt works! But what about other modules?\
    \ Can you include arbitrary packages using npm install?\n\nThe answer is, yes,\
    \ with some caveats. Any methods that touch the DOM, for instance, will fail.\
    \ Integrating with existing packages may require some finailing because many packages\
    \ make assumptions about the environment they'll be running in. But in general,\
    \ you can take advantage of arbitrary JavaScript packages and use npm to manage\
    \ your dependencies like you would on any other JavaScript project.\n\n## Installing\
    \ Third-Party Components with Native Code\n\nNow we've seen what it's like to\
    \ add an outside JavaScript library, let's add a React Native component using\
    \ npm. For this section, we are going to using react-native-video as our primary\
    \ example. It's part of the GitHub project react-native-community, a collection\
    \ of high-quality React Native modules.\n\nThe react-native-video component is\
    \ listed in the npm registry. We can add it to our project with npm install:\n\
    \n```\nnpm install react-native-video --save\n```\n\nIf we were working with traditional\
    \ web development, we would done: react-native-video would now be available to\
    \ our project. However, this module requires changes to our underlying iOS and\
    \ Android projects, so there's one more step:\n\n```\nreact-native link\n```\n\
    \nWhat does react-native link do? It makes modifications to the underlying iOS\
    \ and Android projects. For iOS, this might entail edits to AppDelegate.m and\
    \ the Xcode project file. For Android, this might include changes to MainActivity.java,\
    \ settings.gradle, and build.gradle. Typically a module will specify this requirement\
    \ in the installation instructions.\n\nNote that react-native link will work only\
    \ with projects generated via create-react-native-app that have since been ejected.\
    \ Migrating from a create-react-native-app project to a full Native project is\
    \ discussed in \"Exporting from Expo\" on page 219.\n\nIf you are not working\
    \ with an autogent application, you'll need to manually update your project files\
    \ according to the instructions provided by the module authors.\n\nNow we have\
    \ installed the react-native-video module, let's test it out. You'll need any\
    \ MP4 video file for this step. I used a public-domain video from Flickr.\n\n\
    MP4 assets work just like images in React Native, so you can load the video file\
    \ so:\n\n```\nlet warblerVideo = require(\".warbler.mp4\");\n```\n\n## Using the\
    \ Video Component\n\nWe can require the <Video> component from our JavaScript\
    \ code:\n\n```\nimport Video from \"react-native-video\"\n```\n\nThen just use\
    \ component as you normally. Here, I've set a few of the optional props:\n\n```\n\
    <Video source={require(\".warbler.mp4\")} // Can be a URL or a local file.\n \
    \ rate={1.0} // 0 is paused, 1 is normal.\n  volume={1.0} // 0 is muted, 1 is\
    \ normal.\n  muted={false} // Mutes the audio entirely.\n  paused={false} // Pauses\
    \ playback entirely.\n  resizeMode=\"cover\" // Fill the full screen at aspect\
    \ ratio.\n  repeat={true} // Repeat forever.\n  style={styles.background} />\n\
    ```\n\nTa-da! We have a working video component! It should work on Android and\
    \ iOS.\n\nAs you can, including third-party modules with native code is a straightforward\
    \ process. Many such components are listed in the npm registry and often use the\
    \ prefix react-native-\\. Take a look around and see what the community has built!\n\
    \n## Objective-C Native Modules\n\nNow we've taken a look at how to install and\
    \ use a module that includes native code, let's dive into how it works under the\
    \ hood. We'll start with the Objective-C side of things.\n\n## Writing an Objective-C\
    \ Native Module for iOS\n\nNow we're using the react-native-video module, let's\
    \ look at how modules work under the hood.\n\nThe react-native-video component\
    \ is what React refers to as a native module. The React Native documentation defines\
    \ a native module as \"an Objective-C class that implements the RCTBridgeModule\
    \ protocol.\" (RCT is an abbreviation for React).\n\nWriting Objective-C code\
    \ is not part of the standard development process with React Native, don't worry—this\
    \ is not necessary stuff! But having reading knowledge of what is going on will\
    \ be helpful if you don't plan on implementing your own modules (yet).\n\nIf you\
    \ have never worked with Objective-C before, much of the syntax will seem confusing.\
    \ That's okay! We'll take things slowly. Let's start by building a \"Hello, World\"\
    \ module.\n\nObjective-C classes usually have a header file that ends in .h, which\
    \ contains the interface for a class. The actual implementation goes in a .m file.\
    \ Let's start by writing our HelloWorld.h file, shown in Example 7-2.\n\n### Example\
    \ 7-2. HelloWorld.h\n\n```\n#import <React/RCTBridgeModule.h>\n\n@interface HelloWorld\
    \ : NSObject<RCTBridgeModule>\n@end\n```\n\nWhat does this do? On the first line,\
    \ we import the RCTBridgeModule header. (Note that the # symbol does not denote\
    \ a comment, but rather an import statement.) On the next line, we declare that\
    \ the HelloWorld class subclasses NSObject and implements the RCTBridgeModule\
    \ interface, and end interface declaration with @end.\n\nFor historical reasons,\
    \ many basic types in Objective-C are prefixed with NS (NSString, NSObject, etc.).\n\
    \nNow let's move on to the implementation (Example 7-3).\n\n### Example 7-3. HelloWorld.m\n\
    \n```\n#import \"HelloWorld.h\"\n#import <React/RCTLog.h>\n\n@implementation HelloWorld\n\
    \nRCT_EXPORT_MODULE();\n\nRCT_EXPORT_METHOD(NSString *)name\n{\n  RCTLogInfo(\"\
    Hello, %@\", name);\n}\n@end\n```\n\nIn a .m file, you'll want to import the corresponding\
    \ .h file, as we do here on the first line. I've also imported RCTLog.h, so we\
    \ can log things to the console. When importing other headers in Objective-C,\
    \ you'll almost want to import the header file, not the .m file.\n\nThe @implementation\
    \ and @header indicate that the contents between them are the implementation of\
    \ the HelloWorld class.\n\nThe remaining lines do the work of making this React\
    \ Native module. With RCT_EXPORT_MODULE(), we invoke a special React Native macro\
    \ that makes this class accessible to the React Native bridge. Similarly, our\
    \ method definition for greeting:name is prefixed with a macro, RCT_EXPORT_METHOD,\
    \ which exports the method and thus we expose it to your JavaScript code.\n\n\
    Note that Objective-C methods are named with a somewhat odd syntax. Each parameter's\
    \ is named in the method name. It is React Native that the JavaScript function\
    \ name is the Objective-C name until the first colon, greeting:name becomes greeting\
    \ in JavaScript. You may use the macro RCT_REMAP_METHOD to remap this naming if\
    \ you like.\n\nNow, you might note that these files do not exist in your Xcode\
    \ project (Figure 7-1).\n\nWe need to add them to our project in order to include\
    \ them in our application's build. You can do this by selecting File -> Add Files\
    \ to \"Depends\" (Figure 7-2).\n"
