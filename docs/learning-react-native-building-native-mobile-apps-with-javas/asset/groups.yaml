    \ styles.base]} />\n        </View>\n        <View style={[styles.cellThree, styles.base]}\
    \ />\n      </View>\n      <View style={styles.bottomBlock}>\n        <View style={[styles.cellFour,\
    \ styles.base]} />\n        <View style={[styles.cellFive, styles.base]} />\n\
    \        <View style={styles.bottomRight}>\n          <View style={[styles.cellSix,\
    \ styles.base]} />\n          <View style={[styles.cellSeven, styles.base]} />\n\
    \        </View>\n      </View>\n    </View>\n  }\n}\nexport default Mondrian;\n\
    ```\n\nNow let's add the styles that make it work (Example 5-11).\n\nExample 5-11.\
