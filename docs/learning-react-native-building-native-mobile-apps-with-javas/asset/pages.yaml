  md: "In this section, we're going to look specifically at type checking with Flow\
    \ and unit testing with Jest.\n\n# Type Checking with Flow\n\nFlow is a JavaScript\
    \ library for static type checking. It relies on type inference to detect type\
    \ errors—even in unannotated code—and allows you to slowly add type annotations\
    \ to existing projects. Type checking can help you detect possible issues early\
    \ and help enforce sane APIs between various components and modules.\n\nYou can\
    \ install Flow using npm:\n\n```\n$ npm install -g flow-bin\n```\n\nRunning Flow\
    \ is simple:\n\n```\n$ flow check\n```\n\nThe default application comes with a\
    \ .flowconfig file, which configures Flow's behavior. If you find many errors\
    \ related to files in node_modules, you may need to add this to your line in .flowconfig\
    \ under [ignore]:\n\n```\n.*/node_modules/*\n```\n\nYou should then be able to\
    \ run flow check without seeing any errors:\n\n```\n$ flow check\n$ Found 0 errors.\n\
    ```\n\nFeel free to use Flow as you develop your React Native applications.\n\n\
    # Unit Testing with Jest\n\nReact Native supports testing of React components\
    \ using Jest. Jest is a unit testing framework built on top of Jasmine. It provides\
    \ aggressive mocking of dependencies, and it meshes nicely with React's testing\
    \ utilities.\n\nTo use Jest, you will first need to install:\n\n```\nnpm install\
    \ jest-cli --save-dev\n```\n\nBecause we only need jest for development, for our\
    \ production build, we install it with --save-dev flag.\n\nUpdate your package.json\
    \ file to include a test script:\n\n```\n{\n  \"scripts\": {\n    \"test\": \"\
    jest\"\n  }\n}\n```"
  merge: -1
  pgno: 170
- img_proc: true
  md: "This will run when you type `npm test`.\n\nNext, create the `tests/` directory.\
    \ Jest will recursively search for files in a `tests/` directory, and run them:\n\
    \n```\nmkdir __tests__\n```\n\nNow let's create a new file, `tests/dummy-test.js`,\
    \ and write our first test:\n\n```\n'use strict';\n\ndescribe('a silly test',\
    \ function() {\n  it('expects true to be true', function() {\n    expect(true).toBe(true);\n\
    \  });\n});\n```\n\nNow if you run `npm test`, you will see that the test has\
    \ passed.\nof course, this is much more than testing to this trivial example.\
    \ If you want to read more about Jest, I recommend starting with the [documentation]()\n\
    \n# Snapshot Testing with Jest\n\nSnapshot tests are excellent for ensuring that\
    \ your UI not change unexpectedly. This makes them a good fit for React components.\
    \ Plus, snapshot tests are easy to write and require minimal configuration.\n\n\
    Snapshot testing for React Native requires the react-test-renderer package.\n\n\
    ```\nnpm install --save-react-test-renderer\n```\n\n**Example 9-1** demonstrates\
    \ a simple test.\n\nExample 9-1. Styles/tests/FlexDemo-test.js\n\n```\nimport\
    \ React from \"react\";\nimport FlexDemo from \"../FlexDemo\";\n\nimport renderer\
    \ from \"react-test-renderer\";\n\ntest('renders correctly', () => {\n  const\
    \ tree = renderer.create(<FlexDemo />).toJSON();\n\n  expect(tree).toMatchSnapshot();\n\
    });\n```\n\nAs you can see, very little code is needed to add a snapshot test.\n\
    You'll also need to update your `package.json` file to add Jest as a dependency,\
    \ with the react-native testing preset."
