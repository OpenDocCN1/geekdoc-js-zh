    # Persisting Data with AsyncStorage\n\nRight now, our flashcard application's\
    \ state is not persisted, if we add new decks or cards and then restart the app,\
    \ our data is lost. Let's fix this by saving the application's state with AsyncStorage.\n\
    \nThis is an example of how Redux can shine: because our state management logic\
    \ is centralized, making this change simpler than it would otherwise be.\n\nWe'll\
    \ start by adding a file that handles read/write logic for persisting our state\
    \ to disk; remember, Example 11-10, AsyncStorage.getItem and AsyncStorage are\
    \ both asynchronous APIs.\n\nExample 11-0. _check_point_04/decks.js\n\n```\nimport\
    \ { AsyncStorage } from \"react-native\";\nimport Deck from \"../data/Deck\";\n\
    export const DECK_KEY = \"flashcards-decks\";\nimport { MockDecks } from \"../data/Mocks\"\
    ;\nasync function read(key, deserializer) {\n  let val = await AsyncStorage.getItem(key);\n\
    \  if (val !== null) {\n    let readValue = JSON.parse(val).map(serialized);\n\
    \    return deserializer(serialized);\n  }\n```"
