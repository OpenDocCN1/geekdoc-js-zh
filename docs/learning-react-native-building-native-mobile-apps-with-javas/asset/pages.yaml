  md: '# CHAPTER 5

    Styles


    It''s great to be able to build functional applications, but if you can''t style
    them effectively, you won''t get very far! In Chapter 3, we built a simple weather
    application with some basic styles. While this gave us an overview of how to style
    React Native components, weed over many of the details. In this chapter, we will
    take a closer look at how styles work in React Native. We''ll cover how to create
    and manage your stylesheets, as well as the details of React Native''s implementation
    of CSS rules. By the end of this chapter, you should feel comfortable creating
    and styling your React Native components and applications.


    If you want to share styles between your React Native and web applications, the
    React Style project on GitHub provides a version of React Native''s style system
    for the web.


    # Declaring and Manipulating Styles


    When working with React for the web, we typically use separate stylesheet files,
    which may be written in CSS, SASS or LESS. React Native takes a radically different
    approach, bringing styles entirely into the world of JavaScript and forcing you
    to link style objects explicitly to components. This approach tends to provoke
    reactions, as it represents a significant departure from CSS-based styling norms.


    To understand the design of React Native''s styles, we first need to consider
    some of the headaches associated with traditional CSS stylesheets.¹ CSS has a
    number of problems. All CSS rules and class names are global in scope, meaning
    that styling one component can easily break another if you''re not careful. For
    instance, if you include the popular Twitter Bootstrap library, you will introduce
    over 600 new global


    > 1 The "CSS in JS" slidedeck from Christopher Chedeau, aka Vjeux, provides a
    good overview.'
