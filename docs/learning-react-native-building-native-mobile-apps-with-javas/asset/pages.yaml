  md: 'Note that this won''t actually work until you add the proper permissions to
    either your Info.plist file (for iOS) or your AndroidManifest.xml file (for Android),
    as we''ll discuss next.


    # Handling Permissions


    Location data is sensitive information, and therefore will not be accessible to
    your application by default. Your application should be able to handle permissions
    being accepted or rejected.


    Most mobile platforms have some notion of location permissions. A user may opt
    to block Location Services entirely on iOS, for instance, or they may manage permissions
    on a per-app basis. It''s important to note that location permissions can be revoked
    at essentially any point in time. Your application should always be prepared for
    a geolocation call to fail.


    In order to access location data, first you will need to declare that your application
    intends to use location data.


    On iOS, you''ll need to add the key LocationWhenInUsageDescription in your Info.plist
    file. This should be included by default when you create a React Native application.


    On Android, you''ll need to add the following to your AndroidManifest.xml file:


    ```

    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

    ```


    The first time your application attempts to access the user''s location, the user
    will be presented with a permissions dialog like the one shown in Figure 6-1.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_107_0.png)


    Figure 6-1. Location request


    While this dialog is active, neither callback will fire; once the user selects
    an option, the appropriate callback will be invoked. This setting will persist
    for your application, so the next time such a check won''t be necessary.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'If the user denies permissions, you can fail silently if you want, but most
    apps use an alert dialog to request permissions again.


    # Testing Geolocation in Emulated Devices


    Chances are, you''ll be doing most of your testing and development from within
    a simulator, or at the very least, at your desk. How can you test how your app
    will behave at different locations?


    The iOS simulator allows you to easily spoof a different location. By default,
    you''ll be placed near Apple HQ in California, but you can specify any coordinates
    as well by navigating to Debug -> Location -> Custom Location..., as shown in
    Figure 6-2.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_108_0.png)


    Similarly, on Android, you can select which GPS coordinates to send (Figure 6-3).
    You can even import data and control the playback speed to simulate changing locations.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '![](img/1a32334c3c38f46e3c4219c7d228280e_109_0.png)


    Figure 6-3. Picking a location from the Android emulator


    It''s good practice to try out different locations as part of your testing process.
    For rigorous testing, of course, you will want to load your application onto an
    actual device.


    # Watching the User''s Location


    You can also set a watch on the user''s location, and receive updates whenever
    it changes. This can be used to track a user''s location over time, or to ensure
    that your app receives the most up-to-date position:


    ```

    this.watchID = navigator.geolocation.watchPosition((position)) => {

    this.setState(position: position));

    });

    ```


    Note that you''ll need to clear the watch when your component unmounts as well:


    ```

    componentWillUnmount() {

    navigator.geolocation.clearWatch(this.watchID);

    }

    ```


    # Working Around Limitations


    Because geolocation is based on the MDN specification, it leaves out more advanced
    location-based features. For example, iOS provides a Geofencing API, which allows
    your application to receive notifications when the user enters or leaves a designated
    geographical region (the geofence). React Native does not expose this API.


    This means that if you want to use location-based features that aren''t included
    in the Geolocation MDN specification, you''ll need to port them yourself.'
