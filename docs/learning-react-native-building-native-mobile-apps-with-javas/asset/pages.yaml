  md: "# Example 7-7. helloworld/HelloWorldPackage.java\n\n```\npackage com.depends.helloworld;\n\
    \nimport com.facebook.react.ReactPackage;\nimport com.facebook.react.bridge.JavaScriptModule;\n\
    import com.facebook.react.bridge.NativeModule;\nimport com.facebook.react.bridge.ReactApplicationContext;\n\
    import com.facebook.react.uimanager.ViewManager;\n\nimport java.util.ArrayList;\n\
    import java.util.Collections;\nimport java.util.List;\n```\n\n```\npublic class\
    \ HelloWorldPackage implements ReactPackage {\n  @Override\n  public List<NativeModule>\
    \ createNativeModules(ReactApplicationContext reactContext) {\n    List<NativeModule>\
    \ modules = new ArrayList<>();\n    modules.add(new HelloWorldModule(reactContext));\n\
    \    return modules;\n  }\n\n  @Override\n  public List<ViewManager> createViewManagers(ReactApplicationContext\
    \ reactContext) {\n    return Collections.emptyList();\n  }\n}\n```\n\nThis is\
    \ mostly boilerplate. We do not need to import HelloWorld because it is part of\
    \ the same package (com.depends.helloworld) as this. There are two methods that\
    \ we need to implement: createNativeModules and createViewManagers. React Native\
    \ uses these methods to determine what modules should export.\n\nOur native module\
    \ doesn't deal with native views or UI elements so createViewManagers returns\
    \ an empty list, whereas createNativeModules returns a list containing an instance\
    \ of HelloWorld.\n\nFinally, we need to add the package in MainApplication.java.\
    \ Import the package:\n\n```\nimport com.depends.helloworld.HelloWorldPackage;\n\
    ```\n\nThen add HelloWorldPackage to getPackages():\n\n```\nprotected List<ReactPackage>\
    \ getPackages() {\n  return Arrays.asList(\n    new MainReactPackage(),\n    new\
    \ ReactVideoPackage(),\n    new HelloWorldPackage()\n  );\n}\n```"
