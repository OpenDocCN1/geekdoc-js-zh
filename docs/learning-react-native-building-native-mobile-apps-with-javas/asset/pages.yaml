  md: "# CHAPTER 11\n\n# # State Management in Larger Applications\n\nIn Chapter 10,\
    \ we used the flashcard application as a jumping-off point to discuss the structure\
    \ of larger applications. One of the common issues that React applications encounter\
    \ as they grow is state management. React Native is no different: as our application\
    \ gets larger, we can benefit from using a state management library. In this chapter,\
    \ we'll look at Redux, a library for managing data flow, and integrate it with\
    \ our flashcards application. We'll also integrate AsyncStorage with our Redux\
    \ store.\n\n# ## Using Redux to Manage State\n\nRedux is based somewhat on the\
    \ Flux data flow pattern, as well as functional programming concepts. Previous\
    \ examples we've looked at in this book haven't required much in the way of data\
    \ flow management. With smaller applications, communicating between components\
    \ is usually a trivial issue. Consider the case where a button tap has on the\
    \ parent's state:\n\n```\nclass Child extends Component {\n  render() {\n    <TouchableOpacity\
    \ onPress={this.props.onPress}>\n      <Text>Child Component</Text>\n    </TouchableOpacity>\n\
    \  }\n}\n```\n\nBy passing a callback from the parent to the child, we can alert\
    \ the parent about actions with the child:\n\n```\nclass Parent extends Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.initialState = { numTaps:\
    \ 0 };\n  }\n}\n```"
  merge: -1
