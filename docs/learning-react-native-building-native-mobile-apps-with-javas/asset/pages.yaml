  md: "In many ways, these action creators act as convenience functions. For example,\
    \ the addDeck action creator takes a deck name as a parameter and then handles\
    \ the actual construction of a Deck.\n\n# Reducers\n\nActions represent things\
    \ that happened in your application. Reducers describe how your application state\
    \ changes in response to actions. A reducer is a \"pure function\": it has no\
    \ side effects, and its return value is determined only by its inputs. (Don't\
    \ call Math.random in a reducer)\n\nThe simplest reducer we could write like this:\n\
    \n```\nconst reducer = (state = {}, action) => {\n  return state;\n}\n```\n\n\
    Our state is going to contain two items: an array of decks and information about\
    \ the current review. The default state will look like:\n\n```\ndecks: [],\nCurrentReview:\
    \ {\n  deckID = null,\n  questions: [],\n  currentQuestionIndex = 0\n}\n```\n\n\
    Let's start our first reducer by looking at the ADD_DECK action. Looking back\
    \ at actions/creators.js, we see the following:\n\n```\n{\n  type: ADD_DECK,\n\
    \  data: new Deck(name)\n}\n```\n\nIf we want to write a reducer for the decks\
    \ key, the signature needs to look like this:\n\n```\nconst decksReducer = (state\
    \ = [], action) => {\n  // returns some state\n}\n```\n\nWe want to add the new\
    \ deck from our action to the existing state, so let's implement the deckReducer.\n\
    \n```\nconst deckReducer = (state = [], action) => {\n  switch (action.type) {\n\
    \    case ADD_DECK:\n      return state.concat(action.data);\n  }\n  return state;\n\
    }\n```"
