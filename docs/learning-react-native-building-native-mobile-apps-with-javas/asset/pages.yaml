  md: "# Handling User Input\n\nWe want the user to be able to enter a zip code and\
    \ get the forecast for that area, so we need to add a text field for user input.\
    \ We can start by adding zip code information to our component's initial state\
    \ (see Example 3-7).\n\nExample 3-7. Adding zip code information to your component,\
    \ before the render function\n\n```\nconstructor(props) {\n  super(props);\n \
    \ this.state = { zip: \"\" };\n}\n```\n\nIf you're accustomed to using React.create()\
    \ to create components instead of JavaScript classes, this may seem odd. When\
    \ creating classes, we set the initial state values for React components by mutating\
    \ this.state variable in the constructor method. If you need a review of the React\
    \ component lifecycle, see the React docs.\n\nNext, we should also change one\
    \ of the <Text> components to display this.state.zip, as shown in Example 3-8.\n\
    \nExample 3-8. Adding a <Text> component that displays the current zip code\n\n\
    ```\n<Text style={styles.welcome}>\n  You input={this.state.zip} \n</Text>\n```\n\
    \nWith out of the way, let's add a <TextInput> component (see Example 3-9). This\
    \ is a basic component that allows the user to enter text.\n\nExample 3-9. The\
    \ <TextInput> component is used for entering text\n\n```\n<TextInput\n  style={styles.input}\n\
    \  onChange={this._handleTextChange}/>\n```\n\nThe <TextInput> component is documented\
