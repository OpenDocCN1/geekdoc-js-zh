  md: "# Using the Platform Module\n\nThere's a second option for writing platform-specific\
    \ code: The Platform module. The API provides information about the operating\
    \ system and OS version that your application is running on.\n\n```\nimport {\
    \ Platform } from 'react-native';\n\nconsole.log(\"What OS am I using?\");\nconsole.log(Platform.OS);\n\
    \nconsole.log(\"What version of the OS?\");\nconsole.log(Platform.Version); //\
    \ e.g., 25 for Android Nougat\n```\n\nThe Platform API can be useful when you\
    \ want to adjust a few elements on the platform but don't want to write fully\
    \ separate component implementations. One use case is for stylesheets, such as\
    \ when you have different color schemes for different platforms.\n\n```\nimport\
    \ { Platform, StyleSheet } from 'react-native';\n\nconst styles = StyleSheet.create({\n\
    \  color: (Platform.OS === \"ios\") ? \"#FF6666\" : \"#DD4444\",\n});\n```\n\n\
    # When to Use Platform-Specific Components\n\nWhen is it appropriate to use a\
    \ platform-specific component? In most cases, you'll want to do so when there's\
    \ a platform-specific interaction pattern that your application to adhere to.\
    \ If you want your application to feel truly \"native,\" it's worth paying attention\
    \ to platform-specific UI norms.\n\nApple and Google provide both human interface\
    \ guidelines for their platforms which are worth consuming:\n\n+   - iOS Human\
    \ Interface Guidelines\n- Android Design Reference\n\nBy creating platform-specific\
    \ versions of only certain components, you can strike a balance between code reuse\
    \ and platform-based customization. In most cases, you should only need separate\
    \ implementations of a handful of components in order to support both iOS and\
    \ Android."
