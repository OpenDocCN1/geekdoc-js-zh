    # ## Debugging with console.log


    One of the most basic, and common, forms of debugging is the "print it out and
    see what’s happening" tactic. For many web-based developers, being able to add
    console.log to our code is an almost unconscious part of our workflow.


    The JavaScript console works straight out of the box with React Native; you don’t
    need to do any special configuration in order to use your print statements.


    When using Xcode, you will see your console statements as output in the Xcode
    console (Figure 9-3). Note that you can expand how much room is allotted to the
    console by tweaking the visible Xcode panes.'
