  md: '# CHAPTER 6


    # Platform APIs


    When building mobile applications, you will naturally want to take advantage of
    the host platform’s specific APIs. React Native makes it easy to access things
    like the phone’s camera roll, roll, location, and persistent storage. These platform
    APIs are made available to React Native through included modules, which provide
    us with easy-to-use asynchronous JavaScript interfaces to these capabilities.


    React Native does not wrap all of its host’s functionality by default; some platform
    APIs will require you to either write your own modules, or use modules written
    by others in the React Native community. We will cover that process in Chapter
    7. The docs are the best place to check if an API is supported.


    This chapter covers some of the available platform APIs. For our example, we’ll
    add geolocation to the app so it detects the user’s location automatically. We
    will also add “memory” to the app so it will remember your previously searched
    locations. Finally, we’ll use the camera roll to change the background image to
    one of the user’s photos.


    While relevant code snippets will be presented in each section, the full code
    for the application is included in “The SmarterWeather Application” on page 104.


    # Using Geolocation


    For mobile applications, knowing the user’s location is often critical. It allows
    you to serve the user contextually relevant information. Many mobile applications
    make extensive use of this data.


    React Native has built-in support for geolocation. This is provided as a platform-agnostic
    “polyfill.” It returns data based on the MDN Geolocation API web specification.
    Because we’re using the Geolocation specification, you won’t need to deal with'
  merge: -1
  pgno: 105
- img_proc: true
  md: "platform-specific APIs like Location Services, and any location-aware code\
    \ you write should be fully portable.\n\n# Reading the User’s Location\n\nUsing\
    \ the Geolocation API to get a user's location is a breeze. As shown in Example\
    \ 6-1, we need to make a call to navigator.geolocation.\n\nExample 6-1. Getting\
    \ the user's location with a navigator.geolocation call\n\n```\nnavigator.geolocation.getCurrentPosition(\n\
    \  (position) => {\n    console.log(position);\n  },\n  (error) => alert(error.message),\n\
    \  {enableHighAccuracy: true, timeout: 20000, maximumAge: 1000}\n);\n```\n\nThe\
    \ position will be printed to the JavaScript console; see \"Debugging with console\"\
    \ on page 141 for more information on how to work with the code.\n\nIn conformance\
    \ with the Geolocation specification, we don't import the location API as a separate\
    \ module; it is simply available for our use.\n\nThe getCurrentPosition call takes\
    \ three arguments: a success callback, an error callback, and a set of geoOptions.\
    \ Only the success callback is required.\n\nThe position object passed to the\
    \ success callback will contain coordinates, as well as a timestamp. Example 6-2\
    \ shows the format and possible values.\n\nExample 6-2. Shape of the response\
    \ returned from a getCurrentPosition call\n\n```\n{\n  coords: {\n    speed:-1,\n\
    \    longitude:-122.03031802,\n    latitude:37.332955199998,\n    accuracy:500,\n\
    \    heading:-1,\n    altitude:0,\n    altitudeAccuracy:-1\n  },\n  timestamp:459780747046.385\n\
    }\n```\n\ngeoOptions should be an object, which optionally includes the timeout,\
    \ enable HighAccuracy, and maximumAge. timeout is probably the most relevant of\
    \ the bunch when it comes to affecting your application logic."
