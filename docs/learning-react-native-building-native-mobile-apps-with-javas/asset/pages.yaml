    # Working with the React Developer Tools


    When you''re developing with React for the web, the React developer tools are
    quite useful. They allow you to inspect the component hierarchy, examine the props
    and state of components, and modify the state from your browser. The React developer
    tools are available as a Chrome extension.


    The React developer tools work with React Native as well. You''ll need to install
    the standalone version to use them with React Native:


    ```

    npm install -g react-devtools

    ```


    Then launch the DevTools, shown in Figure 9-7, by running:


    ```

    react-devtools

    ```'
