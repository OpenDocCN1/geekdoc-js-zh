  md: "This <Button> component is a decent starting point, you'll probably want to\
    \ create your own interactive components. For that, we'll need to use <TouchableHighlight>.\n\
    \n# Using the <TouchableHighlight> Component\n\nAny interface elements that respond\
    \ to user touch (buttons, control elements, etc.) should usually have a <TouchableHighlight>\
    \ wrapper. <TouchableHighlight> causes an overlay to appear when the view is touched,\
    \ giving the user visual feedback. This is one of the key interactions that causes\
    \ a mobile application to feel native, as opposed to a mobile-optimized website,\
    \ where touch feedback is limited. As a general rule of thumb, you should use\
    \ <TouchableHighlight> anywhere there would be a button or a link on the web.\n\
    \nAt its most basic usage, just need to wrap your component in a <TouchableHighlight>,\
    \ which will add a simple overlay when pressed. The <TouchableHighlight> component\
    \ also gives you hooks for events such as onPress, onPressOut, onLongPress and\
    \ like, so you can use these events in your React applications.\n\nExample 4-3\
    \ shows how you can wrap a component in a <TouchableHighlight> in order to give\
    \ the user feedback.\n\nExample 4-3. Using the <TouchableHighlight> component\n\
    \n```\n<TouchableHighlight\nPressIn={this._onPressIn}\nPressOut={this._onPressOut}\n\
    accessibilityLabel={'PUSH ME'}\nstyle={styles.touchable}>\n  <View style={styles.button}>\n\
    \    <Text style={styles.welcome}>\n      {this.state.pressing ? \"EEK!\" : \"\
    PUSH ME\"}\n    </Text>\n  </View>\n</TouchableHighlight>\n```\n\nWhen the user\
    \ taps the button, an overlay appears, and the text changes (Figure 4-2)."
