  md: '# APPENDIX B


    # # Deploying Your Application


    Once you have built your *totally awesome* application, you''ll want to get it
    into the hands of your users.


    The process for building and deploying your production application varies by platform,
    and both Google and Apple periodically update the specific steps required. However,
    the basic process remains the same:


    +   1. Triple-check your assets: application icon, launch screen, and so on.

    2. Specify target OS versions and devices.

    3. Create a release build.

    4. Get your paperwork in order.

    5. Create an App Store and Play Store listing, including promotional screenshots.

    6. Send the app to your beta testers and solicit feedback.

    7. Submit for review.

    8. Release!


    # Check Your Application Assets and Specify Target OS Versions and Devices


    It''s easy to overlook these steps during development. You''ll want to make sure
    that you have a suitable application icon and launch screen for your application
    in the correct sizes and resolutions for all the devices you intend to target.


    Similarly, for any images, video, or other assets utilized by your application,
    make sure that you have included versions appropriate to each targeted device.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Create a Release Build


    You will need to compile your application into a production-ready release build
    before shipping it off to your end users. This version of your application won''t
    have debugging enabled and will include the bundled JavaScript instead of relying
    on the React Native packer.


    For both iOS and Android, the official React Native documentation includes guidance
    on creating production-ready builds.


    # Complete Your Paperwork


    In order to distribute your application to Android devices, you''ll probably want
    to register with Google Play. Similarly, you''ll need to register for an Apple
    Developer account in order to submit to the App Store.


    As part of this process, you will need to provide some standard information, such
    as contact and payment information.


    # Beta Test Your Application


    You''ll want to test your application on a variety of devices and operating system
    versions. How does it perform in landscape versus portrait mode? With low battery?
    With a slow network? What happens when you get interrupted by push notifications?


    Getting your application into the hands of real users is the best way to evaluate
    how your application performs in real-world scenarios. Both the Play Store and
    the App Store have built-in programs to facilitate distribution of your application
    to beta testers.


    # Create a Listing


    You''ll need to convince people to download your application! Gather your promotional
    screenshots, select the appropriate category, and write a compelling description.


    Once that''s done, you can submit your application for review.


    # Wait for Review


    As web developers, we''re used to having more control over our deploy processes.
    You may be accustomed to shipping code to production many times in a single day,
    where versions are usually a nonissue. With the iOS App Store and Google Play
    Store, deployment is more complicated, and new version releases typically require
    review.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Review times vary from a day to a couple of weeks. Thus, it''s important to
    take the submission and review process into account during your planning phase.


    # Release


    After putting in the hard work to create your application, seeing it go live (Figure
    B-1) can feel exhilarating. However, releasing your application to users is just
    the beginning, and you''ll have to support your application postrelease. Unlike
    the web, where you can deploy easily and often, new mobile versions take time,
    and have a longer lifespan. Many iOS and Android users have no auto-updating enabled,
    so every version counts. And at minimum you''ll need to wait for application review
    each time you wish to submit an update or bug fix. (For truly critical bug fixes,
    you must request an expedited review, but use these carefully.)


    ![](img/1a32334c3c38f46e3c4219c7d228280e_231_0.png)


    Figure B-1. The flashcard application, live on the Play Store


    And, finally: congratulations on shipping your app!'
