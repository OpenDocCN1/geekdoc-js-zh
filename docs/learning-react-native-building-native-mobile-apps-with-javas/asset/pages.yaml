    ```

    ./gradle installRelease

    INSTALL_PARSE_FAILED_INCONSISTENT_CERTIFICATES:

    New package has a different signature

    ```


    You can solve this by uninstalling the old application from your device or emulator,
    and reattempting the installation. The error is caused by attempting to install
    an application with a different signing key—which happens after you generate your
    first signed APK.


    # The React Native Packer


    Because React Native depends on the packager in order to rebuild your code, issues
    with the packager will manifest in problems quickly.


    The React Native packer will launch automatically when you run your project, either
    from Xcode or react-native run-android. However, it will not quit automatically
    when you close your project. This means that if you switch devices, the packager
    will still be running—just from the root directory, so it will fail to compile
    your code. Always make sure that the packager is running from project’s root directory.
    You can launch it with npm start.


    If the React Native packer throws strange errors upon starting, chances are good
    that your development environment is in a bad state. Following the steps described,
    make sure that your local installations of npm, Node, and react-native are all
    in a good state.


    # Issues Deploying to an iOS Device


    When attempting to test your application on a real iOS device, you may encounter
    some peculiar issues.'
