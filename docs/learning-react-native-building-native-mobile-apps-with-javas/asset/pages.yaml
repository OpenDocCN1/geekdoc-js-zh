    # Uploading an Image to a Server


    What if you want to upload a photo somewhere? React Native ships with built-in
    image uploading functionality in the XHR module. The basic approach looks like
    this:


    ```

    let formData = new FormData();


    formdata.append(''image'', {...this.state.randomPhoto, name: ''image.jpg''});


    xhr.send(formData);

    ```


    XHR is short for XMLHttpRequest. React Native implements the XHR API on top of
    the iOS networking APIs. Similar to geolocation, React Native''s XHR implementation
    is based on the MDN specification.'
