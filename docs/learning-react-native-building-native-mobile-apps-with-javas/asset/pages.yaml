  md: "# Java Native Modules\n\nNative modules for Android behave similarly to native\
    \ modules for iOS. You can find more information about Android native modules\
    \ in the docs.\n\nJust as with iOS, if you install a module for Android that includes\
    \ native code, you'll want to run react-native link after adding the module to\
    \ your application's package.json file.\n\n# Writing a Java Native Module for\
    \ Android\n\nIn order to understand how Java native modules work, we'll write\
    \ our own. Just like with Objective-C, we'll start with a simple \"Hello, World\"\
    \ module.\n\nWe'll be making a directory for our HelloWorld package. It should\
    \ be a sibling to MainActivity.java Note that the directory structure may vary\
    \ between different versions of Android and React Native. The key is that your\
    \ directory needs to be in the same directory as MainActivity.java.\n\n```\nmkdir\
    \ android/src/main/java/com/depends/helloworld\n```\n\nNow we'll add a HelloWorldModule.java\
    \ file to that directory, as shown in Example 7-6.\n\nExample 7-6. helloworld/HelloWorldModule.java\n\
    \n```\npackage com.depends.helloworld;\n\nimport android.util.Log;\nimport com.facebook.react.bridge.ReactContextBaseJavaModule;\n\
    import com.facebook.react.bridge.ReactApplicationContext;\nimport com.facebook.react.bridge.ReactMethod;\n\
    \npublic class HelloWorldModule extends ReactContextBaseJavaModule {\n    public\
    \ HelloWorldModule(ReactApplicationContext reactContext) {\n        super(reactContext);\n\
    \    }\n\n    @Override\n    public String getName() {\n        return \"HelloWorld\"\
    ;\n    }\n\n    @ReactMethod\n    public void greeting(String message) {\n   \
    \     Log.e('HelloWorldModule\", \"Saluton, \" + message);\n    }\n```"
