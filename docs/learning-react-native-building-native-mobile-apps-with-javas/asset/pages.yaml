    # Summary


    In this chapter, we dug into the specifics of a variety of the most important
    components in React Native. We discussed how to use basic low-level components,
    like <Text> and <Image>, as well as more abstract components like <FlatList>,
    <SectionList>, and <TabBarIOS>. We also looked at how to use various touch-focused
    APIs and components in case you want to build your own custom touch handlers.


    At this point, you should be equipped to build basic functional applications using
    React Native! Now that you''ve acquainted yourself with the components discussed
    in this chapter, building upon them and combining them to create your own applications
    should feel remarkably similar to working with React on the web.


    Of course, building up basic functioning applications is only part of the battle.
    In the next chapter, we''ll focus on styling and how to use React Native''s implementation
    of styles to get the look and feel you want on mobile.'
