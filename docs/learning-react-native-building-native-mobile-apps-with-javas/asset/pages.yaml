    The first time you attempt to run your application on any particular device, Xcode
    will prompt you to sign into your Apple account and register your device for development.


    For more details on how to run your application on a real iOS device, check out
    Apple''s official documentation.


    Note that your iOS device and your computer must be on the same network in order
    for your application to run.


    # Running Your App on Android


    In order to run your application on Android, you need a fully functioning Android
    developer setup, including Android Studio and the Android SDK. See the Getting
    Started documentation for a list of Android dependencies.


    To launch your React Native platform on Android, run:


    ```

    react-native run-android

    ```


    You can also open your application in Android Studio and compile and run it from
    there.


    You can either run your application in the Android emulator or on a physical device
    connected via USB. In order to run on a physical device, you will need to enable
    USB debugging in your device''s Developer Options. More detailed instructions
    are available in the Android Studio documentation.'
