  md: "If you've never render JSX before, don't worry: it's pretty simple. As an example,\
    \ a pure-JavaScript React component for the web might look something like this:\n\
    \n```\nclass HelloMessage extends React.Component {\n  render() {\n    return\
    \ React.createElement(\n      \"div\",\n      null,\n      \"Hello \\n      this.props.name\n\
    \    );\n  }\n}\n```\n\nReactDOM.render(HelloMessage, { name: \"Bonnie\" }, mountNode);\n\
    \nWe can render this much succinctly by using JSX. Instead of calling React.createElement\
    \ and passing in a list of HTML attributes, we use XML-like markup:\n\n```\nclass\
    \ HelloMessage extends Component {\n  render() {\n    // Instead of calling createElement,\
    \ we return markup\n    return <div>{this.props.name}</div>\n  }\n}\n```\n\n//\
    \ We no longer need a createElement here\nReactDOM.render(<HelloMessage name=\"\
    Bonnie\" />, mountNode);\n\nBoth of these will render the following HTML onto\
    \ the page:\n\n```\n<div>Hello Bonnie</div>\n```\n\n# # Styling Native Components\n\
    \nOn the web, we style React components using CSS, just as we would any other\
    \ HTML element. whether you love it or hate it, CSS is a necessary part of the\
    \ web. React also does not affect the way we write CSS. But it makes it easier\
    \ to dynamically build class names based on props, and otherwise React is mostly\
    \ agnostic about how we handle styles on the web.\n\nNon-web platforms have a\
    \ wide array of approaches to layout and styling. We work with React Native, thankfully,\
    \ we utilize one standardized approach to styling. Part of the bridge between\
    \ React and the host platform includes the implementation of a heavily pruned\
    \ subset of CSS. This narrow implementation of CSS relies primarily on flexbox\
    \ for layout, and focuses on simplicity rather than implementing the full range\
    \ of CSS rules. Unlike the web, where CSS support varies across browsers, React\
    \ Native is able to enforce consistent support of style rules. As with the various\
    \ UI"
