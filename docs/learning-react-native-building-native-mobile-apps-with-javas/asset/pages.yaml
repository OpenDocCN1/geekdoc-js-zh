  md: '}

    }


    In the case of a conflict, such as when two objects specify the same property,
    React Native will resolve the conflict for you. The rightmost elements in the
    style array take precedence, and false values (false, null, undefined) are ignored.


    You can leverage this pattern to apply conditional styles. For example, if we
    had a <Button> component and wanted to apply extra style rules if it''s being
    touched, we could use the code shown in Example 5-5.


    5-5. Using conditional styles


    ```

    <View style={[styles.button, this.state.touching && styles.highlight]}> />

    ```


    This shortcut can help keep your rendering logic concise.

    In general, style concatenation is a useful tool for combining styles. It''s interesting
    to contrast concatenation with web-based stylesheet approaches: @extend in SASS,
    and nesting and overriding classes in vanilla CSS. Style concatenation is a more
    limited tool, which is arguably a good thing; keeps the logic simple and makes
    it easier to reason about what styles are being applied and how.


    # Organization and Inheritance


    In most of the examples so far, we append our style code to the end of the main
    JavaScript file with a single call to StyleSheet.create. For example code, this
    works well enough, but it''s not something you''ll likely want to do in an actual
    application. How should we actually organize styles? In this section, we will
