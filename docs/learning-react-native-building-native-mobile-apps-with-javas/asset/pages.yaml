  md: "# Creating a Navigator\n\nLet's start by using react-navigation to our project.\n\
    \n```\nnpm install --save react-navigation\n```\n\nReact Navigation actually provides\
    \ several navigators. Navigators render common, configurable UI elements, such\
    \ as headers. They also determine your application's navigation structure. We're\
    \ going to use the StackNavigator, which renders a single screen at a time and\
    \ provides transitions between a \"stack\" of screens. This is probably the most\
    \ common UI pattern for mobile applications.\n\nOther navigators provided by React\
    \ Navigation, such as the TabNavigator and the DrawerNavigator, provide slightly\
    \ different perspectives on application structure. You can also combine several\
    \ navigators within a single application.\n\nFor now, let's implement the StackNavigator\
    \ in components/Flashcards.js.\n\n```\nimport StackNavigator from \"react-navigation\"\
    \n\nlet navigator = StackNavigator({\n  Home: { screen: DeckScreen },\n  Review:\
    \ { screen: ReviewScreen },\n  CardCreation: { screen: NewCardScreen }\n});\n\
    ```\n\nIn order to use the StackNavigator, we need to create it with information\
    \ about the available screens.\n\nThen, instead of exporting the <Flashcards>\
    \ component from Flashcards.js, we can export the navigator.\n\n```\nexport default\
    \ navigator;\n```\n\n# Using navigation.to Transition Between Screens\n\nWhat\
    \ does creating a StackNavigator get us? Well, each screen included in the StackNavigator\
    \ will be rendered with a special navigation prop. If we call:\n\n```\nthis.props.navigation.navigate(\"\
    SomeRoute\")\n```\n\nThe navigator will attempt to find the appropriately named\
    \ screen to render.\n\nAdditionally, we can navigate one step back in the stack:\n\
    \n```\nthis.props.navigation.goBack();\n```\n\nLet's modify the <DeckScreen> component\
    \ so that tapping on a deck brings us to the <ReviewScreen>.\n\nFirst, let's look\
    \ at the <Deck> component, which is used by <DeckScreen> (see Example 10-16)."
