  md: "When dealing with <Text> components in React Native, you no longer have access\
    \ to subtags such as using <strong> and <em>, though you can apply styles to achieve\
    \ similar effects by using attributes such as fontWeight and单独. Here's how you\
    \ might achieve a similar effect by making use of inline styles:\n\n```\n<Text>\n\
    The quick <Text style={{fontStyle: \"italic\"}}>brown</Text> fox jumped over the\
    \ lazy <Text style={{fontWeight: \"bold\"}}>dog</Text>\n</Text>\n```\n\nThis approach\
    \ could quickly become verbose. You'll likely want to use styled components as\
    \ a shorthand for dealing with text, as shown in Example 4-1.\n\n# Example 4-1.\
    \ Creating reusable components for using text\n\n```\nconst styles = StyleSheet.create({\n\
    bold: {\n  fontWeight: \"bold\"\n},\nitalic: {\n  fontStyle: \"italic\"\n}\n});\n\
