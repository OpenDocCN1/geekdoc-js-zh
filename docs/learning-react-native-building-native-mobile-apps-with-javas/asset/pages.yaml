    ```\nimport { ADD_DECK, ADD_CARD } from \"../actions/types\";\n\nfunction decksWithNewCard(oldDecks,\
    \ card) {\n  return oldDecks.map(deck => {\n    if (deck.id === card.deckID) {\n\
    \      deck.addCard(card);\n      return deck;\n    } else {\n      return deck;\n\
    \    }\n  });\n}\n\n```\n\n```\nconst reducer = (state = [], action) => {\n  console.warn(\"\
    Changes are not persisted to disk\");\n  switch (action.type) {\n    case ADD_DECK:\n\
    \      return state.concat(action.data);\n    case ADD_CARD:\n      return decksWithNewCard(state,\
    \ action.data);\n  }\n  return state;\n};\n\n```\n\n```\nexport default reducer;\n\
