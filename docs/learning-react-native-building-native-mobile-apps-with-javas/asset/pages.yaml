  md: "Try editing this button to respond to other events, by using hooks like onPress\
    \ and onLongPress. The best way to get a sense for how these events map onto user\
    \ interactions is to experiment using a real device.\n\n# Using the PanResponder\
    \ Class\n\nUnlike <TouchableOpacity>, PanResponder is not a component but rather\
    \ a class provided by React Native. A PanResponder gestureState object gives you\
    \ access to raw position data as well as information such as velocity and accumulated\
    \ distance of the current gesture.\n\nTo make use of PanResponder in a React component,\
    \ we need to create a PanResponder object and then attach it to a component's\
    \ render method.\n\nCreating a PanResponder requires us to specify the proper\
    \ handlers for PanResponder events (Example 4-5).\n\nExample 4-5. Creating a PanResponder\
    \ requires us to register several callbacks\n\n```\nthis._panResponder = PanResponder.create({\n\
    onStartShouldSetPanResponder: this._handleStartSetPanResponder,\nonMoveShouldSetPanResponder:\
    \ this._handleMoveShouldSetPanResponder,\nonPanResponderGrant: this._handlePanResponderGrant,\n\
    onPanResponderMove: this._handlePanResponderMove,\nonPanResponderRelease: this._handlePanResponderEnd,\n\
    onPanResponderTerminate: this._handlePanResponderEnd,\n});\n```\n\nThese six functions\
    \ give us access to the full lifecycle of a touch event. onStartShouldSetPanResponder\
    \ and onMoveShouldSetPanResponder determine whether or not we should respond to\
    \ a touch event. onPanResponderGrant will be invoked when a touch event begins,\
    \ and onPanResponderRelease and onPanResponderTerminate will be invoked when a\
    \ touch event ends. We'll be able to access data about the ongoing touch event\
    \ during PanResponderMove.\n\nWe use spread syntax to attach the PanResponder\
    \ to the view in our component's render method (Example 4-6).\n\nExample 4-6.\
    \ Attaching the PanResponder using spread syntax\n\n```\nrender: function() {\n\
    \  return (\n    <View>\n      {...this._panResponder.Handlers}\n      {/* View\
