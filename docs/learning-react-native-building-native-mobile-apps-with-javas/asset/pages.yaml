    There''s quite a bit of boilerplate here. Let''s take this piece by piece.


    First, we begin with a package statement:


    ```

    package com.depends.helloworld;

    ```


    This is based on the file''s location in the directory.


    Next, we import several React Native-specific files, as well as android.util.Log.
    Any module you should import the same React Native files.


    Then we declare our HelloWorldModule class. It''s public, meaning that external
    files can use it; it extends ReactContextBaseJavaModule, meaning that inherits
    methods from ReactContextBaseJava:


    ```

    public class HelloWorldModule extends ReactContextBaseJavaModule { ... }

    ```


    There are three methods implemented here: HelloWorldModule, getName, and greet.


    In Java, a method with the same name as the class is called the constructor; invoke
    the ReactContextJavaModule constructor with a super(reactContext) and do not do
    anything else.


    getName determines name we use later on access this module from our JavaScript
    code, so make sure it''s correct! In this we call it "HelloWorld." Note that we
    add an @Override decorator here. You''ll need to implement getName for any other
    modules you use.


    Finally, greet is our method, which we want to be available in our JavaScript
    code. We add a @ReactMethod so that React Native knows when greet is called, we
    can log.e like so:


    ```

    Log.e("HelloWorld", "Hello", + name);

    ```


    The Log object provides different levels of logging. The three most commonly used
    are INFO, WARN, and ERROR, and are invoked with Log.i, Log.w, and Log.e, respectively.
    Each of these methods takes two parameters: the "tag" for your log, and the message.
    It''s standard practice to use the class name for the tag. View the Android documentation
    for more details.


    We also need to create a package to wrap this module (Example 7-7) so that we
    can include it in our build. It should also be a sibling to HelloWorldModule.java.


    Java Native Modules | 125'
