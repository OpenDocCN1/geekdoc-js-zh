    \ = \"REVIEW_DECK\";\nexport const STOP_REVIEW = \"STOP_REVIEW\";\nexport const\
    \ NEXT_REVIEW = \"NEXT_REVIEW\";\n```\n\nEach of these action types represents\
    \ a user interaction and covers the basic functionality of our application: adding\
    \ cards or decks, or starting or stopping a review.\n\nAn action in Redux is an\
    \ object that contains a named type, and some extra data. We need to add some\
    \ action creators to create these objects (see Example 11-2). We could theoretically\
    \ skip having a separate file with action creators, centralizing this code will\
    \ help keep React components clean, and give us a single file to find action definitions.\n\
    \nExample 11-2. src_checkpoint_03/actions/creators.js\n\n```\nimport {\nADD_DECK,\n\
