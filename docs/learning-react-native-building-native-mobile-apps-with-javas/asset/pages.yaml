  md: "elements, you can see many examples of supported styles in the RNTester application,\
    \ which is one of the examples that ships with React Native.\n\nReact Native also\
    \ insists on the use of inline styles, which exist as JavaScript objects. The\
    \ React team has advocated for this approach before in React web applications.\
    \ If you have previously experimented with inline styles in React, the syntax\
    \ will look familiar to you:\n\n```\n// Define a style...\nconst style = {\n \
    \ backgroundColor: 'white',\n  fontSize: '16px'\n};\n\n//...and then apply it.\n\
    const txt = (\n  <Text style={style}>\n    A styled Text\n  </Text>\n);\n```\n\
    \nReact Native also provides utilities for creating and extending style objects\
    \ that making inline styles a more manageable process. We will explore these later\
    \ in Chapter 5.\n\nDoes looking at inline styles make you twitch? If you're coming\
    \ from a web-based background, this is a break from standard practices. Working\
    \ with style objects, as opposed to styles, takes some mental adjustments and\
    \ changes the way you need to writing styles. In the context of React Native,\
    \ it is a useful shift. We will be discussing best practices and workflow in Chapter\
    \ 5. Just try not to be surprised when you see them in use!\n\n# Host Platform\
    \ APIs\n\nPerhaps the biggest difference between React for the web and React Native\
    \ is the way we think about host platform APIs. On the web, we often deal with\
    \ fragmentation and inconsistent adoption of standards; still, most browsers support\
    \ a common core of shared features. With React Native, however, platform-specific\
    \ APIs play a much larger role in creating an excellent, natural-feeling user\
    \ experience. There are also many options to consider. Mobile API include everything\
    \ from data storage to location services to accessing hardware such as the camera.\
    \ Unconventional platforms lead to even more interesting APIs—what the interface\
    \ look like between React Native and a virtual reality headset, for instance?\n\
    \nBy default, React Native for iOS and Android includes support for many commonly\
    \ used features, and React Native can support any asynchronous API. We will take\
    \ a look at many of them throughout this book. React Native makes it straightforward\
    \ and simple to use host platform APIs, so you can experiment freely. Be sure\
    \ to"
