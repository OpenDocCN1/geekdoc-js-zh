  md: "# Styling with Objects\n\nIf you take a look at the inline style syntax, you\
    \ will see that it's simply passing an object to the style attribute. There's\
    \ no need to create the style object in the render method, though. Instead, you\
    \ can separate it out, as shown in Example 5-2.\n\nExample 5-2. The style attribute\
    \ will accept a JavaScript object\n\n```\nconst italic = {\n  fontStyle: \"italic\"\
    \n};\nconst bold = {\n  fontWeight: \"bold\"\n};\n...\nrender() {\n  return (\n\
    \    <Text>\n      The quick <Text style={italic}>brown</Text> fox\n      jumped\
    \ over the lazy <Text style={bold}>dog</Text>\n    </Text>\n  );\n}\n```\n\n#\
    \ Using StyleSheet.create\n\nYou will notice that almost all of the React Native\
    \ code makes use of StyleSheet. This function is a small piece of syntactic sugar\
    \ with some added perks.\n\nCreating StyleSheets rather than passing raw JavaScript\
    \ objects can reduce the number of allocations (thus benefiting performance);\
    \ it also encourages you to organize your code more cleanly. These StyleSheets\
    \ are immutable, which is usually helpful.\n\nUsing StyleSheet.create is strictly\
    \ optional, but in general you'll want to use it.\n\nPanDemo.js, from Example\
    \ 4-10, gives us a good counterexample in which the immutability provided by StyleSheet.create\
    \ is a hindrance rather than a help. Recall that we wanted to update the location\
    \ of a circle based on movement—or words, each time we received an update from\
    \ the PanResponder, we needed to update state as well change the styles on the\
    \ circle. In this circumstance, we don't want immutability at all, least not for\
    \ the style controlling the circle's location. Therefore, we can use a plain object\
    \ to store the style for the circle."
