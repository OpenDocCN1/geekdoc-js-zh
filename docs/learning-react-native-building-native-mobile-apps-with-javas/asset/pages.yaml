  md: "First, we need a switch statement based on the action's type. We're only handling\
    \ the ADD_DECK action for now. In all other cases we return the original state,\
    \ unmodified. This is very important—don't forget to handle the default case!\n\
    \nThen, if the action type is in fact ADD_DECK, we concatenate the new deck to\
    \ our existing state and return it.\n\nNow let's implement the rest of the deckReducer\
