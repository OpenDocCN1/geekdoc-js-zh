    # Navigation


    Navigation in the context of mobile apps refers, roughly, the code that allows
    users to transition from one screen to another. On the web, this is part of the
    history API, which provides concepts such as "backward" and "forward.".


    Common used components for navigation in React Native include the built-in <Navigator>
    and <Navigator10> components, as well as community solutions like <StackNavigator>
    (provided by the react-navigation library).


    Navigation logic is necessary in order to move between screens in your mobile
    application. It also enables "deep linking," so that users can jump from a URL
    into a particular screen within your app.


    We''ll cover navigation in depth in Chapter 10.'
