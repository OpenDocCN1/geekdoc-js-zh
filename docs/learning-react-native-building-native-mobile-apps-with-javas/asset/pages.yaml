    ```\n\nOmitted here are the various callbacks you will need to register with the\
    \ XHR request.\n\n# Storing Persistent Data with AsyncStorage\n\nApplications\
    \ will need to keep track of some variety of data persistently. How do you accomplish\
    \ this with React Native?\n\nReact Native provides us with AsyncStorage, a key-value\
    \ store that is global to your application. If you have used LocalStorage on the\
    \ web, AsyncStorage would feel quite similar. Its implementation varies by platform,\
    \ but the JavaScript API is the same regardless of whether you are using Android\
    \ or iOS.\n\nLet's take a look at how to use the React Native module.\n\nThe storage\
    \ key by AsyncStorage can be any string; it's customary to use the format @AppNative:key,\
    \ like so:\n\n```\nconst STORAGE_KEY = '@SmarterWeather:zip';\n```\n\nThe AsyncStorage\
    \ module returns a response to both getItem and setState. For the SmarterWeather\
