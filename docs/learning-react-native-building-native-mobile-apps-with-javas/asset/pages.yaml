- img_proc: true
  md: 'think about what feels *right* for your target platform, and design with natural
    interactions in mind.


    Inevitably, the React Native bridge will not expose all platform functionality.
    If you find yourself in need of an unsupported feature, you have the option of
    adding it to React Native yourself. Alternatively, chances are good that someone
    else has done so already, be sure to check for community implementations. We’ll
    cover this in Chapter 7.


    It is also worth noting that utilizing host platform APIs has implications for
    code reuse. React components that need platform-specific functionality will be
    platform-specific as well. Isolating and encapsulating those components will bring
    added flexibility to your application. Of course, this applies for the web, too:
    if you plan on sharing code between React Native and React, keep in mind that
    things like the DOM do not actually exist in React Native.


    # Summary


    Writing components for mobile is a bit different in React Native when compared
    with React for the web. JSX is mandatory, and our basic building blocks are now
    components such as `<View>` in lieu of HTML elements as `<div>`. Styling is also
    quite different, based on a subset of CSS, and we assign styles with inline syntax.
    Still, these adjustments are quite manageable. In the next chapter, we’ll put
    this into practice as we build our first application!'
