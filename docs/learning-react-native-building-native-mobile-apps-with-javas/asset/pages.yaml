  md: 'It is also possible to include web-based image sources instead of bundling
    your assets with your application. For example:


    ```

    <Image source={uri: "https://facebook.github.io/react/img/logo_og.png"} style={width:
    400, height: 400} />

    ```


    When utilizing network resources, you will need to specify dimensions manually.


    Downloading images via the network rather than including them as assets has many
    advantages. During development, for instance, it may be easier to use this approach
    while prototyping rather than carefully importing all of your assets ahead of
    time. It also reduces the size of your bundled application so that users do not
    need to download all of your assets. However, it means that you''ll be relying
    on their data plan when they access your application in the future. For most cases,
    you''ll want to avoid using the URI-based method.


    If you''re wondering about working with the user''s own images, we''ll cover the
    camera roll in Chapter 6.


    Because React Native emphasizes a component-based approach, images must be included
    as <Image> components instead of an image referenced via styles. For instance,
    in Chapter 3, we wanted to use an image as a background for our weather application.
    Whereas in plain HTML and CSS you would likely use the background-image property
    to apply a background image, in React Native you use the <Image> as a container
    component, like so:


    ```

    <Image source={require("./puppies.png")}>

    {/* Your content here... ** */}

    </Image>

    ```


    Styling the images themselves is fairly straightforward. In addition to applying
    styles, you''ll use certain props to control how the image will be rendered. You''ll
    often make use of the resizeMode prop, for instance, which can be set to contain,
    cover, or stretch. The UIExplorer app demonstrates this well (Figure 4-1).'
