  md: '# CHAPTER 8


    # Platform-Specific Code


    In Chapter 7 we looked at how to write native modules with separate implementations
    in Java and Objective-C. This raises two questions: first, do all React Native
    components have implementations on both iOS and Android? Should they? How should
    you handle platform-specific implementations in your own code?


    Not components are available on all platforms, and not all interaction patterns
    are appropriate for all devices. That doesn''t mean you can''t use platform-specific
    code in your application, though! In this section, we''ll cover platform-specific
    interface and implementations, as well as strategies for how to incorporate platform-specific
    components into your cross-platform applications.


    ![](img/1a32334c3c38f46e3c4219c7d228280e_147_0.png)


    Writing cross-platform code in React Native is not an all-or-nothing endeavor:
    you can mix cross-platform and platform-specific code in your application, as
    we''ll do in this section.


    # iOS- or Android-Only Components


    Some components are available only on a specific platform. This includes things
    like `<TabBariOS>` or `<ToolbarAndroid>`. They are usually platform-specific because
    they wrap some kind of underlying platform-specific API. For some components,
    having a platform-agnostic version doesn''t make sense. For instance, the `<ToolbarAndroid>`
    exposes an Android-specific API for a view type that doesn''t exist on iOS anyway.


    Platform-specific components are named with an appropriate suffix: either iOS
    or Android. If you try to include one on the wrong platform, your application
    will crash.'
  merge: -1
  pgno: 147
- img_proc: true
  md: "Components can also have platform-specific props. These are tagged in the documentation\
    \ with a small badge indicating their usage. For instance, <TextInput> has some\
    \ props that are platform-agnostic and others that are specific to iOS or Android\
    \ (Figure 8-1).\n\n| ios maxLength |\n Limits the maximum number of characters\
    \ that can be entered. Use this instead of implementing the logic in JS to avoid\
    \ flicker. |\n| android numberOfLines |\n Sets the number of lines for a TextInput.\
    \ Use it with multiline set to true to be able to fill the lines. |\n\nFigure\
    \ 8-1. <TextInput> has Android and iOS-specific props\n\n# Components with Platform-Specific\
    \ Implementations\n\nSo, how do you handle platform-specific components or props\
    \ in a cross-platform application? The good news is that can still use these components\
    \ by including them inside another component with a platform-specific implementation,\
    \ you'll be able to render the appropriate content for each platform your app\
    \ is designed for.\n\n> A platform-specific component works only on a specific\
    \ platform. For example, <Toolbar android:id=> is Android-only. A component with\
    \ platform-specific implementation might work on several platforms but may be\
    \ implemented and behave differently.\n\nA very common practice is to have a parent\
    \ component that “wraps” platform-specific behavior and presents a unified API.\
    \ For elements such as navigation UI, this makes a lot of sense; the interaction\
    \ patterns vary greatly between iOS and Android.\n\nIn this section, we will discuss\
    \ how to implement platform-specific behavior in your components.\n\n# Using Platform-Specific\
    \ File Extensions\n\nRemember how React Native applications are initialized with\
    \ both an index.ios.js and an index.android.js file? This naming convention can\
    \ be used for any file to create a component that has different implementations\
    \ on Android and iOS.\n\nExample 8-1 demonstrates the Android implementation of\
    \ a simple component that shows a pop-up message."
