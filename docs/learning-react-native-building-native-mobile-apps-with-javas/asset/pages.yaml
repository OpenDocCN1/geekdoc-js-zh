  md: "# Concatenating Styles\n\nWhat happens if you want to combine two or more styles?\n\
    \nRecall earlier we said that we should prefer reusing styled components over\
    \ styles. That's true, but sometimes reuse is also useful. For instance, if you\
    \ have a button style and an accentText style, you may want to combine them to\
    \ create an AccentButton component.\n\nIf the styles StyleSheet look like this:\n\
    \n```\nconst styles = StyleSheet.create({\n  button: {\n    borderRadius: \"8px\"\
    ,\n    backgroundColor: \"#99CCFF\"\n  },\n  accentText: {\n    fontSize: 18,\n\
    \    fontWeight: \"bold\"\n  }\n});\n```\n\nThen you can create a component that\
    \ has both of those styles applied through simple concatenation (Example 5-3).\n\
    \nExample 5-3. The style attribute also accepts an array of objects\n\n```\nclass\
    \ AccentButton extends Component {\nrender() {\n  return (\n    <Text style={[styles.button,\
    \ styles.accentText]}>\n      {this.props.children}\n    </Text>\n  );\n}\n}\n\
    ```\n\nAs you can see, the style attribute can take an array of style objects.\
    \ You can also add inline styles if you want (Example 5-4).\n\nExample 5-4. You\
    \ can mix style objects and inline styles\n\n```\nclass AccentButton extends Component\
    \ {\nrender() {\n  return (\n    <Text style={[styles.button, styles.accentText,\
    \ {color: \"#FFFFFF\"}]}>\n      {this.props.children}\n    </Text>\n  );\n}\n\
    }\n```"
