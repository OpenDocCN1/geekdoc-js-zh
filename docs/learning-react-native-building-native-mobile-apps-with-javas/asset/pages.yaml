  md: 'need on a specific platform, you may occasionally need to dip into Objective-C
    or Java (we''ll cover how so-called native modules work in Chapter 7). But reusing
    code across platforms is surprisingly easy with React Native. For example, the
    Facebook Ads manager for Android shares 87% of its codebase with the iOS version.
    The final application we''ll look at in this book, a flashcard app, has total
    code reuse between Android and iOS. It''s hard to beat that!


    # Risks and Drawbacks


    As anything, using React Native is not without its downsides, and whether or not
    it is a good fit for your team depends on your individual situation.


    Because React Native introduces another layer to your project, it can make debugging
    hairier, especially at the intersection of React and the host platform. We''ll
    cover debugging for React Native in more depth in Chapter 9 and try to address
    some of the most common issues.


    Along some lines, when updates are released for the host platform—say, a new suite
    of APIs in a new version of Android—there will be a lag before they are fully
    supported in React Native. The good news is that in the vast majority of cases,
    you can implement support for missing APIs yourself, which we''ll cover in Chapter
    7. Also, if you do hit a roadblock, which won''t be locked to using React Native—many
    companies have successfully implemented hybrid approaches to app development.


    Changing the platform you use to write your applications is a big choice. Still,
    I think you''ll see the benefits of React Native outweighs the risks.


    # Summary


    React Native is an exciting framework that enables web developers to create robust
    applications using their existing JavaScript knowledge. It offers faster mobile
    development and more efficient code sharing across iOS, Android, and the web without
    sacrificing the end user''s experience or application quality. The tradeoff is
    that it adds some complexity to your application setup. If your team can handle
    that and wants to develop mobile applications for more than just one platform,
    you should be looking at React Native.


    In the next chapter, we go over the main ways in which React Native differs from
    React, and cover some key concepts. If you''d like to skip straight to Chapter
    3, in which we set up our development environment and write our first React Native
    application.'
