    is to solve the issue yourself, and hopefully contribute your solution back to
    the community! Being able to write your own native modules means that you don''t
    need to rely on React Native core in order to take advantage of your host platform.


    Even if you''ve never developed for iOS or Android before, if you''re planning
    on developing with React Native, it''s a good idea to try to gain a reading knowledge
    of Objective-C and/or Java. If you hit a wall when working with React Native,
    being able to try to dig your way around it is a really invaluable asset. Don''t
    be afraid to try!


    The React Native community, as well as the broader JavaScript ecosystem, will
    be valuable resources as you develop your own React Native applications. Build
