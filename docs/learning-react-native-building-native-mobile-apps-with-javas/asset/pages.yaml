  md: '# Modern JavaScript Syntax


    Some of the code samples in this book use modern JavaScript syntax. If you''re
    not familiar with this syntax, don''t worry—it''s a pretty straightforward translation
    from the JavaScript you might be accustomed to.


    ECMAScript 5, or ES5, is the JavaScript language specification with the broadest
    adoption. However, there are many compelling language features introduced in ES6,
    ES7, and beyond. React Native uses Babel, the JavaScript compiler, to transform
    your JavaScript and JX code. One of Babel''s features is its ability to compile
    newer-style syntax into ES5-compliant JavaScript. This enables us to use language
    features from ES6 and beyond throughout our React codebase.


    # let and const


    In pre-ES6 JavaScript, we use var to declare variables: let and const. In ES6,
    there are two additional ways to declare variables: let and const. A variable
    declared with const cannot be reassigned; that is to say, the following is invalid:


    ```

    const count = 2;

    count = count + 1; // BAD

    ```


    Variables declared with let or var may be reassigned. A variable declared with
    let may only be used in the same block as it is defined.


    Some of the examples in this book still use var, but you''ll also see let and
    const. Don''t worry about the distinctions too much.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Importing Modules


    We could use CommonJS module syntax to export our components and other JavaScript
    modules (Example A-1). In this system, we require to import other modules, and
    assign a value to module.exports in order to make a file''s contents available
    to other modules.


    Example A-1. Requiring and exporting modules using CommonJS syntax


    ```

    var OtherComponent = require(''./other_component'');


    class MyComponent extends Component {

    ...

    module.exports = MyComponent;

    ```


    With ES6 module syntax, we can use the export and import commands instead. Example
    A-2 shows the equivalent code, using ES6 module syntax.


    Example A-2. Importing and exporting modules using ES6 module syntax


    ```

    import OtherComponent from ''./other_component'';


    class MyComponent extends Component {

    }

    export default MyComponent;

    ```


    # Destructuring


    Destructuring assignments provide us with a convenient shorthand for extracting
    data from objects.


    Take this ES5-compliant snippet:


    ```

    var myObj = {a: 1, b: 2};

    var a = myObj.a;

    var b = myObj.b;

    ```


    We can use destructuring to do this much succinctly:


    ```

    var {a, b} = {a: 1, b: 2};

    ```


    You''ll often see this used with import statements. When we import React, we are
    actually receiving an object. We could import without using destructuring, as
    shown in Example A-3.'
