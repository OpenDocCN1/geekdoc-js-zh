    # ### 9-5. Console output as viewed in Chrome


    Note that you need to open the console before you will see things here.


    How does this work? When you load your React Native application with remote-JavaScript
    debugging enabled, the browser loads your React Native JavaScript code from the
    React Native packer using a standard `<script>` tag, so that you have full browser-based
    debugging control. The packager uses WebSockets to communicate between the device
    and the browser.


    We don''t need to be too concerned with the specifics; we just need to know how
    to take advantage of these tools!


    In addition to using `console.log`, you can also utilize `console.warn` or `console.error`.
    In developer builds, `console.warn` will display a yellow box at the top of your
    application, while messages from `console.error` will display a full-screen red
    message. These visual indicators will be disabled in production builds so you
    don''t need to worry about them being displayed to end users.


    # Using the JavaScript Debugger


    You can also use the JavaScript debugger just as you normally would for web-based
    React development. Open up the developer tools in Chrome and switch to the source
    tab, and your breakpoints will be activated. You can see this in action Figure
    9-6.


    Note that, similar to the JavaScript console, if you don''t already have the developer
    tools pane open, the debugger may not be activated on your breakpoints. Likewise,
    if you don''t have Debug Remote JS enabled, the debugger will not be activated.'
