    </Text>


    Similarly, React Native does not inherently have any concept of header elements
    (h1, h2, etc.), but it''s easy to declare your own styled <Text> elements and
    use them as needed.


    In general, when dealing with styled text, React Native forces you to change your
    approach. Style inheritance is limited, so you lose the ability to use default
    font sets for all text nodes in the tree. Once again, the React Native documentation
    recommends using these styled components:


    +   You also lose the ability to use a default font for an entire subtree. The
    recommended way to use consistent fonts and sizes across your application is to
    create a component AppCompat that include them and use this component across your
    app. You can also use this component to make more specific components like MyAppHeader
    for other kinds of text.


    The <Text> component documentation has more details on this.


    You''ve noticed a pattern here: React Native is very opinionated in its preference
    for using styled components over inheriting or reusing styles. While it can be
    time-consuming initially, this approach leads to better isolation so you can render
    a component anywhere in your application and get the same result. This turn makes
    it easier to maintain the styling code in your application. We will discuss this
    approach further in the next chapter.


    # The <Image> Component


    If text is the most basic element in an application, images are a close contender
    for both mobile and the web. When writing HTML and CSS for the web, we include
    images in a variety of ways: sometimes we use the <img> tag at other times we
    apply images via CSS, so when we use the background-image property. In React Native,
    we have a similar <Image> component, but it behaves a little differently.


    The basic usage of the <Image> component is straightforward; just you get the
    source prop:


    ```

    <Image source={require("./puppies.png")} />

    ```


    The image path is resolved exactly as JavaScript modules are resolved. So, in
    the preceding example, puppies.png should be provided in the same folder as the
    component that requires it.


    There''s some filename magic going on here, too. If you provide puppies.ios.png
    and puppies.android.png, the appropriate file will be rendered on each platform.
    Similarly, if you provide images with suffixes like @2x and @3x, the React Native
    packager will select the appropriate image for the device''s screen density.'
