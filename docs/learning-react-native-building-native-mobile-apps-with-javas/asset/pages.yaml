  md: '# Positioning and Designing Layouts


    One of the biggest changes when working with styling in React Native is positioning.
    CSS supports a proliferation of positioning techniques. Between float, absolute
    positioning, tables, block layout, and more, it''s easy to get lost! React Native''s
    approach to positioning is more focused, relying primarily on flexbox as well
    as absolute positioning, with the familiar properties of margin and padding. In
    this section, we''ll look at how layouts are constructed in React Native, and
    finish off by building a layout in the style of Mondrian painting.


    # Using Layouts with Flexbox


    Flexbox is a CSS3 layout mode. Unlike existing layout modes such as block and
    inline, flexbox uses a directional way of constructing layouts. (That''s right:
    finally, vertically centering is easy!) React Native leans heavily on flexbox.
    If you want to read more about the general specification, MDN documentation is
    a good place to start.


    With React Native, the following flexbox props are available:


    +   - flex

    - flexDirection

    - flexWrap

    - alignSelf

    - alignItems


    Additionally, these related values impact layout:


    +   - height

    - width

    - margin

    - border

    - padding


    If you have worked with flexbox on the web before, there won''t be many surprises
    here. Because flexbox is so important to constructing layouts in React Native,
    though, we''ll spend some time now exploring how it works.


    The basic idea behind flexbox is that you should be able to create predictably
    structured layouts, even with dynamically sized elements. Because we''re designing
    for'
