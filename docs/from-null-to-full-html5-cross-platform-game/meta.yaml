    # Saving high score


    When playing a game, you will quickly realize there is no point in making a great
    score if you can''t save it and try to beat it later.


    We are going to cover how to save your best score, and keep it saved even if you
    close the browser window or turn off your computer or device.


    All modern browsers natively support **local storage**, a way used by web pages
    to locally store data in a key/value notation.


    The information you save will continue to be stored even when you shut down your
    device and can be read every time you launch your game. This is exactly what we
    need.


    Let''s create two new variables:


    ```

    var tileSize = 80;

    var numRows = 4;

    var numCols = 5;

    var tileSpacing = 10;

    var localStorageName = "crackalien";

    var highScore;

    var tilesArray = [];

    var selectedArray = [];

    var playSound;

    var score;

    var timeLeft;

    var tilesLeft;

    var game = new Phaser.Game(500, 500);

    ```


    `localStorageName` variable stores the name of the local storage variable, so
    each time you will change crackalien with something else, you will reset your
    best score.


    `highScore` will contain the actual high score number.


    When we launch the game, before entering the title screen we will check the local
    storage to see if we already saved a high score, so we are going to add a line
    before starting `TitleScreen` state.


    This line will introduce a lot of new concepts:'
