    \ `j`.\n\nOnce `for` loops have been explained, we can jump to the core of this\
    \ step, that is the line which places the tiles:\n\n```\ngame.add.image(i * (tileSize\
    \ + tileSpacing), j * (tileSize + tileSpacing), \"tiles\");\n```\n\nYou already\
    \ saw how to place images with `add.image`, the concept does not change, it's\
