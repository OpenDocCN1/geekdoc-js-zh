    \   this.timeText = game.add.text(5, game.height - 5, \"Time left: \" + timeLeft,\
    \ style);\n    this.timeText.anchor.set(0, 1);\n    game.time.events.loop(Phaser.Timer.SECOND,\
    \ this.decreaseTime, this);\n}\n```\n\nAnyway, there's a couple of lines I want\
    \ to show you in detail:\n\n```\nthis.timeText.anchor.set(0, 1);\n```\n\nThis\
    \ time `anchor.set(0, 1)` means the anchor point is on the bottom left angle.\n\
    \nThe second line I want you to see is the one handling the timer.\n\n```\ngame.time.events.loop(Phaser.Timer.SECOND,\
    \ this.decreaseTime, this);\n```"
