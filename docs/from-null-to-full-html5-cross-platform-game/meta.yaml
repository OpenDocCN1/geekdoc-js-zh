    \n`highScore`将包含实际的最高分数值。\n\n当我们启动游戏时，在进入标题屏幕之前，我们将检查本地存储，看看是否已经保存了最高分，因此我们将在启动`TitleScreen`状态之前添加一行代码。\n\
