  - "[PAGE 23]\n\nloop iteration.\n\nHow can I say that? Let's analyze the syntax\
    \ of a `for` loop:\n\n```\nfor (start action; condition; recurring action) {\n\
    \    code block to be executed\n}\n```\n\n**start action** is executed only once\
    \ before the loop starts, just like it was on the previous line.\n\n**condition**\
    \ defines the condition for running the loop. The loop will be executed as long\
    \ as the condition is satisfied.\n\n**recurring action** is executed each time\
    \ after the loop has been executed.\n\nSo in our case the start action is setting\
    \ `i` variable to zero. The condition is satisfied until `i` is less than `numCols`.\
    \ The recurring action is adding 1 to `i` at the end of each iteration.\n\nInside\
    \ the loop we just analyzed, we have another loop:\n\n```\nfor(var j = 0; j <\
    \ numRows; j++){\n    ...\n}\n```\n\nThis works according to the same concept\
    \ seen before, it just iterates through rows rather than columns and uses variable\
    \ `j`.\n\nOnce `for` loops have been explained, we can jump to the core of this\
    \ step, that is the line which places the tiles:\n\n```\ngame.add.image(i * (tileSize\
    \ + tileSpacing), j * (tileSize + tileSpacing), \"tiles\");\n```\n\nYou already\
    \ saw how to place images with `add.image`, the concept does not change, it's\
    \ just we place each image in a different position according to `i` and `j` values,\
    \ which as you should already know change at each loop iteration."
