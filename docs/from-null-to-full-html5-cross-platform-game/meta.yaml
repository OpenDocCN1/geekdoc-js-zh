    Finally we can talk about the main topic of this section, Phaser states:


    ```

    game.state.add("PlayGame", playGame);

    ```


    Here is how we add a state to our game. The first parameter – from now on argument
    as said before – is the name we give to the state, and the second is the function
    called once the state is started.


    > `state.add(key, state)` adds a new state. You must give each state a unique
    name in `key` argument by which you''ll identify it. `state` is usually a JavaScript
    object or a function.


    In other words, we bind `playGame` function to a state called `PlayGame`.


    ```

    game.state.start("PlayGame");

    ```


    And finally this is how a state is started.


    > `state.start(key)` starts the state previously named with `key`.


    At this time, `PlayGame` state is started, calling `playGame` function which will
    consequently call `playGame.create` function.


    # Creating tile graphics using a sprite sheet


    We are going to create a board with 4 rows and 5 columns, for a total of 20 tiles
    on the stage.


    Since each tile has a symbol on it, and since each symbol is placed twice on the
    board, we have to draw 20/2 = 10 images to represent the 10 different tiles, and
    one image to represent the back of each tile, for a grand total of 11 images.


    At this time, we can-save the 11 images in eleven distinct files or group them
    all into a sprite sheet.


    > A **sprite sheet** is a series of images combined into a larger image. Usually
    the images are frames of an animation, thus a single image inside a sprite sheet
    is'
- md: "## From null to full HTML5 cross-platform game\n\n**called frame.**\n\nWhy\
    \ using a sprite sheet?\n\nBasically, every game is made by various graphical\
    \ objects. In a space shooter you will find images representing spaceships, bullets\
    \ and explosions, while in our Concentration game there will be different tiles.\
    \ It does not matter the subject of the images. What we know is we are using all\
    \ of them.\n\nEach image has a width and a height, which represent the amount\
    \ of pixels building such image, and each pixel requires some memory to hold its\
    \ color information.\n\nFor each image – and more generally for each file – saved\
    \ anywhere, there is a certain amount of memory that is wasted due to a series\
    \ of features regarding the way the file system handles the files.\n\nExplaining\
    \ this concept goes beyond the scope of this book, just keep in mind the more\
    \ files you have, the bigger the amount of memory wasted. It's not a problem when\
    \ you are dealing with a dozen files, but in complex games with a lot of images,\
    \ packing them into bigger images can save quite an amount of resources.\n\nMoreover\
    \ simply storing images is not enough. We also have to place them on the screen.\n\
    \nNo matter the graphic engine your device will be using to display images, there\
    \ will be a process which must know which image to paint, get the image from the\
    \ place where it's stored, then know which part of the image to paint – normally\
    \ the entire image – and where to paint it, and finally place it on the screen.\n\
    \nOnce the first image has been placed on the screen, this process needs to be\
    \ repeated for each other image, and the game stops until all images have been\
    \ placed. Normally you don't notice it because it happens – or at least it should\
    \ happen – in 1/60 second, but a lot of images to be placed on the screen of a\
    \ slow device can slow down performance.\n\nUsing a sprite sheet, you will have\
    \ all – or most of – your graphic assets placed into a big image, inside an invisible\
    \ grid, in order to avoid the \"what image should I load\" question and speed\
    \ up the drawing process.\n\nFollowing this concept, we are going to use one single\
    \ image with all tile graphics. Here is the one I made:\n\n![](img/94d5f4f278808ce315dcc02186d68404_16_0.png)\n\
    \nIt's a 6x2 grid where each tile is stored in a 80x80 pixels cell.\n\nNow I am\
    \ saving the image as `tiles.png` in the same folder where the entire project\
    \ is located.\n\nThis is how your project folder should look like now:\n\n![](img/94d5f4f278808ce315dcc02186d68404_16_1.png)\n\
    \n> Always save images as **PNG** as this format has the advantages of being lossless\
    \ (it does not lose quality when saved) and support alpha channel (transparency).\n\
    \nNow that we have the sprite sheet with all our game tiles, it's time to build\
    \ the game itself.\n\n## Preloading images\n\nOne of the worst things you can\
    \ do in the making of a game is to handle graphic assets before you actually loaded\
    \ them.\n\nThat's why we will need to preload the sprite sheet. Let's add a couple\
    \ of lines to game.js:\n\n```\nwindow.onload = function() {\n    var tileSize\
    \ = 80;\n    var game = new Phaser.Game(500, 500);\n    var playGame = function(game){}\n\
    \    playGame.prototype = {\n        preload: function(){\n            game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n        },\n        create: function(){\n\
    \            console.log(\"That's my awesome game\");\n        }\n    }\n    game.state.add(\"\
    PlayGame\", playGame);\n    game.state.start(\"PlayGame\");\n}\n```\n\nWhat happened\
    \ now?\n\nWe preloaded the sprite sheet we created some minutes ago. Let's see\
    \ the new lines of code:\n\n```\nvar tileSize = 80;\n```\n\nDo you remember we\
    \ created the sprite sheet where each tile is an 80x80 pixels square?\n\nWe are\
    \ going to refer to that number a lot of times in the making of the game, each\
    \ time we will need to know the size of a tile.\n\nRather than filling the source\
    \ code with a series of \"80\" scattered here and there, we are going to store\
    \ this value in a variable called tileSize.\n\nFrom null to full HTML5 cross-platform\
    \ game\n\nNot only our source code will be more readable, but above all it will\
    \ be a lot easier to make changes to the game should we decide to change the size\
    \ of the tile to, let's say, 60 or 100.\n\nNo more \"search and replace\" operations,\
    \ but a single value to change.\n\nAlso, notice the variable has been placed inside\
    \ the `window.onLoad` function: this way we will be able to access to it from\
    \ all functions declared inside `window.onLoad` function, and of course in `window.onLoad`\
    \ function itself.\n\n> In JavaScript, variables are only recognized inside their\
    \ functions, and in functions inside their functions. Variables are created when\
    \ a function starts, and deleted when the function is completed. The part of a\
    \ script where a variable is recognized is called **scope**.\n\nNow, it's time\
    \ to introduce another Phaser function to be placed inside a state.\n\n```\npreload:\
    \ function(){\n    ...\n}\n```\n\n`preload` function, as the name suggests, is\
    \ executed when the state preloads, and of course it will run before `create`\
    \ function.\n\nSince we are going to start the game itself in `create` function,\
    \ it's obvious we will need to preload all stuff in `preload` function.\n\n```\n\
    game.load.spritesheet(\"tiles\", \"tiles.png\", tileSize, tileSize);\n```\n\n\
    And finally, here's how we load a sprite sheet.\n\nFrom now on, the sprite sheet\
    \ is stored somewhere into the memory dedicated to the game, and we can access\
    \ it whenever we need it.\n\n> `load.spritesheet(key, url, frameWidth, frameHeight)`\
    \ loads a sprite sheet and wants as arguments respectively the unique asset key\
    \ of the sheet file, the URL of the sheet file, the width of each single frame\
    \ and the height of each single frame.\n\nIn our example it works this way:\n\n\
    `tiles` is the name we want to give to this sprite sheet. From now on, we will\
    \ refer to it as “tiles”.\n\n`tiles.png` is the name of the image we are using\
    \ for the sprite sheet.\n\nThe remaining two `tileSize` arguments represent respectively\
    \ the width and the height of tiles, in pixels.\n\nWe composed a sprite sheet\
    \ image, and we loaded into our Phaser game. It's time to display it on the screen.\n\
    \n## Placing images on the stage\n\nAs the sprite sheet is now preloaded, change\
    \ `create` function this way:\n\n```\ncreate: function(){\n    game.add.image(0,\
    \ 0, \"tiles\");\n}\n```\n\nNow, run the game, and that's what you are going to\
    \ see:\n\n![](img/94d5f4f278808ce315dcc02186d68404_19_0.png)\n\nThe magic started!\
    \ We finally have one image placed in the upper left corner of the stage. Which\
    \ image? The first in our sprite sheet, counting from left to right, top to bottom.\n\
    \n> `add.image(x, y, key)` places an image on the stage and wants as arguments\
    \ the x coordinate of the image, in pixels, the y coordinate of the image, in\
    \ pixels, and the key of the image used.\n\nIn our case an image is placed at\
    \ coordinates (0, 0) which is the upper left corner, with `tiles` key, which you\
    \ will remember is the key we assigned to our sprite sheet image when we preloaded\
    \ it.\n\n## Setting up the game field\n\nDo you remember we are going to build\
    \ a 4 rows x 5 columns game field?\n\nLet's place some tiles on the table.\n\n\
    For the same reason that we declared `tileSize` variable, that is to have all\
    \ main game settings assigned only once, we are going to create three new variables.\n\
    \n```\nvar tileSize =  80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing\
    \ = 10;\nvar game = new Phaser.Game(500, 500);\n```\n\nLet's see the meaning of\
    \ these new variables:\n\n`numRows` is the number of rows to be placed.\n\n`numCols`\
    \ is the number of columns to be placed.\n\n`tileSpacing` is the distance between\
    \ two contiguous tiles, in pixels.\n\nWe don't want to have all tiles to be placed\
    \ next to each other and that's why we need to put some empty space among them:\
    \ although it does not affect game play, it will make our game look better. You\
    \ will spend a lot of time making your games look better, so this is definitely\
    \ a good habit to be used to.\n\nNow it's time to change `create` function once\
    \ again, to add a new line:\n\n```\ncreate: function(){\n    this.placeTiles();\n\
    }\n```\n\nHere you will see we can also define our own custom functions.\n\nActually,\
    \ your average programming day will be full of creating custom functions."
  mdcn: "\n## 从零开始打造完整的HTML5跨平台游戏\n\n**称为帧。**\n\n为什么使用精灵图？\n\n基本上，每款游戏都由各种图形对象构成。在太空射击游戏中，你会看到代表飞船、子弹和爆炸的图像，而在我们的记忆翻牌游戏中，则会有不同的牌面图像。图像的主题并不重要，关键在于我们都在使用它们。\n\
    \n每张图像都有宽度和高度，代表构成该图像的像素数量，而每个像素都需要一定的内存来存储其颜色信息。\n\n对于每张图像——更普遍地说，对于存储在任何地方的每个文件——由于文件系统处理文件方式的一系列特性，都会有一定程度的内存被浪费。\n\
    \n解释这个概念超出了本书的范围，但请记住：文件数量越多，浪费的内存量就越大。当你处理十几个文件时，这并非问题；但在包含大量图像的复杂游戏中，将它们打包到更大的图像中可以节省相当多的资源。\n\
    \n此外，仅仅存储图像是不够的。我们还需要将它们放置到屏幕上。\n\n无论你的设备使用何种图形引擎来显示图像，都会有一个过程：它需要知道要绘制哪张图像，从存储位置获取图像，然后知道要绘制图像的哪一部分（通常是整个图像）以及绘制到屏幕的哪个位置，最终将其放置到屏幕上。\n\
    \n一旦第一张图像被放置到屏幕上，这个过程就需要对每张其他图像重复进行，游戏会一直停止直到所有图像都被放置完毕。通常你不会注意到这一点，因为它发生得很快——或者至少应该在1/60秒内完成——但在性能较慢的设备上，大量需要放置到屏幕上的图像会拖慢性能。\n\
    \n使用精灵图，你将把所有——或大部分——图形资源放置到一个大的图像中，位于一个不可见的网格内，以避免“我应该加载哪张图像”的问题，并加速绘制过程。\n\n\
    遵循这个概念，我们将使用一个包含所有牌面图形的单一图像。这是我制作的：\n\n![](img/94d5f4f278808ce315dcc02186d68404_16_0.png)\n\
    \n这是一个6x2的网格，每个牌面存储在一个80x80像素的单元格中。\n\n现在，我将图像保存为 `tiles.png`，放在整个项目所在的同一文件夹中。\n\
    \n你的项目文件夹现在应该看起来像这样：\n\n![](img/94d5f4f278808ce315dcc02186d68404_16_1.png)\n\n\
    > 始终将图像保存为 **PNG** 格式，因为这种格式具有无损（保存时不会损失质量）和支持Alpha通道（透明度）的优点。\n\n既然我们已经有了包含所有游戏牌面的精灵图，现在是时候构建游戏本身了。\n\
    \n## 预加载图像\n\n在制作游戏时，最糟糕的事情之一之一是在实际加载图形资源之前就尝试处理它们。\n\n这就是为什么我们需要预加载精灵图。让我们在 game.js\
    \ 中添加几行代码：\n\n```\nwindow.onload = function() {\n    var tileSize = 80;\n    var\
    \ game = new Phaser.Game(500, 500);\n    var playGame = function(game){}\n   \
    \ playGame.prototype = {\n        preload: function(){\n            game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n        },\n        create: function(){\n\
    \            console.log(\"That's my awesome game\");\n        }\n    }\n    game.state.add(\"\
    PlayGame\", playGame);\n    game.state.start(\"PlayGame\");\n}\n```\n\n现在发生了什么？\n\
    \n我们预加载了刚才创建的精灵图。让我们看看新的代码行：\n\n```\nvar tileSize = 80;\n```\n\n还记得我们创建的精灵图吗？每个牌面都是一个80x80像素的方块。\n\
    \n在制作游戏时，我们将多次引用这个数字，每次需要知道牌面尺寸时。\n\n与其用一系列分散在各处的“80”来填充源代码，不如将这个值存储在一个名为 `tileSize`\
    \ 的变量中。\n\n从零开始打造完整的HTML5跨平台游戏\n\n这不仅使我们的源代码更具可读性，更重要的是，如果我们决定改变牌面尺寸（比如改为60或100像素），游戏将更容易修改。\n\
    \n不再需要“查找和替换”操作，只需更改一个值即可。\n\n此外，请注意该变量被放置在 `window.onLoad` 函数内部：这样我们就可以从 `window.onLoad`\
    \ 函数内声明的所有函数中访问它，当然也可以在 `window.onLoad` 函数本身中访问。\n\n> 在JavaScript中，变量只在其函数内部以及该函数内部的函数中被识别。变量在函数开始时创建，在函数完成时删除。脚本中变量被识别的部分称为\
    \ **作用域**。\n\n现在，是时候引入另一个Phaser函数了，它要被放置在一个状态（state）中。\n\n```\npreload: function(){\n\
    \    ...\n}\n```\n\n`preload` 函数，顾名思义，在状态预加载时执行，并且当然会在 `create` 函数之前运行。\n\n既然我们计划在\
    \ `create` 函数中启动游戏本身，很明显我们需要在 `preload` 函数中预加载所有素材。\n\n```\ngame.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n```\n\n最后，这就是我们加载精灵图的方式。\n\n从现在起，精灵图被存储在游戏专用内存的某个位置，我们可以在需要时随时访问它。\n\
    \n> `load.spritesheet(key, url, frameWidth, frameHeight)` 加载一个精灵图，其参数分别是：精灵图文件的唯一资源键、精灵图文件的URL、每个单帧的宽度和高度。\n\
    \n在我们的示例中，它是这样工作的：\n\n`tiles` 是我们想给这个精灵图起的名字。从现在起，我们将称它为“tiles”。\n\n`tiles.png`\
    \ 是我们用作精灵图的图像名称。\n\n剩下的两个 `tileSize` 参数分别代表牌面的宽度和高度，单位为像素。\n\n我们制作了一个精灵图图像，并将其加载到我们的Phaser游戏中。现在是时候将其显示在屏幕上了。\n\
    \n## 将图像放置到舞台上\n\n既然精灵图已经预加载，现在以如下方式更改 `create` 函数：\n\n```\ncreate: function(){\n\
    \    game.add.image(0, 0, \"tiles\");\n}\n```\n\n现在，运行游戏，你将会看到：\n\n![](img/94d5f4f278808ce315dcc02186d68404_19_0.png)\n\
    \n魔法开始了！我们终于在舞台的左上角放置了一张图像。是哪张图像？是我们精灵图中从左到右、从上到下数的第一张图像。\n\n> `add.image(x, y,\
    \ key)` 将一张图像放置到舞台上，其参数分别是：图像的X坐标（像素）、图像的Y坐标（像素）和所用图像的键。\n\n在我们的情况中，一张图像被放置在坐标\
    \ (0, 0)（即左上角），使用 `tiles` 键——你可能还记得，这是我们预加载精灵图图像时分配的键。\n\n## 设置游戏区域\n\n还记得我们要构建一个4行x5列的游戏区域吗？\n\
    \n让我们在棋盘上放置一些牌面。\n\n出于与声明 `tileSize` 变量相同的原因——即一次性分配所有主要游戏设置——我们将创建三个新变量。\n\n\
    ```\nvar tileSize =  80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing\
    \ = 10;\nvar game = new Phaser.Game(500, 500);\n```\n\n让我们看看这些新变量的含义：\n\n`numRows`\
    \ 是要放置的行数。\n\n`numCols` 是要放置的列数。\n\n`tileSpacing` 是两个相邻牌面之间的距离，单位为像素。\n\n我们不希望所有牌面都紧挨在一起放置，这就是为什么我们需要在它们之间留出一些空白空间：虽然它不影响游戏玩法，但会让我们的游戏看起来更好。你会花很多时间让你的游戏看起来更好，所以这绝对是一个值得养成的好习惯。\n\
    \n现在是时候再次更改 `create` 函数，添加一行新代码：\n\n```\ncreate: function(){\n    this.placeTiles();\n\
    }\n```\n\n在这里，你会看到我们也可以定义自己的自定义函数。\n\n实际上，你普通的编程日常将充满创建自定义函数的过程。\n"
