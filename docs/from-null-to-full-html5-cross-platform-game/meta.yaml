    \ game by calling `TitleScreen` state after clearing out the arrays, I want you\
    \ to focus on this line:\n\n```\ngame.input.onDown.add(this.restartGame, this);\n\
    ```\n\nWherever you click or touch the screen, `restartGame` method will be called.\n\
    \n> `input.onDown(callback, callbackContext)` is fired each time a pointer is\
