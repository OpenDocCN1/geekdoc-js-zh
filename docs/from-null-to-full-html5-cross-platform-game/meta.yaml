- md: "Now they look less like “my first Photoshop graphics” and more like alien runes.\
    \ During the making of your games, you will often find yourself changing the graphics\
    \ again and again, especially when you are turning a prototype into a playable\
    \ game, so don't be surprised I made it on the book, it's part of the game creation\
    \ process.\n\n## Preloading sounds\n\nWhen the player chooses to play with sounds,\
    \ it means the game should feature sounds. Crack Alien Code will have three sounds:\
    \ one to be played each time a tile is selected, one to be played when the player\
    \ makes a successful match and one to be played when the player makes an unsuccessful\
    \ match. I added in my game folder three new sounds, in two different formats:\
    \ **mp3** and **ogg** and now the folder looks like this:\n\n![](img/94d5f4f278808ce315dcc02186d68404_48_0.png)\n\
    \nWhy did I use two sound formats? It's a compatibility matter: not all browsers\
    \ are capable to reproduce all kind of sound files. Using mp3 and ogg together\
    \ should grant the best device and browser coverage. Preloading sounds is not\
    \ different than preloading images, as you can see in preload function in playGame\
    \ object:\n\n```\npreload: function(){\n    game.load.spritesheet(\"tiles\", \"\
    tiles.png\", tileSize, tileSize);\n    game.load.audio(\"select\", [\"select.mp3\"\
    , \"select.ogg\"]);\n    game.load.audio(\"right\", [\"right.mp3\", \"right.ogg\"\
    ]);\n    game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"]);\n}\n```\n\
    \nPhaser will choose which sound format to play according to browser capabilities.\n\
    \n> load.audio(key, audioFiles) handles sound preloading. The first argument is\
    \ the key, the second is an array of files to be loaded, in different formats.\n\
    \nWith sounds ready to be played, it's time to see how we can reproduce them.\n\
    \n## Playing sounds\n\nThe idea is to store all sounds in an array and then play\
    \ the right song according to what's going on in the game.\n\nWe are going a property\
    \ in playGame object called soundArray. It's defined as an empty array and will\
    \ be visible only inside playGame object. We declare it this way:\n\n```\nplayGame.prototype\
    \ = {\n    soundArray: [],\n    preload: function(){\n        game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n        game.load.audio(\"select\"\
    , [\"select.mp3\", \"select.ogg\"]);\n        game.load.audio(\"right\", [\"right.mp3\"\
    , \"right.ogg\"]);\n        game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"\
    ]);\n    },\n    ...\n}\n```\n\nIn the same playGame object, inside create method\
    \ once we called placeTiles and we add the audio if the player selected the option\
    \ to play with sound, that is if playSound is set to true.\n\nA small change to\
    \ create method:\n\n# From null to full HTML5 cross-platform game\n\n```\ncreate:\
    \ function(){\n    this.placeTiles();\n    if(playSound){\n        this.soundArray[0]\
    \ = game.add.audio(\"select\", 1);\n        this.soundArray[1] = game.add.audio(\"\
    right\", 1);\n        this.soundArray[2] = game.add.audio(\"wrong\", 1);\n   \
    \ }\n}\n```\n\nTo insert elements into an array we always used push method but\
    \ you can also declare items one by one assigning a value for a given index, like\
    \ I did in these latest lines of code.\n\n> add.audio(key, volume) adds a new\
    \ audio file to the sound manager. key is the name we gave to the sound, while\
    \ volume is playing volume. It ranges from 0 to 1.\n\nNow that the sounds are\
    \ preloaded and ready to be played, it's time to insert our first sound into showTile\
    \ method. This will be played when a tile is shown:\n\n```\nshowTile: function(target){\n\
    \    if(selectedArray.length < 2 && selectedArray.indexOf(target) == -1){\n  \
    \      if(playSound){\n            this.soundArray[0].play();\n        }\n   \
    \     target.frame = target.value;\n        selectedArray.push(target);\n    \
    \    if(selectedArray.length == 2){\n            game.time.events.add(Phaser.Timer.SECOND,\
    \ this.checkTiles, this);\n        }\n    }\n}\n```\n\nObviously before playing\
    \ any sound effect we must check for playSound to be true.\n\n> play() method\
    \ plays a sound.\n\nPlay the game, pick tiles and you should hear the sound effect.\
    \ In the same way it's easy to add sounds to checkTiles method, one to be played\
    \ when the player made a successful match and one to be played when there wasn't\
    \ any match.\n\n# From null to full HTML5 cross-platform game\n\n```\ncheckTiles:\
    \ function(){\n    if(selectedArray[0].value == selectedArray[1].value){\n   \
    \     if(playSound){\n            this.soundArray[1].play();\n        }\n    \
    \    selectedArray[0].destroy();\n        selectedArray[1].destroy();\n    }\n\
    \    else{\n        if(playSound){\n            this.soundArray[2].play();\n \
    \       }\n        selectedArray[0].frame = 10;\n        selectedArray[1].frame\
    \ = 10;\n    }\n    selectedArray.length = 0;\n}\n```\n\nSounds gave the game\
    \ a deeper experience, but there's still a missing key feature, which is the one\
    \ we all play for: the score.\n\n## Showing the score\n\nTo keep track of the\
    \ score, I am sure you find it obvious now, we need to store it in a variable.\
    \ Let's create a variable called `score`.\n\n```\nvar tileSize = 80;\nvar numRows\
    \ = 4;\nvar numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar selectedArray\
    \ = [];\nvar playSound;\nvar score;\nvar game = new Phaser.Game(500, 500);\n```\n\
    \nInside `playGame` object, we will need another variable to visually display\
    \ the score on the stage. How about another text? That's why I am going to create\
    \ a `playGame` property called `scoreText`, which is declared as `null`.\n\n>\
    \ In JavaScript `null` means \"nothing\", or an empty value.\n\nHaving a `null`\
    \ variable does not mean we can't assign it a value when we need.\n\n```\nplayGame.prototype\
    \ = {\n    scoreText: null,\n    soundArray: [],\n    preload: function(){\n \
    \       ...\n    }\n    ...\n}\n```\n\nOnce `create` method is executed, it means\
    \ a new game is started so we set `score` to zero. Also, you should be able to\
    \ see what the remaining lines do:\n\n```\ncreate: function(){\n    score = 0;\n\
    \    this.placeTiles();\n    if(playSound){\n        this.soundArray[0] = game.add.audio(\"\
    select\", 1);\n        this.soundArray[1] = game.add.audio(\"right\", 1);\n  \
    \      this.soundArray[2] = game.add.audio(\"wrong\", 1);\n    }\n    var style\
    \ = {\n        font: \"32px Monospace\",\n        fill: \"#00ff00\",\n       \
    \ align: \"center\"\n    }\n    this.scoreText = game.add.text(5, 5, \"Score:\
    \ \" + score, style);\n}\n```\n\nWe are adding a new text using `scoreText` property\
    \ we defined before. You should already know how to add and style to the text.\
    \ First, we defined a text style, then we created the text itself applying such\
    \ style. Also notice how we can write anything we want inside the text content.\
    \ When we created the title screen we only wrote a string \"Crack Alien Code\"\
    \ but now we are also writing the content of `score` variable. Moreover, text\
    \ strings are not static but we can change their content on the fly `text` property\
    \ of a text will change the string displayed. Do you want to show the score in\
    \ real time? Look at `checkTiles` function:\n\n```\ncheckTiles: function(){\n\
    \    if(selectedArray[0].value == selectedArray[1].value){\n        if(playSound){\n\
    \            this.soundArray[1].play();\n        }\n        score ++;\n      \
    \  this.scoreText.text = \"Score: \" + score;\n        selectedArray[0].destroy();\n\
    \        selectedArray[1].destroy();\n    }\n    else{\n        if(playSound){\n\
    \            this.soundArray[2].play();\n        }\n        selectedArray[0].frame\
    \ = 10;\n        selectedArray[1].frame = 10;\n    }\n    selectedArray.length\
    \ = 0;\n}\n```\n\nOnce the player makes a successful match, `score` is incremented\
    \ and then we can update a text simply by setting its `text` property. Run the\
    \ game and see how your score increments at each successful match.\n\n![](img/94d5f4f278808ce315dcc02186d68404_53_0.png)\n\
    \nShowing the score on the screen does not complete the game. There is more that\
    \ we can do.\n\n## Increasing difficulty by adding a timer\n\nWhat if you had\
    \ a time limit to complete the game? Let's increase the difficulty by giving you\
    \ only a minute to solve the game.\n\n`timeLeft` variable will keep track of the\
    \ remaining time we have.\n\n```\nvar tileSize = 80;\nvar numRows = 4;\nvar numCols\
    \ = 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar selectedArray = [];\n\
    var playSound;\nvar score;\nvar timeLeft;\nvar game = new Phaser.Game(500, 500);\n\
    ```\n\nNow we have to prevent the player from cheating. If you remove the focus\
    \ from the page, the game will pause. This means timer won't decrease, and this\
    \ is cheating. We are going to prevent this by setting `stage.disableVisibilityChange`\
    \ property to `true`. Let's add it in the title screen.\n\n```\ncreate: function(){\n\
    \    game.stage.disableVisibilityChange = true;\n    var style = {\n        font:\
    \ \"48px Monospace\",\n        fill: \"#00ff00\",\n        align: \"center\"\n\
    \    };\n    var soundButton = game.add.button(game.width / 2 - 100 , game.height\
    \ / 2 + 100, \"soundicons\", this.startGame, this);\n    soundButton.anchor.set(0.5);\n\
    \    soundButton = game.add.button(game.width / 2 + 100 , game.height / 2 + 100,\
    \ \"soundicons\", this.startGame, this);\n    soundButton.frame = 1;\n    soundButton.anchor.set(0.5);\n\
    \    var text = game.add.text(game.width / 2, game.height / 2 - 100, \"Crack Alien\
    \ Code\", style);\n    text.anchor.set(0.5);\n}\n```\n\nNow in the same way we\
    \ added `scoreText` variable to have the score text"
  mdcn: "\n现在它们看起来不再像“我的第一幅 Photoshop 作品”，而更像是外星人符文。在制作游戏的过程中，你会发现自己需要反复修改图形，尤其是在将原型转变为可玩游戏时，所以我在书中这么做并不奇怪，这是游戏创作过程的一部分。\n\
    \n## 预加载音效\n\n当玩家选择开启音效时，意味着游戏应该包含音效。Crack Alien Code 将包含三种音效：每次选择方块时播放一种，玩家成功匹配时播放一种，以及玩家匹配失败时播放一种。我在游戏文件夹中添加了三种新音效，采用两种不同的格式：**mp3**\
    \ 和 **ogg**，现在文件夹看起来是这样的：\n\n![](img/94d5f4f278808ce315dcc02186d68404_48_0.png)\n\
    \n为什么我要使用两种音频格式？这是出于兼容性考虑：并非所有浏览器都能播放所有类型的音频文件。同时使用 mp3 和 ogg 应该能提供最佳的设备和浏览器覆盖率。预加载音效与预加载图片没有什么不同，正如你在\
    \ playGame 对象的 preload 函数中所见：\n\n```\npreload: function(){\n    game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n    game.load.audio(\"select\",\
    \ [\"select.mp3\", \"select.ogg\"]);\n    game.load.audio(\"right\", [\"right.mp3\"\
    , \"right.ogg\"]);\n    game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"\
    ]);\n}\n```\n\nPhaser 会根据浏览器的支持能力选择播放哪种音频格式。\n\n> load.audio(key, audioFiles)\
    \ 用于处理音效预加载。第一个参数是键名，第二个参数是要加载的文件数组，包含不同格式的文件。\n\n音效已经准备好可以被播放了，现在来看看我们怎样才能播放它们。\n\
    \n## 播放音效\n\n思路是将所有音效存储在数组中，然后根据游戏中的情况播放对应的声音。\n\n我们在 playGame 对象中添加一个名为 soundArray\
    \ 的属性。它被定义为空数组，并且只在 playGame 对象内部可见。我们这样声明：\n\n```\nplayGame.prototype = {\n \
    \   soundArray: [],\n    preload: function(){\n        game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n        game.load.audio(\"select\"\
    , [\"select.mp3\", \"select.ogg\"]);\n        game.load.audio(\"right\", [\"right.mp3\"\
    , \"right.ogg\"]);\n        game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"\
    ]);\n    },\n    ...\n}\n```\n\n在同一个 playGame 对象中，在 create 方法内部，一旦我们调用了 placeTiles，并且如果玩家选择了开启音效的选项（即\
    \ playSound 设置为 true），我们就添加音频。\n\n对 create 方法做一个小的改动：\n\n# From null to full HTML5\
    \ cross-platform game\n\n```\ncreate: function(){\n    this.placeTiles();\n  \
    \  if(playSound){\n        this.soundArray[0] = game.add.audio(\"select\", 1);\n\
    \        this.soundArray[1] = game.add.audio(\"right\", 1);\n        this.soundArray[2]\
    \ = game.add.audio(\"wrong\", 1);\n    }\n}\n```\n\n向数组中插入元素时我们之前一直使用 push 方法，但你也可以通过为给定索引赋值的方式逐个声明元素，就像我在这些最新几行代码中所做的那样。\n\
    \n> add.audio(key, volume) 向声音管理器添加一个新的音频文件。key 是我们给音效起的名字，而 volume 是播放音量。它的取值范围是\
    \ 0 到 1。\n\n现在音效已经预加载完毕并准备好播放了，是时候在 showTile 方法中插入我们的第一个音效了。这将在方块被展示时播放：\n\n```\n\
    showTile: function(target){\n    if(selectedArray.length < 2 && selectedArray.indexOf(target)\
