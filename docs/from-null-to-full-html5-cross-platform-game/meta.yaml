  md: "This time we aren't dealing with a timer which only runs once, but with a loop.\n\
    \n> time.events.loop(delay, callback, callbackContext) adds a looped event that\
    \ will repeat forever or until it's stopped. It will call callback function in\
    \ the callbackContext context.\n\nLet's have a look at the callback function,\
    \ called decreaseTime:\n\n```\ndecreaseTime: function(){\n    timeLeft --;\n \
    \   this.timeText.text = \"Time left: \" + timeLeft;\n}\n```\n\nIt decreases the\
    \ timer, then updates the text showing the time left. Run the game:\n\n![](img/94d5f4f278808ce315dcc02186d68404_56_0.png)"
  merge: -1
  pgno: 56
- img_proc: true
  md: "Having a timer is nice, but quite useless if once the time is over nothing\
    \ happens.\n\n# Showing Game Over screen when running out of time\n\nWhen the\
    \ player runs out of time, we need to stop the game and show a game over screen.\
    \ How can we make a game over screen?\n\nRight, with another state.\n\n```\ngame.state.add(\"\
    TitleScreen\", titleScreen);\ngame.state.add(\"PlayGame\", playGame);\ngame.state.add(\"\
    GameOver\", gameOver);\ngame.state.start(\"TitleScreen\");\n```\n\nOnce the state\
    \ has been added to the game, we will call it once the timer reaches zero. Look\
    \ at `decreaseTime` method:\n\n```\ndecreaseTime: function(){\n    timeLeft --;\n\
    \    this.timeText.text = \"Time left: \" + timeLeft;\n    if(timeLeft == 0){\n\
    \        game.state.start(\"GameOver\");\n    }\n}\n```\n\nAnd now it's just a\
    \ matter of building the new state, with the “Game Over” text, the score and the\
    \ message to tap to restart. Nothing new in the following code.\n\n```\nvar gameOver\
    \ = function(game){}\ngameOver.prototype = {\n    create: function(){\n      \
    \  var style = {\n            font: \"32px Monospace\",\n            fill: \"\
    #00ff00\",\n            align: \"center\"\n        }\n        var text = game.add.text(game.width\
    \ / 2, game.height / 2, \"Game Over\\n\\nYour score: \" + score + \"\\n\\nTap\
    \ to restart\", style);\n        text.anchor.set(0.5);\n    }\n}\n```\n\nPlay\
    \ the game, and after a minute you should see something like this:"
