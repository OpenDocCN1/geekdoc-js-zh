- img_proc: true
  md: "To reward you for successful matches, you will be awarded with two extra seconds\
    \ at each match.\n\nDoes it sound complicated?\n\nDidn't you realize yet there's\
    \ nothing complicated when you use Phaser?\n\nLet's create a new variable which\
    \ will inform us how many tiles are still placed on the board.\n\nWe'll call it\
    \ `tilesLeft`.\n\n```\nvar tileSize = 80;\nvar numRows = 4;\nvar numCols = 5;\n\
    var tileSpacing = 10;\nvar tilesArray = [];\nvar selectedArray = [];\nvar playSound;\n\
    var score;\nvar timeLeft;\nvar tilesLeft;\nvar game = new Phaser.Game(500, 500);\n\
    ```\n\nWhen the tiles are shown on the screen, `tilesLeft` is set to the entire\
    \ amount of tiles in the game, that is `numRows * numCols`.\n\n```\nplaceTiles:\
    \ function(){\n    tilesLeft = numRows * numCols;\n    ...\n}\n```\n\nThe remaining\
    \ code is all to be placed in `checkTiles` method.\n\nWhen the player makes a\
    \ successful match, we increase `timeLeft` by 2, actually adding two seconds to\
    \ the game, and update `timeText` text.\n\nAt the same time, we decrease the amount\
    \ of tiles left by two.\n\nOnce there aren't any tiles left on the table, we clear\
    \ the arrays and place another set of tiles calling `placeTiles` function one\
    \ more time. This will allow the player to continue to play."
