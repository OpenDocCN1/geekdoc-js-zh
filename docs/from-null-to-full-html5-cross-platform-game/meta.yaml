  md: '# From null to full HTML5 cross-platform game


    **called frame.**


    Why using a sprite sheet?


    Basically, every game is made by various graphical objects. In a space shooter
    you will find images representing spaceships, bullets and explosions, while in
    our Concentration game there will be different tiles. It does not matter the subject
    of the images. What we know is we are using all of them.


    Each image has a width and a height, which represent the amount of pixels building
    such image, and each pixel requires some memory to hold its color information.


    For each image – and more generally for each file – saved anywhere, there is a
    certain amount of memory that is wasted due to a series of features regarding
    the way the file system handles the files.


    Explaining this concept goes beyond the scope of this book, just keep in mind
    the more files you have, the bigger the amount of memory wasted. It''s not a problem
    when you are dealing with a dozen files, but in complex games with a lot of images,
    packing them into bigger images can save quite an amount of resources.


    Moreover simply storing images is not enough. We also have to place them on the
    screen.


    No matter the graphic engine your device will be using to display images, there
    will be a process which must know which image to paint, get the image from the
    place where it''s stored, then know which part of the image to paint – normally
    the entire image – and where to paint it, and finally place it on the screen.


    Once the first image has been placed on the screen, this process needs to be repeated
    for each other image, and the game stops until all images have been placed. Normally
    you don''t notice it because it happens – or at least it should happen – in 1/60
    second, but a lot of images to be placed on the screen of a slow device can slow
    down performance.


    Using a sprite sheet, you will have all – or most of – your graphic assets placed'
  merge: -1
