    And finally the game is complete. Anyway, what happens if you removed all tiles\
    \ before time runs out? You will find yourself looking at a black screen while\
    \ the timer ticks away without you being able to do anything.\n\nThat's why we\
    \ are going to add another feature. The last one, in this game.\n\n# Giving the\
    \ game a twist\n\nWe have to give the player something to do when all tiles have\
    \ been removed and there's still time to play.\n\nListen to this idea: if you\
    \ removed all tiles before the time runs out, another set of tiles is placed on\
    \ the screen, so you can increase your score by making more matches."
