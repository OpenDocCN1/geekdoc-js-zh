- img_proc: true
  md: "# Preventing the player to select more than two tiles each turn\n\nAs said,\
    \ not only we have to let the player select only two tiles, but we also have to\
    \ prevent the same tile from being selected twice. A selected tile can't be selected\
    \ again. Moreover, we must store selected tiles somewhere, as later in the development\
    \ of the game we must check if tile symbols match.\n\nFirst things first, let's\
    \ create a new variable, an array which will store selected tiles.\n\nWe will\
    \ call it `selectedArray`, and it will start as an empty array:\n\n```\nvar tileSize\
    \ = 80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray\
    \ = [];\nvar selectedArray = [];\nvar game = new Phaser.Game(500, 500);\n```\n\
    \nNow, we said `selectedArray` will contain selected tiles, so it means we have\
    \ to add tiles in it once they are selected by the player.\n\nBut according to\
    \ game rules, before inserting a new tile in the array we have to check if the\
    \ player hasn't already selected two tiles and the currently selected tile hasn't\
    \ been already selected.\n\nThis may sound complicated, but can be achieved in\
    \ only two lines of code added to `showTile` function:\n\n```\nshowTile: function(target){\n\
    \    if(selectedArray.length < 2 && selectedArray.indexOf(target) == -1){\n  \
    \      target.frame = target.value;\n        selectedArray.push(target);\n   \
    \ }\n}\n```\n\nRun the game, and you'll see you won't be able to select more than\
    \ two different tiles."
  merge: -1
  pgno: 34
- img_proc: true
  md: "From null to full HTML5 cross-platform game\n\nWhat changed in the script?\
    \ First, we added something you are already familiar with:\n\n```\nselectedArray.push(target);\n\
    ```\n\nYou should remember **push** method adds a new item to the end of an array,\
    \ in this case `selectedArray`.\n\nThen, there's another line which introduces\
    \ some new concepts:\n\n```\nif(selectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1){\n    ...\n}\n```\n\nFirst, let me introduce you the `if` statement.\n\
    \nVery often when you write code, you want to perform different actions for different\
    \ decisions, or perform some actions only in some cases.\n\nYou can use conditional\
    \ statements in your code to do this, and `if` is the most common statement.\n\
    \n`if` statement executes a block of JavaScript code if a given condition is true.\n\
    \nWe can write the average if statement in this form:\n\n```\nif(condition){\n\
    \    // block of code to be executed if the condition is true\n}\n```\n\nSo now\
    \ we know how if statement works.\n\nNow let's see the condition in detail:\n\n\
    ```\nselectedArray.length < 2 && selectedArray.indexOf(target) == -1\n```\n\n\
    We are checking the length of `selectedArray`. If it's less than two, this means\
    \ we still haven't selected two tiles."
  merge: -1
  pgno: 35
- img_proc: true
  md: '> > **length** property returns the number of elements in an array.


    We are also checking if the currently selected tile is already in `selectedArray`
    array, which means we already selected that tile.


    > > **indexOf** method returns the position of a given element in the array. If
    there is no occurrence, `indexOf` returns **-1**.


    In this case, we check for `indexOf` to be equal to **-1**, to be sure there''s
    no occurrence of the selected tile in `selectedArray` array.


    > > **==** operator means **equal to**.


    The whole `if` condition will be true only if both conditions are true.


    > > **&&** is the **and** logical operator used to connect two conditions


    Translated in everyday language, we wrote "if the selected array has less than
    two elements and there''s no occurrence in the array of the tile we just selected,
    then insert the tile in the array".


    A lot of new concepts in just a couple of lines, but now the player will follow
    the rules of the game, at least during the selection of tiles.


    Now there is another rule to develop, the most important one, because it''s the
    one which will reward player''s memory: if the player selects two tiles with the
    same value they will be removed from the stage.


    We will cover back the tiles otherwise.


    # ## Checking for successful matches and removing tiles or turning them back


    Once we have selected two tiles, then `selectedArray` has two elements, and we
    have to check for their values.


    We will remove the tiles if values match, or cover back them again if values do
    not match.


    This means some more lines added to `showTile` function:'
  merge: -1
