    Probably in 1970''s players would have loved your game, but today they won''t.


    Are we going to put the entire game in the trashcan?


    No, we can still make something interesting out of it, by just adding a couple
    of features and polish a bit the game.


    # Turning the prototype into a real game adding a title screen with sound/mute
    options


    The first thing we need to think about when turning the prototype into a real
    game, is the title screen, which means giving the game a name, create a visual
    look and feel that has something to do with the title, and a couple of nice sound/mute
    buttons to place in the title screen.


    Since we are about to create a cross platform game which will be able to run on
    phones and mobile devices everywhere, and since it''s a quick casual game, you
    can expect it to be played at the office or at school.


    That said, it''s very important to start with a muted title screen where the player
    can clearly choose whether to play with sounds or not.


    So we will first need to create a new variable called `playSound`. Here we will
    store the player decision.


    ```

