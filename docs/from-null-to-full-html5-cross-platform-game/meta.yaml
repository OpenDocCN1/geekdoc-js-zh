    \ function:\n\n```\nvar soundButton = game.add.button(game.width / 2 - 100 , game.height\
    \ / 2 + 100,\n\"soundicons\", this.startGame, this);\nsoundButton.anchor.set(0.5);\n\
    soundButton = game.add.button(game.width / 2 + 100 , game.height / 2 + 100,\n\"\
    soundicons\", this.startGame, this);\nsoundButton.frame = 1;\nsoundButton.anchor.set(0.5);\n\
    ```\n\nThis is the standard code used to create a button. Just have a look at\
    \ the callback function – `startGame` – and at a new concept called anchor point.\n\
    \nThe **anchor** sets the origin point of the texture. The default is `0,0` this\
    \ means the texture's origin is the top left. Setting than anchor to `0.5,0.5`\
    \ means the textures origin is centered. Setting the anchor to `1,1` would mean\
    \ the textures origin points will be the bottom right corner. Two equal values\
    \ can be written only once. `anchor.set(0.5,0.5)` can be written as `anchor.set(0.5)`.\n\
    \nIn this case with we want buttons to have their anchor points in its horizontal\
    \ and vertical center. Just remember the image should have an even with and height,\
