    \ == null ? 0 : localStorage.getItem(localStorageName);\ngame.state.start(\"TitleScreen\"\
    );\n```\n\nDoes it look strange?\n\nIt's a conditional operator, also called ternary\
    \ operator because it requires three operands.\n\n> **A conditional operator**,\
    \ written as `condition ? expr1 : expr2` will return the value of `expr1` if `condition`\
    \ is true, or the value of `expr2` if `condition` is false. Think about it as\
    \ a short `if` statement like `if (condition) then expr1 else expr2`.\n\nWriting\
    \ the conditional operator as an `if` statement, it will look like:\n\n```\nif(localStorage.getItem(localStorageName)\
    \ == null){\n    highScore = 0;\n}\nelse{\n    highScore = localStorage.getItem(localStorageName);\n\
    }\n```\n\n`getItem` method of `localStorage` retrieves `localStorageName` data.\
    \ If it's `null`, it means we never saved a high score.\n\n> `localStorage.getItem(keyName)`\
    \ returns `keyName`'s value.\n\nProbably it's the first time we launch the game\
    \ in this browser, or we never played until game over screen – where we will save\
    \ the score – or we just changed `localStorageName` name.\n\nIn this case, `highScore`\
