    # Preloading sounds


    When the player chooses to play with sounds, it means the game should feature
    sounds.

    Crack Alien Code will have three sounds: one to be played each time a tile is
    selected, one to be played when the player makes a successful match and one to
    be played when the player makes an unsuccessful match.

    I added in my game folder three new sounds, in two different formats: **mp3**
    and **ogg** and now the folder looks like this:


    ![](img/94d5f4f278808ce315dcc02186d68404_48_0.png)


    Why did I use two sound formats?

    It''s a compatibility matter: not all browsers are capable to reproduce all kind
    of sound files. Using mp3 and ogg together should grant the best device and browser
    coverage.

    Preloading sounds is not different than preloading images, as you can see in'
  merge: -1
  pgno: 48
- img_proc: true
  md: "preload function in playGame object:\n\n```\npreload: function(){\n    game.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n    game.load.audio(\"select\",\
    \ [\"select.mp3\", \"select.ogg\"]);\n    game.load.audio(\"right\", [\"right.mp3\"\
    , \"right.ogg\"]);\n    game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"\
    ]);\n}\n```\n\nPhaser will choose which sound format to play according to browser\
    \ capabilities.\n\n> load.audio(key, audioFiles) handles sound preloading. The\
    \ first argument is the key, the second is an array of files to be loaded, in\
    \ different formats.\n\nWith sounds ready to be played, it's time to see how we\
    \ can reproduce them.\n\n# Playing sounds\n\nThe idea is to store all sounds in\
    \ an array and then play the right song according to what's going on in the game.\n\
    \nWe are going a property in playGame object called soundArray.\n\nIt's defined\
    \ as an empty array and will be visible only inside playGame object.\n\nWe declare\
    \ it this way:\n\n```\nplayGame.prototype = {\n    soundArray: [],\n    preload:\
    \ function(){\n        game.load.spritesheet(\"tiles\", \"tiles.png\", tileSize,\
    \ tileSize);\n        game.load.audio(\"select\", [\"select.mp3\", \"select.ogg\"\
    ]);\n        game.load.audio(\"right\", [\"right.mp3\", \"right.ogg\"]);\n   \
    \     game.load.audio(\"wrong\", [\"wrong.mp3\", \"wrong.ogg\"]);\n    },\n  \
    \  ...\n}\n```\n\nIn the same playGame object, inside create method once we called\
    \ placeTiles and we add the audio if the player selected the option to play with\
    \ sound, that is if playSound is set to true.\n\nA small change to create method:"
