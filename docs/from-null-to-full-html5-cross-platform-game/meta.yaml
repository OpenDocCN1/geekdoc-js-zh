    \        selectedArray.length = 0;\n        game.state.start(\"TitleScreen\");\n\
    \    }\n}\n```\n\nApart from `restartGame` function which simply restarts the\
    \ game by calling `TitleScreen` state after clearing out the arrays, I want you\
