  - '[PAGE 5]


    # Can I build a game like GTA with Phaser?


    To tell you the truth, I don''t know. Anyway, you shouldn''t even think about
    it.


    The first rule in game programming is: **create a game you are able to complete**.
    And when I say "complete a game" I don''t mean seeing the congratulations screen
    in GTA, I mean coding a game from scratch until the end.


    According to this concept, if you are an one-man studio or a small indie studio,
    you should choose a genre of game you are able to code from the beginning until
    the end.


    The game we are going to build in this book is **Concentration**.


    Concentration, also known as Memory, is a card game in which all of the cards
    are laid face down on a surface and two cards are flipped face up over each turn.


    The object of the game is to remove all card by turning over pairs of matching
    cards.


    I am sure you played with something similar when you were a kid:


    ![](img/94d5f4f278808ce315dcc02186d68404_5_0.png)'
  - '[PAGE 6]


    And although it may seem a simple game – and actually it is – there is a lot to
    learn from the making of this game, and we''ll add a couple of extra features
    to make it some more interesting.


    # Choosing a text editor


    Let''s turn your computer into a web development workstation with no cost thanks
    to Phaser and some other **free software**.


    In order to start making games with Phaser, you''ll first need a software to write
    code. There is a lot of free offers. I personally use **PSPad** ([http://www.pspad.com/](http://www.pspad.com/))
    on my Windows computer and **TextWrangler** ([http://www.barebones.com/products/textwrangler/](http://www.barebones.com/products/textwrangler/))
    on my Mac. Another alternative is **Brackets** ([http://brackets.io/](http://brackets.io/))
    but you can use your favorite text editor, I''d only suggest you choose one capable
    to highlight JavaScript syntax.


    # Choosing a web server


    To test your Phaser games, and more in general to test most web applications,
    you will need to install a web server on your computer to override browsers security
    limits when running your project locally.


    I am using **WAMP** ([http://www.wampserver.com/](http://www.wampserver.com/))
    on my Windows machine, and **MAMP** ([https://www.mamp.info/](https://www.mamp.info/))
    on the Mac. Recently, MAMP also released a Windows version ([https://www.mamp.info/en/mamp_windows.html](https://www.mamp.info/en/mamp_windows.html)).


    Just like the text editors, both WAMP and MAMP are free to use as you won''t need
    the PRO version, which is also available for MAMP.


    If you prefer, if you have a FTP space you can test your projects directly online
    by uploading and calling them directly from the web. In this case, you won''t
    need to have a web server installed on your computer, but I highly recommend using
    WAMP or MAMP instead.


    Most FTP spaces requires a paid account, and you can only use them when you have
    an internet connection available.'
  - '[PAGE 7]


    From null to full HTML5 cross-platform game


    # REALLY choosing a web server, rather than closing the book


    I know at this time most of you may think "come on, it''s just JavaScript, what''s
    this server stuff, I quit!".


    This is the same thing I said when I first had to install and configure a web
    server just to run a JavaScript page.


    Let me explain why you should really choose a web server, rather than quit reading:
    browsers do not simply allow you to properly display web pages and HTML5 games.
    They also take care of your security. When you load a page locally in your browser,
    you won''t have problems until it''s just a static HTML web page.


    But when you launch more complex scripts which load and handle resources from
    your hard disk such as images, audio files and every other kind of data, to prevent
    malicious scripts to access to virtually any file on your computer, browsers have
    a series of security measures which stop files to be accessed and – unfortunately
    – this causes your games not to work.


    With a web server, browsers will know they are running in a small, safe environment
    where only some files – the ones you placed in a given project folder – can be
    accessed, and they will give your scripts green light to work properly.


    Believe me, it''s necessary and way easier than you may think.


    # Choosing a web browser


    Since your game will run on all modern browsers, you will also need a web browser
    to make your games run into and test them. I am using **Google Chrome** ([http://www.google.com/chrome/](http://www.google.com/chrome/))
    but you are free to use the one you prefer as long as it supports HTML5 `canvas`
    element. Having the latest version of your web browser installed on your computer
    should be enough.


    Refer to your browser support page to see if it supports `canvas` element.'
- md: "## Other software you may need\n\nGames basically are a collection of images\
    \ and sounds which are moved and played accordingly to player and scripting logic,\
    \ so during the creation of the game you will be asked to edit and create both\
    \ images and sounds.\n\n**Audacity** ([http://sourceforge.net/projects/audacity/](http://sourceforge.net/projects/audacity/))\
    \ is a great free software to work with sounds, while I would suggest **GIMP**\
    \ ([http://www.gimp.org/](http://www.gimp.org/)) to work with images, which is\
    \ also free.\n\nYou can also use the trial version of **Photoshop** ([http://www.photoshop.com/](http://www.photoshop.com/))\
    \ which allows you to use all features for free for a limited amount of time.\n\
    \n## Downloading Phaser\n\nFinally, it's time to download **Phaser** ([http://www.phaser.io/download](http://www.phaser.io/download))\
    \ and you are ready to go.\n\nPhaser comes in a zipped file with a lot of docs\
    \ and resources for a download file greater than 30 MB, anyway we will need just\
    \ one file, containing the framework itself.\n\n## The structure of your Phaser\
    \ project\n\nEvery HTML5 game is a web page with some magic in it, so that's what\
    \ we are going to do: the creation of a web page in a folder placed inside our\
    \ local web server.\n\nWithout forgetting to include Phaser framework!\n\nInside\
    \ `build` folder in the zipped package you just downloaded, you will find `phaser.js`\
    \ file. That's the only Phaser file we will need during the development of our\
    \ game. Create an `index.html` file which will be the web page you will call to\
    \ launch the game, and you'll have all you need to start writing the first lines\
    \ of code of your first Phaser game.\n\nYour project folder now should contain\
    \ two files.\n\nIf you followed all instructions, your folder structure will look\
    \ like this:\n\n![](img/94d5f4f278808ce315dcc02186d68404_9_0.png)\n\nNow let's\
    \ edit `index.html`:\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n       \
    \ <script type=\"text/javascript\" src=\"phaser.js\"></script>\n        <script\
    \ type=\"text/javascript\" src=\"game.js\"></script>\n    </head>\n    <body>\n\
    \    </body>\n</html>\n```\n\nAs you can see, it's just an empty web page with\
    \ only a call to two JavaScript files: `phaser.js` is the file we just downloaded,\
    \ and `game.js` will contain our game script.\n\nThis is the time to create a\
    \ new file in the same folder, call it `game.js` and write this code:\n\n```javascript\n\
    window.onload = function() {\n    var game = new Phaser.Game(500, 500);\n}\n```\n\
    \nCongratulations, you just created your first Phaser script.\n\nYou can use this\
    \ first script as a starting template file for your future projects too.\n\nLet's\
    \ see what these lines mean:\n\n`window.onload` is fired at the end of the document\
    \ loading process, in our case when all scripts called in `index.html` have finished\
    \ loading. This means everything is ready to be executed, so we can run the function.\n\
    \n> A JavaScript **function** is a block of code designed to perform a particular\
    \ task, executed when \"something\" invokes it. When you make something to execute\
    \ a function, we say you **call** the function.\n\nInside the function there's\
    \ only one line:\n\n```javascript\nvar game = new Phaser.Game(500, 500);\n```\n\
    \nThis is where everything begins.\n\n> A function can contain any number of lines,\
    \ and we use **curly brackets**, { and } to define the start and the end of a\
    \ function, or more in general, the start and the end of a block of code.\n\n\
    `Game` object will be the game itself. The two numbers inside the parentheses\
    \ represent respectively the width and the height of the game, in pixels. `Game`\
    \ object is assigned to a variable called `game`.\n\n> A JavaScript **variable**\
    \ is a container for storing data values. When you create a variable we say you\
    \ **declare** a variable, using the `var` keyword. You assign a value to a variable\
    \ with = operator.\n\nTranslating what we done in English, it means “once the\
    \ entire document has been loaded, create a new `Game` object with a width and\
    \ height of 500 pixels and assign it to a variable called `game`.”\n\n> A JavaScript\
    \ **object** is a particular kind of variable which can contain many values.\n\
    \nWell, this is our first Phaser game, so let's run it and see what happens.\n\
    \n## Running your game\n\nTo run the game on your local server, simply point your\
    \ browser to your game folder which in most cases will be http://localhost/phasergame/\
    \ and this is what you should get if running it on your Google Chrome browser:\n\
    \n![](img/94d5f4f278808ce315dcc02186d68404_11_0.png)\n\nThe black square on the\
    \ left is actually your 500x500 pixels game. By default, Phaser runs on a black\
    \ background. You can also see Console window showing which version of Phaser\
    \ you are using. This book is updated to **2.4.4**\n\n## Understanding Phaser\
    \ states\n\nAlthough managing Phaser states is an advanced feature, it's very\
    \ important to learn how to use states from the beginning of your Phaser programming\
    \ course, as they will allow you to write better code and have a better resource\
    \ management. You are going to understand this important feature while you are\
    \ making your first game.\n\nLet's think about a game, one of the games you are\
    \ playing these days. Although I don't know which games you are playing, I bet\
    \ they all have at least a title screen, a screen with the game itself, and a\
    \ game over screen.\n\nEach \"screen\" can be developed as a Phaser state, which\
    \ can be executed cleaning memory and resources before it starts, allowing us\
    \ to easily switch through game \"screens\". To create the first state, add these\
    \ lines to `game.js`:\n\n```javascript\nwindow.onload = function() {\n    var\
    \ game = new Phaser.Game(500, 500);\n    var playGame = function(game){}\n   \
    \ playGame.prototype = {\n        create: function(){\n            console.log(\"\
    That's my awesome game\");\n        }\n    }\n    game.state.add(\"PlayGame\"\
    , playGame);\n    game.state.start(\"PlayGame\");\n}\n```\n\nLaunch the game again,\
    \ and this is what you should see in the console:\n\n![](img/94d5f4f278808ce315dcc02186d68404_12_0.png)\n\
    \nWhat did we do? Let's have a look at the code, line by line:\n\n```javascript\n\
    var playGame = function(game){}\n```\n\nHere we assign a function to a variable\
    \ called `playGame`. We also pass `game` variable to the function.\n\n> A variable\
    \ passed as parameter inside a function is called **argument**. Arguments are\
    \ passed to a function by placing them between the parentheses. Functions can\
    \ have any number of arguments, separated by commas.\n\n```javascript\nplayGame.prototype\
    \ = {\n    ...\n}\n```\n\nWe are about to define the prototype of the previously\
    \ declared `playGame` variable.\n\n> Every JavaScript object has a **prototype**.\
    \ The prototype itself is also an object, and all JavaScript objects inherit their\
    \ properties and methods from their prototype.\n\nThen we have another function:\n\
    \n```javascript\ncreate: function(){\n    console.log(\"That's my awesome game\"\
    );\n}\n```\n\nInside `playGame` object we have a function called `create`. This\
    \ is a reserved name used by Phaser to know which function to execute once the\
    \ state has been called.\n\n> A function inside an object is called **method**.\
    \ For the same reason, when we refer to an object method, we mean a function declared\
    \ inside the object itself.\n\nInside the function we just output something to\
    \ browser console.\n\n> `console.log(text)` will output the content of `text`\
    \ in your browser console. Not all browsers support `console.log`, but Google\
    \ Chrome does.\n\nFinally we can talk about the main topic of this section, Phaser\
    \ states:\n\n```javascript\ngame.state.add(\"PlayGame\", playGame);\n```\n\nHere\
    \ is how we add a state to our game. The first parameter – from now on argument\
    \ as said before – is the name we give to the state, and the second is the function\
    \ called once the state is started.\n\n> `state.add(key, state)` adds a new state.\
    \ You must give each state a unique name in `key` argument by which you'll identify\
    \ it. `state` is usually a JavaScript object or a function.\n\nIn other words,\
    \ we bind `playGame` function to a state called `PlayGame`.\n\n```javascript\n\
    game.state.start(\"PlayGame\");\n```\n\nAnd finally this is how a state is started.\n\
    \n> `state.start(key)` starts the state previously named with `key`.\n\nAt this\
    \ time, `PlayGame` state is started, calling `playGame` function which will consequently\
    \ call `playGame.create` function.\n\n## Creating tile graphics using a sprite\
    \ sheet\n\nWe are going to create a board with 4 rows and 5 columns, for a total\
    \ of 20 tiles on the stage.\n\nSince each tile has a symbol on it, and since each\
    \ symbol is placed twice on the board, we have to draw 20/2 = 10 images to represent\
    \ the 10 different tiles, and one image to represent the back of each tile, for\
    \ a grand total of 11 images.\n\nAt this time, we can save the 11 images in eleven\
    \ distinct files or group them all into a sprite sheet.\n\n> A **sprite sheet**\
    \ is a series of images combined into a larger image. Usually the images are frames\
    \ of an animation, thus a single image inside a sprite sheet is"
  mdcn: "\n## 你可能需要的其他软件\n\n游戏基本上就是图像和声音的集合，它们会根据玩家操作和脚本逻辑进行移动和播放，因此在创建游戏的过程中，你需要编辑和创建图像和声音。\n\
    \n**Audacity** ([http://sourceforge.net/projects/audacity/](http://sourceforge.net/projects/audacity/))\
    \ 是一款非常棒的免费音频处理软件，而我建议使用 **GIMP** ([http://www.gimp.org/](http://www.gimp.org/))\
    \ 来处理图像，它也是免费的。\n\n你也可以使用 **Photoshop** ([http://www.photoshop.com/](http://www.photoshop.com/))\
    \ 的试用版，它允许你在限定时间内免费使用所有功能。\n\n## 下载 Phaser\n\n终于，是时候下载 **Phaser** ([http://www.phaser.io/download](http://www.phaser.io/download))\
    \ 了，下载完成后你就可以开始使用了。\n\nPhaser 的压缩包中包含大量文档和资源，文件大小超过 30 MB，但我们只需要其中一个文件，即框架本身。\n\
    \n## Phaser 项目的结构\n\n每个 HTML5 游戏都是一个带有魔法的网页，所以我们要做的就是：在本地服务器中创建一个文件夹，并在其中创建一个网页。\n\
    \n别忘了引入 Phaser 框架！\n\n在你刚刚下载的压缩包的 `build` 文件夹中，你会找到 `phaser.js` 文件。这是我们开发游戏时唯一需要的\
    \ Phaser 文件。创建一个 `index.html` 文件，这是你用来启动游戏的网页，这样你就拥有了开始编写第一个 Phaser 游戏代码所需的一切。\n\
    \n你的项目文件夹现在应该包含两个文件。\n\n如果你按照所有说明操作，你的文件夹结构将如下所示：\n\n![](img/94d5f4f278808ce315dcc02186d68404_9_0.png)\n\
    \n现在让我们编辑 `index.html`：\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n    \
    \    <script type=\"text/javascript\" src=\"phaser.js\"></script>\n        <script\
    \ type=\"text/javascript\" src=\"game.js\"></script>\n    </head>\n    <body>\n\
    \    </body>\n</html>\n```\n\n如你所见，这只是一个空网页，只调用了两个 JavaScript 文件：`phaser.js` 是我们刚刚下载的文件，`game.js`\
    \ 将包含我们的游戏脚本。\n\n现在是在同一个文件夹中创建一个新文件的时候了，将其命名为 `game.js` 并编写以下代码：\n\n```javascript\n\
    window.onload = function() {\n    var game = new Phaser.Game(500, 500);\n}\n```\n\
    \n恭喜你，你刚刚创建了你的第一个 Phaser 脚本。\n\n你也可以将这个脚本作为未来项目的起始模板文件。\n\n让我们看看这些代码的含义：\n\n`window.onload`\
    \ 在文档加载过程结束时触发，在我们的情况下，当 `index.html` 中调用的所有脚本都加载完成时触发。这意味着一切都已准备好执行，因此我们可以运行该函数。\n\
    \n> JavaScript **函数**（function）是为执行特定任务而设计的代码块，当\"某物\"调用它时执行。当你让某物执行一个函数时，我们说你**调用**（call）了该函数。\n\
    \n函数内部只有一行：\n\n```javascript\nvar game = new Phaser.Game(500, 500);\n```\n\n一切从这里开始。\n\
    \n> 一个函数可以包含任意数量的代码行，我们使用**花括号** { 和 } 来定义函数的开始和结束，或者更一般地说，定义代码块的开始和结束。\n\n`Game`\
    \ 对象就是游戏本身。括号中的两个数字分别代表游戏的宽度和高度，单位是像素。`Game` 对象被赋值给一个名为 `game` 的变量。\n\n> JavaScript\
    \ **变量**（variable）是用来存储数据值的容器。当你创建一个变量时，我们说你**声明**（declare）了一个变量，使用 `var` 关键字。你用\
    \ = 运算符给变量赋值。\n\n用英文翻译我们所做的，意思是\"一旦整个文档加载完成，创建一个宽度和高度均为 500 像素的新 `Game` 对象，并将其赋值给名为\
    \ `game` 的变量。\"\n\n> JavaScript **对象**（object）是一种特殊的变量，可以包含多个值。\n\n好了，这是我们的第一个\
    \ Phaser 游戏，让我们运行它看看会发生什么。\n\n## 运行你的游戏\n\n要在本地服务器上运行游戏，只需将浏览器指向你的游戏文件夹，在大多数情况下将是\
    \ http://localhost/phasergame/，如果你在 Google Chrome 浏览器中运行，你应该会看到：\n\n![](img/94d5f4f278808ce315dcc02186d68404_11_0.png)\n\
    \n左边的黑色方块实际上就是你的 500x500 像素的游戏。默认情况下，Phaser 在黑色背景上运行。你还可以在控制台窗口中看到正在使用的 Phaser\
    \ 版本。本书更新到 **2.4.4** 版本。\n\n## 理解 Phaser 状态\n\n虽然管理 Phaser 状态是一项高级功能，但从 Phaser\
    \ 编程课程一开始就学习如何使用状态非常重要，因为它们将帮助你编写更好的代码并实现更好的资源管理。你将在制作第一个游戏的过程中理解这个重要的功能。\n\n\
    让我们想想一款游戏，一款你最近在玩的游戏。虽然我不知道你在玩什么游戏，但我敢打赌它们至少都有一个标题画面、一个游戏本身画面和一个游戏结束画面。\n\n每个\"\
    画面\"都可以作为一个 Phaser 状态来开发，它可以在开始前清理内存和资源，让我们能够轻松地在游戏\"画面\"之间切换。要创建第一个状态，请将以下代码添加到\
    \ `game.js` 中：\n\n```javascript\nwindow.onload = function() {\n    var game =\
    \ new Phaser.Game(500, 500);\n    var playGame = function(game){}\n    playGame.prototype\
    \ = {\n        create: function(){\n            console.log(\"That's my awesome\
    \ game\");\n        }\n    }\n    game.state.add(\"PlayGame\", playGame);\n  \
    \  game.state.start(\"PlayGame\");\n}\n```\n\n再次启动游戏，这是你在控制台中应该看到的：\n\n![](img/94d5f4f278808ce315dcc02186d68404_12_0.png)\n\
    \n我们做了什么？让我们逐行查看代码：\n\n```javascript\nvar playGame = function(game){}\n```\n\n\
    这里我们将一个函数赋值给名为 `playGame` 的变量。我们还将 `game` 变量传递给该函数。\n\n> 作为参数在函数内部传递的变量称为**参数**（argument）。参数通过放在括号之间传递给函数。函数可以有任意数量的参数，用逗号分隔。\n\
    \n```javascript\nplayGame.prototype = {\n    ...\n}\n```\n\n我们即将定义前面声明的 `playGame`\
    \ 变量的原型。\n\n> 每个 JavaScript 对象都有一个**原型**（prototype）。原型本身也是一个对象，所有 JavaScript 对象都从其原型继承属性和方法。\n\
    \n然后我们有另一个函数：\n\n```javascript\ncreate: function(){\n    console.log(\"That's\
    \ my awesome game\");\n}\n```\n\n在 `playGame` 对象中，我们有一个名为 `create` 的函数。这是 Phaser\
    \ 使用的保留名称，用于知道状态被调用后要执行哪个函数。\n\n> 对象内的函数称为**方法**（method）。出于同样的原因，当我们提到对象方法时，我们指的是在对象本身内部声明的函数。\n\
    \n在函数内部，我们只是向浏览器控制台输出一些内容。\n\n> `console.log(text)` 将在浏览器控制台中输出 `text` 的内容。并非所有浏览器都支持\
    \ `console.log`，但 Google Chrome 支持。\n\n最后我们可以讨论本节的主题，Phaser 状态：\n\n```javascript\n\
    game.state.add(\"PlayGame\", playGame);\n```\n\n这就是我们向游戏中添加状态的方式。第一个参数——从现在开始如前所述称为参数——是我们给状态命名的名称，第二个是状态启动时调用的函数。\n\
    \n> `state.add(key, state)` 添加一个新状态。你必须在 `key` 参数中为每个状态指定一个唯一的名称来标识它。`state` 通常是一个\
    \ JavaScript 对象或函数。\n\n换句话说，我们将 `playGame` 函数绑定到一个名为 `PlayGame` 的状态。\n\n```javascript\n\
    game.state.start(\"PlayGame\");\n```\n\n最后，这就是启动状态的方式。\n\n> `state.start(key)`\
    \ 启动之前以 `key` 命名的状态。\n\n此时，`PlayGame` 状态被启动，调用 `playGame` 函数，进而调用 `playGame.create`\
    \ 函数。\n\n## 使用精灵图创建瓦片图形\n\n我们将创建一个 4 行 5 列的棋盘，总共 20 个瓦片在舞台上。\n\n由于每个瓦片上都有一个符号，而且每个符号在棋盘上出现两次，我们需要绘制\
    \ 20/2 = 10 张图像来表示 10 种不同的瓦片，再用一张图像表示每个瓦片的背面，总共 11 张图像。\n\n此时，我们可以将这 11 张图像保存在十一个独立的文件中，或者将它们全部组合成一个精灵图。\n\
    \n> **精灵图**（sprite sheet）是将一系列图像组合成的一个较大图像。通常这些图像是一个动画的帧，因此精灵图中的单个图像\n"
