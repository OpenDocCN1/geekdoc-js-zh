    GameOver\", gameOver);\ngame.state.start(\"TitleScreen\");\n```\n\nOnce the state\
    \ has been added to the game, we will call it once the timer reaches zero. Look\
    \ at `decreaseTime` method:\n\n```javascript\ndecreaseTime: function(){\n    timeLeft\
    \ --;\n    this.timeText.text = \"Time left: \" + timeLeft;\n    if(timeLeft ==\
