  - "[PAGE 34]\n\n# Preventing the player to select more than two tiles each turn\n\
    \nAs said, not only we have to let the player select only two tiles, but we also\
    \ have to prevent the same tile from being selected twice. A selected tile can't\
    \ be selected again. Moreover, we must store selected tiles somewhere, as later\
    \ in the development of the game we must check if tile symbols match.\n\nFirst\
    \ things first, let's create a new variable, an array which will store selected\
    \ tiles.\n\nWe will call it `selectedArray`, and it will start as an empty array:\n\
    \n```\nvar tileSize = 80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing\
    \ = 10;\nvar tilesArray = [];\nvar selectedArray = [];\nvar game = new Phaser.Game(500,\
    \ 500);\n```\n\nNow, we said `selectedArray` will contain selected tiles, so it\
    \ means we have to add tiles in it once they are selected by the player.\n\nBut\
    \ according to game rules, before inserting a new tile in the array we have to\
    \ check if the player hasn't already selected two tiles and the currently selected\
    \ tile hasn't been already selected.\n\nThis may sound complicated, but can be\
    \ achieved in only two lines of code added to `showTile` function:\n\n```\nshowTile:\
    \ function(target){\n    if(selectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1){\n        target.frame = target.value;\n        selectedArray.push(target);\n\
    \    }\n}\n```\n\nRun the game, and you'll see you won't be able to select more\
    \ than two different tiles."
- md: "## Checking for successful matches and removing tiles or turning them back\n\
    \nOnce we have selected two tiles, then `selectedArray` has two elements, and\
    \ we have to check for their values.\n\nWe will remove the tiles if values match,\
    \ or cover back them again if values do not match.\n\nThis means some more lines\
    \ added to `showTile` function:\n\n```\nshowTile: function(target){\n    if(selectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1){\n        target.frame = target.value;\n\
    \        selectedArray.push(target);\n    }\n    if(selectedArray.length == 2){\n\
    \        if(selectedArray[0].value == selectedArray[1].value){\n            selectedArray[0].destroy();\n\
    \            selectedArray[1].destroy();\n        }\n        else{\n         \
    \   selectedArray[0].frame = 10;\n            selectedArray[1].frame = 10;\n \
    \       }\n        selectedArray.length = 0;\n    }\n}\n```\n\nLet's see the new\
    \ code in detail:\n\n```\nif(selectedArray.length == 2){\n    ...\n}\n```\n\n\
    This is how we check for selectedArray to have two elements, so it's time to check\
    \ for tiles to have the same value:\n\n```\nif(selectedArray[0].value == selectedArray[1].value){\n\
    \    ...\n}\n```\n\nWe access `value` custom property of the first and the second\
    \ `selectedArray` elements and check for them to be equal.\n\nIf they are equal,\
    \ it's time to remove the tiles from the stage.\n\n> `destroy` method permanently\
    \ destroys the button, destroys the input event and animation handlers if present\
    \ and nulls its reference to game, freeing it up for garbage collection.\n\nIt's\
    \ the best way to remove the button and never think about it again, so let's destroy\
    \ both buttons.\n\n```\nselectedArray[0].destroy();\nselectedArray[1].destroy();\n\
    ```\n\nAnd now we are done when the player selected tiles with the same symbols.\n\
    \nWhat if tiles have different symbols?\n\nWe have to use an extension to `if`\
    \ statement called `else`.\n\n> Use the **else** statement to specify a block\
    \ of code to be executed if the condition in the `if` statement is false.\n\n\
    It works this way:\n\n```\nif(condition){\n    // block of code to be executed\
    \ if the condition is true\n}\nelse{\n    // block of code to be executed if the\
    \ condition is false\n}\n```\n\nSo when the condition “selected tiles have the\
    \ same value” is false, this is what happens:\n\n```\nelse{\n    selectedArray[0].frame\
    \ = 10;\n    selectedArray[1].frame = 10;\n}\n```\n\nWe simply change `frame`\
    \ properties of both tiles to turn them back again.\nFinally, no matter whether\
    \ the tiles have been removed or covered back, we need to empty `selectedArray`\
    \ array to let the player select a new couple of tiles.\nTo empty an array, we\
    \ set its length to zero:\n\n```\nselectedArray.length = 0;\n```\n\nIf you browse\
    \ the web, you will find another way to empty arrays, for example by setting them\
    \ back to empty array definition assigning it to `[]`.\n\nI personally prefer\
    \ setting array length to zero in JavaScript, and an explanation for this reason\
    \ is beyond the scope of this project.\n\nYou are free to choose the way you prefer\
    \ to empty an array, just make sure `selectedArray` is now empty or the player\
    \ won't be able to select any more tile.\n\nTime to run the game, and try to make\
    \ both matching and non matching selections.\n\nNow matching tiles will be removed\
    \ from the stage, while non-matching tiles will be covered back.\n\nEverything\
    \ works fine, it's just you aren't able to see the second tile you select, are\
    \ you?\n\nThis happens because as soon as you select the second tile, we perform\
    \ the check for matching tiles and remove/cover selected tiles so fast you can't\
    \ even see what happened.\n\nThis is obviously a bad game design practice, so\
    \ we will wait a second with the selected tile before removing/covering them.\n\
    \n## Using timers to schedule events\n\nPhaser allows us to create a variety of\
    \ time driven events, in a simple and intuitive way.\n\n> time.events.add(tick,\
    \ callback, callbackContext) adds a timer event which will execute callback function\
    \ in the callbackContext context after tick time has passed.\n\n`Phaser.Timer.SECOND`\
    \ is a Phaser reserved variable which means “one second”, `checkTiles` is the\
    \ name of the function we are going to call after a second we realized the player\
    \ uncovered two tiles.\n\nThe use of `this` should now clearly suggest you how\
    \ to declare `checkTiles` function.\n\n```\nshowTile: function(target){\n    if(selectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1){\n        target.frame = target.value;\n\
    \        selectedArray.push(target);\n        if(selectedArray.length == 2){\n\
    \            game.time.events.add(Phaser.Timer.SECOND, this.checkTiles, this);\n\
    \        }\n    }\n},\ncheckTiles: function(){\n    // function code goes here\n\
    }\n```\n\nWhat should we write in `checkTiles` function?\n\nExactly the same code\
    \ we used for checking tiles when there is a match and remove/cover them.\n\n\
    ```\ncheckTiles: function(){\n    if(selectedArray[0].value == selectedArray[1].value){\n\
    \        selectedArray[0].destroy();\n        selectedArray[1].destroy();\n  \
    \  }\n    else{\n        selectedArray[0].frame = 10;\n        selectedArray[1].frame\
    \ = 10;\n    }\n    selectedArray.length = 0;\n}\n```\n\nNow run the game, and\
    \ you will see the game waits a second with both tiles shown on the stage before\
    \ removing or covering back them.\n\nNow, the last – but not least – difference\
    \ between our game and a real Concentration game: our tiles are always placed\
    \ in the same, predictable, place.\nWe have to spice up a bit the game by shuffling\
    \ the tiles.\n\n## Shuffling the tiles\n\nThe basics behind shuffling the tiles\
    \ is to shuffle the array of tile values, that `tileArray` which will be used\
    \ to assign each tile its own value.\n\nThere are a lot of ways to shuffle an\
    \ array and they all have their roots on random number generation, which is a\
    \ branch with countless theories.\n\nWhile in a casino game with real money prizes\
    \ true randomness is really important, in a quick puzzle game this does not make\
    \ sense, as the basic random functions provide a great deal of randomness which\
    \ is good enough to have a completely different boards each time we play.\n\n\
    So we are going to change `placeTiles` function in the most basic way with just\
    \ randomly switching two `tilesArray` elements a given amount of times, and `numRows`\
    \ * `numCols` times is enough to have a completely shuffled board.\n\nChange `placeTiles`\
    \ function this way:\n\nFrom null to full HTML5 cross-platform game\n\nWhat changed\
    \ in the script? First, we added something you are already familiar with:\n\n\
    ```\nselectedArray.push(target);\n```\n\nYou should remember **push** method adds\
    \ a new item to the end of an array, in this case `selectedArray`.\n\nThen, there's\
    \ another line which introduces some new concepts:\n\n```\nif(selectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1){\n    ...\n}\n```\n\nFirst, let\
    \ me introduce you the `if` statement.\n\nVery often when you write code, you\
    \ want to perform different actions for different decisions, or perform some actions\
    \ only in some cases.\n\nYou can use conditional statements in your code to do\
    \ this, and `if` is the most common statement.\n\n`if` statement executes a block\
    \ of JavaScript code if a given condition is true.\n\nWe can write the average\
    \ if statement in this form:\n\n```\nif(condition){\n    // block of code to be\
    \ executed if the condition is true\n}\n```\n\nSo now we know how if statement\
    \ works.\n\nNow let's see the condition in detail:\n\n```\nselectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1\n```\n\nWe are checking the length\
    \ of `selectedArray`. If it's less than two, this means we still haven't selected\
    \ two tiles.\n\n> **length** property returns the number of elements in an array.\n\
    \nWe are also checking if the currently selected tile is already in `selectedArray`\
    \ array, which means we already selected that tile.\n\n> **indexOf** method returns\
    \ the position of a given element in the array. If there is no occurrence, `indexOf`\
    \ returns **-1**.\n\nIn this case, we check for `indexOf` to be equal to **-1**,\
    \ to be sure there's no occurrence of the selected tile in `selectedArray` array.\n\
    \n> **==** operator means **equal to**.\n\nThe whole `if` condition will be true\
    \ only if both conditions are true.\n\n> **&&** is the **and** logical operator\
    \ used to connect two conditions\n\nTranslated in everyday language, we wrote\
    \ \"if the selected array has less than two elements and there's no occurrence\
    \ in the array of the tile we just selected, then insert the tile in the array\"\
    .\n\nA lot of new concepts in just a couple of lines, but now the player will\
    \ follow the rules of the game, at least during the selection of tiles.\n\nNow\
    \ there is another rule to develop, the most important one, because it's the one\
    \ which will reward player's memory: if the player selects two tiles with the\
    \ same value they will be removed from the stage.\n\nWe will cover back the tiles\
    \ otherwise."
  mdcn: "\n## 检查是否成功匹配并移除或翻回图块\n\n一旦我们选择了两个图块，`selectedArray` 就会有两个元素，接下来我们需要检查它们的值。\n\
    \n如果值匹配，我们将移除这些图块；如果值不匹配，我们将再次覆盖它们。\n\n这意味着需要在 `showTile` 函数中添加更多代码行：\n\n```\n\
    showTile: function(target){\n    if(selectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1){\n        target.frame = target.value;\n        selectedArray.push(target);\n\
    \    }\n    if(selectedArray.length == 2){\n        if(selectedArray[0].value\
    \ == selectedArray[1].value){\n            selectedArray[0].destroy();\n     \
    \       selectedArray[1].destroy();\n        }\n        else{\n            selectedArray[0].frame\
    \ = 10;\n            selectedArray[1].frame = 10;\n        }\n        selectedArray.length\
    \ = 0;\n    }\n}\n```\n\n让我们详细查看新代码：\n\n```\nif(selectedArray.length == 2){\n\
    \    ...\n}\n```\n\n这就是我们检查 `selectedArray` 是否有两个元素的方式，现在是时候检查图块是否具有相同的值了：\n\n\
    ```\nif(selectedArray[0].value == selectedArray[1].value){\n    ...\n}\n```\n\n\
    我们访问第一个和第二个 `selectedArray` 元素的 `value` 自定义属性，并检查它们是否相等。\n\n如果它们相等，就是时候从舞台中移除图块了。\n\
    \n> `destroy` 方法会永久销毁按钮，销毁输入事件和动画处理程序（如果存在），并将其对游戏的引用置空，释放它供垃圾回收。\n\n这是移除按钮并再也不用考虑它的最佳方式，所以让我们销毁这两个按钮。\n\
    \n```\nselectedArray[0].destroy();\nselectedArray[1].destroy();\n```\n\n现在，当玩家选择了具有相同符号的图块时，我们就完成了处理。\n\
    \n如果图块具有不同的符号呢？\n\n我们需要使用 `if` 语句的一个扩展，称为 `else`。\n\n> 使用 **else** 语句来指定当 `if`\
    \ 语句中的条件为 false 时执行的代码块。\n\n它的工作原理如下：\n\n```\nif(condition){\n    // 当条件为真时执行的代码块\n\
    }\nelse{\n    // 当条件为假时执行的代码块\n}\n```\n\n所以，当条件“选中的图块具有相同的值”为 false 时，会发生以下情况：\n\
    \n```\nelse{\n    selectedArray[0].frame = 10;\n    selectedArray[1].frame = 10;\n\
    }\n```\n\n我们只需将两个图块的 `frame` 属性都改回 10，就能将它们翻回。\n最后，无论图块是被移除还是被覆盖回去，我们都需要清空 `selectedArray`\
    \ 数组，以便让玩家选择新的一组图块。\n要清空一个数组，我们将其长度设置为零：\n\n```\nselectedArray.length = 0;\n```\n\
    \n如果你浏览网络，会发现清空数组的另一种方式，例如通过将它们重新设置为空数组定义，即赋值为 `[]`。\n\n我个人在 JavaScript 中更喜欢将数组长度设置为零，而对此原因的解释超出了本项目的范围。\n\
    \n你可以自由选择你偏好的方式来清空数组，只需确保 `selectedArray` 现在是空的，否则玩家将无法再选择任何图块。\n\n是时候运行游戏，并尝试进行匹配和不匹配的选择了。\n\
    \n现在，匹配的图块将从舞台中移除，而不匹配的图块将被覆盖回去。\n\n一切工作正常，只是你无法看到你选择的第二个图块，是吧？\n\n这是因为一旦你选择了第二个图块，我们就会非常快地执行图块匹配检查并移除/覆盖选中的图块，你甚至看不清发生了什么。\n\
    \n这显然是一个糟糕的游戏设计实践，所以我们将在移除/覆盖它们之前，让选中的图块停留一秒钟。\n\n## 使用计时器来调度事件\n\nPhaser 允许我们以简单直观的方式创建各种时间驱动事件。\n\
    \n> time.events.add(tick, callback, callbackContext) 添加一个计时器事件，该事件将在 tick 时间过去后，在\
    \ callbackContext 上下文中执行 callback 函数。\n\n`Phaser.Timer.SECOND` 是一个 Phaser 保留变量，表示“一秒钟”，`checkTiles`\
    \ 是我们打算在意识到玩家翻开了两个图块一秒钟后调用的函数名。\n\n现在，对 `this` 的使用应该清晰地提示你如何声明 `checkTiles` 函数。\n\
    \n```\nshowTile: function(target){\n    if(selectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1){\n        target.frame = target.value;\n        selectedArray.push(target);\n\
    \        if(selectedArray.length == 2){\n            game.time.events.add(Phaser.Timer.SECOND,\
    \ this.checkTiles, this);\n        }\n    }\n},\ncheckTiles: function(){\n   \
    \ // 函数代码写在这里\n}\n```\n\n我们应该在 `checkTiles` 函数中写什么？\n\n正是我们之前用于检查图块匹配并移除/覆盖它们的那段代码。\n\
    \n```\ncheckTiles: function(){\n    if(selectedArray[0].value == selectedArray[1].value){\n\
    \        selectedArray[0].destroy();\n        selectedArray[1].destroy();\n  \
    \  }\n    else{\n        selectedArray[0].frame = 10;\n        selectedArray[1].frame\
    \ = 10;\n    }\n    selectedArray.length = 0;\n}\n```\n\n现在运行游戏，你会看到游戏会等待一秒钟，让两个图块都显示在舞台上，然后再移除或覆盖它们。\n\
    \n现在，最后但同样重要的一点，我们的游戏与真正的记忆游戏（Concentration）之间的区别：我们的图块总是放置在相同、可预测的位置。\n我们必须通过洗牌来增加一点游戏趣味性。\n\
    \n## 洗牌\n\n洗牌背后的基本原理是打乱图块值的数组，即 `tileArray`，该数组将用于为每个图块分配其值。\n\n有很多种洗牌的方法，它们都基于随机数生成，这是一个有着无数理论的分支。\n\
    \n虽然在涉及真实金钱奖励的赌场游戏中，真正的随机性非常重要，但在一个快速益智游戏中，这没有意义，因为基本的随机函数提供了足够的随机性，足以让我们每次玩的时候都获得完全不同的棋盘。\n\
    \n所以，我们将以最基本的方式更改 `placeTiles` 函数，只是随机交换 `tilesArray` 中的两个元素指定次数，而 `numRows` *\
    \ `numCols` 次交换足以获得一个完全打乱的棋盘。\n\n以这种方式更改 `placeTiles` 函数：\n\n从无到有的 HTML5 跨平台游戏\n\
    \n脚本中有什么变化？首先，我们添加了一些你已经熟悉的东西：\n\n```\nselectedArray.push(target);\n```\n\n你应该记得\
    \ **push** 方法向数组末尾添加一个新项，在本例中是 `selectedArray`。\n\n然后，还有另一行代码引入了一些新概念：\n\n```\n\
    if(selectedArray.length < 2 && selectedArray.indexOf(target) == -1){\n    ...\n\
    }\n```\n\n首先，让我向你介绍 `if` 语句。\n\n在编写代码时，你经常希望为不同的决策执行不同的操作，或者仅在某些情况下执行某些操作。\n\n\
    你可以使用代码中的条件语句来实现这一点，而 `if` 是最常见的语句。\n\n如果给定的条件为真，`if` 语句将执行一段 JavaScript 代码。\n\
    \n我们可以用这种形式编写典型的 if 语句：\n\n```\nif(condition){\n    // 当条件为真时执行的代码块\n}\n```\n\n\
    所以现在我们知道了 if 语句的工作原理。\n\n现在让我们详细看看这个条件：\n\n```\nselectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1\n```\n\n我们正在检查 `selectedArray` 的长度。如果它小于二，这意味着我们还没有选择两个图块。\n\n> **length**\
    \ 属性返回数组中元素的数量。\n\n我们还在检查当前选中的图块是否已经在 `selectedArray` 数组中，这意味着我们已经选择了该图块。\n\n\
    > **indexOf** 方法返回给定元素在数组中的位置。如果没有找到，`indexOf` 返回 **-1**。\n\n在这种情况下，我们检查 `indexOf`\
    \ 是否等于 **-1**，以确保选中的图块在 `selectedArray` 数组中没有出现。\n\n> **==** 运算符表示 **等于**。\n\n\
    整个 `if` 条件只有在两个条件都为真时才会为真。\n\n> **&&** 是 **与** 逻辑运算符，用于连接两个条件。\n\n用日常语言来说，我们写的是“如果选中的数组元素少于两个，并且我们刚刚选择的图块在数组中不存在，那么将该图块插入数组”。\n\
    \n短短几行代码中包含了很多新概念，但现在玩家将遵守游戏规则，至少在选择图块时是这样。\n\n现在还有另一个规则需要开发，也是最重要的一个，因为它将奖励玩家的记忆力：如果玩家选择了两个具有相同值的图块，它们将从舞台中移除。\n\
    \n否则，我们将覆盖回这些图块。\n"
