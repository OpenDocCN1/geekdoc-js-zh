  pgno: 64
- img_proc: true
  md: '# Saving high score


    When playing a game, you will quickly realize there is no point in making a great
    score if you can''t save it and try to beat it later.


    We are going to cover how to save your best score, and keep it saved even if you
    close the browser window or turn off your computer or device.


    All modern browsers natively support **local storage**, a way used by web pages
    to locally store data in a key/value notation.


    The information you save will continue to be stored even when you shut down your
    device and can be read every time you launch your game. This is exactly what we
    need.


    Let''s create two new variables:


    ```

    var tileSize = 80;

    var numRows = 4;

    var numCols = 5;

    var tileSpacing = 10;

    var localStorageName = "crackalien";

    var highScore;

    var tilesArray = [];

    var selectedArray = [];

    var playSound;

    var score;

    var timeLeft;

    var tilesLeft;

    var game = new Phaser.Game(500, 500);

    ```


    `localStorageName` variable stores the name of the local storage variable, so
    each time you will change crackalien with something else, you will reset your
    best score.


    `highScore` will contain the actual high score number.


    When we launch the game, before entering the title screen we will check the local
    storage to see if we already saved a high score, so we are going to add a line
    before starting `TitleScreen` state.


    This line will introduce a lot of new concepts:'
  merge: -1
  pgno: 65
- img_proc: true
  md: "```\ngame.state.add(\"TitleScreen\", titleScreen);\ngame.state.add(\"PlayGame\"\
    , playGame);\ngame.state.add(\"GameOver\", gameOver);\nhighScore = localStorage.getItem(localStorageName)\
    \ == null ? 0 : localStorage.getItem(localStorageName);\ngame.state.start(\"TitleScreen\"\
    );\n```\n\nDoes it look strange?\n\nIt's a conditional operator, also called ternary\
    \ operator because it requires three operands.\n\n> **A conditional operator**,\
    \ written as `condition ? expr1 : expr2` will return the value of `expr1` if `condition`\
    \ is true, or the value of `expr2` if `condition` is false. Think about it as\
    \ a short `if` statement like `if (condition) then expr1 else expr2`.\n\nWriting\
    \ the conditional operator as an `if` statement, it will look like:\n\n```\nif(localStorage.getItem(localStorageName)\
    \ == null){\n    highScore = 0;\n}\nelse{\n    highScore = localStorage.getItem(localStorageName);\n\
    }\n```\n\n`getItem` method of `localStorage` retrieves `localStorageName` data.\
    \ If it's `null`, it means we never saved a high score.\n\n> `localStorage.getItem(keyName)`\
    \ returns `keyName`'s value.\n\nProbably it's the first time we launch the game\
    \ in this browser, or we never played until game over screen – where we will save\
    \ the score – or we just changed `localStorageName` name.\n\nIn this case, `highScore`\
    \ is set to zero.\n\nIf there is a value in local storage data, this means we\
    \ previously saved a high score so we set `highScore` to this value.\n\nAnd this\
    \ is how we retrieve previously saved high score, if any."
  merge: -1
  pgno: 66
- img_proc: true
  md: "To save it, we'll need to add a couple of lines to `create` method in `GameOver`\
    \ state:\n\n```\ncreate: function(){\n    highScore = Math.max(score, highScore);\n\
    \    localStorage.setItem(localStorageName, highScore);\n    var style = {\n \
    \       font: \"32px Monospace\",\n        fill: \"#00ff00\",\n        align:\
    \ \"center\"\n    }\n    var text = game.add.text(game.width / 2, game.height\
    \ / 2, \"Game Over\\n\\nYour score: \" + score + \"\\nBest score: \" + highScore\
    \ + \"\\n\\nTap to restart\",\n        style);\n    text.anchor.set(0.5);\n  \
    \  game.input.onDown.add(this.restartGame, this);\n}\n```\n\nNow launch the game\
    \ and play a couple of times, then close the browser window or even restart your\
    \ computer/device\n\nYour high score will always remain saved:\n\n![](img/94d5f4f278808ce315dcc02186d68404_67_0.png)\n\
    \nLet's see how that was possible.\n\nThe first thing to do is to see if the current\
    \ score is higher than `highScore` value and in that case update `highScore` variable\
    \ setting it to `score`.\n\nRather than using an `if` statement, to see something\
    \ new we'll always update `highScore` value setting it to the highest number between\
    \ `score` and `highScore`."
  merge: -1
  pgno: 67
- img_proc: true
  md: '> Math.max(v1, v2, v3, ... , vn) method returns the highest number among its
    arguments.


    Once highScore has been updated, it''s time to save it to the local storage.


    > localStorage.setItem(keyName, keyValue) method adds keyName to the storage,
    or updates it to keyValue if it already exists.


    And finally we can output the score as well as the high score.

    Now your game will remember your best score.

    As a final advice, I don''t recommend using simple names like “bestScore” or “currentLevel”
    for your local storage variables as other applications could use the same names,
    and you will overwrite other settings with your data, or get your data overwritten
    by other applications data.

    Use long names, with your game name as prefix, such as CrakAlienCodeScore, so
    when you''ll make another game called, let''s say, Endless Jumper, you will save
    your score in a variable called EndlessJumperScore, and you won''t have problems.


    # Organizing your folders


    You should be proud of your first game, but having a look at your project folder
    it looks a bit unorganized.


    ![](img/94d5f4f278808ce315dcc02186d68404_68_0.png)


    We have images, sounds and scripts all placed in the same folder.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'This is not a big problem when you are dealing with simple games like this
    one, but imagine a bigger project with a lot of images and sounds: you will end
    with a folder full of clutter. That''s why you should create a folder called `assets`,
    with more folders in it called `sprites` and `sounds` where to place all your
    files. You can give your folders the names you want, but keep in mind there are
    the names I will be using in future books and tutorials. Now your project will
    look like this:


    ![](img/94d5f4f278808ce315dcc02186d68404_69_0.png)


    ![](img/94d5f4f278808ce315dcc02186d68404_69_1.png)


    Now it''s more organized, and we just have to edit the preloading paths.'
  merge: -1
  pgno: 69
- img_proc: true
  md: "This is how we change `preload` method in `playGame` object:\n\n```\npreload:\
    \ function(){\n    game.load.spritesheet(\"tiles\", \"assets/sprites/tiles.png\"\
    , tileSize, tileSize);\n    game.load.audio(\"select\", [\"assets/sounds/select.mp3\"\
    , \"assets/sounds/select.ogg\"]);\n    game.load.audio(\"right\", [\"assets/sounds/right.mp3\"\
    , \"assets/sounds/right.ogg\"]);\n    game.load.audio(\"wrong\", [\"assets/sounds/wrong.mp3\"\
    , \"assets/sounds/wrong.ogg\"]);\n}\n```\n\nAnd the same concept applies to `preload`\
    \ method in `titleScreen`:\n\n```\npreload: function(){\n    game.load.spritesheet(\"\
    soundicons\", \"assets/sprites/soundicons.png\", 80, 80);\n}\n```\n\nAnd now we\
    \ have the same working game, with more organization.\n\n# Creating a preloader\
    \ state\n\nThere's another small optimization to do in order to keep your code\
    \ organized, especially if you are working on a small game which does not require\
    \ that much images and sounds.\n\nAt the moment we preload assets in a way we\
    \ can call \"on demand\".\n\nWhen in title screen we needed the sound buttons,\
    \ we preloaded their images, then when in game state we needed the sounds and\
    \ the tiles, we preloaded them.\n\nIt would be better if we could preload all\
    \ assets before the game begins, so all code and references to images and sounds\
    \ can be found in a single place.\n\nThat's why are going to create a new state\
    \ called `PreloadAssets` which will handle all preloading process, freeing other\
    \ states from having a `preload` method.\n\nObviously this newly created state\
    \ will be the first the game will execute, to ensure all assets have been preloaded\
    \ before we launch the game itself with `TitleScreen` state."
  merge: -1
  pgno: 70
- img_proc: true
  md: "```\ngame.state.add(\"PreloadAssets\", preloadAssets);\ngame.state.add(\"TitleScreen\"\
    , titleScreen);\ngame.state.add(\"PlayGame\", playGame);\ngame.state.add(\"GameOver\"\
    , gameOver);\nhighScore = localStorage.getItem(localStorageName) == null ? 0 :\
    \ localStorage.getItem(localStorageName);\ngame.state.start(\"PreloadAssets\"\
    );\n```\n\nThe code of PreloadAssets is just a cut/paste of the code of the preload\
    \ methods in PlayGame and TitleScreen states:\n\n```\nvar preloadAssets = function(game){}\n\
    preloadAssets.prototype = {\n    preload: function(){\n        game.load.spritesheet(\"\
    tiles\", \"assets/sprites/tiles.png\", tileSize, tileSize);\n        game.load.audio(\"\
    select\", [\"assets/sounds/select.mp3\", \"assets/sounds/select.ogg\"]);\n   \
    \     game.load.audio(\"right\", [\"assets/sounds/right.mp3\", \"assets/sounds/right.ogg\"\
    ]);\n        game.load.audio(\"wrong\", [\"assets/sounds/wrong.mp3\", \"assets/sounds/wrong.ogg\"\
    ]);\n        game.load.spritesheet(\"soundicons\", \"assets/sprites/soundicons.png\"\
    , 80, 80);\n    },\n    create: function(){\n        game.state.start(\"TitleScreen\"\
    );\n    }\n}\n```\n\nAs you can see I only copied the content of the old preload\
    \ methods – which you will have to remove now – and in create method, once all\
    \ assets have been loaded, I launch TitleScreen state, starting the game."
  merge: -1
  pgno: 71
- img_proc: true
  md: '# # Where to go now


    When you make a game following a tutorial or a book, I always suggest to make
    it twice: the first time following the tutorial and the second time on your own.


    Take a deep breath, delete everything and create the game from scratch.


    Then, add some basic features, like keeping track of the highest score, or the
    number of unsuccessful matches.


    # # Thank you and let''s keep in touch


    Now you finished the book.


    It''s my first self-published book after three books written under a publishing
    label, so I apologize if you found some errors.


    Please notify me of any errors you should find, and give me feedback dropping
    me a line to [info@emanueleferonato.com](mailto:info@emanueleferonato.com).


    Also, follow my blog [www.emanueleferonato.com](http://www.emanueleferonato.com)
    where you can find new tutorials almost daily.


    Finally, my Facebook fan page [https://www.facebook.com/emanueleferonato](https://www.facebook.com/emanueleferonato)
    and Twitter account [https://twitter.com/triqui](https://twitter.com/triqui).


    I would like to thank **Richard Davey** and all **Photon Storm** guys for making
    the incredible Phaser framework.


    Another special “thank you” goes to **Mario** (just “Mario”, do not know his surname)
    for hunting for typos and errors.


    I hope you enjoyed reading this book as much as I enjoyed writing it.

    Emanuele.'
