  md: "# From null to full HTML5 cross-platform game\n\n```\ncreate: function(){\n\
    \    this.placeTiles();\n    if(playSound){\n        this.soundArray[0] = game.add.audio(\"\
    select\", 1);\n        this.soundArray[1] = game.add.audio(\"right\", 1);\n  \
    \      this.soundArray[2] = game.add.audio(\"wrong\", 1);\n    }\n}\n```\n\nTo\
    \ insert elements into an array we always used push method but you can also declare\
    \ items one by one assigning a value for a given index, like I did in these latest\
    \ lines of code.\n\n> add.audio(key, volume) adds a new audio file to the sound\
    \ manager. key is the name we gave to the sound, while volume is playing volume.\
    \ It ranges from ázür@PE ë^v^vP#ÇÜ\n\nNow that the sounds are preloaded and ready\
    \ to be played, it's time to insert our first sound into showTile method. This\
