- img_proc: true
  md: "```\nshowTile: function(target){\n    if(selectedArray.length < 2 && selectedArray.indexOf(target)\
    \ == -1){\n        target.frame = target.value;\n        selectedArray.push(target);\n\
    \    }\n    if(selectedArray.length == 2){\n        if(selectedArray[0].value\
    \ == selectedArray[1].value){\n            selectedArray[0].destroy();\n     \
    \       selectedArray[1].destroy();\n        }\n        else{\n            selectedArray[0].frame\
    \ = 10;\n            selectedArray[1].frame = 10;\n        }\n        selectedArray.length\
    \ = 0;\n    }\n}\n```\n\nLet's see the new code in detail:\n\n```\nif(selectedArray.length\
    \ == 2){\n    ...\n}\n```\n\nThis is how we check for selectedArray to have two\
    \ elements, so it's time to check for tiles to have the same value:\n\n```\nif(selectedArray[0].value\
    \ == selectedArray[1].value){\n    ...\n}\n```\n\nWe access `value` custom property\
    \ of the first and the second `selectedArray` elements and check for them to be\
    \ equal.\n\nIf they are equal, it's time to remove the tiles from the stage.\n\
    \n> `destroy` method permanently destroys the button, destroys the input event\
    \ and animation handlers if present and nulls its reference to game, freeing it\
    \ up for garbage collection.\n\nIt's the best way to remove the button and never\
    \ think about it again, so let's destroy both buttons."
  merge: -1
  pgno: 37
- img_proc: true
  md: "```\nselectedArray[0].destroy();\nselectedArray[1].destroy();\n```\n\nAnd now\
    \ we are done when the player selected tiles with the same symbols.\n\nWhat if\
    \ tiles have different symbols?\n\nWe have to use an extension to `if` statement\
    \ called `else`.\n\n> Use the **else** statement to specify a block of code to\
    \ be executed if the condition in the `if` statement is false.\n\nIt works this\
    \ way:\n\n```\nif(condition){\n    // block of code to be executed if the condition\
    \ is true\n}\nelse{\n    // block of code to be executed if the condition is false\n\
    }\n```\n\nSo when the condition “selected tiles have the same value” is false,\
    \ this is what happens:\n\n```\nelse{\n    selectedArray[0].frame = 10;\n    selectedArray[1].frame\
    \ = 10;\n}\n```\n\nWe simply change `frame` properties of both tiles to turn them\
    \ back again.\nFinally, no matter whether the tiles have been removed or covered\
    \ back, we need to empty `selectedArray` array to let the player select a new\
    \ couple of tiles.\nTo empty an array, we set its length to zero:\n\n```\nselectedArray.length\
    \ = 0;\n```\n\nIf you browse the web, you will find another way to empty arrays,\
    \ for example by setting them back to empty array definition assigning it to `[]`."
