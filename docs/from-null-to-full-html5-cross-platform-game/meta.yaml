  md: "# From null to full HTML5 cross-platform game\n\nLet's examine in detail what\
    \ changed:\n\n```\nfor(var i = 0; i < numRows * numCols; i++){\n    tilesArray.push(Math.floor(i\
    \ / 2));\n}\n```\n\nThis is a `for` loop – you should already be familiar with\
    \ it – which iterates for `numRows * numCols` times, that is the total amount\
    \ of tiles.\n\n**`push` adds new items to the end of an array.**\n\nAt each iteration,\
    \ `push` method adds a new item to the end of `tilesArray` adding zero, then zero\
    \ again, then one, then one again until a couple of nines.\n\n**`Math.floor` rounds\
    \ a number downward to its nearest integer.**\n\nJust to figure out what `tilesArray`\
    \ contains at this time, let's output its content to browser console:\n\n```\n\
    console.log(\"my tile values: \" + tilesArray);\n```\n\nNow, let's see the start\
    \ action of next loop:\n\n```\nfor(i = 0; i < numCols; i++){\n    ...\n}\n```\n\
    \nNow it's `i = 0` rather than `var i = 0`. Why?\n\nBecause you have already declared\
    \ `i` variable in the previous loop inside the same function. You only need to\
    \ declare a variable once.\n\n```\ntile.value = tilesArray[j * numCols + i];\n\
    ```\n\nAnd finally we can give each tile its proper value.\n\n`value` isn't a\
    \ built-in property of `tile` object, it's just a custom variable we are assigning\
    \ to `tile`. In other words, we are storing each tile value somewhere inside"
