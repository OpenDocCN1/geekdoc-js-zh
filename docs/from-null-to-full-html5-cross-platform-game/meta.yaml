  md: "loop iteration.\n\nHow can I say that? Let's analyze the syntax of a `for`\
    \ loop:\n\n```\nfor (start action; condition; recurring action) {\n    code block\
    \ to be executed\n}\n```\n\n**start action** is executed only once before the\
    \ loop starts, just like it was on the previous line.\n\n**condition** defines\
    \ the condition for running the loop. The loop will be executed as long as the\
    \ condition is satisfied.\n\n**recurring action** is executed each time after\
    \ the loop has been executed.\n\nSo in our case the start action is setting `i`\
    \ variable to zero. The condition is satisfied until `i` is less than `numCols`.\
    \ The recurring action is adding 1 to `i` at the end of each iteration.\n\nInside\
    \ the loop we just analyzed, we have another loop:\n\n```\nfor(var j = 0; j <\
    \ numRows; j++){\n    ...\n}\n```\n\nThis works according to the same concept\
