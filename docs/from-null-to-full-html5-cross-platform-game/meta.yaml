    \  align: \"center\"\n        }\n        var text = game.add.text(game.width /\
    \ 2, game.height / 2, \"Game Over\\n\\nYour score: \" + score + \"\\n\\nTap to\
    \ restart\", style);\n        text.anchor.set(0.5);\n        game.input.onDown.add(this.restartGame,\
