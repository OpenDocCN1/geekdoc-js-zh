    \ = 0;\n}\n```\n\n音效为游戏增添了更深层的体验，但还缺少一个关键功能，也就是我们所有人玩游戏的目的：得分。\n\n## 显示分数\n\n\
    为了跟踪分数，我相信你现在觉得这很明显了，我们需要将其存储在变量中。让我们创建一个名为 `score` 的变量。\n\n```\nvar tileSize\
    \ = 80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray\
    \ = [];\nvar selectedArray = [];\nvar playSound;\nvar score;\nvar game = new Phaser.Game(500,\
    \ 500);\n```\n\n在 `playGame` 对象内部，我们还需要另一个变量来在舞台上以可视化方式显示分数。再来一个文本怎么样？这就是为什么我要创建一个名为\
    \ `scoreText` 的 `playGame` 属性，它被声明为 `null`。\n\n> 在 JavaScript 中，`null` 表示“无”，或一个空值。\n\
    \n拥有 `null` 变量并不意味着我们不能在需要时给它赋值。\n\n```\nplayGame.prototype = {\n    scoreText:\
    \ null,\n    soundArray: [],\n    preload: function(){\n        ...\n    }\n \
    \   ...\n}\n```\n\n一旦 `create` 方法被执行，就意味着新游戏开始了，所以我们将 `score` 设置为零。此外，你应该能看出剩余几行的作用：\n\
    \n```\ncreate: function(){\n    score = 0;\n    this.placeTiles();\n    if(playSound){\n\
