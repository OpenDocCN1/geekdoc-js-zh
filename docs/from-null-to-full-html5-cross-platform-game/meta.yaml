    \ to the game should we decide to change the size of the tile to, let's say, 60\
    \ or 100.\n\nNo more \"search and replace\" operations, but a single value to\
    \ change.\n\nAlso, notice the variable has been placed inside the `window.onLoad`\
    \ function: this way we will be able to access to it from all functions declared\
