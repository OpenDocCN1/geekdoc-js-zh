- md: "## From null to full HTML5 cross-platform game\n\n![](img/94d5f4f278808ce315dcc02186d68404_62_0.png)\n\
    \nBy the way, did you try to play it on a mobile device?\n\nHere's how the game\
    \ looks like on my iPhone 5:\n\n![](img/94d5f4f278808ce315dcc02186d68404_62_1.png)\n\
    \nActually not the best way to play a game. There's nothing \"cross-platform\"\
    \ in it.\n\n## Making it run nicely on any mobile device, no matter what the orientation\
    \ is\n\nWe'll make the game look good on any device in two steps: first, we have\
    \ to scale up the game to cover the largest area possible, then we'll make the\
    \ HTML page which hosts the game more mobile friendly.\n\nAbout scaling up the\
    \ game, modify `create` method in `TitleScreen` state:\n\n```\ncreate: function(){\n\
    \    game.scale.pageAlignHorizontally = true;\n    game.scale.pageAlignVertically\
    \ = true;\n    game.scale.scaleMode = Phaser.ScaleManager.SHOW_ALL;\n    game.stage.disableVisibilityChange\
    \ = true;\n    var style = {\n        font: \"48px Monospace\",\n        fill:\
    \ \"#00ff00\",\n        align: \"center\"\n    };\n    ...\n}\n```\n\nLet's examine\
    \ the new lines one by one:\n\n```\ngame.scale.pageAlignHorizontally = true;\n\
    ```\n\nSetting `pageAlignHorizontally` to `true` will horizontally align the game\
    \ in the Parent container or window.\n\n```\ngame.scale.pageAlignVertically =\
    \ true;\n```\n\nSame thing, for vertical alignment\n\n```\ngame.scale.scaleMode\
    \ = Phaser.ScaleManager.SHOW_ALL;\n```\n\n`scaleMode` sets the scaling method\
    \ which in this case with `SHOW_ALL` we show the game at the largest scale possible\
    \ while keeping the original aspect ratio.\n\nThe last thing to do is editing\
    \ `index.html` file to add some meta tags which have been specifically created\
    \ for mobile devices. The new header content is:\n\n```\n<head>\n    <script type=\"\
    text/javascript\" src=\"phaser.js\"></script>\n    <script type=\"text/javascript\"\
    \ src=\"game.js\"></script>\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0,\n        maximum-scale=1.0, minimum-scale=1.0, user-scalable=no,\
    \ minimal-ui\" />\n    <meta name=\"apple-mobile-web-app-capable\" content=\"\
    yes\" />\n    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"\
    black\" />\n    <meta name=\"HandheldFriendly\" content=\"true\" />\n    <meta\
    \ name=\"mobile-web-app-capable\" content=\"yes\" />\n    <style type=\"text/css\"\
    >\n        body{\n            padding:0px;\n            margin:0px;\n        \
    \    background: #000;\n        }\n    </style>\n</head>\n```\n\nThere's no need\
    \ to explain these lines as they are standard tags suggested by device manufacturers.\n\
    \n![](img/94d5f4f278808ce315dcc02186d68404_64_0.png)\n\nAnd now you finally completed\
    \ the project.\n\n## Saving high score\n\nWhen playing a game, you will quickly\
    \ realize there is no point in making a great score if you can't save it and try\
    \ to beat it later.\n\nWe are going to cover how to save your best score, and\
    \ keep it saved even if you close the browser window or turn off your computer\
    \ or device.\n\nAll modern browsers natively support **local storage**, a way\
    \ used by web pages to locally store data in a key/value notation.\n\nThe information\
    \ you save will continue to be stored even when you shut down your device and\
    \ can be read every time you launch your game. This is exactly what we need.\n\
    \nLet's create two new variables:\n\n```\nvar tileSize = 80;\nvar numRows = 4;\n\
    var numCols = 5;\nvar tileSpacing = 10;\nvar localStorageName = \"crackalien\"\
    ;\nvar highScore;\nvar tilesArray = [];\nvar selectedArray = [];\nvar playSound;\n\
    var score;\nvar timeLeft;\nvar tilesLeft;\nvar game = new Phaser.Game(500, 500);\n\
    ```\n\n`localStorageName` variable stores the name of the local storage variable,\
    \ so each time you will change crackalien with something else, you will reset\
    \ your best score.\n\n`highScore` will contain the actual high score number.\n\
    \nWhen we launch the game, before entering the title screen we will check the\
    \ local storage to see if we already saved a high score, so we are going to add\
    \ a line before starting `TitleScreen` state.\n\nThis line will introduce a lot\
    \ of new concepts:\n\n```\ngame.state.add(\"TitleScreen\", titleScreen);\ngame.state.add(\"\
    PlayGame\", playGame);\ngame.state.add(\"GameOver\", gameOver);\nhighScore = localStorage.getItem(localStorageName)\
    \ == null ? 0 : localStorage.getItem(localStorageName);\ngame.state.start(\"TitleScreen\"\
    );\n```\n\nDoes it look strange?\n\nIt's a conditional operator, also called ternary\
    \ operator because it requires three operands.\n\n> **A conditional operator**,\
    \ written as `condition ? expr1 : expr2` will return the value of `expr1` if `condition`\
    \ is true, or the value of `expr2` if `condition` is false. Think about it as\
    \ a short `if` statement like `if (condition) then expr1 else expr2`.\n\nWriting\
    \ the conditional operator as an `if` statement, it will look like:\n\n```\nif(localStorage.getItem(localStorageName)\
    \ == null){\n    highScore = 0;\n}\nelse{\n    highScore = localStorage.getItem(localStorageName);\n\
    }\n```\n\n`getItem` method of `localStorage` retrieves `localStorageName` data.\
    \ If it's `null`, it means we never saved a high score.\n\n> `localStorage.getItem(keyName)`\
    \ returns `keyName`'s value.\n\nProbably it's the first time we launch the game\
    \ in this browser, or we never played until game over screen – where we will save\
    \ the score – or we just changed `localStorageName` name.\n\nIn this case, `highScore`\
    \ is set to zero.\n\nIf there is a value in local storage data, this means we\
    \ previously saved a high score so we set `highScore` to this value.\n\nAnd this\
    \ is how we retrieve previously saved high score, if any.\n\nTo save it, we'll\
    \ need to add a couple of lines to `create` method in `GameOver` state:\n\n```\n\
    create: function(){\n    highScore = Math.max(score, highScore);\n    localStorage.setItem(localStorageName,\
    \ highScore);\n    var style = {\n        font: \"32px Monospace\",\n        fill:\
    \ \"#00ff00\",\n        align: \"center\"\n    }\n    var text = game.add.text(game.width\
    \ / 2, game.height / 2, \"Game Over\\n\\nYour score: \" + score + \"\\nBest score:\
    \ \" + highScore + \"\\n\\nTap to restart\",\n        style);\n    text.anchor.set(0.5);\n\
    \    game.input.onDown.add(this.restartGame, this);\n}\n```\n\nNow launch the\
    \ game and play a couple of times, then close the browser window or even restart\
    \ your computer/device\n\nYour high score will always remain saved:\n\n![](img/94d5f4f278808ce315dcc02186d68404_67_0.png)\n\
    \nLet's see how that was possible.\n\nThe first thing to do is to see if the current\
    \ score is higher than `highScore` value and in that case update `highScore` variable\
    \ setting it to `score`.\n\nRather than using an `if` statement, to see something\
    \ new we'll always update `highScore` value setting it to the highest number between\
