  md: 'From null to full HTML5 cross-platform game


    # A little preface


    I won''t annoy you with boring introductions which everybody skips, I just want
    you to know why I am writing this book.


    When I am about to start learning a new language or framework, and it happened
    a lot of times in 30 years spent studying and working on programming languages,
    I always desperately look for a book able to guide me from the bare bones to the
    creation of a real, complete project.


    Unfortunately, most beginner guides just make a brief overview, leaving it to
    you to continue learning and experimenting, and advanced guides assume you already
    are an advanced user.


    What I wanted to do with this book is to take you by hand even if you are an absolute
    beginner and give you everything you need to create a complete game from scratch.


    I really hope you will like this book and will find it useful.


    But most of all I want to say **thank you**.


    By buying this book you allow me to concentrate on book and course development,
    which is something I really like.


    I will do my best to make this book worth every single cent of your money.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'From null to full HTML5 cross-platform game


    # What is a cross-platform game and why should I make cross-platform games?


    With the great interest in mobile games, capable of running on modern portable
    devices such as smartphones and tablets, there''s a lot of talking about "cross-platform"
    term these days.


    Although we are talking about modern devices, the cross-platform concept comes
    from an older computer age, before smartphones and tablets, probably before any
    kind of portable device smaller than a mid-sized suitcase.


    In its original context, cross-platform is an attribute conferred to computer
    software or computing methods and concepts that are implemented and inter-operate
    on multiple computer platforms.


    Such software and methods are also called "platform independent".


    To tell you the short story, a cross-platform software will run on any platform
    without special adaptation, or with a minimum special adaptation.


    A good example of a cross-platform language is Java: a compiled Java program runs
    on all platforms under Java Virtual Machine, which you can find in all major operating
    systems, including Windows, Mac OS and Linux.


    Stop with the boring theory and back to our days. A cross-platform game, the kind
    of games we are going to build, is a game which will be able to run on various
    devices, such as smartphones and tablets – but also on在山镇 – each one with its
    own resolution and screen aspect ratio.


    And here comes the main question: why should I make cross-platform games?


    Listen to my story.


    When HTML5 mobile gaming started to become popular, I had an iPad2 tablet and
    made a game which fitted perfectly in its resolution.


    I was very happy with that game, it was a word game and looked really great on
    my brand new tablet, covering the entire screen with sprites and colors.'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'Once I completed the game, I started showing it to various sponsors. I already
    had a list of sponsors emails collected during Flash gaming era, so I was expecting
    a lot of offers.


    Actually, I got offers, but most of them said something like "Hey, I like the
    game, but unfortunately it does not look that good on my iPhone".


    "Don''t worry", I said, "you''ll get the game optimized for both iPad and iPhone".


    After some extra work, I was told the game did not look good on the Galaxy Note.


    A few fixes and tweaks later, it happened the game did not look good on the Samsung
    S4.


    When the game was finally optimized for all required devices, it did not look
    good anymore on my iPad.


    You can imagine the rest of this story. I found myself almost rewriting the game
    with a series of exceptions, trying to make it look good on any device.


    This is why you should make a cross-platform game: to code once and rule them
    all.


    Focus on coding and game development while a framework does the dirty work for
    you.


    That''s when **Phaser** comes into play.


    # # What is Phaser?


    Phaser is a free HTML5 game framework which aims to help developers make powerful,
    cross-browser HTML5 games really quickly using JavaScript.


    JavaScript, being a familiar and intuitive language, is one of the most common
    languages so if you did not already developed JavaScript applications you will
    find a lot of books and tutorials around the web to get you started. Anyway, you
    don''t need anything else than this book to build your first complete game, so
    let''s start having some fun.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Can I build a game like GTA with Phaser?


    To tell you the truth, I don''t know. Anyway, you shouldn''t even think about
    it.


    The first rule in game programming is: **create a game you are able to complete**.
    And when I say "complete a game" I don''t mean seeing the congratulations screen
    in GTA, I mean coding a game from scratch until the end.


    According to this concept, if you are an one-man studio or a small indie studio,
    you should choose a genre of game you are able to code from the beginning until
    the end.


    The game we are going to build in this book is **Concentration**.


    Concentration, also known as Memory, is a card game in which all of the cards
    are laid face down on a surface and two cards are flipped face up over each turn.


    The object of the game is to remove all card by turning over pairs of matching
    cards.


    I am sure you played with something similar when you were a kid:


    ![](img/94d5f4f278808ce315dcc02186d68404_5_0.png)'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'And although it may seem a simple game – and actually it is – there is a lot
    to learn from the making of this game, and we''ll add a couple of extra features
    to make it some more interesting.


    # Choosing a text editor


    Let''s turn your computer into a web development workstation with no cost thanks
    to Phaser and some other **free software**.


    In order to start making games with Phaser, you''ll first need a software to write
    code. There is a lot of free offers. I personally use **PSPad** ([http://www.pspad.com/](http://www.pspad.com/))
    on my Windows computer and **TextWrangler** ([http://www.barebones.com/products/textwrangler/](http://www.barebones.com/products/textwrangler/))
    on my Mac. Another alternative is **Brackets** ([http://brackets.io/](http://brackets.io/))
    but you can use your favorite text editor, I''d only suggest you choose one capable
    to highlight JavaScript syntax.


    # Choosing a web server


    To test your Phaser games, and more in general to test most web applications,
    you will need to install a web server on your computer to override browsers security
    limits when running your project locally.


    I am using **WAMP** ([http://www.wampserver.com/](http://www.wampserver.com/))
    on my Windows machine, and **MAMP** ([https://www.mamp.info/](https://www.mamp.info/))
    on the Mac. Recently, MAMP also released a Windows version ([https://www.mamp.info/en/mamp_windows.html](https://www.mamp.info/en/mamp_windows.html)).


    Just like the text editors, both WAMP and MAMP are free to use as you won''t need
    the PRO version, which is also available for MAMP.


    If you prefer, if you have a FTP space you can test your projects directly online
    by uploading and calling them directly from the web. In this case, you won''t
    need to have a web server installed on your computer, but I highly recommend using
    WAMP or MAMP instead.


    Most FTP spaces requires a paid account, and you can only use them when you have
    an internet connection available.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'From null to full HTML5 cross-platform game


    # REALLY choosing a web server, rather than closing the book


    I know at this time most of you may think "come on, it''s just JavaScript, what''s
    this server stuff, I quit!".


    This is the same thing I said when I first had to install and configure a web
    server just to run a JavaScript page.


    Let me explain why you should really choose a web server, rather than quit reading:
    browsers do not simply allow you to properly display web pages and HTML5 games.
    They also take care of your security. When you load a page locally in your browser,
    you won''t have problems until it''s just a static HTML web page.


    But when you launch more complex scripts which load and handle resources from
    your hard disk such as images, audio files and every other kind of data, to prevent
    malicious scripts to access to virtually any file on your computer, browsers have
    a series of security measures which stop files to be accessed and – unfortunately
    – this causes your games not to work.


    With a web server, browsers will know they are running in a small, safe environment
    where only some files – the ones you placed in a given project folder – can be
    accessed, and they will give your scripts green light to work properly.


    Believe me, it''s necessary and way easier than you may think.


    # Choosing a web browser


    Since your game will run on all modern browsers, you will also need a web browser
    to make your games run into and test them. I am using **Google Chrome** ([http://www.google.com/chrome/](http://www.google.com/chrome/))
    but you are free to use the one you prefer as long as it supports HTML5 `canvas`
    element. Having the latest version of your web browser installed on your computer
    should be enough.


    Refer to your browser support page to see if it supports `canvas` element.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'From null to full HTML5 cross-platform game


    # ## Other software you may need


    Games basically are a collection of images and sounds which are moved and played
    accordingly to player and scripting logic, so during the creation of the game
    you will be asked to edit and create both images and sounds.


    **Audacity** ([http://sourceforge.net/projects/audacity/](http://sourceforge.net/projects/audacity/))
    is a great free software to work with sounds, while I would suggest **GIMP** ([http://www.gimp.org/](http://www.gimp.org/))
    to work with images, which is also free.


    You can also use the trial version of **Photoshop** ([http://www.photoshop.com/](http://www.photoshop.com/))
    which allows you to use all features for free for a limited amount of time.


    # ## Downloading Phaser


    Finally, it''s time to download **Phaser** ([http://www.phaser.io/download](http://www.phaser.io/download))
    and you are ready to go.


    Phaser comes in a zipped file with a lot of docs and resources for a download
    file greater than 30 MB, anyway we will need just one file, containing the framework
    itself.


    # ## The structure of your Phaser project


    Every HTML5 game is a web page with some magic in it, so that''s what we are going
    to do: the creation of a web page in a folder placed inside our local web server.


    Without forgetting to include Phaser framework!


    Inside `build` folder in the zipped package you just downloaded, you will find
    `phaser.js` file. That''s the only Phaser file we will need during the development
    of our game. Create an `index.html` file which will be the web page you will call
    to launch the game, and you''ll have all you need to start writing the first lines
    of code of your first Phaser game.


    Your project folder now should contain two files.'
  merge: -1
  pgno: 8
- img_proc: true
  md: "From null to full HTML5 cross-platform game\n\nIf you followed all instructions,\
    \ your folder structure will look like this:\n\n![](img/94d5f4f278808ce315dcc02186d68404_9_0.png)\n\
    \nNow let's edit `index.html`:\n\n```\n<!DOCTYPE html>\n<html>\n    <head>\n \
    \       <script type=\"text/javascript\" src=\"phaser.js\"></script>\n       \
    \ <script type=\"text/javascript\" src=\"game.js\"></script>\n    </head>\n  \
    \  <body>\n    </body>\n</html>\n```\n\nAs you can see, it's just an empty web\
    \ page with only a call to two JavaScript files: `phaser.js` is the file we just\
    \ downloaded, and `game.js` will contain our game script.\n\nThis is the time\
    \ to create a new file in the same folder, call it `game.js` and write this code:\n\
    \n```\nwindow.onload = function() {\n    var game = new Phaser.Game(500, 500);\n\
