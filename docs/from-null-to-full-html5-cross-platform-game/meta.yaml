  md: "This is the first custom function we created: it's called `placeTiles`, and\
    \ will be used to place all game tiles.\n\n> In JavaScript, `this` always refers\
    \ to the owner of the function we're executing, or rather, to the object that\
    \ a function is a method of.\n\nUsing this, we have to write `placeTiles` function\
    \ as a method of `playGame` object.\n\nRemember, functions inside objects are\
