  md: "Everything works fine, it's just you aren't able to see the second tile you\
    \ select, are you?\n\nThis happens because as soon as you select the second tile,\
    \ we perform the check for matching tiles and remove/cover selected tiles so fast\
    \ you can't even see what happened.\n\nThis is obviously a bad game design practice,\
    \ so we will wait a second with the selected tile before removing/covering them.\n\
    \n# Using timers to schedule events\n\nPhaser allows us to create a variety of\
    \ time driven events, in a simple and intuitive way.\n\n> time.events.add(tick,\
    \ callback, callbackContext) adds a timer event which will execute callback function\
    \ in the callbackContext context after tick time has passed.\n\n`Phaser.Timer.SECOND`\
    \ is a Phaser reserved variable which means “one second”, `checkTiles` is the\
    \ name of the function we are going to call after a second we realized the player\
    \ uncovered two tiles.\n\nThe use of `this` should now clearly suggest you how\
    \ to declare `checkTiles` function.\n\n```\nshowTile: function(target){\n    if(selectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1){\n        target.frame = target.value;\n\
    \        selectedArray.push(target);\n        if(selectedArray.length == 2){\n\
    \            game.time.events.add(Phaser.Timer.SECOND, this.checkTiles, this);\n\
    \        }\n    }\n},\ncheckTiles: function(){\n    // function code goes here\n\
    }\n```\n\nWhat should we write in `checkTiles` function?\n\nExactly the same code\
    \ we used for checking tiles when there is a match and"
  merge: -1
  pgno: 40
- img_proc: true
  md: "remove/cover them.\n\n```\ncheckTiles: function(){\n    if(selectedArray[0].value\
    \ == selectedArray[1].value){\n        selectedArray[0].destroy();\n        selectedArray[1].destroy();\n\
    \    }\n    else{\n        selectedArray[0].frame = 10;\n        selectedArray[1].frame\
    \ = 10;\n    }\n    selectedArray.length = 0;\n}\n```\n\nNow run the game, and\
    \ you will see the game waits a second with both tiles shown on the stage before\
    \ removing or covering back them.\n\nNow, the last – but not least – difference\
    \ between our game and a real Concentration game: our tiles are always placed\
    \ in the same, predictable, place.\nWe have to spice up a bit the game by shuffling\
    \ the tiles.\n\n# Shuffling the tiles\n\nThe basics behind shuffling the tiles\
    \ is to shuffle the array of tile values, that `tileArray` which will be used\
    \ to assign each tile its own value.\n\nThere are a lot of ways to shuffle an\
    \ array and they all have their roots on random number generation, which is a\
    \ branch with countless theories.\n\nWhile in a casino game with real money prizes\
    \ true randomness is really important, in a quick puzzle game this does not make\
    \ sense, as the basic random functions provide a great deal of randomness which\
    \ is good enough to have a completely different boards each time we play.\n\n\
    So we are going to change `placeTiles` function in the most basic way with just\
    \ randomly switching two `tilesArray` elements a given amount of times, and `numRows`\
    \ * `numCols` times is enough to have a completely shuffled board.\n\nChange `placeTiles`\
    \ function this way:"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# From null to full HTML5 cross-platform game\n\n```\nplaceTiles: function(){\n\
    \    var leftSpace = (game.width - (numCols * tileSize) - ((numCols - 1) *\n \
    \       tileSpacing))/2;\n    var topSpace = (game.height - (numRows * tileSize)\
    \ - ((numRows - 1) *\n        tileSpacing))/2;\n    for(var i = 0; i < numRows\
    \ * numCols; i++){\n        tilesArray.push(Math.floor(i / 2));\n    }\n    for(i\
    \ = 0; i < numRows * numCols; i++){\n        var from = game.rnd.between(0,tilesArray.length-1);\n\
    \        var to = game.rnd.between(0, tilesArray.length-1);\n        var temp\
    \ = tilesArray[from];\n        tilesArray[from] = tilesArray[to];\n        tilesArray[to]\
    \ = temp;\n    }\n    for(i = 0; i < numCols; i++){\n        for(var j = 0; j\
    \ < numRows; j++){\n            var tile = game.add.button(leftSpace + i * (tileSize\
    \ +\n                tileSpacing), topSpace + j * (tileSize + tileSpacing),\n\
    \                \"tiles\", this.showTile, this);\n            tile.frame = 10;\n\
    \            tile.value = tilesArray[j * numCols + i];\n        }\n    }\n}\n\
    ```\n\nNow run the game and play, and have another go, then another one, and so\
    \ on. You will notice each time you start a game, tiles are placed in a different\
    \ way.\n\nThat's enough, and the code involved in this process is just another\
    \ `for` loop where at each iteration two randomly chosen elements in `tilesArray`\
    \ array are swapped, using a temporary variable because given two values A and\
    \ B, JavaScript does not allow us to swap A with B, but we can save A value in\
    \ C variable. Then assign A the value of B, then assign B the value of C which\
    \ is the saved A value.\n\nWhat I want you to focus in this loop is how I generate\
    \ the random numbers to assign to each array index for swapping.\n\n> `rnd.between(min,\
    \ max)` generates a random integer number ranging from `min` to `max`, both included.\n\
    \nAnd this last feature completes our game, a nice game which nobody will want\
    \ to play.\n\nAlthough the game runs and works well, you can't believe people\
    \ will play games"
