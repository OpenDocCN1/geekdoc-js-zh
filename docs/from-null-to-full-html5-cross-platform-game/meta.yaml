  md: "From null to full HTML5 cross-platform game\n\nWhere to store these values?\
    \ In an array.\n\n> An **array** is a special variable, which can hold more than\
    \ one value at a time, under a single variable name, and you can access the values\
    \ by referring to an index number.\n\nYou will master arrays in a couple of minutes,\
    \ at the moment let's create a new variable called `tilesArray` which will store\
    \ all tiles information. At the beginning it will be an empty array, which we\
    \ will populate later in the code.\n\n```\nvar tileSize = 80;\nvar numRows = 4;\n\
    var numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar game = new\
    \ Phaser.Game(500, 500);\n```\n\n`tilesArray` will now be populated with tile\
    \ values as mentioned above.\n\n> **Empty arrays** are defined with open/close\
    \ square brackets [] .\n\nPopulate the array and assign a custom property to tiles\
    \ changing `placeTiles`:\n\n```\nplaceTiles: function(){\n    var leftSpace =\
    \ (game.width - (numCols * tileSize) - ((numCols - 1) * tileSpacing))/2;\n   \
    \ var topSpace = (game.height - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n\
    \    for(var i = 0; i < numRows * numCols; i++){\n        tilesArray.push(Math.floor(i\
    \ / 2));\n    }\n    console.log(\"my tile values: \" + tilesArray);\n    for(i\
    \ = 0; i < numCols; i++){\n        for(j = 0; j < numRows; j++){\n           \
    \ var tile = game.add.button(leftSpace + i * (tileSize + tileSpacing), topSpace\
    \ + j * (tileSize + tileSpacing),\n                \"tiles\", this.showTile, this);\n\
    \            tile.frame = 10;\n            tile.value = tilesArray[j * numCols\
    \ + i];\n        }\n    }\n}\n```\n\nAs you can see, the function has been modified\
    \ with some new code: there's a new `for` loop at the beginning, something changed\
    \ in the loop which iterates through columns and there's a new line near the end\
