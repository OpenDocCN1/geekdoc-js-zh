  md: 'Finally we can talk about the main topic of this section, Phaser states:


    ```

    game.state.add("PlayGame", playGame);

    ```


    Here is how we add a state to our game. The first parameter – from now on argument
    as said before – is the name we give to the state, and the second is the function
    called once the state is started.


    > `state.add(key, state)` adds a new state. You must give each state a unique
    name in `key` argument by which you''ll identify it. `state` is usually a JavaScript
    object or a function.


    In other words, we bind `playGame` function to a state called `PlayGame`.


    ```

    game.state.start("PlayGame");

    ```


    And finally this is how a state is started.


    > `state.start(key)` starts the state previously named with `key`.


    At this time, `PlayGame` state is started, calling `playGame` function which will
    consequently call `playGame.create` function.


    # Creating tile graphics using a sprite sheet


    We are going to create a board with 4 rows and 5 columns, for a total of 20 tiles
    on the stage.


    Since each tile has a symbol on it, and since each symbol is placed twice on the
    board, we have to draw 20/2 = 10 images to represent the 10 different tiles, and
    one image to represent the back of each tile, for a grand total of 11 images.


    At this time, we can-save the 11 images in eleven distinct files or group them
    all into a sprite sheet.


    > A **sprite sheet** is a series of images combined into a larger image. Usually
    the images are frames of an animation, thus a single image inside a sprite sheet
    is'
