  md: "players won't see the values of the tiles they select.\n\n# Showing tiles once\
    \ selected\n\nTo give players a visual feedback of the tiles they select, we need\
    \ to change their frame according to their value once selected.\n\nWe know each\
    \ tile value since it's stored in `value` custom property, so we only need to\
    \ change its frame when selected. Here is the one and only line we have to write\
    \ to make this happen:\n\n```\nshowTile: function(target){\n    target.frame =\
    \ target.value;\n}\n```\n\nDo you remember `frame` property? That's all we need\
    \ to show actual tile content.\nRun the game, select tiles and see their contents.\n\
    \n![](img/94d5f4f278808ce315dcc02186d68404_33_0.png)\n\nThis is a great step further\
    \ in the making of the game, but it's not enough, as at the moment you are able\
    \ to select how many tiles as you want, while in the original game you must select\
    \ only two tiles each turn. We need a way to allow the player to select only two\
    \ tiles."
