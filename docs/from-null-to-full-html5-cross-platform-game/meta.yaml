    var game = new Phaser.Game(500, 500);\n```\n\nInside `playGame` object, we will\
    \ need another variable to visually display the score on the stage. How about\
    \ another text?\n\nThat's why I am going to create a `playGame` property called\
    \ `scoreText`, which is declared as `null`.\n\n> In JavaScript `null` means \"\
