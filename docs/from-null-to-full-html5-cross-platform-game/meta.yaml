    \ to preload all stuff in `preload` function.\n\n```\ngame.load.spritesheet(\"\
    tiles\", \"tiles.png\", tileSize, tileSize);\n```\n\nAnd finally, here's how we\
    \ load a sprite sheet.\n\nFrom now on, the sprite sheet is stored somewhere into\
