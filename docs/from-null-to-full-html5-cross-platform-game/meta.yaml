  md: "# Making it run nicely on any mobile device, no matter what the orientation\
    \ is\n\nWe'll make the game look good on any device in two steps: first, we have\
    \ to scale up the game to cover the largest area possible, then we'll make the\
    \ HTML page which hosts the game more mobile friendly.\n\nAbout scaling up the\
    \ game, modify `create` method in `TitleScreen` state:\n\n```\ncreate: function(){\n\
    \    game.scale.pageAlignHorizontally = true;\n    game.scale.pageAlignVertically\
    \ = true;\n    game.scale.scaleMode = Phaser.ScaleManager.SHOW_ALL;\n    game.stage.disableVisibilityChange\
    \ = true;\n    var style = {\n        font: \"48px Monospace\",\n        fill:\
    \ \"#00ff00\",\n        align: \"center\"\n    };\n    ...\n}\n```\n\nLet's examine\
    \ the new lines one by one:\n\n```\ngame.scale.pageAlignHorizontally = true;\n\
    ```\n\nSetting `pageAlignHorizontally` to `true` will horizontally align the game\
    \ in the Parent container or window.\n\n```\ngame.scale.pageAlignVertically =\
    \ true;\n```\n\nSame thing, for vertical alignment\n\n```\ngame.scale.scaleMode\
    \ = Phaser.ScaleManager.SHOW_ALL;\n```\n\n`scaleMode` sets the scaling method\
    \ which in this case with `SHOW_ALL` we show the game at the largest scale possible\
    \ while keeping the original aspect ratio.\n\nThe last thing to do is editing\
    \ `index.html` file to add some meta tags which have"
  merge: -1
  pgno: 63
- img_proc: true
  md: "been specifically created for mobile devices. The new header content is:\n\n\
    ```\n<head>\n    <script type=\"text/javascript\" src=\"phaser.js\"></script>\n\
    \    <script type=\"text/javascript\" src=\"game.js\"></script>\n    <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0,\n        maximum-scale=1.0,\
    \ minimum-scale=1.0, user-scalable=no, minimal-ui\" />\n    <meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\" />\n    <meta name=\"apple-mobile-web-app-status-bar-style\"\
    \ content=\"black\" />\n    <meta name=\"HandheldFriendly\" content=\"true\" />\n\
    \    <meta name=\"mobile-web-app-capable\" content=\"yes\" />\n    <style type=\"\
    text/css\">\n        body{\n            padding:0px;\n            margin:0px;\n\
    \            background: #000;\n        }\n    </style>\n</head>\n```\n\nThere's\
    \ no need to explain these lines as they are standard tags suggested by device\
    \ manufacturers.\n\n![](img/94d5f4f278808ce315dcc02186d68404_64_0.png)\n\nAnd\
    \ now you finally completed the project."
