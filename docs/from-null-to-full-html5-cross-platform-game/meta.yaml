- md: "This is the first custom function we created: it's called `placeTiles`, and\
    \ will be used to place all game tiles.\n\n> In JavaScript, `this` always refers\
    \ to the owner of the function we're executing, or rather, to the object that\
    \ a function is a method of.\n\nUsing this, we have to write `placeTiles` function\
    \ as a method of `playGame` object.\n\nRemember, functions inside objects are\
    \ called methods.\n\nOur function declaration will be placed after `create` method,\
    \ just like we wrote `create` after `preload` a few minutes ago.\n\n```\ncreate:\
    \ function(){\n    this.placeTiles();\n},\nplaceTiles: function(){\n    // function\
    \ code goes here\n}\n```\n\nHere is our `placeTiles` function created.\n\nIt still\
    \ does nothing because there's no code to be executed inside, just a comment.\n\
    \n> In a line of code, everything after `//` is considered a **comment** and is\
    \ not executed by JavaScript. Use comments to keep your source code readable.\n\
    \nAlso, remember to separate the methods inside an object with a comma, or you\
    \ will get an error.\n\nFinally we can write the code inside `placeTiles` to add\
    \ the tiles on the stage:\n\n```\nplaceTiles: function(){\n    for(var i = 0;\
    \ i < numCols; i++){\n        for(var j = 0; j < numRows; j++){\n            game.add.image(i\
    \ * (tileSize + tileSpacing), j * (tileSize + tileSpacing), \"tiles\");\n    \
    \    }\n    }\n}\n```\n\nThere's a lot of new stuff here, so let's start from\
    \ the result.\n\nRun the game, and that's what you will see:\n\n![](img/94d5f4f278808ce315dcc02186d68404_22_0.png)\n\
    \nNow we have all tiles placed in a 4 rows x 5 column grid. That's exactly what\
    \ we wanted. Now let's have a look how we made it possible, analyzing placeTiles\
    \ content line by line:\n\n```\nfor(var i = 0; i < numCols; i++){\n    ...\n}\n\
    ```\n\nThis is the first time you encounter a loop, in this case a for loop. Loops\
    \ can execute a block of code – remember, everything included between curly brackets\
    \ – a given number of times.\n\nThe for loop is executed as long as a specified\
    \ condition is satisfied.\n\nfor loops are handy, if you want to run the same\
    \ code over and over again, each time with a different value. In this example\
    \ the value which changes is that of variable i, ranging from zero to the greatest\
    \ integer number smaller than numCols – that is the number of columns in the stage\
    \ – increasing its value by one at each loop iteration.\n\nHow can I say that?\
    \ Let's analyze the syntax of a `for` loop:\n\n```\nfor (start action; condition;\
    \ recurring action) {\n    code block to be executed\n}\n```\n\n**start action**\
    \ is executed only once before the loop starts, just like it was on the previous\
    \ line.\n\n**condition** defines the condition for running the loop. The loop\
    \ will be executed as long as the condition is satisfied.\n\n**recurring action**\
    \ is executed each time after the loop has been executed.\n\nSo in our case the\
    \ start action is setting `i` variable to zero. The condition is satisfied until\
    \ `i` is less than `numCols`. The recurring action is adding 1 to `i` at the end\
    \ of each iteration.\n\nInside the loop we just analyzed, we have another loop:\n\
    \n```\nfor(var j = 0; j < numRows; j++){\n    ...\n}\n```\n\nThis works according\
    \ to the same concept seen before, it just iterates through rows rather than columns\
    \ and uses variable `j`.\n\nOnce `for` loops have been explained, we can jump\
    \ to the core of this step, that is the line which places the tiles:\n\n```\n\
    game.add.image(i * (tileSize + tileSpacing), j * (tileSize + tileSpacing), \"\
    tiles\");\n```\n\nYou already saw how to place images with `add.image`, the concept\
    \ does not change, it's just we place each image in a different position according\
    \ to `i` and `j` values, which as you should already know change at each loop\
    \ iteration.\n\nAt the end of both loops, we will have all the tiles correctly\
    \ placed on the screen.\n\nAnyway, there is a better way to place tiles: if you\
    \ look how we placed the tiles, you will see the upper left tile is placed next\
    \ to the upper left corner of the stage.\n\nThis is not an error, but the board\
    \ does not look good as it's not centered in the stage.\n\nThat's what we are\
    \ going to do now.\n\n## Adjusting assets placement according to stage size\n\n\
    Placing assets according to game size is really easy, once you know game size.\n\
    \nIf you look at `game` declaration, you can see its width and height are 500\
    \ pixels, but let's suppose we don't know it, or we want to have the freedom to\
    \ modify game size by changing only its declaration, without any further search/replace.\
    \ Phaser gives us some properties to get the width and height of a Phaser `Game`\
    \ instance.\n\n> **A property** of an object is a value associated to a variable\
    \ within the object itself. Usually properties can be read and written, but some\
    \ of them can only be read.\n\nSo we are adding a couple of lines to `placeTiles`\
    \ function:\n\n```\nplaceTiles: function(){\n    var leftSpace = (game.width -\
    \ (numCols * tileSize) - ((numCols - 1) * tileSpacing))/2;\n    var topSpace =\
    \ (game.height - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n  \
    \  for(var i = 0; i < numCols; i++){\n        for(var j = 0; j < numRows; j++){\n\
    \            game.add.image(leftSpace + i * (tileSize + tileSpacing), topSpace\
    \ + j * (tileSize + tileSpacing), \"tiles\");\n        }\n    }\n}\n```\n\nLet's\
    \ have a look at how we determined the value of `leftSpace`, which is basically\
    \ the left offset used to place tiles:\n\n```\nvar leftSpace = (game.width - (numCols\
    \ * tileSize) - ((numCols - 1) * tileSpacing))/2;\n```\n\nWe subtract to game\
    \ width the length of all tiles (numCols * tileSize) and the length of all empty\
    \ spaces between two tiles ((numCols - 1) * tileSpacing) getting the difference\
    \ between game width and the width actually used by the tiles. Dividing this difference\
    \ by two we can find the amount of pixels to move to the left each tile to have\
    \ the board centered on the game stage.\n\n> width and height properties return\
    \ width and height of a Phaser Game instance.\n\nThe same concept applies to vertical\
    \ offset. Launch the game now:\n\n![](img/94d5f4f278808ce315dcc02186d68404_25_0.png)\n\
    \nNow we have our tile board centered in the game stage thanks to two game properties.\n\
    \nAnyway, shouldn't the tiles start as covered, that is showing the question mark?\
    \ It seems we are only able to show the first frame of our sprite sheet.\n\nLet's\
    \ show images properly.\n\n## Displaying given frames in a sprite sheet\n\nBefore\
    \ we start typing some new code, here is how sprite sheet works: each image is\
    \ identified by a number, called **index**, which starts from **zero**.\n\nSo\
    \ starting from the upper left image and proceeding left to right, top to bottom,\
    \ each image is given an index.\n\nThe first image has index \"zero\", the second\
    \ image has index \"one\" and so on, the third has index \"two\" and so on.\n\n\
    If you look at the sprite sheet, the question mark is the 11th image, and it means\
    \ we have to show the 10th frame of the sprite sheet.\n\n> frame property of an\
    \ image object allows us to show the frame we want.\n\nWith just a small change\
    \ to placeTiles function:\n\n```\nplaceTiles: function(){\n    var leftSpace =\
    \ (game.width - (numCols * tileSize) - ((numCols - 1) * tileSpacing))/2;\n   \
    \ var topSpace = (game.height - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n\
    \    for(var i = 0; i < numCols; i++){\n        for(var j = 0; j < numRows; j++){\n\
    \            var tile = game.add.image(leftSpace + i * (tileSize + tileSpacing),\n\
    \                topSpace + j * (tileSize + tileSpacing), \"tiles\");\n      \
    \      tile.frame = 10;\n        }\n    }\n}\n```\n\nWe are able to turn all tiles\
    \ covered with frame property, but first we have to assign the image a variable,\
    \ here called `tile`.\n\nLaunch the game and see what happens:\n\n![](img/94d5f4f278808ce315dcc02186d68404_27_0.png)\n\
    \nTiles now show the question mark, and are ready to be turned to show their actual\
    \ symbol. Now it's time to let the player interact with the game.\n\n## Adding\
    \ interactivity to images by turning them into clickable and touchable buttons\n\
    \nAs you know we are going to build a cross platform game. This means it has to\
    \ run properly on each device, from desktop computers to smart phones and tablets.\n\
    \nUnfortunately, different devices use different ways to let the player interact\
    \ with the game: in our case, on desktop computers players will click on a tile\
    \ with the mouse to select it, while on a smart phone a tile will be selected\
    \ with a touch.\n\nDo we have to check for both mouse clicks and finger touches?\
    \ No, because"
  mdcn: "\n这是我们创建的第一个自定义函数：它叫做 `placeTiles`，将用于放置所有的游戏图块。\n\n> 在 JavaScript 中，`this`\
    \ 始终指向我们正在执行的函数的所有者，或者更准确地说，是指向该函数作为其方法的对象。\n\n因此，我们必须将 `placeTiles` 函数编写为 `playGame`\
    \ 对象的一个方法。\n\n记住，对象内部的函数被称为方法。\n\n我们的函数声明将放在 `create` 方法之后，就像几分钟前我们将 `create`\
    \ 放在 `preload` 之后一样。\n\n```\ncreate: function(){\n    this.placeTiles();\n},\n\
    placeTiles: function(){\n    // 函数代码放在这里\n}\n```\n\n这就是我们创建的 `placeTiles` 函数。\n\
    \n它目前还没有做任何事，因为内部没有可执行的代码，只有一个注释。\n\n> 在一行代码中，`//` 之后的所有内容都被视为 **注释**，不会被 JavaScript\
    \ 执行。使用注释可以保持源代码的可读性。\n\n另外，记住对象内部的方法要用逗号分隔，否则会出错。\n\n最后，我们可以在 `placeTiles` 内部编写代码，将图块添加到舞台上：\n\
    \n```\nplaceTiles: function(){\n    for(var i = 0; i < numCols; i++){\n      \
    \  for(var j = 0; j < numRows; j++){\n            game.add.image(i * (tileSize\
    \ + tileSpacing), j * (tileSize + tileSpacing), \"tiles\");\n        }\n    }\n\
    }\n```\n\n这里有很多新内容，所以我们先从结果开始。\n\n运行游戏，你将看到：\n\n![](img/94d5f4f278808ce315dcc02186d68404_22_0.png)\n\
    \n现在我们所有的图块都放置在一个 4 行 x 5 列的网格中。这正是我们想要的。现在让我们看看这是如何实现的，逐行分析 `placeTiles` 的内容：\n\
    \n```\nfor(var i = 0; i < numCols; i++){\n    ...\n}\n```\n\n这是你第一次遇到循环，具体来说是\
    \ `for` 循环。循环可以执行一段代码——记住，是花括号之间的所有内容——执行指定的次数。\n\n`for` 循环在满足指定条件时执行。\n\n如果你想一遍又一遍地运行相同的代码，每次使用不同的值，`for`\
    \ 循环就非常方便。在这个例子中，变化的值是变量 `i` 的值，范围从零到小于 `numCols` 的最大整数——即舞台的列数——每次循环迭代增加一个值。\n\
    \n我怎么说的呢？让我们分析一下 `for` 循环的语法：\n\n```\nfor (start action; condition; recurring\
    \ action) {\n    要执行的代码块\n}\n```\n\n**start action** 仅在循环开始前执行一次，就像它在前面那一行一样。\n\
    \n**condition** 定义了运行循环的条件。只要条件满足，循环就会执行。\n\n**recurring action** 在每次循环执行后执行。\n\
    \n所以在我们的情况下，启动操作是将变量 `i` 设置为零。条件在 `i` 小于 `numCols` 时满足。重复操作是在每次迭代结束时将 `i` 加 1。\n\
    \n在我们刚刚分析的循环内部，还有另一个循环：\n\n```\nfor(var j = 0; j < numRows; j++){\n    ...\n}\n\
    ```\n\n这与前面看到的概念相同，只是它迭代的是行而不是列，并使用变量 `j`。\n\n一旦 `for` 循环解释完毕，我们就可以跳到本步骤的核心，即放置图块的那一行：\n\
    \n```\ngame.add.image(i * (tileSize + tileSpacing), j * (tileSize + tileSpacing),\
    \ \"tiles\");\n```\n\n你已经看过如何使用 `add.image` 放置图像，概念没有改变，只是我们根据 `i` 和 `j` 的值将每张图像放置在不同的位置，你应该知道这些值在每次循环迭代时都会改变。\n\
    \n在两个循环结束时，所有的图块都会正确地放置在屏幕上。\n\n不过，有一种更好的方法来放置图块：如果你看看我们是如何放置图块的，你会发现左上角的图块紧挨着舞台的左上角。\n\
    \n这不是一个错误，但棋盘看起来不太好，因为它没有在舞台中居中。\n\n这就是我们现在要做的事情。\n\n## 根据舞台大小调整资源放置\n\n一旦你知道了游戏大小，根据游戏大小放置资源就非常容易。\n\
    \n如果你查看 `game` 声明，你可以看到它的宽度和高度是 500 像素，但让我们假设我们不知道它，或者我们希望拥有通过仅更改其声明来修改游戏大小的自由，而无需进行任何进一步的搜索/替换。Phaser\
    \ 给我们提供了一些属性来获取 Phaser `Game` 实例的宽度和高度。\n\n> 对象的 **属性** 是与对象内部变量相关联的值。通常属性可以被读取和写入，但有些只能被读取。\n\
    \n所以我们在 `placeTiles` 函数中添加几行代码：\n\n```\nplaceTiles: function(){\n    var leftSpace\
    \ = (game.width - (numCols * tileSize) - ((numCols - 1) * tileSpacing))/2;\n \
    \   var topSpace = (game.height - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n\
    \    for(var i = 0; i < numCols; i++){\n        for(var j = 0; j < numRows; j++){\n\
    \            game.add.image(leftSpace + i * (tileSize + tileSpacing), topSpace\
    \ + j * (tileSize + tileSpacing), \"tiles\");\n        }\n    }\n}\n```\n\n让我们看看我们是如何确定\
    \ `leftSpace` 的值的，这基本上是用于放置图块的左偏移量：\n\n```\nvar leftSpace = (game.width - (numCols\
    \ * tileSize) - ((numCols - 1) * tileSpacing))/2;\n```\n\n我们用游戏宽度减去所有图块的长度（numCols\
    \ * tileSize）和所有图块之间空白区域的长度（(numCols - 1) * tileSpacing），得到游戏宽度与图块实际使用宽度之间的差值。将此差值除以二，我们就可以得到将每个图块向左移动多少像素可以使棋盘在游戏舞台中居中。\n\
    \n> width 和 height 属性返回 Phaser Game 实例的宽度和高度。\n\n同样的概念也适用于垂直偏移。现在启动游戏：\n\n![](img/94d5f4f278808ce315dcc02186d68404_25_0.png)\n\
    \n现在我们的图块棋盘在游戏舞台中居中了，这要归功于这两个游戏属性。\n\n不过，图块不应该一开始就被覆盖，即显示问号吗？看起来我们只能显示精灵表的第一帧。\n\
    \n让我们正确地显示图像。\n\n## 显示精灵表中给定的帧\n\n在我们开始输入一些新代码之前，这里是精灵表的工作原理：每张图像由一个数字标识，称为 **索引**，它从\
    \ **零** 开始。\n\n所以从左上角的图像开始，从左到右，从上到下，每张图像都有一个索引。\n\n第一张图像的索引是“零”，第二张是“一”，以此类推，第三张是“二”，等等。\n\
    \n如果你查看精灵表，问号是第 11 张图像，这意味着我们必须显示精灵表的第 10 帧。\n\n> 图像对象的 frame 属性允许我们显示我们想要的帧。\n\
    \n只需对 `placeTiles` 函数进行一点小改动：\n\n```\nplaceTiles: function(){\n    var leftSpace\
    \ = (game.width - (numCols * tileSize) - ((numCols - 1) * tileSpacing))/2;\n \
    \   var topSpace = (game.height - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n\
    \    for(var i = 0; i < numCols; i++){\n        for(var j = 0; j < numRows; j++){\n\
    \            var tile = game.add.image(leftSpace + i * (tileSize + tileSpacing),\n\
    \                topSpace + j * (tileSize + tileSpacing), \"tiles\");\n      \
    \      tile.frame = 10;\n        }\n    }\n}\n```\n\n我们能够使用 frame 属性将所有图块设置为覆盖状态，但首先我们必须将图像赋值给一个变量，这里叫做\
    \ `tile`。\n\n启动游戏，看看会发生什么：\n\n![](img/94d5f4f278808ce315dcc02186d68404_27_0.png)\n\
    \n图块现在显示问号，并准备好翻转以显示它们的实际符号。现在是时候让玩家与游戏互动了。\n\n## 通过将图像转变为可点击和可触摸的按钮来添加交互性\n\n\
    如你所知，我们将构建一个跨平台游戏。这意味着它必须在从台式电脑到智能手机和平板电脑的每种设备上正常运行。\n\n不幸的是，不同的设备使用不同的方式让玩家与游戏互动：在我们的例子中，在台式电脑上，玩家将使用鼠标单击图块来选择它，而在智能手机上，图块将通过触摸来选择。\n\
    \n我们必须检查鼠标点击和手指触摸吗？不，因为\n"
