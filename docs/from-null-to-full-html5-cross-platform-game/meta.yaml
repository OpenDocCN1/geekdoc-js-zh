  - '[PAGE 29]


    From null to full HTML5 cross-platform game


    showing a message in the console.

    Run the game, click on any tile and see what happens:


    ![](img/94d5f4f278808ce315dcc02186d68404_29_0.png)


    Thanks to Phaser, turning an image into an interactive element was really easy,
    but now a difficult task awaits us: we have to turn a button into something more
    complex. Since each button represents a tile, we will need to store the value
    of each tile – which is the symbol to be shown when we turn it – somewhere.


    # Giving each button a custom property and accessing it when touched/clicked


    Before we continue interacting with tiles and buttons, we have to store somewhere
    all tile values. And above all, assign each tile a value which will represent
    its image.


    Since we have 10 different types of tiles, each tile type can easily be coded
    with a number ranging from 0 to 9. Also, having two tiles for each type, the numeric
    representation of all tiles will be: 0, 0, 1, 1, 2 … 8, 8, 9, 9.'
