    this.timeText.anchor.set(0, 1);\n```\n\n这次 `anchor.set(0, 1)` 意味着锚点位于**左下角**。\n\
    \n我想让你看的第二行是处理计时器的那一行。\n\n```javascript\ngame.time.events.loop(Phaser.Timer.SECOND,\
    \ this.decreaseTime, this);\n```\n\n这次我们处理的不是只运行一次的计时器，而是一个循环。\n\n> `time.events.loop(delay,\
    \ callback, callbackContext)` 添加一个循环事件，该事件将永远重复，直到被停止。它会在 `callbackContext` 上下文中调用\
    \ `callback` 函数。\n\n让我们来看看名为 `decreaseTime` 的回调函数：\n\n```javascript\ndecreaseTime:\
    \ function(){\n    timeLeft --;\n    this.timeText.text = \"Time left: \" + timeLeft;\n\
    }\n```\n\n它减少计时器，然后更新显示剩余时间的文本。运行游戏：\n\n![](img/94d5f4f278808ce315dcc02186d68404_56_0.png)\n\
    \n有一个计时器很好，但如果时间耗尽后什么也没发生，那就相当没用了。\n\n## 时间耗尽时显示游戏结束画面\n\n当玩家时间耗尽时，我们需要停止游戏并显示一个游戏结束画面。我们如何制作游戏结束画面？\n\
    \n没错，用另一个状态。\n\n```javascript\ngame.state.add(\"TitleScreen\", titleScreen);\n\
    game.state.add(\"PlayGame\", playGame);\ngame.state.add(\"GameOver\", gameOver);\n\
    game.state.start(\"TitleScreen\");\n```\n\n一旦状态被添加到游戏中，我们将在计时器到达零时调用它。看看 `decreaseTime`\
    \ 方法：\n\n```javascript\ndecreaseTime: function(){\n    timeLeft --;\n    this.timeText.text\
    \ = \"Time left: \" + timeLeft;\n    if(timeLeft == 0){\n        game.state.start(\"\
    GameOver\");\n    }\n}\n```\n\n现在只需构建新状态，包括 \"Game Over\" 文本、分数和点击重新开始的提示。下面的代码中没有什么新内容。\n\
    \n```javascript\nvar gameOver = function(game){}\ngameOver.prototype = {\n   \
    \ create: function(){\n        var style = {\n            font: \"32px Monospace\"\
    ,\n            fill: \"#00ff00\",\n            align: \"center\"\n        }\n\
    \        var text = game.add.text(game.width / 2, game.height / 2, \"Game Over\\\
    n\\nYour score: \" + score + \"\\n\\nTap to restart\", style);\n        text.anchor.set(0.5);\n\
    \    }\n}\n```\n\n玩游戏，一分钟后你应该会看到类似这样的画面：\n\n![](img/94d5f4f278808ce315dcc02186d68404_58_0.png)\n\
    \n好的，现在点击重新开始。你无法做到。我们还得再写几行代码。\n\n## 重新开始游戏\n\n到目前为止，我们学习了如何检测按钮上的点击/触摸，但这次舞台上没有按钮。\n\
    \n我们需要触发一个通用的点击/触摸。\n\n就像 Phaser 处理按钮上的通用输入一样，它也处理通用输入事件。\n\n看看这些新的改动：\n\n## 从零到完整的\
    \ HTML5 跨平台游戏\n\n```javascript\ngameOver.prototype = {\n    create: function(){\n\
    \        var style = {\n            font: \"32px Monospace\",\n            fill:\
    \ \"#00ff00\",\n            align: \"center\"\n        }\n        var text = game.add.text(game.width\
    \ / 2, game.height / 2, \"Game Over\\n\\nYour score: \" + score + \"\\n\\nTap\
    \ to restart\", style);\n        text.anchor.set(0.5);\n        game.input.onDown.add(this.restartGame,\
    \ this);\n    },\n    restartGame: function(){\n        tilesArray.length = 0;\n\
    \        selectedArray.length = 0;\n        game.state.start(\"TitleScreen\");\n\
    \    }\n}\n```\n\n除了 `restartGame` 函数（它只是在清空数组后通过调用 `TitleScreen` 状态来重新开始游戏）之外，我想让你关注这一行：\n\
    \n```javascript\ngame.input.onDown.add(this.restartGame, this);\n```\n\n无论你在屏幕的哪里点击或触摸，`restartGame`\
    \ 方法都会被调用。\n\n> `input.onDown(callback, callbackContext)` 每次按下指针时触发。它在 `callbackContext`\
    \ 上下文中运行 `callback` 函数。\n\n最后，游戏完成了。不过，如果你在时间耗尽前移除了所有方块会发生什么？你会发现自己看着一个黑屏，而计时器仍在滴答作响，你却什么都做不了。\n\
    \n这就是我们要添加另一个功能的原因。这是这个游戏的最后一个功能。\n\n## 给游戏增加转折\n\n当所有方块都被移除但还有剩余时间时，我们必须给玩家一些事做。\n\
    \n听听这个想法：如果你在时间耗尽前移除了所有方块，另一组方块会放置在屏幕上，这样你就可以通过进行更多匹配来提高分数。\n\n为了奖励你成功匹配，每次匹配你将获得**两秒额外时间**。\n\
    \n这听起来复杂吗？\n\n你还没意识到使用 Phaser 时没有什么复杂的吗？\n\n让我们创建一个新变量，它会告知我们棋盘上还有多少方块剩余。\n\n\
    我们将其命名为 `tilesLeft`。\n\n```javascript\nvar tileSize = 80;\nvar numRows = 4number\
    \ of rows?\nvar numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar\
    \ selectedArray = [];\nvar playSound;\nvar score;\nvar timeLeft;\nvar tilesLeft;\n\
    var game = new Phaser.Game(500, 500);\n```\n\n当方块显示在屏幕上时，`tilesLeft` 被设置为游戏中方块的完整数量，即\
    \ `numRows * numCols`。\n\n```javascript\nplaceTiles: function(){\n    tilesLeft\
    \ = numRows * numCols;\n    ...\n}\n```\n\n剩余的代码都要放在 `checkTiles` 方法中。\n\n当玩家成功匹配时，我们将\
    \ `timeLeft` 增加 2，实际上是给游戏增加两秒钟，并更新 `timeText` 文本。\n\n同时，我们将剩余方块数量减少两个。\n\n一旦桌面上没有方块剩余，我们清空数组并调用\
    \ `placeTiles` 函数再放置另一组方块。这将允许玩家继续游戏。\n\n```javascript\ncheckTiles: function(){\n\
    \    if(selectedArray[0].value == selectedArray[1].value){\n        if(playSound){\n\
    \            this.soundArray[1].play();\n        }\n        score ++;\n      \
    \  timeLeft +=2;\n        this.timeText.text = \"Time left: \" + timeLeft;\n \
    \       this.scoreText.text = \"Score: \" + score;\n        selectedArray[0].destroy();\n\
    \        selectedArray[1].destroy();\n        tilesLeft -= 2;\n        if(tilesLeft\
    \ == 0){\n            tilesArray.length = 0;\n            selectedArray.length\
    \ = 0;\n            this.placeTiles();\n        }\n    }\n    else{\n        if(playSound){\n\
    \            this.soundArray[2].play();\n        }\n        selectedArray[0].frame\
    \ = 10;\n        selectedArray[1].frame = 10;\n    }\n    selectedArray.length\
    \ = 0;\n}\n```\n\n这段代码中没有新内容，只有你在本书中已经学过的概念。\n\n我只想评论这些会让棋盘在玩家移除所有方块时重新填满的代码：\n\
    \n```javascript\nif(tilesLeft == 0){\n    tilesArray.length = 0;\n    selectedArray.length\
    \ = 0;\n    this.placeTiles();\n}\n```\n\n我们检查 `tilesLeft` 是否为零，如果是，我们清空 `tilesArray`\
    \ 数组和 `selectedArray` 数组，然后调用 `placeTiles` 方法将所有方块重新放置在棋盘上。\n\n运行游戏并尝试在时间耗尽前清空棋盘，你会看到游戏重新开始。你能清空两次棋盘吗？\n"
