- md: "## From null to full HTML5 cross-platform game\n\nPhaser handles everything\
    \ internally, letting us focus on the game itself.\n\nTo give tiles the capability\
    \ of being clicked or touched, we have to turn them into buttons.\n\nTime to edit\
    \ `placeTiles` function once more:\n\n```javascript\nplaceTiles: function(){\n\
    \    var leftSpace = (game.width - (numCols * tileSize) - ((numCols - 1) *\n \
    \   tileSpacing))/2;\n    var topSpace = (game.height - (numRows * tileSize) -\
    \ ((numRows - 1) *\n    tileSpacing))/2;\n    for(var i = 0; i < numCols; i++){\n\
    \        for(var j = 0; j < numRows; j++){\n            var tile = game.add.button(leftSpace\
    \ + i * (tileSize +\n            tileSpacing), topSpace + j * (tileSize + tileSpacing),\
    \ \"tiles\",\n            this.showTile, this);\n            tile.frame = 10;\n\
    \        }\n    }\n}\n```\n\nWhen you use a button rather than an image, interactivity\
    \ is automatically added by Phaser.\n\n`add.button(x, y, key, callback, callbackContext)`\
    \ adds a button at coordinates (x,y) using the image stored with `key` value.\
    \ `callback` is the function to call when the button is pressed. `callbackContext`\
    \ is the context in which the callback will be called, is usually `this` because\
    \ it's a reference to the object that owns the currently executing code.\n\nLooking\
    \ at the syntax of button creation, you can see we have to add a function called\
    \ `showTile`, and the presence of `this` suggests it's another method of `playGame`\
    \ object.\n\n```javascript\nPlaceTiles: function(){\n    ...\n},\nshowTile: function(){\n\
    \    console.log(\"show me!\");\n}\n```\n\nWe don't want `showTile` function to\
    \ do that much at the moment, so we are just showing a message in the console.\
    \ Run the game, click on any tile and see what happens:\n\n![Game screenshot](img/94d5f4f278808ce315dcc02186d68404_29_0.png)\n\
    \nThanks to Phaser, turning an image into an interactive element was really easy,\
    \ but now a difficult task awaits us: we have to turn a button into something\
    \ more complex. Since each button represents a tile, we will need to store the\
    \ value of each tile – which is the symbol to be shown when we turn it – somewhere.\n\
    \n## Giving each button a custom property and accessing it when touched/clicked\n\
    \nBefore we continue interacting with tiles and buttons, we have to store somewhere\
    \ all tile values. And above all, assign each tile a value which will represent\
    \ its image.\n\nSince we have 10 different types of tiles, each tile type can\
    \ easily be coded with a number ranging from 0 to 9. Also, having two tiles for\
    \ each type, the numeric representation of all tiles will be: 0, 0, 1, 1, 2 …\
    \ 8, 8, 9, 9. Where to store these values? In an array.\n\n> An **array** is a\
    \ special variable, which can hold more than one value at a time, under a single\
    \ variable name, and you can access the values by referring to an index number.\n\
    \nYou will master arrays in a couple of minutes, at the moment let's create a\
    \ new variable called `tilesArray` which will store all tiles information. At\
    \ the beginning it will be an empty array, which we will populate later in the\
    \ code.\n\n```javascript\nvar tileSize = 80;\nvar numRows = 4;\nvar numCols =\
    \ 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar game = new Phaser.Game(500,\
    \ 500);\n```\n\n`tilesArray` will now be populated with tile values as mentioned\
    \ above.\n\n> **Empty arrays** are defined with open/close square brackets [].\n\
    \nPopulate the array and assign a custom property to tiles changing `placeTiles`:\n\
    \n```javascript\nplaceTiles: function(){\n    var leftSpace = (game.width - (numCols\
    \ * tileSize) - ((numCols - 1) * tileSpacing))/2;\n    var topSpace = (game.height\
    \ - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n    for(var i =\
    \ 0; i < numRows * numCols; i++){\n        tilesArray.push(Math.floor(i / 2));\n\
    \    }\n    console.log(\"my tile values: \" + tilesArray);\n    for(i = 0; i\
    \ < numCols; i++){\n        for(j = 0; j < numRows; j++){\n            var tile\
    \ = game.add.button(leftSpace + i * (tileSize + tileSpacing), topSpace + j * (tileSize\
    \ + tileSpacing),\n                \"tiles\", this.showTile, this);\n        \
    \    tile.frame = 10;\n            tile.value = tilesArray[j * numCols + i];\n\
    \        }\n    }\n}\n```\n\nAs you can see, the function has been modified with\
    \ some new code: there's a new `for` loop at the beginning, something changed\
    \ in the loop which iterates through columns and there's a new line near the end\
    \ of the function. Let's examine in detail what changed:\n\n```javascript\nfor(var\
    \ i = 0; i < numRows * numCols; i++){\n    tilesArray.push(Math.floor(i / 2));\n\
    }\n```\n\nThis is a `for` loop – you should already be familiar with it – which\
    \ iterates for `numRows * numCols` times, that is the total amount of tiles.\n\
    \n**`push` adds new items to the end of an array.**\n\nAt each iteration, `push`\
    \ method adds a new item to the end of `tilesArray` adding zero, then zero again,\
    \ then one, then one again until a couple of nines.\n\n**`Math.floor` rounds a\
    \ number downward to its nearest integer.**\n\nJust to figure out what `tilesArray`\
    \ contains at this time, let's output its content to browser console:\n\n```javascript\n\
    console.log(\"my tile values: \" + tilesArray);\n```\n\nNow, let's see the start\
    \ action of next loop:\n\n```javascript\nfor(i = 0; i < numCols; i++){\n    ...\n\
    }\n```\n\nNow it's `i = 0` rather than `var i = 0`. Why? Because you have already\
    \ declared `i` variable in the previous loop inside the same function. You only\
    \ need to declare a variable once.\n\n```javascript\ntile.value = tilesArray[j\
    \ * numCols + i];\n```\n\nAnd finally we can give each tile its proper value.\
    \ `value` isn't a built-in property of `tile` object, it's just a custom variable\
    \ we are assigning to `tile`. In other words, we are storing each tile value somewhere\
    \ inside the tile itself. Somewhere, but exactly where? Inside `value` property.\n\
    \n> You **access an array element** with index i by including the index between\
    \ square brackets. The array element with index 0 – the first element – is accessed\
    \ with `[0]`.\n\nThis way, the first tile placed will have `value` property equal\
    \ to the first array element, that is `tilesArray[0]`, the second tile placed\
    \ will have `value` property equal to the second array element, that is `tilesArray[1]`,\
    \ and so on.\n\nAre you ready for a test drive? Let's change `showTile` function\
    \ this way:\n\n```javascript\nshowTile: function(target){\n    console.log(\"\
    this tile has value = \" + target.value);\n}\n```\n\nThe button which is clicked/touched\
    \ is passed in `showTile` function as an argument called `target`, then we access\
    \ to its `value` property, which we previously set. Run the game and select some\
    \ tiles to see their values in the console window:\n\n![Console output](img/94d5f4f278808ce315dcc02186d68404_32_0.png)\n\
    \nEverything seems to work the right way, at least behind the curtains. Actually,\
    \ players won't see the values of the tiles they select.\n\n## Showing tiles once\
    \ selected\n\nTo give players a visual feedback of the tiles they select, we need\
    \ to change their frame according to their value once selected. We know each tile\
    \ value since it's stored in `value` custom property, so we only need to change\
    \ its frame when selected. Here is the one and only line we have to write to make\
    \ this happen:\n\n```javascript\nshowTile: function(target){\n    target.frame\
    \ = target.value;\n}\n```\n\nDo you remember `frame` property? That's all we need\
    \ to show actual tile content. Run the game, select tiles and see their contents.\n\
    \n![Tile selection](img/94d5f4f278808ce315dcc02186d68404_33_0.png)\n\nThis is\
    \ a great step further in the making of the game, but it's not enough, as at the\
    \ moment you are able to select how many tiles as you want, while in the original\
    \ game you must select only two tiles each turn. We need a way to allow the player\
    \ to select only two tiles.\n\n## Preventing the player to select more than two\
    \ tiles each turn\n\nAs said, not only we have to let the player select only two\
    \ tiles, but we also have to prevent the same tile from being selected twice.\
    \ A selected tile can't be selected again. Moreover, we must store selected tiles\
    \ somewhere, as later in the development of the game we must check if tile symbols\
    \ match.\n\nFirst things first, let's create a new variable, an array which will\
    \ store selected tiles. We will call it `selectedArray`, and it will start as\
    \ an empty array:\n\n```javascript\nvar tileSize = 80;\nvar numRows = 4;\nvar\
    \ numCols = 5;\nvar tileSpacing = 10;\nvar tilesArray = [];\nvar selectedArray\
    \ = [];\nvar game = new Phaser.Game(500, 500);\n```\n\nNow, we said `selectedArray`\
    \ will contain selected tiles, so it means we have to add tiles in it once they\
    \ are selected by the player. But according to game rules, before inserting a\
    \ new tile in the array we have to check if the player hasn't already selected\
    \ two tiles and the currently selected tile hasn't been already selected.\n\n\
    This may sound complicated, but can be achieved in only two lines of code added\
    \ to `showTile` function:\n\n```javascript\nshowTile: function(target){\n    if(selectedArray.length\
    \ < 2 && selectedArray.indexOf(target) == -1){\n        target.frame = target.value;\n\
    \        selectedArray.push(target);\n    }\n}\n```\n\nRun the game, and you'll\
    \ see you won't be able to select more than two different tiles."
  mdcn: "\n## 从零开始打造全 HTML5 跨平台游戏\n\nPhaser 在内部处理一切事务，让我们可以专注于游戏本身。\n\n要让瓦片具备被点击或触摸的能力，我们需要将它们变成按钮。\n\
    \n是时候再次编辑 `placeTiles` 函数了：\n\n```javascript\nplaceTiles: function(){\n    var\
    \ leftSpace = (game.width - (numCols * tileSize) - ((numCols - 1) *\n    tileSpacing))/2;\n\
    \    var topSpace = (game.height - (numRows * tileSize) - ((numRows - 1) *\n \
    \   tileSpacing))/2;\n    for(var i = 0; i < numCols; i++){\n        for(var j\
    \ = 0; j < numRows; j++){\n            var tile = game.add.button(leftSpace +\
    \ i * (tileSize +\n            tileSpacing), topSpace + j * (tileSize + tileSpacing),\
    \ \"tiles\",\n            this.showTile, this);\n            tile.frame = 10;\n\
    \        }\n    }\n}\n```\n\n当你使用按钮而不是图片时，Phaser 会自动为其添加交互性。\n\n`add.button(x,\
    \ y, key, callback, callbackContext)` 使用以 `key` 值存储的图片，在坐标 (x,y) 处添加一个按钮。`callback`\
    \ 是按钮被按下时要调用的函数。`callbackContext` 是回调函数将被调用时的上下文，通常是 `this`，因为它是对拥有当前执行代码的对象的引用。\n\
    \n查看创建按钮的语法，你会发现我们需要添加一个名为 `showTile` 的函数，而 `this` 的存在表明它是 `playGame` 对象的另一个方法。\n\
    \n```javascript\nPlaceTiles: function(){\n    ...\n},\nshowTile: function(){\n\
    \    console.log(\"show me!\");\n}\n```\n\n目前我们不想让 `showTile` 函数做太多事情，所以只是在控制台显示一条消息。运行游戏，点击任意瓦片，看看会发生什么：\n\
    \n![游戏截图](img/94d5f4f278808ce315dcc02186d68404_29_0.png)\n\n多亏了 Phaser，将图片变成交互元素变得非常容易，但现在一个艰巨的任务在等待着我们：我们必须将按钮变成更复杂的东西。由于每个按钮代表一个瓦片，我们需要存储每个瓦片的值——即翻转时显示的符号——在某个地方。\n\
    \n## 为每个按钮添加自定义属性，并在被触摸/点击时访问它\n\n在我们继续与瓦片和按钮交互之前，我们需要在某个地方存储所有瓦片的值。最重要的是，为每个瓦片分配一个值，该值将代表其图像。\n\
    \n由于我们有 10 种不同的瓦片类型，每种瓦片类型可以很容易地用一个从 0 到 9 的数字编码。此外，每种类型有两张瓦片，所以所有瓦片的数字表示将是：0,\
    \ 0, 1, 1, 2 … 8, 8, 9, 9。在哪里存储这些值呢？在数组中。\n\n> **数组（array）** 是一种特殊的变量，它可以在单个变量名下同时保存多个值，你可以通过索引编号来访问这些值。\n\
    \n你将在几分钟内掌握数组，目前让我们创建一个名为 `tilesArray` 的新变量，它将存储所有瓦片信息。最初它将是一个空数组，稍后我们将在代码中填充它。\n\
    \n```javascript\nvar tileSize = 80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing\
    \ = 10;\nvar tilesArray = [];\nvar game = new Phaser.Game(500, 500);\n```\n\n\
    `tilesArray` 现在将如上所述填充瓦片值。\n\n> **空数组** 用开合方括号 [] 定义。\n\n填充数组并为瓦片分配自定义属性，修改 `placeTiles`：\n\
    \n```javascript\nplaceTiles: function(){\n    var leftSpace = (game.width - (numCols\
    \ * tileSize) - ((numCols - 1) * tileSpacing))/2;\n    var topSpace = (game.height\
    \ - (numRows * tileSize) - ((numRows - 1) * tileSpacing))/2;\n    for(var i =\
    \ 0; i < numRows * numCols; i++){\n        tilesArray.push(Math.floor(i / 2));\n\
    \    }\n    console.log(\"my tile values: \" + tilesArray);\n    for(i = 0; i\
    \ < numCols; i++){\n        for(j = 0; j < numRows; j++){\n            var tile\
    \ = game.add.button(leftSpace + i * (tileSize + tileSpacing), topSpace + j * (tileSize\
    \ + tileSpacing),\n                \"tiles\", this.showTile, this);\n        \
    \    tile.frame = 10;\n            tile.value = tilesArray[j * numCols + i];\n\
    \        }\n    }\n}\n```\n\n如你所见，该函数已用一些新代码进行了修改：开头有一个新的 `for` 循环，遍历列的循环中有一些变化，函数末尾附近有一行新代码。让我们详细检查发生了什么变化：\n\
    \n```javascript\nfor(var i = 0; i < numRows * numCols; i++){\n    tilesArray.push(Math.floor(i\
    \ / 2));\n}\n```\n\n这是一个 `for` 循环——你应该已经熟悉它了——它迭代 `numRows * numCols` 次，即瓦片的总数。\n\
    \n**`push` 将新项添加到数组的末尾。**\n\n在每次迭代中，`push` 方法向 `tilesArray` 的末尾添加一个新项，先添加零，然后是零，然后是一，然后再是一，直到一对九。\n\
    \n**`Math.floor` 将数字向下取整到最接近的整数。**\n\n为了了解此时 `tilesArray` 包含什么内容，让我们将其内容输出到浏览器控制台：\n\
    \n```javascript\nconsole.log(\"my tile values: \" + tilesArray);\n```\n\n现在，让我们看看下一个循环的开始：\n\
    \n```javascript\nfor(i = 0; i < numCols; i++){\n    ...\n}\n```\n\n现在是 `i = 0`\
    \ 而不是 `var i = 0`。为什么？因为你在同一函数内的前一个循环中已经声明了 `i` 变量。你只需要声明一次变量。\n\n```javascript\n\
    tile.value = tilesArray[j * numCols + i];\n```\n\n最后我们可以给每个瓦片赋予其适当的值。`value` 不是\
    \ `tile` 对象的内置属性，它只是我们分配给 `tile` 的自定义变量。换句话说，我们将每个瓦片的值存储在瓦片自身内部的某个地方。某个地方，但具体在哪里？在\
    \ `value` 属性中。\n\n> 你可以通过将索引用方括号括起来 **访问数组元素** i。索引为 0 的数组元素——第一个元素——通过 `[0]`\
    \ 访问。\n\n这样，放置的第一个瓦片将具有等于第一个数组元素的 `value` 属性，即 `tilesArray[0]`，放置的第二个瓦片将具有等于第二个数组元素的\
    \ `value` 属性，即 `tilesArray[1]`，依此类推。\n\n准备好试用了吗？让我们这样修改 `showTile` 函数：\n\n```javascript\n\
    showTile: function(target){\n    console.log(\"this tile has value = \" + target.value);\n\
    }\n```\n\n被点击/触摸的按钮作为名为 `target` 的参数传递给 `showTile` 函数，然后我们访问其 `value` 属性，这是我们之前设置的。运行游戏并选择一些瓦片，在控制台窗口中查看它们的值：\n\
    \n![控制台输出](img/94d5f4f278808ce315dcc02186d68404_32_0.png)\n\n一切似乎都按正确的方式工作，至少在幕后。实际上，玩家不会看到他们选择的瓦片的值。\n\
    \n## 选中后显示瓦片\n\n为了给玩家提供他们所选瓦片的视觉反馈，我们需要在选中时根据瓦片的值改变其帧。我们知道每个瓦片的值，因为它存储在 `value`\
    \ 自定义属性中，所以我们只需要在选中时改变其帧。这是我们需要写的唯一一行代码来实现这一点：\n\n```javascript\nshowTile: function(target){\n\
    \    target.frame = target.value;\n}\n```\n\n你还记得 `frame` 属性吗？这就是我们显示实际瓦片内容所需的全部。运行游戏，选择瓦片并查看它们的内容。\n\
    \n![瓦片选择](img/94d5f4f278808ce315dcc02186d68404_33_0.png)\n\n这是游戏制作中的巨大进步，但还不够，因为目前你可以选择任意数量的瓦片，而在原始游戏中，每回合你必须只选择两张瓦片。我们需要一种方法让玩家只选择两张瓦片。\n\
    \n## 防止玩家每回合选择超过两张瓦片\n\n如前所述，我们不仅要让玩家只选择两张瓦片，还要防止同一张瓦片被选择两次。已选中的瓦片不能再被选中。此外，我们必须将选中的瓦片存储在某个地方，因为在游戏的后续开发中，我们必须检查瓦片符号是否匹配。\n\
    \n首先，让我们创建一个新变量，一个将存储选中瓦片的数组。我们将称它为 `selectedArray`，它将从一个空数组开始：\n\n```javascript\n\
    var tileSize = 80;\nvar numRows = 4;\nvar numCols = 5;\nvar tileSpacing = 10;\n\
    var tilesArray = [];\nvar selectedArray = [];\nvar game = new Phaser.Game(500,\
    \ 500);\n```\n\n现在，我们说过 `selectedArray` 将包含选中的瓦片，所以这意味着当玩家选中瓦片后，我们必须将瓦片添加到其中。但根据游戏规则，在将新瓦片插入数组之前，我们必须检查玩家是否已经选择了两张瓦片，以及当前选中的瓦片是否已被选中。\n\
    \n这听起来可能很复杂，但只需在 `showTile` 函数中添加两行代码即可实现：\n\n```javascript\nshowTile: function(target){\n\
    \    if(selectedArray.length < 2 && selectedArray.indexOf(target) == -1){\n  \
    \      target.frame = target.value;\n        selectedArray.push(target);\n   \
    \ }\n}\n```\n\n运行游戏，你会发现你无法选择超过两张不同的瓦片。\n"
