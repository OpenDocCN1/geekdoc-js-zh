    is ready to be executed, so we can run the function.


    > A JavaScript **function** is a block of code designed to perform a particular
    task, executed when "something" invokes it. When you make something to execute
    a function, we say you **call** the function.


    Inside the function there''s only one line:


    ```

    var game = new Phaser.Game(500, 500);

    ```


    This is where everything begins.


    > A function can contain any number of lines, and we use **curly brackets**, {
    and } to define the start and the end of a function, or more in general, the start
    and the end of a block of code.


    `Game` object will be the game itself. The two numbers inside the parentheses
    represent respectively the width and the height of the game, in pixels. `Game`
    object is assigned to a variable called `game`.


    > A JavaScript **variable** is a container for storing data values. When you create
    a variable we say you **declare** a variable, using the `var` keyword. You assign
    a value to a variable with = operator.


    Translating what we done in English, it means “once the entire document has been
    loaded, create a new `Game` object with a width and height of 500 pixels and assign
    it to a variable called `game`.”


    > A JavaScript **object** is a particular kind of variable which can contain many
    values.


    Well, this is our first Phaser game, so let''s run it and see what happens.'
