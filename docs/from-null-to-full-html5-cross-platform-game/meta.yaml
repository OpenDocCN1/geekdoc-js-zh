    \n> In JavaScript, variables are only recognized inside their functions, and in\
    \ functions inside their functions. Variables are created when a function starts,\
    \ and deleted when the function is completed. The part of a script where a variable\
    \ is recognized is called **scope**.\n\nNow, it's time to introduce another Phaser\
