  md: "displayed, we add a new variable to show the remaining time.\n\n```\nplayGame.prototype\
    \ = {\n    scoreText: null,\n    timeText: null,\n    soundArray: [],\n    ...\n\
    }\n```\n\nAnd when we initialize the game, we set the time limit to 60, which\
    \ means you'll have to complete the game in a minute.\n\nThere's no need to explain\
    \ you how to create the text which will show the remaining time:\n\n```\ncreate:\
    \ function(){\n    score = 0;\n    timeLeft = 60;\n    this.placeTiles();\n  \
    \  if(playSound){\n        this.soundArray[0] = game.add.audio(\"select\", 1);\n\
    \        this.soundArray[1] = game.add.audio(\"right\", 1);\n        this.soundArray[2]\
    \ = game.add.audio(\"wrong\", 1);\n    }\n    var style = {\n        font: \"\
