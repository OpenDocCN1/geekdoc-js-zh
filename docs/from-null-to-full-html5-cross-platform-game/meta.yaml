    \ why we are going to add another feature. The last one, in this game.\n\n## Giving\
    \ the game a twist\n\nWe have to give the player something to do when all tiles\
    \ have been removed and there's still time to play.\n\nListen to this idea: if\
    \ you removed all tiles before the time runs out, another set of tiles is placed\
    \ on the screen, so you can increase your score by making more matches.\n\nTo\
    \ reward you for successful matches, you will be awarded with two extra seconds\
    \ at each match.\n\nDoes it sound complicated?\n\nDidn't you realize yet there's\
    \ nothing complicated when you use Phaser?\n\nLet's create a new variable which\
