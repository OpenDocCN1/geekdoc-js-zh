    Now your game will remember your best score.\nAs a final advice, I don't recommend\
    \ using simple names like \"bestScore\" or \"currentLevel\" for your local storage\
    \ variables as other applications could use the same names, and you will overwrite\
    \ other settings with your data, or get your data overwritten by other applications\
