    \ this);\n```\n\nWherever you click or touch the screen, `restartGame` method\
    \ will be called.\n\n> `input.onDown(callback, callbackContext)` is fired each\
    \ time a pointer is pressed down. It runs `callback` function in `callbackContext`\
    \ context.\n\nAnd finally the game is complete. Anyway, what happens if you removed\
