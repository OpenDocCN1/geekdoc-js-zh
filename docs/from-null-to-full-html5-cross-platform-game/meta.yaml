  - "[PAGE 17]\n\nNow that we have the sprite sheet with all our game tiles, it's\
    \ time to build the game itself.\n\n# Preloading images\n\nOne of the worst things\
    \ you can do in the making of a game is to handle graphic assets before you actually\
    \ loaded them.\n\nThat's why we will need to preload the sprite sheet. Let's add\
    \ a couple of lines to game.js:\n\n```\nwindow.onload = function() {\n    var\
    \ tileSize = 80;\n    var game = new Phaser.Game(500, 500);\n    var playGame\
    \ = function(game){}\n    playGame.prototype = {\n        preload: function(){\n\
    \            game.load.spritesheet(\"tiles\", \"tiles.png\", tileSize, tileSize);\n\
    \        },\n        create: function(){\n            console.log(\"That's my\
    \ awesome game\");\n        }\n    }\n    game.state.add(\"PlayGame\", playGame);\n\
    \    game.state.start(\"PlayGame\");\n}\n```\n\nWhat happened now?\n\nWe preloaded\
    \ the sprite sheet we created some minutes ago. Let's see the new lines of code:\n\
    \n```\nvar tileSize = 80;\n```\n\nDo you remember we created the sprite sheet\
    \ where each tile is an 80x80 pixels square?\n\nWe are going to refer to that\
    \ number a lot of times in the making of the game, each time we will need to know\
    \ the size of a tile.\n\nRather than filling the source code with a series of\
    \ \"80\" scattered here and there, we are going to store this value in a variable\
