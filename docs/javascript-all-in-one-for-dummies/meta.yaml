  md: 'The fact that every web application developer knows that their code and the
    data downloaded from the server can be viewed also helps to increase security.
    As a web application programmer, one of your jobs is to ensure that no personal
    data or data that would allow you to possibly access someone else’s data is ever
    stored in the web browser and that all sensitive data is encrypted as it’s transferred
    from the server to the client.


    Banks and other businesses that regularly handle personal data always store and
    process that data on the server, where the code isn’t visible to anyone except
    authorized people and where firewalls and other security precautions can be implemented.
    Programs that handle logins, credit card processing, data retrieval, and much
    more on web servers are called *server-side services*.


    # JavaScript on the server


    The ability to run client-side JavaScript is built into every web browser. But
    JavaScript programs can also run on the server. Node.js, which you can learn about
    in Book 7, makes it possible to use the same JavaScript language you use to write
    front-end user interfaces to write services on the back end.


    Like front-end JavaScript running in a browser, back-end JavaScript running in
    Node.js uses just-in-time compilation, and the actual JavaScript files are stored
    as plain text. The difference between front-end JavaScript and back-end JavaScript
    running in Node.js is that web browsers never see the JavaScript that runs on
    the server — they only receive the results of those programs running.


    As a result, back-end JavaScript doesn’t have to operate in a sandbox. It can
    access the server’s operating system, other programs running on the server, and
    databases to do what it needs to do to process data and return results to web
    browsers.


