    \ into it. To run the hundreds or thousands of lines of code that make up a modern\
    \ JavaScript program, and to transmit that JavaScript across the Internet, JavaScript\
    \ needs to be connected to an HTML page.\n\nYou have three options for including\
    \ JavaScript in a web page. You can put it\n\n+   >> In an HTML event attribute\n\
    >> Between the start and end tags of a script element\n>> In a separate file and\
    \ import it into your HTML document\n\nIt's not uncommon to see all three techniques\
    \ used together in a single web page, or to see multiple instances of each technique\
    \ in a single file. Let's take a closer look at each of them, along with their\
    \ pros and cons.\n\n# Running JavaScript from HTML event attributes\n\nHTML's\
