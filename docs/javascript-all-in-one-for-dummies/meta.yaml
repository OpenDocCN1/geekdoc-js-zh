    # Learning the basics of Git


    To track your files, Git keeps a database in a folder named .git in your project.
    There''s no need to see or change this folder manually, so VS Code hides it from
    you by default.


    Git has three states that your files can be in:


    +   - **Modified** means that you''ve changed a file but haven''t yet committed
    it to the Git database.

    - **Staged** means that you''ve marked a modified file to be a part your next
    commit.

    - **Committed** means that a file is stored in your local Git database.


    Follow these steps to take a file in your repository through all three of these
    states:


    +   1. **In the same workspace where you initialized your Git repository, create
    a new file named README . md or open your existing README . md file.** Make sure
    the README . md file isn''t inside a subfolder of your repository. Files and folders
    that aren''t inside any other folders in your project are said to be at the root
    of your project.'
