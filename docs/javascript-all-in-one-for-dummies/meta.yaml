    # Chapter 1 Jumping into JavaScript


    > "Trust thyself: every heart vibrates to that iron string."

    — RALPH WALDO EMERSON


    Because it''s built into every web browser, JavaScript is the most widely used
    programming language today. But what exactly is JavaScript, and how did it get
    to where it is today?


    # JavaScript, the Basics


    In technical terms, JavaScript is a high-level, just-in-time compiled programming
    language. This is an important definition, but to understand it and to truly understand
    what JavaScript is, we need to talk about what it''s not:


    +   * » JavaScript is not Java.

    * » JavaScript is not a scripting language.


    To help you understand what this means, I need to provide some definitions and
    give a brief history lesson.'
