    # The value of a service


    If all the client-side code of a web application is visible to anyone who cares
    to look, doesn''t that create a security problem? Could someone with bad intentions
    view the source code and figure out how to use the app for a purpose for which
    it wasn''t intended?


    Yes, in theory. But limitations and security precautions are built into web browsers
    that prevent this. For example, a web page downloaded from a server can''t access
    data from just any web server — it must either be from the same domain as the
    original HTTP request or be specifically permitted by the server to access data.
    Also, web browsers operate in what''s called a *sandbox*: The code running in
    a web browser can''t access anything outside of the browser (such as files, other
    programs on your computer, or your operating system) unless you specifically allow
    it (as you might do when a web page asks to use your location).'
