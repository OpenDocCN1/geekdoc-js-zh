    You close your email and go to the cafe to order a chai mocha latte and a Jamstack
    sandwich and have a rest in order to think about whether you really and truly
    need this job.


    # Why This Book?


    I wrote this book because I’ve been in the situation just described numerous times
    in my career as a full-stack developer. Maybe you’ve already had an experience
    like that one and you want to make sure you’re better prepared next time. Maybe
    you’re going through this experience right now. Maybe you want to try to prevent
    this from happening to you as you begin your career in JavaScript programming.
    If you fit into any of these categories, this book is for you.


    Software development is a dynamic craft. A good part of your responsibility as
    a professional programmer is to learn new things constantly. The world of JavaScript,
    however, is notoriously dynamic. Something you learn this year will likely be
    out of style or at least vastly different next year. There’s no sense in fighting
    the current by sticking to your tried-and-true methods and tools. Many times,
    if not most of the time, new libraries and tools catch on quickly in JavaScript
    because they’re genuinely useful and superior to the previous ones.


    Learning new things can be difficult, and learning new things under pressure to
    begin using them on real-life projects can be particularly stressful unless you’re
    properly prepared with the right attitude and sufficient experience.


    My goal with this book is to prepare you to understand and work with JavaScript
    and JavaScript programmers. If you read this entire book, you’ll understand much
    of what the manager in the scenario I described earlier said — and maybe even
    what to do about it. You’ll also be well-equipped to continue your learning and
    to ask the right questions when something you haven’t heard of comes up next time.


    # JavaScript is a huge topic


    Programmers create new ways of working with JavaScript all the time and package
    them as libraries and frameworks that can be downloaded and used by'
