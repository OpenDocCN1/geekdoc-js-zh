    # # Eich is back with a brand-new invention


    Brendan Eich, who worked at Netscape, took on the job of inventing a language
    for adding interactivity to web pages. He mashed together ideas and syntax from
    several other programming languages and created a language called Mocha, which
    was quickly renamed LiveScript and integrated into Netscape Navigator.


    Simultaneously, a revolution was happening in the wider world of computer programming
    because of an exciting new programming language called Java. Seeing the potential
    for Java to be used to make web pages dynamic, Netscape invented Java applets,
    which were Java programs that could run inside a web browser.


    Netscape saw the potential for Mocha (now named LiveScript) to be used to interact
    with these Java applets and renamed its programming language JavaScript.


    # # Imitation is the sincerest form of flattery


    As web pages began to appear that made use of JavaScript code to produce nifty
    effects and animation, Microsoft had to play catch-up so that users wouldn’t switch
    to using Netscape Navigator.


    Microsoft reverse-engineered JavaScript and created a perfect (well, almost perfect)
    replica of it, called JScript, which it included in Internet Explorer. This moment
    in the first browser war dramatically slowed the evolution of the web because,
    although JavaScript and JScript were mostly compatible, their differences were
    significant enough to make doing much “real” programming in web browsers extremely
    annoying, at least until the creation of jQuery in 2006 — but that’s another story.


    # # The long road to standardization


    Netscape submitted JavaScript to the ECMA International standards organization
    with the goal of creating a standard version of JavaScript that every browser
    could agree on. The result was the ECMAScript specification, also known as ECMA-262,'
