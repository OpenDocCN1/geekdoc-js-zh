  md: "```\n<body>\n    <script>\n        let personName = prompt('What is your name?');\n\
    \        alert('Hello, ' + personName);\n    </script>\n</body>\n</html>\n```\n\
    \nYou can put inline JavaScript in either the head or the body of an HTML document,\
    \ and you can use as many inline scripts as you need. Inline JavaScript is useful\
    \ for small bits of JavaScript that need to be run in a single HTML page. The\
    \ benefit of using inline JavaScript is that it saves a trip back-and-forth from\
    \ the web server, which reduces the load time of your HTML page.\n\nThe downside\
    \ to using inline JavaScript is that, like JavaScript in event attributes, it\
    \ mixes your HTML and your JavaScript and makes maintaining your application more\
    \ difficult.\n\n*Separation of concerns*, which is an important principle in software\
    \ development, states that your programs should be separated into sections. For\
    \ example, you shouldn't mix your presentation code (HTML) with your logic (JavaScript).\
    \ By abiding by the rules of separation of concerns, you make your programs easier\
    \ to maintain and more modular. I revisit this idea of separation of concerns\
    \ through-out this book, especially when I tell you about various front-end JavaScript\
    \ librar-ies that seem, at first glance, to violate this principle.\n\nListing\
    \ 1-2 makes use of a prompt to receive input from a user. Like an alert, a prompt\
    \ should never be used in a real-life program. It has the same flaws as alert(),\
    \ which is that it's ugly and limited and blocks the running of your JavaScript.\n\
    \n# Including JavaScript files in your HTML\n\nThe third method of running JavaScript\
