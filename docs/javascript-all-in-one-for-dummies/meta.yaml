  md: '![](bbox=[0.25, 0.08, 0.87, 0.36])


    FIGURE 1-18: Running the JavaScript Name Creator code.


    If the font size in your console is too small to read easily, you can increase
    it by pressing Ctrl+= on Windows or Command+= on macOS. If you want to make the
    font size smaller again, you can do that by pressing Ctrl+− on Windows or Command+−
    on macOS.


    The JavaScript console is a direct text-based link into your web browser’s JavaScript
    engine. When you type code into the console and press Enter, it causes JavaScript
    to run that code and return a result. If the line of code produces no immediate
    result (as many things in JavaScript don’t), the console just prints the word
    *undefined*. This is sort of like JavaScript’s way of saying, “I acknowledge that
    I received your input, but there’s nothing for me to do at this point.”


    If you made a mistake while typing the JavaScript code, you can start over by
    refreshing the browser window. Reloading clears out JavaScript’s memory and anything
    in the console window.


    # Rerunning Commands in the Console


    You can enter a single line of code in the console and immediately get a result.
    However, if you want to change or rerun commands, you need to reenter them.


    If you haven’t reloaded the browser window, you can easily return to previous
    lines of code you entered by pressing the up- and down-arrow keys in the console.'
