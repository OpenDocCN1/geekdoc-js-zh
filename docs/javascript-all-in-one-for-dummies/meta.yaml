    piece of writing, JavaScript has a similar fundamental building block, which is
    called a statement. Listing 1-1 has three separate statements. Each statement
    ends with a semicolon, and running a statement causes JavaScript to do something.


    In the case of the first two statements, which begin with let, these are telling
    JavaScript to store a value. The third statement, which begins with console.log,
    is telling JavaScript to log (or write) some text to the console in your browser.


    Just as English is made up of parts of speech — such as nouns, verbs, and adverbs,
    JavaScript statements are made up of several parts, as described in this list:


    +   » **Values:** In Listing 1-1, ''Chris'' is a value.

    » **Expressions:** Expressions are units of code that are evaluated and become
    values. For example, in Listing 1-1, the following is an expression:

    `normalName + ''Script''`

    When normalName has a value of ''Chris'', this expression evaluates to ''ChrisScript''.

    » **Operators:** Operators do something with values. In Listing 1-1, the + operator
    (known as the concatenation operator) joins together the value of normalName and
    the literal value ''Script''.

    » **Keywords:** Keywords are parts of JavaScript that have special meaning and
    cause JavaScript to do something. In Listing 1-1, the word let is a keyword that
    tells JavaScript to store the value on the right side of the = (assignment) operator
    using the name on the left side of the =.


    ![](bbox=[0.16, 0.83, 0.22, 0.88])


    The process of assigning a value to a name is called initializing a variable in
    programming. You can learn much more about initializing variables in Chapter 2
    of Book 1.'
