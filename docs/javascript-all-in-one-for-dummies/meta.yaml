  md: '# JavaScript is a programming language


    A programming language is a set of rules, in the same way that a human language
    is a set of rules. In human languages, we call the rules that form a language
    its *grammar*. In computer programming, we call the rules of a programming language
    its syntax.


    Many different programming languages have been created, and each one has its own
    syntax. Just as many human languages are related to other languages (and therefore
    have similar grammar), most programming languages are also related to other languages
    and have similar syntax.


    # A look at programming language levels


    The set of instructions that computer processors run is called *machine language*.
    Machine language is called a *low-level* programming language because it''s the
    actual instructions that are understood by a computer, with little or no abstraction.


    Machine language is the fastest possible way to instruct a computer to do something
    — however, it has a few problems.


    The first problem with machine language is that it''s difficult, or impossible,
    for humans to write. Machine language consists of a stream of binary data. For
    example, here''s a small sample of a machine code program:


    ```

    100011 00011 01000 00000 00001 000100

    ```


    What does this program do? I have no idea. This brings us to the second problem
    with machine code.


    # Machine code is processor-specific


    The instructions to cause one computer to complete a calculation or another function
    are different from the codes used by another computer. If you write a program
    in machine language for one type of computer processor, you need to write an entirely
    different program if you want the same functionality on another type of computer.
    In the computer programming business, we say that programs written in machine
    languages are not *portable*.


    # High-level languages are abstractions


    High-level languages allow programmers to write code in a language that''s much
    closer to a spoken language. This makes it possible for more complex programs
    to be written more easily.'
  merge: -1
  pgno: 33
- img_proc: false
  md: "Another benefit of high-level languages is that they hide from the programmer\
    \ some of the complexity of working with computers. For example, a programmer\
    \ using JavaScript who wants to loop over a list of numbers and find the even\
    \ ones can just write something like this:\n\n```\nlet getEvens = (numbers) =>\
    \ {\n    let evens = numbers.filter(number => number % 2 === 0);\n    return evens;\n\
    }\n```\n\nAt this point, this snippet of code might look completely foreign to\
    \ you, but you’ll soon understand it. A computer processor, on the other hand,\
    \ can never make heads or tails out of this code. For that, we need compilation.\n\
    \n# Compilation makes programs portable\n\n*Compilation* is the process of converting\
    \ code from a high-level language that programmers can understand (like JavaScript,\
    \ Python, C++, and others) into a low-level language that the computer can run.\n\
    \nThe compiler was invented by Admiral Grace Murray Hopper (see Figure 1-1), who\
    \ also came up with the name and wrote the first implemented compiler during the\
    \ 1950s. In 1957, the FORTRAN computer language had the first commercially available\
    \ compiler.\n\n![](bbox=[0.26, 0.56, 0.56, 0.88])\n\n*James S. Davis / Wikipedia\
    \ Commons / Public Domain*"
  merge: -1
  pgno: 34
- img_proc: false
  md: 'Compilation makes it possible for the same program, written in a high-level
    language, to run on many different types of computers, simply by compiling it
    for the various computers rather than having to rewrite it. The invention of the
    compiler started the computer language revolution that made JavaScript possible.


    In traditional compiled languages, a programmer writes code (called the *source
    code*) and then must run a process to compile the source code into machine code.
    Compilation can be a slow process, but the result is low-level code that the computer
    can understand.


