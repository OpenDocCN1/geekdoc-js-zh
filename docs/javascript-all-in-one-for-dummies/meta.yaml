  md: 'other programmers. Think of libraries as tools to solve a particular problem
    in a different way. Think of a framework as a complete system for doing particular
    things.


    No single person can know and remember every JavaScript library and framework
    that’s been created. And there’s really no need to. By definition, a JavaScript
    library or framework is just JavaScript. In theory, if you know JavaScript, you
    can learn every JavaScript library and framework. In fact, if you know enough
    about JavaScript, you can write your own JavaScript library or framework!


    # How this book is different


    Most books about JavaScript focus on either teaching the JavaScript language itself,
    or on focusing on a single library or framework. Both approaches have their merits,
    but both leave out a vital ingredient for becoming a JavaScript programmer.


    Learning to program with JavaScript isn’t fundamentally about memorizing syntax
    or knowing every function available in a library or framework. If you know and
    understand the basics, you can look up everything else easily enough. Furthermore,
    if you spend a lot of time learning every function and feature of a particular
    library from a book, you’ll be frustrated when you go to use it and find that
    much has changed in the time (whether it’s a month or several years) since the
    book was published.


    In my experience, it’s much better to learn just enough about as many different
    ways of doing things as possible, so that when you encounter something new, you’ll
    have something to compare it to.


    # Learn JavaScript as it’s used


    Knowing how to write JavaScript isn’t enough to be able to develop apps. JavaScript
    lives in an environment, whether it’s a web browser, a mobile phone, a web server,
    or a hardware device. Once you get to a certain level of proficiency with JavaScript,
    knowing how JavaScript interfaces with its environment is what’s most important.


    This book shows you how JavaScript is used in the real world, using a combination
    of real-world and simplified examples.


    # Understand similarities between the most popular libraries


    Learning about a single library — whether it’s React or Vue.js or Svelte or Angular
    — is great. But without knowledge of other ways of doing things, you'
