  md: '# # Installing Node.js


    Node.js is the one essential JavaScript tool that all the other tools depend on.
    You may already have Node.js installed on your computer. However, updated versions
    are released regularly and you''ll want to make sure you have a recent version
    so that everything you''ll learn about in this book will work correctly.


    To install Node.js or to upgrade the version of Node.js that you may already have
    installed, go to https://nodejs.org and click on the link to download the latest
    Current version (the green button on the right). Once it''s downloaded, run the
    installer to install and configure Node.js. Selecting the default options will
    work fine in most cases.


    > You can learn more about Node.js in Book 7.


