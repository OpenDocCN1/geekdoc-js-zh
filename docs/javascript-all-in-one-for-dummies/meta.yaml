  md: 'README file. A README file can be written in a simple text file, in an HTML
    file, or, most commonly, in a markup language called Markdown (I know — it seems
    like a funny name for a markup language).


    # The basics of Markdown


    To get started with writing your README file, make a new file in VS Code and save
    it with the extension .md.


    Markdown files generally start with a Level 1 header. To mark text as a level
    1 header, preface it with a single # character. Lower-level headers (up to Level
    6) are prefaced with additional # symbols.


    Let''s start the README for gamelet.js with the following header:


    ```

    # Gamelet

    ```


    After the Level 1 header, you should include a sentence about your project, written
    as a normal paragraph. To write a paragraph of text in markdown, just separate
    it from other text with a blank line. With a description paragraph added, the
    README file now looks like this:


    ```

    # Gamelet


    A starter program for writing JavaScript games.

    ```


    After the description, it''s common to add a Level 2 header called Installation
    and one called Usage. Because there''s no good way to install Gamelet yet, you
    just add a usage header. The usage header typically includes a numbered list and
    code.


    To create a numbered list, type a number with a period before the list item. To
    write code, place three backtick characters (`) followed by the language the code
    is in (JavaScript or HTML, for example) in front of the code and then place three
    backticks at the end of the code block.


    Just by knowing how to write headers, paragraphs, numbered lists, and code in
    Markdown, you can create a useful and readable README file. Listing 2–3 shows
    the finished README for Gamelet.


    CHAPTER 2 Filling Your JavaScript Toolbox 53'
