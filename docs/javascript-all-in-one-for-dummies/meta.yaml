    maker decide to come together to work out their differences. The result was ECMAScript
    5 in 2009, and ECMAScript 6 (also known as ES2015) in 2015. As a result of ECMAScript
    5 and 6, JavaScript was able to move forward with browsers all running the same
    code the same way — and there was much rejoicing.


    # How JavaScript changes


    A new-and-improved edition of ECMAScript now comes out every year. Each new edition
