  md: "# Documenting Your Code\n\nDocumenting your code is the process of recording\
    \ what the code does. It's an essential part of any programming task that will\
    \ save you time and frustration when your programs become complex and you're trying\
    \ to remember what each part of your program does. It's also helpful for other\
    \ programmers who may work on your program in the future.\n\nPlus, I've found\
    \ that programming students who get into the habit of documenting their code early\
    \ on usually gain a deeper understanding of what the code does and are better\
    \ able to solve problems that occur in their programs.\n\n# Line comments\n\n\
    The most basic way to add a note to yourself or other programmers is to add a\
    \ line comment. You create a line comment by placing two (//) slashes together\
    \ anywhere on a line of code — for example:\n\n```\nrefresh(); // update the ball's\
    \ position\n```\n\nThe line comment tells JavaScript to ignore everything that\
    \ comes after the two slashes until the end of the line. This is a helpful way\
    \ to put in short notes to yourself about what the program does or why a statement\
    \ is important.\n\n# Block comments\n\nWhen a single line comment won't do, you\
    \ can use a block comment, which starts with /* and ends with */. JavaScript ignores\
    \ everything within a block comment.\n\nBlock comments are helpful for providing\
    \ detailed documentation at the beginning of a JavaScript file, or for documenting\
    \ individual functions. For example, Listing 2-2 shows the gamelet.js file from\
    \ Chapter 1 with block comments included.\n\n# LISTING 2-2: Gamelet.js with comments\n\
    \n```\n/*\n\n    Gamelet: a starting point for writing games\n    Author: Chris\
    \ Minnick\n    Version: 1.0\n```"
