    \ do, and it’s not attractive. You learn much better ways to display messages\
    \ to the user in this book.\n\nAvoid using HTML event attributes. That’s the old\
    \ way of responding to events in HTML, and the attributes are kept in HTML mostly\
    \ for backward-compatibility reasons at this point. The biggest problem with using\
    \ them is that they combine your HTML and your JavaScript, which makes maintaining\
    \ your code more difficult. But HTML event attributes have other problems as well.\
    \ The first of these is that they run in the global scope, meaning essentially\
    \ that they run outside of the rest of your code. This can create problems and\
    \ unexpected behavior if you try to do anything complex with them. The other problem\
    \ is that it’s not possible for an element to listen for multiple events using\
    \ these attributes.\n\n![](bbox=[0.14, 0.46, 0.22, 0.53])\n\nThe modern way of\
    \ responding to events in the browser is by using the `addEventListener` method,\
    \ which you learn about in Book 1, Chapter 10.\n\n# Running HTML inside script\
