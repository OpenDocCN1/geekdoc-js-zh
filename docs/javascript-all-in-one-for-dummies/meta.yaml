  md: '# JavaScript is case-sensitive


    Unlike HTML, where browsers consider the tags `<HEAD>` and `<head>` to be identical,
    JavaScript code is case-sensitive. If you change the capitalization of one character
    in a JavaScript keyword or a variable name, JavaScript doesn''t understand what
    you''re saying.


    Remember that if you type *pizza* in one place and *Pizza* in another place, JavaScript
    thinks these are completely different values.


    > **Incorrect or inconsistent capitalization is by far the biggest source of errors
    (also known as *bugs*) for beginning coders. These kinds of bugs are also often
    difficult to find and fix. Take your time as you''re coding and make it a habit
    to be precise. It will save you a lot of time later.**


    # JavaScript ignores white space


    *White space* includes characters such as tabs, spaces, and line breaks, which
    produce no visible output when you type them. When you write JavaScript, you often
    separate statements and the different parts of statements using white space. However,
    it doesn''t matter whether you indent lines with spaces or tabs, if you include
    multiple line breaks between statements, or if you include extra spaces between
    the parts of a JavaScript statement.


    The one place where white space does matter is inside of values. For example,
    it''s perfectly fine to write the first statement in Listing 1-1 like this:


    ```

    let    normalName      =    "Chris";

    ```


    Even though most other JavaScript programmers would look at you funny if they
    saw this line in your code — and your code formatter will likely fix it for you
    — JavaScript runs this code the same as if you formatted it in a more traditional
    way.


    Where white space does make a difference is inside of quotes. For example, consider
    the following statement:


    ```

    let normalName = "Chris         ";

    ```


    If you run the program with this statement, the result includes all those spaces.


    It''s important to use enough space in your code so that it''s readable and to
    be consistent with how you use it. Some people prefer tabs for indenting code,
    and other people prefer spaces. A code formatter, such as Prettier, which you
    can learn about shortly, ensures that you''re using white space in a consistent
    and standard way.'
  merge: -1
  pgno: 54
- img_proc: false
  md: '# # JavaScript programmers use camelCase and underscores


    Names that you give to variables, files, modules, and functions in JavaScript
    often have multiple word names. However, because JavaScript uses spaces to distinguish
    between the parts of a statement (the same way you use spaces to know when one
    word ends and another starts), you need another way to make multiple word names
    readable.


    As long as you don''t use spaces or other special characters (see the complete
    list I give you in Chapter 3 of Book 1), you can name things in JavaScript any
    way you see fit. However, I suggest that you use the common strategies I describe
    next.


    # ## camelCase


    *Camel case* is used extensively in the JavaScript language itself, as well as
    in JavaScript programs. You can use two types of camel case. The first one is
    *upper camel case*, in which the first word starts with a capital letter and every
    word after that is capitalized as well.


    ![](bbox=[0.163, 0.457, 0.238, 0.524])


    Upper camel case is used in JavaScript for naming classes and components (such
    as ReactJS components).


    The second type of camel case is *lower camel case*, in which the first word is
    lower cased and every word after that is capitalized. Lower camel case is the
    most common way to name variables you create in your programs.


    # ## Underscore


    It''s also common to see names in JavaScript that use the underscore character
    between words in some circumstances. For example, if you''re getting data from
    an external source, that data may contain underscore names already, and it makes
    sense to continue using the same naming scheme in your program. However, in most
    cases, you should stick with lower camel case.


    # ## Dashes


    CSS and HTML frequently use dashes between words in multiword names. For example,
    there''s a CSS property called `border-radius` and an HTML attribute that''s used
    with the form element called `accept-charset`.


    Naming things with dashing in JavaScript is problematic and should be avoided
    because JavaScript interprets the dash character as a subtraction operator and
    your program won''t run correctly or at all.'
  merge: -1
  pgno: 55
