  md: '# Coding Responsibly with Git


    Every programmer has had the experience of creating a document (maybe a paper
    or a book or an email) and something happens — the power goes out or the coffee
    spills on your laptop or you simply forgot to save before you turned off your
    computer. The resulting lost work is a frustrating waste of time, and you may
    never get that data back or be able to re-create the magic.


    For me, it was a computer''s power supply that experienced a power surge and exploded
    in the middle of the night, frying the hard drive and causing me to nearly lose
    50 percent of a book I was writing. Fortunately, I had sent most of my work to
    my editor already and I was able to recover quickly.


    Problems that cause data loss in programming and in writing can also be the result
    of good intentions. Maybe you spend weeks traveling down a path that you think
    is right, but it turns out to be completely wrong and you wish you could go back
    to where you were when you first came up that harebrained idea.


    Maybe you work with another programmer or a team of programmers and you discover
    that both of you are working on the same file at the same time. How do you figure
    out how to merge your changes and end up with a single version of the code?


    To prevent all of these circumstances, programmers (and many writers) use version
    control systems. *Version control* tracks the changes to files over time, giving
    you a complete record of what each individual file in a project looked like at
    any point and allowing you to return to any point in the life of your project.


    Version control is what makes team software development possible, but it''s also
    an indispensable tool for individual developers working on their own. The most
    popular version control system in use today is Git.


    # Introducing Git


    *Git* is a free and open-source version control system that can be used on every
    kind of project, from very small to very large. Unlike other version control systems,
    Git doesn''t store complete copies of each file with each version. Instead, it
    creates snapshots of a project containing only the files that have changed in
    each version. If a file never changes after it''s created, Git needs to store
    only one copy of that file.


    This system of creating snapshots makes Git use much less storage space and makes
    it faster than other version control systems.


    > Filling Your JavaScript Toolbox'
