  md: '# # Getting prettier


    Correctly formatting your code is important for readability and debugging. You
    can spend a lot of time manually typing spaces or tabs and making everything consistent,
    or you can let your code editor do it for you. Once you start using a code formatter,
    you''ll never go back, so you might as well start using one today.


    Prettier is an *opinionated* code formatter — it takes the whole matter of formatting
    your code out of your hands and doesn''t even let you format your code the way
    you might prefer, because it has its own ideas that it thinks are better than
    yours. And it''s probably right, as you''ll soon see.


    Follow these steps to install and configure Prettier:


    +   1. Type **Prettier into the search box in the Extensions panel.**


    2. **Look for the Prettier extension that has the highest number of downloads.**


    3. **Click the Install button in the search results or on the Details page for
    the Prettier extension.**


    A long list of extensions from the Extensions Marketplace appears.


    At the time I wrote this chapter, for example, the top result, shown in Figure
    2-2, had about 30 times as many downloads as the next most popular.


    After a moment, the Install button changes to the Uninstall button, to indicate
    that it''s been installed. You also see a new button, named Disable. If you click
    this button, the extension will be disabled without uninstalling it.


