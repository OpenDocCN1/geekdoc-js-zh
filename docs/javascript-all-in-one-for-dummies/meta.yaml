  md: '# KNOWING HOW TO GET UNSTUCK


    A lot of effort goes into making software installation as easy as possible, and
    most of the things you need to install to do JavaScript development should go
    smoothly. However, it''s inevitable that you''ll run into some issues. Here are
    some of the more common issues that can happen, and things you can do to figure
    out how to fix them — most of these tips apply whether you''re using Windows,
    macOS, or Linux:


    +   - **Not enough disk space:** If you don''t have a lot of extra storage, obviously
    everything you need to install in this chapter won''t fit. Delete some extra files,
    use an online storage service like Dropbox to free up space, or invest in a larger
    (internal or external) hard drive. Software development can use a lot of storage
    space, and it''s always better to have too much.


    +   - **Network issues:** If you''re connected to the Internet but still get network
    errors when installing software, the problem is likely to be a firewall or another
    security tool or setting on your computer or network. If you''re working on a
    computer connected to a work network or a public Wi-Fi hotspot, the problem is
    likely to be a firewall outside of your computer. Try connecting to a different
    network. If you own the computer and control the router, temporarily disable any
    firewall or security software you have installed or that''s part of the operating
    system.


    +   - **Permissions issues:** By default, operating systems are configured to
    not allow user changes to certain files or directories. If you''re trying to download
    or install software inside a system directory or one that''s restricted in some
    way, you''ll get a permissions error. Try installing the software in your own
    user directory (Users/yourname on macOS or Windows or usr/yourname on Linux).
    As a last resort, you can right-click any folder to change its permissions, but
    you should do this only if you know what you''re doing.


    +   - **Software incompatibility:** There are versions of everything you need
    to install for this book that run on Windows, macOS, and Linux. However, a future
    version of an operating system or a new processor could change this at any time
    (at least until the software is updated). If you run into an incompatibility problem,
    first make sure that you downloaded the right version for your computer''s processor
    and operating system. If that doesn''t solve the problem, check with the software''s
    creator to see whether a compatible version is available. This may be an older
    version in some circumstances, which won''t be a problem in most cases. If all
    else fails, consider using a virtualization product like VirtualBox (virtualbox.org),
    VMWare (vmware.com), or Parallels (parallels.com) to run Linux (I recommend Ubuntu
    Linux if you''re new to Linux) in a virtual computer on your computer.


    +   - **Other errors:** If you encounter other errors, copy the error message
    you get and paste it into Google. Chances are good that someone else has gotten
    the same error and that the solution (or something close to it) is just a quick
    search away.'
