  md: 'In JavaScript development, the number of tools that are freely available is
    staggering. Unlike in the kitchen or the shop, cheap doesn''t mean poor quality.
    In fact, most professional JavaScript programmers use free and open-source tools
    exclusively, and in many cases a commercial product that does all the same things
    isn''t available.


    The tool chest of the average professional JavaScript developer should include
    these items:


    +   >> A code editor for writing code

    >> Node.js for running the tools

    >> A package manager for installing, upgrading, tracking, and removing Node.js
    software packages

    >> A build tool for bundling JavaScript files, compiling template code, and automating
    the build process

    >> A code beautifier for making sure the code is properly and consistently formatted

    >> A static code analyzer for checking the code syntax and style

    >> A debugger for tracking down and eliminating errors

    >> A testing framework for automating the testing of programs

    >> A version control system for keeping track of changes and enabling team development


    Other categories of tools beyond the ones in this list are available and widely
    used. I tell you about them later in this book. However, with the listed tools
    on your belt (or, more realistically, on your desktop or laptop), you''ll be ready
    to code.


    I don''t tell you how to install all these tools in this chapter. Instead, I start
    with the most essential ones now and introduce others as you need them. So let''s
    start installing!


    > Part 6 of this book focuses exclusively on development tools. Many of the tools
    covered there won''t make a lot of sense at this point, but if you''re feeling
    adventurous, you can take a peek at the chapters in that part and then come back
    here to nail down the essentials so that you can start coding with JavaScript.'
