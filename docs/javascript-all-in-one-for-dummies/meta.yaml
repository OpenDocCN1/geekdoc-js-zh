  md: "LEARNING MADE EASY\n\n# JavaScript® ALL-IN-ONE\n\nfor dummies® A Wiley Brand\n\
    \n```\ndocument.querySelector...\nconst link of document.querySelector...\nlink.addEventListener('click',\
    \ (e) => {\n  e.preventDefault();\n  selectBook(e.target.innerText).then((finalResult)\
    \ => {\n    console.log(`I learned ${finalResult}!`);\n  });\n});\n\nasync function\
    \ selectBook(subject) {\n  if (subject === 'JavaScript') {\n    let { book } =\
    \ await import('/modules/learn-...');\n    return book;\n  } else if (subject\
    \ === 'ReactJS') {\n    let { book } = await import('/modules/learn-re...');\n\
    \    return book;\n  } else if (subject === 'Vue.js') {\n    let { book } = await\
    \ import('/modules/lear...');\n    return book;\n  } else if (subject === 'NodeJS')\
    \ {\n    let { book } = await import('/modul...');\n    return book;\n  }\n}\n\
    ```\n\n![](bbox=[0.5, 0.48, 0.95, 0.78])\n\nChris Minnick\nAuthor of Coding with\
    \ JavaScript For Dummies"
