  md: "We can now reload our app, aaaaaaaaaaaaand it doesn't work! Among others, we\
    \ get the “Error: undefined missing entities/header” error. How is this possible,\
    \ when it clearly worked fine with RequireJS? It's because we have nested require\
    \ calls (i.e. declaring dependencies *within* the module, instead of only in its\
    \ definition). Luckily the fix is to simply add a `findNestedDependencies` attribute\
    \ to our build file:\n\n```\nassets/js/build.js\n({\n    baseUrl: \".\",\n   \
    \ name: \"vendor/almond\",\n    include: \"require_main\",\n    mainConfigFile:\
    \ \"require_main.js\",\n    out: \"require_main.built.js\",\n    findNestedDependencies:\
    \ true\n})\n```\n\nWe compile the app again with the same command\n\n```\nnode\
    \ r.js -o assets/js/build.js\n```\n\nto generate a new version of our compiled\
    \ application. This time when we reload our application, it works fine!\n\n> Git\
    \ commit using almond to load the optimized application: [85d3d3dd40d0cebd858224c3903a12d6998d668d](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/85d3d3dd40d0cebd858224c3903a12d6998d668d)"
