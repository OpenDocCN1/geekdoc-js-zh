  md: "# apps/contacts/common/views.js\n\n```\nContactManager.module(\"ContactsApp.Common.Views\"\
    , function(Views, ContactManager,\n                                          \
    \    Backbone, Marionette, $, _){\n  Views.Form = Marionette.ItemView.extend({\n\
    \    // edited for brevity\n  });\n});\n```\n\nSo when RequireJS loads this file,\
    \ it tries to call the `ContactManager.module` method. But since we're using RequireJS,\
    \ we don't have a globally defined `ContactManager` Marionette application, so\
    \ that fails and causes our first error. And since we weren't able to declare\
    \ a new \"ContactManager.ContactsApp.Common.Views\" module (which would create\
