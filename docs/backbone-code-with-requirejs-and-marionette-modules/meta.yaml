  - "[PAGE 22]\n\n# Including the Dialog Region as a Dependency\n\nNow that we’ve\
    \ confirmed the only issue with our code is the missing dialog region, let’s include\
    \ it. Actually, no. *YOU* try and figure out how to include it and make it work.\
    \ As much as possible, this book will be structured as a series of exercises where\
    \ you rewrite the application based on your current knowledge of RequireJS. At\
    \ each step, a list of things to remember will be provided, and once you’ve written\
    \ the code (or at least attempted to), the book will continue by explaining the\
    \ implementation in more detail. This method will allow you to make some mistakes\
    \ and start *really* understanding how to rewrite an app to use RequireJS, instead\
    \ of reading code and think “well, this is pretty obvious…”. Ready? Let’s go!\n\
    \n![](img/9187ef8c47fe9c0a5221f8482c870d45_22_0.png)\n\nSpecify our dialog region\
    \ (located in `assets/js/apps/config/marionette/regions/dialog.js`) as a dependency\
    \ to our main application file. Here are a few things you’ll need to do:\n\n+\
    \   - define `dialog.js` as a RequireJS module, and don’t forget:\n    - the dialog\
    \ region will have a dependency on jQuery UI in addition to Marionette\n    -\
    \ modules need to return the value that is to be used by dependents\n- add an\
    \ entry for jQuery UI in the RequireJS configuration within `require_main.js`\n\
    - include the path to the newly defined dialog module to the dependency array\
    \ in the `define` call within the main application (i.e. the main application’s\
    \ RequireJS module depends on the dialog region)\n\nHere are a few additional\
    \ pointers:\n\n+   - as recommended by the RequireJS [documentation](http://requirejs.org/docs/api.html#jsfiles)¹⁷,\
    \ you should rename the jQuery UI file to `jquery-ui.js` (i.e. without version\
    \ information in the filename)\n- don’t forget that javascript objects need their\
    \ property names to be valid javascript identifiers, or strings (for more info,\
    \ see [here](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_Objects)¹⁸).\
    \ Therefore, I suggest you use the “jquery-ui” string as the identifier for the\
    \ jQuery UI library within `require_main.js`\n- within the `shim` object in `require_main.js`,\
    \ you can specify that jQuery UI depends on jQuery by providing an array of dependencies.\
    \ We haven’t covered this in the book yet, but try and figure it out from the\
    \ [documentation](http://requirejs.org/docs/api.html#config-shim)¹⁹ (read the\
    \ section on jQuery and Backbone plugins)\n- when indicating the location of the\
    \ dialog region module (for the main app’s dependency array), don’t forget paths\
    \ are to be indicated relative to the `assets/js` baseUrl\n\nYou can see the solution\
    \ on the next page."
