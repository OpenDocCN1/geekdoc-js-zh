    # ## Adding RequireJS to the Mix


    With our basic `index.html` in place, let''s move on to our next goal: using RequireJS
    to load our libraries. So let''s get RequireJS from [here](http://requirejs.org/docs/release/2.1.8/comments/require.js)¹¹
    and save it in `assets/js/vendor/require.js`. Now, we can add RequireJS to our
    `index.html` (line 22):


    Adding RequireJS (index.html)


    ```

    1  <!DOCTYPE html>

    2  <html lang="en">

    3    <head>

    4      <meta charset="utf-8">

    5      <title>Marionette Contact Manager</title>

    6      <link href="./assets/css/bootstrap.css" rel="stylesheet">

    7      <link href="./assets/css/application.css" rel="stylesheet">

    8      <link href="./assets/css/jquery-ui-1.10.0.custom.css" rel="stylesheet">

    9    </head>

    10

    11   <body>

    12

    13     <div id="header-region"></div>

    14

    15     <div id="main-region" class="container">

    16       <p>Here is static content in the web page. You''ll notice that it

    17         gets replaced by our app as soon as we start it.</p>

    18     </div>

    19

    20     <div id="dialog-region"></div>

    21

    22     <script src="./assets/js/vendor/require.js"></script>

    23   </body>

    24 </html>

    ```


    So how do we actually load our libraries with RequireJS? We''re going to add a
    `data-main` attribute to the `script` tag, which will make RequireJS automatically
    load the provided javascript file. This file,'
  merge: -1
