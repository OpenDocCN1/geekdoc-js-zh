  md: '```

    19    <div id="dialog-region"></div>

    20

    21    <script src="./assets/js/require_main.built.js"></script>

    22  </body>

    23 </html>

    ```


    As you can see, we''ve replaced our original RequireJS include on line 21 with
    our newly optimized file. But when we refresh our index page, our app doesn''t
    load properly. Instead we get an error message indicating that "define is not
    defined". What does that mean? Well, even though we don''t need RequireJS to process
    the dependencies, we still need it to load our module. So we''ll need to include
    the RequireJS library before we load our app file:


    index.html


    ```

    1 <script src="./assets/js/vendor/require.js"></script>

    2 <script src="./assets/js/require_main.built.js"></script>

    ```


    Git commit using the single optimized file:

    a736595a0fecd466aee049ae91429c086b2b6049


    Our app now loads properly, but it seems a little wasteful doesn''t it? We''re
    loading RequireJS will all its functionality (and file size!) only to load our
    unique module. There must be a better way!


    # ## Loading with Almond.js


    Almond.js is a minimal AMD module loader also written by James Burke (the man
    behind RequireJS). It''s meant to be lightweight in exchange of providing a very
    limited set of features, which is exactly what we''re looking for! Let''s download
    it from here and save it as assets/js/vendor/almond.js.


    Using Almond does come with some restrictions, among which the inability to use
    dynamic code loading (e.g. attempting to use a CDN-hosted library and falling
    back to a local version).


    Then, we need to change our build file to include Almond in the optimized file:


    https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/a736595a0fecd466aee049ae91429c086b2b6049

    https://raw.github.com/jrburke/almond/latest/almond.js

    https://github.com/jrburke/almond#restrictions'
