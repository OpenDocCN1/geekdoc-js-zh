    \ module *if it exists*, otherwise it returns a *new* Marionette module. So in\
    \ our case, since the AboutApp Marionette module doesn't exist, it's going to\
    \ be instantiated. This isn't the behavior we want, so let's fix it.\n\n# Managing\
    \ Start/Stop with Mixed Module Types\n\nThe first thing we'll do is pass `null`\
    \ to indicate the current sub-app isn't a Marionette module, and therefore doesn't\
    \ need to be started or stopped.\n\nAs you can see, we've modified line 4 to pass\
