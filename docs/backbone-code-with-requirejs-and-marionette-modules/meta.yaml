    \nNote that the code above doesn't exactly conform the RequireJS best practice\
    \ of \"one module per file\" (see here^22). The cleanest way to proceed would\
    \ be to define one module for the `Contact` model, and another for the `ContactCollection`\
    \ collection (which would have the \"contact\" module as a dependency). These\
    \ modules would return the defined model or collection, respectively.\n\nWhy aren't\
    \ we doing that? Well, we're simplifying our dependency tree somewhat since the\
    \ `Contacts` collection doesn't need to depend on the the `Contact` model: they're\
    \ both in the same Marionette module. In addition, don't forget we need our \"\
    contact:entity\" and \"contact:entities\" handlers to be registered before we\
    \ can use them in our application. This means that RequireJS needs to load them,\
    \ and it's easier to just have everything in one place (model, collection, event\
    \ handlers). And, last but not least, we are going to interact with our contact\
    \ entities using the request-response mechanism, so there's no need for us to\
    \ have an explicit reference to the model or collection.\n\nIn our case, we're\
    \ using a single module to define 2 separate things (a model and a collection),\
    \ so there's really no clear return value to provide as the module return value.\
    \ We still include a `return` statement for clarity (indicating we haven't forgotten\
    \ the return value, we're returning \"nothing\"). How will this code be functional?\
    \ Because we simply need it to be loaded: we're not going to access the contact\
    \ entities by explicit reference, we're going to request their values via Marionette's\
    \ request-response mechanism so we have no need for a \"usable\" return value.\n\
