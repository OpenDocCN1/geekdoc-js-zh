    \n```javascript\ncontactsListView.on(\"itemview:contact:show\", function(childView,\
    \ model){\n   console.log(\"show link clicked\");\n});\n\ncontactsListView.on(\"\
    itemview:contact:edit\", function(childView, model){\n   // edited for brevity\n\
    });\n```\n\nWith this in place, we're able to process the click event on the \"\
    show\" link. Now, we need to turn our \"show\" code into a RequireJS module. Let's\
    \ start by adding templates:\n\n**Template to display a contact** (assets/js/apps/contacts/show/templates/view.tpl)\n\
    \n```html\n<h1><%= firstName %> <%= lastName %></h1>\n<a href=\"#contacts/<%=\
    \ id %>/edit\" class=\"btn btn-small js-edit\">\n    <i class=\"icon-pencil\"\
    ></i>\n    Edit this contact\n</a>\n<p><strong>Phone number:</strong> <%= phoneNumber\
    \ %></p>\n```\n\n# Template to display a missing contact (assets/js/apps/contacts/show/templates/missing.tpl)\n\
    \n```html\n<div class=\"alert alert-error\">This contact doesn't exist !</div>\n\
    ```\n\nWith these templates in place, we can require them for use in our view\
    \ file:\n\n# Using the templates and adapting the view module for RequireJS (assets/js/apps/contacts/show/show_view.js)\n\
    \n```javascript\ndefine([\"app\",\n    \"tpl!apps/contacts/show/templates/missing.tpl\"\
    ,\n    \"tpl!apps/contacts/show/templates/view.tpl\"],\n    function(ContactManager,\
    \ missingTpl, viewTpl){\n        ContactManager.module(\"ContactsApp.Show.View\"\
    , function(View,\n            ContactManager, Backbone, Marionette, $, _){\n \
    \           View.MissingContact = Marionette.ItemView.extend({\n             \
    \   template: missingTpl\n            });\n\n            View.Contact = Marionette.ItemView.extend({\n\
    \                template: viewTpl,\n\n                events: {\n           \
    \         \"click a.js-edit\": \"editClicked\"\n                },\n\n       \
    \         editClicked: function(e){\n                    e.preventDefault();\n\
    \                    this.trigger(\"contact:edit\", this.model);\n           \
    \     }\n            });\n        });\n\n        return ContactManager.ContactsApp.Show.View;\n\
    });\n```\n\nOnce again, don't forget to have the views in their View sub-module\
    \ (declared on line 5, used on lines 8 and 12). Let's move on to the controller:"
