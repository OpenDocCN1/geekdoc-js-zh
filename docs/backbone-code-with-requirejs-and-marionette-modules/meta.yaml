  md: "```\nconsole.log(\"underscore identity call: \", _.identity(5));\nconsole.log(\"\
    underscore identity call: \", un.identity(5));\n});\n```\n\nFirst, we indicate\
    \ where Underscore is located (line 5). With that done, we add the \"underscore\"\
    \ key to the shim object and indicate that it should return the value of the \"\
    _\" global to the callback function. Notice that, thanks to the shim, we have\
    \ access to both the global \"_\" value (line 17) and the un callback value (line\
    \ 18). If we hadn't used a shim, we wouldn't be able to use the un callback value,\
    \ only the \"_\" global.\n\n> How come we require 2 files, but have only one callback\
    \ argument? Because we only explicitly state the callback arguments we're going\
    \ to be using (and for which we need a variable to reference). So why bother having\
    \ the \"jquery\" as a dependency? Because even though we're not using an explicit\
    \ callback argument value, we know that within the callback function jQuery has\
    \ been loaded and can be used via the global $ variable. This is due to jQuery's\
    \ particularity of registering a global variable we can reference: there's no\
    \ need to use a callback argument.\n\nLet's move on to loading something with\
    \ dependencies: Backbone. Here we go:\n\n# assets/js/require_main.js\n\n```\n\
    requirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n    backbone: \"vendor/backbone\"\
