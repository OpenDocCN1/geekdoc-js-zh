    \ Editing Contacts with a Modal\n\nNaturally, the solution is to add Backbone.Syphon\
    \ to our *require_main.js* file, and declare it as a dependency for our common\
    \ contact form.\n\n### Adding Backbone.Syphon to assets/js/require_main.js\n\n\
    ```javascript\nrequirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n   \
    \ backbone: \"vendor/backbone\",\n    \"backbone.syphon\": \"vendor/backbone.syphon\"\
    ,\n    // edited for brevity\n  },\n\n  shim: {\n    // edited for brevity\n \
    \   backbone: {\n      deps: [\"jquery\", \"underscore\", \"json2\"],\n      exports:\
    \ \"Backbone\"\n    },\n    \"backbone.syphon\": [\"backbone\"],\n    // edited\
