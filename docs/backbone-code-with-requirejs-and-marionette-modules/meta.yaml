  md: '# # Listing Contacts


    So far, we''ve got our main app starting properly, requiring its dependencies,
    and displaying a message in the console. In this chapter, we''ll work on getting
    our list of contacts displayed. The first thing we need to do is turn our contacts
    entity into a module.


    When rewriting an existing application to use RequireJS, it''s important to structure
    your approach based on the dependency tree, and to work in as small increments
    as possible. This allows you to check your reimplementation with less new code,
    and allows you to track down issues much more efficiently. Naturally, this is
    an established best practice but it takes on particular importance when working
    with RequireJS: trying to determine why certain libraries won''t load properly
    after a huge diff is not enjoyable.


    With that in mind, here''s how we will approach this iteration:


    +   1. Define modules for our contact entity, and make sure it''s working properly
    (from the console);

    2. Require the module from the main app file, and check we can work with it properly
    when loading it as a dependency;

    3. Ensure we can obtain the contacts from the "list" controller;

    4. Display the contact within views;

    5. Using RequireJS to load the view templates.


    # # Modularizing the Contact Entity


    ![](img/9187ef8c47fe9c0a5221f8482c870d45_26_0.png)


    Let''s get started: first, you need to make a module out of our configuration
    for localstorage use (at *assets/js/apps/config/storage/localstorage.js*). Don''t
    forget that this module will depend on the Backbone.localstorage plugin, and that
    in turn the plugin depends on Backbone.


    You can see the solution on the next page.'
  merge: -1
  pgno: 26
