    \ \"vendor/underscore\"\n  },\n\n  shim: {\n    underscore: {\n      exports:\
    \ \"_\"\n    },\n    backbone: {\n      deps: [\"jquery\", \"underscore\", \"\
    json2\"],\n      exports: \"Backbone\"\n    }\n  }\n});\n```"
