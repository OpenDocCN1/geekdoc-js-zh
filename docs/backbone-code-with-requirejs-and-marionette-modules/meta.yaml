    main-region\" class=\"container\">\n      <p>Here is static content in the web\
    \ page. You'll notice that\n         it gets replaced by our app as soon as we\
    \ start it.</p>\n    </div>\n\n    <div id=\"dialog-region\"></div>\n\n    <script\
    \ src=\"./assets/js/require_main.built.js\"></script>\n  </body>\n</html>\n```\n\
    \n注意在第21行，我们只包含了编译后的文件：RequireJS 和 Almond *没有*被包含。\n\n我们现在可以重新加载我们的应用，哎呀，它不工作了！除了其他错误，我们得到了\
    \ \"Error: undefined missing entities/header\" 错误。这怎么可能呢，它在 RequireJS 下明明工作得很好？这是因为我们有嵌套的\
