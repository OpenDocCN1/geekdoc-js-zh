    \ when trying to run this line of code:\n\n```\nEdit.Contact = ContactManager.ContactsApp.Common.Views.Form.extend({...});\n\
    ```\n\nThis, in turn, is because there is no \"ContactManager.ContactsApp.Common\"\
    \ module defined, as explained above.\n\n> Note that the error were raised in\
    \ *assets/js/apps/contacts/edit/edit_view.js*, but were actually due to our code\
    \ in *apps/contacts/common/views.js*. It's important you don't just take the errors\
    \ at face value, and take the time to trace the code to see what is really happening.\
