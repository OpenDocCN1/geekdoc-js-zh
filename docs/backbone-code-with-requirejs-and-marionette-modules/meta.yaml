  md: "# assets/js/build.js\n\n```\n({\n    baseUrl: \".\",\n    name: \"vendor/almond\"\
    ,\n    include: \"require_main\",\n    mainConfigFile:Ranking \"require_main.js\"\
    ,\n    out: \"require_main.built.js\"\n})\n```\n\nNotice the changes on lines\
    \ 3 and 4: we're telling the optimizer to build Almond and *include* our main\
    \ application. After recompiling our app, we adapt our index page:\n\n# index.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
