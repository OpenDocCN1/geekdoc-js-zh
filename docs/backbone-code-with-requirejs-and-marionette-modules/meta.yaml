- md: "## Reimplementing the About Sub-Application\n\nWe've now worked our way up\
    \ to the \"about\" sub-application's level, so let's adapt that file:\n\n```javascript\n\
    assets/js/apps/about/show/show_controller.js\ndefine([\"app\", \"apps/about/show/show_view\"\
    ], function(ContactManager, View){\n    ContactManager.module(\"AboutApp.Show\"\
    , function(Show, ContactManager,\n                                           \
    \                 Backbone, Marionette, $, _){\n        Show.Controller = {\n\
    \            showAbout: function(){\n                var view = new View.Message();\n\
    \                ContactManager.mainRegion.show(view);\n            }\n      \
    \  };\n    });\n\n    return ContactManager.AboutApp.Show.Controller;\n});\n```\n\
    \n```javascript\nassets/js/apps/about/about_app.js\ndefine([\"app\"], function(ContactManager){\n\
    \    ContactManager.module(\"AboutApp\", function(AboutApp, ContactManager,\n\
    \                                                            Backbone, Marionette,\
    \ $, _){\n        AboutApp.Router = Marionette.AppRouter.extend({\n          \
    \  appRoutes: {\n                \"about\" : \"showAbout\"\n            }\n  \
    \      });\n\n        var API = {\n            showAbout: function(){\n      \
    \          require([\"apps/about/show/show_controller\"], function(ShowController){\n\
    \                    ShowController.showAbout();\n                });\n      \
    \      }\n        };\n\n        ContactManager.on(\"about:show\", function(){\n\
    \            ContactManager.navigate(\"about\");\n            API.showAbout();\n\
    \        });\n\n        ContactManager.addInitializer(function(){\n          \
    \  new AboutApp.Router({\n                controller: API\n            });\n \
    \       });\n    });\n\n    return ContactManager.AboutApp;\n});\n```\n\nAnd finally,\
    \ we need the main application to require the \"about\" sub-app before starting,\
    \ so our sub-application is listening for route changes by the time we execute\
    \ Backbone's `history.start`. If you fail to do this, users won't be able to route\
    \ directly to the \"about\" sub-application by entering the URL fragment into\
    \ the address bar, because no routing controller will be listening for the navigation\
    \ event when it is triggered.\n\n### assets/js/app.js\n\n```javascript\nContactManager.on(\"\
    initialize:after\", function(){\n    if(Backbone.history){\n        require([\"\
    apps/contacts/contacts_app\", \"apps/about/about_app\"], function () {\n     \
    \       Backbone.history.start();\n\n            if(ContactManager.getCurrentRoute()\
    \ === \"\"){\n                ContactManager.trigger(\"contacts:list\");\n   \
    \         }\n        });\n    }\n});\n```\n\nGreat! Our \"about\" app is now working\
    \ properly!\n\n---\n\n## About this application\n\nThis application was designed\
    \ to accompany you during your learning.\nHopefully, it has served you well!\n\
    \nThe “about” message\n\nGit commit reimplementing the “about” sub-application:\n\
    343f847f2af2b817af7bf86e1dc716613f18b3a4\n\n<https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/343f847f2af2b817af7bf86e1dc716613f18b3a4>\n\
    \n## Reimplementing the Header Sub-Application\n\nThe last step in converting\
    \ our application to using RequireJS is to reimplement the header sub-application,\
    \ so it manages the navigation menu for us. The header sub-app is slightly different\
    \ in how it needs to be reimplemented, but I'll let you debug that on your own.\n\
    \n> Reimplement the header sub-app. As mentioned, you'll need to use some critical\
    \ thinking because it's not entirely comparable to a \"standard\" sub-app such\
    \ as the \"contacts\" sub-app.\n> Things you should bear in mind:\n>\n> 1.  This\
    \ sub-app will depend on an external library;\n> 2.  Event listeners need to be\
    \ registered before that event is triggered, or nothing will happen (otherwise\
    \ they wouldn't be listening soon enough);\n> 3.  Pay attention to the contents\
    \ of *assets/js/apps/header/header_app.js*.\n\nAs usual, the solution follows.\n\
    \n### Exercise Solution\n\nWe're going to need access to our header models before\
    \ we can render them, so let's convert them into a RequireJS module. But the headers\
    \ will depend on `Backbone.Picky` to mark the active header, so let's add it to\
    \ *assets/js/require_main.js* first:\n\n```javascript\nassets/js/require_main.js\n\
    requirejs.config({\n    baseUrl: \"assets/js\",\n    paths: {\n        backbone:\
    \ \"vendor/backbone\",\n        \"backbone.picky\": \"vendor/backbone.picky\"\
    ,\n        \"backbone.syphon\": \"vendor/backbone.syphon\",\n        // edited\
    \ for brevity\n    },\n```\n\nNow we can convert our header to a RequireJS module,\
    \ including its dependency:\n\n```javascript\nassets/js/entities/header.js\ndefine([\"\
    app\", \"backbone.picky\"], function(ContactManager){\n    ContactManager.module(\"\
    Entities\", function(Entities, ContactManager,\n        Backbone, Marionette,\
    \ $, _){\n        // edited for brevity\n    });\n\n    return ;\n});\n```\n\n\
    Once again, we have an empty return value, because we're going to access the headers\
    \ via the request-response mechanism. In the same vein, we're adding the headers\
    \ to the shared Entities module.\n\nOf course, we're going to need to display\
    \ these headers, so let's create templates for them:\n\n**Template for one header\
    \ item** (assets/js/apps/header/list/templates/list\\_item.tpl)\n\n```html\n<a\
    \ href=\"#<%= url %>\"><%= name %></a>\n```\n\n### Template to contain all headers\
    \ (assets/js/apps/header/list/templates/list.tpl)\n\n```html\n<div class=\"navbar-inner\"\
    >\n  <div class=\"container\">\n    <a class=\"brand\" href=\"#contacts\">Contact\
    \ manager</a>\n    <div class=\"nav-collapse collapse\">\n      <ul class=\"nav\"\
    ></ul>\n    </div>\n  </div>\n</div>\n```\n\nWith the templates written, we can\
    \ implement the view module:\n\n### assets/js/apps/header/list/list\\_view.js\n\
    \n```javascript\ndefine([\"app\",\n        \"tpl!apps/header/list/templates/list.tpl\"\
    ,\n        \"tpl!apps/header/list/templates/list_item.tpl\"],\n       function(ContactManager,\
    \ listTpl, listItemTpl){\n    ContactManager.module(\"HeaderApp.List.View\", function(View,\
    \ ContactManager,\n                                                          Backbone,\
    \ Marionette, $, _){\n        View.Header = Marionette.ItemView.extend({\n   \
    \         template: listItemTpl,\n            tagName: \"li\",\n\n           \
    \ // edited for brevity\n        });\n\n        View.Headers = Marionette.CompositeView.extend({\n\
    \            template: listTpl,\n            className: \"navbar navbar-inverse\
    \ navbar-fixed-top\",\n            itemView: View.Header,\n            itemViewContainer:\
    \ \"ul\",\n\n            // edited for brevity\n        });\n    });\n\n    return\
    \ ContactManager.HeaderApp.List.View;\n});\n```\n\nMoving on to the controller,\
    \ we can turn it into a RequireJS module:\n\n### assets/js/apps/header/list\\\
    _controller.js\n\n```javascript\ndefine([\"app\", \"apps/header/list/list_view\"\
    ], function(ContactManager, View){\n    ContactManager.module(\"HeaderApp.List\"\
    , function(List, ContactManager,\n                                           \
    \           Backbone, Marionette, $, _){\n        List.Controller = {\n      \
    \      listHeader: function(){\n                require([\"entities/header\"],\
    \ function(){\n                    var links = ContactManager.request(\"header:entities\"\
    );\n                    var headers = new View.Headers({collection: links});\n\
    \n                    // edited for brevity\n\n                    ContactManager.headerRegion.show(headers);\n\
    \                });\n            },\n\n            setActiveHeader: function(headerUrl){\n\
    \                // edited for brevity\n            }\n        };\n    });\n\n\
    \    return ContactManager.HeaderApp.List.Controller;\n});\n```\n\n> Don't forget\
    \ to require the \"header entity\" module on line 6.\n\nWith our controller reimplemented,\
    \ let's continue with the main \"header\" file:\n\n### assets/js/apps/header/header\\\
    _app.js\n\n```javascript\ndefine([\"app\"], function(ContactManager){\n    ContactManager.module(\"\
    HeaderApp\", function(Header, ContactManager,\n                              \
    \           Backbone, Marionette, $, _){\n        var API = {\n            listHeader:\
    \ function(){\n                require([\"apps/header/list/list_controller\"],\
    \ function(ListController){\n                    ListController.listHeader();\n\
    \                });\n            }\n        };\n\n        ContactManager.commands.setHandler(\"\
    set:active:header\", function(name){\n            ContactManager.HeaderApp.List.Controller.setActiveHeader(name);\n\
    \        });\n\n        Header.on(\"start\", function(){\n            API.listHeader();\n\
    \        });\n    });\n\n    return ContactManager.HeaderApp;\n});\n```\n\nNow\
    \ that our \"header\" app is fully reimplemented, let's tackle the tricky part.\
    \ As you can see on lines 16-18 above, the sub-app registers a \"start\" listener\
    \ with code to execute when this sub-module is started. Since we have *not* set\
    \ this module's `startWithParent` value to `false`, it will be started with the\
    \ parent module. As it happens, the parent module is the main application: in\
    \ other words, the \"header\" sub-app will be started as soon as the `ContactManager`\
    \ main application is started.\n\nIf we want the code in our \"start\" listener\
    \ to be executed, we're going to have to make sure the listener gets registered\
    \ before `ContactManager` is started, or by the time the event listener is configured\
    \ and waiting, the event will already have fired. End result: nothing happens,\
    \ and developers go crazy looking for bugs... How can we make sure the listener\
    \ is active before our main application is started? Simply by requiring it before\
    \ calling our app's start method:"
