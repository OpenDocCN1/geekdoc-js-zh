  md: 'And now our contact editing functionality works as expected!


    # Expliciting Dependencies


    Note that the module we’ve defined in `apps/contacts/common/views.js` returns
    the module definition. Therefore, we can adapt our code in `assets/js/apps/contacts/edit/edit_view.js`
    to take advantage of that fact.


    ```

    Original assets/js/apps/contacts/edit/edit_view.js


    1 define(["app", "apps/contacts/common/views"], function(ContactManager){

    2   ContactManager.module("ContactsApp.Edit", function(Edit, ContactManager,

    3                                                  Backbone, Marionette, $, _){

    4     Edit.Contact = ContactManager.ContactsApp.Common.Views.Form.extend({

    5       // edited for brevity

    6     });

    7   });

    8 });

    ```


    ```

    Improved assets/js/apps/contacts/edit/edit_view.js


    1 define(["app", "apps/contacts/common/views"],

    2        function(ContactManager, CommonViews){

    3   ContactManager.module("ContactsApp.Edit", function(Edit, ContactManager,

    4                                                  Backbone, Marionette, $, _){

    5     Edit.Contact = CommonViews.Form.extend({

    6       // edited for brevity

    7     });

    8   });

    9 });

    ```


    Here, we’ve made use of the module definition’s return value on line 2, and used
    it on line 5. Our app worked fine before, so why are we changing this? It makes
    dependencies obvious: in the second version, you can clearly see that the `Form`
    we’re using is defined in the `CommonViews` module from file `apps/contacts/common/views.js`.
    But both code versions are functionally equivalent, and neither introduces any
    global variables (thanks to our using Marionette modules to encapsulate everything).
    Ultimately, the version you chose will come down to personal taste.'
