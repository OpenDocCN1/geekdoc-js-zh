    \n## Mixing and Matching Modules\n\nWe've talked about why you might want to use\
    \ Marionette modules in a RequireJS project [earlier](#), and we also saw how\
    \ you could write a [plain RequireJS module](#) in your project. Naturally, in\
    \ some cases you might want to use both types of modules: plain RequireJS modules\
    \ for sub-apps that don't need to (un)load libraries and resources, and Marionette\
    \ modules for those that do. To cover this use case, we'll convert our \"about\"\
    \ sub-app to use only plain RequireJS modules.\n\n## Converting the About Sub-Application\
    \ to Plain RequireJS Modules\n\nassets/js/apps/about/about_view.js\n\n```\ndefine([\"\
    marionette\", \"tpl!apps/about/show/templates/message.tpl\"],\n  function(Marionette,\
    \ messageTpl){\n  return {\n    Message: Marionette.ItemView.extend({\n      template:\
    \ messageTpl\n    })\n  };\n});\n```\n\nassets/js/apps/about/show/show_controller.js\n\
    \n```\ndefine([\"app\", \"apps/about/show/show_view\"], function(ContactManager,\
    \ View){\n  return {\n    showAbout: function(){\n      var view = new View.Message();\n\
    \      ContactManager.mainRegion.show(view);\n    }\n  };\n});\n```\n\nassets/js/apps/about/about_app.js\n\
    \n```\ndefine([\"app\", \"marionette\"], function(ContactManager, Marionette){\n\
    \  var Router = Marionette.AppRouter.extend({\n    appRoutes: {\n      \"about\"\
    \ : \"showAbout\"\n    }\n  });\n\n  var API = {\n    showAbout: function(){\n\
    \      require([\"apps/about/show/show_controller\"], function(ShowController){\n\
    \        ContactManager.startSubApp(\"AboutApp\");\n        ShowController.showAbout();\n\
    \        ContactManager.execute(\"set:active:header\", \"about\");\n      });\n\
    \    }\n  };\n\n  ContactManager.on(\"about:show\", function(){\n    ContactManager.navigate(\"\
    about\");\n    API.showAbout();\n  });\n\n  ContactManager.addInitializer(function(){\n\
    \    new Router({\n      controller: API\n    });\n  });\n\n  return Router;\n\
    });\n```\n\nIf you use the application now, you’ll see it works. However, our\
    \ start/stop code has a small issue we’ll need to fix. Here’s our current code:\n\
    \nLine 2 is causing trouble: the call to `module` returns the Marionette module\
    \ *if it exists*, otherwise it returns a *new* Marionette module. So in our case,\
    \ since the AboutApp Marionette module doesn't exist, it's going to be instantiated.\
    \ This isn't the behavior we want, so let's fix it.\n\n## Managing Start/Stop\
    \ with Mixed Module Types\n\nThe first thing we'll do is pass `null` to indicate\
    \ the current sub-app isn't a Marionette module, and therefore doesn't need to\
    \ be started or stopped.\n\nAs you can see, we've modified line 4 to pass the\
    \ `null` value, since our \"about\" app is no longer a Marionette module. Next,\
    \ we need to modify our module starting code to properly manage both module types.\n\
    \n```\nContactManager.startSubApp = function(appName, args){\n  var currentApp\
    \ = ContactManager.module(appName);\n  if (ContactManager.currentApp === currentApp){\
    \ return; }\n\n  if (ContactManager.currentApp){\n    ContactManager.currentApp.stop();\n\
    \  }\n\n  ContactManager.currentApp = currentApp;\n  currentApp.start(args);\n\
    };\n```\n\n```\nvar API = {\n  showAbout: function(){\n    require([\"apps/about/show/show_controller\"\
    ], function(ShowController){\n      ContactManager.startSubApp(null);\n      ShowController.showAbout();\n\
    \      ContactManager.execute(\"set:active:header\", \"about\");\n    });\n  }\n\
    };\n```\n\nassets/js/app.js\n\n```\n1 ContactManager.startSubApp = function(appName,\
    \ args){\n2   var currentApp = appName ? ContactManager.module(appName) : null;\n\
    3   if (ContactManager.currentApp === currentApp){ return; }\n4 \n5   if (ContactManager.currentApp){\n\
    6     ContactManager.currentApp.stop();\n7   }\n8 \n9   ContactManager.currentApp\
    \ = currentApp;\n10  if(currentApp){\n11    currentApp.start(args);\n12  }\n13\
    \ };\n```\n\nOur change is pretty straightforward:\n\n- we set `currentApp` to\
    \ the module (if it exists), or we use `null` (line 2);\n- if the current module\
    \ is a Marionette module, we stop it (lines 5-7);\n- if the new module is a Marionette\
    \ module, we start it (lines 10-12).\n\nWith this modification in place, our app\
    \ happily runs both module types!\n\n> Git commit mixing module types:\n[ef42ce031913810542566f928d84e26e2f7850c5](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/ef42ce031913810542566f928d84e26e2f7850c5)\n\
    \n## Optimizing the Application with r.js\n\nSo far, we’ve rewritten our app to\
    \ use a mix of “plain” RequireJS and Marionette modules, all handled by RequireJS.\
    \ As you’ll recall, RequireJS automatically handles the dependencies and loads\
    \ the javascript files in the proper order. However, this order doesn’t change\
    \ that often (certainly not on each page request), so why are we having this work\
    \ done over and over? Wouldn’t it be smarter to just compute the dependencies\
    \ once, store the resulting code in a single file and use that in our application?\
    \ Of course it is, and that’s one of the goals of r.js, the optimizer provided\
    \ by RequireJS.\n\nBefore we can run the optimizer on our application, we’ll need\
    \ to install node.js (download here41). Then, download the r.js file from here42\
    \ and store it in your application’s root path.43\n\nWith that out of the way,\
    \ we’re almost ready to run the optimizer. We’ll need a build file44:\n\n**assets/js/build.js**\n\
    \n```\n{\n  baseUrl: \".\",\n  name: \"require_main\",\n  mainConfigFile: \"require_main.js\"\
    ,\n  out: \"require_main.built.js\"\n}\n```\n\nHere’s what each attribute does\
    \ (find out more here45):\n\n- baseUrl defines the url from which all other paths\
    \ are determined, and it defaults to the build file’s path, in our case assets/js\
    \ (since that's where we've stored our build file). This would mean that our libraries\
    \ would be searched for within assets/js/assets/js, because the build file would\
    \ have a default base path of assets/js, and our main configuration file defines\
    \ its own baseUrl attribute as assets/js. Put both of those together, and we have\
    \ the optimizer looking for libraries in assets/js/assets/js, which isn't what\
    \ we want... Instead, we need to provide the actual path we want to use, relative\
    \ to the application's base directory. In our case we want it to be that same\
    \ base directory, hence the \".\" path;\n\n> http://nodejs.org/download/\n\n>\
    \ http://requirejs.org/docs/download.html#rjs\n\nNote that, per the instructions,\
    \ you can also use the optimizer after installing it with npm.\n\n> http://requirejs.org/docs/optimization.html#wholeproject\n\
    \n> https://github.com/jrburke/r.js/blob/master/build/example.build.js"
