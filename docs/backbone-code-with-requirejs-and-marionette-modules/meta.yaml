  - '[PAGE 14]


    With this configuration in place, we can now simply require “jquery” and RequireJS
    will know where to look. In addition, note that RequireJS will provide the array
    of dependencies as arguments to the callback function: in the code above, we have
    the “jquery” dependency assigned to the jq variable, which allows us to then call
    jq.fn.jquery to get jQuery’s version number. As you can tell from the console
    output, using the provided callback argument is equivalent to using the global
    $ variable.


    > JQuery’s case is a bit special, so let’s talk about it a bit. Ever since version
    1.7, jQuery is AMD-compatible meaning that it can be loaded with a module loader
    such as RequireJS. In that case, the module loader will receive a reference to
    jQuery which can be used in the callback function. All of this happens in addition
    to jQuery’s registering the global $ variable.


    However, with most other modules and libraries, no global variables will be registered.
    That’s one of the objectives when using RequireJS: don’t register objects in the
    global namespace, and require the ones you need instead, passing them into the
    callback function.


    # Using Shims


    We’ve seen how to load an AMD-commatible library (namely, jQuery), so let’s move
    on to loading one that is *not* compatible with AMD: Underscore. By using the
    new `shim` object in RequireJS, we can still load AMD-incompatible scripts with
    RequireJS: all we need to do is provide a little more information. Here we go:


    ```

    assets/js/require_main.js

    1 requirejs.config({

    2   baseUrl: "assets/js",

    3   paths: {

    4     jquery: "vendor/jquery",

    5     underscore: "vendor/underscore"

    6   },

    7

    8   shim: {

    9     underscore: {

    10      exports: "_"

    11    }

    12  }

    13 });

    14

    15 require(["underscore", "jquery"], function(un){

    16   console.log("jQuery version: ", $.fn.jquery);

    ```'
