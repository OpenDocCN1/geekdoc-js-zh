    \ RequireJS 库：\n\nindex.html\n\n```\n1 <script src=\"./assets/js/vendor/require.js\"\
    ></script>\n2 <script src=\"./assets/js/require_main.built.js\"></script>\n```\n\
    \n使用单个优化文件的 Git 提交：\na736595a0fecd466aee049ae91429c086b2b6049\n\n我们的应用现在可以正常加载了，但这似乎有点浪费，不是吗？我们加载了\
    \ RequireJS 及其所有功能（还有文件大小！），只是为了加载我们独特的模块。一定有更好的方法！\n\n## 使用 Almond.js 加载\n\n\
    Almond.js 是一个最小的 AMD 模块加载器，同样由 RequireJS 背后的 James Burke 编写。它旨在轻量化，以提供非常有限的功能集为代价，而这正是我们所寻找的！让我们从这里下载它并将其保存为\
