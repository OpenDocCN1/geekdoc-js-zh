  - '[PAGE 9]


    # # Why Use AMD?


    Asynchronous Module Definition (or AMD for short) is one answer to the problems
    that plague modern web development:


    +   * web applications require lots of javascript code;

    * to manage application complexity, javascript code needs to be broken down into
    smaller files;

    * these smaller javascript files have dependencies on one another that aren''t
    clear from their inclusion via <script> tags: the tag sequence only gives a rough
    sense of order, not a dependency tree;

    * loading a long list of javascript files with includes slows down your web page:
    each file requires a separate HTTP request, and is blocking.


    By using RequireJS in a web app, you get the following benefits:


    +   * your javascript code can be distributed among many smaller files;

    * you explicitly declare the dependencies each javascript module requires (both
    libraries and other modules);

    * you can build a single, optimized, and minified javascript file for production
    deployment.'
