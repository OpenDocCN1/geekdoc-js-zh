  md: "+   *   on lines 2-13, we define a new Marionette module called “ContactsApp”.\
    \ Within it, we\n    *   declare (on line 4) that it shouldn’t start with its\
    \ parent app (i.e. the main application);\n    *   add an `onStart` function (lines\
    \ 6-8) which will be executed each time the application starts. This is where\
    \ you would load extra libraries or data required by the sub-app;\n    *   add\
    \ an `onStop` function (lines 10-12) to free memory by dereferencing variables\
    \ (e.g. using `delete`<sup>38</sup> or by assigning them to `null`) that are no\
    \ longer of use when the user navigates away from the sub-app.\n*   on line 15,\
    \ we’ve renamed our module from `ContactsApp` to `Routers.ContactsApp`. This is\
    \ because we’re going to use the `Routers` Marionette module to hold all of our\
    \ routing controllers, and it will start (automatically) with the main application.\
    \ The rest of the code hasn’t been modified (except for renaming `ContactsApp`\
    \ to `ContactsAppRouter`, such as on line 30).\n\n> What about the sub-modules\
    \ such a List? We’re leaving those sub-modules as they are: we need their `startWithParent`\
    \ property to be `true` (which is the default value). This way, we prevent our\
    \ top-level `ContactsApp` from starting automatically when `ContactManager` is\
    \ started, but when we manually start `ContactsApp` its sub-modules (List, etc.)\
    \ will also start (because the are configured to `startWithParent`).\n\nWith this\
    \ code change, we’ve definind the top-level `ContactsApp` sub-application module\
    \ within *assets/js/apps/contact/contacts\\_app.js*, which is the first file to\
    \ get required for our contacts sub-app. Therefore, `ContactsApp`’s `startWithParent`\
    \ is set to `false` immediately and won’t start unless we explicitly start it\
    \ ourselves. We can then define the Marionette module with the routing controller\
    \ code, and use it as the return value for our RequireJS module.\n\nBut we’re\
    \ still missing a major piece of the puzzle: we need code to start the sub-app\
    \ we need, and stop all other sub-apps. Let’s imagine we have 2 very large Marionette\
    \ sub-applications that expose dashboards. One of them deals with customer data\
    \ (where they live, how often they shop, their profile, etc.), and the other displays\
    \ aggregate financial information (e.g. sales over the last 2 weeks by customer\
    \ segment, number of visits, stock turnover, etc.). Both of these sub-applications\
    \ provide advanced analytics and multiple ways to display and regroup data.\n\n\
    To enhance performance, the most frequently analyzed data is loaded when the sub-app\
    \ is initialized. This way, when a user wants to change the analysis he’s looking\
    \ at (e.g. from “overall sales” to “single male sales”), the sub-app already has\
    \ the data available and can display the new analysis rapidly. Unfotrunately,\
    \ all this data takes up memory, and when the user moves on to a different sub-app,\
    \ this data isn’t necessary anymore: the memory it’s using should be freed. This\
    \ can be accomplished by stopping the current module, and dereferencinging the\
    \ loaded data within the Marionette module’s `onStop` method.\n\nWith all this\
    \ module starting and stopping happening, it becomes necessary to have a function\
    \ we can call to ensure the sub-app wewant to use is active, and stop all the\
    \ others. Here’s what it looks like:\n\n<sup>38</sup>https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/delete"
