    \ for sub-apps that don't need to (un)load libraries and resources, and Marionette\
    \ modules for those that do. To cover this use case, we'll convert our \"about\"\
    \ sup-app to use only plain RequireJS modules.\n\n# Converting the About Sub-Application\
    \ to Plain RequireJS Modules\n\nassets/js/apps/about/about_view.js\n\n```\ndefine([\"\
    marionette\", \"tpl!apps/about/show/templates/message.tpl\"],\n  function(Marionette,\
