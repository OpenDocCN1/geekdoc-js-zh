  md: "# # Loading the Main App\n\nNow that we understand the basics about how RequireJS\
    \ works, let's use it to require our Contact Manager application and start it.\
    \ We'll start with a very basic app file, to give us a first taste of defining\
    \ and working with RequireJS modules. You should already have a file in *assets/js/app.js*,\
    \ so save it elsewhere, or just overwrite it. We don't need it yet, but will be\
    \ using it soon enough. Here's our basic application:\n\nassets/js/app.js\n\n\
    ```\nvar ContactManager = new Marionette.Application();\n\nContactManager.on(\"\
    initialize:after\", function(){\n  console.log(\"Contact Manager has started\"\
    );\n});\n```\n\n⚠️ This code should be obvious to you. If not I suggest you read\
    \ my [book introducing Marionette](https://leanpub.com/marionette-gentle-introduction).\n\
    \nAll our app does for now is print a message to the console once it has started,\
    \ which is enough to start working with RequireJS. So now what? To be able to\
    \ use our Contact Manager application as a dependency, we'll need to define it\
    \ as a RequireJS module. In simple terms, a RequireJS module indicates the required\
    \ dependencies, and returns a value to be used in the callback function provided\
    \ to a require call.\n\n# # Discovering Modules\n\nIf you look at our simple code\
    \ above, you can see that we're going to need access to Marionette. In addition,\
    \ we're going to need access to ContactManager in many places in our application,\
    \ e.g. to define modules. Here's what our Contact Manager looks like as a RequireJS\
    \ module:\n\n[16](https://leanpub.com/marionette-gentle-introduction)"
