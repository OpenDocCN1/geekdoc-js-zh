    stylesheet\">\n    <link href=\"./assets/css/jquery-ui-1.10.0.custom.css\" rel=\"\
    stylesheet\">\n  </head>\n\n  <body>\n    <div id=\"header-region\"></div>\n\n\
    \    <div id=\"main-region\" class=\"container\">\n      <p>Here is static content\
    \ in the web page. You'll notice that\n         it gets replaced by our app as\
    \ soon as we start it.</p>\n    </div>\n\n    <div id=\"dialog-region\"></div>\n\
    \n    <script src=\"./assets/js/require_main.built.js\"></script>\n  </body>\n\
    </html>\n```\n\nNotice that on line 21, we include only the compiled file: RequireJS\
    \ and Almond do *not* get included."
