  md: "# Reimplementing the Header Sub-Application\n\n```\nassets/js/apps/header/header_app.js\n\
    \ndefine([\"app\"], function(ContactManager){\n  ContactManager.module(\"HeaderApp\"\
    , function(Header, ContactManager,\n                                         \
    \  Backbone, Marionette, $, _){\n    var API = {\n      listHeader: function(){\n\
    \        require([\"apps/header/list/list_controller\"], function(ListController){\n\
    \          ListController.listHeader();\n        });\n      }\n    };\n\n    ContactManager.commands.setHandler(\"\
    set:active:header\", function(name){\n      ContactManager.HeaderApp.List.Controller.setActiveHeader(name);\n\
    \    });\n\n    Header.on(\"start\", function(){\n      API.listHeader();\n  \
    \  });\n  });\n\n  return ContactManager.HeaderApp;\n});\n```\n\nNow that our\
    \ \"header\" app is fully reimplemented, let's tackle the tricky part. As you\
    \ can see on lines 16-18 above, the sub-app registers a \"start\" listener with\
    \ code to execute when this sub-module is started. Since we have *not* set this\
    \ module's `startWithParent` value to `false`, it will be started with the parent\
    \ module. As it happens, the parent module is the main application: in other words,\
    \ the \"header\" sub-app will be started as soon as the `ContactManager` main\
    \ application is started.\n\nIf we want the code in our \"start\" listener to\
    \ be executed, we're going to have to make sure the listener gets registered before\
    \ `ContactManager` is started, or by the time the event listener is configured\
    \ and waiting, the event will already have fired. End result: nothing happens,\
    \ and developers go crazy looking for bugs... How can we make sure the listener\
    \ is active before our main application is started? Simply by requiring it before\
    \ calling our app's start method:"
