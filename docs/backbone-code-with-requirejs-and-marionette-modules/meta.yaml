    \       });\n    });\n\n    return ContactManager.AboutApp;\n});\n```\n\n最后，我们需要主应用在启动前先加载“关于”子应用，这样在我们执行\
    \ Backbone 的 `history.start` 时，子应用已经准备好监听路由变化。如果未这样做，用户将无法通过在地址栏输入 URL 片段直接路由到“关于”子应用，因为在导航事件触发时，没有路由控制器在监听它。\n\
    \n### assets/js/app.js\n\n```javascript\nContactManager.on(\"initialize:after\"\
    , function(){\n    if(Backbone.history){\n        require([\"apps/contacts/contacts_app\"\
    , \"apps/about/about_app\"], function () {\n            Backbone.history.start();\n\
    \n            if(ContactManager.getCurrentRoute() === \"\"){\n               \
    \ ContactManager.trigger(\"contacts:list\");\n            }\n        });\n   \
    \ }\n});\n```\n\n太好了！我们的“关于”应用现在可以正常工作了！\n\n---\n\n## 关于本应用\n\n本应用旨在陪伴你的学习过程。\n\
    希望它对你有所帮助！\n\n“关于”信息\n\n重新实现“关于”子应用的 Git 提交：\n343f847f2af2b817af7bf86e1dc716613f18b3a4\n\
