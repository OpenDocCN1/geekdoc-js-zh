- md: "## What if I don't want to use Git, and only want the latest version of the\
    \ code?\n\nYou can download a [zipped copy of the repository](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/archive/master.zip)⁷.\
    \ This will contain the full Git commit history, in case you change your mind\
    \ about following along.\n\n## Jumping in for Advanced Readers\n\nMy goal with\
    \ this book is to get you comfortable enough to use RequireJS in your own Marionette\
    \ projects, and to rebuild an existing application from start to finish with RequireJS.\
    \ Therefore, after presenting the main concepts you need to know when using RequireJS,\
    \ the book guides you in rewriting the ContactManager application by pointing\
    \ out various aspects to bear in mind, and then providing a step by step guide\
    \ to the actual implementation.\n\nAlthough you'll learn the most by following\
    \ along with the code, you can simply skim the content and checkout the Git commit\
    \ corresponding to the point in the book where you wish to join in.\n\n## Why\
    \ Use AMD?\n\nAsynchronous Module Definition (or AMD for short) is one answer\
    \ to the problems that plague modern web development:\n\n- web applications require\
    \ lots of JavaScript code;\n- to manage application complexity, JavaScript code\
    \ needs to be broken down into smaller files;\n- these smaller JavaScript files\
    \ have dependencies on one another that aren't clear from their inclusion via\
    \ `<script>` tags: the tag sequence only gives a rough sense of order, not a dependency\
    \ tree;\n- loading a long list of JavaScript files with includes slows down your\
    \ web page: each file requires a separate HTTP request, and is blocking.\n\nBy\
    \ using RequireJS in a web app, you get the following benefits:\n\n- your JavaScript\
    \ code can be distributed among many smaller files;\n- you explicitly declare\
    \ the dependencies each JavaScript module requires (both libraries and other modules);\n\
    - you can build a single, optimized, and minified JavaScript file for production\
    \ deployment.\n\n## Getting Started\n\nFirst, let's grab a copy of the source\
    \ code for our basic Contact Manager application (as it was developed in my \"\
    [Backbone.Marionette.js: A Gentle Introduction](https://leanpub.com/marionette-gentle-introduction)\"\
    \ book) from [here](https://github.com/davidsulc/marionette-gentle-introduction/archive/master.zip).\
    \ We're doing this for convenience, since we'll now have all libraries and assets\
    \ (images, icons, etc.) available and won't have to deal with fetching them in\
    \ the next chapters. Downloading the entire app also means we have all of our\
    \ modules ready to go, simply waiting to be integrated in our RequireJS app.\n\
    \nNow, let's start with a basic `index.html` file, by removing all javascript\
    \ includes, and templates:\n\n### Our initial index.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Marionette\
    \ Contact Manager</title>\n    <link href=\"./assets/css/bootstrap.css\" rel=\"\
    stylesheet\">\n    <link href=\"./assets/css/application.css\" rel=\"stylesheet\"\
    >\n    <link href=\"./assets/css/jquery-ui-1.10.0.custom.css\" rel=\"stylesheet\"\
    >\n  </head>\n\n  <body>\n    <div id=\"header-region\"></div>\n\n    <div id=\"\
    main-region\" class=\"container\">\n      <p>Here is static content in the web\
    \ page. You'll notice that it\n         gets replaced by our app as soon as we\
    \ start it.</p>\n    </div>\n\n    <div id=\"dialog-region\"></div>\n  </body>\n\
    </html>\n```\n\nYou may have noticed that we've got some CSS includes that aren't\
    \ needed yet. We'll just leave them there, so we can avoid dealing with them later:\
    \ they'll already be included when we do need them.\n\nGit commit with our basic\
    \ index.html:\n32fce9a507ac80b9b27e364536de9e7adeeb203f¹⁰\n\n## Adding RequireJS\
    \ to the Mix\n\nWith our basic `index.html` in place, let's move on to our next\
    \ goal: using RequireJS to load our libraries. So let's get RequireJS from [here](http://requirejs.org/docs/release/2.1.8/comments/require.js)¹¹\
    \ and save it in `assets/js/vendor/require.js`. Now, we can add RequireJS to our\
    \ `index.html` (line 22):\n\n### Adding RequireJS (index.html)\n\n```\n1  <!DOCTYPE\
    \ html>\n2  <html lang=\"en\">\n3    <head>\n4      <meta charset=\"utf-8\">\n\
    5      <title>Marionette Contact Manager</title>\n6      <link href=\"./assets/css/bootstrap.css\"\
    \ rel=\"stylesheet\">\n7      <link href=\"./assets/css/application.css\" rel=\"\
    stylesheet\">\n8      <link href=\"./assets/css/jquery-ui-1.10.0.custom.css\"\
    \ rel=\"stylesheet\">\n9    </head>\n10\n11   <body>\n12\n13     <div id=\"header-region\"\
    ></div>\n14\n15     <div id=\"main-region\" class=\"container\">\n16       <p>Here\
    \ is static content in the web page. You'll notice that it\n17         gets replaced\
    \ by our app as soon as we start it.</p>\n18     </div>\n19\n20     <div id=\"\
    dialog-region\"></div>\n21\n22     <script src=\"./assets/js/vendor/require.js\"\
    ></script>\n23   </body>\n24 </html>\n```\n\nSo how do we actually load our libraries\
    \ with RequireJS? We're going to add a `data-main` attribute to the `script` tag,\
    \ which will make RequireJS automatically load the provided javascript file. This\
    \ file, in turn, will configure RequireJS per our environment, load the top-level\
    \ dependencies and libraries, and then start our Contact Manager application.\
    \ So let's change our script tag on line 22 to\n\n```\n<script data-main=\"./assets/js/require_main.js\"\
    \n        src=\"./assets/js/vendor/require.js\"></script>\n```\n\nThat was easy\
    \ enough! Of course, we now need to actually write *require_main.js* to provide\
    \ configuration directives. Let's start by simply using RequireJS to load jQuery\
    \ and display jQuery's version number:\n\n### assets/js/require_main.js\n\n```\n\
    require([\"vendor/jquery\"], function(){\n  console.log(\"jQuery version: \",\
    \ $.fn.jquery);\n});\n```\n\nIf you refresh index.html, you'll now see jQuery's\
    \ version number printed in the console. How is this happening? First, RequireJS\
    \ determines the `baseUrl`, which is the path from which all other paths are computed.\
    \ By default, it is set to the path provided to the data-main attribute above\
    \ (minus the file portion, of course). So in our case, the `baseUrl` is *assets/js*.\n\
    \nThen, within *require_main.js*, we call RequireJS's `require` function, which\
    \ takes 2 arguments:\n\n1. an array of dependencies that need to be loaded before\
    \ executing the callback function;\n2. a callback function that gets executed\
    \ once all the required dependencies have been loaded.\n\n> Note that RequireJS\
    \ also defines a `requirejs` function, which is interchangeable with `require`.\n\
    \nIn the dependency array, we provide the path to the file we want to load *relative\
    \ to the baseUrl path*. As we indicated jQuery was located at *vendor/jquery*,\
    \ and our `baseUrl` is *assets/js* (because that's where our *require_main.js*\
    \ file is located), RequireJS will look for the library file in *assets/js/vendor/jquery.js*.\
    \ So our code essentially instructs \"once jQuery is loaded from *assets/js/vendor/jquery.js*,\
    \ print its version number.\"\n\n> Note that we specify file without extensions.\
    \ For example, to require jQuery we had \"vendor/jquery\" as the dependency, and\
    \ RequireJS automatically added the \".js\" extension.\n\nBut we can still improve\
    \ our code by adding some global configuration:\n\n```\nassets/js/require_main.js\n\
    \nrequirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n    jquery: \"vendor/jquery\"\
    \n  }\n});\n\nrequire([\"jquery\"], function(jq){\n  console.log(\"jQuery version:\
    \ \", jq.fn.jquery);\n  console.log(\"jQuery version: \", $.fn.jquery);\n});\n\
    ```\n\nDue to the equivalence of `require` and `requirejs`, the config method\
    \ could also be called via `require.config`. Why do I use `requirejs` on line\
    \ 1 and then `require` on line 8? It's just a matter of personal taste: I find\
    \ that `requirejs.config` explicitly indicates we are configuring RequireJS, and\
    \ using the `require` function call reads better (i.e. \"require these files before\
    \ proceeding\"). But be aware of the `requirejs` and `require` synonyms when you\
    \ look at RequireJS code.\n\nSo we've added some configuration, but what does\
    \ it do? First, we provide a `baseUrl` path. This isn't really necessary in our\
    \ case (since we're using the same path as the default), but I find it helps with\
    \ clarity: since all the other paths indicated in the file will be defined relative\
    \ to the `baseUrl`, it's practical to have it explicitly defined on the same page.\n\
    \nNext, we've added a `paths`¹² object to specify paths that aren't directly under\
    \ the `baseUrl` path. This allows us to create a \"jquery\" key to use when requiring\
    \ the library, and RequireJS will know it should be loaded from the *vendor/jquery*\
    \ location.\n\nFrom the [documentation¹³](http://requirejs.org/docs/api.html#config-paths):\n\
    \nThe path that is used for a module name should **not** include an extension,\
    \ since the path mapping could be for a directory. The path mapping code will\
    \ automatically add the .js extension when mapping the module name to a path.\n\
    \nBy using [path fallbacks¹⁴](http://requirejs.org/docs/api.html#pathsfallbacks),\
    \ you can easily load libraries from CDNs and default to using a local version\
    \ should the CDN be unavailable."
  mdcn: "\n## 如果我不想使用 Git，只想获取代码的最新版本怎么办？\n\n你可以下载一份[仓库的压缩副本](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/archive/master.zip)⁷。这将包含完整的\
    \ Git 提交历史，以防你改变主意想要跟学。\n\n## 高级读者跳转指南\n\n本书的目标是让你能足够熟练地在自己的 Marionette 项目中使用\
    \ RequireJS，并能够从头到尾使用 RequireJS 重建一个现有应用。因此，在介绍了使用 RequireJS 时你需要了解的主要概念之后，本书将通过指出需要牢记的各个方面，然后提供具体的分步实现指南，来引导你重写\
    \ ContactManager 应用。\n\n尽管通过跟学代码你能学到最多，但你也可以简单浏览内容，然后检出与你希望加入的书中部分相对应的 Git 提交。\n\
    \n## 为什么使用 AMD？\n\n异步模块定义（简称 AMD）是解决困扰现代 Web 开发问题的一种方案：\n\n- Web 应用需要大量的 JavaScript\
    \ 代码；\n- 为了管理应用复杂性，JavaScript 代码需要被拆分成更小的文件；\n- 这些更小的 JavaScript 文件之间存在依赖关系，但通过\
    \ `<script>` 标签引入时并不清晰：标签顺序只提供了大致的顺序感，而非依赖树；\n- 加载一长串需要引入的 JavaScript 文件会拖慢你的网页速度：每个文件都需要单独的\
    \ HTTP 请求，并且是阻塞式的。\n\n通过在 Web 应用中使用 RequireJS，你将获得以下好处：\n\n- 你的 JavaScript 代码可以分布在许多更小的文件中；\n\
    - 你显式地声明每个 JavaScript 模块所需的依赖（包括库和其他模块）；\n- 你可以构建一个单独的、优化过的、压缩的 JavaScript 文件用于生产部署。\n\
    \n## 开始入门\n\n首先，让我们从[这里](https://github.com/davidsulc/marionette-gentle-introduction/archive/master.zip)获取我们基础\
    \ Contact Manager 应用的源代码副本（正如在我的 “[Backbone.Marionette.js: A Gentle Introduction](https://leanpub.com/marionette-gentle-introduction)”\
    \ 一书中所开发的那样）。这样做是为了方便，因为这样我们就能拥有所有的库和资源（图像、图标等），而无需在接下来的章节中处理获取它们的问题。下载整个应用也意味着我们所有的模块都已准备就绪，只待集成到我们的\
    \ RequireJS 应用中。\n\n现在，让我们从一个基础的 `index.html` 文件开始，移除所有的 JavaScript 包含和模板：\n\n\
    ### 我们最初的 index.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n \
    \   <meta charset=\"utf-8\">\n    <title>Marionette Contact Manager</title>\n\
    \    <link href=\"./assets/css/bootstrap.css\" rel=\"stylesheet\">\n    <link\
    \ href=\"./assets/css/application.css\" rel=\"stylesheet\">\n    <link href=\"\
    ./assets/css/jquery-ui-1.10.0.custom.css\" rel=\"stylesheet\">\n  </head>\n\n\
    \  <body>\n    <div id=\"header-region\"></div>\n\n    <div id=\"main-region\"\
    \ class=\"container\">\n      <p>Here is static content in the web page. You'll\
    \ notice that it\n         gets replaced by our app as soon as we start it.</p>\n\
    \    </div>\n\n    <div id=\"dialog-region\"></div>\n  </body>\n</html>\n```\n\
    \n你可能已经注意到，我们引入了一些暂时还不需要的 CSS。我们就把它们留在那里，这样以后就不用再处理它们了：当我们需要时，它们已经被包含了。\n\n包含我们基础\
    \ index.html 的 Git 提交：\n32fce9a507ac80b9b27e364536de9e7adeeb203f¹⁰\n\n## 将 RequireJS\
    \ 加入进来\n\n有了我们基础的 `index.html`，让我们进入下一个目标：使用 RequireJS 来加载我们的库。所以让我们从[这里](http://requirejs.org/docs/release/2.1.8/comments/require.js)¹¹\
    \ 获取 RequireJS 并将其保存在 `assets/js/vendor/require.js` 中。现在，我们可以将 RequireJS 添加到我们的\
    \ `index.html` 中（第 22 行）：\n\n### 添加 RequireJS (index.html)\n\n```\n1  <!DOCTYPE\
    \ html>\n2  <html lang=\"en\">\n3    <head>\n4      <meta charset=\"utf-8\">\n\
    5      <title>Marionette Contact Manager</title>\n6      <link href=\"./assets/css/bootstrap.css\"\
    \ rel=\"stylesheet\">\n7      <link href=\"./assets/css/application.css\" rel=\"\
    stylesheet\">\n8      <link href=\"./assets/css/jquery-ui-1.10.0.custom.css\"\
    \ rel=\"stylesheet\">\n9    </head>\n10\n11   <body>\n12\n13     <div id=\"header-region\"\
    ></div>\n14\n15     <div id=\"main-region\" class=\"container\">\n16       <p>Here\
    \ is static content in the web page. You'll notice that it\n17         gets replaced\
    \ by our app as soon as we start it.</p>\n18     </div>\n19\n20     <div id=\"\
    dialog-region\"></div>\n21\n22     <script src=\"./assets/js/vendor/require.js\"\
    ></script>\n23   </body>\n24 </html>\n```\n\n那么我们究竟如何用 RequireJS 加载我们的库呢？我们要给\
    \ `script` 标签添加一个 `data-main` 属性，这将使 RequireJS 自动加载提供的 JavaScript 文件。这个文件，反过来，将根据我们的环境配置\
    \ RequireJS，加载顶级依赖和库，然后启动我们的 Contact Manager 应用。所以让我们将第 22 行的 script 标签改为：\n\n\
    ```\n<script data-main=\"./assets/js/require_main.js\"\n        src=\"./assets/js/vendor/require.js\"\
    ></script>\n```\n\n这相当简单！当然，我们现在需要实际编写 *require_main.js* 来提供配置指令。让我们从简单地使用 RequireJS\
    \ 加载 jQuery 并显示 jQuery 的版本号开始：\n\n### assets/js/require_main.js\n\n```\nrequire([\"\
    vendor/jquery\"], function(){\n  console.log(\"jQuery version: \", $.fn.jquery);\n\
    });\n```\n\n如果你刷新 index.html，你现在会在控制台中看到 jQuery 的版本号。这是如何发生的？首先，RequireJS 确定 `baseUrl`，这是所有其他路径计算的基础路径。默认情况下，它被设置为提供给上面\
    \ data-main 属性的路径（当然，减去文件部分）。所以在我们的情况下，`baseUrl` 是 *assets/js*。\n\n然后，在 *require_main.js*\
    \ 中，我们调用 RequireJS 的 `require` 函数，它接受 2 个参数：\n\n1. 一个依赖数组，需要在执行回调函数之前加载这些依赖；\n\
    2. 一个回调函数，在所有必需的依赖加载完毕后执行。\n\n> 注意，RequireJS 也定义了一个 `requirejs` 函数，它与 `require`\
    \ 可以互换使用。\n\n在依赖数组中，我们提供*相对于 baseUrl 路径*的要加载文件的路径。正如我们指出的 jQuery 位于 *vendor/jquery*，而我们的\
    \ `baseUrl` 是 *assets/js*（因为那是我们的 *require_main.js* 文件所在的位置），RequireJS 将在 *assets/js/vendor/jquery.js*\
    \ 中查找库文件。所以我们的代码本质上指示“一旦 jQuery 从 *assets/js/vendor/jquery.js* 加载完成，就打印其版本号。”\n\
    \n> 注意，我们指定文件时不带扩展名。例如，为了请求 jQuery，我们使用 \"vendor/jquery\" 作为依赖，RequireJS 会自动添加\
    \ \".js\" 扩展名。\n\n但我们仍然可以通过添加一些全局配置来改进我们的代码：\n\n```\nassets/js/require_main.js\n\
    \nrequirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n    jquery: \"vendor/jquery\"\
    \n  }\n});\n\nrequire([\"jquery\"], function(jq){\n  console.log(\"jQuery version:\
    \ \", jq.fn.jquery);\n  console.log(\"jQuery version: \", $.fn.jquery);\n});\n\
    ```\n\n由于 `require` 和 `requirejs` 是等价的，config 方法也可以通过 `require.config` 调用。为什么我在第\
    \ 1 行使用 `requirejs` 而在第 8 行使用 `require`？这只是个人品味问题：我觉得 `requirejs.config` 明确表示我们正在配置\
    \ RequireJS，而使用 `require` 函数调用读起来更顺畅（即“在继续之前请求这些文件”）。但在阅读 RequireJS 代码时，请注意 `requirejs`\
    \ 和 `require` 这两个同义词。\n\n那么我们添加了一些配置，但它是做什么的呢？首先，我们提供了一个 `baseUrl` 路径。在我们的情况下这并不是必需的（因为我们使用的是与默认相同的路径），但我发现它有助于提高清晰度：由于文件中所有其他路径都将相对于\
    \ `baseUrl` 定义，在同一页上明确地定义它是很实用的。\n\n接下来，我们添加了一个 `paths`¹² 对象来指定不直接位于 `baseUrl`\
    \ 路径下的路径。这允许我们创建一个“jquery”键，在请求库时使用，RequireJS 就知道它应该从 *vendor/jquery* 位置加载。\n\n\
    根据[文档¹³](http://requirejs.org/docs/api.html#config-paths)：\n\n用于模块名称的路径**不应**包含扩展名，因为路径映射可能对应一个目录。路径映射代码在将模块名称映射到路径时会自动添加\
    \ .js 扩展名。\n\n通过使用[路径回退¹⁴](http://requirejs.org/docs/api.html#pathsfallbacks)，你可以轻松地从\
    \ CDN 加载库，并在 CDN 不可用时默认使用本地版本。\n"
