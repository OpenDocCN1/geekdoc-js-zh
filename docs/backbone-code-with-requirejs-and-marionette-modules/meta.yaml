    # Who This Book is For\n\nThis book is first and foremost for the readers of \"\
    Backbone.Marionette.js: A Gentle Introduction¹\" who want to take their knowledge\
    \ to the next level, by using RequireJS to structure their code and load dependencies.\n\
    \nTo follow along, you'll need to have at least passing familiarity with the Contact\
    \ Manager application developed in my previous book. Put another way, the focus\
    \ of this book is how to use RequireJS with Marionette: it does NOT explain how\
    \ to leverage the various components Marionette provides (that's covered in the\
    \ book linked above).\n\n¹https://leanpub.com/marionette-gentle-introduction\n\
    \n## Following Along with Git\n\nThis book is a step by step guide to rebuilding\
    \ the Contact Manager application to use RequireJS. As such, it's accompanied\
    \ by source code in a Git repository hosted at https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette².\n\
    \nThroughout the book, as we code our app, we'll refer to commit references within\
    \ the git repository like this:\n\n- Git commit with our basic index.html:\n\n\
    d54f31fc9c2463c435abf1a32a361406500bff65³\n\nThis will allow you to follow along\
    \ and see exactly how the code base has changed: you can either look at that particular\
    \ commit in your local copy of the git repository, or click on the link to see\
    \ an online display of the code differences.\n\n- Any change in the code will\
    \ affect all the following commit references, so the links in your version of\
    \ the book might become desynchronized. If that's the case, make sure you update\
    \ your copy of the book to get the new links. At any time, you can also see the\
    \ full list of commits here⁴, which should enable you to locate the commit you're\
    \ looking for (the commit names match their descriptions in the book).\n\n- Even\
    \ if you haven't used Git yet, you should be able to get up and running quite\
    \ easily using online resources such as the Git Book⁵. This chapter is by no means\
    \ a comprehensive introduction to Git, but the following should get you started:\n\
    \n- Set up Git with Github's instructions⁶\n- To get a copy of the source code\
    \ repository on your computer, open a command line and run git clone git://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette.git.\
    \ From the command line move into the structuring-backbone-with-requirejs-and-marionette\
    \ folder that Git created in the step above.\n\n![](img/9187ef8c47fe9c0a5221f8482c870d45_7_0.png)"
