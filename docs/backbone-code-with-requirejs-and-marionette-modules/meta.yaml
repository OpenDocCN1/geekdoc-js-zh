    # # Start/Stop Modules According to Routes


    In this chapter, we’ll get our modules to start and stop according to routes.
    If you’ve been paying attention in the previous chapter, you’ll remember that
    the main reason we’re using *Marionette* modules instead of plain RequireJS modules,
    is to be able to start/stop them (and their sub-modules) easily.


    Before we get into the thick of things, let’s take a moment to discuss *why* we’d
    want to start/stop modules according to routes. This is not an approach you should
    apply to all projects indiscriminately, as in many cases it will introduce extra
    complexity overhead with little benefit. So when would your app benefit from start/stop
    functionality? There are 2 main types of cases:


    +   - when your sub-application requires a library that isn’t used anywhere else
    (e.g. a graphing library);

    - when your app needs to load a lot of data on initialization, and needs to free
    the memory when another sub-application loads (e.g. a dashboard with drill-down
    functionality).


    In these cases, we’ll be able to load the libraries and/or data when the sub-app
    starts, and free the memory as the user navigates away from the sub-application
    (e.g. he’s no longer viewing the dashboard requiring advanced visualization and
    lots of data).


