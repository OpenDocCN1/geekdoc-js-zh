    \n## 重新实现头部子应用\n\n将我们的应用转换为使用 RequireJS 的最后一步是重新实现头部子应用，让它为我们管理导航菜单。头部子应用的重新实现方式略有不同，但我会让你自己来调试它。\n\
    \n> 重新实现头部子应用。如前所述，你需要运用一些批判性思维，因为它并不完全类似于“标准”的子应用（如“联系人”子应用）。\n> 你需要注意以下事项：\n\
    >\n> 1.  此子应用将依赖于一个外部库；\n> 2.  事件监听器需要在该事件被触发之前注册，否则将不会有任何反应（否则它们监听得不够及时）；\n>\
    \ 3.  注意 *assets/js/apps/header/header_app.js* 的内容。\n\n按照惯例，解答如下。\n\n### 练习解答\n\
    \n我们需要在渲染头部模型之前访问它们，因此让我们将它们转换为一个 RequireJS 模块。但头部将依赖 `Backbone.Picky` 来标记活动头部，因此让我们先将其添加到\
    \ *assets/js/require_main.js*：\n\n```javascript\nassets/js/require_main.js\nrequirejs.config({\n\
    \    baseUrl: \"assets/js\",\n    paths: {\n        backbone: \"vendor/backbone\"\
    ,\n        \"backbone.picky\": \"vendor/backbone.picky\",\n        \"backbone.syphon\"\
    : \"vendor/backbone.syphon\",\n        // 为简洁起见，已编辑\n    },\n```\n\n现在我们可以将头部转换为\
    \ RequireJS 模块，包括其依赖项：\n\n```javascript\nassets/js/entities/header.js\ndefine([\"\
    app\", \"backbone.picky\"], function(ContactManager){\n    ContactManager.module(\"\
    Entities\", function(Entities, ContactManager,\n        Backbone, Marionette,\
    \ $, _){\n        // 为简洁起见，已编辑\n    });\n\n    return ;\n});\n```\n\n我们再次得到了一个空的返回值，因为我们将通过请求-响应机制来访问头部。同样地，我们将头部添加到共享的\
    \ `Entities` 模块中。\n\n当然，我们需要显示这些头部，因此让我们为它们创建模板：\n\n**单个头部项的模板**（assets/js/apps/header/list/templates/list\\\
