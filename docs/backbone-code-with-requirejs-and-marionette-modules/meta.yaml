    \n## Editing Contacts with a Modal\n\nLet's continue adding functionality to our\
    \ “list” view, by enabling users to edit contacts from a modal window.\n\n![](img/9187ef8c47fe9c0a5221f8482c870d45_49_0.png)\n\
    \nEditing contact “Alice” The first thing we want, is our application to react\
    \ when the “edit” button is clicked (lines 8-10):\n\nassets/js/apps/contacts/list/list_controller.js\
    \ //edited for brevity\n\n```\n// edited for brevity\n\ncontactsListLayout.on(\"\
    show\", function(){\n  contactsListLayout.panelRegion.show(contactsListPanel);\n\
    \  contactsListLayout.contactsRegion.show(contactsListView);\n});\n\ncontactsListView.on(\"\
    itemview:contact:edit\", function(childView, model){\n  console.log(\"edit button\
    \ clicked\");\n});\n\ncontactsListView.on(\"itemview:contact:delete\", function(childView,\
    \ model){\n  model.destroy();\n});\n\n// edited for brevity\n```\n\n## Editing\
    \ Contacts with a Modal\n\nWhen we refresh the page and click an \"edit\" button,\
    \ we can see our message in the console. Great, now let's display the modal window,\
    \ using the original code:\n\n```\ncontactsListView.on(\"itemview:contact:edit\"\
    , function(childView, model){\n  var view = new ContactManager.ContactsApp.Edit.Contact({\n\
    \    model: model\n  });\n\n  view.on(\"form:submit\", function(data){\n    if(model.save(data)){\n\
    \      childView.render();\n      view.trigger(\"dialog:close\");\n      childView.flash(\"\
    success\");\n    }\n    else{\n      view.triggerMethod(\"form:data:invalid\"\
    , model.validationError);\n    }\n  });\n\n  ContactManager.dialogRegion.show(view);\n\
    });\n```\n\nIf we click an \"edit\" button after refreshing, we'll have an error:\
    \ \"TypeError: ContactManager.ContactsApp.Edit is undefined\", due to line 2 in\
    \ the code above. Why? Because we haven't required our view before trying to instantiate\
    \ it!\n\nNaturally, before we can include the \"edit\" view, we need to turn it\
    \ into a module. Here we go:\n\n```\ndefine([\"app\"], function(ContactManager){\n\
    \  ContactManager.module(\"ContactsApp.Edit.View\", function(View, ContactManager,\n\
    \                                                      Backbone, Marionette, $,\
    \ _){\n    View.Contact = ContactManager.ContactsApp.Common.Views.Form.extend({\n\
    \      initialize: function(){\n        this.title = \"Edit \" + this.model.get(\"\
    firstName\");\n        this.title += \" \" + this.model.get(\"lastName\");\n \
    \     },\n\n      onRender: function(){\n        if(this.options.generateTitle){\n\
    \          var $title = $('<h1>', { text: this.title });\n          this.$el.prepend($title);\n\
    \        }\n\n        this.$('.js-submit').text('Update contact');\n      }\n\
    \    });\n\n  });\n\n  return ContactManager.ContactsApp.Edit.View;\n});\n```\n\
    \n> > ! Don't forget to adapt the original code: we're now using the View sub-module\
    \ (line 2) instead of the Edit sub-module.\n\nNow that we've got our edit view\
    \ in a module, let's require it in our list controller:\n\nassets/js/apps/contacts/list/list_controller.js\n\
    \n```\ncontactsListView.on('itemview:contact:edit', function(childView, model){\n\
    \  require(['apps/contacts/edit/edit_view'], function(EditView){\n    var view\
    \ = new EditView.Contact({\n      model: model\n    });\n\n    view.on('form:submit',\
    \ function(data){\n      if(model.save(data)){\n        childView.render();\n\
    \        view.trigger('dialog:close');\n        childView.flash('success');\n\
    \      }\n      else{\n        view.triggerMethod('form:data:invalid', model.validationError);\n\
    \      }\n    });\n\n    ContactManager.dialogRegion.show(view);\n  });\n});\n\
    ```\n\nSo now let's refresh our page and try the “edit” button again. Boom, another\
    \ error: “TypeError: ContactManager.ContactsApp.Common is undefined” in the edit_view.js\
    \ file. If we look at this file, we can see the edit modal view extends from the\
    \ common form view (line 4 in code listing above for edit_view.js). So clearly,\
    \ this common form view should be a dependency in our module and we should fix\
    \ it:\n\n### Adding the common form as a dependency in assets/js/apps/contacts/edit/edit_view.js\n\
    \n```\ndefine([\"app\", \"apps/contacts/common/views\"], function(ContactManager){\n\
    \  ContactManager.module(\"ContactsApp.Edit\", function(Edit, ContactManager,\n\
    \                                                      Backbone, Marionette, $,\
    \ _){\n    Edit.Contact = ContactManager.ContactsApp.Common.Views.Form.extend({\n\
    \      initialize: function(){\n        this.title = \"Edit \" + this.model.get(\"\
    firstName\");\n        this.title += \" \" + this.model.get(\"lastName\");\n \
    \     },\n\n      onRender: function(){\n        if(this.options.generateTitle){\n\
    \          var $title = $(\"h1\", { text: this.title });\n          this.$el.prepend($title);\n\
    \        }\n\n        this.$(\".js-submit\").text(\"Update contact\");\n     \
    \ }\n    });\n  });\n});\n```\n\nSo let's try our “edit” button again. This time,\
    \ we get 2 errors, both in edit_view.js on line 3 (corresponding to line 4 above):\n\
    \n- TypeError: ContactManager.module is not a function\n- TypeError: ContactManager.ContactsApp.Common\
    \ is undefined\n\nThese errors are thrown due to line 3, but our edit_view.js\
    \ file is actually fine. The problem we have is that we’re requiring apps/contacts/common/views.js\
    \ without converting it to a RequireJS module. In fact our views.js currently\
    \ looks like this:"
