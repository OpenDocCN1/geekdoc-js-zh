  md: "# Marionette Modules VS Plain RequireJS Modules\n\nMarionette provides a module\
    \ mechanism, as does RequireJS, and we've been using both simultaneously. Why?\
    \ Because Marionette modules provide us with some functionality that RequireJS\
    \ doesn't: the ability to start/stop a module (and its sub-modules), which we'll\
    \ get around to implementing in the next chapter.\n\nSince we haven't yet used\
    \ the start/stop ability provided by Marionette modules (which we'll do in the\
    \ [next chapter]), their use is debatable. In this chapter, we'll see what some\
    \ modules would look like when using \"plain\" RequireJS modules, which is all\
    \ you need in many projects. But once again, whether you use Marionette modules\
    \ in addition to RequireJS modules depends on your particular circumstances (and,\
    \ to some degree, personal taste).\n\n# Converting the Contact Entity to Plain\
    \ RequireJS Modules\n\nWe'll start by converting our contact entity, since we've\
    \ currently go both the model *and* the collection defined in the same RequireJS\
    \ module, which goes against recommended practice. But we need to start at the\
    \ beginning: with our \"local storage\" adapter. Here's our current file:\n\n\
    **assets/js/apps/config/storage.js**\n\n```\ndefine([\"app\", \"localstorage\"\
    ], function(ContactManager){\n  ContactManager.module(\"Entities\", function(Entities,\n\
    \    ContactManager, Backbone, Marionette, $, _){\n      var findStorageKey =\
    \ function(entity){\n        // edited for brevity\n      };\n\n      var StorageMixin\
    \ = function(entityPrototype){\n        // edited for brevity\n      };\n\n  \
    \    Entities.configureStorage = function(entity){\n        _.extend(entity.prototype,\
    \ new StorageMixin(entity.prototype));\n```"
  merge: -1
  pgno: 94
- img_proc: true
  md: "```\n    };\n    });\n\n    return ContactManager.Entities.configureStorage;\n\
    });\n```\n\nAnd here’s what our file looks like as a plain RequireJS module:\n\
    \n**assets/js/apps/config/storage.js**\n\n```\n1  define([\"localstorage\"], function(){\n\
    2    var findStorageKey = function(entity){\n3        // edited for brevity\n\
    4    };\n5\n6    var StorageMixin = function(entityPrototype){\n7        // edited\
    \ for brevity\n8    };\n9\n10   return configureStorage = function(entity){\n\
    11       _.extend(entity.prototype, new StorageMixin(entity.prototype));\n12 \
    \  };\n13 });\n```\n\nAs you can see, we no longer need a reference to the `ContactManager`\
    \ application since we don’t reference it within the module. And once we’ve defined\
    \ the desired behavior, we simply return (lines 10-12) the function we’ll be using\
    \ in other modules.\n\n> The return value of RequireJS objects doesn’t necessarily\
    \ have to be an object: any valid return value from a function is allowed.\n\n\
    With our local storage rewritten as a plain RequireJS module, we can move on to\
    \ our contact entity. This is what we currently have:"
