    \  });\n  });\n\n  return ContactManager.HeaderApp;\n});\n```\n\nNow that our\
    \ \"header\" app is fully reimplemented, let's tackle the tricky part. As you\
    \ can see on lines 16-18 above, the sub-app registers a \"start\" listener with\
    \ code to execute when this sub-module is started. Since we have *not* set this\
    \ module's `startWithParent` value to `false`, it will be started with the parent\
    \ module. As it happens, the parent module is the main application: in other words,\
    \ the \"header\" sub-app will be started as soon as the `ContactManager` main\
    \ application is started.\n\nIf we want the code in our \"start\" listener to\
    \ be executed, we're going to have to make sure the listener gets registered before\
    \ `ContactManager` is started, or by the time the event listener is configured\
    \ and waiting, the event will already have fired. End result: nothing happens,\
    \ and developers go crazy looking for bugs... How can we make sure the listener\
    \ is active before our main application is started? Simply by requiring it before\
    \ calling our app's start method:"
- md: "## assets/js/apps/require_main.js\n\n```javascript\nrequirejs.config({\n  baseUrl:\
    \ \"assets/js\",\n  // edited for brevity\n});\n\nrequire([\"app\", \"apps/header/header_app\"\
    ], function(ContactManager){\n  ContactManager.start();\n});\n```\n\nAs you can\
    \ see on line 7, we're requiring the “header” sub-app before starting our main\
    \ application. This way the “start” listener gets registered, and *then* we start\
    \ the app, triggering the “start” event to which the “header” sub-app can respond.\
    \ After all our hard work, our header menu displays in our application.\n\n![](img/9187ef8c47fe9c0a5221f8482c870d45_90_0.png)\n\
    \nUnfortunately, our sub-application doesn't highlight the active header when\
    \ a user enters a URL fragment directly into the address bar, although the active\
    \ header is properly highlighted when the user clicks on a header entry. To fix\
    \ this slight problem, we need to add code to each sub-app so it “orders” the\
    \ header app to highlight their entry:\n\n## assets/js/apps/contacts/contacts_app.js\n\
    \n```javascript\nvar API = {\n  listContacts: function(criterion){\n    require([\"\
    apps/contacts/list/list_controller\"], function(ListController){\n      ListController.listContacts(criterion);\n\
    \      ContactManager.execute(\"set:active:header\", \"contacts\");\n    });\n\
    \  },\n\n  showContact: function(id){\n    require([\"apps/contacts/show/show_controller\"\
    ], function(ShowController){\n      ShowController.showContact(id);\n      ContactManager.execute(\"\
    set:active:header\", \"contacts\");\n    });\n  },\n\n  editContact: function(id){\n\
    \    require([\"apps/contacts/edit/edit_controller\"], function(EditController){\n\
    \      EditController.editContact(id);\n      ContactManager.execute(\"set:active:header\"\
    , \"contacts\");\n    });\n  }\n};\n```\n\n## assets/js/apps/about/about_app.js\n\
    \n```javascript\nvar API = {\n  showAbout: function(){\n    require([\"apps/about/show/show_controller\"\
    ], function(ShowController){\n      ShowController.showAbout();\n      ContactManager.execute(\"\
    set:active:header\", \"about\");\n    });\n  }\n};\n```\n\nIf we give that a shot,\
    \ it fails, because we don’t have the “set:active:header” handler ready. Here\
    \ is our current code:\n\n### Reimplementing the Header Sub-Application\n\n```javascript\n\
    assets/js/apps/header/header_app.js\n\ndefine([\"app\"], function(ContactManager){\n\
    \  ContactManager.module(\"HeaderApp\", function(Header, ContactManager,\n   \
    \                                              Backbone, Marionette, $, _){\n\
    \    var API = {\n      listHeader: function(){\n        require([\"apps/header/list/list_controller\"\
    ], function(ListController){\n          ListController.listHeader();\n       \
    \ });\n      }\n    };\n\n    ContactManager.commands.setHandler(\"set:active:header\"\
    , function(name){\n      ContactManager.HeaderApp.List.Controller.setActiveHeader(name);\n\
    \    });\n\n    Header.on(\"start\", function(){\n      API.listHeader();\n  \
    \  });\n  });\n```\n\nAs you can see, line 13 isn't within a require callback,\
    \ so we can't be sure the List controller is loaded by the time we need it. Let's\
    \ refactor this code to require the List controller as a module dependency:\n\n\
    ```javascript\nassets/js/apps/header/header_app.js\n\ndefine([\"app\", \"apps/header/list/list_controller\"\
    ],\n                       function(ContactManager, ListController){\n  ContactManager.module(\"\
    HeaderApp\", function(Header, ContactManager,\n                              \
    \                   Backbone, Marionette, $, _){\n    var API = {\n      listHeader:\
    \ function(){\n        ListController.listHeader();\n      }\n    };\n\n    ContactManager.commands.setHandler(\"\
    set:active:header\", function(name){\n      ListController.setActiveHeader(name);\n\
    \    });\n\n    Header.on(\"start\", function(){\n      API.listHeader();\n  \
    \  });\n  });\n\n  return ContactManager.HeaderApp;\n});\n```\n\nWe’ve required\
    \ the List controller at the top level on lines 1 and 2, and we can access its\
    \ reference on lines 7 and 12. With this modification in place, our header now\
    \ properly highlights the active menu entry:\n\n![](img/9187ef8c47fe9c0a5221f8482c870d45_93_0.png)\n\
    \nThe highlighted \"Contacts\" entry\n\n> Git commit re-implementing the \"header\"\
    \ sub-application:\n[58433228d70846a3afd9153ca6796fa97c3d0e14](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/58433228d70846a3afd9153ca6796fa97c3d0e14)\n\
    \n<sup>35</sup> https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/58433228d70846a3afd9153ca6796fa97c3d0e14\n\
    \n### Marionette Modules VS Plain RequireJS Modules\n\nMarionette provides a module\
    \ mechanism, as does RequireJS, and we've been using both simultaneously. Why?\
    \ Because Marionette modules provide us with some functionality that RequireJS\
    \ doesn't: the ability to start/stop a module (and its sub-modules), which we'll\
    \ get around to implementing in the next chapter.\n\nSince we haven't yet used\
    \ the start/stop ability provided by Marionette modules (which we'll do in the\
    \ [next chapter]), their use is debatable. In this chapter, we'll see what some\
    \ modules would look like when using \"plain\" RequireJS modules, which is all\
    \ you need in many projects. But once again, whether you use Marionette modules\
    \ in addition to RequireJS modules depends on your particular circumstances (and,\
    \ to some degree, personal taste).\n\n### Converting the Contact Entity to Plain\
    \ RequireJS Modules\n\nWe'll start by converting our contact entity, since we've\
    \ currently go both the model *and* the collection defined in the same RequireJS\
