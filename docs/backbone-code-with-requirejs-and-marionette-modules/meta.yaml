    \ based on your current knowledge of RequireJS. At each step, a list of things\
    \ to remember will be provided, and once you’ve written the code (or at least\
    \ attempted to), the book will continue by explaining the implementation in more\
    \ detail. This method will allow you to make some mistakes and start *really*\
    \ understanding how to rewrite an app to use RequireJS, instead of reading code\
    \ and think “well, this is pretty obvious…”. Ready? Let’s go!\n\n![](img/9187ef8c47fe9c0a5221f8482c870d45_22_0.png)\n\
    \nSpecify our dialog region (located in `assets/js/apps/config/marionette/regions/dialog.js`)\
    \ as a dependency to our main application file. Here are a few things you’ll need\
    \ to do:\n\n- define `dialog.js` as a RequireJS module, and don’t forget:\n  -\
    \ the dialog region will have a dependency on jQuery UI in addition to Marionette\n\
    \  - modules need to return the value that is to be used by dependents\n- add\
    \ an entry for jQuery UI in the RequireJS configuration within `require_main.js`\n\
    - include the path to the newly defined dialog module to the dependency array\
    \ in the `define` call within the main application (i.e. the main application’s\
    \ RequireJS module depends on the dialog region)\n\nHere are a few additional\
    \ pointers:\n\n- as recommended by the RequireJS [documentation](http://requirejs.org/docs/api.html#jsfiles)¹⁷,\
    \ you should rename the jQuery UI file to `jquery-ui.js` (i.e. without version\
    \ information in the filename)\n- don’t forget that javascript objects need their\
    \ property names to be valid javascript identifiers, or strings (for more info,\
    \ see [here](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Working_with_Objects)¹⁸).\
    \ Therefore, I suggest you use the “jquery-ui” string as the identifier for the\
    \ jQuery UI library within `require_main.js`\n- within the `shim` object in `require_main.js`,\
    \ you can specify that jQuery UI depends on jQuery by providing an array of dependencies.\
    \ We haven’t covered this in the book yet, but try and figure it out from the\
    \ [documentation](http://requirejs.org/docs/api.html#config-shim)¹⁹ (read the\
    \ section on jQuery and Backbone plugins)\n- when indicating the location of the\
    \ dialog region module (for the main app’s dependency array), don’t forget paths\
    \ are to be indicated relative to the `assets/js` baseUrl\n\nYou can see the solution\
    \ on the next page.\n\nLet's start by adding jQuery UI to our setup:\n\n**assets/js/require_main.js**\n\
    \n```javascript\nrequirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n \
    \   backbone: \"vendor/backbone\",\n    jquery: \"vendor/jquery\",\n    \"jquery-ui\"\
    : \"vendor/jquery-ui\",\n    json2: \"vendor/json2\",\n    marionette: \"vendor/backbone.marionette\"\
    ,\n    underscore: \"vendor/underscore\"\n  },\n\n  shim: {\n    underscore: {\n\
    \      exports: \"_\"\n    },\n    backbone: {\n      deps: [\"jquery\", \"underscore\"\
    , \"json2\"],\n      exports: \"Backbone\"\n    },\n    marionette: {\n      deps:\
    \ [\"backbone\"],\n      exports: \"Marionette\"\n    },\n    \"jquery-ui\": [\"\
    jquery\"]\n  }\n});\n\nrequire([\"app\"], function(ContactManager){\n  ContactManager.start();\n\
    });\n```\n\nNow, we can convert our dialog region to be a RequireJS module:\n\n\
    **assets/js/apps/config/marionette/regions/dialog.js**\n\n```javascript\ndefine([\"\
    marionette\", \"jquery-ui\"], function(Marionette){\n  Marionette.Region.Dialog\
    \ = Marionette.Region.extend({\n    onShow: function(view){\n      this.listenTo(view,\
    \ \"dialog:close\", this.closeDialog);\n\n      var self = this;\n      this.$el.dialog({\n\
    \        modal: true,\n        title: view.title,\n        width: \"auto\",\n\
    \        close: function(e, ui){\n          self.closeDialog();\n        }\n \
    \     });\n    },\n\n    closeDialog: function(){\n      this.stopListening();\n\
    \      this.close();\n      this.$el.dialog(\"destroy\");\n    }\n  });\n\n  return\
    \ Marionette.Region.Dialog;\n});\n```\n\nOnce again, the only modifications to\
