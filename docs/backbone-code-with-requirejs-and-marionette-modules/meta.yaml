    \ r.js 的目标之一，即 RequireJS 提供的优化器。\n\n在我们对应用运行优化器之前，我们需要安装 node.js（在此下载41）。然后，从此处42\
    \ 下载 r.js 文件并将其存储在应用的根路径中43。\n\n完成这些之后，我们就快准备好运行优化器了。我们需要一个构建文件44：\n\n**assets/js/build.js**\n\
    \n```\n{\n  baseUrl: \".\",\n  name: \"require_main\",\n  mainConfigFile: \"require_main.js\"\
