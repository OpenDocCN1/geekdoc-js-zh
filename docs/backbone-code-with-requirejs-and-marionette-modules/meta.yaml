    3   if (ContactManager.currentApp === currentApp){ return; }\n4 \n5   if (ContactManager.currentApp){\n\
    6     ContactManager.currentApp.stop();\n7   }\n8 \n9   ContactManager.currentApp\
    \ = currentApp;\n10  if(currentApp){\n11    currentApp.start(args);\n12  }\n13\
    \ };\n```\n\nOur change is pretty straightforward:\n\n+   - we set `currentApp`\
    \ to the module (if it exists), or we use `null` (line 2);\n- if the current module\
    \ is a Marionette module, we stop it (lines 5-7);\n- if the new module is a Marionette\
    \ module, we start it (lines 10-12).\n\nWith this modification in place, our app\
    \ happily runs both module types!\n\n> Git commit mixing module types:\n[ef42ce031913810542566f928d84e26e2f7850c5](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/ef42ce031913810542566f928d84e26e2f7850c5)"
  - "[PAGE 115]\n\n# # Optimizing the Application with r.js\n\nSo far, we’ve rewritten\
    \ our app to use a mix of “plain” RequireJS and Marionette modules, all handled\
    \ by RequireJS. As you’ll recall, RequireJS automatically handles the dependencies\
    \ and loads the javascript files in the proper order. However, this order doesn’t\
    \ change that often (certainly not on each page request), so why are we having\
    \ this work done over and over? Wouldn’t it be smarter to just compute the dependencies\
    \ once, store the resulting code in a single file and use that in our application?\
    \ Of course it is, and that’s one of the goals of r . js, the optimizer provided\
    \ by RequireJS.\n\nBefore we can run the optimizer on our application, we’ll need\
    \ to install node.js (download here41). Then, download the r . js file form here42\
    \ and store it in your application’s root path.43\nWith that out of the way, we’re\
    \ almost ready to run the optimizer. We’ll need a build file44:\n\n**assets/js/build.js**\n\
    \n```\n{\n  baseUrl: \".\",\n  name: \"require_main\",\n  mainConfigFile: \"require_main.js\"\
    ,\n  out: \"require_main.built.js\"\n}\n```\n\nHere’s what each attribute does\
    \ (find out more here45):\n\n+   - baseUrl defines the url from which all other\
    \ paths are determined, and it defaults to the build file’s path, in our case\
    \ assets/js (since that's where we've stored our build file). This would mean\
    \ that our libraries would be searched for within assets/js/assets/js, because\
    \ the build file would have a default base path of assets/js, and our main configuration\
    \ file defines its own baseUrl attribute as assets/js. Put both of those together,\
    \ and we have the optimizer looking for libraries in assets/js/assets/js, which\
    \ isn't what we want... Instead, we need to provide the actual path we want to\
    \ use, relative to the application's base directory. In our case we want it to\
    \ be that same base directory, hence the \".\" path;\n\n> http://nodejs.org/download/\n\
    \nhttp://requirejs.org/docs/download.html#rjs\n\nNote that, per the instructions,\
    \ you can also use the optimizer after installing it with npm.\n\nhttp://requirejs.org/docs/optimization.html#wholeproject\n\
    \nhttps://github.com/jrburke/r.js/blob/master/build/example.build.js"
- md: " - since we're only optimizing one module (the main module, which will recursively\
    \ optimize all its dependencies), we can provide the module's name inline with\
    \ the name attribute. Since the assets/js/require_main.js file defines our main\
    \ module, we simply provide its name here, and RequireJS figures out where it\
    \ is located (via the baseUrl properties);\n\n- mainConfigFile allows us to tell\
    \ the optimizer where we have our configuration options, so we don't need to repeat\
    \ them on the command line. Once again, the file's location is determined via\
    \ the baseUrl properties;\n\n- out is the name of the built file we want the optimizer\
    \ to generate. This way, we'll have a single, optimized, and uglified file for\
    \ inclusion in the deployed application. Here too, it's location is determined\
    \ by the baseUrl properties.\n\nWe're now ready to run the optimizer. From our\
    \ application's root directory, use a command console to run\n\n```\nnode r.js\
    \ -o assets/js/build.js\n```\n\nYou'll notice that we've indicated the location\
    \ of our build file with the -o option. Once the optimizer is done running, you'll\
    \ have a brand new file: assets/js/require_main.built.js containing our entire\
    \ app in a single minified file.\n\nLet's try our new file by using it in our\
    \ index.html file:\n\n## index.html\n\n```\n1 <!DOCTYPE html>\n2 <html lang=\"\
    en\">\n3  <head>\n4   <meta charset=\"utf-8\">\n5   <title>Marionette Contact\
    \ Manager</title>\n6   <link href=\"./assets/css/bootstrap.css\" rel=\"stylesheet\"\
    >\n7   <link href=\"./assets/css/application.css\" rel=\"stylesheet\">\n8   <link\
    \ href=\"./assets/css/jquery-ui-1.10.0.custom.css\" rel=\"stylesheet\">\n9 </head>\n\
    10\n11 <body>\n12  <div id=\"header-region\"></div>\n13\n14 <div id=\"main-region\"\
    \ class=\"container\">\n15   <p>Here is static content in the web page. You'll\
    \ notice that\n16     it gets replaced by our app as soon as we start it.</p>\n\
    17 </div>\n```\n\n```\n19    <div id=\"dialog-region\"></div>\n20\n21    <script\
    \ src=\"./assets/js/require_main.built.js\"></script>\n22  </body>\n23 </html>\n\
    ```\n\nAs you can see, we've replaced our original RequireJS include on line 21\
    \ with our newly optimized file. But when we refresh our index page, our app doesn't\
    \ load properly. Instead we get an error message indicating that \"define is not\
    \ defined\". What does that mean? Well, even though we don't need RequireJS to\
    \ process the dependencies, we still need it to load our module自上而下. So we'll\
    \ need to include the RequireJS library before we load our app file:\n\nindex.html\n\
    \n```\n1 <script src=\"./assets/js/vendor/require.js\"></script>\n2 <script src=\"\
    ./assets/js/require_main.built.js\"></script>\n```\n\nGit commit using the single\
    \ optimized file:\na736595a0fecd466aee049ae91429c086b2b6049\n\nOur app now loads\
    \ properly, but it seems a little wasteful doesn't it? We're loading RequireJS\
    \ with all its functionality (and file size!) only to load our unique module.\
    \ There must be a better way!\n\n## Loading with Almond.js\n\nAlmond.js is a minimal\
    \ AMD module loader also written by James Burke (the man behind RequireJS). It's\
    \ meant to be lightweight in exchange of providing a very limited set of features,\
    \ which is exactly what we're looking for! Let's download it from here and save\
    \ it as assets/js/vendor/almond.js.\n\nUsing Almond does come with some restrictions,\
    \ among which the inability to use dynamic code loading (e.g. attempting to use\
    \ a CDN-hosted library and falling back to a local version).\n\nThen, we need\
    \ to change our build file to include Almond in the optimized file:\n\nhttps://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/a736595a0fecd466aee049ae91429c086b2b6049\n\
    https://raw.github.com/jrburke/almond/latest/almond.js\nhttps://github.com/jrburke/almond#restrictions\n\
    \n## assets/js/build.js\n\n```\n({\n    baseUrl: \".\",\n    name: \"vendor/almond\"\
    ,\n    include: \"require_main\",\n    mainConfigFile: \"require_main.js\",\n\
    \    out: \"require_main.built.js\"\n})\n```\n\nNotice the changes on lines 3\
    \ and 4: we're telling the optimizer to build Almond and *include* our main application.\
    \ After recompiling our app, we adapt our index page:\n\n## index.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n\
    \    <title>Marionette Contact Manager</title>\n    <link href=\"./assets/css/bootstrap.css\"\
    \ rel=\"stylesheet\">\n    <link href=\"./assets/css/application.css\" rel=\"\
    stylesheet\">\n    <link href=\"./assets/css/jquery-ui-1.10.0.custom.css\" rel=\"\
    stylesheet\">\n  </head>\n\n  <body>\n    <div id=\"header-region\"></div>\n\n\
    \    <div id=\"main-region\" class=\"container\">\n      <p>Here is static content\
    \ in the web page. You'll notice that\n         it gets replaced by our app as\
    \ soon as we start it.</p>\n    </div>\n\n    <div id=\"dialog-region\"></div>\n\
    \n    <script src=\"./assets/js/require_main.built.js\"></script>\n  </body>\n\
    </html>\n```\n\nNotice that on line 21, we include only the compiled file: RequireJS\
    \ and Almond do *not* get included.\n\nWe can now reload our app, aaaaaaaaaaaaand\
    \ it doesn't work! Among others, we get the \"Error: undefined missing entities/header\"\
    \ error. How is this possible, when it clearly worked fine with RequireJS? It's\
    \ because we have nested require calls (i.e. declaring dependencies *within* the\
    \ module, instead of only in its definition). Luckily the fix is to simply add\
    \ a `findNestedDependencies` attribute to our build file:\n\n```\nassets/js/build.js\n\
    ({\n    baseUrl: \".\",\n    name: \"vendor/almond\",\n    include: \"require_main\"\
    ,\n    mainConfigFile: \"require_main.js\",\n    out: \"require_main.built.js\"\
    ,\n    findNestedDependencies: true\n})\n```\n\nWe compile the app again with\
    \ the same command\n\n```\nnode r.js -o assets/js/build.js\n```\n\nto generate\
    \ a new version of our compiled application. This time when we reload our application,\
    \ it works fine!\n\n> Git commit using almond to load the optimized application:\
    \ [85d3d3dd40d0cebd858224c3903a12d6998d668d](https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/85d3d3dd40d0cebd858224c3903a12d6998d668d)\n\
    \n## Closing Thoughts\n\nWe've now rewritten the application with RequireJS and\
    \ introduced a few new ideas along the way. You should now have a good grasp of\
    \ how RequireJS works, and you should be able to apply what you've learned to\
    \ your own projects.\n\nIf you've enjoyed the book, it would be immensely helpful\
    \ if you could take a few minutes to write your opinion on the book's [review\
    \ page](https://leanpub.com/structuring-backbone-with-requirejs-and-marionette/feedback).\
    \ Help others determine if the book is right for them!\n\nWould you like me to\
    \ cover another subject in an upcoming book? Let me know by email at davidsulc@gmail.com\
    \ or on Twitter (@davidsulc). In the meantime, see the next chapter for [my current\
    \ list of books](#).\n\nThanks for reading this book, it's been great having you\
    \ along!\n\n## Keeping in Touch\n\nI plan to release more books in the future,\
    \ where each will teach a new skill (like in this book) or help you improve an\
    \ existing skill and take it to the next level.\n\nIf you'd like to be notified\
    \ when I release a new book, receive discounts, etc., sign up to my mailing list\
    \ at [davidsulc.com/mailing_list](http://davidsulc.com/mailing_list). No spam,\
    \ I promise!\n\nYou can also follow me on Twitter: @davidsulc\n\n## Other Books\
    \ I've Written\n\nPresumably, you're already comfortable with how Marionette works.\
    \ If that isn't quite the case, take a look the book where the Contact Manager\
    \ application is originally developed: [Backbone.Marionette.js: A Gentle Introduction](https://leanpub.com/marionette-gentle-introduction)."
  mdcn: "\n- 由于我们仅优化一个模块（主模块，它将递归优化其所有依赖项），因此可以通过 `name` 属性内联提供模块名称。由于 `assets/js/require_main.js`\
    \ 文件定义了我们的主模块，我们只需在此提供其名称，RequireJS 会通过 `baseUrl` 属性确定其位置；\n\n- `mainConfigFile`\
    \ 允许我们告知优化器我们的配置选项所在位置，这样我们就不必在命令行中重复它们。同样，文件位置由 `baseUrl` 属性确定；\n\n- `out` 是我们希望优化器生成的构建文件的名称。这样，我们将得到一个单一、优化且压缩后的文件，用于包含在部署的应用程序中。这里，其位置也由\
    \ `baseUrl` 属性确定。\n\n现在我们准备运行优化器。从应用程序的根目录使用命令控制台运行\n\n```\nnode r.js -o assets/js/build.js\n\
    ```\n\n你会注意到我们通过 `-o` 选项指定了构建文件的位置。一旦优化器运行完毕，你将获得一个全新的文件：`assets/js/require_main.built.js`，其中包含我们整个应用程序的单个压缩文件。\n\
    \n让我们通过在 `index.html` 文件中使用它来试试我们的新文件：\n\n## index.html\n\n```\n1 <!DOCTYPE html>\n\
    2 <html lang=\"en\">\n3  <head>\n4   <meta charset=\"utf-8\">\n5   <title>Marionette\
    \ Contact Manager</title>\n6   <link href=\"./assets/css/bootstrap.css\" rel=\"\
