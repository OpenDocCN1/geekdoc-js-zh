    \ Next, we need to modify our module starting code to properly manage both module\
    \ types.\n\n```\nContactManager.startSubApp = function(appName, args){\n  var\
    \ currentApp = ContactManager.module(appName);\n  if (ContactManager.currentApp\
    \ === currentApp){ return; }\n\n  if (ContactManager.currentApp){\n    ContactManager.currentApp.stop();\n\
    \  }\n\n  ContactManager.currentApp = currentApp;\n  currentApp.start(args);\n\
    };\n```\n\n```\nvar API = {\n  showAbout: function(){\n    require([\"apps/about/show/show_controller\"\
    ], function(ShowController){\n      ContactManager.startSubApp(null);\n      ShowController.showAbout();\n\
