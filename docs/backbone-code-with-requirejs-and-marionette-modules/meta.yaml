    \ top-level dependencies and libraries, and then start our Contact Manager application.\
    \ So let's change our script tag on line 22 to\n\n```\n<script data-main=\"./assets/js/require_main.js\"\
    \n        src=\"./assets/js/vendor/require.js\"></script>\n```\n\nThat was easy\
    \ enough! Of course, we now need to actually write *require_main.js* to provide\
    \ configuration directives. Let's start by simply using RequireJS to load jQuery\
    \ and display jQuery's version number:\n\n# assets/js/require_main.js\n\n```\n\
    require([\"vendor/jquery\"], function(){\n  console.log(\"jQuery version: \",\
    \ $.fn.jquery);\n});\n```\n\nIf you refresh index.html, you'll now see jQuery's\
    \ version number printed in the console. How is this happening? First, RequireJS\
    \ determines the `baseUrl`, which is the path from which all other paths are computed.\
    \ By default, it is set to the path provided to the data-main attribute above\
    \ (minus the file portion, of course). So in our case, the `baseUrl` is *assets/js*.\n\
    \nThen, within *require_main.js*, we call RequireJS's `require` function, which\
    \ takes 2 arguments:\n\n+   1. an array of dependencies that need to be loaded\
    \ before executing the callback function;\n2. a callback function that gets executed\
    \ once all the required dependencies have been loaded.\n\n> Note that RequireJS\
    \ also defines a `requirejs` function, which is interchangeable with `require`.\n\
    \nIn the dependency array, we provide the path to the file we want to load *relative\
    \ to the baseUrl path*. As we indicated jQuery was located at *vendor/jquery*,\
    \ and our `baseUrl` is *assets/js* (because that's where our *require_main.js*\
    \ file is located), RequireJS will look for the library file in *assets/js/vendor/jquery.js*.\
    \ So our code essentially instructs \"once jQuery is loaded from *assets/js/vendor/jquery.js*,\
    \ print its version number.\"\n\n> Note that we specify file without extensions.\
    \ For example, to require jQuery we had \"vendor/jquery\" as the dependency, and\
    \ RequireJS automatically added the \".js\" extension.\n\nBut we can still improve\
    \ our code by adding some global configuration:"
  - "[PAGE 13]\n\n```\nassets/js/require_main.js\n\nrequirejs.config({\n  baseUrl:\
    \ \"assets/js\",\n  paths: {\n    jquery: \"vendor/jquery\"\n  }\n});\n\nrequire([\"\
    jquery\"], function(jq){\n  console.log(\"jQuery version: \", jq.fn.jquery);\n\
    \  console.log(\"jQuery version: \", $.fn.jquery);\n});\n```\n\nDue to the equivalence\
    \ of `require` and `requirejs`, the config method could also be called via `require.config`.\
    \ Why do I use `requirejs` on line 1 and then `require` on line 8? It's just a\
    \ matter of personal taste: Wallpaperfind that `requirejs.config` explicitly indicates\
    \ we are configuring RequireJS, and using the `require` function call reads better\
    \ (i.e. \"require these files before proceeding\"). But be aware of the `requirejs`\
    \ and `require` synonyms when you look at RequireJS code.\n\nSo we've added some\
    \ configuration, but what does it do? First, we provide a `baseUrl` path. This\
    \ isn't really necessary in our case (since we're using the same path as the default),\
    \ but I find it helps with clarity: since all the other paths indicated in the\
    \ file will be defined relative to the `baseUrl`, it's practical to have it explicitly\
    \ defined on the same page.\n\nNext, we've added a `paths`¹² object to specify\
    \ paths that aren't directly under the `baseUrl` path. This allows us to create\
    \ a \"jquery\" key to use when requiring the library, and RequireJS will know\
    \ it should be loaded from the *vendor/jquery* location.\n\nFrom the [documentation¹³](http://requirejs.org/docs/api.html#config-paths):\n\
    \nThe path that is used for a module name should **not** include an extension,\
    \ since the path mapping could be for a directory. The path mapping code will\
    \ automatically add the .js extension when mapping the module name to a path.\n\
    \nBy using [path fallbacks¹⁴](http://requirejs.org/docs/api.html#pathsfallbacks),\
    \ you can easily load libraries from CDNs and default to using a local version\
    \ should the CDN be unavailable."
- md: "With this configuration in place, we can now simply require “jquery” and RequireJS\
    \ will know where to look. In addition, note that RequireJS will provide the array\
    \ of dependencies as arguments to the callback function: in the code above, we\
    \ have the “jquery” dependency assigned to the jq variable, which allows us to\
    \ then call jq.fn.jquery to get jQuery’s version number. As you can tell from\
    \ the console output, using the provided callback argument is equivalent to using\
    \ the global $ variable.\n\n> jQuery’s case is a bit special, so let’s talk about\
    \ it a bit. Ever since version 1.7, jQuery is AMD-compatible meaning that it can\
    \ be loaded with a module loader such as RequireJS. In that case, the module loader\
    \ will receive a reference to jQuery which can be used in the callback function.\
    \ All of this happens in addition to jQuery’s registering the global $ variable.\n\
    \nHowever, with most other modules and libraries, no global variables will be\
    \ registered. That’s one of the objectives when using RequireJS: don’t register\
    \ objects in the global namespace, and require the ones you need instead, passing\
    \ them into the callback function.\n\n## Using Shims\n\nWe’ve seen how to load\
    \ an AMD-compatible library (namely, jQuery), so let’s move on to loading one\
    \ that is *not* compatible with AMD: Underscore. By using the new `shim` object\
    \ in RequireJS, we can still load AMD-incompatible scripts with RequireJS: all\
    \ we need to do is provide a little more information. Here we go:\n\n```javascript\n\
    // assets/js/require_main.js\nrequirejs.config({\n  baseUrl: \"assets/js\",\n\
    \  paths: {\n    jquery: \"vendor/jquery\",\n    underscore: \"vendor/underscore\"\
    \n  },\n\n  shim: {\n    underscore: {\n      exports: \"_\"\n    }\n  }\n});\n\
    \nrequire([\"underscore\", \"jquery\"], function(un){\n  console.log(\"jQuery\
    \ version: \", $.fn.jquery);\n  console.log(\"underscore identity call: \", _.identity(5));\n\
    \  console.log(\"underscore identity call: \", un.identity(5));\n});\n```\n\n\
    First, we indicate where Underscore is located (line 5). With that done, we add\
    \ the \"underscore\" key to the shim object and indicate that it should return\
    \ the value of the \"_\" global to the callback function. Notice that, thanks\
    \ to the shim, we have access to both the global \"_\" value (line 17) and the\
    \ un callback value (line 18). If we hadn't used a shim, we wouldn't be able to\
    \ use the un callback value, only the \"_\" global.\n\n> How come we require 2\
    \ files, but have only one callback argument? Because we only explicitly state\
    \ the callback arguments we're going to be using (and for which we need a variable\
    \ to reference). So why bother having the \"jquery\" as a dependency? Because\
    \ even though we're not using an explicit callback argument value, we know that\
    \ within the callback function jQuery has been loaded and can be used via the\
    \ global $ variable. This is due to jQuery's particularity of registering a global\
    \ variable we can reference: there's no need to use a callback argument.\n\nLet's\
    \ move on to loading something with dependencies: Backbone. Here we go:\n\n```javascript\n\
    // assets/js/require_main.js\nrequirejs.config({\n  baseUrl: \"assets/js\",\n\
    \  paths: {\n    backbone: \"vendor/backbone\",\n    jquery: \"vendor/jquery\"\
    ,\n    json2: \"vendor/json2\",\n    underscore: \"vendor/underscore\"\n  },\n\
    \n  shim: {\n    underscore: {\n      exports: \"_\"\n    },\n    backbone: {\n\
    \      deps: [\"jquery\", \"underscore\", \"json2\"],\n      exports: \"Backbone\"\
    \n    }\n  }\n});\n\nrequire([\"backbone\"], function(bb){\n  console.log(\"jQuery\
    \ version: \", $.fn.jquery);\n  console.log(\"underscore identity call: \", _.identity(5));\n\
    \  console.log(\"Backbone.history: \", bb.history);\n});\n```\n\nLet's start studying\
    \ this code in the shim (lines 14-17):\n\n1. we declare a “backbone” key we can\
    \ then use to require the library;\n2. we indicate that Backbone depends on jQuery,\
    \ Underscore, and JSON2. This implies that before loading Backbone, RequireJS\
    \ has to load these dependencies;\n3. we indicate that the global Backbone variable\
    \ should be returned to the callback function.\n\nNaturally, we need to tell RequireJS\
    \ where to find the various files so we’ve had to add paths for Backbone (line\
    \ 4) and JSON2 (line 6).\n\nWith that configuration set up, we can require Backbone\
    \ on line 21 and use it within the callback function. But how come we can still\
    \ use jQuery and Underscore without requiring them (lines 22-23)? Because of the\
    \ dependency tree: Backbone depends on those libraries (see above), so once Backbone\
    \ and its dependencies have been loaded we have access to jQuery and Underscore\
    \ via their global variables (since they’re both Backbone dependencies). RequireJS\
    \ magic in action!\n\n![Dependency graph](img/9187ef8c47fe9c0a5221f8482c870d45_16_0.png)\n\
    \nTry adding Marionette to *require_main.js* on your own, then check below. Things\
    \ to remember:\n\n- You'll need to specify a path for Marionette;\n- Marionette\
    \ depends on Backbone;\n- Marionette registers the global `Marionette` variable.\n\
    \nYou can see the solution on the next page.\n\n## Getting Started\n\n```javascript\n\
    // assets/js/require_main.js\nrequirejs.config({\n  baseUrl: \"assets/js\",\n\
    \  paths: {\n    backbone: \"vendor/backbone\",\n    jquery: \"vendor/jquery\"\
    ,\n    json2: \"vendor/json2\",\n    marionette: \"vendor/backbone.marionette\"\
    ,\n    underscore: \"vendor/underscore\"\n  },\n\n  shim: {\n    underscore: {\n\
    \      exports: \"_\"\n    },\n    backbone: {\n      deps: [\"jquery\", \"underscore\"\
    , \"json2\"],\n      exports: \"Backbone\"\n    },\n    marionette: {\n      deps:\
    \ [\"backbone\"],\n      exports: \"Marionette\"\n    }\n  }\n});\n\nrequire([\"\
    marionette\"], function(bbm){\n  console.log(\"jQuery version: \", $.fn.jquery);\n\
    \  console.log(\"underscore identity call: \", _.identity(5));\n  console.log(\"\
    Marionette: \", bbm);\n});\n```\n\nAdding Marionette is pretty straightforward,\
    \ as it's no different from adding Backbone. However, do note that since Marionette\
    \ depends on Backbone, we don't need to specify that it also depends (e.g.) on\
    \ Underscore: RequireJS will load Underscore, then Backbone, then Marionette,\
    \ due to the dependency relationships we've indicated in the `config` method.\n\
    \nGit commit loading basic libraries:\n\n0b8d7506bf18dd930ccf824897a7d839040ccc9c¹⁵\n\
    \n¹⁵ https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/0b8d7506bf18dd930ccf824897a7d839040ccc9c\n\
    \n## Loading the Main App\n\nNow that we understand the basics about how RequireJS\
    \ works, let's use it to require our Contact Manager application and start it.\
    \ We'll start with a very basic app file, to give us a first taste of defining\
    \ and working with RequireJS modules. You should already have a file in *assets/js/app.js*,\
    \ so save it elsewhere, or just overwrite it. We don't need it yet, but will be\
    \ using it soon enough. Here's our basic application:\n\n```javascript\n// assets/js/app.js\n\
    var ContactManager = new Marionette.Application();\n\nContactManager.on(\"initialize:after\"\
    , function(){\n  console.log(\"Contact Manager has started\");\n});\n```\n\n⚠️\
    \ This code should be obvious to you. If not I suggest you read my [book introducing\
    \ Marionette](https://leanpub.com/marionette-gentle-introduction).\n\nAll our\
    \ app does for now is print a message to the console once it has started, which\
    \ is enough to start working with RequireJS. So now what? To be able to use our\
    \ Contact Manager application as a dependency, we'll need to define it as a RequireJS\
    \ module. In simple terms, a RequireJS module indicates the required dependencies,\
    \ and returns a value to be used in the callback function provided to a require\
    \ call.\n\n## Discovering Modules\n\nIf you look at our simple code above, you\
    \ can see that we're going to need access to Marionette. In addition, we're going\
    \ to need access to ContactManager in many places in our application, e.g. to\
    \ define modules. Here's what our Contact Manager looks like as a RequireJS module:\n\
    \n```javascript\n// assets/js/app.js\ndefine([\"marionette\"], function(Marionette){\n\
    \  var ContactManager = new Marionette.Application();\n\n  ContactManager.on(\"\
    initialize:after\", function(){\n    console.log(\"Contact Manager has started\"\
    );\n  });\n\n  return ContactManager;\n});\n```\n\nThe only modifications we've\
    \ added are the call to define on line 1, and returning the reference to our application\
    \ on line 8. Now, let's return to our require_main.js file, to require and start\
    \ our app:\n\n```javascript\n// assets/js/require_main.js\nrequirejs.config({\n\
    \  // edited for brevity\n});\n\nrequire([\"app\"], function(ContactManager){\n\
    \  ContactManager.start();\n});\n```\n\nAs explained earlier, we're requiring\
    \ the main application's file (which evaluates to assets/js/app.js due to the\
    \ baseUrl value), which we receive in the provided callback. We can then start\
    \ the application as usual. There is a major difference with RequireJS, however:\
    \ ContactManager is no longer a global variable, and can be accessed only via\
    \ requiring the main application.\n\n> What about debugging? If we type ContactManager\
    \ in the console, we won't have a usable reference to our application. So how\
    \ can we debug our code? We simply need to require it, like so:\n\n```javascript\n\
    var ContactManager = require(\"app\");\n```\n\nAfter that, the ContactManager\
    \ variable will point to our application instance."
  mdcn: "\n完成此配置后，我们现在只需简单地请求`jquery`，RequireJS 就会知道去哪里寻找。另外请注意，RequireJS 会将依赖数组作为参数传递给回调函数：在上面的代码中，我们将`jquery`依赖分配给了`jq`变量，这样我们就可以通过调用`jq.fn.jquery`来获取\
    \ jQuery 的版本号。正如您从控制台输出中看到的，使用提供的回调参数与使用全局`$`变量是等效的。\n\n> jQuery 的情况有点特殊，所以我们稍微谈谈它。自\
    \ 1.7 版本起，jQuery 就兼容 AMD，这意味着它可以使用像 RequireJS 这样的模块加载器来加载。在这种情况下，模块加载器将获得 jQuery\
    \ 的引用，该引用可在回调函数中使用。所有这些都发生在 jQuery 注册全局`$`变量之外。\n\n然而，对于大多数其他模块和库，不会注册任何全局变量。这是使用\
    \ RequireJS 的目标之一：不要在全局命名空间中注册对象，而是按需请求它们，并将它们传递给回调函数。\n\n## 使用垫片（Shims）\n\n我们已经看到了如何加载一个兼容\
    \ AMD 的库（即 jQuery），那么让我们继续加载一个*不*兼容 AMD 的库：Underscore。通过使用 RequireJS 中的新的`shim`对象，我们仍然可以使用\
    \ RequireJS 加载不兼容 AMD 的脚本：我们只需要提供更多信息即可。具体如下：\n\n```javascript\n// assets/js/require_main.js\n\
    requirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n    jquery: \"vendor/jquery\"\
    ,\n    underscore: \"vendor/underscore\"\n  },\n\n  shim: {\n    underscore: {\n\
    \      exports: \"_\"\n    }\n  }\n});\n\nrequire([\"underscore\", \"jquery\"\
    ], function(un){\n  console.log(\"jQuery version: \", $.fn.jquery);\n  console.log(\"\
    underscore identity call: \", _.identity(5));\n  console.log(\"underscore identity\
    \ call: \", un.identity(5));\n});\n```\n\n首先，我们指明了 Underscore 的位置（第 5 行）。完成此操作后，我们将`underscore`键添加到\
    \ shim 对象中，并指示它应该将`_`全局变量的值返回给回调函数。请注意，由于垫片的存在，我们既可以访问全局`_`值（第 17 行），也可以访问回调参数值`un`（第\
    \ 18 行）。如果我们没有使用垫片，我们将无法使用回调参数值`un`，而只能使用全局`_`变量。\n\n> 为什么我们请求了两个文件，却只有一个回调参数？因为我们只显式声明了我们将要使用（并且需要变量来引用）的回调参数。那么，为什么还要将\"\
    jquery\"作为依赖呢？因为即使我们没有使用显式的回调参数值，我们也知道在回调函数内部，jQuery 已经加载完毕，并且可以通过全局`$`变量来使用。这是由于\
    \ jQuery 注册了一个我们可以引用的全局变量的特殊性：无需使用回调参数。\n\n让我们继续加载具有依赖项的库：Backbone。具体如下：\n\n```javascript\n\
    // assets/js/require_main.js\nrequirejs.config({\n  baseUrl: \"assets/js\",\n\
    \  paths: {\n    backbone: \"vendor/backbone\",\n    jquery: \"vendor/jquery\"\
    ,\n    json2: \"vendor/json2\",\n    underscore: \"vendor/underscore\"\n  },\n\
    \n  shim: {\n    underscore: {\n      exports: \"_\"\n    },\n    backbone: {\n\
    \      deps: [\"jquery\", \"underscore\", \"json2\"],\n      exports: \"Backbone\"\
    \n    }\n  }\n});\n\nrequire([\"backbone\"], function(bb){\n  console.log(\"jQuery\
    \ version: \", $.fn.jquery);\n  console.log(\"underscore identity call: \", _.identity(5));\n\
    \  console.log(\"Backbone.history: \", bb.history);\n});\n```\n\n让我们开始研究这段代码中的\
    \ shim 部分（第 14-17 行）：\n\n1.  我们声明了一个`backbone`键，之后可以用它来请求该库；\n2.  我们指明 Backbone\
    \ 依赖于 jQuery、Underscore 和 JSON2。这意味着在加载 Backbone 之前，RequireJS 必须先加载这些依赖项；\n3.\
    \  我们指明全局的 Backbone 变量应该被返回给回调函数。\n\n自然地，我们需要告诉 RequireJS 在哪里可以找到这些文件，因此我们不得不为\
    \ Backbone（第 4 行）和 JSON2（第 6 行）添加路径配置。\n\n配置完成后，我们可以在第 21 行请求 Backbone，并在回调函数中使用它。但为什么我们仍然可以在没有显式请求\
    \ jQuery 和 Underscore 的情况下使用它们（第 22-23 行）？这是因为依赖树：Backbone 依赖于这些库（见上文），所以一旦 Backbone\
    \ 及其依赖项加载完成，我们就可以通过它们的全局变量访问 jQuery 和 Underscore（因为它们都是 Backbone 的依赖项）。RequireJS\
    \ 的魔力正在于此！\n\n![依赖关系图](img/9187ef8c47fe9c0a5221f8482c870d45_16_0.png)\n\n尝试自己将\
    \ Marionette 添加到 *require_main.js* 中，然后查看下方的答案。需要记住的要点：\n\n-  你需要为 Marionette\
    \ 指定路径；\n-  Marionette 依赖于 Backbone；\n-  Marionette 注册了全局的 `Marionette` 变量。\n\n\
    你可以在下一页看到解决方案。\n\n## 入门\n\n```javascript\n// assets/js/require_main.js\nrequirejs.config({\n\
    \  baseUrl: \"assets/js\",\n  paths: {\n    backbone: \"vendor/backbone\",\n \
    \   jquery: \"vendor/jquery\",\n    json2: \"vendor/json2\",\n    marionette:\
    \ \"vendor/backbone.marionette\",\n    underscore: \"vendor/underscore\"\n  },\n\
    \n  shim: {\n    underscore: {\n      exports: \"_\"\n    },\n    backbone: {\n\
    \      deps: [\"jquery\", \"underscore\", \"json2\"],\n      exports: \"Backbone\"\
    \n    },\n    marionette: {\n      deps: [\"backbone\"],\n      exports: \"Marionette\"\
    \n    }\n  }\n});\n\nrequire([\"marionette\"], function(bbm){\n  console.log(\"\
    jQuery version: \", $.fn.jquery);\n  console.log(\"underscore identity call: \"\
    , _.identity(5));\n  console.log(\"Marionette: \", bbm);\n});\n```\n\n添加 Marionette\
    \ 相当简单，因为它与添加 Backbone 并无不同。但是，请注意，由于 Marionette 依赖于 Backbone，我们不需要再指明它也依赖（例如）Underscore：由于我们在\
    \ `config` 方法中指明的依赖关系，RequireJS 会先加载 Underscore，然后是 Backbone，最后是 Marionette。\n\
    \nGit 提交记录，用于加载基础库：\n\n0b8d7506bf18dd930ccf824897a7d839040ccc9c¹⁵\n\n¹⁵ https://github.com/davidsulc/structuring-backbone-with-requirejs-and-marionette/commit/0b8d7506bf18dd930ccf824897a7d839040ccc9c\n\
    \n## 加载主应用程序\n\n现在我们已经了解了 RequireJS 工作的基本原理，让我们使用它来请求我们的联系人管理器应用程序并启动它。我们将从一个非常基础的应用程序文件开始，以便首次体验如何定义和使用\
    \ RequireJS 模块。您应该已经有一个 *assets/js/app.js* 文件了，请将其保存到其他地方，或者直接覆盖它。我们暂时还不需要它，但很快就会用到。这是我们的基础应用程序：\n\
    \n```javascript\n// assets/js/app.js\nvar ContactManager = new Marionette.Application();\n\
    \nContactManager.on(\"initialize:after\", function(){\n  console.log(\"Contact\
    \ Manager has started\");\n});\n```\n\n⚠️ 这段代码对您来说应该很清晰。如果不清晰，我建议您阅读我的[介绍 Marionette\
    \ 的书](https://leanpub.com/marionette-gentle-introduction)。\n\n目前我们的应用只是在启动后向控制台打印一条消息，这足以开始使用\
    \ RequireJS。那么现在怎么办？为了能够将我们的联系人管理器应用程序用作依赖项，我们需要将其定义为一个 RequireJS 模块。简单来说，一个 RequireJS\
    \ 模块指明所需的依赖项，并返回一个值，该值将在提供给 `require` 调用的回调函数中使用。\n\n## 发现模块\n\n如果您看一下我们上面的简单代码，您会看到我们将需要访问\
    \ Marionette。此外，我们将在应用程序的许多地方需要访问 ContactManager，例如用于定义模块。以下是我们以 RequireJS 模块形式编写的联系人管理器：\n\
    \n```javascript\n// assets/js/app.js\ndefine([\"marionette\"], function(Marionette){\n\
    \  var ContactManager = new Marionette.Application();\n\n  ContactManager.on(\"\
    initialize:after\", function(){\n    console.log(\"Contact Manager has started\"\
    );\n  });\n\n  return ContactManager;\n});\n```\n\n我们添加的唯一修改是第 1 行的 `define` 调用，以及第\
    \ 8 行对应用程序引用的返回。现在，让我们回到 `require_main.js` 文件，来请求并启动我们的应用：\n\n```javascript\n\
    // assets/js/require_main.js\nrequirejs.config({\n  // 为简洁起见已编辑\n});\n\nrequire([\"\
    app\"], function(ContactManager){\n  ContactManager.start();\n});\n```\n\n正如前面解释的，我们请求了主应用程序文件（由于\
    \ `baseUrl` 的值，该文件解析为 `assets/js/app.js`），我们在提供的回调函数中接收它。然后我们可以像往常一样启动应用程序。然而，与\
    \ RequireJS 相比有一个主要区别：`ContactManager` 不再是一个全局变量，只能通过请求主应用程序来访问。\n\n> 那调试呢？如果我们在控制台中输入\
