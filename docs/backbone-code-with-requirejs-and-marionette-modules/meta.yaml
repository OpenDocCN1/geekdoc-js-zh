  md: "# Listing Contacts\n\nLet's start by adding the Backbone.localstorage plugin\
    \ to our *require_main.js*:\n\n**assets/js/require_main.js**\n\n```\nrequirejs.config({\n\
    \  baseUrl: \"assets/js\",\n  paths: {\n    // edited for brevity\n    localstorage:\
    \ \"vendor/backbone.localstorage\",\n    // edited for brevity\n  },\n\n  shim:\
    \ {\n    // edited for brevity\n    \"jquery-ui\": [\"jquery\"],\n    localstorage:\
