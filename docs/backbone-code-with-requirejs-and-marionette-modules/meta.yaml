    \ `require_main.js` 中使用字符串\"jquery-ui\"作为 jQuery UI 库的标识符\n- 在 `require_main.js`\
    \ 中的 `shim` 对象内，你可以通过提供依赖项数组来指定 jQuery UI 依赖于 jQuery。我们还没有在本书中涵盖这一点，但你可以尝试从[文档](http://requirejs.org/docs/api.html#config-shim)¹⁹中弄清楚（阅读关于\
    \ jQuery 和 Backbone 插件的部分）\n- 在指示对话框区域模块的位置（用于主应用程序的依赖数组）时，不要忘记路径应相对于 `assets/js`\
    \ baseUrl 来指示\n\n你可以在下一页看到解决方案。\n\n让我们首先将 jQuery UI 添加到我们的设置中：\n\n**assets/js/require_main.js**\n\
    \n```javascript\nrequirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n \
    \   backbone: \"vendor/backbone\",\n    jquery: \"vendor/jquery\",\n    \"jquery-ui\"\
    : \"vendor/jquery-ui\",\n    json2: \"vendor/json2\",\n    marionette: \"vendor/backbone.marionette\"\
    ,\n    underscore: \"vendor/underscore\"\n  },\n\n  shim: {\n    underscore: {\n\
    \      exports: \"_\"\n    },\n    backbone: {\n      deps: [\"jquery\", \"underscore\"\
    , \"json2\"],\n      exports: \"Backbone\"\n    },\n    marionette: {\n      deps:\
    \ [\"backbone\"],\n      exports: \"Marionette\"\n    },\n    \"jquery-ui\": [\"\
    jquery\"]\n  }\n});\n\nrequire([\"app\"], function(ContactManager){\n  ContactManager.start();\n\
    });\n```\n\n现在，我们可以将我们的对话框区域转换为 RequireJS 模块：\n\n**assets/js/apps/config/marionette/regions/dialog.js**\n\
    \n```javascript\ndefine([\"marionette\", \"jquery-ui\"], function(Marionette){\n\
    \  Marionette.Region.Dialog = Marionette.Region.extend({\n    onShow: function(view){\n\
    \      this.listenTo(view, \"dialog:close\", this.closeDialog);\n\n      var self\
    \ = this;\n      this.$el.dialog({\n        modal: true,\n        title: view.title,\n\
    \        width: \"auto\",\n        close: function(e, ui){\n          self.closeDialog();\n\
    \        }\n      });\n    },\n\n    closeDialog: function(){\n      this.stopListening();\n\
    \      this.close();\n      this.$el.dialog(\"destroy\");\n    }\n  });\n\n  return\
    \ Marionette.Region.Dialog;\n});\n```\n\n同样，将现有代码转换为 RequireJS 模块所做的唯一修改，是指定依赖项并将现有代码放在回调函数内（第1行），并返回正确的引用值（第24行）。在第一行，注意我们需要\
    \ jQuery UI，但没有在回调函数的参数中使用其值。这是因为我们需要 jQuery UI 存在（为了在第7行调用 dialog），但代码中没有显式调用\
    \ jQuery UI。相比之下，我们需要 Marionette 的引用，因为我们在第2行显式使用了它。²⁰\n\n然后，我们只需要将我们的对话框区域添加到主应用程序模块定义中的所需依赖项中：\n\
    \n> ²⁰ 注意，这在技术上并不完全正确：我们使用的是标准的 Marionette 构建版本，它注册了一个全局的 Marionette 引用。\n\n**assets/js/app.js**\n\
    \n```javascript\ndefine([\"marionette\", \"apps/config/marionette/regions/dialog\"\
    ],\n  function(Marionette){\n    var ContactManager = new Marionette.Application();\n\
    \n    ContactManager.addRegions({\n      headerRegion: \"#header-region\",\n \
    \     mainRegion: \"#main-region\",\n      dialogRegion: Marionette.Region.Dialog.extend({\n\
    \        el: \"#dialog-region\"\n      })\n    });\n\n    // 未修改的代码为简洁起见已编辑\n\n\
    \    return ContactManager;\n});\n```\n\n我们再次需要对话框区域作为依赖项，但没有将其添加到回调参数中。这是因为对话框区域需要在我们第8行使用它时已经加载，但没有直接引用它（因为我们通过\
    \ Marionette 对象访问它）。\n\n现在，当我们刷新页面时，我们可以在控制台中看到我们的消息，没有错误。\n\nGit 提交加载对话框区域依赖项：\n\
    0d19d5798baa9cd35decc27a6798d7101ee18dbc²¹\n"
