    \n### Marionette 模块与普通 RequireJS 模块\n\nMarionette 提供了一个模块化机制，RequireJS也有。我们已经同时使用了这两者：为什么？因为\
    \ Marionette 的模块为我们提供一些功能而 RequiresJS无法提供：即启动/停止一个模块（及其子模块）的功能，我们将在下一章实现它。\n\n\
    由于我们尚未使用 Marionette 模块提供的 start/stop能力（我们将这样做是在[下一章]），因此它们的使用尚有争议：在本章中，我们将看看在使用\"\
    plain(普通)\"RequireJS 模块时一些模块会是什么样子：这在许多项目中都是你所需要的一切。但再次地：你除了 RequireJS 模块之外是否还使用\
