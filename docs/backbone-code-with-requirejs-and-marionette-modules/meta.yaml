- md: "## Listing Contacts\n\nSo far, we've got our main app starting properly, requiring\
    \ its dependencies, and displaying a message in the console. In this chapter,\
    \ we'll work on getting our list of contacts displayed. The first thing we need\
    \ to do is turn our contacts entity into a module.\n\nWhen rewriting an existing\
    \ application to use RequireJS, it's important to structure your approach based\
    \ on the dependency tree, and to work in as small increments as possible. This\
    \ allows you to check your reimplementation with less new code, and allows you\
    \ to track down issues much more efficiently. Naturally, this is an established\
    \ best practice but it takes on particular importance when working with RequireJS:\
    \ trying to determine why certain libraries won't load properly after a huge diff\
    \ is not enjoyable.\n\nWith that in mind, here's how we will approach this iteration:\n\
    \n-   1. Define modules for our contact entity, and make sure it's working properly\
    \ (from the console);\n-   2. Require the module from the main app file, and check\
    \ we can work with it properly when loading it as a dependency;\n-   3. Ensure\
    \ we can obtain the contacts from the \"list\" controller;\n-   4. Display the\
    \ contact within views;\n-   5. Using RequireJS to load the view templates.\n\n\
    ## Modularizing the Contact Entity\n\nLet's get started: first, you need to make\
    \ a module out of our configuration for localstorage use (at *assets/js/apps/config/storage/localstorage.js*).\
    \ Don't forget that this module will depend on the Backbone.localstorage plugin,\
    \ and that in turn the plugin depends on Backbone.\n\nYou can see the solution\
    \ on the next page.\n\n## Listing Contacts\n\nLet's start by adding the Backbone.localstorage\
    \ plugin to our *require_main.js*:\n\n**assets/js/require_main.js**\n\n```javascript\n\
    requirejs.config({\n  baseUrl: \"assets/js\",\n  paths: {\n    // edited for brevity\n\
    \    localstorage: \"vendor/backbone.localstorage\",\n    // edited for brevity\n\
    \  },\n\n  shim: {\n    // edited for brevity\n    \"jquery-ui\": [\"jquery\"\
    ],\n    localstorage: [\"backbone\"]\n  }\n});\n\nrequire([\"app\"], function(ContactManager){\n\
    \  ContactManager.start();\n});\n```\n\n> Don't forget commas when adding attributes\
    \ (e.g. after line 11)\n\nWith the plugin now accessible via the \"localstorage\"\
    \ key, let's convert our storage configuration code into a RequireJS module:\n\
    \n**assets/js/apps/config/storage/localstorage.js**\n\n```javascript\ndefine([\"\
    app\", \"localstorage\"], function(ContactManager){\n  ContactManager.module(\"\
    Entities\", function(Entities, ContactManager,\n                             \
    \                 Backbone, Marionette, $, _){\n    // edited for brevity\n  });\n\
    \n  return ContactManager.Entities.configureStorage;\n});\n```\n\nAnd now, we\
    \ can also turn our contact entity into a module:\n\n## assets/js/entities/contact.js\n\
    \n```javascript\ndefine([\"app\", \"apps/config/storage/localstorage\"], function(ContactManager){\n\
    \  ContactManager.module(\"Entities\", function(Entities, ContactManager,\n  \
    \                                                    Backbone, Marionette, $,\
    \ _){\n    // edited for brevity\n  });\n\n  return ;\n});\n```\n\nNote that the\
    \ code above doesn't exactly conform to the RequireJS best practice of \"one module\
    \ per file\" (see here^22). The cleanest way to proceed would be to define one\
    \ module for the `Contact` model, and another for the `ContactCollection` collection\
    \ (which would have the \"contact\" module as a dependency). These modules would\
    \ return the defined model or collection, respectively.\n\nWhy aren't we doing\
    \ that? Well, we're simplifying our dependency tree somewhat since the `Contacts`\
    \ collection doesn't need to depend on the `Contact` model: they're both in the\
    \ same Marionette module. In addition, don't forget we need our \"contact:entity\"\
    \ and \"contact:entities\" handlers to be registered before we can use them in\
    \ our application. This means that RequireJS needs to load them, and it's easier\
    \ to just have everything in one place (model, collection, event handlers). And,\
    \ last but not least, we are going to interact with our contact entities using\
    \ the request-response mechanism, so there's no need for us to have an explicit\
    \ reference to the model or collection.\n\nIn our case, we're using a single module\
    \ to define 2 separate things (a model and a collection), so there's really no\
    \ clear return value to provide as the module return value. We still include a\
    \ `return` statement for clarity (indicating we haven't forgotten the return value,\
    \ we're returning \"nothing\"). How will this code be functional? Because we simply\
    \ need it to be loaded: we're not going to access the contact entities by explicit\
    \ reference, we're going to request their values via Marionette's request-response\
    \ mechanism so we have no need for a \"usable\" return value.\n\nSo far, so good,\
    \ let's verify our contact entity module works, by executing the following code\
    \ in the console:\n\n### Testing the contact entity module from the console\n\n\
    ```javascript\nrequire([\"app\", \"entities/contact\"], function(ContactManager){\n\
    \    var fetchingContacts = ContactManager.request(\"contact:entities\");\n  \
    \  $.when(fetchingContacts).done(function(contacts){\n        console.log(contacts);\n\
    \    });\n});\n```\n\nAfter executing that code, we can see our contacts listed\
    \ in the console. Success!\n\n## Using the Contact Entity from the Main App\n\n\
    Now that we know our contact entity module is functional, let's use it from within\
    \ our main application to display the contacts in the console once the app is\
    \ initialized. Here we go:\n\n**assets/js/app.js**\n\n```javascript\ndefine([\"\
    marionette\", \"entities/contact\",\n       \"apps/config/marionette/regions/dialog\"\
    ], function(Marionette){\n    var ContactManager = new Marionette.Application();\n\
    \n    // edited for brevity\n\n    ContactManager.on(\"initialize:after\", function(){\n\
    \        var fetchingContacts = ContactManager.request(\"contact:entities\");\n\
    \        $.when(fetchingContacts).done(function(contacts){\n            console.log(contacts);\n\
    \        });\n\n        if(Backbone.history){\n            Backbone.history.start();\n\
    \n            if(this.getCurrentRoute() === \"\"){\n                ContactManager.trigger(\"\
    contacts:list\");\n            }\n        }\n    });\n\n    return ContactManager;\n\
    });\n```\n\nWe refresh the page, and boom! An error: “TypeError: ContactManager\
    \ is undefined” in file *localstorage.js*. Why is this happening? Let’s think\
    \ about how RequireJS is traversing the dependency tree:\n\n-   1. In *require_main.js*,\
    \ we require the *assets/js/app.js* module;\n-   2. In *app.js*, we require *assets/js/entities/contact.js*\
    \ (among others);\n-   3. In *contact.js*, we require *assets/js/apps/config/storage/localstorage.js*\
    \ (among others);\n-   4. In *localstorage.js*, we require *assets/js/app.js*\
    \ (among others).\n\nSo if we summarize the situation (and skip extra steps),\
    \ we have the following situation:\n\n-   *app.js* needs *localstorage.js* (via\
    \ the dependency tree: steps 2 and 3 above)\n-   *localstorage.js* needs *app.js*\
    \ (as a direct dependency: step 4 above)\n\nWhich is a **circular dependency**^23:\
    \ 2 modules depend on one another, so they don’t load properly. The error message\
    \ basically indicates that the `ContactManager` module can’t be loaded in the\
    \ *localstorage.js* file (due to the circular dependency) so an *undefined* return\
    \ value gets assigned to the callback argument. Circular dependencies can be thought\
    \ of visually like this^24:\n\nEach vehicle wants to go forward, so nobody gets\
    \ to move forward...\n\nHow do we fix this situation? Push the dependency requirements\
    \ as far down as possible (i.e. as close as possible to where they are needed).\
    \ In fact, the only dependencies that should be listed in the module definition\
    \ are those without which the module can’t function, even momentarily. In most\
    \ cases, the only such dependency will be the main app (so we can execute the\
    \ module definition function). With that in mind, here’s our rewritten main app:\n\
    \n```javascript\ndefine([\"marionette\", \"apps/config/marionette/regions/dialog\"\
    ],\n\tfunction(Marionette){\n\t\tvar ContactManager = new Marionette.Application();\n\
    \n\t\t// edited for brevity\n\n\t\tContactManager.on(\"initialize:after\", function(){\n\
    \t\t\trequire([\"entities/contact\"], function(){\n\t\t\t\tvar fetchingContacts\
    \ = ContactManager.request(\"contact:entities\");\n\t\t\t\t$.when(fetchingContacts).done(function(contacts){\n\
    \t\t\t\t\tconsole.log(contacts);\n\t\t\t\t});\n\t\t});\n\n\t\tif(Backbone.history){\n\
    \t\t\tBackbone.history.start();\n\n\t\t\tif(this.getCurrentRoute() === \"\"){\n\
    \t\t\t\tContactManager.trigger(\"contacts:list\");\n\t\t\t}\n\t\t}\n\t});\n\n\t\
    return ContactManager;\n});\n```\n\nWe've removed the dependency from the module\
    \ definition, and we simply require our contacts where we need them (namely, on\
    \ line 8). Now, when we refresh we can see our contacts in the console output.\n\
    \n> Note that since we're progressing in short iterations, it was relatively straightforward\
    \ to pinpoint the issue plaguing our code. Debugging this type of problem with\
    \ lots of new code would have been more time intensive, as the error message regarding\
    \ the circular dependency isn't particularly explicit. So keep your code diffs\
    \ small!\n\n## Listing Contacts from the List Sub-Application\n\nFirst, we obviously\
    \ need to remove the contact-fetching code from the main app, so our event listener\
    \ looks like this:"
  mdcn: "\n## 列出联系人\n\n到目前为止，我们已经让主应用程序正确启动，需要其依赖项，并在控制台显示消息。在本章中，我们将着手让联系人列表显示出来。我们需要做的第一件事是将我们的联系人实体转换为模块。\n\
    \n当重写现有应用程序以使用 RequireJS 时，基于依赖树构建方法结构非常重要，并且应尽可能以小步幅进行工作。这允许你用更少的代码检查你的重构实现，并更高效地跟踪问题。当然，这是一个既定最佳实践，但在与\
    \ RequireJS 一起工作时尤为重要：试图确定为什么在巨大的差异后某些库无法正常加载并不愉快。\n\n考虑到这一点，我们将这样处理本次迭代：\n\n\
    -   1. 为联系人实体定义模块，并确保其正常工作（通过控制台）；\n-   2. 从主应用程序文件中引入该模块，并检查在将其作为依赖项加载时是否可以正常配合工作；\n\
    -   3. 确保可以从\"列表”控制器获取联系人；\n-   4. 在视图中显示联系人；\n-   5. 使用 RequireJS 加载视图模板。\n\n\
