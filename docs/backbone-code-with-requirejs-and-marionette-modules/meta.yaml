    \ 中搜索，因为构建文件的默认基础路径是 assets/js，而我们的主配置文件定义了自己的 baseUrl 属性为 assets/js。把这两个合在一起，优化器会在\
    \ assets/js/assets/js 中查找库，这不是我们想要的……相反，我们需要提供我们想要使用的实际路径，相对于应用的基础目录。在我们的例子中，我们希望它是那个相同的基础目录，因此使用\
    \ \".\" 路径；\n\n> http://nodejs.org/download/\n\n> http://requirejs.org/docs/download.html#rjs\n\
    \n注意，按照说明，你也可以在使用 npm 安装优化器后使用它。\n\n> http://requirejs.org/docs/optimization.html#wholeproject\n\
