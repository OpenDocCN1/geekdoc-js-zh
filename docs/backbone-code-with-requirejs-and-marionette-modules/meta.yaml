    We refresh the page, and boom! An error: “TypeError: ContactManager is undefined”
    in file *localstorage.js*. Why is this happening? Let’s think about how RequireJS
    is traversing the dependency tree:


    +   1. In *require_main.js*, we require the *assets/js/app.js* module;

    2. In *app.js*, we require *assets/js/entities/contact.js* (among others);

    3. In *contact.js*, we require *assets/js/apps/config/storage/localstorage.js*
    (among others);

    4. In *localstorage.js*, we require *assets/js/app.js* (among others).


    So if we summarize the situation (and skip extra steps), we have the following
    situation:


    +   - *app.js* needs *localstorage.js* (via the dependency tree: steps 2 and 3
    above)

    - *localstorage.js* needs *app.js* (as a direct dependency: step 4 above)


    Which is a **circular depency**<sup>23</sup>: 2 modules depend on one another,
    so they don’t load properly. The error message basically indicates that the `ContactManager`
    module can’t be loaded in the *localstorage.js* file (due to the circular dependency)
    so an *undefined* return value gets assigned to the callback argument. Circular
    dependencies can be thought of visually like this<sup>24</sup>:


    ![](img/9187ef8c47fe9c0a5221f8482c870d45_30_0.png)


    Each vehicle wants to go forward, so nobody gets to move forward...


    How do we fix this situation? Push the dependency requirements as far down as
    possible (i.e. as close as possible to where they are needed). In fact, the only
    depencies that should be listed in the module definition are those without which
    the module can’t function, even momentarily. In most cases, the only such dependency
    will be the main app (so we can execute the module definition function). With
    that in mind, here’s our rewritten main app:'
