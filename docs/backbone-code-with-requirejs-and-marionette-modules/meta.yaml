  md: "# # Optimizing the Application with r.js\n\nSo far, we’ve rewritten our app\
    \ to use a mix of “plain” RequireJS and Marionette modules, all handled by RequireJS.\
    \ As you’ll recall, RequireJS automatically handles the dependencies and loads\
    \ the javascript files in the proper order. However, this order doesn’t change\
    \ that often (certainly not on each page request), so why are we having this work\
    \ done over and over? Wouldn’t it be smarter to just compute the dependencies\
    \ once, store the resulting code in a single file and use that in our application?\
    \ Of course it is, and that’s one of the goals of r . js, the optimizer provided\
    \ by RequireJS.\n\nBefore we can run the optimizer on our application, we’ll need\
    \ to install node.js (download here41). Then, download the r . js file form here42\
    \ and store it in your application’s root path.43\nWith that out of the way, we’re\
    \ almost ready to run the optimizer. We’ll need a build file44:\n\n**assets/js/build.js**\n\
    \n```\n{\n  baseUrl: \".\",\n  name: \"require_main\",\n  mainConfigFile: \"require_main.js\"\
    ,\n  out: \"require_main.built.js\"\n}\n```\n\nHere’s what each attribute does\
    \ (find out more here45):\n\n+   - baseUrl defines the url from which all other\
    \ paths are determined, and it defaults to the build file’s path, in our case\
    \ assets/js (since that's where we've stored our build file). This would mean\
    \ that our libraries would be searched for within assets/js/assets/js, because\
    \ the build file would have a default base path of assets/js, and our main configuration\
    \ file defines its own baseUrl attribute as assets/js. Put both of those together,\
    \ and we have the optimizer looking for libraries in assets/js/assets/js, which\
    \ isn't what we want... Instead, we need to provide the actual path we want to\
    \ use, relative to the application's base directory. In our case we want it to\
    \ be that same base directory, hence the \".\" path;\n\n> http://nodejs.org/download/\n\
    \nhttp://requirejs.org/docs/download.html#rjs\n\nNote that, per the instructions,\
    \ you can also use the optimizer after installing it with npm.\n\nhttp://requirejs.org/docs/optimization.html#wholeproject\n\
    \nhttps://github.com/jrburke/r.js/blob/master/build/example.build.js"
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   * since we''re only optimizing one module (the main module, which will
    recursively optimize all its dependencies), we can provide the module''s name
    inline with the name attribute. Since the assets/js/require_main.js file defines
    our main module, we simply provide its name here, and RequireJS figures out where
    it is located (via the baseUr1 properties);

    * mainConfigFile allows us to tell the optimizer where we have our configuration
    options, so we don''t need to repeat them on the command line. Once again, the
    file''s location is determined via the baseUr1 properties;

    * out is the name of the built file we want the optimizer to generate. This way,
    we''ll have a single, optimized, and uglified file for inclusion in the deployed
    application. Here too, it''s location is determined by the baseUr1 properties.


    We''re now ready to run the optimizer. From our application''s root directory,
    use a command console to run


    ```

    node r.js -o assets/js/build.js

    ```


    You''ll notice that we''ve indicated the location of our build file with the -o
    option. Once the optimizer is done running, you''ll have a brand new file: assets/js/require_main.built.js
    containing our entire app in a single minified file.


    Let''s try our new file by using it in our index.html file:


    # # index.html


    ```

    1 <!DOCTYPE html>

    2 <html lang="en">

    3  <head>

    4   <meta charset="utf-8">

    5   <title>Marionette Contact Manager</title>

    6   <link href="./assets/css/bootstrap.css" rel="stylesheet">

    7   <link href="./assets/css/application.css" rel="stylesheet">

    8   <link href="./assets/css/jquery-ui-1.10.0.custom.css" rel="stylesheet">

    9 </head>

    10

    11 <body>

    12  <div id="header-region"></div>

    13

    14 <div id="main-region" class="container">

    15   <p>Here is static content in the web page. You''ll notice that

    16     it gets replaced by our app as soon as we start it.</p>

    17 </div>

    ```'
