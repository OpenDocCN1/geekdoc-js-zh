    # 1. What is the correct way to declare a variable in JavaScript?


    a. var x = 5;


    b. let x = 5;


    c. const x = 5;


    d. all of the above


    # Correct Answer:


    b. let x = 5;


    **Explanation:** Variables can be declared using var, let, or const in JavaScript,
    but the recommended way is to use let for variable declarations due to its block
    scope.


    # 2. How do you write a comment in JavaScript?


    - a. //This is a comment

    - b. <!--This is a comment-->

    - c. /*This is a comment*/

    - d. #This is a comment


    **Correct Answer:**


    a. //This is a comment


    **Explanation:** In JavaScript, single-line comments are written with // , and
    multi-line comments are written with /* */.


    # 3. What is the purpose of the addEventListener method in JavaScript?


    - a. To create a new element

    - b. To append an element to the DOM

    - c. To handle events like clicks or keypresses

    - d. To define a function


    # Correct Answer:


    c. To handle events like clicks or keypresses


    **Explanation:** addEventListener is used to listen for specific events on HTML
    elements and execute a function when that event occurs.


    # 4. How can you check the type of a variable in JavaScript?


    - a. typeOf x;

    - b. typeof(x);

    - c. x.typeof();

    - d. typeof x;


    # Correct Answer:


    d. typeof x;


    **Explanation:** The typeof operator is used to get the data type of a variable
    in JavaScript.


    # 5. What does the term "hoisting" refer to in JavaScript?


    - a. Elevating a variable declaration to the top of its scope

    - b. Creating a loop

    - c. Moving an element on the web page

    - d. Declaring a function


    # Correct Answer:


    a. Elevating a variable declaration to the top of its scope


    **Explanation:** Hoisting in JavaScript means that variable and function declarations
    are moved to the top of their containing scope during the compilation phase.


    # 6. How can you prevent a form from submitting using JavaScript?


    a. event.preventDefault();

    b. event.stopDefault();

    c. event.preventDefault();

    d. form.preventSubmission();


    # Correct Answer:


    c. event.preventDefault();


    **Explanation:** The preventDefault method is used to prevent the default action
    of an event, such as form submission.


    # 7. What is the purpose of the querySelector method in JavaScript?


    a. To select the first element that matches a specified selector

    b. To change the document title

    c. To create a new HTML element

    d. To define a function


    # Correct Answer:


    a. To select the first element that matches a specified selector


    **Explanation:** querySelector is used to select the first HTML element that matches
    a specified selector.


    # 8. Which operator is used for strict equality in JavaScript?


    a. ==

    b. ===

    c. =

    d. !==


    **Correct Answer:**


    b. ===


    **Explanation:** The === operator checks both value and type for equality in JavaScript.


    # 9. What is the purpose of the setTimeout function in JavaScript?


    - a. To create a timer that executes a function after a specified time

    - b. To set the style of an HTML element

    - c. To add a delay to a loop

    - d. To define a recursive function


    # Correct Answer:


    a. To create a timer that executes a function after a specified time


    **Explanation:** setTimeout is used to schedule the execution of a function after
    a specified delay.


    # 10. How do you check if a variable is an array in JavaScript?


    - a. isArray(x);

    - b. x.isArray();

    - c. ArrayCheck(x);

    - d. typeof Array(x);


    # Correct Answer:


    a. isArray(x);


    **Explanation:** The isArray method is used to check if a variable is an array
    in JavaScript.


    # 11. What does the this keyword refer to in JavaScript?


    a. The current date and time

    b. The global object

    c. The current function''s scope

    d. The calling object


    # Correct Answer:


    d. The calling object


    **Explanation:** In JavaScript, the this keyword refers to the object that is
    calling the function.


    # 12. How do you convert a string to lowercase in JavaScript?


    - a. str.toLowerCase();

    - b. str.toLowerCase();

    - c. str.toLowerCase();

    - d. str.convertLowerCase();


    # Correct Answer:**


    c. str.toLowerCase();


    **Explanation:** The toLowerCase method is used to convert a string to lowercase
    in JavaScript.


    # 13. What is the purpose of the JSON.parse method in JavaScript?


    - a. To parse HTML documents

    - b. To convert a JSON string to a JavaScript object

    - c. To create a JSON string

    - d. To validate JSON


    # Correct Answer:


    b. To convert a JSON string to a JavaScript object


    **Explanation:** JSON.parse is used to parse a JSON string and convert it into
    an object.


    # 14. How do you remove an element from an array in JavaScript?


    - a. array.remove(index);

    - b. array.splice(index, 1);

    - c. array.delete(index);

    - d. array.pop(index);


    # Correct Answer:


    b. array.splice(index, 1);


    **Explanation:** The splice method is used to remove elements from an array.


    # 15. What is the purpose of the localStorage object in JavaScript?


    - a. To store session-specific data

    - b. To store data with no expiration

    - c. To store temporary data in a session

    - d. To store data on the server


    # Correct Answer:


    b. To store data with no expiration


    **Explanation:** The localStorage object is used to store key/value pairs with
    no expiration in web browsers.


    # 16. How can you check if a property exists in an object in JavaScript?


    - a. object.propertyExists(prop);

    - b. object.checkProperty(prop);

    - c. prop in object;

    - d. object.propertyCheck(prop);


    # Correct Answer:


    c. prop in object;


    **Explanation:** The in operator is used to check if a property exists in an object.


    # 17. What is the purpose of the map function in JavaScript?


    a. To create a new array with the results of calling a function on every element

    b. To rearrange elements in an array

    c. To check if every element in an array meets a specified condition

    d. To concatenate two arrays


    # Correct Answer:


    a. To create a new array with the results of calling a function on every element


    **Explanation:** The map function is used to apply a function to every element
    in an array and create a new array with the results.


    # 18. How do you handle errors in JavaScript?


    - a. try/throw/catch

    - b. catch/throw/finally

    - c. try/catch/finally

    - d. throw/try/try/catch


    # Correct Answer:


    c. try/catch/finally


    **Explanation:** Error handling in JavaScript is typically done using the try,
    catch, and finally blocks.


    # 19. What is the purpose of the fetch function in JavaScript?


    - a. To fetch data from a local file

    - b. To fetch data from a server using AJAX

