    | /= | $x /= 2 | Assign the value of $x divided by 2 to $x |

    | *= | $x *= 2 | Assign the value of $x multiplied by 2 to $x |

    | %= | $x %= 2 | Assign the value of $x to the modulus 2 of $x |

    | .= | $x .= "value" | Assign the value of $x to the value of $x$ concatenated
    with "value" |


