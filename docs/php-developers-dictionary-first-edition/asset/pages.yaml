  md: 'There are four calendar formats that are supported in PHP; they are the Gregorian
    calendar, the Julian calendar, the Jewish calendar, and the French Republic calendar.
    Although the Gregorian calendar is recognized worldwide as the standard calendar
    format, some applications require conversion to other formats. The Julian calendar
    was created in 46 B.C. and has the basic format of today''s Gregorian calendar.
    There are 365.25 days in the Julian calendar, and the only difference between
    the Julian and the Gregorian calendars is how the leap years are handled. Compare
    365.25 days in the Julian calendar to the currently accepted 365.2429 days in
    the Gregorian calendar and you will realize that there is compensation for this.
    The Gregorian calendar system states that centennial years are not leap years
    unless they are divisible by 400. The year 2000 is a leap year, but 1900 was not,
    nor will 2100.


    The Jewish calendar has been in use by the Jewish people for thousands of years.
    This format has 12 or 13 months with 29 or 30 days per month. The Jewish calendar
    has depended on the religious holidays and the positioning of the Sabbath during
    year. These are all taken into account in the PHP calendar functions.


    The French Republican calendar was very short-lived. It was used in France after
    the French Revolution and was centered on science, mathematics, and astronomy
    rather than religion. This system was adopted in October 1793 and was abandoned
    more than 13 years later in January 1806.

    PHP provides eight functions to convert between these types of calendars. These
    conversion functions are


    Table 2.5. Calendar Conversion Functions


    | Function | Description |

    | --- | --- |

    | JDTregorian() | This function converts a Julian day count to a Gregorian date
    |

    | GregorianToJD() | This function converts a Gregorian date to a Julian day count
    |

    | JDToJulian() | This function converts a Julian day count to a Julian date |

    | JulianToJD() | This function converts a Julian date to a Julian day count |

    | JDToJewish() | This function converts a Julian day count to the Jewish calendar
    |

    | JewishToJD() | This function converts a date in the Jewish calendar to Julian
    day count |


    JDToFrench() | This function converts a Julian day count to the French Republican
    calendar


    FrenchToJD() | This function converts a date from the French Republican calendar
    to a Julian day count


    Table 2.6. Remaining PHP Calendar Functions


    | Function | Description |

    | --- | --- |

    | JDMName() | This function returns the month name |

    | JDDayOfWeek() | This function returns the Julian day of the week |

    | easter_date() | This function returns the UNIX timestamp for midnight on Easter
    of a given year |

    | easter_days() | This function returns the number of days between March 21 and
    Easter |'
