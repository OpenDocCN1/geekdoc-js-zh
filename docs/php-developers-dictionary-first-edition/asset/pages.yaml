- img_proc: true
  md: '# PHP Developer''s Dictionary


    # Description


    The `user_dir` configuration setting indicates the base name used for a user''s
    home directory. For example, a value of "/home" tells PHP to look in `/home/~username`
    for a person''s PHP files. The default value is `none`.


    # variable_order


    # Syntax


    ```

    variable_order string

    ```


    # Description


    The `variable_order` directive sets the order of `GET/POST/COOKIE` variable parsing.
    Note that this function replaces the `gpc_order` directive, which has been deprecated.
    When PHP reads an incoming request, it automatically analyzes the request and
    identifies variables and their values, making them available for script access.
    This specifies the order in which the request is analyzed. The order indicates
    which option will take a higher precedence when the same variable name appears
    more than once. The options to the right have a higher precedence than the options
    to the left. For example, a `variable_order PC` tells PHP to ignore the `GET`
    variables and that from `COOKIE` value have precedence over `POST` values. The
    default value is `GPC`.


    # warn_plus_overloading


    # Syntax


    ```

    warn_plus_overloading boolean

    ```


    # Description


    The `warn_plus_overloading` directive is used to indicate whether a warning message
    be generated when the parser encounters string concatenation done with a plus
    (+) sign instead of the . operator, which is the preferred method for concatenating
    strings. The default value is `off`.


