  md: '# PHP Developer''s Dictionary


    # Description


    The `chgrp()` function changes the group to which the file defined by `filename`
    belongs to the group defined by `group`. All UNIX permissions apply to the execution
    of this function. Users can only change the group to another group of which the
    user is a member. This function returns false, false, if it encounters a problem.
    Because Windows systems do not have an equivalent, this function always returns
    true, and the function does nothing.


    # chmod()


    # Syntax


    ```

    int chmod(string filename, int mode);

    ```


    # Description


    The `chmod()` function changes the permissions of the file specified by `filename`
    to the mode defined by `mode` (see Tables 9.1 and 9.2). The parameter passed as
    `mode` is not assumed to be octal unless it is preceded by a zero.


    Table 9.1. Permissions on a UNIX System

    | Mode | Permission |

    |---|---|n| 0(000) | No permissions |

    | 1(001) | Execute |

    | 2(010) | Write |

    | 3(011) | Write and execute |

    | 4(100) | Read |

    | 5(101) | Read and execute |

    | 6(110) | Read and write |

    | 7(111) | Read, write, and execute |


    Table 9.2. Permissions on a Windows system

    | Mode | Permission |

    |---|---|n| 1(0000100) | Execute |

    | 2(0000200) | Write |

    | 4(0000400) | Read |

    | Note |


    The only permission used on a Windows system is the read-only permission. This
    is because all files on a Windows system are readable and writable (if the directory
    is accessible). Execution is determined by the extension of the file (that is,
    .com, .exe, .bat, and so on) and not by an execute permission.'
