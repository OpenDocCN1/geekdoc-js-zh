  md: '# PHP Developer''s Dictionary


    # Syntax


    ```

    int setcookie(string name, [string value], [int expire], [string path], [string
    domain], [int secure])

    ```


    # Description


    The setcookie() function, which must be set before any headers (see header()),
    enables you to set a cookie (name) with a specific value. You can also set the
    cookie expires and what path has the right to read it under what domain. To format
    expires, you can use the UNIX time returned by time() or mktime(). The domain
    field can hold an absolute machine and domain name, such as machine.com or it
    can hold the domain portion (if you want all machines able to read the cookie
    in that domain), such as domain.com. Finally, secure takes a 1 or 0 to signify
    whether the cookie should be transmitted over HTTPS connections.


    Note


    You must be within the domain to set a cookie. Although PHP might try to set the
    cookie, the browser will not accept it. In other words, you can''t build a PHP
    application to run on http://www.mcp.com and set a cookie readable by .php.net.


    # IMAP, POP3, and NNTP


    The Internet Message Access Protocol (IMAP) and Post Office Protocol version 3
    (POP3) are used for email, and the Network News Transfer Protocol (NNTP) performs
    tasks that revolve around newsgroups. All these are standard Internet protocols
    that cover different types and methods of messaging. You can read the Request
    For Comments (RFC) on NNTP at http://www.ietf.org/rfc/rfc0977.txt, on IMAP at
    http://www.ietf.org/rfc/rfc2192.txt, and on POP3 at http://www.ietf.org/rfc/rfc2384.txt.
    Because of the semantics of creating emails and mailboxes, we highly recommend
    that you read through these specifications. Many of the terms and overall functioning
    defined in this section might not be clear.


    Note


    Although all the PHP functions in this section start with imap_, they are not
    limited to just IMAP, as the title of the section indicates. Also, it is worth
    noting that this library of functions was added in PHP 3.'
