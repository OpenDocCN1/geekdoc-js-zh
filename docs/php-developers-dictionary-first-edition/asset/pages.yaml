  md: '# PHP Developer''s Dictionary


    # Transaction Management


    As your database-enabled applications become bigger and more complex, you will
    find the need to lock tables and manage the transactions on the database to eliminate
    data corruption. When two queries access the same tables to perform any operation
    other than a simple query, there is the possibility for the data to become corrupted.

    The following example illustrates how to set up a transaction, perform the query
    or set of queries, and commit the transaction. If the transaction fails at any
    point, the entire series is rolled back.


    ```

    <html>

    <head>

    <title>Managing the Transaction</title>

    </head>

    <body>

    // Connect to the Postgres Database

    $conn = pg_connect("localhost", "5432", "", "", "test");

    if (!$conn) { echo "An database connection error occurred.\n";nexit; }


    // Begin the transaction

    $result = pg_exec($conn, "begin working");

    if (!$result) { echo "An error occurred beginning the transaction.\n";nexit; }


    // Lock the table

    $result = pg_exec($conn, "lock contacts");

    if (!$result) { echo "An error occurred locking the contacts table.\n";nexit;
    }


    // Insert the static values into the database

    $result = pg_exec($conn, "INSERT INTO contacts VALUES (NEXTVAL(''c''), ''Test
    Name'', ''Test Address'', ''title'', ''11,222,333'', ''444.555,666'',''me@email.com'')");

    if (!$result) { echo "An INSERT query error occurred.\n";exit; }


    // Get the last result that was inserted

    $oid = pg_get_lastid($result);

    if (!$oid) { echo "An OID error occurred.\n";exit; }


    // Select the record

    $result = pg_exec($conn, "SELECT cid FROM contacts WHERE oid=$oid");

    if (!$result) { echo "A SELECT query error occurred.\n";exit; }


    // Place the result in the variable $CID

    $cid = pg_result($result, 0, "cid");

    if (!$cid) { echo "There is a problem returning the Contact ID.\n";nexit; }


    // Print out the Contact ID

    else { echo "The record was successfully entered and the Contact ID is: " . $cid
    . "\n"; }


    // Commit the transaction

    pg_exec($conn, "commit working");

    ```


