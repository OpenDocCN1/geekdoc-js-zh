    # ClibPDF


    The ClibPDF functions allow you to generate PDF documents dynamically from your
    PHP code. The ClibPDF library is available from http://www.fastio.com, but it
    is not freeway, so you should consult the licensing agreement before implementing
    it in your code. The documentation that accompanies ClibPDF contains further details
    about each of the functions mentioned in this section. To understand the mapping
    of ClibPDF you should examine the cpdf.c file typically found in the /lib/cpdf/
    directory. Note that the ClibPDF library is not currently available as part of
    the Windows Distribution. To include ClibPDF add --withcpdf=< directory above
    /lib/cppdf.a> in your configure arguments. All PDF documents created with ClibPDF
    must include the following functions: cpdf_open(), cpdf_pageinit(), cpdf_finalize(),
    and cpdf_close(). Another alternative to the ClibPDF library is the PDF library
    documented later in this section. There are licensing differences between the
    two libraries as well as some feature differences—most notably, the ability to
    create the entire document in memory by using ClibPDF.


