    # Variables


    Variables in PHP come in many forms, but they are always preceded with a dollar
    sign ($). Variables can contain letters, numbers, and the underscore (_) character.
    Variables must contain only alphanumeric characters and must not contain spaces.
    PHP also enables you to use something known as dynamic variables. A dynamic variable
    is one in which the variable name can be stored in a variable. This can be quite
    confusing, but quite useful at the same time. Please consider the following example:


    ```

    $FirstName = "Kaitlin";

    ```


    This variable declaration is the same as


    ```

    $Variable="FirstName"

    $$Variable = "Kaitlin";

    ```


    The $Variable variable contains the string "FirstName". You can think of the variable
    $$Variable as a single $Variable followed by the value of $Variable or "FirstName".


    # Constants


    Constants are values that are defined in your PHP script and do not change. Constants
    are defined by using the define() function. After the constant is defined, it
    cannot be changed. Constants are accessed by using the name of the constant only.
    There is no dollar sign preceding the name of the constant. For example, the constant
    PI is defined like this:


    ```

    define("PI", 3.1415927);

    ```


    To access the value of PI, the code would look like this:


    ```

    $Circumference = PI*($Radius*$Radius);

    ```


    Note that constants are usually defined using all capital letters. PHP also has
    some internal constants. For the instance, the constant __FILE__ returns the name
    of the file that PHP is currently reading. The constant __LINE__ returns the line
    number of the file. These constants are normally used when you are generating
    error messages.


