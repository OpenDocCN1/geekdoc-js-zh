  md: '# PHP Developer Dictionary


    This detailed installation procedure steps through the process of installing PHP
    as a Dynamically Shared Object (DSO). The alternative to the DSO method is to
    compile PHP into the Apache Web Server as a static module. The static method is
    sometimes preferred because of the performance overhead of the DSO. Because of
    the simplicity of the dynamic method and the ease with modules can be changed,
    we describe the DSO method.


    After the Web Server is up and running, note the location of the apxs directory
    of the Apache installation. This should be something like `/usr/local/apache-2.3.12/bin`.
    If you are installing for a database, also note the home directory for database.
    For MySQL, your home directory might be something like `/usr/local/mysql`.


    You need to obtain the PHP source from the PHP Web site (http://www.php.net).
    You will find a named file like php-4.0.1pl.tar.gz available for download. Place
    this on your system if you have other applications installed. This will likely
    be `/usr/local` or `/opt`.


    Uncompress the gzipped file by typing something similar to the following line:


    ```

    gzip php-4.0.1pl.tar.gz

    ```


    This line reflects the current version of PHP and will vary accordingly. This
    will create a .tar xvf file in the current directory. Untar file by typing


    ```

    tar -xvf php-4.0.1pl.tar

    ```


    This creates a php-4.0.0 source and places all the PHP source files inside. Change
    directories to the php-4.0.0 directory and type


    ```

    ./configure --with-mysql=[path to mysql] --with-apxs=[path to apxs]

    ```


    where [path to mysql] is the path to your MySQL installation and [path to apxs]
    is the path to the Apache apxs directory. Please see the "Configuration Options"
    section for more details about compiling into PHP. This configures your environment
    and creates the make script. After the configure script is complete, type


    ```

    make

    ```


    This compiles the PHP source into the binary DSO. If make encounters any errors,
    it halts the execution of the script and displays the error. You must correct
    the error before compiling again. When the script has completed successfully,
    type


    ```

    make install

    ```


    This places the DSO in the appropriate place in the Apache directory and makes
    a few modifications to the httpd.conf file. The final modification is to edit
    the httpd.conf file and look for the following lines:


    ```

    # And for PHP 4.x, use:

    #

    ```'
