    of MCRYPT_name where name is the name of the cipher used. The mode is one of the
    MCRYPT_MODE_name constants (ECB, CBC, CFB, OFB, NOFB, or STREAM) and it determines
    the mode of the encryption. The optional init_vector parameter is the initialization
    vector for CBC, CFB, OFB modes, and in some algorithms, for STREAM mode.


