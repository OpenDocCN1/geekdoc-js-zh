    # Type Conversion


    In many programming languages, it is necessary to declare the variable as some
    type. Different types of variables are handled in different ways and take different
    amounts of memory. PHP does not require you to declare a variable''s type when
    the variable is initialized. For instance, if a variable has a value of 3.1415927,
    the variable is typed as double. Data types in PHP can be converted to integer,
    float, object, or array. PHP has functions to enable you to detect what a variable''s
    type is. The function gettype() returns a variable''s type based on what is passed
    into the function. PHP also gives you the ability to set an integer''s type by
    using settype().

    Type casting is also supported in PHP. To cast a variable as a certain type, you
    place the name of the data type in parentheses in front of the variable. For example,
    to cast a copy of the variable $pi to a double, the code is


    ```

    $pi = 3.1415927

    $copyofi = (double)$pi;

    print $copyofpi;

    ```


    This example prints the value 3.1415927. If the same variable were cast to an
    integer, the code would be


    ```

    $pi = 3.1415927

    $copyofi = (integer)$pi;

    print $copyofpi;

    ```'
