  md: '# # Chapter 9. System Extensions


    This chapter describes the PHP functions that interact with the operating system.
    These functions return information about users, directories, files, and processes.
    They provide information about the system and allow access to files and directories.
    This chapter also contains specific information about how to interact with NIS
    and retrieve information from POSIX system calls. There are also functions that
    enable you to manage shared memory, semaphores, and execute external scripts or
    programs and return the information to PHP.


    # ## Directory


    This section describes the functions that are used to open, read, change, rewind,
    and close directories. Remember that permissions are important when using these
    functions. If the user that is using the PHP script does not have permissions
    to perform the operation, the function will return an error.


    # ## chdir()


    # Syntax


    ```

    int chdir(string directory);

    ```


    # ## Description


    The chdir() function changes the current working directory to directory. This
    function returns true, 1, if the function is successful; false, 0, is returned
    if there is a problem changing directories.


    # ## dir()


    # Syntax


    ```

    new dir(string directory);

    ```


    # ## Description


    The dir() function uses object-oriented methodology for creating a directory object
    defined by two properties: handle and path. The handle property can be used with
    other directory functions, such as readdir() and closedir(). It behaves exactly
    as if the directory were opened using opendir() function. The path property is
    set to the directory that was opened.'
