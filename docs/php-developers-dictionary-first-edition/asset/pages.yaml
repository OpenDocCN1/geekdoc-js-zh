    # Date and Time


    The date and time functions within PHP enable you to obtain and format time and
    date stamps for your scripts. There are also functions that enable you to validate
    specific styles of time formats.


    # checkdate()


    Syntax


    ```

    int checkdate(int month, int date, int year)

    ```


    Description


    The checkdate() function validates the Gregorian date/time passed, which is represented
    by the month, date , and year parameters. If the date is valid, 1 is returned.
    Do note that the following rules apply to these parameters:


    +   - month—Must be between 1 and 12.


    +   - date—Must be within the allowed number of days for the given month. Leap
    years are taken into consideration.


    +   - year—Must be between 1 and 32767.


