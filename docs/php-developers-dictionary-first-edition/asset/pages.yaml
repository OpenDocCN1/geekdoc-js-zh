    ```


    # Description


    A function enables a programmer to define a reusable piece of code. This code
    potentially take an optional number of params and potentially return a result.
    For instance, if you wanted to check the Celsius or Fahrenheit temperature of
    a number passed, you could create a function that the numeric temperature value
    and the type (Celsius or Fahrenheit). This function could return the corresponding
    value based on the other unit of measurement. Defining this as a function enables
    you to reuse the code over and for an unlimited number of computations.

    In PHP3, these functions must be defined before they are used, in PHP4 this has
    changed. Additionally, PHP4 adds support for variable-length argument lists.


