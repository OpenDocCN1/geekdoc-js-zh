  md: '# PHP Developer Dictionary


    # Description


    The `ifx_query()` function, which is available in PHP 3.0.3 through PHP 3.0.16
    along with PHP 4.0 and higher, sends a query to the currently active database
    on the server indicated by the `link identifier` parameter. If no `link identifier`
    is used, an attempt is made to use the last opened link. If no open links are
    available, the optional `cursor_type` parameter is used to set the cursor processing
    to scroll, hold, sequential, or a combination of scroll and hold. To set scroll
    processing, specify `IFX_SCROLL`-these are constant values that don''t need quotes
    around them. The default for this is scroll. If you want to use scroll and hold,
    use `or`. If you have BLOB columns in the query, the `blobidarray` parameter (or
    BYTE) column allow it, you can also use `ifx_textasvarchar(1)` and `ifx_byteasvarchar(1)`.
    This enables you to treat TEXT (or BYTE) VARCHAR columns as though they (long)
    VARCHAR for select queries, avoiding the use of BLOB columns. If the previous
    shortcut is not used, the query will return BLOB columns as BLOB IDs.


    # ifx_prepare()


    # Syntax


    ```

    int ifx_prepare (string query, int conn_id, int cursor_def, mixed blobidarray);

    ```


    # Description


    The `ifx_prepare()` function, which is available in PHP 3.0.4 through PHP 3.0.16
    along with PHP 4.0 and higher, prepares a query on the database indicated by the
    `conn_id` parameter. The optional `cursor_type` parameter is used to set the cursor
    processing to scroll, hold, sequential, or a combination of scroll and hold. To
    set scroll processing, specify `IFX_SCROLL` and to hold, use `IFX_HOLD`-these
    are constant values that don''t need quotes around them. If you want to use scroll
    and hold, use `or`. The default for this is sequential query processing. If you
    have BLOB columns in the query, specify their IDs in the `blobidarray` parameter
    and substitute question marks in the query. If the TEXT (or BYTE) column allow
    it, you can also use `ifx_textasvarchar(1)` and `ifx_byteasvarchar(1)`. This enables
    you to treat TEXT (or BYTE) VARCHAR columns as though they (long) VARCHAR for
    select queries, avoiding the use of BLOB columns. If the previous shortcut is
    not used, the query will return BLOB columns as BLOB IDs.


