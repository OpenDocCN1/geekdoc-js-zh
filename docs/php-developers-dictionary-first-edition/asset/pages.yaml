    # Encryption


    The encryption set of functions actually works by using mcrypt. To use this set
    of functions, you must first download libcrypt from `ftp://argeas.cs-net.org/pub/unix/mcrypt`
    and compile it with the `--disable-posix-threads` option. Then you need to compile
    PHP with the `--with-mcrypt` parameter. The library itself supports the following
    methods of encryption:


    +   - DES

    - WAY

    - Blowfish

    - GOST in CBC, OFB, CFB, and ECB cipher modes

    - IDEA

    - RC2 in CBC, OFB, CFB, and ECB cipher modes

    - RC6

    - SAFER-SK128

    - SAFER-SK64

    - TEA

    - TripleDES

    - TWOFISH


    If you downloaded a version of mcrypt greater than 2.4.x, you have access to the
    following block algorithms:


    +   - CAST

    - LOKI97

    - RIJNDAEL

    - SAFERPLUS

    - SERPENT


    Additionally, you have access to the following stream ciphers with the mcrypt
    library:'
