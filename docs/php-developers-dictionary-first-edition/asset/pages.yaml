  md: '# PHP Developer Dictionary


    The cpdf_set_page_animation() function, which was added in PHP 3.0.9 and PHP 4.0.b4,
    specifies the type and parameters for the transition effects of the current page.
    The transition happens when going from another page to the current page. The duration
    parameter represents the number of seconds between pages. The transition parameter
    can have the following values:


    +   0—No transition


    +   1—Two lines sweeping across the display to reveal the page


    +   2—Multiple lines sweeping across the display to reveal the page


    +   3—A box reveals the page


    +   4—A single line that reveals the page sweeping across the display


    +   5—The previous page dissolves and shows the next page


    +   6—The dissolve effect moves from one screen edge to another


    +   7—The old page is replaced by the new page, which is the default


