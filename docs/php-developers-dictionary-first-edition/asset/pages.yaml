  md: '# Chapter 6. Protocol Extensions


    On the Internet, there are lots of methods, called protocols, moving files and
    data around place to place. These protocols are what enable us to move files,
    send and receive email, download Web pages, manage networks, and much more. Within
    the PHP programming language are several sets of functions that provide the ability
    to use these protocols. They are the focus of this chapter and are as follows:


    +   - FTP

    - HTTP

    - IMAP, POP3, and NNTP

    - LDAP

    - SNMP


    # FTP


    The File Transfer Protocol (FTP) is a standard Internet protocol that is used
    to exchange files. Generally speaking, FTP commands are issued either on a command-line
    interface or through an application. You can read the Request For Comments (RFC)
    on FTP http://www.ietf.org/rfc/rfc0959.txt.


    > Note


    For those of you using PHP 3, this library of functions was not added until 3.0.13.


    # ftp_cdup()


    # Syntax


    ```

    int ftp_cdup(int ftp_stream)

    ```


    # Description


    The ftp_cdup() function instructs the connection to change to the parent directory
    of the current working directory in ftp_stream, which is the name handle of a
    previously opened stream using ftp_connect(). If successful, 1 is returned. If
    the function fails, 0 is returned.'
