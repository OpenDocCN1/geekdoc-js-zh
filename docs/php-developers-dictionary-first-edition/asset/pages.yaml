    # Using PostgreSQL and PHP


    This section describes the integration of PHP with the PostgreSQL database. There

    are many instances in Web development when data must be stored and readily

    retrieved from a database. PHP easily integrates with regular databases such as

    dBASE, mSQL, MySQL, Informix, Sybase, SQL Server, and PostgreSQL. PHP provides

    functions to connect with these databases to execute queries, and manage

    connections and transactions. The examples in the following sections illustrate
    how

    to integrate PHP with the PostgreSQL database server.'
