    # Hyperwave


    Hyperwave Information Server (HIS) is similar to a database server, except that
    it is used to store and retrieve entire documents instead of individual data fields.
    Detailed information about HIS can be found at http://www.hyperwave.com, along
    with the PHP manual. The necessary library for including Hyperwave support is
    included with PHP and can be activated by passing `--with-hyperwave` as an argument
    to configure, the server component must be purchased from Hyperwave. If you are
    implementing a Hyperwave solution, keep in mind when dealing with external document
    retrieval from a data source external to Hyperwave, PHP might have a simpler interface
    than Hyperwave offers.


