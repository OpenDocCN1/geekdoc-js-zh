  md: '# PHP Developer''s Dictionary


    ![](img/337d6502453f0752b3638b8d72cba999_1_0.png)


    # PHP Developer''s Dictionary


    R. Allen Wyke,

    Michael J. Walker,

    Robert Cox

    Publisher: Sams Publishing

    First Edition December 13, 2000

    ISBN: 0-672-32029-0, 720 pages


    PHP is an open source, server-side, HTML-embedded scripting language used to create
    dynamically generated Web pages. With an easy-to-use syntax and a large, extensible
    library of modules, PHP brings together the best of Perl, C++, and other languages.

    The PHP Developer''s Dictionary is a comprehensive reference to PHP 4. It details
    the enhancements that PHP 4 brings to the programmer and shows the reader how
    to install the application, generate HTML, and access databases. The book contains
    not only every function and property, but also provides a description, a version
    support key, and examples where needed.'
