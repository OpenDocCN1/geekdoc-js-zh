  md: '# PHP Developer''s Dictionary


    # Description


    The fdf_open() function, which was added in PHP 3.0.6 and PHP 4.0, opens a forms
    data file for processing. The file must consist only of data returned from a PDF
    form. Because data from the form is not available from the environment in a manner
    similar to HTML forms, the form results must be first written to a file and then
    read using this function before processing.


    ```

    <?php

    $fp = fopen(formdata, "fdf", "w");//create a file to hold the form data

    fwrite($fp, HTTP_FDF_DATA, strlen($HTTP_FDF_DATA));

    //write the form data to the file

    close($fp);close the file

