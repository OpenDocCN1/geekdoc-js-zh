    # Description


    The error_log directive specifies the name of the file in which any errors occur
    during processing should be logged. A value of syslog indicates that the system
    logger mechanism is used instead of a file. For UNIX systems, this is the syslog
    file referred to as output 3, where standard is (1) and standard error is (2).
    On Windows NT and Windows 2000, this information is logged by the Event Log System.
