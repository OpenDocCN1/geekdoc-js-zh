  md: '# Chapter 1. Basic PHP


    # Background and History


    1994, Rasmus Lerdorf created the predecessor to what evolved into one of the fastest-growing
    server-side scripting languages. PHP started as a set of tools that Rasmus used
    to track users on his personal Web page. In the spring of 1995, Personal Home
    Page Tools were introduced. It contained limited server-side macros and simple
    utilities such as a globe and a counter. That same year, the parser engine was
    completely rewritten and released as PHP/FI version 2. This version introduced
    more than one native MySQL interfaces.


    1997, PHP took a huge step forward. The parser was completely rewritten by a team
    of developers by Zeev Suraski and Andi Gutmans. This parser formed the foundation
    for version 3 of PHP. The success of PHP is difficult to gauge, but it has been
    estimated that there are more than one million Websites using PHP and that number
    is increasing every month. PHP user groups have sprang up all the globe, many
    of them swearing allegiance to PHP predicting the demise of Microsoft''s Active
    Server. Much of this fervor due to the excitement of PHP open source policy. The
    software is available on the Internet; Price is not the only factor driving the
    popularity of PHP. Flexibility, extensibility, and performance are key elements
    in the success of PHP. The syntax of PHP was borrowed from C, Perl, and Java.
    Individuals with basic training in these languages can pick up PHP syntax with
    very little effort. This inherent inheritance also contributes to PHP''s incredible
    popularity.


    The main PHP team includes developers from all over the world. Zeev Suraski and
    Andi Gutmans are from Israel, Shane Caraveo resides in Florida, Tim Zieminski
    is in Nebraska, Sasha Schumm and Thies are from Germany, Jim Windstead from Los
    Angeles, and the father of PHP, Rasmus Lerdorf resides. PHP''s open policy means
    so many developers and hobbyists contribute to PHP''s code. The contributions
    from this unpaid group of experts are in bety and include many optimizations and
    feature improvements. PHP version 4 is in beta and includes many optimizations
    and feature improvements. These improvements include a compiler, enabling code
    to a code optimizer, and a formal debugger. PHP 4 also includes object-oriented
    syntax, self-contained extensions, and a thread-safe core.


    # Advantages of PHP 4


    PHP has two competitors: Microsoft''s Active Server Pages and Allaire''s Fusion.
    PHP has many advantages over these commercial packages. As mentioned previously,
    one of the main advantages PHP has over ASP and Fusion is its price. PHP is completely
    free and available for download at hundreds of mirror sites all the globe. For
    many, this advantage is the deciding factor; however, there are many technical
    reasons to use PHP. PHP has the capability to run on NT and UNIX. It is just easy
    to build complex Web sites that run on either platform. This cross-platform compatibility
    makes the transition from NT to UNIX an easy proposition. Before PHP, converting
    Web code meant that changing a server operating system was an extremely painful
    task. Operating-system'
  merge: -1
