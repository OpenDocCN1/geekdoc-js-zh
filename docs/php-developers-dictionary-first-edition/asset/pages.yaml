    System Interface) is an IEEE standard that was designed to make code easier to
    port between UNIX operating systems. Ultimately, POSIX is an attempt by a group
    of vendors to create a single standard program interface for every version of
    UNIX. The POSIX standard defines how a system function will be called, what information
    will be returned, and how the information will be formatted.


