  md: '# PHP Developer''s Dictionary


    ```

    array imap_get_subscribed(int imap_stream, string ref, string pattern)

    ```


    # Description


    The imap_subscribed() function, which was added in PHP 3.0.12, obtains a list
    of objects, stored in a returned array, of mailboxes to which the user is subscribed.
    This is accomplished by looking at the connection defined by imap_stream and passing
    the server name as ref. This is the same server name that you used when you opened
    the stream with imap_open() function. You define mailboxes to obtain information
    by passing a pattern for the function to look for. For pattern, you can use *
    or % to represent two different wildcards. When used, * will return all mailboxes.,
    on the other hand, will return only the top-level mailboxes.

    The array of objects contains three items: the fullname of the mailbox, the hierarchy
    delimiter and a mask attribute field. These attributes can be tested in Table
    6.7.


    Table 6.7. Values of the Attributes


    | Value | Description |

    | --- | --- |

    | LATT_NINFERORS | The mailbox has no subfolders under it. |

    | LATT_NOSELECT | The mailbox is only a container, not a mailbox you can open.
    |

    | LATT_MARKED | The mailbox is marked, and is used only by UW-IMAPD. |

    | LATT_UNMARKED | The mailbox is not marked, and is used only by UW-IMAPD. |


    Here is a quick example of how you would call this function:

    $mailboxes = imap_subscribed($mbox, "{ imap.mcp.com}", "*\*");


