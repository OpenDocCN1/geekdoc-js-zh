    # InterBase


    The InterBase functions enable you to access data in an InterBase database, which
    is a product of Border/Inprise. More information can be found at http://www.interbase.com.


    # ibase_connect()


    # Syntax


    ```

    ibase_connect (string database [,string username [,string password [, string charset
    [, int buffers [, int dialect [, string role ]]]]]])

    ```


    # Description


    The ibase_connect() function, which is available in PHP 3.0.6 through 3.16 along
    with PHP 4.0 and higher, establishes a connection to an InterBase server. The
    database parameter must be a valid path to a database file on the server where
    the file resides. If the file is on another machine, it must be prefixed with
    one of the following: ''hostname:'' for TCP/IP, ''/hostname/'' for NetBEUI, or
    ''hostname'' for IPX/SPX. The optional username and password parameters can be
    set using the PHP configuration directives ibase.default_user and ibase.default_password,
    respectively. The character parameter indicates the number set set for the server-side
    cache. If buffers is set to 0 or omitted, the default character set for the database
    is used. The dialect parameter indicates the default SQL dialect for executed
    statements. Each call establishes a connection, and defaults to the one supported
    by the client libraries. If another previously opened connection is used it is
    made with the same arguments, a connection is destroyed when the connection is
    complete or ibase_close() is called. Note that the buffers, dialect, and role
    parameters were not added until PHP 4.0rc2.


