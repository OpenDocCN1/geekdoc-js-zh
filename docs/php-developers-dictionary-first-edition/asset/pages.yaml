    PHP has many functions that enable you to manipulate and format strings. These
    functions provide methods of determining the length of a string, finding a substring
    in a string, replacing white space from a string, replacing substrings, and changing
    the case of a string. This section does not discuss all cases, but it provides
    a general overview of these functions.


    If you are familiar with the C programming language, you will recognize the printf()
    function. This function enables you to output string and variables in a multitude
    of different ways. Consider the following example:


    ```

    printf("This is a formatted number: %d\n", 1957);

    ```


    This prints out the 1957, as a decimal value, which is defined by the %d specifier.
    There are other specifiers available to the printf() function. These include specifiers
    that will print the value as a hexadecimal, ASCII, octal, or floating-point number.
    Chapter 5 discusses this function in detail and describes all the options.


    The strlen() function returns the length of the string. This is useful for error
