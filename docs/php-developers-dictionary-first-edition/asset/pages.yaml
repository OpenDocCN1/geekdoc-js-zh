  md: '# PHP Developer''s Dictionary


    | Priority | Description |

    |---|---|

    | LOG_EMERG | This is a panic situation; the system is unstable. The message may
    be broadcast by the operating system to all users of the system. This message
    is translated to a warning on Windows. |

    | LOG_ALERT | This is a situation that requires action to be taken immediately.
    It is translated to an error on Windows. |

    | LOG_CRIT | This is a critical condition that can be caused by external or hardware
    problems. This is translated to a warning on Windows. |

    | LOG_ERR | These are general error conditions. These are translated to warnings
    on Windows. |

    | LOG_WARNING | These are warnings, less severe than errors. |

    | LOG_NOTICE | A notice is not an error, but is a significant condition requiring
    attention. This is translated to a warning on Windows. |

    | LOG_INFO | Informational messages do not require any special action to be taken.
    |

    | LOG_DEBUG | These messages are only debug-level messages. They are translated
    to warnings on Windows. |


    # Session Handling


    This section describes the session-handling functions that are included in the
    base PHP4 distribution. These functions allow session variables to be established
    and tracked per visitor. This functionality allows the user experience to vary
    depending on permissions, user-defined options, or environment. Sessions do not
    require variables to be stored in cookies, although it is possible, but rather
    session IDs are passed via the URL. In either case, these variables are stored
    and retrieved on the server through PHP functions.


