    # Regular Expressions


    Having the ability to effectively parse text for characters and phrases of various
    formats is an extremely powerful thing. The modules discussed in this section
    describe the regular expression functions available in PHP. The discussion is
    broken into "Native PHP" and "Perl Semantics" sections.


    # Native PHP


    These sets of functions are for performing regular expression pattern matching
    in PHP. Unlike the items listed in the "Perl Semantics" section of this chapter,
    functions represent semantics and syntax that are native to PHP.


    # ereg()


    # Syntax


    ```

    `int ereg(string pattern, mixed string [, array matches])`

    ```


    # Description


    The ereg() function searches string for any items that match the pattern . If
    the optional matches array variable is passed, the results are stored in that
    array. Otherwise, the function returns 1 if a match was found, and 0 if not. The
    only difference between this and the eregi() function is that this function does
    not ignore alphabetic case.


    # ereg_replace()


    # Syntax


    ```

    `string ereg_replace(string pattern, mixed replacement, mixed string)`

    ```


    # Description


    The ereg_replace() function searches string for pattern and replaces it with replacement
    . If successful, the modified string is returned.'
