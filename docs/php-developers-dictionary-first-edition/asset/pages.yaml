    void pdf_set_transition (int pdf document, int transition)

    ```


    Description


    The pdf_set_transition() function, which was added in PHP 3.0.6 and PHP 4.0, specifies
    the type and parameters for transition effects of the current page. The transition
    happens when going from another page to the current page. The transition parameter
    can have the following values:


    +   1. 0—No transition

    2. 1—Two lines sweeping across the display to reveal the page

    3. 2—Multiple lines sweeping across the display to reveal the page

    4. 3—A box that reveals the page

    5. 4—A single line sweeping across the display that reveals the page

    6. 5—The previous page dissolves and shows the next page

    7. 6—The dissolve effect moves from one screen edge to another

    8. 7—The old page is replaced by the new page, which is the default


