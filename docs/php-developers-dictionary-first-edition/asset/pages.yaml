    ```


    # Description


    The `imagecreatefromgif()` function returns an image identifier for the GIF image
    at `location`, which can be a filename or URL. If the process fails, the function
    returns an error message. To avoid this, you can use the following type of code
    in which you create an image if the one you seek is not there:


    ```

    $image = imagecreatefromgif("myfile.gif");

    if(!$image) { // check for error

    $image = imagecreate(1, 1); // create blank image

    $background = imagecolorallocate($image, 0, 0, 0); // create white

    imagefill($image, 0, 0, $background); // create white image

    }

    return $image;

    ```


