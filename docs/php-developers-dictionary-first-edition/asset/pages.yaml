    \ to disk. The return value is TRUE on success and FALSE otherwise.\n\n# dBASE\n\
    \nThe dBASE functions enable you to interact with records stored in a .dbf file.\
    \ There is no support for indexes, locking, or memo fields at this time. Because\
    \ locking doesn't exist, it is very possible that two concurrent processes could\
    \ damage the database. dBASE files are fixed-length sequences. Deleting in dBASE\
    \ only causes the record to be marked for deletion; it is not removed until dbase_pack()\
    \ is called. dBASE doesn't support concurrent users well and has many other limitations,\
    \ using dBASE is recommended only for testing purposes. The following example\
    \ opens a dBASE file and dumps the contents of the record:\n\n```\n<?\n$dba_db\
    \ = dbase_open(\"users.dbf\",0);\n$dba_numfields = dbase_numfields($db);\n$dba_record\
    \ = dbase_get_record($db,0);\nfor ($i=0; $i < $dba_numfields; $i++) {\n    print\
    \ $dba_record[$i].\"<br\\n\";\n}\n$dba_close($dba_db);\n?>\n```\n\n# dbase_create()\n\
    \n# Syntax\n\n```\nint dbase_create (string filename, array fields)\n```\n\n#\
    \ Description\n\nThe dbase_create() function, which is available in PHP 3.0.16\
    \ and prior along with PHP 4.0, creates a dBASE database file. The filename parameter\
    \ is used to name the new file and the fields parameter is used to specify the\
    \ database columns of the file. The fields parameter should be an array of arrays,\
    \ with each array describing one file in the database. Each array consists of\
    \ four fields: the column name, a character indicating the column type, field\
    \ length, and precision. Precision represents the number of digits after the decimal\
    \ point. If creation is successful, a dbase_identifier is returned; FALSE is returned\
    \ otherwise.\n\nField Types Available"
