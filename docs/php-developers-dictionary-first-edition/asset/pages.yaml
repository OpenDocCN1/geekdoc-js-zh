  md: '# Chapter 13. PHP Directives


    This chapter outlines the many configurable options that you can set to affect
    the behavior of the PHP scripting engine. These options, which are referred to
    as directives, can be found in the php.ini and php3.ini file and also in the Apache
    Web server''s configuration and .htaccess files when used as an Apache module.
    The location of the php.ini file where most of the directives are dependent on
    the operating system you use. The syntax for a directive is name=value, it is
    important to note that directive names are case sensitive. Note that Boolean values,
    ''1'', ''True'', ''Yes'', and ''On'' are equivalent values. Also ''0'', ''False'',
    ''No'', and ''Off'' are equivalent. A value of ''none'' (without quotes) should
    be used to indicate an empty string. Last, you can use phpinfo() to view all settings
    and get_cfg_var() to view an individual setting.


    # General


    The following directives are used to affect the overall behavior of the PHP engine.


    # asp_tags


    # Syntax


    ```

    asp_tags boolean

    ```


    # Description


    The asp_tags directive allows you to indicate PHP-style HTML tags in a source
    file by wrapping the code in Active Server Pages-style HTML tags. ASP code is
    indicated by the <% and %>. The default tags (<PHP and ?>) are still available.
    The ASP language shortcut for printing variable content (<=$variable %) is also
    supported when this option is set. The default value for this directive is Off.
    The following sets of code generate the equivalent output when asp_tags is turned
    On.


    ```

    <?php $text = "Hello World";necho $text; ?>

    ```


    and


    ```

    <% $text = "Hello World!"; %>n<=$text%>

    ```


    # auto_append_file'
  merge: -1
  pgno: 579
- img_proc: true
  md: '# Syntax


    ```

    auto_append_file string

    ```


    # Description


    The auto_append_file directive indicates which file should be parsed after the
    main file is processed. The effective result is as though the file was called
    with an include() function; therefore, the include_path setting is used. To disable
    this feature, set the option to none. This option is useful for displaying copyright
    information and other details you might need at the end of each Web page. The
    default value is none.


    # auto_prepend_file


    # Syntax


    ```

    auto_prepend_file string

    ```


    # Description


    The auto_prepend_file directive indicates which file should be parsed before the
    source file is processed. The effective result is as though the file was called
    with the include() function; therefore, the include_path setting is used. To disable
    this feature, set the option to none. This option is useful for titles and other
    content that is used at the beginning of each Web page. The default value is none.


    # cgi_ext


