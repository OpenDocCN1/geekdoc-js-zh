    # Limitations


    In basic HTTP authentication, the password is passed over the network as uencoded,
    plain text. Anyone capturing network traffic will not see the password as text,
    but the password will be easily decoded.

    This method of authentication is roughly as risky as Telnet-style username and
    password security. In other words, if you trust your machine to be on the Internet
    for telnet sessions, you have reason not to trust this method of HTTP authentication.


