    # Select, Insert, Update, and Delete Queries


    You will routinely perform four types of queries when using any type of database.
    The insert query will place items in the database, the update query will update
    information that is already in the database, and the delete query will delete
    items from the database. When you query databases from PHP, you will allocate
    memory when a database connection is made and the result set is returned from
    your query. When your script is finishing executing, all memory will be freed,
    but it is good programming practice to free the result by using the pg_FreeResult()
    function and close the connection by using the pg_Close() function.


