    # HTTP


    The Hypertext Transfer Protocol (HTTP) is another standard Internet protocol.
    It is generally used to transfer the Hypertext Markup Language (HTML) pages and
    related elements, items as make today''s Web pages. You can find more information
    on HTTP at http://www.w3.org/Protocols and more information on HTML at http://www.w3.org/Markup.


    # Note


    This library of functions was added in PHP 3.


    # header()


    # Syntax


    ```

    int header(string header_directive)

    ```


    # Description


    The `header()` function enables you to specify a single header directive, in `header_directive`,
    when fulfilling HTTP requests. If you want to specify several directives, you
    must use this function multiple times. When specifying header information, you
    must send it before sending back a `Location: /newpage.html` if you want to redirect
    users to `newpage.html` rather than the page they requested. For more information
    on HTTP headers, you can read the Request For Comments (RFC) at http://www.ietf.org/rfc/rfc2616.txt.


