  md: '# Chapter 12. PHP Compilation Options


    This chapter describes the options that are available to the user when compiling
    PHP on a UNIX platform. These options enable and disable certain functionality
    and add external libraries to the core PHP binary. These options are made available
    to PHP through the configuration process prior to compilation. For instance, a
    configuration line might be


    ```

    ./configure --with-apache=/usr/lib/apache --with-postgresql-shared

    ```


    This chapter describes the syntax and parameters around each of these compile-time
    options. These options are divided into two separate groups: enable, disable,
    and help group the with group.


    # Enable, Disable, and Help


    This group of options enables and disables functionality within PHP. These options
    are not set by using on or off parameters, but rather they are turned on or off
    based solely on the command. This group also includes an official description
    of the --help command.


    # disable-short-tags


    # Syntax


    ```

    --disable-short-tags

    ```


    # Description


    This option disables PHP''s capability to use the abbreviated scripting tags.
    The short tags look like this: <? ... ?>. If you disable this option, the only
    PHP script tag that will be recognized is the <?PHP ... ?> tag. Short tags must
    be disabled for PHP to work with XML.


    # disable-syntax-hl


    # Syntax


    ```

    --disable-syntax-hl

    ```


    # Description


    IT-SC book 567'
