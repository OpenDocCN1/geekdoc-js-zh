    # LDAP


    The Lightweight Directory Access Protocol (LDAP) is used to locate people, organizations,
    and resources, such as files, on a network. These directory servers are a special
    kind of database that holds its information in a tree-like structure. Unlike files
    that are stored on a filesystem and referenced by a path, LDAP entries are referenced
    by their distinguished name, or DN. For instance, the following might have an
    entry.


    ```

    cn=John Doe,o=PHP Programmers Corp,st=NC,country=USA

    ```


    Because the sequence is read from right to left, you see the tree appear as follows:


    +   - countryName-Name of the country in which John works

    - st-Name of the state John works in (assuming that he works in the United States,
    of course)

    - oc-Name of the company for which John works'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# PHP Developer''s Dictionary


    +   - cn--Full name of John


    This, course, enables you to sort by the values easily, without entries losing
    their place in the overall structure, or tree. You can read the Request For Comments
    (RFC) at http://www.ietf.org/rfc/rfc1959.txt.


