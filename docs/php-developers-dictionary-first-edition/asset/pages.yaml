    num will now equal 0. Because the -- operator is applied before anything else,
    the decrease is applied before anything else. For instance, if you tried to print
    --num when num=1, it would print 0. This is the opposite of post-decrement, where
    1 would be printed and the value would be adjusted after the print statement.


    # num++ (Post-Increment)


