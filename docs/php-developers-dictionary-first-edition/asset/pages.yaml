  md: 'php_value name value


    # Description


    The php_value directive enables you to specify a PHP variable from an Apache configuration
    file. The php_admin_value directive has more power, but is limited to being used
    only in the httpd.conf file.


    # php_flag


    # Syntax


    ```

    php_flag name on | off

    ```


    # Description


    The php_flag directive is used within an Apache configuration file to specify
    a PHP value as On or Off. The php_admin_flag directive has more power, but is
    limited to being used only in the httpd.conf file.


    # php_admin_value


    # Syntax


    ```

    php_admin_value name value

    ```


    # Description


    The php_admin_value directive sets the value of a PHP variable from within an
    Apache configuration file. This directive can be used only from server-side Apache
    configuration settings and cannot be used from the .htaccess files. This directive
    is capable of modifying the value of any PHP directive.


    # php_admin_flag


