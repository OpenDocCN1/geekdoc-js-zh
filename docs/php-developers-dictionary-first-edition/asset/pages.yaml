    ```

    $Test = "This is a test string";

    print strlen($Test); // prints out 21

    ```


    The strstr() function returns parts of the entire string. The portion of the string
    that is returned is an integer number. This integer number defines the number
    of characters to return. A negative number counts characters from the end of the
    string; an example of this function follows:


    ```

    $date = "03-October-1957";

