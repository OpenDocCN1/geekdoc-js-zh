    # Working with the Filesystem


    Sometimes you might find it necessary to read the host filesystem to determine
    directories to, display files, to write files, or any number of things. PHP provides
    many filesystem functions that enable the developer to read, delete, and modify
    any number of attributes on directories or files. Please remember when using these
    functions, the Web server ever runs as a specific user with limited rights. The
    filesystem operations discussed return information based on the user as PHP (or
    the Web server) is running. This means that if you try to create a file and you
    don''t have the appropriate rights, you will receive an error. Please keep this
    in mind when working with files and directories.


    # Directory Functions


    When working with directory functions such as readdir(), rmddir(), the basic idea
    is threefold. First, you must open a directory handle by using opendir(). This
    handle is a reference that is used in subsequent directory operations. Second,
    you perform operations on the directory which could be anything from renaming
    the directory to change permissions. Third, you close the directory handle by
    using closedir(). Some function do not require the use of a directory handle.
    For functions such as is_dir(), and rmdir(), only the directory name is required.
    The following example tests for the existence of the current directory. Of course,
    this will always return true. You can change the $dirname variable and experiment
    with what happens if the is_dir() returns false.


    ```

    <html>

    <head>

    <title>Testing for a Directory</title>

    </head>

    <body>

