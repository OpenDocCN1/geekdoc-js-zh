    does. Within this area we will provide more information about the parameters,
    let you know if the element is new to version 4 of PHP, and provide short code
    examples when needed.


    And that is all we are going to say. Like yourself, we are developers and small
    talk does nothing but consume time. We appreciate that you took the time to read
    the Introduction, and now we will return the favor by wishing you well on your
    use of the PHP Developer''s Dictionary.


    R. Allen Wyke

    Michael J. Walker

    Robert Cox'
