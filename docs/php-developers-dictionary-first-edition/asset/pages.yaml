    # Other Database Functions


    Many other database functions can be performed other than the basic queries that
    were demonstrated earlier. The PHP interface to PostgreSQL enables you to specify
    how the information is returned from the database. You can return information
    as an object by using `pg_Fetch_Array()` or `pg_Fetch_Row()`. Other functions
    will return the size and type of the field or column the name or number of fields.
    The description and use of each of these functions is included in Chapter 10,
    "Database Extensions". Many useful bits of information and properties can be returned
    through the use of these database functions. A detailed description with examples
    of these functions is beyond the scope of this book, but each is fairly straightforward
    and will be easy to implement.


    # Error Messages


    It is always good to capture and print all error messages. The PHP interface to
    PostgreSQL includes a function for this functionality. This function is `pg_errormessage()`
    and accepts the database connection handle and returns the string of the error.
    This string is the text of the error message that is generated from the database
    back end.


    The following example illustrates how to use the `pg_errormessage()` function
    to return an error string. The `pg_Connect()` function in the example attempts
    to connect to a database that does not exist. If the function returns an error
    (as it does in this case), the connection handle is used in the `pg_errormessage()`
    function to echo the string to the browser.


    ```

    <html>

    <head>

    <title>Generate an Error</title>

    </head>

    <body>

    // Generate an error connecting to a Postgres Database

    $conn = pg_Connect("localhost", "5432", "", "", "testerror\nif (!$conn) echo pg_errormessage($conn);
    exit;

    </body>

    </html>

    ```


    This example prints out the following error message to the browser window:


    FATAL 1: Database tester does not exist in pg_database'
