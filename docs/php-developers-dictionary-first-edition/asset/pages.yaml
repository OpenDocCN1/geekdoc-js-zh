    The ++num operator increases the value of num by one. If num=0 and ++ num is applied,
    num will now equal 1. Because the ++ operator is applied before anything else.
    For instance, if you tried to print ++num when num=0, it would print 1. This is
    the opposite of post-increment, where 0 would be printed and the value would be
    adjusted after the print statement.


