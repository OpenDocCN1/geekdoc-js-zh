  md: '# PHP Developer''s Dictionary


    The gpc_order directive sets the order of the GET/POST/COOKIE variable parsing.
    Note that this function has been deprecated in favor of variable_order. When PHP
    reads an incoming request, it automatically analyzes the request and identifies
    variables and making them available for script access. This setting specifies
    the order in which the request is parsed. The order indicates which option precedence
    when the same variable name appears more than once. The options to the right have
    a higher precedence than those to the left. For example, a gpc_order PC tells
    PHP to ignore the GET variables and that variables from the COOKIE value have
    precedence POST values. The default value is GPC.


    # ignore_user_abort


    Syntax


    ```

    ignore_user_abort boolean

    ```


    Description


    The ignore_user_abort directive specifies whether a script should run to completion
    if the connection with the user is lost. The default is on, which indicates that
    a script should always finish running. Note that you will likely want to ensure
    that this value is set to On if your script is performing a transactional operation.


    # include_path


    Syntax


    ```

    include_path string

    ```


    Description


    The include_path directive indicates which directories should be searched when
    an included file is present. The syntax for this setting mimics the operating
    system''s PATH environment variable, a semicolon separates multiple paths in Windows
    and a colon in UNIX. The default for this option is the current directory (only).
    Here is a UNIX example:


