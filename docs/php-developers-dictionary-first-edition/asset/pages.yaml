  md: '# Chapter 7. Internet-Related Extensions


    This chapter describes a group of functions that are specific to the Internet.
    This group includes functions dealing with Internet applications such as the Apache
    Web server, WDDX, and VMailMgr. The chapter also discusses functions that provide
    network, mail, and session access.


    # Apache Specific


    The Apache Web server is a highly configurable, powerful, HTTP server. Apache
    is the most popular Web server on Internet for reasons that include Apache’s extensibility
    with add-modules, which provide extra functionality. Another reason for Apache’s
    popularity is its multipatform support. Apache runs on most flavors of UNIX, Windows
    NT/9/2000, NetWare 5.x, and OS2. The set of Internet-related functions described
    in this section provide information about the Apache resource, headers, and other
    functionality.


    > Note

    This section assumes that the PHP module is installed as an Apache module. Most
    of these functions are not supported if Apache is used as a CGI.


    # apache_lookup_uri()


    # Syntax


    ```

    apache_lookup_uri(filename);

    ```


    # Description


    This function performs a request for the URI defined by filename. apache_lookup_uri()
    requests enough information about the resource to return a class with the properties
    in Table 7.1.


    | Table 7.1. Properties Returned by the apache_lookup_uri() Function |

    | Status | Uri | Handler | Boundary |

    | --- | --- | --- | --- |

    | the_request | | | No_cache |

    | status_line | Filename | | No_local_copy |

    | Method | Path_info | | Allowed |

    | Content_type | Args | | send_body |

    | Bytes_sent | Clength | | Mtime |

    | Byterange | Unparsed_uri | | Request_time |'
