- img_proc: true
  md: '# PHP Developer''s Dictionary


    # Syntax


    ```

    string pack(string format, mixed [args] ...)

    ```


    # Description


    The pack() function returns a binary string containing `args` packed according
    to the `format` string contains formatting codes along with an optional repeater
    parameter, which can be a number or an `*` (which indicates repeat until the end
    of the `args`). These formatting codes are based on the codes defined in Perl.
    The repeat count for `a`, `h`, `H` indicates how many characters of one data argument
    are taken, and the `@` character indicates the absolute location for the next
    piece of data. For all others, the repeat count specifies how many pieces of data
    are included and packed into the resulting binary string. The following codes
    are available:


    +   - `a`-NULL-padded string

    - `A`-Space-padded string

    - `h`-Hex string, low nibble

    - `H`-Hex string, high nibble

    - `c`-Signed char

    - `C`-Signed char

    - `s`-Signed short (always 16-bit, machine byte order)

    - `S`-Signed short (always 16-bit, machine byte order)

    - `n`-Signed short (always 16-bit, big-endian byte order)

    - `v`-Signed short (always 16-bit, little-endian byte order)

    - `i`-Signed integer (machine-dependent size and byte order)

    - `I`-Signed integer (machine-dependent size and byte order)

    - `l`-Signed long (always 32-bit, machine byte order)

    - `L`-Unsigned long (always 32-bit, machine byte order)

    - `N`-Unsigned long (always 32-bit, big-endian byte order)

    - `V`-Unsigned long (always 32-bit, little-endian byte order)

    - `f`-Float (machine-dependent size and representation)


