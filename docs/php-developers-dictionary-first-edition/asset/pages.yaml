  md: '# Chapter 11. Chapter Utility Extensions


    Within the PHP programming languages you will find many different utility extensions.
    These extensions represent some of the more useful shrink-wrapped functions of
    the language itself. They include the:


    +   - Calendar

    - Compression

    - Date and time

    - Encryption

    - GNU recode

    - Image

    - Regular expression


    # Calendar


    This set of calendar functions represents items from both the MCAL (Modular Calendar
    Access Library) module and built-in-functionality within PHP.


    # MCAL


    The MCAL set of functions operates in very much the same manner as the IMAP functions.
    You open to a particular calendar and then perform operations on it. To use these
    functions, you need to download the MCAL library from http://www.mcal.chek.com,
    compile and install it, and compile PHP with the --with-mcal option.


    > Note


    The functions in this set were added in PHP 3.0.13 unless otherwise stated.


    The functions in the MCAL library use some predefined constants. These are shown
    in Table 11.1.


    | Table 11.1. Constants Used in the MCAL Library |

    | Type | Constant |

    | Day of Week | MCAL_SUNDAY |

    | | MCAL_MONDAY |'
