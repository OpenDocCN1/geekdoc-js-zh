  md: '# PHP


    # DEVELOPER''S DICTIONARY


    PHP is an open source, server-side, HTML-embedded scripting language used to create
    dynamically generated Web pages. With an easy-to-use syntax and a large, extensible
    library of modules, PHP brings together the best of Perl, C++, and other languages.


    The PHP Developer''s Dictionary is a comprehensive reference to PHP+. It details
    the evolution of the PHP language and the enhancements that PHP brings to the
