  md: '# PHP Developer''s Dictionary


    The single mail() function described in the following section is the interface
    to SMTP- and sendmail-compatible applications on a UNIX system and SMTP-compatible
    mail servers on Windows.


    # mail()


    # Syntax


    ```

    mail([recipient, subject, message, [additional_headers]);

    ```


    # Description


    The mail() function is used to send an email with the body of the email specified
    by the message parameter to the email address defined in recipient. The subject
    for the email is identified by the subject Multiple recipients can be specified
    by a comma-delimited list of recipient The parameter additional_headers is used
    to defineadditional header information that is inserted at the head of the original
    mail. Multiple additional headers are delimited withspace carriage return linefeed
    characters, "\r\n". Additionalheader information can be used to specify the addresses
    or or the format offset. Calling the mail() in a UNIX environment invokes the
    socalled shell command. The Windows environment will establish a connection with
    the SMTP server to send the mail. Specific mail parameters are set in the [mail
    function] section of the php.ini configuration file. If the mail() function encounters
    an error, false (0) is returned.


    # Network


    This section describes a set of functions that use standard Internet protocols
    to communicate and return information about network resources. Debugging functions
    are also described in this section because of their method of implementation.


