    # Using the Environment to Generate Content


    One of the ways that the user sees in the browser is to use the environment to
    dictate what the user sees. The request variables could be used to alter the information
    that PHP displays. In a similar manner, the date or time of day could be used
    to display greetings or customized information to the user.

    In the following example, the input on the initial page determines what the user''s
    experience will be on the resulting page. This is a very elementary example, but
    it illustrates how the Web page can be modified-on-fly to tailor content to the
    user.


    ```

    <HTML>

    <HEAD>

    <TITLE></TITLE>

    <BODY>

