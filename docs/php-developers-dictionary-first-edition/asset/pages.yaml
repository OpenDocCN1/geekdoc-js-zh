    # Arrays


    As with every programming language, PHP would be incomplete if it did not include
    the capability to define and manipulate arrays. PHP supports arrays that are indexed
    by number and associative arrays. Arrays are variables that contain multiple elements
    indexed by numbers or names. This means that a variable `FirstName[1]` could contain
    the value `Kaitlin`, whereas another variable `FirstName[2]` could contain the
    value `Austin`. The variable name is `FirstName`, and the index is `[1]` or `[2]`.
    The `array()` function is used to define an array and assign values to it. This
    function would look like:


    ```

    $CustomerName = array("Jane", "Loren", "Ted", "Gladys");

    ```


    The elements in the `$CustomerName` array can now be accessed by the variable
    name and the index in the following:


    ```

    print(\$CustomerName[3]);

    ```


    This would print the name `Gladys`, which is actually the fourth item in the array.
    Remember that arrays are indexed at 0. Associative arrays are indexed with strings
    instead of numbers. This is useful when describing the contents of the element
    using the index. To define an associative array, we use the `array()` function
    and we must define both the key and value for each element. In this example, we
    create an associative array called `$Contacts` with three elements: `FirstName`,
    `Phone`, and `Email`.


    ```

    $Contacts = array(Name=>"Eric", Phone=>"289-9272",Email=>"eric@winslow.com");

    ```


    We can now access any of the fields of `$Contacts` like this:


    ```

    print(\$Contacts[Email]);

    ```


    This would print the value `eric@winslow.com`. PHP also supports multidimensional
    arrays. A multidimensional array can be thought of as an array of arrays. In other
    words, we could define the `$Contacts` array to contain multiple entries for different
    contacts. That definition would look like this:'
