    Notice the new portions of this insert query include a BEGIN statement that denotes
    the start of the transaction. The transaction in this example is named work. The
    next statement is the LOCK statement. This particular statement locks the entire
    table while the transaction is being performed. There are many types of locks—both
    table level and row-level—that can be performed on a database while transactions
    are being performed. A discussion of the pros and cons of each type of locks is
    beyond the scope of this book. Please consult your database documentation for
    a description of the locks that are available in the preceding example, the next
    bit of code performs the database insert and query. This section of code is very
    elementary, but it is included for illustration purposes. In other words, the
    two pg_exec() statements end the transaction; the first commits the work, and
    the second ends the transaction.


    # Persistent Database Connections


    One of the biggest performance increases that you can make to your database application
    is to use persistent connections. The establishment of a database connection can
    often take 90% of the total time of the query. In other words, if you reuse database
    connections, your application can make all the queries 90% faster. If your application
    is database intensive, the overall speed of the application can be affected in
    a positive manner by using persistent connections.

    The pg_connect() function is the mechanism that you can use to make a persistent
    connection. When a connection to the database is requested, PHP checks for an
    existing connection. If one exists, PHP does not open another connection but reuses
    the existing connection. If the connection does not exist, PHP opens one. From
    the user''s perspective, the pg_connect() function works exactly the same as its
    nonsistent counterpart, pg_connect().


