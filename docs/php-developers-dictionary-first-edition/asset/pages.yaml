  md: '# PHP Developer''s Dictionary


    All standard programming environments on the Web (ColdFusion, Perl, Java, JavaScript,
    PHP, and so on) have native data structures such as arrays and record sets. WDDX
    provides a module for each language that will automatically serialize or translate
    the native data structures into a WDDX packet, or deserialize the WDDX packet
    into a native data structure. WDDX can be used with HTTP, SMTP, POP, FTP, and
    other Internet protocols that support transferring textual data.


    # Resource


    You can receive more information on Allaire at http://www.allaire.com.


    Additional information about WDDX is available at http://www.wddx.org.


