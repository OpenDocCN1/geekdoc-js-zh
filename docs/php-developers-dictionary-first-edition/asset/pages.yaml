    # Windows Environment with Internet Information Service (IIS)


    The configuration of PHP on Windows NT and IIS4 is much simpler than the compilation
    and configuration of PHP on Linux and Apache. You must realize that this simpler
    comes with a price, the outset to work in a UNIX environment. PHP''s commands
    are UNIX-based, and you will notice as you read this book that many of the commands
    and functions are not supported or are not fully functional in a Windows/IIS environment.


    This section assumes that you have IIS4 and Windows NT already installed and configured
    on your server. You must first download the PHP for Windows installation from
    the Web site (http://www.php.net). Find the Downloads section and unpack the Win32
    binaries. At the time of this, the filename is php-4.0.2-Win32.zip.


    The first thing you need to do is unzip the PHP package and copy all .dll files
    from the distribution to the Windows system directory. This is usually C:\WINNT\SYSTEM32
    for Windows NT. Under a normal installation, all the dll are not necessary, but
    this setup makes it easier to add modules and extensions in the future.


    You need to copy the php.ini-template to the C:\WINNT and rename it to php.ini.


    Next, start the Microsoft Internet Service Manager. This is usually under the
    Windows NT 4.0 Pack of the Start menu. Right-click on Default Web Site and choose
    Properties. Choose the ISAPI Filters tab and select Add. Enter PHP4, or similar
    descriptive text, as the filter name and type in the path to the php4isapi.dll
    file. This should be C:\WINNT\system32\php4isapi.dll. Apply the'
