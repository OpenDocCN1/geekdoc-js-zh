    # Installation


    For the purposes of this book, we will discuss the installation procedure and
    options at a high level. This discussion covers an overview of the process for
    the two main operating systems that PHP supports. This chapter is more specific
    about the installation of PHP with Apache on Linux, but we also discuss the installation
    process on a Windows NT and IIS4 system.


    # PHP Installation General Overview


    The installation of the PHP module on any Web server assumes that you have a Web
    server. In this case, we assume that Apache has been successfully installed on
    your UNIX machine, or that you have IIS installed on your Windows Server and you
    are able to serve regular HTML pages to a browser. Installation procedures and
    binaries for the Apache Web server are available at the Apache Web site (http://www.apache.org/).
    Installation procedures for IIS are available at Microsoft''s site (http://www.microsoft.com/).
    To be used on a UNIX system, the source must be compiled using a standard ANSI
    compiler such as gcc or g++. These compilers are packaged with most Linux distributions,
    but the compilers are freely available at GNU''s site (http://www.gnu.org/gnulist/production).


