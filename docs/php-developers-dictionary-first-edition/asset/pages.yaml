    # Working with Email


    Email is a very useful tool and that is easy to use as long as you understand
    the workings of the email system. Email can automatically notify users of important
    events, and provide details of user accounts or other information. Email can also
    be used to send dynamic bulk information to a group of users. Email, like other
    areas of PHP, is flexible and limited only by your imagination.


    # Email Overview


    This is a general overview of how email works on the Internet. Please realize
    that there are many varieties of email clients and email servers; this is just
    an overview and describes some of the mechanisms on which most Internet email
    systems relay.


    All standard email contain certain information, such as the sender''s name and
    email address, the recipient''s name and address, a subject for the message, and
    some kind of message in the body of the email.


    Email messages are composed of two basic parts: the headers and the body. Headers
    define where the email is going and any special routing information. Generally,
    the user does format the content in a user-friendly manner and mask this information
    from the user.


    After an email is composed, the mail client or Mail User Agent (MUA) sends the
    information to the SMTP host or Mail Transfer Agent (MTA). SMTP stands for Simple
    Mail Transfer Protocol and is the foundation for virtually all Internet email
    messages. SMTP takes the message and adds additional information to aid in the
    routing of the email. The MTA handles the delivery of the email message. After
    the MTA has the outgoing message, it adds a unique message identifier, a time
    and date stamp, and other important standardizing information.


    When the outgoing message is formed with all the headers, the MTA is ready to
    try deliver the message. The MTA performs what is known as an MX (Mail Transfer)
    record lookup in the Domain Name System (DNS) to find out what machine the email
    is to be delivered. If multiple MX records are found, the one with the lowest
    priority is used.


    The sending MTA and the receiving MTA establish a connection, negotiate protocols
    and special functions, and then the sending MTA delivers the email to the receiving
    MTA.


    # Email and PHP'
