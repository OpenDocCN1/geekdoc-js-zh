    # Description


    The error_reporting directive indicates which level of error messages should be
    reported. The options include


    +   1 for normal errors


    +   2 for normal warnings


    +   4 for parser errors


    +   8 for noncritical, style-related warnings


    These options can be added together to provide combinations of the reporting levels.
    For instance, the default value of 7 indicates levels 1 + 2 + 4 = 7.


    # open_basedir


    # Syntax


    ```

    open_basedir string

    ```


    # Description


    The open_basedir directive limits which files can be opened from a PHP script
    to those in the specified directory tree. The common methods for opening a file
    that this will affect open and gzopen. Symbolic links are resolved by PHP so that
    you cannot circumvent this security level. For multiple directories, separate
    the values with semicolons in Windows and colons otherwise (similar to the PATH
    environment variable). A \." indicates that files can be accessed from the same
    directory from which the script is running. The default for this directive is
    to allow files from any location to be opened.


