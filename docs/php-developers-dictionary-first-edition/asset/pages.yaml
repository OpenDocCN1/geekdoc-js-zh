    # Description


    The `imap_delete()` function, for deletion returns 1 if successful, marks the
    message located at `message_num` for deletion. The optional `flag` is `FT_UID`
    and tells the function to treat `message_num` as a UID.


    After you have marked messages for deletion, you must either call the `imap_expunge()`
    function, or pass `CL_EXPUNGE` to `imap_close()` when closing the connection,
    to delete the marked messages.


    # Tip


    > If you are connecting to a POP3 mailbox, you need to expunge your marked messages
    before you close your connection. Marked deletions are not carried across connections
    as in IMAP.


