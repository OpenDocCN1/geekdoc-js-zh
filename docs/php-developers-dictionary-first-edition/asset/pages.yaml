  md: '# Introduction


    Welcome to the PHP Developer''s Dictionary. We hope that you will find this book
    the most useful PHP reference available today. This is truly the type of book
    that should be next to you your workstation, except for those of you who have
    obtained expert PHP programming status. Even the best of us need to double-check
    code syntax once in a while.

    Within the pages of this book you will find a quick introduction to the language
    and a complete reference to the PHP4 language. As a developer, you might often
    find yourself scrabling for the correct syntax for a function or maybe some clarification
    on how something works, and this book intends to fill that void.


    # Who Should Buy This Book?


    Because this is a developer''s dictionary, you will not find an in-depth tutorial
    on the PHP language or complete project code for an application. What you will
    find is a starter introduction to the language and a complete reference. Because
    of this, the book is targeted to current PHP developers-developers who need a
    complete reference of the newest version of the PHP language to keep with them
    as program.


    # Organization of the Chapters


    The book is broken into two primary sections. The first, Chapters 1-3, is a brief
    introduction to the language, and the remaining ten chapters act as a reference.

    For those of you who have been programming in PHP for only a short while, you
    will find that the first section gives you good understanding of what can be accomplished
    with PHP and how you might go about it. The rest of you will find an introduction
    to many topics that you might not have known fall within the PHP domain. This
    portion of the book will get your mind thinking about how you can explore these
    powerful concepts in today''s applications.

    The second section of the book is pure reference. We have tried to group all the
    PHP functions and language elements in an easy-to-understand and easy-to-access
    way, for you, because the language is always growing and adding new functions,
    we also tried to organize it in a manner similar to the official documentation
    that you can quickly check online for any new additions, comments, or reports.


    # Writing Conventions


    Like all books, we have used a few writing conventions. These are items that you
    will see throughout the book, and understanding what they mean will help you use
    the book. These conventions are as follows:


    +   - Inline Syntax— Because this is a book about a programming language, there
    will be times that we reference language elements or functions in the body of
    a paragraph. We have used a monospaced font to signify that these are part of
    the PHP language. Here is an example:'
  merge: -1
