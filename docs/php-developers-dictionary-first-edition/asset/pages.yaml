  md: '# array_slice()


    # Syntax


    ```

    array array_slice(array array, int offset, int [length] )

    ```


    # Description


    The `array_slice()` function, which was added in PHP 4.0, returns a subset of
    the parameter `array` beginning at the `offset` and extending for the `length`.
    If `offset` is positive, the subset is based on the start of the `array`. If `offset`
    is negative, the subset is based on the end of the array. The `length` parameter
    is optional, and the subset containing the `length` number of elements. If `length`
    is negative, the subset should stop `length` away from the end of the array. If
    `length` is omitted, the subset will contain everything from the `offset` until
    `array` boundary is reached.


    ```

    $array = array(1,2,3,4,5);

    $slice = array_slice($array,1,3);//$slice = (2,3,4)

    ```


    # array_slice_splice()


    # Syntax


    ```

    array array_slice_splice(array input, int offset, int [length], array [replacement])

    ```


    # Description


    The `array_splice()` function, , which was added in PHP 4.0, removes a subset
    of `input` bounded by the `offset` and `length` parameters. Optionally, the elements
    can be replaced with `replacement`. If `offset` is positive, the `offset` is measured
    from the beginning of `input`. If `offset` is negative, it is measured from the
    end of `input`


    If the length parameter is omitted, removal occurs from `offset` to a boundary
    of `input`. If `length` is positive, the corresponding number of elements will
    be removed. If `length` is negative, the last element of the removed portion of
    the `input` array will be `length` elements from the end of the array. To remove
    everything from the `offset` to the end of the array, specify `count($input)`
    as the `length` parameter.'
