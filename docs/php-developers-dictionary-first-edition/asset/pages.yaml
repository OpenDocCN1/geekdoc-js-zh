    # Configuration File Options


    Some options in PHP must be compiled into PHP to work, but others are controlled
    through configuration settings in the .ini file used. When settings in the .ini
    file are used, PHP reads the configuration options from the php.ini only on startup.
    For the server module of PHP, this happens only once the Web server is started.
    For the CGI version, it happens every time the PHP is called. Three different
    types of configuration options can be made in the .ini file. These are detailed
    in the following discussion.


    ```

    php_config_name string

    ```


    This option sets the configuration variable to the specified string value.

    Example:


    ```

    include_path = /usr/include/php ; UNIX: "/path1/path2" Win: "\path1\path2"

    doc_root = /www/htdocs ; the root of the php pages

    php_config_flag_name onoff

    ```


    This option sets the configuration variable on or off. This is a Boolean configuration
    option with only two values.

    Example:


    ```

    short_open_tag = On ; allow the <? tag. otherwise, only <?php

    and

    asp_tags = Off ; allow ASP-style %% tags

    php_config_name integer

    ```


    This option sets the configuration variable to the specified integer value.

    Example:


    ```

    max_execution_time = 30 ; Maximum execution time of each script, in

    seconds

    memory_limit = 8388608 ; Maximum amount of memory a script may consume

    (8MB)

    ```


