  md: '# Safe Mode


    The safe mode option in PHP allows control of which files can be accessed from
    a script using functions that access the file system, such as include(), fopen(),
    readfile(), and so on. The restriction is as follows: A file can be accessed either
    if it is owned by the same user ID as the script that is trying to access it,
    or if the file is in a directory to which the user of the running script has access.


    # safe_mode


    # Syntax


    ```

    safe_mode boolean

    ```


    # Description


    The safe_mode directive specifies whether safe_mode is enabled or disabled. The
    default value is Off.


    # safe_mode_exec_dir


    # Syntax


    ```

    safe_mode_exec_dir string

    ```


    # Description


    The safe_mode_exec_dir directive specifies the location of programs that are allowed
    to execute when running under safe mode. The system() function and other functions
    that execute system programs are covered by this directive. The default value
    is none.


