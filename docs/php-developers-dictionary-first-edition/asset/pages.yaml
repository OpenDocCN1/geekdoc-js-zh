    Please select your gender:<BR>

    <SELECT NAME="gender">

    <OPTION value = Male>Male

    <OPTION value = Female>Female

    </SELECT>

    <P>

    <INPUT TYPE="submit" VALUE="Submit">

    </FORM>

    </td></tr></TABLE></CENTER>

    </BODY>

    </HTML>

    ```


