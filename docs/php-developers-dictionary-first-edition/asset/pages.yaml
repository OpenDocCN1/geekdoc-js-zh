    # DBM


    The DBM functions enable you to access data stored in one of the many DBM-style
    databases such as Berkeley DB, Gdbm, system libraries, and some of the flat-file
    databases that exist. DBM databases store key and value pairs as opposed to relational
    databases, which store variable-length records of related data. The following
    example shows a DBM database and retrieves the password of user123:


