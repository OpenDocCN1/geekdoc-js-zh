    # fsockopen()


    # Syntax


    ```

    fsockopen(hostname, port, [errno], [errstr], [timeout]);

    ```


    # Description


    The `fsockopen()` function establishes a TCP connection to `port` running on `hostname`.
    The optional `timeout` parameter defines the timeout for the `connect()` system
    call. If `fsockopen()` is not successful, it will return false, 0. The optional
    variables used by `errno` and `errstr` will be set to the system-level error number
    and string of system errors that occurred. If `fsockopen()` is successful, it
    will return a file pointer that can be used by other file-related functions, such
    as `fputs()`, `fclose()`, and so on.


