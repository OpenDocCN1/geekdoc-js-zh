  md: '# PHP Developer''s Dictionary


    # Array


    Arrays in PHP can serve many useful roles, but the main reason to use an array
    is to organize groups of related values. In PHP, each element in an array has
    a corresponding index (also referred to as key) and a value. The index can be
    a number or it can be a string, whereas the value can be of any type. Array of
    multiple dimensions are possible because array element itself can turn in an array.
    When an array is created, an internal pointer is initialized to the first element
    of an array. This pointer is used in several functions to traverse the elements
    of the array. Other roles that arrays can play in PHP include representing a stack
    or a queue data structure. The array functions provide powerful tools for managing
    and processing data.


    # array()


    # Syntax


    ```

    array(...);

    ```


    array() language construct returns an array made up of the given parameters. The
    parameters can indicate an index or key with the => operator. Each element in
    an array is composed of a key and a value. If a key isn''t defined when creating
    an array, the position of the element in the array will be used with the first
    element of the array at 0.


    ```

    $array1 = array(1,1);//indexed array starting at zero

    $array2 = array("heads"=>1,"tails"=>0);//associative array

    $array3 = array($array1,$array2);//array of arrays

    ```


    # array_count_values()


    # Syntax


    ```

    array_count_values(array input)

    ```


    Description


    The array_count_values() function, which was added in PHP 4.0b4, returns an array
    indicating the frequency of values in the input array. The resulting array has
    the values in the input array as the keys and the corresponding frequency of each
    key as its value.


