    # Description


    The xml_set_unparsed_entity_decl_handler() function, which was added in PHP 3.0.6
    and PHP 4.0, sets the unparsed entity declaration handler function for a given
    parser. The parser sees an external entity declaration containing an NDATA declaration,
    as


    ```

    <!ENTITY name { systemId |

    NDATA notationName>

    ```


    If the handler is empty or FALSE, the parser will be disabled. A return value
    of TRUE indicates that the handler function was set properly, and FALSE indicates
    that parser is invalid. The handler function must take six parameters:


    +   - parser—An integer that references to the XML parser that called the handler.

    - entityName—A string that names the entity you are defining.

    - base—A string that resolves the system identifier (systemId) of an external
    entity. Current implantations support only an entity string for this value.

    - systemId—A string that is the system identifier for the external entity.

    - publicKey—A string that is the public identifier for the external entity.

    - notationName—A string that is the notation of this entry.


