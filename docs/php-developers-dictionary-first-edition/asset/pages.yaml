  md: 'The strtok() function is used to tokenize a string into smaller pieces. arg1
    indicates the string to be tokenized and arg2 is the field separator for tokenizing
    the string. If arg2 consists of more than one character, any of characters will
    create a token. An internal pointer is kept between calls of strtok(). To continue
    tokenizing the same string, you should specify only the separator string and not
    the original string each time.


