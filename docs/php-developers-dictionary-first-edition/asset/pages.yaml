    # Filesystem


    This section describes functions that provide information about a system''s files,
    directories, permissions, and users. These functions enable you to read files,
    change and set permissions, create links, and return statistics about files and
    directories. Permissions are important when using these functions; if the user
    who is running PHP does not have permissions to perform the operation, an error
    will be returned.


    # Note


    Remember that PHP typically runs as the user nobody, or some other user with limited
    system access.


    # basename()


