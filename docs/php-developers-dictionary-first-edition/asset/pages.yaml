  md: '# Description


    The pfsockopen() function is the persistent version of fsockopen(). Both functions
    establish a socket connection as a file stream. A TCP socket connection is established
    to hostname and port. The optional timeout parameter defines the timeout for the
    connect() system call.

    pfsopen() function does not close the socket connection upon completion of a read
    or write to the socket.

    If pfsockopen() is not successful, it will return false, 0. The optional variables
    errno and errstr will be set to indicate the system-level error that occurred.
    pfsockopen() is successful, it will return a file pointer that can then be used
    by other file-related functions such as fputs(), gets(), fclose(), and so on.


    # set_socket_blocking()


    # Syntax


    ```

    set_socket_blocking(socket descriptor, mode);

    ```


    # Description


    The set_socket_blocking() function sets the blocking mode for the socket. If mode
    is false, 0, the socket descriptor will be switched to nonblocking mode. Setting
    mode to true, 1, will set the socket to blocking mode. In nonblocking mode, calls
    that get information from the socket will return immediately with data that is
    in the input buffer. In blocking mode, socket reads will halt execution until
    all the data available on the socket is received.


    # syslog()


    # Syntax


    ```

    syslog(priority, message);

    ```


    # Description


    The syslog() function adds message with priority to the system log. Valid priorities
    are given in Table 7.5.


    # Note


    On Windows NT, the syslog service is provided through an emulator. The messages
    are logged in the NT Event Log and can be viewed using the Event Viewer.'
  merge: -1
  pgno: 252
