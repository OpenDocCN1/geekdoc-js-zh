  md: '# PHP Developer''s Dictionary


    # Description


    The fgetcsv() function gets a line of data from a comma-separated value (CSV)
    file referenced by the file pointer, `fp`. It returns an array with the values
    separated by the optional `delimiter`. If `delimiter` is not specified, a comma
    (`,`) is assumed. The parameter `length` is the longest line of the CSV file allowing
    for trailing carriage return and line feeds.


    # Note


    A blank line in the input CSV file will be translated into an array with one null
    field. The blank line will not be interpreted as an error.


    # fgets()


    # Syntax


    ```

    string fgets(int fp, int length);

    ```


    # Description


    The `fgets()` function reads the file referenced by `fp` and returns a string
    of `length` - 1. If an end of file (EOF) is reached, the `length` parameter is
    ignored and the string is returned. The function will return false, `0`, if there
    is an error reading the file.


    # fgetss()


    # Syntax


    ```

    string fgetss(int fp, int length, string [allowable_tags]);

    ```


    # Description


    The `fgetss()` function reads the file referenced by `fp`, and returns a string
