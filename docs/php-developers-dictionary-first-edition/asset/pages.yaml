    # Forms Data Format


    The Forms Data Format library enables you to interact with forms that are part
    of PDF documents. Details on the purpose and use of this library can be found
    at http://partners.adobe.com/developer/acrosdk/forms.html. To include this library
    with PHP, you should have the following line above /include/LibPDFTK as a configuration
    argument. With PDF forms is similar to HTML forms except that the form variables
    and values are not available directly, but must be written to file first, and
    then read out of the file. The library also enables you to populate PDF form values.


