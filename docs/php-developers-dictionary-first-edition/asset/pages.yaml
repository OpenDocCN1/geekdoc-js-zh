- img_proc: true
  md: '# PHP Developer''s Dictionary


    The `imap_open()` function opens an IMAP stream to the specified mailbox. To accomplish
    this connection, you must pass the appropriate username and password. If the attempt
    fails, an error will be returned.

    When using this, the syntax for mailbox is important. The first portion of the
    mailbox value is the server name, path, and port number, which are contained in
    brackets; Following the brackets, you can specify a folder or group name depending
    on the type of server which you are connecting.

    The optional flags parameter is a bit mask that can contain one or more of the
    items in Table 6.1.


    | Table 6.1. Values for the Bit Mask |

    |---|---|

    | CL_EXPUNGE | Expunge mailbox automatically when closing connection. |

    | OP_ANONYMOUS | Don''t use or update an .news for news (NNTP only). |

    | OP_HAPPEN | Open a connection but not a mailbox (for IMAP and NNTP names). |

    | OP_READONLY | Open mailbox in read-only mode. |


    This function can be used to connect to an IMAP, POP3, or NNTP server. Sample
    syntax for these connections are as follows:


    ```

    $imap = imap_open("{imap.mcp.com:143 INBOX", "raw", "mypass"); //IMAP

    $imap = imap_open("{pop3.mcp.com/pop3:110", "raw", "mypass"); //POP3

    $imap = imap_open("{news.mcp.com/nntp:119 comp.lang", "raw", "mypass"); //NNTP

    ```


