    # XML Parser


    The parser functions available in PHP enable you to parse, but not validate, XML
    documents. The extension then lets you create parsers that have corresponding
    handlers for each XML element. Note that case-folding, in XML parlance, simply
    means uppercasing, and all element names that are passed to the handlers are uppercase.
    To include XML support using Apache 1.3.7 or later, use --with-xml as an argument
    to PHP''s configure. Prior versions of Apache require that you include the expat
    library, which can be found at http://www.jclark.com/xml.


