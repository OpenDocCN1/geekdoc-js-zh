    # PostgreSQL Overview


    PostgreSQL is a very powerful open-source client/server relational database management
    system (RDMS). PostgreSQL was first conceived in 1986 and was known as the Berkeley
    Postgres Project. The project evolved and improved until 1994, when Andrew Yu
    and Jolly Chen added a Structured Query Language (SQL) interpreter to Postgres.
    This release was known as Postgres95 and was released to the open-source community.


    In 1996, PostgreSQL was overhauled and the result was released as PostgreSQL version
    6.0. These features included increased back-end speed, standard enhancements,
    and important back-end features including subselects, constraints, and triggers.


    PostgreSQL is a very robust package and has many of the features available in
    a large, commercially available RDBMS. These features include transactions, subtransactions,
    triggers, foreign key referential integrity, and sophisticated locking. PostgreSQL
    also lacks features available in other relational databases, such as inheritance
    and rules. From a user''s standpoint, the only major feature that PostgreSQL does
    not have is outer joins. Outer joins will be added in a later version. PostgreSQL
    offers two modes: One guarantees that if the software or hardware crashes the
    data has been stored to the disk. This mode is often slower than most commercially
    available databases because of the flushing (or syncing) method that is used.
    The other mode does not offer the guarantees that the first mode does, but it
    runs faster than commercial databases. Unfortunately, at the present time, there
    is no intermediate mode that offers a level of data security with increased performance.
    This, too, will be provided in a later version.


    # Connecting PostgreSQL and PHP


    The connection between PostgreSQL and PHP is made through the use of the `pg_connect()`
    function. This function accepts five parameters: the hostname of the database
    server, the port on which the postmaster is listening, connection options, the
    ty, and the database name. For our purposes, we assume that the PostgreSQL and
    PHP are installed on the same machine, and that no connection options or ty are
    required. In our examples, the call to pg_connect() looks like this:


    ```

    $conn = pg_connect("localhost", "5432", "", "", "test");

    ```


    The variable $conn will contain the database connection handle if the function
    is successful. A sample program looks this:


    ```

    <html>

    <head>

    <title>Making the Connection</title>

    </head>

    <body>

    $conn = pg_connect("localhost", "5432", "", "", "test");

    if (!$conn) { echo("An database connection error occurred.\n"); exit; }

    else { echo("You have connected to the database successfully.\n"); }

    ```'
