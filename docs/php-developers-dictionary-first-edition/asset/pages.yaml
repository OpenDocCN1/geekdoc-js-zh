  md: '# Chapter 2. Generating HTML


    As Web sites become more and more user friendly, Web publishers want the content
    to be more attractive and tailored to the tastes of each user. Visit any of them
    today and each of them will offer some type of customization based on your preferences.
    This customization might be in the form of personalized weather, stock quotes,
    or news. Each of these preferences is read from a database based on your login
    ID or a cookie in your browser. This section describes some methods for generating
    dynamic content using PHP. We discuss the use of variables in generating content
    and how to use the environment, dates, and times to affect what the user sees.
    We also discuss sending email from PHP and using PHP to authenticate to a Web
    site.


    # Generating Dynamic Content


    This section defines dynamic content and then discusses ways to generate content.
    The dynamic content discussed in this section are limited to request variables
    and the environment to generate content. Other methods, namely using databases
    to generate content, will be discussed in the next chapter.


    # Defining Dynamic Content


    Let''s first define dynamic content. **Dynamic content** is where the user''s
    Web experience is determined by outside influences. This means that content seen
    on a site in the morning, without intervention from the Webmaster, will change
    in the afternoon, and possibly again at night.


    # Using Variables to Generate Content


    PHP can use a number of variables to generate dynamic content. [Table 2.1](#table)
    describes the environment variables that are available to the PHP script.


    | Variable | Description |

    | :--- | :--- |

    | argv | argv is defined as an array of arguments passed to the script on the
    command line. This functionality gives a C-like look and feel to command-line
    parameters. When the PHP script is called using the GET method, argv will contain
    any query string information. |

    | argc | argc is defined as the number of command-line parameters passed to the
    script. This adds a C-like look and feel to running the PHP scripts from the command
    line. |

    | PHP_SELF | PHP_SELF is defined as the current executing PHP script. This allows
    the script to pass variables to itself based on input. |

    | HTTP_COOKIE_VARS | HTTP_COOKIE_VARS is defined as an associative array of variables
    passed to the PHP script containing the client''s cookies. |

    | HTTP_GET_VARS | HTTP_GET_VARS is defined as an associative array of variables
    passed to the PHP script by a client using the HTTP GET method. |'
