    int chown(string filename, mixed user);

    ```


    # Description


    The chown() function changes the owner of the file defined by filename to the
    user specified by user . If the function is successful, true, 1, is returned.
    UNIX permissions allow the execution of this function such that only root (or
    a user with superuser privileges) can change the owner of a file. Because Windows
    systems do not have an equivalent, this function always returns true, 1, and the
    function does nothing.


    # clearstatcache()


    # Syntax


    ```

    void clearstatcache(void);

    ```


    # Description


    The clearstatcache() function clears the stat cache. Because of the resources
    required when executing stat or lstat system calls, PHP caches the results of
    the last call and those results are used in each subsequent call. This function
    takes no parameters and returns status, but is used to force a new status check
    when calling the following functions:


    | stat() | file_exists() |

    | iswritable() | is_readable() | is_executable() |

    | isfile() | is_dir() | is_link() |

    | filetime() | fileatime() | filetime() |

    | fileinode() | filegroup() | fileowner() |

    | filesize() | filetype() | fileperms() |


