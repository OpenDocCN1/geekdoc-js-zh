    you to perform mathematical functions, incrementing and decrementing, and logical
    operators.

    An important part of using operators, which were covered in Chapter 1, "Basic
    PHP," is understanding precedence. Precedence determines the order in which the
    operators are performed in a given equation. We remember from grade school that
    multiplication and division occur before addition and subtraction, which outlines
    the precedence of these operators. Table 4.1 lists the operator precedence in
    PHP.


    | Table 4.1. Operator Precedence in PHP |

    | Associativity | Operators |

    | --- | --- |

    | Right | new { |

    | Right | !,, +, -, (int), (double), |

    | Right | *, (string), (array), (object), @ |

    | Left | *, /, % |

    | Left | ;, - |

    | Left | <<, >> |

    | Non-associative | ==, !=, === |

    | Non-associative | <, <=, >= |

    | Left | ^ |

    | Left | |

    | Left | && |

    | Left | || |

    | Left | ?, +=, -=, *=, /=, %, &=, |=, ~, <=, >= |

    | Right | print |

    | Left | and |

    | Left | xor |

    | Left | or |


