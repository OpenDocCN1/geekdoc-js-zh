  md: '# Chapter 10. Chapter Database Extensions


    This chapter provides a reference for all the minor—relational databases that
    are supported, both natively and in some cases, through ODBC drivers. Database
    support is one of the most important features of PHP and is constantly being updated,
    so be sure to check the latest documentation for new features and features.


    Several commonalities exist between many of the different databases supported.
    One connection is persistent and non-persistent connections. A non-persistent
    connection is destroyed automatically at the start of script processing, while
    a persistent connection remains even after a script is finished. Because the amount
    of overhead involved in establishing a connection can be significant you generally
    better performance by using persistent connections, but you can do this only when
    PHP is running as a server module and when a connection attempt is made, PHP looks
    for a similar connection and returns the reference to it instead of creating a
    new connection, if possible. This is true for both persistent and non-persistent.


    Some you would be familiar with when this chapter include transaction, commit,
    rollback, and fetch. A transaction is a set of SQL queries that are related, because
    they build that a particular process completes successfully. The typical example
    is: moving savings between two checking accounts. The first part of the transaction
    would debit your savings account and the second part would credit your checking
    account. If either of these actions fails, you want the process to fail; otherwise,
    your money could disappear into thin air. This is the purpose of a transaction:
    to ensure that the entire process finishes. When you are satisfied, you call commit,
    which tells the database that you are finished and confirming your changes. Rollback
    means to reverse your previous transaction or query. Finally, a cursor refers
    to the result of a query and fetch means to examine a result of the set. For a
    more complete understanding of these concepts, consult any of the database vendors
    reference material.


