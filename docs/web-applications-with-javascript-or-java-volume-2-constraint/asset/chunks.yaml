    \ instance p and multiple references b.authors to Author instances, is destroyed,\
    \ the derived inverse references have to be removed first (e.g., by removing b\
    \ from p.publishedBooks). This is accomplished by calling the set methods for\
    \ the single and multi-valued properties with a null parameter, e.g., b.setPublisher(null)\
    \ and b.setAuthors(null) within the Book.delete method:\n\n```\n public class\
    \ Book {\n…\npublic static void delete( EntityManager em,\nUserTransaction ut,\
    \ String isbn) throws Exception {\nut.begin();\nBook b = em.find( Book.class,\
    \ isbn);\nb.setPublisher( null);\nb.setAuthors( null);\nem.remove( b);\nut.commit();\n\
    }\n}\n```\n\nIn the same way, we have to take care of deleting the references\
    \ to Book instances when deleting a Publisher or an Author instance:\n\n```\n\
    \ public class Author {\n…\npublic static void delete( EntityManager em,\nUserTransaction\
    \ ut, Integer personId) throws Exception {\nut.begin();\nAuthor a = em.find( Author.class,\
    \ personId);\na.setAuthoredBooks( null);\nem.remove( a);\nut.commit();\n}\n}\n\
    ```\n\nAnd, likewise,\n\n```\n public class Publisher {\npublic static void delete(\
    \ EntityManager em,\nUserTransaction ut, String name) throws Exception {\nut.begin();\n\
    Publisher p = em.find( Publisher.class, name);\np.setPublishedBooks( null);\n\
    em.remove( p);\nut.commit();\n}\n}\n```\n\n#### 9.2.7 Entity Managers and Cached\
    \ Entities\n\nUnfortunately, JPA does not provide automatic maintenance of derived\
    \ inverse references. According to the Java Persistence Wiki, we have to implement\
    \ the (direct and inverse) relations management within set/add/remove methods:\n\
    \n> *A common problem with bidirectional relationships is the application updates\
    \ one side of the relationship, but the other side does not get updated, and becomes\
    \ out of sync. In JPA, as in Java in general, it is the responsibility of the\
    \ application or the object model to maintain relationships. If your application\
    \ adds to one side of a relationship, then it must add to the other side. This\
    \ is commonly resolved through add or set methods in the object model that handle\
    \ both sides of the relationships, so the application code does not need to worry\
    \ about it. There are two ways to go about this: you can either add the relationship\
    \ maintenance code to only one side of the relationship, and only use the setter\
    \ from that side (such as making the other side protected), or add it to both\
    \ sides and ensure you avoid an infinite loop*.\n\nWe have used an entity manager\
    \ for each controller class. Every entity manager maintains a set of cached entities\
    \ which can be “shared” with other entity managers by using the merge method.\
    \ In our example code, as part of the create and update methods of each model\
    \ class, we have to merge the updated entities that belong to another entity manager.\
    \ For example, in the Book.create method, we need to merge the new book’s publisher,\
    \ managed by the PublisherController’s entity manager, and all its authors, managed\
    \ by the AuthorController’s entity manager:\n\n```\n public class Book {\npublic\
    \ static void create( EntityManager em,\nUserTransaction ut,\nString isbn, String\
    \ title, Integer year,\nPublisher publisher, Set<Author> authors)\nthrows Exception\
    \ {\nut.begin();\nBook book = new Book( isbn, title, year,\npublisher, authors);\n\
    em.persist( book);\nif (publisher != null) {\nem.merge( publisher);\n}\nif (authors\
    \ != null)\nfor (Author a : authors) {\nem.merge( a);\n}\n}\nut.commit();\n}\n\
    }\n```\n\nWithout using merge, the publisher as well as all author instances from\
    \ the authors list, do not represent references to the originally cached entities,\
    \ and are not going to retain our changes. For more details, please check the\
    \ Java Persistence Documentation related to this matter.\n\nIt is also possible\
    \ to disable the JPA caching, so the entities are reloaded from the database for\
    \ every new instance, e.g., when EntityManager.find method is called. This can\
    \ be achieved by adding the following line in the persistence.xml file:\n\n```\n\
    \ <property name=\"eclipselink.cache.shared.default\" value=\"false\"/>\n```\n\
    \nThe above configuration works for eclipselink implementation and it may be different\
    \ for other API implementations. Notice that disabling entity caching is not recommended\
    \ without a serious reason, since it degrades the app’s performance and may produce\
    \ unpredicted behavior in some cases, such as when using @SessionScoped managed\
    \ entities.\n\n### 9.3 Exploiting Derived Inverse Reference Properties in the\
    \ User Interface\n\nWe can now exploit the derived inverse reference properties\
    \ Publisher::publishedBooks and Author::authoredBooks for more efficiently creating\
    \ a list of associated books in the *retrieve/list all publishers* and *retrieve/list\
    \ all authors* use cases.\n\n#### 9.3.1 Show Information About Published Books\
    \ in *Retrieve/List All*\n\nFor showing information about published books in the\
    \ *retrieve/list all publishers* use case, we can now exploit the derived inverse\
    \ reference property publishedBooks:\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:dataTable value=\"#{publisherController.publishers}\"\
    \ var=\"p\">\n…\n<h:column>\n <f:facet name=\"header\">Published books</f:facet>\n\
    \  <h:outputText value=\"#{p.publishedBooks}\" escape=\"false\"\n  converter=\"\
    pl.m.converter.BookListConverter\"/>\n  </h:column>\n </h:dataTable>\n <h:button\
    \ value=\"Back\" outcome=\"index\" />\n </ui:define>\n</ui:composition>\n```\n\
    \nIn the case of unidirectional associations, for the case of the *retrieve/list\
    \ all books* use case, we have used a method in the Book model class, i.e., getAuthorNames(),\
    \ which returns a comma-separated list of author names as a string:\n\n```\n public\
    \ class Book {\n …\n public String getAuthorNames() {\n String result = \"\";\n\
    \ int i = 0, n = 0;\n if (this.authors != null) {\n n = this.authors.size();\n\
    \ for (Author author : this.authors) {\n result += author.getName();\n if (i <\
    \ n - 1) {\n result += \", \";\n }\n i++;\n }\n }\nreturn result;\n}\n}\n```\n\
    \nThis makes sense in the case of a book, since the number of authors is in general\
    \ limited to a small number. However, a Publisher may have a large number of published\
    \ books. As a better alternative to our string serialization, we can use a JSF\
    \ converter class which allows us to present the list of authors in a custom way.\
