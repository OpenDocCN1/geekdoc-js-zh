  trans: "\n\n# 13. 使用原生 JS 实现子类型\n\n在本章中，我们首先将解释 JavaScript 中基于构造函数的子类型通用方法，然后根据我们上面展示的示例——*公共图书馆*（Public\
    \ Library）的片段，介绍两个案例研究。\n\n## 12. 表类继承 (TCI)（注：提供的 TCI 文本似乎是上一个章节的延续）\n\nTCI 方法的**优点**：\n\
    (1) 显式地保留了给定类层次结构在元素（类）方面的原始结构。\n(2) 当给定类层次结构的细分是互不相交时，TCI 能够实现内存高效且非冗余的存储。\n\n\
    **缺点**：\n(1) TCI 方法无法对原始类层次结构中表达的子类型关系提供忠实的表征。具体来说，对于任何表示子类实例（员工、经理或作者）的行，没有任何信息表明它代表一个父类实例（人员）。因此，TCI\
    \ 数据库模式没有提供有关所表示的子类型关系的信息；相反，这些存储在应用程序类模型中的元数据与数据库解耦了。\n(2) TCI 方法需要重复列定义，这是模式冗余的一种形式。\n\
    (3) 每当片段子类重叠时，TCI 方法可能会导致数据冗余。在我们的示例中，作者也可以是员工，因此对于重叠中的任何人员，我们需要对代表父类属性的所有列复制数据存储（在我们的示例中，这仅涉及属性名）。\n\
    \n### 12.7.4.3 关联表继承 (Joined Tables Inheritance)\n\n为了避免在细分重叠情况下 TCI 的数据冗余问题，我们可以采用\
    \ JTI 方法，如下所示 图 12.12 所示的 SQL 表模型。该模型通过将主键列同时定义为引用其父表主键的外键，将表示子类的表（*子表*）与表示其父类的表（*父表*）连接起来。请注意，外键以带有«fkey»刻标记的\
    \ UML 依赖箭头的形式视觉化，并在其源表侧注明外键列名。\n\n![](img/b_9783110500325-012_fig_012.png)\n\n\
    图 12.12：表示人员角色层次结构的 JTI 表模型。\n\n该模型的一个接受的人群示例如下：\n\n| people | person_id | name\
    \ |\n| :--- | :--- | :--- |\n| 1001 | Harry Wagner |\n| 1002 | Peter Boss |\n\
    | 1003 | Tom Daniels |\n| 1077 | Immanuel Kant |\n\n| authors | person_id | biography\
    \ |\n| :--- | :--- | :--- |\n| 1001 | 1956 出生于马州波士顿…… |\n| 1077 | Immanuel Kant\
    \ (1724–1804) 是一位德国哲学家…… |\n\n| employees | person_id | emp_no | | |\n| :--- |\
    \ :--- | :--- | --- | --- |\n| 1001 | 21035 | | |\n||1002 | 23107 | | |\n\n| managers\
    \ | person_id | department | | | |\n| :--- | :--- | :--- | --- | --- |\n| 1002\
    \ | Sales | | | |\n\nJTI 方法的**优点**：\n(1) 显式地保留了子类型关系和类层次结构的结构。\n(2) 避免了细分重叠时的数据冗余。\n\
    \n**缺点**：\n(1) JTI 方法的主要缺点是，查询子类时需要进行*连接查询*（用于连接分离的实体数据），这可能会产生性能问题。\n\n### 12.8\
    \ 测验题\n\n如果你想查找以下练习题的答案，可以查看我们的讨论论坛。如果你在论坛中没有找到答案，可以发帖提问特定问题的答案。\n\n#### 12.8.1\
    \ 题 1：关于类层次结构的陈述\n\n考虑以下类模型：\n\n![](img/b_9783110500325-012_ingr_001.png)\n\n\
    以下哪些陈述是正确的？请选择一个或多个：\n\n1. □ `Cde` 的所有实例对属性 `a1` 都有值。\n2. □ `Cde` 的标准标识符是 `a1`。\n\
    3. □ `Cde` 的所有实例都可能有一个指向类型 `Bcd` 对象的引用 `ab`。\n4. □ `Abc` 的直接实例可能对 `c` 有值。\n5.\
    \ □ 对于任何类型为 `Abc` 的对象，`a3` 的值必须大于 `a2` 的值。\n6. □ 对于任何类型为 `Cde` 的对象，`a3` 的值必须大于\
    \ `a2` 的值。\n7. □ `Cde` 的标准标识符是 `c`。\n\n#### 12.8.2 题 2：类层次结构合并\n\n考虑以下类模型：\n\n\
    ![](img/b_9783110500325-012_ingr_002.png)\n\n在这种简单类层次结构的情况下，我们可以使用类合并设计模式，将整个类层次结构合并到一个类中。以下哪些模型描述了\
    \ `Abc` 类层次结构合并设计模式的正确实现？选择：\n\n1. □ O ![](img/b_9783110500325-012_ingr_003.png)\n\
    2. □ O ![](img/b_9783110500325-012_ingr_004.png)\n3. □ O ![](img/b_9783110500325-012_ingr_005.png)\n\
    4. □ O ![](img/b_9783110500325-012_ingr_006.png)\n\n# 13. 使用原生 JS 实现子类型\n\n在本章中，我们首先将解释\
    \ JavaScript 中基于构造函数的子类型通用方法，然后根据我们上面展示的示例——*公共图书馆*（Public Library）的片段，介绍两个案例研究。\n\
    \n在第一个案例研究中，我们考虑 12.12 所示的单层类层次结构，使用类合并设计模式将其重构为持久数据库。\n\n在第二个案例研究中，我们考虑由人员、员工和作者角色组成的多层类层次结构\
    \ 12.8。人员细分为员工和作者没有任何约束，这意味着它是非重叠的。我们使用关联表继承方法将员工-作者人员层次结构映射到一组通过外键依赖关联的表。\n\n\
    在两个案例研究中，我们都展示了\n\n1. 如何从信息设计模型推导出 *JS 类模型*和相应的*实体表模型*；\n2. 如何以*JS 类*的形式编写模型；\n\
    3. 如何基于模型编写视图和控制器代码。\n\n## 13.1 基于构造函数的类的子类型\n\n在 ES15 版本之前，JavaScript 还没有显式的类概念，且不支持支持子类型，因此必须借助某些提供两种继承机制的代码模式来来实现：(1)\
    \ 属性继承和 (2) 方法继承。\n\n正如我们在第一卷第 1 章中解释过的，类可以通过两种替代方式定义：***基于构造函数的***和***基于工厂的***。这两种方法都有各自实现继承的方式。\n\
    \n我们通过以下示例总结了 ES2015 用于定义单继承类层次结构父类和子类的代码模式：\n\n![](img/b_9783110500325-013_ingr_001.png)\n\
    \n首先，我们定义基类 `Person`，具有带有 getter 和 setter 的两个属性 `firstName` 和 `lastName`：\n\n\
    ```\nclass Person {\n     constructor ({first, last}) {\n         // 通过调用 setter\
    \ 分属性\n         this.firstName = first;\n         this.lastName = last;\n    \
    \ }\n     get firstName () {return this._firstName;}\n     set firstName ( f)\
    \ {\n         … // 检查约束\n        this._firstName = f;\n     }\n     get lastName\
    \ () {return this._lastName;}\n     set lastName ( l) {\n         … // 检查约束\n\
    \        this._lastName = l;\n     }\n}\n```\n\n然后，我们定义子类 `Student`，它具有一个额外的属性\
    \ `studNo`：\n\n"
- fmt: "\n```javascript\n class Student extends Person {\n    constructor ({first,\
    \ last, studNo}) {\n        // invoke constructor of superclass\n        super({first,\
    \ last});\n        // assign additional properties\n        this.studNo = studNo;\n\
    \     }\n     get studNo () {return this._studNo;}\n     set studNo ( sn) {\n\
    \         … // check constraints\n        this._studNo = sn;\n     }\n}\n```\n\
    \nNotice how the constructor of the superclass is invoked: with `super({first,\
    \ last})`.\n\n# 13.2 Case Study 1: Eliminating a Class Hierarchy\n\nSimple class\
    \ hierarchies can be eliminated by applying the `Class Hierarchy Merge` design\
    \ pattern. The starting point for our case study is the simple class hierarchy\
    \ shown in the information design model of Figure 12.1 above, representing a disjoint\
    \ (but incomplete) rigid segmentation of `Book` into `TextBook` and `Biography`.\
    \ This model is first simplified by applying the `Class Hierarchy Merge` design\
    \ pattern, resulting in the following model:\n\n![](graphic/converted/b_9783110500325-013_ingr_002.png)\n\
    \nWe can now derive a `JS class model` from this design model.\n\n## 13.2.1 Make\
    \ the JS Class Model\n\nWe make the JS class model in 3 steps:\n\n1.  Replace\
    \ the platform-independent datatypes (used as the ranges of attributes and parameters)\
    \ with JS datatypes. This includes the case of enumeration-valued attributes,\
    \ such as `category`, which are turned into number-valued attributes restricted\
    \ to the enumeration integers of the underlying enumeration type.\n2.  Decorate\
    \ all properties with a `«get/set» stereotype for indicating that they have implicit\
    \ getters and setters.\n3.  Add property `check` functions, as described in Chapter\
    \ 8 of Volume 1\\. The `checkCategory` function, as well as the checks of the\
    \ segment properties need special consideration according to their implied semantics.\
    \ In particular, a segment property’s `check` function must ensure that the property\
    \ can only be assigned if the `category` attribute has a value representing the\
    \ corresponding segment. We explain this implied validation semantics in more\
    \ detail below when we discuss how the JS class model is coded.\n\nThis leads\
    \ to the JS class model shown in [Figure 13.1](#9783110500240_011618.xhtml_b_9783110500325-013_fig_001),\
    \ where the class-level (`static`) methods are underlined:\n\n![](graphic/converted/b_9783110500325-013_fig_001.png)\n\
    \nFigure 13.1: The JS class model of the merged `Book` class hierarchy.\n\n##\
    \ 13.2.2 New Issues\n\nCompared to the enumeration app discussed in Chapter 11\
    \ of Volume 1, we have to deal with a number of new issues:\n\n1.  In the `model\
    \ code` we have to take care of:\n    1.  Adding the constraint violation class\
    \ `FrozenValueConstraintViolation` to `errorTypes.js`.\n    2.  Coding the enumeration\
    \ type to be used as the range of the `category` attribute (`BookCategoryEL` in\
    \ our example).\n    3.  Coding the `checkCategory` function for the `category`\
    \ attribute. In our example this attribute is `optional`, due to the fact that\
    \ the `Book` segmentation is `incomplete`. If the segmentation, to which the `Class\
    \ Hierarchy Merge` pattern is applied, is complete, then the `category` attribute\
    \ is `mandatory`.\n    4.  Coding the `check` functions for all segment properties\
    \ such that they take the `category` as a second parameter for being able to test\
    \ if the segment property concerned applies to a given instance.\n    5.  Refining\
    \ the serialization function `toString()` by adding a category case distinction\
    \ (`switch`) statement for serializing only the segment properties that apply\
    \ to the given `category`.\n    6.  Implementing the `Frozen Value Constraint`\
    \ for the `category` attribute in `Book.update` by updating the `category` of\
    \ a book only if it has not yet been defined. This means it cannot be updated\
    \ anymore as soon as it has been defined.\n\n2.  In the `UI code` we have to take\
    \ care of:\n    1.  Adding a “Special type” (or “Category”) column to the display\
    \ table of the “List all books” use case in `books.html`. A book without a special\
    \ category will have an empty table cell, while for all other books their `category`\
    \ will be shown in this cell, along with other segment-specific attribute values.\
    \ This requires a corresponding `switch` statement in `pl.v.books.retrieveAndListAll.setupUserInterface`\
    \ in the `books.js` view code file.\n    2.  Adding a “Special type” choice widget\
    \ (typically, a selection list), and corresponding form fields for all segment\
    \ properties, in the forms of the “Create book” and “Update book” use cases in\
    \ `books.html`. Segment property form fields are only displayed when a corresponding\
    \ book `category` has been selected. Such an approach of rendering specific form\
    \ fields only on certain conditions is sometimes called `dynamic forms`.\n\n##\
    \ 13.2.3 Code the Model Classes of the JS Class Model\n\nThe JS class model can\
    \ be directly coded for getting the code of the model classes of our JS front-end\
    \ app.\n\n### 13.2.3.1 Summary\n\n1.  Code the enumeration type `BookCategoryEL`\
    \ to be used as the range of the `category` attribute with the help of the meta-class\
    \ `Enumeration`, as explained in Chapter 11 of Volume 1.\n2.  Code the model class\
