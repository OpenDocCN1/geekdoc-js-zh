    ## 2. **Eliminate bidirectional associations** by replacing them with a pair of
    mutually inverse reference properties.


    ### 7.2.2 How to Eliminate Unidirectional Associations


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having the target
    class as its range. Its multiplicity is the same as the multiplicity of the target
    association end. Its name is the name of the association end, if there is any,
    otherwise it is set to the name of the target class (possibly pluralized, if the
    reference property is multi-valued).


    ### 7.2.3 How to Eliminate Bidirectional Associations


    A bidirectional association, such as the authorship association between the classes
    `Book` and `Author` in the model shown in [Figure 7.1](#9783110500240_000634.xhtml_b_9783110500325-007_fig_001)
    above, is replaced with a pair of mutually inverse reference properties, such
    as `Book::authors` and `Author::authoredBooks`. Since both reference properties
    represent the same information (the same set of binary relationships), it’s an
    option to consider one of them being the “master” and the other one the “slave”,
    which is derived from the master. We discuss the two cases of a one-to-one and
    a many-to-many association.


    1. In the case of a bidirectional one-to-one association, this leads to a pair
    of mutually inverse single-valued reference properties, one in each of the two
    associated classes. Since both of them represent essentially the same information
    (the same collection of links/relationships), one has to choose which of them
    is considered the master property, such that the other one is the slave property,
    which is derived from the master property by inversion. In the class diagram,
    the slave property is designated as a *derived property* that is automatically
    updated whenever 1) a new master object is created, 2) the master reference property
    is updated, or 3) a master object is destroyed. This transformation is illustrated
    in [Figure 7.2](#9783110500240_000634.xhtml_b_9783110500325-007_fig_002).


    ![](graphic/converted/b_9783110500325-007_fig_002.png)


    Figure 7.2: Turn a bidirectional one-to-one association into a master-slave pair
    of mutually inverse single-valued reference properties.


    1. A bidirectional many-to-many association is mapped to a pair of mutually inverse
    multi-valued reference properties, one in each of the two classes participating
    in the association. Again, in one of the two classes, the multi-valued reference
    property representing the (inverse) association is designated as a *derived property*
    that is automatically updated whenever the corresponding property in the other
    class (where the association is maintained) is updated. This transformation is
    illustrated in [Figure 7.3](#9783110500240_000634.xhtml_b_9783110500325-007_fig_003).


    ![](graphic/converted/b_9783110500325-007_fig_003.png)


    Figure 7.3: Turn a bidirectional many-to-many association into a master-slave
    pair of mutually inverse multi-valued reference properties.


    ### 7.2.4 The Resulting OO Class Model


    After replacing both bidirectional associations with reference properties, we
    obtain the OO class model shown in 7.4.


    ![](graphic/converted/b_9783110500325-007_fig_004.png)


    Figure 7.4: The OO class model with two pairs of mutually inverse reference properties.


    Since books are entities that existentially depend on authors and possibly on
    publishers, and not the other way around, it’s natural to maintain the master
    references in book objects, and consider the inverse references in publisher and
    author objects as derived (or ‘slave’) data. Therefore, we define `publishedBooks`
    and `authoredBooks` as derived inverse reference properties, which is indicated
    by their slash prefix in the OO class model.


    The meaning of this OO class model can be illustrated by a sample data population
    for the three model classes involved:


    | Publisher |

    | --- |

    | Name | Address | Published books |

    | --- | --- | --- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |


    | Book |

    | --- |

    | ISBN | Title | Year | Authors | Publisher |

    | --- | --- | --- | --- | --- |

    | 0553345842 | The Mind’s I | 1982 | 1, 2 | Bantam Books |

    | 1463794762 | The Critique of Pure Reason | 2011 | 3 |  |

    | 1928565379 | The Critique of Practical Reason | 2009 | 3 |  |

    | 0465030793 | I Am A Strange Loop | 2000 | 2 | Basic Books |


    | Author |

    | --- |

    | Author ID | Name | Authored books |

    | --- | --- | --- |

    | 1 | Daniel Dennett | 0553345842 |

    | 2 | Douglas Hofstadter | 0553345842, 0465030793 |

    | 3 | Immanuel Kant | 1463794762, 1928565379 |


    Notice how Book records reference Author records, and vice versa, Author records
    reference Book records.


    ## 8 Implementing Bidirectional Associations with Plain JS


    In this chapter, we show


    1. how to derive a JS model from an OO class model with ***derived inverse properties***,

    2. how to code the JS model in the form of JavaScript classes,

    3. how to write the view and controller code based on the model.


    ### 8.1 Make a JavaScript Model


    The starting point for making our JS model is an OO class model with derived inverse
    properties, which we present here, for convenience:


    ![](graphic/converted/b_9783110500325-008_ingr_001.png)


    Notice that the model contains two derived inverse properties: `Publisher::publishedBooks`
    and `Author::authoredBooks`. Each of them is linked to a master property, from
    which it is derived. Consequently, each of them represents a pair of mutually
    inverse properties corresponding to a bidirectional association.


    Compared to making JS models with unidirectional associations, the only new issue
    is:


    1. Add a «get» stereotype to all derived inverse properties, implying that they
    have an implicit getter, but no setter. They are implicitly set whenever their
    inverse master property is updated.


    Thus, we get the following JavaScript class model:


    ![](graphic/converted/b_9783110500325-008_ingr_002.png)


    ### 8.2 Write the Model Code


    The JS class model can be directly coded for getting the code of the model layer
    of our JavaScript frontend app.


    #### 8.2.1 New Issues


    Compared to the *unidirectional association app*, we have to deal with a number
    of new technical issues:


    1. We define the derived inverse properties, like `Publisher::publishedBooks`,
    without a *check* operation and without a *set* operation.

    2. We also have to take care of maintaining the derived inverse properties by
    maintaining the derived (sets of) inverse references that form the collection
    value of a derived inverse reference property. This requires in particular that


    1. whenever the value of a ***single-valued*** master reference property is ***initialized
    or updated*** with the help of a setter (such as assigning a reference to a Publisher
    instance `p` to `b.publisher` for a Book instance `b`), an inverse reference has
    to be assigned or added to the corresponding value of the derived inverse reference
    property (such as adding `b` to `p.publishedBooks`); when the value of the master
    property is *updated* and the derived inverse reference property is *multi-valued*,
    then the obsolete inverse reference to the previous value of the single-valued
    master reference property has to be deleted.

