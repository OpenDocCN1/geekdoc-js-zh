    \ on a separate line. For this, we implement the pl.m.converter.BookListConverter\
    \ class and we annotate it with **@FacesConverter** as follows:\n\n```\n @FacesConverter(\
    \ value=\"pl.m.converter.BookListConverter\")\npublic class BookListConverter\
    \ implements Converter {\n@Override\npublic Object getAsObject( FacesContext context,\n\
    UIComponent component, String value) {\nreturn null; // this method is not needed\n\
    }\n@Override\npublic String getAsString( FacesContext context,\nUIComponent component,\
    \ Object value) {\nString result = \"\";\nint i=0, n=0;\nif (value == null) {\n\
    return null;\n} else if (value instanceof Set<?>) {\nn = ((Set<Book>) value).size();\n\
    for (Book b : (Set<Book>) value) {\nresult += b.getTitle();\nif (i < n-1) {\n\
    result += \"<br />\";\n}\ni++;\n}\nreturn result;\n}\nreturn null;\n}\n}\n```\n\
    \nThen, we use the converter attribute in the facelet to specify that our converter\
    \ class, e.g., pl.m.converter.BookListConverter, has to be used when the respective\
    \ view component needs to be rendered:\n\n```\n <h:column>\n<f:facet name=\"header\"\
    >Published books</f:facet>\n<h:outputText value=\"#{p.publishedBooks}\" escape=\"\
    false\"\nconverter=\"pl.m.converter.BookListConverter\"/>\n</h:column>\n```\n\n\
    Since the serialization text contains HTML elements, i.e., <br /> to produce HTML\
    \ new lines, we have to specify the **@escape=“false”** attribute, otherwise <\
    \ and > will be replaced with the corresponding &lt; and &gt; entities."
