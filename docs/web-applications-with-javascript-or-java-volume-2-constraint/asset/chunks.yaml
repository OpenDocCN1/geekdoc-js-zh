    \              publisher, publisher_id}) {\n         …\n         // assign object\
    \ reference or ID reference\n        if (publisher || publisher_id)  {\n     \
    \         this.publisher = publisher || publisher_id;\n         }\n         …\n\
    \     }\n     …\n}\n```\n\n注意，记录参数的 `publisher` 字段代表一个 JS 对象引用，而其 `publisher_id`\
    \ 字段代表一个 ID 引用。在 JavaScript 中，我们可以使用析取表达式如 `expr1 || expr2` 来获取第一个表达式的值（如果它已定义且不为\
    \ 0），否则获取第二个表达式的值。在属性设置器（setter）中，我们通过如代码代码所示检查参数的类型来处理产生的歧义：\n\n```javascript\n\
    \ set publisher(p) {\n      var publisher_id = \"\";\n      // p 可以是一个 ID 引用或一个对象引用\n\
    \      publisher_id = (typeof p !==  \"object\") ? p : p.name;\n      …\n    \
    \  this._publisher = Publisher.instances[ publisher_id];\n      …\n}\n```\n\n\
    注意，发布者的名称被用作 ID 引用，因为它是 `Publisher` 类的标准 ID。\n\n## 2.3 构建 JS 类模型\n\n构建 JS 类模型的起点是如图\
    \ 1.10 所示的 OO 类模型。\n\n我们现在展示如何通过四个步骤从该 OO 类模型中推导出 JS 类模型。对于 OO 类模型中的每个类：\n\n1.\
    \  为所有（非派生的）单值属性添加 «get/set» 刻型（stereotype），这意味着它们具有隐式的访问器（getter）和设置器（setter）。记住，在设置器中，会调用相应的检查操作，只有当检查没有检测到任何约束违背时，属性才会被设置。\n\
    \n2.  为每个（非派生的）属性创建一个 `check` 操作，以便为实现`属性约束`（property constraints）提供集中地点。对于标准的\
    \ ID 属性（例如 `Book::isbn`），需要两个或三个检查操作：\n\n    1.  一个基础检查操作，如 `checkIsbn`，用于检查所有语法约束，但不包括`强制性值`（mandatory\
    \ value）和`唯一性`（uniqueness）约束。\n\n    2.  一个标准的 ID 检查操作，如 `checkIsbnAsId`，用于检查标准\
    \ ID 属性隐含的`强制性值`和`唯一性`约束。\n\n    3.  如果其他类有引用所考虑类的引用属性，添加一个 `ID reference` 检查操作，用于检查施加在\
    \ `ID reference`（或外键）属性上的`引用完整性`（referential integrity）约束。例如，由于 `Book::publisher`\
    \ 属性引用了 `Publisher` 对象，我们需要在 `Publisher` 类中一个 `checkNameAsIdRef` 操作。\n\n    对于引用属性（如\
    \ `Book::publisher`），检查操作 `Book.checkPublisher` 必须通过调用 `Publisher.checkNameAsIdRef`\
    \ 来检查隐含的`引用完整性约束`，如果该属性是强制性的，可能还需要检查`强制性值约束`。\n\n3.  添加一个对象序列化函数 `toString()`，用于在错误消息和日志中显示对象的状态。\n\
    \n4.  添加一个对象到存储的转换函数 `toRecord()`，该函数为将模型对象存储为实体表中的行做准备，该行可以通过 `JSON.stringify`\
    \ 序列化为 JSON 字符串，以便可以存储为应用 `localStorage` 数据存储中某个键的值。\n\n这得出了 `Book` 的以下 JS 类模型，其中类级（“静态”）方法用下划线表示：\n\
    \n| ![](img/b_9783110500325-002_ingr_001.png) |\n\n我们还必须对 `Publisher` 类执行类似的转换。这为我们提供了从上述\
    \ OO 类模型派出的完整 JS 类模型，如图 2.1 所示。\n\n![](img/b_9783110500325-002_fig_001.png)\n\n\
    图 2.1：定义 `Book` 和 `Publisher` 类的 JS 类模型。\n\n## 2.4 新问题\n\n与第 1 中讨论的验证和枚举应用相比，我们必须处理许多新的技术问题：\n\
    \n1.  在*模型*代码中，我们现在需要处理`引用属性`（reference properties），它们需要：\n\n    1.  维护`引用完整性`；\n\
    \n    2.  在第 1.2 节中讨论的两种可能的删除策略中选择并实现一种，用于在属性的范围类的 `destroy` 方法中管理相应的对象销毁依赖；\n\
    \n    3.  在序列化函数 `toString()` 和转换函数 `toRecord()` 以及构造器函数中，在内部对象引用和外部 ID 引用之间进行转换。\n\
    \n2.  在*用户界面（“视图”）*代码中，我们现在需要处理：\n\n    1.  在 `Retrieve/List` 用例中显示有关关联对象的信息；\n\
    \n    2.  允许从关联目标类的所有现有实例列表中选择一个对象，并将其添加到或从列表中移除，在 `Create` 和 `Update` 用例中。\n\n\
    ## 2.5 代码实现模型\n\nJS 类模型可以直接为应用代码。\n\n### 2.5.1 总结\n\n将 JS 模型中的每个类实现为 ES6 类：\n\n\
    1.  以类级（“静态”）方法的形式编写属性检查。\n\n2.  为每个单值属性编写指定的访问器和设置器。\n\n3.  编写序列化函数 `toString()`\
    \ 和存储转换函数 `toRecord()`。\n\n4.  在 `destroy` 方法中处理删除依赖。\n\n这些步骤在后续章节](#9783110500240_000634.xhtml_b_9783110500325-002_s_002)中详细讨论。\n\
    \n### 2.5.2 使用 ES6 实现每个模型类\n\nJS 模型中的每个类 `C` 都实现为 ES6 类，具有相同的名称 `C` 和一个带有记录参数的构造函数，为每个（非派生的）属性指定一个字段。这些属性的范围应在注释中。\n\
    \n在构造函数体中，我们将记录参数的字段赋值给属性。这些属性赋值会调用相应的*设置器*方法。\n\n例如，来自 模型的 `Publisher` 类以以下方式实现：\n\
    \n```javascript\n class Publisher {\n     constructor ({name, address}) {\n  \
    \       this.name = name;\n         this.address = address;\n     }\n     …\n\
    }\n```\n\n由于设置器可能会抛出约束违反异常，构造函数以及任何设置器都应该在 `try-catch` 块中调用，其中 `catch` 子负责记录合适的错误消息。\n\
    \n对于每个模型类 `C`，我们定义一个类属性 `C.instances`，代表应用管理的所有 `C` 实例的集合（记录的映射）。该属性初始化为 `{}`。例如，在\
    \ `Publisher` 模型类的情况下，我们定义：\n\n```javascript\n Publisher.instances = {};\n```\n\
    \n来自 JS 类模型的 `Book` 类以类似的方式实现：\n\n```javascript\n class Book {\n     constructor\
    \ ({isbn, title, year, authors, authorIdRefs,\n           publisher, publisher_id})\
    \ {\n       this.isbn = isbn;\n       this.title = title;\n       this.year =\
    \ year;\n       this.authors = authors || authorIdRefs;\n       if (publisher\
    \ || publisher_id) {\n           this.publisher = publisher || publisher_id;\n\
    \       }\n    }\n    …\n}\n```\n\n注意，`Book` 构造器既可以用对象引用 `authors` 和 `publisher`\
    \ 调用，也可以用 ID 引用 `authorIdRefs` 和 `publisher_id` 调用。这种方法使得使用 `Book` 构造器更加灵活且健壮。\n\
    \n"
- fmt: "\n### 2.5.3 Code the Property Checks\n\nTake care that all constraints of\
    \ a property as specified in the JS class model are properly coded in its check\
    \ function, as explained in Chapter 8 of Volume 1\\. Recall that constraint violation\
    \ (or validation error) classes are defined in the file `lib/errorTypes.js`.\n\
    \nFor instance, for the `Publisher.checkName` function we obtain the following\
    \ code:\n\n```js\n class Publisher {\n     …\n     static checkName(n) {\n   \
    \      if (n === undefined) {\n             return new NoConstraintViolation();\
    \ // not mandatory\n         } else {\n             if (typeof n !== \"string\"\
    \ || n.trim() === \"\") {\n                  return new RangeConstraintViolation\
    \ (\n            \"The name must be a non-empty string!\" );\n            } else\
    \ {\n                 return new NoConstraintViolation();\n           }\n    \
    \    }\n    }\n    static checkNameAsId(n) {…}\n    …\n}\n```\n\nNotice that,\
    \ since the name attribute is the standard ID attribute of `Publisher`, we only\
    \ check syntactic constraints in `checkName`, and check the mandatory value and\
    \ uniqueness constraints in `checkNameAsId`, which invokes `checkName`:\n\n```js\n\
    \ static checkNameAsId ( n) {\n     var validationResult = Publisher.checkName(n);\n\
    \     if ((validationResult instanceof NoConstraintViolation)) {\n         if\
    \ (n === undefined) {\n             return new MandatoryValueConstraintViolation\
    \ (\n                 \"A publisher name is required!\");\n          } else if\
    \ (Publisher.instances[n]) {\n             validationResult = new UniquenessConstraintViolation\
    \ (\n                 \"There is already a publisher record with this name!\"\
    );\n          } else {\n             validationResult = new NoConstraintViolation();\n\
    \          }\n      }\n}\n```\n\nIf we have to deal with ID references (foreign\
    \ keys) in other classes, we need to provide a further check function, called\
    \ `checkNameAsIdRef`, for checking the referential integrity constraint:\n\n```js\n\
    \ static checkNameAsIdRef(n) {\n    var validationResult = Publisher.checkName(n);\n\
    \    if ((validationResult instanceof NoConstraintViolation) &&\n            \
    \ n !== undefined) {\n        if (!Publisher.instances [n]) {\n             validationResult\
    \ = new ReferentialIntegrityConstraintViolation (\n                \"There is\
    \ no publisher record with this name!\");\n         }\n     }\n     return validationResult;\n\
    }\n```\n\nThe condition `!Publisher.instances[n]` checks if there is no publisher\
    \ object with the given name `n`, and then creates a `validationResult` object\
    \ as an instance of the exception class `ReferentialIntegrityConstraintViolation`.\
    \ The `Book.checkNameAsIdRef` function is called by the `Book.checkPublisher`\
    \ function:\n\n```js\n class Book {\n     …\n     static checkPublisher( publisher_id)\
    \ {\n          var validationResult = null;\n          if (publisher_id === undefined\
    \ || publisher_id === \"\") {\n               validationResult = new NoConstraintViolation();\
    \ // optional\n          } else {\n               // invoke foreign key constraint\
    \ check\n               validationResult = Publisher.checkNameAsIdRef( publisher_id);\n\
    \         }\n         return validationResult;\n     }\n     …\n}\n```\n\n###\
    \ 2.5.4 Code the Property Setters\n\nIn the setters, the corresponding check function\
    \ is called and the property is only set, if the check does not detect any constraint\
    \ violation. In the case of a reference property, we allow invoking the setter\
    \ either with an object reference or with an ID reference. The resulting ambiguity\
    \ is resolved by testing if the argument provided in the invocation of the setter\
    \ is an object or not. For instance, the publisher setter is coded in the following\
    \ way:\n\n```js\n class Book {\n      …\n      set publisher( p) {\n         \
    \ if (!p) { // unset publisher\n               delete this._publisher;\n     \
    \     } else {\n               // p can be an ID reference or an object reference\n\
    \               const publisher_id = (typeof p !== \"object\") ? p : p.name;\n\
    \               const validationResult = Book.checkPublisher( publisher_id);\n\
    \               if (validationResult instanceof NoConstraintViolation) {\n   \
    \                // create the new publisher reference\n                  this._publisher\
    \ = Publisher.instances[ publisher_id];\n              } else {\n            \
    \     throw validationResult;\n             }\n        }\n     }\n     …\n}\n\
    ```\n\n### 2.5.5 Choose and Implement a Deletion Policy\n\nFor any reference property,\
    \ we have to choose and implement one of the two possible deletion policies discussed\
    \ in [Section 1.2](#9783110500240_000634.xhtml_b_9783110500325-002_s_002) for\
    \ managing the corresponding object destruction dependency in the `destroy` method\
    \ of the property’s range class. In our case, when deleting a publisher record,\
    \ we have to choose between:\n\n1. deleting all records of books published by\
    \ the deleted publisher (*Existential Dependency*);\n2. dropping from all books\
    \ published by the deleted publisher the reference to the deleted publisher (*Existential\
    \ Independence*).\n\nAssuming that books do not existentially depend on their\
    \ publishers, we choose the second option. This is shown in the following code\
    \ of the `Publisher.destroy` method where for all concerned book objects the property\
    \ `book.publisher` is cleared:\n\n```js\n Publisher.destroy = function (name)\
    \ {\n      const publisher = Publisher.instances[name];\n      //delete all references\
    \ to this publisher in book objects\n      for (let key of Object.keys( Book.instances))\
    \ {\n           const book = Book.instances[key];\n          if (book.publisher\
    \ === publisher) {\n          delete book._publisher;  // delete the slot\n  \
    \        console.log(\"Book \" + book.isbn + \" updated.\");\n       }\n     \
    \ }\n      // delete the publisher record\n      delete Publisher.instances[name];\n\
    \      console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\nNotice\
    \ that the deletion of all references to the deleted publisher is performed in\
    \ a sequential scan through all book objects, which may be inefficient when there\
    \ are many of them. It would be much more efficient when each publisher object\
    \ would hold a list of references to all books published by this publisher. Creating\
    \ and maintaining such a list would make the association between books and their\
    \ publisher *bidirectional*.\n\n### 2.5.6 Serialization and Object-to-Storage\
    \ Mapping\n\nIn the case of a reference property, like `Book::publisher`, the\
    \ serialization function `Book::toString()` has to show a human-readable identifier\
    \ of the referenced object, like `this.publisher.name`:\n\n```js\n toString()\
    \ {\n    var bookStr = `Book{ ISBN: ${this.isbn}, title: ${this.title},` +\n \
    \        `year: ${this.year}`;\n     if (this.publisher) bookStr += `, publisher:\
    \ ${this.publisher.name}`;\n     return bookStr + \"}\";\n}\n```\n\nThe object-to-storage\
    \ conversion function `Book::toRecord()` converts typed JS objects with object\
    \ references to corresponding (untyped) record objects with ID references:\n\n\
    ```js\n toRecord() {\n      var rec = {};\n      for (let p of Object.keys( this))\
    \ {\n          // copy only property slots with underscore prefix\n          if\
    \ (p.charAt(0) === \"_\") {\n              switch (p) {\n              case \"\
    _publisher\":\n               // convert object reference to ID reference\n  \
    \                if (this._publisher) rec.publisher_id = this._publisher.name;\n\
    \                  break;\n              default:\n                 // remove\
    \ underscore prefix\n                 rec[p.substr(1)] = this[p];\n          \
    \   }\n         }\n     };\n     return rec;\n}\n```\n\nThe inverse conversion,\
    \ from untyped record objects with ID references to corresponding typed objects\
    \ with object references, is performed by the `Book` constructor, which tolerates\
    \ both ID references and object references as arguments for setting reference\
    \ properties.\n\n### 2.6 Code the View and Controller\n"
