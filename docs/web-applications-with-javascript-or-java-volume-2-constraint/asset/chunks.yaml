    在平台无关的面向对象（OO）类模型完成后，可以针对特定的实现平台，从其推导出一个或多个特定平台的实现模型。特定平台实现模型的类型包括 `JS class models`、`Java
    Entity class models` 和 `SQL table models`。


    特定平台的实现模型仍然可以用 UML 类图的形式表示，但它仅包含可以在所选平台中直接编码的建模元素。因此，对于任何考虑的平台，都需要两个准则：1) 如何制作特定平台的实现模型，2)
    如何对此模型进行编码。


    ### 1.8 在用户界面中渲染引用属性


    在 (CRUD) 数据管理用户界面 (UI) 中，用于数据输入和输出的组件通常对应于应用程序模型类中属性。我们必须区分对应于（各种）`attributes`
    的（各种类型）`input fields`，以及对应于`enumeration attributes` 或引用属性的 `choice widgets`（例如
    `selection lists`）。在 UI 中使用选择器控件而非输入字段来表示引用属性，可以防止用户输入无效的 ID 引用，从而维护了`引用完整性`。


    通常情况下，`单值引用属性`可以渲染为 UI 中的单选列表，无论引用属性范围内填充了多少对象，只需从中选出一个特定的选项即可。如果引用属性范围的基数足够小（例如，不超过
    7 个），那么我们也可以使用 `radio button group` 代替选择列表。


    `多值引用属性`可以渲染为 UI 中的多选列表。然而，当有许多（例如超过 20 个）不同选项可供选择时，HTML 对应的多选控件就没那么好用了，因为其渲染选择的方式在视觉上太分散了。在只有少数（例如不超过
    7 个）选项的特殊情况下，我们也可以使用 `checkbox group` 代替多选列表。但对于在 UI 中列出包含从引用属性范围类中选出的所有关联对象的通用情况，我们需要开发一种特殊的
    UI 组件，允许向已选对象列表添加（并从列表中移除）对象。


    这种`多选组件`由以下部分组成：


    1. 一个包含已选（关联）对象的 HTML 列表元素，每个列表项包含一个用于从选择中移除该对象的推按钮；

    2. 一个单选控件，配合一个按钮，允许从多值引用属性的范围中添加新的关联对象。


    ### 1.9 多值引用属性的集合类型


    默认情况下，非功能性关联端会将目标类的实例集 `set` 关联到源类的任何实例，这意味着对应的多值引用属性的集合值是集合。然而，也存在某些情况，非功能性关联端是有序的（`ordered`），因此对应的多值引用属性的集合值以
    `ordered sets` 的形式存在。


    在下面的示例中，关联端 `publishedBooks` 不是有序的，而关联端 `authors` 是有序的，因为一本书的作者顺序是有意义的。注意，在 UML
    类图中，有序关联端用注释 `{ordered}` 标记。


    ![](img/b_9783110500325-001_ingr_001.png)


    有序关联端不应表示任何基于目标类属性的排序。在我们的示例中，这意味着书籍作者的排序例如不应该代表它们的字母顺序，而应该代表某种无法通过 `Author` 属性获取的信息。事实确实如此，因为它代表了某种意义，而这种意义无法通过任何属性表达的。


    注意，信息设计模型中的有序关联端仅仅是一个方便特性，因为有序关联端始终可以通过向关联的目标类添加一个或多个属性来转换为无序关联端，使得这些属性的值可以用于排序。有序关联端允许使用更简洁的信息模型和更高效的实现，因为不需要借助辅助排序属性来显式地制作排序信息。


    多值引用属性的两种重要集合类型是 `sets` 和 `ordered sets`，而将 `bags`（多集）和 `sequences`（有序多集）作为多值引用属性的集合类型的情况很少。当多值引用属性的集合类型为
    `bag`（或 sequence）时，可以在类图中通过关联关联端或属性修饰符中的注释 `{nonunique}`（或 `{ordered, nonunique}`）来表达。


    但请注意，将 `lists`（如 `JS arrays` 或 Java 接口类型 `List`）作为多值引用属性的范围（无论是有序属性还是无序属性）是相当常见的。


