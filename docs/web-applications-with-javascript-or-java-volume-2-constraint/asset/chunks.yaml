  trans: "\n\n# 献辞\n献我们的家人。\n\n# 前言\n本书分为两卷，展示了如何使用基于模型的方法设计并实现 Web 应用，并使用了 Web 开发中最相关的平台：JavaScript\
    \ 和 Java。Web 应用通过 UML 图形式的信息模型进行设计，并实现为：\n\n本书的重点是关于以下信息管理的通用概念和技术：\n1. 完整性约束与验证\n\
    2. 枚举与属性\n3. 对象类型之间的单向关联和双向关联\n4. 类层次结构中的子类型化与继承。\n\n我们假设读者已经熟悉 HTML 和至少一种面向对象的编程语言，如\
    \ C++、Java、Python 或 C#。此外，我们假设读者对 CSS 有一定的了解，并有兴趣学习更多知识。本书可用于：\n1. 计算机科学或相关专业学生的\
    \ Web 开发课程；\n2. 用于 JavaScript 开发者学习 Java；\n3. 用于 Java 开发者学习 JavaScript；\n4. 用于\
    \ JavaScript 和 Java（以及 PHP/Python/C#）开发者学习：\n    * 使用 JavaScript 或 Java 进行**面向对象\
    \ (OO) 编程**；\n    * 如何使用原生 JavaScript 或 Java 实现基本信息管理概念并构建完整的 Web 应用。\n\n此列表的前两个问题将在第一卷中讨论，后两个问题将在第二卷中讨论。本书附带六个示例应用的完整源代码，你可以从我们的\
    \ Web 服务器运行或下载它们。\n\n# 第一部分：关联 (Associations)\n我们在第一卷中讨论的三个示例应用（`minimal app`、`validation\
    \ app` 和 `enumeration app`）仅限于管理一个对象类型的数据。然而，一个真实的应用程序必须管理多个对象类型的数据，这些类型通常以各种方式相互关联。特别是对象类型之间可能存在\
    \ `associations` 和 `subtype`（继承）关系。处理关联和子类型关系是软件应用工程中的高级问题。它们在教科书中往往没有充分讨论，也没有得到应用开发框架良好的支持。\n\
    \n关联是信息模型的重要元素。软件应用程序必须以适当的方式实现它们，特别是在`model-view-controller` (`MVC`) 架构的 `model`\
    \ 层中。遗憾的是，应用程序开发框架通常对处理关联提供的支持有限。\n\n存在两个重要的区别，它们是相互独立的：\n1. `功能性`与`非功能性`（“多对多”）关联。\n\
    2. `单向`与`双向`关联。\n\n功能性关联对应于数学中的 `function`（函数），而多对多关联对应于数学中的 `relation`（关系）。单向关联对应于\
    \ OO 建模和编程中的引用属性（reference property），而双向关联对应于一对互反的引用属性。\n\n## 1 引用属性与单向关联\n为对象类型或类定义的属性属性，如果其值是引用另一个（或相同）类型对象的\
    \ `references`（引用），则称为 `reference property`（引用属性）。例如，下方图 1.1 所示的 `Committee` 类有一个引用属性\
    \ `chair`，其值是指向 `ClubMember` 类型对象的引用。\n\n对象类型之间的 `association`（关联）对这些类型对象之间的关系进行分类。例如，`Committee`-has`ClubMember`-as-chair\
    \ 关联（在下方图 1.2 所示的类图中用连接线表示）分类了关系 `FinanceCommittee`-has`PeterMiller`-as-chair`、`RecruitmentCommittee`-has`SusanSmith`-as-chair`\
    \ 以及 `AdvisoryCommittee`-has`SarahAnderson`-as-chair`，其中对象 `PeterMiller`、`SusanSmith`\
    \ 和 `SarahAnderson` 类型为 `ClubMember`，而对象 `FinanceCommittee`、`RecruitmentCommittee`\
    \ 和 `AdvisoryCommittee` 类型为 `Committee`。\n\n作为关系集的关联可以表示为如下表：\n\n引用属性对应于关联的一种特殊形式，即\
    \ `unidirectional`（单向）`binary associations`（二元关联）。虽然二元关联通常不需要方向性，但引用属性代表了从属性的域类（定义处）指向其范围类（range\
    \ class）的有向二元关联。\n\n通常情况下，关联是具有两个或多个 `object types`（对象类型）参与的 `relationship types`（关系类型）。两个对象类型之间的关联被称为\
    \ `binary`（二元）。在书中我们只讨论二元关联。为了简单起见，当我们实际上是指“二元关联”时，直接说“关联”。\n\n```\n| *Committee*-has-*ClubMember*-as-chair\
    \ |\n| --- |\n| Finance Committee | Peter Miller |\n| Recruitment Committee |\
    \ Susan Smith |\n| Advisory Committee | Sarah Anderson |\n```\n\n"
- fmt: "\nWhile individual relationships (such as `FinanceCommittee`-`has`-`PeterMiller`-`as-chair`)\
    \ are important information items in business communication and in information\
    \ systems, associations (such as `Committee`-`has`-`ClubMember`-`as-chair`) are\
    \ important elements of *information models*. Consequently, software applications\
    \ have to implement them in a proper way, typically as part of their *model* layer\
    \ within a *model-view-controller* (`MVC` ) architecture. Unfortunately, many\
    \ application development frameworks lack the required support for dealing with\
    \ associations.\n\nIn mathematics, associations have been formalized in an abstract\
    \ way as sets of uniform tuples, called *relations*. In *Entity-Relationship*\
    \ *(ER)* modeling, which is the classical information modeling approach in information\
    \ systems and software engineering, objects are called *entities*, and associations\
    \ are called *relationship types*. The *Unified Modeling Language (UML)* includes\
    \ the *UML Class Diagram* language for information modeling. In UML, object types\
    \ are called *classes*, relationship types are called *associations*, and individual\
    \ relationships are called “links”. These three terminologies are summarized in\
    \ the following table:\n\n| Our preferred term(s) | UML | ER Diagrams | Mathematics\
    \ |\n| --- | --- | --- | --- |\n| object | object | entity | individual |\n| object\
    \ type (class) | class | entity type | unary relation |\n| relationship | link\
    \ | relationship | tuple |\n| association (relationship type) | association |\
    \ relationship type | relation |\n| functional association | | one-to-one, many-to-one\
    \ or one-to-many relationship type | function |\n\nWe first discuss reference\
    \ properties, which implicitly represent unidirectional binary associations in\
    \ an “association-free” class model (a model without any explicit association\
    \ element).\n\n## 1.1 References and Reference Properties\n\nA reference can be\
    \ either *human-readable* or an *internal object reference*. Human-readable references\
    \ refer to identifiers that are used in human communication, such as the unique\
    \ names of astronomical bodies, the ISBN of books and the employee numbers of\
    \ the employees of a company. Internal object references refer to the computer\
    \ memory addresses of `OOP` objects, thus providing an efficient mechanism for\
    \ accessing objects in the main memory of a computer.\n\nSome languages, like\
    \ `SQL` and `XML`, only support human-readable, but not internal references. In\
    \ `SQL`, human-readable references are called *foreign keys*, and the identifiers\
    \ they refer to are called *primary keys*. In `XML`, human-readable references\
    \ are called *ID references* and the corresponding attribute type is `IDREF`.\n\
    \nObjects in an `OO` program can be referenced either with the help of human-readable\
    \ references (such as integer codes) or with internal object references, which\
    \ are preferable for accessing objects efficiently in main memory. Following the\
    \ `XML` terminology, we call human-readable references *ID references*. We follow\
    \ the standard naming convention for ID reference properties where an ID reference\
    \ property defined in a class `A` and referencing objects of class `B` has the\
    \ name `b_id` using the suffix `_id`. When we store persistent objects in the\
    \ form of records or table rows, we need to convert internal object references,\
    \ stored in properties like `publisher`, to ID references, stored in properties\
    \ like `publisher_id`. This conversion is performed as part of the serialization\
    \ of the object by assigning the standard identifier value of the referenced object\
    \ to the ID reference property of the referencing object.\n\nIn `OO` languages,\
    \ a property is defined for an object type, or class, which is its *domain*. The\
    \ values of a property are either *data values* from some datatype, in which case\
    \ the property is called an ***attribute***, or they are *object references* referencing\
    \ an object from some class, in which case the property is called a ***reference\
    \ property***. For instance, the class `Committee` shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ below has an attribute name with range `String`, and a reference property `chair`\
    \ with range `ClubMember`.\n\n![](graphic/converted/b_9783110500325-001_fig_001.png)\n\
    \nFigure 1.1: A committee has a club member as chair expressed by the reference\
    \ property `chair`.\n\nObject-oriented programming languages, such as `JavaScript`,\
    \ `PHP`, `Java` and `C#`, directly support the concept of *reference properties*,\
    \ which are properties whose range is not a *datatype* but a *reference type*,\
    \ or *class*, and whose values are object references to instances of that class.\n\
    \nBy default, the multiplicity of a property is 1, which means that the property\
    \ is ***mandatory*** and ***functional*** (or, in other words, *single-valued*),\
    \ having ***exactly one*** value, like the property `chair` in class `Committee`\
    \ shown in [Figure 1.1.](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ When a functional property is ***optional*** (not mandatory), it has the multiplicity\
    \ 0..1, which means that the property’s minimum cardinality is 0 and its maximum\
    \ cardinality is 1.\n\nA reference property can be either ***single-valued***\
    \ (*functional*) or ***multi-valued*** (*non-functional*). For instance, the reference\
    \ property `Committee::chair` shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ is single-valued, since it assigns a unique club member as chair to a club.\
    \ An example of a *multi-valued* reference property is provided by the property\
    \ `Book::authors` shown in [Figure 1.11](#9783110500240_000634.xhtml_b_9783110500325-001_fig_011)\
    \ below.\n\nNormally, the collection value of a multi-valued reference property\
    \ is a set of references, implying that the order of the references does not matter.\
    \ In certain cases, however, the order matters and, consequently, the collection\
    \ value of such a multi-valued reference property is an ordered set of references,\
    \ typically implemented as a list.\n\n## 1.2 Referential Integrity\n\nReferences\
    \ are important information items in our application’s database. However, they\
    \ are only meaningful, when their *referential integrity* is maintained by the\
    \ app. This requires that for any reference, there is a referenced object in the\
    \ database. Consequently, any reference property `p` with domain class `C` and\
    \ range class `D` comes with a *referential integrity constraint* that has to\
    \ be checked whenever\n\n1. a new object of type `C` is created,\n2. the value\
    \ of `p` is changed for some object of type `C`,\n3. an object of type `D` is\
    \ destroyed.\n\nA referential integrity constraint also implies two *change dependencies*:\n\
    \n1. An ***object creation dependency***: an object with a reference to another\
    \ object can only be created after the referenced object has been created.\n2.\
    \ An ***object destruction dependency***: an object that is referenced by another\
    \ object can only be destroyed after\n    1. the referencing object is destroyed\
    \ first (the `CASCADE` deletion policy),\n    2. the reference in the referencing\
    \ object is either dropped (the `DROP-REFERENCE` deletion policy) or replaced\
    \ by another reference.\n\nFor every reference property in our app’s model classes,\
    \ we have to choose, which of these two possible *deletion policies* applies.\n\
    \nIn certain cases, we may want to relax this strict regime and allow creating\
    \ objects that have non-referencing values for an ID reference property, but we\
    \ do not consider such cases.\n\nTypically, object creation dependencies are managed\
    \ in the user interface by not allowing the user to enter a value of an ID reference\
    \ property, but only to select one from a list of all existing target objects.\n\
    \n## 1.3 Modeling Reference Properties as Unidirectional Associations\n"
  raw: "While individual relationships (such as FinanceCommittee-**has**-PeterMiller-**as-chair**)\
    \ are important information items in business communication and in information\
    \ systems, associations (such as *Committee*-**has**-*ClubMember*-**as-chair**)\
    \ are important elements of *information models*. Consequently, software applications\
    \ have to implement them in a proper way, typically as part of their *model* layer\
    \ within a *model-view-controller* (MVC) architecture. Unfortunately, many application\
    \ development frameworks lack the required support for dealing with associations.\n\
    \nIn mathematics, associations have been formalized in an abstract way as sets\
    \ of uniform tuples, called *relations*. In *Entity-Relationship* *(ER)* modeling,\
    \ which is the classical information modeling approach in information systems\
    \ and software engineering, objects are called *entities*, and associations are\
    \ called *relationship types*. The *Unified Modeling Language (UML)* includes\
    \ the *UML Class Diagram* language for information modeling. In UML, object types\
    \ are called *classes*, relationship types are called *associations*, and individual\
    \ relationships are called “links”. These three terminologies are summarized in\
    \ the following table:\n\n| Our preferred term(s) | UML | ER Diagrams | Mathematics\
    \ |\n\n| --- | --- | --- | --- |\n\n| object | object | entity | individual |\n\
    \n| object type (class) | class | entity type | unary relation |\n\n| relationship\
    \ | link | relationship | tuple |\n\n| association (relationship type) | association\
    \ | relationship type | relation |\n\n| functional association |  | one-to-one,\
    \ many-to-one or one-to-many relationship type | function |\n\nWe first discuss\
    \ reference properties, which implicitly represent unidirectional binary associations\
    \ in an “association-free” class model (a model without any explicit association\
    \ element).\n\n### 1.1 References and Reference Properties\n\nA reference can\
    \ be either *human-readable* or an *internal object reference*. Human-readable\
    \ references refer to identifiers that are used in human communication, such as\
    \ the unique names of astronomical bodies, the ISBN of books and the employee\
    \ numbers of the employees of a company. Internal object references refer to the\
    \ computer memory addresses of OOP objects, thus providing an efficient mechanism\
    \ for accessing objects in the main memory of a computer.\n\nSome languages, like\
    \ SQL and XML, only support human-readable, but not internal references. In SQL,\
    \ human-readable references are called *foreign keys*, and the identifiers they\
    \ refer to are called *primary keys*. In XML, human-readable references are called\
    \ *ID references* and the corresponding attribute type is IDREF.\n\nObjects in\
    \ an OO program can be referenced either with the help of human-readable references\
    \ (such as integer codes) or with internal object references, which are preferable\
    \ for accessing objects efficiently in main memory. Following the XML terminology,\
    \ we call human-readable references *ID references*. We follow the standard naming\
    \ convention for ID reference properties where an ID reference property defined\
    \ in a class A and referencing objects of class B has the name b_id using the\
    \ suffix _id. When we store persistent objects in the form of records or table\
    \ rows, we need to convert internal object references, stored in properties like\
    \ publisher, to ID references, stored in properties like publisher_id. This conversion\
    \ is performed as part of the serialization of the object by assigning the standard\
    \ identifier value of the referenced object to the ID reference property of the\
    \ referencing object.\n\nIn OO languages, a property is defined for an object\
    \ type, or class, which is its *domain*. The values of a property are either *data\
    \ values* from some datatype, in which case the property is called an ***attribute***,\
    \ or they are *object references* referencing an object from some class, in which\
    \ case the property is called a ***reference property***. For instance, the class\
    \ Committee shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ below has an attribute name with range String, and a reference property chair\
    \ with range ClubMember.\n\n![](graphic/converted/b_9783110500325-001_fig_001.png)\n\
    \nFigure 1.1: A committee has a club member as chair expressed by the reference\
    \ property chair.\n\nObject-oriented programming languages, such as JavaScript,\
    \ PHP, Java and C#, directly support the concept of *reference properties*, which\
    \ are properties whose range is not a *datatype* but a *reference type*, or *class*,\
    \ and whose values are object references to instances of that class.\n\nBy default,\
    \ the multiplicity of a property is 1, which means that the property is ***mandatory***\
    \ and ***functional*** (or, in other words, *single-valued*), having ***exactly\
    \ one*** value, like the property chair in class Committee shown in [Figure 1.1.](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ When a functional property is ***optional*** (not mandatory), it has the multiplicity\
    \ 0..1, which means that the property’s minimum cardinality is 0 and its maximum\
    \ cardinality is 1.\n\nA reference property can be either ***single-valued***\
    \ (*functional*) or ***multi-valued*** (*non-functional*). For instance, the reference\
    \ property Committee::chair shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)\
    \ is single-valued, since it assigns a unique club member as chair to a club.\
    \ An example of a *multi-valued* reference property is provided by the property\
    \ Book::authors shown in [Figure 1.11](#9783110500240_000634.xhtml_b_9783110500325-001_fig_011)\
    \ below.\n\nNormally, the collection value of a multi-valued reference property\
    \ is a set of references, implying that the order of the references does not matter.\
    \ In certain cases, however, the order matters and, consequently, the collection\
    \ value of such a multi-valued reference property is an ordered set of references,\
    \ typically implemented as a list.\n\n### 1.2 Referential Integrity\n\nReferences\
    \ are important information items in our application’s database. However, they\
    \ are only meaningful, when their *referential integrity* is maintained by the\
    \ app. This requires that for any reference, there is a referenced object in the\
    \ database. Consequently, any reference property p with domain class C and range\
    \ class D comes with a *referential integrity constraint* that has to be checked\
    \ whenever\n\n1.  a new object of type C is created,\n\n2.  the value of p is\
    \ changed for some object of type C,\n\n3.  an object of type D is destroyed.\n\
    \nA referential integrity constraint also implies two *change dependencies*:\n\
    \n1.  An ***object creation dependency***: an object with a reference to another\
    \ object can only be created after the referenced object has been created.\n\n\
    2.  An ***object destruction dependency***: an object that is referenced by another\
    \ object can only be destroyed after\n\n    1.  the referencing object is destroyed\
    \ first (the CASCADE deletion policy), or\n\n    2.  the reference in the referencing\
    \ object is either dropped (the DROP-REFERENCE deletion policy) or replaced by\
    \ another reference.\n\n        For every reference property in our app’s model\
    \ classes, we have to choose, which of these two possible *deletion policies*\
    \ applies.\n\nIn certain cases, we may want to relax this strict regime and allow\
    \ creating objects that have non-referencing values for an ID reference property,\
    \ but we do not consider such cases.\n\nTypically, object creation dependencies\
    \ are managed in the user interface by not allowing the user to enter a value\
    \ of an ID reference property, but only to select one from a list of all existing\
    \ target objects.\n\n### 1.3 Modeling Reference Properties as Unidirectional Associations"
