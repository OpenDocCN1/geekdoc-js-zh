- fmt: "\n# 13. Subtyping with Plain JS\n\nIn this chapter, we first explain the general\
    \ approach to constructor-based subtyping in JavaScript before presenting two\
    \ case studies based on fragments of our example, the *Public Library*, shown\
    \ above.\n\n## 12. Table Class Inheritance (TCI) (Note: The provided text for\
    \ TCI appears to be a continuation of a previous section)\n\n**Pros** of the TCI\
    \ approach:\n(1) The structure of the given class hierarchy in terms of its elements\
    \ (classes) is explicitly preserved.\n(2) When the segmentations of the given\
    \ class hierarchy are disjoint, TCI leads to memory-efficient non-redundant storage.\n\
    \n**Cons**:\n(1) The TCI approach does not yield a faithful representation of\
    \ the subtype relationships expressed in the original class hierarchy. In particular,\
    \ for any row representing a subclass instance (an employee, manager or author)\
    \ there is no information that it represents a superclass instance (a person).\
    \ Thus, the TCI database schema does not inform about the represented subtype\
    \ relationships; rather, this meta-information, which is kept in the app’s class\
    \ model, is de-coupled from the database.\n(2) The TCI approach requires repeating\
    \ column definitions, which is a form of schema redundancy.\n(3) The TCI approach\
    \ may imply data redundancy whenever the segment subclasses overlap. In our example,\
    \ authors can also be employees, so for any person in the overlap, we would need\
    \ to duplicate the data storage for all columns representing properties of the\
    \ superclass (in our example, this only concerns the property name).\n\n### 12.7.4.3\
    \ Joined Tables Inheritance\n\nFor avoiding the data redundancy problem of TCI\
    \ in the case of overlapping segmentations, we could take the JTI approach as\
    \ exemplified in the SQL table model shown in [Figure 12.12](#9783110500240_011618.xhtml_b_9783110500325-012_fig_012)\
    \ below. This model connects tables representing subclasses (*subtables*) to tables\
    \ representing their superclasses (*supertables*) by defining their primary key\
    \ column(s) to be at the same time a foreign key referencing their supertable’s\
    \ primary key. Notice that foreign keys are visualized in the form of UML dependency\
    \ arrows stereotyped with «fkey» and annotated at their source table side with\
    \ the name of the foreign key column.\n\n![](graphic/converted/b_9783110500325-012_fig_012.png)\n\
    \nFigure 12.12: A JTI table model representing the Person roles hierarchy.\n\n\
    An example of an admissible population for this model is the following:\n\n| people\
    \ | person_id | name |\n| :--- | :--- | :--- |\n| 1001 | Harry Wagner |\n| 1002\
    \ | Peter Boss |\n| 1003 | Tom Daniels |\n| 1077 | Immanuel Kant |\n\n| authors\
    \ | person_id | biography |\n| :--- | :--- | :--- |\n| 1001 | Born in Boston,\
    \ MA, in 1956, … |\n| 1077 | Immanuel Kant (1724–1804) was a German philosopher\
    \ … |\n\n| employees | person_id | emp_no | |\n| :--- | :--- | :--- | --- |\n\
    | 1001 | 21035 | | |\n| 1002 | 23107 | | |\n\n| managers | person_id | department\
    \ | | |\n| :--- | :--- | :--- | --- |\n| 1002 | Sales | | |\n\n**Pros** of the\
    \ JTI approach:\n(1) Subtyping relationships and the structure of class hierarchies\
    \ are explicitly preserved.\n(2) Data redundancy in the case of overlapping segmentations\
    \ is avoided.\n\n**Cons**:\n(1) The main disadvantage of the JTI approach is that\
    \ for querying a subclass, *join queries* (for joining the segregated entity data)\
    \ are required, which may create performance issues.\n\n### 12.8 Quiz Questions\n\
    \nIf you would like to look up the answers for the following quiz questions, you\
    \ can check our discussion forum. If you don’t find an answer in the forum, you\
    \ may create a post asking for an answer to a particular question.\n\n#### 12.8.1\
    \ Question 1: Statements about a Class Hierarchy\n\nConsider the following class\
    \ model:\n\n![](graphic/converted/b_9783110500325-012_ingr_001.png)\n\nWhich of\
    \ the following statements are true? Select one or more:\n\n1. □ All instances\
    \ of `Cde` have a value for attribute `a1`.\n2. □ The standard identifier of `Cde`\
    \ is `a1`.\n3. □ All instances of `Cde` may have an object reference `ab` referencing\
    \ an object of type `Bcd`.\n4. □ Direct instances of `Abc` may have a value for\
    \ `c`.\n5. □ For any object of type `Abc` the value of `a3` must be greater than\
    \ the value of `a2`.\n6. □ For any object of type `Cde` the value of `a3` must\
    \ be greater than the value of `a2`.\n7. □ The standard identifier of `Cde` is\
    \ `c`.\n\n#### 12.8.2 Question 2: Class Hierarchy Merge\n\nConsider the following\
    \ class model:\n\n![](graphic/converted/b_9783110500325-012_ingr_002.png)\n\n\
    In the case of such a simple class hierarchy, we can use the *Class Hierarchy\
    \ Merge* design pattern where the entire class hierarchy is merged into a single\
    \ class. Which of the following models describes the correct implementation of\
    \ the Class Hierarchy Merge design pattern for the given `Abc` class hierarchy?\
    \ Select one:\n\n1. □ O ![](graphic/converted/b_9783110500325-012_ingr_003.png)\n\
    2. □ O ![](graphic/converted/b_9783110500325-012_ingr_004.png)\n3. □ O ![](graphic/converted/b_9783110500325-012_ingr_005.png)\n\
    4. □ O ![](graphic/converted/b_9783110500325-012_ingr_006.png)\n\n# 13. Subtyping\
    \ with Plain JS\n\nIn this chapter, we first explain the general approach to constructor-based\
    \ subtyping in JavaScript before presenting two case studies based on fragments\
    \ of our example, the *Public Library*, shown above.\n\nIn the first case study,\
