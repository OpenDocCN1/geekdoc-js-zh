  trans: "\n\n多值引用属性（例如 `Book::authors`）允许存储一个指向某种类型对象的内部引用的集合，例如对 `Author` 对象的引用。在创建类型为\
    \ `Book` 的新对象时，构造函数需要一个参数来为该属性提供合适的值。通常情况下，这个值可以是内部对象引用的集合，也可以 ID 引用的集合。使用 `JPA`，我们使用对象引用：\n\
    \n```\n @Entity @Table ( name=\"books\")\n@ManagedBean ( name=\"book\")\n@ViewScoped\n\
    public class Book {\n       …\n       private Set<Author> authors;\n\n       public\
    \ Book() { // JPA @Entity 注解所要求的！】\n       public Book( String isbn, String title,\
    \ Integer year,\n                    Publisher publisher, Set<Author> authors)\
    \ {…}\n\n       public Set<Author> getAuthors() { return this.authors;}\n    \
    \   public void setAuthors( Set<Author> authors) { this.authors = authors;}\n\
    \      …\n}\n```\n\n### 5.2 创建 Java 实体类模型\n\n我们创建 Java 实体类模型的起点是以下面向对象（OO）类模型：\n\
    \n![](img/b_9783110500325-005_ingr_001.png)\n\n该模型除了包含单值引用属性 `Book::publisher`（表示单向多对一关联\
    \ `Book`-`拥有`-`Publisher`）外，还包含了多值引用属性 `Book::authors`（表示单向多对多关联 `Book`-`拥有`-`Author`）。\n\
    \n请记住，我们通过以下方式从 OO 类模型中的对应类获取 Java 实体类（如 `Author`）：(1) 将所有属性设为私有，(2) 使用 Java 数据类型类，(3)\
    \ 添加公共的 getter 和 setter，(4) 添加 `toString` 函数，(5) 添加创建、检索、更新和删除的数据存储方法：\n\n![](img/b_9783110500325-005_ingr_002.png)\n\
    \n在 Java 实体类模型中，OO 类模型中指定的任何引用属性都用其所表示的关联功能类型进行注解。在我们的示例中，我们在实体类 `Book` 的引用属性\
    \ `authors` 上标注了 `manyToMany`：\n\n![](img/b_9783110500325-005_ingr_003.png)\n\n\
    ### 5.3 新问题\n\n与上一节讨论的单向功能性关联相比，我们必须处理以下新的技术问题：\n\n1. 在*模型类*中，我们现在必须处理`多值引用属性`，这些属性必须被注解为\
    \ `@OneToMany` 或 `@ManyToMany`。\n2. 在*用户界面*代码中，我们现在必须处理：：\n    1. 在`检索/列出所有对象`用例中，在视图表列中显示渲染多值引用属性的关联对象集合的信息；\n\
    \    2. 在`创建对象`和`更新对象`用例中，允许从目标类所有现有实例的列表中选择关联对象集合。\n\n最后一个问题，即允许从某个类的所有现有实例列表中选择关联对象集合，通常无法通过\
    \ HTML select multiple 表单元素来解决，因为存在易用性问题。每当可选选项集超过某个阈值（由无需滚动即可在屏幕上显示的选项数量定义），HTML\
    \ select multiple 元素就不再可用，必须使用替代的*多选小部件*。\n\n### 5.4 编写模型代码\n\n可以直接对 Java 实体类模型进行编码，以实现我们\
    \ Java 后端应用的模型层。\n\n#### 5.4.1 总结\n\n1. 将 Java 实体类模型的每个类编码为相应的实体类。\n2. 使用 JPA\
    \ 属性注解 `@Id` 编码任何 `{id}` 属性修符。\n3. 将表示引用属性功能类型的修符（如 `{manyToOne}`）对应相应的 JPA 注解，例如\
    \ `@ManyToOne`。\n4. 使用 Java Bean Validation 注解（或自定义校验注解）对模型中指定的完整约束进行编码。\n5. 为多值属性编写\
    \ getter 和 setter 以及 `add` 和 `remove` 方法。\n6. 将创建、检索、更新和删除存储管理操作编码为类方法。\n\n这些步骤将在接后的章节中进行详细讨论。\n\
    \n#### 5.4.2 编码 Java 实体类模型中的每个类\n\n对于多值引用属性 `Book::authors`，我们使用参数化的 `Set` 类型：\n\
    \n```\n @Entity @Table ( name=\"books\")\n@ViewScoped @ManagedBean ( name=\"book\"\
    )\npublic class Book {\n     …\n     @ManyToMany ( fetch=FetchType.EAGER)\n  \
    \   private Set<Author> authors;\n\n     public Book() {}\n     public Book( String\
    \ isbn, String title, Integer year,\n            Publisher publisher, Set<Author>\
    \ authors) {…}\n     …\n     public Set<Author> getAuthors() { return this.authors;}\n\
    \     public void setAuthors( Set<Author> authors) { this.authors=authors;}\n\
    \     …\n}\n```\n\nJPA 注解 `@ManyToMany` 允许指定 `Book` 和 `Author` 之间的`多对多`关系。使用了注解参数\
    \ `FetchType.EAGER`，因此当创建 `Book` 实例时，作者列表将填充相应的的 `Author` 实例。由于该注解，会创建一个 `Book`\
    \ 和 `Author` 之间的关系表，生成的 SQL 代码如下：\n\n```\n CREATE TABLE IF NOT EXISTS `books_author`\
    \ (\n    `Book_ISBN` varchar(10) NOT NULL,\n    `authors_PERSONID` int(11) NOT\
    \ NULL\n  );\n```\n\n生成的类名是对应表名的下划线连接（例如 `books_author`）。使用两个表的主键列来实现该关系。对应的列名如下：\n\
    \n* 对于对应带有 `@ManyToMany` 注解的类（例如 `Book`），使用类名以及主键列名（例如 `Book_ISBN`）。\n* 对于另一个表（例如\
    \ `authors`），使用表名连接主键列名（例如 `authors_PERSONID`）。\n\n可以使用 `@JoinTable` 注解来控制这些参数，即表名和关系列名。为了获取自定义名称的关系表（例如\
    \ `books_authors`）以及相应的自定义名称列（例如 `book_isbn` 和 `author_personid`），可以使用：\n\n```\n\
    \ @JoinTable( name=\"books_authors\",\n      joinColumns = {@JoinColumn( name=\"\
    book_isbn\", \n      referencedColumnName=\"ISBN\")},\n      inverseJoinColumns\
    \ = {@JoinColumn( name=\"author_personid\",\n                                \
    \           referencedColumnName=\"PERSONID\")\n```\n\n在我们的应用程序中，保持默认设置，因此没有使用\
    \ `@JoinTable` 注解。\n\n相应的 `Author` 类带有适当的注解作为 Java 实体类：\n\n```\n @Entity @Table\
    \ ( name=\"author\")\n@ManagedBean ( name=\"author\") @ViewScoped\npublic class\
    \ Author {\n     // 属性\n     @Id @PositiveInteger\n     private Integer personId;\n\
    \     @Column ( nullable=false)\n     @NotNull ( message=\"名称是必须!\")\n     private\
    \ String name;\n     @Column ( nullable=false)\n     @NotNull ( message=\"出生日期是必须!\"\
    )\n     @Past private Date dateOfBirth;\n     @Past private Date dateOfDeath;\n\
    \     // 构造函数\n     …\n    // Setters/getters\n    …\n    // 数据管理操作\n    …\n}\n\
    ```\n\n除了定义属性外，实体类还需要定义构造函数、setter/getter 以及数据管理操作：\n\n"
- fmt: "\n```\n @Entity @Table( name=\"author\")\n@ManagedBean( name=\"author\") @ViewScoped\n\
    public class Author {\n      // Properties\n     …\n     // Constructors\n   \
    \  public Author() {}\n     public Author( Integer personId, String name,\n  \
    \          Date dateOfBirth, Date dateOfDeath) {…}\n     // Setters/getters\n\
    \     …\n     // Data management operations\n     public static void create( EntityManager\
    \ em, UserTransaction ut,\n            Integer personId, String name, Date dateOfBirth,\n\
    \            Date dateOfDeath) {…}\n     public static void update(…) {…}\n  \
    \   public static void delete(…) {…}\n}\n```\n\n### 5.4.3 Implement a Deletion\
    \ Policy\n\nFor the reference property `Book::authors`, we have to implement a\
    \ deletion policy in the `delete` method of the `Author` class. If we just try\
    \ to delete an author, and the author is referenced by any of the book records,\
    \ then an integrity constraint violation exception is raised, and the author cannot\
    \ be deleted. We have two possiblitities for dealing with this situation:\n\n\
    1. delete all books (co-)authored by the deleted author;\n2. drop from all books\
    \ (co-)authored by the deleted author the reference to the deleted author.\n\n\
    We go for the second option. This is shown in the following code of the `Author.delete`\
    \ method:\n\n```\n public static void delete( EntityManager em, UserTransaction\
    \ ut,\n           Integer personId) throws Exception {\n      ut.begin();\n  \
    \    Author author = em.find( Author.class, personId);\n      // Find all books\
    \ of this author\n      Query query = em.createQuery( \"SELECT DISTINCT b FROM\
    \ Book b \"+\n           \"INNER JOIN b.authors a WHERE a.personId = :personId\"\
    );\n      query.setParameter( \"personId\", personId);\n      List<Book> books\
    \ = query.getResultList();\n      // Remove the author reference from the books'\
    \ authors list\n      for (Book b : books) {\n             b.getAuthors().remove(\
    \ author);\n  }\n      // Delete the author record (table row)\n      em.remove(\
    \ author);\n      ut.commit();\n  }\n```\n\nEssentially, the delete operation\
    \ consists of three steps:\n\n1. Create a JPQL query which selects all books of\
    \ this author (since this is a unidirectional association from books to authors,\
    \ the books of an author are not directly accessible from an author).\n2. For\
    \ every found book referencing this author, we have to remove the author reference\
    \ from its authors list.\n3. Finally, delete the author record.\n\n### 5.4.4 Serialization\
    \ and De-Serialization\n\nIn Java EE, the serialization from objects to corresponding\
    \ database records as well as the de-serialization from database records to objects\
    \ are performed automatically by the Java EE execution environment based on JPA\
    \ annotations and converter classes for custom conversions.\n\n### 5.5 Write the\
    \ User Interface Code\n\n#### 5.5.1 Show Information About Associated Objects\
    \ in Retrieve/List All\n\nFor showing information about the authors of a book\
    \ in the `retrieve/list all books` use case, the corresponding cell in the HTML\
    \ table has to be filled with a list of the names of all authorss. For this, we\
    \ implement a method in the `Book` class which returns the serialized list of\
    \ author names (in the form, `authorName_1, authorName_2, …, authorName_n`):\n\
    \n```\n public String getAuthorNames() {\n    String result = \"\";\n    int i\
    \ = 0, n = 0;\n    if ( this.authors != null) {\n         n = this.authors.size();\n\
    \         for ( Author author : this.authors) {\n             result += author.getName();\n\
    \             if ( i< n - 1) {\n                  result +=\", \";\n         \
    \    }\n             i++;\n         }\n     }\n     return result;\n  }\n```\n\
    \nIn the view file `retrieveAndListAll.xhtml` in the folder `WebContent/views/books/`,\
    \ this method is invoked in the JSF expression of the “Authors” column:\n\n```\n\
    \ <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n    <ui:define\
    \ name=\"content\">\n        <h:dataTable value=\"#{bookController.books}\" var=\"\
    b\">\n            …\n             <h:column>\n                 <f:facet name=\"\
    header\">Publisher</f:facet>\n                 #{b.publisher.name}\n         \
    \    </h:column>\n             <h:column>\n                 <f:facet name=\"header\"\
    >Authors</f:facet>\n                 #{b.authorNames}\n            </h:column>\n\
    \        </h:dataTable>\n      <h:button value=\"Back\" outcome=\"index\" />\n\
    \    </ui:define>\n  </ui:composition>\n```\n\nRecall that using `b.authorNames`\
    \ results in invoking a method named `getAuthorNames` on the given `b` object.\n\
    \n### 5.5.2 Allow Selecting Associated Objects in Create\n\nFor allowing to select\
    \ multiple authors to be associated with a book in the `create book` use case,\
    \ a multiple selection list (a select element with `multiple=\"multiple”`), as\
    \ shown in the facelet code below, is populated with the instances of the associated\
    \ object type. The following code is part of the `create.xhtml` view file in the\
    \ folder `WebContent/views/books/`:\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n    <ui:define name=\"content\">\n        <h:form id=\"createBookForm\">\n\
    \            <h:panelGrid columns=\"3\">\n             …\n             <h:outputLabel\
    \ for=\"authors\" value=\"Authors:\"/>\n             <h:selectManyListbox id=\"\
    authors\" value=\"#{book.authors}\">\n                 <f:selectItems value=\"\
    #{authorController.authors}\" var=\"a\"\n                         itemLabel=\"\
    #{a.name}\" itemValue=\"#{a}\"/>\n                 <f:converter converterId=\"\
    AuthorConverter\"/>\n             </h:selectManyListbox>\n             <h:message\
    \ for=\"authors\" errorClass=\"error\"/>\n          </h:panelGrid>\n         \
    \ <h:commandButton value=\"Create\" action=\"#{bookController.create(\n      \
    \      book.isbn, book.title, book.year, book.publisher, book.authors)}\"/>\n\
    \        </h:form>\n        <h:button value=\"Back\"  outcome=\"index\" />\n \
    \   </ui:define>\n  </ui:composition>\n```\n\nRemember that we have to add the\
    \ `equals` method for the `Author` model class. In our case, two authors are “one\
