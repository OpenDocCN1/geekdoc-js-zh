    \ 中的子类型\n\n在本章中，我们将根据运行示例——*公共图书馆*（Public Library）应用的信息模型片段介绍两个案例。在第一个案例中，我们考虑了图\
    \ 12.1 所示的根类为 `Book` 的单级类层次结构，这是一个不完全的不相交划分。我们使用*单表继承*（Single Table Inheritance）方法将此类层次结构映射到单个数据库表。\n\
    \n在第二个案例中，我们考虑了图 12.8 所示的由 `Person` 角色 `Employee`、`Manager` 和 `Author` 组成多级类层次结构。我们使用*连接表继承*（Joined\
    \ Table Inheritance）方法将此类层次结构映射到一组通过外键依赖相互关联的数据库表。\n\n在以上两种情况下，我们都展示了：\n\n1. 如何推导出\
    \ Java 实体类模型，\n2. 如何以 Java 实体类的形式编写 Java 实体类模型代码，\n3. 如何基于模型代码编写视图和控制器代码。\n\n\
    ### 14.1 Java 中的子类型\n\nJava 通过其 `extends` 关键字提供了对子类型的内置支持，但它不支持*多重继承*。考虑以下信息设计模型：\n\
    \n![](img/b_9783110500325-014_ingr_001.png)\n\n首先，我们定义超类 `Person`。然后，我们定义子类 `Student`\
    \ 并通过 `extends` 关键字定义它与 `Person` 的子类型关系：\n\n```java\n public class Person {\n\
    \    private String firstName;\n    private String lastName;\n …\n}\npublic class\
    \ Student extends Person {\n    private int studentNo;\n  public Student( String\
    \ first, String last, int studNo) {\n      super( firstName, lastName);\n    \
    \  this.setStudNo( studNo);\n  }\n …\n}\n```\n\n注意，在 `Student` 类中，我们定义了一个包含创建\
    \ `Student` 实例所需的所有参数的构造函数。在这个子类构造中，我们使用 `super` 来调用超类 `Person` 的构造函数。\n\n###\
    \ 14.2 案例 1：使用*单表继承*实现类层次结构\n\n在这个示例中，我们实现了图 12.1 所示的 `Book` 层次结构。Java *实体类模型*是从此设计模型推导而出的。\n\
    \n#### 14.2.1 构建 Java 实体类模型\n\n回想起通过以下方式从 OO 类模型获取 Java 实体类模型：\n(1) 将所有属性设为私有，\n\
    (2) 使用 Java 数据类型类，\n(3) 添加 getter 和 setter 方法，\n(4) 添加 `toString` 函数，\n(5) 添加\
    \ `create`、`retrieve`、`update` 和 `delete` 等数据存储方法。\n\n![](img/b_9783110500325-014_fig_001.png)\n\
    \n图 14.1：类层次结构的 Java 类模型\n\n#### 14.2.2 新问题\n\n我们需要处理若干问题：\n\n1. 在*模型代码*中，我们需要关注：\n\
    \    a. 编码 UI 代码使用的枚举类型（`BookCategoryEL`）。\n    b. 使用适当的 JPA 注解对类层次结构进行编码。\n\n\
    2. 在*UI 代码*中，我们需要关注：\n    a. 在“检索所有书籍”用例的表格 `retrieveAll.xhtml`（位于 `WebContent/views/books/`）中添加“特殊类型”列。没有特殊类别的书籍单元格将为空，而其他书籍的类别将在单元格中显示。\n\
    \    b. 在“创建书籍”和“更新书籍”用例的表单 `create.xhtml` 和 `update.xhtml`（位于 `WebContent/views/books/`）中添加“特殊类型”选择控件以及所有段属性的表单字段。只有在选择了相应的书籍类别后，段属性表单才会显示并对其进行验证。这种根据特定条件渲染特定表单的方法被称为*动态表单*（dynamic\
    \ forms）。\n\n#### 14.2.3 编写实体类模型的类\n\n可以直接编码实体类模型的类以获取我们 Java EE 后端的类代码。\n\n######\
    \ 14.2.3.1 总结\n\n1. 编码枚举类型（用于 facelets）。\n2. 编码模型类并添加类层次结构相应的 JPA 注解。\n\n这些步骤将在后续章节中详细讨论。\n\
    \n###### 14.2.3.2 编码枚举类型 BookCategoryEL\n\n枚举类型 `BookCategoryEL` 被编码为 Java 枚举，提供了枚举字面量以及（可读的）标签：\n\
    \n```java\n public enum BookCategoryEL {\n    TEXTBOOK(\"TextBook\"), BIOGRAPHY(\"\
    Biography\");\n    private final String label;\n\n    private BookCategoryEL(\
    \ String label) {\n        this.label = label;\n    }\n    public String getLabel()\
    \ {return this.label;}\n}\n```\n\n###### 14.2.3.2.1 编码模型类\n\n我们使用适当的 JPA 注解以 Java\
    \ 实体类的形式编码 `Book`、`TextBook` 和 `Biography` 模型类。\n\n"
- fmt: "\n```\n @Entity @Table( name=\"books\")\n@Inheritance( strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn( name=\"category\",\n       discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\n@DiscriminatorValue( value=\"BOOK\")\n@ManagedBean( name=\"book\"\
    ) @ViewScoped\npublic class Book {\n        @Id @Column( length=10)\n        @NotNull(\
    \ message=\"An ISBN is required!\")\n        @Pattern( regexp=\"\\\\b\\\\d{9}(\\\
    \\d|X)\\\\b\",\n                 message=\"The ISBN must be a …!\")\n        private\
    \ String isbn;\n        @Column( nullable=false) @NotNull( message=\"A title is\
    \ required!\")\n        private String title;\n        @Column( nullable=false)\
    \ @NotNull( message=\"A year is required!\")\n        @UpToNextYear\n        \
    \  @Min( value=1459, message=\"The year must not be before 1459!\")\n        \
    \  private Integer year;\n          // constructors, set, get and other methods\n\
    \          …\n}\n```\n\nWhen using the JPA Single Table Inheritance technique\
    \ for a class hierarchy, the `@Inheritance` annotation must be set for the superclass\
    \ (e.g, `Book` in our example). It provides the `strategy` parameter with the\
    \ value `InheritanceType.SINGLE_TABLE`. The `@DiscriminatorColumn` annotation\
    \ specifies the name of the table column storing the values that discriminate\
    \ between different types of subclasses (`TextBook` and `Biography`, in our example).\n\
    \nUnfortunately, we cannot use our `BookCategoryEL` enumeration for defining the\
    \ type of the discriminator column, because Java expressions like `BookCategoryEL.TEXTBOOK.name()`\
    \ are not constant, so a Java compiler exception is thrown. Instead, we use `DiscriminatorType.STRING`.\
    \ The `@DiscriminatorValue` annotation specifies a unique value to be stored in\
    \ the discriminator column of table rows representing an instance of the given\
    \ class.\n\nFurther, we define the subtypes `TextBook` and `Biography`:\n\n```\n\
    \ @Entity @Table( name=\"textbooks\")\n@DiscriminatorValue( value=\"TEXTBOOK\"\
    )\n@ManagedBean( name=\"textBook\") @ViewScoped\npublic class TextBook extends\
    \ Book {\n      @Column( nullable=false) @NotNull(\n              message=\"A\
    \ subject area value is required\")\n      String subjectArea;\n      // constructors,\
    \ set, get and other methods\n     …\n}\n```\n\n`TextBook` and `Biography` are\
    \ subclasses of `Book`, so we define them with `extends Book`. For each subclass,\
    \ we add a `@DiscriminatorValue` annotation with a value from the `BookCategoryEL`\
    \ enumeration.\n\n### 14.2.4 STI Database Schema\n\nAs a result of the annotation\n\
    \n```\n @Inheritance( strategy=InheritanceType.SINGLE_TABLE)\n```\n\nonly one\
    \ database table is used for representing a class hierarchy. This table contains\
    \ the columns corresponding to all the properties of all the classes from the\
    \ hierarchy plus the discriminator column. In our example, the `books` table contains\
    \ the following columns: `isbn`, `title`, `year`, `subjectArea`, `about` and `category`.\
    \ The simplified corresponding SQL-DDL code internally used to generate the `books`\
    \ table for our application is shown below:\n\n```\n CREATE TABLE IF NOT EXISTS\
    \ `books` (\n     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255) NOT\
    \ NULL,\n     `YEAR` int(11) NOT NULL,\n     `SUBJECTAREA` varchar(255) DEFAULT\
    \ NULL,\n     `ABOUT` varchar(255) DEFAULT NULL,\n     `category` varchar(16)\
    \ DEFAULT NULL,\n)\n```\n\n### 14.2.5 Write the View And Controller Code\n\nThe\
    \ user interface (UI) consists of a start page that allows navigating to the data\
    \ management pages (in our example, to `index.xhtml` in the folder `WebContent/views/books/`).\
    \ Such a data management page contains four sections: *retrieve/list all books*,\
    \ *create book*, *update book* and *delete book*.\n\n#### 14.2.5.1 Summary\n\n\
    We have to take care of handling the category discriminator and the `subjectArea`\
    \ and `about` segment properties both in the “List all books” use case as well\
    \ as in the “Create book” and “Update book” use cases by:\n\n1.  Adding a segment\
    \ information column (“Special type”) to the display table of the *Retrieve/List\
    \ All* use case in `retrieveAndListAll.xhtml` in the folder `WebContent/views/books/`.\n\
    2.  Adding a “Special type” select control, and corresponding form fields for\
    \ all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in `create.xhtml` and `update.xhtml` in the folder `WebContent/views/books/`.\
    \ Segment property form fields are only displayed, and their validation occurs\
    \ only when a corresponding book category has been selected.\n\n#### 14.2.5.2\
    \ Add a Segment Information Column in *Retrieve/List All*\n\nWe add a “Special\
    \ type” column to the display table of the “List all books” use case in `books.html`:\n\
    \n```\n <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n    …\n   \
    \ <h:column>\n        <f:facet name=\"header\">Special type</f:facet>\n      \
    \  #{b.getClass().getSimpleName() != 'Book' ?\n              b.getClass().getSimpleName()\
    \ : ''}\n     </h:column>\n</h:dataTable>\n```\n\nA conditional expression is\
    \ used to check if the Java bean class name is `Book`, in which case we don’t\
    \ show it, or if it is something else (e.g. `TextBook` or `Biography`), and then\
    \ it is shown. This expression also shows how you can call/use various Java bean\
    \ methods, not only custom methods.\n\n#### 14.2.5.3 Add a “Special Type” Select\
    \ Control in *Create* and *Update*\n\nIn both use cases, we need to allow selecting\
    \ a special category of book (`textbook` or `biography`) with the help of a select\
    \ control in a `panel grid` element:\n\n```\n <h:panelGrid id=\"bookPanel\" columns=\"\
    3\">\n    …\n    <h:outputText value=\"Special type: \" />\n    <h:selectOneMenu\
    \ id=\"bookType\" value=\"#{viewScope.bookTypeVal}\">\n        <f:selectItem itemLabel=\"\
    ---\"/>\n        <f:selectItems value=\"#{book.typeItems}\" />\n        <f:ajax\
    \ event=\"change\" execute=\"@this\" render=\"textBookPanel biographyBookPanel\
    \ standardBookPanel\"/>\n     </h:selectOneMenu>\n     <h:message for=\"bookType\"\
    \ errorClass=\"error\" />\n</h:panelGrid>\n```\n\nIn the select control, three\
    \ alternative *panel groups* are referenced:\n\n1.  A `standardBookPanel`:\n\n\
    ```\n <h:panelGroup id=\"standardBookPanel\">\n    <h:commandButton value=\"Create\"\
    \n            rendered=\"#{viewScope.bookTypeVal == null}\"\n            action=\"\
    #{bookController.create( book.isbn,\n           book.title, book.year)}\" />\n\
    </h:panelGroup>\n```\n\n2.  A `textBookPanel`:\n\n```\n <h:panelGroup id=\"textBookPanel\"\
    >  \n     <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n \
    \               columns=\"3\">\n          <h:outputText value=\"Subject area:\
    \ \" />\n           <h:inputText id=\"subjectArea\" value=\"#{textBook.subjectArea}\"\
    />\n            <h:message for=\"subjectArea\" errorClass=\"error\" />\n     \
    \  </h:panelGrid>\n        <h:commandButton value=\"Create\"\n               \
    \      rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n                 \
    \     action=\"#{textBookController.create( book.isbn, book.title,\n         \
    \                     book.year, textBook.subjectArea)}\" />\n</h:panelGroup>\n\
    ```\n\n3.  A `biographyBookPanel`:\n\n```\n <h:panelGroup id=\"biographyBookPanel\"\
    >  \n    <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'BIOGRAPHY'}\"\n \
    \             columns=\"3\">\n        <h:outputText value=\"About: \" />\n   \
    \     <h:inputText id=\"about\" value=\"#{biographyBook.about}\"/>\n        <h:message\
    \ for=\"about\" errorClass=\"error\" />\n    </h:panelGrid>\n    <h:commandButton\
    \ value=\"Create\"                        rendered=\"#{viewScope.bookTypeVal ==\
    \ 'BIOGRAPHY'}\"\n                action=\"#{biographyBookController.create( book.isbn,\n\
    \                         book.title, book.year, biographyBook.about)}\" />\n\
    </h:panelGroup>\n```\n\nThere are a few important remarks on the above code:\n\
    \n*   the `h:selectOneMenu` is used to create a single selection list which is\
    \ populated with book titles by using the `getTypeItems()` method of the `Book`\
    \ class. A more detailed explanation is presented in Part 3 enumeration app.\n"
