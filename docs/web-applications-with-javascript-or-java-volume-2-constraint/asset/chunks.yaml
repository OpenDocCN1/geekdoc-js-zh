    \ add/remove 方法也向反向属性（或其集合值）分配/取消（或添加/移除）相应的反向引用，或从从中移除。\n4. 编写序列化函数 `toString()`\
    \ 和对象到存储转换函数 `toRecord()` 的代码。在发布者或作者对象的 `toRecord()` 转换中，不包含派生属性 `publishedBooks`\
