    # Part II: Inheritance in Class Hierarchies


    Whenever an app has to manage the data of a larger number of object types, there
    may be various `subtype` (inheritance) relationships between some of the object
    types. Subtypes and inheritance are important elements of information models.
    Software applications have to implement them in a proper way, typically as part
    of their *model* layer within a *model-view-controller* (MVC) architecture. Unfortunately,
    application development frameworks do often not provide much support for dealing
    with class hierarchies and inheritance.


    ## 12 Subtyping and Inheritance


    The concept of a `subtype`, or `subclass`, is a fundamental concept in natural
    language, mathematics, and informatics. For instance, in English, we say that
    *a bird is an animal*, or the class of all birds is a *subclass* of the class
    of all animals. In linguistics, the noun “bird” is a *hyponym* of the noun “animal”.


    An object type may be specialized by subtypes (for instance, `Bird` is specialized
    by `Parrot`) or generalized by supertypes (for instance, `Bird` and `Mammal` are
    generalized by `Animal`). Specialization and generalization are two sides of the
    same coin.

