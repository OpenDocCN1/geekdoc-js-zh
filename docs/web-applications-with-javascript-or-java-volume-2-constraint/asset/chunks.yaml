    \ Code the Model\n\nThe JS class model can be directly coded for the app.\n\n\
    ### 2.5.1 Summary\n\nCode each class of the JS model as ES2015 class:\n\n1.  Code\
    \ the property checks in the form of class-level (‘static’) methods.\n\n2.  For\
