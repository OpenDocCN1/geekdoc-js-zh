    ;\n}\n};\n```\n\n### 9 Implementing Bidirectional Associations with Java EE\n\n\
    In this chapter, we show:\n\n1. how to derive a Java `Entity class model` from\
    \ an OO class model (that has been derived from an information design model),\n\
    2. how to code the Entity class model in the form of entity classes (representing\
    \ `model classes`), \n3. how to write the view and controller code based on the\
    \ entity classes.\n\n### 9.1 Make a Java Entity Class Model\n\nThe starting point\
    \ for making a Java Entity class model is an OO class model with derived inverse\
    \ reference properties like the one discussed above (in Figure 7.4), which we\
    \ present here again, for convenience: ![](graphic/converted/b_9783110500325-009_ingr_001.png)\n\
    \nNotice that the model contains two derived inverse reference properties: `Publisher::/publishedBooks`\
    \ and `Author::/authoredBooks`. Each of them is linked to a master property, from\
    \ which it is derived, by means of an `inverse-of` constraint. Consequently, each\
    \ of them represents a pair of mutually inverse reference properties corresponding\
    \ to a bidirectional association.\n\nWe now show how to derive a Java Entity class\
    \ model from the OO class model:\n\n1. Turn each class into a `«Java Entity»`\
    \ class, making all properties private.\n2. Replace the platform-independent datatype\
    \ names of the OO class model with corresponding Java classes (`Integer`, `Float`,\
    \ etc.).\n3. Add a `«get/set»` stereotype to all non-derived properties for indicating\
    \ that they need getters and setters.\n4. Add a `«get»` stereotype to all derived\
    \ properties for indicating that they need getters, only.\n5. For any reference\
    \ property, depending on the functionality type of the association represented\
    \ by it, add a corresponding keyword as property modifier. For the given OO class\
    \ model, add the following property modifiers:\n    * `oneToMany` to the derived\
    \ reference property `Publisher::/publishedBooks`,\n    * `manyToOne` to the reference\
    \ property `Book::publisher`\n    * `manyToMany` to the reference property `Book::authors`\n\
    \    * `manyToMany` to the derived reference property `Author::/authoredBooks`\n\
    6. For any derived reference property designated as the inverse of another property,\
    \ replace its `{inverse of … }` property modifier with a corresponding `{mappedBy=“…”}`\
    \ property modifier.\n7. Create the required property constraint check operations.\n\
    8. Create an `add`, and a `remove` operation for each `multi-valued` property.\n\
    \nThis leads to the following Java Entity class model: ![](graphic/converted/b_9783110500325-009_ingr_002.png)\n\
    \n### 9.2 Write the Model Code\n\nThe Java Entity class model can be directly\
    \ coded for getting the model layer code of our Java back-end app.\n\n#### 9.2.1\
    \ New Issues\n\nCompared to the `unidirectional association app` discussed before,\
    \ we have to deal with a number of new technical issues:\n\n1. In the `model code`\
    \ you now have to take care of maintaining the derived inverse reference properties\
    \ by maintaining the derived (sets of) inverse references that form the values\
    \ of a derived inverse reference property. This requires in particular that\n\
    \    1. whenever the value of a `single-valued` master reference property is initialized\
    \ or updated with the help of a setter (such as assigning a reference to an ``Publisher`\
    \ instance `p` to `b.publisher` for a `Book` instance `b`), an inverse reference\
    \ has to be assigned or added to the corresponding value of the derived inverse\
    \ reference property (such as adding `b` to `p.publishedBooks`); when the value\
    \ of the master reference property is updated and the derived inverse reference\
    \ property is `multi-valued`, then the obsolete inverse reference to the previous\
    \ value of the single-valued master reference property has to be deleted.\n"
