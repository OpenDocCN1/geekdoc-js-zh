    \ instance, the `Publisher` class from the JS model is coded in the following\
    \ way:\n\n```javascript\n class Publisher {\n     constructor ({name, address})\
    \ {\n         this.name = name;\n         this.address = address;\n     }\n  \
    \   …\n};\n```\n\nSince the setters may throw constraint violation exceptions,\
    \ the constructor function, and any setter, should be called in a try-catch block\
    \ where the catch clause takes care of logging suitable error messages.\n\nFor\
    \ each model class `C`, we define a class-level property `C.instances` representing\
    \ the collection of all `C` instances managed by the application in the form of\
    \ an entity table (a map of records). This property is initially set to `{}`.\
    \ For instance, in the case of the model class `Publisher`, we define:\n\n```javascript\n\
    \ Publisher.instances = {};\n```\n\nThe `Book` class from the JS class model is\
    \ coded in a similar way:\n\n```javascript\n class Book {\n     constructor ({isbn,\
    \ title, year, authors, authorIdRefs,\n           publisher, publisher_id}) {\n\
    \       this.isbn = isbn;\n       this.title = title;\n       this.year = year;\n\
    \       this.authors = authors || authorIdRefs;\n       if (publisher || publisher_id)\
    \ {\n           this.publisher = publisher || publisher_id;\n       }\n    }\n\
    \    …\n}\n```\n\nNotice that the `Book` constructor can be invoked either with\
    \ object references `authors` and `publisher` or with ID references `authorIdRefs`\
    \ and `publisher_id`. This approach makes using the `Book` constructor more flexible\
    \ and more robust.\n"
