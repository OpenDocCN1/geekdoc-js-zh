    ### 3. Make the association bidirectional by placing ownership dots at both association
    ends, as shown in [Figure 1.5](#9783110500240_000634.xhtml_b_9783110500325-001_fig_005),
    with the meaning that the association is implemented in a redundant manner by
    a pair of mutually inverse reference properties `Committee::chair` and `ClubMember::chairedCommittee`,
    as discussed in Chapter 7.


