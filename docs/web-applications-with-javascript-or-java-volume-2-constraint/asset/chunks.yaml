  trans: "\n\n面向对象编程（OOP）中子类型的最小支持水平（例如 `Java` 和 `C#`提供的）允许在单继承层次结构中定义属性和方法的继承。这可以通过\
    \ `is-instance-of` 谓词进行检查，该谓词允许测试一个类是否是某个对象的直接或间接类型。此外，希望能够通过以下方式检查继承层次结构：\n\n\
    1. 一个预定义的实例级属性，用于获取`对象的直接类型`（如果允许多重分类，则获取其`多个直接类型`）；\n2. 一个预定义的类型级属性，用于获取`类型的直接父类型`（如果允许多继承，则获取其`多个直接父类型`）。\n\
    \nOOP 语言的一个特殊案例是 `JavaScript`，它最初没有用于定义类的显语言元素，仅用于定义构造函数。由于其动态编程的特性，`JavaScript`\
    \ 允许使用各种代码模式来实现类、子类型和继承。在现代 JavaScript 中，从 `ES2015` 开始，定义父类和子类变得非常简单。首先，我们定义一个基类\
    \ `Person`，它包含两个属性 `firstName` 和 `lastName`：\n\n```\n class Person {\n  constructor\
    \ (first, last) {\n //// 分配基类属性\n    this.firstName = first;\n    this.lastName\
    \ = last;\n  }\n}\n```\n\n然后，我们定义一个子类 `Student`，包含一个额外的属性 `studentNo`：\n\n```\n\
    \ class Student extends Person {\n  constructor (first, last, studNo) {\n ////\
    \ 调用父类的构造函数\n    super( first, last);\n //// 分配额外的属性\n    this.studentNo = studNo;\n\
    \  }\n}\n```\n\n注意如何通过 `super( first, last)` 调用父类的构造函数来分配父类属性。\n\n### 12.7.2 使用\
    \ XML Schema 实现子类型和继承\n\n在 `XML Schema` 中，子类型可以通过“扩展”（extending）或“限制”（restricting）现有的复杂类型来定义。扩展复杂类型意味着通过添加元素或属性来`扩展其内涵\
    \ (intension)`，而限制复杂类型意味着通过添加约束来`限制其外 (extension)`。\n\n我们可以通过以下方式扩展 `Person` 来定义复杂类型\
    \ `Person` 和子类型 `Student`：\n\n```\n <xs:complexType name=\"Person\">\n  <xs:attribute\
    \ name=\"firstName\" type=\"xs:string\" />\n  <xs:attribute name=\"lastName\"\
    \ type=\"xs:string\" />\n  <xs:attribute name=\"gender\" type=\"GenderValue\"\
    \ />\n</xs:complexType>\n<xs:complexType name=\"Student\">\n  <xs:extension base=\"\
    Person\">\n    <xs:attribute name=\"studentNo\" type=\"xs:string\" />\n  </xs:extension>\n\
    </xs:complexType>\n```\n\n我们可以通过以下方式限制 `Person` 来定义子类型 `FemalePerson`：\n\n```\n\
    \ <xs:complexType name=\"FemalePerson\">\n  <xs:restriction base=\"Person\">\n\
    \    <xs:attribute name=\"firstName\" type=\"xs:string\" />\n    <xs:attribute\
    \ name=\"lastName\" type=\"xs:string\" />\n    <xs:attribute name=\"gender\" type=\"\
    GenderValue\"\n      use=\"fixed\" value=\"f\" />\n  </xs:restriction>\n</xs:complexType>\n\
    ```\n\n注意，通过将 `gender` 属性的值固定为“f”，我们定义了一个只有 `Person` 的女性实例才能满足的约束。\n\n### 12.7.3\
    \ 使用 OWL 实现子类型和继承\n\n在 Web 本体语言 `OWL` 中，属性定义与类定义分离分离，且属性默认不是单值的，而是多值的。因此，标准属性需要声明为\
    \ `functional`（函数性的）。因此，我们通过以下代码表示 `Person` 是一个拥有属性 `name` 的类：\n\n```\n <owl:Class\
    \ rdf:ID=\"Person\"/>\n<owl:DatatypeProperty rdf:ID=\"name\">\n    <rdfs:domain\
    \ rdf:resource=\"#Person\"/>\n    <rdfs:range rdf:resource=\"xsd:string\"/>\n\
    \    <rdf:type rdf:resource=\"owl:FunctionalProperty\"/>\n</owl:DatatypeProperty>\n\
    ```\n\n`OWL` 允许通过以下方式说明一个类是另一个类的子类：\n\n```\n <owl:Class rdf:ID=\"Student\">\n\
    \     <rdfs:subClassOf rdf:resource=\"#Person\"/>\n</owl:Class>\n<owl:DatatypeProperty\
    \ rdf:ID=\"studentNo\">\n    <rdfs:domain rdf:resource=\"#Student\"/>\n    <rdfs:range\
    \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
    />\n</owl:DatatypeProperty>\n```\n\n为了更好的用性，`OWL` 应该允许在类定义内部定义类的属性，并以函数属性作为默认情况。\n\
    \n### 12.7.4 使用 SQL 数据库表表示类层次结构\n\n标准的 `DBMS` 将信息（对象）存储在表的行中，这些行在经典的 `relational`（关系）数据库系统中被构想为集合论关系。关系型数据库语言\
    \ `SQL` 用于定义、填充、更新和查询此类数据库。但也有更简单的数据存储技术，允许以表行的形式存储数据，但不支持 `SQL`。特别是键值存储系统，例如\
    \ `JavaScript` 的 `Local Storage API`，允许将 `JS 实体表`（实体记录的映射）的序列化存储为与表名（键）关联的字符串值。\n\
    \n虽然在经典版本的 `SQL`（`SQL92`）中不支持子类型和继承，但这种情况在 `SQL99` 中发生了变化。然而，`SQL99` 中与子类型相关的语言元素在某些\
    \ `DBMS` 中得到了实现，例如开源数据库 `PostgreSQL`。因此，为了构建一个可以在各种 `DBMS`（包括较弱的技术如 `MySQL` 和\
    \ `SQLite`）中实现的模型，我们无法使用 `SQL99` 的子类型功能，而必须通过普通表和外键依赖在设计模型中建模继承。这种从类层次结构到关系表（以及反之）的映射是对象关系映射（ORM）框架的任务，例如\
    \ `JPA` 提供者（如 `Hibernate`）、Microsoft 的 `Entity Framework` 或 Rails 框架的 `Active\
    \ Record` 方法。\n\n使用数据库表表示类层次结构本质上有三种替代方法：\n\n1. 单表继承（Single Table Inheritance,\
    \ `STI`）是最简单的方法，整个类层次结构由单表表示，该表包含基类及所有子类的属性列，并以基类的名称命名。\n2. 类表继承（Table per Class\
    \ Inheritance, `TCI`）是一种方法，层次结构中的每个类都由相应的表表示，并包含继承属性的列，因此重复了代表其父类的表的列。\n3. 连接表继承（Joined\
    \ Tables Inheritance, `JTI`）是一种更具逻辑的方法，每个片段子类都由相应的表（子表）表示，通过其主键引用父表的主键与代表其父类的表（父表）连接起来，使得父类的（继承的）属性不作为列出现在子表中。\n\
    \n注意，`STI` 方法与上述讨论的类层次结构合并（Class Hierarchy Merge）设计模式密切相关。\n\n"
