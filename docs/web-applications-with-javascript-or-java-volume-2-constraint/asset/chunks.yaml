  trans: "\n\n请注意，构造函数的参数记录预期包含 `authors` 或 `authorIdRefs` 槽位。JavaScript 表达式 `authors\
    \ || authorIdRefs` 使用逻辑或运算符 `||`，如果存在名为 `authors` 的槽位，则求值为映射 `authors`；否则，求值为数组\
    \ `authorIdRefs`。我们在属性设置器（setter）中通过检查参数的类型来处理产生的歧义，如下代码片段所示：\n\n```\n set authors\
    \ ( a) {\n    this._authors = {};\n    if (Array.isArray(a)) { // IdRefs 数组\n\
    \        for (let idRef of a) {\n           this.addAuthor( idRef);\n        }\n\
    \    } else { // IdRefs 到对象引用的映射\n       for (let idRef of Object.keys( a)) {\n\
    \           this.addAuthor( a[idRef]);\n        }\n    }\n }\n```\n\n在 JS 中，集合值的引用属性可以通过两种方式实现：\n\
    \n1. 使用一个对象引用的数组列表（JS 数组）作为其值；\n2. 使用一个映射作为其值，使得对象的标准 ID 属性值作为键，这些键映射到内部 JS 对象引用。\n\
    \n我们倾向于使用映射来实现 `set-valued` 引用属性，因为它们可以保证每个元素都是唯一的，而在数组中，我们必须防止重复元素。此外，映射中的元素可以很容易被删除（借助\
    \ `delete` 运算符），而在数组的情况下，这需要更多努力。然而，对于实现对应于 `ordered-collection`-值的（或包/序列值的）引用属性的\
    \ `ordered`（或 `nonunique`）关联端，我们使用 JS 数组。\n\n### 3.2 构建 JS 类模型\n\n我们构建 JS 类模型的起点是以下面向对象（OO）类模型：\n\
    \n![](img/b_9783110500325-003_ingr_001.png)\n\n该模型包含了表示单向多一关联 `Book`-`has`-`Publisher`\
    \ 的单值引用属性 `Book::publisher` 之外，包含了表示单向多多关联 `Book`-`has`-`Author` 的多值引用属性 `Book::authors`。\n\
    \n要从 OO 类模型推导出 JS 类模型，我们必须遵循与 2.3 节相同的步骤，此外，我们必须处理多值引用属性，例如 `Book::authors`，对于此类属性，我们：\n\
    \n1. 创建一个类级别的 `check` 操作，例如 `checkAuthor`，它负责检查要添加到属性集合的引用的相应 `referential integrity\
    \ constraint` ；\n2. 创建一个 `add` 操作，例如 `addAuthor`，用于向集合中添加引用；\n3. 创建一个 `remove`\
    \ 操作，例如 `removeAuthor`，用于从集合中移除引用。\n\n这导致了以下 JS 类模型：\n\n![](img/b_9783110500325-003_ingr_002.png)\n\
    \n### 3.3 新问题\n\n与上一章讨论的处理函数式关联相比，我们现在必须处理以下新技术问题：\n\n1. 在 `model` 代码中，我们现在必须处理\
    \ `multi-valued reference properties`，这些属性需要：\n    1. 一个 `add` 和一个 `remove` 方法（例如\
    \ `addAuthor` 和 `removeAuthor`），以及一个用于通过 `add` 方法分配一组对象引用的 `setter` 方法，可能将 ID\
    \ 引用转换为对象引用；如果存在任何约束，这三个方法可能都需要检查 `cardinality constraints`；\n    2. 一个类级别的 `check`\
    \ 操作（例如 `checkAuthor`），它必须调用属性范围类中相应的 `checkAsIdRef` 方法，以检查属性的隐式 `referential\
    \ integrity constraint`；\n    3. 在对象到存储的转换函数 `toRecord` 中将对象引用集合转换为 ID 引用集合。\n\
    \n2. 在 `user interface (“view”)` 代码中，我们现在必须处理：\n    1. 在 `Retrieve/list all` 用例的表格视图属性列中，显示有关一组关联对象的信息；最简单的方法是显示逗号分隔的\
    \ ID 引用列表，并可能结合相应的名称；或者，可以在属性的表格数据单元中渲染 HTML 列表；\n    2. 在 `Create` 和 `Update`\
    \ 用例中，允许从属性范围类所有现有实例的列表中选择一组关联对象。\n\n最后一个问题——即从某些类的所有实例的列表中选择一组关联对象——通常无法通过 HTML\
    \ 多选表单控件来解决，因为其易用性差。每当可选选项集超过某个阈值时（由无需滚动即可在屏幕上显示的选项数量定义），多选元素就不再可用，必须使用替代的 `multiple-choice\
    \ widget`。\n\n### 3.4 建模\n\n请注意，为了简单起见，我们没有在示例应用的代码中包含 JS 类模型中显示的所有约束校验检查代码。\n\
    \n#### 3.4.1 总结\n\n将 JS 类模型中的每个类编码为具有隐式 getter 和 setter 的 ES2015 类：\n\n1. 以类级别（`static`）方法的形式编写属性检查。确保\
    \ JS 类模型中指定的所有属性约束在属性检查中被正确编码。\n2. 对于每个单值属性，编写指定的 getter 和 setter，使得在每个 setter\
    \ 中都调用相应的属性检查，并且只有在未检测到约束违反的情况下设置属性。\n3. **对于每个多值属性，编写其添加和移除操作以及指定的 get/set 操作：**\n\
    \    1. **作为实例级方法编写 add/remove 操作，并调用相应的属性检查。**\n    2. **编写 setter，使其对要分配的每个项调用\
    \ add 操作。**\n4. 编写序列化函数 `toString()` 和对象到存储的转换函数 `toRecord()`。\n5. 在 `destroy`\
    \ 方法中处理删除依赖。\n\n这些步骤将在后续章节中详细讨论。\n\n#### 3.4.2 添加和移除操作\n\n对于多值引用属性 `Book::authors`，我们需要编写\
    \ `addAuthor` 和 `removeAuthor` 操作。这两个操作都接受一个参数，通过 ID 引用（整数或字符串 ID）或对象引用指定作者。`addAuthor`\
    \ 的代码如下：\n\n```\n addAuthor ( a) {\n    // a 可以 ID 引用或对象引用\n   const author_id\
    \ = (typeof a !== \"object\") ? parseInt( a) : a.authorId;\n   const validationResult\
    \ = Book.checkAuthor ( author_id);\n   if (author_id && validationResult instanceof\
    \ NoConstraintViolation) {\n      // 添加新的作者引用\n     let key = String( author_id);\n\
    \     this._authors[key] = Author.instances[key];\n    } else {\n       throw\
    \ validationResult;\n    }\n}\n```\n\n在 `removeAuthor` 方法中，首先检查作者引用，如果没有检测到约束违反，则删除映射\
    \ `this._authors` 中的对应项：\n\n```\n removeAuthor ( a) {\n   // a 可以是 ID 引用或对象引用\n\
    \   const author_id = (typeof a !== \"object\") ?\n           parseInt( a) : a.authorId;\n\
    \   const validationResult = Book.checkAuthor ( author_id);\n   if (validationResult\
    \ instanceof NoConstraintViolation) {\n         // 删除作者引用\n        delete this._authors\
    \ [author_id];\n   } else {\n      throw validationResult;\n   }\n}\n```\n\n为属性\
    \ `Book::authors` 分配 ID 引用数组或对象引用映射，`setAuthors` 方法将借助于 `addAuthor` 逐个添加它们。\n\n"
