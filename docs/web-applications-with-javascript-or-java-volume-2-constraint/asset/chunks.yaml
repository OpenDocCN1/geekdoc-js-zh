    作为部分整体关联的一个示例，我们考虑了教材与其章节之间的关联。通常情况下，`textbook` 的某个章节在不经过修改的情况下是无法在另一本书中重用的（例如，因为它可能会引用该教材的其他部分）。此外，允许存在不属于任何教材的章节也是没有意义的。因此，我们将这种关联建模为**不可分割的组合**（inseparable
    composition），如副本所示。


    ![](img/b_9783110500325-010_ingr_004.png)


    表示不可分割组件类型的对象类（如 `Chapter`）不需要具有标准的标识符属性，因为没有必要独立于其复合对象来引用不可分割的组件对象。为了引用不可分割的组件对象，使用一个复合键，该复合键由复合类型的主键和组件类型的适当（相对唯一）属性组成。例如，一个教材章节是通过教材的
    `ISBN` 和章节的顺序号组合来引用的。


    由于 `Chapter` 对象作为 `Textbook` 对象的不可分割组件，当其 `Textbook` 对象消失时无法继续存在，因此在实现 `Delete
    Textbook` 操作时，我们需要使用 `CASCADE` 删除策略，要求在删除教材的同时删除所有相关的章节。


    不可分割的组件类型不需要自己的 CRUD 数据管理用户界面。相反，其所有的 CRUD 操作都在其复合类型的数据管理用户界面中提供。例如，教材章节的创建、检索、更新和删除都是在管理教材数据的界面中完成的。


    ### 10.2 关联类 (Association Classes)


    关联类（association class）是一种表示关联的类。


    回想一下，在 OO 类模型中，简单关联通过转换为相关对象类的引用属性而被消除了，如第 1.7 节所示。但只要关联具有属性，它就无法被消除，必须在 OO 类模型中转转换为一个类。


    例如，考虑对象类型 `Book` 和 `Person` 之间的关联 `Reservation`，它允许表达诸如“ISBN 为 3627921105 的书被
    ID 为 4701199 的人于 2020-08-22 预订”之类的的事实。由于它有一个属性 `date`，该关联在信息设计模型中被建模为关联类，如类图所示：


    ![](img/b_9783110500325-010_ingr_005.png)


    在 OO 类模型中（这是编写应用模型类的基础），关联类被转换为普通类，并带有引用相关对象类的引用属性。例如，关联类 `Reservation` 被转换为以下
    OO 模型类：


    ![](img/b_9783110500325-010_ingr_006.png)


