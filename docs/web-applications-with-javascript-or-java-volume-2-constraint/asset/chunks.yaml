    \ {…}\n     static checkTitle( t) {…}\n     set title( t) {…}\n     get year()\
    \ {…}\n     static checkYear( y) {…}\n     set year( y) {…}\n     get category()\
    \ {…}\n     static checkCategory( c) {…}\n     set category( c) {…}\n     get\
    \ subjectArea() {…}\n     static checkSubjectArea( sA, cat) {…}\n     set subjectArea(\
    \ s) {…}\n     get about() {…}\n     static checkAbout( a, cat) {…}\n     set\
    \ about( a) {…}\n}\n```\n\nNotice that the constructor function is defined with\
    \ a single record parameter making use of the ES2015 feature of *function parameter\
    \ destructuring*.\n\nWe code the checkCategory and setCategory methods for the\
    \ category attribute in the following way:\n\n```\n static checkCategory( c) {\n\
    \     if (c === undefined || c === \"\") {\n         return new NoConstraintViolation();\
    \ // category is optional\n     } else if (!util.isIntegerOrIntegerString(c) ||\
    \ parseInt(c) < 1 ||\n             parseInt(c) > BookCategoryEL.MAX) {\n     \
    \    return new RangeConstraintViolation(\n                  \"Invalid value for\
    \ category: \"+ c);\n     } else {\n         return new NoConstraintViolation();\n\
    \     }\n};\nset category( c) {\n     var validationResult = null;\n     if (this.category)\
    \ {  // already set/assigned\n         validationResult = new FrozenValueConstraintViolation(\n\
    \                 \"The category cannot be changed!\");\n     } else {\n     \
    \   validationResult = Book.checkCategory( c);\n     }\n     if (validationResult\
    \ instanceof NoConstraintViolation) {\n          this._category = parseInt( c);\n\
    \     } else {\n        throw validationResult;\n     }\n}\n```"
