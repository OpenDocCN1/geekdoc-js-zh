    ### 6.2 为国家分配城市和首都，为组织分配成员


    该项目基于下方所示的信息设计模型。需要对之前作业中的应用程序进行扩展，增加管理 `international organizations`（国际组织）数据的能力（国家作为
    `members`（成员））以及 `cities`（城市）数据（作为 `capitals`（首都）和总部所在地）。这通过添加相应的模型类 `InternationalOrganization`
    和 `City` 以及以下单向关联来实现：


    1. `InternationalOrganization` 与 `Country` 之间的多对多关联，将零或多个国家分配为国际组织的 `members`，以及

    2. `Country` 与 `City` 之间的一对一关联，将恰好一个城市分配为国家的 `capital`（首都），

