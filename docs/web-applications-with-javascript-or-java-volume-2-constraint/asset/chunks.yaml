    We illustrate the use of these approaches with the help of two simple examples.
    The first example is the `Book` class hierarchy, which is shown in [Figure 12.1](#9783110500240_011618.xhtml_b_9783110500325-012_fig_001)
    above. The second example is the class hierarchy of the `Person` roles `Employee`,
    `Manager` and `Author`, shown in the class diagram in [Figure 12.8](#9783110500240_011618.xhtml_b_9783110500325-012_fig_008)
    below.


    ![](graphic/converted/b_9783110500325-012_fig_008.png)


    Figure 12.8: An information design model with a `Person` roles hierarchy.


    ### 12.7.4.1 Single Table Inheritance


    Consider the single-level class hierarchy shown in [Figure 12.1](#9783110500240_011618.xhtml_b_9783110500325-012_fig_001)
    above, which is an incomplete disjoint segmentation of the class `Book`, as the
    design for the model classes of an MVC app. In such a case, whenever we have a
    model class hierarchy with only one level (or only a few levels) of subtyping
    and each subtype has only a few additional properties, it’s preferable to use
    STI, so we model a single table containing columns for all attributes such that
    the columns representing additional attributes of segment subclasses (“segment
    attributes”) are optional, as shown in the SQL table model in [Figure 12.9](#9783110500240_011618.xhtml_b_9783110500325-012_fig_009)
    below.


    ![](graphic/converted/b_9783110500325-012_fig_009.png)


    Figure 12.9: An SQL table model with a single table representing the `Book` class
    hierarchy.


    It is a common approach to add a special `discriminator column` for representing
    the category of each row corresponding to the subclass instantiated by the represented
    object. Such a column would normally be string-valued, but constrained to one
    of the names of the subclasses. If the DBMS supports enumerations, it could also
    be enumeration-valued. We use the name `category` for the discriminator column,
    which, in the case of our `Book` class hierarchy example, has a frozen value constraint
    since the textbook-biography segmentation is rigid.


    Based on the category of a book, we have to enforce that if and only if it is
    “TextBook”, its attribute `subjectArea` has a value, and if and only if it is
    “Biography”, its attribute `about` has a value. This implied constraint is expressed
    in the invariant box attached to the `Book` table class in the class diagram above,
    where the logical operator keyword `IFF` represents the logical equivalence operator
    “if and only if`. It needs to be implemented in the database, e.g., with an SQL
    table `CHECK` clause or with SQL triggers.


    When the given segmentation is disjoint, a single-valued enumeration attribute
    `category` is used for representing the information to which subclass an instance
    belongs. Otherwise, if it is non-disjoint, a multi-valued enumeration attribute
    `categories` is used for representing the information to which subclasses an instance
    belongs. Such an attribute can be implemented in SQL by defining a string-valued
    column for representing a set of enumeration codes or labels as corresponding
    string concatenations.


    Consider the class hierarchy shown in [Figure 12.8](#9783110500240_011618.xhtml_b_9783110500325-012_fig_008)
    above. With only three additional attributes defined in the subclasses `Employee`,
    `Manager` and `Author`, this class hierarchy can again be mapped with the STI
    approach, as shown in the SQL table model [Figure 12.10](#9783110500240_011618.xhtml_b_9783110500325-012_fig_010)
    below.


    ![](graphic/converted/b_9783110500325-012_fig_010.png)


    Figure 12.10: An STI table model representing the `Person` roles hierarchy.


    Notice that now the discriminator column `categories` is multi-valued, since the
    segmentation of `Person` is not disjoint, but overlapping, implying that a `Person`
    object may belong to several categories. Notice also that, since a role segmentation
    (like `Employee`, `Manager`, `Author`) is not rigid, the discriminator column
    `categories` does not have a frozen value constraint.


    An example of an admissible population for this model is the following:


    | people |

    | --- |

    | person_id | name | categories | biography | emp_no | department |

    | --- | --- | --- | --- | --- | --- |

    | 1001 | Harry Wagner | Author, Employee | Born in Boston, MA, in 1956, … | 21035
    | |

    | 1002 | Peter Boss | Manager | | 23107 | Sales |

    | 1003 | Tom Daniels | | | | |

    | 1077 | Immanuel Kant | Author | Immanuel Kant (1724–1804) was a German philosopher
    … | | |


    Notice that the `Person` table contains four different types of people:


    1. A person, Harry Wagner, who is both an author (with a biography) and an employee
    (with an employee number).

    2. A person, Peter Boss, who is a manager (a special type of employee), managing
    the Sales department.

    3. A person, Tom Daniels, who is neither an author nor an employee.

    4. A person, Immanuel Kant, who is an author (with a biography).


    **Pros** of the STI approach: It leads to a faithful representation of the subtype
    relationships expressed in the original class hierarchy; in particular, any row
    representing a subclass instance (an employee, manager or author) also represents
    a superclass instance (a person).


    **Cons**: (1) In the case of a multi-level class hierarchy where the subclasses
    have little in common, the STI approach does not lead to a good representation.
    (2) The structure of the given class hierarchy in terms of its elements (classes)
    is only implicitly.


    ### 12.7.4.2 Table Per Inheritance


    In a more realistic model, the subclasses of `Person` shown in [Figure 12.8](#9783110500240_011618.xhtml_b_9783110500325-012_fig_008)
    above would have many attributes, so the STI approach would be longer feasible.
    In the TCI approach we get the SQL model shown in [Figure 12.11](#9783110500240_011618.xhtml_b_9783110500325-012_fig_011)
    below. A TCI model represents each concrete class of the class hierarchy as a
    table, such that each segment subclass is represented by a table that also contains
    columns for inherited properties, thus repeating the columns of the table that
    represents the superclass.


    ![](graphic/converted/b_9783110500325-012_fig_011.png)


    Figure 12.11: A TCI table model representing the Person roles hierarchy.


    A TCI table model can be derived from the information design model by performing
    the following steps:


    1. Replacing the standard ID property modifier `{id}` in all classes with `{pkey}`
    for indicating that the standard ID is a primary key.

    2. Replacing the singular (capitalized) class names (`Person`, `Author`, etc.)
    with pluralized lowercase table names (`people`, `authors`, etc.), and replacing
    camel case property names (`personId` and `empNo`) with lowercase underscore-separated
    names for columns (`person_id` and `emp_no`).

    3. Adding `«table»` stereotype to all class rectangles.

    4. Replacing the platform-independent datatype names with SQL datatype names.

    5. Dropping all generalization/inheritance arrows and adding all columns of supertables
    (such as `person_id` and `name` from `people`) to their subtables.


    Each table would only be populated with rows corresponding to the direct instances
    of the represented class. An example of an admissible population for this model
    is the following:


    | people |

    | --- |

    | personId | name |

    | --- | --- |

    | 1003 | Tom Daniels |


    | authors |

    | --- |

    | person_id | name | biography |

    | --- | --- | --- |

    | 1001 | Harry Wagner | Born in Boston, MA, in 1956, … |

    | 1077 | Immanuel Kant | Immanuel Kant (1724–1804) was a German philosopher …
    |


    | employees |

    | --- |

    | person_id | name | emp_no |

    | --- | --- | --- |

    | 1001 | Harry Wagner | 21035 |


    | managers |

    | --- |

    | person_id | name | emp_no | department |

    | --- | --- | --- | --- |

    | 1002 | Peter Boss | 23107 | Sales |

    '
