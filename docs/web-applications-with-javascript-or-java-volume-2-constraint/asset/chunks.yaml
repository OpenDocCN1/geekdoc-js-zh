    above) can be modeled in a UML class diagram in the form of an ***association
    end*** owned by its domain class, which is visualized with the help of a small
    filled circle (also called a “dot”). This requires to connect the domain class
    and the range class of the reference property with an association line, place
    an *ownership dot* at the end of this line at the range class side, and annotate
    this association end with the property name and with a multiplicity symbol, as
    shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    below for the case of our example. In this way we get a ***unidirectional association***,
    the ***source*** class of which is the property’s ***domain*** and the ***target***
    class of which is the property’s ***range***.


    The fact that an association end is *owned* by the class at the other end, as
    visually expressed by the *association end ownership dot* at the association end
    chair in the example shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    below, implies that the association end represents a reference property. In the
    example of [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002),
    the represented reference property is Committee::chair having ClubMember as range.
    Such an association, with only one association end ownership dot, is *unidirectional*
    in the sense that it allows `navigation´ (object access) in one direction only:
    from the class at the opposite side of the dot (the *source* class) to the class
    where the dot is placed (the *target* class).


    ![](graphic/converted/b_9783110500325-001_fig_002.png)


    Figure 1.2: An association end with a “dot”.


    Thus, the two diagrams shown in [Figures 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)
    and [1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002) express essentially
    equivalent models. When a reference property, like chair in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001),
    is modeled by an association end with a “dot”, then the property’s multiplicity
    is attached to the association end. Since in a design model, all association ends
    need to have a multiplicity, we also have to define a multiplicity for the other
    end at the side of the Committee class, which represents the inverse of the property.
    This multiplicity (of the inverse property) is not available in the original property
    description in the model shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001),
    so it has to be added according to the intended semantics of the association.
    It can be obtained by answering the question “is it mandatory that any ClubMember
    is the chair of a Committee?” for finding the minimum cardinality and the question
    “can a ClubMember be the chair of more than one Committee?” for finding the maximum
    cardinality.


    When the value of a property is a set of values from its range, the property is
    ***non-functional*** and its multiplicity is either 0..* or n..* where n > 0\.
    Instead of 0..*, which means “neither mandatory nor functional”, we can simply
    write the asterisk symbol *. The association shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    assigns at most one object of type ClubMember as chair to an object of type Committee.
    Consequently, it’s an example of a ***functional association***.


    An overview about the different cases of functionality of an association is provided
    in [Table 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_tab_003).


    Table 1.1:Functionality types.


    | Functionality type | Meaning |


    | --- | --- |


    | one-to-one | both functional and inverse functional |


    | many-to-one | functional |


    | one-to-many | inverse functional |


    | many-to-many | neither functional nor inverse functional |


    Notice that the directionality and the functionality type of an association are
    independent of each other. So, a unidirectional association can be either functional
    (one-to-one or many-to-one), or non-functional (one-to-many or many-to-many).


    ### 1.4 Representing Unidirectional Associations as Reference Properties


    A unidirectional association between a source and a target class can be represented
    as a reference property of the source class. This is illustrated in [Figure 1.3](#9783110500240_000634.xhtml_b_9783110500325-001_fig_003)
    below for two unidirectional associations: a many-to-one and a many-to-many association.


    ![](graphic/converted/b_9783110500325-001_fig_003.png)


    Figure 1.3: Representing unidirectional associations as reference properties.


    Notice that, in a way, we have eliminated the two explicit associations and replaced
    them with corresponding reference properties resulting in a class model that can
    be coded with a classical OOP language in a straightforward way. OOP languages
    do not support associations as first class citizens. They do not have a language
    element for defining associations. Consequently, an OOP class design model, which
    we call ***OO class model***, must not contain any explicit association.


    ### 1.5 Adding Directionality to a Non-Directed Association


    When we make an information model in the form of a UML class diagram, we typically
    end up with a model containing one or more associations that do not have any ownership
    defined for their ends, as, for instance, in [Figure 1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004)
    below. When there is no ownership dot at either end of an association, such as
    in this example, this means that the model does not specify how the association
    is to be represented (or realized) with the help of reference properties. Such
    an association does not have any direction. According to the UML 2.5 specification,
    the ends of such an association are “owned” by itself, and not by any of the classes
    participating in it.


    ![](graphic/converted/b_9783110500325-001_fig_004.png)


    Figure 1.4: A model of a non-directed association between Committee and ClubMember.


    An information design model that contains an association without association end
    ownership dots is acceptable as a *relational database* design model, but it is
    incomplete as a design model for OOP languages.


    For instance, the model of [Figure 1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004)
    provides a relational database design with two entity tables, committees and clubmembers,
    and a separate one-to-one relationship table committee_has_clubmember_as_chair.
    But it does not provide a design for Java classes, since it does not specify how
    the association is to be implemented with the help of reference properties.


    There are three options how to turn an information design model of a non-directed
    association (without any association end ownership dots) into an information design
    model where all associations are either unidirectional or bidirectional: we can
    place an ownership dot at either end or at both ends of the association. Each
    of these three options defines a different way how to represent, or implement,
    the association with the help of reference properties. So, for the association
    shown in [Figure 1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004)
    above, we have the following options:


    1.  Place an ownership dot at the chair association end, leading to the model
    shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    above, which can be transformed into the OO class model shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)
    above.


    2.  Place an ownership dot at the chairedCommittee association end, leading to
    the completed models shown in [Figure 1.8](#9783110500240_000634.xhtml_b_9783110500325-001_fig_003)
    below.'
