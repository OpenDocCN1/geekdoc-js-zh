    ## 2. 通过将其替换为一对互逆的引用属性来**消除双向关联**。


    ### 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为其源类中一个对应的引用属性，该属性的范围（range）为目标类。它的多重性（multiplicity）与目标关联末端的多重性相同。如果关联端有名称，其名称为关联端的名称；否则设置为目标类的名称（如果引用属性是多值的，则可能为复数形式）。


    ### 7.2.3 如何消除双向关联


    双向关联，例如上方图 7.1 所示模型中 `Book` 和 `Author` 类之间的作者关系关联，被替换为一对互逆的引用属性，例如 `Book::authors`
    和 `Author::authoredBooks`。由于这两个引用属性都代表相同的信息（同一组二元关系），可以考虑将其中一个作为“主”属性，另一个作为“从”属性（后者由主属性派生）。我们讨论了一一对一和多对多关联的两种情况。


    1. 在双向一对一关联的情况下，这将导致一对互逆的单值引用属性，在两个关联类中各有一个。由于它们本质上都代表相同的信息（同一组链接/关系集合），必须从中选择一个被视为主属性，使得另一个成为从属性，而该从属性是通过反向反转从主属性派生而来。在类图中，从属性被指定为*派生属性*（*derived
    property*），每当发生以下情况之一时，它都会自动更新：1) 创建了新的主对象，2) 主引用属性被更新，或 3) 主对象被销毁。这种转换转换在图 7.2
    中予以图示。


    ![](img/b_9783110500325-007_fig_002.png)


    图 7.2：将双向一对一关联转换为一对互逆的单值引用属性的主从对。


    1. 双向多对多关联映射为一对互逆的多值引用属性，在参与关联的两个类中各有一个。同样，在两个类中的一个，代表（反向）关联的多值引用属性被指定为*派生属性*（*derived
    property*），每当另一个类（维护关联的类）中的相应属性被更新时，它就会自动更新。这种转换在图 7.3 中予以图示。


    ![](img/b_9783110500325-007_fig_003.png)


    图 7.3：将双向多对多关联转换为一对互逆的多值引用属性的主从对。


    ### 7.2.4 得到的 OO 类模型


    在将两个双向关联替换为引用属性后，我们得到了 7.4 所示的 OO 类模型。


    ![](img/b_9783110500325-007_fig_004.png)


    图 7.4：具有两对互逆引用属性的 OO 类模型。


    由于书籍在存在上依赖于作者并可能依赖于出版社，反之，因此在书籍对象中维护主引用是自然的，并将出版社和作者对象中的反向引用视为派生的（或“从”）数据。因此，我们将
    `publishedBooks` 和 `authoredBooks` 定义为派生的反向引用属性，这在 OO 类模型中通过它们的斜杠前缀指示。


    该 OO 类模型的意义可以通过涉及的三个模型类的示例数据填充来说明：


