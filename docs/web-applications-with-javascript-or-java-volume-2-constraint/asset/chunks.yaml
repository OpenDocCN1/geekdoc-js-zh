  trans: "\n用户界面（UI）由一个起始页 `index.html` 组成，允许导航到数据管理 UI 页面，每个对象类型对应一个（在我们的示例中为 `books.html`\
    \ 和 `publishers.html`）。每个数据管理 UI 页面包含 5 个部分：一个 `Manage` 部分（例如 `Manage books`），带有一个用于选择\
    \ CRUD 用例的菜单；以及每个 CRUD 用例对应一个部分（例如 `Retrieve/list all books`、`Create book`、`Update\
    \ book` 和 `Delete book`），使得任何时候只显示其中一个（例如，通过为其他所有部分设置 CSS 属性 `display:none`）。\n\
    \n### 2.6.1 初始化应用\n\n为了初始化数据管理用例，必须从持久化存储中加载所需的数据（例如，所有的出版者和书籍记录）。这是在一个控制器过程中执行的，例如\
    \ `c/books.js` 中的 `pl.c.books.manage.initialize`，代码如下：\n\n```\n pl.c.books.manage\
    \ = {\n     initialize: function () {\n          Publisher.retrieveAll();\n  \
    \        Book.retrieveAll();\n          pl.v.books.manage.setUpUserInterface ();\n\
    \     }\n};\n```\n\n管理书籍数据的 `initialize` 方法首先加载出版者表和书籍表，因为书籍数据管理 UI 需要显示它们的数据。然后，通过调用\
    \ `setUpUserInterface` 过程渲染书籍数据管理菜单。\n\n### 2.6.2 在“检索/列出所有”中显示关联对象\n\n在我们的示例中，我们只有一个引用属性\
    \ `Book::publisher`，它是功能性的且可选的。为了在 `Retrieve/list all` 用例中显示书籍可选出版者的信息，如果存在出版者，则\
    \ HTML 表格中相应的单元格填充出版者的名称：\n\n```\n pl.v.books.retrieveAndListAll = {\n      setupUserInterface:\
    \ function () {\n           const tableBodyEl = document.querySelector(\n    \
    \                          \"section#Book-R>table>tbody\");\n           tableBodyEl.innerHTML\
    \ = \"\"; // 丢弃旧内容\n           for (let key of Object.keys( Book.instances)) {\n\
    \               const book = Book.instances[key];\n               const row =\
    \ tableBodyEl.insertRow(-1);\n               row.insertCell(-1).textContent =\
    \ book.isbn;\n               row.insertCell(-1).textContent = book.title;\n  \
    \             row.insertCell(-1).textContent = book.year;\n               // 如果书籍有出版者，显示其名称\n\
    \               row.insertCell(-1).textContent =\n                   book.publisher\
    \ ? book.publisher.name : \"\";\n           }\n           document.getElementById(\"\
    Book-M\").style.display = \"none\";\n           document.getElementById(\"Book-R\"\
    ).style.display = \"block\";\n     }\n};\n```\n\n对于多值引用属性，表格单元格必须填充由该属性引用的所有关联对象的列表。\n\
    \n### 2.6.3 在“创建”和“更新”用例中选择关联对象\n\n为了允许在 `Create` 和 `Update` 用例中选择与当前编辑对象关联的对象，一个\
    \ HTML 选择列表（即 `select` 元素）将通过实用方法 `fillSelectWithOptions` 使用由关联对象类型的实例构的 `option`\
    \ 元素进行填充。HTML `select` 元素在 `books.html` 视图文件中定义：\n\n```\n <section id=\"Book-C\"\
    \ class=\"UI-Page\">\n    <h1>公共图书馆：创建新的书籍记录</h1>\n    <form>\n       …\n    \
    \   <div class=\"select-one\">\n          <label>出版者: <select name=\"selectPublisher\"\
    ></select></label>\n       </div>>\n       …\n    </form>\n</section>\n```\n\n\
    `Create` 用户界面通过以下过程设置：\n\n```\n pl.v.books.create = {\n      setupUserInterface:\
    \ function () {\n          const formEl = document.querySelector (\"section#Book-C\
    \ > form\"),\n                selectPublisherEl = formEl.selectPublisher,\n  \
    \              saveButton = formEl.commit;\n          // 添加响应式验证的监听器\n       \
    \   formEl.isbn.addEventListener (\"input\", function () {\n            formEl.isbn.setCustomValidity(\n\
    \                   Book.checkIsbnAsId ( formEl.isbn.value).message);\n      \
    \    });\n         // 设置一个选择出版者的单选列表\n         util.fillSelectWithOptions ( selectPublisherEl,\n\
    \                Publisher.instances, \"name\");\n          // 为提交按钮点击事件定义事件处理器\
    \    \n          saveButton.addEventListener (\"click\",\n          this.handleSaveButtonClickEvent);\n\
    \          // 为中消提交事件定义事件处理器\n          formEl.addEventListener (\"submit\", function\
    \ (e) {\n               e.preventDefault ( );\n               formEl.reset ();\n\
    \          });\n          // 用创建表单替换管理表单\n          document.getElementById (\"\
    Book-M\").style.display = \"none\";\n          document.getElementById (\"Book-C\"\
    ).style.display = \"block\";\n          formEl.reset();\n     },\n     handleSaveButtonClickEvent:\
    \ function () {\n         …\n     }\n};\n```\n\n当用户点击（或触摸）保存按钮时，所有的表单控件值（包括选择控件的值）都会被复制到插列表中，在对所有表单字段进行有效性检查后，该列表将作为调用\
    \ `add` 方法的参数，如下程序列表所示：\n\n```\n handleSaveButtonClickEvent: function () {\n \
    \      const formEl = document.querySelector(\"section#Book-C > form\");\n   \
    \    const slots = {\n             isbn: formEl.value,\n             title: formEl.value,\n\
    \             year: formEl.value,\n             publisher_id: selectPublisher.value\n\
    \       };\n       // 验证并显示错误消息\n       formEl.isbn.setCustomValidity(\n     \
    \  Book.checkIsbnAsId ( slots.isbn).message);\n       /* …（对 title 和 year 执行相同操作）\
    \ */\n       // 仅当表单有效时保存输入\n        if (formEl.checkValidity()) {\n         \
    \    Book.add ( slots);\n        }\n}\n```\n\n`update book` 用例的 `setupUserInterface`\
    \ 代码类似。\n\n### 2.7 题\n\n#### 2.7.1 问题 1：JS 模型\n\n从给定的 OO 模型派生的 Committee 类正确的\
    \ JS 模型是？\n\n选择：\n\n1. [图片]\n2. [图片]\n3. [图片]\n\n## 3 使用原生 JS 实现单向功能关联\n\n单向功能关联是*一对多*或*多对多*。在两种情况下，这种关联都是通过*多值*引用属性辅助表示或实现的。\n\
    \n在本章中，我们将展示：\n\n1.  如何从具有*单向功能关联*的*多值引用属性*的 OO 类模型导出 JS 类模型，\n\n2.  如何以 JavaScript\
    \ 模型类的形式编写 JS 模型，\n\n3.  如何基于模型代码编写视图和控制器代码。\n\n### 3.1 实现多值引用属性\n\n多值引用属性（例如\
    \ `Book::authors` 属性）允许存储某些类型对象的引用集合，例如 `Author` 对象。在创建 `Book` 类型的新对象时，构造函数需要一个参数来提供该属性适当的值。我们可以允许该值是内部对象引用或\
    \ ID 引用的集合，如下所示：\n\n```\n class Book {\n    constructor ({isbn, title, year, authors,\
    \ authorIdRefs,\n              publisher, publisher_id}) {\n            this.isbn\
    \ = isbn;\n            this.title = title;\n            this.year = year;\n  \
    \          // 分配对象引用或 ID 引用\n            this.authors = authors || authorIdRefs;\n\
    \            if (publisher || publisher_id) this.publisher = publisher || publisher_id;\n\
    \     }\n    …\n}\n```\n"
- fmt: "\nNotice that the constructor’s parameter record is expected to contain either\
    \ an `authors` or an `authorIdRefs` slot. The JavaScript expression `authors ||\
    \ authorIdRefs`, using the disjunction operator `||`, evaluates to a map `authors`,\
    \ if there is a slot with name `authors`, or to an array `authorIdRefs`, otherwise.\
    \ We handle the resulting ambiguity in the property setter by checking the type\
    \ of the argument as shown in the following code fragment:\n\n```\n set authors\
    \ ( a) {\n    this._authors = {};\n    if (Array.isArray(a)) { // array of IdRefs\n\
