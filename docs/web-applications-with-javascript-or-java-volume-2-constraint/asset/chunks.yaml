  trans: "\n\n我们借助 `JS class model` 来设计示例应用程序的 `model classes`，该模型是从 `design model`\
    \ 派生而来的，本质上是保留了所有的泛化箭头，并为每个类添加了 `get/set` 方法和静态 `check` 函数。然而，在我们的示例应用中，自然的方法是将\
    \ `Class Hierarchy Merge` 设计模式（在第 12.6 节中讨论）应用于 `Employee` 的单子类分段，通过消除 `Manager`\
    \ 子类来简化类模型。这导致了下方 图 13.2 所示的模型。请注意，`Person` 可以是 `Employee`、`Author` 或两者兼有。\n\n\
    ![](img/b_9783110500325-013_fig_002.png)\n\n图 13.2：Person 角色类层次结构的 JS 类模型。\n\n\
    ### 13.3.2 创建 JS 实体表模型\n\n由于我们使用浏览器的 `Local Storage` 作为示例应用程序的持久化存储技术，我们必须处理简单的键值存储。对于每个具有单一（大写）名称\
    \ `Entity` 的设计模型类，我们使用其复数小写名称 `entities` 作为对应的表名和键，以便通过 `JSON.stringify` 方法对对象集合\
    \ `Entity.instances` 进行序列化来获取关联的字符串值。\n\n我们以 `JS entity table model`的形式设计了一系列合适的\
    \ JS 实体表，该模型是从信息设计模型派生出来的。我们必须对如何组织数据存储以及如何派生相应的实体表模型做出某些选择。\n\n第一个选择是关于使用 `Single\
    \ Table Inheritance` (`STI`)、`Table per Class Inheritance` (`TCI`) 还是 `Joined\
    \ Tables Inheritance` (`JTI`) 的方法，这些方法在第 12.7.4 节中介绍。在 `STI` 方法中，用单个表表示一个分段（或整个类层次结构），其中包含所有涉及类的所有属性的列，如\
    \ 图 13.3 中的示例模型所示。\n\n![](img/b_9783110500325-013_fig_003.png)\n\n图 13.3：Person\
    \ 角色类层次结构的 STI 模型。\n\n由于给定的分段是非不交的，因此使用多值枚举属性类别来表示实例属于哪些子类的信息。\n\n对于给定的示例，使用 `STI`\
    \ 方法是可行的，因为角色层次结构层级并不深，且分段子类没有增加很多属性。但在更真实的示例中，给定角色层次结构的分段子类将会有很多属性。`STI` 方法并不是表示多级角色层次结构的真正可行方案。然而，我们可以选择它来表示单分段类层次结构\
    \ `Manager-is-subclass-of-Employee`。\n\n为了简单起见，并且因为浏览器的 `Local Storage` 不支持 `JTI`\
    \ 所的外键，我们选择了 `TCI` 方法，即为 `Person` 分段的每个类获取一个单独的表，但不包含外键。我们的选择导致了下方 图 13.4 所示的模型，该模型由图\
    \ 12.8 所示的设计模型派生而来：\n\n1. 根据第 12.6 节描述的 `Class Hierarchy Merge` 设计模式，将 `Manager`\
    \ 子类合并到其父类 `Employee` 中。\n2. 将 `Person`、`Author` 和 `Employee` 的 `personId` 属性的标准\
    \ ID 修饰符 `{id}` 替换为 `{pkey}`，以指示该属性是 `primary key`。\n3. 将单一（大写）类名（`Person`、`Author`\
    \ 和 `Employee`）替换为复数小写表名（`people`、`authors` 和 `employees`）。\n4. 为所有类矩形（people,\
    \ authors 和 employees）添加«JS entity table»原型。\n5. 将平台无关的数据类型名称替换为 JS 数据类型名称。\n\
    6. 丢弃所有泛化/继承箭头，并将父表的所有属性（`personId` 和 `name`）添加到它们的子表（authors 和 employees）中。\n\
    \n![](img/b_9783110500325-013_fig_004.png)\n\n图 13.4：Person 角色类层次结构的 TCI 模型。\n\
    \n在使用 `JTI` 方法的情况下，除了上述步骤 1-5，我们还会：\n\n1. 将根表（people）的主键列（`personId`）复制到所有子表（authors\
    \ 和 employees）。\n2. 将泛化箭头替换为带有«fkey»原型的依赖箭头（表示 `foreign key dependencies`），并在箭头的源端标注子表主键的名称（此处为：`personId`）。\n\
    \n### 13.3.3 新问题\n\n与 图 13.1 中我们的案例模型相比，在模型代码中我们需要处理许多新问题：\n\n1. 定义 `Employee`\
    \ 与 `Person` 之间的子类关系，以及 `Author` 与 `Person` 之间的关系，使用在第 13.1 节](#9783110500240_011618.xhtml_b_9783110500325-013_fig_001)\
    \ 中。\n2. 从持久化存储中加载根类实例（`Person.instances`）时，我们需要加载（1） 表（people）的记录以创建其直接实例，（2）\
    \ 还加载表示其所有子类的表（authors 和 employees）的记录以创建它们的直接实例，同时将它们的引用添加到根类集合中。\n3. 在 `Employee.saveAll`\
    \ 和 `Author.saveAll`（在 `pl.v.employees.manage.exit` 和 `pl.v.authors.manage.exit`\
    \ 中调用）将 `Employee` 和 `Author` 的实例作为 JS 实体表 employees 和 authors 的记录保存到持久化存储时，我们还需要将\
    \ `Person` 的直接实例保存为 `people` 表的记录。\n\n### 13.3.4 为 JS 类模型编写代码\n\n上方 图 13.2 所示的\
    \ JS 类模型可以直接编写代码，以获取模型类 `Person`、`Employee` 和 `Author` 以及枚举类型 `EmployeeCategoryEL`\
    \ 代码。\n\n#### 13.3.4.1 定义子类关系\n\n我们使用 `extends` 定义 `Employee` 与 `Person` 以及 `Author`\
    \ 与 `Person` 之间的子类关系。例如，在 `m/Employee.js` 中我们定义：\n\n```javascript\nEmployeeCategoryEL\
    \ = new Enumeration([\"Manager\"]);\nclass Employee extends Person {\n     constructor\
    \ ({personId, name, empNo, category, department}) {\n         super({personId,\
    \ name});\n         this.empNo = empNo;\n         if (category) this.category\
    \ = category;\n         if (department) this.department = department;\n      }\n\
    }\n```\n\n#### 13.3.4.2 加载根类 Person 的实例\n\n当从根据 TCI 方法组织的持久化存储中检索类层次结构根类的实例（在我们的示例中为\
    \ `Person`）时，我们不仅需要从代表根类的表（people）检索其直接实例，还需要从表示其所有子类的表（employees 和 authors）检索所有间接实例，如下代码所示：\n\
    \n"
- fmt: "\n```javascript\n Person.retrieveAll = function () {\n      var people={},\
    \ employees={}, authors={};\n      if (!localStorage[\"authors\"]) localStorage[\"\
    authors\"] = \"{}\";\n      if (!localStorage[\"employees\"]) localStorage[\"\
    employees\"] = \"{}\";\n      if (!localStorage[\"people\"]) localStorage[\"people\"\
    ] = \"{}\";\n      try {\n           people = JSON.parse( localStorage[\"people\"\
    ]);\n           employees = JSON.parse( localStorage[\"employees\"]);\n      \
    \     authors = JSON.parse( localStorage[\"authors\"]);\n      } catch (e) {\n\
    \           console.log(\"Error when reading from Local Storage\\n\" + e);\n \
    \     }\n      for (let key of Object.keys( authors)) {\n           try { // convert\
    \ record to (typed) object\n            Author.instances[key] = new Author( authors[key]);\n\
    \            // create superclass extension\n            Person.instances[key]\
    \ = Author.instances[key];\n       } catch (e) {\n       console.log(`${e.constructor.name}\
    \ while deserializing` +\n                 `author ${key}: ${e.message}`);\n \
    \       }\n     }\n      …\n}\n```\n\nEach record of the `authors` table is retrieved\
    \ and converted to an `Author` object, a reference to which is copied to `Person.instances`.\
    \ Also the records of the `employees` table are processed in this way, while the\
    \ records of the `people` table are simply retrieved and converted to `Person`\
    \ objects:\n\n```javascript\n Person.retrieveAll = function () {\n     …\n   \
    \ for (let key of Object.keys( employees)) {\n         …\n    }\n    for (let\
    \ key of Object.keys( people)) {\n        try { // convert record to (typed) object\n\
    \          Person.instances[key] = new Person( people[key]);\n        } catch\
    \ (e) {\n          console.log(`${e.constructor.name} while deserializing` +\n\
    \                `author ${key}: ${e.message}`);\n        }\n    }\n}\n```\n\n\
    ### 13.3.4.3 Saving the Supertable when Saving a Subtable\n\nSince the app’s data\
    \ is kept in main memory as long as the app is running (which is as long as the\
    \ app’s webpage is kept open in the browser), the data has to be saved to persistent\
    \ storage when the app is exited (e.g., by closing its browser tab), When saving\
    \ the instances of `Employee` and `Author` (as records of the JS entity tables\
    \ `employees` and `authors`) to persistent storage in `pl.v.employees.manage.exit`\
    \ and `pl.v.authors.manage.exit`, we also save the direct instances of `Person`\
    \ (as records of the `people` table). This is necessary because changes to `Employee`\
    \ or `Author` instances may imply changes of `Person.instances`.\n\nFor instance,\
    \ for `Employee` data management, we define in `v/employees.js`:\n\n```javascript\n\
    \ pl.v.employees.manage = {\n      …\n      exit: function () {\n          Employee.saveAll();\n\
    \          Person.saveAll ();\n        },\n        …\n}\n```\n\n## 14 Subtyping\
    \ with Java EE\n\nIn this chapter, we explain two case studies based on fragments\
    \ of the information model of our running example, the *Public Library* app. In\
    \ the first case study, we consider the single-level class hierarchy with root\
    \ `Book` shown in Figure 12.1, which is an incomplete disjoint segmentation. We\
    \ use the *Single Table Inheritance* approach for mapping this class hierarchy\
    \ to a single database table.\n\nIn the second case study, we consider the multi-level\
    \ class hierarchy consisting of the `Person` roles `Employee`, `Manager` and `Author`,\
    \ shown in Figure 12.8. We use the *Joined Table Inheritance* approach for mapping\
    \ this class hierarchy to a set of database tables that are related with each\
    \ other via foreign key dependencies.\n\nIn both cases we show:\n\n1. how to derive\
    \ a Java Entity class model,\n2. how to code the Java Entity class model in the\
    \ form of Java Entity classes,\n3. how to write the view and controller code based\
    \ on the model code.\n\n### 14.1 Subtyping in Java\n\nJava provides built-in support\
    \ for subtyping with its `extends` keyword, but it does not support *multiple\
    \ inheritance*. Consider the following information design model:\n\n![](graphic/converted/b_9783110500325-014_ingr_001.png)\n\
    \nFirst, we define the superclass `Person`. Then, we define the subclass `Student`\
    \ and its subtype relationship to `Person` by means of the `extends` keyword:\n\
    \n```java\n public class Person {\n    private String firstName;\n    private\
    \ String lastName;\n …\n}\npublic class Student extends Person {\n    private\
    \ int studentNo;\n  public Student( String first, String last, int studNo) {\n\
    \      super( firstName, lastName);\n      this.setStudNo( studNo);\n  }\n …\n\
    }\n```\n\nNotice that in the `Student` class, we define a constructor with all\
    \ the parameters required to create an instance of `Student`. In this subclass\
    \ constructor we use `super` to invoke the constructor of the superclass `Person`.\n\
    \n### 14.2 Case Study 1: Implement a Class Hierarchy with *Single Table Inheritance*\n\
    \nIn this example we implement the `Book` hierarchy shown in Figure 12.1. The\
    \ Java *Entity class model* is derived from this design model.\n\n#### 14.2.1\
    \ Make the Java Entity Class Model\n\nRecall that we obtain a Java Entity class\
    \ model from an OO class model by:\n(1) making all properties private,\n(2) using\
    \ Java datatype classes,\n(3) adding public getters and setters,\n(4) adding a\
    \ `toString` function,\n(5) adding the (static) data storage methods `create`,\
    \ `retrieve`, `update` and `delete`.\n\n![](graphic/converted/b_9783110500325-014_fig_001.png)\n\
    \nFigure 14.1: The Java class model of class hierarchy.\n\n#### 14.2.2 New Issues\n\
    \nWe have to deal with a number of issues:\n\n1. In the *model code* we have to\
    \ care of:\n    a. Coding the enumeration type (`BookCategoryEL`) that is used\
    \ in the UI code.\n    b. Code each class from the Book hierarchy using suitable\
    \ JPA annotations for storage in corresponding table.\n\n2. In the *UI code* we\
    \ have to care of:\n    a. Adding a “Special type” column to the display table\
    \ of the “retrieve all books” use case in `retrieveAndAll.xhtml` in the folder\
    \ `WebContent/views/books/`. A book without a special category will have an empty\
    \ table cell, while for all other books their category will be shown in this cell.\n\
    \    b. Adding a “Special type” select control, and corresponding form fields\
    \ for all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in `create.xhtml` and `update.xhtml` in the folder `WebContent/views/books/`.\
    \ Segment property form fields are only displayed, and their validation is performed,\
    \ when a corresponding book category has been selected. Such an approach of rendering\
    \ specific form fields only on certain conditions is called *dynamic forms*.\n\
    \n#### 14.2.3 Code the Classes of the Entity Class Model\n\nThe Java Entity class\
    \ model can be directly coded for getting the code of the model classes of our\
    \ Java EE back-end.\n\n###### 14.2.3.1 Summary\n\n1. Code the enumeration type\
    \ (to be used in the facelets).\n2. Code the model classes and add the corresponding\
    \ JPA annotations for class hierarchy.\n\nThese steps are discussed in more detail\
    \ in the following sections.\n\n###### 14.2.3.2 Code the Enumeration Type BookCategoryEL\n\
    \nThe enumeration type `BookCategoryEL` is coded as a Java enum, providing both\
    \ enumeration literals as well as (human-readable) labels:\n\n```java\n public\
    \ enum BookCategoryEL {\n    TEXTBOOK(\"TextBook\"), BIOGRAPHY(\"Biography\");\n\
    \    private final String label;\n\n    private BookCategoryEL( String label)\
