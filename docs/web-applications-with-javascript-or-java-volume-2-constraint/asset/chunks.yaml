    \ 方法中处理删除依赖关系。确保当带有单引用或多引用作为主引用属性值的对象被销毁时，首先取消（或移除）派生反向引用。\n\n这些步骤将在接下来的章节.中进行详细讨论。\n\
    \n## 8.2.3 编码 JS 类模型中的每个类\n\n例如，JS 类模型中的 `Publisher` 类按以下方式编码：\n\n```\nclass Publisher\
    \ {\n   constructor ({name, address}) {\n     this.name = name;\n     this.address\
    \ = address;\n     // 派生反向引用属性 (Book::publisher 的反向)\n     this._publishedBooks\
    \ = {}; // 初始化为空 map\n   }\n   get name() {…}\n   static checkName( n) {…}\n \
    \  static checkNameAsId( n) {…}\n   static checkNameAsIdRef( n) {…}\n   set name(\
    \ n) {…}\n   get address() {…}\n   static checkAddress( a) {…}\n   set address(\
    \ a) {…}\n   toString() {…}\n   toRecord() {…}\n}\n```\n\n注意我们添加了（派生的）多值引用属性 `publishedBooks`，但我们没有在构造函数中为其赋值，因为它是一个只读属性，在其反向主引用属性\
