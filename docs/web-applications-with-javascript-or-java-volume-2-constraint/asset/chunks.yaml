    \ forms`（动态表单）。\n\n## 13.2.3 编码 JS 类模型的模型类\n\n可以直接对 JS 类模型进行编码，以获取前端应用的模型类的代码。\n\
    \n### 13.2.3.1 总结\n\n1.  如卷 1 第 11 章所述，借助元类`Enumeration`编码枚举类型`BookCategoryEL`，用作`category`属性的范围。\n\
