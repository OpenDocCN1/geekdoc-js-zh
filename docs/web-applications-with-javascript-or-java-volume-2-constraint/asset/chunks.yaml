  trans: "\n使用 OOP 语言的引用路径表示法，用 `c` 引用一个 `Committee` 对象，我们得到方程：\n\n7.1)`c.chair.chairedCommittee=c`\n\
    \n或者，反过来，用 `m` 引用一个 `ClubMember` 对象，我们得到方程：\n\n(7.2)`m.chairedCommittee.chair=m`\n\
    \n注意，当一个属性 `p[2]` 是属性 `p[1]` 的反属性时，这意味着反过来来，`p[1]` 是 `p[2]` 的反属性。因此，当我们声明属性 `ClubMember::chairedCommittee`\
    \ 是 `Committee::chair` 的反属性时，隐含地，`Committee::chair` 也是 `ClubMember::chairedCommittee`\
    \ 的反属性。因此，我们将 `Committee::chair` 和 `ClubMember::chairedCommittee` 称为**互反的引用属性对**。在模型中具有这样一对意味着**冗余**，因为涉及的两个引用属性中的任何一个都可以通过反转导出另一个。这种冗余意味着*数据存储开销*和*更新开销*，这是为了支持双向高效对象访问而必须付出的代价。\n\
    \n为了维护互反引用属性对的重复信息，通常做法是将涉及的两个属性之一视为*主属性*（master），另一个视为*从属性*（slave），并在受影响模型类的更改方法（如属性设置器）的代码中考虑这种区别。在模型图中，我们通过使用\
    \ UML 符号斜杠（/）作为属性名的前缀，将从属性声明为**派生**属性，以此指示互反引用属性对中的从属性，如下所示：\n\n![](img/b_9783110500325-007_ingr_003.png)\n\
    \n`ClubMember` 中的属性 `chairedCommittee` 现在是*派生*的（如其斜杠前缀所示）。它的注释 `{inverse of chair}`\
    \ 了一了一个*派生规则*，根据该规则，它是通过反转属性 `Committee::chair` 得到的。\n\n在 UML 类图中，属性的派生可以通过 OCL\
    \ `derive` 表达式来指定，该表达式对于给定对象求出派生属性的值。在属性是另一个属性的反属性的情况下（通过附加在属性声明后的约束表达式 `{inverse\
    \ of anotherProperty}` 指定），派生表达式是隐含的。在我们的示例中，对于任何俱乐部成员对象 `m`，它求出委员会对象 `c`，使得 `c.chair\
    \ = m`。在 OCL 中，该派生规则表示如下：\n\n```\n context ClubMember::chairedCommittee: Committee\n\
    derive:  \n  if Committee.allInstances().exists( c | c.chair = self) then c\n\
    ```\n\n实现属性派生有两种方式：可以通过读取时计算其值来*读取时派生*（derived on read），也可以可以通过当派生表达式中的某个变量（通常是另一个属性）值改变时执行更新时计算来*更新时派生*（derived\
    \ on update）。后者对应于数据库中的*物化视图*。虽然读取时派生的引用属性可能无法保证高效的导航（因为读取时的计算可能会产生不可接受的延迟），但更新时派生的引用属性提供了高效的导航。\n\
    \n当我们通过在名称前加斜杠（/）将反引用属性指定为派生时，我们指示它是更新时派生的。例如，上述示例中的属性 `/chairedCommittee` 是从属性\
    \ `chair` 更新时派生的。\n\n在派生引用属性的情况下，我们必须处理受影响模型类之间的**生命周期依赖**，这需要根据所表示关联的功能类型（*一对一*、*多对一*或*多对多*）采用特殊的更改管理机制。\n\
    \n在我们派生反引用属性 `ClubMember::chairedCommittee` 的示例中，它是单值且可选的，这意味着：\n\n1. 每当创建一个新的委员会对象时（带有强制性的主席分配），都必须相应地分配对应的\
    \ `ClubMember::chairedCommittee` 属性；\n2. 每当更新 `chair` 属性时（即为委员会分配一个新主席），就必须取消原任主席的俱乐部成员的对应\
    \ `ClubMember::chairedCommittee` 属性，并为新主席的成员设置该属性；\n3. 每当销毁一个委员会对象时，就必须取消对应的 `ClubMember::chairedCommittee`\
    \ 属性。\n\n当派生引用属性为多值而其反反基属性为单值时（例如下方图 7.4 所示的模型。如果模型中仍包含任何非定向关联，我们首先必须通过对端点所有权做出决策，将其转换为定向关联，该决策通常基于导航需求。\n\
    \n1. **消除单向关联**，通过在源类中替换为一个引用属性来连接源类与目标类，使目标类成为该属性的范围。\n\n"
