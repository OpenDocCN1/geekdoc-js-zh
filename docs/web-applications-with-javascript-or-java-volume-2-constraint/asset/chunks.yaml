    A subtype `inherits` all features from its supertypes. When a subtype inherits
    attributes, associations and constraints from a supertype, this means that these
    features need not be repeatedly rendered for the subtype in the class diagram,
    but the reader of the diagram has to understand that all features of a supertype
    also apply to its subtypes.


    When an object type has more than one direct supertype, we have a case of `multiple
    inheritance`, which is common in conceptual modeling, but prohibited in many object-oriented
    programming languages, such as `Java` and `C#`, which only allow `class hierarchies`
    with a unique direct supertype for each object type.


    ### 12.1 Introducing Subtypes by Specialization


    A new object type may be introduced by specialization whenever it represents a
    special case of another object type. We illustrate this for our example model
    where we want to capture text books and biographies as special cases of books.
    This means that text books and biographies also have an `ISBN`, a title and a
    publishing year, but in addition they have further features such as the attribute
    `subjectArea` for text books and the attribute `about` for biographies. Consequently,
    in [Figure 12.1](#9783110500240_011618.xhtml_b_9783110500325-012_fig_001), we
    introduce the object types `TextBook` and `Biography` by specializing the object
    type `Book`, that is, as subtypes of `Book`.


    ![](graphic/converted/b_9783110500325-012_fig_001.png)


    Figure 12.1: The object type `Book` with two subtypes: `TextBook` and `Biography`.


    When specializing an object type, we define additional features for the newly
    added subtype. In many cases, these additional features are more specific properties.
    For instance, in the case of `TextBook` specializing `Book`, we define the additional
    attribute `subjectArea`. In some programming languages, such as in `Java`, it
    is therefore said that the subtype `extends` the supertype.


    However, we can also specialize an object type without defining additional properties
    or operations/methods, but by defining additional constraints.


    ### 12.2 Introducing Supertypes by Generalization


    We illustrate generalization with the example shown in [Figure 12.2](#9783110500240_011618.xhtml_b_9783110500325-012_fig_002).


    ![](graphic/converted/b_9783110500325-012_fig_002.png)


    Figure 12.2: The object types `Employee` and `Author` share several attributes.


    After adding the object type `Employee` we notice that `Employee` and `Author`
    share a number of attributes due to the fact that both employees and authors are
    people, and `being an employee` as well as `being an author` are `roles` played
    by people. So, we may generalize these two object types by adding a joint supertype
    `Person`, as shown in the diagram of [Figure 12.3](#9783110500240_011618.xhtml_b_9783110500325-012_fig_003).


    ![](graphic/converted/b_9783110500325-012_fig_003.png)


    Figure 12.3: The object types `Employee` and `Author` are generalized by the common
    supertype `Person`.


    When generalizing two or more object types, we move those features that are shared
    by them to the newly added supertype where they are centralized. In the case of
    `Employee` and `Author`, this set of shared features consists of the attributes
    `name`, `dateOfBirth` and `dateOfDeath`. In general, shared features may include
    attributes, associations and constraints.


    Notice that since in an information design model, each top-level class needs to
    have a standard identifier, in the new class `Person` we have declared the standard
    identifier attribute `personId`, which is inherited by all subclasses. Therefore,
    we have to reconsider the attributes that had had declared to be standard identifiers
    in the subclasses before the generalization. In the case of `Employee`, we had
    declared the attribute `employeeNo` as a standard identifier. Since the employee
    number is an important business information item, we have to keep this attribute,
    even if it is no longer the standard identifier. Because it is still an alternative
    identifier (a “key”), we define a `uniqueness` constraint for it with the constraint
    keyword `key`.


    In the case of `Author`, we had declared the attribute `authorId` as a standard
    identifier. Assuming that this attribute represents a purely technical, rather
    than business, information item, we dropped it, since it’s no longer needed as
    an identifier for authors. Consequently, we end up with a model which allows to
    identify employees either by their employee number or by their `personId` value,
    and to identify authors by their `personId` value.


    We consider the following extension of our original example model, shown in [Figure
    12.4](#9783110500240_011618.xhtml_b_9783110500325-012_fig_004), where we have
    added two class hierarchies:


    1. the disjoint (but incomplete) segmentation of `Book` into `TextBook` and `Biography`,

    2. the overlapping and incomplete segmentation of `Person` into `Author` and `Employee`,
    which is further specialized by `Manager`.


    ![](graphic/converted/b_9783110500325-012_fig_004.png)


    Figure 12.4: An information model with two hierarchies.


    ### 12.3 Intension versus Extension


    The `intension` of an object type is given by the set of its features, including
    attributes, associations, constraints and operations. The `extension` of an object
    type is the set of all objects instantiating it, also called its `population`.


    We have the following duality: while all features of a supertype are included
    in the intensions of its subtypes (intensional inclusion), all instances of a
    subtype are included in the extensions, of its supertypes (extensional inclusion).
    This formal structure has been investigated in formal analysis.


    Due to the intension/extension duality we can specialize a given type in two different
    ways:


    1. By extending the type’s intension through adding features in the new subtype
    (such as adding the attribute `subjectArea`).

    2. By restricting the type’s extension through adding a constraint (such as defining
    a TextBook as “Mathematics”).


    Typical OO languages, such as `Java` and `C#`, only support the first possibility
    (extending its intension), while `XML Schema` and `SQL99` also support the second.


    ### 12.4 Type Hierarchies


    A `type hierarchy` (or `class hierarchy`) consists of two or more types, one of
    them being the `root` (or `top-level`) type, and all others having at least one
    supertype. When all non-root types have a unique direct supertype, the type hierarchy
    is a `single-inheritance hierarchy`, otherwise it’s `multiple-inheritance hierarchy`.
    For instance, in [Figure 12.5](#9783110500240_011618.xhtml_b_9783110500325-012_fig_005)
    below, the class `Vehicle` is the root of a single-inheritance hierarchy, while
    [Figure 12.6](#9783110500240_011618.xhtml_b_9783110500325-012_fig_006) shows an
    example of a multiple-inheritance hierarchy, due to the fact that `AmphibianVehicle`
    has two direct superclasses: `LandVehicle` and `WaterVehicle`.


    ![](graphic/converted/b_9783110500325-012_fig_005.png)


    Figure 12.5: A class hierarchy having the root class `Vehicle`.


    The simplest case of a class hierarchy, which has only one level of subtyping,
    is called a `generalization set` in UML, but may be more naturally called `segmentation`.
    A segmentation is `complete`, if the union of all subclass extensions is equal
    to the extension of the superclass (or, in other words, if all instances of the
    superclass instantiate some subclass). A segmentation is `disjoint`, if all subclasses
    are pairwise disjoint (or, in other words, if no instance of the superclass instantiates
    more than one subclass). Otherwise, it is called `overlapping`. A complete and
    disjoint segmentation is a `partition`.

