    ## 7 Bidirectional Associations


    In OO modeling and programming, a `bidirectional` association is an association
    that is represented as a pair of mutually inverse properties, which allow ‘navigation’
    in both directions.


    The model shown in [Figure 7.1](#9783110500240_000634.xhtml_b_9783110500325-007_fig_001)
    below (about publishers, books and their authors) serves as our running example.
    Notice that it contains two bidirectional associations, as indicated by the ownership
    dots at both ends.


    ![](graphic/converted/b_9783110500325-007_fig_001.png)


    Figure 7.1: The Publisher-Book-Author information design model with two bidirectional
    associations.


    ### 7.1 Inverse Reference Properties


    For being able to easily retrieve the committees that are chaired or co-chaired
    by a club member, we add two reference properties to our `Committee-ClubMember`
    example model: the property of a club member to be the chair of a committee (`ClubMember::chairedCommittee`)
    and the property of a club member to be the co-chair of a committee (`ClubMember::coChairedCommittee`).
    We assume that any member may chair or co-chair at most one committee (where the
    disjunction is non-exclusive). So, we get the following model:


    ![](graphic/converted/b_9783110500325-007_ingr_001.png)


    Notice that there is a close correspondence between the two reference properties
    `Committee::chair` and `ClubMember::chairedCommittee`. They are the `inverse`
    of each other: when the club member Tom is the chair of the budget committee,
    expressed by the tuple *(“budget committee”, “Tom”)*, then the budget committee
    is the committee chaired by the club member Tom, expressed by the inverse tuple
    *(“Tom”, “budget committee”)*. For expressing this inverse correspondence in the
    diagram, we append an inverse property constraint, `inverse of chair`, in curly
    braces to the declaration of the property `ClubMember::chairedCommittee`, and
    a similar one to the property `Committee::chair`, as shown in the following diagram:


    ![](graphic/converted/b_9783110500325-007_ingr_002.png)

