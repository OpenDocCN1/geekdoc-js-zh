    \n### 13.2 Case Study 1: Eliminating a Class Hierarchy\n\nSimple class hierarchies\
    \ can be eliminated by applying the *Class Hierarchy Merge* design pattern. The\
    \ starting point for our case study is the simple class hierarchy shown in the\
    \ information design model of Figure 12.1 above, representing a disjoint (but\
    \ incomplete) rigid segmentation of Book into TextBook and Biography. This model\
    \ is first simplified by applying the *Class Hierarchy Merge* design pattern,\
    \ resulting in the following model:\n\n![](graphic/converted/b_9783110500325-013_ingr_002.png)\n\
    \nWe can now derive a *JS class model* from this design model.\n\n#### 13.2.1 Make\
    \ the JS Class Model\n\nWe make the JS class model in 3 steps:\n\n1.  Replace\
    \ the platform-independent datatypes (used as the ranges of attributes and parameters)\
    \ with JS datatypes. This includes the case of enumeration-valued attributes,\
    \ such as category, which are turned into number-valued attributes restricted\
    \ to the enumeration integers of the underlying enumeration type.\n\n2.  Decorate\
    \ all properties with a «get/set» stereotype for indicating that they have implicit\
    \ getters and setters.\n\n3.  Add property *check* functions, as described in\
    \ Chapter 8 of Volume 1\\. The checkCategory function, as well as the checks of\
    \ the segment properties need special consideration according to their implied\
    \ semantics. In particular, a segment property’s check function must ensure that\
    \ the property can only be assigned if the category attribute has a value representing\
    \ the corresponding segment. We explain this implied validation semantics in more\
    \ detail below when we discuss how the JS class model is coded.\n\nThis leads\
    \ to the JS class model shown in [Figure 13.1](#9783110500240_011618.xhtml_b_9783110500325-013_fig_001),\
    \ where the class-level (‘static’) methods are underlined:\n\n![](graphic/converted/b_9783110500325-013_fig_001.png)\n\
    \nFigure 13.1: The JS class model of the merged Book class hierarchy.\n\n####\
    \ 13.2.2 New Issues\n\nCompared to the enumeration app discussed in Chapter 11\
    \ of Volume 1, we have to deal with a number of new issues:\n\n1.  In the *model\
    \ code* we have to take care of\n\n    1.  Adding the constraint violation class\
    \ *FrozenValueConstraintViolation* to errorTypes.js.\n\n    2.  Coding the enumeration\
    \ type to be used as the range of the category attribute (BookCategoryEL in our\
    \ example).\n\n    3.  Coding the checkCategory function for the category attribute.\
    \ In our example this attribute is *optional*, due to the fact that the Book segmentation\
    \ is *incomplete*. If the segmentation, to which the *Class Hierarchy Merge* pattern\
    \ is applied, is complete, then the category attribute is *mandatory*.\n\n   \
    \ 4.  Coding the *check* functions for all segment properties such that they take\
    \ the category as a second parameter for being able to test if the segment property\
    \ concerned applies to a given instance.\n\n    5.  Refining the serialization\
    \ function toString() by adding a category case distinction (switch) statement\
    \ for serializing only the segment properties that apply to the given category.\n\
    \n    6.  Implementing the *Frozen Value Constraint* for the category attribute\
    \ in Book.update by updating the category of a book only if it has not yet been\
    \ defined. This means it cannot be updated anymore as soon as it has been defined.\n\
    \n2.  In the *UI code* we have to take care of\n\n    1.  Adding a “Special type”\
    \ (or “Category”) column to the display table of the “List all books” use case\
    \ in books.html. A book without a special category will have an empty table cell,\
    \ while for all other books their category will be shown in this cell, along with\
    \ other segment-specific attribute values. This requires a corresponding switch\
    \ statement in pl.v.books.retrieveAndListAll.setupUserInterface in the books.js\
    \ view code file.\n\n    2.  Adding a “Special type” choice widget (typically,\
    \ a selection list), and corresponding form fields for all segment properties,\
    \ in the forms of the “Create book” and “Update book” use cases in books.html.\
    \ Segment property form fields are only displayed when a corresponding book category\
    \ has been selected. Such an approach of rendering specific form fields only on\
    \ certain conditions is sometimes called *dynamic forms*.\n\n#### 13.2.3 Code\
    \ the Model Classes of the JS Class Model\n\nThe JS class model can be directly\
    \ coded for getting the code of the model classes of our JS front-end app.\n\n\
    ##### 13.2.3.1 Summary\n\n1.  Code the enumeration type BookCategoryEL to be used\
    \ as the range of the category attribute with the help of the meta-class Enumeration,\
    \ as explained in Chapter 11 of Volume 1.\n\n2.  Code the model class Book in\
    \ the form of a JS class definition with get and set methods as well as static\
    \ *check* functions.\n\nThese steps are discussed in more detail in the following\
    \ [sections.](#9783110500240_011618.xhtml_b_9783110500325-013_s_002_s_003_s_002)\n\
    \n##### 13.2.3.2 Code the Enumeration Type BookCategoryEL\n\nThe enumeration type\
    \ BookCategoryEL is coded with the help of our library meta-class Enumeration\
