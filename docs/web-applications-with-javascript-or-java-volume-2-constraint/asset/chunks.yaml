    在类图中，我们可以通过在共享泛化箭头上标注大括号括起的关键字 `complete`（完全）和 `disjoint`（互斥）来表示这些约束。例如，带有 `{complete,
    disjoint}` 的标注表示它是一个划分（partition）。默认情况下，每当划分没有任何标注时（例如上方图 12.6 中将 `Vehicle` 划分为
    `LandVehicle` 和 `WaterVehicle` 的划分），它就是 `{incomplete, overlapping}`（不完全且重叠的）。


    ![](img/b_9783110500325-012_fig_006.png)


    图 12.6：一个多重继承的层次结构。


    信息模型可以包含任意数量的类层次结构。


    ### 12.5 种类（Kinds）与角色（Roles）


    为了更好地理解关于现实世界的自然语言陈述和信息模型中对象类型及其子类型的不同类别，我们可以根据 Giancarlo Guizzardi 在《结构化概念模型的本体论基础》第
    4 章中提出的对象类型分类理论，区分 `sortal`（分类性）与非 `sortal`（非分类性），以及 `rigid`（刚性）与非 `rigid`（非刚性）对象类型。


    如果一个对象类型的实例具有统一的身份条件，则该对象类型是 `sortal` 的。这种条件定义了某个属性（或属性集），使得两个实例在不属于同一个对象的情况下不能共同具有这些属性。`sortal`
    对象类型的一个例子是 `Person`（人），因为其所有的实例（人）都可以通过一组与其出生相关的属性（出生时间、地点和出生者）来识别。`Book`（书）是一个非
    `sortal` 对象类型的例子，因为它包含了以不同方式识别的实例（例如教科书和自出版小说）。


    如果一个对象类型的实例在不消失（或改变其身份）的情况下无法不再是该类型，则该对象类型是 `rigid`（刚性的）。`Person` 是一个 `rigid`
    对象类型的例子，而 `Employee`（员工）不是刚性的。如果所有的划分子类都是刚性的，则该划分被称为 `rigid` 的。


    `kind`（种类）是一种 `rigid` 且 `sortal` 对象类型。类的例子包括 `TextBook`（教科书）和 `Person`。`role`（角色）是一个
    `sortal` 对象类型 `R`，用于对所有参与与对象类型 `O` 的实例建立某种关系（特定类型 `A`）的种类 `K` 的实例进行分类。请注意，`R`
    是 `K` 的一个非 `rigid` 子类型，因为当实例不再参与与类型 `O` 的实例建立类型 `A` 的关系而不再实例化 `R` 时，这些实例并不会因此消失。


    例如，`Employee` 就是一个角色的例子，因为它是一个 `sortal` 对象类型，用于对所有参与与类型 `Enterprise` 的实例建立雇用关系的
    `Person` 实例进行分类。


    ### 12.6 类层次结构合并设计模式


    考虑上方图 12.1 中设计模型的简单类层次结构，它显示了类 `Book` 的互斥划分。在这种情况下，每当只有一层（或只有几层）子类型，且每个子类型仅有一个（或几个）额外属性时，通过将所有子类的所有额外属性合并到根类的扩展版本中来重构类层次结构是一种选择，使得这些子类可以从模型中删除，从而导致**的简化。


    这种 `Class Hierarchy Merge`（类层次结构合并）设计模式有两种形式。在最简单的形式，原始类层次结构的划分是 `disjoint`（互斥的），这允许使用一个
    `single-valued`（单值）类别属性来表示根类每个实例对应的、由其实例化的唯一子类的特定类别。当原始类层次结构的划分不是互斥时，即当至少有一个划分是
    `overlapping`（重叠的）时，我们需要使用 `multi-valued`（多值）类别属性来表示对象所实例化的类型集合。我们只讨论针对互斥划分的简单
    `Class Hierarchy Merge` 重构情况，我们采取以下重构步骤：


    1. 添加一个 `enumeration datatype`（枚举数据类型），其中包含每个划分子类对应的枚举字面量。在我们的示例中，我们添加了枚举数据类型
    `BookCategoryEL`。


    2. 在根类中添加一个类别属性，并将该枚举作为其范围。如果划分是完全的（complete），则该类别属性是强制的 [1]；否则可选的 [0..1]。在我们的示例中，我们为类
    `Book` 添加了一个范围为 `BookCategoryEL` 的类别属性。该类别属性是可选的，因为将 `Book` 划分为 `TextBook` 和 `Biography`
    是不完全。


    3. 每当划分是 `rigid`（刚性的）时，我们将类别属性指定为 `frozen`（冻结的），这意味着它只能在创建新对象时通过设置值赋值一次，但之后无法更改。


    4. 将划分子类的属性移动到根类，并将其设为 `optional`（可选的）。我们将这些通常列在类别属性下方的属性称为 `segment properties`（划分属性）。在我们的示例中，我们将从
    `TextBook` 的 `subjectArea` 属性和从 `Biography` 的 `about` 属性移动到 `Book`，并将它们设为 `optional`，即
    [0..1]。


    5. 添加一个约束（附加在扩展根类矩形上的不变式框内），强制要求当且仅当根类实例实例化该子类时，可选的子类属性才有值。


    6. 从模型中删除划分子类。


    在我们的示例中，这种重构的结果如图 12.7 所示。请注意，该约束（或“不变式”）表示一个逻辑语句，其中逻辑运算符 `IFF` 代表“当且仅当”，属性条件
    `prop=undefined` 测试属性 `prop` 未定义。


    ![](img/b_9783110500325-012_fig_007.png)


    图 12.7：应用类层次结构合并设计模式的结果。


    ### 12.7 计算语言中的子类型与继承


    子类型和继承已经在*面向对象编程 (OOP)*、数据库语言（如 *SQL99*）、XML 模式定义语言 *XML Schema* 以及其他计算语言中以不同的方式和程度得到了支持。计算语言中子类型化的核心在于定义类型层次结构以及特征的继承：OOP
    中的属性、约束和方法；SQL99 中的列和约束；XML Schema 中的元素、属性和约束。


    通常，在类型层次结构中支持*多重分类*和*多重继承*是理想的。这两个语言特性密切相关，并且被认为是高级特性，在应用中可能不需要，或者可以通过变通方法处理。


    #### 12.7.1 OOP 中的子类型与继承


