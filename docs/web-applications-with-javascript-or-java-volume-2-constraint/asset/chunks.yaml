    \ Variable Declarations with let and const\n\nES5 did not allow declaring variables\
    \ the scope of which is a block delimited by a pair of curly braces, { and },\
    \ or defined by a for loop. Rather, all variables declared with var, even if declared\
    \ within a block, have either a function scope or the global scope. The new feature\
    \ of *block-scope variable declarations* with **let** and **const** allows declaring\
    \ local variables with a finer-grained scope, which helps avoiding unintended\
    \ variable duplications and leads to more modular code.\n\nThere is only one meaning\
    \ difference between let and const. Variables declared with const are *frozen*\
    \ or *immutable*, and in this sense *constant*, while let variables are not. It\
    \ is preferable to use const for all variables that are not supposed to change\
    \ their values. Otherwise, or if this is not clear, one should declare the variable\
    \ with let if it is a block-scoped variable, or with var if it is a global or\
    \ function-scoped variable.\n\n#### 2.1.2 Arrow Functions\n\nCompared to classical\
    \ JS functions, arrow functions (with =>) provide a more concise function expression\
    \ syntax, see Ex. 1, and allow using JavaScript’s this variable from the function’s\
    \ outer environment (its *closure*) in their function body, see Ex. 2.\n\n**Example 2.1.** \n\
    \n```\n let evens = [0,2,4,6,8];\nlet odds = evens.map( v => v+1); // [1,3,5,7,9]\n\
    // instead of evens.map( function (v) {return v+1;})\n```\n\n**Example 2.2.** \n\
    \n```\n this.nums = [1,3,5,8,10,12,15,17];\nthis.fives = [];\nthis.nums.forEach(\
    \ v => {if (v % 5 === 0) this.fives.push(v);});\n// instead of this.nums.forEach(\n\
    //     function (v) {if (v % 5 === 0) this.fives.push(v);}, this)\n```\n\n####\
    \ 2.1.3 For-Of Loops over Iterable Objects\n\nIterable objects include strings,\
    \ arrays, array-like objects (e.g., the built-in arguments object or instances\
    \ of HTMLCollections and NodeList), and instances of the datatype objects TypedArray,\
    \ Map, and Set, as well as user-defined iterables. For instance,\n\n```\n const\
    \ divElems = document.getElementsByTagName(\"div\");\n// an HTMLCollection is\
    \ iterable\nfor (let dEl of divElems) {\n     console.log( dEl.id);\n}\n```\n\n\
    A *for-of* loop is often more handy than a *for* loop whenever a counter variable\
    \ is not needed. As opposed to a forEach loop, a *for-of* loop allows iterating\
    \ over HTMLCollections and can be abandoned with break.\n\n#### 2.1.4 Template\
    \ Literals\n\n… are enclosed by backtick characters (like ` … `) instead of double\
    \ or single quotes and allow a concise syntax for (possibly multi-line) string\
    \ values resulting from a combination of fixed text parts and variables/expressions.\
    \ For instance,\n\n```\n const classValues = \"card important\";\nconst name =\
    \ \"Joker\";\nconst htmlTemplate = `<div class=\"${classValues}\">\n     <p>Hello\
    \ ${name}!</p>\n</div>`\n```\n\n#### 2.1.5 The Spread Operator\n\n… allows spreading\
    \ (1) the elements of an iterable collection in places where arguments for function\
    \ calls or array elements are expected, or (2) the slots of a JS object in places\
    \ where name-value pairs are expected. For instance,\n\n```\n let nums = [3,4,5],\
    \ otherNums = [1, 2, … nums]; // [1,2,3,4,5]\n// cloning an array\nlet numsClone\
    \ = [ … nums];\n// cloning an object\nlet book = {title:”JavaScript: The Good\
    \ Parts”};\nlet bookClone = { … book};\n```\n\n#### 2.1.6 Destructuring Assignments\n\
    \n… allow a concise syntax for assigning the property values of a JS object or\
    \ the elements of a JS array to corresponding variables. For instance,\n\n```\n\
    \ var point1 = [10,5];\nvar [x,y] = point1; // a destructuring assignment\nconsole.log(`x\
    \ = ${x} | y = ${y}`); // x = 10 | y = 5\n\nvar person1 = {firstName:\"James\"\
    , lastName:\"Bond\"};\nvar {first, last} = person1;\nconsole.log(`first:${first}\
    \ | last:${last}`);\n// Output: first:James | last:Bond\n```\n\n**Example 2.3.**\
    \ Dealing with multiple return values of a function\n\n```\n function getRectangle\
    \ () {\n     return {width: 50, height: 20};\n}\nconst {a, b} = getRectangle();\n\
    drawRectangle( a, b);\n```\n\n*Example 2.4\\. Swapping two variables*\n\n```\n\
    \ var a = 1, b = 2;\n[a,b] = [b,a];\nconsole.log(`a = ${a} | b = ${b}`);\n// Output:\
    \ a = 2 | b = 1\n```\n\n*Example 2.5\\. Cloning arrays*\n\n```\n const list =\
    \ ['red', 'orange', 'yellow'];\nconst […listClone] = list;\n```\n\n*Example 2.6\\\
    . Simplifying functions with parameter records*\n\nA function parameter record\
    \ allows using named arguments in funcction calls instead of argument lists like\
    \ so:\n\n```\n function displayName( paramRec) {\n      alert( paramRec.first\
    \ + \" \" + paramRec.last);\n};\ndisplayName({first:\"James\", last:\"Bond\"});\n\
    ```\n\nUsing Destructuring, the parameter record fields are assigned to ordinary\
    \ function parameters, simplifying the function’s code:\n\n```\n function displayName({first,\
    \ last}) {\n      alert( first + \" \" + last);\n}\ndisplayName({first:\"James\"\
    , last:\"Bond\"});\n```\n\n### 2.2 Implementing Single-Valued Reference Properties\n\
    \nWhen coding a class, the ES2015 feature of *function parameter destructuring*\
    \ allows using a single constructor parameter that is a record with a simplified\
    \ syntax for defining its fields. We make use of this new feature for obtaining\
    \ a simplified class definition syntax illustrated by the following example:\n\
    \n```\n class Book {\n     constructor ({isbn, title, year, …}) {\n         this.isbn\
    \ = isbn;\n         this.title = title;\n         this.year = year;\n        \
    \ …\n     }\n   …\n}\n```\n\nA single-valued reference property, such as the property\
    \ publisher of the object type Book, allows storing internal references to objects\
    \ of another type, such as Publisher. When creating a new object, the constructor\
    \ function needs to have a parameter for allowing to assign a suitable value to\
    \ the reference property. In a typed programming language, such as Java, we would\
    \ have to take a decision if this value is expected to be an (internal) object\
    \ reference or an (external) ID reference. In JavaScript, however, we can take\
    \ a more flexible approach and allow using either of them, as shown in the following\
    \ example:"
