    子类型 `inherits` 继承其所有超类的所有特征。当子类型从超类继承属性、关联和约束时，这意味着在类图中不需要为该子类型重复渲染这些特征，但图表的读者必须理解，超类的所有特征也适用于其子类型。


    当一个对象类型有多个直接超类时，我们就构成了 `multiple inheritance`（多继承）的情况。这在概念建模中很常见，但在许多面向对象的编程语言（如
    `Java` 和 `C#`）中是被禁止的，这些语言仅允许每个对象类型具有唯一直接超类的 `class hierarchies`。


    ### 12.1 通过特化引入子类型


    每当一个新的对象类型代表另一个对象类型的特例时，就可以通过特化引入该新对象类型。我们在示例模型中说明这一点，该模型希望将“教材”和“传记”作为“书籍”的特例进行建模。这意味着教材和传记也拥有
    `ISBN`、标题和出版年份，但它们还具有进一步的特征，例如教材具有 `subjectArea` 属性，传记具有 `about` 属性。因此，在图 12.1
    中，我们通过特化对象类型 `Book` 来引入对象类型 `TextBook` 和 `Biography`，即作为 `Book` 的子类型。


    ![](img/b_9783110500325-012_fig_001.png)


    图 12.1：对象类型 `Book` 的两个子类型：`TextBook` 和 `Biography`。


    在特化对象类型时，我们为新添加的子类型定义额外的特征。在许多情况下，这些额外特征是具体的属性。例如，在 `TextBook` 特化 `Book` 的情况下，我们定义了额外的属性
    `subjectArea`。在某些编程语言（如 `Java`）中，因此说子类型 `extends`（扩展）了超类。


    然而，我们也可以通过定义额外的约束来特化对象类型，而不定义额外的属性或操作/方法。


    ### 12.2 通过泛化引入超类


    我们通过图 12.2 所示的示例来说说明泛化。


    ![](img/b_9783110500325-012_fig_002.png)


    图 12.2：对象类型 `Employee` 和 `Author` 共享若干属性。


    在添加对象类型 `Employee` 后，我们注意到 `Employee` 和 `Author` 共享许多属性，因为员工和作者都是人，而“成为员工”和“成为作者”都是人扮演的
    `roles`（角色）。因此，我们可以通过添加共同共同超类 `Person` 来对这两个对象类型进行泛化，如图 12.3 中的图所示。


    ![](img/b_9783110500325-012_fig_003.png)


    图 12.3：对象类型 `Employee` 和 `Author` 通过共同超类 `Person` 进行了泛化。


    在泛化两个或多个对象类型时，我们将它们共享的特征移动到新添加的超类中，并进行集中管理。在 `Employee` 和 `Author` 的情况下，这组共享特征由属性
    `name`、`dateOfBirth` 和 `dateOfDeath` 组成。一般而言，共享特征可能包括属性、关联和约束。


    注意，由于在信息设计模型中，每个顶层类都需要一个标准的标识符，因此在新类 `Person` 中，我们声明了标准标识符属性 `personId`，所有子类都继承它。因此，我们必须重新考虑泛化之前在子类中声明为标准标识符的属性。在
    `Employee` 的情况下，我们曾将属性 `employeeNo` 为标准标识符。由于员工编号是一个重要的业务信息项，即使它不再是标准标识符，我们也必须保留该属性。因为它仍然是一个替代标识符（一个“键”），我们使用约束关键字
    `key` 为其定义了一个 `uniqueness` 约束。


    在 `Author` 的情况下，我们曾将属性 `authorId` 声明为标准标识符。假设该属性代表的是纯技术性而非业务性的信息项，我们将其舍弃，因为它不再需要作为作者的标识符。因此，我们最终得到的模型允许通过员工编号或其
    `personId` 值来识别员工，并通过其 `personId` 值来识别作者。


    我们考虑原始示例模型的以下扩展，如图 12.4 所示，在其中我们添加了两个类层次：


    1. `Book` 划分为 `TextBook` 和 `Biography` 的不相交（但不完全）的划分；

    2. `Person` 划分为 `Author` 和 `Employee` 的重叠且不完全的划分。


    ![](img/b_9783110500325-012_fig_004.png)


    图 12.4：具有两个层次结构的模型。


    ### 12.3 内涵与扩展


    对象类型的 `intension`（内涵）由其属性、关联和约束的集合给出。对象类型的 `extension`（扩展）是实例化该对象的集合，也称为其 `population`（种）。


    我们存在以下对立关系：超类的所有特征都包含子类的内涵中（内延包含），子类的所有实例都在超类的扩展中（外延包含）。这种形式结构已在形式分析中得到了研究。


    由于内涵/扩展对立，我们可以通过两种不同的方式特化给定的类型：


    1. 通过在新子类中添加特征来扩展类型（例如添加属性 `subjectArea`）。

    2. 通过添加约束来限制类型（例如定义 TextBook 为“数学”）。


    典型的面向对象语言如 `Java` 和 `C#` 只支持第一种（扩展其内涵），而 `XML Schema` 和 `SQL99` 也支持第二种。


    ### 12.4 类型层次结构


    类型层次（或 `class hierarchy`）由两个或多个类型组成，其中一个是 `root`（根）或顶层类型，所有其他类型至少有一个超类。当所有非根类型都有唯一的直接超类时，该类型层次是
    `single-inheritance hierarchy`（单继承层次），否则是 `multiple-inheritance hierarchy`（多继承层次）。例如，在下面的图
    12.5 中，`Vehicle` 类是单继承层次的根类，而图 12.6 展示了多继承层次的示例，因为 `AmphibianVehicle` 有两个直接超类：`LandVehicle`
    和 `WaterVehicle`。


    ![](img/b_9783110500325-012_fig_005.png)


    图 12.5：具有根类 `Vehicle` 的类层次结构。


    类层次中最简单的情况（只有一层子类型划分）在 UML 中被称为 `generalization set`（泛化集），但可能更自然地被称为 `segmentation`（划分）。如果所有子类的扩展并集等于超类的扩展，则该划分是
    `complete`（完全的）（换句话说，如果超类的所有实例都实例化某个子类）。如果所有子类之间两两不相交，则该划分是 `disjoint`（不相交的）（换句话说，如果没有超类实例实例化超过一个子类）。否则，被称为
    `overlapping`（重叠的）。完全且不相交的划分被称为 `partition`（分区）。


    '
- fmt: '

    In a class diagram, we can express these constraints by annotating the shared
    generalization arrow with the keywords `complete` and `disjoint` enclosed in braces.
    For instance, the annotation of a segmentation with `{complete, disjoint}` indicates
    that it is a partition. By default, whenever a segmentation does not have any
    annotation, like the segmentation of `Vehicle` into `LandVehicle` and `WaterVehicle`
    in [Figure 12.6](#9783110500240_011618.xhtml_b_9783110500325-012_fig_006) above,
    it is `{incomplete, overlapping}`.


    ![](graphic/converted/b_9783110500325-012_fig_006.png)


    Figure 12.6: A multiple inheritance hierarchy.


    An information model may contain any number of class hierarchies.


    ### 12.5 Kinds and Roles


    In order to better understand the different categories of object types and subtypes
    in natural language statements about the real world and in information models,
    we can distinguish between `sortal` and non-sortal, and between `rigid` and non-rigid
    object types, as proposed by Giancarlo Guizzardi in his theory of object type
    categories presented in Chapter 4 of Ontological foundations for structural conceptual
    models.


    An object type is `sortal` if it has a uniform identity condition for its instances.
    Such a condition defines the property (or set of properties) that no two instances
    can have in common, without being the same object. An example of a sortal object
    type is `Person` since all its instances (people) are identifiable by a set of
    properties related to their birth (born when, where and to whom). `Book` is an
    example of a non-sortal object type because it contains instances (e.g., textbooks
    and self-published novels) that are identified in different ways.


    An object type is `rigid` if its instances cannot cease to be of that type without
    ceasing to exist (or altering their identity). `Person` is an example of a rigid
    object type, while `Employee` is not rigid. A segmentation is called `rigid` if
    all segment subclasses are rigid.


    A `kind` is a rigid sortal object type. Examples of kinds are `TextBook` and `Person`.
    A `role` is a sortal object type `R` classifying all instances of a kind `K` that
    participate in a relationship (of a certain type `A`) with an instance of an object
    type `O`. Notice that `R` is a non-rigid subtype of `K` since its instances do
    not cease to exist when they happen to cease instantiating `R` because they no
    longer participate in a relationship of type `A` with an instance of type `O`.


    For instance, `Employee` is an example of a role since it is a sortal object type
    classifying all instances of `Person` that participate in an employment relationship
    with an instance of type `Enterprise`.


    ### 12.6 The Class Hierarchy Merge Design Pattern


    Consider the simple class hierarchy of the design model in [Figure 12.1](#9783110500240_011618.xhtml_b_9783110500325-012_fig_001)
    above, showing a disjoint segmentation of the class `Book`. In such a case, whenever
    there is only one level (or there are only a few levels) of subtyping and each
    subtype has only one (or a few) additional properties, it’s an option to re-factor
    the class hierarchy by merging all the additional properties of all subclasses
    into an expanded version of the root class such that these subclasses can be dropped
    from the model, leading to a simplified model.


    This `Class Hierarchy Merge` design pattern comes in two forms. In its simplest
    form, the segmentations of the original class hierarchy are `disjoint`, which
    allows to use a `single-valued` category attribute for representing the specific
    category of each instance of the root class corresponding to the unique subclass
    instantiated by it. When the segmentations of the original class hierarchy are
    not disjoint, that is, when at least one of them is `overlapping`, we need to
    use a `multi-valued` category attribute for representing the set of types instantiated
    by an object. We only discuss the simpler case of `Class Hierarchy Merge` re-factoring
    for disjoint segmentations, where we take the following re-factoring steps:


    1. Add an `enumeration datatype` that contains a corresponding enumeration literal
    for each segment subclass. In our example, we add the enumeration datatype `BookCategoryEL`.


    2. Add a category attribute to the root class with this enumeration as its range.
    The category attribute is mandatory [1], if the segmentation is complete, and
    optional [0..1], otherwise. In our example, we add a category attribute with range
    `BookCategoryEL` to the class `Book`. The category attribute is optional because
    the segmentation of `Book` into `TextBook` and `Biography` is incomplete.


    3. Whenever the segmentation is `rigid`, we designate the category attribute as
    `frozen`, which means that it can only be assigned once by setting its value when
    creating a new object, but it cannot be changed later.


    4. Move the properties of the segment subclasses to the root class, and make them
    `optional`. We call these properties, which are typically listed below the category
    attribute, `segment properties`. In our example, we move the attributes `subjectArea`
    from `TextBook` and `about` from `Biography` to `Book`, making them `optional`,
    that is [0..1].


    5. Add a constraint (in an invariant box attached to the expanded root class rectangle)
    enforcing that the optional subclass properties have a value if and only if the
    instance of the root class instantiates the corresponding category. In our example,
    this means that an instance of `Book` is category `TextBook` if and only if its
    `subjectArea` has a value, and it is category `Biography` if and only if its `about`
    has a value.


    6. Drop the segment subclasses from the model.


    In the case of our example, the result of this design-factoring is shown in [Figure
    12.7](#9783110500240_011618.xhtml_b_9783110500325-012_fig_007) below. Notice that
    the constraint (or “invariant”) represents a logical sentence where the logical
    operator `IFF` stands for the logical equivalence “if and only if” and the property
    condition `prop=undefined` tests if the property `prop` does not have a value.


    ![](graphic/converted/b_9783110500325-012_fig_007.png)


    Figure 12.7: The result of applying the Class Hierarchy Merge design pattern.


    ### 12.7 Subtyping and Inheritance in Computational Languages


    Subtyping and inheritance have been supported in *Object-Oriented Programming
    (OOP)*, in database languages (such as *SQL99*), in the XML schema definition
    language *XML Schema*, and in other computational languages, in various ways and
    to different degrees. At its core, subtyping in computational languages is about
    defining type hierarchies and the inheritance of features: properties, constraints
    and methods in OOP; table columns and constraints in SQL99; elements, attributes
    and constraints in XML Schema.


    In general, it is desirable to have support for *multiple classification* and
    *multiple inheritance* in type hierarchies. Both language features are closely
    related and are considered to be advanced features, which may not be needed in
    many applications or can be dealt with by workarounds.


    `Multiple classification` means that an object has more than one direct type.
    This is mainly the case when an object plays multiple roles at the same time,
    and therefore directly instantiates multiple classes defining these roles.


    `Multiple inheritance` is typically also related to role classes. For instance,
    a student assistant is a person playing both the role of a student and the role
    of an academic staff member, so a corresponding OOP class `StudentAssistant` inherits
    from both role classes `Student` and `AcademicStaffMember`. In a similar way,
    in our example model above, an `AmphibianVehicle` inherits from both role classes
    `LandVehicle` and `WaterVehicle`.


    #### 12.7.1 Subtyping and Inheritance in OOP

