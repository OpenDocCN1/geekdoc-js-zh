    \ (e.g, Book in our example). It provides the strategy parameter with the value\
    \ InheritanceType.SINGLE_TABLE. The @DiscriminatorColumn annotation specifies\
    \ the name of the table column storing the values that discriminate between different\
    \ types of subclasses (TextBook and Biography, in our example).\n\nUnfortunately,\
    \ we cannot use our BookCategoryEL enumeration for defining the type of the discriminator\
    \ column, because Java expressions like BookCategoryEL.TEXTBOOK.name() are not\
    \ constant, so a Java compiler exception is thrown. Instead, we use DiscriminatorType.STRING.\
    \ The @DiscriminatorValue annotation specifies a unique value to be stored in\
    \ the discriminator column of table rows representing an instance of the given\
    \ class.\n\nFurther, we define the subtypes TextBook and Biography:\n\n```\n @Entity\
    \ @Table( name=\"textbooks\")\n@DiscriminatorValue( value=\"TEXTBOOK\")\n@ManagedBean(\
    \ name=\"textBook\") @ViewScoped\npublic class TextBook extends Book {\n     \
    \ @Column( nullable=false) @NotNull(\n              message=\"A subject area value\
    \ is required\")\n      String subjectArea;\n      // constructors, set, get and\
    \ other methods\n     …\n}\n```\n\nTextBook and Biography are subclasses of Book,\
    \ so we define them with extends Book. For each subclass, we add a @DiscriminatorValue\
    \ annotation with a value from the BookCategoryEL enumeration.\n\n#### 14.2.4 STI\
    \ Database Schema\n\nAs a result of the annotation\n\n```\n @Inheritance( strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\nonly one database table is used for representing a class hierarchy. This\
    \ table contains the columns corresponding to all the properties of all the classes\
    \ from the hierarchy plus the discriminator column. In our example, the books\
    \ table contains the following columns: isbn, title, year, subjectArea, about\
    \ and category. The simplified corresponding SQL-DDL code internally used to generate\
    \ the books table for our application is shown below:\n\n```\n CREATE TABLE IF\
    \ NOT EXISTS `books` (\n     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255)\
    \ NOT NULL,\n     `YEAR` int(11) NOT NULL,\n     `SUBJECTAREA` varchar(255) DEFAULT\
    \ NULL,\n     `ABOUT` varchar(255) DEFAULT NULL,\n     `category` varchar(16)\
    \ DEFAULT NULL,\n)\n```\n\n#### 14.2.5 Write the View And Controller Code\n\n\
    The user interface (UI) consists of a start page that allows navigating to the\
    \ data management pages (in our example, to index.xhtml in the folder WebContent/views/books/).\
    \ Such a data management page contains four sections: *retrieve/list all books*,\
    \ *create book*, *update book* and *delete book*.\n\n##### 14.2.5.1 Summary\n\n\
    We have to take care of handling the category discriminator and the subjectArea\
    \ and about segment properties both in the “List all books” use case as well as\
    \ in the “Create book” and “Update book” use cases by\n\n1.  Adding a segment\
    \ information column (“Special type”) to the display table of the *Retrieve/List\
    \ All* use case in retrieveAndListAll.xhtml in the folder WebContent/views/books/.\n\
    \n2.  Adding a “Special type” select control, and corresponding form fields for\
    \ all segment properties, in the forms of the “Create book” and “Update book”\
    \ use cases in create.xhtml and update.xhtml in the folder WebContent/views/books/.\
    \ Segment property form fields are only displayed, and their validation occurs\
    \ only when a corresponding book category has been selected.\n\n##### 14.2.5.2 Add\
    \ a Segment Information Column in *Retrieve/List All*\n\nWe add a “Special type”\
    \ column to the display table of the “List all books” use case in books.html:\n\
    \n```\n <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n    …\n   \
    \ <h:column>\n        <f:facet name=\"header\">Special type</f:facet>\n      \
    \  #{b.getClass().getSimpleName() != 'Book' ?\n              b.getClass().getSimpleName()\
    \ : ''}\n     </h:column>\n</h:dataTable>\n```\n\nA conditional expression is\
    \ used to check if the Java bean class name is Book, in which case we don’t show\
    \ it, or if it is something else (e.g. TextBook or Biography), and then it is\
    \ shown. This expression also shows how you can call/use various Java bean methods,\
    \ not only custom methods.\n\n##### 14.2.5.3 Add a “Special Type” Select Control\
    \ in *Create* and *Update*\n\nIn both use cases, we need to allow selecting a\
    \ special category of book (‘textbook’ or ‘biography’) with the help of a select\
    \ control in a *panel grid* element:\n\n```\n <h:panelGrid id=\"bookPanel\" columns=\"\
    3\">\n    …\n    <h:outputText value=\"Special type: \" />\n    <h:selectOneMenu\
    \ id=\"bookType\" value=\"#{viewScope.bookTypeVal}\">\n        <f:selectItem itemLabel=\"\
    ---\"/>\n        <f:selectItems value=\"#{book.typeItems}\" />\n        <f:ajax\
    \ event=\"change\" execute=\"@this\"       render=\"textBookPanel            \
    \   biographyBookPanel standardBookPanel\"/>\n     </h:selectOneMenu>\n     <h:message\
    \ for=\"bookType\" errorClass=\"error\" />\n</h:panelGrid>\n```\n\nIn the select\
    \ control, three alternative *panel groups* are referenced:\n\n1.  A “standardBookPanel”:\n\
    \n```\n <h:panelGroup id=\"standardBookPanel\">  \n    <h:commandButton value=\"\
    Create\"\n            rendered=\"#{viewScope.bookTypeVal == null}\"\n        \
    \    action=\"#{bookController.create( book.isbn,\n           book.title, book.year)}\"\
    \ />\n</h:panelGroup>\n```\n\n1.  A “textBookPanel”:\n\n```\n <h:panelGroup id=\"\
    textBookPanel\">  \n     <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\
    \n                columns=\"3\">\n          <h:outputText value=\"Subject area:\
    \ \" />\n           <h:inputText id=\"subjectArea\" value=\"#{textBook.subjectArea}\"\
    />\n            <h:message for=\"subjectArea\" errorClass=\"error\" />\n     \
    \  </h:panelGrid>\n        <h:commandButton value=\"Create\"\n               \
    \      rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n                 \
    \     action=\"#{textBookController.create( book.isbn, book.title,\n         \
    \                     book.year, textBook.subjectArea)}\" />\n</h:panelGroup>\n\
    ```\n\n1.  A “biographyBookPanel”:\n\n```\n <h:panelGroup id=\"biographyBookPanel\"\
    >  \n    <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'BIOGRAPHY'}\"\n \
    \             columns=\"3\">\n        <h:outputText value=\"About: \" />\n   \
    \     <h:inputText id=\"about\" value=\"#{biographyBook.about}\"/>\n        <h:message\
    \ for=\"about\" errorClass=\"error\" />\n    </h:panelGrid>\n    <h:commandButton\
    \ value=\"Create\"                        rendered=\"#{viewScope.bookTypeVal ==\
    \ 'BIOGRAPHY'}\"\n                action=\"#{biographyBookController.create( book.isbn,\n\
    \                         book.title, book.year, biographyBook.about)}\" />\n\
    </h:panelGroup>\n```\n\nThere are a few important remarks on the above code:\n\
    \n*   the h:selectOneMenu is used to create a single selection list which is populated\
