    \n### 2.5.2 Code Each Model Class as ES2015\n\nEach class `C` of the JS model\
    \ is coded as ES2015 class with the same name `C` and a constructor having a single\
    \ record parameter, which specifies a field for each (non-derived) property. The\
    \ range of these properties should be indicated in a comment.\n\nIn the constructor\
    \ body, we assign the fields of the record parameter to corresponding properties.\
