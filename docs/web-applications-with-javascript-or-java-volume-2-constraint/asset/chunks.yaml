  trans: "\n\n*   可以使用 `rendered` 属性来条件地渲染 facelet 组件。JSF EL 表达式必须返回 true 或 false，这决定了生成的\
    \ HTML 元素是否成为 HTML DOM 的一部分。请注意，条件表达式是在服务器端评估的。我们使用这种方法来隐藏或显示对应不同书籍类型的输入表单元素（例如，`TextBook`\
    \ 拥有 `subjectArea` 属性，而 `Biography` 拥有 `about` 属性）。\n\n*   配合 `f:ajax` 使用的 `render`\
    \ 属性指定了更新哪些 JSF 组件。这是因为在 AJAX 调用后会应用实时的 DOM 更改（客户端，而非服务器端）。\n\n*   `AJAX` 用于在特殊类型选择列表字段发生变化（即选择了某项）时提交表单进行重新评估。结果是它强制了对应三类书籍情况（普通书籍、教科书和传记）的三个面板的重新渲染。通过使用\
    \ `execute=\"@this\"`，我们强制在服务器端对表单进行重新评估，因此生成的 HTML DOM 结构将根据各种 JSF 元素 `rendered`\
    \ 属性指定的条件包含更改。请注意，具有条件渲染表达式的 JSF 元素必须是另一个始终位于 DOM 中的 JSF 元素的子元素。\n\n*   `h:panelGroup`\
    \ 用于定义一组显示或隐藏的元素。\n\n*   `h:commandButton` 的 `action` 属性不能与条件表达式一起，因此我们必须创建三个命令按钮，每个对应一种情况：创建/更新书籍、教科书\
    \ (`TextBook`) 或传记 (`Biography`)。这将调用相应控制器类的 `create` 方法（即 `BookController`、`TextBookController`\
    \ 或 `BiographyController`）。\n\n*   由于我们对应的 Java Bean 类中没有为特殊类型（类别）设置相应的属性，我们可以使用\
    \ JSF 变量来存储单选列表的值，然后在各种元素的 `rendered` 条件中使用该变量。因此，对于 `h:selectOneMenu`，`value=\"\
    ##{viewScope.bookTypeVal}\"` 指定了我们使用一个名为 `bookTypeVal` 的“即时”定义属性，它是视图作用域（view\
    \ scope）内部 JSF 对象的一部分。我们也可以在视图作用域之外定义此类变量，例如 `value=\"##{bookTypeVal}\"`，但在这种情况下它们是请求作用域的（request\
    \ scoped），因此在提交表单后值会丢失，`rendered` 条件将无法评估。\n\n对于类层次结构中的类，定义了一个对应的控制器类。它包含了特定的创建、更新和删除方法。共享方法（如\
    \ `getAllObjects`）由顶层类的控制器定义（例如，对于我们的示例，这是 `BookController`）。请参考示例应用程序获取有关如何实现控制器类及相应\
    \ CRUD 方法的细节。`Update Book` 用例与 `Create Book` 用例非常相似。`Delete Book` 用例保持不变。\n\n\
    ### 14.3 案例研究 2：使用连接继承实现类层次结构\n\n我们案例研究的起点是图 2.8 所示的设计模型。在接下来的章节中，我们将展示如何使用“类层次结构合并”（Class\
    \ Hierarchy Merge）设计模式消除 `Manager` 类，以及如何借助 JPA 实现 `Person` 层次结构并使用“连接多表继承”（Joined,\
    \ Multiple Table Inheritance）存储。\n\n#### 14.3.1 构建 Java 实体类模型\n\n我们借助 Java `Entity`\
    \ 类模型来设计示例应用程序的模型类，该模型是从“设计模型”通过推导出来的，本质上是保留了泛化箭头，并为每个类添加了 `getters` 和 `setters`。然而，在我们的示例应用程序中，自然的做法是将“类层次结构合并”设计模式应用到\
    \ `Employee` 的划分上，通过消除 `Manager` 子类来简化数据模型。这导致了图 14.2 所示的模型。请注意，我们还做了两个技术决策：\n\
    \n1. 我们将 `Person` 划分为 `Employee` 和 `Author` 声明为“互斥的”（disjoint）且“完全的”（complete），这意味着任何人要么是员工是作者。由于\
    \ Java 不支持多重分类，我们无法在 Java 中根据需要实现一个重叠的划分。\n\n2. 我们将 `Person` 变成一个“抽象类”（abstract\
    \ class），这意味着它不能有直接实例，只能通过其子类 `Employee` 和 `Author` 间接实例化。这一技术设计决策与以下事实兼容：任何 `Person`\
    \ 都是 `Employee` 或 `Author`（或两者都是），因此不需要任何对象来直接实例化 `Person`。\n\n图 14.2：Person 层次结构的\
    \ Java 实体类模型。\n\n#### 14.3.2 新问题\n\n与图 14.1 所示所示第一个案例研究模型相比，我们必须使用 JPA 注解定义 `Employee`\
    \ 与 `Person` 之间以及 `Author` 与 `Person` 之间的类别关系。在 UI 代码中我们必须处理：\n\n1. 为相应的 `Author`\
    \ 和 `Employee` 模型类添加视图（位于 `WebContent/views/authors` 和 `WebContent/views/employees`\
    \ 文件夹）和控制器类（`AuthorController` 和 `EmployeeController`）。\n\n2. 处理 `Manager` 情况，通过在\
    \ `WebContent/views/books/create.xhtml` 和 `WebContent/views/books/update.xhtml`\
    \ 的“创建书籍”和“更新书籍”用例中添加“特殊类型”选择控件。划分表单字段（例如我们示例中的 `department`）仅在选择了相应的员工类型时才会显示并进行验证。\n\
    \n#### 14.3.3 编写 Java 实体类模型的模型类\n\n图 14.2 所示的 Java 实体类模型是通过使用 JavaBeans `Person`、`Employee`\
    \ 和 `Author` 以及枚举类型 `EmployeeCategoryEL` 编写的。\n\n##### 14.3.3.1 定义类别关系\n\n我们使用\
    \ JPA 注解定义 `Employee` 与 `Person` 之间以及 `Author` 与 `Person` 之间的类别关系。首先，我们如下所示创建\
    \ `Person` 类：\n\n```\n @Entity @Table(name=\"persons\")\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    @DiscriminatorColumn(name=\"category\",\n      discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\npublic abstract class Person {\n     @Id @NotNull(message=\"A person\
    \ ID is required!\")\n     private Integer personId;\n     @NotNull(message=\"\
    A name is required!\") @Column(nullable=false)\n     private String name;\n  \
    \  …\n}\n```\n\n与用例 1 中所示的 `Book` 层次结构相比，`@Inheritance` 注解现在定义了 `strategy=InheritanceType.JOINED`。这意味着对于继承体系中的每个类都使用一个数据库表。`@DiscriminatorColumn(name=\"\
    category\")` 指定了顶层层次类（即 `Person`）对应表（即 `persons`）中的列，用于存储识别每个条目（表行）类型的判别值。\n\n\
    请注意 Java 类 `Person` 被声明为抽象的，这意味着它不能被初始化，相反我们可以初始化派自它的子类（即 `Employee` 和 `Author`）。这意味着我们不需要声明\
    \ `@DiscriminatorValue`，因为数据库表中没有存储 `Person` 的直接实例。\n\n此外，我们如下所示定义 `Author` 类：\n\
    \n```\n @Entity @Table(name=\"authors\")\n@DiscriminatorValue( value=\"AUTHOR\"\
    )\n@ManagedBean(name=\"author\") @ViewScoped\npublic class Author extends Person\
    \ {\n     @NotNull(message=\"A biography is required!\")\n     private String\
    \ biography;\n     …\n}\n```\n\n"
- fmt: "\nThe `Author` class inherits `Person`, therefore the `get` and `set` methods\
    \ corresponding to `personId` and `name` properties are available. The `@DiscriminatorValue(value=\"\
    AUTHOR\")` specifies that the column category of the `persons` table stores the\
    \ value `AUTHOR` for every entry which comes from persisting an `Author` instance.\n\
    \nFinally, we define the `Employee` class:\n\n```\n @Entity @Table(name=\"employees\"\
    )\n@DiscriminatorValue(value=\"EMPLOYEE\")\n@ManagedBean(name=\"employee\") @ViewScoped\n\
    public class Employee extends Person {\n     @Column( nullable=false)\n     @NotNull(\
    \ message=\"An employee ID is required!\")\n     private Integer empNo;\n    \
    \ @Column( nullable=false, length=32)\n     @Enumerated( EnumType.STRING)\n  \
    \   private EmployeeCategoryEL type;\n     @Column( nullable=true, length=64)\n\
    \     private String department;\n     …\n}\n```\n\nNotice the `type` property\
    \ used to identify the `Employee` type, such as `Manager`. Its values are defined\
    \ by the `EmployeeCategoryEL` enumeration.\n\n### 14.3.3.2 Database Schema for\
    \ Joined Table Class Hierarchy\n\nAs a result of the annotation\n\n```\n @Inheritance(\
    \ strategy = InheritanceType.JOINED)\n```\n\nfor each class in the inheritance\
    \ hierarchy, one database table is created. The corresponding simplified SQL-DDL\
    \ scripts used by JPA to create the `persons`, `authors` and `employees` tables\
    \ are shown below:\n\n```\n CREATE TABLE IF NOT EXISTS `persons` (\n      `PERSONID`\
    \ int(11) NOT NULL,\n      `category` varchar(16) DEFAULT NULL,\n      `NAME`\
    \ varchar(255) NOT NULL\n);\nCREATE TABLE IF NOT EXISTS `authors` (\n      `PERSONID`\
    \ int(11) NOT NULL,\n      `BIOGRAPHY` varchar(255) DEFAULT NULL\n);\nADD CONSTRAINT\
    \ `FK_authors_PERSONID` FOREIGN KEY (`PERSONID`)\n       REFERENCES `persons`\
    \ (`PERSONID`);\nCREATE TABLE IF NOT EXISTS `employees` (\n      `PERSONID` int(11)\
    \ NOT NULL,\n      `DEPARTMENT` varchar(64) DEFAULT NULL,\n      `EMPNO` int(11)\
    \ NOT NULL,\n      `TYPE` varchar(32) DEFAULT NULL\n);\nADD CONSTRAINT `FK_employees_PERSONID`\
    \ FOREIGN KEY (`PERSONID`)\n       REFERENCES `persons` (`PERSONID`);\n```\n\n\
    As we can see, every table contains the direct properties as defined by the corresponding\
    \ Java bean class. Additionally, the `authors` and `employees` tables are created\
    \ with a foreign key constraing for the `PERSONID` column refering to to `PERSONID`\
    \ column from the `persons` table.\n\n### 14.3.4 Write the View and Controller\
    \ Code\n\nIn the user interface, for every Java bean class, we have a controller\
    \ class which contains the create, update and delete CRUD methods. The `PersonController`\
    \ class is defined as abstract and contains the `checkPersonIdAsId` method, which\
    \ is common to all subclasses. The `AuthorController` and `EmployeeController`\
    \ inherits the `PersonController`.\n\nFor every non-abstract entity class in the\
    \ inheritance hierarchy we define a set of views corresponding to CRUD operations.\
    \ For example, in the case of `Author` we have the files `retrieveAndListAll.xhtml`,\
    \ `create.xhtml`, `update.xhtml`, and `delete.xhtml` in the folder `WebContent/views/authors/`.\
    \ In the case of `Employee`, the `Retrieve/List All Employees` use case requires\
    \ to display the `Special type of employee` column:\n\n```\n <h:column>\n  <f:facet\
    \ name=\"header\">Special type of employee</f:facet>\n  #{e.type != null ? e.type.label.concat(\"\
    \ of \").concat(\n                                        e.department).concat(\"\
    \ department\") : \"\"}\n</h:column>\n```\n\nNotice that within EL expressions\
    \ we cannot use the `+` (plus) operator for concatenating strings. EL allows the\
    \ `+` operator to be used only for numeric addition. However, we can use the `concat`\
    \ method instead.\n\n### 14.4 Run the App\n\nFor running your application, you\
    \ may first have to stop your Tomcat/TomEE server (with `bin/shutdown.bat` for\
    \ Windows or `bin/shutdown.sh` for Linux). Next, download and unzip our ZIP archive\
    \ file containing all the source code of the application and also the `ANT` script\
    \ file that you have to edit (modify the `server.folder` property value). Now,\
    \ execute the following command in your console or terminal:\n\n```\nant deploy\
    \ -Dappname=SubtypingApp\n```\n\nFinally, start your Tomcat web server (by using\
    \ `bin/startup.bat` for Windows OS or `bin/startup.sh` for Linux). Please be patient,\
    \ this can take some time depending on the speed of your computer. It will be\
    \ ready when the console displays the following message: *INFO: Initializing Mojarra\
    \ [some library versions and paths are shonw here] for context `/subtypingapp’*.\
    \ Finally, open a web browser and type:\n\n```\n http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml\n\
    ```\n\n### 15 Subtyping Practice Projects\n\n### 15.1 Project 1 – Person Types\
    \ and Movie Types\n\nThe purpose of the app to be built is managing information\
    \ about movies as well as their directors and actors whre two types of movies\
    \ are distinguished: biographies and episodes of TV series, as shown in the following\
    \ model: ![](graphic/converted/b_9783110500325-015_ingr_001.png)\n\nCode the app\
    \ by following our guidelines.\n\nMake sure that your pages comply with the XML\
    \ syntax of HTML5, and that your JavaScript code complies with our Coding Guidelines\
    \ (and is checked with JSHint).\n\n# Glossary\n\n| **C** | |\n| :--- | :--- |\n\
    | CRUD | CRUD is an acronym for *Create*, *Read/List*, *Update*, *Delete*, which\
    \ denote four basic data management operations to be performed by any software\
    \ application. |\n| Cascading Style Sheets | CSS is used for defining the presentation\
    \ style of web pages by telling the browser how to render their HTML (or XML)\
    \ contents: which layout, fonts, colors, animations. Normally, these settings\
    \ are made in a separate CSS file that is associated with an HTML file via a special\
    \ link in the HTML’s head. |\n| **D** | |\n| Document Object Model) | The DOM\
    \ is an abstract API for retrieving and modifying nodes and elements of HTML documents.\
    \ All web programming languages have DOM bindings that realize the DOM. |\n| Domain\
    \ Name System | The DNS translates user-friendly domain names to IP addresses\
    \ that allow to locate a host computer on the Internet. |\n| **E** | |\n| ECMAScript\
    \ | A standard for JavaScript defined by the industry organization “Ecma”. |\n\
    | Extensible Markup Language | XML allows to mark up the structure of all kinds\
    \ of documents, data files and messages in a machine-readable way. XML may also\
    \ be human-readable, if the tag names used are self-explaining. XML is based on\
    \ Unicode. SVG and MathML are based on XML, and there is an XML-based version\
    \ of HTML. |\n| | XML provides a syntax for expressing structured information\
    \ in the form of an *XML document* with *elements* and their *attributes*. The\
    \ specific elements and attributes used in an XML document can come from any vocabulary,\
    \ such as public standards or user-defined XML formats. |\n| **H** | |\n| Hypertext\
    \ Markup Language | HTML allows marking up (or describing) the structure of a\
    \ human-readable web document or web user interface. The XML-based version of\
    \ HTML, which is called “XHTML5”, provides a simpler and cleaner syntax compared\
    \ to traditional HTML. |\n| Hypertext Transfer Protocol | HTTP is a stateless\
    \ request/response protocol based on the Internet technologies TCP/IP and DNS,\
    \ using human-readable text messages for the communication between web clients\
    \ and web servers. The main purpose of HTTP has been to allow fetching web documents\
    \ identified by URLs from a web browser, and invoking the operations of a back-end\
    \ web application program from an HTML form executed by a web browser. More recently,\
    \ HTTP is increasingly used for providing web APIs and web services. |\n| **I**\
    \ | |\n| IANA | IANA stands for *Internet Assigned Numbers Authority*, which is\
    \ a subsidiary of ICANN responsible for names and numbers used by Internet protocols.\
    \ |\n| ICANN | ICANN stands for *Internet Corporation of Assigned Names and Numbers*,\
    \ which is an international nonprofit organization that maintains the domain name\
    \ system. |\n"
  raw: "The Author class inherits Person, therefore the get and set methods corresponding\
    \ to personId and name properties are available. The @DiscriminatorValue(value=“AUTHOR”)\
    \ specifies that the column category of the persons table stores the value AUTHOR\
    \ for every entry which comes from persisting an Author instance.\n\nFinally,\
    \ we define the Employee class:\n\n```\n @Entity @Table(name=\"employees\")\n\
    @DiscriminatorValue(value=\"EMPLOYEE\")\n@ManagedBean(name=\"employee\") @ViewScoped\n\
    public class Employee extends Person {\n     @Column( nullable=false)\n     @NotNull(\
    \ message=\"An employee ID is required!\")\n     private Integer empNo;\n    \
    \ @Column( nullable=false, length=32)\n     @Enumerated( EnumType.STRING)\n  \
    \   private EmployeeCategoryEL type;\n     @Column( nullable=true, length=64)\n\
    \     private String department;\n     …\n}\n```\n\nNotice the type property used\
    \ to identify the Employee type, such as Manager. Its values are defined by the\
    \ EmployeeCategoryEL enumeration.\n\n##### 14.3.3.2 Database Schema for Joined\
    \ Table Class Hierarchy\n\nAs a result of the annotation\n\n```\n @Inheritance(\
    \ strategy = InheritanceType.JOINED)\n```\n\nfor each class in the inheritance\
    \ hierarchy, one database table is created. The corresponding simplified SQL-DDL\
    \ scripts used by JPA to create the persons, authors and employees tables are\
    \ shown below:\n\n```\n CREATE TABLE IF NOT EXISTS `persons` (\n      `PERSONID`\
    \ int(11) NOT NULL,\n      `category` varchar(16) DEFAULT NULL,\n      `NAME`\
    \ varchar(255) NOT NULL\n);\nCREATE TABLE IF NOT EXISTS `authors` (\n      `PERSONID`\
    \ int(11) NOT NULL,\n      `BIOGRAPHY` varchar(255) DEFAULT NULL\n);\nADD CONSTRAINT\
    \ `FK_authors_PERSONID` FOREIGN KEY (`PERSONID`)\n       REFERENCES `persons`\
    \ (`PERSONID`);\nCREATE TABLE IF NOT EXISTS `employees` (\n      `PERSONID` int(11)\
    \ NOT NULL,\n      `DEPARTMENT` varchar(64) DEFAULT NULL,\n      `EMPNO` int(11)\
    \ NOT NULL,\n      `TYPE` varchar(32) DEFAULT NULL\n);\nADD CONSTRAINT `FK_employees_PERSONID`\
    \ FOREIGN KEY (`PERSONID`)\n       REFERENCES `persons` (`PERSONID`);\n```\n\n\
    As we can see, every table contains the direct properties as defined by the corresponding\
    \ Java bean class. Additionally, the authors and employees tables are created\
    \ with a foreign key constraing for the PERSONID column refering to to the PERSONID\
    \ column from the persons table.\n\n#### 14.3.4 Write the View and Controller\
    \ Code\n\nIn the user interface, for every Java bean class, we have a controller\
    \ class which contains the create, update and delete CRUD methods. The PersonController\
    \ class is defined as abstract and contains the checkPersonIdAsId method, which\
    \ is common to all subclasses. The AuthorController and EmployeeController inherits\
    \ the PersonController.\n\nFor every non-abstract entity class in the inheritance\
    \ hierarchy we define a set of views corresponding to CRUD operations. For example,\
    \ in the case of Author we have the files retrieveAndListAll.xhtml, create.xhtml,\
    \ update.xhtml, and delete.xhtml in the folder WebContent/views/authors/. In the\
    \ case of Employee, the *Retrieve/List All Employees* use case requires to display\
    \ the *Special type of employee* column:\n\n```\n <h:column>\n  <f:facet name=\"\
    header\">Special type of employee</f:facet>\n  #{e.type != null ? e.type.label.concat(\"\
    \ of \").concat(\n                                        e.department).concat(\"\
    \ department\") : \"\"}\n</h:column>\n```\n\nNotice that within EL expressions\
    \ we cannot use the + (plus) operator for concatenating strings. EL allows the\
    \ + operator to be used only for numeric addition. However, we can use the concat\
    \ method instead.\n\n### 14.4 Run the App\n\nFor running your application, you\
    \ may first have to stop your Tomcat/TomEE server (with bin/shutdown.bat for Windows\
    \ or bin/shutdown.sh for Linux). Next, download and unzip our ZIP archive file\
    \ containing all the source code of the application and also the ANT script file\
    \ that you have to edit (modify the server.folder property value). Now, execute\
    \ the following command in your console or terminal:\n\n```\n ant deploy -Dappname=SubtypingApp\n\
    ```\n\nFinally, start your Tomcat web server (by using bin/startup.bat for Windows\
    \ OS or bin/startup.sh for Linux). Please be patient, this can take some time\
    \ depending on the speed of your computer. It will be ready when the console displays\
    \ the following message: *INFO: Initializing Mojarra [some library versions and\
    \ paths are shonw here] for context ‘/subtypingapp’*. Finally, open a web browser\
    \ and type:\n\n```\n http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml\n\
    ```\n\n## 15 Subtyping Practice Projects\n\n### 15.1 Project 1 – Person Types\
    \ and Movie Types\n\nThe purpose of the app to be built is managing information\
    \ about movies as well as their directors and actors whwre two types of movies\
    \ are distinguished: biographies and episodes of TV series, as shown in the following\
    \ model: ![](graphic/converted/b_9783110500325-015_ingr_001.png)\n\nCode the app\
    \ by following our guidelines.\n\nMake sure that your pages comply with the XML\
    \ syntax of HTML5, and that your JavaScript code complies with our Coding Guidelines\
    \ (and is checked with JSHint).\n\n# Glossary\n\n| **C** |\n\n| CRUD | CRUD is\
    \ an acronym for ***C****reate*, ***R****ead/Retrieve*, ***U****pdate*, ***D****elete*,\
    \ which denote the four basic data management operations to be performed by any\
    \ software application. |\n\n| Cascading Style Sheets | CSS is used for defining\
    \ the presentation style of web pages by telling the browser how to render their\
    \ HTML (or XML) contents: using which layout of content elements, which fonts\
    \ and text styles, which colors, which backgrounds, and which animations. Normally,\
    \ these settings are made in a separate CSS file that is associated with an HTML\
    \ file via a special link element in the HTML’s head element. |\n\n| **D** |\n\
    \n| Document Object Model) | The DOM is an abstract API for retrieving and modifying\
    \ nodes and elements of HTML or XML documents. All web programming languages have\
    \ DOM bindings that realize the DOM. |\n\n| Domain Name System | The DNS translates\
    \ user-friendly domain names to IP addresses that allow to locate a host computer\
    \ on the Internet. |\n\n| **E** |\n\n| ECMAScript | A standard for JavaScript\
    \ defined by the industry organization “Ecma International”. |\n\n| Extensible\
    \ Markup Language | XML allows to mark up the structure of all kinds of documents,\
    \ data files and messages in a machine-readable way. XML may also be human-readable,\
    \ if the tag names used are self-explaining. XML is based on Unicode. SVG and\
    \ MathML are based on XML, and there is an XML-based version of HTML. |\n\n| \
    \ | XML provides a syntax for expressing structured information in the form of\
    \ an *XML document* with *elements* and their *attributes*. The specific elements\
    \ and attributes used in an XML document can come from any vocabulary, such as\
    \ public standards or user-defined XML formats. |\n\n| **H** |\n\n| Hypertext\
    \ Markup Language | HTML allows marking up (or describing) the structure of a\
    \ human-readable web document or web user interface. The XML-based version of\
    \ HTML, which is called “XHTML5”, provides a simpler and cleaner syntax compared\
    \ to traditional HTML. |\n\n| Hypertext Transfer Protocol | HTTP is a stateless\
    \ request/response protocol based on the Internet technologies TCP/IP and DNS,\
    \ using human-readable text messages for the communication between web clients\
    \ and web servers. The main purpose of HTTP has been to allow fetching web documents\
    \ identified by URLs from a web browser, and invoking the operations of a back-end\
    \ web application program from an HTML form executed by a web browser. More recently,\
    \ HTTP is increasingly used for providing web APIs and web services. |\n\n| **I**\
    \ |\n\n| IANA | IANA stands for *Internet Assigned Numbers Authority*, which is\
    \ a subsidiary of ICANN responsible for names and numbers used by Internet protocols.\
    \ |\n\n| ICANN | ICANN stands for *Internet Corporation of Assigned Names and\
    \ Numbers*, which is an international nonprofit organization that maintains the\
    \ domain name system. |"
