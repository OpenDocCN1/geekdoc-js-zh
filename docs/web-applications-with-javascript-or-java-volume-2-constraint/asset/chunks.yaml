    ### 1.7 Eliminating Unidirectional Associations


    Since classical OO programming languages do not support associations as first
    class citizens, but only classes and reference properties representing unidirectional
    associations, we have to eliminate all explicit associations from general information
    design models for obtaining OO class models.


    #### 1.7.1 The Basic Elimination


    The starting point of our restricted association procedure is an information design
    model with various kinds of unidirectional associations, such as the model shown
    in [Figure 1.6](#9783110500240_000634.xhtml_b_9783110500325-001_fig_006). If the
    model still contains any non-directional associations, we first have to turn them
    into directional ones by making a decision on the ownership of their ends, as
    discussed in Section 1.5.


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source having:

    1. the same name as the association end, if there is any, otherwise it is set
    to the name of the target class (possibly pluralized, if the reference property
    is multi-valued);

    2. the target class as its range;

    3. the same multiplicity as the target end,

    4. a uniqueness constraint if the unidirectional association is functional.


    This replacement procedure is illustrated for the case of a unidirectional one-to-one
    association in [Figure 1.8](#9783110500240_000634.xhtml_b_9783110500325-001_fig_008),
    where the uniqueness constraint of the reference property `chairedCommittee` is
    expressed by the `{key}` modifier.


    ![](graphic/converted/b_9783110500325-001_fig_008.png)


    Figure 1.8: Turning a functional association end into a reference property.


    For the case of a unidirectional one-to-many association, [Figure 1.9](#9783110500240_000634.xhtml_b_9783110500325-001_fig_009)
    below provides an illustration of the association procedure. Here, the non-functional
    association end at the target class `Point` is turned into a corresponding reference
    property with name obtained as the pluralized form of the target class.


    ![](graphic/converted/b_9783110500325-001_fig_009.png)


    Figure 1.9: Turning a non-functional association end into a multi-valued reference
    property.


