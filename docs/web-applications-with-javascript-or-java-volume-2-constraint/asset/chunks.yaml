    \ BookCategoryEL = new Enumeration([ \"Textbook\", \"Biography\"]);\n```\n\n#####\
    \ 13.2.3.3 Code the Model Class Book\n\nWe code the model class Book in the form\
    \ of an ES2015 class definition where the category attribute as well as the segment\
