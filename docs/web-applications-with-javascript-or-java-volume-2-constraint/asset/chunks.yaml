  trans: "\n2. 每当可选的 `single-valued`（单值）主引用属性的值被 `unset` 时（例如通过为 `Book` 实例 `b` 的 `b.publisher`\
    \ 赋值 `null`），必须从派生反向引用属性的对应值中移除反向引用（例如从 `p.publishedBooks` 中移除 `b`），前提是派生反向引用属性是多值的；否则，派生反向引用属性的对应值必须被\
    \ unset 或更新；\n\n3. 每当通过添加方法向 `multi-valued`（多值）主引用属性的值`added` 引用时（例如向 `Book` 实例\
    \ `b` 的 `b.authors` 中添加 `Author` 引用 `a`），必须向派生反向引用属性的对应值赋值或添加反向引用（例如向 `a.authoredBooks`\
    \ 中添加 `b`）；\n\n4. 每当通过删除方法从 `multi-valued`（多值）主引用属性的值中`removed` 引用时（例如从 `Book`\
    \ 实例 `b` 的 `b.authors` 中移除对 `Author` 实例 `a` 的引用），必须从派生反向引用属性的对应值中移除反向引用（例如从 `a.authoredBooks`\
    \ 中移除 `b`），前提是派生反向引用属性是多值的；否则，派生反向引用属性的对应值必须被 unset 或更新；\n\n5. 每当具有单引用或多引用作为主引用属性值的对象`destroyed`\
    \ 时（例如当一个具有单引用 `b.publisher` 指向 `Publisher` 实例 `p` 的 `Book` 实例 `b` 被毁时），必须首先移除派生反向引用（例如通过从\
    \ `p.publishedBooks` 中移除 `b`）。\n\n注意，当创建一个具有单引用或多引用作为主引用属性的新对象时（例如一个具有单引用 `b.publisher`\
    \ 的新 `Book` 实例 `b`），其 setter 或 add 方法将被调用并负责派生反向引用的创建。\n\n2. 在 `UI code` 中，我们现在可以利用反向引用属性在\
    \ `list objects` 用例中更高效地创建反向关联对象的列表。例如，我们可以更高效地为每个出版社创建所有已出版书籍的列表。\n\n#### 9.2.2\
    \ 总结\n\n1. 将 Java `Entity` 类模型中的每个类编码为相应的实体类。\n2. 使用 JPA 注解 `@Id` 编码 `{id}` 属性修饰符。\n\
    3. 为任何表示引用属性功能类型的修饰符（如 `{manyToOne}`）编码相应的 JPA 注解，例如 `@ManyToOne`。\n4. 使用 Java\
    \ Bean Validation 注解（或自定义验证注解）编码模型中指定的完整性约束。\n5. 为多值属性编写 getters、setters 以及这些属性的\
    \ `add` 和 `remove` 方法。\n6. 将创建、检索、更新和删除存储管理操作编码为类级方法。\n7. 在创建和更新方法中处理好反向关系的管理。\n\
    \n这些步骤将在后续章节. 中进行更详细的讨论。\n\n#### 9.2.3 编码 Java 实体类模型中的每个类\n\n在 `Publisher` 类中，我们添加\
    \ `publishedBooks` 属性，并使用与 `Book` 类中 `@ManyToOne` 对应的 `@OneToMany` 注解，表示反向关系：\n\
    \n```\n @Entity\npublic class Publisher {   \n  …  \n  @OneToMany( fetch=FetchType.EAGER,\
    \ mappedBy=\"publisher\")  \n  private Set<Book> publishedBooks;  \n…\n}\n```\n\
    \n`Publisher::publishedBooks` 属性的 `@OneToMany` 注解的 `mappedBy` 参数指定了 `Book` 类中实现\
    \ `@ManyToOne` 关系的属性：\n\n```\n @Entity\npublic class Book {\n  …\n  @ManyToOne(\
    \ fetch=FetchType.EAGER)\n  @JoinColumn( name=\"PUBLISHER_NAME\")\n  private Publisher\
    \ publisher;\n  …\n}\n```\n\n在 `Author` 类中，我们添加了 `authoredBooks` 属性，并使用与 `Book`\
    \ 类中 `@ManyToMany` 对应的 `@ManyToMany` 注解，表示反向关系：\n\n```\n @Entity\npublic class\
    \ Author {\n…\n@ManyToMany( fetch=FetchType.EAGER, mappedBy=\"authors\")\nprivate\
    \ Set<Book> authoredBooks;\n…\n}\n```\n\n`Author` 类中 `authoredBooks` 引用属性的 `@ManyToMany`\
    \ 注解的 `mappedBy` 属性指定了 `Book` 类中反向引用属性的名称：\n\n```\n @Entity…\npublic class Book\
    \ {\n  …\n  @ManyToMany( fetch=FetchType.EAGER)\n  @JoinTable( name=\"books_authors\"\
    ,\n  joinColumns = {@JoinColumn( name=\"BOOK_ISBN\")},\n  inverseJoinColumns =\
    \ {@JoinColumn( name=\"AUTHOR_PERSONID\")})\nprivate Set<Author> authors;\n…\n\
    }\n```\n\n我们还使用 `@JoinTable` 注解来指定对多关系的连接表名称以及连接表对应的列名，例如，表名为 `books_authors`，列名为\
    \ `BOOK_ISBN` 和 `AUTHOR_PERSONID`。\n\n#### 9.2.4 编码 Setter 操作\n\n任何耦合到派生反向引用属性（实现双向关联）的引用属性\
    \ setter，现在也需要为反向属性的值赋值/添加/移除反向引用。此类 setter 的示例是下面的 `setPublisher` 方法：\n\n```\n\
    \ class class {\npublic void setPublisher( Publisher publisher) {\n// 从 publisher.publishedBooks\
    \ 移除书籍引用\nif (this.publisher != null) {\nthis.publisher.removeBook(this);\n}\n\
    // 向 publisher.publishedBooks 添加书籍\nif (publisher != null) {\npublisher.addBook(this);\n\
    }\nthis.publisher = publisher;\n}\n```\n\n#### 9.2.5 编码 Add 和 Remove 操作\n\n对于任何耦合到派生反向引用属性的多值引用属性，`add`\
    \ 和 `remove` 方法都必须为反向属性的值赋值/添加/移除反向引用。\n\n例如，对于用于实现 `Book` 和 `Author` 双向关联的耦合到\
    \ `Author:authoredBooks` 派生反向引用属性的多值引用属性 `Book::authors`，`addAuthor` 方法编码如下：\n\
    \n```\n public class Book {\n…\npublic void addAuthor( Author author) {\nif (this.authors\
    \ == null) {\nthis.authors = new HashSet<Author>();\n}\nif (!this.authors.contains(\
    \ author)) {\n// 添加新的作者引用\nthis.authors.add( author);\n// 添加派生反向引用\nauthor.addAuthoredBook(this);\n\
    }\n}\n}\n```\n\n对于删除操作 `removeAuthor`，我们获得以下代码：\n\n```\n public class Book {\n\
    …\npublic void removeAuthor( Author author) {\nif (this.authors != null && author\
    \ != null &&\nthis.authors.contains( author)) {\n// 删除作者引用\nthis.authors.remove(author);\n\
    // 删除派生反向引用\nauthor.removeAuthoredBook(this);\n}\n}\n}\n```\n\n记住，对于 Java 集合（如\
    \ `Set` 或 `List`），`contains` 方法通过对象的 `equals` 方法来比较两个对象。例如，为了在 `Set<Authors>`（如\
    \ `publishedBooks`）上使用 `contains` 方法，我们在 `Author` 类中实现下面的 `equals` 方法（如果两个作者的\
    \ `personId` 属性值相等，则它们相等）：\n\n```\n public class Author {\n…\n@Override\npublic\
    \ boolean equals( Object obj) {\nif (obj instanceof Author) {\nAuthor author =\
    \ (Author) obj;\nreturn ( this.personId.equals( author.personId));\n} else return\
    \ false;\n}\n…\n}\n```\n\n#### 9.2.6 处理删除依赖\n"
- fmt: "\nWhen a `Book` instance b, with a single reference `b.publisher` to a `Publisher`\
    \ instance and multiple references `b.authors` to `Author` instances, is destroyed,\
    \ the derived inverse references have to be removed first (e.g., by removing `b`\
    \ from `p.publishedBooks`). This is accomplished by calling the set methods for\
    \ the single and multi-valued properties with `null` parameter, e.g., `b.setPublisher(null)`\
    \ and `b.setAuthors(null)` within the `Book.delete` method:\n\n```\npublic class\
    \ Book {\n…\npublic static void delete(EntityManager em,\nUserTransaction ut,\
    \ String isbn) throws Exception {\nut.begin();\nBook b = em.find(Book.class, isbn);\n\
    b.setPublisher(null);\nb.setAuthors(null);\nem.remove(b);\nut.commit();\n}\n```\n\
    \nIn the same way, we have to take care of deleting the references to `Book` instances\
    \ when deleting a `Publisher` or `Author` instance:\n\n```\npublic class Author\
    \ {\n…\npublic static void delete(EntityManager em,\nUserTransaction ut, Integer\
    \ personId) throws Exception {\nut.begin();\nAuthor a = em.find(Author.class,\
    \ personId);\na.setAuthorBooks(null);\nem.remove(a);\nut.commit();\n}\n```\n\n\
    And, likewise,\n\n```\npublic class Publisher {\npublic static void delete(EntityManager\
    \ em,\nUserTransaction ut, String name) throws Exception {\nut.begin();\nPublisher\
    \ p = em.find(Publisher.class, name);\np.setPublishedBooks(null);\nem.remove(p);\n\
    ut.commit();\n}\n```\n\n### 9.2.7 Entity Managers and Cached Entities\n\nUnfortunately,\
    \ JPA does not provide automatic maintenance of derived inverse references. According\
    \ to the Java Persistence Wiki, we have to implement the (direct and inverse)\
    \ relations within `set/remove` methods:\n\nA common problem with bidirectional\
    \ relationships is the application updates one side of the relationship, but the\
    \ other side does not updated and becomes out of sync. In JPA, as in Java in general,\
    \ it is the responsibility of the application or the object model to maintain\
    \ relationships. If your application adds to one side of a relationship, it must\
    \ add to the other side. This is commonly resolved through `add` or `set` methods\
    \ in the object model that handle both sides. There are two ways to go about this:\
    \ you can either add the relationship maintenance to only one side of the relationship\
    \ and only use the setter from that side (such as making the other side protected),\
    \ or add it to both sides and ensure you avoid infinite loop.\n\nWe have used\
    \ an `entityManager` for each controller class. Every `entityManager` maintains\
    \ a set of cached entities which can be “shared” with other entity managers using\
    \ the `merge` method. In our example code, as part of the `create` and `update`\
    \ methods of each model class, we have to merge updated entities that belong to\
    \ another `entityManager`. For example, in the `Book.create` method, we need to\
    \ merge the new book’s publisher, managed by the `PublisherController`’s `entityManager`,\
    \ and all its authors, managed by the `AuthorController`’s `entityManager`:\n\n\
    ```\npublic class Book {\npublic static void create(EntityManager em,\nUserTransaction\
    \ ut,\nString isbn, String title, Integer year,\nPublisher publisher, Set<Author>\
    \ authors)\nthrows Exception {\nut.begin();\nBook book = new Book(isbn, title,\
    \ year,\npublisher, authors);\nem.persist(book);\nif (publisher != null) {\nem.merge(publisher);\n\
    }\nif (authors != null)\nfor (Author a : authors) {\nem.merge(a);\n}\nut.commit();\n\
    }\n}\n```\n\nWithout using `merge`, the `Publisher` as well as all `Author` instances\
    \ from the `authors` list do not represent references to the originally cached\
    \ entities, and are not going to retain our changes. For more details, please\
    \ check the Java Persistence Documentation related to this matter.\n\nIt is also\
    \ possible to disable the JPA caching so the entities are reloaded from the database\
    \ for every new instance, e.g., when `EntityManager.find` method is called. This\
    \ can be achieved by adding the following line in the `persistence.xml` file:\n\
    \n```\n<property name=\"eclipselink.cache.shared.default\" value=\"false\"/>\n\
    ```\n\nThe above configuration works for `eclipselink` implementation and it may\
    \ be different for other API implementations. Notice that disabling entity caching\
    \ is not recommended without a serious reason, since it degrades the app’s performance\
    \ and may produce unpredicted behavior in some cases, such as using `@SessionScoped`\
    \ managed entities.\n\n### 9.3 Exploiting Derived Inverse Reference Properties\
    \ in the User Interface\n\nWe can now exploit the derived inverse reference properties\
    \ `Publisher::publishedBooks` and `Author::authoredBooks` for more efficiently\
    \ creating a list of associated books in the `retrieve/list all publishers` and\
    \ `retrieve/list all authors` use cases.\n\n#### 9.3.1 Show Information About\
    \ Published Books in Retrieve/List All\n\nFor showing information about published\
    \ books in the `retrieve/list all publishers` use case, we can now exploit the\
    \ derived inverse reference property `publishedBooks`:\n\n```\n<ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n\
    <h:dataTable value=\"#{publisherController.publishers}\" var=\"p\">\n…\n<h:column>\n\
    <f:facet name=\"header\">Published books</f:facet>\n  <h:outputText value=\"#{p.publishedBooks}\"\
    \ escape=\"false\"\n  converter=\"pl.m.converter.BookListConverter\"/>\n</h:column>\n\
    \ </h:dataTable>\n <h:button value=\"Back\" outcome=\"index\" />\n </ui:define>\n\
    </ui:composition>\n```\n\nIn the case of unidirectional associations, for the\
    \ `retrieve/list all books` use case, we have used a method in the `Book` model\
    \ class, i.e., `getAuthorNames()`, which returns a comma-separated list of author\
    \ names as a string:\n\n```\npublic class Book {\n …\npublic String getAuthorNames()\
    \ {\n String result = \"\";\n int i = 0, n = 0;\n if (this.authors != null) {\n\
    \ n = this.authors.size();\n for (Author author : this.authors) {\n result +=\
    \ author.getName();\n if (i < n - 1) {\n result += \", \";\n }\n i++;\n }\n }\n\
    return result;\n}\n```\n\nThis makes sense in the case of a book, since the number\
    \ of authors is in general limited. However, a `Publisher` may have a large number\
    \ of published books. As a better alternative to our string serialization, we\
    \ can use a JSF converter class which allows us to present the list of authors\
    \ in a custom way. In our case, we choose to present it as a list, where every\
    \ name is presented on a separate line. For this, we implement the `pl.m.converter.BookListConverter`\
    \ class and we annotate it with `@FacesConverter` as follows:\n\n```\n@FacesConverter(value=\"\
    pl.m.converter.BookListConverter\")\npublic class BookListConverter implements\
    \ Converter {\n@Override\npublic Object getAsObject(FacesContext context,\nUIComponent\
    \ component, String value) {\nreturn null; // this method is not needed\n}\n@Override\n\
    public String getAsString(FacesContext context,\nUIComponent component, Object\
    \ value) {\nString result = \"\";\nint i=0, n=0;\nif (value == null) {\nreturn\
    \ null;\n} else if (value instanceof Set<?>) {\nn = ((Set<Book>) value).size();\n\
    for (Book b : (Set<Book>) value) {\nresult += b.getTitle();\nif (i < n-1) {\n\
    result += \"<br />\";\n}\ni++;\n}\nreturn result;\n}\nreturn null;\n}\n}\n```\n\
    \nThen, we use the `converter` attribute in the facelet to specify that our converter\
    \ class, e.g., `pl.m.converter.BookListConverter`, has to be used when the respective\
    \ view component needs to be rendered:\n\n```\n<h:column>\n<f:facet name=\"header\"\
    >Published books</f:facet>\n<h:outputText value=\"#{p.publishedBooks}\" escape=\"\
    false\"\nconverter=\"pl.m.converter.BookListConverter\"/>\n</h:column>\n```\n\n\
    Since the serialization text contains HTML elements, i.e., `<br />` to produce\
    \ HTML new lines, we have to specify the `escape=\"false\"` attribute, otherwise\
    \ `<` and `>` will be replaced with the corresponding `&lt;` and `&gt;` entities.\n"
