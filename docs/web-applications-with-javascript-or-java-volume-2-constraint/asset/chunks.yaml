- fmt: "\nThe minimum level of support for subtyping in OOP, as provided, for instance,\
    \ by `Java` and `C#`, allows defining inheritance of properties and methods in\
    \ single-inheritance hierarchies, which can be inspected with the help of an `is-instance-of`\
    \ predicate that allows testing if a class is the direct or an indirect type of\
    \ an object. In addition, it is desirable to be able to inspect inheritance hierarchies\
    \ with the help of:\n\n1. a predefined instance-level property for retrieving\
    \ `direct type of an object` (or its `direct types`, if multiple classification\
    \ is allowed);\n2. a predefined type-level property for retrieving `the direct\
    \ supertype of a type` (or its `direct supertypes`, if multiple inheritance is\
    \ allowed).\n\nA special case of an OOP language is `JavaScript`, which did originally\
    \ not have an explicit language element for defining classes, but only for defining\
    \ constructor functions. Due to its dynamic programming features, `JavaScript`\
    \ allows using various code patterns for implementing classes, subtyping and inheritance.\
    \ In modern JavaScript, starting from `ES2015`, defining a superclass and a subclass\
    \ is straightforward. First, we define a base class, `Person`, with two properties,\
    \ `firstName` and `lastName`:\n\n```\n class Person {\n  constructor (first, last)\
    \ {\n //// assign base class properties\n    this.firstName = first;\n    this.lastName\
    \ = last;\n  }\n}\n```\n\nThen, we define a subclass, `Student`, with one additional\
    \ property, `studentNo`:\n\n```\n class Student extends Person {\n  constructor\
    \ (first, last, studNo) {\n //// invoke constructor of superclass\n    super(\
    \ first, last);\n //// assign additional properties\n    this.studentNo = studNo;\n\
    \  }\n}\n```\n\nNotice how the constructor of the superclass is invoked with `super(\
    \ first, last)` for assigning the superclass properties.\n\n### 12.7.2 Subtyping\
    \ and Inheritance with XML Schema\n\nIn `XML Schema`, a subtype can be defined\
    \ by `extending` or by `restricting` an existing complex type. While extending\
    \ a complex type means `extending its intension` by adding elements or attributes,\
    \ restricting a complex type means `restricting its extension` by adding constraints.\n\
    \nWe can define a complex type `Person` and a subtype `Student` by extending `Person`\
    \ in the following way:\n\n```\n <xs:complexType name=\"Person\">\n  <xs:attribute\
    \ name=\"firstName\" type=\"xs:string\" />\n  <xs:attribute name=\"lastName\"\
    \ type=\"xs:string\" />\n  <xs:attribute name=\"gender\" type=\"GenderValue\"\
    \ />\n</xs:complexType>\n<xs:complexType name=\"Student\">\n  <xs:extension base=\"\
    Person\">\n    <xs:attribute name=\"studentNo\" type=\"xs:string\" />\n  </xs:extension>\n\
    </xs:complexType>\n```\n\nWe can define a subtype `FemalePerson` by restricting\
    \ `Person` in the following way:\n\n```\n <xs:complexType name=\"FemalePerson\"\
    >\n  <xs:restriction base=\"Person\">\n    <xs:attribute name=\"firstName\" type=\"\
    xs:string\" />\n    <xs:attribute name=\"lastName\" type=\"xs:string\" />\n  \
    \  <xs:attribute name=\"gender\" type=\"GenderValue\"\n      use=\"fixed\" value=\"\
    f\" />\n  </xs:restriction>\n</xs:complexType>\n```\n\nNotice that by fixing the\
    \ value of the `gender` attribute to “f”, we define a constraint that is only\
    \ satisfied by the female instances of `Person`.\n\n### 12.7.3 Subtyping and Inheritance\
    \ with OWL\n\nIn the Web Ontology Language `OWL`, property definitions are separated\
    \ from class definitions and properties are not single-valued, but multi-valued\
    \ by default. Consequently, standard properties need to be declared as `functional`.\
    \ Thus, we obtain the following code for expressing that `Person` is a class having\
    \ the property `name`:\n\n```\n <owl:Class rdf:ID=\"Person\"/>\n<owl:DatatypeProperty\
    \ rdf:ID=\"name\">\n    <rdfs:domain rdf:resource=\"#Person\"/>\n    <rdfs:range\
    \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
    />\n</owl:DatatypeProperty>\n```\n\n`OWL` allows stating that a class is a subclass\
    \ of another class in the following way:\n\n```\n <owl:Class rdf:ID=\"Student\"\
    >\n     <rdfs:subClassOf rdf:resource=\"#Person\"/>\n</owl:Class>\n<owl:DatatypeProperty\
    \ rdf:ID=\"studentNo\">\n    <rdfs:domain rdf:resource=\"#Student\"/>\n    <rdfs:range\
    \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
    />\n</owl:DatatypeProperty>\n```\n\nFor better usability, `OWL` should allow to\
    \ define the properties of a class within a class definition, using the case of\
    \ functional properties as the default case.\n\n### 12.7.4 Representing Class\
    \ Hierarchies with SQL Database Tables\n\nA standard `DBMS` stores information\
    \ (objects) in the rows of tables, which have been conceived as set-theoretic\
    \ relations in classical `relational` database systems. The relational database\
    \ language `SQL` is used for defining, populating, updating and querying such\
    \ databases. But there are also simpler data storage techniques that allow to\
    \ store data in the form of table rows, but do not support `SQL`. In particular,\
    \ key-value storage systems, such as `JavaScript’’s Local Storage API`, allow\
    \ storing a serialization of a `JS entity table` (a map of entity records) as\
    \ the string value associated with the table name as a key.\n\nWhile in the classical\
    \ version of `SQL` (`SQL92`) there is no support for subtyping and inheritance,\
    \ this has been changed in `SQL99`. However, the subtyping-related language elements\
    \ of `SQL99` have only been implemented in some `DBMS`, for instance in the open\
    \ source DBMS `PostgreSQL`. As a consequence, for making a design model that can\
    \ be implemented with various `DBMS` (including weaker technologies such as `MySQL`\
    \ and `SQLite`), we cannot use the `SQL99` features for subtyping, but have to\
    \ model inheritance hierarchies in design models by means of plain tables and\
    \ foreign key dependencies. This mapping from class hierarchies to relational\
    \ tables (and back) is the business of `Object-Relational-Mapping` frameworks\
    \ such as `JPA Providers` (like `Hibernate`), `Microsoft’s Entity Framework`,\
    \ or the `Active Record` approach of the Rails framework.\n\nThere are essentially\
    \ three alternative approaches how to represent a class hierarchy with database\
    \ tables:\n\n1. `Single Table Inheritance` (`STI`) is the simplest approach, where\
    \ the entire class hierarchy is represented by a single table, containing columns\
    \ for all attributes of the root class and of all subclasses, and named after\
    \ the name of the root class.\n2. `Table per Class Inheritance` (`TCI`) is an\
    \ approach, where each class of the hierarchy is represented by a corresponding\
    \ table containing also columns for inherited properties, thus repeating the columns\
    \ of the tables that represent its superclasses.\n3. `Joined Tables Inheritance`\
    \ (`JTI`) is a more logical approach, where each segment subclass is represented\
    \ by a corresponding table (subtable) connected to the table representing its\
    \ superclass (supertable) via its primary key referencing the primary key of the\
    \ supertable, such that the (inherited) properties of the superclass are not represented\
    \ as columns in subtables.\n\nNotice that the `STI` approach is closely related\
    \ to the `Class Hierarchy Merge` design pattern discussed above.\n"
  raw: "The minimum level of support for subtyping in OOP, as provided, for instance,\
    \ by Java and C#, allows defining inheritance of properties and methods in single-inheritance\
    \ hierarchies, which can be inspected with the help of an ***is-instance-of***\
    \ predicate that allows testing if a class is the direct or an indirect type of\
    \ an object. In addition, it is desirable to be able to inspect inheritance hierarchies\
    \ with the help of\n\n1.  a predefined instance-level property for retrieving\
    \ ***the direct type of an object*** (or its *direct types*, if multiple classification\
    \ is allowed);\n\n2.  a predefined type-level property for retrieving ***the direct\
    \ supertype of a type*** (or its *direct supertypes*, if multiple inheritance\
    \ is allowed).\n\nA special case of an OOP language is JavaScript, which did originally\
    \ not have an explicit language element for defining classes, but only for defining\
    \ constructor functions. Due to its dynamic programming features, JavaScript allows\
    \ using various code patterns for implementing classes, subtyping and inheritance.\
    \ In modern JavaScript, starting from ES2015, defining a superclass and a subclass\
    \ is straightforward. First, we define a base class, Person, with two properties,\
    \ firstName and lastName:\n\n```\n class Person {\n  constructor (first, last)\
    \ {\n // assign base class properties\n    this.firstName = first;\n    this.lastName\
    \ = last;\n  }\n}\n```\n\nThen, we define a subclass, Student, with one additional\
    \ property, studentNo:\n\n```\n class Student extends Person {\n  constructor\
    \ (first, last, studNo) {\n // invoke constructor of superclass\n    super( first,\
    \ last);\n // assign additional properties\n    this.studentNo = studNo;\n  }\n\
    }\n```\n\nNotice how the constructor of the superclass is invoked with super(\
    \ first, last) for assigning the superclass properties.\n\n#### 12.7.2 Subtyping\
    \ and Inheritance with XML Schema\n\nIn XML Schema, a subtype can be defined by\
    \ *extending* or by *restricting* an existing complex type. While extending a\
    \ complex type means ***extending its intension*** by adding elements or attributes,\
    \ restricting a complex type means ***restricting its extension*** by adding constraints.\n\
    \nWe can define a complex type Person and a subtype Student by extending Person\
    \ in the following way:\n\n```\n <xs:complexType name=\"Person\">\n  <xs:attribute\
    \ name=\"firstName\" type=\"xs:string\" />\n  <xs:attribute name=\"lastName\"\
    \ type=\"xs:string\" />\n  <xs:attribute name=\"gender\" type=\"GenderValue\"\
    \ />\n</xs:complexType>\n<xs:complexType name=\"Student\">\n  <xs:extension base=\"\
    Person\">\n    <xs:attribute name=\"studentNo\" type=\"xs:string\" />\n  </xs:extension>\n\
    </xs:complexType>\n```\n\nWe can define a subtype FemalePerson by restricting\
    \ Person in the following way:\n\n```\n <xs:complexType name=\"FemalePerson\"\
    >\n  <xs:restriction base=\"Person\">\n    <xs:attribute name=\"firstName\" type=\"\
    xs:string\" />\n    <xs:attribute name=\"lastName\" type=\"xs:string\" />\n  \
    \  <xs:attribute name=\"gender\" type=\"GenderValue\"\n      use=\"fixed\" value=\"\
    f\" />\n  </xs:restriction>\n</xs:complexType>\n```\n\nNotice that by fixing the\
    \ value of the gender attribute to “f”, we define a constraint that is only satisfied\
    \ by the female instances of Person.\n\n#### 12.7.3 Subtyping and Inheritance\
    \ with OWL\n\nIn the Web Ontology Language OWL, property definitions are separated\
    \ from class definitions and properties are not single-valued, but multi-valued\
    \ by default. Consequently, standard properties need to be declared as *functional*.\
    \ Thus, we obtain the following code for expressing that Person is a class having\
    \ the property name:\n\n```\n <owl:Class rdf:ID=\"Person\"/>\n<owl:DatatypeProperty\
    \ rdf:ID=\"name\">\n    <rdfs:domain rdf:resource=\"#Person\"/>\n    <rdfs:range\
    \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
    />\n</owl:DatatypeProperty>\n```\n\nOWL allows stating that a class is a subclass\
    \ of another class in the following way:\n\n```\n <owl:Class rdf:ID=\"Student\"\
    >\n     <rdfs:subClassOf rdf:resource=\"#Person\"/>\n</owl:Class>\n<owl:DatatypeProperty\
    \ rdf:ID=\"studentNo\">\n    <rdfs:domain rdf:resource=\"#Student\"/>\n    <rdfs:range\
    \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
    />\n</owl:DatatypeProperty>\n```\n\nFor better usability, OWL should allow to\
    \ define the properties of a class within a class definition, using the case of\
    \ functional properties as the default case.\n\n#### 12.7.4 Representing Class\
    \ Hierarchies with SQL Database Tables\n\nA standard DBMS stores information (objects)\
    \ in the rows of tables, which have been conceived as set-theoretic relations\
    \ in classical *relational* database systems. The relational database language\
    \ SQL is used for defining, populating, updating and querying such databases.\
    \ But there are also simpler data storage techniques that allow to store data\
    \ in the form of table rows, but do not support SQL. In particular, key-value\
    \ storage systems, such as JavaScript’s Local Storage API, allow storing a serialization\
    \ of a ***JS entity table*** (a map of entity records) as the string value associated\
    \ with the table name as a key.\n\nWhile in the classical version of SQL (SQL92)\
    \ there is no support for subtyping and inheritance, this has been changed in\
    \ SQL99\\. However, the subtyping-related language elements of SQL99 have only\
    \ been implemented in some DBMS, for instance in the open source DBMS *PostgreSQL*.\
    \ As a consequence, for making a design model that can be implemented with various\
    \ frameworks using various SQL DBMSs (including weaker technologies such as *MySQL*\
    \ and *SQLite*), we cannot use the SQL99 features for subtyping, but have to model\
    \ inheritance hierarchies in database design models by means of plain tables and\
    \ foreign key dependencies. This mapping from class hierarchies to relational\
    \ tables (and back) is the business of ***Object-Relational-Mapping*** frameworks\
    \ such as JPA Providers (like Hibernate), Microsoft’s Entity Framework, or the\
    \ Active Record approach of the Rails framework.\n\nThere are essentially three\
    \ alternative approaches how to represent a class hierarchy with database tables:\n\
    \n1.  ***Single Table Inheritance*** *(STI)* is the simplest approach, where the\
    \ entire class hierarchy is represented by a single table, containing columns\
    \ for all attributes of the root class and of all its subclasses, and named after\
    \ the name of the root class.\n\n2.  ***Table per Class Inheritance*** *(TCI)*\
    \ is an approach, where each class of the hierarchy is represented by a corresponding\
    \ table containing also columns for inherited properties, thus repeating the columns\
    \ of the tables that represent its superclasses.\n\n3.  ***Joined Tables Inheritance***\
    \ *(JTI)* is a more logical approach, where each segment subclass is represented\
    \ by a corresponding table (subtable) connected to the table representing its\
    \ superclass (supertable) via its primary key referencing the primary key of the\
    \ supertable, such that the (inherited) properties of the superclass are not represented\
    \ as columns in subtables.\n\nNotice that the STI approach is closely related\
    \ to the *Class Hierarchy Merge* design pattern discussed in [Section 12.6](#9783110500240_011618.xhtml_b_9783110500325-012_s_006)\
    \ above. Whenever this design pattern has already been applied in the design model,\
    \ or the design model has already been re-factored according to this design pattern,\
    \ the class hierarchies concerned (their subclasses) have been eliminated in the\
    \ design, and consequently also in the data model to be coded in the form of class\
    \ definitions in the app’s model layer, so there is no need anymore to map class\
    \ hierarchies to single tables. Otherwise, the design model contains a class hierarchy\
    \ that is implemented with a corresponding class hierarchy in the app’s model\
    \ layer, which would be mapped to database tables with the help of the STI approach."
