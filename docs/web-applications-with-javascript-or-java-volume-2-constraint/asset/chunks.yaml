  trans: "\n\n我们仍然在模型层中针对每个类和每个属性包含了重复的代码结构（称为 `boilerplate code`，即样板代码），用于约束校验（检查和设置器），以及针对每个类用于数据存储管理的方法（添加、更新和删除）。虽然在学习应用开发时编写几次这些代码是有益的，但在处理实际项目时，你并不希望一遍一遍地编写这些代码。为了避免重复的样板代码，需要这些方法的通用形式，以便它们可以在应用的所有模型类中被重用。例如，`cLASSjs`\
    \ 库就提供了这种方法。\n\n## 4 使用 Java EE 实现单向功能关联\n\n单向`functional`关联可以是一对一或多多对一的。在这两种情况下，这种关联都是通过`single-valued`\
    \ 引用属性来表示或实现的。\n\n在本章中，我们将展示：\n\n1. 如何从一个具有表示`单向功能关联`的单值引用属性的 OO 类模型，推导出形式为 `Java\
    \ Entity class model` 的 `data model`；\n2. 如何以实体类的形式（实现 `model classes`）用代码编写 Java\
    \ 实体类模型；\n3. 如何基于实体类编写视图和控制器代码。\n\n### 4.1 在 Java 中实现单值引用属性\n\n单值引用属性（例如对象类型 `Book`\
    \ 的属性 `publisher`）允许存储对另一种类型对象（如 `Publisher`）的内部引用。在创建新对象时，构造函数需要一个参数，以便为引用属性分配适当的值。在像\
    \ `Java` 这样的强类型编程语言中，我们可能需要决定此值是预期为内部对象引用还是 ID 引用。使用 JPA 对象到存储映射技术，我们可以处理对象引用，并将到相应\
    \ ID 引用的映射留给 JPA。`Book` 类扩展如下：\n\n```\n@Entity @Table( name=\"books\")\n@ViewScoped\
    \ @ManagedBean( name=\"book\")\npublic class Book {\n       …\n       private\
    \ Publisher publisher;\n\n      public Book() {}\n      public Book( String isbn,\
    \ String title, Integer year,\n            Publisher publisher) {…}\n      public\
    \ Publisher getPublisher() {…}\n\n      public void setPublisher( Publisher publisher)\
    \ {…}\n …\n}\n```\n\n### 4.2 创建 Java 实体类模型\n\n创建 Java 实体类模型的起点是一个类似于图 1.10 所示的\
    \ OO 类模型。\n\n如前所述，我们通过以下方式从相应的 OO 设计类获取 Java 实体类 `Publisher`：(1) 将所有属性设为私有；(2)\
    \ 使用 Java 数据类型类（`String`、`Integer` 等）；(3) 为属性添加«get/set»刻型（指定公共的 getter 和 setter）；(4)\
    \ 添加 `toString` 函数；(5) 添加（类级）数据存储方法 `create`、`retrieve`、`update` 和 `delete`：\n\
    \n![](img/b_9783110500325-004_ingr_001.png)\n\n在 Java 实体类模型中，对于 OO 类模型中的任何关联端点，我们都显示表示关联端点的引用属性，并用其所表示的单向关联的功能类型进行标注。在我们的示例中，我们在实体类\
    \ `Book` 中添加了引用属性 `publisher`，并用关联的功能类型 `manyToOne` 对进行标注：\n\n![](img/b_9783110500325-004_ingr_002.png)\n\
    \n### 4.3 新问题\n\n与之前讨论的单类应用相比，我们必须处理许多新的技术问题：\n\n1. 在 `model` 代码中，我们现在必须处理需要以下操作的`reference\
    \ properties`：\n    1. 借助合适的 JPA 注解定义引用完整性约束（referenced integrity constraints）；\n\
    \    2. 通过考虑引用属性来扩展 `create`、`update` 和 `delete` 方法的代码；\n    3. 一个在序列化和反序列化操作中在（内部）对象引用和相应的（外部）ID\
    \ 引用之间转换的方法。\n2. 在`user interface`（视图）代码中，我们现在必须处理：\n    1. 在 `retrieve/list all`\
    \ 用例中显示有关关联对象的信息；\n    2. 在 `create object` 和 `update object` 用例中，允许从目标类的所有现有实例列表中选择关联对象。\n\
    \n### 4.4 编写模型代码\n\n可以直接为 Java 实体类模型编写代码，以获取我们 Java 后端应用的模型层代码。\n\n#### 4.4.1\
    \ 总结\n\n1. 根据 Java 实体类模型为每个类编写对应的对应的实体类。\n2. 使用 JPA 注解 `@Id` 编写 `{id}` 属性修饰符。\n\
    3. 为任何表示引用属性功能类型的属性修饰符（例如 `{manyToOne}`）编写相应的 JPA 注解，例如 `@ManyToOne`。\n4. 借助 Java\
    \ Bean Validation 注解（或自定义校验注解）编写模型中指定的完整性约束。\n5. 编写 getter 和 setter。\n6. 将 `create`、`retrieve`、`update`\
    \ 和 `delete` 存储管理操作编写为类方法。\n\n这些步骤将在接下来的章节. 中进行详细讨论。\n\n#### 4.4.2 编写模型中的每个类\n\
    \n直接为 Java 实体类模型编写代码以获取模型层代码。Java 实体类模型中的每个类 `C` 都被编写为一个带注解的 Bean 类，包含一个无参构造函数和一个带有实体创建参数的构造函数。\n\
    \n例如，实体类模型中的 `Book` 类以以下方式编写：\n\n```\n @Entity @Table( name=\"books\")\n@ViewScoped\
    \ @ManagedBean( name=\"book\")\npublic class Book {\n       @Id @NotNull( message=\"\
    An ISBN is required!\")\n       private String isbn;\n\n       @Column( nullable=false)\n\
    \       @NotNull( message=\"A title is required!\")\n       private String title;\n\
    \       @Column( nullable=false)\n       @NotNull( message=\"A year is required!\"\
    )\n       private Integer year;\n       @ManyToOne( fetch=FetchType.EAGER)\n \
    \      private Publisher publisher;\n\n       public Book() {}\n       public\
    \ Book( String isbn, String title,\n                 Integer year, Publisher publisher)\
    \ {\n          this.setIsbn( isbn);\n          this.setTitle( title);\n      \
    \    this.setYear( year);\n          this.setPublisher( publisher);\n      }\n\
    \     …  // getters, setters, etc.\n\n```\n\n属性 `publisher` 上的 `@ManyToOne` 注解用于指定由引用属性\
    \ `publisher` 表示的关联 `Book has Publisher` 的功能类型，因为它持有*一本书有一个出版者*以及*一个出版者有多许多书*。该注解还允许通过参数\
    \ `fetch` 指定抓取类型，该参数取以下两个可能值之一：\n\n* `FetchType.EAGER`，意味着获取实体包括对由该属性引用的关联实体的获取。在我们的示例中，这意味着当获取\
    \ `Book` 实体时，其出版者属性引用的 `Publisher` 实体也会被获取。这种行为非常有用，每当获取的数据可以在内存中处理时都应该使用它。\n\n\
    * `FetchType.LAZY`，意味着在获取引用实体时不会自动获取引用实体。在我们的示例中，这意味着不会与引用 `Book` 实体一起获取被引用的 `Publisher`\
    \ 实体，导致发布者属性的值设置为 null。使用这种抓取行为，必须在事务上下文中调用引用属性的 getter 来单独获取引用实体。\n\n"
- fmt: "\nIn the case of a `single-valued` reference property (representing a `functional`\
    \ association) annotated with either `@OneToOne` or `@ManyToOne`, the default\
    \ value is `FetchType.EAGER`, so referenced entities are fetched together with\
    \ referencing entities, while in the case of a `non-functional` association (with\
    \ either `@OneToMany` or `@ManyToMany`), the default value is `FetchType.LAZY`,\
    \ so referenced entities are not fetched together with referencing entities, but\
    \ have to be retrieved separately, if needed.\n\nAs a result of these JPA annotations,\
    \ the following SQL table creation statement for creating the books table is generated:\n\
    \n```\n CREATE TABLE IF NOT EXISTS `books` (\n     `ISBN` varchar(10) NOT NULL,\n\
    \     `TITLE` varchar(255) NOT NULL,\n     `YEAR` int(11) NOT NULL,\n     `PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL\n           FOREIGN  KEY (`PUBLISHER_NAME`) REFERENCES\
    \ `publishers` (`NAME`)\n);\n```\n\n### 4.4.3 Code the Constraints\n\nTake care\
    \ that all property constraints specified in the entity class model are properly\
    \ coded by using suitable Bean Validation annotations. For instance, for the name\
    \ attribute, we have to use the JPA annotation `@Id` for specifying that the attribute\
    \ corresponds to the primary key column of the database table to which the entity\
    \ class is mapped, and the Bean Validation annotation `@NotNull` for defining\
    \ a mandatory value constraint that is checked before an entity is saved to the\
    \ database.\n\nIn the case of the address attribute, we have to define a mandatory\
    \ value constraint in two forms: with the JPA annotation `@Column( nullable=false)`\
    \ for the corresponding table column, and with the Bean Validation annotation\
    \ `@NotNull` for the attribute.\n\n```\n @Id @NotNull( message=\"A name is required!\"\
    )\nprivate String name;\n@Column( nullable=false)\n@NotNull( message=\"An address\
    \ is required!\")\n private String address;\n```\n\nNotice that, unfortunately,\
    \ the current Java EE technology requires defining the same constraint twice,\
    \ once for the database in the form of a JPA annotation, and once for the Java\
    \ app in the form of a Bean Validation annotation.\n\n### 4.4.4 Code Getters and\
    \ Setters\n\nCode the setter operations as (instance-level) methods. The setters\
    \ only assign values and do not perform any validation, since the property constraints\
    \ are only checked before save by the Java EE execution environment. The getters\
    \ simply return the actual values of properties.\n\n### 4.4.5 Implement a Deletion\
    \ Policy\n\nFor any reference property, we have to choose and implement a deletion\
    \ policy for taking care of the corresponding object destruction dependency in\
    \ the delete method of the reference property’s range class. In our case, we have\
    \ to choose between\n\n1. deleting all books published by the deleted publisher;\n\
    2. dropping from all books published by the deleted publisher the reference to\
    \ the deleted publisher.\n\nWe choose the second policy, which can only be used\
    \ inf the case of an optional reference property such as `book.publisher`. This\
    \ is shown in the following code of the `Publisher.delete` method where for all\
    \ book entities concerned the property `book.publisher` is cleared:\n\n```\n public\
    \ static void delete( EntityManager em, UserTransaction ut,\n          String\
    \ name) throw Exception {\n     ut.begin();\n     Publisher publisher = em.find(\
    \ Publisher.class, name);\n     // find all Books which have this publisher\n\
    \     Query query = em.createQuery(\n          \"SELECT b FROM Book b WHERE b.publisher.name\
    \ = :name\");\n     query.setParameter( \"name\", name);\n     List<Book> books\
    \ = query.getResultList();\n     // clear these books' publisher reference\n \
    \    for ( Book b: books) { b.setPublisher( null);}\n     em.remove( publisher);\n\
    \     ut.commit();\n}\n```\n\nThe method loops through all Book entities referencing\
    \ the publisher to be destroyed and sets their publisher property to null.\n\n\
    ### 4.4.6 Serialization and De-Serialization\n\nBased on JPA annotations, together\
    \ with suitable converter classes when needed, serialization (from Java objects\
    \ to table rows) as well as the corresponding de-serialization (from table columns\
    \ to Java objects) are performed automatically.\n\n### 4.5 The View and Controller\
    \ Layers\n\nThe user interface (UI) consists of a start page for navigating to\
    \ the data management UI pages and one UI page for each object type and data management\
    \ use case. All these UI pages are defined in the form of JSF view files in subfolders\
    \ of the `WebContent/views/` folder. We create the `Main Menu` page `index.xhtml`\
    \ in the subfolder `WebContent/views/app` with the following content:\n\n```\n\
    \ <!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n       xmlns:ui=\"\
    …\" xmlns:h=\"…\"      xmlns:f=\"…\">\n  <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n    <ui:define name=\"content\">\n      <h2>Public Library</h2>\n      <h:button\
    \ value=\"Manage publishers\"\n          outcome=\"/views/publishers/index\" />\n\
    \      <h:button value=\"Manage books\" outcome=\"/views/books/index\" />\n  \
    \    <h:form>\n        <h:commandButton value=\"Clear database\"\n           \
    \ action=\"#{appCtrl.clearData()}\" />\n        <h:commandButton value=\"Create\
    \ test data\"\n            action=\"#{appCtrl.createTestData()}\" />\n      </h:form>\n\
    \    </ui:define>\n  </ui:composition>\n</</html>\n```\n\nIt creates the menu\
    \ buttons which provide the redirects to corresponding views for each of the management\
    \ pages. Additionally, we need to create a corresponding `AppController` class\
    \ which is responsible for the creation and deletion of the test data. The controller\
    \ is used to combine code of the `Publisher.createTestData` and `Publisher.clearData`\
    \ methods with `Book.createTestData` and `Book.clearData` methods as follows:\n\
    \n```\n @ManagedBean ( name=\"appCtrl\")   @SessionScoped\npublic class AppController\
    \ {\n      @PersistenceContext( unitName=\"UnidirAssocApp\")\n      private EntityManager\
    \ em;\n      @Resource()\n      UserTransaction ut;\n\n      public String clearData\
    \ () {\n           try {\n                Book.clearData ( em, ut);\n        \
    \        Publisher.clearData ( em, ut);\n           } catch ( Exception e) {\n\
    \              e.printStackTrace ();\n           }\n           return \"index\"\
    ;\n      }\n      public String createTestData () {\n           try {\n      \
    \         Publisher.createTestData ( em, ut);\n               Book.createTestData\
    \ ( em, ut);\n           } catch ( Exception e) {\n              e.printStackTrace\
    \ ();\n      }\n      return \"index\";\n   }\n}\n```\n\nThe deletion of `Book`\
    \ and `Publisher` data must be done in a particular order for avoiding referential\
    \ integrity violations (books have to be deleted first, before their publishers\
    \ are deleted).\n\n#### 4.5.1 Initialize the App\n\nSince the code runs in a Tomcat\
    \ container, the initialization is made internally by the container.\n\n#### 4.5.2\
    \ Show Information About Associated Objects in *Retrieve/List All*\n\nIn our example\
    \ we have only one reference property, `Book::publisher`, which is functional.\
    \ For showing information about the optional publisher of a book in the *retriev/list\
    \ all books* use case, the corresponding column in the HTML table is filled with\
    \ the names of publishers, if there is any:\n\n```\n <ui:composition template=\"\
    /WEB-INF/templates/page.xhtml\">\n     <ui:define name=\"content\">\n        \
    \ <h:dataTable value=\"#{bookCtrl.books}\" var=\"b\">\n            …\n       \
    \     <h:column>\n                <f:facet name=\"header\">Publisher</f:facet>\n\
    \                #{b.publisher.name}\n            </h:column>\n         </h:dataTable>\n\
    \         <h:button value=\"Main menu\" outcome=\"index\" />\n     </ui:define>\n\
    </ui:composition>\n```\n\nNotice the cascade call used in the `#{b.publisher.name}`\
    \ JSF expression, accessing the property name of the publisher which is a property\
    \ of the book instance `b`.\n\n#### 4.5.3 Allow Selecting Associated Objects in\
    \ *Create* and *Update*\n\nIn this section, we discuss how to create and update\
    \ an object which has reference properties, such as a `Book` object with the reference\
    \ property `publisher`.\n\n##### 4.5.3.1 Create the Object-to-String Converter\n"
  raw: "In the case of a *single-valued* reference property (representing a *functional*\
    \ association) annotated with either @OneToOne or @ManyToOne, the default value\
    \ is FetchType.EAGER, so referenced entities are fetched together with referencing\
    \ entities, while in the case of a *non-functional* association (with either @OneToMany\
    \ or @ManyToMany), the default value is FetchType.LAZY, so referenced entities\
    \ are not fetched together with referencing entities, but have to be retrieved\
    \ separately, if needed.\n\nAs a result of these JPA annotations, the following\
    \ SQL table creation statement for creating the books table is generated:\n\n\
    ```\n CREATE TABLE IF NOT EXISTS `books` (\n     `ISBN` varchar(10) NOT NULL,\n\
    \     `TITLE` varchar(255) NOT NULL,\n     `YEAR` int(11) NOT NULL,\n     `PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL\n           FOREIGN  KEY (`PUBLISHER_NAME`) REFERENCES\
    \ `publishers` (`NAME`)\n);\n```\n\n#### 4.4.3 Code the Constraints\n\nTake care\
    \ that all property constraints specified in the entity class model are properly\
    \ coded by using suitable Bean Validation annotations. For instance, for the name\
    \ attribute, we have to use the JPA annotation @Id for specifying that the attribute\
    \ corresponds to the primary key column of the database table to which the entity\
    \ class is mapped, and the Bean Validation annotation @NotNull for defining a\
    \ mandatory value constraint that is checked before an entity is saved to the\
    \ database.\n\nIn the case of the address attribute, we have to define a mandatory\
    \ value constraint in two forms: with the JPA annotation @Column( nullable=false)\
    \ for the corresponding table column, and with the Bean Validation annotation\
    \ @NotNull for the attribute.\n\n```\n @Id @NotNull( message=\"A name is required!\"\
    )\nprivate String name;\n@Column( nullable=false)\n@NotNull( message=\"An address\
    \ is required!\")\n private String address;\n```\n\n***Notice that, unfortunately,\
    \ the current Java EE technology requires defining the same constraint twice,\
    \ once for the database in the form of a JPA annotation, and once for the Java\
    \ app in the form of a Bean Validation annotation.***\n\n#### 4.4.4 Code Getters\
    \ and Setters\n\nCode the setter operations as (instance-level) methods. The setters\
    \ only assign values and do not perform any validation, since the property constraints\
    \ are only checked before save by the Java EE execution environment. The getters\
    \ simply return the actual values of properties.\n\n#### 4.4.5 Implement a Deletion\
    \ Policy\n\nFor any reference property, we have to choose and implement a deletion\
    \ policy for taking care of the corresponding object destruction dependency in\
    \ the delete method of the reference property’s range class. In our case, we have\
    \ to choose between\n\n1.  deleting all books published by the deleted publisher;\n\
    \n2.  dropping from all books published by the deleted publisher the reference\
    \ to the deleted publisher.\n\nWe choose the second policy, which can only be\
    \ used inf the case of an optional reference property such as book.publisher.\
    \ This is shown in the following code of the Publisher.delete method where for\
    \ all book entities concerned the property book.publisher is cleared:\n\n```\n\
    \ public static void delete( EntityManager em, UserTransaction ut,\n         \
    \ String name) throw Exception {\n     ut.begin();\n     Publisher publisher =\
    \ em.find( Publisher.class, name);\n     // find all Books which have this publisher\n\
    \     Query query = em.createQuery(\n          \"SELECT b FROM Book b WHERE b.publisher.name\
    \ = :name\");\n     query.setParameter( \"name\", name);\n     List<Book> books\
    \ = query.getResultList();\n     // clear these books' publisher reference\n \
    \    for ( Book b: books) { b.setPublisher( null);}\n     em.remove( publisher);\n\
    \     ut.commit();\n}\n```\n\nThe method loops through all Book entities referencing\
    \ the publisher to be destroyed and sets their publisher property to null.\n\n\
    #### 4.4.6 Serialization and De-Serialization\n\nBased on JPA annotations, together\
    \ with suitable converter classes when needed, serialization (from Java objects\
    \ to table rows) as well as the corresponding de-serialization (from table columns\
    \ to Java objects) are performed automatically.\n\n### 4.5 The View and Controller\
    \ Layers\n\nThe user interface (UI) consists of a start page for navigating to\
    \ the data management UI pages and one UI page for each object type and data management\
    \ use case. All these UI pages are defined in the form of JSF view files in subfolders\
    \ of the WebContent/views/ folder. We create the *Main Menu* page index.xhtml\
    \ in the subfolder WebContent/views/app with the following content:\n\n```\n <!DOCTYPE\
    \ html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n       xmlns:ui=\"…\" xmlns:h=\"\
    …\"      xmlns:f=\"…\">\n  <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n    <ui:define name=\"content\">\n      <h2>Public Library</h2>\n      <h:button\
    \ value=\"Manage publishers\"\n          outcome=\"/views/publishers/index\" />\n\
    \      <h:button value=\"Manage books\" outcome=\"/views/books/index\" />\n  \
    \    <h:form>\n        <h:commandButton value=\"Clear database\"\n           \
    \ action=\"#{appCtrl.clearData()}\" />\n        <h:commandButton value=\"Create\
    \ test data\"\n            action=\"#{appCtrl.createTestData()}\" />\n      </h:form>\n\
    \    </ui:define>\n  </ui:composition>\n</html>\n```\n\nIt creates the menu buttons\
    \ which provide the redirects to corresponding views for each of the management\
    \ pages. Additionally, we need to create a corresponding AppController class which\
    \ is responsible for the creation and deletion of the test data. The controller\
    \ is used to combine code of the Publisher.createTestData and Publisher.clearData\
    \ methods with Book.createTestData and Book.clearData methods as follows:\n\n\
    ```\n @ManagedBean ( name=\"appCtrl\")   @SessionScoped\npublic class AppController\
    \ {\n      @PersistenceContext( unitName=\"UnidirAssocApp\")\n      private EntityManager\
    \ em;\n      @Resource()\n      UserTransaction ut;\n\n      public String clearData\
    \ () {\n           try {\n                Book.clearData ( em, ut);\n        \
    \        Publisher.clearData ( em, ut);\n           } catch ( Exception e) {\n\
    \              e.printStackTrace ();\n           }\n           return \"index\"\
    ;\n      }\n      public String createTestData () {\n           try {\n      \
    \         Publisher.createTestData ( em, ut);\n               Book.createTestData\
    \ ( em, ut);\n           } catch ( Exception e) {\n              e.printStackTrace\
    \ ();\n      }\n      return \"index\";\n   }\n}\n```\n\nThe deletion of Book\
    \ and Publisher data must be done in a particular order for avoiding referential\
    \ integrity violations (books have to be deleted first, before their publishers\
    \ are deleted).\n\n#### 4.5.1 Initialize the App\n\nSince the code runs in a Tomcat\
    \ container, the initialization is made internally by the container.\n\n#### 4.5.2 Show\
    \ Information About Associated Objects in *Retrieve/List All*\n\nIn our example\
    \ we have only one reference property, Book::publisher, which is functional. For\
    \ showing information about the optional publisher of a book in the *retriev/list\
    \ all books* use case, the corresponding column in the HTML table is filled with\
    \ the names of publishers, if there is any:\n\n```\n <ui:composition template=\"\
    /WEB-INF/templates/page.xhtml\">\n     <ui:define name=\"content\">\n        \
    \ <h:dataTable value=\"#{bookCtrl.books}\" var=\"b\">\n            …\n       \
    \     <h:column>\n                <f:facet name=\"header\">Publisher</f:facet>\n\
    \                #{b.publisher.name}\n            </h:column>\n         </h:dataTable>\n\
    \         <h:button value=\"Main menu\" outcome=\"index\" />\n     </ui:define>\n\
    </ui:composition>\n```\n\nNotice the cascade call used in the #{b.publisher.name}\
    \ JSF expression, accessing the property name of the publisher which is a property\
    \ of the book instance b.\n\n#### 4.5.3 Allow Selecting Associated Objects in\
    \ *Create* and *Update*\n\nIn this section, we discuss how to create and update\
    \ an object which has reference properties, such as a Book object with the reference\
    \ property publisher.\n\n##### 4.5.3.1 Create the Object-to-String Converter"
