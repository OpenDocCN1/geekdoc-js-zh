    \ |\n\nWe have to perform a similar transformation also for the class `Publisher`.\
    \ This gives us the complete JS class model derived from the above OO class model,\
    \ as depicted in [Figure 2.1](#9783110500240_000634.xhtml_b_9783110500325-002_fig_001).\n\
    \n![](graphic/converted/b_9783110500325-002_fig_001.png)\n\nFigure 2.1: A JS class\
    \ model defining the classes `Book` and `Publisher`.\n\n## 2.4 New Issues\n\n\
    Compared to the validation and enumeration apps discussed in Volume 1, we have\
