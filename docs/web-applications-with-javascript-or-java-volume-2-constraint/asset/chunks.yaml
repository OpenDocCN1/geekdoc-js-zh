    ## 5.7 引用属性的值：集合与有序集合


    回想，`set`（集合）是一个具有唯一元素的无序集合，而 `list`（列表）是一个可能包含多个相同元素的有序集合。


    当图 5.1 所示的类图中，如果非功能关联端是 `ordered`（有序的），例如 `Book::authors`，这意味着相应引用属性的范围需要是一个有序集合类型，例如
    Java 集合接口类型 `SortedSet` 和 `List`。


    ![](img/b_9783110500325-005_fig_001.png)


    图 5.1：一个集合值的引用属性 `authoredBooks` 和一个有序集合值的引用属性 `authors`。


    在理论上，集合值型引用属性应该使用 `Set<T>` 定义，例如将 `Set<Book>` 声明为 `Author::authoredBooks` 的范围；而有序集合值的引用属性应该使用
    `SortedSet<T>` 定义，例如将 `SortedSet<Author>` 声明为 `Book::authors` 的范围。Java 接口类型 `Set`
    通常由 Java 类 `HashSet` 实现，而 `SortedSet` 通常由 `TreeSet` 实现。


    然而，如果不担心避免重复元素，集合值型和有序集合型引用属性也可以使用泛型接口类型 `List<T>` 作为其范围定义，该类型通常由 `ArrayList`
    实现。


    当主要的用例是向集合中添加元素并在稍后对它们进行迭代时，最佳选择是使用由 `ArrayList` 实现的 `List`，它比 `LinkedList` 或任何
    `Set` 的实现都更节省内存，并且具有快速的插入、迭代和随机访问能力。使用 `HashSet` 仅在集合中查找元素的用例中具有性能优势。


    ## 6 单向关联实践项目


    所有项目都包含以下任务：


    1. 根据给定的设计模型派生 `OO class model`（面向对象类模型）。提示：将关联替换为相应的引用属性。

    2. 从 OO 类模型派生 `JavaScript class model`（JavaScript 类模型）或 `Java Entity class model`（Java
    实体类模型）。提示：添加检查方法（check）和设置方法（setter）。

    3. 遵循提供的指南编写你的 JS 类模型或 Java 实体类模型代码。


    确保你的页面符合 HTML5 的 XML 语法，并且你的 JavaScript 代码符合我们的编码准则并通过了 (`JSHint`) 检查。


