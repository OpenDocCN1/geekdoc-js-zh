    Figure 1.5: Modeling a bidirectional association between Committee and ClubMember.


    So, whenever we have modeled an association, we have to make a choice, which of
    its ends represents a reference property and will therefore be marked with an
    ownership dot. It can be either one, or both. This decision also implies a decision
    about the `navigability` of the association. When an association end represents
    a reference property, this implies that it is navigable (via this property).


    In the case of a functional association that is not one-to-one, the simplest design
    is obtained by defining the direction of the association according to its functionality,
    placing the association end ownership dot at the association end with the multiplicity
    `0..1` or `1`. For a non-directed one-to-one or many-to-many association, we can
    choose the direction as we like, that is, we can place the ownership dot at either
    association end.


