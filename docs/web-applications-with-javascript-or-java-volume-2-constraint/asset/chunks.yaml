  raw: "**Pros** of the TCI approach: (1) The structure of the given class hierarchy\
    \ in terms of its elements (classes) is explicitly preserved. (2) When the segmentations\
    \ of the given class hierarchy are disjoint, TCI leads to memory-efficient non-redundant\
    \ storage.\n\n**Cons**: (1) The TCI approach does not yield a faithful representation\
    \ of the subtype relationships expressed in the original class hierarchy. In particular,\
    \ for any row representing a subclass instance (an employee, manager or author)\
    \ there is no information that it represents a superclass instance (a person).\
    \ Thus, the TCI database schema does not inform about the represented subtype\
    \ relationships; rather, this meta-information, which is kept in the app’s class\
    \ model, is de-coupled from the database. (2) The TCI approach requires repeating\
    \ column definitions, which is a form of schema redundancy. (3) The TCI approach\
    \ may imply data redundancy whenever the segment subclasses overlap. In our example,\
    \ authors can also be employees, so for any person in the overlap, we would need\
    \ to duplicate the data storage for all columns representing properties of the\
    \ superclass (in our example, this only concerns the property name).\n\n#####\
    \ 12.7.4.3 Joined Tables Inheritance\n\nFor avoiding the data redundancy problem\
    \ of TCI in the case of overlapping segmentations, we could take the JTI approach\
    \ as exemplified in the SQL table model shown in [Figure 12.12](#9783110500240_011618.xhtml_b_9783110500325-012_fig_012)\
    \ below. This model connects tables representing subclasses (*subtables*) to tables\
    \ representing their superclasses (*supertables*) by defining their primary key\
    \ column(s) to be at the same time a foreign key referencing their supertable’s\
    \ primary key. Notice that foreign keys are visualized in the form of UML dependency\
