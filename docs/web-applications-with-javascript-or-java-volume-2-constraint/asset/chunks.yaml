  trans: '


    引用属性（如上述图 1.1 所示示例中的 `chair`）可以在 UML 类图中以其领域类所拥有的`关联端`（association end）的形式进行建模，该端通过一个小的实心圆（也称为“点”）进行可视化表示。这需要用关联线连接引用属性的领域类和范围类，在连线的末端范围类一侧放置一个`所有权点`（ownership
    dot），并用属性名称和多重性符号对该关联端进行注释，下方的图 1.2 所示了我们的示例。通过这种方式，我们得到了一个`单向关联`（unidirectional
    association），其`源`（source）类是属性的`领域`（domain），其`目标`（target）类是属性的`范围`（range）。


    关联端被另一端的类所`拥有`的这一事实（正如下方图 1.2 所示中关联端 `chair` 处的`关联端所有权点`视觉表达的那样），意味着该关联端表示一个引用属性。在图
    1.2 示例中，所表示的引用属性是 `Committee::chair`，其范围为 `ClubMember`。这种仅有一个关联端所有权点的关联在意义上是`单向的`，因为它只允许在一个方向上进行`导航`（navigation，对象访问）：即从点对侧的类（`源`类）到放置点的类（`目标`类）。


    ![](img/b_9783110500325-001_fig_002.png)


    图 1.2：带有“点”的关联端。


    因此，图 1.1 和 1.2 所示的两个图表本质上表达了等效的模型。当一个引用属性（如图 1.1 所示模型中的原始属性描述中是不可用的，因此必须根据关联的预期语义进行添加。可以通过回答问题“任何
    `ClubMember` 是否必须是某个 `Committee` 的主席？”来找到最小基数，通过回答问题“一个 `ClubMember` 是否可以是一个或多个
    `Committee` 的主席？”来找到最大基数。


    当属性的值是其范围内的一组值集合时，该属性是`非功能性的`（non-functional），其多重性表现为 `0..*` 或 `n..*`（其中 `n >
    0`）。我们不使用表示“既不是强制的也不是函数的”的 `0..*`，而是简单地写星号符号 `*`。图 1.2 所示的关联为一个 `Committee` 类型的对象分配最多一个
    `ClubMember` 类型的对象作为 `chair`。因此，它是`功能性关联`（functional association）的一个示例。


    关于关联功能性不同情况的概述请参见表 1.1。


    表 1.1：功能性类型。


    | 功能性类型 | 含义 |

    | --- | --- |

    | 一一 | 既是功能性的也是反向的 |

    | 多对一 | 功能性的 |

    | 一对多 | 反向的 |

    | 多对多 | 既不是功能性的也不是反向的 |


    注意，关联的方向性和功能性是独立的。因此，单向关联可以是`一对一`或`多对多`。


    ### 将单向关联表示为引用属性


    `source` 类和 `target` 类之间的单向关联可以表示为 `source` 类的一个引用属性。这在下方的图 1.3 中所示，为了两种：`多对一`和`多对多`。


    ![](img/b_9783110500325-001_fig_003)


    图 1.3：表示关联。


    注意，通过这种方式，我们消除了显式关联并将其替换为引用属性。面向对象的语言不支持。


    ### 为无方向关联添加方向


    当我们以 UML 类图的形式制作模型时，通常会得到没有方向的关联，例如下方的图 1.4。当关联的末端没有所有权点时，根据 UML 规范，此类关联的末端属于关联本身，而不是参与其中的任何类。


    ![](img/b_9783110500325-001_fig_004.png)


    图 1.4：`Committee` 和 `ClubMember` 之间的无方向模型。


    一个没有关联端的信息设计作为关系数据库模型是可以接受的，但作为面向对象语言的设计是不完全的。例如，图 1.4 所示的模型提供了包含两个表（`committees`
    和 `clubmembers`）以及一个一对一关系表 `committee_has_clubmember_as_chair` 的关系数据库设计。但它没有为
    Java 类提供设计，因为它没有指定如何通过引用属性来实现关联。


    有三种方案可以将无方向关联（无任何关联端）的信息设计模型转换为关联均为单向或双向的信息设计模型：我们可以在关联的任一端或两端放置所有权点。这三种方案都定义了使用引用属性表示或实现关联的不同方法。因此，对于上方图
    1.4 所示的关联，我们有以下选项：


    1. 在 `chair` 关联端放置所有权点，从而得到上方的图 1.2 所示的模型，该模型可以转换为上方的面向对象类模型，如图 1.1 所示。


    2. 在 `chairedCommittee` 关联端放置所有权点，从而得到下方的图 1.8 所示的完整模型。


