  raw: "*   it is possible to conditionally render facelet components by using the\
    \ rendered attribute. The JSF EL expression must return true or false, this making\
    \ the HTML resulting elements to be part of the HTML DOM or not. Notice that the\
    \ conditional expressions are evaluated in the server side. This is the method\
    \ we use to hide or show the input form elements corresponding to various book\
    \ types (e.g., TextBook has a subjectArea property while Biography has an about\
    \ property).\n\n*   the render attribute used with f:ajax specifies which of the\
    \ JSF components are to be updated . This is needed because of the live DOM changes\
    \ (client side, not server side) which applies after the AJAX call.\n\n*   AJAX\
    \ is used to submit the form for reevaluation when the special type selection\
    \ list field is changed (something is selected). As a result, it enforces the\
    \ rendering of the three panels corresponding to three book cases: simple book,\
    \ text book and biography. Using execute=“@this” we enforce the re-evaluation\
    \ of the form at server side, so the resulting HTML DOM structure contains the\
    \ changes accordiong to the conditions specified by the rendered attributes of\
    \ the various JSF elements. Notice that a JSF element that has a conditional rendered\
    \ expression must be a child of another JSF element which is always part of the\
    \ DOM.\n\n*   h:panelGroup is used to define a set of elements which are either\
    \ shown or hidden.\n\n*   the action attribute of the h:commandButton can’t be\
    \ used with conditional expressions, therefore we have to create three command\
    \ buttons, one for each case: create/update a Book, a TextBook or a Biography.\
    \ The create method of the corresponding controller class (i.e., BookController,\
    \ TextBookController or BiographyController is called).\n\n*   since we do not\
    \ have a corresponding property in the Java bean class(es) for the special type\
    \ (category), we can use JSF variables to store the value of the single select\
    \ list, and then use the variable in rendered conditions for various elements.\
    \ Therefore, for the h:selectOneMenu, the value=“#{viewScope.bookTypeVal}” specifies\
    \ that we use a “on the fly” defined property named bookTypeVal, which is part\
    \ of the view scope internal JSF object(s). We can also define such variable outside\
    \ the view scope, e.g., value=“#{bookTypeVal}”, but in this case they are request\
    \ scoped, so their value is lost after submitting the form, and the rendered conditions\
    \ can’t be correctly evaluated.\n\nFor a class in the class hierarchy, one corresponding\
    \ controller class is defined. It contains the specific create, update and delete\
    \ methods. The shared methods, such as getAllObjects are defined by the controller\
    \ of the top level class (e.g., for our example, this is BookController). See\
    \ minimal app for more details on how to implement the controller class and the\
    \ corresponding CRUD methods.\n\nThe *Update Book* test case is very similar with\
    \ the *Create Book* test case. The *Delete Book* test case remains unchanged.\n\
    \n### 14.3 Case Study 2: Implement a Class Hierarchy with *Joined Table Inheritance*\n\
    \nThe starting point for our case study is the design model shown in Figure 12.8\
    \ above. In the following sections, we show how to eliminate the Manager class\
    \ by using the *Class Hierarchy Merge* design pattern and how to implement the\
    \ Person hierarchy and use *Joined, Multiple Table Inheritance* storage with the\
    \ help of JPA framework.\n\n#### 14.3.1 Make the Java Entity class model\n\nWe\
    \ design the *model classes* of our example app with the help of a Java *Entity\
    \ class model* that we derive from the *design model* by essentially leaving the\
    \ generalization arrows as they are and just adding *getters* and *setters* to\
    \ each class. However, in the case of our example app, it is natural to apply\
    \ the *Class Hierarchy Merge* design pattern to the segmentation of Employee for\
    \ simplifying the data model by eliminating the Manager subclass. This leads to\
    \ the model shown in [Figure 14.2](#9783110500240_011618.xhtml_b_9783110500325-014_fig_002)\
    \ below. Notice that we have also made two technical design decisions:\n\n1. \
    \ We have declared the segmentation of Person into Employee and Author to be *disjoint*\
    \ and *complete*, that is, any person is either an employee or an author. Since\
    \ Java does not *support multiple classification*, we cannot implement an overlapping\
    \ segmentation, as needed when modeling roles, with Java.\n\n2.  We have turned\
    \ Person into an ***abstract class*** (indicated by its name written in italics\
    \ in the class rectangle), which means that it cannot have direct instances, but\
    \ only indirect ones via its subclasses Employee and Author. This technical design\
    \ decision is compatible with the fact that any Person is an Employee or an Author\
    \ (or both), and consequently there is no need for any object to instantiate Person\
    \ directly.\n\n![](graphic/converted/b_9783110500325-014_fig_002.png)\n\nFigure\
    \ 14.2: The Java Entity class model of the Person class hierarchy.\n\n#### 14.3.2 New\
    \ Issues\n\nCompared to the model of our first case study, shown in [Figure 14.1](#9783110500240_011618.xhtml_b_9783110500325-014_fig_001)\
    \ above, we have to define the category relationships between Employee and Person,\
    \ as well as between Author and Person, using the JPA annotation.\n\nIn the *UI\
    \ code* we have to take care of:\n\n1.  Adding the views (in the folders WebContent/views/authors\
    \ and WebContent/views/employees) and controller classes (AuthorController and\
    \ EmployeeController) for the corresponding Author and Employee model classes.\n\
    \n2.  Deal with the Manager case, by adding a “Special type” select control, in\
    \ the forms of the “Create book” and “Update book” use cases in WebContent/views/books/create.xhtml\
    \ and WebContent/views/books/update.xhtml. Segment property form fields (i.e.,\
    \ department in our example) are only displayed, and their validation is performed,\
    \ when a corresponding employee type has been selected.\n\n#### 14.3.3 Code the\
    \ Model Classes of the Java Entity Class Model\n\nThe Java Entity class model\
    \ shown in [Figure 14.2](#9783110500240_011618.xhtml_b_9783110500325-014_fig_002)\
    \ above is coded by using the JavaBeans Person, Employee and Author as well as\
    \ for the enumeration type EmployeeCategoryEL.\n\n##### 14.3.3.1 Define the Category\
    \ Relationships\n\nWe define the category relationships between Employee and Person,\
    \ as well as between Author and Person, using the JPA annotations. At first we\
    \ create the Person class as shown below:\n\n```\n @Entity @Table(name=\"persons\"\
    )\n@Inheritance(strategy=InheritanceType.JOINED)\n@DiscriminatorColumn(name=\"\
    category\",\n      discriminatorType=DiscriminatorType.STRING, length=16)\npublic\
    \ abstract class Person {\n     @Id @NotNull(message=\"A person ID is required!\"\
    )\n     private Integer personId;\n     @NotNull(message=\"A name is required!\"\
    ) @Column(nullable=false)\n     private String name;\n    …\n}\n```\n\nComparing\
    \ with the Book hierarchy shown in *Test Case 1*, the @Inheritance annotations\
    \ defines now the strategy=InheritanceType.JOINED. This means, for every class\
    \ in the inheritance hierarchy, a database table is used. The @DiscriminatorColumn(name=“category”)\
    \ specifies the column in the corresponding table (i.e., persons) of the top hierarchy\
    \ class (i.e., Person) which stores the discriminator values used to identify\
    \ the stored type of each entry (table row).\n\nNotice that the Java class Person\
    \ is declared as being abstract, which means it can’t be initialized, instead\
    \ we can and we initialize subclasses derived from it (i.e., Employee and Author).\
    \ This also mean that we don’t declare a @DiscriminatorValue because no direct\
    \ instance of Person is stored in the database table.\n\nFurther, we define the\
    \ Author class as follows:\n\n```\n @Entity @Table(name=\"authors\")\n@DiscriminatorValue(\
    \ value=\"AUTHOR\")\n@ManagedBean(name=\"author\") @ViewScoped\npublic class Author\
    \ extends Person {\n     @NotNull(message=\"A biography is required!\")\n    \
    \ private String biography;\n     …\n}\n```"
