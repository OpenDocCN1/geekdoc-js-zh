    \n# Dedication\n\nTo Our Families.\n\n# Foreword\n\nThis two-volume book shows\
    \ how to design and implement web applications with a model-based engineering\
    \ approach, using the two most relevant technology platforms for web development:\
    \ JavaScript and Java. Web apps are designed with the help of information models\
    \ in the form of UML class diagrams and implemented as:\n\n1.  JavaScript front-end\
    \ apps, using one of the two local storage technologies offered by web browsers;\n\
    \n2.  Java back-end apps, using Java Server Faces (JSF) as the user interface\
    \ technology, the Java Persistence API (JPA) for object-to-storage mapping, and\
    \ a MySQL/MariaDB database management system.\n\nThe focus of the book are general\
    \ concepts and techniques concerning the fundamental ***information management***\
    \ issues of\n\n1.  integrity constraints and data validation,\n\n2.  enumerations\
    \ and enumeration attributes\n\n3.  unidirectional and bidirectional associations\
    \ between object types,\n\n4.  subtyping and inheritance in class hierarchies.\n\
    \nThe first two issues of this list are discussed in Volume 1 of the book, while\
    \ the last two issues are discussed in Volume 2.\n\nWe assume that the reader\
    \ is already familiar with HTML and with at least one object-oriented programming\
    \ language, such as C++, Java, PHP, Python or C#. In addition, we assume that\
    \ the reader has some familiarity with CSS and JavaScript, and is interested to\
    \ learn more about programming with JavaScript or Java.\n\nThe book can be used\n\
    \n1.  in web development courses for students of Computer Science or Information\
    \ Systems and related disciplines;\n\n2.  by JavaScript developers for learning\
    \ Java;\n\n3.  by Java developers for learning JavaScript;\n\n4.  by JavaScript\
    \ and Java (and PHP/Python/C# etc.) developers for learning\n\n    *   object-oriented\
    \ (OO) programming with JavaScript or Java,\n\n    *   how to implement basic\
    \ information management concepts and build complete web apps with plain JavaScript\
    \ or Java.\n\nThe book comes with the complete source code of six example apps\
    \ that you can run or download from our web server.\n\n# Part I: Associations\n\
    \nThe three example apps that we have discussed in Volume 1, the *minimal app*,\
    \ the *validation app*, and the *enumeration app*, have been limited to managing\
    \ the data of one object type only. A real app, however, has to manage the data\
    \ of several object types, which are typically related to each other in various\
    \ ways. In particular, there may be ***associations*** and ***subtype*** (inheritance)\
    \ relationships between object types. Handling associations and subtype relationships\
    \ are advanced issues in software application engineering. They are often not\
    \ sufficiently discussed in text books and not well supported by application development\
    \ frameworks.\n\nAssociations are important elements of information models. Software\
    \ applications have to implement them in a proper way, especially in their *model*\
    \ layer within a *model-view-controller* (MVC) architecture. Unfortunately, application\
    \ development frameworks do often not provide much support for dealing with associations.\n\
    \nThere are two important distinctions, which are independent of each other:\n\
    \n1.  *Functional* versus *non-functional* (“many-to-many”) associations.\n\n\
    2.  *Unidirectional* versus *bidirectional* associations.\n\nA functional association\
    \ corresponds to what is called a *function* in mathematics, while a many-to-many\
    \ association corresponds to what is called a *relation* in mathematics.\n\nA\
    \ unidirectional association corresponds to a reference property in OO modeling\
    \ and programming, while a bidirectional association corresponds to a pair of\
    \ mutually inverse reference properties.\n\n## 1 Reference Properties and Unidirectional\
    \ Associations\n\nA property defined for an object type, or class, is called a\
    \ ***reference property*** if its values are *references* that reference an object\
    \ of another, or of the same, type. For instance, the class Committee shown in\
    \ [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001) below\
    \ has a reference property chair, the values of which are references to objects\
    \ of type ClubMember.\n\nAn ***association*** between object types classifies\
    \ relationships between objects of those types. For instance, the association\
    \ *Committee*-**has**-*ClubMember*-**as-chair**, which is visualized as a connection\
    \ line in the class diagram shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)\
    \ below, classifies the relationships FinanceCommittee-**has**-PeterMiller-**as-chair**,\
    \ RecruitmentCommittee-**has**-SusanSmith-**as-chair** and AdvisoryCommittee-**has**-SarahAnderson-**as-chair**,\
    \ where the objects PeterMiller, SusanSmith and SarahAnderson are of type ClubMember,\
    \ and the objects FinanceCommittee, RecruitmentCommittee and AdvisoryCommittee\
    \ are of type Committee. An association as a set of relationships can be represented\
    \ as a table like so:\n\nReference properties correspond to a special form of\
    \ associations, namely to ***unidirectional*** *binary associations*. While a\
    \ binary association does, in general, not need to be directional, a reference\
    \ property represents a binary association that is directed from the property’s\
    \ domain class (where it is defined) to its range class.\n\nIn general, associations\
    \ are ***relationship types*** with two or more ***object types*** participating\
    \ in them. An association between two object types is called ***binary***. In\
    \ this book we only discuss binary associations. For simplicity, we just say ‘association’\
    \ when we actually mean ‘binary association’.\n\n| *Committee*-has-*ClubMember*-as-chair\
    \ |\n\n| --- |\n\n| Finance Committee | Peter Miller |\n\n| Recruitment Committee\
    \ | Susan Smith |\n\n| Advisory Committee | Sarah Anderson |"
