    \ table of the “List all books” use case in `books.html`:\n\n```\n <table id=\"\
    books\">\n  <thead><tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th>\n\
    </tr></head>\n  <tbody><tbody></tbody>\n</table>\n```\n\nA book without a special\
    \ category will have an empty table cell in this column, while for all other books\
    \ their category will be shown in this column, along with other category-specific\
    \ information. This requires a corresponding switch statement in `pl.v.books.retrieveAndListAll.setupUserInterface`\
    \ in the `view/books.js` file:\n\n```\n if (book.category) {\n    switch (book.category)\
    \ {\n    case BookCategoryEL.TEXTBOOK:\n         row.insertCell(-1).textContent\
    \ = book.subjectArea + \" textbook\";\n         break;\n    case BookCategoryEL.BIOGRAPHY:\n\
    \         row.insertCell(-1).textContent = \"Biography about \"+ book.about;\n\
    \         break;\n    }\n}\n```\n\n##### 13.2.4.3 Add a *Category* Selection Field\
    \ in *Create and Update*\n\nIn both use cases, we need to allow selecting a special\
    \ category (‘textbook’ or ‘biography’) with the help of a selection field, as\
    \ shown in the following HTML:\n\n```\n <div class=\"field\">\n<label>Category:\
    \ <select name=\"category\"></select></label>\n</div>\n<div class=\"field Textbook\"\
    ><!-- conditional field -->\n<label>Subject area: <input type=\"text\" name=\"\
    subjectArea\" /></label>\n</div>\n<div class=\"field Biography\"><!-- conditional\
    \ field -->\n<label>About: <input type=\"text\" name=\"about\" /></label>\n</div>\n\
    ```\n\nNotice that we have added “Textbook” and “Biography” as additional values\
    \ of the class attribute of the segment field container. This supports the rendering\
    \ and un-rendering of “Textbook” and “Biography” form fields, depending on the\
    \ value of the category attribute.\n\nIn the `handleCategoryChangeEvent` handler,\
    \ segment property form fields are only displayed, with `pl.v.app.displaySegmentFields`,\
    \ when a corresponding book category has been selected:\n\n```\n pl.v.books.handleCategoryChangeEvent\
    \ = function (e) {\n    var formEl = e.currentTarget.form,\n           categoryIndexStr\
    \ = formEl.category.value;\n    if (categoryIndexStr) {\n         pl.v.app.displaySegmentFields(formEl,\
    \ BookCategoryEL.labels,\n                  parseInt(categoryIndexStr) + 1);\n\
    \    } else {\n       pl.v.app.undisplayAllSegmentFields(formEl, BookCategoryEL.labels);\n\
    \    }\n};\n```\n\nRecall that the category selection list contains a no-selection\
    \ option “–––” with the empty string as its return value, and a list of options\
    \ formed by the enumeration labels of `BookCategoryEL.labels` such that their\
    \ value is the corresponding array index (starting with 0) as a string. Consequently,\
    \ the variable `categoryIndexStr` has either the value \"\" (empty string) or\
    \ one of “0”, “1”, “2”, etc.\n\n### 13.3 Case Study 2: Implementing a Class Hierarchy\n\
    \nWhenever a class hierarchy is more complex, we cannot simply eliminate it, but\
    \ have to implement it (1) in the app’s model code, (2) in the underlying database\
    \ and (3) in its user interface.\n\nThe starting point for our case study is the\
    \ design model shown in Figure 12.8 above. In the following sections, we derive\
    \ a *JS class model* and a *JS entity table model* from the design model. The\
    \ entity table model is used as a design for the object-to-storage mapping that\
    \ we need for storing the objects of our app with the browsers’ Local Storage\
    \ technology.\n\n#### 13.3.1 Make a JS Class Model\n"
  raw: "While the getters for segment properties (in this example: subjectArea and\
    \ about) follow the standard pattern, their checks and setters have to make sure\
    \ that the property applies to the category of the instance being checked. This\
    \ is achieved by checking a combination of a property value and a category, as\
    \ in the following example:\n\n```\n static checkSubjectArea( sA, c) {\n     if\
    \ (c === BookCategoryEL.TEXTBOOK && !sA) {\n        return new MandatoryValueConstraintViolation(\n\
    \                \"A subject area must be provided for a textbook!\");\n     \
    \ } else if (c !== BookCategoryEL.TEXTBOOK && sA) {\n         return new ConstraintViolation(\"\
    A subject area must not \" +\n                \"be provided if the book is not\
    \ a textbook!\");\n      } else if (sA && (typeof(sA) !== \"string\" || sA.trim()\
    \ === \"\")) {\n         return new RangeConstraintViolation(\n              \
    \  \"The subject area must be a non-empty string!\");\n      } else {\n      \
    \   return new NoConstraintViolation();\n      }\n}\n```\n\nIn the serialization\
    \ function toString, we serialize the category attribute and the segment properties\
    \ in a switch statement:\n\n```\n toString() {\n     var bookStr = \"Book{ ISBN:\"\
    + this.isbn +\", title:\"+\n             this.title +\", year:\"+ this.year;\n\
    \     switch (this.category) {\n     case BookCategoryEL.TEXTBOOK:\n         \
    \ bookStr += \", textbook subject area:\"+ this.subjectArea;\n          break;\n\
    \     case BookCategoryEL.BIOGRAPHY:\n          bookStr += \", biography about:\
    \ \"+ this.about;\n          break;\n     }\n     return bookStr + \"}\";\n};\n\
    ```\n\nIn the update method of a model class, we only set a property if it is\
    \ to be updated, that is, if there is a corresponding argument slot with a value\
    \ that is different from the old property value. In the special case of a category\
    \ attribute with a *Frozen Value Constraint*, we need to make sure that it can\
    \ only be updated, along with an accompanying set of segment properties, if it\
    \ has not yet been assigned. Thus, in the Book.update method, we perform the special\
    \ test if book.category === undefined for handling the special case of an initial\
    \ assignment, while we handle updates of the segment properties subjectArea and\
    \ about in a more standard way:\n\n```\n Book.update = function ({isbn, title,\
    \ year,\n         category, subjectArea, about}) {\n     const book = Book.instances[isbn],\n\
    \             objectBeforeUpdate = util.cloneObject( book);\n     var noConstraintViolated=true,\
    \ updatedProperties=[];\n     try {\n            …\n            if (category &&\
    \ book.category !== category) {\n               book.category = category;\n  \
    \             updatedProperties.push(\"category\");\n            } else if (category\
    \ === \"\" && \"category\" in book) {\n               throw FrozenValueConstraintViolation(\n\
    \                       \"The book category cannot be unset!\");\n           \
    \ }\n            if (subjectArea && book.subjectArea !== subjectArea) {\n    \
    \            book.subjectArea = subjectArea;\n                updatedProperties.push(\"\
    subjectArea\");\n            }\n            if (about && book.about !== about)\
    \ {\n                book.about = about;\n                 updatedProperties.push(\"\
    about\");\n             }\n      } catch (e) {\n                 …\n      }\n\
    \      …\n};\n```\n\n#### 13.2.4 Write the View and Controller Code\n\nThe app’s\
    \ user interface (UI) consists of a start page that allows navigating to data\
    \ management pages (in our example, to books.html). Such a data management page\
    \ contains 5 sections: *manage books*, *list and retrieve all books*, *create\
    \ book*, *update book* and *delete book*, such that only one of them is displayed\
    \ at any time (by setting the CSS property display:none for all others).\n\n#####\
    \ 13.2.4.1 Summary\n\nWe have to take care of handling the category attribute\
    \ and the segment properties subjectArea and about both in the “Retrieve and list\
    \ all books” use case as well as in the “Create book” and “Update book” use cases\
    \ by\n\n1.  Adding a segment information column (with heading “Category”) to the\
    \ display table of the “Retrieve and list all books” use case in books.html.\n\
    \n2.  Adding a “Category” selection field, and input fields for all segment properties,\
    \ in the forms of the “Create book” and “Update book” use cases in books.html.\
    \ The form fields for segment properties are only displayed, when a corresponding\
    \ book category has been selected.\n\n##### 13.2.4.2 Add a Segment Information\
    \ Column in *Retrieve/List All*\n\nWe add a “Special type” column to the display\
    \ table of the “List all books” use case in books.html:\n\n```\n <table id=\"\
    books\">\n  <thead><tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th>\n\
    </tr></thead>\n  <tbody></tbody>\n</table>\n```\n\nA book without a special category\
    \ will have an empty table cell in this column, while for all other books their\
    \ category will be shown in this column, along with other category-specific information.\
    \ This requires a corresponding switch statement in pl.v.books.retrieveAndListAll.setupUserInterface\
    \ in the view/books.js file:\n\n```\n if (book.category) {\n    switch (book.category)\
    \ {\n    case BookCategoryEL.TEXTBOOK:\n         row.insertCell(-1).textContent\
    \ = book.subjectArea + \" textbook\";\n         break;\n    case BookCategoryEL.BIOGRAPHY:\n\
    \         row.insertCell(-1).textContent = \"Biography about \"+ book.about;\n\
    \         break;\n    }\n}\n```\n\n##### 13.2.4.3 Add a *Category* Selection Field\
    \ in *Create* and *Update*\n\nIn both use cases, we need to allow selecting a\
    \ special category of book (‘textbook’ or ‘biography’) with the help of a selection\
    \ field, as shown in the following HTML fragment:\n\n```\n <div class=\"field\"\
    >\n<label>Category: <select name=\"category\"></select></label>\n</div>\n<div\
    \ class=\"field Textbook\"><!-- conditional field -->\n<label>Subject area: <input\
    \ type=\"text\" name=\"subjectArea\" /></label>\n</div>\n<div class=\"field Biography\"\
    ><!-- conditional field -->\n<label>About: <input type=\"text\" name=\"about\"\
    \ /></label>\n</div>\n```\n\nNotice that we have added “Textbook” and “Biography”\
    \ as additional values of the class attribute of the segment field container elements.\
    \ This supports the rendering and un-rendering of “Textbook” and “Biography” form\
    \ fields, depending on the value of the category attribute.\n\nIn the handleCategorySelectChangeEvent\
    \ handler, segment property form fields are only displayed, with pl.v.app.displaySegmentFields,\
    \ when a corresponding book category has been selected:\n\n```\n pl.v.books.handleCategorySelectChangeEvent\
    \ = function (e) {\n    var formEl = e.currentTarget.form,\n           categoryIndexStr\
    \ = formEl.category.value;\n    if (categoryIndexStr) {\n         pl.v.app.displaySegmentFields(\
    \ formEl, BookCategoryEL.labels,\n                  parseInt( categoryIndexStr)\
    \ + 1);\n    } else {\n       pl.v.app.undisplayAllSegmentFields( formEl, BookCategoryEL.labels);\n\
    \    }\n};\n```\n\nRecall that the category selection list contains a no-selection\
    \ option “–––” with the empty string as its return value, and a list of options\
    \ formed by the enumeration labels of BookCategoryEL.labels such that their value\
    \ is the corresponding array index (starting with 0) as a string. Consequently,\
    \ the variable categoryIndexStr has either the value ““ (empty string) or one\
    \ of “0”, “1”, “2”, etc.\n\n### 13.3 Case Study 2: Implementing a Class Hierarchy\n\
    \nWhenever a class hierarchy is more complex, we cannot simply eliminate it, but\
    \ have to implement it (1) in the app’s model code, (2) in the underlying database\
    \ and (3) in its user interface.\n\nThe starting point for our case study is the\
    \ design model shown in Figure 12.8 above. In the following sections, we derive\
    \ a *JS class model* and a *JS entity table model* from the design model. The\
    \ entity table model is used as a design for the object-to-storage mapping that\
