  trans: "\n\n虽然个体关系（例如 `FinanceCommittee`-`has`-`PeterMiller`-`as-chair`）是业务通信和信息系统中的重要信息项，但关联（例如\
    \ `Committee`-`has`-`ClubMember`-`as-chair`）是*信息模型*中的重要元素。因此，软件应用程序必须以适当的方式实现它们，通常作为其在*模型-视图-控制器*（`MVC`）架构中*模型*层\
    \ model 层的一部分。遗憾的是，许多应用程序开发框架缺乏处理关联所需的支持。\n\n在数学中，关联以抽象的方式形式化为均匀元组的集合，称为*关系*。在*实体-关系*（*ER*）建模中（这是信息系统和软件工程中经典的信息建模方法），对象被称为*实体*，关联被称为*关系类型*。*统一建模语言（*UML*）*包含了用于信息建模的\
    \ *UML 类图*语言。在 UML 中，对象类型被称为*类*，关系类型被称为*关联*，而个体关系被称为“链接”。这三个术语总结在下表中：\n\n| 我们首选的术语\
    \ | UML | ER 图 | 数学 |\n| --- | --- | --- | --- |\n| object | object | entity |\
    \ individual |\n| object type (class) | class | entity type | unary relation |\n\
    | relationship | link | relationship | tuple |\n| association (relationship type)\
    \ | association | relationship type | relation |\n| functional association | |\
    \ 一对一, 多对一或一对多关系类型 | function |\n\n我们首先讨论引用属性，它在“无无关联”的类模型（一种不包含任何显式关联元素的模型）中隐式地表示了单向二元关联。\n\
    \n## 1.1 引用与引用属性\n\n引用可以是*人类可读的*，也可以是*内部对象引用*。人类可读引用指的是人类通信中使用的标识符，例如天体的唯一名称、书籍的\
    \ ISBN 以及公司员工的工号。内部对象引用指的是 `OOP` 对象的内存地址，从而为访问计算机主内存中的对象提供了一种高效机制。\n\n某些语言（如 `SQL`\
    \ 和 `XML`）仅支持人类可读的引用，不支持内部引用。在 `SQL` 中，人类可读引用被称为*外键*，它们所引用的标识符被称为*主键*。在 `XML`\
    \ 中，人类可读引用被称为*ID 引用*，对应的属性类型为 `IDREF`。\n\n`OO` 程序中的对象可以通过借助人类可读引用（如整数代码）或内部对象引用来引用，后者更有于高效访问主内存中的对象。遵循\
    \ `XML` 的术语，我们将人类可读引用称为*ID 引用*。我们遵循 ID 引用属性的标准命名约定：定义在类 `A` 中引用类 `B` 对象的 ID 引用属性使用后缀\
    \ `_id` 命名 `b_id`。当我们以记录或表行的形式存储持久对象时，我们需要将存储在 `publisher` 等属性中的内部对象引用转换为存储在 `publisher_id`\
    \ 等属性中的 ID 引用。这种转换是对象序列化的一部分，通过将被引用对象的标准标识符值分配给引用对象的 ID 引用属性来完成。\n\n在 `OO` 语言中，属性是为对象类型（或类）定义的，其称为其*域*。属性的值要么是来自某些数据类型的*数据值*（在这种情况下该属性被称为***属性***），要么引用某个类中对象的*对象引用*（在这种情况下该属性被称为***引用属性***）。例如，下方图\
    \ 1.1 所示的 `Committee` 类有一个范围为 `String` 的属性名，以及一个范围为 `ClubMember` 的引用属性 `chair`。\n\
    \n![](img/b_9783110500325-001_fig_001.png)\n\n图 1.1: 委员会有一个俱乐部成员担任主席，通过引用属性 `chair`\
    \ 表达。\n\n面向对象的编程语言（如 `JavaScript`、`PHP`、`Java` 和 `C#`）直接支持*引用属性*的概念，这种属性的范围不是*数据类型*而是*引用类型*或*类*，其值是指向该类实例的对象引用。\n\
    \n默认情况下，属性的取值个数为 1，这意味着该属性是***强制的***且是函数性的***（或者换句话说，是*单值的*），具有***恰好一个***值，类似于图\
    \ 1.1 所示所示 `Committee` 类中的 `chair` 属性。当函数性属性是***可选的***（非强制的）时，它的取值个数为 0..1，这意味着该属性的最小基数为为\
    \ 0，最大基数为为 1。\n\n引用属性可以是***单值的***（*函数性的*）也可以是***多值的***（*非函数性的*）。例如，图 1.1 所示的引用属性\
    \ `Committee::chair` 是单值的，因为它为委员会分配了一个唯一的俱乐部成员作为主席。*多值*引用属性的示例由下方图 1.11 所示的 `Book::authors`\
    \ 属性提供。\n\n通常，多值引用属性的集合值是一个集合，这意味着引用的顺序并不重要。但在某些情况下，顺序是重要的，因此这种多值引用属性的集合值是有序的集合，通常通过列表实现。\n\
    \n## 1.2 引用完整性\n\n引用是我们应用程序数据库中的重要信息项。然而，只有当应用程序维护它们的*引用完整性*时，它们才有意义。这要求任何引用都存在一个被引用的对象。因此，任何域类为\
    \ `C` 范围类为 `D` 的引用属性 `p` 都有一个*引用完整性约束*，该约束在以下任何情况下都需要检查：\n\n1. 创建新的 `C` 类型对象时；\n\
    2. 更改某些 `C` 类型对象的 `p` 值时；\n3. 销毁 `D` 类型对象时。\n\n引用完整性约束还意味着两个*变更依赖*：\n\n1. ***对象创建依赖***：带有另一个对象引用的对象\
    \ own 只有在被引用对象创建后才能被创建。\n2. ***对象销毁依赖***：被其他对象引用的对象只有在以下之后才能被销毁：\n    1. 先删除引用对象（`CASCADE`\
    \ 删除策略）；\n    2. 引用对象中的引用被删除（`DROP-REFERENCE` 删除策略）或替换为另一个引用。\n\n对于我们应用程序模型类中的每个引用属性，我们必须选择这两种可能的*删除策略*中的一种。\n\
    \n在某些情况下，我们可能想要放这种严格的制度，允许创建对 ID 引用属性具有非引用值的对象，但我们不考虑此类情况。\n\n通常，对象创建依赖是在用户界面中管理的，即不允许用户输入\
    \ ID 引用属性的值，而是让他们从所有现有目标对象的列表中选择一个。\n\n## 1.3 将引用属性建模为单向关联\n\n"
- fmt: '

    A reference property (such as `chair` in the example shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)
    above) can be modeled in a UML class diagram in the form of an `association end`
    owned by its domain class, which is visualized with the help of a small filled
    circle (also called a “dot”). This requires to connect the domain class and the
    range class of the reference property with an association line, place an `ownership
    dot` at the end of this line at the range class side, and annotate this association
    end with the property name and with a multiplicity symbol, as shown in [Figure
    1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002) below for the case
    of our example. In this way we get a `unidirectional association`, the `source`
    class of which is the property’s `domain` and the `target` class of which is the
    property’s `range`.


    The fact that an association end is `owned` by the class at the other end, as
    visually expressed by the `association end ownership dot` at the association end
    `chair` in the example shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    below, implies that the association end represents a reference property. In the
    example of [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002),
    the represented reference property is `Committee::chair` having `ClubMember` as
    range. Such an association, with only one association end ownership dot, is `unidirectional`
    in the sense that it allows `navigation` (object access) in one direction only:
    from the class at the opposite side of the dot (the `source` class) to the class
    where the dot is placed (the `target` class).


    ![](graphic/converted/b_9783110500325-001_fig_002.png)


    Figure 1.2: An association end with a “dot”.


    Thus, the two diagrams shown in [Figures 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)
    and [1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002) express essentially
    equivalent models. When a reference property, like `chair` in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001),
    is modeled by an association end with a “dot”, then the property’s multiplicity
    is attached to the association end. Since in a design model, all association ends
    need to have a multiplicity, we also have to define a multiplicity for the other
    end at the side of the `Committee` class, which represents the inverse of the
    property. This multiplicity (of the inverse property) is not available in the
    original property description in the model shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001),
    so it has to be added according to the intended semantics of the association.
    It can be obtained by answering the question “is it mandatory that any `ClubMember`
    is the chair of a `Committee`?” for finding the minimum cardinality and the question
    “can a `ClubMember` be the chair of more than one `Committee`?” for finding the
    maximum cardinality.


    When the value of a property is a set of values from its range, the property is
    `non-functional` and its multiplicity is either `0..*` or `n..*` where `n > 0`.
    Instead of `0..*`, which means “neither mandatory nor functional”, we can simply
    write the asterisk symbol `*`. The association shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    assigns at most one object of type `ClubMember` as `chair` to an object of type
    `Committee`. Consequently, it’s an example of a `functional association`.


    An overview about the different cases of functionality of an association is provided
    in [Table 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_tab_003).


    Table 1.1: Functionality types.


    | Functionality type | Meaning |

    | --- | --- |

    | one-to-one | both functional and inverse functional |

    | many-to-one | functional |

    | one-to-many | inverse functional |

    | many-to-many | neither functional nor inverse functional |


    Notice that the directionality and the functionality of an association are independent
    of each other. So, a unidirectional association can be `one-to-one` or `many-to-many`.


    ### Representing Unidirectional Associations as Reference Properties


    A unidirectional association between a `source` and `target` class can be represented
    as a reference property of the `source` class. This is illustrated in [Figure
    1.3](#9783110500240_000634.xhtml_b_9783110500325-001_fig_003) below for two associations:
    a `many-to-one` and `many-to-many`.


    ![](graphic/converted/b_9783110500325-001_fig_003.png)


    Figure 1.3: Representing unidirectional associations.


    Notice that, in a way, we have eliminated the explicit associations and replaced
    them with reference properties. OOP languages do not support this as first citizens.


    ### Adding Directionality to a Non-Directed Association


    When we make an information model in the form of a UML class diagram, we typically
    end up with associations that do not have any direction, for instance, in [Figure
    1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004) below. When there
    is no ownership dot at either end of an association, this means that the model
    does not specify direction. According to the UML specification, the ends of such
    an association are “owned” by itself, not by any of the classes participating
    in it.


    ![](graphic/converted/b_9783110500325-001_fig_004.png)


    Figure 1.4: A model of a non-directed association between `Committee` and `ClubMember`.


    An information design that contains an association without association end dots
    is acceptable as a relational database model, but it is incomplete as a design
    for OOP languages. For instance, the model of [Figure 1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004)
    provides a relational database design with two tables, `committees` and `clubmembers`,
    and a separate one-to-one relationship table `committee_has_clubmember_as_chair`.
    But it does not provide a design for Java classes, since it does not specify how
    the association is to be implemented with the help of reference properties.


    There are three options to turn an information design model of a non-directed
    association (without any association end dots) into an information design model
    where all associations are either unidirectional or bidirectional: we can place
    an ownership dot at either end or at both ends of the association. Each of these
    three options defines a different way to represent, or implement, the association
    with the help of reference properties. So, for the association shown in [Figure
    1.4](#9783110500240_000634.xhtml_b_9783110500325-001_fig_004) above, we have the
    following options:


    1. Place an ownership dot at the `chair` association end, leading to the model
    shown in [Figure 1.2](#9783110500240_000634.xhtml_b_9783110500325-001_fig_002)
    above, which can be transformed into the OO class model shown in [Figure 1.1](#9783110500240_000634.xhtml_b_9783110500325-001_fig_001)
    above.


    2. Place an ownership dot at the `chairedCommittee` association end, leading to
    the completed models shown in [Figure 1.8](#9783110500240_000634.xhtml_b_9783110500325-001_fig_003)
    below.

    '
