  trans: "\n当一个 `Book` 实例 `b`（拥有一个单一引用 `b.publisher` 指向 `Publisher` 实例以及多个引用 `b.authors`\
    \ 指向 `Author` 实例）被销毁时，必须先移除衍生反向引用（例如，通过从 `p.publishedBooks` 中移除 `b`）。这通过对单值和多值属性调用带有\
    \ `null` 参数的 set 方法来实现，例如在 `Book.delete` 方法中调用 `b.setPublisher(null)` 和 `b.setAuthors(null)`：\n\
    \n```\npublic class Book {\n…\npublic static void delete(EntityManager em,\nUserTransaction\
    \ ut, String isbn) throws Exception {\nut.begin();\nBook b = em.find(Book.class,\
    \ isbn);\nb.setPublisher(null);\nb.setAuthors(null);\nem.remove(b);\nut.commit();\n\
    }\n}\n```\n\n同样，在删除 `Publisher` 或 `Author` 实例时，我们也必须删除对 `Book` 实例的引用：\n\n```java\n\
    public class Author {\n…\npublic static void delete(EntityManager em,\nUserTransaction\
    \ ut, Integer personId) throws Exception {\nut.begin();\nAuthor a = em.find(Author.class,\
    \ personId);\na.setAuthorBooks(null);\nem.remove(a);\nut.commit();\n}\n}\n```\n\
    \n同样地，\n\n```java\npublic class Publisher {\npublic static void delete(EntityManager\
    \ em,\nUserTransaction ut, String name) throws Exception {\nut.begin();\nPublisher\
    \ p = em.find(Publisher.class, name);\np.setPublishedBooks(null);\nem.remove(p);\n\
    ut.commit();\n}\n}\n```\n\n### 9.2.7 实体管理器和缓存实体\n\n遗憾的是，JPA 不提供衍生反向引用的自动维护。根据\
    \ Java Persistence Wiki，我们必须在 `set/remove` 方法中实现（直接和反向）关系：\n\n双向关系中的一个常见问题是应用程序更新了关系的一侧，但另一侧没有更新并导致不同步。在\
    \ JPA 中，与在 Java Java 中，维护关系是应用程序或对象模型的责任。如果你的应用程序向关系的一侧添加了内容，它也必须向另一侧添加。这通常通过对象模型中处理两边的\
    \ `add` 或 `set` 方法来解决。有两种方法：你可以只将关系维护添加到关系的一侧，并仅使用该侧的 setter（例如将另一侧设为 protected），或者将其添加到两侧中，并确保你避免了无限循环。\n\
    \n我们为每个控制器类都使用了一个 `entityManager`。每个 `entityManager` 都维护一个缓存实体集，这些实体可以通过 `merge`\
    \ 方法与其他实体管理器“共享”。在我们的示例代码中，作为每个模型类 `create` 和 `update` 方法的一部分，我们必须合并属于另一个 `entityManager`\
    \ 的已更新实体。例如，在 `Book.create` 方法中，我们需要合并由 `PublisherController` 的 `entityManager`\
    \ 管理的新书的出版者，以及由 `AuthorController` 的 `entityManager` 管理的所有作者：\n\n```java\npublic\
    \ class Book {\npublic static void create(EntityManager em,\nUserTransaction ut,\n\
    String isbn, String title, Integer year,\nPublisher publisher, Set<Author> authors)\n\
    throws Exception {\nut.begin();\nBook book = new Book(isbn, title, year,\npublisher,\
    \ authors);\nem.persist(book);\nif (publisher != null) {\nem.merge(publisher);\n\
    }\nif (authors != null)\nfor (Author a : authors) {\nem.merge(a);\n}\nut.commit();\n\
    }\n}\n}\n```\n\n如果不使用 `merge`，`Publisher` 以及 `authors` 列表中的所有 `Author` 实例都不代表指向原始缓存实体的引用，并且不会保留我们的更改。更多详细信息请检查与此问题相关的\
    \ Java Persistence 文档。\n\n也可以禁用 JPA 缓存，以便每个新实例都从数据库重新加载实体，例如当调用 `EntityManager.find`\
    \ 方法时。这可以通过在 `persistence.xml` 文件添加以下行来实现：\n\n```\n<property name=\"eclipselink.cache.shared.default\"\
    \ value=\"false\"/>\n```\n\n上述配置适用于 `eclipselink` 实现，对于其他 API 实现可能会有所不同。注意，如果没有严重理由，不建议禁用实体缓存，因为这会降低应用的性能，并在某些情况下（例如使用\
    \ `@SessionScoped` 管理的实体）可能会产生不可预测的行为。\n\n### 9.3 在用户界面中利用衍生反向引用属性\n\n我们现在可以衍生反向引用属性\
    \ `Publisher::publishedBooks` 和 `Author::authoredBooks`，在 `retrieve/list all publishers`\
    \ 和 `retrieve/list all authors` 用例中更高效地创建关联书籍列表。\n\n#### 9.3.1 在检索/列出所有中显示已出版书籍的信息\n\
    \n为了 `retrieve/list all publishers` 用例显示已出版书籍的信息，我们现在可以利用衍生反向引用属性 `publishedBooks`：\n\
    \n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define\
    \ name=\"content\">\n<h:dataTable value=\"#{publisherController.publishers}\"\
    \ var=\"p\">\n…\n<h:column>\n<f:facet name=\"header\">Published books</f:facet>\n\
    \  <h:outputText value=\"#{p.publishedBooks}\" escape=\"false\"\n  converter=\"\
    pl.m.converter.BookListConverter\"/>\n</h:column>\n </h:dataTable>\n <h:button\
    \ value=\"Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\n\
    在单向关联的情况下，对于 `retrieve/list all books` 用例，我们在 `Book` 模型类中使用了一个方法，即 `getAuthorNames()`，它返回逗号分隔的作者列表字符串：\n\
    \n```java\npublic class Book {\n …\npublic String getAuthorNames() {\n String\
    \ result = \"\";\n int i = 0, n = 0;\n if (this.authors != null) {\n n = this.authors.size();\n\
    \ for (Author author : this.authors) {\n result += author.getName();\n if (i <\
    \ n - 1) {\n result += \", \";\n }\n i++;\n }\n }\nreturn result;\n}\n```\n\n\
    这在书籍的情况下是有意义，因为作者数量通常是有限的。然而，一个 `Publisher` 可能有很多出版书籍。作为字符串序列化的更好替代方案，可以使用 JSF\
    \ 转换器以自定义的方式展示作者列表。在我们案例中，我们选择将其列表展示，每个名字单独一行。为了实现，我们实现了 `pl.m.converter.BookListConverter`\
    \ 类，并按如下方式对其使用 `@FacesConverter` 注解：\n\n```java\n@FacesConverter(value=\"pl.m.converter.BookListConverter\"\
    )\npublic class BookListConverter implements Converter {\n@Override\npublic Object\
    \ getAsObject(FacesContext context,\nUIComponent component, String value) {\n\
    return null; // 此方法不需要\n}\n@Override\npublic String getAsString(FacesContext context,\n\
    UIComponent component, Object value) {\nString result = \"\";\nint i=0, n=0;\n\
    if (value == null) {\nreturn null;\n} else if (value instanceof Set<?>) {\nn =\
    \ ((Set<Book>) value).size();\nfor (Book b : (Set<Book>) value) {\nresult += b.getTitle();\n\
    if (i < n-1) {\nresult += \"<br />\";\n}\ni++;\n}\nreturn result;\n}\nreturn null;\n\
    }\n}\n```\n\n然后，我们在 facelet 中使用 `converter` 属性来指定当相应的视图组件需要渲染时使用我们的转换器类，例如 `pl.m.converter.BookListConverter`：\n\
    \n```xml\n<h:column>\n<f:facet name=\"header\">Published books</f:facet>\n<h:outputText\
    \ value=\"#{p.publishedBooks}\" escape=\"false\"\nconverter=\"pl.m.converter.BookListConverter\"\
    />\n</h:column>\n```\n\n由于序列化文本包含 HTML 元素，即用于产生 HTML 换行的 `<br />`，我们必须指定 `escape=\"\
    false\"` 属性，否则 `<` 和 `>` 将被替换为相应的 `&lt;` 和 `&gt;` 实体。\n"
- fmt: "\nThe main advantage of using JSF converters is that we do not mix model code\
    \ with view specific code, so our model classes remain clean and later, if we\
    \ like to replace JSF with another UI technology, then our model classes remain\
    \ unchanged, and we just need to take care of a corresponding converter for the\
    \ new technology.\n\n## 9.4 Run the App and Get the Code\n\nFor running your application,\
    \ you may first have to stop your Tomcat/TomEE server (with `bin/shutdown.bat`\
    \ for Windows or `bin/shutdown.sh` for Linux). Next, download and unzip our ZIP\
    \ archive file containing all the source code of the application and also the\
    \ ANT script file that you have to edit (modify the `server.folder` property value).\
    \ Now, execute the following command in your console or terminal:\n\n```\nant\
    \ deploy -Dappname=BidirectionalAssociationApp\n```\n\nFinally, start your Tomcat\
    \ web server (by using `bin/startup.bat` for Windows OS or `bin/startup.sh` for\
    \ Linux). Please be patient, this can take some time depending on the speed of\
    \ your computer. Finally, open a web browser and type:\n\n```\n http://localhost:8080/BidirectionalAssociationApp/WebContent/views/app/index.xhtml\n\
    ```\n\n## 10 Special Topics on Associations\n\n### 10.1 Part-Whole Associations\n\
    \nA part-whole association represents a relationship between a part type and a\
    \ whole type. Its instances are part-whole relationships between two objects where\
    \ one of them is a part of the other (the whole). The UML makes a distinction\
    \ between two kinds of part-whole associations: `aggregation` and `composition`.\
    \ While these two terms are defined in a pretty precise, albeit unsatisfactory,\
    \ way in the UML, many software developers have a different interpretation following\
    \ a terminological tradition of the C++ programming community where, unlike the\
    \ parts of an ‘aggregation’, the parts of a ‘composition’ cannot exist independently\
    \ of the composite that references them.\n\nWe follow the UML and improve their\
    \ definition of composition by introducing a distinction between two kinds of\
    \ compositions: those with `separable` parts and those with `inseparable` parts.\n\
    \n#### 10.1.1 Aggregation\n\nAn aggregation is a special form of a part-whole\
    \ association, where the parts of a whole can be shared with other wholes. For\
    \ instance, we can model an aggregation between the classes `DegreeProgram` and\
    \ `Course`, as shown in the following diagram, since a course is part of a degree\
    \ program and a course can be shared among two or more degree programs (e.g. an\
    \ engineering degree could share a C programming course with a computer science\
    \ degree).\n\n![](graphic/converted/b_9783110500325-010_ingr_001.png)\n\nHowever,\
    \ the concept of an aggregation with `shareable parts` doesn’t mean much, really,\
    \ so it does not have any implications on how to code the association and many\
    \ developers therefore prefer not to use the white diamond in their class diagrams,\
    \ but just model a plain association instead. The UML spec says: “Precise semantics\
    \ of shared aggregation varies by application area and modeler”.\n\nThe `multiplicity`\
    \ of an aggregation’s association end at the whole side may be any number (`*`)\
    \ because a part may belong to, or `shared` among, any number of wholes.\n\n####\
    \ 10.1.2 Composition\n\nIt’s amazing how much confusion exists about the distinction\
    \ between the part-whole association concepts `aggregation` and `composition`.\
    \ The main problem is the widespread misunderstanding (even among expert software\
    \ developers and among the authors of UML) that the concept of composition implies\
    \ a life-cycle dependency between the whole and its parts such that the parts\
    \ cannot exist without the whole. But this view ignores the fact that there are\
    \ also cases of part-whole associations with non-shareable parts where the parts\
    \ can be detached from and survive the destruction of the whole.\n\nIn the UML\
    \ specification document, the definition of the term “composition” has always\
    \ implied non-shareable parts, but it has not been clear what is the defining\
    \ characteristic of “composition”, and what is merely an optional characteristic.\
    \ Even in the UML version 2.5 (as of 2015), after an attempt to improve the definition\
    \ of the term “composition”, it remains still ambiguous and doesn’t provide any\
    \ guidance how to model part-whole associations with non-shareable parts where\
    \ the parts can be detached from, and survive the destruction of, the whole as\
    \ opposed to the case where the parts cannot be detached and are destroyed together\
    \ with the whole. They say:\n\n> If a composite object is deleted, all of its\
    \ part instances that are objects are deleted with it.\n\nBut at the same time\
    \ they also say:\n\n> A part object may be removed from a composite object before\
    \ the composite object is deleted, and thus not be deleted as part of the composite\
    \ object.\n\nThis confusion points to an incompleteness of the UML definition,\
    \ which does not account for life-cycle dependencies between components and composites.\
    \ It’s therefore important to understand how the UML definition can be enhanced,\
    \ e.g. by introducing a UML stereotype for «inseparable» compositions, or by introducing\
    \ a constraint keyword inseparable for characterizing the association end at the\
    \ component side.\n\nAs Martin Fowler has explained, the main issue for characterizing\
    \ composition relationships is that “an object can only be the part of one composition\
    \ relationship”. This is also explained in the blog post UML Composition vs Aggregation\
    \ vs Association by G. Bellekens. In addition to this defining characteristic\
    \ of a composition (to have `exclusive`, or `non-shareable`, parts), a composition\
    \ may also come with a life-cycle dependency between the composite and its components.\
    \ In fact, there are two kinds of such dependencies:\n\n1. Whenever a component\
    \ `must always be attached` to a composite, or, in other words, when it has a\
    \ `mandatory composite`, as expressed by the “exactly one” multiplicity at the\
    \ composite side of the composition line, then it must either be re-used in (or\
    \ re-attached to) another composite, or destroyed, when its current composite\
    \ is destroyed. This is exemplified by the composition between `Person` and `Heart`,\
    \ shown in the diagram below. A heart is either destroyed or transplanted to another\
    \ person, when its owner has died.\n\n2. Whenever a component `must not be detached`\
    \ from its composite, or, in other words, when it is `inseparable`, then, and\
    \ only then, the component has to be destroyed, when its composite is destroyed.\
    \ An example of such a composition with inseparable parts is the composition between\
    \ `Person` and `Brain`.\n\n![](graphic/converted/b_9783110500325-010_ingr_002.png)\n\
    \nIn summary, the life-cycle dependency created by inseparable parts only applies\
    \ to specific cases of composition, but not in general. It is, therefore, not\
    \ a defining characteristic. The UML spec states: “A part may be removed from\
    \ a composite instance before the composite instance is deleted, and thus not\
    \ be deleted as part of the composite instance.”\n\nWhen such a life-cycle dependency\
    \ applies, it represents a special form of `Existential Dependency*, which implies\
    \ the CASCADE deletion policy discussed in [Section 1.2](#9783110500240_000634.xhtml_b_9783110500325-010_s_002).\n\
    \nIn the example of a `Car-Engine` composition, as shown in the following diagram,\
    \ it’s clearly the case that the engine can be detached from the car before the\
    \ car is destroyed, in which case the engine is not destroyed and can be re-used.\
    \ This is implied by the `zero or one` multiplicity at the composite side of the\
    \ composition line.\n\n![](graphic/converted/b_9783110500325-010_ingr_003.png)\n\
    \n#### 10.1.3 Example\n"
