  trans: "\n\n使用 JSF 转换器的主要优势是我们没有将模型代码与视图特定的代码混合，因此我们的模型类保持整洁。将来，如果我们想将 JSF 替换为其他\
    \ UI 技术，我们的模型类保持不变，我们只需要为新技术准备相应的转换器即可。\n\n## 9.4 运行应用并获取代码\n\n运行应用程序之前，你可能需要先停止你的\
    \ Tomcat/TomEE 服务器（Windows 使用 `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。接下来，下载并解压我们包含应用程序所有源代码的\
    \ ZIP 压缩包，以及你需要编辑的 ANT 脚本文件（修改 `server.folder` 属性值）。现在，在控制台或终端中执行以下命令：\n\n```\n\
    ant deploy -Dappname=BidirectionalAssociationApp\n```\n\n最后，启动你的 Tomcat Web 服务器（Windows\
    \ 系统使用 `bin/startup.bat`，Linux 使用 `bin/startup.sh`）。请耐心等待，这取决于你电脑的速度，需要一些时间。最后，打开浏览器并输入：\n\
    \n```\n http://localhost:8080/BidirectionalAssociationApp/WebContent/views/app/index.xhtml\n\
    ```\n\n## 10 关联的特殊主题\n\n### 10.1 部分整体关联 (Part-Whole Associations)\n\n部分整体关联表示部分类型与整体类型之间的关系。它的实例是两个对象之间的部分与整体关系，其中一个是另一个（整体）的部分。UML\
    \ 将部分整体关联分为两类：`aggregation`（聚合）和 `composition`（组合）。虽然这两个术语在 UML 中的定义方式相当精确，尽管并不尽如人意，但许多软件开发者遵循\
    \ C++ 编程社区的术语传统，对它们有不同的解释，即与“聚合”中的部分不同，“组合”中的部分不能脱离引用它们的组合体而独立存在。\n\n我们遵循 UML，通过引入两种组合之间的区别，改进了其对组合的定义：具有\
    \ `separable`（可分离的）部分类别的组合以及具有 `inseparable`（不可分离的）部分类别的组合。\n\n#### 10.1.1 聚合\
    \ (Aggregation)\n\n聚合是部分整体关联的一种特殊形式，整体的部分可以与其他整体共享。例如，我们可以对 `DegreeProgram`（学位课程）和\
    \ `Course`（课程）类之间的聚合进行建模，如下图所示，因为课程是学位课程的一部分，且一门课程可以在两个或多个学位课程之间共享（例如，工程学位可以与计算机学位共享一门\
    \ C 语言课程）。\n\n![](img/b_9783110500325-010_ingr_001.png)\n\n然而，具有 `shareable parts`（可共享部分）的聚合概念实际上并没有意义，因此它对如何编写关联代码没有任何影响，许多开发者因此倾向于不在类类图中使用空心菱形，而是仅建模为普通的关联。UML\
    \ 规范说：“共享聚合的精确语义取决于应用领域和建模者。”\n\n聚合关联在整体一侧的端点 `multiplicity`（多重）可以是任何数字（`*`），因为一个部分可能属于或\
    \ `shared`（共享）于任意数量整体。\n\n#### 10.1.2 组合 (Composition)\n\n关于部分整体关联概念 `aggregation`\
    \ 和 `composition` 之间的区别存在如此多的困惑，真是令人惊讶。主要问题在于一种广泛的误解（即使在专家软件开发者和 UML 作者之间也是如此），即组合的概念意味着整体与其部分之间存在生命周期依赖，导致部分在没有整体的情况下无法存在。但这种观点忽略了事实，即也存在不可共享部分的部分整体关联，在这种情况下，部分可以脱离整体并在整体销毁后存活。\n\
    \n在 UML 规范文档中，“组合”一词的定义一直暗示了不可共享的部分，但并不清楚“组合”的定义性特征是什么，哪些仅仅是可选特征。即使在 UML 2.5 版本（截至\
    \ 2015 年），在尝试改进“组合”术语的定义之后，它仍然是模糊的，没有提供如何建模具有不可共享部分的部分整体关联的指导（即部分可以脱离整体并存活的情况，对比部分无法脱离且随整体一起销毁的情况）。他们说：\n\
    \n> 如果组合对象被删除，其所有作为对象的部分实例都随之删除。\n\n但同时，他们又说：\n\n> 部分对象可以在组合对象被删除之前从组合对象中移除，因此不会作为组合对象的一部分被删除。\n\
    \n这种困惑指向了 UML 定义的不完整性，它没有考虑到组件与组合体之间的生命周期依赖。因此，理解如何增强 UML 定义非常重要，例如通过引入一个用于 «inseparable」（不可分离）组合的\
    \ UML 刻型，或者通过引入约束关键字 `inseparable` 来刻画组件一侧的关联端。\n\n正如 Martin Fowler 所解释的那样，刻画组合关系的主要问题是“一个对象只能是一个组合关系的部分”。在\
    \ G. Bellekens 的博客文章《UML Composition vs Aggregation vs Association》中也解释了这一点。除了组合的这种定义性特征（具有\
    \ `exclusive` 独有的或 `non-shareable` 不可共享的部分）外，组合还可能伴随着组合体与其组件之间的生命周期依赖。事实上，这种依赖有两种类型：\n\
    \n1. 每当组件 `must always be attached`（必须始终连接）到组合体时，或者说，当它具有组合线组合侧的“精确一个”多重性表示的 `mandatory\
    \ composite`（强制组合）时，那么当它的当前组合体被销毁时，它必须在另一个组合中被重用（或重新连接），或者被销毁。这可以通过下所示 `Person`（人）和\
    \ `Heart`（心脏）之间的组合作为示例。当所有者去世时，心脏要么被销毁，要么移植到另一个人身上。\n\n2. 每当组件 `must not be detached`（不能从其组合体中分离）时，或者说，当它是\
    \ `inseparable`（不可分离的）时，那么只有在这种，组件才在其组合体被销毁时被销毁。这种具有不可分离部分的组合示例是 `Person` 和 `Brain`（大脑）之间的组合。\n\
    \n![](img/b_9783110500325-010_ingr_002.png)\n\n总结来说，不可分离部分创建的生命周期依赖适用于组合的特定情况，而不是一般的。因此，它不是定义特征。UML\
    \ 规范：“部分可以在组合实例被删除之前从组合实例中移除，因此不会作为组合实例的一部分被删除。”\n\n当这种生命周期依赖适用时，它代表了 `Existential\
    \ Dependency*`（生存依赖）的特殊形式，这意味着在第 1.2 节中讨论的 CASCADE（级联）删除策略。\n\n在 `Car-Engine`（汽车-引擎）组合的示例中（如下所示），显然引擎可以在汽车被销毁之前从汽车上分离，在这种情况下引擎不会被销毁并可以被重用。这通过组合线组合侧的\
    \ `zero or one`（零或一）多重性暗示了。\n\n![](img/b_9783110500325-010_ingr_003.png)\n\n####\
    \ 10.1.3 示例\n\n"
