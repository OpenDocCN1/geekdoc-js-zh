  trans: "\n虽然分段属性的 getter（在本例中：`subjectArea` 和 `about`）遵循标准模式，但它们的检查逻辑和 setter（Setter）必须确保该属性适用于正在检查的实例的类别。这是通过检查属性值和类别的组合来实现的，例所示：\n\
    \n```\n static checkSubjectArea( sA, c) {\n     if (c === BookCategoryEL.TEXTBOOK\
    \ && !sA) {\n        return new MandatoryValueConstraintViolation(\n         \
    \       \"A subject area must be provided for a textbook!\");\n      } else if\
    \ (c !== BookCategoryEL.TEXTBOOK && sA) {\n         return new ConstraintViolation(\"\
    A subject area must not \" +\n                \"be provided if the book is not\
    \ a textbook!\");\n      } else if (sA && (typeof(sA) !== \"string\" || sA.trim()\
    \ === \"\")) {\n         return new RangeConstraintViolation(\n              \
    \  \"The subject area must be a non-empty string!\");\n      } else {\n      \
    \   return new NoConstraintViolation();\n      }\n}\n```\n\n在序列化函数 `toString()`\
    \ 中，我们在 `switch` 语句中序列化了类别属性和分段属性：\n\n```\n toString() {\n     var bookStr = \"\
    Book{ ISBN:\"+ this.isbn +\", title:\"+\n             this.title +\", year:\"\
    + this.year;\n     switch (this.category) {\n     case BookCategoryEL.TEXTBOOK:\n\
    \          bookStr += \", textbook subject area:\"+ this.subjectArea;\n      \
    \    break;\n     case BookCategoryEL.BIOGRAPHY:\n          bookStr += \", biography\
    \ about: \"+ this.about;\n          break;\n     }\n     return bookStr + \"}\"\
    ;\n};\n```\n\n在模型类的 `update` 方法中，只有当属性需要更新时我们才进行设置，即如果对应的参数槽位的值与旧属性值不同。对于具有“冻结值约束”（Frozen\
    \ Value Constraint）的类别属性的特殊情况，我们需要确保只有在它尚未被赋值时，才能连同一组分段属性一起进行更新。因此，在 `Book.update`\
    \ 方法中，我们对 `book.category === undefined` 执行特殊测试，以处理初始赋值的特殊情况，而我们以更标准的方式处理分段属性 `subjectArea`\
    \ 和 `about` 的更新：\n\n```\n Book.update = function ({isbn, title, year,\n      \
    \   category, subjectArea, about}) {\n     const book = Book.instances[isbn],\n\
    \             objectBeforeUpdate = util.cloneObject( book);\n     var noConstraintViolated=true,\
    \ updatedProperties=[];\n     try {\n            …\n            if (category &&\
    \ book.category !== category) {\n               book.category = category;\n  \
    \             updatedProperties.push(\"category\");\n            } else if (category\
    \ === \"\" && \"category\" in book) {\n               throw FrozenValueConstraintViolation(\n\
    \                       \"The book category cannot be unset!\");\n           \
    \ }\n            if (subjectArea && book.subjectArea !== subjectArea) {\n    \
    \            book.subjectArea = subjectArea;\n                updatedProperties.push(\"\
    subjectArea\");\n            }\n            if (about && book.about !== about)\
    \ {\n                book.about = about;\n                 updatedProperties.push(\"\
    about\");\n             }\n      } catch (e) {\n                 …\n      }\n\
    \      …\n};\n```\n\n### 13.2.4 编写视图和控制器代码\n\n应用程序的用户界面（UI）包含一个启动页面，允许导航到数据管理页面（在本例中，到\
    \ `books.html`）。此类数据管理页面包含 5 个部分：`manage books`、`list and retrieve all books`、`create\
    \ book`、`update book` 和 `delete book`，每次显示显示（通过对其他部分设置 CSS 属性 `display:none`）。\n\
    \n#### 13.2.4.1 总结\n\n我们需要在“检索并列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理类别属性和分段属性 `subjectArea`\
    \ 和 `about`方法如下：\n\n1. 在 `books.html` 的“检索并列出所有书籍”用例的显示表中添加分段信息列（表头为“Category”）。\n\
    2. 在 `books.html` 的“创建书籍”和“更新书籍”用例的表单中添加“Category”选择字段以及所有分段属性的输入字段。分段属性的表单字段仅在选择了相应的书籍类别时才显示。\n\
    \n#### 13.2.4.2 在*检索/列出所有*中添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加一个“Special\
    \ type”列：\n\n```\n <table id=\"books\">\n  <thead><tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th>\n\
    </tr></head>\n  <tbody><tbody><tbody></tbody></tbody>\n</table>\n```\n\n对于没有特殊类别的书籍，在该列中将为空单元格，而对于所有其他书籍，其类别将在该列显示，以及与其他类别特定的信息。这需要在\
    \ `view/books.js` 文件的 `pl.v.books.retrieveAndListAll.setupUserInterface` 中编写相应的\
    \ `switch` 语句：\n\n```\n if (book.category) {\n    switch (book.category) {\n \
    \   case BookCategoryEL.TEXTBOOK:\n         row.insertCell(-1).textContent = book.subjectArea\
    \ + \" textbook\";\n         break;\n    case BookCategoryEL.BIOGRAPHY:\n    \
    \     row.insertCell(-1).textContent = \"Biography about \"+ book.about;\n   \
    \      break;\n    }\n}\n```\n\n##### 13.2.4.3 在*创建和更新*中添加*类别*选择字段\n\n在两个用例中，我们都需要通过选择字段允许选择特殊类别（“textbook”或“biography”），如下\
    \ HTML 所示：\n\n```\n <div class=\"field\">\n<label>Category: <select name=\"category\"\
    ></select></label>\n</div>\n<div class=\"field Textbook\"><!-- 条件字段 -->\n<label>Subject\
    \ area: <input type=\"text\" name=\"subjectArea\" /></label>\n</div>\n<div class=\"\
    field Biography\"><!-- 条件字段 -->\n<label>About: <input type=\"text\" name=\"about\"\
    \ /></label>\n</div>\n```\n\n注意，我们将“Textbook”和“Biography”作为分段字段容器类属性的额外值添加。这支持根据类别属性的值渲染和取消渲染“Textbook”和“Biography”表单字段。\n\
    \n在 `handleCategoryChangeEvent`处理器中，只有在选择了相应的书籍类别时，才会通过 `pl.v.app.displaySegmentFields`\
    \ 显示分段属性表单字段：\n\n```\n pl.v.books.handleCategoryChangeEvent = function (e) {\n\
    \    var formEl = e.currentTarget.form,\n           categoryIndexStr = formEl.category.value;\n\
    \    if (categoryIndexStr) {\n         pl.v.app.displaySegmentFields(formEl, BookCategoryEL.labels,\n\
    \                  parseInt(categoryIndexStr) + 1);\n    } else {\n       pl.v.app.undisplayAllSegmentFields(formEl,\
    \ BookCategoryEL.labels);\n    }\n};\n```\n\n记得类别选择列表包含一个返回空字符串的无选项“–––”，以及由 `BookCategoryEL.labels`\
    \ 的枚举标签组成的选项列表，其值为相应的数组索引（从 0 开始）。因此，变量 `categoryIndexStr` 的值可能是 \"\"（空字符串）或“0”、“1”、“2”等。\n\
    \n### 13.3 案例研究 2：实现类层次结构\n\n当类层次结构变得复杂时，我们不能简单地消除它，而必须在 (1) 应用程序代码、(2) 底层数据库以及\
    \ (3) 其用户界面中实现它。\n\n本案例研究的起点是上图 12.8 所示的设计模型。在接下来的章节中，我们从设计模型中推导出 *JS 类模型*和 *JS\
    \ 实体表模型*。实体表模型被用作使用浏览器 Local Storage 技术存储应用程序对象时，所需的“对象到存储”映射的 {方案。\n\n#### 13.3.1\
    \ 制作 JS 类模型\n\n"
- fmt: "\nWe design the `model classes` of our example app with the help of a `JS\
    \ class model` that we derive from the `design model` by essentially leaving the\
    \ generalization arrows as they are and just adding `get/set` methods and static\
    \ `check` functions to each class. However, in the case of our example app, it\
    \ is natural to apply the `Class Hierarchy Merge` design pattern (discussed in\
    \ Section 12.6) to the single-subclass-segmentation of `Employee` for simplifying\
    \ the class model by eliminating the `Manager` subclass. This leads to the model\
    \ shown in [Figure 13.2](#9783110500240_011618.xhtml_b_9783110500325-013_fig_002)\
    \ below. Notice that a `Person` may be an `Employee` or an `Author` or both.\n\
    \n![](graphic/converted/b_9783110500325-013_fig_002.png)\n\nFigure 13.2: The JS\
    \ class model of the Person roles class hierarchy.\n\n### 13.3.2 Make a JS Entity\
    \ Table Model\n\nSince we use the browsers’ `Local Storage` as the persistent\
    \ storage technology for our example app, we have to deal with simple key-value\
    \ storage. For each design model class with a singular (capitalized) name `Entity`,\
    \ we use its pluralized lowercase name `entities` as the corresponding table name\
    \ and as a key such that its associated string value is obtained by serializing\
    \ the object collection `Entity.instances` with the help of the `JSON.stringify`\
    \ method.\n\nWe design a set of suitable JS entity tables in the form of a `JS\
    \ entity table model` that we derive from the information design model. We have\
    \ to make certain choices how to organize our data store and how to derive a corresponding\
    \ entity table model.\n\nThe first choice to make concerns using either the `Single\
    \ Table Inheritance` (`STI`), the `Table per Class Inheritance` (`TCI`) or the\
    \ `Joined Tables Inheritance` (`JTI`) approach, which are introduced in Section\
    \ 12.7.4. In the `STI` approach, a segmentation (or an entire class hierarchy)\
    \ is represented with a single table, containing columns for all attributes of\
    \ all classes involved, as shown in the example model of [Figure 13.3](#9783110500240_011618.xhtml_b_9783110500325-013_fig_003).\n\
    \n![](graphic/converted/b_9783110500325-013_fig_003.png)\n\nFigure 13.3: An STI\
    \ model of the Person roles class hierarchy.\n\nSince the given segmentation is\
    \ non-disjoint, a multi-valued enumeration attribute categories is used for representing\
    \ the information to which subclasses an instance belongs.\n\nUsing the `STI`\
    \ approach is feasible for the given example, since the role hierarchy does not\
    \ have many levels and the segment subclasses do not add many attributes. But,\
    \ in a more realistic example, we would have a lot more attributes in the segment\
    \ subclasses of the given role hierarchy. The `STI` approach is not really an\
    \ option for representing a multi-level role hierarchy. However, we may choose\
    \ it for representing the single-segment class hierarchy `Manager-is-subclass-of-Employee`.\n\
    \nFor simplicity, and because the browsers’ `Local Storage` does not support foreign\
    \ keys as required by `JTI`, we choose the `TCI` approach, where we obtain a separate\
    \ table for each class of the `Person` segmentation, but without foreign keys.\
    \ Our choices result in the model shown in [Figure 13.4](#9783110500240_011618.xhtml_b_9783110500325-013_fig_004)\
    \ below, which has been derived from the design model shown in Figure 12.8 by:\n\
    \n1. Merging the `Manager` subclass into its superclass `Employee`, according\
    \ to the `Class Hierarchy Merge` design pattern described in Section 12.6.\n2.\
    \ Replacing the standard ID property modifier `{id}` of the `personId` attribute\
    \ of `Person`, `Author` and `Employee` with `{pkey}` for indicating that the attribute\
    \ is a `primary key`.\n3. Replacing the singular (capitalized) class names (`Person`,\
    \ `Author` and `Employee`) with pluralized lowercase table names (`people`, `authors`\
    \ and `employees`).\n4. Adding the «JS entity table» stereotype to all class rectangles\
    \ (people, authors and employees).\n5. Replacing the platform-independent datatype\
    \ names with JS datatype names.\n6. Dropping all generalization/inheritance arrows\
    \ and adding all attributes of supertables (`personId` and `name`) to their subtables\
    \ (authors and employees).\n\n![](graphic/converted/b_9783110500325-013_fig_004.png)\n\
    \nFigure 13.4: A TCI model of the Person roles class hierarchy.\n\nIn the case\
    \ of using the `JTI` approach, in addition to the steps 1–5 above, we would:\n\
    \n1. Copy the primary key column (`personId`) of the root table (`people`) to\
    \ all subtables (authors and employees).\n2. Replace the generalization arrows\
    \ with «fkey»-stereotyped dependency arrows (representing `foreign key dependencies`)\
    \ that are annotated at their source end with the name of the subtable’s primary\
    \ key (here: `personId`).\n\n### 13.3.3 New Issues\n\nCompared to the model of\
    \ our first case study, shown in [Figure 13.1](#9783110500240_011618.xhtml_b_9783110500325-013_fig_001)\
    \ above, we have to deal with a number of new issues in the *model code*:\n\n\
