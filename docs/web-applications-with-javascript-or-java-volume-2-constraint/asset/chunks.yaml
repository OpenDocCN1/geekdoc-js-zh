    ### 3. 在关联的两端都放置所有权点（ownership dots），使关联变为双向，如图 1.5 所示。这意味着该关联通过一对互逆的引用属性 `Committee::chair`
    和 `ClubMember::chairedCommittee` 以冗余的方式实现，正如第 7 章所讨论。


    ![](img/b_9783110500325-001_fig_005.png)


    图 1.5：建模委员会（Committee）与俱乐部成员（ClubMember）之间的双向关联。


    因此，每当我们对关联进行建模时，都必须做出选择：关联的哪一端代表引用属性，并因此标记为所有权点。可以是其中一个，也可以是两个都是。这一决策也意味着对关联的**可导航性**（`navigability`）的决定。当关联的一个端代表引用属性时，意味着它是可导航的（通过该属性）。


    对于不是一对一的功能性关联（functional association），最简单的设计是根据其功能定义关联的方向，将所有权点放置在多重性（multiplicity）为
    `0..1` 或 `1` 的关联端。对于非方向的一对一或多对多的关联，我们可以随心意愿选择方向，即我们可以在关联的任一端放置所有权点。


    ### 1.6 我们的示例模型


    下方的图 1.6 所示的模型（关于出版商和书籍）作为我们单向功能性关联的示例模型。注意它包含了单向多对一关联 `Book-has-Publisher`（书籍拥有出版商）。


    ![](img/b_9783110500325-001_fig_006.png)


    图 1.6：带有单向关联的出版商-书籍信息设计模型。


    我们可能还需要处理代表单向非功能性关联的非功能性（多值）引用属性。例如，下方的图 1.7 所示书籍（Book）与作者（Author）之间的单向多对多关联，建模了一个多值（非功能性）引用属性
    `authors`。


    ![](img/b_9783110500325-001_fig_007.png)


    图 1.7：带有两个单向关联的出版商-书籍-作者信息设计模型。


    ### 1.7 消除单向关联


    由于经典的面向对象（OO）编程语言不支持将关联作为公民，仅支持类和表示单向关联的引用属性，我们必须从通用信息设计模型中消除所有显式关联，以获取 OO 类模型。


    #### 1.7.1 基础消除


    我们受限关联过程的起点是一个具有各种单向关联的信息设计模型，如图 1.6 所示的模型。如果模型中仍包含任何非方向的关联，我们首先必须通过对其末端的所有权做出决策，将其转换为有方向的关联，正如第
    1.5 节所讨论的那样。


    连接源类与目标类的单向关联被替换为其源类中一个对应的引用属性，该属性具有：

    1. 与关联端相同的名称（如果有的话），否则设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）；

    2. 以目标类作为其范围（range）；

    3. 与目标端相同的多重性；

    4. 如果该单向关联是功能性的，则具有唯一性约束（uniqueness constraint）。


    这种替换过程在图 1.8 所示的单向一对一关联案例说明，其中引用属性 `chairedCommittee` 的唯一性约束通过 `{key}` 修饰符表示。


    ![](img/b_9783110500325-001_fig_008.png)


    图 1.8：将功能性关联端转换为引用属性。


    对于单向一对多的关联情况，下方的图 1.9


    图 1.9：将非功能性关联端转换为多值引用属性。


    #### 1.7.2 从模型中消除关联


    在我们的 `Publisher-Book` 示例案例中，我们必须从设计模型中消除关联。在第一步，我们将图 1.6 中的多对一关联 `Book-has-Publisher`
    替换为 `Book` 类中的功能性属性，从而得到图 1.10 所示的 OO 类模型。由于 `Book-has-Publisher` 关联的目标端多重性为 `0..1`，我们通过将该多重性定义为
    `0..1` 来声明该属性 `publisher` 是可选的。


