- fmt: "\n# Dedication\nTo Our Families.\n\n# Foreword\nThis two-volume book shows\
    \ how to design and implement web applications with a model-based approach, using\
    \ the most relevant platforms for web development: JavaScript and Java. Web apps\
    \ are designed with the help of information models in the form of UML diagrams\
    \ and implemented as:\n\nThe focus of the book are general concepts and techniques\
    \ concerning information management of:\n1. integrity constraints and validation,\n\
    2. enumerations and attributes\n3. unidirectional and bidirectional associations\
    \ between object types,\n4. subtyping and inheritance in class hierarchies.\n\n\
    We assume that the reader is already familiar with HTML and at least one object-oriented\
    \ programming language, such as C++, Java, Python or C#. In addition, we assume\
    \ that the reader has some familiarity with CSS, and is interested to learn more.\
    \ The book can be used\n1. in web development courses for students of Computer\
    \ Science or related disciplines;\n2. by JavaScript developers for learning Java;\n\
    3. by Java developers for learning JavaScript;\n4. by JavaScript and Java (and\
    \ PHP/Python/C#) developers for learning\n    * object-oriented (OO) programming\
    \ with JavaScript or Java,\n    * how to implement basic information management\
    \ concepts and build complete web apps with plain JavaScript or Java.\n\nThe first\
    \ two issues of this list are discussed in Volume 1, while the last two are discussed\
    \ in Volume 2. The book comes with the complete source code of six example apps\
    \ that you can run or download from our web server.\n\n# Part I: Associations\n\
    The three example apps that we have discussed in Volume 1 (`minimal app`, `validation\
    \ app`, and `enumeration app`), have been limited to managing the data of one\
    \ object type only. A real app, however, has to manage the data of several object\
    \ types, which are typically related to each other in various ways. In particular,\
    \ there may be `associations` and `subtype` (inheritance) relationships between\
    \ object types. Handling associations and subtype relationships are advanced issues\
    \ in software application engineering. They are often not sufficiently discussed\
    \ in textbooks and not well supported by application development frameworks.\n\
    \nAssociations are important elements of information models. Software applications\
    \ have to implement them in a proper way, especially in their `model` layer within\
    \ a `model-view-controller` (`MVC`) architecture. Unfortunately, application development\
    \ frameworks do often not provide much for dealing with associations.\n\nThere\
    \ are two important distinctions, which are independent of each other:\n1. `Functional`\
    \ versus `non-functional` (“many-to-many”) associations.\n2. `Unidirectional`\
    \ versus `bidirectional` associations.\n\nA functional association corresponds\
    \ to what is called a `function` in mathematics, while a many-to-many association\
    \ corresponds to what is called a `relation` in mathematics. A unidirectional\
    \ association corresponds to a reference property in OO modeling and programming,\
    \ while a bidirectional association corresponds to a pair of mutually inverse\
    \ reference properties.\n\n## 1 Reference Properties and Unidirectional Associations\n\
    A property defined for an object type, or class, is called a `reference property`\
    \ if its values are `references` that reference an object of another, or of the\
    \ same, type. For instance, the class `Committee` shown in [Figure 1.1](#9783110500240_001634.xhtml_b_9783110500325-001_fig_001)\
    \ below has a reference property `chair`, the values of which are references to\
    \ objects of type `ClubMember`.\n\nAn `association` between object types classifies\
    \ relationships between objects of those types. For instance, the association\
    \ `Committee`-has`ClubMember`-as-chair, which is visualized as a connection line\
    \ in the class diagram shown in [Figure 1.2](#9783110500240_001634.xhtml_b_9783110500325-001_fig_002)\
    \ below, classifies the relationships `FinanceCommittee`-has`PeterMiller`-as-chair,\
    \ `RecruitmentCommittee`-has`SusanSmith`-as-chair` and `AdvisoryCommittee`-has`SarahAnderson`-as-chair,\
    \ where the objects `PeterMiller`, `SusanSmith` and `SarahAnderson` are of type\
    \ `ClubMember`, and the objects `FinanceCommittee`, `RecruitmentCommittee` and\
    \ `AdvisoryCommittee` are of type `Committee`.\n\nAn association as a set of relationships\
    \ can be represented as a table like so:\n\nReference properties correspond to\
    \ a special form of associations, namely to `unidirectional` `binary associations`.\
    \ While a binary association does, in general, not need to be directional, a reference\
    \ property represents a binary association that is directed from the property’s\
    \ domain class (where it is defined) to its range class.\n\nIn general, associations\
    \ are `relationship types` with two or more `object types` participating in them.\
    \ An association between two object types is called `binary`. In this book we\
    \ only discuss binary associations. For simplicity, we just say ‘association’\
    \ when we actually mean ‘binary association’.\n\n```\n| *Committee*-has-*ClubMember*-as-chair\
    \ |\n| --- |\n| Finance Committee | Peter Miller |\n| Recruitment Committee |\
    \ Susan Smith |\n| Advisory Committee | Sarah Anderson |\n```\n"
