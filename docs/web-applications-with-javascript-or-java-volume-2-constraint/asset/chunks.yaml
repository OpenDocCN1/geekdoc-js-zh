    DBMS（数据库管理系统）支持枚举，也可以是枚举值。我们使用 `category` 作为鉴别列的名称，在我们的 `Book` 类层次结构示例中，它有一个冻结值约束（frozen
    value constraint），因为教科书与传记（textbook-biography）的划分是固定的。


