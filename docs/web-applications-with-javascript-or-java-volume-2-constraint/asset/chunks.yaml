    \ in the form of UML class models can be converted to OWL vocabularies and then\
    \ checked for consistency. |\n\n| **P** |\n\n| *Portable Network Graphics* | PNG\
    \ is an open (non-proprietary) graphics file format that supports lossless data\
    \ compression. |\n\n| Polyfill | A polyfill is a piece of JavaScript code for\
    \ emulating a standard JavaScript method in a browser, which does not support\
    \ the method. |\n\n| **R** |\n\n| Resource Description Framework | RDF is a W3C\
    \ language for representing machine-readable propositional information on the\
    \ Web. |\n\n| **S** |\n\n| Standard Generalized Markup Language | SGML is an ISO\
    \ specification for defining markup languages. HTML4 has been defined with SGML.\
    \ XML is a simplified successor of SGML. HTML5 is no longer SGML-based and has\
    \ its own parsing rules. |\n\n| Scalable Vector Graphics | SVG is a 2D vector\
    \ image format based on XML. SVG can be styled with CSS and made interactive using\
    \ JavaScript. HTML5 allows direct embedding of SVG content in an HTML document.\
    \ |\n\n| Slot | A slot is a name-value pair. In an object of an object-oriented\
    \ program (for instance, in a Java object), a slot normally is a property-value\
    \ pair. But in a JavaScript object, a slot may also consist of a method name and\
    \ a method body or it may be a key-value pair of a map. |\n\n| **U** |\n\n| Unicode\
    \ | A platform-independent character set that includes almost all characters from\
    \ most of the world’s script languages including Hindi, Burmese and Gaelic. Each\
    \ character is assigned a unique integer code in the range between 0 and 1,114,111\\\
    . For example, the Greek letter π has the code 960\\. Unicode includes legacy\
    \ character sets like ASCII and ISO-8859-1 (Latin-1) as subsets. |\n\n|  | XML\
    \ is based on Unicode. Consequently, the Greek letter π (with code 960) can be\
    \ inserted in an XML document as &#960; using the XML entity syntax. The default\
    \ encoding of Unicode characters in an XML document is UTF-8, which uses only\
    \ a single byte for ASCII characters, but three bytes for less common characters.\
    \ |\n\n| Uniform Resource Identifier | A URI is either a *Uniform Resource Locator\
    \ (URL)* or a *Uniform Resource Name (URN)*. |\n\n| Uniform Resource Locator |\
    \ A URL is a resource name that contains a web address for locating the resource\
    \ on the Web. |\n\n| *Unified Modeling Language* | The UML is an industry standard\
    \ that defines a set of modeling languages for making various kinds of models\
    \ and diagrams in support of object-oriented problem analysis and software design.\
    \ Its core languages are *Class Diagrams* for information/data modeling, and *Sequence\
    \ Diagrams*, *Activity Diagrams* and *State Diagrams* (or *State Charts*) for\
    \ process/behavior modeling. |\n\n| *Uniform Resource Name* | A URN refers to\
    \ a resource without specifying its location. |\n\n| User Agent | A user agent\
    \ is a front-end web client program such as a web browser. |\n\n| **W** |\n\n\
    | WebM | WebM is an open (royalty-free) web video format supported by Google Chrome\
    \ and Mozilla Firefox, but not by Microsoft Internet Explorer and Apple Safari.\
    \ |\n\n| Web Hypertext Application Technology Working Group | The *WHATWG* was\
    \ established in 2004 by former employees of Apple, Mozilla, and Opera who have\
    \ been unhappy with the slow progress of web technology standardization due to\
    \ W3C’s choice to focus on the standardization of XHTML2\\. Led by Ian Hickson,\
    \ they developed HTML5 and related JavaScript APIs in competition and collaboration\
    \ with the W3C. |\n\n| World Wide Web | The WWW (or, simply, “the Web”) is a huge\
    \ client-server network based on HTTP, HTML and XML, where web browsers (and other\
    \ ‘user agents’), acting as HTTP clients, access web server programs, acting as\
    \ HTTP servers. |\n\n| World Wide Web Consortium | The *W3C* is an international\
    \ organization in charge of developing and maintaining web standards. |\n\n| **X**\
    \ |\n\n| XML HTTP Request | The XML HTTP Request (XHR) API allows a JavaScript\
    \ program to exchange HTTP messages with back-end programs. It can be used for\
    \ retrieveing/submitting information from/to a back-end program without submitting\
    \ HTML forms. XHR-based approaches have been subsumed under the acronym “AJAX”\
    \ in the past. |\n\n# Index\n\n*   *   abstract class\n\n    *   aggregation\n\
