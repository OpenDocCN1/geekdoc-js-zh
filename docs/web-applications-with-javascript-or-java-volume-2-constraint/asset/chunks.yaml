    \ inverse reference properties***. Having such a pair in a model implies ***redundancy***\
    \ because each of the two involved reference properties can be derived from the\
    \ other by inversion. This type of redundancy implies *data storage overhead*\
    \ and *update overhead*, which is the price to pay for the bidirectional navigability\
    \ that supports efficient object access in both directions.\n\nFor maintaining\
    \ the duplicate information of a mutually inverse reference property pair, it\
    \ is common to treat one of the two involved properties as the *master*, and the\
    \ other one as the *slave*, and take this distinction into consideration in the\
    \ code of the change methods (such as the property setters) of the affected model\
    \ classes. We indicate the slave of an inverse reference property pair in a model\
    \ diagram by declaring the slave property to be a ***derived*** property using\
    \ the UML notation of a slash (/) as a prefix of the property name as shown in\
    \ the following diagram:\n\n![](graphic/converted/b_9783110500325-007_ingr_003.png)\n\
    \nThe property chairedCommittee in ClubMember is now *derived* (as indicated by\
    \ its slash prefix). Its annotation {inverse of chair} defines a *derivation rule*\
    \ according to which it is derived by inverting the property Committee::chair.\n\
    \nIn a UML class diagram, the derivation of a property can be specified by an\
    \ OCL *derive* expression that evaluates to the value of the derived property\
    \ for a given object. In the case of a property being the inverse of another property,\
    \ specified by the constraint expression {inverse of *anotherProperty*} appended\
    \ to the property declaration, the derivation expression is implied. In our example,\
    \ for any club member object m, it evaluates to the committee object c such that\
    \ c.chair = m. In OCL, this derivation rule would be expressed like so\n\n```\n\
    \ context ClubMember::chairedCommittee: Committee\nderive:  \n  if Committee.allInstances().exists(\
    \ c | c.chair = self) then c\n```\n\nThere are two ways how to realize the derivation\
    \ of a property: it may be *derived on read* via a read-time computation of its\
    \ value, or it may be *derived on update* via an update-time computation performed\
    \ whenever one of the variables in the derivation expression (typically, another\
    \ property) changes its value. The latter case corresponds to a *materialized\
    \ view* in a database. While a reference property that is derived on read may\
    \ not guarantee efficient navigation, because the on-read computation may create\
    \ unacceptable latencies, a reference property that is derived on update does\
    \ provide efficient navigation.\n\nWhen we designate an inverse reference property\
    \ as derived by prefixing its name with a slash (/), we indicate that it is derived\
    \ on update. For instance, the property /chairedCommittee in the example above\
    \ is derived on update from the property chair.\n\nIn the case of a derived reference\
    \ property, we have to deal with ***life-cycle dependencies*** between the affected\
    \ model classes requiring special change management mechanisms based on the functionality\
    \ type of the represented association (either *one-to-one*, *many-to-one* or *many-to-many*).\n\
    \nIn our example of the derived inverse reference property ClubMember::chairedCommittee,\
    \ which is single-valued and optional, this means that\n\n1.  whenever a new committee\
    \ object is created (with a mandatory chair assignment), the corresponding ClubMember::chairedCommittee\
    \ property has to be assigned accordingly;\n\n2.  whenever the chair property\
    \ is updated (that is, a new chair is assigned to a committee), the corresponding\
    \ ClubMember::chairedCommittee property has to be unset for the club member who\
    \ was the previous chair and set for the one being the new chair;\n\n3.  whenever\
    \ a committee object is destroyed, the corresponding ClubMember::chairedCommittee\
    \ property has to be unset.\n\nIn the case of a derived inverse reference property\
    \ that is multi-valued while its inverse base property is single-valued (like\
    \ Publisher::publishedBooks in [Figure 7.4](#9783110500240_000634.xhtml_b_9783110500325-007_fig_004)\
    \ below being derived from Book::publisher), the life cycle dependencies imply\
    \ that\n\n1.  whenever a new ‘base object’ (such as a book) is created, the corresponding\
    \ inverse property has to be updated by adding a reference to the new base object\
    \ to its value set (like adding a reference to the new book object to Publisher::publishedBooks);\n\
    \n2.  whenever the base property is updated (e.g., a new publisher is assigned\
    \ to a book), the corresponding inverse property (in our example, Publisher::publishedBooks)\
    \ has to be updated as well by removing the old object reference from its value\
    \ set and adding the new one;\n\n3.  whenever a base object (such as a book) is\
    \ destroyed, the corresponding inverse property has to be updated by removing\
    \ the reference to the base object from its value set (like removing a reference\
    \ to the book object to be destroyed from Publisher::publishedBooks).\n\nNotice\
    \ that from a purely computational point of view, we are free to choose either\
    \ of the two mutually inverse reference properties (like Book::authors and Author::authoredBooks)\
    \ to be the master. However, in many cases, associations represent asymmetrical\
    \ ontological existence dependencies that dictate which of the two mutually inverse\
    \ reference properties is the master. For instance, the authorship association\
    \ between the classes Book and Author represents an ontological existence dependency\
    \ of books on their authors. A book existentially depends on its author(s), while\
    \ an author does not existentially depend on any of her books. Consequently, the\
    \ corresponding object lifecycle dependency between Book and Author implies that\
    \ their bidirectional association is maintained by maintaining Author references\
    \ in Book::authors as the natural choice of master property, while Author::authoredBooks\
    \ is the slave property, which is derived from Book::authors.\n\n### 7.2 Making\
    \ an OO Class Model\n\nSince classical OO programming languages do not support\
    \ explicit associations as first class citizens, but only classes with reference\
    \ properties representing implicit associations, we have to eliminate all explicit\
    \ associations for obtaining an OO class model.\n\n#### 7.2.1 The Basic Procedure\n\
    \nThe starting point of our ***association elimination*** procedure is an information\
    \ design model with various kinds of unidirectional and bidirectional associations,\
    \ such as the model shown in [Figure 7.1](#9783110500240_000634.xhtml_b_9783110500325-007_fig_001)\
    \ above. If the model still contains any non-directed associations, we first have\
    \ to turn them into directed ones by making a decision on the ownership of their\
    \ ends, which is typically based on navigability requirements.\n\nNotice that\
    \ both associations in the *Publisher-Book-Author* information design model, *publisher-publishedBooks*\
    \ and *authoredBooks-authors* (or *Authorship*), are bidirectional as indicated\
    \ by the ownership dots at both association ends. For eliminating all explicit\
    \ associations from an information design model, we have to perform the following\
    \ steps:\n\n1.  ***Eliminate unidirectional associations***, connecting a source\
    \ with a target class, by replacing them with a reference property in the source\
    \ class such that the target class is its range."
