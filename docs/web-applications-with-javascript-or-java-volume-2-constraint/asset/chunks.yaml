    \n### 3.5.3 在 Update 用例中选择关联对象\n\n遗憾的是，在具有数百或数千个作者的实际用例中，多选控件并真的不再适用于显示和维护关联作者集合，因为它渲染选择结果在视觉上太散分散了。因此，我们必须使用一种特殊的\
    \ `multiple-choice widget`（多选小部件），它允许向关联对象列表添加（并从列表中移除）对象，正如第 `1.8\\.` 节所示。为了展示如何用此小部件替换上一节中讨论的多重选择列表，我们现在将在\
    \ `Update` 用例中使用它。\n\n为了在 `Update` 用例中允许维护与当前编辑书籍关联的作者集合，需要将如下方 HTML 代码所示的 `multiple-choice\
    \ widget`（多选小部件）用 `Author` 类的实例进行填充。\n\n```\n <section id=\"Book-U\" class=\"\
    UI-Page\">\n  <h1>Public Library: Update a book record</h1>\n  <form>\n    …\n\
    \    <div class=\"select-one\">\n      <label>Publisher: <select name=\"selectPublisher\"\
    ></select></label>\n    </div\n    <div class=\"widget\">\n          <label for=\"\
    updBookSelectAuthors\">Authors: </label>\n          <div class=\"MultiSelectionWidget\"\
    \ id=\"updBookSelectAuthors\"></div\n      </div\n     …\n    </form>\n</section>\n\
    ```\n\n`Update` 用户界面的设置（在下方所示的 `setupUserInterface` 程序中）是通过通过实用方法 `fillSelectWithOptions`\
    \ 填充用于选择要更新书籍的选择列表完成的。分配出版者的选择列表和用于分配书籍作者的多选小部件只有在选择了要更新的书籍后才会（在 `handleSubmitButtonClickEvent`\
    \ 中）进行填充。\n\n```\n pl.v.books.update = {\n  setupUserInterface: function () {\n\
    \    const formEl = document.querySelector(\"section#Book-U > form\"),\n     \
    \   selectBookEl = formEl.selectBook,\n        saveButton = formEl.commit;\n //\
    \ 设置书籍选择列表\n    util.fillSelectWithOptions( selectBookEl, Book.instances,\n  \
    \      \"isbn\", {displayProp:\"title\"});\n    selectBookEl.addEventListener(\"\
    change\", this.handleBookSelectChangeEvent);\n // 添加事件监听器以实现响应验证\n …\n // 为提交按钮点击事件定义事件处理器\n\
    \    saveButton.addEventListener(\"click\", this.handleSaveButtonClickEvent);\n\
    \ // 处理中消提交事件并重置表单\n    formEl.addEventListener ( 'submit', function (e) {\n \
    \     var authorsSelWidget = document.querySelector (\n              \"section#Book-U\
    \ > form .MultiSelectionWidget\");\n      e.preventDefault();\n      authorsSelWidget.innerHTML\
    \ = \"\";\n      formEl.reset();\n    });\n    document.getElementById (\"Book-M\"\
    ).style.display = \"none\";\n    document.getElementById (\"Book-U\").style.display\
    \ = \"block\";\n    formEl.reset();\n  },\n```\n\n当选择了要更新的书籍时，表单输入字段 `isbn`、`title`\
    \ 和 `year` 以及更新出版者的选择控件将被来自所选书籍的相应值，并设置关联作者选择控件：\n\n```\n handleBookSelectChangeEvent:\
    \ function () {\n  const formEl = document.querySelector(\"section#Book-U > form\"\
    ),\n      saveButton = formEl.commit,\n      selectAuthorsWidget = formEl.querySelector(\"\
    .MultiChoiceWidget\"),\n      selectPublisherEl = formEl.selectPublisher,\n  \
    \    isbn = formEl.selectBook.value;\n  if (isbn !== \"\") {\n    let book = Book.instances[isbn];\n\
    \    formEl.isbn.value = book.isbn;\n    formEl.title.value = book.title;\n  \
    \  formEl.year.value = book.year;\n     // 设置关联作者选择控件\n    util.createMultipleChoiceWidget(\
    \ selectAuthorsWidget, book.authors,\n        Author.instances, \"authorId\",\
    \ \"name\", 1); // minCard=1\n     // 设置关联的出版者选择列表\n    util.fillSelectWithOptions(\
    \ selectPublisherEl, Publisher.instances, \"name\");\n    // 将关联的出版者分配给选择框\n \
    \   if (book.publisher) formEl.selectPublisher.value = book.publisher;\n    saveButton.disabled\
    \ = false;\n  } else {\n    formEl.reset();\n    selectPublisherEl.selectedIndex\
    \ = 0;\n    selectAuthorsWidget.innerHTML = \"\";\n    saveButton.disabled = true;\n\
    \  }\n},\n```\n\n当用户在更新某些值后点击保存按钮时，所有表单控件值（包括分配出版者的单选控件）将被复制到 `slots` 中，作为调用 `update`\
    \ 方法的参数。在调用 `update` 之前，根据关联作者选择控件中的 `classList` 值创建要添加的作者 ID 引用列表和另一个要移除的作者 ID\
    \ 引用列表（在 `authorIdRefsToAdd` 和 `authorIdRefsToRemove` 槽中），如下程序列表所示：\n\n```\n handleSaveButtonClickEvent:\
    \ function () {\n  const formEl = document.querySelector(\"section#Book-U > form\"\
    ),\n      saveButton = formEl.commit,\n      selectAuthorsWidget = formEl.querySelector(\"\
    .MultiChoiceWidget\"),\n      multiChoiceListEl = selectAuthorsWidget.firstElementChild;\n\
    \  const slots = { isbn: formEl.isbn.value,\n        title: formEl.title.value,\n\
    \        year: formEl.year.value,\n        publisher_id: formEl.selectPublisher.value\n\
    \      };\n // 添加事件监听器以实现响应验证\n …\n // 只有当所有字段值有效时提交更新\n  if (formEl.checkValidity())\
    \ {\n    // 从关联列表构建 authorIdRefsToAdd/ToRemove 列表\n    let authorIdRefsToAdd=[],\
    \ authorIdRefsToRemove=[];\n    for (let mcListItemEl of multiChoiceListEl.children)\
    \ {\n      if (mcListItemEl.classList.contains(\"removed\")) {\n        authorIdRefsToRemove.push(\
    \ mcListItemEl.getAttribute(\"data-value\"));\n      }\n      if (mcListItemEl.classList.contains(\"\
    added\")) {\n        authorIdRefsToAdd.push( mcListItemEl.getAttribute(\"data-value\"\
    ));\n      }\n    }\n    // 如果添加/移除列表不为空则创建相应的槽\n    if (authorIdRefsToRemove.length\
    \ > 0) {\n      slots.authorIdRefsToRemove = authorIdRefsToRemove;\n    }\n  \
    \  if (authorIdRefsToAdd.length > 0) {\n      slots.authorIdRefsToAdd = authorIdRefsToAdd;\n\
    \    }\n    Book.update( slots);\n    // 更新书籍选择列表的元素\n    selectBookEl.options[selectBookEl.selectedIndex].text\
    \ = slots.title;\n  }\n}\n```\n```\n\n### 3.6 如何运行应用程序并获取代码\n\n你可以从我们的服务器运行示例应用程序，并将其作为\
    \ ZIP 压缩包下载。\n\n### 3.7 注意事项\n\n"
- fmt: "\nWe have still included the repetitive code structures (called `boilerplate\
    \ code`) in the model layer per class and per property for constraint validation\
    \ (checks and setters) and per class for the data storage management methods add,\
    \ update, and destroy. While it is good to write this code a few times for learning\
    \ app development, you don’t want to write it again and again when you work on\
    \ real projects. For avoiding repetitive boilerplate code, generic forms of these\
    \ methods are needed, such that they can be reused in all model classes of an\
    \ app. For instance, the `cLASSjs` library provides such an approach.\n\n## 4\
    \ Implementing Unidirectional Functional Associations with Java EE\n\nA unidirectional\
    \ `functional` association is either one-to-one or many-to-one. In both cases\
    \ such an association is represented, or implemented, with the help of a `single-valued`\
    \ reference property.\n\nIn this chapter, we show:\n\n1. how to derive a `data\
    \ model` in the form of a `Java Entity class model` from an OO class model with\
    \ single-valued reference properties representing `unidirectional functional associations`,\n\
    2. how to code the Java Entity class model in the form of entity classes (implementing\
    \ `model classes`),\n3. how to write the view and controller code based on the\
    \ entity classes.\n\n### 4.1 Implementing Single-Valued Reference Properties in\
    \ Java\n\nA single-valued reference property, such as the property `publisher`\
    \ of the object type `Book`, allows storing internal references to objects of\
    \ another type, such as `Publisher`. When creating a new object, the constructor\
    \ function needs to have a parameter for allowing to assign a suitable value to\
    \ the reference property. In a typed programming language, such as `Java`, we\
    \ may have to take a decision if this value is expected to be an internal object\
    \ reference or an ID reference. Using the JPA object-to-storage mapping technology,\
    \ we can work with object references and leave the mapping to corresponding ID\
    \ references to JPA. The `Book` class is extended as follows:\n\n```\n@Entity\
    \ @Table( name=\"books\")\n@ViewScoped @ManagedBean( name=\"book\")\npublic class\
    \ Book {\n       …\n       private Publisher publisher;\n\n      public Book()\
    \ {}\n      public Book( String isbn, String title, Integer year,\n          \
    \  Publisher publisher) {…}\n      public Publisher getPublisher() {…}\n\n   \
    \   public void setPublisher( Publisher publisher) {…}\n …\n}\n```\n\n### 4.2\
    \ Make a Java Entity Class Model\n\nThe starting point for making a Java Entity\
    \ class model is an OO class model like the one shown in Figure 1.10.\n\nAs explained\
    \ before, we obtain the Java Entity class `Publisher` from the corresponding OO\
    \ design class by (1) making all properties private, (2) using Java datatype classes\
    \ (`String`, `Integer`, etc.), (3) adding the stereotype «get/set» to properties\
    \ (specifying public getters and setters), (4) adding a `toString` function, (5)\
    \ adding the (class-level) data storage methods `create`, `retrieve`, `update`\
    \ and `delete`:\n\n![](graphic/converted/b_9783110500325-004_ingr_001.png)\n\n\
    In a Java Entity class model, for any association end dot in the OO class model,\
    \ we show the reference property representing the association end and annotate\
    \ it with the functionality type of the unidirectional association represented\
    \ by it. In our example, we add a reference property `publisher` in the entity\
    \ class `Book` and annotate it with the association’s functionality type `manyToOne`:\n\
    \n![](graphic/converted/b_9783110500325-004_ingr_002.png)\n\n### 4.3 New Issues\n\
    \nCompared to the single-class apps discussed in previous, we have to deal with\
    \ a number of new technical issues:\n\n1. In the `model` code we now have to take\
    \ care of `reference properties` that require:\n    1. defining `referential integrity\
    \ constraints` with the help of suitable JPA annotations;\n    2. extending the\
    \ code of the `create`, `update` and `delete` methods by taking the reference\
    \ properties into consideration;\n    3. a method for converting between (internal)\
    \ object references and corresponding (external) ID references in serialization\
    \ and de-serialization operations.\n2. In the `user interface` (view) code we\
    \ now have to take care of:\n    1. showing information about associated objects\
    \ in the `retrieve/list all` use case;\n    2. allowing to select an associated\
    \ object from a list of all existing instances of the target class in the `create\
    \ object` and `update object` use cases.\n\n### 4.4 Write the Model Code\n\nThe\
    \ Java Entity class model can be directly coded for getting the model layer code\
    \ of our Java back-end app.\n\n#### 4.4.1 Summary\n\n1. Code each class from the\
    \ Java Entity class model as a corresponding entity class.\n2. Code an `{id}`\
    \ property modifier with the JPA annotation `@Id`.\n3. Code any property modifier\
    \ denoting the functionality type of a reference property, such as `{manyToOne}`,\
    \ with the corresponding JPA annotation, such as `@ManyToOne`.\n4. Code the integrity\
    \ constraints specified in the model with the help of Java Bean Validation annotations\
    \ (or custom validation annotations).\n5. Code the getters and setters.\n6. Code\
    \ the `create`, `retrieve`, `update` and `delete` storage management operations\
    \ as class-level methods.\n\nThese steps are discussed in more detail in the following\
    \ [sections.](#9783110500240_000634.xhtml_b_9783110500325-004_s_004_s_002)\n\n\
    #### 4.4.2 Code Each Class of the Entity Model\n\nEach class `C` of the Java Entity\
    \ class model is coded as an annotated bean class with a default constructor (with\
    \ no parameters) and a constructor with entity creation parameters.\n\nFor instance,\
    \ the `Book` class from the Entity class model is coded in the following way:\n\
    \n```\n @Entity @Table( name=\"books\")\n@ViewScoped @ManagedBean( name=\"book\"\
    )\npublic class Book {\n       @Id @NotNull( message=\"An ISBN is required!\"\
    )\n       private String isbn;\n\n       @Column( nullable=false)\n       @NotNull(\
    \ message=\"A title is required!\")\n       private String title;\n       @Column(\
    \ nullable=false)\n       @NotNull( message=\"A year is required!\")\n       private\
    \ Integer year;\n       @ManyToOne( fetch=FetchType.EAGER)\n       private Publisher\
    \ publisher;\n\n       public Book() {}\n       public Book( String isbn, String\
    \ title,\n                 Integer year, Publisher publisher) {\n          this.setIsbn(\
    \ isbn);\n          this.setTitle( title);\n          this.setYear( year);\n \
    \         this.setPublisher( publisher);\n      }\n     …  // getters, setters,\
    \ etc.\n}\n```\n\nThe `@ManyToOne` annotation on the property `publisher` is used\
    \ for specifying the functionality type of the association `Book has Publisher`\
    \ represented by the reference property `publisher` since it holds that *a book\
    \ has one publisher* and *a publisher has many books*. This annotation also allows\
    \ to specify a `fetch type` with the parameter `fetch` taking one of the following\
    \ two possible values:\n\n* `FetchType.EAGER`, implying that a retrieval of an\
    \ entity includes a retrieval of the associated entity referenced by the entity\
    \ with this property. In our example, this means that when a `Book` entity is\
    \ retrieved, the `Publisher` entity referenced by the book’s publisher property\
    \ is also retrieved. This behavior is very useful and it should be used whenever\
    \ the data to be retrieved can be handled in main memory.\n\n* `FetchType.LAZY`,\
    \ implying that referenced entities are not automatically retrieved when a referencing\
    \ entity is retrieved. In our example, this means that the referenced `Publisher`\
    \ entity is not retrieved together with a referencing `Book` entity, leaving the\
    \ value of the publisher property set to null. With this fetching behavior, a\
    \ referenced entity has to be retrieved separately by invoking the reference property’s\
    \ getter in the context of a transaction (in our example by invoking `getPublisher`).\n"
  raw: "We have still included the repetitive code structures (called ***boilerplate\
    \ code***) in the model layer per class and per property for constraint validation\
    \ (checks and setters) and per class for the data storage management methods add,\
    \ update, and destroy. While it is good to write this code a few times for learning\
    \ app development, you don’t want to write it again and again when you work on\
    \ real projects. For avoiding repetitive boilerplate code, generic forms of these\
    \ methods are needed, such that they can be reused in all model classes of an\
    \ app. For instance, the cLASSjs library provides such an approach.\n\n## 4 Implementing\
    \ Unidirectional Functional Associations with Java EE\n\nA unidirectional *functional*\
    \ association is either one-to-one or many-to-one. In both cases such an association\
    \ is represented, or implemented, with the help of a *single-valued* reference\
    \ property.\n\nIn this chapter, we show\n\n1.  how to derive a *data model* in\
    \ the form of a ***Java Entity class model*** from an OO class model with single-valued\
    \ reference properties representing *unidirectional functional associations*,\n\
    \n2.  how to code the Java Entity class model in the form of entity classes (implementing\
    \ *model classes*),\n\n3.  how to write the view and controller code based on\
    \ the entity classes.\n\n### 4.1 Implementing Single-Valued Reference Properties\
    \ in Java\n\nA single-valued reference property, such as the property publisher\
    \ of the object type Book, allows storing internal references to objects of another\
    \ type, such as Publisher. When creating a new object, the constructor function\
    \ needs to have a parameter for allowing to assign a suitable value to the reference\
    \ property. In a typed programming language, such as Java, we may have to take\
    \ a decision if this value is expected to be an internal object reference or an\
    \ ID reference. Using the JPA object-to-storage mapping technology, we can work\
    \ with object references and leave the mapping to corresponding ID references\
    \ to JPA. The Book class is extended as follows:\n\n```\n@Entity @Table( name=\"\
    books\")\n@ViewScoped @ManagedBean( name=\"book\")\npublic class Book {\n    \
    \   …\n       private Publisher publisher;\n\n      public Book() {}\n      public\
    \ Book( String isbn, String title, Integer year,\n            Publisher publisher)\
    \ {…}\n      public Publisher getPublisher() {…}\n\n      public void setPublisher(\
    \ Publisher publisher) {…}\n …\n}\n```\n\n### 4.2 Make a Java Entity Class Model\n\
    \nThe starting point for making a Java Entity class model is an OO class model\
    \ like the one shown in Figure 1.10.\n\nAs explained before, we obtain the Java\
    \ Entity class Publisher from the corresponding OO design class by (1) making\
    \ all properties private, (2) using Java datatype classes (String, Integer, etc.),\
    \ (3) adding the stereotype «get/set» to properties (specifying public getters\
    \ and setters), (4) adding a toString function, (5) adding the (class-level) data\
    \ storage methods create, retrieve, update and delete:\n\n![](graphic/converted/b_9783110500325-004_ingr_001.png)\n\
    \nIn a Java Entity class model, for any association end dot in the OO class model,\
    \ we show the reference property representing the association end and annotate\
    \ it with the functionality type of the unidirectional association represented\
    \ by it. In our example, we add a reference property publisher in the entity class\
    \ Book and annotate it with the association’s functionality type manyToOne:\n\n\
    ![](graphic/converted/b_9783110500325-004_ingr_002.png)\n\n### 4.3 New Issues\n\
    \nCompared to the single-class apps discussed in previous, we have to deal with\
    \ a number of new technical issues:\n\n1.  In the *model* code we now have to\
    \ take care of ***reference properties*** that require\n\n    1.  defining ***referential\
    \ integrity constraints*** with the help of suitable JPA annotations;\n\n    2.\
    \  extending the code of the create, update and delete methods by taking the reference\
    \ properties into consideration;\n\n    3.  a method for converting between (internal)\
    \ object references and corresponding (external) ID references in serialization\
    \ and de-serialization operations.\n\n2.  In the *user interface* (view) code\
    \ we now have to take care of\n\n    1.  showing information about associated\
    \ objects in the *retrieve/list all* use case;\n\n    2.  allowing to select an\
    \ associated object from a list of all existing instances of the target class\
    \ in the *create object* and *update object* use cases.\n\n### 4.4 Write the Model\
    \ Code\n\nThe Java Entity class model can be directly coded for getting the model\
    \ layer code of our Java back-end app.\n\n#### 4.4.1 Summary\n\n1.  Code each\
    \ class from the Java Entity class model as a corresponding entity class.\n\n\
    2.  Code an {id} property modifier with the JPA annotation @Id\n\n3.  Code any\
    \ property modifier denoting the functionality type of a reference property, such\
    \ as {manyToOne}, with the corresponding JPA annotation, such as @ManyToOne.\n\
    \n4.  Code the integrity constraints specified in the model with the help of Java\
    \ Bean Validation annotations (or custom validation annotations).\n\n5.  Code\
    \ the getters and setters.\n\n6.  Code the create, retrieve, update and delete\
    \ storage management operations as class-level methods.\n\nThese steps are discussed\
    \ in more detail in the following [sections.](#9783110500240_000634.xhtml_b_9783110500325-004_s_004_s_002)\n\
    \n#### 4.4.2 Code Each Class of the Entity Class Model\n\nEach class C of the\
    \ Java Entity class model is coded as an annotated bean class with name C having\
    \ a default constructor (with no parameters) and a constructor with entity creation\
    \ parameters.\n\nFor instance, the Book class from the Entity class model is coded\
    \ in the following way:\n\n```\n @Entity @Table( name=\"books\")\n@ViewScoped\
    \ @ManagedBean( name=\"book\")\npublic class Book {\n       @Id @NotNull( message=\"\
    An ISBN is required!\")\n       private String isbn;\n\n       @Column( nullable=false)\n\
    \       @NotNull( message=\"A title is required!\")\n       private String title;\n\
    \       @Column( nullable=false)\n       @NotNull( message=\"A year is required!\"\
    )\n       private Integer year;\n       @ManyToOne( fetch=FetchType.EAGER)\n \
    \      private Publisher publisher;\n\n       public Book() {}\n       public\
    \ Book( String isbn, String title,\n                 Integer year, Publisher publisher)\
    \ {\n          this.setIsbn( isbn);\n          this.setTitle( title);\n      \
    \    this.setYear( year);\n          this.setPublisher( publisher);\n      }\n\
    \     …  // getters, setters, etc.\n}\n```\n\nThe @ManyToOne annotation on the\
    \ property publisher is used for specifying the functionality type of the association\
    \ *Book has Publisher* represented by the reference property publisher since it\
    \ holds that *a book has one publisher* and *a publisher has many books*. This\
    \ annotation also allows to specify a *fetch type* with the parameter fetch taking\
    \ one of the following two possible values:\n\n*   FetchType.EAGER, implying that\
    \ a retrieval of an entity includes a retrieval of the associated entity referenced\
    \ by the entity with this property. In our example, this means that when a Book\
    \ entity is retrieved, the Publisher entity referenced by the book’s publisher\
    \ property is also retrieved. This behavior is very useful and it should be used\
    \ whenever the data to be retrieved can be handled in main memory.\n\n*   FetchType.LAZY,\
    \ implying that referenced entities are not automatically retrieved when a referencing\
    \ entity is retrieved. In our example, this means that the referenced Publisher\
    \ entity is not retrieved together with a referencing Book entity, leaving the\
    \ value of the publisher property set to null. With this fetching behavior, a\
    \ referenced entity has to be retrieved separately by invoking the reference property’s\
    \ getter in the context of a transaction (in our example by invoking getPublisher)."
