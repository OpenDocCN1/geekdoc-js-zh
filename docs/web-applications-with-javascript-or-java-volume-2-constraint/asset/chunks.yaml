    \n我们现在可以从此设计模型推导出`JS class model`。\n\n## 13.2.1 构建 JS 类模型\n\n我们分三步来构建 JS 类模型：\n\
    \n1.  将平台无关的数据类型（用作属性和参数的范围）替换为 JS 数据类型。这包括枚举值属性的情况，例如`category`，它被转换为数值型属性，并限制在底层枚举类型的枚举整数值范围内。\n\
