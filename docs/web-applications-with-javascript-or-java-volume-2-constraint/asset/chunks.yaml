  trans: "\n\n### 2.5.3 属性检查的编码\n\n请确保 JS 类模型中指定的所有属性约束都已正确编码在它的检查函数（check function）中，如第一卷第\
    \ 8 章所述。回想，约束违反（或验证错误）类定义在 `lib/errorTypes.js` 文件中。\n\n例如，对于 `Publisher.checkName`\
    \ 函数，我们得到了以下代码：\n\n```js\n class Publisher {\n     …\n     static checkName(n)\
    \ {\n         if (n === undefined) {\n             return new NoConstraintViolation();\
    \ // not mandatory\n         } else {\n             if (typeof n !== \"string\"\
    \ || n.trim() === \"\") {\n                  return new RangeConstraintViolation\
    \ (\n            \"The name must be a non-empty string!\" );\n            } else\
    \ {\n                 return new NoConstraintViolation();\n           }\n    \
    \    }\n    }\n    static checkNameAsId(n) {…}\n    …\n}\n```\n\n注意，由于名称属性是 `Publisher`\
    \ 的标准 ID 属性，我们只在 `checkName` 中检查语法约束，并在 `checkNameAsId` 中检查强制值约束和唯一性约束，后者调用了 `checkName`：\n\
    \n```js\n static checkNameAsId ( n) {\n     var validationResult = Publisher.checkName(n);\n\
    \     if ((validationResult instanceof NoConstraintViolation)) {\n         if\
    \ (n === undefined) {\n             return new MandatoryValueConstraintViolation\
    \ (\n                 \"A publisher name is required!\");\n          } else if\
    \ (Publisher.instances[n]) {\n             validationResult = new UniquenessConstraintViolation\
    \ (\n                 \"There is already a publisher record with this name!\"\
    );\n          } else {\n             validationResult = new NoConstraintViolation();\n\
    \          }\n      }\n}\n```\n\n如果我们必须处理其他类中的 ID 引用（外键），我们需要提供另一个名为 `checkNameAsIdRef`\
    \ 的检查函数，用于检查引用完整性约束：\n\n```js\n static checkNameAsIdRef(n) {\n    var validationResult\
    \ = Publisher.checkName(n);\n    if ((validationResult instanceof NoConstraintViolation)\
    \ &&\n             n !== undefined) {\n        if (!Publisher.instances [n]) {\n\
    \             validationResult = new ReferentialIntegrityConstraintViolation (\n\
    \                \"There is no publisher record with this name!\");\n        \
    \ }\n     }\n     return validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]`\
    \ 检查是否存在具有给定名称 `n` 的发布者对象，然后创建一个作为异常类 `ReferentialIntegrityConstraintViolation`\
    \ 实例的 `validationResult` 对象。`Book.checkNameAsIdRef` 函数由 `Book.checkPublisher`\
    \ 函数调用：\n\n```js\n class Book {\n     …\n     static checkPublisher( publisher_id)\
    \ {\n          var validationResult = null;\n          if (publisher_id === undefined\
    \ || publisher_id === \"\") {\n               validationResult = new NoConstraintViolation();\
    \ // optional\n          } else {\n               // 调用外键约束检查\n              \
    \ validationResult = Publisher.checkNameAsIdRef( publisher_id);\n         }\n\
    \         return validationResult;\n     }\n     …\n}\n```\n\n### 2.5.4 属性 Setter（设置器）的编码\n\
    \n在 setter（setters）中，会调用相应的检查函数，只有当检查没有检测到任何约束违反时，才会设置属性。对于引用属性，我们允许使用对象引用或 ID\
    \ 引用来调用 setter。产生的歧义通过测试在调用 setter 时提供的参数是否为对象来解决。例如，发布者 setter 的编码方式如下：\n\n```js\n\
    \ class Book {\n      …\n      set publisher( p) {\n          if (!p) { // 取消发布者\n\
    \               delete this._publisher;\n          } else {\n               //\
    \ p 可以是 ID 引用或对象引用\n               const publisher_id = (typeof p !== \"object\"\
    ) ? p : p.name;\n               const validationResult = Book.checkNameAsIdRef(\
    \ publisher_id);\n               if (validationResult instanceof NoConstraintViolation)\
    \ {\n                   // 设置对象引用\n                   this._publisher = Publisher.instances[publisher_id];\n\
    \               } else {\n                   throw validationResult;\n       \
    \        }\n          }\n      }\n     …\n}\n```\n\n### 2.5.5 选择并实现删除策略\n\n对于任何引用属性，在删除发布者记录时，我们需要在以下两种策略之间做出选择：\n\
    \n1. 删除所有指向该发布者的书籍（*存在依赖性* Existential Dependency）；\n2. 清空所有书籍对该发布者的引用（*存在独立性*\
    \ Existential Independence）。\n\n假设书籍在存在上依赖于发布者，我们选择第二种。这在 `Publisher.destroy`\
    \ 方法中显示，该方法会清除书籍中的引用属性：\n\n```js\nPublisher.destroy = function (name) {\n    \
    \  const publisher = Publisher.instances[name];\n      // 删除所有书籍对象中的引用\n     \
    \ for (let key of Object.keys(Book.instances)) {\n          const book = Book.instances[key];\n\
    \          if (book.publisher === publisher) {\n            delete book._publisher;\
    \ // 删除槽\n            console.log(\"Book \" + book.isbn + \" updated.\");\n  \
    \        }\n      }\n      // 删除发布者记录\n      delete Publisher.instances[name];\n\
    \      console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\n注意，删除引用是通过遍历所有书籍完成的，当书籍很多时这种效率可能不高。如果每个发布者对象持有指向所有书籍的引用列表，效率将会高得多。创建和维护这样的列表将使书籍与发布者之间的关联变为*双向*。\n\
    \n### 2.5.6 序列化与对象到存储的映射\n\n对于引用属性（如 `Book::publisher`），序列化函数 `Book::toString()`\
    \ 必须显示引用对象的可读标识符，例如 `this.publisher.name`：\n\n```js\ntoString() {\n    var bookStr\
    \ = `Book{ ISBN: ${this.isbn}, title: ${this.title},` +\n         `year: ${this.year}`;\n\
    \     if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n\
    \     return bookStr + \"}\";\n}\n```\n\n对象到存储的转换函数 `Book::toRecord()` 将带有对象引类型\
    \ JS 对象转换为对应的（无类型）ID 引用记录对象：\n\n```js\ntoRecord() {\n      var rec = {};\n   \
    \   for (let p of Object.keys( this)) {\n          // 只拷贝以下划线开头的属性槽\n        \
    \  if (p.charAt(0) === \"_\") {\n              switch (p) {\n              case\
    \ \"_publisher\":\n               // 将对象引用转换为 ID 引用\n                  if (this._publisher)\
    \ rec.publisher_id = this._publisher.name;\n                  break;\n       \
    \       default:\n                 // 移除下划线前缀\n                 rec[p.substr(1)]\
    \ = this[p];\n             }\n         }\n      };\n      return rec;\n}\n```\n\
    \n反向转换（即从带有 ID 引用的无类型记录对象转换为带有对象引用的相应类型对象）由 `Book` 构造函数完成，该构造函数在设置引用属性时允许 ID 引用和对象引用作为参数。\n\
    \n### 2.6 视图与控制器的编码\n\n"
- fmt: "\nThe user interface (UI) consists of a start page `index.html` that allows\
    \ navigating to data management UI pages, one for each object type (in our example,\
    \ `books.html` and `publishers.html`). Each of these data management UI pages\
    \ contains 5 sections: a `Manage` section, like `Manage books`, with a menu for\
    \ choosing a CRUD use case, and a section for each CRUD use case, like `Retrieve/list\
    \ all books`, `Create book`, `Update book` and `Delete book`, such that only one\
    \ of them is displayed at any time (for instance, by setting the CSS property\
    \ `display:none` for all others).\n\n### 2.6.1 Initialize the App\n\nFor initializing\
    \ a data management use case, the required data (for instance, all publisher and\
    \ book records) have to be loaded from persistent storage. This is performed in\
    \ a controller procedure such as `pl.c.books.manage.initialize` in `c/books.js`\
    \ with the following code:\n\n```\n pl.c.books.manage = {\n     initialize: function\
    \ () {\n          Publisher.retrieveAll();\n          Book.retrieveAll();\n  \
    \        pl.v.books.manage.setUpUserInterface ();\n     }\n};\n```\n\nThe `initialize`\
    \ method for managing book data first loads the publishers table and the books\
    \ table since the book data management UI needs to show their data. Then the book\
    \ data management menu is rendered by calling the `setUpUserInterface` procedure.\n\
    \n### 2.6.2 Showing Associated Objects in Retrieve/List All\n\nIn our example,\
    \ we have only one reference property, `Book::publisher`, which is functional\
    \ and optional. For showing information about the optional publisher of a book\
    \ in the `Retrieve/list all` use case, the corresponding cell in the HTML table\
    \ is filled with the name of the publisher, if there is any:\n\n```\n pl.v.books.retrieveAndListAll\
    \ = {\n      setupUserInterface: function () {\n           const tableBodyEl =\
    \ document.querySelector(\n                              \"section#Book-R>table>tbody\"\
    );\n           tableBodyEl.innerHTML = \"\"; // drop old contents\n          \
    \ for (let key of Object.keys( Book.instances)) {\n               const book =\
    \ Book.instances[key];\n               const row = tableBodyEl.insertRow(-1);\n\
    \               row.insertCell(-1).textContent = book.isbn;\n               row.insertCell(-1).textContent\
    \ = book.title;\n               row.insertCell(-1).textContent = book.year;\n\
    \               // if the book has a publisher, show its name\n              \
    \ row.insertCell(-1).textContent =\n                   book.publisher ? book.publisher.name\
    \ : \"\";\n           }\n           document.getElementById(\"Book-M\").style.display\
    \ = \"none\";\n           document.getElementById(\"Book-R\").style.display =\
    \ \"block\";\n     }\n};\n```\n\nFor a multi-valued reference property, the table\
    \ cell would have to be filled with a list of all associated objects referenced\
    \ by the property.\n\n### 2.6.3 Selecting Associated Objects in the Create and\
    \ Update Use Cases\n\nFor allowing to select objects to be associated with the\
    \ currently edited object from in the `Create` and `Update` use cases, an HTML\
    \ selection list (i.e., a `select` element) is populated with option elements\
    \ formed from the instances of the associated object type with the help of a utility\
    \ method `fillSelectWithOptions`. The HTML select element is defined in the `books.html`\
    \ view file:\n\n```\n <section id=\"Book-C\" class=\"UI-Page\">\n    <h1>Public\
    \ Library: Create a new book record</h1>\n    <form>\n       …\n       <div class=\"\
    select-one\">\n          <label>Publisher: <select name=\"selectPublisher\"></select></label>\n\
    \       </div>>\n       …\n    </form>\n</section>\n```\n\nThe `Create` user interface\
    \ is set up by the following procedure:\n\n```\n pl.v.books.create = {\n     \
    \ setupUserInterface: function () {\n          const formEl = document.querySelector\
    \ (\"section#Book-C > form\"),\n                selectPublisherEl = formEl.selectPublisher,\n\
    \                saveButton = formEl.commit;\n          // add event listeners\
    \ for responsive validation\n          formEl.isbn.addEventListener (\"input\"\
    , function () {\n            formEl.isbn.setCustomValidity(\n                \
    \   Book.checkIsbnAsId ( formEl.isbn.value).message);\n          });\n       \
    \  // set up a single selection list for selecting a publisher\n         util.fillSelectWithOptions\
    \ ( selectPublisherEl,\n                Publisher.instances, \"name\");\n    \
    \      // define event handler for submitButton click events    \n          saveButton.addEventListener\
    \ (\"click\",\n          this.handleSaveButtonClickEvent);\n          // define\
    \ event handler for neutralizing the submit event\n          formEl.addEventListener\
    \ (\"submit\", function (e) {\n               e.preventDefault ( );\n        \
    \       formEl.reset ();\n          });\n          // replace the manage form\
    \ with the create form\n          document.getElementById (\"Book-M\").style.display\
    \ = \"none\";\n          document.getElementById (\"Book-C\").style.display =\
    \ \"block\";\n          formEl.reset();\n     },\n     handleSaveButtonClickEvent:\
    \ function () {\n         …\n     }\n};\n```\n\nWhen the user clicks (or touches)\
    \ the save button, all form control values, including the value of the select\
    \ control, are copied to a slots list, which is used as the argument for invoking\
    \ the `add` method after all form fields have been checked for validity, as shown\
    \ in the following program listing:\n\n```\n handleSaveButtonClickEvent: function\
    \ () {\n       const formEl = document.querySelector(\"section#Book-C > form\"\
    );\n       const slots = {\n             isbn: formEl.value,\n             title:\
    \ formEl.value,\n             year: formEl.value,\n             publisher_id:\
    \ selectPublisher.value\n       };\n       // validate all controls and show error\
    \ messages\n       formEl.isbn.setCustomValidity(\n       Book.checkIsbnAsId (\
    \ slots.isbn).message);\n       /* … (do the same with title and year) */\n  \
    \     // save the input data only if form fields are valid\n        if (formEl.checkValidity())\
    \ {\n             Book.add ( slots);\n        }\n}\n```\n\nThe `setupUserInterface`\
    \ code for the `update book` use case is similar.\n\n### 2.7 Quiz Questions\n\n\
    #### 2.7.1 Question 1: JS Class Model\n\nWhich is the correct JS model for the\
    \ Committee class derived from the given OO model?\n\nSelect one:\n\n1. [Image\
    \ Placeholder]\n2. [Image Placeholder]\n3. [Image Placeholder]\n\n## 3 Implementing\
    \ Unidirectional Non-Functional with Plain JS\n\nA unidirectional non-functional\
    \ association is either *one-to-many* or *many-to-many*. In both cases such an\
    \ association is represented, or implemented, with the help of a *multi-valued*\
    \ reference property.\n\nIn this chapter, we show\n\n1.  how to derive a JS class\
    \ model from an OO class model with *multi-valued reference properties* representing\
    \ *unidirectional non-functional associations*,\n\n2.  how to code the JS class\
    \ model in the form of JavaScript model classes,\n\n3.  how to write the view\
    \ and controller code based on the model code.\n\n### 3.1 Implementing Multi-Valued\
    \ Reference Properties\n\nA multi-valued reference property, such as the property\
    \ `Book::authors`, allows storing a collection of references to objects of some\
    \ type, such as `Author` objects. When creating a new object of type `Book`, the\
    \ constructor function needs to have a parameter for providing a suitable value\
    \ for this property. We can allow this value to be either a collection of internal\
    \ object references or of ID references, as shown in the following example:\n\n\
    ```\n class Book {\n    constructor ({isbn, title, year, authors, authorIdRefs,\n\
    \              publisher, publisher_id}) {\n            this.isbn = isbn;\n  \
    \          this.title = title;\n            this.year = year;\n            //\
    \ assign object reference or ID reference\n            this.authors = authors\
    \ || authorIdRefs;\n            if (publisher || publisher_id) this.publisher\
    \ = publisher || publisher_id;\n     }\n    …\n}\n```\n"
