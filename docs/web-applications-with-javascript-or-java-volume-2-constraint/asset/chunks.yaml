    ## IndexedDB

    一种由浏览器管理的索引数据存储的 JavaScript API。索引允许高性能的搜索。与许多 SQL `DBMS` 类似，`IndexedDB` 支持数据库事务。


    ## I18N

    一组帮助产品适应任何目标语言和文化的最佳实践。它处理多种字符集、计量单位、键盘布局、时间和日期格式以及文本方向。


    ## J

    ### JSON

    `JSON` 的全称是 `JavaScript Object Notation`（JavaScript 对象的符号表示法），它是一种遵循 JavaScript
    对象字面量语法的数据交换格式。许多编程语言都支持将 `JSON` 作为 `XML` 的轻量级替代方案。


    ## M

    ### MathML

    一种用于表示数学表达式的开放标准，可用于数据交换或在网页内进行渲染。


    ### MIME

    `MIME` 类型（也称为“媒体类型”或“内容类型”）是一个随文件一起发送的关键字字符串，用于指示其内容类型。例如，音频文件可能被标记为 `audio/ogg`，图像可能标记为
    `image/png`。


    ### Model-View-Controller

    MVC 是一种通用架构隐喻，强调关注点分离原则，主要是在模型（model）和视图（view）之间，并将模型视为应用最基础的部分。在 MVC 框架中，“M”、“V”和“C”有不同的定义方式。通常，“模型”指的是应用的数据源，而“视图”表示应用用于用户界面的代码，这些代码基于
    `CSS` 样式的 `HTML` 表单和 `DOM` 事件，而“控制器”通常指负责在`视图`和模型之间进行调解的（胶水）代码。


    ## O

    ### Object Constraint Language

    `OCL` 是一种用于表达完整性约束的正式逻辑语言，主要用于 `UML` 类模型。它还允许在类模型中定义派生表达式以定义派生属性，并为操作定义前置条件和后置条件。


    ### Object-Oriented Programming

    `OOP` 是一种基于对象和由对象实例化的`类` 概念的编程范式。`类` 类似于对象的蓝图：它们定义了对象的`属性`以及可以应用于它们的`方法/函数`。`OOP`
    的一个高级特性是类层次结构中的`继承`：子类继承父类的特征（属性、方法和约束）。


    ### Web Ontology Language

    `OWL` 是一种用于 Web 知识表示的正式逻辑语言。它允许定义词表（主要是带有属性的类），并支持对它们表达许多类型的完整性约束。`OWL` 是执行自动推理的基础，例如检查
    `OWL` 词表的一致性。以 `UML` 类模型形式定义的词表或数据模型可以转换为 `OWL` 词表，然后检查其一致性。


    ## P

    ### Portable Network Graphics

    `PNG` 是一种支持无损数据压缩的开放（非专有）图形文件格式。


    ### Polyfill

    `polyfill`（垫物方案）是一段 JavaScript 代码，用于在不支持该方法的浏览器中模拟标准的 `JavaScript` 方法。


    ## R

    ### Resource Description Framework

    `RDF` 是一种用于在 Web 上表示机器可读命题信息的 `W3C` 语言。


    ## S

    ### Standard Generalized Markup Language

    `SGML` 是用于定义标记语言的 `ISO` 标准。`HTML4` 是通过 `SGML` 定义的。`XML` 是 `SGML` 的简化后续者。`HTML5`
    不再基于 `SGML`，而是有自己的解析规则。


    ### Scalable Vector Graphics

    `SVG` 是一种基于 `XML` 的二维矢量图像格式。`SVG` 可以用 `CSS` 样式化，并使用 `JavaScript` 实现交互。`HTML5`
    允许直接将 `SVG` 内容嵌入到 `HTML` 文档中。


    ### Slot

    `slot` 是一个键值对。在面向对象编程的对象中（例如在 `Java` 对象中），`slot` 通常是一个属性-值对。但在 `JavaScript` 对象中，`slot`
    也可能由一个方法名和方法体组成，或者可能是一个 `map` 的键值对。


    ## U

    ### Unicode

    一种与平台无关字符集，包含了世界上大多数脚本语言的字符，包括印地语、缅甸语和盖尔语等。每个字符都被分配一个 0 到 1,114,111 之间的唯一整数代码。例如，希腊字母
    `π` 的代码是 960。`Unicode` 包含了如 `ASCII` 和 `ISO-8859-1` (Latin-1) 等遗留字符集作为子集。


    `XML` 基于 `Unicode`。因此，希腊字母 `π`（代码为 960）可以使用 `XML` 实体语法作为 `&#960;` 插入 `XML` 文档。`XML`
    文档中 Unicode 字符的默认编码是 `UTF-8`，它对 ASCII 字符仅使用单个字节，对不常用的字符使用三个字节。


    ### Uniform Resource Identifier

    `URI` 既是`统一资源定位符 (URL)` 也是`统一资源名称 (URN)`。


    ### Uniform Resource Locator

    `URL` 是一种资源名称，包含一个在 Web 上定位该资源的 Web 地址。


    ### Unified Modeling Language

    `UML` 是一项行业标准，定义了一组建模语言，用于创建各种模型和图表，以支持面向对象的问题分析和软件设计。它的核心语言是用于信息/数据建模的`类图`，以及用于过程/行为建模的`序列图`、`活动图`和`状态图`（或状态图表）。


    ### Uniform Resource Name

    `URN` 是不指定位置的统一资源名称。


    ### User Agent

    `user agent`（用户代理）是一个程序，例如 浏览器。


    ## W

    ### WebM

    `WebM` 是一种支持无损数据压缩的开放（免版税）视频格式，由 `Google Chrome` 和 `Mozilla Firefox` 支持，但 `Microsoft
    Internet Explorer` 和 `Apple Safari` 不支持。


    ### Hypertext Application Technology

    `WHATWG` 由 Apple、Mozilla 和 Opera 的员工于 2004 年成立，他们对 W3C Web 技术标准进展缓慢感到不满。在 Ian
    Hickson 的领导下，他们与 W3C 竞争并合作开发了 `HTML5` 以及相关的 `JavaScript` API。


    ### World Wide Web

    `WWW`（或简称“万网”）是一个基于 `HTTP`、`HTML` 和 `XML` 的巨大客户端-服务器网络，其中 浏览器（或其他用户代理）作为 HTTP
    客户端访问作为 HTTP 服务器的 Web 程序。


    ### World Wide Consortium

    `W3C` 是一个负责和维护 Web 标准的国际组织。


    ## X

    ### XML HTTP Request

    `XML HTTP Request` (`XHR`) API 允许 JavaScript 程序与后端程序交换 `HTTP` 消息。它可以在不提交 `HTML`
    表单的情况下，从后端程序检索或提交信息。过去，基于 `XHR` 的方法被归类为 `AJAX`。


