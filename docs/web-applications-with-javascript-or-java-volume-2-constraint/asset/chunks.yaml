  trans: "\nHTML 需要字符串或数字值来填充表单。在我们的案例中，`Book` 类的属性发布者是一个对象引用。JSF 允许通过 `converter`\
    \ 将对象转换为字符串反反之，这些转换器是标记了 `@FacesConverter` 注解并实现了 `javax.faces.convert.Converter`\
    \ 接口的类：\n\n```\n @FacesConverter( value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n  @Override\n     public\
    \ Object getAsObject( FacesContext context,\n                    UIComponent component,\
    \ String value) {\n           PublisherController ac = FacesContext\n        \
    \                 .getCurrentInstance()\n                         .getApplication()\n\
    \                         .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n                                  PublisherController.class);\n           EntityManager\
    \ em = ac.getEntityManager();\n           if (value == null) return null;\n  \
    \         else return em.find( Publisher.class, value);\n     }\n     @Override\n\
    \     public String getAsString( FacesContext context,\n                  UIComponent\
    \ component, Object value) {\n          if (value == null) return null;\n    \
    \      else if (value instanceof Publisher) {\n                 return ((Publisher)\
    \ value).getName ();\n          }\n          else return null;\n     }\n}\n```\n\
    \n转换器定义了两个方法：`getAsObject` 和 `getAsString`，分别负责两种转换。为了能够从数据库中检索对象，我们需要一个 `EntityManager`，它可以从控制器获取（例如，托管豆\
    \ `publisherCtrl`）。控制器可以通过 `FacesContext` 单例来获取：\n\n```\n PublisherController\
    \ ac = FacesContext.getCurrentInstance()\n         .getApplication()\n       \
    \  .evaluateExpressionGet( context, \"#{publisherCtrl}\",\n                  \
    \ PublisherController.class);\n```\n\n此外，我们需要在控制器类中按照如下所示添加一个 `getEntityManager`\
    \ 方法：\n\n```\n @ManagedBean( name=\"publisherCtrl\") @SessionScoped\npublic class\
    \ PublisherController {\n       @PersistenceContext( unitName=\"UnidirAssocApp\"\
    )\n       private EntityManager em;\n      @Resource()\n      UserTransaction\
    \ ut;\n\n      public EntityManager getEntityManager() {\n           return this.em;\n\
    \      }\n      …\n}\n```\n\n在 `update book` 用例中，当发布者列表需要自动选择当前发布者时，JSF 需要比较两个发布者实例。因此，`Publisher`\
    \ 模型类需要实现 `equals` 方法。在我们的案例中，如果两个发布者的 `name` 属性值相等，则它们是“同一个”：\n\n```\n @Override\n\
    public boolean equals( Object obj) {\n      if (obj instanceof Publisher) {\n\
    \            Publisher publisher = (Publisher) obj;\n            return ( this.name.equals(\
    \ publisher.name));\n      } else return false;\n}\n```\n\n### 4.5.3.2 编写视图代码\n\
    \n为了在 `create` 和 `update` 用例中允许从列表中选择与当前编辑对象关联的对象，通过 `h:selectOneMenu` 元素向一个 HTML\
    \ 选择列表（即 `select` 元素）中填充关联对象类型的实例。`WebContent/views/books/` 文件夹下的 `create.xhtml`\
    \ 文件更新如下：\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n <ui:define name=\"content\">\n  <h:form id=\"createBookForm\" styleClass=\"\
    pure-form pure-form-aligned\">\n   <h:panelGrid columns=\"3\">\n    …\n    <h:outputLabel\
    \ for=\"publisher\" value=\"Publisher:\" />\n    <h:selectOneMenu id=\"publisher\"\
    \ value=\"#{book.publisher}\">\n      <f:selectItem itemValue=\"\" itemLabel=\"\
    ---\" />\n      <f:selectItems value=\"#{publisherCtrl.publishers}\" var=\"p\"\
    \n                                   itemLabel=\"#{p.name}\" itemValue=\"#{p}\"\
    \ />\n      <f:converter converterId=\"pl.m.converter.PublisherConverter\" />\n\
    \     </h:selectOneMenu>\n     <h:message for=\"publisher\" errorClass=\"error\"\
    \ />\n    </h:panelGrid>\n     <h:commandButton value=\"Create\"\n          action=\"\
    #{bookCtrl.create( book.isbn, book.title,\n          book.year, book.publisher.name)}\"\
    \ />\n    </h:form>\n  </ui:define>\n</ui:composition>\n```\n\n转换器通过使用 `f:converter`\
    \ 元素及其关联的 `@converterId` 属性指定。该属性的值必须与定义转换器类时使用的 `@FacesConverter` 注解的 `value`\
    \ 属性指定的指定相同，例如：\n\n```\n @FacesConverter( value = \"pl.m.converter.PublisherConverter\"\
    )\n```\n\n通常情况下，可以使用转换器的本地类名（例如 `PublisherConverter`），或者在存在命名冲突风险时使用完全限定类名（例如\
    \ `pl.m.converter.PublisherConverter`）。我们建议在所有情况下都使用完全限定名。\n\n`#{publisherCtrl.publishers}`\
    \ 表达式会导致调用 `PublisherController` 类的 `getPublishers` 方法，该方法负责返回可用发布者的列表：\n\n```\n\
    \ public List<Publisher> getPublishers () {\n       return Publisher.retrieveAll\
    \ ( em);\n}\n```\n\n书籍的创建是通过使用 `h:commandButton` 元素实现的。它会调用 `BookController` 类的\
    \ `create` 方法：\n\n```\n public String create( String isbn, String title, Integer\
    \ year,\n          Publisher publisher) {\n     try {\n          Book.create(\
    \ em, ut, title, year, publisher);\n          // 创建 Book 行后强制清除表单\n          FacesContext\
    \ context = FacesContext.getCurrentInstance();\n          facesContext.getExternalContext().getRequestMap().remove(\
    \ \"book\");\n     } catch ( EntityExistsException e) {\n          try {\n   \
    \            ut.rollback();\n          } catch ( Exception e1) {\n           \
    \    e1.printStackTrace();\n          }\n          e.printStackTrace();\n    \
    \ }  catch ( Exception e) {\n          e.printStackTrace();\n     }\n     return\
    \ \"create\";\n}\n```\n\n它简单地调用 `Book.create` 在 books 表中创建一个新行。\n\n`update book`\
    \ 用例的代码非常，，区别在于增加了选择元素（即使用 `h:selectOneMenu` JSF 元素）以允许选择书籍：\n\n```\n <ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n <ui:define name=\"content\">\n\
    \  <h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\">\n\
    \   <h:panelGrid columns=\"3\">\n   …\n    <h:outputLabel for=\"selectBook\" value=\"\
    Select book: \" />\n    <h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\"\
    >\n     <f:selectItem itemValue=\"\" itemLabel=\"---\" />\n     <f:selectItems\
    \ value=\"#{bookCtrl.books}\" var=\"b\"\n           itemValue=\"#{b.isbn}\" itemLabel=\"\
    #{b.title}\" />\n     <f:ajax listener=\"#{bookCtrl.refreshObject( book)}\"\n\
    \           render=\"isbn title year\"/>\n    </h:selectOneMenu>\n    <h:message\
    \ for=\"selectedBook\"/>\n   …\n   </h:panelGrid>\n   <h:commandButton value=\"\
    Create\" action=\"#{bookCtrl.create (\n       book.isbn, book.title, book.year,\
    \ book.publisher.name)}\" />\n  </h:form>\n </ui:define>\n</ui:composition>\n\
    ```\n"
- fmt: "\nA multi-valued reference property, such as `Book::authors`, allows storing\
    \ a collection of internal references to objects of some type, such as references\
    \ to `Author` objects. When creating a new object of type `Book`, the constructor\
    \ function needs to have a parameter for providing a suitable value for this property.\
    \ In general, this value can be a set of internal object references or of ID references.\
    \ With `JPA`, we use object references:\n\n```\n @Entity @Table ( name=\"books\"\
    )\n@ManagedBean ( name=\"book\")\n@ViewScoped\npublic class Book {\n       …\n\
    \       private Set<Author> authors;\n\n       public Book() { // required by\
    \ JPA @Entity annotation!}\n       public Book( String isbn, String title, Integer\
    \ year,\n                    Publisher publisher, Set<Author> authors) {…}\n\n\
    \       public Set<Author> getAuthors() { return this.authors;}\n       public\
    \ void setAuthors( Set<Author> authors) { this.authors = authors;}\n      …\n\
    }\n```\n\n### 5.2 Make a Java Entity Class Model\n\nOur starting point for making\
    \ a Java Entity class model is the following OO class model:\n\n![](graphic/converted/b_9783110500325-005_ingr_001.png)\n\
    \nThis model contains, in addition to the single-valued reference property `Book::publisher`\
    \ representing the unidirectional many-to-one association `Book`-`has`-`Publisher`,\
    \ the multi-valued reference property `Book::authors` representing the unidirectional\
    \ many-to-many association `Book`-`has`-`Author`.\n\nRecall that we obtain a Java\
    \ Entity class, like `Author`, from the corresponding class in the OO class model,\
    \ by (1) making all properties private, (2) using Java datatype classes, (3) adding\
    \ public getters and setters, (4) adding a `toString` function, (5) adding the\
    \ data storage methods create, retrieve, update and delete:\n\n![](graphic/converted/b_9783110500325-005_ingr_002.png)\n\
    \nIn the Java Entity class model, any reference property specified in the OO class\
    \ model is annotated with the functionality type of the association represented\
    \ by it. In our example, we annotate the reference property `authors` in the Entity\
    \ class `Book` with `manyToMany`:\n\n![](graphic/converted/b_9783110500325-005_ingr_003.png)\n\
    \n### 5.3 New Issues\n\nCompared to dealing with a unidirectional functional association,\
    \ as discussed in the previous section, we have to deal with the following new\
    \ technical issues:\n\n1. In *model classes* we now have to take care of `multi-valued\
    \ reference properties` that have to be annotated with `@OneToMany` or `@ManyToMany`.\n\
    2. In the *user interface* code we now have to take care of:\n    1. showing information\
    \ about a collection of associated objects in the view table columns that render\
    \ multi-valued reference properties in the `retrieve/list all objects` use case;\n\
    \    2. allowing to select a collection of associated objects from a list of all\
    \ existing instances of the target class in the `create object` and `update object`\
    \ use cases.\n\nThe last issue, allowing to select a collection of associated\
    \ objects from a list of all existing instances of some class, in general, cannot\
    \ be solved with the help of an HTML select multiple form element because of usability\
    \ problems. Whenever the set of selectable options is greater than a certain threshold\
    \ (defined by the number of options that can be seen on the screen without scrolling),\
    \ the HTML select multiple element is no longer usable, and an alternative *multi-selection\
    \ widget* has to be used.\n\n### 5.4 Write the Model Code\n\nThe Java Entity class\
    \ model can be directly coded for implementing the model layer of our Java back-end\
    \ app.\n\n#### 5.4.1 Summary\n\n1. Code each class of the Java Entity class model\
    \ as a corresponding entity class.\n2. Code any `{id}` property modifier with\
    \ the JPA property annotation `@Id`.\n3. Code any property modifier denoting the\
    \ functionality type of a reference property, such as `{manyToOne}`, with the\
    \ corresponding JPA annotation, such as `@ManyToOne`.\n4. Code the integrity constraints\
    \ specified in the model with the help of Java Bean Validation annotations (or\
    \ custom validation annotations).\n5. Code the getters and setters as well as\
    \ the `add` and `remove` methods for multi-valued properties.\n6. Code the create,\
    \ retrieve, update and delete storage management operations as class-level methods.\n\
    \nThese steps are discussed in more detail in the following sections.\n\n####\
    \ 5.4.2 Code Each Class of the Java Entity Class Model\n\nFor the multi-valued\
    \ reference property `Book::authors`, we use a parametrized Set type:\n\n```\n\
    \ @Entity @Table ( name=\"books\")\n@ViewScoped @ManagedBean ( name=\"book\")\n\
    public class Book {\n     …\n     @ManyToMany ( fetch=FetchType.EAGER)\n     private\
    \ Set<Author> authors;\n\n     public Book() {}\n     public Book( String isbn,\
    \ String title, Integer year,\n            Publisher publisher, Set<Author> authors)\
    \ {…}\n     …\n     public Set<Author> getAuthors() { return this.authors;}\n\
    \     public void setAuthors( Set<Author> authors) { this.authors=authors;}\n\
    \     …\n}\n```\n\nThe JPA annotation `@ManyToMany` allows to specify the `Many-To-Many`\
    \ relation between the `Book` and `Author`. The annotation parameter `FetchType.EAGER`\
    \ is used, so when a `Book` instance is created, the list of authors is populated\
    \ with the corresponding `Author` instances. As a result of this annotation, a\
    \ relation table between `Book` and `Author` is created, and the resulting SQL\
    \ code is shown below:\n\n```\n CREATE TABLE IF NOT EXISTS `books_author` (\n\
    \    `Book_ISBN` varchar(10) NOT NULL,\n    `authors_PERSONID` int(11) NOT NULL\n\
    \  );\n```\n\nThe resulting class name is the underscore-separated concatenation\
    \ of the corresponding table names (e.g., `books_author`). The primary key columns\
    \ from each of the two tables are used to implement the relation. The corresponding\
    \ column names are created as follows:\n\n* for the table (e.g., `books`) which\
    \ correspond to the class with the `@ManyToMany` annotation (e.g., `Book`), the\
    \ class name is used as well as the primary key column name, (e.g., `Book_ISBN`).\n\
    * for the other table (e.g., `authors`), the table name is concatenated with the\
    \ primary key column name, (e.g., `authors_PERSONID`).\n\nIt is possible to control\
    \ these parameters, i.e., table name and relation column names, by using the `@JoinTable`\
    \ annotation. To obtain a custom named relation table, e.g., `books_authors` and\
    \ the corresponding custom named columns, e.g., `book_isbn` and `author_personid`,\
    \ one can use:\n\n```\n @JoinTable( name=\"books_authors\",\n      joinColumns\
    \ = {@JoinColumn( name=\"book_isbn\", \n      referencedColumnName=\"ISBN\")},\n\
    \      inverseJoinColumns = {@JoinColumn( name=\"author_personid\",\n        \
    \                                   referencedColumnName=\"PERSONID\")}\n```\n\
    \nIn our application, we keep the default, so a `@JoinTable` annotation is not\
    \ used.\n\nThe corresponding `Author` class is coded as a Java Entity class with\
    \ suitable annotations:\n\n```\n @Entity @Table ( name=\"author\")\n@ManagedBean\
    \ ( name=\"author\") @ViewScoped\npublic class Author {\n     // Properties\n\
    \     @Id @PositiveInteger\n     private Integer personId;\n     @Column ( nullable=false)\n\
    \     @NotNull ( message=\"A name is required!\")\n     private String name;\n\
    \     @Column ( nullable=false)\n     @NotNull ( message=\"A date of birth is\
    \ required!\")\n     @Past private Date dateOfBirth;\n     @Past private Date\
    \ dateOfDeath;\n     // Constructors\n     …\n    // Setters/getters\n    …\n\
    \    // Data management operations\n    …\n}\n```\n\nIn addition to defining properties,\
    \ the entity class needs to define constructors, setters/getters and data management\
    \ operations:\n"
  raw: "A multi-valued reference property, such as Book::authors, allows storing a\
    \ collection of internal references to objects of some type, such as references\
    \ to Author objects. When creating a new object of type Book, the constructor\
    \ function needs to have a parameter for providing a suitable value for this property.\
    \ In general, this value can be a set of internal object references or of ID references.\
    \ With JPA, we use object references:\n\n```\n @Entity @Table ( name=\"books\"\
    )\n@ManagedBean ( name=\"book\")\n@ViewScoped\npublic class Book {\n       …\n\
    \       private Set<Author> authors;\n\n       public Book() { // required by\
    \ JPA @Entity annotation!}\n       public Book( String isbn, String title, Integer\
    \ year,\n                    Publisher publisher, Set<Author> authors) {…}\n\n\
    \       public Set<Author> getAuthors() { return this.authors;}\n       public\
    \ void setAuthors( Set<Author> authors) { this.authors = authors;}\n      …\n\
    }\n```\n\n### 5.2 Make a Java Entity Class Model\n\nOur starting point for making\
    \ a Java Entity class model is the following OO class model:\n\n![](graphic/converted/b_9783110500325-005_ingr_001.png)\n\
    \nThis model contains, in addition to the single-valued reference property Book::publisher\
    \ representing the unidirectional many-to-one association *Book*-**has**-*Publisher*,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association *Book*-**has**-*Author*.\n\nRecall that we obtain a\
    \ Java Entity class, like Author, from the corresponding class in the OO class\
    \ model, by (1) making all properties private, (2) using Java datatype classes,\
    \ (3) adding public getters and setters, (4) adding a toString function, (5) adding\
    \ the data storage methods create, retrieve, update and delete:\n\n![](graphic/converted/b_9783110500325-005_ingr_002.png)\n\
    \nIn the Java Entity class model, any reference property specified in the OO class\
    \ model is annotated with the functionality type of the association represented\
    \ by it. In our example, we annotate the reference property authors in the Entity\
    \ class Book with manyToMany:\n\n![](graphic/converted/b_9783110500325-005_ingr_003.png)\n\
    \n### 5.3 New Issues\n\nCompared to dealing with a unidirectional functional association,\
    \ as discussed in the previous section, we have to deal with the following new\
    \ technical issues:\n\n1.  In *model classes* we now have to take care of ***multi-valued\
    \ reference properties*** that have to be annotated with **@OneToMany** or **@ManyToMany**.\n\
    \n2.  In the *user interface* code we now have to take care of\n\n    1.  showing\
    \ information about a collection of associated objects in the view table columns\
    \ that render multi-valued reference properties in the *retrieve/list all objects*\
    \ use case;\n\n    2.  allowing to select a collection of associated objects from\
    \ a list of all existing instances of the target class in the *create object*\
    \ and *update object* use cases.\n\nThe last issue, allowing to select a collection\
    \ of associated objects from a list of all existing instances of some class, in\
    \ general, cannot be solved with the help of an HTML select multiple form element\
    \ because of usability problems. Whenever the set of selectable options is greater\
    \ than a certain threshold (defined by the number of options that can be seen\
    \ on the screen without scrolling), the HTML select multiple element is no longer\
    \ usable, and an alternative *multi-selection widget* has to be used.\n\n### 5.4 Write\
    \ the Model Code\n\nThe Java Entity class model can be directly coded for implementing\
    \ the model layer of our Java back-end app.\n\n#### 5.4.1 Summary\n\n1.  Code\
    \ each class of the Java Entity class model as a corresponding entity class.\n\
    \n2.  Code any {id} property modifier with the JPA property annotation @Id.\n\n\
    3.  Code any property modifier denoting the functionality type of a reference\
    \ property, such as {manyToOne}, with the corresponding JPA annotation, such as\
    \ @ManyToOne.\n\n4.  Code the integrity constraints specified in the model with\
    \ the help of Java Bean Validation annotations (or custom validation annotations).\n\
    \n5.  Code the getters and setters as well as the *add* and *remove* methods for\
    \ multi-valued properties.\n\n6.  Code the create, retrieve, update and delete\
    \ storage management operations as class-level methods.\n\nThese steps are discussed\
    \ in more detail in the following sections.\n\n#### 5.4.2 Code Each Class of the\
    \ Java Entity Class Model\n\nFor the multi-valued reference property Book::authors,\
    \ we use a parametrized Set type:\n\n```\n @Entity @Table ( name=\"books\")\n\
    @ViewScoped @ManagedBean ( name=\"book\")\npublic class Book {\n     …\n     @ManyToMany\
    \ ( fetch=FetchType.EAGER)\n     private Set<Author> authors;\n\n     public Book()\
    \ {}\n     public Book( String isbn, String title, Integer year,\n           \
    \ Publisher publisher, Set<Author> authors) {…}\n     …\n     public Set<Author>\
    \ getAuthors() { return this.authors;}\n     public void setAuthors( Set<Author>\
    \ authors) { this.authors=authors;}\n     …\n}\n```\n\nThe JPA annotation @ManyToMany\
    \ allows to specify the **Many-To-Many** relation between the Book and Author.\
    \ The annotation parameter FetchType.EAGER is used, so when a Book instance is\
    \ created, the list of authors is populated with the corresponding Author instances.\
    \ As a result of this annotation, a relation table between Book and Author is\
    \ created, and the resulting SQL code is shown below:\n\n```\n CREATE TABLE IF\
    \ NOT EXISTS `books_author` (\n    `Book_ISBN` varchar(10) NOT NULL,\n    `authors_PERSONID`\
    \ int(11) NOT NULL\n  );\n```\n\nThe resulting class name is the underscore-separated\
    \ concatenation of the corresponding table names (e.g., books_author). The primary\
    \ key columns from each of the two tables are used to implement the relation.\
    \ The corresponding column names are created as follows:\n\n*   for the table\
    \ (e.g., books) which correspond to the class with the @ManyToMany annotation\
    \ (e.g., Book), the class name is used as well as the primary key column name,\
    \ (e.g., Book_ISBN).\n\n*   for the other table (e.g., authors), the table name\
    \ is concatenated with the primary key column name, (e.g., authors_PERSONID).\n\
    \nIt is possible to control these parameters, i.e., table name and relation column\
    \ names, by using the @JoinTable annotation. To obtain a custom named relation\
    \ table, e.g., books_authors and the corresponding custom named columns, e.g.,\
    \ book_isbn and author_personid, one can use:\n\n```\n @JoinTable( name=\"books_authors\"\
    ,\n      joinColumns = {@JoinColumn( name=\"book_isbn\", \n      referencedColumnName=\"\
    ISBN\")},\n      inverseJoinColumns = {@JoinColumn( name=\"author_personid\",\n\
    \                                           referencedColumnName=\"PERSONID\"\
    )}\n```\n\nIn our application, we keep the default, so a @JoinTable annotation\
    \ is not used.\n\nThe corresponding Author class is coded as a Java Entity class\
    \ with suitable annotations:\n\n```\n @Entity @Table ( name=\"author\")\n@ManagedBean\
    \ ( name=\"author\") @ViewScoped\npublic class Author {\n     // Properties\n\
    \     @Id @PositiveInteger\n     private Integer personId;\n     @Column ( nullable=false)\n\
    \     @NotNull ( message=\"A name is required!\")\n     private String name;\n\
    \     @Column ( nullable=false)\n     @NotNull ( message=\"A date of birth is\
    \ required!\")\n     @Past private Date dateOfBirth;\n     @Past private Date\
    \ dateOfDeath;\n     // Constructors\n     …\n    // Setters/getters\n    …\n\
    \    // Data management operations\n    …\n}\n```\n\nIn addition to defining properties,\
    \ the entity class needs to define constructors, setters/getters and data management\
    \ operations:"
