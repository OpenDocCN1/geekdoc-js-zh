  trans: "\n对于带有 `@OneToOne` 或 `@ManyToOne` 注解（表示 `functional` 关联）的 `single-valued`\
    \ 引用属性，其默认值为 `FetchType.EAGER`，因此引用的实体会与引用实体一起获取；而在 `non-functional` 关联（使用 `@OneToMany`\
    \ 或 `@ManyToMany`）的情况下，默认值为 `FetchType.LAZY`，因此引用的实体不会与引用实体一起获取，而是在需要时才单独检索。\n\
    \n由于这些 JPA 注解，生成了用于创建 `books` 表的以下 SQL 表创建语句：\n\n```\n CREATE TABLE IF NOT EXISTS\
    \ `books` (\n     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255) NOT\
    \ NULL,\n     `YEAR` int(11) NOT NULL,\n     `PUBLISHER_NAME` varchar(255) DEFAULT\
    \ NULL\n           FOREIGN  KEY (`PUBLISHER_NAME`) REFERENCES `publishers` (`NAME`)\n\
    );\n```\n\n### 4.4.3 编写约束\n\n确保实体类模型中指定的所有属性约束都通过合适的 Bean Validation 注解正确编码。例如，对于名称属性，我们必须使用\
    \ JPA 注解 `@Id` 来指定该属性对应于实体类映射的数据库表的主键列，并使用 Bean Validation 注解 `@NotNull` 来定义强制性值约束，该约束在实体保存到数据库之前会进行检查。\n\
    \n对于地址属性，我们必须以两种形式定义强制性值约束：使用 JPA 注解 `@Column( nullable=false)` 对应相应的表列，以及使用 Bean\
    \ Validation 注解 `@NotNull` 对应属性。\n\n```\n @Id @NotNull( message=\"A name is required!\"\
    )\nprivate String name;\n@Column( nullable=false)\n@NotNull( message=\"An address\
    \ is required!\")\n private String address;\n```\n\n请注意，遗憾的是，当前的 Java EE 技术需要定义两次相同的约束：一次是以\
    \ JPA 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用。\n\n### 4.4.4 编写 Getters\
    \ 和 Setters\n\n将 setter 操作编写为（实例级）方法。setter 只负责赋值，且不执行任何验证，因为属性约束仅在 Java EE 执行环境在保存之前进行检查。getter\
    \ 则简单地返回属性的实际值。\n\n### 4.4.5 实现删除策略\n\n对于任何引用属性，我们必须选择并实现删除策略，以便在引用属性范围类的 `delete`\
    \ 方法中处理相应的对象销毁依赖。在我们的案例中，必须在以下两者之间选择：\n\n1. 删除由删除出版社出版的所有书籍；\n2. 从已删除出版社的所有书籍中删除对该删除出版社的引用。\n\
    \n我们选择第二种策略，该策略仅适用于如 `book.publisher` 等可选引用属性。在下面 `Publisher.delete` 方法的代码中所示，对于所有相关的书籍实体，都清除了\
    \ `book.publisher` 属性：\n\n```\n public static void delete( EntityManager em, UserTransaction\
    \ ut,\n          String name) throw Exception {\n     ut.begin();\n     Publisher\
    \ publisher = em.find( Publisher.class, name);\n     // find all Books which have\
    \ this publisher\n     Query query = em.createQuery(\n          \"SELECT b FROM\
    \ Book b WHERE b.publisher.name = :name\");\n     query.setParameter( \"name\"\
    , name);\n     List<Book> books = query.getResultList();\n     // clear these\
    \ books' publisher reference\n     for ( Book b: books) { b.setPublisher( null);}\n\
    \     em.remove( publisher);\n     ut.commit();\n}\n```\n\n该方法遍历所有引用待删除出版社的书籍实体，并将它们的出版社属性设置为\
    \ null。\n\n### 4.4.6 序列化与反序列化\n\n基于 JPA 注解并配合需要时合适的转换类，序列化（从 Java 对象到表行）以及相应的反序列化（从表列到\
    \ Java 对象）会自动完成。\n\n### 4.5 视图与控制器层\n\n用户界面（UI）由一个用于导航到数据管理 UI 页面的起始页面，以及每个对象类型和数据管理用例的\
    \ UI 页面组成。所有这些 UI 页面都以 JSF 视图文件的形式定义在 `WebContent/views/` 文件夹的子目录下。我们在 `WebContent/views/app`\
    \ 子目录下创建菜单页面 `index.xhtml`，内容如下：\n\n```\n <!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \n       xmlns:ui=\"…\" xmlns:h=\"…\"      xmlns:f=\"…\">\n  <ui:composition template=\"\
    /WEB-INF/templates/page.xhtml\">\n    <ui:define name=\"content\">\n      <h2>Public\
    \ Library</h2>\n      <h:button value=\"Manage publishers\"\n          outcome=\"\
    /views/publishers/index\" />\n      <h:button value=\"Manage books\" outcome=\"\
    /views/books/index\" />\n      <h:form>\n        <h:commandButton value=\"Clear\
    \ database\"\n            action=\"#{appCtrl.clearData()}\" />\n        <h:commandButton\
    \ value=\"Create test data\"\n            action=\"#{appCtrl.createTestData()}\"\
    \ />\n      </h:form>\n    </ui:define>\n  </ui:composition>\n</</html>\n```\n\
    \n它创建了菜单按钮，提供了跳转到每个管理页面对应视图的重。此外，我们需要创建一个相应的 `AppController` 类，负责测试数据的创建和删除。该控制器结合\
    \ `Publisher.createTestData` 和 `Publisher.clearData` 方法，代码如下：\n\n```\n @ManagedBean\
    \ ( name=\"appCtrl\")   @SessionScoped\npublic class AppController {\n      @PersistenceContext(unitName=\"\
    UnidirocApp\")\n      private EntityManager em;\n      @Resource()\n      UserTransaction\
    \ ut;\n\n      public String clearData () {\n           try {\n              \
    \  Book.clearData ( em, ut);\n                Publisher.clearData ( em, ut);\n\
    \           } catch ( Exception e) {\n              e.printStackTrace ();\n  \
    \         }\n           return \"index\";\n      }\n      public String createTestData\
    \ () {\n           try {\n               Publisher.createTestData ( em, ut);\n\
    \               Book.createTestData ( em, ut);\n           } catch ( Exception\
    \ e) {\n              e.printStackTrace ();\n      }\n      return \"index\";\n\
    \   }\n}\n```\n\n`Book` 和 `Publisher` 数据的删除必须按特定顺序进行以避免引用完整性冲突（必须先删除书籍，再删除出版社）。\n\
    \n#### 4.5.1 初始化应用\n\n由于代码在 Tomcat 容器中运行，初始化由容器内部完成。\n\n#### 4.5.2 在*检索/列出所有*中显示关联对象\n\
    \n我们的示例只有一个引用属性 `Book::publisher`，它是功能性的。为了在*检索/列出所有书籍*用例中显示可选出版社的信息，HTML 表中相应的列将填充出版社名称（如果有）：\n\
    \n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n     <ui:define\
    \ name=\"content\">\n         <h:dataTable value=\"#{bookCtrl.books}\" var=\"\
    b\">\n            …\n            <h:column>\n                <f:facet name=\"\
    header\">Publisher</f:facet>\n                #{b.publisher.name}\n          \
    \  </h:column>\n         </h:dataTable>\n         <h:button value=\"Main menu\"\
    \ outcome=\"index\" />\n     </ui:define>\n</ui:composition>\n```\n\n注意 `#{b.publisher.name}`\
    \ JSF 表达式中的级联调用，它访问了书籍实例 `b` 的出版社属性名称。\n\n#### 4.5.3 在*创建*和*更新*中允许选择关联对象\n\n在本节中，我们将讨论如何创建和更新具有引用属性的对象，例如具有引用属性\
    \ `publisher` 的 `Book` 对象。\n\n##### 4.5.3.1 创建对象到字符串的转换器\n\n"
- fmt: "HTML requires string or number values to populate forms. In our case, the\
    \ property publisher of the `Book` class is an object reference. JSF allows converting\
    \ objects to strings and vice versa by means of `con`, which are classes annotated\
    \ with `@FacesConverter` and implementing the `javax.faces.convert.Converter`\
    \ interface:\n\n```\n @FacesConverter( value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n  @Override\n     public\
    \ Object getAsObject( FacesContext context,\n                    UIComponent component,\
    \ String value) {\n           PublisherController ac = FacesContext\n        \
    \                 .getCurrentInstance()\n                         .getApplication()\n\
    \                         .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n                                  PublisherController.class);\n           EntityManager\
    \ em = ac.getEntityManager();\n           if (value == null) return null;\n  \
    \         else return em.find( Publisher.class, value);\n     }\n     @Override\n\
    \     public String getAsString( FacesContext context,\n                  UIComponent\
    \ component, Object value) {\n          if (value == null) return null;\n    \
    \      else if (value instanceof Publisher) {\n                 return ((Publisher)\
    \ value).getName ();\n          }\n          else return null;\n     }\n}\n```\n\
    \nA converter defines two methods: `getAsObject` and `getAsString`, which are\
    \ responsible for the two conversions. For being able to retrieve an object from\
    \ a database we need an `EntityManager`, which can be obtained from a controller\
    \ (e.g., the managed bean `publisherCtrl`). The controller can be obtained via\
    \ the `FacesContext` singleton:\n\n```\n PublisherController ac = FacesContext.getCurrentInstance()\n\
    \         .getApplication()\n         .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n                   PublisherController.class);\n```\n\nIn addition, we need\
    \ to add a `getEntityManager` method in the controller class as follows:\n\n```\n\
    \ @ManagedBean( name=\"publisherCtrl\") @SessionScoped\npublic class PublisherController\
    \ {\n       @PersistenceContext( unitName=\"UnidirAssocApp\")\n       private\
    \ EntityManager em;\n      @Resource()\n      UserTransaction ut;\n\n      public\
    \ EntityManager getEntityManager() {\n           return this.em;\n      }\n  \
    \    …\n}\n```\n\nJSF needs to compare two publisher instances, when the publisher\
    \ list has to auto-select the current publisher, in the `update book` use case.\
    \ For this reason, the `Publisher` model class needs to implement the `equals`\
    \ method. In our case, two publishers are “one and the same”, if the values of\
    \ their name property are equal:\n\n```\n @Override\npublic boolean equals( Object\
    \ obj) {\n      if (obj instanceof Publisher) {\n            Publisher publisher\
    \ = (Publisher) obj;\n            return ( this.name.equals( publisher.name));\n\
    \      } else return false;\n}\n```\n\n### 4.5.3.2 Write the View Code\n\nTo allow\
    \ selection of objects which have to be associated with the currently edited object\
    \ from a list in the `create` and `update` use cases, an HTML selection list (a\
    \ `select` element) is populated with the instances of the associated object type\
    \ with the help of a `h:selectOneMenu` element. The `create.xhtml` file in the\
    \ folder `WebContent/views/books/` is updated as follows:\n\n```\n <ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n <ui:define name=\"content\">\n\
    \  <h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\">\n\
    \   <h:panelGrid columns=\"3\">\n    …\n    <h:outputLabel for=\"publisher\" value=\"\
    Publisher:\" />\n    <h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n      <f:selectItem itemValue=\"\" itemLabel=\"---\" />\n      <f:selectItems\
    \ value=\"#{publisherCtrl.publishers}\" var=\"p\"\n                          \
    \         itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n      <f:converter converterId=\"\
    pl.m.converter.PublisherConverter\" />\n     </h:selectOneMenu>\n     <h:message\
    \ for=\"publisher\" errorClass=\"error\" />\n    </h:panelGrid>\n     <h:commandButton\
    \ value=\"Create\"\n          action=\"#{bookCtrl.create( book.isbn, book.title,\n\
    \          book.year, book.publisher.name)}\" />\n    </h:form>\n  </ui:define>\n\
    </ui:composition>\n```\n\nThe converter is specified by using the `f:converter`\
    \ element and its associated `@converterId` attribute. The value of this attribute\
    \ must be the same as the one specified by the `value` attribute of the annotation\
    \ `@FacesConverter` used when the converter class is defined, e.g.,\n\n```\n @FacesConverter(\
    \ value = \"pl.m.converter.PublisherConverter\")\n```\n\nIn general, the converter’s\
    \ local class name can be used (e.g., `PublisherConverter`), or the fully qualified\
    \ class name, if there is a risk of naming conflicts (e.g., `pl.m.converter.PublisherConverter`).\
    \ We recommend using the fully qualified name in all cases.\n\nThe `#{publisherCtrl.publishers}`\
    \ expression results in calling the `getPublishers` method of the `PublisherController`\
    \ class, which is responsible to return the list of available publishers:\n\n\
    ```\n public List<Publisher> getPublishers () {\n       return Publisher.retrieveAll\
    \ ( em);\n}\n```\n\nThe creation of the book is obtained by using the `h:commandButton`\
    \ element. It results in the invocation of the `create` method of the `BookController`\
    \ class:\n\n```\n public String create( String isbn, String title, Integer year,\n\
    \          Publisher publisher) {\n     try {\n          Book.create( em, ut,\
    \ isbn, title, year, publisher);\n          // Enforce clearing the form after\
    \ creating the Book row\n          FacesContext context = FacesContext.getCurrentInstance();\n\
    \          facesContext.getExternalContext().getRequestMap().remove( \"book\"\
    );\n     } catch ( EntityExistsException e) {\n          try {\n             \
    \  ut.rollback();\n           } catch ( Exception e1) {\n               e1.printStackTrace();\n\
    \          }\n          e.printStackTrace();\n     }  catch ( Exception e) {\n\
    \          e.printStackTrace();\n     }\n     return \"create\";\n}\n```\n\nIt\
    \ simply calls `Book.create` for creating a new row in the books table.\n\nThe\
    \ code for `update book` use case is very similar, the only important difference\
    \ is the addition of the select element (i.e., using `h:selectOneMenu` JSF element)\
    \ for allowing to select the book:\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n <ui:define name=\"content\">\n  <h:form id=\"createBookForm\" styleClass=\"\
    pure-form pure-form-aligned\">\n   <h:panelGrid columns=\"3\">\n   …\n    <h:outputLabel\
    \ for=\"selectBook\" value=\"Select book: \" />\n    <h:selectOneMenu id=\"selectBook\"\
    \ value=\"#{book.isbn}\">\n     <f:selectItem itemValue=\"\" itemLabel=\"---\"\
    \ />\n     <f:selectItems value=\"#{bookCtrl.books}\" var=\"b\"\n           itemValue=\"\
    #{b.isbn}\" itemLabel=\"#{b.title}\" />\n     <f:ajax listener=\"#{bookCtrl.refreshObject(\
    \ book)}\"\n           render=\"isbn title year\"/>\n    </h:selectOneMenu>\n\
    \    <h:message for=\"selectedBook\"/>\n   …\n   </h:panelGrid>\n   <h:commandButton\
    \ value=\"Create\" action=\"#{bookCtrl.create (\n       book.isbn, book.title,\
    \ book.year, book.publisher.name)}\" />\n  </h:form>\n </ui:define>\n</ui:composition>\n\
    ```"
  raw: "HTML requires string or number values to populate forms. In our case, the\
    \ property publisher of the Book class is an object reference. JSF allows converting\
    \ objects to strings and vice versa by means of *converters*, which are classes\
    \ annotated with @FacesConverter and implementing the javax.faces.convert.Converter\
    \ interface:\n\n```\n @FacesConverter( value=\"pl.m.converter.PublisherConverter\"\
    )\npublic class PublisherConverter implements Converter {\n  @Override\n     public\
    \ Object getAsObject( FacesContext context,\n                    UIComponent component,\
    \ String value) {\n           PublisherController ac = FacesContext\n        \
    \                 .getCurrentInstance()\n                         .getApplication()\n\
    \                         .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n                                  PublisherController.class);\n           EntityManager\
    \ em = ac.getEntityManager();\n           if (value == null) return null;\n  \
    \         else return em.find( Publisher.class, value);\n     }\n     @Override\n\
    \     public String getAsString( FacesContext context,\n                  UIComponent\
    \ component, Object value) {\n          if (value == null) return null;\n    \
    \      else if (value instanceof Publisher) {\n                 return ((Publisher)\
    \ value).getName ();\n          }\n          else return null;\n     }\n}\n```\n\
    \nA converter defines two methods: getAsObject and getAsString, which are responsible\
    \ for the two conversions. For being able to retrieve an object from a database\
    \ we need an EntityManager, which can be obtained from a controller (e.g., the\
    \ managed bean publisherCtrl). The controller can be obtained via the FacesContext\
    \ singleton:\n\n```\n PublisherController ac = FacesContext.getCurrentInstance()\n\
    \         .getApplication()\n         .evaluateExpressionGet( context, \"#{publisherCtrl}\"\
    ,\n                   PublisherController.class);\n```\n\nIn addition, we need\
    \ to add a getEntityManager method in the controller class as follows:\n\n```\n\
    \ @ManagedBean( name=\"publisherCtrl\") @SessionScoped\npublic class PublisherController\
    \ {\n       @PersistenceContext( unitName=\"UnidirAssocApp\")\n       private\
    \ EntityManager em;\n      @Resource()\n      UserTransaction ut;\n\n      public\
    \ EntityManager getEntityManager() {\n           return this.em;\n      }\n  \
    \    …\n}\n```\n\nJSF needs to compare two publisher instances, when the publisher\
    \ list has to auto-select the current publisher, in the *update book* use case.\
    \ For this reason, the Publisher model class needs to implement the equals method.\
    \ In our case, two publishers are “one and the same”, if the values of their name\
    \ property are equal:\n\n```\n @Override\npublic boolean equals( Object obj) {\n\
    \      if (obj instanceof Publisher) {\n            Publisher publisher = (Publisher)\
    \ obj;\n            return ( this.name.equals( publisher.name));\n      } else\
    \ return false;\n}\n```\n\n##### 4.5.3.2 Write the View Code\n\nTo allow selection\
    \ of objects which have to be associated with the currently edited object from\
    \ a list in the *create* and *update* use cases, an HTML selection list (a select\
    \ element) is populated with the instances of the associated object type with\
    \ the help of a h:selectOneMenu element. The create.xhtml file in the folder WebContent/views/books/\
    \ is updated as follows:\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n <ui:define name=\"content\">\n  <h:form id=\"createBookForm\" styleClass=\"\
    pure-form pure-form-aligned\">\n   <h:panelGrid columns=\"3\">\n    …\n    <h:outputLabel\
    \ for=\"publisher\" value=\"Publisher:\" />\n    <h:selectOneMenu id=\"publisher\"\
    \ value=\"#{book.publisher}\">\n      <f:selectItem itemValue=\"\" itemLabel=\"\
    ---\" />\n      <f:selectItems value=\"#{publisherCtrl.publishers}\" var=\"p\"\
    \n                                   itemLabel=\"#{p.name}\" itemValue=\"#{p}\"\
    \ />\n      <f:converter converterId=\"pl.m.converter.PublisherConverter\" />\n\
    \     </h:selectOneMenu>\n     <h:message for=\"publisher\" errorClass=\"error\"\
    \ />\n    </h:panelGrid>\n     <h:commandButton value=\"Create\"\n          action=\"\
    #{bookCtrl.create( book.isbn, book.title,\n          book.year, book.publisher.name)}\"\
    \ />\n    </h:form>\n  </ui:define>\n</ui:composition>\n```\n\nThe converter is\
    \ specified by using the f:converter element and its associated @converterId attribute.\
    \ The value of this attribute must be the same as the one specified by the value\
    \ attribute of the annotation @FacesConverter used when the converter class is\
    \ defined, e.g.,\n\n```\n @FacesConverter( value = \"pl.m.converter.PublisherConverter\"\
    )\n```\n\nIn general, the converter’s local class name can be used (e.g., PublisherConverter),\
    \ or the fully qualified class name, if there is a risk of naming conflicts (e.g.,\
    \ pl.m.converter.PublisherConverter). We recommend using the fully qualified name\
    \ in all cases.\n\nThe #{publisherCtrl.publishers} expression results in calling\
    \ the getPublishers method of the PublisherController class, which is responsible\
    \ to return the list of available publishers:\n\n```\n public List<Publisher>\
    \ getPublishers () {\n       return Publisher.retrieveAll ( em);\n}\n```\n\nThe\
    \ creation of the book is obtained by using the h:commandButton element. It results\
    \ in the invocation of the create method of the BookController class:\n\n```\n\
    \ public String create( String isbn, String title, Integer year,\n          Publisher\
    \ publisher) {\n     try {\n          Book.create( em, ut, isbn, title, year,\
    \ publisher);\n          // Enforce clearing the form after creating the Book\
    \ row\n          FacesContext facesContext = FacesContext.getCurrentInstance();\n\
    \          facesContext.getExternalContext().getRequestMap().remove( \"book\"\
    );\n     } catch ( EntityExistsException e) {\n          try {\n             \
    \  ut.rollback();\n           } catch ( Exception e1) {\n               e1.printStackTrace();\n\
    \          }\n          e.printStackTrace();\n     }  catch ( Exception e) {\n\
    \          e.printStackTrace();\n     }\n     return \"create\";\n}\n```\n\nIt\
    \ simply calls the Book.create method for creating a new row in the books table.\n\
    \nThe code for the *update book* use case is very similar, the only important\
    \ difference is the addition of the select element (i.e., using the h:selectOneMenu\
    \ JSF element) for allowing to select the book to update:\n\n```\n <ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n  <ui:define name=\"content\">\n\
    \   <h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\">\n\
    \   <h:panelGrid columns=\"3\">\n   …\n    <h:outputLabel for=\"selectBook\" value=\"\
    Select book: \" />\n    <h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\"\
    >\n     <f:selectItem itemValue=\"\" itemLabel=\"---\" />\n     <f:selectItems\
    \ value=\"#{bookCtrl.books}\" var=\"b\"\n           itemValue=\"#{b.isbn}\" itemLabel=\"\
    #{b.title}\" />\n     <f:ajax listener=\"#{bookCtrl.refreshObject( book)}\"\n\
    \           render=\"isbn title year publisher\"/>\n    </h:selectOneMenu>\n \
    \   <h:message for=\"selectedBook\"/>\n   …\n   </h:panelGrid>\n   <h:commandButton\
    \ value=\"Create\" action=\"#{bookCtrl.create (\n       book.isbn, book.title,\
    \ book.year, book.publisher.name)}\" />\n  </h:form>\n </ui:define>\n</ui:composition>\n\
    ```\n\n## 5 Unidirectional Non-Functional Associations with Java EE\n\nA unidirectional\
    \ non-functional association is either *one-to-many* or *many-to-many*. In both\
    \ cases such an association is represented with the help of a *multi-valued* reference\
    \ property.\n\nIn this chapter, we show\n\n1.  how to derive a ***Java Entity\
    \ class model*** from an OO class model with *multi-valued reference properties*\
    \ representing *unidirectional non-functional associations*,\n\n2.  how to code\
    \ the Java Entity class model in the form of entity classes (implementing *model\
    \ classes*),\n\n3.  how to write the view and controller code based on the model\
    \ code.\n\n### 5.1 Implementing Multi-Valued Reference Properties in Java"
