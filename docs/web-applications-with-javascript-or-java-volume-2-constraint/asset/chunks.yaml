  trans: "\n\n关于 `single-valued` 引用属性 `p` 以及如何通过合适的表单控件在 Web 用户界面中对其渲染，以下哪些描述是正确的？请选择一个或多个：\n\
    \n1. ☐ 使用 `type=\"text\"` 的输入控件可以获得适当的渲染。\n\n2. ☐ 如果 `p` 范围的基数不大于 7，可以使用 `check\
    \ button group`（复选框组）进行渲染。\n\n3. ☐ 如果 `p` 范围的基数不大于 7，可以使用 `radio button group`（单选按钮组）进行渲染。\n\
    \n4. 它始终可以通过单选控件进行渲染。\n\n#### 1.10.6 问题 6：表达功能类型\n\n在“x-to-y”形式（其中 `x,y` 表示“一个”或“多个”）的哪种术语可以用来表达关联既不是函数性的也不是反向函数性的？\n\
    \n答案：________________________________\n\n## 2. 使用原生 JS 实现单向函数关联\n\n单向`functional`\
    \ 关联是一对一或多对一的。在这两种情况下，此类关联都是借助 `single-valued` 引用属性来表示或实现的。\n\n在本章中，我们将展示：\n\n\
    1. 如何从具有表示 `unidirectional functional associations` 的单值引用属性的 OO 类模型推导出原生 JS 类模型，\n\
    \n2. 如何以原生 JavaScript 模型类的形式编写 JS 类模型，\n\n3. 如何基于模型代码编写视图和控制器代码。\n\n在展示如何推导原生\
    \ JS 类模型并用 JavaScript 其进行编码之前，我们首先介绍 JavaScript 语言的几个新元素，我们将在书中讨论的 JavaScript\
    \ 代码中使用它们。\n\n### 2.1. 新 JavaScript JavaScript 元素\n\n在本节中，我们将介绍由 ECMAScript 2015+（即\
    \ 2015+16+17+18+19+20+ …）引入 JavaScript 的最重要的新语言元素。\n\n#### 2.1.1 使用 `let` 和 `const`\
    \ 的块作用域变量声明\n\nES5 不允许在范围由一对大括号 `{` 和 `}` 括定的块或 `for` 循环定义的块中声明变量。相反，所有用 `var`\
    \ 声明的变量即使在块内声明也具有函数作用域或全局作用域。使用 `let` 和 `const` 的 `block-scope variable declarations`\
    \ 新功能允许声明具有细粒度作用域的局部变量，这有助于避免意外的变量重复并产生更具模块化的代码。\n\n`let` 和 `const` 之间唯一的意义区别是：用\
    \ `const` 声明的变量是`冻结`的或不可变的，从这个意义上说它们是“常量”，而 `let` 变量不是。对于所有不应改变值的变量，最好使用 `const`。否则，或者如果不明确，如果是块作用域变量，应用\
    \ `let` 声明；如果是全局或函数作用域变量，应用 `var` 声明。\n\n#### 2.1.2 箭头函数\n\n与经典的 JS 函数相比，箭头函数（带有\
    \ `=>`）提供了更简洁的函数表达式语法（见示例 1），并允许在函数体中使用函数外部环境（其 `closure`）的 JavaScript `this`\
    \ 变量（见示例 2）。\n\n**示例 2.1。**\n\n```\n let evens = [0,2,4,6,8];\nlet odds = evens.map(\
    \ v => v+1); // [1,3,5,7,9]\n// instead of evens.map( function (v) {return v+1;})\n\
    ```\n\n**示例 2.2。**\n\n```\n this.nums = [1,3,5,8,10,12,15,17];\nthis.fives = [];\n\
    this.nums.forEach( v => {if (v % 5 === 0) this.fives.push(v);});\n// instead of\
    \ this.nums.forEach(\n//     function (v) {if (v % 5 === 0) this.fives.push(v);},\
    \ this)\n```\n\n#### 2.1.3 可迭代对象的 For-Of 循环\n\n迭代对象包括字符串、数组、类数组对象（例如内置的 `arguments`\
    \ 对象或 `HTMLCollections` 和 `NodeList` 的实例）以及类型对象 `TypedArray`、`Map` 和 `Set` 的实例，以及用户定义的迭代器。例如：\n\
    \n```\n const divElems = document.getElementsByTagName(\"div\");\n// 一个 HTMLCollection\
    \ 是可迭代的\nfor (let dEl of divElems) {\n     console.log( dEl.id);\n}\n```\n\n当不需要计数变量时，`for-of`\
    \ 循环通常比 `for` 循环更方便。与 `forEach` 循环相比，`for-of` 循环允许对 `HTMLCollections` 进行迭代，并且可以使用\
    \ `break` 退出。\n\n#### 2.1.4 模板字量\n\n… 使用反引号（如 ` … `）而不是双引号或单引号括起来，并允许对（可能是多行的）字符串值使用简洁语法，这些值由固定文本部分和变量/表达式组合。例如：\n\
