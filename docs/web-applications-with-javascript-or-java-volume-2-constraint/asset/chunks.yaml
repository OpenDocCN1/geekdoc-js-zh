    \ `p` and how it should be rendered in a web user interface by a suitable form\
    \ control are correct? Select one or many:\n\n1. ☐ An adequate rendering is obtained\
    \ by using an input control with `type=\"text\"`.\n\n2. ☐ If the cardinality of\
    \ `p`'s range is not greater than 7, it can be rendered by a `check button group`.\n\
    \n3. ☐ If the cardinality of `p`'s range is not greater than 7, it can be rendered\
    \ by a `radio button group`.\n\n4. ☐ It can always be rendered by a single-select\
    \ control.\n\n#### 1.10.6 Question 6: Expressing a Functionality Type\n\nWhich\
    \ term of the form “x-to-y” (where `x,y` denote “one” or “many”) can be used for\
    \ expressing that an association is neither functional nor inverse functional?\n\
    \nAnswer: ________________________________\n\n## 2. Implementing Unidirectional\
    \ Functional Associations with Plain JS\n\nA unidirectional `functional` association\
    \ is either one-to-one or many-to-one. In both cases such an association is represented,\
    \ or implemented, with the help of a `single-valued` reference property.\n\nIn\
    \ this chapter, we show\n\n1. how to derive a plain JS class model from an OO\
    \ class model with single-valued reference properties representing `unidirectional\
    \ functional associations`,\n\n2. how to code the JS class model in the form of\
    \ plain JavaScript model classes,\n\n3. how to write the view and controller code\
    \ based on the model code.\n\nBefore we show how to derive a plain JS class model\
    \ and code it in JavaScript, we first introduce a few new elements of the JavaScript\
    \ language, which we are going to use throughout the JavaScript code discussed\
    \ in this book.\n\n### 2.1. New JavaScript Elements\n\nIn this section, we present\
    \ the most important new language elements introduced to JavaScript by ECMAScript\
    \ 2015+ (that is, 2015+16+17+18+19+20+ … ).\n\n#### 2.1.1 Block-Scope Variable\
    \ Declarations with `let` and `const`\n\nES5 did not allow declaring variables\
    \ the scope of which is a block delimited by a pair of curly braces, `{` and `}`,\
    \ or defined by a `for` loop. Rather, all variables declared with `var`, even\
    \ if declared within a block, have either a function scope or the global scope.\
    \ The new feature of `block-scope variable declarations` with `let` and `const`\
    \ allows declaring local variables with a finer-grained scope, which helps avoiding\
    \ unintended variable duplications and leads to more modular code.\n\nThere is\
    \ only one meaning difference between `let` and `const`. Variables declared with\
    \ `const` are `frozen` or `immutable`, and in this sense `constant`, while `let`\
    \ variables are not. It is preferable to use `const` for all variables that are\
    \ not supposed to change their values. Otherwise, or if this is not clear, one\
    \ should declare the variable with `let` if it is a block-scoped variable, or\
    \ with `var` if it is a global or function-scoped variable.\n\n#### 2.1.2 Arrow\
    \ Functions\n\nCompared to classical JS functions, arrow functions (with `=>`)\
    \ provide a more concise function expression syntax, see Ex. 1, and allow using\
    \ JavaScript’s `this` variable from the function’s outer environment (its `closure`)\
    \ in their function body, see Ex. 2.\n\n**Example 2.1.**\n\n```\n let evens =\
    \ [0,2,4,6,8];\nlet odds = evens.map( v => v+1); // [1,3,5,7,9]\n// instead of\
    \ evens.map( function (v) {return v+1;})\n```\n\n**Example 2.2.**\n\n```\n this.nums\
    \ = [1,3,5,8,10,12,15,17];\nthis.fives = [];\nthis.nums.forEach( v => {if (v %\
    \ 5 === 0) this.fives.push(v);});\n// instead of this.nums.forEach(\n//     function\
    \ (v) {if (v % 5 === 0) this.fives.push(v);}, this)\n```\n\n#### 2.1.3 For-Of\
    \ Loops over Iterable Objects\n\nIterable objects include strings, arrays, array-like\
    \ objects (e.g., the built-in `arguments` object or instances of `HTMLCollections`\
    \ and `NodeList`), and instances of the datatype objects `TypedArray`, `Map`,\
    \ and `Set`, as well as user-defined iterables. For instance,\n\n```\n const divElems\
    \ = document.getElementsByTagName(\"div\");\n// an HTMLCollection is iterable\n\
    for (let dEl of divElems) {\n     console.log( dEl.id);\n}\n```\n\nA `for-of`\
    \ loop is often more handy than a `for` loop whenever a counter variable is not\
    \ needed. As opposed to a `forEach` loop, a `for-of` loop allows iterating over\
    \ `HTMLCollections` and can be abandoned with `break`.\n\n#### 2.1.4 Template\
    \ Literals\n\n… are enclosed by backtick characters (like ` … `) instead of double\
    \ or single quotes and allow a concise syntax for (possibly multi-line) string\
    \ values resulting from a combination of fixed text parts and variables/expressions.\
    \ For instance,\n\n```\n const classValues = \"card important\";\nconst name =\
    \ \"Joker\";\nconst htmlTemplate = `<div class=\"${classValues}\">\n     <p>Hello\
    \ ${name}!</p>\n</div>`\n```\n\n#### 2.1.5 The Spread Operator\n\n… allows spreading\
    \ (1) the elements of an array in places where arguments are expected, or (2)\
    \ the elements of an object in places where key-value pairs are expected. For\
    \ instance,\n\n```\nconst arr = [1, 2, 3];\nconst [...copy] = arr;\n\nconst obj\
    \ = {a: 1, b: 2};\nconst {...copy} = obj;\n```\n\n#### 2.1.6 Destructuring Assignments\n\
    \n… allow a concise syntax for extracting values from arrays or properties from\
    \ objects. For instance,\n\n```\nconst [a, b] = [1, 2];\nconst {x, y} = {x: 1,\
    \ y: 2};\n```\n"
