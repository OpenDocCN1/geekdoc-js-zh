    \n在 `UI code` 中，我们现在可以利用反引用属性在 `Retrieve/List All`（检索/列出所有）用例中更有效地创建反关联对象的列表。例如，我们可以更高效地创建每个出版者的已出版书籍列表。然而，我们不允许在\
    \ `update object`（更新对象）用例中更新反关联对象的集合（例如在 `update publisher` 用例中更新已出版书籍集合）。相反，这种更新必须通过更新相关的主对象（在我们的示例中为书籍）来完成。\n\
    \n#### 8.3.1 在 Retrieve/List All 中显示已出版书籍的信息\n\n在 `Retrieve/List All publishers`（检索/列出所有出版者）用例中显示已出版书籍的信息时，我们现在可以利用派生的反属性\
    \ `publishedBooks`：\n\n```\n pl.v.publishers.retrieveAndListAll = {\n  setupUserInterface:\
    \ function () {\n     const tableBodyEl = document.querySelector(\"section#Publisher-R>table>tbody\"\
    );\n   tableBodyEl.innerHTML = \"\";\n   for (let key of Object.keys( Publisher.instances))\
    \ {\n   const publisher = Publisher.instances[key];\n   const row = tableBodyEl.insertRow(-1);\n\
    \   // create list of books published by this publisher\n   const listEl = util.createListFromMap(\
    \ publisher.publishedBooks, \"title\");\n   row.insertCell(-1).textContent = publisher.name;\n\
    \   row.insertCell(-1).textContent = publisher.address;\n   row.insertCell(-1).appendChild(\
    \ listEl);\n}\n   document.getElementById(\"Publisher-M\").style.display = \"\
    none\";\n   document.getElementById(\"Publisher-R\").style.display = \"block\"\
    ;\n}\n};\n```\n\n### 9 使用 Java EE 实现双向关联\n\n在本章中，我们将展示：\n\n1. 如何从 OO 类模型（该模型已从信息设计模型派生出来）推导出\
    \ Java `Entity class model`（实体类模型）；\n2. 如何以实体类的形式（表示 `model classes`）编写实体类模型；\n\
    3. 如何基于实体类编写视图和控制器代码。\n\n### 9.1 制作 Java 实体类模型\n\n制作 Java 实体类模型的起点是一个带有派生反引用属性的\
    \ OO 类模型，如上文所述（见图 7.4），为了方便起见，我们在此再次展示：![](img/b_9783110500325-009_ingr_001.png)\n\
    \n注意，该模型包含了两个派生的反引用属性：`Publisher::/publishedBooks` 和 `Author::/authoredBooks`。它们中的每一个都通过\
    \ `inverse-of` 约束链接到其派生的主属性。因此，它们中的每一个都代表了对应于双向关联的一对互反的引用属性。\n\n我们现在展示如何从 OO 类模型推导出\
    \ Java 实体类模型：\n\n1. 将每个类转换为 `«Java Entity»` 类，并将所有属性设为私有。\n2. 将 OO 类模型中的平台无关数据类型替换为相应的\
    \ Java 类（如 `Integer`, `Float` 等）。\n3. 为所有非派生属性添加 `«get/set»` 样式，表示它们需要 getter\
    \ 和 setter。\n4. 为所有派生属性添加 `«get»` 样式，表示它们只需要 getter。\n5. 对于任何引用属性，根据其所表示的关联类型，添加相应的关键字作为属性修饰。对于给定的\
    \ OO 类模型，添加以下属性修饰：\n    * 给派生属性 `Publisher::/publishedBooks` 添加 `oneToMany`\n\
    \    * 给引用属性 `Book::publisher` 添加 `manyToOne`\n    * 给引用属性 `Book::authors` 添加\
    \ `manyToMany`\n    * 给派生属性 `Author::/authoredBooks` 添加 `manyToMany`\n6. 对于被指定为其他属性的反派生属性，将其\
    \ `{inverse of … }` 属性修饰替换为相应的 `{mappedBy=…”}` 属性修饰。\n7. 创建所需的属性约束检查操作。\n8. 为每个多值属性创建一个\
    \ `add` 操作和一个 `remove` 操作。\n\n这导致了以下 Java 实体类模型：![](img/b_9783110500325-009_ingr_002.png)\n\
    \n### 9.2 编写模型代码\n\n可以直接对 Java 实体类模型进行编码，以获取我们 Java 后应用的模型层代码。\n\n#### 9.2.1 新问题\n\
    \n与之前讨论的单向关联应用相比，我们必须处理许多新的技术问题：\n\n1. 在 `model code` 中，你现在必须通过维护构成派生反引用属性值的派生反引用（集合）来维护这些属性。这特别要求：\n\
    \    1. 每当通过 setter 初始化或更新单值主引用属性的值时（例如为 `Book` 实例 `b` 分配一个指向 ``Publisher` 实例\
    \ `p` 的引用），必须向派生反引用属性的相应值分配或添加反引用（例如将 `b` 添加到 `p.publishedBooks`）；当主属性的值被更新且派生反引用属性是多值时，必须删除指向单值主属性旧值的过时反引用。\n\
    \n"
- fmt: "\n2. whenever the value of an optional `single-valued` master reference property\
    \ is `unset` (e.g. by assigning `null` to `b.publisher` for a `Book` instance\
    \ `b`), the inverse reference has to be removed from the corresponding value of\
    \ the derived inverse reference property (such as removing `b` from `p.publishedBooks`),\
    \ if the derived inverse reference property is multi-valued, otherwise the corresponding\
    \ value of the derived inverse reference property has to be unset or updated;\n\
    \n3. whenever a reference is `added` to the value of a `multi-valued` master reference\
    \ property with the help of an add method (such as adding an `Author` reference\
    \ `a` to `b.authors` for a `Book` instance `b`), an inverse reference has to be\
    \ assigned or added to the corresponding value of the derived inverse reference\
    \ property (such as adding `b` to `a.authoredBooks`);\n\n4. whenever a reference\
    \ is `removed` from the value of a `multi-valued` master reference property with\
    \ the help of a remove method (such as removing a reference to an `Author` instance\
    \ `a` from `b.authors` for a `Book` instance `b`), the inverse reference has to\
    \ be removed from the corresponding value of the derived inverse reference property\
    \ (such as removing `b` from `a.authoredBooks`), if the derived inverse reference\
    \ property is multi-valued, otherwise the corresponding value of the derived inverse\
    \ reference property has to be unset or updated;\n\n5. whenever an object with\
    \ a single reference or with multiple references as the value of a master reference\
    \ property is `destroyed` (e.g. when a `Book` instance `b` with a single reference\
    \ `b.publisher` to a `Publisher` instance `p` is destroyed), the derived inverse\
    \ references have to be removed first (e.g. by removing `b` from `p.publishedBooks`).\n\
    \nNotice that when a new object is created with a single reference or with multiple\
    \ references as the value of a master reference property (e.g., a new `Book` instance\
    \ `b` with a single reference `b.publisher`), its setter or add method will be\
    \ invoked and will take care of creating the derived inverse references.\n\n2.\
    \ In the `UI code` we can now exploit the inverse reference properties for more\
    \ efficiently creating a list of inversely associated objects in the `list objects`\
    \ use case. For instance, we can more efficiently create a list of all published\
    \ books for each publisher.\n\n#### 9.2.2 Summary\n\n1. Code each class of the\
    \ Java `Entity` class model as a corresponding entity class.\n2. Code an `{id}`\
    \ property modifier with the JPA annotation `@Id`.\n3. Code any property modifier\
    \ denoting the functionality type of a reference property, such as `{manyToOne}`,\
    \ with the corresponding JPA annotation, such as `@ManyToOne`.\n4. Code the integrity\
    \ constraints specified in the model with the help of Java Bean Validation annotations\
    \ (or custom validation annotations).\n5. Code the getters and setters as well\
    \ as the `add` and `remove` methods for multi-valued properties.\n6. Code the\
    \ create, retrieve, update and delete storage management operations as class-level\
    \ methods.\n7. Take care of the inverse relation management in the create and\
    \ update methods.\n\nThese steps are discussed in more detail in the following\
    \ [sections.](#9783110500240_000634.xhtml_b_9783110500325-009_s_002_s_003)\n\n\
    #### 9.2.3 Code Each Class of the Java Entity Class Model\n\nIn the `Publisher`\
    \ class, we add the `publishedBooks` property and we use the `@OneToMany` annotation\
    \ corresponding to `@ManyToOne` from the `Book` class, representing the inverse\
    \ relation:\n\n```\n @Entity\npublic class Publisher {   \n  …  \n  @OneToMany(\
    \ fetch=FetchType.EAGER, mappedBy=\"publisher\")  \n  private Set<Book> publishedBooks;\
    \  \n…\n}\n```\n\nThe `mappedBy` parameter of the `@OneToMany` annotation of the\
    \ `Publisher::publishedBooks` property specifies the property that implements\
    \ the `@ManyToOne` relation in the `Book` class:\n\n```\n @Entity\npublic class\
    \ Book {\n  …\n  @ManyToOne( fetch=FetchType.EAGER)\n  @JoinColumn( name=\"PUBLISHER_NAME\"\
    )\n  private Publisher publisher;\n  …\n}\n```\n\nIn the `Author` class we add\
    \ the `authoredBooks` property with the `@ManyToMany` annotation corresponding\
    \ to `@ManyToMany` from the `Book` class representing the inverse relation:\n\n\
    ```\n @Entity\npublic class Author {\n…\n@ManyToMany( fetch=FetchType.EAGER, mappedBy=\"\
    authors\")\nprivate Set<Book> authoredBooks;\n…\n}\n```\n\nThe `mappedBy` attribute\
    \ of the `@ManyToMany` annotation for `authoredBooks` reference property of the\
    \ `Author` class specifies the name of the inverse reference property in the `Book`\
    \ class:\n\n```\n @Entity…\npublic class Book {\n  …\n  @ManyToMany( fetch=FetchType.EAGER)\n\
    \  @JoinTable( name=\"books_authors\",\n  joinColumns = {@JoinColumn( name=\"\
    BOOK_ISBN\")},\n  inverseJoinColumns = {@JoinColumn( name=\"AUTHOR_PERSONID\"\
    )})\nprivate Set<Author> authors;\n…\n}\n```\n\nWe also use the `@JoinTable` annotation\
    \ to specify the join table name for the `Many-To-Many` relation and the corresponding\
    \ column names for the join table, e.g., the table is `books_authors` and the\
    \ columns are named `BOOK_ISBN` and `AUTHOR_PERSONID`.\n\n#### 9.2.4 Code the\
    \ Setter Operations\n\nAny setter for a reference property that is coupled to\
    \ a derived inverse reference property (implementing a bidirectional association),\
    \ now also needs to assign/add/remove inverse references to/from the corresponding\
    \ value (set) of the inverse property. An example of such a setter is the following\
    \ `setPublisher` method:\n\n```\n public class Book {\n…\npublic void setPublisher(\
    \ Publisher publisher) {\n// remove the book reference from publisher.publishedBooks\n\
    if (this.publisher != null) {\nthis.publisher.removePublishedBook(this);\n}\n\
    // add the book to publisher.publishedBooks\nif (publisher != null) {\npublisher.addPublishedBook(this);\n\
    }\nthis.publisher = publisher;\n}\n}\n```\n\n#### 9.2.5 Code the Add and Remove\
    \ Operations\n\nFor any multi-valued reference property that is coupled to a derived\
    \ inverse reference property, both the `add` and `remove` method also have to\
    \ assign/add/remove corresponding references to/from (the value of) the inverse\
    \ property.\n\nFor instance, for the multi-valued reference property `Book::authors`\
    \ that is coupled to the derived inverse reference property `Author:authoredBooks`\
    \ for implementing the bidirectional association between `Book` and `Author`,\
    \ the `addAuthor` method is coded in the following way:\n\n```\n public class\
    \ Book {\n…\npublic void addAuthor( Author author) {\nif (this.authors == null)\
    \ {\nthis.authors = new HashSet<Author>();\n}\nif (!this.authors.contains( author))\
    \ {\n// add the new author reference\nthis.authors.add( author);\n// add the derived\
    \ inverse reference\nauthor.addAuthoredBook(this);\n}\n}\n}\n```\n\nFor the remove\
    \ operation `removeAuthor` we obtain the following code:\n\n```\n public class\
    \ Book {\n…\npublic void removeAuthor( Author author) {\nif (this.authors != null\
    \ && author != null &&\nthis.authors.contains( author)) {\n// delete the author\
    \ reference\nthis.authors.remove(author);\n// delete the derived inverse reference\n\
    author.removeAuthoredBook(this);\n}\n}\n}\n```\n\nRemember, for a Java Collection,\
    \ such as `Set` or `List`, the `contains` method compares two objects by using\
    \ the `equals` method of the objects. For example, for using the `contains` method\
    \ over a `Set<Authors>`, such as `publishedBooks`, in the `Author` class we implement\
    \ the following `equals` method (two authors are equal if their `personId` property\
    \ values are equal):\n\n```\n public class Author {\n…\n@Override\npublic boolean\
    \ equals( Object obj) {\nif (obj instanceof Author) {\nAuthor author = (Author)\
    \ obj;\nreturn ( this.personId.equals( author.personId));\n} else return false;\n\
    }\n…\n}\n```\n\n#### 9.2.6 Take Care of Deletion Dependencies\n"
