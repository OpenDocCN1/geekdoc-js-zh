  trans: "\n\n```\n @Entity @Table( name=\"books\")\n@Inheritance( strategy=InheritanceType.SINGLE_TABLE)\n\
    @DiscriminatorColumn( name=\"category\",\n       discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\n@DiscriminatorValue( value=\"BOOK\")\n@ManagedBean( name=\"book\"\
    ) @ViewScoped\npublic class Book {\n        @Id @Column( length=10)\n        @NotNull(\
    \ message=\"An ISBN is required!\")\n        @Pattern( regexp=\"\\\\b\\\\d{9}(\\\
    \\d|X)\\\\b\",\n                 message=\"The ISBN must be a …!\")\n        private\
    \ String isbn;\n        @Column( nullable=false) @NotNull( message=\"A title is\
    \ required!\")\n        private String title;\n        @Column( nullable=false)\
    \ @NotNull( message=\"A year is required!\")\n        @UpToNextYear\n        \
    \  @Min( value=1459, message=\"The year must not be before 1459!\")\n        \
    \  private Integer year;\n          // constructors, set, get and other methods\n\
    \          …\n}\n```\n\n在类层级结构中使用 JPA 单表继承（Single Table Inheritance）技术时，必须为父类设置\
    \ `@Inheritance` 注解（例如我们示例中的 `Book`）。它为 `strategy` 参数提供了 `InheritanceType.SINGLE_TABLE`\
    \ 的值。`@DiscriminatorColumn` 注解指定了存储区分不同子类类型（示例中为 `TextBook` 和 `Biography`）的值的表列名。\n\
    \n遗憾的是，我们无法使用 `BookCategoryEL` 枚举来定义判别列的类型，因为像 `BookCategoryEL.TEXTBOOK.name()`\
    \ 这样的 Java 表达式不是常量，因此会抛出 Java 编译器异常。相反，我们使用 `DiscriminatorType.STRING`。`@DiscriminatorValue`\
    \ 注解指定了一个唯一值，存储在表中表示给定类实例的行判别列中。\n\n此外，我们定义了子类型 `TextBook` 和 `Biography`：\n\n\
    ```\n @Entity @Table( name=\"textbooks\")\n@DiscriminatorValue( value=\"TEXTBOOK\"\
    )\n@ManagedBean( name=\"textBook\") @ViewScoped\npublic class TextBook extends\
    \ Book {\n      @Column( nullable=false) @NotNull(\n              message=\"A\
    \ subject area value is required\")\n      String subjectArea;\n      // constructors,\
    \ set, get and other methods\n     …\n}\n```\n\n`TextBook` 和 `Biography` 是 `Book`\
    \ 的子类，因此我们通过 `extends Book` 定义它们。对于每个子类，我们都添加了一个 `@DiscriminatorValue` 注解，其值来自\
    \ `BookCategoryEL` 枚举。\n\n### 14.2.4 STI 数据库结构\n\n由于注解\n\n```\n @Inheritance(\
    \ strategy=InheritanceType.SINGLE_TABLE)\n```\n\n仅使用一个数据库表来表示类层级。该表包含了对应于层级中所有类的所有属性的列，加上判别列。在我们的示例中，`books`\
    \ 表包含以下列：`isbn`、`title`、`year`、`subjectArea`、`about` 和 `category`。内部用于为应用程序生成\
    \ `books` 表的简化对应 SQL-DDL 代码所示：\n\n```\n CREATE TABLE IF NOT EXISTS `books` (\n\
    \     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255) NOT NULL,\n    \
    \ `YEAR` int(11) NOT NULL,\n     `SUBJECTAREA` varchar(255) DEFAULT NULL,\n  \
    \   `ABOUT` varchar(255) DEFAULT NULL,\n     `category` varchar(16) DEFAULT NULL,\n\
    )\n```\n\n### 14.2.5 编写视图和控制器代码\n\n用户界面（UI）由一个起始页组成，允许导航到数据管理页面（在示例中，到 `WebContent/views/books/`\
    \ 文件夹下的 `index.xhtml`）。此类数据管理页面包含四个部分：*检索/列出所有书籍*、*创建书籍*、*更新书籍*和*删除书籍*。\n\n####\
    \ 14.2.5.1 总结\n\n我们必须在“列出所有书籍”用例以及“创建书籍”和“更新书籍”用例处理类别判别器以及 `subjectArea` 和 `about`\
    \ 段属性：\n\n1.  在 `WebContent/views/books/` 文件夹下的 `retrieveAndListAll.xhtml` 的*检索/列出所有*用例的显示表中添加一个段信息列（“特殊类型”）。\n\
    2.  在 `WebContent/views/books/` 文件夹下的 `create.xhtml` 和 `update.xhtml` 的“创建书籍”和“更新书籍”用例表单中，添加一个“特殊类型”选择控件以及所有段属性的对应表单字段。段属性表单字段在选择了相应的书籍类别时才会显示，并且仅在那里进行验证。\n\
    \n#### 14.2.5.2 在*检索/列出所有*中添加段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了“特殊类型”列：\n\
    \n```\n <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n    …\n   \
    \ <h:column>\n        <f:facet name=\"header\">Special type</f:facet>\n      \
    \  #{b.getClass().getSimpleName() != 'Book' ?\n              b.getClass().getSimpleName()\
    \ : ''}\n     </h:column>\n</h:dataTable>\n```\n\n使用条件表达式来检查 Java Bean 类名是否为 `Book`，如果是，我们不显示它；如果是其他内容（例如\
    \ `TextBook` 或 `Biography`），则显示它。该表达式还展示了如何调用不同的 Java Bean 方法，而不仅仅是自定义方法。\n\n\
    #### 14.2.5.3 在*创建*和*更新*中添加“特殊类型”选择控件\n\n在两个用例中，我们需要通过选择控件选择特殊类别（`textbook` 或\
    \ `biography`），位于 `panel grid` 元素中：\n\n```\n <h:panelGrid id=\"bookPanel\" columns=\"\
    3\">\n    …\n    <h:outputText value=\"Special type: \" />\n    <h:selectOneMenu\
    \ id=\"bookType\" value=\"#{viewScope.bookTypeVal}\">\n        <f:selectItem itemLabel=\"\
    ---\"/>\n        <f:selectItems value=\"#{book.typeItems}\" />\n        <f:ajax\
    \ event=\"change\" execute=\"@this\" render=\"textPanel biographyBookPanel\"/>\n\
    \     </h:selectOneMenu>\n     <h:message for=\"bookType\" errorClass=\"error\"\
    \ />\n</h:panelGrid>\n```\n\n在选择控件中引用了三个替代面板组：\n\n1.  `standardBookPanel`：\n\n\
    ```\n <h:panelGroup id=\"standardBookPanel\">\n    <h:commandButton value=\"Create\"\
    \n            rendered=\"#{viewScope.bookTypeVal == null}\"\n            action=\"\
    #{bookController.create( book.isbn,\n           book.title, book.year)}\" />\n\
    </h:panelGroup>\n```\n\n2.  `textBookPanel`：\n\n```\n <h:panelGroup id=\"textBookPanel\"\
    >  \n     <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n \
    \               columns=\"3\">\n          <h:outputText value=\"Subject area:\
    \ \" />\n           <h:inputText id=\"subjectArea\" value=\"#{textBook.subjectArea}\"\
    />\n            <h:message for=\"subjectArea\" errorClass=\"error\" />\n     \
    \  </h:panelGrid>\n        <h:commandButton value=\"Create\"\n               \
    \      rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n                 \
    \     action=\"#{textBookController.create( book.isbn, book.title,\n         \
    \                     book.year, textBook.subjectArea)}\" />\n</h:panelGroup>\n\
    ```\n\n3.  `biographyBookPanel`：\n\n```\n <h:panelGroup id=\"biographyBookPanel\"\
    >  \n    <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'BIOGRAPHY'}\"\n \
    \             columns=\"3\">\n        <h:outputText value=\"About: \" />\n   \
    \     <h:inputText id=\"about\" value=\"#{biographyBook.about}\"/>\n        <h:message\
    \ for=\"about\" errorClass=\"error\" />\n    </h:panelGrid>\n    <h:commandButton\
    \ value=\"Create\"                        rendered=\"#{viewScope.bookTypeVal ==\
    \ 'BIOGRAPHY'}\"\n                action=\"#{biographyBookController.create( book.isbn,\n\
    \                         book.title, book.year, biographyBook.about)}\" />\n\
    </h:panelGroup>\n```\n\n关于上述代码有几点重要说明：\n\n*   `h:selectOneMenu` 用于创建单选列表，通过 `Book`\
    \ 类的 `getTypeItems()` 方法填充书籍标题。更详细的解释将在第 3 部分枚举应用中给出。\n\n"
- fmt: "\n* it is possible to conditionally render facelet components by using the\
    \ `rendered` attribute. The JSF EL expression must return true or false, this\
    \ making the HTML resulting elements to be part of the HTML DOM or not. Notice\
    \ that the conditional expressions are evaluated in the server side. This is the\
    \ method we use to hide or show the input form elements corresponding to various\
    \ book types (e.g., `TextBook` has a `subjectArea` property while `Biography`\
    \ has an `about` property).\n\n* the `render` attribute used with `f:ajax` specifies\
    \ which of the JSF components are to be updated . This is needed because of the\
    \ live DOM changes (client side, not server side) which applies after the AJAX\
    \ call.\n\n* `AJAX` is used to submit the form for reevaluation when the special\
    \ type selection list field is changed (something is selected). As a result, it\
    \ enforces the rendering of the three panels corresponding to three book cases:\
    \ simple book, text book and biography. Using `execute=\"@this\"` we enforce the\
    \ re-evaluation of the form at server side, so the resulting HTML DOM structure\
    \ contains the changes accordiong to the conditions specified by the `rendered`\
    \ attributes of the various JSF elements. Notice that a JSF element that has a\
    \ conditional rendered expression must be a child of another JSF element which\
    \ is always part of the DOM.\n\n* `h:panelGroup` is used to define a set of elements\
    \ which are either shown or hidden.\n\n* the `action` attribute of the `h:commandButton`\
    \ can’t be used with conditional expressions, therefore we have to create three\
    \ command buttons, one for each case: create/update a Book, a `TextBook` or a\
    \ `Biography`. The `create` method of the corresponding controller class (i.e.,\
    \ `BookController`, `TextBookController` or `BiographyController` is called).\n\
    \n* since we do not have a corresponding property in the Java bean class(es) for\
    \ the special type (category), we can use JSF variables to store the value of\
    \ the single select list, and then use the variable in rendered conditions for\
    \ various elements. Therefore, for the `h:selectOneMenu`, `value=\"##{viewScope.bookTypeVal}\"\
    ` specifies that we use a “on the fly” defined property named `bookTypeVal`, which\
    \ is part of the view scope internal JSF object(s). We can also define such variable\
    \ outside the view scope, e.g., `value=\"##{bookTypeVal}\"`, but in this case\
    \ they are request scoped, so their value is lost after submitting the form, and\
    \ the rendered conditions can’t be evaluated.\n\nFor a class in the class hierarchy,\
    \ one corresponding controller class is defined. It contains the specific create,\
    \ update and delete methods. The shared methods, such as `getAllObjects` are defined\
    \ by the controller of top level class (e.g., for our example, this is `BookController`).\
    \ See minimal app for more details on how to implement the controller class and\
    \ the corresponding CRUD methods. The `Update Book` test case is very similar\
    \ with the `Create Book` test case. The `Delete Book` test case remains unchanged.\n\
    \n### 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance\n\
    \nThe starting point for our case study is design model shown in Figure 2.8. In\
    \ the following sections, we show how to eliminate `Manager` class using `Class\
    \ Hierarchy Merge` design pattern and how to implement `Person` hierarchy and\
    \ use `Joined, Multiple Table Inheritance` storage with the help of JPA.\n\n####\
    \ 14.3.1 Make the Java Entity class model\n\nWe design the model classes of our\
    \ example app with the help of a Java `Entity` class model that we derive from\
    \ the `design model` by essentially leaving the generalization arrows as they\
    \ and just adding `getters` and `setters` to each class. However, in the case\
    \ of our example app, it is natural to apply `Class Hierarchy Merge` design pattern\
    \ to the segmentation of `Employee` for simplifying the data model by eliminating\
    \ `Manager` subclass. This leads to the model shown in Figure 14.2. Notice that\
    \ we have also made two technical decisions:\n\n1. We have declared the segmentation\
    \ of `Person` into `Employee` and `Author` to be `disjoint` and `complete`, that\
    \ is any person is either an employee or an author. Since Java does not support\
    \ multiple classification, we cannot implement an overlapping segmentation as\
    \ needed when roles, with Java.\n\n2. We have turned `Person` into an `abstract\
    \ class`, which means that it cannot have direct instances, but only indirect\
    \ ones via its subclasses `Employee` and `Author`. This technical design decision\
    \ is compatible with the fact that any `Person` is an `Employee` or an `Author`\
    \ (or both), and consequently there is no need for any object to instantiate `Person`\
    \ directly.\n\nFigure 14.2: The Java Entity class model of the Person hierarchy.\n\
    \n#### 14.3.2 New Issues\n\nCompared to the model of our first case study, shown\
    \ in Figure 14.1, we have to define the category relationships between `Employee`\
    \ and `Person`, as well as between `Author` and `Person`, using the JPA annotation.\
    \ In the UI code we have to take care of:\n\n1. Adding the views (in the folders\
    \ `WebContent/views/authors` and `WebContent/views/employees`) and controller\
    \ classes (`AuthorController` and `EmployeeController`) for the corresponding\
    \ `Author` and `Employee` model classes.\n\n2. Deal with the `Manager` case, by\
    \ adding a “Special type” select control, in the forms of the “Create book” and\
    \ “Update book” use cases in `WebContent/views/books/create.xhtml` and `WebContent/views/books/update.xhtml`.\
    \ Segment form fields (i.g., `department` in our example) are only displayed,\
    \ and their validation is performed, when a corresponding employee type has been\
    \ selected.\n\n#### 14.3.3 Code the Model Classes of the Java Entity Class Model\n\
    \nThe Java Entity class model shown in Figure 14.2 is coded by using the JavaBeans\
    \ `Person`, `Employee` and `Author` as well as for the enumeration type `EmployeeCategoryEL`.\n\
    \n##### 14.3.3.1 Define the Category Relationships\n\nWe define the category relationships\
    \ between `Employee` and `Person`, as well as between `Author` and `Person`, using\
    \ the JPA annotations. At first we create the `Person` class as shown below:\n\
    \n```\n @Entity @Table(name=\"persons\")\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    @DiscriminatorColumn(name=\"category\",\n      discriminatorType=DiscriminatorType.STRING,\
    \ length=16)\npublic abstract class Person {\n     @Id @NotNull(message=\"A person\
    \ ID is required!\")\n     private Integer personId;\n     @NotNull(message=\"\
    A name is required!\") @Column(nullable=false)\n     private String name;\n  \
    \  …\n}\n```\n\nComparing with the `Book` hierarchy shown in Test Case 1, the\
    \ `@Inheritance` annotations defines now the `strategy=InheritanceType.JOINED`.\
    \ This means, for every class in the inheritance hierarchy, a database table is\
    \ used. The `@DiscriminatorColumn(name=\"category\")` specifies the column in\
