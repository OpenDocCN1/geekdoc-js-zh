    \  Employee.saveAll();\n          Person.saveAll ();\n        },\n        …\n\
    }\n```\n\n## 14 Subtyping with Java EE\n\nIn this chapter, we explain two case\
    \ studies based on fragments of the information model of our running example,\
    \ the *Public Library* app. In the first case study, we consider the single-level\
    \ class hierarchy with root Book shown in Figure 12.1, which is an incomplete\
    \ disjoint segmentation. We use the *Single Table Inheritance* approach for mapping\
    \ this class hierarchy to a single database table.\n\nIn the second case study,\
    \ we consider the multi-level class hierarchy consisting of the Person roles Employee,\
    \ Manager and Author, shown in Figure 12.8\\. We use the *Joined Table Inheritance*\
    \ approach for mapping this class hierarchy to a set of database tables that are\
    \ related with each other via foreign key dependencies.\n\nIn both cases we show\n\
    \n1.  how to derive a Java Entity class model,\n\n2.  how to code the Java Entity\
    \ class model in the form of Java Entity classes,\n\n3.  how to write the view\
    \ and controller code based on the model code.\n\n### 14.1 Subtyping in Java\n\
    \nJava provides built-in support for subtyping with its extends keyword, but it\
    \ does not support *multiple inheritance*. Consider the following information\
    \ design model:\n\n![](graphic/converted/b_9783110500325-014_ingr_001.png)\n\n\
    First, we define the superclass Person. Then, we define the subclass Student and\
    \ its subtype relationship to Person by means of the extends keyword:\n\n```\n\
    \ public class Person {\n    private String firstName;\n    private String lastName;\n\
    \ …\n}\npublic class Student extends Person {\n    private int studentNo;\n  public\
    \ Student( String first, String last, int studNo) {\n      super( firstName, lastName);\n\
    \      this.setStudNo( studNo);\n  }\n …\n}\n```\n\nNotice that in the Student\
    \ class, we define a constructor with all the parameters required to create an\
    \ instance of Student. In this subclass constructor we use super to invoke the\
    \ constructor of the superclass Person.\n\n### 14.2 Case Study 1: Implement a\
    \ Class Hierarchy with *Single Table Inheritance*\n\nIn this example we implement\
    \ the Book hierarchy shown in Figure 12.1. The Java *Entity class model* is derived\
    \ from this design model.\n\n#### 14.2.1 Make the Java Entity Class Model\n\n\
    Recall that we obtain a Java Entity class modelfrom an OO class model by (1) making\
    \ all properties private, (2) using Java datatype classes, (3) adding public getters\
    \ and setters, (4) adding a toString function, (5) adding the (static) data storage\
    \ methods create, retrieve, update and delete, resulting in the model shown in\
    \ [Figure 14.1](#9783110500240_011618.xhtml_b_9783110500325-014_fig_001).\n\n\
    ![](graphic/converted/b_9783110500325-014_fig_001.png)\n\nFigure 14.1: The Java\
    \ Entity class model of the Book class hierarchy.\n\n#### 14.2.2 New Issues\n\n\
    We have to deal with a number of new issues:\n\n1.  In the *model code* we have\
    \ to take care of:\n\n    1.  Coding the enumeration type (BookCategoryEL) that\
    \ is used in the UI code for creating a selection list widget that allows choosing\
    \ the category of book.\n\n    2.  Code each class from the Book class hierarchy\
    \ using suitable JPA annotations for persistent storage in a corresponding database\
    \ table, like books.\n\n2.  In the *UI code* we have to take care of:\n\n    1.\
    \  Adding a “Special type” column to the display table of the “retrieve/list all\
    \ books” use case in retrieveAndListAll.xhtml in the folder WebContent/views/books/.\
    \ A book without a special category will have an empty table cell, while for all\
    \ other books their category will be shown in this cell, along with other segment-specific\
    \ attribute values.\n\n    2.  Adding a “Special type” select control, and corresponding\
    \ form fields for all segment properties, in the forms of the “Create book” and\
    \ “Update book” use cases in create.xhtml and update.xhtml in the folder WebContent/views/books/.\
    \ Segment property form fields are only displayed, and their validation is performed,\
    \ when a corresponding book category has been selected. Such an approach of rendering\
    \ specific form fields only on certain conditions is sometimes called *dynamic\
    \ forms*.\n\n#### 14.2.3 Code the Classes of the Java Entity Class Model\n\nThe\
    \ Java Entity class model can be directly coded for getting the code of the model\
    \ classes of our Java EE back-end app.\n\n##### 14.2.3.1 Summary\n\n1.  Code the\
    \ enumeration type (to be used in the facelets) .\n\n2.  Code the model classes\
    \ and add the corresponding JPA annotations for class hierarchy.\n\nThese steps\
    \ are discussed in more detail in the following [sections.](#9783110500240_011618.xhtml_b_9783110500325-014_s_002_s_003_s_002)\n\
    \n##### 14.2.3.2 Code the Enumeration Type BookCategoryEL\n\nThe enumeration type\
    \ BookCategoryEL is coded as a Java enum, providing both enumeration literals\
    \ as well as (human-readable) labels:\n\n```\n public enum BookCategoryEL {\n\
    \    TEXTBOOK(\"TextBook\"), BIOGRAPHY(\"Biography\");\n    private final String\
    \ label;\n\n    private BookCategoryEL( String label) {\n        this.label =\
    \ label;\n    }\n    public String getLabel() {return this.label;}\n}\n```\n\n\
    ###### 14.2.3.2.1 Code the Model Classes\n\nWe code the model classes Book, TextBook\
    \ and Biography in the form of Java Entity classes using suitable JPA annotations:"
