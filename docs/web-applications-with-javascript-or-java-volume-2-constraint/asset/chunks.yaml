  raw: "We design the *model classes* of our example app with the help of a *JS class\
    \ model* that we derive from the *design model* by essentially leaving the generalization\
    \ arrows as they are and just adding *get/set* methods and static *check* functions\
    \ to each class. However, in the case of our example app, it is natural to apply\
    \ the *Class Hierarchy Merge* design pattern (discussed in Section 12.6) to the\
    \ single-subclass-segmentation of Employee for simplifying the class model by\
    \ eliminating the Manager subclass. This leads to the model shown in [Figure 13.2](#9783110500240_011618.xhtml_b_9783110500325-013_fig_002)\
    \ below. Notice that a Person may be an Employee or an Author or both.\n\n![](graphic/converted/b_9783110500325-013_fig_002.png)\n\
    \nFigure 13.2: The JS class model of the Person roles class hierarchy.\n\n####\
    \ 13.3.2 Make a JS Entity Table Model\n\nSince we use the browsers’ *Local Storage*\
    \ as the persistent storage technology for our example app, we have to deal with\
    \ simple key-value storage. For each design model class with a singular (capitalized)\
    \ name Entity, we use its pluralized lowercase name entities as the corresponding\
    \ table name and as a key such that its associated string value is obtained by\
    \ serializing the object collection Entity.instances with the help of the JSON.stringify\
    \ method.\n\nWe design a set of suitable JS entity tables in the form of a *JS\
    \ entity table model* that we derive from the information design model. We have\
    \ to make certain choices how to organize our data store and how to derive a corresponding\
    \ entity table model.\n\nThe first choice to make concerns using either the *Single\
    \ Table Inheritance* *(STI)*, the *Table per Class Inheritance* *(TCI)* or the\
    \ *Joined Tables Inheritance* *(JTI)* approach, which are introduced in Section\
    \ 12.7.4\\. In the STI approach, a segmentation (or an entire class hierarchy)\
    \ is represented with a single table, containing columns for all attributes of\
    \ all classes involved, as shown in the example model of [Figure 13.3](#9783110500240_011618.xhtml_b_9783110500325-013_fig_003).\n\
    \n![](graphic/converted/b_9783110500325-013_fig_003.png)\n\nFigure 13.3: An STI\
    \ model of the Person roles class hierarchy.\n\nSince the given segmentation is\
    \ non-disjoint, a multi-valued enumeration attribute categories is used for representing\
    \ the information to which subclasses an instance belongs.\n\nUsing the STI approach\
    \ is feasible for the given example, since the role hierarchy does not have many\
    \ levels and the segment subclasses do not add many attributes. But, in a more\
    \ realistic example, we would have a lot more attributes in the segment subclasses\
    \ of the given role hierarchy. The STI approach is not really an option for representing\
    \ a multi-level role hierarchy. However, we may choose it for representing the\
    \ single-segment class hierarchy Manager-is-subclass-of-Employee.\n\nFor simplicity,\
    \ and because the browsers’ *Local Storage* does not support foreign keys as required\
    \ by JTI, we choose the TCI approach, where we obtain a separate table for each\
    \ class of the Person segmentation, but without foreign keys. Our choices result\
    \ in the model shown in [Figure 13.4](#9783110500240_011618.xhtml_b_9783110500325-013_fig_004)\
    \ below, which has been derived from the design model shown in Figure Figure 12.8\
    \ by\n\n1.  Merging the Manager subclass into its superclass Employee, according\
    \ to the *Class Hierarchy Merge* design pattern described in Section 12.6.\n\n\
    2.  Replacing the standard ID property modifier {id} of the personId attribute\
    \ of Person, Author and Employee with {pkey} for indicating that the attribute\
    \ is a *primary key*.\n\n3.  Replacing the singular (capitalized) class names\
    \ (*Person*, *Author* and *Employee*) with pluralized lowercase table names (*people*,\
    \ *authors* and *employees*).\n\n4.  Adding the «JS entity table» stereotype to\
    \ all class rectangles (people, authors and employees).\n\n5.  Replacing the platform-independent\
    \ datatype names with JS datatype names.\n\n6.  Dropping all generalization/inheritance\
    \ arrows and adding all attributes of supertables (personId and name) to their\
    \ subtables (authors and employees).\n\n![](graphic/converted/b_9783110500325-013_fig_004.png)\n\
    \nFigure 13.4: A TCI model of the Person roles class hierarchy.\n\nIn the case\
    \ of using the JTI approach, in addition to the steps 1–5 above, we would\n\n\
    1.  Copy the primary key column (personId) of the root table (people) to all subtables\
    \ (authors and employees).\n\n2.  Replace the generalization arrows with «fkey»-stereotyped\
    \ dependency arrows (representing *foreign key dependencies*) that are annotated\
    \ at their source end with the name of the subtable’s primary key (here: personId).\n\
    \n#### 13.3.3 New Issues\n\nCompared to the model of our first case study, shown\
    \ in [Figure 13.1](#9783110500240_011618.xhtml_b_9783110500325-013_fig_001) above,\
    \ we have to deal with a number of new issues in the *model code*:\n\n1.  Defining\
    \ the subclass relationships between Employee and Person, as well as between Author\
    \ and Person, using the JS keyword extends discussed in [Section 13.1](#9783110500240_011618.xhtml_b_9783110500325-013_s_001).\n\
    \n2.  When loading the instances of the root class (Person.instances) from persistent\
    \ storage (in Person.retrieveAll), we load (1) the records of the table representing\
    \ the root class (people) for creating its direct instances and (2) also the records\
    \ of all other tables representing its subclasses (authors and employees) for\
    \ creating their direct instances, while also adding their object references to\
    \ the root class population (to Person.instances). In this way, the root class\
    \ population does not only contain direct instances, but all instances.\n\n3.\
    \  When saving the instances of Employee and Author as records of the JS entity\
    \ tables employees and authors to persistent storage in Employee.saveAll and Author.saveAll\
    \ (invoked in pl.v.employees.manage.exit and pl.v.authors.manage.exit), we also\
    \ save the direct instances of Person as records of the people table.\n\n####\
    \ 13.3.4 Code the Model Classes of the JS Class Model\n\nThe JS class model shown\
    \ in [Figure 13.2](#9783110500240_011618.xhtml_b_9783110500325-013_fig_002) above\
    \ can be directly coded for getting the code of the model classes Person, Employee\
    \ and Author as well as for the enumeration type EmployeeCategoryEL.\n\n#####\
    \ 13.3.4.1 Defining Subtype Relationships\n\nWe define the subtype relationships\
