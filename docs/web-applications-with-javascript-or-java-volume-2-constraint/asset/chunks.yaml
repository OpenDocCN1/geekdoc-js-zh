    \ KEY (`PERSONID`)\n       REFERENCES `persons` (`PERSONID`);\nCREATE TABLE IF\
    \ NOT EXISTS `employees` (\n      `PERSONID` int(11) NOT NULL,\n      `DEPARTMENT`\
    \ varchar(64) DEFAULT NULL,\n      `EMPNO` int(11) NOT NULL,\n      `TYPE` varchar(32)\
    \ DEFAULT NULL\n);\nADD CONSTRAINT `FK_employees_PERSONID` FOREIGN KEY (`PERSONID`)\n\
    \       REFERENCES `persons` (`PERSONID`);\n```\n\n如我们所见，每个表都包含相应 Java Bean 类定义的直接属性。此外，`authors`\
    \ 和 `employees` 表在创建时为 `PERSONID` 列创建了外键约束，引用 `persons` 表中的 `PERSONID` 列。\n\n\
    ### 14.3.4 编写视图和控制器代码\n\n在用户界面中，对于每个 Java Bean 类，我们都有一个控制器类，其中包含创建、更新和删除 CRUD\
    \ 方法。`PersonController` 类被定义为抽象类，并包含 `checkPersonIdAsId` 方法，该方法是所有子类通用的。`AuthorController`\
    \ 和 `EmployeeController` 继承自 `PersonController`。\n\n对于继承层次结构中的每个抽象实体类，我们定义了一组对应\
    \ CRUD 操作的视图。例如，在 `Author` 的情况下，我们在 `WebContent/views/authors/` 文件夹中有 `retrieveAndListAll.xhtml`、`create.xhtml`、`update.xhtml`\
    \ 和 `delete.xhtml` 文件。在 `Employee` 的情况下，“Retrieve/List All Employees”用例需要显示 `Special\
    \ type of employee` 列：\n\n```\n <h:column>\n  <f:facet name=\"header\">Special\
    \ type of employee</f:facet>\n  #{e.type != null ? e.type.label.concat(\" of \"\
    ).concat(\n                                        e.department).concat(\" department\"\
    ) : \"\"}\n</h:column>\n```\n\n注意在 EL 表达式中我们不能使用 `+`（加号）运算符来拼接字符串。EL 只允许 `+` 运算符用于数值加法。然而，我们可以使用\
    \ `concat` 方法。\n\n### 14.4 运行应用程序\n\n要运行你的应用程序，你可能需要先停止 Tomcat/TomEE 服务器（Windows\
    \ 使用 `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。接下来，下载并解压我们包含应用程序所有源代码的 ZIP\
    \ 压缩包，以及你需要编辑的 `ANT` 脚本文件（修改 `server.folder` 属性值）。现在，在控制台或终端中执行以下命令：\n\n```\n\
    ant deploy -Dappname=SubtypingApp\n```\n\n最后，启动 Tomcat Web 服务器（Windows 操作系统使用\
    \ `bin/startup.bat`，Linux 使用 `bin/startup.sh`）。请耐心等待，取决于计算机的速度，这可能需要一些时间。当控制台显示以下消息时：*INFO:\
    \ Initializing Mojarra [some library versions and paths are shonw here] for context\
    \ `/subtypingapp’*，即表示就绪。最后，打开浏览器并输入：\n\n```\n http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml\n\
    ```\n\n### 15 子类型练习项目\n\n### 15.1 项目 1 – 人物类型和电影类型\n\n要构建的应用目的是管理电影及其导演、演员的信息，区分两种电影：传记片和剧集，如下模型所示：![](img/b_9783110500325-015_ingr_001)\n\
    \n按照我们的编写应用程序。确保你的页面符合 HTML5 的 XML 语法并使用 JSHint 检测。\n\n# 术语表\n\n| **C** | |\n\
    | :--- | :--- |\n| CRUD | CRUD 是任何软件应用程序执行的四种基本数据管理操作的缩写。 |\n| Cascading Style\
    \ Sheets | CSS 用于通过告诉浏览器如何渲染 HTML（或 XML）内容来定义网页样式：字体、颜色、动画。通常这些设置在单独的 CSS 文件通过\
    \ HTML 中的特殊链接关联。 |\n| **D** | |\n| Document Object Model | DOM 是获取和修改 HTML 文档节点和元素的抽象\
    \ API。所有 Web 语言都有 DOM 绑定。 |\n| Domain Name System | DNS 将用户友好的域名转换为 IP 地址，以便在互联网上定位主机。\
    \ |\n| **E** | |\n| ECMAScript | 由行业组织“Ecma” 定义的标准。 |\n| Extensible Markup Language\
    \ | XML 允许以机器可读的方式标记各种文档、数据文件和消息。如果使用的标签名是自解释的，XML 也可以是人类可读。XML 基于 Unicode。SVG\
    \ 和 MathML 基于 XML，并且有一个基于 XML 的 HTML。 |\n| | XML 提供了一种通过*XML 文档*中的*元素*及其*属性*表示结构化信息的语法。XML\
    \ 中的特定元素和属性可以来自任何词汇，例如公共标准或用户定义的 XML 格式。 |\n\n"
