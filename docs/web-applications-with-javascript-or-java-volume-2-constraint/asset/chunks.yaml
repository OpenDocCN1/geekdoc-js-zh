    \ 案例研究 1：消除类层次\n\n通过应用`Class Hierarchy Merge`设计模式可以消除简单的类层次。我们案例研究的起点是图 12.1 信息设计模型所示的简单类层次，它代表了将`Book`划分为`TextBook`教材）和`Biography`传记）不相交（但不完整）的刚性划分。首先通过应用`Class\
