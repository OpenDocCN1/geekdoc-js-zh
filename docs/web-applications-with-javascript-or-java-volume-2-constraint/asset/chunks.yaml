    After the platform-independent OO class model has been completed, one or more
    platform-specific implementation models, for a choice of specific implementation
    platforms, can be derived from it. Examples of types of platform-specific implementation
    models are `JS class models`, `Java Entity class models` and `SQL table models`.


    A platform-specific implementation model can still be expressed in the form of
    a UML class diagram, but it contains only modeling elements that can be directly
    coded in the chosen platform. Thus, for any platform considered, two guidelines
    are needed: 1) how to make the platform-specific implementation model, and 2)
    how to code this model.


    ### 1.8 Rendering Reference Properties in the User Interface


    The widgets used for data input and output in a (CRUD) data management user interface
    (UI) normally correspond to properties defined in a model class of an app. We
    have to distinguish between (various types of) `input fields` corresponding to
    (various kinds of) `attributes`, and `choice widgets` (such as `selection lists`)
    corresponding to `enumeration attributes` or to `reference properties`. Representing
    reference properties in the UI with select controls, instead of input fields,
    prevents the user from entering invalid ID references, so it takes care of `referential
    integrity`.


    In general, a `single-valued reference property` can be rendered as a single-selection
    list in the UI, no matter how many objects populate the reference property’s range,
    from which one specific choice is to be made. If the cardinality of the reference
    property’s range is sufficiently small (say, not greater than 7), then we can
    also use a `radio button group` instead of a selection list.


    A `multi-valued reference property` can be rendered as a multiple-selection list
    in the UI. However, the corresponding multiple-select control of HTML is not really
    usable as soon as there are many (say, more than 20) different options to choose
    from because the way it renders the choice is visually too scattered. In the special
    case of having only a few (say, no more than 7) options, we can also use a `checkbox
    group` instead of a multiple-selection list. But for the general case of having
    in the UI a list containing all associated objects chosen from the reference property’s
    range class, we need to develop a special UI widget that allows to add (and remove)
    objects to (and from) a list of chosen objects.


    Such a `multiple-choice widget` consists of


    1.  an HTML list element containing the chosen (associated) objects, where each
    list item contains a push button for removing the object from the choice;

    2.  a single-select control that, in combination with a push button, allows to
    add a new associated object from the range of the multi-valued reference property.


    ### 1.9 Collection Types for Multi-Valued Reference Properties


    By default, a non-functional association end associates a `set` of instances of
    the target class to any instance of the source class, which means that the collection
    values of the corresponding multi-valued reference property are sets. However,
    there are also cases, where a non-functional association end is `ordered` and,
    consequently, the collection values of the corresponding multi-valued reference
    property take the form of `ordered sets`.


    In the following example, the association end `publishedBooks` is not ordered,
    while the association end `authors` is ordered since the order of the authors
    of a book is meaningful. Notice that in a UML class diagram, an ordered association
    end is marked up with the annotation `{ordered}`.


    ![](graphic/converted/b_9783110500325-001_ingr_001.png)


    An ordered association end should not represent any ordering based on the properties
    of the target class. In our example, this implies that the ordering of the authors
    of a book should, for example, not represent their alphabetical ordering, but
    rather it should represent information that is not available via the properties
    of `Author`. This is, indeed, the case, since it represents some sort of significance,
    which is not expressed by any property.


    Notice that ordered association ends in information design models are just a convenience
    feature, because an ordered association end can always be transformed into an
    unordered one by adding one or more attributes to the association’s target class,
    such that these attributes’ values can be used for the ordering. Ordered association
    ends allow a more concise information model, and a more efficient implementation,
    by not requiring to make the ordering information explicit with the help of auxiliary
    ordering attributes.


    The two important types of collections for multi-valued reference properties are
    `sets` and `ordered sets`, while use cases for `bags` (multi-sets) and `sequences`
    (ordered multi-sets) as the collection type of a multi-valued reference property
    are rare. When the collection type of a multi-valued reference property is `bag`
    (or sequence), this can be expressed in the class diagram with the help of the
    annotation `{nonunique}` (or `{ordered, nonunique}`) in the annotation of the
    association end or property modifier.


    Notice, however, that it is quite common to use `lists` (such as `JS arrays` or
    the Java interface type `List`) as the range of multi-valued reference properties,
    both for ordered and for unordered properties.


    ### 1.10 Quiz Questions


    If you would like to look up the answers for the following quiz questions, you
    can check our discussion forum. If you don’t find an answer in the forum, you
    may create a post asking for an answer to a particular question.


    #### 1.10.1 Question 1: Meaning of “one-to-one”


    What does it mean to say that an association is “one-to-one”?


    It means that it is (select one):


    1.  O Bidirectional

    2.  O Both functional and total

    3.  O Functional

    4.  O Both functional and inverse


    #### 1.10.2 Question 2: When to Check Referential Integrity


    A referential integrity constraint for a reference property `p` with domain `C`
    and range class `D` has to be checked whenever (select one or many):


    1.  ☐ An object of `C` is destroyed.

    2.  ☐ The value of `p` is changed for some object of `C`.

    3.  ☐ A new object of `C` is created.

    4.  ☐ An object of `D` is destroyed.

    5.  ☐ A new object of `D` is created.


    #### 1.10.3 Question 3: Meaning of “Functional”


    A unidirectional binary association is functional if and only if (select one):


    1.  O Each object of the source class is linked to at most one object the target
    class.

    2.  O Each object of the target class is linked to at most one object of the source
    class.

    3.  O Each object of the source class is linked to at least one object of the
    target class.

    4.  O Each object of the source class is linked to exactly one object of the target
    class.


    #### 1.10.4 Question 4: Object Destruction Dependency


    Assume that we have an object type `B` with a standard identifier attribute `id`
    and an object type `A` with an ID reference attribute `b_id` referencing `B::id`.
    Further, assume that there is an object `b` of type `B` with `b.id = 11` and an
    object `a` of type `A` referencing `b` with `a.b_id = 11`. Which of the following
    statements are correct? Select one or many:


    1.  ☐ The object `b` can be destroyed when the ID reference in object `a` is unassigned
    (by setting `a.b_id` to `undefined` in JS or to `null` in Java) and there is no
    other object that references `b`.

    2.  ☐ The object `a` can only be destroyed when `b` has been destroyed before.

    3.  ☐ The object `b` can be destroyed when the ID reference in object `a` is reset
    to another object of type `B`, e.g. by setting `a.b_id = 7` and there is no other
    object that references `b`.

    4.  ☐ The object `b` can be destroyed when `a` has been destroyed before.


    #### 1.10.5 Question 5: Rendering a Single-Valued Reference Property

