    model, we have to replace both unidirectional associations with suitable reference
    properties. In the first step, we replace the many-to-one association `Book-has-Publisher`
    in the model of [Figure 1.6](#9783110500240_000634.xhtml_b_9783110500325-001_fig_006)
    with a functional reference property `publisher` in the class `Book`, resulting
    in the OO class model shown in [Figure 1.10](#9783110500240_000634.xhtml_b_9783110500325-001_fig_010):


    ![](graphic/converted/b_9783110500325-001_fig_010.png)


    Figure 1.10: An OO class model for Publisher and Book.


    Notice that since the target association end of the `Book-has-Publisher` association
