    \nWe can do a lot of things with arrays, see the matrix document in the Mozilla\
    \ Developer Network for the complete guide.\n\n## Logic and validation\n\nJavaScript\
    \ provides the words `if` and `else`, as well as the triple parameter, to allow\
    \ some commands to be executed only when certain conditions are met. JavaScript\
    \ determines whether a condition is met by checking the \"correctness\" of a value\
    \ or phrase. Because JavaScript is a dynamically typed language, we can use any\
