  trans: "\n\n我们可能希望链接执行除跳转到页面或刷新页面以外的操作，而上面的代码正是通过禁用默认操作来实现此点的。例如，原因可能是为了触发另一个脚本。\n\
    \n## 在淡入淡出（Fade）和滑动（Slide）效果之间切换\n\n```javascript\n// 淡入淡出\n$(\". btn\").click(function\
    \ () {\n  $(\". element\").fadeToggle(\"slow\");\n});\n\n// 切换\n$(\". btn\").click(function\
    \ () {\n  $(\". element\").slideToggle(\"slow\");\n});\n```\n\n淡入和滑动效果是 `jQuery`\
    \ 中最常用的效果之一。当我们只希望在点击时显示某个对象时，`fadeIn` 和 `slideDown` 函数是完全合适的。但如果我们希望项目在第一次点击后出现，在第二次点击后消失，那么这段代码就能成功完成任务。\n\
    \n## 折叠效果\n\n```javascript\n// 关闭所有面板\n$('#accordion').find('.content').hide();\n\
    \n// 折叠效果\n$('#accordion').find('.accordion-header').click(function () {\n  var\
    \ next = $(this).next();\n  next.slideToggle('fast');\n  $('.content').not(next).slideUp('fast');\n\
    \  return false;\n});\n```\n\n除了此部分外，你只需要正确的 HTML 就能产生效果。首先我们关闭所有面板，然后当发生点击事件时，相关的头部相关内容会顺序滑动。这是一种快速获取折叠效果的简单方法。\n\
    \n## 根据帖子确定 div 元素的高度\n\n```javascript\n$('.div').css('min-height', $('.main-div').height());\n\
    ```\n\n此方法允许 `div` 无论内容如何都能被设置为相同的高度。在上一行代码中，设置了 `div` 元素的高度，使其高度至少等于 `main-div`\
    \ 元素的高度。\n\n## 根据奇偶元素列出不同颜色列表\n\n```javascript\n$('li: odd').css('background',\
    \ '#E8E8E8');\n```\n\n这一行代码为列表中的每个元素提供了指定颜色的背景，让你能够通过在 CSS 文件中添加默认背景色（由列表中的偶数元素采用），来获得图表列表——例如斑马纹主体。这种方法不仅限于列表，还扩展到了表格、`divs`\
    \ 等。\n\n# 第八章\n\n## 使用 jQuery 处理表头和静态列 HTML 表格\n\n固定表头在网站中并不新鲜。与纸质不同，读者可以快速将视线移到屏幕顶部查看是哪一列，但屏幕尺寸使得阅读长表格变得困难。\n\
    \n固定表格表头正如其名，即使我们继续向下查看表格，它们也会保持固定在表格顶部。该命令有助于让列名始终触手可及，这样用户不需要每次查看都强制回到表格顶部，然后再回来。\n\
    \n有很多 `jQuery` 脚本和插件可以以有效且无错误的方式运行，但它们并不是所有可能问题的理想解决方案，在某些情况下，表格必须遵循结构化规则，而插件是无法计算的，例如允许在空间不足以显示表格时出现滚动条的表格。\n\
    \n本文将不是所有情况的理想解决方案，但它将是大多数常见问题的解决方案。\n\n### 使用 position: sticky 解决 CSS 问题吗？\n\n\
    CSS 对这个问题有一个合适的解决方案，即使用 `position: sticky`。遗憾的是，该解决方案在 Chrome 中不支持（尽管它之前是支持的），但开发团队由于未知原因完全从中移除了该功能。由于我们无法放弃所有的\
    \ Chrome 用户，我们必须绕过这个问题。\n\n### 使用 jQuery 解决\n\n`JQuery` 的解决方案非常简单，但在开始使用之前，我们必须看看表格是如何正确构建的：\n\
    \n```html\n<table>\n    <thead>\n      <tr>\n        <th></th>\n        <!-- 可能有更多列\
    \ -> -->\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td></td>\n\
    \        <!-- 可能有更多列 -> -->\n      </tr>\n      <!-- 可能有更多行 -->\n    </tbody>\n\
    \    <tfoot> <!-- 这部分是可选的 -> -->\n      <tr>\n        <td></td>\n      </tr>\n\
    \    </tfoot>\n</table>\n```\n\n### 我们试图实现什么？\n\n我们将尝试让脚本支持大多数常见问题，这些是：\n\n- 基础用法：表格表头是固定的。\n\
    - 水平和和垂直表格表头。\n- 宽表格：\n\n* 水平列：如果列太多导致无法在页面宽度内显示，我们将使用固定的侧边列。\n* 垂直行：这是主要用途，在向下滚动表格时，上方头部是固定的。\n\
    * 两列均固定：我们同时固定列和行。\n\n### 入门准备的 CSS\n\n尽管我们将使用通过 JavaScript 的解决方案，但 CSS 对于执行该命令是必要的：\n\
    \n```css\n.sticky-wrap {\n    overflow-x: auto;\n    position: relative;\n   \
    \ margin-bottom: 1.5em;\n    width: 100%;\n}\n\n.sticky-wrap .sticky-thead,\n\
    .sticky-wrap .sticky-col,\n.sticky-wrap .sticky-intersect {\n    opacity: 0;\n\
    \    position: absolute;\n    top: 0;\n    left: 0;\n    transition: all .125s\
    \ ease-in-out;\n    z-index: 50;\n    width: auto; /* 防止拉伸 */\n}\n\n.sticky-wrap\
    \ .sticky-thead {\n    box-shadow: 0 .25em 0em rgba(0,0,0,.125);\n    z-index:\
    \ 100;\n    width: 100%; /* 防止拉伸 */\n}\n\n.sticky-wrap .sticky-intersect {\n \
    \   opacity: 1;\n    z-index: 150;\n}\n\n.sticky-wrap .sticky-intersect th {\n\
    \    background-color: #666;\n    color: #eee;\n}\n```\n\n注意：将 `table` 标签的 CSS\
    \ 移动到 `sticky-wrap` 非常重要。\n\n```css\ntable {\n    margin: 0 auto;\n    width:\
    \ 75%;\n}\n```\n\n### 使用 JavaScript\n\n将在每个表格上实现我们的函数。重要的是，我们将检查表格是否包含 `<thead>`\
    \ 以及后者是否包含 `th`。如果不符合条件，我们的函数将忽略该表格。\n\n```javascript\n$(function () {\n  // 在这里选择页面上所有的表格\n\
    \  $('table').each(function () {\n    if ($(this).find('thead').length > 0 &&\
    \ $(this).find('th').length > 0) {\n      // 脚本其余部分在这里\n    }\n  });\n});\n```\n"
