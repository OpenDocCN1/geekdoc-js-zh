  raw: 'Note: When you trigger an event with .trigger (), you only call event handlers
    generated in JavaScript and do not invoke the default behavior of the event. For
    example, if the click event affects the link (<a> element), the browser will not
    go to the link assigned to it in the href attribute (although you can write commands
    that implement this purpose).


    After you link an event to an object, you can unsubscribe it using the .off ()
    function, which removes any threads associated with this event:


    $ (''li'') .off (''click'');


    ## Confine the events within the namespace


    One of the advantages offered by .on () is the ability to limit events to the
    "namespace". You may wonder about the need for this. For example, suppose you
    want to associate some events with an element, and then remove some of the threads,
    you can do what we did in the previous paragraph:


    *   Warning: software style is not preferred


    $ (''li'') .on (''click'', function () {


      console.log (''a list item was clicked'');


    });


    $ (''li'') .on (''click'', function () {


      registerClick ();


      doSomethingElse ();


    });


    $ (''li'') .off (''click'');


    However, this method will remove all the threads of clicking all menu items, and
    this is not what we want. If you linked a event handler confined to a namespace,
    you can target it accurately:


    $ (''li'') .on (''click.logging'', function () {


      console.log (''a list item was clicked'');


    });


    $ (''li'') .on (''click.analytics'', function () {


      registerClick ();


      doSomethingElse ();


    });


    $ (''li'') .off (''click.logging'');


    This method does not affect click-related events related to the usage statistics
    page, while it removes log-related click events.


    We can use the inventory feature to trigger specific events:


    $ (''li'') .trigger (''click.logging'');


    ## Connect multiple events simultaneously


    Another feature offered by .on () is the ability to link multiple events simultaneously.
    For example, suppose you want to execute a specific command when the user scrolls
    the page or changes the window size. This function allows you to pass the two
    events together separated by a space in a text string, followed by the function
    that you want to handle the two events:


    $ (''input [type = "text"]'') .on (''focus blur'', function () {


      console.log (''The user focused or blurred the input'');


    });


    $ (window) .on (''resize.foo scroll.bar'', function () {


      console.log (''The window has been resized or scrolled!'');


    });


    ## Pass the functions named events


    In all of our previous examples, we used to pass unknown functions as triggers
    for events, but we can create a function before passing it and storing it in a
    variable and then passing this variable as the event handlers. This is useful
    if you want to use the same function to handle different events or events from
    different elements:


    var handleClick = function () {


      console.log (''something was clicked'');


    };


    $ (''li'') .on (''click'', handleClick);


    $ (''h1'') .on (''click'', handleClick);


    ## Event object


    Each time an event is raised, the function that handles the event receives one
    parameter, which is the event object that follows criteria agreed upon by all
    browsers. This object has many beneficial properties, including:


    $ (document) .on (''click'', function (event) {


    console.log (event.type); // event type, like: "click"


    console.log (event.which); // The button or key that was pressed


    console.log (event.target); // The element from which the event originated


    console.log (event.pageX); // Mouse position on X axis


    console.log (event.pageY); // Mouse position on Y axis


    });


    ## Inside the sponsors


    When you specify the running function of an event, that function has access to
    the raw DOM element that launched the event as the context of this function, if
    you want to use jQuery to manipulate the event, enclose it in $ ():


    $ (''input'') .on (''keydown'', function (event) {


      // this: the raw element that triggered the event


      // event: the event object


      // Change the background color to red if you press the erase button, or to green,
    otherwise


      $ (this) .css (''background'', event.which === 8? ''red'': ''green'');


    });


    ## Preventing initial behavior


    Sometimes you may want to prevent the initial behavior of an event, such as wanting
    to click on a link using AJAX, instead of starting a full page reload (which is
    the initial behavior). Many developers reach this goal by returning false from
    the sponsors of the event, but this has another side effect: it also prevents
    the spread of the event (we''ll explain it shortly), which may produce undesirable
    results. The proper way to prevent the initial behavior of an event is by calling
    .preventDefault () on the event object:


    $ (''input'') .on (''keydown'', function (event) {


      // this: the raw element that triggered the event


      // event: the event object


    // Change the background color to red if you press the erase button, or to green,
    otherwise


      $ (this) .css (''background'', event.which === 8? ''red'': ''green'');


    });


    ## Event bubbling


    Consider the following code:


    $ (''a'') .on (''click'', function (event) {


      // Prevent the initial event.


      event.preventDefault ();


      // Record what happened.


      console.log (''I was just clicked!'');


    });


    This text links in hand to click on all the elements on the page (which you should
    not do permanently in the actual sites), in addition to the window and document
    elements. But what happens when you click on an <a> element listed inside others?
    The fact is that the event will be raised to the <a> element and to all the elements
    that surround it up to the document and window elements.


    This behavior is called "the rise of events". The event is raised on the element
    that the user clicked, and then moves up to all elements that contain it up to
    the top of the DOM, unless you call the function .stopPropagation () on the event
    object.


    You can understand this more easily in this example:


    <a href="#foo"> <span> I am a Link! </span> </a>


    <a href="#bar"> <b> <i> I am another Link! </b> </a>


    $ (''a'') .on (''click'', function (event) {


      event.preventDefault ();


      console.log ($ (this) .attr (''href''));


    });


    When you click on "I am a Link!", You do not actually click on the <a> element,
    but on the <span> element within it, but the event "climbs" toward the <a> element
    and triggers the associated click event.


    ## Event delegation


    The concept of "the rise of events" allows us to implement the idea of ​​"delegating
    events", that is, linking events with elements at a higher level, then discovering
    any sub-element within which the effects of the event occurred. For example, we
    can link an event to an unordered list, then determine which elements triggered
    the event:


    $ (''# my-unordered-list'') .on (''click'', function (event) {


    console.log (event.target); // Record the item that triggered the event


    });


    Of course things will get complicated if the menu items have subitems within them,
    so jQuery provides an auxiliary function that allows us to determine which elements
    we are interested in, while keeping the event associated with the higher level
    element:


    $ (''# my-unordered-list'') .on (''click'', ''li'', function (event) {


    console.log (this); // Lists the menu item that triggered the event


    });


    Delegating events has two benefits: the first is that it allows the linking of
    fewer event triggers compared to the number that we need if we decide to link
    events to individual elements, and this improves page performance significantly.
    The second benefit is that it allows us to link events with parents (such as the
    unordered list in our example), with our reassurance that the events will be raised
    even if the contents of the parent element change.


    For example, this text adds a new menu item after the event is delegated to the
    parent element, and clicking this element will trigger the event as it should,
    without the need to link any new events:


    $ (''# my-unordered-list'') .on (''click'', ''li'', function (event) {


    console.log (this); // Registers the menu item that was clicked


    });'
