    prototypes and constructor functions, and deletes object properties.


    ## Arrays


    Arrays are a type of object that is used to store a list of values, which is an
    easy way to store a group of related elements of the same type (such as text strings),
    even though in reality nothing prevents a matrix from containing many types of
    elements, including other arrays.


    Preferred method for creating an array using the literal matrix method:


    var myArray = [''a'', ''b'', ''c''];'
