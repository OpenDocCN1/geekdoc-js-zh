    # Chapter II


    # Jquery learn page navigation and editing functions in jQuery


    JQuery provides powerful tools to find the item or elements you want on the page,
    then work with these elements to reach the desired result. With its tools, jQuery
    makes it easier for processes to be more sophisticated if we were to implement
    it through native DOM functions.


    In this chapter we will look at some (but not all) of the page navigation and
    modification functions in jQuery. Before we begin, we must understand some of
    the necessary terms. Let''s say we have the following HTML text:


    <ul>


      <li>


        <span>


          <i> Foo. </i>


        </span>


      </li>


      <li> Bar </li>


    </ul>


        We say from the first list item (<li>) that he is the child of the unordered
    list (<ul>).


        We say about the unordered list (<ul>) that it is the parent of the two elements
    of the list.


        We say on the <span> element that he descended from the unordered list.


        We say about the unsorted list that it is an ancestor of everything inside
    it.


        We say about the two menu items that they are siblings.


    ## Traversal


    JQuery allows us to navigate through the HTML elements that make up our page.
    We first create an initial selection, and then we go through the DOM from there.
    As we walk through the DOM, we change from our first selection and add or delete
    some elements from it, or sometimes replace it with another entirely.


    ## Filter selections


    You can filter an existing selection to include only elements that match specific
    criteria. For example, you can filter in one of the following ways:


    var listItems = $ (


    ''li'');


    // The selection row contains only items of ''special''


    var special = listItems.filter (''.special'');


    // The selection row contains only non-special elements


    var notSpecial = listItems.not (''.special'');


    // The selection row contains only elements that include span


    var hasSpans = listItems.has (''span'');


    It is important to know that the .not () function is not the opposite of .is (),
    because .is () returns a Boolean (true or false) value, while .not () returns
    a new jQuery object.


    ## Find items starting with a selection


    An initial selection can be useful as a basis for creating additional selections.
    If you have a selection that contains a single menu item, for example, and you
    want to deal with its “siblings” or with the unordered list that it contains,
    you can create a new selection based on the existing selection easily:


