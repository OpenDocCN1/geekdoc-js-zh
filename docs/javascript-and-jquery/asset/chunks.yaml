    any script can assign a new value to any characteristic of any object that it
    can access; which is why Another drives you to keep the variables isolated from
    the public domain unless you really want other programs to change those properties.


    Object methods


    Methods are properties in the object whose values ​​are functions, to add the
    .greet () function to the person object:


    var person = {


      firstName: ''Boaz'',


      lastName: ''Sender'',


      greet: function (name) {


        log (''Hi,'' + name);


      }


    };


    person.greet (person.firstName);


    The function .greet () in the previous example received the text name as its operator.
    When calling this function, we simply sent the value of the special nameName to
    the person object. If we wanted a highly flexible job that would greet anyone,
    perhaps what we wrote was correct. But mostly we want our job to greet only the
    person identified in the object.


    Meaning of this


    Within each function (and inside each function) there is a special key word: this,
    which refers to the object that represents the context in which the function is
    called.


    When we call a person.greet (), the context is the same person. This means that
    we can use this to access one of the properties of the person object directly
    from within the .greet () function.


