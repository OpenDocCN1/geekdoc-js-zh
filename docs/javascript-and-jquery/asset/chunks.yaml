    var otherListItems = specialListItems.siblings ();\notherListItems.removeClass\
    \ ('important');\nspecialListItems.add (otherListItems) .addClass ('urgent'\n\
    );\n```\n\n## 元素操作\n\njQuery 对象的操作功能允许比原生 DOM 功能提供的更简单的格式来更改页面 DOM。jQuery 中处理元素的函数返回你正在操作的\
    \ jQuery 对象，这意味着它可以链接在字符串中，或与其他 jQuery 函数合并，正如我们在前面的段落中讨论的那样。\n\n## 编辑项\n\n在 jQuery\
    \ 中修改项有许多方法。下面，我们将查看完成最常见任务的方法。\n\n## 添加或删除类\n\nHTML 中的对象类对于 CSS 格式化的目标定位非常有用，也可以用于创建\
    \ jQuery 选择。例如，页面上的一个元素可以属于 `hidden` 类，该类在 CSS 中用于使该类元素的 `display` 属性对应于 `none`\
    \ 值，然后可以在 jQuery 中删除或添加此类来更改对应元素的外观：\n\n```javascript\n$ (\nli') .addClass ('hidden');\n\
    $ ('li') .eq (1) .removeClass ('hidden'\n);\n```\n\n在试用区域尝试示例（请务必点击此示例及后续所有示例中的“Run\
    \ with JS”按钮）\n\n如果你的条件需要重复添加或删除项，你可以使用 `.toggleClass()` 函数，它会更改对象上类的状态：如果类不存在则添加，如果已存在则删除：\n\
    \n```javascript\n$ ('li') .eq (1\n) .toggleClass ('hidden');\n```\n\n## 改变外观\n\
    \n注意：使用类别并用 CSS 规则对其进行定位以更改元素的显示方式始终好主意，仅如上述使用 jQuery 添加或删除这些类别。在本节中，我们将学习如何直接在\
    \ jQuery 中更改元素的外观，但如果达到相同的结果，我们总是于第一种方法。\n\n当你无法通过添加或删除类来实现目标时，jQuery 提供了 `.css()`\
    \ 函数，它允许直接设置元素的外观，当你需要分配在应用程序运行时才能计算的数值时，这通常是必要的，例如在页面上放置项目的信息。不宜使用 `.css()` 函数来执行简单的格式化操作。\n\
    \n当无法通过添加或删除类来实现目标时，jQuery 提供了 `.css()` 函数，允许直接设置元素的外观。当你需要根据运行时计算分配数值时，这通常是必要的。例如，假设我们需要根据父元素的宽度来设置外观，可能会求助于\
    \ `.css()` 函数：\n\n```javascript\nvar list = $ (\n'# my-unordered-list');\nvar\
    \ width = Math.floor (list.width () );\nlist.find ('li').each (function (index,\
    \ elem) {\n  var padding = width * index;\n  $ (elem) .css ('padding-right', padding\
    \ + 'px')\n});\n```\n\n如果你需要一次设置多个属性，请向 `.css()` 函数传递一个对象而不是属性名和值。注意你必须将包含特殊符号放入引号：\n\
    \n```javascript\n$ (\n'li') .eq (1) .css ({\n'font-size': '20px',\n'padding-right':\
    \ '20px'\n});\n```\n\n## 修改值\n\njQuery 提供了 `.val()` 函数来修改 input 等元素的值。\n\n你可以传递字符串来设置输入字段的内容：\n\
    \n```javascript\n$ (\n'input [type = \"text\"]') .val ('new value'\n);\n```\n\n\
    对于 select 元素，也可以使用 `.val()` 设置选中的选项：\n\n```javascript\n$ ('select') .val ('2'\n\
    );\n```\n\n对于复选框输入字段，你必须使用 `.prop()` 函数在元素上设置 属性：\n\n```javascript\n$ (\n'input\
    \ [type = \"checkbox\"]') .prop (\n'checked', true\n);\n```\n\n注意：`.prop()` 函数是在\
    \ jQuery 1.6 版本引入的；在此之前，`.attr()` 函数用于相同目的，并且在较新版本的 jQuery 中仍然有效，但如果是 checked，它只会调用\
    \ `.prop()`。如果你使用的是高于 1.6 的版本，我建议始终使用 `.prop()` 来设置 checked 属性和其他 DOM 元素属性。详情请参见文档。\n\
    \n## 更改其他属性\n\n你可以使用 `.attr()` 函数更改元素的属性，例如，你可以更改链接地址（<a> 的标题）：\n\n```javascript\n\
    $ ('a') .attr ('href',\n'new title');\n```\n\n在为属性赋值时，你可以在函数的第二个参数的位置上传递一个函数，就像之前所有的写入函数一样，该函数接收两个因素：你正在操作元素的索引以及属性的当前值。该函数必须返回属性的新值：\n\
    \n```javascript\n$ ('a') .attr (\n'href', function (index, value) {\n  return\
    \ value + '? special = true';\n});\n```\n\n你也可以通过 `.removeAttr()` 删除属性。\n\n##\
    \ 从元素获取信息\n\n"
- fmt: "\nIn the previous part (jQuery Basics) we discussed the idea of reading and\
    \ writing functions. All of the functions that can be used to change elements\
    \ can also be used to read information from those elements. For example, the `.val()`\
    \ function we described above can be used as both a read and write function:\n\
    \n```javascript\nvar input = $ ('input [type = \"text\"]');\ninput.val ('new value');\n\
    input.val (); // returns 'new value'\n```\n\nThe same applies to the function\
    \ `.css()`, as it can be used to read the value of individual CSS properties by\
    \ passing the name of the private only without a value:\n\n```javascript\nvar\
    \ listItemColor = $ ('li') .css ('color');\nvar listItemColor = $ ('li') .css\
    \ ('color');\n```\n\nWhen the Read handling functions are used, it only works\
    \ with the first element in the specification, except for the `.text()` function,\
    \ which reads the textual content of all the selected elements if no parameter\
    \ is passed to it.\n\n## Add items to the page\n\nWhether you select an element\
    \ or create a new one, you can add this element to the page. This can be done\
    \ in two ways: by calling a tracking function for the element (or elements) to\
    \ be added, or by calling a tracking function for an associated object that you\
    \ want to add.\n\nFor example, suppose you want to move an item in a list from\
    \ head to tail, there are several ways to do this.\n\nFor example, you can add\
    \ the item to the list by calling the function `.appendTo()` on the menu item\
    \ itself:\n\n```javascript\nvar listItem = $ ('# my-unordered-list li') .first\
    \ ();\nlistItem.appendTo ('# my-unordered-list');\n```\n\nYou can also add the\
    \ item by calling `.append()` on the menu:\n\n```javascript\nvar listItem = $\
    \ ('# my-unordered-list li') .first ();\n$ ('# my-unordered-list') .append (listItem);\n\
    ```\n\nOr add it by calling `.insertAfter()` on the item to move, passing the\
    \ last item in the list to the function:\n\n```javascript\nvar listItems = $ ('#\
    \ my-unordered-list li');\nlistItems.first (). insertAfter (listItems.last ());\n\
    ```\n\nOr add it by calling `.after()` on the last item in the list, passing the\
    \ first item in the list to the function:\n\n```javascript\nvar listItems = $\
    \ ('# my-unordered-list li');\nlistItems.last (). after (listItems.first ());\n\
    ```\n\nThere are many other ways to add items, so you can add them around, inside\
    \ or outside other elements, depending on your need.\n\nThe most efficient way\
    \ to add an item to a page depends on the elements that are already in your hands.\
    \ You might want to add the element to the unordered list in the previous example\
    \ if you had previously selected the unordered list for another purpose; or if\
    \ you had selected all of the items in the list, it might be easier to add the\
    \ first element after the last item.\n\nWhen you choose the appropriate method\
    \ for adding the element, not only consider the ease of the method, but think\
    \ about the possibility of its maintenance later. Avoid methods that depend on\
    \ assuming a strictly defined structure for your page. You may decide to change\
    \ this structure later.\n\n## Copy items\n\nYou can create a copy of an element\
    \ or group of elements using the `.clone()` function in jQuery, and it will create\
    \ the copy in memory without being included in the page, you should do it yourself\
    \ if you want it. You can edit copied items before adding them:\n\n```javascript\n\
    var clones = $ ('li') .clone ();\nclones.html (function (index, oldHtml) {\n \
    \ return oldHtml + '!!!';\n});\n$ ('# my-unordered-list') .append (clones);\n\
    ```\n\nNote: jQuery will not prevent you from copying an element with an identifier\
    \ (ID), but you must make sure to delete or change the identifier in the copied\
    \ element by modifying the `id` attribute before inserting it into the document,\
    \ as there should not be two elements with one identifier in the page.\n\n## Delete\
    \ items\n\nThere are three ways to remove items from the page: `.remove()`, `.detach()`\
    \ and `.replaceWith()`, and each has a different purpose.\n\n`.remove()` must\
    \ be used when it is necessary to permanently delete objects, as it will delete\
    \ all event handlers associated with the object with the object. The `.remove()`\
    \ function returns a reference to deleted items, but when you add these items\
    \ again, no events will be linked to them.\n\n```javascript\n$ ('# my-unordered-list\
    \ li') .click (function () {\n  alert ($ (this) .text ());\n});\nvar removedListItem\
    \ = $ ('# my-unordered-list li') .first (). remove ();\nremovedListItem.appendTo\
    \ ('# my-unordered-list');\nremovedListItem.trigger ('click'); // No alert message!\n\
    ```\n\nThe `.detach()` function is useful for removing items temporarily from\
    \ the page. For example, if you wish to make major changes to the page structure\
    \ using jQuery, deleting items from the page might be temporary and adding them\
    \ again is a better performance in stages. Deleted items will retain the associated\
    \ event triggers, and they can then be added to the page again using `.appendTo()`\
    \ or other add-on functions.\n\n```javascript\n$ ('# my-unordered-list li') .click\
    \ (function () {\n  alert ($ (this) .text ());\n});\nvar detachedListItem = $\
    \ ('# my-unordered-list li') .first (). detach ();\n// Do something complicated\
    \ with the menu item\ndetachedListItem.appendTo ('# my-unordered-list');\ndetachedListItem.trigger\
    \ ('click'); // alert!\n```\n\nFinally, we have the `.replaceWith()` function\
    \ that replaces an element or HTML text with an element or other elements. Items\
    \ removed from the job are returned, but all associated event handlers are deleted,\
    \ just like the `.remove()` function.\n\n```javascript\n$ ('# my-unordered-list\
    \ li') .click (function () {\n  alert ($ (this) .text ());\n});\nvar replacedListItem\
    \ = $ ('# my-unordered-list li') .first ()\n  .replaceWith ('<li>new!</li>');\n\
    replacedListItem.appendTo ('# my-unordered-list');\nreplacedListItem.trigger ('click');\n\
    ```\n\n## Conclusion\n\nIn this chapter, we learned the different ways to move\
    \ between elements, how to change them, and add new ones. In the next chapter,\
    \ we will learn how to listen for user interaction.\n\n# Chapter III: JQuery events\
    \ and how to delegate them\n\nJQuery has made it easy to respond to user interaction\
    \ with web pages. This means that you can execute a command when the user clicks\
    \ on a specific part of the page, or when the mouse pointer hovers over an item,\
    \ for example. In the following example, we have a command that executes when\
    \ the user clicks any item on the page:\n\n```javascript\n$ ('li') .click (function\
    \ (event) {\n  console.log ('clicked', $ (this) .text ());\n});\n```\n\nThe preceding\
    \ text identifies all menu items and assigns them a function to handle the click\
    \ event for each item, using the `.click()` function in jQuery.\n\nJQuery provides\
    \ several shortcuts for linking events, and each of these functions corresponds\
    \ to an original DOM event:\n\n| The original event name | Short function |\n\
    | --- | --- |\n| click | `.click()` |\n| keydown | `.keydown()` |\n| keypress\
    \ | `.keypress()` |\n| keyup | `.keyup()` |\n| mouseover | `.mouseover()` |\n\
    | mouseout | `.mouseout()` |\n| mouseenter | `.mouseenter()` |\n| mouseleave |\
    \ `.mouseleave()` |\n| scroll | `.scroll()` |\n| focus | `.focus()` |\n| blur\
    \ | `.blur()` |\n| resize | `.resize()` |\n\nThese shortcuts use the behind-the-scenes\
    \ `.on()` function, a function that you can use yourself for more flexibility.\
    \ When you use it, you pass the name of the original event as the first parameter\
    \ of the job, then a function that takes over the event as a second parameter:\n\
    \n```javascript\n$ ('li') .on ('click', function (event) {\n  console.log ('clicked',\
    \ $ (this) .text ());\n});\n```\n\nOnce you have \"connected\" the event's sponsor\
    \ to an element, you can spark this event to jQuery as well:\n\n```javascript\n\
    $ ('li'). trigger ('click');\n```\n\nAnd if the event that you want to raise has\
    \ a brief function (as mentioned in the previous table), you can provoke the event\
    \ by calling the brief function itself:\n\n```javascript\n$ ('li') .click ();\n\
    ```\n"
