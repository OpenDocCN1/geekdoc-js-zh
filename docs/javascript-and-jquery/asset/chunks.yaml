      var greeting = ''Hello,'' + person + ''!'';


      log (greeting + '''' + message);


    };


    // Use the function to greet Jory, by passing its name and the greeting message


    greet (''Jory'', ''Welcome to JavaScript'');


    // Use the function to greet Rebecca, by passing its name and a different message


    greet (''Rebecca'', ''Thanks for joining us'');


    Note: In the previous example, we used the log function. It is an auxiliary function
    available in the examples in this series only, and not automatically available
    in JavaScript, log can be used in the script editor in this series, but you will
    need to use its console.log to replace it in the scripts outside the string, and
    then the text results will be printed to the end of the browser that You use it.


    // create a function that will greet a person,


    // and assign the function to the `greet` variable


    var greet = function (person, message) {


      var greeting = ''Hello,'' + person + ''!'';


      log (greeting + '''' + message);


    };


    // use the function to greet Jory, passing in her


    // name and the message we want to use


    greet (''Jory'', ''Welcome to JavaScript'');


    // use the function to greet Rebecca, passing in her


    // name and a different message


    greet (''Rebecca'', ''Thanks for joining us'');


    The previous example displays the result of executing the script within the Console
    section. You can reset the example using the Clear button and then edit the text
    if you wish to try and re-execute it by clicking Run. It''s okay if some things
    seem incomprehensible now. In the following paragraphs we will look at concepts
    of variables, functions and other basic components of JavaScript.


    ## Note on comments


    Comments are useful for explaining what each piece of script does, and comments
    do not affect the program at all. Some programmers like a lot of comments in their
    programs, while others prefer to write them only when some parts of the text are
    obscure and not easily clarified.


    JavaScript allows two types of comments: single-line and multi-line, the first
    form begins with the letters //; the second begins with the two characters / *
    and ends with * /.


    // This is a single-line comment


    var foo;


    / *


      This is a multiline comment


      It can span more than one line, you see.


    * /


    You can also use multi-line comments embedded within a line of script:


    function cornify (unicorns / * integer * /, rainbows / * integer * /) {


    }


    ## The core components of JavaScript


    ## Variables


    Variables are the way we store values ​​that we want to use at a later time. Variables
    can be of several types of text, numbers, or other data such as arrays and objects,
    or even code scripts (in a significant way stored in a variable). The variable
    is declared with the var statement:


    var myName = ''Rebecca'';


    Any variable name can be chosen provided that the name does not start with a number
    and does not contain a minus sign "-".


    You can declare one variable in each sentence:


    var a = 1;


    var b = ''two'';


    Or declare several variables in one sentence by separating them with Latin commas:


    var a = 1,


        b = ''two'';


    After assigning a value to a variable, this variable can be used to access the
    value stored in it:


    log (myName); // ''Rebecaa'' prints


    Variables are a necessary component of adhering to the "Don''t Repeat Yourself"
    principle. If you want to use one value more than once, you most likely want to
    store it in a variable.


    We''ll talk about the variables in more detail in the next paragraph.


    ## Functions


    Functions are a key component of JavaScript software because it provides a way
    to create small functions in the program in an independent and structured part.
    For example, suppose a function that combines two numbers:


    function (a, b) {


        return a + b;


    }


    This function takes two factors, a and b, then add them together and then return
    the sum as a result of the function.


    The previous example is properly formulated JavaScript, but it does nothing at
    all, because there is no way for us to ask this function to add any two numbers
    after. So we have to find a way to call the function, and we can do that by assigning
    it to a variable first:


    var addTwoNumbers = function (a, b) {


      return a + b;


    }


    What we did in the last example is that we took an function expression and assigned
    it to a variable. We can now call this function using the variable name:


    log (addTwoNumbers (1, 1)); // Print 2


    Alternatively, we can use a function declaration to give our function a name:


    function addTwoNumbers (a, b) {


      return a + b;


    }


    Both methods allow us to call our function in the same manner, but care must be
    taken when adopting the last method for reasons explained by this post.


    Conclusion: Naming functions by declaring a function may lead to unexpected results
    if you do not fully understand a feature of JavaScript known as hoisting. Detail
    of this feature is out of the scope of this series, but we will rely on assigning
    functions to variables at this time.


    ## Functions and Variable scope


    Variables that are defined within a function with the var statement are only available
    from within this function, and this is usually desirable, and therefore all variables
    in the program must be declared using var phrases unless intended to make them
    global (i.e. available through the entire program and anywhere in it). This is
    not usually what we want unless we want to change the value of the variable from
    another script.


    But what does it mean for the variables to be available only within the function?
    Try this program:


    Warning: Wrong script


    var myFunction = function () {


      var foo = ''bar'';


    };


    myFunction ();


    log (typeof foo); // Print undefined!


    If we had tried in the previous example to use the value of foo outside the function
    (instead of just examining its type), we would have told the browser that there
    was an error, and the program would not continue to work below the location where
    we used foo.


    The following example shows how two different variables can exist in one name
    as long as both are located in a separate domain from the other. In this example
    we declare the variable foo and assign it the value ''qux'', then declare another
    variable in a function, and we call it foo as well, and we assign the value ''bar''
    to it. Note that the foo variable outside the function does not change even after
    we create the foo variable inside the function.


    var foo = ''qux'';


    var myFunction = function () {


      var foo = ''bar'';


    };


    log (foo); // print ''qux''


    myFunction ();


    log (foo); // ''qux'' is also printed


    Although the two variables share one name, JavaScript considers them two completely
    different things, and this is one of several reasons why you should give your
    variables expressive names.


    The range of variables is a core concept in JavaScript, and it may cause some
    confusion for beginners. remember:


        In the vast majority of cases, declare the variables with the phrase var


        Variables imposed within a function with the var statement cannot be accessed
    from outside this function


        Variables that are enforced without a var syn are always generic


    Note that variables declared without the word var are implicit in general. In
    the following example we have the variable a available outside of the function
    because it is defined without the word var (this is undesirable in most cases).


    Warning: insecure script


    function test () {


      a = 1;


    }


    test ();'
