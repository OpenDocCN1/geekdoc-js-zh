    \ (success, err);\n```\n\n## .pipe()\n\n我们可以使用 `.pipe()` 函数通过修改并返回一个新的延迟对象，来承诺对遗失的值做出响应。\n\
    \n`.then()` 函数从 jQuery 1.8 版本开始工作，`.pipe()` 函数也可以工作。\n\n```javascript\nfunction\
