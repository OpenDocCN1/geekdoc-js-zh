                .add ($ stickyInsct) .css ({left: 0});


            }


        },


    // Function 4: calcAllowance ()


    // Purpose: Return value of calculated allowance


         calcAllowance = function () {


             var a = 0;


             // Get sum of height of last three rows


             $ t.find (''tbody tr: lt (3)''). each (function () {


                 a + = $ (this) .height ();


             });


             // Set fail safe limit (last three row might be too tall)


             // Set arbitrary limit at 0.25 of viewport height, or you can use an
    arbitrary pixel value


             if (a> $ w.height () * 0.25) {


                a = $ w.height () * 0.25;


            }


            // Add height of sticky header itself


            a + = $ sticky.height ();


            return a;


        };


    }


    Now we are going to explain what we did in the fourth function, we do not want
    the head of the table to append us to the bottom of the table, it is not necessary
    and may cover us the last line of the table, so it is necessary to keep an empty
    space at the bottom.


    According to what I tried, I discovered that we don''t need the header of the
    table when we get to the last 3 lines of the table because our focus has shifted
    to the content now.


    $ t.find (''tbody tr: lt (4)''). each (function () {


        allowance + = $ (this) .height ();


    });


    ## Step 5: Connect everything


    Now that we have finished defining all the necessary functions, all that remains
    is to link the event handlers with the $ window window.


        When the DOM is ready, we make the initial calculations for the presentation.


        When you hold all of the information we calculate the dimensions again, this
    step is important because your table may contain objects carrying after the DOM
    such as images and web fonts.


        When scrolling in the main container but this will happen if the content is
    greater than the width of the container, then we want to reposition the main column.


        When the browser window is minimized, we want to recalculate the view.


        When going down in the browser we want to change the header of the table.


    What we have just said can be summarized in the following code. Note that miniaturization
    and scrolling events are controlled with the addition of throttle + debounce.


    // # 1: DOM when ready


    setWidths ();


    // # 2: We monitor the container in the event of a pass in it


    $ t.parent (''. sticky-wrap''). scroll ($. throttle (250, function () {


        repositionStickyHead ();


        repositionStickyCol ();


    }));


    // Now we link what we made to the $ (window) element


    $ w


    // # 3: When all the contents are loaded


    .load (setWidths)


    // # 4: When the window is minimized'
