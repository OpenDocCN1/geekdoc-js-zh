      <link rel = "stylesheet" href = "css / style.css" type = "text / css" />


      <! - include jQuery library and other javascripts ->


      <script src = "https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js">
    </script>


      <script src = "js / jquery.scrollTo.js"> </script>


      <script src = "js / jquery.localscroll.js"> </script>


      <script src = "js / custom-scripts.js"> </script>


    </head>


    <body>


      <div id = "slideshow">


        <! - List of slider images ->


        <ul>


          <li id ​​= "slide1"> <img src = "images / slide1.jpg" alt = "Slide 1" />
    </li>


          <li id ​​= "slide2"> <img src = "images / slide2.jpg" alt = "Slide 2" />
    </li>


          <li id ​​= "slide3"> <img src = "images / slide3.jpg" alt = "Slide 3" />
    </li>


          <li id ​​= "slide4"> <img src = "images / slide4.jpg" alt = "Slide 4" />
    </li>


          <li id ​​= "slide5"> <img src = "images / slide5.jpg" alt = "Slide 5" />
    </li>


        </ul>


      </div>


      <div id = "slideshow-nav">


        <! - Navigation list of slider images ->


        <ul>


          <li> <a href="#slide1"> Slide 1 </a> </li>


          <li> <a href="#slide2"> Slide 2 </a> </li>


