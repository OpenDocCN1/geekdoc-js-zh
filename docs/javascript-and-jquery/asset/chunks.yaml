- fmt: "\n# JavaScript basics and common errors committed by beginners\n\n(You can\
    \ skip this part)\n\nJQuery is built on Javascript, which is rich and powerful\
    \ in itself. This lesson covers the basics of JavaScript, and some common mistakes\
    \ that beginners make. This lesson benefits newcomers to the programming world,\
    \ and also benefits programmers in other languages who have not previously learned\
    \ about the distinctive aspects of JavaScript.\n\nHere is a simple JavaScript\
    \ program that adds a message to a webpage:\n\n```javascript\n// Create a tag\
    \ to greet someone\n\n// I base it on the variable 'greet'\nvar greet = function\
    \ (person, message) {\n  var greeting = 'Hello,' + person + '!';\n  log (greeting\
    \ + '' + message);\n};\n\n// Use the function to greet Jory, by passing its name\
    \ and the greeting message\ngreet ('Jory', 'Welcome to JavaScript');\n\n// Use\
    \ the function to greet Rebecca, by passing its name and a different message\n\
    greet ('Rebecca', 'Thanks for joining us');\n```\n\nNote: In the previous example,\
    \ we used the `log` function. It is an auxiliary function available in the examples\
    \ in this series only, and not automatically available in JavaScript, `log` can\
    \ be used in the script editor in this series, but you will need to use its `console.log`\
    \ to replace it in the scripts outside the string, and then the text results will\
    \ be printed to the end of the browser that You use it.\n\n```javascript\n// create\
    \ a function that will greet a person,\n// and assign the function to the `greet`\
    \ variable\nvar greet = function (person, message) {\n  var greeting = 'Hello,'\
    \ + person + '!';\n  log (greeting + '' + message);\n};\n\n// use the function\
    \ to greet Jory, passing in her\n// name and the message we want to use\ngreet\
    \ ('Jory', 'Welcome to JavaScript');\n\n// use the function to greet Rebecca,\
    \ passing in her\n// name and a different message\ngreet ('Rebecca', 'Thanks for\
    \ joining us');\n```\n\nThe previous example displays the result of executing\
    \ the script within the Console section. You can reset the example using the Clear\
    \ button and then edit the text if you wish to try and re-execute it by clicking\
    \ Run. It's okay if some things seem incomprehensible now. In the following paragraphs\
    \ we will look at concepts of variables, functions and other basic components\
    \ of JavaScript.\n\n## Note on comments\n\nComments are useful for explaining\
    \ what each piece of script does, and comments do not affect the program at all.\
    \ Some programmers like a lot of comments in their programs, while others prefer\
    \ to write them only when some parts of the text are obscure and not easily clarified.\n\
    \nJavaScript allows two types of comments: single-line and multi-line, the first\
    \ form begins with the letters `//`; the second begins with the two characters\
    \ `/*` and ends with `*/`.\n\n```javascript\n// This is a single-line comment\n\
    var foo;\n\n/*\n  This is a multiline comment\n  It can span more than one line,\
    \ you see.\n*/\n```\n\nYou can also use multi-line comments embedded within a\
    \ line of script:\n\n```javascript\nfunction cornify (unicorns /* * integer *\
    \ /, rainbows / * integer * /) {\n\n}\n```\n\n## The core components of JavaScript\n\
    \n### Variables\n\nVariables are the way we store values that we want to use at\
    \ a later time. Variables can be of several types of text, numbers, or other data\
    \ such as arrays and objects, or even code scripts (in a significant way stored\
    \ in a variable). The variable is declared with the `var` statement:\n\n```javascript\n\
    var myName = 'Rebecca';\n```\n\nAny variable name can be chosen provided that\
    \ the name does not start with a number and does not contain a minus sign \"-\"\
    .\n\nYou can declare one variable in each sentence:\n\n```javascript\nvar a =\
    \ 1;\nvar b = 'two';\n```\n\nOr declare several variables in one sentence by separating\
    \ them with Latin commas:\n\n```javascript\nvar a = 1,\n    b = 'two';\n```\n\n\
    After assigning a value to a variable, this variable can be used to access the\
    \ value stored in it:\n\n```javascript\nlog (myName); // 'Rebecaa' prints\n```\n\
    \nVariables are a necessary component of adhering to the \"Don't Repeat Yourself\"\
    \ principle. If you want to use one value more than once, you most likely want\
    \ to store it in a variable.\n\nWe'll talk about the variables in more detail\
    \ in the next paragraph.\n\n### Functions\n\nFunctions are a key component of\
    \ JavaScript software because it provides a way to create small functions in the\
    \ program in an independent and structured part. For example, suppose a function\
    \ that combines two numbers:\n\n```javascript\nfunction (a, b) {\n    return a\
    \ + b;\n}\n```\n\nThis function takes two factors, `a` and `b`, then add them\
    \ together and then return the sum as a result of the function.\n\nThe previous\
    \ example is properly formulated JavaScript, but it does nothing at all, because\
    \ there is no way for us to ask this function to add any two numbers after. So\
    \ we have to find a way to call the function, and we can do that by assigning\
    \ it to a variable first:\n\n```javascript\nvar addTwoNumbers = function (a, b)\
    \ {\n  return a + b;\n}\n```\n\nWhat we did in the last example is that we took\
    \ an function expression and assigned it to a variable. We can now call this function\
    \ using the variable name:\n\n```javascript\nlog (addTwoNumbers (1, 1)); // Print\
    \ 2\n```\n\nAlternatively, we can use a function declaration to give our function\
    \ a name:\n\n```javascript\nfunction addTwoNumbers (a, b) {\n  return a + b;\n\
    }\n```\n\nBoth methods allow us to call our function in the same manner, but care\
    \ must be taken when adopting the last method for reasons explained by this post.\n\
    \nConclusion: Naming functions by declaring a function may lead to unexpected\
    \ results if you do not fully understand a feature of JavaScript known as hoisting.\
    \ Detail of this feature is out of the scope, but we will rely on assigning functions\
    \ to variables.\n\n### Functions and Variable scope\n\nVariables that are defined\
    \ within a function with the `var` statement are only available within this function,\
    \ and this is usually desirable unless intended to make them global (i.e. available\
    \ through the program). But what does it mean for variables to be available only\
    \ within the function? Try this program:\n\n```javascript\nWarning: Wrong script\n\
    var myFunction = function () {\n  var foo = 'bar';\n};\n\nmyFunction ();\n\nlog\
    \ (typeof foo); // Print undefined!\n```\n\nIf we had tried in the previous example\
    \ to use the value of `foo` outside the function (instead of just examining its\
    \ type), we would have told the browser that there was an error, and the program\
    \ would not continue below the location where we used foo.\n\nThe following example\
    \ shows how two different variables can exist in one name as long as both are\
    \ located in a separate domain from the other. In this example we declare the\
    \ variable `foo` and assign it the value `'qux'`, then declare another variable\
    \ in a function, and we call it `foo` as well, and we assign the value `'bar'`\
    \ to it. Note that the `foo` variable outside the function does not change even\
    \ after we create the `foo` variable inside the function.\n\n```javascript\nvar\
    \ foo = 'qux';\nvar myFunction = function () {\n  var foo = 'bar';\n};\n\nlog\
    \ (foo); // print 'qux'\n\nmyFunction ();\n\nlog (foo); // 'qux' is also printed\n\
    ```\n\nThe range of variables is a core concept in JavaScript, and it may cause\
    \ some confusion for beginners. remember:\n\n- In the vast majority of cases,\
    \ declare the variables with the phrase `var`\n- Variables imposed within a function\
    \ with the `var` statement cannot be accessed from outside this function\n- Variables\
    \ that are enforced without a `var` syn are always generic\n\nNote that variables\
    \ declared without the word `var` are implicit in general. In the following example\
    \ we have the variable `a` available outside of the function because it is defined\
    \ without the word `var` (this is undesirable in most cases).\n\n```javascript\n\
    Warning: insecure script\nfunction test () {\n  a = 1;\n}\n\ntest ();\n```\n"
