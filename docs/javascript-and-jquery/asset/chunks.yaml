- fmt: "\n```html\n<ul>\n  <li><a href=\"#slide5\"> Slide 5 </a></li>\n</ul>\n</div></body>\n\
    </html>\n```\n\nBy looking carefully at the codes above you will notice that the\
    \ HTML codes for your display pages start with `Doctype`, the title of the link\
    \ and a link to the CSS style file. After these three, you will find that to prepare\
    \ and run the slide show, a link has been added for the two previously mentioned\
    \ `LocalScroll` and `ScrollTo`, jQuery library and `script.js` file.\n\nThe HTML\
    \ codes responsible for creating the slideshow are also divided into two parts:\
    \ a `div` tag is defined as `slideshow` and another is `slideshow-nav`. It is\
    \ important to note here that the `div` tag identified by `slideshow` will contain\
    \ an unnumbered list of related images, and `li` tags contain identifiers that\
    \ are compatible with `slideshow-nav` links.\n\n# Now let's look at CSS styles\n\
    \n`css / style.css`\n\n```css\n#slideshow {/ * slider container css * /\n  width:\
    \ 800px;\n  height: 400px;\n  overflow: hidden;\n  margin: 50px auto 50px auto;\n\
    \  box-shadow: 0px 0px 50px # 333;\n  -moz-box-shadow: 0px 0px 50px # 333;\n \
    \ -webkit-box-shadow: 0px 0px 50px # 333;\n}\n\n#slideshow ul {/ * manage slider\
    \ scroll elements css * /\n  width: 4000px;\n  list-style: none;\n}\n\n#slideshow\
    \ ul li {\n  float: left;\n}\n```\n\nThe CSS styles above will convert the simple\
    \ look generated by HTML code into pages that look similar to the desired slideshow.\
    \ This is done starting with defining the height and width of these slides, also\
    \ specifying the dimensions to be exactly the same as the dimensions of the photo\
    \ slides. With all slides floating side by side, it is possible to define the\
    \ total width measurements for the unnumbered list up to4590px. The `overflow`\
    \ feature was also used to prevent multiple images from appearing entirely on\
    \ the page. All you need to do here is to simply set the `overflow` feature as\
    \ `overflow: scroll`, this setting allows slideshows to display even when there\
    \ is no JavaScript.\n\nA nice shade was added using the CSS3-box shadow as shown\
    \ below\n\n```css\n#slideshow-nav {/ * Slider navigation container css * /\n \
    \ width: 150px;\n  margin: 0 auto 100px auto;\n}\n\n#slideshow-nav ul {\n  list-style:\
    \ none;\n}\n\n#slideshow-nav ul li {\n  float: left;\n}\n\n#slideshow-nav ul li\
    \ a {/ * navigation styling css * /\n  display: block;\n  width: 20px;\n  height:\
    \ 20px;\n  float: left;\n  margin: 0 5px;\n  background: #fff;\n  text-indent:\
    \ -9999px;\n  border-radius: 50%;\n  -webkit-border-radius: 50%;\n  box-shadow:\
    \ 0px 0px 30px # 000;\n  -webkit-box-shadow: 0px 0px 30px # 000;\n}\n\n#slideshow-nav\
    \ ul li a:hover, #slideshow-nav ul li a.active {\n/ * hover and active navigation\
    \ css * /\n  background: # 333;\n}\n```\n\nWith a careful preview here, we will\
    \ notice that the `div` tag, which is defined as `slideshow-nav`, has been moved\
    \ to a position below the main section for the slide show. We also don't want\
    \ multiple buttons in the slide show that don't work when JavaScript functionality\
    \ is enabled. You can use `visibility: hidden` to hide these buttons by default,\
    \ which makes it possible to show them at a later time. You may also be interested\
    \ in knowing that the links for each navigation menu have been converted to circular\
    \ buttons with the help of `border-radius` in CSS3 with the default text offsets\
    \ from the screen by setting a negative value for `text-indent`.\n\nSo far, the\
    \ slide show works tangibly and without the need for JavaScript. There is only\
    \ a navigation bar that allows the user to move back and forth between different\
    \ images.\n\n# Finally, let's look at jQuery functions\n\n`js / custom-scripts.js`\n\
    \n```javascript\n$(document).ready(function () {\n  var slider = $(\"#slideshow\"\
    );\n  var slider_nav = $(\"#slideshow-nav\");\n  slider_nav.find(\"a [href = #\
    \ slide1]\").addClass(\"active\");\n  slider_nav.localScroll({\n    target: '#slideshow',\n\
    \    axis: 'x'\n  });\n  slider_nav.find(\"a\").click(function () {\n    slider_nav.find(\"\
    a\").removeClass(\"active\");\n    $(this).addClass(\"active\");\n  });\n});\n\
    ```\n\nIf you look at the code above, you will see that the slideshow CSS styles\
    \ have been changed from `overflow: scroll` to `overflow: hidden` to remove the\
    \ slider. After that the nav buttons are set to be visible with the `active` category\
    \ automatically added to the first button. Both extensions are also enabled: `LocalScroll`\
    \ and `ScrollTo`, in addition to applying `LocalScroll` functionality to slideshow.\n\
    \n## Chapter VII: 10 jQuery tricks that every designer should know\n\njQuery is\
    \ one of the most used, as it makes dealing with the document model easy. There\
    \ is no doubt the reason for the popularity of jQuery.\n\n### Back to top\n\n\
    ```javascript\n// Back to top\n$('a.top').click(function () {\n  $(document.body).animate({scrollTop:\
    \ 0}, 800);\n  return false;\n});\n```\n\n### Anchor tag Create a tag\n\n```html\n\
    <a class=\"top\" href=\"#\"> Back to top</a>\n```\n\nThe position of the scroll\
    \ bar can be changed by changing the `scrollTop`. In the example above we used\
    \ the value 0 because we wanted to go back to the top, but if we wanted an offset\
    \ of 100px this value could be included.\n\n### Check photos\n\n```javascript\n\
    $('img').load(function () {\n  console.log('image load success');\n});\n```\n\n\
    You can also verify that a specific image has been uploaded by replacing the tag\
    \ with ID or Class.\n\n### Correct photos automatically\n\n```javascript\n$('img').error(function\
    \ () {\n  $(this).attr('src', 'img / broken.png');\n});\n```\n\nSometimes there\
    \ is trouble in the image links on the site. It is difficult to change the links\
    \ manually. The above clip automatically replaces the damaged images which saves\
    \ a lot of problems.\n\n### Substitution of the variety when Hover\n\n```javascript\n\
    ('. btn').hover(function () {\n  $(this).addClass('hover');\n}, function () {\n\
    \  $(this).removeClass('hover');\n});\n```\n\nWe usually want to change the appearance\
    \ of clickable items on a web page when the cursor hovers around them, which is\
    \ exactly what the lines in the section above do; it adds an item to the item\
    \ when hovering around it and then removes the item when the user stops. All you\
    \ have to do is add the desired format into your CSS file.\n\n### Disable input\
    \ fields\n\n```javascript\n$('input [type = \"submit\"]').attr(\"disabled\", true);\n\
    ```\n\nYou may want to disable the submit button or input field until the user\
