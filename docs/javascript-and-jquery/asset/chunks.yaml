    You can rest assured if you don''t understand their exact meaning, because jQuery
    optimizes its exploitation so that you don''t have to go into its details; however,
    talking about objects and their functions is not complete without mentioning this
    and a little. I’ll leave you free to move to the “Objects in jQuery” section of
    this article if you like, then come back here when you feel ready to fully understand
    it.


    Let''s try to understand how this can be used in our job:


    var person = {


      firstName: ''Boaz'',


      lastName: ''Sender'',


      greet: function () {


        log (''Hi,'' + this.firstName);


      }


    };


    person.greet ();


