  trans: "\n\n```javascript\n$ ('li> a new list item! </li>') .appendTo ('# my-unordered-list');\n\
    ```\n\n## 结\n\n在这一部分，我们学习了监听用户与页面交互的不同方式，包括如何使用事件委托来提高将事件绑定到对象的效率。在下一节中，我们将学习如何使用\
    \ jQuery 的动态动效函数来移动元素。\n\n# 第四章\n\n# 使用 jQuery 移动页面\n\njQuery 让向页面添加动态动画效果变得非常简单，这些效果可以取决于初始设置或开发者指定的设置。你也可以从随机的\
    \ CSS 属性创建自定义动画。\n\n关于动画的一个重要说明：在现代浏览器中，使用 CSS 而非 JavaScript 执行动画更高效，尤其是在移动设备上。这些移动完成的细节不在链调用的范围内，但如果你针对的是支持\
    \ CSS 过渡的浏览器和移动设备，你可能希望在配置较低的设备上将 `jQuery.fx.off` 设置为 `true`；这将使移动失效，并直接访问待移动元素到达其\
    \ `Final` 状态，而不应用运动。\n\n## jQuery 包含的特效\n\n常用的动画作为函数附加到 jQuery 中，你可以在任何 jQuery\
    \ 对象上调用它们：\n\n- `.Show()`：显示选中的项目。\n- `.Hide()`：隐藏选中的项目。\n- `.FadeIn()`：将选中的透明度移动到\
    \ 100%。\n- `.FadeOut()`：将选中的对象的亮度移动到 0%。\n- `.SlideDown()`：通过垂直拖拽显示选中的元素。\n- `.SlideUp()`：通过垂直滑动隐藏选中的元素。\n\
    - `.SlideToggle()`：根据选中的项目是隐藏还是可见，通过垂直滑动隐藏或显示选中的项目。\n\n这些特效中的一个可以在创建后很容易应用到选择集：\n\
    \n```javascript\n$ ('.hidden') .show ();\n```\n\n尝试实验字段中的示例（务必在此示例及后续所有示例中点击 Run\
    \ with JS 按钮）\n\n你也可以定义上述特效的持续时间，有两种定义方式，第一种：设置毫秒级的时间：\n\n```javascript\n$ ('.hidden')\
    \ .show (300);\n```\n\n第二种是使用预定义的速度之一：\n\n```javascript\n$ ('.hidden') .show ('slow');\n\
    ```\n\n这些速度定义在 `jQuert.fx.speeds` 对象中，这意味着你可以修改它们来更改默认值，或者向其添加新速度：\n\n```javascript\n\
    // 重置已定义的速度\njQuery.fx.speeds.fast = 50;\n\n// 定义一个新速度\njQuery.fx.speeds.turtle\
    \ = 3000;\n\n// 因为我们更改了 'fast' 的值，这次移动将花费 50 毫秒\n$ ('.hidden') .hide ('fast');\n\
    \n// 我们可以使用自己定义的速度，就像之前定义的那些一样\n$ ('.other-hidden') .show ('turtle');\n```\n\n\
    开发者通常希望在移动结束后立即执行某些操作，如果尝试在移动结束之前执行，可能会导致移动失真和中断，或者无意中遗漏移动瞬间移动的元素。如果你希望在特效结束后执行命令，可以向移动函数传递一个回调函数，此调用内部表示应用于移动的原始\
    \ DOM 元素，并且像事件处理程序的函数一样，它可以被 `$()` 函数包裹以作为对象使用。jQuery：\n\n```javascript\n$ ('p.old')\
    \ .fadeOut (300, function () {\n  $ (this) .remove ();\n});\n```\n\n如果定义中不包含任何元素，则函数将不会被调用。如果你需要无论选择器中是否存在元素都调用该函数，可以创建一个处理这两种情况的函数：\n\
    \n```javascript\nvar oldElements = $ ('p.old');\nvar thingToAnimate = $ ('#nonexistent');\n\
    \n// 如果有显示的元素，此函数将作为 'show' 函数的备用调用；如果没有元素，我们直接调用它们。\nvar removeOldElements =\
    \ function () {\n  oldElements.remove ();\n};\n\nif (thingToAnimate.length) {\n\
    \  // 我们的任务将在移动结束后调用\n  thingToAnimate.show ('slow', removeOldElements);\n} else\
    \ {\n  removeOldElements ();\n}\n```\n\n## 使用 .animate () 自定义特效\n\n如果与 jQuery\
    \ 相关的移动不能满足你的需求，你可以使用 `.animate()` 函数根据多个 CSS 属性创建自定义移动（唯一的例外是：'color' 无法移动，但有一个插件允许这样做）。\n\
    \n`animate()` 函数接受最多三个参数：\n\n- 一个指定要移动属性的对象\n- 移动时间，单位为毫秒\n- 一个在移动完成后将被调用的函数\n\
    \n移动的值可以通过编写要移动的最终值，或编写必须移动的量（移动两个位置之间的差）来确定：\n\n```javascript\n$ ('.funtimes')\
    \ .animate ({\n  left: '+ = 50', // 增加 50\n  opacity: 0.25,\n  fontSize: '12px'\n\
    \  },\n  300,\n  function () {\n    // 移动结束时执行\n  }\n);\n```\n\n注意：如果你想移动名称包含\
    \ \"-\" 的 CSS 属性，必须将名称转换为驼峰命名法（camelCase）。例如，font-size 变为 `fontSize`。\n\n## 移动管理\n\
    \njQuery 提供了两个管理函数：\n\n- `.Stop()`：停止当前移动。\n- `.Delay()`：延迟启动（毫秒）。\n\n# 第五章\n\n\
    # 延迟对象\n\n## AJAX\n\nAJAX 是“异步 JavaScript 和 XML”的缩写，它是一种无需刷新页面即可从服务器检索数据的方法，基于名为\
    \ `XMLHttpRequest`（或 `XHR`）的对象向服务器发送请求并处理响应的数据。\n\njQuery 提供了多种方法的 `$ajax` 函数：一种是传递一个包含设置的对象，或者我们可以传递带设置的链接。让我们来看第一种方法：\n\
    \n```javascript\n// 创建当 AJAX 请求成功时执行的回调函数\nvar updatePage = function (resp) {\n\
    \  $ ('target'). html (resp [0] .name);\n};\n\n// 当失败时\nvar printError = function\
    \ (req, status, err) {\n  console.log ('something wrong', status, err);\n};\n\n\
    // 创建描述请求的 Settings 对象\nvar ajaxOptions = {\n  url: '/data/people.json',\n  dataType:\
    \ 'json',\n  success: updatePage,\n  error: printError\n};\n\n// 发送请求\n$ .ajax\
    \ (ajaxOptions);\n```\n\n当然，你可以直接将字面量对象传递给 `$ajax()` 函数并使用匿名成功错误函数，这种方法编写更容易，未来的维护也更容易：\n\
    \n```javascript\n$ .ajax ({\n  url: '/data/people.json',\n  dataType: 'json',\n\
    \  success: function (resp) {\n    $ ('target'). html (resp [0] .name);\n  },\n\
    \  error: function (req, status, err) {\n    console.log ('something wrong', status,\
    \ err);\n  }\n});\n```\n\n正如我们所说，你可以通过第二种方式使用 `$ajax()` 函数，先传递链接，后传递 Settings\
    \ 对象（不是强制的）。如果你希望使用初始任务设置，或者想对多个链接使用同一个设置对象，这将非常用：\n\n```javascript\n$ .ajax ('data/people.json',\
    \ {\n  type: 'GET',\n  dataType: 'json',\n  success: function (resp) {\n    console.log\
    \ (resp.people);\n  },\n  error: function (req, status, err) {\n    console.log\
    \ ('something wrong', status, err);\n  }\n});\n```\n\n"
- fmt: "\nIn the previous example, the function requires only the link, but adding\
    \ the `Settings` object allows us to tell jQuery what type of data we send, what\
    \ HTTP verb we use (`POST`, `GET`, etc. ...), and what type of data we expect\
    \ to receive from the server, and what What to do if the request succeeds or fails\
    \ ...\n\nSee the job documentation `$.ajax()` to read all of the options that\
    \ can be added to the settings object.\n\n## A in AJAX means \"asynchronous\"\n\
    \nAJAX requests are executed asynchronously, which means that the `$.ajax` function\
    \ ends before the request ends, and before the success function is called, meaning\
    \ that the return statement is executed before the answer to the request arrives.\
    \ The `getSomeData` function in the following example will return the data value\
    \ before it is defined, which results in an error:\n\nWarning: invalid script\n\
    \n```javascript\nvar getSomeData = function () {\n  var data;\n  $.ajax ({\n \
    \   url: '/data/people.json',\n    dataType: 'json',\n    success: function (resp)\
    \ {\n      data = resp.people;\n    }\n  });\n  return data;\n}\n$('#target').html(getSomeData().people[0].name);\n\
    ```\n\n## X in AJAX means JSON!\n\nThe term AJAX was introduced in 2005 to describe\
    \ a method for retrieving data from the server without requiring a full page reload.\
    \ At that time, the most common form of data sent by servers was XML, and today,\
    \ JSON is the format adopted by most modern applications.\n\nBasically, JSON is\
    \ a string that represents data, and looks very similar to a regular JavaScript\
    \ object, but it cannot represent all kinds of data that a JavaScript object can\
    \ represent. For example: JSON cannot represent `Date` objects or functions. Here\
    \ is an example of a JSON text, note how all property names are enclosed in double\
    \ quotes:\n\n```json\n{\"people\": [\n  {\n    \"name\": \"Ben\",\n    \"url\"\
    : \"http://benalman.com/\",\n    \"bio\": \"I create groovy websites, useful jQuery\
    \ plugins, and play a mean funk bass. I'm also Director of Pluginization at @bocoup.\"\
    \n  },\n  {\n    \"name\": \"Rebecca\",\n    \"url\": \"http://rmurphey.com\"\
    ,\n    \"bio\": \"Senior JS dev at Bocoup\"\n  },\n  {\n    \"name\": \"Jory\"\
    ,\n    \"url\": \"http://joryburson.com\",\n    \"bio\": \"super-enthusiastic\
    \ about open web education @bocoup. lover of media, art, and fake mustaches.\"\
    \n  }\n]}\n```\n\nRemember that JSON is a text representation of an object, which\
    \ means that the text string must be interpreted to convert it into a regular\
    \ JavaScript object before working with it. When you work with a JSON-formatted\
    \ response from the server, jQuery does this for you. But it is important to distinguish\
    \ between actual beings and how they are represented in JSON.\n\nNote: If you\
    \ want to create a JSON text string from a JavaScript object or interpret a JSON\
    \ text string to convert it into a JavaScript object without the use of jQuery,\
    \ modern browsers offer the functions `JSON.stringify()` and `JSON.parse()`, and\
    \ these properties can be added to Old browsers using `json2.js` library. JQuery\
    \ also provides the `jQuery.parseJSON()` function, which corresponds to the `JSON.parse()`\
    \ function in browsers, but it does not provide a function that corresponds to\
    \ `JSON.stringify()`.\n\n## Short functions\n\nIf all we want is to send a simple\
    \ request, without being concerned with dealing with any errors that may occur,\
    \ jQuery provides short functions that allow us to do so. Each abbreviated function\
    \ receives a link and a non-mandatory settings object, and a function is called\
    \ only upon successful request:\n\n```javascript\n$.get('/data/people.html', function\
    \ (html) {\n  $('#target').html(html);\n});\n\n$.post('/data/save', {name: 'Rebecca'},\
    \ function (resp) {\n  console.log(resp);\n});\n```\n\n## Submit data and work\
    \ with forms\n\nWe can send data with our request to set a value for the data\
    \ in the settings object, or pass an object as a second parameter to the shortcuts.\n\
    \nThis data will be added to the link in the GET requests as a query string, while\
    \ in the POST requests it will be sent as form data. JQuery provides a useful\
    \ function `.serialize()` that receives form entries and converts them to a query\
    \ syntax (such as `field1name = field1value & field2name = field2value ...`):\n\
    \n```javascript\n$('form').submit(function (event) {\n  event.preventDefault();\n\
    \  var form = $(this);\n  $.ajax ({\n    type: 'POST',\n    url: '/data/save',\n\
    \    data: form.serialize(),\n    dataType: 'json',\n    success: function (resp)\
    \ {\n      console.log(resp);\n    }\n  });\n});\n```\n\n## JqXHR\n\n`$.ajax()`\
    \ and its associated shortcuts, return the `jqXHR` (abbreviation for jQuery XML\
    \ HTTP Request) which contains many useful functions. We can send a request using\
    \ `$.ajax()` and then save the `jqXHR`:\n\n```javascript\nvar req = $.ajax ({\n\
    \  url: '/data/people',\n  dataType: 'json'\n});\n```\n\nWe can send a request\
    \ using `$.ajax()` and then save the `jqXHR`:\n\n```javascript\nvar success =\
    \ function (resp) {\n  $('#target').append('people:' + resp.people.length);\n\
    };\nvar err = function (req, status) {\n  $('#target').append('<p> something went\
    \ wrong</p>');\n};\n\nreq.then(success, err);\n\nreq.then(function () {\n  $('#target').append('<p>\
    \ it worked</p>');\n});\n```\n\n## JSONP\n\nMany beginners in JavaScript are surprised\
    \ by the failure of the XHR requests that they send to another domain. For example:\
    \ Some developers try to fetch data from a third-party API, to be surprised by\
    \ the failure of the request.\n\nThe reason for this is that browsers do not allow\
    \ XHR requests to be sent to other domains for security reasons, but some APIs\
    \ return data in JSONP format (short for JSON with Padding), which allows developers\
    \ to fetch data bypassing the browser block.\n\nThe truth is that JSONP is not\
    \ actually an AJAX request, as it does not use the XHR request provided by the\
    \ browser, but rather works by inserting a `<script>` tag in the web page, which\
    \ in turn contains the required data, surrounded by a function that returns this\
