  trans: "\n\n注意：当使用使用 `.trigger()` 触发事件时，你仅调用在 JavaScript 中生成的事件处理器，而不会触发事件的默认行为。例如，如果点击事件影响了链接（`<a>`\
    \ 元素），浏览器将不会跳转到 `href` 属性中分配给它的链接（尽管你可以编写实现此目的的命令）。\n\n在你将事件绑定到对象后，你可以使用 `.off()`\
    \ 函数取消订阅，该函数会移除任何与此事件相关的线程（处理器）：\n\n```javascript\n$('li') .off ('click');\n```\n\
    \n## 将事件限制在命名空间内\n\n`.on()` 提供的优势之一是将事件限制在“命名空间（namespace）”。你可能会疑惑这是否有必要。例如，假设你想为一个元素关联某些事件，然后移除其中的一些线程，你可以像我们在上一个段中所做的那样\n\
    \n警告：不推荐这种软件风格\n\n```javascript\n$('li') .on ('click', function () {\n  console.log\
    \ ('a list item was clicked');\n});\n\n$('li') .on ('click', function () {\n \
    \ registerClick ();\n  doSomethingElse ();\n});\n\n$('li') .off ('click');\n```\n\
    \n然而，这种方法将移除所有菜单项的所有点击线程，而这并不是我们想要的。如果你绑定了一个限制在命名空间的事件处理器，你可以精确地针对它：\n\n```javascript\n\
    $('li') .on ('click.logging', function () {\n  console.log ('a list item was clicked');\n\
    });\n\n$('li') .on ('click.analytics', function () {\n  registerClick ();\n  doSomethingElse\
    \ ();\n});\n\n$('li') .off ('click.logging');\n```\n\n这种方法不会影响与使用统计页面相关的点击事件，但会移除与日志相关的点击事件。\n\
    \n我们可以使用触发功能来触发特定事件：\n\n```javascript\n$('li') .trigger ('click.logging');\n```\n\
    \n## 同时连接多个事件\n\n`.on()` 提供的另一个功能是同时链接多个事件的能力。例如，假设你想在用户滚动页面或更改窗口大小时执行某个特定命令。该函数允许你将两个事件放在一个字符串字符串中并用空格分隔，随后跟上你想要处理这两个事件的函数：\n\
    \n```javascript\n$('input [type = \"text\"]') .on ('focus blur', function () {\n\
    \  console.log ('The user focused or blurred the input');\n});\n\n$(window) .on\
    \ ('resize.foo scroll.bar', function () {\n  console.log ('The window has been\
    \ resized or scrolled!');\n});\n```\n\n## 传递命名事件的函数\n\n在我们之前的所有示例中，我们一直传递未知函数作为事件的触发器，但我们可以在传递之前先创建一个函数并将其存储在变量中，然后将此变量作为事件处理器。如果你想使用同一个函数来处理不同的事件或来自不同元素的事件，这将非常用：\n\
    \n```javascript\nvar handleClick = function () {\n  console.log ('something was\
    \ clicked');\n};\n\n$('li') .on ('click', handleClick);\n\n$('h1') .on ('click',\
    \ handleClick);\n```\n\n## 事件对象\n\n每当事件触发时，处理事件的函数都会接收一个参数，即遵循所有浏览器约定标准的事件对象。该对象有很多有用的属性，包括：\n\
    \n```javascript\n$(document) .on ('click', function (event) {\n  console.log (event.type);\
    \ // 事件类型，如：\"click\"\n  console.log (event.which); // 被按下的按钮或按键\n  console.log\
    \ (event.target); // 事件源自元素\n  console.log (event.pageX); // 鼠标在 X 轴的位置\n  console.log\
    \ (event.pageY); // 鼠标在 Y 轴的位置\n});\n```\n\n## 在回调内部\n\n当你指定事件的运行函数时，该函数可以访问启动事件的原始\
    \ DOM 元素作为函数的上下文，如果你想使用 jQuery 来操作事件，请将其封装在 `$` 中：\n\n```javascript\n$('input')\
    \ .on ('keydown', function (event) {\n  // this: 触发事件的原始元素\n  // event: 事件对象\n\
    \  // 如果按下删除键，将背景颜色改为红色，否则改为绿色\n  $(this) .css ('background', event.which ===\
    \ 8? 'red': 'green');\n});\n```\n\n## 防止默认行为\n\n有时你可能希望防止事件的默认行为，例如想使用 AJAX 点击链接，而不是启动全页重加载（这是默认行为）。许多开发者通过在事件回调中返回\
    \ `false` 来实现这一目标，但此有另一个副作用：它还会阻止事件的冒泡（我们稍后会解释），这可能会产生不理想的结果。防止事件默认行为正确的方法是在事件对象上调用\
    \ `.preventDefault()`：\n\n```javascript\n$('input') .on ('keydown', function (event)\
    \ {\n  // this: 触发事件的原始元素\n  // event: 事件对象\n  // 如果按下删除键，将背景颜色改为红色，否则改为绿色\n \
    \ $(this) .css ('background', event.which === 8? 'red': 'green');\n});\n```\n\n\
    ## 事件冒泡\n\n考虑以下代码：\n\n```javascript\n$('a') .on ('click', function (event) {\n\
    \  // 防止默认事件。\n  event.preventDefault ();\n  // 记录发生了什么。\n  console.log ('I was\
    \ just clicked!');\n});\n```\n\n此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。此文本链接在手中点击页面上的所有元素（你不应该这样做）。\n\
    \n## 事件委托\n\n“事件冒泡”的概念允许我们实现“事件委托”的想法，即与高层元素关联事件，然后发现其中的任何子元素。例如，我们可以将事件绑定到无序列表，然后确定哪些元素触发了事件：\n\
    \n```javascript\n$('# my-unordered-list') .on ('click', function (event) {\n \
    \ console.log (event.target); // 记录触发事件的元素\n});\n```\n\n当然，如果菜单项包含子项目，情况会变得复杂，因此\
    \ jQuery 提供了一个辅助函数，允许我们确定感兴趣的元素，同时将事件与高层元素关联：\n\n```javascript\n$('# my-unordered-list')\
    \ .on ('click', 'li', function (event) {\n  console.log (this); // 列出触发事件的菜单项\n\
    });\n```\n\n事件委托有两个好处：第一个是与决定为单个元素绑定事件相比，它允许链接更少的事件触发器，这显著提升了页面性能。第二个好处是允许我们将事件与父元素（例如示例中的无序列表）关联，并确保即使父元素的内容发生，事件也会被触发。\n\
    \n例如，此文本在事件委托到父元素后添加了新的菜单项，点击此元素将按预期方式触发事件，而无需绑定任何新事件：\n\n```javascript\n$('#\
    \ my-unordered-list') .on ('click', 'li', function (event) {\n  console.log (this);\
    \ // 注册被点击的菜单项\n});\n```\n\n"
- fmt: "\n```javascript\n$ ('li> a new list item! </li>') .appendTo ('# my-unordered-list');\n\
    ```\n\n## Conclusion\n\nIn this part, we learned the different ways to listen\
    \ to a user’s interaction with our page, including how to use delegation to improve\
    \ the efficiency of linking events to objects. In the next section, we’ll learn\
    \ how to move elements using jQuery's dynamic effects functions.\n\n# Chapter\
    \ IV\n\n# Move the page with jQuery\n\nJQuery makes adding dynamic animation effects\
    \ to the page very easy, and these effects can depend on the initial settings\
    \ or settings set by the developer. You can also create custom animations from\
    \ random CSS properties.\n\nAn important note about animations: Performing animations\
    \ using CSS instead of JavaScript is more efficient in modern browsers, especially\
    \ on mobile devices. Details of the completion of these movements are outside\
    \ the scope of the chain, but if you are targeting browsers and mobile devices\
    \ that support CSS transactions, you may want to set the `jQuery.fx.off` setting\
    \ to `true` on devices with weak specifications; this would nullify the movements\
    \ and access the element to be moved to its state `Final` directly without applying\
    \ motion.\n\n## Effects included with jQuery\n\nFrequently used animations are\
    \ attached to jQuery as functions that you can call on any jQuery object:\n\n\
    - `.Show()`: Show the selected items.\n- `.Hide()`: Hide the selected items.\n\
    - `.FadeIn()`: Move the selected opacity to 100%.\n- `.FadeOut()`: Move the highlight\
    \ of the selected objects to 0%.\n- `.SlideDown()`: Display the selected elements\
    \ with a vertical drag.\n- `.SlideUp()`: Hide the selected elements with a vertical\
    \ swipe.\n- `.SlideToggle()`: Hide or show selected items with a vertical swipe,\
    \ depending on whether the selected items are hidden or visible.\n\nOne of these\
    \ effects is easy to apply to the selection after it is created:\n\n```javascript\n\
    $ ('.hidden') .show ();\n```\n\nTry the example in the experiment field (be sure\
    \ to press the Run with JS button in this example and all of the following examples)\n\
    \nYou can also define the duration of the previous effects, and there are two\
    \ ways to define them, the first: setting the time in milliseconds:\n\n```javascript\n\
    $ ('.hidden') .show (300);\n```\n\nThe second is to use one of the predefined\
    \ speeds:\n\n```javascript\n$ ('.hidden') .show ('slow');\n```\n\nThese speeds\
    \ are defined in the `jQuert.fx.speeds` object, which means you can modify them\
    \ to change the default values, or add new speeds to it:\n\n```javascript\n//\
    \ Reset a defined speed\njQuery.fx.speeds.fast = 50;\n\n// Define a new speed\n\
    jQuery.fx.speeds.turtle = 3000;\n\n// Since we changed the value of 'fast', this\
    \ movement will take 50 milliseconds\n$ ('.hidden') .hide ('fast');\n\n// We can\
    \ use the speeds that we knew for ourselves, just like those that were previously\
    \ defined\n$ ('.other-hidden') .show ('turtle');\n```\n\nOften the developer wants\
    \ to do something immediately after the movement ends, if he tries to do it before\
    \ the movement ends, it may cause the movement to be distorted and interrupted,\
    \ or it may inadvertently omit elements that move at the moment of movement. You\
    \ can pass a callback to the movement functions if you wish to execute a command\
    \ after the effect ends, and this inside this call indicates the raw DOM element\
    \ to which the movement was applied, and, like the functions of the event handler,\
    \ this can be surrounded by the `$()` function to use as an object. jQuery:\n\n\
    ```javascript\n$ ('p.old') .fadeOut (300, function () {\n  $ (this) .remove ();\n\
    });\n```\n\nIf the definition does not contain any elements, the function will\
    \ not be called. If you need to call the function regardless of the presence or\
    \ absence of the elements in the specification, you can create a function that\
    \ deals with the two conditions:\n\n```javascript\nvar oldElements = $ ('p.old');\n\
    var thingToAnimate = $ ('#nonexistent');\n\n// This function will be the back-up\
    \ call for the 'show' function if there are elements that we want to show, if\
    \ there are no elements, we call them directly by ourselves.\nvar removeOldElements\
    \ = function () {\n  oldElements.remove ();\n};\n\nif (thingToAnimate.length)\
    \ {\n  // Our job will be called up after the movement ends\n  thingToAnimate.show\
    \ ('slow', removeOldElements);\n} else {\n  removeOldElements ();\n}\n```\n\n\
    ## Custom effects using .animate ()\n\nIf the movements associated with jQuery\
    \ do not meet your need, you can use the `.animate()` function to create custom\
    \ movements based on multiple CSS properties (one of the exceptions: the 'color'\
    \ that cannot be moved, but an add-on that allows).\n\nThe function `animate()`\
    \ accepts up to three factors:\n\n- An object that specifies the properties to\
    \ be moved\n- Movement time, in milliseconds\n- A function that will be called\
    \ upon completion of the movement\n\nThe value of the movement can be determined\
    \ by writing the final value to be moved, or writing the amount that must be moved\
    \ (the difference between the two positions of the movement):\n\n```javascript\n\
    $ ('.funtimes') .animate ({\n  left: '+ = 50', // Increase by 50\n  opacity: 0.25,\n\
    \  fontSize: '12px'\n  },\n  300,\n  function () {\n    // Executed when the movement\
    \ ends\n  }\n);\n```\n\nNote: If you want to move a CSS property whose name contains\
    \ the \"-\", you must convert the name to camelCase. For example, font-size becomes\
    \ `fontSize`.\n\n## Movement management\n\nJQuery provides two important management\
    \ functions:\n\n- `.Stop()`: stops current movements.\n- `.Delay()`: delay the\
    \ start of the next (in milliseconds).\n\n# Chapter V\n\n# Introduced to Deferred\
    \ Objects\n\n## AJAX\n\nAJAX is an abbreviation for \"asynchronous JavaScript\
    \ and XML\", which is a way to retrieve data from the server without having to\
    \ reload the page, and it is based on using an object named `XMLHttpRequest` (or\
    \ `XHR`) to send the request to the server and then deal with the data that responds\
    \ to it.\n\nJQuery provides the `$ajax` function in several methods: one is to\
    \ pass it an object that contains only the settings, or we can pass the link with\
    \ or without the settings object. Let's look at the first method:\n\n```javascript\n\
    // Create a callback function that will be executed when the AJAX request succeeds\n\
    var updatePage = function (resp) {\n  $ ('#target'). html (resp.people [0] .name);\n\
    };\n\n// And when it fails\nvar printError = function (req, status, err) {\n \
    \ console.log ('something wrong', status, err);\n};\n\n// Create the Settings\
    \ object that describes the request\nvar ajaxOptions = {\n  url: '/data/people.json',\n\
    \  dataType: 'json',\n  success: updatePage,\n  error: printError\n};\n\n// send\
    \ the request\n$ .ajax (ajaxOptions);\n```\n\nOf course, you can pass a literal\
    \ object directly to the `$ajax()` function and use an unknown success and error\
    \ function, this method is easier to write, and its maintenance in the future\
    \ is easier:\n\n```javascript\n$ .ajax ({\n  url: '/data/people.json',\n  dataType:\
    \ 'json',\n  success: function (resp) {\n    $ ('#target'). html (resp.people\
    \ [0] .name);\n  },\n  error: function (req, status, err) {\n    console.log ('something\
    \ wrong', status, err);\n  }\n});\n```\n\nAs we said, you can use the `$ajax()`\
    \ function in a second way, by passing the link first and then the Settings object\
    \ second (not mandatory). This is useful if you want to use the initial job settings\
    \ or if you want to use the same settings object for more than one link:\n\n```javascript\n\
    $ .ajax ('data/people.json', {\n  type: 'GET',\n  dataType: 'json',\n  success:\
    \ function (resp) {\n    console.log (resp.people);\n  },\n  error: function (req,\
    \ status, err) {\n    console.log ('something wrong', status, err);\n  }\n});\n\
    ```\n"
  raw: "$ ('<li> a new list item! </li>') .appendTo ('# my-unordered-list');\n\n##\
    \ Conclusion\n\nIn this part, we learned the different ways to listen to a user’s\
    \ interaction with our page, including how to use delegation to improve the efficiency\
    \ of linking events to objects. In the next section, we’ll learn how to move elements\
    \ using jQuery's dynamic effects functions.\n\n# Chapter IV\n\n# Move the page\
    \ with jQuery\n\nJQuery makes adding dynamic animation effects to the page very\
    \ easy, and these effects can depend on the initial settings or settings set by\
    \ the developer. You can also create custom animations from random CSS properties.\n\
    \nAn important note about animations: Performing animations using CSS instead\
    \ of JavaScript is more efficient in modern browsers, especially on mobile devices.\
    \ Details of the completion of these movements are outside the scope of the chain,\
    \ but if you are targeting browsers and mobile devices that support CSS transactions,\
    \ you may want to set the jQuery.fx.off setting to true on devices with weak specifications;\
    \ this would nullify the movements and access the element to be moved to its state\
    \ Final directly without applying motion.\n\n## Effects included with jQuery\n\
    \nFrequently used animations are attached to jQuery as functions that you can\
    \ call on any jQuery object:\n\n-    .Show (): Show the selected items.\n\n-   \
    \ .Hide (): Hide the selected items.\n\n-    .FadeIn (): Move the selected opacity\
    \ to 100%.\n\n-    .FadeOut (): Move the highlight of the selected objects to\
    \ 0%.\n\n-    .SlideDown (): Display the selected elements with a vertical drag.\n\
    \n-    .SlideUp (): Hide the selected elements with a vertical swipe.\n\n-   \
    \ .SlideToggle (): Hide or show selected items with a vertical swipe, depending\
    \ on whether the selected items are hidden or visible.\n\nOne of these effects\
    \ is easy to apply to the selection after it is created:\n\n$ ('.hidden') .show\
    \ ();\n\nTry the example in the experiment field (be sure to press the Run with\
    \ JS button in this example and all of the following examples)\n\nYou can also\
    \ define the duration of the previous effects, and there are two ways to define\
    \ them, the first: setting the time in milliseconds:\n\n$ ('.hidden') .show (300);\n\
    \nThe second is to use one of the predefined speeds:\n\n$ ('.hidden') .show ('slow');\n\
    \nThese speeds are defined in the jQuert.fx.speeds object, which means you can\
    \ modify them to change the default values, or add new speeds to it:\n\n// Reset\
    \ a defined speed\n\njQuery.fx.speeds.fast = 50;\n\n// Define a new speed\n\n\
    jQuery.fx.speeds.turtle = 3000;\n\n// Since we changed the value of 'fast', this\
    \ movement will take 50 milliseconds\n\n$ ('.hidden') .hide ('fast');\n\n// We\
    \ can use the speeds that we knew for ourselves, just like those that were previously\
    \ defined\n\n$ ('.other-hidden') .show ('turtle');\n\nOften the developer wants\
    \ to do something immediately after the movement ends, if he tries to do it before\
    \ the movement ends, it may cause the movement to be distorted and interrupted,\
    \ or it may inadvertently omit elements that move at the moment of movement. You\
    \ can pass a callback to the movement functions if you wish to execute a command\
    \ after the effect ends, and this inside this call indicates the raw DOM element\
    \ to which the movement was applied, and, like the functions of the event handler,\
    \ this can be surrounded by the $ () function to use as an object. jQuery:\n\n\
    $ ('p.old') .fadeOut (300, function () {\n\n  $ (this) .remove ();\n\n});\n\n\
    If the definition does not contain any elements, the function will not be called.\
    \ If you need to call the function regardless of the presence or absence of the\
    \ elements in the specification, you can create a function that deals with the\
    \ two conditions:\n\nvar oldElements = $ ('p.old');\n\nvar thingToAnimate = $\
    \ ('#nonexistent');\n\n// This function will be the back-up call for the 'show'\
    \ function if there are elements that we want to show, if there are no elements,\
    \ we call them directly by ourselves.\n\nvar removeOldElements = function () {\n\
    \n  oldElements.remove ();\n\n};\n\nif (thingToAnimate.length) {\n\n // Our job\
    \ will be called up after the movement ends\n\n  thingToAnimate.show ('slow',\
    \ removeOldElements);\n\n} else {\n\n  removeOldElements ();\n\n}\n\n## Custom\
    \ effects using .animate ()\n\nIf the movements associated with jQuery do not\
    \ meet your need, you can use the .animate () function to create custom movements\
    \ based on multiple CSS properties (one of the exceptions: the 'color' that cannot\
    \ be moved, but an add-on that allows).\n\nThe function (animate () accepts up\
    \ to three factors:\n\n-    An object that specifies the properties to be moved\n\
    \n-    Movement time, in milliseconds\n\n-    A function that will be called upon\
    \ completion of the movement\n\nThe value of the movement can be determined by\
    \ writing the final value to be moved, or writing the amount that must be moved\
    \ (the difference between the two positions of the movement):\n\n$ ('.funtimes')\
    \ .animate ({\n\nleft: '+ = 50', // Increase by 50\n\n    opacity: 0.25,\n\n   \
    \ fontSize: '12px'\n\n  },\n\n  300,\n\n  function () {\n\n    // Executed when\
    \ the movement ends\n\n  }\n\n);\n\nNote: If you want to move a CSS property whose\
    \ name contains the \"-\" sign, you must convert the name to camelCase format\
    \ first if you do not want to enclose the name of the quotation marks. For example,\
    \ the font-size property becomes fontSize.\n\n## Movement management\n\nJQuery\
    \ provides two important movement management functions:\n\n -   .Stop (): stops\
    \ current movements on the selected items.\n\n-    .Delay (): delay the start\
    \ of the next motion by the amount passed to it (in milliseconds).\n\n# Chapter\
    \ V\n\n# Introduced to AJAX and Deferred Objects on jQuery\n\n## AJAX\n\nAJAX\
    \ is an abbreviation for \"asynchronous JavaScript and XML\", which is a way to\
    \ retrieve data from the server without having to reload the page, and it is based\
    \ on using an available object in the browser named XMLHttpRequest (or XHR abbreviation)\
    \ to send the request to the server and then deal with the data that responds\
    \ to it The server.\n\nJQuery provides the $ .ajax (and other accompanying abbreviated\
    \ functions) to facilitate work with XHR requests in all browsers.\n\n## $ .Ajax\n\
    \nWe can use the $ .ajax () function that is included with jQuery in several methods:\
    \ one is to pass it to an object that contains only the settings, or we can pass\
    \ the link with or without the settings object. Let's look at the first method:\n\
    \n// Create a callback function that will be executed when the AJAX request succeeds\n\
    \nvar updatePage = function (resp) {\n\n  $ ('#target'). html (resp.people [0]\
    \ .name);\n\n};\n\n// And when it fails\n\nvar printError = function (req, status,\
    \ err) {\n\n  console.log ('something went wrong', status, err);\n\n};\n\n// Create\
    \ the Settings object that describes the request\n\nvar ajaxOptions = {\n\n  url:\
    \ '/data/people.json',\n\n  dataType: 'json',\n\n  success: updatePage,\n\n  error:\
    \ printError\n\n};\n\n// send the request\n\n$ .ajax (ajaxOptions);\n\nOf course,\
    \ you can pass a literal object directly to the $ .ajax () function and use an\
    \ unknown success and error function, this method is easier to write, and its\
    \ maintenance in the future is easier:\n\n$ .ajax ({\n\n  url: '/data/people.json',\n\
    \n  dataType: 'json',\n\n  success: function (resp) {\n\n    $ ('#target'). html\
    \ (resp.people [0] .name);\n\n  },\n\n  error: function (req, status, err) {\n\
    \n    console.log ('something went wrong', status, err);\n\n  }\n\n});\n\nAs we\
    \ said, you can use the $ .ajax () function in a second way, by passing the link\
    \ first and then the Settings object second (not mandatory). This is useful if\
    \ you want to use the initial job settings or if you want to use the same settings\
    \ object for more than one link:\n\n$ .ajax ('/data/people.json', {\n\n  type:\
    \ 'GET',\n\n  dataType: 'json',\n\n  success: function (resp) {\n\n    console.log\
    \ (resp.people);\n\n  },\n\n  error: function (req, status, err) {\n\n    console.log\
    \ ('something went wrong', status, err);\n\n  }\n\n});"
