    \ of jQuery's work; in the next chapter we will show how we can apply this information\
    \ to get real things done!\n\n# Chapter II\n\n# Jquery learn page navigation and\
    \ editing functions in jQuery\n\nJQuery provides powerful tools to find the item\
    \ or elements you want on the page, then work with these elements to reach the\
    \ desired result. With its tools, jQuery makes it easier for processes to be more\
