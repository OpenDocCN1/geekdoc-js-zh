    // 我们现在正在处理菜单项\n.addClass ('special')\n.end ()\n// 我们现在回到了同一个列表\n.addClass ('super-special');\n\
    ```\n\n`.end()` 函数可以让你轻松在一句话中进行许多调整，但这种方法并不会提高脚本的清晰度，它就像是在不喘气地讲故事。出于这个原因，我不建议你过度使用它。在大多数情况下，它会让脚本变得更难以阅读、维护和修订。\n\
    \n这里是解决同一个问题的更优方案：\n\n```javascript\nvar list = $ (\n'# my-unordered-list');\n\
    var listItems = list.find ('li');\nlistItems.addClass ('special');\nlist.addClass\
    \ ('super-special');\n```\n\n如果你想将原始选择添加到当前选择中，JQuery 还提供了 `.addBack()` 函数。例如：\n\
    \n```javascript\n$ ('li.special')\n.siblings ()\n// 我们现在正在处理上一个选择的兄弟元素\n.removeClass\
    \ ('important')\n.addBack ()\n// 现在我们同时处理原始菜单项及其兄弟元素\n.addClass ('urgent');\n\
    ```\n\n你觉得困惑吗？`.addBack()` 函数在缺点上与 `.end()` 函数相似，因为两者（如果使用它们）都会增加脚本的复杂性。最好的解决方案是使用\
