  trans: "\n在 JavaScript 中处理数字有时会得到意料之外的结果，这是由于 JavaScript 内部表示数字的方式导致的，例如：当两个小数相加时，结果是一个非常接近预期值的数字，但它并不完全相等：\n\
    \n```\nlog (0.0001 + 0.0002); // 0.00030000000000000003\n```\n\n在处理 jQuery 时你可能不会遇到这种情况，但当你处理像货币之类的小数时，这是一个你应该注意的重要问题。在执行需要完全准确的计算时，你必须在处理之前将值转换为整数，完成后后再转换回小数。\n\
    \nJavaScript 容忍不同的类型。当使用非数值进行计算时，JavaScript 不会报错，相反，它会以你可能意想不到的结果继续执行过程：\n\n```javascript\n\
    log ('a' + 2); // 'a2'\nlog ('4' + 3); // '43'\nlog ('five' - '4'); // NaN (不是数字)\n\
    log (- '1'); // -1\nlog (1 + true); // 2\nlog (1 == true); // true\nlog (1 ===\
    \ true); // false\n```\n\n# 第一章\n\n# jQuery 基础\n\njQuery 使得处理浏览器后的 HTML 页面内容变得简单，并提供了工具帮助你跟踪用户与页面交互、移动元素以及在不刷新页面的情况下与服务器通信。我们很快就会解释这些工具。让我们先从\
    \ jQuery 的基础开始，以及如何使用它的主要功能：访问页面上的特定元素并对其进行操作。\n\n注意：本章假设你熟悉 HTML 基础和 CSS 选择标记。如果你不熟悉如何使用\
    \ CSS 选择标记访问页面的特定元素，在继续本章之前必须先学习这些。\n\n## 这个符号是什么：$？\n\njQuery 库提供了 `jQuery` 函数，允许你使用\
    \ CSS 选择标记定义元素。\n\n```javascript\nvar listItems = jQuery ('li');\n```\n\n如果你以前读过使用\
    \ jQuery 的软件，你一定熟悉这个：\n\n```javascript\nvar listItems = $ ('li');\n```\n\n正如我们在上部分（JavaScript\
    \ 基础）中讨论的，在 JavaScript 中几乎名称都是有效的，除非它们以数字开头或包含 \"-\" 符号。因此，最后一个示例中的名称 `$` 只是 `jQuery`\
    \ 函数的简短名称，如果你查看 jQuery 的源码，你会在末尾附近看到：\n\n```javascript\n// 将 jQuery 暴露给全局对象\n\
    window.jQuery = window. $ = jQuery;\n```\n\n当你调用 `$()` 函数并向其传递参数时，你会得到一个新的 jQuery\
    \ 对象。JavaScript 中的函数是其他对象，这意味着 `$`（当然也包括 `jQuery`）函数也有属性和方法。例如：你可以使用 `$.support`\
    \ 特来查找当前浏览器支持哪些功能，可以使用 `$.ajax` 函数来发送 AJAX 请求。\n\n注意：从现在起，我们将在系列中使用 `$` 代替 `jQuery`\
    \ 以尽量缩短长度。请注意，如果你的页面包含多个一个库，名称 `$` 可能会被另一个库占用，从而导致 jQuery 无法工作。如果你遇到此类问题，请在加载其他库之前尝试使用\
    \ `jQuery.noConflict`。\n\n### `$(document).ready()`\n\n在用 jQuery 在页面上执行任何操作之前，我们需要确保页面已处于内容可以修改的状态。在\
    \ jQuery 中，可以通过将我们的程序封装在一个函数内，然后将此函数传递给 `$(document).ready()` 来完成。如下示例所示，我们传递的函数可以是匿名的（无名称）：\n\
    \n```javascript\n$(document).ready (function () {\n  console.log ('ready!');\n\
    });\n```\n\n这将在文档（页面）准备绪后调用我们传递给 `.ready()` 的函数。这里发生了什么？我们使用 `$(document)` 从页面上的文档创建一个\
    \ jQuery 对象，然后在该对象上调用函数 `.ready()`，并传递了我们想要执行的函数。\n\n由于你会发现自己反复重写这段文字，jQuery 提供了一种简便方法，因为当向\
    \ `$()` 函数传递函数而不是 CSS 参数时，它执行不同的任务，并表现为 `$(document)` 函数的备用名称：\n\n```javascript\n\
    $(function () {\n  console.log ('ready!');\n});\n```\n\n注意：从现在起，我们假设本系列中的文本都由\
    \ `$(document).ready(function () {...});` 包裹，为了简洁起见我们将省略该短语。\n\n## 访问元素\n\n使用\
    \ jQuery 最简单的方法是选择某些元素并对其进行某些操作。如果你理解 CSS 参数，你会发现访问某些元素是简单的：你只需要向 `$()` 传递适当的参数。\n\
    \n```javascript\n$ ('#header'); // 指定标识为 'header' 的元素\n$ ('li'); // 选择页面上所有的列表项\n\
    $ ('ul li'); // 选择无序列表中的所有列表项\n$('.person'); // 选择所有类为 'person' 的元素\n```\n\n重要点是，任何选择都只包含在你做出选择时存在的选择器对应元素，这意味着如果你输入\
    \ `var anchors = $('a');` 然后稍后向页面添加 `<a>` 元素，`Anchors` 将不包含该新项。\n\n## 创建 jQuery\
    \ 对象的其他方法\n\n除了向 `$()` 函数传递选择器外，可以通过其他方式创建 jQuery 对象：\n\n```javascript\n// 从 DOM\
    \ 元素创建 jQuery 对象\n$ (document.body.children [0]);\n\n// 从 DOM 元素创建 jQuery 对象\n\
    $ ([window]);\n\n// 选择 DOM 元素\nvar firstBodyChild = document.body.children [0];\n\
    \n// 创建选择中的元素\nvar paragraph = $ ('p');\n```\n\n## 选择是否包含元素？\n\n有时你想在选择匹配一个或多个元素时执行某些命令，但\
    \ `$()` 函数始终返回 jQuery 对象，而该对象始终为真（truthy），所以你应该检查选择的内容以是否包含任何元素。\n\n```javascript\n\
    if ($ ('nonexistent')) {\n  // 错误！这里的命令将始终执行！\n}\n\nif ($ ('nonexistent').length>\
    \ 0) {\n  // 正确！这里的命令将不会执行\n}\n```\n\n我们可以根据 0 是一个假值（falsy）来进一步简化这种检查：\n\n```javascript\n\
    if ($ ('nonexistent').length) {\n  // 只有当找到对象时，这里才会执行\n}\n```\n\n## 从选择中访问项目\n\
    \n如果你需要处理选择中的原始 DOM 元素，你必须从 jQuery 对象访问该元素。例如，假设你想直接访问 `<input>` 对象的值属性，你需要操作原始\
    \ DOM 元素：\n\n```javascript\nvar listItems = $ ('li');\nvar rawListItem = listItems\
    \ [0]; // 或者 listItems.get (0)\nvar html = rawListItem.innerHTML;\n```\n\n注意你不能在原始\
    \ DOM 元素上调用 jQuery 函数。以下示例将不起：\n\n```javascript\nvar listItems = $ ('li');\nvar\
    \ rawListItem = listItems [0];\nvar html = rawListItem.html (); // 对象 <HTMLInputElement>\
    \ 没有方法 'html'\n```\n\n如果你想处理选择中的单个元素并对其使用 jQuery 函数，你必须使用 `.eq()` 函数从它创建一个新的 jQuery\
    \ 对象，并传递你想要的元素索引：\n\n```javascript\nvar listItems = $ ('li');\nvar secondListItem\
    \ = listItems.eq (1);\nsecondListItem.remove ();\n```\n\n## 创建新对象\n\n`$` 函数有最后一个第三角色：创建新元素。如果你将\
    \ HTML 片段传递给 `$()`，它将在内存中创建一个新对象，这意味着除非你手动操作，否则该对象不会被添加到页面。\n\n```javascript\n\
    $ ('<p>'); // 创建没有内容的 <p> 元素\n$ ('<p> Hello! </p>'); // 创建带有文本的 <p> 元素\n```\n"
