    \ this chapter we will look at some (but not all) of the page navigation and modification\
    \ functions in jQuery. Before we begin, we must understand some of the necessary\
    \ terms. Let's say we have the following HTML text:\n\n```html\n<ul>\n  <li>\n\
    \    <span>\n      <i> Foo. </i>\n    </span>\n  </li>\n  <li> Bar </li>\n</ul>\n\
    ```\n\nWe say from the first list item (`<li>`) that he is the child of the unordered\
    \ list (`<ul>`).\n\nWe say about the unordered list (`<ul>`) that it is the parent\
    \ of the two elements of the list.\n\nWe say on the `<span>` element that he descended\
    \ from the unordered list.\n\nWe say about the unsorted list that it is an ancestor\
    \ of everything inside it.\n\nWe say about the two menu items that they are siblings.\n\
    \n## Traversal\n\nJQuery allows us to navigate through the HTML elements that\
    \ make up our page. We first create an initial selection, and then we go through\
    \ the DOM from there. As we walk through the DOM, we change from our first selection\
    \ and add or delete some elements from it, or sometimes replace it with another\
    \ entirely.\n\n## Filter selections\n\nYou can filter an existing selection to\
    \ include only elements that match specific criteria. For example, you can filter\
    \ in one of the following ways:\n\n```javascript\nvar listItems = $('li');\n\n\
    // The selection row contains only items of 'special'\nvar special = listItems.filter('.special');\n\
    \n// The selection row contains only non-special elements\nvar notSpecial = listItems.not('.special');\n\
    \n// The selection row contains only elements that include span\nvar hasSpans\
    \ = listItems.has('span');\n```\n\nIt is important to know that the `.not()` function\
    \ is not the opposite of `.is()` because `.is()` returns a Boolean (true or false)\
    \ value, while `.not()` returns a new jQuery object.\n\n## Find items starting\
    \ with a selection\n\nAn initial selection can be useful as a basis for creating\
    \ additional selections. If you have a selection that contains a single menu item,\
    \ for example, and you want to deal with its “siblings” or with the unordered\
    \ list that it contains, you can create a new selection based on the existing\
    \ selection easily:\n"
