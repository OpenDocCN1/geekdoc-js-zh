    \ and then do something with them. If you understand the CSS parameters, you will\
    \ find that accessing some elements is straightforward: you only need to pass\
    \ the appropriate parameter to $ ().\n\n$ ('#header'); // specify the element\
    \ identifying 'header'\n\n$ ('li'); // Select all menu items on the page\n\n$\
    \ ('ul li'); // Select all of the menu items in unordered lists\n\n$ ('.person');\
    \ // select all elements of class 'person'\n\nIt is important to understand that\
    \ any selection made will only include the corresponding elements of the selector\
    \ that were present at the moment you made the selection, meaning that if you\
    \ type var anchors = $ ('a'); then you add an <a> element to the page later, Anchors\
    \ will not contain the new item.\n\n## Other ways to create a jQuery object\n\n\
    In addition to passing a simple selector to the $ () function, jQuery objects\
    \ can be created in other ways:\n\n// Create a jQuery object from the DOM element\n\
    \n$ (document.body.children [0]);\n\n// Create a jQuery object from a list of\
    \ DOM elements\n\n$ ([window, document]);\n\n// Select the DOM element context\n\
    \nvar firstBodyChild = document.body.children [0];\n\n$ ('li', firstBodyChild);\n\
    \n// Make the selection within a previous selection\n\nvar paragraph = $ ('p');\n\
    \n$ ('a', paragraph);\n\n## Does your selection contain any elements?\n\nSometimes\
    \ you want to execute some commands when your selection matches only one or more\
    \ elements, but the $ () function always returns the jQuery object, and that object\
    \ is always truthy, so you should check the content of the selection to see if\
    \ it contains any elements.\n\nWarning: invalid script\n\nif ($ ('#nonexistent'))\
    \ {\n\n  // Error! Orders here will always be executed!\n\n}\n\nif ($ ('#nonexistent')\
    \ .length> 0) {\n\n // Right! The commands will not be executed here unless the\
    \ page contains an object that is defined as 'nonexistent'.\n\n}\n\nWe can shorten\
    \ this check further depending on whether 0 is a false value (falsy):\n\nif ($\
    \ ('#nonexistent') .length) {\n\n // Orders will only be executed here if a matching\
    \ object is found\n\n}\n\n## Access individual items from a selection\n\nIf you\
    \ need to work with a raw DOM element from a selection, you must access this element\
    \ from the jQuery object. For example, suppose you want to access the value attribute\
    \ of the <input> object directly, then you need to manipulate the raw DOM element:\n\
    \nvar listItems = $ ('li');\n\nvar rawListItem = listItems [0]; // or listItems.get\
    \ (0)\n\nvar html = rawListItem.innerHTML;\n\nNote that you cannot call jQuery\
    \ functions on raw DOM elements. The following example will not work:\n\nWarning:\
    \ invalid script\n\nvar listItems = $ ('li');\n\nvar rawListItem = listItems [0];\n\
    \nvar html = rawListItem.html ();\n\n// Object # <HTMLInputElement> has no method\
    \ 'html'\n\nIf you want to work with a single element in a selection and want\
    \ to use jQuery functions with it, you must create a new jQuery object from it\
    \ using the .eq () function, and pass the element directory that you want:\n\n\
    var listItems = $ ('li');\n\nvar secondListItem = listItems.eq (1);\n\nsecondListItem.remove\
    \ ();\n\n## Create new objects\n\nThe $ function has a final third role: creating\
    \ new elements. If you pass the HTML snippet to $ (), it will create a new object\
    \ in memory, meaning that the object is created but not added to the page until\
    \ you do it yourself.\n\n$ ('<p>'); // Creates a <p> element with no content\n\
    \n$ ('<p> Hello! </p>'); // Create a <p> element with text"
