  trans: "\n\n在之前的示例中，该函数只需要链接，但添加 `Settings` 对象允许我们告诉 jQuery 我们发送什么类型的数据、使用什么种 HTTP\
    \ 动词（`POST`、`GET` 等）、以及我们期望从服务器接收什么类型的数据，以及请求成功或失败时应该做什么……\n\n请参阅 `$.ajax()` 文档以阅读可以添加到设置对象中的所有选项。\n\
    \n## AJAX 中的 A 意味着“异步”\n\nAJAX 请求是异步执行的，这意味着 `$.ajax` 函数在请求结束之前就会结束，并且在成功回调函数被调用之前结束，这意味着\
    \ `return` 语句在请求响应到达之前就已经执行了。以下示例中的 `getSomeData` 函数将在数据被定义之前返回该值，这将导致错误：\n\n\
    警告：无效脚本\n\n```javascript\nvar getSomeData = function () {\n  var data;\n  $.ajax\
    \ ({\n    url: '/data/people.json',\n    dataType: 'json',\n    success: function\
    \ (resp) {\n      data = resp.people;\n    }\n  });\n  return data;\n}\n$('#target').html(getSomeData().people[0].name);\n\
    ```\n\n## AJAX 中的 X 意味着 JSON！\n\nAJAX 术语于 2005 年引入，描述一种不需要重新加载整个页面即可从服务器检索数据的方法。当时，服务器发送的最常见数据格式是\
    \ XML，而今天，JSON 是大多数现代应用程序采用的格式。\n\n基本上，JSON 是一个表示数据的字符串，看起来与普通的 JavaScript 对象非常相似，但它不能表示\
    \ JavaScript 对象可以表示的所有类型的数据。例如：JSON 无法表示 `Date` 对象或函数。这是一个 JSON 文本的示例，注意所有的属性名都包含在双引号中：\n\
    \n```json\n{\"people\": [\n  {\n    \"name\": \"Ben\",\n    \"url\": \"http://benalman.com/\"\
    ,\n    \"bio\": \"I create groovy websites, useful jQuery plugins, and play a\
    \ mean funk bass. I'm also Director of Pluginization at @bocoup.\"\n  },\n  {\n\
    \    \"name\": \"Rebecca\",\n    \"url\": \"http://rmurphey.com\",\n    \"bio\"\
    : \"Senior JS dev at Bocoup\"\n  },\n  {\n    \"name\": \"Jory\",\n    \"url\"\
    : \"http://joryburson.com\",\n    \"bio\": \"super-enthusiastic about open web\
    \ education @bocoup. lover of media, art, and fake mustaches.\"\n  }\n]}\n```\n\
    \n记住，JSON 是对象的文本表示，这意味着在使用之前必须对文本字符串进行解释以将其转换为普通的 JavaScript 对象。当你处理来自服务器的 JSON\
    \ 格式响应时，jQuery 会替你完成这一操作。但区分实际实体与它们在 JSON 中的表示方式是非常重要的。\n\n注意：如果你想从 JavaScript\
    \ 对象创建 JSON 文本字符串，或者在不使用 jQuery 的情况下解释 JSON 文本字符串以将其转换为 JavaScript 对象，现代浏览器提供了\
    \ `JSON.stringify()` 和 `JSON.parse()` 函数，并且可以使用 `json2.js` 库将这些属性添加到旧版浏览器中。JQuery\
    \ 还提供了 `jQuery.parseJSON()` 函数，它对应于浏览器中的 `JSON.parse()` 函数，但它没有提供对应 `JSON.stringify()`\
    \ 的函数。\n\n## 短函数\n\n如果我们只是想发送一个简单的请求，而不关心处理可能发生的任何错误，jQuery 提供了允许我们这么做的短函数。每个简写函数都接收一个链接和一个可选的设置对象，并且只有在请求成功时才会调用回调函数：\n\
    \n```javascript\n$.get('/data/people.html', function (html) {\n  $('#target').html(html);\n\
    });\n\n$.post('/data/save', {name: 'Rebecca'}, function (resp) {\n  console.log(resp);\n\
    });\n```\n\n## 提交数据和处理表单\n\n我们可以通过请求发送数据来为设置对象中的数据赋值，或者将对象作为第二个参数传递给快捷函数。\n\n\
    这些数据将在 GET 请求中作为查询字符串添加到链接中，而在 POST 请求中将作为表单数据发送。jQuery 提供了一个实用的 `.serialize()`\
    \ 函数，它可以接收表单并并转换为查询语法（如 `field1name = field1value & field2name = field2value ...`）：\n\
    \n```javascript\n$('form').submit(function (event) {\n  event.preventDefault();\n\
    \  var form = $(this);\n  $.ajax ({\n    type: 'POST',\n    url: '/data/save',\n\
    \    data: form.serialize(),\n    dataType: 'json',\n    success: function (resp)\
    \ {\n      console.log(resp);\n    }\n  });\n});\n```\n\n## JqXHR\n\n`$.ajax()`\
    \ 及其相关的快捷函数返回 `jqXHR`（jQuery XML HTTP Request 的缩写），它包含了许多实用函数。我们可以使用 `$.ajax()`\
    \ 发送请求并保存 `jqXHR`：\n\n```javascript\nvar req = $.ajax ({\n  url: '/data/people',\n\
    \  dataType: 'json'\n});\n```\n\n我们可以使用 `$.ajax()` 发送请求并保存 `jqXHR`：\n\n```javascript\n\
    var success = function (resp) {\n  $('#target').append('people:' + resp.people.length);\n\
    };\nvar err = function (req, status) {\n  $('#target').append('<p> something went\
    \ wrong</p>');\n};\n\nreq.then(success, err);\n\nreq.then(function () {\n  $('#target').append('<p>\
    \ it worked</p>');\n});\n```\n\n## JSONP\n\n许多初学者对发送到其他域的 XHR 请求失败感到惊讶。例如：某些开发者尝试从第三方\
    \ API 获取数据，结果对请求失败感到惊讶。\n\n原因是出于安全考虑，浏览器不允许向其他域发送 XHR 请求，但某些 API 以 JSONP 格式（JSON\
    \ Padding 的缩写）返回数据，这允许开发者绕过限制。\n\n事实是，JSONP 并不是 AJAX 请求，因为它不使用浏览器提供的 XHR 请求，而是通过在网页中插入\
    \ `<script>` 标签工作的，该标签包含所需的数据，并由一个在调用时返回这些数据的函数包裹。细节现在并不重要，因为 jQuery 允许你通过在 `Settings`\
    \ 对象中将 `dataType` 设置为 `'jsonp'` 来像 XHR 一样请求 JSONP。\n\n```javascript\n$.ajax ({\n\
    \  url: '/data/search.jsonp',\n  data: {q: 'a'},\n  dataType: 'jsonp',\n  success:\
    \ function (resp) {\n    $('#target').html('Results:' + resp.people.length);\n\
    \  }\n});\n```\n\n注意：接口通常提供一个选项来指定链接地址中包裹数据的函数。这通常是回调参数的名字，也是 jQuery 最初预期的，但你可以通过在传递给\
    \ `$.ajax()` 的设置对象中设置 `jsonp` 值来更改它。\n\n你也可以使用简写的 `$.getJSON()` 函数发送 JSONP 请求，jQuery\
    \ 可以通过链接中存在 `callback =?` 或类似的内容来区分它：\n\n```javascript\n$.getJSON('/data/search.jsonp?q=a&callback=?',\
    \ function (resp) {\n  $('#target').html('Results:' + resp.people.length);\n});\n\
    ```\n\n"
- fmt: "\nAnother cross-asset resource sharing (or CORS) option is to allow cross-asset\
    \ requests. However, it is not supported in older browsers, it also requires a\
    \ special configuration on the server and the modification of application headers\
    \ in XHR to work.\n\n## Deferred objects\n\nThe `jqXHR` objects we have identified\
    \ are nothing but a special \"flavor\" of what is known as \"deferred organisms\"\
    . JQuery allows you to create deferred objects on your own, which can be used\
    \ to facilitate dealing with asynchronous commands. It provides a way to respond\
    \ to a process that runs asynchronously after its success or failure, and avoids\
    \ the need to write interlaced callbacks between them.\n\n## $.Deferred\n\nYou\
    \ can create a delayed object with `$.Deferred()`. In the following example we\
    \ implement a function inside `setTimeout`, then \"deny\" our promise to return\
    \ the value that this function returns. We return a promise, an object to which\
    \ recalls can be attached, but it does not affect the outcome of the deferred\
    \ object itself. We can \"reject\" a promise if something goes wrong while the\
    \ function is working:\n\n```javascript\nfunction doSomethingLater (fn, time)\
    \ {\n  var dfd = $.Deferred ();\n  setTimeout (function () {\n    dfd.resolve\
    \ (fn ());\n  }, time || 0);\n  return dfd.promise ();\n}\n\nvar promise = doSomethingLater\
    \ (function () {\n  console.log ('This function will be called in 100ms');\n},\
    \ 100);\n```\n\n## .then(), .done(), .fail(), and .always()\n\nWe can link functions\
    \ that handle errors and successes with promises, just as in `jqXHR` objects:\n\
    \n```javascript\nfunction doSomethingLater (fn, time) {\n  var dfd = $.Deferred\
    \ ();\n  setTimeout (function () {\n    dfd.resolve (fn ());\n  }, time || 0);\n\
    \  return dfd.promise ();\n}\n\nvar success = function (resp) {\n  $ ('#target')\
    \ .html ('it worked');\n};\n\nvar err = function (req, status, err) {\n  $ ('#target')\
    \ .html ('it failed');\n};\n\nvar dfd = doSomethingLater (function () {/*/* ...\
    \ * /}, 100);\n\ndfd.then (success, err);\n```\n\n## .pipe()\n\nWe can use the\
    \ `.pipe()` function to make promises to respond to the lost value by modifying\
    \ it and then returning a new delayed object.\n\nThe `.then()` function works\
    \ from jQuery version 1.8 and the `.pipe()` function works.\n\n```javascript\n\
    function doSomethingLater (fn, time) {\n  var dfd = $.Deferred ();\n  setTimeout\
    \ (function () {\n    dfd.resolve (fn ());\n  }, time || 0);\n  return dfd.promise\
    \ ();\n}\n\nvar dfd = doSomethingLater (function () {return 1;}, 100);\n\ndfd\n\
    \  .pipe (function (resp) {return resp + '' + resp;})\n  .done (function (upperCaseResp)\
    \ {\n    $ ('#target') .html (upperCaseResp);\n  });\n```\n\n## Dealing with operations\
    \ that may be asynchronous\n\nSometimes we have a job that may work simultaneously\
    \ or not simultaneously according to specific circumstances, for example: a function\
    \ that performs an asynchronous operation the first time it is called, and then\
    \ stores the value that the process produced to return it directly when called\
    \ in the future. In this case, we can use `$.when()` to respond to both cases:\n\
    \n```javascript\nfunction maybeAsync (num) {\n  var dfd = $.Deferred ();\n  //\
    \ Promise a hold back when num === 1\n  if (num === 1) {\n    setTimeout (function\
    \ () {\n      dfd.resolve (num);\n    }, 100);\n    return dfd.promise ();\n \
    \ }\n  // End immediately, returning num\n  return num;\n}\n\n// This will be\
    \ done asynchronously and promise to return 1\n$ .when (maybeAsync (1)) .then\
    \ (function (resp) {\n  $ ('#target') .append ('<p>' + resp + '</p>');\n});\n\n\
    // This will return 0 directly\n$ .when (maybeAsync (0)) .then (function (resp)\
    \ {\n  $ ('#target') .append ('<p>' + resp + '</p>');\n});\n```\n\nYou can also\
    \ pass more than one parameter to `$.when()`, which allows you to combine concurrent\
    \ and asynchronous operations together and then get the results of all of them\
    \ executed as parameters of the callback:\n\n```javascript\nfunction maybeAsync\
    \ (num) {\n  var dfd = $.Deferred ();\n  // Make a delayed promise when num ===\
    \ 1\n  if (num === 1) {\n    setTimeout (function () {\n      dfd.resolve (num);\n\
    \    }, 100);\n    return dfd.promise ();\n  }\n  // End it directly, otherwise,\
    \ returning num\n  return num;\n}\n\n$ .when (maybeAsync (0), maybeAsync (1))\n\
    \  .then (function (resp1, resp2) {\n    var target = $ ('#target');\n    target.append\
    \ ('<p>' + resp1 + '</p>');\n    target.append ('<p>' + resp2 + '</p>');\n  });\n\
    ```\n\nWhen a parameter of `$.when()` is a `jqXHR` object, we get an array:\n\n\
    ```javascript\nfunction maybeAsync (num) {\n  var dfd = $.Deferred ();\n  // Make\
    \ a delayed promise when num === 1\n  if (num === 1) {\n    setTimeout (function\
    \ () {\n      dfd.resolve (num);\n    }, 100);\n    return dfd.promise ();\n \
    \ }\n  // End it directly, otherwise, returning num\n  return num;\n}\n\n$ .when\
    \ (maybeAsync (0), maybeAsync (1))\n  .then (function (resp1, resp2) {\n    var\
    \ target = $ ('#target');\n    target.append ('<p>' + resp1 + '</p>');\n    target.append\
    \ ('<p>' + resp2 + '</p>');\n  });\n```\n\n## Create a Slideshow with jQuery\n\
    \nHere's a look at the structure:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Sliding-enabled slideshow |\
    \ Tutorials</title>\n  <meta name=\"description\" content=\"Sliding-enabled slideshow\
    \ demo\">\n  <!-- include to stylesheet -->\n  <link rel=\"stylesheet\" href=\"\
    css/style.css\" type=\"text/css\" />\n  <!-- include library and other javascripts\
    \ -->\n  <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js\"\
    ></script>\n  <script src=\"js/scrollTo.js\"></script>\n  <script src=\"js/localscroll.js\"\
    ></script>\n  <script src=\"js/custom-scripts.js\"></script>\n</head>\n<body>\n\
    \  <div id=\"slideshow\">\n    <!-- List of slider images -->\n    <ul>\n    \
