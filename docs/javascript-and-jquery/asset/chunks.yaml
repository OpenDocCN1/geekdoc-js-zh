  trans: "\n\n```html\n<<ul>\n  <li><a href=\"#slide5\"> 第 5 张幻灯片 </a></li>\n</ul>\n\
    </div></body>\n</html>\n```\n\n通过仔细观察上面的代码，你会注意到用于你显示页面的 HTML 代码是以是以 `Doctype`、链接标题以及指向\
    \ CSS 样式文件的链接作为开头的。在这三者之后，你会发现为了准备和运行幻灯片，已经添加了之前提到的 `LocalScroll` 和 `ScrollTo`、jQuery\
    \ 库以及 `script.js` 文件的链接。\n\n负责创建幻灯片的 HTML 代码也分为两个部分：一个 `div` 标签被定义为 `slideshow`，另一个是\
    \ `slideshow-nav`。这里需要注意的是，标识为 `slideshow` 的 `div` 标签将包含一个包含相关图片的无序列表，而 `li` 标签包含与\
    \ `slideshow-nav` 链接兼容的标识符。\n\n# 现在让我们来看 CSS 样式\n\n`css / style.css`\n\n```css\n\
    #slideshow {/ * 轮片容器 css * /\n  width: 800px;\n  height: 400px;\n  overflow: hidden;\n\
    \  margin: 50px auto 50px auto;\n  box-shadow: 0px 0px 50px # 333;\n  -moz-box-shadow:\
    \ 0px 0px 50px # 333;\n  -webkit-box-shadow: 0px 0px 50px # 333;\n}\n\n#slideshow\
    \ ul {/ * 管理轮片滚动元素 css * /\n  width: 4000px;\n  list-style: none;\n}\n\n#slideshow\
    \ ul li {\n  float: left;\n}\n```\n\n上面的 CSS 样式将把由 HTML 代码生成的简单外观转换为与目标幻灯片相似的页面。这是通过定义这些幻灯片的高度和宽度开始的，同时也指定了尺寸与照片幻灯片的尺寸完全相同。随着所有幻灯片并排浮动，可以将无序列表的总宽度定义为高达\
    \ 4590px。`overflow` 特性也被用于防止多张图片完全显示在页面上。你在这里只需要将 `overflow` 特性设置为 `overflow:\
    \ scroll`，此设置允许幻灯片在没有 JavaScript 的情况下也能显示。\n\n使用 CSS3-box shadow 添加了一个好看的阴影，如下所示：\n\
    \n```css\n#slideshow-nav {/ * 轮片导航容器 css * /\n  width: 150px;\n  margin: 0 auto\
    \ 100px auto;\n}\n\n#slideshow-nav ul {\n  list-style: none;\n}\n\n#slideshow-nav\
    \ ul li {\n  float: left;\n}\n\n#slideshow-nav ul li a {/ * 导航样式 css * /\n  display:\
    \ block;\n  width: 20px;\n  height: 20px;\n  float: left;\n  margin: 0 5px;\n\
    \  background: #fff;\n  text-indent: -9999px;\n  border-radius: 50%;\n  -webkit-border-radius:\
    \ 50%;\n  box-shadow: 0px 0px 30px # 000;\n  -webkit-box-shadow: 0px 0px 30px\
    \ # 000;\n}\n\n#slideshow-nav ul li a:hover, #slideshow-nav ul li a.active {\n\
    / * 悬停和激活导航 css * /\n  background: # 333;\n}\n```\n\n通过这里的仔细预览，我们会注意到定义为 `slideshow-nav`\
    \ 的 `div` 标签已经移动到幻灯片主部分的下方。我们也不希望幻灯片中出现多个在 JavaScript 功能启用时不起作用的按钮。你可以使用 `visibility:\
    \ hidden` 默认隐藏这些按钮，从而在以后显示它们可能。你可能还会感兴趣的是，每个导航菜单的链接已经通过 CSS3 中 `border-radius`\
    \ 的帮助转换成了圆形按钮，并通过为 `text-indent` 设置负值来使默认文本偏离屏幕。\n\n到目前为止，幻灯片已经可以实实在在地地运行了，且不需要\
    \ JavaScript。只有一个导航栏允许用户在不同的图片之间来回移动。\n\n# 最后，让我们来看 jQuery 函数\n\n`js / custom-scripts.js`\n\
    \n```javascript\n$(document).ready(function () {\n  var slider = $(\"#slideshow\"\
    );\n  var slider_nav = $(\"#slideshow-nav\");\n  slider_nav.find(\"a [href = #\
    \ slide1]\").addClass(\"active\");\n  slider_nav.localScroll({\n    target: '#slideshow',\n\
    \    axis: 'x'\n  });\n  slider_nav.find(\"a\").click(function () {\n    slider_nav.find(\"\
    a\").removeClass(\"active\");\n    $(this).addClass(\"active\");\n  });\n});\n\
    ```\n\n如果你看上面的代码，你会发现幻灯片的 CSS 样式已经从 `overflow: scroll` 变为 `overflow: hidden` 以移除滚动条。之后，导航按钮被设置为可见，并自动为第一个按钮添加了\
    \ `active` 类别。这两个扩展也已启用：除了对幻灯片应用 `LocalScroll` 功能外，还有 `LocalScroll` 和 `ScrollTo`。\n\
    \n## 第七章：10 个每个设计师应该了解的 jQuery 技巧\n\n"
- fmt: "\nWe may wish the links to perform actions other than going to a page or even\
    \ reloading it, which is what the lines above work on by disabling the default\
    \ action. The reason, for example, might be another script activation.\n\n## Switch\
    \ between Fade and Slide cosplay\n\n```javascript\n// Evanescence\n$(\". btn\"\
    ).click(function () {\n  $(\". element\").fadeToggle(\"slow\");\n});\n\n// Switch\n\
    $(\". btn\").click(function () {\n  $(\". element\").slideToggle(\"slow\");\n\
    });\n```\n\nThe fade and slippage effect is one of the most common effects in\
    \ `jQuery`. When we only want to display an object on click, the `fadeIn` and\
    \ `slideDown` functions are completely appropriate. But if we want the item to\
    \ appear after the first click and then disappear after the second, this clip\
    \ will do the job successfully.\n\n## Folding effect\n\n```javascript\n// Close\
    \ all panels\n$('#accordion').find('.content').hide();\n\n// The folding effect\n\
    $('#accordion').find('.accordion-header').click(function () {\n  var next = $(this).next();\n\
    \  next.slideToggle('fast');\n  $('.content').not(next).slideUp('fast');\n  return\
    \ false;\n});\n```\n\nAll you need besides this section is the right HTML for\
    \ impact. First we turn off all panels, then when the click event occurs, the\
    \ associated header-related content slides sequentially. This is an easy way to\
    \ get a collapsing effect quickly.\n\n## Determine the height of the div element\
    \ depending on the post\n\n```javascript\n$('.div').css('min-height', $('.main-div').height());\n\
    ```\n\nThis method enables the `div` to be set to the same height regardless of\
    \ their content. On the above line set the height of the `div` elements so that\
    \ they have at least the height of the `main-div` element.\n\n## List of different\
    \ colors according to the even and odd elements\n\n```javascript\n$('li: odd').css('background',\
    \ '#E8E8E8');\n```\n\nThis line gives a background with the specified color for\
    \ the individual elements of the list, enabling you to obtain a chart list - such\
    \ as the zebra body - by adding a default background color in a CSS file that\
    \ the even elements from the list take. This method is not limited to regulations,\
    \ but extends to tables, `divs`, and others.\n\n# Chapter VIII\n\n## Headers and\
    \ static column html tables with jQuery\n\nFixed schedule headers are not new\
    \ in websites. Unlike paper, the reader can quickly shift his view to the top\
    \ of the screen to know which column it is, but the dimensions of the screen make\
    \ reading long tables difficult.\n\nFixed table headers, as its name indicates,\
    \ remain fixed at the top of the table even if we go further into the table. The\
    \ command helps keep the column names always close at hand, so that the user is\
    \ not forced to go back to the top of the table every time for the look and then\
    \ back again.\n\nThere are many `jQuery` scripts and add-ons that work in an effective\
    \ and error-free manner, they are not the ideal solution for all possible problems,\
    \ in some cases the tables have to follow the rules of structuring for which additions\
    \ are not calculated, such as tables that allow the scroll indicator to appear\
    \ when it is not Enough space to show the table.\n\nThis article will not be the\
    \ ideal solution for all situations, but it will be a solution to most common\
    \ problems.\n\n### Solve CSS using position: sticky?\n\nCSS has an appropriate\
    \ solution to this problem and is using `position: sticky`. Unfortunately, the\
    \ solution is not supported in chrome although it was previously supported, but\
    \ the development team completely removed the feature from it for an unknown period.\
    \ Because we cannot sacrifice all of the chrome users, we have to work around\
    \ the problem.\n\n### Solve using jQuery\n\n`JQuery`'s solution is very simple,\
    \ but before we start using it, we have to take a look at how a table is correctly\
    \ structured:\n\n```html\n<table>\n    <thead>\n      <tr>\n        <th></th>\n\
    \        <!-- more columns are possible ->\n      </tr>\n    </thead>\n    <tbody>\n\
    \      <tr>\n        <td></td>\n        <!-- more columns are possible ->\n  \
    \    </tr>\n      <!-- more rows are possible -->\n    </tbody>\n    <tfoot> <!--\
    \ This part is optional ->\n      <tr>\n        <td></td>\n      </tr>\n    </tfoot>\n\
    </table>\n```\n\n### What are we trying to accomplish?\n\nWe will try to make\
    \ the script support most of the common problems which are:\n\n- Basic use: the\
    \ table header is fixed.\n- Horizontal and vertical table headers.\n- Broad tables:\n\
    \n* Horizontal column: If there are too many columns that cannot be shown in page\
    \ width, we will use a fixed side column.\n* Vertical row: It is the primary use,\
    \ that the upper head be fixed when going down the table.\n* Both columns: where\
    \ we fix both the column and the row.\n\n### CSS to get started\n\nAlthough we\
    \ will be using a solution via JavaScript, CSS is necessary in order to execute\
    \ the command:\n\n```css\n.sticky-wrap {\n    overflow-x: auto;\n    position:\
    \ relative;\n    margin-bottom: 1.5em;\n    width: 100%;\n}\n\n.sticky-wrap .sticky-thead,\n\
    .sticky-wrap .sticky-col,\n.sticky-wrap .sticky-intersect {\n    opacity: 0;\n\
    \    position: absolute;\n    top: 0;\n    left: 0;\n    transition: all .125s\
    \ ease-in-out;\n    z-index: 50;\n    width: auto; /* Prevent stretching */\n\
    }\n\n.sticky-wrap .sticky-thead {\n    box-shadow: 0 .25em 0.1em rgba(0,0,0,.125);\n\
    \    z-index: 100;\n    width: 100%; /* Force table stretching */\n}\n\n.sticky-wrap\
    \ .sticky-intersect {\n    opacity: 1;\n    z-index: 150;\n}\n\n.sticky-wrap .sticky-intersect\
    \ th {\n    background-color: #666;\n    color: #eee;\n}\n```\n\nNote: It is very\
    \ important to move all of the CSS for the `table` tag to `sticky-wrap`. \n\n\
    ```css\ntable {\n    margin: 0 auto 1.5em;\n    width: 75%;\n}\n```\n\n### Using\
    \ Javascript\n\nWe will implement our function on every table. More importantly,\
    \ we will check if the table has `<thead>` and if the latter contains at least\
    \ `th`. If the conditions are not met, our function will ignore this table.\n\n\
    ```javascript\n$(function () {\n  // Here we select all tables on the page\n \
    \ $('table').each(function () {\n    if ($(this).find('thead').length > 0 && $(this).find('th').length\
    \ > 0) {\n      // The rest of the script will be here\n    }\n  });\n});\n```\n\
    \n### Step 1: Copy the thead element\n\nDefine variables and some shortcuts\n\n\
    ```javascript\nvar $t = $(this),\n    $w = $(window),\n    $thead = $(this).find('thead').clone(),\n\
    \    $col = $(this).find('thead, tbody').clone();\n```\n\n### Step 2: Encapsulate\
    \ and copy the table\n\nIn order to support cases where the table is wider than\
    \ what is permitted (i.e. when it is a large number of columns, or long columns,\
    \ we fold the table in `div` so that we allow you to be scrollable on the horizontal\
    \ axis:\n\n```javascript\n// Contain table\n$t.addClass('sticky-enabled').css({\n\
    \    margin: 0,\n    width: '100%',\n}).wrap('<div class=\"sticky-wrap\"></div>');\n\
    \n// Check if we have specified that the table be scrolling along the horizontal\
    \ axis\nif ($t.hasClass('overflow-y')) $t.removeClass('overflow-y').parent().addClass('overflow-y');\n\
    \n// Create a new table header with a .sticky-head class\n$t.after('<table class=\"\
    sticky-head\" />');\n\n// If <tbody> contains <th> we create a new column so that\
    \ the cell is above the table\nif ($t.find('tbody th').length > 0) {\n    $t.after('<table\
    \ class=\"sticky-col\" /> <table class=\"sticky-intersect\" />');\n}\n\n// Shortcuts\n\
    var $stickyHead = $(this).siblings('.sticky-thead'),\n    $stickyCol = $(this).siblings('.sticky-col'),\n\
    \    $stickyInsct = $(this).siblings('.sticky-intersect');\n```\n"
