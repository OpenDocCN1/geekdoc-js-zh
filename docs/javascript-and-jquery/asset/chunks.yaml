  trans: "\n\n```javascript\n$stickyWrap = $(this) .parent ('. sticky-wrap');\n```\n\
    \n## 第 3 步：设置复制表格的内容\n\n我们现在要做的工作是从原表格中获取复制的内容，并将其放入将附加的新表格中：\n\n- 新表格表头将接收来自复制的\
    \ `<thead>` 元素的所有内容。\n- 合并列将接收来自 `<thead>` 中第一个 `<th>` 元素以及 `<tbody>` 中所有剩余 `<th>`\
    \ 元素的内容。\n- 将列与行合并（即列与行的公共单元格）将获取从顶部的列到表格右侧的内容（假设我们处理的是 RTL 从右到左的布局的页面）。\n\n```javascript\n\
    // StickyHead 获取来自 <thead> 的内容\n$stickyHead.append ($thead);\n\n$stickyCol\n \
    \   .append ($ col)\n    .find ('thead th: gt (0)'). remove ()\n    .end ()\n\
    \    .find ('tbody td'). remove ();\n\n// StickyIntersect 获取来自 <thead> 中 <th>\
    \ 的内容\n$stickyInsct.html ('<thead> <tr> <th>' + $t.find ('thead th: first-child').\
    \ html () + '</th> </tr> </thead>' );\n```\n\n## 第 4 步：函数\n\n这是我们脚本中最重要的部分，我们将确定为了让脚本正常运行必须实现哪些函数：\n\
    \n- 用于确定复制表格表头中 `<th>` 元素宽度的函数，由于我们只是复制了 `<thead>` 元素，复制后的头部宽度将不是实际的头部宽度，因为我们没有添加\
    \ `<tbody>` 的宽度，因为不知道它是否会影响表头页面。\n- 用于定位固定表头位置的函数，以便我们更新水平复制表头的维度，当我们开始在表格内传递进度条时，设置了\
    \ `position: absolute`。\n- 用于定位静态侧边列并具有相同表头安装状态的函数。\n- 用于计算剩余空间的函数，我们稍后会详细详细解释这个函数。\n\
    \n```javascript\n// 函数 1: setWidths ()\n// 目的：设置单独克隆元素的宽度\nvar setWidths = function\
    \ () {\n    $t\n        .find ('thead th'). each (function (i) {\n           \
    \ $stickyHead.find ('th'). eq (i) .width ($ (this) .width ());\n        })\n \
    \       .end ()\n        .find ('tr'). each (function (i) {\n            $stickyCol.find\
    \ ('tr'). eq (i) .height ($ (this) .height ());\n        });\n    // 设置固定表格表头的宽度\n\
    \    $stickyHead.width ($t.width ());\n    // 设置固定表格列的宽度\n    $stickyCol.find\
    \ ('th'). add ($stickyInsct.find ('th')). width ($t.find ('thead th'). width ())\n\
    },\n\n// 函数 2: repositionStickyHead ()\n// 目的：适当定位克隆的固定表头（始终存在）\nrepositionStickyHead\
    \ = function () {\n    // 返回计算出的偏移\n    var allowance = calcAllowance ();\n  \
    \  // 检查父元素是否沿 y 轴溢出\n    if ($t.height ()> $stickyWrap.height ()) {\n       \
    \ // 如果溢出\n        // 根据包装器的 scrollTop () 定位固定表头\n        if ($stickyWrap.scrollTop\
    \ ()> 0) {\n            // 当父元素的顶部超出可视范围时\n            $stickyHead.add ($stickyInsct)\
    \ .css ({\n                opacity: 1,\n                top: $stickyWrap.scrollTop\
    \ ()\n            });\n        } else {\n            // 当父元素的顶部在范围内时\n       \
    \     $stickyHead.add ($stickyInsct) .css ({\n                opacity: 0,\n  \
    \              top: 0\n            });\n        }\n    } else {\n        // 如果溢出（基础布局）\n\
    \        // 根据 scrollTop () 定位固定表头\n        if ($w.scrollTop ()> $t.offset ().\
    \ top && $w.scrollTop () <$t.offset (). top + $t.outerHeight () - allowance){//\
    \ 当视口顶部在表格内，且我们设置了偏移\n            // 动作：显示固定表头和交叉部分，并将 top 设置为右值\n           \
    \ $stickyHead.add ($stickInsct) .css ({\n                opacity: 1,\n       \
    \         top: $w.scrollTop () - $t.offset (). top\n            });\n        }\
    \ else {\n            // 当视口顶部在表格上方或下方\n            // 动作：隐藏固定表头和交叉部分\n      \
    \      $sticky.add ($stickInsct) .css ({\n                opacity: 0,\n      \
    \          top: 0\n            });\n        }\n    }\n},\n\n// 函数 3: repositionStickyCol\
    \ ()\n// 目的：适当定位克隆的固定列（如果存在）\nrepositionStickyCol = function () {\n    if ($stickyWrap.scrollLeft\
    \ ()> 0) {\n        // 当包装器的左侧超出可视范围时\n        // 显示固定列和交叉部分\n        $stickyCol.add\
    \ ($stickyInsct) .css ({\n            opacity: 1,\n            left: $stickyWrap.scrollLeft\
    \ ()\n        });\n    } else {\n        // 当包装器的左侧在范围内时\n        // 等等，原始逻辑在这里意味着隐藏或重置逻辑\n\
    \    }\n},\n\n// 函数 4: calcAllowance ()\n// 目的：返回计算出的偏移\ncalcAllowance = function\
    \ () {\n    var a = 0;\n    // 获取最后几行的和\n    $t.find ('tbody tr: lt (3)'). each\
    \ (function () {\n        a += $(this) .height ();\n    });\n    // 安全设置（最后一行可能太高）\n\
    \    if (a> $w.height () * 0.25) {\n        a = $w.height () * 0.25;\n    }\n\
    \    // 添加固定表头的高度\n    a += $sticky.height ();\n    return a;\n}\n```\n（注：原文在\
    \ `calcAllowance` 部分存在一些结构上的不一致和缺失定义；我根据上下文清理了逻辑并保持了变量名。）\n\n现在我们将解释在第四个函数中所做的工作，我们不希望表头附加到表格底部，因此需要在底部留出空空间。\n\
    \n根据我的尝试，我发现当到达最后一行时不需要表头，因为我们的焦点已经转移到了内容。\n\n$t.find ('tbody tr: lt (4)'). each\
    \ (function () {\n    allowance += $(this) .height ();\n});\n\n## 第 5 步：连接一切\n\
    \n定义完必要的函数后，剩下的是将事件处理器连接到 `$ window`。\n\n- 当 DOM 准备就绪时，我们进行演示的计算。\n- 当你持有所有信息时，我们重新计算尺寸，这一步很重要，因为你的表格可能包含在\
    \ DOM 之后加载的对象，如图像和网络字体。\n- 当在主容器中滚动时，如果内容大于容器宽度，就会发生，此时我们需要重新定位主列。\n- 当浏览器窗口最小化时，我们想要重新计算视图。\n\
    - 当浏览器中向下滚动时，我们想要更改表格表头。\n\n我们刚刚说的内容可以总结为以下代码。注意，最小化和滚动事件通过添加 `throttle + debounce`\
    \ 来控制。\n\n```javascript\n// # 1: DOM 准备就绪时\nsetWidths ();\n\n// # 2: 我们在容器发生滚动事件时对其进行监控\n\
    $t.parent ('. sticky-wrap'). scroll ($. throttle (250, function () {\n    repositionStickyHead\
    \ ();\n    repositionStickyCol ();\n}));\n\n// 现在我们将制作的内容连接到 $ (window) 元素\n$w\n\
    // # 3: 当所有内容加载时\n.load (setWidths)\n// # 4: 当窗口最小化时\n```\n\n"
- fmt: "\n```\n// We have used throttle here so that the event does not fire more\
    \ than once (by default the event is fired for each minimized part, here we wait\
    \ until the reduction is complete and then we launch)\n\n.resize ($. throttle\
    \ (250, function () {\n    setWidths ();\n    repositionStickyHead ();\n    repositionStickyCol\
    \ ();\n})\n\n// # 5: When going down in the window\n// We used throttle so the\
    \ function doesn't launch much\n.scroll ($. throttle (250, repositionStickyHead);\n\
    ```\n\nAnd here we were!\n\n## The debate\n\nWe know that nothing is perfect,\
    \ so we will discuss other methods that have advantages over this method and its\
    \ disadvantages and we have not used this method.\n\n## Use position: fixed\n\n\
    Using this method may seem tempting for two reasons:\n\n1. No calculations are\
    \ required for the header of the table, because the fixed element is outside the\
    \ physical page and will remain in place.\n2. We avoid slow calculations because\
    \ the fixed elements chase the table and do not stick with it, because we do the\
    \ calculation in fixed periods (via `throttle`) and therefore it will appear that\
    \ the fixed element is unresponsive and therefore not normal.\n\nBut the problem\
    \ with this method is that we remove the element from the page luster. If the\
    \ table width exceeds the permissible width and it becomes necessary to add a\
    \ scroll, a header will not append the content on the horizontal axis because\
    \ it is fixed on the page. This is a great reason we are not allowed to use most\
    \ `jQuery` plugins that offer these features. And I wrote this course to fix exactly\
    \ this.\n\n## Use position: sticky\n\nThe new feature is appropriate for the matter,\
    \ in fact I built it for this matter in mind, the problem is that it is not supported\
    \ by the chrome browser (previously it was supported but the support was completely\
    \ removed) and thus lose all visitors from this browser.\n"
  raw: '// We have used throttle here so that the event does not fire more than once
    (by default the event is fired for each minimized part, here we wait until the
    reduction is complete and then we launch)


    .resize ($. throttle (250, function () {


        setWidths ();


        repositionStickyHead ();


        repositionStickyCol ();


    })


    // # 5: When going down in the window


    // We used throttle so the function doesn''t launch much


    .scroll ($. throttle (250, repositionStickyHead);


    And here we were!


    ## The debate


    We know that nothing is perfect, so we will discuss other methods that have advantages
    over this method and its disadvantages and we have not used this method.


    ## Use position: fixed


    Using this method may seem tempting for two reasons:


        No calculations are required for the header of the table, because the fixed
    element is outside the physical page and will remain in place.


        We avoid slow calculations because the fixed elements chase the table and
    do not stick with it, because we do the calculation in fixed periods (via throttle)
    and therefore it will appear that the fixed element is unresponsive and therefore
    not normal.


    But the problem with this method is that we remove the element from the page luster.
    If the table width exceeds the permissible width and it becomes necessary to add
    a scroll, a header will not append the content on the horizontal axis because
    it is fixed on the page. This is a great reason we are not allowed to use most
    jQuery plugins that offer these features. And I wrote this course to fix exactly
    this.


    ## Use position: sticky


    The new feature is appropriate for the matter, in fact I built it for this matter
    in mind, the problem is that it is not supported by the chrome browser (previously
    it was supported but the support was completely removed) and thus lose all visitors
    from this browser.'
