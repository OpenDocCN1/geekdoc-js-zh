  trans: "\n\n# JavaScript 基础及初学者常见错误\n\n（你可以跳过此部分）\n\nJQuery 是基于 JavaScript 构建的，而\
    \ JavaScript 本身丰富且强大。本课程涵盖了 JavaScript 的基础以及初学者常犯的一些错误。本课程对于编程世界的新手非常有益，对于以前没有学习过\
    \ JavaScript 特有方面的其他语言的程序员也有帮助。\n\n这是一个简单的 JavaScript 程序，用于向网页添加一条消息：\n\n```javascript\n\
    // 创建一个标签来问候某人\n\n// 我基于变量 'greet' 创建\nvar greet = function (person, message)\
    \ {\n  var greeting = 'Hello,' + person + '!';\n  log (greeting + '' + message);\n\
    };\n\n// 使用该函数通过名字和问候消息来问候 Jory\ngreet ('Jory', 'Welcome to JavaScript');\n\n\
    // 使用该函数通过名字和不同的消息来问候 Rebecca\ngreet ('Rebecca', 'Thanks for joining us');\n```\n\
    \n注意：在上例中，我们使用了 `log` 函数。它仅在本系列示例中提供的辅助函数，在 JavaScript 中并不自动可用。`log` 可以在本系列的脚本编辑器中使用，但在字符串之外的脚本中，你需要使用\
    \ `console.log` 来替换它，然后文本结果将打印到你使用的浏览器末尾。\n\n```javascript\n// 创建一个问候某人的函数，\n\
    //并将该函数赋值给 `greet` 变量\nvar greet = function (person, message) {\n  var greeting\
    \ = 'Hello,' + person + '!';\n  log (greeting + '' + message);\n};\n\n// 使用该函数问候\
    \ Jory，传入她的\n// 名字和我们要使用的消息\ngreet ('Jory', 'Welcome to JavaScript');\n\n// 使用该函数问候\
    \ Rebecca，传入她的\n// 名字和一个不同的消息\ngreet ('Rebecca', 'Thanks for joining us');\n```\n\
    \n上例显示了在控制台部分执行脚本的结果。你可以使用 `Clear` 按钮重置示例，然后点击 `Run` 尝试重新执行它。如果某些内容看起来难以理解，那是没关系的。在接下来的章节中，我们将介绍变量、函数以及\
    \ JavaScript 的其他基础组件。\n\n## 关于注释\n\n注释对于解释代码的作用非常有用，而且注释不会影响程序。有些程序员喜欢在程序中使用注释，而另一些人则只在某些部分晦懂时才写注释。JavaScript\
    \ 允许两种类型的注释：单行和多行，第一种以 `//` 开始，第二种以 `/*` 开始并以 `*/` 结束。\n\n```javascript\n// 这是一个单行注释\n\
    var foo;\n\n/*\n这是一个多行注释\n它可以跨越多行。\n*/\n```\n\n你也可以在行内嵌入多行注释：\n\n```javascript\n\
    function cornify (unicorns /* integer * /) {}\n```\n\n## JavaScript 的核心组件\n\n\
    ### 变量\n\n变量是存储稍后需要使用的值的方式。变量可以是多种类型，例如数字、对象，甚至是代码（存储在变量中）。使用 `var` 语句声明变量：\n\n\
    ```javascript\nvar myName = 'Rebecca';\n```\n\n任何变量名都可以被选择，只要它不包含 \"-\"。你可以在每一句声明一个变量：\n\
    \n```javascript\nvar a = 1;\nvar b = 'two';\n```\n\n或者通过逗号在一个句中声明多个变量：\n\n```javascript\n\
    var a = 1,\n    b = 'two';\n```\n\n在给变量赋值后，可以使用该变量来访问存储的值：\n\n```javascript\n\
    log (myName); // 打印 'Rebecaa'\n```\n\n变量是遵循“不要重复自己”（DRY）原则的必要组件。如果你想多次使用一个值，你可能想将其存储在变量中。我们将在文中详细讨论变量。\n\
    \n### 函数\n\n函数是 JavaScript 软件的关键组件，因为它提供了在独立部分创建小函数的方法。例如，假设有一个函数结合两个数字：\n\n```javascript\n\
    function (a, b) {\n    return a + b;\n}\n```\n\n该函数接收两个因子 `a` 和 `b`，将它们相加，然后返回和。上例的格式是正确的，但它没有任何作用，因为我们还没有调用这个函数。所以我们必须找到调用函数的方法，可以通过赋值：\n\
    \n```javascript\nvar addTwoNumbers = function (a, b) {\n  return a + b;\n}\n```\n\
    \n我们在上例中做的是将一个函数表达式赋值给变量。我们现在可以使用变量名调用此函数：\n\n```javascript\nlog (addTwoNumbers\
    \ (1, 1)); // 打印 2\n```\n\n或者，我们可以使用函数声明来给函数命名：\n\n```javascript\nfunction addTwoNumbers\
    \ (a, b) {\n  return a + b;\n}\n```\n\n两种方法都允许我们以相同的方式调用函数，但在采用最后一种方法时必须注意本文所解释的原因。结论：如果你不完全理解\
    \ JavaScript 中称为“变量提升”（hoisting）的特性，通过声明函数来命名可能会导致意外的结果。该特性的细节超出了范围，但我们将依靠将函数赋值给变量。\n\
    \n### 函数和变量作用域\n\n使用 `var` 语句在函数内部定义的变量仅在该函数内部可用，这通常是理想的，除非打算让它们全局化（即在程序范围内可用）。但变量仅在函数内部意味着什么？尝试这个程序：\n\
    \n```javascript\nWarning: Wrong script\nvar myFunction = function () {\n  var\
    \ foo = 'bar';\n};\n\nmyFunction ();\n\nlog (typeof foo); // 打印 undefined!\n```\n\
    \n如果我们在上例中尝试在函数外部使用 `foo` 的值（而不是仅仅检查它的类型），我们将告诉浏览器发生了错误，程序将停止执行使用 foo 的位置。\n\n\
    接下来的示例显示了两个不同的变量如何存在于同一个名称，只要它们位于彼此独立的领域中。在这个示例中，我们声明了变量 `foo` 并给其赋值为 `'qux'`，然后在函数中声明了另一个变量，我们也叫它\
    \ `foo`，并给它赋值为 `'bar'`。注意，即使我们在函数内部创建了 `foo` 变量，函数外的 `foo` 变量也不会改变。\n\n```javascript\n\
    var foo = 'qux';\nvar myFunction = function () {\n  var foo = 'bar';\n};\n\nlog\
    \ (foo); // 打印 'qux'\n\nmyFunction ();\n\nlog (foo); // 也打印 'qux'\n```\n\n变量的作用域是\
    \ JavaScript 的核心概念，可能会让初学者感到困惑。记住：\n\n- 在大多数情况下，使用 `var` 声明变量\n- 使用 `var` 语句在函数内部定义的变量无法从外部访问\n\
    - 没有 `var` 强制执行的变量总是全局的\n\n注意，未使用 `var` 单词声明的变量通常是隐式的。在接下来的示例中，由于没有使用 `var` 单词，变量\
    \ `a` 在函数外部也可用（这在大多数情况下是不良的）。\n\n```javascript\nWarning: insecure script\nfunction\
    \ test () {\n  a = 1;\n}\n\ntest ();\n```\n\n"
