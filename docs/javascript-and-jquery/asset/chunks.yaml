    </html>


    By looking carefully at the codes above you will notice that the HTML codes for
    your display pages start with Doctype, the title of the link and a link to the
    CSS style file. After these three, you will find that to prepare and run the slide
    show, a link has been added for the two previously mentioned LocalScroll and ScrollTo,
    jQuery library and script.js file.


    The HTML codes responsible for creating the slideshow are also divided into two
    parts: a div tag is defined as slideshow and another is a slideshow-nav. It is
    important to note here that the div tag identified by slideshow will contain an
    unnumbered list of related images, and li tags contain identifiers that are compatible
    with slideshow-nav links.


    ## Now let''s look at CSS styles


    css / style.css


    #slideshow {/ * slider container css * /


      width: 800px;


      height: 400px;


      overflow: hidden;


      margin: 50px auto 50px auto;


      box-shadow: 0px 0px 50px # 333;


      -moz-box-shadow: 0px 0px 50px # 333;


      -webkit-box-shadow: 0px 0px 50px # 333;


    }


    #slideshow ul {/ * manage slider scroll elements css * /


      width: 4000px;


      list-style: none;


    }


    #slideshow ul li {


      float: left;


    }


    The CSS styles above will convert the simple look generated by HTML code into
    pages that look similar to the desired slideshow. This is done starting with defining
    the height and width of these slides, also specifying the dimensions to be exactly
    the same as the dimensions of the photo slides. With all slides floating side
    by side, it is possible to define the total width measurements for the unnumbered
    list up to 4590px. The overflow feature was also used to prevent multiple images
    from appearing entirely on the page. All you need to do here is to simply set
    the overflow feature as overflow: scroll, this setting allows slideshows to display
    even when there is no JavaScript.


    A nice shade was added using the CSS3-box shadow as shown below


    # slideshow-nav {/ * Slider navigation container css * /


      width: 150px;


      margin: 0 auto 100px auto;


    }


    # slideshow-nav ul {


      list-style: none;


    }


    # slideshow-nav ul li {


      float: left;


    }


    # slideshow-nav ul li a {/ * navigation styling css * /


      display: block;


      width: 20px;


      height: 20px;


      float: left;


      margin: 0 5px;


      background: #fff;


      text-indent: -9999px;


      border-radius: 50%;


      -webkit-border-radius: 50%;


      box-shadow: 0px 0px 30px # 000;


      -webkit-box-shadow: 0px 0px 30px # 000;


    }


    # slideshow-nav ul li a: hover, # slideshow-nav ul li a.active {


    / * hover and active navigation css * /


      background: # 333;


    }


    With a careful preview here, we will notice that the div tag, which is defined
    as slideshow-nav, has been moved to a position below the main section for the
    slide show. We also don''t want multiple buttons in the slide show that don''t
    work when JavaScript functionality is enabled. You can use visibility: hidden
    to hide these buttons by default, which makes it possible to show them at a later
    time. You may also be interested in knowing that the links for each navigation
    menu have been converted to circular buttons with the help of border-radius in
    CSS3 with the default text offsets from the screen by setting a negative value
    for text-indent.


    So far, the slide show works tangibly and without the need for JavaScript. There
    is only a navigation bar that allows the user to move back and forth between different
    images.


    ## Finally, let''s look at jQuery functions


    js / custom-scripts.js


    $ (document) .ready (function () {


      var slider = $ ("# slideshow");


      var slider_nav = $ ("# slideshow-nav");


      slider_nav.find ("a [href = # slide1]"). addClass ("active");


      slider_nav.localScroll ({


        target: ''# slideshow'',


        axis: ''x''


      });


      slider_nav.find ("a"). click (function () {


        slider_nav.find ("a"). removeClass ("active");


        $ (this) .addClass ("active");


      });


    });


    If you look at the code above, you will see that the slideshow CSS styles have
    been changed from overflow: scroll to overflow: hidden to remove the slider. After
    that the nav buttons are set to be visible with the active category automatically
    added to the first button. Both extensions are also enabled: LocalScroll and ScrollTo,
    in addition to applying LocalScroll functionality to slideshow-nav elements by
    directing those elements to target slideshow elements by moving along the X axis.


    Finally, to ensure that all buttons in the slide show work with their active category
    (whenever they were clicked), we will use a simple jQuery rule that will remove
    the active category from the buttons that were not clicked. This active category
    selected will appear within CSS styles to display only a gray background color
    to the clicked button. By doing a quick test on your browser, a fully functional
    JavaScript slideshow will appear....


    # Chapter VII


    #  10 jQuery tricks that every designer should know


    JQuery is one of the most used libraries to add to pages, as it makes working
    with the Document object model, DOM easy.


    There is no doubt that ease of dealing is a main reason for the popularity of
    jQuery, as it seems it is possible to do anything we want through this library.


    There are, among our options, snippets that make it appear again and again. In
    this article, we will introduce ten provinces that everyone will use, from beginner
    to proficient, over and over again.


    ## Back to top button


    // Back to top


    $ (''a.top''). click (function () {


      $ (document.body) .animate ({scrollTop: 0}, 800);


      return false;


    });


    // Anchor tag Create a tag for the linker


    <a class="top" href="#"> Back to top </a>


    Obviously, we don''t need to add a Plugin for jQuery in order to get an easy move
    up; just use the animate and scrollTop functions.


    The position of the scroll bar can be changed by changing the value of the scrollTop.
    In the example above we used the value 0 because we wanted to go back to the top
    of the page, but if we wanted an offset of 100px this value could be included.


    What we did is move the Document body around 800 milliseconds until it reaches
    the top.


    ## Check upload photos


    $ (''img''). load (function () {


      console.log (''image load successful'');


    });


    Sometimes you need to make sure that all images are loaded before completing the
    script; the above three lines perform this task easily. You can also verify that
    a specific image has been uploaded by replacing the tag tag with ID or Class.


    ## Correct damaged photos automatically


    $ (''img''). error (function () {


      $ (this) .attr (''src'', ''img / broken.png'');


    });


    Sometimes there is trouble in the image links on the site. It is difficult to
    change the links manually. The above clip automatically replaces the damaged images
    which saves a lot of problems.


    ## Substitution of the variety when Hover


    $ (''. btn''). hover (function () {


      $ (this) .addClass (''hover'');


    }, function () {


      $ (this) .removeClass (''hover'');


    }


    );


    We usually want to change the appearance of clickable items on a web page when
    the cursor hovers around them, which is exactly what the lines in the section
    above do; it adds an item to the item when hovering around it and then removes
    the item when the user stops. All you have to do is add the desired format into
    your CSS file.


    ## Disable input fields


    $ (''input [type = "submit"]''). attr ("disabled", true);


    You may want to disable the submit button or input field until the user performs
    a specific action (check the “I read terms” box, for example). The clip adds a
    disabled feature to the field, allowing you to enable it whenever you want. All
    you need to do to activate the field is to execute the removeAttr function with
    the disabled parameter passed as follows:


    $ (''input [type = "submit"]''). removeAttr ("disabled");


    ## Stop downloading links


    $ (''a.no-link''). click (function (e) {


      e.preventDefault ();


    });'
