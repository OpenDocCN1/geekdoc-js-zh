    \ `new Array(3)` 意味着创建一个包含三个未定义元素的数组，而不是创建一个包含数字 3 的数组（即而不是创建 `[3]`）。\n\n数组的属性（有时称为数组的元素）可以使用与对象相同的方括号格式进行访问。每个元素都根据其在数组中的位置自动赋予名称。但要小心：数字从零开始。让我们来看一个包含\
    \ 3 个元素的数组：\n\n警告：不希望的风格\n\n```javascript\nvar myArray = ['a', 'b', 'c'];\nvar\
    \ firstItem = myArray [\"0\"]; // 访问第一个元素\n```\n\n在访问数组元素时，使用数字来定位数组中所需的元素更为简单，这被称为索引：\n\
    \n```javascript\nvar myArray = ['a', 'b', 'c'];\nvar firstItem = myArray [0];\n\
    var secondItem = myArray [1]; // 访问索引为 1 的项目\nlog (secondItem); // 记录 'b'\n```\n\
    \n我们可以通过访问数组中的 `length` 属性来查看一组元素的数量：\n\n```javascript\nvar myArray = ['a', 'b',\
    \ 'c'];\nvar len = myArray.length;\nlog (len); // 记录 3\n```\n\n## For 循环：列出数组\n\
    \n由于我们知道如何确定数组的长度（其中元素的数量），并且它的第一个组件位于目录 0，因此我们可以使用 `for` 来列出数组的元素：\n\n我们可以对数组进行很多操作，请参阅\
    \ Mozilla Developer Network 中的矩阵文档获取完整指南。\n\n## 逻辑与验证\n\nJavaScript 提供了 `if` 和\
    \ `else` 关键字以及三元运算符，允许在满足某些条件时执行某些命令。JavaScript 通过检查值或短语的“正确性”来确定条件是否满足。因为 JavaScript\
    \ 是一种动态类型语言，我们可以使用任何值或值的组合，但验证特定值或短语为真或假的规则可能会导致一些困惑。\n\n下面是 JavaScript 中简单条件\
    \ (`if`) 句的示例。该语句检查数字 1 的有效性，因为 1 是一个“真值”（truthy），所以括号 `{}` 中的脚本将在 `if` 语句后执行。\n\
    \n```javascript\nif (1) {\n  // 这将被执行\n  log ('1 is truthy');\n}\n```\n\n事实是，JavaScript\
    \ 中的大多数值都是“真”的，该语言中只有五个值被认为是“假值”（falsy）：\n\n- `undefined`（每个变量的初始值在未对其赋值时被赋予）\n\
    - `null`\n- `NaN`（不是数字）\n- `0`（数字零）\n- `\"\"`（空文本字符串）\n\n当我们想要检查一个值是否存在“错误”时，我们使用参数\
    \ `!`：\n\n```javascript\nvar a = '';\nif (! a) {\n  // 如果它是正确的，此命令将不会执行\n  log\
    \ ('a was falsy');\n}\n```\n\n至于 `NaN` 的值，它有一个特殊情况。当在简单的条件语句中对其进行检查时，它是假的：\n\n\
    ```javascript\nvar notANumber = 'four' - 'five';\nif (! notANumber) {\n  // 这将被执行\n\
    \  log ('! notANumber was truthy');\n}\n```\n\n当我们将 `NaN` 的值与假进行比较时，我们会得到一个“错误”值：\n\
    \n```javascript\nvar notANumber = 'four' - 'five';\nif (notANumber == false) {\n\
    \  // 此命令将不会执行\n  log ('notANumber was falsy');\n} else {\n  // 这将被执行\n  log ('notANumber\
    \ was truthy');\n}\n```\n\n重要的是，除了上述五个值外，所有其他值都被视为真，包括空数组、空白对象和所有非空字符串（包括文本字符串\
    \ '0'）以及除 0 之外的所有数字。\n\n注意：可以在一行内不使用括号使用 `if` 和 `else` 编写条件句，但这种做法并不受推荐，因为它使得程序的阅读和维护变得更加困难；我们在这里提到它仅仅是因为它可能会重合。\n\
    \n## 逻辑运算符\n\n逻辑运算符允许使用 `&&` 和 `||` 对双边进行求值：\n\n```javascript\nvar propertyName\
    \ = 1;\nvar bar = 0;\nvar baz = 2;\n```\n\n在 `&&` 的情况下，返回第一个值。在 `||` 的情况下，返回最后一个值。你可能会看到用于控制流的运算符：\n\
    \n```javascript\nfoo && bar // 返回 0\nbar || baz // 返回 2\nfoo && baz // 返回 2\n\
    bar || foo // 返回 1\n```\n\n注意：`&&` 运算符是短路的的；如果第一个操作数为假，则第二个将不会被求值。`||` 运算符也是短路的；如果第一个操作数为真，则第二个将不会被求值。\n\
    \n## 三元运算符\n\n通常，你想使用 `if` 和 `else` 根据条件的有效性来设置变量的值：\n\n警告：不希望的风格\n\n```javascript\n\
    var propertyName;\nif (dim === 'width') {\n  propertyName = 'clientWidth';\n}\
    \ else {\n  propertyName = 'clientHeight';\n}\n```\n\n然而，三元运算符允许以更短的方式实现目标：\n\n\
    ```javascript\nvar propertyName = (dim === 'width') ? 'clientWidth' : 'clientHeight';\n\
    ```\n\n## JavaScript 错误\n\n除了变量范围，JavaScript 中还有许多其他错误，我们将查看其中一些。\n\n## 命名\n\n\
    JavaScript 中的常见名称以字母或特定符号开头，后跟跟字母、数字、`_` 或其他符号。名称不能以数字或减号 `-` 开头。只要遵循这些规则，这些名称都是有效的：\n\
    \n- `a`\n- `a1`\n- `foo_bar`\n- `fooBaz`\n- `$ fooBar`\n- `_foo`\n- `__foo__`\n\
    \nJavaScript 社区对 JavaScript 中的变量和属性开发了一些常见用法，但它们并不是强制性的，也不会影响程序的运行：\n\n- 以 `_`\
    \ 开头的名称引用私有值（我们将稍后解释）。\n- 以大字母开头的名称通常是创建新对象的构造函数（我们将稍后解释）。\n- 在使用 jQuery 的程序中，以\
    \ `$` 符号开头的名称引用 jQuery 对象。\n\n## 关键字\n\nJavaScript 保留了一些最好避免作为软件组件名称的：\n\n`abstract`,\
    \ `boolean`, `break`, `byte`, `case`, `char`, `class`, `const`, `continue`, `debugger`,\
    \ `default`, `delete`, `do`, `double`, `else`, `enum`, `export`, `extends`, `false`,\
    \ `final`, `finally`, `float`, `for`, `function`, `goto`, `if`, `implements`,\
    \ `import`, `in`, `instanceof`, `int`, `interface`, `instance`, `long`, `native`,\
    \ `new`, `null`, `package`, `private`, `protected`, `public`, `return`, `short`,\
    \ `static`, `super`, `switch`, `synchronized`, `this`, `throw`, `throws`, `transient`,\
    \ `true`, `try`, `typeof`, `var`, `volatile`, `void`, `while`, `with`。\n\n如果要作为特定对象的名称，你应该用双引号将其括起来：\n\
    \n```javascript\nvar myObject = {\n  'class': 'tasty'\n};\n```\n"
- fmt: "\nDealing with numbers in JavaScript may sometimes give unexpected results,\
    \ due to the way numbers are represented internally in JavaScript, for example:\
    \ When adding two decimal numbers, the result is a number very close to the expected\
    \ value, but it is not completely equal:\n\n```\nlog (0.0001 + 0.0002); // 0.00030000000000000003\n\
    ```\n\nYou won't encounter this much when working with jQuery, but it's an important\
    \ issue that you should pay attention especially when dealing with decimal numbers\
    \ like currencies. When performing calculations that require complete accuracy,\
    \ you must convert the values to integers before working with them, then convert\
    \ them back to decimal numbers after completion.\n\nJavaScript tolerates different\
    \ types. When performing calculations using non-numerical values, JavaScript will\
    \ not inform you of an error. Rather, it will continue the process with results\
    \ you may not expect:\n\n```javascript\nlog ('a' + 2); // 'a2'\nlog ('4' + 3);\
    \ // '43'\nlog ('five' - '4'); // NaN (not a number)\nlog (- '1'); // -1\nlog\
    \ (1 + true); // 2\nlog (1 == true); // true\nlog (1 === true); // false\n```\n\
    \n# Chapter I\n\n# JQuery Basics\n\nJQuery makes it easy to handle HTML page content\
    \ after it is viewed by the browser, and provides tools that help you follow the\
    \ user interaction with the page, move elements in it, and communicate with servers\
    \ without reloading the page. We will explain these tools soon. Let's start first\
    \ with the basics of jQuery, and how it can use its primary function: access specific\
    \ elements on a page and do something with it.\n\nNote: This chapter assumes that\
    \ you are familiar with the basics of HTML and the CSS markers. If you are not\
    \ familiar with how the CSS markers can be used to access specific elements of\
    \ a page, you must first learn this before proceeding to this chapter.\n\n## What\
    \ is this symbol: $?\n\nThe jQuery library provides the `jQuery` function, which\
    \ allows you to define elements with CSS markers.\n\n```javascript\nvar listItems\
    \ = jQuery ('li');\n```\n\nIf you've read before software that uses jQuery, you\
    \ must be used to this:\n\n```javascript\nvar listItems = $ ('li');\n```\n\nAs\
    \ we discussed in the previous part (JavaScript Basics), all names are almost\
    \ valid in JavaScript unless they start with a number or contain a \"-\" sign.\
    \ So the name `$` in the last example is only a short name for the `jQuery` function,\
    \ and if you looked at the source of jQuery, you would read this near its end:\n\
    \n```javascript\n// Expose jQuery to the global object\nwindow.jQuery = window.\
    \ $ = jQuery;\n```\n\nWhen you call the `$()` function and pass it a parameter,\
    \ you get a new jQuery object. Functions in JavaScript are other objects, which\
    \ means that the `$` (and `jQuery`, of course) function has properties and functions\
    \ as well. For example: You can use `$.support` feature to find out what features\
    \ the current browser supports, and you can use the `$.ajax` function to send\
    \ an AJAX request.\n\nNote: From now on we will use `$` instead of `jQuery` in\
    \ this series to try to cut it short. Note that if your page contains more than\
    \ one library, the name `$` may be used from another library, which prevents jQuery\
    \ from working. If you encounter such a problem, try using `jQuery.noConflict`\
    \ before loading other libraries.\n\n### `$(document).ready()`\n\nBefore using\
    \ jQuery to do anything on the page, we need to make sure that the page has reached\
    \ a state where its content can be modified. This can be done in jQuery by surrounding\
    \ our program within a function and then passing this function to `$(document).ready()`.\
    \ As you can see in the following example, the function that we pass can be unknown\
    \ (no name):\n\n```javascript\n$(document).ready (function () {\n  console.log\
    \ ('ready!');\n});\n```\n\nThis will call the function that we passed to `.ready()`\
    \ after the document (page) is ready. What is happening here? We used `$(document)`\
    \ to create a jQuery object from the document on the page, then we called the\
    \ function `.ready()` on this object, passing to it the function that we want\
    \ to execute.\n\nSince you will find yourself rewriting this text over and over\
    \ again, jQuery offers you a short way to accomplish it, as the `$()` function\
    \ performs a different task when passing a function to it instead of the CSS parameter,\
    \ and then behaves as an alternative name to the `$(document)` function:\n\n```javascript\n\
    $(function () {\n  console.log ('ready!');\n});\n```\n\nNote: From now on, we'll\
    \ assume that the texts in this series are surrounded by the phrase `$(document).ready(function\
    \ () {...});`, and we will leave this phrase for the purpose of brevity.\n\n##\
    \ Access to items\n\nThe simplest thing to do with jQuery is to select some elements\
    \ and then do something with them. If you understand the CSS parameters, you will\
    \ find that accessing some elements is straightforward: you only need to pass\
    \ the appropriate parameter to `$()`.\n\n```javascript\n$ ('#header'); // specify\
    \ the element identifying 'header'\n$ ('li'); // Select all menu items on the\
    \ page\n$ ('ul li'); // Select all of the menu items in unordered lists\n$('.person');\
    \ // select all elements of class 'person'\n```\n\nIt is important to understand\
    \ that any selection made will only include the corresponding elements of the\
    \ selector that were present at the moment you made the selection, meaning that\
    \ if you type `var anchors = $('a');` then you add an `<a>` element to the page\
    \ later, `Anchors` will not contain the new item.\n\n## Other ways to create a\
    \ jQuery object\n\nIn addition to passing a simple selector to the `$()` function,\
    \ jQuery objects can be created in other ways:\n\n```javascript\n// Create a jQuery\
    \ object from the DOM element\n$ (document.body.children [0]);\n\n// Create a\
    \ jQuery object from a list of DOM elements\n$ ([window, document]);\n\n// Select\
    \ the DOM element\nvar firstBodyChild = document.body.children [0];\n$ ('li',\
    \ firstBodyChild);\n\n// Make the selection within previous selection\nvar paragraph\
    \ = $ ('p');\n$ ('a', paragraph);\n```\n\n## Does your selection contain any elements?\n\
    \nSometimes you want to execute some commands when your selection matches one\
    \ or more elements, but the `$()` function always returns the jQuery object, and\
    \ that object is always truthy, so you should check the content of the selection\
    \ to see if it contains any elements.\n\n```javascript\nif ($ ('#nonexistent'))\
    \ {\n  // Error! Orders here will always be executed!\n}\n\nif ($ ('#nonexistent').length>\
    \ 0) {\n  // Right! The commands will not be executed here\n}\n```\n\nWe can shorten\
    \ this check further depending on whether 0 is a false value (falsy):\n\n```javascript\n\
    if ($ ('#nonexistent').length) {\n  // Orders will only be executed here if matching\
    \ object is found\n}\n```\n\n## Access individual items from a selection\n\nIf\
    \ you need to work with a raw DOM element from a selection, you must access this\
    \ element from the jQuery object. For example, suppose you want to access the\
    \ value attribute of the `<input>` object directly, then you need to manipulate\
    \ the raw DOM element:\n\n```javascript\nvar listItems = $ ('li');\nvar rawListItem\
    \ = listItems [0]; // or listItems.get (0)\nvar html = rawListItem.innerHTML;\n\
    ```\n\nNote that you cannot call jQuery functions on raw DOM elements. The following\
    \ example will not work:\n\n```javascript\nvar listItems = $ ('li');\nvar rawListItem\
    \ = listItems [0];\nvar html = rawListItem.html (); // Object <HTMLInputElement>\
    \ has no method 'html'\n```\n\nIf you want to work with a single element in a\
    \ selection and want to use jQuery functions with it, you must create a new jQuery\
    \ object from it using the `.eq()` function, and pass the element directory that\
    \ you want:\n\n```javascript\nvar listItems = $ ('li');\nvar secondListItem =\
    \ listItems.eq (1);\nsecondListItem.remove ();\n```\n\n## Create new objects\n\
    \nThe `$` function has a final third role: creating new elements. If you pass\
    \ the HTML snippet to `$()`, it will create a new object in memory, meaning that\
    \ the object is created but not added to the page until you do it yourself.\n\n\
    ```javascript\n$ ('<p>'); // Creates a <p> element with no content\n$ ('<p> Hello!\
    \ </p>'); // Create a <p> element with text\n```\n"
