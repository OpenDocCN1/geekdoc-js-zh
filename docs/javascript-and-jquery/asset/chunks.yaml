    \n## $.Deferred\n\n你可以使用 `$.Deferred()` 创建一个延迟对象。在接下来的示例中，我们在 `setTimeout` 内部实现了一个函数，然后“拒绝”（deny）我们的承诺以返回该函数产生的值。我们返回一个承诺（promise），这是一个可以附加回调函数的对象，但它不会影响延迟对象本身的结果。如果函数在执行期间出错，我们可以“拒绝”（reject）该承诺：\n\
    \n```javascript\nfunction doSomethingLater (fn, time) {\n  var dfd = $.Deferred\
