    \ li'\n);\n```\n\n## 返回原始选择\n\n当你使用它从当前选择移动到其他选择时，JQuery 会保留对原始选择的引用，以防你想要返回原始选择。例如，假设你选择了一个无序列表，然后你想修改菜单项，然后再次返回处理无序列表，这时你可以使用\
