    When we compare the value of NaN to false, we get a "wrong" value:


    var notANumber = ''four'' - ''five'';


    if (notANumber == false) {


      // This command will not be executed


      log (''notANumber was falsy'');


    } else {


      // This will be executed


      log (''notANumber was truthy'');


    }


    It is important to remember that all other values ​​except for the previous five
    are considered true, including empty matrices, blank objects and all non-empty
    text strings (including the text string ''0'') and all numbers except 0.


    Note: It is possible to write a conditional sentence in it if and else on one
    line without using the brackets, but this practice is not preferred because it
    makes reading and maintenance of the program more difficult; and what we mentioned
    here only because it may coincide with you when reading other developer programs.


    ## Logical Operators


    Logical operators allow an evaluation of both sides of the logical operation by
    executing the AND (&&) and OR (||) operations.


    var foo = 1;


    var bar = 0;


    var baz = 2;


    foo || bar; // returns 1, which is the correct value


    bar || foo; // returns 1, which is the correct value


    foo && bar; // returns 0 which is the wrong value


    foo && baz; // returns 2, which is the right value


    In the case of the parameter ||, the returned value is the first value to validate
    the sentence, or the last value. In the case of the && parameter, the returned
    value is the first value that proves the sentence error, or the last value.


    You might see Boolean operators being used smartly to control the flow of the
    program:


    foo && bar (); // Call the bar function only when foo is correct


    var bar = baz || createBar (); // Use baz as the value for bar, unless it is


                                   // false, and then create a bar


    This method is nice and brief, but it may make reading the program more difficult,
    especially for beginners. You have to learn it to know it in other people''s programs,
    but I advise you to stay away from using it at first, and use the traditional
    if and else because they are clearer.


    ## Ternary Operator


    Usually you want to set the value of a variable according to the validity or error
    of a condition, you can of course use if and else:


    Warning: undesirable style


    var propertyName;


    if (dim === ''width'') {


      propertyName = ''clientWidth'';


    } else {


      propertyName = ''clientHeight'';


    }


    However, the triple factor allows achieving the same goal in a shorter and clearer
    manner:


    var propertyName = (dim === ''width'')? ''clientWidth'': ''clientHeight'';


    Is the sentence investigated before? To find out its validity, if it is correct
    the first value (clientWidth) is assigned to the propertyName variable, otherwise
    the second value (clientWidth) is assigned to it.


    ## JavaScript bugs


    In addition to variable ranges and validation, there are many other bugs in JavaScript,
    and we''ll look at some of them.


    ## Name things


    Common names in JavaScript begin with a letter or a specific symbol, followed
    or not followed by letters, numbers, _ signs, or other symbols. Names cannot start
    with numbers or include the minus sign (-). Name the variables the names that
    you like as long as you adhere to these rules, and these names are all valid:


        a


        a1


        foo_bar


        fooBarBaz


        $ fooBar


        _foo


        __foo__


    The JavaScript community has developed some common usages for naming variables
    and properties in JavaScript, but they are just usages, they are not mandatory,
    and they do not affect the work of the program:


        Names that begin with _ usually refer to private values ​​(we will explain
    this later).


        Names that start with a capital letter are usually constructors used to create
    new versions of objects (we''ll explain that later as well).


        In programs that use jQuery, names that begin with the $ symbol usually refer
    to jQuery objects.


    ## Reserved words


    JavaScript reserves for itself some words that it is best to avoid as names for
    your software components:


    abstract boolean break byte case catch char class const continue debugger


    default delete do double else enum export extends false final finally float


    for function goto if implements import in instanceof int interface long


    native new null package private protected public return short static super


    switch synchronized this throw throws transient true try typeof var


    volatile void while with


    If it is to be used as the name of a particular object, you should enclose it
    with two quotation marks:


    var myObject = {


      ''class'': ''tasty''


    };


