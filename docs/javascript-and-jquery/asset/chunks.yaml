    $.ajax ({\n  url: '/data/search.jsonp',\n  data: {q: 'a'},\n  dataType: 'jsonp',\n\
    \  success: function (resp) {\n    $('#target').html('Results:' + resp.people.length);\n\
    \  }\n});\n```\n\nNote: Software interfaces usually provide an option to specify\
    \ the name of the function that surrounds the data in the link address. This is\
    \ usually the name of the callback parameter, and this is what jQuery initially\
    \ expects, but you can change it by setting a value for `jsonp` in the settings\
    \ object that you pass to `$.ajax()`.\n\nYou can also use the abbreviated `$.getJSON()`\
    \ function to send a JSONP request, where jQuery can distinguish it by having\
    \ a `callback =?` or something similar in the link:\n\n```javascript\n$.getJSON('/data/search.jsonp?q=a&callback=?',\
    \ function (resp) {\n  $('#target').html('Results:' + resp.people.length);\n});\n\
    ```\n"
  raw: 'In the previous example, the function requires only the link, but adding the
    Settings object allows us to tell jQuery what type of data we send, what HTTP
    verb we use (POST, GET, etc. ...), and what type of data we expect to receive
    from the server, and what What to do if the request succeeds or fails ...


    See the job documentation $ .ajax () to read all of the options that can be added
    to the settings object.


    ## A in AJAX means "asynchronous"


    AJAX requests are executed asynchronously, which means that the $ .ajax function
    ends before the request ends, and before the success function is called, meaning
    that the return statement is executed before the answer to the request arrives.
    The getSomeData function in the following example will return the data value before
    it is defined, which results in an error:


    Warning: invalid script


    var getSomeData = function () {


      var data;


      $ .ajax ({


        url: ''/data/people.json'',


        dataType: ''json'',


        success: function (resp) {


          data = resp.people;


        }


      });


      return data;


    }


    $ (''#target'') .html (getSomeData (). people [0] .name);


    ## X in AJAX means JSON!


    The term AJAX was introduced in 2005 to describe a method for retrieving data
    from the server without requiring a full page reload. At that time, the most common
    form of data sent by servers was XML, and today, JSON is the format adopted by
    most modern applications.


    Basically, JSON is a string that represents data, and looks very similar to a
    regular JavaScript object, but it cannot represent all kinds of data that a JavaScript
    object can represent. For example: JSON cannot represent Date objects or functions.
    Here is an example of a JSON text, note how all property names are enclosed in
    double quotes:


    {"people": [


      {


        "name": "Ben",


        "url": "http://benalman.com/",


        "bio": "I create groovy websites, useful jQuery plugins, and play a mean funk
    bass. I''m also Director of Pluginization at @bocoup."


      },


      {


        "name": "Rebecca",


        "url": "http://rmurphey.com",


        "bio": "Senior JS dev at Bocoup"


      },


      {


        "name": "Jory",


        "url": "http://joryburson.com",


        "bio": "super-enthusiastic about open web education @bocoup. lover of media,
    art, and fake mustaches."


      }


    ]}


    Remember that JSON is a text representation of an object, which means that the
    text string must be interpreted to convert it into a regular JavaScript object
    before working with it. When you work with a JSON-formatted response from the
    server, jQuery does this for you. But it is important to distinguish between actual
    beings and how they are represented in JSON.


    Note: If you want to create a JSON text string from a JavaScript object or interpret
    a JSON text string to convert it into a JavaScript object without the use of jQuery,
    modern browsers offer the functions JSON.stringify () and JSON.parse (), and these
    properties can be added to Old browsers using json2.js library. JQuery also provides
    the jQuery.parseJSON () function, which corresponds to the JSON.parse () function
    in browsers, but it does not provide a function that corresponds to JSON.stringify
    ().


    ## Short functions


    If all we want is to send a simple request, without being concerned with dealing
    with any errors that may occur, jQuery provides short functions that allow us
    to do so. Each abbreviated function receives a link and a non-mandatory settings
    object, and a function is called only upon successful request:


    $ .get (''/data/people.html'', function (html) {


      $ (''#target'') .html (html);


    });


    $ .post (''/ data / save'', {name: ''Rebecca''}, function (resp) {


      console.log (resp);


    });


    ## Submit data and work with forms


    We can send data with our request to set a value for the data in the settings
    object, or pass an object as a second parameter to the shortcuts.


    This data will be added to the link in the GET requests as a query string, while
    in the POST requests it will be sent as form data. JQuery provides a useful function
    .serialize () that receives form entries and converts them to a query syntax (such
    as field1name = field1value & field2name = field2value ...):


    $ (''form'') .submit (function (event) {


      event.preventDefault ();


      var form = $ (this);


      $ .ajax ({


        type: ''POST'',


        url: ''/ data / save'',


        data: form.serialize (),


        dataType: ''json'',


        success: function (resp) {


          console.log (resp);


        }


      });


    });


    ## JqXHR


    $ .Ajax () and its associated shortcuts, return the jqXHR (abbreviation for jQuery
    XML HTTP Request) which contains many useful functions. We can send a request
    using $ .ajax () and then save the jqXHR object to a variable:


    var req = $ .ajax ({


      url: ''/data/people.json'',


      dataType: ''json''


    });


    We can use this element to link return calls to the request, even after the request
    is complete. For example, we can use the .then () function (then) to attach my
    summons to the success of the request and its failure, because .then () is accepted
    as a function or two, the first is called upon the success of the request, and
    the second if it fails:


    var success = function (resp) {


      $ (''#target'') .append (


        ''<p> people:'' + resp.people.length + ''</p>''


      );


      console.log (resp.people);


    };


    var err = function (req, status, err) {


      $ (''#target'') .append (''<p> something went wrong </p>'');


    };


    req.then (success, err);


    req.then (function () {


      $ (''#target'') .append (''<p> it worked </p>'');


    });


    We can call .then () on the request object as much as we like, and the return
    calls will be executed in the same order in which they are attached.


    If we do not want to attach the success and failure summonses together, we can
    use the .done () and .fail () functions on the request object:


    req.done (success);


    req.fail (err);


    If we want to attach a recursion call that is always executed, regardless of the
    success or failure of the request, we can use the .always () function on the request
    object:


    req.always (function () {


      $ (''#target'')


        .append (''<p> one way or another, it is done now </p>'');


    });


    ## JSONP


    Many beginners in JavaScript are surprised by the failure of the XHR requests
    that they send to another domain on the Internet. For example: Some developers
    try to fetch data from a third-party API, to be surprised by the failure of the
    request constantly.


    The reason for this is that browsers do not allow XHR requests to be sent to other
    Internet domains for security reasons, but some APIs return data in JSONP format
    (short for JSON with Padding), which allows developers to fetch data bypassing
    the browser block.


    The truth is that JSONP is not actually an AJAX request, as it does not use the
    XHR request provided by the browser, but rather works by inserting a <script>
    tag in the web page, which in turn contains the required data, surrounded by a
    function that returns this data when called. This detail is not important now,
    because jQuery allows you to request JSONP as if it were XHR using the $ .ajax
    () function by setting the dataType data type to ''jsonp'' in the Settings object.


    $ .ajax ({


      url: ''/data/search.jsonp'',


      data: {q: ''a''},


      dataType: ''jsonp'',


      success: function (resp) {


        $ (''#target'') .html (''Results:'' + resp.results.length);


      }


    });


    Note: Software interfaces usually provide an option to specify the name of the
    function that surrounds the data to be called in the link address. This is usually
    the name of the callback parameter, and this is what jQuery initially expects,
    but you can change it by setting a value for jsonp in the settings object that
    you pass to $ .ajax ().


    You can also use the abbreviated $ .getJSON () function to send a JSONP request,
    where jQuery can distinguish it by having a callback =? Or something similar in
    the link:


    $ .getJSON (''/data/search.jsonp?q=a&callback=?'',


      function (resp) {


        $ (''#target'') .html (''Results:'' + resp.results.length);


      }


    );'
