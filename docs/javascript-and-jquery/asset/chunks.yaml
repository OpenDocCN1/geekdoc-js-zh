    \ of a simple conditional (`if`) clause in JavaScript. The sentence checks the\
    \ validity of the number 1, and because 1 is a \"truthy\" value, the script in\
    \ brackets `{}` will be executed after the `if` statement.\n\n```javascript\n\
    if (1) {\n  // This will be executed\n  log ('1 is truthy');\n}\n```\n\nThe truth\
    \ is that most of the values in JavaScript are \"true\", and only five values\
    \ in the language are considered \"false\" (falsy):\n\n- `undefined` (the initial\
    \ value of each variable is imposed without assigning a value to it)\n- `null`\n\
    - `NaN` (not a number)\n- `0` (number zero)\n- `\"\"` (Empty text string)\n\n\
    When we want to check a value for an \"error\", we use the parameter `!`:\n\n\
    ```javascript\nvar a = '';\nif (! a) {\n  // This command will not be executed\
    \ if it is a correct one\n  log ('a was falsy');\n}\n```\n\nAs for the value of\
    \ `NaN`, it has a special situation. When it is checked in a simple conditional\
    \ statement, it is false:\n\n```javascript\nvar notANumber = 'four' - 'five';\n\
    if (! notANumber) {\n  // This will be done\n  log ('! notANumber was truthy');\n\
    }\n```\n\nWhen we compare the value of `NaN` to false, we get a \"wrong\" value:\n\
    \n```javascript\nvar notANumber = 'four' - 'five';\nif (notANumber == false) {\n\
    \  // This command will not be executed\n  log ('notANumber was falsy');\n} else\
    \ {\n  // This will be executed\n  log ('notANumber was truthy');\n}\n```\n\n\
    It is important to remember that all other values except for the previous five\
    \ are considered true, including empty matrices, blank objects and all non-empty\
    \ text strings (including the text string '0') and all numbers except 0.\n\nNote:\
    \ It is possible to write a conditional sentence in it `if` and `else` on one\
    \ line without using the brackets, but this practice is not preferred because\
    \ it makes reading and maintenance of the program more difficult; and what we\
    \ mentioned here only because it may coincide with.\n\n## Logical Operators\n\n\
    Logical operators allow evaluation of both sides using `&&` and `||`:\n\n```javascript\n\
    var propertyName = 1;\nvar bar = 0;\nvar baz = 2;\n```\n\nIn the case of `&&`,\
    \ the first value is returned. In the case of `||`, the last value is returned.\
    \ You might see operators used to control the flow:\n\n```javascript\nfoo && bar\
    \ // returns 0\nbar || baz // returns 2\nfoo && baz // returns 2\nbar || foo //\
    \ returns 1\n```\n\nNote: The `&&` operator is short-circuiting; if the first\
    \ operand is false, the second is not evaluated. The `||` operator is also short-circuiting;\
    \ if the first operand is truthy, the second is not evaluated.\n\n## Ternary Operator\n\
    \nUsually you want to set the value of a variable according to the validity of\
    \ a condition using `if` and `else`:\n\nWarning: undesirable style\n\n```javascript\n\
    var propertyName;\nif (dim === 'width') {\n  propertyName = 'clientWidth';\n}\
    \ else {\n  propertyName = 'clientHeight';\n}\n```\n\nHowever, the ternary factor\
    \ allows achieving the same goal in a shorter manner:\n\n```javascript\nvar propertyName\
    \ = (dim === 'width') ? 'clientWidth' : 'clientHeight';\n```\n\n## JavaScript\
    \ bugs\n\nIn addition to variable ranges, there are many other bugs in JavaScript,\
    \ and we'll look at some of them.\n\n## Name things\n\nCommon names in JavaScript\
    \ begin with a letter or a specific symbol, followed or not followed by letters,\
    \ numbers, `_`, or other symbols. Names cannot start with numbers or include the\
    \ minus sign `-`. Name the variables the names you like as long as you adhere\
    \ to these rules, and these names are all valid:\n\n- `a`\n- `a1`\n- `foo_bar`\n\
    - `fooBaz`\n- `$ fooBar`\n- `_foo`\n- `__foo__`\n\nThe JavaScript community has\
    \ developed some common usages for naming variables and properties in JavaScript,\
    \ but they are just usages, they are not mandatory, and they do not affect the\
    \ work of the program:\n\n- Names that begin with `_` usually refer to private\
    \ values (we will explain this later).\n- Names that start with a capital letter\
    \ are usually constructors used to create new versions of objects (we'll explain\
    \ that later).\n- In programs that use jQuery, names that begin with the `$` symbol\
    \ usually refer to jQuery objects.\n\n## Reserved words\n\nJavaScript reserves\
    \ for itself some words that it is best to avoid as names for your software components:\n\
    \n`abstract`, `boolean`, `break`, `byte`, `case`, `char`, `class`, `const`, `continue`,\
    \ `debugger`, `default`, `delete`, `do`, `double`, `else`, `enum`, `export`, `extends`,\
    \ `false`, `final`, `finally`, `float`, `for`, `function`, `goto`, `if`, `implements`,\
    \ `import`, `in`, `instanceof`, `int`, `interface`, `instance`, `long`, `native`,\
    \ `new`, `null`, `package`, `private`, `protected`, `public`, `return`, `short`,\
    \ `static`, `super`, `switch`, `synchronized`, `this`, `throw`, `throws`, `transient`,\
    \ `true`, `try`, `typeof`, `var`, `volatile`, `void`, `while`, `with`.\n\nIf it\
    \ is to be used as the name of a particular object, you should enclose it with\
    \ two quotation marks:\n\n```javascript\nvar myObject = {\n  'class': 'tasty'\n\
    };\n```\n"
