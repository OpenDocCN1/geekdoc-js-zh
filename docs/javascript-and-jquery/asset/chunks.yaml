  trans: "\n在上一部分（jQuery 基础）中，我们讨论了读取和写入函数的概念。所有可以用于更改元素的函数也可以用于从这些元素中读取信息。例如，我们上面描述的\
    \ `.val()` 函数既可以作为读取函数，也可以作为写入函数：\n\n```javascript\nvar input = $ ('input [type\
    \ = \"text\"]');\ninput.val ('new value');\ninput.val (); // 返回 'new value'\n\
    ```\n\n同样适用于 `.css()` 函数，因为你可以通过传递私有属性的名称而不传递值，来读取单个 CSS 属性的值：\n\n```javascript\n\
    var listItemColor = $ ('li') .css ('color');\nvar listItemColor = $ ('li') .css\
    \ ('color');\n```\n\n当使用读取处理函数时，它们仅对选择器中的第一个元素起，但 `.text()` 函数除外，如果没有向它传递任何参数，它会读取所有选中元素的文本内容。\n\
    \n## 向页面添加项目\n\n无论你是选择一个现有元素还是创建一个新元素，你都可以将该元素添加到页面中。这可以通过两种方式实现：为要添加的元素（或元素组）调用跟踪函数，或者调用你想要添加的关联对象的跟踪函数。\n\
    \n例如，假设你想将列表中的一个项目从头部移动到尾部，有几种方法可以实现。\n\n例如，你可以通过在菜单项本身上调用 `.appendTo()` 函数将项目添加到列表：\n\
    \n```javascript\nvar listItem = $ ('# my-unordered-list li') .first ();\nlistItem.appendTo\
    \ ('# my-unordered-list');\n```\n\n你也可以通过在菜单上调用 `.append()` 来添加项目：\n\n```javascript\n\
    var listItem = $ ('# my-unordered-list li') .first ();\n$ ('# my-unordered-list')\
    \ .append (listItem);\n```\n\n或者通过在要移动的项目上调用 `.insertAfter()` 来添加，将列表中的最后一个项目传递给函数：\n\
    \n```javascript\nvar listItems = $ ('# my-unordered-list li');\nlistItems.first\
    \ (). insertAfter (listItems.last ());\n```\n\n或者通过在列表最后一个项目上调用 `.after()` 来添加，将列表中的第一个项目传递给函数：\n\
    \n```javascript\nvar listItems = $ ('# my-unordered-list li');\nlistItems.last\
    \ (). after (listItems.first ());\n```\n\n还有许多其他添加项目的方法，因此你可以根据需要将它们添加到其他元素的周围、内部或外部。\n\
    \n向页面添加项目最高效的方法取决于你手中已有的元素。如果你之前为了其他目的选择了该无序列表，那么你可能想将该元素添加到上一个示例中的无序列表中；或者，如果你已经选择了列表中的所有项目，将第一个元素添加到最后一个项目之后可能会更简单。\n\
    \n当你选择合适的添加元素方法时，不仅要考虑该方法的易用性，还要考虑其日后维护的可能性。避免使用那些依赖于假设页面具有严格定义结构的方法，因为你可能会在以后更改这种结构。\n\
    \n## 复制项目\n\n你可以使用 jQuery 中的 `.clone()` 函数创建一个元素或一组元素的副本，它会在内存中创建副本而不会包含在页面中，如果你需要，应该手动将其包含。。在添加复制的项目之前，你可以对它们进行编辑：\n\
    \n```javascript\nvar clones = $ ('li') .clone ();\nclones.html (function (index,\
    \ oldHtml) {\n  return oldHtml + '!!!';\n});\n$ ('# my-unordered-list') .append\
    \ (clones);\n```\n\n注意：jQuery 不阻止你复制带有标识符（ID）的元素，但你必须在将其插入文档之前，通过修改 `id` 属性来删除或更改复制元素中的标识符，因为页面上不应该有两个相同标识符的元素。\n\
    \n## 删除项目\n\n从页面移除项目有三种方法：`.remove()`、`.detach()` 和 `.replaceWith()`，它们都有不同的用途。\n\
    \n当需要永久删除对象时，必须使用 `.remove()`，因为它会连同对象一起删除与其相关的事件处理器。`.remove()` 函数返回被删除项目的引用，但当你再次添加这些项目时，将没有事件绑定到它们上。\n\
    \n```javascript\n$ ('# my-unordered-list li') .click (function () {\n  alert ($\
    \ (this) .text ());\n});\nvar removedListItem = $ ('# my-unordered-list li') .first\
    \ (). remove ();\nremovedListItem.appendTo ('# my-unordered-list');\nremovedListItem.trigger\
    \ ('click'); // 没有弹出消息！\n```\n\n`.detach()` 函数适用于临时从页面中移除项目。例如，如果你想使用 jQuery 对页面结构进行重大更改，从页面中删除项目可能是暂时的，分阶段删除并重新添加性能会更好。被删除的项目将保留关联的事件触发器，然后可以使用\
    \ `.appendTo()`或其他添加函数再次将其添加到页面。\n\n```javascript\n$ ('# my-unordered-list li')\
    \ .click (function () {\n  alert ($ (this) .text ());\n});\nvar detachedListItem\
    \ = $ ('# my-unordered-list li') .first (). detach ();\n// 对菜单项进行一些操作\ndetachedListItem.appendTo\
    \ ('# my-unordered-list');\ndetachedListItem.trigger ('click'); // 弹出！\n```\n\n\
    最后，我们有 `.replaceWith()` 函数，它用元素或其他元素替换元素或 HTML 文本。被移除的项目会被返回，但所有相关的事件处理器都会删除。\n\
    \n```javascript\n$ ('# my-unordered-list li') .click (function () {\n  alert ($\
    \ (this) .text ());\n});\nvar replacedListItem = $ ('# my-unordered-list li')\
    \ .first ()\n  .replaceWith ('<li>new!</li>');\n// 示例结束\n```\n\n## 总结\n\n在本章中，我们学习了移动元素、更改元素以及添加元素的不同方法。在下一章，我们将学习如何监听用户交互。\n\
    \n# 第三章：jQuery 事件以及如何委托它们\n\njQuery 使得响应网页的用户交互变得简单。这意味着当用户点击页面特定部分时执行命令，或者当鼠标指针悬停在某个项目上时。在下面的示例中，我们有一个在用户点击任何项目时执行的命令：\n\
    \n```javascript\n$ ('li') .click (function (event) {\n  console.log ('clicked',\
    \ $ (this) .text ());\n});\n```\n\njQuery 为事件提供了多个快捷方式，每个函数都对应一个原始 DOM 事件：\n\n\
    | 原始事件名称 | 快捷函数 |\n| --- | --- |\n| click | `.click()` |\n| keydown | `.keydown()`\
    \ |\n| keypress | `.keypress()` |\n| keyup | `.keyup()` |\n| mouseover | `.mouseover()`\
    \ |\n| mouseout | `.mouseout()` |\n| mouseenter | `.mouseenter()` |\n| mouseleave\
    \ | `.mouseleave()` |\n| scroll | `.scroll()` |\n| focus | `.focus()` |\n| blur\
    \ | `.blur()` |\n| resize | `.resize()` |\n\n这些快捷方式使用了背后的 `.on()` 函数，你可以自己使用该函数以获得更大的灵活性。当你使用它时，将原始事件名称作为任务的第一个参数，并将接管事件的函数作为第二个参数：\n\
    \n```javascript\n$ ('li') .on ('click', function (event) {\n  console.log ('clicked',\
    \ $ (this) .text ());\n});\n```\n\n一旦你将事件的赞助者连接到元素，你也可以向 jQuery 触发此事件：\n\n```javascript\n\
    $ ('li'). trigger ('click');\n```\n\n而且如果你想起的事件有一个快捷函数（如上表所示），你可以通过直接调用该快捷函数本身来挑起事件：\n\
    \n```javascript\n$ ('li') .click ();\n```\n"
- fmt: "\nNote: When you trigger an event with `.trigger()`, you only call event handlers\
    \ generated in JavaScript and do not invoke the default behavior of the event.\
    \ For example, if the click event affects the link (`<a>` element), the browser\
    \ will not go to the link assigned to it in the `href` attribute (although you\
    \ can write commands that implement this purpose).\n\nAfter you link an event\
    \ to an object, you can unsubscribe it using the `.off()` function, which removes\
    \ any threads associated with this event:\n\n```javascript\n$('li') .off ('click');\n\
    ```\n\n## Confine the events within the namespace\n\nOne of the advantages offered\
    \ by `.on()` is the ability to limit events to the \"namespace\". You may wonder\
    \ about the need for this. For example, suppose you want to associate some events\
    \ with an element, and then remove some of the threads, you can do what we did\
    \ in the previous paragraph:\n\nWarning: software style is not preferred\n\n```javascript\n\
    $('li') .on ('click', function () {\n  console.log ('a list item was clicked');\n\
    });\n\n$('li') .on ('click', function () {\n  registerClick ();\n  doSomethingElse\
    \ ();\n});\n\n$('li') .off ('click');\n```\n\nHowever, this method will remove\
    \ all the threads of clicking all menu items, and this is not what we want. If\
    \ you linked a event handler confined to a namespace, you can target it accurately:\n\
    \n```javascript\n$('li') .on ('click.logging', function () {\n  console.log ('a\
    \ list item was clicked');\n});\n\n$('li') .on ('click.analytics', function ()\
    \ {\n  registerClick ();\n  doSomethingElse ();\n});\n\n$('li') .off ('click.logging');\n\
    ```\n\nThis method does not affect click-related events related to the usage statistics\
    \ page, while it removes log-related click events.\n\nWe can use the inventory\
    \ feature to trigger specific events:\n\n```javascript\n$('li') .trigger ('click.logging');\n\
    ```\n\n## Connect multiple events simultaneously\n\nAnother feature offered by\
    \ `.on()` is the ability to link multiple events simultaneously. For example,\
    \ suppose you want to execute a specific command when the user scrolls the page\
    \ or changes the window size. This function allows you to pass the two events\
    \ together separated by a space in a text string, followed by the function that\
    \ you want to handle the two events:\n\n```javascript\n$('input [type = \"text\"\
    ]') .on ('focus blur', function () {\n  console.log ('The user focused or blurred\
    \ the input');\n});\n\n$(window) .on ('resize.foo scroll.bar', function () {\n\
    \  console.log ('The window has been resized or scrolled!');\n});\n```\n\n## Pass\
    \ the functions named events\n\nIn all of our previous examples, we used to pass\
    \ unknown functions as triggers for events, but we can create a function before\
    \ passing it and storing it in a variable and then passing this variable as the\
    \ event handlers. This is useful if you want to use the same function to handle\
    \ different events or events from different elements:\n\n```javascript\nvar handleClick\
    \ = function () {\n  console.log ('something was clicked');\n};\n\n$('li') .on\
    \ ('click', handleClick);\n\n$('h1') .on ('click', handleClick);\n```\n\n## Event\
    \ object\n\nEach time an event is raised, the function that handles the event\
    \ receives one parameter, which is the event object that follows criteria agreed\
    \ upon by all browsers. This object has many beneficial properties, including:\n\
    \n```javascript\n$(document) .on ('click', function (event) {\n  console.log (event.type);\
    \ // event type, like: \"click\"\n  console.log (event.which); // The button or\
    \ key that was pressed\n  console.log (event.target); // The element from which\
    \ the event originated\n  console.log (event.pageX); // Mouse position on X axis\n\
    \  console.log (event.pageY); // Mouse position on Y axis\n});\n```\n\n## Inside\
    \ the sponsors\n\nWhen you specify the running function of an event, that function\
    \ has access to the raw DOM element that launched the event as the context of\
    \ this function, if you want to use jQuery to manipulate the event, enclose it\
    \ in `$`:\n\n```javascript\n$('input') .on ('keydown', function (event) {\n  //\
    \ this: the raw element that triggered the event\n  // event: the event object\n\
    \  // Change the background color to red if you press the erase button, or to\
    \ green, otherwise\n  $(this) .css ('background', event.which === 8? 'red': 'green');\n\
    });\n```\n\n## Preventing initial behavior\n\nSometimes you may want to prevent\
    \ the initial behavior of an event, such as wanting to click on a link using AJAX,\
    \ instead of starting a full page reload (which is the initial behavior). Many\
    \ developers reach this goal by returning false from the sponsors of the event,\
    \ but this has another side effect: it also prevents the spread of the event (we'll\
    \ explain it shortly), which may produce undesirable results. The proper way to\
    \ prevent the initial behavior of an event is by calling `.preventDefault()` on\
    \ the event object:\n\n```javascript\n$('input') .on ('keydown', function (event)\
    \ {\n  // this: the raw element that triggered the event\n  // event: the event\
    \ object\n  // Change the background color to red if you press the erase button,\
    \ or to green, otherwise\n  $(this) .css ('background', event.which === 8? 'red':\
    \ 'green');\n});\n```\n\n## Event bubbling\n\nConsider the following code:\n\n\
    ```javascript\n$('a') .on ('click', function (event) {\n  // Prevent the initial\
    \ event.\n  event.preventDefault ();\n  // Record what happened.\n  console.log\
    \ ('I was just clicked!');\n});\n```\n\nThis text links in hand to click on all\
    \ the elements on the page (which you should not do permanently in the actual).\
