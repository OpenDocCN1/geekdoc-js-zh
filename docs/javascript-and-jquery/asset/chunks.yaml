    requests. However, it is not supported in older browsers, it also requires a special
    configuration on the server and the modification of application headers in XHR
    to work.


    ## Deferred objects


    The jqXHR objects we have identified are nothing but a special "flavor" of what
    is known as "deferred organisms". JQuery allows you to create deferred objects
    on your own, which can be used to facilitate dealing with asynchronous commands.
    It provides a way to respond to a process that runs asynchronously after its success
    or failure, and avoids the need to write interlaced callbacks between them.


    ## $ .Deferred


    You can create a delayed object with $ .Deferred (). In the following example
    we implement a function inside setTimeout, then "deny" our promise to return the
    value that this function returns. We return a promise, an object to which recalls
    can be attached, but it does not affect the outcome of the deferred object itself.
    We can "reject" a promise if something goes wrong while the function is working:


    function doSomethingLater (fn, time) {


      var dfd = $ .Deferred ();


      setTimeout (function () {


        dfd.resolve (fn ());


      }, time || 0);


      return dfd.promise ();


    }


    var promise = doSomethingLater (function () {


      console.log (''This function will be called in 100ms'');


    }, 100);


    .Then (), .done (), .fail (), and .always ()


    We can link functions that handle errors and successes with promises, just as
    in jqXHR objects:


    function doSomethingLater (fn, time) {


      var dfd = $ .Deferred ();


      setTimeout (function () {


        dfd.resolve (fn ());


      }, time || 0);


      return dfd.promise ();


    }


    var success = function (resp) {


      $ (''#target'') .html (''it worked'');


    };


    var err = function (req, status, err) {


      $ (''#target'') .html (''it failed'');


    };


    var dfd = doSomethingLater (function () {/ * ... * /}, 100);


    dfd.then (success, err);


    ## .Pipe ()


    We can use the .pipe () function to make promises to respond to the lost value
    by modifying it and then returning a new delayed object.


    The .then () function works from jQuery version 1.8 and the .pipe () function
    works.


    function doSomethingLater (fn, time) {


      var dfd = $ .Deferred ();


      setTimeout (function () {


        dfd.resolve (fn ());


      }, time || 0);


      return dfd.promise ();


    }


    var dfd = doSomethingLater (function () {return 1;}, 100);


    dfd


      .pipe (function (resp) {return resp + '''' + resp;})


      .done (function (upperCaseResp) {


        $ (''#target'') .html (upperCaseResp);


      });


    ## Dealing with operations that may be asynchronous


    Sometimes we have a job that may work simultaneously or not simultaneously according
    to specific circumstances, for example: a function that performs an asynchronous
    operation the first time it is called, and then stores the value that the process
    produced to return it directly when called in the future. In this case, we can
    use $ .when () to respond to both cases:


    function maybeAsync (num) {


      var dfd = $ .Deferred ();


      // Promise a hold back when num === 1


      if (num === 1) {


        setTimeout (function () {


          dfd.resolve (num);


        }, 100);


        return dfd.promise ();


      }


      // End immediately, returning num


      return num;


    }


    // This will be done asynchronously and promise to return 1


    $ .when (maybeAsync (1)) .then (function (resp) {


      $ (''#target'') .append (''<p>'' + resp + ''</p>'');


    });


    // This will return 0 directly


    $ .when (maybeAsync (0)) .then (function (resp) {


      $ (''#target'') .append (''<p>'' + resp + ''</p>'');


    });


    You can also pass more than one parameter to $ .when (), which allows you to combine
    concurrent and asynchronous operations together and then get the results of all
    of them executed as parameters of the callback:


    function maybeAsync (num) {


      var dfd = $ .Deferred ();


      // Make a delayed promise when num === 1


      if (num === 1) {


        setTimeout (function () {


          dfd.resolve (num);


        }, 100);


        return dfd.promise ();


      }


      // End it directly, otherwise, returning num


      return num;


    }


    $ .when (maybeAsync (0), maybeAsync (1))


      .then (function (resp1, resp2) {


        var target = $ (''#target'');


        target.append (''<p>'' + resp1 + ''</p>'');


        target.append (''<p>'' + resp2 + ''</p>'');


      });


    When a parameter of $ .when () is a jqXHR object, we get an array of parameters
    that passes to our recursion:


    function maybeAsync (num) {


      var dfd = $ .Deferred ();


      // Make a delayed promise when num === 1


      if (num === 1) {


        setTimeout (function () {


          dfd.resolve (num);


        }, 100);


        return dfd.promise ();


      }


      // End it directly, otherwise, returning num


      return num;


    }


    $ .when (maybeAsync (0), $ .get (''/data/people.json''))


      .then (function (resp1, resp2) {


        console.log ("Both operations are done", resp1, resp2);


      });


    # Chapter V


    # How to Create a Moveable Slideshow with jQuery


    Regardless of what your website is, unless you add a JavaScript slideshow that
    performs all its functions in high quality, you have narrowed the gap between
    your business and your target customers. JavaScript slideshows have served a great
    deal as web page add-ons, as it is a great way to display lots and lots of information
    in a relatively small space. If these details are enough to entice you to create
    your own slide show presentation using JavaScript (with sliding panels) then you
    are in the right place to learn this. In this lesson, we will share some simple,
    easy-to-take steps to create a JavaScript slide show.


    ![](Images/image00162.jpeg)


    ## Explain the steps in this lesson for creating a JavaScript slide show


    In this lesson, I will use simple HTML and CSS codes to create a slideshow appearance
    while sliding functionality will be implemented using jQuery, a JavaScript library.
    I will also use two widely spread extensions: LocalScroll and ScrollTo to present
    the effects inherent in a JavaScript slide show. The first addition allows the
    link to override the slideshow to a specific slice based on the ID that has been
    defined. While the second addition offers excellent sliding functions, it provides
    the advantage of moving between slices instead of jumping from one slide to the
    other.


    Since we will take basic access parameters into account when building a slide
    show, each user will be able to navigate and display the slides even when JavaScript
    stops working.


    Here''s a look at the HTML structure for slideshows:


