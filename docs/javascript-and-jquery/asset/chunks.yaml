    # Chapter III


    # JQuery events and how to delegate them


    JQuery has made it easy to respond to user interaction with web pages. This means
    that you can execute a command when the user clicks on a specific part of the
    page, or when the mouse pointer hovers over an item in a form, for example. In
    the following example, we have a command that executes when the user clicks any
    menu item on the page:


    $ (''li'') .click (function (event) {


      console.log (''clicked'', $ (this) .text ());


    });


    The preceding text identifies all menu items and assigns them a function to handle
    the click event for each item, using the .click () function in jQuery.


    JQuery provides several shortcuts for linking events, and each of these functions
    corresponds to an original DOM event:


    | The original event name&#124; | Short function |


    | --- | --- |


    | ‏click‎ | .click() |


    | ‏keydown | .keydown() |


    | ‏keypress | .keypress() |


    | ‏keyup | .keyup() |


    | ‏mouseover | .mouseover() |


    | ‏mouseout | .mouseout() |


    | ‏mouseenter | .mouseenter() |


    | ‏mouseleave | .mouseleave() |


    | ‏scroll | .scroll() |


    | ‏focus | .focus() |


    | ‏blur | .blur() |


    | ‏resize | .resize() |


    These shortcuts use the behind-the-scenes .on function, a function that you can
    use yourself for more flexibility. When you use it, you pass the name of the original
    event as the first parameter of the job, then a function that takes over the event
    as a second parameter:


    $ (''li'') .on (''click'', function (event) {


      console.log (''clicked'', $ (this) .text ());


    });


    Once you have “connected” the event''s sponsor to an element, you can spark this
    event to jQuery as well:


    $ (''li''). trigger (''click'');


    And if the event that you want to raise has a brief function (as mentioned in
    the previous table), you can provoke the event by calling the brief function itself:


    $ (''li'') .click ();'
