  trans: "\n\n```\n// 我们在这里使用了 throttle（节流），以确保事件触发频率不会超过一次（默认情况下，每个被最小化的部分都会触发事件，在这里我们等到缩放完成后再启动）\n\
    \n.resize ($. throttle (250, function () {\n    setWidths ();\n    repositionStickyHead\
    \ ();\n    repositionStickyCol ();\n})\n\n// # 5: 当窗口向下滚动时\n// 我们使用了 throttle，防止函数被频繁启动\n\
    .scroll ($. throttle (250, repositionStickyHead);\n```\n\n我们已经走到这一步了！\n\n## 辩论\n\
    \n我们知道没有什么是是完美的，因此我们将讨论一下其他比这种方法更具优势的方法，以及这种方法的优缺点，以及为什么我们没有使用这种方法。\n\n## 使用 position:\
    \ fixed\n\n使用这种方法看起来很有吸引力，原因有两个：\n\n1. 表格表头不需要计算，因为固定元素位于物理页面之外，并将保持在原位。\n2. 我们避免了缓慢的计算，因为固定元素是在追随表格而不是与其粘合，这是因为我们在固定的周期内（通过\
    \ `throttle`）进行计算，因此固定元素看起来似乎没有响应，从而显得不正常。\n\n但这种方法的问题在于，我们将元素从页面流中移除了。如果表格宽度超过了允许的宽度并有必要添加滚动条，表头将不会在水平轴上附加内容，因为它固定在页面上。这就是我们不允许使用大多数提供此类功能的\
    \ `jQuery` 插件的重要原因。我写这门课程正是为了解决这个问题。\n\n## 使用 position: sticky\n\n这个新功能非常适合这个问题，事实上，我开发它就是为了这个问题考虑的。问题是\
    \ Chrome 浏览器不支持它（以前支持，但后来被完全移除了），因此我们丢失了所有来自该浏览器的访问者。\n\n"
