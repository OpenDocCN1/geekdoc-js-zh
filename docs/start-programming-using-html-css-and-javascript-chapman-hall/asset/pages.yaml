    # B.2 Local Data Storage through Web Storage


    As soon as you''re connected to the web, there are two places where you can store
    your data: on the web server (server-side) or on your own computer (client-side).
    Both have their pros and cons, and you''ll learn which type of storage works best
    for which purpose as you progress in your web programming proficiency. However,
    as you can read in the paragraph about security concerns later in this section,
    sensitive data definitely belongs to a web server and not to a client computer.


    Web applications and web documents can improve tremendously if you furnish them
    with some-client side media. You can use web pages to store such user preferences
    or even save the complete state of the page, your visitor finds a way as easily
    as he/she left at the end of his/her last visit. In the early days of the Internet,
    storing data was only possible on a server. This was soon recognized as a drawback
    because of excessive storage and retrieval on servers. As early as 1994, Netscape
    Communications used cookies (a type of client-side data storage) to implement
    a reliable virtual shopping cart to store items a user selected from different
    pages of a site, possibly across multiple visits. Online shopping sites today
    exclusively store selected items in a database on the server. However, local data
    storage capability has become indispensable, especially when it comes to running
    applications offline. This makes web applications work and feel more like real
    applications.


    For a long time, cookies were the only client-side data storage mechanism around.
    However, they were designed for server-side scripts and it was quite awkward to
    utilize them from client-side programs. As the HTML5 Web Storage API became universally
    available, cookies slowly turned to their initial role as a client-side storage
    instrument


    Apart from the Web Storage, there exist some other local storage technologies,
    none of them succeeded in getting the level of standardization to work with Web
    did. The potentially exciting Filesystem API, conceptualized to work with a private
    local filesystem using file-based storage mechanisms familiar to most programmers,
    was pronounced dead in April 2014 because of little interest shown by the majority
    of browsers. Also of interest is that a client-side database support, which standardization
    efforts also failed and is not implemented equally in all browsers.'
