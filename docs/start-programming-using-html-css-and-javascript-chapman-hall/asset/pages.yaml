    +   • If you invoke an animation method on an already animated element, then the
    new effect is put into an animation queue and is not animated until all the effects
    are completed. Now, however, that each element has its own animation queue.


    There exist nine basic effects that jQuery defines for hiding and showing elements,
    and one method intended for custom animations. The CSS opacity property: fadeIn(),
    fadeOut(), and fadeTo(). These three effects change the element''s visibility
    but don''t remove the element from the page even if it becomes invisible (when
    opacity becomes zero). The fadeIn() and fadeOut() methods animate opacity toward
    zero and respectively; if you want to animate opacity to any other value, use
    the fadeTo() method, which accepts the target opacity as the second argument.
    The first argument is the animation duration, which you must always specify when
    calling fadeTo().


    If you remove the element from the page layout (i.c., set the CSS display property
    to none), call hide(). This method gradually shrinks the element''s width and
    height and reduces its opacity to zero at the same time. If you want to show the
    element again, call show(), which reverses the process. By default, hide() and
    show() do not animate the process, but hide and show elements instantly. If you
    want to get an animated effect, then pass an optional duration argument. You can
    also toggle an element from visible to hidden and vice versa by simply calling
    toggle(). Toggle effectively calls hide() if the element is visible, and calls
    show() if the element is hidden.


    The last three of the predefined effects are slideUp(), slideDown(), and slideToggle().
    slideUp() is similar to hide() but it only hides the element by animating its
    height to zero and then setting its CSS display property to none. The element''s
    width and opacity don''t change. The slideDown() shows the element by reversing
    the process. slideToggle(), as its name suggests, toggles between slideUp() and
    slideDown().


