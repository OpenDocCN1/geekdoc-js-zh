  md: 'I guess it''s a matter of taste but some programmers prefer to create arrays
    using array literals rather than constructors, which use square brackets and commas.
    We too are going to use array literals in our course. For example:


    ```

    var a1 = []; //An empty array

    var a2 = [6, 2, "That''s it."]; //An array with three elements

    ```


    It is very important to have a firm picture of how an array is organized. You
    can think of it as a stack of numbered boxes (elements), each holding its own
    value. You can access individual values with the [] operator, which you put after
    the name of the object with an appropriate index inside. Here''s what the a2 array
    from the above looks like:


