    \ hierarchically related. The first heading element inside a sectioning element\
    \ takes the role of the heading for that section. If there’s no heading element\
    \ within a sectioning element, then the section is considered untitled. Visualization\
    \ can probably help you understand the outlining concept, even so if you try it\
