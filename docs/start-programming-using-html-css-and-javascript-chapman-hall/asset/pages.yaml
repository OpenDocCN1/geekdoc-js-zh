    When a visitor clicks a hyperlink, the browser loads a new web resource. The destination
    of the hyperlink is specified as the string value of the href attribute in form
    of a resource locator or URL, also known as a web address. The URL can be given
    either in an absolute or relative form. An absolute URL requires the complete
    path to the page to be given, starting with the protocol (for example HTTP, HTTPS,
    or FTP). After the protocol name, there should be a colon and double slash (://).
    Next comes the domain name, which identifies a website. For example, taylorfrancis.com
    or en.wikipedia.org. Finally, there comes another slash and the full path of the
    linked resource


    ```

    protocol://domain/path_of_the_resource

    ```


    The URL of the web page currently displayed in the browser window is usually shown
    on top of the browser, inside the address bar.


    This is an example of an absolute URL used as a hyperlink destination:


    ```

    <a href="http://www.w3schools.com/tags/att_a_href.asp">Read more</a>

    ```


