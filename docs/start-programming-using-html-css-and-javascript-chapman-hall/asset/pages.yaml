  md: '# D.7 Background Properties


    With these properties, you can control the appearance of the background of an
    element by specifying a color or including an image.


    # background-color


    The background-color CSS property gives a color to the background of an element.
    Note that background lies underneath the border, so if you use a non-solid border
    as dotted or dashed, the background color will show through the spaces between
    the dots or dashes. Background lies underneath a background image and will not
    be seen if a background image is specified unless the image is not fully opaque.


    # Values


    Any valid <color> value can be used.


    # Default Value


    transparent


    # Examples


    ```

    background-color: magenta;

    background-color: transparent;

    ```


    # background-image


    The background-image CSS property enables authors to put an image into the background
    of an element. All the other parts of the element (including the border) sit on
    top of the background image except for the background color, which hides underneath
    the image. If either the width or height (or both) of the image is smaller than
    the width and height of the element, then the image will tile. If the image doesn''t
    fit, it will be clipped.


    # Values


    A <url> of the image, or the none keyword.


    # Default Value


    none


    # Example


    ```

    background-image: url(/backgrounds/sky.jpg);

    ```


    > CSS Reference'
