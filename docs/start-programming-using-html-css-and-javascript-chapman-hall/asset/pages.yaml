    \ the top border of the <div> element might even move off the document window.\
    \ However, horizontal padding, borders, and margins of an inline element are still\
    \ respected by neighboring elements. It is important that you understand this,\
    \ as it influences the positioning of the elements.\n\n# 5.4 Positioning and Element\
    \ Flow\n\n**Professor:** The next important concept connected with the placing\
    \ of elements on a page is the **flow**. Normally, elements appear on a page in\
    \ the same order as they do in the HTML file, which means that they are in the\
    \ *document flow* or just in the flow. If an element is in the flow, then other\
    \ elements respect its presence and place themselves accordingly. For example,\
    \ if there’s a paragraph after a table in the HTML file, the paragraph will move\
    \ further down if the table is larger, and will move up if the table shortens.\n\
    \nTechnically, we control the element’s flow with the position property. This\
    \ property can carry a couple of keyword values of which we’ll study the static,\
    \ absolute, and relative. The default value is static, which puts the element\
    \ in the normal flow.\n\nDepending on the value of the position property, we usually\
    \ say that an element is *absolutely positioned*, relatively positioned, or *not\
    \ positioned*, if the position property is set to static. Absolutely and relatively\
    \ positioned elements are often referred to as **positioned**.\n\nLet’s carry\
    \ out a little experiment. Consider, for example, the following piece of HTML\
    \ code:"
