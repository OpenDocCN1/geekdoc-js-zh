  md: '# Headings Group


    | Full name | Description |

    | --- | --- |

    | | It represents a heading of a section. The <group> element''s main purpose
    is to associate lower rank headings with the one with the highest rank, where
    the lower rank headings act as secondary titles, like, for example, subheadings,
    alternative titles, or even bylines or taglines, which shouldn''t appear in the
    outline of the document. |

    | Content | One or more heading elements (<h1> to <h6>). |

    | Display | Block |


    Examples


    ```

    <!-- Add a secondary title to the main heading. --

    <group>

    <h1>The Lord of the Rings</h1>

    <h2>The Two Towers</h2>

    </group>


    <!-- Add a byline to the main heading. --

    <group>

    <h1>The Meaning of Liff</h1>

