    text\")) {\n    m.value = localStorage.getItem(\"text\");\n  }\n\n  // Every time\
    \ the content of <textarea> is changed, store the new\n  // to localStorage:\n\
    \  m.oninput = function() {\n    localStorage.setItem(\"text\", this.value);\n\
    \  };\n}\n```\n\n# Synchronizing Pages with Storage Events\n\nEach time the data\
    \ stored in localStorage or sessionStorage changes, a storage event is fired on\
    \ any tabs or windows that are currently displaying pages with the same origin.\
    \ However, it is not fired on the window that caused the change. A storage event\
    \ can be conveniently used to synchronize all the pages a user is viewing, so\
    \ that a change made in one window is immediately reflected in other windows or\
    \ tabs as well. A programmer can utilize this event by implementing the onstage\
    \ handler, which is a property of the Window object. While Web Storage is among\
    \ the supported HTML5 features, the event itself is not fully and equally supported\
    \ in all browsers. For example, if you want your code to work in Firefox, you\
    \ should attach the storage event using the window's addEventListener() method,\
    \ instead of directly defining the onstorage handler. However, the addEventListener()\
    \ method is not covered in this book.\n\n# Security Concerns\n\nWhen a web browser\
    \ offers to remember a password for you, it stores it securely in encrypted form\
    \ on your hard drive. That said, the Web Storage mechanism does not encrypt data\
    \ before saving, and stored data is freely accessible to snoopy users sharing\
    \ access to the computer as well as malicious software that might lurk in the\
    \ system. For this reason, never use any form of client-side storage for storing\
    \ sensitive user data like passwords or credit card numbers."
