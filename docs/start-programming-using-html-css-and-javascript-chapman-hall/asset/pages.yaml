  md: '+   • Because the floated element is not in the flow, its containing block
    does not respect its height.


    +   • If there is not enough room for the floated element horizontally, the element
    will move downward, until it finds horizontal space for itself.


    +   • Floating an element blocks the block layout and changes the value of the
    inline element''s display property to block. One practical implication of this
    is that you can set a width and height of floated elements.


    +   • You should always set a width of floated elements, otherwise the results
    can be unpredictable. That is not necessary for images, however, which get their
    width implicitly from the physical width of the actual image.


    +   • Vertical margins of floated elements do not collapse.


