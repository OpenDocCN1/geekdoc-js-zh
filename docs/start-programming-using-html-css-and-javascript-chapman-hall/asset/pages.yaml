    # 10.3 References to Function Objects


    You are already familiar with the fact that functions are objects and that you
    can call a function by appending a pair of parentheses (with necessary arguments,
    any) after its name. The name of a function without parentheses is nothing more
    a reference to the function object. Of course, it is possible to assign reference
    to any object that can hold a value, for example, a variable, an object element,
    or even a function parameter. You can invoke a function through any of these objects
    by appending parentheses with any necessary arguments. That allows you to do feats
    like, for example:


    ```

    var square = function(x) { return x * x; };

    var cube = function(x) { return x * x * x; };

    var otherSquare = square;

    var moreOfThe = [square, cube];

    ```


    ```

