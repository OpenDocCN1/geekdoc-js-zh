  md: '# HTML Attributes


    HTML attributes of an HTML element are accessible as additional properties of
    the Element object representing that HTML element.


    Imagine, for example, myPicture refers to an Element object representing an &lt;img&gt;
    HTML element on your web page, and you want to change the image displayed by &lt;img&gt;
    element. You can do that by setting its src attribute, which is accessible as
    the src property of myPicture from JavaScript:


    ```

    myPicture.src = "sunset.jpg";

    ```


    Some HTML attributes are reserved words in JavaScript and are therefore accessible
    through different names in JavaScript. For example, the class HTML attribute is
    named className in JavaScript, and the for attribute of the &lt;label&gt; element
    is named htmlFor in JavaScript.


    children


    Syntax:


    ```

    element.children

    ```


    This read-only property holds a reference to an array-like object of the children
    of element. Other children, such as text or comment nodes, are excluded from the
    array.


    # clientHeight, clientWidth


    Syntax:


    ```

    element.clientHeight

    element.clientWidth

    ```


    These read-only properties specify the dimensions of element including the padding,
    and excluding the border and margin. When element is the root element (like the
    &lt;html&gt; element returned by document.documentElement), these properties specify
    the size of the browser window without scrollbars and other user interfaces.


    > *To be exact, this is an Image object. While the Image object offers some additional
    information about an image through its properties, for the most part, you need
    not treat it any differently from any other Element object.'
