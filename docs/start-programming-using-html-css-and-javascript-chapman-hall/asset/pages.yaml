    # Animation


    When you add or remove an element from a page, or otherwise change the page appearance,
    you can do either instantaneously or you can animate the change by gradually modifying
    properties such as size or opacity. It is often not a very pleasing experience
    for a visitor if an element just disappears into thin air. It is much nicer if
    it slowly slides out or fades out, for example, jQuery makes such animations easy
    by defining convenient animation methods.


    There are some general facts about jQuery animations that you should know:


    +   - Every animation has a duration, which programmer can specify duration as
    a number of milliseconds or by providing a string of predefined text. You can
    use the strings "fast" and "slow", which stand for 200 ms and 600 ms, respectively.
    If no duration is specified, the animation lasts for 400 ms, which is default.

    - All the jQuery animated effects are asynchronous. When you invoke an animation
    method, it returns immediately and the animation is performed in the background.
    This means that the code which follows will be executed while the animation has
    not necessarily completed.


