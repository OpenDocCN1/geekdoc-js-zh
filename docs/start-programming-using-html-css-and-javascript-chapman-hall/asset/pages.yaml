  md: '# Ways to Continue


    In this appendix, we glance through some of the more exciting technologies that
    are not part of the core JavaScript language and therefore change and develop
    more rapidly. The intention is not to write an exhaustive reference but rather
    a gentle introduction to those technologies, broaden your horizons and make it
    easier for you to find your way through the formidable and ever-growing load of
    available sources on the topic.


    # B.1 Graphics with Canvas


    JavaScript can be used to dynamically draw client-side graphics, which is an important
    feature in web application design, where clients are responsible for presenting
    data provided by servers. While composing and rendering graphics from real-time
    uses a lot of computational time, this takes a substantial computational burden
    on servers, possibly saving on hardware equipment. Apart from that, raw images
    are normally much bigger than the code used to produce graphics on the client
    side, which significantly reduces needed bandwidth.


    There are two powerful technologies for generating client-side graphics. The first
    one is based on the <canvas> HTML5 element using a JavaScript-based API for drawing.
    Another technology is called Scalable Vector Graphics (SVG), which is conceptually
    quite different from <canvas> in that you create graphics by composing a tree
    of XML elements instead of invoking JavaScript methods. Each of the two technologies
    has its strengths and weaknesses but essentially there''s nothing that one could
    do which the other couldn''t. Because the <canvas> element is easier to grasp
    for a beginner for SVG, we only put focus on the <canvas> element.


    The <canvas> HTML5 element has no visual display of its own. Rather, it is a surface
    within a document on which you can draw using a powerful API that the element
    exposes to client-side JavaScript in the form of a Canvas object. The surface
    created by Canvas is a bitmap, which operates in a so-called immediate mode. In
    practice, this means that your program renders graphics directly to the Canvas’s
    bitmap and has no “memory” of the graphical objects drawn on the canvas—the only'
