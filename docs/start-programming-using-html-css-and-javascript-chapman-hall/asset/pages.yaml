  md: '| Start Tag | Content | End Tag |

    |---|---|--|

    | <p> | But it''s my only line! | </p> |


    The start tag is also called the opening tag while the end tag is called the closing
    tag. By the way, the name, or the abbreviation of the name of the element is written
    inside the tags. In particular, p stands for a paragraph. The closing tag should
    have an additional slash (/) before the element''s name.


    In order for a paragraph to show in the browser, we need to add two more things
    to get what is generally considered the minimum HTML document. The first line
    should be a special declaration called DOCTYPE, which makes a clear announcement
    that HTML5 follows. The DOCTYPE declaration is written within angle brackets with
    a preceding exclamation mark and the html keyword after: <!DOCTYPE html>. Although
    it looks like a tag, this is actually the only part of HTML document that isn''t
    a tag or an element. As a matter of fact, this code is for historical reasons.
    I don''t want to kill you with details, but you have to include it if your document
    to be interpreted by the browser correctly.


    One thing that the minimum document should contain is a <title> element. This
    element is necessary as it identifies the document even when it appears out of
    context, as a user''s bookmark or in search results. The document should contain
    no more than one <title> element.


    Putting it all together, we get the following code:


    ```

    <!DOCTYPE html>

    <title>The Smallest HTML Document</title>

    <p>But it''s my only line!</p>

    ```


    Maria: You just showed us what the document should look like. But I still don''t
    know where to type the code and how to view the resulting page.


    # 1.3 The Tools


    **Professor:** You can use any plain text editor you like. For example, you can
    use the Windows Notepad, which is already on your computer if you use Windows.


    **Mike:** What if I don''t use Windows?


    **Professor:** It doesn''t matter. Just about any operating systems contains a
    plain text editor. Personally, I use Notepad++, a programmer-friendly free text
    editor (notepad-plus.org).


    After you type the code, it is important that you save the file with a .htm or
    .html extension. It doesn''t really matter which one you use, it is quite important
    that you choose one and stick to it consistently. Otherwise, you could throw yourself
    into a real mess. For example, you could easily end up writing different files
