    # indexOfOf()


    Syntax:


    ```

    string.indexOfOf(str)

    string.indexOfOf(str, begin)

    ```


    This method searches string for the first occurrence of str. The search starts
    at the beginning of string or, optionally, at position begin within string. The
    method returns the index of the first character of the first occurrence of str
    in string. If str is not found, -1 is returned. The search is case sensitive,
    but you can make it insensitive by usingUpperCase() or toLowerCase(). Because
    these methods return a modified copy of the string, you can join them in a single
    expression with indexOf(). Don''t forget that the position of the first character
    of the string is numbered 0.


    Examples:


    ```

    var magic = "Abracadabra"

    magic.indexOf("abra") //Returns 7

    magic.toLowerCase().indexOf("abra") //Returns 0

    magic.indexOf("abra", 8) //Returns -1

    ```


    # lastIndexOfOf()


    Syntax:


    ```

    string.lastIndexOfOf(str)

    string.lastIndexOfOf(str, begin)

    ```


    This method works like indexOf(), but it searches string in the opposite direction
    that the first occurrence of str is found in the last one within string. Note
    that, in spite of the reversed search direction, character positions are still
    numbered from the beginning. The first character within a string has the position
    0, while the last one has the position length - 1.'
