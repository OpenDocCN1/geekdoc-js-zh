  md: "# 5.5 Containing Block\n\n**Professor:We've arrived at one very important concept\
    \ in CSS layout called a containing block.** The containing block of an element\
    \ is basically the rectangular area in which the element is placed. It can be\
    \ the content box of its parent but is not necessary. The containing block is\
    \ so important every time we set the position, or use percentages to set the dimensions\
    \ of an element box, which we do relative to the element's containing block.\n\
    \nThe containing block for the root (that is <html>) element is simply the document\
    \ window, also called a viewport.\n\nOther elements get their containing block\
    \ according to the value of their position property. If you position is set to\
    \ static or relative, the element's containing block is the content box of its\
    \ nearest ancestor with block display. If, however, the element is absolutely\
    \ positioned, its containing block is defined by the padding edge of its nearest\
    \ positioned ancestor.\n\n**Mike:** I assume the containing block does not constrain\
