    # Canvas State


    In our example you probably noticed how the fill color was set as a property of
    a CanvasRenderingContext2D object. Graphics parameters like color and line width
    are not passed as arguments to drawing methods but are part of the generic graphics
    state of the canvas. You can think of this partition of the graphics state and
    drawing methods as being like the partition of presentation and content shared
    between CSS and HTML, respectively.


    Technically, you set the state of the canvas by assigning appropriate values to
    certain properties of this object. For dimensions, CSS pixels are assumed, while
    colors can be specified by CSS color strings, such as "FFA" or "green". For instance,
    we could use the following values to change the color of our triangle and rectangle:


    ```

    context.lineWidth = 2; //Sets the width of lines

    context.strokeStyle = "black"; //Sets the color of lines

    context.fillStyle = "#FFA"; //Sets the fill color

    ```


    Note that the state is used only by the stroke() and fill() methods, and that
    the state which is in effect at the time of calling stroke() or fill() is used.
    That means if line width changes from say, two to four between distinct calls
    to lineTo(), both lines will be drawn four pixels wide because at the time of
    calling stroke() this is the current width.


