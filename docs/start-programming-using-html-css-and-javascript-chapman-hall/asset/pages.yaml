    # B.4 jQuery


    Currently by far the most popular and widely used JavaScript library is jQuery.
    There are many reasons why you would decide to use jQuery in your own projects,
    and all can be brought under the umbrella with the motto "write less, do more."
    If nothing else, programmers like to use the jQuery library because it simplifies
    everyday tasks and hides the differences between browsers, which have made programmers
    reach for bottles of aspirin from time immemorial. Also important is that jQuery
    is stable and well documented.


    # Getting jQuery


