  md: 'web server, for example, helps primarily to deliver web pages when requested
    from clients by means of Hypertext Transfer Protocol (HTTP). A web server also
    provides web developers with the means to publish their contents.


    Up to this moment, we have been doing just fine without a server because our job
    has merely displaying HTML documents in a browser. Interpreting and rendering
    HTML content is exclusively the browser''s job. Delivering the document to the
    browser is what web server should worry about. So, for example, if a document
    is requested by the URL /general/introduction.html, then, using the Windows local
    file system, this will translate to c:/general/introduction.html, if the request
    originates from the C: drive. However, if the document is requested by a web server,
    the server could translate the file to some other location, for example c:/users/meandyou/www/general/introduction.


    **Mike:** What''s the point?


    **Professor:** The /general/introduction.html URL is a root-relative URL. If you
    are accessing the introduction.html file directly through the local file system,
    then there is only one possible location for the file: in the general directory,
    which in turn should be placed in the root directory of the drive. However, if
    you are accessing the file through a web server, then you can configure the server
    to prepend any path you like to the root-absolute URL.


    **Maria:** That''s great! Now we can choose any directory we want to be our site
    root and use root-relative URLs in navigation menus. Is it difficult to run a
    server?


    **Professor:** It depends on what type of server you need. Fortunately, you will
    not have to set up a production server, which is a complex task indeed. A production
    server (also called a server) serves a website that can be viewed by the public.
    As for, you better leave this to one of the many web hosting companies, services
    you can rent quite cheaply.


    For developing and testing your website, you need a development (also named staging)
    server, which runs locally on your computer and is not accessible by the public.
    Setting up this kind of server is trivial and I think you could do it by yourself.
    Since you run on Windows, you need a so-called WAMP package. WAMP is an acronym
    formed from the initials of the operating system Microsoft Windows and the three
    main components of the package: Apache, which is a web server, MySQL, an open-source
    database, and one of scripting languages: PHP, Perl, or Python. Don''t worry about
    them, we will not use them in our course.


    One of the WAMP packages is EasyPHP (https://easyphp.org), which is an open source
    project and freely available. Go to their website and download and install EasyPHP
    DevServer. During installation, you don''t have to do anything except decide which
    directory you want the software to install. After the installation has completed,
    you will find a named directory data/localweb inside the directory you have chosen
