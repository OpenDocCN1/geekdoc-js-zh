  md: '# For Your Safety


    This book is not about cutting-edge web technologies, so you don''t need any protective
    equipment. It is more about general computer programming and some web-related
    principles using the mainstream web languages HTML, CSS, and JavaScript as examples.
    Some of the principles are over 40 years old, but are extremely important because
    they allow you to write cleaner and easily maintainable code, and they will not
    go away just like that.


    It''s a busy world, and the sixth edition of ECMAScript (the standardized version
    of JavaScript) has just entered the publication process. The good news is that
    it only introduces additions to its predecessor, so the essential concepts stay.
    Also, while CSS3 isn''t completely finished yet, there are also some "level 4"
    CSS modules. Fortunately, there are no serious problems for a single CSS4 specification
    on the horizon. This pays attention to the basic concepts that have matured with
    the latest HTML5, CSS3, and ECMAScript 5 standards to the point where it seems
    these concepts are going to persist for some time.


    # The Software Used


    In researching this book, I used Google Chrome and Notepad++ v6.5.3 (notepad-plus-plus.org).
    I also used the Windows 7 Professional SP1 64-bit operating system. I also used
    the EasyPHP DevServer 13.1 VC11 web development server (www.easyphp.org). You
    will be able to follow many of the examples and experiments in this book using
    any modern browser and plain text editor. They are already installed on your computer,
    so you can start experimenting right away.


    # Conventions Used in This Book


    The following typographical conventions are used in this book:


    A *monospaced font* is used for all code listings and everything that you normally
    type on a keyboard, including keys and key combinations.


    A *monospaced italic font* is used as a general placeholder to mark items that
    you should replace with an actual value or expression in your code.


    An *italic font* is used to indicate the first appearance of a term, or as an
    emphasis.


    A *sans serif italic font* is used to indicate URLs and file names and extensions.


    # Feedback and Supporting Online Material


    I deeply appreciate any comments, suggestions, or errors brought to my attention
    at the email address start-programming@fajlar.eu. You will find source code of
    the examples in this book and some additional materials and problems for each
    chapter at fajlar.eu/start-programming.'
