  md: "# 4.2 Class Selectors\n\nLet me summarize what we have learned about CSS so\
    \ far. You can style HTML elements using CSS rules. A CSS rule consists of two\
    \ basic parts: a selector and a declaration block. Although the declaration block\
    \ takes care of all the formatting, the real power of CSS hides in the selector.\
    \ With the selector, you take charge of your page's appearance, telling CSS what\
    \ it is you want to style.\n\nThe type of selector that we learned about in our\
    \ last meeting is the most general one. At the same time it is the simplest to\
    \ use and understand. Because it lets you select elements only by their names,\
    \ it is called an element selector (sometimes a tag or type selector). It is not\
    \ hard to identify elements in a CSS rule, for they are named after the elements\
    \ they style. For example, body, p, h1, and so on. They are efficient and easy\
    \ to use, element selectors have their drawbacks. In your homework, for example,\
    \ you stumbled upon a problem of how to right align a hyperlink within one paragraph\
    \ while keeping text inside other paragraphs aligned. That is something you cannot\
    \ do with an element selector.\n\nWhat about an inline CSS declaration? Can we\
    \ use it to style a single element instance, can't we?\n\nTechnically, yes. But\
    \ if you want to style a single element, it is not recommended to use inline declaration.\
    \ For one thing, using inline CSS means mixing structure (HTML) and presentation\
    \ (CSS), which is considered bad style. Apart from that, you will often want to\
    \ repeat the same element instance styling in more than a single file, as you\
    \ imagine could happen with the Continue... hyperlink from your homework. A more\
    \ elegant way of tackling the problem is by using a class selector. You create\
    \ a class selector simply by making up an appropriate name for it, preceding it\
    \ with a period (.). For example, let's name our class continue and construct\
    \ the following rule with the continue class as a selector:\n\n```\n.continue\
    \ {\n  text-align: right;\n}\n```\n\nA declaration block is no different than\
    \ that used with element selectors. There is, however, an additional step required\
    \ if you want to work that. The browser won't know what you want to style unless\
    \ you explicitly mark an HTML element you wish to style. For that purpose you\
    \ use the class global attribute on the element this:\n\n```\n<p class=\"continue\"\
    ><a href=\"#Continue...</a></p>\n```\n\nBe careful not to include a preceding\
    \ period with the value of the class attribute. A dot is not a part of a class\
    \ name, but it is used in a CSS rule to signal that a class name follows after\
    \ an element name."
