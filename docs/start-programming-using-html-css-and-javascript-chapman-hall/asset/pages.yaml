    \ For example, p::first-child selects the first child of a paragraph, which is\
    \ quite different.\n\nApart from, both selectors have different specificity. Pseudo-elements\
    \ have the same specificity as element selectors while pseudo-classes have the\
    \ same specificity as class selectors.\n\nI will just briefly cover other types\
