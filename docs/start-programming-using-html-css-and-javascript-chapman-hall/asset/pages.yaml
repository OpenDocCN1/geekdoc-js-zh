    \ Number(localStorage.counter) + 1;\n```\n\nWhile storing and retrieving data\
    \ by setting and querying properties of storage objects is convenient, it is often\
    \ better to use special methods to manage data storage. For store and retrieve\
    \ a value, you use the methods set() and getItem(), respectively:\n\n```\nlocalStorage.setItem(\"\
    counter\", 1); //Stores a counter with a\n//value of one\nc = localStorage.getItem(\"\
    counter\"); //Retrieves the counter value\n```\n\nDon't forget that values are\
    \ always stored as strings, so getItem() returns a string too.\n\nYou can also\
    \ delete a particular value or delete all stored values using the methods removeItem()\
    \ and clear(), respectively. For example:\n\n```\nlocalStorage.removeItem(\"counter\"\
    ); //Removes the counter from\n//storage\nlocalStorage.clear(); //Removes all\
    \ stored values\n```\n\nLike JavaScript arrays, localStorage and sessionStorage\
    \ also have the length property. This property works differently in that it always\
    \ holds the number of stored values. Recall that the length property of Array\
    \ is one bigger than the largest index, and is not equal to the number of elements\
    \ when an array is sparse. The key() method of the localStorage and sessionStorage\
    \ objects allows you to enumerate the names of all stored values by passing numbers\
    \ from zero to length to it. For an example, the code fragment writes to the JavaScript\
    \ Console all the values stored in localStorage:\n\n```\nfor (var i = 0; i < localStorage.length;\
    \ i++) {\n  name = localStorage.key(i);\n  console.log(localStorage.getItem(name));\n\
    }\n```\n\n# An Example\n\nAs a more realistic example, imagine that you want to\
    \ add a memo utility to your website, so that your visitor could write down his/her\
    \ thoughts and be able to read them during his/her next visit.\n\nTo do that,\
