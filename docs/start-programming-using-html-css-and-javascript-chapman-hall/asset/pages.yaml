  md: '# <percentage> Data Type


    The <percentage> CSS data type is used to specify percentages. Percentages are
    composed of a <number> directly followed by a percentage sign (%). There is no
    space between the number and the percentage sign.


    Even if many length properties accept percentages as relative units, the <percentage>
    data type is not the <length> data type. You can read more about how to use percentages
    as measurements on page 68.


    # <url> Data Type


    The <url> CSS data type represents a reference to an external resource. It is
    expressed exclusively by means of the url() function, which accepts as an argument
    the URL of the resource. The URL does not need to be quoted unless it contains
    spaces. Allowed are as single as double quotes. Specified URLs may be absolute
    or relative and when they are relative; they are relative to the URL of the style
    sheet and not the URL of the web page.


    Here are some examples:


    ```

    url(/bullets/funnybullet.gif)

    url(''/bullets/another funny bullet.gif'')

    url("bullets/another funny bullet.gif")

    url(http://funnybullets.com/animals/mosquito.gif)

    ```


    # D.2 inherit keyword


    The inherit keyword is common to all CSS properties. With this keyword you can
    force a property that isn''t normally inherited to inherit a value from the parent.
    For example, if you want elements of the important class to inherit a border from
    their parents, you declare:


    ```

    .important {

    border: inherit;

    }

    ```


    Note that you cannot use the inherit keyword to inherit individual property values
    through shorthand properties. You can apply the inherit keyword to a shorthand
    property only as a whole.


    # D.3 Text Properties


    Using properties in this section you can decide how text should be formatted on
    a web page. Most of the text properties are inherited, so it is not necessary
    to use them directly with text-level elements, or elements like <h1> to <h6> or
    <p>. It is often better to define an overall font, color, alignment, or similar
    for a page or section. For example, you can apply font properties to a <body>
    or <article> element to create a uniform overall appearance.'
