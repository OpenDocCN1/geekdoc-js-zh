    **Mike:** Open the fridge, take the chicken out, put the fish in, close the fridge.


    **Professor:** Brilliant! That''s a joke, all right, but it conveys an extremely
    important concept. Let me write the instructions for you:


    +   - Open fridge.

    - Take chicken out.

    - Put fish in.

    - Close fridge.


    In computer science, such a list of instructions is called an *algorithm*. An
    algorithm is usually written either in plain English or in a so-called *pseudo*
    language, which a computer does not understand. If you want a computer to understand
    and execute your instructions, you must code these instructions in a specific
    computer language. A set of executable instructions is called a computer program.


    Although the computer will always obey the order in which your instructions are
    listed, the order itself is not always important. If only the final state is important,
    you may want, for example, to put the fish in the fridge (if the fridge is big
    enough to hold both animals for some time) and only then take the chicken out.
    But you cannot, by any means, take the chicken out of the fridge *before* opening
