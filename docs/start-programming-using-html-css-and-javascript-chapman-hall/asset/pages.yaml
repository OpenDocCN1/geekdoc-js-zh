  md: 'asynchronous mode, which means that it is executed as needed in response to
    user and other events. An event is any action that a computer program detects
    and handles. For example, an event may be triggered when a visitor clicks a mouse
    button or presses a key, or when a timer expires.


    It is fairly easy for the programmer to handle an event because all objects that
    could detect and react to events have predefined event handler properties attached
    to them for every possible event. All you have to do as a programmer is define
    define handler function and assign it to the corresponding property. The event
    handler is invoked automatically by the program whenever a corresponding event
    occurs. Event handler properties can be easily recognized because they have names
    begin with "on". For example, if you want to do something when the object named
    clickMe clicked, you should write code like this:


    ```

    clickMe.onclick = function() { /* Do something else */ };

    ```


    # Maria: What''s that click object?


    Professor: It is an imaginary object that could represent any HTML element on
    the page that your visitor can click. You''ll soon learn how to capture actual
    HTML elements from JavaScript in order to manipulate them. What I wanted to do
    right now is to connect a function definition with the onclick event handler property
    of an arbitrary object that can actually be clicked. Once you have written the
    above code, something will be done each time someone clicks the element represented
    by the clickMe object. Because you don''t know in advance and how many times,
    if at all, clickMe will be clicked, you also don''t know when, if at all, something
    will be done. That''s why JavaScript events are handled asynchronously, in contrast
    to the timely, synchronous execution of code during the web-page paging.


    Because JavaScript actively invokes a function as a response to an event, you
    can also think of the JavaScript event-handling mechanism as simply calling the
    appropriate function every time an event occurs. For example, if you click three
    times on the HTML element clickMe object, the method onclick() is invoked three
    times on this picture.


    Event | Response

    click- clickMe.onclick()

    click- clickMe.onclick()


    click- clickMe.onclick()


    It''s about time to look at a concrete example of handling an event. One of the
    most important event-handler properties is the onload handler of the Window object.
    It is triggered immediately after the document parsing and loading is complete
    and the document is visible within the browser window. You will frequently write
    JavaScript


