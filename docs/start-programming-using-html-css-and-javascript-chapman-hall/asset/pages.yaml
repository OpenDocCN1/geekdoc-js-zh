    ));


    You instantiate the plugin and apply a TouchSwipe behavior to a jQuery object
    by calling the swipe() method on that object. Notice that I applied the swiping
    behavior to the document rather than individual tiles. This way, a user is free
    to swipe anywhere over the puzzle in order to slide a tile instead of needing
    to worry about whether he/she hit the right tile. The swipe() method accepts as
    the first argument containing the event-handler definition (swipe in our case,
    but there are other events defined by the library) and some properties controlling
    the handler behavior. One of these properties is threshold, which specifies a
    minimum distance in pixels that a swipe event must use in any of the four directions
    in order for the event to get fired. The swipe handler also accepts, apart from
    the usual Event object, some other arguments. I used only the second argument,
    which holds a string name of the swipe ("left", "right", "up", or "down"). Because
    swipe over the puzzle gives exactly the same information as pressing one of the
    arrow keys, all we have to do is translate a swipe into a corresponding key press.
    If you look inside the event-handler body, you''ll see that the four possible
    swipe directions are first translated into appropriate key codes and the keydown
    event is triggered.


    # Further Reading


    If you would like to know about mobile web design, you may first want to explore
    the jQuery Mobile website jquerymobile.com with demos, downloads, documentation,
    recommended resources, and more. As mouse and touch events are simulated on mobile
    and desktop applications, you don''t actually need a touch screen but test some
    of the touch and swipe events on your desktop using a mouse pointer. If you prefer
    books, there''s quite an enthusiastic piece of writing available in the form of
    Estelle Weyl''s book Mobile HTML5. The book is definitely worth reading if you
    are concerned about principles, which are at least as important as technology
    itself.'
