  md: '# D.9 Size Properties


    The two properties in this section allow you to set specific dimensions of your
    elements.


    # height


    The height CSS property defines the height of the element''s content area. The
    actual height of the element can be taller than that specified by the height property
    since the actual height also includes both (top and bottom) vertical paddings,
    both vertical border edges, and both vertical margins. If you are not familiar
    with these terms, you can read about the CSS box model on page 74.


    The auto keyword lets the browser compute and select the most appropriate height
    for the element.


    Note that the actual height of the content area on the screen can show taller
    than the set height. That can happen, for example, if there''s too much text inside
    the content box or if the user increases the font size. Browsers don''t all handle
    this situation in the same way. Some will increase the height of the content box
    while others will simply overflow text outside of the box.


    # Values


    Nonnegative <length> and <percentage> values can be used. When percentages are
    used, they are relative to the height of the containing block. Note that percentages
    may not have an effect if the containing element''s height property is set to
    auto.


    auto


    # Default Value


    auto


    # Example


    ```

    height: 200px;

    ```


    # width


    The width CSS property defines the width of the element''s content area. Note
    that the actual width of the element can be wider since it also includes the widths
    of both (left and right) horizontal paddings, both horizontal border edges, and
    both horizontal margins. If you are not familiar with these terms, you can read
    about the CSS box model on page 74.


    The auto keyword lets the browser compute and select the most appropriate width
    for the element.'
