    The same goes for other types. If, for example, JavaScript wants a number, then
    it will convert any value that is not to a number.


    There are two things that you need to know about type conversions: first, to what
    value does value convert, and second, when does the conversion occur. For the
    sake of completeness, let us summarize the most basic conversions in the table.


    | Value | Converts to: | | |

    |---|---|---|---|

    | | String | Number | Boolean |

    | undefined | "undefined" | NaN | false |

    | null | "null" | 0 | false |

    | true | "true" | 1 | |

    | false | "false" | 0 | |

    | "" (empty string) | | 0 | false |

