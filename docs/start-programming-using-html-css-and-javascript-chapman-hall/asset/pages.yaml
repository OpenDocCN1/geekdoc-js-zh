    # 12.2 Deeper into the Browser


    **Professor:** Our work so focused primarily on the core JavaScript language,
    and even though we ran all our examples within a web browser, the code itself
    had to do with the specific context of a web browser. Today, you are finally going
    to see how JavaScript comes alive within the browser and how you integrate it
    with HTML and CSS. Because part of JavaScript is designed to run exclusively on
    the side of the client—customer that runs the web browser—you''ll often hear the
    term *client-side JavaScript* connected with it.


    The basic object of client-side JavaScript is the Window object, which represents
    a web browser''s window and takes the role of the client-side JavaScript global
    object. You can refer to the Window object using the window identifier, although
    you rarely need to do that explicitly. Because the Window object is in fact the
    global object, all its properties and methods are effectively treated as global
    variables and functions, and is actually all you need to know. For example, if
    you want your browser to load a page from another URL, you simply assign the URL
    to the global location variable:


    ```

    location = "http://www.checkthisout.com"

    ```


    Or, if you want to display a message to the visitor inside a dialog box, you use
    the global `alert()` function:


    ```

    alert("Let''s rock and roll!")

    ```


    You can do that both location and alert() are members of the Window object. You
    can find a short selection of other properties and methods that the Window object
    defines in the reference on page 427. In all, you can do lots of things with window,
    but I''ll let you discover them on your own.


    12.2. Deeper into the Browser | 229'
