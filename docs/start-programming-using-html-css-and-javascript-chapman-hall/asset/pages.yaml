    The same object-to-primitive conversions take place when you compare string objects
    using greater-than or less-than operators. Let me summarize the rules for you:


    +   If both operands of the equality operator (=) are string objects, then the
    operator returns true if only if both operands refer to the same object. If they
    refer to different objects, the return value is false even when both objects hold
    identical strings. No object-to-primitive conversion occurs here.


    +   If one operand of the equality operator (=) is a primitive string and the
    other is an object, then the object is converted to a primitive before comparison.
    Both primitives are then compared by value.


    +   If either operand of a comparison operator >, >=, or <= is a string object,
    then that object is converted to a string primitive. The primitives are then compared
    alphabetically.'
