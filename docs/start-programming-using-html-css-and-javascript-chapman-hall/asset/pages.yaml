- img_proc: true
  md: '# RGB Values


    Colors can be specified using the RGB model in either a hexadecimal or functional
    notation.


    The hexadecimal notation is composed of a hash sign (#) followed by either six
    or three hexadecimal digits (i.e., decimal digits 0–9 and letters A–F), specifying
    the amount of red (R), green (G), and blue (B) light to use:


    ```

    #RRGGGB

    #RGB

    ```


    Both notations are equivalent and you can get the longer one simply by duplicating
    each of the three hexadecimal digits of the shorter one. The next two lines both
    represent exactly the same screaming green color:


    ```

    #66ff11

    #f1

    ```


    Lower- as well as upper-case letters can be used as hexadecimal digits A–F.


    The other method of specifying RGB colors is a functional notation. This notation
    uses the rgb() function with three <integer> values between 0 and 255, or three
    <percentage> values between 0 and 100% as arguments:


    ```

    rgb(<integer>, <integer>, <integer>)

    rgb(<percentage>, <percentage>, <percentage>)

    ```


    Using the functional notation, the same screaming green color can be expressed
    like this:


    ```

    rgb(102, 255, 17)

    rgb(40%, 100%, 6.7%)

    ```


    The integer number 255 is identical to FF in hexadecimal notation, or to 100%.
    Note that it is not possible to use hexadecimal numbers with the rgb() function.


    # RGBA Values


    The RGB color model extends the RGB model with the alpha channel, which specifies
    the color opacity. The opacity is specified by a real number 0 (meaning completely
    invisible) and 1 (totally opaque) as a fourth argument of the rgba() function.
    You can use either three <integer> or three <percentage> values for a color, and
    a <number> value for opacity:


    ```

    rgba(<integer>, <integer>, <integer>, <number>)

    rgba(<percentage>, <percentage>, <percentage>, <number>)

    ```'
