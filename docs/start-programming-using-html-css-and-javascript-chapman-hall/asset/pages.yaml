  md: '# 5.6 Hiding Elements


    **Professor:** You can also take an element out of the flow with the display property
    set to none. This makes an element completely disappear from the page, while other
    elements reposition themselves accordingly. Hiding part of the content is useful
    in many ways. You can, for example, hide a portion of some long text and make
    it accessible only on demand, or you can hide a sub-menu of a navigation system
    and make it visible only after the visitor has selected the corresponding top
    menu element.


    **Mike:** How do you do that?


    **Professor:** Put the removed element back in the flow by setting its display
    property back to block or inline. You can allow the visitor to trigger that change
    through some JavaScript code or the :hover pseudo-class. We will cover pseudo-classes
    later today.


    Another way of hiding an element is by the visibility property, which can be set
    to hidden or visible. Unlike the none value of the display property, hiding an
    element through the hidden value of the visibility property leaves the element
    in the flow and it only leaves an empty space where the element would have been
    if it had not been hidden.


    # 5.7 Floated Elements


    **Professor:** Two properties that control the element''s position are float and
    clear. I guess that the concept behind these two properties is one of the most
    intuitive and the most misunderstood concepts in CSS. I''ll try to illuminate
    the basics so you have a foundation from which to study and explore the subject
    on your own.


    You can float an element either to the left or the right by declaring float: left;
    or float: right; respectively. You cannot float an element to the center, though
    because the concept is basically the same for both floats, left and right, and
    we''ll only focus on left floats. So what happens if you float an element to the
    left?


    +   - The floated element is first positioned according to its natural document
    flow. Then it is shifted horizontally all the way to the left until its left margin
    edge touches the left edge of its containing block or the right margin edge of
    another floated element. Technically, that the element moves out of the flow,
    although not completely. Text and inline elements still respect its presence.

    - All the content that appears above the floated element in the browser window
    is unaffected.

    - All text and inline elements that appear at the same height or below the floated
    element flows along its right margin and wrap below it.

    - Because the floated element is not in the flow, all the block elements position
    themselves vertically as though the float didn''t exist. However, text and inline
    content of those block elements will reflow to the floated element.'
