  md: '# clear


    The clear CSS property defines whether an element can be placed next to floated
    elements (i.e., elements that have their float property different from none) that
    are placed before it in the original HTML code or an element has to move down
    (clear) below the floated elements that are placed before it.


    The clear property works with floated as well as non-floated elements. When a
    non-floated block is cleared, its top border edge is moved below the bottom margin
    edge of any floated elements before it. Note that this move collapses margins,
    although the resulting margin is not the largest of all margins. Rather, it is
    defined by the position of the lowest bottom margin edge of the relevant floated
    elements.


    When, a floated block is cleared, its top margin (not border) edge is moved below
    the bottom margin edge of any floated elements before it. This move does not collapse
    margins.


    It is possible to clear an element in three ways:


