  md: '# C.6 Text-Level Semantics


    ```

    <a>

    ```


    | Full name | Anchor |

    | --- | --- |

    | Description | Represents a hyperlink or the named target destination for a hash
    mark (#). |

    | Display | Inline |


    Attributes


    ```

    href

    ```


    If the <a> element is used as a hyperlink, this is a required attribute. Its value
    specifies the link target in the form of a URL. Apart from the usual HTTP protocol
    for transferring hypertext documents, other protocols can be used as well (e.g.,
    HTTPS, FILE, or FTP). One can also establish a link to an internal location within
    a document (marked by another <a> element with an id attribute). This can be done
    by means of a URL fragment, which is a name preceded by a hash (#).


    ```

    target

    ```


    This attribute specifies where to display the linked content. If you use the _blank
    keyword as a value of this attribute, the content will be displayed in a new tab
    or window.


    Examples


    ```

    <!-- A link to a hypertext document. -->

    <a href="http://www.someewirdstuff.org/memberlogin.html">Let''s go somewhere/</a>

    ```


    ```

    <!-- Open the document in a new tab/window. -->

    <a href="http://www.someewirdstuff.org/memberlogin.html" target="_blank">Let''s
    go somewhere/</a>

    ```


    ```

    <!-- A link to a PDF document. -->

    <a href="http://www.someewirdstuff.org/appform.pdf">Application/</a>

    ```


    ```

    <!-- Mark a specific location within a page -->

    www.someewirdstuff.org/benefits.html -->

    <a id="somewhere">This is totally amazing/</a>

    ```


    ```

    <!-- Link to that specific location from the same page. -->

    ```


