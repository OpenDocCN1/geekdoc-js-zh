  md: '# font-family (Inherited)


    The font-family CSS property allows you to specify the font in the browser will
    display text. It can happen that a font is not installed on a viewer''s computer—that''s
    why designers usually specify a list of two or more options. At the end of the
    list there should be one generic font family in case more specific fonts are not
    available. In contrast to other CSS properties, values of the font-family property
    are delimited by commas to suggest that they are alternatives. The browser will
    use the first of the fonts in the list that it finds on the computer.


    # Values


    Any font family name can be used, such as, for example, "Helvetica" or "Courier
    New". Quotes are not necessary unless names include spaces.


