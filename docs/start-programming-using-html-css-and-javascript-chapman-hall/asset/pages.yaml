    # <integer> Data Type


    The <integer> CSS data type is used to specify an integer. An integer is composed
    of any number of decimal digits 0–9, preceded by an optional + or – sign. Any
    <integer> value is also a <number> value, while the opposite is not true.


    # <length> Data Type


    The <length> CSS data type is used for specifying distance measures. It is composed
    of a <number> directly followed by a unit. No space is allowed between the number
    and the unit literal. Note that certain CSS properties, negative lengths are also
    allowed. For example, by specifying a negative or positive <length> for the text-indent
    property, you specify whether text is indented to the left or right.


    Some properties that accept <length> values also accept <percentage> values. Note,
    however, that <percentage> values are not <length> values.


    # Units


    CSS provides a number of different units to measure lengths. Although there is
    no limit on which units can be used with which property, you will generally not
    use units like centimeter (cm) or inch (in) for an on-screen display. Those units
    are more appropriate for printing on paper. For display on screen you will almost
    exclusively use em (em) if you want relative units or pixels (px) if you want
    absolute units. You can read more about em on page 67, and about CSS pixels on
    page 47.


    For measurements of zero length it is not necessary to use units. For example,
    instead of 0px you can simply write 0.


    # <number> Data Type


    The <number> CSS data type is used to specify a real number. A <number> is composed
    of an <integer> part, possibly extended with a fractional part—a decimal point
    (.) followed by any number of decimal digits 0–9. The integer part can also be
    omitted. Note that any <integer> value is also a <number> value, while the opposite
    is not true.


    These are examples of valid <number> values:


    ```

    42

    3.14159

    -273.15

    .99

    ```


    D.1. CSS Data Types | 341'
