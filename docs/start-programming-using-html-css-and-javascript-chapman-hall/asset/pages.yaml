    for the vertical margins and image height were selected so that the top and bottom
    edge of the image align with the x and base line of the text, respectively.


    # Maria: What are these lines?


    Professor: The base line marks the line which characters set, while the x line
    marks the top of lower-case letters like, for example, a letter x. Hence the name.


    You can set the height of an image and its top margin to match these lines by
    trial and error. First, set the top margin so that the top edge of image approximately
    aligns with the x line of text and set the image height to align its bottom edge
    with the base line of the text. You may want to zoom in on the page while doing
    that, which you can do by pressing Ctrl(+) on the keyboard. To zoom back out,
    you can press Ctrl+(-). After you have successfully aligned both edges, you set
    the bottom margin so that the sum of the image height and vertical margins is
    a multiple of 1.2 em, which is the normal line spacing. Once you have the vertical
    dimensions set, you can also alter the image height by simply adding or subtracting
    from it multiples. Recall that you use em in order to keep the "vertical rhythm
    of the page," even if the viewer sizes the fonts.


