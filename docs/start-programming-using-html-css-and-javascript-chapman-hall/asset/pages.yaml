  md: '# window


    Syntax:


    ```

    window

    ```


    The window property holds a reference to the Window object representing the current
    browser window. It is rarely necessary to use this property explicitly because
    the Window object is the global object of client-side JavaScript. This makes all
    the properties and methods of Window accessible without explicitly referring to
    window. However, the window property is often used explicitly when specifying
    the onload handler on Window.


    # Methods


    # alert()


    Syntax:


    ```

    window.alert(message)

    ```


    Displays message in plain text inside an alert dialog box. The dialog has a single
    OK button and is modal, which means that a call to alert() blocks the code execution
    until the user closes the dialog.


    # clearInterval()


    Syntax:


    ```

    window.clearInterval(intervalID)

    ```


    This method cancels the repeating of the code execution that was scheduled by
    a previous call to setInterval(). The intervalID argument should have the same
    value as returned by a corresponding call to setInterval().


    Example:


    ```

    h1 = setInterval(f1, 100);

    h2 = setInterval(f1, 5000);

    //ops the repeating of the execution of f1:

    clearInterval(h1);

    ```'
