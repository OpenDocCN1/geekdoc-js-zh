  md: '# clearTimeout()


    Syntax:


    ```

    window.clearTimeout(timeoutID)

    ```


    This method cancels the pending code execution that was scheduled by a previous
    call to setTimeout(). The timeoutID argument should have the same value as returned
    by a corresponding call to setTimeout().


    # confirm()


    Syntax:


    ```

    window.confirm(question)

    ```


    Displays question in plain text inside a confirm dialog box. The dialog has OK
    and Cancel buttons for the user to answer the question. If the user selects OK,
    confirm() returns true, otherwise it returns false. The confirm dialog is modal,
    which means the call to confirm() blocks the code execution until the dialog after
    clicking OK or Cancel.


    # prompt()


    Syntax:


    ```

    window.prompt(message)

    window.prompt(message, defaultText)

    ```


    This method opens a prompt dialog with the indicated plain text message, a text
    input field, and OK and Cancel buttons. Dialog waits until the user types some
    text into the text input field and clicks either OK or Cancel. If the user clicks
    the OK button, prompt() returns the string of text that is currently in the input
    field. Otherwise, if the user clicks Cancel, prompt() returns null.


    The optional defaultText argument gives the initial value of the text input field.


    In modern web programming, this method is seldom used and many consider it bad
    design. That, it can be convenient for a beginner to capture the user input.


    # setInterval()


    Syntax:


    ```

    window.setInterval(function, interval, arg1, arg2, ..., argN)

    ```


    This method schedules function to be invoked at every interval milliseconds. Zero
    or more optional arguments (arg1, arg2, ..., argN) will be passed to function.'
