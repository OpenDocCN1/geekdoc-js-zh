    # # 11.2 JavaScript Objects Revisited


    Professor: You already know plenty about objects in JavaScript. You know that
    an object is a composite value in the sense that it combines multiple values.
    It can incorporate either primitives or other objects, which like its properties
    or members. If a property is a function object, which you can invoke to do something,
    then such a property is often called a method. You access an object''s properties
    by their names using the property access operator in either a dot or a pair of
    square brackets. It is important that objects with the exception are mutable.
    You also know that JavaScript objects are manipulated by reference rather than
    by value, and you can create an object using the new operator in combination with
    an appropriate constructor.


    That said, you can also create an object by means of an object literal, which
    is simply a comma-separated list of name and value enclosed within a pair of curly
    brackets. A property name may be a JavaScript identifier or a string literal,
    and must be separated from its value by a colon (:). A value can be any JavaScript
    expression, whose primitive or object—becomes the value of the property. Here''s
    an example:


    ```

    // object with two properties representing a complex number

    // /1 + 3i:

    var complex = {re: 1, im: 3};

    //The conjugate of the above number

