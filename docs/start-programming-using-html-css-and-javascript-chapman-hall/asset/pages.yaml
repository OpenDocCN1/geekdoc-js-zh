  md: 'As we become aware of the environment in which our programs run, it becomes
    of paramount importance to know where to put the code and how the code is executed.
    So far we put our examples into &lt;script&gt; elements embedded within HTML code,
    which is convenient for learning and quick testing, but discouraged in modern
    web design. Recall that HTML, CSS, and JavaScript each play their own role inside
    a web page by separately defining content, presentation, and behavior. Recall
    how you use separate code from HTML by putting it to a separate file and linking
    by means of the &lt;link&gt; HTML element. You can separate JavaScript from the
    HTML and put it in an external file, which you can connect with the src attribute
    of the &lt;script&gt; element. JavaScript detached this way is also called unobtrusive
    JavaScript, and by any other reason—HTML makes code more readable because there
    are no blocks of JavaScript code sitting between the sections of HTML. This is
    not the sole advantage of such a separation, though. For example, if multiple
    HTML files share the same name, you can maintain only a single copy of the code,
    rather than having to edit each of the HTML files whenever you want to change
    it.


    **Mike:** If you put JavaScript code into an external file and it means by means
    of a &lt;script&gt; element, then suppose everything stays the same. I mean the
    position of the &lt;script&gt; element doesn''t change, does it?


    **Professor:** If you want to implement the concept properly, then &lt;script&gt;
    elements shouldn''t be scattered over all HTML code either. This is a problem
    so long as you use document.write() to write to the browser window. Even if JavaScript
    code is placed in an external file, it is still executed synchronously. This means
    that it is executed exactly when the &lt;script&gt; element referring to it is
    encountered during the document parsing. The parser will wait until the code has
    executed before the parsing of the HTML that follows. If you use any document.write()
    methods, the text produced by these methods will be inserted into the current
    location in the input stream of HTML code that is being parsed. You cannot move
    JavaScript code that contains any calls to document.write() without changing the
    location of the output they produce.


    Another problem with document.write() is that you cannot use it after the document
    parsing has finished. Calling it after the document has closed will erase the
    document completely. As soon as you want to design a page that is responsive to
    user actions, this is not the kind of behavior that you would want. That''s why
    document.write() is rarely, if at all, used in modern web pages.


    **Maria:** I suppose that you will show us alternatives.


    **Professor:** Indeed I will, we''re coming to shortly. But first things first:
    I need to tell you about events we can start JavaScript code asynchronously.


