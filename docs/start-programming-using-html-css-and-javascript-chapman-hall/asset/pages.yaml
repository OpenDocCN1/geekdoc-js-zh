    \ which limits the amount of data they are able to\nexchange with servers. So,\
    \ stay away from gigantic JavaScript libraries and images.\n\n# Swiping the 15-Puzzle\n\
    \nIn order to demonstrate a mobile-specific approach to programming, let's use\
