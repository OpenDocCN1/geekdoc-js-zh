    # Custom Element Data


    jQuery has a powerful capability to associate arbitrary data with document elements

    or with Document or Window objects. The data() method allows you to attach data

    to the elements of a jQuery object. You can either pass a name and value as

    two arguments of the method or you can pass a single object, which properties
    will be

    associated with the elements of the jQuery object.


    You can also use data() to get values, of. If you pass a single argument to it,

    that argument is interpreted as a name value is to be returned. When, however,

    you call the method without any argument, an object is returned that contains
    all the

    name/value pairs attached to the first element inside the jQuery


    If you want to completely remove all or some of the data associated with an element

    or elements, use the removeData() method.


    These are some examples:


    ```

    $("sprite").data("counter", 10); //Sets counter on sprite to zero

    console.log($("sprite").data("counter")); //Writes 10


    $("sprite").data({x: 13, y: -8}); //Sets x and y on sprite

    console.log($("sprite").data()); //Writes counter: 10, x: 13,

    // y: -8


    $("sprite").removeData("counter"); //Completely removes counter

    console.log($("sprite").data()); //Writes x: 13, y: -8


    $("sprite").removeData(); //Removes all previously set data

    ```


