  md: 'Apart from the declaration of variables that will refer to the above mentioned
    DOM objects, the code also creates and initializes a MathWorksheet object instance
    ws. The last line of the code fragment fetches the <div> element that will hold
    the whole worksheet.


    It''s now time to create the elements of the Worksheet. You can do that using
    the Document''screateElement() method, passing the name of the element to create
    as its argument. However, createElement() only creates an element, it doesn''t
    insert it into the document tree. You can insert the element to the right position
    within the document tree using one of the appropriate methods like, for example,
    the Node''s appendChild() method. The element will be appended as a child of the
    Node or object on which you invoke this method.


    The next lines of code create a form and append it as a child of the <div> element,
    then we create a <div> element that will hold all the equations and append it
    as a child of the form:


    ```

    //...

    form = document.createElement("form"); //Creates a <form> element

    form.className = "worksheet"; //Sets its class attribute

    wsDiv.appendChild(form); //Makes a child of wsDiv


    eqDiv = document.createElement("div"); //Creates a <div> element

    eqDiv.className = "equations"; //Sets its class attribute

    form.appendChild(eqDiv); //Makes a child of eqDiv

    //...

    ```


    By this time, we''re ready to generate and insert the equations:


    ```

    //...

    for (i i = 0; i < 5; i++) { //Creates five equations

    //Generates an equation and a <div> element to hold it:

    ws.generate();

    div = document.createElement("div");

    eqDiv.appendChild(div);

    //Creates a text box and inserts the equation into it:

    label = document.createElement("label");

    label.innerHTML = ws.getEquation();

    label.htmlFor = "eq" + i;

    div.appendChild(label);

    //Creates a text box and attaches a solution to it:

    text = document.createElement("input");

    text.type = "text";

    text.id = "eq" + i;

    div.appendChild(text);

    text.dataset.solution = ws.getSolution();

    }

    //...

    ```'
