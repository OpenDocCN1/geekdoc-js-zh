    I shouldn''t have done this because I was actually concerned about presentation.
    In fact I should have used <h1> because this is the main heading.


    Professor: Exactly! When writing HTML, you shouldn''t worry about font size.


    Maria: What still puzzles me are the elements <b> (bold) and <i> (italic), which
    I found in the reference you gave us. Is this not presentation?


    Professor: If you use them properly, the answer is no. Those two elements survive
    the past but with a different, semantic interpretation. In modern HTML, it would
    be wrong to use <b> and <i> elements merely for the purpose of making text bold
    or italic. It is also wrong to use <b> and <i> elements as being old elements
    replaced by <strong> and <em> only because they are rendered the same way by many
    browsers. The <strong> element is used to express importance of its content and
    the <em> element is used to emphasize its content. Rather, they are considered
    as generic bold and italic elements used in cases when normally—but not necessarily—bold
    and italic fonts are used. The meaning of these two elements is not evident from
    their names, authors often use the class attribute to clearly identify their semantic
    meaning. For example:


    ```

    <i class="latin-taxonomy">Vombatus ursinus ursinus</i>

    <b class="english-definition">bare-nosed wombat</b>

    ```


