    Let''s briefly summarize what we have just learned. There are three types of CSS:
    inline, internal, and external. Because of their nature, the only really useful
    one is external CSS. Inline and internal CSS may be useful for quick experimenting
    to see how the design might look.


    There''s another good reason why you should stick to external CSS. It is considered
    good design if you properly separate structure and content from presentation,
    which keeps your code cleaner and easier to maintain. So, even if there''s only
    a single element instance you need to style, it is still a good idea to put styling
    in an external style sheet.


    If you don''t have any queries, then we are ready to move ahead.


    **Maria:** I have a question. How does CSS treat spaces? Are they important?


    **Professor:** In CSS, spaces have pretty much the same role as HTML. Spaces and
    newlines are important to make code more readable to humans. For example, I like
    to put each declaration on a separate line, slightly indented to the right, with
    a space after the colon as a property and its value. It is of course up to how
    you design your writing. The important thing is that you feel comfortable with
    the layout of the code.


    There is, however, one tiny restriction concerning spaces: you shouldn''t put
    a space between a number and the corresponding unit. For example, if you need
    to write a value of 200 pixels, the correct form is 200px, but not 200 px.


    If you are in doubt, it is always a good idea to validate your code. Just because
    it works in one browser, it doesn''t necessarily mean it is correct and will work
    in other browsers. As the same as HTML, there exist online validators for CSS.
    For example, you can use the one at [https://www.w3.org/css-validator].


    Before you ask: CSS is insensitive in all aspects under its control. Unfortunately,
    everything is not under its control and there are situations where cases matter.
    So as with HTML, I suggest that you stick to lower-case letters and you''ll be
    fine.


    # 3.4 CSS Values


    **Professor:** We learned the most basic building block of CSS is a declaration,
    which assigns a value to a certain property. A question arises: which values are
    allowed for which properties? To answer it, let''s take a closer look at types
    of values defined by CSS.


    CSS values are categorized into data type groups, and only values belonging to
    certain data types are allowed to be used for certain properties. There are, for
    example, data types like `<color>`, which is used when you want to set any color
    property, or `<length>`, used for setting different sizes and dimensions. Don''t
    get confused by the angle bracket notation, which resembles HTML tag. In CSS,
    angle brackets are used to denote a data type.'
