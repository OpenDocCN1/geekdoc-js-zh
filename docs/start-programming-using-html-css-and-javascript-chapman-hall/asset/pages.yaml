    # E.17 window (Client-Side JavaScript)


    The global property is a reference to the Window object, which represents a browser
    window or tab. It acts as a global object in client-side JavaScript, which means
    that you do not have to refer to it explicitly. All properties and methods of
    the Window object can be used as though they were global variables and functions.
    For example, if you want to invoke the setTimeout() method of Window, you simply
    use setTimeout() instead of window.. Also, all global variables and functions
    that you define in your script are in properties and methods of Window.


    Some of the properties and methods of Window actually operate on the browser window.
    Others are merely generic global variables and functions. Apart from these, Window
    also implements all global variables and functions of core JavaScript. Some of
    them are listed in section E.11 on page 406 of this appendix.


    A peculiar thing is that window, which refers to the Window object, is the property
    of the Window object itself. This makes the expressions window, window.window,
    window.window.window, and so on all return the same Window object.'
