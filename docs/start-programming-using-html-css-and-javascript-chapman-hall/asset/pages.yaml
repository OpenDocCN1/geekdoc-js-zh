  md: '# localStorage and sessionStorage Objects


    The Web Storage API is composed of two objects, localStorage and sessionStorage
    Storage, which are defined as properties of the Window object. Both objects are
    in associative arrays that store key-value pairs and implement exactly the same
    set of methods and properties. The only difference between them is their scope
    and persistence, which define who can access the data and for how long.


    Data stored in a sessionStorage object—as the name suggests—are roughly limited
    to a single browser tab, both in their scope and persistence. If you open the
    document in two different tabs, each of them will have its own sessionStorage
    object, which means that scripts from one tab cannot access (neither read nor
    write) data stored by scripts from the other tab. Data stored in a sessionStorage
    object will be deleted as soon as you close the tab associated with them.


    On the other hand, data stored in the localStorage stay on the user''s computer,
    or until a web application explicitly deletes them or a user clears them through
    the browser''s user interface. Besides, localStorage has a broader scope than
    sessionStorage—is scoped by the origin of a document. The document origin is determined
    by a protocol, a hostname, and a port, and a change to any of these changes the
    document origin. For example, the following URLs represent four different origins:


    ```

    http://www.nowheresite.com

    https://www.nowheresite.com (A different procol)

    http://www.nowhere-site.com (A different hostname)

    http://www.nowhere-site.com:42 (A different port)

    ```


    All documents with the same origin share data from a single localStorage object,
    which means that they can read as well as override each other''s data.


    Note that physical memory used to store local data is set aside by the browser
    and cannot be accessed by browsers of other vendors. This effectively limits localStorage
    scope to a specific browser vendor as well. So, if you visit a site using one
    browser, you cannot access data stored during that visit through another browser,
    even if you are viewing the same site within the same origin.


    # Storage API


    As mentioned, the localStorage and sessionStorage objects store associative arrays
    of key-value pairs. One way of using these objects is that you simply set and
    query their properties as you do with any other JavaScript object. For example,
    you can store a counter with a value of one in either of the following two ways:


    ```

    localStorage.counter = 1;

    localStorage["counter"] = 1;

    ```'
