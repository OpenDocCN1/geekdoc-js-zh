    >\n  <script src=\"scripts/sudoku.js\"></script>\n</head>\n<body>\n  <div id=\"\
    sudoku-puzzle\"></div>\n</body>\n</html>\n```\n\nNotice that the code is practically\
    \ the same as it was for the math worksheet generator, and you will probably have\
    \ guessed that the whole Sudoku puzzle goes into the only <div> element the document\
    \ body. That said, the style part is a little more intriguing. The sudoku.css\
    \ file, to which the above HTML refers, starts with the following rule:\n\n```\n\
    .sudoku-table {\n  border: 2px solid;\n  border-collapse: collapse;\n}\n```\n\n\
    This rule simply sets a border around the puzzle and eliminates space between\
    \ cells. Now comes the interesting part: we need to draw two additional vertical\
    \ and horizontal lines to visually separate the 3 × 3 boxes. We can do this using\
    \ the :nth-child() selector:\n\n```\n.sudoku-table td:nth-child(3n) {\n  border-right:\
    \ 2px solid;\n}\n.sudoku-table tr:nth-child(3n) {\n  border-bottom: 2px solid;\n\
    }\n```\n\nThe first of the above rules selects every third <td> element that is\
    \ a descendant of an element whose class attribute is set to sudoku-table, and\
    \ makes its right border and two pixels thick. Similarly, the second rule selects\
    \ every third <tr> child element and makes its bottom border thicker.\n\n**Mike:**\
    \ How exactly does the :nth-child() selector work?\n\n**Professor:** The :nth-child()\
    \ selector accepts as argument an expression of the form an+b, which reads: \"\
    Select every ath child starting with the bth child.\" For example, suppose you\
    \ want to select every second child, starting with the first one. You can do that\
    \ with the following selector:"
