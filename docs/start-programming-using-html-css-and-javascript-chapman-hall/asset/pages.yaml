  md: '# <input>


    | Description | Represents a typed data field, most often with a form control
    for the user to edit the data. |

    | Context | Usually, it is used as a descendant of a <form> element. If not, then
    it should have specified the form attribute. |

    | Content | This is a void element. |

    | Display | Inline |


    # Attributes


    ```

    autocomplete

    ```


    This attribute determines whether the browser can automatically complete the value
    of the control. It has one of two values:


    +   - on: The browser is allowed to automatically complete values according to
    the values that have been entered during the previous uses of the form.

    - off: The user must enter a complete value into this field each time, or the
    document will provide its own method of autcompletion. The browser will not automatically
    complete entries.


    If this attribute is not set, the browser uses the autocomplete attribute value
    of the <form> element to which this <input> element belongs to a form that is
    either its parent, or the <input> element''s form attribute equals the form''s
    id attribute value.


    ```

    checked

    ```


    This Boolean attribute is used only when the type attribute is set to checkbox
    or radio, and it is specified without a value. If the checked attribute is present,
    then the control is selected by default.


    ```

    form

    ```


    This attribute connects an <input> element with a specific form, which this becomes
    the <input> element''s owner. The value of the form attribute must be equal to
    the value of the id attribute of the form. If this attribute is omitted, then
    the <input> element must be a descendant of a <form> element.


    ```

    max

    ```


    Defines the maximum possible value for this control, which must not be smaller
    than the value of the min attribute.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# min


    Defines the minimum possible value for this control, which must not be greater
    than the value of the max attribute.


    # name


    Specifies the name of the control, which is used in form submission.


    # readonly


    This is a Boolean attribute and is specified without a value. If it is present,
    then the visitor cannot modify the value of the control.


    # step


    This attribute is used together with the min and max attributes, and specifies
    the increment at which one can set a numeric value.


    # type


    Defines the type of the form element. If this attribute is not given, then the
    default value text is assumed. Some of the possible values are:


    +   * button: A push button.


    +   * checkbox: A check box. If the type attribute is set to checkbox, then the
    value attribute should also be used in order to specify the value submitted with
    the item. The checked attribute can be used to indicate that the item is initially
    selected.


    +   * number: A field for entering a floating point number. With the type attribute
    set to number, the attributes value, min, max, and step are often used. If they
    are not explicitly set, the default values min = 0, max = 100, and step = 1 are
    used.


    +   * password: A text with no line breaks that obscures data entry.


    +   * radio: A radio button. The value that will be submitted by this element
