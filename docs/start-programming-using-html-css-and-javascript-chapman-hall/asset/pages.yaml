  md: 'English and Finnish examples are of natural languages, which people learn to
    communicate with other people. However, if you want to talk to computers, you
    have to learn artificial languages so that computers understand and obey. It''s
    very similar. The only difference is that people won''t obey you if you lack charm,
    while computers won''t obey you if you''re not accurate. Accuracy is crucial.
    Similar to both that is it takes a certain amount of practice before your interlocutor
    understands. I won''t lie to you on this.


    **Maria:** I''m just starting to learn Spanish and I Must use a sign language
    a lot. I suppose you cannot use a sign language with a computer.


    **Professor:** That''s true. In natural languages, people use context and even
    a sign language to guess what others say to even say what they say may not be
    grammatically correct. Computers don''t do that, though, and that''s the difficult
    part of programming. You have to *exact*.


    All right. Let''s start programming, shall we?


    # 1.2 Introducing HTML


    **Professor:** To be precise, HTML is not a programming language but it is a so-called
    markup language. What''s the acronym HTML stands for: Hypertext Markup Language.
    Markup is a modern approach for adding annotations to a document in such a way
    that these annotations are distinguishable from plain text. Markup instructions
    tell the program that displays your text to perform while the instructions are
    hidden from the person who views your text. For example, if you want a certain
    part of your text to appear as a paragraph, you simply mark that part of the text
    using *tags*.


    ```

    <p>It''s my only line!</p>

    ```


    **Maria:** It looks quite straightforward. Are those p''s in the angle brackets
    like commands?


    **Professor:** You could say that. They are called *tags* and they *instruct*
    or *command* to make a paragraph out of the text between them.


    **Mike:** In a way, yes. Tags are like commands in a word processor, isn''t it?


    **Professor:** In a way, yes. Tags are like commands in a word processor that
    allow you to format paragraphs, headings, and so forth. However, they only specify
    *what* to format, not *how* to do it.


    The above code fragment is an example of an HTML *element*—the basic building
    block of an HTML document. An HTML document is composed exclusively of elements.
    Each element is further composed of a *start tag* and *end tag*, and everything
    in between is *content*:'
