  md: 'Maria: It seems the browser ignores everything between the angle brackets-including
    the brackets themselves.


    Professor: Good observation. What the browser is actually ignoring here is an
    unknown tag. HTML is a computer language, which follows a certain well defined
    set of rules that we call syntax. Those rules come in the combination of different
    symbols that define what content needs to be. For example, a left angle bracket
    (< immediately followed by some text followed by a right angle bracket>) is an
    opening tag—a message to the browser that a new element has started. The tag itself
    is not displayed. The browser does not display the tag if it does not recognize
    it. An unrecognized tag is silently ignored.


    Let''s go back to our example. The problem is not that the tag isn''t recognized
    by the browser, since we didn''t use any tag in the first place. The less-than
    sign has a special meaning for the browser, which interprets it as the beginning
    of an opening tag rather than displaying it. A character that has a special (reserved)
    meaning is called a reserved character. To be able to display reserved characters,
    HTML has defined additional syntax rules called character entities. Character
    entities are not limited to the reserved characters, though. They can be used
    to display any character. For example, a character that is not present on your
    keyboard.


    The syntax for a character entity is an ampersand (&) followed by an entity name
    followed by a semicolon);


    ```

    kentity_name;

    ```


    All browsers should support at least these five entities:


    | Display Character | Entity Name | Description |

    |---|---|---|

    | < | lt | less than |

    | > | gt | greater than |

    | & | amp | ampersand |

    | " | quot | quotation mark |

    | '' | apos | apostrophe |


    Note that the entity names are case sensitive. There are of course tons of character
    entities. If you are interested in experimenting with them, I encourage you to
    search tables of character entities on the Web.


    Now we are able to rewrite our example:


    ```

    The notation x&lt;means that x is less than

    y, while x&gt;means that x is greater than y.

    ```


    Instead of entity, you can also use entity numbers, to which you should prepend
    an additional hash (#) character. Using an entity number, a character entity can
    be expressed in the form:'
  merge: -1
  pgno: 51
- img_proc: true
  md: '```

    &#entity_number;

    ```


    One advantage of using entity numbers instead of names is that the browser support
    for numbers is generally better than that for names. I''m talking about more exotic
    characters, of course, and not the basic five mentioned above. For example, if
    you would like to display a white chess rook, then you write:


    ```

    &#9814;

    ```


    You can find a list of some common HTML5 entities at www.tutorialspoint.com/html5/html5_entities.htm
    and more exotic ones like weather or recycling symbols at en.wikipedia.org/wiki/Miscellaneous_Symbols_Unicode_block.


