  md: 'and Karl Swedberg. You may also want to go directly to the official jQuery
    website jquery.com, with downloads, examples, blogs, and more.


    Unless you are reinventing the wheel, you won''t stop at the basic jQuery library.
    There are countless jQuery plug-ins for you to use (check plugins.jquery.com,
    for example). Plug-modules add that functionality, and jQuery plug-ins are just
    plain files of JavaScript code. There''s even a whole library of popular jQuery
    plug-ins distributed under the name jQuery User Interface (jQueryUI, available
    at jqueryui.com). With these UI plugins you can make elements on your page, droppable,
    resizable, sortable. You can also find practical widgets like date picker, with
    a convenient calendar, or progress bar. The jQuery UI library also comes with
    beautiful CSS themes, and if you don''t find what you taste, you can compose and
    design your own with their ThemeRoller.


    # B.5 Go Mobile


    If haven''t already done so, it is probably time to start thinking about programming
    for mobile devices. The good news is that HTML5 allows you to take advantage of
    everything you''ve learned about HTML, CSS, and JavaScript. By using the newest
    HTML5, CSS3, and JavaScript features, you can build applications that look and
    feel like native. With the latest browsers on the market, even speed is no longer
    a concern—most web applications built upon the newest technologies are as fast
    as native applications. Apart from that, HTML5 allows you to "install" web applications
    in your browser and run offline, so your users need not to be connected to the
    Internet to use them.


    One big disadvantage of native applications is that they are programmed for a
    specific target platform, mainly using very different technologies. You need to
    learn the Objective C and Xcode development environment if you want to program
    Apple''s native iOS applications, or you will have to learn Java along with the
    Eclipse development environment you want to program native Android applications,
    for example. By creating web applications, you can mostly forget about the differences
    between different platforms. With minimal modifications, your application will
    run on most, if not all, devices.


    # Mobile Interaction


    It''s true that you can view most web pages and run most web applications designed
    for desktop computers on your mobile device. Just because you don''t have a mouse
    connected to your mobile, that doesn''t mean you are handicapped when trying to
    follow a hyperlink, for example. In mobile devices, mouse events are simulated
    when touch events occur. This is essential for keeping the mobile web alive. That
    said, when you design a page or application with a mobile device already in mind,
    you can improve your user''s experience quality.


    There are some considerations that you should give your design if you really want
    to think mobile. First, there''s the type of web navigation: instead of the mouse
    and keyboard used with desktop browsers, mobile users navigate the Web with their
    fingers, swiping, and rotating the device. For the programmer, this basically


