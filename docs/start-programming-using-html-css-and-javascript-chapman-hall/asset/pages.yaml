    It accepts one, two, or four-separated values that define the radius of the circles
    used to round the corners. If only one value is given, it is used for all four
    corners. If two values are given, the first is used for top left and bottom right,
    and the second is used for top right and bottom corners. If four values are given,
    they are interpreted in this order: top left, top right, bottom right, and bottom
    left.


