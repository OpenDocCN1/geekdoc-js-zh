  md: '# About the Author


    Iztok Fajfar got his first computer in the early 1980s, a ZX Spectrum with an
    amazing 48 KB of RAM. Computers soon turned into a lifelong fascination and an
    indispensable companion, assisting him in his professional work and hobbies alike.
    Iztok has a PhD degree in electrical engineering from the University of Ljubljana,
    Slovenia, where he is currently Associate Professor at the Faculty of Electrical
    Engineering. His research topics include evolutionary algorithms, in particular,
    genetic programming. He teaches computer programming at all levels, from assembly
    to object-oriented, and to all kinds of audience. Now and then he even ventures
