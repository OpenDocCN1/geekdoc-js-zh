    # 5.8 Special Selectors


    **Professor:** Sometimes you want to style some portion of your document, but
    for one reason or another, you don''t like the idea of adding additional *class*
    or *id* attributes, or even new elements to your HTML code. There are techniques
    that come in handy such cases.


    You can choose from several predefined *pseudo-classes* and *pseudo-elements*.
    These come in handy when you need to select parts of a document that are not finished
    with tags but are still easy to identify, the first letter of a paragraph, or
    a link that the viewer has already visited. All pseudo-class names begin with
    a single colon (:), while pseudo-element names begin with a double colon (::).


    For example, if you want to show the links that have already been visited differently
    from the ones that have not been, you can use the :visited pseudo-class. Can you
    guys write a rule for me that will color all the visited links gray?


    **Mike:** Is a pseudo-class selector?


    **Professor:** Correct. Pseudo-classes and elements are actually selectors, and
    they are used like any other selector.


