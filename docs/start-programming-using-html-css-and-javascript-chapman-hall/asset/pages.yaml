    # B.3 Ajax


    In the not-so-distant past, to retrieve data from a web server, browsers had to
    reload the web page. Not only was this slow due to the substantial amount of data
    that had to be sent back and forth, but it was also uncomfortable for the user
    as the whole page disappeared and reappeared even for updating the server. Then,
    in 2005, the term Ajax was fashioned, which originally stood for Asynchronous
    JavaScript and XML. Ajax was first used by Google in its magical Google, the other
    name for Google''s auto-complete functionality. It works so well that a visitor
    starts to enter letters in a field, a dropdown menu appears, suggesting for the
    user possibly interesting things. The information is coming from the web server,
    the whole page stays during the operation. This is fact the only—albeit extremely
    important—advantage of Ajax: it permits a page to be updated from the web server
    without ever reloading the page. That way, web pages feel more responsive, greatly
    enhancing the user experience. How is that accomplished?


    Ajax isn''t a technology in of itself, but rather an interaction of more technologies
    working together. You need JavaScript, an XMLHttpRequest object, and some server-side
    scripting. The latter is, unfortunately, not covered in this book. Nevertheless,
    you will get a basic idea of how Ajax works.


    All the traffic between web browsers and servers is specified by the Hypertext
    Transfer Protocol (HTTP), which is usually not controlled by scripts but happens
    as a consequence of user actions such as following a link or typing a URL. That
    said, the XMLHttpRequest object defines an API that allows control HTTP requests
    through JavaScript code. Basically, JavaScript uses an XMLHttpRequest object to
    send a request to a web server, which responds by sending some data back. JavaScript
    then collects the retrieved data, again through the XMLHttpRequest object, and
    does with whatever it likes.


    Before you can use the just-mentioned HTTP API, you must create an XMLHttpRequest
    object:


    ```

    var myRequest = new XMLHttpRequest();

    ```


    Now you''re ready to make an HTTP request, which is made by calling the open()'
