    # Events


    There are few events that browsers fire directly at Document objects. Most events
    that a document will receive events that have been fired at the elements it contains
    and have bubbled up to the document. Hence, the Document object supports all of
    the Element''s event-handler properties, some of which are listed on page 402.


    Event bubbling, or event propagation, is a mechanism that fires an event not only
    at the element on which it occurs also on all its ancestors up the document tree.
    Event bubbling allows you to register a single event handler on a document or
    some other container element, which is sometimes more convenient than to do on
    each element separately.


    # E.8 Element (Client-Side JavaScript)


    Each element in an HTML document can be represented by an Element object in JavaScript
    code. The properties and methods of Element allow you to query and manipulate
    elements on a web page. Since Element is a subclass of Node, you can use the properties
    and methods of Node on Element objects as well. A very important subject matter
    connected with Element are events. Web browsers fire kinds of events on HTML elements,
    and Element has defined different event-handler properties to handle these events.


    # Object Instance Creation


    The Element object defines no constructor of its own, but you can create elements
    using the createElement() method of Document. After creating a new element, you
    must insert it into the document using methods like appendChild() of the Node
    object.


    You can also obtain the elements that already exist on a web page. Under the Document
    object, you will find properties like head and body, which return specific elements,
    and many methods that allow you to obtain elements according to different criteria
    like getElementById(), getTagName(), or getElementsByClassName(), for example.
    Note that some of these methods are defined not only on Document but also on Element.


    # Properties


    In this section, you will find list some of the properties that Element defines.
    Apart from these, you can also use the properties listed under Node (as Element
    is a subclass of Node) and properties which, for the most part, have the same
    names as attributes of corresponding HTML elements.'
