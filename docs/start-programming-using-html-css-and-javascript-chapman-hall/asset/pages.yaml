    * Names can contain numbers and underscores (_) as well. For example, your variable
    can be B42s. If a variable is composed of more than one word, you can use underscores
    to separate the words. Because spaces are not allowed. For example, number_of_lives
    is a valid variable name. Many programmers including me—use a camelCase form of
