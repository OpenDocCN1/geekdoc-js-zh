  md: '+   - Ancestor: An element that contains other elements is their ancestor.
    In the above family tree, the <html> element is an ancestor of all other elements,
    while the <article> element is an ancestor of <h1>, <h2>, <footer>, <a>, and all
    three <p> elements.


    +   - Descendant: An element that is contained another element is its descendant.
    In our HTML family tree above, the <h1> element is a direct descendant of the
    <article> element it is also a (more distant) descendant of the <body> and <html>
    elements.


    +   - Parent: A parent of element is its closest ancestor. In our example, the
    <body> element is the parent of the <article> element, while the <article> element
    is the parent of both headings, all three paragraphs, and the <footer> element.


    +   - Child: A child of element is its closest descendant. In the above family
    tree, the <title> element is a child of the <head> element.


    +   - Sibling: Elements that are children of the same parent are called siblings.
    They are just like brothers and sisters. In the above example, both headings,
    all three paragraphs, and the <footer> element are siblings.


    Mike: Are <title> and <article> also siblings?


    Professor: You must be careful. Although they are on the same level in the three,
    they have different parents. Therefore they are not siblings.


    # 4.7 Inheritance


    Professor: One of the most important consequences of the family relations between
    HTML elements is the ability of elements to inherit certain traits from their
    ancestors. Because elements only have one parent, it is easier to predict which
    characteristics will be passed on to the next generation than it is with humans.


    In practice, inheritance works very simply: property values are propagated from
    parents to their children. For example, if you set font type for a paragraph,
    then all the children of any paragraph will inherit the same font type. If any
    of those elements have their own children, the same font type will pass further
    down to the children of the children.


    Maria: When we set the font-family property of the article for our homework, inheritance
    was indeed helping us. The same font family was automatically applied not only
    to the article''s children but also to the <a> element, which in our case was
    a more distant descendant of the <article> element.


    Also, because <body> is the ancestor of all the elements on the page, setting
    a font on <body> will set the font for the whole page.


    Professor: Exactly.


