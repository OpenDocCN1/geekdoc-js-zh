    fact is that if you want, for example, to remove a graphical object from the bitmap,
    you must redraw the whole bitmap by yourself or at least redraw the part of the
    bitmap affected by the removed object.


    To set up a canvas in HTML, you most commonly provide the id for easier reference
    from JavaScript code, the width and height attributes to set physical dimensions
    of the element. The <canvas> element can also have content, which will only be
    displayed if the visitor''s browser doesn''t support it. This is an example of
