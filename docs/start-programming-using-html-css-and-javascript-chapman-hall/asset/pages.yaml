  md: '# Introduction


    # Easy to Use


    Normally, putting honey in my tea is not a particularly demanding task, but that
    morning my hand was paralyzed in astonishment, trying to do its routine job of
    pouring some honey in the steaming cup. Honey labels usually say things like “All
    Natural,”Contains Antioxidants,” or “With Grandma’s Recipe Book.” Over time, I’ve
    got used to more absurd labels like “New Flavor” or “Gathered by Real Bees.” The
    label that knocked me was surprisingly plain, with an award-winning message printed
    on it: “Easy to Use.” I don’t recall honey ever being hard to use, except maybe
    when it crystallizes, or when I was six months old, but that’s probably not what
    the author of the message had in mind.


    You can also buy programming books that promise ease and quick learning, as fast
    as an average adult can read a novel in 24 hours. But let’s face it, no one can
    readalone understand and learn—a 500-page technical book in 24 hours. Using honey
    is not difficult even when it doesn''t explicitly say so, learning to program
    is not easy. It can be fun if you’re motivated and have decent material to study
    from, but it’s also an effort. If you’re not ready to accept that, then this book
    is not for you. Otherwise, I invite you to join Maria, Mike, and me at exploring
    the exciting world of computer programming. It’s going to be fun but it’s also
    going to be some work.


    # About the Book


    This handbook is a manual for undergraduate students of engineering and natural
    science fields written in the form of a dialog between two students and a professor
    discovering how computer programming works. It is organized in 13 thematic with
    explanations and discussions, supported by gradual evolution of engaging working
    examples of live web documents and applications using HTML, CSS, and JavaScript.
    You will see how the three mainstream languages interact, and learn some of the
    essential practices of using them to your advantage. At the end of each meeting
    there is a practical homework, which is always discussed at the beginning of the
    next meeting. There is also a list of related keywords to help you review important
    topics'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'of meeting.


    The general structure of the book is multilayered: the basic language syntax and
    rules are fleshed out with contents and structure while still keeping things simple
    and manageable, something many introductory textbooks lack.


    The main body of the text is accompanied by five appendices. The first of them
    contains a solution of the last homework, the second summarizes (also with examples)
    some major directions in which you can continue your study, including hints on
    some of the relevant sources. The last three appendices are abbreviated references
    of the three languages used in the book.


    There will be situations when you need to use more languages and technologies
    to get the job done. Some such situations are greatly dealt with in this book.
    For example, you will learn just enough about a Server Side Includes language
    to be able to include external HTML code, which will save you a tremendous amount
    of time and energy.


    # Is This Book for Me?


    If you know absolutely nothing about computer programming and want to learn, this
    is the book for you. It has been written with a complete beginner in mind in the
    first place.


    If you have been exposed to programming before, you might find the book useful
    as well. Today, many people learn from examples and forums, and this acquired
    knowledge is mostly skills and not much theory. If you ever want to build more
    software, you need a firm and systematic understanding of what is going on. You
    need a framework to which you can systematically attach your partial skills to
    form a sound structure of connected knowledge. Hopefully, this book can give you
    this as well.


    Last but not least, if you''re a teacher of an introductory programming course,
    you might find a useful of examples and approaches for your classes on the few
    hundred pages that follow.


    But most likely, there are as many learning styles as there are learners, you
    will have to find out for yourself whether or not this book is for you.


    # How to Avoid Reading the Whole Book


    Don''t panic! If you are only up to JavaScript programming, you can just read
    Meeting 1 to get a basic idea of what HTML is (you need this in order to be able
    to run the JavaScript examples in this book), and then you can immediately skip
    to Meeting 6—more specifically, Section 6.3. There are some examples involving
    CSS in the JavaScript part but they won''t stand in the way of your learning JavaScript.
    Later, if you feel like it, you can just as well skim over Meeting 3, where you
    can get the basic idea of what CSS is all about.'
