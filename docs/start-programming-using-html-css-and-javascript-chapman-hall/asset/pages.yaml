  md: "```\nSudoku.prototype.start = function(id) {\n  var row, cell, text, number;\n\
    \  var puzzleContainer = document.getElementById(id);\n  var form = document.createElement(\"\
    form\");\n  var puzzle = document.createElement(\"table\");\n  puzzle.className\
    \ = \"sudoku-table\";\n  puzzleContainer.appendChild(form);\n  form.appendChild(puzzle);\n\
    //...\n```\n\nThe method accepts a single argument, which is the ID of the HTML\
    \ element that will contain the whole puzzle. The code begins with some local\
    \ variable declarations, followed by getting the puzzle container. The last five\
    \ lines create Element objects representing a form and table, and insert the created\
    \ elements into the document tree.\n\nWe can now create rows and table cells and\
    \ append them to the table object puzzle.\nThe following nested for loops do this:\n\
    \n```\n//...\nfor (i = 0; i < 9; i++) {\n  row = document.createElement(\"tr\"\
    );\n  puzzle.appendChild(row);\n  for (j = 0; j < 9; j++) {\n    cell = document.createElement(\"\
    td\");\n    row.appendChild(cell);\n    text = document.createElement(\"input\"\
    );\n    text.type = \"text\";\n    text.className = \"answer\";\n    cell.appendChild(text);\n\
    \  }\n}\n//...\n```\n\nThe code is nothing special, really. It creates nine table\
    \ rows and appends them to puzzle. Before going back to create the next row, the\
    \ current row is filled with nine table cells, containing a text box.\n\nAfter\
    \ each of the text boxes has been created and put in place, it's time to write\
    \ a number into it. The next code fragment puts a clue into a corresponding text\
    \ box if the cell is read-only and includes an initial clue. It also sets the\
    \ appropriate value for the class attribute and prevents the user from changing\
    \ the contents of the text box by specifying the readonly attribute:\n\n```\n\
    //...\nif (!this.board[i][j].isWritable()) {\n  text.value = this.board[i][j].getNumber();\n\
    \  text.className = \"clue\";\n  text.readOnly = true;\n}\n//...\n```"
