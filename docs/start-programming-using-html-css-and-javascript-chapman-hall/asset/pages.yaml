    # slice()


    Syntax:


    ```

    string.slice(begin)

    string.slice(begin, end)

    ```


    This method returns a portion (substring) of string containing all characters
    from including the character at the position begin and up to not including the
    character at the position end. The method does not change string. The arguments
    begin and end can also assume negative values, in which case they specify positions
    from the end of the string. For example, -1 indicates the last character, -2 the
    second to last, and so forth. If the end argument is omitted, then all characters
    from begin to the end of the string are returned.


    It is important to remember that the character at the position begin is included
    in the returned substring while the character at the position end is not. This
    may seem strange, but there are some noteworthy implications of this rule. First,
    the length of the returned string is always end - begin. Second, if you want to
    make contiguous slices of string, which you don''t want to overlap, you simply
    use the end argument of the preceding slice as the begin argument of the current
    slice.


    Examples:


    ```

    var s = "ABCDE"

    s.slice(1) //Returns "BCDE"

    s.slice(-1) //Returns "E" (the last character)

    s.slice(0, 1) //Returns "A"

    s.slice(1, -2) //Returns "BC",

    ```


