    # 6.5 Operations and Expressions


    **Professor**: What a computer program does is operations on values to produce
    new values. The operations are executed by means of *operators*, and the values
    on which they are called *operands*. However, before we plunge into the world
    of JavaScript operators let''s define an *expression*. An expression can be viewed
    as a phrase that a JavaScript interpreter can *evaluate* in order to produce a
    value. We say that an expression returns a value.


    According to this definition, an expression can be as simple as a constant or
    literal value, a certain language keyword, or a variable reference. These are
    called *primary* expressions. For example, the following are all primary expressions:


    | 3.14 | //Returns 3.14 |

    | x | //Returns the value stored in x |

