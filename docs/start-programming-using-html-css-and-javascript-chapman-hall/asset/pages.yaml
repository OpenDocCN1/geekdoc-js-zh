    **Professor**: Indeed it has. We''ve been using the Document''s write() method
    in order to write text to the document, which we are no longer going to do. Instead,
    we''re going to use Document''s other methods and properties in order to work
    with its content.


    One of the more important methods of the Document object is getElementById(),
    which returns a reference to an Element object that represents a specific HTML
    element you want to fetch. The method make use of the id HTML attribute to identify
    the HTML element you want to fetch. Because the value of the element''s ID must
    be unique within the document, you''ll always know exactly which element you have
    got a reference to.


    Don''t panic, here comes an example. Imagine you have the following line of HTML
    code somewhere in your document:


    ```

    <div id="click-me">Click me, please.</div>

    ```


    If you pass the value of the id attribute as an argument to getElementById(),
    you get a reference to the Element object representing the above <<div>> element:


    ```

    var myDiv = document.getElementById("click-me");

    ```


    The following picture shows how a DOM object gives JavaScript access to different
    parts of an HTML element through its corresponding properties.


    | Property | Value |

    | --- | --- |

    | tagName | *DIV* |

    | id | *click-me* |

    | innerHTML | "Click me, please." |


    ```

