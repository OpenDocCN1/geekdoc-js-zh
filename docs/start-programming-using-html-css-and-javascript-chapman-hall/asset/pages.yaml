    # border (Obsolete)


    This attribute specifies whether a border is to be displayed around the table
    and between cells. Historically, this attribute was used for specifying the border
    width, which has now become obsolete for that purpose, don''t use it for border
    styling. Instead, use CSS properties like border-width or border-style. You can,
