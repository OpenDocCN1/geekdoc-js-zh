  md: 'Let''s start with the most basic <number> and <integer> data types. The first
    represents a <number>, either integer or fractional, while the latter represents
    only an integer. Examples of <number> values would be 42, 1.6, or -12.5, while
    <integer> values are, for example 7, 99, or -10.


    Two more data types that will be useful for us are <length> and <percentage>,
    for specifying dimensions and relative values, respectively. The <length> data
    type is composed of a <number> immediately followed by the length unit, like px
    or em. Similarly, the <percentage> data type is composed of a <number> immediately
    followed by the percentage sign (%). I already mentioned that there should be
    no space between a number and the unit literal. Nor should there be any space
    between a number and the percentage sign.


    Mike: How does that look in practice?


    Professor: OK, here''s an example. If you look up the font-size property in the
    CSS reference on page 344, you''ll see a possible value for that is a <percentage>
    value. You know that the <percentage> data type is defined as a <number> immediately
    followed by the percentage sign, you know exactly that the following are all valid
    declarations giving a value to the font-size property:


    ```

    font-size: 75%

    font-size: 12.5%

    font-size: 120%;

    ```


    Maria: And exactly is the effect of setting a font size to 120 percent? 120 percent
    of what?


    Professor: Of the parent''s element font size. I''ll explain more about that next
    week we talk about relative sizes in general. Let''s return now to CSS data types.


    An interesting one is the <url> data type, which lets you specify the URL of a
    file. Most usually, that will be a file containing graphics of some kind. For
    example, if you want a nice picture in the background of an element, you declare:


    ```

    background-image: url(/backgrounds/nicepicture.jpg);

    ```


    You use the url() function and put the desired URL in parentheses. You specify
    a URL in the same way as you specify a URL of the href HTML attribute: you can
    use either an absolute or document- root-relative URL. Note that relative URLs
    are relative to the URL of the style sheet and not to the URL of the web page.


    In the above example, there are no quotation marks around the URL. However, if
    there are any spaces within a URL, then quotes must be used. You can use either
    single or double quotes:


    ```

    background-image: url(''/backgrounds/nice picture.jpg'');

    background-image: url("/backgrounds/even nicer picture.jpg");

    ```'
