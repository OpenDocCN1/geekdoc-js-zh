    variable name.

    * Names cannot start with a number. You cannot use 42 as a variable name while
    _42 is a perfectly legal name.

    * Names can start with a dollar sign ($) as, for example, $awesome. Personally,
    I don''t see any need for using a dollar sign. You will, however, find it used
    in the popular jQuery library, about which you can read in section B.4 of this
    book.

    * JavaScript is case sensitive, which means that counter is considered a different
    name from Counter.

    * Reserved words cannot be used as variables. Reserved words are the keywords
    that have a special meaning in the language. For example, var is a reserved word
    that helps you declare a variable and cannot be used as a variable name. This
    is the list of words that JavaScript reserves:


