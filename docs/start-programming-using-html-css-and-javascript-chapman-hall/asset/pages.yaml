    ```


    The inequality operator (!==) is exactly the opposite of the === operator, and
    it performs no type conversion either:


    ```

    "42" !== 42      //Returns true

    true != 1         //Returns true

    null !== undefined //Returns true

    ```


    The special case, as you already know, is the NaN value. This value is never equal
    to any value, including itself. Therefore, if you want to check whether a value
    of x is NaN, you write:


    ```

    x !== x //Returns true if and only if x equals NaN

    ```


    The equality operator (==) is less strict. Essentially, it works like the strict
    equality except that it attempts certain conversions if it discovers that the
    operands are not the same type. The operator uses the following rules:


    +   - Values null and undefined are considered equal.

    - If a number is compared to a string, then a string is converted to a number
    and the converted number is used in comparison.

    - If either value is true or false it is converted to 1 or 0, respectively, before
    used in comparison.


    For example, the next comparisons all return true:


    ```

    null == undefined

    5 == "5"

    false == "0"

    ```


    In the last of the above lines, false is converted to the number zero before the
    comparison is made. Since the types are still different, the string "0" is then
    converted to the number zero and the comparison is performed again. Because both
    numbers are now the same, the expression returns true.


    The inequality operator (!=) is of course the exact opposite of the equality operator.


    Comparisons other than equality and inequality can only be carried out on strings
    and numbers. There are three possible situations:'
