    ```


    By doing that, we create another anonymous scope chain and append it to the existing
    one. Note that the existing scope chain only contains the global object because
    count() is invoked within global. Exactly was the same with the first invocation
    of the count() function, and we end up with two scope chains, both starting with
    the global object. Here''s an illustration of the two scope chains of the two
