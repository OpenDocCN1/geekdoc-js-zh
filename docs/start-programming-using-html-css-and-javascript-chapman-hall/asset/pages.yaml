  md: '# APPENDIX D


    # # CSS Mini Reference


    This appendix is a handy list of some of the most useful CSS properties, pseudo-elements,
    and pseudo-classes. Mainly they are older and well-established properties, but
    included are also some of the CSS3 properties that are well supported by modern
    browsers. If you want to plunge deeper into CSS, there exist many exhaustive sources
    that might want to look at. For example, CSS3 by D. S. McFarland, or developer.mozilla.org/en-US/docs/CSS/CSS_Reference.
    For full details about the latest CSS specification right from the horse''s mouth,
    visit the World Wide Web Connection at www.w3.org/Style/CSS/current-work.


    # ## D.1 CSS Data Types


    Each CSS declaration consists of a property name and a corresponding value. Values
    are categorized according to CSS data types, most of which are described in this
    section.


    <color> Data Type


    The <color> CSS data type is used to specify a color. Usually, a color is assigned
    to fonts, borders (including shadows), and backgrounds. A color can be specified
    by either using one of the available keywords, or by using the RGB model, which
    allows you to mix red, green, and blue components to get a color of your liking.


    # ## Color Keywords


    You can specify color directly by its name using a color keyword. Color keywords
    are case-insensitive. Although there are many of them, 17 color names are currently
    understood by all browsers: aqua, black, blue, fuchsia, gray, lime, maroon, navy,
    olive, orange, purple, red, silver, white, and yellow. Note that none of the colors
    defined by keywords can have any transparency. If you want to use transparent
    colors, then you must use the rgba() function.


    A special color keyword is the transparent color, which represents a fully transparent
    color. Technically, this is a black color having the alpha channel set to its
    lowest value and it is equivalent to rgba(0, 0, 0, 0).


    339'
  merge: -1
