    # :nth-child()


    The :nth-child() CSS pseudo-class allows authors to select any combination of
    alternating child elements. An extra piece of information in parentheses is needed
    in order for this pseudo-class selector to work. The simplest option is to use
    one of the keywords odd or even, which select alternating odd or even elements.
    Every ath child can also be selected, optionally starting with an arbitrary chosen
    child (bth), using this syntax:


    ```

    :nth-child(an + b)

    ```


    Constants a and b must be integers. If b is omitted, it is assumed to be 1. Note
    that child counting begins with one so that the element''s first child has an
    index value of 1.


    If n and b are omitted, then only a single child will be selected, which is the
    ath child.


    # Examples


    ```

    /* Select every second child, starting with the first one: */

    nth-child(2n+1)

    :nth-child(odd) /* The same as above. */

    /* Select every third child, starting with the first one: */

    nth-child(3n)

    /* Select every third child, starting with the second one: */

    nth-child(3n + 2)

    /* Select the first child of the body: */

    body :nth-child(1)

    /* Color every second row of a table: */

    tr:nth-child(even) {

    background-color: lightgray;

    }

    ```


    # :visited


    The :visited CSS pseudo-class matches a hyperlink that a visitor has already visited
    and is saved in the web browser''s history. Using this pseudo-class selector,
    you can show your visitor the links that he/she has already followed in a different
    color. The :visited pseudo-class only works with hyperlinks.'
