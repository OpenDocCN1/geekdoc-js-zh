  md: 'Since we didn''t actually build a whole website, we used hash signs (#) as
    placeholders for links, like you told us to the last time.


    **Professor:** What pleases me most is that you didn''t use a table to build the
    menu system. It is the lock of many menus that fools some people into thinking
    that they are tables. Logically, a menu is a list of items, but the main menu
    items are often arranged horizontally, which is a little unusual for a list in
    general.


    **Mike:** There is, however, one question bothering us. We believe that the same
    menu will appear at the top of most of the pages of our website. Now, if the pages
    resided in different directories that are not all the same level of the directory
    tree, we would have to use different relative URLs for the links in the same menu
    in different documents. That''s a lot of work. We believe that absolute URLs are
    not a solution either. If we had to move the whole website to some other location
    for one reason or another, then all the absolute URLs would have to change. What
    shall we?


    **Professor:** Very good question indeed. There are generally two schools of thought
    concerning URLs for hyperlinks to a website. The first teaches that relative URLs
    should be avoided by all means while the second claims the opposite. Many argue
    that have to do with principles well beyond the scope of our course. Personally,
    I wouldn''t use absolute URLs within my website. I always test my pages on a local
    server to not open to the public. If I used absolute URLs, then I would shoft
    my test to the already published pages any time I clicked a hyperlink. On the
    other hand, using relative URLs too clumsily can create example socalled spider
    traps. Web spiders (also named weavers) are programs that systematically browse
    the World Wide Web, most often for the purpose of indexing. A spider trap is a
    set of web pages (intentionally or unintentionally) produce an infinite number
    of requests from web spiders and may cause a poorly written spider to crash.


    In my opinion, if you are consistent and careful with your coding, and you hold
    to the standard rules, no harm can be done using relative URLs. However, to access
    files that are not inside the current directory, it is probably the best practice
    to use root-relative URLs. And by this way, this is also the best solution for
    a website menu system, which was your original question.


    **Maria:** I see. But then we have to put all our files and directories into the
    root directory. I don''t think that''s a good idea.


    **Professor:** The trick is that the root directory does not have to be unique
    within a directory tree, which is usually the case under Windows. In fact, each
    process (program) can have its own idea of what the root directory is. I think
    that we have arrived at the point where you can learn to set up your first server.


    # 3.2 Setting up a Web Server


    **Professor:** A server is either a physical computer or a computer program to
    serve the needs of other programs, called clients. Since at this stage we will
    move mostly on the client side, there''s really much you need to know about servers.
    A server is like a good servant, serving your needs while hiding all the dirty
    details from you. A'
