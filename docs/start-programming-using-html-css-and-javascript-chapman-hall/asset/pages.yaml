  md: "A function expression begins with the function keyword followed by a pair of\
    \ parentheses with an optional comma-separated parameter list (par1 par). At the\
    \ end of a function expression there is a function body, which comprises any number\
    \ of JavaScript statements within curly brackets. Note that, unlike statement\
    \ blocks of while and other statements, the function body requires curly brackets.\
    \ They cannot be omitted when the function body is composed of only a single statement.\n\
    \nBecause a function is an object in JavaScript, a function expression returns\
    \ a function object, a reference to which you usually assign to a variable. In\
    \ the above definition, the returned reference is assigned to a variable fun_name.\
    \ You can then call it, or invoke the function, which will effectively execute\
    \ the code placed in its body. Notice a semicolon at the end of the function expression,\
    \ which is needed to make a statement out of the expression.\n\n**Maria:** Can\
    \ you give us a simple example?\n\n**Professor:** All right, here's a really simple\
    \ one, without any parameters for starters:\n\n```\nvar cheer = function() {\n\
    \  var i;\n  for (i = 0; i < 2; i++) {\n    document.write(\"Hip\");\n  }\n  document.write(\"\
    Hooray!\");\n};\n```\n\nYou invoke this function by referring to the variable\
    \ cheer using an additional pair of parentheses. Like this:\n\n```\ncheer(); //Writes\
    \ Hip Hip Hooray!\n```\n\nWhen you call a function, the main program execution\
    \ sequence is temporarily suspended and the code within the function body starts\
    \ to execute. After the function has terminated, the execution returns to the\
    \ main program. The following diagram shows what happens when cheer() is invoked.\n\
    \n![](img/24b7d8c3923a911c6319b3be2ce79910_208_0.png)\n\nAlternatively, you can\
    \ define a function using a function definition statement:"
