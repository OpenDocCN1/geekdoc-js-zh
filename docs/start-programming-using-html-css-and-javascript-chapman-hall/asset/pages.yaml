    # D.11 Pseudo-Classes and Pseudo-Elements


    In this section you will find some predefined selectors (called pseudo-classes
    and pseudo-elements) that you select parts of a web page that are not equipped
    with tags but are still easy to identify. Names of pseudo-classes begin with a
    colon (:) while names of pseudo-elements begin with two colons (:).


    # :active


    The active CSS pseudo-class matches an element that is being activated by the
    user: for example, when the user is pressing the mouse button while pointing to
    the element.


