  md: 'sublist allow authors to organize data in a specific way. Another element is
    <table>. Just like lists, the <table> element also has its content limited to
    a small number of allowed direct descendants. Amongst them you''ll find an optional
    <caption> element and an obligatory <tr> element. <tr> (row element) represents
    a row in a table and only its direct descendants are <td> (table data) and <th>
    (table header). The former represents table cells and the latter table header
    cells. You can stretch any data or header cell over more rows or columns using
    their rowspan and colspan attributes, respectively. The <caption> element holds
    the table caption and should appear before any <tr> elements.


    Here''s a compiled example:


    ```

    <table border="1">

    <tr>

    <td rowspan="3"></th>

    <th colspan="4">Imports</th><th colspan="4">Exports</th>

    </tr>

    <tr>

    <th value="Value"><th colspan="3">Annual change (%)</th></th>

    <th value="Value"><th colspan="3">Annual change (%)</th></th>

    </tr>

    <tr>

    <th>2010</th><th>2008</th><th>2009</th><th>2010</th>

    <th>2010</th><th>2008</th><th>2009</th><th>2010</th>

    </tr>

    <tr>

    <td>Mozambique</td>

    <td>1,200</td><td>10.6</td><td>-2.5</td><td>19.0</td><td>2,600</td><td>5.1</td><td>1.5</td><td>25.4</td>

    <td>2,600</td><td>5.1</td><td>1.5</td><td>25.4</td>

    </tr>

    <tr>

    <td>Kyrgyz Republic</td>

    <td>300</td><td>1.9</td><td>0.5</td><td>6.7</td><td>500</td><td>2.1</td><td>-1.5</td><td>2.9</td>

    </tr>

    </table>

    ```


    And this is the result in the browser.


    | | Imports | Exports |

    |---|---|---|---|---|---|---|---||

    | Value Annual change (%) | Value Annual change (%) | |

    | 2010 | 2008 | 2009 | 2010 | 2010 | 2008 | 2009 | 2010 |

