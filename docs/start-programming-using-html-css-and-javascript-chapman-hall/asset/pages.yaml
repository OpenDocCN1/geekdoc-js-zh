    **Professor:** Let me summarize the main two rules of cascade: first, the most
    specific style wins, and second, when the specificity is the same, the most recently
    applied style wins. Since severe headaches are caused by misinterpretation of
    which style is more specific, let us examine this matter a little more closely.


    Fortunately, CSS has a formula for calculating the specificity of a style. In
    a nutshell, each selector gets a corresponding number of points that reflect its
    specificity:


    +   - 1 point for an element selector (e.g., strong).

