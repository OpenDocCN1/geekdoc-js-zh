- img_proc: true
  md: "```\n:nth-child(2n+1)\n```\n\nOr, if you just want to select every second child,\
    \ you can drop the +1 part:\n\n```\n:nth-child(2n)\n```\n\nIncidentally, you can\
    \ achieve the same effect using the keywords odd and even instead of 2n+1 and\
    \ 2n.\n\nWhen you place another selector directly before this selector—without\
    \ any space, that is—then you limit the :nth-child() selector only to children\
    \ that match that other selector as well. Therefore, the expression td:nth-child(3n)\
    \ only selects every third child that is at the same time a <td> element.\n\n\
    **Maria**: But <td> is a child of a row, not a child of a table.\n\n**Professor**:\
