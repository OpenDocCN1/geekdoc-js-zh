    # 12.4 Scripting Documents


    **Professor:** The most fundamental role of client-side JavaScript is to make
    static HTML documents responsive to user and other actions and turn them into
    either dynamic documents or web applications.


    If you use JavaScript in web documents to only augment HTML with behavior, what
    you get is called Dynamic HTML or DHTML. In cases, JavaScript should only be used
    to enhance a visitor''s browsing experience. The actual content that a visitor
    can read, however, by no means depends on JavaScript.


    On the other hand, if you go beyond that of merely enhancing a visitor''s experience,
    what you get is called a web application. The HTML5 specification defines a whole
    lot of objects that you you perform-like features such as manipulating graphics
    or storing and retrieving data. Sets of objects are called application programming
    interfaces or APIs which programmers use them for interacting with different (software
    and hardware) components. There''s simply too much of everything, we''re not going
    to plunge into details. I''ll just leave you clues at the end of this course as
    which directions you can take. They are gathered in Appendix B of this book.


    It doesn''t matter whether you''re developing dynamic documents or web applications—there''s
    one API you will constantly work with. It is called the Document Object Model
    API, or DOM. Think of DOM as being an object representation of the collection
    of all the HTML elements and strings of text positioned on a web page. By using
    DOM API, the programmer can manipulate or query any element or string of text
    on a web page indirectly by manipulating or querying a corresponding DOM object.


    The fundamental object of the DOM API is the Document object, whatever is displayed
    in the browser''s window. The Document object is a property of the Window object
    and hence can be accessed as a global property under the name'
