  md: '![](img/24b7d8c3923a911c6319b3be2ce79910_315_0.png)


    The objective of the puzzle is to place the tiles in order by making sliding moves
    to the empty space.


    The example defines a single object named SlidingPuzzle, which contains the following
    properties:


    +   - tiles: a two-dimensional array of tiles.

    - empty: a plain object that holds the position of the empty space.

    - tileSize: a two-dimensional 4 x4 array of numbers from one to 16. This array
    is used to mark the starting positions of the puzzle. Because not all starting
    positions are solvable (in fact, half of the starting positions are impossible
    to solve), the program starts with an ordered array of 16 numbers and shuffles
    them before initializing the graphical interface of the puzzle. The position of
    16 is initialized as an empty space.


    The SlidingPuzzle object also has some methods:


    +   - tileSize(): sets the tileSize property.

    - shuffle(): shuffles the two-dimensional numbers array.

    - start(): initializes the graphical interface of the puzzle.

    - translateMove(): a static method that translates an integer from zero to an
    actual move towards one of the four directions (left, right, up, or down). If
    a move is not possible (because it would fall off the frame), the method returns
    false.


    The example allows the player to interact with the puzzle using a mouse or a keyboard.
    A mouse click on a tile can possibly move it (i.e., empty space at one of its
    sides) moves. Alternatively, pressing one of the arrow keys moves whichever is
    free to move in that direction. The following are the event handlers to handle
    mouse and keyboard events:


    +   - moveTo(): handles mouse clicks. If the clicked tile can move, then the handler
    moves it.

    - findAndMoveTile(): handles key presses. It searches for the tile that can move
    and if such a tile exists, it fires a click event on that tile to actually move
    it.


