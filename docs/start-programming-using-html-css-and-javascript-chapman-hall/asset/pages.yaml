  md: 'Both methods are called with arguments, the first of which is a reference to
    a function you want to schedule for later invocations, and the second is a number
    of milliseconds after the function should be invoked. The difference between both
    functions is that setInterval() repeats the function invocation in intervals of
    the stated number of milliseconds, while setTimeout() schedules the function for
    a single invocation. Both functions return a value that you can pass to the clearInterval()
    function in order to cancel all future invocations of the scheduled function.


    To get an idea of how this works, let''s take our 2016 Summer Olympics countdown
    from page 162 and make it alive. This is the HTML portion of the example:


