    # C.11 Event-Handler Attributes


    One way that HTML elements can get notified of events (e.g., mouse clicks or key
    presses) is to specify an event handler using the corresponding HTML attribute
    on an element that needs to respond to the event. Event-handler attribute names
    begin with and are the same as the names of the event-handler properties defined
    by the JavaScript Element object. You can find some of them in the table on page
    402.


    Using HTML event-handler attributes to specify event handlers is not in line with
    good practice. Namely, it requires mixing structure (HTML) and behavior (JavaScript).
    A much better approach is using the analogous properties of the Element JavaScript
    object, or even the addEventListener() method of the EventTarget object. The latter
    is not covered in this book, though.


