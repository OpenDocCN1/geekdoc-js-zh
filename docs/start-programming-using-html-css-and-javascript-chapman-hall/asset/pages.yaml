    <div id="one">1</div>

    <div id="two">2</div>

    <div id="three">3</div>

    </body>

    ```


    Consider also the following CSS style:


    ```

    div {

    width: 40px;

    height: 40px;

    border: 1px solid;

    padding: 5px;

    margin: 5px;

    }

    ```


    Because the <div> element has block display, the document window shows the three
    boxes above the other, as you can see on the screenshot.


    ![](img/24b7d8c3923a911c6319b3be2ce79910_100_0.png)


    Let''s set the position property of the second element to relative. Doing so,
    the element stays in the flow but can be displaced by any desired distance without
    disturbing the other elements'' positions. The other elements behave exactly as
    though the relatively positioned element was in the normal document flow. Consider,
    for example, the following rule:


    ```

    #two {

    position: relative;

    top: 10px;

    left: 25px;

    }

    ```


    You set the exact position of an element using the properties top, right, bottom,
    and left. Contrary to what you might think, these properties do not denote the
    direction of movement, but rather specify the space that is be inserted in the
    corresponding side of the element. For example, the declaration left: 25px; means
    that 25 px space will be inserted at the left side of the element, which effectively
    moves the element to the right.'
