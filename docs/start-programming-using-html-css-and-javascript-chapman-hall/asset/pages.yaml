    # 12.5 Timer Events


    Professor: One interesting type of events are fired by timers. Sometimes you may
    want certain portions of the code to execute later or even to execute many times
    at regular intervals. For example, you may want to remind your visitor that the
    time has expired, or to update a clock on your web page every second. There are
    two global methods, setTimeout() and setInterval(), which let you register a function
    that you want to invoke at a later time or many times. Although functions registered
    this way are invoked asynchronously as a response to the timer-elapse event, they
    are registered differently than other event handlers and we often call them callbacks.'
