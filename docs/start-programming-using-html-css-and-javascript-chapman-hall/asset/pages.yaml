  md: '# 9.2 Array Object


    **Professor:** You often have to handle a set of closely related data, in which
    case you can store data into various properties of the same object. Consider,
    for example, a rectangle, which can be described by the coordinates of its upper
    left and lower right corners, and perhaps a color. If a rectangle is rotated within
    a given coordinate system, an angle of rotation is also necessary. All these data
    could be stored as values of the properties of a single object called "rectangle".
    We will see next week how you can devise your own object types or add properties
    and methods to existing objects.


    There''s one object type built into the JavaScript language that allows you to
    store and manipulate a collection of data. This is the Array object, which is
    a specialized form of JavaScript. An *array* is an ordered collection of values,
    which are called *elements*. It is important that each element has a numeric position
    called an *index* within the array. JavaScript arrays are *zero-based*, which
    means that the first element in an array has the index value zero.


    Just like Date, the Array object is a data type and we need a constructor in order
    to create instances to work with. You can create an Array object in any of the
    following three ways:


    ```

    var a1 = new Array(); //An empty array

    var a2 = new Array(5); //Array with room for five elements

    var a3 = new Array("start", 6, 2); //Array with three elements

    ```


    The first line constructs an empty Array object to which you can add elements.
    Let me note that JavaScript arrays are dynamic, which means that they will grow
    or shrink automatically as you add or remove elements.


    In the second line, the elements are not defined but the space in the memory is
    allocated for future needs. I think that you''ll rarely use this second constructor,
    though.


    In the last of the above lines, an array with three elements is created and the
    arguments of the constructor become the elements of the array. Notice that an
    element of an array can be of any type. I used a string and numbers but you can
    use any type you like, even an object. You''re not limited to literals but may
    use an arbitrary expression for an element.


    If you call the Array() constructor with a single argument, the second constructor
    will be called if that argument is a number. Don''t forget that and make the mistake
    you did when you called the Date() constructor with a single year argument.


    If, however, you supply a single non-numeric argument, then the third constructor
    is called:


    ```

    //An array with one element set to a string value "I''m single."

    var myArray = new Array("I''m single.");

    ```'
