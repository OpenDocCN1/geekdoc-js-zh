  md: '# Professor: No.


    Maria: Why not? I managed to find an attribute called align, which aligns a picture
    to one side (left or right) and wraps text around it nicely. Have I missed something?


    Professor: You missed one thing. The align attribute is deprecated since HTML4.01
    and obsolete HTML5, not without a reason. Nearly all elements and attributes that
    were historically used for presentational purposes are considered obsolete HTML5.
    That doesn''t mean they don''t work. Worse so, they will work for some time for
    backward compatibility. Browsers are fairly forgiving when rendering a map. You
    won''t notice that you did something wrong because the mistake won''t. It is entirely
    up to you to follow the rules or not. If you want to build web pages, the HTML
    is the most important thing to do because it serves as a foundation of your web
    page. Sticking to plain, simple HTML is also important because it keeps engines
    happy. The old HTML''s approach of using formatting elements like <font>, or tables
    to lay out a page, stands in the way of a search engine''s job.


    Maria: Is there any way of testing whether your HTML is properly written?


    Professor: In fact there is. In doubt, you can resort to one of many on-line HTML
    validators (for example, validator.w3.org). You can upload your document to a
    validator and it will alert you to any errors you may have in your HTML document.


    Maria: I see things more clearly now and meanwhile I also answered some of questions.
