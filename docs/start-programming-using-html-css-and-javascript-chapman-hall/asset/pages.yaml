    As with any other HTML element, you can course of also set Canvas dimensions through
    CSS or dynamically using JavaScript.


    From within JavaScript, you fetch a reference to a canvas element in the same
    fashion as you fetch a reference to any other HTML element. For example, you can
    use the getElementById() method:


    ```

    var canvas = document.getElementById("someCanvas");

    ```


    A peculiar thing about Canvas is that most of the time you don'' actually use
    Canvas for drawing. Instead, use your drawing context object. You get this object
    by calling the getContext() method on a Canvas using the argument "2d":


    ```

    var context = canvas.getContext("2d");

    ```


    With this, you obtain a CanvasRenderingContext2D object, which can be used for
    two-dimensional drawing on the canvas. If you want to use three-dimensional graphics,
    you can use WebGL (Web Graphics Library) JavaScript API, which is the newest addition
    to the <canvas> element and is already supported by most browsers. If you want
    to use WebGL, you can refer to the developer.mozilla.org/en-US/docs/Web/WebGL
    where you''ll find a exhaustive collection of useful WebGL articles and other
    resources.


