    Frequently, there''s a third language called JavaScript, which is responsible
    for making things. This makes it a real programming language as opposed to HTML
    and CSS, which are for formatting and style-sheet languages, respectively. We
    say that JavaScript defines the behavior of a web page. Pages with appropriate
    JavaScript code can become responsive and intelligent. They can, for example,
    check if someone has filled out a form let visitors know if they left out necessary
    information or if they provided information in the wrong form. For example, if
    they entered a non-numeric character for the day of the month, or a date in the
    future or so-distant past for the date of birth, which obviously cannot pass as
    a birthday of a living person.


    JavaScript is a full-fledged programming language and you will have no choice
    but to learn some basic programming skills, that doesn''t mean it is impossible
    to use. In all, programs written in JavaScript are usually much shorter than many
    applications you are using in your everyday work, such as text processors or digital
    photo-processing software.


    By the way, do you know how to put a chicken in a fridge in three steps?


