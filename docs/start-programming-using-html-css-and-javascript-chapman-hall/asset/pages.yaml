  md: 'an iteration. JavaScript''s fundamental loop is the while statement, which
    has the following syntax:


    ```

    while (expression) statement

    ```


    If expression is falsy, then statement (also called the loop''s body) is skipped
    and the while loop is terminated. The execution continues with the code immediately
    following the while loop. Alternatively, if expression evaluates to a truthy,
    then statement is executed and expression is evaluated again. That repeats until,
    eventually, expression returns a false value. Note that statement should leave
    a side effect that it influences the value of expression, or else the loop will
    never end if expression starts off thru.


    As an example, let''s multiply two non-negative integer variables x and y by adding
    copies of y together. This is the code:


    ```

    while (x-- > 0) {

    product += y;

    }

    ```


    The result of the multiplication is stored in product. Note that product should
    be initially set to zero in order for the code to work properly.


    The flowchart of the while loop from the above example looks as follows.


    ![](img/24b7d8c3923a911c6319b3be2ce79910_154_0.png)


