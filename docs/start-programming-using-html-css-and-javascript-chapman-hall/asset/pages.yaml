    This is a static method that converts the specified universal time to the milliseconds
    since the UNIX epoch. Because the method is static, it is invoked directly through
    the Date object itself, rather than individual Date object instances. For the
    description of arguments, see the table summarizing the Date() constructor arguments
    on page 384. Note that square brackets should not be used in a method. They just
    indicate which arguments are optional.


    Although the Date() static method and the Date() constructor can accept the same
    parameters and transform them to a single number of milliseconds since the UNIX
    epoch, there are two important differences between them: First, Date() creates
    a Date object, while Date.UTC() only returns an integer. Second, the arguments
    passed to Date() are understood to specify local time, and arguments passed to
    Date.UTC() are assumed to represent universal time. By combining Date() you can
    easily create a Date object using universal time:


    ```

    // Create a Date object set to 2 p.m. on August 1, 2016 (UTC)

    var dt = new Date(Date.UTC(2016, 7, 1, 14));

