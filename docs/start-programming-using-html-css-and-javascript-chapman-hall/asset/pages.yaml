    # border-collapse


    The border-collapse CSS property specifies whether space be left between cell
    and table cells, or if borders should collapse. Namely, if you set the border-spacing
    CSS property to zero, there will still remain some space between borders of neighboring
    cells or between table borders, which produces double border lines. They will
    turn into single lines if you set border-collapse to collapse.


    # Values


