  md: '# Description


    Represents stress emphasis of its contents. Although many browsers display the
    contents of an <em> element in italics, the element is not intended to represent
    a generic italics element. the <i> element is more appropriate for that. Also,
    the <em> element should not be used to express importance. The <strong> element
    is more appropriate for that purpose.


    # Display


    Inline


    # Examples


    ```

    <p><em>Pizza</em></p> is a healthy food.</p>

    <p>Pizza is<em>is</em> a healthy food.</p>

    <p>Pizza is a <em>healthy</em></p>

    <p>Pizza is a healthy <em>food</em></p>

    <p><em>Pizza is a healthy food!</em></p>

    ```


    # <i>


