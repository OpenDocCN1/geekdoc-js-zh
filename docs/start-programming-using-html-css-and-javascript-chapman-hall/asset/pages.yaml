  md: "Maria: Why did you camelCase the readonly property, while the name of the original\
    \ HTML attribute is readonly?\n\nProfessor: Notaping your eye, does it? As it\
    \ happens, the readonly attribute is changed to readonly inside the DOM. That's\
    \ because JavaScript just loves to camelCase its identifiers and multi-word HTML\
    \ attributes are mirrored to DOM property names that are not camelCase.\n\nThe\
    \ last line of the start() method connects the oninput event-handler property\
    \ of the corresponding <input> element to the event-handler function that we're\
    \ going to write in a moment. Finally, three closing braces finish our job with\
    \ this method:\n\n```\ntext.oninput = handleInput(this, i, j);\n//Closes the inner\
    \ for loop\n//Closes the outer for loop\n//Closes the start() method\n```\n\n\
    If you look carefully at the above code, you'll notice that I didn't actually\
    \ define any function but I rather invoked one. What do you think the handleInput()\
    \ function should return?\n\nMike: Since an event-handler property should be a\
    \ reference to a function, I guess that handleInput() must return a reference\
    \ to some kind of function nested within it.\n\nProfessor: Exactly! The handleInput()\
    \ function is simply used to create a closure for the event-handler function,\
    \ a reference to which it returns. This enables us to actually pass arguments\
    \ to an event-handler function. You know, because event handlers are invoked automatically\
    \ by the system, it is not possible to pass arguments to them in the usual way.\n\
    \nThis is the handleInput() function definition:\n\n```\nvar handleInput = function(sdk,\
    \ row, col) {\n  return function() {\n    var v = parseInt(this.value);\n    this.className\
