  md: '# Methods


    # charAt()


    Syntax:


    ```

    string.charAt(n)

    ```


    This method returns the nth character of string. Note that the first character
    of a string has the index of zero and the last character has the index length
    - 1. If n does not specify a valid character index, then charAt() returns an empty
    string. Because JavaScript does not define a special character data type, the
    returned character is a string of length 1.


    Strings like read-only arrays of single-character strings, which means that instead
    of charAt(), you can also use the [] operator to extract a character from a string.


    Examples:


    ```

    var s = "Something blue";

    s.charAt(2) //Returns "m"

    s[2] //Same as s.charAt(2)

    ```


    # charCodeAt()


    Syntax:


    ```

    string.charCodeAt(n)

    ```


    This method is like charAt(), only it returns the Unicode character encoding of
    the character at a given location, instead of the string containing the character
    proper. If n does not specify a valid character index (i.e., negative or greater
    than length -1), then charCodeAt() returns NaN.


    Examples:


    ```

    var s = "abc";

    s.charCodeAt(2) //Returns 99

    s.charCodeAt(3) //Returns NaN

    "".charCodeAt(0) //Returns 87

    ```


    # fromCharCode() //Static method


    Syntax:


    ```

    String.fromCharCode(char1, char2, ..., charN)

    ```


    E.16. String (Core JavaScript) | 423'
