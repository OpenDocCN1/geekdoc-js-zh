  md: '# Drawing Rectangles and Circles


    You can draw a rectangle by simply calling the rect() method of the context object.
    The method accepts four arguments, the first two specifying the position of the
    rectangle''s upper left corner and the next two rectangle''s width and height.
    Alternatively, you can specify any other corner of the rectangle and pass negative
    width and/or height. The created rectangle represents a subpath of its owner and
    cannot be connected to any other subpath.


    If you search for a method to draw a circle, you won''t find it because there''s
    no special method for drawing circles. Instead, you can use the arc() method,
    which draws a part of a circle. The method''s five arguments are: x and y-coordinates
    of the center point, radius, a start angle, and an end angle. The angles define
    the start and end points along the circle between which an arc should be drawn
    and are given in radians. Unlike rect(), arc() adds an arc to the current subpath.
    arc() also accepts an Boolean parameter, which causes an arc to be drawn in anticlockwise
    direction.


    For example, the following code draws a circle inscribed in a square:


    ```

    context.beginPath();

    // Adds a full arc (0 to 2 * PI rads) to the subpath. The last

    // argument (true) specifies that the arc direction is

    // anticlockwise, so the fill will apply to the circle''s outside:

    context.arc(70, 70, 50, 0, 2 * Math.PI, true);


    // rect() begins a new subpath:

    context.rect(20, 20, 100, 100);


    context.lineWidth = 2;

    context.strokeStyle = "black";

    context.fillStyle = "lightgray";

    context.fill();

    context.stroke();

    ```


    This is the drawing produced by the above code.


    ![](img/24b7d8c3923a911c6319b3be2ce79910_294_0.png)


    Apart from rect(), there are three more methods for drawing a rectangle defined
    by CanvasRenderingContext2D. The fillRect() and stroke() methods fill and stroke
    the specified rectangle, respectively. While doing so, fillRect() uses'
