  md: '# Computer Science & Engineering


    **Start Programming Using HTML, CSS, and JavaScript** explains how computer programming
    works. Using a dialog format between two students and a professor, the text teaches
    you how the mainstream web languages HTML, CSS, and JavaScript interact and how
    to harness their capabilities in practical settings.


    Each chapter focuses on a specific theme supported by a gradual development of
    engaging worked examples of live web documents and applications using the three
    languages. You can follow most of the examples and experiments using any modern
    browser and plain text editor. A practical homework problem is included at the
    end of every chapter and then is discussed at the beginning of the next chapter.
    In addition, a related keywords list helps you review key topics.


    # Features


    +   * Explains general computer programming and web-related principles

    * Organizes chapters in 13 thematic meetings with explanations and worked examples
    of live web documents and applications using HTML, CSS, and JavaScript

    * Presents fundamental concepts from the latest HTML5, CSS, and ECMAScript5 standards

    * Explores some major directions in which you can continue your studies

    * Provides the examples'' source code as well as additional problems for each
    chapter on the author''s website


    By focusing on important established principles and concrete examples, this introductory
    book shows you how to write cleaner and more easily maintainable code. It augments
    the basic language syntax and rules with contents and structure while keeping
    the material simple and manageable.


