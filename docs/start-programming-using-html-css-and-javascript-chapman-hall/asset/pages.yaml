    console.log(moreOfThe[1](2)); //Writes 8: same as cube(2)

    ```


    The two lines are simple function definitions. In the third line I declared a
    otherSquare, which I assigned a reference to the first of the above functions.
    This makes otherSquare and square references to the same function object, which
    means that the expression otherSquare === square will return true. Because of
    that, writing square(3) or otherSquare(3) invokes one and the same function object.
    A similar situation occurs in the last line of the code, where the expression
    moreOfThe[1] is a reference to the second of the above functions.


