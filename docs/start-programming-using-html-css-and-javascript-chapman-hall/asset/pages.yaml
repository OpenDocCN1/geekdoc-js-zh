    \ red;\n}\n.sudoku-table .candidate {\n  font-size: .7em;\n}\n```\n\nThis completes\
    \ the styling portion of our project and we’re ready for the JavaScript part.\
    \ We are going to add another method to the Sudoku class called start(), whose\
