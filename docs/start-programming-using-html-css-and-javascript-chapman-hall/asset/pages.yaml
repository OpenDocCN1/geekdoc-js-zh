  md: '# Truthy and Falsy Values


    **Professor**: The first line of our last example could also be written shorter,
    without a comparison but with the same result


    ```

    if (x % 2)

    ```


    You see, JavaScript is quite flexible when it comes to data types. If it doesn''t
    like the type, it implicitly converts it so to match the requirement. For example,
    the expression x % 2 doesn''t return either true or false so, technically, we
    cannot use it as a branching condition, which requires a Boolean value. However,
    knowing that JavaScript implicitly converts zero to false and one when it requires
    a Boolean value, we can drop the comparison part of the expression in this particular
    case.


    But zero is not the only value that converts to false when a Boolean value is
    expected. Altogether, there are five such values:


    +   0

    undefined

    null

    NaN

    "" // A string without any character


    These five values work as false, and are, together with the false value itself,
    called falsy values. All the other values are called truthy values. You have to
    be careful, though when leaving explicit comparisons, because results are not
    always identical as the case in our last example. For instance, this is how you
    can test whether x has been given a value:


    ```

    if (x != null) ..

    ```


    In this example, the body of the statement will be executed only if x is not null
    or undefined. In the following example, however, the body will be executed if
    x is not false, or any falsy value, for that matter:


    ```

    if (x) ..

    ```


    It is really important that you know exactly what types of values you expect in
    your program and what you want to achieve. For clarity, it is almost better to
    use explicit comparisons, although they may not be required.


