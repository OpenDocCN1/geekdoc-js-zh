  md: 'Professor: It does, but not a reference to the count () function. Note that
    the expression count() is not a reference but a function invocation because it
    has parentheses at the end. So, in fact, the return value of the count() function
    is assigned to the variable countThis, which is a reference to the inner anonymous
    function.


    In JavaScript, not only a function definition but also a new object. The new function
    object holds the local variables for that specific invocation and is added to
    the scope chain, which represents the scope for that particular function invocation.
    The trick of the count() function is that it defines another function within its
    body and returns a reference to it. As long as you keep a reference to the returned
    anonymous function, the anonymous object persists in memory and so must the count()
    function object because it is a part of the anonymous function''s scope chain.


    We can invoke the count() once more, and again store a reference to the returned
    anonymous function, this to a variable countThat:


    ```

