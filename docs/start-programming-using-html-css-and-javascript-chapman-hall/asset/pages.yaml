  md: "# 13.4 Completing Sudoku Puzzle Helper\n\n**Professor:** I hope you still have\
    \ energy to finish Sudoku, which is our last project in this course. Before doing\
    \ it, let's refresh our memory of what we produced so far. We wrote two objects,\
    \ Cell and Sudoku, and this is the list of things we need to know be able to continue\
    \ the work:\n\n+   - The Sudoku() constructor creates a Sudoku object instance.\n\
    - The setClues() method of the Sudoku object takes as an argument a $9 \\times\
    \ 9$ array of initial clues for the cells. Each cell can be either a numeric value\
    \ between one and nine, or null value if the cell is empty.\n- The setNumber()\
    \ method of the Sudoku object accepts three arguments: a number to be written\
    \ into the puzzle, and the row and column index of the cell into which the number\
    \ is to be written. The method returns false if the same number already exists\
    \ in the same row, column, or $3 \\times 3$ box. Otherwise, it inserts the number\
    \ into the puzzle grid and returns true.\n- The board property of the Sudoku object\
    \ is a $9 \\times 9$ array of references to Cell instances.\n- The getNumber()\
    \ method of the Cell object returns the number that is written in the cell. If\
    \ the cell is empty, then the method returns null.\n- The isWritable() method\
    \ of the Cell object returns true if you can write numbers into the cell, and\
    \ false otherwise.\n\nNow, let's get the job done. We are going to generate the\
    \ HTML part of the puzzle dynamically, of course. Nevertheless, here is static\
    \ HTML code for the puzzle grid to get an impression of how the final document\
    \ should look:\n\n```\n<form>\n<table class=\"sudoku-table\">\n  <tr>\n    <td><input\
    \ type=\"text\"></td>\n    <td><input type=\"text\"></td>\n    <!----\n    -->\n\
    \  </tr>\n  <tr>\n    <td><input type=\"text\"></td>\n    <td><input type=\"text\"\
    ></td>\n    <!----\n    -->\n  </tr>\n  <!----\n    -->\n</table>\n</form>\n```\n\
    \nThe comments containing ellipses hint that parts of the code are omitted. Everything\
    \ in fact repeats verbatim nine times and the whole puzzle is simply a $9 \\times\
    \ 9$ table containing text boxes inside its cells.\n\nThis is the actual HTML\
    \ that we're going to use for our Sudoku:"
