    **Professor**: As I already mentioned in our previous meeting, HTML is used to
    give a document structure rather than a look. So there is one very important question
    to bear in mind when constructing an HTML document: is what I''m trying to do
    in any way affecting the structure of the document or is it merely a matter of
    presentation? Indeed, wrapping a text around a picture has nothing to do with
    structure. A paragraph is a paragraph and a picture is a picture, no matter how
    they are positioned and formatted. You don''t have to worry about whether a paragraph
    is wrapped around a picture when writing an HTML. That''s work for CSS. I''ve
    deliberately presented you with a document that will tempt you to think about
    how it looks, which is completely irrelevant at this point.


