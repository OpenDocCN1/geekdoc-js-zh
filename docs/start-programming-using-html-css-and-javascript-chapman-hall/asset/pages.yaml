  md: 'in your program. On the other hand, if you declare a variable within a function
    body, then you declare a local variable, which has local scope. This is also called
    function scope in JavaScript because a variable is defined only within the function
    body in which it is declared. Note that function parameters act as local variables
    and are thus only accessible within the function body.


    Now, a question: what if there are two variables, one local and the other global,
    using the same name? Both should be accessible within the function body in which
    the local variable is declared. To solve the conflict, there''s an additional
    rule which says that a local variable takes precedence over a global variable
    with the same name. If you then declare a local variable, or a function parameter,
    for matter, choosing the same name as of some global variable, you hide that global
    variable from the code within the function body.

    The next short example illuminates the whole idea:


    ```

    var scope = "global";

    var f1 = function() { var scope = "local"; return scope; };

    var f2 = function() { return scope; };

    ```


    ```

    console.log(scope); //Writes global

    console.log(f1()); // Writes local

    console.log(f2()); //Writes global

    ```


    There are two variables named scope in the example. The first one is declared
    outside of any of the functions and is a global variable. The second is declared
    within the body of the f1() function, which makes it a local variable of that
    function.

    The first call to console.log() takes scope outside of any function and can therefore
    only access the global scope variable. The second call to console.log() writes
    whatever f1() returns, which is the value of its local scope variable.

    f1() has no access to the global scope variable, which is hidden by the local
    variable with the same name. Finally, the third call to console.log() returns
    what f2() returns, which is the value of the global scope variable since this
    is the only variable accessible within the body of f2().


    To help you visualize the situation, there''s a graphical representation of the
    scopes of the two scope variables.


