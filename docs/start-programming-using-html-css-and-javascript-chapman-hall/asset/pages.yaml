    the end, or even in the middle of the document.


    **Maria:** What happens if you include more headings inside a section? Are they
    hidden the same way with the <header> element?


    **Professor:** No. Each subsequent heading within a section implicitly starts
    a new section. If a heading has a lower rank than the one before it, then a new
    section is created, which is subordinate to the enclosing section. If, however,
    a heading has the same or higher rank than the one before it, then a new section
    is created on the same level in the hierarchy as the enclosing section of that
    heading. The enclosing section is closed even though its closing tag has not been
    reached because the newly created section is on the same hierarchical level. Needless
    to say, that can cause some confusion. I suggest that you add some different ranks
    to places in our last example and observe what happens. That, if you don''t get
    lost, you will understand things a little better.


    **Maria:** If a heading itself already starts a new section, why do we not need
    additional explicit section definitions?


    **Professor:** There are numerous reasons for that, many of which may not be quite
    evident at first glance. Consider, for example, that a website uses material from
    other sites, such in the form of a news feed. Such a process is called *web syndication*.
    It can easily happen that an article from another page is pulled under a heading
    with a rank that is lower than that of the included article. Although the page
    will still work fine, the hierarchy will become disturbed, which could make the
    page more difficult for search engines and other software to process. If you use
    HTML5 elements, the hierarchy of the sections is defined by the placing of the
    sectioning regardless of the ranks of headings within them.


