  md: 'The code is or less self-explanatory except maybe for the last line. HTML5
    allows you to attach your own data to elements using so-called custom data attributes,
    which are mapped to properties of the JavaScript named dataset. I used this possibility
    to associate the correct solution of the equation with the text box that will
    later contain an answer provided by the user. This will come handy when we eventually
    compare the answers with the correct solutions.


    Maria: Why do we use dataset? You told us that JavaScript objects were dynamic.
    If I remember correctly, that means you can add any property to an object at any
    time, can''t you?


    Professor: That''s true. And if you try to add a property directly to the above
    text object, you''ll discover that this works in. However, it is basically not
    recommended to add any custom properties or methods to the DOM objects. One of
    the main reasons is that DOM objects are host objects, which are subject to quite
    different implementation rules. So, user-defined properties and methods are not
    guaranteed to work properly with DOM objects and worse, sometimes you won''t even
    notice something went wrong until much later.


    Let''s continue with work. Once we have created all the text boxes, it is convenient
    to place them into a single array, and we can use the getElementsByTagName to
    get the job done. We are going to check this later to see how many correct answers
    the user has submitted.


