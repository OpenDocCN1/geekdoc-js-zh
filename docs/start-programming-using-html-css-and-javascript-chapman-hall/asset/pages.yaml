  md: '# Attributes


    charset


    Specifies the character encoding that is used in the document. The <meta> element
    with this attribute should be inside the <head> element and within the first 512
    bytes of the page, since certain browsers only check these first bytes before
    deciding on a character set to be used. It is advisable that authors use the UTF-8
    encoding.


    content


    This attribute holds the value connected with the name specified by the name attribute.


    name


    This attribute allows authors to set the document metadata expressed in terms
    of name/value pairs. The name attribute gives the name, while the corresponding
    value is given by the same <meta> element. Some of the possible values for the
    name attribute are:


    +   * author: Specifies the summary of the author.

    * description: Contains a short summary of the document. This is one of the more
    important identifiers that help search engines, as well as visitors/users, fathom
    what page is about. Also, a lot of browsers use this data as the default description
    of the page when it is marked.

    * keywords: A comma-separated list of important words describing the content of
    the document. This used to be a crucial identifier for early search engines but
    it is no longer so. Today, the best choice for authors is to avoid using it.


    # Examples


    ```

    <meta charset="utf-8">\n<meta name="description" content="A gang of hyper-intelligent
    pan-dimensional beings request to find out the Answer to the Ultimate Question
    of Life, The Universe, and Everything from the Deep Thought supercomputer exclusively
    designed for this purpose.">

    <meta name="author" content="Douglas Adams">

    ```


