  md: '```

    reverse()

    ```


    Syntax:


    ```

    array.reverse()

    ```


    The reverse() method reverses the order of the array elements, so that the first
    element of the array becomes the last and vice versa. The rearrangement of the
    elements is done in place, i.e., the elements of the array on which the method
    is invoked are reordered without creating a new array. The method returns the
    reference to the reversed array, so that the method chaining is possible.


    Example:


    ```

    var arr = [1, 1, 2, 3, 5, 8];

    arr.reverse(); // arr is now [8, 5, 3, 2, 1, 1]

    ```


    sort()


    Syntax:


    ```

    array.sort()

    arr.sort(compareFunction)

    ```


    The sort() method sorts elements of an array, which is done in place (i.e., no
    copy of the original array is made), and returns the reference to the sorted array
    so that the method chaining is possible. If no additional argument is supplied,
    the array elements are sorted alphabetically (more specifically, in an ascending
    order to the character codes determined by the character encoding).


    Because the array elements are sorted alphabetically, numbers are not arranged
    as you might expect. For example, 2 comes before 42 in a numeric sort, but since
    numbers are converted to strings before sort is applied. "42" comes before "2".


    If you want to use some criteria to sort elements, you can supply a custom comparison
    function (compareFunction). This function takes two arguments and must return
    one of the following values:


    +   * A value less than zero if the first argument should appear before the second
    one in the sorted array.

    * A value greater than zero if the second argument should appear before the first
    one in the sorted array.

    * Zero if both arguments are considered equal in the scope of this sort and their
    order doesn''t matter.


    If there are any undefined elements, they always come at the end of the sorted
    array. This is not possible to change even if you provide your own comparison
    function because undefined values are never passed to the compareFunction function.'
