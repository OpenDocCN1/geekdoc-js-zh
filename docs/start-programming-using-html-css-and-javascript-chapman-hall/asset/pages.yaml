  md: "```\n:visited {\n  color: gray;\n}\n```\n\n**Maria:** Will that work? I remember\
    \ seeing `a:visited` in some code studied.\n\n**Professor:** Both are correct.\
    \ Because :visited is a class name, the same rules apply as with the ordinary\
    \ class names except that you don't use a prefix before a name. Remember that\
    \ you can make a class selector more specific by prepending an element name before\
    \ it. In sense, a:visited explicitly tells that :visited only applies to <a> elements.\
    \ This is not necessary because only links can be visited. So you can just drop\
    \ the a and write simple :visited.\n\nNote that you are only allowed to style\
    \ a very limited set of color-related properties of a visited link. The reason\
    \ for that lies in privacy concerns. People have found out by using JavaScript\
    \ functions, you can traverse the pages and extract the information about the\
    \ links that users have visited. This permits an exhaustive collecting of personal\
    \ data, even about the person's identity. Hence the imposed restrictions on styling\
    \ with this pseudo-class.\n\nSimilarly, you can style an unvisited link using\
    \ the :link pseudo-class. There are two more pseudo-classes that you can use to\
    \ style links, which are the :hover and :active pseudo-classes. Their use is not\
    \ limited to links, however. If you are interested in using them, you'll find\
    \ their descriptions in the reference at the end of the book. Especially interesting\
    \ is the :hover pseudo-class, for it allows you to respond to a mouse pointer\
    \ over an element.\n\nYou should be careful when using link-related pseudo-classes\
    \ they may override each other if they are not applied in the correct order, so-called\
    \ LVHA order, which is short for :link:visited:hover, and :active. For example,\
    \ the :link rule, must always be put before any other link-related rules.\n\n\
    Pseudo-elements work much like pseudo-classes. As an example, let's take the ::first-letter\
    \ pseudo-element, which is used to select the first letter of text of any block\
    \ element. For example, if you want to make the first letter of every paragraph\
    \ bold you write:\n\n```\np::first-letter {\n  font-weight: bold;\n}\n```\n\n\
    If you wish, you can also select the first line with the ::first-line pseudo-element.\n\
    \n**Maria:** If the pseudo-class and pseudo-element selectors are used in the\
    \ same way, what's the difference?\n\n**Professor:** There's a subtle difference\
    \ in their interpretation. A pseudo-element often refers to the content of an\
    \ element that is matched by the selector immediately"
