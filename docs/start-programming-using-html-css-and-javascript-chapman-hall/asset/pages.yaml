  md: 'The first line of this algorithm should find all the empty cells in the grid
    and column indexes place them into a one-dimensional array. Note that you will
    need the row and column indexes of cells to be able to place them into the puzzle
    grid, Cell objects don''t store. To get around this, you can add row and column
    indexes to the Cell class object or simply create an array of indexes storing
    positions of empty cells.


    Note that Check in the above algorithm is a function, and you will notice a curious
    thing: that function calls itself from within the innermost/else statement. A
    function that calls itself is called a recursive function, which offers an elegant
    solution for types of problems like this one. What you have to do is first try
    to place number in the first cell. If that is not possible, then try to number
    it with two, and number three, and so on, until you find a proper number or run
    out of numbers. If you successfully place a number into the grid, then repeat
    the whole story with the next empty cell. If, however, no number can be placed
    into the current cell, then you should go back to the previous empty cell and
    replace its number with a bigger one.


    If you use a recursive function to solve this problem, then lots of bookkeeping
    is done automatically for you. Each time the function is called, a new function
    object is created and appended to the current scope chain. If the function also
    creates local variables representing the index of the cell and the number that
    has been placed recently into that, then there is not much work left for you.
    Whenever no number can be placed in the current cell, the current function stops
    executing, which automatically removes it from the scope chain and the checking
    continues with the previous cell from the exact point where it left it.


