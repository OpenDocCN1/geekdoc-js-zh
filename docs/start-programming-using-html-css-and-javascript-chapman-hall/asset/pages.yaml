  md: '# Common Wombat


    The common wombat (Vombatus ursinus), also called bare-nosed wombat or coarse-haired
    wombat, is one of three living wombat species. The common wombat reaches an average
    of 98 cm in length and a weight of 26 kg. It prevails in colder parts of South
    East Australia. The common wombat was described by George Shaw in 1800.


    ![](img/24b7d8c3923a911c6319b3be2ce79910_32_0.png)


    There exist three subspecies of the common wombat:


    +   - V. ursinus hirsutus on the Australian Mainland.

    - V. ursinus tasmaniensis in Tasmania.

    - V. ursinus ursinus on Flinders Island to the north of Tasmania.


