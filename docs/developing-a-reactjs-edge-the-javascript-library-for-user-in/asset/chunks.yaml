    \ hold *all* your application’s data.\n\n*   No other part of your application\
    \ should know how to interact with the data — stores are the only place in your\
    \ application where data mutation occurs.\n\n*   Stores don’t have setters—all\
    \ updates flow through the dispatcher into the store. Fresh data flows back into\
    \ the application through the store’s change event.\n\nBelow is an example of\
    \ a store registering with the Dispatcher to receive comments for a post.\n\n\
    ```\n Dispatcher.register(function(payload) {\n  switch(payload.actionType) {\n\
        ...\n    case CommentConstants.RECEIVE_COMMENTS:\n      CommentStore.setComments(payload.comments,\
    \ payload.parentPostId);\n      break;\n  }\n});\n```\n\nThe store receives the\
    \ action, performs the work of saving the comments, and when done emits the change\
    \ event.\n\n```\n CommentStore.prototype.setComments = function(comments, parentPostId)\
    \ {\n  // handle saving the results here\n  this.emitChange();\n}\n```\n\nThis\
    \ change event is then handled by your React Views. The new state will flow through\
    \ your React component hierarchy and the components will re-render as needed.\n\
    \n### View-Controller\n\nYour application’s component hierarchy will commonly\
    \ have a high-level component responsible for interacting with stores. Simple\
    \ applications may only have one. More complex applications might have many. \n\
    \nThe process of wiring up a store is straightforward.\n\n1.  When the component\
    \ mounts, add the change listener.\n\n2.  As the store changes, request the new\
    \ data and process accordingly.\n\n3.  When the component unmounts, clean up the\
    \ change listener.\n\n Here is an example of handling store interactions.\n\n\
    ```\n export default\nclass App extends React.Component {\n  handleChange() {\n\
        PostStore.getPosts((posts) => {\n      this.setState({ posts: posts });\n\
        });\n  }\n  componentDidMount() {\n    PostStore.addChangeListener(this.handleChange);\n\
      }\n  componentWillUnmount() {\n    PostStore.removeChangeListener(this.handleChange);\n\
      }\n  ...\n}\n```\n\n## Managing multiple stores\n\nInevitably, applications\
    \ grow to need multiple stores. This becomes tricky when one store depends upon\
    \ another, requiring the second store to complete its actions before the first\
    \ can perform its own actions.\n\nFor example, maybe we create a separate store\
    \ to maintain a survey-results summary, tallying the results of all survey respondents.\
    \ This summary store requires the main store to complete its record action before\
    \ we can safely update the summary store.\n\nThe standard Flux implementation\
    \ from Facebook includes a method named `waitFor`, which will help us instruct\
    \ stores to wait for other stores to finish processing an event before proceeding.\n\
    \n### Registering for dependent actions\n\nSuppose we have two stores concerned\
    \ about a `CREATE_COMMENT` action.\n\n*   The `CommentStore` needs to store the\
    \ comment.\n\n*   The `PostStore` needs to know re-tally the total comments for\
    \ the post.\n\nThis means that `PostStore` is dependent upon the `CommentStore` completing\
    \ the `CREATE_COMMENT` action before it can complete its work.\n\nWhen we register\
    \ the `CommentStore` at the top of our App, we store a reference to the dispatcher\
    \ token.\n\n```\n // Wire up the CommentStore with the action dispatcher\nCommentStore.dispatchToken\
    \ = Dispatcher.register(function(payload) {\n  switch(payload.actionType) {\n\
        ...\n    case CommentConstants.CREATE_COMMENT:\n      CommentStore.saveComment(payload.comment,\
    \ payload.parentPostId);\n      break;\n    ...\n  }\n});\n```\n\nThen we register\
    \ our new `PostStore`, placing the call to `waitFor` before we access the `CommentStore` data.\n\
    \n```\n PostStore.dispatchToken = Dispatcher.register(function(payload) {\n  switch(payload.actionType)\
    \ {\n    case CommentConstants.CREATE_COMMENT:\n      Dispatcher.waitFor(CommentStore.dispatchToken);\n\
          // At this point it's guaranteed the `CommentStore` callback has been run\n\
          // and we can safely access its data to summarize it.\n      var commentCount\
    \ = CommentStore.getCommentsFor(payload.parentPostId);\n      PostStore.setCommentCount(commentCount,\
    \ payload.parentPostId);\n      break;\n    }\n  }\n});\n```\n\n## Reflux\n\n\
    The sample app uses a popular Flux-inspired library called Reflux. Reflux differs\
    \ from Flux in that Stores subscribe directly to Actions. This eliminates the\
    \ need for large switch statements that check an Action’s type. Stores may similarly\
    \ listen to other stores, eliminating the need for the `waitFor` call described\
    \ in the Flux section. Action Creators are eliminated because Reflux Actions are\
    \ simply functions that pass the payload the receive to listeners.\n\nThe sample\
    \ app defines a number of stores in the directory `src/stores`. All of the actions\
    \ for the app are defined in `src/utils/actions.js`.\n\nYou can find learn more\
    \ about Reflux here: [https://github.com/reflux/refluxjs](https://github.com/reflux/refluxjs).\n\
    \n## Redux\n\nInfluenced by ClojureScript’s Om and functional reactive programming,\
    \ Redux is another Flux-inspired library for React applications. Redux is designed\
    \ to help you write applications that are easy to reason about and to provide\
    \ an excellent developer experience.\n\nSimilar to Om, Redux collects the entire\
    \ application’s state into a single object as a large tree of data. Redux is designed\
    \ so that all of your code, including Stores, can be hot-loaded, or updated while\
    \ your app is running. \n\nRedux has a single Store that is updated by Reducers\
    \ that respond to Actions. Redux Reducers are pure functions that return an updated\
    \ piece of the state tree. Reducers are often very similar to the function registered\
    \ with the Dispatcher by a Store. Instead of using getter methods on a Store as\
    \ in Flux, Redux has a concept of Selectors. Selectors are functions that retrieve\
    \ a piece of data from the state tree. Components then use a function called `connect`\
    \ to register for updates from the Store and use Selectors to retrieve the desired\
    \ data. These selected pieces of data are given to the connected component as\
    \ props. Action Creators in Redux are similar to those in Flux but, may be enhanced\
    \ with Middleware.\n\nYou can learn more about Redux here: [http://redux.js.org](http://redux.js.org).\n\
    \n## Relay\n\nRelay is a data-driven framework for React applications created\
    \ by Facebook. Relay makes it possible to specify the data a component needs as\
    \ a GraphQL fragment, or query, within the component itself. When Relay renders\
    \ your React app it builds a large composite query from all of the GraphQL fragments\
    \ on components to be rendered and then makes one request to the server. Co-locating\
    \ the data requirements and the component make keeping up with shifting data requirements\
    \ simple, and batching network requests improves performance. Using Relay requires\
    \ that you have a server that supports responding to GraphQL queries but, for\
    \ applications with complex data requirements or view hierarchies it can be a\
    \ great fit.\n\nYou can learn more about Relay here: [https://facebook.github.io/relay/](https://facebook.github.io/relay/).\n\
    \n## Om and Om Next (ClojureScript)"
