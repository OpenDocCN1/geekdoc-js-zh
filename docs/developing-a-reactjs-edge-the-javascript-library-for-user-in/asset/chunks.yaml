  trans: "\n子节点注释只需用花括号包裹，并且可以跨越多行。\n\n```\n <div>\n  {/* 关于这个输入框的注释\n      跨越多行 */}\n\
      <input name=\"email\" placeholder=\"邮箱地址\" />\n</div>\n```\n\n## 特殊属性\n\n由于\
    \ JSX 会转换为普通的 JavaScript 函数调用，因此有一些关键字你不能使用：`class` 和 `for`。\n\n要创建带有 `for` 属性的表单标签，请使用\
    \ `htmlFor`。\n\n```\n <label htmlFor=\"for-text\" ... >\n```\n\n要渲染自定义的 `class`，请使用\
    \ `className`。如果你习惯了 HTML，这可能会觉得奇怪，但它与原生 JavaScript 更加一致——在原生 JavaScript 中，你可以通过\
    \ `elem.className` 访问元素的类。\n\n```\n <div className={classes} ... >\n```\n\n##\
    \ 样式\n\n最后，我们来探讨内联样式属性。React 将所有样式规范化为驼峰命名，与 DOM 样式的 JavaScript 属性保持一致。\n\n要定义自定义样式属性，只需传入一个\
    \ JavaScript 对象，其中包含驼峰命名的属性名和所需的 CSS 值。\n\n```\n var styles = {\n  borderColor:\
    \ \"#999\",\n  borderThickness: \"1px\"\n};\nReact.renderComponent(<div style={styles}>...</div>,\
    \ node);\n```\n\n# 不使用 JSX 的 React\n\n所有 JSX 标记最终都会转换为纯 JavaScript。因此，使用 React\
    \ 并不*必须*使用 JSX。然而，JSX 隐藏了一些复杂性。如果你打算在不使用 JSX 的情况下使用 React，你需要了解在 React 中创建元素的三个部分：\n\
    \n1.  定义组件类\n2.  创建工厂函数以生成组件类的实例\n3.  使用工厂函数创建 `ReactElement` 实例\n\n## 创建 React\
    \ 元素\n\n回想一下我们之前如何定义 `Divider` 组件类。这里为了明确其用途，已将其重命名为 `DividerClass`。\n\n```\n\
    \ class DividerClass extends React.Component\n  render() {\n    return (\n   \
    \   React.createElement(\"div\", {className: \"divider\"}, \n        React.createElement(\"\
    h2\", null, this.props.children), \n        React.createElement(\"hr\", null)\n\
          )\n    );\n  }\n});\n```\n\n要在不使用 JSX 的情况下使用这个 `DividerClass`，请调用 `React.createElement`\
    \ 或 `React.createFactory`。\n\n要直接创建元素，只需调用 `createElement`。\n\n```\n var divider\
    \ = React.createElement(DividerClass, null, '问题');\n```\n\n要创建工厂函数，首先使用 `createFactory`\
    \ 函数。\n\n```\n var Divider = React.createFactory(DividerClass);\n```\n\n现在你有了一个工厂函数，就可以用它来创建\
    \ `ReactElement` 了。\n\n```\n var divider = Divider(null, '问题');\n```\n\n## 延伸阅读与参考资料\n\
    \n即使你不喜欢在 JavaScript 中嵌入标记的想法，希望你现在也能理解 JSX 如何为 JavaScript 与其渲染的标记之间的紧密关系提供解决方案。JSX\
    \ 日益增长的 popularity 使其拥有了自己的规范，提供了深入的技术定义。如果你仍然不确定或对其工作原理感到困惑，有一些工具可以帮助你进行实验。\n\
    \n### 官方 JSX 规范\n\n2014 年 9 月，Facebook 发布了 [JSX 官方规范](http://facebook.github.io/jsx/)，阐述了创建\
    \ JSX 的理由以及语法的技术细节。\n\n你可以在 [`facebook.github.io/jsx/`](http://facebook.github.io/jsx/)\
    \ 阅读更多内容。\n\n### 浏览器内实验\n\n还有许多用于实验 JSX 的工具。React 文档的 [入门](http://facebook.github.io/react/docs/getting-started.html)\
    \ 页面链接了使用和不使用 JSX 的 JSFiddle 游乐场。\n\n[`facebook.github.io/react/docs/getting-started.html`](http://facebook.github.io/react/docs/getting-started.html)\n\
    \n对于实际项目，官方工具是 babel，它还提供了几乎完整的 ES6 支持。\n\n[`babeljs.io/`](https://babeljs.io/)\n\
    \n在下一章中，我们将探讨 React 中的组件生命周期。\n\n^(1) 摘自 http://facebook.github.io/jsx/\n\n# 第\
    \ 3 章 组件生命周期\n\n在组件的生命周期中，随着其 props 或 state 的变化，其 DOM 表示也可能发生变化。组件是一个状态机；对于给定的输入，它总是返回相同的输出。\n\
    \nReact 提供了生命周期钩子，使组件能够响应不同的时刻——其创建、存在和销毁。我们将按照它们出现的顺序来介绍：首先是实例化，然后是组件的生命周期，最后是组件的销毁。\n\
    \n## 生命周期方法\n\nReact 组件拥有一个极简的生命周期 API，只提供你所需的内容，不会让你感到不知所措。让我们按照它们在组件上被调用的顺序来逐一了解每个方法。\n\
    \n**实例化**\n\n首次创建实例时调用的生命周期方法与后续每个实例略有不同。对于组件类的首次使用，你会看到以下方法按顺序被调用：\n\n*   `constructor`\n\
    *   `componentWillMount`\n*   `render`\n*   `componentDidMount`\n\n**生命周期**\n\n\
    随着应用状态的变化并影响到你的组件，你会看到以下方法按顺序被调用：\n\n*   `componentWillReceiveProps`\n*   `shouldComponentUpdate`\n\
    *   `componentWillUpdate`\n*   `render`\n*   `componentDidUpdate`\n\n**销毁与清理**\n\
    \n最后，当你使用完组件时，会调用 `componentWillUnmount`，让你的实例有机会进行自我清理。\n\n现在，我们将依次介绍这三个阶段：实例化、生命周期和清理。\n\
    \n## 实例化\n\n当每个新组件被创建并首次渲染时，你可以使用一系列方法来设置和准备你的组件。每个方法都有特定的职责，如下所述。\n\n### `constructor(props,\
    \ context)`\n\n构造函数允许你为组件设置实例属性和状态。一个典型的构造函数如下所示：\n\n```\n class Foo extends React.Component\
    \ {\n  constructor(props){\n    super(); // 调用父类构造函数，必需\n    this.state = {x:\
    \ 'y'};\n  }\n  render(){ ... }\n}\n```\n\n### `componentWillMount`\n\n在初始渲染之前立即调用。这是在\
    \ `render` 方法被调用之前影响组件状态的最后机会。这里提及它只是为了完整性；它是 `createClass` 的遗留产物，现在已被构造函数取代。\n\
    \n### `render`\n\n在这里构建代表组件输出的虚拟 DOM。Render 是组件唯一必需的方法，并且有特定的规则。`render` 方法的要求如下：\n\
    \n*   它只能访问 `this.props` 和 `this.state` 中的数据。\n*   它可以返回 `null`、`false` 或任何 React\
    \ 元素。\n*   只能有一个顶级元素（不能返回元素数组）。\n*   它必须是*纯函数*，意味着它不会改变状态或修改 DOM 输出。\n\nrender\
    \ 返回的结果并不是实际的 DOM，而是一个虚拟表示，React 稍后会将其与真实 DOM 进行差异比较，以确定是否需要做出任何更改。\n\n### `componentDidMount`\n\
    \n在渲染成功且实际 DOM 已被渲染后，你可以通过 `act.findDOMNode(this)` 或使用 ref 在 `componentDidMount`\
    \ 内部访问它。\n\n这是你将用来访问原始 DOM 的生命周期钩子。例如，如果你需要测量渲染输出的高度、使用定时器操作它，或运行自定义的 jQuery 插件，这就是你接入的地方。\n\
    \n例如，假设你想在 React 渲染的输入元素上使用 jQuery UI Autocomplete 插件。你可以像这样附加该插件：\n\n"
- fmt: "\n```\n // A list of strings to autocomplete\nvar datasource = [...];\n\n\
    class MyComponent extends React.Component {\n  render() {\n    return (\n    \
    \  <input ... />\n    );\n  }\n  componentDidMount() {\n    $(React.findDOMNode(this)).autocomplete({\n\
    \      sources: datasource\n    });\n  }\n});\n```\n\nNote, the `componentDidMount`\
    \ method is not called when running on the server.\n\n# Lifetime\n\nAt this point\
    \ your component has been rendered to the user and they can interact with it.\
    \ Typically this involves one of the event handlers getting triggered by a click,\
    \ tap or key event. As the user changes the state of a component, or the entire\
    \ application, the new state flows through the component tree and you get a chance\
    \ to act on it.\n\n## componentWillReceiveProps\n\nThe props of a component can\
    \ change at any moment through the parent component. When this happens `componentWillReceiveProps`\
    \ is called and you get the opportunity to change the new props object and update\
    \ the state.\n\nFor example, in the example application, when the user navigates\
    \ between different boards, you can react to the change by fetching the relevant\
    \ data from the server.\n\n```\n componentWillReceiveProps(nextProps) {\n  var\
    \ boardId = nextProps.params.boardId;\n  if(boardId !== this.props.params.boardId)\
    \ {\n    Actions.State.changeBoard({type: 'board', name: boardId});\n  }\n}\n\
    ```\n\nYou can read the full source code of our example application, a survey\
    \ builder, at [http://git.io/vlcpa](http://git.io/vlcpa).\n\n## shouldComponentUpdate\n\
    \nReact is fast. But you can make it even faster using `shouldComponentUpdate`\
    \ to optimize exactly when a component renders.\n\nIf you are certain that the\
    \ new props or state will not require your component or any of its children to\
    \ render, return `false`.\n\n*This method is not called during the initial render\
    \ or after using* `forceUpdate`.\n\nBy returning `false`, you are telling React\
    \ to skip calling `render`, and the before and after hooks: `componentWillUpdate`\
    \ and `componentDidUpdate`.\n\nThis method is not required and for most purposes\
    \ you will not need to use it during development. Premature use of this method\
    \ can lead to subtle bugs, so it’s best to wait until you can properly benchmark\
    \ your bottlenecks before choosing where to optimize.\n\nIf you’re careful to\
    \ treat state as immutable and only read from props and state in your render method\
    \ then feel free to override `shouldComponentUpdate` to compare the old props\
    \ and state to their new replacements.\n\nAnother performance-tuning option is\
    \ the `PureRenderMixin` provided with the React addons. If your component is *pure*,\
    \ meaning it always renders the same DOM for the same props & state, this mixin\
    \ will automatically use `shouldComponentUpdate` to shallowly compare props and\
    \ state, returning `false` if they match. An example of using this will be covered\
    \ later in this book.\n\n## componentWillUpdate\n\nSimilar to `componentWillMount`,\
    \ this method is triggered immediately before rendering when new props or state\
    \ have been received.\n\nNote, you *can’t* update state or props in this method.\
    \ You should rely on `componentWillReceiveProps` for updating state during runtime.\n\
    \n## componentDidUpdate\n\nSimilar to `componentDidMount` this method gives you\
    \ an opportunity to update the rendered DOM.\n\n# Teardown & cleanup\n\nOnce React\
    \ is done with a component it must be unmounted from the DOM and destroyed. You\
    \ are provided with a single hook to respond to this moment, performing any cleanup\
    \ and teardown that is necessary.\n\n## componentWillUnmount\n\nLastly, we have\
    \ the end of a components life as it’s removed from the component heirarchy. This\
    \ method is called just prior to your component being removed and gives you the\
    \ chance to clean up. Any custom work you might have done in `componentDidMount`,\
    \ such as creating timers or adding event listeners, should be undone here. Failure\
    \ to do so results in errors (if you `setState` on an unmounted component) and\
    \ various kinds of leaks (memory, listeners, etc.).\n\n# Anti pattern: Calculated\
    \ values as state\n\nGiven the possibility of creating state from `this.props`\
    \ in the constructor, it’s worth noting an anti-pattern here. You should be very\
    \ concerned with maintaining a single source of truth. React’s design makes duplicating\
    \ the source of truth more obvious, which is one of React’s key strengths.\n\n\
    When considering calculated values derived from props it is considered an anti-pattern\
    \ to store these as state. For example, a component might convert a date to a\
    \ string representation, or transform a string to uppercase before rendering it.\
    \ These are not state, and should simply be calculated at render-time.\n\nYou\
    \ can identify this anti-pattern when it’s impossible to know inside of your render\
    \ function if your state value is out-of-sync with the prop it’s based from.\n\
    \n```\n class Day extends React.Component {\n  constructor(props){\n    super();\n\
    \    // Anti-pattern. Calculated values should not be stored as state.\n    this.state\
    \ = {day: props.date.getDay()};\n  }\n  render(){\n    return (\n       <div>Day:\
    \ {this.state.day}</div>\n    );\n  }\n}\n```\n\nThe correct pattern is to calculate\
    \ the values at render-time. This guarantees the calculated value will never be\
    \ out-of-sync with the props it’s derived from.\n\n```\n class Day extends React.Component\
    \ {\n  render(){\n    return (\n      <div>Day: {this.props.date.getDay()}</div>\n\
        );\n  }\n}\n```\n\n# Summary\n\nReact’s lifecycle methods provide well-designed\
    \ hooks into the life of your components. As state machines, each component is\
    \ designed to output stable, predictable markup throughout its life.\n\nNo component\
    \ lives in isolation. As parent components push props into their children, and\
    \ as those children render their own child components, you must carefully consider\
    \ how your data flows through the application. How much does each child *really*\
    \ need to know about? Who owns the application state? Which components, if any,\
    \ need local state? This is the subject of our next chapter on data flow.\n\n\
