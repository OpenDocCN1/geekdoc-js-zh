    \  submitHandler: function (event) {\n    event.preventDefault();\n    alert(this.refs.radio.state.value);\n\
    \  },\n  render: function () {\n    return <form onSubmit={this.submitHandler}>\n\
    \        <Radio ref=\"radio\" name=\"my_radio\" defaultValue=\"B\">\n        \
    \  <option value=\"A\">First Option</option>\n          <option value=\"B\">Second\
    \ Option</option>\n          <option value=\"C\">Third Option</option>\n     \
    \   </Radio>\n        <button type=\"submit\">Speak</button>\n      </form>;\n\
    \  }\n});\n```\n\nWhen storing the value in the state of your component, you don’t\
    \ need to access the DOMNode to know what the current value is. You can access\
    \ the state directly.\n\n```\n //Controlled\n//http://jsfiddle.net/cwabLksg/\n\
    var MyForm = React.createClass({\n  getInitialState: function () {\n    return\
    \ {my_radio: \"B\"};\n  },\n  handleChange: function (event) {\n    this.setState({\n\
    \      my_radio: event.target.value\n    });\n  },\n  submitHandler: function\
    \ (event) {\n    event.preventDefault();\n    alert(this.state.my_radio);\n  },\n\
    \  render: function () {\n    return <form onSubmit={this.submitHandler}>\n  \
    \      <Radio name=\"my_radio\" \n            value={this.state.my_radio}\n  \
    \          onChange={this.handleChange}>\n          <option value=\"A\">First\
    \ Option</option>\n          <option value=\"B\">Second Option</option>\n    \
    \      <option value=\"C\">Third Option</option>\n        </Radio>\n        <button\
    \ type=\"submit\">Speak</button>\n      </form>;\n  }\n});\n```\n\nAs a Controlled\
    \ component, this operates exactly the same as a select box. The event passed\
    \ to `onChange` is the event from the active `<input/>`, so you can use it to\
    \ read the current value.\n\nAs an exercise, you may want to try and implement\
    \ support for a `valueLink` property so you can use this component with `React.addons.LinkedStateMixin`.\n\
    \n# Focus"
