    \ for `this.state.open` and see it’s used in `renderItems`. If `this.state.open`\
    \ is false, the options aren’t rendered. Each time you `setState` or get new `props`\
    \ from the parent, `render` (and `renderItems`) will run again. Causing changes\
    \ in React is accomplished by impacting `state` or `props` rather than direct\
    \ mutation.\n\n**Never** update state directly via `this.state`. Instead, always\
    \ go through the `this.setState` method.\n\n`State` will always make your component\
    \ more complex, but if you isolate your `state` to certain components, your application\
    \ becomes easier to debug.\n\n# What belongs in state and what belongs in props?\n\
    \nDon’t store computed values or components in `state`, but instead focus on simple\
    \ data that is directly required for the component to function, like our open\
