    # Preface


    # What is React and why should you use it?


    React is a JavaScript library developed internally at Facebook and open sourced
    in 2013 for building interactive user interfaces for the web. It introduces a
    new way to deal with the Browser’s DOM. Gone are the days of manually updating
    the DOM and laboriously keeping track of each piece of state that makes scalability
    and new feature development at best, a risky endeavor. Instead, React deals with
    the DOM in a very novel way. You declaratively define your user interface at any
    point in time. React removes the need to worry about which part of the DOM needs
    to update when data changes, and enables you to essentially re-render your entire
    application at any point in time with minimal DOM changes.


    # How this book helps


    React introduces new and exciting concepts that challenge current practices. This
    book will enable you to navigate all of these concepts and help you understand
    why they are beneficial and can help you build scalable Single Page Applications
    (SPAs).


    React focuses mainly on the “view” part of an application, and thus does not prescribe
    server communication or code organization. In this book we will cover the current
    best practices and complementary tools to help you build a complete application
    with React.


    # What do you need to know prior to reading the book?


    To get the most out of this book you’ll need to be experienced with JavaScript
    and HTML. It’s beneficial if you have experience with writing SPAs (regardless
    of which framework like Backbone.js, AngularJS, or Ember.js), but it is not required.


    # Source code and sample application


    Throughout this book we’ll be referencing bits of our example application: reddit
    clone. You can read the full source code at [http://git.io/vlcpa](http://git.io/vlcpa)
    and view an online demo at [http://git.io/vlCUI](http://git.io/vlCUI)


    # The writing process


    This book was written as a focused virtual book sprint over the course of a month
    or two. This process helps create fresh and current content, whereas conventional
    books often lag behind the coverage of cutting edge trends and technology.


    In the second edition everything has been updated to React 0.14 and a new sample
    application has been created.


    # Authors


    The book is written by a team of experienced and dedicated JavaScript developers:


    ![Richard Feldman](assets/rtfeldman125.png)


    **Richard Feldman** is the lead Front-End Engineer at NoRedInk, an education tech
    company in San Francisco. He is a functional programming enthusiast, a conference
    speaker, and the author of *seamless-immutable*, an open-source library that provides
    immutable data structures that are backward-compatible with normal JavaScript
    objects and arrays. He is @rtfeldman on both Twitter and GitHub.


    * * *


    ![Frankie Bagnardi](assets/fbagnardi125.png)


    **Frankie Bagnardi** is a Senior Front-end Developer creating user experiences
    for various clients. In his free time, he answers questions on StackOverflow (FakeRainBrigand)
    and IRC (GreenJello), and enjoys small projects. You can reach him at [f.bagnardi@gmail.com](mailto:f.bagnardi@gmail.com).


    * * *


    ![Simon Højberg](assets/hojberg125.png)


    **Simon Højberg** is a Senior UI Engineer at Swipely in Providence, RI. He is
    the co-organizer of the Providence JS Meetup group and former JavaScript instructor
    at Startup Institute Boston. He spends his time building functional User Interfaces
    with JavaScript, and hacking on side projects like cssarrowplease.com. Simon tweets
    at [@shojberg](https://twitter.com/shojberg).


    * * *


    ![Jeremiah Hall](assets/HallPic125.jpg)


    **Jeremiah Hall** is a Senior Software Engineer/Architect currently at OpenGov
    Inc. He is also the founder of Aspect Apps, building a journaling application
    that uses React Native and JavaScript for the UI. He can be found on Twitter [@jeremiahrhall](https://twitter.com/jeremiahrhall).


    # Chapter 1. Introduction to React


    # Background


    In the early days of Web development, front-end code bases were small and JavaScript
    was underpowered. Thanks to years of browsers one-upping each other to push the
    envelope on JavaScript performance, today’s web apps can deliver user experiences
    on par with those of native apps. As web apps continue to grow richer and more
    ambitious, scaling JavaScript code bases while maintaining strong performance
    is now a bigger challenge than ever.


    Historically, many JavaScript libraries have prioritized performance or code organization—by
    making it easier to do high-performance DOM operations across browsers, or by
    offering organizational patterns that make code easier to scale. React has soared
    in popularity by making it easy to achieve both performance improvements and code
    scaling at the same time. This potent combination has made it one of the top ten
    most popular libraries across all of GitHub.


    React started as a port of a PHP framework by Facebook called XHP. Being a PHP
    framework, XHP was designed to render your entire page every time a request was
    made. React was born to bring the PHP style workflow of re-rendering the entire
    page to client side applications.


    React is essentially a “state machine,” helping you manage the complexity of state
    changing over time. It achieves this by having a very narrow scope. It is concerned
    with only two things:


    1.  Updating the DOM


    2.  Responding to events


    React has no opinions on AJAX, routing, storage, or how to structure your data.
    It is not a Model-View-Controller framework; if anything, it is the V in MVC.
    This narrow scope gives you the freedom to incorporate React into a wide variety
    of systems. In fact, it has been used to render views in several popular MVC frameworks.


    Rendering the entire page every time some state changes is incredibly slow in
    JavaScript due to the performance penalty of reading and updating the DOM. React
    has a very powerful rendering system that uses a virtual DOM, resulting in React
    only needing to update the DOM and not read from the DOM.


    Like high-performance 3D game engines, React is built around render functions
    that take the state of the world and translate it into a virtual representation
    of the resulting page. Whenever React is informed of a state change, it re-runs
    those functions to determine a new virtual representation of the page, then automatically
    translates that result into the necessary DOM changes to reflect the new presentation.


    At a glance, this sounds like it should be slower than the usual JavaScript approach
    of updating each element on an as-needed basis. Behind the scenes, however, React
    does just that: it has a very efficient algorithm for determining the differences
    between the current virtual page representation and the new one. From those differences
    it makes the minimal set of updates necessary to the DOM.


    What makes this a win for performance is that it minimizes reflows and unnecessary
    DOM mutations, both of which are common culprits for poor performance.

