  trans: "\n```\nclass SaveButton extends React.Component {\n  render() {\n    return\
    \ (\n      <Button \n        onClick={() => this.handleClick()}\n      >\n   \
    \     Save\n      </Button>\n    );\n  }\n  handleClick() {\n    // ...\n  }\n\
    };\n```\n\n这里我们向 `Button` 组件传递了 `onClick` 属性，其值为一个调用 `this.handleClick` 的函数。每当用户点击按钮时，`handleClick`\
    \ 方法就会被调用。\n\n# PropTypes\n\nReact 提供了一种通过组件上定义的配置对象来验证属性的方式。这些配置同时也作为快速参考文档。\n\
    \n```\nclass Post extends React.Component\n  static propTypes = {\n    data: PropTypes.shape({\n\
    \      id: PropTypes.string,\n      url: PropTypes.string,\n      author: PropTypes.string,\n\
    \      title: PropTypes.string,\n      createdAt: PropTypes.number,\n    }).isRequired,\
    \   \n  };\n  // ...\n};\n```\n\n如果组件实例化时 `propTypes` 的要求未满足，则会记录一条 `console.error`。\n\
    \n对于可选属性，只需去掉 `.isRequired` 即可。\n\n你并非必须在应用中使用 `propTypes`，但它们提供了一种描述组件 API 的好方法。\n\
    \n# defaultProps\n\n在组件上提供 `defaultProps` 对象，以提供一组默认属性。这仅应对非必需的属性进行设置。\n\n```\n\
    var Button = React.createClass({\n  static propTypes = {\n    which: PropTypes.oneOf(['primary',\
    \ 'secondary', 'normal'])\n  };\n  static defaultProps = {\n    which: 'normal'\n\
    \  };\n  // ...\n};\n```\n\n# State\n\nReact 中的每个组件都可以拥有状态。状态与 `props` 的不同之处在于它是组件内部的。\n\
    \n状态对于决定元素上的视图状态非常有用。请注意，该组件包含了你需要了解的 React 的大部分内容，所以[×](https://atlas.oreilly.com/crudloff/reactjs-book/editor/master/04.data.flow.html#)不要期望现在就能完全理解。\n\
    \n```\nclass SimpleSelect extends React.Component {\n  static propTypes = {\n\
    \    options: PropTypes.arrayOf(PropTypes.shape({\n      id: PropTypes.any,\n\
    \      name: PropTypes.string,\n    })).isRequired,\n    value: PropTypes.any,\n\
    \    valueText: PropTypes.any,\n    onSelect: PropTypes.func,\n  };\n\n  constructor(){\n\
    \    super();\n    this.state = {open: false,};\n  }\n\n  toggleOpen(){\n    this.setState({open:\
    \ !this.state.open});\n  }\n\n  render(){\n    return (\n      <div>\n       \
    \ <Button onClick={() => this.toggleOpen()}>\n          {this.props.valueText\
    \ || 'Select an option'}\n        </Button>\n        {this.renderItems()}\n  \
    \    </div>\n    );\n  }\n\n  renderItems(){\n    if (!this.state.open) return\
    \ null;\n    return (\n      <ul>\n        {this.props.options.map((item, i) =>\
    \ {\n          return (\n            <li key={i} onClick={() => this.handleSelect(item)}>\n\
    \              {item.name}\n            </li>\n                 );\n        })}\n\
    \      </ul>\n         );\n\n  }\n\n  handleSelect(item){\n    this.props.onSelect(item);\n\
    \    this.setState({open: false});\n  }\n};\n```\n\n在上面的例子中，`state` 用于跟踪是否显示下拉选项。\n\
    \n我们在构造函数中将初始状态中的 open 设置为 false。当下拉按钮被点击时，切换 open 状态（`toggleOpen`）。当某个选项被点击时，将\
    \ open 状态设置为 false（`handleSelect`）。\n\n我们可以快速浏览代码中的 `this.state.open`，并看到它在 `renderItems`\
    \ 中被使用。如果 `this.state.open` 为 false，则选项不会被渲染。每次你调用 `setState` 或从父组件获取新的 `props`\
    \ 时，`render`（以及 `renderItems`）都会重新运行。在 React 中引起变化是通过影响 `state` 或 `props` 来实现的，而不是直接修改。\n\
    \n**永远不要**通过 `this.state` 直接更新状态。相反，始终使用 `this.setState` 方法。\n\n`State` 总是会让你的组件变得更复杂，但如果你将\
    \ `state` 隔离到特定组件中，你的应用会更容易调试。\n\n# 什么应该放在 state 中，什么应该放在 props 中？\n\n不要将计算后的值或组件存储在\
    \ `state` 中，而应专注于组件运行直接需要的简单数据，比如我们下拉菜单的 open 状态。没有它你就无法打开或关闭下拉菜单。这也可以是输入字段的值、用户的鼠标位置或\
    \ AJAX 请求的结果。\n\n尽量不要将 prop 数据复制到 `state` 中。尽可能将 `props` 视为唯一数据源。\n\n# 无状态函数式组件\n\
    \n你可以采用这种单一数据源的思想来简化你的组件。函数式组件（在 React 0.14 中引入）不是通过包含多个方法的类来定义，而是作为一个单一的函数。该函数接受\
    \ `props` 作为参数并返回所需的元素，很像传统组件中独立的 `render` 函数。\n\n下面是我们 Day 组件作为函数式组件的样子：\n\n\
    ```\nfunction Day(props) {\n  return (\n    <div>Day: {props.day}</div>\n  );\n\
    }\n```\n\n这种风格在几个方面与传统组件不同。它显然更简洁，但这很大程度上是因为传统组件的几个特性不再可用。具体来说，函数式组件不支持以下特性：\n\
    \n*   `state`（参见前面的章节）\n\n*   生命周期方法（参见第 3 章）\n\n*   `refs` 或 `findDOMNode`（参见第\
    \ 8 章）\n\n然而，函数式组件不仅仅是函数。它们仍然支持 `propTypes` 和 `defaultProps`，这些与函数的 `props` 参数一起使用。\n\
    \n鉴于这些特性，函数式组件最适合作为仅定义了 `render` 方法（以及可选的 `propTypes` 和 `defaultProps`）的组件的直接替代品。由于典型的\
    \ React 用户界面主要由符合这种描述的组件组成，以这种风格编写更多组件可以使代码库更简洁，同时不牺牲清晰度。\n\n# 总结\n\n在本章中，你学习了以下概念：\n\
    \n1.  使用 `props` 通过组件树传递数据和设置。\n\n2.  永远不要在组件内部修改 `this.props`；将 `props` 视为不可变的。\n\
    \n3.  使用 `props` 作为事件处理程序与子组件通信。\n\n4.  使用 `state` 存储简单的视图状态，如下拉选项是否可见。\n\n5.\
    \  永远不要直接修改 `this.state`，而是使用 `this.setState`。\n\n6.  当不需要本地 `state`、`refs` 或生命周期方法时，将组件表示为函数式组件可以减少冗长和复杂性。\n\
    \n我们在本章中简要介绍了事件处理，你将在下一章中更详细地学习它。\n\n# 第 5 章 事件处理\n\n对于用户界面而言，呈现只是等式的一半。另一半是响应用户输入，在\
    \ JavaScript 中这意味着处理用户生成的事件。\n\nReact 处理事件的方法是将事件处理程序附加到组件，然后在处理程序触发时更新这些组件的内部状态。更新组件的内部状态会导致它重新渲染，因此用户界面要反映事件的结果，只需在组件的\
    \ `render` 函数中读取内部状态即可。\n\n尽管通常仅根据事件类型来更新 `state`，但有时需要使用事件中的额外信息来确定如何更新 `state`。在这种情况下，传递给处理程序的事件对象将提供关于事件的额外信息，处理程序可以利用这些信息来更新内部状态。\n\
    \n结合这些技术以及 React 的高效渲染，响应输入并根据这些输入的结果更新用户界面变得很容易。\n\n# 附加事件处理程序\n\n"
- fmt: "\nAt a basic level, React handles the same events you see in regular JavaScript:\
    \ `MouseEvents` for click handlers, `Change` events when form elements change,\
    \ and so on. The events have the same names you would see in regular JavaScript,\
    \ and will trigger under the same circumstances.\n\nReact’s syntax for attaching\
    \ event handlers closely resembles HTML’s syntax. For example, in our example\
    \ application, the following code attaches an `onClick` handler to the Save button.\n\
    \n```\n <button className=\"btn btn-save\" onClick={this.handleSaveClicked}>Save</button>\n\
    ```\n\nWhen the user clicks the button, the button’s `handleSaveClicked` method\
    \ will run. That method will contain the logic necessary to resolve the Save action.\n\
    \nYou can read the full source code of our example application, a reddit clone,\
    \ at [http://git.io/vlcpa](http://git.io/vlcpa).\n\nNote that although this code\
    \ resembles the widely-discouraged practice of specifying event handlers in HTML\
    \ using attributes such as `onclick`, it does not actually use the HTML `onclick`\
    \ attribute under the hood. React uses this syntax only as a way to specify the\
    \ handler, and internally takes care of efficiently managing event listeners as\
    \ appropriate.\n\nIf you are not using JSX, you instead specify the handler as\
    \ one of the fields in the options object. For example:\n\n```\n React.DOM.button({className:\
    \ \"btn btn-save\", onClick: this.handleSaveClicked}, \"Save\");\n```\n\nReact\
    \ has first-class support for handling a wide variety of event types, which it\
    \ lists in the [Event System](http://facebook.github.io/react/docs/events.html)\
    \ page of its documentation.\n\n# Events and state\n\nSuppose you have a markdown\
    \ editor and you would like to display a live preview of the markdown.\n\nIn React\
    \ this is done by listening to changes and updating state with the latest value.\n\
    \n```\n class CommentEditor extends React.Component {\n  constructor(){\n    super();\n\
    \    this.state = {text: ''};\n  }\n  render(){\n    return (\n      <div>\n \
    \       <input \n          value={this.state.text}\n          onChange={(e) =>\
    \ this.setState({text: e.target.value})}\n        />\n      </div>\n    );\n \
    \ }\n}\n```\n\n## Rendering based on state\n\nThis is a basic two-way binding\
    \ implementation. Because our data’s in state we can render the markdown preview\
    \ easily.\n\n```\n render(){\n    return (\n      <div>\n        <input \n   \
    \       value={this.state.text}\n          onChange={(e) => this.setState({text:\
    \ e.target.value})}\n        />\n        <Markdown content={this.state.text} />\n\
    \      </div>\n    );\n  }\n```\n\nAs with `this.props`, the render function can\
    \ change as little or as much as you like depending on the values of `this.state`.\
    \ It can render the same elements, but with slightly different attributes, or\
    \ a completely different set of elements altogether. Either way works just as\
    \ well.\n\n## Updating state\n\nSince updating a component’s internal `state`\
    \ causes the component to re-render, the markdown preview is always up to date.\
    \ When we call `setState`, `render` will run again, but it will read from the\
    \ current value of `this.state`. The Markdown component will also update, and\
    \ the new content will be flushed to the DOM.\n\nThere are two ways to update\
    \ a component’s state: the component’s `setState` method, and its `replaceState`\
    \ method. `replaceState` overwrites the entire state object with an entirely new\
    \ state object, which is useful if you are using an immutable data structure to\
    \ hold your state, but which is otherwise rarely what you want. Much more often\
    \ you will want to use `setState`, which simply merges the object you give it\
    \ into the existing state object.\n\nFor example, suppose you have the following\
    \ for your current state:\n\n```\n {\n  title: \"My Title\",\n  text: \"Hello\"\
    ,\n}\n```\n\nIn this case, calling `this.setState({title: \"Other Title\"})` only\
    \ affects the value of `this.state.title`, leaving `this.state.text` unaffected.\n\
    \nCalling `this.replaceState({title: \"Other Title\"})` will instead replace the\
    \ entire state object with the new object `{title: \"Fantastic Survey 2.0\"}`,\
    \ erasing `this.state.text` altogether. This will likely break the render function,\
    \ which would expect `this.state.text` to be a string instead of `undefined`.\n\
    \nIt’s important never to alter the `state` object by any other means than calling\
    \ `setState` or `replaceState`. Doing something like `this.state.saveInProgress\
    \ = true` is generally a bad idea, as it will not inform React that it might need\
    \ to re-render, and it might lead to surprising results the next time you call\
    \ `setState`.\n\n## State isn’t updating!\n\nIt’s also worth noting that `setState`\
    \ is async. So if your state is `{x: 1}` and you run this code, the console will\
    \ show 1.\n\n```\n this.setState({x: 2})\nconsole.log(this.state.x);\n```\n\n\
    If you need to do something after state has been updated, render has been called,\
    \ and changes have been flushed to the DOM, you can pass a callback as `setState`’s\
    \ second argument.\n\n```\n this.setState({x: 2}, () => {\n  console.log(this.state.x);\
    \ // 2\n})\n```\n\nThis also means that multiple state updates in a single tick\
    \ can cause issues.\n\n```\n this.state.xs // []\nthis.setState({xs: this.state.xs.concat([1])}\n\
    this.setState({xs: this.state.xs.concat([2])}\n```\n\nEventually the state will\
    \ be `[2]` instead of the desired `[1, 2]`.\n\nYou can avoid this problem by using\
    \ the atomic `setState` variant. Normally you’d use an expression arrow function,\
    \ but let’s write it verbosely for clarity.\n\n```\n this.state.xs // []\nthis.setState((state)\
    \ => {\n  var xs = state.xs.concat([1]);\n  return {xs: xs};\n});\nthis.setState((state)\
    \ => {\n  var xs = state.xs.concat([2]);\n  return {xs: xs};\n});\n```\n\nNote,\
    \ you want to use the `state` argument rather than `this.state`. React queues\
    \ these functions and calls each with the updated state of the previous. Often\
    \ you know two updates won’t occur in a single tick, or you may not care about\
    \ the first one being hidden, so this feature is rarely used in practice.\n\n\
    # Event objects\n\nMany handlers simply need to fire in order to serve their purposes,\
    \ but sometimes you need more information about the user’s input.\n\nTake a look\
    \ at the `CommentEditor` class from the example application.\n\n```\n onChange={(e)\
    \ => {\n  this.props.onChange({text: e.target.value, type: 'comment'})\n}}\n```\n\
    \nReact’s event handler functions are always passed an event object, much in the\
    \ same way that a vanilla JavaScript event listener would be. Here, the event\
    \ handler takes an event object, from which it extracts the current value of the\
    \ input by accessing `event.target.value`. Using `event.target.value` in an event\
    \ handler like this is a common way to get the value from a form input, especially\
    \ in an `onChange` handler.\n\nRather than passing the original Event object from\
    \ the browser directly to the handler, React wraps the original event in a `SyntheticEvent`\
    \ instance. A `SyntheticEvent` is designed to look and function the same way as\
    \ the original event the browser created, except with certain cross-browser inconsistencies\
    \ smoothed over. You should be able to use the `SyntheticEvent` the same way you\
    \ would a normal event, but in case you need the original event that the browser\
    \ sent, you can access it via the `SyntheticEvent`’s `nativeEvent` field.\n\n\
    # Summary\n\nThe steps to reflect changes from user input in the user interface\
    \ are simple:\n\n1.  Attach an event handler to a React component.\n\n2.  In that\
    \ event handler, update the component’s internal state. Updating the component’s\
    \ state will cause it to re-render.\n\n3.  Modify the component’s `render` function\
    \ to incorporate `this.state` as appropriate.\n\nSo far you have used a single\
    \ component to respond to user interactions. Next you will learn how to compose\
    \ multiple components together, to create an interface that is more than the sum\
    \ of its parts.\n\n# Chapter 6. Composing components\n"
