  trans: "\n大多数情况下，React 的虚拟 DOM 足以创建你想要的用户体验，而无需直接操作底层的实际 DOM。通过组合组件，你可以将复杂的交互编织成一个连贯的整体呈现给用户。\n\
    \n然而，在某些情况下，你无法避免操作底层 DOM 来完成所需功能。最常见的场景是：你需要集成一个不使用 React 的第三方库，或者需要执行 React\
    \ 本身不支持的操作。\n\n为此，React 提供了一套系统，用于操作由 React 管理的 DOM 节点。这些节点仅在组件生命周期的特定阶段可访问，但使用它们能赋予你处理这些场景所需的能力。\n\
    \n# 访问受管理的 DOM 节点\n\n要访问由 React 管理的 DOM 节点，你首先需要能够访问负责管理这些节点的组件。向子组件添加 `ref` 属性即可实现这一点。\n\
    \n```\n class DoodleArea extends React.Component\n  render() {\n    return <canvas\
    \ ref=\"mainCanvas\" />;\n  }\n}\n```\n\n这将使底层的 `<canvas>` DOM 节点可以通过 `this.refs.mainCanvas`\
    \ 访问。可以想象，你给子组件的 `ref` 必须在所有子组件中唯一；给另一个子组件也设置 `ref` 为 `mainCanvas` 是行不通的。\n\n\
    注意，你不能在 `render` 方法中可靠地直接访问 `<canvas>` 节点，因为底层的 DOM 节点可能尚未更新（甚至尚未创建！），直到 `render`\
    \ 完成并且 React 执行其更新。\n\n在组件挂载后，你可以可靠地访问 `<canvas>`，此时 `componentDidMount` 处理函数会运行。\n\
    \n```\n var DoodleArea = React.createClass({\n  render: function() {\n    // 我们在\
    \ render() 内部尚未挂载，所以这不会顺利！\n    doSomethingWith(this.refs.mainCanvas);\n\n   \
    \ return <canvas ref=\"mainCanvas\" />\n  },\n\n  componentDidMount: function()\
    \ {\n    doSomethingWith(this.refs.mainCanvas);\n    // 这会正常工作！我们现在可以访问 HTML5\
    \ Canvas 节点，\n    // 并可以按需调用其绘制方法。\n  }\n});\n```\n\n请注意，`componentDidMount` 并不是唯一可以使用\
    \ `refs` 的地方。事件处理函数也会在组件挂载后触发，因此你可以像在 `componentDidMount` 处理函数中一样轻松地在事件处理函数中使用它。\n\
    \n```\n var RichText = React.createClass({\n  render: function() {\n    return\
    \ <div ref=\"editableDiv\" contentEditable=\"true\" onKeyDown={this.handleKeyDown}>\n\
      },\n\n  handleKeyDown: function() {\n    var editor = this.refs.editableDiv;\n\
    \    var html = editor.innerHTML;\n\n    // 现在我们可以持久化用户输入的 HTML 内容。\n  }\n});\n\
    ```\n\n上面的示例创建了一个启用了 `contentEditable` 的 `div`，允许用户在其中输入富文本。\n\n尽管 React 本身不提供访问组件原始\
    \ HTML 内容的方式，但 `keyDown` 处理函数可以访问该 div 的底层 DOM 节点，进而访问原始 HTML。由此，你可以保存用户已输入内容的副本、计算要显示的字数等。\n\
    \n# 通过组件查找 DOM 节点\n\n虽然 refs 是访问底层 DOM 节点的首选方式，但有时你可能希望编写一些 DOM 修改逻辑，使其适用于任何组件而无需关心其\
    \ refs，或者你可能需要查找某个导入的第三方组件（该组件未设置任何 refs）的底层 DOM 节点。\n\n在这种情况下，`ReactDOM.findDOMNode`\
    \ 就是答案。\n\n```\n var RichText = React.createClass({\n  render: function() {\n\
        return <div contentEditable=\"true\" onKeyDown={this.handleKeyDown}>\n  },\n\
    \n  handleKeyDown: function() {\n    // 注意：这里最好使用 ref 而不是 findDOMNode。\n    var\
    \ editor = ReactDOM.findDOMNode(this);\n    var html = editor.innerHTML;\n\n \
    \   // 现在我们可以持久化用户输入的 HTML 内容。\n  }\n});\n```\n\n请注意，上述做法并非首选方式。更好的做法是像上一节那样使用\
    \ ref，因为如果 `render` 函数被修改而引入了包装元素之类的结构，使用 ref 的逻辑不会中断。`findDOMNode` 只应在 ref 无法工作或引入\
    \ ref 过于繁琐时使用。\n\n请记住，尽管 `refs` 和 `findDOMNode` 功能强大，但只有在没有其他方法实现所需功能时才应使用它们。使用它们会妨碍\
    \ React 优化性能的能力，并增加应用程序的复杂性，因此只有在传统技术无法满足需求时才应使用它们。\n\n# 集成非 React 库\n\n有许多有用的\
    \ JavaScript 库并非为 React 而构建。有些库不需要 DOM 访问（例如日期和时间操作库），但对于那些需要 DOM 访问的库，保持它们的状态与\
    \ React 同步对于成功集成至关重要。\n\n假设你想使用一个自动补全库，它包含以下示例代码：\n\n```\n autocomplete({\n  target:\
    \ document.getElementById(\"cities\"),\n  data: [\n    \"San Francisco\",\n   \
    \ \"St. Louis\",\n    \"Amsterdam\",\n    \"Los Angeles\"\n  ], \n  events: {\n\
        select: function(city) {\n      alert(\"You have selected the city of \" +\
    \ city);\n    }\n  }\n});\n```\n\n这个 `autocomplete` 函数需要一个目标 DOM 节点、一个用作数据的字符串列表以及一些事件处理函数。为了同时利用\
    \ React 和这个库的优势，你可以先构建一个提供这些内容的 React 组件。\n\n```\n class AutocompleteCities extends\
    \ React.Component {\n  render() {\n    return <div ref=\"autocompleteTarget\"\
    \ />\n  }\n\n  static defaultProps = {\n    data: [\n      \"San Francisco\",\n\
    \      \"St. Louis\",\n      \"Amsterdam\",\n      \"Los Angeles\"\n    ]\n  };\n\
    \n  handleSelect: function(city) {\n    alert(\"You have selected the city of\
    \ \" + city);\n  }\n});\n```\n\n为了将这个库封装到 React 中，添加一个 `componentDidMount` 处理函数，通过\
    \ `autocompleteTarget` 子组件的底层 DOM 节点将两个实现连接起来。\n\n```\n class AutocompleteCities\
    \ extends React.Component {\n  render() {\n    return <div id=\"cities\" ref=\"\
    autocompleteTarget\" />\n  }\n\n  static defaultProps = {...};\n\n  handleSelect(city)\
    \ {\n    alert(\"You have selected the city of \" + city);\n  }\n\n  componentDidMount()\
    \ {\n    autocomplete({\n      target: this.refs.autocompleteTarget,\n      data:\
    \ this.props.data,\n      events: {\n        select: this.handleSelect\n     \
    \ }\n    });\n  }\n};\n```\n\n请注意，`componentDidMount` 在每个 DOM 节点上只会被调用一次。因此，你无需担心在同一节点上两次调用\
    \ `autocomplete`（在此示例中）会产生任何不良影响。\n\n话虽如此，请记住该组件可能会被移除，并在之后重新渲染到不同的 DOM 节点。如果你的\
    \ `componentDidMount` 具有在 DOM 节点移除后仍然存在的副作用，这可能会导致内存泄漏或其他问题。如果这是一个问题，请确保指定一个 `componentWillUnmount`\
    \ 处理函数，以便在 DOM 节点即将消失时让组件自行清理。\n\n# 越界的插件\n\n在我们的自动补全示例中，我们假设 `autocomplete` 是一个行为良好的插件，只修改其子元素。实际上，情况往往并非如此。\n\
    \n为了处理这些插件，你需要将它们对 React 隐藏，以避免因 DOM 被意外修改而引发错误。你可能还需要进行额外的清理。\n\n在这个示例中，我们处理的是一个虚构的\
    \ jQuery 插件，它会触发自定义事件并修改它所附加的元素。如果你遇到一个非常糟糕的插件，它修改了父元素，那么你无能为力，并且它与 React 不兼容。最好的做法是寻找另一个插件或修改其源代码。\n"
- fmt: "\nThe way to protect React from this overreaching plugin is to manage its\
    \ DOM node completely by yourself. React thinks the component renders a single\
    \ `div` with no children or props.\n\n```\n class SuperSelect extends React.Component\
    \ {\n  render: function(){ \n    return <div ref=\"holder\"/>;\n  } \n};\n```\n\
    \nLet’s do the dirty work of setting things up in `componentDidMount`.\n\n```\n\
    \ class SuperSelect extends React.Component {\n  render(){\n    return <div ref=\"\
    holder\" />;\n  }\n\n  componentDidMount(){ \n    var el = document.createElement('div');\n\
    \    this.refs.holder.appendChild(el);\n    $(el).superSelect(this.props);\n \
    \   $(el).on('superSelect', this.handleSuperSelectChange);   \n  }\n\n  handleSuperSelectChange()\
    \ {\n    // Put handler logic in here as appropriate...\n  }\n};\n```\n\nNow you\
    \ have a `div` inside the component’s rendered div that you are managing. This\
    \ means that you need to be responsible and clean up.\n\n```\n componentWillUnmount(){\n\
    \    // remove superSelect's listeners and our own\n    $(this.refs.holder).children().off();\n\
    \n    // remove the node from the DOM\n    $(this.refs.holder).empty()\n  }\n\
    ```\n\nIn addition to the clean up, check the plugin’s docs for any additional\
    \ requirements to clean up the node. It may set global event listeners, timers,\
    \ or start AJAX requests, which need to be terminated.\n\nThere is one more step\
    \ in this process. You need to handle updates. This can happen in one of two ways:\
    \ simulating an unmount and remount, or using the plugin’s update API. The former\
    \ is more reliable, and the latter is more performant and clean.\n\nThis is the\
    \ unmount/remount solution.\n\n```\n componentDidUpdate(){\n    this.componentWillUnmount();\n\
    \    this.componentDidMount();\n  }\n```\n\nAnd this is a hypothetical alternative.\n\
    \n```\n componentWillReceiveProps(nextProps){\n    $(this.refs.holder).children().superSelect('update',\
    \ nextProps);\n  }\n};\n```\n\nWrapping other libraries and plugins ranges in\
    \ difficulty depending upon how many variables there are. Sometimes it’s a simple\
    \ jQuery plugin, and sometimes it’s a rich text editor with its own plugins. For\
    \ some of the simpler plugins, the best answer is to rewrite it as a React component\
    \ in the same time it’d take to wrap it, and for others that is completely unfeasible.\n\
    \n# Summary\n\nWhen using the virtual DOM alone is not sufficient, the `ref` attribute\
    \ allows you to access specific elements and modify their underlying DOM nodes\
    \ using `findDOMNode` once `componentDidMount` has run.\n\nThis allows you to\
    \ make use of functionality that React does not natively support, or to incorporate\
    \ third-party libraries that were not designed to interoperate with React.\n\n\
    Next, it’s time to look at how to create and manage forms using React.\n\n# Chapter\
    \ 9. Forms\n\nForms are an essential part of any application that requires even\
    \ modest input from users. Traditionally, in Single Page Applications, forms are\
    \ hard to get “right,” since they are littered with changing state from the user.\
    \ Managing this state is complex and often buggy. React helps you manage state\
    \ in your applications, and this also extends to your forms.\n\nBy now you will\
    \ have realized that predictability and testability are central aspects of React\
    \ components. Given the same props and state, any React component should render\
    \ exactly the same every time. Forms are no exception.\n\nThere are two types\
    \ of form components in React: *Controlled* and *Uncontrolled*. In this chapter\
    \ you will learn what the differences between Controlled and Uncontrolled are,\
    \ and under what circumstances you will want one over the other.\n\nThis chapter\
    \ also covers:\n\n*   How to use form events with React.\n*   Controlling data\
    \ input with Controlled form components.\n*   How React changes the interface\
    \ of some form components.\n*   The importance of naming your form components\
    \ in React.\n*   Dealing with multiple Controlled form components.\n*   Creating\
    \ custom reusable form components.\n*   Using AutoFocus with React.\n*   Tips\
    \ for building usable applications.\n\nIn the last chapter you learned how to\
    \ access the DOM of your React components. React helps you move the state out\
    \ of the DOM into your components. Even with this help, you will still need to\
    \ access the DOM for some complex form components.\n\nYou can read the full source\
    \ code of our example application, at [http://git.io/vlcpa](http://git.io/vlcpa).\n\
    \n## Uncontrolled components\n\nIn most non-trivial forms, you will *not* want\
    \ to use Uncontrolled components. They are however very useful to help understand\
    \ Controlled components. Uncontrolled are an anti-pattern for how most other components\
    \ are constructed in React.\n\nIn HTML, forms work differently to React components.\
    \ When an HTML `<input/>` is given a value, the `<input/>` can then mutate the\
    \ value of the `<input/>`. This is where the name comes from, since the form component’s\
    \ value is Uncontrolled by your React component.\n\nIn React, this behavior is\
    \ like setting the `defaultValue` of the `<input/>`.\n\nTo set the default value\
    \ of an `<input/>` in React you use the `defaultValue` property.\n\n```\n //http://jsfiddle.net/pmsy5y2u/\n\
    class MyForm extends React.Component {\n  render() {\n    return (\n      <input\n\
    \        type=\"text\"\n        defaultValue=\"Hello World!\"\n      />\n    )\n\
    \  }\n};\n```\n\nThe example above is referred to as an Uncontrolled component.\
    \ The `value` is not being set by the parent component, allowing the `<input/>`\
    \ to control its own value.\n\nAn Uncontrolled component is not very useful unless\
    \ you can access the value. In order to access the value, you need to add a `ref`\
    \ to your `<input/>` then access the DOM node’s `value`.\n\nAs you saw in Chapter\
    \ 8, `ref` is a special non DOM attribute used to identify a component from within\
    \ `this` context. All refs in a component are added to `this.refs` for easy access.\n\
    \nLet’s also add the `<input/>` to a form and read the value on `submit`.\n\n\
    ```\n //http://jsfiddle.net/opfktus4/\nclass MyForm extends React.Component {\n\
    \  submitHandler(event) {\n    event.preventDefault();\n    //access the input\
    \ by it's ref\n    var helloTo = this.refs.helloTo.value;\n    alert(helloTo);\n\
    \  }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <input \n          ref=\"helloTo\" \n          type=\"text\" \n     \
    \     defaultValue=\"Hello World!\" />\n        <br />\n        <button type=\"\
    submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\nUncontrolled components\
    \ are rarely good to use. They don’t allow you to render based on the current\
    \ value of inputs, and your code is written in a DOM-centric way rather than in\
    \ a data-centric way. They also make composition more difficult because there’s\
    \ no standard way to get the value of an input in a composite component.\n\n##\
    \ Controlled components\n\nControlled components follow the same pattern for other\
    \ React components. The state of the form component is Controlled by your React\
    \ component, with its value being stored in your React component’s state.\n\n\
    If you want more control over your form components, you will want to use a Controlled\
    \ component.\n\nA Controlled component is where the parent component sets the\
    \ value of the input.\n\nLet’s convert the example above to use a Controlled component.\n\
    \n```\n //http://jsfiddle.net/1a8xr2z6/\nclass MyForm extends React.Component\
    \ {\n  constructor() {\n    super();\n    this.state = {\n      helloTo: \"Hello\
    \ World!\"\n    };\n  }\n  handleChange(value) {\n    this.setState({\n      helloTo:\
    \ value\n    });\n  }\n  submitHandler(event) {\n    event.preventDefault();\n\
    \    alert(this.state.helloTo);\n  }\n  render() {\n    return (\n      <form\
    \ onSubmit={(e) => this.submitHandler(e)}>\n        <input \n          type=\"\
    text\"\n          value={this.state.helloTo}\n          onChange={(e) => this.handleChange(e.target.value)}\
    \ />\n        <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n\
        );\n  }\n};\n```\n\nThe major change here is that the value of the `<input/>`\
    \ is now being stored in the state of the parent component. As a result, the data\
    \ flow is now clearly defined.\n"
