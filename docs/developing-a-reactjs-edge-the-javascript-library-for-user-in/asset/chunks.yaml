    \ `className`. This might seem odd if you’re used to HTML, but it is more consistent\
    \ with vanilla JavaScript, where you can access the class of an element using\
    \ `elem.className`.\n\n```\n <div className={classes} ... >\n```\n\n## Styles\n\
    \nLastly, let’s examine the inline style attribute. React normalizes all styles\
    \ to camelCased names, consistent with the DOM style JavaScript property.\n\n\
    To define a custom style attribute, simply pass a JavaScript object with camelCase\
