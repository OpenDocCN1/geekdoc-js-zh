    \ from traditional components in several ways. It is clearly more concise, but\
    \ that is largely because several of a traditional component’s features are no\
    \ longer available. Specifically, functional components do not support the following\
    \ features:\n\n*   `state` (see previous sections)\n\n*   lifecycle methods (see\
