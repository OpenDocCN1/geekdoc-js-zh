    \ translateY(0);\n  opacity: 0;\n  transition: opacity 1.2s, transform 1s cubic-bezier(.52,-0.25,.52,.95);\n\
    }\n\n.EditingPaneTransition-leave-active {\n  opacity: 0;\n  transform: translateY(-100%);\n\
    }\n```\n\n## The transition lifecycle\n\nThe difference between `EditingPaneTransition-enter` and `EditingPaneTransition-enter-active` is\
