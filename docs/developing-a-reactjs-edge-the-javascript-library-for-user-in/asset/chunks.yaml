            React.createElement(\"hr\", null)\n      )\n    );\n  }\n});\n```\n\n\
    To use this `DividerClass` without JSX, call `React.createElement`  or `React.createFactory`.\n\
    \nTo create the element directly simply call `createElement`.\n\n```\n var divider\
