  raw: "```\n var initial_board = {\n    a1:null, a2:null, a3:null, a4:null,\n   \
    \ b1:null, b2:null, b3:null, b4:null,\n    c1:null, c2:null, c3:null, c4:null,\n\
    \    d1:null, d2:null, d3:null, d4:null\n};\n```\n\nThe data structure of the\
    \ board is an object where the `keys` directly relate to a visual grid position\
    \ defined in CSS. Following the initial data structure, you will see a series\
    \ of functions that operate on this given data structure. All of these functions\
    \ operate in an immutable way, thus returning a new board and not mutating the\
    \ input. This gives the game logic some leverage, since it will be able to compare\
    \ boards before and after moves are performed, and speculatively perform moves\
    \ without changing the game state.\n\nAnother interesting property about the data\
    \ structure is the structural sharing of boards. All boards share reference to\
    \ unchanged tiles on the boards. This makes creating a new board very fast and\
    \ allows the comparison of boards to use reference equality.\n\nThe game is comprised\
    \ of two React components: `Tiles` and `GameBoard`.\n\n`Tiles` is a basic React\
    \ component. When given a board as `props` it will consistently render all tiles.\
    \ This allows you to leverage CSS3 transitions for animation.\n\n```\n class Tiles\
    \ extends React.Component {\n  render() {\n    var board = this.props.board;\n\
        //sort board keys first to stop re-ordering of DOM elements\n    var tiles\
    \ = used_spaces(board).sort((a, b) => {\n      return board[a].id - board[b].id;\n\
        });\n    return <div className=\"board\">{\n      tiles.map((key) => {\n \
    \       var tile = board[key];\n        var val = tile_value(tile);\n        return\
    \ <span key={tile.id} className={key + \" value\" + val}>\n          {val}\n \
    \       </span>;\n      })}\n    </div>\n  }\n}\n```\n\n```\n <!-- Example output\
    \ from render of Tiles -->\n<div class=\"board\" data-reactid=\".0.1\">\n  <span\
    \ class=\"d2 value64\" data-reactid=\".0.1.$2\">64</span>\n  <span class=\"d1\
    \ value8\" data-reactid=\".0.1.$27\">8</span>\n  <span class=\"c1 value8\" data-reactid=\"\
    .0.1.$28\">8</span>\n  <span class=\"d3 value8\" data-reactid=\".0.1.$32\">8</span>\n\
    </div>\n```\n\n```\n /* CSS transistion applied to animate tiles */\n.board span{\n\
    \  /* ... */\n  transition: all 100ms linear;\n}\n```\n\n`GameBoard` is the state\
    \ machine, responding to user events `Arrow Keys` and `Button Press`, and interacting\
    \ with game logic functions to then update the state with a new board.\n\n```\n\
    \ class GameBoard extends React.Component {\n    constructor(props) {\n      super(props);\n\
          this.state = this.addTile(this.addTile(initial_board));\n    }\n\n    keyHandler(e)\
    \ {\n        var directions = {\n            37: left,\n            38: up,\n\
                39: right,\n            40: down\n        };\n        if (directions[e.keyCode]\n\
            && this.setBoard(fold_board(this.state, directions[e.keyCode]))\n     \
    \   && Math.floor(Math.random() * 30, 0) > 0){\n            setTimeout(() => {\n\
                     this.setBoard(this.addTile(this.state));\n            }, 100);\n\
            }\n    }\n\n    setBoard(new_board) {\n        if (!same_board(this.state,\
    \ new_board)){\n            this.setState(new_board);\n            return true;\n\
            }\n        return false;\n    }\n\n    addTile(board) {\n        var location\
    \ = available_spaces(board).sort(() => {\n          return .5 - Math.random();\n\
            }).pop();\n        if (location) {\n            var two_or_four = Math.floor(Math.random()\
    \ * 2, 0) ? 2 : 4;\n            return set_tile(board, location, new_tile(two_or_four));\n\
            }\n        return board;\n    }\n\n    newGame() {\n        this.setState(this.addTile(this.addTile(initial_board)));\n\
        }\n\n    componentDidMount() {\n        window.addEventListener(\"keydown\"\
    , this.keyHandler.bind(this), \n          false);\n    }\n\n    render() {\n \
    \       var status = !can_move(this.state)?\" - Game Over!\":\"\";\n        return\
    \ <div className=\"app\">\n            <span className=\"score\">\n           \
    \     Score: {score_board(this.state)}{status}\n            </span>\n         \
    \   <Tiles board={this.state}/>\n            <button onClick={this.newGame.bind(this)}>New\
    \ Game</button>\n        </div>\n    }\n} \n```\n\nIn the `GameBoard` component\
    \ we setup the keyboard handlers for interacting with the board. Every time an\
    \ arrow key is pressed we call `setBoard` with the newly created board from the\
    \ game logic. If the new board is different than the old, we update the state\
    \ of the `GameBoard` component. This avoids unnecessary cycles and improves performance.\n\
    \nIn the render function you render the Tiles component given the current board,\
    \ and render the score, calculated by the current board in the game logic.\n\n\
    The `addTile` function keeps adding new tiles to the board when you use the arrow\
    \ keys to keep the game going until the game is over when the board is full and\
    \ no numbers can be combined.\n\nGiven the above implementation, it is trivial\
    \ to extend the game with undo functionality. You can keep a history of all board\
    \ changes in state within the `GameBoard` component and with an undo button change\
    \ the current board: [https://jsfiddle.net/jeremiahrhall/9fbjgnt6/](https://jsfiddle.net/jeremiahrhall/9fbjgnt6/).\n\
    \nThe implementation of this game is quite simple, since React allows you to concentrate\
    \ on the game logic and user interactions without having to worry about keeping\
    \ the view in sync.\n\n# Email\n\nThough React is optimized for building interactive\
    \ UIs for the web, at it’s core it renders HTML. This means you can get a lot\
    \ of the same benefits you’d normally get from writing a React application for\
    \ something as terrible as writing HTML emails.\n\nBuilding HTML emails requires\
    \ a series of tables to render correctly in each email client. To write emails\
    \ you need to turn back the clock a few years and write HTML as if it were 1999.\n\
    \nSuccessfully rendering emails in a range of email clients is no small feat.\
    \ To build our design with React we will only touch on a number of challenges\
    \ you will encounter when building emails, whether they are rendered using React\
    \ or not.\n\nThe core principle of rendering HTML for emails with React is `React.renderToStaticMarkup`.\
    \ This function returns an HTML string containing the full component tree, given\
    \ 1 top level component. The only difference between `React.renderToStaticMarkup`\
    \ and `React.renderToString` is that `React.renderToStaticMarkup` doesn’t create\
    \ extra DOM attributes like `data-react-id` that React uses client side to keep\
    \ track of the DOM. Since the email doesn’t run client side in the browser; we\
    \ have no need for those attributes.\n\nLets build an email with React given this\
    \ design for desktop and mobile:\n\n![Alt Text](assets/Portrait.png)![Alt Text](assets/Mobile_Portrait.png)\n\
    \nTo render the email we have made a small script that outputs HTML that can be\
    \ used to send an email:\n\n```\n // render_email.js\nvar ReactDOMServer = require('react-dom/server');\n\
    var SurveyEmail = require('survey_email');\nvar survey = {};\n\nconsole.log(\n\
    \  ReactDOMServer.renderToStaticMarkup(<SurveyEmail survey={survey}/>)\n);\n```\n\
    \nLet’s get the core structure of `SurveyEmail` going. First, let’s build an `Email`\
    \ component:\n\n```\n class Email extends React.Component {\n  render() {\n  \
    \  return (\n      <html>\n        <body>\n          {this.prop.children}\n  \
    \      </body>\n      </html>\n    );\n  }\n}\n```\n\nThe `<SurveyEmail/>` component\
    \ uses `<Email/>`:\n\n```\n class SurveyEmail extends React.Component {\n  render()\
    \ {\n    var survey = this.props.survey;\n    return (\n      <Email>\n      \
    \  <h2>{survey.title}</h2>\n      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes\
    \ = {\n  survey: React.PropTypes.object.isRequired\n};\n```\n\nNext, per the design,\
    \ render two KPIs next to each other on desktop clients and stacked on a mobile\
    \ device. Each KPI looks similar in structure so they can share the same component:\n\
    \n```\n class SurveyEmail extends React.Component {\n  render() {\n    return\
    \ (\n      <table className='kpi'>\n        <tr>\n          <td>{this.props.kpi}</td>\n\
    \        </tr>\n        <tr>\n          <td>{this.props.label}</td>\n        </tr>\n\
    \      </table>\n    );\n  }\n}\n```"
