    \ situationally based on where it is in the transition.\n\nYou can read the full\
    \ source code of our example application at: [http://git.io/vlcpa](http://git.io/vlcpa).\n\
    \n## Styling transition classes\n\nBy convention, the `transitionName='EditingPaneTransition'` attribute\
    \ connects this element to four CSS classes: `EditingPaneTransition-enter`, `EditingPaneTransition-enter-active`, `EditingPaneTransition-leave`,\
    \ and `EditingPaneTransition-leave-active`. The `CSSTransitionGroup` addon will\
    \ automatically add and remove these classes as child components to enter or leave\
    \ the `ReactCSSTransitionGroup` component.\n\nHere’s an example of the CSS.\n\n\
    ```\n .EditingPaneTransition-enter {\n  transform: scale(1.2);\n  transition:\
    \ transform 0.3s cubic-bezier(.97,.84,.5,1.21);\n}\n\n.EditingPaneTransition-enter-active\
