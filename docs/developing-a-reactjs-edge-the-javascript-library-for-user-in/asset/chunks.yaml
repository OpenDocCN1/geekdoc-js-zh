  trans: "\n\n```\nimport React, {PropTypes} from 'react';\nimport Box from '../atoms/Box';\n\
    import Heading from '../atoms/Heading';\nimport Markdown from '../atoms/Markdown';\n\
    import Link from '../atoms/Link';\nimport {State} from '../utils/actions';\n\n\
    export default\nclass Comment extends React.Component {\n  static propTypes =\
    \ {\n    comment: PropTypes.object.isRequired,\n    targetScore: PropTypes.number.isRequired\n\
    \  };\n\n  render(){\n      let comment = this.props.comment;\n      let targetScore\
    \ = this.props.targetScore;\n      let replies = comment.replies || [];\n    \
    \  return (\n        <Box\n          key={comment.id}\n          padding=\"0.5em\"\
    \n          margin=\"0.5em\"\n          style={{\n            background: comment.score\
    \ >= targetScore ? '#ffffaa' : '#efefef'\n          }}\n        >\n          <Box\
    \ direction=\"row\">\n            <Heading level=\"title\">{comment.score_hidden\
    \ ? '?' : comment.score}</Heading>\n            <Box margin={{right: \"1em\"}}\
    \ />\n            <Box style={{maxWidth: '80em', lineHeight: '1.5'}}>\n      \
    \        <Markdown content={comment.body} />\n            </Box>\n          </Box>\n\
    \          <Box margin={{top: '0.5em'}} direction=\"row\">\n            <span>\n\
    \              由 <Link to={`/user/${comment.author}`}>{comment.author}</Link>\n\
    \            </span>\n            <Box\n              id=\"replyBox\"\n      \
    \        margin=\"0 1em\"\n              onClick={() => {\n                State.setEditing({\n\
    \                  type: 'comment',\n                  id: comment.id,\n     \
    \           })\n              }}\n              style={{cursor: 'pointer'}}\n\
    \            >\n              回复\n            </Box>\n          </Box>\n     \
    \     {replies.map((reply) => <Comment comment={reply} targetScore={targetScore}\
    \ />)}\n        </Box>\n      );\n  }\n}\n```\n\n`Comment` 的 `render` 方法与传递给 `Comments`\
    \ 组件中 `map` 调用的函数非常相似。当你保存 `Comment.js` 后返回终端时，Jest 应该会显示你的测试现在通过了：\n\n```\n PASS\
    \  src/utils/__tests__/shallowCompareWithChildrenId.test.js (0.366s)\nPASS  src/atoms/__tests__/Box.test.js\
    \ (1.079s)\nPASS  src/molecules/__tests__/Comment.test.js (1.307s)\n8 tests passed\
    \ (8 total in 3 test suites, run time 2.335s)\n```\n\n## 对函数和 DOM 事件进行断言\n\n让我们在\
    \ `Comment.test.js` 中添加一个新测试，断言当点击回复按钮时，应用的状态会被更新。这个测试应该第一次就能通过，无需修改。\n\n```\n\
    describe('molecules/Comment', () => {\n  ...\n  it('当点击回复按钮时，应调用 State.setEditing',\
    \ () => {\n    let wrapper = mount(<Comment comment={comment} targetScore={1}\
    \ />);\n    let replyBox = wrapper.find('#replyBox');\n    State.setEditing =\
    \ jest.fn();\n    replyBox.simulate('click');\n    expect(State.setEditing).toBeCalledWith({\n\
    \      type: 'comment',\n      id: comment.id,\n    });\n  });\n});\n```\n\n这个测试中有一些新东西，让我们来仔细看看：\n\
    \n1.  首先，使用 Enzyme 的 `mount` 将一个 `Comment` 组件渲染到 DOM 中。\n2.  使用返回的 Enzyme 包装器的\
    \ `find` 方法，选择 id 为 `replyBox` 的元素。\n3.  用 `jest.fn()` 创建一个模拟函数，并赋值给 `State.setEditing`。\n\
    4.  使用包装器在 `replyBox` 元素上模拟一个 `click` 事件。\n5.  最后，断言 `State.setEditing` 应该被调用，并且传入提供的对象。\n\
    \nReact 组件通常会根据用户交互或其他生命周期事件来执行函数。Jest 和 Enzyme 使得测试组件是否按预期工作变得简单。\n\n## 对子组件进行断言\n\
    \n现在我们已经实现了新的 `Comment` 组件，让我们编写一个测试来验证 `Comments` 组件会为其 `comments` 属性中的每个对象渲染一个\
    \ `Comment` 组件。\n\n```\nimport React from 'react';\nimport {shallow, mount, render}\
    \ from 'enzyme';\n\nimport Comments from '../Comments';\nimport Comment from '../Comment';\n\
    \njest.unmock('../Comments');\njest.unmock('../Comment');\n\ndescribe('molecules/Comments',\
    \ () => {\n  it('<Comments comments={comments}/>', () => {\n    let comments =\
    \ [{\n        id: 1,\n        replies: [],\n        score: 1,\n        score_hidden:\
    \ 0,\n        body: \"测试驱动开发，耶！\",\n        author: \"Jeremiah Hall\"\n    },\
    \ {\n        id: 2,\n        score: 0.5,\n        score_hidden: 0.25,\n      \
    \  body: \"React 太棒了！\",\n        author: \"Jeremiah Hall\"\n    }];\n\n    let\
    \ wrapper = shallow(<Comments comments={comments} />);\n    let childComments\
    \ = wrapper.find(Comment);\n\n    expect(childComments.length).toEqual(comments.length);\n\
    \  });\n});\n```\n\n这个测试定义了一个包含两个评论对象的数组，并使用浅渲染渲染了一个 `Comments` 组件，并将该数组作为属性传入。然后它使用返回的包装器的\
    \ `find` 方法来搜索类型为 `Comment` 的子组件。你可以用这种方式搜索任何类型的 React 组件。Enzyme 支持使用 CSS 选择器（如\
    \ `.class-name` 或 `#replyBox`）、使用组件构造函数（如上例所示）、通过组件的显示名称或组件属性进行搜索。\n\n你可以在 GitHub\
    \ 上查看 Enzyme 的 API 文档：\n\n[`github.com/airbnb/enzyme`](https://github.com/airbnb/enzyme)\n\
    \n# Enzyme 中的浅渲染、挂载和渲染\n\nEnzyme 的 `shallow` 函数将其渲染的组件视为一个独立单元，这样你的测试就不会受到子组件的影响。`mount`\
    \ 函数渲染到 DOM，并确保 `componentDidUpdate` 等组件生命周期方法在适当的时候被调用。`render` 函数更进一步，生成静态 HTML，你可以对其进行分析。\n\
    \n这个 Comments 测试最初会失败，因为我们需要修改组件以使用新的 `Comment`：\n\n```\n...\nimport Comment from\
    \ './Comment';\n\nexport default\nclass Comments extends React.Component {\n \
    \ ...\n  render(){\n    // 计算平均评论分数\n    var targetScore = this.getGoodScoreThreshold();\n\
    \n    return (\n      <Box>\n        {this.props.comments.map((comment) => <Comment\
    \ key={comment.id} comment={comment} targetScore={targetScore} />)}\n      </Box>\n\
    \    );\n  }\n}\n```\n\n在文件顶部添加了 `Comment` 的导入语句，并修改了 `map` 函数，使其为属性中的每个评论返回一个\
    \ `Comment` 组件。\n\n让我们扩展测试，验证子 `Comment` 组件是否接收到了正确的评论属性。\n\n```\ndescribe('molecules/Comments',\
    \ () => {\n  it('<Comments comments={comments}/>', () => {\n    ...\n    expect(childComments.length).toEqual(comments.length);\n\
    \    expect(childComments.at(0).prop('comment')).toEqual(comments[0]);\n    expect(childComments.at(1).prop('comment')).toEqual(comments[1]);\n\
    \    ...\n  });\n});\n```\n\n这两个新的断言从每个子组件中检索 `comment` 属性，并断言它们与示例评论数组中相同索引处的评论相等。\n\
    \n# 总结\n\n本章涵盖了测试概念的旋风：渲染、自动模拟、取消模拟、包装器、模拟事件、元素查找器和测试驱动开发！现在你已经准备好在实际应用中测试你的 React\
    \ 组件了。\n\n既然我们已经介绍了如何对 React 应用进行单元测试，接下来让我们学习一些可以用来构建 React 应用的架构模式。\n\n^(1)\
    \ http://blog.8thlight.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html\n\
    \n^(2) http://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/paper-boy/demeter.pdf\n\
    \n^(3) https://www.youtube.com/watch?v=1wHr-O6gEfc\n\n# 第 15 章 架构模式\n\n"
- fmt: "\nThere are a good number of architectural patterns that can be used with\
    \ React. From a standard Flux pattern, to Flux variants like Reflux, to an entirely\
    \ di?fferent language and ecosystem like Om and ClojureScript, React has proven\
    \ to be quite adaptable. In this chapter we’ll explore how our sample React app\
    \ is structured and how this structure helps manage complexity as your project\
    \ grows. We’ll also explore some popular alternatives.\n\nIt is commonly said\
    \ that you can consider React to be the V in MVC. It could be used with inline\
    \ AJAX requests as shown below but, this quickly becomes hard to reason about:\n\
    \n```\nexport default\nclass Reply extends React.Component {\n  getInitialState()\
    \ {\n    return {\n      text: \"\"\n    };\n  }\n  submitReply() {\n    $.ajax({\
    \ url: '/replies', type: 'POST',\n      contentType: 'application/json',\n   \
    \   dataType: 'json',\n      data: JSON.stringify(this.state.text)}, (json) =>\
    \ {\n        this.setState({ text: \"\" });\n      });\n  }\n  render() {\n  \
    \  return (\n      <div>\n        <textarea\n          value={this.state.text}\n\
    \          onChange={(e) => this.setState({text:e.target.value})}\n        />\n\
    \        <input value=\"Submit\" type=\"button\" onClick={() => this.submitReply()}\
    \ />\n      </div>\n    );\n  }\n}\n```\n\nFor example, how do you handle updating\
    \ other components that may need to know about this new reply?\n\nReact is flexible\
    \ enough to work well with many MVC frameworks. Let’s begin by examining `react-router`.\n\
    \n# Routing\n\nRouting is an intuitive way to link the URL to the application’s\
    \ view hierarchy.\n\nRouters direct URLs in a Single Page Application to specific\
    \ views, or components.\n\nYou can imagine that for the URL `/items` you’d want\
    \ to run a function that loads the items from the server and renders a `<ItemsList\
    \ />` component.\n\nThere are many different kinds of Routers. They exist on the\
    \ server as well. Some routers work both on the client and on the server.\n\n\
    React is simply a rendering library and does not provide a router. The explosive\
    \ growth of the React community has supported the creation of a number of routing\
    \ solutions. In this section we’ll `react-router`, the routing solution used in\
    \ the sample app.\n\n## react-router\n\nThe sample app for this book uses `react-router`.\
    \ It differs from other routers in that the router is composed of JSX elements.\n\
    \nThe routes are defined as `Route` components and each route has a `component`\
    \ prop that is a React component.\n\nThis is the router in the sample app:\n\n\
    ```\nexport default (\n  <Route component={App}>\n    <Route component={MainLayout}>\n\
    \      <Route path=\"/\" component={require('./pages/HomePage/HomePage')} />\n\
    \      <Route path=\"/user/:id\" component={require('./pages/UserPage/UserPage')}\
    \ />\n      <Route path=\"/r/:id\" component={require('./pages/BoardPage/BoardPage')}\
    \ />\n      <Route path=\"/item/:id\" component={require('./pages/DetailsPage/DetailsPage')}\
    \ />\n    </Route>\n  </Route>\n);\n```\n\nTo get the router to run you render\
    \ it as your top level component:\n\n```\nvar root = document.getElementById('app-root');\n\
    ReactDOM.render(\n  <Router history={createBrowserHistory()}>{routes}</Router>\n\
    , root);\n```\n\nLike the other Routers, `react-router` has a similar concept\
    \ of params. For instance the route `'/user/:id'` will pass in the `id` property\
    \ to the `UserPage` component.\n\nOne of the cool features of `react-router` is\
    \ that it provides a `Link` component that you can use for navigation and it will\
    \ map it to the routes. In the sample app, the `react-router` `Link` component\
    \ has been encapsulated in the file `src/atom/Link.js`. but, the props are essentially\
    \ just passed to the `react-router` component.\n\nHere’s how our `<MainNavigation/>`\
    \ component looks with the `Link` component:\n\n```\n...\nexport default\nclass\
    \ MainNavigation extends React.Component {\n  render(){\n    return (\n      <Box>\n\
    \        <Box direction=\"row\">\n          {tabs.map((tab) => {\n           \
    \ return (\n              <Box margin={{left: \"0.1em\"}} key={tab.name}>\n  \
    \              <Link unstyled to={tab.to}>\n                  <Button which={tab.which}>{tab.name}</Button>\n\
    \                </Link>\n              </Box>\n            );\n          })}\n\
    \        </Box>\n      </Box>\n    );\n  }\n}\n```\n\nRead more about and download\
    \ `react-router` here: [https://github.com/reactjs/react-router](https://github.com/reactjs/react-router)\n\
    \n# Flux\n\nFlux is an architectural pattern for client-side applications introduced\
    \ by Facebook. It complements React with a uni-directional data-flow that’s easy\
    \ to reason about and requires very little scaffolding to get up and running.\n\
    \nFlux is made of four main parts: the store, the dispatcher, the action creators,\
    \ and the views (React components.) Action creators are helper methods to create\
    \ a semantic interface to the dispatcher.\n\nYou can think of your top-most React\
    \ component as a View-Controller. The View-Controller component interfaces with\
    \ the store and facilitates communication with its child components. This is not\
    \ unlike a ViewController in the world of iOS.\n\nEach node in the Flux pattern\
    \ is independent, enforcing strict separation of concerns and keeping each easily\
    \ testable in isolation.\n\n## Data Flow\n\nA key aspect of Flux is the one-way\
    \ flow of information. Compared to other approaches with less structured event\
    \ handling or complicated two-way data binding this may seem very different.\n\
    \nFlux has a well defined flow between its components.\n\n1. When your application\
    \ starts your Stores will register callbacks or event listeners with the Dispatcher.\n\
    \n2. When React components in your application are rendered, they’ll register\
    \ their own callbacks or event listeners with the Stores.\n\n3. When a user interacts\
    \ with a View and clicks on something that may trigger an Action Creator.\n\n\
    4. The Action Creator might perform an AJAX request and then dispatch an Action\
    \ with the Dispatcher.\n\n5. The Dispatcher will then deliver that Action to all\
    \ of the Stores that registered callbacks with it.\n\n6. The Stores will update\
    \ their state as necessary, depending on the content of the Action, and if their\
    \ state changed they’ll notify all the components that are listening for change\
    \ events.\n\n7. The notified Views will then request the updated state from the\
    \ stores and re-render if necessary, bringing the application to a new, updated\
    \ state.\n\nThis uni-directional flow and well defined separation of responsibilities\
    \ among the components makes it much easier to reason about state changes within\
    \ your application.\n\n![Alt Text](assets/flux-diagram-white-background.png)\n\
    \nImage credit: [Facebook](https://github.com/facebook/flux/)\n\n## Flux parts\n\
    \nFlux is comprised of distinct parts with specific responsibilities. Within the\
    \ uni-directional flow of information each Flux part takes the input from downstream,\
    \ processes it, and sends it’s output upstream.\n\n* Dispatcher—a central hub\
    \ within your app.\n\n* Actions—the domain-specific-language of your app.\n\n\
    * Store—business-logic and data-interactions.\n\n* Views—the component tree for\
    \ rendering the app.\n\nLet’s discuss each part, what it’s responsible for, and\
    \ how to use it effectively within your React apps.\n\n### Dispatcher\n\nWe’ve\
    \ chosen to start with the dispatcher because it is the central hub through which\
    \ all user interaction and data flows. The dispatcher is a singleton within the\
    \ Flux pattern.\n\nThe dispatcher is responsible for registering callbacks on\
    \ the stores and managing the dependencies between them. Actions flow through\
    \ the dispatcher and out into the stores that have registered for it.\n\nOur sample\
    \ application contains multiple stores. As you grow your application, you’ll inevitably\
    \ run into situations where you need to manage multiple stores and their dependencies\
    \ upon each other. We’ll discuss this case below.\n\n### Actions\n\nFrom your\
    \ user’s perspective this is where Flux starts. Every action they take through\
    \ the UI creates an action that is sent to the dispatcher.\n"
  raw: "There are a good number of architectural patterns that can be used with React.\
    \ From a standard Flux pattern, to Flux variants like Reflux, to an entirely di?fferent\
    \ language and ecosystem like Om and ClojureScript, React has proven to be quite\
    \ adaptable. In this chapter we’ll explore how our sample React app is structured\
    \ and how this structure helps manage complexity as your project grows. We’ll\
    \ also explore some popular alternatives.\n\nIt is commonly said that you can\
    \ consider React to be the V in MVC. It could be used with inline AJAX requests\
    \ as shown below but, this quickly becomes hard to reason about:\n\n```\n export\
    \ default\nclass Reply extends React.Component {\n  getInitialState() {\n    return\
    \ {\n      text: \"\"\n    };\n  }\n  submitReply() {\n    $.ajax({ url: '/replies',\
    \ type: 'POST',\n      contentType: 'application/json',\n      dataType: 'json',\n\
          data: JSON.stringify(this.state.text)}, (json) => {\n        this.setState({\
    \ text: \"\" });\n      });\n  }\n  render() {\n    return (\n      <div>\n  \
    \      <textarea\n          value={this.state.text}\n          onChange={(e) =>\
    \ this.setState({text:e.target.value})}\n        />\n        <input value=\"Submit\"\
    \ type=\"button\" onClick={() => this.submitReply()} />\n      </div>\n    );\n\
      }\n}\n```\n\nFor example, how do you handle updating other components that may\
    \ need to know about this new reply?\n\nReact is flexible enough to work well\
    \ with many MVC frameworks. Let’s begin by examining react-router.\n\n# Routing\n\
    \nRouting is an intuitive way to link the URL to the application’s view hierarchy. \n\
    \nRouters direct URLs in a Single Page Application to specific views, or components.\n\
    \nYou can imagine that for the URL/items you’d want to run a function that loads\
    \ the items from the server and renders a `<ItemsList /> ` component.\n\nThere\
    \ are many different kinds of Routers. They exist on the server as well. Some\
    \ routers work both on the client and on the server.\n\nReact is simply a rendering\
    \ library and does not provide a router. The explosive growth of the React community\
    \ has supported the creation of a number of routing solutions. In this section\
    \ we’ll react-router, the routing solution used in the sample app.\n\n## react-router\n\
    \nThe sample app for this book uses react-router. It differs from other routers\
    \ in that the router is composed of JSX elements.\n\nThe routes are defined as\
    \ `Route` components and each route has a `component` prop that is a React component.\n\
    \nThis is the router in the sample app:\n\n```\n export default (\n  <Route component={App}>\n\
        <Route component={MainLayout}>\n      <Route path=\"/\" component={require('./pages/HomePage/HomePage')}\
    \ />\n      <Route path=\"/user/:id\" component={require('./pages/UserPage/UserPage')}\
    \ />\n      <Route path=\"/r/:id\" component={require('./pages/BoardPage/BoardPage')}\
    \ />\n      <Route path=\"/item/:id\" component={require('./pages/DetailsPage/DetailsPage')}\
    \ />\n    </Route>\n  </Route>\n);\n```\n\nTo get the router to run you render\
    \ it as your top level component:\n\n```\n var root = document.getElementById('app-root');\n\
    ReactDOM.render(\n  <Router history={createBrowserHistory()}>{routes}</Router>\n\
    , root);\n```\n\nLike the other Routers, react-router has a similar concept of\
    \ params. For instance the route `'/user/:id'` will pass in the `id` property\
    \ to the `UserPage` component.\n\nOne of the cool features of react-router is\
    \ that it provides a Link component that you can use for navigation and it will\
    \ map it to the routes. In the sample app, the react-router Link component has\
    \ been encapsulated in the file `src/atom/Link.js`. but, the props are essentially\
    \ just passed to the react-router component.\n\nHere’s how our `<MainNavigation/>` component\
    \ looks with the Link component:\n\n```\n ...\nexport default\nclass MainNavigation\
    \ extends React.Component {\n  render(){\n    return (\n      <Box>\n        <Box\
    \ direction=\"row\">\n          {tabs.map((tab) => {\n            return (\n \
    \             <Box margin={{left: \"0.1em\"}} key={tab.name}>\n               \
    \ <Link unstyled to={tab.to}>\n                  <Button which={tab.which}>{tab.name}</Button>\n\
                    </Link>\n              </Box>\n            );\n          })}\n\
            </Box>\n      </Box>\n    );\n  }\n}\n```\n\nRead more about and download\
    \ react-router here: [https://github.com/reactjs/react-router](https://github.com/reactjs/react-router).\n\
    \n# Flux\n\nFlux is an architectural pattern for client-side applications introduced\
    \ by Facebook. It complements React with a uni-directional data-flow that’s easy\
    \ to reason about and requires very little scaffolding to get up and running.\n\
    \nFlux is made of four main parts: the store, the dispatcher, the action creators,\
    \ and the views (React components.) Action creators are helper methods to create\
    \ a semantic interface to the dispatcher.\n\nYou can think of your top-most React\
    \ component as a View-Controller. The View-Controller component interfaces with\
    \ the store and facilitates communication with its child components. This is not\
    \ unlike a ViewController in the world of iOS.\n\nEach node in the Flux pattern\
    \ is independent, enforcing strict separation of concerns and keeping each easily\
    \ testable in isolation.\n\n## Data Flow\n\nA key aspect of Flux is the one-way\
    \ flow of information. Compared to other approaches with less structured event\
    \ handling or complicated two-way data binding this may seem very different.\n\
    \nFlux has a well defined flow between its components.\n\n1.  When your application\
    \ starts your Stores will register callbacks or event listeners with the Dispatcher.\n\
    \n2.  When React components in your application are rendered, they’ll register\
    \ their own callbacks or event listeners with the Stores.\n\n3.  When a user interacts\
    \ with a View and clicks on something that may trigger an Action Creator.\n\n\
    4.  The Action Creator might perform an AJAX request and then dispatch an Action\
    \ with the Dispatcher.\n\n5.  The Dispatcher will then deliver that Action to\
    \ all of the Stores that registered callbacks with it.\n\n6.  The Stores will\
    \ update their state as necessary, depending on the content of the Action, and\
    \ if their state changed they’ll notify all the components that are listening\
    \ for change events.\n\n7.  The notified Views will then request the updated state\
    \ from the stores and re-render if necessary, bringing the application to a new,\
    \ updated state.\n\nThis uni-directional flow and well defined separation of responsibilities\
    \ among the components makes it much easier to reason about state changes within\
    \ your application.\n\n![Alt Text](assets/flux-diagram-white-background.png)\n\
    \nImage credit: [Facebook](https://github.com/facebook/flux/)\n\n## Flux parts\n\
    \nFlux is comprised of distinct parts with specific responsibilities. Within the\
    \ uni-directional flow of information each Flux part takes the input from downstream,\
    \ processes it, and sends it’s output upstream. \n\n*   Dispatcher—a central hub\
    \ within your app.\n\n*   Actions—the domain-specific-language of your app.\n\n\
    *   Store—business-logic and data-interactions.\n\n*   Views—the component tree\
    \ for rendering the app.\n\nLet’s discuss each part, what it’s responsible for,\
    \ and how to use it effectively within your React apps. \n\n### Dispatcher\n\n\
    We’ve chosen to start with the dispatcher because it is the central hub through\
    \ which all user interaction and data flows. The dispatcher is a singleton within\
    \ the Flux pattern.\n\nThe dispatcher is responsible for registering callbacks\
    \ on the stores and managing the dependencies between them. Actions flow through\
    \ the dispatcher and out into the stores that have registered for it.\n\nOur sample\
    \ application contains multiple stores. As you grow your application, you’ll inevitably\
    \ run into situations where you need to manage multiple stores and their dependencies\
    \ upon each other. We’ll discuss this case below.\n\n### Actions\n\nFrom your\
    \ user’s perspective this is where Flux starts. Every action they take through\
    \ the UI creates an action that is sent to the dispatcher. "
