    \ can also be the values of an input field, the user’s mouse position, or the\
    \ result of an AJAX request.\n\nTry not to duplicate prop data into `state`. When\
    \ possible, consider `props` the source of truth.\n\n# Stateless Functional Components\n\
    \nYou can take this idea of a single source of truth and run with it to simplify\
