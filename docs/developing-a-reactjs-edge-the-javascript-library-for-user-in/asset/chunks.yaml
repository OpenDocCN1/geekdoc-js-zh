    \ use the Immutability Helpers Addon. It lets you continue using your existing\
    \ mutable data structures as though they were immutable, by making it easy to\
    \ create new (also mutable) objects instead of performing in-place updates.\n\n\
    While this does not actually give you any new guarantees, it does allow you to\
    \ write a quick `shouldComponentUpdate` function as described above.\n\nLet’s\
    \ update our example to use the Immutability Helpers Addon:\n\n```\n var update\
    \ = React.addons.update;\n\nvar SurveyEditor = React.createClass({\n  // ...\n\
    \n  handleDrop: function (ev) {\n    var questionType = ev.dataTransfer.getData('questionType');\n\
    \    var questions = update(this.state.questions, {\n      $push: [{ type: questionType\
    \ }]\n    });\n\n    this.setState({\n      questions: questions,\n      dropZoneEntered:\
    \ false\n    });\n  },\n\n  handleQuestionChange: function (key, newQuestion)\
    \ {\n    var questions = update(this.state.questions, {\n      $splice: [[key,\
    \ 1, newQuestion]]\n    });\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = update(this.state.questions,\
    \ {\n      $splice: [[key, 1]]\n    });\n\n    this.setState({ questions: questions\
    \ });\n  }\n\n  // ...\n});\n```\n\nNext we’ll try a different library, one which\
    \ actually does make guarantees about immutability.\n\n# Using seamless-immutable\n\
    \nThe seamless-immutable library is not part of the official React family of libraries,\
    \ but was designed to be used with React. It creates immutable versions of regular\
    \ Objects and Arrays, which can be passed around, accessed, and iterated over\
    \ just like their mutable counterparts, but which block any operations that would\
    \ mutate them.\n\nLike the Immutability Helpers Addon, seamless-immutable provides\
    \ convenience functions for working with immutable data. In the case of seamless-immutable,\
    \ however, these are implemented as methods on the objects themselves. For example,\
    \ seamless-immutable objects gain a `.merge()` method which works like the `$merge`\
    \ option in the Immutable Helpers Addon.\n\n```\n var update = React.addons.update;\n\
    \nvar SurveyEditor = React.createClass({\n  // ...\n\n  handleDrop: function (ev)\
    \ {\n    var questionType = ev.dataTransfer.getData('questionType');\n    var\
    \ questions = this.state.questions.concat(\n      [{ type: questionType }]\n \
    \   );\n\n    this.replaceState(this.state.merge({\n      questions: questions,\n\
    \      dropZoneEntered: false\n    }));\n  },\n\n  handleQuestionChange: function\
    \ (key, newQuestion) {\n    var questions = this.state.questions.map(\n      \
    \  function(question, index) {\n            return index === key ? newQuestion\
    \ : question;\n        }\n    );\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = this.state.questions.filter(\n\
            function(question, index) {\n            return index !== key;\n     \
    \   }\n    );\n\n    this.setState({ questions: questions });\n  }\n\n  // ...\n\
    \n});\n```\n\n# Using Immutable.js\n\nWhereas the previous two libraries provided\
    \ tools around normal JavaScript objects and arrays, Immutable.js takes a different\
    \ approach: it provides alternative data structures to objects and arrays.\n\n\
    The most commonly-used of these data structures are `Immutable.Map` (analogous\
    \ to Object) and `Immutable.Vector` (analogous to Array). Neither of these can\
    \ be freely substituted for JavaScript objects or arrays in the general case,\
    \ although you can easily convert to and from the Immutable.js data structures\
    \ and their mutable JavaScript counterparts.\n\n**Immutable.Map**\n\n`Immutable.Map`\
    \ can be used as a substitute for regular JavaScript objects:\n\n```\n var question\
    \ = Immutable.Map({description: 'who is your favorite superhero?'});\n// get values\
    \ from the Map with .get\nquestion.get('description');\n\n// updating values with\
    \ .set returns a new object.\n// The original object remains intact.\nquestion2\
    \ = question.set('description', 'Who is your favorite comicbook hero?');\n\n//\
    \ merge 2 objects with .merge to get a third object.\n// Once again none of the\
    \ original objects are mutated.\nvar title = { title: 'Question #1' };\nvar question3\
    \ = question.merge(question2, title);\nquestion3.toObject(); // { title: 'Question\
    \ #1', description: 'who is your favorite comicbook hero' }\n```\n\n**Immutable.Vector**\n\
    \nUse `Immutable.Vector` for arrays:\n\n```\n var options = Immutable.Vector('Superman'\
    \ , 'Batman');\nvar options2 = options.push('Spiderman');\noptions2.toArray();\
    \ // ['Superman', 'Batman', 'Spiderman']\n```\n\nYou can also nest the data structures:\n\
    \n```\n var options = Immutable.Vector('Superman' , 'Batman');\nvar question =\
    \ Immutable.Map({\n  description: 'who is your favorite superhero?',\n  options:\
    \ options\n});\n```\n\nImmutable.js has many more facets. For more information\
    \ on Immutable.js go to [https://github.com/facebook/immutable-js](https://github.com/facebook/immutable-js).\n\
    \n# Summary\n\nIn this chapter we learned about the benefits and costs of using\
    \ immutability in a React application. We covered its impact on `shouldComponentUpdate`,\
    \ on what it means for update times, and three different ways to introduce immutability\
    \ into a React code base.\n\nNext we’ll look into other uses of React beyond traditional\
    \ web applications.\n\n# Chapter 17\\. Other uses\n\nReact is a powerful interactive\
    \ UI rendering library, but it provides a great way to handle data and user input.\
    \ It encourages small components that are reusable and easy to unit test. These\
    \ are all great features that you can apply to other technologies than just the\
    \ web.\n\nIn this chapter we’ll look at how to use React for:\n\n*   Desktop applications\n\
    \n*   Games\n\n*   Emails\n\n*   Charting\n\n# Desktop\n\nWith projects like Electron\
    \ or node-webkit you can run a web application on the desktop. The Atom Editor\
    \ from Github is built with Electron, which you can also use with React.\n\nThe\
    \ sample app already includes Electron, and to launch it, run this command in\
    \ the root of the sample app:\n\n```\n ./node_modules/.bin/electron desktop.html\n\
    ```\n\nRunning Electron with `desktop.html` opens up the application in a window.\n\
    \n![](assets/Electron.png)\n\nYou can read more about Electron at [http://electron.atom.io](http://electron.atom.io).\n\
    \nWith projects like Electron and node-webkit, you can build desktop applications\
    \ using the same technologies you use for the web. Just like for the web, React\
    \ can help you build powerful interactive applications for the desktop.\n\n# Games\n\
    \nGames generally require a high level of user interaction, where the user is\
    \ responding to the changing state of the game. This is in contrast to most web\
    \ applications where the user is either consuming content or producing content.\
    \ Games are essentially a state machine, having two basic roles:\n\n1.  Updating\
    \ the View\n\n2.  Responding to events\n\nIn the introduction to this book, you\
    \ read that React has a very narrow scope that is concerned with only two things:\n\
    \n1.  Updating the DOM\n\n2.  Responding to events\n\nThe similarities between\
    \ React and Games don’t just stop at this. React owes much of its Virtual DOM\
    \ architecture to high performance 3D gaming engines, where given the intended\
    \ view state, the rendering engine ensures an efficient update of view/DOM.\n\n\
    As an example of using React with gaming, let’s take a look at an implementation\
    \ of the game 2048\\. The object of this game is to combine matching numbers on\
    \ the board until you reach 2048.\n\n![2048](assets/2048.png)\n\nLet’s dive in\
    \ and take a look at the implementation ([https://jsfiddle.net/jeremiahrh](https://jsfiddle.net/jeremiahrhall/6wa8djju/)[all/6wa8djju/](https://jsfiddle.net/jeremiahrhall/6wa8djju/)).\n\
    \nThe source is divided into two parts. The first section is the game logic implemented\
    \ as functions in the global namespace, and the second section is the React components.\
    \ The first thing you will see is the initial data structure of the board."
