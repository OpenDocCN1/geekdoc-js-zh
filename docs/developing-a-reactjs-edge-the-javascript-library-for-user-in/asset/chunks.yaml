    你的界面越大，就越有可能出现一个交互触发更新，进而触发另一个更新，再触发另一个更新的情况。当这些级联更新没有正确批处理时，性能就会大幅下降。更糟糕的是，有时
    DOM 元素在到达最终状态之前会被多次更新。


    React 的虚拟表示差异比较不仅通过单次执行最小更新集来最大程度地减少这些问题，还简化了应用程序的维护。当世界状态因用户输入或外部更新而发生变化时，你只需通知
    React 状态变化，它就会自动处理其余部分。无需微观管理整个过程。


    React 为整个应用程序使用单个事件处理程序，并将所有事件委托给该事件处理程序。这也提升了 React 的性能，因为拥有许多事件处理程序可能会带来显著的性能损失。


    你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 阅读本书中使用的示例应用程序的完整源代码。


    # 书籍概览


    本书将带你了解四个主要主题领域，帮助你掌握 React 的优势。


    ## 创建与组合组件


    本书的前七章都是关于创建和组合 React 组件的。这些章节将帮助你理解如何使用 React。


    ### 1) React 简介


    第一章介绍 React，涵盖背景知识和书籍概览。


    ### 2) 使用 JSX 和基本 React 组件


    JSX（JavaScript XML）是一种在 JavaScript 中编写声明式 XML 风格语法的方式。你将学习如何将 JSX 与 React 结合使用，以及如何构建基本的
    React 组件。虽然并非必须与 React 一起使用，但本书中的大多数示例以及示例应用程序都使用了 JSX，因为它是使用 React 的推荐方式。


    ### 3) React 组件生命周期


    React 在渲染过程中经常创建和销毁组件。React 提供了许多可以在组件生命周期中挂钩的函数。你应该了解如何管理组件的生命周期，以确保不会在应用程序中造成内存泄漏。


    ### 4) React 中的数据流


    了解数据如何通过组件树向下传递以及哪些数据可以安全更改非常重要。React 对 `props` 和 `state` 有非常清晰的区分。本章将教你什么是 props
    和 state，以及如何在 React 组件中正确使用它们。


    ### 5) 事件处理


    React 以声明方式实现事件处理。事件处理是任何动态 UI 的重要组成部分，掌握它至关重要。幸运的是，React 使事件处理变得非常简单。


    ### 6) 组合组件


    React 鼓励你制作小巧、精确、执行特定任务的组件。然后你需要在应用程序中创建编排层来组合这些组件。本章将教你如何在其他组件中使用你的组件。


    ### 7) 高阶组件与 Mixins


    这是一种允许抽象数据依赖关系“如何”实现的模式。高阶组件包装其他组件，通过 props 提供数据或函数。本章还涵盖了 mixins，在某些情况下它们仍然有用。


    ## 高级主题


    一旦你掌握了 React 的基础知识，你将进入一些更高级的主题。接下来的六章将帮助你磨练 React 技能，并帮助你理解如何构建出色的 React 组件。


    ### 8) DOM 操作


    即使 React 中拥有虚拟 DOM 的全部能力，有时你仍然需要访问应用程序中的原始 DOM 节点。这可能是为了让你能够使用现有的 JavaScript 库，或者为了对组件获得更多控制。本章将教你如何在
    React 组件生命周期中安全地访问 DOM，以及何时释放对 DOM 的控制以避免内存泄漏。


    ### 9) 使用 React 构建表单


    使用 HTML 表单元素是接收用户输入的最佳方式之一。然而，HTML 表单元素具有很强的状态性。React 提供了一种方法，可以将表单元素的大部分状态转移到
    React 组件中。这让你对表单元素拥有不可思议的控制力。


    ### 10) 动画


    作为 Web 开发者，我们已经幸运地拥有一种非常声明式的方式来定义高性能动画：CSS。React 鼓励使用 CSS 进行动画处理。本章展示了 React 如何帮助你利用
    CSS 为 React 组件添加动画效果。


    ### 11) 组件性能调优


    React 中的虚拟 DOM 开箱即用就能提供出色的性能，但总有改进的空间。React 提供了一种方法，如果你知道组件没有变化，可以告诉渲染引擎无需重新渲染组件。这样做可以大大提高应用程序的速度。


    ### 12) 服务端渲染


    许多应用程序需要 SEO，幸运的是，React 可以在非浏览器环境（如 Node.js）中渲染为字符串。服务端渲染还可以改善应用程序的首屏加载时间。然而，编写同时支持服务端渲染和客户端渲染的应用程序可能很困难。本章为你提供了一些同构渲染的策略，并强调了你在服务端渲染时会遇到的一些更具挑战性的考虑因素。


    ## React 工具


    React 拥有一些出色的开发者工具和测试套件。学习使用它们将帮助你编写健壮的应用程序。本节分为两章，涵盖工具和测试。


    ### 13) 开发工具


    随着你编写更大的 React 应用程序，你将开始需要一种方法来自动化打包代码以进行部署，并且调试应用程序也变得越来越困难。在本章中，你将了解有哪些工具可以帮助你构建和打包
    React 应用程序，以及如何使用可用的 Google Chrome 插件来可视化你的 React 组件，从而简化调试。


    ### 14) 为 React 编写测试


    编写测试是确保随着应用程序增长不会在现有工作代码中引入错误的重要部分。编写测试还能帮助你编写更好的代码，因为它鼓励你编写更模块化的代码。本章将指导你如何测试
    React 组件的各个方面。


    ## 使用 React


    最后几章涵盖了使用 React 的重要方面以及你可能未曾考虑过的不同用例。


    ### 15) 架构模式


    React 只提供了“MVC”中的“V”，但它与其他框架和系统的插件非常灵活。本章将指导你如何使用 React 设计更大规模的应用程序。我们将探讨示例 React
    应用程序的结构，以及这种结构如何帮助管理随着项目增长而增加的复杂性。


    ### 16) 不可变性


    React 与不可变数据结构（即永远不会改变且被实例化的数据结构）配合得很好。在本章中，我们将介绍不可变性的好处和代价，并研究三种不同的库，你可以将它们集成到
    React 应用程序中。


    ### 17) React 的其他用途


    React 是一个强大的交互式 UI 渲染库，它提供了一种处理数据和用户输入的绝佳方式。在本章中，我们将探讨如何将 React 用于桌面应用、游戏、电子邮件和图表。


    # 第 2 章 JSX


    在 React 中，组件用于分离关注点，而不是模板和显示逻辑。使用 React 时，你必须接受这样一个理念：标记及其生成代码本质上是紧密相连的。这让你在构建标记时能够拥有
    JavaScript 的全部表达能力，而无需诉诸笨拙或繁琐的模板语言。


