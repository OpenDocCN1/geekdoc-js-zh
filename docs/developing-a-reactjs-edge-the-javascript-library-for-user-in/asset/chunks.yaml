  trans: "\n\n```\n // 用于自动补全的字符串列表\nvar datasource = [...];\n\nclass MyComponent\
    \ extends React.Component {\n  render() {\n    return (\n      <input ... />\n\
        );\n  }\n  componentDidMount() {\n    $(React.findDOMNode(this)).autocomplete({\n\
    \      sources: datasource\n    });\n  }\n});\n```\n\n注意，在服务器端运行时，`componentDidMount`\
    \ 方法不会被调用。\n\n# 生命周期\n\n此时，你的组件已经渲染给用户，用户可以与之交互。通常，这涉及通过点击、触摸或按键事件触发某个事件处理程序。当用户改变组件或整个应用的状态时，新状态会流经组件树，你就有机会对其做出响应。\n\
    \n## componentWillReceiveProps\n\n组件的 props 随时可能通过父组件发生变化。当这种情况发生时，会调用 `componentWillReceiveProps`，你就有机会修改新的\
    \ props 对象并更新状态。\n\n例如，在示例应用中，当用户在不同面板之间导航时，你可以通过从服务器获取相关数据来响应这一变化。\n\n```\n componentWillReceiveProps(nextProps)\
    \ {\n  var boardId = nextProps.params.boardId;\n  if(boardId !== this.props.params.boardId)\
    \ {\n    Actions.State.changeBoard({type: 'board', name: boardId});\n  }\n}\n\
    ```\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 查看我们示例应用（一个调查问卷构建器）的完整源代码。\n\
    \n## shouldComponentUpdate\n\nReact 很快。但你可以通过使用 `shouldComponentUpdate` 来精确优化组件的渲染时机，使其更快。\n\
    \n如果你确定新的 props 或 state 不需要你的组件或其任何子组件重新渲染，则返回 `false`。\n\n*该方法在初始渲染或使用* `forceUpdate`\
    \ *后不会被调用。*\n\n通过返回 `false`，你告诉 React 跳过调用 `render` 以及前后的钩子：`componentWillUpdate`\
    \ 和 `componentDidUpdate`。\n\n这个方法不是必需的，在大多数情况下，你在开发过程中不需要使用它。过早使用此方法可能导致微妙的 bug，因此最好等到你能正确评估瓶颈后再决定在哪里进行优化。\n\
    \n如果你小心地将 state 视为不可变的，并且只在 render 方法中读取 props 和 state，那么可以放心地重写 `shouldComponentUpdate`\
    \ 来比较旧的 props 和 state 与新的替换值。\n\n另一个性能调优选项是 React 附加组件提供的 `PureRenderMixin`。如果你的组件是*纯的*，即对于相同的\
    \ props 和 state 总是渲染相同的 DOM，那么这个 mixin 会自动使用 `shouldComponentUpdate` 对 props 和\
    \ state 进行浅比较，如果它们匹配则返回 `false`。本书后面会介绍使用此 mixin 的示例。\n\n## componentWillUpdate\n\
    \n与 `componentWillMount` 类似，当接收到新的 props 或 state 时，此方法会在渲染之前立即触发。\n\n注意，你*不能*在此方法中更新\
    \ state 或 props。你应该依赖 `componentWillReceiveProps` 在运行时更新 state。\n\n## componentDidUpdate\n\
    \n与 `componentDidMount` 类似，此方法为你提供了更新已渲染 DOM 的机会。\n\n# 卸载与清理\n\n一旦 React 处理完一个组件，它必须从\
    \ DOM 中卸载并销毁。你有一个钩子来响应这一时刻，执行任何必要的清理和拆卸工作。\n\n## componentWillUnmount\n\n最后，当组件从组件层级中移除时，我们迎来了组件生命的终结。此方法在组件即将被移除之前调用，让你有机会进行清理。你在\
    \ `componentDidMount` 中可能执行的任何自定义工作，例如创建定时器或添加事件监听器，都应在此处撤销。否则会导致错误（如果你在已卸载的组件上调用\
    \ `setState`）以及各种类型的泄漏（内存、监听器等）。\n\n# 反模式：将计算值作为状态\n\n考虑到可以在构造函数中从 `this.props`\
    \ 创建状态，有必要指出这里的一种反模式。你应该非常关注维护单一数据源。React 的设计使得重复数据源更加明显，这是 React 的关键优势之一。\n\n\
    当考虑从 props 派生的计算值时，将这些值存储为状态被认为是一种反模式。例如，组件可能在渲染前将日期转换为字符串表示，或将字符串转换为大写。这些不是状态，而应该在渲染时计算。\n\
    \n当你在 render 函数中无法判断状态值是否与它所基于的 prop 同步时，就可以识别出这种反模式。\n\n```\n class Day extends\
    \ React.Component {\n  constructor(props){\n    super();\n    // 反模式。计算值不应存储为状态。\n\
        this.state = {day: props.date.getDay()};\n  }\n  render(){\n    return (\n\
           <div>Day: {this.state.day}</div>\n    );\n  }\n}\n```\n\n正确的模式是在渲染时计算值。这保证了计算值永远不会与它所派生的\
    \ props 不同步。\n\n```\n class Day extends React.Component {\n  render(){\n    return\
    \ (\n      <div>Day: {this.props.date.getDay()}</div>\n    );\n  }\n}\n```\n\n\
    # 总结\n\nReact 的生命周期方法为组件的生命周期提供了设计良好的钩子。作为状态机，每个组件都设计为在其整个生命周期中输出稳定、可预测的标记。\n\n\
    没有组件是孤立存在的。当父组件将 props 推送给子组件，并且这些子组件渲染它们自己的子组件时，你必须仔细考虑数据如何在应用中流动。每个子组件*真正*需要知道多少？谁拥有应用状态？哪些组件（如果有）需要本地状态？这是我们下一章关于数据流的主题。\n\
