    \ won’t serve as an exhaustive resource for JavaScript testing because that deserves\
    \ it’s own book, but we’ll try to provide enough context so you can follow along\
    \ and research specific topics on your own when needed.\n\n# Getting started\n\
    \nYou may be asking, “But I have an amazing QA team focused on testing.  Why should\
    \ I care about testing?  Can’t I just skip this chapter?\"  Great questions! \
    \ The main reason automated testing will help you is not related to bugs or catching\
    \ regressions, but that is a helpful side effect of testing.  The real goal of\
    \ automated testing is that it helps you write *better*code.  More often than\
    \ not, code that is poorly written is hard to test.  So if you start writing your\
    \ tests as you write your code, your tests will encourage you not to write sloppy\
    \ code.  You will be naturally pushed to follow the single responsibility principle\
    \ ^([1](#ch14.html_idm139745264274896)), the law of demeter ^([2](#ch14.html_idm139745264273568)),\
    \ and keeping code in a modular way.\n\nWhen we refer to Test Driven Development,\
    \ or TDD, we are referring to a style of testing that uses a “Red, Green, Refactor”\
    \ process.  First, you write a test that fails (the test is red), then you write\
    \ the application code to make the test pass (the test is green), and then you\
    \ refactor the application code to make it cleaner while keeping the test green.\
    \  It is a process that allows you to work in small batches and each iteration\
    \ gives a positive feeling when the test turns green.\n\n## Types of testing"
