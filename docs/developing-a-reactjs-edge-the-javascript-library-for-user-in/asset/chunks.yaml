    # 前言


    # 什么是 React，为什么要使用它？


    React 是 Facebook 内部开发并于 2013 年开源的一个 JavaScript 库，用于构建交互式 Web 用户界面。它引入了一种处理浏览器
    DOM 的新方式。手动更新 DOM 并费力地跟踪每一块状态的日子已经一去不复返了，这种做法使得可扩展性和新功能开发充其量只是一项冒险的尝试。相反，React
    以一种非常新颖的方式处理 DOM。你可以在任何时间点声明式地定义你的用户界面。React 消除了在数据变化时担心 DOM 的哪一部分需要更新的问题，并让你能够在任何时间点以最少的
    DOM 更改重新渲染整个应用程序。


    # 本书如何提供帮助


    React 引入了令人兴奋的新概念，挑战了当前的实践。本书将帮助你理解所有这些概念，并帮助你理解它们为何有益，以及如何帮助你构建可扩展的单页应用程序（SPA）。


    React 主要关注应用程序的“视图”部分，因此不规定服务器通信或代码组织方式。在本书中，我们将介绍当前的最佳实践和补充工具，以帮助你使用 React 构建完整的应用程序。


    # 阅读本书前需要了解什么？


    为了充分利用本书，你需要具备 JavaScript 和 HTML 的经验。如果你有编写 SPA 的经验（无论使用 Backbone.js、AngularJS
    还是 Ember.js 等框架），那会很有帮助，但并非必需。


    # 源代码和示例应用程序


    在本书中，我们将引用示例应用程序的片段：reddit 克隆版。你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 阅读完整源代码，并在
    [`git.io/vlCUI`](http://git.io/vlCUI) 查看在线演示。


    # 写作过程


    本书是在一两个月内以专注的虚拟书籍冲刺方式写成的。这个过程有助于创作新鲜且当前的内容，而传统书籍往往落后于前沿趋势和技术的报道。


    在第二版中，所有内容都已更新到 React 0.14，并创建了一个新的示例应用程序。


    # 作者


    本书由经验丰富且专注的 JavaScript 开发者团队编写：


    ![Richard Feldman](img/rtfeldman125.png)


    **Richard Feldman** 是 NoRedInk 的首席前端工程师，这是一家位于旧金山的教育科技公司。他是函数式编程爱好者、会议演讲者，以及 *seamless-immutable*
    的作者，这是一个提供与普通 JavaScript 对象和数组向后兼容的不可变数据结构的开源库。他在 Twitter 和 GitHub 上的用户名都是 @rtfeldman。


    * * *


    ![Frankie Bagnardi](img/fbagnardi125.png)


    **Frankie Bagnardi** 是一名高级前端开发人员，为各种客户创建用户体验。在空闲时间，他在 StackOverflow（FakeRainBrigand）和
    IRC（GreenJello）上回答问题，并喜欢做一些小项目。你可以通过 f.bagnardi@gmail.com 联系他。


    * * *


    ![Simon Højberg](img/hojberg125.png)


    **Simon Højberg** 是罗德岛州普罗维登斯 Swipely 公司的高级 UI 工程师。他是 Providence JS 聚会小组的联合组织者，曾任波士顿
    Startup Institute 的 JavaScript 讲师。他致力于使用 JavaScript 构建功能性用户界面，并从事像 cssarrowplease.com
    这样的副项目。Simon 的 Twitter 账号是 [@shojberg](https://twitter.com/shojberg)。


    * * *


    ![Jeremiah Hall](img/HallPic125.jpg)


    **Jeremiah Hall** 目前是 OpenGov Inc. 的高级软件工程师/架构师。他还是 Aspect Apps 的创始人，正在构建一个使用
    React Native 和 JavaScript 作为 UI 的日记应用程序。你可以在 Twitter 上找到他 [@jeremiahrhall](https://twitter.com/jeremiahrhall)。


    # 第 1 章 React 简介


    # 背景


    在 Web 开发的早期，前端代码库很小，JavaScript 功能不足。得益于多年来浏览器在 JavaScript 性能上相互超越、不断突破极限，如今的 Web
    应用能够提供与原生应用相媲美的用户体验。随着 Web 应用变得越来越丰富和雄心勃勃，在保持强大性能的同时扩展 JavaScript 代码库现在比以往任何时候都更具挑战性。


    历史上，许多 JavaScript 库优先考虑性能或代码组织——通过使跨浏览器的高性能 DOM 操作更容易，或提供使代码更易于扩展的组织模式。React 通过同时轻松实现性能提升和代码扩展而迅速流行起来。这种强大的组合使其成为
    GitHub 上最受欢迎的十大库之一。


    React 最初是 Facebook 的一个 PHP 框架 XHP 的移植版本。作为一个 PHP 框架，XHP 被设计为每次请求时渲染整个页面。React
    的诞生是为了将重新渲染整个页面的 PHP 风格工作流引入客户端应用程序。


    React 本质上是一个“状态机”，帮助你管理随时间变化的状态的复杂性。它通过拥有非常狭窄的范围来实现这一点。它只关心两件事：


    1.  更新 DOM


    2.  响应事件


    React 对 AJAX、路由、存储或如何组织数据没有意见。它不是一个模型-视图-控制器框架；如果非要这么说，它只是 MVC 中的 V。这种狭窄的范围让你可以自由地将
    React 集成到各种系统中。事实上，它已被用于在几个流行的 MVC 框架中渲染视图。


    每次状态变化时重新渲染整个页面在 JavaScript 中非常慢，因为读取和更新 DOM 会带来性能损失。React 有一个非常强大的渲染系统，使用虚拟 DOM，使得
    React 只需要更新 DOM 而无需读取 DOM。


    就像高性能的 3D 游戏引擎一样，React 围绕渲染函数构建，这些函数获取世界状态并将其转换为结果页面的虚拟表示。每当 React 被告知状态变化时，它会重新运行这些函数以确定页面的新虚拟表示，然后自动将该结果转换为必要的
    DOM 更改以反映新的呈现。


    乍一看，这听起来应该比通常的按需更新每个元素的 JavaScript 方法更慢。然而，在幕后，React 正是这样做的：它有一个非常高效的算法来确定当前虚拟页面表示与新表示之间的差异。根据这些差异，它对
    DOM 进行最小必要的一组更新。


    这对性能有利的原因在于它最大限度地减少了回流和不必要的 DOM 突变，这两者都是性能不佳的常见原因。


