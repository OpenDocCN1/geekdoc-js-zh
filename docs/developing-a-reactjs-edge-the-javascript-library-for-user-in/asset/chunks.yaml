  trans: "\n\n`<Divider>Questions</Divider>`\n\nReact 会将开闭标签之间的所有子节点捕获到一个特殊的组件属性 `this.props.children`\
    \ 中。在此示例中，`this.props.children == \"Questions\"`。`children` 属性的实际结构并未文档化，因此不要尝试访问其内容，只需原样传递即可。\n\
    \n掌握这一点后，你可以将硬编码的文本“Questions”替换为变量 `this.props.children`。现在，React 将渲染你放置在 `<Divider>`\
    \ 标签内的任何内容。\n\n```\nclass Divider extends React.Component {\n  render() {\n  \
    \  return (\n      <div className=\"divider\">\n        <h2>{this.props.children}</h2><hr\
    \ />\n      </div>\n    );\n  }\n};\n```\n\n现在，你可以像使用任何 HTML 元素一样使用 `<Divider>`\
    \ 组件。\n\n```\n<Divider>Questions</Divider>\n```\n\n当通过 JSX 转换器运行时，上述声明将转换为以下 JavaScript（假设目标为\
    \ ES6）。\n\n```\nclass Divider extends React.Component {\n  render() {\n    return\
    \ (\n      React.createElement(\"div\", {className: \"divider\"}, \n        React.createElement(\"\
    h2\", null, this.props.children), \n        React.createElement(\"hr\", null)\n\
    \      )\n    );\n  }\n};\n```\n\n输出将完全符合你的预期。\n\n```\n<div className=\"divider\"\
    >\n  <h2>Questions</h2><hr />\n</div>\n```\n\n# JSX 与 HTML 有何不同？\n\nJSX 类似 HTML，但它并非\
    \ HTML 语法的完美复制（这是有充分理由的）。事实上，JSX 规范指出：\n\n> 本规范不试图符合任何 XML 或 HTML 规范。JSX 被设计为\
    \ ECMAScript 的一个特性，与 XML 的相似性仅为了熟悉感。^(1)\n\n下面我们探讨 JSX 与 HTML 语法之间的一些关键区别。\n\n\
    ## 属性\n\n在 HTML 中，你以内联方式设置每个节点的属性，如下所示：\n\n```\n<div id=\"some-id\" class=\"some-class-name\"\
    >...</div>\n```\n\nJSX 以相同的方式实现属性，其巨大优势在于你可以将属性设置为动态的 JavaScript 变量。通过将 JavaScript\
    \ 变量包裹在花括号中而不是引号中来实现这一点。\n\n```\nvar surveyQuestionId = this.props.id;\nvar classes\
    \ = 'some-class-name';\n...\n<div id={surveyQuestionId} className={classes}>...</div>\n\
    ```\n\n对于更复杂的情况，你可以将属性设置为函数调用的结果。\n\n```\n<div id={this.getSurveyId()} >...</div>\n\
    ```\n\n现在，每次 React 选择渲染一个组件时，变量和函数调用将被求值，生成的 DOM 将反映这一新状态。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
    \ 阅读我们示例应用（一个调查问卷构建器）的完整源代码。\n\n## 条件判断\n\n在 React 中，组件的标记和生成它的逻辑本质上是紧密相连的。这意味着你可以充分利用\
    \ JavaScript 的全部逻辑能力，例如循环和条件判断。\n\n由于 if/else 逻辑难以用标记表达，因此向组件添加条件逻辑可能会很棘手。将 `if`\
    \ 语句直接添加到 JSX 中会导致无效的 JavaScript：\n\n```\n<div className={if(isComplete) { 'is-complete'\
    \ }}>...</div>\n```\n\n因此，解决方案是使用以下方法之一：\n\n* 使用三元逻辑\n* 设置一个变量并在属性中引用它\n* 将切换逻辑委托给一个函数\n\
    * 使用 `&&` 运算符\n\n以下是一个快速示例，展示每种方法可能的样子。\n\n**使用三元运算符**\n\n```\n...\nrender() {\n\
    \  return (\n    <div \n      className={this.state.isComplete ? 'is-complete'\
    \ : ''}\n    >\n      ...\n    </div>\n  );\n}\n...\n```\n\n虽然三元运算符在文本处理中效果很好，但当你想在两种情况下使用\
    \ React 组件时，它可能变得繁琐且难以阅读。对于这些情况，最好使用以下方法。\n\n**使用变量**\n\n```\n...\ngetIsComplete()\
    \ {\n  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  var\
    \ isComplete = this.getIsComplete();\n  return (\n    <div className={isComplete}>...</div>\n\
    \  );\n}\n...\n```\n\n**使用函数调用**\n\n```\n...\ngetIsComplete() {\n  return this.state.isComplete\
    \ ? 'is-complete' : '';\n}\nrender() {\n  return (\n    <div className={this.getIsComplete()}>...</div>\n\
    \  );\n}\n...\n```\n\n**使用双与（`&&`）运算符**\n\n由于 React 不会为 `null` 或 `false` 值输出任何内容，你可以使用一个布尔值，后跟所需的输出字符串。如果布尔值求值为\
    \ `true`，则将使用后面的字符串。\n\n```\nrender() {\n  return (\n    <div className={this.state.isComplete\
    \ && 'is-complete'}>\n      ...\n    </div>\n  );\n}\n```\n\n# 非 DOM 属性\n\nJSX\
    \ 中存在以下特殊属性名称：\n\n* `key`\n* `ref`\n* `dangerouslySetInnerHTML`\n\n下面我们将详细探讨它们。\n\
    \n**键（Keys）**\n\n`key` 是一个可选的唯一标识符。项目或列表可能相对于它们的兄弟节点发生变化，例如当用户执行搜索或列表中的项目被添加、删除或重新排序时。发生这种情况时，你的组件可能会被不必要地销毁和重新创建，或者\
    \ React 可能执行幼稚的更新。\n\n通过在组件上设置一个在渲染过程中保持一致的唯一键，你可以告知 React，使其更智能地决定何时重用或销毁组件，从而提高渲染性能。然后，当\
    \ DOM 中已有的两个项目交换位置时，React 可以匹配键并移动它们，而无需完全重新渲染它们的 DOM。\n\n**引用（References）**\n\
    \n`ref` 允许父组件在渲染函数之外保留对子组件的引用。\n\n你可以在 JSX 中通过将属性设置为所需的引用名称来定义 `ref`。\n\n```\n\
    ...\nrender() {\n  return <div>\n    <input ref=\"myInput\" ... />\n  </div>;\n\
    }\n...\n```\n\n之后，你可以在组件中的任何位置使用 `this.refs.myInput` 来访问此 ref。对于像 input 这样的 DOM\
    \ 组件，ref 就是相关的 DOM 节点。对于复合组件，ref 是组件实例。在实践中，你很少会在 React 中使用 refs，它们充当了从 React\
    \ 声明式特性中逃逸的出口。\n\n更多细节请参见第 6 章中关于父/子关系与所有权关系的讨论。\n\n**设置原始 HTML**\n\n`dangerouslySetInnerHTML`\
    \ —— 有时你需要将 HTML 内容设置为字符串，尤其是在处理通过字符串操作 DOM 的第三方库时。为了提高 React 的互操作性，此属性允许你使用 HTML\
    \ 字符串，但如果可以避免，不建议使用。要使用此属性，请将其设置为一个包含 `__html` 键的对象，如下所示：\n\n```\n...\nrender()\
    \ {\n  var htmlString = {\n    __html: \"<span>an html string</span>\"\n  };\n\
    \  return <div dangerouslySetInnerHTML={htmlString} ></div>;\n}\n...\n```\n\n\
    # dangerouslySetInnerHTML\n\n`dangerouslySetInnerHTML` 可能很快会发生变化，如下所述：\n\n[`github.com/facebook/react/issues/2134`](https://github.com/facebook/react/issues/2134)\n\
    \n[`github.com/facebook/react/pull/1515`](https://github.com/facebook/react/pull/1515)\n\
    \n## 事件\n\n事件名称在所有浏览器中都被规范化，并以驼峰式表示。例如，`change` 变为 `onChange`，`click` 变为 `onClick`。在\
    \ JSX 中捕获事件就像将属性分配给组件上的方法一样简单。\n\n```\n...\nhandleClick(event) {...}\nrender()\
    \ {\n  return (\n    <div \n      onClick={(e) => this.handleClick(e)}\n    >\n\
    \      ...\n    </div>\n  );\n}\n...\n```\n\n注意，这里使用了箭头函数，因为它保留了 `this`。否则，`this`\
    \ 在 `handleClick` 中将是未定义的。它还让你可以轻松控制传递给函数的参数。\n\n有关 React 事件系统的更多详细信息，请参考第 9 章。\n\
    \n## 注释\n\nJSX 是 JavaScript，因此你可以在 JSX 标记中添加普通的 JavaScript 注释。注释可以添加在两个位置：\n\n\
    1. 作为元素的子节点\n2. 内联在节点的属性中\n\n**作为子节点**\n\n"
- fmt: "\nChild-node comments are simply wrapped in curly brackets, and they can span\
    \ multiple lines.\n\n```\n <div>\n  {/* a comment about this input\n      with\
    \ multiple lines */}\n  <input name=\"email\" placeholder=\"Email Address\" />\n\
    </div>\n```\n\n## Special attributes\n\nBecause JSX transforms to plain JavaScript\
    \ function calls, there are a few keywords you can’t use: `class` and `for`. \
    \ \n\nTo create a form label with the `for` attribute use `htmlFor`.\n\n```\n\
    \ <label htmlFor=\"for-text\" ... >\n```\n\nTo render a custom `class` use `className`.\
    \ This might seem odd if you’re used to HTML, but it is more consistent with vanilla\
    \ JavaScript, where you can access the class of an element using `elem.className`.\n\
    \n```\n <div className={classes} ... >\n```\n\n## Styles\n\nLastly, let’s examine\
    \ the inline style attribute. React normalizes all styles to camelCased names,\
    \ consistent with the DOM style JavaScript property.\n\nTo define a custom style\
    \ attribute, simply pass a JavaScript object with camelCase property names and\
    \ the desired CSS values.\n\n```\n var styles = {\n  borderColor: \"#999\",\n\
      borderThickness: \"1px\"\n};\nReact.renderComponent(<div style={styles}>...</div>,\
    \ node);\n```\n\n# React without JSX\n\nAll JSX markup is eventually transformed\
    \ into plain JavaScript. So JSX is not *necessary* for using React. However, JSX\
    \ hides some complexity. If you’re going to use React without it, you need to\
    \ know the three parts to creating an element in React:\n\n1.  Defining the component\
    \ class\n2.  Creating a factory for producing instances of the component class\n\
    3.  Using the factory to create `ReactElement` instances\n\n## Creating React\
    \ elements\n\nRecall above how we defined a `Divider` component class. Here it\
    \ has been renamed to `DividerClass` to clarify its purpose.\n\n```\n class DividerClass\
    \ extends React.Component\n  render() {\n    return (\n      React.createElement(\"\
    div\", {className: \"divider\"}, \n        React.createElement(\"h2\", null, this.props.children), \n\
            React.createElement(\"hr\", null)\n      )\n    );\n  }\n});\n```\n\n\
    To use this `DividerClass` without JSX, call `React.createElement` or `React.createFactory`.\n\
    \nTo create the element directly simply call `createElement`.\n\n```\n var divider\
    \ = React.createElement(DividerClass, null, 'Questions');\n```\n\nTo create a\
    \ factory, first use the `createFactory` function.\n\n```\n var Divider = React.createFactory(DividerClass);\n\
    ```\n\nNow that you have a factory function you’re free to create a `ReactElement`\
    \ from it.\n\n```\n var divider = Divider(null, 'Questions');\n```\n\n## Further\
    \ reading and references\n\nEven if you don’t like the idea of markup in your\
    \ JavaScript, hopefully you can now appreciate how JSX offers a solution to the\
    \ intimate relationship between your JavaScript and the markup it renders. Its\
    \ growing popularity has earned JSX its own spec, offering a deep technical definition.\
    \ There are a few tools to help you experiment with it if you’re still uncertain\
    \ or confused about how it works.\n\n### The official JSX spec\n\nIn September\
    \ of 2014 Facebook released [an official spec for JSX](http://facebook.github.io/jsx/),\
    \ stating its rationale for creating JSX, along with technical details of the\
    \ syntax.\n\nYou can read more at [http://facebook.github.io/jsx/](http://facebook.github.io/jsx/).\n\
    \n### In-browser experimenting\n\nThere are also a number of tools for experimenting\
    \ with JSX. The React docs [Getting](http://facebook.github.io/react/docs/getting-started.html)\
    \ [Started](http://facebook.github.io/react/docs/getting-started.html) page links\
    \ to JSFiddle playgrounds with and without JSX.\n\n[http://facebook.github.io/react/docs/getting-started.html](http://facebook.github.io/react/docs/getting-started.html)\n\
    \nFor actual projects, the official tool is babel, which also provides nearly\
    \ full ES6 support.\n\n[https://babeljs.io/](https://babeljs.io/)\n\nIn the next\
    \ chapter we will explore the component lifecycle in React.\n\n^([1](#ch02.html_idm139745275222416-marker))\
    \ Retrieved from http://facebook.github.io/jsx/\n\n# Chapter 3. Component lifecycle\n\
    \nThroughout a component’s lifecycle, as its props or state change, its DOM representation\
    \ might change too. A component is a state machine; for a given input it will\
    \ always return the same output. \n\nReact provides lifecycle hooks for a component\
    \ to respond to various moments—its creation, lifetime, and teardown. We’ll cover\
    \ them here, in the order of their appearance—first through instantiation, and\
    \ then through the components life, and finally as the component is torn-down.\n\
    \n## Lifecycle methods\n\nReact components have a minimal lifecycle API, offering\
    \ only what you need without being overwhelming. Let’s take a look at each method\
    \ in the order they get called on your component.\n\n**Instantiation**\n\nThe\
    \ lifecycle methods that are called the first time an instance is created, compared\
    \ to each subsequent instance, varies slightly. For your first use of a component\
    \ class you’ll see these methods called, in order:\n\n*   `constructor`\n*   `componentWillMount`\n\
    *   `render`\n*   `componentDidMount`\n\n**Lifetime**\n\nAs the app state changes\
    \ and your component is affected, you will see the following methods called, in\
    \ order:\n\n*   `componentWillReceiveProps`\n*   `shouldComponentUpdate`\n*  \
    \ `componentWillUpdate`\n*   `render`\n*   `componentDidUpdate`\n\n**Teardown\
    \ & cleanup**\n\nAnd lastly, when you are finished with the component, you will\
    \ see `componentWillUnmount` called, giving your instance the opportunity to clean-up\
    \ after itself.\n\nNow, we’ll cover each of these three stages in turn: instantiation,\
    \ lifetime, and cleanup.\n\n## Instantiation\n\nAs each new component is created\
    \ and first rendered, there are a series of methods you can use to setup and prepare\
    \ your components. Each of these methods has a specific responsibility, as described\
    \ here.\n\n### `constructor(props, context)`\n\nThe constructor allows you to\
    \ set up instance properties and state for you component. A typical constructor\
    \ looks like this:\n\n```\n class Foo extends React.Component {\n  constructor(props){\n\
        super(); // call the parent constructor, required\n    this.state = {x: 'y'};\n\
      }\n  render(){ ... }\n}\n```\n\n### `componentWillMount`\n\nInvoked immediately\
    \ before the initial render. This is the last chance to affect the component state\
    \ before the `render` method is called. This is just mentioned for completeness;\
    \ it’s a relic of `createClass`, which is now replaced by the constructor.\n\n\
    ### `render`\n\nHere you build the virtual DOM that represents your components\
    \ output. Render is the only required method for a component and has specific\
    \ rules. The requirements of the `render` method are as follows:\n\n*   The only\
    \ data it can access is `this.props` and `this.state`.\n*   You can return `null`,\
    \ `false`, or any React element.\n*   There can only be one top-level element\
    \ (you cannot return an array of elements).\n*   It must be *pure*, meaning it\
    \ does not change the state or modify the DOM output.\n\nThe result returned from\
    \ render is not the actual DOM, but a virtual representation that React will later\
    \ diff with the real DOM to determine if any changes must be made.\n\n### `componentDidMount`\n\
    \nAfter the render is successful and the actual DOM has been rendered, you can\
    \ access it inside of `componentDidMount` via `act.findDOMNode(this)`, or by using\
    \ a ref.\n\nThis is the lifecycle hook you will use to access the raw DOM. For\
    \ example, if you need to measure the height of the rendered output, manipulate\
    \ it using timers, or run a custom jQuery plugin, since this is where you’d hook\
    \ into.\n\nFor example, say you want to use the jQuery UI Autocomplete plugin\
    \ on a React rendered input element. You can attach the plugin like this: \n"
