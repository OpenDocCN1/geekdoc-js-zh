  trans: "\n\n利用对表单组件焦点的控制，是引导用户了解表单中下一步逻辑操作的绝佳方式。这也有助于减少用户交互，提升可用性。其优点将在下一节中进一步讨论。\n\
    \n由于 React 表单并非总是在浏览器加载时渲染，因此表单输入的自动聚焦需要以略有不同的方式运作。React 实现了 `autoFocus`，这样当组件首次挂载时，如果其他表单输入没有获得焦点，React\
    \ 就会将焦点置于该输入上。这正是你期望的带有 `autoFocus` 的简单 HTML 表单的工作方式。\n\n```\n //jsx\n<input type=\"\
    text\" name=\"given_name\" autoFocus=\"true\" />\n```\n\n你也可以通过调用 `DOMNode` 上的\
    \ `focus()` 来手动设置表单字段的焦点。\n\n# 可用性\n\nReact 在提升开发者生产力方面非常出色，但这也有其弊端。\n\n很容易创建出缺乏可用性的组件。例如，你可能拥有键盘支持很少的表单，只能通过点击超链接的\
    \ `onClick` 来提交表单。这阻止了用户按键盘上的 `enter` 键来提交表单，而这是 HTML 表单的默认行为。\n\n同样也很容易创建出高度可用的优秀组件。在构建组件时需要投入时间和思考。正是那些细微之处帮助组件变得高度可用且感觉恰到好处。\n\
    \n以下是创建可用表单的最佳实践集合。它们并非 React 所特有。\n\n## 清晰传达你的要求\n\n良好的沟通在应用程序的各个方面都很重要，尤其是在表单中。\n\
    \n使用 HTML 标签是向用户传达表单元素期望内容的绝佳方式。这些标签也为用户提供了一种与表单元素交互的额外方式，例如对于单选按钮和复选框等输入类型。\n\
    \n占位符旨在显示示例输入或未输入数据时的默认值。曾经有一种潮流是将验证提示放在占位符中。这可能相当成问题，因为当用户开始输入时，他们的验证提示就消失了。通常更好的做法是将验证提示显示在输入框旁边，或者在验证要求未满足时以弹出框的形式显示。\n\
    \n## 持续提供反馈\n\n这延续了清晰传达要求的原则。尽快向用户提供反馈非常重要。\n\n验证错误是持续提供反馈的完美例子。众所周知，在错误发生时显示验证错误能提升表单的可用性。在早期\
    \ Web 应用时代，所有用户都必须等到填写完表单才能知道是否输入正确。浏览器中的验证是可用性方面的一次巨大飞跃。提供验证错误反馈的理想时机是在输入框的 `blur`（失去焦点）事件上。\n\
    \n向用户表明你正在处理他们的请求也很重要。对于可能需要一些时间才能完成的操作尤其如此。显示旋转加载图标、进度条、通知消息等，是告知用户你的应用程序没有冻结的好方法。用户有时非常不耐烦，但如果他们知道你的应用程序正在处理他们的请求，他们也可以变得有耐心。\n\
    \n过渡和动画是告知用户应用程序中正在发生什么的另一种好方法。它们是另一种视觉提示，表明应用程序中的某些内容已发生变化。请参阅第 10 章，了解如何在 React\
    \ 中利用这一点。\n\n## 快速响应\n\nReact 拥有非常强大的渲染引擎。它有助于你的应用程序开箱即用，速度相当快。然而，有时更新 DOM 的速度并不是拖慢应用程序的原因。\n\
    \n过渡就是一个完美的例子。长时间运行的过渡可能会让用户感到沮丧，因为他们被迫等待过渡完成才能继续使用应用程序。\n\n应用程序之外的其他因素也会改变应用程序的运行速度，例如长时间运行的\
    \ AJAX 调用和糟糕的网络性能。如何解决这类问题可能非常依赖于你的应用程序，并且可能超出你的控制范围，例如第三方服务。在这些情况下，更重要的是向用户反馈他们请求的状态。\n\
    \n请记住，速度是相对的。这是用户的一种感知。看起来快比实际快更重要。例如，当用户在应用程序中点击“喜欢”时，你可以在向服务器发送 AJAX 调用之前增加点赞计数。这样，如果\
    \ AJAX 调用花费很长时间，用户就不会看到延迟。然而，这可能会导致处理错误时的其他问题。\n\n## 可预测\n\n用户对事物如何运作有预先设定的想法。这基于他们以往的经验。在大多数情况下，他们的以往经验**并非**来自使用你的应用程序。\n\
    \n如果你的应用程序类似于用户所在的平台，用户就会期望你的应用程序符合该平台的默认行为。\n\n考虑到这一点，你有两个选择。你可以遵循平台的默认行为，或者彻底改变你的用户界面，使其不再像该平台。\n\
    \n一致性是另一种形式的可预测性。如果你的交互在应用程序的不同部分始终相同，用户就会学会预测新部分中的交互。这与遵循应用程序所运行平台的行为密切相关。\n\n\
    ## 可访问性\n\n开发者和设计者在创建用户界面时常常忽视可访问性。在考虑用户界面的各个方面时，牢记用户非常重要。如前所述，用户对事物如何运作有预先设定的期望，这基于*他们*的过往经验。\n\
    \n他们的过往经验也决定了他们对不同输入类型的偏好。在某些情况下，用户在使用特定输入设备（如键盘或鼠标）时可能存在身体上的困难。他们也可能在使用输出设备（如显示器或扬声器）时遇到问题。\n\
    \n为所有不同类型的输入和输出设备构建支持可能并不适用于应用程序的每个方面。了解用户的需求和偏好，然后优先处理这些领域非常重要。\n\n测试应用程序可访问性的一个好方法是尝试仅通过一种输入设备（键盘/鼠标/触摸屏）来导航你的应用程序。这将突出显示该设备的可用性问题。\n\
    \n你还可能需要考虑如果视力受损，如何与应用程序交互。屏幕阅读器是视力障碍人士的眼睛。\n\nHTML5 有一个可访问的富互联网应用程序（ARIA）规范，它提供了一种方法来添加辅助技术（如屏幕阅读器）所需的缺失语义。这允许你提示\
    \ UI 组件的 `role`，在屏幕阅读器激活时隐藏或显示元素，以及更多功能。\n\n有一些很好的工具可以帮助提高应用程序的可访问性，例如 Google\
    \ Chrome 的 Accessibility Developer Tools。\n\n## 减少用户输入\n\n减少用户需要输入的数据量是提升应用程序可用性的好方法。用户需要输入的信息越少，他们犯错的机会就越少，需要思考的东西也越少。\n\
    \n与**快速响应**一样，用户感知很重要。用户面对包含许多输入字段的大型表单会感到畏惧，因此他们的思维难以应对。将表单分解成更小、更易于管理的块，会给人一种用户输入更少的印象。这反过来使用户能够更专注于他们的数据输入。\n\
    \n"
- fmt: "\n`Autofill` is another great way to reduce data input. Leveraging the users’\
    \ browser autofill data can save the user from re-entering common information\
    \ like their address or payment details. This is achieved by using standard names\
    \ on your inputs.\n\n`Autocomplete` can help guide your users as they are entering\
    \ information, this ties in with giving constant feedback. When searching for\
    \ a movie, for example, autocomplete can help alleviate issues with bad spelling\
    \ of the movie title.\n\nAnother useful way to reduce input is to derive information\
    \ from previously entered data. For example, if a user is entering credit card\
    \ details, you can look at the first 4 numbers and determine what type of card\
    \ it is, and then select the card type for your user. This both reduces input\
    \ and provides validation feedback to the user that they are typing their card\
    \ number correctly.\n\n`Autofocus` is a small, but very effective way to increase\
    \ usability of your forms. Autofocus helps to guide your user to a starting point\
    \ for their data entry. This saves them from trying to work that out on their\
    \ own. This small tool can really have a large impact on how quickly your users\
    \ can start entering data.\n\n# Summary\n\nReact helps you manage the state of\
    \ your forms by bringing the state management out of the DOM into your components.\
    \ This allows you to have tighter control over how the form elements operate and\
    \ create complex components to use in your applications.\n\nForms are one of the\
    \ most complex interactions your users will encounter in your applications. It\
    \ is important to keep the usability of your forms in mind when creating and composing\
    \ your form components.\n\nNext up you will learn how to animate your React components\
    \ to create more engaging applications.\n\n# Chapter 10. Animations\n\nNow that\
    \ you can compose a complex set of React components, it’s time to add some polish.\
    \ Animation can make user experiences feel more fluid and natural, and React’s\
    \ Transition Groups addon, in conjunction with CSS3, make incorporating animated\
    \ transitions into your React project easy to do.\n\nHistorically, animation in\
    \ browsers has had a very imperative API. You would take an element and actively\
    \ move it around or alter its styles in order to animate it. This approach is\
    \ at odds with React’s rendering and re-rendering of components, so instead React\
    \ takes a more declarative approach.\n\nCSS Transition Groups facilitate applying\
    \ CSS animations to transitions, by strategically adding and removing classes\
    \ during appropriately timed renders and re-renders. This means the only task\
    \ you are left with is to specify the appropriate CSS styles for those classes.\n\
    \nInterval Rendering gives you more flexibility and control, at a cost to performance.\
    \ It requires many more re-renderings, but allows you to animate more than just\
    \ CSS, such as scroll position and Canvas drawing.\n\n# CSS Transition Groups\n\
    \nIn this example we’ll animate our example app comment editing pane in and out.\
    \ `editingPane` will either be a react element or null.\n\n```\n<ReactCSSTransitionGroup\
    \ \n  transitionName='EditingPaneTransition'\n  transitionEnterTimeout={300}\n\
    \  transitionLeaveTimeout={1200}\n>\n  {editingPane}\n</ReactCSSTransitionGroup>\n\
    ```\n\nThis `ReactCSSTransitionGroup` component comes from an addon, which is\
    \ included near the top of the file with `var ReactCSSTransitionGroup = require('react-addons-css-transition-group')`.\n\
    \nThis automatically takes care of re-rendering the component at appropriate times,\
    \ and altering the transition group’s class in order to facilitate styling it\
    \ situationally based on where it is in the transition.\n\nYou can read the full\
    \ source code of our example application at: [http://git.io/vlcpa](http://git.io/vlcpa).\n\
    \n## Styling transition classes\n\nBy convention, the `transitionName='EditingPaneTransition'`\
    \ attribute connects this element to four CSS classes: `EditingPaneTransition-enter`,\
    \ `EditingPaneTransition-enter-active`, `EditingPaneTransition-leave`, and `EditingPaneTransition-leave-active`.\
    \ The `CSSTransitionGroup` addon will automatically add and remove these classes\
    \ as child components to enter or leave the `ReactCSSTransitionGroup` component.\n\
    \nHere’s an example of the CSS.\n\n```\n.EditingPaneTransition-enter {\n  transform:\
    \ scale(1.2);\n  transition: transform 0.3s cubic-bezier(.97,.84,.5,1.21);\n}\n\
    \n.EditingPaneTransition-enter-active {\n  transform: scale(1);\n}\n\n.EditingPaneTransition-leave\
    \ {\n  transform: translateY(0);\n  opacity: 0;\n  transition: opacity 1.2s, transform\
    \ 1s cubic-bezier(.52,-0.25,.52,.95);\n}\n\n.EditingPaneTransition-leave-active\
    \ {\n  opacity: 0;\n  transform: translateY(-100%);\n}\n```\n\n## The transition\
    \ lifecycle\n\nThe difference between `EditingPaneTransition-enter` and `EditingPaneTransition-enter-active`\
    \ is that the `EditingPaneTransition-enter` class is applied as soon as the component\
    \ is added to the group, and the `EditingPaneTransition-enter-active` class is\
    \ applied on the next tick. This allows you to easily specify the beginning style\
    \ of the transition, the end style of the transition, and how to perform the transition.\n\
    \nBy default, the transition groups enable both the enter and leave animations,\
    \ but you can disable either or both by adding the `transitionEnter={false}` or\
    \ `transitionLeave={false}` attributes to the component. In addition to giving\
    \ you control over which of the two you want, you can also use them to situationally\
    \ disable animations altogether based on a configurable value, like so:\n\n```\n\
    <ReactCSSTransitionGroup \n  transitionName='EditingPaneTransition'\n  transitionEnter={this.props.enableAnimations}\n\
    \  transitionLeave={this.props.enableAnimations}\n  // ...\n>\n  {questions}\n\
    </ReactCSSTransitionGroup>\n```\n\n# Transition Group pitfalls\n\nThere are two\
    \ important pitfalls to watch out for when using transition groups.\n\nFirst,\
    \ the transition group will defer removing child components until animations complete.\
    \ This means that if you wrap a list of components in a transition group, but\
    \ do not specify any CSS for the `transitionName` classes, those components can\
    \ no longer be removed, even if you try stop rendering them!\n\nSecond, transition\
    \ group children must each have a unique `key` attribute set. The transition group\
    \ uses these values to determine when components are entering or leaving the group,\
    \ so animations can fail to run and components could become impossible to remove\
    \ if they are missing their `key` attributes.\n\nNote that even if the transition\
    \ group only has a single child, it must still have a `key` attribute.\n\n# Interval\
    \ rendering\n\nYou can get great performance and concise code out of CSS3 animations,\
    \ but they are not always the right tool for the job. Sometimes you have to target\
    \ older browsers, which do not support them. Other times you want to animate something\
    \ other than a CSS property, such as scroll position or a Canvas drawing. In these\
    \ cases Interval Rendering will accommodate your needs, but at a cost to performance\
    \ compared to CSS3 animations.\n\nThe basic idea behind Interval Rendering is\
    \ to periodically trigger a component state update that specifies how far the\
    \ animation has progressed across its total running time. By incorporating this\
    \ state value into a component’s render function, the component can represent\
    \ the appropriate stage of the animation each time the state change causes it\
    \ to re-render.\n\nSince this approach involves many re-renderings, it’s typically\
    \ best to use it in conjunction with `requestAnimationFrame` in order to avoid\
    \ unnecessary renders. However, in environments where `requestAnimationFrame`\
    \ is unavailable or otherwise undesirable, falling back on the less-predictable\
    \ `setTimeout` can be the only alternative.\n\n## Interval rendering with requestAnimationFrame\n"
