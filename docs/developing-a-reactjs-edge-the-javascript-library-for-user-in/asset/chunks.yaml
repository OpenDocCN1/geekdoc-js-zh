- fmt: "\nReact works well with an optional markup syntax, and is remarkably similar\
    \ to HTML. But before proceeding, let’s get one thing out of the way—for those\
    \ put-off by the apparent awkwardness of markup in JavaScript, and for those not\
    \ convinced of JSX’s usefulness, consider the many benefits of this approach within\
    \ React:\n\n*   It allows for familiar markup to define the element tree\n*  \
    \ Provides a more semantic, easier to understand markup\n*   It is easier to visualize\
    \ the structure of your application\n*   It abstracts the creation of React Elements\n\
    *   It keeps markup and the code that generates it close at hand\n*   It’s plain\
    \ JavaScript\n\nIn this chapter we’ll explore the many benefits of JSX, and how\
    \ to use it, along with some of the gotchas separating it from HTML. Remember,\
    \ JSX is optional. If you choose not to employ JSX, you can skip to the end of\
    \ the chapter for tips on using React without it.\n\nIn this book, the latest\
    \ version of JavaScript, ES6 (or ES2015) will be used. You can find a good introduction\
    \ to it here: [https://babeljs.io/docs/learn-es2015/](https://babeljs.io/docs/learn-es2015/).\n\
    \n# What is JSX?\n\nJSX stands for JavaScript XML—an XML-like syntax for constructing\
    \ markup within React components. React works without JSX, however embracing it\
    \ can make your components more readable, and so it is recommended.\n\nFor example,\
    \ a function call in plain React to create a header might look like this.\n\n\
    ```\nReact.createElement('h1', {className: 'question'}, 'Questions');\n```\n\n\
    But with JSX it becomes much more familiar and a terse looking markup.\n\n```\n\
    <h1 className=\"question\">Questions</h1>\n```\n\nCompared to past attempts at\
    \ embedding markup in JavaScript, there are a few distinguishing characteristics\
    \ that set JSX apart.\n\n1.  JSX is a syntactic transform—each JSX node maps to\
    \ a JavaScript function.\n2.  JSX neither provides nor requires a runtime library.\n\
    3.  JSX doesn’t alter or add to the semantics of JavaScript—it’s just simple function\
    \ calls.\n\nThe similarity of JSX to HTML is what gives it so much expressive\
    \ power within React. Here we’ll discuss the benefits of JSX and its purpose within\
    \ an application, as well as the key differences between JSX and HTML.\n\n# Benefits\
    \ of JSX\n\nA question many ask when considering JSX is why? Why use it at all\
    \ when there are plenty of existing templating languages? Why not use plain JavaScript\
    \ instead? After all, JSX simply maps to JavaScript functions.\n\nThere are many\
    \ benefits to using JSX, and they become more pertinent the larger your code base\
    \ grows and the more complex your components become. Let’s discuss some of these\
    \ benefits now.\n\n## Familiarity\n\nMany development teams include non-developers,\
    \ from UI and UX designers who are familiar with HTML, to quality-assurance teams\
    \ responsible for thoroughly testing the product. These team members can more\
    \ easily read and contribute code to a JSX project. Anyone with a familiarity\
    \ with XML-based languages can easily adopt JSX.\n\nIn addition, because React\
    \ components capture all possible representations of your DOM (more about this\
    \ later), JSX makes a great way to represent and visualize this structure in a\
    \ compact and succinct way.\n\n## Semantics\n\nAlong with familiarity, JSX transforms\
    \ your JavaScript code into more semantic, meaningful markup. This offers you\
    \ the benefit of declaring your component structure and information flow using\
    \ an HTML-like syntax, knowing it will transform into plain JavaScript later.\n\
    \nJSX allows you to use all of the predefined HTML5 tag names alongside your own\
    \ custom components within your application’s markup. You’ll read about defining\
    \ custom components later, so here you’ll simply see how JSX can make your JavaScript\
    \ more readable.\n\nAs an example, let’s consider a `Divider` element that renders\
    \ a header on the left and a horizontal-divider that stretches to fill the right.\
    \ The JSX for this divider looks like this:\n\n```\n<div className=\"divider\"\
    >\n  <h2>Questions</h2><hr />\n</div>\n```\n\nAfter wrapping this in a `Divider`\
    \ React component you can use it like you would any other HTML element, with the\
    \ added benefit of markup with richer semantics.\n\n```\n<Divider>Questions</Divider>\n\
    ```\n\n## Easy to visualize\n\nJSX makes even small examples like these clearer\
    \ and more concise. In larger projects with hundreds of components and deep markup\
    \ trees, however, the benefit is magnified.\n\nHere is the `Divider` component\
    \ mentioned above. Notice that within the context of a JavaScript function the\
    \ markup’s intent is more clear and readable than the plain JavaScript version.\n\
    \nHere is the plain JavaScript:\n\n```\nrender: function () {\n  return React.createElement('div',\
    \ {className:\"divider\"},\n    \"Label Text\",\n    React.createElement('hr')\n\
    \  );\n}\n```\n\nHere is the JSX markup:\n\n```\nrender: function () {\n  return\
    \ (\n    <div className=\"divider\">\n      Label Text<hr />\n    </div>\n  );\n\
    }\n```\n\nMost agree that the JSX markup is easier to understand and easier to\
    \ debug.\n\n## Separation of concerns\n\nLastly, core to React, is the idea that\
    \ markup and the code that generates it are inherently tied together. In React\
    \ you do not separate the technologies of your application into a view and a template\
    \ file. Rather, React encourages you to create discrete components, encapsulating\
    \ all of the logic and the markup in one definition.\n\nJSX provides a clean and\
    \ concise way of keeping the markup of your component separate from the business\
    \ logic. Not only does it provide a clean visual language for describing a component\
    \ tree, but it makes your application easier to reason about.\n\n# Composite components\n\
    \nNow that you’ve discovered some of the benefits of JSX and seen how it can be\
    \ used to express a component in a compact markup format, let’s look at how it\
    \ helps assemble multiple components.\n\nThis section covers:\n\n*   Setting up\
    \ a JavaScript file that contains JSX\n*   Walking you through the assembly of\
    \ a component\n*   Discussing component ownership and the parent/child relationship\n\
    \nLet’s look at each in turn.\n\n## Defining a custom component\n\nContinuing\
    \ with the aforementioned page divider, here again is the HTML we desire as output.\n\
    \n```\n<div class=\"divider\">\n  <h2>Questions</h2><hr>\n</div>\n```\n\nTo express\
    \ this HTML as a React component, just wrap it like the following so that the\
    \ `render` function returns the markup (with some minor changes explained below).\n\
    \n```\nclass Divider extends React.Component {\n  render() {\n    return (\n \
    \     <div className=\"divider\">\n        <h2>Questions</h2><hr />\n      </div>\n\
    \    );\n  }\n};\n```\n\nOf course this is currently a single-use component. To\
    \ be truly useful you need the ability to express the text within the `h2` tag\
    \ dynamically.\n\n## Dynamic values\n\nJSX renders dynamic values between curly\
    \ brackets `{...}`. The brackets signal a JavaScript context—anything you put\
    \ between them will be evaluated and the results rendered as nodes in the markup.\n\
    \nFor simple values, such as text or numbers, you can simply refer to the variable.\
    \ You can render a dynamic `h2` tag like this:\n\n```\nvar text = 'Questions';\n\
    <h2>{text}</h2>\n\n// <h2>Questions</h2>\n```\n\nFor more complex logic you may\
    \ wish to offload the calculations into a function. You can render the result\
    \ of this function by calling it within the brackets:\n\n```\nfunction dateToString(d)\
    \ {\n  return [\n    d.getFullYear(), \n    d.getMonth() + 1, \n    d.getDate()\n\
    \  ].join('-');\n};\n\n<h2>{dateToString(new Date())}</h2>\n\n// <h2>2014-10-18</h2>\n\
    ```\n\nReact will automatically evaluate arrays by rendering each item in the\
    \ array as a node.\n\n```\nvar text = ['hello', 'world'];\n<h2>{text}</h2>\n\n\
    // <h2>helloworld</h2>\n```\n\nOften you may wish to render more than simple values.\
    \ For example, you may want to render an array of data as `<li>` elements. This\
    \ brings us to the idea of child nodes.\n\n## Child nodes\n\nIn HTML you render\
    \ a header using `<h2>Questions</h2>`, where the text “Questions” became a child\
    \ text-node of the `h2` element. So the goal here is to express the divider in\
    \ JSX, like this:\n"
  raw: "React works well with an optional markup syntax, and is remarkably similar\
    \ to HTML. But before proceeding, let’s get one thing out of the way—for those\
    \ put-off by the apparent awkwardness of markup in JavaScript, and for those not\
    \ convinced of JSX’s usefulness, consider the many benefits of this approach within\
    \ React:\n\n*   It allows for familiar markup to define the element tree\n\n*\
    \   Provides a more semantic, easier to understand markup\n\n*   It is easier\
    \ to visualize the structure of your application\n\n*   It abstracts the creation\
    \ of React Elements\n\n*   It keeps markup and the code that generates it close\
    \ at hand\n\n*   It’s plain JavaScript\n\nIn this chapter we’ll explore the many\
    \ benefits of JSX, and how to use it, along with some of the gotchas separating\
    \ it from HTML. Remember, JSX is optional. If you choose not to employ JSX, you\
    \ can skip to the end of the chapter for tips on using React without it.\n\nIn\
    \ this book, the latest version of JavaScript, ES6 (or ES2015) will be used. You\
    \ can find a good introduction to it here: [https://babeljs.io/docs/learn-es2015/](https://babeljs.io/docs/learn-es2015/).\n\
    \n# What is JSX?\n\nJSX stands for JavaScript XML—an XML-like syntax for constructing\
    \ markup within React components. React works without JSX, however embracing it\
    \ can make your components more readable, and so it is recommended.\n\nFor example,\
    \ a function call in plain React to create a header might look like this.\n\n\
    ```\n React.createElement('h1', {className: 'question'}, 'Questions');\n```\n\n\
    But with JSX it becomes much more familiar and a terse looking markup.\n\n```\n\
    \ <h1 className=\"question\">Questions</h1>\n```\n\nCompared to past attempts\
    \ at embedding markup in JavaScript, there are a few distinguishing characteristics\
    \ that set JSX apart. \n\n1.  JSX is a syntactic transform—each JSX node maps\
    \ to a JavaScript function.\n\n2.  JSX neither provides nor requires a runtime\
    \ library.\n\n3.  JSX doesn’t alter or add to the semantics of JavaScript—it’s\
    \ just simple function calls.\n\nThe similarity of JSX to HTML is what gives it\
    \ so much expressive power within React. Here we’ll discuss the benefits of JSX\
    \ and its purpose within an application, as well as the key differences between\
    \ JSX and HTML.\n\n# Benefits of JSX\n\nA question many ask when considering JSX\
    \ is why? Why use it at all when there are plenty of existing templating languages?\
    \ Why not use plain JavaScript instead? After all, JSX simply maps to JavaScript\
    \ functions.\n\nThere are many benefits to using JSX, and they become more pertinent\
    \ the larger your code base grows and the more complex your components become.\
    \ Let’s discuss some of these benefits now.\n\n## Familiarity\n\nMany development\
    \ teams include non-developers, from UI and UX designers who are familiar with\
    \ HTML, to quality-assurance teams responsible for thoroughly testing the product.\
    \ These team members can more easily read and contribute code to a JSX project.\
    \ Anyone with a familiarity with XML-based languages can easily adopt JSX.\n\n\
    In addition, because React components capture all possible representations of\
    \ your DOM (more about this later), JSX makes a great way to represent and visualize\
    \ this structure in a compact and succinct way.\n\n## Semantics\n\nAlong with\
    \ familiarity, JSX transforms your JavaScript code into more semantic, meaningful\
    \ markup. This offers you the benefit of declaring your component structure and\
    \ information flow using an HTML-like syntax, knowing it will transform into plain\
    \ JavaScript later.\n\nJSX allows you to use all of the predefined HTML5 tag names\
    \ alongside your own custom components within your application’s markup. You’ll\
    \ read about defining custom components later, so here you’ll simply see how JSX\
    \ can make your JavaScript more readable.\n\nAs an example, let’s consider a Divider\
    \ element that renders a header on the left and a horizontal-divider that stretches\
    \ to fill the right. The JSX for this divider looks like this:\n\n```\n <div className=\"\
    divider\">\n  <h2>Questions</h2><hr />\n</div>\n```\n\nAfter wrapping this in\
    \ a `Divider` React component you can use it like you would any other HTML element,\
    \ with the added benefit of markup with richer semantics.\n\n```\n <Divider>Questions</Divider>\n\
    ```\n\n## Easy to visualize\n\nJSX makes even small examples like these clearer\
    \ and more concise. In larger projects with hundreds of components and deep markup\
    \ trees, however, the benefit is magnified.\n\nHere is the Divider component mentioned\
    \ above. Notice that within the context of a JavaScript function the markup’s\
    \ intent is more clear and readable than the plain JavaScript version.\n\nHere\
    \ is the plain JavaScript:\n\n```\n render: function () {\n  return React.createElement('div',\
    \ {className:\"divider\"},\n    \"Label Text\",\n    React.createElement('hr')\n\
      );\n}\n```\n\nHere is the JSX markup:\n\n```\n render: function () {\n  return\
    \ (\n    <div className=\"divider\">\n      Label Text<hr />\n    </div>\n  );\n\
    }\n```\n\nMost agree that the JSX markup is easier to understand and easier to\
    \ debug.\n\n## Separation of concerns\n\nLastly, core to React, is the idea that\
    \ markup and the code that generates it are inherently tied together. In React\
    \ you do not separate the technologies of your application into a view and a template\
    \ file. Rather, React encourages you to create discrete components, encapsulating\
    \ all of the logic and the markup in one definition.\n\nJSX provides a clean and\
    \ concise way of keeping the markup of your component separate from the business\
    \ logic. Not only does it provide a clean visual language for describing a component\
    \ tree, but it makes your application easier to reason about.\n\n# Composite components\n\
    \nNow that you’ve discovered some of the benefits of JSX and seen how it can be\
    \ used to express a component in a compact markup format, let’s look at how it\
    \ helps assemble multiple components. \n\nThis section covers:\n\n*   Setting\
    \ up a JavaScript file that contains JSX\n\n*   Walking you through the assembly\
    \ of a component\n\n*   Discussing component ownership and the parent/child relationship\n\
    \nLet’s look at each in turn.\n\n## Defining a custom component\n\nContinuing\
    \ with the aforementioned page divider, here again is the HTML we desire as output.\n\
    \n```\n <div class=\"divider\">\n  <h2>Questions</h2><hr>\n</div>\n```\n\nTo express\
    \ this HTML as a React component, just wrap it like the following so that the\
    \ `render` function returns the markup (with some minor changes explained below).\n\
    \n```\n class Divider extends React.Component {\n  render() {\n    return (\n\
          <div className=\"divider\">\n        <h2>Questions</h2><hr />\n      </div>\n\
        );\n  }\n};\n```\n\nOf course this is currently a single-use component. To\
    \ be truly useful you need the ability to express the text within the `h2` tag\
    \ dynamically.\n\n## Dynamic values\n\nJSX renders dynamic values between curly\
    \ brackets `{...}` . The brackets signal a JavaScript context—anything you put\
    \ between them will be evaluated and the results rendered as nodes in the markup. \n\
    \nFor simple values, such as text or numbers, you can simply refer to the variable.\
    \ You can render a dynamic h2 tag like this:\n\n```\n var text = 'Questions';\n\
    <h2>{text}</h2>\n\n// <h2>Questions</h2>\n```\n\nFor more complex logic you may\
    \ wish to offload the calculations into a function. You can render the result\
    \ of this function by calling it within the brackets:\n\n```\n function dateToString(d)\
    \ {\n  return [\n    d.getFullYear(), \n    d.getMonth() + 1, \n    d.getDate()\n\
      ].join('-');\n};\n\n<h2>{dateToString(new Date())}</h2>\n\n// <h2>2014-10-18</h2>\n\
    ```\n\nReact will automatically evaluate arrays by rendering each item in the\
    \ array as a node. \n\n```\n var text = ['hello', 'world'];\n<h2>{text}</h2>\n\
    \n// <h2>helloworld</h2>\n```\n\nOften you may wish to render more than simple\
    \ values. For example, you may want to render an array of data as `<li>` elements. This\
    \ brings us to the idea of child nodes. \n\n## Child nodes\n\nIn HTML you render\
    \ a header using `<h2>Questions</h2>` , where the text “Questions” became a child\
    \ text-node of the `h2` element. So the goal here is to express the divider in\
    \ JSX, like this:"
