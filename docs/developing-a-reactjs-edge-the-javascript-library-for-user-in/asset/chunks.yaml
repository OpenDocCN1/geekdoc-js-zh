  trans: "\n\n在基本层面上，React 处理的事件与常规 JavaScript 中的相同：用于点击处理器的 `MouseEvents`、表单元素变化时的\
    \ `Change` 事件等。这些事件与常规 JavaScript 中的名称相同，并在相同条件下触发。\n\nReact 附加事件处理器的语法与 HTML\
    \ 的语法非常相似。例如，在我们的示例应用中，以下代码为“保存”按钮附加了一个 `onClick` 处理器。\n\n```\n <button className=\"\
    btn btn-save\" onClick={this.handleSaveClicked}>保存</button>\n```\n\n当用户点击按钮时，按钮的\
    \ `handleSaveClicked` 方法将运行。该方法将包含解决保存操作所需的逻辑。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
    \ 查看我们示例应用（一个 Reddit 克隆）的完整源代码。\n\n请注意，尽管这段代码类似于在 HTML 中使用 `onclick` 等属性指定事件处理器这种被广泛不推荐的做法，但它实际上并未在底层使用\
    \ HTML 的 `onclick` 属性。React 仅将此语法用作指定处理器的方式，并在内部妥善地管理事件监听器。\n\n如果你不使用 JSX，则需将处理器指定为选项对象中的一个字段。例如：\n\
    \n```\n React.DOM.button({className: \"btn btn-save\", onClick: this.handleSaveClicked},\
    \ \"保存\");\n```\n\nReact 对处理多种事件类型提供了一流支持，这些事件类型在其文档的 [事件系统](http://facebook.github.io/react/docs/events.html)\
    \ 页面中列出。\n\n# 事件与状态\n\n假设你有一个 Markdown 编辑器，并且希望实时预览 Markdown 内容。\n\n在 React 中，这是通过监听变化并用最新值更新状态来实现的。\n\
    \n```\n class CommentEditor extends React.Component {\n  constructor(){\n    super();\n\
    \    this.state = {text: ''};\n  }\n  render(){\n    return (\n      <div>\n \
    \       <input \n          value={this.state.text}\n          onChange={(e) =>\
    \ this.setState({text: e.target.value})}\n        />\n      </div>\n    );\n \
    \ }\n}\n```\n\n## 基于状态渲染\n\n这是一个基本的双向绑定实现。因为数据在状态中，我们可以轻松渲染 Markdown 预览。\n\n```\n\
    \ render(){\n    return (\n      <div>\n        <input \n          value={this.state.text}\n\
    \          onChange={(e) => this.setState({text: e.target.value})}\n        />\n\
    \        <Markdown content={this.state.text} />\n      </div>\n    );\n  }\n```\n\
    \n与 `this.props` 类似，渲染函数可以根据 `this.state` 的值进行或多或少的更改。它可以渲染相同的元素，但属性略有不同，或者渲染完全不同的元素集。两种方式都同样有效。\n\
    \n## 更新状态\n\n由于更新组件的内部 `state` 会导致组件重新渲染，因此 Markdown 预览始终是最新的。当我们调用 `setState`\
    \ 时，`render` 将再次运行，但它会读取 `this.state` 的当前值。Markdown 组件也会更新，新内容将被刷新到 DOM 中。\n\n\
    更新组件状态有两种方法：组件的 `setState` 方法和 `replaceState` 方法。`replaceState` 会用全新的状态对象覆盖整个状态对象，如果你使用不可变数据结构来保存状态，这会很有用，但其他情况下很少需要。更常见的是使用\
    \ `setState`，它只是将你提供的对象合并到现有状态对象中。\n\n例如，假设当前状态如下：\n\n```\n {\n  title: \"我的标题\"\
    ,\n  text: \"你好\",\n}\n```\n\n在这种情况下，调用 `this.setState({title: \"其他标题\"})` 只会影响\
    \ `this.state.title` 的值，而 `this.state.text` 不受影响。\n\n调用 `this.replaceState({title:\
    \ \"其他标题\"})` 则会用新对象 `{title: \"精彩调查 2.0\"}` 替换整个状态对象，从而完全擦除 `this.state.text`。这很可能会破坏渲染函数，因为渲染函数期望\
    \ `this.state.text` 是字符串而不是 `undefined`。\n\n重要的是，除了调用 `setState` 或 `replaceState`\
    \ 之外，绝不要以任何其他方式更改 `state` 对象。像 `this.state.saveInProgress = true` 这样的操作通常是不好的做法，因为它不会通知\
    \ React 可能需要重新渲染，并且可能导致下次调用 `setState` 时出现意外结果。\n\n## 状态没有更新！\n\n还需要注意的是，`setState`\
    \ 是异步的。因此，如果你的状态是 `{x: 1}`，并且运行以下代码，控制台将显示 1。\n\n```\n this.setState({x: 2})\n\
    console.log(this.state.x);\n```\n\n如果你需要在状态更新、渲染被调用且更改已刷新到 DOM 后执行某些操作，可以将回调作为\
    \ `setState` 的第二个参数传递。\n\n```\n this.setState({x: 2}, () => {\n  console.log(this.state.x);\
    \ // 2\n})\n```\n\n这也意味着在单个 tick 内多次更新状态可能会导致问题。\n\n```\n this.state.xs // []\n\
    this.setState({xs: this.state.xs.concat([1])}\nthis.setState({xs: this.state.xs.concat([2])}\n\
    ```\n\n最终状态将是 `[2]`，而不是期望的 `[1, 2]`。\n\n你可以通过使用原子性的 `setState` 变体来避免此问题。通常你会使用表达式箭头函数，但为了清晰起见，我们详细地写出来。\n\
    \n```\n this.state.xs // []\nthis.setState((state) => {\n  var xs = state.xs.concat([1]);\n\
    \  return {xs: xs};\n});\nthis.setState((state) => {\n  var xs = state.xs.concat([2]);\n\
    \  return {xs: xs};\n});\n```\n\n注意，你应该使用 `state` 参数而不是 `this.state`。React 会将这些函数排队，并用前一个函数更新后的状态依次调用每个函数。通常你知道两次更新不会发生在同一个\
    \ tick 内，或者你可能不关心第一个更新被隐藏，因此这个特性在实践中很少使用。\n\n# 事件对象\n\n许多处理器只需触发即可达到目的，但有时你需要更多关于用户输入的信息。\n\
    \n看一下示例应用中的 `CommentEditor` 类。\n\n```\n onChange={(e) => {\n  this.props.onChange({text:\
    \ e.target.value, type: 'comment'})\n}}\n```\n\nReact 的事件处理函数总是会接收到一个事件对象，这与原生\
    \ JavaScript 事件监听器的方式非常相似。在这里，事件处理器接收一个事件对象，并通过访问 `event.target.value` 从中提取输入的当前值。在事件处理器中使用\
    \ `event.target.value` 是从表单输入中获取值的常见方式，尤其是在 `onChange` 处理器中。\n\nReact 不会将浏览器提供的原始\
    \ Event 对象直接传递给处理器，而是将原始事件包装在 `SyntheticEvent` 实例中。`SyntheticEvent` 的设计使其在外观和功能上与浏览器创建的原始事件相同，只是平滑处理了某些跨浏览器的不一致性。你应该能够像使用普通事件一样使用\
    \ `SyntheticEvent`，但如果需要浏览器发送的原始事件，可以通过 `SyntheticEvent` 的 `nativeEvent` 字段访问它。\n\
    \n# 总结\n\n在用户界面中反映用户输入变化的步骤如下：\n\n1.  为 React 组件附加一个事件处理器。\n\n2.  在该事件处理器中，更新组件的内部状态。更新组件的状态将导致其重新渲染。\n\
    \n3.  修改组件的 `render` 函数，适当地引入 `this.state`。\n\n到目前为止，你已经使用单个组件来响应用户交互。接下来，你将学习如何组合多个组件，以创建一个超越各部分之和的界面。\n\
    \n# 第 6 章 组合组件\n\n"
- fmt: "\nIn traditional HTML the basic building block of each page is an element.\
    \ In React you assemble a page from components. You can think of a React component\
    \ as an HTML element with all of the expressive power of JavaScript mixed in.\
    \ In fact, with React the *only* thing you do is build components, just like an\
    \ HTML document is built with only elements.\n\nSince the entirety of a React\
    \ application is built using components, this whole book can be described as a\
    \ book about React components. Therefore, in this chapter we won’t cover *everything*\
    \ to do with components. Rather, you will be introduced to one specific aspect\
    \ — their composability.\n\nA component is basically a JavaScript function that\
    \ takes in `props` and `state` as its arguments, and outputs rendered HTML. They\
    \ are typically designed to represent and express a piece of data within your\
    \ application, so you can think of a React component as an extension of HTML.\n\
    \nIn this chapter we’ll be using code not found in the reddit clone sample application\
    \ because a CRUD (create read update delete) application illustrates it better.\n\
    \n# Extending HTML\n\nReact + JSX are powerful and expressive tools, allowing\
    \ you to create custom elements that can be expressed using an HTML-like syntax.\
    \ They go far beyond plain HTML, allowing you to control their behavior throughout\
    \ their lifetime. This all starts with the inheriting from `React.Component`.\n\
    \nReact favors composition over inheritance, which means you combine small, simple\
    \ components and data objects into larger, more complex components. With EcmaScript\
    \ 6 you inherit from `React.Component`, but it does not encourage deeper levels\
    \ of inheritance than that. Instead, building re-useable components that can be\
    \ composed is encouraged.\n\nReact embraces composability, allowing you to mix-and-match\
    \ various child components into an intricate and powerful new component. To demonstrate\
    \ this, let’s consider how a user would answer a survey question.\n\nYou can read\
    \ the full source code of our example application, a reddit clone, at [http://git.io/vlcpa](http://git.io/vlcpa).\n\
    \n# Composition by example\n\nLet’s consider the component representing a multiple-choice\
    \ question. This has a few requirements:\n\n* Take a list of choices as input\n\
    * Render the choices to the user\n* Only allow the user to select a single choice\n\
    \nWe know HTML provides some basic elements to help, namely the radio type inputs\
    \ and input groups. Thinking of it from the top-down, the component hierarchy\
    \ looks something like this:\n\n```\n MultipleChoice → RadioInput → Input (type=\"\
    radio\")\n```\n\nYou can think of these arrows as representing the phrase *has\
    \ a*. The `MulitpleChoice` component *has a* `RadioInput`. The `RadioInput` *has\
    \ an* input. This is an identifying trait of the composition pattern.\n\n## Assembling\
    \ the HTML\n\nLet’s start by assembling the components from the bottom-up. The\
    \ DOM components (starting with a lowercase letter) are provided by React. Therefore,\
    \ the first thing you’ll do is wrap it in a `RadioInput` component. This component\
    \ will be responsible for customizing the generic `input`, narrowing its scope\
    \ to behave like a radio button. Let’s name it `AnswerRadioInput`.\n\nFirst, create\
    \ the scaffolding, which will include the required render method and the basic\
    \ markup to describe the desired output. You can already begin to see the composition\
    \ pattern as the component becomes a specialized type of input.\n\n```\n class\
    \ AnswerRadioInput extends React.Component {\n  render() {\n    return (\n   \
    \   <div className=\"radio\">\n        <label>\n          <input type=\"radio\"\
    \ />\n          Label Text\n        </label>\n      </div>\n    );\n  }\n}\n```\n\
    \n**Add dynamic properties**\n\nNothing about our `input` is dynamic yet, so you\
    \ need to define the properties the parent must pass into the radio input.\n\n\
    * What value, or choice, does this input represent? (required)\n* What text do\
    \ we use to describe it? (required)\n* What is the input’s `name`? (required)\n\
    * We might want to customize the `id`.\n* We might want to override the default\
    \ `value`.\n\nGiven this list you can now define the property types for our custom\
    \ input. Add these to the `propTypes` hash of the class definition.\n\n```\n class\
    \ AnswerRadioInput extends React.Component {\n    ...\n}\n\nAnswerRadioInput.propTypes\
    \ = {\n  id: React.PropTypes.string,\n  name: React.PropTypes.string.isRequired,\n\
    \  label: React.PropTypes.string.isRequired,\n  value: React.PropTypes.string.isRequired,\n\
    \  checked: React.PropTypes.bool,\n};\n```\n\nFor each optional property you need\
    \ to define the default value. Add these to the `defaultProps` static member.\
    \ These values will be applied to each new instance when the parent component\
    \ does not provide their value.\n\n```\n class AnswerRadioInput extends React.Component\
    \ {\n  ...\n}\n\nAnswerRadioInput.PropTypes = {...};\nAnswerRadioInput.defaultProps\
    \ = {\n  id: null,\n  checked: false\n};\n```\n\n## Track state\n\nOur component\
    \ needs to keep track of data that changes over time. Specifically, the `id` will\
    \ be unique for each instance and the user can update the `checked` value at any\
    \ time. Therefore, let’s define the initial state.\n\nThis happens in the `constructor`\
    \ of the React component. We simply set the `this.state` hash with the default\
    \ state.\n\nNotice that we also call `super(props)` to use the default prop behavior.\n\
    \n```\n class AnswerRadioInput extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    var id = props.id ? props.id : uniqueId('radio-');\n\
    \    this.state = {\n      checked: !!props.checked,\n      id: id,\n      name:\
    \ id\n    };\n\n  }\n  ...\n}\n\nAnswerRadioInput.PropTypes = {...};\nAnswerRadioInput.defaultProps\
    \ = {...};\n```\n\nNow you can update the rendered markup to access the new dynamic\
    \ state and props.\n\n```\n class AnswerRadioInput = React.createClass({\n\n \
    \ constructor(props) {...}\n\n  render() {\n    return (\n      <div className=\"\
    radio\">\n        <label htlmFor={this.props.id}>\n          <input type=\"radio\"\
    \n            name={this.props.name}\n            id={this.props.id}\n       \
    \     value={this.props.value}\n            checked={this.state.checked} />\n\
    \          {this.props.label}\n        </label>\n      </div>\n    );\n  }\n}\n\
    \nAnswerRadioInput.PropTypes = {...};\nAnswerRadioInput.defaultProps = {...};\n\
    ```\n\n## Integrate into a parent component\n\nAt this point you have enough of\
    \ a component to use it within a parent, so you’re ready to build up the next\
    \ layer, the `AnswerMultipleChoiceQuestion`. The primary responsibility here is\
    \ to display a list of choices for the user to choose from. Following the pattern\
    \ introduced above, let’s lay down the basic HTML and the default props for this\
    \ component.\n\n```\n class AnswerMultipleChoiceQuestion extends React.Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      id:\
    \ uniqueId('multiple-choice-'),\n      value:props.value\n    };\n  }\n  render()\
    \ {\n    return (\n      <div className=\"form-group\">\n        <label className=\"\
    survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n     \
    \   <div className=\"survey-item-content\">\n              <AnswerRadioInput ...\
    \ />\n          ...\n          <AnswerRadioInput ... />\n        </div>\n    \
    \  </div>\n    );\n  }\n}\n\nAnswerMultipleChoiceQuestion.propTypes = {\n  value:\
    \ React.PropTypes.string,\n  choices: React.PropTypes.array.isRequired,\n  onCompleted:\
    \ React.PropTypes.func.isRequired\n};\n```\n\nIn order to generate the list of\
    \ child radio input components, you must map over the choices array, transforming\
    \ each into a component. This is easily handled in a helper function as demonstrated\
    \ here.\n"
