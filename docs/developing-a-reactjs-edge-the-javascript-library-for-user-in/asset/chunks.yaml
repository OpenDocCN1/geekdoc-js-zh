        }\n\n    componentDidMount() {\n        window.addEventListener(\"keydown\"\
    , this.keyHandler.bind(this), \n          false);\n    }\n\n    render() {\n \
    \       var status = !can_move(this.state)?\" - Game Over!\":\"\";\n        return\
    \ <div className=\"app\">\n            <span className=\"score\">\n           \
    \     Score: {score_board(this.state)}{status}\n            </span>\n         \
    \   <Tiles board={this.state}/>\n            <button onClick={this.newGame.bind(this)}>New\
    \ Game</button>\n        </div>\n    }\n} \n```\n\n在`GameBoard`组件中，我们设置了用于与棋盘交互的键盘处理程序。每次按下方向键时，我们都会调用`setBoard`，传入从游戏逻辑中新创建的棋盘。如果新棋盘与旧棋盘不同，我们就更新`GameBoard`组件的状态。这避免了不必要的循环并提高了性能。\n\
    \n在渲染函数中，你根据当前棋盘渲染`Tiles`组件，并渲染由游戏逻辑根据当前棋盘计算出的分数。\n\n`addTile`函数在你使用方向键时不断向棋盘添加新方块，使游戏持续进行，直到棋盘满且无法合并任何数字时游戏结束。\n\
    \n基于上述实现，为游戏添加撤销功能是轻而易举的。你可以在`GameBoard`组件的状态中保存所有棋盘更改的历史记录，并通过一个撤销按钮更改当前棋盘：[`jsfiddle.net/jeremiahrhall/9fbjgnt6/`](https://jsfiddle.net/jeremiahrhall/9fbjgnt6/)。\n\
    \n这个游戏的实现相当简单，因为`React`让你专注于游戏逻辑和用户交互，而无需担心保持视图同步。\n\n# 电子邮件\n\n尽管`React`是为构建交互式\
    \ Web UI 而优化的，但其核心是渲染 HTML。这意味着你可以获得通常编写 React 应用程序所带来的许多好处，甚至可以用它来做像编写 HTML 电子邮件这样糟糕的事情。\n\
    \n构建 HTML 电子邮件需要一系列表格才能在各个邮件客户端中正确渲染。要编写电子邮件，你需要将时钟拨回几年，像 1999 年那样编写 HTML。\n\n\
    在多种邮件客户端中成功渲染电子邮件绝非易事。为了用`React`构建我们的设计，我们将只涉及构建电子邮件时遇到的一些挑战，无论它们是否使用 React 渲染。\n\
    \n用`React`渲染电子邮件 HTML 的核心原则是`React.renderToStaticMarkup`。该函数返回一个包含完整组件树的 HTML\
    \ 字符串，给定一个顶级组件。`React.renderToStaticMarkup`和`React.renderToString`的唯一区别在于，`React.renderToStaticMarkup`不会创建额外的\
    \ DOM 属性，比如`data-react-id`（React 在客户端用来跟踪 DOM）。由于电子邮件不在浏览器中客户端运行，我们不需要这些属性。\n\n\
    让我们根据这个桌面和移动端的设计，用`React`构建一封电子邮件：\n\n![替代文本](img/Portrait.png)![替代文本](img/Mobile_Portrait.png)\n\
    \n为了渲染电子邮件，我们编写了一个小脚本，输出可用于发送电子邮件的 HTML：\n\n```\n// render_email.js\nvar ReactDOMServer\
    \ = require('react-dom/server');\nvar SurveyEmail = require('survey_email');\n\
    var survey = {};\n\nconsole.log(\n  ReactDOMServer.renderToStaticMarkup(<SurveyEmail\
    \ survey={survey}/>)\n);\n```\n\n让我们开始构建`SurveyEmail`的核心结构。首先，构建一个`Email`组件：\n\
    \n```\nclass Email extends React.Component {\n  render() {\n    return (\n   \
    \   <html>\n        <body>\n          {this.prop.children}\n        </body>\n\
    \      </html>\n    );\n  }\n}\n```\n\n`<SurveyEmail/>`组件使用了`<Email/>`：\n\n```\n\
    class SurveyEmail extends React.Component {\n  render() {\n    var survey = this.props.survey;\n\
    \    return (\n      <Email>\n        <h2>{survey.title}</h2>\n      </Email>\n\
    \    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
    };\n```\n\n接下来，根据设计，在桌面客户端上并排渲染两个 KPI，在移动设备上则堆叠显示。每个 KPI 的结构相似，因此它们可以共享同一个组件：\n\
    \n```\nclass SurveyEmail extends React.Component {\n  render() {\n    return (\n\
    \      <table className='kpi'>\n        <tr>\n          <td>{this.props.kpi}</td>\n\
    \        </tr>\n        <tr>\n          <td>{this.props.label}</td>\n        </tr>\n\
    \      </table>\n    );\n  }\n}\n```\n\n"
- fmt: "\nLet’s add them to the `<SurveyEmail/>` component:\n\n```\n class SurveyEmail\
    \ extends React.Component {\n  render() {\n    var survey = this.props.survey;\n\
    \    var completions = survey.activity.reduce((memo, ac) => {\n      return memo\
    \ + ac;\n    }, 0);\n    var daysRunning = survey.activity.length;\n\n    return\
    \ (\n      <Email>\n        <h2>{survey.title}</h2>\n        <KPI kpi={completions}\
    \ label='Completions'/>\n        <KPI kpi={daysRunning} label='Days running'/>\n\
    \      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
    };\n```\n\nThis stacks our KPIs, but the design had them next to each other for\
    \ the desktop. The challenge now is to have this work for both desktop and mobile.\
    \ To solve this there are a few gotchas we have to cover first.\n\nLets augment\
    \ `<Email/>` with a way of adding a CSS file:\n\n```\n var fs = require(‘fs’);\n\
    class Email extends React.Component {\n  render() {\n    var responsiveCSSFile\
    \ = this.props.responsiveCSSFile;\n    var styles;\n    if (responsiveCSSFile)\
    \ {\n      styles = <style>{fs.readFileSync(responsiveCSSFile)}</style>;\n   \
    \ }\n    return (\n      <html>\n        <body>\n          {styles}\n        \
    \  {this.prop.children}\n       </body>\n     </html>\n    );\n  }\n}\n\nEmail.propTypes\
    \ = {\n  responsiveCSSFile: React.PropTypes.string\n};\n```\n\nThe complete `<SurveyEmail/>`\
    \ looks like this:\n\n```\n class SurveyEmail extends React.Component {\n  render()\
    \ {\n    var survey = this.props.survey;\n    var completions = survey.activity.reduce((memo,\
    \ ac) => {\n      return memo + ac;\n    }, 0);\n\n    var daysRunning = survey.activity.length;\n\
    \n    return (\n      <Email responsiveCSS='path/to/mobile.css'>\n        <h2>{survey.title}</h2>\n\
    \        <table className='for-desktop'>\n          <tr>\n            <td>\n \
    \             <KPI kpi={completions} label='Completions'/>\n            </td>\n\
    \            <td>\n              <KPI kpi={daysRunning} label='Days running'/>\n\
    \            </td>\n          </tr>\n        </table>\n        <div className='for-mobile'>\n\
    \          <KPI kpi={completions} label='Completions'/>\n          <KPI kpi={daysRunning}\
    \ label='Days running'/>\n        </div>\n      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes:\
    \ {\n  survey: React.PropTypes.object.isRequired\n};\n```\n\nWe grouped the Email\
    \ into for-desktop and for-mobile. Sadly you can’t use something like `float:\
    \ left` in emails since that isn’t supported by most browsers. And The HTML spec\
    \ calls out the `align` and `valign` properties as being obsolete and therefore\
    \ React doesn’t support those properties. They could have, however, provided a\
    \ similar implementation to floating two `div`s. Instead we are left with two\
    \ groups to target with responsive style sheets to hide or show depending on the\
    \ screen size.\n\nEven though you have to use tables, it’s clear that using React\
    \ for rendering emails gives you a lot of the same benefits from writing interactive\
    \ UIs for a browser’s Reusable, composable, and testable components.\n\n# Charting\n\
    \nReact has support for SVG tags and thus making a simple SVG becomes trivial.\n\
    \nTo render a Sparkline (that we’ll use as an example), you need only a `<Path/>`\
    \ with a set of instructions.\n\nThe complete example looks like this:\n\n```\n\
    \ class Sparkline extends React.Component {\n  render() {\n    var width = 200;\n\
    \    var height = 20;\n    var path = this.generatePath(width, height, this.props.points);\n\
    \n    return (\n      <svg width={width} height={height}>\n        <path d={path}\
    \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  },\n\
    \n  generatePath(width, height, points) {\n    var maxHeight = arrMax(points);\n\
    \    var maxWidth = points.length;\n\n    return points.map((p, i) => {\n    \
    \  var xPct = i / maxWidth * 100;\n      var x = (width / 100) * xPct;\n     \
    \ var yPct = 100 - (p / maxHeight * 100);\n      var y = (height / 100) * yPct;\n\
    \n      if (i === 0) {\n        return 'M0,' + y;\n      }\n      else {\n   \
    \     return 'L' + x + ',' + y;\n      }\n    }).join(' ');\n  }\n}\n\nSparkline.propTypes\
    \ = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\nThe Sparkline component above requires an array of numbers that represents\
    \ the points. It then builds a simple SVG with a path.\n\nThe interesting part\
    \ is in the `generatePath` function that computes, where each point should be\
    \ rendered and returns an SVG path description.\n\nIt returns a string like so:\
    \ `\"M0,30 L10,20 L20,50\"`. SVG paths translate this into drawing commands. Each\
    \ command is separated by a blank space. `\"M0,30\"` means Move cursor to x0 and\
    \ y30. Then `\"L10,20\"` means draw a line from the current cursor to x10 and\
    \ y20 and so on.\n\nIt can be tedious to writing scale functions like this for\
    \ larger charts, but its quite simple to drop in libraries like D3, and use the\
    \ scale functions D3 provides instead of manual creating the path like so:\n\n\
    ```\n class Sparkline extends React.Component {\n  render() {\n    var width =\
    \ 200;\n    var height = 20;\n    var points = this.props.points.map((p, i) =>\
    \ {\n      return { y: p, x: i };\n    });\n\n    var xScale = d3.scale.linear()\n\
    \      .domain([0, points.length])\n      .range([0, width]);\n\n    var yScale\
    \ = d3.scale.linear()\n      .domain([0, arrMax(this.props.points)])\n      .range([height,\
    \ 0]);\n\n    var line = d3.svg.line()\n      .x(function (d) { return xScale(d.x)\
    \ })\n      .y(function (d) { return yScale(d.y) })\n       .interpolate('linear');\n\
    \n    return (\n      <svg width={width} height={height}>\n        <path d={line(points)}\
    \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  }\n\
    }\n\nSparkline.propTypes = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\n# Summary\n\nIn this chapter we learned:\n\n1.  React isn’t just about\
    \ the browser, and it can be used to build desktop applications and emails.\n\n\
    2.  How to use React to aid in game development.\n\n3.  React is a great choice\
    \ for charting and works very well with libraries like D3.\n\nYou have now completed\
    \ this book, and should be able to use React to create all types of interesting\
    \ applications.\n"
  raw: "Let’s add them to the `<SurveyEmail/>` component:\n\n```\n class SurveyEmail\
    \ extends React.Component {\n  render() {\n    var survey = this.props.survey;\n\
    \    var completions = survey.activity.reduce((memo, ac) => {\n      return memo\
    \ + ac;\n    }, 0);\n    var daysRunning = survey.activity.length;\n\n    return\
    \ (\n      <Email>\n        <h2>{survey.title}</h2>\n        <KPI kpi={completions}\
    \ label='Completions'/>\n        <KPI kpi={daysRunning} label='Days running'/>\n\
    \      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
    };\n```\n\nThis stacks our KPIs, but the design had them next to each other for\
    \ the desktop. The challenge now is to have this work for both desktop and mobile.\
    \ To solve this there are a few gotchas we have to cover first.\n\nLets augment\
    \ `<Email/>` with a way of adding a CSS file:\n\n```\n var fs = require(‘fs’);\n\
    class Email extends React.Component {\n  render() {\n    var responsiveCSSFile\
    \ = this.props.responsiveCSSFile;\n    var styles;\n    if (responsiveCSSFile)\
    \ {\n      styles = <style>{fs.readFileSync(responsiveCSSFile)}</style>;\n   \
    \ }\n    return (\n      <html>\n        <body>\n          {styles}\n        \
    \  {this.prop.children}\n       </body>\n     </html>\n    );\n  }\n}\n\nEmail.propTypes\
    \ = {\n  responsiveCSSFile: React.PropTypes.string\n};\n```\n\nThe complete `<SurveyEmail/>`\
    \ looks like this:\n\n```\n class SurveyEmail extends React.Component {\n  render()\
    \ {\n    var survey = this.props.survey;\n    var completions = survey.activity.reduce((memo,\
    \ ac) => {\n      return memo + ac;\n    }, 0);\n\n    var daysRunning = survey.activity.length;\n\
    \n    return (\n      <Email responsiveCSS='path/to/mobile.css'>\n        <h2>{survey.title}</h2>\n\
    \        <table className='for-desktop'>\n          <tr>\n            <td>\n \
    \             <KPI kpi={completions} label='Completions'/>\n            </td>\n\
    \            <td>\n              <KPI kpi={daysRunning} label='Days running'/>\n\
    \            </td>\n          </tr>\n        </table>\n        <div className='for-mobile'>\n\
    \          <KPI kpi={completions} label='Completions'/>\n          <KPI kpi={daysRunning}\
    \ label='Days running'/>\n        </div>\n      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes:\
    \ {\n  survey: React.PropTypes.object.isRequired\n};\n```\n\nWe grouped the Email\
    \ into for-desktop and for-mobile. Sadly you can’t use something like `float:\
    \ left` in emails since that isn’t supported by most browsers. And The HTML spec\
    \ calls out the align and valign properties as being obsolete and therefore React\
    \ doesn’t support those properties. They could have, however, provided a similar\
    \ implementation to floating two `div`s. Instead we are left with two groups to\
    \ target with responsive style sheets to hide or show depending on the screen\
    \ size.\n\nEven though you have to use tables, it’s clear that using React for\
    \ rendering emails gives you a lot of the same benefits from writing interactive\
    \ UIs for a browser’s Reusable, composable, and testable components.\n\n# Charting\n\
    \nReact has support for SVG tags and thus making a simple SVG becomes trivial.\n\
    \nTo render a Sparkline (that we’ll use as an example), you need only a `<Path/>`\
    \ with a set of instructions.\n\nThe complete example looks like this:\n\n```\n\
    \ class Sparkline extends React.Component {\n  render() {\n    var width = 200;\n\
    \    var height = 20;\n    var path = this.generatePath(width, height, this.props.points);\n\
    \n    return (\n      <svg width={width} height={height}>\n        <path d={path}\
    \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  },\n\
    \n  generatePath(width, height, points) {\n    var maxHeight = arrMax(points);\n\
    \    var maxWidth = points.length;\n\n    return points.map((p, i) => {\n    \
    \  var xPct = i / maxWidth * 100;\n      var x = (width / 100) * xPct;\n     \
    \ var yPct = 100 - (p / maxHeight * 100);\n      var y = (height / 100) * yPct;\n\
    \n      if (i === 0) {\n        return 'M0,' + y;\n      }\n      else {\n   \
    \     return 'L' + x + ',' + y;\n      }\n    }).join(' ');\n  }\n}\n\nSparkline.propTypes\
    \ = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\nThe Sparkline component above requires an array of numbers that represents\
    \ the points. It then builds a simple SVG with a path.\n\nThe interesting part\
    \ is in the `generatePath` function that computes, where each point should be\
    \ rendered and returns an SVG path description.\n\nIt returns a string like so:\
    \ “M0,30 L10,20 L20,50”. SVG paths translate this into drawing commands. Each\
    \ command is separated by a blank space. “M0,30” means Move cursor to x0 and y30\\\
    . Then “L10,20” means draw a line from the current cursor to x10 and y20 and so\
    \ on.\n\nIt can be tedious to writing scale functions like this for larger charts,\
    \ but its quite simple to drop in libraries like D3, and use the scale functions\
    \ D3 provides instead of manual creating the path like so:\n\n```\n class Sparkline\
    \ extends React.Component {\n  render() {\n    var width = 200;\n    var height\
    \ = 20;\n    var points = this.props.points.map((p, i) => {\n      return { y:\
    \ p, x: i };\n    });\n\n    var xScale = d3.scale.linear()\n      .domain([0,\
    \ points.length])\n      .range([0, width]);\n\n    var yScale = d3.scale.linear()\n\
    \      .domain([0, arrMax(this.props.points)])\n      .range([height, 0]);\n\n\
    \    var line = d3.svg.line()\n      .x(function (d) { return xScale(d.x) })\n\
    \      .y(function (d) { return yScale(d.y) })\n       .interpolate('linear');\n\
    \n    return (\n      <svg width={width} height={height}>\n        <path d={line(points)}\
    \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  }\n\
    }\n\nSparkline.propTypes = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\n# Summary\n\nIn this chapter we learned:\n\n1.  React isn’t just about\
    \ the browser, and it can be used to build desktop applications and emails.\n\n\
    2.  How to use React to aid in game development.\n\n3.  React is a great choice\
    \ for charting and works very well with libraries like D3.\n\nYou have now completed\
    \ this book, and should be able to use React to create all types of interesting\
    \ applications."
