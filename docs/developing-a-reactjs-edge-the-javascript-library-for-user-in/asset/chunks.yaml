  trans: "\n```\nclass AnswerMultipleChoiceQuestion = React.createClass({\n\n  ...\n\
      renderChoices() {\n    return this.props.choices.map((choice, i) => {\n     \
    \ return (\n         <AnswerRadioInput\n          id={\"choice-\" + i}\n     \
    \     name={this.state.id}\n          label={choice}\n          value={choice}\n\
    \          checked={this.state.value === choice}\n         />\n      );\n    });\n\
      }\n\n  render() {\n    return (\n      <div className=\"form-group\">\n     \
    \   <label className=\"survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n\
            <div className=\"survey-item-content\">\n            {this.renderChoices()}\n\
            </div>\n      </div>\n    );\n  }\n}\n```\n\n现在 React 的组合性变得更加清晰了。你从一个通用输入组件开始，将其定制为单选输入组件，最后封装成一个多项选择组件——一个高度精炼且特定版本的表单控件。现在，渲染一组选项变得如此简单：\n\
    \n```\n<AnswerMultipleChoiceQuestion choices={arrayOfChoices} ... />\n```\n\n\
    细心的读者可能已经注意到还缺少一个环节——我们的单选输入组件无法将变化通知给父组件。你需要连接 `AnswerRadioInput` 子组件，以便父组件能够感知它们的变化，并将其处理成合适的调查结果数据负载。这就引出了父/子关系。\n\
    \n# 父/子关系\n\n到目前为止，你应该能够使用我们的示例在屏幕上渲染一个表单，但请注意，你还没有赋予组件共享用户更改的能力。`AnswerRadioInput`\
    \ 组件还没有与父组件通信的能力。\n\n子组件与父组件通信的最简单方式是通过 props。父组件需要通过 props 传入一个回调函数，子组件在需要时调用它。\n\
    \n首先，你需要定义 `AnswerMultipleChoiceQuestion` 如何处理来自子组件的变化。添加一个 `handleChanged` 方法，并将其传递给每个\
    \ `AnswerRadioInput`。\n\n当我们使用 EcmaScript 6 类时，方法默认不会自动绑定到实例。你可以在 `constructor`\
    \ 中像下面这样设置绑定，或者在将其作为 `onChanged` prop 传入时进行绑定。\n\n```\nclass AnswerMultipleChoiceQuestion\
    \ extends React.Component {\n  constructor(props) {\n    ...\n    this.handleChanged\
    \ = this.handleChanged.bind(this);\n  }\n\n  handleChanged(value) {\n    this.setState({value:\
    \ value});\n    this.props.onCompleted(value);\n  }\n\n  renderChoices() {\n \
    \   return this.props.choices.map((choice, i) => {\n\n       return (\n        <AnswerRadioInput\n\
              id={\"choice-\" + i}\n          name={this.state.id}\n            label={choice}\n\
              value={choice}\n         checked={this.state.value === choice}\n   \
    \       onChanged={this.handleChanged}\n        />\n      );\n    });\n  }\n \
    \ ...\n}\n```\n\n现在，每个单选输入组件可以监听用户的变化，并将值传递给父组件。这需要将事件处理程序连接到输入组件的 `onChange`\
    \ 事件上。\n\n```\nclass AnswerRadioInput extends React.Component {\n  constructor(props)\
    \ {\n     ...\n    this.handleChanged = this.handleChanged.bind(this);\n  }\n\n\
      handleChanged(e) {\n    var checked = e.target.checked;\n    this.setState({checked:\
    \ checked});\n    if (checked) {\n      this.props.onChanged(this.props.value);\n\
        }\n  }\n\n  render() {\n    return (\n      <div className=\"radio\">\n   \
    \     <label htmlFor={this.state.id}>\n          <input type=\"radio\"\n     \
    \       ...\n            onChange={this.handleChanged} />\n          {this.props.label}\n\
            </label>\n      </div>\n    );\n  }\n}\n\nAnswerRadioInput.propTypes:\
    \ {\n  ...\n  onChanged: React.PropTypes.func.isRequired\n};\n```\n\n# 总结\n\n\
    你现在已经看到了 React 如何使用组合性模式，允许你包装 HTML 元素或自定义组件，并根据需要定制它们的行为。随着你使用组件，它们会变得更加具体和语义化。因此，React\
    \ 将通用输入组件：\n\n```\n<input type=\"radio\" ... />\n```\n\n转化为更有意义的东西：\n\n```\n<AnswerRadioInput\
    \ ... />\n```\n\n最终，你得到一个单一的组件，将数据数组转换为用户可交互的有用 UI。\n\n```\n<AnswerMultipleChoiceQuestion\
    \ choices={arrayOfChoices} ... />\n```\n\n组合只是 React 提供的一种定制和特化组件的方式。Mixin 提供了另一种方法，允许你定义可以在多个组件之间共享的方法。接下来，我们将展示如何定义\
    \ mixin，以及如何使用它们来共享公共代码。\n\n# 第 7 章 高阶组件与 Mixin\n\nReact 有两种特殊的抽象方式。高阶组件是接受一个组件作为参数并返回另一个组件的组件。\n\
    \n以前，高阶组件的角色是通过 mixin 来实现的。有些功能仍然只能通过 mixin 完成，我们将在下面介绍。\n\n# 简单示例\n\n让我们编写一个高阶函数，通过\
    \ props 向子组件传递一个随机数。Props 是高阶组件与子组件通信的方式。你还需要确保使用 `{...this.props}` 语法传递任何额外的\
    \ props。\n\n```\nfunction providesRandomNumber(Component) {\n  return class RandomNumberProvider\
    \ extends React.Component {\n    render(){\n      return <Component {...this.props}\
    \ randomNumber={4} />;\n    }\n  }\n}\n```\n\n然后我们可以使用这个函数来包装一个组件。\n\n```\nvar\
    \ MyComponent = providesRandomNumber(\n  class MyComponent extends React.Component\
    \ {\n    render(){\n      return (\n        <div>\n          The random number\
    \ is {this.props.randomNumber}\n        </div>\n      );\n    }\n  }\n);\n```\n\
    \n使用 [es7 装饰器](https://medium.com/@goncalvesjoao/react-es7-decorators-how-to-inject-props-to-your-render-method-27a0a7973106#.aji1vmw3g)\
    \ 提案会更简洁一些。\n\n```\n@providesRandomNumber\nclass MyComponent extends React.Component\
    \ {\n  render(){\n    return (\n      <div>\n        The random number is {this.props.randomNumber}\n\
    \      </div>\n    );\n  }\n}\n```\n\n## 技巧与提示\n\n通常高阶组件会接受选项。你可以进行柯里化，这意味着它可以像\
    \ `hoc(Component)`、`hoc({}, Component)` 或 `hoc({})(Component)` 这样调用。\n\n```\n\
    function hoc(options, Component){\n  if (typeof options === 'function') return\
    \ hoc({}, options);\n  if (arguments.length < 2) return hoc.bind(null, options\
    \ || {});\n\n  return class ...\n}\n```\n\n如果你有一个 mixin，你可以从 mixin 创建一个高阶组件，并将内容作为\
    \ props 传递下去。\n\n```\nimport {History} from 'react-router';\n\nfunction providesRouter(Component){\n\
    \  return React.createClass({\n    mixins: [History],\n\n    render(){\n     \
    \ return <Component \n        {...this.props} \n        router={{\n          pushState:\
    \ this.pushState,\n        }}\n      />\n    }\n  });\n}\n```\n\n作为一般规则，静态属性应该传递给创建的组件。\n\
    \n```\nfunction providesFoo(Component){\n  return Object.assign(class Foo extends\
    \ React.Component {\n    render(){\n      ...\n    }\n  }, Component);\n}\n```\n\
    \n### 常见用例\n\n高阶组件通常用于全局事件、绑定到 flux 存储、定时器以及任何你想以声明方式使用的命令式 API。\n\n# 小结\n\n高阶组件是消除代码重复、让组件专注于其独特之处的最强大工具之一。它们允许你使用强大的抽象，有些问题如果没有它们就无法优雅地解决。\n\
    \n即使你只打算在单个组件中使用高阶组件，它也能让你描述某种行为或角色，并将其提供给组件。它们减少了你在理解组件之前需要阅读的代码量，并允许你做一些丑陋的事情（例如管理\
    \ `__intervals`），而不会让你的组件变得丑陋。\n\n在阅读下一章关于 DOM 的内容时，思考你可以从组件中提取哪些行为和角色，甚至自己尝试一下。\n\
    \n# 第 8 章 DOM 操作\n\n"
- fmt: "\nFor the most part, React’s virtual DOM is sufficient to create the user\
    \ experience you want without having to work directly with the actual underlying\
    \ DOM at all. By composing components together you can weave complex interactions\
    \ together into a cohesive whole for the user.\n\nHowever, in some cases there\
    \ is no avoiding working with the underlying DOM to accomplish what you need.\
    \ The most common use cases for this are when you need to incorporate a third-party\
    \ library that does not use React, or when you need to perform an operation that\
    \ React does not natively support.\n\nTo facilitate this, React provides a system\
    \ for working with DOM nodes that are being managed by React. They are only accessible\
    \ during certain parts of the component lifecycle, but using them gives you the\
    \ power you need to handle these use cases.\n\n# Accessing managed DOM nodes\n\
    \nTo access DOM nodes managed by React, you must first be able to access the components\
    \ responsible for managing them. Adding a `ref` attribute to child components\
    \ allows you to do this.\n\n```\n class DoodleArea extends React.Component\n \
    \ render() {\n    return <canvas ref=\"mainCanvas\" />;\n  }\n}\n```\n\nThis will\
    \ make the underlying `<canvas>` DOM node accessible via `this.refs.mainCanvas`.\
    \ As you can imagine, the `ref` that you give a child component must be unique\
    \ among all of the component’s children; giving a different child a `ref` of `mainCanvas`\
    \ does not work.\n\nNote, you can’t reliably access the `<canvas>` node directly\
    \ in the `render` method, because the underlying DOM nodes may not be up-to-date\
    \ (or even created yet!) until `render` completes and React performs its updates.\n\
    \nYou can reliably access the `<canvas>` after your component has been mounted,\
    \ at which point the `componentDidMount` handler will run.\n\n```\n var DoodleArea\
    \ = React.createClass({\n  render: function() {\n    // We are unmounted inside\
    \ render(), so this will not go well!\n    doSomethingWith(this.refs.mainCanvas);\n\
    \n    return <canvas ref=\"mainCanvas\" />\n  },\n\n  componentDidMount: function()\
    \ {\n    doSomethingWith(this.refs.mainCanvas);\n    // This will work! We now\
    \ have access to the HTML5 Canvas node,\n    // and can invoke painting methods\
    \ on it as desired.\n  }\n});\n```\n\nNote that `componentDidMount` is not the\
    \ only place in which you can use `refs`. Event handlers also fire after a component\
    \ has mounted, so you can use it just as easily inside them as you would in a\
    \ `componentDidMount` handler.\n\n```\n var RichText = React.createClass({\n \
    \ render: function() {\n    return <div ref=\"editableDiv\" contentEditable=\"\
    true\" onKeyDown={this.handleKeyDown}>\n  },\n\n  handleKeyDown: function() {\n\
    \    var editor = this.refs.editableDiv;\n    var html = editor.innerHTML;\n\n\
        // Now we can persist the HTML content the user has entered.\n  }\n});\n```\n\
    \nThe above example creates a `div` with `contentEditable` enabled, allowing the\
    \ user to enter rich text into it.\n\nAlthough React does not natively provide\
    \ a way to access a component’s raw HTML contents, the `keyDown` handler can accesses\
    \ that div’s underlying DOM node, which in turn can access the raw HTML. From\
    \ there, you can save a copy of what the user has entered so far, compute a word\
    \ count to display, and so on.\n\n# Finding DOM Nodes by Component\n\nAlthough\
    \ refs are the preferred way of accessing underlying DOM nodes, sometimes you\
    \ may want to write some DOM-altering logic that works with any component regardless\
    \ of its refs, or perhaps you need to look one up the underlying DOM node for\
    \ an imported third-party component that does not set any refs.\n\nIn cases like\
    \ these, `ReactDOM.findDOMNode` is the answer.\n\n```\n var RichText = React.createClass({\n\
      render: function() {\n    return <div contentEditable=\"true\" onKeyDown={this.handleKeyDown}>\n\
      },\n\n  handleKeyDown: function() {\n    // NOTE: It would be preferable to\
    \ use a ref here\n    // instead of using findDOMNode.\n    var editor = ReactDOM.findDOMNode(this);\n\
    \    var html = editor.innerHTML;\n\n    // Now we can persist the HTML content\
    \ the user has entered.\n  }\n});\n```\n\nNote that the above is not the preferred\
    \ way of doing this. It would be better to use a ref for this as we did in the\
    \ previous section, as in that case the logic would not break if the `render`\
    \ function were modified to introduce something like a wrapper element. `findDOMNode`\
    \ should really only be used when a ref either will not work or would be excessively\
    \ burdensome to introduce.\n\nKeep in mind that although `refs` and `findDOMNode`\
    \ are powerful, they should only be used when there is no other way to achieve\
    \ the functionality you need. Using them hinders React’s ability to optimize performance\
    \ and increases the complexity of your application, so you should only reach for\
    \ them when conventional techniques fall short of the capabilities you need.\n\
    \n# Incorporating non-React libraries\n\nThere are many useful JavaScript libraries\
    \ that were not built with React in mind. Some do not need DOM access (date and\
    \ time manipulation libraries for example), but for those that do, keeping their\
    \ states synchronized with React is critical for successful integration.\n\nSuppose\
    \ you want to use an autocomplete library that includes the following example\
    \ code:\n\n```\n autocomplete({\n  target: document.getElementById(\"cities\"\
    ),\n  data: [\n    \"San Francisco\",\n    \"St. Louis\",\n    \"Amsterdam\",\n\
    \    \"Los Angeles\"\n  ], \n  events: {\n    select: function(city) {\n     \
    \ alert(\"You have selected the city of \" + city);\n    }\n  }\n});\n```\n\n\
    This `autocomplete` function needs a target DOM node, a list of strings to use\
    \ as data, and some event handlers. To reap the benefits of both React and this\
    \ library, you can start by building a React component that provides each of these.\n\
    \n```\n class AutocompleteCities extends React.Component {\n  render() {\n   \
    \ return <div ref=\"autocompleteTarget\" />\n  }\n\n  static defaultProps = {\n\
    \    data: [\n      \"San Francisco\",\n      \"St. Louis\",\n      \"Amsterdam\"\
    ,\n      \"Los Angeles\"\n    ]\n  };\n\n  handleSelect: function(city) {\n  \
    \  alert(\"You have selected the city of \" + city);\n  }\n});\n```\n\nTo finish\
    \ wrapping this library in React, add a `componentDidMount` handler that connects\
    \ the two implementations via the underlying DOM node of the `autocompleteTarget`\
    \ child component.\n\n```\n class AutocompleteCities extends React.Component {\n\
      render() {\n    return <div id=\"cities\" ref=\"autocompleteTarget\" />\n  }\n\
    \n  static defaultProps = {...};\n\n  handleSelect(city) {\n    alert(\"You have\
    \ selected the city of \" + city);\n  }\n\n  componentDidMount() {\n    autocomplete({\n\
    \      target: this.refs.autocompleteTarget,\n      data: this.props.data,\n \
    \     events: {\n        select: this.handleSelect\n      }\n    });\n  }\n};\n\
    ```\n\nNote that `componentDidMount` will only be called once per DOM node. As\
    \ such, you do not need to worry whether calling `autocomplete` (in this example)\
    \ twice on the same node will have any undesired effects.\n\nThat said, remember\
    \ that this component may be removed and re-rendered later to a different DOM\
    \ node, which can lead to memory leaks or other problems if your `componentDidMount`\
    \ has effects that can survive the DOM node’s removal. If this is a concern, make\
    \ sure to specify a `componentWillUnmount` handler to have the component clean\
    \ up after itself when its DOM node is going away.\n\n# Overreaching plugins\n\
    \nIn our autocomplete example, we assume `autocomplete` is a well-behaved plugin\
    \ that only modifies its children. In reality, this is often not the case.\n\n\
    To deal with these plugins, you need to hide them from React, to avoid errors\
    \ about the DOM being unexpectedly mutated. You may also need to do additional\
    \ cleanup.\n\nIn this example, we’re dealing with a fictional jQuery plugin that\
    \ emits custom events, and modifies the element it’s attached to. If you have\
    \ a very bad plugin that modifies parent elements, there’s nothing you can do,\
    \ and it’s incompatible with React. The best course of action is to find another\
    \ plugin or modify its source.\n"
