  trans: "\n\n假设你想使用间隔渲染在屏幕上移动一个 `div`。你可以通过给它设置 `position: absolute`，然后随时间更新它的 `left`\
    \ 或 `top` 样式属性来实现。在 `requestAnimationFrame` 上执行此操作，并根据经过的时间量来决定变化幅度，应该能实现平滑的动画。\n\
    \n下面是一个示例实现。\n\n```\n class Positioner extends React.Component {\n  constructor()\
    \ { super(); this.state = {position: 0} }\n\n  resolveAnimationFrame() {\n   \
    \ var timestamp = new Date();\n    var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp\
    \ - timestamp);\n\n    if (timeRemaining > 0) {\n      this.setState({position:\
    \ timeRemaining});\n    }\n  }\n\n  componentWillUpdate: function() {\n    if\
    \ (this.props.animationCompleteTimestamp) {\n      requestAnimationFrame(() =>\
    \ this.resolveAnimationFrame());\n    }\n  }\n\n  render() {\n    var divStyle\
    \ = {left: this.state.position};\n\n    return <div style={divStyle}>This will\
    \ animate!</div>\n  }\n});\n```\n\n在这个例子中，组件在其 `props` 中有一个 `animationCompleteTimestamp`\
    \ 值，它结合 `requestAnimationFrame` 回调返回的时间戳来计算剩余移动量。结果值存储在 `this.state.position`\
    \ 中，`render` 方法随后使用它来定位 `div`。\n\n由于 `componentWillUpdate` 处理程序调用了 `requestAnimationFrame`，因此组件\
    \ props 的任何更改（例如 `animationCompleteTimestamp` 的更改）都会触发它，这包括 `resolveAnimationFrame`\
    \ 内部对 `this.setState` 的调用。这意味着一旦设置了 `animationCompleteTimestamp`，组件将自动继续触发连续的\
    \ `requestAnimationFrame` 调用，直到当前时间超过 `animationCompleteTimestamp` 的值。\n\n请注意，此逻辑仅围绕时间戳展开。`animationCompleteTimestamp`\
    \ 的变化会启动它，而 `this.state.position` 的值完全取决于当前时间与 `animationCompleteTimestamp` 之间的差值。因此，`render`\
    \ 方法可以自由地将 `this.state.position` 用于任何类型的动画，从设置滚动位置到在画布上绘制，以及介于两者之间的任何操作。\n\n##\
    \ 使用 setTimeout 进行间隔渲染\n\n尽管 `requestAnimationFrame` 很可能以最小的开销为你带来最流畅的动画，但它在旧版浏览器中不可用，并且可能比你期望的更频繁（或更不可预测地）触发。在这些情况下，你可以改用\
    \ `setTimeout`。\n\n```\n var Positioner = React.createClass({\n  getInitialState:\
    \ function() { return {position: 0}; },\n\n  resolveSetTimeout: function() {\n\
    \    var timestamp = new Date();\n    var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp\
    \ - timestamp);\n\n    if (timeRemaining > 0) {\n      this.setState({position:\
    \ timeRemaining});\n    }\n  },\n\n  componentWillUpdate: function() {\n    if\
    \ (this.props.animationCompleteTimestamp) {\n      setTimeout(this.resolveSetTimeout,\
    \ this.props.timeoutMs);\n    }\n  },\n\n  render: function() {\n    var divStyle\
    \ = {left: this.state.position};\n\n    return <div style={divStyle}>This will\
    \ animate!</div>\n  }\n});\n```\n\n由于 `setTimeout` 接受一个显式的时间间隔，而 `requestAnimationFrame`\
    \ 自行决定该间隔，因此该组件额外依赖 `this.props.timeoutMs`，它指定了要使用的间隔。\n\n开源库 [React Tween State](https://github.com/chenglou/react-tween-state)\
    \ 为这种动画风格提供了一个方便的抽象层。\n\n## 弹簧动画\n\nCSS 过渡使用简单，有时也足够好。但它们有很多局限性，从仅支持贝塞尔曲线到无法在动画中途停止或过渡到新值。Web\
    \ 在这方面已经落后于潮流，因为它不支持在移动端和其他原生应用中常见的弹簧动画。\n\n这时就需要像 `react-motion`（[`github.com/chenglou/react-motion`](https://github.com/chenglou/react-motion)）这样的工具登场了。我们这里使用的是\
    \ `react-motion` 0.3.1，所以请务必查看与你版本对应的文档。\n\n首先，我们需要导入 `react-motion` 对过渡组的实现：\n\
    \n```\n import {TransitionMotion, spring} from 'react-motion';\n```\n\n然后我们可以在\
    \ `render` 中使用它。它的 API 有些奇特，我们传递一个函数作为子元素，而不是直接传递元素。然后它会将样式值的当前进度传递给该函数，并基于此进行渲染。\n\
    \n```\n <TransitionMotion\n  willEnter={() => ({ opacity: spring(0) })}\n  willLeave={()\
    \ => ({ opacity: spring(0) })}\n  styles={this.state.show ? {x: {opacity: spring(1)}}\
    \ : {}}\n>\n  {() => {\n    var {x} = styles;\n    if (!x) return null;\n    return\
    \ <div styles={x}>Hello world</div>;\n  }}\n</TransitionMotion>\n```\n\n当 `this.state.show`\
    \ 变为 `true` 时，它会以基于物理的漂亮过渡效果淡入，并以相同方式淡出。如果过渡尚未完成，它会平滑地过渡到新值。\n\n你可以完全用弹簧物理效果替换\
    \ CSS 过渡，以改善用户体验。\n\n# 总结\n\n使用这些动画技术，你现在可以：\n\n1.  使用 CSS3 和过渡组高效地实现状态之间的动画过渡。\n\
    \n2.  使用 `requestAnimationFrame` 在 CSS 之外进行动画，例如滚动位置和 Canvas 绘制。\n\n3.  在 `requestAnimationFrame`\
    \ 不可行的情况下，回退到 `setTimeout`。\n\n4.  实现弹簧动画。\n\n接下来，你将学习如何微调你的 React 性能！\n\n# 第\
    \ 11 章 性能调优\n\nReact 的 DOM diffing 允许你在任何时间点有效地丢弃整个 UI，而对 DOM 的影响最小。然而，在某些情况下，对组件进行精细调优以渲染新的虚拟\
    \ DOM 表示，可以帮助你的应用运行得更快。例如，当你有一个非常深的嵌套组件树时，这很有用。在本章中，我们将介绍一个简单的配置，你可以将其提供给组件以帮助加速你的应用。\n\
    \n# shouldComponentUpdate\n\n当组件更新时（无论是通过接收新的 props 还是调用 `setState`），React 都会调用该组件的每个子组件的\
    \ `render` 方法。在大多数情况下，这可以毫无问题地执行，但在具有深层嵌套组件树或复杂渲染方法的页面上，你可能会遇到一些卡顿。\n\n有时，组件的\
    \ `render` 方法会在不需要时被调用。当你的组件不使用 state 或 props，或者当父组件重新渲染时 props 或 state 没有变化时，就可能发生这种情况。因此，再次渲染组件将产生与已经存在的虚拟\
    \ DOM 表示完全相同的表示，这是不必要的。\n\nReact 提供了组件生命周期方法 `shouldComponentUpdate`，它让你能够帮助 React\
    \ 做出正确的决定，即是否调用特定组件的 `render` 方法。\n\n`shouldComponentUpdate` 应返回一个布尔值。`false`\
    \ 告诉 React 不要调用组件的 `render` 方法，并使用之前渲染的虚拟 DOM。返回 `true` 将告诉 React 调用组件的 `render`\
    \ 方法以获取新的虚拟 DOM 表示。默认情况下，`shouldComponentUpdate` 返回 `true`，因此组件总是会重新渲染。\n\n请注意，`shouldComponentUpdate`\
    \ 不会在组件的初始渲染时被调用。\n\n`shouldComponentUpdate` 接收新的 props 和 state 作为参数，以帮助你决定是否重新渲染。例如，一个只有一个\
    \ prop 且没有 state 的组件可以这样写：\n\n```\n shouldComponentUpdate(nextProps, nextState){\n\
        if (this.props.data !== nextProps.data) {\n      return true;\n    }\n   \
    \ return false;\n  }\n```\n\n"
- fmt: "\nFor pure components that always render the same given the same props and\
    \ state, you can add the `react-addons-pure-render-mixin`. Because we’re using\
    \ ES6 classes, we need a library called `react-mixin` ([https://github.com/brigand/react-mixin](https://github.com/brigand/react-mixin))\
    \ that allows you to use the mixin. This is one of the few cases where mixins\
    \ should be used instead of high order components.\n\nYou can read the full source\
    \ code of our example application, a reddit clone, at [http://git.io/vlcpa](http://git.io/vlcpa)\n\
    \nThe mixin will overwrite `shouldComponentUpdate` to compare the new props and\
    \ state with the old, and return false if they are equal like in the above example.\n\
    \nA few of the components are this simple, like `EditEssayQuestion`, which you\
    \ can use `React.addons.PureRenderMixin` with:\n\n```\nimport reactMixin from\
    \ 'react-mixin';\nimport PureRenderMixin from 'react-addons-pure-render-mixin';\n\
    class Foo extends React.Component {\n  render(){\n    ...\n  }\n}\nreactMixin.onClass(Foo,\
    \ PureRenderMixin);\n```\n\nIn cases where you have deep complex props or state,\
    \ the comparison can be slow. To help mitigate this, consider using immutable\
    \ data structures like those discussed in Chapter 16.\n\n# Key\n\nMost often you’ll\
    \ find the key prop used in lists. Its purpose is to identify a component to React\
    \ by more than the component class. For example, if you have a div with `key=\"\
    foo\"`, which later changes to `\"bar\"`, React will skip the diffing and throw\
    \ out the children completely, rendering from scratch.\n\nThis can be useful when\
    \ rendering large subtrees to avoid a diff, which you know is a waste of time.\
    \ In addition to telling it when to throw out a node, in many cases it can be\
    \ used when the order of elements changes. For example, consider the following\
    \ render that shows items based on a sorting function.\n\n```\nvar items = sortBy(this.state.sortingAlgorithm,\
    \ this.props.items);\nreturn items.map(function (item) {\n  return <img src={item.src}\
    \ />;\n});\n```\n\nIf the order changes, React will diff these and determine the\
    \ most efficient operation is to change the `src` attribute on some `img` elements.\
    \ This is very inefficient and will cause the browser to consult its cache, possibly\
    \ causing new network requests.\n\nTo remedy this, you can simply use some string\
    \ (or number) you know is unique to each item, and use it as a key.\n\n```\nreturn\
    \ <img src={item.src} key={item.id} />;\n```\n\nNow React will look at this and\
    \ instead of changing `src` attributes, it will realize the minimum `insertBefore`\
    \ operations to perform, which is the most efficient way to move DOM nodes.\n\n\
    In addition to the order changing, insertions that aren’t at the end also apply.\
    \ Without correct key attributes, prepending an item to the array causes the `src`\
    \ attribute of all following `<img>` tags.\n\nIt’s also valuable to note that\
    \ while you seemingly pass the key in as a prop, it is not accessible in anyway\
    \ from within a component.\n\n# Summary\n\nIn this chapter you learned how to:\n\
    \n1. Modify `shouldComponentUpdate` to return true/false for added performance.\n\
    \n2. Using `key` to help inform React of the minimum changes to a list of child\
    \ components.\n\nSo far we’ve focused on using React in the browser, next you’ll\
    \ learn about universal (also know as isomorphic) applications: JavaScript with\
    \ React on the server.\n\n# Chapter 12. Server side rendering\n\nServer side rendering\
    \ is vital if you want search engines to crawl your site. It also provides a performance\
    \ boost as the browser can start displaying your site while your JavaScript is\
    \ still loading.\n\nThe virtual DOM in React is central to why React can be used\
    \ for server side rendering. Each React component is first rendered to the virtual\
    \ DOM, then React takes the virtual DOM and updates the real DOM with any changes.\
    \ The virtual DOM, being an in memory representation of the DOM, is what allows\
    \ React to work in non browser environments like Node.js. Instead of updating\
    \ the real DOM, React can generate a string from the virtual DOM. This allows\
    \ you to use the same React components on the client and the server.\n\nReact\
    \ provides two functions that can be used to render your components on the server\
    \ side, `React.renderToString` and `React.renderToStaticMarkup`.\n\nServer side\
    \ rendering of your components requires foresight when designing your components.\
    \ You need to consider:\n\n* What render function is best to use.\n\n* How to\
    \ support Asynchronous state of your components.\n\n* How to pass your applications\
    \ initial state to the client.\n\n* What lifecycle functions are available on\
    \ the server side.\n\n* How to support Isomorphic routing for your application.\n\
    \n* Your usage of Singletons, Instances, and Context.\n\n# Render functions\n\n\
    When rendering your React components on the server side, you can’t use the standard\
    \ `React.render` method, since on the server side there is no DOM. React enables\
    \ server side rendering by providing two render functions that support a subset\
    \ of the standard React component lifecycle methods.\n\n## React.renderToString\n\
    \nThe first of the two render functions that can be used on the server side is\
    \ `React.renderToString`. This is function you will mostly use.\n\nUnlike `React.render`,\
    \ this function does not take an argument of where to render, instead it returns\
    \ a string. This is a synchronous (blocking) function that is very fast.\n\n```\n\
    var MyComponent = React.createClass({\n  render: function () {\n    return <div>Hello\
    \ World!</div>;\n  }\n});\n\nvar world = React.renderToString(<MyComponent/>);\n\
    \n//single line output - formatted for this example\n<div \n  data-reactid=\"\
    .fgvrzhg2yo\" \n  data-react-checksum=\"-1663559667\"\n>Hello World!</div>\n```\n\
    \nYou will notice that React has added two data attributes to the `<div>`.\n\n\
    `data-reactid` is used by React to identify the DOM node in the browser environment.\
    \ This is how it knows what DOM node to update when state and props change.\n\n\
    `data-react-checksum` is only added on the server side. As the name suggest it\
    \ is a checksum of the DOM that is created. This allows React to reuse the DOM\
    \ from the server when rendering the same component on the client. This is only\
    \ added to the root element.\n\n## React.renderToStaticMarkup\n\n`React.renderToStaticMarkup`\
    \ is the second render function you can use on the server side.\n\nThis is the\
    \ same as `React.renderToString`, except it doesn’t include the React data attributes.\n\
    \n```\nvar MyComponent = React.createClass({\n  render: function () {\n    return\
    \ <div>Hello World!</div>;\n  }\n});\n\nvar world = React.renderToStaticMarkup(<MyComponent/>);\n\
    \n//single line output\n<div>Hello World!</div>\n```\n\n## String or StaticMarkup\n\
    \nEach render function has it purposes, so you need to look at what your requirements\
    \ are to decide that render function to use.\n\nOnly use `React.renderToStaticMarkup`\
    \ when you are *not* going to render the same React component on the client.\n\
    \nHere are some examples:\n\n* Generating HTML emails.\n\n* Generating PDFs by\
    \ HTML to PDF conversion.\n\n* Testing components.\n\nIn most cases you will want\
    \ to use `React.renderToString`. This will allow React to use the `data-react-checksum`\
    \ to make the initialization of the same React component on the client much faster.\
    \ As React can reuse the DOM supplied from the server, it can skip the expensive\
    \ process of generating DOM nodes and attaching them to the document. For a complex\
    \ site, this can significantly reduce the load so your users can start interacting\
    \ with your site faster.\n\nIt is very important that your React components render\
    \ *exactly* the same on the server and on the client. If the `data-react-checksum`\
    \ doesn’t match, React will destroy the DOM supplied by the server and generate\
    \ new DOM nodes and attach them to the document. In this case you will lose much\
    \ of the performance gain of server side rendering.\n\n# Server side component\
    \ lifecycle\n"
