    \ There are a few tools to help you experiment with it if you’re still uncertain\
    \ or confused about how it works.\n\n## **The official JSX spec**\n\nIn September\
    \ of 2014 Facebook released [an official spec for JSX](http://facebook.github.io/jsx/),\
    \ stating its rationale for creating JSX, along with technical details of the\
    \ syntax.\n\nYou can read more at [http://facebook.github.io/jsx/](http://facebook.github.io/jsx/).\n\
    \n## In-browser experimenting\n\nThere are also a number of tools for experimenting\
    \ with JSX. The React docs [Getting](http://facebook.github.io/react/docs/getting-started.html)\
    \ [Started](http://facebook.github.io/react/docs/getting-started.html) page links\
    \ to JSFiddle playgrounds with and without JSX.\n\n[http://facebook.github.io/react/docs/getting-started.html](http://facebook.github.io/react/docs/getting-started.html)\n\
    \nFor actual projects, the official tool is babel, which also provides nearly\
    \ full ES6 support.\n\n[https://babeljs.io/](https://babeljs.io/)\n\nIn the next\
    \ chapter we will explore the component lifecycle in React.\n\n^([1](#ch02.html_idm139745275222416-marker))\
