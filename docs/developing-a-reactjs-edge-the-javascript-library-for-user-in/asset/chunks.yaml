    \ impossible to remove if they are missing their `key` attributes.\n\nNote that\
    \ even if the transition group only has a single child, it must still have a `key` attribute.\n\
    \n# Interval rendering\n\nYou can get great performance and concise code out of\
    \ CSS3 animations, but they are not always the right tool for the job. Sometimes\
    \ you have to target older browsers, which do not support them. Other times you\
    \ want to animate something other than a CSS property, such as scroll position\
    \ or a Canvas drawing. In these cases Interval Rendering will accommodate your\
    \ needs, but at a cost to performance compared to CSS3 animations.\n\nThe basic\
    \ idea behind Interval Rendering is to periodically trigger a component state\
    \ update that specifies how far the animation has progressed across its total\
    \ running time. By incorporating this state value into a component’s render function,\
    \ the component can represent the appropriate stage of the animation each time\
    \ the state change causes it to re-render.\n\nSince this approach involves many\
    \ re-renderings, it’s typically best to use it in conjunction with `requestAnimationFrame` in\
    \ order to avoid unnecessary renders. However, in environments where `requestAnimationFrame`\
    \ is unavailable or otherwise undesirable, falling back on the less-predictable `setTimeout`\
    \ can be the only alternative.\n\n## Interval rendering with requestAnimationFrame"
