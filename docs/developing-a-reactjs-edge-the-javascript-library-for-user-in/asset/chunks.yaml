  trans: "\n\n在传统 HTML 中，每个页面的基本构建块是元素。而在 React 中，你通过组件来组装页面。你可以将 React 组件视为一个融合了\
    \ JavaScript 全部表现力的 HTML 元素。事实上，使用 React 时，你*唯一*要做的事情就是构建组件，就像 HTML 文档完全由元素构成一样。\n\
    \n由于整个 React 应用都是由组件构建的，因此整本书都可以被描述为一本关于 React 组件的书。不过，在本章中我们不会涵盖与组件相关的*所有*内容。相反，你将了解其中一个特定方面——它们的可组合性。\n\
    \n组件本质上是一个 JavaScript 函数，它接收 `props` 和 `state` 作为参数，并输出渲染后的 HTML。它们通常被设计用来表示和表达应用程序中的某块数据，因此你可以将\
    \ React 组件视为 HTML 的扩展。\n\n在本章中，我们将使用 reddit 克隆示例应用中未出现的代码，因为一个 CRUD（创建、读取、更新、删除）应用能更好地说明这一点。\n\
    \n# 扩展 HTML\n\nReact + JSX 是强大且富有表现力的工具，允许你创建自定义元素，这些元素可以使用类似 HTML 的语法来表达。它们远远超越了纯\
    \ HTML，让你能够控制它们在整个生命周期中的行为。这一切都始于从 `React.Component` 继承。\n\nReact 推崇组合而非继承，这意味着你将小而简单的组件和数据对象组合成更大、更复杂的组件。使用\
    \ EcmaScript 6，你可以从 `React.Component` 继承，但它不鼓励更深层次的继承。相反，它鼓励构建可复用的、可组合的组件。\n\n\
    React 拥抱可组合性，允许你将各种子组件混合搭配，形成一个复杂而强大的新组件。为了演示这一点，让我们考虑用户如何回答一个调查问题。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
    \ 阅读我们示例应用（一个 reddit 克隆）的完整源代码。\n\n# 通过示例理解组合\n\n让我们考虑一个表示多项选择题的组件。它有几个需求：\n\n\
    * 接收一个选项列表作为输入\n* 将选项渲染给用户\n* 只允许用户选择一个选项\n\n我们知道 HTML 提供了一些基本元素来帮助实现，即单选类型的输入和输入组。从上到下思考，组件层次结构如下所示：\n\
    \n```\n MultipleChoice → RadioInput → Input (type=\"radio\")\n```\n\n你可以将这些箭头理解为表示“包含一个”的关系。`MultipleChoice`\
    \ 组件*包含一个* `RadioInput`。`RadioInput` *包含一个* input。这是组合模式的一个识别特征。\n\n## 组装 HTML\n\
    \n让我们从下到上开始组装组件。DOM 组件（以小写字母开头）由 React 提供。因此，你要做的第一件事就是将其包装在一个 `RadioInput` 组件中。这个组件将负责定制通用的\
    \ `input`，将其作用域缩小为像单选按钮一样工作。我们将其命名为 `AnswerRadioInput`。\n\n首先，创建脚手架，其中包括必需的 render\
    \ 方法和描述所需输出的基本标记。当组件成为一种专门的输入类型时，你已经可以开始看到组合模式了。\n\n```\n class AnswerRadioInput\
    \ extends React.Component {\n  render() {\n    return (\n      <div className=\"\
    radio\">\n        <label>\n          <input type=\"radio\" />\n          Label\
    \ Text\n        </label>\n      </div>\n    );\n  }\n}\n```\n\n**添加动态属性**\n\n\
    我们的 `input` 目前还没有任何动态内容，因此你需要定义父组件必须传递给单选输入的那些属性。\n\n* 这个输入代表什么值或选项？（必需）\n* 我们用什么文本来描述它？（必需）\n\
    * 输入的 `name` 是什么？（必需）\n* 我们可能想要自定义 `id`。\n* 我们可能想要覆盖默认的 `value`。\n\n根据这个列表，你现在可以为自定义输入定义属性类型。将这些添加到类定义的\
    \ `propTypes` 哈希中。\n\n```\n class AnswerRadioInput extends React.Component {\n\
    \    ...\n}\n\nAnswerRadioInput.propTypes = {\n  id: React.PropTypes.string,\n\
    \  name: React.PropTypes.string.isRequired,\n  label: React.PropTypes.string.isRequired,\n\
    \  value: React.PropTypes.string.isRequired,\n  checked: React.PropTypes.bool,\n\
    };\n```\n\n对于每个可选属性，你需要定义默认值。将这些添加到 `defaultProps` 静态成员中。当父组件未提供这些值时，这些值将应用于每个新实例。\n\
    \n```\n class AnswerRadioInput extends React.Component {\n  ...\n}\n\nAnswerRadioInput.PropTypes\
    \ = {...};\nAnswerRadioInput.defaultProps = {\n  id: null,\n  checked: false\n\
    };\n```\n\n## 跟踪状态\n\n我们的组件需要跟踪随时间变化的数据。具体来说，`id` 对于每个实例是唯一的，并且用户可以随时更新 `checked`\
    \ 值。因此，让我们定义初始状态。\n\n这发生在 React 组件的 `constructor` 中。我们只需用默认状态设置 `this.state` 哈希。\n\
    \n注意，我们还调用了 `super(props)` 以使用默认的 prop 行为。\n\n```\n class AnswerRadioInput extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    var id = props.id\
    \ ? props.id : uniqueId('radio-');\n    this.state = {\n      checked: !!props.checked,\n\
    \      id: id,\n      name: id\n    };\n\n  }\n  ...\n}\n\nAnswerRadioInput.PropTypes\
    \ = {...};\nAnswerRadioInput.defaultProps = {...};\n```\n\n现在你可以更新渲染的标记以访问新的动态状态和\
    \ props。\n\n```\n class AnswerRadioInput = React.createClass({\n\n  constructor(props)\
    \ {...}\n\n  render() {\n    return (\n      <div className=\"radio\">\n     \
    \   <label htlmFor={this.props.id}>\n          <input type=\"radio\"\n       \
    \     name={this.props.name}\n            id={this.props.id}\n            value={this.props.value}\n\
    \            checked={this.state.checked} />\n          {this.props.label}\n \
    \       </label>\n      </div>\n    );\n  }\n}\n\nAnswerRadioInput.PropTypes =\
    \ {...};\nAnswerRadioInput.defaultProps = {...};\n```\n\n## 集成到父组件中\n\n至此，你已经有了一个足够完整的组件，可以在父组件中使用它，因此你可以开始构建下一层，即\
    \ `AnswerMultipleChoiceQuestion`。它的主要职责是显示一个选项列表供用户选择。按照上面介绍的模式，让我们为这个组件铺设基本的\
    \ HTML 和默认 props。\n\n```\n class AnswerMultipleChoiceQuestion extends React.Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      id:\
    \ uniqueId('multiple-choice-'),\n      value:props.value\n    };\n  }\n  render()\
    \ {\n    return (\n      <div className=\"form-group\">\n        <label className=\"\
    survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n     \
    \   <div className=\"survey-item-content\">\n              <AnswerRadioInput ...\
    \ />\n          ...\n          <AnswerRadioInput ... />\n        </div>\n    \
    \  </div>\n    );\n  }\n}\n\nAnswerMultipleChoiceQuestion.propTypes = {\n  value:\
    \ React.PropTypes.string,\n  choices: React.PropTypes.array.isRequired,\n  onCompleted:\
    \ React.PropTypes.func.isRequired\n};\n```\n\n为了生成子单选输入组件的列表，你必须遍历 choices 数组，将每个选项转换为一个组件。这可以通过一个辅助函数轻松处理，如下所示。\n\
    \n"
- fmt: "\n```\nclass AnswerMultipleChoiceQuestion = React.createClass({\n\n  ...\n\
      renderChoices() {\n    return this.props.choices.map((choice, i) => {\n     \
    \ return (\n         <AnswerRadioInput\n          id={\"choice-\" + i}\n     \
    \     name={this.state.id}\n          label={choice}\n          value={choice}\n\
    \          checked={this.state.value === choice}\n         />\n      );\n    });\n\
      }\n\n  render() {\n    return (\n      <div className=\"form-group\">\n     \
    \   <label className=\"survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n\
            <div className=\"survey-item-content\">\n            {this.renderChoices()}\n\
            </div>\n      </div>\n    );\n  }\n}\n```\n\nNow the composability of\
    \ React is becoming clearer. You started with a generic input, customized it into\
    \ a radio input, and finally wrapped it into a multiple-choice component—a highly\
    \ refined and specific version of a form control. Now rendering a list of choices\
    \ is as simple as this:\n\n```\n<AnswerMultipleChoiceQuestion choices={arrayOfChoices}\
    \ ... />\n```\n\nThe astute reader has probably noticed there is a missing piece—our\
    \ radio inputs have no way of communicating changes to their parent component.\
    \ You need to wire up the `AnswerRadioInput` children so the parent is aware of\
    \ their changes and can process them into a proper survey-result data payload.\
    \ This brings us to the parent/child relationship.\n\n# Parent / child relationship\n\
    \nAt this point you should be able to render a form to the screen with our example,\
    \ but notice that you have yet to give the components the ability to share user\
    \ changes. The `AnswerRadioInput` component does not yet have the ability to communicate\
    \ with its parent.\n\nThe easiest way for a child to communicate with its parent\
    \ is via props. The parent needs to pass in a callback via the props, which the\
    \ child calls when needed.\n\nFirst you need to define what `AnswerMultipleChoiceQuestion`\
    \ will do with the changes from its children. Add a `handleChanged` method and\
    \ pass it into each `AnswerRadioInput`.\n\nWhen we use EcmaScript 6 classes, methods\
    \ aren’t auto bound to the instance by default. You can set up this wiring in\
    \ the `constructor` like below, or when you pass it in as the `onChanged` prop.\n\
    \n```\nclass AnswerMultipleChoiceQuestion extends React.Component {\n  constructor(props)\
    \ {\n    ...\n    this.handleChanged = this.handleChanged.bind(this);\n  }\n\n\
      handleChanged(value) {\n    this.setState({value: value});\n    this.props.onCompleted(value);\n\
      }\n\n  renderChoices() {\n    return this.props.choices.map((choice, i) => {\n\
    \n       return (\n        <AnswerRadioInput\n          id={\"choice-\" + i}\n\
              name={this.state.id}\n            label={choice}\n          value={choice}\n\
             checked={this.state.value === choice}\n          onChanged={this.handleChanged}\n\
            />\n      );\n    });\n  }\n  ...\n}\n```\n\nNow, each radio input can\
    \ watch for user changes, passing the value up to the parent. This requires wiring\
    \ up an event handler to the input’s `onChange` event.\n\n```\nclass AnswerRadioInput\
    \ extends React.Component {\n  constructor(props) {\n     ...\n    this.handleChanged\
    \ = this.handleChanged.bind(this);\n  }\n\n  handleChanged(e) {\n    var checked\
    \ = e.target.checked;\n    this.setState({checked: checked});\n    if (checked)\
    \ {\n      this.props.onChanged(this.props.value);\n    }\n  }\n\n  render() {\n\
        return (\n      <div className=\"radio\">\n        <label htmlFor={this.state.id}>\n\
              <input type=\"radio\"\n            ...\n            onChange={this.handleChanged}\
    \ />\n          {this.props.label}\n        </label>\n      </div>\n    );\n \
    \ }\n}\n\nAnswerRadioInput.propTypes: {\n  ...\n  onChanged: React.PropTypes.func.isRequired\n\
    };\n```\n\n# Wrap up\n\nYou’ve now seen how React uses the pattern of composability,\
    \ allowing you to wrap HTML elements or custom components and customize their\
    \ behavior for your needs. As you use components they become more specific and\
    \ semantically meaningful. Thus, React takes generic inputs:\n\n```\n<input type=\"\
    radio\" ... />\n```\n\nThis transforms them into something a bit more meaningful:\n\
    \n```\n<AnswerRadioInput ... />\n```\n\nYou finally end up with a single component\
    \ to transform an array of data into a useful UI for users to interact with.\n\
    \n```\n<AnswerMultipleChoiceQuestion choices={arrayOfChoices} ... />\n```\n\n\
    Composition is just one way React offers to customize and specialize your components.\
    \ Mixins offer another approach, allowing you to define methods that can be shared\
    \ across many components. Next, we show you how to define a mixin and how they\
    \ can be used to share common code.\n\n# Chapter 7. High Order Components and\
    \ Mixins\n\nThere are two special kinds of abstraction with React. High order\
    \ components are components that take a component as an argument and return another\
    \ component.\n\nPreviously, the role of high order components was solved with\
    \ mixins. A few things can still only be done with mixins, which we’ll cover below.\n\
    \n# Simple Example\n\nLet’s write a high order function that passes a random number\
    \ to the child via props. Props are how high order components talk to child components.\
    \ You also need to make sure you pass any extra props down using the `{...this.props}`\
    \ syntax.\n\n```\nfunction providesRandomNumber(Component) {\n  return class RandomNumberProvider\
    \ extends React.Component {\n    render(){\n      return <Component {...this.props}\
    \ randomNumber={4} />;\n    }\n  }\n}\n```\n\nWe can then use this function to\
    \ wrap a component.\n\n```\nvar MyComponent = providesRandomNumber(\n  class MyComponent\
    \ extends React.Component {\n    render(){\n      return (\n        <div>\n  \
    \        The random number is {this.props.randomNumber}\n        </div>\n    \
    \  );\n    }\n  }\n);\n```\n\nThis is a bit cleaner with the [es7 decorators](https://medium.com/@goncalvesjoao/react-es7-decorators-how-to-inject-props-to-your-render-method-27a0a7973106#.aji1vmw3g)\
    \ proposal.\n\n```\n@providesRandomNumber\nclass MyComponent extends React.Component\
    \ {\n  render(){\n    return (\n      <div>\n        The random number is {this.props.randomNumber}\n\
    \      </div>\n    );\n  }\n}\n```\n\n## Tips and Tricks\n\nOften a high order\
    \ component takes options. You can curry it, which means it can be called like\
    \ `hoc(Component)`, `hoc({}, Component)`, or `hoc({})(Component)`.\n\n```\nfunction\
    \ hoc(options, Component){\n  if (typeof options === 'function') return hoc({},\
    \ options);\n  if (arguments.length < 2) return hoc.bind(null, options || {});\n\
    \n  return class ...\n}\n```\n\nIf you have a mixin, you can create a high order\
    \ component from the mixin and pass things down as props.\n\n```\nimport {History}\
    \ from 'react-router';\n\nfunction providesRouter(Component){\n  return React.createClass({\n\
    \    mixins: [History],\n\n    render(){\n      return <Component \n        {...this.props}\
    \ \n        router={{\n          pushState: this.pushState,\n        }}\n    \
    \  />\n    }\n  });\n}\n```\n\nAs a general rule, static properties should be\
    \ passed down to the component you create.\n\n```\nfunction providesFoo(Component){\n\
    \  return Object.assign(class Foo extends React.Component {\n    render(){\n \
    \     ...\n    }\n  }, Component);\n}\n```\n\n### Common Use Cases\n\nHigh order\
    \ components are typically used for global events, binding to flux stores, timers,\
    \ and any other imperative APIs that you want to use declaratively.\n\n# Summary\n\
    \nHigh order components are one of the most powerful tools for eliminating code\
    \ repetition, and keeping your components focused on what makes them special.\
    \ They allow you to use powerful abstractions, and some problems can’t be solved\
    \ elegantly without them.\n\nEven if you only intend to use a high order component\
    \ in a single component, it allows you to describe a certain behavior or role,\
    \ and provide that to the component. They reduce the amount of code you need to\
    \ read before understanding a component, and allow you to do ugly things (such\
    \ as managing `__intervals`) without making your component ugly.\n\nWhen reading\
    \ the next chapter about DOM, think about the behaviors and roles you could pull\
    \ out of the components, or even try for yourself.\n\n# Chapter 8. DOM manipulation\n"
