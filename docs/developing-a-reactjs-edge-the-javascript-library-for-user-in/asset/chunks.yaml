  trans: "\n\n当渲染为字符串时，只有*在*渲染之前的生命周期方法会被调用。关键的是，`componentDidMount` 和 `componentWillUnmount`\
    \ 在渲染过程中不会被调用，而 `componentWillMount` 在两端都会被调用。\n\n在创建将在服务器和客户端上渲染的组件时，你需要牢记这一点。尤其是在创建事件监听器时，因为没有组件生命周期方法可以告知你\
    \ React 组件何时完成渲染。\n\n在 `componentWillMount` 中启动的任何事件监听器或定时器都可能导致服务器上的内存泄漏。\n\n\
    最佳实践是仅在 `componentDidMount` 中创建事件监听器和定时器，并在 `componentWillMount` 中停止它们。\n\n##\
    \ 设计组件\n\n在服务器端渲染时，你需要特别考虑如何将状态传递给客户端，以充分利用服务器端渲染的性能优势。这意味着在设计组件时就要考虑到服务器端渲染。\n\
    \n你应该始终这样设计 React 组件：当向组件传递相同的 props 时，你总是会得到相同的*初始*渲染结果。如果始终这样做，你将提高组件的可测试性，并且可以保证在服务器和客户端上渲染的结果相同。这对于确保获得服务器端渲染的性能优势非常重要。\n\
    \n假设你想要一个打印随机数的组件。这会带来问题，因为结果几乎总是不同的。如果这个组件先在服务器上渲染，然后在客户端上渲染，校验和将会失败。\n\n```\n\
    \ var MyComponent = React.createClass({\n  render: function () {\n    return <div>{Math.random()}</div>;\n\
    \  }\n});\n\nvar result = React.renderToStaticMarkup(<MyComponent/>);\nvar result2\
    \ = React.renderToStaticMarkup(<MyComponent/>);\n\n//result\n<div>0.5820949131157249</div>\n\
    \n//result2 \n<div>0.420401572631672</div>\n```\n\n如果你修改组件，让它通过 props 接收随机数，那么你就可以将\
    \ props 传递给客户端用于渲染。\n\n```\n var MyComponent = React.createClass({\n  render:\
    \ function () {\n    return <div>{this.props.number}</div>;\n  }\n});\n\nvar num\
    \ = Math.random();\n\n//服务器端\nReact.renderToString(<MyComponent number={num}/>);\n\
    \n//将 num 传递给客户端\nReact.render(<MyComponent number={num}/>, document.body);\n\
    ```\n\n有多种方式可以将服务器上使用的 props 发送给客户端。\n\n最简单的方法之一是通过 JavaScript 对象将初始 props 传递给客户端。\n\
    \n```\n <!DOCTYPE html>\n<html>\n<head>\n<title>示例</title>\n<!-- bundle 包含 MyComponent、React\
    \ 等 -->\n<script type=\"text/javascript\" src=\"bundle.js\"></script>\n</head>\n\
    <body>\n<!-- MyComponent 服务器端渲染的结果 -->\n<div data-reactid=\".fgvrzhg2yo\" data-react-checksum=\"\
    -1663559667\">\n0.5820949131157249</div>\n\n<!-- 注入服务器端使用的初始 props -->\n<script\
    \ type=\"text/javascript\">\n  var initialProps = {\"num\": 0.5820949131157249};\n\
    </script>\n\n<!-- 使用来自服务器的初始 prop -->\n<script type=\"text/javascript\">\n  var\
    \ num = initialProps.num;\n  React.render(<MyComponent number={num}/>, document.body);\n\
    </script>\n</body>\n</html>\n```\n\n## 异步状态\n\n许多应用程序需要从远程数据源（如数据库或 Web 服务）获取数据。在客户端，这不是问题。React\
    \ 组件可以在等待异步数据返回时显示加载视图。在服务器端，这种行为无法直接用 React 复制，因为渲染函数是同步的。为了使用异步数据，你需要先获取数据，然后在渲染时将数据传递给组件。\n\
    \n**示例：**\n\n你可能希望从异步存储中获取用户记录，以便在组件中使用。\n\n**并且**\n\n你希望组件在获取用户记录后的状态在服务器端渲染，以利于\
    \ SEO 和性能。\n\n**并且**\n\n你希望组件在客户端监听变化并重新渲染。\n\n**问题：** 你不能使用任何组件生命周期方法来获取异步数据，因为\
    \ `React.renderToString` 是同步的。\n\n**解决方案：** 使用静态函数获取异步数据，然后将其传递给组件进行渲染。将 `initialState`\
    \ 作为 props 传递给客户端。使用组件生命周期方法监听变化并更新状态，同时使用相同的 `statics` 函数。\n\n```\n var Username\
    \ = React.createClass({\n  statics: {\n    getAsyncState: function (props, setState)\
    \ {\n      User.findById(props.userId)\n        .then(function (user) {\n    \
    \      setState({user:user});\n        })\n        .catch(function (error) {\n\
    \          setState({error: error});\n        });\n    }\n  },\n  //客户端和服务器端\n\
    \  componentWillMount: function () {\n    if (this.props.initialState) {\n   \
    \   this.setState(this.props.initialState);\n    }\n  },\n  //仅客户端\n  componentDidMount:\
    \ function () {\n    //如果 props 中没有 initialState，则获取异步状态\n    if (!this.props.initialState)\
    \ {\n      this.updateAsyncState();\n    }\n    //监听变化\n    User.on('change',\
    \ this.updateAsyncState);\n  },\n  //仅客户端\n  componentWillUnmount: function ()\
    \ {\n    //停止监听变化\n    User.off('change', this.updateAsyncState);\n  },\n  updateAsyncState:\
    \ function () {\n    //从实例内部访问静态函数\n    this.constructor.getAsyncState(this.props,\
    \ this.setState);\n  },\n  render: function () {\n    if (this.state.error) {\n\
    \      return <div>{this.state.error.message}</div>;\n    }\n    if (!this.state.user)\
    \ {\n      return <div>加载中...</div>;\n    }\n    return <div>{this.state.user.username}</div>;\n\
    \  }\n});\n\n//在服务器端渲染\n\nvar props = {\n  userId: 123 //也可以从路由派生\n};\n\nUsername.getAsyncState(props,\
    \ function(initialState){\n  props[initialState] = initialState;\n  var result\
    \ = React.renderToString(Username(props));\n\n  //将结果连同 initialState 发送给客户端\n\
    });\n```\n\n使用上述解决方案，仅在服务器端需要预取异步数据。在客户端，初始渲染只需查找从服务器传递的 `initialState`。后续客户端路由变化（例如\
    \ HTML5 pushState 或片段变化）应忽略来自服务器的任何 `initialState`。你还需要在数据获取期间显示加载消息。\n\n## 同构路由\n\
    \n路由是任何非平凡应用程序的重要组成部分。要在服务器端使用路由器渲染 React 应用程序，你需要确保路由器支持在没有 DOM 的情况下进行渲染。\n\n\
    异步数据的获取是路由器和其路由控制器的职责。假设一个深层嵌套的组件需要一些异步数据。如果这些数据是 SEO 所需的，那么获取数据的责任应上移至路由控制器，并将数据向下传递给深层嵌套的组件。如果不需要用于\
    \ SEO，那么只需在客户端的 `componentDidMount` 中获取数据即可。这类似于经典的 AJAX 加载数据。\n\n在寻找 React 的同构路由解决方案时，请确保它支持异步状态，或者可以轻松修改以支持异步状态。理想情况下，你还希望路由器处理将\
    \ `initialState` 传递给客户端。\n\n## 单例、实例和上下文\n\n在浏览器中，你的应用程序被封装在一个隔离的“气泡”中。应用程序的每个实例不能与其他实例混合状态，因为每个实例通常位于不同的计算机上，或者在同一台计算机上被沙箱隔离。这使得你可以轻松地在应用程序架构中使用单例。\n\
    \n"
- fmt: "\nWhen you start moving your code to operate on the server, you need to be\
    \ careful, since you may be having multiple instances of your application running\
    \ at the same time, in the same scope. This has the potential that two instances\
    \ of your application may mutate the state of a singleton, resulting in unwanted\
    \ behavior.\n\n`React` render is synchronous, so you can reset all singletons\
    \ used prior to rendering your application on the server side. You will have issues\
    \ if asynchronous state requires use of the singletons. Also, you will need to\
    \ account for this when fetching the asynchronous state for use in render.\n\n\
    Even with resetting singletons, prior to render, running your application in isolation\
    \ will always be better. Packages like `Contextify` allow you to run your code\
    \ in isolation from one another on the server. It is similar to using webworkers\
    \ on the client. `Contextify` works by taking your application code and running\
    \ it in a separate Node.js V8 instance. Once the code is loaded you can invoke\
    \ functions in the context. This approach will give you the freedom to use singletons\
    \ but does come at a performance cost since a new Node.js V8 instance will need\
    \ to be started for every request.\n\nThe core development team of `React` discourage\
    \ the use of passing context and instances down your component tree. This makes\
    \ your components less portable and changes to the dependencies of one component\
    \ deep in your application have a flow on effects with all of the components up\
    \ the component hierarchy. This in turn increases the complexity of your application,\
    \ reducing maintainability as your application grows.\n\nThere are trade-offs\
    \ with each approach when deciding to use singletons or instances to control your\
    \ context. You will need to assess your specific requirements before deciding\
    \ what approach you will want to take. You will also need to consider how the\
    \ third party libraries you use are architected.\n\n# Summary\n\nServer side rendering\
    \ is an important part of building search engine optimized web sites and web applications.\
    \ `React` supports the rendering of the same `React` components on the server\
    \ and the client browser. To do this effectively, you will need to ensure your\
    \ entire application is architected in such a manner to support server side rendering.\n\
    \nNext up you will you learn about development and build tools in the `React`\
    \ family.\n\n# Chapter 13. Development tools\n\n`React` leverages a few layers\
    \ of abstraction to help ease development of your components and reason about\
    \ the state of your applications. These abstractions have a down side when it\
    \ comes to debugging, building and shipping your applications.\n\nFortunately,\
    \ there are some fantastic development tools available to help in the process\
    \ of debugging and building your applications. In this chapter we will explore\
    \ the build tools and the debugging tools that you can use effectively with `React`.\n\
    \n# Build tools\n\nBuild tools help you streamline repetitive tasks to make the\
    \ process of running your code much easier. One of the most repetitive tasks in\
    \ `React` development is running the JSX parser over all of your `React` components.\
    \ The other big task is bundling all of your modules into one or more bundles\
    \ for shipping to the browser.\n\nLet’s examine how to use two popular JavaScript\
    \ build tools, `Browserify` and `Webpack`, with `React`.\n\n# Browserify\n\n`Browserify`\
    \ is a JavaScript packaging tool that allows for Node.js style `require()` calls\
    \ in the browser. Without getting into too much detail and getting lost in the\
    \ woods, `Browserify` packages all of the requires into a bundled JavaScript file\
    \ suitable for running in the browser environment. Running `Browserify` on any\
    \ JavaScript file with `require` statements will automatically bundle the necessary\
    \ JavaScript.\n\nWhile powerful, `Browserify` is only for JavaScript, unlike `Bower`,\
    \ `Webpack`, or other bundling solutions.\n\n## Setup a Browserify project\n\n\
    To get `Browserify` up and running, you must initialize a node project. Assuming\
    \ you already have both node and npm installed, you can initialize a new project\
    \ using the following command in your terminal. This will create a `package.json`\
    \ file with the necessary assets.\n\n```\nnpm init\n# ... answer questions as\
    \ necessary to complete init\nnpm install --save-dev browserify babelify \\\n\
    babel-preset-es2015 babel-preset-react \\\nbabel-preset-stage-1 \\\nreact uglify-js\n\
    ```\n\nAdd the following build script to the bottom of your `package.json` file\
    \ so it will look similar to this:\n\n```\n ...\n  \"devDependencies\": {\n  \
    \  \"browserify\": \"^5.11.2\",\n    \"babelify\": \"^6\",\n    \"react\": \"\
    ^0.11.1\",\n    \"uglify-js\": \"^2.4.15\",\n     ...\n  },\n  \"scripts\": {\n\
    \    \"build\": \"browserify --debug index.js > bundle.js\",\n    \"build-dist\"\
    : \"NODE_ENV=production browserify index.js | uglifyjs -m > bundle.min.js\"\n\
    \  },\n  \"browserify\": {\n    \"transform\": [\"babelify\"]\n  }\n}\n```\n\n\
    Also create a file called `.babelrc` that tells babel which transforms to use.\n\
    \n```\n {\n  \"presets\": [\"es2015\", \"react\", \"stage-1\"]\n}\n```\n\nThe\
    \ default build task can be run with `npm run build`, and will create a bundle\
    \ with source maps. This lets you inspect error messages and place breakpoints\
    \ as if each file was included individually. You’ll also see the original code\
    \ with JSX rather than the compiled output.\n\nFor production builds you need\
    \ to specify that the environment is production. `React` uses a transform called\
    \ `envify`, which when combined with a minifier like `uglify`, allows debug code\
    \ and detailed error messages to be removed for better performance and smaller\
    \ file sizes.\n\nNow you’re ready to write some `React` and package it.\n\n# Add\
    \ some React content\n\nCreate the following `React` + JSX JavaScript file as\
    \ `index.js`.\n\n```\nvar React = require('react');\nvar ReactDOM = require('react-dom');\n\
    \nvar root = document.getElementById('root');\nReactDOM.render(<h1>Hello World</h1>,\
    \ root);\n```\n\nAnd add a basic `index.html` file:\n\n```\n<html>\n  <head>\n\
    \    <title>React + Browserify Demo</title>\n  </head>\n  <body>\n\n    <div id=\"\
    root\"></div>\n    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\
    \nNow your project will have the following files and folders inside its root directory:\n\
    \n*   `index.html`\n*   `index.js`\n*   `node_modules/`\n*   `package.json`\n\n\
    If you try to load the `index.html` file now, it will fail to render the JavaScript\
    \ since you have yet to build the final package. Run `npm run build` and reload\
    \ the page to see your hello world example.\n\n## Watchify\n\nYou may choose to\
    \ add a watch task, which is good for development. `Watchify` is a wrapper around\
    \ `Browserify`, which rebuilds your bundle when you change a file. It uses caching\
    \ to speed up the rebuilds.\n\n```\nnpm install --save-dev watchify\n```\n\nAdd\
    \ this to your scripts object in `package.json`:\n\n```\n\"watch\": \"watchify\
    \ --debug index.js -o bundle.js\"\n```\n\nNow instead of `npm run build`, you\
    \ can `npm run watch` for a smoother development experience.\n\n## Build\n\nNow,\
    \ simply run the build script to package your `React` + JSX file as a bundled\
    \ script for the browser.\n\n```\nnpm run-script build\n```\n\nYou should see\
    \ a new `bundle.js` file appear. If you open `bundle.js` you’ll notice some minified\
    \ JavaScript at the top, followed by your transformed `React` + JSX code. This\
    \ file now contains all of the supporting code along with your `index.js` file,\
    \ ready to run in the browser, and loading `index.html` will now succeed.\n\n\
    ## Webpack\n\n`Webpack` is like `Browserify`, it bundles up your JavaScript into\
    \ a single package. It isn’t quite fair, however, to compare `Browserify` and\
    \ `Webpack`, because `Webpack` has many more features, and `Browserify` is not\
    \ often used on its own.\n\n`Webpack` can also:\n\n*   Bundle CSS, images and\
    \ other assets into the same package.\n*   Pre-process files before bundling (less,\
    \ coffee, jsx, etc).\n*   Split your bundle into multiple files based on entry\
    \ locations.\n*   Support feature flags for development.\n*   Perform “hot” module\
    \ replacement.\n*   Support asynchronous loading.\n"
