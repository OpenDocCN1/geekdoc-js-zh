  trans: "\nOm 及其后继者 Om Next 是非常流行的 ClojureScript 接口，用于 React。ClojureScript 的持久化数据结构使得实现诸如撤销等原本复杂的功能变得非常简单。Om\
    \ Next 融合了 Om 社区的经验，提供了更好的体验。与 Relay 类似，Om Next 允许你直接在组件上指定组件的数据需求。在 Om Next 中，这些查询使用\
    \ Datomic Pull 语法指定，这是一种用于 Datomic 的查询语法，Datomic 是一种常用于 ClojureScript 项目的数据库。\n\
    \n下面是一个完整的 Om Next 应用！\n\n```\n (ns om-tutorial.core\n  (:require [goog.dom :as\
    \ gdom]\n            [om.next :as om :refer-macros [defui]]\n            [om.dom\
    \ :as dom]\n            [datascript.core :as d]))\n\n(def app-state\n  (atom\n\
    \    {:app/title \"Animals\"\n     :animals/list\n     [[1 \"Crow\"] [2 \"Antelope\"\
    ] [3 \"Bird\"] [4 \"Cat\"] [5 \"Dog\"]\n      [6 \"Lion\"] [7 \"Mouse\"] [8 \"\
    Monkey\"] [9 \"Snake\"] [10 \"Zebra\"]]}))\n\n(defmulti read (fn [env key params]\
    \ key))\n\n(defmethod read :default\n  [{:keys [state] :as env} key params]\n\
    \  (let [st @state]\n    (if-let [[_ value] (find st key)]\n      {:value value}\n\
    \      {:value :not-found})))\n\n(defmethod read :animals/list\n  [{:keys [state]\
    \ :as env} key {:keys [start end]}]\n  {:value (subvec (:animals/list @state)\
    \ start end)})\n\n(defui AnimalsList\n  static om/IQueryParams\n  (params [this]\n\
    \    {:start 0 :end 10})\n  static om/IQuery\n  (query [this]\n    '[:app/title\
    \ (:animals/list {:start ?start :end ?end})])\n  Object\n  (render [this]\n  \
    \  (let [{:keys [app/title animals/list]} (om/props this)]\n      (dom/div nil\n\
    \               (dom/h2 nil title)\n               (apply dom/ul nil\n       \
    \               (map\n                        (fn [[i name]]\n               \
    \           (dom/li nil (str i \". \" name)))\n                        list))))))\n\
    \n(def reconciler\n  (om/reconciler\n    {:state app-state\n     :parser (om/parser\
    \ {:read read})}))\n\n(om/add-root! reconciler\n              AnimalsList (gdom/getElement\
    \ \"app\"))\n```\n\n这段代码渲染了一个无序列表，列出了文件顶部附近定义为 `app-state` 的动物名称。\n\n你可以在这里了解更多关于\
    \ Om 和 ClojureScript 的信息：[`github.com/omcljs/om`](https://github.com/omcljs/om)。\n\
    \n## 总结\n\n到目前为止，你已经看到了许多可以与 React 一起使用的架构模式。从标准的 Flux 模式，到像 Reflux 这样的 Flux 变体，再到像\
    \ Om 和 ClojureScript 这样完全不同的语言和生态系统，React 已经证明了自己具有很强的适应性。\n\n接下来，你可以阅读关于在 React\
    \ 应用中使用不可变性的内容，这是 Redux 和 Om 的核心概念。\n\n# 第 16 章 不可变性\n\n一种越来越流行的使用 React 的方式是与不可变数据结构结合——即那些在实例化后永远不会改变的数据结构。\n\
    \n不可变性是否适合你的应用，以及如果适合，应该采用哪个不可变库，取决于你的具体用例。在本章中，我们将介绍不可变性的好处和代价，并介绍三个你可以用来将其集成到\
    \ React 应用中的不同库。\n\n## 性能优势\n\n在 React 应用中，不可变性最明显的好处在于它对 `shouldComponentUpdate`\
    \ 的影响。虽然 `shouldComponentUpdate` 可以带来巨大的性能提升，但随着 `shouldComponentUpdate` 处理程序本身复杂性的增加，这些提升往往会减弱甚至消失。\n\
    \n假设你有一个 `shouldComponentUpdate`，它只需要检查 `props` 中的一个字段就能决定返回 `true` 还是 `false`。那会运行得很快！现在假设它需要检查十几个字段，其中一些字段包含需要多次比较的对象，因为所有这些检查会迅速累积起来。\n\
    \n问题的根源在于，判断两个可变对象是否代表相同的值是很耗时的。但如果这能变成一个快速检查呢？\n\n使用不可变的 `props` 和 `state`，确实有一个快速检查可以使用。当你的\
    \ `props` 被表示为不可变对象时，它们就不能再原地更新；要获得新的 props，你必须实例化一个新的不可变对象，并用新对象替换旧对象。因此，使用 `oldProps\
    \ !== newProps` 作为你的 `shouldComponentUpdate` 检查，可以非常快速地告诉你是否确实需要更新。\n\n值得注意的是，尽管这个检查非常快，但它可能会产生误报。例如，如果你的旧状态是\
    \ `{ username: \"Don Jacko\", active: true }`，并且你调用了 `replaceState` 传入一个新实例化的对象\
    \ `{ username: \"Don Jacko\", active: true }`，那么旧 `state` 显然与新 `state` 相同，但使用\
    \ `oldState !== newState` 作为测试的 `shouldComponentUpdate` 函数仍然会认为它们不同，并会进行不必要的重新渲染。\n\
    \n在实践中，这种情况很少出现，即使出现，唯一的代价也只是不必要的重新渲染。漏报（组件实际上需要重新渲染但判断为不需要）会是更大的问题，但幸运的是，这种方法不会出现这个问题。\n\
    \n## 性能代价\n\n虽然不可变数据结构可以让你获得极其简单且闪电般快速的 `shouldComponentUpdate` 实现，从而节省大量的渲染性能，但它们并非没有性能代价。可变对象更新快但比较慢，而不可变对象比较快但更新慢。\n\
    \n不可变库不是原地修改，而是必须实例化至少一个新对象，并根据需要修改它，直到它在除了更改的字段之外的所有方面都与旧对象匹配。这在更新过程中以及垃圾回收过程中都会消耗时间，因为额外的对象最终会被清理。\n\
    \n对于绝大多数 React 应用来说，这是一个很好的权衡。请记住，一次更新通常会导致多次渲染函数的调用，而渲染函数在构建其返回值的过程中本身也会实例化不少对象。牺牲一点更新速度来节省大量的渲染函数调用，几乎总是性能上的胜利。\n\
    \n除了性能之外，另一个需要考虑的代价是你失去了 `setState` 和 `setProp` 的便利性。由于这两者都依赖于能够分别修改你的 `state`\
    \ 和 `props` 对象，当你将它们切换为不可变对象时，你唯一的选择就变成了 `replaceState` 和 `replaceProps`。\n\n\
    ## 架构优势\n\n除了性能优势之外，更多地使用不可变数据还会带来额外的架构优势。这些优势超越了 `props` 和 `state`，更广泛地适用于你的整个应用。\n\
    \n与可变数据相比，不可变数据通常更不容易出错。当将可变数据从一个函数传递到另一个函数，并期望它保持不变时，你有两个选择：一是提前克隆对象并传递克隆体，二是祈祷另一个函数不会修改它。（因为如果它修改了，你就得开始调试了！）\n\
    \n防御性克隆在这种情况下是有效的，但通常不如不可变库在相同情况下所做的效率高。知道你的初始数据已经被假定为不可变的，可以允许比全程可变时更快的克隆。\n\n\
    拥抱不可变性意味着你不必在逐个案例的基础上记住进行防御性克隆；相反，通过以通常的方式使用不可变数据，你将获得相同的安全传递特性。这使得不可变数据在操作时更不容易出错。\n\
    \n## 使用不可变性辅助插件\n\n"
- fmt: "\nThe easiest way to introduce immutability to your React application is to\
    \ use the Immutability Helpers Addon. It lets you continue using your existing\
    \ mutable data structures as though they were immutable, by making it easy to\
    \ create new (also mutable) objects instead of performing in-place updates.\n\n\
    While this does not actually give you any new guarantees, it does allow you to\
    \ write a quick `shouldComponentUpdate` function as described above.\n\nLet’s\
    \ update our example to use the Immutability Helpers Addon:\n\n```\n var update\
    \ = React.addons.update;\n\nvar SurveyEditor = React.createClass({\n  // ...\n\
    \n  handleDrop: function (ev) {\n    var questionType = ev.dataTransfer.getData('questionType');\n\
    \    var questions = update(this.state.questions, {\n      $push: [{ type: questionType\
    \ }]\n    });\n\n    this.setState({\n      questions: questions,\n      dropZoneEntered:\
    \ false\n    });\n  },\n\n  handleQuestionChange: function (key, newQuestion)\
    \ {\n    var questions = update(this.state.questions, {\n      $splice: [[key,\
    \ 1, newQuestion]]\n    });\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = update(this.state.questions,\
    \ {\n      $splice: [[key, 1]]\n    });\n\n    this.setState({ questions: questions\
    \ });\n  }\n\n  // ...\n});\n```\n\nNext we’ll try a different library, one which\
    \ actually does make guarantees about immutability.\n\n# Using seamless-immutable\n\
    \nThe seamless-immutable library is not part of the official React family of libraries,\
    \ but was designed to be used with React. It creates immutable versions of regular\
    \ Objects and Arrays, which can be passed around, accessed, and iterated over\
    \ just like their mutable counterparts, but which block any operations that would\
    \ mutate them.\n\nLike the Immutability Helpers Addon, seamless-immutable provides\
    \ convenience functions for working with immutable data. In the case of seamless-immutable,\
    \ however, these are implemented as methods on the objects themselves. For example,\
    \ seamless-immutable objects gain a `.merge()` method which works like the `$merge`\
    \ option in the Immutable Helpers Addon.\n\n```\n var update = React.addons.update;\n\
    \nvar SurveyEditor = React.createClass({\n  // ...\n\n  handleDrop: function (ev)\
    \ {\n    var questionType = ev.dataTransfer.getData('questionType');\n    var\
    \ questions = this.state.questions.concat(\n      [{ type: questionType }]\n \
    \   );\n\n    this.replaceState(this.state.merge({\n      questions: questions,\n\
    \      dropZoneEntered: false\n    }));\n  },\n\n  handleQuestionChange: function\
    \ (key, newQuestion) {\n    var questions = this.state.questions.map(\n      \
    \  function(question, index) {\n            return index === key ? newQuestion\
    \ : question;\n        }\n    );\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = this.state.questions.filter(\n\
            function(question, index) {\n            return index !== key;\n     \
    \   }\n    );\n\n    this.setState({ questions: questions });\n  }\n\n  // ...\n\
    \n});\n```\n\n# Using Immutable.js\n\nWhereas the previous two libraries provided\
    \ tools around normal JavaScript objects and arrays, `Immutable.js` takes a different\
    \ approach: it provides alternative data structures to objects and arrays.\n\n\
    The most commonly-used of these data structures are `Immutable.Map` (analogous\
    \ to Object) and `Immutable.Vector` (analogous to Array). Neither of these can\
    \ be freely substituted for JavaScript objects or arrays in the general case,\
    \ although you can easily convert to and from the `Immutable.js` data structures\
    \ and their mutable JavaScript counterparts.\n\n## `Immutable.Map`\n\n```\n var\
    \ question = Immutable.Map({description: 'who is your favorite superhero?'});\n\
    // get values from the Map with .get\nquestion.get('description');\n\n// updating\
    \ values with .set returns a new object.\n// The original object remains intact.\n\
    question2 = question.set('description', 'Who is your favorite comicbook hero?');\n\
    \n// merge 2 objects with .merge to get a third object.\n// Once again none of\
    \ the original objects are mutated.\nvar title = { title: 'Question #1' };\nvar\
    \ question3 = question.merge(question2, title);\nquestion3.toObject(); // { title:\
    \ 'Question #1', description: 'who is your favorite comicbook hero' }\n```\n\n\
    ## `Immutable.Vector`\n\nUse `Immutable.Vector` for arrays:\n\n```\n var options\
    \ = Immutable.Vector('Superman' , 'Batman');\nvar options2 = options.push('Spiderman');\n\
    options2.toArray(); // ['Superman', 'Batman', 'Spiderman']\n```\n\nYou can also\
    \ nest the data structures:\n\n```\n var options = Immutable.Vector('Superman'\
    \ , 'Batman');\nvar question = Immutable.Map({\n  description: 'who is your favorite\
    \ superhero?',\n  options: options\n});\n```\n\n`Immutable.js` has many more facets.\
    \ For more information on `Immutable.js` go to [https://github.com/facebook/immutable-js](https://github.com/facebook/immutable-js).\n\
    \n# Summary\n\nIn this chapter we learned about the benefits and costs of using\
    \ immutability in a React application. We covered its impact on `shouldComponentUpdate`,\
    \ on what it means for update times, and three different ways to introduce immutability\
    \ into a React code base.\n\nNext we’ll look into other uses of React beyond traditional\
    \ web applications.\n\n# Chapter 17\\. Other uses\n\nReact is a powerful interactive\
    \ UI rendering library, but it provides a great way to handle data and user input.\
    \ It encourages small components that are reusable and easy to unit test. These\
    \ are all great features that you can apply to other technologies than just the\
    \ web.\n\nIn this chapter we’ll look at how to use React for:\n\n*   Desktop applications\n\
    *   Games\n*   Emails\n*   Charting\n\n# Desktop\n\nWith projects like Electron\
    \ or node-webkit you can run a web application on the desktop. The Atom Editor\
    \ from Github is built with Electron, which you can also use with React.\n\nThe\
    \ sample app already includes Electron, and to launch it, run this command in\
    \ the root of the sample app:\n\n```\n ./node_modules/.bin/electron desktop.html\n\
    ```\n\nRunning Electron with `desktop.html` opens up the application in a window.\n\
    \n![](assets/Electron.png)\n\nYou can read more about Electron at [http://electron.atom.io](http://electron.atom.io).\n\
    \nWith projects like Electron and node-webkit, you can build desktop applications\
    \ using the same technologies you use for the web. Just like for the web, React\
    \ can help you build powerful interactive applications for the desktop.\n\n# Games\n\
    \nGames generally require a high level of user interaction, where the user is\
    \ responding to the changing state of the game. This is in contrast to most web\
    \ applications where the user is either consuming content or producing content.\
    \ Games are essentially a state machine, having two basic roles:\n\n1.  Updating\
    \ the View\n2.  Responding to events\n\nIn the introduction to this book, you\
    \ read that React has a very narrow scope that is concerned with only two things:\n\
    \n1.  Updating the DOM\n2.  Responding to events\n\nThe similarities between React\
    \ and Games don’t just stop at this. React owes much of its Virtual DOM architecture\
    \ to high performance 3D gaming engines, where given the intended view state,\
    \ the rendering engine ensures an efficient update of view/DOM.\n\nAs an example\
    \ of using React with gaming, let’s take a look at an implementation of the game\
    \ 2048. The object of this game is to combine matching numbers on the board until\
    \ you reach 2048.\n\n![2048](assets/2048.png)\n\nLet’s dive in and take a look\
    \ at the implementation ([https://jsfiddle.net/jeremiahrhall/6wa8djju/](https://jsfiddle.net/jeremiahrhall/6wa8djju/)).\n\
    \nThe source is divided into two parts. The first section is the game logic implemented\
    \ as functions in the global namespace, and the second section is the React components.\
    \ The first thing you will see is the initial data structure of the board.\n"
