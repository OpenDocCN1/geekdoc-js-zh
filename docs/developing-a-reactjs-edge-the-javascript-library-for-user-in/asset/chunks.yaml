    \ factory, first use the `createFactory` function.\n\n```\n var Divider = React.createFactory(DividerClass);\n\
    ```\n\nNow that you have a factory function you’re free to create a `ReactElement`\
    \ from it.\n\n```\n var divider = Divider(null, 'Questions');\n```\n\n## Further\
    \ reading and references\n\nEven if you don’t like the idea of markup in your\
    \ JavaScript, hopefully you can now appreciate how JSX offers a solution to the\
    \ intimate relationship between your JavaScript and the markup it renders. Its\
