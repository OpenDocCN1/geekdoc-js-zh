  trans: "\n\n虽然动作并非 Flux 模式的正式组成部分，但它们构成了应用程序的领域特定语言。动作创建器将用户交互转化为有意义的调度器动作——即存储可以处理的语句。\n\
    \n### 存储\n\n存储负责封装业务逻辑以及与应用程序数据的交互。存储通过向调度器注册，选择要响应的动作。存储通过其变更事件将数据发送到 React 组件层级中。\n\
    \n保持存储的严格关注点分离非常重要。\n\n* 存储保存应用程序的*所有*数据。\n* 应用程序的其他部分不应知道如何与数据交互——存储是应用程序中唯一发生数据变更的地方。\n\
    * 存储没有设置器——所有更新都通过调度器流入存储。新数据通过存储的变更事件流回应用程序。\n\n以下是一个存储向 `Dispatcher` 注册以接收帖子评论的示例。\n\
    \n```\n Dispatcher.register(function(payload) {\n  switch(payload.actionType)\
    \ {\n    ...\n    case CommentConstants.RECEIVE_COMMENTS:\n      CommentStore.setComments(payload.comments,\
    \ payload.parentPostId);\n      break;\n  }\n});\n```\n\n存储接收动作，执行保存评论的工作，完成后触发变更事件。\n\
    \n```\n CommentStore.prototype.setComments = function(comments, parentPostId)\
    \ {\n  // handle saving the results here\n  this.emitChange();\n}\n```\n\n然后，React\
    \ 视图处理此变更事件。新状态将流经 React 组件层级，组件将根据需要重新渲染。\n\n### 视图控制器\n\n应用程序的组件层级通常有一个负责与存储交互的高层组件。简单的应用程序可能只有一个。更复杂的应用程序可能有多个。\n\
    \n连接存储的过程很简单。\n\n1. 当组件挂载时，添加变更监听器。\n2. 当存储发生变化时，请求新数据并进行相应处理。\n3. 当组件卸载时，清理变更监听器。\n\
    \n以下是处理存储交互的示例。\n\n```\n export default\nclass App extends React.Component {\n\
      handleChange() {\n    PostStore.getPosts((posts) => {\n      this.setState({\
    \ posts: posts });\n    });\n  }\n  componentDidMount() {\n    PostStore.addChangeListener(this.handleChange);\n\
      }\n  componentWillUnmount() {\n    PostStore.removeChangeListener(this.handleChange);\n\
      }\n  ...\n}\n```\n\n## 管理多个存储\n\n不可避免地，应用程序会增长到需要多个存储。当一个存储依赖于另一个存储时，情况会变得棘手，因为第二个存储需要先完成其动作，第一个存储才能执行自己的动作。\n\
    \n例如，我们可能创建一个单独的存储来维护调查结果摘要，统计所有调查受访者的结果。这个摘要存储需要主存储先完成其记录动作，然后我们才能安全地更新摘要存储。\n\
    \nFacebook 的标准 Flux 实现包含一个名为 `waitFor` 的方法，它可以帮助我们指示存储等待其他存储完成事件处理后再继续。\n\n###\
    \ 注册依赖动作\n\n假设我们有两个存储关注 `CREATE_COMMENT` 动作。\n\n* `CommentStore` 需要存储评论。\n* `PostStore`\
    \ 需要重新统计帖子的评论总数。\n\n这意味着 `PostStore` 依赖于 `CommentStore` 先完成 `CREATE_COMMENT` 动作，然后才能完成其工作。\n\
    \n当我们在应用程序顶部注册 `CommentStore` 时，我们存储了对调度器令牌的引用。\n\n```\n // Wire up the CommentStore\
    \ with the action dispatcher\nCommentStore.dispatchToken = Dispatcher.register(function(payload)\
    \ {\n  switch(payload.actionType) {\n    ...\n    case CommentConstants.CREATE_COMMENT:\n\
          CommentStore.saveComment(payload.comment, payload.parentPostId);\n     \
    \ break;\n    ...\n  }\n});\n```\n\n然后我们注册新的 `PostStore`，在访问 `CommentStore` 数据之前调用\
    \ `waitFor`。\n\n```\n PostStore.dispatchToken = Dispatcher.register(function(payload)\
    \ {\n  switch(payload.actionType) {\n    case CommentConstants.CREATE_COMMENT:\n\
          Dispatcher.waitFor(CommentStore.dispatchToken);\n      // At this point\
    \ it's guaranteed the `CommentStore` callback has been run\n      // and we can\
    \ safely access its data to summarize it.\n      var commentCount = CommentStore.getCommentsFor(payload.parentPostId);\n\
          PostStore.setCommentCount(commentCount, payload.parentPostId);\n      break;\n\
        }\n  }\n});\n```\n\n## Reflux\n\n示例应用使用了一个名为 Reflux 的流行 Flux 启发库。Reflux 与\
    \ Flux 的不同之处在于，存储直接订阅动作。这消除了检查动作类型的大型 switch 语句的需要。存储也可以类似地监听其他存储，从而消除了 Flux 部分中描述的\
    \ `waitFor` 调用。动作创建器被消除，因为 Reflux 动作只是将接收到的负载传递给监听器的函数。\n\n示例应用在 `src/stores`\
    \ 目录中定义了许多存储。应用的所有动作都定义在 `src/utils/actions.js` 中。\n\n你可以在这里了解更多关于 Reflux 的信息：[`github.com/reflux/refluxjs`](https://github.com/reflux/refluxjs)。\n\
    \n## Redux\n\n受 ClojureScript 的 Om 和函数式响应式编程的影响，Redux 是另一个受 Flux 启发的 React 应用库。Redux\
    \ 旨在帮助你编写易于推理的应用程序，并提供出色的开发者体验。\n\n与 Om 类似，Redux 将整个应用程序的状态收集到一个单一对象中，形成一个大型数据树。Redux\
    \ 的设计使得所有代码（包括存储）都可以热加载，即在应用运行时更新。\n\nRedux 有一个单一的存储，由响应动作的 Reducer 更新。Redux Reducer\
    \ 是纯函数，返回状态树的一个更新部分。Reducer 通常与存储向 `Dispatcher` 注册的函数非常相似。与 Flux 中使用存储的 getter\
    \ 方法不同，Redux 有一个选择器的概念。选择器是从状态树中检索数据的函数。然后，组件使用一个名为 `connect` 的函数注册存储的更新，并使用选择器检索所需数据。这些选中的数据作为\
    \ props 传递给连接的组件。Redux 中的动作创建器与 Flux 中的类似，但可以通过中间件增强。\n\n你可以在这里了解更多关于 Redux 的信息：[`redux.js.org`](http://redux.js.org)。\n\
    \n## Relay\n\nRelay 是 Facebook 为 React 应用创建的数据驱动框架。Relay 使得在组件内部将组件所需的数据指定为 GraphQL\
    \ 片段或查询成为可能。当 Relay 渲染你的 React 应用时，它会从所有要渲染的组件上的 GraphQL 片段构建一个大型复合查询，然后向服务器发出一个请求。将数据需求与组件放在一起，使得跟上不断变化的数据需求变得简单，而批处理网络请求则提高了性能。使用\
    \ Relay 需要你有一个支持响应 GraphQL 查询的服务器，但对于具有复杂数据需求或视图层级的应用程序来说，它可能是一个很好的选择。\n\n你可以在这里了解更多关于\
    \ Relay 的信息：[`facebook.github.io/relay/`](https://facebook.github.io/relay/)。\n\
    \n## Om 和 Om Next（ClojureScript）\n\n"
- fmt: "\nOm, and it’s successor Om Next, are very popular ClojureScript interfaces\
    \ to React. ClojureScript’s persistent data structures make implementing otherwise\
    \ complex features like undo very simple. Om Next incorporates what the Om community\
    \ has learned to provide an even better experience. Similar to Relay, Om Next\
    \ allows you to specify a component’s data requirements directly on the component.\
    \ In Om Next, these queries are specified using Datomic Pull Syntax which is a\
    \ query syntax for Datomic, a database commonly used with ClojureScript projects.\n\
    \nBelow is an entire Om Next app!\n\n```\n (ns om-tutorial.core\n  (:require [goog.dom\
    \ :as gdom]\n            [om.next :as om :refer-macros [defui]]\n            [om.dom\
    \ :as dom]\n            [datascript.core :as d]))\n\n(def app-state\n  (atom\n\
    \    {:app/title \"Animals\"\n     :animals/list\n     [[1 \"Crow\"] [2 \"Antelope\"\
    ] [3 \"Bird\"] [4 \"Cat\"] [5 \"Dog\"]\n      [6 \"Lion\"] [7 \"Mouse\"] [8 \"\
    Monkey\"] [9 \"Snake\"] [10 \"Zebra\"]]}))\n\n(defmulti read (fn [env key params]\
    \ key))\n\n(defmethod read :default\n  [{:keys [state] :as env} key params]\n\
    \  (let [st @state]\n    (if-let [[_ value] (find st key)]\n      {:value value}\n\
    \      {:value :not-found})))\n\n(defmethod read :animals/list\n  [{:keys [state]\
    \ :as env} key {:keys [start end]}]\n  {:value (subvec (:animals/list @state)\
    \ start end)})\n\n(defui AnimalsList\n  static om/IQueryParams\n  (params [this]\n\
    \    {:start 0 :end 10})\n  static om/IQuery\n  (query [this]\n    '[:app/title\
    \ (:animals/list {:start ?start :end ?end})])\n  Object\n  (render [this]\n  \
    \  (let [{:keys [app/title animals/list]} (om/props this)]\n      (dom/div nil\n\
    \               (dom/h2 nil title)\n               (apply dom/ul nil\n       \
    \               (map\n                        (fn [[i name]]\n               \
    \           (dom/li nil (str i \". \" name)))\n                        list))))))\n\
    \n(def reconciler\n  (om/reconciler\n    {:state app-state\n     :parser (om/parser\
    \ {:read read})}))\n\n(om/add-root! reconciler\n              AnimalsList (gdom/getElement\
    \ \"app\"))\n```\n\nThis renders an unordered list of the animal names defined\
    \ as the `app-state` near the top of the file.\n\nYou can learn more about Om\
    \ and ClojureScript here: [https://github.com/omcljs/om](https://github.com/omcljs/om).\n\
    \n## Summary\n\nBy now you’ve seen a number of architectural patterns that can\
    \ be used with React. From a standard Flux pattern, to Flux variants like Reflux,\
    \ to an entirely different language and ecosystem like Om and ClojureScript, React\
    \ has proven to be quite adaptable.\n\nUp next you can read about using Immutability\
    \ in your React apps, a concept central to both Redux and Om.\n\n# Chapter 16.\
    \ Immutability\n\nAn increasingly popular way to use React is in conjunction with\
    \ immutable data structures—that is, data structures that never change after they\
    \ are instantiated.\n\nWhether immutability is right for your application, and\
    \ if so, which immutability library to adopt, depends on the specifics of your\
    \ use case. In this chapter we will cover the benefits and costs of immutability,\
    \ and look at three different libraries you can use to incorporate it into your\
    \ React application.\n\n## Performance Benefits\n\nThe most clear-cut benefit\
    \ of immutability in a React application is what it does for `shouldComponentUpdate`.\
    \ Although `shouldComponentUpdate` can provide great performance improvements,\
    \ those improvements are often eroded or even erased as the `shouldComponentUpdate`\
    \ handler itself increases in complexity.\n\nSuppose you have a `shouldComponentUpdate`,\
    \ which only needs to check one field in `props` to determine whether it will\
    \ return `true` or `false`. That’s going to run quickly! Now suppose instead it\
    \ needs to check a dozen fields instead, and some of those fields contain object\
    \ which each require multiple comparisons, since all that checking can add up\
    \ fast.\n\nThe root of the problem here is that it is time-consuming to determine\
    \ whether two mutable objects represent equivalent values. But what if instead\
    \ that were a quick check?\n\nWith immutable `props` and `state`, there is indeed\
    \ a quick check you can use. When your `props` are represented as an immutable\
    \ object, then they can no longer be updated in place; to get new props, you must\
    \ instantiate a new immutable object and replace the old object with the new.\
    \ As such, using `oldProps !== newProps` as your `shouldComponentUpdate` check\
    \ will very quickly tell you if you definitely need to update.\n\nIt’s worth noting\
    \ that although this check is very fast, it can generate false positives. For\
    \ example, if your old state were `{ username: \"Don Jacko\", active: true }`\
    \ and you invoked `replaceState` passing a freshly-instantiated object `{ username:\
    \ \"Don Jacko\", active: true }`, the old `state` would clearly be identical to\
    \ the new `state`, but a `shouldComponentUpdate` function using `oldState !==\
    \ newState` as its test would still consider them different, and would re-render\
    \ unnecessarily.\n\nIn practice, this rarely seems to come up, and if it does,\
    \ the only cost would be an unnecessary re-render. False negatives (in which a\
    \ component actually needed to re-render but determined that it did not) would\
    \ be a much greater concern, but fortunately that problem does not manifest with\
    \ this approach.\n\n## Performance Costs\n\nAlthough immutable data structures\
    \ can get you dead-simple and lightning-fast `shouldComponentUpdate` implementations,\
    \ which save considerable rendering performance, they are not without their performance\
    \ costs. Whereas, mutable objects are quick to update but slower to compare, immutable\
    \ objects are quick to compare but slower to update.\n\nInstead of making the\
    \ change in place, the immutability library you’re using must instantiate at least\
    \ one new object, and modify it as necessary until it matches the old object in\
    \ every way except for the one changed field. This costs time both during the\
    \ update process and during garbage collection, when the additional objects are\
    \ inevitably cleaned up.\n\nFor the vast majority of React applications, this\
    \ is an excellent tradeoff to make. Remember that a single update typically results\
    \ in a call to many render functions, and that render functions instantiate quite\
    \ a few objects themselves in the course of building up their return values. Sacrificing\
    \ a bit of update speed to save numerous render function calls is almost always\
    \ going to be a performance win.\n\nSeparate from performance, another cost to\
    \ consider is that you lose the convenience of `setState` and `setProp`. Since\
    \ both of these rely on being able to mutate your `state` and `props` objects,\
    \ respectively, when you switch those to immutable objects, your only options\
    \ become `replaceState` and `replaceProps`.\n\n## Architectural Benefits\n\nBesides\
    \ performance benefits, there are additional architectural benefits that come\
    \ from using immutable data more. These benefits extend beyond `props` and `state`,\
    \ and apply more broadly to your application as a whole.\n\nImmutable data is\
    \ generally less error-prone to work with than mutable data. When passing mutable\
    \ data from one function to another, and expecting that it will come back unchanged,\
    \ you have two options: one is to clone the object ahead of time and pass the\
    \ clone, and the other is to cross your fingers and hope the other function doesn’t\
    \ modify it. (Because if it does, you’re in for some bug hunting!)\n\nDefensive\
    \ cloning is effective in situations like these, but generally less efficient\
    \ than what an immutable library would do in the same spot. Knowing that your\
    \ initial data is already assumed to be immutable can allow for faster cloning,\
    \ than when it’s mutable the whole way through.\n\nEmbracing immutability means\
    \ you do not have to remember to defensively clone on a case-by-case basis; instead,\
    \ you will get the same safe-to-pass characteristics by virtue of using immutable\
    \ data in the usual way. This makes immutable data less error-prone to work with.\n\
    \n## Using the Immutability Helpers Addon\n"
  raw: "Om, and it’s successor Om Next, are very popular ClojureScript interfaces\
    \ to React. ClojureScript’s persistent data structures make implementing otherwise\
    \ complex features like undo very simple. Om Next incorporates what the Om community\
    \ has learned to provide an even better experience. Similar to Relay, Om Next\
    \ allows you to specify a component’s data requirements directly on the component.\
    \ In Om Next, these queries are specified using Datomic Pull Syntax which is a\
    \ query syntax for Datomic, a database commonly used with ClojureScript projects.\n\
    \nBelow is an entire Om Next app!\n\n```\n (ns om-tutorial.core\n  (:require [goog.dom\
    \ :as gdom]\n            [om.next :as om :refer-macros [defui]]\n            [om.dom\
    \ :as dom]\n            [datascript.core :as d]))\n\n(def app-state\n  (atom\n\
        {:app/title \"Animals\"\n     :animals/list\n     [[1 \"Crow\"] [2 \"Antelope\"\
    ] [3 \"Bird\"] [4 \"Cat\"] [5 \"Dog\"]\n      [6 \"Lion\"] [7 \"Mouse\"] [8 \"\
    Monkey\"] [9 \"Snake\"] [10 \"Zebra\"]]}))\n\n(defmulti read (fn [env key params]\
    \ key))\n\n(defmethod read :default\n  [{:keys [state] :as env} key params]\n\
      (let [st @state]\n    (if-let [[_ value] (find st key)]\n      {:value value}\n\
          {:value :not-found})))\n\n(defmethod read :animals/list\n  [{:keys [state]\
    \ :as env} key {:keys [start end]}]\n  {:value (subvec (:animals/list @state)\
    \ start end)})\n\n(defui AnimalsList\n  static om/IQueryParams\n  (params [this]\n\
        {:start 0 :end 10})\n  static om/IQuery\n  (query [this]\n    '[:app/title\
    \ (:animals/list {:start ?start :end ?end})])\n  Object\n  (render [this]\n    (let\
    \ [{:keys [app/title animals/list]} (om/props this)]\n      (dom/div nil\n               (dom/h2\
    \ nil title)\n               (apply dom/ul nil\n                      (map\n                        (fn\
    \ [[i name]]\n                          (dom/li nil (str i \". \" name)))\n                        list))))))\n\
    \n(def reconciler\n  (om/reconciler\n    {:state app-state\n     :parser (om/parser\
    \ {:read read})}))\n\n(om/add-root! reconciler\n              AnimalsList (gdom/getElement\
    \ \"app\"))\n```\n\nThis renders an unordered list of the animal names defined\
    \ as the `app-state` near the top of the file.\n\nYou can learn more about Om\
    \ and ClojureScript here: [https://github.com/omcljs/om](https://github.com/omcljs/om).\n\
    \n## Summary\n\nBy now you’ve seen a number of architectural patterns that can\
    \ be used with React. From a standard Flux pattern, to Flux variants like Reflux,\
    \ to an entirely different language and ecosystem like Om and ClojureScript, React\
    \ has proven to be quite adaptable. \n\nUp next you can read about using Immutability\
    \ in your React apps, a concept central to both Redux and Om.\n\n# Chapter 16\\\
    . Immutability\n\nAn increasingly popular way to use React is in conjunction with\
    \ immutable data structures—that is, data structures that never change after they\
    \ are instantiated.\n\nWhether immutability is right for your application, and\
    \ if so, which immutability library to adopt, depends on the specifics of your\
    \ use case. In this chapter we will cover the benefits and costs of immutability,\
    \ and look at three different libraries you can use to incorporate it into your\
    \ React application.\n\n# Performance Benefits\n\nThe most clear-cut benefit of\
    \ immutability in a React application is what it does for `shouldComponentUpdate`.\
    \ Although `shouldComponentUpdate` can provide great performance improvements,\
    \ those improvements are often eroded or even erased as the `shouldComponentUpdate` handler\
    \ itself increases in complexity. \n\nSuppose you have a `shouldComponentUpdate`,\
    \ which only needs to check one field in `props` to determine whether it will\
    \ return `true` or `false`. That’s going to run quickly! Now suppose instead it\
    \ needs to check a dozen fields instead, and some of those fields contain object\
    \ which each require multiple comparisons, since all that checking can add up\
    \ fast.\n\nThe root of the problem here is that it is time-consuming to determine\
    \ whether two mutable objects represent equivalent values. But what if instead\
    \ that were a quick check?\n\nWith immutable `props` and `state`, there is indeed\
    \ a quick check you can use. When your `props` are represented as an immutable\
    \ object, then they can no longer be updated in place; to get new props, you must\
    \ instantiate a new immutable object and replace the old object with the new.\
    \ As such, using `oldProps !== newProps` as your `shouldComponentUpdate` check\
    \ will very quickly tell you if you definitely need to update.\n\nIt’s worth noting\
    \ that although this check is very fast, it can generate false positives. For\
    \ example, if your old state were `{ username: \"Don Jacko\", active: true }` and\
    \ you invoked `replaceState` passing a freshly-instantiated object `{ username:\
    \ \"Don Jacko\", active: true }`, the old `state` would clearly be identical to\
    \ the new `state, `, but a `shouldComponentUpdate` function using `oldState !==\
    \ newState` as its test would still consider them different, and would re-render\
    \ unnecessarily.\n\nIn practice, this rarely seems to come up, and if it does,\
    \ the only cost would be an unnecessary re-render. False negatives (in which a\
    \ component actually needed to re-render but determined that it did not) would\
    \ be a much greater concern, but fortunately that problem does not manifest with\
    \ this approach.\n\n# Performance Costs\n\nAlthough immutable data structures\
    \ can get you dead-simple and lightning-fast `shouldComponentUpdate` implementations,\
    \ which save considerable rendering performance, they are not without their performance\
    \ costs. Whereas, mutable objects are quick to update but slower to compare, immutable\
    \ objects are quick to compare but slower to update.\n\nInstead of making the\
    \ change in place, the immutability library you’re using must instantiate at least\
    \ one new object, and modify it as necessary until it matches the old object in\
    \ every way except for the one changed field. This costs time both during the\
    \ update process and during garbage collection, when the additional objects are\
    \ inevitably cleaned up.\n\nFor the vast majority of React applications, this\
    \ is an excellent tradeoff to make. Remember that a single update typically results\
    \ in a call to many render functions, and that render functions instantiate quite\
    \ a few objects themselves in the course of building up their return values. Sacrificing\
    \ a bit of update speed to save numerous render function calls is almost always\
    \ going to be a performance win.\n\nSeparate from performance, another cost to\
    \ consider is that you lose the convenience of `setState` and `setProp`. Since\
    \ both of these rely on being able to mutate your `state` and `props` objects,\
    \ respectively, when you switch those to immutable objects, your only options\
    \ become `replaceState` and `replaceProps`.\n\n# Architectural Benefits\n\nBesides\
    \ performance benefits, there are additional architectural benefits that come\
    \ from using immutable data more. These benefits extend beyond `props` and `state`,\
    \ and apply more broadly to your application as a whole.\n\nImmutable data is\
    \ generally less error-prone to work with than mutable data. When passing mutable\
    \ data from one function to another, and expecting that it will come back unchanged,\
    \ you have two options: one is to clone the object ahead of time and pass the\
    \ clone, and the other is to cross your fingers and hope the other function doesn’t\
    \ modify it. (Because if it does, you’re in for some bug hunting!)\n\nDefensive\
    \ cloning is effective in situations like these, but generally less efficient\
    \ than what an immutable library would do in the same spot. Knowing that your\
    \ initial data is already assumed to be immutable can allow for faster cloning,\
    \ than when it’s mutable the whole way through.\n\nEmbracing immutability means\
    \ you do not have to remember to defensively clone on a case-by-case basis; instead,\
    \ you will get the same safe-to-pass characteristics by virtue of using immutable\
    \ data in the usual way. This makes immutable data less error-prone to work with.\n\
    \n# Using the Immutability Helpers Addon"
