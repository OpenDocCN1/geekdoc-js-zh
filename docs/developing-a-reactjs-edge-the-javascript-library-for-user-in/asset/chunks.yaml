    The bigger your interface gets, the more likely it is to have one interaction
    that triggers an update, which in turn triggers another update, which in turn
    triggers another. When these cascading updates are not batched properly, performance
    starts to degrade substantially. Worse, sometimes DOM elements are updated multiple
    times before arriving in their final state.


    Not only does React’s virtual representation diffing minimize these problems by
    performing the minimal set of updates in a single pass, it also simplifies the
    maintenance of your application. When the state of the world changes based on
    user input or external updates, you simply notify React of the state change and
    it takes care of the rest automatically. There’s no need to micromanage the process.


    React uses a single event handler for the entire application and delegates all
    events to this event handler. This also gives React a performance boost, since
    having many event handlers can have significant performance penalties.


    You can read the full source code of our example application used throughout this
    book, at [http://git.io/vlcpa](http://git.io/vlcpa).


    # Book overview


    This book will take you through four main topic areas to help you develop an edge
    with React.


    ## Creating and composing components


    The first seven chapters of the book are all about creating and composing React
    components. These chapters will provide an understanding of how to use React.


    ### 1) Introduction to React


    This first chapter introduces React, covering the background and the book overview.


    ### 2) Using JSX and basic React components


    JSX (JavaScript XML) is a way of writing declarative XML style syntax inside JavaScript.
    You will learn how to use JSX with React and how to build basic React Components.
    While not required to be used with React, most of the examples in this book, along
    with the example app, use JSX, since it is the recommended way to use React.


    ### 3) React component lifecycle


    React is often creating and destroying components during the render process. React
    provides many functions you can hook into during the lifecycle of your components.
    You should gain an understanding of how to manage the lifecycle of a component
    to ensure you don’t create memory leaks in your applications.


    ### 4) Data flow in React


    It is important to know how data is passed down through the component tree and
    what data is safe to change. React has a very clear separation of `props` and
    `state`. This chapter will teach you what props and state are and how to use props
    and state correctly in your React components.


    ### 5) Event handling


    React implements event handling in a declarative manner. Event handling is an
    important part of any dynamic UI, and learning to master this is essential. Fortunately
    React makes event handling very simple.


    ### 6) Composing components


    React encourages you to make small, precise components that do a specific job.
    You then need to create orchestration layers in your application to compose these
    components. This chapter will teach you how to use your components in other components.


    ### 7) High order components and Mixins


    This is a pattern that allows abstracting the ‘how’ of data dependencies. High
    order components wrap other components to provide data or functions via props.
    This chapter also covers mixins, which are still useful to use in certain circumstances.


    ## Advanced topics


    Once you have mastered the basics of React you will move on to some more advanced
    topics. These next six chapters will help you hone your React skills and help
    you understand how to build great React components.


    ### 8) DOM manipulation


    Even with all of the power of the virtual DOM available in React, sometimes you
    still need to access the raw DOM nodes in your applications. This may be to enable
    you to use existing JavaScript libraries or to get more control over your components.
    This chapter will teach you where in the React component lifecycle you can safely
    access the DOM, and when to release your control on the DOM to avoid memory leaks.


    ### 9) Building forms with React


    Using HTML form elements is one of the best ways of receiving input from your
    users. However, HTML form elements are very stateful. React provides a way to
    move most of the state from your form elements into your React components. This
    gives you incredible control over your form elements.


    ### 10) Animations


    As web developers we are already blessed with a very declarative way of defining
    high performance animations: CSS. React encourages the use of CSS for your animations.
    This chapter shows how React helps you leverage CSS for animating your React components.


    ### 11) Performance tuning your components


    The virtual DOM in React gives you great performance right out of the box, but
    there is always room for improvement. React provides a way to tell the render
    that it doesn’t need to re-render your component if you know your component has
    not changed. Doing this can greatly improve the speed of your applications.


    ### 12) Server-side rendering


    Many applications need SEO, fortunately React can be rendered to string in a non-browser
    environment like Node.js. Server-side rendering can also improve first page load
    times of your applications. Writing your application to support both server-side
    rendering and client-side rendering, however, can be difficult. This chapter provides
    you with some strategies for isomorphic rendering and highlights some of the more
    challenging considerations you will encounter with server-side rendering.


    ## Tooling for React


    React has some fantastic developer tools and test suits. Learning to use them
    will help you write robust applications. This section is broken into two chapters
    that cover tools and tests.


    ### 13) Development tools


    As you write larger React applications you will start to require a way to automate
    packaging your code for deployment, and debugging your applications starts to
    get harder. In this chapter you will learn what tools are available to help you
    build and package your React applications and how to use the Google Chrome plugin
    available to visualize your React components, allowing for easier debugging.


    ### 14) Writing tests for React


    Writing tests is an important part of ensuring you don’t introduce bugs into existing
    working code as your applications grow. Writing tests also help you write better
    code as it encourages you to write more modular code. This chapter will guide
    you through how to test all aspects of your React components.


    ## Working with React


    The final chapters cover important aspects of working with React and different
    use cases you may not have thought about.


    ### 15) Architectural patterns


    React provides only the “V” in “MVC”, but it is very flexible in plugins in with
    other frameworks and systems. This chapter will help guide you in designing larger
    scale applications with React. We’ll explore how our sample React app is structured
    and how this structure helps manage complexity as your project grows.


    ### 16) Immutability


    React works well in conjunction with immutable data structures—that is, data structures
    that never change and are instantiated. In this chapter we cover the benefits
    and costs of immutability, and look at three di?fferent libraries you can use
    to incorporate into your React application.


    ### 17) Other React uses


    React is a powerful interactive UI rendering library, and it provides a great
    way to handle data and user input. In this chapter we’ll look at how to use React
    for Desktop apps, games, emails and for charting.


    # Chapter 2. JSX


    In React, components are used to separate concerns, not templates and display
    logic. When using React, you must embrace the idea that markup, and the code that
    generates it, are inherently tied together. This gives you all of the expressive
    power of JavaScript when building your markup, without having to resort to awkward
    or cumbersome templating languages.

