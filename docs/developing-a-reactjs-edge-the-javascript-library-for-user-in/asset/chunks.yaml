  trans: "\nReact 与一种可选的标记语法配合良好，并且与 HTML 非常相似。但在继续之前，我们先澄清一点——对于那些因 JavaScript 中标记的明显笨拙而感到反感的人，以及那些不相信\
    \ JSX 有用性的人，请考虑一下 React 中这种方法的诸多好处：\n\n*   它允许使用熟悉的标记来定义元素树\n*   提供更具语义、更易于理解的标记\n\
    *   更容易可视化应用程序的结构\n*   它抽象了 React 元素的创建\n*   它将标记和生成标记的代码紧密联系在一起\n*   它只是普通的 JavaScript\n\
    \n在本章中，我们将探讨 JSX 的诸多好处，以及如何使用它，同时还会介绍一些使其与 HTML 有所区别的注意事项。请记住，JSX 是可选的。如果你选择不使用\
    \ JSX，可以跳到本章末尾，了解不使用 JSX 时使用 React 的技巧。\n\n本书将使用最新版本的 JavaScript，即 ES6（或 ES2015）。你可以在这里找到很好的入门介绍：[`babeljs.io/docs/learn-es2015/`](https://babeljs.io/docs/learn-es2015/)。\n\
    \n# 什么是 JSX？\n\nJSX 代表 JavaScript XML——一种用于在 React 组件中构建标记的类似 XML 的语法。React 可以在没有\
    \ JSX 的情况下工作，但使用它可以使你的组件更具可读性，因此推荐使用。\n\n例如，在纯 React 中创建一个标题的函数调用可能如下所示：\n\n```\n\
    React.createElement('h1', {className: 'question'}, 'Questions');\n```\n\n但使用 JSX\
    \ 后，它变成了更熟悉且简洁的标记：\n\n```\n<h1 className=\"question\">Questions</h1>\n```\n\n\
    与过去尝试在 JavaScript 中嵌入标记的做法相比，JSX 有几个显著的特点：\n\n1.  JSX 是一种语法转换——每个 JSX 节点都映射到一个\
    \ JavaScript 函数。\n2.  JSX 既不提供也不需要运行时库。\n3.  JSX 不会改变或增加 JavaScript 的语义——它只是简单的函数调用。\n\
    \nJSX 与 HTML 的相似性使其在 React 中具有强大的表达能力。这里我们将讨论 JSX 的好处及其在应用程序中的用途，以及 JSX 与 HTML\
    \ 之间的关键区别。\n\n# JSX 的好处\n\n许多人在考虑 JSX 时会问：为什么？既然有大量现有的模板语言，为什么还要使用它？为什么不直接使用纯\
    \ JavaScript？毕竟，JSX 只是映射到 JavaScript 函数。\n\n使用 JSX 有很多好处，而且随着代码库的增大和组件复杂度的提高，这些好处会变得更加明显。现在我们来讨论其中的一些好处。\n\
    \n## 熟悉性\n\n许多开发团队包括非开发人员，从熟悉 HTML 的 UI 和 UX 设计师，到负责全面测试产品的质量保证团队。这些团队成员可以更容易地阅读\
    \ JSX 项目并为其贡献代码。任何熟悉基于 XML 语言的人都可以轻松采用 JSX。\n\n此外，由于 React 组件捕获了 DOM 的所有可能表示（稍后会详细介绍），JSX\
    \ 提供了一种紧凑而简洁的方式来表现和可视化这种结构。\n\n## 语义性\n\n除了熟悉性之外，JSX 还将你的 JavaScript 代码转换为更具语义、更有意义的标记。这让你能够使用类似\
    \ HTML 的语法声明组件结构和信息流，同时知道它稍后会转换为纯 JavaScript。\n\nJSX 允许你在应用程序的标记中使用所有预定义的 HTML5\
    \ 标签名称以及你自己的自定义组件。稍后你会读到关于定义自定义组件的内容，这里你只需看到 JSX 如何使你的 JavaScript 更具可读性。\n\n例如，考虑一个\
    \ `Divider` 元素，它在左侧渲染一个标题，右侧渲染一个水平分隔线以填充剩余空间。这个分隔线的 JSX 如下所示：\n\n```\n<div className=\"\
    divider\">\n  <h2>Questions</h2><hr />\n</div>\n```\n\n将其包装在 `Divider` React 组件中后，你可以像使用任何其他\
    \ HTML 元素一样使用它，同时还能获得更丰富语义的标记带来的好处。\n\n```\n<Divider>Questions</Divider>\n```\n\
    \n## 易于可视化\n\n即使是像这样的小例子，JSX 也能使其更清晰、更简洁。然而，在拥有数百个组件和深层标记树的大型项目中，这种好处会更加明显。\n\n\
    以下是上面提到的 `Divider` 组件。请注意，在 JavaScript 函数的上下文中，标记的意图比纯 JavaScript 版本更清晰、更易读。\n\
    \n这是纯 JavaScript 版本：\n\n```\nrender: function () {\n  return React.createElement('div',\
    \ {className:\"divider\"},\n    \"Label Text\",\n    React.createElement('hr')\n\
    \  );\n}\n```\n\n这是 JSX 标记：\n\n```\nrender: function () {\n  return (\n    <div\
    \ className=\"divider\">\n      Label Text<hr />\n    </div>\n  );\n}\n```\n\n\
    大多数人都认为 JSX 标记更容易理解和调试。\n\n## 关注点分离\n\n最后，React 的核心思想是标记和生成标记的代码本质上是紧密相连的。在 React\
    \ 中，你不会将应用程序的技术分离成视图文件和模板文件。相反，React 鼓励你创建离散的组件，将所有逻辑和标记封装在一个定义中。\n\nJSX 提供了一种干净简洁的方式，将组件的标记与业务逻辑分开。它不仅为描述组件树提供了一种清晰的视觉语言，还使你的应用程序更容易推理。\n\
    \n# 组合组件\n\n现在你已经了解了 JSX 的一些好处，并看到了如何使用它以一种紧凑的标记格式表达组件，让我们看看它如何帮助组装多个组件。\n\n本节内容包括：\n\
    \n*   设置包含 JSX 的 JavaScript 文件\n*   逐步引导你组装一个组件\n*   讨论组件所有权和父子关系\n\n让我们逐一来看。\n\
    \n## 定义自定义组件\n\n继续使用前面提到的页面分隔线，这里再次是我们期望输出的 HTML。\n\n```\n<div class=\"divider\"\
    >\n  <h2>Questions</h2><hr>\n</div>\n```\n\n要将此 HTML 表达为 React 组件，只需像下面这样包装它，使\
    \ `render` 函数返回标记（稍后会解释一些小的更改）。\n\n```\nclass Divider extends React.Component\
    \ {\n  render() {\n    return (\n      <div className=\"divider\">\n        <h2>Questions</h2><hr\
    \ />\n      </div>\n    );\n  }\n};\n```\n\n当然，这目前是一个一次性组件。要使其真正有用，你需要能够动态表达 `h2`\
    \ 标签内的文本。\n\n## 动态值\n\nJSX 在花括号 `{...}` 中渲染动态值。花括号表示 JavaScript 上下文——你放在它们之间的任何内容都会被求值，结果将作为节点渲染在标记中。\n\
    \n对于简单的值，如文本或数字，你可以直接引用变量。你可以像这样渲染动态的 `h2` 标签：\n\n```\nvar text = 'Questions';\n\
    <h2>{text}</h2>\n\n// <h2>Questions</h2>\n```\n\n对于更复杂的逻辑，你可能希望将计算转移到函数中。你可以通过在花括号内调用该函数来渲染其结果：\n\
    \n```\nfunction dateToString(d) {\n  return [\n    d.getFullYear(), \n    d.getMonth()\
    \ + 1, \n    d.getDate()\n  ].join('-');\n};\n\n<h2>{dateToString(new Date())}</h2>\n\
    \n// <h2>2014-10-18</h2>\n```\n\nReact 会自动求值数组，将数组中的每个项渲染为一个节点。\n\n```\nvar text\
    \ = ['hello', 'world'];\n<h2>{text}</h2>\n\n// <h2>helloworld</h2>\n```\n\n通常你可能希望渲染比简单值更复杂的内容。例如，你可能希望将数据数组渲染为\
    \ `<li>` 元素。这就引出了子节点的概念。\n\n## 子节点\n\n在 HTML 中，你使用 `<h2>Questions</h2>` 渲染标题，其中文本\
    \ \"Questions\" 成为 `h2` 元素的子文本节点。因此，这里的目标是在 JSX 中表达分隔线，如下所示：\n\n"
- fmt: "\n`<Divider>Questions</Divider>`\n\nReact captures all child nodes between\
    \ the open and close tags in a special component prop, `this.props.children`.\
    \ In this example, `this.props.children == \"Questions\"`. The actual structure\
    \ of the children prop is undocumented, so don’t attempt to access its contents.\
    \ Just pass it around as-is.\n\nArmed with this knowledge, you can swap out the\
    \ hard-coded text “Questions” with the variable `this.props.children`. React will\
    \ now render anything you place inside the `<Divider>` tags.\n\n```\nclass Divider\
    \ extends React.Component {\n  render() {\n    return (\n      <div className=\"\
    divider\">\n        <h2>{this.props.children}</h2><hr />\n      </div>\n    );\n\
    \  }\n};\n```\n\nNow you can use the `<Divider>` component like you would any\
    \ HTML element.\n\n```\n<Divider>Questions</Divider>\n```\n\nWhen run through\
    \ the JSX transformer the above declaration will transform into this JavaScript\
    \ (assuming the target is ES6).\n\n```\nclass Divider extends React.Component\
    \ {\n  render() {\n    return (\n      React.createElement(\"div\", {className:\
    \ \"divider\"}, \n        React.createElement(\"h2\", null, this.props.children),\
    \ \n        React.createElement(\"hr\", null)\n      )\n    );\n  }\n};\n```\n\
    \nThe output will be exactly what you expect.\n\n```\n<div className=\"divider\"\
    >\n  <h2>Questions</h2><hr />\n</div>\n```\n\n# How is JSX different than HTML?\n\
    \nJSX is HTML-like, but it is not a perfect replication of the HTML syntax (for\
    \ good reason). In fact the JSX spec states:\n\n> This specification does not\
    \ attempt to comply with any XML or HTML specification. JSX is designed as an\
    \ ECMAScript feature and the similarity to XML is only for familiarity.^([1](#ch02.html_idm139745275222416))\n\
    \nHere we explore some of the key differences between JSX and the HTML syntax.\n\
    \n## Attributes\n\nIn HTML you set the attributes of each node inline, like this:\n\
    \n```\n<div id=\"some-id\" class=\"some-class-name\">...</div>\n```\n\nJSX implements\
    \ attributes in the same manner, with the huge advantage that you can set attributes\
    \ to dynamic JavaScript variables. You do this by wrapping a JavaScript variable\
    \ in curly-brackets instead of quotes.\n\n```\nvar surveyQuestionId = this.props.id;\n\
    var classes = 'some-class-name';\n...\n<div id={surveyQuestionId} className={classes}>...</div>\n\
    ```\n\nFor more complex situations you can set an attribute to the result of a\
    \ function call.\n\n```\n<div id={this.getSurveyId()} >...</div>\n```\n\nNow each\
    \ time React chooses to render a component, the variables and function calls will\
    \ be evaluated and the resulting DOM will reflect this new state.\n\nYou can read\
    \ the full source code of our example application, a survey builder, at [http://git.io/vlcpa](http://git.io/vlcpa).\n\
    \n## Conditionals\n\nIn React, a component’s markup and the logic that generate\
    \ it are inherently tied together. This means that you have the full logical power\
    \ of JavaScript at your fingertips, such as with loops and conditionals.\n\nIt\
    \ can be tricky to add conditional logic to your components since if/else logic\
    \ is hard to express as markup. Adding `if` statements directly to JSX will render\
    \ invalid JavaScript:\n\n```\n<div className={if(isComplete) { 'is-complete' }}>...</div>\n\
    ```\n\nSo the solution is to use one of the following:\n\n* Use ternary logic\n\
    * Set a variable and refer to it in the attribute\n* Offload the switching logic\
    \ to a function\n* Use the `&&` operator\n\nHere is a quick example showing what\
    \ each may look like.\n\n**Using the ternary operator**\n\n```\n...\nrender()\
    \ {\n  return (\n    <div \n      className={this.state.isComplete ? 'is-complete'\
    \ : ''}\n    >\n      ...\n    </div>\n  );\n}\n...\n```\n\nWhile the ternary\
    \ operator works well for text, it can be cumbersome and difficult to read when\
    \ you want to use a React component in either case. For these situations it is\
    \ better to use the following methods.\n\n**Using a variable**\n\n```\n...\ngetIsComplete()\
    \ {\n  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  var\
    \ isComplete = this.getIsComplete();\n  return (\n    <div className={isComplete}>...</div>\n\
    \  );\n}\n...\n```\n\n**Using a function call**\n\n```\n...\ngetIsComplete() {\n\
    \  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  return\
    \ (\n    <div className={this.getIsComplete()}>...</div>\n  );\n}\n...\n```\n\n\
    **Using the double-and (`&&`) operator**\n\nBecause React does not output anything\
    \ for `null` or `false` values you can use a boolean value and follow it with\
    \ the desired output string. If the boolean evaluates to `true` then the following\
    \ string will be used.\n\n```\nrender() {\n  return (\n    <div className={this.state.isComplete\
    \ && 'is-complete'}>\n      ...\n    </div>\n  );\n}\n```\n\n# Non-DOM attributes\n\
    \nThe following special attribute names exist in JSX:\n\n* `key`\n* `ref`\n* `dangerouslySetInnerHTML`\n\
    \nHere we will explore them in more detail.\n\n**Keys**\n\n`key` is an optional\
    \ unique identifier. Items and lists can change relative to their siblings, for\
    \ example as the user performs a search or items are added, removed, or reordered\
    \ in a list. When this happens, your component might be needlessly destroyed and\
    \ recreated React may perform naive updates.\n\nBy setting a unique key on a component\
    \ that remains consistent throughout render passes, you inform React so it more\
    \ intelligently decides when to reuse or destroy a component, thus improving rendering\
    \ performance. Then, when two items already in the DOM switch positions, React\
    \ can match the keys and move them without completely re-rendering their DOM.\n\
    \n**References**\n\n`ref` allows parent components to keep a reference to child\
    \ components available outside of the render function.\n\nYou define a `ref` in\
    \ JSX by setting the attribute to the desired reference name.\n\n```\n...\nrender()\
    \ {\n  return <div>\n    <input ref=\"myInput\" ... />\n  </div>;\n}\n...\n```\n\
    \nAnd later you can access this ref by using `this.refs.myInput` anywhere in your\
    \ component. For DOM components such as input, the ref is the DOM node in question.\
    \ For composite components, the ref is the component instance. In practice, you\
    \ will rarely use refs with React, they serve as an escape hatch from React’s\
    \ declarative nature.\n\nFor more detail see the discussion on parent/child relationships\
    \ versus ownership in [Chapter 6](#ch06.html_parent-child-relationship).\n\n**Setting\
    \ raw HTML**\n\n`dangerouslySetInnerHTML` — sometimes you need to set HTML content\
    \ as a string, especially when working with third party libraries that manipulate\
    \ DOM via strings. To improve React’s interoperability, this attribute allows\
    \ you to use HTML strings, but it’s not recommended if you can avoid it. To use\
    \ this property set it to an object with key `__html` set, like this:\n\n```\n\
    ...\nrender() {\n  var htmlString = {\n    __html: \"<span>an html string</span>\"\
    \n  };\n  return <div dangerouslySetInnerHTML={htmlString} ></div>;\n}\n...\n\
    ```\n\n# dangerouslySetInnerHTML\n\n`dangerouslySetInnerHTML` may be changing\
    \ soon, as described here:\n\n[https://github.com/facebook/react/issues/2134](https://github.com/facebook/react/issues/2134)\n\
    \n[https://github.com/facebook/react/pull/1515](https://github.com/facebook/react/pull/1515)\n\
    \n## Events\n\nEvent names are normalized across all browsers and are represented\
    \ in camelCase. For example, `change` becomes `onChange`, and `click` becomes\
    \ `onClick`. Capturing an event in JSX is as simple as assigning the property\
    \ to a method on the component.\n\n```\n...\nhandleClick(event) {...}\nrender()\
    \ {\n  return (\n    <div \n      onClick={(e) => this.handleClick(e)}\n    >\n\
    \      ...\n    </div>\n  );\n}\n...\n```\n\nNote that you use an arrow function\
    \ here because it preserves `this`. Otherwise `this` would be undefined in `handleClick`.\
    \ It also gives you easy control of which arguments are passed to the function.\n\
    \nFor more details on the event system in React, reference Chapter 9.\n\n## Comments\n\
    \nJSX is JavaScript, so you can add plain JavaScript comments within your JSX\
    \ markup. Comments can be added in two places:\n\n1. As a child node of an element\n\
    2. Inline with a node’s attributes\n\n**As a child node**\n"
  raw: "```\n <Divider>Questions</Divider>\n```\n\nReact captures all child nodes\
    \ between the open and close tags in a special component prop, `this.props.children`.\
    \ In this example, `this.props.children == \"Questions\"`. The actual structure\
    \ of the children prop is undocumented, so don’t attempt to access its contents.\
    \ Just pass it around as-is.\n\nArmed with this knowledge, you can swap out the\
    \ hard-coded text “Questions” with the variable `this.props.children`. React will\
    \ now render anything you place inside the `<Divider>` tags.\n\n```\n class Divider\
    \ extends React.Component {\n  render() {\n    return (\n      <div className=\"\
    divider\">\n        <h2>{this.props.children}</h2><hr />\n      </div>\n    );\n\
      }\n};\n```\n\nNow you can use the `<Divider>` component like you would any HTML\
    \ element.\n\n```\n <Divider>Questions</Divider>\n```\n\nWhen run through the\
    \ JSX transformer the above declaration will transform into this JavaScript (assuming\
    \ the target is ES6).\n\n```\n class Divider extends React.Component {\n  render()\
    \ {\n    return (\n      React.createElement(\"div\", {className: \"divider\"\
    }, \n        React.createElement(\"h2\", null, this.props.children), \n      \
    \  React.createElement(\"hr\", null)\n      )\n    );\n  }\n};\n```\n\nThe output\
    \ will be exactly what you expect.\n\n```\n <div className=\"divider\">\n  <h2>Questions</h2><hr\
    \ />\n</div>\n```\n\n# How is JSX different than HTML?\n\nJSX is HTML-like, but\
    \ it is not a perfect replication of the HTML syntax (for good reason). In fact\
    \ the JSX spec states:\n\n> This specification does not attempt to comply with\
    \ any XML or HTML specification. JSX is designed as an ECMAScript feature and\
    \ the similarity to XML is only for familiarity.^([1](#ch02.html_idm139745275222416))\n\
    \nHere we explore some of the key differences between JSX and the HTML syntax.\n\
    \n## Attributes\n\nIn HTML you set the attributes of each node inline, like this:\n\
    \n```\n <div id=\"some-id\" class=\"some-class-name\">...</div>\n```\n\nJSX implements\
    \ attributes in the same manner, with the huge advantage that you can set attributes\
    \ to dynamic JavaScript variables. You do this by wrapping a JavaScript variable\
    \ in curly-brackets instead of quotes.\n\n```\n var surveyQuestionId = this.props.id;\n\
    var classes = 'some-class-name';\n...\n<div id={surveyQuestionId} className={classes}>...</div>\n\
    ```\n\nFor more complex situations you can set an attribute to the result of a\
    \ function call.\n\n```\n <div id={this.getSurveyId()} >...</div>\n```\n\nNow\
    \ each time React chooses to render a component, the variables and function calls\
    \ will be evaluated and the resulting DOM will reflect this new state.\n\nYou\
    \ can read the full source code of our example application, a survey builder,\
    \ at [http://git.io/vlcpa](http://git.io/vlcpa).\n\n## Conditionals\n\nIn React,\
    \ a component’s markup and the logic that generate it are inherently tied together.\
    \ This means that you have the full logical power of JavaScript at your fingertips,\
    \ such as with loops and conditionals.\n\nIt can be tricky to add conditional\
    \ logic to your components since if/else logic is hard to express as markup. Adding\
    \ `if` statements directly to JSX will render invalid JavaScript:\n\n```\n <div\
    \ className={if(isComplete) { 'is-complete' }}>...</div>\n```\n\nSo the solution\
    \ is to use one of the following:\n\n*   Use ternary logic\n\n*   Set a variable\
    \ and refer to it in the attribute\n\n*   Offload the switching logic to a function\n\
    \n*   Use the `&&` operator\n\nHere is a quick example showing what each may look\
    \ like.\n\n**Using the ternary operator**\n\n```\n ...\nrender() {\n  return (\n\
        <div \n      className={this.state.isComplete ? 'is-complete' : ''}\n    >\n\
          ...\n    </div>\n  );\n}\n...\n```\n\nWhile the ternary operator works well\
    \ for text, it can be cumbersome and difficult to read when you want to use a\
    \ React component in either case. For these situations it is better to use the\
    \ following methods.\n\n**Using a variable**\n\n```\n ...\ngetIsComplete() {\n\
    \  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  var isComplete\
    \ = this.getIsComplete();\n  return (\n    <div className={isComplete}>...</div>\n\
      );\n}\n...\n```\n\n**Using a function call**\n\n```\n ...\ngetIsComplete() {\n\
    \  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  return\
    \ (\n    <div className={this.getIsComplete()}>...</div>\n  );\n}\n...\n```\n\n\
    **Using the double-and (`&&`) operator**\n\nBecause React does not output anything\
    \ for null or false values you can use a boolean value and follow it with the\
    \ desired output string. If the boolean evaluates to true then the following string\
    \ will be used.\n\n```\n render() {\n  return (\n    <div className={this.state.isComplete\
    \ && 'is-complete'}>\n      ...\n    </div>\n  );\n}\n```\n\n# Non-DOM attributes\n\
    \nThe following special attribute names exist in JSX:\n\n*   `key`\n\n*   `ref`\n\
    \n*   `dangerouslySetInnerHTML`\n\nHere we will explore them in more detail.\n\
    \n**Keys**\n\n`key` is an optional unique identifier. Items and lists can change\
    \ relative to their siblings, for example as the user performs a search or items\
    \ are added, removed, or reordered in a list. When this happens, your component\
    \ might be needlessly destroyed and recreated React may perform naive updates. \n\
    \nBy setting a unique key on a component that remains consistent throughout render\
    \ passes, you inform React so it more intelligently decides when to reuse or destroy\
    \ a component, thus improving rendering performance. Then, when two items already\
    \ in the DOM switch positions, React can match the keys and move them without\
    \ completely re-rendering their DOM.\n\n**References** \n\n`ref` allows parent\
    \ components to keep a reference to child components available outside of the\
    \ render function.\n\nYou define a ref in JSX by setting the attribute to the\
    \ desired reference name.\n\n```\n ...\nrender() {\n  return <div>\n    <input\
    \ ref=\"myInput\" ... />\n  </div>;\n}\n...\n```\n\nAnd later you can access this\
    \ ref by using `this.refs.myInput` anywhere in your component. For DOM components\
    \ such as input, the ref is the DOM node in question. For composite components,\
    \ the ref is the component instance. In practice, you will rarely use refs with\
    \ React, they serve as an escape hatch from React’s declarative nature.\n\nFor\
    \ more detail see the discussion on parent/child relationships versus ownership\
    \ in [Chapter 6](#ch06.html_parent-child-relationship).\n\n**Setting raw HTML**\n\
    \n`dangerouslySetInnerHTML`—sometimes you need to set HTML content as a string,\
    \ especially when working with third party libraries that manipulate DOM via strings.\
    \ To improve React’s interoperability, this attribute allows you to use HTML strings,\
    \ but it’s not recommended if you can avoid it. To use this property set it to\
    \ an object with key `__html` set, like this:\n\n```\n ...\nrender() {\n  var\
    \ htmlString = {\n    __html: \"<span>an html string</span>\"\n  };\n  return\
    \ <div dangerouslySetInnerHTML={htmlString} ></div>;\n}\n...\n```\n\n# dangerouslySetInnerHTML\n\
    \n`dangerouslySetInnerHTML` may be changing soon, as described here: \n\n[https://github.com/facebook/react/issues/2134](https://github.com/facebook/react/issues/2134)\n\
    \n[https://github.com/facebook/react/pull/1515](https://github.com/facebook/react/pull/1515)\n\
    \n## Events\n\nEvent names are normalized across all browsers and are represented\
    \ in camelCase. For example, `change` becomes `onChange`, and `click` becomes `onClick`.\
    \ Capturing an event in JSX is as simple as assigning the property to a method\
    \ on the component.\n\n```\n ...\nhandleClick(event) {...}\nrender() {\n  return\
    \ (\n    <div \n      onClick={(e) => this.handleClick(e)}\n    >\n      ...\n\
        </div>\n  );\n}\n...\n```\n\nNote that you use an arrow function here because\
    \ it preserves this. Otherwise this would be undefined in `handleClick`. It also\
    \ gives you easy control of which arguments are passed to the function.\n\nFor\
    \ more details on the event system in React, reference Chapter 9.\n\n## Comments\n\
    \nJSX is JavaScript, so you can add plain JavaScript comments within your JSX\
    \ markup. Comments can be added in two places:\n\n1.  As a child node of an element\n\
    \n2.  Inline with a node’s attributes\n\n**As a child node**"
