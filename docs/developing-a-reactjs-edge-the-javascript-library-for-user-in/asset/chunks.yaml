  trans: "\n\n以下示例通过将状态存储在 `MyForm` 组件中，复现了非受控单选按钮组的功能。你会注意到 `name` 并未被使用。\n\n```\n\
    \ class MyForm extends React.Component {\n  constructor(){\n    super();\n   \
    \ this.state = {\n      radio: \"B\"\n    };\n  }\n  handleChange(event) {\n \
    \   this.setState({\n      radio: event.target.value\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.state.radio);\n  }\n  render()\
    \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n    \
    \    <input\n          type=\"radio\"\n          value=\"A\"\n          checked={this.state.radio\
    \ == \"A\"}\n          onChange={(e) => this.handleChange(e)} /> A\n        <br\
    \ />\n        <input \n          type=\"radio\"\n          value=\"B\"\n     \
    \     checked={this.state.radio == \"B\"}\n          onChange={(e) => this.handleChange(e)}\
    \ /> B\n        <br />\n        <input \n          type=\"radio\"\n          value=\"\
    C\"\n          checked={this.state.radio == \"C\"}\n          onChange={(e) =>\
    \ this.handleChange(e)} /> C\n        <br />\n        <button type=\"submit\"\
    >Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n# 多个表单元素与变更处理器\n\n在使用受控表单元素时，你不希望为每个表单元素都编写一个变更处理器。幸运的是，有几种不同的方法可以在\
    \ React 中复用变更处理器。\n\n一个示例：箭头函数。\n\n```\n class MyForm extends React.Component\
    \ {\n  constructor() {\n    super();\n    this.state = {\n      given_name: \"\
    \",\n      family_name: \"\"\n    };\n  }\n  handleChange(name, event) {\n   \
    \ var newState = {};\n    newState[name] = event.target.value;\n    this.setState(newState);\n\
    \n    // or the es6 version\n    this.setState({\n      [name]: event.target.value,\n\
        });\n  }\n  submitHandler(event) {\n    event.preventDefault();\n    var words\
    \ = [\n      \"Hi\",\n      this.state.given_name,\n      this.state.family_name\n\
    \    ];\n    alert(words.join(\" \"));\n  }\n  render() {\n    return (\n    \
    \  <form onSubmit={this.submitHandler}>\n        <label htmlFor=\"given_name\"\
    >Given Name:</label>\n        <br />\n        <input\n          type=\"text\"\n\
    \          name=\"given_name\"\n          value={this.state.given_name}\n    \
    \      onChange={(e) => this.handleChange('given_name', e)}/>\n        <br />\n\
    \        <label htmlFor=\"family_name\">Family Name:</label>\n        <br />\n\
    \        <input\n          type=\"text\"\n          name=\"family_name\"\n   \
    \       value={this.state.family_name}\n          onChange={(e) => this.handleChange('family_name',\
    \ e)}/>\n        <br />\n        <button type=\"submit\">Speak</button>\n    \
    \  </form>\n    );\n  }\n};\n```\n\n另一个示例：使用 `DOMNode` 的 `name` 来识别要更改的状态。\n\n\
    ```\n //http://jsfiddle.net/q3g0sk84/\nclass MyForm extends React.Component {\n\
    \  constructor() {\n    super();\n    this.state = {\n      givenName: \"\",\n\
    \      familyName: \"\",\n    };\n  }\n  handleChange(event) {\n    this.setState({\n\
          [event.target.name]: event.target.value\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    var words = [\n      \"Hi\",\n      this.state.givenName,\n\
    \      this.state.familyName,\n    ];\n    alert(words.join(\" \"));\n  }\n  render()\
    \ {\n    return (\n      <form onSubmit={this.submitHandler}>\n        <label\
    \ htmlFor=\"givenName\">Given Name:</label>\n        <br />\n        <input\n\
    \          type=\"text\"\n          name=\"givenName\"\n          value={this.state.givenName}\n\
    \          onChange={(e) => this.handleChange(e)}/>\n        <br />\n        <label\
    \ htmlFor=\"familyName\">Family Name:</label>\n        <br />\n        <input\n\
    \          type=\"text\"\n          name=\"familyName\"\n          value={this.state.familyName}\n\
    \          onChange={this.handleChange}/>\n        <br />\n        <button type=\"\
    submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n# 自定义表单组件\n\n\
    创建自定义表单组件是在应用程序中复用通用功能的绝佳方式。它也是改善与其他更复杂表单组件（如复选框和单选按钮）接口的好方法。\n\n在编写自定义表单组件时，应尽量创建与其他表单组件相同的接口。这将提高代码的可预测性，使你在无需查看其实现的情况下就能更容易地理解组件的工作方式。\n\
    \n让我们创建一个自定义单选按钮组件，使其具有与 React 的 select 组件相同的接口。我们不会实现多选功能，因为单选按钮组件不支持多选。\n\n\
    ```\n class Radio extends React.Component {\n  static propTypes = {\n    onChange:\
    \ React.PropTypes.func\n  };\n\n  constructor(){\n    super();\n    this.state\
    \ = {\n      value: this.props.defaultValue\n    };\n  }\n  handleChange(event)\
    \ {\n    if (this.props.onChange) {\n      this.props.onChange(event);\n    }\n\
    \    this.setState({\n      value: event.target.value\n    });\n  }\n  render()\
    \ {\n    var value = this.props.value || this.state.value;\n\n    var children\
    \ = React.Children\n      .map(this.props.children, (child, i) => {\n      return\
    \ (\n        <label key={i}>\n          <input\n            type=\"radio\"\n \
    \           name={this.props.name}\n            value={child.props.value}\n  \
    \          checked={child.props.value == value}\n            onChange={this.handleChange}\
    \ />\n          {child.props.children}\n          <br/>\n        </label>\n  \
    \    );\n    });\n\n    return this.transferPropsTo(<span>{children}</span>);\n\
    \  }\n};\n```\n\n本质上，我们正在创建一个支持受控和非受控接口的受控组件。\n\n首先要确保如果提供了 `onChange`，它必须是一个函数。然后将\
    \ `defaultValue` 存储在状态中。\n\n每次组件渲染时，它会根据作为子元素提供给组件的选项创建新的标签和单选按钮。确保动态子元素具有一致的\
    \ `key` 属性。这可以确保 React 将你的 `<input/>` 保留在 DOM 中，并在使用键盘控制时保持当前焦点。\n\n然后设置 `value`、`name`\
    \ 和 `checked` 状态。附加你的 `onChange` 处理器，然后渲染新的子元素。\n\n```\n //Uncontrolled\n//http://jsfiddle.net/moyfLkfv/\n\
    var MyForm = React.createClass({\n  submitHandler: function (event) {\n    event.preventDefault();\n\
    \    alert(this.refs.radio.state.value);\n  },\n  render: function () {\n    return\
    \ <form onSubmit={this.submitHandler}>\n        <Radio ref=\"radio\" name=\"my_radio\"\
    \ defaultValue=\"B\">\n          <option value=\"A\">First Option</option>\n \
    \         <option value=\"B\">Second Option</option>\n          <option value=\"\
    C\">Third Option</option>\n        </Radio>\n        <button type=\"submit\">Speak</button>\n\
    \      </form>;\n  }\n});\n```\n\n当将值存储在组件的状态中时，你无需访问 `DOMNode` 就能知道当前值。你可以直接访问状态。\n\
    \n```\n //Controlled\n//http://jsfiddle.net/cwabLksg/\nvar MyForm = React.createClass({\n\
    \  getInitialState: function () {\n    return {my_radio: \"B\"};\n  },\n  handleChange:\
    \ function (event) {\n    this.setState({\n      my_radio: event.target.value\n\
    \    });\n  },\n  submitHandler: function (event) {\n    event.preventDefault();\n\
    \    alert(this.state.my_radio);\n  },\n  render: function () {\n    return <form\
    \ onSubmit={this.submitHandler}>\n        <Radio name=\"my_radio\" \n        \
    \    value={this.state.my_radio}\n            onChange={this.handleChange}>\n\
    \          <option value=\"A\">First Option</option>\n          <option value=\"\
    B\">Second Option</option>\n          <option value=\"C\">Third Option</option>\n\
    \        </Radio>\n        <button type=\"submit\">Speak</button>\n      </form>;\n\
    \  }\n});\n```\n\n作为一个受控组件，它的操作方式与 select 框完全相同。传递给 `onChange` 的事件是来自活动 `<input/>`\
    \ 的事件，因此你可以用它来读取当前值。\n\n作为练习，你可以尝试实现 `valueLink` 属性的支持，以便将此组件与 `React.addons.LinkedStateMixin`\
    \ 一起使用。\n\n# 焦点\n\n"
- fmt: "\nLeveraging control of focus on form components is an excellent way to guide\
    \ your users as to what the next logical step is in your forms. It also helps\
    \ cut down on user interaction, increasing usability. The merits of this are discussed\
    \ more in the following section.\n\nSince React forms are not always rendered\
    \ at browser load, the auto focus for form inputs needs to operate a little differently.\
    \ React has implemented `autoFocus` so when the component is first mounted, if\
    \ no other form input has focus, React will place focus on the input. This is\
    \ how you would expect a simple HTML form with `autoFocus` to operate.\n\n```\n\
    \ //jsx\n<input type=\"text\" name=\"given_name\" autoFocus=\"true\" />\n```\n\
    \nYou can also manually set the focus of form fields by calling `focus()` on the\
    \ `DOMNode`.\n\n# Usability\n\nReact is awesome for productivity for developers,\
    \ however, this can have down sides.\n\nIt is really easy to make components that\
    \ lack usability. For example, you may have forms with little keyboard support\
    \ where only `onClick` of a hyperlink can submit the form. This stops a user from\
    \ pressing `enter` on their keyboard to submit the form, which is the default\
    \ behavior of HTML forms.\n\nIt is also really easy to make fantastic components\
    \ that are highly usable. Time and consideration are required when building your\
    \ components. It is all the little things that help make a component be highly\
    \ usable and feel right.\n\nThis following is a collection of best practice for\
    \ creating usable forms. They are not specific to React. \n\n## Communicate your\
    \ requirements clearly\n\nGood communication is important with all aspects of\
    \ your application, especially in forms.\n\nUse of HTML labels is a great way\
    \ to communicate to your users what the form element is expecting. These also\
    \ give the user an extra way to interact with your form element for some input\
    \ types like radios and checkboxes. \n\nPlaceholders are designed to show example\
    \ input or a default value if no data is entered. There has been a fad to place\
    \ validation hints in the placeholder. This can be quite problematic as when the\
    \ user starts to type, their validation hints disappear. It is generally better\
    \ to show your validation hints along side your inputs or as a popover when your\
    \ validation requirements are not met.\n\n## Give feedback constantly\n\nThis\
    \ follows on from communicating your requirements clearly. It is very important\
    \ to give feedback to your users as quickly as possible.\n\nValidation errors\
    \ are a perfect example of giving feedback constantly. It is well known that showing\
    \ validation errors as they occur increase the usability of your forms. Back in\
    \ the early days of the web applications, all users had to wait till they finished\
    \ completing their form to find out if they entered everything correctly. Validation\
    \ in the browser was a massive leap forward in usability. The ideal time to give\
    \ feedback for validation errors is on `blur` of the input.\n\nIt’s also important\
    \ to show your users that you are working on their request. This is especially\
    \ true for actions that can take some time to complete. Showing spinners, progress\
    \ bars, notification messages, etc. are a great way to inform your users that\
    \ your application has not frozen. Users are very impatient at times, however,\
    \ they can be patient if they know your application is processing their request.\n\
    \nTransitions and animations are another great way of informing your users what\
    \ is happening in your application. They are another visual prompt that something\
    \ in your application has changed. See Chapter 10 to learn how to leverage this\
    \ in React.\n\n## Be fast\n\nReact has a very powerful rendering engine. It helps\
    \ your application to be quite fast right out of the box. However, there are times\
    \ when the speed of updating the DOM is not what is slowing down your application.\n\
    \nTransitions are a perfect example. Long running transitions may frustrate your\
    \ users as they are forced to wait for the transition to complete before continuing\
    \ to use your application.\n\nOther factors outside your application can also\
    \ alter how fast your application performs, like long running AJAX calls and poor\
    \ network performance. How to solve these kinds of issues can be very specific\
    \ to your application and may be outside of your control, like third party services.\
    \ In these cases it is more important to give feedback to your users about the\
    \ state of their request.\n\nIt is important to remember that speed is relative.\
    \ It is a perception of the user. It is more important to appear fast than to\
    \ be fast. For example, when a user clicks “like” in your application, you can\
    \ increment the like count before you send your AJAX call to the server. This\
    \ way if the AJAX call takes a long time, your users won’t see the delay. This\
    \ can, however, lead into other issues with handling errors.\n\n## Be predictable\n\
    \nUsers have a predetermined idea of how things work. This is based on their prior\
    \ experience. In most cases their prior experience is **not** from using your\
    \ application.\n\nIf your application resembles the platform your user is on,\
    \ your user will expect that your application conforms to the default behaviors\
    \ for the platform you are on.\n\nWith this in mind, you are left with two options.\
    \ You can either conform to the default behaviors of the platform, or you can\
    \ radically change your user interface so it no longer resembles the platform.\n\
    \nConsistency is another form of predictability. If your interactions are always\
    \ the same in different parts of your application, your users will learn to predict\
    \ the interaction in new parts of your application. This ties into conforming\
    \ with platform that your application runs on.\n\n## Be accessible\n\nAccessibility\
    \ is often overlooked by developers and designers when creating user interfaces.\
    \ It is important to keep your users in mind when considering all aspects of your\
    \ user interfaces. As already covered, your users have a predefined expectation\
    \ of how things work, which is based on *their* past experience.\n\nTheir past\
    \ experience also governs their preference for different input types. In some\
    \ cases your users may have physical issues with using a particular input device\
    \ like a keyboard or mouse. They may also have issues with using an output device\
    \ like a display or speakers.\n\nBuilding support for all the different types\
    \ of input and output devices may not be viable for every aspect of your application. It\
    \ is  important to understand your users requirements and preferences, then work\
    \ on those areas first.\n\nA great way to test how accessible your application\
    \ is to try and navigate your application exclusively via one input device keyboard/mouse/touch\
    \ screen. This will highlight usability issues with that device.\n\nYou may also\
    \ want to consider how to interact with your application if you are visually impaired.\
    \ Screen readers are the eyes for visually impaired people.\n\nHTML5 has an Accessible\
    \ Rich Internet Applications (ARIA) specification that provides a way to add the\
    \ missing semantics needed by assistive technologies such as screen readers. This\
    \ allows you to hint on the `role` of your UI components, and hide or show elements\
    \ if a screen reader is active and much more.\n\nThere are some great tools to\
    \ help with accessibility in your applications like the Accessibility Developer\
    \ Tools for Google Chrome.\n\n## Reduce user input\n\nReducing how much data your\
    \ users need to enter is a great way to improve usability for your applications. The\
    \ less information your users need to enter, the less chance they have of making\
    \ mistakes and the less they need to think about.\n\nAs with **Be fast**, user\
    \ perception is important. Users feel daunted by large forms with many input fields,\
    \ so their mind struggles to cope. Breaking your forms into smaller more manageable\
    \ chunks gives the impression of less user input. This in turn enables the user\
    \ to be more focused on their data input.\n"
