  trans: "\n\n当你开始将代码迁移到服务器上运行时，需要格外小心，因为同一作用域内可能同时运行着应用的多个实例。这可能导致两个应用实例改变单例的状态，从而引发意外行为。\n\
    \n`React` 的渲染是同步的，因此你可以在服务器端渲染应用之前重置所有使用的单例。如果异步状态需要使用单例，就会遇到问题。此外，在获取异步状态用于渲染时，你也需要考虑这一点。\n\
    \n即使重置了单例，在渲染之前，将应用隔离运行始终是更好的选择。像 `Contextify` 这样的包允许你在服务器上彼此隔离地运行代码。这类似于在客户端使用\
    \ webworkers。`Contextify` 的工作原理是获取你的应用代码，并在一个独立的 Node.js V8 实例中运行它。一旦代码加载完成，你就可以在该上下文中调用函数。这种方法让你可以自由使用单例，但会带来性能开销，因为每个请求都需要启动一个新的\
    \ Node.js V8 实例。\n\n`React` 核心开发团队不鼓励在组件树中传递上下文和实例。这会使你的组件可移植性降低，并且应用中深层某个组件的依赖关系变化会向上影响组件层级中的所有组件。这反过来增加了应用的复杂性，随着应用的增长，可维护性也会降低。\n\
    \n在决定使用单例还是实例来控制上下文时，每种方法都有其权衡。你需要根据具体需求评估后再决定采用哪种方法。同时，还需要考虑你所使用的第三方库的架构方式。\n\
    \n# 总结\n\n服务器端渲染是构建搜索引擎优化的网站和 Web 应用的重要组成部分。`React` 支持在服务器和客户端浏览器上渲染相同的 `React`\
    \ 组件。为了有效实现这一点，你需要确保整个应用的架构能够支持服务器端渲染。\n\n接下来，你将学习 `React` 家族中的开发和构建工具。\n\n# 第\
    \ 13 章 开发工具\n\n`React` 利用了几层抽象来帮助简化组件的开发并理解应用的状态。这些抽象在调试、构建和发布应用时存在一些缺点。\n\n幸运的是，有一些出色的开发工具可以帮助你调试和构建应用。在本章中，我们将探讨可以与\
    \ `React` 有效配合使用的构建工具和调试工具。\n\n# 构建工具\n\n构建工具帮助你简化重复性任务，使代码运行过程更加轻松。`React` 开发中最重复的任务之一是对所有\
    \ `React` 组件运行 JSX 解析器。另一个重要任务是将所有模块打包成一个或多个包，以便发送到浏览器。\n\n让我们看看如何将两种流行的 JavaScript\
    \ 构建工具 `Browserify` 和 `Webpack` 与 `React` 结合使用。\n\n# Browserify\n\n`Browserify`\
    \ 是一个 JavaScript 打包工具，允许在浏览器中使用 Node.js 风格的 `require()` 调用。在不深入细节以免迷失方向的前提下，`Browserify`\
    \ 将所有 require 打包成一个适合在浏览器环境中运行的捆绑 JavaScript 文件。对任何包含 `require` 语句的 JavaScript\
    \ 文件运行 `Browserify` 都会自动打包所需的 JavaScript。\n\n虽然功能强大，但 `Browserify` 仅适用于 JavaScript，与\
    \ `Bower`、`Webpack` 或其他打包解决方案不同。\n\n## 设置一个 Browserify 项目\n\n要让 `Browserify` 运行起来，你必须初始化一个\
    \ node 项目。假设你已经安装了 node 和 npm，可以在终端中使用以下命令初始化一个新项目。这将创建一个包含必要资源的 `package.json`\
    \ 文件。\n\n```\nnpm init\n# ... 根据需要回答问题以完成初始化\nnpm install --save-dev browserify\
    \ babelify \\\nbabel-preset-es2015 babel-preset-react \\\nbabel-preset-stage-1\
    \ \\\nreact uglify-js\n```\n\n将以下构建脚本添加到 `package.json` 文件的底部，使其看起来类似这样：\n\n```\n\
    \ ...\n  \"devDependencies\": {\n    \"browserify\": \"⁵.11.2\",\n    \"babelify\"\
    : \"⁶\",\n    \"react\": \"⁰.11.1\",\n    \"uglify-js\": \"².4.15\",\n     ...\n\
    \  },\n  \"scripts\": {\n    \"build\": \"browserify --debug index.js > bundle.js\"\
    ,\n    \"build-dist\": \"NODE_ENV=production browserify index.js | uglifyjs -m\
    \ > bundle.min.js\"\n  },\n  \"browserify\": {\n    \"transform\": [\"babelify\"\
    ]\n  }\n}\n```\n\n同时创建一个名为 `.babelrc` 的文件，告诉 babel 使用哪些转换。\n\n```\n {\n  \"presets\"\
    : [\"es2015\", \"react\", \"stage-1\"]\n}\n```\n\n默认的构建任务可以通过 `npm run build`\
    \ 运行，它会创建一个带有 source map 的包。这让你可以检查错误消息并设置断点，就像每个文件单独引入一样。你还会看到包含 JSX 的原始代码，而不是编译后的输出。\n\
    \n对于生产构建，你需要指定环境为生产环境。`React` 使用一个名为 `envify` 的转换，当与 `uglify` 这样的压缩工具结合使用时，可以移除调试代码和详细的错误消息，以获得更好的性能和更小的文件体积。\n\
    \n现在你已经准备好编写一些 `React` 代码并进行打包了。\n\n# 添加一些 React 内容\n\n创建以下 `React` + JSX 的 JavaScript\
    \ 文件，命名为 `index.js`。\n\n```\nvar React = require('react');\nvar ReactDOM = require('react-dom');\n\
    \nvar root = document.getElementById('root');\nReactDOM.render(<h1>Hello World</h1>,\
    \ root);\n```\n\n并添加一个基本的 `index.html` 文件：\n\n```\n<html>\n  <head>\n    <title>React\
    \ + Browserify Demo</title>\n  </head>\n  <body>\n\n    <div id=\"root\"></div>\n\
    \    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n现在你的项目根目录下将包含以下文件和文件夹：\n\
    \n*   `index.html`\n*   `index.js`\n*   `node_modules/`\n*   `package.json`\n\n\
    如果你现在尝试加载 `index.html`，它将无法渲染 JavaScript，因为你还没有构建最终的包。运行 `npm run build` 并重新加载页面，即可看到你的\
    \ hello world 示例。\n\n## Watchify\n\n你可以选择添加一个 watch 任务，这对开发很有帮助。`Watchify` 是 `Browserify`\
    \ 的一个包装器，当你更改文件时会重新构建你的包。它使用缓存来加速重新构建。\n\n```\nnpm install --save-dev watchify\n\
    ```\n\n将其添加到 `package.json` 的 scripts 对象中：\n\n```\n\"watch\": \"watchify --debug\
    \ index.js -o bundle.js\"\n```\n\n现在，你可以使用 `npm run watch` 代替 `npm run build`，以获得更流畅的开发体验。\n\
    \n## 构建\n\n现在，只需运行构建脚本即可将你的 `React` + JSX 文件打包成浏览器可用的脚本。\n\n```\nnpm run-script\
    \ build\n```\n\n你应该会看到一个新的 `bundle.js` 文件出现。如果你打开 `bundle.js`，会注意到顶部有一些压缩后的 JavaScript，接着是你转换后的\
    \ `React` + JSX 代码。这个文件现在包含了所有支持代码以及你的 `index.js` 文件，可以在浏览器中运行，加载 `index.html`\
    \ 将会成功。\n\n## Webpack\n\n`Webpack` 类似于 `Browserify`，它将你的 JavaScript 打包成一个单独的包。然而，将\
    \ `Browserify` 和 `Webpack` 直接比较并不公平，因为 `Webpack` 拥有更多功能，而 `Browserify` 通常不会单独使用。\n\
    \n`Webpack` 还可以：\n\n*   将 CSS、图片和其他资源打包到同一个包中。\n*   在打包前预处理文件（less、coffee、jsx\
    \ 等）。\n*   根据入口位置将你的包拆分成多个文件。\n*   支持开发环境的功能标志。\n*   执行“热”模块替换。\n*   支持异步加载。\n\
    \n"
- fmt: "\nAs a result, `Webpack` can do the job of `Browserify` mixed with other build\
    \ tools like `grunt` or `gulp`.\n\n`Webpack` is a module system, and is supported\
    \ by adding and replacing plugins. By default it comes with a `commonjs` parser\
    \ plugin enabled.\n\nWe won’t detail every aspect of `Webpack` here, but will\
    \ cover the basics and what you need to get `Webpack` to work with `React`.\n\n\
    ### Webpack and React\n\n`React` helps you to create components for your application.\
    \ `Webpack` helps you bundle not only JavaScript, but all of your other assets\
    \ required for your application. This allows you to create components that include\
    \ all of their asset dependencies. This then makes your components more portable,\
    \ given that they can bring their own dependencies along with them. As an added\
    \ advantage, as your application grows and changes and when you remove components,\
    \ their asset dependencies are also removed. This means no more dead CSS or orphaned\
    \ images.\n\nLet’s have a look at what a what a `React` component looks like when\
    \ it is requiring it’s own asset dependencies.\n\n```\n //logo.js\nrequire('./logo.css');\n\
    \nvar React = require('react');\n\nvar Logo = React.createClass({\n    render:\
    \ function () {\n        return <img className=\"Logo\" src={require('./logo.png')}\
    \ />\n    }\n});\n\nmodule.exports = Logo;\n```\n\nTo bundle this component up\
    \ you need to have any entry point for your application.\n\n```\n //app.js\nvar\
    \ React = require('react');\nvar ReactDOM = require('react-dom');\nvar Logo =\
    \ require('./logo.js');\n\nvar root = document.getElementById('root');\nReact.render(<Logo/>,\
    \ root);\n```\n\nYou will now create a `Webpack` config file to tell `Webpack`\
    \ what loaders to use for the different file types. And, we will show what your\
    \ applications entry point is and where to place all of the bundled files.\n\n\
    ```\n //webpack.config.js\nmodule.exports = {\n    //starting point of your application\n\
    \  entry: './app.js',\n  output: {\n\n    //location for all bundled assets\n\
    \    path: './public/build',\n\n    //prefix for all url-loader assets\n    publicPath:\
    \ './build/',\n\n    //resulting name of bundled application\n    filename: 'bundle.js'\n\
    \  },\n  module: {\n    loaders: [\n      {\n\n        //regex for file type supported\
    \ by the loader\n\n        test: /\\.(js)$/, \n        loader: 'babel-loader'\n\
    \      },\n\n      {\n\n        test: /\\.(css)$/,\n\n        //multiple loaders\
    \ are chained together with an \"!\";\n\n        loader: 'style-loader!css-loader'\n\
    \n      },\n\n      {\n\n        test: /\\.(png|jpg)$/,\n\n        //url-loader\
    \ supports base64 encoding for inline assets\n\n        loader: 'url-loader?size=8192'\n\
    \n      }\n    ]\n  }\n};\n```\n\nYou now want to install `Webpack` and all of\
    \ the loaders. You can either use `npm` via the command line, or `package.json`.\n\
    \nMake sure you install the loaders locally, not globally (`-g`).\n\n```\n npm\
    \ install webpack react\nnpm install url-loader jsx-loader style-loader css-loader\n\
    ```\n\nOnce everything is installed, you can run `Webpack`:\n\n```\n //build once\
    \ for development \nwebpack \n\n//build with source maps\nwebpack -d \n\n//build\
    \ for production, minified, uglify dead-code removal\nwebpack -p\n\n//fast incremental\
    \ building, can be use with other options\nwebpack --watch\n```\n\n# Debugging\
    \ tools\n\nNo matter how careful you are, mistakes will be made. We won’t cover\
    \ how to debug JavaScript, but we will talk about some tools to make debugging\
    \ `React` applications easier. \n\n# Starting out\n\nFor this chapter, open Chrome\
    \ and install the [React Developer Tools](https://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapgofadopljbjfkapdkoienihi?hl=en)\
    \ addon.\n\nRight-click on an element, and choose Inspect Element.  You get the\
    \ familiar view of the DOM structure, which is the elements tab.\n\nYou’re not\
    \ here to look at the DOM, though.  You want to see the components, their props,\
    \ and their state.  If completed, to take the next steps, you should see a tab\
    \ on the far right named React.\n\n![image of react developer tools after selecting\
    \ an element](assets/001.png)\n\nThe hierarchy of components is on the left, and\
    \ the information about the selected instance is on the right.  \n\nViewing just\
    \ this information can tell you a lot about the state, props, and event listeners\
    \ attached to your components in React. The developer tools allow you to do even\
    \ more than this.\n\n![image of react developer tools showing a tree view of passed\
    \ props](assets/003.png)\n\nYou can see your `SurveyTable` component get passed\
    \ an array of surveys that contains timestamps.  In the actual view, they’re presented\
    \ in a human readable format.  Double-click one of the timestamps and type in\
    \ a new value.  This causes the component to update with the new value.  \n\n\
    The developer tools help you narrow down problems, and helps new people on your\
    \ team find the components they need to edit and complete tasks.\n\n# JSBin and\
    \ JSFiddle\n\nWhile debugging, or just brainstorming, online demo sites like `JSFiddle`\
    \ and `JSBin` are great assets.  Use them to create test cases when asking for\
    \ help, or to share prototypes with others.\n\nHere is a `jsbin` set up with `Babel`\
    \ and `React`, ready for you to create things: [http://jsbin.com/ledaqefuya/1/edit?js,output](http://jsbin.com/ledaqefuya/1/edit?js,output).\n\
    \n# Summary\n\nYou should now see the benefits that debugging and building tools\
    \ can provide you with when developing with `React`. In the next chapter you will\
    \ find details on how to use automated testing in `React`.  \n\n# Chapter 14\\\
    . Testing\n\nNow that you’ve learned the ins and outs of how to build a web application\
    \ using `React`, let’s take a step back before learning about architectural patterns\
    \ (that will happen in Chapter 15). When you are starting a new application, productivity\
    \ is very simple because you just crank out more code.  But as your application\
    \ evolves, if you aren’t careful, you can find yourself with a code base that\
    \ is a twisted mess, which is very hard to change.  That is why it is very important\
    \ to have a powerful tool in your toolbox: automated testing.  Automated testing,\
    \ usually employed through a Test Driven Development (TDD) workflow, can help\
    \ you achieve code that is simpler, more modular, is less brittle to change, and\
    \ can be changed with more confidence. \n\n# But I’ve never tested my JavaScript\
    \ before?\n\nThat’s ok!  If you’ve never done it before, automated testing can\
    \ seem like a foreign concept that is always slightly out of reach. This chapter\
    \ won’t serve as an exhaustive resource for JavaScript testing because that deserves\
    \ it’s own book, but we’ll try to provide enough context so you can follow along\
    \ and research specific topics on your own when needed.\n\n# Getting started\n\
    \nYou may be asking, “But I have an amazing QA team focused on testing.  Why should\
    \ I care about testing?  Can’t I just skip this chapter?\"  Great questions! \
    \ The main reason automated testing will help you is not related to bugs or catching\
    \ regressions, but that is a helpful side effect of testing.  The real goal of\
    \ automated testing is that it helps you write *better*code.  More often than\
    \ not, code that is poorly written is hard to test.  So if you start writing your\
    \ tests as you write your code, your tests will encourage you not to write sloppy\
    \ code.  You will be naturally pushed to follow the single responsibility principle\
    \ ^([1](#ch14.html_idm139745264274896)), the law of demeter ^([2](#ch14.html_idm139745264273568)),\
    \ and keeping code in a modular way.\n\nWhen we refer to Test Driven Development,\
    \ or TDD, we are referring to a style of testing that uses a “Red, Green, Refactor”\
    \ process.  First, you write a test that fails (the test is red), then you write\
    \ the application code to make the test pass (the test is green), and then you\
    \ refactor the application code to make it cleaner while keeping the test green.\
    \  It is a process that allows you to work in small batches and each iteration\
    \ gives a positive feeling when the test turns green.\n\n## Types of testing\n"
