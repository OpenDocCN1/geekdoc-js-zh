    \    d1:null, d2:null, d3:null, d4:null\n};\n```\n\n棋盘的数据结构是一个对象，其中的`keys`直接对应\
    \ CSS 中定义的视觉网格位置。在初始数据结构之后，你将看到一系列操作该给定数据结构的函数。所有这些函数都以不可变的方式运行，因此返回一个新棋盘，而不会改变输入。这为游戏逻辑提供了一些灵活性，因为它能够比较移动前后的棋盘，并在不改变游戏状态的情况下推测性地执行移动。\n\
    \n该数据结构的另一个有趣特性是棋盘的结构共享。所有棋盘共享对棋盘上未改变方块的引用。这使得创建新棋盘非常快速，并允许使用引用相等性来比较棋盘。\n\n游戏由两个\
