  trans: "\n向 React 应用引入不可变性的最简单方法是使用不可变辅助插件（Immutability Helpers Addon）。它让你能够继续使用现有的可变数据结构，就像它们是不可变的一样，通过轻松创建新的（也是可变的）对象，而不是就地更新。\n\
    \n虽然这实际上并没有给你任何新的保证，但它允许你像上面描述的那样编写一个快速的 `shouldComponentUpdate` 函数。\n\n让我们更新示例，使用不可变辅助插件：\n\
    \n```\n var update = React.addons.update;\n\nvar SurveyEditor = React.createClass({\n\
    \  // ...\n\n  handleDrop: function (ev) {\n    var questionType = ev.dataTransfer.getData('questionType');\n\
    \    var questions = update(this.state.questions, {\n      $push: [{ type: questionType\
    \ }]\n    });\n\n    this.setState({\n      questions: questions,\n      dropZoneEntered:\
    \ false\n    });\n  },\n\n  handleQuestionChange: function (key, newQuestion)\
    \ {\n    var questions = update(this.state.questions, {\n      $splice: [[key,\
    \ 1, newQuestion]]\n    });\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = update(this.state.questions,\
    \ {\n      $splice: [[key, 1]]\n    });\n\n    this.setState({ questions: questions\
    \ });\n  }\n\n  // ...\n});\n```\n\n接下来，我们将尝试一个不同的库，这个库确实对不可变性做出了保证。\n\n# 使用 seamless-immutable\n\
    \nseamless-immutable 库并非官方 React 家族的一部分，但它是为与 React 一起使用而设计的。它创建了常规对象和数组的不可变版本，这些版本可以像它们的可变对应物一样传递、访问和迭代，但会阻止任何会改变它们的操作。\n\
    \n与不可变辅助插件类似，seamless-immutable 提供了处理不可变数据的便捷函数。然而，在 seamless-immutable 中，这些函数是作为对象自身的方法实现的。例如，seamless-immutable\
    \ 对象获得了一个 `.merge()` 方法，其作用类似于不可变辅助插件中的 `$merge` 选项。\n\n```\n var update = React.addons.update;\n\
    \nvar SurveyEditor = React.createClass({\n  // ...\n\n  handleDrop: function (ev)\
    \ {\n    var questionType = ev.dataTransfer.getData('questionType');\n    var\
    \ questions = this.state.questions.concat(\n      [{ type: questionType }]\n \
    \   );\n\n    this.replaceState(this.state.merge({\n      questions: questions,\n\
    \      dropZoneEntered: false\n    }));\n  },\n\n  handleQuestionChange: function\
    \ (key, newQuestion) {\n    var questions = this.state.questions.map(\n      \
    \  function(question, index) {\n            return index === key ? newQuestion\
    \ : question;\n        }\n    );\n\n    this.setState({ questions: questions });\n\
    \  },\n\n  handleQuestionRemove: function (key) {\n    var questions = this.state.questions.filter(\n\
            function(question, index) {\n            return index !== key;\n     \
    \   }\n    );\n\n    this.setState({ questions: questions });\n  }\n\n  // ...\n\
    \n});\n```\n\n# 使用 Immutable.js\n\n前两个库提供了围绕常规 JavaScript 对象和数组的工具，而 `Immutable.js`\
    \ 则采用了不同的方法：它提供了对象和数组的替代数据结构。\n\n这些数据结构中最常用的是 `Immutable.Map`（类似于 Object）和 `Immutable.Vector`（类似于\
    \ Array）。在一般情况下，这两者都不能随意替代 JavaScript 对象或数组，尽管你可以轻松地在 `Immutable.js` 数据结构及其可变的\
    \ JavaScript 对应物之间进行转换。\n\n## `Immutable.Map`\n\n```\n var question = Immutable.Map({description:\
    \ 'who is your favorite superhero?'});\n// 使用 .get 从 Map 中获取值\nquestion.get('description');\n\
    \n// 使用 .set 更新值会返回一个新对象。\n// 原始对象保持不变。\nquestion2 = question.set('description',\
    \ 'Who is your favorite comicbook hero?');\n\n// 使用 .merge 合并两个对象，得到第三个对象。\n//\
    \ 同样，原始对象不会被修改。\nvar title = { title: 'Question #1' };\nvar question3 = question.merge(question2,\
    \ title);\nquestion3.toObject(); // { title: 'Question #1', description: 'who\
    \ is your favorite comicbook hero' }\n```\n\n## `Immutable.Vector`\n\n使用 `Immutable.Vector`\
    \ 处理数组：\n\n```\n var options = Immutable.Vector('Superman' , 'Batman');\nvar options2\
    \ = options.push('Spiderman');\noptions2.toArray(); // ['Superman', 'Batman',\
    \ 'Spiderman']\n```\n\n你还可以嵌套这些数据结构：\n\n```\n var options = Immutable.Vector('Superman'\
    \ , 'Batman');\nvar question = Immutable.Map({\n  description: 'who is your favorite\
    \ superhero?',\n  options: options\n});\n```\n\n`Immutable.js` 还有更多方面。有关 `Immutable.js`\
    \ 的更多信息，请访问 [`github.com/facebook/immutable-js`](https://github.com/facebook/immutable-js)。\n\
    \n# 总结\n\n在本章中，我们了解了在 React 应用中使用不可变性的好处和代价。我们涵盖了它对 `shouldComponentUpdate` 的影响、对更新时间的意义，以及三种将不可变性引入\
    \ React 代码库的方法。\n\n接下来，我们将探讨 React 在传统 Web 应用之外的其他用途。\n\n# 第 17 章 其他用途\n\nReact\
    \ 是一个强大的交互式 UI 渲染库，但它也提供了一种处理数据和用户输入的绝佳方式。它鼓励创建可重用且易于单元测试的小型组件。这些都是很好的特性，你可以将它们应用于\
    \ Web 之外的其他技术。\n\n在本章中，我们将了解如何使用 React 进行：\n\n*   桌面应用\n*   游戏\n*   电子邮件\n*  \
    \ 图表\n\n# 桌面\n\n借助 Electron 或 node-webkit 等项目，你可以在桌面上运行 Web 应用。来自 Github 的 Atom\
    \ 编辑器就是使用 Electron 构建的，你也可以将其与 React 一起使用。\n\n示例应用已经包含了 Electron，要启动它，请在示例应用的根目录下运行以下命令：\n\
    \n```\n ./node_modules/.bin/electron desktop.html\n```\n\n使用 `desktop.html` 运行\
    \ Electron 会在一个窗口中打开该应用。\n\n![](img/Electron.png)\n\n你可以在 [`electron.atom.io`](http://electron.atom.io)\
    \ 上阅读更多关于 Electron 的信息。\n\n借助 Electron 和 node-webkit 等项目，你可以使用与 Web 相同的技术构建桌面应用。就像在\
    \ Web 上一样，React 可以帮助你为桌面构建强大的交互式应用。\n\n# 游戏\n\n游戏通常需要高水平的用户交互，用户需要响应游戏不断变化的状态。这与大多数\
    \ Web 应用形成对比，在 Web 应用中，用户要么消费内容，要么生产内容。游戏本质上是一个状态机，具有两个基本角色：\n\n1.  更新视图\n2. \
    \ 响应事件\n\n在本书的引言中，你了解到 React 的范围非常狭窄，只关注两件事：\n\n1.  更新 DOM\n2.  响应事件\n\nReact\
    \ 与游戏之间的相似之处并不仅限于此。React 的虚拟 DOM 架构在很大程度上归功于高性能的 3D 游戏引擎，在给定预期视图状态的情况下，渲染引擎确保视图/DOM\
    \ 的高效更新。\n\n作为将 React 用于游戏的一个例子，让我们看看 2048 游戏的实现。这个游戏的目标是合并棋盘上匹配的数字，直到达到 2048。\n\
    \n![2048](img/2048.png)\n\n让我们深入了解一下实现（[`jsfiddle.net/jeremiahrhall/6wa8djju/`](https://jsfiddle.net/jeremiahrhall/6wa8djju/)）。\n\
    \n源代码分为两部分。第一部分是游戏逻辑，作为全局命名空间中的函数实现；第二部分是 React 组件。你首先会看到棋盘的初始数据结构。\n\n"
- fmt: "\n```\nvar initial_board = {\n    a1:null, a2:null, a3:null, a4:null,\n  \
    \  b1:null, b2:null, b3:null, b4:null,\n    c1:null, c2:null, c3:null, c4:null,\n\
    \    d1:null, d2:null, d3:null, d4:null\n};\n```\n\nThe data structure of the\
    \ board is an object where the `keys` directly relate to a visual grid position\
    \ defined in CSS. Following the initial data structure, you will see a series\
    \ of functions that operate on this given data structure. All of these functions\
    \ operate in an immutable way, thus returning a new board and not mutating the\
    \ input. This gives the game logic some leverage, since it will be able to compare\
    \ boards before and after moves are performed, and speculatively perform moves\
    \ without changing the game state.\n\nAnother interesting property about the data\
    \ structure is the structural sharing of boards. All boards share reference to\
    \ unchanged tiles on the boards. This makes creating a new board very fast and\
    \ allows the comparison of boards to use reference equality.\n\nThe game is comprised\
    \ of two React components: `Tiles` and `GameBoard`.\n\n```\nclass Tiles extends\
    \ React.Component {\n  render() {\n    var board = this.props.board;\n    //sort\
    \ board keys first to stop re-ordering of DOM elements\n    var tiles = used_spaces(board).sort((a,\
    \ b) => {\n      return board[a].id - board[b].id;\n    });\n    return <div className=\"\
    board\">{\n      tiles.map((key) => {\n        var tile = board[key];\n       \
    \ var val = tile_value(tile);\n        return <span key={tile.id} className={key\
    \ + \" value\" + val}>\n          {val}\n        </span>;\n      })}\n    </div>\n\
      }\n}\n```\n\n```\n<!-- Example output from render of Tiles -->\n<div class=\"\
    board\" data-reactid=\".0.1\">\n  <span class=\"d2 value64\" data-reactid=\".0.1.$2\"\
    >64</span>\n  <span class=\"d1 value8\" data-reactid=\".0.1.$27\">8</span>\n \
    \ <span class=\"c1 value8\" data-reactid=\".0.1.$28\">8</span>\n  <span class=\"\
    d3 value8\" data-reactid=\".0.1.$32\">8</span>\n</div>\n```\n\n```\n/* CSS transistion\
    \ applied to animate tiles */\n.board span{\n  /* ... */\n  transition: all 100ms\
    \ linear;\n}\n```\n\n`GameBoard` is the state machine, responding to user events\
    \ `Arrow Keys` and `Button Press`, and interacting with game logic functions to\
    \ then update the state with a new board.\n\n```\nclass GameBoard extends React.Component\
    \ {\n    constructor(props) {\n      super(props);\n      this.state = this.addTile(this.addTile(initial_board));\n\
        }\n\n    keyHandler(e) {\n        var directions = {\n            37: left,\n\
                38: up,\n            39: right,\n            40: down\n        };\n\
            if (directions[e.keyCode]\n        && this.setBoard(fold_board(this.state,\
    \ directions[e.keyCode]))\n        && Math.floor(Math.random() * 30, 0) > 0){\n\
                setTimeout(() => {\n                 this.setBoard(this.addTile(this.state));\n\
                }, 100);\n        }\n    }\n\n    setBoard(new_board) {\n        if\
    \ (!same_board(this.state, new_board)){\n            this.setState(new_board);\n\
                return true;\n        }\n        return false;\n    }\n\n    addTile(board)\
    \ {\n        var location = available_spaces(board).sort(() => {\n          return\
    \ .5 - Math.random();\n        }).pop();\n        if (location) {\n           \
    \ var two_or_four = Math.floor(Math.random() * 2, 0) ? 2 : 4;\n            return\
    \ set_tile(board, location, new_tile(two_or_four));\n        }\n        return\
    \ board;\n    }\n\n    newGame() {\n        this.setState(this.addTile(this.addTile(initial_board)));\n\
        }\n\n    componentDidMount() {\n        window.addEventListener(\"keydown\"\
    , this.keyHandler.bind(this), \n          false);\n    }\n\n    render() {\n \
    \       var status = !can_move(this.state)?\" - Game Over!\":\"\";\n        return\
    \ <div className=\"app\">\n            <span className=\"score\">\n           \
    \     Score: {score_board(this.state)}{status}\n            </span>\n         \
    \   <Tiles board={this.state}/>\n            <button onClick={this.newGame.bind(this)}>New\
    \ Game</button>\n        </div>\n    }\n} \n```\n\nIn the `GameBoard` component\
    \ we setup the keyboard handlers for interacting with the board. Every time an\
    \ arrow key is pressed we call `setBoard` with the newly created board from the\
    \ game logic. If the new board is different than the old, we update the state\
    \ of the `GameBoard` component. This avoids unnecessary cycles and improves performance.\n\
    \nIn the render function you render the `Tiles` component given the current board,\
    \ and render the score, calculated by the current board in the game logic.\n\n\
    The `addTile` function keeps adding new tiles to the board when you use the arrow\
    \ keys to keep the game going until the game is over when the board is full and\
    \ no numbers can be combined.\n\nGiven the above implementation, it is trivial\
    \ to extend the game with undo functionality. You can keep a history of all board\
    \ changes in state within the `GameBoard` component and with an undo button change\
    \ the current board: [https://jsfiddle.net/jeremiahrhall/9fbjgnt6/](https://jsfiddle.net/jeremiahrhall/9fbjgnt6/).\n\
    \nThe implementation of this game is quite simple, since `React` allows you to\
    \ concentrate on the game logic and user interactions without having to worry\
    \ about keeping the view in sync.\n\n# Email\n\nThough `React` is optimized for\
    \ building interactive UIs for the web, at it’s core it renders HTML. This means\
    \ you can get a lot of the same benefits you’d normally get from writing a React\
    \ application for something as terrible as writing HTML emails.\n\nBuilding HTML\
    \ emails requires a series of tables to render correctly in each email client.\
    \ To write emails you need to turn back the clock a few years and write HTML as\
    \ if it were 1999.\n\nSuccessfully rendering emails in a range of email clients\
    \ is no small feat. To build our design with `React` we will only touch on a number\
    \ of challenges you will encounter when building emails, whether they are rendered\
    \ using React or not.\n\nThe core principle of rendering HTML for emails with\
    \ `React` is `React.renderToStaticMarkup`. This function returns an HTML string\
    \ containing the full component tree, given 1 top level component. The only difference\
    \ between `React.renderToStaticMarkup` and `React.renderToString` is that `React.renderToStaticMarkup`\
    \ doesn’t create extra DOM attributes like `data-react-id` that React uses client\
    \ side to keep track of the DOM. Since the email doesn’t run client side in the\
    \ browser; we have no need for those attributes.\n\nLets build an email with `React`\
    \ given this design for desktop and mobile:\n\n![Alt Text](assets/Portrait.png)![Alt\
    \ Text](assets/Mobile_Portrait.png)\n\nTo render the email we have made a small\
    \ script that outputs HTML that can be used to send an email:\n\n```\n// render_email.js\n\
    var ReactDOMServer = require('react-dom/server');\nvar SurveyEmail = require('survey_email');\n\
    var survey = {};\n\nconsole.log(\n  ReactDOMServer.renderToStaticMarkup(<SurveyEmail\
    \ survey={survey}/>)\n);\n```\n\nLet’s get the core structure of `SurveyEmail`\
    \ going. First, let’s build an `Email` component:\n\n```\nclass Email extends\
    \ React.Component {\n  render() {\n    return (\n      <html>\n        <body>\n\
    \          {this.prop.children}\n        </body>\n      </html>\n    );\n  }\n\
    }\n```\n\nThe `<SurveyEmail/>` component uses `<Email/>`:\n\n```\nclass SurveyEmail\
    \ extends React.Component {\n  render() {\n    var survey = this.props.survey;\n\
    \    return (\n      <Email>\n        <h2>{survey.title}</h2>\n      </Email>\n\
    \    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
