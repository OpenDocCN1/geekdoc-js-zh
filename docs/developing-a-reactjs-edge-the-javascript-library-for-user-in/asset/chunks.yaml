    \ the `handleClick` method gets called.\n\n# PropTypes\n\nReact provides a way\
    \ to validate your props, through a config object defined on your component. They\
    \ also serve as a quick reference documentation.\n\n```\nclass Post extends React.Component\n\
    \  static propTypes = {\n    data: PropTypes.shape({\n      id: PropTypes.string,\n\
    \      url: PropTypes.string,\n      author: PropTypes.string,\n      title: PropTypes.string,\n\
    \      createdAt: PropTypes.number,\n    }).isRequired,   \n  };\n  // ...\n};\n\
    ```\n\nIf the requirements of the `propTypes` are not met when the component is\
    \ instantiated, a `console.error` will be logged.\n\nFor optional props, simple\
    \ leave the `.isRequired` off.\n\nYou are not required to use `propTypes` in your\
    \ application, but they provide a good way to describe the API of your component.\n\
    \n# defaultProps\n\nProvide the `defaultProps` object on your component to provide\
    \ a default set of properties. This should only be done for props that aren’t\
    \ required.\n\n```\nvar Button = React.createClass({\n  static propTypes = {\n\
    \    which: PropTypes.oneOf(['primary', 'secondary', 'normal'])\n  };\n  static\
    \ defaultProps = {\n    which: 'normal'\n  };\n  // ...\n};\n```\n\n# State\n\n\
    Each component in React can house state. State differs from `props` in that it\
    \ is internal to the component.\n\nState is useful for deciding a view state on\
    \ an element. Note that this component includes the majority of what you need\
    \ to know about React, so [×](https://atlas.oreilly.com/crudloff/reactjs-book/editor/master/04.data.flow.html#)don’t\
    \ expect to understand it all right now.\n\n```\nclass SimpleSelect extends React.Component\
    \ {\n  static propTypes = {\n    options: PropTypes.arrayOf(PropTypes.shape({\n\
    \      id: PropTypes.any,\n      name: PropTypes.string,\n    })).isRequired,\n\
    \    value: PropTypes.any,\n    valueText: PropTypes.any,\n    onSelect: PropTypes.func,\n\
    \  };\n\n  constructor(){\n    super();\n    this.state = {open: false,};\n  }\n\
    \n  toggleOpen(){\n    this.setState({open: !this.state.open});\n  }\n\n  render(){\n\
    \    return (\n      <div>\n        <Button onClick={() => this.toggleOpen()}>\n\
    \          {this.props.valueText || 'Select an option'}\n        </Button>\n \
    \       {this.renderItems()}\n      </div>\n    );\n  }\n\n  renderItems(){\n\
    \    if (!this.state.open) return null;\n    return (\n      <ul>\n        {this.props.options.map((item,\
    \ i) => {\n          return (\n            <li key={i} onClick={() => this.handleSelect(item)}>\n\
    \              {item.name}\n            </li>\n                 );\n        })}\n\
    \      </ul>\n         );\n\n  }\n\n  handleSelect(item){\n    this.props.onSelect(item);\n\
    \    this.setState({open: false});\n  }\n};\n```\n\nIn the above example, `state`\
    \ is used to track whether or not to show the options in the dropdown.\n\nWe set\
    \ the initial state in the constructor with open set to false. When the dropdown\
    \ button is clicked, you toggle the open state (`toggleOpen`). When an item is\
