  trans: "\n现在你已经确信自动化测试的重要性，让我们来了解一下测试的类型：单元测试。还有许多其他类型的自动化测试（集成测试、功能测试、性能测试、安全测试和视觉测试^(3)），但这些不在本书的讨论范围内。\n\
    \n*   **单元测试**：一种测试，用于验证应用程序中最小的功能单元。通常，它会直接调用一个函数，传入特定的输入，并验证输出或副作用。\n\n这听起来很多，但当你深入其中时，你会发现它不仅易于管理，而且看到测试第一次通过时非常有趣。\n\
    \n## 工具\n\n幸运的是，JavaScript 社区拥有一个健康的测试工具生态系统，因此我们可以利用它们快速搭建测试套件。本书的测试使用了 `Jest`\
    \ 和 `Enzyme`。`Jest` 使用 `Jasmine` 运行测试，所以如果你熟悉 `Jasmine`，你可能会觉得这些测试很熟悉。下面列出了一些流行的替代方案。\n\
    \n*   `Karma`\n*   `Mocha`\n*   `Chai`\n*   `Sinon`\n*   `Casper.js`\n*   `Qunit`\n\
    \n那么，让我们开始编码吧！\n\n# 使用 Jest 和 Enzyme 对 React 组件进行单元测试\n\n在编写 React 组件时，唯一的要求是定义一个\
    \ `render` 函数。让我们开始为一个新的 `<Comment />` 组件编写测试，该测试将验证组件是否渲染出预期的输出。\n\n`Jest` 会自动扫描名为\
    \ `__tests__` 的目录中的测试文件。按照惯例，这些测试目录放在被测试文件所在的文件夹中。\n\n## 对组件内容进行断言\n\n遵循这一惯例，在示例项目的\
    \ `/src/molecules/__tests__/Comment.test.js` 中为你的测试创建一个新文件。\n\n我们首先导入 `React`、从\
    \ `enzyme` 中导入几个辅助函数（随着测试的进行我们会逐步了解它们），以及 `Comment` 模块本身。\n\n```javascript\nimport\
    \ React from 'react';\nimport {shallow, mount, render} from 'enzyme';\n\nimport\
    \ Comment from '../Comment';\njest.unmock('../Comment');\n```\n\n导入 `Comment`\
    \ 后，我们告诉 `Jest` 取消模拟它，因为我们想要测试它。这是 `Jest` 独特之处的一部分。`Jest` 会自动模拟你的代码所依赖的所有 JavaScript\
    \ 模块。这使得测试单个模块或模块集合的行为变得简单，而无需手动创建模拟实现。\n\n# 配置 Jest\n\n`Jest` 在项目的 `package.json`\
    \ 文件中进行配置。它被配置为不模拟许多支持应用程序的重要库，以便这些库在测试中仍能按预期工作，并预处理你的源代码以支持新的 ES6 语法。\n\n现在，让我们添加实际的测试。\n\
    \n```javascript\n...\ndescribe('molecules/Comment', () => {\n  it('<Comment />',\
    \ () => {\n    expect(render(<Comment />)).toBeDefined();\n  });\n});\n```\n\n\
    这个测试断言渲染 `Comment` 实际上返回了一个值。让我们看看它是否有效。保存文件，并在项目根目录的终端中输入以下命令来运行测试：\n\n```bash\n\
    npm test\n```\n\n运行此命令时，你应该会看到类似以下的输出：\n\n```\nUsing Jest CLI v0.9.2, jasmine2\n\
    \ PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js (0.347s)\nWarning:\
    \ React.createElement: type should not be null, undefined, boolean, or number.\
    \ It should be a string (for DOM elements) or a ReactClass (for composite components).\n\
    FAIL  src/molecules/__tests__/Comment.test.js\n● Runtime Error\nError: Cannot\
    \ find module '../Comment' from 'Comment.test.js'\n  at Loader._resolveNodeModule\
    \ (/Users/youruser/bleeding-edge-react-sample-app.github.io/node_modules/jest-cli/src/HasteModuleLoader/HasteModuleLoader.js:431:11)\n\
    \  at Object.<anonymous> (/Users/youruser/bleeding-edge-react-sample-app.github.io/src/molecules/__tests__/Comment.test.js:5:6)\n\
    \ PASS  src/atoms/__tests__/Box.test.js (1.058s)\n1 test failed, 7 tests passed\
    \ (8 total in 3 test suites, run time 2.427s)\n```\n\n测试失败了，因为我们还没有实现 `Comment`\
    \ 组件。在继续修复之前，请在终端中运行以下命令，以 `watch` 模式启动 `Jest`。它将监视项目中的更改并自动重新运行测试，让你在编码时获得快速反馈！\n\
    \n```bash\nnpm test -- --watch\n```\n\n现在，让我们在 `/src/molecules/Comment.js` 中创建一个新文件，并添加以下初始实现：\n\
    \n```javascript\nimport React, {PropTypes} from 'react';\nimport Box from '../atoms/Box';\n\
    \nexport default\nclass Comment extends React.Component {\n  static propTypes\
    \ = {\n\n  };\n\n  render(){\n    return (\n      <Box>\n        A Comment!\n\
    \      </Box>\n    );\n  }\n}\n```\n\n这个不完整的实现只是渲染了一个带有静态文本的 `Box`。保存新的 `Comment`\
    \ 组件后，返回终端，你应该会看到：\n\n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
    \ (0.343s)\n PASS  src/atoms/__tests__/Box.test.js (0.987s)\n PASS  src/molecules/__tests__/Comment.test.js\
    \ (1.092s)\n8 tests passed (8 total in 3 test suites, run time 2.228s)\n```\n\n\
    你的测试通过了！但我们的 `Comment` 组件还不完整。`Comment` 组件的目标是提取 `Comments.js` 中 `map` 函数内部的逻辑，并从中创建一个组件。`map`\
    \ 函数目前提供了一个 `comment` 对象，因此我们的 `Comment` 组件应该将其作为一个必需的属性。让我们修改现有的测试，使其渲染一个带有示例\
    \ `comment` 属性的 `Comment` 组件，并验证它包含该 `comment` 属性的一些内容：\n\n```javascript\ndescribe('molecules/Comment',\
    \ () => {\n  let comment = {\n    id: 1,\n    replies: [],\n    score: 1,\n  \
    \  score_hidden: 1,\n    body: \"Test Driven Development, yeah!\",\n    author:\
    \ \"Jeremiah Hall\"\n  };\n\n  it('<Comment comment={comment}/>', () => {\n  \
    \  let renderedComment = render(<Comment comment={comment} targetScore={1} />);\n\
    \    expect(renderedComment.text()).toContain(comment.body);\n    expect(renderedComment.text()).toContain(comment.author);\n\
    \  });\n});\n```\n\n让我们分析一下这个新测试：\n\n1.  首先，定义了一个示例 `comment` 对象。\n2.  然后，使用 `Enzyme`\
    \ 的 `render` 函数渲染了一个带有一些示例属性的 `Comment` 组件。\n3.  接着，断言渲染后的评论文本包含评论的 `body` 和 `author`。\n\
    \n`Enzyme` 的 `render` 函数返回的对象是一个包装器对象，包含许多有用的方法。你将在后续测试中使用另外两个函数。\n\n保存文件后，你应该会看到测试失败：\n\
    \n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js (0.342s)\n\
    \ PASS  src/atoms/__tests__/Box.test.js (0.99s)\n FAIL  src/molecules/__tests__/Comment.test.js\
    \ (1.112s)\n● molecules/Comment › it <Comment comment={comment}/>\n - Expected\
    \ 'A Comment!' to contain 'Test Driven Development, yeah!'.\n       at Object.eval\
    \ (src/molecules/__tests__/Comment.test.js:23:36)\n       at handle (node_modules/worker-farm/lib/child/index.js:41:8)\n\
    \       at process.<anonymous> (node_modules/worker-farm/lib/child/index.js:47:3)\n\
    \       at emitTwo (events.js:87:13)\n       at process.emit (events.js:172:7)\n\
    \       at handleMessage (internal/child_process.js:686:10)\n       at Pipe.channel.onread\
    \ (internal/child_process.js:440:11)\n - Expected 'A Comment!' to contain 'Jeremiah\
    \ Hall'.\n       at Object.eval (src/molecules/__tests__/Comment.test.js:24:36)\n\
    \       at handle (node_modules/worker-farm/lib/child/index.js:41:8)\n       at\
    \ process.<anonymous> (node_modules/worker-farm/lib/child/index.js:47:3)\n   \
    \    at emitTwo (events.js:87:13)\n       at process.emit (events.js:172:7)\n\
    \       at handleMessage (internal/child_process.js:686:10)\n       at Pipe.channel.onread\
    \ (internal/child_process.js:440:11)\n1 test failed, 7 tests passed (8 total in\
    \ 3 test suites, run time 2.192s)\n```\n\n让我们完成 `Comment` 组件。你需要添加一些导入并实现 `render`\
    \ 方法：\n"
- fmt: "\n```\nimport React, {PropTypes} from 'react';\nimport Box from '../atoms/Box';\n\
    import Heading from '../atoms/Heading';\nimport Markdown from '../atoms/Markdown';\n\
    import Link from '../atoms/Link';\nimport {State} from '../utils/actions';\n\n\
    export default\nclass Comment extends React.Component {\n  static propTypes =\
    \ {\n    comment: PropTypes.object.isRequired,\n    targetScore: PropTypes.number.isRequired\n\
    \  };\n\n  render(){\n      let comment = this.props.comment;\n      let targetScore\
    \ = this.props.targetScore;\n      let replies = comment.replies || [];\n    \
    \  return (\n        <Box\n          key={comment.id}\n          padding=\"0.5em\"\
    \n          margin=\"0.5em\"\n          style={{\n            background: comment.score\
    \ >= targetScore ? '#ffffaa' : '#efefef'\n          }}\n        >\n          <Box\
    \ direction=\"row\">\n            <Heading level=\"title\">{comment.score_hidden\
    \ ? '?' : comment.score}</Heading>\n            <Box margin={{right: \"1em\"}}\
    \ />\n            <Box style={{maxWidth: '80em', lineHeight: '1.5'}}>\n      \
    \        <Markdown content={comment.body} />\n            </Box>\n          </Box>\n\
    \          <Box margin={{top: '0.5em'}} direction=\"row\">\n            <span>\n\
    \              by <Link to={`/user/${comment.author}`}>{comment.author}</Link>\n\
    \            </span>\n            <Box\n              id=\"replyBox\"\n      \
    \        margin=\"0 1em\"\n              onClick={() => {\n                State.setEditing({\n\
    \                  type: 'comment',\n                  id: comment.id,\n     \
    \           })\n              }}\n              style={{cursor: 'pointer'}}\n\
    \            >\n              Reply\n            </Box>\n          </Box>\n  \
    \        {replies.map((reply) => <Comment comment={reply} targetScore={targetScore}\
    \ />)}\n        </Box>\n      );\n  }\n}\n```\n\nThe render method of `Comment`\
    \ is very similar to the function passed to the map call in the `Comments` component.\
    \ When you return to your terminal after saving `Comment.js`, Jest should show\
    \ that your test now passes:\n\n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
    \ (0.366s)\nPASS  src/atoms/__tests__/Box.test.js (1.079s)\nPASS  src/molecules/__tests__/Comment.test.js\
    \ (1.307s)\n8 tests passed (8 total in 3 test suites, run time 2.335s)\n```\n\n\
    ## Making Assertions About Functions and DOM Events\n\nLet’s add a new test to\
    \ `Comment.test.js` that asserts that when the reply button is clicked, the state\
    \ of the application is updated. This test should pass the first time without\
    \ modification.\n\n```\ndescribe('molecules/Comment', () => {\n  ...\n  it('should\
    \ should call State.setEditing when the reply button is clicked', () => {\n  \
    \  let wrapper = mount(<Comment comment={comment} targetScore={1} />);\n    let\
    \ replyBox = wrapper.find('#replyBox');\n    State.setEditing = jest.fn();\n \
    \   replyBox.simulate('click');\n    expect(State.setEditing).toBeCalledWith({\n\
    \      type: 'comment',\n      id: comment.id,\n    });\n  });\n});\n```\n\nThere’s\
    \ a few new things in this test so, let’s examine it:\n\n1.  First a `Comment`\
    \ component is rendered to DOM using Enzyme’s `mount`.\n\n2.  Using the returned\
    \ Enzyme wrapper’s `find` method, the element with id `replyBox` is selected.\n\
    \n3.  A mock function is created with `jest.fn()` and assigned to `State.setEditing`.\n\
    \n4.  Using the wrapper a `click` event is simulated on the `replyBox` element.\n\
    \n5.  Finally, you assert that `State.setEditing` should have been called with\
    \ the provided object.\n\nIt is common for a React component to execute a function\
    \ in response to user interaction or other lifecycle events. Jest and Enzyme make\
    \ it simple to test that your component behaves as expected.\n\n## Making Assertions\
    \ About Child Components\n\nNow that we’ve implemented our new `Comment` component,\
    \ let’s write a test to verify that the `Comments` component renders a `Comment`\
    \ component for each object in its `comments` prop.\n\n```\nimport React from\
    \ 'react';\nimport {shallow, mount, render} from 'enzyme';\n\nimport Comments\
    \ from '../Comments';\nimport Comment from '../Comment';\n\njest.unmock('../Comments');\n\
    jest.unmock('../Comment');\n\ndescribe('molecules/Comments', () => {\n  it('<Comments\
    \ comments={comments}/>', () => {\n    let comments = [{\n        id: 1,\n   \
    \     replies: [],\n        score: 1,\n        score_hidden: 0,\n        body:\
    \ \"Test Driven Development, yeah!\",\n        author: \"Jeremiah Hall\"\n   \
    \ }, {\n        id: 2,\n        score: 0.5,\n        score_hidden: 0.25,\n   \
    \     body: \"React is great!\",\n        author: \"Jeremiah Hall\"\n    }];\n\
    \n    let wrapper = shallow(<Comments comments={comments} />);\n    let childComments\
    \ = wrapper.find(Comment);\n\n    expect(childComments.length).toEqual(comments.length);\n\
    \  });\n});\n```\n\nThis test defines an array of two comment objects, and shallow\
    \ renders a `Comments` component with this array as a prop. It then uses the returned\
    \ wrapper’s `find` method to search for the child components of type `Comment`.\
    \ You can search for any kind of React component this way. Enzyme supports supports\
    \ searching with CSS selectors such as `.class-name` or `#replyBox`, using component\
    \ constructors as shown in the above example, by the component’s display name,\
    \ or by component props.\n\nYou can review Enzyme’s API documentation on GitHub:\n\
    \n[https://github.com/airbnb/enzyme](https://github.com/airbnb/enzyme)\n\n# Shallow,\
    \ Mount, and Render in Enzyme\n\nEnzyme’s `shallow` function treats the component\
    \ it is rendering as a single unit, so that your test is not affected by child\
    \ components. The `mount` function renders to DOM and ensures that component lifecycle\
    \ methods like `componentDidUpdate` and others are called when appropriate. The\
    \ `render` function goes a step further to static HTML, which you can then analyze.\n\
    \nThis Comments test will initially fail since we need to modify the component\
    \ to use our new `Comment`:\n\n```\n...\nimport Comment from './Comment';\n\n\
    export default\nclass Comments extends React.Component {\n  ...\n  render(){\n\
    \    // find the average comment score\n    var targetScore = this.getGoodScoreThreshold();\n\
    \n    return (\n      <Box>\n        {this.props.comments.map((comment) => <Comment\
    \ key={comment.id} comment={comment} targetScore={targetScore} />)}\n      </Box>\n\
    \    );\n  }\n}\n```\n\nAn import statement for `Comment` is added to the top\
    \ of the file and the map function is modified to return a `Comment` component\
    \ for each comment in the props.\n\nLet’s expand our test to verify that the child\
    \ `Comment` components received the right comment prop.\n\n```\ndescribe('molecules/Comments',\
    \ () => {\n  it('<Comments comments={comments}/>', () => {\n    ...\n    expect(childComments.length).toEqual(comments.length);\n\
    \    expect(childComments.at(0).prop('comment')).toEqual(comments[0]);\n    expect(childComments.at(1).prop('comment')).toEqual(comments[1]);\n\
    \    ...\n  });\n});\n```\n\nThe two new assertions retrieve the `comment` prop\
    \ from each child component and assert that they are equal to the comment at the\
    \ same index in the example comments array.\n\n# Summary\n\nThis chapter was a\
    \ whirl-wind of testing concepts: rendering, auto-mocking, unmocking, wrappers,\
    \ simulating events, element finders, and test driven development! You are now\
    \ prepared to start testing your React components in your real world applications.\n\
    \nNow that we’ve covered how to unit test our React applications, let’s learn\
    \ about some architectural patterns we can use to structure our React applications.\n\
    \n^([1](#ch14.html_idm139745264274896-marker)) http://blog.8thlight.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html\n\
    \n^([2](#ch14.html_idm139745264273568-marker)) http://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/paper-boy/demeter.pdf\n\
    \n^([3](#ch14.html_idm139745264269376-marker)) https://www.youtube.com/watch?v=1wHr-O6gEfc\n\
    \n# Chapter 15\\. Architectural patterns\n"
