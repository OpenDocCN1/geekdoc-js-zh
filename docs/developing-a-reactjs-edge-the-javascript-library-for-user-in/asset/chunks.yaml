  trans: "\n让我们将它们添加到 `<SurveyEmail/>` 组件中：\n\n```\n class SurveyEmail extends React.Component\
    \ {\n  render() {\n    var survey = this.props.survey;\n    var completions =\
    \ survey.activity.reduce((memo, ac) => {\n      return memo + ac;\n    }, 0);\n\
    \    var daysRunning = survey.activity.length;\n\n    return (\n      <Email>\n\
    \        <h2>{survey.title}</h2>\n        <KPI kpi={completions} label='Completions'/>\n\
    \        <KPI kpi={daysRunning} label='Days running'/>\n      </Email>\n    );\n\
    \  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
    };\n```\n\n这样堆叠了我们的关键绩效指标（KPI），但设计上希望它们在桌面端并排显示。现在的挑战是让它在桌面端和移动端都能正常工作。要解决这个问题，我们首先需要了解一些注意事项。\n\
    \n让我们为 `<Email/>` 增加一种添加 CSS 文件的方式：\n\n```\n var fs = require(‘fs’);\nclass Email\
    \ extends React.Component {\n  render() {\n    var responsiveCSSFile = this.props.responsiveCSSFile;\n\
    \    var styles;\n    if (responsiveCSSFile) {\n      styles = <style>{fs.readFileSync(responsiveCSSFile)}</style>;\n\
    \    }\n    return (\n      <html>\n        <body>\n          {styles}\n     \
    \     {this.prop.children}\n       </body>\n     </html>\n    );\n  }\n}\n\nEmail.propTypes\
    \ = {\n  responsiveCSSFile: React.PropTypes.string\n};\n```\n\n完整的 `<SurveyEmail/>`\
    \ 如下所示：\n\n```\n class SurveyEmail extends React.Component {\n  render() {\n \
    \   var survey = this.props.survey;\n    var completions = survey.activity.reduce((memo,\
    \ ac) => {\n      return memo + ac;\n    }, 0);\n\n    var daysRunning = survey.activity.length;\n\
    \n    return (\n      <Email responsiveCSS='path/to/mobile.css'>\n        <h2>{survey.title}</h2>\n\
    \        <table className='for-desktop'>\n          <tr>\n            <td>\n \
    \             <KPI kpi={completions} label='Completions'/>\n            </td>\n\
    \            <td>\n              <KPI kpi={daysRunning} label='Days running'/>\n\
    \            </td>\n          </tr>\n        </table>\n        <div className='for-mobile'>\n\
    \          <KPI kpi={completions} label='Completions'/>\n          <KPI kpi={daysRunning}\
    \ label='Days running'/>\n        </div>\n      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes:\
    \ {\n  survey: React.PropTypes.object.isRequired\n};\n```\n\n我们将邮件内容分成了桌面端和移动端两组。遗憾的是，在邮件中不能使用类似\
    \ `float: left` 这样的属性，因为大多数浏览器不支持。而且 HTML 规范指出 `align` 和 `valign` 属性已过时，因此 React\
    \ 也不支持这些属性。不过，它们本可以提供类似浮动两个 `div` 的实现方式。相反，我们只能保留两组内容，通过响应式样式表根据屏幕尺寸来隐藏或显示。\n\n\
    尽管必须使用表格，但很明显，使用 React 渲染邮件能带来与为浏览器编写交互式 UI 相同的诸多好处：可复用、可组合且可测试的组件。\n\n# 图表绘制\n\
    \nReact 支持 SVG 标签，因此制作一个简单的 SVG 变得轻而易举。\n\n要渲染一个迷你走势图（Sparkline，以此为例），你只需要一个带有指令集的\
    \ `<Path/>`。\n\n完整的示例如下：\n\n```\n class Sparkline extends React.Component {\n\
    \  render() {\n    var width = 200;\n    var height = 20;\n    var path = this.generatePath(width,\
    \ height, this.props.points);\n\n    return (\n      <svg width={width} height={height}>\n\
    \        <path d={path} stroke='#7ED321' strokeWidth='2' fill='none'/>\n     \
    \ </svg>\n    );\n  },\n\n  generatePath(width, height, points) {\n    var maxHeight\
    \ = arrMax(points);\n    var maxWidth = points.length;\n\n    return points.map((p,\
    \ i) => {\n      var xPct = i / maxWidth * 100;\n      var x = (width / 100) *\
    \ xPct;\n      var yPct = 100 - (p / maxHeight * 100);\n      var y = (height\
    \ / 100) * yPct;\n\n      if (i === 0) {\n        return 'M0,' + y;\n      }\n\
    \      else {\n        return 'L' + x + ',' + y;\n      }\n    }).join(' ');\n\
    \  }\n}\n\nSparkline.propTypes = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\n上面的 Sparkline 组件需要一个表示数据点的数字数组。然后它会构建一个包含路径的简单 SVG。\n\n有趣的部分在于 `generatePath`\
    \ 函数，它计算每个点应该渲染的位置，并返回一个 SVG 路径描述。\n\n它返回类似这样的字符串：`\"M0,30 L10,20 L20,50\"`。SVG\
    \ 路径将其转换为绘图命令。每个命令由空格分隔。`\"M0,30\"` 表示将光标移动到 x0, y30。然后 `\"L10,20\"` 表示从当前光标位置画一条线到\
    \ x10, y20，以此类推。\n\n对于较大的图表，手动编写这样的缩放函数可能会很繁琐，但引入像 D3 这样的库并使用其提供的缩放函数，而不是手动创建路径，则非常简单：\n\
    \n```\n class Sparkline extends React.Component {\n  render() {\n    var width\
    \ = 200;\n    var height = 20;\n    var points = this.props.points.map((p, i)\
    \ => {\n      return { y: p, x: i };\n    });\n\n    var xScale = d3.scale.linear()\n\
    \      .domain([0, points.length])\n      .range([0, width]);\n\n    var yScale\
    \ = d3.scale.linear()\n      .domain([0, arrMax(this.props.points)])\n      .range([height,\
    \ 0]);\n\n    var line = d3.svg.line()\n      .x(function (d) { return xScale(d.x)\
    \ })\n      .y(function (d) { return yScale(d.y) })\n       .interpolate('linear');\n\
    \n    return (\n      <svg width={width} height={height}>\n        <path d={line(points)}\
    \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  }\n\
    }\n\nSparkline.propTypes = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
    };\n```\n\n# 总结\n\n在本章中，我们学到了：\n\n1.  React 不仅限于浏览器，还可以用于构建桌面应用程序和邮件。\n\n2.  如何使用\
    \ React 辅助游戏开发。\n\n3.  React 是图表绘制的绝佳选择，并且与 D3 等库配合得很好。\n\n现在你已经完成了本书的学习，应该能够使用\
    \ React 创建各种有趣的应用程序了。\n"
