  trans: "\n保护 React 免受这个越界插件影响的方法是完全由你自己管理它的 DOM 节点。React 认为该组件渲染了一个没有子节点或属性的单个 `div`。\n\
    \n```\n class SuperSelect extends React.Component {\n  render: function(){ \n\
        return <div ref=\"holder\"/>;\n  } \n};\n```\n\n让我们在 `componentDidMount` 中完成设置工作的“脏活”。\n\
    \n```\n class SuperSelect extends React.Component {\n  render(){\n    return <div\
    \ ref=\"holder\" />;\n  }\n\n  componentDidMount(){ \n    var el = document.createElement('div');\n\
    \    this.refs.holder.appendChild(el);\n    $(el).superSelect(this.props);\n \
    \   $(el).on('superSelect', this.handleSuperSelectChange);   \n  }\n\n  handleSuperSelectChange()\
    \ {\n    // 在此处放置适当的处理逻辑...\n  }\n};\n```\n\n现在，你在组件渲染的 div 内部有了一个由你管理的 `div`。这意味着你需要负责任地进行清理。\n\
    \n```\n componentWillUnmount(){\n    // 移除 superSelect 的监听器以及我们自己的监听器\n    $(this.refs.holder).children().off();\n\
    \n    // 从 DOM 中移除节点\n    $(this.refs.holder).empty()\n  }\n```\n\n除了清理之外，还要检查插件的文档，了解清理节点所需的任何额外要求。它可能设置了全局事件监听器、定时器或启动了需要终止的\
    \ AJAX 请求。\n\n这个过程还有一步。你需要处理更新。这可以通过两种方式之一实现：模拟卸载和重新挂载，或者使用插件的更新 API。前者更可靠，后者性能更好且更干净。\n\
    \n这是卸载/重新挂载的解决方案。\n\n```\n componentDidUpdate(){\n    this.componentWillUnmount();\n\
    \    this.componentDidMount();\n  }\n```\n\n这是一个假设的替代方案。\n\n```\n componentWillReceiveProps(nextProps){\n\
    \    $(this.refs.holder).children().superSelect('update', nextProps);\n  }\n};\n\
    ```\n\n封装其他库和插件的难度取决于变量的数量。有时是一个简单的 jQuery 插件，有时是一个带有自己插件的富文本编辑器。对于一些简单的插件，最好的答案是在封装它的同时将其重写为\
    \ React 组件，而对于其他插件，这完全不可行。\n\n# 总结\n\n当仅使用虚拟 DOM 不够时，`ref` 属性允许你访问特定元素，并在 `componentDidMount`\
    \ 运行后使用 `findDOMNode` 修改其底层 DOM 节点。\n\n这使你能够利用 React 本身不支持的功能，或者集成那些并非为与 React\
    \ 互操作而设计的第三方库。\n\n接下来，我们将学习如何使用 React 创建和管理表单。\n\n# 第 9 章 表单\n\n表单是任何需要用户输入（即使是少量输入）的应用程序的重要组成部分。传统上，在单页应用中，表单很难“做对”，因为它们充满了用户不断变化的状态。管理这种状态既复杂又容易出错。React\
    \ 帮助你管理应用程序中的状态，这也扩展到了你的表单。\n\n到目前为止，你已经意识到可预测性和可测试性是 React 组件的核心方面。给定相同的 props\
    \ 和 state，任何 React 组件每次都应该渲染完全相同的内容。表单也不例外。\n\nReact 中有两种类型的表单组件：*受控组件* 和 *非受控组件*。在本章中，你将了解受控组件和非受控组件之间的区别，以及在什么情况下你会选择其中一种。\n\
    \n本章还涵盖：\n\n*   如何在 React 中使用表单事件。\n*   使用受控表单组件控制数据输入。\n*   React 如何改变某些表单组件的接口。\n\
    *   在 React 中命名表单组件的重要性。\n*   处理多个受控表单组件。\n*   创建自定义的可复用表单组件。\n*   在 React 中使用\
    \ AutoFocus。\n*   构建可用应用程序的技巧。\n\n在上一章中，你学习了如何访问 React 组件的 DOM。React 帮助你从 DOM\
    \ 中提取状态并将其放入组件中。即使有了这种帮助，你仍然需要为某些复杂的表单组件访问 DOM。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
    \ 阅读我们示例应用程序的完整源代码。\n\n## 非受控组件\n\n在大多数非简单的表单中，你*不会*想要使用非受控组件。然而，它们对于理解受控组件非常有用。非受控组件对于\
    \ React 中大多数其他组件的构建方式来说是一种反模式。\n\n在 HTML 中，表单的工作方式与 React 组件不同。当 HTML `<input/>`\
    \ 被赋予一个值时，`<input/>` 可以改变该 `<input/>` 的值。这就是名称的由来，因为表单组件的值不受你的 React 组件控制。\n\n\
    在 React 中，这种行为类似于设置 `<input/>` 的 `defaultValue`。\n\n要在 React 中设置 `<input/>` 的默认值，你可以使用\
    \ `defaultValue` 属性。\n\n```\n //http://jsfiddle.net/pmsy5y2u/\nclass MyForm extends\
    \ React.Component {\n  render() {\n    return (\n      <input\n        type=\"\
    text\"\n        defaultValue=\"Hello World!\"\n      />\n    )\n  }\n};\n```\n\
    \n上面的例子被称为非受控组件。`value` 不是由父组件设置的，而是允许 `<input/>` 控制自己的值。\n\n除非你能访问该值，否则非受控组件并不是很有用。为了访问该值，你需要为\
    \ `<input/>` 添加一个 `ref`，然后访问 DOM 节点的 `value`。\n\n正如你在第 8 章中看到的，`ref` 是一个特殊的非 DOM\
    \ 属性，用于在 `this` 上下文中标识组件。组件中的所有 ref 都会被添加到 `this.refs` 中以便于访问。\n\n让我们也将 `<input/>`\
    \ 添加到一个表单中，并在 `submit` 时读取该值。\n\n```\n //http://jsfiddle.net/opfktus4/\nclass\
    \ MyForm extends React.Component {\n  submitHandler(event) {\n    event.preventDefault();\n\
    \    //通过 ref 访问输入框\n    var helloTo = this.refs.helloTo.value;\n    alert(helloTo);\n\
    \  }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <input \n          ref=\"helloTo\" \n          type=\"text\" \n     \
    \     defaultValue=\"Hello World!\" />\n        <br />\n        <button type=\"\
    submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n非受控组件很少适合使用。它们不允许你根据输入的当前值进行渲染，并且你的代码是以\
    \ DOM 为中心的方式编写的，而不是以数据为中心的方式。它们还使得组合更加困难，因为在复合组件中没有标准的方法来获取输入的值。\n\n## 受控组件\n\n\
    受控组件遵循与其他 React 组件相同的模式。表单组件的状态由你的 React 组件控制，其值存储在你的 React 组件的 state 中。\n\n如果你希望对表单组件有更多控制，你会想要使用受控组件。\n\
    \n受控组件是指父组件设置输入值的组件。\n\n让我们将上面的例子转换为使用受控组件。\n\n```\n //http://jsfiddle.net/1a8xr2z6/\n\
    class MyForm extends React.Component {\n  constructor() {\n    super();\n    this.state\
    \ = {\n      helloTo: \"Hello World!\"\n    };\n  }\n  handleChange(value) {\n\
    \    this.setState({\n      helloTo: value\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.state.helloTo);\n  }\n  render()\
    \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n    \
    \    <input \n          type=\"text\"\n          value={this.state.helloTo}\n\
    \          onChange={(e) => this.handleChange(e.target.value)} />\n        <br\
    \ />\n        <button type=\"submit\">Speak</button>\n      </form>\n    );\n\
    \  }\n};\n```\n\n这里的主要变化是 `<input/>` 的值现在存储在父组件的 state 中。因此，数据流现在被清晰地定义了。\n"
- fmt: "\n*   `constructor` now sets the `defaultValue`\n*   `<input/>` value is set\
    \ during render\n*   `onChange` of the `<input/>` value the change handler is\
    \ invoked\n*   change handler updates the state\n*   `<input/>` value is updated\
    \ during render\n\nThis is a lot more code than the Uncontrolled version. However,\
    \ this allows you to control the data flow and alter the state as the data is\
    \ being entered.\n\nExample: You may want to convert all characters to uppercase\
    \ as they are being entered.\n\n```\n handleChange(value) {\n  this.setState({\n\
    \    helloTo: value.toUpperCase()\n  });\n}\n```\n\nYou will notice when entering\
    \ data that there is no flicker of the lowercase character before the uppercase\
    \ character is added to the input. This is because React is intercepting the native\
    \ browser change event. Then this component re-renders the input after `setState`\
    \ has been called. React then does the DOM diff and updates the value of the input.\n\
    \nYou can use this same pattern to limit what characters can be entered, or not\
    \ allow illegal characters to be entered into an email address.\n\nYou may also\
    \ want to use the value in other components as the data is being entered.\n\n\
    Example:\n\n*   Show how many characters are left in a size limited input.\n*\
    \   Display the color of a HEX value being entered.\n*   Display auto complete\
    \ options.\n*   Update other UI elements with the input value.\n\n# Form events\n\
    \nAccessing form events is a crucial aspect to controlling different aspects of\
    \ your forms.\n\nAll of the events produced by HTML are supported in React. They\
    \ follow camel case naming conventions and are converted to synthetic events.\
    \ They are standardized, with a common interface cross browser.\n\nAll synthetic\
    \ events give you access to the DOMNode that emitted the event via `event.target`.\n\
    \n```\n handleEvent: function (syntheticEvent) {\n  var node = syntheticEvent.target;\n\
    \  var newValue = node.value;\n}\n```\n\nThis is one of the easiest ways to access\
    \ the value of Controlled components.\n\nFor elements that have children you need\
    \ to use `event.currentTarget`.\n\n# Label\n\nLabels on form elements are important\
    \ for clearly communicating your requirements of your users, and provide accessibility\
    \ for radios and checkboxes.\n\nThere is a conflict with the `for` attribute.\
    \ When using JSX, the attributes are converted to a JavaScript object and passed\
    \ to the component constructor as the first argument. For compatibility with ES3\
    \ (IE8) reserved words aren’t used as properties.\n\nIn React, just as `class`\
    \ becomes `className`, so too does `for` become `htmlFor`.\n\n```\n //JSX\n<label\
    \ htmlFor=\"name\">Name:</label>\n\n//after render\n<label for=\"name\">Name:</label>\n\
    ```\n\n# Textarea and Select\n\nReact makes some changes to the interface of `<textarea/>`\
    \ and `<select/>` to increase consistency and make it easier to manipulate.\n\n\
    `<textarea/>` is changed to be closer to `<input/>` allowing you to specify `value`\
    \ and `defaultValue`.\n\n```\n //Uncontrolled\n<textarea defaultValue=\"Hello\
    \ World\" />\n\n//Controlled\n<textarea \n  value={this.state.helloTo}\n  onChange={this.handleChange}\
    \ />\n```\n\n`<select/>` now accepts `value` and `defaultValue` to set which option\
    \ is selected. This allows easier manipulation of the value.\n\n```\n //Uncontrolled\n\
    <select defaultValue=\"B\">\n  <option value=\"A\">First Option</option>\n  <option\
    \ value=\"B\">Second Option</option>\n  <option value=\"C\">Third Option</option>\n\
    </select>\n\n//Controlled\n<select value={this.state.helloTo} onChange={this.handleChange}>\n\
    \  <option value=\"A\">First Option</option>\n  <option value=\"B\">Second Option</option>\n\
    \  <option value=\"C\">Third Option</option>\n</select>\n```\n\nReact supports\
    \ multi select. In order to use multi select you must pass an array to `value`\
    \ and `defaultValue`.\n\n```\n //Uncontrolled\n<select multiple=\"true\" defaultValue={[\"\
    A\",\"B\"]}>\n  <option value=\"A\">First Option</option>\n  <option value=\"\
    B\">Second Option</option>\n  <option value=\"C\">Third Option</option>\n</select>\n\
    ```\n\nWhen using multi select, the value of the select component is **not** updated\
    \ when the options are selected. Only the `selected` property of the option is\
    \ changed. Using a given `ref` or `syntheticEvent.target` you can access the options\
    \ and check if they are selected.\n\nIn the following example `handleChange` is\
    \ looping over the DOM to find out what option is currently selected.\n\n```\n\
    \ //http://jsfiddle.net/yddy2ep0/\nclass MyForm extends React.Component {\n  constructor()\
    \ {\n    super();\n    this.state = {\n      options: [\"B\"]\n    };\n  }\n \
    \ handleChange(event) {\n    var checked = [];\n    var sel = event.target;  \
    \ \n    for(var i=0; i < sel.length; i++){\n      var option = sel.options[i];\n\
    \      if (option.selected){\n        checked.push(option.value);\n      }\n \
    \   }     \n    this.setState({\n      options: checked\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.state.options);\n  },\n  render:\
    \ function () {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <select multiple=\"true\"\n            value={this.state.options}\n \
    \           onChange={(e) => this.handleChange(e)}\n        >\n          <option\
    \ value=\"A\">First Option</option>\n          <option value=\"B\">Second Option</option>\n\
    \          <option value=\"C\">Third Option</option>\n        </select>\n    \
    \    <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n \
    \   );\n  }\n};\n```\n\n# Checkbox and radio\n\nCheckboxes and radios have a different\
    \ mechanism for controlling them.\n\nJust as in HTML, an `<input/>` with type\
    \ `checkbox` or `radio` behave quite differently to an `<input/>` with type `text`.\
    \ Generally, the value of a checkbox or radio does not change. Only the `checked`\
    \ state changes. To control a checkbox or radio input, you need to control the\
    \ `checked` attribute. You can also use `defaultChecked` in an uncontrolled checkbox\
    \ or radio input.\n\n```\n // Uncontrolled\nclass MyForm extends React.Component\
    \ {\n  submitHandler(event) {\n    event.preventDefault();\n    alert(this.refs.mycheckbox.checked);\n\
    \  }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <input \n          ref=\"mycheckbox\"\n          type=\"checkbox\"\n\
    \          value=\"A\"\n          defaultChecked=\"true\" />\n        <br />\n\
    \        <button type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n\
    };\n\n// Controlled\nvar MyForm = React.createClass({\n  constructor() {\n   \
    \ super();\n    this.state = {\n      checked: true\n    };\n  }\n  handleChange(event)\
    \ {\n    this.setState({\n      checked: event.target.checked\n    });\n  }\n\
    \  submitHandler(event) {\n    event.preventDefault();\n    alert(this.state.checked);\n\
    \  }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <input \n          type=\"checkbox\"\n          value=\"A\"\n       \
    \   checked={this.state.checked}\n          onChange={this.handleChange} \n  \
    \      />\n        <br />\n        <button type=\"submit\">Speak</button>\n  \
    \    </form>\n    );\n  }\n};\n```\n\nIn both of these examples, the value of\
    \ the `<input/>` will always be `A`, since only the checked state changes.\n\n\
    ## Names on form elements\n\nNames carry less importance on from elements in React\
    \ when controlled form elements have values that are stored in state and the form\
    \ submit event is being intercepted. Names aren’t required to access the form\
    \ values. For uncontrolled form elements, you can use refs for direct access to\
    \ the form element.\n\nHowever, names are a crucial aspect of form components.\n\
    \n*   Names allow third party form serializers to still work within React.\n*\
    \   Names are also required if the form is going to be natively submitted.\n*\
    \   Names are used by your clients browser for auto filling common information\
    \ like the users address.\n*   Names are crucial to uncontrolled radio inputs,\
    \ as that is how they are grouped to ensure that only one radio with the same\
    \ name in a form can be checked at once. The same behavior can be replicated without\
    \ names using controlled radio inputs.\n"
