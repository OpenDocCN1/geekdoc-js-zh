    \ not classes with multiple methods, but rather as one single function. This function\
    \ accepts `props` as an argument and returns the desired elements, much like a\
    \ standalone `render` function in a traditional component.\n\nHere is what our\
    \ Day component looks like as a functional component:\n\n```\nfunction Day(props)\
