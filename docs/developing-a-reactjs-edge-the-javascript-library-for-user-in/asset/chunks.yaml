    \ data-reactid=\".0.1.$28\">8</span>\n  <span class=\"d3 value8\" data-reactid=\"\
    .0.1.$32\">8</span>\n</div>\n```\n\n```\n/* 应用于方块动画的 CSS 过渡 */\n.board span{\n\
    \  /* ... */\n  transition: all 100ms linear;\n}\n```\n\n`GameBoard`是状态机，它响应用户事件（`方向键`和`按钮点击`），并与游戏逻辑函数交互，然后用新棋盘更新状态。\n\
