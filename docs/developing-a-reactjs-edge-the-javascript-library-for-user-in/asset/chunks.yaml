  trans: "\n有许多架构模式可以与 React 一起使用。从标准的 Flux 模式，到像 Reflux 这样的 Flux 变体，再到完全不同的语言和生态系统（如\
    \ Om 和 ClojureScript），React 已被证明具有相当强的适应性。在本章中，我们将探讨示例 React 应用的结构，以及这种结构如何帮助管理随着项目增长而增加的复杂性。我们还将探讨一些流行的替代方案。\n\
    \n通常认为，你可以将 React 视为 MVC 中的 V。它可以与内联 AJAX 请求一起使用，如下所示，但这很快就会变得难以理解：\n\n```\nexport\
    \ default\nclass Reply extends React.Component {\n  getInitialState() {\n    return\
    \ {\n      text: \"\"\n    };\n  }\n  submitReply() {\n    $.ajax({ url: '/replies',\
    \ type: 'POST',\n      contentType: 'application/json',\n      dataType: 'json',\n\
    \      data: JSON.stringify(this.state.text)}, (json) => {\n        this.setState({\
    \ text: \"\" });\n      });\n  }\n  render() {\n    return (\n      <div>\n  \
    \      <textarea\n          value={this.state.text}\n          onChange={(e) =>\
    \ this.setState({text:e.target.value})}\n        />\n        <input value=\"Submit\"\
    \ type=\"button\" onClick={() => this.submitReply()} />\n      </div>\n    );\n\
    \  }\n}\n```\n\n例如，如何处理更新其他可能需要知道这条新回复的组件？\n\nReact 足够灵活，可以与许多 MVC 框架很好地配合使用。让我们从检查\
    \ `react-router` 开始。\n\n# 路由\n\n路由是一种将 URL 链接到应用程序视图层次结构的直观方式。\n\n路由器将单页应用中的 URL\
    \ 定向到特定的视图或组件。\n\n你可以想象，对于 URL `/items`，你可能希望运行一个函数，从服务器加载项目并渲染一个 `<ItemsList\
    \ />` 组件。\n\n有许多不同类型的路由器。它们也存在于服务器端。有些路由器同时在客户端和服务器端工作。\n\nReact 只是一个渲染库，并不提供路由器。React\
    \ 社区的爆炸式增长催生了大量路由解决方案。在本节中，我们将介绍 `react-router`，这是示例应用中使用的一种路由解决方案。\n\n## react-router\n\
    \n本书的示例应用使用了 `react-router`。它与其他路由器的不同之处在于，路由器是由 JSX 元素组成的。\n\n路由被定义为 `Route`\
    \ 组件，每个路由都有一个 `component` 属性，该属性是一个 React 组件。\n\n这是示例应用中的路由器：\n\n```\nexport default\
    \ (\n  <Route component={App}>\n    <Route component={MainLayout}>\n      <Route\
    \ path=\"/\" component={require('./pages/HomePage/HomePage')} />\n      <Route\
    \ path=\"/user/:id\" component={require('./pages/UserPage/UserPage')} />\n   \
    \   <Route path=\"/r/:id\" component={require('./pages/BoardPage/BoardPage')}\
    \ />\n      <Route path=\"/item/:id\" component={require('./pages/DetailsPage/DetailsPage')}\
    \ />\n    </Route>\n  </Route>\n);\n```\n\n要让路由器运行，你需要将其渲染为顶层组件：\n\n```\nvar root\
    \ = document.getElementById('app-root');\nReactDOM.render(\n  <Router history={createBrowserHistory()}>{routes}</Router>\n\
    , root);\n```\n\n与其他路由器一样，`react-router` 也有类似的参数概念。例如，路由 `'/user/:id'` 会将 `id`\
    \ 属性传递给 `UserPage` 组件。\n\n`react-router` 的一个很酷的特性是它提供了一个 `Link` 组件，你可以用它进行导航，它会将其映射到路由。在示例应用中，`react-router`\
    \ 的 `Link` 组件被封装在文件 `src/atom/Link.js` 中，但属性基本上只是传递给 `react-router` 组件。\n\n以下是我们的\
    \ `<MainNavigation/>` 组件使用 `Link` 组件的样子：\n\n```\n...\nexport default\nclass MainNavigation\
    \ extends React.Component {\n  render(){\n    return (\n      <Box>\n        <Box\
    \ direction=\"row\">\n          {tabs.map((tab) => {\n            return (\n \
    \             <Box margin={{left: \"0.1em\"}} key={tab.name}>\n              \
    \  <Link unstyled to={tab.to}>\n                  <Button which={tab.which}>{tab.name}</Button>\n\
    \                </Link>\n              </Box>\n            );\n          })}\n\
    \        </Box>\n      </Box>\n    );\n  }\n}\n```\n\n在此处阅读更多关于 `react-router`\
    \ 的信息并下载：[`github.com/reactjs/react-router`](https://github.com/reactjs/react-router)\n\
    \n# Flux\n\nFlux 是 Facebook 引入的一种客户端应用架构模式。它通过单向数据流补充了 React，这种数据流易于理解，并且几乎不需要任何脚手架即可启动和运行。\n\
    \nFlux 由四个主要部分组成：store、dispatcher、action creator 和视图（React 组件）。Action creator\
    \ 是辅助方法，用于为 dispatcher 创建语义接口。\n\n你可以将最顶层的 React 组件视为视图控制器。视图控制器组件与 store 交互，并促进与其子组件的通信。这与\
    \ iOS 世界中的 ViewController 并无不同。\n\nFlux 模式中的每个节点都是独立的，强制严格分离关注点，并保持每个节点易于独立测试。\n\
    \n## 数据流\n\nFlux 的一个关键方面是信息的单向流动。与其他事件处理结构松散或复杂的双向数据绑定的方法相比，这可能看起来非常不同。\n\nFlux\
    \ 在其组件之间具有明确定义的流程。\n\n1. 当你的应用程序启动时，你的 Stores 会向 Dispatcher 注册回调或事件监听器。\n\n2.\
    \ 当你的应用程序中的 React 组件被渲染时，它们会向 Stores 注册自己的回调或事件监听器。\n\n3. 当用户与视图交互并点击可能触发 Action\
    \ Creator 的内容时。\n\n4. Action Creator 可能会执行 AJAX 请求，然后通过 Dispatcher 分发一个 Action。\n\
    \n5. Dispatcher 然后将该 Action 传递给所有已向其注册回调的 Stores。\n\n6. Stores 会根据 Action 的内容更新其状态，如果状态发生变化，它们会通知所有正在监听变化事件的组件。\n\
    \n7. 被通知的视图随后会从 stores 请求更新后的状态，并在必要时重新渲染，使应用程序进入一个新的、更新后的状态。\n\n这种单向流动以及组件之间明确定义的职责分离，使得理解应用程序中的状态变化变得更加容易。\n\
    \n![Alt Text](img/flux-diagram-white-background.png)\n\n图片来源：[Facebook](https://github.com/facebook/flux/)\n\
    \n## Flux 的组成部分\n\nFlux 由具有特定职责的不同部分组成。在信息的单向流动中，每个 Flux 部分从下游获取输入，进行处理，然后将输出发送到上游。\n\
    \n* Dispatcher——应用程序中的中央枢纽。\n\n* Actions——应用程序的领域特定语言。\n\n* Store——业务逻辑和数据交互。\n\
    \n* Views——用于渲染应用程序的组件树。\n\n让我们讨论每个部分，它的职责，以及如何在你的 React 应用中有效地使用它。\n\n### Dispatcher\n\
    \n我们选择从 dispatcher 开始，因为它是所有用户交互和数据流经的中央枢纽。Dispatcher 是 Flux 模式中的单例。\n\nDispatcher\
    \ 负责在 stores 上注册回调，并管理它们之间的依赖关系。Actions 流经 dispatcher，然后进入已为其注册的 stores。\n\n我们的示例应用包含多个\
    \ stores。随着应用程序的增长，你不可避免地会遇到需要管理多个 stores 及其相互依赖关系的情况。我们将在下面讨论这种情况。\n\n### Actions\n\
    \n从用户的角度来看，这是 Flux 的起点。他们通过 UI 执行的每个操作都会创建一个 action，该 action 被发送到 dispatcher。\n"
- fmt: "\nWhile actions are not a formal part of the Flux pattern, they constitute\
    \ the domain-specific-language of your application. Action Creators translate\
    \ user interaction into meaningful dispatcher Actions—statements that a store\
    \ can act on.\n\n### Store\n\nThe store is responsible for encapsulating business\
    \ logic and interactions with your application’s data. The store chooses which\
    \ actions to respond to from the dispatcher by registering for them. Stores send\
    \ their data into the React component hierarchy through their change event.\n\n\
    It’s important to keep strict separation of concerns with the store.\n\n* Stores\
    \ hold *all* your application’s data.\n* No other part of your application should\
    \ know how to interact with the data — stores are the only place in your application\
    \ where data mutation occurs.\n* Stores don’t have setters—all updates flow through\
    \ the dispatcher into the store. Fresh data flows back into the application through\
    \ the store’s change event.\n\nBelow is an example of a store registering with\
    \ the `Dispatcher` to receive comments for a post.\n\n```\n Dispatcher.register(function(payload)\
    \ {\n  switch(payload.actionType) {\n    ...\n    case CommentConstants.RECEIVE_COMMENTS:\n\
          CommentStore.setComments(payload.comments, payload.parentPostId);\n     \
    \ break;\n  }\n});\n```\n\nThe store receives the action, performs the work of\
    \ saving the comments, and when done emits the change event.\n\n```\n CommentStore.prototype.setComments\
    \ = function(comments, parentPostId) {\n  // handle saving the results here\n\
      this.emitChange();\n}\n```\n\nThis change event is then handled by your React\
    \ Views. The new state will flow through your React component hierarchy and the\
    \ components will re-render as needed.\n\n### View-Controller\n\nYour application’s\
    \ component hierarchy will commonly have a high-level component responsible for\
    \ interacting with stores. Simple applications may only have one. More complex\
    \ applications might have many.\n\nThe process of wiring up a store is straightforward.\n\
    \n1. When the component mounts, add the change listener.\n2. As the store changes,\
    \ request the new data and process accordingly.\n3. When the component unmounts,\
    \ clean up the change listener.\n\nHere is an example of handling store interactions.\n\
    \n```\n export default\nclass App extends React.Component {\n  handleChange()\
    \ {\n    PostStore.getPosts((posts) => {\n      this.setState({ posts: posts });\n\
        });\n  }\n  componentDidMount() {\n    PostStore.addChangeListener(this.handleChange);\n\
      }\n  componentWillUnmount() {\n    PostStore.removeChangeListener(this.handleChange);\n\
      }\n  ...\n}\n```\n\n## Managing multiple stores\n\nInevitably, applications\
    \ grow to need multiple stores. This becomes tricky when one store depends upon\
    \ another, requiring the second store to complete its actions before the first\
    \ can perform its own actions.\n\nFor example, maybe we create a separate store\
    \ to maintain a survey-results summary, tallying the results of all survey respondents.\
    \ This summary store requires the main store to complete its record action before\
    \ we can safely update the summary store.\n\nThe standard Flux implementation\
    \ from Facebook includes a method named `waitFor`, which will help us instruct\
    \ stores to wait for other stores to finish processing an event before proceeding.\n\
    \n### Registering for dependent actions\n\nSuppose we have two stores concerned\
    \ about a `CREATE_COMMENT` action.\n\n* The `CommentStore` needs to store the\
    \ comment.\n* The `PostStore` needs to know re-tally the total comments for the\
    \ post.\n\nThis means that `PostStore` is dependent upon the `CommentStore` completing\
    \ the `CREATE_COMMENT` action before it can complete its work.\n\nWhen we register\
    \ the `CommentStore` at the top of our App, we store a reference to the dispatcher\
    \ token.\n\n```\n // Wire up the CommentStore with the action dispatcher\nCommentStore.dispatchToken\
    \ = Dispatcher.register(function(payload) {\n  switch(payload.actionType) {\n\
        ...\n    case CommentConstants.CREATE_COMMENT:\n      CommentStore.saveComment(payload.comment,\
    \ payload.parentPostId);\n      break;\n    ...\n  }\n});\n```\n\nThen we register\
    \ our new `PostStore`, placing the call to `waitFor` before we access the `CommentStore`\
    \ data.\n\n```\n PostStore.dispatchToken = Dispatcher.register(function(payload)\
    \ {\n  switch(payload.actionType) {\n    case CommentConstants.CREATE_COMMENT:\n\
          Dispatcher.waitFor(CommentStore.dispatchToken);\n      // At this point\
    \ it's guaranteed the `CommentStore` callback has been run\n      // and we can\
    \ safely access its data to summarize it.\n      var commentCount = CommentStore.getCommentsFor(payload.parentPostId);\n\
          PostStore.setCommentCount(commentCount, payload.parentPostId);\n      break;\n\
        }\n  }\n});\n```\n\n## Reflux\n\nThe sample app uses a popular Flux-inspired\
    \ library called Reflux. Reflux differs from Flux in that Stores subscribe directly\
    \ to Actions. This eliminates the need for large switch statements that check\
    \ an Action’s type. Stores may similarly listen to other stores, eliminating the\
    \ need for the `waitFor` call described in the Flux section. Action Creators are\
    \ eliminated because Reflux Actions are simply functions that pass the payload\
    \ the receive to listeners.\n\nThe sample app defines a number of stores in the\
    \ directory `src/stores`. All of the actions for the app are defined in `src/utils/actions.js`.\n\
    \nYou can find learn more about Reflux here: [https://github.com/reflux/refluxjs](https://github.com/reflux/refluxjs).\n\
    \n## Redux\n\nInfluenced by ClojureScript’s Om and functional reactive programming,\
    \ Redux is another Flux-inspired library for React applications. Redux is designed\
    \ to help you write applications that are easy to reason about and to provide\
    \ an excellent developer experience.\n\nSimilar to Om, Redux collects the entire\
    \ application’s state into a single object as a large tree of data. Redux is designed\
    \ so that all of your code, including Stores, can be hot-loaded, or updated while\
    \ your app is running.\n\nRedux has a single Store that is updated by Reducers\
    \ that respond to Actions. Redux Reducers are pure functions that return an updated\
    \ piece of the state tree. Reducers are often very similar to the function registered\
    \ with the `Dispatcher` by a Store. Instead of using getter methods on a Store\
    \ as in Flux, Redux has a concept of Selectors. Selectors are functions that retrieve\
    \ a piece of data from the state tree. Components then use a function called `connect`\
    \ to register for updates from the Store and use Selectors to retrieve the desired\
    \ data. These selected pieces of data are given to the connected component as\
    \ props. Action Creators in Redux are similar to those in Flux but, may be enhanced\
    \ with Middleware.\n\nYou can learn more about Redux here: [http://redux.js.org](http://redux.js.org).\n\
    \n## Relay\n\nRelay is a data-driven framework for React applications created\
    \ by Facebook. Relay makes it possible to specify the data a component needs as\
    \ a GraphQL fragment, or query, within the component itself. When Relay renders\
    \ your React app it builds a large composite query from all of the GraphQL fragments\
    \ on components to be rendered and then makes one request to the server. Co-locating\
    \ the data requirements and the component make keeping up with shifting data requirements\
    \ simple, and batching network requests improves performance. Using Relay requires\
    \ that you have a server that supports responding to GraphQL queries but, for\
    \ applications with complex data requirements or view hierarchies it can be a\
    \ great fit.\n\nYou can learn more about Relay here: [https://facebook.github.io/relay/](https://facebook.github.io/relay/).\n\
    \n## Om and Om Next (ClojureScript)\n"
