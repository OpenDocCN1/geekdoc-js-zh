  trans: "\n`Autofill` 是减少数据输入的另一种绝佳方式。利用用户的浏览器自动填充数据，可以避免用户重新输入常见信息，例如地址或付款详情。这可以通过在输入字段中使用标准名称来实现。\n\
    \n`Autocomplete` 可以在用户输入信息时提供引导，这与持续反馈的理念相契合。例如，在搜索电影时，自动补全功能有助于缓解因电影名称拼写错误而导致的问题。\n\
    \n另一种减少输入的有效方法是根据先前输入的数据推导信息。例如，当用户输入信用卡详细信息时，你可以查看前四位数字，判断卡片类型，然后为用户自动选择卡片类型。这既减少了输入，又向用户提供了验证反馈，表明他们正在正确输入卡号。\n\
    \n`Autofocus` 是一个虽小但非常有效的方法，可以提升表单的可用性。自动聚焦有助于引导用户找到数据输入的起点，从而避免他们自行摸索。这个小工具确实能对用户开始输入数据的速度产生巨大影响。\n\
    \n# 总结\n\nReact 通过将状态管理从 DOM 中抽离到组件中，帮助你管理表单的状态。这使你能更紧密地控制表单元素的操作方式，并创建可在应用程序中使用的复杂组件。\n\
    \n表单是用户在应用程序中遇到的最复杂的交互之一。在创建和组合表单组件时，务必牢记表单的可用性。\n\n接下来，你将学习如何为 React 组件添加动画，以创建更具吸引力的应用程序。\n\
    \n# 第 10 章 动画\n\n现在你已经能够组合复杂的 React 组件，是时候进行一些润色了。动画可以让用户体验更加流畅自然，而 React 的 Transition\
    \ Groups 插件结合 CSS3，使得在 React 项目中加入动画过渡变得轻而易举。\n\n从历史上看，浏览器中的动画一直采用非常命令式的 API。你需要获取一个元素并主动移动它或更改其样式来实现动画。这种方法与\
    \ React 的组件渲染和重新渲染方式相悖，因此 React 采用了更声明式的方法。\n\nCSS Transition Groups 通过在适当的渲染和重新渲染时机策略性地添加和移除类，来促进将\
    \ CSS 动画应用于过渡效果。这意味着你唯一需要做的就是为这些类指定合适的 CSS 样式。\n\nInterval Rendering 提供了更大的灵活性和控制力，但会牺牲性能。它需要更多的重新渲染，但允许你动画化不仅仅是\
    \ CSS 属性，例如滚动位置和 Canvas 绘图。\n\n# CSS Transition Groups\n\n在本例中，我们将为示例应用的评论编辑面板添加进出动画。`editingPane`\
    \ 要么是一个 React 元素，要么是 null。\n\n```\n<ReactCSSTransitionGroup \n  transitionName='EditingPaneTransition'\n\
    \  transitionEnterTimeout={300}\n  transitionLeaveTimeout={1200}\n>\n  {editingPane}\n\
    </ReactCSSTransitionGroup>\n```\n\n这个 `ReactCSSTransitionGroup` 组件来自一个插件，该插件在文件顶部附近通过\
    \ `var ReactCSSTransitionGroup = require('react-addons-css-transition-group')`\
    \ 引入。\n\n它会自动在适当的时间处理组件的重新渲染，并根据过渡所处的阶段改变过渡组的类，以便根据情境设置样式。\n\n你可以在以下地址阅读示例应用的完整源代码：[`git.io/vlcpa`](http://git.io/vlcpa)。\n\
    \n## 为过渡类设置样式\n\n按照惯例，`transitionName='EditingPaneTransition'` 属性将该元素与四个 CSS 类关联起来：`EditingPaneTransition-enter`、`EditingPaneTransition-enter-active`、`EditingPaneTransition-leave`\
    \ 和 `EditingPaneTransition-leave-active`。`CSSTransitionGroup` 插件会在子组件进入或离开 `ReactCSSTransitionGroup`\
    \ 组件时自动添加和移除这些类。\n\n以下是 CSS 示例。\n\n```\n.EditingPaneTransition-enter {\n  transform:\
    \ scale(1.2);\n  transition: transform 0.3s cubic-bezier(.97,.84,.5,1.21);\n}\n\
    \n.EditingPaneTransition-enter-active {\n  transform: scale(1);\n}\n\n.EditingPaneTransition-leave\
    \ {\n  transform: translateY(0);\n  opacity: 0;\n  transition: opacity 1.2s, transform\
    \ 1s cubic-bezier(.52,-0.25,.52,.95);\n}\n\n.EditingPaneTransition-leave-active\
    \ {\n  opacity: 0;\n  transform: translateY(-100%);\n}\n```\n\n## 过渡生命周期\n\n`EditingPaneTransition-enter`\
    \ 和 `EditingPaneTransition-enter-active` 的区别在于：`EditingPaneTransition-enter` 类在组件被添加到组时立即应用，而\
    \ `EditingPaneTransition-enter-active` 类在下一个 tick 时应用。这使你能够轻松指定过渡的起始样式、结束样式以及如何执行过渡。\n\
    \n默认情况下，过渡组同时启用进入和离开动画，但你可以通过向组件添加 `transitionEnter={false}` 或 `transitionLeave={false}`\
    \ 属性来禁用其中一个或两个。除了让你控制想要启用哪个动画之外，你还可以根据可配置的值来情境性地完全禁用动画，如下所示：\n\n```\n<ReactCSSTransitionGroup\
    \ \n  transitionName='EditingPaneTransition'\n  transitionEnter={this.props.enableAnimations}\n\
    \  transitionLeave={this.props.enableAnimations}\n  // ...\n>\n  {questions}\n\
    </ReactCSSTransitionGroup>\n```\n\n# 过渡组的陷阱\n\n使用过渡组时需要注意两个重要陷阱。\n\n首先，过渡组会延迟移除子组件，直到动画完成。这意味着，如果你将一组组件包裹在过渡组中，但没有为\
    \ `transitionName` 类指定任何 CSS，那么这些组件将无法被移除，即使你尝试停止渲染它们！\n\n其次，过渡组的每个子组件都必须设置唯一的\
    \ `key` 属性。过渡组使用这些值来确定组件何时进入或离开组，因此如果缺少 `key` 属性，动画可能无法运行，并且组件可能变得无法移除。\n\n请注意，即使过渡组只有一个子组件，它也必须具有\
    \ `key` 属性。\n\n# 间隔渲染\n\n你可以通过 CSS3 动画获得出色的性能和简洁的代码，但它们并不总是适合所有任务。有时你需要支持不支持 CSS3\
    \ 动画的旧浏览器。其他时候，你可能想要动画化 CSS 属性之外的内容，例如滚动位置或 Canvas 绘图。在这些情况下，间隔渲染可以满足你的需求，但与 CSS3\
    \ 动画相比，会牺牲性能。\n\n间隔渲染的基本思想是定期触发组件状态更新，以指定动画在其总运行时间中的进度。通过将此状态值合并到组件的渲染函数中，组件可以在每次状态变化导致重新渲染时表示动画的适当阶段。\n\
    \n由于这种方法涉及多次重新渲染，通常最好与 `requestAnimationFrame` 结合使用，以避免不必要的渲染。然而，在 `requestAnimationFrame`\
    \ 不可用或不理想的环境中，退而使用不太可预测的 `setTimeout` 可能是唯一的选择。\n\n## 使用 requestAnimationFrame\
    \ 进行间隔渲染\n\n"
- fmt: "\nSuppose you want to move a `div` across the screen using interval rendering.\
    \ You could accomplish this by giving it `position: absolute` and then updating\
    \ its `left` or `top` style attributes as time progressed. Doing this on `requestAnimationFrame`,\
    \ and basing the amount of the change on how much time has elapsed, should result\
    \ in a smooth animation.\n\nHere is an example implementation.\n\n```\n class\
    \ Positioner extends React.Component {\n  constructor() { super(); this.state\
    \ = {position: 0} }\n\n  resolveAnimationFrame() {\n    var timestamp = new Date();\n\
        var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp - timestamp);\n\
    \n    if (timeRemaining > 0) {\n      this.setState({position: timeRemaining});\n\
    \    }\n  }\n\n  componentWillUpdate: function() {\n    if (this.props.animationCompleteTimestamp)\
    \ {\n      requestAnimationFrame(() => this.resolveAnimationFrame());\n    }\n\
      }\n\n  render() {\n    var divStyle = {left: this.state.position};\n\n    return\
    \ <div style={divStyle}>This will animate!</div>\n  }\n});\n```\n\nIn this example,\
    \ the component has an `animationCompleteTimestamp` value set in its `props`,\
    \ which it uses in conjunction with the timestamp returned by `requestAnimationFrame`’s\
    \ callback to compute how much movement remains. The resulting value is stored\
    \ as `this.state.position`, which the `render` method then uses to position the\
    \ `div`.\n\nSince `requestAnimationFrame` is invoked by the `componentWillUpdate`\
    \ handler, it will be kicked off by any change to the component’s props (such\
    \ as a change to `animationCompleteTimestamp`), which includes the call to `this.setState`\
    \ inside `resolveAnimationFrame`. This means that once `animationCompleteTimestamp`\
    \ is set, the component will automatically continue firing successive `requestAnimationFrame`\
    \ invocations until the current time exceeds the value of `animationCompleteTimestamp`.\n\
    \nNotice that this logic revolves around timestamps only. A change to `animationCompleteTimestamp`\
    \ kicks it off, and the value of `this.state.position` depends entirely on the\
    \ difference between the current time and `animationCompleteTimestamp`. As such,\
    \ the `render` method is free to use `this.state.position` for any sort of animation,\
    \ from setting scroll position to drawing on a canvas, and anything in between.\n\
    \n## Interval rendering with setTimeout\n\nAlthough `requestAnimationFrame` is\
    \ likely to get you the smoothest animation with the least overhead, it is not\
    \ available in older browsers and may fire more often (or less predictably) than\
    \ you want it to. In those cases you can use `setTimeout` instead.\n\n```\n var\
    \ Positioner = React.createClass({\n  getInitialState: function() { return {position:\
    \ 0}; },\n\n  resolveSetTimeout: function() {\n    var timestamp = new Date();\n\
        var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp - timestamp);\n\
    \n    if (timeRemaining > 0) {\n      this.setState({position: timeRemaining});\n\
    \    }\n  },\n\n  componentWillUpdate: function() {\n    if (this.props.animationCompleteTimestamp)\
    \ {\n      setTimeout(this.resolveSetTimeout, this.props.timeoutMs);\n    }\n\
      },\n\n  render: function() {\n    var divStyle = {left: this.state.position};\n\
    \n    return <div style={divStyle}>This will animate!</div>\n  }\n});\n```\n\n\
    Since `setTimeout` takes an explicit time interval, whereas `requestAnimationFrame`\
    \ determines that interval on its own, this component has the additional dependency\
    \ of `this.props.timeoutMs`, which specifies the interval to use.\n\nThe open\
    \ source [React Tween State](https://github.com/chenglou/react-tween-state) library\
    \ provides a convenient layer of abstraction over this style of animation.\n\n\
    ## Spring Animation\n\nCSS transitions are simple to use and sometimes good enough.\
    \ They have many limitations from only supporting bezier curves to being unable\
    \ to halt or transition to a new value mid-animation. The web has fallen behind\
    \ the trend by not supporting spring animations as seen on mobile and other native\
    \ applications.\n\nThis is where a tool like `react-motion` ([https://github.com/chenglou/react-motion](https://github.com/chenglou/react-motion))\
    \ comes in. We’re using `react-motion` 0.3.1 here, so be sure to check the docs\
    \ for your version.\n\nFirst, we need to import `react-motion`’s take on transition\
    \ groups:\n\n```\n import {TransitionMotion, spring} from 'react-motion';\n```\n\
    \nThen we can use it in `render`. It has an odd API, where we pass a function\
    \ as children instead of the elements directly. It then passes the current progress\
    \ of the style values to that function and render based on it.\n\n```\n <TransitionMotion\n\
    \  willEnter={() => ({ opacity: spring(0) })}\n  willLeave={() => ({ opacity:\
    \ spring(0) })}\n  styles={this.state.show ? {x: {opacity: spring(1)}} : {}}\n\
    >\n  {() => {\n    var {x} = styles;\n    if (!x) return null;\n    return <div\
    \ styles={x}>Hello world</div>;\n  }}\n</TransitionMotion>\n```\n\nWhen `this.state.show`\
    \ becomes true it’ll animate in with a nice physics based transition, and animate\
    \ out in the same way. If the transition isn’t complete it’ll smoothly animate\
    \ to the new value.\n\nYou can completely replace CSS transitions with spring\
    \ physics to improve user experience.\n\n# Summary\n\nUsing these animation techniques,\
    \ you can now:\n\n1.  Efficiently animate transitions between states using CSS3\
    \ and Transition Groups.\n\n2.  Animate outside CSS, such as scroll position and\
    \ Canvas drawing, using `requestAnimationFrame`.\n\n3.  Fall back on `setTimeout`\
    \ in cases where `requestAnimationFrame` is not a viable option.\n\n4.  Deliver\
    \ spring animations.\n\nNext, you’ll be learning how to fine-tune your React performance!\n\
    \n# Chapter 11. Performance tuning\n\nReact’s DOM diffing allows you to effectively\
    \ discard your entire UI at any point in time with minimal impact on the DOM.\
    \ There are, however, cases where the delicate tuning of a component should render\
    \ a new virtual DOM representation that can help make your application faster.\
    \ For instance, this is useful if you have a very deeply nested component tree.\
    \ In this chapter we will cover a simple configuration you can provide to your\
    \ component to help speed up your application.\n\n# shouldComponentUpdate\n\n\
    When a component is updated, either by receiving new props or `setState` being\
    \ called, React will invoke the `render` method on each child component of that\
    \ component. In most cases this performs without a hitch, but on pages with deeply\
    \ nested component trees or a complex render method, you can experience some sluggishness.\n\
    \nSometimes a component’s `render` method is invoked when it doesn’t need to be.\
    \ This can happen when your component doesn’t use state or props, or if the props\
    \ or state don’t change when the parent re-rendered. So, rendering the component\
    \ again would yield the same exact virtual DOM representation that’s already present,\
    \ which would be unnecessary.\n\nReact provides the component lifecycle method\
    \ `shouldComponentUpdate`, which gives you a way to help React make the right\
    \ decision of whether or not to invoke specific component’s `render` method.\n\
    \n`shouldComponentUpdate` should return a boolean. `false` tells React to not\
    \ invoke the component’s `render` method and use the previously rendered virtual\
    \ DOM. Returning `true` will tell React to invoke the `render` method on the component\
    \ to get a new virtual DOM representation. By default `shouldComponentUpdate`\
    \ returns `true` and components will thus always re-render.\n\nNote that `shouldComponentUpdate`\
    \ is not called on the initial render of a component.\n\n`shouldComponentUpdate`\
    \ receives the new props and state as arguments to help your make a decision of\
    \ whether or not to re-render. For example a component with one prop and no state\
    \ can look like this:\n\n```\n shouldComponentUpdate(nextProps, nextState){\n\
        if (this.props.data !== nextProps.data) {\n      return true;\n    }\n   \
    \ return false;\n  }\n```\n"
