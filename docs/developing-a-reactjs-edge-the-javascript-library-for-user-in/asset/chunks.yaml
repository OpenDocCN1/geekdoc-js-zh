  trans: "\n\n对于始终根据相同 props 和 state 渲染的纯组件，你可以添加 `react-addons-pure-render-mixin`。由于我们使用的是\
    \ ES6 类，我们需要一个名为 `react-mixin` 的库（[`github.com/brigand/react-mixin`](https://github.com/brigand/react-mixin)），它允许你使用\
    \ mixin。这是少数应该使用 mixin 而非高阶组件的场景之一。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
    \ 阅读我们示例应用（一个 Reddit 克隆）的完整源代码。\n\n该 mixin 会覆盖 `shouldComponentUpdate`，将新的 props\
    \ 和 state 与旧的进行比较，如果它们相等则返回 false，就像上面的例子一样。\n\n有几个组件非常简单，比如 `EditEssayQuestion`，你可以将\
    \ `React.addons.PureRenderMixin` 与它一起使用：\n\n```\nimport reactMixin from 'react-mixin';\n\
    import PureRenderMixin from 'react-addons-pure-render-mixin';\nclass Foo extends\
    \ React.Component {\n  render(){\n    ...\n  }\n}\nreactMixin.onClass(Foo, PureRenderMixin);\n\
    ```\n\n当你有深层嵌套的复杂 props 或 state 时，比较可能会变慢。为了缓解这个问题，可以考虑使用不可变数据结构，比如第 16 章中讨论的那些。\n\
    \n# Key\n\n你通常会在列表中发现 key prop 的使用。它的目的是通过比组件类更多的信息来向 React 标识一个组件。例如，如果你有一个带有\
    \ `key=\"foo\"` 的 div，后来它变成了 `\"bar\"`，React 将跳过 diff 并完全丢弃子元素，从头开始渲染。\n\n这在渲染大型子树以避免\
    \ diff 时非常有用，因为你知道 diff 是浪费时间。除了告诉 React 何时丢弃节点外，在许多情况下，它还可以在元素顺序发生变化时使用。例如，考虑以下基于排序函数显示项目的渲染。\n\
    \n```\nvar items = sortBy(this.state.sortingAlgorithm, this.props.items);\nreturn\
    \ items.map(function (item) {\n  return <img src={item.src} />;\n});\n```\n\n\
    如果顺序发生变化，React 会对这些进行 diff，并确定最有效的操作是更改某些 `img` 元素上的 `src` 属性。这非常低效，并且会导致浏览器查询其缓存，可能引发新的网络请求。\n\
    \n为了解决这个问题，你可以简单地使用每个项目唯一的字符串（或数字）作为 key。\n\n```\nreturn <img src={item.src} key={item.id}\
    \ />;\n```\n\n现在 React 会查看这个，而不是更改 `src` 属性，它会意识到要执行的最小 `insertBefore` 操作，这是移动\
    \ DOM 节点最有效的方式。\n\n除了顺序变化外，不在末尾的插入也适用。如果没有正确的 key 属性，在数组前面添加一个项目会导致所有后续 `<img>`\
    \ 标签的 `src` 属性发生变化。\n\n同样值得注意的是，虽然你似乎将 key 作为 prop 传递，但它无法从组件内部以任何方式访问。\n\n# 总结\n\
    \n在本章中，你学习了如何：\n\n1. 修改 `shouldComponentUpdate` 以返回 true/false 来提高性能。\n\n2. 使用\
    \ `key` 帮助 React 了解子组件列表的最小变化。\n\n到目前为止，我们专注于在浏览器中使用 React，接下来你将学习通用（也称为同构）应用：在服务器上使用\
    \ JavaScript 和 React。\n\n# 第 12 章 服务器端渲染\n\n如果你希望搜索引擎抓取你的网站，服务器端渲染至关重要。它还能提供性能提升，因为浏览器可以在\
    \ JavaScript 仍在加载时就开始显示你的网站。\n\nReact 中的虚拟 DOM 是 React 能够用于服务器端渲染的核心。每个 React\
    \ 组件首先渲染到虚拟 DOM，然后 React 获取虚拟 DOM 并用任何更改更新真实 DOM。虚拟 DOM 作为 DOM 的内存表示，使得 React\
    \ 能够在非浏览器环境（如 Node.js）中工作。React 不是更新真实 DOM，而是从虚拟 DOM 生成一个字符串。这允许你在客户端和服务器上使用相同的\
    \ React 组件。\n\nReact 提供了两个可用于在服务器端渲染组件的函数：`React.renderToString` 和 `React.renderToStaticMarkup`。\n\
    \n在服务器端渲染组件需要在设计组件时具有前瞻性。你需要考虑：\n\n* 使用哪个渲染函数最好。\n\n* 如何支持组件的异步状态。\n\n* 如何将应用的初始状态传递给客户端。\n\
    \n* 服务器端有哪些生命周期函数可用。\n\n* 如何支持应用的同构路由。\n\n* 你对单例、实例和上下文的使用。\n\n# 渲染函数\n\n在服务器端渲染\
    \ React 组件时，你不能使用标准的 `React.render` 方法，因为在服务器端没有 DOM。React 通过提供两个支持标准 React 组件生命周期方法子集的渲染函数来实现服务器端渲染。\n\
    \n## React.renderToString\n\n可以在服务器端使用的两个渲染函数中的第一个是 `React.renderToString`。这是你最常使用的函数。\n\
    \n与 `React.render` 不同，这个函数不接受渲染位置的参数，而是返回一个字符串。这是一个同步（阻塞）函数，速度非常快。\n\n```\nvar\
    \ MyComponent = React.createClass({\n  render: function () {\n    return <div>Hello\
    \ World!</div>;\n  }\n});\n\nvar world = React.renderToString(<MyComponent/>);\n\
    \n//单行输出 - 为示例格式化\n<div \n  data-reactid=\".fgvrzhg2yo\" \n  data-react-checksum=\"\
    -1663559667\"\n>Hello World!</div>\n```\n\n你会注意到 React 在 `<div>` 上添加了两个 data 属性。\n\
    \n`data-reactid` 被 React 用于在浏览器环境中标识 DOM 节点。这就是它知道当 state 和 props 发生变化时要更新哪个 DOM\
    \ 节点的方式。\n\n`data-react-checksum` 仅在服务器端添加。顾名思义，它是所创建 DOM 的校验和。这允许 React 在客户端渲染相同组件时重用来自服务器的\
    \ DOM。这仅添加到根元素上。\n\n## React.renderToStaticMarkup\n\n`React.renderToStaticMarkup`\
    \ 是可以在服务器端使用的第二个渲染函数。\n\n它与 `React.renderToString` 相同，只是不包含 React 的 data 属性。\n\
    \n```\nvar MyComponent = React.createClass({\n  render: function () {\n    return\
    \ <div>Hello World!</div>;\n  }\n});\n\nvar world = React.renderToStaticMarkup(<MyComponent/>);\n\
    \n//单行输出\n<div>Hello World!</div>\n```\n\n## 字符串还是静态标记\n\n每个渲染函数都有其用途，因此你需要根据需求来决定使用哪个渲染函数。\n\
    \n仅当你*不*打算在客户端渲染相同的 React 组件时，才使用 `React.renderToStaticMarkup`。\n\n以下是一些示例：\n\n\
    * 生成 HTML 邮件。\n\n* 通过 HTML 转 PDF 生成 PDF。\n\n* 测试组件。\n\n在大多数情况下，你会希望使用 `React.renderToString`。这将允许\
    \ React 使用 `data-react-checksum` 来使客户端上相同 React 组件的初始化更快。由于 React 可以重用服务器提供的 DOM，它可以跳过生成\
    \ DOM 节点并将其附加到文档的昂贵过程。对于复杂的网站，这可以显著减少加载时间，使用户能够更快地与你的网站交互。\n\n你的 React 组件在服务器和客户端上渲染得*完全*相同非常重要。如果\
    \ `data-react-checksum` 不匹配，React 将销毁服务器提供的 DOM，生成新的 DOM 节点并将其附加到文档中。在这种情况下，你将失去服务器端渲染的大部分性能优势。\n\
    \n# 服务器端组件生命周期\n\n"
- fmt: "\nWhen rendering to string, only lifecycle methods *before* render are called.\
    \ Crucially `componentDidMount` and `componentWillUnmount` are not called during\
    \ the render process and `componentWillMount` is called from both.\n\nYou will\
    \ need to keep this in mind when creating components that will be rendered on\
    \ the server and the client. This is true especially when creating event listeners,\
    \ since there is no component lifecycle method to let you know when the React\
    \ component is finished.\n\nAny event listeners or timers started in `componentWillMount`\
    \ have the potential to cause memory leaks on the server.\n\nThe best practice\
    \ is to only create event listeners and timers from `componentDidMount` and stop\
    \ the event listeners and timers in `componentWillUnmount`.\n\n## Designing components\n\
    \nWhen rendering on the server side, you need to take special consideration to\
    \ how your state will be passed to the client to leverage the performance benefits\
    \ of server side rendering. This means designing your components with server sider\
    \ rendering in mind.\n\nYou should always design your React components so that\
    \ when you pass the same props to the component you will always get the same *initial*\
    \ render. If you always do this, you will increase testability of your components\
    \ and when you render on the server and the client you can be guaranteed they\
    \ will render the same. This is very important to ensure you will get the performance\
    \ benefit of server side rendering.\n\nLet’s say that you want to have a component\
    \ that prints a random number. This is an issue as the result will almost always\
    \ be different. If this component were to render on the server then render on\
    \ the client, the checksum would fail.\n\n```\n var MyComponent = React.createClass({\n\
    \  render: function () {\n    return <div>{Math.random()}</div>;\n  }\n});\n\n\
    var result = React.renderToStaticMarkup(<MyComponent/>);\nvar result2 = React.renderToStaticMarkup(<MyComponent/>);\n\
    \n//result\n<div>0.5820949131157249</div>\n\n//result2 \n<div>0.420401572631672</div>\n\
    ```\n\nIf you were to change your component it would receive the random number\
    \ by way of props. You can then pass the props to the client to be used for the\
    \ rendering.\n\n```\n var MyComponent = React.createClass({\n  render: function\
    \ () {\n    return <div>{this.props.number}</div>;\n  }\n});\n\nvar num = Math.random();\n\
    \n//server side\nReact.renderToString(<MyComponent number={num}/>);\n\n//pass\
    \ num to client side\nReact.render(<MyComponent number={num}/>, document.body);\n\
    ```\n\nThere are number of different ways to send the props used on the server\
    \ to the client.\n\nOne of the easiest ways is to pass the initial props to the\
    \ client by way of a JavaScript object.\n\n```\n <!DOCTYPE html>\n<html>\n<head>\n\
    <title>Example</title>\n<!-- bundle contains MyComponent, React, etc -->\n<script\
    \ type=\"text/javascript\" src=\"bundle.js\"></script>\n</head>\n<body>\n<!--\
    \ result of MyComponent server side render -->\n<div data-reactid=\".fgvrzhg2yo\"\
    \ data-react-checksum=\"-1663559667\">\n0.5820949131157249</div>\n\n<!-- inject\
    \ initial props used on the server side -->\n<script type=\"text/javascript\"\
    >\n  var initialProps = {\"num\": 0.5820949131157249};\n</script>\n\n<!-- use\
    \ initial prop from server -->\n<script type=\"text/javascript\">\n  var num =\
    \ initialProps.num;\n  React.render(<MyComponent number={num}/>, document.body);\n\
    </script>\n</body>\n</html>\n```\n\n## Asynchronous state\n\nMany applications\
    \ require data from a remote data source like a database or web service. On the\
    \ client, this is not an issue. The React component can show a loading view while\
    \ waiting for the asynchronous data to return. On the server side, this behavior\
    \ can’t be directly replicated with React since the render function is a synchronous\
    \ function. In order to use asynchronous data, you need to fetch the data first\
    \ then pass the data to the component at render time.\n\n**Example:**\n\nYou may\
    \ want to fetch the user record from an asynchronous store for use in the component.\n\
    \n**AND**\n\nYou want the state of the component after the user record has been\
    \ fetched to be rendered on the server side for SEO and performance reasons.\n\
    \n**AND**\n\nYou want the component to listen to changes on the client and re-render.\n\
    \n**Problem:** You can’t use any of the component lifecycle methods to fetch the\
    \ asynchronous data since `React.renderToString` is synchronous.\n\n**Solution:**\
    \ Use a statics function to fetch your asynchronous data, and then pass it to\
    \ the component to render. Pass the `initialState` to the client as props. Use\
    \ component lifecycle methods to listen to changes and update the state, using\
    \ the same `statics` function.\n\n```\n var Username = React.createClass({\n \
    \ statics: {\n    getAsyncState: function (props, setState) {\n      User.findById(props.userId)\n\
    \        .then(function (user) {\n          setState({user:user});\n        })\n\
    \        .catch(function (error) {\n          setState({error: error});\n    \
    \    });\n    }\n  },\n  //client and server\n  componentWillMount: function ()\
    \ {\n    if (this.props.initialState) {\n      this.setState(this.props.initialState);\n\
    \    }\n  },\n  //client side only\n  componentDidMount: function () {\n    //get\
    \ async state if not in props\n    if (!this.props.initialState) {\n      this.updateAsyncState();\n\
    \    }\n    //listen to changes\n    User.on('change', this.updateAsyncState);\n\
    \  },\n  //client side only\n  componentWillUnmount: function () {\n    //stop\
    \ listening to changes\n    User.off('change', this.updateAsyncState);\n  },\n\
    \  updateAsyncState: function () {\n    //access static function from within the\
    \ instance\n    this.constructor.getAsyncState(this.props, this.setState);\n \
    \ },\n  render: function () {\n    if (this.state.error) {\n      return <div>{this.state.error.message}</div>;\n\
    \    }\n    if (!this.state.user) {\n      return <div>Loading...</div>;\n   \
    \ }\n    return <div>{this.state.user.username}</div>;\n  }\n});\n\n//Render on\
    \ the server\n\nvar props = {\n  userId: 123 //could also be derived from route\n\
    };\n\nUsername.getAsyncState(props, function(initialState){\n  props[initialState]\
    \ = initialState;\n  var result = React.renderToString(Username(props));\n\n \
    \ //send result to client along with initialState\n});\n```\n\nUsing the solution\
    \ above, the pre-fetching of asynchronous data is only required on the server.\
    \ On the client, just the initial render needs to look for `initialState` passed\
    \ from the server. Subsequent route changes on the client (such as HTML5, pushState\
    \ or fragment change) should ignore any `initialState` from the server. You will\
    \ also want to display loading messages as the data is fetched.\n\n## Isomorphic\
    \ routing\n\nRouting is an essential part of any non trivial application. To render\
    \ a React application with a router on the server side, you need to ensure the\
    \ router supports rendering without the DOM.\n\nThe fetching of asynchronous data\
    \ is the job of a router and its route controllers. Let’s say a deeply nested\
    \ component needs some asynchronous data. If the data is needed for SEO purposes,\
    \ then the responsibility for fetching the data should be moved higher up to the\
    \ route controller, and the data should be passed down to the deeply nested component.\
    \ If it is not needed for SEO then it is okay to just fetch the data from within\
    \ `componentDidMount` on the client. This is akin to classical AJAX loaded data.\n\
    \nWhen looking at an isomorphic routing solution for React, make sure it either\
    \ has asynchronous state supported or can be easily modified to support asynchronous\
    \ state. Ideally you would also like the router to handle passing the `initialState`\
    \ down to the client.\n\n## Singletons, instances, and context\n\nIn the browser,\
    \ your application is wrapped in an isolation bubble. Each instance of your application\
    \ can’t mix state with other instances, since each instance is usually on different\
    \ computers or sandboxed on the same computer. This allows you to easily use singletons\
    \ in your application architecture.\n"
