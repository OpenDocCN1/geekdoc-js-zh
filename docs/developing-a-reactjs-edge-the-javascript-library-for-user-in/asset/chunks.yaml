  trans: "\n*   `constructor` 现在设置 `defaultValue`\n*   `<input/>` 的值在渲染时设置\n*   `<input/>`\
    \ 的 `onChange` 会调用变更处理函数\n*   变更处理函数更新状态\n*   `<input/>` 的值在渲染时更新\n\n这段代码比非受控版本多得多。然而，这让你能够控制数据流，并在数据输入时修改状态。\n\
    \n示例：你可能希望在输入时将所有字符转换为大写。\n\n```\n handleChange(value) {\n  this.setState({\n\
    \    helloTo: value.toUpperCase()\n  });\n}\n```\n\n你会注意到，在输入数据时，不会出现小写字符闪烁然后才变成大写字符添加到输入框中的情况。这是因为\
    \ React 拦截了原生的浏览器变更事件。然后，在调用 `setState` 之后，该组件会重新渲染输入框。接着 React 进行 DOM diff 并更新输入框的值。\n\
    \n你可以使用同样的模式来限制可输入的字符，或者不允许在电子邮件地址中输入非法字符。\n\n你可能还希望在数据输入时，在其他组件中使用该值。\n\n示例：\n\
    \n*   显示大小受限输入框中剩余的字符数。\n*   显示正在输入的十六进制值的颜色。\n*   显示自动补全选项。\n*   用输入值更新其他 UI\
    \ 元素。\n\n# 表单事件\n\n访问表单事件是控制表单不同方面的关键方面。\n\nReact 支持 HTML 产生的所有事件。它们遵循驼峰命名约定，并被转换为合成事件。这些事件是标准化的，具有跨浏览器的通用接口。\n\
    \n所有合成事件都允许你通过 `event.target` 访问触发事件的 DOM 节点。\n\n```\n handleEvent: function (syntheticEvent)\
    \ {\n  var node = syntheticEvent.target;\n  var newValue = node.value;\n}\n```\n\
    \n这是访问受控组件值的最简单方法之一。\n\n对于包含子元素的元素，你需要使用 `event.currentTarget`。\n\n# 标签\n\n表单元素上的标签对于清晰传达你对用户的要求非常重要，并且为单选按钮和复选框提供可访问性。\n\
    \n`for` 属性存在冲突。使用 JSX 时，属性会被转换为 JavaScript 对象，并作为第一个参数传递给组件构造函数。为了与 ES3（IE8）兼容，保留字不会用作属性。\n\
    \n在 React 中，就像 `class` 变成 `className` 一样，`for` 也变成了 `htmlFor`。\n\n```\n //JSX\n\
    <label htmlFor=\"name\">Name:</label>\n\n//渲染后\n<label for=\"name\">Name:</label>\n\
    ```\n\n# 文本域和选择框\n\nReact 对 `<textarea/>` 和 `<select/>` 的接口进行了一些更改，以提高一致性并使其更易于操作。\n\
    \n`<textarea/>` 被修改得更接近 `<input/>`，允许你指定 `value` 和 `defaultValue`。\n\n```\n //非受控\n\
    <textarea defaultValue=\"Hello World\" />\n\n//受控\n<textarea \n  value={this.state.helloTo}\n\
    \  onChange={this.handleChange} />\n```\n\n`<select/>` 现在接受 `value` 和 `defaultValue`\
    \ 来设置选中的选项。这使得值的操作更加容易。\n\n```\n //非受控\n<select defaultValue=\"B\">\n  <option\
    \ value=\"A\">First Option</option>\n  <option value=\"B\">Second Option</option>\n\
    \  <option value=\"C\">Third Option</option>\n</select>\n\n//受控\n<select value={this.state.helloTo}\
    \ onChange={this.handleChange}>\n  <option value=\"A\">First Option</option>\n\
    \  <option value=\"B\">Second Option</option>\n  <option value=\"C\">Third Option</option>\n\
    </select>\n```\n\nReact 支持多选。要使用多选，你必须向 `value` 和 `defaultValue` 传递一个数组。\n\n```\n\
    \ //非受控\n<select multiple=\"true\" defaultValue={[\"A\",\"B\"]}>\n  <option value=\"\
    A\">First Option</option>\n  <option value=\"B\">Second Option</option>\n  <option\
    \ value=\"C\">Third Option</option>\n</select>\n```\n\n使用多选时，当选项被选中时，选择组件的值**不会**更新。只有选项的\
    \ `selected` 属性会改变。通过给定的 `ref` 或 `syntheticEvent.target`，你可以访问选项并检查它们是否被选中。\n\n\
    在下面的示例中，`handleChange` 遍历 DOM 以找出当前选中的选项。\n\n```\n //http://jsfiddle.net/yddy2ep0/\n\
    class MyForm extends React.Component {\n  constructor() {\n    super();\n    this.state\
    \ = {\n      options: [\"B\"]\n    };\n  }\n  handleChange(event) {\n    var checked\
    \ = [];\n    var sel = event.target;   \n    for(var i=0; i < sel.length; i++){\n\
    \      var option = sel.options[i];\n      if (option.selected){\n        checked.push(option.value);\n\
    \      }\n    }     \n    this.setState({\n      options: checked\n    });\n \
    \ }\n  submitHandler(event) {\n    event.preventDefault();\n    alert(this.state.options);\n\
    \  },\n  render: function () {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <select multiple=\"true\"\n            value={this.state.options}\n \
    \           onChange={(e) => this.handleChange(e)}\n        >\n          <option\
    \ value=\"A\">First Option</option>\n          <option value=\"B\">Second Option</option>\n\
    \          <option value=\"C\">Third Option</option>\n        </select>\n    \
    \    <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n \
    \   );\n  }\n};\n```\n\n# 复选框和单选按钮\n\n复选框和单选按钮有不同的控制机制。\n\n就像在 HTML 中一样，类型为 `checkbox`\
    \ 或 `radio` 的 `<input/>` 与类型为 `text` 的 `<input/>` 行为截然不同。通常，复选框或单选按钮的值不会改变。只有\
    \ `checked` 状态会改变。要控制复选框或单选按钮输入，你需要控制 `checked` 属性。你也可以在非受控的复选框或单选按钮输入中使用 `defaultChecked`。\n\
    \n```\n // 非受控\nclass MyForm extends React.Component {\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.refs.mycheckbox.checked);\n \
    \ }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
    \        <input \n          ref=\"mycheckbox\"\n          type=\"checkbox\"\n\
    \          value=\"A\"\n          defaultChecked=\"true\" />\n        <br />\n\
    \        <button type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n\
    };\n\n// 受控\nvar MyForm = React.createClass({\n  constructor() {\n    super();\n\
    \    this.state = {\n      checked: true\n    };\n  }\n  handleChange(event) {\n\
    \    this.setState({\n      checked: event.target.checked\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.state.checked);\n  }\n  render()\
    \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n    \
    \    <input \n          type=\"checkbox\"\n          value=\"A\"\n          checked={this.state.checked}\n\
    \          onChange={this.handleChange} \n        />\n        <br />\n       \
    \ <button type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\
    \n在这两个示例中，`<input/>` 的值始终是 `A`，因为只有 `checked` 状态会改变。\n\n## 表单元素上的名称\n\n在 React\
    \ 中，当受控表单元素的值存储在状态中并且表单提交事件被拦截时，名称在表单元素上的重要性较低。访问表单值不需要名称。对于非受控表单元素，你可以使用 refs\
    \ 直接访问表单元素。\n\n然而，名称是表单组件的一个关键方面。\n\n*   名称允许第三方表单序列化器在 React 中仍然正常工作。\n*   如果表单要以原生方式提交，也需要名称。\n\
    *   客户端浏览器使用名称来自动填充常见信息，例如用户的地址。\n*   名称对于非受控的单选按钮输入至关重要，因为通过名称对它们进行分组，可以确保表单中同一名称的单选按钮一次只能选中一个。使用受控的单选按钮输入，可以在没有名称的情况下复制相同的行为。\n\
    \n"
- fmt: "\nThe following example replicates the functionality of an uncontrolled radio\
    \ group by storing the state in the `MyForm` component. You will notice that nameis\
    \ not being used.\n\n```\n class MyForm extends React.Component {\n  constructor(){\n\
        super();\n    this.state = {\n      radio: \"B\"\n    };\n  }\n  handleChange(event)\
    \ {\n    this.setState({\n      radio: event.target.value\n    });\n  }\n  submitHandler(event)\
    \ {\n    event.preventDefault();\n    alert(this.state.radio);\n  }\n  render()\
    \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n    \
    \    <input\n          type=\"radio\"\n          value=\"A\"\n          checked={this.state.radio\
    \ == \"A\"}\n          onChange={(e) => this.handleChange(e)} /> A\n        <br\
    \ />\n        <input \n          type=\"radio\"\n          value=\"B\"\n     \
    \     checked={this.state.radio == \"B\"}\n          onChange={(e) => this.handleChange(e)}\
    \ /> B\n        <br />\n        <input \n          type=\"radio\"\n          value=\"\
    C\"\n          checked={this.state.radio == \"C\"}\n          onChange={(e) =>\
    \ this.handleChange(e)} /> C\n        <br />\n        <button type=\"submit\"\
    >Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n# Multiple form elements\
    \ and change handlers\n\nWhen using Controlled form elements, you don’t want to\
    \ be writing a change handler for every form element. Fortunately, here are a\
    \ few different ways of re-using a change handler with React.\n\nAn example: arrow\
    \ functions.\n\n```\n class MyForm extends React.Component {\n  constructor()\
    \ {\n    super();\n    this.state = {\n      given_name: \"\",\n      family_name:\
    \ \"\"\n    };\n  }\n  handleChange(name, event) {\n    var newState = {};\n \
    \   newState[name] = event.target.value;\n    this.setState(newState);\n\n   \
    \ // or the es6 version\n    this.setState({\n      [name]: event.target.value,\n\
        });\n  }\n  submitHandler(event) {\n    event.preventDefault();\n    var words\
    \ = [\n      \"Hi\",\n      this.state.given_name,\n      this.state.family_name\n\
    \    ];\n    alert(words.join(\" \"));\n  }\n  render() {\n    return (\n    \
    \  <form onSubmit={this.submitHandler}>\n        <label htmlFor=\"given_name\"\
    >Given Name:</label>\n        <br />\n        <input\n          type=\"text\"\n\
    \          name=\"given_name\"\n          value={this.state.given_name}\n    \
    \      onChange={(e) => this.handleChange('given_name', e)}/>\n        <br />\n\
    \        <label htmlFor=\"family_name\">Family Name:</label>\n        <br />\n\
    \        <input\n          type=\"text\"\n          name=\"family_name\"\n   \
    \       value={this.state.family_name}\n          onChange={(e) => this.handleChange('family_name',\
    \ e)}/>\n        <br />\n        <button type=\"submit\">Speak</button>\n    \
    \  </form>\n    );\n  }\n};\n```\n\nAn Example: use `DOMNode` name to identify\
    \ what state to change.\n\n```\n //http://jsfiddle.net/q3g0sk84/\nclass MyForm\
    \ extends React.Component {\n  constructor() {\n    super();\n    this.state =\
    \ {\n      givenName: \"\",\n      familyName: \"\",\n    };\n  }\n  handleChange(event)\
    \ {\n    this.setState({\n      [event.target.name]: event.target.value\n    });\n\
    \  }\n  submitHandler(event) {\n    event.preventDefault();\n    var words = [\n\
    \      \"Hi\",\n      this.state.givenName,\n      this.state.familyName,\n  \
    \  ];\n    alert(words.join(\" \"));\n  }\n  render() {\n    return (\n      <form\
    \ onSubmit={this.submitHandler}>\n        <label htmlFor=\"givenName\">Given Name:</label>\n\
    \        <br />\n        <input\n          type=\"text\"\n          name=\"givenName\"\
    \n          value={this.state.givenName}\n          onChange={(e) => this.handleChange(e)}/>\n\
    \        <br />\n        <label htmlFor=\"familyName\">Family Name:</label>\n\
    \        <br />\n        <input\n          type=\"text\"\n          name=\"familyName\"\
    \n          value={this.state.familyName}\n          onChange={this.handleChange}/>\n\
    \        <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n\
        );\n  }\n};\n```\n\n# Custom form components\n\nCreating custom form components\
    \ is an excellent way to reuse common functionality in your applications. It can\
    \ also be a great way to improve the interface to other more complex form components\
    \ like checkboxes and radios.\n\nWhen writing custom form components you should\
    \ try to create the same interface as other form components. This will increase\
    \ the predictability of your code, making it much easier to understand how your\
    \ component works, without having to look at it’s implementation.\n\nLet’s create\
    \ a custom radio component that has the same interface as the React select component.\
    \ We won’t implement multi select functionality, since radio components don’t\
    \ support multi select.\n\n```\n class Radio extends React.Component {\n  static\
    \ propTypes = {\n    onChange: React.PropTypes.func\n  };\n\n  constructor(){\n\
        super();\n    this.state = {\n      value: this.props.defaultValue\n    };\n\
    \  }\n  handleChange(event) {\n    if (this.props.onChange) {\n      this.props.onChange(event);\n\
    \    }\n    this.setState({\n      value: event.target.value\n    });\n  }\n \
    \ render() {\n    var value = this.props.value || this.state.value;\n\n    var\
    \ children = React.Children\n      .map(this.props.children, (child, i) => {\n\
    \      return (\n        <label key={i}>\n          <input\n            type=\"\
    radio\"\n            name={this.props.name}\n            value={child.props.value}\n\
    \            checked={child.props.value == value}\n            onChange={this.handleChange}\
    \ />\n          {child.props.children}\n          <br/>\n        </label>\n  \
    \    );\n    });\n\n    return this.transferPropsTo(<span>{children}</span>);\n\
    \  }\n};\n```\n\nEssentially we are creating a Controlled component that supports\
    \ the Controlled and Uncontrolled interface.\n\nThe first thing you do is make\
    \ sure that if `onChange` is supplied that it is always a function. Then store\
    \ the `defaultValue` in state.\n\nEach time the component renders, it creates\
    \ new labels and radios based on the options that were supplied as children to\
    \ the component. Be sure that the dynamic children have consistent keys rendered.\
    \ This ensures that React will keep your `<input/>`’s in the DOM and maintain\
    \ current focus when using keyboard controls.\n\nThen set the value, the name,\
    \ and the checked state. Attach your `onChange` handler, then render the new children.\n\
    \n```\n //Uncontrolled\n//http://jsfiddle.net/moyfLkfv/\nvar MyForm = React.createClass({\n\
    \  submitHandler: function (event) {\n    event.preventDefault();\n    alert(this.refs.radio.state.value);\n\
    \  },\n  render: function () {\n    return <form onSubmit={this.submitHandler}>\n\
    \        <Radio ref=\"radio\" name=\"my_radio\" defaultValue=\"B\">\n        \
    \  <option value=\"A\">First Option</option>\n          <option value=\"B\">Second\
    \ Option</option>\n          <option value=\"C\">Third Option</option>\n     \
    \   </Radio>\n        <button type=\"submit\">Speak</button>\n      </form>;\n\
    \  }\n});\n```\n\nWhen storing the value in the state of your component, you don’t\
    \ need to access the `DOMNode` to know what the current value is. You can access\
    \ the state directly.\n\n```\n //Controlled\n//http://jsfiddle.net/cwabLksg/\n\
    var MyForm = React.createClass({\n  getInitialState: function () {\n    return\
    \ {my_radio: \"B\"};\n  },\n  handleChange: function (event) {\n    this.setState({\n\
    \      my_radio: event.target.value\n    });\n  },\n  submitHandler: function\
    \ (event) {\n    event.preventDefault();\n    alert(this.state.my_radio);\n  },\n\
    \  render: function () {\n    return <form onSubmit={this.submitHandler}>\n  \
    \      <Radio name=\"my_radio\" \n            value={this.state.my_radio}\n  \
    \          onChange={this.handleChange}>\n          <option value=\"A\">First\
    \ Option</option>\n          <option value=\"B\">Second Option</option>\n    \
    \      <option value=\"C\">Third Option</option>\n        </Radio>\n        <button\
    \ type=\"submit\">Speak</button>\n      </form>;\n  }\n});\n```\n\nAs a Controlled\
    \ component, this operates exactly the same as a select box. The event passed\
    \ to `onChange` is the event from the active `<input/>`, so you can use it to\
    \ read the current value.\n\nAs an exercise, you may want to try and implement\
    \ support for a `valueLink` property so you can use this component with `React.addons.LinkedStateMixin`.\n\
    \n# Focus\n"
