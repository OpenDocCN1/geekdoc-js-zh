  trans: "\n\n因此，`Webpack` 可以完成 `Browserify` 的工作，同时结合其他构建工具（如 `grunt` 或 `gulp`）的功能。\n\
    \n`Webpack` 是一个模块系统，通过添加和替换插件来支持扩展。默认情况下，它启用了 `commonjs` 解析器插件。\n\n我们不会在这里详细讲解\
    \ `Webpack` 的每个方面，但会涵盖基础知识以及让 `Webpack` 与 `React` 协同工作所需的内容。\n\n### Webpack 与\
    \ React\n\n`React` 帮助你为应用程序创建组件。`Webpack` 不仅帮助你打包 JavaScript，还打包应用程序所需的所有其他资源。这使你能够创建包含所有资源依赖的组件。这样一来，组件可以自带依赖，从而变得更加可移植。此外，随着应用程序的增长和变化，当你移除组件时，它们的资源依赖也会被一并移除。这意味着不再有废弃的\
    \ CSS 或孤立的图片。\n\n让我们看看一个 `React` 组件在引入自身资源依赖时是什么样子。\n\n```\n //logo.js\nrequire('./logo.css');\n\
    \nvar React = require('react');\n\nvar Logo = React.createClass({\n    render:\
    \ function () {\n        return <img className=\"Logo\" src={require('./logo.png')}\
    \ />\n    }\n});\n\nmodule.exports = Logo;\n```\n\n要打包这个组件，你需要为应用程序设置一个入口点。\n\n\
    ```\n //app.js\nvar React = require('react');\nvar ReactDOM = require('react-dom');\n\
    var Logo = require('./logo.js');\n\nvar root = document.getElementById('root');\n\
    React.render(<Logo/>, root);\n```\n\n现在，你需要创建一个 `Webpack` 配置文件，告诉 `Webpack` 针对不同文件类型使用哪些加载器。同时，我们还会指定应用程序的入口点以及所有打包文件的存放位置。\n\
    \n```\n //webpack.config.js\nmodule.exports = {\n    //应用程序的起始点\n  entry: './app.js',\n\
    \  output: {\n\n    //所有打包资源的存放位置\n    path: './public/build',\n\n    //所有 url-loader\
    \ 资源的前缀\n    publicPath: './build/',\n\n    //打包后应用程序的文件名\n    filename: 'bundle.js'\n\
    \  },\n  module: {\n    loaders: [\n      {\n\n        //加载器支持的文件类型的正则表达式\n\n\
    \        test: /\\.(js)$/, \n        loader: 'babel-loader'\n      },\n\n    \
    \  {\n\n        test: /\\.(css)$/,\n\n        //多个加载器通过 \"!\" 串联\n\n        loader:\
    \ 'style-loader!css-loader'\n\n      },\n\n      {\n\n        test: /\\.(png|jpg)$/,\n\
    \n        //url-loader 支持内联资源的 base64 编码\n\n        loader: 'url-loader?size=8192'\n\
    \n      }\n    ]\n  }\n};\n```\n\n现在你需要安装 `Webpack` 和所有加载器。你可以通过命令行使用 `npm`，或者使用\
    \ `package.json`。\n\n请确保在本地安装加载器，而不是全局安装（`-g`）。\n\n```\n npm install webpack react\n\
    npm install url-loader jsx-loader style-loader css-loader\n```\n\n一切安装完成后，你可以运行\
    \ `Webpack`：\n\n```\n //开发环境构建一次\nwebpack \n\n//构建并生成 source maps\nwebpack -d\
    \ \n\n//生产环境构建，压缩、混淆、移除死代码\nwebpack -p\n\n//快速增量构建，可与其他选项配合使用\nwebpack --watch\n\
    ```\n\n# 调试工具\n\n无论你多么小心，错误总是难免的。我们不会讲解如何调试 JavaScript，但会介绍一些让调试 `React` 应用程序更轻松的工具。\n\
    \n# 开始\n\n在本章中，请打开 Chrome 并安装 [React 开发者工具](https://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapgofadopljbjfkapdkoienihi?hl=en)\
    \ 插件。\n\n右键点击一个元素，选择“检查元素”。你会看到熟悉的 DOM 结构视图，即“元素”标签页。\n\n不过，你并不是来看 DOM 的。你想查看的是组件、它们的\
    \ props 和 state。如果操作完成，下一步你应该会在最右侧看到一个名为“React”的标签页。\n\n![选中元素后的 React 开发者工具截图](img/001.png)\n\
    \n左侧是组件的层级结构，右侧是所选实例的信息。\n\n仅查看这些信息，就能让你了解 React 中组件所绑定的 state、props 和事件监听器。而开发者工具的功能远不止于此。\n\
    \n![React 开发者工具显示传递的 props 的树状视图截图](img/003.png)\n\n你可以看到 `SurveyTable` 组件接收了一个包含时间戳的调查数组。在实际视图中，它们以人类可读的格式呈现。双击其中一个时间戳，输入一个新值。这会导致组件使用新值进行更新。\n\
    \n开发者工具有助于你缩小问题范围，并帮助团队中的新成员找到需要编辑和完成任务的组件。\n\n# JSBin 和 JSFiddle\n\n在调试或头脑风暴时，像\
    \ `JSFiddle` 和 `JSBin` 这样的在线演示网站是非常有用的资源。在寻求帮助时，可以用它们创建测试用例，或者与他人分享原型。\n\n这里有一个配置了\
    \ `Babel` 和 `React` 的 `jsbin`，你可以直接用来创建内容：[`jsbin.com/ledaqefuya/1/edit?js,output`](http://jsbin.com/ledaqefuya/1/edit?js,output)。\n\
    \n# 总结\n\n你现在应该已经看到，在使用 `React` 开发时，调试和构建工具能为你带来的好处。在下一章中，你将了解如何在 `React` 中使用自动化测试的详细信息。\n\
    \n# 第 14 章 测试\n\n现在你已经学会了使用 `React` 构建 Web 应用程序的方方面面，让我们在学习架构模式（将在第 15 章中介绍）之前先退一步。当你开始一个新应用程序时，生产力非常简单，因为你只需要不断编写代码。但随着应用程序的演进，如果不小心，你可能会发现自己面对的是一个混乱的代码库，很难进行修改。这就是为什么在你的工具箱中拥有一个强大的工具——自动化测试——非常重要。自动化测试通常通过测试驱动开发（TDD）工作流程来实施，可以帮助你实现更简单、更模块化、更不易因变更而脆弱、并且可以更自信地进行修改的代码。\n\
    \n# 但我以前从未测试过 JavaScript？\n\n没关系！如果你以前从未做过，自动化测试可能看起来像一个总是遥不可及的概念。本章不会作为 JavaScript\
    \ 测试的详尽资源，因为这值得单独写一本书，但我们会尽量提供足够的上下文，以便你能够跟上并在需要时自行研究特定主题。\n\n# 开始\n\n你可能会问：“但我有一个出色的\
    \ QA 团队专注于测试。为什么我还要关心测试？我不能跳过这一章吗？”好问题！自动化测试对你有所帮助的主要原因与 bug 或回归捕获无关，尽管那是测试的一个有益副作用。自动化测试的真正目标是帮助你编写*更好*的代码。通常情况下，写得糟糕的代码很难测试。因此，如果你在编写代码的同时开始编写测试，测试会促使你不要编写草率的代码。你会自然而然地被推动去遵循单一职责原则\
    \ ^(1)、迪米特法则 ^(2)，并以模块化的方式组织代码。\n\n当我们提到测试驱动开发（TDD）时，我们指的是一种使用“红、绿、重构”流程的测试风格。首先，你编写一个失败的测试（测试为红色），然后编写应用程序代码使测试通过（测试变为绿色），最后重构应用程序代码使其更简洁，同时保持测试为绿色。这是一个让你以小批量方式工作的过程，每次迭代在测试变绿时都会带来积极的感觉。\n\
    \n## 测试的类型\n\n"
- fmt: "\nNow that you’ve been convinced that automated testing is important, let’s\
    \ go over the type of testing: unit testing. There are many other types of automated\
    \ testing (integration testing, functional testing, performance testing, security\
    \ testing, and visual testing ^([3](#ch14.html_idm139745264269376))), but those\
    \ are outside the scope of this book.\n\n*   Unit Test: a test that exercises\
    \ the smallest piece of functionality in your application. Often this will be\
    \ calling a function directly with specific inputs and validating the outputs\
    \ or the side effects.\n\nThis sounds like a lot, but when you dive into it you\
    \ will find out that it is not only manageable, but very fun to see your tests\
    \ passing for the first time.\n\n## Tools\n\nFortunately, the JavaScript community\
    \ has a healthy ecosystem of testing tools, so we can leverage them to get our\
    \ test suites off the ground quickly. The tests for this book use `Jest` and `Enzyme`.\
    \ `Jest` runs tests using `Jasmine` so, if you are familiar with `Jasmine`, you\
    \ may find these tests familiar. Listed below are some popular alternatives.\n\
    \n*   `Karma`\n*   `Mocha`\n*   `Chai`\n*   `Sinon`\n*   `Casper.js`\n*   `Qunit`\n\
    \nSo let’s start coding!\n\n# Unit Testing React Components with Jest and Enzyme\n\
    \nWhen writing a React component, the only requirement is that you define a `render`\
    \ function. Let’s begin writing a test for a new `<Comment />` component that\
    \ verifies that a component renders the desired output.\n\n`Jest` automatically\
    \ scans for test files inside of directories named `__tests__`. Conventionally,\
    \ these test directories are placed in the folder with the file being tested.\n\
    \n## Making Assertions About the Content of Components\n\nIn keeping with that\
    \ convention, create a new file for your test at `/src/molecules/__tests__/Comment.test.js`\
    \ in the sample project.\n\nWe begin by importing `React`, a few helper functions\
    \ from `enzyme` that we’ll review as the test grows, and the `Comment` module\
    \ itself.\n\n```javascript\nimport React from 'react';\nimport {shallow, mount,\
    \ render} from 'enzyme';\n\nimport Comment from '../Comment';\njest.unmock('../Comment');\n\
    ```\n\nAfter importing `Comment`, we tell `Jest` to `unmock` it because we want\
    \ to test it. This is part of what makes `Jest` unique. `Jest` automatically mocks\
    \ all of the JavaScript modules your code depends on. This makes it simple to\
    \ test the behavior of a single module or collection of modules without creating\
    \ mock implementations manually.\n\n# Configuring Jest\n\n`Jest` is configured\
    \ in the project’s `package.json` file. It is configured to not mock a number\
    \ of important libraries that support the app so those libraries still function\
    \ as expected in your tests and to preprocess your source code to support new\
    \ ES6 syntax.\n\nNow, let’s add the actual test.\n\n```javascript\n...\ndescribe('molecules/Comment',\
    \ () => {\n  it('<Comment />', () => {\n    expect(render(<Comment />)).toBeDefined();\n\
    \  });\n});\n```\n\nThis test asserts that rendering the `Comment` actually returns\
    \ a value. Let’s see if it works. Save the file and run your tests by typing the\
    \ following in your terminal at the root of the project:\n\n```bash\nnpm test\n\
    ```\n\nWhen you run this command you should see output like the following:\n\n\
    ```\nUsing Jest CLI v0.9.2, jasmine2\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
    \ (0.347s)\nWarning: React.createElement: type should not be null, undefined,\
    \ boolean, or number. It should be a string (for DOM elements) or a ReactClass\
    \ (for composite components).\nFAIL  src/molecules/__tests__/Comment.test.js\n\
    ● Runtime Error\nError: Cannot find module '../Comment' from 'Comment.test.js'\n\
    \  at Loader._resolveNodeModule (/Users/youruser/bleeding-edge-react-sample-app.github.io/node_modules/jest-cli/src/HasteModuleLoader/HasteModuleLoader.js:431:11)\n\
    \  at Object.<anonymous> (/Users/youruser/bleeding-edge-react-sample-app.github.io/src/molecules/__tests__/Comment.test.js:5:6)\n\
    \ PASS  src/atoms/__tests__/Box.test.js (1.058s)\n1 test failed, 7 tests passed\
    \ (8 total in 3 test suites, run time 2.427s)\n```\n\nThe test failed because\
    \ we still haven’t implemented our `Comment` component. Before we move on to fixing\
    \ this, run the following in your terminal to run `Jest` in `watch` mode. It will\
    \ watch for changes in your project and re-run your tests automatically, giving\
    \ you quick feedback as you code!\n\n```bash\nnpm test -- --watch\n```\n\nNow\
    \ let’s create a new file at `/src/molecules/Comment.js` and add the following\
    \ implementation to start:\n\n```javascript\nimport React, {PropTypes} from 'react';\n\
    import Box from '../atoms/Box';\n\nexport default\nclass Comment extends React.Component\
    \ {\n  static propTypes = {\n\n  };\n\n  render(){\n    return (\n      <Box>\n\
    \        A Comment!\n      </Box>\n    );\n  }\n}\n```\n\nThis incomplete implementation\
    \ simply renders a `Box` with static text. After saving your new `Comment` component,\
    \ return to your terminal, where you should see:\n\n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
    \ (0.343s)\n PASS  src/atoms/__tests__/Box.test.js (0.987s)\n PASS  src/molecules/__tests__/Comment.test.js\
    \ (1.092s)\n8 tests passed (8 total in 3 test suites, run time 2.228s)\n```\n\n\
    Your test passes! But our `Comment` component is not complete yet. The objective\
    \ with the `Comment` component is to extract the logic inside of the `map` function\
    \ in `Comments.js` and create a component out of it. The `map` function currently\
    \ provides a `comment` object so our `Comment` component should take that as a\
    \ required property. Let’s modify our existing test so that it renders a `Comment`\
    \ component with an example `comment` prop and verify that it contains some of\
    \ the `comment` prop’s content:\n\n```javascript\ndescribe('molecules/Comment',\
    \ () => {\n  let comment = {\n    id: 1,\n    replies: [],\n    score: 1,\n  \
    \  score_hidden: 1,\n    body: \"Test Driven Development, yeah!\",\n    author:\
    \ \"Jeremiah Hall\"\n  };\n\n  it('<Comment comment={comment}/>', () => {\n  \
    \  let renderedComment = render(<Comment comment={comment} targetScore={1} />);\n\
    \    expect(renderedComment.text()).toContain(comment.body);\n    expect(renderedComment.text()).toContain(comment.author);\n\
    \  });\n});\n```\n\nLet’s examine the new test:\n\n1.  First, an example `comment`\
    \ object is defined.\n2.  Then a `Comment` component with some example props is\
    \ rendered using `Enzyme`’s `render` function.\n3.  You then assert that the text\
    \ of the rendered comment contains the `body` and `author` of the comment.\n\n\
    The object returned by `Enzyme`’s `render` function is a wrapper object with a\
    \ number of helpful methods. You’ll use the other two functions in later tests.\n\
    \nAfter saving the file you should see that the test failed:\n\n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
    \ (0.342s)\n PASS  src/atoms/__tests__/Box.test.js (0.99s)\n FAIL  src/molecules/__tests__/Comment.test.js\
    \ (1.112s)\n● molecules/Comment › it <Comment comment={comment}/>\n - Expected\
    \ 'A Comment!' to contain 'Test Driven Development, yeah!'.\n       at Object.eval\
    \ (src/molecules/__tests__/Comment.test.js:23:36)\n       at handle (node_modules/worker-farm/lib/child/index.js:41:8)\n\
    \       at process.<anonymous> (node_modules/worker-farm/lib/child/index.js:47:3)\n\
    \       at emitTwo (events.js:87:13)\n       at process.emit (events.js:172:7)\n\
    \       at handleMessage (internal/child_process.js:686:10)\n       at Pipe.channel.onread\
    \ (internal/child_process.js:440:11)\n - Expected 'A Comment!' to contain 'Jeremiah\
    \ Hall'.\n       at Object.eval (src/molecules/__tests__/Comment.test.js:24:36)\n\
    \       at handle (node_modules/worker-farm/lib/child/index.js:41:8)\n       at\
    \ process.<anonymous> (node_modules/worker-farm/lib/child/index.js:47:3)\n   \
    \    at emitTwo (events.js:87:13)\n       at process.emit (events.js:172:7)\n\
    \       at handleMessage (internal/child_process.js:686:10)\n       at Pipe.channel.onread\
    \ (internal/child_process.js:440:11)\n1 test failed, 7 tests passed (8 total in\
    \ 3 test suites, run time 2.192s)\n```\n\nLet’s complete the `Comment` component.\
    \ You’ll need to add a few imports and implement the `render` method:\n"
