  - `get_db_avail.pl` 见图 III.27\n- `get_ws_status.pl` 见图 III.31\n\n我们还将分别使用依赖脚本 `thresh.pl`、`actions.pl`\
  \ 以及文件 `thresh.xml`，分别如图 III.17、图 III.18 和图 III.34 所示。\n\n首先，请查看图 III.33 所示的修改后的\
  \ `get_process_stats.pl` 和图 III.34 所示的最终版 `thresh.xml`。\n\n****图 III.33** get_process_stats.pl\n\
  \n```perl\n#get_process_stats.pl\n\nuse Win32::PerfMon;\nuse strict;\nuse Win32::Process::Info;\n\
  require 'thresh.pl';\n\nmy $pi = Win32::Process::Info->new();\nmy @procinfo = $pi->GetProcInfo();\n\
  my $procname = undef;\nmy $procstatus=0;\nmy $ret = undef;\nmy $err = undef;\nmy\
  \ $Object = undef;\nmy $CounterData = undef;\n\n#connect to localhost for data\n\
  my $perfmon = Win32::PerfMon->new(\"\\\\localhost\"); \nmy $result = open PIDFILE,\
  \ \"Komodo.pid\";\nif ($result) {\n    if ( defined(my $piddata = <PIDFILE>)) {\n\
  \        chomp $piddata;\n        for my $pid (@procinfo){\n            if ($pid->{\"\
  ProcessId\"} == $piddata) {\n                $procname = $pid->{\"Name\"};\n   \
  \             print $pid->{\"Name\"}.\" is running!\\n\";\n                &threshold_check\
  \ (\"proc_avail\", 100);\n                $procstatus=1;\n            }\n      \
  \  }\n        if ($procstatus!=1) {\n            print \"Process $piddata cannot\
  \ be found!\";\n            &threshold_check (\"proc_avail\", 1);\n        } else\
  \ {\n            $procname =~ s/^(.+?)(\\.[.]*)?$/$1/;\n            if($perfmon\
  \ != undef) {\n                $ret = $perfmon->AddCounter(\"Process\", \"% Processor\
  \ Time\", $procname);\n                if($ret != 0) {\n                    $ret\
  \ = $perfmon->AddCounter(\"Process\", \"Private Bytes\", $procname);\n         \
  \       }\n                if($ret != 0) {\n                    $ret = $perfmon->CollectData();\n\
  \                    if($ret != 0) {\n                        my $proctime=$perfmon->GetCounterValue(\"\
  Process\",\"% Processor Time\", $procname);\n                        if($proctime\
  \ > -1) {\n                            print \"% Processor Time = \".[$proctime]\\\
  n\";\n                            if ($proctime > 0) {\n                       \
  \         &threshold_check(\"proc_cpu\", $proctime);\n                         \
  \   } else {\n                                &threshold_check(\"proc_cpu\", 1);\n\
  \                            }\n                        } else {\n             \
  \               $err = $perfmon->GetErrorText();\n                            print\"\
  Failed to get the processor counter data!\\n\", $err, \"\\n\";\n               \
  \         }\n                    }\n                    my $freemem = $perfmon->GetCounterValue(\"\
  Process\",\"Private Bytes\", \"komodo\");\n                    if($freemem > -1)\
  \ {\n                        &threshold_check (\"proc_mem\", $freemem);\n      \
  \              }\n                }\n            }\n        }\n    }\n}\n```\n\n\
