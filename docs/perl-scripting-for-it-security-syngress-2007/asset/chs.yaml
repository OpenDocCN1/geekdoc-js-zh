  \n这些值可以定义为状态颜色（如绿色、黄色和红色），或状态代码（如良好、警告和严重）。由于我们需要为获取的许多不同数据定义阈值，因此我们需要一种通用的方法来处理阈值的评估并根据阈值采取行动。实现此点的最佳方法是创建一个专门处理阈值相关项目的独立脚本。\n\
  \n在该脚本中，我们需要能够接收关于监控对象以及监控结果的输入信息。然后，我们需要将该值与一组阈值进行比较，并查看它们之间的关系。最后，根据结果，我们需要采取某种操作，即使该操作只是忽略结果。\n\
  \n### 加载 XML 配置文件\n\n为了简化此脚本的使用和配置，我们将使用可扩展标记语言（`XML`）作为脚本配置文件的文档格式。\n\n通过 `XML`，我们可以定义所需的阈值信息，并避免将值硬编码在阈值脚本中。图\
  \ III.11 所示的 XML 文档了了 XML 格式存储我们将处理的配置值的一种方法。\n\n**图 III.11** 阈值配置 XML\n\n```xml\n\
  <threshold>\n  <monitor name=\"sys_proc\">\n    <status name=\"red\" value=\"90\"\
  \ operator=\"equalorgreater\">\n      <action>email</action>\n      <action>page</action>\n\
  \    </status>\n    <status name=\"yellow\" value=\"85\" operator=\"equalorgreater\"\
  >\n      <action>email</action>\n    </status>\n    <status name=\"green\" value=\"\
  85\" operator=\"less\">\n      <action>none</action>\n    </status>\n  </monitor>\n\
  \  <monitor name=\"sys_mem\">\n    <status name=\"red\" value=\"50\" operator=\"\
  equalorless\">\n      <action>email</action>\n      <action>page</action>\n    </status>\n\
  \    <status name=\"yellow\" value=\"100\" operator=\"equalorless\">\n      <action>email</action>\n\
  \    </status>\n    <status name=\"green\" value=\"100\" operator=\"greater\">\n\
  \      <action>none</action>\n    </status>\n  </monitor>\n</threshold>\n```\n\n\
  在这个 XML 文档中，我们为配置信息设置了分级格式。文档中显示的第一个标签是 `<threshold>`，它表示包含的值将用于何处。我们随后使用 `<monitor>`\
  \ 标签指示特定的监控器，并为监控器设置 `name` 值。随后是一系列 `<status>` 标签，每个标签都有自己的 `name`、`value` 和 `operator`\
  \ 参数。\n\n在 `<status>` 标签内部，存在一个或多个 `<action>` 标签，表示当满足状态设置的条件时应该采取哪些操作。\n\n为了导入这些\
  \ XML 数据并使用它们，我们将使用 `XML::Simple` 模块。该模块随 ActivePerl 默认加载，但如果你的 ActivePerl 安装没有包含它，可以使用\
  \ PPM 进行安装。`XML::Simple` 模块允许从文件或字符串导入、导出和操作 XML 数据。为了使用我们的 XML 文件，我们在阈值脚本中采取的早期操作之一就是使用\
  \ `XML::Simple` 模块导入 XML。执行此操作的简单方法如图 III.12 所示。\n\n**图 III.12** load_display_XML.pl\n\
  \n```perl\nuse strict;\nuse XML::Simple;\nuse Data::Dumper;\n\nmy $xml = new XML::Simple(KeyAttr=>[],\
  \ ForceArray => 1); \nmy $data=$xml->XMLin(\"/dls/thresh.xml\");\n\n#DEBUG\n#Uncomment\
  \ to print data structure\n#print Dumper($data);\n#END DEBUG\n\nforeach my $monitor\
  \ (@{$data->{monitor}})\n{\n    print \"Monitor: \" . $monitor->{name} . \"\\n\"\
  ; \n    foreach my $status (@{$monitor->{status}})\n    {\n        foreach my $action\
  \ (@{$status->{action}})\n        {\n            print \"If value is \" . $status->{operator}\
  \ .\n            \" than \" . $status->{value}. \" take action \" .\n          \
  \  $action . \" and set status as \" .\n            $status->{name} . \".\\n\";\n\
  \        }\n    }\n}\nprint \"\\n\\nFinished!\\n\";\n```\n\n当我们运行图 III.12 所示的代码时，我们得到了图\
  \ III.13 所示的结果。\n\n**图 III.13** load_display_XML 结果\n\n基本上，这是我们的 XML 文件中构建的所有规则的输出。让我们过一遍代码。首先，我们有\
  \ `use` 语句，表示我们将使用 `XML::Simple` 和 `Data::Dumper`。虽然 `Data::Dumper` 解析 XML 并非必须，但该模块在显示数据结构时非常有用。你将在代码稍靠后的\
  \ `DEBUG` 部分看到对它的使用。\n\n接下来，我们带有几个选项创建了 `XML::Simple` 的新实例。第一个选项是 `KeyAttr` 选项，它将嵌套元素从数组转换为哈希表。\n\
  \n我们还使用了 `ForceArray` 选项来强制 `XML::Simple` 即使只有一个元素也创建数组。有关 `XML::Simple` 可用选项的完整描述，请参见\
  \ `search.cpan.org/~XML-Simple-2.18/lib/XML/Simple.pm`。\n\n下行代码使用 `XMLin` 函数加载我们的\
  \ XML 以填充 `$data` 变量。然后是我们的调试部分。如果你取消调用 `Dumper($data)` 的代码，就可以看到数据结构。\n\n### 评估阈值\n\
