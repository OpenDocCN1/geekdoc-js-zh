  \ 17 20:27:13 2004 (UTC)\n\n\n\n\n正如你所见，`samparse.pl` 根据从 SAM 数据库提取的内容显示本地用户账户信息。在“Group\
  \ Membership”（组 Membership）部分，你可能会在本该出现用户名的地方看到一系列 4 或 5 位数字，例如在上方的 `Administrators`\
  \ 组下方。在这种情况下，这些值是域用户的相对标识符（RIDs）。这表明被检查的系统是（或曾经是）域的一部分。\n\n## SECParse.pl\n\n与 `system32\\\
  conf` 目录下的 SAM 文件一样，`Security` 文件也包含一些非常有用的信息。特别是，`Security` 文件维护了审计配置（如在活动系统中运行\
  \ `auditpol.exe` 时所示），该配置决定了哪些事件会被审计并记录在 Windows 事件日志中。\n\n微软知识库文章 `Q2461203` 描述了如何从从\
  \ Windows NT 4.0 系统提取的 `Security` 文件解析这些信息，互联网上的资源提供了必要的信息，让你对 Windows 2000、XP 和\
  \ 2003 系统进行相同的操作。\n\n```\n#! c:\\perl\\bin\\perl.exe\n\n#--------------------------------------------------------------\n\
  # secparse.pl\n\n# Parse the raw Security file and display the audit policy\n# for\
  \ the system (2000, XP, 2003)\n#\n# Usage: secparse.pl <filename> [ > output_file]\n\
  #\n# NT: http://support.microsoft.com/kb/246120\n# 2K: http://www.jsifaq.com/SF/Tips/Tip.aspx?id=5231\n\
  # http://loguk.blogspot.com/2004/09/bit-of-windows-internals-recently.html\n#\n\
  # copyright 2006–2007 H. Carvey keydet89@yahoo.com\n#--------------------------------------------------------------\n\
  use strict;\n\nuse Parse::Win32Registry qw(:REG_);\n\nmy %win2kevents = (\n    0\
  \ => “System Events”,\n    1 => “Logon Events”,\n    2 => “Object Access”,\n   \
  \ 3 => “Privilege Use”,\n    4 => “Process Tracking”,\n    5 => “Policy Change”,\n\
  \    6 => “Account Management”,\n    7 => “Directory Service Access”,\n    8 =>\
  \ “Account Logon Events”\n);\n\nmy %ntevents = (\n    0 => “Restart, Shutdown, Sys”,\n\
  \    1 => “Logon/Logoff”,\n    2 => “File/Object Access”,\n    3 => “Use of User\
  \ Rights”,\n    4 => “Process Tracking”,\n    5 => “Sec Policy Mgmt”,\n    6 =>\
  \ “User/Grp Mgmt”\n);\n\nmy %audit = (\n    0 => “None”,\n    1 => “Succ”,\n   \
  \ 2 => “Fail”,\n    3 => “Both”\n);\n\nmy %policy = ();\n\nmy $file = shift || die\
  \ “You must enter a filename.\\n”; die “$file not found.\\n” unless (-e $file);\n\
  \nmy $reg = Parse::Win32Registry->new($file);\nmy $root = $reg->get_root_key;\n\
  my $pol = $root->get_subkey(“Policy\\PolAdtEv”);\nmy $ts = $pol->get_timestamp();\n\
  \nprint “LastWrite: “.gmtime($ts).” (UTC)\\n\");\n\nmy $val = $pol->get_value(\"\
  \");\n#print “\\t”.$val->print_summary().“\\n”;\n\nmy $adt = $val->get_data();\n\
  my $len = length($adt);\nmy $enabled = unpack(“C”,substr($adt,0,1));\n\nif ($enabled)\
  \ {\n    print “Auditing was enabled.\\n”;\n    my @evts = unpack(“V*”,substr($adt,4,$len-4));\n\
  \    my $tot = $evts[scalar(@evts) - 1];\n    print “There are $tot audit categories.\\\
  n”;\n    print “\\n”;\n\n    if ($tot == 9) {\n        foreach my $n (0..(scalar(@evts)\
  \ - 2)) {\n            my $adtev = $audit{$evts[$n]};\n            $policy{$win2kevents{$n}}\
  \ = $adtev;\n        }\n    }\n    elsif ($tot == 7) {\n        foreach my $n (0..(scalar(@evts)\
  \ - 2)) {\n            my $adtev = $audit{$evts[$n]};\n            $policy{$ntevents{$n}}\
  \ = $adtev;\n        }\n    }\n    else {\n        print “Unknown audit guration.\\\
  n”;\n    }\n\n    foreach my $k (keys %policy) {\n        printf “%-25s %-4s\\n”,$k,$policy{$k};\n\
  \    }\n} else {\n    print “Auditing was not enabled.\\n”;\n}\n```\n\n为了运行 `secparse.pl`\
  \ Perl 脚本，只需打开存储脚本的目录的命令提示符并输入以下命令：`C:\\Perl\\forensics>secparse.pl d:\\cases\\\
  case001\\security`。\n\n当针对获取镜像提取的 `Security` 文件运行 `secparse.pl` 时，调查人员应该看到如下内容：\n\
