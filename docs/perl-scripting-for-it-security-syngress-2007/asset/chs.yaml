  \ 模块。该模块可以通过 PPM 加载，并在默认的 ActiveState 仓库中找到。图 III.5 显示了通过 PPM 的图形用户界面 (GUI) 版本查看该模块。\n\
  \n![Image 24](img/index-170_1.jpg)\n\n**图 III.5** `Win32::Process::Info` 模块\n\n\
  图 III.6 中的脚本显示了如何使用该模块来收集系统上运行进程的信息。请记住，此时此时我们并不是在寻找性能信息；而是正在寻找进程本身的详细信息及其可用性。首先，我们将获取系统上运行的进程列表。\n\
  \n**图 III.6** `get_processes.pl`\n\n```perl\n#get_processes.pl\n\nuse strict;\n\n\
  use Win32::Process::Info;\n\nmy $pi = Win32::Process::Info->new();\n\nmy @procinfo\
  \ = $pi->GetProcInfo();\n\nfor my $pid (@procinfo){\n    print $pid->{\"ProcessId\"\
  }.\" \".\n    $pid->{\"Name\"}.\"\\n\";\n}\n```\n\n在图 III.6 的代码示例中，我们首先创建一个 `Win32::Process::Info`\
  \ 对象的实例并将其命名为 `$pi`。接下来，我们调用模块的 `GetProcInfo` 函数将进程信息收集到 `procinfo` 列表中。遍历列表的每个成员，通过显示与进程关联的\
  \ `ProcessId` 和 `Name` 键，打印每个运行进程的进程 ID 和名称。\n\n现在我们已经有了查询系统上运行进程的方法，我们需要处理这些数据并找到我们感兴趣的某个特定进程。当调用\
  \ `GetProcInfo` 函数且不带任何参数时，它将获取的所有数据加载到一个匿名哈希列表列表中。使用此列表，我们可以通过将要查找的值分别与 `ProcessId`\
  \ 键或 `Name` 键进行比较，按进程 ID 或可执行文件名来查找进程。\n\n某些程序在启动时会创建一个 `PID` 文件，其中包含运行进程的进程 ID。虽然这在\
  \ *NIX 操作系统* 上更为常见，但某些 Windows 应用程序也使用相同的标准。如果是这样，应用程序通常会在应用程序的工作目录下创建一个名为`<应用程序名称>.pid`\
  \ 的文件。\n\n读取此文件中存储的值允许我们获取特定的进程 ID，并用它来获取进程状态。图 III.7 显示的代码了如何读取此文件并利用该值检查进程。\n\n\
  **图 III.7** `get_process_status_id.pl`\n\n```perl\n#get_process_status_id.pl\n\n\
  use strict;\n\nuse Win32::Process::Info;\n\nmy $pi = Win32::Process::Info->new();\n\
  \nmy @procinfo = $pi->GetProcInfo();\n\nmy $procstatus=0;\n\nmy $result = open PIDFILE,\
  \ \"C:\\\\dls\\\\Komodo.pid\"; if ($result) {\n    if ( defined(my $piddata = <PIDFILE>))\
  \ {\n        chomp $piddata;\n        for my $pid (@procinfo){\n            if ($pid->{\"\
  ProcessId\"} == $piddata) {\n                print $pid->{\"Name\"}.\" is running!\"\
  ; $procstatus=1;\n            }\n        }\n        if ($procstatus!=1)\n      \
  \  {\n            print \"Process $piddata cannot be found!\"\n        }\n    }\n\
  \    else\n    {\n        print \"PID not found in PID file.\";\n    }\n}\nelse\n\
  {\n    print \"PID file not found.\";\n}\n```\n\n在图 III.7 显示的代码中，我们使用 `Win32::Process::Info`\
  \ 模块的方式与图 III.6 类似，但增加了一些额外功能。第一个主要变化是定义 PID 文件、打开文件并从文件的第一行读取进程 ID。我们还使用 `chomp`\
  \ 函数来去掉任何换行符。然后，我们遍历由 `GetProcInfo` 函数提供的所有哈希，寻找从 PID 文件中收集的进程 ID。如果找到了该项，我们就记录该进程正在运行（包括可执行文件名称），并将\
  \ `$procstatus` 变量的值改为 1。稍后，我们检查此变量，如果值不为 1，我们就显示一条说明未找到进程的消息。\n\n这意味着该进程要么没有运行，要么\
  \ PID 信息是不正确的。因此，从 PID 文件中收集的进程 ID 被包含在消息中以供验证。\n\n使用这段代码，我们还可以通过其名称来查找进程。这为我们的监控提供了额外的灵活性，使我们不再完全依赖于应用程序创建自己的\
  \ PID 文件。图 III.8 显示了如何修改此代码，以便使用名称而非进程 ID 来检查进程的可用性。\n\n**图 III.8** `get_process_status_name.pl`\n\
  \n```perl\n#get_process_status_name.pl\n\nuse strict;\n\nuse Win32::Process::Info;\n\
  \nmy $pi = Win32::Process::Info->new();\n\nmy @procinfo = $pi->GetProcInfo();\n\n\
  my $procstatus=0;\n\nmy $procname=\"komodo.exe\";\n\nfor my $pid (@procinfo){\n\
  \    if ($pid->{\"Name\"} eq $procname) {\n        print $pid->{\"Name\"}.\" is\
  \ running under \".$pid->{\"Name\"}!\"; $procstatus=1;\n    }\n}\n\nif ($procstatus!=1)\n\
  {\n    print \"Process $procname cannot be found!\"\n}\n```\n\n这段代码与图 III.7 非常相似，不同在于删除了\
  \ PID 文件操作，并将搜索改为 `Name` 键而非 `ProcessId` 键。`$procstatus` 变量的使用方式与图 III.7 相同。\n\n\
  监控 Windows 应用程序 Perl • 第 149 页\n\n### 多进程\n\n你可以使用图 III.7 所示或其他特定的脚本来监控多个进程。在收集统计数据时，从\
  \ PID 文件或使用进程名称。对于监控的最佳性能很重要，但在许多情况下我们关注单个进程的利用率。\n\n### CPU 利用率\n\n为了收集进程的 CPU\
  \ 统计数据，我们需要知道进程名称。根据进程 ID 查找进程名称的方法在图 III.7 中所示。在示例中，我们假设正在处理 PID 文件。查找特定进程 CPU\
  \ 利用率的方法可以使用 `Process` 对象代替之前使用的 `Processor` 对象。我们可以再次使用 `% Processor Time` 计数器，因为这是我们感兴趣的统计数据。然后，在指定实例时，使用要获取信息的执行文件名称。在这种情况下，我们将获取\
  \ Perl 编辑器 Komodo Edit 信息，它在之前的示例中也被使用过。这可以在图 III.9 中看到。\n\n**图 III.9 `get_percentprocessortime_komodo`\n\
  \n```perl\n#get_percentprocessortime_komodo.pl\n\nuse Win32::PerfMon;\n\nuse strict;\n\
  use Win32::Process::Info;\n\nmy $pi = Win32::Process::Info->new();\n\nmy @procinfo\
  \ = $pi->GetProcInfo();\n\nmy $procname = undef;\nmy $procstatus=0;\n\nmy $ret =\
