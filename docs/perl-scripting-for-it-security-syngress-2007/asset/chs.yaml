  foreach my $pdl (@{$sorter{$item}}) {\n\nPSDisplayText(\"\\t -–> $pdl”);\n\n}\n\n\
  }\n\nPSDisplayText(“\\n”);\n\n}\n\n#----------------------------------------------------------------\n\
