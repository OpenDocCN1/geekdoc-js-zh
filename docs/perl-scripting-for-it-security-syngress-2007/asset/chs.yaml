  \ 中只打开了一个系统镜像，并且已经填充了 `Registry View` 注册表视图——请查看 ProDiscover 关于如何填充 `Registry View`\
  \ 的说明），以确定系统根目录的路径（`SystemRoot` 是 Windows 中的一个环境变量，指向 Windows 目录……在 Windows XP 上，它通常是“`C:\\\
  Windows`）。从那里开始，ProScript 填充维护还原点的完整路径（该值在 Windows XP 系统上是静态的，或始终位于相同位置），并开始解析每个还原点中的\
  \ `rp.log` 文件，并从文件中提取信息（时间戳、创建还原点的原因）。\n\n图 II.6 展示了在从 Windows XP 系统获取的镜像上运行 `SysRestore.pl`\
  \ ProScript 后的输出结果。\n\n![图像 21](img/index-141_1.jpg)\n\n**Perl 脚本与计算机取证分析 • 第二部分\
