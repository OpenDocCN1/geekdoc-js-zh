  `Acquire1.pl` 并没有利用 ProScript API 中的所有可用功能，但它实现了允许我自动化现场采集的目的。只要配置正确并为镜像提供足够的外部存储空间，我就可以让脚本运行，从而专注于其他任务。\n\
