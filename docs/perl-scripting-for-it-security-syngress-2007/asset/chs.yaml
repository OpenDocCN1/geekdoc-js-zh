  夏令偏移 => -60 分\n夏令时间名称 => Daylight Time\n## 获取更多信息\n\n\nWindows 管理规范 (WMI) 是从活动 Windows\
  \ 系统获取信息的极佳方法。WMI 实际上只是对访问 Windows API 的许多细节进行了封装并使其更易使用。与其编写代码来访问系统以确定其 Windows\
  \ 版本并根据该版本采取相应措施，不如可以编写一种在 Windows 2000 到 Vista 大多数情况下都能运行的代码。这意味着管理员或事件响应人员可以请求整个企业范围内系统的活动进程列表，无论是在主机上本地运行还是通过集中管理控制台远程运行，并且无论查询的\
  \ Windows 版本如何都能使用相同的代码获取相同的结果。这样做的好处是，在事件响应期间，许多工具在某些系统上的效果优于其他系统，而某些工具根本无法工作。\n\
  WMI 的另一个优势是它为通过 `Win32::API` 和 `Win32::API::Prototype` 模块访问的某些（并非全部）内容提供了一个更简洁、更易使用的界面。例如，你可以获取有关处理器、物理内存、硬盘以及系统中其他设备的信息。\n\
  \n\n`Win32::OLE` 模块提供了一个允许你通过 Perl 访问 `WMI` 类的接口。`WMI` 类提供了对操作系统类的访问，例如提供访问有关文件、进程、驱动程序、网络、操作系统设置等相关信息的类。计算机系统硬件类提供了对系统设备信息的访问，例如处理器、硬盘驱动器、电池、风扇等。\n\
  ### Fw.pl\n虽然 `WMI` 类的优势之一是无论操作系统的版本如何，它们都为 Windows 平台的某些方面提供了通用接口，但它的缺点是某些版本的 Windows\
  \ 具有其他版本不具备的功能。例如，Windows XP Service Pack 2 和 Windows 2003 具有内置的防火墙，它是安全中心的一部分，而\
  \ Windows NT 4.0（WMI 类是作为单独下载程序为 Windows NT 安装）或 Windows 2000 都不具备这一功能。\n```perl\n\
