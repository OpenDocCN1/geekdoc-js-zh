  \    <status name=\"yellow\" value=\"80\" operator=\"equalorless\">\n      <action>email</action>\n\
  \    </status>\n    <status name=\"green\" value=\"80\" operator=\"greater\">\n\
  \      <action>none</action>\n    </status>\n  </monitor>\n  <monitor name=\"sys_netbps\"\
  >\n    <status name=\"red\" value=\"500\" operator=\"equalorgreater\">\n      #\
  \ 172 第三部分 • 使用 Perl 监控 Windows 应用程序\n      <action>email</action>\n      <action>page</action>\n\
  \    </status>\n    <status name=\"yellow\" value=\"300\" operator=\"equalorgreater\"\
  >\n      <action>email</action>\n    </status>\n    <status name=\"green\" value=\"\
  300\" operator=\"less\">\n      <action>none</action>\n    </status>\n  </monitor>\n\
  \  <monitor name=\"sys_netutil\">\n    <status name=\"red\" value=\"90\" operator=\"\
  equalorgreater\">\n      <action>email</action>\n      <action>page</action>\n \
  \   </status>\n    <status name=\"yellow\" value=\"75\" operator=\"equalorgreater\"\
  >\n      <action>email</action>\n    </status>\n    <status name=\"green\" value=\"\
  75\" operator=\"less\">\n      <action>none</action>\n    </status>\n  </monitor>\n\
  </threshold>\n```\n\n\n\n\n\n```xml\n<status name=\"green\" value=\"100\" operator=\"\
  equal\">\n  <action>none</action>\n</status>\n</monitor>\n```\n\n在这个脚本中，我们对远程系统的端口状态进行非常简单的检查。如果此测试成功，我们可以得知两点信息：第一，远程系统是可；其次，它正在我们检查的端口上接受连接请求。如果此测试失败，我们就知道要么远程系统已宕机，要么远程端口没有响应。\n\
  \n脚本本身首先引入了 `thresh.pl` 的需求并使用了 `IO::Socket`。接下来，我们利用 `IO::Socket` 模块创建一个新对象，并传入我们正在监控的远程服务所使用的地址、端口和协议。从那里开始，只需检查是否成功创建了该连接，并根据情况发出告警即可。\n\
  \n你会注意到，对于状态值，我们使用了 `100` 和 `1`。通常情况下，你可能会在此处看到 `0` 和 `1` 状态码，但请记住，在阈值验证脚本中，我们要求传递的值必须整数。由于\
  \ `0` 不是整数，我们必须使用其他值作为状态码。\n\n最后，可能最重要的一点是，我们必须进行清理。如果 `port Check` 对象被定义（表示成功），我们随后必须关闭该端口。你绝对不想因为监控脚本而在远程系统上打开大量端口。通过使用\
  \ `close` 函数我们可以完成此清理。\n\n## 监控可用磁盘空间\n\n另一个经常被忽视的依赖是磁盘空间。在监控应用程序时，即使对于非磁盘密集型应用程序，忘记磁盘空间也是很典型的现象。总会有日志文件写入、临时数据移动以及虚拟内存使用的潜在写入需要考虑。考虑到这一点，我们需要一个脚本来监控可用磁盘空间。\n\
  \n虽然我们可以使用性能监控统计数据来实现，但这种方法可能存在潜在的陷阱。性能监控只有在通过命令行操作显式启用时才会收集磁盘统计数据。\n\n另一种方法是手动检查磁盘信息。虽然这会稍微增加磁盘负载，但它更可靠，并且能在更多情况下提供有用信息。\n\
  \n图 III.24 显示的脚本演示了如何执行此类可用磁盘空间检查。该脚本使用了 `Win32::FileOp` 模块，而该模块又依赖于 `Data::Lazy`、`Win32::AbsPath`\
  \ 和 `Win32::API` 模块。\n\n关于 `Win32::FileOp` 模块的更多信息可以访问 http://search.cpan.org/dist/Win32-FileOp-0.14.1/FileOp.pm。\n\
  \n### 图 III.24 get_disk_space.pl\n\n```perl\nuse strict;\nrequire 'thresh.pl';\n\
  use Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\";\n\n(my $freeSpaceForUser,\
  \ my $totalSize, my $totalFreeSpace)\n= GetDiskFreeSpace $disk;\n\nif ($totalFreeSpace\
  \ != undef and $totalSize != undef) {\n  my $percentFreeSpace = int(100*($totalFreeSpace\
  \ / $totalSize));\n  &threshold_check (\"free_disk_space\", $percentFreeSpace);\n\
  } else {\n  print \"Unable to get disk status!\\n\";\n}\n```\n\n同样，我们还需要对 `thresh.xml`\
  \ 文件进行一些更改以处理这个额外的监控。新的监控 XML 如图 III.25 所示。\n\n### 图 III.25 free_disk_space 监控 XML\n\
  \n```xml\n<monitor name=\"free_disk_space\">\n  <status name=\"red\" value=\"10\"\
  \ operator=\"equalorless\">\n    <action>email</action>\n    <action>page</action>\n\
  \  </status>\n  <status name=\"yellow\" value=\"20\" operator=\"equalorless\">\n\
  \    <action>email</action>\n  </status>\n  <status name=\"green\" value=\"20\"\
  \ operator=\"greater\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
  \n这个简单的脚本快速收集了我们需要的磁盘信息，并将其提供给 `thresh.pl` 脚本处理。首先，我们指定使用 `Win32::FileOp` 模块特别是\
  \ `GetDiskFreeSpace` 函数。该函数从 `$disk` 变量指定的驱动器中提取用户的可用磁盘空间、总磁盘空间和总可用磁盘空间。我们将所有这些数据存储在具有直观名称的变量中以便以后使用。\n\
  \n在通过对适当变量的检查确保我们确实获得了所需数据后，我们可以进行快速的百分比计算。通过将总可用空间除以总磁盘空间并乘以 100，我们就能获得可用空间的百分比。这比在\
  \ `thresh.xml` 文件中指定可用字节数要处理得多。\n\n为了使用此值，我们需要丢弃小数点后的任何数据，可以通过运行 `int` 函数将该值转换为整数来实现。\n\
  \n最后，我们只需调用 `threshold_check` 函数并指定监控项和值。这会获取我们添加到 `thresh.xml` 文件中的数据，并处理与指定阈值相应的的操作。\n\
  \n## 监控远程磁盘可用性\n\n在某些情况下，你可能需要确保远程磁盘是可用且有足够的剩余空间。我们可以使用 `Win32::FileOp` 模块编写一个快速脚本。虽然这与图\
  \ III.24 中的代码相似，但有一些明显的区别。首先，我们预先声明了所有变量，因为我们在脚本中将重复使用。其次，当我们无法获取磁盘空间值时，我们调用 `threshold_check`\
  \ 函数并传递一个硬编码的值 `1`。这会在远程磁盘不可用时产生发送值 `1` 的效果。\n\n### 图 III.26 get_disk_info.pl\n\n\
  ```perl\nuse strict;\nrequire 'thresh.pl';\nuse Win32::FileOp qw(GetDiskFreeSpace);\n\
  \nmy $disk=\"c:\";\nmy $remote_disk=\"z:\";\nmy $remote_share=\"\\\\localhost\"\
  ;\nmy $freeSpaceForUser, my $totalSize, my $totalFreeSpace, my $percentFreeSpace;\n\
  \n($freeSpaceForUser, $totalSize, $totalFreeSpace)\n= GetDiskFreeSpace $disk;\n\n\
  if ($totalFreeSpace != undef and $totalSize != undef) {\n  $percentFreeSpace = int(100*($totalFreeSpace\
  \ / $totalSize));\n  &threshold_check (\"free_disk_space\", $percentFreeSpace);\n\
  } else {\n  print \"Unable to get disk status!\\n\";\n  &threshold_check (\"free_disk_space\"\
  , 1);\n}\n\n($freeSpaceForUser, $totalSize, $totalFreeSpace)\n= GetDiskFreeSpace\
  \ $remote_disk;\n\nif ($totalFreeSpace != undef and $totalSize != undef) {\n  $percentFreeSpace\
  \ = int(100*($totalFreeSpace / $totalSize));\n  &threshold_check (\"free_disk_space\"\
  , $percentFreeSpace);\n} else {\n  print \"Unable to get disk status!\\n\";\n  &threshold_check\
  \ (\"free_disk_space\", 1);\n}\n\n($freeSpaceForUser, $totalSize, $totalFreeSpace)\n\
  = GetDiskFreeSpace $remote_share;\n\nif ($totalFreeSpace != undef and $totalSize\
  \ != undef) {\n  $percentFreeSpace = int(100*($totalFreeSpace / $totalSize));\n\
  \  &threshold_check (\"free_disk_space\", $percentFreeSpace);\n} else {\n  print\
  \ \"Unable to get disk status!\\n\";\n  &threshold_check (\"free_disk_space\", 1);\n\
  }\n```\n\n我们只需要确保在接收到阈值值 `1` 时已经指定了告警，这由于在 XML 中使用的值而已经定义了。\n\n\n\n\n\n你还会注意到，对于所有这些检查，我们都使用了不同的值来指定要检查哪个磁盘，但在阈值检查时使用的是相同的监控器（monitor）。通常情况下，远程磁盘适用的值与本地磁盘相同。如果情况并非如此，你可以针对你正在检查的磁盘定义一个新的特定的监控规格（monitor\
  \ spec）。\n\n在这个脚本中，我们实际上检查了三个磁盘：本地磁盘、映射到本地驱动器的远程磁盘，以及通过共享名称访问的远程磁盘。\n\n这些是你连接到磁盘时最常用的磁盘访问方法类型，且它们都可以由\
  \ `Win32::FileOp` 模块轻松处理。\n\n## 监控远程数据库\n\n当应用达到企业级水平时，通常会将应用程序的表示层与数据层分离。这意味着无论是本地还是远程数据库都被引入了考虑范围。为了监控应用程序的所有依赖项，监控应用程序所使用的数据库变得至关重要。\n\
  \n就此，我们可以简单地复用图 III.22 所示的 `get_port_status.pl` 脚本，但经验表明，虽然可以建立到数据库监听端口连接，但这并不意味着数据库是可用的。这需要比简单的端口连接更复杂的测试。\n\
  \n与其检查端口状态，我们更需要进一步执行实际连接、身份验证，并确认数据库正在返回有效的响应。在本示例中，我们将使用 `DBI` 模块。该模块包含在 ActivePerl\
  \ 安装中，关于该模块的详细信息可以在 http://search.cpan.org/dist/DBI-1.58/ 找到。\n\n虽然还有其他数据库连接模块可用，但这一个提供了极大的灵活性，并且非常适合监控目的。还有许多驱动程序与此模块配合，允许连接到各种类型的数据库。在本示例中，我们将使用\
  \ `DBD::mysql` 模块连接到本地 MySQL 数据库。关于此特定驱动程序的细节可以在 http://search.cpan.org/dist/DBD-mysql-3.0002/\
  \ 找到，并通过 PPM 安装该模块。\n\n图 III.27 所示脚本展示了一个简单的数据库可用性监控过程，它经过了上述的所有步骤，并将结果发送到常用的阈值脚本。此外，图\
  \ III.28 所示的 XML 显示了在 `thresh.xml` 文件中添加这些监控器所需的额外添加内容。\n\n**Figure III.27** `get_db_avail.pl`\n\
  \n```perl\n#get_db_avail.pl\n\nuse strict;\n\nrequire 'thresh.pl';\n\nuse MySQL;\n\
  \nmy $host=\"localhost\";\n\nmy $database=\"new_db\";\n\nmy $user=\"test_user\"\
  ;\n\nmy $password=\"test12\";\n\nmy $DBHandle = Mysql->connect($host, $database,\
  \ $user, $password);\n\nif ($DBHandle == undef) {\n    &threshold_check (\"DB_avail\"\
  , 1);\n} else {\n    &threshold_check (\"DB_avail\", 100);\n}\n\nif ($DBHandle !=\
  \ undef ) {\n    undef $DBHandle;\n}\n```\n\n**Figure III.28** `DB_avail` 器 XML\n\
  \n```xml\n<monitor name=\"DB_avail\">\n  <status name=\"red\" value=\"1\" operator=\"\
  equal\">\n    <action>email</action>\n    <action>page</action>\n  </status>\n \
  \ <status name=\"green\" value=\"100\" operator=\"equal\">\n    <action>none</action>\n\
  \  </status>\n</monitor>\n```\n\n事实上，我们正在使用为 `$host`、`$database`、`$user` 和 `$password`指定的参数连接到\
  \ MySQL 数据库。该数据库连接对象随后存储在 `$DBHandle` 中。与图 III.22 所示的端口检查脚本类似，我们接着检查查看 `$DBHandle`\
  \ 变量是否已定义。如果是，说明我们成功建立了连接并向 `threshold_check` 函数报告“1”。否则，我们报告“100”表示失败。然后我们进行一些清理工作并取消对数据库的连接。所使用的监控器在图\
  \ III.28 所示的 XML 中详细说明。\n\n## 监控其他依赖项\n\n现在我们有了几个监控某些应用程序依赖项的脚本，我们建立了一个监控许多其他依赖项的框架。只需根据需要复用这些脚本并将其转换为你所需的用途即可。例如，假设你想检查以确保所需的某个子进程正在运行。\n\
  \n为此，你只需要复用图 III.19 所示的 `get_system_stats.pl` 脚本中的部分代码。需要检查确保你的系统没有过度分页（paging）吗？那只是另一个性能监控计数器，可以使用相同的脚本进行监控。\n\
  \n在本节这种方式开发这些脚本框架的目的是提供极大的灵活性。通过修改这些脚本以适应你的特定需求，你可以快速地为你的应用程序构建一个健壮的监控系统。通过对脚本进行微调，可以将它们更改为监控你特定应用程序所需的精确内容。\n\
  \n当然，某些应用程序监控需求确实需要更多的复杂性。本章的剩余部分将处理这些复杂的监控需求，并将帮助你将这种基础监控扩展为完整的监控解决方案。\n\n## Web\
  \ 服务\n\nWeb 服务和面向服务的架构 (SOA) 正成为应用程序间交互的常用方法。这增加了另一层复杂性，因为你必须依赖 Web 服务的“黑盒”。\n\n\
  通常，这些 Web 服务不会提供关于其内部操作的大量信息。可以构建并配置不同的监控器来帮助确保远程 Web 服务的可用，我们在这里讨论其中几个。Web 服务基本上是使用标准文档格式的网络接口。\n\
  \n### 监控 Web 服务可用性\n\n监控 Web 服务的第一步是确保服务可用。可以通过两种实现：一种是向你正在使用的 Web 服务发送 SOAP 消息并确认其符合预期；另一种是向专门用于验证可用性的测试\
  \ Web 服务发送 SOAP 消息。在本示例中，我们将使用 `SOAP::Lite` 模块，它包含在 ActivePerl 中或通过 PPM 下载。`SOAP::Lite`\
  \ 的网站提供了关于如何使用该模块的大量信息以及几个测试脚本。这些可以在 http://www.soaplite.com/ 找到。\n\n图 III.29 显示了一个使用\
  \ SOAP 测试 Web 服务可用性的脚本。这是一个快速的连接测试，但也作为测试的一部分发送了有效的 SOAP Web 服务请求。添加此监控器所需的 `thresh.xml`\
  \ 文件相应更改如图 III.30 所示。\n\n**Figure III.29** `get_ws_avail.pl`\n\n```perl\n#get_ws_avail.pl\n\
  \nuse SOAP::Lite;\n\nuse strict;\n\nrequire 'thresh.pl';\n\nmy $soap = SOAP::Lite\n\
  -> uri('http://www.soaplite.com/Temperatures')\n-> proxy('http://services.soaplite.com/temper.cgi');\
  \ my $result = $soap->f2c(61);\n\nunless ($result->fault) {\n    &threshold_check\
  \ (\"WS_avail\", 100);\n} else {\n    &threshold_check (\"WS_avail\", 1);\n}\n```\n\
  \n**Figure III.30** `WS_avail` 监控器 XML（注：此图的 XML 内容未在原文中提供，但遵循之前监控器的模式）。\n\n\n\n\
  \n此脚本与图 III.27 所示数据库可用性监控脚本非常相似。主要区别在于我们连接的是使用 SOAP 的 Web 服务数据源。`$soap` 对象通过向 `SOAP::Lite`\
  \ 传递 URI 和代理参数来创建。有关如何配置这些参数的更多信息可以在上述 URL 中的 `SOAP::Lite` 网上找到，但对于我们的目的，脚本中的值指向托管在\
  \ `soaplite.com` 上的温度转换 Web 服务。\n\n然后我们创建一个 `$result` 变量来存储 Web 服务调的结果，通过赋值此变量的操作，我们接触了\
  \ Web 服务并传递值 `61` 调用了 `f2c` 转换函数。虽然这应该返回一个特定的转换值，但我们目前并不关心该值具体是什么。我们只需要确认返回了一个值即可。\n\
  \n处理返回的结果构成了我们监控的逻辑支持。如果结果不是故障，我们将值 `100` 传递给 `threshold_check` 函数，表示 Web 服务正在响应。然而，如果遇到故障，我们将发送值\
  \ `1`，`threshold_check` 函数将执行我们在 `WS_avail` 监控 XML 中指定的动作。\n\n### 监控 Web 服务功能\n\n\
  更复杂的 Web 服务可能依赖于许多额外的依赖项以返回预期结果。例如，你可能连接到 Oracle Web 服务管理器网关，将你的请求转发到业务过程执行语言（BPEL）服务器，然后到\
  \ Web 服务，该服务从远程数据库中提取数据。这个复杂的事务链最终会向你返回结果，但结果不一定是你所预期的。\n\n由于该链中的任何一步都可能产生错误，完全测试\
  \ Web 服务功能涉及发送一个通过每个步骤并最终返回一个应与验证保持一致的结果的请求。如果遇到错误，它可能会以有效 SOAP 消息的形式呈现，但包含的是错误信息而不是你正在寻找的结果。\n\
  \n为了测试目的，我们假设上次测试中使用的 `f2c` 转换函数实际上是一个必须经过几个步骤才能成功的复杂函数。例如（这完全是虚构的），假设它获取了我们发送的值，连接到\
  \ BPEL 进程将数字转换为字符串，连接到远程数据库进行字符串匹配以找到对应的摄氏度值，通过另一个 BPEL 进程将字符串转换为数字，最后返回我们的结果。该事务链中的任何环节失败都可能导致执行失败，但并不一定会向\
  \ `SOAP::Lite` 产生故障。\n\n### 端到端 Web 服务测试\n\n虽然这里显示的脚本很好地判断了 Web 服务及其所有组件是否正常运行，但它没有提供大量的故障排除信息。正如我们监控应用程序的多个层（系统、网络、数据库等），你应该考虑监控\
  \ Web 服务的多个层，以便在出现问题时加快故障排除。\n\n在不增加系统负载的情况下实现此点的良好方法是先进行验证测试。如果在运行验证测试后测试失败，你就可以运行单独的脚本测试\
  \ Web 服务的每个部分（即：测试 BPEL 进程管理器服务器、Web 服务网关和后端数据源）。这将识别问题位于堆栈的哪个位置，并允许你更快地修复所有问题。\n\
  \n考虑到这些，下一个脚本执行了类似的事务，但提供了一个保证值作为结果。然后对该结果进行验证，如果验证失败，我们就会生成警报。该脚本见图 III.31，对应的\
  \ XML 见图 III.32 中的 `thresh.xml` 文件。\n\n****图 III.31** get_ws_status.pl\n\n```perl\n\
  #get_ws_status.pl\n\nuse SOAP::Lite;\n\nuse strict;\nrequire 'thresh.pl';\n\nmy\
  \ $soap = SOAP::Lite\n-> uri('http://www.soaplite.com/Temperatures')\n-> proxy('http://services.soaplite.com/temper.cgi');\
  \ \nmy $result = $soap->f2c(32);\n\nunless ($result->fault) {\n    if ($result->result()\
  \ != 0) {\n        &threshold_check (\"WS_status\", 1);\n    } else {\n        &threshold_check\
  \ (\"WS_status\", 100);\n    }\n} else {\n    &threshold_check (\"WS_status\", 1);\n\
  }\n```\n\n****图 III.32** WS_status Monitor XML\n\n```xml\n<monitor name=\"WS_status\"\
  >\n  <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
  \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
  \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
  \n### 构建监控系统\n\n在本章中，我们组合了多种可以用于监控应用程序的脚本。然而，为了将其视为一个完整的监控包，我们需要将所有脚本连接在一起。为此，我们将采用这些脚本的最终版本，使用适当参数参数调用，并使用适当的依赖脚本来处理阈值和警报。\n\
  \n我们将组合在一起的脚本如下：\n- `get_system_stats.pl` 见图 III.19\n- `get_process_stats.pl` 使用图\
