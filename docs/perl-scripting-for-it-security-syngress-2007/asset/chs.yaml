  \ `netstat.exe` 替换为你选择的程序，并确保它位于 `PATH` 中）。例如，让我们将以下代码为“netstat2.pl”：\n```perl\n\
  \n\n\n```\n注意，我们使用“a”、“n”和“o”开关启动了 `netstat.exe`，并将命令的输出（无论输出是什么）收集到一个 Perl 列表（或数组）中。从那里，脚本通过简单地打印列表内容来结束。现在，命令的输出不在控制台（`STDOUT`）上；而是我们获得了该输出的控制权，并可以随所欲地对其进行处理。\n\
  **Perl 脚本编程与现场响应 • 第一部分**\n**7**\n大师级 (Master Craftsman)\n### 扩展反引号的使用\n你不仅可以使用反引号来启动系统上的应用程序，甚至是外部（即非系统原生）应用程序和程序，还可以访问原生命令，例如“dir”。dir”在系统中并不作为可执行文件存在，但它是一个可以访问的命令。\n\
  你可以做的其他事情是在数组中包含一个命令列表（例如 `dir /ah`、`netstat –ano` 等），然后遍历列表并逐个运行每个命令。如果你对运行多个命令并关联输出或过滤输出感兴趣，Perl\
  \ 列表让这变得非常简单。\n现在我们已经到了可以让工作变得轻松一点的程度。例如，我可以过滤输出，寻找特定的 Internet 协议（IP）地址，或者跳过包含回环地址（`127.0.0.1`）的行。我可以最小化输出，只显示我想看的内容，而不是显示所有内容。\n\
  我可以过滤数据，只显示处于特定状态的网络连接，例如 `LISTENING`、`TIME_WAIT` 或 `ESTABLISHED`。关键在于，我们现在通过运行我们选择的命令并管理该命令的输出让工作变得更容易。\n\
  ### Netstat3.pl\n`Win32::Job` 模块在创建和运行进程时提供了更细粒度的控制，下方的 `netstat3.pl` 所示。\n```perl\n\
  \n\n\n\n\n\n\n```\n**8**\n**第一部分 • Perl 脚本编程与现场响应**\n当我们运行 `netstat3.pl` 时，我们会得到与从命令行运行\
  \ `netstat –ano` 命令时预期的相同输出；然而，在这种情况下，我们能够使用 `Win32::Job` 模块来执行诸如限制进程运行时间的操作。在 `netstat3.pl`\
  \ 中，我们将时间限制为 60 秒，这是一个很长的时间，而且在大多数情况下可能超过了我们需要的时间。然而，我见过简单的命令行工具（如 `netstat.exe`）在某些系统上运行时会挂起，或者简单地运行需要极长的时间（由于其他进程的高处理开销等）。在这些情况下，我们可能希望限制进程的运行时间，这就是\
  \ `Win32::Job` 发挥用场的地方。\n`Win32::Job` 模块中还有其他可能用的函数，取决于你正在做什么以及你希望实现的进程控制级别。例如，你可以使用\
  \ `spawn()` 函数将 `STDOUT` 和 `STDERR` 消息重定向到日志文件，或者可以使用 `watch()` 函数为进程提供处理器，以实现对进程更细粒度的控制。请查看\
  \ `Win32::Job` 模块的 POD 以及关于运行进程的模块以获取信息。\n### 访问 API\n在执行现场响应或分析从系统检索的文件时，你可能想要访问\
