  \    $name = (split(/\\./,$vals[$i]))[0];\n}\nelse {\n    # 没有路径分隔符，所以文件可能在相同目录下\n\
  \    $name = split(/\\./,$file);\n}\n\nmy $evt;\nif ($evt = ReadEvt::new($file))\
  \ {\n    print “已创建 EVT 对象。\\n”;\n}\nelse {\n    print “未创建 EVT 对象。退出。\\n”;\n  \
  \  exit 1;\n}\n\nmy %hdr = ();\nif (%hdr = $evt->parseHeader()) {\n    # 不需要做任何事情\n\
  \    ...\n    # print “头部已解析...\\n”;\n}\nelse {\n    print “错误：”.$evt->getError().“\\\
  n”;\n    die;\n}\n\n# 设置生成报告；\nmy $total = 0;\nmy %er;\nmy %dates;\nmy $wb = Spreadsheet::WriteExcel->new($outfile);\n\
  my $format = $wb->add_format();\n$format->set_num_format(‘mmm d yyyy hh:mm AM/PM’);\n\
  \n# 添加工作表\nmy $ws = $wb->add_worksheet($name);\nmy $row = 0;\n$ws->write($row, 0,\
  \ “Record Number”);\n$ws->write($row, 1, “Source”);\n$ws->write($row, 2, “ComputerName”);\n\
  $ws->write($row, 3, “Event ID”);\n$ws->write($row, 4, “Event Type”);\n$ws->write($row,\
  \ 5, “Time Generated”);\n$ws->write($row, 6, “User SID”);\n$ws->write($row, 7, “Message”);\n\
  \nmy $ofs = 0;\nwhile ($ofs) {\n    $row++;\n    $ws->write($row, 0, $ofs);\n  \
  \  $ws->write($row, 1, $record{source});\n    $ws->write($row, 2, $record{computername});\n\
  \    $ws->write($row, 3, $record{id});\n    $ws->write($row, 4, $record{type});\n\
  \    $ws->write($row, 5, $record{time_gen});\n    $ws->write($row, 6, $record{sid});\n\
  \    $ws->write($row, 7, $record{message});\n    $ofs = $evt->next();\n}\n\nif ($conf{report})\
  \ {\n    open(RPT,\">>\",reportfile) or die “无法打开 $reportfile: $!\";\n    print\
  \ RPT “Event ID Report\\n”;\n    print RPT $header;\n    print RPT “Event ID\\tCount\\\
  n”;\n    print RPT “----------------------\\n”;\n    foreach my $id (sort keys %er)\
  \ {\n        print RPT \"$id\\t$er{$id}\\n\";\n    }\n    close(RPT);\n}\n```\n\n\
  \n\n\n- `-o output_spreadsheet......要创建的表格文件名`\n- `-r report_file..............报告文件名`\n\
  - `-h.........................帮助（打印此信息） 例：C:\\>evt2xls -e secevent.evt -o secevent.xls`\n\
  \n```\nC:\\>evt2xls -e appevent.evt -o appevent.xls -r app_stats.log copyright 2007\
  \ H. Carvey\n```\n\nEOF\n\n}\n\n### evt2xls.pl\n\n关于 `evt2xls.pl` 需要注意的一点是它使用了一个名为\
  \ `ReadEvt.pm` 的模块（该模块包含在附带的光质中，与 Perl 脚本一起）。我编写这个模块是为了封装解析 Windows 2000、XP 和 2003\
  \ 二进制事件日志（`.evt` 文件）的代码。安装此模块只需将其复制到与 `evt2xls.pl` Perl 脚本相同的目录下。\n\n`evt2xls.pl`\
  \ 还依赖（或“使用”）另外两个模块，…… `Spreadsheet::WriteExcel` 和 `Getopt::Long`。这两个模块都可以通过 ActiveState\
  \ 安装的 Perl 中的 Perl 包管理器 (ppm) 轻松安装，使用以下命令：\n\n```\nC:\\perl>ppm install spreadsheet-writeexcel\n\
  ```\n\n……以及……\n\n```\nC:\\perl>ppm install getopt-long\n```\n\n### 注意\n\n`evt2xls.pl`\
  \ 仅适用于 Windows 2000、XP 和 2003 系统的事件日志。从 Vista 开始，微软更改了事件日志的许多内容，包括文件本身的结构和格式。2007\
  \ 年初，Andreas Schuster 在检查和解析这些文件方面做了大量工作，并提供了（你猜得吧！）一个 Perl 脚本来将 Vista 和 Windows\
  \ 2008 事件日志解析为纯文本。\n\n5 `http://computer.forensikblog.de/en/2007/08/evtx_parser.html`\n\
  \n86\n\n## 第二部分 • Perl 脚本与计算机取证分析\n\n让我们来看一个如何启动 `evt2xls.pl` 并解析 Windows 事件日志文件的示例。为了做到这一点，假设我们已经通过\
  \ USB 将一个外部硬盘连接到我们的分析系统上，并且该硬盘已挂载为 `F:\\`。在该外部硬盘上有一个名为“cases”的目录，其中包含 Windows 系统的安全、应用程序和系统事件日志文件。为了使用\
  \ `evt2xls.pl`，我们需要输入类似所示的命令行：\n\n```\nC:\\perl\\forensics>evt2xls.pl –e f:\\cases\\\
  secevent.evt –o f:\\cases\\secevt.xls –r f:\\cases\\secevt.rpt\n```\n\n`-e` 开关告诉脚本要打开哪个事件日志文件，而\
  \ `-o` 开关给出脚本 Excel 表格的路径和文件名，解析后的事件记录将写入其中。生成的输出文件是一个二进制表格文件，可以轻松地在 Excel 中打开。表格中列出的日期（即事件生成的日期/时间，这是事件记录结构的一部分）已转换为\
  \ Excel 能够理解的格式，允许你根据任何可见列对表格进行排序。最后，`-r` 开关告诉脚本将报告文件写入何处，该文件包含诸如每个事件 ID 在事件日志文件中出现的频率，以及事件记录的时间范围等信息。当表格和报告文件与描述为何生成每个事件记录的源（例如\
  \ `http://www.eventid.net`）相结合时，它们为取证调查员提供了一套强大的分析工具。\n\n瑞士军军刀\n\n### 扩展 evt2xls.pl\n\
  \n对命令行工具不是太熟悉的取证分析师可能会发现 `evt2xls.pl` 使用起来有点繁琐，因为他们需要输入各种选项的路径。扩展脚本使用并使其稍微易用一点的一种方法是只需为表格和报告提供一个输出目录路径。很多时候，当我执行分析时，镜像本身位于外部硬盘上，我可能不想将报告存储在那个位置。其他时候，我会在\
  \ CD 或 DVD 上接收到事件日志文件，这使得无法向同一目录写入新数据。\n\n另一个可能使此脚本更易用的修改是添加一个带有各种功能选择按钮的 GUI（图形用户界面），例如存储输出和报告的位置。\n\
  \n大师级\n\nPerl 脚本与计算机取证分析 • 第二部分 87\n\n### 解析事件日志\n\n在同一个脚本中不仅解析 Windows 2000、XP\
  \ 和 2003 事件日志，还解析 Windows Vista/2008 事件日志的项目，可以通过将 `evt2xls.pl` 与 Andreas Schuster\
  \ 通过其博客提供的代码结合。事实上，知道 Windows 2000、XP 和 2003 事件日志的“魔数”将允许你从二进制模式“查看”事件日志文件开始，如果你没有找到该“魔数”，就可以假设该文件来自\
  \ Windows Vista 或 2008 系统，并切换到相应的代码。\n\n### 解析内存转储\n\n在事件响应活动期间，响应者可能会选择从 Windows\
  \ 系统中转储物理内存（RAM）的内容。这样做是为了保留物理内存的内容以备日后使用和检查，正如 Aaron Walters 和 Nick Petroni 在他们的\
  \ Black Hat DC 2007 演讲中所说，以便稍后回答新问题。在某些情况下，调查人员会对结果文件运行 `strings` 或使用正则表达式（regex）来定位\
  \ IP 地址。然而，这些简单的搜索在分析内存转储时可以从内存提取活跃进程列表。`http://www.blackhat.com/media-archives/`\n\
  \n88\n\n第二部分 • Perl 脚本与计算机取证分析\n\n`lsproc.pl` 是我编写的一个用于解析 Windows 2000、XP 和 2003\
  \ RAM 转储的 Perl 脚本。它基于 Andreas Schuster 发布在其博客上的原始脚本。\n\n```\n#!usr/bin/perl\n#----------------------------------------------\n\
  # copyright 2007 H. Carvey\n# lsproc.pl - 解析 Windows 2000 RAM dump\n# Usage: lsproc\
  \ <path_to_dump>\n#----------------------------------------------\n\nuse strict;\n\
  \nmy $file = shift || die “必须输入文件名。\\n”;\ndie “未找到 $file\\n” unless (-e $file);\n\
  \nopen(FH,\"<\",$file) || die “无法打开 $file : $!\\n”;\nbinmode(FH);\n\nmy $offset\
  \ = 0;\nprintf “%-4s %-6s %-6s %-20s %-10s %-20s\\n”,“类型\",\"PPID\",\"PID\",\"名称\"\
  ,\"偏移\",\"创建时间”;\nprintf “-” x 4,\"-\" x 4,\"-\" x 3,\"-\" x 4,\"-\" x 6,\"-\" x\
  \ 13;\n\nwhile (! eof(FH)) {\n    seek(FH,$offset,0);\n    read(FH,$record,4);\n\
  \    my ($type,$size) = unpack(“CxCx”,$record);\n    if ($size == 0x1b && $type\
  \ == 0x03) {\n        my $hdr = unpack(“V”,$record);\n        if ($hdr == 0x001b0003)\
  \ {\n            printf “可能的 EPROCESS 块位于偏移 0x%08x\\n”,$offset;\n            my\
  \ $data;\n            seek(FH,$offset,0);\n            my $bytes = read(FH,$data,0x290);\n\
  \            if (0x290 == $bytes) {\n                if (my %proc = isProcess($data))\
  \ {\n                    my $name;\n                    my $proctime;\n        \
  \            ($proc{createtime} == 0) ? ($proctime = \"\") : ($proctime = gmtime($proc{createtime})\
  \ );\n                    ($proc{exitprocesscalled} == 1) ? ($name = $proc{name}.“(x)”)\
  \ : ($name = $proc{name});\n                    printf “%-4s %-6d %-6d %-20s 0x%08x\
  \ %-10s %-20s\\n”,“Proc”,$proc{ppid},$proc{pid},\n                    $name,$offset,\
  \ $proctime;\n                }\n                $offset += 0x290;\n           \
  \ }\n        }\n    }\n}\n```\n*(注：最后的代码块在源代码文本中高度碎片化/不完整由于布局断开；我已根据周围上下文重构了一个功能性的表示。)*\n\
  \n\n\n\n\n```perl\nelse {\n    $offset += 4;\n}\n}\nelse {\n    # #\n    print “Too\
  \ few bytes read.\\n”;\n    # exit\n    1;\n}\nelsif ($type == 0x06 && $size ==\
  \ 0x6c) {\n    # elsif ($hdr == 0x006c0006) {\n    # 可能找到了 ETHREAD\n    my $data;\n\
  \    seek(FH,$offset,0);\n    my $bytes = read(FH,$data,0x244);\n    if ($bytes\
  \ == 0x244) {\n        if (my %thread = isThread($data)) {\n            $offset\
  \ += 0x244;\n        }\n        else {\n            $offset += 4;\n        }\n \
  \   }\n}\nelse {\n    90\n    # 第二部分 • Perl 脚本与计算机取证分析\n    # 将偏移量增加 4 字节，即一个 DWORD\n\
  \    $offset += 4;\n}\n}\nclose(FH);\n```\n\n#--------------------------------------------------------------\n\
  # isProcess()\n# 检查是否有一个有效的进程 (Win2K SP4)\n# 输入：从偏移量开始的 652 字节\n# 输出：包含 EPROCESS\
  \ 块信息的哈希，如果不是有效的\n# EPROCESS 块则返回 undef\n#--------------------------------------------------------------\n\
