  \ • Perl 脚本与实时响应\n\n## 访问注册表\n\n在事件响应期间，甚至在执行简单的故障排除任务时，你可能想要查询注册表以获取特定信息，例如检查特定键或值是否存在、获取值的数据，或确定注册表键的\
  \ `LastWrite`（最后写入时间）。此外，当系统关闭时，注册表中的某些部分或“配置单元 (hives)”是无法访问的。例如，`HKEY_CURRENT_USER`\
  \ 配置单元仅对登录用户可访问；当系统关闭时，该配置单元将不再可用。\n\n在其他情况下，你从注册表中收集的信息可能会影响你的后续调查。例如，`pagefile`（页面文件）在正常关闭期间会被清除吗？是否禁用了最后访问时间的更新？很多时候，提前了解这些（以及其他信息）可以为我们以后节省时间，甚至完全改变我们的后续步骤。\n\
  \n## Bho.pl\n\n浏览器帮助对象 (BHOs)10 本质上是动态链接库 (`DLL`) 文件，用于为 Internet Explorer (IE)\
  \ 浏览器添加功能。一个流行的 BHO 来自 Adobe，它允许直接在 Web 浏览器中打开 PDF 文件进行查看。然而，恶意软件作者（主要是间谍软件）有时会创建安装为\
  \ BHO 的恶意软件，因为当用户每次运行 IE 时，他们的恶意软件都会自动启动。恶意软件作者一直在寻找新方法以便在无需任何用户交互的情况下运行他们的工具，而安装为\
  \ BHO 只是其中一种。\n\n`Bho.pl` 的内容所示：\n\n```\n#! c:\\perl\\bin\\perl.exe\n\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  ### BHO.pl\n\n### Perl 脚本，用于从本地系统获取已安装 BHO 的列表\n#\n# 使用方法:\n# C:\\Perl>bho.pl [>bholist.txt]\n\
  #\n# 版权 2006–2007 H. Carvey, keydet89@yahoo.com\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  10 http://en.wikipedia.org/wiki/Browser_Helper_Object\n```\n\n**Perl 脚本与实时响应 • 第一部分**\n\
  \n**37**\n\n```\nuse strict;\nuse Win32::TieRegistry(Delimiter=>“/”);\nmy $server\
  \ = Win32::NodeName();\nmy $err;\nmy %bhos;\nmy $remote;\n\n# 获取浏览器帮助对象\nif ($remote\
  \ = $Registry->{//$server/LMachine”}) {\n    my $ie_bho = “SOFTWARE/Microsoft/Windows/CurrentVersion/Explorer/Browser\
  \ Helper Objects”;\n    if (my $bho = $remote->{$ie_bho}) {\n        my @keys =\
  \ $bho->SubKeyNames();\n        foreach (@keys) {\n            $bhos{$_} = 1;\n\
  \        }\n    }\n    else {\n        $err = Win32::FormatMessage Win32::GetLastError();\n\
  \        print “Error connecting to $ie_bho: $err\\n”;\n    }\n}\nelse {\n    $err\
  \ = Win32::FormatMessage Win32::GetLastError();\n    print “Error connecting to\
  \ Registry: $err\\n\";\n}\nundef $remote;\n\n# 找出每个对象是什么\nif ($remote = $Registry->{//$server/LMachine”})\
  \ {\n    my $ie_bho = “SOFTWARE/Microsoft/Windows/CurrentVersion/Explorer/Browser\
  \ Helper Objects”;\n    if (my $bho = $remote->{$ie_bho}) {\n        my @keys =\
  \ $bho->SubKeyNames();\n        foreach (@keys) {\n            $bhos{$_} = 1;\n\
  \        }\n    }\n    else {\n        $err = Win32::FormatMessage Win32::GetLastError();\n\
  \        print “Error connecting to $ie_bho: $err\\n”;\n    }\n}\n}\n```\n\n\n\n\
  \n\n# 图 I.7 运行中的 Didier Stevens UserAssist 工具\n\n如你所见，Didier 的工具不仅“解密”了值名称，还解析了每个值的二进制数据。这正是\
  \ `UserAssist` 键的取证价值所在。当一个值的数据长度恰好为 16 字节时，第二个 DWORD（4 字节）值持有“运行计数”，该计数从 5 开始递增。最后两个\
  \ DWORD（8 字节，或一个 QWORD）组成一个 `FILETIME` 对象；即自 1601 年 1 月 1 日以来的 100 纳秒增量数。该值告诉我们以\
  \ UTC 时间，用户最后一次执行相关操作（如启动可执行文件等）的时间。\n\nPerl 脚本 `uassist.pl` 执行的功能与 Didier 的 UserAssist\
  \ 工具非常相似：\n\n```perl\n#! c:\\perl\\bin\\perl.exe\n\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  ### uassist.pl\n### 解析 UserAssist 键，并从 ROT-13 加密进行翻译\n#\n# 使用: C:\\perl>[perl] uassist.pl\
  \ [> uassist.log]\n#\n# Copyright 2007 H. Carvey keydet89@yahoo.com\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  use strict;\nuse Win32::TieRegistry(Delimiter=>\"/\");\n\nmy @month = qw/Jan Feb\
  \ Mar Apr May Jun Jul Aug Sep Oct Nov Dec/;\nmy @day = qw/Sun Mon Tue Wed Thu Fri\
  \ Sat/;\n\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  # _main\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  getKeyValues();\n\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  # 获取键值\nsub getKeyValues {\n    my $reg;\n    my $userassist = \"SOFTWARE/Microsoft/Windows/CurrentVersion/Explorer/UserAssist\"\
  ; \n    my $subkey1 = \"{5E6AB780-7743-11CF-A12B-00AA004AE837}/Count\"; \n    my\
  \ $subkey2 = \"{75048700-EF1F-11D0-9888-006097DEACF9}/Count\"; \n    \n    if ($reg\
  \ = $Registry->Open(\"CUser\",{Access=>KEY_READ})) {\n        if (my $ua = $reg->Open($userassist,{Access=>KEY_READ}))\
  \ {\n                if (my $key1 = $ua->Open($subkey1,{Access=>KEY_READ})) {\n\
  \                    my @valuenames = $key1->ValueNames();\n                   \
  \ print \"[$subkey1 - $lastwrite]\\n\";\n                    foreach my $value (@valuenames)\
  \ {\n                        my $vData = $key1->GetValue($value);\n            \
  \            $value =~ tr/N-ZA-Mn-za-m/A-Za-z/;\n                        print $value.\"\
  \\n\";\n                    }\n                } else {\n                    print\
  \ \"Error accessing $subkey1: $! \\n\";\n                }\n                print\
  \ \"\\n\";\n                if (my $key2 = $ua->Open($subkey2,{Access=>KEY_READ}))\
  \ {\n                    my @valuenames = $key2->ValueNames();\n               \
  \     print \"[$subkey2 - $lastwrite]\\n\";\n                    foreach my $value\
  \ (@valuenames) {\n                        my (@data,$lastrun, $runcount);\n   \
  \                     my $vData = $key2->GetValue($value);\n                   \
  \     $value =~ tr/N-ZA-Mn-za-m/A-Za-z/;\n                        if (length($vData)\
  \ == 16) {\n                            @data = unpack(\"V*\",$vData);\n       \
  \                     ($data[1] > 5) ? ($runcount = $data[1] - 5) : ($runcount =\
  \ $data[1]);\n                            $lastrun = getTime($data[2],$data[3]);\n\
  \                            print $value.\"\\n\";\n                           \
  \ if ($lastrun == 0) {\n                                next;\n                \
  \            } else {\n                                print \"\\t\".localtime($lastrun).\"\
  \ –– ($runcount)\\n\";\n                            }\n                        }\
  \ else {\n                            print $value.\"\\n\";\n                  \
  \      }\n                        print \"\\n\";\n                    }\n      \
  \          } else {\n                    print \"Error accessing $subkey2: $! \\\
  n\";\n                }\n        } else {\n            die \"Error connecting to\
  \ $userassist key: $!\\n\";\n        }\n    } else {\n        die \"Error connecting\
  \ to HKEY_CURRENT_USER hive: $!\\n\";\n    }\n}\n\n# getTime()\n# 从 FILETIME 对象获取\
  \ Unix 风格的日期/时间\n# 输入 : 8 字节 FILETIME 对象\n# 输出: Unix 风格的日期/时间\nsub getTime {\n \
  \   my $lo = shift;\n    my $hi = shift;\n    my $t;\n    if ($lo == 0 && $hi ==\
  \ 0) {\n        $t = 0;\n    } else {\n        $lo -= 0xd53e000;\n        $hi -=\
  \ 0x019dbde;\n        $t = int($hi*4294967296 + $lo/1e7);\n    };\n    $t = 0 if\
  \ ($t > 0);\n    return $t;\n}\n```\n\n## 瑞士军刀分析\n\n### 时间值排序\n`uassist.pl` 脚本可以更新为不仅显示其数据中包含\
  \ `FILETIME` 对象的值，还可以按最新值从先后的顺序排序这些值。在 Perl 文档的 `perldsc` 下，可以查看关于“列表哈希”（hash-of-lists）的描述。你会发现在\
  \ `uassist.pl` 脚本中，`getTime()` 函数获取 `FILETIME` 对象的 8 字节并返回 Unix 时间值，然后必须通过 `gmtime()`\
  \ 函数将其转换为人类可识别的日期。\n\n### ProScripts\n来自 Technology Pathways 的取证分析工具 `ProDiscover`\
  \ 使用 Perl 作为其脚本语言。这允许调查人员自动化他们将执行的各种任务，使其能够从脚本运行，而不是通过图形用户界面（GUI）进行交互。\n\n### Acquire1.pl\n\
  利用 `ProDiscover` 附带的 `ProScript` API 手册以及示例脚本，我编写了一个 `ProScript`，它可以连接到已安装并运行 `ProDiscover\
  \ PDServer` 的系统列表，并从每个系统获取第一个硬盘（即 `PhysicalDisk0`）的镜像。为了方便起见，连接的系统列表维护在本地的一个文本文件中。\n\
  \n```perl\n#! c:\\perl\\bin\\perl.exe\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  ### Acquire1.pl\n#\n# 连接到特定系统上的 PDServer\n# 并获取 PhysicalDisk0 的镜像\n#\n### 镜像以 dd\
  \ 格式创建\n#\n# 会创建一个包含镜像文件 MD5 校验和的文件，以及一个 IOErrorLog 文件\n#\n# 作者: Harlan Carvey,\
  \ keydet89@yahoo.com\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  ```\n\n\n\n\n\nmy $input_file = \"c:\\\\prodiscover\\\\proscript\\\\hosts.txt\"\
  ; my $output_dir = \"d:\\\\cases\\\\images\\\\\";\n\nmy $logfile = $output_dir.\"\
  capturelog\\.txt\";\n\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  # 从输入文件中加载 IP 地址\n#––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––\n\
  \n```perl\nmy %ips = ();\n\nopen(FH,\">\",$input_file);\n\nwhile(>FH>) {\n  chomp;\n\
  \  next if ($_ =~ m/^#/);\n\n  $ips{$_} = 1;\n}\n\nclose(FH);\n```\n\nlogData(\"\
  打开日志文件: \".localtime(time));\n\n\\logData(\"需要镜像的系统:\");\n\nforeach my $ip (keys\
  \ %ips) {\n  \\logData(\"\\t$ip\");\n}\n\n\\logData(\"\");\n```\n\n**46**\n## 第一部分\
  \ • Perl 脚本编写与现场响应\n\n```perl\nforeach my $ip (keys %ips) {\n  # 连接到系统\n  PSDisplayText(\"\
  正在连接到 $ip . . . \");\n  my $conn = PSConnect($ip, \"password\");\n\n  # 如果已连接，则通知\n\
  \  if ($conn == 1) {\n    PSDisplayText(\"连接成功!\");\n    \\logData(\"[\".localtime(time).\"\
  ]已连接到 $ip\");\n\n    # 获取镜像\n    my $source = \"\\\\$ip\\\\PhysicalDrive0\";\n \
  \   my $dest = $output_dir.$ip.\"\\.img\";\n    \\logData(\"[\".localtime(time).\"\
  ]正在将 $source 镜像到 $dest\");\n    PSDisplayText(\"源驱动器 ->\".$source);\n    PSDisplayText(\"\
  目标文件 ->\".$dest);\n\n    my $img = PSCreateImage($source,$dest,FALSE);\n    \\logData(\"\
  [\".localtime(time).\"]已创建镜像句柄 (.$img.)\n    if (PSStartCapture($img)) {\n     \
  \ \\logData(\"[\".localtime(time).\"]正在采集镜像\");\n      PSDisplayText(\"镜像已采集。\"\
  );\n      PSCloseHandle($img);\n      PSReleaseRemoteAgent($ip);\n      PSDisconnect();\n\
  \      \\logData(\"[\".localtime(time).\"]镜像采集完成；$ip 代理已释放并断开连接\");\n      \\logData(\"\
  \");\n    }\n    else {\n      PSDisplayText(\"在 $ip 上未启动镜像采集\");\n      \\logData(\"\
  [\".localtime(time).\"].ip 未启动镜像采集\");\n    }\n  }\n  else {\n    PSDisplayText(\"\
  无法连接到 $ip\");\n    \\logData(\"[\".localtime(time).\"]无法连接到 $ip\");\n  }\n}\n```\n\
