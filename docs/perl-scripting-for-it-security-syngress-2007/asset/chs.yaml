  \ 将解析 ProDiscover 项目中每个用户配置的每个 `NTUSER.DAT` 文件，并显示所有条目，随后按时间反序排序显示条目，如图 II.5 所示。\n\
  \n**图 II.5** `uassist.pl` ProScript 的输出\n\n由于 `uassist.pl` 会自动解析系统上所有本地用户（在获取的系统镜像内）的所有\
  \ `NTUSER.DAT` 文件，显示的输出可能会非常多。该版本的脚本适用于用户数量较少的系统，但随着用户数量的增加，你可能希望从镜像中提取特定的 `NTUSER.DAT`\
  \ 文件，并使用本部分之前列出的 `uassist.pl` Perl 脚本进行解析。\n\n## SysRestore.pl\n\n在对 Windows XP\
  \ 系统进行取证分析时，我发现非常有用的一个方面是系统还原点中维护的信息。10。\n\n10 http://technet.microsoft.com/en-us/library/bb490854.aspx\n\
  \n## Perl 脚本编写与计算机取证分析 • 第二部分 111\n\n系统还原点允许用户“撤销”软件安装，并将系统状态恢复到之前的某个时间（例如，3 天前），那时系统已知运行正常。虽然这对于用户非常有用，但对取证人员来说也极其有用。\n\
  \n还原点更有价值的方面之一是，只要磁盘空间可用，Windows XP 就会每 24 小时创建一个还原点，并在软件安装或卸载时也会创建。知此此，取证人员可以解析每个还原点，从\
  \ `rp.log` 文件中提取有关还原点的信息。\n\n`sysrestore.pl` ProScript 允许你通过 ProDiscover 界面快速方便地完成此操作。\n\
  \n```perl\n#! c:\\perl\\bin\\perl.exe\n\n#----------------------------------------------------------------\n\
