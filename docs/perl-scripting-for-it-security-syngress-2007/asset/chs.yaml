  \ $t;\n}\n```\n\n\n\n\n\n## 第二部分 • Perl 脚本与计算机取证分析\n\n## 事件日志\n\n许多情况下，通过检查 Windows\
  \ 事件日志（Event Log）事件记录，可以提供一些可能影响你调查非常有用的信息。事件日志能够存储极其惊人的信息范围，从系统登录的失败尝试记录到系统关机和重启记录应有。在在机系统上处理事件日志时，大多数人会通过\
  \ `EventViewer`（事件查看器）与其交互。取证分析师在调查期间可能用于分析事件日志的技巧之一，是从镜像中提取该文件，然后尝试在自己分析系统的 `Event\
  \ Viewer` 中打开该日志。然而，这种方法并不总是有效……许多分析师报告说收到一个错误消息，提示事件日志已“损坏”。此消息是由 Windows API 报告的——那么，如果我们能像处理\
  \ `Registry`（注册表）那样的，在不使用 API 的情况下解析事件日志文件的内容会怎样？\n\n## Evt2xls.pl\n\n`Evt2xls.pl`\
  \ 是我随时间推移开发的 Perl 脚本，我发现它非常有用。我开始于一个简单的脚本，它以二进制模式解析 `.evt` 文件，并检索事件记录，将其写入控制台。\n\
  \n随着时间的推移，这变得有些繁琐，因为我想用该脚本做更多事情，所以我写了一个模块来封装并隐藏我一直一直在编写的例程。从那里开始，我可以将输出作为逗号分隔的值发送到控制台，然后将输出重定向到文件，最后在\
  \ Excel 中打开该文件。然而，日期格式从未正确过，有时消息中会包含逗号……这两点都干扰了我的分析。因此，我添加了一些代码，将事件记录条目直接写入到与 MS\
  \ Excel 二进制兼容的表格中（通过 `Spreadsheet::WriteExcel` 模块），并添加了一些代码来对事件 ID 进行频率分析。\n\n`Evt2xls.pl`\
  \ 如下所示（可在随附的 DVD 中获取）：\n\n```perl\n#! c:\\perl\\bin\\perl.exe\n\n#--------------------------------------------------------------\n\
  \n# evt2xls.pl, 版本 20070611\n# 以二进制格式解析 Windows 2000, XP, 2003 EventLog fi les，\n\
