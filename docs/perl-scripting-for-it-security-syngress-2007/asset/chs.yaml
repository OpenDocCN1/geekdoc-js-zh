  \ 值 $sysinfo =$infoinfo =\n\n\n\n\n如图 II.7 所示，从应用程序预取文件（prefetch files）中可以获取大量的有用信息。然而，取证人员应该记住，Windows\
  \ XP 的预取功能适用于系统上的所有用户；为了将特定应用程序的运行与某个用户关联起来，需要采用额外的分析手段（在本部分已讨论过）。\n\n# 第二部分 • Perl\
  \ 脚本编写与计算机取证分析 注意\n\nWindows Vista 同样维护预取文件。然而，Vista 预取文件中维护的特定元数据的偏移量（offsets）与其有所不同。\n\
  \n`Prefetch.pl` ProScript 仅用于 Windows XP。\n\n## 瑞士军军刀\n\n### 将 ProScript 输出写入文件\n\
  有时，尝试在 ProScript 显示窗口中查看大量信息可能会非常繁琐。由于 ProScript 本质上是 Perl 脚本，因此可以添加代码将 ProScript\
  \ 的输出写入文件，或者作为替代将其直接发送到显示窗口。\n\n### 解析其他数据\n除了 Windows 系统上的日志文件和二进制数据外，还有许多其他数据可以以多种有用方式进行解析。例如，Visa\
  \ 支付卡行业（PCI）数据安全标准（DSS）不仅要求在数据被泄露时通知个人，还要求在发生违规时通知 PCI 委员会。PCI 取证审计的目标是确定是否确实发生了违规，以及信用卡数据是否存在于受影响的系统中并可能已泄露。\n\
  \n因此，通常的情况是，对某些系统进行取证获取，并对镜像进行分析以寻找入侵迹，同时搜索信用卡号。诸如 `EnCase` 等取证分析工具提供了用户使用正则表达式搜索定义信用卡号搜索的能力，或者让分析人员使用已编写的脚本来执行搜索。\n\
  \n例如，在 `EnCase Forensic Edition` 版本 5 中，包含了一个信用卡查找器（Credit Card Finder）模块，该模块包含在\
  \ Sweep Case EnScript 中（EnScripts 是 `EnCase` 中用户定义的脚本组件）。无论分析人员是只搜索信用卡号，还是对轨道 1\
  \ 或轨道 2 数据进行更广泛的搜索（同样，这些这些是维护在信用卡本身磁条上的信息），当搜索返回数百或数千（甚至数万）次命中结果时，她不不应该感到惊讶。\n\n\
  信用卡号的格式非常简单；通常长度为 13 到 16 位（某些欧洲卡可能有 18 位或 19 位），并以特定的数字序列开头，称为银行识别码（Bank Identification\
  \ Number），或 `BIN`。这种通用的描述可以在几乎任何计算机系统中返回并将会返回数千次命中，因此我们必须考虑信用卡号的另一个维度。\n\n为了成为有效的信用卡号，该数字必须成功通过\
  \ `Luhn Formula`（卢恩算法）的检查。`Luhn Formula`（或算法）是一种模 10 校验和，用于验证信用卡号。这不是用于安全目的的加密哈希函数，而是用于验证的校验和。执行卢恩算法验证的代码看起来如下：\n\
  \n```\nsub luhn {\n    my $num = shift;\n    my $len = length($num);\n    my @n;\n\
  \    foreach (0..($len - 1)) {\n        push(@n,substr($num,$_,1));\n    }\n   \
  \ my @m = reverse @n;\n    my @r;\n    foreach my $i (0..($len - 1)) {\n       \
  \ if (($i % 2) == 0) {\n            $r[$i] = $m[$i];\n        } else {\n       \
  \     my $x = $m[$i] * 2;\n            ($x > 9) ? ($r[$i] = $x - 9) : ($r[$i] =\
  \ $x);\n        }\n    }\n    my $sum;\n    foreach my $i (0..($len - 1)) {\n  \
  \      $sum += $r[$i];\n    }\n    my $v = $sum % 10;\n    ($v == 0) ? (return 1)\
  \ : (return 0);\n}\n```\n\n`luhn()` 函数接受信用卡号作为参数并对其进行处理，验证其是否为有效的信用卡号。如果数字是有效的信用卡号，该函数返回\
  \ 1，否则返回 0。你会发现，该函数没有对数字长度进行任何检查，也没有验证信用卡号的 `BIN`。`EnCase` 的 EnScript 功能包含一个名为 `IsValidCreditCard()`\
  \ 的内置字符串函数可以执行这些检查。在解析 `EnCase` 搜索信用卡号时返回的命中结果时，我倾向于也使用 `luhn()` 代码作为额外的验证。\n\n\
  用于验证或确定信用卡号类型或 `BIN` 的 Perl 代码可能看起来如下：\n\n```\nsub getType {\n    my $cc = shift;\n\
  \    my $len = length($cc);\n    return undef if ($len > 19);\n    my $type;\n \
  \   if ($len == 16) {\n        if ($cc =~ /∧4/) {\n            $type = \"Visa\"\
  ;\n        } elsif ($cc =~ /∧51|52|53|55/) {\n            $type = \"MasterCard\"\
  ;\n        } elsif ($cc =~ /∧6011/) {\n            $type = \"Discover\";\n     \
  \   } else {\n            $type = \"Unknown\";\n        }\n    } elsif ($len ==\
  \ 15) {\n        $type = \"AmEx\" if ($cc =~ /∧34|37/);\n    } elsif ($len == 14)\
  \ {\n        $type = \"Diners\" if ($cc =~ /∧36|38/);\n    } elsif ($len == 13)\
  \ {\n        $type = \"Visa\" if ($cc =~ /∧4/);\n    } else {\n        $type = \"\
  Unknown\";\n    }\n    print \"$cc is $len digits long.\\n\";\n}\n```\n\n你可以所示，与\
  \ `luhn()` 函数一样，`getType()` 函数接受信用卡号作为参数。该函数检查信用卡号的长度和 `BIN`，并返回类型（例如：Visa、MasterCard\
  \ 等）或 \"Unknown\"。这使得根据类型（或 `BIN`）对信用卡号进行排序变得相当简单。\n\n轨道数据有所不同，因为它包含了信用卡号（又称为主账户号码或\
  \ `PAN`）。轨道 1 数据具有以下格式（请注意这是一个非常简单的概述）：\n\n`B{PAN}∧{Name}∧{Other data}`\n\n轨道 1\
  \ 数据以格式代码 `B` 开始，随后是 `PAN` 和 `∧` 分隔符。名称字段长度为 19，由 ASCII 字符组成；随后是另一个 `∧` 分隔符，以及 18\
  \ 位数据，其中前四位应该是卡的有效期。如果你正在解析一个每行包含一个轨道 1 数据命中结果的文本文件，可以使用如下 Perl 代码进行解析（标量 `$file`\
  \ 是存储数据的文件名）：\n\n```\nmy %cc_nums;\nopen(FH,\"<\",$file) || die \"Could not open\
  \ $file: $!\\n\";\nwhile(<FH>) {\n    chomp;\n    next unless ($_ =~ /∧B/);\n  \
  \  my ($pan,$name,$rest) = split(/\\x5e/,_,3);\n    $pan =~ s/[∧0–9]//g;\n    my\
  \ $expiry = substr($rest,0,4);\n    $cc_nums = join(':',$pan,$name,$expiry);\n \
  \   $cc_nums{$cc_nums} = 1;\n    printf \"%-20s %-20s %-4s\\n\",$pan,$name,$expiry;\n\
  }\nclose(FH);\n```\n\n\n\n这段代码段完成的第一件事是为我们的文件创建一个文件句柄（或“$file”），并以只读模式打开文件。如果由于某种原因无法打开文件，代码将\
  \ `die()` 并抛出一个错误信息（希望如此），告诉我们为什么无法打开文件。从那里开始，我们逐行读取文件，并使用 `chomp()` 去掉行尾的回车符。如果该行不是以“B”开头（记住，这是轨道\
  \ 1 的数据），那么我们就跳过该行。接着，我们根据“∧”分隔符（其十六进制表示为 `\\x5e`）将行拆分为各个组件。然后我们从 `PAN` 中删除所有非数字字符（0\
  \ 到 9 之间的字符，其中可能空格或连字符），然后从第三段的剩余数据中提取过期日期（即前四个字符）。\n\n# 瑞士军刀\n\n## 有效的过期日期\n\n\
  从轨道 1（以及轨道 2）数据中提取的过期日期由 `MMYY` 格式的四位数字组成。我把这个任务留给你（读者）练习，让你编写代码来验证过期日期。\n\n最后，上述代码完成的最后一件事是使用\
  \ `printf()` 函数以固定长度格式打印解析出的数据。然而，还有一点我想指出，就是如下这行代码：`$cc_nums{$stuff} = 1;`。\n\n\
  这一行的目的是去重。很多时候当搜索函数遍历文件（或获取的镜像）时，搜索可能会返回同一个信用卡号码的多个实例。可能是由于多种原因：\n\n### Perl 脚本编程与计算机取证分析\
  \ • 第二部分 127\n\n同时找到了轨道 1 和 2 的数据、`PAN` 存在于多个文件或数据库的多个表中等。无论原因何，你都不希望去跟踪 10 份相同的\
  \ `PAN`。去重并保证唯一性的简单简单方法是创建一个 Perl 哈希表，其中哈希的键是我们提取的数据（`PAN`，或者在我们的代码中，是 `PAN`、名称和过期日期，用冒号分隔），并将该键的值设置为\
  \ 1（实际上，这可以是任何值）。\n\n#### 注意\n\nDavid Schultze 在 1999 年我们都在同一家公司工作时，向我分享了这种确保数据集唯一性的技术。David\
  \ 当向我分享了几个非常棒的编程技巧，这就是其中之一。我喜欢把功劳归于事实……感谢，David！\n\n另一方面，轨道 2 数据具有以下格式：\n\n`{PAN}={Other\
  \ data}`\n\n轨道 2 数据以 `PAN`（13–16 位数字）开头，后面是一个 \"=\" 分隔符，然后是多达 18 额外数据，其中前四位（再次）应该是信用卡的过期日期。解析包含轨道\
  \ 2 数据搜索结果的平面 ASCII 文本文件的 Perl 代码类似于下面的代码：\n\n```perl\nmy %cc_nums;\n\nopen(FH,\"\
  <\",$file) || die “Could not open $file: $!\\n”;\n\nwhile(<FH>) {\n    chomp;\n\
  \    my ($pan,$rest) = split(/=/,$_,2);\n    $pan =~ s/[∧0–9]//g;\n    my $expiry\
  \ = substr($rest,0,4);\n    my $stuff = join(‘:’,$pan,$expiry);\n    $cc_nums{$stuff}\
  \ = 1;\n}\n\nclose(FH);\n```\n\n这段代码与解析轨道 1 数据的代码有许多相似之处，因此我不再重复介绍一遍。\n\n## 128\
  \ 第二部分 • Perl 脚本编程与计算机取证分析 Cc-sort.pl\n\n让我们来看使用 Perl 函数 `getType()` 和 `luhn()`\
  \ 的示例。\n\n```perl\nuse strict;\n\nmy $file = shift || die “You must enter a filename.\\\
  n”;\n\ndie “Could not find $file.\\n” unless (-e $file);\n\nopen(FH,\"<\",$file)\
  \ || die “Could not open $file: $!\\n”; \nwhile(<FH>) {\n    chomp;\n    isValid($_);\n\
  }\nclose(FH);\n\nsub isValid {\n    my $cc = shift;\n    # 检查信用卡号的有效性；如果卡片有效，\n\
  \    # 则返回号码和类型\n    # 移除空格和连字符\n    $cc =~ s/[∧0–9]//g;\n    # 验证信用卡号的长度\n    if\
  \ (luhn($cc)) {\n        if ($type = getType($cc)) {\n            print $type.“:”.$cc.“\\\
  n\";\n        }\n    }\n    # else\n    # print “Number is greater than 16 digits.\\\
  n”;\n    # }\n}\n```\n\n这段代码使用 `luhn()` 和 `getType()` 函数来验证信用卡号，然后打印信用卡号的类型（BIN）以及信用卡本身。这段代码作为一个非常简单且直观的示例，展示了如何使用这段代码来验证取证调查期间发现的信用卡。\n\
  \n## 最后润色\n\nPerl 是执行计算机取证分析的极其有用且强大的工具。虽然现有一些应用程序可以让取证人员访问获取的镜像并进行某种程度的可视化，但工具相对较少\n\
  \n### Perl 脚本编程与计算机取证分析 • 部分 129\n\n能够满足特定取证人员特定需求的。这就是 Perl 的用法真正发挥作用并显现出来。例如，不久前我收到另一位取证人员的请求，要求在解析日志方面提供帮助。我提供了\
  \ `evt2xls.pl` 的副本，结果取证人员发现电子表格中的记录过多，Excel 无法打开。我对脚本进行了一些快速修改并重新发送……这导致了相当快的解决，而在在此之前，取证人员根本无法打开文件。\n\
  \n#### 第三部分\n\n## 本部分的解决方案：\n- 核心应用程序进程\n- 核心应用程序依赖项\n- 网络连通性\n- Web 服务\n- 日志文件\n\
  \n## 总结 131\n\n**132 第三部分 • 使用 Perl 工具箱监控应用程序**\n\n处理企业级 Windows 应用程序需要大量的分析和持续监控。将监控工作自动化可以节省大量时间，减少停机时间并提高整体应用程序的可靠性。\n\
  \n### 核心应用程序进程\n\n“核心应用程序进程”组件指的是你正在处理的应用程序的基础执行文件。每个执行文件都会占用特定的系统资源，包括处理器、内存、输入/输出（I/O）等。通过监控核心系统进程的状态及其对系统资源的使用，你能够判断进程的运行良好状况并检测异常情况。\n\
  \n\n\n\n除了应用程序本身使用的资源外，我们还需要关注其他应用程序的资源使用。消耗异常系统资源的应用程序可能会对我们正在监控的应用程序产生性能影响，因此关注这些其他应用程序的操作是有意义的。我们通过监控系统的关键性能指标（KPI）来实现这一点，并为此目的构建编写一些脚本。\n\
  \n# 使用 Perl 监控 Windows 应用程序 • 第三部分 133\n\n## 监控系统关键性能指标\n\n在编写监控特定核心进程的脚本之前，让我们先查看整个系统。某些特定的关键性能指标可以告诉你系统的整体状态，例如处理器利用率、内存利用率和网络利用率。\n\
  \n在本节中，我们将创建脚本来监控这些关键性能指标中的每一个，将其当前状态与阈值进行比较，并在超过阈值时采取行动。这将为我们提供一些基础脚本，随后我们可以对其进行完善，以提供有关特定核心进程的信息。\n\
  \n## 监控系统 CPU 利用率\n\n系统中央处理器（`CPU`）利用率是最重要的监控指标之一。当系统 `CPU` 过于繁忙时，应用程序很难获得足够的 `CPU`\
  \ 时间片来执行其工作。因此，尝试将 `CPU` 利用率保持在正常水平是有关重要的。然而，这并不意味着进程利用率应该很低，否则意味着你在不需要的硬件上花费了太多钱。良好的平衡意味着保持系统忙碌，同时确保有足够的处理器容量来处理正常负载和一些峰值。我们将在查看阈值时具体看看这些数字应该是多少。\n\
  \n首先，让我们来编写一个简单的 Perl 脚本来获取系统处理器利用率数据。在所有示例中，我将使用 Microsoft Windows 2003 Server。我还将使用\
  \ `ActivePerl 5.8.8.882` 包含的 `Perl 5.8.8`。在创建每个脚本的过程中，可能需要各种 `Perl` 模块。当我们处理每个模块时，我会包含模块名称以及说明你需要安装所引用的模块的注释。\n\
  \n在处理系统 `CPU` 利用率时，Perl 有一个名为 `Win32::PerfMon` 的模块，它可以访问通过 Windows 性能监视器（Performance\
  \ Monitor）提供的所有数据。该模块对我们的目的非常有用，因为我们最终需要通过性能监视器提供的大量数据。遗憾的是，目前需要的模块无法通过 Perl 包管理器（`PPM`）轻松安装，实际上确实需要一些额外的工作来编译、安装和配置。该模块本身从\
  \ CPAN 的 `http://search.cpan.org/~glensmall/Win32-PerfMon-0.07/PerfMon.pm` 下载，目前版本为\
  \ `0.07`。\n\n### 134 第三部分 • 使用 Perl 监控 Windows 应用程序 为了编译此模块，你必须先拥有 Microsoft Visual\
  \ C++ 6.0 或更高版本。在这些示例中，我将使用 Microsoft Visual C++ 2005 Express 版。\n\n这是来自微软的免费下载，可以在\
  \ `http://msdn.2.microsoft.com/en-us/express/aa975050.aspx` 获取。如果可能，在安装 `ActivePerl`\
  \ 之前下载并安装 Visual C++ Express 版。\n\n此外，你还需要 Microsoft Platform SDK。这是一个允许你使用微软平台库中的函数创建应用程序的开发包。SDK\
  \ 可以在 `http://www.microsoft.com/downloads/details.aspx?familyid=0baf2b35-c656-4969-ace8-e4c0c0716adb&displaylang=en`\
  \ 获取。下载 SDK 并使用标准安装程序进行安装。\n\n安装后，你必须采取几个步骤才能让 SDK 与 Visual C++ Express 版正常工作。首先，打开\
  \ `C:\\Program Files\\Microsoft Visual Studio 8\\VC\\vcpackages\\VCProjectEngine.dll.express.config`\
  \ 文件。\n\n如下所示修改“Directories”（目录）部分：\n\n```\nInclude=\"$(VCInstallDir)include;$(VCInstallDir)PlatformSDK\\\
  include;$(FrameworkSDKDir)include;C:\\Program Files\\Microsoft Platform SDK for\
  \ Windows Server 2003 R2\\Include\"\nLibrary=\"$(VCInstallDir)lib;$(VCInstallDir)PlatformSDK\\\
  lib;$(FrameworkSDKDir)lib; $(VSInstallDir);$(VSInstallDir)lib;C:\\Program Files\\\
  Microsoft Platform SDK for Windows Server 2003 R2\\Lib\"\nPath=\"$(VCInstallDir)bin;$(VCInstallDir)PlatformSDK\\\
  bin;$(VSInstallDir)Common7\\ Tools\\bin;$(VSInstallDir)Common7\\tools;$(VSInstallDir)Common7\\\
  ide;$(ProgramFiles)\\ HTML Help Workshop;$(FrameworkSDKDir)bin;$(FrameworkDir)$(FrameworkVersion);\
  \ $(VSInstallDir);C:\\Program Files\\Microsoft Platform SDK for Windows Server 2003\
  \ R2\\Bin;$(PATH)\"\n```\n\n基本上，你是将 Platform SDK 路径添加到“Include”、“Library”和“Path”变量设置中。接下来，你还需要删除\
  \ `%USERPROFILE%\\Local Settings\\Application Data\\Microsoft\\VCExpress\\8.0\\\
  vccomponents.dat` 文件，因为它缓存了这些设置。下一步是使编译器依赖项能够正常工作。修改 `C:\\Program Files\\Microsoft\
