  \n\n\n\n\n另一个想到的例子是针对获取的镜像进行搜索（针对关键词、信用卡号、社会安全号等），并获得海量数据，命中次数高达数万（甚至数十万）次。这些可能需要根据\
  \ `filename path`、`credit card type` 等进行管理，手动完成这些工作可能花费调查员几天甚至几周的时间。然而，只要具备一些编程能力，就可以编写即时工具（just-in-time\
  \ utilities）来高效、准确地执行高度重复的任务，从而让调查员能够专注于其他任务。\n如你所见，Perl 具有许多优势，但这些优势同样适用于其他语言。\n\
  ## Perl 在计算机安全社区中是如何使用的？\nPerl 在计算机安全社区中被广泛使用。（作为一个开头还不错，对吧？）\nSleuthKit (`http://www.sleuthkit.org`)\
  \ 使用了 Perl。根据 2003 年 12 月 15 日版的《The Sleuth Kit Informer》介绍：\n### 前言 xvii\n……它最初被设计为一个\
  \ CGI 脚本，因此它位于一个巨大的 Perl 文件中……\n此外，The Sleuthkit 的描述包括：“…… The Sleuth Kit 是用 C 和\
  \ Perl 编写的……”\nMetasploit 项目 (`http://www.metasploit.org`) 使用了 Perl。Moore 编写了 `PEX`（即\
  \ Perl Exploit Library），这是一个 Perl 模块，“它为常用的漏洞开发程序提供了一个面向对象的接口。”\nProDiscover 是由\
  \ Technology Pathways (`http://www.techpathways.com`) 开发的事件响应和计算机取证分析应用，它使用 Perl\
  \ 作为编程语言。ProDiscover 允许调查人员获取系统镜像，然后打开这些镜像进行分析。ProDiscover 的图形用户界面（GUI）非常简单直观，但作为\
  \ `ProScripts` 实现的 Perl 可用于自动化加载项目中的任务。ProDiscover 的安装程序包含了 ActiveState (`http://www.activestate.com`)\
  \ 的 ActivePerl 分发版，以及 `ProScript.pm` Perl 模块，该模块提供了接口，使 Perl 可以与加载到 ProDiscover\
  \ 项目中的镜像交互。ProDiscover 的事件响应版还允许响应人员自动化任务，例如分发和连接 `PDServer` 代理、收集易失信息、获取活动镜像，然后断开代理。\n\
  我在工作中使用 Perl 的原因之一是，很多时候没有现成的工具可以完成我需要的工作。我可能在处理某项调查时需要解析 `Registry` 文件，而在另一个任务中，我需要从\
  \ `MS OutLook PST` 文件中提取数据。我曾遇到过多个需要解析 `PST` 文件的案例，但每个案例的要求都不同：在一个案例中，我只需要获取文件附件名称列表，而在另一个案例中，我必须将附件文件名列表与关键词搜索的输出进行关联。这些工作可以通过手动完成，但会浪费异常的时间。然而，关键点在于，通常没有现成的工具或应用程序可以让你完成所有可能需要的工作；在进行取证分析时，获取原始数据可能没有困难，但这些数据往往有成千甚至数十万条记录，而对这些数据的分析是你所需工作的关键。Perl\
  \ 提供了一个极佳的解决方案，你或其他人之前编写的代码可以快速填补空白，让你能够高效且更重要的是准确地完成你的工作。\n### xviii 前言\n## 入门指南\n\
  ### 安装 Perl\n开始使用 Perl 需要的第一的第一件事是为你的平台安装一个分发版。Perl 已移植到许多平台，正如全面 Perl 存档网络（CPAN，`http://www.cpan.org/ports`）上的\
  \ Ports 页面所示。本书使用的 Perl 分发版是来自 ActiveState 的 ActivePerl。一旦下载了最新的 Perl 分发版，即可开始安装。我通常将\
  \ Perl 安装在 `C:\\Perl` 目录，但你也可以安装到你认为最有用的任何目录。\n### 添加模块\nPerl 自带了许多已安装的模块。模块是人们编写的代码库，可以使重复任务变得简单。你不必从头重写你使用的代码（例如，打开套接并连接到互联网上的服务器），可以在任何一个可用模块中访问所需的功能。要查看\
  \ Perl 安装了哪些模块，你可以点击开始菜单直到进入 ActivePerl 文档页面，它会在你的浏览器中打开。\n管理 Perl 模块的另一种方法是使用 ActivePerl\
  \ 自带的 Perl 包管理器或 `ppm`。你通过命令行访问 `ppm`；只需打开命令提示符，切换到你的 Perl 目录，然后输入 `ppm /?` 来获取可用命令列表。\n\
  如果你对命令行不是完全熟悉，可以在命令提示符输入 `ppm`（不加其他字符），`ppm` 的图形用户界面（GUI）就会打开，如图 1 所示。\n1 `http://aspn.activestate.com/ASPN/docs/ActivePerl/5.8/faq/ActivePerl-faq2.html#ppm_gui`\n\
  ![Image 8](img/index-20_1.jpg)\n### 前言 xix\n**图 1** PPM GUI (`ppm-gui.tif`)\n##\
  \ Perl 编辑器\n编写 Perl 脚本时，你需要某种编辑器。在我研究生阶段初期的早期（1994 年），我们电子与计算机工程课程的同学使用记事本作为编辑器编写\
  \ HTML 页面。你也可以用记事本编写 Perl 脚本，但我发现使用记事本会让编写和排错 Perl 脚本比实际需要的要困难一些。在使用编辑器时，我寻找的是语法高亮或颜色编码、自动缩进（跟随大括号等）以及行号。这些属性使我能够在尝试运行代码之前识别错误，并在错误实际发生时追踪到它们。\n\
  ### xx 前言\n有很多可用的 Perl 编辑器。我个人最喜欢的是 UltraEdit。UltraEdit 不仅是一个出色的 Perl 编辑器，我用它来编辑和查看各种其他格式，包括二进制和十六进制。\n\
  Perl Code Editor 是一个用于 Perl 的免费集成开发环境（IDE）。像 UltraEdit 一样，PCE 包含了语法高亮、行号、自动缩进以及许多其他功能。\n\
  还有许多免费的 Perl 编辑器和 IDE，例如 Open Perl IDE、`Perl Express` 和 `PerlEdit`。个人而言，当我寻找 Perl\
  \ 编辑器或 IDE 时，我寻找以下几点：我喜欢行号（方便发现我的错误）、语法高亮（让我捕获错误）以及自动缩进（代码在大括号内会自动缩进等），此外还有其他。虽然还有其他很棒的功能，但这是我的三个核心需求。利用机会尝试一些提到的编辑器或\
  \ IDE，或者在 Google 上搜索其他的并找到一个你喜欢的。\n学习编程\n\n\n有很多方法可以让你学习编程 Perl（或者说，学习任何其他编程语言），这实际上取决于你个人的偏好。一种方法是参加课程，通过正式的教学来学习。我在研究生阶段上过编程课……例如，我被要求修读\
  \ `C`；在我很年轻的时候，我上过 `BASIC` 课程，甚至在高中时学过 `Pascal`。有很多方法可以获得这种性质的正式教学，包括通过当地的社区学院。然而，某些人可能觉得这种教学过于结构化，只教授了编程语言的一些非常基本的用法，例如如何执行打开文件等相对微道的操作。\n\
  如果你有这种倾向，你可以完全通过投入实践和尝试来自学。\n在各地，比如你当地的图书馆，都有优秀的资源可以利用。\n通过阅读书籍并遵循示例，你可以很快地学会编程，在掌握基础知识之前进阶到更复杂、更有实用的任务。\n\
  2 `http://www.ultraedit.com/`\n4 `http://open-perl-ide.sourceforge.net/`\n6 `http://www.indigostar.com/perledit.html`\n\
  ## 前言 xxi\n另一种可用的资源是他人编写的代码。有些人通过观察他人完成任务所采取的步骤来学习编程，并在基础上进行添加，或者以其他方式进行修改以满足自己的需求。通过网站、博客、用户论坛等，有很多资源可供。许多资源提供了他人编写和提交的代码存档，而且也有人愿意提供帮助、提供援助和建议（当然，前提是你正在努力自己完成任务，而不是要求别人替你做家庭作业）。\n\
  ### 编写你自己的代码\n你会在本书中的整个代码以及随附的 DVD 中看到，我有我自己的编程风格……在我的代码中，处理某些事情有特定的处理方式，对我来说，这让代码脱颖而出。我的希望这也能让其他人更容易阅读和使用。其他人也有自己的风格，特别是在格式方面。\n\
  那个关于律师和意见的笑话是怎么说的来？嗯，把五个 Perl 程序员放在一个房间里，给他们一个任务去完成，只要这个任务超出了一个简单的“print”语句，你可能会得到五个不同版本的代码。然后，让他们每个人看彼此的作品，你可能会得到更多。我提到这一点是因为我不想让你认为我的编码方式是“唯一”的一种方法；它仅仅是“一种”方法。很多时候，我会将某些任务拆分成单独的代码行或段，并附带文档，而单行代码可能更优雅。我这样做是为了让别人（也许是在问题或\
  \ Perl 方面没有我这么多背景的人）在查看代码时能更容易理解我做了什么。有时，那个“别人”就是六个月或一年后的我。有时，优雅和速度必须让位于可理解性以及日后再次使用代码的能力。\n\
  ### 运行 Perl 脚本\n也许我在前两本书和 Perl 脚本中遇到的最大问题就是不可避免地收到的邮件……“我双击了 Perl 脚本，屏幕上闪过一个黑框……我该怎么办？”这类问题的出现仅仅是因为：(a)\
  \ 对 GUI 工具过于熟悉和习惯，以及 (b) 不熟悉任何类型的脚本（包括批处理文件）和提示符。\n要运行大多数 Perl 脚本，你需要打开提示符，导航到相应的目录，然后手动输入命令，最后按下回车键。我知道这听起来很轻率，但我认为也许将其拆解开会让这个过程更容易消化。在许多情况下，你可能需要在命令中包含\n\
  xxii 前言\n参数或参数；本质上，这些脚本将根据其代码处理的额外指令，并希望带给你想要的结果。\n### 本书的结构\n#### 第一部分\n第一部分探讨了在实时系统工作时使用\
