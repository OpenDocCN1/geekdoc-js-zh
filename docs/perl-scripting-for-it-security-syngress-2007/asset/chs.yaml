  \n## 注册表\n\nWindows 注册表是一个二进制分层数据库，为分析师或调查人员提供了大量的价值信息。根据微软的介绍，注册表存储了系统和应用程序的配置信息，取代了旧的初始化（`*.ini`，读作“eye-en-eye”）文件。对于取证分析师来说，注册表可以被视为一个巨大的日志文件。注册表由键（keys，即你打开\
  \ RegEdit 时看到的文件夹）组成，键包含子键（subkeys）和值（values），而值包含数据（data）。图 II.1 展示了键、值和数据。\n\n\
  **图 II.1** 从 RegEdit 提取的键、值和数据的示例。关于注册表特定结构及其在取证分析中巨大价值的更多信息，请参见我由 Syngress/Elsevier\
  \ 出版的另一本书——*Windows Forensic Analysis》（Windows 取证分析）。\n\n正如我们在上一部分看到的，在活动系统上访问注册表的一种极方法是使用\
  \ `Win32::TieRegistry` 模块。然而，当从获取的镜像中提取注册表文件进行取证分析时，理想模块是 James McFarlane 的 `Parse::Win32Registry`\
  \ 模块。我曾考虑编写自己的工具来访问原始注册表文件并提取键值，但正当我为该模块准备基础工作时，James 发布了他版本的 `Parse::Win32Registry`\
  \ 模块，该模块采用了完全面向对象的方法处理任务。虽然我们将使用 James 的模块解析来自 Windows 2000、XP、2003 甚至 Vista 的注册表文件，但\
  \ `Parse::Win32Registry` 也可以用于解析来自 Windows ME 和 95/98 的注册表文件。\n\n### 注意\n\n在我编写这一部分时，无法通过\
  \ Perl 包管理器 (ppm) 获取 `Parse::Win32Registry` 模块。要安装此模块，你只需要下载 `.tar.gz` 文件，解压所有内容（WinZip\
  \ 即可胜），并将整个 `Parse` 文件夹复制到系统中的 `\\Perl\\site\\lib\\` 目录下。\n\n2 `http://search.cpan.org/∼jmacfarla/Parse-Win32Registry-0.30/`\n\
  \n## 60\n\n第二部分 • Perl 脚本与计算机取证分析 SAMParse.pl\n\n当系统运行时，即使是管理员也无法访问 SAM 数据库，它包含了系统用户账户的信息（包括密码哈希值）。然而，在对系统进行事后分析时，SAM\
  \ 数据库包含了大量关于本地用户账户的信息，它以名为“SAM”的文件存在于 `C:\\Windows\\system32\\config`（或取决于情况为 `Winnt\\\
  `）目录下。`samparse.pl` Perl 脚本不仅解析嵌入 SAM 数据库的各种用户账户，还会提取并解码维护在每个用户的“F”值和“V”值中的信息。在退出之前，它还会解析并显示系统中的组和组成员关系的信息（即适用于本地用户账户的信息）。\n\
