  \ 地址是否启用以及适配器的 MAC 地址。从输出可以看出，你有一个启用的无线适配器，并且是局域网（LAN）RJ45 线缆连接。\n\n## 更多关于网卡的信息\n\
  \n使用如 `nic.pl` 等脚本，可以保留系统在关机之前的状态，或者哪些连接是启用的。这些信息在事后调查中非常有价值。额外的信息位于 `Win32_AdapterConfiguration`\
  \ 类。例如，你可以获取默认网关、动态主机配置（DHCP）是否启用，以及域名系统（DNS）和互联网交换（IPX）配置。修改 `nic.pl` 将使这些信息可用。\n\
