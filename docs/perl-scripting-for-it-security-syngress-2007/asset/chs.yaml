  \n**使用 Perl 监控 Windows 应用程序 • 第三部分 161**\n\n我们已经查看了 `threshold_rules` 子程序中包含的代码，现在让我们来看看\
  \ `threshold_check` 子程序。我们首先以在 `threshold_check` 中使用的相同的方式加载 XML 数据。然后，我们对 XML 文件中列出的监控器进行字符串匹配，以检查第一个传入的变量（`$_[0]`）是否与已知的监控器匹配。如果是，我们就收集与该监控器相关的各种状态和动作的\
  \ `value`（值）和 `operator`（操作符）。为了调试，我们在进行实际评估之前，会打印出我们正在评估哪条规则。\n\n我们有一组可用的运算符来检查值。它们是：\n\
  \n- `equalorgreater`（等于或大于）\n- `equalorless`（等于或小于）\n- `equal`（等于）\n- `notequal`（不等于）\n\
  - `greater`（大于）\n- `less`（小于）\n\n使用这些运算符，我们可以检查 `value` 变量（`$_[1]`）相对于阈值 `value`（`$status->{value}`）。一系列\
  \ `if/elsif` 语句执行了这种评估。请注意，我们在这里**专门**比较的是数值。因此，我们必须确保对第二个变量处理的是数值。我们需要对此进行一些错误检查，并在脚本的下一个版本中演示。\n\
  \n当找到匹配项时，将调用 `take_action` 子程序并传递包含 `action name`（动作名称）和 `status code`（状态代码）的变量。目前我们只是打印该字符串，但之后我们可以对其进行更多处理。在此区域，我们针对\
  \ `value` 评估监控器的所有可能的规则。这意味着我们可能会有多个匹配项。例如，使用以下测试脚本：\n\n```perl\nuse strict;\nrequire\
  \ ‘thresh.pl’;\n&threshold_check (“sys_proc” , 85);\n```\n\n产生图 III.15 所示的结果，其中对于黄色状态代码有一个匹配项。\n\
