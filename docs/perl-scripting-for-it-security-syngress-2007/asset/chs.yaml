  0 - 应用安装\");\n\nPSDisplayText(\"1 - 卸卸载\");\n\nPSDisplayText(\"7 - 系统检查点\");\n\n\
  PSDisplayText(\"10 - 设备驱动程序安装\");\n\nPSDisplayText(\"12 - 修改设置\");\n\nPSDisplayText(\"\
  13 - 取消的操作\");\n\nPSDisplayText(\"\\n\");\n\n#----------------------------------------------------------------\n\
