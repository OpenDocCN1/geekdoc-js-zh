  \n**图 III.1** `Win32::PerfMon` 安装\n\n**使用 Perl 监控 Windows 应用程序 • 第三部分 137**\n\n\
  最后，由于 Visual C++ 2005 版工作方式发生了一些变化，我们必须更改 `PerfMon.dll` 文件的清单（manifest）数据。如果你使用的是\
  \ Visual C++ 6.0，则是不必要的。在命令行窗口中切换到 `C:\\Perl\\site\\lib\\auto\\Win32\\PerfMon` 目录并运行以下命令：`mt\
  \ /manifest PerfMon.dll.manifest /outputresource:PerfMon.dll`。\n\n这是将生成的清单文件作为资源嵌入动态链接库（DLL）中，允许\
  \ `Win32::PerfMon` 模块使用的 DLL 能够正常工作。再次强调，这仅在使用 Visual C++ Express 版 2005 编译器编译模块时才是必要的。\n\
  \n安装此模块后，我们现在可以通过在 Perl 脚本中使用以下代码访问所有性能计数器数据：`use Win32::PerfMon;`。\n\n因此，对于我们的\
  \ CPU 利用率脚本，这显然将起到关键作用。我们首先要做的是收集 CPU 利用率数据。在能够收集到信息后，我们将考虑如何将其作为实际监控活动的数据点。\n\n\
  为了收集 CPU 利用率，我们将使用性能监视计数器“% Processor Time”（处理器时间 %）。根据微软对该计数器的描述：\n\n“% Processor\
  \ Time 是处理器用于执行非空闲线程的所经过的时间的百分比。它的计算方法是测量空闲线程在采样间隔内活跃的持续，并从间隔持续时间中减去该时间。（每个处理器都有一个空闲线程，当没有其他线程准备好运行时它会消耗周期）。该计数器是处理器活动的主要指标，显示在采样间隔内观察到的忙碌时间平均百分比。它是通过监控服务非空闲的时间，并从\
  \ 100% 中减去该值计算出的。”\n\n让我们为此编写一些代码。我们将使用 `Win32::PerfMon` 模块并捕获“% Processor Time”计数器中的可用数据。这是“Processor”（处理器）性能监视对象的一部分。根据系统中处理器的数量，该对象有多个可用实例。如果存在一个处理器，数据存储在实例\
  \ `0` 下。对于此类对象，还有一个特殊的实例可用，它可以提供来自所有其他实例的数据。这就是 `_Total` 实例。在大多数情况下，监控应用程序时你不需要知道特定处理器的性能数据，因此我们将使用\
  \ `_Total` 实例作为我们的数据。提取这些数据的代码如图 III.2 所示。\n\n**138 第三部分 • 使用 Perl 监控 Windows 应用程序**\
  \ **图 III.2** `get_percentprocessortime.pl`\n\n```perl\n#get_percentprocessortime.pl\n\
  \nuse Win32::PerfMon;\nuse strict;\n\nmy $ret = undef;\nmy $err = undef;\nmy $Object\
  \ = undef;\nmy $Counter = undef;\nmy $CounterData = undef;\n\n#connect to localhost\
  \ for data\nmy $perfmon = Win32::PerfMon->new(\"\\\\\\\\localhost\");\nif($perfmon\
  \ != undef)\n{\n    $ret = $perfmon->AddCounter(\"Processor\", \"% Processor Time\"\
  , \"_Total\");\n    if($ret != 0)\n    {\n        $ret = $perfmon->CollectData();\n\
  \        if($ret != 0) {\n            my $proctime = $perfmon->GetCounterValue(\"\
  Processor\",\"% Processor Time\", \"_Total\");\n            if($proctime > -1)\n\
  \            {\n                print \"% Processor Time = [$proctime]\\n\";\n \
  \           }\n            else\n            {\n                $err = $perfmon->GetErrorText();\n\
  \                print \"Failed to get the counter data!\\n\", $err, \"\\n\";\n\
  \            }\n        }\n        else\n        {\n            $err = $perfmon->GetErrorText();\n\
  \            print \"Failed to collect the perf data!\\n\", $err, \"\\n\";\n   \
  \     }\n    }\n    else\n    {\n        $err = $perfmon->GetErrorText();\n    \
  \    print \"Failed to add the counter!\\n\", $err, \"\\n\";\n    }\n}\nelse\n{\n\
  \    print \"Failed to create the perf object!\\n\";\n}\n```\n\n**使用 Perl 监控 Windows\
  \ 应用程序 • 第三部分 139**\n\n上面的示例（以及本章后续后的所有示例）可能由于打印格式的列限制，而没有严格遵守“可读代码”的规则。在这段代码中，我们做了很多工作。为了使代码健壮，我们需要尽可能捕获这些错误。沿着代码，我们首先做的是使用\
  \ `Win32::PerfMon` 模块创建一个对象。我们将该对象命名为 `$perfmon`。接下来，通过调用 `AddCounter` 函数向对象添加计数器。该语法是指定性能监视对象、计数器，然后是。接下来，我们使用\
  \ `CollectData` 函数从性能监视器收集数据。虽然技术上可以在更短时间内完成，但某些计数器要求在数据请求之间实例化一秒延迟。收集数据后，我们必须使用\
  \ `GetCounterValue` 获取值。该数据随后存储在变量 `$proctime` 中并通过 `print` 函数显示。如果在过程中遇到任何错误，我们将显示错误消息，然后是模块返回的错误。\n\
  \n### 内存利用率\n\n我们要监控的下一个统计是系统内存利用率。再次，我们将使用 `Win32::PerfMon` 模块收集这些数据。由于系统 CPU 利用率和系统内存利用率属于同一类型（都与系统相关），我们可以在同一个脚本中收集它们，并保持模块化架构。图\
  \ III.3 显示了如何实现此点的示例。\n\n\n\n\n```perl\nprint \"Failed to get the counter data!\\\
  n\", $err, \"\\n\";\n\n}\n\nmy $freemem = $perfmon->GetCounterValue(\n\"Memory\"\
  ,\"Available MBytes\",\n-1);\n\nif($freemem > -1)\n{\n    print \"Available Memory\
  \ = [$freemem]MB\\n\";\n}\nelse\n{\n    $err = $perfmon->GetErrorText();\n    print\
  \ \"Failed to get the counter data!\\n\", $err, \"\\n\";\n}\n\n}\n\nelse\n{\n  \
  \  $err = $perfmon->GetErrorText();\n    print \"Failed to collect the perf data!\\\
  n\", $err, \"\\n\";\n    **Monitoring Windows Applications with Perl • Part III\
  \ 141**\n}\n}\nelse\n{\n    $err = $perfmon->GetErrorText();\n    print \"Failed\
  \ to add the counter!\\n\", $err, \"\\n\";\n}\n}\nelse\n{\n    print \"Failed to\
  \ create the perf object!\\n\";\n}\n```\n\n在这种情况下，我们检查上一个计数器的添加是否成功，然后添加另一个计数器。我们要添加的计数器使用了“Memory”对象和“Available\
  \ MBytes”计数器。该对象和计数器没有单独的实例，因此我们使用 `-1` 值作为实例来表示这一点。\n\n如果所有计数器都成功添加，我们就继续收集数据。同样，假设收集顺利（并在需要时捕获错误），然后显示数据。现在我们有了两个关键的系统统计数据：%\
  \ Processor Time 和 Available MBytes。\n\n## 监控系统网络利用率\n\n我们将查看最后一个系统级统计数据是网络利用率。作为应用程序管理员，你可能对许多其他统计数据感兴趣，但我们在此处侧重于监控每个应用程序通用所需的计数器。我认为重要的是，我们将在本章节后续部分讨论磁盘利用等依赖项，而不是在这里的\
  \ KPI 部分。\n\n在 Windows 服务器上监控网络利用率比我们目前收集的其他统计数据稍微复杂一些。为了从性能监视计数器提供的数据获取获取信息，需要进行额外的计算。这些计算所需的数值都由“Network\
  \ Interface”对象提供。我们将使用“Bytes Total/sec”和“Current Bandwidth”计数器。实例名称将是您正在使用的网络适配器名称。\n\
  \n要确定网络利用率的实际量，我们需要将“Bytes Total/sec”值乘以 8，然后将结果除以“Current Bandwidth”计数器的值。这将提供整体使用百分比。图\
  \ III.4 显示的代码展示了如何此操作的示例。\n\n**142 Part III • Monitoring Windows Applications with\
  \ Perl** **Figure III.4** get_system_stats.pl\n\n```perl\n#get_system_stats.pl\n\
  \nuse Win32::PerfMon;\nuse strict;\n\nmy $ret = undef;\nmy $err = undef;\nmy $Object\
