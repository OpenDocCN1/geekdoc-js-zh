  \n# Now that we have the SIDs, let’s enumerate through the keys my @guids = (“{5E6AB780-7743-11CF-A12B-00AA004AE837}\\\
  \\Count”,\n\n“{75048700-EF1F-11D0-9888-006097DEACF9}\\\\Count”);\n\nmy $key_path\
