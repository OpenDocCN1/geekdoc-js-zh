  \ 时间）。\n\n如从图 II.6 所示，所讨论的系统可能是运行在 `VMWare11` 会话中的 Windows XP 系统。\n\n## `Prefetch.pl`\n\
  \n除了系统还原点，Windows XP 系统的另一个有趣方面是，Windows XP 默认会执行应用预取（Application Prefetching）。112\
  \ http://www.vmware.com/\n\n112 http://technet.microsoft.com/en-us/library/bb457057.aspx\n\
  \n**118 第二部分 • Perl 脚本与计算机取证分析** Windows XP 也会执行启动预取，Windows 2003 默认也是如此（尽管 Windows\
  \ 2003 默认不执行应用预取）。应用预取的简单作用是通过在固定位置存储有关应用程序的一些信息，让 Windows XP 上的应用程序启动更快（是的，这是一个过于简单的描述，更详细的描述超出了本书的范围）。Windows\
  \ XP 可以在其 Prefetch 目录中存储多达 128 个预取文件（以 `*.pf` 结尾），`Prefetch.pl` ProScript 将检查人员查看有关预取文件的信息。\n\
  \n```perl\n#! c:\\perl\\bin\\perl.exe\n\n# ----------------------------------------------------------------\n\
  \n# Prefetch.pl, 版本 0.1_20061026\n\n# 用于解析 Prefetch 目录中的 .pf 文件的 ProScript，\n# 然后解析文件以运行计数和最后运行时间。\n\
  \n#\n# 版权所有 2006–2007 H. Carvey, keydet89@yahoo.com\n\n# ----------------------------------------------------------------\n\
  \nuse ProScript;\n\nPSDisplayText(“Prefetch.pl v. 0.1_20061026”);\n\nPSDisplayText(“用于解析\
