  \n现在，让 lspi.pl 在代码角度上变得复杂的原因是，脚本在简单访问内存之外，还对数据进行了一些二进制文件解析。\n\n\n\n\n转储文件。该脚本还必须解析可执行文件（PE）文件头（PE\
  \ 文件头由微软定义），并根据头部信息提供的“映射”重新组装可执行映像文件的各个部分。\n\n执行映像文件的实际分段存储在内存“页”中，每个分段的大小为 4096\
  \ 字节（4Kb）。如果 RAM 转储文件中没有提供所有必要的内存页，例如内存管理器将这些页交换到了页面文件（pagefile），则 `lspi.pl` 将无法重组完整的可执行映像文件，并将带有相应的错误消息退出。\n\
  \n这两个 Perl 脚本（`lsproc.pl` 和 `lspi.pl`）以及其他用于从 RAM 转储文件中解析数据的 Perl 脚本，可以在 WindowsIR9\
  \ 项目的 SourceForge 站点上找到。\n\n## 大师级\n\n### 从 RAM 中提取其他数据\n\nRAM 转储文件通常包含远比进程和网络连接得多的内容。用你喜欢的十六进制编辑器打开\
  \ RAM 转储文件，会发现可能看起来像事件日志事件记录的内容以及注册表项。与在 RAM 转储文件中定位进程一样，这些其他对象也可以被定位和解析。这在调查中非常有用，因为这些对象包含时间戳信息，可以用于建立或关联系统活动的时间线。\n\
  \n### ProScripts\n\n正如第一部分提到的，ProScripts 本质上是 Perl 脚本，为 Technology Pathways 提供的\
  \ ProDiscover 取证分析应用提供脚本功能。ProDiscover 取证分析应用非常有用，而 Perl 脚本语言的加入允许调查人员结合 ProDiscover\
  \ 产品利用 Perl 的力量。这使得调查人员能够将 ProDiscover 应用扩展到惊人的可用性水平。\n\n图形用户界面（GUI）编程超出了本书的范围，但我测试过将\
  \ GUI 结合 ProDiscover ProScripts 9 http://sourceforge.net/project/showfiles.php?group_id=164158（使用\
  \ `Win32::GUI` 模块），它们协同工作得非常好。如果能更上一层楼，调查人员将能够进一步扩展 ProDiscover 的可用性，而这一切都归功于 Perl\
  \ 的力量！\n\n### uassist.pl\n\n在第一部分以及本部分之前的内容中，我提供了用于从注册表的 UserAssist 项中提取信息的 Perl\
  \ 脚本。在第一部分中，`uassist.pl` Perl 脚本可以在实时系统上运行，以检索当前登录用户的 UserAssist 项内容；而在本部分较早之前，`uassist.pl`\
  \ 脚本使用了 `Parse::Win32Registry` 模块从从镜像中提取的任意 `NTUSER.DAT` 文件中检索相同的信息。为了完整起见，我想提供一个可以在\
  \ ProDiscover 中使用的并从用户注册表文件解析 UserAssist 项的 ProScript：\n\n```\n#! c:\\Perl\\bin\\\
  perl.exe\n\n#----------------------------------------------------------------\n\n\
