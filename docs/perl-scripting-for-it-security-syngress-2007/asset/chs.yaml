  xxiii\n**第一部分**\n**Perl 脚本与**\n**实时响应**\n**本部分的解决方案：**\n■ **内置**\n**函数**\n■ **运行**\n\
  **进程**\n■ **访问 API**\n■ **WMI**\n■ **访问注册表**\n■ **ProScripts**\n1\n**2**\n**第一部分\
  \ • Perl 脚本与实时响应**\n本部分重点关注在从实时系统提取数据时使用 Perl，作为实时响应的一部分。“实时响应”是一个通用术语，用于描述在系统运行时需要从中获取信息时所执行的活动。这通常是从系统收集易发性数据，或只有在系统开启并运行时才可用的数据。实时响应活动可以包括管理员在系统上排除故障，或者在系统关机并获取硬盘镜像之前，收集进程和网络连接信息。这些活动也可以包括本地控制（当管理员坐在控制台前）或远程（通过网络）执行。\n\
  \n\nActiveState Perl 自带了几个内置的 Windows（即 Win32）函数，允许你从 Windows 系统中访问并检索特定信息。例如，你可以确定当前的工作目录（`Win32::GetCwd()`）、系统架构以及系统的\
  \ CPU 类型（分别对应 `Win32::GetArchName()` 和 `Win32::GetChipName()`），以及其他许多非常有用的信息。所有这些函数仅仅是通往相应的\
  \ Windows 应用程序接口（API）函数调用的接口，允许编程人员快速检索他们正在寻找的信息。\n### Win32.pl\n演示了一些 Perl Win32\
  \ 内置函数的用法：\n```perl\nuse Win32;\nprint “Architecture : :).Win32::GetArchName().“\\\
  n”;\nprint “Perl Build : :).Win32::BuildNumber().“\\n”;\nprint “Login Name : :).Win32::LoginName().“\\\
  n”;\n\nprint “$str $maj $min $build $id\\n”;\n\n\nArchitecture : x86\nPerl Build\
  \ : 819\nLogin Name : Harlan\n```\n你可以看到，这些信息在事件响应期间可能非常有用。查看 ActiveState Perl 文档可以获取\
  \ Win32 函数完整列表。\n### Pclip.pl\n虽然不是内置函数，但 ActiveState Perl 提供了几个特定于 Windows 平台的\
  \ Perl 模块。例如，`Win32::Clipboard` 允许你设置或检索 Windows 剪贴板的内容。\n```perl\nuse Win32::Clipboard;\n\
  my $clip = Win32::Clipboard();\n\n    print “Clipboard Contents\\n”;\n    print\
  \ $clipboard.“\\n”;\nelse {\n}\n\n\n\nClipboard Contents\n123 Fake Street\n\n\n\n\
