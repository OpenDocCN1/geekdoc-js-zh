    1.  npm install passport passport-google-oauth20


    Configure Passport with the Google Strategy:


    First, you must create a project in the Google Developers Console, enable the
    Google+ API, and obtain your client ID and client secret.


    Then, configure Passport to use the Google OAuth 2.0 strategy:


    1.  const passport = require(''passport'');


    2.  const GoogleStrategy = require(''passport-google-oauth20'').Strategy;


    4.  passport.use(new GoogleStrategy({


    5.  clientID: ''YOUR_CLIENT_ID'',


    6.  clientSecret: ''YOUR_CLIENT_SECRET'',


    7.  callbackURL: "[http://yourdomain.com/auth/google/callback](http://yourdomain.com/auth/google/callback)"


    8.  },


    9.  function(accessToken, refreshToken, profile, cb) {


    10.  User.findOrCreate({ googleId: profile.id }, function (err, user) {


    11.  return cb(err, user);


    12.  });


    13.  }


    14.  ));


    Add Routes for Authentication and Callback:


    1.  const express = require(''express'');


    2.  const app = express();


    4.  app.get(''/auth/google'',


    5.  passport.authenticate(''google'', { scope: [''profile''] }));


    7.  app.get(''/auth/google/callback'',


    8.  passport.authenticate(''google'', { failureRedirect: ''/login'' }),


    9.  function(req, res) {


    10.  // Successful authentication, redirect home.


    11.  res.redirect(''/'');


    12.  });


    14.  app.listen(3000, () => console.log(''App listening on port 3000''));


    In this example, visiting /auth/google initiates the OAuth flow, redirecting the
    user to Google''s consent screen. After the user consents, Google redirects to
    /auth/google/callback, where Passport''s middleware handles the exchange of the
    code for an access token and calls the verify callback with the user''s profile
    information.


    Security Best Practices


    Securing a web application is paramount to protecting sensitive data and ensuring
    user trust. As web technologies evolve, so do the tactics employed by malicious
    actors.


    Secure Communication: HTTPS


    Use HTTPS to encrypt data in transit, preventing man-in-the-middle attacks. For
    Node.js applications, you can implement HTTPS by obtaining an SSL/TLS certificate
    and configuring your server to use it.


    Example using the https module:


    1.  const https = require(''https'');


    2.  const fs = require(''fs'');


    4.  const options = {


    5.  key: fs.readFileSync(''path/to/key.pem''),


    6.  cert: fs.readFileSync(''path/to/cert.pem'')


    7.  };


    9.  https.createServer(options, (req, res) => {


    10.  res.writeHead(200);


    11.  res.end(''hello world\n'');


    12.  }).listen(443);


    Validation and Sanitization


    Always validate and sanitize user input to protect against SQL injection, XSS
    (Cross-Site Scripting), and other injection attacks. Use libraries like express-validator
    to validate and sanitize input data.


    Example using express-validator:


    1.  const { body, validationResult } = require(''express-validator'');


    3.  app.post(''/user'',


    4.  body(''username'').isEmail(),


    5.  body(''password'').isLength({ min: 5 }),


    6.  (req, res) => {


    7.  const errors = validationResult(req);


    8.  if (!errors.isEmpty()) {


    9.  return res.status(400).json({ errors: errors.array() });


    10.  }


    12.  // Proceed with safe data


    13.  }


    14.  );


    Dependency Management


    Regularly update your dependencies to mitigate vulnerabilities in third-party
    packages. Tools like npm audit can help identify and fix insecure dependencies.


    1.  npm audit


    2.  npm audit fix


    Authentication and Session Management


    Implement secure authentication mechanisms. Use JWT (JSON Web Tokens) for stateless
    authentication and ensure passwords are hashed using algorithms like bcrypt.


    Hashing a password with bcrypt:


    1.  const bcrypt = require(''bcrypt'');


    3.  async function hashPassword(password) {


    4.  const salt = await bcrypt.genSalt(10);


    5.  const hashedPassword = await bcrypt.hash(password, salt);


    6.  console.log(hashedPassword);


    7.  }


    Use Security Headers


    Protect your application from common attacks by setting HTTP headers appropriately.
    Use the helmet middleware in Express applications to set various security-related
    headers.


    1.  const helmet = require(''helmet'');


    2.  app.use(helmet());


    Rate Limiting


    Prevent brute-force attacks by limiting the number of requests a user can make
    to your API within a given timeframe.


    Example using express-rate-limit:


    1.  const rateLimit = require(''express-rate-limit'');


    3.  const limiter = rateLimit({


    4.  windowMs: 15 * 60 * 1000, // 15 minutes


    5.  max: 100 // limit each IP to 100 requests per windowMs


    6.  });


    8.  app.use(limiter);


    Monitoring and Logging


    Implement logging and monitoring to detect suspicious activities early. Use tools
    like winston for logging and morgan for HTTP request logging.


    Setting up morgan:


    1.  const morgan = require(''morgan'');


    2.  app.use(morgan(''combined''));


    Handling Passwords: Securely managing sensitive information


    Handling passwords and sensitive data securely is a cornerstone of web application
    security. A breach of such data can lead to significant privacy violations and
    damage an organization''s reputation.


    Storing Passwords Securely


    Passwords should never be stored in plain text. Hashing passwords before storing
    them is crucial to protecting them against unauthorized access, even in the event
    of a data breach.


