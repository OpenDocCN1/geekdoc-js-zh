  trans: "\n事件循环是 Node.js 事件驱动架构的核心。它循环遍历一系列阶段，每个阶段负责不同类型的事件。例如，它会检查计时器以查看是否有任何计划的回调需要执行，处理待处理的\
    \ I/O 事件，并处理异步 I/O 回调。这个循环确保了应用程序的响应性，因为它可以在任务之间快速切换，而不会被阻塞操作所困扰。\n\n# 设置你的环境\n\
    \n设置一个合适的开发环境是开启 Node.js 之之旅的关键第一步。它确保你拥有所有必要的工具和配置，以便高效地开始构建应用程序。\n\n## 第 1 步：安装\
    \ Node.js\n\n1.1. 下载 Node.js：访问 Node.js 官方网站下载安装程序。你会发现有两个版本供下载：长期支持（LTS）版本，由于其稳定性和扩展支持，推荐大多数用户使用；以及当前（Current）版本，它包含了最新功能。\n\
    \n1.2. 运行安装程序：下载完成后，运行安装程序。按照安装提示操作，它们将引导你完成在系统上设置 Node.js 的。这包括同意许可协议、选择安装文件夹以及选择要安装的组件（通常使用提供的默认设置是安全的）。\n\
    \n1.3. 验证安装：为了确保 Node.js 安装正确，打开你的终端（Windows 上的命令提示符，macOS 和 Linux 终端）并输入：\n\n\
    ```\nnode -v\n```\n\n此命令将显示已安装的 Node.js 版本，确认 Node.js 已准备就绪。\n\n## 第 2 步：配置 Node\
    \ 包管理器 (NPM)\n\nNPM 是 Node.js 的默认包管理器，允许为你项目安装和管理库以及依赖项。\n\n2.1. 验证 NPM 安装：NPM\
    \ 随 Node.js 自动安装。要验证其安装，请在终端中输入以下命令：\n\n```bash\nnpm -v\n```\n\n这将显示已安装的 `NPM`\
    \ 版本，表示它已准备可用。\n\n2.2. 设置 NPM：虽然 `NPM` 开箱即用，但你可能需要根据项目需求配置某些设置（如默认目录、代理设置）。对于大多数用户来说，默认配置已足够开始。\n\
    \n## 第 3 步：安装代码编辑器\n\n一个良好的代码编辑器可以显著提高你的编码效率。目前有多种优秀的编辑器非常适合 Node.js 开发。\n\n3.1.\
    \ 选择代码编辑器：流行的选择包括 Visual Studio Code (VS Code)、Atom 和 Sublime Text。特别是 VS Code，它为\
    \ Node.js 开发提供了强大的支持，具有如 IntelliSense、调试和直接访问终端等功能。\n\n3.2. 安装扩展：选择好编辑器后，考虑安装有助于\
    \ Node.js 开发的扩展或插件。对于 VS Code，像 \"Node.js Extensions Pack\" 这样的扩展会非常有帮助。\n\n##\
    \ 第 4 步：设置版本控制\n\n版本控制对于管理代码库的更改、与他人协作以及维护项目开发历史至关重要。\n\n4.1. 安装 Git：访问 Git 官方网站（`[git-scm.com](https://git-scm.com/)`）下载并安装\
    \ `Git`。在安装过程中，你可以接受默认设置，这些设置适用于大多数用户。\n\n4.2. 配置 Git：打开终端并使用以下命令设置你的用户名和邮箱地址：\n\
    \n```bash\ngit config --global user.name \"Your Name\"\ngit config --global user.email\
    \ \"youremail@example.com\"\n```\n\n这些设置对于 `Git` 跟踪谁做了哪些更改至关重要。\n\n## 第 5 步：测试你的设置\n\
    \n现在你已经安装了 Node.js、NPM、代码编辑器和 Git，是时候通过创建一个简单的 Node.js 应用程序来测试你的设置了。\n\n5.1. 创建测试文件：在你的代码编辑器中，创建一个名为\
    \ `app.js` 的新文件。添加以下代码：\n\n```javascript\nconsole.log('Hello, Node.js!');\n```\n\
    \n5.2. 运行你的应用程序：打开终端，导航到包含 `app.js` 的目录，并运行：\n\n```bash\nnode app.js\n```\n\n\
    如果你看到控制台打印 \"Hello, Node.js!\"，恭喜你！你成功建立了 Node.js 开发环境，并准备好开始构建应用程序了。\n\n# 你的第一个\
    \ Node.js 代码\n\nNode.js 开发之旅从构建和运行你的第一个应用程序开始。这段经历不仅巩固了你的设置，还让你了解了 Node.js 创建服务器端应用程序的简单与强大。\n\
    \n## 第 1 步：创建你的项目目录\n\n1.1. 首先，在你的计算机上创建一个新目录用于存储你的 Node.js 项目。你可以随心所欲地命名这个目录，例如\
    \ `node_projects`。\n\n1.2. 打开终端或命令提示符，导航到新创建的目录，并为第一个项目创建一个子目录。让我们把项目命名为 `hello_node`：\n\
    \n```bash\nmkdir hello_node\ncd hello_node\n```\n\n## 第 2 步：初始化你的 Node.js 项目\n\
    \n2.1. 在 `hello_node` 目录内，运行以下命令初始化一个新的 Node.js 项目：\n\n```bash\nnpm init -y\n\
    ```\n\n此命令会在项目目录中创建一个带有默认值的 `package.json` 文件。`package.json` 文件至关重要，因为它包含了关于项目的元数据并列出了它的依赖项。\n\
    \n## 第 3 步：编写你的第一个 Node.js 应用程序\n\n3.1. 使用你喜欢的代码编辑器，在 `hello_node` 目录中创建一个名为 `app.js`\
    \ 的新文件。\n\n3.2. 打开 `app.js` 并添加以下代码，这将创建一个访问时响应 \"Hello, Node.js!\" 的服务器：\n\n\
    ```javascript\nconst http = require('http');\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n\
    \  res.end('Hello, Node.js!');\n});\n\nconst port = 3000;\nconst hostname = '127.0.0.1';\n\
    server.listen(port, hostname, () => {\n  console.log(`Server running at http://${hostname}:${port}/`);\n\
    });\n```\n\n这段代码执行了：\n\n* 导入了 `http` 模块，它是 Node.js 内置的允许你创建 HTTP 服务器。\n* 使用 `http.createServer()`\
    \ 方法创建一个监听请求的新型服务器。\n* 指定了 `port` 和 `hostname`。在此情况下，服务器运行在你本地的 `127.0.0.1:3000`\
    \ 上。\n* 调用 `server.listen()` 启动服务器并监听连接。\n\n## 第 4 步：运行你的应用程序\n\n4.1. 返回终端，确保你仍处于\
    \ `hello_node` 项目目录下，并运行以下命令启动应用程序：\n\n```bash\nnode app.js\n```\n\n4.2. 你应该终端中看到一条消息：Server\
    \ running at http://127.0.0.1:3000/。这表示你的服务器正在运行并准备好接受请求。\n\n## 第 5 步：访问你的应用程序\n\
    \n5.1. 打开浏览器并导航到 `http://127.0.0.1:3000/`。你应该能在浏览器中看到 \"Hello, Node.js!\"。这个响应直接来自你的\
    \ Node.js 应用程序。\n\n5.2. 恭喜你！你成功创建并运行了第一个 Node.js 应用程序。这个简单的服务器只是开始，但它说明了创建项目、编写服务器端代码以及为客户端响应的基本原理。\n\
    \n# 核心概念与基础\n\n全局对象与 Node.js 模块\n\n在 Node.js 领域，理解全局对象和模块化架构是开发者构建高效可扩展应用程序的基础。\n\
    \nNode.js 中的全局对象\n\n与浏览器的 JavaScript 环境中的 window 对象类似，Node.js 有一个作为顶层命名空间的全局对象。该对象提供了\
    \ Node.js 应用中所有模块均可使用的全局变量和函数。\n\n全局对象的主要特性：\n\n"
- fmt: "\n- Universally Accessible: The global object's properties are accessible\
    \ from any part of a Node.js application, making it a convenient place to store\
    \ global variables and utility functions.\n- Predefined Global Objects: Node.js\
    \ prepopulates the `global` object with several built-in objects and functions,\
    \ such as `Buffer`, `console`, and `setTimeout`, which are essential for various\
    \ application functionalities.\n\n### Example Usage:\n\n```javascript\n// Defining\
    \ a global variable\nglobal.myGlobalVar = 'This is a global variable';\n\n// Accessing\
    \ the global variable in another module\nconsole.log(myGlobalVar); // Outputs:\
    \ This is a global variable\n```\n\nHowever, overuse of the `global` object can\
    \ lead to potential conflicts and maintenance issues. It's generally recommended\
    \ to use it sparingly, preferring local scope or module exports for sharing variables\
    \ and functions.\n\n## Modular Architecture in Node.js\n\nNode.js embraces a modular\
    \ architecture, enabling developers to organize code into reusable pieces, known\
    \ as modules. A module in Node.js can be a single file or a directory of scripts\
    \ that encapsulate specific functionality, making it easy to maintain and share\
    \ code.\n\n### Core Concepts:\n\n- Core Modules: Node.js provides built-in modules\
    \ covering a wide range of functionalities, from file system operations (`fs`)\
    \ to networking (`http` and `net`).\n- Custom Modules: Developers can create their\
    \ own modules to encapsulate and structure their application logic.\n\n### Creating\
    \ and Using a Custom Module:\n\nDefine a Module: Create a file named `myModule.js`,\
    \ defining a function and exporting it using `module.exports`.\n\n```javascript\n\
    // myModule.js\nfunction sayHello(name) {\n  console.log(`Hello, ${name}!`);\n\
    }\n\nmodule.exports = sayHello;\n```\n\nImport and Use the Module: In another\
    \ file, import `myModule.js` using the `require` function and use the exported\
    \ function.\n\n```javascript\n// app.js\nconst sayHello = require('./myModule');\n\
    sayHello('Node.js User'); // Outputs: Hello, Node.js User!\n```\n\n### Advantages\
    \ of Modular Architecture:\n\n- Scalability: By dividing an application into smaller,\
    \ interdependent modules, developers can easily scale and manage complex applications.\n\
    - Reusability: Modules can be reused across different parts of an application\
    \ or even in other applications, reducing redundancy.\n- Encapsulation: Each module\
    \ in Node.js can have its own set of dependencies, encapsulated from the global\
    \ scope, which helps in avoiding naming conflicts and improves code clarity.\n\
    \n## Handling Data Streams\n\nStreams in Node.js are a core part of its functionality,\
    \ enabling efficient processing and manipulation of data flows. This concept is\
    \ critical for handling large volumes of data or for working with data that arrives\
    \ in chunks over time, such as files, network requests, or any other I/O operation.\n\
    \nAt their essence, streams in Node.js are objects that let you read data from\
    \ a source or write data to a destination in a continuous fashion. In Node.js,\
    \ streams are instances of `EventEmitter` which allow them to emit events at key\
    \ points in the stream's lifecycle, such as when new data arrives or when the\
    \ stream has been fully consumed.\n\n### Types of Streams\n\n1. **Readable Streams**:\
    \ These are streams from which data can be read. Example sources include reading\
    \ files from the filesystem or reading data from an HTTP response.\n2. **Writable\
    \ Streams**: These streams allow data to be written to them. Examples include\
    \ writing data to a file, or sending data out as an HTTP request.\n3. **Duplex\
    \ Streams**: Duplex streams are both Readable and Writable. A TCP socket is an\
    \ example, as it allows data to be both read from and written to.\n4. **Transform\
    \ Streams**: These are a type of Duplex stream where the output is computed from\
    \ the input. Examples include compression streams (`gzip`) or encryption streams.\n\
    \n### Advantages of Using Streams:\n\n- Efficiency: Streams allow processing data\
    \ as it arrives, which means you don’t have to wait for all data to be available\
    \ to start processing. This is especially useful for large volumes of data.\n\
    - Resource-Friendly: Since streams do not require loading large amounts of data\
    \ into memory, they help in building applications that are less memory-intensive.\n\
    - Composability: Streams can be `piped` together, allowing the output of one stream\
    \ to be the input of another, facilitating the creation of data processing pipelines.\n\
    \n## Handling Data with Streams\n\n### Reading Data with Readable Streams:\n\n\
    The following example demonstrates how to read from a readable stream, specifically\
    \ reading a file from the filesystem:\n\n```javascript\nconst fs = require('fs');\n\
    const readStream = fs.createReadStream('./largefile.txt', 'utf8');\n\nreadStream.on('data',\
    \ (chunk) => {\n  console.log(chunk);\n});\n\nreadStream.on('end', () => {\n \
    \ console.log('Finished reading the file.');\n});\n```\n\n### Writing Data with\
    \ Writable Streams:\n\nHere's how to write data to a file using a writable stream:\n\
    \n```javascript\nconst fs = require('fs');\nconst writeStream = fs.createWriteStream('./output.txt');\n\
    \nwriteStream.write('Hello, this is a sample text.', 'UTF8');\nwriteStream.end();\n\
    \nwriteStream.on('finish', () => {\n  console.log('Finished writing to the file.');\n\
    });\n```\n\n### Piping Streams:\n\nPiping is a mechanism to take the output of\
    \ one stream and connect it directly to the input of another. It is commonly used\
    \ for transforming data:\n\n```javascript\nconst fs = require('fs');\nconst zlib\
    \ = require('zlib');\nconst readStream = fs.createReadStream('./largefile.txt');\n\
    const gzip = zlib.createGzip();\nconst writeStream = fs.createWriteStream('./largefile.txt.gz');\n\
    \nreadStream.pipe(gzip).pipe(writeStream);\n```\n"
  raw: '*   Universally Accessible: The global object''s properties are accessible
    from any part of a Node.js application, making it a convenient place to store
    global variables and utility functions.


    *   Predefined Global Objects: Node.js prepopulates the global object with several
    built-in objects and functions, such as Buffer, console, and setTimeout, which
    are essential for various application functionalities.


    Example Usage:


    1.  // Defining a global variable


    2.  global.myGlobalVar = ''This is a global variable'';


    4.  // Accessing the global variable in another module


    5.  console.log(myGlobalVar); // Outputs: This is a global variable


    However, overuse of the global object can lead to potential conflicts and maintenance
    issues. It''s generally recommended to use it sparingly, preferring local scope
    or module exports for sharing variables and functions.


    Modular Architecture in Node.js


    Node.js embraces a modular architecture, enabling developers to organize code
    into reusable pieces, known as modules. A module in Node.js can be a single file
    or a directory of scripts that encapsulate specific functionality, making it easy
    to maintain and share code.


    Core Concepts:


    *   Core Modules: Node.js provides built-in modules covering a wide range of functionalities,
    from file system operations (fs) to networking (http and net).


    *   Custom Modules: Developers can create their own modules to encapsulate and
    structure their application logic.


    Creating and Using a Custom Module:


    Define a Module: Create a file named myModule.js, defining a function and exporting
    it using module.exports.


    1.  // myModule.js


    2.  function sayHello(name) {


    3.  console.log(`Hello, ${name}!`);


    4.  }


    6.  module.exports = sayHello;


    Import and Use the Module: In another file, import myModule.js using the require
    function and use the exported function.


    1.  // app.js


    2.  const sayHello = require(''./myModule'');


    4.  sayHello(''Node.js User''); // Outputs: Hello, Node.js User!


    Advantages of Modular Architecture:


    *   Scalability: By dividing an application into smaller, interdependent modules,
    developers can easily scale and manage complex applications.


    *   Reusability: Modules can be reused across different parts of an application
    or even in other applications, reducing redundancy.


    *   Encapsulation: Each module in Node.js can have its own set of dependencies,
    encapsulated from the global scope, which helps in avoiding naming conflicts and
    improves code clarity.


    Handling Data Streams


    Streams in Node.js are a core part of its functionality, enabling efficient processing
    and manipulation of data flows. This concept is critical for handling large volumes
    of data or for working with data that arrives in chunks over time, such as files,
    network requests, or any other type of I/O operation.


    At their essence, streams in Node.js are objects that let you read data from a
    source or write data to a destination in a continuous fashion. In Node.js, streams
    are instances of EventEmitter which allow them to emit events at key points in
    the stream''s lifecycle, such as when new data arrives or when the stream has
    been fully consumed.


    Types of Streams


    Node.js offers four main types of streams, each serving a distinct purpose:


    1.  Readable Streams: These are streams from which data can be read. Example sources
    include reading files from the filesystem or reading data from an HTTP response.


    2.  Writable Streams: These streams allow data to be written to them. Examples
    include writing data to a file, or sending data out as an HTTP request.


    3.  Duplex Streams: Duplex streams are both Readable and Writable. A TCP socket
    is an example, as it allows data to be both read from and written to.


    4.  Transform Streams: These are a type of Duplex stream where the output is computed
    from the input. Examples include compression streams (gzip) or encryption streams.


    Advantages of Using Streams


    *   Efficiency: Streams allow processing data as it arrives, which means you don’t
    have to wait for all data to be available to start processing. This is especially
    useful for large volumes of data.


    *   Resource-Friendly: Since streams do not require loading large amounts of data
    into memory, they help in building applications that are less memory-intensive.


    *   Composability: Streams can be piped together, allowing the output of one stream
    to be the input of another, facilitating the creation of data processing pipelines.


    Handling Data with Streams


    Reading Data with Readable Streams:


    The following example demonstrates how to read from a readable stream, specifically
    reading a file from the filesystem:


    1.  const fs = require(''fs'');


    2.  const readStream = fs.createReadStream(''./largefile.txt'', ''utf8'');


    4.  readStream.on(''data'', (chunk) => {


    5.  console.log(chunk);


    6.  });


    8.  readStream.on(''end'', () => {


    9.  console.log(''Finished reading the file.'');


    10.  });


    Writing Data with Writable Streams:


    Here''s how to write data to a file using a writable stream:


    1.  const fs = require(''fs'');


    2.  const writeStream = fs.createWriteStream(''./output.txt'');


    4.  writeStream.write(''Hello, this is a sample text.'', ''UTF8'');


    5.  writeStream.end();


    7.  writeStream.on(''finish'', () => {


    8.  console.log(''Finished writing to the file.'');


    9.  });


    Piping Streams:


    Piping is a mechanism to take the output of one stream and connect it directly
    to the input of another. It is commonly used for transforming data:


    1.  const fs = require(''fs'');


    2.  const zlib = require(''zlib'');


    4.  // Compress largefile.txt to largefile.txt.gz


    5.  const readStream = fs.createReadStream(''./largefile.txt'');


    6.  const gzip = zlib.createGzip();


    7.  const writeStream = fs.createWriteStream(''./largefile.txt.gz'');


    9.  readStream.pipe(gzip).pipe(writeStream);


    Basics of reading from and writing to files in a Node.js context


    Node.js''s ability to perform file system operations is one of its most powerful
    features, enabling developers to interact with the file system at a low level.
    This capability is essential for a wide range of applications, from web servers
    that need to serve files to utilities that manipulate file contents.


    The fs Module


    Node.js includes the fs (File System) module to enable interaction with the file
    system. This module provides a plethora of functions to perform file operations
    such as reading from and writing to files, both synchronously and asynchronously.
    The asynchronous versions, which use callbacks, promises (with fs.promises), or
    async/await, are preferred for non-blocking operations, crucial for maintaining
    the efficiency of Node.js applications.


    Reading Files


    Reading files in Node.js can be done using methods like fs.readFile for asynchronous
    file reading or fs.readFileSync for synchronous operations. Asynchronous methods
    are preferred due to their non-blocking nature.


    Asynchronous File Reading:


    1.  const fs = require(''fs'');


    3.  fs.readFile(''example.txt'', ''utf8'', (err, data) => {


    4.  if (err) {


    5.  console.error(err);


    6.  return;


    7.  }


    8.  console.log(data);


    9.  });


    In this example, fs.readFile is used to read example.txt asynchronously. The file''s
    contents are logged to the console once they are fully read, or an error is logged
    if something goes wrong.


    Writing Files


    Similarly, writing to files can be accomplished using fs.writeFile for asynchronous
    operations or fs.writeFileSync for synchronous ones. As with reading, the asynchronous
    approach is generally recommended.


    Asynchronous File Writing:


    1.  const fs = require(''fs'');


    3.  const content = ''Some content!'';


    5.  fs.writeFile(''example.txt'', content, ''utf8'', (err) => {


    6.  if (err) {


    7.  console.error(err);


    8.  return;


    9.  }


    10.  console.log(''File has been written'');


    11.  });


    This snippet demonstrates using fs.writeFile to write content to example.txt asynchronously.
    A confirmation message is logged to the console once the operation completes,
    or an error message if the operation fails.


