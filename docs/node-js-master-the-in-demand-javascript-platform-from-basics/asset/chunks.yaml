    10.  console.log(`Example app listening at http://localhost:${port}`);


    11.  });


    This code snippet demonstrates the simplicity of setting up a basic server with
    Express.js. The app.get method defines a route handler for GET requests to the
    root URL (/), which sends a response back to the client.


    Express.js in Web Development


    Express.js serves as the backbone for many web applications and APIs, thanks to
    its simplicity, flexibility, and rich ecosystem. It works seamlessly with other
    Node.js libraries and tools, making it a popular choice for developers looking
    to build robust and scalable web applications.


    Key Advantages in Web Development:


    *   Rapid Development: With Express.js, developers can set up servers and APIs
    much faster compared to using vanilla Node.js.


    *   Scalability: Express.js applications can be easily scaled both vertically
    and horizontally to accommodate growing traffic demands.


    *   Community and Ecosystem: A large and active community supports Express.js,
    offering numerous resources, middleware, and tools for extending its capabilities.


