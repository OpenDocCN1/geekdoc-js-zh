    Middleware in Express.js


    Middleware functions are functions that have access to the request object (req),
    the response object (res), and the next middleware function in the application’s
    request-response cycle. These functions can execute any code, make changes to
    the request and the response objects, end the request-response cycle, or call
    the next middleware function.


    Middleware is used for a wide range of purposes, from logging requests, parsing
    request bodies, to authenticating users.


    Using Middleware:


    1.  const express = require(''express'');


    2.  const app = express();


    4.  // Simple logging middleware


    5.  app.use((req, res, next) => {


    6.  console.log(`${req.method} request for ${req.url}`);


    7.  next(); // Call the next middleware or route handler


    8.  });


    10.  app.get(''/'', (req, res) => {


    11.  res.send(''Home Page'');


    12.  });


    14.  app.get(''/about'', (req, res) => {


    15.  res.send(''About Page'');


    16.  });


    18.  app.listen(3000, () => console.log(''Server running on port 3000''));


    In this example, app.use() is used to register a middleware function that logs
    the HTTP method and URL of every request. The next() call within the middleware
    is crucial as it passes control to the next middleware function in the stack.


    Middleware Types in Express.js


    There are several types of middleware that can be used in an Express.js app:


    *   Application-level middleware: Registered via app.use() or app.METHOD(), where
    METHOD is the HTTP method. These are applied globally or to specific routes.


    *   Router-level middleware: Similar to application-level middleware but bound
    to an instance of express.Router().


    *   Error-handling middleware: Defined with four arguments instead of three, used
    to handle errors.


    *   Built-in middleware: Express.js comes with built-in middleware like express.static
    to serve static files.


    *   Third-party middleware: Added by using npm to install and then requiring them
    in your app. Popular examples include body-parser (now part of Express.js) and
    cookie-parser.


    Сreating RESTful services with Node.js and Express.js


    Building RESTful APIs is a critical skill in modern web development, enabling
    the creation of scalable services that can be consumed by various clients, including
    web and mobile applications. REST (Representational State Transfer) is an architectural
    style that uses HTTP requests to access and use data. Node.js, together with Express.js,
    provides a powerful and efficient platform for building these types of APIs.


    A RESTful API adheres to certain principles that make it simple and intuitive:


    1.  Stateless: Each request from a client to a server must contain all the information
    the server needs to understand and fulfill the request. The server does not store
    any state about the client session on the server side.


    2.  Uniform Interface: The API must provide a uniform interface for interacting
    with resources, typically in the form of URIs. HTTP methods (GET, POST, PUT, DELETE)
    are used to manipulate these resources.


    3.  Resource-based: In REST, data and functionality are considered resources and
    are accessed using URIs (Uniform Resource Identifiers).


