    5.  createdAt: { type: Date, default: Date.now }


    6.  });


    8.  const User = mongoose.model(''User'', userSchema);


    4\. Performing CRUD Operations:


    With the model in place, you can perform CRUD operations. Here are examples of
    each:


    Create:


    1.  async function createUser() {


    2.  const user = new User({


    3.  name: ''John Doe'',


    4.  email: ''john@example.com'',


    5.  age: 30


    6.  });


    8.  const result = await user.save();


    9.  console.log(result);


    10.  }


    Read:


    1.  async function getUsers() {


    2.  const users = await User.find();


    3.  console.log(users);


    4.  }


    Update:


    1.  async function updateUser(id) {


    2.  const user = await User.findByIdAndUpdate(id, {


    3.  $set: { name: ''John Doe Jr.'' }


    4.  }, { new: true });


    5.  console.log(user);


    6.  }


    Delete:


    1.  async function deleteUser(id) {


    2.  const result = await User.findByIdAndRemove(id);


    3.  console.log(result);


    4.  }


    Data Validation and Sanitization


    Data validation and sanitization are critical components in developing secure
    and reliable web applications. They ensure the integrity and safety of the data
    your application processes, guarding against malicious input that could compromise
    your system or lead to unintended outcomes. We''ll look at the concepts of data
    validation and cleansing, their importance, and their implementation in Node.js
    applications, with a special focus on using Express.js and popular middleware.


    Understanding Data Validation and Sanitization


    Data Validation is the process of ensuring that input data conforms to expected
    formats and values before processing it. This step prevents malformed data from
    entering your system, which could cause errors or lead to security vulnerabilities.


    Data Sanitization goes a step further by modifying input data to ensure it is
    clean and safe for processing. This involves stripping out potentially harmful
    content, such as scripts or SQL commands, which could be used for injection attacks.


    Implementing Data Validation and Sanitization in Node.js


    In Node.js applications, especially those built with Express.js, data validation
    and sanitization can be implemented using middleware libraries such as express-validator.


    1\. Installing express-validator:


    First, add express-validator to your project:


    1.  npm install express-validator


    2\. Using express-validator for Validation and Sanitization:


    Incorporate express-validator into your route handlers to validate and sanitize
    input data. Here’s an example:


    1.  const express = require(''express'');


    2.  const { body, validationResult } = require(''express-validator'');


    4.  const app = express();


    5.  app.use(express.json());


    7.  app.post(''/register'',


    8.  // Validate and sanitize the name field


    9.  body(''name'').trim().isLength({ min: 2 }).escape(),


    10.  // Validate the email field


    11.  body(''email'').isEmail().normalizeEmail(),


    12.  // Validate the age field


    13.  body(''age'').isInt({ min: 0 }),


    15.  (req, res) => {


    16.  const errors = validationResult(req);


    17.  if (!errors.isEmpty()) {


    18.  return res.status(400).json({ errors: errors.array() });


    19.  }


    21.  // Process the validated and sanitized data


    22.  res.send(''User registration successful'');


    23.  });


    25.  app.listen(3000, () => console.log(''Server running on port 3000''));


    In this example, body(''name'').trim().isLength({ min: 2 }).escape() validates
    that the name field is at least two characters long and sanitizes it by trimming
    whitespace and escaping HTML characters. Similar validation and sanitization rules
    are applied to the email and age fields.


    Best Practices for Data Validation and Sanitization


    *   Validate and Sanitize All User Inputs: Ensure every piece of data provided
    by users or external sources is validated and sanitized, including query parameters,
    URL parameters, POST data, and even file uploads.


    *   Use Whitelisting Over Blacklisting: Define what is allowed rather than trying
    to block known bad patterns, which can be bypassed by creative attackers.


    *   Provide Clear Error Messages: When validation fails, provide users with clear,
    concise error messages that help them correct their input without revealing too
    much about the underlying validation logic or database schema.


    *   Keep Validation Logic Consistent: Apply the same validation rules on both
    the client and server sides. However, never trust client-side validation alone,
    as it can be easily bypassed.


    # Authentication and Security


    Implementing authentication in a Node.js application is used to identify users
    and provide access control to various resources in your application. Authentication
    strategies determine how users are verified before they can interact with your
    application or access its data.


    Basic authentication is a simple authentication scheme built into the HTTP protocol.
    It combines a username and password, base64 encodes this combination, and sends
    it in the Authorization header with each request.


    While basic authentication can be manually implemented, it''s generally recommended
    to use middleware like express-basic-auth for simplicity and security.


    Install express-basic-auth:


    1.  npm install express-basic-auth


    Use express-basic-auth in Your Application:


    1.  const express = require(''express'');


    2.  const basicAuth = require(''express-basic-auth'');


    4.  const app = express();


    6.  app.use(basicAuth({


    7.  users: { ''admin'': ''supersecret'' }


    8.  }));


    10.  app.get(''/protected'', (req, res) => {


    11.  res.send(''You accessed a protected route!'');


    12.  });


    14.  app.listen(3000, () => console.log(''Server running on port 3000''));


    In this example, express-basic-auth middleware is used to protect routes by requiring
    a username and password. The /protected route is accessible only if the correct
    credentials are provided.


    Token-Based Authentication (JWT)'
