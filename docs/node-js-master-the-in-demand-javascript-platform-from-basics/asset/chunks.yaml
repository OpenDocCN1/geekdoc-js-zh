    3.  if (response.status === 200) {


    4.  return response.data;


    5.  } else {


    6.  throw new Error(`API request failed with status ${response.status}`);


    7.  }


    8.  }


    Authentication


    Many third-party APIs require authentication, typically through API keys or OAuth
    tokens. Ensure you securely store and use these credentials.


