- fmt: "\nThe event loop is at the heart of Node.js's event-driven architecture. It\
    \ cycles through a series of phases, each responsible for different kinds of events.\
    \ For example, it checks for timers to see if any scheduled callbacks need to\
    \ be executed, processes pending I/O events, and handles asynchronous I/O callbacks.\
    \ This loop ensures that the application remains responsive, as it can quickly\
    \ switch between tasks without being bogged down by blocking operations.\n\n#\
    \ Setting Up Your Environment\n\nSetting up a proper development environment is\
    \ a critical first step in beginning your journey with Node.js. It ensures that\
    \ you have all the necessary tools and configurations to start building applications\
    \ efficiently.\n\n## Step 1: Installing Node.js\n\n1.1. Download Node.js: Visit\
    \ the official Node.js website to download the installer. You will find two versions\
    \ available for download: the Long Term Support (LTS) version, recommended for\
    \ most users due to its stability and extended support, and the Current version,\
    \ which includes the latest features.\n\n1.2. Run the Installer: After downloading,\
    \ run the installer. Follow the installation prompts, which will guide you through\
    \ the process of setting up Node.js on your system. This includes agreeing to\
    \ the license agreement, selecting the installation folder, and choosing the components\
    \ to install (it is generally safe to go with the defaults provided).\n\n1.3.\
    \ Verify Installation: To ensure Node.js was installed correctly, open your terminal\
    \ (Command Prompt on Windows, Terminal on macOS and Linux) and type:\n\n```\n\
    node -v\n```\n\nThis command will display the version of Node.js that was installed,\
    \ confirming that Node.js is ready to use.\n\n## Step 2: Configuring the Node\
    \ Package Manager (NPM)\n\nNPM is the default package manager for Node.js, allowing\
    \ you to install and manage libraries and dependencies for your projects.\n\n\
    2.1. Verify NPM Installation: NPM is installed automatically with Node.js. To\
    \ verify its installation, type the following command in your terminal:\n\n```bash\n\
    npm -v\n```\n\nThis will display the version of `NPM` installed, indicating it\
    \ is ready for use.\n\n2.2. Setting Up NPM: Although `NPM` works out of the box,\
    \ you may want to configure some settings (like default directory, proxy settings)\
    \ based on your project needs. For most users, the default configuration is sufficient\
    \ to start with.\n\n## Step 3: Installing a Code Editor\n\nA good code editor\
    \ can significantly enhance your coding efficiency. There are several excellent\
    \ editors available that are well-suited for Node.js development.\n\n3.1. Choose\
    \ a Code Editor: Popular choices include Visual Studio Code (VS Code), Atom, and\
    \ Sublime Text. VS Code, in particular, offers robust support for Node.js development,\
    \ with features like IntelliSense, debugging, and direct terminal access.\n\n\
    3.2. Install Extensions: After choosing your editor, consider installing extensions\
    \ or plugins that facilitate Node.js development. For VS Code, extensions like\
    \ \"Node.js Extensions Pack\" can be very helpful.\n\n## Step 4: Setting Up Version\
    \ Control\n\nVersion control is essential for managing changes to your codebase,\
    \ collaborating with others, and maintaining a history of your project's development.\n\
    \n4.1. Install Git: Visit the official Git website (`[git-scm.com](https://git-scm.com/)`)\
    \ to download and install `Git`. During installation, you can accept the default\
    \ settings, which are suitable for most users.\n\n4.2. Configure Git: Open your\
    \ terminal and set up your user name and email address with the following commands:\n\
    \n```bash\ngit config --global user.name \"Your Name\"\ngit config --global user.email\
    \ \"youremail@example.com\"\n```\n\nThese settings are important for `Git` to\
    \ track who made which changes.\n\n## Step 5: Testing Your Setup\n\nNow that you've\
    \ installed Node.js, NPM, a code editor, and Git, it's time to test your setup\
    \ by creating a simple Node.js application.\n\n5.1. Create a Test File: In your\
    \ code editor, create a new file named `app.js`. Add the following code:\n\n```javascript\n\
    console.log('Hello, Node.js!');\n```\n\n5.2. Run Your Application: Open your terminal,\
    \ navigate to the directory containing `app.js`, and run:\n\n```bash\nnode app.js\n\
    ```\n\nIf you see \"Hello, Node.js!\" printed to the console, congratulations!\
    \ You have successfully set up your Node.js development environment and are ready\
    \ to begin building applications.\n\n# Your First Node.js Code\n\nThe way of Node.js\
    \ development begins with building and running your very first application. This\
    \ experience not only solidifies your setup but also introduces you to the simplicity\
    \ and power of Node.js for creating server-side applications.\n\n## Step 1: Create\
    \ Your Project Directory\n\n1.1. First, create a new directory on your computer\
    \ where you will store your Node.js projects. You can name this directory anything\
    \ you like, for example, `node_projects`.\n\n1.2. Open your terminal or command\
    \ prompt, navigate to your newly created directory, and create a subdirectory\
    \ for your first project. Let's name this project `hello_node`:\n\n```bash\nmkdir\
    \ hello_node\ncd hello_node\n```\n\n## Step 2: Initialize Your Node.js Project\n\
    \n2.1. Inside the `hello_node` directory, initialize a new Node.js project by\
    \ running the following command:\n\n```bash\nnpm init -y\n```\n\nThis command\
    \ creates a `package.json` file in your project directory with default values.\
    \ The `package.json` file is crucial as it contains metadata about your project\
    \ and lists its dependencies.\n\n## Step 3: Write Your First Node.js Application\n\
    \n3.1. Using your preferred code editor, create a new file named `app.js` in the\
    \ `hello_node` directory.\n\n3.2. Open `app.js` and add the following code, which\
    \ creates a simple web server that responds with \"Hello, Node.js!\" when accessed:\n\
    \n```javascript\nconst http = require('http');\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n\
    \  res.end('Hello, Node.js!');\n});\n\nconst port = 3000;\nconst hostname = '127.0.0.1';\n\
    server.listen(port, hostname, () => {\n  console.log(`Server running at http://${hostname}:${port}/`);\n\
    });\n```\n\nThis code does the following:\n\n* Imports the `http` module, which\
    \ is included with Node.js and allows you to create HTTP servers.\n* Uses the\
    \ `http.createServer()` method to create a new server that listens for requests\
    \ and returns a simple response.\n* Specifies the `port` and `hostname`. In this\
    \ case, the server runs locally on your machine at `127.0.0.1:3000`.\n* Calls\
    \ `server.listen()` to start the server and listen for incoming connections.\n\
    \n## Step 4: Run Your Application\n\n4.1. Return to your terminal, ensure you\
    \ are still in the `hello_node` project directory, and start your application\
    \ by running:\n\n```bash\nnode app.js\n```\n\n4.2. You should see a message in\
    \ the terminal that says Server running at http://127.0.0.1:3000/. This indicates\
    \ that your server is running and ready to accept requests.\n\n## Step 5: Access\
    \ Your Application\n\n5.1. Open a web browser and navigate to `http://127.0.0.1:3000/`.\
    \ You should see the text \"Hello, Node.js!\" displayed in your browser. This\
    \ response comes directly from your Node.js application.\n\n5.2. Congratulations!\
    \ You have successfully created and run your first Node.js application. This simple\
    \ server is just the beginning, but it illustrates the basic principles of creating\
    \ a Node.js project, writing server-side code, and serving responses to client\
    \ requests.\n\n# Core Concepts and Basics\n\nThe Global Object and Node.js Modules\n\
    \nIn the landscape of Node.js, understanding the global object and the modular\
    \ architecture is fundamental for developers aiming to craft efficient and scalable\
    \ applications.\n\nThe Global Object in Node.js\n\nSimilar to the window object\
    \ in browser-based JavaScript environments, Node.js has a global object that serves\
    \ as the top-level namespace. This object provides access to global variables\
    \ and functions that are available across all modules in a Node.js application.\n\
    \nKey Features of the Global Object:\n"
  raw: 'The event loop is at the heart of Node.js''s event-driven architecture. It
    cycles through a series of phases, each responsible for different kinds of events.
    For example, it checks for timers to see if any scheduled callbacks need to be
    executed, processes pending I/O events, and handles asynchronous I/O callbacks.
    This loop ensures that the application remains responsive, as it can quickly switch
    between tasks without being bogged down by blocking operations.


    Setting Up Your Environment


    Setting up a proper development environment is a critical first step in beginning
    your journey with Node.js. It ensures that you have all the necessary tools and
    configurations to start building applications efficiently.


    Step 1: Installing Node.js


    1.1\. Download Node.js: Visit the official Node.js website to download the installer.
    You will find two versions available for download: the Long Term Support (LTS)
    version, recommended for most users due to its stability and extended support,
    and the Current version, which includes the latest features.


    1.2\. Run the Installer: After downloading, run the installer. Follow the installation
    prompts, which will guide you through the process of setting up Node.js on your
    system. This includes agreeing to the license agreement, selecting the installation
    folder, and choosing the components to install (it is generally safe to go with
    the defaults provided).


    1.3\. Verify Installation: To ensure Node.js was installed correctly, open your
    terminal (Command Prompt on Windows, Terminal on macOS and Linux) and type:


    1.  node -v


    This command will display the version of Node.js that was installed, confirming
    that Node.js is ready to use.


    Step 2: Configuring the Node Package Manager (NPM)


    NPM is the default package manager for Node.js, allowing you to install and manage
    libraries and dependencies for your projects.


    2.1\. Verify NPM Installation: NPM is installed automatically with Node.js. To
    verify its installation, type the following command in your terminal:


    1.  npm -v


    This will display the version of NPM installed, indicating it is ready for use.


    2.2\. Setting Up NPM: Although NPM works out of the box, you may want to configure
    some settings (like default directory, proxy settings) based on your project needs.
    For most users, the default configuration is sufficient to start with.


    Step 3: Installing a Code Editor


    A good code editor can significantly enhance your coding efficiency. There are
    several excellent editors available that are well-suited for Node.js development.


    3.1\. Choose a Code Editor: Popular choices include Visual Studio Code (VS Code),
    Atom, and Sublime Text. VS Code, in particular, offers robust support for Node.js
    development, with features like IntelliSense, debugging, and direct terminal access.


    3.2\. Install Extensions: After choosing your editor, consider installing extensions
    or plugins that facilitate Node.js development. For VS Code, extensions like "Node.js
    Extensions Pack" can be very helpful.


    Step 4: Setting Up Version Control


    Version control is essential for managing changes to your codebase, collaborating
    with others, and maintaining a history of your project''s development.


    4.1\. Install Git: Visit the official Git website ([git-scm.com](https://git-scm.com/))
    to download and install Git. During installation, you can accept the default settings,
    which are suitable for most users.


    4.2\. Configure Git: Open your terminal and set up your user name and email address
    with the following commands:


    1.  git config --global user.name "Your Name"


    2.  git config --global user.email "youremail@example.com"


    These settings are important for Git to track who made which changes.


    Step 5: Testing Your Setup


    Now that you''ve installed Node.js, NPM, a code editor, and Git, it''s time to
    test your setup by creating a simple Node.js application.


    5.1\. Create a Test File: In your code editor, create a new file named app.js.
    Add the following code:


    1.  console.log(''Hello, Node.js!'');


    5.2\. Run Your Application: Open your terminal, navigate to the directory containing
    app.js, and run:


    1.  node app.js


    If you see "Hello, Node.js!" printed to the console, congratulations! You have
    successfully set up your Node.js development environment and are ready to begin
    building applications.


    Your First Node.js Code


    The way of Node.js development begins with building and running your very first
    application. This experience not only solidifies your setup but also introduces
    you to the simplicity and power of Node.js for creating server-side applications.


    Step 1: Create Your Project Directory


    1.1. First, create a new directory on your computer where you will store your
    Node.js projects. You can name this directory anything you like, for example,
    node_projects.


    1.2. Open your terminal or command prompt, navigate to your newly created directory,
    and create a subdirectory for your first project. Let''s name this project hello_node:


    1.  mkdir hello_node


    2.  cd hello_node


    Step 2: Initialize Your Node.js Project


    2.1. Inside the hello_node directory, initialize a new Node.js project by running
    the following command:


    1.  npm init -y


    This command creates a package.json file in your project directory with default
    values. The package.json file is crucial as it contains metadata about your project
    and lists its dependencies.


    Step 3: Write Your First Node.js Application


    3.1. Using your preferred code editor, create a new file named app.js in the hello_node
    directory.


    3.2. Open app.js and add the following code, which creates a simple web server
    that responds with "Hello, Node.js!" when accessed:


    1.  const http = require(''http'');


    3.  const server = http.createServer((req, res) => {


    4.  res.statusCode = 200;


    5.  res.setHeader(''Content-Type'', ''text/plain'');


    6.  res.end(''Hello, Node.js!'');


    7.  });


    9.  const port = 3000;


    10.  const hostname = ''127.0.0.1'';


    12.  server.listen(port, hostname, () => {


    13.  console.log(`Server running at http://${hostname}:${port}/`);


    14.  });


    This code snippet does the following:


    *   Imports the http module, which is included with Node.js and allows you to
    create HTTP servers.


    *   Uses the http.createServer() method to create a new HTTP server that listens
    for requests and returns a simple text response.


    *   Specifies the hostname and port for the server. In this case, the server runs
    locally on your machine at http://127.0.0.1:3000.


    *   Calls server.listen() to start the server and listen for incoming connections
    on the specified port and hostname.


    Step 4: Run Your Application


    4.1. Return to your terminal, ensure you are still in the hello_node project directory,
    and start your application by running:


    1.  node app.js


    4.2. You should see a message in the terminal that says Server running at http://127.0.0.1:3000/.
    This indicates that your server is running and ready to accept requests.


    Step 5: Access Your Application


    5.1. Open a web browser and navigate to http://127.0.0.1:3000/. You should see
    the text "Hello, Node.js!" displayed in your browser. This response comes directly
    from your Node.js application.


    5.2. Congratulations! You have successfully created and run your first Node.js
    application. This simple server is just the beginning, but it illustrates the
    basic principles of creating a Node.js project, writing server-side code, and
    serving responses to client requests.


    # Core Concepts and Basics


    The Global Object and Node.js Modules


    In the landscape of Node.js, understanding the global object and the modular architecture
    is fundamental for developers aiming to craft efficient and scalable applications.


    The Global Object in Node.js


    Similar to the window object in browser-based JavaScript environments, Node.js
    has a global object that serves as the top-level namespace. This object provides
    access to global variables and functions that are available across all modules
    in a Node.js application.


