  raw: '​● ​Improved Testability: Because reducers are pure functions, they are easy
    to test. You can simply provide a state and an action and assert that the reducer
    returns the expected new state.


    ​● ​Better Organization: Redux enforces a clear separation of concerns, making
    it easier to organize and maintain large applications.


    ​● ​Improved Performance (with proper use):By preventing unnecessary re-renders
    with techniques like connect''s mapStateToProps and memoization, Redux can improve
    application performance.


    ​● ​Time Travel Debugging: One of the most powerful features of Redux is its ability
    to "time travel" through state changes. Redux DevTools records every action dispatched
    to the store, allowing you to replay these actions and see how the state evolved
    over time. This is invaluable for debugging complex issues.


    How Redux Solves the Problems:


    ​● ​Centralized State: By having a single store, Redux eliminates the need for
    prop drilling and makes it easy to share state between components.


    ​● ​Predictable State Updates: By requiring state updates to be initiated by actions
    and handled by pure reducers, Redux ensures that state changes are predictable
    and traceable.


    ​● ​Easy Debugging: Redux DevTools makes it easy to inspect the state and track
    state changes, making debugging much simpler.


    Redux is particularly beneficial for complex applications with:


    ​● ​Many interactive elements


    ​● ​Frequent state updates


    ​● ​Complex data flows


    ​● ​Collaborative development


    While the initial setup of Redux can seem complex, the benefits it provides in
    terms of maintainability, testability, and debugging make it a valuable tool for
    building large and complex web applications.


    ## Chapter 8\. Building a Single-Page Application (SPA) with React and Redux


    ### Setting up a React Project with Create React App


    Single-Page Applications (SPAs) have become a popular way to build modern web
    applications. Unlike traditional multi-page applications that require a full page
    reload for each navigation, SPAs load a single HTML page and dynamically update
    the content as the user interacts with the application. This provides a smoother
    and more responsive user experience. Combining React, a powerful JavaScript library
    for building user interfaces, with Redux, a predictable state management library,
    allows for the creation of robust and maintainable SPAs. This chapter will guide
    you through the process of building an SPA with React and Redux.


    Setting up a React Project with Create React App


    Create React App (CRA) is an officially supported tool for quickly setting up
    new React projects. It provides a pre-configured development environment with
    sensible defaults, allowing you to focus on writing code rather than configuring
    build tools.


    Prerequisites


    Before you begin, ensure you have Node.js and npm (Node Package Manager) or yarn
    installed on your system. You can download Node.js from the official website (nodejs.org).
    npm is included with Node.js, and yarn can be installed separately.


    Creating a New Project


    To create a new React project using CRA, open your terminal or command prompt
    and navigate to the directory where you want to create your project. Then, run
    the following command:1


    Bash


    npx create-react-app my-spa-app


    # or using yarn:


    yarn create react-app my-spa-app


    Replace my-spa-app with the desired name for your project.


    This command will create a new directory named my-spa-app containing the basic
    project structure and all necessary dependencies.


    Project Structure


    After the command completes, navigate into the project directory:


    Bash


    cd my-spa-app


    The generated project structure will look something like this:


    my-spa-app/


    ├── node_modules/


    ├── public/


    │   ├── index.html


    │   └── favicon.ico


    ├── src/


    │   ├── App.js


    │   ├── App.css


    │   ├── index.js


    │   ├── index.css


    │   ├── logo.svg


    │   └── ... other files


    ├── .gitignore


    ├── package.json


    └── README.md


    Here''s a brief explanation of some of the key files and directories:


    ​● ​node_modules/: This directory contains all the project''s dependencies.


    ​● ​public/: This directory contains static assets, such as index.htmland favicon.ico.


    ​● ​src/: This directory contains the project''s source code.


    ​○ ​App.js: The main application component.


    ​○ ​index.js: The entry point for the application.


    ​○ ​index.css: Global styles for the application.


    ​● ​package.json: This file contains project metadata and dependencies.


    Starting the Development Server


    To start the development server, run the following command from the project directory:


    Bash


    npm start


    # or using yarn:


    yarn start


    This will open your application in a new browser tab at http://localhost:3000.
    Any changes you make to the source code will automatically reload the page.


    Cleaning Up the Default Project


    The default CRA project includes some boilerplate code and files that you might
    not need. You can safely remove the following:


    ​● ​src/logo.svg


    ​● ​The import of logo.svgin src/App.js


    ​● ​The default styling in src/App.css if you plan to use your own styling approach.


    Installing Redux and React-Redux


    To use Redux in your React application, you need to install the reduxand react-redux packages:


    Bash


    npm install @reduxjs/toolkit react-redux


    # or using yarn:


    yarn add @reduxjs/toolkit react-redux


    We install @reduxjs/toolkitinstead of redux directly as it includes everything
    we need and simplifies Redux development considerably.


    Setting up the Redux Store


    Now that you have React and Redux installed, you can set up the Redux store. Create
    a new file in the srcdirectory called store.js(or app/store.jsif you prefer a
    dedicated appfolder). In this file, you''ll configure your Redux store using Redux
    Toolkit’s configureStore:


    JavaScript


    import { configureStore } from  ''@reduxjs/toolkit'';


    import counterReducer from  ''./features/counter/counterSlice''; // Example slice


    export  const store = configureStore({


    reducer: {


    counter: counterReducer,


    // Add other reducers here


    },


    });


    // Infer the `RootState` and `AppDispatch` types from the store itself


    export type RootState = ReturnType<typeof store.getState>


    // Inferred type: {posts: PostsState, comments: CommentsState, users: UsersState}


    export type AppDispatch = typeof store.dispatch


    This code sets up a Redux store with an example reducer (we''ll create this later).


    Providing the Store to React


    To make the Redux store available to your React components, you need to wrap your
    application with the <Provider>component from react-redux. Open src/index.js and
    modify it as follows:


    JavaScript


    import React from  ''react'';


    import ReactDOM from  ''react-dom/client'';


    import App from  ''./App'';


    import { Provider } from  ''react-redux'';


    import { store } from  ''./store'';


    import  ''./index.css'';


    const root = ReactDOM.createRoot(document.getElementById(''root''));


    root.render(


    <React.StrictMode>


    <Provider  store={store}>


    <App />


    </Provider>


    </React.StrictMode>


    );


    Now, all components within your application have access to the Redux store.


    This section has covered the initial setup of a React project with Create React
    App and the integration of Redux. With this foundation, you can start building
    the features and functionality of your SPA. The following sections will cover
    creating reducers, actions, and connecting components to the Redux store.


    ### Integrating Redux with React Components


    Now that you have your React project set up with Redux, you can start connecting
    your components to the Redux store. This allows your components to access and
    modify the application''s state in a predictable manner.


    Creating a Slice (Reducer and Actions)


    Before connecting components, you need to define how your state will be structured
    and how it can be updated. This is done using Redux Toolkit''s createSlice().


    Create a new folder in srccalled featuresand inside create a new folder called
    counter. Inside the counterfolder create a file called counterSlice.js and add
    the following code:'
