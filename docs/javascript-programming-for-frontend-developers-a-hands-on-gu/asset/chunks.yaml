  trans: "\n\n- `getState()`: 返回 store 的当前状态。\n- `dispatch(action)`: 分发一个 action 来更新状态。\n\
    - `subscribe(listener)`: 注册一个监听函数，每当状态发生变化时该函数都会被调用。\n\n# Actions (动作)\n\nActions\
    \ 是普通的 JavaScript 对象，描述了改变状态的意图。它们必须有一个 `type` 属性，该字符串用于标识正在执行的 action 类型。Actions\
    \ 还可以通过 `payload` 属性包含额外的数据。\n\n以下是一些 action 的示例：\n\n```javascript\n// 用于 递增计数器的\
    \ action\nconst incrementAction = {\n  type: 'INCREMENT'\n};\n\n// 向列表添加新项的 action\n\
    const addItemAction = {\n  type: 'ADD_ITEM',\n  payload: { id: 1, text: 'New Item'\
    \ }\n};\n```\n\n使用 `dispatch()` 方法将 action 分发到 store：\n\n```javascript\nstore.dispatch(incrementAction);\n\
    store.dispatch(addItemAction);\n```\n\n分发 action 是在 Redux 应用中更改状态的唯一方式。\n\n# Reducers\
    \ (还原器)\n\nReducers 是纯函数，它们接收当前状态和 action 作为参数，并返回一个新状态。它们负责根据 action 类型决定如何更新状态。\n\
    \n以下是一个 reducer 的示例：\n\n```javascript\nconst reducer = (state = { count: 0, items:\
    \ [] }, action) => {\n  switch (action.type) {\n    case 'INCREMENT':\n      return\
    \ { ...state, count: state.count + 1 }; // 创建一个新的状态对象\n    case 'ADD_ITEM':\n\
    \      return { ...state, items: [...state.items, action.payload] }; // 创建一个新的状态对象\n\
    \    default:\n      return state; // 如果 action 类型不被识别，则返回当前状态\n  }\n};\n```\n\
    \n关于 reducers 的关键点：\n- **纯函数 (Pure Functions)**: Reducers 必须是纯函数。这意味着它们不应该有任何副作用（例如：修改原始状态、调用\
    \ API）。它们应该只根据给定的状态和 action 计算新状态。\n- **不可变性 (Immutability)**: Reducers 不应该修改现有的状态。相反，它们应该创建一个带有更新值的新状态对象。这对于\
    \ Redux 检测状态变化并触发 UI 更新至关重要。通常使用扩展语法 `(...)` 来创建新的对象和数组而不修改原始对象。\n- **默认状态 (Default\
    \ State)**: Reducers 应该在第一个参数中提供默认状态。这在 store 初始化时被使用。\n- **处理未知 Actions**: 如果\
    \ reducer 接收到一个不识别的 action 类型，应该始终返回当前状态。\n\n# 连接各个部分 (Connecting the Pieces)\n\
    \nstore、actions 和 reducers 在循环中共同工作：\n\n1. 使用 `store.dispatch(action)` 将 action\
    \ 分发到 store。\n2. store 将当前状态和 action 传递给 reducer。\n3. reducer 根据 action 类型计算新状态。\n\
    4. store 使用 reducer 返回的新状态更新其内部状态。\n5. 任何通过 `store.subscribe()` 注册的监听器都会收到状态变化的通知。\n\
    \n这种可预测的流程使得更容易理解 Redux 应用中状态是如何变化的，从而使调试和测试变得简单得多。本章涵盖了 Redux 的基础构建模块。接下来的章节将介绍更高级的主题和实际应用。\n\
    \n# 使用 React-Redux 将 React 组件连接到 Redux Store\n\n虽然 Redux 可以与任何 JavaScript 框架配合使用，甚至可以在不使用框架的情况下使用，但它通常与\
    \ React 一起使用。`react-redux` 库为将 React 组件连接到 Redux store 提供了方便工具。\n\n## 安装 React-Redux\n\
    \n如果你使用 npm 或 yarn，可以使用以下命令安装 `react-redux`：\n\n```bash\nnpm install react-redux\n\
    # 或\nyarn add react-redux\n```\n\n## <Provider> 组件\n\n来自 `react-redux` 的 `<Provider>`\
    \ 组件使得 Redux store 对应用程序中的所有组件可用。它应该渲染在组件树的顶层。\n\n```javascript\nimport React\
    \ from 'react';\nimport ReactDOM from 'react-dom/client';\nimport { Provider }\
    \ from 'react-redux';\nimport { createStore } from 'redux';\nimport App from './App';\n\
    import reducer from './reducer'; // 你的 Reducer\n\nconst store = createStore(reducer);\n\
    const root = ReactDOM.createRoot(document.getElementById('root'));\nroot.render(\n\
    \  <Provider store={store}>\n    <App />\n  </Provider>\n);\n```\n\n通过用 `<Provider\
    \ store={store}>` 包裹你的 `<App>` 组件，`<App>` 内部的所有组件都可以访问 Redux store。\n\n## connect()\
    \ 函数\n\n来自 `react-redux` 的 `connect()` 函数将 React 组件连接到 Redux store。它接收两个可选参数：`mapStateToProps`\
    \ 和 `mapDispatchToProps`。\n\n- `mapStateToProps(state)`: 此函数接收整个 Redux store 状态作为参数，并返回一个包含组件所需的特定状态部分的对象。\n\
    - `mapDispatchToProps(dispatch)`: 此函数接收 `dispatch` 函数作为参数，并返回一个包含分发 action 的函数的对象。\n\
    \n`connect()` 返回一个新的连接后的组件。\n\n以下是一个示例：\n\n```javascript\nimport React from 'react';\n\
    import { connect } from 'react-redux';\nconst Counter = ({ count, increment, decrement\
    \ }) => {\n  return (\n    <div>\n      <p>Count: {count}</p>\n      <button onClick={increment}>Increment</button>\n\
    \      <button onClick={decrement}>Decrement</button>\n    </div>\n  );\n};\n\n\
    const mapStateToProps = (state) => {\n  return {\n    count: state.count\n  };\n\
    };\n\nconst mapDispatchToProps = (dispatch) => {\n  return {\n    increment: ()\
    \ => dispatch({ type: 'INCREMENT' }),\n    decrement: () => dispatch({ type: 'DECREMENT'\
    \ })\n  };\n};\n\nexport default connect(mapStateToProps, mapDispatchToProps)(Counter);\n\
    ```\n\n让我们拆解一下：\n1. 我们从 `react-redux` 导入 `connect`。\n2. `Counter` 组件接收 `count`、`increment`\
    \ 和 `decrement` 作为 props。\n3. `mapStateToProps` 获取状态并返回包含 `count` 的对象，这作为 prop\
    \ 传递给 `Counter`。\n4. `mapDispatchToProps` 接收 `dispatch` 并返回包含 `increment` 和 `decrement`\
    \ 函数的对象，这些函数调用时会分发相应的 action。\n5. `connect(mapStateToProps, mapDispatchToProps)(Counter)`\
    \ 创建了一个连接版本。\n\n## 使用 Hooks 简化 (useSelector 和 useDispatch)\n\nReact-Redux 还提供了简化连接\
    \ store 的 hooks，使得代码更加简洁，特别是对于函数组件。\n\n- `useSelector(selector)`: 此 hook 接收一个选择器函数（类似于\
    \ `mapStateToProps`）并返回被选的状态。\n- `useDispatch()`: 此 hook 返回 `dispatch` 函数。\n\n\
    这是使用 hooks 的相同示例：\n\n```javascript\nimport React from 'react';\nimport { useSelector,\
    \ useDispatch } from 'react-redux';\nconst Counter = () => {\n  const count =\
    \ useSelector(state => state.count);\n  const dispatch = useDispatch();\n  return\
    \ (\n    <div>\n      <p>Count: {count}</p>\n      <button onClick={() => dispatch({\
    \ type: 'INCREMENT' })}>Increment</button>\n      <button onClick={() => dispatch({\
    \ type: 'DECREMENT' })}>Decrement</button>\n    </div>\n  );\n};\n\nexport default\
    \ Counter;\n```\n\n这个版本简单得多。我们使用 `useSelector` 从状态中获取计数，使用 `useDispatch` 获取 `dispatch`\
    \ 函数。然后我们在事件处理器中直接分发 action。\n\n# 实际考虑因素\n\n- **在 connect() 和 Hooks 之间选择**: 对于使用函数组件的新项目，通常是\
    \ hooks，因为它们更简单。`connect()` 对于类组件和更复杂的场景仍然适用。\n- **性能**: `react-redux` 通过防止不必要的重新渲染来优化渲染。然而，必须高效地构建状态和选择器以避免大型应用程序中出现性能问题。\n\
    - **选择器 (Selectors)**: 创建可重用的选择器函数可以提高性能和代码组织。\n\n"
- fmt: "\nBy using `react-redux` and either `connect()` or the hooks, you can effectively\
    \ connect your React components to the Redux store, enabling efficient and predictable\
    \ state management in your applications. This section provides the tools to integrate\
    \ Redux into React projects.\n\n# Redux Toolkit: Simplifying Redux Development\n\
    \nWhile Redux provides a powerful and predictable way to manage state, setting\
    \ up a Redux store and writing reducers and actions can involve a significant\
    \ amount of boilerplate code. Redux Toolkit (RTK) is designed to address this\
    \ issue by providing a set of utilities that simplify common Redux tasks. It's\
    \ considered the standard way to write Redux logic today.\n\n## Key Features of\
    \ Redux Toolkit\n\nRedux Toolkit offers several key features that streamline Redux\
    \ development:\n\n- `configureStore()`: Simplifies store setup, including setting\
    \ up middleware (like `Redux Thunk` for asynchronous actions) and enabling the\
    \ Redux DevTools Extension.\n- `createSlice()`: Simplifies reducer and action\
    \ creation. It generates action creators and action types automatically based\
    \ on the reducer logic you define.\n- `createAsyncThunk()`: Simplifies handling\
    \ asynchronous logic, such as fetching data from APIs. It generates action creators\
    \ that manage the different stages of an asynchronous operation (pending, fulfilled,\
    \ rejected).\n- `Immutability Helpers`: While not strictly part of RTK itself,\
    \ it strongly encourages the use of `Immer` for simplified immutable updates within\
    \ reducers.\n\n## Setting up a Store with configureStore()\n\nSetting up a store\
    \ with `configureStore()` is much simpler than using `createStore` directly.\n\
    \n```javascript\nimport { configureStore } from '@reduxjs/toolkit';\nimport counterReducer\
    \ from './counterSlice'; // Your slice reducer\n\nconst store = configureStore({\n\
    \  reducer: {\n    counter: counterReducer, // Add your reducers here\n    //\
    \ Other reducers...\n  }\n});\n\nexport default store;\n```\n\n`configureStore()`\
    \ automatically sets up the Redux DevTools Extension (if installed in the browser)\
    \ and includes middleware for common use cases.\n\n## Creating Slices with createSlice()\n\
    \n`createSlice()` is the most important tool in Redux Toolkit. It simplifies the\
    \ creation of reducers and actions.\n\n```javascript\nimport { createSlice } from\
    \ '@reduxjs/toolkit';\n\nconst counterSlice = createSlice({\n  name: 'counter',\
    \ // The name of the slice\n  initialState: {\n    value: 0\n  },\n  reducers:\
    \ {\n    increment: (state) => {\n      state.value += 1; // \"Mutating\" logic\
    \ is okay here thanks to Immer\n    },\n    decrement: (state) => {\n      state.value\
    \ -= 1;\n    },\n    incrementByAmount: (state, action) => {\n      state.value\
    \ += action.payload;\n    }\n  }\n});\n\n// Export the action creators and the\
    \ reducer\nexport const { increment, decrement, incrementByAmount } = counterSlice.actions;\n\
    export default counterSlice.reducer;\n```\n\n**Key points about createSlice():**\n\
    \n- `name`: The name of the slice, used as a prefix for action types.\n- `initialState`:\
    \ The initial state for this slice.\n- `reducers`: An object where the keys are\
    \ the names of the actions, and the values are the reducer functions.\n\nNotice\
    \ that we’re “mutating” the state directly inside the reducers. This is made possible\
    \ by `Immer`, which is included in Redux Toolkit. `Immer` uses a “draft state”\
    \ that allows you to write mutating logic, but it then produces a new immutable\
    \ state under the hood.\n\n`createSlice()` automatically generates action creators\
    \ with the same names as the reducer functions. We can then import and use these\
    \ action creators in our components.\n\n## Handling Asynchronous Actions with\
    \ createAsyncThunk()\n\n`createAsyncThunk()` simplifies handling asynchronous\
    \ logic, like fetching data from APIs.\n\n```javascript\nimport { createAsyncThunk\
    \ } from '@reduxjs/toolkit';\n\n// Define the async thunk\nexport const fetchUserById\
    \ = createAsyncThunk(\n  'users/fetchByIdStatus', // Action type prefix\n  async\
    \ (userId, thunkAPI) => {\n    const response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \    return await response.json();\n  }\n);\n```\n\n`createAsyncThunk()` takes\
    \ two arguments:\n\n- A string that will be used as a prefix for the generated\
    \ action types.\n- An async function that performs the asynchronous operation.\n\
    \n`createAsyncThunk()` generates three action types automatically:\n\n- `pending`:\
    \ Dispatched when the asynchronous operation starts.\n- `fulfilled`: Dispatched\
    \ when the asynchronous operation is successful.\n- `rejected`: Dispatched when\
    \ the asynchronous operation fails.\n\nYou can then handle these actions in your\
    \ reducers:\n\n```javascript\nconst usersSlice = createSlice({\n  name: 'users',\n\
    \  initialState: {\n    user: null,\n    loading: false,\n    error: null\n  },\n\
    \  reducers: {},\n  extraReducers: (builder) => {\n    builder.addCase(fetchUserById.pending,\
    \ (state) => {\n      state.loading = true;\n    });\n    builder.addCase(fetchUserById.fulfilled,\
    \ (state, action) => {\n      state.loading = false;\n      state.user = action.payload;\n\
    \    });\n    builder.addCase(fetchUserById.rejected, (state, action) => {\n \
    \     state.loading = false;\n      state.error = action.error.message;\n    });\n\
    \  }\n});\n```\n\n`extraReducers` allows you to handle actions that are defined\
    \ outside of the slice itself, such as the actions generated by `createAsyncThunk()`.\n\
    \n## Benefits of Redux Toolkit\n\nRedux Toolkit offers several significant benefits:\n\
    \n- **Reduced Boilerplate**: It significantly reduces the amount of boilerplate\
    \ code required to set up and use Redux.\n- **Simplified Syntax**: It provides\
    \ a more concise and intuitive API.\n- **Best Practices**: It encourages best\
    \ practices, such as using `Immer` for immutable updates and using `Redux Thunk`\
    \ for asynchronous actions.\n- **Improved Developer Experience**: It makes Redux\
    \ development faster and more enjoyable.\n\nRedux Toolkit is the recommended approach\
    \ for writing Redux logic today. It simplifies common tasks and promotes best\
    \ practices, making it easier to build and maintain complex Redux applications.\
    \ This concludes Chapter 7.\n\n# Did You Know? The motivation behind creating\
    \ Redux and its benefits for complex applications\n\nRedux was created by Dan\
    \ Abramov and Andrew Clark, inspired by `Flux`, an architectural pattern developed\
    \ by Facebook for managing state in complex user interfaces. Before Redux, managing\
    \ state in large JavaScript applications, especially those using React, could\
    \ become very difficult. Here’s a look at the problems Redux was designed to solve\
    \ and the advantages it brings:\n\n### The Problems Redux Addresses:\n\n- **Complex\
    \ State Management**: As applications grow, managing state becomes increasingly\
    \ complex. State updates can occur in multiple parts of the application, making\
    \ it difficult to track how and why the state changes. This can lead to bugs that\
    \ are hard to reproduce and fix.\n- **Prop Drilling**: In React applications,\
    \ passing data down through multiple levels of components (prop drilling) can\
    \ become cumbersome and lead to tightly coupled components. This makes it difficult\
    \ to reuse components and maintain the application.\n- **Unpredictable State Updates**:\
    \ Without a centralized state management solution, state updates can occur in\
    \ an unpredictable order, making it difficult to reason about the application's\
    \ behavior.\n\n### The Benefits Redux Offers:\n\nRedux addresses these problems\
    \ by providing a centralized and predictable way to manage application state.\
    \ Here are some of the key benefits:\n\n- **Centralized State**: Redux provides\
    \ a single store that holds the entire application state. This makes it easy to\
    \ access and update state from any component in the application.\n- **Predictable\
    \ State Updates**: State updates in Redux are predictable because they are initiated\
    \ by actions and handled by pure reducers. This makes it easier to understand\
    \ how and why the state changes.\n- **Easy Debugging**: Redux DevTools provides\
    \ a powerful tool for debugging Redux applications. It allows you to inspect the\
    \ state, view dispatched actions, and even time travel through state changes.\n"
  raw: 'By using react-reduxand either connect() or the hooks, you can effectively
    connect your React components to the Redux store, enabling efficient and predictable
    state management in your applications. This section provides the tools to integrate
    Redux into React projects.


    ### Redux Toolkit: Simplifying Redux Development


    While Redux provides a powerful and predictable way to manage state, setting up
    a Redux store and writing reducers and actions can involve a significant amount
    of boilerplate code. Redux Toolkit (RTK) is designed to address this issue by
    providing a set of utilities that simplify common Redux tasks. It''s considered
    the standard way to write Redux logic today.


    Key Features of Redux Toolkit


    Redux Toolkit offers several key features that streamline Redux development:


    ​● ​configureStore(): Simplifies store setup, including setting up middleware
    (like Redux Thunk for asynchronous actions) and enabling the Redux DevTools Extension.


    ​● ​createSlice(): Simplifies reducer and action creation. It generates action
    creators and action types automatically based on the reducer logic you define.


    ​● ​createAsyncThunk(): Simplifies handling asynchronous logic, such as fetching
    data from APIs. It generates action creators that manage the different stages
    of an asynchronous operation (pending, fulfilled, rejected).


    ​● ​Immutability Helpers: While not strictly part of RTK itself, it strongly encourages
    the use of Immer for simplified immutable updates within reducers.


    Setting up a Store with configureStore()


    Setting up a store with configureStore()is much simpler than using createStore directly.


    JavaScript


    import { configureStore } from  ''@reduxjs/toolkit'';


    importcounterReducer from ''./counterSlice''; // Your slice reducer


    const store = configureStore({


    reducer: {


    counter: counterReducer, // Add your reducers here


    // Other reducers...


    }


    });


    export  default store;


    configureStore() automatically sets up the Redux DevTools Extension (if installed
    in the browser) and includes middleware for common use cases.


    Creating Slices with createSlice()


    createSlice() is the most important tool in Redux Toolkit. It simplifies the creation
    of reducers and actions.


    JavaScript


    import { createSlice } from  ''@reduxjs/toolkit'';


    const counterSlice = createSlice({


    name: ''counter'', // The name of the slice


    initialState: {


    value: 0


    },


    reducers: {


    increment: (state) => {


    state.value += 1; // "Mutating" logic is okay here thanks to Immer


    },


    decrement: (state) => {


    state.value -= 1;


    },


    incrementByAmount: (state, action) => {


    state.value += action.payload;


    }


    }


    });


    // Export the action creators and the reducer


    export const { increment, decrement, incrementByAmount } = counterSlice.actions;


    export  default counterSlice.reducer;


    Key points about createSlice():


    ​● ​name: The name of the slice, used as a prefix for action types.


    ​● ​initialState: The initial state for this slice.


    ​● ​reducers: An object where the keys are the names of the actions, and the values
    are the reducer functions.


    Notice that we’re “mutating” the state directly inside the reducers. This is made
    possible by Immer, which is included in Redux Toolkit. Immer uses a “draft state”
    that allows you to write mutating logic, but it then produces a new immutable
    state under the hood.


    createSlice() automatically generates action creators with the same names as the
    reducer functions. We can then import and use these action creators in our components.


    Handling Asynchronous Actions with createAsyncThunk()


    createAsyncThunk() simplifies handling asynchronous logic, like fetching data
    from APIs.


    JavaScript


    import { createAsyncThunk } from  ''@reduxjs/toolkit'';


    // Define the async thunk


    export  const fetchUserById = createAsyncThunk(


    ''users/fetchByIdStatus'', // Action type prefix


    async (userId, thunkAPI) => {


    const response = await fetch(`https://api.example.com/users/${userId}`);


    return  await response.json();


    }


    );


    createAsyncThunk() takes two arguments:


    ​● ​A string that will be used as a prefix for the generated action types.


    ​● ​An async function that performs the asynchronous operation.


    createAsyncThunk() generates three action types automatically:


    ​● ​pending: Dispatched when the asynchronous operation starts.


    ​● ​fulfilled: Dispatched when the asynchronous operation is successful.


    ​● ​rejected: Dispatched when the asynchronous operation fails.


    You can then handle these actions in your reducers:


    JavaScript


    const usersSlice = createSlice({


    name: ''users'',


    initialState: {


    user: null,


    loading: false,


    error: null


    },


    reducers: {},


    extraReducers: (builder) => {


    builder.addCase(fetchUserById.pending, (state) => {


    state.loading = true;


    });


    builder.addCase(fetchUserById.fulfilled, (state, action) => {


    state.loading = false;


    state.user = action.payload;


    });


    builder.addCase(fetchUserById.rejected, (state, action) => {


    state.loading = false;


    state.error = action.error.message;


    });


    }


    });


    extraReducersallows you to handle actions that are defined outside of the slice
    itself, such as the actions generated by createAsyncThunk().


    Benefits of Redux Toolkit


    Redux Toolkit offers several significant benefits:


    ​● ​Reduced Boilerplate: It significantly reduces the amount of boilerplate code
    required to set up and use Redux.


    ​● ​Simplified Syntax: It provides a more concise and intuitive API.


    ​● ​Best Practices: It encourages best practices, such as using Immer for immutable
    updates and using Redux Thunk for asynchronous actions.


    ​● ​Improved Developer Experience: It makes Redux development faster and more
    enjoyable.


    Redux Toolkit is the recommended approach for writing Redux logic today. It simplifies
    common tasks and promotes best practices, making it easier to build and maintain
    complex Redux applications. This concludes Chapter 7.


    ### Did You Know? The motivation behind creating Redux and its benefits for complex
    applications


    Redux was created by Dan Abramov and Andrew Clark, inspired by Flux, an architectural
    pattern developed by Facebook for managing state in complex user interfaces. Before
    Redux, managing state in large JavaScript applications, especially those using
    React, could become very difficult. Here’s a look at the problems Redux was designed
    to solve and the advantages it brings:


    The Problems Redux Addresses:


    ​● ​Complex State Management: As applications grow, managing state becomes increasingly
    complex. State updates can occur in multiple parts of the application, making
    it difficult to track how and why the state changes. This can lead to bugs that
    are hard to reproduce and fix.


    ​● ​Prop Drilling: In React applications, passing data down through multiple levels
    of components (prop drilling) can become cumbersome and lead to tightly coupled
    components. This makes it difficult to reuse components and maintain the application.


    ​● ​Unpredictable State Updates: Without a centralized state management solution,
    state updates can occur in an unpredictable order, making it difficult to reason
    about the application''s behavior.


    The Benefits Redux Offers:


    Redux addresses these problems by providing a centralized and predictable way
    to manage application state. Here are some of the key benefits:


    ​● ​Centralized State: Redux provides a single store that holds the entire application
    state. This makes it easy to access and update state from any component in the
    application.


    ​● ​Predictable State Updates: State updates in Redux are predictable because
    they are initiated by actions and handled by pure reducers. This makes it easier
    to understand how and why the state changes.


    ​● ​Easy Debugging:Redux DevTools provides a powerful tool for debugging Redux
    applications. It allows you to inspect the state, view dispatched actions, and
    even time travel through1 state changes.'
