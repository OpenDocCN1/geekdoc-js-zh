    ​● ​console.table(data): Displays data in a tabular format.


    ​● ​console.group(label)and console.groupEnd(): Groups related console messages
    together.


    Example:


    JavaScript


    function  myFunction(a, b) {


    console.log(''a:'', a);


    console.log(''b:'', b);


    const sum = a + b;


    console.log(''sum:'', sum);


    return sum;


    }


    myFunction(5, 10);


    This will output the values of a, b, and sum to the console, helping you understand
    the flow of your code.


    Setting Breakpoints in the Sources Panel


    Breakpoints allow you to pause the execution of your JavaScript code at a specific
    line. This is extremely useful for inspecting variables and understanding the
    state of your application at a particular point in time.


    To set a breakpoint:


    ​1\. ​Open the Sources panel.


    ​2\. ​Navigate to the JavaScript file you want to debug.


    ​3\. ​Click on the line number where you want to set the breakpoint. A blue marker
    will appear.


    When your code reaches the breakpoint, execution will pause. You can then use
    the debugger controls to:


    ​● ​Step over: Execute the current line and move to the next line.


    ​● ​Step into: Step into a function call.


    ​● ​Step out: Step out of the current function.


    ​● ​Resume: Continue execution until the next breakpoint or the end of the script.


    Inspecting Variables and Scope


    When execution is paused at a breakpoint, you can inspect the values of variables
    in the Scope panel (usually located in the right-hand sidebar of the Sources panel).
    This allows you to see the current values of variables in the current scope, as
    well as variables in parent scopes (closures).


    Using Watch Expressions


    Watch expressions allow you to monitor the value of an expression as your code
    executes. You can add watch expressions in the Watch panel (also usually in the
    right-hand sidebar of the Sources panel). The value of the expression will be
    updated automatically as you step through your code.


    Debugging Asynchronous Code


    Debugging asynchronous code can be more challenging. However, DevTools provides
    features to help:


    ​● ​Async stack traces: DevTools can often show the call stack that led to an
    asynchronous operation, even if the code execution jumps between different functions
    or event handlers.


    ​● ​Breakpoints in event listeners and promises:You can set breakpoints inside
    event handlers or .then() callbacks of Promises to inspect the state at different
    stages of an asynchronous operation.


    Debugging React Components


    The React DevTools extension (available for Chrome and Firefox) provides additional
    tools for debugging React components. It allows you to inspect the component tree,
    props, and state, making it easier to understand how your components are rendering
    and interacting.


    Practical Tips for Debugging


    ​● ​Use console.log() strategically:Use console.log() to output important information
    about your code’s execution.


    ​● ​Use breakpoints effectively: Set breakpoints at key points in your code to
    inspect variables and understand the program flow.


    ​● ​Use watch expressions for monitoring values: Watch expressions can help you
    track how values change over time.


    ​● ​Use the Network panel for API debugging: Inspect network requests and responses
    to identify API issues.


    ​● ​Use React DevTools for React-specific debugging: Inspect component props,
    state, and the component tree.


    By mastering these debugging techniques using Browser DevTools, you can effectively
    identify and fix errors in your JavaScript code, leading to more robust and reliable
    applications.


    ## Try It Yourself Exercise 3


    Writing unit tests for a JavaScript function


    This exercise involves writing unit tests for a utility function that formats
    a phone number. This will give you experience with setting up a test file, writing
    test cases, and using Jest matchers.'
