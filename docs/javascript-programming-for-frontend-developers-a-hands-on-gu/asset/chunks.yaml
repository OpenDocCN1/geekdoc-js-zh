  trans: "\n\n<img src=\"my-image.jpg\" loading=\"lazy\" alt=\"My image\" />\n\n-\
    \ **懒加载组件**（如上文代码分割示例）：使用 `React` 的 `lazy` 和 `Suspense` 是懒加载组件的一种强大方式。\n- **Intersection\
    \ Observer API**：此 `API` 允许你观察元素何时进入或离开视口。你可以用它在资源变得可见时触发加载。这是一种更高级的技巧，可以让你对加载过程进行细粒度的控制。\n\
    \n## 代码分割与懒加载的优势\n\n- **改进初始加载时间**：通过仅预先加载必要的代码和资源，你可以显著缩短初始页面加载时间。\n- **减少带宽消耗**：通过延迟加载不必要的资源，你可以减少需要下载的数据量，特别是对于连接较慢或使用移动设备的用户而言。如此。\n\
    - **提升用户体验**：加载速度更快的网站能提供更好的用户体验，从而提高互动率和转化率。\n\n## 实际考虑因素\n\n- **找到合适的分割点**：选择合适的代码分割位置非常重要。你应该尝试根据逻辑边界（如路由、组件或功能）来分割你的代码。\n\
    - **处理加载状态**：在资源加载期间向用户提供反馈是关重要的。使用加载指示或占位符可以提升用户体验。\n- **测试懒加载组件**：你需要确保你的测试考虑了懒加载的异步性质。`React\
    \ Testing Library` 提供了帮助解决此问题的工具。\n\n代码分割和懒加载是优化现代 Web 应用性能的关键技术。通过实现这些技术，你可以创建更快、响应更迅速且对用户友好的网站。\n\
    \n## 图像优化与资产管理\n\n图像是大多数网站的关键部分，增加了视觉吸引力并增强了用户体验。然而，未优化的图像会严重影响网站性能，导致加载速度缓慢和用户体验糟糕。因此，有效的资产管理（特别是针对图像）对于创建快速高效的网站至关重要。\n\
    \n### 为什么图像优化很重要\n\n较大的图像文件可能需要很长时间下载，尤其是在连接较慢的网络下。这会导致页面加载缓慢，让用户感到沮丧并可能导致访客离开。相反，优化的图像加载速度快，可以改善用户体验并可能提升\
    \ SEO 排名。\n\n### 图像优化技术\n\n可以使用多种技术来优化 Web 图像：\n\n- **选择正确的图像格式**：不同的图像格式适用于不同类型的图像：\n\
    \    - **JPEG**：最适合照片和颜色较多的图像。`JPEG` 使用有损压缩，这意味着会丢弃一些图像数据以减小文件大小。\n    - **PNG**：最适合具有锐线条、文本和图形的图像。`PNG`\
    \ 使用无损压缩，这意味着没有图像数据丢失。\n    - **WebP**：由 `Google` 开发的现代图像格式，与 `JPEG` 和 `PNG` 相比提供了更好的压缩。它同时支持有损和无损压缩。\n\
    \    - **AVIF**：一种更新的图像格式，提供了比 `WebP` 更好的压缩。它正获得越来越多的现代器的支持。\n\n选择正确的格式可以在不牺牲过多图像质量的情况下显著减小文件大小。对于大多数照片，`WebP`\
    \ 或 `AVIF` 是极的选择。对于图形和带有文本的图像，`PNG` 通常是最佳选择。\n\n- **调整图像尺寸**：避免使用大图像并在浏览器中将其缩小。相反，在上传到网站之前，将图像调整为其实际显示尺寸。这可以防止浏览器下载不必要的数据。\n\
    \n- **压缩**：使用图像压缩工具进一步减小文件大小。有许多在线和离线工具可为此目的。对于 `WebP` 和 `AVIF`，压缩已内置在格式中，但对于\
    \ `JPEG` 和 `PNG`，你可以使用如 `TinyPNG` 或 `ImageOptim` 等工具。\n\n- **使用响应式图像**：使用 `<picture>`元素或\
    \ `<img>` 元素上的 `srcset` 属性为不同的屏幕尺寸和分辨率提供不同的图像尺寸。这确保了较小设备上的用户不需要下载为桌面显示设计的巨大图像。\n\
    \n这是一个使用 `srcset` 属性的示例：\n\n```html\n<img\n  src=\"image-small.jpg\"\n  srcset=\"\
    image-small.jpg 300w, image-medium.jpg 600w, image-large.jpg 1200w\"\n  sizes=\"\
    (max-width: 600px) 300px, (max-width: 1200px) 600px, 1200px\"\n  alt=\"My image\"\
    \n/>\n```\n\n`srcset` 属性指定了不同的图像源及其宽度。`sizes` 属性指定了不同媒体查询下的图像尺寸。浏览器将根据用户的设备选择最合适的图像。\n\
    \n- **懒加载图像**（如上一节所述）：懒加载图像通过延迟加载屏幕外图像，可以显著缩短初始页面加载时间。\n\n## 资产管理策略\n\n有效的资产管理涉及组织和优化你网站的所有资产，包括图像、CSS\
    \ 和 JavaScript 文件。\n\n- **内容交付网络 (CDNs)**：使用 `CDN` 托管你的资产。`CDNs` 是分布式的服务器网络，通过从距离用户最近的服务器交付内容，从而减少延迟并提高加载速度。\n\
    - **缓存**：利用浏览器缓存和服务器端缓存来减少对服务器的请求次数。应设置正确的缓存头，以指示浏览器存储资产的时间。\n- **压缩化与合并**：对 `CSS`\
    \ 和 `JavaScript` 文件进行压缩化，以删除不必要的空格和字符，减小文件大小。将多个 `CSS` 或 `JavaScript` 文件合并为一个文件，以减少请求次数。现代构建工具如\
    \ `Webpack` 和 `Parcel` 会自动处理此操作。\n- **雪精灵**：将多个小图像合并到一个图像精灵图中，并使用 `CSS` 背景定位来显示单个图像。这减少了\
    \ HTTP 请求次数。这种技术在 HTTP/2 时代已不再常见，但在某些情况下仍然有用。\n\n### 实际考虑因素\n\n- **自动化**：尽可能使用构建工具或在线服务实现图像优化。这确保了所有图像都经过了优化。\n\
    - **性能监控**：使用性能监控工具跟踪优化工作的影响。这有助于你识别改进的领域。\n- **平衡质量与性能**：在图像质量和文件大小之间找到平衡很重要。你不想为了获得较小的字体而牺牲过多的质量。\n\
    \n通过实施这些图像优化和资产管理技术，你可以显著提高网站性能，从而带来更好的用户体验并可能提升 SEO。\n\n### 性能分析与识别性能瓶颈\n\n即使经过了仔细的优化，性能瓶颈仍可能渗透到应用程序中。性能分析是分析代码以识别瓶颈并理解应用程序在何处消耗的过程。本节涵盖了用于\
    \ JavaScript 代码性能分析和识别性能问题的技术和工具。\n\n#### 为什么性能分析很重要\n\n性能分析帮助你超越猜测，并提供有关应用程序性能的确定数据。与其猜测哪些部分可能缓慢，不如使用性能分析工具精确定导致性能问题的代码部分。这让你能够将优化精力集中在影响最大的地方。\n\
    \n#### 性能分析工具\n\n有多种工具用于 JavaScript 代码的性能分析：\n\n"
- fmt: "\n- **Browser DevTools Profiler**: Most modern browsers include a built-in\
    \ profiler in their DevTools. This tool allows you to record CPU usage, memory\
    \ allocation, and other performance metrics.\n- **Performance APIs**: JavaScript\
    \ provides several Performance APIs that allow you to measure the performance\
    \ of specific parts of your code.\n- **Lighthouse (Chrome extension or Node.js\
    \ tool)**: Lighthouse is an automated tool for improving web page quality. It\
    \ has an audit section that provides performance metrics and recommendations.\n\
    \nWe'll focus primarily on the Browser DevTools Profiler, as it's readily available\
    \ and provides a comprehensive set of features.\n\n# Using the Browser DevTools\
    \ Profiler\n\nTo use the Profiler in Chrome DevTools (other browsers are similar):\n\
    \n1. Open DevTools (right-click on the page and select \"Inspect\" or use a keyboard\
    \ shortcut).\n2. Go to the \"Performance\" panel.\n3. Click the \"Record\" button\
    \ (a circle).\n4. Interact with your application to trigger the actions you want\
    \ to profile.\n5. Click the \"Stop\" button.\n\nThe Profiler will then generate\
    \ a detailed report showing how your application spent its time.\n\n# Interpreting\
    \ the Profiler Report\n\nThe Profiler report typically includes several sections:\n\
    \n- **Timeline**: This shows a visual representation of how your application spent\
    \ its time over the recording period. You can see when events occurred, how long\
    \ they took, and how much CPU was used.\n- **Bottom-Up/Call Tree**: This shows\
    \ a hierarchical view of function calls, allowing you to see which functions were\
    \ called and how much time was spent in each function. This is extremely useful\
    \ for identifying \"hotspots\" in your code.\n- **Flame Chart**: This provides\
    \ a graphical representation of the call stack over time. The width of each bar\
    \ represents the amount of time spent in that function. This is a very effective\
    \ way to visualize performance bottlenecks.\n\n# Identifying Common Performance\
    \ Bottlenecks\n\nWhen analyzing a Profiler report, look for the following common\
    \ performance bottlenecks:\n\n- **Long-Running Functions**: Functions that take\
    \ a long time to execute can block the main thread and cause the UI to become\
    \ unresponsive. Look for wide bars in the Flame Chart or functions with high \"\
    Self Time\" in the Bottom-Up/Call Tree.\n- **Frequent Function Calls**: Calling\
    \ a function many times can also impact performance, even if the function itself\
    \ is relatively fast. Look for functions that are called repeatedly in the Call\
    \ Tree.\n- **Forced Reflows/Layout Thrashing**: This occurs when the browser has\
    \ to recalculate the layout of the page multiple times in quick succession. This\
    \ can be caused by repeatedly reading and writing DOM properties that affect layout.\n\
    - **Excessive Garbage Collection**: If your application creates and discards many\
    \ objects, the garbage collector may have to run frequently, which can impact\
    \ performance. Look for spikes in memory usage in the Profiler's memory timeline.\n\
    \n# Example Scenario and Analysis\n\nLet’s imagine you’re profiling a user interaction\
    \ that seems slow. After recording a profile, you see a long bar in the Flame\
    \ Chart that corresponds to a function called `processData()`. In the Bottom-Up\
    \ view, you see that `processData()` has a high \"Self Time,\" indicating that\
    \ it's spending a lot of time executing its own code.\n\nBy examining the code\
    \ for `processData()`, you might discover that it’s performing a complex calculation\
    \ or iterating over a large array. This identifies `processData()` as a performance\
    \ bottleneck. You can then focus on optimizing this function, for example, by\
    \ using a more efficient algorithm or by caching results.\n\n# Using Performance\
    \ APIs\n\nJavaScript's Performance APIs provide more fine-grained control over\
    \ performance measurement. For example, you can use `performance.now()` to measure\
    \ the time it takes to execute a specific block of code:\n\n```javascript\nconst\
    \ startTime = performance.now();\n\n// Code to measure\nfor (let i = 0; i < 1000000;\
    \ i++) {\n    // Some operation\n}\n\nconst endTime = performance.now();\nconst\
    \ executionTime = endTime - startTime;\n\nconsole.log(`Execution time: ${executionTime}\
    \ milliseconds`);\n```\n\n# Practical Considerations\n\n- **Profile in a Realistic\
    \ Environment**: Profile your application in an environment that is similar to\
    \ your production environment. This includes using similar hardware, network conditions,\
    \ and data sets.\n- **Focus on Real User Interactions**: Profile the parts of\
    \ your application that users interact with most frequently.\n- **Iterate and\
    \ Measure**: Optimization is an iterative process. After making a change, profile\
    \ again to measure its impact.\n\nBy using profiling tools and techniques, you\
    \ can identify performance bottlenecks in your JavaScript code and make targeted\
    \ optimizations to improve the user experience.\n\n# Chapter 11. Accessibility\
    \ and Security Best Practices\n\n## Building Accessible Web Applications (ARIA,\
    \ Semantic HTML)\n\nCreating websites and applications that are usable by everyone,\
    \ regardless of their abilities, is not just a good practice—it's essential. Accessibility\
    \ ensures that people with disabilities can perceive, understand, navigate, and\
    \ interact with your web content. Equally important is security. Protecting user\
    \ data and preventing vulnerabilities is paramount in today's digital landscape.\
    \ This chapter covers key accessibility and security best practices for JavaScript\
    \ developers. We'll start with building accessible web applications.\n\n### Accessibility\
    \ Over-view\n\nAccessibility is about designing and developing websites that are\
    \ usable by people with a wide range of abilities, including visual, auditory,\
    \ motor, and cognitive impairments. Building accessible websites isn’t just about\
    \ being inclusive; it often improves the experience for everyone. Think about\
    \ how subtitles help you understand a video in a noisy environment, or how clear,\
    \ concise writing benefits all readers.\n\nTwo key components contribute significantly\
    \ to web accessibility: semantic HTML and `ARIA` (Accessible Rich Internet Applications).\n\
    \n#### Semantic HTML: Giving Meaning to Structure\n\nSemantic HTML uses HTML elements\
    \ for their intended purpose, providing meaning and structure to your content.\
    \ This not only improves accessibility but also makes your code more readable\
    \ and maintainable.\n\nConsider these examples:\n- Using `<nav>` to mark up navigation\
    \ menus instead of generic `<div>` elements.\n- Using `<article>` to represent\
    \ self-contained content, like a blog post or news article.\n- Using `<aside>`\
    \ for content that is related to the main content but not essential to understanding\
    \ it, such as sidebars or related links.\n- Using `<form>`, `<input>`, `<label>`,\
    \ and `<button>` elements for forms instead of creating custom form elements with\
    \ `<div>` and JavaScript.\n\nUsing semantic HTML elements provides several benefits:\n\
    - **Improved Accessibility**: Screen readers and other assistive technologies\
    \ rely on semantic HTML to understand the structure and meaning of your content.\n\
    - **Better SEO**: Search engines also use semantic HTML to understand the content\
    \ of your pages, which can improve your search engine rankings.\n- **More Maintainable\
    \ Code**: Semantic HTML makes your code more readable and easier to understand,\
    \ making it easier to maintain and update.\n\n#### ARIA: Bridging the Gaps\n\n\
    While semantic HTML provides a solid foundation for accessibility, it doesn't\
    \ cover all possible scenarios. `ARIA` fills in the gaps by providing additional\
    \ information to assistive technologies about the role, state, and properties\
    \ of elements.\n\n`ARIA` attributes are typically used in three main categories:\n\
    - **Roles**: Define the type of user interface element. For example, `role=\"\
    button\"` indicates that an element should be treated as a button, even if it's\
    \ not a `<button>` element.\n- **States**: Describe the current state of an element.\
    \ For example, `aria-checked=\"true\"` indicates that a checkbox is checked.\n"
  raw: '​● ​Browser DevTools Profiler: Most modern browsers include a built-in profiler
    in their DevTools. This tool allows you to record CPU usage, memory allocation,
    and other performance metrics.


    ​● ​Performance APIs: JavaScript provides several Performance APIs that allow
    you to measure the performance of specific parts of your code.


    ​● ​Lighthouse (Chrome extension or Node.js tool): Lighthouse is an automated
    tool for improving web page quality. It has an audit section that provides performance
    metrics and recommendations.


    We''ll focus primarily on the Browser DevTools Profiler, as it''s readily available
    and provides a comprehensive set of features.


    Using the Browser DevTools Profiler


    To use the Profiler in Chrome DevTools (other browsers are similar):


    ​1\. ​Open DevTools (right-click on the page and select "Inspect" or use a keyboard
    shortcut).


    ​2\. ​Go to the "Performance" panel.


    ​3\. ​Click the "Record" button (a circle).


    ​4\. ​Interact with your application to trigger the actions you want to profile.


    ​5\. ​Click the "Stop" button.


    The Profiler will then generate a detailed report showing how your application
    spent its time.


    Interpreting the Profiler Report


    The Profiler report typically includes several sections:


    ​● ​Timeline: This shows a visual representation of how your application spent
    its time over the recording period. You can see when events occurred, how long
    they took, and how much CPU was used.


    ​● ​Bottom-Up/Call Tree: This shows a hierarchical view of function calls, allowing
    you to see which functions were called and how much time was spent in each function.
    This is extremely useful for identifying "hotspots" in your code.


    ​● ​Flame Chart: This provides a graphical representation of the call stack over
    time. The width of each bar represents the amount of time spent in that function.
    This is a very effective way to visualize performance bottlenecks.


    Identifying Common Performance Bottlenecks


    When analyzing a Profiler report, look for the following common performance bottlenecks:


    ​● ​Long-Running Functions: Functions that take a long time to execute can block
    the main thread and cause the UI to become unresponsive. Look for wide bars in
    the Flame Chart or functions with high "Self Time" in the Bottom-Up/Call Tree.


    ​● ​Frequent Function Calls: Calling a function many times can also impact performance,
    even if the function itself is relatively fast. Look for functions that are called
    repeatedly in the Call Tree.


    ​● ​Forced Reflows/Layout Thrashing: This occurs when the browser has to recalculate
    the layout of the page multiple times in quick succession. This can be caused
    by repeatedly reading and writing DOM properties that affect layout.


    ​● ​Excessive Garbage Collection: If your application creates and discards many
    objects, the garbage collector may have to run frequently, which can impact performance.
    Look for spikes in memory usage in the Profiler''s memory timeline.


    Example Scenario and Analysis


    Let’s imagine you’re profiling a user interaction that seems slow. After recording
    a profile, you see a long bar in the Flame Chart that corresponds to a function
    called processData(). In the Bottom-Up view, you see that processData() has a
    high "Self Time," indicating that it''s spending a lot of time executing its own
    code.


    By examining the code for processData(), you might discover that it’s performing
    a complex calculation or iterating over a large array. This identifies processData() as
    a performance bottleneck. You can then focus on optimizing this function, for
    example, by using a more efficient algorithm or by caching results.


    Using Performance APIs


    JavaScript''s Performance APIs provide more fine-grained control over performance
    measurement. For example, you can use performance.now() to measure the time it
    takes to execute a specific block of code:


    JavaScript


    const startTime = performance.now();


    // Code to measure


    for (leti = 0; i < 1000000; i++) {


    // Some operation


    }


    const endTime = performance.now();


    const executionTime = endTime - startTime;


    console.log(`Execution time: ${executionTime} milliseconds`);


    Practical Considerations


    ​● ​Profile in a Realistic Environment: Profile your application in an environment
    that is similar to your production environment. This includes using similar hardware,
    network conditions, and data sets.


    ​● ​Focus on Real User Interactions: Profile the parts of your application that
    users interact with most frequently.


    ​● ​Iterate and Measure: Optimization is an iterative process. After making a
    change, profile again to measure its impact.


    By using profiling tools and techniques, you can identify performance bottlenecks
    in your JavaScript code and make targeted optimizations to improve the user experience.


    ## Chapter 11\. Accessibility and Security Best Practices


    ### Building Accessible Web Applications (ARIA, Semantic HTML)


    Creating websites and applications that are usable by everyone, regardless of
    their abilities, is not just a good practice—it''s essential. Accessibility ensures
    that people with disabilities can perceive, understand, navigate, and interact
    with your web content. Equally important is security. Protecting user data and
    preventing vulnerabilities is paramount in today''s digital landscape. This chapter
    covers key accessibility and security best practices for JavaScript developers.
    We''ll start with building accessible web applications.


    Building Accessible Web Applications (ARIA, Semantic HTML)


    Accessibility is about designing and developing websites that are usable by people
    with a wide range of abilities, including visual, auditory, motor, and cognitive
    impairments. Building accessible websites isn’t just about being inclusive; it
    often improves the experience for everyone. Think about how subtitles help you
    understand a video in a noisy environment, or how clear, concise writing benefits
    all readers.


    Two key components contribute significantly to web accessibility: semantic HTML
    and ARIA (Accessible Rich Internet Applications).


    Semantic HTML: Giving Meaning to Structure


    Semantic HTML uses HTML elements for their intended purpose, providing meaning
    and structure to your content. This not only improves accessibility but also makes
    your code more readable and maintainable.


    Consider these examples:


    ​● ​Using <nav>to mark up navigation menus instead of generic <div> elements.


    ​● ​Using <article> to represent self-contained content, like a blog post or news
    article.


    ​● ​Using <aside> for content that is related to the main content but not essential
    to understanding it, such as sidebars or related links.


    ​● ​Using <form>, <input>, <label>, and <button>elements for forms instead of
    creating custom form elements with <div> and JavaScript.


    Using semantic HTML elements provides several benefits:


    ​● ​Improved Accessibility: Screen readers and other assistive technologies rely
    on semantic HTML to understand the structure1 and meaning of your content.


    ​● ​Better SEO: Search engines also use semantic HTML to understand the content
    of your pages, which can improve your search engine rankings.


    ​● ​More Maintainable Code: Semantic HTML makes your code more readable and easier
    to understand, making it easier to maintain and update.


    ARIA: Bridging the Gaps


    While semantic HTML provides a solid foundation for accessibility, it doesn''t
    cover all possible scenarios. ARIA fills in the gaps by providing additional information
    to assistive technologies about the role, state, and properties of elements.


    ARIA attributes are typically used in three main categories:


    ​● ​Roles:Define the type of user interface element. For example, role="button"indicates
    that an element should be treated as a button, even if it''s not a <button> element.


    ​● ​States:Describe the current state of an element. For example, aria-checked="true" indicates
    that a checkbox is checked.'
