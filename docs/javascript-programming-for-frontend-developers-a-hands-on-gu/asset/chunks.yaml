  trans: "\n\n- **可测试性提高**：因为 reducer 是纯函数，所以它们很容易测试。你只需要提供一个状态（state）和一个动作（action），然后断言\
    \ reducer 返回了预期的新状态。\n- **更好的组织**：Redux 强制执行关注点分离，使得大型应用程序更容易组织和维护。\n- **性能提升（使用得当时）**：通过使用\
    \ `connect` 的 `mapStateToProps` 和内存化（memoization）等技术防止不必要的重新渲染，Redux 可以提高应用程序性能。\n\
    - **时间旅行调试**：Redux 最强大的功能之一是能够对状态变化进行“时间旅行”。Redux DevTools 会记录分发到 store 的每一个 action，允许你重放这些\
    \ action 并查看状态随时间演变的过程。这对于调试复杂问题具有极高的价值。\n\n## Redux 如何解决问题：\n\n- **集中状态管理**：通过拥有单一的\
    \ store，Redux 消除了属性层层传递（prop drilling）的需求，并使得在组件之间共享状态变得简单。\n- **可预测的状态更新**：通过要求状态更新由\
    \ action 发起并由纯 reducer 处理，Redux 确保了状态变化是可预测且可追踪的。\n- **易于调试**：Redux DevTools 使得检查状态和跟踪状态变化变得简单，让调试变得更加容易。\n\
    \nRedux 对于具有以下特征的复杂应用程序特别有利：\n\n- 许多交互元素\n- 频繁的状态更新\n- 复杂的数据流\n- 协作开发\n\n虽然 Redux\
    \ 的初始设置可能看起来复杂，但它在可维护性、可测试性和调试方面提供的优势使其成为构建大型复杂 Web 应用程序的价值工具。\n\n## 第 8 章：使用\
    \ React 和 Redux 构建单页应用程序 (SPA)\n\n### 使用 Create React App 设置 React 项目\n\n单页应用程序（SPA）已成为构建现代网络应用程序的流行方式。与传统的每次都需要重新加载整个页的多页应用程序不同，SPA\
    \ 加载单个 HTML 页面，并在用户与应用程序交互时动态更新内容。这提供了更流畅、响应更迅速的用户体验。将 React（用于构建用户界强大 JavaScript\
    \ 库）与 Redux（可预测的状态管理库）相结合，可以创建健壮且易于维护的 SPA。本章将引导你通过 React 和 Redux 构建 SPA 的过程。\n\
    \n### 使用 Create React App 设置 React 项目\n\nCreate React App (CRA) 是官方支持的用于快速设置新\
    \ React 项目的工具。它提供了一个带有合理默认值的预配置开发环境，让你专注于编写代码，而不是配置构建工具。\n\n#### 前提条件\n\n在开始之前，确保你的系统上安装了\
    \ `Node.js` 和 `npm`（Node 包管理器）或 `yarn`。你可以从官方网站 (nodejs.org) 下载 Node.js。`npm`\
    \ 与 Node.js 一起包含，而 `yarn` 可以单独安装。\n\n#### 创建新项目\n\n要使用 CRA 创建新的 React 项目，打开终端或命令提示符并导航到你想创建项目的目录。然后运行以下命令：\n\
    \n```bash\nnpx create-react-app my-spa-app\n\n# 或者使用 yarn:\nyarn create react-app\
    \ my-spa-app\n```\n\n将 `my-spa-app` 替换为你所需的项目名称。\n\n此命令将创建一个名为 `my-spa-app` 的新目录，包含基础项目结构和所有必要的依赖。\n\
    \n#### 项目结构\n\n命令完成后，进入项目目录：\n\n```bash\ncd my-spa-app\n```\n\n生成的项目结构看起来如下：\n\
    \n```text\nmy-spa-app/\n├── node_modules/\n├── public/\n│   ├── index.html\n│\
    \   └── favicon.ico\n├── src/\n│   ├── App.js\n│   ├── App.css\n│   ├── index.js\n\
    │   ├── index.css\n│   ├── logo.svg\n│   └── ... other files\n├── .gitignore\n\
    ├── package.json\n└── README.md\n```\n\n这里是对一些关键文件和目录的简单说明：\n\n- `node_modules/`：该目录包含项目的所有依赖。\n\
    - `public/`：该目录包含静态资源，如 `index.html` 和 `favicon.ico`。\n- `src/`：该目录包含项目的源代码。\n\
    \    - `App.js`：主应用程序组件。\n    - `index.js`：应用程序的入口。\n    - `index.css`：应用程序的全局样式。\n\
    - `package.json`：该文件包含项目元数据和依赖。\n\n#### 启动开发服务器\n\n在项目目录中运行以下命令启动开发服务器：\n\n```bash\n\
    npm start\n\n# 或者使用 yarn:\nyarn start\n```\n\n这将在浏览器的新标签页中 `http://localhost:3000`\
    \ 打开你的应用程序。你对源代码的任何更改将自动刷新页面。\n\n#### 清理默认项目\n\n默认的 CRA 项目包含一些可能不需要模板代码和文件。你可以安全地删除以下内容：\n\
    \n- `src/logo.svg`\n- `src/App.js` 中对 `logo.svg` 的导入\n- 如果你计划使用自己的样式方案，`src/App.css`\
    \ 中的默认样式。\n\n#### 安装 Redux 和 React-Redux\n\n要在你的 React 应用程序中使用 Redux，你需要安装 `@reduxjs/toolkit`\
    \ 和 `react-redux` 包：\n\n```bash\nnpm install @reduxjs/toolkit react-redux\n\n\
    # 或者使用 yarn:\nyarn add @reduxjs/toolkit react-redux\n```\n\n我们安装 `@reduxjs/toolkit`\
    \ 而不是直接安装 `redux`，因为它包含了我们需要的所有内容，并大大简化了 Redux 开发。\n\n#### 设置 Redux Store\n\n\
    现在你已经安装了 React 和 Redux，可以设置 Redux store。在 `src` 目录中创建一个名为 `store.js` 的新文件（如果你喜欢专用\
    \ app 文件夹，也可以使用 `app/store.js`）。在此文件中，你将使用 Redux Toolkit 的 `configureStore` 配置你的\
    \ Redux store：\n\n```javascript\nimport { configureStore } from '@reduxjs/toolkit';\n\
    import counterReducer from './features/counter/counterSlice'; // 示例 slice\n\n\
    export const store = configureStore({\n  reducer: {\n    counter: counterReducer,\n\
    \    // 在此处添加其他 reducers\n  },\n});\n\n// 从 store 自身导出 `RootState` 和 `AppDispatch`\
    \ 类型\nexport type RootState = ReturnType<typeof store.getState>\n// 推断类型: {posts:\
    \ PostsState, comments: CommentsState, users: UsersState}\nexport type AppDispatch\
    \ = typeof store.dispatch\n```\n\n这段代码设置了一个带有示例 reducer 的 Redux store（我们稍后会创建它）。\n\
    \n#### 为 React 提供 Store\n\n为了让你的 React 组件可以使用 Redux store，你需要用 `react-redux` 中的\
    \ `<Provider>` 组件包裹你的应用程序。打开 `src/index.js` 并修改如下：\n\n```javascript\nimport React\
    \ from 'react';\nimport ReactDOM from 'react-dom/client';\nimport App from './App';\n\
    import { Provider } from 'react-redux';\nimport { store } from './store';\nimport\
    \ './index.css';\n\nconst root = ReactDOM.createRoot(document.getElementById('root'));\n\
    \nroot.render(\n  <React.StrictMode>\n    <Provider store={store}>\n      <App\
    \ />\n    </Provider>\n  </React.StrictMode>\n);\n```\n\n现在，你应用程序中的所有组件都可以访问 Redux\
    \ store。\n\n#### 将 Redux 集成到 React 组件\n\n现在你已经配置好了带有 Redux 的 React 项目，可以开始将组件连接到\
    \ Redux store 了。这允许你的组件以可预测的方式访问和修改应用程序的状态。\n\n#### 创建 Slice (Reducer 和 Actions)\n\
    \n在连接组件之前，你需要定义状态将如何结构化以及如何更新。这是通过 Redux Toolkit 的 `createSlice()` 完成的。\n\n在 `src`\
    \ 中创建一个名为 `features` 的新文件夹，并在里面创建一个名为 `counter` 的文件夹。在 `counter` 文件夹内创建一个名为 `counterSlice.js`\
    \ 文件并添加以下代码：\n\n"
- fmt: "\n# JavaScript\n\n```javascript\nimport { createSlice } from '@reduxjs/toolkit';\n\
    \nconst initialState = {\n  value: 0,\n};\n\nexport const counterSlice = createSlice({\n\
    \  name: 'counter',\n  initialState,\n  reducers: {\n    increment: (state) =>\
    \ {\n      state.value += 1;\n    },\n    decrement: (state) => {\n      state.value\
    \ -= 1;\n    },\n    incrementByAmount: (state, action) => {\n      state.value\
    \ += action.payload;\n    },\n  },\n});\n\nexport const { increment, decrement,\
    \ incrementByAmount } = counterSlice.actions;\nexport default counterSlice.reducer;\n\
    ```\n\nThis code defines a slice named `counter` with an initial state of `1`\
    \ `{ value: 0 }`. It also defines three reducers: `increment`, `decrement`, and\
    \ `incrementByAmount`. Redux Toolkit uses `Immer` under the hood, allowing you\
    \ to write \"mutating\" logic directly in the reducers, which simplifies the code.\n\
    \nRemember to import the reducer into `store.js` as shown in the previous section.\n\
    \n## Connecting Components with useSelector and useDispatch\n\nThe most common\
    \ way to connect React components to the Redux store is by using the `useSelector`\
    \ and `useDispatch` hooks provided by `react-redux`.\n\n- `useSelector(selector)`:\
    \ This hook allows you to extract data from the Redux store state. The `selector`\
    \ argument is a function that receives the entire Redux state as an argument and\
    \ returns the specific part of the state that you need.\n- `useDispatch()`: This\
    \ hook returns a reference to the `dispatch` function from the Redux store, which\
    \ you can use to dispatch actions.\n\nNow, let's create a `Counter` component\
    \ that uses the `counterSlice`:\n\nCreate a new file called `Counter.js` in the\
    \ `counter` folder and add the following code:\n\n```javascript\nimport React\
    \ from 'react';\nimport { useSelector, useDispatch } from 'react-redux';\nimport\
    \ { increment, decrement, incrementByAmount } from './counterSlice';\nimport {\
    \ useState } from 'react';\n\nexport function Counter() {\n  const count = useSelector((state)\
    \ => state.counter.value);\n  const dispatch = useDispatch();\n  const [incrementAmount,\
    \ setIncrementAmount] = useState('2');\n  const addValue = Number(incrementAmount)\
    \ || 0;\n\n  return (\n    <div>\n      <div>\n        <button\n          aria-label=\"\
    Increment value\"\n          onClick={() => dispatch(increment())}\n        >\n\
    \          Increment\n        </button>\n        <span>{count}</span>\n      \
    \  <button\n          aria-label=\"Decrement value\"\n          onClick={() =>\
    \ dispatch(decrement())}\n        >\n          Decrement\n        </button>\n\
    \      </div>\n      <div>\n        <input\n          type=\"number\"\n      \
    \    value={incrementAmount}\n          onChange={e => setIncrementAmount(e.target.value)}\n\
    \        />\n        <button onClick={() => dispatch(incrementByAmount(addValue))}>\n\
    \          Add Amount\n        </button>\n      </div>\n    </div>\n  );\n}\n\
    ```\n\nHere's an explanation of the code:\n\n1. We import `useSelector` and `useDispatch`\
    \ from `react-redux`.\n2. We use `useSelector` to extract the value from the `counterSlice`\
    \ of the Redux state: `useSelector((state) => state.counter.value)`.\n3. We use\
    \ `useDispatch` to get the `dispatch` function.\n4. We dispatch the `increment`,\
    \ `decrement`, and `incrementByAmount` actions when the corresponding buttons\
    \ are clicked.\n\n## Using the Counter Component\n\nNow you can use the `Counter`\
    \ component in your `App.js` file:\n\n```javascript\nimport React from 'react';\n\
    import './App.css';\nimport { Counter } from './features/counter/Counter';\n\n\
    function App() {\n  return (\n    <div className=\"App\">\n      <header className=\"\
    App-header\">\n        <Counter />\n      </header>\n    </div>\n  );\n}\n\nexport\
    \ default App;\n```\n\nNow, when you run your application (`npm start` or `yarn\
    \ start`), you should see the counter component, and clicking the buttons will\
    \ update the counter value in the Redux store, which will be reflected in the\
    \ UI.\n\n## Key Concepts\n\n- `useSelector`: Extracts data from the Redux store.\n\
    - `useDispatch`: Provides access to the `dispatch` function.\n- `Slices`: Using\
    \ Redux Toolkit's `createSlice` simplifies defining reducers and actions.\n\n\
    This section has demonstrated how to connect React components to the Redux store\
    \ using `useSelector` and `useDispatch`. This is the standard way to interact\
    \ with Redux in modern React applications and provides a clear and efficient way\
    \ to manage application state.\n\n## Routing in a React Application\n\nRouting\
    \ in a React application allows users to navigate between different views or components\
    \ within the same application without requiring a full page reload. This is a\
    \ key characteristic of Single-Page Applications (SPAs). React Router is the most\
    \ popular and widely used library for handling routing in React.\n\n### Installing\
    \ React Router\n\nTo use React Router, you need to install the `react-router-dom`\
    \ package:\n\n```bash\nnpm install react-router-dom\n# or using yarn:\nyarn add\
    \ react-router-dom\n```\n\n### Basic Routing Setup\n\nThe core components provided\
    \ by `react-router-dom` are:\n\n- `<BrowserRouter>`: This component wraps your\
    \ application and makes routing available. It uses the browser's history API for\
    \ navigation.\n- `<Routes>`: This component defines the different routes in your\
    \ application.\n- `<Route>`: This component defines a specific route and the component\
    \ that should be rendered when that route is matched.\n- `<Link>`: This component\
    \ provides declarative navigation between routes. It renders an `<a>` tag with\
    \ proper handling of client-side routing.\n\nHere's a basic example of setting\
    \ up routing in your `App.js` file:\n\n```javascript\nimport React from 'react';\n\
    import { BrowserRouter as Router, Routes, Route, Link } from 'react-router-dom';\n\
    import { Counter } from './features/counter/Counter'; // Import your Counter component\n\
    \nfunction Home() {\n  return <h2>Home</h2>;\n}\n\nfunction About() {\n  return\
    \ <h2>About</h2>;\n}\n\nfunction App() {\n  return (\n    <Router>\n      <div>\n\
    \        <nav>\n          <ul>\n            <li>\n              <Link to=\"/\"\
    >Home</Link>\n            </li>\n            <li>\n              <Link to=\"/about\"\
    >About</Link>\n            </li>\n            <li>\n              <Link to=\"\
    /counter\">Counter</Link>\n            </li>\n          </ul>\n        </nav>\n\
    \        <Routes>\n          <Route path=\"/about\" element={<About />} />\n \
    \         <Route path=\"/counter\" element={<Counter />} />\n          <Route\
    \ path=\"/\" element={<Home />} /> {/* Default route */}\n        </Routes>\n\
    \      </div>\n    </Router>\n  );\n}\n\nexport default App;\n```\n\nHere’s a\
    \ breakdown of what’s happening:\n\n1. We import `BrowserRouter`, `Routes`, `Route`,\
    \ `Link` from `react-router-dom`.\n2. We wrap the entire application with `<Router>`.\n\
    3. We use `<nav>` and `<ul>` elements to create a navigation menu.\n4. We use\
    \ `<Link to=\"/route\">Link</Link>` to create links to different routes. The `to`\
    \ prop specifies the path.\n5. We use `<Routes>` to define the routes.\n6. Each\
    \ `<Route>` has a `path` that specifies the URL path and an `element` prop that\
    \ specifies the component to render.\n7. The `<Route path=\"/\" element={<Home\
    \ />} />` defines the default route that will be rendered when the user visits\
    \ the root.\n\nNow, when you click on the links in the navigation menu, the corresponding\
    \ components will be rendered without a full page reload.\n\n### Route Parameters\n\
    \nYou can also define routes with parameters, which allow you to pass dynamic\
    \ values in the URL.\n\n```javascript\nimport { useParams } from 'react-router-dom';\n\
    \nfunction User() {\n  const { userId } = useParams();\n  return <h2>User ID:\
    \ {userId}</h2>;\n}\n\n// In App.js:\n<Route path=\"/users/:userId\" element={<User\
    \ />} />\n```\n\nThe `:userId` in the path defines a parameter named `userId`.\
    \ You can access this parameter in the `User` component using the `useParams()`\
    \ hook. If you visit `/users/123`, the `User` component will render \"User ID:\
    \ 123\".\n\n### Nested Routes\n\nReact Router also supports nested routes, which\
    \ allow you to create hierarchical layouts.\n\n```javascript\nimport { Outlet\
    \ } from 'react-router-dom';\n\nfunction Dashboard() {\n  return (\n    <div>\n\
    \      <h1>Dashboard</h1>\n      <nav>\n        <Link to=\"profile\">Profile</Link>\n\
    \        <Link to=\"settings\">Settings</Link>\n      </nav>\n      <Outlet />\
    \ {/* Child routes will be rendered here */}\n    </div>\n  );\n}\n\n// In App.js\n\
    <Route path=\"/dashboard\" element={<Dashboard />} >\n  <Route path=\"profile\"\
    \ element={<Profile />} />\n  <Route path=\"settings\" element={<Settings />}\
    \ />\n</Route>\n```\n\nThe `<Outlet>` component in `Dashboard` acts as a placeholder\
    \ where the child routes (`/dashboard/profile` and `/dashboard/settings`) will\
    \ be rendered.\n"
