    import { useNavigate } from 'react-router-dom';\n\nfunction MyComponent() {\n\
    \  const navigate = useNavigate();\n\n  const handleSubmit = () => {\n    // ...\
    \ 表单提交逻辑\n    navigate('/success'); // 导航到 /success 路由\n  };\n\n  return (\n \
    \   <button onClick={handleSubmit}>Submit</button>\n  );\n}\n```\n\n`navigate`\
    \ 函数允许你导航到特定的路径。\n\n本节涵盖了使用 React Router 在 React 应用中进行路由的各种知识。通过这些工具，你可以创建具有多个视图和动态导航的复杂单页应用（SPAs）。\n\
    \n# 第 9 章：JavaScript 代码的测试与调试\n\n## 使用 Jest 进行单元测试\n\n编写健壮且可靠的代码需要彻底的测试和有效的调试技术。测试确保你的代码行为符合预期，并帮助防止\
    \ Bug 进入生产环境。调试是识别并修复代码中错误的过程。本章涵盖了 JavaScript 应用关键的测试和调试策略，重点介绍使用 Jest 进行单元测试。\n\
    \n### 使用 Jest 进行单元测试\n\n单元测试专注于孤立地测试代码的单个单元，例如函数、模块或组件。这有助于在开发早期识别 Bug，并更容易定位错误根源。Jest\
    \ 是一个流行的 JavaScript 测试框架，它提供了一套全面的工具，用于编写和运行单元测试。\n\n### 配置 Jest\n\n如果你正在使用 Create\
    \ React App (CRA)，Jest 已经包含并配置好了。如果你在一个没有使用 CRA 的项目上工作，可以使用 npm 或 yarn 安装 Jest：\n\
    \n```bash\nnpm install --save-dev jest\n\n# 或者使用 yarn:\nyarn add --dev jest\n\
    ```\n\n如果你在使用 TypeScript，可能还想要安装 `@types/jest` 以获得 TypeScript 支持。\n\n安装 Jest 之后，你可以在\
    \ `package.json` 文件中添加测试脚本：\n\n```json\n{\n  \"scripts\": {\n    \"test\": \"\
    jest\"\n  }\n}\n```\n\n现在，你可以使用 `npm test` 或 `yarn test` 命令运行你的测试了。\n\n### 编写你的第一个测试\n\
    \nJest 测试通常写在扩展名为 `.test.js` 或 `.spec.js` 的文件中。让我们创建一个简单的函数并为它编写一个测试。\n\n创建一个名为\
    \ `sum.js` 的文件：\n\n```javascript\nfunction sum(a, b) {\n  return a + b;\n}\n\n\
    module.exports = sum;\n```\n\n现在，在同一目录下创建一个名为 `sum.test.js` 的测试文件：\n\n```javascript\n\
    const sum = require('./sum');\n\ntest('1 + 2 等于 3', () => {\n  expect(sum(1, 2)).toBe(3);\n\
    });\n```\n\n以下是测试代码的详细拆解：\n\n- `const sum = require('./sum');`: 导入我们要测试的 `sum`\
    \ 函数。\n- `test('1 + 2 等于 3', () => { ... });`: 定义了一个测试用例。第一个参数是测试的描述，第二个参数是包含测试逻辑的函数。\n\
    - `expect(sum(1, 2)).toBe(3);`: 这是一个断言。它检查 `sum(1, 2)` 的结果是否等于 3。如果断言失败，测试将失败。\n\
    \n### 运行测试\n\n使用 `npm test` 或 `yarn test` 运行你的测试。Jest 会找到并执行项目中的所有测试文件并显示结果。\n\
    \n### 匹配器 (Matchers)\n\nJest 提供了多种用于进行断言的匹配器。以下是一些常用的匹配器：\n\n- `toBe(value)`:\
    \ 检查严格相等 (`===`)。\n- `toEqual(value)`: 检查深等性（用于对象和数组）。\n- `toBeNull()`: 检查值是否为\
    \ `null`。\n- `toBeUndefined()`: 检查值是否为 `undefined`。\n- `toBeTruthy()`: 检查值是否为真（truthy）。\n\
    - `toBeFalsy()`: 检查值是否为假（falsy）。\n- `toBeGreaterThan(number)`: 检查值是否大于某个数字。\n\
    - `toBeLessThan(number)`: 检查值是否小于某个数字。\n- `toContain(item)`: 检查数组是否包含特定项。\n- `toMatch(regexp)`:\
    \ 检查字符串是否匹配正则表达式。\n\n### 使用 describe 分组测试\n\n你可以使用 `describe` 块将相关的测试分组在一起。这改进了测试套件的组织和可读性。\n\
    \n```javascript\ndescribe('sum function', () => {\n  test('1 + 2 等于 3', () =>\
    \ {\n    expect(sum(1, 2)).toBe(3);\n  });\n  test('-1 + 1 等于 0', () => {\n  \
    \  expect(sum(-1, 1)).toBe(0);\n  });\n});\n```\n\n### 测试异步代码\n\nJest 提供了多种测试异步代码的方法，例如使用\
    \ Promises 或 `async/await`。\n\n#### 使用 Promises:\n\n```javascript\nfunction fetchData()\
    \ {\n  return new Promise(resolve => {\n    setTimeout(() => {\n      resolve('data');\n\
    \    }, 1000);\n  });\n}\n\ntest('1 秒后获取数据', () => {\n  return fetchData().then(data\
    \ => {\n    expect(data).toBe('data');\n  });\n});\n```\n\n#### 使用 async/await:\n\
    \n```javascript\nasync function fetchData() {\n  return new Promise(resolve =>\
    \ {\n    setTimeout(() => {\n      resolve('data');\n    }, 1000);\n  });\n}\n\
    \ntest('1 秒后获取数据 (async/await)', async () => {\n  const data = await fetchData();\n\
    \  expect(data).toBe('data');\n});\n```\n\n### 模拟模块 (Mocking Modules)\n\n有时你可能需要在测试中模拟外部模块或依赖。Jest\
    \ 提供了强大的模拟能力。\n\n```javascript\n// 模拟一个模块\njest.mock('./moduleToMock', () => ({\n\
    \  someFunction: jest.fn(() => 'mocked value')\n}));\n\n// 在测试中使用模拟的模块\nconst\
    \ moduleToMock = require('./moduleToMock');\ntest('使用模拟的模块', () => {\n  expect(moduleToMock.someFunction()).toBe('mocked\
    \ value');\n});\n```\n\n## 集成测试策略\n\n虽然单元测试关注代码的各个单元，但集成测试确保模块、组件或服务在组合在一起时运行正常。本节涵盖了\
    \ JavaScript 应用中编写有效集成测试的策略。\n\n#### 测试测试的内容\n\n集成测试通常关注不同部分之间的交互。这包括：\n\n- 组件交互：测试不同的\
    \ UI 组件如何相互作用。\n- API 集成：测试应用程序如何与外部 API 交互。\n- 数据流：测试数据如何在应用的不同部分流动。\n- 用户流：测试完整的用户场景，如登录、将商品加入购物车或提交表单。\n\
    \n#### 集成测试工具\n\n虽然 Jest 可以用于某些集成测试，但其他工具通常更适合此类，特别是测试 UI 交互或端到端场景。流行的工具包括：\n\n\
    - React Testing Library：该库专注于从用户的角度测试组件，强调测试行为而非实现细节。\n- Cypress：这是一个全面的端到端测试框架，允许你编写运行在真实浏览器环境中测试。\n\
    - Playwright：另一个强大的端到端测试框架，支持多种浏览器和平台。\n\n在本节中，我们将重点使用 React Testing Library 进行组件集成测试。\n\
    \n### 使用 React Testing Library 进行集成测试\n\nReact Testing Library 鼓励根据用户与组件的方式进行测试。它提供了查询\
    \ DOM 的工具，反映了用户在页面上查找元素的方式（例如通过文本、标签或角色）。\n\n这是一个使用 React Testing Library 进行集成测试的示例：\n\
    \n```javascript\nimport { render, screen, fireEvent } from '@testing-library/react';\n\
    import { Counter } from './Counter'; // 你的 Counter 组件\nimport { Provider } from\
    \ 'react-redux';\nimport { store } from './store'\n\ntest('点击加法按钮时计数器会增加', ()\
    \ => {\n  render(\n    <Provider store={store}>\n      <Counter />\n    </Provider>\n\
    \  );\n\n  const incrementButton = screen.getByRole('button', { name: /increment/i\
    \ });\n  const countElement = screen.getByText('0');\n\n  fireEvent.click(incrementButton);\n\
    \n  expect(screen.getByText('1')).toBeInTheDocument();\n  expect(countElement).not.toBeInTheDocument();\n\
    });\n```\n"
- fmt: "\n1. We import `render`, `screen`, and `fireEvent` from `@testing-library/react`.\
    \ We also import the `Counter` component and the `Redux Provider` and `store`.\n\
    2. We use `render()` to render the `Counter` component within the `Redux Provider`.\
    \ This makes the `Redux store` available to the component during the test.\n3.\
    \ We use `screen.getByRole()` and `screen.getByText()` to query for elements on\
    \ the page. Using accessible roles and text content is preferred because it tests\
    \ the component from a user's perspective.\n4. We use `fireEvent.click()` to simulate\
    \ a click on the increment button.\n5. We use `expect(screen.getByText('1')).toBeInTheDocument();`\
    \ to assert that the count has been incremented to 1. We also check to make sure\
    \ the original count element no longer exists.\n\n# Testing API Interactions\n\
    \nFor testing API integrations, you'll often need to mock the API requests to\
    \ avoid making actual network calls during tests. Jest provides mocking capabilities\
    \ that can be used in conjunction with React Testing Library.\n\nHere's an example\
    \ of mocking a `fetch` call:\n\n```javascript\nglobal.fetch = jest.fn(() =>\n\
    \  Promise.resolve({\n    json: () => Promise.resolve({ data: 'mocked data' }),\n\
    \  })\n);\n\ntest('fetches data from the API', async () => {\n  // ... test logic\n\
    });\n```\n\nThis mocks the global `fetch` function to return a `Promise` that\
    \ resolves to a mocked response. This allows you to control the data returned\
    \ by the API during the test.\n\n# Integration Testing Strategies\n\n- **Focus\
    \ on User Flows**: Design your integration tests to cover complete user scenarios.\
    \ This ensures that the application works correctly from the user's perspective.\n\
    - **Test Key Interactions**: Focus on testing the most important interactions\
    \ between different parts of your application.\n- **Use Realistic Data**: Use\
    \ realistic data in your tests to simulate real-world scenarios.\n- **Keep Tests\
    \ Isolated**: Avoid dependencies between tests. Each test should be independent\
    \ and should not rely on the outcome of other tests.\n- **Use Mocking Strategically**:\
    \ Use mocking to isolate the parts of your application that you're testing and\
    \ to avoid making unnecessary network calls or accessing external resources.\n\
    \nIntegration tests are crucial for ensuring that your application works correctly\
    \ as a whole. By following these strategies and using appropriate testing tools,\
    \ you can build more robust and reliable JavaScript applications.\n\n# Debugging\
    \ Techniques with Browser DevTools\n\nEven with thorough testing, bugs can still\
    \ occur in your code. Browser DevTools provide a powerful set of tools for debugging\
    \ JavaScript applications directly in the browser. This section covers essential\
    \ debugging techniques using these tools.\n\n## Accessing Browser DevTools\n\n\
    You can access Browser DevTools in most modern browsers by:\n- Right-clicking\
    \ on the page and selecting \"Inspect\" or \"Inspect Element.\"\n- Using a keyboard\
    \ shortcut:\n    - Chrome/Edge/Opera: `Ctrl+Shift+I` (Windows) or `Cmd+Option+I`\
    \ (Mac)\n    - Firefox: `Ctrl+Shift+I` (Windows) or `Cmd+Option+I` (Mac)\n\n##\
    \ Key DevTools Panels for Debugging JavaScript\n\nSeveral DevTools panels are\
    \ particularly useful for debugging JavaScript:\n\n- **Elements**: This panel\
    \ allows you to inspect and modify the HTML and CSS of the page. It's useful for\
    \ understanding the structure of the DOM and how styles are applied.\n- **Console**:\
    \ This panel displays console messages (e.g., `console.log()`, `console.error()`)\
    \ and allows you to execute JavaScript code directly in the browser.\n- **Sources**:\
    \ This panel allows you to view and debug your JavaScript code. You can set breakpoints,\
    \ step through code, and inspect variables.\n- **Network**: This panel shows all\
    \ network requests made by the page. It's useful for debugging API calls and identifying\
    \ performance bottlenecks.\n- **Application (or Storage in older browsers)**:\
    \ This panel provides information about storage mechanisms like Local Storage,\
    \ Session Storage, Cookies, and IndexedDB.\n\n## Using the Console for Debugging\n\
    \nThe Console panel is a valuable tool for logging messages and evaluating expressions.\n\
    \n- `console.log(message)`: Logs a message to the console.\n- `console.warn(message)`:\
    \ Logs a warning message.\n- `console.error(message)`: Logs an error message.\n\
    - `console.table(data)`: Displays data in a tabular format.\n- `console.group(label)`\
    \ and `console.groupEnd()`: Groups related console messages together.\n\nExample:\n\
    \n```javascript\nfunction myFunction(a, b) {\n  console.log('a:', a);\n  console.log('b:',\
    \ b);\n  const sum = a + b;\n  console.log('sum:', sum);\n  return sum;\n}\n\n\
    myFunction(5, 10);\n```\n\nThis will output the values of `a`, `b`, and `sum`\
    \ to the console, helping you understand the flow of your code.\n\n## Setting\
    \ Breakpoints in the Sources Panel\n\nBreakpoints allow you to pause the execution\
    \ of your JavaScript code at a specific line. This is extremely useful for inspecting\
    \ variables and understanding the state of your application at a particular point\
    \ in time.\n\nTo set a breakpoint:\n1. Open the Sources panel.\n2. Navigate to\
    \ the JavaScript file you want to debug.\n3. Click on the line number where you\
    \ want to set the breakpoint. A blue marker will appear.\n\nWhen your code reaches\
    \ the breakpoint, execution will pause. You can then use the debugger controls\
    \ to:\n- **Step over**: Execute the current line and move to the next line.\n\
    - **Step into**: Step into a function call.\n- **Step out**: Step out of a function.\n\
    - **Resume**: Continue execution until the next breakpoint or the end of the script.\n\
    \n## Inspecting Variables and Scope\n\nWhen execution is paused at a breakpoint,\
    \ you can inspect variables in the Scope panel (usually in the right-hand sidebar\
    \ of the Sources panel). This allows you to see the current values of variables\
    \ in the current scope, as well as variables in parent scopes (closures).\n\n\
    ## Using Watch Expressions\n\nWatch expressions allow you to monitor the value\
    \ of an expression as your code executes. You can add watch expressions in the\
    \ Watch panel (usually in the right-hand sidebar of the Sources panel).\n\n##\
    \ Debugging Asynchronous Code\n\nDebugging asynchronous code can be more challenging.\
    \ However, DevTools provides features to help:\n\n- **Async stack traces**: DevTools\
    \ can often show the call stack that led to an asynchronous operation, even if\
    \ the code jumps between different functions or event handlers.\n- **Breakpoints\
    \ in event listeners and promises**: You can set breakpoints inside event handlers\
    \ or `.then()` callbacks of `Promises` to inspect the state at different stages\
    \ of an asynchronous operation.\n\n## Debugging React Components\n\nThe React\
    \ DevTools extension (available for Chrome and Firefox) provides additional tools\
    \ for debugging React components. It allows you to inspect the component tree,\
    \ props, and state, making it easier to understand how your components are rendering\
    \ and interacting.\n\n# Practical Tips for Debugging\n\n- Use `console.log()`\
    \ strategically: Use `console.log()` to output important information about your\
    \ code’s execution.\n- Use breakpoints effectively: Set breakpoints at key points\
    \ in your code to inspect variables and understand the program flow.\n- Use watch\
    \ expressions for monitoring values: Watch expressions can help you track how\
    \ values change over time.\n- Use the Network panel for API debugging: Inspect\
    \ network requests and responses to identify API issues.\n- Use React DevTools\
    \ for React-specific debugging: Inspect component props, state, and the component\
    \ tree.\n\n## Try It Yourself Exercise 3\n\nWriting unit tests for a JavaScript\
    \ function\n\nThis exercise involves writing unit tests for a utility function\
    \ that formats a phone number. This will give you experience with setting up a\
    \ test file, writing test cases, and using Jest matchers.\n"
