  trans: "\n\nWebStorm 是由 JetBrains 开发的一款专为 Web 开发设计的强大集成开发环境 (IDE)。它提供了代码分析、重构和调试等高级功能。WebStorm\
    \ 是一款付费 IDE，但它提供免费试用。\n\n选择代码编辑器是一个个人决定。VS Code 是非常受欢迎的选择，因为它是免费、跨平台且具有高度扩展性的。\n\
    \n## 设置你的项目\n\n安装好 Node.js、`npm/yarn` 和代码编辑器后，你就可以准备好创建第一个 JavaScript 项目了。\n\n\
    1. 为你的项目创建一个新目录。\n2. 打开终端或命令行提示符，并使用 `cd` 命令导航到项目目录。\n3. 运行 `npm init -y` 初始化一个新的\
    \ `npm` 项目。这将创建一个带有默认设置的 `package.json` 文件。或者如果你倾向于使用 `yarn`，可以运行 `yarn init -y`。\n\
    4. 在你的代码编辑器中打开项目目录。\n\n你现在已经准备好开始编写 JavaScript 代码了。这种基础设置包含了 Node.js、包管理和强大的代码编辑器，构成了现代\
    \ JavaScript 开发的基石，使开发者能够构建复杂且高性能的应用程序。随着本书的深入，你将看到这些工具如何协同工作创建一个流畅高效的开发工作流。\n\
    \n## JavaScript 基础：变量、数据类型、运算符\n\n在有了完善的开发环境后，我们现在可以将注意力转向 JavaScript 的核心组件：变量、数据类型和运算符。这些基本概念对于理解如何编写高效且功能良好的\
    \ JavaScript 代码至关重要。\n\n### 变量：存储数据\n\n在编程中，变量充当数据的命名的存储位置。它们允许你存储值、对其进行操作并在代码中引用它们。在\
    \ JavaScript 中，你使用三个关键字声明变量：`var`、`let` 和 `const`。\n\n`var` 是 JavaScript 中声明变量的传统方式。然而，它在作用域（变量在代码不同部分的可访问性）方面有一些特性，可能会导致意想不到的行为。因此，通常建议在现代\
    \ JavaScript 开发中避免使用 `var`。\n\n`let` 是声明程序执行期间可能重新赋值的变量的首选方式。它具有块级作用域，意味着它仅在定义的代码块内是可的（例如在循环或\
    \ if 语句内部）。这有助于防止意外的变量覆盖并让你的代码更具预测性。\n\n`const` 用于声明常量，即初始化后值不能重新赋值的变量。与 `let`\
    \ 一样，`const` 也具有块级作用域。需要注意的是，虽然 `const` 变量的值不能重新赋值，但如果值是一个对象或数组，则可以修改该对象或数组内部属性或元素。\n\
    \n以下是一些变量声明的示例：\n\n```javascript\nlet message = \"Hello, world!\"; // 声明一个名为 message\
    \ 的变量并分配字符串值。\nconst PI = 3.14159; // 声明一个名为 PI 的常量并分配一个数值。\nlet counter = 0;\
    \ // 声明一个名为 counter 的变量并分配初始值 0。\ncounter = 1; // 将 counter 的值重新赋值为 1。\n```\n\n\
    选择正确的变量声明关键字很重要。对于不会改变的值，默认使用 `const`。对于可能需要重新赋值的值，使用 `let`。避免使用 `var`。\n\n###\
    \ 数据类型：分类数据\n\nJavaScript 有几种内置数据类型，用于对变量可以包含的值类型进行分类。理解这些数据类型对于正确执行操作和处理数据至关重要。\n\
    \n* **Number**：表示数值，包括整数和浮点数。\n```javascript\nlet age = 30;\nlet price = 99.99;\n\
    ```\n* **String**：表示由单引号或双引号括的文本数据。\n```javascript\nlet name = \"John Doe\";\n\
    let greeting = 'Hello!';\n```\n* **Boolean**：表示逻辑值：true（真）或 false（假）。\n```javascript\n\
    let isLoggedIn = true;\nlet hasPermission = false;\n```\n* **Null**：表示值的刻意缺失。\n\
    ```javascript\nlet user = null; // 表示用户对象目前为空。\n```\n* **Undefined**：表示已声明但尚未赋值的变量。\n\
    ```javascript\nlet city; // city 是 undefined。\n```\n* **Symbol (ES6)**：表示唯一且不可变的值，通常用对象属性的键。\n\
    ```javascript\nconst uniqueId = Symbol('id');\n```\n* **Object**：表示键值对的集合。对象是多功能的，可以表示复杂的数据结构。\n\
    ```javascript\nlet person = {\n  name: \"Jane Doe\",\n  age: 25,\n  city: \"New\
    \ York\"\n};\n```\n\n### 运算符：执行操作\n\n运算符是会对值（操作数）执行操作的符号。JavaScript 提供了用于各种用途的运算符。\n\
    \n* **算术运算符**：执行数学计算。\n    * `+`（加法）\n    * `-`（减法）\n    * `*`（乘法）\n    * `/`（除法）\n\
    \    * `%`（取模 – 返回除法的余数）\n    * `**`（幂）\n```javascript\nlet sum = 10 + 5; // 15\n\
    let difference = 20 - 8; // 12\nlet product = 6 * 7; // 42\nlet quotient = 15\
    \ / 3; // 5\nlet remainder = 10 % 3; // 1\nlet power = 2 ** 3; // 8\n```\n* **赋值运算符**：将值赋予变量。\n\
    \    * `=`（赋值）\n    * `+=`（加赋值）\n    * `-=`（减赋值）\n    * `*=`（乘赋值）\n    * `/=`（除法赋值）\n\
    ```javascript\nlet x = 10;\nx += 5; // x 现在是 15 (等于 x = x + 5)\n```\n* **比较运算符**：比较两个值并返回布尔结果。\n\
    \    * `==`（相等 – 弱相等，执行类型转换）\n    * `===`（严格相等 – 严格相等，不执行类型转换）\n    * `!=`（不等于\
    \ – 弱不等于）\n    * `!==`（严格不等于 – 严格不等于）\n    * `>`（大于）\n    * `<`（小于）\n    * `>=`（大于或等于）\n\
    \    * `<=`（小于或等于）\n    * 强烈建议使用严格相等（`===` 和 `!==`）以避免意外的类型转换问题。\n* **逻辑运算符**：对布尔值执行逻辑操作。\n\
    \    * `&&`（逻辑与）\n    * `||`（逻辑或）\n    * `!`（逻辑非）\n```javascript\nlet a = true;\n\
    let b = false;\na && b; // false\na || b; // true\n!a; // false\n```\n* **字符串运算符**：连接字符串。\n\
    \    * `+`（连接）\n```javascript\nlet firstName = \"John\";\nlet lastName = \"Doe\"\
    ;\nlet fullName = firstName + \" \" + lastName; // \"John Doe\"\n```\n\n理解变量、数据类型和运算符是编写\
    \ JavaScript 代码的基础。这些基础构建模块允许你存储、操作和处理数据，为更复杂的编程概念奠定基础。始终使用 `let` 和 `const`、对数据类型的理解以及使用严格相等运算符，对于编写健壮且可预测的\
    \ JavaScript 代码至关重要。\n\n## 控制流：条件判断 (if/else, switch), 循环 (for, while, do…while)\n\
    \n控制流语句是决定代码执行顺序的机制。它们允许你做出决策（条件）并重复操作（循环），为程序增加动态性和逻辑。本节涵盖了 JavaScript 中的基础控制流结构：`if/else`\
    \ 语句、`switch` 语句以及各种循环结构（`for`、`while` 和 `do…while`）。\n\n### 条件判断：做出决策\n\n条件语句允许你的代码根据特定条件的真假来执行不同的代码块。最常见的条件语句是\
    \ `if` 语句。\n\n* `if` 语句：只有当指定的条件求值为真时，`if` 语句才会执行代码块。\n```javascript\nlet age\
    \ = 20;\nif(age >= 18) {\n  console.log(\"你有投票权.\");\n}\n```\n* `else` 语句：当 `if`\
    \ 条件为假时，`else` 语句提供另一个备选执行代码块。\n```javascript\nlet age = 16;\nif(age >= 18) {\n\
    ```\n\n"
- fmt: "\n```javascript\nconsole.log(\"You are eligible to vote.\");\n} else {\n \
    \ console.log(\"You are not eligible to vote yet.\");\n}\n```\n\n- `else if` statement:\
    \ The `else if` statement allows you to check multiple conditions sequentially.\
    \ If the initial `if` condition is false, the `else if condition1` is evaluated.\
    \ If it's true, its associated block of code is executed. You can have multiple\
    \ `else if` statements.\n\nJavaScript\n```javascript\nlet score = 75;\n\nif(score\
    \ >= 90) {\n  console.log(\"Grade: A\");\n} else if (score >= 80) {\n  console.log(\"\
    Grade: B\");\n} else if (score >= 70) {\n  console.log(\"Grade: C\");\n} else\
    \ {\n  console.log(\"Grade: D\");\n}\n```\n\n- Ternary Operator: The ternary operator\
    \ is a concise way to write simple `if/else` statements. It has the following\
    \ syntax: `condition ? expressionIfTrue : expressionIfFalse`.\n\nJavaScript\n\
    ```javascript\nlet isAdult = age >= 18 ? \"Adult\" : \"Minor\";\nconsole.log(isAdult);\
    \ // Output will vary based on the value of age.\n```\n\n- `switch` statement:\
    \ The `switch` statement provides an alternative to multiple `else if` statements\
    \ when you need to compare a value against several different cases.\n\nJavaScript\n\
    ```javascript\nlet day = \"Monday\";\n\nswitch (day) {\n  case \"Monday\":\n \
    \   console.log(\"It's the start of the week.\");\n    break;\n  case \"Friday\"\
    :\n    console.log(\"It's almost the weekend!\");\n    break;\n  default:\n  \
    \  console.log(\"It's a regular day.\");\n}\n```\nThe `break` statement is crucial\
    \ in a `switch` statement. It terminates the execution of the `switch` block.\
    \ If `break` is omitted, execution will \"fall through\" to the next `case`, even\
    \ if its condition doesn't match.\n\n# Loops: Repeating Actions\n\nLoops allow\
    \ you to execute a block of code repeatedly. JavaScript provides several loop\
    \ constructs:\n\n- `for` loop: The `for` loop is typically used when you know\
    \ in advance how many times you want to iterate. It consists of three parts:\n\
    \    - Initialization: Executed once before the loop starts.\n    - Condition:\
    \ Evaluated before each iteration. The loop continues as long as the condition\
    \ is true.\n    - Increment/Decrement: Executed after each iteration.\n\nJavaScript\n\
    ```javascript\nfor (let i = 0; i < 5; i++) {\n  console.log(\"Iteration: \" +\
    \ i);\n}\n```\n\n- `while` loop: The `while` loop continues to execute as long\
    \ as a specified condition is true. The condition is evaluated before each iteration.\n\
    \nJavaScript\n```javascript\nlet counter = 0;\nwhile(counter < 3) {\n  console.log(\"\
    Counter: \" + counter);\n  counter++;\n}\n```\n\n- `do…while` loop: The `do...while`\
    \ loop is similar to the `while` loop, but the code block is executed at least\
    \ once before the condition is evaluated.\n\nJavaScript\n```javascript\nlet i\
    \ = 0;\ndo {\n  console.log(\"Value of i: \" + i);\n  i++;\n} while(i < 2);\n\
    ```\n\n- `for...in` loop: The `for...in` loop iterates over the enumerable properties\
    \ of an object.\n\nJavaScript\n```javascript\nconst person = { name: \"Alice\"\
    , age: 30, city: \"London\" };\nfor (let key in person) {\n  console.log(key +\
    \ \": \" + person[key]);\n}\n```\n\n- `for...of` loop (ES6): The `for...of` loop\
    \ iterates over iterable objects, such as arrays, strings, maps, sets, etc.\n\n\
    JavaScript\n```javascript\nconst numbers = [1, 2, 3, 4, 5];\nfor (let number of\
    \ numbers) {\n  console.log(number);\n}\n```\nChoosing the right loop depends\
    \ on the specific situation. Use `for` loops when the number of iterations is\
    \ known. Use `while` loops when the loop should continue as long as a condition\
    \ is true. Use `do...while` loops when the code block needs to be executed at\
    \ least once. Use `for...in` to iterate over object properties, and `for...of`\
    \ to iterate over iterable objects. Proper use of control flow statements is crucial\
    \ for creating dynamic and functional JavaScript programs. They allow you to create\
    \ complex logic and handle various scenarios effectively.\n\n### Did You Know?\
    \ The history of JavaScript and its initial name\n\nThe story of JavaScript is\
    \ intertwined with the early days of the World Wide Web and the need for dynamic,\
    \ interactive web pages. In the mid-1990s, the web was largely static, with HTML\
    \ primarily used for structuring content. Netscape Communications Corporation,\
    \ the creator of the popular Netscape Navigator web browser, sought to add interactivity\
    \ to web pages, making them more engaging for users.\n\nIn May 1995, Brendan Eich,\
    \ a programmer at Netscape, was tasked with developing a scripting language for\
    \ Netscape Navigator. The goal was to create a language that could be used by\
    \ web developers to add dynamic behavior to web pages, such as form validation,\
    \ animations, and other interactive elements.\n\nEich's work resulted in a language\
    \ initially code-named \"Mocha.\" This early version of the language was developed\
    \ in just ten days, a testament to Eich's skill and the urgency of the project.\
    \ Mocha was then briefly renamed \"LiveScript\" in the beta release of Netscape\
    \ Navigator 2.0 in September 1995.\n\nHowever, just a few months later, in December\
    \ 1995, Netscape made a strategic decision to rename the language to \"JavaScript.\"\
    \ This name change was driven by a marketing partnership with Sun Microsystems,\
    \ the creators of the Java programming language. Java was gaining significant\
    \ popularity at the time, and Netscape hoped to capitalize on this trend by associating\
    \ their scripting language with Java.\n\nDespite the similar name, JavaScript\
    \ and Java are fundamentally different languages. Java is a compiled, statically\
    \ typed language, while JavaScript is an interpreted, dynamically typed language.\
    \ The syntax of JavaScript does borrow some elements from Java, but the underlying\
    \ concepts and paradigms are distinct.\n\nThe name \"JavaScript\" has been a source\
    \ of confusion for many years, leading some to believe that it is a simplified\
    \ version of Java. However, it is important to remember that JavaScript is its\
    \ own language with its own unique characteristics and capabilities.\n\nThe rapid\
    \ development and adoption of JavaScript in the mid-1990s played a crucial role\
    \ in the evolution of the web. It transformed web pages from static documents\
    \ into interactive and dynamic experiences, paving the way for the rich and complex\
    \ web applications we use today.\n\n# Chapter 2: Working with the DOM and Events\n\
    \n### The Document Object Model (DOM) Tree\n\nThe Document Object Model (DOM)\
    \ is a crucial interface for web developers. It represents the structure of an\
    \ HTML or XML document as a tree-like structure, where each element, attribute,\
    \ and piece of text is represented as a node. This representation allows JavaScript\
    \ to interact with and manipulate the content, structure, and style of web pages\
    \ dynamically. Understanding the DOM is essential for creating interactive experiences.\n\
    \nThe DOM Structure\n\nWhen a web browser loads an HTML page, it parses the HTML\
    \ code and creates a corresponding DOM tree in memory. This tree represents the\
    \ hierarchical relationship between the different elements. The top of the tree\
    \ is the `document`, which represents the entire HTML document. Below the `document`\
    \ is the root element, usually the `html` element. From there, the tree branches\
    \ out to represent other elements, such as `head`, `body`, and all the elements\
    \ nested within them.\n\nEach element in the HTML document is represented as an\
    \ element node in the DOM tree. Attributes of elements are represented as attribute\
    \ nodes, and text content within elements is represented as text nodes. Consider\
    \ the following simple HTML snippet:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>My Web Page</title>\n</head>\n<body>\n  <h1>Welcome</h1>\n  <p>This is\
    \ a paragraph.</p>\n</body>\n</html>\n```\n\nThe DOM tree for this HTML would\
    \ look conceptually like this:\n\n- `document`\n    - `html`\n        - `head`\n\
    \            - `title`\n                - Text Node: \"My Web Page\"\n       \
    \ - `body`\n            - `h1`\n                - Text Node: \"Welcome\"\n   \
    \         - `p`\n                - Text Node: \"This is a paragraph.\"\n\nThis\
    \ tree structure illustrates the parent-child relationships between nodes. For\
    \ example, the `body` element is a child of the `html` element, and the `h1` and\
    \ `p` elements are children of the `body` element. The text content within the\
    \ `h1` and `p` tags are text nodes that are children of their respective parent\
    \ elements.\n\nNavigating the DOM\n"
