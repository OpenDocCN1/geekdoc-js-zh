    Some useful properties of the event object include:


    ​● ​type: The type of event (e.g., "click," "mouseover").


    ​● ​target: The element that triggered the event.


    ​● ​currentTarget: The element the event listener is attached to.


    ​● ​clientXand clientY: The X and Y coordinates of the mouse pointer relative
    to the browser window (for mouse events).


    ​● ​key: The key that was pressed (for keyboard events).


    Event Propagation: Bubbling and Capturing


    When an event occurs on an element, it can propagate up or down the DOM tree.
    There are two phases of event propagation:


    ​● ​Capturing Phase:The event travels down the DOM tree from the window to the
    target element. Event listeners attached in the capturing phase are executed before
    the event reaches the target element.


    ​● ​Bubbling Phase:The event travels up the DOM tree from the target element to
    the window. Event listeners attached in the bubbling phase are executed after
    the event reaches the target element.


    By default, event listeners are attached in the bubbling phase. You can specify
    the capturing phase by setting the third argument of addEventListener()to true.


    HTML


    <div  id="outer">


    <button  id="inner">Click me</button>


    </div>


    <script>


    const outer = document.getElementById("outer");


    const inner = document.getElementById("inner");


    outer.addEventListener("click", () => {


    console.log("Outer div clicked (bubbling)");


    });


    inner.addEventListener("click", () => {


    console.log("Inner button clicked (bubbling)");


    });


    outer.addEventListener("click", () => {


    console.log("Outer div clicked (capturing)");


    }, true);


    inner.addEventListener("click", () => {


    console.log("Inner button clicked (capturing)");


    }, true);


    </script>


    If you click the button, the console will log in this order:


    ​1\. ​Outer div clicked (capturing)


    ​2\. ​Inner button clicked (capturing)


    ​3\. ​Inner button clicked (bubbling)


    ​4\. ​Outer div clicked (bubbling)


    Preventing Default Behavior


    Some events have default behavior associated with them. For example, clicking
    a link will navigate to the linked URL, and submitting a form will send the form
    data to the server. You can prevent this default behavior using the preventDefault() method
    of the event object.


    HTML


    <a  href="https://example.com"  id="myLink">Example Link</a>


    <script>


    const link = document.getElementById("myLink");


    link.addEventListener("click", (event) => {


    event.preventDefault(); // Prevents the link from navigating


    console.log("Link clicked, but navigation prevented!");


    });


    </script>


    Event handling is a core concept in web development. By understanding how to listen
    for and respond to events, you can create interactive and engaging user interfaces
    that provide a rich user experience. This knowledge is essential for building
    dynamic web applications.


    ### Did You Know? The evolution of DOM standards and browser compatibility challenges


    The Document Object Model (DOM), as we know it today, is the result of a long
    and sometimes turbulent evolution, marked by efforts to standardize a technology
    that initially suffered from significant browser inconsistencies. In the early
    days of the web, different browsers implemented their own versions of the DOM,
    leading to major compatibility issues for web developers. Code that worked in
    one browser might not work in another, making cross-browser development a considerable
    challenge.


    The need for standardization became apparent as the web grew in popularity and
    complexity. The World Wide Web Consortium (W3C), the main international standards
    organization for the World Wide Web, took on the task of defining a standard DOM.
    This effort resulted in several levels of DOM specifications:


    ​● ​DOM Level 0: This refers to the early, non-standardized DOM implementations
    in Netscape Navigator and Internet Explorer 4\. These implementations were largely
    incompatible, causing significant headaches for developers.'
