    \ API，为开发者节省了无数小时的调试和测试时间。\n- **简化的 DOM 操作**：jQuery 强大的选择器和简洁的方法使得选择、操作和遍历 DOM\
    \ 变得简单得多。许多需要很多行原生 JavaScript 才能完成的任务，只需要几行 jQuery 代码即可实现。\n- **简单的事件处理**：jQuery\
    \ 通过其直观的 `.on()` 方法和简写事件方法简化了事件处理。这使得创建交互式网页变得更加容易。\n- **动画与特效**：jQuery 提供了简单而有效的动画方法，为网页增添了视觉吸引力。\n\
    - **AJAX 简化**：jQuery 的 AJAX 方法使得向服务器发送异步请求变得更容易，能够在不刷新页面的情况下更新内容。\n- **庞大且活跃的社区**：jQuery\
    \ 获得了一个庞大且活跃的社区，这贡献了丰富的插件生态系统和随处可见的支持。\n\n在巅峰时期，jQuery 被绝大多数网站使用。它成为了前端开发的事实标准，许多开发者在学习原生\
    \ JavaScript 基础之前就先学习了 jQuery。\n\n然而，自 jQuery 流行以来，Web 开发格局已经发生了巨大变化。现代浏览器在很大程度上统一了\
    \ Web 标准，减少了对跨浏览器兼容性方案的需求。现代 JavaScript (ES6 及更高版本) 也引入了许多与 jQuery 功能相媲的特性。\n\n\
    因此，jQuery 的使用率在近年来有所下降，特别是在新项目中。然而，意识到它的历史意义以及在某些语境下的持续适用性是非常重要的，特别是在维护遗留项目或在某些简洁语法具有优势的特定任务中。\n\
    \n## 动手实践：练习 2\n\n将基础 DOM 操作任务从原生 JavaScript 转换为 jQuery\n\n此练习涉及创建一个包含按钮和段落的简单网页。当点击按钮时，段落的文本内容应该发生变化。你将首先使用原生\
    \ JavaScript 实现此功能，然后使用 jQuery 实现。\n\n### 第一部分：原生 JavaScript 实现\n\n1. 创建一个 HTML\
    \ 文件 (`index.html`)：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>DOM 操作练习</title>\n\
    </head>\n<body>\n<button id=\"myButton\">Change Text</button>\n<p id=\"myParagraph\"\
    >Initial text.</p>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\
    \n2. 创建一个 JavaScript 文件 (`script.js`)：\n\n```javascript\nconst button = document.getElementById('myButton');\n\
    const paragraph = document.getElementById('myParagraph');\n\nbutton.addEventListener('click',\
    \ function() {\n  paragraph.textContent = 'Text changed using plain JavaScript!';\n\
    });\n```\n\n**解释：**\n- 我们使用 `document.getElementById()` 获取按钮和段落元素的引用。\n- 我们使用\
    \ `addEventListener()` 为按钮绑定点击事件监听器。\n- 在事件处理器内部，我们使用 `textContent` 更改段落的文本内容。\n\
    \n### 第二部分：jQuery 实现\n\n1. 引入 jQuery：在你的 HTML 文件中添加 jQuery 库。你可以下载副本或使用 CDN（内容分发网络）。在你的\
    \ `script.js` 标签之前添加此行：\n\n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n```\n\n2. 修改你的 JavaScript 文件 (`script.js`)：\n\n```javascript\n$(document).ready(function()\
    \ { // 确保 DOM 完全加载\n  $('#myButton').on('click', function() {\n    $('#myParagraph').text('Text\
    \ changed using jQuery!');\n  });\n});\n```\n\n**解释：**\n- 我们使用 `$(document).ready()`\
    \ 确保在执行任何 jQuery 代码之前 DOM 已完全加载。这对于防止错误非常重要。\n- 我们使用 jQuery 选择器 (`#myButton`,\
    \ `#myParagraph`) 来获取元素的引用。\n- 我们使用 `.on()` 方法绑定点击事件处理器。\n- 在事件处理器内部，我们使用 `.text()`\
    \ 方法更改段落的文本内容。\n\n**对比：**\n注意 jQuery 版本要简洁了多少。虽然在这种情况下，原生 JavaScript 版本也相对简单，但在处理更复杂的\
    \ DOM 操作时，差异会变得更加显著。\n\n**进阶练习：**\n- 尝试同时使用原生 JavaScript 和 jQuery 更改段落的其他属性（例如：颜色、字体大小）。\n\
    - 尝试使用这两种方法动态地向页面添加新元素。\n- 尝试在两个版本中使用事件委托来处理处理动态添加的元素的事件。\n\n通过完成这个练习，你将更好地理解\
    \ jQuery 相比原生 JavaScript 如何简化 DOM 操作和事件处理。你还会看到 jQuery 的简洁语法在某些情况下具有优势，特别是在处理更复杂的任务时。这种实践经验将帮助你决定何时使用\
    \ jQuery，以及何时依赖现代 JavaScript 的替代方案。\n\n## 第 7 章：使用 Redux 进行状态管理\n\n### Redux 核心概念：Store、Actions、Reducers\n\
    \n随着应用程序复杂性的增加，管理应用状态变得越来越具有挑战性。状态指的是应用程序在任何给定使用的数据，包括用户数据、UI 状态和从服务器获取的数据。如果没有结构化的方法，管理状态可能会导致不可预测的行为、难以调试以及难以维护的代码。Redux\
    \ 提供了一种可预测且集中的方式来管理应用状态，使得构建复杂且可扩展的应用程序变得更容易。\n\n#### 状态管理的必要\n\n在简单的应用程序中，可以在组件内部完成状态管理。然而，随着应用程序的增长，组件之间的状态共享变得越来越复杂。跨多个组件传递数据（prop\
    \ drilling）可能会变得繁琐，而且在多处管理状态更新可能会导致不一致。\n\nRedux 通过为应用状态提供一个中央 store（存储器）来解决这些挑战。所有组件都可以以可预测的方式访问和更新此\
    \ store，使得状态管理更易于管理和维护。\n\n#### Redux 的三个核心原则\n\nRedux 构建在三个核心原则之上：\n\n1. **单一数据源**：应用状态存储在一个名为\
    \ `store` 的单一 JavaScript 对象中。这为所有组件提供了单一、可靠的真理来源。\n2. **状态是只读的**：更改状态唯一方法是触发一个\
    \ action（动作），action 是一个描述变化的纯 JavaScript 对象。这确保了状态更新是可预测且可追溯的。\n3. **通过纯函数进行更改**：`Reducers`\
    \ 是纯函数，它们接收旧状态和 action 作为参数并返回一个新状态。因为 reducers 是纯函数，它们对于给定的输入产生可预测的输出，使得测试和调试变得更容易。\n\
    \n#### Redux Store\n\nStore 是 Redux 应用程序的核心。它持有应用状态，并提供访问和更新该状态的方法。你使用 Redux 库中的\
    \ `createStore` 函数创建 store。\n\n```javascript\nimport { createStore } from 'redux';\n\
    \n// 定义一个 reducer（在下一节介绍）\nconst reducer = (state = { count: 0 }, action) => {\n\
    \  switch (action.type) {\n    case 'INCREMENT':\n      return { count: state.count\
    \ + 1 };\n    default:\n      return state;\n  }\n};\n\n// 创建 store\nconst store\
    \ = createStore(reducer);\n\n// 获取状态\nconsole.log(store.getState()); // { count:\
    \ 0 }\n```\n\n`createStore` 函数接收一个 reducer 作为参数。reducer 负责决定如何响应 action 来更新状态。初始状态可以作为\
    \ reducer 的默认值提供。\n\nstore 提供了三个主要方法：\n\n"
- fmt: "\n- `getState()`: Returns the current state of the store.\n- `dispatch(action)`:\
    \ Dispatches an action to update the state.\n- `subscribe(listener)`: Registers\
    \ a listener function that will be called whenever the state changes.\n\n# Actions\n\
    \nActions are plain JavaScript objects that describe an intention to change the\
    \ state. They must have a `type` property, which is a string that identifies the\
    \ type of action being performed. Actions can also contain additional data in\
    \ a `payload` property.\n\nHere are some examples of actions:\n\n```javascript\n\
    // Action to increment a counter\nconst incrementAction = {\n  type: 'INCREMENT'\n\
    };\n\n// Action to add a new item to a list\nconst addItemAction = {\n  type:\
    \ 'ADD_ITEM',\n  payload: { id: 1, text: 'New Item' }\n};\n```\n\nActions are\
    \ dispatched to the store using the `dispatch()` method:\n\n```javascript\nstore.dispatch(incrementAction);\n\
    store.dispatch(addItemAction);\n```\n\nDispatching an action is the only way to\
    \ change the state in a Redux application.\n\n# Reducers\n\nReducers are pure\
    \ functions that take the current state and an action as arguments and return\
    \ a new state. They are responsible for determining how the state should be updated\
    \ based on the action type.\n\nHere's an example of a reducer:\n\n```javascript\n\
    const reducer = (state = { count: 0, items: [] }, action) => {\n  switch (action.type)\
    \ {\n    case 'INCREMENT':\n      return { ...state, count: state.count + 1 };\
    \ // Create a new state object\n    case 'ADD_ITEM':\n      return { ...state,\
    \ items: [...state.items, action.payload] }; // Create a new state object\n  \
    \  default:\n      return state; // Return the current state if the action type\
    \ is not recognized\n  }\n};\n```\n\nKey points about reducers:\n- **Pure Functions**:\
    \ Reducers must be pure functions. This means they should not have any side effects\
    \ (e.g., modifying the original state, making API calls). They should only compute\
    \ a new state based on the given state and action.\n- **Immutability**: Reducers\
    \ should not mutate the existing state. Instead, they should create a new state\
    \ object with the updated values. This is crucial for Redux to detect state changes\
    \ and trigger updates in the UI. The spread syntax `(...)` is commonly used to\
    \ create new objects and arrays without mutating the originals.\n- **Default State**:\
    \ Reducers should provide a default state as the first argument. This is used\
    \ when the store is initialized.\n- **Handling Unknown Actions**: Reducers should\
    \ always return the current state if they receive an action type they don't recognize.\n\
    \n# Connecting the Pieces\n\nThe store, actions, and reducers work together in\
    \ a cycle:\n\n1. An action is dispatched to the store using `store.dispatch(action)`.\n\
    2. The store passes the current state and the action to the reducer.\n3. The reducer\
    \ computes a new state based on the action type.\n4. The store updates its internal\
    \ state with the new state returned by the reducer.\n5. Any listeners registered\
    \ with `store.subscribe()` are notified of the state change.\n\nThis predictable\
    \ flow makes it easier to understand how state changes occur in a Redux application,\
    \ making debugging and testing much simpler. This chapter has covered the fundamental\
    \ building blocks of Redux. The next sections will address more advanced topics\
    \ and practical applications.\n\n# Connecting React Components to the Redux Store\
    \ using React-Redux\n\nWhile Redux can be used with any JavaScript framework or\
    \ even without a framework, it's commonly used with React. The `react-redux` library\
    \ provides convenient tools for connecting React components to the Redux store.\n\
    \n## Installing React-Redux\n\nIf you are using npm or yarn, you can install `react-redux`\
    \ using the following command:\n\n```bash\nnpm install react-redux\n# or\nyarn\
    \ add react-redux\n```\n\n## The <Provider> Component\n\nThe `<Provider>` component\
    \ from `react-redux` makes the Redux store available to all components in your\
    \ application. It should be rendered at the top level of your component tree.\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom/client';\n\
    import { Provider } from 'react-redux';\nimport { createStore } from 'redux';\n\
    import App from './App';\nimport reducer from './reducer'; // Your Reducer\n\n\
    const store = createStore(reducer);\nconst root = ReactDOM.createRoot(document.getElementById('root'));\n\
    root.render(\n  <Provider store={store}>\n    <App />\n  </Provider>\n);\n```\n\
    \nBy wrapping your `<App>` component with `<Provider store={store}>`, all components\
    \ within `<App>` can access the Redux store.\n\n## The connect() Function\n\n\
    The `connect()` function from `react-redux` connects a React component to the\
    \ Redux store. It takes two optional arguments: `mapStateToProps` and `mapDispatchToProps`.\n\
    \n- `mapStateToProps(state)`: This function receives the entire Redux store state\
    \ as an argument and returns an object containing the specific parts of the state\
    \ that the component needs.\n- `mapDispatchToProps(dispatch)`: This function receives\
    \ the `dispatch` function as an argument and returns an object containing functions\
    \ that dispatch actions.\n\n`connect()` returns a new, connected component.\n\n\
    Here's an example:\n\n```javascript\nimport React from 'react';\nimport { connect\
    \ } from 'react-redux';\nconst Counter = ({ count, increment, decrement }) =>\
    \ {\n  return (\n    <div>\n      <p>Count: {count}</p>\n      <button onClick={increment}>Increment</button>\n\
    \      <button onClick={decrement}>Decrement</button>\n    </div>\n  );\n};\n\n\
    const mapStateToProps = (state) => {\n  return {\n    count: state.count\n  };\n\
    };\n\nconst mapDispatchToProps = (dispatch) => {\n  return {\n    increment: ()\
    \ => dispatch({ type: 'INCREMENT' }),\n    decrement: () => dispatch({ type: 'DECREMENT'\
    \ })\n  };\n};\n\nexport default connect(mapStateToProps, mapDispatchToProps)(Counter);\n\
    ```\n\nLet's break this down:\n1. We import `connect` from `react-redux`.\n2.\
    \ The `Counter` component receives `count`, `increment`, and `decrement` as `props`.\n\
    3. `mapStateToProps` takes the Redux state and returns an object with the `count`\
    \ property, which is then passed to the `Counter` component as a prop.\n4. `mapDispatchToProps`\
    \ takes the `dispatch` function and returns an object with `increment` and `decrement`\
    \ functions. These functions dispatch the corresponding actions when called and\
    \ are also passed to the `Counter` component as props.\n5. `connect(mapStateToProps,\
    \ mapDispatchToProps)(Counter)` creates a new, connected version of the `Counter`\
    \ component.\n\n## Simplified with Hooks (useSelector and useDispatch)\n\nReact-Redux\
    \ also provides hooks that simplify connecting to the store, making the code cleaner,\
    \ especially for functional components.\n\n- `useSelector(selector)`: This hook\
    \ takes a selector function (similar to `mapStateToProps`) and returns the selected\
    \ part of the state.\n- `useDispatch()`: This hook returns the `dispatch` function.\n\
    \nHere's the same example using hooks:\n\n```javascript\nimport React from 'react';\n\
    import { useSelector, useDispatch } from 'react-redux';\nconst Counter = () =>\
    \ {\n  const count = useSelector(state => state.count);\n  const dispatch = useDispatch();\n\
    \  return (\n    <div>\n      <p>Count: {count}</p>\n      <button onClick={()\
    \ => dispatch({ type: 'INCREMENT' })}>Increment</button>\n      <button onClick={()\
    \ => dispatch({ type: 'DECREMENT' })}>Decrement</button>\n    </div>\n  );\n};\n\
    \nexport default Counter;\n```\n\nThis version is much more concise. We use `useSelector`\
    \ to get the count from the state and `useDispatch` to get the `dispatch` function.\
    \ We then dispatch actions directly in the event handlers.\n\n# Practical Considerations\n\
    \n- **Choosing between connect() and Hooks**: For new projects using functional\
    \ components, hooks are generally preferred for their simplicity. `connect()`\
    \ is still relevant for class components and more complex scenarios.\n- **Performance**:\
    \ `react-redux` optimizes rendering by preventing unnecessary re-renders. However,\
    \ it’s important to structure your state and selectors efficiently to avoid performance\
    \ issues in large applications.\n- **Selectors**: Creating reusable selector functions\
    \ can improve performance and code organization.\n"
  raw: '​● ​getState(): Returns the current state of the store.


    ​● ​dispatch(action): Dispatches an action to update the state.


    ​● ​subscribe(listener): Registers a listener function that will be called whenever
    the state changes.


    Actions


    Actions are plain JavaScript objects that describe an intention to change the
    state. They must have a type property,2which is a string that identifies the type
    of action being performed. Actions can also contain additional data in a payload property.


    Here are some examples of actions:


    JavaScript


    // Action to increment a counter


    const incrementAction = {


    type: ''INCREMENT''


    };


    // Action to add a new item to a list


    const addItemAction = {


    type: ''ADD_ITEM'',


    payload: { id: 1, text: ''New Item'' }


    };


    Actions are dispatched to the store using the dispatch() method:


    JavaScript


    store.dispatch(incrementAction);


    store.dispatch(addItemAction);


    Dispatching an action is the only way to change the state in a Redux application.


    Reducers


    Reducers are pure functions that take the current state and an action as arguments
    and return a new state. They3 are responsible for determining how the state should
    be updated based on the action type.


    Here''s an example of a reducer:


    JavaScript


    constreducer = (state = { count: 0, items: [] }, action) => {


    switch (action.type) {


    case  ''INCREMENT'':


    return{ ...state, count: state.count + 1}; // Create a new state object


    case  ''ADD_ITEM'':


    return{ ...state, items: [...state.items, action.payload] }; // Create a new state
    object


    default:


    returnstate; // Return the current state if the action type is not recognized


    }


    };


    Key points about reducers:


    ​● ​Pure Functions: Reducers must be pure functions. This means they should not
    have any side effects (e.g., modifying the original state, making API calls).
    They should only compute a new state based on the given state and action.


    ​● ​Immutability:Reducers should notmutate the existing state. Instead, they should
    create a new state object with the updated values. This is crucial for Redux to
    detect state changes and trigger updates in the UI. The spread syntax (...) is
    commonly used to create new objects and arrays without mutating the originals.


    ​● ​Default State: Reducers should provide a default state as the first argument.
    This is used when the store is initialized.


    ​● ​Handling Unknown Actions: Reducers should always return the current state
    if they receive an action type they don''t recognize.


    Connecting the Pieces


    The store, actions, and reducers work together in a cycle:


    ​1\. ​An action is dispatched to the store using store.dispatch(action).


    ​2\. ​The store passes the current state and the action to the reducer.


    ​3\. ​The reducer computes a new state based on the action type.


    ​4\. ​The store updates its internal state with the new state returned by the
    reducer.


    ​5\. ​Any listeners registered with store.subscribe() are notified of the state
    change.


    This predictable flow makes it easier to understand how state changes occur in
    a Redux application, making debugging and testing much simpler. This chapter has
    covered the fundamental building blocks of Redux. The next sections will address
    more advanced topics and practical applications.


    ### Connecting React Components to the Redux Store using React-Redux


    While Redux can be used with any JavaScript framework or even without a framework,
    it''s commonly used with React. The react-redux library provides convenient tools
    for connecting React components to the Redux store.


    Installing React-Redux


    If you are using npm or yarn, you can install react-redux using the following
    command:


    Bash


    npm install react-redux


    # or


    yarn add react-redux


    The <Provider> Component


    The <Provider>component from react-redux makes the Redux store available to all
    components in your application. It should be rendered at the top level of your
    component tree.


    JavaScript


    import React from  ''react'';


    import ReactDOM from  ''react-dom/client'';


    import { Provider } from  ''react-redux'';


    import { createStore } from  ''redux'';


    import App from  ''./App'';


    import reducer from  ''./reducer''; // Your Reducer


    const store = createStore(reducer);


    const root = ReactDOM.createRoot(document.getElementById(''root''));


    root.render(


    <Provider  store={store}>


    <App />


    </Provider>


    );


    By wrapping your <App>component with <Provider store={store}>, all components
    within <App> can access the Redux store.


    The connect() Function


    The connect()function from react-reduxconnects a React component to the Redux
    store. It takes two optional arguments: mapStateToPropsand mapDispatchToProps.


    ​● ​mapStateToProps(state): This function receives the entire Redux store state
    as an argument and returns an object containing the specific parts of the state
    that the component needs.


    ​● ​mapDispatchToProps(dispatch):This function receives the dispatch function
    as an argument and returns an object containing functions that dispatch actions.


    connect() returns a new, connected component.


    Here''s an example:


    JavaScript


    import React from  ''react'';


    import { connect } from  ''react-redux'';


    const Counter = ({ count, increment, decrement }) => {


    return (


    <div>


    <p>Count: {count}</p>


    <button onClick={increment}>Increment</button>


    <button onClick={decrement}>Decrement</button>


    </div>


    );


    };


    const mapStateToProps = (state) => {


    return {


    count: state.count


    };


    };


    const mapDispatchToProps = (dispatch) => {


    return {


    increment: () => dispatch({ type: ''INCREMENT'' }),


    decrement: () => dispatch({ type: ''DECREMENT'' })


    };


    };


    export  default connect(mapStateToProps, mapDispatchToProps)(Counter);


    Let''s break this down:


    ​1\. ​We import connectfrom react-redux.


    ​2\. ​The Countercomponent receives count, increment, and decrement as props.


    ​3\. ​mapStateToPropstakes the Redux state and returns an object with the countproperty,
    which is then passed to the Counter component as a prop.


    ​4\. ​mapDispatchToPropstakes the dispatchfunction and returns an object with
    incrementand decrementfunctions. These functions dispatch the corresponding actions
    when called and are also passed to the Counter component as props.


    ​5\. ​connect(mapStateToProps, mapDispatchToProps)(Counter)creates a new, connected
    version of the Counter component.


    Simplified with Hooks (useSelectorand useDispatch)


    React-Redux also provides hooks that simplify connecting to the store, making
    the code cleaner, especially for functional components.


    ​● ​useSelector(selector): This hook takes a selector function (similar to mapStateToProps)
    and returns the selected part of the state.


    ​● ​useDispatch(): This hook returns the dispatch function.


    Here''s the same example using hooks:


    JavaScript


    import React from  ''react'';


    import { useSelector, useDispatch } from  ''react-redux'';


    const Counter = () => {


    const count = useSelector(state => state.count);


    const dispatch = useDispatch();


    return (


    <div>


    <p>Count: {count}</p>


    <button onClick={() => dispatch({ type: ''INCREMENT'' })}>Increment</button>


    <button onClick={() => dispatch({ type: ''DECREMENT'' })}>Decrement</button>


    </div>


    );


    };


    export  default Counter;


    This version is much more concise. We use useSelectorto get the countfrom the
    state and useDispatchto get the dispatch function. We then dispatch actions directly
    in the event handlers.


    Practical Considerations


    ​● ​Choosing between connect() and Hooks:For new projects using functional components,
    hooks are generally preferred for their simplicity. connect() is still relevant
    for class components and more complex scenarios.


    ​● ​Performance: react-redux optimizes rendering by preventing unnecessary re-renders.
    However, it’s important to structure your state and selectors efficiently to avoid
    performance issues in large applications.


    ​● ​Selectors: Creating reusable selector functions can improve performance and
    code organization.'
