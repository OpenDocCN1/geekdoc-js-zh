    展开运算符（spread）和剩余运算符（rest）使用相同的语法 `(...)`，但根据上下文用途不同。\n\n## 展开运算符\n展开运算符将可迭代对象（如数组或字符串）展开为单独元素。\n\
    \n### 数组展开：\n```javascript\nconst numbers1 = [1, 2, 3];\nconst numbers2 = [4,\
