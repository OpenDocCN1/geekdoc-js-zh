    myDiv\");\nmyDiv.textContent = \"New text content.\";\n</script>\n```\n\n- `innerHTML`:\
    \ 该属性设置或获取元素的 HTML 内容。它可以用于插入 HTML 标记，但在使用用户提供的数据配合 `innerHTML` 时要务必小心，因为如果处理不当可能会产生安全漏洞（跨站脚本攻击或\
    \ XSS 攻击）。\n\nHTML\n```html\n<div id=\"myDiv\"></div>\n<script>\nlet myDiv = document.getElementById(\"\
    myDiv\");\nmyDiv.innerHTML = \"<p>A new paragraph.</p>\";\n</script>\n```\n\n\
    ### 修改元素属性\n\n属性提供了有关 HTML 元素的额外信息。JavaScript 允许你动态修改这些属性：\n\n- `setAttribute(name,\
    \ value)`: 设置指定元素上属性的值。\n\nHTML\n```html\n<img id=\"myImage\" src=\"old-image.jpg\"\
    \ alt=\"Old Image\">\n<script>\nlet myImage = document.getElementById(\"myImage\"\
    );\nmyImage.setAttribute(\"src\", \"new-image.jpg\");\nmyImage.setAttribute(\"\
