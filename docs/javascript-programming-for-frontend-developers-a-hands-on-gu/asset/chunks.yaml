  trans: "\n\n-   **拦截器**: `Axios` 支持拦截器，这对于诸如为每个请求添加身份验证头等任务非常有用。`Fetch` 没有内置的拦截器。\n\
    -   **浏览器和 Node.js 支持**: `Axios` 可以在浏览器和 Node.js 环境中运行，而 `Fetch` 主要是一个浏览器 API（尽管可以通过\
    \ polyfills 在 Node.js 中使用）。\n\n## 在 Fetch 和 Axios 之间选择\n\n`Fetch` 和 `Axios` 之间的选择取决于你的具体需求。如果你正在开发一个简单的项目，并且不需要拦截器等高级功能，`Fetch`\
    \ 可能足够了。然而，对于更复杂的项目，`Axios` 提供了许多优势，可以简化开发并提高代码的可维护性。\n\n## 实际应用与考虑\n\n与 API 交互涉及若干实际考虑因素：\n\
    \n- ****频率限制**: 许多 API 实施了频率限制，限制了你在特定时间内可以发送的请求数量。优雅地处理频率限制对于避免被 API 封非常重要。\n\
    - **验证**: 某些 API 需要身份验证才能访问其数据。这通常涉及使用 API 密钥、令牌（tokens）或其他身份验证机制。\n- **错误处理**:\
    \ 适当的错误处理对于构建健壮的应用至关重要。你应该处理网络错误、API 错误和其他潜在问题。\n- **数据转换**: 通常情况下，API 返回的数据在用于应用程序之前，需要进行转换或处理。\n\
    \n通过理解 HTTP 请求并有效使用 `Fetch` 和 `Axios` 等工具，你可以构建与外部数据源无缝交互的强大 Web 应用。本章为处理 API\
    \ 提供了基础，通过实践，你将精通检索和发送数据，从而创建动态且吸引人的 Web 体验。\n\n## 处理 JSON 数据：解析与序列化\n\n大多数现代\
    \ API 使用 JSON（JavaScript 对象表示法）格式交换数据。JSON 是一种轻量级的数据交换格式，易于人类读写，于机器解析和生成。它基于 JavaScript\
    \ 语法的子集，特别适用于 Web 开发。\n\n### 理解 JSON 结构\n\nJSON 数据以键值对的形式结构化，类似于 JavaScript 对象。键（Keys）始终是双引号括的字符串，值（Values）可以是：\n\
    \n- 字符串（用双引号括）\n- 数字（整数或浮点数）\n- 布尔值（true 或 false）\n- 数组（值的有序列表）\n- 对象（嵌套的键值对集合）\n\
    - null\n\n这里是一个代表产品的 JSON 数据示例：\n\n```json\n{\n  \"name\": \"Example Product\"\
    ,\n  \"description\": \"A detailed description of the product.\",\n  \"price\"\
    : 29.99,\n  \"inStock\": true,\n  \"categories\": [\"Electronics\", \"Gadgets\"\
    ],\n  \"dimensions\": {\n    \"width\": 10,\n    \"height\": 5,\n    \"depth\"\
    : 2\n  }\n}\n```\n\n这个 JSON 对象包含几个键值对。键是 \"name\", \"description\", \"price\"\
    , \"inStock\", \"categories\" 和 \"dimensions\"。值分别是字符串、另一个字符串、一个数字、一个布尔值、字符串数组和一个嵌套对象。\n\
    \n### 解析 JSON\n\n当你从 API 接收 JSON 格式的数据时，你需要解析它将其转换为 JavaScript 对象，以便你可以在代码中使用它。`Fetch`\
    \ 和 `Axios` 都能处理这一过程，尽管存在略有不同。\n\n#### 使用 Fetch 进行解析：\n\n如上一节所述，`Fetch` 的 `response.json()`\
    \ 方法将响应体解析为 JSON。该方法返回一个 `Promise`，解析为解析后的 JavaScript 对象。这里有一个提示：\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json()) //\
    \ 解析 JSON\n  .then(data => {\n    console.log(data.name); // 访问解析对象的属性\n  })\n\
    \  .catch(error => {\n    console.error('Error:', error);\n  });\n```\n\n关键部分是\
    \ `.then(response => response.json())`。这一行获取 `Response` 对象并使用其 `json()` 方法将 JSON\
    \ 字符串转换为可用的 JavaScript 对象。之后，你可以使用点符号法访问数据（例如 `data.name`, `data.price`）。\n\n\
    #### 使用 Axios 进行解析：\n\n`Axios` 执行自动 JSON 转换。当服务器响应的数据带有指示 JSON 的 `Content-Type`\
    \ （通常为 `application/json`）时，`Axios` 会自动将响应体解析为 JavaScript 对象。这意味着你可以直接通过 `response.data`\
    \ 访问数据：\n\n```javascript\naxios.get('https://api.example.com/data')\n  .then(response\
    \ => {\n    console.log(response.data.name); // 直接访问数据\n  })\n  .catch(error =>\
    \ {\n    console.error('Error:', error);\n  });\n```\n\n这种自动解析是 `Axios` 相比 `Fetch`\
    \ 提供的便利之一。\n\n### 序列化 JSON\n\nJSON 序列化是解析的反过程；它是将 JavaScript 对象转换为 JSON 字符串的过程。当你需要在请求体中向\
    \ API 发送数据时是必要的，例如在进行 `POST` 或 `PUT` 请求时。\n\nJavaScript 提供了 `JSON.stringify()`\
    \ 方法来实现此目的。它接受一个 JavaScript 对象作为参数并返回该对象的 JSON 字符串表示。\n\n这是一个示例：\n\n```javascript\n\
    const product = {\n  name: \"New Product\",\n  price: 49.99,\n  category: \"Software\"\
    \n};\n\nconst jsonString = JSON.stringify(product);\nconsole.log(jsonString);\n\
    // 输出: {\"name\":\"New Product\",\"price\":49.99,\"category\":\"Software\"}\n\n\
    // 使用 Fetch 发起 POST 请求：\n```javascript\nfetch('https://api.example.com/products',\
    \ {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json'\n\
    \  },\n  body: JSON.stringify(product)\n})\n// ... 其余 fetch 代码\n```\n\n在这个示例中，`JSON.stringify(product)`\
    \ 将 `product` 对象转换为 JSON 字符串，然后可以发送到 HTTP 请求的体中。\n\n### 处理不同数据类型\n\n`JSON.stringify()`\
    \ 正正确处理大多数 JavaScript 数据类型，包括字符串、数字、布尔值、数组和嵌套对象。然而，注意它是如何处理某些特殊情况是非常重要的：\n\n-\
    \ **函数**: 函数会被 `JSON.stringify()` 忽略。\n- **日期**: 日期会被转换为 ISO 8601 字符串格式。\n- **undefined\
    \ 和 NaN**: 这些值会被转换为 `null`。\n\n### 实际考虑因素\n\n- **错误处理**: 在解析 JSON 时，处理潜在错误至关重要。如果\
    \ API 返回的数据不是有效的 JSON，`response.json()` 方法（在 `Fetch` 中）或自动解析（在 `Axios` 中）将抛出错误。你应该使用\
    \ `try...catch` 块来处理这些错误。\n- **数据验证**: 解析 JSON 之后，你可能希望验证数据以确保它符合你预期的模式。这有助于防止应用程序中出现意外错误。\n\
    \n有效地与 JSON 工作是与现代 Web API 交互的基础。理解如何解析和序列化 JSON 数据允许你在应用程序和外部服务之间无缝交换信息，创建更丰富、更动态的\
    \ Web 体验。本节涵盖了 JavaScript 中处理 JSON 的要点，为你提供了有效管理数据的必要工具。\n\n## 处理 API 错误和边界情况\n\
    \n与 API 交互并不总是风风顺。网络问题、服务器宕机、错误的请求或意外的数据格式都会导致错误。优雅地处理这些错误对于创建健壮且用户友的应用至关重要。本节介绍了管理\
    \ API 错误和其他边界情况的策略。\n\n### 理解 HTTP 状态码\n\n当发出 HTTP 请求时，服务器会返回一个状态码。这些代码提供了有关请求结果的信息。状态码分为几类：\n\
    \n- **1xx (信息)**: 请求已接收，处理正在继续。\n- **2xx (成功)**: 请求成功。（例如 200 OK, 201 Created）\n\
    - **3xx (重定向)**: 需要采取进一步的操作来完成请求。\n\n"
- fmt: "\n- `4xx (Client Error)`: The request contains bad syntax or cannot be fulfilled.\
    \ (e.g., `400 Bad Request`, `404 Not Found`)\n- `5xx (Server Error)`: The server\
    \ failed to fulfill an apparently valid request. (e.g., `500 Internal Server Error`,\
    \ `503 Service Unavailable`)\n\nKnowing these status codes is crucial for understanding\
    \ the nature of an error and taking appropriate action.\n\n## Error Handling with\
    \ Fetch\n\nFetch uses `Promises`, so error handling is typically done with `.catch()`\
    \ blocks. However, Fetch's `.catch()` only handles network errors. It doesn't\
    \ handle HTTP error status codes (`4xx` and `5xx`). To handle those, you need\
    \ to check the `response.ok` property.\n\nHere's an example:\n\n```javascript\n\
    fetch('https://api.example.com/nonexistent-resource')\n  .then(response => {\n\
    \    if (!response.ok) {\n      // Check for HTTP error status codes (4xx or 5xx)\n\
    \      throw new Error(`HTTP error! status: ${response.status}`);\n    }\n   \
    \ return response.json();\n  })\n  .then(data => {\n    console.log('Data:', data);\n\
    \  })\n  .catch(error => {\n    console.error('Fetch error:', error); // Catches\
    \ both network errors and HTTP errors\n  });\n```\n\nIn this example, if the server\
    \ responds with a `404 Not Found`, the `response.ok` property will be false, and\
    \ an error will be thrown. This error is then caught by the `.catch()` block.\n\
    \n## Error Handling with Axios\n\nAxios provides more robust error handling. When\
    \ a request receives an HTTP error status code (outside the `2xx` range), Axios\
    \ rejects the `Promise` with an error object that contains more information, including\
    \ the status code, response data (if available), and request configuration.\n\n\
    Here’s how you handle errors with Axios:\n\n```javascript\naxios.get('https://api.example.com/nonexistent-resource')\n\
    \  .then(response => {\n    console.log('Data:', response.data);\n  })\n  .catch(error\
    \ => {\n    if (error.response) {\n      // The request was made and the server\
    \ responded with a status code\n      // that falls out of the range of 2xx\n\
    \      console.error('Response Error:', error.response.status);\n      console.error('Response\
    \ Data:', error.response.data);\n      console.error('Response Headers:', error.response.headers);\n\
    \    } else if (error.request) {\n      // The request was made but no response\
    \ was received\n      // `error.request` is an instance of XMLHttpRequest in the\
    \ browser and an instance of\n      // http.ClientRequest in node.js\n      console.error('Request\
    \ Error:', error.request);\n    } else {\n      // Something happened in setting\
    \ up the request that triggered an Error\n      console.error('Error', error.message);\n\
    \    }\n    console.error('Config:', error.config);\n  });\n```\n\nAxios provides\
    \ the `error.response` property which contains the server's response details (status,\
    \ data, headers). If the request never reaches the server (e.g., network error),\
    \ `error.request` will be available. Finally, `error.message` will contain a more\
    \ general error message. This detailed error information makes debugging much\
    \ easier.\n\n## Handling Different Error Scenarios\n\n- **Network Errors**: These\
    \ occur when the client cannot connect to the server (e.g., no internet connection).\
    \ With Fetch, these are caught by the `.catch()` block. With Axios, `error.request`\
    \ will be present.\n- **404 Not Found**: This indicates that the requested resource\
    \ does not exist on the server.\n- **400 Bad Request**: This usually means there's\
    \ a problem with the data sent in the request.\n- **500 Internal Server Error**:\
    \ This indicates a problem on the server-side.\n- **Rate Limiting Errors**: Many\
    \ APIs have rate limits. If you exceed the limit, the API will return a specific\
    \ error (often a `429 Too Many Requests` status code). You should implement logic\
    \ to handle these errors, such as waiting before retrying the request.\n\n## Edge\
    \ Cases and Defensive Programming\n\nBeyond standard HTTP errors, you should also\
    \ consider edge cases:\n\n- **Unexpected Data Formats**: Even if the request is\
    \ successful, the API might return data in an unexpected format. You should validate\
    \ the received data to avoid errors in your application.\n- **Timeouts**: Requests\
    \ can sometimes take a long time to complete. Implementing timeouts can prevent\
    \ your application from hanging indefinitely. Axios has built-in timeout functionality.\n\
    - **Retries**: For transient errors (like temporary network issues), implementing\
    \ automatic retries can improve reliability. Axios libraries can help with this.\n\
    \n## Best Practices for Error Handling\n\n- **Provide User-Friendly Messages**:\
    \ Display informative error messages to the user without revealing sensitive information.\n\
    - **Log Errors**: Log errors on the server-side for debugging and monitoring.\n\
    - **Handle Errors Gracefully**: Prevent errors from crashing your application.\n\
    - **Test Error Handling**: Thoroughly test your error handling logic to ensure\
    \ it works as expected.\n\nBy implementing robust error handling and considering\
    \ edge cases, you can create more reliable and user-friendly applications that\
    \ interact seamlessly with APIs, even when things don't go exactly as planned.\
    \ This section has given you the tools to create applications that respond correctly\
    \ to a variety of API problems.\n\n## Did You Know? The RESTful API design principles\
    \ and their importance\n\nWhen discussing APIs, the term \"RESTful\" often comes\
    \ up. REST, which stands for Representational State Transfer, is an architectural\
    \ style for designing networked applications. While not all APIs strictly adhere\
    \ to every REST principle, understanding them is crucial for working with modern\
    \ web services.\n\nREST is not a protocol like HTTP; it's a set of guidelines.\
    \ APIs that follow these guidelines are considered RESTful. Here are the key principles:\n\
    \n- **Client-Server**: This principle separates the user interface (client) from\
    \ the data storage and logic (server). This separation improves portability, scalability,\
    \ and allows for independent evolution of the client and server.\n- **Stateless**:\
    \ Each request from a client to the server must contain all the information needed\
    \ to understand and process the request. The server does not store any client\
    \ context between requests. This simplifies server design and improves scalability.\n\
    - **Cacheable**: Responses from the server should be cacheable by clients or intermediaries\
    \ (like proxies). This reduces server load and improves performance. HTTP provides\
    \ mechanisms for caching, such as `Cache-Control` headers.\n- **Uniform Interface**:\
    \ This is the most important principle and encompasses several sub-constraints:\n\
    \    - **Resource Identification**: Each resource (data entity) is identified\
    \ by a unique URL.\n    - **Representation**: Resources are represented in various\
    \ formats (e.g., JSON, XML). Clients and servers exchange representations of resources,\
    \ not the resources themselves.\n    - **Self-Descriptive Messages**: Messages\
    \ include enough information to understand how to process them. This includes\
    \ media types (e.g., `application/json`) and hypermedia links.\n    - **Hypermedia\
    \ as the Engine of Application State (HATEOAS)**: This principle states that the\
    \ API should provide links within its responses that guide the client to available\
    \ actions. This makes the API more discoverable and reduces coupling between client\
    \ and server.\n- **Layered System**: Intermediary servers (like proxies and load\
    \ balancers) can be placed between the client and the server without the client\
    \ or server knowing. This improves scalability and security.\n- **Code on Demand\
    \ (Optional)**: Servers can extend client functionality by transferring executable\
    \ code (like JavaScript). This is less common in modern RESTful APIs.\n\n## Why\
    \ are RESTful Principles Important?\n\nFollowing RESTful principles offers several\
    \ benefits:\n\n- **Scalability**: The stateless nature of RESTful APIs makes it\
    \ easier to scale the server infrastructure.\n- **Flexibility**: The separation\
    \ of client and server allows for independent development and evolution.\n- **Simplicity**:\
    \ The uniform interface makes APIs easier to understand and use.\n- **Cacheability**:\
    \ Caching improves performance and reduces server load.\n- **Interoperability**:\
    \ RESTful APIs can be accessed by clients written in different programming languages.\n"
  raw: '​● ​4xx (Client Error): The request contains bad syntax or cannot be fulfilled.1 (e.g.,
    400 Bad Request, 404 Not Found)


    ​● ​5xx (Server Error): The server failed to fulfill an apparently valid request.
    (e.g., 500 Internal Server Error, 503 Service Unavailable)2


    Knowing these status codes is crucial for understanding the nature of an error
    and taking appropriate action.


    Error Handling with Fetch


    Fetch uses Promises, so error handling is typically done with .catch()blocks.
    However, Fetch''s .catch()only handles network errors. It doesn''thandle HTTP
    error status codes (4xx and 5xx). To handle those, you need to check the response.ok property.


    Here''s an example:


    JavaScript


    fetch(''https://api.example.com/nonexistent-resource'')


    .then(response => {


    if (!response.ok) {


    // Check for HTTP error status codes (4xx or 5xx)


    throw new Error(`HTTP error! status: ${response.status}`);


    }


    return response.json();


    })


    .then(data => {


    console.log(''Data:'', data);


    })


    .catch(error => {


    console.error(''Fetch error:'', error); // Catches both network errors and HTTP
    errors


    });


    In this example, if the server responds with a 404 Not Found, the response.okproperty
    will be false, and an error will be thrown. This error is then caught by the .catch() block.


    Error Handling with Axios


    Axios provides more robust error handling. When a request receives an HTTP error
    status code (outside the 2xx range), Axios rejects the Promise with an error object
    that contains more information, including the status code, response data (if available),
    and request configuration.


    Here’s how you handle errors with Axios:


    JavaScript


    axios.get(''https://api.example.com/nonexistent-resource'')


    .then(response => {


    console.log(''Data:'', response.data);


    })


    .catch(error => {


    if (error.response) {


    // The request was made and the server responded with a status code


    // that falls out of the range of 2xx


    console.error(''Response Error:'', error.response.status);


    console.error(''Response Data:'', error.response.data);


    console.error(''Response Headers:'', error.response.headers);


    } else  if (error.request) {


    // The request was made but no response was received


    // `error.request` is an instance of XMLHttpRequest in the browser and an instance
    of


    // http.ClientRequest in node.js


    console.error(''Request Error:'', error.request);


    } else {


    // Something happened in setting up the request that triggered an Error


    console.error(''Error'', error.message);


    }


    console.error(''Config:'', error.config);


    });


    Axios provides the error.responseproperty which contains the server''s response
    details (status, data, headers). If the request never reaches the server (e.g.,
    network error), error.requestwill be available. Finally, error.message will contain
    a more general error message. This detailed error information makes debugging
    much easier.


    Handling Different Error Scenarios


    ​● ​Network Errors:These occur when the client cannot connect to the server (e.g.,
    no internet connection). With Fetch, these are caught by the .catch()block. With
    Axios, error.request will be present.


    ​● ​404 Not Found: This indicates that the requested resource does not exist on
    the server.


    ​● ​400 Bad Request: This usually means there''s a problem with the data sent
    in the request.


    ​● ​500 Internal Server Error: This indicates a problem on the server-side.


    ​● ​Rate Limiting Errors: Many APIs have rate limits. If you exceed the limit,
    the API will return a specific error (often a 429 Too Many Requests status code).
    You should implement logic to handle these errors, such as waiting before retrying
    the request.


    Edge Cases and Defensive Programming


    Beyond standard HTTP errors, you should also consider edge cases:


    ​● ​Unexpected Data Formats: Even if the request is successful, the API might
    return data in an unexpected format. You should validate the received data to
    avoid errors in your application.


    ​● ​Timeouts: Requests can sometimes take a long time to complete. Implementing
    timeouts can prevent your application from hanging indefinitely. Axios has built-in
    timeout functionality.


    ​● ​Retries: For transient errors (like temporary network issues), implementing
    automatic retries can improve reliability. Axios libraries can help with this.


    Best Practices for Error Handling


    ​● ​Provide User-Friendly Messages: Display informative error messages to the
    user without revealing sensitive information.


    ​● ​Log Errors: Log errors on the server-side for debugging and monitoring.


    ​● ​Handle Errors Gracefully: Prevent errors from crashing your application.


    ​● ​Test Error Handling: Thoroughly test your error handling logic to ensure it
    works as expected.


    By implementing robust error handling and considering edge cases, you can create
    more reliable and user-friendly applications that interact seamlessly with APIs,
    even when things don''t go exactly as planned. This section has given you the
    tools to create applications that respond correctly to a variety of API problems.


    ### Did You Know? The RESTful API design principles and their importance


    When discussing APIs, the term "RESTful" often comes up. REST, which stands for
    Representational State Transfer, is an architectural style for designing networked
    applications. While not all APIs strictly adhere to every REST principle, understanding
    them is crucial for working with modern web services.


    REST is not a protocol like HTTP; it''s a set of guidelines. APIs that follow
    these guidelines are considered RESTful. Here are the key principles:


    ​● ​Client-Server: This principle separates the user interface (client) from the
    data storage and logic (server). This separation improves portability, scalability,
    and allows for independent evolution of the client and server.


    ​● ​Stateless: Each request from a client to the server must contain all the information
    needed to understand and process the request. The1 server does not store any client
    context between requests.2 This simplifies server design and improves scalability.


    ​● ​Cacheable:Responses from the server should be cacheable by clients or intermediaries
    (like proxies). This reduces server load and improves performance. HTTP provides
    mechanisms for caching, such as Cache-Control headers.


    ​● ​Uniform Interface: This is the most important principle and encompasses several
    sub-constraints:


    ​○ ​Resource Identification: Each resource (data entity) is identified by a unique
    URL.


    ​○ ​Representation: Resources are represented in various formats (e.g., JSON,
    XML). Clients and servers exchange representations of resources, not the resources
    themselves.


    ​○ ​Self-Descriptive Messages:Messages include enough information to understand
    how to process them. This includes media types (e.g., application/json) and hypermedia
    links.


    ​○ ​Hypermedia as the Engine of Application State (HATEOAS): This principle states
    that the API should provide links within its responses that guide the client to
    available actions. This makes the API more discoverable and reduces coupling between
    client and server.


    ​● ​Layered System: Intermediary servers (like proxies and load balancers) can
    be placed between the client and the server without the client or server knowing.
    This improves scalability and security.


    ​● ​Code on Demand (Optional): Servers can extend client functionality by transferring
    executable code (like JavaScript). This is less common in modern RESTful APIs.


    Why are RESTful Principles Important?


    Following RESTful principles offers several benefits:


    ​● ​Scalability: The stateless nature of RESTful APIs makes it easier to scale
    the server infrastructure.


    ​● ​Flexibility: The separation of client and server allows for independent development
    and evolution.


    ​● ​Simplicity: The uniform interface makes APIs easier to understand and use.


    ​● ​Cacheability: Caching improves performance and reduces server load.


    ​● ​Interoperability: RESTful APIs can be accessed by clients written in different
    programming languages.'
