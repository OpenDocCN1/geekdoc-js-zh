    <p>Second paragraph.</p>


    <script>


    let paragraphs = document.getElementsByTagName("p");


    </script>


    ​● ​document.querySelector(selector): Returns the first element that matches the
    specified CSS selector. This is a versatile method that can be used to select
    elements based on any CSS selector, including IDs, classes, tag names, attributes,
    and more.


    HTML


    <div  id="container">


    <p class="text">A paragraph inside the container.</p>


    </div>


    <script>


    letparagraph = document.querySelector("#container .text");


    </script>


    ​● ​document.querySelectorAll(selector): Returns a collection of all elements
    that match the specified CSS selector.


    HTML


    <ul>


    <li>Item 1</li>


    <li>Item 2</li>


    </ul>


    <script>


    let listItems = document.querySelectorAll("li");


    </script>


    Understanding the DOM tree and the methods for navigating and selecting elements
    within it is fundamental to dynamic web development. It allows JavaScript to interact
    with and manipulate web page content, enabling the creation of interactive and
    engaging user experiences. These techniques are the foundation for more advanced
    DOM manipulation and event handling, which will be discussed in subsequent sections.


    ### DOM Manipulation: Selecting, Creating, and Modifying Elements


    Having explored the structure of the DOM and methods for selecting elements, we
    now turn to the core of dynamic web development: manipulating the DOM. This involves
    creating new elements, modifying existing ones, and even removing elements from
    the document. These capabilities allow developers to build interactive user interfaces
    that respond to user actions and update content without requiring full page reloads.


    Modifying Element Content


    One of the most common DOM manipulation tasks is changing the content of an element.
    JavaScript provides several ways to achieve this:


    ​● ​textContent:This property sets or gets the text content of a node and its
    descendants. It is generally the preferred method for setting text content as
    it handles text encoding correctly and is more performant than innerHTML.


    HTML


    <div  id="myDiv">Initial text.</div>


    <script>


    let myDiv = document.getElementById("myDiv");


    myDiv.textContent = "New text content.";


    </script>


    ​● ​innerHTML:This property sets or gets the HTML content of an element. It can
    be used to insert HTML markup, but it is important to be cautious when using innerHTML with
    user-supplied data, as it can create security vulnerabilities (Cross-Site Scripting
    or XSS attacks) if not handled properly.


    HTML


    <div  id="myDiv"></div>


    <script>


    let myDiv = document.getElementById("myDiv");


    myDiv.innerHTML = "<p>A new paragraph.</p>";


    </script>


    Modifying Element Attributes


    Attributes provide additional information about HTML elements. JavaScript allows
    you to modify these attributes dynamically:


    ​● ​setAttribute(name, value): Sets the value of an attribute on a specified element.


    HTML


    <img  id="myImage"  src="old-image.jpg"  alt="Old Image">


    <script>


    let myImage = document.getElementById("myImage");


    myImage.setAttribute("src", "new-image.jpg");


    myImage.setAttribute("alt", "New Image");


    </script>


    ​● ​getAttribute(name): Returns the value of a specified attribute on an element.


    HTML


    <a  id="myLink"  href="https://example.com">Example Link</a>


    <script>


    let myLink = document.getElementById("myLink");


    let href = myLink.getAttribute("href");


    console.log(href); // Output: https://example.com


    </script>


    ​● ​Direct property access: Many attributes are also accessible as direct properties
    of the element object. This is often the most convenient way to access and modify
    common attributes.


    HTML


    <input  type="text"  id="myInput"  value="Initial Value">


    <script>


    let myInput = document.getElementById("myInput");


    myInput.value = "New Value"; // Modifying the value attribute


    myInput.id = "theInput"; // Modifying the id attribute


    </script>


    Modifying Element Styles


    JavaScript can also be used to dynamically change the styles of elements:


    ​● ​style property:The style property allows you to access and modify the inline
    styles of an element.


    HTML


    <div  id="myDiv"  style="background-color: lightblue;">A div.</div>


    <script>


    let myDiv = document.getElementById("myDiv");


    myDiv.style.backgroundColor = "lightgreen";


    myDiv.style.color = "white";


    myDiv.style.padding = "10px";


    </script>


    ​● ​classList property:The classListproperty provides methods for adding, removing,
    and toggling CSS classes on an element. This is generally preferred over directly
    manipulating the style property, as it promotes better separation of concerns
    (separating styling from JavaScript logic).


    HTML


    <div  id="myDiv"  class="initial-class">A div.</div>


    <style>


    .highlight { background-color: yellow; }


    .hidden { display: none;}


    </style>


    <script>


    let myDiv = document.getElementById("myDiv");


    myDiv.classList.add("highlight"); // Adds the ''highlight'' class


    myDiv.classList.remove("initial-class"); // Removes the ''initial-class''


    myDiv.classList.toggle("hidden"); // Toggles the ''hidden'' class


    </script>


    Creating and Inserting Elements


    JavaScript enables the dynamic creation and insertion of new elements into the
    DOM:


    ​● ​document.createElement(tagName): Creates a new element node with the specified
    tag name.


    JavaScript


    let newParagraph = document.createElement("p");


    ​● ​document.createTextNode(text): Creates a new text node with the specified
    text content.


    JavaScript


    lettextNode = document.createTextNode("This is a new paragraph.");


    ​● ​appendChild(node): Adds a node as the last child of a specified parent node.


    JavaScript


    let myDiv = document.getElementById("myDiv");


    newParagraph.appendChild(textNode); // Add text to paragraph


    myDiv.appendChild(newParagraph); // Add paragraph to div


    ​● ​insertBefore(newNode, referenceNode): Inserts a node before a specified reference
    node.


    JavaScript


    let anotherParagraph = document.createElement("p");'
