  trans: "\n\n## 1. 创建 `formatPhoneNumber` 函数\n\n创建一个名为 `formatPhoneNumber.js`（或类似名称）的文件并添加以下代码：\n\
    \n```javascript\nfunction formatPhoneNumber(phoneNumber) {\n  if (typeof phoneNumber\
    \ !== 'string') {\n    return 'Invalid input';\n  }\n  const cleanedNumber = phoneNumber.replace(/\\\
    D/g, ''); // 非数字字符\n  if (cleanedNumber.length !== 10) {\n    return 'Invalid\
    \ phone number';\n  }\n  return `(${cleanedNumber.slice(0, 3)}) ${cleanedNumber.slice(3,\
    \ 6)}-${cleanedNumber.slice(6)}`;\n}\n\nmodule.exports = formatPhoneNumber;\n\
    ```\n\n该函数接收一个字符串类型的电话号码并将其格式化为 `(XXX) XXX-XXXX`。它还可以处理无效输入和无效的电话号码长度。\n\n## 2.\
    \ 创建测试文件\n\n在 `formatPhoneNumber.js` 同目录下创建一个名为 `formatPhoneNumber.test.js`（或类似名称）的文件。添加以下代码：\n\
    \n```javascript\nconst formatPhoneNumber = require('./formatPhoneNumber');\n\n\
    describe('formatPhoneNumber', () => {\n  it('should format a valid 10-digit phone\
    \ number', () => {\n    expect(formatPhoneNumber('1234567890')).toBe('(123) 456-7890');\n\
    \    expect(formatPhoneNumber('123-456-7890')).toBe('(123) 456-7890');\n    expect(formatPhoneNumber('(123)\
    \ 456-7890')).toBe('(123) 456-7890');\n  });\n\n  it('should return \"Invalid\
    \ input\" for non-string input', () => {\n    expect(formatPhoneNumber(1234567890)).toBe('Invalid\
    \ input');\n    expect(formatPhoneNumber(null)).toBe('Invalid input');\n    expect(formatPhoneNumber(undefined)).toBe('Invalid\
    \ input');\n    expect(formatPhoneNumber({})).toBe('Invalid input');\n    expect(formatPhoneNumber([])).toBe('Invalid\
    \ input');\n  });\n\n  it('should return \"Invalid phone number\" for phone numbers\
    \ with incorrect length', () => {\n    expect(formatPhoneNumber('123456789')).toBe('Invalid\
    \ phone number');\n    expect(formatPhoneNumber('12345678901')).toBe('Invalid\
    \ phone number');\n    expect(formatPhoneNumber('123')).toBe('Invalid phone number');\n\
    \  });\n\n  it('should handle various input formats correctly', () => {\n    expect(formatPhoneNumber('123.456.7890')).toBe('(123)\
    \ 456-7890');\n    expect(formatPhoneNumber('123 456 7890')).toBe('(123) 456-7890');\n\
    \  });\n});\n```\n\n## 3. 运行\n\n在项目目录中打开终端并运行：\n\n```bash\nnpm test\n# 或\nyarn\
    \ test\n```\n\n`Jest` 将运行测试并显示结果。你应该看到所有测试都通过了。\n\n### 解析与核心概念：\n\n- **`describe`\
    \ 块**：我们使用 `describe` 块来对 `formatPhoneNumber` 函数的测试分组。这有助于组织测试并使输出更具可读性。\n- **`it`\
    \ 测试函数**：每个 `it` 块定义了一个测试用例。第一个参数是测试的描述，第二个参数是包含测试逻辑的函数。\n- **`expect` 函数**：`expect`\
    \ 函数用于进行断言。它接收一个值作为参数并返回一个匹配器对象。\n- **匹配器 (Matchers)**：我们使用 `toBe` 匹配器来检查严格相等。\n\
    - **测试不同的场景**：我们为有效电话号码、无效输入类型和长度错误的电话号码编写了测试。这确保了函数能够正确处理不同场景。\n\n### 进一步练习：\n\
    \n- 添加更多测试用例以覆盖其他边界情况，例如带有前导空格的电话号码。\n- 重构 `formatPhoneNumber` 函数以处理国际电话号码，并为它们编写测试。\n\
    - 尝试使用其他的 `Jest` 匹配器，例如用于正则表达式匹配的 `toMatch`。\n\n通过完成此练习，你获得了使用 `Jest` 编写单元测试的实践经验，并学会了测试不同的场景和边界情况。这巩固了你对单元测试的理解，并为\
    \ JavaScript 代码编写更全面的测试提供了基础。\n\n## 第 10 章：性能优化技术\n\n### 代码分割与懒加载 (Code Splitting\
    \ and Lazy Loading)\n\n在当今的 Web 环境中，用户期望网站快速响应。加载缓慢或运行缓慢的网站会导致挫败感和糟糕的用户体验，最终导致访问者离开。因此，性能优化是\
    \ Web 开发的一个关键方面。本章讨论了提高 JavaScript 应用性能的各种技术，从代码分割和懒加载开始。\n\n### 代码分割：拆解单体结构\n\
    \n想象一个大型应用程序，所有的 JavaScript 代码都打包成一个巨大的文件。当用户访问网站时，他们的浏览器必须在任何内容变得可交互之前下载整个文件。这可能导致显著的初始加载时间，特别是在连接较慢或设备性能的情况下。代码分割通过将你的代码拆分为更小、更易管理的块来解决这个问题。\n\
    \n与其使用一个大文件，你创建了多个可以按需加载的小文件。这意味着浏览器只下载初始视图所需的代码，显著缩短初始加载时间。当用户与应用程序交互并导航到不同部分时，浏览器随后可以异步下载代码块。\n\
    \n可以这样想：与其给一个只想查单个单词的人提供一整部百科全书，不如给他们一本字典。如果他们需要更多信息，可以再请求百科全书的特定卷。\n\n### 代码分割如何工作\n\
    \n代码分割可以在多个层级实现：\n\n- **组件级（在 React 中）**：你可以根据组件或路由拆分代码。这意味着每个路由或组件都有自己相关的代码块。\n\
    - **模块级**：你可以根据模块或功能拆分代码。例如，你可能为图像处理、数据可视化或用户身份验证拥有单独的代码块。\n\n可以使用多种工具和技术来实现代码分割：\n\
    \n- **动态 `import()`**：这是在现代 JavaScript 中实现代码分割最常见且推荐的方法。动态 `import()` 语法允许你在运行时异步加载模块。\n\
    \n以下是在 React 中使用动态 `import()` 懒加载组件的示例：\n\n```javascript\nimport React, { Suspense,\
    \ lazy } from 'react';\n\nconst OtherComponent = lazy(() => import('./OtherComponent'));\n\
    \nfunction MyComponent() {\n  return (\n    <div>\n      <Suspense fallback={<<div>>Loading...</</div>>}>\n\
    \        <OtherComponent />\n      </Suspense>\n    </div>\n  );\n}\n```\n\n让我们来解一下这个示例：\n\
    \n1. `lazy(() => import('./OtherComponent'))`：此行使用了 `React` 中的 `lazy` 函数来创建 `OtherComponent`\
    \ 的懒加载版本。`import()` 函数被动态调用，这意味着 `OtherComponent` 代码只有在需要时才会下载。\n2. `<Suspense\
    \ fallback={<<div>>Loading...</</div>>}>`：`Suspense` 组件用于处理 `OtherComponent` 下载期间的加载状态。`fallback`\
    \ 属性指定了组件加载期间显示的内容（在本例中为简单的“Loading...”）。\n\n当 `MyComponent` 渲染时，浏览器不会立即下载 `OtherComponent`\
    \ 的代码。相反，它会显示“Loading...”，直到代码下载完成。\n\n- **Webpack `import()` 语句（用于非 React 项目或高级配置）**：如果你没有使用\
    \ React 或需要对代码分割进行更精细的控制，可以直接使用 Webpack 的动态 `import()` 语法。Webpack 将处理独立代码块的创建。\n\
    \n### 懒加载：按需加载\n\n懒加载与代码分割密切相关。它指的是延迟加载资源（如图像、脚本或组件），直到它们真正被需要。这可以显著提高初始页面加载时间并减少带宽消耗。\n\
    \n有多种懒加载技术：\n\n- **图像懒加载**：你可以通过在 `<img>` 元素上使用 `loading=\"lazy\"` 属性来懒加载图像。这告诉浏览器只在图像接近视口时才加载它。\n\
    \n"
- fmt: "\n<img src=\"my-image.jpg\" loading=\"lazy\" alt=\"My image\" />\n\n- **Lazy\
    \ Loading Components** (as shown in the code splitting example above): Using `React`'s\
    \ `lazy` and `Suspense` is a powerful way to lazy load components.\n- **Intersection\
    \ Observer API**: This `API` allows you to observe when an element enters or exits\
    \ the viewport. You can use it to trigger the loading of resources when they become\
    \ visible. This is a more advanced technique that gives you fine-grained control\
    \ over the loading process.\n\n## Benefits of Code Splitting and Lazy Loading\n\
    \n- **Improved Initial Load Time**: By only loading the necessary code and resources\
    \ upfront, you can significantly reduce the initial page load time.\n- **Reduced\
    \ Bandwidth Consumption**: By deferring the loading of unnecessary resources,\
    \ you can reduce the amount of data that needs to be downloaded, especially for\
    \ users on slower connections or mobile devices.\n- **Improved User Experience**:\
    \ A faster loading website provides a better user experience, leading to higher\
    \ engagement and conversion rates.\n\n## Practical Considerations\n\n- **Finding\
    \ the Right Splitting Points**: Choosing the right places to split your code is\
    \ important. You should aim to split your code based on logical boundaries, such\
    \ as routes, components, or functionalities.\n- **Handling Loading States**: It’s\
    \ important to provide feedback to the user while resources are being loaded.\
    \ Using loading indicators or placeholders can improve the user experience.\n\
    - **Testing Lazy Loaded Components**: You need to make sure your tests account\
    \ for the asynchronous nature of lazy loading. `React Testing Library` provides\
    \ utilities to help with this.\n\nCode splitting and lazy loading are essential\
    \ techniques for optimizing the performance of modern web applications. By implementing\
    \ these techniques, you can create faster, more responsive, and user-friendly\
    \ websites.\n\n## Image Optimization and Asset Management\n\nImages are a crucial\
    \ part of most websites, adding visual appeal and enhancing the user experience.\
    \ However, unoptimized images can significantly impact website performance, leading\
    \ to slow loading times and a poor user experience. Effective asset management,\
    \ particularly for images, is therefore essential for creating fast and efficient\
    \ websites.\n\n### Why Image Optimization Matters\n\nLarge image files can take\
    \ a long time to download, especially on slower connections. This can cause the\
    \ page to load slowly, leading to user frustration and potentially driving visitors\
    \ away. Optimized images, on the other hand, load quickly, improving the user\
    \ experience and potentially boosting SEO rankings.\n\n### Techniques for Image\
    \ Optimization\n\nSeveral techniques can be used to optimize images for the web:\n\
    \n- **Choosing the Right Image Format**: Different image formats are suited for\
    \ different types of images:\n    - **JPEG**: Best for photographs and images\
    \ with many colors. `JPEG` uses lossy compression, which means some image data\
    \ is discarded to reduce file size.\n    - **PNG**: Best for images with sharp\
    \ lines, text, and graphics. `PNG` uses lossless compression, which means no image\
    \ data is lost.\n    - **WebP**: A modern image format developed by `Google` that\
    \ offers superior compression compared to `JPEG` and `PNG`. It supports both lossy\
    \ and lossless compression.\n    - **AVIF**: A newer image format that offers\
    \ even better compression than `WebP`. It's becoming increasingly supported by\
    \ modern browsers.\n\nChoosing the right format can significantly reduce file\
    \ size without sacrificing too much image quality. For most photographs, `WebP`\
    \ or `AVIF` are excellent choices. For graphics and images with text, `PNG` is\
    \ usually the best option.\n\n- **Resizing Images**: Avoid using large images\
    \ and scaling them down in the browser. Instead, resize images to their actual\
    \ display dimensions before uploading them to your website. This prevents the\
    \ browser from having to download unnecessary data.\n\n- **Compression**: Use\
    \ image compression tools to further reduce file size. Several online and offline\
    \ tools are available for this purpose. For `WebP` and `AVIF`, compression is\
    \ already built into the format itself, but for `JPEG` and `PNG`, you can use\
    \ tools like `TinyPNG` or `ImageOptim`.\n\n- **Using Responsive Images**: Use\
    \ the `<picture>` element or the `srcset` attribute on `<img>` elements to provide\
    \ different image sizes for different screen sizes and resolutions. This ensures\
    \ that users on smaller devices don't have to download large images intended for\
    \ desktop displays.\n\nHere's an example using the `srcset` attribute:\n\n```html\n\
    <img\n  src=\"image-small.jpg\"\n  srcset=\"image-small.jpg 300w, image-medium.jpg\
    \ 600w, image-large.jpg 1200w\"\n  sizes=\"(max-width: 600px) 300px, (max-width:\
    \ 1200px) 600px, 1200px\"\n  alt=\"My image\"\n/>\n```\n\nThe `srcset` attribute\
    \ specifies different image sources and their widths. The `sizes` attribute specifies\
    \ the image size for different media queries. The browser will then choose the\
    \ most appropriate image based on the user's device.\n\n- **Lazy Loading Images**\
    \ (as discussed in the previous section): Lazy loading images can significantly\
    \ improve initial page load time by deferring the loading of off-screen images.\n\
    \n## Asset Management Strategies\n\nEffective asset management involves organizing\
    \ and optimizing all your website’s assets, including images, CSS, and JavaScript\
    \ files.\n\n- **Content Delivery Networks (CDNs)**: Use a `CDN` to host your assets.\
    \ `CDNs` are distributed networks of servers that deliver content to users from\
    \ the server closest to them, reducing latency and improving loading times.\n\
    - **Caching**: Leverage browser caching and server-side caching to reduce the\
    \ number of requests to your server. Proper cache headers should be set to instruct\
    \ the browser how long to store assets.\n- **Minification and Concatenation**:\
    \ Minify `CSS` and `JavaScript` files to remove unnecessary whitespace and characters,\
    \ reducing file size. Concatenate multiple `CSS` or `JavaScript` files into a\
    \ single file to reduce the number of requests requests. Modern build tools like\
    \ `Webpack` and `Parcel` handle this automatically.\n- **Image Sprites**: Combine\
    \ multiple small images into a single image sprite and use `CSS` background positioning\
    \ to display individual images. This reduces the number of HTTP requests. This\
    \ technique is less common now with HTTP/2 but can still be useful in some cases.\n\
    \n### Practical Considerations\n\n- **Automation**: Automate image optimization\
    \ as much as possible using build tools or online services. This ensures that\
    \ all images are optimized consistently.\n- **Performance Monitoring**: Use performance\
    \ monitoring tools to track the impact of your optimization efforts. This helps\
    \ you identify areas for further improvement.\n- **Balancing Quality and Performance**:\
    \ It's important to find a balance between image quality and file size. You don't\
    \ want to sacrifice too much quality to achieve a small file size.\n\nBy implementing\
    \ these image optimization and asset management techniques, you can significantly\
    \ improve the performance of your website, leading to a better user experience\
    \ and potentially improved SEO.\n\n### Profiling and Identifying Performance Bottlenecks\n\
    \nEven with careful optimization, performance bottlenecks can still creep into\
    \ your application. Profiling is the process of analyzing your code to identify\
    \ these bottlenecks and understand where your application is spending its time.\
    \ This section covers techniques and tools for profiling JavaScript code and identifying\
    \ performance issues.\n\n#### Why Profiling is Important\n\nProfiling helps you\
    \ move beyond guesswork and provides concrete data about your application's performance.\
    \ Instead of making assumptions about what might be slow, you can use profiling\
    \ tools to pinpoint the exact parts of your code that are causing performance\
    \ problems. This allows you to focus your optimization efforts where they will\
    \ have the greatest impact.\n\n#### Tools for Profiling\n\nSeveral tools can be\
    \ used for profiling JavaScript code:\n"
