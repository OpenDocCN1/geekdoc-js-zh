    \ incrementByAmount } = counterSlice.actions;\nexport default counterSlice.reducer;\n\
    ```\n\n这段代码定义了一个名为 `counter` 的 slice，其初始状态为 `1` `{ value: 0 }`。它还定义了三个 reducer：`increment`、`decrement`\
    \ 和 `incrementByAmount`。Redux Toolkit 在底层使用了 `Immer`，允许你直接在 reducers 中编写“变异”逻辑，从而简化了代码。\n\
    \n请记住如上一节所示，将 reducer 导入到 `store.js` 中。\n\n## 使用 useSelector 和 useDispatch 连接组件\n\
    \n将 React 组件连接到 Redux store 的常用方法是使用 `react-redux` 提供的 `useSelector` 和 `useDispatch`\
    \ 钩。\n\n- `useSelector(selector)`：该钩子允许你从 Redux store 状态中提取数据。`selector` 参数是一个函数，它接收整个\
    \ Redux 状态作为参数，并返回你所需的特定部分。\n- `useDispatch()`：该钩子返回 Redux store 中 `dispatch`\
    \ 函数的引用，你可以用它来派发动作。\n\n现在，让我们创建一个使用 `counterSlice` 的 `Counter` 组件：\n\n在 `counter`\
    \ 文件夹中创建一个名为 `Counter.js` 的新文件并添加以下代码：\n\n```javascript\nimport React from 'react';\n\
    import { useSelector, useDispatch } from 'react-redux';\nimport { increment, decrement,\
    \ incrementByAmount } from './counterSlice';\nimport { useState } from 'react';\n\
    \nexport function Counter() {\n  const count = useSelector((state) => state.counter.value);\n\
    \  const dispatch = useDispatch();\n  const [incrementAmount, setIncrementAmount]\
    \ = useState('2');\n  const addValue = Number(incrementAmount) || 0;\n\n  return\
    \ (\n    <div>\n      <div>\n        <button\n          aria-label=\"Increment\
    \ value\"\n          onClick={() => dispatch(increment())}\n        >\n      \
    \    Increment\n        </button>\n        <span>{count}</span>\n        <button\n\
    \          aria-label=\"Decrement value\"\n          onClick={() => dispatch(decrement())}\n\
    \        >\n          Decrement\n        </button>\n      </div>\n      <div>\n\
    \        <input\n          type=\"number\"\n          value={incrementAmount}\n\
    \          onChange={e => setIncrementAmount(e.target.value)}\n        />\n  \
    \      <button onClick={() => dispatch(incrementByAmount(addValue))}>\n      \
    \    Add Amount\n        </button>\n      </div>\n    </div>\n  );\n}\n```\n\n\
    以下是该代码的解释：\n\n1. 我们从 `react-redux` 导入了 `useSelector` 和 `useDispatch`。\n2. 我们使用\
    \ `useSelector` 从 Redux 状态的 `counterSlice` 中提取值：`useSelector((state) => state.counter.value)`。\n\
    3. 我们使用 `useDispatch` 获取 `dispatch` 函数。\n4. 当点击相应的按钮时，我们派发 `increment`、`decrement`\
    \ 和 `incrementByAmount` 动作。\n\n## 使用 Counter 组件\n\n现在你可以在 `App.js` 文件中使用 `Counter`\
    \ 组件了：\n\n```javascript\nimport React from 'react';\nimport './App.css';\nimport\
    \ { Counter } from './features/counter/Counter';\n\nfunction App() {\n  return\
