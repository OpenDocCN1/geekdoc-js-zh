    let i = 0;


    do {


    console.log("Value of i: " + i);


    i++;


    } while(i < 2);


    ​● ​for...in loop:The for...in loop iterates over the enumerable properties of
    an object.


    JavaScript


    constperson = { name: "Alice", age: 30, city: "London" };


    for (let key in person) {


    console.log(key + ": " + person[key]);


    }


    ​● ​for...of loop (ES6):The for...of loop iterates over iterable objects, such
    as arrays, strings, maps, sets, etc.


    JavaScript


    const numbers = [1, 2, 3, 4, 5];


    for (let number of numbers) {


    console.log(number);


    }


    Choosing the right loop depends on the specific situation. Use forloops when the
    number of iterations is known. Use whileloops when the loop should continue as
    long as a condition is true. Use do…whileloops when the code block needs to be
    executed at least once. Use for…into iterate over object properties, and for…of to
    iterate over iterable objects. Proper use of control flow statements is crucial
    for creating dynamic and functional JavaScript programs. They allow you to create
    complex logic and handle various scenarios effectively.


    ### Did You Know? The history of JavaScript and its initial name


    The story of JavaScript is intertwined with the early days of the World Wide Web
    and the need for dynamic, interactive web pages. In the mid-1990s, the web was
    largely static, with HTML primarily used for structuring content. Netscape Communications
    Corporation, the creator of the popular Netscape Navigator web browser, sought
    to add interactivity to web pages, making them more engaging for users.


    In May 1995, Brendan Eich, a programmer at Netscape, was tasked with developing
    a scripting language for Netscape Navigator. The goal was to create a language
    that could be used by web developers to add dynamic behavior to web pages, such
    as form validation, animations, and other interactive elements.


    Eich''s work resulted in a language initially code-named "Mocha." This early version
    of the language was developed in just ten days, a testament to Eich''s skill and
    the urgency of the project. Mocha was then briefly renamed "LiveScript" in the
    beta release of Netscape Navigator 2.0 in September 1995.


    However, just a few months later, in December 1995, Netscape made a strategic
    decision to rename the language to "JavaScript." This name change was driven by
    a marketing partnership with Sun Microsystems, the creators of the Java programming
    language. Java was gaining significant popularity at the time, and Netscape hoped
    to capitalize on this trend by associating their scripting language with Java.


    Despite the similar name, JavaScript and Java are fundamentally different languages.
    Java is a compiled, statically typed language, while JavaScript is an interpreted,
    dynamically typed language. The syntax of JavaScript does borrow some elements
    from Java, but the underlying concepts and paradigms are distinct.


    The name "JavaScript" has been a source of confusion for many years, leading some
    to believe that it is a simplified version of Java. However, it is important to
    remember that JavaScript is its own language with its own unique characteristics
    and capabilities.


    The rapid development and adoption of JavaScript in the mid-1990s played a crucial
    role in the evolution of the web. It transformed web pages from static documents
    into interactive and dynamic experiences, paving the way for the rich and complex
    web applications we use today.


    ## Chapter 2: Working with the DOM and Events


    ### The Document Object Model (DOM) Tree


    The Document Object Model (DOM) is a crucial interface for web developers. It
    represents the structure of an HTML or XML document as a tree-like structure,
    where each element, attribute, and piece of text within the document is represented
    as a node in the tree. This representation allows JavaScript to interact with
    and manipulate the content, structure, and style of web pages dynamically. Understanding
    the DOM is essential for creating interactive and dynamic web experiences.


    The DOM Tree Structure


    When a web browser loads an HTML page, it parses the HTML code and creates a corresponding
    DOM tree in memory. This tree represents the hierarchical relationship between
    the different elements in the document. The top of the tree is the documentobject,
    which represents the entire HTML document. Below the documentobject is the root
    element, usually the <html>element. From there, the tree branches out to represent
    other elements, such as <head>, <body>, and all the elements nested within them.


    Each element in the HTML document is represented as an element node in the DOM
    tree. Attributes of elements are represented as attribute nodes, and text content
    within elements is represented as text nodes. Consider the following simple HTML
    snippet:


    HTML


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Web Page</title>


    </head>


    <body>


    <h1>Welcome</h1>


    <p>This is a paragraph.</p>


    </body>


    </html>


    The DOM tree for this HTML would look conceptually like this:


    ​● ​document


    ​○ ​<html>


    ​■ ​<head>


    ​■ ​<title>


    ​■ ​Text Node: "My Web Page"


    ​■ ​<body>


    ​■ ​<h1>


    ​■ ​Text Node: "Welcome"


    ​■ ​<p>


    ​■ ​Text Node: "This is a paragraph."


    This tree structure illustrates the parent-child relationships between nodes.
    For example, the <body>element is a child of the <html>element, and the <h1>and
    <p>elements are children of the <body>element. The text content within the <h1>and
    <p> tags are text nodes that are children of their respective parent elements.


