  trans: "\n\n事件委托是一种强大的技术，它允许你在父元素上绑定一个单一事件监听器，并让它处理所有后代元素的事件，即使这些元素是之后动态添加到 DOM\
    \ 中的。这对于处理在页面初始加载后才添加到页面上的元素事件特别有用。\n\n以下是事件委托如何配合 `.on()` 使用的：\n\n```javascript\n\
    $(parentSelector).on(event, childSelector, handler);\n```\n\n- `parentSelector`:\
    \ 父元素的选择器。\n- `event`: 事件名称。\n- `childSelector`: 应该触发处理函数的子元素选择器。\n- `handler`:\
    \ 要执行的函数。\n\n### 示例：\n\n```javascript\n// 为列表内部的所有列表项绑定点击处理程序，即使是动态添加的项\n$('#my-list').on('click',\
    \ 'li', function() {\n  alert('List item clicked!');\n});\n\n// 动态添加一个新列表项\n$('#my-list').append('<li>New\
    \ list item</li>');\n\n// 点击处理程序也适用于新添加的列表项\n```\n\n在这个示例中，点击处理程序被绑定到 `#my-list`\
    \ 元素上。当 `#my-list` 内部的任何 `li` 元素发生点击事件时，处理函数将执行。即使对于在绑定处理程序后添加的 `li` 元素，这同样有效。\n\
    \n### 命名空间与移除事件处理程序\n\njQuery 允许对事件进行命名空间，这有助于组织代码并在不影响其他处理器的情况下移除特定的事件处理程序。\n\
    \n要为事件命名，只需在事件名称后添加一个点（`.`）并加上命名空间：\n\n```javascript\n$('#my-button').on('click.myNamespace',\
    \ function() {\n  alert('Button clicked (with namespace)!');\n});\n```\n\n要移除特定的事件处理程序，可以使用带有命名空间的\
    \ `.off()` 方法：\n\n```javascript\n$('#my-button').off('click.myNamespace'); //\
    \ 仅移除命名空间的点击处理程序\n$('#my-element').off('click'); // 移除 my-element 的所有点击处理程序\n\
    ```\n\n这使得选择性地移除事件处理程序成为可能，防止意外的副作用。\n\n### 实际应用与考虑\n\njQuery 的事件处理提供了一种简单且跨浏览器兼容的方法来管理用户交互。虽然现代\
    \ JavaScript 的 `addEventListener` 提供了相当的功能，但 jQuery 简洁的语法和事件委托能力在某些情况下仍然具有优势，特别是在已经依赖\
    \ jQuery 的项目中。\n\n在决定是否使用 jQuery 进行事件处理时，请考虑以下几点：\n\n- **项目背景**：如果你正在开发一个已经使用\
    \ jQuery 的项目，那么使用它来处理事件可以保持代码一致性。\n- **事件委托需求**：如果你需要处理动态添加的元素的事件，jQuery 的事件委托语法\
    \ 特为方便。\n- **代码可读性**：在某些情况下，jQuery 的事件处理语法比等效的原生 JavaScript 更简洁、更易读。\n\n本节提供了使用\
    \ jQuery 进行事件处理的全面概述。通过理解如何使用 `.on()`、事件委托和命名空间，你可以有效地管理 Web 中的用户交互，在 jQuery 最具用处的地方利用其优势。\n\
    \n### jQuery 的实际用例（动画、特定场景下的 AJAX）\n\n虽然现代 JavaScript 为许多任务提供了健壮的替代方案，但 jQuery\
    \ 在特定用例中仍然保留了某些优势，特别是在处理动画和某些 AJAX 场景时，尤其是在遗留项目或快速原型开发成为优先事项的情况下。本节重点介绍了这些领域。\n\
    \n#### 使用 jQuery 动画\n\njQuery 的动画方法提供了一种简单简洁的方式来创建平滑的视觉效果。虽然 CSS 过渡和动画提供了卓越的性能，但\
    \ jQuery 的动画方法对于更复杂或动态生成的动画仍然有用，特别是在需要考虑与旧版浏览器向后兼容性时。\n\n以下是 jQuery 的一些关键动画方法：\n\
    \n- `.show()`：带有平滑的淡入效果显示隐藏元素。\n- `.hide()`：带有平滑的淡出效果隐藏可见元素。\n- `.fadeIn()`：淡入一个元素。\n\
    - `.fadeOut()`：淡出一个元素。\n- `.slideDown()`：让元素向下滑动。\n- `.slideUp()`：让元素向上滑动。\n-\
    \ `.animate()`：通过随时间推移操作 CSS 属性来创建自定义动画。\n\n以下是几个示例：\n\n```javascript\n// 在 500\
    \ 毫秒内淡入元素\n$('#my-element').fadeIn(500);\n\n// 在 1 秒内向下滑动元素\n$('#my-element').slideDown(1000);\n\
    \n// 创建自定义动画\n$('#my-element').animate({\n  opacity: 0.5,\n  width: '50%',\n \
    \ height: '100px'\n}, 1000, function() {\n  // 动画完成后执行此函数\n  console.log(\"Animation\
    \ complete\");\n});\n```\n\n`.animate()` 方法特别强大，允许你对任何接受数值的 CSS 属性进行动画处理你还可以指定持续时间、缓动函数（例如\
    \ `swing`、`linear`）以及在动画完成后执行的回调函数。\n\n#### 使用 jQuery 进行 AJAX（特定场景）\n\n虽然在大多数现代\
    \ JavaScript 应用中，`fetch` 和 `Axios` 现在是是发送 AJAX 请求的首选方法，但 jQuery 的 AJAX 功能在特定情况下仍然很有用：\n\
    \n- **遗留项目**：如果你正在处理一个重度依赖 jQuery 的项目，使用 jQuery 的 AJAX 方法可以保持一致性并避免引入额外的依赖。\n\
    - **基础请求的简化语法**：对于基础 AJAX 请求，jQuery 的 `.ajax()`、`.get()` 和 `.post()` 方法提供了简洁的语法。\n\
    \n以下是使用 jQuery 的 `.get()` 进行 GET 请求的示例：\n\n```javascript\n$.get('https://api.example.com/data',\
    \ function(data) {\n  console.log('Data:', data);\n});\n```\n\n这里是使用 `.ajax()`\
    \ 进行更复杂请求的示例：\n\n```javascript\n$.ajax({\n  url: 'https://api.example.com/data',\n\
    \  method: 'POST',\n  data: { key: 'value' },\n  dataType: 'json',\n  success:\
    \ function(data) {\n    console.log('Success:', data);\n  },\n  error: function(error)\
    \ {\n    console.error('Error:', error);\n  }\n});\n```\n\n`.ajax()` 方法对请求提供了精粒度的控制，允许你指定\
    \ URL、方法、数据、数据类型以及成功和错误回调。\n\n### 何时考虑使用 jQuery\n\njQuery 在以下情况下最有用：\n\n- **现有的\
    \ jQuery 项目**：如果一个项目已经使用了 jQuery，那么继续使用它进行动画和基础 AJAX 通常比将其重构为原生 JavaScript 或或其他库更有意义。\n\
    - **快速原型开发**：对于快速原型设计或小型项目，jQuery 简洁的语法可以加快开发速度。\n- **特定的动画需求**：如果你需要复杂的动画，或者需要支持不支持完整\
    \ CSS 动画的旧浏览器，jQuery 是一个很好的选择。\n\n### 何时倾向于使用现代 JavaScript\n\n在大多数新项目中，通常建议使用现代\
    \ JavaScript API（如用于 AJAX 的 `fetch` 以及用于视觉效果的 CSS 过渡/动画）。这些方法提供了更好的性能、更小的文件，并且更符合当前的\
    \ Web 开发最佳实践。\n\n### 你知道吗？jQuery 的初衷和兴起\n\njQuery 出现于 2006 年，当时的 Web 开发与今天有很大不同。浏览器不一致性随处可见，使得跨浏览器兼容性成为开发者的一个大头问题。在\
    \ Internet Explorer、Firefox、Safari 和其他浏览器中可靠地编写 JavaScript 代码通常需要编写单独的代码路径或使用复杂的变通方案。\n\
    \nJohn Resig 创建 jQuery 有一个明确的目标：“少写代码，多做事情。”它旨在简化常见的 JavaScript 任务，例如 DOM 操作、事件处理、动画和\
    \ AJAX，同时抽象了浏览器差异。这使得开发者能够编写简洁且跨浏览器兼容的代码，而无需担心每个浏览器的实现细节。\n\n"
- fmt: "\nHere are some key factors that contributed to jQuery's rapid rise in popularity:\n\
    \n- **Cross-Browser Compatibility**: This was arguably jQuery's biggest selling\
    \ point. It provided a consistent API that worked across all major browsers of\
    \ the time, saving developers countless hours of debugging and testing.\n- **Simplified\
    \ DOM Manipulation**: jQuery's powerful selectors and concise methods made it\
    \ much easier to select, manipulate, and traverse the DOM. Tasks that would have\
    \ required many lines of vanilla JavaScript could be accomplished with just a\
    \ few lines of jQuery code.\n- **Easy Event Handling**: jQuery simplified event\
    \ handling with its intuitive `.on()` method and shorthand event methods. This\
    \ made it easier to create interactive web pages.\n- **Animations and Effects**:\
    \ jQuery provided simple yet effective animation methods that added visual appeal\
    \ to web pages.\n- **AJAX Simplification**: jQuery's AJAX methods made it easier\
    \ to make asynchronous requests to servers, enabling dynamic content updates without\
    \ page reloads.\n- **Large and Active Community**: jQuery quickly gained a large\
    \ and active community, which contributed to its extensive plugin ecosystem and\
    \ readily available support.\n\nDuring its peak, jQuery was used on a vast majority\
    \ of websites. It became the de facto standard for front-end development, and\
    \ many developers learned jQuery before even learning the fundamentals of plain\
    \ JavaScript.\n\nHowever, the web development landscape has changed significantly\
    \ since jQuery's rise. Modern browsers have largely converged on web standards,\
    \ reducing the need for cross-browser workarounds. Modern JavaScript (ES6 and\
    \ later) has also introduced features that provide comparable functionality to\
    \ many of jQuery's features.\n\nAs a result, jQuery's usage has declined in recent\
    \ years, especially in new projects. However, it’s important to recognize its\
    \ historical significance and its continued relevance in certain contexts, particularly\
    \ in maintaining legacy projects or for specific tasks where its concise syntax\
    \ offers advantages.\n\n## Try It Yourself Exercise 2\n\nConverting a basic DOM\
    \ manipulation task from plain JavaScript to jQuery\n\nThis exercise involves\
    \ creating a simple webpage with a button and a paragraph. When the button is\
    \ clicked, the text content of the paragraph should change. You'll implement this\
    \ functionality first using plain JavaScript and then using jQuery.\n\n### Part\
    \ 1: Plain JavaScript Implementation\n\n1. Create an HTML file (`index.html`):\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>DOM Manipulation Exercise</title>\n\
    </head>\n<body>\n<button id=\"myButton\">Change Text</button>\n<p id=\"myParagraph\"\
    >Initial text.</p>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\
    \n2. Create a JavaScript file (`script.js`):\n\n```javascript\nconst button =\
    \ document.getElementById('myButton');\nconst paragraph = document.getElementById('myParagraph');\n\
    \nbutton.addEventListener('click', function() {\n  paragraph.textContent = 'Text\
    \ changed using plain JavaScript!';\n});\n```\n\n**Explanation:**\n- We get references\
    \ to the button and paragraph elements using `document.getElementById()`.\n- We\
    \ attach a click event listener to the button using `addEventListener()`.\n- Inside\
    \ the event handler, we change the text content of the paragraph using `textContent`.\n\
    \n### Part 2: jQuery Implementation\n\n1. Include jQuery: Add the jQuery library\
    \ to your HTML file. You can either download a copy or use a CDN (Content Delivery\
    \ Network). Add this line before your `script.js` tag:\n\n```html\n<script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n```\n\n2. Modify your\
    \ JavaScript file (`script.js`):\n\n```javascript\n$(document).ready(function()\
    \ { // Ensure the DOM is fully loaded\n  $('#myButton').on('click', function()\
    \ {\n    $('#myParagraph').text('Text changed using jQuery!');\n  });\n});\n```\n\
    \n**Explanation:**\n- We use `$(document).ready()` to ensure that the DOM is fully\
    \ loaded before executing any jQuery code. This is important to prevent errors.\n\
    - We use jQuery selectors (`#myButton`, `#myParagraph`) to get references to the\
    \ elements.\n- We use the `.on()` method to attach a click event handler.\n- Inside\
    \ the event handler, we use the `.text()` method to change the text content of\
    \ the paragraph.\n\n**Comparison:**\nNotice how much more concise the jQuery version\
    \ is. While the plain JavaScript version is relatively simple in this case, the\
    \ difference becomes more significant with more complex DOM manipulations.\n\n\
    **Further Exercises:**\n- Try changing other properties of the paragraph (e.g.,\
    \ color, font size) using both plain JavaScript and jQuery.\n- Try adding new\
    \ elements to the page dynamically using both approaches.\n- Try using event delegation\
    \ in both versions to handle events on dynamically added elements.\n\nBy completing\
    \ this exercise, you’ll gain a better understanding of how jQuery simplifies DOM\
    \ manipulation and event handling compared to plain JavaScript. You'll also see\
    \ where jQuery's concise syntax can be advantageous, especially when dealing with\
    \ more complex tasks. This practical experience will help you make informed decisions\
    \ about when to use jQuery and when to rely on modern JavaScript alternatives.\n\
    \n## Chapter 7: State Management with Redux\n\n### Redux Core Concepts: Store,\
    \ Actions, Reducers\n\nAs web applications grow in complexity, managing application\
    \ state becomes increasingly challenging. State refers to the data that an application\
    \ uses at any given time, including user data, UI state, and data fetched from\
    \ servers. Without a structured approach, managing state can lead to unpredictable\
    \ behavior, difficult debugging, and code that is hard to maintain. Redux provides\
    \ a predictable and centralized way to manage application state, making it easier\
    \ to build complex and scalable applications.\n\n#### The Need for State Management\n\
    \nIn simple applications, managing state can be done within individual components.\
    \ However, as applications grow, sharing state between components becomes more\
    \ complex. Passing data down through multiple levels of components (prop drilling)\
    \ can become cumbersome, and managing state updates in multiple places can lead\
    \ to inconsistencies.\n\nRedux addresses these challenges by providing a central\
    \ store for the application's state. All components can access and update this\
    \ store in a predictable way, making state management more manageable and maintainable.\n\
    \n#### The Three Core Principles of Redux\n\nRedux is built on three core principles:\n\
    \n1. **Single Source of Truth**: The application's state is stored in a single\
    \ JavaScript object called the `store`. This provides a single, reliable source\
    \ of truth for all components.\n2. **State is Read-Only**: The only way to change\
    \ the state is to dispatch an action, which is a plain JavaScript object describing\
    \ the change. This ensures that state updates are predictable and traceable.\n\
    3. **Changes are Made with Pure Functions**: `Reducers` are pure functions that\
    \ take the previous state and an action as arguments and return a new state. Because\
    \ reducers are pure functions, they produce predictable outputs for given inputs,\
    \ making testing and debugging easier.\n\n#### The Redux Store\n\nThe store is\
    \ the heart of a Redux application. It holds the application's state and provides\
    \ methods for accessing and updating that state. You create the store using the\
    \ `createStore` function from the Redux library.\n\n```javascript\nimport { createStore\
    \ } from 'redux';\n\n// Define a reducer (explained in the next section)\nconst\
    \ reducer = (state = { count: 0 }, action) => {\n  switch (action.type) {\n  \
    \  case 'INCREMENT':\n      return { count: state.count + 1 };\n    default:\n\
    \      return state;\n  }\n};\n\n// Create the store\nconst store = createStore(reducer);\n\
    \n// Access the state\nconsole.log(store.getState()); // { count: 0 }\n```\n\n\
    The `createStore` function takes a reducer as an argument. The reducer is responsible\
    \ for determining how the state should be updated in response to actions. The\
    \ initial state can be provided as a default value to the reducer.\n\nThe store\
    \ provides three main methods:\n"
  raw: 'Here are some key factors that contributed to jQuery''s rapid rise in popularity:


    ​● ​Cross-Browser Compatibility: This was arguably jQuery''s biggest selling point.
    It provided a consistent API that worked across all major browsers of the time,
    saving developers countless hours of debugging and testing.


    ​● ​Simplified DOM Manipulation: jQuery''s powerful selectors and concise methods
    made it much easier to select, manipulate, and traverse the DOM. Tasks that would
    have required many lines of vanilla JavaScript could be accomplished with just
    a few lines of jQuery code.


    ​● ​Easy Event Handling:jQuery simplified event handling with its intuitive .on() method
    and shorthand event methods. This made it easier to create interactive web pages.


    ​● ​Animations and Effects: jQuery provided simple yet effective animation methods
    that added visual appeal to web pages.


    ​● ​AJAX Simplification: jQuery''s AJAX methods made it easier to make asynchronous
    requests to servers, enabling dynamic content updates without page reloads.


    ​● ​Large and Active Community: jQuery quickly gained a large and active community,
    which contributed to its extensive plugin ecosystem and readily available support.


    During its peak, jQuery was used on a vast majority of websites. It became the
    de facto standard for front-end development, and many developers learned jQuery
    before even learning the fundamentals of plain JavaScript.


    However, the web development landscape has changed significantly since jQuery''s
    rise. Modern browsers have largely converged on web standards, reducing the need
    for cross-browser workarounds. Modern JavaScript (ES6 and later) has also introduced
    features that provide comparable functionality to many of jQuery''s features.


    As a result, jQuery''s usage has declined in recent years, especially in new projects.
    However, it’s important to recognize its historical significance and its continued
    relevance in certain contexts, particularly in maintaining legacy projects or
    for specific tasks where its concise syntax offers advantages.


    ## Try It Yourself Exercise 2


    Converting a basic DOM manipulation task from plain JavaScript to jQuery


    This exercise involves creating a simple webpage with a button and a paragraph.
    When the button is clicked, the text content of the paragraph should change. You''ll
    implement this functionality first using plain JavaScript and then using jQuery.


    Part 1: Plain JavaScript Implementation


    ​1\. ​Create an HTML file (index.html):


    HTML


    <!DOCTYPE html>


    <html>


    <head>


    <title>DOM Manipulation Exercise</title>


    </head>


    <body>


    <button  id="myButton">Change Text</button>


    <p  id="myParagraph">Initial text.</p>


    <script  src="script.js"></script>


    </body>


    </html>


    ​2\. ​Create a JavaScript file (script.js):


    JavaScript


    const button = document.getElementById(''myButton'');


    const paragraph = document.getElementById(''myParagraph'');


    button.addEventListener(''click'', function() {


    paragraph.textContent = ''Text changed using plain JavaScript!'';


    });


    Explanation:


    ​● ​We get references to the button and paragraph elements using document.getElementById().


    ​● ​We attach a click event listener to the button using addEventListener().


    ​● ​Inside the event handler, we change the text content of the paragraph using
    textContent.


    Part 2: jQuery Implementation


    ​1\. ​Include jQuery:Add the jQuery library to your HTML file. You can either
    download a copy or use a CDN (Content Delivery Network). Add this line beforeyour
    script.js tag:


    HTML


    <script  src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


    ​2\. ​Modify your JavaScript file (script.js):


    JavaScript


    $(document).ready(function() { // Ensure the DOM is fully loaded


    $(''#myButton'').on(''click'', function() {


    $(''#myParagraph'').text(''Text changed using jQuery!'');


    });


    });


    Explanation:


    ​● ​We use $(document).ready() to ensure that the DOM is fully loaded before executing
    any jQuery code. This is important to prevent errors.


    ​● ​We use jQuery selectors (#myButton, #myParagraph) to get references to the
    elements.


    ​● ​We use the .on() method to attach a click event handler.


    ​● ​Inside the event handler, we use the .text() method to change the text content
    of the paragraph.


    Comparison:


    Notice how much more concise the jQuery version is. While the plain JavaScript
    version is relatively simple in this case, the difference becomes more significant
    with more complex DOM manipulations.


    Further Exercises:


    ​● ​Try changing other properties of the paragraph (e.g., color, font size) using
    both plain JavaScript and jQuery.


    ​● ​Try adding new elements to the page dynamically using both approaches.


    ​● ​Try using event delegation in both versions to handle events on dynamically
    added elements.


    By completing this exercise, you’ll gain a better understanding of how jQuery
    simplifies DOM manipulation and event handling compared to plain JavaScript. You''ll
    also see where jQuery''s concise syntax can be advantageous, especially when dealing
    with more complex tasks. This practical experience will help you make informed
    decisions about when to use jQuery and when to rely on modern JavaScript alternatives.


    ## Chapter 7: State Management with Redux


    ### Redux Core Concepts: Store, Actions, Reducers


    As web applications grow in complexity, managing application state becomes increasingly
    challenging. State refers to the data that an application uses at any given time,
    including user data, UI state, and data fetched from servers. Without a structured
    approach, managing state can lead to unpredictable behavior, difficult debugging,
    and code that is hard to maintain. Redux provides a predictable and centralized
    way to manage application state, making it easier to build complex and scalable
    applications.


    The Need for State Management


    In simple applications, managing state can be done within individual components.
    However, as applications grow, sharing state between components becomes more complex.
    Passing data down through multiple levels of components (prop drilling) can become
    cumbersome, and managing state updates in multiple places can lead to inconsistencies.


    Redux addresses these challenges by providing a central store for the application''s
    state. All components can access and update this store in a predictable way, making
    state management more manageable and maintainable.


    The Three Core Principles of Redux


    Redux is built on three core principles:


    ​1\. ​Single Source of Truth:The application''s state is stored in a single JavaScript
    object called the store. This provides a single, reliable source of truth for
    all components.


    ​2\. ​State is Read-Only:The only way to change the state is to dispatch an action,
    which is a plain JavaScript object describing the change. This ensures that state
    updates are predictable and traceable.


    ​3\. ​Changes are Made with Pure Functions: Reducers are pure functions that take
    the previous state and an action as arguments and return1 a new state. Because
    reducers are pure functions, they produce predictable outputs for given inputs,
    making testing and debugging easier.


    The Redux Store


    The store is the heart of a Redux application. It holds the application''s state
    and provides methods for accessing and updating that state. You create the store
    using the createStore function from the Redux library.


    JavaScript


    import { createStore } from  ''redux'';


    // Define a reducer (explained in the next section)


    constreducer = (state = { count: 0 }, action) => {


    switch (action.type) {


    case ''INCREMENT'':


    return{ count: state.count + 1 };


    default:


    return state;


    }


    };


    // Create the store


    const store = createStore(reducer);


    // Access the state


    console.log(store.getState()); // { count: 0 }


    The createStore function takes a reducer as an argument. The reducer is responsible
    for determining how the state should be updated in response to actions. The initial
    state can be provided as a default value to the reducer.


