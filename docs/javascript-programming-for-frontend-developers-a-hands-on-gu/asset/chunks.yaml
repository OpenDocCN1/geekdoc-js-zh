    \ 遍历可迭代对象。正确使用控制流语句对于创建动态且功能强大的 JavaScript 程序至关重要。它们允许你创建复杂的逻辑并有效处理各种场景。\n\n###\
    \ 你知道吗？JavaScript 的历史及其初始名称\n\nJavaScript 的故事与万维网的早期以及对动态、交互式网页的需求交织在一起。20 世纪\
    \ 90 年代中期，网页很大程度上是静态的，HTML 主要用于结构化内容。流行的 Netscape Navigator 浏览器创建者 Netscape Communications\
    \ Corporation 试图为网页添加交互性，使其对用户更具吸引力。\n\n1995 年 5 月，Netscape 的程序员 Brendan Eich\
    \ 被赋予为 Netscape Navigator 开发一种脚本语言的任务。目标是创建一种可以让 Web 开发者为网页添加动态行为的语言，例如表单验证、动画和其他交互元素。\n\
    \nEich 的工作产生了一种最初代号为 \"Mocha\" 的语言。这种语言的早期版本仅用十天时间就完成了，证明了 Eich 的技艺以及项目的紧迫性。随后，Mocha\
    \ 在 1995 年 9 月的 Netscape Navigator 2.0 测试版中被短暂重命名为 \"LiveScript\"。\n\n然而，在几个月后的\
    \ 1995 年 12 月，Netscape 做出了一项战略决定，将该语言重命名为 \"JavaScript\"。这次更更改是由于与 Java 编程语言创建者\
    \ Sun Microsystems 的营销合作伙伴关系。Java 在当时正获得巨大的关注，Netscape 希望通过将他们的脚本语言与 Java 关联来跟上这一趋势。\n\
    \n尽管名称相似，JavaScript 和 Java 本质上是两种不同的语言。Java 是一种编译的、静态类型的语言，而 JavaScript 是一种解释的、动态类型的语言。JavaScript\
    \ 的语法确实借鉴了一些 Java 的元素，但底层概念和范式是不同的。\n\n\"JavaScript\" 这个名称多年一直是许多人的困惑来源，导致一些人认为它是\
    \ Java 的简化版。然而，重要的是，JavaScript 是一门独立的语言，具有独特的特性和能力。\n\n20 世纪 90 年代中期 JavaScript\
    \ 的快速发展和采用对网页的演进起了至关重要的作用。它将网页从静态文档转变为交互式的动态体验，为我们今天使用的丰富且复杂的 Web 应用铺平了道路。\n\n\
    # 第 2 章：使用 DOM 和事件\n\n### 文档对象模型 (DOM) 树\n\n文档对象模型 (DOM) 是 Web 开发者的一个至关接口。它将 HTML\
    \ 或 XML 文档表示为树形结构，其中每个元素、属性和文本都作为一个节点。这种表示允许 JavaScript 动态地操作网页的内容、结构和样式。理解 DOM\
    \ 是创建交互式体验的基础。\n\nDOM 结构\n\n当浏览器加载 HTML 页面时，它解析 HTML 代码并在内存中创建相应的 DOM 树。这棵树表示了不同元素之间的层次关系。树的顶端是\
    \ `document`，它代表整个 HTML 文档。`document` 之下是根元素，通常是 `html` 元素。从那里开始，树分支表示 `head`、`body`\
    \ 以及它们内部的所有元素。\n\nHTML 文档中的每个元素在 DOM 树中都是元素节点。元素的属性表示为属性节点，元素内的文本内容表示为文本节点。考虑以下简单的\
    \ HTML 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Web Page</title>\n\
    </head>\n<body>\n  <h1>Welcome</h1>\n  <p>This is a paragraph.</p>\n</body>\n\
    </html>\n```\n\n该 HTML 的 DOM 树概念上如下：\n\n- `document`\n    - `html`\n        -\
    \ `head`\n            - `title`\n                - 文本节点: \"My Web Page\"\n   \
    \     - `body`\n            - `h1`\n                - 文本节点: \"Welcome\"\n    \
    \        - `p`\n                - 文本节点: \"This is a paragraph.\"\n\n这种树形结构展示了节点之间的父子关系。例如，`body`\
    \ 元素是 `html` 元素的元素，而 `h1` 和 `p` 元素是 `body` 的子元素。`h1` 和 `p` 标签内的文本内容是各自父元素的子文本节点。\n\
    \n导航 DOM\n\n"
- fmt: "\nJavaScript provides several methods for navigating the DOM tree and accessing\
    \ specific nodes. These methods allow you to traverse the tree structure and find\
    \ elements based on their relationships to other elements.\n\n- `document.documentElement`:\
    \ Returns the root element of the document (the `<html>` element).\n- `document.head`:\
    \ Returns the `<head>` element of the document.\n- `document.body`: Returns the\
    \ `<body>` element of the document.\n- `parentNode`: Returns the parent node of\
    \ a given node.\n- `childNodes`: Returns a collection of child nodes of a given\
    \ node.\n- `firstChild`: Returns the first child node of a given node.\n- `lastChild`:\
    \ Returns the last child node of a given node.\n- `nextSibling`: Returns the next\
    \ sibling node of a given node.\n- `previousSibling`: Returns the previous sibling\
    \ node of a given node.\n\nFor example, if you have a reference to the `<h1>`\
    \ element, you can access its parent (`<body>`) using `h1Element.parentNode`.\
    \ You can also access its text content using `h1Element.firstChild.nodeValue`\
    \ (assuming the `<h1>` element contains only text).\n\n## Selecting Elements\n\
    \nIn addition to navigating the DOM tree, JavaScript provides methods for selecting\
    \ elements directly based on their ID, class name, tag name, or CSS selectors.\
    \ These selection methods are essential for manipulating specific elements on\
    \ the page.\n\n- `document.getElementById(id)`: Returns the element with the specified\
    \ ID. IDs should be unique within a document. This is the fastest and most efficient\
    \ way to select a single element.\n\nHTML\n```html\n<div id=\"myDiv\">This is\
    \ my div.</div>\n<script>\nlet myDiv = document.getElementById(\"myDiv\");\n</script>\n\
    ```\n\n- `document.getElementsByClassName(className)`: Returns a collection of\
    \ elements with the specified class name.\n\nHTML\n```html\n<div class=\"myClass\"\
    >First div.</div>\n<div class=\"myClass\">Second div.</div>\n<script>\nlet myDivs\
    \ = document.getElementsByClassName(\"myClass\");\n</script>\n```\n\n- `document.getElementsByTagName(tagName)`:\
    \ Returns a collection of elements with the specified tag name.\n\nHTML\n```html\n\
    <p>First paragraph.</p>\n<p>Second paragraph.</p>\n<script>\nlet paragraphs =\
    \ document.getElementsByTagName(\"p\");\n</script>\n```\n\n- `document.querySelector(selector)`:\
    \ Returns the first element that matches the specified CSS selector. This is a\
    \ versatile method that can be used to select elements based on any CSS selector,\
    \ including IDs, classes, tag names, attributes, and more.\n\nHTML\n```html\n\
    <div id=\"container\">\n  <p class=\"text\">A paragraph inside the container.</p>\n\
    </div>\n<script>\nlet paragraph = document.querySelector(\"#container .text\"\
    );\n</script>\n```\n\n- `document.querySelectorAll(selector)`: Returns a collection\
    \ of all elements that match the specified CSS selector.\n\nHTML\n```html\n<ul>\n\
    \  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>\n<script>\nlet listItems = document.querySelectorAll(\"\
    li\");\n</script>\n```\n\nUnderstanding the DOM tree and the methods for navigating\
    \ and selecting elements within it is fundamental to dynamic web development.\
    \ It allows JavaScript to interact with and manipulate web page content, enabling\
    \ the creation of interactive and engaging user experiences. These techniques\
    \ are the foundation for more advanced DOM manipulation and event handling, which\
    \ will be discussed in subsequent sections.\n\n## DOM Manipulation: Selecting,\
    \ Creating, and Modifying Elements\n\nHaving explored the structure of the DOM\
    \ and methods for selecting elements, we now turn to the core of dynamic web development:\
    \ manipulating the DOM. This involves creating new elements, modifying existing\
    \ ones, and even removing elements from the document. These capabilities allow\
    \ developers to build interactive user interfaces that respond to user actions\
    \ and update content without requiring full page reloads.\n\n### Modifying Element\
    \ Content\n\nOne of the most common DOM manipulation tasks is changing the content\
    \ of an element. JavaScript provides several ways to achieve this:\n\n- `textContent`:\
    \ This property sets or gets the text content of a node and its descendants. It\
    \ is generally the preferred method for setting text content as it handles text\
    \ encoding correctly and is more performant than `innerHTML`.\n\nHTML\n```html\n\
    <div id=\"myDiv\">Initial text.</div>\n<script>\nlet myDiv = document.getElementById(\"\
    myDiv\");\nmyDiv.textContent = \"New text content.\";\n</script>\n```\n\n- `innerHTML`:\
    \ This property sets or gets the HTML content of an element. It can be used to\
    \ insert HTML markup, but it is important to be cautious when using `innerHTML`\
    \ with user-supplied data, as it can create security vulnerabilities (Cross-Site\
    \ Scripting or XSS attacks) if not handled properly.\n\nHTML\n```html\n<div id=\"\
    myDiv\"></div>\n<script>\nlet myDiv = document.getElementById(\"myDiv\");\nmyDiv.innerHTML\
    \ = \"<p>A new paragraph.</p>\";\n</script>\n```\n\n### Modifying Element Attributes\n\
    \nAttributes provide additional information about HTML elements. JavaScript allows\
    \ you to modify these attributes dynamically:\n\n- `setAttribute(name, value)`:\
    \ Sets the value of an attribute on a specified element.\n\nHTML\n```html\n<img\
    \ id=\"myImage\" src=\"old-image.jpg\" alt=\"Old Image\">\n<script>\nlet myImage\
    \ = document.getElementById(\"myImage\");\nmyImage.setAttribute(\"src\", \"new-image.jpg\"\
    );\nmyImage.setAttribute(\"alt\", \"New Image\");\n</script>\n```\n\n- `getAttribute(name)`:\
    \ Returns the value of a specified attribute on an element.\n\nHTML\n```html\n\
    <a id=\"myLink\" href=\"https://example.com\">Example Link</a>\n<script>\nlet\
    \ myLink = document.getElementById(\"myLink\");\nlet href = myLink.getAttribute(\"\
    href\");\nconsole.log(href); // Output: https://example.com\n</script>\n```\n\n\
    - Direct property access: Many attributes are also accessible as direct properties\
    \ of the element object. This is often the most convenient way to access and modify\
    \ common attributes.\n\nHTML\n```html\n<input type=\"text\" id=\"myInput\" value=\"\
    Initial Value\">\n<script>\nlet myInput = document.getElementById(\"myInput\"\
    );\nmyInput.value = \"New Value\"; // Modifying value attribute\nmyInput.id =\
    \ \"theInput\"; // Modifying id attribute\n</script>\n```\n\n### Modifying Element\
    \ Styles\n\nJavaScript can also be used to dynamically change the styles of elements:\n\
    \n- `style` property: The `style` property allows you to access and modify the\
    \ inline styles of an element.\n\nHTML\n```html\n<div id=\"myDiv\" style=\"background-color:\
    \ lightblue;\">A div.</div>\n<script>\nlet myDiv = document.getElementById(\"\
    myDiv\");\nmyDiv.style.backgroundColor = \"lightgreen\";\nmyDiv.style.color =\
    \ \"white\";\nmyDiv.style.padding = \"10px\";\n</script>\n```\n\n- `classList`\
    \ property: The `classList` property provides methods for adding, removing, and\
    \ toggling CSS classes on an element. This is generally preferred over directly\
    \ manipulating the `style` property, as it promotes better separation of concerns\
    \ (separating styling from JavaScript logic).\n\nHTML\n```html\n<div id=\"myDiv\"\
    \ class=\"initial-class\">A div.</div>\n<style>\n.highlight { background-color:\
    \ yellow; }\n.hidden { display: none;}\n</style>\n<script>\nlet myDiv = document.getElementById(\"\
    myDiv\");\nmyDiv.classList.add(\"highlight\"); // Adds the 'highlight' class\n\
    myDiv.classList.remove(\"initial-class\"); // Removes the 'initial-class'\nmyDiv.classList.toggle(\"\
    hidden\"); // Toggles the 'hidden' class\n</script>\n```\n\n### Creating and Inserting\
    \ Elements\n\nJavaScript enables the dynamic creation and insertion of new elements\
    \ into the DOM:\n\n- `document.createElement(tagName)`: Creates a new element\
    \ node with the specified tag name.\n\n```javascript\nlet newParagraph = document.createElement(\"\
    p\");\n```\n\n- `document.createTextNode(text)`: Creates a new text node with\
    \ the specified text content.\n\n```javascript\nlet textNode = document.createTextNode(\"\
    This is a new paragraph.\");\n```\n\n- `appendChild(node)`: Adds a node as the\
    \ last child of a specified parent node.\n\n```javascript\nlet myDiv = document.getElementById(\"\
    myDiv\");\nnewParagraph.appendChild(textNode); // Add text to paragraph\nmyDiv.appendChild(newParagraph);\
    \ // Add paragraph to div\n```\n\n- `insertBefore(newNode, referenceNode)`: Inserts\
    \ a node before a specified reference node.\n\n```javascript\nlet anotherParagraph\
    \ = document.createElement(\"p\");\n```\n"
