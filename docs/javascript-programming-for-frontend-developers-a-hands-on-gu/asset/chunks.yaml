    \ the value of counter to 1.\n```\n\nChoosing the right keyword for variable declaration\
    \ is important. Use `const` by default for values that will not change. Use `let`\
    \ for values that may need to be reassigned. Avoid using `var`.\n\n### Data Types:\
    \ Classifying Data\n\nJavaScript has several built-in data types that classify\
    \ the kind of values a variable can hold. Understanding these data types is essential\
    \ for performing operations and manipulating data correctly.\n\n* **Number**:\
    \ Represents numeric values, including integers and floating-point numbers.\n\
    ```javascript\nlet age = 30;\nlet price = 99.99;\n```\n* **String**: Represents\
    \ textual data enclosed in single or double quotes.\n```javascript\nlet name =\
    \ \"John Doe\";\nlet greeting = 'Hello!';\n```\n* **Boolean**: Represents logical\
    \ values: true or false.\n```javascript\nlet isLoggedIn = true;\nlet hasPermission\
