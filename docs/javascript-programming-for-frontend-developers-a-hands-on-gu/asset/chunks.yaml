    ​● ​Boolean:Represents logical values: trueor false.


    JavaScript


    let isLoggedin = true;


    let hasPermission = false;


    ​● ​Null: Represents the intentional absence of a value.


    JavaScript


    letuser = null; // Represents that the user object is currently empty.


    ​● ​Undefined: Represents a variable that has been declared but has not yet been
    assigned a value.


    JavaScript


    letcity; // city is undefined.


    ​● ​Symbol (ES6): Represents unique and immutable values, often used as keys for
    object properties.


    JavaScript


    const uniqueId = Symbol(''id'');


    ​● ​Object: Represents a collection of key-value pairs. Objects are versatile
    and can be used to represent complex data structures.


    JavaScript


    let person = {


    name: "Jane Doe",


    age: 25,


    city: "New York"


    };


    Operators: Performing Operations


    Operators are symbols that perform operations on values (operands). JavaScript
    provides a wide range of operators for various purposes.


    ​● ​Arithmetic Operators: Perform mathematical calculations.


    ​○ ​+ (Addition)


    ​○ ​- (Subtraction)


    ​○ ​* (Multiplication)


    ​○ ​/ (Division)


    ​○ ​% (Modulo – returns the remainder of a division)


    ​○ ​** (Exponentiation)


    JavaScript


    letsum = 10+ 5; // 15


    letdifference = 20- 8; // 12


    letproduct = 6* 7; // 42


    letquotient = 15/ 3; // 5


    letremainder = 10% 3; // 1


    letpower = 2** 3; // 8


    ​● ​Assignment Operators: Assign values to variables.


    ​○ ​= (Assignment)


    ​○ ​+= (Addition assignment)


    ​○ ​-= (Subtraction assignment)


    ​○ ​*= (Multiplication assignment)


    ​○ ​/= (Division assignment)1


    JavaScript


    let x = 10;


    x += 5; // x is now 15 (equivalent to x = x + 5)


    ​● ​Comparison Operators: Compare two values and return a Boolean result.


    ​○ ​== (Equal to – loose equality, performs type coercion)


    ​○ ​=== (Strict equal to – strict equality, does not perform type coercion)


    ​○ ​!= (Not equal to – loose inequality)


    ​○ ​!== (Strict not equal to – strict inequality)


    ​○ ​> (Greater than)


    ​○ ​< (Less than)


    ​○ ​>= (Greater than or equal to)


    ​○ ​<= (Less than or equal to)


    ​● ​It is strongly recommended to use strict equality (===and !==) to avoid unexpected
    type coercion issues.


    ​● ​Logical Operators: Perform logical operations on Boolean values.


    ​○ ​&& (Logical AND)


    ​○ ​|| (Logical OR)


    ​○ ​! (Logical NOT)


    JavaScript


    let a = true;


    let b = false;


    a && b; // false


    a || b; // true


    !a; // false


    ​● ​String Operators: Concatenate strings.


    ​○ ​+ (Concatenation)


    JavaScript


    let firstName = "John";


    let lastName = "Doe";


    letfullName = firstName + " "+ lastName; // "John Doe"


    Understanding variables, data types, and operators is fundamental to writing JavaScript
    code. These basic building blocks allow you to store, manipulate, and process
    data, forming the basis for more complex programming concepts. The consistent
    use of letand const, the understanding of data types, and the use of strict equality
    operators are crucial for writing robust and predictable JavaScript code.


    ### Control Flow: Conditionals (if/else, switch), Loops (for, while, do…while)


    Control flow statements are the mechanisms that determine the order in which code
    is executed. They allow you to make decisions (conditionals) and repeat actions
    (loops), adding dynamism and logic to your programs. This section covers the fundamental
    control flow structures in JavaScript: if/elsestatements, switch statements, and
    the various loop constructs (for, while, and do…while).


    Conditionals: Making Decisions


    Conditional statements allow your code to execute different blocks of code based
    on whether a certain condition is true or false. The most common conditional statement
    is the if statement.


    ​● ​if statement:The ifstatement executes a block of code only if a specified
    condition evaluates to true.


    JavaScript


    let age = 20;


    if(age >= 18) {


    console.log("You are eligible to vote.");


    }


    ​● ​else statement:The elsestatement provides an alternative block of code to
    execute if the ifcondition is false.


