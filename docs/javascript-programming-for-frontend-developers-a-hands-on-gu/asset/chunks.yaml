  trans: "\n\n通过使用 `react-redux` 以及 `connect()` 或 hooks，你可以有效地将 React 组件连接到 Redux\
    \ store 中，从而在你的应用程序中实现高效且可预测的状态管理。本节将提供将 Redux 集成到 React 项目中的工具。\n\n# Redux Toolkit：简化\
    \ Redux 开发\n\n虽然 Redux 提供了一种强强大且可预测的状态管理方式，但设置 Redux store 以及编写 reducers 和 actions\
    \ 可能会涉及大量的模板代码。Redux Toolkit (RTK) 的设计旨在解决这一问题，它提供了一系列工具来简化常见的 Redux 任务。它被认为是今天编写\
    \ Redux 逻辑的标准方式。\n\n## Redux Toolkit 的核心特性\n\nRedux Toolkit 提供了几项关键特性，可以简化 Redux\
    \ 的开发工作流：\n\n- `configureStore()`：简化了 store 的设置，包括设置中间件（例如用于异步操作的 `Redux Thunk`）以及启用\
    \ Redux DevTools 扩展。\n- `createSlice()`：简化了 reducer 和 action 的创建。它根据你定义的 reducer\
    \ 逻辑自动生成 action 创建器（action creators）和 action 类型（action types）。\n- `createAsyncThunk()`：简化了异步逻辑的处理，例如从\
    \ API 获取数据。它会生成用于管理异步操作不同阶段（pending, fulfilled, rejected）的 action 创建器。\n- 不变性辅助工具（Immutability\
    \ Helpers）：虽然严格来说不是 RTK 本身的一部分，但它强烈鼓励在 reducers 中使用 `Immer` 来简化不可变更新。\n\n## 使用\
    \ configureStore() 设置 Store\n\n使用 `configureStore()` 设置 store 比直接使用 `createStore`\
    \ 要简单得多。\n\n```javascript\nimport { configureStore } from '@reduxjs/toolkit';\n\
    import counterReducer from './counterSlice'; // 你的 slice reducer\n\nconst store\
    \ = configureStore({\n  reducer: {\n    counter: counterReducer, 在在此添加你的 reducers\n\
    \    // 其他 reducers...\n  }\n});\n\nexport default store;\n```\n\n`configureStore()`\
    \ 会自动设置 Redux DevTools 扩展（如果浏览器中已安装），并包含了用于常见用例的中间件。\n\n## 使用 createSlice() 创建\
    \ Slices\n\n`createSlice()` 是 Redux Toolkit 中最重要的工具。它简化了 reducer 和 action 的创建。\n\
    \n```javascript\nimport { createSlice } from '@reduxjs/toolkit';\n\nconst counterSlice\
    \ = createSlice({\n  name: 'counter', // slice 的名称\n  initialState: {\n    value:\
    \ 0\n  },\n  reducers: {\n    increment: (state) => {\n      state.value += 1;\
    \ // 得益于 Immer，这里的“变异”逻辑是允许的\n    },\n    decrement: (state) => {\n      state.value\
    \ -= 1;\n    },\n    incrementByAmount: (state, action) => {\n      state.value\
    \ += action.payload;\n    }\n  }\n});\n\n// 输出 action 创建器和 reducer\nexport const\
    \ { increment, decrement, incrementByAmount } = counterSlice.actions;\nexport\
    \ default counterSlice.reducer;\n```\n\n**关于 createSlice() 的关键点：**\n\n- `name`：slice\
    \ 的名称，用作 action 类型的前缀。\n- `initialState`：该 slice 的初始状态。\n- `reducers`：一个对象，键是\
    \ action 的名称，值是 reducer 函数。\n\n注意我们在 reducers 内部直接“变异”了状态。这是通过 Redux Toolkit 的\
    \ `Immer` 实现的。`Immer` 使用“草稿状态（draft state）”允许你编写变异逻辑，但在底层它会生成一个新的不可变状态。\n\n`createSlice()`\
    \ 会自动生成与 reducer 函数同名的 action 创建器。我们可以在组件中导入并使用这些 action 创建器。\n\n## 使用 createAsyncThunk()\
    \ 处理异步 Actions\n\n`createAsyncThunk()` 简化了异步逻辑的处理，例如从 API 获取数据。\n\n```javascript\n\
    import { createAsyncThunk } from '@reduxjs/toolkit';\n\n// 定义异步 thunk\nexport\
    \ const fetchUserById = createAsyncThunk(\n  'users/fetchByIdStatus', // action\
    \ 类型前缀\n  async (userId, thunkAPI) => {\n    const response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \    return await response.json();\n  }\n);\n```\n\n`createAsyncThunk()` 两个参数：\n\
    \n- 一个字符串，将作为生成的 action 类型的前缀。\n- 一个执行异步操作的异步函数。\n\n`createAsyncThunk()` 会自动生成三种\
    \ action 类型：\n\n- `pending`：当异步操作开始时派发。\n- `fulfilled`：当异步操作成功时派发。\n- `rejected`：当异步操作失败时派发。\n\
    \n你可以在你的 reducers 中处理这些 actions：\n\n```javascript\nconst usersSlice = createSlice({\n\
    \  name: 'users',\n  initialState: {\n    user: null,\n    loading: false,\n \
    \   error: null\n  },\n  reducers: {},\n  extraReducers: (builder) => {\n    builder.addCase(fetchUserById.pending,\
    \ (state) => {\n      state.loading = true;\n    });\n    builder.addCase(fetchUserById.fulfilled,\
    \ (state, action) => {\n      state.loading = false;\n      state.user = action.payload;\n\
    \    });\n    builder.addCase(fetchUserById.rejected, (state, action) => {\n \
    \     state.loading = false;\n      state.error = action.error.message;\n    });\n\
    \  }\n});\n```\n\n`extraReducers` 允许你处理在 slice 之外定义的 actions，例如由 `createAsyncThunk()`\
    \ 生成的 actions。\n\n## Redux Toolkit 的优势\n\nRedux Toolkit 提供了几项显著的优势：\n\n- **减少模板代码**：它显著减少了设置和使用\
    \ Redux 所需的模板代码。\n- **简化语法**：它提供了一个更简洁、直观的 API。\n- **最佳实践**：它鼓励最佳实践，例如使用 `Immer`\
    \ 进行不可变更新，以及使用 `Redux Thunk` 处理异步操作。\n- **提升开发者体验**：它让 Redux 开发变得更快、更有趣。\n\nRedux\
    \ Toolkit 是今天编写 Redux 逻辑的推荐方法。它简化了常见任务并推广了最佳实践，使构建和维护复杂的 Redux 应用变得更加容易。第 7 章此结束。\n\
    \n# 你知道吗？创建 Redux 的动机及其对复杂应用的优势\n\nRedux 由 Dan Abramov 和 Andrew Clark 创建，其灵感源于\
    \ `Flux`——这是一个由 Facebook 开发的用于管理复杂用户界面状态的架构模式。在 Redux 之前，在大型 JavaScript 应用（尤其是使用\
    \ React 的应用）中管理状态可能变得非常困难。以下是 Redux 设计解决的问题以及它带来的优势：\n\n### Redux 解决的问题：\n\n-\
    \ **复杂的状态管理**：随着应用程序的增长，状态管理变得越来越复杂。状态更新可能发生在应用程序的多个部分，使得难以追踪状态是如何以及为什么变化的。这可能导致难以重现和修复的\
    \ bug。\n- **属性层传递（Prop Drilling）**：在 React 应用中，跨越多个组件级传递数据（prop drilling）可能会变得繁琐，并导致组件紧耦合。这使得复用组件和维护应用程序变得困难。\n\
    - **不可预测的状态更新**：如果没有中心化的状态管理解决方案，状态更新可能会以不可预测的顺序发生，使得难以理解应用程序的行为。\n\n### Redux\
    \ 提供的优势：\n\nRedux 通过提供一种中心化且可预测的应用程序状态管理方式解决了这些问题。以下是一些关键优势：\n\n- **中心化状态**：Redux\
    \ 提供了一个持有整个应用程序状态的单一 store。这使得从应用程序中的任何组件访问和更新状态变得简单。\n- **可预测的状态更新**：Redux 中的状态更新是可预测的，因为它们由\
    \ actions 发起并由纯 reducer 处理。这使得理解状态是如何以及为什么变化变得更容易。\n- **易于调试**：Redux DevTools\
    \ 提供了一个用于调试 Redux 应用的强大工具。它允许你检查状态、查看派发的 actions，甚至穿越状态变化进行时间回溯。\n\n"
- fmt: "\n- **Improved Testability**: Because reducers are pure functions, they are\
    \ easy to test. You can simply provide a state and an action and assert that the\
    \ reducer returns the expected new state.\n- **Better Organization**: Redux enforces\
    \ a clear separation of concerns, making it easier to organize and maintain large\
    \ applications.\n- **Improved Performance (with proper use)**: By preventing unnecessary\
    \ re-renders with techniques like `connect`'s `mapStateToProps` and memoization,\
    \ Redux can improve application performance.\n- **Time Travel Debug**: One of\
    \ the most powerful features of Redux is its ability to \"time travel\" through\
    \ state changes. Redux DevTools records every action dispatched to the store,\
    \ allowing you to replay these actions and see how the state evolved over time.\
    \ This is invaluable for debugging complex issues.\n\n## How Redux Solves the\
    \ Problems:\n\n- **Centralized State**: By having a single store, Redux eliminates\
    \ the need for prop drilling and makes it easy to share state between components.\n\
    - **Predictable State Updates**: By requiring state updates to be initiated by\
    \ actions and handled by pure reducers, Redux ensures that state changes are predictable\
    \ and traceable.\n- **Easy Debugging**: Redux DevTools makes it easy to inspect\
    \ the state and track state changes, making debugging much simpler.\n\nRedux is\
    \ particularly beneficial for complex applications with:\n\n- Many interactive\
    \ elements\n- Frequent state updates\n- Complex data flows\n- Collaborative development\n\
    \nWhile the initial setup of Redux can seem complex, the benefits it provides\
    \ in terms of maintainability, testability, and debugging make it a valuable tool\
    \ for building large and complex web applications.\n\n## Chapter 8. Building a\
