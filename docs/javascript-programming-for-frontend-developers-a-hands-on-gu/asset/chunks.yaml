  trans: "\n\n想象一个你需要从远程服务器获取数据的场景。这个过程涉及向服务器发送请求、等待服务器处理请求，然后接收响应。这可能会花费大量时间，特别是当服务器很忙或网络连接缓慢时。如果\
    \ JavaScript 同步执行此过程（即在继续下一步之前等待每一步的完成），浏览器在等待期间将变得无响应。\n\n异步编程允许 JavaScript 在等待等待耗时操作完成的同时继续执行其他代码。当操作完成后，会发送通知，并执行相应的代码来处理结果。这防止了用户界面冻结，并提供了更流畅、更响应的用户体验。\n\
    \n## 回调：传统方法\n\n在 JavaScript 中处理异步操作的传统方法是通过回调（callbacks）。回调是一个作为参数传递给另一个函数并在异步操作完成后执行的函数。\n\
    \n考虑一个使用 `setTimeout()` 的简单示例，该函数会在指定的延迟后执行回调函数：\n\n```javascript\nconsole.log(\"\
    Before timeout\");\n\nsetTimeout(function() {\n  console.log(\"Inside timeout\"\
    );\n}, 2000); // 延迟 2000 毫秒（2 秒）\n\nconsole.log(\"After timeout\");\n```\n\n这段代码的输出将是：\n\
    Before timeout\nAfter timeout\nInside timeout\n\n如你所看到的，即使代码中 `setTimeout()` 调用在\
    \ `console.log(\"After timeout\")` 行之前，\"After timeout\" 消息也会在 \"Inside timeout\"\
    \ 消息之前记录。这证明了 `setTimeout()` 的异步性质。`setTimeout()` 函数不会阻塞后续代码的执行。相反，它调度回调函数以便在指定的延迟后执行。\n\
    \n## 回调的问题：回调地狱\n\n虽然回调是处理异步操作的有用机制，但在处理多个相互依赖的异步操作时，它们可能会变得难以管理。这种这种情况通常被称为“回调地狱”（callback\
    \ hell）或“死亡金字塔”，因为代码结构具有深层嵌套结构。\n\n考虑一种场景：你需要从三个不同的 API 获取数据，每个后续请求都取决于上一个请求的结果：\n\
    \n```javascript\nfetchData1(function(data1) {\n  fetchData2(data1, function(data2)\
    \ {\n    fetchData3(data2, function(data3) {\n      // Process data3\n    });\n\
    \  });\n});\n```\n\n如你所示，随着异步操作数量的增加，代码变得越来越嵌套，难以阅读和维护。这是使用回调处理复杂异步工作流的显著缺点。\n\
    \n## Promises：更简洁的方法\n\nES6 引入了 Promises 作为一种更优雅、更易于管理的异步操作方法。`Promise` 代表异步操作的最终结果。它可以处于以下三种状态之一：\n\
    \n- **Pending（等待中）**：初始状态，表示操作仍在进行中。\n- **Fulfilled（已完成）**：操作成功完成，且 `Promise`\
    \ 有一个结果值。\n- **Rejected（已拒绝）**：操作失败，`Promise` 有失败的原因（通常是错误）。\n\n创建一个 `Promise`\
    \ 涉及使用 `Promise` 构造函数，它接受一个带有两个参数的函数：`resolve` 和 `reject`。当操作成功时调用 `resolve` 函数，操作失败时调用\
    \ `reject` 函数。\n\n```javascript\nfunction fetchData() {\n  return new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n      const data = \"Data fetched successfully!\"\
    ;\n      resolve(data); // 使用数据解析 Promise\n      // 或者\n      // reject(\"Error\
    \ fetching data!\"); // 使用错误拒绝 promise。\n    }, 1000);\n  });\n}\n\nfetchData()\n\
    \  .then(data => {\n    console.log(data); // 输出: Data fetched successfully!\n\
    \  })\n  .catch(error => {\n    console.error(error); // 处理任何错误\n  });\n```\n\n\
    `.then()` 方法用于处理 `Promise` 的已完成状态。它接受一个回调函数，该函数在 `Promise` 被解析时执行。`.catch()` 方法用于处理\
    \ `Promise` 的拒绝状态。它接受一个回调函数，该函数在 `Promise` 被拒绝时执行。\n\n与回调相比，Promises 提供了一种更简洁、更有结构的方式来处理异步操作。它们通过允许使用\
    \ `.then()` 方法将异步操作链在一起，避免了回调地狱的问题。这创建了更可读、更易维护的代码结构。\n\n### Promises：创建、解析和拒绝\
    \ Promises\n\n在介绍了异步操作和回调的局限性之后，本节将提供对 JavaScript 中 Promises 的更详细的检查。我们将检查如何创建\
    \ Promises、处理它们不同的状态（pending, fulfilled 和 rejected），以及如何将多个异步操作链在一起。\n\n#### 创建\
    \ Promises\n\n如前所述，`Promise` 是一个代表异步操作最终结果的 get。你使用 `Promise` 构造函数创建一个新的 `Promise`，它接受一个称为“执行器”（executor）的函数。该执行器接受两个参数：`resolve`\
    \ 和 `reject`。\n\n```javascript\nconst myPromise = new Promise((resolve, reject)\
    \ => {\n  // 异步操作在这里\n  const success = true; // 模拟成功或失败的操作\n  if (success) {\n\
    \    const result = \"Operation successful!\";\n    resolve(result); // 使用结果解析\
    \ promise\n  } else {\n    const error = \"Operation failed!\";\n    reject(error);\
    \ // 使用错误拒绝 promise\n  }\n});\n```\n\n执行器函数包含了异步操作的逻辑。如果操作成功，你调用 `resolve` 函数，将操作的结果作为参数传递。如果操作失败，你调用\
    \ `reject` 函数，将错误或失败的原因作为参数传递。\n\n#### 处理 Promise 状态：then() 和 catch()\n\n一旦创建了\
    \ `Promise`，你可以使用 `.then()` 和 `.catch()` 方法处理它不同的状态。\n\n- `.then()`：`.then()`\
    \ 方法用于处理 `Promise` 的已完成（解析）状态。它接受一个回调函数作为参数，该函数在 `Promise` 被解析时执行。解析后的值被作为参数传递给这个回调函数。\n\
    \n```javascript\nmyPromise.then(value => {\n  console.log(\"Promise resolved with\
    \ value:\", value);\n});\n```\n\n- `.catch()`：`.catch()` 方法用于处理 `Promise` 的拒绝状态。它也接受一个回调函数作为参数，该函数在\
    \ `Promise` 被拒绝时执行。拒绝原因（错误）被作为参数传递给这个回调函数。\n\n```javascript\nmyPromise.catch(error\
    \ => {\n  console.error(\"Promise rejected with error:\", error);\n});\n```\n\n\
    #### Promise 链\n\nPromises 的优势之一是它们可以链式调用。这允许你以简洁可读的方式对多个异步操作排序，避免回调地狱的问题。\n\n\
    ```javascript\nfunction fetchData(url) {\n  return new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n      const data = `Data from ${url}`;\n     \
    \ resolve(data);\n    }, 1000);\n  });\n}\n\nfetchData(\"url1\")\n  .then(data1\
    \ => {\n    console.log(\"Received:\", data1);\n    return fetchData(\"url2\"\
    ); // 返回一个新的 Promise\n  })\n  .then(data2 => {\n    console.log(\"Received:\"\
    , data2);\n    return fetchData(\"url3\"); // 返回一个新的 Promise\n  })\n  .then(data3\
    \ => {\n    console.log(\"Received:\", data3)\n  })\n  .catch(error => {\n   \
    \ console.error(\"Error:\", error);\n  });\n```\n\n在这个示例中，三个异步操作（通过 `fetchData()`\
    \ 模拟）通过 `.then()` 链在一起。每个 `.then()` 方法接收上一个 `Promise` 的结果并返回一个新的 `Promise`，创建一个异步操作序列。如果链中的任何\
    \ `Promise` 被拒绝，`.catch()` 方法将处理该错误。\n\n#### 处理 Promise 链中的错误\n\n"
- fmt: "\nIt's important to handle errors properly in Promise chains. If an error\
    \ occurs in any of the `.then()` handlers, it will propagate down the chain until\
    \ it is caught by a `catch()` handler. It is best practice to place a `catch()`\
    \ handler at the end of the chain to handle any potential errors.\n\n## Promise.all()\
    \ and Promise.race()\n\nJavaScript provides two useful methods for working with\
    \ multiple Promises:\n\n- `Promise.all(promises)`: This method takes an array\
    \ of `Promises` as an argument and returns a new `Promise` that resolves when\
    \ all of the input `Promises` have resolved. If any of the input `Promises` are\
    \ rejected, the returned `Promise` is immediately rejected with the rejection\
    \ reason of the first rejected Promise.\n\n```javascript\nconst promise1 = Promise.resolve(3);\n\
    const promise2 = 42;\nconst promise3 = new Promise((resolve, reject) => {\n  setTimeout(resolve,\
    \ 100, 'foo');\n});\n\nPromise.all([promise1, promise2, promise3]).then((values)\
    \ => {\n  console.log(values); // expected output: Array [3, 42, \"foo\"]\n});\n\
    ```\n\n- `Promise.race(promises)`: This method also takes an array of `Promises`\
    \ as an argument, but it returns a new `Promise` that resolves or rejects as soon\
    \ as the first of the input `Promises` resolves or rejects.\n\n```javascript\n\
    const promise1 = new Promise((resolve, reject) => {\n  setTimeout(resolve, 500,\
    \ 'one');\n});\nconst promise2 = new Promise((resolve, reject) => {\n  setTimeout(resolve,\
    \ 100, 'two');\n});\n\nPromise.race([promise1, promise2]).then((value) => {\n\
    \  console.log(value); // \"two\"\n  // Both resolve, but promise2 is faster\n\
    });\n```\n\nPromises provide a significant improvement over callbacks for handling\
    \ asynchronous operations in JavaScript. They make asynchronous code more readable,\
    \ maintainable, and easier to reason about, especially when dealing with complex\
    \ asynchronous workflows. They are a fundamental concept in modern JavaScript\
    \ development.\n\n## Async/Await: Simplifying Asynchronous Code\n\nWhile Promises\
    \ provide a substantial improvement over callbacks for handling asynchronous operations,\
    \ working with complex Promise chains can still become somewhat cumbersome. ES8\
    \ (ECMAScript 2017) introduced `async` and `await` keywords, which build on top\
    \ of Promises and provide an even more elegant and readable way to write asynchronous\
    \ code. They make asynchronous code look and behave a bit more like synchronous\
    \ code, making it easier to understand and reason about.\n\n### async Functions\n\
    \nThe `async` keyword is used to define an asynchronous function. When you declare\
    \ a function as `async`, it implicitly returns a `Promise`. If the function returns\
    \ a value, the `Promise` resolves with that value. If the function throws an error,\
    \ the `Promise` rejects with that error.\n\n```javascript\nasync function myAsyncFunction()\
    \ {\n  return \"Hello from async function!\";\n}\n\nmyAsyncFunction().then(value\
    \ => {\n  console.log(value); // Output: Hello from async function!\n});\n\nasync\
    \ function myAsyncErrorFunction() {\n  throw new Error('This is an error')\n}\n\
    \nmyAsyncErrorFunction().catch(error => {\n  console.log(error) // Output: Error:\
    \ This is an error\n})\n```\n\n### await Operator\n\nThe `await` keyword is used\
    \ inside `async` functions to pause the execution of the function until a `Promise`\
    \ resolves. The `await` operator can only be used inside `async` functions.\n\n\
    ```javascript\nasync function fetchData() {\n  const promise = new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n      resolve(\"Data fetched!\");\n  \
    \  }, 1000);\n  });\n  const data = await promise; // Pause execution until the\
    \ promise resolves\n  console.log(data); // Output: Data fetched!\n  return data;\n\
    }\n\nfetchData();\n```\n\nIn this example, the `await` keyword pauses the execution\
    \ of the `fetchData()` function until the `promise` resolves. Once the promise\
    \ resolves, the value is assigned to the `data` variable, and the function continues\
    \ executing.\n\n### Combining async and await with Promises\n\n`async` and `await`\
    \ work seamlessly with `Promises`, making it much easier to handle asynchronous\
    \ operations. Consider the previous example of fetching data from multiple URLs\
    \ using Promise chaining:\n\n```javascript\nfunction fetchData(url) {\n  return\
    \ new Promise((resolve, reject) => {\n    setTimeout(() => {\n      const data\
    \ = `Data from ${url}`;\n      resolve(data);\n    }, 1000);\n  });\n}\n\nasync\
    \ function fetchMultipleData() {\n  try {\n    const data1 = await fetchData(\"\
    url1\");\n    console.log(\"Received:\", data1);\n    const data2 = await fetchData(\"\
    url2\");\n    console.log(\"Received:\", data2);\n    const data3 = await fetchData(\"\
    url3\");\n    console.log(\"Received:\", data3);\n    return [data1, data2, data3]\n\
    \  } catch (error) {\n    console.error(\"Error:\", error);\n  }\n}\n\nfetchMultipleData().then(data\
    \ => console.log(data));\n```\n\nThis code is much cleaner and easier to read\
    \ than the equivalent code using Promise chaining. The asynchronous operations\
    \ are executed sequentially, but the code reads almost like synchronous code.\n\
    \n### Error Handling with try...catch\n\nError handling in `async/await` functions\
    \ is done using the standard `try...catch` statement. Any errors that occur during\
    \ the execution of the `async` function, including rejected `Promises`, will be\
    \ caught by the `catch` block.\n\n```javascript\nasync function fetchDataWithError()\
    \ {\n  try {\n    const data = await new Promise((resolve, reject) => {\n    \
    \  setTimeout(() => {\n        reject(\"Failed to fetch data!\");\n      }, 1000);\n\
    \    });\n    return data;\n  } catch (error) {\n    console.error(\"Caught an\
    \ error:\", error); // Output: Caught an error: Failed to fetch data!\n  }\n}\n\
    \nfetchDataWithError();\n```\n\n## Benefits of async/await\n\n- **Improved Readability**:\
    \ `async/await` makes asynchronous code look and behave more like synchronous\
    \ code, making it much easier to read and understand.\n- **Simplified Error Handling**:\
    \ Error handling is done using standard `try...catch` blocks, which are familiar\
    \ to most developers.\n- **Easier Debugging**: Debugging `async/await` code is\
    \ often easier than debugging complex Promise chains, as the execution flow is\
    \ more straightforward.\n- **Concise Syntax**: `async/await` reduces boilerplate\
    \ code compared to Promise chaining.\n\n`async/await` is a powerful tool for writing\
    \ asynchronous JavaScript code. It significantly improves code readability, maintainability,\
    \ and developer experience. It is now the preferred way to handle asynchronous\
    \ operations in modern JavaScript development. It works seamlessly with promises\
    \ and provides a clean and efficient way to manage complex asynchronous workflows.\n\
    \n## Did You Know? The problem of \"callback hell\" and how Promises and async/await\
    \ solve it.\n\nIn the early days of asynchronous JavaScript programming, callbacks\
    \ were the primary mechanism for handling operations that didn't complete immediately.\
    \ While callbacks are a fundamental concept and still relevant in some contexts,\
    \ they can lead to a phenomenon known as \"callback hell\" or the \"pyramid of\
    \ doom,\" particularly when dealing with multiple dependent asynchronous operations.\n\
    \n### The Callback Hell Scenario\n\nCallback hell arises when you have several\
    \ asynchronous operations that need to be executed in a specific sequence, with\
    \ each subsequent operation depending on the result of the previous one. This\
    \ leads to deeply nested callback functions, making the code difficult to read,\
    \ understand, and maintain.\n\nConsider a simplified example of fetching data\
    \ from multiple APIs, where each API call depends on the result of the previous\
    \ one:\n\n```javascript\ngetDataFromAPI1(function(data1) {\n  processData1(data1,\
    \ function(processedData1) {\n    getDataFromAPI2(processedData1, function(data2)\
    \ {\n      processData2(data2, function(processedData2) {\n        getDataFromAPI3(processedData2,\
    \ function(data3) {\n          // And so on...\n          console.log(\"Final\
    \ data:\", data3);\n        });\n      });\n    });\n  });\n});\n```\n\nAs you\
    \ can see, the code quickly becomes indented and nested, resembling a pyramid\
    \ or an inverted Christmas tree. This nesting makes it hard to follow the flow\
    \ of execution and makes error handling particularly challenging.\n\n### Problems\
    \ with Callback Hell:\n\n- **Reduced Readability**: The deeply nested structure\
    \ makes it difficult to understand the code's logic at a glance.\n"
  raw: 'It''s important to handle errors properly in Promise chains. If an error occurs
    in any of the .then()handlers, it will propagate down the chain until it is caught
    by a catch()handler. It is best practice to place a catch() handler at the end
    of the chain to handle any potential errors.


    Promise.all() and Promise.race()


    JavaScript provides two useful methods for working with multiple Promises:


    ​● ​Promise.all(promises): This method takes an array of Promises as an argument
    and returns a new Promise that resolves when all of the input Promises have resolved.1 If
    any of the input Promises are rejected, the returned Promise is immediately rejected
    with the rejection reason of the first rejected Promise.


    JavaScript


    const promise1 = Promise.resolve(3);


    const promise2 = 42;


    constpromise3 = new Promise((resolve, reject) => {


    setTimeout(resolve, 100, ''foo'');


    });


    Promise.all([promise1, promise2, promise3]).then((values) => {


    console.log(values); // expected output: Array [3, 42, "foo"]


    });


    ​● ​Promise.race(promises):2 This method also takes an array of Promises as an
    argument, but it returns a new Promise that resolves or rejects as soon as the
    first of the input Promises resolves or rejects.


    JavaScript


    constpromise1 = new Promise((resolve, reject) => {


    setTimeout(resolve, 500, ''one'');


    });


    constpromise2 = new Promise((resolve, reject) => {


    setTimeout(resolve, 100, ''two'');


    });


    Promise.race([promise1, promise2]).then((value) => {


    console.log(value); // "two"


    // Both resolve, but promise2 is faster


    });


    Promises provide a significant improvement over callbacks for handling asynchronous
    operations in JavaScript. They make asynchronous code more readable, maintainable,
    and easier to reason about, especially when dealing with complex asynchronous
    workflows. They are a fundamental concept in modern JavaScript development.


    ### Async/Await: Simplifying Asynchronous Code


    While Promises provide a substantial improvement over callbacks for handling asynchronous
    operations, working with complex Promise chains can still become somewhat cumbersome.
    ES8 (ECMAScript 2017) introduced asyncand await keywords, which build on top of
    Promises and provide an even more elegant and readable way to write asynchronous
    code. They make asynchronous code look and behave a bit more like synchronous
    code, making it easier to understand and reason about.


    async Functions


    The asynckeyword is used to define an asynchronous function. When you declare
    a function as async, it implicitly returns a Promise. If the function returns
    a value, the Promise resolves with that value. If the function throws an error,
    the Promise1 rejects with that error.


    JavaScript


    async  function  myAsyncFunction() {


    return  "Hello from async function!";


    }


    myAsyncFunction().then(value => {


    console.log(value); // Output: Hello from async function!


    });


    async  function  myAsyncErrorFunction() {


    throw  new  Error(''This is an error'')


    }


    myAsyncErrorFunction().catch(error => {


    console.log(error) // Output: Error: This is an error


    })


    await Operator


    The awaitkeyword is used inside asyncfunctions to pause the execution of the function
    until a Promise resolves. The awaitoperator can only be used inside async functions.


    JavaScript


    async  function  fetchData() {


    const promise = new  Promise((resolve, reject) => {


    setTimeout(() => {


    resolve("Data fetched!");


    }, 1000);


    });


    constdata = awaitpromise; // Pause execution until the promise resolves


    console.log(data); // Output: Data fetched!


    return data;


    }


    fetchData();


    In this example, the awaitkeyword pauses the execution of the fetchData()function
    until the promiseresolves. Once the promise resolves, the value is assigned to
    the data variable, and the function continues executing.


    Combining async and await with Promises


    asyncand await work seamlessly with Promises, making it much easier to handle
    asynchronous operations. Consider the previous example of fetching data from multiple
    URLs using Promise chaining:


    JavaScript


    function  fetchData(url) {


    return  new  Promise((resolve, reject) => {


    setTimeout(() => {


    constdata = `Data from ${url}`;


    resolve(data);


    }, 1000);


    });


    }


    async  function  fetchMultipleData() {


    try {


    const data1 = await fetchData("url1");


    console.log("Received:", data1);


    const data2 = await fetchData("url2");


    console.log("Received:", data2);


    const data3 = await fetchData("url3");


    console.log("Received:", data3);


    return [data1, data2, data3]


    } catch (error) {


    console.error("Error:", error);


    }


    }


    fetchMultipleData().then(data => console.log(data));


    This code is much cleaner and easier to read than the equivalent code using Promise
    chaining. The asynchronous operations are executed sequentially, but the code
    reads almost like synchronous code.


    Error Handling with try...catch


    Error handling in async/awaitfunctions is done using the standard try...catchstatement.
    Any errors that occur during the execution of the asyncfunction, including rejected
    Promises, will be caught by the catch block.


    JavaScript


    async  function  fetchDataWithError() {


    try {


    const data = await  new  Promise((resolve, reject) => {


    setTimeout(() => {


    reject("Failed to fetch data!");


    }, 1000);


    });


    return data;


    } catch (error) {


    console.error("Caught an error:", error); // Output: Caught an error: Failed to
    fetch data!


    }


    }


    fetchDataWithError();


    Benefits of async/await


    ​● ​Improved Readability: async/await makes asynchronous code look and behave
    more like synchronous code, making it much easier to read and understand.


    ​● ​Simplified Error Handling:Error handling is done using standard try...catch blocks,
    which are familiar to most developers.


    ​● ​Easier Debugging:Debugging async/await code is often easier than debugging
    complex Promise chains, as the execution flow is more straightforward.


    ​● ​Concise Syntax: async/await reduces boilerplate code compared to Promise chaining.


    async/await is a powerful tool for writing asynchronous JavaScript code. It significantly
    improves code readability, maintainability, and developer experience. It is now
    the preferred way to handle asynchronous operations in modern JavaScript development.
    It works seamlessly with promises and provides a clean and efficient way to manage
    complex asynchronous workflows.


    ### Did You Know? The problem of "callback hell" and how Promises and async/await
    solve it.


    In the early days of asynchronous JavaScript programming, callbacks were the primary
    mechanism for handling operations that didn''t complete immediately. While callbacks
    are a fundamental concept and still relevant in some contexts, they can lead to
    a phenomenon known as "callback hell" or the "pyramid of doom," particularly when
    dealing with multiple dependent asynchronous operations.


    The Callback Hell Scenario


    Callback hell arises when you have several asynchronous operations that need to
    be executed in a specific sequence, with each subsequent operation depending on
    the result of the previous one. This leads to deeply nested callback functions,
    making the code difficult to read, understand, and maintain.


    Consider a simplified example of fetching data from multiple APIs, where each
    API call depends on the result of the previous one:


    JavaScript


    getDataFromAPI1(function(data1) {


    processData1(data1, function(processedData1) {


    getDataFromAPI2(processedData1, function(data2) {


    processData2(data2, function(processedData2) {


    getDataFromAPI3(processedData2, function(data3) {


    // And so on...


    console.log("Final data:", data3);


    });


    });


    });


    });


    });


    As you can see, the code quickly becomes indented and nested, resembling a pyramid
    or an inverted Christmas tree. This nesting makes it hard to follow the flow of
    execution and makes error handling particularly challenging.


    Problems with Callback Hell:


    ​● ​Reduced Readability: The deeply nested structure makes it difficult to understand
    the code''s logic at a glance.'
