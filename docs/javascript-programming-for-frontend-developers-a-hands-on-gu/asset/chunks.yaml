  trans: "\n\n- `4xx (客户端错误)`: 请求包含错误的语法，或无法执行（例如：`400 Bad Request`、`404 Not Found`）。\n\
    - `5xx (服务器错误)`: 服务器未能执行看似有效的请求（例如：`500 Internal Server Error`、`503 Service Unavailable`）。\n\
    \n了解这些状态码对于理解错误的本质以及采取适当措施至关重要。\n\n## 使用 Fetch 进行错误处理\n\nFetch 使用 `Promises`，因此错误处理通常通过\
    \ `.catch()` 块完成。然而，Fetch 的 `.catch()` 只处理网络错误。它不处理 HTTP 错误状态码（`4xx` 和 `5xx`）。要处理这些错误，你需要检查\
    \ `response.ok` 属性。\n\n这是一个示例：\n\n```javascript\nfetch('https://api.example.com/nonexistent-resource')\n\
    \  .then(response => {\n    if (!response.ok) {\n      // 检查 HTTP 错误状态码 (4xx 或\
    \ 5xx)\n      throw new Error(`HTTP error! status: ${response.status}`);\n   \
    \ }\n    return response.json();\n  })\n  .then(data => {\n    console.log('Data:',\
    \ data);\n  })\n  .catch(error => {\n    console.error('Fetch error:', error);\
    \ // 同时捕获网络错误和 HTTP 错误\n  });\n```\n\n在这个示例中，如果服务器返回 `404 Not Found`，`response.ok`\
    \ 属性将为 `false`，并抛出一个错误。该错误会被 `.catch()` 块捕获。\n\n## 使用 Axios 进行错误处理\n\nAxios 提供了更健壮的错误处理。当请求接收到\
    \ HTTP 错误状态码（`2xx` 范围之外）时，Axios 会拒绝 `Promise` 并返回一个包含更多信息的错误对象，包括状态码、响应数据（可用）和请求配置。\n\
    \n以下是使用 Axios 处理错误的方法：\n\n```javascript\naxios.get('https://api.example.com/nonexistent-resource')\n\
    \  .then(response => {\n    console.log('Data:', response.data);\n  })\n  .catch(error\
    \ => {\n    if (error.response) {\n      // 请求已发送，服务器返回了超出 2xx 范围的状态码\n      console.error('Response\
    \ Error:', error.response.status);\n      console.error('Response Data:', error.response.data);\n\
    \      console.error('Response Headers:', error.response.headers);\n    } else\
    \ if (error.request) {\n      // 请求已发送但未收到响应\n      // `error.request` 在浏览器中是\
    \ XMLHttpRequest 的实例，\n      // 在 node.js 中是 http.ClientRequest 的实例\n      console.error('Request\
    \ Error:', error.request);\n    } else {\n      // 设置请求时触发了错误\n      console.error('Error',\
    \ error.message);\n    }\n    console.error('Config:', error.config);\n  });\n\
    ```\n\nAxios 提供了 `error.response` 属性所需的服务器响应详情（状态、数据、头部）。如果请求从未到达服务器（例如：网络错误），则\
    \ `error.request` 可用。最后，`error.message` 将包含更通用的错误信息。这些详细的错误信息使得调试变得简单得多。\n\n##\
    \ 处理不同的错误场景\n\n- **网络错误**: 当客户端无法连接到服务器时发生（例如：无网络连接）。使用 Fetch 时，这些错误会被 `.catch()`\
    \ 块捕获。使用 Axios 时，`error.request` 将存在。\n- **404 Not Found**: 表示请求的资源在服务器上不存在。\n\
    - **400 Bad Request**: 通常意味着请求中发送的数据存在问题。\n- **500 Internal Server Error**: 表示服务器端存在问题。\n\
    - **频率限制错误**: 许多 API 都有频率限制。如果你超过了限制，API 将返回特定的错误（通常是 `429 Too Many Requests`\
    \ 状态码）。你应该实现逻辑来处理这些错误，例如在重试请求之前等待。\n\n## 边缘情况与防御性编程\n\n除了标准的 HTTP 错误之外，你还应该考虑边缘情况：\n\
    \n- **意外的数据格式**: 即使请求成功，API 也可能返回意外格式的数据。你应该验证接收到的数据，以避免应用程序中出现错误。\n- **超时**:\
    \ 请求有时需要很长时间才能完成。实现超时可以防止应用程序无限挂起。Axios 具有内置的超时功能。\n- **重试**: 对于瞬态错误（如临时网络问题），实现自动重试可以提高可靠性。Axios\
    \ 库可以提供这类帮助。\n\n## 错误处理最佳实践\n\n- **提供用户友好的消息**: 向用户显示具有启发性的错误信息，同时不要暴露敏感信息。\n\
    - **记录日志**: 在服务器端记录错误以便进行调试和监控。\n- **优雅地处理错误**: 防止错误导致应用程序崩溃。\n- **测试错误处理**: 彻底测试你的错误处理逻辑，以确保其按预期工作。\n\
    \n通过实现健壮的错误处理并考虑边缘情况，你可以创建出更可靠、更易用的应用程序，使其能够与 API 无缝交互，即使情况并不完全符合预期。本节为你提供了工具，以创建能够正确响应各种\
    \ API 问题的。。\n\n 你知道吗？RESTful API 设计原则及其重要性\n\n在讨论 API 时，“RESTful”一词经常出现。REST 代表“表述状态传递”（Representational\
    \ State Transfer），是一种用于设计网络应用程序的架构风格。虽然并不是所有的 API 都严格遵守每一项 REST 原则，但理解它们对于处理现代\
    \ Web 服务至关重要。\n\nREST 不是像 HTTP 那样的协议；它是一组指南。遵循这些指南的 API 被认为是 RESTful。以下是核心原则：\n\
    \n- **客户端-服务器**: 该原则将用户界面（客户端）与数据存储和逻辑（服务器）分离。这种分离提高了可移植性、可扩展性，并允许客户端和服务器独立演进。\n\
    - **无状态**: 从客户端到服务器的每个请求必须包含理解和处理该请求所需的所有。服务器在请求之间不存储任何客户端上下文。这简化了服务器设计并提高了可扩展性。\n\
    - **可缓存**: 服务器的响应应该是可以被客户端或中间件（如代理）缓存的。这减少了服务器负载并提高了性能。HTTP 提供了缓存机制，例如 `Cache-Control`\
    \ 头部。\n- **统一接口**: 这是最重要的原则，包含了几个子约束：\n    - **资源标识**: 每个资源（数据实体）都通过唯一的 URL 标识。\n\
    \    - **表述**: 资源以各种格式（例如 JSON、XML）表示出来。客户端和服务器交换的是资源的表述，而不是资源本身。\n    - **自描述消息**:\
    \ 消息包含理解如何处理它们的信息。这包括媒体类型（例如 `application/json`）和超媒体链接。\n    - **超媒体作为应用状态引擎 (HATEOSAS)**:\
    \ 该原则规定 API 应在其响应中提供链接，引导客户端执行可用操作。这使得 API 更具可发现性并减少了客户端与服务器之间的耦合。\n- **分层系统**:\
    \ 中间服务器（如代理和负载均衡器）可以位于客户端和服务器之间，而客户端或服务器感知。这提高了可扩展性和安全性。\n- **按需代码（可选）**: 服务器可以通过传输可执行代码（如\
    \ JavaScript）来扩展客户端功能。这在现代 RESTful API 中并不常见。\n\n## 为什么 REST 原则很重要？\n\n遵循 REST\
    \ 原则有许多益处：\n\n- **可扩展性**: RESTful API 的无状态使得扩展服务器基础设施变得更容易。\n- **灵活性**: 客户端和服务器分离允许独立开发和演进。\n\
    - **简单性**: 统一接口使得 API 更容易理解和使用。\n- **可缓存性**: 缓存提高了性能并减轻服务器负载。\n- **互操作性**: RESTful\
    \ API 可以由不同编程语言编写的客户端访问。\n\n"
- fmt: "\n# How REST Relates to HTTP Methods and Status Codes\n\nRESTful APIs map\
    \ HTTP methods to operations on resources:\n\n- `GET`: Retrieves a resource.\n\
    - `POST`: Creates a new resource.\n- `PUT`: Updates an existing resource.\n- `DELETE`:\
    \ Deletes a resource.\n\nRESTful APIs also use HTTP status codes to indicate the\
    \ outcome of requests. For example:\n\n- `200 OK`: Successful request.\n- `201\
    \ Created`: Resource created successfully (used with `POST`).\n- `204 No Content`:\
    \ Request successful, but no content to return.\n- `400 Bad Request`: Client-side\
    \ error (e.g., invalid data).\n- `404 Not Found`: Resource not found.\n- `500\
    \ Internal Server Error`: Server-side error.\n\nBy adhering to RESTful principles,\
    \ API developers create services that are easier to use, scale, and maintain.\
    \ As a frontend developer working with APIs, understanding these principles helps\
    \ you interact with these services more effectively.\n\n## Chapter 6: Introduction\
    \ to jQuery (Focused Usage)\n\n### jQuery Selectors and DOM Manipulation\n\njQuery,\
    \ once the dominant force in front-end development, has seen its usage evolve\
    \ as modern JavaScript and frameworks have matured. However, jQuery remains a\
    \ valuable tool for certain tasks, particularly DOM manipulation and simplifying\
    \ cross-browser compatibility. This chapter focuses on using jQuery strategically,\
    \ emphasizing its strengths where it provides clear advantages.\n\n#### Understanding\
    \ jQuery Selectors\n\njQuery's powerful selectors are one of its most enduring\
    \ features. They provide a concise and expressive way to select HTML elements\
    \ on a page. jQuery selectors use a syntax similar to CSS selectors, making them\
    \ easy to learn for anyone familiar with web styling.\n\nHere are some common\
    \ jQuery selectors:\n\n- **Element Selectors**: Select elements by their tag name.\
    \ For example, `$('p')` selects all `<p>` elements on the page.\n- **ID Selectors**:\
    \ Select an element by its ID. For example, `$('#my-element')` selects the element\
    \ with the ID `my-element`.\n- **Class Selectors**: Select elements by their class\
    \ name. For example, `$('.my-class')` selects all elements with the class `my-class`.\n\
    - **Attribute Selectors**: Select elements based on their attributes. For example,\
    \ `$('a[href]')` selects all `<a>` elements with an `href` attribute.\n- **Universal\
    \ Selector**: Selects all elements. For example, `$(*)` selects all elements on\
    \ the page.\n- **Combined Selectors**: Combine selectors to create more specific\
    \ selections. For example, `$('div.container p')` selects all `<p>` elements that\
    \ are descendants of a `<div>` with the class `container`.\n\nHere’s an example\
    \ of how to use jQuery selectors:\n\n```javascript\n// Select all paragraphs and\
    \ change their text color to blue\n$('p').css('color', 'blue');\n\n// Select the\
    \ element with the ID \"my-heading\" and change its font size\n$('#my-heading').css('font-size',\
    \ '2em');\n\n// Select all links with the class \"external\" and add a target=\"\
    _blank\" attribute\n$('a.external').attr('target', '_blank');\n```\n\nThese examples\
    \ demonstrate the conciseness and readability of jQuery selectors.\n\n#### DOM\
    \ Manipulation with jQuery\n\njQuery simplifies common DOM manipulation tasks,\
    \ making it easier to add, remove, and modify elements on a page.\n\nHere are\
    \ some common jQuery DOM manipulation methods:\n\n- `html()`: Gets or sets the\
    \ HTML content of an element.\n- `text()`: Gets or sets the text content of an\
    \ element.\n- `attr()`: Gets or sets an attribute of an element.\n- `addClass()`:\
    \ Adds one or more classes to an element.\n- `removeClass()`: Removes one or more\
    \ classes from an element.\n- `append()`: Appends content to the end of an element.\n\
    - `prepend()`: Prepends content to the beginning of an element.\n- `remove()`:\
    \ Removes an element from the DOM.\n- `val()`: Gets or sets the value of form\
    \ elements.\n\nHere are some examples:\n\n```javascript\n// Set the HTML content\
    \ of a div\n$('#my-div').html('<p>New paragraph</p>');\n\n// Add a class to a\
    \ button\n$('#my-button').addClass('active');\n\n// Remove an element\n$('.remove-me').remove();\n\
    \n// Get the value of an input field\nconst inputValue = $('#my-input').val();\n\
    ```\n\nThese methods provide a convenient way to manipulate the DOM without writing\
    \ verbose JavaScript code.\n\n#### Working with Traversing Methods\n\njQuery provides\
    \ several methods for traversing the DOM tree, allowing you to easily navigate\
    \ between parent, child, and sibling elements.\n\nSome useful traversal methods\
    \ include:\n\n- `parent()`: Gets the parent of each element in the set of matched\
    \ elements.\n- `children()`: Gets the children of each element in the set of matched\
    \ elements.\n- `find()`: Gets the descendants of each element in the set of matched\
    \ elements, filtered by a selector.\n- `siblings()`: Gets the siblings of each\
    \ element in the set of matched elements.\n- `next()`: Gets the immediately following\
    \ sibling of each element in the set of matched elements.\n- `prev()`: Gets the\
    \ immediately preceding sibling of each element in the set of matched elements.\n\
    \nExample:\n\n```javascript\n// Find all list items inside an unordered list with\
    \ the ID \"my-list\"\n$('#my-list').find('li').css('font-weight', 'bold');\n\n\
    // Get the parent of a button\n$('#my-button').parent().css('background-color',\
    \ 'lightgray');\n```\n\n#### Practical Applications and Considerations\n\nWhile\
    \ modern JavaScript offers comparable functionality for many DOM manipulation\
    \ tasks, jQuery can still be useful in specific scenarios:\n\n- **Legacy Projects**:\
    \ If you're working on a project that already uses jQuery, it might be more efficient\
    \ to continue using it for DOM manipulation rather than refactoring everything\
    \ to plain JavaScript.\n- **Simplified Syntax for Complex DOM Operations**: For\
    \ complex DOM manipulations, jQuery's concise syntax can sometimes be easier to\
    \ write and read than equivalent plain JavaScript.\n- **Cross-Browser Compatibility\
    \ (Less Relevant Now)**: jQuery historically handled cross-browser inconsistencies.\
    \ Modern browsers have largely converged on standards, making this less of a concern.\n\
    \nIt's important to be mindful of jQuery's file size. If you're only using a few\
    \ of its features, it might be more efficient to use plain JavaScript or a smaller\
    \ utility library.\n\n### Event Handling with jQuery\n\nHandling user interactions\
    \ is a fundamental aspect of web development. jQuery simplifies event handling,\
    \ providing a consistent and concise way to attach event listeners to DOM elements.\n\
    \n#### Basic Event Handling\n\njQuery provides several methods for attaching event\
    \ handlers. The most common is the `.on()` method, which is the preferred way\
    \ to attach event listeners in modern jQuery.\n\nHere’s the basic syntax:\n\n\
    ```javascript\n$(selector).on(event, handler);\n```\n\n- `selector`: The jQuery\
    \ selector that targets the element(s) to which the event handler will be attached.\n\
    - `event`: The name of the event (e.g., `click`, `mouseover`, `submit`).\n- `handler`:\
    \ The function that will be executed when the event occurs.\n\nHere are a few\
    \ examples:\n\n```javascript\n// Attach a click handler to a button\n$('#my-button').on('click',\
    \ function() {\n  alert('Button clicked!');\n});\n\n// Attach a mouseover handler\
    \ to a paragraph\n$('p').on('mouseover', function() {\n  $(this).css('background-color',\
    \ 'lightgray');\n});\n\n// Attach a mouseout handler to the same paragraph\n$('p').on('mouseout',\
    \ function() {\n  $(this).css('background-color', ''); // Reset background color\n\
    });\n```\n\nThe `this` keyword inside the event handler refers to the element\
    \ that triggered the event.\n\njQuery also provides shorthand methods for common\
    \ events, such as `.click()`, `.mouseover()`, `.mouseout()`, `.submit()`, etc.\
    \ While these shorthand methods are still functional, `.on()` is generally preferred\
    \ because it’s more versatile.\n\nExample using the shorthand `.click()`:\n\n\
    ```javascript\n$('#my-button').click(function() {\n  alert('Button clicked (using\
    \ shorthand)!');\n});\n```\n\n#### Event Delegation\n"
  raw: 'How REST Relates to HTTP Methods and Status Codes


    RESTful APIs map HTTP methods to operations on resources:


    ​● ​GET: Retrieves a resource.


    ​● ​POST: Creates a new resource.


    ​● ​PUT: Updates an existing resource.


    ​● ​DELETE: Deletes a resource.


    RESTful APIs also use HTTP status codes to indicate the outcome of requests. For
    example:


    ​● ​200 OK: Successful request.


    ​● ​201 Created: Resource created successfully (used with POST).


    ​● ​204 No Content: Request successful, but no content to return.


    ​● ​400 Bad Request: Client-side error (e.g., invalid data).


    ​● ​404 Not Found: Resource not found.


    ​● ​500 Internal Server Error: Server-side error.


    By adhering to RESTful principles, API developers create services that are easier
    to use, scale, and maintain. As a frontend developer working with APIs, understanding
    these principles helps you interact with these services more effectively.


    ## Chapter 6: Introduction to jQuery (Focused Usage)


    ### jQuery Selectors and DOM Manipulation


    jQuery, once the dominant force in front-end development, has seen its usage evolve
    as modern JavaScript and frameworks have matured. However, jQuery remains a valuable
    tool for certain tasks, particularly DOM manipulation and simplifying cross-browser
    compatibility. This chapter focuses on using jQuery strategically, emphasizing
    its strengths where it provides clear advantages.


    Understanding jQuery Selectors


    jQuery''s powerful selectors are one of its most enduring features. They provide
    a concise and expressive way to select HTML elements on a page. jQuery selectors
    use a syntax similar to CSS selectors, making them easy to learn for anyone familiar
    with web styling.


    Here are some common jQuery selectors:


    ​● ​Element Selectors:Select elements by their tag name. For example, $(''p'')selects
    all <p> elements on the page.


    ​● ​ID Selectors:Select an element by its ID. For example, $(''#my-element'')selects
    the element with the ID my-element.


    ​● ​Class Selectors:Select elements by their class name. For example, $(''.my-class'')selects
    all elements with the class my-class.


    ​● ​Attribute Selectors:Select elements based on their attributes. For example,
    $(''a[href]'')selects all <a>elements with an href attribute.


    ​● ​Universal Selector:Selects all elements. For example, $(*) selects all elements
    on the page.


    ​● ​Combined Selectors:Combine selectors to create more specific selections. For
    example, $(''div.container p'')selects all <p>elements that are descendants of
    a <div>with the class container.


    Here’s an example of how to use jQuery selectors:


    JavaScript


    // Select all paragraphs and change their text color to blue


    $(''p'').css(''color'', ''blue'');


    // Select the element with the ID "my-heading" and change its font size


    $(''#my-heading'').css(''font-size'', ''2em'');


    // Select all links with the class "external" and add a target="_blank" attribute


    $(''a.external'').attr(''target'', ''_blank'');


    These examples demonstrate the conciseness and readability of jQuery selectors.


    DOM Manipulation with jQuery


    jQuery simplifies common DOM manipulation tasks, making it easier to add, remove,
    and modify elements on a page.


    Here are some common jQuery DOM manipulation methods:


    ​● ​html(): Gets or sets the HTML content of an element.


    ​● ​text(): Gets or sets the text content of an element.


    ​● ​attr(): Gets or sets an attribute of an element.


    ​● ​addClass(): Adds one or more classes to an element.


    ​● ​removeClass(): Removes one or more classes from an element.


    ​● ​append(): Appends content to the end of an element.


    ​● ​prepend(): Prepends content to the beginning of an element.


    ​● ​remove(): Removes an element from the DOM.


    ​● ​val(): Gets or sets the value of form elements.


    Here are some examples:


    JavaScript


    // Set the HTML content of a div


    $(''#my-div'').html(''<p>New paragraph</p>'');


    // Add a class to a button


    $(''#my-button'').addClass(''active'');


    // Remove an element


    $(''.remove-me'').remove();


    // Get the value of an input field


    const inputValue = $(''#my-input'').val();


    These methods provide a convenient way to manipulate the DOM without writing verbose
    JavaScript code.


    Working with Traversing Methods


    jQuery provides several methods for traversing the DOM tree, allowing you to easily
    navigate between parent, child, and sibling elements.


    Some useful traversal methods include:


    ​● ​parent(): Gets the parent of each element in the set of matched elements.


    ​● ​children(): Gets the children of each element in the set of matched elements.


    ​● ​find(): Gets the descendants of each element in the set of matched elements,
    filtered by a selector.


    ​● ​siblings(): Gets the siblings of each element in the set of matched elements.


    ​● ​next(): Gets the immediately following sibling of each element in the set
    of matched elements.


    ​● ​prev(): Gets the immediately preceding sibling of each element in the set
    of matched elements.


    Example:


    JavaScript


    // Find all list items inside an unordered list with the ID "my-list"


    $(''#my-list'').find(''li'').css(''font-weight'', ''bold'');


    // Get the parent of a button


    $(''#my-button'').parent().css(''background-color'', ''lightgray'');


    Practical Applications and Considerations


    While modern JavaScript offers comparable functionality for many DOM manipulation
    tasks, jQuery can still be useful in specific scenarios:


    ​● ​Legacy Projects: If you''re working on a project that already uses jQuery,
    it might be more efficient to continue using it for DOM manipulation rather than
    refactoring everything to plain JavaScript.


    ​● ​Simplified Syntax for Complex DOM Operations: For complex DOM manipulations,
    jQuery''s concise syntax can sometimes be easier to write and read than equivalent
    plain JavaScript.


    ​● ​Cross-Browser Compatibility (Less Relevant Now): jQuery historically handled
    cross-browser inconsistencies. Modern browsers have largely converged on standards,
    making this less of a concern.


    It''s important to be mindful of jQuery''s file size. If you''re only using a
    few of its features, it might be more efficient to use plain JavaScript or a smaller
    utility library.


    ### Event Handling with jQuery


    Handling user interactions is a fundamental aspect of web development. jQuery
    simplifies event handling, providing a consistent and concise way to attach event
    listeners to DOM elements.


    Basic Event Handling


    jQuery provides several methods for attaching event handlers. The most common
    is the .on() method, which is the preferred way to attach event listeners in modern
    jQuery.


    Here’s the basic syntax:


    JavaScript


    $(selector).on(event, handler);


    ​● ​selector: The jQuery selector that targets the element(s) to which the event
    handler will be attached.


    ​● ​event: The name of the event (e.g., click, mouseover, submit).


    ​● ​handler: The function that will be executed when the event occurs.


    Here are a few examples:


    JavaScript


    // Attach a click handler to a button


    $(''#my-button'').on(''click'', function() {


    alert(''Button clicked!'');


    });


    // Attach a mouseover handler to a paragraph


    $(''p'').on(''mouseover'', function() {


    $(this).css(''background-color'', ''lightgray'');


    });


    // Attach a mouseout handler to the same paragraph


    $(''p'').on(''mouseout'', function() {


    $(this).css(''background-color'', ''''); // Reset background color


    });


    The this keyword inside the event handler refers to the element that triggered
    the event.


    jQuery also provides shorthand methods for common events, such as .click(), .mouseover(),
    .mouseout(), .submit(), etc. While these shorthand methods are still functional,
    .on() is generally preferred because it’s more versatile.


    Example using the shorthand .click():


    JavaScript


    $(''#my-button'').click(function() {


    alert(''Button clicked (using shorthand)!'');


    });


    Event Delegation'
