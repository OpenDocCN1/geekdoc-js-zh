  trans: "\n\n# REST 如何与 HTTP 方法和状态码相关\n\nRESTful API 将 HTTP 方法映射到资源上的操作：\n\n- `GET`:\
    \ 获取资源。\n- `POST`: 创建新资源。\n- `PUT`: 更新现有资源。\n- `DELETE`: 删除资源。\n\nRESTful API\
    \ 同样使用 HTTP 状态码来指示请求的结果。例如：\n\n- `200 OK`: 请求成功。\n- `201 Created`: 资源创建成功（配合 `POST`\
    \ 使用）。\n- `204 No Content`: 请求成功，但没有内容要返回。\n- `400 Bad Request`: 客户端错误（例如：无效数据）。\n\
    - `404 Not Found`: 未找到资源。\n- `500 Internal Server Error`: 服务器端错误。\n\n通过遵循 RESTful\
    \ 原则，API 开发者可以创建出更易使用、扩展和维护的服务。作为一名与 API 打交的前端开发人员，理解这些原则有助于你更有效地与这些服务交互。\n\n\
    ## 第 6 章：jQuery 简介（侧重用法）\n\n### jQuery 选择器与 DOM 操作\n\njQuery 曾是前端开发的主导力量，随着现代\
    \ JavaScript 和框架的成熟，其用途也发生了演变。然而，jQuery 在某些任务中仍然非常有价值，特别是在 DOM 操作和简化跨浏览器兼容性方面。本章重点关注如何策略性地使用\
    \ jQuery，强调其提供明显优势的领域。\n\n#### 理解 jQuery 选择器\n\njQuery 强大的选择器是其最持久的特性之一。它们提供了一种简洁且丰富的方式来选择页面上的\
    \ HTML 元素。jQuery 选择器使用类似于 CSS 选择器的语法，使得任何熟悉网页样式的人都易于学习。\n\n是一些常见的 jQuery 选择器：\n\
    \n- **元素选择器 (Element Selectors)**：通过标签名选择元素。例如，`$('p')` 选择页面所有的 `<p>` 元素。\n- **ID\
    \ 选择器 (ID Selectors)**：通过 ID 选择元素。例如，`$('#my-element')` 选择 ID 为 `my-element` 的元素。\n\
    - **类选择器 (Class Selectors)**：通过类名选择元素。例如，`$('.my-class')` 选择所有类名为 `my-class` 的元素。\n\
    - **属性选择器 (Attribute Selectors)**：根据属性选择元素。例如，`$('a[href]')` 选择所有带有 `href` 属性的\
    \ `<a>` 元素。\n- **通选择器 (Universal Selector)**：选择所有元素。例如，`$(*)` 选择页面上的所有元素。\n- **组合选择器\
    \ (Combined Selectors)**：组合选择器以创建更特定的选择。例如，`$('div.container p')` 选择所有类为 `container`\
    \ 的 `<div>` 后代的 `<p>` 元素。\n\n以下是如何使用 jQuery 选择器的示例：\n\n```javascript\n// 选择所有段落并将文本颜色改为蓝色\n\
    $('p').css('color', 'blue');\n\n// 选择 ID 为 \"my-heading\" 的元素并更改其字体大小\n$('#my-heading').css('font-size',\
    \ '2em');\n\n// 选择类名为 \"external\" 的链接并添加 target=\"_blank\" 属性\n$('a.external').attr('target',\
    \ '_blank');\n```\n\n这些示例展示了 jQuery 选择器的简洁性和可读性。\n\n#### 使用 jQuery 进行 DOM 操作\n\
    \njQuery 简化了常见的 DOM 操作任务，使得在页面上添加、删除和修改元素变得更加容易。\n\n是一些常见的 jQuery DOM 操作方法：\n\n\
    - `html()`：获取或设置元素的 HTML 内容。\n- `text()`：获取或设置元素的文本内容。\n- `attr()`：获取或设置元素的属性。\n\
    - `addClass()`：为元素添加一个或多个类。\n- `removeClass()`：从元素中移除一个或多个类。\n- `append()`：将内容附加到元素的末尾。\n\
    - `prepend()`：将内容插入到元素的开头。\n- `remove()`：从 DOM 中移除元素。\n- `val()`：获取或设置表单元素的值。\n\
    \n是一些示例：\n\n```javascript\n// 设置 div 的 HTML 内容\n$('#my-div').html('<p>新段落</p>');\n\
    \n// 给按钮添加一个类\n$('#my-button').addClass('active');\n\n// 移除元素\n$('.remove-me').remove();\n\
    \n// 获取输入字段的值\nconst inputValue = $('#my-input').val();\n```\n\n这些方法提供了一种方便的方式来操作\
    \ DOM，而无需编写冗长的 JavaScript 代码。\n\n#### 使用遍历方法工作\n\njQuery 提供了几种用于遍历 DOM 树的方法，允许你轻松在父元素、子元素和兄弟元素之间导航。\n\
    \n一些实用的遍历方法包括：\n\n- `parent()`：获取匹配元素集中每个元素的父元素。\n- `children()`：获取匹配元素集中每个元素的子元素。\n\
    - `find()`：获取匹配元素集中每个元素的后代，并通过选择器进行过滤。\n- `siblings()`：获取匹配元素集中每个元素的兄弟元素。\n- `next()`：获取匹配元素集中每个元素紧随其兄弟元素。\n\
    - `prev()`：获取匹配元素集中每个元素上一个兄弟元素。\n\n示例：\n\n```javascript\n// 在 ID 为 \"my-list\"\
    \ 的无序列表中查找所有的列表项\n$('#my-list').find('li').css('font-weight', 'bold');\n\n// 获取按钮的父元素\n\
    $('#my-button').parent().css('background-color', 'lightgray');\n```\n\n#### 实际应用与考虑\n\
    \n虽然现代 JavaScript 为许多 DOM 操作任务提供了相当的功能，但 jQuery 在特定场景下仍然有用：\n\n- **遗留项目 (Legacy\
    \ Projects)**：如果你正在处理一个已经使用 jQuery 的项目，那么继续使用它进行 DOM 操作可能比将一切重构为原生 JavaScript\
    \ 更高效。\n- **复杂 DOM 操作的简化语法**：对于复杂的 DOM 操作，jQuery 的简洁语法有时比等效的原生 JavaScript 更易编写和阅读。\n\
    - **跨浏览器兼容性（现在相关性较小）**：jQuery 在历史上处理了浏览器之间的差异。现代浏览器已很大程度上统一了标准，这不再是一个问题。\n\n注意\
    \ jQuery 的文件大小。如果你只使用它的几个功能，使用原生 JavaScript 或更小的工具库可能会更高效。\n\n### 使用 jQuery 进行事件处理\n\
    \n处理用户交互是 Web 开发的一个基础方面。jQuery 简化了事件处理，提供了一种一致且简洁的方式为 DOM 元素附加事件监听器。\n\n#### 基础事件处理\n\
    \njQuery 提供了几种附加事件处理程序的方法。最常用的是 `.on()` 方法，它是现代 jQuery 中附加事件监听器的首选方式。\n\n这里是基本语法：\n\
    \n```javascript\n$(selector).on(event, handler);\n```\n\n- `selector`：指向绑定事件处理器的元素的\
    \ jQuery 选择器。\n- `event`：事件名称（例如，`click`、`mouseover`、`submit`）。\n- `handler`：事件发生时将执行的函数。\n\
    \n是一些示例：\n\n```javascript\n// 为按钮附加点击处理程序\n$('#my-button').on('click', function()\
    \ {\n  alert('按钮被点击了！');\n});\n\n// 为段落附加鼠标悬停处理程序\n$('p').on('mouseover', function()\
    \ {\n  $(this).css('background-color', 'lightgray');\n});\n\n// 为同一段落附加鼠标移出处理程序\n\
    $('p').on('mouseout', function() {\n  $(this).css('background-color', ''); //\
    \ 重置背景颜色\n});\n```\n\n事件处理器内部的 `this` 关键字指向触发事件的元素。\n\njQuery 还为常见事件提供了快捷方法，例如\
    \ `.click()`、`.mouseover()`、`.mouseout()`、`.submit()` 等。虽然这些快捷方法仍然有效，但通常更倾向于使用\
    \ `.on()`，因为它更通用。\n\n使用简写方法 `.click()` 的示例：\n\n```javascript\n$('#my-button').click(function()\
    \ {\n  alert('按钮被点击了（使用简写）！');\n});\n```\n\n#### 事件委托\n\n"
- fmt: "\nEvent delegation is a powerful technique that allows you to attach a single\
    \ event listener to a parent element and have it handle events for all its descendants,\
    \ even those added dynamically to the DOM later. This is especially useful for\
    \ handling events on elements that are added to the page after the initial page\
    \ load.\n\nHere’s how event delegation works with `.on()`:\n\n```javascript\n\
    $(parentSelector).on(event, childSelector, handler);\n```\n\n- `parentSelector`:\
    \ The selector for the parent element.\n- `event`: The name of the event.\n- `childSelector`:\
    \ The selector for the child elements that should trigger the handler.\n- `handler`:\
    \ The function to be executed.\n\n### Example:\n\n```javascript\n// Attach a click\
    \ handler to all list items inside a list, even those added dynamically\n$('#my-list').on('click',\
    \ 'li', function() {\n  alert('List item clicked!');\n});\n\n// Add a new list\
    \ item dynamically\n$('#my-list').append('<li>New list item</li>');\n\n// The\
    \ click handler will also work for the newly added list item\n```\n\nIn this example,\
    \ the click handler is attached to the `#my-list` element. When a click event\
    \ occurs on any `li` element within `#my-list`, the handler function will be executed.\
    \ This works even for `li` elements added after the event handler was attached.\n\
    \n### Namespaces and Removing Event Handlers\n\njQuery allows you to namespace\
    \ events, which is useful for organizing your code and removing specific event\
    \ handlers without affecting others. \n\nTo namespace an event, simply add a period\
    \ (`.`) followed by the namespace to the event name:\n\n```javascript\n$('#my-button').on('click.myNamespace',\
    \ function() {\n  alert('Button clicked (with namespace)!');\n});\n```\n\nTo remove\
    \ a specific event handler, you can use the `.off()` method with the namespace:\n\
    \n```javascript\n$('#my-button').off('click.myNamespace'); // Removes only the\
    \ namespaced click handler\n$('#my-element').off('click'); // Removes all click\
    \ handlers from my-element\n```\n\nThis makes it possible to remove event handlers\
    \ selectively, preventing unintended side effects.\n\n### Practical Applications\
    \ and Considerations\n\njQuery’s event handling provides a straightforward and\
    \ cross-browser compatible way to manage user interactions. While modern JavaScript’s\
    \ `addEventListener` offers comparable functionality, jQuery’s concise syntax\
    \ and event delegation capabilities can still be advantageous in certain situations,\
    \ especially in projects that already rely on jQuery.\n\nWhen deciding whether\
    \ to use jQuery for event handling, consider the following:\n\n- **Project Context**:\
    \ If you’re working on a project that already uses jQuery, using it for event\
    \ handling can maintain consistency.\n- **Event Delegation Needs**: If you need\
    \ to handle events on dynamically added elements, jQuery’s event delegation syntax\
    \ is particularly convenient.\n- **Code Readability**: In some cases, jQuery’s\
    \ event handling syntax can be more concise and easier to read than equivalent\
    \ plain JavaScript.\n\nThis section has provided a comprehensive overview of event\
    \ handling with jQuery. By understanding how to use `.on()`, event delegation,\
    \ and namespaces, you can effectively manage user interactions in your web applications,\
    \ leveraging jQuery’s strengths where they are most beneficial.\n\n### Practical\
    \ Use Cases for jQuery (Animations, AJAX in specific scenarios)\n\nWhile modern\
    \ JavaScript offers robust alternatives for many tasks, jQuery retains some advantages\
    \ in specific use cases, particularly when dealing with animations and in certain\
    \ AJAX scenarios, especially within legacy projects or when rapid prototyping\
    \ is a priority. This section highlights these areas.\n\n#### Animations with\
    \ jQuery\n\njQuery's animation methods provide a simple and concise way to create\
    \ smooth visual effects. While CSS transitions and animations offer excellent\
    \ performance, jQuery's animation methods can still be useful for more complex\
    \ or dynamically generated animations, especially when backward compatibility\
    \ with older browsers is a concern.\n\nHere are some of jQuery's key animation\
    \ methods:\n\n- `.show()`: Displays hidden elements with a smooth fade-in effect.\n\
    - `.hide()`: Hides visible elements with a smooth fade-out effect.\n- `.fadeIn()`:\
    \ Fades in an element.\n- `.fadeOut()`: Fades out an element.\n- `.slideDown()`:\
    \ Slides an element down.\n- `.slideUp()`: Slides an element up.\n- `.animate()`:\
    \ Creates custom animations by manipulating CSS properties over time.\n\nHere\
    \ are a few examples:\n\n```javascript\n// Fade in an element over 500 milliseconds\n\
    $('#my-element').fadeIn(500);\n\n// Slide down an element over 1 second\n$('#my-element').slideDown(1000);\n\
    \n// Create a custom animation\n$('#my-element').animate({\n  opacity: 0.5,\n\
    \  width: '50%',\n  height: '100px'\n}, 1000, function() {\n  // This function\
    \ runs when the animation is complete\n  console.log(\"Animation complete\");\n\
    });\n```\n\nThe `.animate()` method is particularly powerful, allowing you to\
    \ animate any CSS property that accepts numeric values. You can also specify a\
    \ duration, easing function (e.g., `swing`, `linear`), and a callback function\
    \ that executes when the animation is complete.\n\n#### AJAX with jQuery (Specific\
    \ Scenarios)\n\nWhile `fetch` and `Axios` are now the preferred methods for making\
    \ AJAX requests in most modern JavaScript applications, jQuery's AJAX functionality\
    \ can still be useful in specific situations:\n\n- **Legacy Projects**: If you're\
    \ working on a project that heavily relies on jQuery, using jQuery's AJAX methods\
    \ can maintain consistency and avoid introducing additional dependencies.\n- **Simplified\
    \ Syntax for Basic Requests**: For basic AJAX requests, jQuery's `.ajax()`, `.get()`,\
    \ and `.post()` methods offer a concise syntax.\n\nHere’s an example of a GET\
    \ request with jQuery’s `.get()`:\n\n```javascript\n$.get('https://api.example.com/data',\
    \ function(data) {\n  console.log('Data:', data);\n});\n```\n\nAnd here’s an example\
    \ of a more complex request using `.ajax()`:\n\n```javascript\n$.ajax({\n  url:\
    \ 'https://api.example.com/data',\n  method: 'POST',\n  data: { key: 'value' },\n\
    \  dataType: 'json',\n  success: function(data) {\n    console.log('Success:',\
    \ data);\n  },\n  error: function(error) {\n    console.error('Error:', error);\n\
    \  }\n});\n```\n\nThe `.ajax()` method offers fine-grained control over the request,\
    \ allowing you to specify the URL, method, data, data type, and success and error\
    \ callbacks.\n\n### When to Consider jQuery\n\njQuery is most useful in these\
    \ situations:\n\n- **Existing jQuery Projects**: If a project already uses jQuery,\
    \ it often makes sense to continue using it for animations and basic AJAX rather\
    \ than refactoring to plain JavaScript or other libraries.\n- **Rapid Prototyping**:\
    \ For quick prototyping or small projects, jQuery’s concise syntax can speed up\
    \ development.\n- **Specific Animation Needs**: If you require complex animations\
    \ or need to support older browsers that lack full CSS animation support, jQuery\
    \ can be a good option.\n\n### When to Prefer Modern JavaScript\n\nIn most new\
    \ projects, it’s generally recommended to use modern JavaScript APIs like `fetch`\
    \ for AJAX and CSS transitions/animations for visual effects. These approaches\
    \ offer better performance, smaller file sizes, and are more aligned with current\
    \ web development best practices.\n\n### Did You Know? The original purpose and\
    \ rise in popularity of jQuery\n\njQuery emerged in 2006, a time when web development\
    \ was significantly different from today. Browser inconsistencies were rampant,\
    \ making cross-browser compatibility a major headache for developers. Writing\
    \ JavaScript code that worked reliably across Internet Explorer, Firefox, Safari,\
    \ and other browsers often required writing separate code paths or using complex\
    \ workarounds.\n\nJohn Resig created jQuery with a clear goal: \"Write less, do\
    \ more.\" It aimed to simplify common JavaScript tasks, such as DOM manipulation,\
    \ event handling, animations, and AJAX, while abstracting away browser differences.\
    \ This made it possible for developers to write concise, cross-browser compatible\
    \ code without having to worry about the intricacies of each browser's implementation.\n"
  raw: 'Event delegation is a powerful technique that allows you to attach a single
    event listener to a parent element and have it handle events for all its descendants,
    even those added dynamically to the DOM later. This is especially useful for handling
    events on elements that are added to the page after the initial page load.


    Here’s how event delegation works with .on():


    JavaScript


    $(parentSelector).on(event, childSelector, handler);


    ​● ​parentSelector: The selector for the parent element.


    ​● ​event: The name of the event.


    ​● ​childSelector: The selector for the child elements that should trigger the
    handler.


    ​● ​handler: The function to be executed.


    Example:


    JavaScript


    // Attach a click handler to all list items inside a list, even those added dynamically


    $(''#my-list'').on(''click'', ''li'', function() {


    alert(''List item clicked!'');


    });


    // Add a new list item dynamically


    $(''#my-list'').append(''<li>New list item</li>'');


    // The click handler will also work for the newly added list item


    In this example, the click handler is attached to the #my-listelement. When a
    click event occurs on any lielement within #my-list, the handler function will
    be executed. This works even for li elements added after the event handler was
    attached.


    Namespaces and Removing Event Handlers


    jQuery allows you to namespace events, which is useful for organizing your code
    and removing specific event handlers without affecting others.


    To namespace an event, simply add a period (.) followed by the namespace to the
    event name:


    JavaScript


    $(''#my-button'').on(''click.myNamespace'', function() {


    alert(''Button clicked (with namespace)!'');


    });


    To remove a specific event handler, you can use the .off() method with the namespace:


    JavaScript


    $(''#my-button'').off(''click.myNamespace''); // Removes only the namespaced click
    handler


    $(''#my-element'').off(''click''); // Removes all click handlers from my-element


    This makes it possible to remove event handlers selectively, preventing unintended
    side effects.


    Practical Applications and Considerations


    jQuery’s event handling provides a straightforward and cross-browser compatible
    way to manage user interactions. While modern JavaScript’s addEventListener offers
    comparable functionality, jQuery’s concise syntax and event delegation capabilities
    can still be advantageous in certain situations, especially in projects that already
    rely on jQuery.


    When deciding whether to use jQuery for event handling, consider the following:


    ​● ​Project Context: If you’re working on a project that already uses jQuery,
    using it for event handling can maintain consistency.


    ​● ​Event Delegation Needs: If you need to handle events on dynamically added
    elements, jQuery’s event delegation syntax is particularly convenient.


    ​● ​Code Readability: In some cases, jQuery’s event handling syntax can be more
    concise and easier to read than equivalent plain JavaScript.


    This section has provided a comprehensive overview of event handling with jQuery.
    By understanding how to use .on(), event delegation, and namespaces, you can effectively
    manage user interactions in your web applications, leveraging jQuery’s strengths
    where they are most beneficial.


    ### Practical Use Cases for jQuery (Animations, AJAX in specific scenarios)


    While modern JavaScript offers robust alternatives for many tasks, jQuery retains
    some advantages in specific use cases, particularly when dealing with animations
    and in certain AJAX scenarios, especially within legacy projects or when rapid
    prototyping is a priority. This section highlights these areas.


    Animations with jQuery


    jQuery''s animation methods provide a simple and concise way to create smooth
    visual effects. While CSS transitions and animations offer excellent performance,
    jQuery''s animation methods can still be useful for more complex or dynamically
    generated animations, especially when backward compatibility with older browsers
    is a concern.


    Here are some of jQuery''s key animation methods:


    ​● ​.show(): Displays hidden elements with a smooth fade-in effect.


    ​● ​.hide(): Hides visible elements with a smooth fade-out effect.


    ​● ​.fadeIn(): Fades in an element.


    ​● ​.fadeOut(): Fades out an element.


    ​● ​.slideDown(): Slides an element down.


    ​● ​.slideUp(): Slides an element up.


    ​● ​.animate(): Creates custom animations by manipulating CSS properties over
    time.


    Here are a few examples:


    JavaScript


    // Fade in an element over 500 milliseconds


    $(''#my-element'').fadeIn(500);


    // Slide down an element over 1 second


    $(''#my-element'').slideDown(1000);


    // Create a custom animation


    $(''#my-element'').animate({


    opacity: 0.5,


    width: ''50%'',


    height: ''100px''


    }, 1000, function() {


    // This function runs when the animation is complete


    console.log("Animation complete");


    });


    The .animate()method is particularly powerful, allowing you to animate any CSS
    property that accepts numeric values. You can also specify a duration, easing
    function (e.g., swing, linear), and a callback function that executes when the
    animation is complete.


    AJAX with jQuery (Specific Scenarios)


    While fetch and Axios are now the preferred methods for making AJAX requests in
    most modern JavaScript applications, jQuery''s AJAX functionality can still be
    useful in specific situations:


    ​● ​Legacy Projects: If you''re working on a project that heavily relies on jQuery,
    using jQuery''s AJAX methods can maintain consistency and avoid introducing additional
    dependencies.


    ​● ​Simplified Syntax for Basic Requests:For basic AJAX requests, jQuery''s .ajax(),
    .get(), and .post() methods offer a concise syntax.


    Here’s an example of a GET request with jQuery’s .get():


    JavaScript


    $.get(''https://api.example.com/data'', function(data) {


    console.log(''Data:'', data);


    });


    And here’s an example of a more complex request using .ajax():


    JavaScript


    $.ajax({


    url: ''https://api.example.com/data'',


    method: ''POST'',


    data: { key: ''value'' },


    dataType: ''json'',


    success: function(data) {


    console.log(''Success:'', data);


    },


    error: function(error) {


    console.error(''Error:'', error);


    }


    });


    The .ajax() method offers fine-grained control over the request, allowing you
    to specify the URL, method, data, data type, and success and error callbacks.


    When to Consider jQuery


    jQuery is most useful in these situations:


    ​● ​Existing jQuery Projects: If a project already uses jQuery, it often makes
    sense to continue using it for animations and basic AJAX rather than refactoring
    to plain JavaScript or other libraries.


    ​● ​Rapid Prototyping: For quick prototyping or small projects, jQuery’s concise
    syntax can speed up development.


    ​● ​Specific Animation Needs: If you require complex animations or need to support
    older browsers that lack full CSS animation support, jQuery can be a good option.


    When to Prefer Modern JavaScript


    In most new projects, it’s generally recommended to use modern JavaScript APIs
    like fetch for AJAX and CSS transitions/animations for visual effects. These approaches
    offer better performance, smaller file sizes, and are more aligned with current
    web development best practices.


    ### Did You Know? The original purpose and rise in popularity of jQuery


    jQuery emerged in 2006, a time when web development was significantly different
    from today. Browser inconsistencies were rampant, making cross-browser compatibility
    a major headache for developers. Writing JavaScript code that worked reliably
    across Internet Explorer, Firefox, Safari, and other browsers often required writing
    separate code paths or using complex workarounds.


    John Resig created jQuery with a clear goal: "Write less, do more." It aimed to
    simplify common JavaScript tasks, such as DOM manipulation, event handling, animations,
    and AJAX, while abstracting away browser differences. This made it possible for
    developers to write concise, cross-browser compatible code without having to worry
    about the intricacies of each browser''s implementation.'
