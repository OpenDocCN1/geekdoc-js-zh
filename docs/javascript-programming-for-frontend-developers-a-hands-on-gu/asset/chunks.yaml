    \ John\nconsole.log(rest); // Output: { age: 30, city: \"New York\", job: \"Developer\"\
    \ }\n```\n\n# 对象字面量增强\nES6 还为对象字面量引入了若干增强，使其更加简洁且富有表现力。\n\n## 简写属性名\n如果属性名与变量名相同，你可以省略值。\n\
