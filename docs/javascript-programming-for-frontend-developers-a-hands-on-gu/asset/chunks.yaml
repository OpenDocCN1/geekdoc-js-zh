    \ 许多属性也可以作为元素的直接属性访问。这通常是访问和修改常用属性的最方便方法。\n\nHTML\n```html\n<input type=\"text\"\
    \ id=\"myInput\" value=\"Initial Value\">\n<script>\nlet myInput = document.getElementById(\"\
    myInput\");\nmyInput.value = \"New Value\"; // 修改 value 属性\nmyInput.id = \"theInput\"\
    ; // 修改 id 属性\n</script>\n```\n\n### 修改元素样式\n\nJavaScript 还可以动态更改元素的样式：\n\n- `style`\
    \ 属性: `style` 属性允许你访问并修改元素的内联样式。\n\nHTML\n```html\n<div id=\"myDiv\" style=\"\
    background-color: lightblue;\">A div.</div>\n<script>\nlet myDiv = document.getElementById(\"\
    myDiv\");\nmyDiv.style.backgroundColor = \"lightgreen\";\nmyDiv.style.color =\
    \ \"white\";\nmyDiv.style.padding = \"10px\";\n</script>\n```\n\n- `classList`\
    \ 属性: `classList` 属性提供了添加、移除和切换元素 CSS 类的方法。这通常认为比直接操作 `style` 属性更好，因为它促进了关注点分离（将样式与\
    \ JavaScript 逻辑分离）。\n\nHTML\n```html\n<div id=\"myDiv\" class=\"initial-class\"\
    >A div.</div>\n<style>\n.highlight { background-color: yellow; }\n.hidden { display:\
    \ none;}\n</style>\n<script>\nlet myDiv = document.getElementById(\"myDiv\");\n\
    myDiv.classList.add(\"highlight\"); // 添加 'highlight' 类\nmyDiv.classList.remove(\"\
    initial-class\"); // 移除 'initial-class' 类\nmyDiv.classList.toggle(\"hidden\");\
    \ // 切换 'hidden' 类\n</script>\n```\n\n### 创建并插入元素\n\nJavaScript 允许动态 DOM 中创建并插入新元素：\n\
    \n- `document.createElement(tagName)`: 创建一个带有指定标签名的新元素节点。\n\n```javascript\nlet\
    \ newParagraph = document.createElement(\"p\");\n```\n\n- `document.createTextNode(text)`:\
    \ 创建一个带有指定文本内容的文本节点。\n\n```javascript\nlet textNode = document.createTextNode(\"\
    This is a new paragraph.\");\n```\n\n- `appendChild(node)`: 将节点作为指定父节点的最后一个节点。\n\
    \n```javascript\nlet myDiv = document.getElementById(\"myDiv\");\nnewParagraph.appendChild(textNode);\
    \ // 将文本添加到段落\nmyDiv.appendChild(newParagraph); // 将段落添加到 div\n```\n\n- `insertBefore(newNode,\
    \ referenceNode)`: 在指定的引用节点之前插入节点。\n\n```javascript\nlet anotherParagraph = document.createElement(\"\
    p\");\n```\n"
