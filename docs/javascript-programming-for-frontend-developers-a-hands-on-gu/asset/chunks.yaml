    additions to JavaScript that improve code conciseness and readability. They streamline
    common tasks like extracting data from objects and arrays, combining data structures,
    and defining objects, leading to more efficient and maintainable code.


    ### Classes, Modules, and Imports/Exports


    Classes: Object-Oriented Programming


    ES6 introduced classes to JavaScript, providing a more familiar syntax for object-oriented
    programming (OOP). While JavaScript has always been prototype-based, classes offer
    a more structured way to define objects and their behavior.


    A class is a blueprint for creating objects. It defines the properties (data)
    and methods (actions) that objects of that class will have.


    JavaScript


    class Person {


    constructor(name, age) {


    this.name = name;


    this.age = age;


    }


    greet() {


    console.log(`Hello, my name is ${this.name}and I am ${this.age} years old.`);


    }


    }


    const john = new Person("John Doe", 30);


    john.greet(); // Output: Hello, my name is John Doe and I am 30 years old.


    const jane = new Person("Jane Smith", 25);


    jane.greet(); // Output: Hello, my name is Jane Smith and I am 25 years old.


    Key aspects of classes:


    ​● ​constructor():The constructor() method is a special method within a class
    that is called when a new object of the class is created. It is used to initialize
    the object''s properties.


    ​● ​this keyword:The this keyword refers to the current object instance.


    ​● ​Methods: Functions defined within a class are called methods. They define
    the actions that objects of the class can perform.


    Inheritance: Classes support inheritance, allowing you to create new classes based
    on existing ones. This promotes code reuse and creates a hierarchical relationship
    between classes.


    JavaScript


    class Student extends Person {


    constructor(name, age, studentId) {


    super(name, age); // Calls the parent class constructor


    this.studentId = studentId;


    }


    study() {


    console.log(`${this.name} is studying.`);


    }


    }


    constalice = new Student("Alice Johnson", 20, "12345");


    alice.greet(); // Output: Hello, my name is Alice Johnson and I am 20 years old.


    alice.study(); // Output: Alice Johnson is studying.


    The extends keyword is used to create a subclass (child class) that inherits properties
    and methods from a superclass (parent class).1The super() keyword is used to call
    the parent class''s constructor.


    Modules: Organizing Code


    As JavaScript projects grow in size and complexity, it becomes essential to organize
    code into smaller, manageable units called modules. Modules allow you to encapsulate
    code, preventing naming collisions and improving code reusability.


    In JavaScript, modules are typically implemented using files. Each file is considered
    a module. Variables, functions, and classes defined within a module are only accessible
    within that module by default. To make them accessible from other modules, you
    need to export them.


    Imports and Exports: Sharing Code Between Modules


    The importand export statements are used to share code between modules.


    ​● ​Named Exports: You can export individual variables, functions, or classes
    using named exports.


    JavaScript


    // math.js


    export  const PI = 3.14159;


    export  function  add(a, b) {


    return a + b;


    }


    export  class Calculator {


    constructor() {


    }


    subtract(a, b) {


    return a-b;


    }


    }


    // main.js


    import{ PI, add, Calculator } from ''./math.js'';


    console.log(PI); // Output: 3.14159


    console.log(add(5, 3)); // Output: 8


    const myCalculator = new Calculator()


    console.log(myCalculator.subtract(5,3)) // Output 2


    ​● ​Default Exports: You can export a single value as the default export of a
    module.


    JavaScript


    // message.js


    constmessage = "Hello from module!";


    export  default message;


