    the Promise is resolved. The resolved value is passed as an argument to this callback
    function.


    JavaScript


    myPromise.then(value => {


    console.log("Promise resolved with value:", value);


    });


    ​● ​catch():The catch() method is used to handle the rejected state of a Promise.
    It also takes a callback function as an argument, which is executed when the Promise
    is rejected. The rejection reason (error) is passed as an argument to this callback
    function.


    JavaScript


    myPromise.catch(error => {


    console.error("Promise rejected with error:", error);


    });


    Promise Chaining


    One of the key advantages of Promises is their ability to be chained. This allows
    you to sequence multiple asynchronous operations in a clean and readable way,
    avoiding the problem of callback hell.


    JavaScript


    function  fetchData(url) {


    return  new  Promise((resolve, reject) => {


    setTimeout(() => {


    constdata = `Data from ${url}`;


    resolve(data);


    }, 1000);


    });


    }


    fetchData("url1")


    .then(data1 => {


    console.log("Received:", data1);


    return fetchData("url2"); // Return a new Promise


    })


    .then(data2 => {


    console.log("Received:", data2);


    return fetchData("url3"); // Return a new Promise


    })


    .then(data3 => {


    console.log("Received:", data3)


    })


    .catch(error => {


    console.error("Error:", error);


    });


    In this example, three asynchronous operations (simulated by fetchData()) are
    chained together using .then(). Each .then()method receives the result of the
    previous Promise and returns a new Promise, creating a sequence of asynchronous
    operations. If any of the Promises in the chain are rejected, the catch() method
    will handle the error.


    Handling Errors in Promise Chains'
