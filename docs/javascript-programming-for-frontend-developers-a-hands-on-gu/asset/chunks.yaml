    \ 6]\n```\n\n### 对象展开：\n```javascript\nconstperson1 = { name: \"John\", age: 30\
    \ };\nconstperson2 = { city: \"New York\", job: \"Developer\" };\nconst combinedPerson\
    \ = { ...person1, ...person2 };\nconsole.log(combinedPerson); // Output: { name:\
    \ \"John\", age: 30, city: \"New York\", job: \"Developer\" }\n```\n\n## 剩余运算符\n\
    剩余运算符将数组或对象的剩余元素收集到一个新的数组或对象中。它用于函数参数和解构赋值中。\n\n### 函数中的剩余参数：\n```javascript\n\
    function sum(...numbers) {\n  let total = 0;\n  for (let number of numbers) {\n\
