  trans: "\n\n1. 我们从 `@testing-library/react` 导入 `render`、`screen` 和 `fireEvent`。我们还导入了\
    \ `Counter` 组件以及 `Redux Provider` 和 `store`。\n2. 我们使用 `render()` 在 `Redux Provider`\
    \ 中渲染 `Counter` 组件。这使得 `Redux store` 在测试期间对组件可用。\n3. 我们使用 `screen.getByRole()`\
    \ 和 `screen.getByText()` 来查询页面上的元素。优先使用可访问角色（accessible roles）和文本内容，因为这是从用户的角度来测试组件。\n\
    4. 我们使用 `fireEvent.click()` 来模拟对增加按钮的点击。\n5. 我们使用 `expect(screen.getByText('1')).toBeInTheDocument();`\
    \ 来断言计数已增加到 1。我们还会检查原始的计数元素是否不再存在。\n\n# 测试 API 交互\n\n对于 API 集 集的测试，你通常需要 mock\
    \ API 请求，以避免在测试期间产生实际的网络调用。Jest 提供了与 React Testing Library 配合使用的 mock 功能。\n\n\
    这是一个 mock `fetch` 调用的示例：\n\n```javascript\nglobal.fetch = jest.fn(() =>\n  Promise.resolve({\n\
    \    json: () => Promise.resolve({ data: 'mocked data' }),\n  })\n);\n\ntest('fetches\
    \ data from the API', async () => {\n  // ... test logic\n});\n```\n\n这 mock 了全局\
    \ `fetch` 函数，返回一个解析为 mock 响应的 `Promise`。这允许你在测试期间控制 API 返回的数据。\n\n# 集成测试策略\n\n\
    - **关注用户流**：设计你的集成测试以覆盖完整的用户场景。这确保了应用程序从用户的角度来看是正常工作的。\n- **测试关键交互**：关注测试应用程序不同部分之间最重要的交互。\n\
    - **使用真实数据**：在测试中使用真实数据来模拟现实世界的场景。\n- **保持测试隔离**：避免测试之间的依赖。每个测试都应该是独立的，不应该依赖于其他测试的结果。\n\
    - **策略性地使用 mock**：使用 mock 来隔离你正在测试的应用部分，并避免产生不必要的网络调用或访问外部资源。\n\n集成测试对于确保你的应用程序整体正常工作至关重要。通过遵循这些策略并使用适当的测试工具，你可以构建更健壮、更可靠的\
    \ JavaScript 应用程序。\n\n# 使用浏览器开发者工具进行调试\n\n即使经过了彻底的测试，代码中仍可能出现 bug。浏览器开发者工具提供了强大的工具，可以直接在浏览器中调试\
    \ JavaScript 应用程序。本节介绍了使用这些工具的常用调试技术。\n\n## 访问浏览器开发者工具\n\n你可以在大多数现代浏览器通过以下方式访问开发者工具：\n\
    - 在页面上右键点击并选择“检查”或“检查元素”。\n- 使用快捷键：\n    - Chrome/Edge/Opera: `Ctrl+Shift+I` (Windows)\
    \ 或 `Cmd+Option+I` (Mac)\n    - Firefox: `Ctrl+Shift+I` (Windows) 或 `Cmd+Option+I`\
    \ (Mac)\n\n## 调试 JavaScript 的关键开发者工具面板\n\n几个开发者工具面板对调试 JavaScript 特别有用：\n\n- **Elements\
    \ (元素)**：此面板允许你检查和修改页面的 HTML 和 CSS。对于理解 DOM 结构以及样式是如何应用的很有用。\n- **Console (控制台)**：此面板显示控制台消息（例如\
    \ `console.log()`、`console.error()`），并允许你直接在浏览器中执行 JavaScript 代码。\n- **Sources\
    \ (源代码)**：此面板允许你查看和调试你的 JavaScript 代码。你可以设置断点、单步执行代码并检查变量。\n- **Network (网络)**：此面板显示页面发送的所有网络请求。对于调试\
    \ API 调用和识别性能瓶颈很有用。\n- **Application (应用，旧版浏览器为 Storage)**：此面板提供有关存储机制的信息，如 Local\
    \ Storage、Session Storage、Cookies 和 IndexedDB。\n\n## 使用控制台进行调试\n\nConsole 面板是记录消息和求值表达式的宝贵工具。\n\
    \n- `console.log(message)`：在控制台记录消息。\n- `console.warn(message)`：记录警告消息。\n- `console.error(message)`：记录错误消息。\n\
    - `console.table(data)`：以表格格式显示数据。\n- `console.group(label)` 和 `console.groupEnd()`：将相关的控制台消息分组。\n\
    \n示例：\n\n```javascript\nfunction myFunction(a, b) {\n  console.log('a:', a);\n\
    \  console.log('b:', b);\n  const sum = a + b;\n  console.log('sum:', sum);\n\
    \  return sum;\n}\n\nmyFunction(5, 10);\n```\n\n这将在控制台输出 `a`、`b` 和 `sum` 的值，帮助你理解代码的执行流。\n\
    \n## 在 Sources 面板中设置断点\n\n断点允许你在特定行处暂停 JavaScript 代码的执行。这对于检查变量和理解应用程序在特定时刻的状态极其有用。\n\
    \n设置断点的方法：\n1. 打开 Sources 面板。\n2. 导航到你想要调试的 JavaScript 文件。\n3. 点击你想设置断点的行号。将出现一个蓝色标记。\n\
    \n当你的代码到达断点时，执行将暂停。然后你可以使用调试器控制按钮：\n- **Step over (单步)**：执行当前行并移动到下一行。\n- **Step\
    \ into (单入)**：进入函数调用内部。\n- **Step out (单出)**：跳出函数内部。\n- **Resume (继续执行)**：继续执行，直到遇到下一个断点或脚本结束。\n\
    \n## 检查变量和作用域\n\n当执行在断点暂停时，你可以在 Scope 面板中检查变量（通常在 Sources 面板的右侧边栏）。这允许你看到当前作用域内变量的当前值，以及父级作用域（闭包）中的变量。\n\
    \n## 使用监听表达式 (Watch Expressions)\n\n监听表达式允许你在代码执行时监控表达式的值。你可以在 Watch 面板中（通常在 Sources\
    \ 面板的右侧边栏）添加监听表达式。\n\n## 调试异步代码\n\n调试异步代码更具挑战性。然而，开发者工具提供了辅助功能：\n\n- **异步堆栈跟踪**：开发者工具通常可以显示导致异步操作的调用堆栈，即使代码在不同的函数或事件处理程序之间跳转。\n\
    - **事件监听器和 Promise 中的断点**：你可以在事件处理器或 Promise 的 `.then()` 回调中设置断点，以检查异步操作不同阶段的状态。\n\
    \n## 调试 React 组件\n\nReact DevTools 扩展（适用于 Chrome 和 Firefox）提供了用于调试 React 组件的额外工具。它允许你检查组件树、props\
    \ 和 state，从而更容易理解你的组件是如何渲染和交互的。\n\n# 调试技巧\n\n练习 3：为 JavaScript 函数编写单元测试\n\n此练习涉及为一个格式化电话号码的实用函数编写单元测试。你将获得设置测试文件、编写测试用例以及使用\
    \ Jest 匹配器（matchers）的经验。\n\n"
- fmt: "\n## 1. Create the `formatPhoneNumber` Function\n\nCreate a file named `formatPhoneNumber.js`\
    \ (or similar) and add the following code:\n\n```javascript\nfunction formatPhoneNumber(phoneNumber)\
    \ {\n  if (typeof phoneNumber !== 'string') {\n    return 'Invalid input';\n \
    \ }\n  const cleanedNumber = phoneNumber.replace(/\\D/g, ''); // Remove non-digits\n\
    \  if (cleanedNumber.length !== 10) {\n    return 'Invalid phone number';\n  }\n\
    \  return `(${cleanedNumber.slice(0, 3)}) ${cleanedNumber.slice(3, 6)}-${cleanedNumber.slice(6)}`;\n\
    }\n\nmodule.exports = formatPhoneNumber;\n```\n\nThis function takes a phone number\
    \ as a string and formats it into the format `(XXX) XXX-XXXX`. It also handles\
    \ invalid input and invalid phone number lengths.\n\n## 2. Create the Test File\n\
    \nCreate a file named `formatPhoneNumber.test.js` (or similar) in the same directory\
    \ as `formatPhoneNumber.js`. Add the following code:\n\n```javascript\nconst formatPhoneNumber\
    \ = require('./formatPhoneNumber');\n\ndescribe('formatPhoneNumber', () => {\n\
    \  it('should format a valid 10-digit phone number', () => {\n    expect(formatPhoneNumber('1234567890')).toBe('(123)\
    \ 456-7890');\n    expect(formatPhoneNumber('123-456-7890')).toBe('(123) 456-7890');\n\
    \    expect(formatPhoneNumber('(123) 456-7890')).toBe('(123) 456-7890');\n  });\n\
    \n  it('should return \"Invalid input\" for non-string input', () => {\n    expect(formatPhoneNumber(1234567890)).toBe('Invalid\
    \ input');\n    expect(formatPhoneNumber(null)).toBe('Invalid input');\n    expect(formatPhoneNumber(undefined)).toBe('Invalid\
    \ input');\n    expect(formatPhoneNumber({})).toBe('Invalid input');\n    expect(formatPhoneNumber([])).toBe('Invalid\
    \ input');\n  });\n\n  it('should return \"Invalid phone number\" for phone numbers\
    \ with incorrect length', () => {\n    expect(formatPhoneNumber('123456789')).toBe('Invalid\
    \ phone number');\n    expect(formatPhoneNumber('12345678901')).toBe('Invalid\
    \ phone number');\n    expect(formatPhoneNumber('123')).toBe('Invalid phone number');\n\
    \  });\n\n  it('should handle various input formats correctly', () => {\n    expect(formatPhoneNumber('123.456.7890')).toBe('(123)\
    \ 456-7890');\n    expect(formatPhoneNumber('123 456 7890')).toBe('(123) 456-7890');\n\
    \  });\n});\n```\n\n## 3. Run the Tests\n\nOpen your terminal in the project directory\
    \ and run:\n\n```bash\nnpm test\n# or\nyarn test\n```\n\n`Jest` will run the tests\
    \ and display the results. You should see that all tests pass.\n\n### Explanation\
    \ and Key Concepts:\n\n- **`describe` block**: We use a `describe` block to group\
    \ the tests for the `formatPhoneNumber` function. This helps organize the tests\
    \ and makes the output more readable.\n- **`it` test function**: Each `it` block\
    \ defines a single test case. The first argument is a description of the test,\
    \ and the second argument is a function that contains the test logic.\n- **`expect`\
    \ function**: The `expect` function is used to make assertions. It takes a value\
    \ as an argument and returns a matcher object.\n- **Matchers**: We use the `toBe`\
    \ matcher to check for strict equality.\n- **Testing different scenarios**: We\
    \ write tests for valid phone numbers, invalid input types, and phone numbers\
    \ with incorrect lengths. This ensures that the function handles different scenarios\
    \ correctly.\n\n### Further Exercises:\n\n- Add more test cases to cover other\
    \ edge cases, such as phone numbers with leading or trailing spaces.\n- Refactor\
    \ the `formatPhoneNumber` function to handle international phone numbers and write\
    \ tests for those.\n- Try using other `Jest` matchers, such as `toMatch` for regular\
    \ expression matching.\n\nBy completing this exercise, you’ll gain practical experience\
    \ writing unit tests with `Jest` and learn how to test different scenarios and\
    \ edge cases. This solidifies your understanding of unit testing and provides\
    \ a foundation for writing more comprehensive tests for your JavaScript code.\n\
    \n## Chapter 10: Performance Optimization Techniques\n\n### Code Splitting and\
    \ Lazy Loading\n\nIn today’s web environment, users expect fast and responsive\
    \ websites. A slow-loading or sluggish website can lead to frustration and a poor\
    \ user experience, ultimately driving visitors away. Performance optimization\
    \ is therefore a critical aspect of web development. This chapter discusses various\
    \ techniques to improve the performance of your JavaScript applications, starting\
    \ with code splitting and lazy loading.\n\n### Code Splitting: Breaking Down the\
    \ Monolith\n\nImagine a large application where all the JavaScript code is bundled\
    \ into a single, massive file. When a user visits the site, their browser has\
    \ to download this entire file before anything becomes interactive. This can lead\
    \ to a significant initial load time, especially on slower connections or devices.\
    \ Code splitting addresses this problem by breaking down your code into smaller,\
    \ more manageable chunks.\n\nInstead of one large file, you create multiple smaller\
    \ files that can be loaded on demand. This means the browser only downloads the\
    \ code that is needed for the initial view, significantly reducing the initial\
    \ load time. As the user interacts with the application and navigates to different\
    \ sections, the browser can then download the necessary code chunks asynchronously.\n\
    \nThink of it like this: instead of delivering an entire encyclopedia to someone\
    \ who just wants to look up a single word, you give them a dictionary. If they\
    \ need more information, they can then request specific volumes of the encyclopedia.\n\
    \n### How Code Splitting Works\n\nCode splitting can be implemented at various\
    \ levels:\n\n- **Component Level (in React)**: You can split your code based on\
    \ components or routes. This means each route or component has its own associated\
    \ code chunk.\n- **Module Level**: You can split your code based on modules or\
    \ functionalities. For example, you might have separate code chunks for image\
    \ processing, data visualization, or user authentication.\n\nSeveral tools and\
    \ techniques can be used to implement code splitting:\n\n- **Dynamic `import()`**:\
    \ This is the most common and recommended way to implement code splitting in modern\
    \ JavaScript. The dynamic `import()` syntax allows you to load modules asynchronously\
    \ at runtime.\n\nHere is an example of how to use dynamic `import()` in React\
    \ to lazy load a component:\n\n```javascript\nimport React, { Suspense, lazy }\
    \ from 'react';\n\nconst OtherComponent = lazy(() => import('./OtherComponent'));\n\
    \nfunction MyComponent() {\n  return (\n    <div>\n      <Suspense fallback={<div>Loading...</div>}>\n\
    \        <OtherComponent />\n      </Suspense>\n    </div>\n  );\n}\n```\n\nLet's\
    \ break down this example:\n\n1. `lazy(() => import('./OtherComponent'))`: This\
    \ line uses the `lazy()` function from `React` to create a lazy-loaded version\
    \ of the `OtherComponent`. The `import()` function is called dynamically, which\
    \ means the `OtherComponent` code will only be downloaded when it’s needed.\n\
    2. `<Suspense fallback={<div>Loading...</div>}>`: The `Suspense` component is\
    \ used to handle the loading state while the `OtherComponent` is being downloaded.\
    \ The `fallback` prop specifies what should be displayed while the component is\
    \ loading (in this case, a simple \"Loading...\" message).\n\nWhen `MyComponent`\
    \ renders, the browser will not immediately download the code for `OtherComponent`.\
    \ Instead, it will display the \"Loading...\" message. Once the `OtherComponent`\
    \ code is downloaded, it will be rendered.\n\n- **Webpack `import()` statements\
    \ (for non-React projects or advanced configuration)**: If you're not using React\
    \ or need more fine-grained control over code splitting, you can use Webpack's\
    \ dynamic `import()` syntax directly. Webpack will then handle the creation of\
    \ separate code chunks.\n\n### Lazy Loading: Loading on Demand\n\nLazy loading\
    \ is closely related to code splitting. It refers to the practice of deferring\
    \ the loading of resources (such as images, scripts, or components) until they\
    \ are actually needed. This can significantly improve initial page load time and\
    \ reduce bandwidth consumption.\n\nThere are several techniques for lazy loading:\n\
    \n- **Lazy Loading Images**: You can lazy load images using the `loading=\"lazy\"\
    ` attribute on `<img>` elements. This tells the browser to only load the image\
    \ when it’s close to being visible in the viewport.\n"
