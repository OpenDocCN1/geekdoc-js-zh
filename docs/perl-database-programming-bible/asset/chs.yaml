  \n#### `<input name='field_name' type='text'>`\n\n`type` 为 `text` 的输入框是许多表单上常见的文本输入框。这种\
  \ HTML 表单输入用于从用户那里收集文本信息。\n\n#### `<input name='field_name' type='password'>`\n\n\
  `password` 类型与文本输入框完全相同。但当数据输入此框时，只会显示内容。\n\n#### `<input type='radio' name='field_name'>`\n\
  \n`radio` 输入类型在表单上创建单选按钮。对于具有相同 `name` 属性的单选按钮，只有一个是可以被选中的。\n\n#### `<input name='field_name'\
  \ type='checkbox'>`\n\n`checkbox` 类型在表单上创建小方框。它们与单选按钮类似，但复选框允许一个多个项目被选中。\n\n####\
  \ `<input type='hidden' name='field_name'>`\n\n`hidden` 类型的输入在表单上不可见。它用于向服务器传递数据而不需要在页面上显示。\n\
  \n#### `<input type='submit' value='Submit'>`\n\n`submit` 输入类型用于将 HTML 表单数据提交到服务器上的\
  \ CGI 程序。`value` 属性用于设置按钮上的文本。\n\n\n\n\n\n一个 `textarea` 标签可以有很多属性。`name` 属性的作用与其他\
  \ HTML 表单标签的作用相同。`rows` 和 `cols` 属性告诉浏览器该 `textarea` 应该显示为多少行和多少列。`wrap` 属性用于在文本到达\
  \ `textarea` 边缘时导致文本自动换行。\n\n`textarea` 标签需要一个闭合标签；起始标签和结束标签之间的任何文本在页面加载时显示在 `textarea`\
  \ 中，而且在按下重置按钮时也会显示。\n\n例如：\n\n```\n<textarea name=\"comments\" rows=\"2\" cols=\"\
  20\" wrap=\"physical\">\n This is a feedback section.\n</textarea>\n```\n\n这会生成一个以“This\
  \ is the feedback section.” 作为默认文本的 `textarea`。\n\n这些是我们涵盖的唯一标签；这些标签将整合到我们的示例中，以便看到每个标签的实际作用。\n\
