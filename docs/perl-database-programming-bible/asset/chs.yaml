  \ |\n\n## 简单数据检索总结\n\n我们已经涵盖了使用 `DBI` 获取数据的五种方法（实际上我们涵盖了四种方法，因为 `fetch` 和 `fetchrow_hashref`\
  \ 是相同的）。对于你现在来说，用 Perl 从数据库中获取数据应该是轻而易举的，而且我们的示例程序目前还没有超过 25 行！\n\n我们将涵盖最后一个示例，它使用了我们刚刚学到的数据访问方法之一。但这个示例将使程序的输出对用户更加友好。这个示例强化了你已经学到的知识，向你展示了另一种处理警告的方法。\n\
  \n```\n01: #!/usr/bin/perl -w\n02: #\n03: # select9.pl\n04: # Chapter 4\n05: # Listing\
  \ 4-9\n06: #\n07: use strict;\n08: use DBI;\n09: my $dbh = DBI->connect\n(\"DBI:mysql:BibleBook\"\
  ,\"bookuser\",\"testpass\") \n10:     or die(\"Cannot connect: $DBI::errstr\");\n\
  11: my $sql = qq(SELECT * FROM library);\n12: my $sth = $dbh->prepare($sql);\n13:\
  \ $sth->execute;\n14: my $counter = 1;\n```\n\n`1-14 行` 再次与我们之前的示例几乎相同。\n\n```\n\
  15: while(my $record = $sth->fetchrow_hashref){\n```\n\n`第 15 行` 开始了 `while` 循环，该循环一次行获取数据，并将包含这些数据的哈希引用存储在\
  \ `$record` 中。\n\n```\n16:     for my $field (keys %$record){\n17:         $record->{$field}\
  \ = \"N/A\" unless $record->{$field};\n18:         $record->{$field} =~ s/^\\W+//;\n\
  19:         $record->{$field} =~ s/\\s+$//g;\n20:     }\n```\n\n`第 16 行` 开始了一个 `for`\
  \ 循环，遍历哈希 `%record` 中的每个键。添加这个循环是我们还没有做过的。这个循环旨在检查数据并过滤掉我们想要的某些字符。`第 17 行` 如果 `$record->{$field}`\
  \ 当前为空字段，则将 `$record->{$field}` 的当前值设置为 `N/A`。通过这样做，我们可以消除因尝试打印数据而产生的任何警告。`第 18\
  \ 行` 去除字符串开头的任何非单词字符。许多字段在开头原本包含空格。这一行删除了这些空格，使得我们的输出是对齐的并且看起来好得多。正则表达式 `s/^\\W+//`\
  \ 拆解如下：`^` 表示我们正在查看字符串的开头；`\\W` 表示任何非单词字符；这包括空格和控制字符；`+` 表示匹配一次或多次。如果开头有这样的字符，该表达式将删掉所有这些字符。结尾的\
  \ `//` 表示我们将任何匹配到的字符替换为空。\n\n`第 19 行` 是另一个正则表达式。这次，该正则表达式正在寻找回车符或换行符。`\\r` 是回车符的八进制值，`\\\
  n` 是换行符的八进制值。程序运行的操作系统决定了什么构成新行。某些系统只使用换行符，但某些系统两者都用。这个正则表达式处理了大多数情况。`\\r?\\n` 表示回车符可能不存在，但如果存在，也没关系。`\\\
  n` 表示换行符始终存在。简单来说，这个正则表达式删除了字符串中的所有换行符。末尾的 `g` 表示对字符串全局应用此正则表达式。如果我们去掉 `g`，则只会从字符串中移除第一个换行符。`第\
  \ 20 行` 结束了 `for` 循环，移除我们不希望字符串中包含的字符。\n\n```\n21:     print \"Book #$counter\\\
  n\";\n22:     print \"Title:     $record->{title}\\n\";\n23:     print \"Author:\
  \    $record->{author}\\n\";\n24:     print \"Publisher: $record->{publisher}\\\
  n\";\n25:     print \"ISBN:      $record->{isbn}\\n\";\n26:     print \"Cost:  \
  \    $record->{price}\\n\";\n27:     print \"Pub Date:  $record->{pubdate}\\n\"\
  ;\n28:     print \"\\n\";\n29:     $counter++;\n30: }\n```\n\n`第 21 行` 打印当前的书籍编号。`22-27\
  \ 行` 打印数据。`第 28 行` 打印一个换行符以分隔数据。`第 29 行` 增加 `$counter` 以保持书籍编号正确。`第 30 行` 结束 `while`\
  \ 循环，由于我们删除了任何领先空格，程序的输出是整齐的。如下所示的程序输出是最好的：\n\n```\nBook #58\nTitle:     Palm Programming:\
  \ The Developer's Guide with CD-ROM\nAuthor:    Neil Rhodes Julie McKeehan\nPublisher:\
  \  O'Reilly & Associates, Incorporated\nISBN:      1565925254\nCost:      32.95\n\
  Pub Date:  December 1998\nBook #59\nTitle:     PalmPilot: The Ultimate Guide\nAuthor:\
  \    Tim O'Reilly (Editor)\nPublisher:  O'Reilly & Associates, Incorporated\nISBN:\
  \      1565924207\nCost:      29.95\nPub Date:  May 1998\nBook #60\nTitle:     UNIX,\
  \ with CD-ROM (Unleashed)\nAuthor:    Emmett Dulaney Susan Christopherson Fran Hatton\n\
  Publisher:  Sams\nISBN:      0672304023\nCost:      29.95\nPub Date:  November 1993\n\
  ```\n\n|  |  |\n|  |  |\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0130_split_000.htm)\
  \ ![Next Section](img/#LiB0145_split_000.htm) |\n| ![Team LiB](img/#_back.htm) |\
  \ ![Previous Section](img/#LiB0141_split_000.htm) ![Next Section](img/#LiB0147_split_000.htm)\
  \ |\n\n## 总结\n\n本章涉及了从数据库获取你的 Perl 程序的基础知识。回顾一下从数据库获取数据的多种方法（`fetch`、`fetchrow_arrayref`、`fetchrow_array`、`fetchall_arrayref`\
  \ 和 `fetchrow_hashref](#LiB0918_split_001.htm_918)`）。不要忘记 `fetch` 和 `fetchrow_arrayref`\
  \ 执行的操作完全相同。为了简洁起见，你可能只想使用 `fetch` 方法。\n\n请记住，如果你调用了 `fetchall_arrayref](#LiB0915_split_001.htm_915)`\
  \ 函数，如果你处理的是大量数据，则不应该使用它。此外，记住它只返回自上次 fetch 类型调用以来所剩余数据。\n\n\n\n\n\n虽然能够从数据库中获取数据很棒，但我们已经准备好进入下一个阶段——操作数据库中的数据。下一节将向你展示如何添加记录、删除记录以及更新现有记录。将这些内容加入到你不断增长的\
  \ Perl 数据库知识库中，你很快就能编写出强大的数据驱动型应用程序！\n\n## 程序列表\n\n列表 4-1 到 4-9 显示了本章中程序的完整代码。\n\
  \n### 列表 4-1: select.pl\n\n```\n01: #!/usr/bin/perl -w\n02: #\n03: # select1.pl\n\
