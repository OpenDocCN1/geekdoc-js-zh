  \ |\n\n### 创建简单报告\n\n最简单的报告是纯文本电子邮件，它是基于几个 SQL 查询构建的。在这种情况下，我们报告了上周的会话总数、不同用户的数量以及每个用户启动的会话数。\n\
  \n```\n01: #! /usr/bin/perl -w\n02: #\n03: # report_text.pl\n04: # Chapter 13\n\
  05: # Listing 1\n06: #\n07: use strict;\n08: use DBI;\n09: use MIME::Lite;\n```\n\
  \n`第 1 行` 告诉系统去哪里寻找 Perl 并开启警告。\n\n`第 2–6 行` 是关于程序的注释。\n\n`第 7 行` 加载 `strict` 模块。\n\
  \n`第 8 行` 加载 `DBI` 模块，用于我们的数据库访问。\n\n`第 9 行` 加载 `MIME::Lite` 模块用于我们的电子邮件功能。\n\n\
  ```\n10: my $dbh=DBI->connect(‘DBI:mysql:UserTrack’,’user’,’password’)\n11:    \
  \     or die(\"Cannot connect: $DBI::errstr\");\n12: my $messagebody;\n```\n\n`第\
  \ 10 行` 使用 `DBI->connect` 方法创建到数据库服务器的连接。连接尝试的结果作为数据库连接对象的引用返回，并存储在 `$dbh` 变量中。\n\
  \n`第 11 行` 是 `第 10 行`的延续。如果获取数据库连接出现问题，此行调用 `die` 方法并打印错误消息。\n\n`第 12 行` 包含了我们的标量变量\
  \ `$messagebody`。\n\n\n\n\n\n```\n38: my $message=MIME::Lite->new(\n39:        \
  \       From    => ‘reports@example.com’,\n40:               To      => ‘you@example.com’,\n\
  41:               Subject => ‘Weekly report’,\n42:               Data    => $messagebody\n\
  43:             );\n```\n\n`Lines 38–43` 创建并配置了 `MIME::Lite` 对象。显然，可以实现更复杂的操作，但发送报告所需要的仅此而已。\n\
  \n```\n44: $message->send;\n```\n\n`Line 44` 发送消息。\n\n## 创建更复杂的报告\n\n第一个示例展示了生成简单报告的速度有多快；但它也展示了一些出现的问题。在纯文本邮件中，几乎无法进行格式化，特别是表格，很少使用，或者外观非常难看。此外，更改报告中条目的顺序或布局需要编辑程序代码。\n\
  \n解决布局问题的一种方案是使用模板模块。与发送邮件一样，Perl 提供了许多此类模块可用；为了本章的目的，`HTML::Template` 是功能和易用性之间的一个合理折中方案。（其他值得研究的模块包括处于能力范围底端的\
  \ `Text::Template` 和处于高端的 `Template::Toolkit`。抵制自己发明自己的模板模块的诱惑，这已经被尝试过很多次了，而且现有的代码已经克服了大多数标准的陷阱。）\n\
  \n模板（尽管该模块命名如此，但可以是任何形式的文本，而不仅仅是 HTML）存储在与程序分离的运行时。在普通的布局命令之间穿插着特殊标签，程序生成的数据将放置在这些标签中。这允许在不编辑主程序文件的情况下更改布局，并且（更重要的是）允许从同一份软件生成多种格式的报告。\n\
  \n至于格式化问题的解决方案，一种方便的方法是使用 HTML 电子邮件。HTML 的优势在于相比纯文本，它对布局有更强大的控制；特别是 `<table>` 结构非常有用。\n\
  \n自然，报告的某些目标受众可能没有支持 HTML 的邮件阅读器。正如我们将看到的，在 `multipart/alternative (HTML)` 结构中同时包含一份报告的纯文本版本通常是一个好主意。模板系统让这变得非常简单。\n\
  \n本质上，这个示例通过使用 `HTML::Template` 生成了与之前示例相同的报告，但格式涵盖文本和 HTML 两种。\n\n```\n01: #! /usr/bin/perl\
  \ -w\n02: #\n03: # report_html.pl\n04: # Chapter 13\n05: # Listing 2\n06: #\n```\n\
  \n`Lines 1–6` 告诉系统哪里寻找 Perl，开启警告，并对程序提供了一些注释。\n\n```\n07: use strict;\n08: use DBI;\n\
  09: use HTML::Template;\n10: use MIME::Lite;\n```\n\n`Line 7` 加载了 `strict` 模块。\n\
  \n`Line 8` 加载了 `DBI` 模块，用于数据库访问。\n\n`Line 9` 加载了 `HTML::Template` 模块。\n\n`Line 10`\
  \ 加载了 `MIME::Lite` 模块。\n\n```\n11: my $dbh = DBI->connect(‘DBI:mysql:UserTrack’,’user’,’password’)\n\
  12         or die(\"Cannot connect: $DBI::errstr \");\n```\n\n`Lines 11–12` 创建到数据库的连接并将句柄存储在\
  \ `$dbh` 变量中。如果连接数据库出现问题，将调用 `die` 方法，程序终止并显示错误消息。\n\n```\n13: my @template;\n14:\
  \ $template[0]=HTML::Template->new(filename => ‘template_2.txt’);\n15: $template[1]=HTML::Template->new(filename\
  \ => ‘template_2.html’);\n```\n\n`Line 13` 声明了一个名为 `@template` 的数组。\n\n`Lines 14–15`\
  \ 创建了两个独立的 `HTML::Template` 对象，每个对象对应一种使用的格式。它们基于独立的文件，可以独立进行编辑。虽然每个对象中放入了相同的数据，但不同的处理产生了不同的输出。（查看\
  \ `perldoc HTML::Template` 获取关于 `HTML_TEMPLATE_ROOT` 环境变量的文档以及指定模板文件位置的其他方法。）为了简单见，你可能想使用绝对文件名。但默认情况下，程序首先在它所在的目录中查找。\n\
  \n```\n16: my ($totalusers)=\n17:   $dbh->selectrow_array(\"SELECT COUNT(DISTINCT\
  \ user_id)\n18:                          FROM session\n19:                     \
  \     WHERE first_used >\n20:                            DATE_SUB(SYSDATE(),INTERVAL\
  \ 7)\n```\n\n`Line 16` 声明了一个标量变量并将 `$dbh->selectrow_array(\"SELECT COUNT(DISTINCT\
  \ user_id) FROM session WHERE first_used > DATE_SUB(SYSDATE(),INTERVAL 7)\")` 的结果存入其中。\n\
  \n`Lines 17–20` 创建并执行了我们报告的 SQL 语句。\n\n```\n21: foreach my $tmpl (@template) {\n\
  22:   $tmpl->param(totalusers => $totalusers);\n23: }\n```\n\n`Line 21` 开始一个 `foreach`\
  \ 循环，遍历 `@template` 数组。循环每次执行时都会设置 `$tmpl` 变量的值。\n\n`Line 22` 将 `totalusers` 参数传递给模板。\n\
  \n`Line 23` 结束 `foreach` 循环。\n\n```\n24: my $totalsessions=\n25:   $dbh->selectrow_array(\"\
  SELECT COUNT(*)\n26:                          FROM session\n27:                \
  \          WHERE first_used >\n28:                            DATE_SUB(SYSDATE(),INTERVAL\
  \ 7)\n```\n\n`Line 24` 声明了一个标量变量并将 `$dbh->selectrow_array(\"SELECT COUNT(*) FROM\
  \ session WHERE first_used > DATE_SUB(SYSDATE(),INTERVAL 7)\")` 的结果存入其中。\n\n```\n\
  29: foreach my $tmpl (@template) {\n30:   $tmpl->param(totalsessions => $totalsessions);\n\
  31: }\n```\n\n`Line 29` 开始一个 `foreach` 循环，遍历 `@template` 数组。循环每次执行时都会设置 `$tmpl`\
  \ 变量的值。\n\n`Line 30` 将 `totalsessions` 参数传递给模板。\n\n`Line 31` 结束 `foreach` 循环。\n\n\
  ```\n32: my $sth = $dbh->prepare(\"SELECT count(*),username\n33:               \
  \         FROM session\n34:                          WHERE first_used >\n35:   \
  \                         DATE_SUB(SYSDATE(),INTERVAL 7)\n36:                  \
  \        AND user_id=user.id\n37:                        GROUP BY username\");\n\
  ```\n\n`Lines 32–37` 准备我们下一个报告项的 SQL 语句，并将准备好的句柄存储在新定义的 `$sth` 变量中。\n\n```\n38:\
  \ $sth->execute;\n39: my @usersession;\n```\n\n`Line 38` 执行准备好的语句。\n\n`Line 39`\
  \ 声明了一个新数组 `@usersession`。\n\n```\n40: while (my ($count, $user) = $sth->fetchrow_array)\
  \ {\n41:   push @usersession, {user  => $user,\n42:                      count =>\
  \ $count};\n43: }\n```\n\n`Line 40` 开始一个 `while` 循环，只要 `$sth->fetchrow_array` 继续返回数据。循环每次执行时，$sth->fetchrow_array`\
  \ 的当前值会被存入 `$count` 和 `$user` 变量中。\n\n`Lines 41–42` 将一个包含用户和计数的匿名哈希引用推送到 `@usersession`\
  \ 数组中。\n\n`Line 43` 结束 `while` 循环。\n\n```\n44: foreach my $tmpl (@template) {\n\
  45:   $tmpl->param(usersession => \\@usersession);\n46: }\n```\n\n`Line 44` 开始一个\
  \ `foreach` 循环，遍历 `@template` 数组。循环每次执行时都会设置 `$tmpl` 变量的值。\n\n\n\n\n\n`Line 45`\
  \ 将 `usersession` 参数以及包含其值的数组引用传递给由 `$tmpl` 引的当前模板。\n\n`Line 46` 结束了 foreach 循环。\n\
  \n```\n47: $sth->finish;\n48: $dbh->disconnect;\n```\n\n`Line 47` 调用 `finish` 方法来清理\
  \ `$sth` 语句句柄。\n\n`Line 48` 调用 `disconnect` 方法断开数据库连接。\n\n```\n49: my $message =\
  \ MIME::Lite->new(\n50:               From    => ‘reports@example.com’,\n51:   \
  \            To      => ‘you@example.com’,\n52:               Subject => ‘Weekly\
  \ report’,\n53:               Type    => ‘multipart/alternative’\n54:          \
  \   );\n```\n\n`Lines 49–54` 准备电子邮件消息。与之前直接在消息构造函数中包含文本不同，这里我们通过将 `Type` 参数设置为 `multipart/alternative`（在此例中为文本和\
  \ HTML），指定此消息以利用 MIME 标准的力量。\n\n```\n55: $message->attach(Type => ‘text/plain’,\n\
  56:                  Data => $template[0]->output);\n57: $message->attach(Type =>\
  \ ‘text/html’,\n58:                  Data => $template[1]->output);\n59: $message->send;\n\
  ```\n\n`Lines 55–58` 使用其 `output` 方法将每个模板对象转换为包含原始模板的标量——带有程序添加的插值数据。然后，这些标量被传递给\
  \ `MIME::Lite` 的 `attach` 方法，将其将其添加到正在构建的消息中。\n\n`Line 59` 按照之前的方式发送消息。\n\n两个模板文件如下：\n\
  \ntemplate_2.txt\n\n| **![示例开始](img/_1.gif)** |\n\n```\nTotal users: <tmpl_var name=totalusers>\n\
  Total sessions: <tmpl_var name=totalsessions>\nSessions per user:\n<tmpl_loop name=usersession><tmpl_var\
  \ name=user>: <tmpl_var name=count>\n</tmpl_loop>\n```\n\n| **![示例结束](img/_1.gif)**\
  \ |\n\n|  |\n\n`<tmpl_var>` 标签引入了一个要在最终输出中插值的变量。`<tmpl_loop>` 引入了一个循环；注意，循环外部定义的变量不会自动出现在循环内部，如果需要，则必须显式定义。由于\
  \ `HTML::Template` 总是传递每一个新行，`usersession` 循环保持在一行上，避免了最终输出中出现额外的换行。\n\ntemplate_2.html\n\
  \n| **![示例开始](img/_1.gif)** |\n\n```\n<html>\n<head>\n<title>Weekly report</title>\n\
  </head>\n<<body>\n<p>Total users: <tmpl_var name=totalusers escape=html></p>\n<p>Total\
  \ sessions: <tmpl_var name=totalsessions escape=html></p>\n<p>Sessions per user:\n\
  <table>\n<tr><td>User</td><td>Logins</td></tr>\n<tmpl_loop name=usersession>\n<tr>\n\
  <td><tmpl_var name=user escape=html></td>\n<td><tmpl_var name=count escape=html></td>\n\
  </tr>\n</tmpl_loop>\n</table></p></body></html>\n```\n\n| **![示例结束](img/_1.gif)**\
  \ |\n\n|  |\n\n前面的 HTML 模式模板比纯文本模板更复杂，尽管 HTML 模式模板包含更多非插值文本。注意 `<tmpl_var>` 标签的\
  \ `escape=html` 参数；这会导致任何可能被特殊解释的正文（例如符号 `<`、`>` 或 `&`）自动转换为编码等效值，以便安全地发送到 Web 浏览器。尽管在这种特定情况下没有必要，但使用\
  \ `escape=html` 是一个应该养成的习惯。\n\n|  |  |\n\n|  |  |\n\n| ![LiB 团队](img/#_back.htm)\
