  \ 的购物车\n\n## 概述\n\nWeb 购物车如今是常见的工具。通过购物车，你可以在在线目录中浏览，并在购物过程中将物品添加到购物车中。这与在超市买东西非常相似。\n\
  \n整个购物车的想法并不局限于用于电子商务网站。购物车程序可以用于存储用户偏好、投票计票、得分以及你能想象到的几乎任何其他内容。\n\n我们在本章中整合的购物车系统并不是一个完整的、即插即用的电子商务应用程序。相反，我们使用了一些已经构建的工具，并创建了一个可以在其基础上构建的框架。我们可以将其构建为电子商务应用程序，也可以简单地用于某些物品的库存。\n\
  \n如果你还记得第 12 章，我们创建了一个基于 SOAP 的目录。在本示例中，我们使用该目录作为我们的“产品目录”。此外，如果你能翻出绑定哈希（tied-hash）\
  \ 章节的代码，我们也使用了其中很大一部分内容。要实现购物车，我们需要支持会话（sessions）的概念。但 HTTP 不支持会话——服务器只知道针对 URL\
  \ 的单个不相关的请求。但是通过使用 Cookie，我们可以实现会话。本章的新之处在于，我们将购物车的内容作为每个会话数据的一部分进行存储。我们研究过的绑定哈希方法非常适合这种需求。\n\
  \n我们的购物车应用程序将具有以下功能：\n\n* 查看目录列表\n* 将物品添加到购物车\n* 从购物车中移除物品\n* 显示特定物品\n* 显示带总计的购物车\n\
  * 显示带总计的发票\n\n这些功能应该是任何需要购物车的类 Web 应用程序的绝佳起点。\n\n我们再次使用模板来生成 HTML 输出。通过模板将 Perl\
  \ 代码与 HTML 分离，确实可以让事情变得更容易。你可以在本章末尾以及本书的配套网站上找到这些模板的代码。\n\n## 构建购物车\n\n本节包含了你可以用于构建基于\
  \ Web 的购物车的代码描述。\n\n### BasicSession.pm\n\n我们将整个购物车建立在关于绑定哈希的章节中创建的 `BasicSession`\
  \ 模块之上。然而，由于我们不仅存储用户偏好，还要存储物品购物车，因此我们需要对代码进行一些修改。\n\n需要将 `@EXPORT = qw(Wrap_Page\
  \ Get_Session);` 更改为：\n\n```\n@EXPORT = qw(Wrap_Page Get_Session Print_Page);\n\
  ```\n\n我们需要在不包装（wrapping）的情况下打印某些模板，因此我们需要导出 `Print_Page`。这就是对 `BasicSession.pm`\
  \ 的全部修改。你能相信吗？我喜欢早晨闻到可重用代码的味道！\n\n目录程序用于显示可以添加到购物车的物品列表。该程序使用 SOAP 目录来获取整个列表。图 15-1\
  \ 显示了该目录。请注意，为了书籍打印，这些字体已经大幅放大了。\n\n![点击展开](img/fg1501_0.jpg) 图 15-1：目录列表\n\n当你点击“添加物品”（Add\
  \ Item）时，该物品会被添加到购物车中。让我们来看看我们为此使用的代码。\n\n### catalog.cgi\n\n```\n01: #!/usr/bin/perl\
  \ -wT\n02: use strict;\n03: use SOAP::Lite;\n04: use CGI qw(:standard);\n05: use\
  \ lib qw(.);\n06: use BasicSession;\n```\n\n**第 1 行**告诉系统去哪里查找 Perl 并开启警告和污染检查（taint\
  \ checking）。\n\n**第 2 行** 加载 `strict` 模块。\n\n**第 3 行** 加载 `SOAP::Lite` 模块。我们需要它来访问\
  \ SOAP 目录。\n\n**第 4 行** 加载 `CGI` 模块。\n\n**第 5 行** 加载 `lib`。\n\n**第 6 行** 加载 `BasicSession`\
  \ 模块。\n\n```\n07: our $sess;\n08: my %cart;\n```\n\n**第 7 行** 声明 `$sess`。\n\n**第\
  \ 8 行** 声明 `%cart`。\n\n```\n09: $sess = Get_Session();\n10: tie %cart,\n```\n\n\
  **第 9 行** 使用 `Get_Session()`。\n\n**第 10 行** 绑定 `%cart`。\n\n```perl\n11: my $add_to_cart\
  \ = \n12: %cart;\n```\n\n**第 11 行** 声明 `$add_to_cart`。\n\n**第 12 行** 使用 `%cart`。\n\
  \n```perl\n13: my $remove;\n14: delete %cart;\n```\n\n**第 13 行** 声明 `$remove`。\n\
  \n**第 14 行** 删除 `%cart`。\n\n```perl\n15: my $products = SOAP::Lite\n16:   uri('http://goliath.per.net/Catalog')\n\
  17:   proxy('http://goliath.per.net/cgi')\n18:   Get_List()\n19:   result; \n```\n\
  \n**第 15 行** 声明 `$products`。\n\n**第 16 行** 是 `uri()`。\n\n**第 17 行** 是 `proxy()`。\n\
  \n**第 18 行** 是 `Get_List()`。\n\n**第 19 行** 是 `result`。\n\n```perl\n20: Print_Page(\"\
  ./templates\", \"header.tmpl\", \\%cart);\n21: Print_Page(\"./templates\", \"catalog_header.tmpl\"\
  , \\%cart);\n```\n\n**第 20 行** 调用 `Print_Page()`。\n\n**第 21 行** 调用 `Print_Page()`。\n\
  \n```perl\n22: for my $p (@$products){\n23:     print qq(\n24:       <<tr><td>\n\
  25:  [<a href=\"catalog.cgi?add_to_cart=$p->[1]\">Add Item</a>]\n26:       </td><td>\n\
  27:   <a href=\"item_details.cgi?item_num=$p->[1]\">$p->[1]</a>\n28:       </td><td>$p->[0]\n\
  29:       </td><td>&nbsp;$p->[2]\n30:       </td><td align=\"center\">&nbsp;$item{$p->[1]}\n\
  31:       </td><td><td>\n32:           [<a href=\"catalog.cgi?remove=$p->[1]\">Delete</a>]\n\
  33:       </td></tr>\\n);\n34: }\n```\n\n\n\n\n\n`Line 22` 开始一个循环，遍历由 `$products`\
  \ 引用的数组中的所有值。\n\n`Line 23` 开始一个 qq 块，用于打印目录数据中某一行表格的 HTML。\n\n`Lines 24–32` 打印目录数据中的一行表格。`$products`\
  \ 持有一个数组数组的引用。因此，在每次循环中，`$p` 实际上都是对数组的引用。注意，我们通过箭头运算符 `$p->[1]` 等来访问这些项目。\n\n`Line\
  \ 33` 关闭了在 `line 22` 处开始的 for 循环。\n\n```\n34: Print_Page(\"./templates\", \"catalog_footer.tmpl\"\
  , \\%cart);\n```\n\n`Line 34` 最后通过打印 `catalog_footer.tmpl` 模板中的 HTML 来结束程序。\n\n\
  目录程序就到此结束了。由于我们重用了代码并使用 SOAP 服务器向我们发送目录数据，因此我们能够节省了大量时间。\n\n接下来，我们来介绍 `item_details.cgi`\
  \ 程序。该程序与我们在第 12 章中创建书籍目录时使用的脚本类似。然而，这次我们添加了用于操作购物车的链接。图 15-2 包含了查看特定项目时发生情况的视图。\n\
  \n![点击展开](img/fg1502_0.jpg)\n\n图 15-2：项目详情\n\n注意底部的链接和“购物车数量 (Qty in Cart)”项目；这些是为购物车添加的。\n\
  \n`item_details.cgi`\n\n| **![示例开始](img/_1.gif)** |\n\n```\n01: #!/usr/bin/perl\
  \ -wT\n02: use strict;\n03: use CGI qw(:standard);\n04: use SOAP::Lite;\n05: use\
  \ XML::Simple;\n06: use lib qw(.);\n07: use BasicSession;\n```\n\n| **![示例结束](img/_1.gif)**\
  \ |\n\n|  |\n\n`Line 1` 告诉系统去哪里寻找 Perl，并开启警告和污染检查。\n\n`Line 2` 加载 `strict` 模块。\n\
  \n`Line 3` 加载 CGI 模块及其 `:standard` 函数。\n\n`Line 4` 加载 `SOAP::Lite` 模块，以便我们可以访问 SOAP\
  \ 服务器。\n\n`Line 5` 加载 `XML::Simple` 模块。我们正在访问另一种 SOAP 函数；这次，SOAP 服务器返回 XML 数据，因此我们需要能够解析目录数据。\n\
  \n`Line 6` 告诉 Perl 在当前目录中查找模块。\n\n`Line 7` 加载 `BasicSession` 模块。\n\n```\n08: our\
  \ $sess;\n09: my  %session;\n```\n\n`Line 8` 使用 `our` 函数声明变量 `$sess`。通过使用 `our`\
  \ 函数，我们能够从 `BasicSession` 模块访问此数据。\n\n`Line 9` 声明 `%session` 哈希表（hash）。在该程序中我们已经有一个名为\
  \ `%cart` 的哈希表。为了方便代码重用，我们将添加到此程序中的哈希表重命名了。\n\n```\n10: $sess = Get_Session();\n\
  11: tie %session, ‘BasicSession’;\n```\n\n`Line 10` 调用 `Get_Session` 模块来获取/设置该用户的会\
  \ cookie。\n\n`Line 11` 将 `%session` 哈希表绑定到 `BasicSession` 模块。\n\n```\n12: my $input\
  \ = param(‘item_num’);\n```\n\n`Line 12` 声明了一个名为 `$input` 的标量变量，并将其设置为调用 `param`\
  \ 函数 `param(‘item_num’);` 返回的值。\n\n```\n13: my $data = SOAP::Lite\n14:   -> uri(‘http://goliath.perlguy.net/Catalog’)\n\
  15:   -> proxy(‘http://goliath.perlguy.net/cgi-\n                bin/soap_server.cgi’)\n\
  16:   -> Get_Product_Data($input)\n17:   -> result;\n```\n\n`Line 13` 声明了一个名为 `$data`\
  \ 的标量变量，并将其赋值为调用 `SOAP::Lite` 模块返回的值。`Get_Product_Data` 返回的值是一个组成 XML 文档的字符串。\n\n\
  `Lines 13–17` 实际上是 `SOAP::Lite` 模块中多个串联的方法。这些命令构成了一个从 SOAP 服务器获取数据的 SOAP 客户端。\n\n\
  `Line 14` 告诉 SOAP 客户端我们正在调用的服务的 URI 或命名空间。\n\n`Line 15` 是我们正在联系的 SOAP 服务器地址。\n\n\
  `Line 16` 是我们在 SOAP 服务器上调用的远程函数。我们将 `$input` 中的值传递给 `Get_Product_Data` 函数。\n\n`Line\
  \ 17` 调用 `result` 方法，该方法返回我们所调用的函数结果。\n\n|  | 注意 | 注意，`result` SOAP 方法不需要像我们之前使用的方法那样进行更改。该模块已经返回了我们所需的所有数据。\
  \ |\n\n```\n18: $data =~ s/\\&amp;|\\&/\\&amp;/g;\n19: my $item = XMLin($data);\n\
  ```\n\n`Line 18` 将返回的 XML 文档中的任何转义后的 &（`&amp;`）或单独的 &（`&`）替换为等 HTML 实体（`&amp;`）。XML\
  \ 文档中的普通 & 在解析时会导致错误。我们在搜索中包含 `&amp;` 是为了确保不会将已经标记的 `&amp;` 变为 `&amp;amp;`。\n\n\
  `Line 19` 声明了一个名为 `$item` 的标量变量。该新标量变量设置为调用 `XMLin` 函数返回的值。XMLin` 是 `XML::Simple`\
  \ 模块的一部分；它返回一个包含解析后的 XML 文档的哈希引用。\n\n```\n20: ++$session{$item};\n```\n\n`Line 20`\
  \ 为项目 `add_to_cart` 增加 `$session{$item}`。\n\n```\n21: my $cart_qty = param(‘qty’);\
  \ \n22: if ($cart_qty) {\n23:   $session{$item} += $cart_qty;\n24: }\n```\n\n`Line\
  \ 21` 声明标量变量 `$cart_qty` 并将其设置为调用 `param` 函数 `param(‘qty’)` 返回的值。\n\n`Line 22` 检查\
  \ `$cart_qty` 是否存在。\n\n`Line 23` 将 `$session{$item}` 增加 `$cart_qty` 的值。\n\n`Line\
  \ 24` 关闭 `if` 块。\n\n`Line 25` 显示购物车。\n\n```\n26: Print_Page(\"./templates\", \"\
  cart_footer.tmpl\", \\%cart);\n```\n\n`Line 26` 调用 `Print_Page` 函数来打印 `cart_footer.tmpl`\
  \ 模板中的 HTML。\n\n\n\n\n\n`Line 10` 使用 `Get_Session` 函数来获取/设置此用户的会 cookie。这允许我们通过存储一个会话数据库表用于其唯一\
  \ ID 的 cookie，从而在不同页面之间跟踪用户。\n\n`Line 11` 将 `%session` 哈希表绑定到 `BasicSession` 模块中的方法。通过将哈希表绑定到\
  \ `BasicSession`，我们能够修改哈希表的行为，并仅通过对哈希进行常规操作即可直接修改数据库表。\n\n```\n12: my $add_to_cart\
  \ = param(‘add_to_cart’);\n13: ++$session{$add_to_cart} if($add_to_cart);\n```\n\
  \n`Line 12` 声明了一个名为 `$add_to_cart` 的变量，并将其设置为调用 `param` 函数返回的数值——`param(‘add_to_cart’`。\n\
  \n`Line 13` 如果 `$add_to_cart` 包含值，则将 `$session` 中键为 `$add_to_cart` 的哈希值加 1。\n\n\
  ```\n14: my $remove= param(‘remove’);\n15: delete $session{$remove}; \n```\n\n`Line\
  \ 14` 声明了一个名为 `$remove` 的变量，并将其设置为调用 `param` 函数返回的数值——`param(‘remove’)`。\n\n`Line\
  \ 15` 从 `%session` 哈希表中删除键为 `$remove` 的成员。如果 `%session` 哈希表中不存在键为 `$remove` 的项目，则什么都不会发生。\n\
  \n```\n16: my $products = SOAP::Lite\n17:   -> uri(‘http://goliath.perlguy.net/Catalog’)\n\
  18:   -> proxy(‘http://goliath.perlguy.net/cgi-\n                bin/soap_server19.cgi’)\n\
  19:   -> Get_Product_List()\n20:   -> result;\n```\n\n`Line 16` 声明了一个名为 `$products`\
  \ 的标量变量，并将其赋值为调用 `SOAP::Lite` 模块返回的数值。由于 `Get_Product_List` SOAP 方法返回一个引用数组数组，因此一个引用存储在\
  \ `$products` 中。\n\n`Lines 16–20` 实际上是 `SOAP::Lite` 模块中的多个方法串联在一起。这些命令组成了一个从 SOAP\
  \ 服务器获取数据的 SOAP 客户端。\n\n`Line 17` 告诉 SOAP 客户端我们要调用的服务的 URI 或命名空间。\n\n`Line 18` 是我们要联系的\
