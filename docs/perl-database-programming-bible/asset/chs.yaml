  \ | ![Previous Section](img/#LiB0570_split_000.htm) ![Next Section](img/#LiB0578_split_000.htm)\
  \ |\n\n### 创建简单报告\n\n最简单的报告是纯文本电子邮件，它是基于几个 SQL 查询构建的。在这种情况下，我们报告了上周的会话总数、不同用户的数量以及每个用户启动的会话数。\n\
  \n```\n01: #! /usr/bin/perl -w\n02: #\n03: # report_text.pl\n04: # Chapter 13\n\
  05: # Listing 1\n06: #\n07: use strict;\n08: use DBI;\n09: use MIME::Lite;\n```\n\
  \n`第 1 行` 告诉系统去哪里寻找 Perl 并开启警告。\n\n`第 2–6 行` 是关于程序的注释。\n\n`第 7 行` 加载 `strict` 模块。\n\
  \n`第 8 行` 加载 `DBI` 模块，用于我们的数据库访问。\n\n`第 9 行` 加载 `MIME::Lite` 模块用于我们的电子邮件功能。\n\n\
  ```\n10: my $dbh=DBI->connect(‘DBI:mysql:UserTrack’,’user’,’password’)\n11:    \
  \     or die(\"Cannot connect: $DBI::errstr\");\n12: my $messagebody;\n```\n\n`第\
  \ 10 行` 使用 `DBI->connect` 方法创建到数据库服务器的连接。连接尝试的结果作为数据库连接对象的引用返回，并存储在 `$dbh` 变量中。\n\
  \n`第 11 行` 是 `第 10 行`的延续。如果获取数据库连接出现问题，此行调用 `die` 方法并打印错误消息。\n\n`第 12 行` 包含了我们的标量变量\
  \ `$messagebody`。\n\n[/content]\n\n 抱歉，由于你提供的 `[content]` 内部包含了待翻译的英文，我已根据你的要求将其完整翻译为中文。\n\
  \n以下是完整的翻译结果：\n\n[content]\n`MIME::Lite` 是一个简单、独立的模块，用于生成和发送 MIME 格式的电子邮件。`MIME`\
  \ 是发送 HTML 或图形或任何非 ASCII 纯文本以外的内容所需的邮件协议。它不处理消息解析（这是一项完全不同的任务），也不需要除了基础 Perl 分发版中已安装的模块之外的任何模块。但它会自动处理任何必要的编码。\n\
  \n唯一的问题出现在 Windows 系统或那些没有自己邮件服务器的系统上；`MIME::Lite` 默认使用通过到 `sendmail` 的管道作为从系统发送邮件的默认方式。极少数的\
  \ Windows 系统可以提供此功能。在这种情况下，通常的方法是指定一个外部 SMTP 服务器。要让 `MIME::Lite` 使用此功能，只需添加：\n\n\
  ```\nMIME::Lite->send(‘smtp’,’hostname’);\n```\n\n（当然，将 `’hostname’` 替换为外部服务器的名字）到每个将发送邮件的脚本开头。或者，如果系统上有一个与\
  \ `sendmail` 作用类似的程序，请设置：\n\n```\nMIME::Lite->send(‘sendmail’,\"d:\\\\programs\\\
  \\sendmail.exe\");\n```\n\n上一行未在本章的示例中使用。\n\n### crontab\n\n`cron` 程序涵盖了本章标题中的“自动”部分。这是一个标准的\
  \ Unix 函数，会导致程序在指定时间运行。通常，报告程序在与 Web 服务器相同的用户用户 ID 下运行；这可能是 `Apache`、`www-data`\
  \ 或 `nobody`。在本例中，我们使用 `www-data`。\n\n你需要 shell 访问权限来为报告程序设置 `crontab` 列表，可以作为 `root`\
  \ 用户，也可以作为 `www-data` 用户。运行命令：\n\n```\ncrontab -u www-data -e\n```\n\n来编辑由 `www-data`\
  \ 用户自动执行的任务列表；在末尾添加新行即可。\n\n`crontab` 条目的格式可能有点复杂，请参阅 `crontab(5)` 的手动帮助页以获取有关 `crontab`\
  \ 文件格式的详细信息。不过，最常见的情况是每天运行一次、每周一次或每月一次。可以通过以下条目执行：\n\n```\n15 8 * * * /path/to/daily/program_name\n\
  15 8 * * 1 /path/to/weekly/program_name\nlast:15 8 1 * * /path/to/monthly/program_name\n\
  ```\n\n在每种情况下，每日程序都在上午 8:15（本地时间）运行。每周程序仅在周一运行；每月程序在每月的第一日运行。请注意，如果程序在 `STDOUT`\
  \ 或 `STDERR` 上产生输出，该输出将通过电子邮件发送给拥有该 `crontab` 条目的本地用户（在本例中为 `www-data`）。这很少用。尽量确保以这种方式通过\
  \ `cron` 运行的程序不要产生此类输出。在 Windows 下，可以使用 `Task Scheduler`（任务计划程序）来实现类似的目的。\n\n| \
