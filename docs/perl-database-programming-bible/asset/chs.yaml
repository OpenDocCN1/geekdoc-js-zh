  \ | 下一节](#LiB0130_split_000.htm) |\n\n## 分组你的输出\n\n对数据进行*分组 (GROUP BY)* 与对数据进行*排序\
  \ (ORDER BY)* 是不同的。当你使用 GROUP BY 语句时，你的数据将根据你在 SQL 语句中指定的字段进行分组。\n\n*分组在一起*意味着数据被聚合了，这样你就不会得到多条具有相同数据的记录。将此想象成数据桶。每个桶可以容纳若干物品，我们能够计算每个桶中有多少物品。\n\
  \n查看下面的示例；这个概念会变得清晰得多：\n\n\n\n\n\n```perl\n01: #!/usr/bin/perl -w\n02: #\n03: #\
  \ select5.pl\n04: # Chapter 4\n05: # Listing 4-5\n06: #\n07: use strict;\n08: use\
  \ DBI;\n09: my $dbh = DBI->connect\n(\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\"\
  ) \n10:     or die(\"Cannot connect: $DBI::errstr\");\n```\n\n`Lines 1-10` 重用了本章之前示例中的代码。\n\
  \n```perl\n11: my $sql = qq(SELECT COUNT(*), publisher FROM library GROUP BY publisher);\n\
  ```\n\n`Line 11` 是我们的 SQL 语句，但它看起来和其他的有些不同。\n\n这条 SQL 语句展示了 SQL `SELECT` 语句的一个我们尚未使用的功能。在\
  \ `SELECT` 之后、`FROM` 语句之前，我们没有放置星号（*），而是放置了一个 `COUNT(*)` 语句和一个数据库字段名。\n\n在英语中，这条\
  \ SQL 语句听起来是这样的：*从 library 表中选择匹配项的总数以及 publisher 字段，然后按 publisher 对结果进行分组。*\n\n\
  `COUNT(*)` 是我们分组的每个项目（在本例中为 `publisher`）的匹配次数。`publisher` 字段正是该字段——出版者字段。我们最终得到了每个出版者的书籍数量（因为有\
  \ `count(*)` 语句）以及每个出版者的名称（因为 `SELECT` 语句之后有 `publisher` 字段）。\n\n```perl\n12: my\
  \ $sth = $dbh->prepare($sql);\n13: $sth->execute;\n14: while(my $record = $sth->fetch){\n\
  15:     for my $field(@$record){\n16:         print \"$field \";\n17:     }\n18:\
  \     print \"\\n\";\n19: }\n```\n\n`Lines 12-19` 与我们在本章已经涵盖的代码非常相似。然而，我们删除了计数器代码，因为在这个例子中决定让数据库管理系统（DBMS）为我们处理计数。\n\
  \n正如下面的代码所示，此程序产生的输出与我们一直以来工作的程序非常不同。第一列是该出版者的书籍总数，其名称列在第二列。\n\n```\n8  Addison\
  \ Wesley Longman, Inc. \n1  Coriolis Group \n4  IDG Books Worldwide \n3  Macmillan\
  \ Computer Publishing \n1  Manning Publications Company \n5  McGraw-Hill Companies,\
  \ The \n1  New Riders Publishing \n22  O'Reilly & Associates, Incorporated \n2 \
  \ Prentice Hall \n8  Sams \n1  Specialized Systems Consultants \n3  Wiley, John\
  \ & Sons, Incorporated \n1  Wrox Press, Inc.\n```\n\n为什么使用 `COUNT` 函数而不是仅仅设置一个计数器并对其进行递增？设置并递增计数器意味着你必须遍历*每一个*数据项，并在*每次*都递增计数器以保持计数准确。如果你有一个较小的数据集，可能没什么大碍。但如果你有一个大型数据集，可能会花费很长的时间。SQL\
  \ 中的 `COUNT` 函数在内部经过了优化，不需要遍历每个数据元素即可获取计数。只要可能，请使用 `COUNT`；它绝对会对程序的执行速度产生影响。\n\n\
  此外，考虑这一点：如果你在前面的程序中使用计数器，你必须以某种方式跟踪每个出版者，仅对该出版者递增计数器。如果你有来自 100 个出版者的书，你的代码将变得非常难以管理！\n\
  \n## 其他 DBI 数据检索函数\n\n现在我们已经涵盖了使用 Perl DBI 从数据库表中获取数据的基础知识，我们将介绍 Perl 中获取数据的某些另替代方法。此外，我们还将尝试让我们的输出看起来更好看一点。\n\
  \n通过 Perl 和 DBI，你并不局限于使用 `fetch` 函数 `$sth->fetch` 来获取数据；有几种不同的方法可以实现。有 `fetchrow_array`、`fetchrow_arrayref`、`fetchrow_hashref`\
  \ 和 `fetchall_arrayref`。你可以选择你喜欢的任何方法或多种方法。你可能会习惯其中一种方法并最经常使用它，这完全没问题。记住，在 Perl\
  \ 中，*实现某项功能的方法不止一种。*\n\n`fetch` 和 `fetchrow_arrayref` 函数的作用完全相同，因此我们将跳过对 `fetchrow_arrayref`\
  \ 的任何进一步解释，因为 `fetch` 在我们之前的示例中已经介绍得得很好了。\n\n### fetchrow_array\n\n由于我们到此为止一直在处理引用，现在处理数组是合适的。下面的代码展示了\
  \ `fetchrow_array` 函数。\n\n```perl\n01: #!/usr/bin/perl -w\n02: #\n03: # select5.pl\n\
  04: # Chapter 4\n05: # Listing 4-5\n06: #\n07: use strict;\n08: use DBI;\n09: my\
  \ $dbh = DBI->connect\n(\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\") \n10:\
  \     or die(\"Cannot connect: $DBI::errstr\");\n```\n\n`Lines 1-10` 重用了本章之前示例中的代码。\n\
  \n```perl\n11: my $sql = qq(SELECT COUNT(*), publisher FROM library GROUP BY publisher);\n\
  ```\n\n`Line 11` 是我们的 SQL 语句，但它看起来和其他的有些不同。\n\n这条 SQL 语句展示了 SQL `SELECT` 语句的一个我们尚未使用的功能。在\
  \ `SELECT` 之后、`FROM` 语句之前，我们没有放置星号，而是放置了一个 `COUNT(*)` 语句和一个数据库字段名。\n\n在英语中，这条 SQL\
  \ 语句听起来是这样的：*从 library 表中选择匹配项的总数以及 publisher 字段，然后按 publisher 对结果进行分组。*\n\n`COUNT(*)`\
  \ 是我们分组的每个项目（在本例中为 `publisher`）的匹配次数。`publisher` 字段正是该字段——出版者字段。我们最终得到了每个出版者的书籍数量（因为有\
  \ `count(*)` 语句）以及每个出版者的名称（因为 `SELECT` 语句之后有 `publisher` 字段）。\n\n```perl\n12: my\
  \ $sth = $dbh->prepare($sql);\n13: $sth->execute;\n14: while(my $record = $sth->fetch){\n\
  15:     for my $field(@$record){\n16:         print \"$field \";\n17:     }\n18:\
  \     print \"\\n\";\n19: }\n```\n\n`Lines 12-19` 与我们在本章已经涵盖的代码非常相似。然而，我们删除了计数器代码，因为在这个例子中决定让数据库管理系统（DBMS）为我们处理计数。正如下面的代码所示，此程序产生的输出与我们一直以来工作的程序非常不同。第一列是该出版者的书籍总数，其名称列在第二列。\n\
  \n```\n8  Addison Wesley Longman, Inc. \n1  Coriolis Group \n4  IDG Books Worldwide\
  \ \n3  Macmillan Computer Publishing \n1  Manning Publications Company \n5  McGraw-Hill\
  \ Companies, The \n1  New Riders Publishing \n22  O'Reilly & Associates, Incorporated\
  \ \n2  Prentice Hall \n8  Sams \n1  Specialized Systems Consultants \n3  Wiley,\
  \ John & Sons, Incorporated \n1  Wrox Press, Inc.\n```\n\n为什么使用 `COUNT` 函数而不是仅仅设置一个计数器并对其进行递增？设置并递增计数器意味着你必须遍历*每一个*数据项，并在*每次*都递增计数器以保持计数准确。如果你有一个较小的数据集，可能没什么大碍。但如果你有一个大型数据集，可能会花费很长的时间。SQL\
  \ 中的 `COUNT` 函数在内部经过了优化，不需要遍历每个数据元素即可获取计数。只要可能，请使用 `COUNT`；它绝对会对程序的执行速度产生影响。\n\n\
  此外，考虑这一点：如果你在前面的程序中使用计数器，你必须以某种方式跟踪每个出版者，仅对该出版者递增计数器。如果你有来自 100 个出版者的书，你的代码将变得非常难以管理！\n\
  \n```perl\n15: no warnings;\n16: my $index = 0;\n```\n\n`Line 15` 关闭了警告。`Line 16`\
  \ 定义了一个变量 `$index` 并将其初始化为 0。\n\n```perl\n17:     for my $data(@array){\n18:   \
  \      print \"\\$array[$index] contains $data\\n\";\n19:         $index++;\n20:\
  \     }\n```\n\n`Line 17` 开始一个遍历 `@array` 的循环，并将 `@array` 中的当前值存入 `$data` 变量。`Line\
  \ 18` 打印程序输出的内容。`Line 19` 递增 `$index` 变量。\n\n```perl\n21:     print \"\\n\";\n22:\
  \ }\n```\n\n`Line 21` 打印一个换行符，以便每个记录的输出在视觉上隔开。`Line 22` 关闭了 while 循环。这一行标志着程序的结束。\n\
  \n下面的代码显示了此程序的输出。\n\n```\n$array[0] contains 1565922697\n$array[1] contains    \
  \ $34.95\n$array[2] contains Web Security and Commerce\n$array[0] contains 1565924924\n\
  $array[1] contains     $34.95\n$array[2] contains HTML: The Definitive Guide\n$array[0]\
  \ contains 0672308916\n$array[1] contains     $34.95\n$array[2] contains PERL Programming\
  \ Unleashed, with CD-ROM\n$array[0] contains 1565925254\n$array[1] contains    \
  \ $32.95\n$array[2] contains Palm Programming: The Developer's Guide with CD-ROM\n\
  $array[0] contains 1565924207\n$array[1] contains     $29.95\n$array[2] contains\
  \ PalmPilot: The Ultimate Guide\n$array[0] contains 0672304023\n$array[1] contains\
  \     $29.95\n$array[2] contains UNIX, with CD-ROM (Unleashed)\n```\n\n\n\n\n请记住，使用\
  \ `fetchrow_array` 方法得到的结果是一个真实的数组，而不是指向数组的指针。根据你使用数据的方式以及需要访问的数据量，处理数组可能比处理数组的引用更简单；选择权交由你。\n\
  \n### fetchall_arrayref\n\n`fetchall_arrayref` 函数的用法可能比 `fetchrow_array` 函数要复杂一点，因为你最终得到的是一个数组的引用，而该被引用数组的每一行都是指向*另一个*数组的引用，该内部数组包含了该行的数据。感到困惑了吗？接面的示例应该可以帮助你稍稍理清思路：\n\
  \n```\n01: #!/usr/bin/perl -w\n02: #\n03: # select7.pl\n04: # Chapter 4\n05: # Listing\
  \ 4-7\n06: #\n07: use strict;\n08: use DBI;\n09: my $dbh = DBI->connect\n(\"DBI:mysql:BibleBook\"\
  ,\"bookuser\",\"testpass\") \n10:     or die(\"Cannot connect: $DBI::errstr\");\n\
  11: my $sql = qq(SELECT * FROM library);\n12: my $sth = $dbh->prepare($sql);\n13:\
  \ $sth->execute;\n```\n\n`第 1-13 行` 与之前的程序几乎相同。如果你不确定这些行的作用，请重新查阅。\n\n```\n14: my\
  \ $ref = $sth->fetchall_arrayref;\n15: my $record_idx = 0;\n```\n\n`第 14 行` 是调用\
  \ `fetchall_arrayref` 函数。注意，我们不需要编写一个多次调用 fetch 函数的循环。\n\n`第 15 行` 了一个名为 `$record_idx`\
  \ 的变量并将其初始化为 0。这是我们的记录索引，是该程序的两个计数器第一个。\n\n```\n16: for my $rec (@$ref){\n```\n\n\
  `第 16 行`是一个 for 循环，用于遍历 `$ref` 引用的数组。在每次循环中，`$rec` 都会被设置为指向包含某行数据的数组的引用。（这是我们的第二个引用）。此时，通过\
  \ `$rec`，我们获得的数据与使用 fetch 方法时得到的数据相似。\n\n我们基本上拥有如下结构：引用→引用→数据\n\n```\n17:     no\
  \ warnings;\n18:     my $field_idx = 0;\n```\n\n`第 17 行` 关闭了该区块的警告。由于某些数据元素是空的，因此在关闭警告可以在程序运行时抑制这些信息。\n\
  \n`第 18 行` 声明了一个名为 `$field_idx` 的变量并将其初始化为 0。这是第二个计数器，字段索引；我们将用它来跟踪我们在数组中的位置（即我们处于哪个字段）。\n\
  \n```\n19:     for my $field (@$rec){\n20:         print \"ref[$record_idx][$field_idx]\
  \ = $field\\n\";\n21:         $field_idx++;\n22:     }\n```\n\n`第 19 行` 开始一个 for\
  \ 循环，遍历我们从 `第 16 行` 获取的当前数组引用。\n\n`第 20 行` 打印当前数据以及其引用的位置。程序的输出向你展示了它的样子。\n\n`第\
  \ 21 行` 将第二个计数器 `$field_idx` 加 1。\n\n`第 22 行` 关闭了内层 for 循环。\n\n```\n23:     $record_idx++;\n\
  24:     print \"\\n\";\n25: }\n```\n\n`第 23 行` 将第一个计数器 `$record_idx` 加 1。\n\n`第\
  \ 24 行` 打印一个换行符，以便我们在输出中从视觉上区分不同的记录。\n\n`第 25 行` 关闭了外层 for 循环。\n\n```\n26: print\
  \ \"\\n\";\n27: print \"$ref->[57][1]\\n\\n\";\n```\n\n`第 26 行` 打印一个换行符。\n\n`第 27\
  \ 行` 是如何从结果集中打印特定项目的示例。在这个示例中，我们只想打印特定记录中的某个特定字段——即 `$ref` 中 arrayref 中第 57 条记录的第\
  \ 1 个字段。即 `$ref->[57][1]`。\n\n下面的代码显示了该程序的输出。\n\n```\nref[57][0] = 1565925254\n\
  ref[57][1] = Palm Programming: The Developer's Guide with CD-ROM\nref[57][2] = Neil\
