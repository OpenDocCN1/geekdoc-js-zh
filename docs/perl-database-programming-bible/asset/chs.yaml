  \ = \"N/A\" unless $record->{$field};\n19:         $record->{$field} =~ s^\\W+//;\n\
  20:         $record->{$field} =~ s/\\s?\\n//g;\n21:     }\n22:     print \"Book\
  \ #$counter\\n\";\n23:     print \"Title: $record->{title}\\n\";\n24:     print\
