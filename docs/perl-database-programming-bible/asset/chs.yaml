  ```\n\n### 列表 9-6: footer.tmpl\n\n```html\n</body>\n</html>\n```\n\n\n\n\n本章将介绍事务（transactions）的概念，它是\
  \ SQL 的核心特性之一，也是提高任何数据库支持系统可靠性的简单方法。事务是一组被“组合”在一起的 SQL 查询语句。然后，如果任何一个或所有 SQL 查询语句由于任何原因失败，整个组都可以回滚，使得数据库完全恢复到我们开始事务之前的原始状态。我们将讨论事务、其方法，并最后查看一个展示事务运行的小型示例。\n\
  \n## 使用事务\n\nMySQL 最近才才引入了事务，而且它们仅适用于某些表类型（`InnoDB` 和 `BDB`）；这些表类型比其他类型慢，并且占用更多的内存和磁盘空间。如\
  \ `PostgreSQL` 或 `Oracle` 等其他 SQL 数据库支持事务；然而，即使在这些情况下，代码也会变得有些复杂。那么，你可能会问，是否应该引入复杂性和开销呢？\n\
  \n事务是确保数据完整性（data integrity）的手段。数据完整性只是一个形象的术语，意味着保持你的数据完整和正确。许多数据库操作被实现为多个 SQL\
  \ 语句；例如，一个在线购物的支付系统可能包含以下内容：\n\n* 根据购买金额减少客户的账户余额\n* 根据购买金额增加商户的账户余额\n* 订单发货\n\n\
  显然，如果第一步失败，错误检查程序应该中止后续步骤。然而，如果后面的步骤失败了呢？即使假设系统是完美的可靠，也许商户的账户已经关闭，或者商品不再售货。在这种情况下，客户必须收到退款；但撤销所有这些步骤是非常耗时且容易出错的。（如果在撤销过程中发生错误会怎样？）如果有一种方法可以以原子方式执行这些任务就好了：如果发生错误，所有的更改都会被拒绝。\n\
  \n自然，有这样一种方法：整个操作被封装在事务语句中，并被视为单一过程。如果任何阶段失败，整个过程都可以中止，并将数据库重置为初始状态。\n\n从本质上说，事务允许数据库将多语句过程处理得仅包含单个语句。要么全部成功，要么全部被拒绝。\n\
  \n所示，即使在完美可靠的系统中也可能发生故障。在实践中，系统故障也会发生。前端查询机器或数据库本身可能会故障，或者它们之间的通信可能会丢失。在任何一种情况下，数据库服务器都会中止整个事务，并将数据库恢复到事务开始之前的状态。\n\
  \n即使没有发生故障，事务在具有多个并发客户端访问的系统中仍然很有用；在现代计算环境中，这几乎适用于任何基于 Web 的系统。事务的使用可以为客户端独占使用创建一个数据库的“快照”。这不受其他地方更改的影响。这允许客户端软件将数据库视为单一的一致数据源，而不是不断检查以避免竞态条件（race\
  \ conditions）。竞态条件发生在两个或多个进程尝试同时读写同一记录/表/数据时。隔离程度在不同数据库之间略有不同，通常由客户端控制。具体细节请查看数据库系统的文档。对于多用户系统的理想解决方案是大量使用事务和显式锁（显式锁允许你阻止他人修改数据）；任何一种单独使用都是不够的。\n\
  \n在 SQL 中，事务通过三个关键字控制：\n\n* `BEGIN` 启动事务。\n* `COMMIT` 结束事务，要求数据库存储自该事务开始以来的所有更改。\n\
  * `ROLLBACK` 中止事务，将数据库恢复到事务中第一个语句之前的状态。如果在发出 `COMMIT` 之前丢失与客户端的连接，则会隐式执行 `ROLLBACK`。\n\
  \n许多数据库允许事务嵌套：可以 `BEGIN` 一个事务；对数据库进行操作；`BEGIN` 一个作为主事务的一部分的子序列语句；`COMMIT` 该序列，然后继续主事务。请咨询你的数据库服务器文档查看你使用的数据库是否支持嵌套事务。\n\
  \n## 事务与 Perl\n\n在 Perl DBI 的背景下，事务受到了一定限制，因为事务的持续时间不能超过单个数据库连接的持续。通常情况下，这不会成为问题。当出现问题时，可以通过重构控制流或使用持久化数据库句柄来解决。\n\
  \n事实上，这可能是一个有利条件。由于可以对同一个数据库建立多个连接，可以在事务环境中进行 `UPDATE` 和 `INSERT` 操作，同时 `SELECT`\
  \ 却通过不同的数据库句柄进行处理。当程序循环遍历 `SELECT` 语句的结果并根据这些结果更改数据库时，这非常有用。许多数据库在同一数据库句柄上提交事务时，会终止活跃的\
  \ `SELECT`。使用单独的句柄可能会增加程序的启动时间，但它解决了这个问题。\n\n当使用 `DBI->connect` 方法建立连接时，`AutoCommit`\
  \ 参数默认值为 1（即每个数据库命令存在于自己的事务中并立即生效）。然而，在 DBI 模块的未来版本中，无法保证这一点。显式指定 `AutoCommit` 是一个良好的习惯。该参数指定为\
  \ `connect` 函数第四个位置的哈希引用：\n\n```perl\nmy $dbh = DBI->connect(\n  (\"DBI:mysql:BibleBook\"\
  ,\"bookuser\",\"testpass\",\n  {AutoCommit => 1})\nor die(\"Cannot connect: $DBI::errstr\"\
  );\n```\n\n在连接建立后也可以更改 `AutoCommit`：\n\n```perl\n$dbh->{AutoCommit}=1;\n```\n\n\
  要启用事务，只需在 `connect` 调用或稍后的显式调用中将 `AutoCommit` 设置为 0。\n\n实际的事务控制方法如下。\n\n### BEGIN\n\
  \n在事务型数据库中，很少需要显式 `BEGIN` 语句。然而，由于 DBI 模块使事务变为可选，因此要求所有客户端使用 `begin_work` 方法启动事务语句：\n\
  \n```perl\n$dbh->begin_work\nor die(\"Database does not support transactions\");\n\
  ```\n\n如果 `AutoCommit` 开启，它将被关闭直到下次 `commit` 或 `rollback` 调用（见下文）。如果数据库不支持事务，`begin_work`\
  \ 将返回致命错误。\n\n某些数据库可能单独要求 `BEGIN` 语句；请查看文档。对于 PostgreSQL，发送：\n\n```perl\n$dbh->do('BEGIN');\n\
  ```\n\n### COMMIT\n\n在事务模式下操作时，显式要求 `COMMIT`。`COMMIT` 定义了事务的成功结束（如果 `AutoCommit`\
  \ 为 0，则返回单语句模式）。它通过 DBI 的 `commit` 方法实现：\n\n```perl\n$dbh->commit;\n```\n\n在发出 `COMMIT;`\
  \ 之前确保已经执行了所有可能的检查是非常值得的，否则事务系统的许多优势将会丢失。\n\n\n\n\n如果由于某些原因 `COMMIT` 失败（例如数据库突然崩溃），标准的\
  \ `DBI->errstr` 方法将显示错误。（如果在数据库连接处于单条语句模式时发出了 `COMMIT`，也会发生这种情况。）\n\n### ROLLBACK\n\
  \n通常，客户端软件在事务部分执行失败时会发出 `ROLLBACK`。它通过 DBI 的 `ROLLBACK` 方法实现：\n\n```\n$dbh->rollback;\n\
  ```\n\n与 `COMMIT` 方法一样，如果 `AutoCommit` 为 0，则执行回滚会将数据库连接恢复到单条语句模式。如果 `ROLLBACK` 失败（这只会在数据库已经处于单条语句模式时，或者在\
  \ MySQL 中，当事务中涉及某些非事务安全的表时才可能发生），则会抛出一个错误。\n\n如果在事务期间丢失了连接性，数据库服务器将假设执行 `ROLLBACK`。这里有一个例外：如果程序显式地断开连接（使用\
  \ `DBI->disconnect` 方法）且有未完成的事务，某些数据库（特别是 Oracle 和 Ingres）会自动提交未完成的语句；而其他数据库（如 Informix）则会回滚。在断开连接之前，请始终显式指定对未完成事务应如何处理。\n\
  \n| | 注意 | 如果程序由于错误条件断开连接，数据库驱动程序将始终发送 `ROLLBACK`。 |\n\n## 实践中的事务\n\n使用 Perl DBI\
  \ 事务最方便的方法是将与事务相关的所有 Perl 结构封装在单个 `eval{}` 块中，并在发生任何故障时调用 `die`。通过这种，可以同时处理数据库错误和程序的或其他故障，而无需程序员付出额外努力。\n\
  \n注意，并非所有不符合预期的情况都构成数据库或 Perl 错误。例如，从表中选择行时，即使没有行匹配选择条件，也不会失败。在这种情况下，最方便的方法是用 Perl\
  \ 代码显式地检查问题，并在检测到问题时通过 `die` 刻意抛出错误。这将调用错误处理程序，该程序（正如你将看到的）可以采取恰当的措施。\n\n此示例程序的目标是在\
  \ `pubslist` 表中构建出版商列表以及每个出版商在图书馆的书数量（该表应包含 \"publisher\" 和 \"count\" 字段）。\n\n```\n\
  01: #! /usr/bin/perl -w\n02: #\n03: # transaction.pl\n04: # Chapter 11\n05: # Listing\
  \ 1\n06: #\n07: use strict;\n08: use DBI;\n```\n\n第 1-8 行是数据库程序的标准。\n\n```\n09:\
  \ my $dbh = DBI->connect\n(\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\",\n\
  10:          {AutoCommit => 0, RaiseError => 1})\n11:  or die(\"Cannot connect:\
  \ $DBI::errstr\");\n```\n\n第 9-11 行扩展了连接命令，允许设置 `AutoCommit`（如前所述）和 `RaiseError`，后者会导致数据库命令失败时让\
  \ DBI 返回致命错误。\n\n```\n12: $dbh->begin_work;\n```\n\n第 12 行通知数据库一个事务即将发生。\n\n```perl\n\
  13:  eval {\n```\n\n第 13 行是最重要的创新。在这个块内部，致命错误不会像通常那样生效（导致程序立即终止）；相反，该块会终止，程序流继续。\n\
  \n```\n14:   $dbh->do(\"DELETE FROM pubslist\");\n```\n\n第 14 行删除了旧的出版商列表。\n\n```\n\
  15:    my $sth=$dbh->prepare(\"SELECT COUNT(*),publisher FROM library\n16:     \
  \                     GROUP BY publisher\");\n17:   $sth->execute;\n```\n\n第 15-17\
  \ 行现在应该熟悉了。注意，不需要捕获特定的错误。任何问题，无论是数据库错误还是客户端资源耗尽，都会抛出致命错误并被自动处理。\n\n```\n18:   while\
  \ (my ($count,$publisher)=$sth->fetchrow_array) {\n19:     my $publisherq=$dbh->quote($publisher);\n\
  20:     $dbh->do(\"INSERT INTO pubslist (publisher,count)\n21:               VALUES\
  \ ($publisherq,$count)\");\n22:   }\n```\n\n第 18-22 行将每个数据点插入另一个表。同样，这些应该是熟悉的内容。\n\
  \n```\n23:   $sth->finish;\n```\n\n第 23 行清理语句。\n\n```\n24: };\n```\n\n第 24 行是 `eval`\
  \ 块的结束。\n\n```\n25: if ($@) {\n```\n\n第 25 行确定是否发生了任何错误。每当有一个 eval 块时，如果有错误，`$@`\
  \ 将被设置为真值。\n\n```\n26:   $dbh->rollback;\n```\n\n第 26 行放弃操作。\n\n```\n27: }\n28:\
  \ else {\n29:   $dbh->commit;\n```\n\n第 27 行结束 `if` 块。第 28 行开始 `else` 块。\n\n```\n\
  30: }\n31: $dbh->disconnect;\n```\n\n第 30 行结束 `if..else` 块。第 31 行关闭数据库。\n\n处理事务的另一种方法是不设置\
  \ `RaiseError`，而是在每次调用后进行测试错误：\n\n```perl\nmy $errorstatus=0;\n$dbh->prepare($sql)\
  \ or $errorstatus=1;\n```\n\n然后在事务完成后检查 `$errorstatus`。然而，这仅在预期某些数据库调用返回错误且这些错误对处理过程不是致命的时才有用。作为一个一般原则，`eval{}`\
  \ 和 `RaiseError` 是使用事务最干净的方法，除非有压倒性的理由，否则应使用它们。\n\n### 注意\n\n某些命令在本质上是无法撤销的；执行它们会对数据库产生即永久的更改。在\
  \ MySQL 中，这些命令是：\n\n* `ALTER TABLE`\n* `BEGIN`\n* `CREATE INDEX`\n* `DROP DATABASE`\n\
  * `DROP TABLE`\n* `LOCK TABLES`\n* `RENAME TABLE`\n* `TRUNCATE`\n\n在事务模式下执行这些命令会立即终止当前事务，就像发出了\
  \ `COMMIT` 命令一样（特别注意列表中存在 `BEGIN`；在 MySQL 中无法“嵌套”事务）。其他数据库的用户也会遇到类似的限制，并应查阅其数据库文档以获取详情。\n\
  \n\n\n\n在本节中，你已经了解了如何使用 `BEGIN`、`COMMIT` 和 `ROLLBACK` 创建基础事务。请记住，并不是所有的数据库都支持事务，某些数据库对事务的支持与其他众不同。因此，在投入大型数据库项目之前，请咨询你的数据库服务器文档。\n\
  \n## MySQL 用户特别说明\n\n由于 MySQL 不支持所有类型表上的事务，因此数据库中的某些表是事务安全的，而另一些表（需要更快访问的表）则不是。如果事务包含了来自非事务安全表的数据，尝试\
  \ `ROLLBACK` 将导致错误。在编写用于 MySQL 事务的代码时，请务必注意底层的数据库结构。如果代码旨在迁移到各种系统（可能包含在使用旧版本 MySQL\
  \ 的系统），则不应使用事务。\n\n## 程序列表\n\n`Listing 10-1` 是本章中完整且不中断的代码示例。\n\n### 列表 10-1：实践中的事务\n\
  \n```\n01: #! /usr/bin/perl -w\n02: #\n03: # transaction.pl\n04: # Chapter 11\n\
  05: # Listing 1\n06: #\n\n07: use strict;\n08: use DBI;\n\n09: my $dbh = DBI->connect\n\
  (\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\",\n10:                       \
  \ {AutoCommit => 0, RaiseError => 1})\n11:           or die(\"Cannot connect: $DBI::errstr\\\
  n\");\n12: $dbh->begin_work; \n13: eval {\n14:   $dbh->do(\"DELETE FROM pubslist\"\
  );\n15:   my $sth=$dbh->prepare(\"SELECT COUNT(*),publisher FROM library\n16:  \
  \                        GROUP BY publisher\");\n17:   $sth->execute;\n18:   while\
  \ (my ($count,$publisher)=$sth->fetchrow_array) {\n19:     my $publisherq=$dbh->quote($publisher);\n\
  20:     $dbh->do(\"INSERT INTO pubslist (publisher,count)\n21:               VALUES\
  \ ($publisherq,$count)\");\n22:   }\n23:   $sth->finish;\n24: };\n25: if ($@) {\n\
  26:   $dbh->rollback;\n27: }\n28: else {\n29:   $dbh->commit;\n30: }\n31: $dbh->disconnect;\n\
  ```\n\n# 第三部分：Perl 与网络服务\n\n## 本部分\n\n- [第 11 章：Perl、XML 与数据库]\n- [第 12 章：创建基于 SOAP\
  \ 的目录]\n- [第 13 章：发送自动电子邮件报告]\n\n## 第 11 章：Perl、XML 与数据库\n\n## 概述\n\nXML 是如今几乎任何计算领域的热点。撇开那些术语不谈，大多数人没有意识到的一点是，XML\
  \ 并不是万能灵药。相反，XML 仅仅是一种数据格式，许多程序都懂得如何读取和写入它。XML 本身无非只是文本。但是，与可用的数百（甚至数千）种工具交织在一起，XML\
  \ 成为了一种强大的数据交换媒介。\n\nXML 的优势在于，一旦你将数据转换为 XML 格式，你就可以摆脱专有格式的负担，并按照你想要的方式切分和处理数据。本书是关于数据库的，而不是关于你能用\
  \ XML 做或不能用什么。因此，我们没有向你抛出一堆 XML 类型应用程序，而是涵盖了一个简短简单的应用程序，将我们的一个数据库导出为 XML 格式。\n\n\
  当你准备好将你的 XML 数据转换为任何你需要的内容时，请获取 *XML Bible* (Hungry Minds now Publishing, 2001,\
  \ ISBN 0-7)。这是一个非常好的资源，展示了利用 XML 数据能实现的真实威力。\n\n## 照片导出程序\n\n此程序从我们的 `photo-album`\
  \ 脚本获取数据，该脚本来自你之后将阅读的 Web 专辑。（是的，这只是第 11 章，但从照片册衍生的数据非常适合导出为 XML 格式。）此程序设计得相当通用；它应该能够在极少更改的情况下与其他简单的数据库配合。然而，这并不是终极的\
  \ XML 导出器。它只是简单。\n\n`photo_dumper.pl`\n\n```\n01: #!/usr/bin/perl -w\n02: use strict;\n\
  03: use DBI;\n```\n\n`第 1 行` 告诉系统哪里寻找 Perl 并开启警告标志。\n\n`第 2 行` 加载了 `strict` 模块。\n\
  \n`第 3 行` 加载了 `DBI` 模块以便我们可以连接到数据库。\n\n```\n04: my $dbh = DBI->connect(\"DBI:mysql:photoalbum\"\
  , \n                \"bookuser\",\"testpass\") \n05:     or die(\"Cannot connect:\
  \ $DBI::errstr\\n\");\n```\n\n`第 4 行` 声明了一个标量变量 `$dbh`，用于存储数据库连接句柄。`DBI->connect`\
  \ 方法将参数传递给 `DBI` 并建立数据库连接。`第 5 行` 是 `第 4 行` 的延续，如果连接数据库时出现问题，程序将中止。\n\n```\n06:\
  \ my %db;\n\n07: $db{name}  = \"photoalbum\";\n08: $db{album} = \"album_id\";\n\
  09: $db{photo} = \"img_id\";\n10: $db{f_key} = \"album_id\";\n```\n\n`第 6 行` 声明了一个哈希变量\
  \ `%db`。`第 7-10 行` 为 `%db` 哈希表填充了很快就会用到的数据。\n\n```\n11: my $main_table = \"album\"\
  ;\n12: my @sub_tables = qw{photo};\n```\n\n`第 11 行` 声明了一个标量变量 `$main_table` 并将其赋值为\
  \ `album`。`第 12 行` 声明了一个数组 `@sub_tables` 并为其添加了一个项：`photo`。如果你的数据库有更多表，可以填充此数组。\n\
  \n```\n13: Gen_Output();\n```\n\n`第 13 行` 仅仅是对 `Gen_Output` 函数的调用。该函数开始收集数据并打印结果。\n\
  \n```\n14: sub Gen_Output {\n15:     print qq(<?xml version=\"1.0\"?>\\n);\n16:\
  \     print start_tag($db{name}), \"\\n\";\n```\n\n`第 14 行` 开始定义 `Gen_Output` 函数。`第\
  \ 15 行` 打印 XML 头部标签。这是输出有效 XML 文档所需的。`第 16 行` 打印由 `start_tag` 子程序返回的值，并向其传递了 `$db{name}`。这是封装整个文档的标签。`start_tag`\
  \ 和 `end_tag` 子程序用于确保我们创建有效的 XML 标签。\n\n```\n17:     my @albums = Get_Keys($main_table);\n\
  \n18:     for my $tmp (@albums) {\n19:         print start_tag($main_table), \"\\\
  n\"; \n```\n\n`第 17 行` 调用 `Get_Keys` 函数并传递 `$main_table` 的值。该函数查询数据库并获取 `$main_table`\
  \ 的所有索引字段，存储在数组 `@albums` 中。这使得数组 `@albums` 包含了数据库中所有照片册的列表。\n\n`第 18 行` 开始一个 for\
  \ 循环，遍历每个专辑；当前的专辑索引存储在变量 `$tmp` 中。\n\n\n\n\n\n`Line 19` 打印由 `start_tag` 子程序返回的值，并将\
  \ `$main_table` 传递给。这会将每个专辑封装在 `<album>` 标签中。\n\n```\n20:         Print_Data($main_table,\
  \ $tmp, 3);\n\n21:         for my $sub_tbl (@sub_tables){\n22:             Do_SubTable($sub_tbl,\
  \ $tmp);    \n23:         }\n```\n\n`Line 20` 调用了 `Print_Data` 函数并传递了三个值：`$main_table`、`$tmp`\
  \ 和 `3`。`3` 是输出缩进的空格数（可选，但可以让打印后的文件更易阅读）。\n\n`Line 21` 开始了一个循环。该循环遍历 `@sub_tables`\
  \ 数组中的所有值。在每次循环中，当前的表名被存储在标量变量 `$sub_tbl` 中。\n\n`Line 22` 调用了 `Do_SubTable` 子程序，并传递了\
  \ `$sub_tbl` 和 `$tmp` 值。\n\n`Line 23` 结束了从 `line 21` 开始的循环。\n\n```\n24:        \
  \ print end_tag($main_table),\"\\n\";\n25:     }\n\n26:     print end_tag($db{name}),\
  \ \"\\n\"; \n27: }\n```\n\n`Line 24` 打印当传递 `$main_table` 时 `end_tag` 子程序返回的值。`end_tag`\
  \ 子程序返回一个与我们在 `line 19` 开始处的标签匹配的结束标签。\n\n`Line 25` 关闭了从 `line 18` 开始的块。\n\n`Line\
  \ 26` 使用 `end_tag` 子程序关闭封装整个输出的标签。\n\n`Line 27` 结束了该子程序。\n\n```\n28: sub Do_SubTable\
  \ {\n29:     my $table = shift;\n30:     my $rel   = shift;\n```\n\n`Line 28` 开始了\
  \ `Do_SubTable` 子程序。该子程序处理从子表中获取数据并打印它们的值。\n\n`Lines 29–30` 声明了一些标量变量，并使用 `shift`\
  \ 函数将传递给该函数的值存储到这些变量中。\n\n```\n31:     my @keys = Get_Keys($table, $rel);\n```\n\
  \n`Line 31` 调用了 `Get_Keys` 函数并将结果存储在 `@arr` 数组中。\n\n```\n32:     for my $key (@keys)\
  \ {\n33:         print \" \", start_tag($table), \"\\n\";\n34:         Print_Data($table,\
  \ $key, 4);\n35:         print \" \", end_tag($table), \"\\n\\n\";\n36:     }\n\
  37: }\n```\n\n`Line 32` 开始了一个循环，遍历 `@keys` 数组中的所有值。当前值存储在 `$key` 变量中。\n\n`Line 33`\
  \ 打印带有 `$table` 变量值的 XML 标签。\n\n`Line 34` 调用了 `Print_Data` 函数来打印此项目的数据。值 `$table`、`$key`\
  \ 和 `4` 被传递给 `Print_Data`。\n\n`Line 35` 打印与我们在 `line 33` 打印的标签对应的结束 XML 标签。\n\n\
  `Line 36` 关闭了此 for 循环。\n\n`Line 37` 结束了此子程序。\n\n```\n38: sub Get_Keys {\n39:   \
  \  my $table     = shift;\n40:     my $index     = shift;\n41:     my @values  \
  \  = ();\n```\n\n`Line 38` 开始了 `Get_Keys` 子程序。\n\n`Lines 39–40` 声明了一个标量变量并使用 `shift`\
  \ 函数读取传递给该子程序的前两个值。\n\n`Line 41` 声明了一个名为 `@values` 的数组，通过将其赋值为 `()` 来确保它是空的。\n\n\
  ```\n42:     my $sql = qq{SELECT $db{$table} FROM $table}; \n43:     $sql   .= qq{\
  \ WHERE $db{f_key} = $index} if($index);\n44:     my $sth = $dbh->prepare($sql);\n\
  ```\n\n`Line 42` 声明了一个名为 `$sql` 的标量变量，并用构成我们要执行的 SQL 语句的字符串填充它。\n\n`Line 43` 如果\
  \ `$index` 变量包含数据，则向 SQL 语句添加 WHERE 子句。\n\n`Line 44` 准备 SQL 语句并将处理语句的句柄存储在新的标量变量\
  \ `$sth` 中。\n\n```\n45:     $sth->execute();\n\n46:     while(my @arr = $sth->fetchrow_array)\n\
  \            { push @values, @arr; }\n\n47:     return(@values);\n48: }\n```\n\n\
  `Line 45` 在语句句柄上调用 `execute()` 方法来运行 SQL 查询。\n\n`Line 46` 是一个 while 循环，遍历 SQL 调用返回的值并将所有结果存储在名为\
  \ `@values` 的数组中。该行的第一部分在 SQL 查询返回的数据上调用 `fetchrow_array` 方法，并将数据数组存储在 `@arr` 数组中。然后，`push\
  \ @values, @arr` 将 `@arr` 中的数据推送到 `@values` 数组中。这有效地合并了 `@arr` 中的数据。\n\n`Line 47`\
  \ 返回 `@values`。\n\n```\n49: sub Print_Data {\n50:     my $table  = shift;\n51: \
  \    my $key    = shift;\n52:     my $indent = shift;\n53:     print \" \" x $indent,\
  \ start_tag($table), \"\\n\";\n54:     print $key, \"\\n\";\n55:     print \" \"\
  \ x $indent, end_tag($table), \"\\n\\n\";\n56: }\n```\n\n\n\n\n`Line 71` 检查 `$name`\
  \ 是否包含任何不是破折号、点、下划线或字母数字的字符；脱字符符号 `^` 表示“非”。任何不符合此标准的字符都会被替换为下划线字符。\n\n`Line 72`\
  \ 紧接着检查 `$name` 是否以数字开头。如果是，我们会在 `$name` 的开头添加一个下划线。在此上下文中，脱字符符号 `^` 表示“字符串的开头”。而且，由于我们对匹配的字符加上了括号，任何匹配的数据都会被捕获并存储在变量\
  \ `$1` 中。\n\n```\n73:     return $name;\n74: }\n```\n\n`Line 73` 返回存储在 `$name` 中的值。\n\
  \n`Line 74` 结束此子程序。\n\n```\n75: sub xml_esc {\n76:     my $it = shift;\n```\n\n\
  `Line 75` 开始定义 `xml_esc` 子程序。该子程序用于将任何稍微有点怪异的内容转换为 `&#nnn;` 实体。\n\n`Line 76` 创建一个名为\
  \ `$it` 的 `my` 变量，并使用 `shift` 函数将传递给此子程序的数据加载其中。\n\n```\n77:     $it =~ s{([^\\\
  x20\\x21\\x23-\\x25\\x28-\\x3b\\x3d\\x3F-\\x5B\\x5D-\\x7E])}\n78:             {‘&#’.(ord($1)).’;’}eg;\n\
  ```\n\n`Lines 77 and 78` 是单行 Perl 代码，拆分为两行。此替换命令查找任何不匹配方括号 `[]` 中列出字符的字符。任何不匹配的字符都会被转换为\
  \ `&#nnn;` 实体。`ord($1)` 命令返回传递给它的项目的数值值。返回的值被包裹在 `&#` 和 `;` 字符之间。替换命令末尾的 `e`  Perl\
  \ 将右侧作为表达式进行评估（执行 `ord()`），而 `g` 表示全局范围内对所有符合标准的值进行替换。\n\n```\n79:     return $it;\n\
  80: }\n```\n\n`Line 79` 返回存储在 `$it` 中的当前值。\n\n`Line 80` 结束此子程序。\n\n该程序的输出应该类似于所示：\n\
  \n```\n<?xml version=\"1.0\"?>\n<photoalbum>\n<album>\n   <album_id>1020740752</album_id>\n\
  \   <comments>BOKTWD, round \"2\".</comments>\n   <name>BOKTWD 2</name>\n  <photo>\n\
  \    <img_date>2002-04-25 09:37:58</img_date>\n    <album_id>1020740752</album_id>\n\
  \    <img_title>untitled</img_title>\n    <focal_length>6.6</focal_length>\n   \
  \ <aperture>2.83</aperture>\n    <width>1600</width>\n    <fnumber>2.5</fnumber>\n\
  \    <iso_speed>100</iso_speed>\n    <img_location>/photos/Family_Photos_1/24250020.jpg</img_location>\n\
  \    <height>1200</height>\n    <img_id>200204250937581020740773</img_id>\n    <exposure>10/881</exposure>\n\
  \    <resolution>375/1 dpi</resolution>\n    <make>SEIKO EPSON CORP.</make>\n  \
  \  <flash>Yes</flash>\n    <model>PhotoPC 850Z</model>\n  </photo>\n\n  <photo>\n\
  \    <img_date>2002-04-25 09:38:38</img_date>\n    <album_id>1020740752</album_id>\n\
  \    <img_title>untitled</img_title>\n    <focal_length>6.6</focal_length>\n   \
  \ <aperture>2.83</aperture>\n    <width>1600</width>\n    <fnumber>2.5</fnumber>\n\
  \    <iso_speed>100</iso_speed>\n    <img_location>/photos/Family_Photos_1/24250021.jpg</img_location>\n\
  \    <height>1200</height>\n    <img_id>200204250938381020740795</img_id>\n    <exposure>10/1113</exposure>\n\
  \    <resolution>375/1 dpi</resolution>\n    <make>SEIKO EPSON CORP.</make>\n  \
  \  <flash>Yes</flash>\n    <model>PhotoPC 850Z</model>\n  </photo>\n</album>\n</photoalbum>\n\
  ```\n\n这个简单的数据库到 XML 导出器就此结束。一旦运行该程序，你就应该得到一个良好的 XML 输出。然后你可以使用其他 XML 来转换数据、转换数据或对其进行你希望的任何操作。\n\
  \n## 总结\n这就是本章我们要涵盖的所有内容。你可能想要做的多数数据库到 XML 的导出都与此应用程序类似——因此没有必要编写几个完全相同的应用程序。你可能想为此应用程序添加一个接口，并结构化该接口以便将不同的数据库和表传递给它。此应用程序应该能为此类功能提供框架。\n\
  \n## 程序\n`Listing 11-1` 包含了 `photodumper.pl` 完整且不连续的代码。你也可以在本书的配套网站上找到代码。\n\nListing\
  \ 11-1: `photodumper.pl`\n\n```\n01: #!usr/bin/perl -w\n\n02: use strict;\n03: use\
  \ DBI;\n\n04: my $dbh = DBI->connect\n(\"DBI:mysql:photoalbum\",\"bookuser\",\"\
  testpass\") \n05:     or die(\"Cannot connect: $DBI::errstr\\n\");\n\n06: my %db;\n\
  \n07: $db{name}  = \"photo\";\n08: $db{album} = \"album\";\n09: $db{album} = \"\
  id\";\n10: $db{photo} = \"id\";\n\n11: my $main_table = \"album\";\n12: my @sub_tables\
  \ = (\"photo\");\n\n13: Gen_Output();\n\n14: sub Gen_Output {\n15:     print '<?xml\
  \ version=\"1.0\"?>';\n16:     print start_tag($db{name}), \"\\n\";\n\n17:     my\
  \ @albums = Get_Keys($main_table);\n\n18:     for my $tmp (@albums) {\n19:     \
  \    print start_tag($db{album}), \"\\n\";\n20:         Print_Data($main_table,\
  \ $tmp);\n21:         for my $sub_tbl (@sub_tables){\n22:             Do_SubTable($sub_tbl,\
  \ $tmp);\n23:         }\n24:         print end_tag($db{album}), \"\\n\";\n25:  \
  \   }\n26:     print end_tag($db{name}), \"\\n\";\n27: }\n\n28: sub Do_SubTable\
  \ {\n29:     my $table = shift;\n30:     my $rel   = shift;\n\n31:     my @keys\
  \ = Get_Keys($table, $rel);\n\n32:     for my $key (@keys) {\n33:         print\
  \ start_tag($table), \"\\n\";\n34:         Print_Data($table, $key, \"    \");\n\
  35:         print end_tag($table), \"\\n\\n\";\n36:     }\n37: }\n\n38: sub Get_Keys\
  \ {\n39:     my $table     = shift;\n40:     my $index     = shift;\n41:     my\
  \ @values    = ();\n\n42:     my $sql = qq{SELECT $db{$table} FROM $table}; \n43:\
  \     $sql   .= qq{ WHERE $db{f_key} = ?} if($index);\n44:     my $sth = $dbh->prepare($sql);\n\
  \n45:     $sth->execute();\n\n46:     while(my @arr = $sth->fetchrow_array){ push\
  \ @values, @arr; }\n47:     return(@values);\n48: }\n\n49: sub Print_Data {\n50:\
  \     my $table   = shift;\n51:     my $key     = shift;\n52:     my $indent  =\
  \ shift;\n53:     my @values  = ();\n\n54:     my $sql = qq{SELECT * FROM $table\
  \ WHERE $db{$table} = ?};\n55:     my $sth = $dbh->prepare($sql);\n\n56:     $sth->execute($key);\n\
  \n57:     while(my $data = $sth->fetchrow_hashref){ \n58:        for(keys%$data)){\n\
  59:            $data->{$_} = \"\" unless defined $data->{$_};\n60:            print\
  \ \" \" x $indent, start_tag($_),\n61:            xml_esc($data->{$_}), end_tag($_),\
  \ \"\\n\";\n62:        }\n63:     }\n64:     return;\n65: }\n\n66: sub start_tag\
  \ { \"<\" . xml_esc_name($_[0]) . \">\" }\n67: sub end_tag { \"</\" . xml_esc_name($_[0])\
  \ . \">\" }\n\n68: sub xml_esc_name {\n69:     my $name = shift;\n70:     return\
  \ ‘_’ unless length $name;\n71:     $name =~ s/[^-\\._a-zA-Z0-9]/_/g;\n72:     return\
  \ $name;\n73: }\n```\n\n\n\n\nWeb 服务是如今的一个热点话题。每个人似乎都在谈论这个 Web 服务和那个 Web 服务。你几乎不可能在拿起任何一本行业杂志时，不从某种程度上读到一些关于\
  \ Web 服务的内容。\n\n本章涵盖了 Web 服务的一个方面：`SOAP` 协议。我们关注 `SOAP` 是因为它非常常见，并且在 `w3.org` 上有详尽的文档；此外，已经有一些相当不错的\
  \ Perl 模块可以供它使用。\n\n在我解释我对 `SOAP` 的理解之前，我想确保你知道在哪里可以获取完整的文档。你可以访问 [`www.w3.org`](http://www.w3.org)\
  \ 并点击 `SOAP` 链接来找到 `SOAP` 协议以及它所有的定义、解释和标准。如果你需要关于管理万维网协议的详细技术文档，`w3.org` 网站是必经之地。\n\
