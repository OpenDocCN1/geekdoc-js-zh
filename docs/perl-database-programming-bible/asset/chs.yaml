  ```\n\n`Lines 18 and 19` 清空 `cart_qty_total` 和 `cart_price_total` 索引处存在的任何值。\n\n\
  ```\n20: for my $prod (@$products){\n21:     next unless ($session{$prod->[1]});\n\
  ```\n\n`Line 20` 类似于 `catalog.cgi` 程序。它遍历 `@$products` 数组中的每一个项目。每次循环时，当前值（指向另一个数组的引用）被赋值给\
  \ `$prod`。\n\n`Line 21` 检查当前哈希 `$session{$prod->[1]}` 是否包含任何数据。如果包含，则说明该项目在用户的购物车中，我们想要显示它。如果不包含任何数据，我们希望让循环移动到下一个项目，因此我们调用了\
  \ `next` 函数。\n\n```\n22:     $session{‘cart_qty_total’}   += $session{$prod->[1]};\n\
  23:     $session{‘cart_price_total’} += \n            Calc_Price($session{$prod->[1]}\
  \ , $prod->[2]);\n```\n\n`Line 22` 从 `$session{$prod->[1]}` 读取该项目的数量，并将其加到存储在 `$session{‘cart_qty_total’}`\
  \ 中的当前值中。这保持了购物车中物品数量的累计计数。\n\n`Line 23` 的操作与 `line 22` 基本相同，不同在于它维护的是价格的累计计数。`Calc_Price`\
  \ 函数接收了 `qty`（`$prod->[1]`）和 `price`（`$prod->[2]`），以便它们可以相乘并返回结果。\n\n```\n24:  \
  \   print qq(\n25:       <tr>\n26:        <td align=\"center\" valign=\"top\">\n\
  27:         $prod->[1]\n28:        </td>\n29:        <td align=\"left\">\n30:  \
  \       &nbsp;&nbsp;$prod->[0]\n31:        </td>\n32:        <td align=\"center\"\
  \ valign=\"top\">\n33:         $session{$prod->[1]}\n34:        </td>\n35:     \
  \   <td align=\"right\" valign=\"top\">\n36:         $prod->[2]\n37:        </td>\n\
  38:        <td align=\"right\" valign=\"top\">\n39:     );\n```\n\n`Lines 24–39`\
  \ 打印了发票上某行数据的*大部分*HTML。我们需要正确地格式化价格，因此我们没有写完完整的一行数据。\n\n```\n40:   printf(\"\\$%.2f\"\
  , Calc_Price($session{$prod->[1]}, $prod->[2]) );\n```\n\n`Line 40` 使用 `printf`\
  \ 函数打印我们调用 `Calc_Price` 返回的值，并对其进行格式化，使其包含两位小数。注意这里我们使用的是 `printf` 而不是我们之前使用的 `sprintf`。当你将结果赋值给变量或某些内容时使用\
  \ `sprintf`，而 `printf` 用于直接打印该项。\n\n```\n41:     print qq(\n42:        </td>\n43:\
  \       </tr>\\n\n44:     );\n45: }\n```\n\n`Lines 41–45` 完成了该行数据的 HTML 结构。在 `line\
  \ 45`，我们结束了 `line 20` 开始的 `for` 循环。\n\n```\n46: $session{‘cart_price_total’} = \n\
  \        sprintf(\"%.2f\", $session{‘cart_price_total’});\n47: Print_Page(\"./templates\"\
  , \"invoice_footer.tmpl\", \\%session);\n```\n\n`Line 46` 使用 `sprintf` 设置 `cart_price_total`，使其格式化为两位小数。`Line\
  \ 47` 打印 `invoice_footer.tmpl` 以结束页面。\n\n```\n48: sub Calc_Price {\n49:     my($qty,\
  \ $price) = @_;\n```\n\n`Line 48` 开始定义 `Calc_Price` 子程序。`line 49` 声明了变量并将传递给该子程序的赋值。\n\
  \n```\n50:     $price =~ s/\\$//g;\n51:     return($qty * $price);\n52: }\n```\n\
  \n`Line 50` 从 `$price` 值中移除任何美元符号。`line 51` 返回了 `$qty` 和 `$price`。`Line 52` 结束了\
  \ `Calc_Price` 子程序。\n\n## 总结\n\n在本章创建的购物车程序向你展示了通过重用现有代码可以节省大量的时间和精力。记住，重用的代码需要符合你所需要的模式。在本例中，`BasicSession`\
  \ 模块几乎就是我们需要的。通过使用管理会话的通用库（绑定哈希表），我们避免了直接访问数据库。现在你已经有了一个良好的起点，可以将剩余的代码合并到一个更具通用性的程序。添加销售税/VAT\
  \ 计算、运费或礼物。\n\n## 程序列表\n\n列表 15-1 到 15-12 包含了创建 Web 购物车所需的完整代码。\n\n### Listing 15-1:\
  \ catalog.cgi\n\n```\n01: #!usr/bin/perl -wT\n02: use strict;\n03: use SOAP::Lite;\n\
  04: use CGI (:standard);\n05: use lib (.);\n06: use BasicSession;\n07: our $sess;\n\
  08: my  %cart;\n09: $sess = Get_Session();\n10: tie %cart, ‘BasicSession’;\n11:\
  \ my $add_to_cart = param(‘add_to_cart’);\n12: ++$cart{$add_to_cart} if $add_to_cart;\n\
  13: my $remove= param(‘remove’);\n14: delete $cart{$remove} if $remove;\n15: my\
  \ $products = SOAP::Lite\n16:   -> uri(‘http://goliath.perlguy.net/Catalog’)\n17:\
  \   -> proxy(‘http://goliath.perlguy.net/cgi-\n                bin/soap_server19.cgi’)\n\
  18:   -> Get_Product_List()\n19:   -> result;\n20: Print_Page(\"./templates\", \"\
  header.tmpl\", \\%cart);\n21: Print_Page(\"./templates\", \"catalog_header.tmpl\"\
  , \\%cart);\n22: for my $p (@$products){\n23:     print qq(\n24:       <tr><td>\n\
  25:  [<a href=\"catalog.cgi?add_to_cart=$p->[1]\">Add Item</a>]\n26:       </td><td>\n\
  27:  <a href=\"item_details.cgi?item_num=$p->[1]\">$p->[1]</a>\n28:       </td><td>$p->[0]\n\
  29:       </td><td>&nbsp;$p->[2]\n30:       </td><td align=\"center\">&nbsp;$item{$p->[1]}\n\
  31:       </td><td>[<a \n32:            href=\"catalog.cgi?remove=$p->[1]\">Delete</a>]\n\
  33:       </td></tr>\\n);\n34: }\n35: Print_Page(\"./templates\", \"catalog_footer.tmpl\"\
  , \\%cart);\n```\n\n\n\n\n| ![Start example](img/_1.gif) |\n\n```\n01: #!/usr/bin/perl\
