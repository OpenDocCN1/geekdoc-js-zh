  \n`Line 19` 是我们在 SOAP 服务器上调用的远程函数。\n\n`Line 20` 调用 `result` 方法，该方法返回我们所调用的函数的结果。\n\
  \n```\n21: Print_Page(\"./templates\", \"header.tmpl\", \\%session);\n22: Print_Page(\"\
  ./templates\", \"catalog_header.tmpl\", \\%session);\n```\n\n`Line 21` 调用 `Print_Page`\
  \ 函数来打印页面头部 HTML。\n\n`Line 22` 调用 `Print_Page` 函数来打印 `catalog_header` 模板 HTML。这打印了目录页的表头。\n\
  \n`Now` 我们已经完成了与 `catalog.cgi` 程序相同的代码。\n\n```\n23: delete($session{‘cart_qty_total’});\
  \ \n24: delete($session{‘cart_price_total’});\n```\n\n`Lines 23–24` 除了存储在 `cart_qty_total`\
  \ 和 `cart_price_total` 哈希索引中的任何内容。我们删除这些值是因为任何剩余的旧值都是不必要的。记住，这不是普通的哈希；它绑定到了数据库并可以在程序调用之间记住值。\n\
  \n我们需要删除旧值，以确保我们即将执行的计算从零开始。\n\n```\n25: for my $prod (@$products){\n26:     next\
  \ unless ($session{$prod->[1]});\n```\n\n`Line 25` 再次类似于 `catalog.cgi` 程序。它遍历 `@$products`\
  \ 数组中的每一个项目。每次循环时，当前值（另一个数组的引用）都会被赋值给 `$prod`。\n\n`Line 26` 检查当前哈希 `$session{$prod->[1]}`\
