  \ 结束此子程序。\n\n这就完成了 view_item CGI 程序。我们 SmallAuction 应用程序的最后一部分是实际的 Perl 模块，其中有很多公共子程序。使用像这样的模块是将所有公共子程序放在一起的极佳方法，可以避免冗代码。\n\
