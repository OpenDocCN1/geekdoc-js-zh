  23:     </td>\n24:    </tr>\n25:    <tr>\n26:     <td rowspan=\"6\" bgcolor=\"#c0c0c0\"\
  ><img src=\"$item->{image}\">\n27:     <td bgcolor=\"#c0c0c0\">Item Name:</td>\n\
  28:     <td>$item->{title}</td>\n29:    </tr>\n30:    <tr>\n31:     <td bgcolor=\"\
  #c0c0c0\">Publisher::</td>\n32:     <td>$item->{publisher}</td>\n33:    </</tr>>\n\
  34:    <tr>\n35:     <td bgcolor=\"#c0c0c0\">Format:</td>\n36:     <td>$item->{format}</td>\n\
  37:    </</tr>>\n38:    <tr>\n39:     <td bgcolor=\"#c0c0c0\">Author:</td>\n40:\
  \     <td>$item->{author}</td>\n41:    </</tr>>\n42:    <tr>\n43:     <td bgcolor=\"\
  #c0c0c0\">Publish Date:</td>\n44:     <td>$item->{pubdate}</td>\n45:    </</tr>>\n\
  46:    <tr>\n47:     <td bgcolor=\"#c0c0c0\">Price:</td>\n48:     <td>$item->{price}</td>\n\
  49:    </</tr>>\n50:    <tr>\n51:     <td colspan=\"3\" align=\"center\">\n52: \
  \     <a href=\"/cgi-bin/catalog.cgi\">Back to Listing</a>\n53:     </td>\n54: \
  \   </</tr>>\n55:   </table>\n56: </body>\n57: </html>\n58: HTML\n```\n\n`Lines\
  \ 15-58` 是一个用于打印 HTML 的此处文档（here document）。XML 中的每个项目都简单地通过 `$item` 指向哈希进行引用。\n\n\
  ## 总结\n\n本章向你展示了如何创建一个简单的 SOAP 服务器。我们还涵盖了访问 SOAP 服务器的几种不同方法。我们创建的 SOAP 服务器只是作为 CGI\
  \ 程序运行。作为 CGI 程序运行的 SOAP 服务器并不是速度极快的。如果你考虑为高流量网站设置 SOAP 服务器，你可能需要更强大的工具。不要担心；有几种工具允许你将\
  \ SOAP 服务器嵌入 Apache 中，这有助于让服务器运行得非常快。\n\n## 程序列表\n\nListing 12-1 到 12-3 显示了本章完整且不间断的代码。\n\
  \nListing 12-1: soap_server.cgi\n\n\n\n\n\n```perl\n01: #!/usr/bin/perl -w\n02:\
  \ # 一个简单的 SOAP 端\n03: use strict;\n04: use DBI;\n05: use LWP::Simple;\n06: use HTML::LinkExtor;\n\
  07: use SOAP::Transport::HTTP;\n08: package Catalog;\n09: my $dbh = DBI->connect(\"\
  DBI:mysql:books:switch.perlguy.net\",\n     \"bookuser\",\"\")\n10:     or die(\"\
  Cannot connect: $DBI::errstr\\n\");\n11: my @imgs;\n12: SOAP::Transport::HTTP::CGI\n\
  13:   -> dispatch_to(‘Catalog’)\n14:   -> handle;\n15: sub Get_Product_List {\n\
  16:     my $sql = qq(SELECT title, isbn FROM library);\n17:     my $sth = $dbh->prepare($sql);\n\
  18:     $sth->execute;\n19:     my @products = ();\n20:     while(my $ptr = $sth->fetch){\n\
  21:         push (@products, [ @$ptr ]); \n22:     }\n23:     return(\\@products);\n\
  24: }\n25: sub Get_Product_Data {\n26:     my $rval;\n27:     my ($class, $input)\
  \ = @_;\n28:     $Catalog::input     = $input;\n29:     my $sql    = \"SELECT *\
  \ FROM library WHERE isbn \n          = ‘$input’\";\n30:     my $p       = $dbh->selectrow_hashref($sql);\n\
  31:     $p->{image} = _get_image($input);\n32:     if($p){\n33:         $rval  =\
  \ qq(<?xml version=\"1.0\"?>\\n);\n34:         $rval .= qq( <catalog_item>\\n);\n\
  35:         while(my($k,$v) = each %$p) {\n36:             if($v) {\n37:       \
  \          $v     =~ s/^ +//;\n38:                 $v     =~ s/(\\015?\\012)$//;\n\
  39:                 $rval .= \"  <$k>$v</$k>\\n\";\n40:             }\n41:     \
  \    }\n42:         $rval .= qq( </catalog_item>\\n);\n43:     }\n44:     $dbh->disconnect;\n\
  45:     return($rval);\n46: }\n47: sub _get_image {\n48:     my $input = $Catalog::input;\n\
  49:     my $url   = http://www.amazon.com/exec/obidos/ASIN/\n        . $input;\n\
  50:     my $p  = HTML::LinkExtor\n51:      ->new(\\&_callback)\n52:      ->parse(LWP::Simple::get($url));\n\
  53:     return($imgs[0]);\n54: }\n55: sub _callback {\n56:     my($tag, %attr) =\
  \ @_;\n57:     return if $tag ne ‘img’;\n58:     my @foo = values %attr;\n59:  \
  \   return if($foo[0] !~ /$Catalog::input/i);\n60:     push(@imgs, values %attr);\n\
  61: }\n```\n\n![示例结束](img/_1.gif)\n\n列表 12-2: catalog.cgi\n\n![示例开始](img/_1.gif)\n\
