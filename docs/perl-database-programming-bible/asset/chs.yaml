  Indianapolis, IN 46256 [www.wiley.com](http://www.wiley.com)\n\n\n## 前言\n这是一个关于使用\
  \ Perl 创建数据库驱动应用程序的深度指南。\n\n\n 封底\n在这部权威参考书中，Perl 专家 Brent Michalski 使用大量的示例，帮助你掌握\
  \ Perl 在 MySQL、PostgreSQL 和 Oracle 数据库应用中的能力。在此过程中，他探索了 XML 和 Web 服务等尖技术的实际应用。如果你是\
  \ Perl 初学者，全面的代码示例和逐步的解释将让你能够快速、自信地编写应用程序。如果你已经拥有经验，这本权威指南也包含了你在 Web 编程、问题跟踪、自动电子邮件报告等方面进阶所需的所有内容。你将学习到：\n\
  \n* 理解不同的数据库模型、`DBIs` 和 `DBDs`\n* 设置关系型数据库、检索信息并生成报告\n* 将 Perl 哈希绑定到数据库并使用 cookie\
  \ 跟踪用户\n* 生成并投送自动电子邮件报告\n* 使用绑定哈希创建 Web 端购物车\n* 处理二进制数据并提交 `BLOB` 数据\n* 创建通讯录、相册和基于\
