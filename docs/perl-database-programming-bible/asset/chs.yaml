  \n## 第 7 章：从数据库获取数据（高级）\n\n## 概述\n\n在第 6 章中，我们学习了如何使用 Web 服务器和浏览器来创建用户界面。在本章中，我们将在此基础上进行扩展，并创建一个基于\
  \ Web 的拍卖程序！虽然这个程序与 eBay 相比毫无可，但它非常适用于小型慈善活动、教会拍卖等场景。事实上，本章的灵感源于我在万事达国际的“正式工作”，当时我们想为支持的一家慈善机构举办一个内部\
  \ Web 拍卖。\n\n在创建这个拍卖程序之前，我们必须首先了解我们需要的功能。这个拍卖程序需要能够：\n\n* 运行多个不同的拍卖，或者至少允许物品有不同的报价时间\n\
  * 存储捐赠者信息\n* 存储物品信息\n* 存储出价信息\n* 定义报价开始和结束的时间\n* 列出范围内的物品\n* 列出单个物品\n* 基于模板以便于自定义\n\
  \n我们在本章中创建的程序实现了上述所有功能。\n\n\n\n接下来是 `name` 字段；这是拍卖会的名称。目前设置为 50 个字符，但如果你有名称更拍卖，可以随时更改此值。\n\
  \n`start_bidding` 是一个 datetime 字段，包含该拍卖开始竞价的日期和时间。\n\n`stop_bidding` 也是一个 datetime\
  \ 字段。它包含了竞价结束的日期和时间。\n\n查看 `donor` 表。\n\n```\n+----------+-------------+------+-----+---------+----------------+\n\
  | Field    | Type        | Null | Key | Default | Extra          |\n+----------+-------------+------+-----+---------+----------------+\n\
  | donor_id | int(11)     |      | PRI | NULL    | auto_increment |\n| name     |\
  \ varchar(50) | YES  |     | NULL    |                |\n| address1 | varchar(50)\
  \ | YES  |     | NULL    |                |\n| address2 | varchar(50) | YES  | \
  \    | NULL    |                |\n| city     | varchar(50) | YES  |     | NULL\
  \    |                |\n| state    | char(2)     | YES  |     | NULL    |     \
  \           |\n| zip      | varchar(10) | YES  |     | NULL    |               \
  \ |\n| phone    | varchar(20) | YES  |     | NULL    |                |\n| contact\
  \  | varchar(50) | YES  |     | NULL    |                |\n+----------+-------------+------+-----+---------+----------------+\n\
  ```\n\n`donor` 表用于维护谁捐赠了物品的信息。由于一个捐赠者可以捐赠许多物品，此表使得我们尽可能减少冗余数据的存储。当我们输入拍卖物品时，不需要为每个物品输入大量的捐赠者数据，只需存储\
  \ `donor_id` 即可。这会将拍卖物品与正确的捐赠者关联起来。\n\n该表的 `donor_id` 是 `primary key`。它也是一个 `auto_increment`\
  \ 字段，因此在向表中添加数据时，我们不需要对其进行任何操作。该表中的其他字段应该是不言自明的的。它们仅仅是存储捐赠者信息的文本字段。\n\n下一个表是 `item`。此表存储了将进行竞拍的实际物品。\n\
  \n```\n+-------------+--------------+------+-----+---------+----------------+\n\
  | Field       | Type         | Null | Key | Default | Extra          |\n+-------------+--------------+------+-----+---------+----------------+\n\
  | item_id     | int(11)      |      | PRI | NULL    | auto_increment |\n| name \
  \       | varchar(50)  | YES  |     | NULL    |                |\n| description\
  \ | varchar(255) | YES  |     | NULL    |                |\n| image_url   | varchar(200)\
  \ | YES  |     | NULL    |                |\n| donor_id    | int(11)      | YES\
  \  |     | NULL    |                |\n| value       | double       | YES  |   \
  \  | NULL    |                |\n| min_bid     | double       | YES  |     | NULL\
  \    |                |\n| min_incr    | double       | YES  |     | NULL    | \
  \               |\n| auction_id  | int(11)      | YES  |     | NULL    |       \
  \         |\n+-------------+--------------+------+-----+---------+----------------+\n\
  ```\n\n此表也有一个 `auto_increment` 字段作为其主键。我们有几个文本字段来存储物品信息。其中三个字段是 `double` 类型；这些字段包含了物品的价值、`min_bid`（最低起拍价）和\
  \ `min_incr`（最小加价幅度）。\n\n注意此表中的另外两个 `int(11)`（整数）字段：命名为 `donor_id` 和 `auction_id`。这两个字段包含了与该物品相关的\
  \ `donor_id` 和 `auction_id`。这些被称为 `foreign keys`（外键）。外键是指一个表中的链接到另一个表主键的字段。通过使用这些外键，我们能够准确地判断是哪个捐赠者给出了该物品，以及该物品属于哪个拍卖会。\n\
  \n最后，我们有 `bids` 表。此表跟踪竞价情况并维护所有竞价活动的记录。\n\n```\n+------------+---------------+------+-----+---------+----------------+\n\
  | Field      | Type          | Null | Key | Default | Extra          |\n+------------+---------------+------+-----+---------+----------------+\n\
  | bid_id     | int(11)       |      | PRI | NULL    | auto_increment |\n| item_id\
  \    | int(11)       | YES  |     | NULL    |                |\n| amount     | double\
  \        | YES  |     | NULL    |                |\n| bidtime    | timestamp(14)\
  \ | YES  |     | NULL    |                |\n| first_name | varchar(40)   | YES\
  \  |     | NULL    |                |\n| last_name  | varchar(40)   | YES  |   \
  \  | NULL    |                |\n| phone      | varchar(20)   | YES  |     | NULL\
  \    |                |\n+------------+---------------+------+-----+---------+----------------+\n\
  ```\n\n`bids` 表存储了竞价者的名、姓、电话号码以及竞价金额。此表还包含一个 `auto_increment` 字段作为其主键，并通过 `foreign\
  \ key` 链接到竞拍的物品。你在这里看到的唯一不同字段类型是 `bidtime` 字段。该字段是 `timestamp` 类型。这是另一个一个在添加记录时由数据库自动处理的字段。\n\
  \n\n\n\n`Line 7` 使用 `lib` 函数使 Perl 将提供的路径添加到 `@INC` 数组中。`@INC` 数组是 Perl 用于搜索模块的数组。在这种情况下，我们将点（`.`）添加到路径中，这意味着添加了当前目录。\n\
  \n`Line 8` 加载了 `SmallAuction` 模块。该模块位于当前目录——这就是为什么我们必须在上一行中将其添加到 `@INC` 数组中。\n\n\
  ```\n09: $ENV{PATH} = '';\n10: my $tmpl   = \"templates\";\n```\n\n`Line 9` 将环境变量\
  \ `$ENV{PATH}` 设置为空字符串。很多时候，当你开启污染检查（taint checking）时，你会收到类似这样的错误信息：\n\n```\nInsecure\
  \ $ENV{PATH} while running -T switch at /usr/local/lib/foo line 432.\n```\n\n只需在程序中设置\
  \ `$ENV{PATH}` 变量即可解决这个问题。如果你需要在 `$ENV{PATH}` 变量中使用某些路径，请将它们替换空字符串。例如，`$ENV{PATH}=\"\
  /bin:/usr/bin\"`。\n\n`Line 10` 创建了一个名为 `$tmpl` 的标量变量，并将其设置为字符串 `\"templates\"`。这是模板文件所在的目录。\n\
  \n```\n11: my $a_id = 1;  # Auction id number.\n```\n\n`Line 11` 创建了一个名为 `$a_id`\
  \ 的变量并将其设置为 1。这是我们用于从数据库中获取相应拍卖信息的拍卖 ID。\n\n```\n12: my $dbh = DBI->connect(\"dbi:mysql:auction\"\
