  \n\n\n`Line 9` 调用了 `CGI::Carp` 模块并导入了 `fatalsToBrowser` 方法。通过使用这个模块，你可以节省大量的调试时间，并避免很多困惑。通常，当\
  \ CGI 程序出现任何错误时，Web 服务器只会返回 500 Server Error（服务器错误），而不提供任何其他细节。许多初学者 CGI 程序员在这里就会迷失，因为错误信息太模糊了。通过使用\
  \ `CGI::Carp` 模块，发生的大多数错误发送到浏览器，这样你就能得到一个比 500 Server Error 描述得多的错误。\n\n```\n10:\
  \ print header();\n11: my $action = param(‘form_action');\n12: my $DB_Handle = DBI->connect(\"\
  DBI:mysql:BibleBook\",\n     \"bookuser\", \"testpass\")\n13:     die(\"Cannot connect:\
  \ $DBI::errstr\\nAborting\");\n```\n\n`Line 10` 调用了位于 `CGI.pm` 模块中的 `header` 函数。这个函数只是一个快捷方式，用于为你打印\
  \ `\"Content-Type: text/html\\n\\n\"` 行。\n\n`Line 11` 调用了 `CGI.pm` 中的 `param` 函数，并读取从\
  \ HTML 表单的 `\"form_action\"` 字段传递的值。记住，这是我们用来告诉程序我们想让它做什么的隐藏字段。\n\n`Lines 12-13`\
  \ 连接到数据库并将连接句柄存储在 `$DB_Handle` 中。如果连接数据库出现问题，`line 13` 将打印错误消息并导致程序终止（die）。\n\n\
  ```\n14: Add_Record() if($action eq ‘addrecord');\n15: Search_DB()  if($action eq\
  \ ‘search');\n```\n\n`Line 14` 如果 `$action` 的值等于 `\"addrecord\"`，则调用 `Add_Record`。\n\
  \n`Line 15` 如果 `$action` 的值等于 `\"search\"`，则调用 `Search_DB`。\n\n这两行是我们的程序决定是向数据库添加记录，还是在数据库中搜索匹配的记录的地方。程序一次只执行这些任务中的之一：要么向数据库添加记录，要么在数据库中搜索匹配记录。\n\
  \n```\n16: sub Search_DB {\n17:     my ($sql, $st_handle);\n18:     my $search_for\
  \ = param(‘search');\n19:     my @field      = param(‘field');\n```\n\n`Line 16`\
  \ 开始 `Search_DB` 子程序。该子程序搜索数据库，因此有了这个描述性的名称。\n\n`Line 17` 创建了两个我们在子程序中使用的变量。通过将它们创建为\
  \ `my` 变量，它们的作用域被限制在声明所在的块中。\n\n`Line 18` 使用 `CGI.pm` 中的 `param` 函数读取 HTML 表单搜索字段传递的值，然后将结果存储在\
  \ `$search_for` 变量中。\n\n`Line 19` 与 `Line 18` 一样使用了 `param` 函数，但这种情况下我们期望返回一个列表并存储在\
  \ `@field` 中。`param` 函数“会做正确的事”：当你要求它返回一个标量时，它就返回；当你要求返回一个列表时，它就返回。我们想要返回列表的原因是因为\
  \ HTML 表单上的字段选择是复选框，可能会返回多个值。因此，这一行存储了 HTML 表单上所有勾选的（且名为 field 的）值，并将它们全部存储在名为 `@field`\
  \ 的列表中。\n\n```\n20:    @field = map { \"($_ LIKE ‘%$search_for%')\" } @field;\n\
  ```\n\n`Line 20`是我在这个程序中最喜欢的行。`map` 函数真的非常酷。它对传递它的数组中的每个值执行代码块，并将结果返回到一个新的或相同的数组。\n\
  \n在这一行中，我们想要搜索的每个字段存储在名为 `@field` 的数组中。我们需要将这些字段整合到有效的 SQL 查询中。这可以使用 `foreach` 循环完成，但这样做会占用更多代码行。通过使用\
  \ `map`，这可以在一行内完成。\n\n在大括号内部，我们有文本 `\"$_ LIKE ‘%$search_for%')`。这是一个字符串，该字符串的结果就是\
  \ `map` 当前正在评估的当前的值。`$_` 是 `map` 正在评估的当前值。所以，这就像是：\n\n| | 注意 | 下四行是一个示例，不是程序的一部分。\
  \ |\n\n```\nforeach my $current  (@field) {\n    $current = \"($current LIKE ‘%$search_for%')\"\
  ;\n    push @new_field_array, $current;\n}\n```\n\n我们在这里尝试完成的任务的任务是获取数组中的字段名称文本并将其转换为有效的\
  \ SQL 部分，以便将其附加到整个 SQL 语句中。\n\n```\n21:     $sql  = qq{SELECT * FROM phonebook WHERE\
  \ (};\n22:     $sql .= join ‘ OR ‘, @field;\n23:     $sql .= \")\";\n```\n\n`Lines\
  \ 21-23` 生成了一个用于查询数据库的有效 SQL 查询。`Line 22` 之所以可能是因为我们在 `line 20` 中设置 `@field` 数组的方式。\n\
  \n`Line 21` 开始，简单地将 `$sql` 变量设置为某些文本。\n\n`Line 22` 使用 `join` 函数获取 `@field` 数组中的每个值并用\
  \ `OR` 连接起来。\n\n`Line 23` 结束 SQL 语句。\n\n所以，当程序运行到 `line 23` 时，生成的 SQL 可能看起来如下：\n\
  \n```\nSELECT * FROM phonebook WHERE ((fname LIKE ‘%Brent%') OR (lname LIKE ‘%Brent%')\
  \ OR (phone LIKE ‘%Brent%'))\n```\n这意味着我们正在 fname、lname 和 phone 中查找 Brent。文本前后的\
  \ `%` 是通配符。如果你想进行严格的匹配，请去掉 `%`。\n\n```\n24:     $st_handle = $DB_Handle->prepare($sql);\n\
  25:     $st_handle-> execute();\n26:     Display_Results($st_handle);\n27: }\n```\n\
  \n`Line 24` 调用了 `DBI` 模块中的 `prepare` 方法并传递传递了 SQL 语句。该方法的结果存储在 `$st_handle` 中。\n\
  \n`Line 25` 获取 `$st_handle` 句柄并对其调用 `execute()` 方法。这导致 SQL 语句在表上执行。返回的结果指针随后存储在\
  \ `$st_handle` 变量中。\n\n`Line 26` 调用 `Display_Results` 并将 `$st_handle` 传递给它。\n\n\
  `Line 27` 关闭该子程序。\n\n\n\n\n\n```html\n<html>\n<head><title>搜索结果</title></head>\n\
  \ <body>\n  <table align=\"center\" border=\"1\" cellspacing=\"0\">\n    <tr bgcolor=\"\
  #303030\">\n      <td colspan=\"6\" align=\"center\">\n        <font size=\"5\"\
  \ color=\"white\">搜索结果</font>\n      </td>\n    </tr>\n    <tr bgcolor=\"#c0c0c0\"\
  >\n      <td align=\"center\"><b>姓名</b></td>\n      <td align=\"center\"><b>同事？</b></td>\n\
  \      <td align=\"center\"><b>电话</b></td>\n      <td align=\"center\"><b>分机号</b></td>\n\
  \      <td align=\"center\"><b>手机</b></td>\n      <td align=\"center\"><b>传呼机</b></td>\n\
  \    </tr>\n  </table>\n </body>\n</html>\n```\n\n## 页面结构\n`Lines 33-50` 是启动搜索结果页面所需的\
  \ HTML 代码。我们使用表格来保持数据的整齐和格式化。\n\n`Line 51` 是从 `line 32` 开始的 `here document` 的结束标签。\n\
  \n## 数据绑定\n\n```php\n$handle->bind_columns(undef, \n     \\($fname, $lname, $cow,\
  \ $phone, $ext, \n      $cell, $pager, $notes));\n```\n\n`Line 52` 调用了 `$handle`\
  \ 上的 `bind_columns` 方法。这使得我们引用的变量被“绑定”到查询结果上。这意味着每当我们调用 `fetch` 方法时，值都会存储在它们绑定的变量中。`bind_columns`\
  \ 第一个参数 `undef` 目前未被 `DBI` 使用，但它是必须的。\n\n## 数据处理循环\n\n```php\nwhile($handle->fetch){\
  \ \n    $bgcol = ($bgcol eq \"ffffff\") ? \"e0e0e0\": \"ffffff\";\n```\n\n`Line\
  \ 54` 开启了一个 `while` 循环并调用 `fetch` 方法。它一次获取一条查询匹配项，直到没有更多匹配项为止。一旦没有匹配项，由于 `$handle->fetch`\
  \ 不再为真，`while` 循环将终止。\n\n`Line 55` 使数据更具可读性。它使用三元运算符交替每行数据的背景颜色。`?` 左侧的值会被求值；如果为真，则执行\
  \ `?` 右侧的第一个项目；如果左侧值为假，则执行 `:` 右侧的值。这是一种在简单表达式上实现 `if..else` 块的更简便的方法。\n\n```php\n\
  \   print qq(<tr bgcolor=\"#$bgcol\">);\n   print qq(<td>$fname $lname</td><td align=\"\
  center\">$cow</td>);\n   print qq(<td>$phone</td><td>$ext</td><td>$cell</td>);\n\
  \   print qq(<td>$pager</td>);\n   print qq(</tr>);\n```\n\n`Line 56` 打印表格行标签，并带有相应的背景颜色。\n\
  \n`Lines 57-59` 打印一行数据，每个数据单元格都在自己的表格单元格中。例外是姓名字字段，我们在单个表格单元格中同时列出了名（`$fname`）和姓（`$lname`）。\n\
  \n`Line 60` 打印表格行的结束标签。\n\n```php\n    $count++;\n}\n```\n\n`Line 61` 递增变量 `$count`。该变量的唯一用途是检查是否有实际返回了数据。\n\
  \n`Line 62` 结束逐行获取数据的 `while` 循环。\n\n```php\n    No_Data() unless($count);\n   \
  \ print qq(</table></body></html>);\n}\n```\n\n`Line 63` 调用 `No_Data` 子程序。如果变量 `$count`\
  \ 为假，则调用该子程序。如果查询没有匹配项，`line 54` 上的 `while` 语句将永远不会进入且 `$count` 变量永远不会递增。这是一个检查是否存在匹配项的简单技巧。\n\
  \n`Line 64` 打印 HTML 页面的结束标签。\n\n`Line 65` 关闭此子程序。\n\n```php\nsub No_Data{\n   print\
  \ qq(<tr><td colspan=\"6\" align=\"center\">);\n   print qq(No matches found, return\
  \ to);\n   print qq(<a href=\"/phonebook/phone.html\">main page</a>a>.);\n   print\
  \ qq(</td></tr>);\n}\n```\n\n`Line 66` 开始 `No_Data` 子程序。该子程序通过打印文本来告知用户没有匹配项。如果没有这个，如果没有匹配项，将显示一个仅包含表头的\
  \ HTML 页面。\n\n`Lines 67-70` 打印一些 HTML 告知用户。\n\n\n\n\n\n`Line 108` 开始了 `Handle_DB_Error`\
  \ 子程序。该子程序用于在发生某种类型的数据库错误时显示错误消息。\n\n`Line 109` 开始了一个在此文档中（here document），用于打印错误页的\
  \ HTML 代码。\n\n```\n110:     <html><head><title>Database Error</title></head>\n111:\
  \      <body>\n112:       <center>\n113:        <font size=\"6\">\n114:        \
  \ Error with database call.\n115:        </font>\n116:        <hr />\n117:     \
  \   <font size=\"4\" color=\"red\">\n118:         $DBI::errstr\n119:        </font><br\
  \ />\n120:        <font size=\"3\">\n121:         Please hit your <b>back</b> button\
  \ to re-enter the\n             data and try again.\n122:        </font>\n123: \
  \      </center>\n124:      </body>\n125:     </html>\n```\n\n`Lines 110-125` 是我们错误页所需的\
  \ HTML。在 `line 118` 上，我们打印了 `$DBI::errstr` 变量，这是一个包含错误消息的 DBI 变量。\n\n```\n126: \
  \    HTML\n127:     exit;\n128: }\n```\n\n`Line 126` 关闭了我们从 `line 109` 处开始的在此文档。\n\
  \n`Line 127` 调用了 `exit` 函数。由于发生了错误，我们希望调用 `exit` 函数，以绝对确保程序不会从这里继续执行。\n\n`Line 128`\
  \ 关闭了该子程序，同时也是程序的结束。\n\n因此，在 128 行代码中（其中很大一部分只是 HTML 字符串），我们拥有了一个可以搜索其数据库表并向数据库表中添加记录的\
  \ Web 应用程序。如果你觉得可以胜任，请利用你从书中中学到的知识修改此应用程序，以便你也能修改和删除记录。\n\n### 基于 Web 的测验程序\n\n\
  本章的下一个最后一个示例是一个基于 Web 的测验程序。它实际上由几个相关的程序组成。对于这个系统，我们采用了不同的方法。我们不再使用一个处理一切的大程序，而是一个包含通用函数的中央模块以及几个执行特定任务的小型\
  \ CGI 程序。\n\n`Quizzer` 程序允许“管理员”添加新测试并向测试添加问题。它还允许用户参加已经创建的测试。这里没有大量的错误处理代码，也没有很多让界面看起来漂亮的代码。相反，我们将致力于构建程序的框架，该框架可以整合到网站中并使其看起来非常精美。\n\
  \n记住，在 Perl 中，*实现某功能有多种方法！* 你可能会发现这种编程风格比尝试将所有功能保留在一个较大的程序中要更容易。核心思想是，如果你喜欢用一种方式进行编程，就那样做。Perl\
  \ 不会强迫你这样做或那样。当然，有些规则是必须遵守的，但当下的首要任务才是重要的，而不是你如何处理该任务。\n\n这个程序并不是供公众使用的，除非对其进行一些更改。管理程序和\
  \ HTML 页面可能不是你希望每个人都能访问。如果你不希望所有人都能访问这些页面和脚本，那么由你来决定将它们放在你认为安全的地方。\n\n创建表的 SQL 信息可以在本章末尾找到，也可以在本书的\
  \ Web 网站上找到。\n\n在线 `Quizzer` 应用程序包含：\n\n*   一个包含三个表的 MySQL 数据库\n    *   `Questions`\n\
  \    *   `Answers`\n    *   `Test_config`\n*   三个用于导航的 HTML 文件\n    *   `index.html`\n\
  \    *   `admin.html`\n    *   `create_test.html`\n*   六个 Perl/CGI 程序\n    *   `add_question.cgi`\n\
  \    *   `create_test.cgi`\n    *   `test_chooser.cgi`\n    *   `take_test.cgi`\n\
  \    *   `score_test.cgi`\n    *   `Quizzer.pm`\n\n看起来很多，但由于每个程序只执行特定任务，如果发生错误，这种策略可以使调试变得容易得多。让我们先查看\
  \ HTML 页面。这些页面并不华丽，只有功能性。此外，在 HTML 方面，只指出了重要信息。\n\n#### index.html\n\n| **![开始示例](img/_1.gif)**\
  \ |\n\n```\n01: <html><head><title>Quizzer v0.1</title></head>\n02:  <body>\n03:\
  \   <center><font size=\"6\">Quizzer v0.1</font></center>\n04:   <hr width=\"75%\"\
  \ />\n05:   <p align=\"center\">\n06:    <font size=\"4\">\n07:     <ul>\n08:  \
  \    <li><a href=\"/cgi-bin/quizzer/test_chooser.cgi\">参加\n          测验</a></li>\
  \ (注：Take a Test)\n09:      <li><a href=\"admin.html\">管理页面</a></li> (注：Admin Page)\n\
  10:     </ul>\n11:    </font>\n12:   </p>\n13: </body>\n14:\n\n| **结束示例** |\n\n\
  |  |\n\n此文件只有 14 行 HTML。它提供了两个选择：参加测验或跳转到管理页面。在现实情况下，你可能会跳过此页面直接进入这些页面。\n\n####\
  \ admin.html\n\n| **![开始示例](img/_1.gif)** |\n\n```\n01: <html><head><title>Quizzer\
  \ v0.1</title></head>\n02:  <body>\n03:   <center><font size=\"6\">Quizzer v0.1</font></center>\n\
  04:   <hr width=\"75%\" />\n05:   <table>\n06:    <tr>\n07:     <center>\n08:  \
  \    <font size=\"4\">\n09:       <ul>\n10:        <li><a href=\"create_test.html\"\
  >创建\n               测试</a></li> (注：Create a test)\n11:        <li><a href=\"/cgi-bin/quizzer/test_chooser.cgi?action=add\"\
  >添加测试</a></li> (注：Add a test)\n12:        <li><a href=\"index.html\">主页</a></li>\
  \ (注：Main Page)\n13:       </ul>\n14:      </font>\n15:     </center>\n16:    </td>\n\
  17:   </tr>\n18: </body>\n19: </html>\n```\n\n| **结束示例** |\n\n|  |\n\n此页面仅提供了创建一个测试或添加测试的链接。`line\
  \ 10` 在这里值得关注。在这一行，我们为 `test_chooser` 程序提供的链接末尾带有 `action=add`。这告诉了 `test_chooser`\
  \ 程序要做什么。\n\n#### create_test.html\n\n| **![开始示例](img/_1.gif)** |\n\n```\n01: <html>\n\
  02: <head><title>Quizzer v0.1 - 创建测试</title></head>\n03: <body>\n04:   <center>\n\
  05:    <font size=\"6\">Quizzer v0.1 - 创建测试</font>\n06:   </center>\n07:   <hr width=\"\
  75%\" />\n08:   <form action=\"/cgi-bin/quizzer/create_test.cgi\"\n        method=\"\
  post\">\n09:    <table border=\"1\" align=\"center\">\n10:     <tr>\n11:      <td>**测试名称:**</td>\n\
  12:      <td><input type=\"text\" name=\"test_name\"></td>\n13:     </tr>\n14: \
  \    <tr>\n15:      <td>**问题数量:**</td>\n16:      <td><input type=\"text\" name=\"\
  questions\"></td>\n17:     </tr>\n18:     <tr>\n19:      <td>**每道问题的选项:**</td>\n\
  20:      <td><input type=\"text\" name=\"choices\"></td>\n21:     </tr>\n22:   \
  \  <tr>\n23:      <td colspan=\"2\" align=\"center\">\n24:       <input type=\"\
  submit\" value=\"添加测试到数据库\">\n25:      </td>\n26:     </tr>\n27:    </table>\n28:\
  \   </form>\n29:   </body>\n30: </html>\n```\n\n| **结束示例](_1.gif)** |\n\n|  |\n\n\
  此文件创建了一个表单，以便测试管理员可以创建一个新测试。表单有三个输入字段：测试名称、组成测试的问题数量，以及每个问题可能具有的最大选项数量。\n\n*测试的问题数量*并不意味着管理员输入多少问题；它仅仅意味着用户需要回答多少问题才能“完成”一个测试。例如，一个测试在数据库中可能有\
  \ 100 个问题，但一个测试可能只有 10 题长。在这种情况下，用户将看到 10 个随机选择的问题，并对测试进行评分。\n\n图 6-4 显示了 create_test.html\
  \ 生成的页面样式。\n\n![点击以展开](img/fg0604_0.jpg) 图 6-4: 创建测试 HTML 表单\n\n\n\n\n\n接下来，我们将介绍构成整个\
  \ Quizzer 程序的 Perl 程序。我们将从管理程序开始，这样你就可以了解测验是如何创建的。然后，我们将介绍“用户”部分；这些是用户能看到的部分。最后，我们将介绍\
  \ `Quizzer.pm` 模块。我们之所以最后介绍 `Quizzer.pm` 模块，是因为它是将所有部分整合在一起的部分；如果我们先介绍它，你将对应用程序作为一个整体是如何工作的缺乏基本的理解。通过最后介绍它，你已经了解了应用程序应该做什么——现在我们来看看它是*如何*实现的。\n\
  \n接下去的程序由 `create_test.html` 文件调用。该程序简单地获取 HTML 表单中输入的信息，并将其存储在用于 Quizzer 应用程序的\
  \ MySQL 数据库中。\n\n## create_test.cgi\n\n| **![Start example](img/_1.gif)** |\n\n\
  ```\n01: #!/usr/bin/perl -wT\n02: #\n03: # create_test.cgi\n04: # Chapter 7\n05:\
  \ # Online Quizzer\n06: #\n07: use strict;\n08: use DBI;\n09: use CGI qw(:standard);\n\
  ```\n\n| **![End example](img/_1.gif)** |\n\n|  |\n\n**第 1 行**告诉系统去哪里寻找 Perl。它还通过\
  \ `-wT` 开启了警告和污染模式。\n\n**第 2-6 行** 仅仅是注释，提供了关于程序的信息。\n\n**第 7 行**开启了 `strict` 模块。`strict`\
  \ 模块强制程序员声明变量，并对程序员执行更严格的规则以避免常见的错误。\n\n**第 8 行** 使用 `DBI` 模块。这允许我们访问存储测试信息的数据库。\n\
  \n**第 9 行** 加载了 `CGI` 模块并读取标准方法。\n\n```\n10: my $conn = DBI->connect(\"DBI:mysql:quizzer\"\
  ,\n       \"bookuser\",\"testpass\")\n       or die(\"Cannot connect: $DBI::errstr\\\
  nAborting\");\n```\n\n**第 10 行**创建到 Quizzer 数据库的连接并返回数据库的引用（句柄），我们将其存储在 `$conn`\
  \ 变量中。如果连接数据库出现问题，程序将调用 `die` 并打印错误。\n\n```\n11: my $test_name = param(‘test_name');\n\
  12: my $questions = param(‘questions');\n13: my $choices   = param(‘choices');\n\
  ```\n\n**第 11-13 行** 使用 `my` 声明了一些变量，并使用 `CGI.pm` 模块中的 `param` 函数从 HTML 文件表单字段中读取数据。\n\
  \n```\n14: my $rval = $conn->do(\"INSERT INTO test_config SET \n15:     NumQs=$questions,\
  \ Choices=$choices, \n16:     test_name='$test_name'\");\n```\n\n**第 14-16 行** 是一条\
  \ Perl 语句，声明了一个名为 `$rval` 的 `my` 变量（在此情况下代表返回值），并将其设置为 `do` 语句返回的值。这里的 `do` 语句是对括号内\
  \ SQL 语句的 `do` 方法的调用。由于我们不需要返回任何数据，我们可以跳过通过 `prepare/execute` 访问数据库的方法，直接通过一次 `do`\
  \ 调用完成。\n\n接下来的 SQL 语句获取了从**第 11-13 行** HTML 表单传过的信息并将其存储在数据库中。\n\n```\n17: my $val\
  \ = $conn->{‘mysql_insertid'};\n18: print header();\n```\n\n**第 17 行**调用了 MySQL\
  \ 函数 `mysql_insertid`。该函数返回最后一个自增字段的值。这个功能对于我们的程序其实并不需要，但我发现没有任何关于其用法的文档示例，因此我想在实际用法中包含一个它的示例。如果出现问题，此函数调用将返回\
  \ `undef`。\n\n**第 18 行**打印由 `header` 函数返回的值/数据。`header` 函数是 `CGI.pm` 模块的一部分。它仅仅是打印我们的\
  \ `Content-Type` 头部。\n\n```\n19: if($rval) {\n20:     print <<\"    HTML\";\n21:\
  \      <html><head><title>Test Added!</title></head>\n22:       <body>\n23:    \
  \    <font size=\"4\">\n24:         <center>\n25:          Test $val Added to Database!<br>\n\
  26:         </center>\n27:        </font>\n28:       </body>\n29:      </</html>\n\
  30:     HTML\n31: }\n```\n\n**第 19 行**检查变量 `$rval` 是否包含任何数据。如果包含，我们就进入此代码块。\n\n\
  **第 20 行**开始一个在此文档（here document），打印 HTML 消息以通知用户/管理员新测验已添加成功。\n\n注意，在这个在此文档中，终止字符串被双引号包围。这导致在此文档内部的\
  \ HTML 数据表现就像它是一个双引号字符串一样。如果我们使用单引号，变量在**第 25 行**将不会被插值处理。\n\n**第 21-29 行** 仅仅是我们要显示的\
  \ HTML 消息。注意在**第 25 行**我们有一个变量 `$val` 被插值。\n\n**第 30 行** 是在此文档的结束标记。\n\n**第 31 行**关闭该块。\n\
  \n```\n32: else {\n33:     print <<\"    HTML\";\n34:      <html><head><title>Error!</title></head>\n\
  35:       <body>\n36:        <font size=\"4\">\n37:         <center>\n38:      \
  \    ERROR!!! ($DBI::errstr)<br />\n39:          Something unexpected!<br />\n40:\
  \         </center>\n41:        </font>\n42:       </body>\n43:      </html>\n44:\
  \     HTML\n45: }\n```\n\n**第 32 行**开始 `else` 块。如果 `$rval` 不包含值（在此情况下为 `undef`），我们进入此块。\n\
  \n**第 33 行**开始在此文档。\n\n**第 34-43 行** 是错误消息的 HTML。\n\n**第 45 行**关闭 `else` 块。这是该程序的结束。\n\
  \n### add_question.cgi\n\n| **![Start example](img/_1.gif)** |\n\n```\n01: #!/usr/bin/perl\
  \ -wT\n02: #\n03: # add_question.cgi\n04: # Chapter 7\n05: # Online Quizzer\n06:\
  \ # Add question 2\n07: #\n08: use strict;\n09: use CGI qw(:standard);\n10: use\
  \ lib qw(.);\n11: use Quizzer;\n```\n\n| **![End example](img/_1.gif)** |\n\n**第\
  \ 1 行**告诉系统去哪里寻找 Perl，并通过 `-wT` 开启了警告和污染检查。\n\n**第 2-7 行** 是注释，提供了关于程序的信息。\n\n**第\
  \ 8 行**开启了 `strict` 模块。`strict` 导致程序员更仔细地声明变量，并开启其他安全措施以帮助避免常见的编程错误。使用 `strict`\
  \ 是你应该一直做的事。\n\n**第 9 行**加载了 `CGI` 模块并导入了标准函数集。所有的 HTML 表单解析都应该使用 `CGI` 模块。编写自己的\
  \ HTML 表单解析器是可以，但 `CGI` 模块经过验证且运行良好。\n\n**第 10 行**告诉 Perl 当前目录也可以作为库目录——它实际上被添加到\
  \ `@INC` 数组中。这意味着当你使用 `use` 加载模块时，Perl 也会在当前目录查找匹配的模块。我们需要这样做，是因为我们的 `Quizzer.pm`\
  \ 模块与此程序在同一个目录下。\n\n**第 11 行**加载了 `Quizzer` 模块。\n\n\n\n\n`Line 11` 加载了 `Quizzer`\
  \ Perl 模块。该模块包含了我们 `Quizzer`应用程序的大部分功能。\n\n```\n12: my $test_id = param(‘test_id');\n\
  13: my $Qtext   = param(‘Qtext');\n14: my $correct = param(‘correct');\n15: my @false\
  \   = param(‘false');\n16: my $rval;\n```\n\n### 变量声明与输入（行 12-16）\n\n`Line 12` 声明了一个名为\
  \ `$test_id` 的 `my` 标量变量，并读取 HTML 表单中 `test_id` 输入框传入的值。这是数据库存储测试时的 ID。\n\n`Line\
  \ 13` 声明了一个名为 `$Qtext` 的 `my` 标量变量，并读取 HTML 表单中 `Qtext` 输入框传入的值。这是问题文本。\n\n`Line\
  \ 14` 声明了一个名为 `$correct` 的 `my` 标量变量，并读取 HTML 表单中 `correct` 输入框传入的值。这是正确答案的文本。\n\
  \n`Line 15` 声明了一个名为 `@false` 的 `my` 数组变量，并读取 HTML 表单中名为 `false` 的所有文本输入框传入的值。这些是每个错误答案的文本。\n\
  \n`Line 16` 声明了一个名为 `$rval` 的 `my` 标量变量。它用于以后存储返回值。\n\n字体 问题处理逻辑（行 17-21）\n\n```\n\
  17: my ($TestID, $NumQs, $Choices, $test_name) = \n      Get_Test_Config($test_id);\n\
  18: if($Qtext ne ‘'){\n19:    $rval = Add_Question($Qtext, $test_id, $correct, @false);\n\
  20: } \n21: print header();\n```\n\n`Line 17` 调用 `Get_Test_Config` 函数并传递测试 ID 数字。该函数位于\
  \ `Quizzer.pm` 模块中。它接收测试 ID 作为输入，返回测试 ID、问题数量、每个问题的选项数量以及测试名称。这些返回值被存储在变量 `$TestID`、`$NumQs`、`$Choices`\
  \ 和 `$test_name` 中。\n\n`Line 18` 检查 `$Qtext` 中的值是否包含任何数据。用英语的意思是：如果 `$Qtext` 不空，则进入此代码块。因此，如果\
  \ `$Qtext` 为空，我们不想将问题添加到数据库中。通过不将问题添加到数据库，`$rval` 将保持为空。（我们稍后会检查这一点。）\n\n`Line 19`\
  \ 调用 `Add_Question` 函数并将 `$Qtext`、`$test_id`、`$correct` 和 `@false` 传递给该函数。函数执行成功返回\
  \ 1，该值被存储在 `$rval` 中。\n\n`Line 20` 关闭了我们在 `line 18` 开始的小型代码块。由于我们使用的是 Perl，而且它的格言是“实现某事有多种方法”，这可以写在一行上。这基本上是作为单行语句的形式：\n\
  \n```\n$rval = Add_Question($Q, $T, $C, @F) if($Q ne ‘');\n```\n\n这样做的效果相同，但（如果我们使用相同的变量名）太长了，无法很好地放入书中，因此我们选择了普通的\
  \ `if` 块。\n\n`Line 21` 打印 `header` 函数的返回值。`header` 函数是 `CGI.pm` 模块的一部分。\n\n### HTML\
  \ 输出（行 22-49）\n\n```\n22: print <<HTML;\n23:  <html><head><title>Add A Question</title></head>\n\
  24:   <body>\n25:    <form action=\"add_question.cgi\">\n26:     <input type=\"\
  hidden\" name=\"test_id\" value=\"$test_id\">\n27:     <table border=\"1\" align=\"\
  center\">\n28:      <tr bgcolor=\"#c0c0c0\">\n29:       <td colspan=\"2\" align=\"\
  center\">\n30:       <font size=\"6\">Add question to $test_name test.</font>\n\
  31:       </td>\n32:      </tr> \n33:      <tr bgcolor=\"#e0e0e0\">\n34:       <td>&nbsp;</td>\n\
  35:       <td align=\"center\"><b>Question/Answer Text</b></td>\n36:      </tr>\n\
  37:      <tr>\n38:       <td bgcolor=\"#e0e0e0\">\n39:        <b>Question:</b>\n\
  40:       </td>\n41:       <td><input type=\"text\" size=\"60\" name=\"Qtext\"></td>\n\
  42:      </tr>\n43:      <tr>\n44:       <td bgcolor=\"#e0e0e0\">\n45:        <b>Correct\
  \ Answer:</b>\n46:       </td>\n47:       <td><input type=\"text\" size=\"60\" name=\"\
  correct\"></td>\n48:      </tr>\n49: HTML\n```\n\n`Lines 22-49` 是一个在此文档（here document），用于打印\
  \ HTML 页面的顶部部分。注意 `line 25`，此 CGI 将自身设为它生成的表单的目标（`action`）。这是完全正常的——当用户点击“提交”时，它就会触发。\n\
  \n`Line 30` 使用 `$test_name` 来显示正在编辑哪个测试。\n\n\n\n`add_question.cgi` 程序就到这里。该程序根据测试配置生成\
  \ HTML 表单，接受测试管理员的输入，并将新问题存储在数据库中。\n\n我们查看的下一个 CGI 应用是 `test_chooser.cgi` 程序。该程序查询数据库以获取所有可用测试列表；然后生成一个带有下拉列表的页面，供用户从中选择测试。\n\
  \n## test_chooser.cgi\n\n| **![Start example](img/_1.gif)** |\n\n```\n01: #!/usr/bin/perl\
  \ -wT\n02: #\n03: # test_chooser.cgi\n04: # Chapter 7\n05: # Online Quizzer\n06:\
  \ # Test Chooser\n07: #\n```\n\n| **![End example](img/_1.gif)** |\n\n|  |\n\n`Line\
  \ 1` 现在应该非常熟悉了。这一行告诉系统去哪里寻找 Perl，并开启警告和污染检查（taint checking）。\n\n`Lines 2-7` 仅仅是关于程序的注释。\n\
  \n```\n08: use strict;\n09: use lib qw(.);\n10: use Quizzer;\n11: use CGI qw(:standard);\n\
  ```\n\n`Line 8` 开启 strict 模式。\n\n`Line 9` 告诉 Perl 将当前目录 `.` 添加到 `@INC` 数组中。这允许使用\
  \ `use` 语句导入当前目录中的模块。\n\n`Line 10` 导入 `Quizzer` 模块。\n\n`Line 11` 导入 `CGI` 模块及其 `:standard`\
