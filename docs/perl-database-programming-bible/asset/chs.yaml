  \ `1`。你稍后会看到它是如何被使用的——我们基本上将其用作布尔开关来检查表单状态。\n\n`Line 33` 将 `$item{item_list}` 的值设置为调用\
  \ `Drop_Down_Item_List` 函数返回的数据。传递给子程序的 `\"name\"` 项目项表示我们想要对结果进行排序的字段名称。\n\n```\n\
  34: if($item{button} eq ‘Submit Bid'){\n35:     my $rval = Bidding_Open($dbh, $a_id);\n\
  ```\n\n`Line 34` 检查 `$item{button}` 中的值是否等于 `'Submit Bid'`。如果是，则用户可能正在尝试提交出价，因此进入此代码块。\n\
  \n`Line 35` 声明了一个名为 `$rval` 的变量，并将其设置为由 `Bidding_Open` 子程序返回的数据。`Bidding_Open` 函数接收一个数据库句柄\
  \ (`$dbh`) 和拍卖品 ID (`$a_id`)。该函数检查是否允许竞价。如果*不*允许竞价，它返回 `0`；如果允许，则返回一个不同的值。\n\n```\n\
  36:     unless($rval) {\n37:         Print_Page($tmpl, \"closed.tmpl\", \\%item);\n\
