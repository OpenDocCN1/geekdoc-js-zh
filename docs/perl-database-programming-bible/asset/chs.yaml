  \n```\n27:     $session{‘cart_qty_total’}   += $session{$prod->[1]};\n28:     $session{‘cart_price_total’}\
  \ += \n            Calc_Price($session{$prod->[1]} , $prod->[2]);\n```\n\n`Line\
  \ 27` 从 `$session{$prod->[1]}` 读取该项目的数量，并将其加到 `$session{‘cart_qty_total’}` 的当前值。这保持了购物车中项目数量的运行总计。\n\
  \n`Line 28` 操作与 `line 27` 基本相同，但维护的是价格的运行总计。`Calc_Price` 函数传递了 `qty`（$prod->[1]`）和\
