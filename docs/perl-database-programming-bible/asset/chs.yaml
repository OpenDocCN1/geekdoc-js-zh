  \ qq(SELECT * FROM library WHERE isbn = '156592297');\n```\n\n**第 11 行**包含 SQL 语句，该语句导致数据库为我们查找特定的记录。\n\
  \nSQL 语句的开头与我们的第一个示例相同，但现在有一个 WHERE 语句。整个 WHERE 语句是：`WHERE isbn = '156592297'`。这告诉\
  \ DBMS 只查找 `isbn` 字段等于 156592297 的记录。注意我们在字符串比较时使用了单等号！这是因为我们正在创建一个 *SQL* 语句，这与\
  \ *Perl* 语句不同。\n\n用英语来说，这类似于：*从 library 表中选择所有 isbn 字段等于 156592297 的记录。*\n\n\n\n\
  \n在 `WHERE` 语句中，你不限于仅使用等号 (`=`)。它支持逻辑运算符和数学运算符。有关 WHERE 中使用的的一些常用运算符，请参考附录 B。\n\n\
  ```\n12: my $sth = $dbh->prepare($sql);\n13: $sth->execute;\n14: while(my $record\
  \ = $sth->fetch){\n15:     for my $field (@$record){\n16:         print \"$field\\\
  n\";\n17:     }\n18:     print \"\\n\\n\";\n19: }\n```\n\n`Lines 12-19` 的工作方式与我们第一个示例中的代码相同。但请注意，我们删除了作为计数器的代码。由于我们只需要寻找一个匹配项，因此不需要计算返回了多少记录。\n\
  \n输出应该只包含一条记录，如下面的代码所示。\n\n```\n1565922697\nWeb Security and Commerce\nSimson Garfinkel\
  \ Gene Spafford Deborah Russell (Editor)\n    $34.95\n Paperback, 1st ed., 506pp.\n\
  \ O'Reilly & Associates, Incorporated\n May 1997\n```\n\n| | 注意 | 如果你向数据库中输入了自己的数据，而不是从网站下载表格信息，你必须修改第\
  \ 11 行中的 SQL 语句，使 WHERE 语句查找匹配你的数据的内容。 |\n\n### 带 ORDER BY 子句的 SELECT 语句\n\nDBMS\
  \ 不仅仅可以获取数据；还可以对数据进行操作，使其完全你想要的方式显示。\n\n例如，你可能希望返回的数据按出版社（publisher）字段排序。要做到这一点，请使用\
