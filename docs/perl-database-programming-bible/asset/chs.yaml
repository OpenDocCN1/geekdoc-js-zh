  \ 1998\nref[57][7] = \nref[58][0] = 1565924207\nref[58][1] = PalmPilot: The Ultimate\
  \ Guide\nref[58][2] = Tim O'Reilly (Editor)\nref[58][3] =     $29.95\nref[58][4]\
  \ =  Paperback, 1st ed., 489pp.\nref[58][5] =  O'Reilly & Associates\nref[58][6]\
  \ =  December 1998\nref[58][7] = \nref[59][0] = 1565924207\n59[1] = PalmPilot: The\
