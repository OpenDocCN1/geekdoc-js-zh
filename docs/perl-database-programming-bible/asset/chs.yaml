  \ ![下一节](img/#LiB0426_split_000.htm) |\n\n# 将 BLOB 数据存入数据库\n\n首先，我们需要确定具体想要存储什么。页面页眉的\
  \ logo 可以放入 `Auction Table`（拍卖表），而 `item_image` 可以放入 `Items Table`（商品表）。此外，我们还需要为每张图像存储一个\
  \ `MIME type`，以便我们知道存储的是哪种类型的图像。在存储数据时，图像类型并不重要，但当我们想要显示它时，我们需要告诉客户端我们发送的是什么类型的数据。\n\
  \n## 表结构\n\n`Auction Table` 的新表结构如下：\n\n```\nmysql> describe auction;\n+---------------+-------------+------+-----+---------+----------------+\n\
  | Field         | Type        | Null | Key | Default | Extra          |\n+---------------+-------------+------+-----+---------+----------------+\n\
  | auction_id    | int(11)     |      | PRI | NULL    | auto_increment |\n| name\
  \          | varchar(50) | YES  |     | NULL    |                |\n| start_bidding\
  \ | datetime    | YES  |     | NULL    |                |\n| stop_bidding  | datetime\
  \    | YES  |     | NULL    |                |\n| logo          | mediumblob  |\
  \ YES  |     | NULL    |                |\n| mime          | varchar(50) | YES \
  \ |     | NULL    |                |\n+---------------+-------------+------+-----+---------+----------------+\n\
  ```\n\n注意我们添加了 `logo` 和 `mime` 字段。`logo` 的 `mediumblob` 类型取决于你的数据库。不同的数据库以不同的方式存储二进制数据。在\
  \ `MySQL` 中，使用 `mediumblob` 类型对于几乎任何图像文件都是足够的。\n\n新的 `Items Table` 结构如下：\n\n```\n\
  mysql> describe item;\n+-------------+--------------+------+-----+---------+----------------+\n\
  | Field       | Type         | Null | Key | Default | Extra          |\n+-------------+--------------+------+-----+---------+----------------+\n\
  | item_id     | int(11)      |      | PRI | NULL    | auto_increment |\n| name \
  \       | varchar(50)  | YES  |     | NULL    |                |\n| description\
  \ | varchar(255) | YES  |     | NULL    |                |\n| donor_id    | int(11)\
  \      | YES  |     | NULL    |                |\n| value       | double       |\
  \ YES  |     | NULL    |                |\n| min_bid     | double       | YES  |\
  \     | NULL    |                |\n| min_incr    | double       | YES  |     |\
  \ NULL    |                |\n| auction_id  | int(11)      | YES  |     | NULL \
  \   |                |\n| item_image  | mediumblob   | YES  |     | NULL    |  \
  \              |\n| mime        | varchar(50)  | YES  |     | NULL    |        \
  \        |\n+-------------+--------------+------+-----+---------+----------------+\n\
  ```\n\n再次，此表与 第 7 章 中使用的表相同，除了 `item_image` 字段和 `MIME` 字段。\n\n你可以将这些字段添加到现有的数据库表中，也可以创建一个新数据库；然后在创建表时添加这些字段。在这里，我们简单地使用\
  \ `mysqldump` 函数对 `MySQL` 拍卖数据库进行了备份，并编辑了输出以添加这些字段。之后，我们使用 `mysqldump` 创建的文件创建了一个新数据库。\n\
  \n## HTML 表单\n\n我们用于将数据获取数据库的 HTML 表单非常简单。\n\n你应该熟悉 HTML 表单的操作，但你必须对表单标签做一个重要的更改。文件上传使用\
  \ `multipart` 编码，这不是默认设置，因此你必须显式设置它。\n\n此外，对于文件上传，你必须使用 `POST` 方法而不是 `GET` 方法。\n\
  \n你的表单标签可能如下：\n\n```\n<form enctype=\"multipart/form-data\" method=\"post\"\n  action=\"\
  /cgi-bin/auction_up.cgi\">\n```\n\n注意我们将编码类型 (`enctype`) 设置为 `multipart/form-data`。\n\
  \n另一个对你来说可能是新知识的是 `file` 的输入类型。要上传文件，请使用这种输入类型；仅仅在文本字段中输入文件位置是不起作用的。\n\n你的文件可能如下：\n\
  \n```\n<input type=\"file\" name=\"logo\" size=\"40\" />\n```\n\n|  | 注意事项 | 出于安全考虑，类型为\
  \ `file` 的输入字段不能自动填充 `value` 属性。这可以防止人们编写恶意程序来欺骗你从你的系统中发送文件等行为。 |\n\n这个 HTML 表单非常朴素；它看起来和\
  \ 图 8-2 中的表单一样。这只是为拍卖管理员提供了。\n\n\n\n\n每次循环时都会执行 `read` 函数。当它执行时，第一个参数是 `file handle`（文件句柄）；第二个参数是\
  \ `temporary storage variable`（临时存储变量），最后一个参数是每次读取的 `number of bytes to read`（字节数）。`read`\
  \ 在每次找到数据时都会返回 true；一旦读完，它将返回 false，这样 `while` 循环就可以退出。如果剩余待读字节少于 2048 ，Perl 会读取剩余数据并进行正确处理。你不会导致任何越界错误或类似的问题。“正确处理”是指\
  \ Perl 仅仅读取剩余内容并返回这些数据。\n\n`Line 16` 使用追加运算符将 `$data` 变量中的数据连接到 `$image_data` 变量的末尾。\n\
  \n`Line 17` 结束了 `while` 循环。\n\n```\n18: $image_data = $dbh->quote($image_data);\n\
  19: $mime       = $dbh->quote($mime);\n```\n\n`Lines 18-19` 使用 `DBI` 的 `quote` 函数对\
  \ `$image_data` 和 `$mime` 中的数据字符串进行转义。这实际上应该对所有变量都执行，以确保没有异常数据尝试发送到数据库。不过，在这个管理程序中，我们只需要担心这两个变量。\n\
  \n| | Note | 当你从未知人员处获取数据时，建议对传递给查询的所有数据使用 `quote` 函数。如果你没有对数据进行正确转义，并且有人在查询中发送了引号，可能会导致查询失败——有时这些查询失败信息包含比你可能希望让用户看到的更多的数据库服务器信息。\
  \ |\n\n```\n20: my $sql = qq{INSERT INTO auction\n21:   (name, start_bidding, stop_bidding,\
  \ logo, mime)\n22:    VALUES \n23:   (?, ?, ?, $image_data, $mime) };\n```\n\n`Lines\
  \ 20-23` 创建了向数据库中添加新记录所需的 SQL 语句。注意 `Line 22`，尽管我们使用了占位符，但也使用了普通变量。占位符在处理二进制数据时效果并不好——会发送额外数据。对于\
  \ `image_data` 字段和 `mime` 字段，使用变量是有意义的。\n\n```\n24: my $sth   = $dbh->prepare($sql);\n\
  25: $sth->execute($fd{auction_name},$fd{start_bid},\n                  $fd{stop_bid})\
  \ \n26:   or die(\"Error: $DBI::errstr \\nAborting\");\n27: print \"SUCCESS!!!\\\
  nMIME type: $mime\\n\";\n```\n\n`Line 24` 调用 `prepare` 方法，使 SQL 语句准备好以供数据库执行。\n\n\
  `Line 25` 调用 `execute` 方法并将占位符的数据发送到数据库。\n\n`Line 26` 如果执行查询时出现问题，将导致程序中止并向屏幕发送错误消息。\n\
  \n`Line 27` 向用户打印消息，告知其操作已成功。\n\n这就是向数据库添加新拍卖的程序的全部内容。这个程序并不复杂；它只是简单的获取了几个表单字段，并将适当的数据添加到数据库表中。\n\
  \n下一个程序向数据库添加项目。同样，这个程序包含一个简单的界面，因为管理员将使用它。我们需要为项目增加几个字段，因为我们需要输入每个项目的数据。请查看图 8-3\
  \ 以了解此页面的样子。同样，此页面的 HTML 可以在本书的网站找到。\n\n### 图 8-3: 添加拍卖表单\n\n```\n01: #!/usr/bin/perl\
  \ -w\n02: # upload.cgi\n03: use strict;\n04: use DBI;\n05: use CGI(:standard);\n\
  06: print header;\n```\n\n`Line 1` 告诉系统去哪里寻找 Perl 并开启警告和污染检查（taint checking）。\n\n\
  `Line 2` 是关于此程序的注释。\n\n`Line 3` 加载了 `strict` 模块。\n\n`Line 4` 加载了用于数据库访问的 `DBI` 模块。\n\
  \n`Line 5` 加载 `CGI` 模块并导入其 `:standard` 函数。\n\n`Line 6` 打印调用 `CGI` `header` 函数的结果。这只是打印\
  \ HTTP 头部。\n\n```\n07: my ($image_data, $data, %fd);\n08: my $image_handle = param('image1');\n\
  09: my $mime  =\n        CGI::uploadInfo($image_handle)->{'Content-Type'};\n```\n\
  \n`Line 7` 仅声明了几个变量。\n\n`Line 8` 创建了一个名为 `$image_handle` 的新变量，并将其设置为调用 `param` 函数返回的值。这只是在读取从\
  \ HTML 表单传递的数据。\n\n`Line 9` 使用 `CGI::uploadInfo` 函数确定刚刚上传的文件的内容类型。\n\n```\n10: my\
  \ @fields  = qw(item_name donor_id \n11:                  value min_bid min_incr\
  \ auction_id);\n12: for(@fields){ $fd{$_} = param($_); }\n```\n\n`Lines 10-11` 创建了一个名为\
  \ `@fields` 的新数组，并使用 `qw` 函数填充它。`Line 12` 遍历数组，并将 `param($_)` 的结果存入 `%fd` 哈希中。\n\
