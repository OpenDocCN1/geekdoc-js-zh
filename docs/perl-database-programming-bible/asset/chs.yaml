  \ ![下一节](img/#LiB0859_split_000.htm) |\n\n## 在 Windows 上安装 MySQL\n\nMySQL 是我们在整本书中最常用的数据库。附录的这部分将向你如何在\
  \ Windows 系统上安装 MySQL 数据库。\n\n第一步是下载软件。\n\n1.  前往 [`www.mysql.com;`](http://www.mysql.com)，点击“downloads”链接，并选择最新的“stable”（稳定）版本。\n\
  \n2.  一旦获得文件，就将其解压。使用你通常使用的任何解压缩工具将文件解压到目录中。双击 `setup.exe` 文件开始安装 MySQL。\n\n   \
  \ 图 A-14 显示了安装 MySQL 数据库的第一个屏幕。这仅仅是一个欢迎界面。\n\n    ![点击展开](img/fgaa14_0.jpg) 图 A-14：MySQL\
  \ 安装欢迎界面\n\n3.  点击 Next（下一步）按钮继续安装。\n\n    图 A-15 显示了安装 MySQL 数据库的第二个屏幕。此屏幕告诉你默认安装的位置，并提供了了一些关于自定义选项的信息。\n\
  \n    ![点击展开](img/fgaa15_0.jpg)\n\n    图 A-15：MySQL 安装信息界面\n\n4.  点击 Next 按钮继续安装。图\
  \ A-16 显示了安装 MySQL 数据库的 Setup Type（安装类型）屏幕。使用默认设置是安全的。\n\n    ![点击展开](img/fgaa16_0.jpg)\n\
  \n    图 A-16：MySQL 安装类型界面\n\n5.  点击 Next 按钮继续安装。\n\n    图 A-17 显示了安装 MySQL 数据库的\
  \ Setup Complete（安装完成）屏幕。一旦所有组件安装完成，就会到达这里。\n\n    ![点击展开](img/fgaa17_0.jpg)\n\n\
  \    图 A-17：MySQL 安装完成界面\n\n6.  点击 Finish（完成）按钮完成安装。\n\n你的系统现在看起来并没有任何变化；你甚至没有看到它安装到系统菜单中。要开始使用\
  \ MySQL，你需要打开 Windows 资源管理器并进入 `\\mysql` 目录。在那里你会找到一个 `\\bin` 目录，其中包含了执行 MySQL 任务所需的二进制文件。有一个名为\
  \ `mysqlwinadmin.exe` 的二进制文件，它是 Windows 管理工具。\n\n如果你只想进入并玩玩 MySQL，使用命令行是操作方法。双击\
  \ mysql 二进制文件，你就会得到一个像图 A-18 那样的屏幕。这是 MySQL 命令行工具，你可以通过它在 MySQL 中创建表、条目等。\n\n  \
  \  ![点击展开](img/fgaa18_0.jpg)\n\n    图 A-18：MySQL 命令行\n\nMySQL 安装就是这些。这是一项简单的任务，就像安装任何其他\
  \ Windows 应用程序一样。\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0847_split_000.htm)\
  \ ![下一节](img/#LiB0859_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0850_split_000.htm)\
  \ ![下一节](img/#LiB0861_split_000.htm) |\n\n## 在 Linux（以及 *nix）系统上安装 MySQL\n\n首先，你必须下载软件。\n\
  \n1.  前往 [`www.mysql.com;`](http://www.mysql.com)，点击“downloads”链接，并选择最新的“stable”（稳定）版本。\n\
  \n    |  | 注意  | 我更倾向于获取源码包而不是二进制包。这样我就可以看到更多安装过程中发生的情况，并感觉自己有更多的控制权。这些说明涵盖了从源码包安装\
  \ MySQL。 |\n\n2.  下载源码包，并将其放入目录中。\n\n3.  解压源码包。\n\n    ```\n    tar -xzvf source.tar.gz\n\
  \    ```\n\n4.  进入源码目录。\n\n    ```\n    cd source\n    ```\n\n5.  运行配置脚本。\n\n  \
  \  ```\n    ./configure --prefix=/usr/local\n    ```\n\n6.  编译源码。\n\n    ```\n \
  \   make\n    ```\n\n7.  安装源码。\n\n    ```\n    make install\n    ```\n\n8.  创建用户。\n\
  \n    ```\n    useradd mysql\n    ```\n\n9.  更改所有权。\n\n    ```\n    chown -R mysql\
  \ /usr/local\n    ```\n\n10. 将配置文件复制到 `/etc` 目录。\n\n    ```bash\n    cp /usr/local/my.cnf\
  \ /etc/\n    ```\n\n11. 启动守护进程。\n\n    ```\n    /usr/local/bin/mysqld &\n    ```\n\
  \nMySQL 现在应该已经启动并运行了！\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0847_split_000.htm)\
  \ ![下一节](img/#LiB0859_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0850_split_000.htm)\
  \ ![下一节](img/#LiB0861_split_000.htm) |\n\n## 在 Windows 上安装 DBI\n\nDBI 是 Perl 用于与数据库交互的接口。DBD（数据库驱动程序）对应你的数据库。\n\
  \n要在 Windows 上安装 DBI：\n\n1.  进入 ActiveStatePerl 菜单并选择 Perl Manager（Perl 包管理器）。\n\
  \n2.  这会弹出一个提示窗口。安装 DBI 只需要输入：\n\n    ```\n    install DBI\n    ```\n\n此命令将下载并安装\
  \ DBI 模块。\n\n3.  要在 Windows 上安装 DBD，我们使用 ODBC 驱动，因此输入：\n\n    ```\n    install DBD-ODBC\n\
  \    ```\n\n这将下载并安装 MySQL 的 ODBC 驱动。\n\n这就是安装所需的全部！当你准备离开 PPM 工具时，只需输入 `quit`。\n\
  \n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0859_split_000.htm)\
  \ ![下一节](img/#LiB0863_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0861_split_000.htm)\
  \ ![下一节](img/#LiB0865_split_000.htm) |\n\n## 在 Linux（nix）系统上安装 DBI\n\n在 Linux 上安装\
  \ DBI 和 DBD 驱动比 Windows 安装过程稍微复杂。\n\n我们将使用 CPAN 模块来安装 DBI 和 DBD 驱动。\n\n1.  启动 CPAN\
  \ 模块，输入：\n\n    ```\n    perl -MCPAN -e 'shell'\n    ```\n\n    这将让你进入一个像所示的提示符：\n\
  \n    ```\n    cpan>\n    ```\n\n2.  要安装 DBI，只需输入：\n\n    ```\n    install DBI\n\
  \    ```\n\n3.  安装 MySQL 的 DBD 驱动，输入：\n\n    ```\n    install DBD::mysql\n    ```\n\
  \n这些命令将下载并安装 DBI 和 DBD 驱动。\n\n在安装 `DBD::mysql` 模块可能会遇到权限问题；请参考 MySQL 文档关于设置用户和密码的说明。如果你在安装时遇到错误，可以使用\
  \ `force install DBD::mysql` 而不是使用 `install DBD::mysql` 来强制安装。\n\n这就是你将数据库模块安装到你的\
  \ Linux 系统上所需的全部操作了。\n\n\n\n\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![Previous\
  \ Section](img/#LiB0861_split_000.htm) ![Next Section](img/#LiB0865_split_000.htm)\
  \ |\n\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0863_split_000.htm)\
  \ ![Next Section](img/#LiB0875_split_000.htm) |\n\n# 在 Windows 系统上安装 MyODBC\n\n\
  对于 Windows 系统，你需要一个 ODBC 驱动程序来连接 MySQL 数据库。因此，Windows 用户需要额外安装一个程序——它同样由 MySQL 官方人员提供，名为\
  \ MyODBC。\n\n首先，你必须获取该软件。\n\n1. 访问 `[`www.mysql.com`](http://www.mysql.com)` 并点击“downloads”（下载）。然后在“Products”（产品）下，点击\
  \ `MyODBC`；接着点击下载链接和最新的“stable”（稳定）版本链接。选择与你操作系统对应的下载链接，并选择一个下载站点。\n\n2. 下载完成后，将文件解压到目录中以便运行安装。双击\
  \ `setup.exe` 文件开始安装。\n\n   图 A-19 显示了安装 MyODBC 驱动程序的第一个界面。\n\n   ![点击展开图片](img/fgaa19_0.jpg)\
  \ 图 A-19：MyODBC 安装界面\n\n3. 点击 Continue（继续）按钮继续安装。\n\n   图 A-20 显示了询问你想要安装哪些驱动程序的界面；应该只有一个——但如果有更多选项，请选择\
  \ MySQL 选项。\n\n   ![点击展开图片](img/fgaa20_0.jpg)\n\n   图 A-20：MyODBC 安装界面\n\n4. 点击\
  \ 'OK' 按钮继续安装。图 A-21 显示了选择数据源的界面。数据源用于为你连接的数据库创建一个名称，并为到数据库的连接创建一个名称。选择示例 MySQL\
  \ 。\n\n   ![点击展开图片](img/fgaa21_0.jpg)\n\n   图 A-21：MyODBC 数据源界面\n\n5. 点击 Setup（设置）按钮继续安装。\n\
  \n   图 A-22 显示了设置数据源的界面。在本例中，保持默认设置即可。\n\n   ![点击展开图片](img/fgaa22_0.jpg)\n\n   图\
  \ A-22：MyODBC 数据源设置界面\n\n6. 点击 OK 按钮继续安装。\n\n   图 A-23 显示了安装成功后的界面。\n\n   ![点击展开图片](img/fgaa23_0.jpg)\n\
  \n   图 A-23：MyODBC 安装成功界面\n\n7. 点击 OK 按钮完成安装。\n\n   你现在应该有一个可以连接的数据源了。当你连接数据库时，请使用此名称作为数据源名称\
  \ (DSN)。例如：\n\n```\nmy $dbh = \n DBI->connect(\"DBI::ODBC::datasourcename\",\"user\"\
  ,\"passwd\") \n or die...\n```\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm)\
  \ | ![Previous Section](img/#LiB0863_split_000.htm) ![Next Section](img/#LiB0875_split_000.htm)\
  \ |\n\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0865_split_000.htm)\
  \ ![Next Section](img/#LiB0877_split_000.htm) |\n\n# 附录 B：常用 SQL 参考\n\n本 SQL 参考旨在帮助解决你在阅读本书时可能遇到的任何问题。它并不是为了成为一份\
  \ 100% 完整的 SQL 参考；那需要专门的一整本书。相反，本附录包含了 SQL 关键字，以及你在操作 MySQL 时可能会看到的最常用方式。\n\n对于这些语句中的任何一个，你都需要登录数据库服务器并拥有执行命令的相应权限。如果遇到问题，请联系你的数据库管理员，或查看你的数据库文档。\n\
  \n## ALTER\n\n`ALTER` 用于修改现有表的结构。它允许你添加、删除或修改列，并从现有表中删除索引。\n\n向现有表添加新列：\n\n```\n\
  ALTER TABLE library ADD foo CHAR(50);\n```\n\n从表中删除一列：\n\n```\nALTER TABLE library\
  \ DROP foo;\n```\n\n更改列的类型：\n\n```\nALTER TABLE library MODIFY foo;\n```\n\n从表中删除索引：\n\
  \n```\nALTER TABLE library DROP foo;\n```\n\n|  |  |\n\n|  ||\n\n| ![Team LiB](img/#_back.htm)\
  \ | ![Previous Section](img/#LiB0863_split_000.htm) ![Next Section](img/#LiB0875_split_000.htm)\
  \ |\n\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0865_split_000.htm)\
  \ ![Next Section](img/#LiB0877_split_000.htm) |\n\n## CREATE\n\n`CREATE` 用于创建数据库或向数据库添加表。\n\
  \n创建一个新数据库：\n\n```\nCREATE DATABASE foo;\n```\n\n向现有数据库添加表：\n\n```\nCREATE TABLE\
  \ books (\n  isbn varchar(20),\n  title varchar(255),\n  author varchar(255),\n\
  \  price decimal(10,2),\n  format varchar(50),\n  publisher varchar(255),\n  datepub\
  \ varchar(255)\n);\n```\n\n|  |  |\n\n|  ||\n\n| ![Team LiB](img/#_back.htm) | ![Previous\
  \ Section](img/#LiB0863_split_000.htm) ![Next Section](img/#LiB0875_split_000.htm)\
  \ |\n\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0865_split_000.htm)\
  \ ![Next Section](img/#LiB0877_split_000.htm) |\n\n## INSERT\n\n`INSERT` 用于向数据库表添加数据。\n\
  \n有多种方法可以使用 `INSERT` 语句向表中插入数据。\n\n如果你在不指定字段名的情况下插入数据，数据必须按照数据库中存储的顺序进行插入。要查看数据库是如何存储字段名的，你可以在\
  \ MySQL 提示符输入 `DESCRIBE tablename`，MySQL 会向你显示表的布局。\n\n```\nINSERT INTO library\
  \ VALUES (‘020163337X','Tcl and the Tk Toolkit','John K. Ousterhout','$39.99','Paperback,\
  \ 458pp.','Addison Wesley Longman, Inc.',' February 1994',NULL);\n```\n\n如果你想插入数据，但可能不是所有数据，或者以不同的顺序插入，你可以这样做（注意\
  \ ISBN 现在位于最后，且我们省略了 notes 字段）：\n\n```\nINSERT INTO library (title, author, price,\
  \ format, publisher, datepub, isbn) VALUES (‘Tcl and the Tk Toolkit','John K. Ousterhout','\
  \    $39.99',' Paperback, 458pp.',' Addison Wesley Longman, Inc.',' February 1994',\
  \ ‘020163337X');\n```\n\n如果你想显式地命名每个字段名并对应数据，你可以这样做：\n\n\n\n\n\n```\nINSERT INTO\
  \ library SET isbn='020163337X', title='Tcl and the Tk Toolkit', author='John K.\
  \ Ousterhout', price='$39.99', format=' Paperback, 458pp.', publisher='Addison Wesley\
  \ Longman, Inc.', datepub=' February 1994');\n```\n\n## SELECT\n\n`SELECT` 可能是你最频繁使用的\
  \ SQL 语句。每你想从数据库表中获取数据时，就会使用 `SELECT`。`SELECT` 有许多可选的修饰和选项。我们在这里展示一些简单的 `SELECT`\
  \ 语句帮助你入门。\n\n要获取出版社“Wiley”的所有书籍，可以执行如下操作：\n\n```\nSELECT * FROM library WHERE publisher\
  \ = ‘Wiley’;\n```\n\n`*` 表示返回所有字段。如果你只需要标题和价格，可以执行如下操作：\n\n```\nSELECT title, price\
  \ FROM library WHERE publisher = ‘Wiley’;\n```\n\n如果你想让结果按字母顺序排序，请执行：\n\n```\nSELECT\
  \ title, price FROM library WHERE publisher = ‘Wiley’ ORDER BY(title);\n```\n\n\
  `SELECT` 可以是一个非常强大的 SQL 语句。此外还有许多数学参数（如 `SUM` 和 `AVG`）、排序参数等。请参阅 MySQL 文档以全面了解 `SELECT`\
  \ 语句的功能。\n\n例如：\n\n```\nSELECT AVG(price) FROM library;\n```\n\n返回 `library` 表中所有书籍的平均价格。\n\
  \n## UPDATE\n\n`UPDATE` 用于修改现有记录。如果你在数据库中有一条记录（例如某个人的姓名），而该姓名发生了变化，你可以使用 `UPDATE`\
  \ 语句来修改表中的姓名。\n\n```\nUPDATE table_name SET lastname=’Smith’ WHERE lastname=’Michalski’;\n\
  ```\n\n注意：显然，本附录没有涵盖所有的 SQL 语句及其所有选项，但我们涵盖了你实际运行时所需绝大多数 SQL 查询语句。这里讨论的语句是在你使用 Perl\
  \ 对 MySQL 数据库进行操作时最经常会遇到的语句。[`www.mysql.com`](http://www.mysql.com) 上的文档是处理 MySQL\
  \ 数据库的最新且极具价值的资源。该网站包含了关于 MySQL 每一个方面的详尽文档，包括完整的 SQL 参考手册。\n\n# 附录 C：MySQL 命令参考\n\
  \n本附录列出了你最经常使用的 MySQL 命令。这些命令不会在 Perl 程序中使用。相反，这些是你在对 MySQL 数据库进行基础管理时使用的命令。\n\n\
  编写本附录的原因是 MySQL 可能是你使用的数据库管理系统（DBMS）。如果你在使用其他数据库，请参考其文档获取管理说明。如果你需要更完整的文档，可以访问 [`www.mysql.com`](http://www.mysql.com)\
  \ 查看最新的 MySQL 文档。\n\n## 作为用户连接\n\n在很多时候，你可能直接从命令行连接到 MySQL。这种连接方式在创建查询时非常有帮助，因为你可以在将其编写到程序之前对其进行测试并确保它们运行正常。\n\
  \n作为交互式用户连接在调试问题时也很有用。调试时，最好是以出现问题的那个用户身份登录。例如，如果你有一个名为 `www` 的用户，密码为 `supersecret`，而你使用该账户的程序遇到了问题，请以该用户身份登录并尝试运行相同的查询。如果错误与访问权限有关，你可能从中捕获问题并找到解决方案。如果你以管理员用户登录，你将永远无法看到权限问题；管理员用户拥有执行任何操作的权限，因此当你以管理员身份登录时，错误不会发生。\n\
  \n以非管理员用户连接（在此例中为 bookuser 用户）：\n\n```\nmysql –u bookuser –p testpass\n```\n\n这以用户\
  \ `bookuser` 和密码 `testpass` 登录 `mysql`。`-u` 代表 `username`，`-p` 代表 `password`。如果\
  \ MySQL 服务器在不同的系统上，请指定主机。\n\n```\nmysql –u bookuser –p testpass –h hostname\n```\n\
  \n如果一切顺利，你应该得到类似下面的内容：\n\n```\nWelcome to the MySQL monitor.  Commands end with\
  \ ; or \\g.\nYour MySQL connection id is 10 to server version: 3.23.47\n\nType ‘help;’\
  \ or ‘\\h’ for help. Type ‘\\c’ to clear the buffer.\n\nmysql>\n```\n\n这意味着你已连接到\
  \ MySQL 并处于 MySQL 提示符下。从这里你可以直接输入 SQL 语句。在 `mysql>` 提示符处输入的所有 SQL 语句必须以分号结束。\n\n\
  例如：\n\n```\nmysql> use bookdatabase;\nmysql> select * from library;\n```\n\n上面的行告诉\
  \ MySQL 使用 `bookdatabase`，然后从 `library` 中选择所有项。\n\n## MySQL 提示符命令\n\n在 MySQL 提示符下，你可以做的不仅仅是查询数据。事实上，为了查询数据，你需要先告诉\
  \ MySQL 使用哪个数据库。要查看可用的数据库，你可以要求 MySQL 显示所有数据库。\n\n```\nshow databases;\n```\n\n\
  这应该产生类似下面的的结果：\n\n```\nmysql> show databases;\n+-----------+\n| Database  |\n+-----------+\n\
  | PerlBook |\n| mysql     |\n| test      |\n+-----------+    \n3 rows in set (0.00\
  \ sec)\n```\n\n名为 `test` 的数据库是 MySQL 安装时用于运行测试的数据库。名为 `mysql` 的数据库是 MySQL 存储所有访问信息的地方，例如用户权限。\n\
  \n`PerlBook` 数据库是我们本书使用的数据库。要使用数据库，只需如示例所示输入 `use databasename;`：\n\n```\nuse PerlBook;\n\
  ```\n\nMySQL 应该返回一条消息，告诉你数据库已更改。此时，你可以像要求显示数据库一样，让 MySQL 显示可用的表。\n\n```\nshow tables;\n\
  ```\n\n另一个在 `mysql>` 提示符下你可能会发现非常有用的命令是 `describe`。它会显示你请求的表的描述。例如，\n\n```\ndescribe\
  \ library;\n```\n\n会导致显示如下内容的内容：\n\n\n\n\n\n```\nmysql> describe library;\n+-----------+--------------+------+-----+---------+-------+\n\
  | Field     | Type         | Null | Key | Default | Extra |\n+-----------+--------------+------+-----+---------+-------+\n\
  | isbn      | varchar(20)  | YES  |     | NULL    |       |\n| title     | varchar(255)\
  \ | YES  |     | NULL    |       |\n| author    | varchar(255) | YES  |     | NULL\
  \    |       |\n| price     | varchar(20)  | YES  |     | NULL    |       |\n| format\
  \    | varchar(50)  | YES  |     | NULL    |       |\n| publisher | varchar(255)\
  \ | YES  |     | NULL    |       |\n| pubdate   | varchar(50)  | YES  |     | NULL\
  \    |       |\n| notes     | text         | YES  |     | NULL    |       |\n+-----------+--------------+------+-----+---------+-------+\n\
  8 rows in set (0.00 sec)\n```\n\n在 `mysql>` 提示符下可以使用其他命令，但它们的使用范围并不广泛，因此此处未予涵盖。请确保你查阅最新的\
  \ MySQL 文档，以获取这些命令以及我们未涵盖的命令的详细说明。\n\n## MySQL 管理命令\n\nMySQL 有一个名为 `mysqladmin`\
  \ 的管理程序，用于执行添加数据库、删除数据库（及其所有表）或重新加载权限表（访问控制表）等操作。\n\n与 `mysql` 不同，`mysqladmin` 没有交互界面。你在命令行上向\
  \ `mysqladmin` 传递选项，它执行请求的任务；然后返回 shell 提示符。\n\n要添加数据库，可以执行：\n\n```\nmysqladmin\
  \ –uadmin –p create NewDatabaseName\n```\n\n系统会要求你输入密码，就像你在命令行中没有提供密码一样。如果你输入了正确的密码，将返回\
  \ shell 提示符并创建数据库，但不会有通知显示数据库已创建。然而，如果出错，将会显示某种错误消息。\n\n如果你进入 `mysql>` 命令行界面并输入\
  \ `show databases`，你会看到新数据库与其他数据库一起列出。\n\n此外，你可以删除数据库。删除数据库意味着删除它及其所有内容。要删除数据库，只需将\
  \ `create` 替换为 `drop`。由于 `drop` 可能会删除整个数据库及其所有数据，系统会显示提示询问你是否真的要删除该数据库，默认值为 `N`（否），这样你就不会无意中按回车而丢失数据。\n\
  \n其他管理任务可以使用 `mysqladmin` 程序完成。MySQL 文档对这些进行了非常详细的描述。如果你需要执行除添加或删除（释放）数据库之外的操作，请参考最新的\
  \ MySQL 文档。\n\n## mysqldump 程序\n\n`mysqldump` 程序将向屏幕输出数据库和表结构的文本表示（“转储”），并可选地输出这些数据库/表中的所有数据。此转储可以通过\
  \ shell 命令轻松重定向到文本文件，例如：\n\n```\nmysqldump ...parameters... > dump001.txt\n```\n\
  \n转储的格式将是命令，运行这些命令将重新创建该数据库或表，如下文所示。\n\n仅导出表结构对于你想要重建结构（例如，在另一台机器上）时非常方便。通过同时也导出数据，你就拥有了数据库（或你指定的表）的完整备份。\n\
  \n这对于你自己的归档目的，或者发送给他人都非常方便。例如，我使用 `mysqldump` 导出了我的‘library’数据库表结构及其所有数据，以便你可以用它尝试书中的示例。\n\
  \n在我们一直在操作的数据库上（它只包含一个表），我们可以执行如下操作：\n\n```\nmysqldump -u bookuser -p -d PerlBook\n\
  ```\n\n一旦运行了上述命令，系统会提示输入密码。输入密码后，屏幕上会显示如下：\n\n```\n# MySQL dump 8.1\n## Host: localhost\n\
  ## Database: PerlBook\n#----------------------------------------\n## Table for library\n\
  CREATE TABLE library (\n  isbn varchar(20),\n  title varchar(255),\n  author varchar(255),\n\
  \  price varchar(20),\n  format varchar(50),\n  publisher varchar(255),\n  pubdate\
  \ varchar(50),\n  notes text\n) ENGINE=MyISAM;\n```\n\n以下代码：\n\n```\n`mysqldump\
  \ -u bookuser -p -d PerlBook` dump_structure.txt\n```\n\n## available_drivers\n\n\
  这种方法更多是为了方便考虑，并不一定会在程序中使用。调用 `available_drivers` 会返回一个安装在系统上的 DBD 驱动程序数组。\n\n以下代码：\n\
  \n```\n@drivers = DBI->available_drivers;\nprint join(\"\\n\", @drivers), \"\\n\"\
  ;\n```\n\n会产生如下内容。\n\n```\nExampleP\nCVS\nProxy\nMysql\n```\n\n这显示我们安装了四个驱动程序。使用这种方法可以快速查看系统中安装了哪些驱动程序。\n\
  \n# 附录 D: DBI 参考\n\n这是对常用 DBI 方法的参考。同样，我们将进行足够详细的介绍，让你熟悉每个命令的基本概念。要获取 DBI 模块的最新文档，请访问：[`dbi.perl.org`](http://dbi.perl.org)。\n\
  \n\n\n\n\n`bind_col` 方法用于在变量与 `SELECT` 语句中的列之间建立 `binding`（关联）。这种绑定会导致变量在每次执行时都自动更新为当前值。\n\
  \n示例：\n\n```\nmy ($title, $author);\n\nmy $sql = \"SELECT title, price, author FROM\
  \ library\";\nmy $query_handle = $conn->prepare($sql);\n$query_handle->execute();\n\
  \n$query_handle->bind_col(1, \\$title, undef);\n$query_handle->bind_col(3, \\$author,\
  \ undef);\n\nwhile($query_handle->fetch) {\n    print \"Author: $author, Title:\
  \ $title\\n\";\n}\n```\n\n上面的示例打印了 library 表中所有书籍的作者和标题。注意，`price` 是 `SELECT` 语句的一部分，但由于我们没有将其绑定到任何变量上，它的值将被直接忽略。\n\
  \n`bind_col` 语句的第一个参数是输出的列号，`1` 表示第一列。在上面的示例中，`title` 是第 1 列，`price` 是第 2 列，`author`\
  \ 是第 3 列。\n\n第二个参数是我们要绑定到该列的变量的 `reference`（引用）。\n\n第三个参数在 MySQL 中不使用。某些数据库驱动（`DBDs`）可能会使用它。在这种情况下，它是属性哈希（hash）。\n\
  \n## bind_columns\n\n`bind_columns` 与 `bind_col` 方法非常相似。然而，使用 `bind_columns`可以将查询返回的所有列在一个语句中完成绑定。这允许你通过一个语句绑定多个列。\n\
  \n示例：\n\n```\nmy ($title, $price, $author);\n\nmy $sql = \"SELECT title, price,\
  \ author FROM library\";\nmy $query_handle = $conn->prepare($sql);\n$query_handle->execute();\n\
  \n$query_handle->bind_columns(undef, \\($title, $price, $author));\n\nwhile($query_handle->fetch)\
  \ {\n    print \"Author: $author, Title: $title, Price: $price\\n\";\n}\n```\n\n\
  在这个示例中，我们不需要担心一个一个地绑定每一列。相反，我们通过一条语句完成了所有 `all` 变量的绑定。使用此函数的一个注意点是，用于绑定的变量数量必须与\
  \ SQL 语句返回的数量 `exactly` 相同。如果你正在执行 `SELECT *` 且有八个字段，那么在 `bind_columns` 函数调用中必须有八个变量，即使你并不打算使用所有它们。\n\
  \n`bind_columns` 的参数与 `bind_col` 函数类似。第一个参数 MySQL 不使用，但某些 `DBDs` 可能会使用它。如果使用，则预期接收的是一个属性哈希。第二个参数是标量变量列表的引用。\n\
  \n## commit\n\n`commit` 用于支持此函数的数据库将更改永久化。在 MySQL 上，目前不支持事务，因此 `commit` 函数不起任何作用。一旦\
  \ MySQL 获得事务能力，该函数很可能会被更新以与 MySQL `DBD` 配合工作。\n\n示例：\n\n```\n$return_code = $query_handle->commit;\n\
  ```\n\n上面的示例尝试向数据库提交最近的更改。如果存在问题，将返回一个错误代码并存储在 `$return_code` 中。\n\n此外，`commit`\
  \ 仅在 `Autocommit` 关闭时有效。`Autocommit` 是支持它的数据库的 `connect` 语句中使用的标志。如果启用了 `Autocommit`，它将在更改发生时自动提交。\n\
  \n## connect\n\n`connect` 用于创建到数据源的连接。这是一个简单的 `connect` 示例：\n\n```\n$dbh = DBI->connect(\"\
  DBI:mysql:database=dbname\", \"username\", \"password\")\n```\n\n其中 `DBI` 是驱动程序，`dbname`\
  \ 是数据库名称。也可以传递属性哈希：\n\n```\n$dbh = DBI->connect(\"DBI:mysql:database=dbname\", \"\
  username\", \"password\", {RaiseError => 1})\n    or die ($DBI::errstr);\n```\n\n\
  ## $DBI::errstr\n\n`DBI::errstr` 包含最后一个 DBI 错误的错误消息。`DBI::errstr` 会保留该值直到发生另一个错误，此时它会被新的错误消息替换。如果没有发生\
  \ DBI 错误，`DBI::errstr` 包含 `undef`。\n\n## disconnect\n\n`disconnect` 将数据库句与其连接的数据库分离。在\
  \ MySQL 中，不需要调用 `disconnect`。然而，如果支持事务，你需要在退出程序之前调用 `$disconnect`，以确保所有更改都已提交。\n\
  \n如果你想创建可移植的代码，在程序结束前调用 `disconnect` 是一个好主意。如果在断开数据库时发生错误，错误将被存储在 `$DBI::errstr`\
  \ 中。\n\n示例：\n\n```\n$db_handle->disconnect or die (\"Error: $DBI::errstr\");\n```\n\
  \n## do\n\n`do` 用于执行非 SELECT SQL 语句。它的作用相当于 `$handle->prepare` 和 `$handle->execute`，只不过是在一次函数调用中完成所有操作。`do`\
  \ 的返回值受影响的数。\n\n示例：\n\n```\nmy $sql_statement = qq(INSERT INTO kids VALUES ?, ?,\
  \ ?);\nmy @stuff =  qw(luc rae logan);\nmy $rows = $handle->do($sql_statement, {},\
  \ @stuff);\n```\n\n此示例将我孩子的名字插入到数据库表 *kids* 中。\n\n\n\n\n第一个参数是实际的 SQL 语句。它可以是一个包含该语句的变量，也可以是\
  \ SQL 语句的实际文本。第二个参数是属性哈希的引用，在 MySQL 中不使用。第三个参数是一个数组，其中包含了用于替换 SQL 语句中占位符（“?”）的数据。\n\
  \n只有第一个参数是必须的，其他参数都是可选的。\n\n## dump_results\n\n你可能不会在完成的程序中使用此方法，但在开发（和/或调试）程序时，调用它非常有用。\n\
  \n调用 `dump_results` 会通过 STDOUT 打印语句句柄（handle）中剩余的数据。如果尚未通过 `fetch` 访问任何数据（这通常是如此），则\
  \ SQL 语句中的所有数据都将被打印出来。\n\n示例：\n\n```\n$handle->dump_results;\n```\n\n## execute\n\
  \n`execute` 执行 SQL 查询并返回受影响的行数。`execute` 在准备语句之后被调用，并可以包含用于替换 SQL 语句中任何占位符的数据。\n\
  \n示例：\n\n```\n$sql1 = qq{SELECT * FROM library};\n$sql2 = qq{INSERT INTO library\
  \ (title, author, price) \n    VALUES (?, ?, ?)};\n\n$handle1 = $db_handle->prepare($sql1);\n\
  $handle2 = $db_handle->prepare($sql2);\n\nmy $rows1 = $handle1->execute;\nmy $rows2\
  \ = $handle2->execute(\"Evil Empires for Dummies\", \"Bill Gates\", 12.95);\n```\n\
  \n这些示例展示了如何单独调用 `execute` 以及配合占位符调用。`$rows` 中的值是对应 SQL 语句受影响的行数。\n\n## fetch\n\n\
  `fetch` 用于获取行数据并返回数组引用。它以数组引的形式返回单行数据，数组中的每一项都是该行中的一个项目。`fetch` 是 \"fetchrow_arrayref\"\
  \ 的缩写——这两个名称含义相同，且调用同一个函数。\n\n示例：\n\n```\nwhile ($ref = $handle->fetch){\n    print\
  \ join(‘, ‘, @$ref), \"\\n\";\n}\n```\n\n这会打印 `$handle` 中的每一行数据，每个字段之间用逗号和空格分隔。\n\
  \n### fetchall_arrayref\n\n`fetchall_arrayref` 返回一个数组的引用，该数组中的每一项都是行数据的引用。这与 `fetch`\
  \ 函数非常相似，不同之处在于返回的是 `$handle` 中剩余的所有数据，而不是单行。\n\n示例：\n\n```\nmy $ref = $handle->fetchall_arrayref;\n\
  foreach my $row (@$ref) {\n    print \"Row: \", join(‘, ‘, @$row), \"\\n\";\n}\n\
  ```\n\n此示例也打印了每一行数据，就像我们使用 `fetch` 方法做的那样。然而，此方法可能会消耗更多内存，因为它持有所有返回的数据，而不是一次只处理一行。\n\
  \n### fetchrow_array\n\n`fetchrow_array` 返回一个数组而不是数组的引用。这是从句柄中获取数据的另一种方法。每个方法的作用基本上是相同的，因此你可以选择你偏好的方法。\n\
  \n示例：\n\n```\nwhile(my($author, $title, $price) = $handle->fetchrow_array){\n  \
  \  print \"Title: $title, Author: $author, Price: $price\\n\";\n}\n\nwhile(my(@array)\
  \ = $handle->fetchrow_array){\n    print \"Title: $array[1], Author: $array[0],\
  \ Price: $array[2]\\n\";\n}\n```\n\n这些示例只是遍历数据并打印每条记录，直到没有更多数据。\n\n## fetchrow_hashref\n\
  \n`fetchrow_hashref` 返回一条记录，即哈希的引用。哈希的键是数据库字段名，有助于记住正在引用的数据。\n\n示例：\n\n```\nwhile(my\
  \ $hashref = $handle->fetchrow_hashref){\n    print \"Title: $hashref->{title’},\
  \ \n        Author: $hashref->{author’}, \n        Price: $hashref->{price’}\\n\"\
  ;\n}\n```\n\n## prepare\n\n`prepare` 接收 SQL 语句作为参数并返回语句句柄。`prepare` 获取 SQL 语句并将其存储在内部的编译形式中。它还为\
  \ `execute` 函数准备好了 SQL 语句。\n\n示例：\n\n```\n$statement_handle = $db_handle->prepare(\"\
  SELECT * FROM library\");\n```\n\n## quote\n\n`quote` 用于对 SQL 查询语句中的字符串进行引用。某些数据库对\
  \ SQL 语句中的数据有不同的引用方法，因此为了尽可能保持兼容性，请使用 `quote` 函数而不是手动引用数据。\n\n示例：\n\n```\nmy $oldstring\
  \ = \"Brent's kids are named: Luc, Rae, and Logan.\";\nmy $newstring = $db_handle->quote($oldstring);\n\
  ```\n\n`$newstring` 中的字符串现在已准备用于 SQL 语句，并且在处理单引号时应该不会任何问题。\n\n## rollback\n\n\n\n\
  \n`rollback` 是 `commit` 函数的相反操作。如果你正在使用支持事务的数据库，`rollback` 用于在发生问题时回滚到之前的数据。因此，如果你启动了一个事务且程序中发生错误，你可以设置对\
  \ `rollback` 函数的调用，以便任何尚未提交到数据库的更改都恢复到它们的原始值。\n\n示例：\n\n```\n$return_code = $query_handle->rollback;\n\
  ```\n\n上述示例恢复了原始数据；在 `$query_handle` 句柄上进行的任何更改都将被丢弃。如果 `rollback` 出现问题，将返回一个错误代码并存储在\
  \ `$return_code` 中。\n\n## 符号与数字\n\n- `&` (ampersand), XML, 313, 402\n- `=` (连接运算符),\
