  n\";\n26:     print \"ISBN: $record->{isbn}\\n\";\n27:     print \"Cost: $record->{price}\\\
  n\";\n28:     print \"Pub Date: $record->{pubdate}\\n\";\n29:     print \"\\n\"\
  ;\n30:     $counter++;\n31: }\n```\n\n## 第 5 章：修改你的数据\n\n## 概述\n\n在第 4 章 中，你学习了如何从数据库中获取数据，但处理数据库不仅仅是获取数据——它还涉及添加数据、修改现有数据以及删除数据。本章涵盖了这三种基本数据库操作技能的基础知识。\n\
  \n\n\n\n\n由于 `SQL` 是模仿英语语言建模的，你可以认为 `SQL` 语句非常容易记忆。要向数据库添加数据，请使用 SQL 语句 `ADD`。`UPDATE`\
  \ 修改现有的记录，而 `DELETE` 则从表中删除记录。\n\n一旦我们涵盖了这三个基本的数据操作操作，我们将把它们所有内容整合到一个综合程序中，为你提供一个运行中的示例。这个示例程序随后可以作为开发更强大的数据库应用的起点。\n\
  \n本章仍然涉及非常基础的数据库概念。一旦进入更高级的章节，你将学习到许多快捷方法以及处理数据库数据的更强的方法。\n\n在我们开始介绍本章的示例程序之前，请注意，我们在示例中仍然使用\
  \ `'library'` 表。这是一个非常简单的单表数据库，我们用来存储书籍数据。当我们进入高级章节时，将处理一些数据库归一化和多表问题。\n\n|  | \
  \ |\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0147_split_000.htm)\
  \ ![Next Section](img/#LiB0168_split_000.htm) |\n| ![Team LiB](img/#_back.htm) |\
  \ ![Previous Section](img/#LiB0165_split_000.htm) ![Next Section](img/#LiB0173_split_000.htm)\
  \ |\n\n## 使用 ADD\n\n我们的第一个示例涉及向数据库添加数据。该程序的用户界面仅仅是命令行。该程序允许用户向数据库输入一个项目。尽管该程序具有功能性，但它并不用户友好。随着本书的进展，我们将创建更多功能的用户界面。\n\
  \n```\n01: #!/usr/bin/perl -w\n02: #\n03: # program 5-1\n04: # Chapter 5\n05: #\
  \ Listing 1\n06: #\n07: use strict;\n08: use DBI;\n```\n\n`Line 1` 告诉系统哪里找到 Perl，并使用\
  \ `-w` 标志开启警告。\n\n`Lines 2-6` 是提供程序信息的注释。你可能会注意到在应用程序内部我使用的注释很少。唯一的原因是因为我在这里对代码提供了详细的注释。通常情况下，我会在代码中使用充足的注释，这样如果有人需要维护程序，或者只是想看它是做什么的，他们可以轻松地通过注释来实现。注释是好的；请慷慨地使用它们。\n\
  \n`Line 7` 开启 `strict` 预编译指令。这强制程序员使用更好的编程实践，例如在在使用变量之前声明它们。使用 `strict` 预编译指令有助于程序员避免许多常见错误，例如无意中重用变量名。\n\
  \n`Line 8` 加载 `DBI` 模块。连接到数据库的程序需要 `DBI` 模块。该模块编写得很好，已成为 Perl 数据库编程的事实标准。\n\n```\n\
  09: my $conn = DBI->connect (\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\")\
  \ \n10:     or die(\"Cannot connect: $DBI::errstr\");\n```\n\n`Lines 9-10` 构成了一个单一\
  \ Perl 语句，尝试创建一个 `DBI` 类的对象，表示与数据库的连接。如果无法连接，我们对 `DBI->connect` 的调用将失败，我们将通过使用 `die`\
  \ 终止程序。\n\n```\n11: my ($sql, %book, @keys);\n12: Get_Data();\n13: Execute_Transaction();\n\
  ```\n\n`Line 11` 声明了一些我们在程序中使用使用的变量。\n\n`Line 12` 调用了 `Get_Data` 子程序。该子程序从用户那里收集书籍信息。\n\
  \n`Line 13` 调用了 `Execute_Transaction` 子程序。这是将数据写入数据库的子程序。\n\n```\n14: sub Get_Data{\n\
  15:     $book{‘isbn'}      = Get_Input(\"Enter ISBN #\");\n16:     $book{‘title'}\
  \     = Get_Input(\"Enter Book Title\");\n17:     $book{‘author'}    = Get_Input(\"\
  Enter Book Author\");\n18:     $book{‘price'}     = Get_Input(\"Enter Book Price\"\
  );\n19:     $book{‘format'}    = Get_Input(\"Enter Book Format\");\n20:     $book{‘publisher'}\
  \ = Get_Input(\"Enter Book Publisher\");\n21:     $book{‘pubdate'}   = Get_Input(\"\
  Enter Publish Date\");\n22:     $book{‘notes'}     = Get_Input(\"Enter Notes\");\n\
  23:     return 1;\n24: }\n```\n\n`Line 14` 开始了 `Get_Data` 子程序。\n\n`Lines 15-22`\
  \ 填充 `%book` 哈希表。从每次调用 `Get_Input` 返回的数据存储在 `%book` 哈希表对应的哈希键中。\n\n`Line 23` 从子程序返回\
  \ `1`。返回一个真值（在此例中为 `1`）是   Perl 编程习惯。返回真值使程序员很容易测试子程序是否成功完成。\n\n`Line 24` 关闭了 `Get_Data`\
  \ 子程序。\n\n```\n25: sub Get_Input {\n26:     print $_[0], \"\\n\";\n27:     return\
  \ $STDIN;\n28: }\n```\n\n`Line 25` 开始了 `Get_Input` 子程序。\n\n`Line 26` 打印 `$_[0]`\
  \ 紧跟 `\\n`。\n\n`Line 27` 返回 `$STDIN`。\n\n`Line 28` 关闭了 `Get_Input` 子程序。\n\n```\n\
  29: sub Execute_Transaction{\n30:     @keys = keys %book;\n31:     @vals = values\
  \ %book;\n32:     chomp(@vals);\n```\n\n`Line 29` 开始了 `Execute_Transaction` 子程序。这是将数据写入数据库的子程序。\n\
  \n`Line 30` 将 `%book` 的键赋值给 `@keys`。\n\n`Line 31` 将 `%book` 的值赋值给 `@vals`。\n\n`Line\
  \ 32` 使用 `chomp(@vals)` 移除数组每个元素末尾的换行符。\n\n```\n33:     @vals = map{$conn->quote($_)}\
  \ @vals;\n```\n\n`Line 33` 使用 `map` 对 `@vals` 调用 `$conn->quote()`。`map` 在括号 `{}`\
  \ 内部对数组的每个成员执行函数。\n\n```\n34:     $sql = \"INSERT INTO library (\"\n35:        \
  \    .(\", \", @keys)\n36:            \") VALUES (\"\n37:            . join(\",\
  \ \", @vals)\n38:            \")\";\n```\n\n这个代码块可能有点棘手，因此在继续之前请确保你理解了它。\n\n`Lines\
  \ 34-38` 实际上是一个单一的 Perl 语句；注意结束语句的分号在 `Line 38`。\n\n`Line 34` 仅仅将一段文本存入名为 `$sql`\
  \ 的变量。\n\n`Line 35` 以点开头。点被称为拼接运算符，用于连接字符串。`join` 函数用于将数组中的所有值与传递给它的值连接起来——在这里我们传递了\
  \ `\", \"`，因此每个值都通过引号的内容连接。\n\n此行通过逗号和空格连接 `@keys` 数组中的每个值。\n\n`Line 36` 向 `$sql`\
  \ 字符串添加文本。\n\n`Line 37` 与 `line 35` 做着几乎相同的事情，只是它作用于值而不是键。\n\n`Line 38` 通过添加末尾的\
  \ `)` 完成了该 SQL 命令字符串。\n\n我们完成的 SQL 语句看起来像这样：\n\n```\n39:   my $query = $conn->prepare($sql);\n\
  40:   $query->execute or die(\"\\nError executing SQL statement! $DBI::errstr\"\
  );\n```\n\n\n\n\n\n`Line 39` 使用 DBI 连接对象的 `prepare(#LiB0919_split_001.htm_919)`\
  \ 方法来准备好要运行的 SQL 语句。它返回一个代表我们即将执行的查询的新对象，该对象随后将更新数据库。\n\n`Line 40` 调用 `$query` 句柄的\
  \ `execute(#LiB0912_split_001.htm_912)` 方法，这实际上是在数据库中运行该 SQL。如果数据库返回了任何错误，程序将终止并向我们返回该错误。\n\
  \n```\n41:     print \"Record added to database.\\n\";\n42:     return 1;\n43: }\n\
  ```\n\n`Line 41` 仅使用 `print` 函数打印一条消息，以便用户知道记录已经添加。\n\n`Line 42` 从此子程序返回一个真值。\n\n\
  `Line 43` 关闭 `Execute_Transaction` 子程序。\n\n这就是我们的的第一个允许我们修改数据库中数据的应用程序。这个应用程序一次只添加一条记录，但我们很快就会编写出功能比这多得应用程序。\n\
  \n|  |  |\n|  |  |\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0165_split_000.htm)\
  \ ![Next Section](img/#LiB0173_split_000.htm) |\n| ![Team LiB](img/#_back.htm) |\
  \ ![Previous Section](img/#LiB0168_split_000.htm) ![Next Section](img/#LiB0179_split_000.htm)\
  \ |\n\n## 使用 UPDATE\n\n一旦你在数据库中有了条目，你最终会想要修改其中一些。我们现在将编写一个程序，根据 ISBN 码修改数据库中的记录。\n\
  \n在我们学习下一个应用程序时，请尝试注意它与上一个程序之间的许多相似之处。这个程序使用了许多相同的代码。然而，在这个程序中使用了一些不同的技术，以向你展示实现相同目标的不同方法。\n\
  \n```\n01: #!/usr/bin/perl -w\n02: #\n03: # program 5-2\n04: # Chapter 5\n05: #\
  \ Listing 2\n06: #\n07: use strict;\n08: use DBI;\n```\n\n`Line 1` 与我们其他应用程序的开头行一样。它告诉系统去哪里寻找\
  \ Perl，并使用 `-w` 开启警告。\n\n`Lines 2-6` 是关于程序的注释。\n\n`Line 7` 加载 `strict` 预指令。这强制程序员使用更好的编程技术，以避免常见的编程错误。\n\
  \n`Line 8` 加载 `DBI` 模块。这是 Perl 用于与数据库交互的数据库接口（DataBase Interface）。\n\n```\n09: my\
  \ $conn->connect (\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\") \n10:     \
  \  or die(\"Cannot connect: $DBI::errstr\");\n```\n\n`Lines 9-10` 构成了一个完整的 Perl\
  \ 语句，尝试创建一个 `DBI` 类的对象，代表与数据库的连接。如果无法建立连接，对 `DBI->connect` 的调用将失败，我们必须使用 `die` 来终止程序。\n\
  \n```\n11: my $old_isbn;\n12: my $book = Get_Data();\n13: Change_Record($book);\n\
  ```\n\n`Line 11` 声明了一个名为 `$old_isbn` 的标量变量。使用这个变量是为了如果书籍的 ISBN 发生变化，我们仍然记得旧值，因为那是我们需要在数据库中查询的值。\n\
  \n`Line 12` 调用 `Get_Data` 子程序。这与上一个示例中调用的函数有点不同。在这个示例中，`Get_Data` 子程序返回 `%book`\
  \ 哈希的引用，我们将其存储在名为 `$book` 的标量变量中。\n\n`Line 13` 调用 `Change_Record` 子程序，在这个示例中，我们把哈希引用（存储在\
  \ `$book` 中）传递给子程序，以便它可以访问数据。\n\n```\n14: sub Get_Data{\n15:     my %book;\n16:\
  \     $old_isbn        = Get_Input(\"Enter ISBN of Book to Modify\");\n```\n\n`Line\
  \ 14` 开始 `Get_Data` 子程序。\n\n`Line 15` 声明了一个名为 `%book` 的哈希变量。由于我们在子程序内部声明变量并使用了 `my`，该变量的作用范围仅限于该子程序*内部*。当你用\
  \ `my` 声明变量时，该变量的作用域仅存在于最内层的块中。在我们之前的示例中，`%book` 是全局作用域的，我们在任何嵌套块之外声明的其他变量也是如此。\n\
  \n随着程序的增长，控制你的变量变得越来越重要。当你将所有变量都声明为全局变量且不在子程序之间传递或或返回任何内容时，就很容易开始“互相踩脚（stepping\
  \ on the toes）”。我的意思是，当一切都是全局的，且你正在处理一个名为 `$foo` 的变量时，你能完全确定 `$foo` 包含你认为包含的数据吗？并不总是如此，特别是当\
  \ `$foo` 在程序中被频繁使用时。\n\n`Line 16` 调用 `Get_Input` 子程序来提示用户输入修改书籍的 ISBN。`old_isbn`\
  \ 变量存储了返回的值。\n\n```\n17:     $book{isbn}      = Get_Input(\"Enter ISBN (even not\
  \ changed)\");\n18:     $book{title}     = Get_Input(\"Enter Title\");\n19:    \
  \ $book{author}    = Get_Input(\"Enter Author\");\n20:     $book{price}     = Get_Input(\"\
  Enter Price\");\n21:     $book{format}    = Get_Input(\"Enter Format\");\n22:  \
  \   $book{publisher} = Get_Input(\"Enter Publisher\");\n23:     $book{pubdate} \
  \  = Get_Input(\"Enter Publish Date\");\n24:     $book{notes}     = Get_Input(\"\
  Enter Notes\");\n```\n\n`Lines 17-24` 使用 `Get_Input` 子程序提示用户输入并将值存入 `%book` 哈希中。\n\
  \n```\n25:     return(\\%book);\n26: }\n```\n\n`Line 25` 返回 `%book` 哈希的引用。通过返回这个引用，我们可以将其存储在标量变量中并在子程序间传递。当我们需要访问数据时，只需对其解引用即可。\n\
  \n`Line 26` 结束 `Get_Data` 子程序。\n\n```\n27: sub Get_Input {\n28:     print $_[0],\
  \ \":n\";\n29:     return scalar <STDIN>;\n30: }\n```\n\n`Line 27` 开始 `Get_Input`\
  \ 子程序。\n\n`Line 28` 打印传递给此子程序的第一个项目、冒号和换行符。打印的文本是字段名，以便用户知道他们在为哪个字段输入数据。\n\n`Line\
  \ 29` 返回用户输入的值。你在这一行看到的句柄 `<STDIN>` 是标准输入句柄。它的工作方式类似于文件句柄，只不过是从键盘而不是文件读取。`scalar`\
  \ 函数防止 `<STDIN>` 在返回返回值之前读取标准输入中的所有行。\n\n`Line 30` 关闭 `Get_Input` 子程序。\n\n```\n\
  31: sub Change_Record{\n32:     my $book = shift;\n```\n\n`Line 31` 开始 `Change_Record`\
  \ 子程序。\n\n`Line 32` 使用 `shift` 函数获取传递给该子程序的第一个（也是唯一的）值，并将其存储在 `$book` 变量中。\n\n`shift`\
  \ 用于从数组头部取一个值。由于我们没有向 shift 传递一个数组进行操作，`shift` 默认使用 `@_` 数组。`@_` 数组是存储传递给子程序的所有的地方；通过使用\
  \ `shift`，我们可以轻松地读取传入的值。\n\n```\n33: my @keys = keys   %$book;\n34:     my @vals\
  \ = values %$book;\n35:     chomp (@vals); \n```\n\n\n\n\n\n`第 33-34 行` 的作用与我们之前示例中的\
  \ `第 29-32 行` 相同。这些行与之前示例的区别在于 `$book` 是一个哈希（hash）的引用，因此我们需要对其去引用（de-reference）以获取实际哈希。为了做到这一点，我们在\
  \ `$book` 前放置一个 `%`。对于那些觉得那样更清晰的人，也可以写成 `%{$book}`。\n\n`第 35 行` 使用 `chomp` 函数移除\
  \ `@vals` 数组中值末尾的所有换行符。\n\n```\n36:     @vals = map{$conn->quote($_)} @vals;\n```\n\
  \n`第 36 行` 使用 `map` 函数对 `@vals` 数组中的所有项调用 `quote` 函数。`map` 会对传递给 `map` 函数的数组中的每个成员执行大括号\
  \ `{}` 内部的函数（或函数）。因此，你可以轻松地使用 `map` 转换数组中的每一个项。\n\n```\n37: my $sql = \"UPDATE library\
  \ SET \";\n38:     my $counter = 0;\n39:     foreach my $key (@keys){\n40:     \
  \    $sql .= \"$key = ‘$vals[$counter]', \";\n41:         $counter++;\n42:     }\n\
  43:     $sql =~ s{, $}{ WHERE isbn = ‘$old_isbn'}; \n```\n\n`第 37 行` 开始我们用于构建更新数据库所需的\
  \ SQL 语句的代码。此行声明了一个名为 `$sql` 的 `my` 变量，并将 SQL 语句的第一部分存储其中。\n\n`第 38 行` 创建了一个名为 `$counter`\
  \ 的变量并将其初始化为 0。我们在遍历 `@vals` 数组时将其作为索引。\n\n`第 39 行` 开始一个 `foreach` 循环，该循环遍历 `@keys`\
  \ 数组并将当前值存储在名为标量变量 `$key` 中。\n\n`第 40 行`（使用 `.=` 运算符）将当前值追加到 `$sql` 变量上。如果我们当前的\
  \ `$key` 值为 \"title\"，且 `$vals[$counter]` 的当前值是 `[\"Perl Database Programming,\"\
  ]`，那么这一行将把 `title = ‘Perl Database Programming',` 追加到变量 `$sql` 中当前内容的任何值的末尾。\n\n\
  | Note | `$sql .= \"foo bar blah\"` 是编写 `$sql = $sql . \"foo bar blah\"` 的简写方式。\
  \ |\n\n`第 41 行` 将 `$counter` 变量加 。\n\n`第 42 行` 关闭从第 39 行开始的 `foreach` 循环。\n\n`第\
  \ 43 行` 通过将最后一个逗号和空格（`, `）替换为 `WHERE isbn = ‘value of old isbn'` 来完成 SQL 语句。\n\n\
  | 提示 | 我对这个正则表达式使用了不同的语法。我没有使用 `/` 来界定正则表达式，而是使用大括号来包裹部分，如下所示：`{查找的内容} {替换的内容}`。在我看来，这有时会让正则表达式更容易跟读。\
  \ |\n\n```\n44:     my $query = $conn->do($sql) \n45:         or die(\"\\nError\
  \ executing SQL statement! $DBI::errstr\");\n46:    print \"Record information updated\
  \ in the database...\\n\";\n47:    return 1;\n48: }\n```\n\n`第 44 行` 使用了一种新方法与数据库交互。你不需要执行\
  \ `$foo = $conn->prepare($sql)` 然后执行 `$foo->execute`，如果你只是在进行一次 SQL 调用且不期望返回任何数据，可以使用\
  \ `do` 方法来节省额外的 `prepare` 步骤。\n\n`第 45 行` 是第 44 行的延续，如果在执行 SQL 命令时发生错误，它将导致程序终止并显示错误消息。\n\
  \n`第 46 行` 向用户打印一条消息，表示更新成功。\n\n`第 47 行` 从子程序返回一个真值。\n\n`第 48 行` 结束 `Change_Record`\
  \ 子程序。\n\n到此为止，我们修改现有数据的应用程序就结束了。添加和修改的代码大部分是相同的——主要的区别在于 SQL 语句。\n\n## 使用 DELETE\n\
  \n现在我们可以添加和修改数据了，让我们创建一个允许用户从数据库表中删除数据的程序。我们的下一个应用程序做的正是这一点；它允许用户移除一条记录。\n\n```\n\
  01: #!/usr/bin/perl -w\n02: #\n03: # program 5-3\n04: # Chapter 5\n05: # Listing\
  \ 3\n06: #\n07: use strict;\n08: use DBI;\n```\n\n`第 1 行` 现在应该应该非常熟悉了。它告诉程序使用警告。\n\
  \n`第 2-6 行` 是注释。\n\n`第 7 行` 使用 `strict`。\n\n`第 8 行` 使用 `DBI`。\n\n`第 9 行` 创建到数据库的连接。\n\
  \n```\n09: my $conn = DBI->connect(\"DBI:mysql:database=library\", \"user\", \"\
  pass\")\n10:     or die(\"Cannot connect to database: $DBI::errstr\");\n```\n\n\
  `第 10 行` 使用 `or die` 子句处理连接失败的情况。\n\n`第 11 行` 开始 `Delete_Record` 子程序。\n\n```\n11:\
  \ sub Delete_Record{\n12:     print \"Enter the ISBN of the book to delete: \";\n\
  13:     $isbn = <STDIN>;\n14:     chomp($isbn);\n15:     my $result = $conn->do(\"\
  DELETE FROM library WHERE isbn = '$isbn'\")\n16:         or die(\"Error executing\
  \ SQL statement: $DBI::errstr\");\n17:     if($result){\n18:         print \"Record\
  \ deleted from database.\\n\";\n19:     }else {\n20:         print \"Record DELETED!\
  \ No such ISBN.\\n\";\n21:     }\n22:     return 1;\n23: }\n```\n\n`第 11 行` 开始 `Delete_Record`\
  \ 子程序。\n\n`第 12 行` 向用户打印提示。\n\n`第 13 行` 从 `STDIN` 读取 ISBN 并存储在变量 `$isbn` 中。\n\n\
  `第 14 行` 使用 `chomp` 移除 `$isbn` 末尾的换行符。\n\n`第 15 行` 使用 `do` 方法执行 SQL 查询并将结果存储在 `$result`\
  \ 中。如果调用失败，`or die` 将带有错误信息终止程序。\n\n`第 17 行` 检查 `$result` 是否包含真值。如果是，则执行其块内的代码。\n\
  \n`第 18 行` 打印成功消息。\n\n`第 19 行` 是 `if..else` 块的 `else` 部分。如果 `$result` 不包含值（为假），则执行此块内的代码。\n\
  \n`第 20 行` 打印失败消息，指示未找到此类 ISBN。\n\n`第 21 行` 关闭 `if..else` 块。\n\n`第 22 行` 从子程序返回一个真值。\n\
  \n`第 23 行` 结束 `Delete_Record` 子程序。\n\n主程序随后这样调用子程序：\n\n```\n24:     Delete_Record();\n\
  ```\n\n\n\n\n我们已经涵盖了与数据库交互程序的各个部分。但到目前为止，我们的用户界面一直非常精简。我们的下一个应用程序使用 Tk 库来绘制屏幕。这个应用程序到目前为止是我们编写的最复杂的程序。它的代码量接近\
  \ 150 行！这是一个全面的示例，应该汇集我们到目前为止涵盖的所有概念。\n\n|  | 备注 | 我最初使用 Curses 库为这个程序创建用户界面。在写出超过\
  \ 300 行代码并让它按照我想要的方式运行后，我发现它在 Windows 系统上无法正常运行。因此，我不得不重写程序的用户界面部分！数据库访问保持不变，所以那部分代码是可以保留的。使用\
  \ Tk 的新程序比 Curses 程序短了 150 多行，而且用户界面漂亮得多。我在安装了当前版本 ActiveState Perl 的 Windows 98\
  \ 机器和 Linux 机器上对其进行了测试——两者运行良好且看起来非常棒。 |\n\n \n\n请注意，下一个程序使用了 Tk。由于这是一本数据库书籍，而不是\
  \ Tk 书籍，我们不会太关注程序的 Tk 方面，所以如果你不熟悉 Tk，可以安全地跳过程序的这些部分。\n\n让我们深入其中，创建一个 GUI 数据库应用程序。\n\
  \n```\n01: #!/usr/bin/perl -w\n02: #\n03: # program 5-4\n04: # Chapter 5\n05: #\
  \ Listing 4\n06: #\n07: use strict;\n08: use DBI;\n09: use Tk;\n```\n\n`Line 1`\
  \ 现在你应该非常熟悉了。它告诉系统哪里寻找 Perl 并开启警告。\n\n`Lines 2-6` 仅仅是关于程序的注释。\n\n`Line 7` 调用 `strict`\
  \ 编译指令以强制更好的编程风格。\n\n`Line 8` 加载 `DBI` 模块，以便此程序可以与数据库通信。\n\n`Line 9` 加载 `Tk` 模块。我们使用\
  \ `Tk` 构建用户界面。`Tk` 是一个用于创建 Unix/或 Linux 和 Windows 图形界面的工具包。\n\n```\n10: my $conn\
  \ = DBI->connect (\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\")\n11:      \
  \ or die(\"Cannot connect: $DBI::errstr\\n\");\n12: my ($sql, @keys, $record);\n\
  ```\n\n`Lines 10-11` 组成一个的 Perl 语句，尝试创建一个 `DBI` 类对象，代表与数据库的连接。如果无法建立连接，我们对 `DBI->connect`\
  \ 的调用将失败，我们将使用 `die` 终止程序。\n\n`Line 12` 声明了一些我们在程序范围内全局使用的变量。\n\n```\n13: my %fields\
  \ = \n14:     ‘isbn'   => \"ISBN: \"   , ‘title'     => \"Title: \"   , \n15:  \
  \    ‘author' => \"Author: \" , ‘price'     => \"Price: \"   ,\n16:      ‘format'\
  \ => \"Format: \" , ‘publisher' => \"Publisher: \",\n17:      ‘pubdate'=> \"Pub.\
  \ Date: \" );\n18: my @order = qw(isbn title author publisher format pubdate price);\n\
  ```\n\n`Line 19` 调用 `Start_Tk_Interface` 子程序。该子程序负责创建 GUI 窗口以及处理所有输入。\n\n`Line 20`\
  \ 结束程序！是的，就是这样！当然，还有那些执行所有工作的子程序。它们接下来就会出现。\n\n```\n21: #-----------------------------------------------------\n\
  22: # Database Routines\n23: sub Get_Record {\n```\n\n`Lines 21-22` 仅仅是注释，有助于确定程序后续部分的功能。\n\
  \n`Line 23` 开始定义 `Get_Record` 子程序。该子程序用于从数据库获取一条记录。\n\n```\n24:  my $isbn   = shift;\n\
  25:  my $sql    = qq(SELECT * FROM library WHERE isbn = $isbn);\n26:  my $hdl_search\
  \ = $conn->prepare($sql);\n```\n\n`Line 24` 创建了一个名为 `$isbn` 的标量变量，并使用 `shift` 函数将其设置为传递子程序的值。\n\
  \n`Line 25` 创建了一个名为 `$sql` 的标量变量，并将新创建 SQL SELECT 语句存储其中。\n\n`Line 26` 在 `$sql`\
  \ 语句上调用 `prepare` 函数，并创建一个名为 `$hdl_search` 的变量，它是准备好的搜索 SQL 语句的句。\n\n```\n27:  \
  \   $hdl_search->execute;\n28:     $record = $hdl_search->fetchrow_hashref;\n29:\
  \     $record;\n30: }\n```\n\n`Line 27` 在 `$hdl_search` 句上使用 `execute` 来运行查询。\n\n\
  `Line 28` 调用 `fetchrow_hashref` 函数获取结果。\n\n`Line 29` 返回 `$record`，即指向哈希的引用。\n\n\
  `Line 30` 结束 `Get_Record` 子程序。\n\n```\n31: sub Delete_Record {\n32:     my $isbn\
  \  = shift;\n33:     $sql    = qq(DELETE FROM library WHERE isbn = '$isbn');\n34:\
  \     my $query = $conn->prepare($sql);\n35:     $query->execute or die(\"\\nError\
  \ executing statement! $DBI::errstr\");\n36:     return 1;\n37: }\n```\n\n`Lines\
  \ 13-17` 创建了一个名为 `%fields` 的哈希。该哈希用于在数据库字段名和我们展示给用户的更美形式之间进行转换。`%fields` 哈希的键字段与数据库行名相同；`%fields`\
  \ 哈希的值将展示给用户。\n\n`Line 18` 创建了一个名为 `@order` 的数组。该数组包含了数据库表的字段名，并按照我们希望它们在用户界面窗口上显示的顺序进行排列。\n\
  \n\n\n\n这是一个循环，其中 `$field` 每次循环都会更改到下一个数据库表单字段。`$top_win` 是指向正在创建/显示的窗口的引用。`Entry`\
  \ 是 `Tk` 类中的一个对象，用于输入文本。\n\n所以我们最终得到了一个类似于这样的哈希表（hash）：\n\n```\n$form{isbn} = $ref_to_entry_field,\
  \ $form{title} = $ref_to_title_field, etc...\n```\n\n让我们回到第 42 行的代码。我们将 `$isbn`\
  \ 设置为右侧 `get()` 方法返回的任何内容。\n\n`$form->{'isbn'}` 是我们通过解引用哈希表来获取存储在 `isbn` 键中的值的方法。同时，我们通过\
  \ `->get()` 调用了一次 `get()`。这导致在字段中解引用后的值上执行 `get()` 方法。\n\n或者，如果你更倾向于极简的解释：`第 42\
  \ 行` 获取了表单上 `isbn` 字段中输入的值。\n\n这段代码也可以写成两行，如下：\n\n```\n my $foo = $form->{'isbn'};\n\
  $isbn   = $foo->get();\n43:     my @keys = keys %$form;\n```\n\n`第 43 行` 将 `%$form`\
  \ 哈希表中的所有键存储到一个名为 `@keys` 的数组中。这样做是为了我们可以在后续代码中方便地遍历这些值。\n\n```\n44:     my @vals\
