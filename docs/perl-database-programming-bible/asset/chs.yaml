  \ | 上一节](#LiB0200_split_000.htm) 下一节](#LiB0215_split_000.htm) |\n\n# 第二部分：高级数据库编程\n\
  \n## 本部分内容\n\n第 6 章 Web 数据库编程\n\n第 7 章 从数据库获取数据（高级）\n\n第 8 章 处理二进制（BLOB）数据\n\n第\
  \ 9 章 使用类型绑定哈希（Tied Hashes）进行会话管理\n\n第 10 章 数据库事务\n\n## 第 6 章：Web 数据库编程\n\n## 概述\n\
  \nWeb 与数据库的结合是任何网站拥有有用信息的必要条件。用户不想访问静态页面；他们想要获得最新的信息。使用数据库是维护和展示动态信息的极佳方式。\n\n要在\
  \ Web 服务器上执行程序，我们使用通用网关接口（CGI）。由 Lincoln Stein 编写的 CGI 模块对于 Perl CGI 程序非常有用。\n\n\
  本章将提供一些 Web 界面设计的建议，涵盖一些基础 HTML 表单标签，并向你展示如何利用数据库动态生成页面。\n\n\n\n\n\n## HTML 表单标签\n\
  \n在为数据库创建 Web 界面之前，你需要熟悉几个 HTML 标签。本节将介绍你将最频繁使用的标签。本文不涵盖用于基础 HTML 页面和表格的标签。更多信息和教程链接请参阅万维网联盟（W3C）的网站\
  \ [`www.w3.org`](http://www.w3.org)。\n\n我们将介绍最常用的标签；然后通过几个示例将它们整合在一起，让你看到这些项目的实际运行效果，从而更好地理解它们是如何协同工作的。\n\
  \n### `<form>`\n\nHTML `<form>` 标签用于在 Web 页面上开始表单。`<form>` 标签有两个我们将介绍的属性：`action`\
  \ 和 `method`。\n\n#### `<form action='/cgi-bin/foo.cgi'>`\n\n`action` 属性告诉浏览器在提交表单时将请求发送到哪里。`/cgi-bin/`\
  \ 目录是 Web 服务器上存放 CGI 程序的地方。此路径可能会根据你所使用的 Web 服务器的配置而改变。\n\n#### `<form action='/cgi-bin/foo.cgi'\
  \ method='post'>`\n\n`method` 属性告诉 Web 浏览器如何将数据传递给 Web 服务器。使用了两种方法：`post` 和 `get`。`post`\
  \ 方法通过标准输入 `STDIN` 传递表单数据。`get` 方法将表单数据放在 URL 中。由于 `get` 在 URL 中传递数据，因此它具有 `post`\
  \ 方法不具备的局限性。也就是说，URL 中实际可以传递的数据量有限制。此限制因不同的浏览器和 Web 服务器而异。`post` 方法没有这种限制，而且不会像\
  \ `get` 方法那样让传递给服务器的信息显而易见。\n\nHTML 规范要求必须提供 `action` 属性：如果省略了它，则将由浏览器决定恰宜的操作。为了确保兼容性，请始终使用\
  \ `action` 属性。`method` 属性的默认值是 `get`。\n\n在开发 Web 应用程序时，使用 `get` 方法，这样你就可以始终看到哪些数据被传递给了程序。当你对应用程序满意时，请切换到\
  \ `post` 方法，这样 URL 就不会被所有的表单数据填满，也不会触及 URL 长度限制。\n\n例如，如果我们有一个名为 `name.cgi` 的 CGI\
  \ 应用程序，并使用 `get` 方法传递信息，URL 看起来像所示：\n\n```\nhttp://www.perlguy.net/cgi-bin/name.cgi?first=Brent&last=Michalski\n\
  ```\n\n如果我们使用 `post` 方法，URL 看起来如下：\n\n```\nhttp://www.perlguy.net/cgi-bin/name.cgi\n\
  ```\n\n传递的数据可能相同，但由于它是通过不同的方法传递的，对用户是不可见的。\n\n### `<input type='foo' name='field_name'>`\n\
  \n`<input>` 标签是 HTML 表单中最常用的标签。它之所以被广泛使用是因为它非常多功能，并且有许多不同的属性来修改其行为，正如我们在接下来的章节中看到的。\n\
  \n#### `<input name='field_name'>`\n\n`name` 属性用于维护表单数据与页面上项目之间的关系。它基本上是一个变量名，用于访问存储在字段中的数据。\n\
  \n#### `<input name='field_name' type='text'>`\n\n`type` 为 `text` 的输入框是许多表单上常见的文本输入框。这种\
  \ HTML 表单输入用于从用户那里收集文本信息。\n\n#### `<input name='field_name' type='password'>`\n\n\
  `password` 类型与文本输入框完全相同。但当数据输入此框时，只会显示内容（通常是星号或圆点）。*注：原文此处似乎漏掉了描述，但根据语境翻译为隐藏显示内容。*（注：原文为\
  \ \"But when data is entered into this box, only...\" 处有有断或或不完整，翻译时保持逻辑连贯）\n\n`action`\
  \ 属性是 HTML 规范强制要求的：如果省略它，则由浏览器决定恰宜的操作。为了确保兼容性，请始终使用 `action` 属性。`method` 属性的默认值是\
  \ `get`。\n\n在开发 Web 应用程序时，使用 `get` 方法，这样你就可以始终看到哪些数据被传递给了程序。当你对应用程序满意时，切换到 `post`\
  \ 方法，这样 URL 就不会被所有的表单数据填满，也不会触及 URL 长度限制。\n\n例如，如果我们有一个名为 `name.cgi` 的 CGI 应用程序，并使用\
  \ `get` 方法传递信息，URL 看起来像所示：\n\n```\nhttp://www.perlguy.net/cgi-bin/name.cgi?first=Brent&last=Michalski\n\
  ```\n\n如果我们使用 `post` 方法，URL 看起来如下：\n\n```\nhttp://www.perlguy.net/cgi-bin/name.cgi\n\
