  \ |\n\n## 设计数据库\n\n设计你的数据库表在程度上是一门艺术：在简单性、保持数据一致性和性能之间始终存在权衡。以下是一些可以追求的目标以及帮助你的准则。\n\
  \n### 规范化\n\n我们在本节中经历的步骤在数据库术语中被称为 `normalization`（规范化）。当满足以下条件时，数据处于第一范式（1NF）：\n\
  \n*   消除重复组（不同的电话号码）\n*   为不同的数据创建单独的表：人放在 people 表中，书籍放在 books 表中，CD 放在 CD 表\n\
  *   为每张表选择一个主键\n\n当满足以下条件时，处于第二范式（2NF）：\n\n*   移动在几行中重复的数据\n*   向原始表添加主键\n\n当满足以下条件时，数据处于第三范式（3NF）：\n\
  \n*   移动独立数据到单独的表\n\n当然，你可能没有它。在这一切之后，你的应该不允许任何重复。\n\n#### 消除冗余数据\n\n新结构解决了一个问题：我们可以添加任意数量的号码。但在许多方面，它比开始时更糟。由于\
  \ Brigitte 没有号码，其中一行在主键列上有一个 `NULL` 值。还有大量的冗余数据。重复会导致几个问题：\n\n*   添加新行需要重新输入信息。\n\
  *   如果某人更改了姓名或地址，我们必须更新多行。\n*   如果我们删除某人的所有电话号码，除非小心，否则可能会丢失他的地址。\n*   数据重复的地方，某些副本*将会*出错（因为输入错误，或者因为值已更改但只更新了某些副本）。\n\
  \n#### 使每行唯一可标识\n\n大多数 DBMS 要求每表都有主键：对于每一行都是唯一的且不为 `NULL` 的一个或多个列。通过主键来连接相关表，将一个表的主键放入相关表中，在它处被称为外键。主键是图\
  \ 1-7 中的 `name` 列，以及图 1-8 中的 `phone_type` 列。\n\n某些列作为主键比其他列更有。名字仅在非常小的表中有效：在一个办公室里，十二个人可能有六个人叫\
  \ Chris。社会安全号码经常被作主键：它们应该是唯一的，但除了隐私和安全问题外，你可能不知道数值；某些人（儿童、外国游客等）并没有它们。\n\n如果一个表没有明显的主键，由\
  \ DBMS 提供的顺序增数字或其他唯一数字（如 `UUID` 通用标识符）就是解决方案。\n\n\n\n\n现在我们可以让每个人拥有任意数量的电话号码——甚至没有！我们可以通过在姓名（name）列上连接地址表和电话表来获取原始数据。如果我们想包含没有电话号码的人，就必须执行\
  \ `OUTER JOIN`（外连接）。\n\n对于这个应用程序，我们可能到此为止了，但在更大的系统中，还有其他有用的步骤。\n\n### 消除不依赖于键的数据\n\
  \n下一步是将任何不与行键直接相关的数据移动到另一个表中。在图 1-10 中，州（state）与人的姓名无关，但州与城市（city）相关的，因此我们可以创建一个包含城市和州的表。如果将所有这些规则递归应用于所有表，我们最终会得到很多小表。\n\
  \n![点击展开](img/fg0110_0.jpg)\n\n图 1-10：地址、城市和州的拆分表\n\n由于州名在多行中出现，它可以被移动到它自己的表中。我们最终将单一的姓名、地址和电话号码表拆分为四个。所有数据都是可用的；没有不必要的重复，我们可以通过连接重新创建原始的单表。\n\
  \n### 反规范化\n\n规范化的一个问题是，如果你遵循所有规则，可能会得到许多小表。这会导致复杂且可能低效的查询，涉及大量的连接。在这个简单的地址和电话示例中，将城市和州分开是多此一的。每个对地址的查询都需要连接地址表、城市表和州表。如果你发现自己处于这种境地，答案可能是反规范化：添加一些冗余来简化你的应用程序。在这种情况下，将\
  \ `state` 列放回地址表使结构变得简单得多，代价是为每个地址都要输入州名。\n\n### 为性能添加索引\n\n没有人喜欢使用缓慢的电脑，也没有人想等待很长时间让数据库找到他们请求的数据。除了\
  \ DBMS 和其运行的计算机之外，影响性能的因素还有良好的数据设计和索引。\n\n对于小表（例如，几百行），索引可能不是必需的：维护和使用索引是有开销的。对于较大的表，索引使\
  \ DBMS 运行得高效得多，特别是在连接表时。\n\n为每个用于连接表的列（或每组列）添加索引。当你想要防止列中的重复项时，指定唯一索引。为经常搜索的列添加索引，这样\
  \ DBMS 就不需要顺序搜索。\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0037_split_000.htm)\
  \ ![下一节](img/#LiB0065_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节\
  \ ![下一节](img/#LiB0067_split_000.htm) |\n\n## 总结\n\n我们讨论了处理数据库时所需的概念和术语。尽管某些细节在供应商之间有所不同，但本章所有内容适用于所有关系数据库。不同的\
  \ DBMS 以不同的方式存储数据，但数据始终表示为行和列组成的表，你可以通过共同值对它们进行连接。当你开始在第 4 章中使用 SQL `SELECT` 语句时，你将使用\
  \ `RESTRICT`、`PROJECT` 和 `JOIN` 运算符。\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm)\
  \ | ![上一节](img/#LiB0052_split_000.htm) ![下一节](img/#LiB0067_split_000.htm) |\n\n\
  | ![Team LiB](img/#_back.htm) | ![上一节 ![下一节](img/#LiB0071_split_000.htm) |\n\n##\
  \ 第 2 章：使用数据库\n\n## 概述\n\n在 Perl 中处理数据库在你的程序中需要极少的额外工作。由于 `DBI` 模块编写得很好且稳定，编写启用数据库的程序对程序员来说只需要极少的额外思考。当然，你需要计划想要访问的数据以及如何查询它——但连接到数据库并在其上执行\
  \ SQL 查询是非常简单的。\n\n|  | 引用 | 附录 A 提供了如何安装 `DBI` 模块和 `DBD` 驱动模块的说明。请在继续之前确保你已安装这些内容，因为我们将使用它们。为了确保\
  \ `DBI` 模块已安装并正常工作，并查看系统上有哪些数据库驱动程序，让我们写一个短脚本来查询系统： |\n\n```\n01: #!/usr/bin/perl\
  \ -w\n02: # connect_test.pl\n03: # Chapter 2\n04: # Listing drivers\n05: use strict;\n\
  06: use DBI;\n07: print \"Available Drivers:\\n\";\n08: print \"*\" * 40, \"\\n\"\
  ;\n09: print join(\"\\n\", DBI->available_drivers()), \"\\n\\n\";\n```\n\n`Line\
  \ 1` 告诉系统哪里找到 Perl 并开启警告（`-w`）。警告在编写程序时是有用的，因为它们是调试的辅助工具。在生产代码中关闭警告是完全可以的。在生产代码中开启警告日志文件中产生不必要的诊断信息。\n\
  \n`Lines 2-4` 仅仅是关于程序的注释。\n\n`Line 5` 开启 `strict` 模式。在这样一个小型的程序中，`strict` 不是必须的，但我养成了编程时使用\
  \ `strict` 的习惯，因为它在调试时可以可以救命。`strict` 强制程序员声明变量并开启额外的错误检查。\n\n|  | 提示 | 在开始编程时*始终*使用\
  \ `strict`。在现有的程序中添加 `strict` 通常是一项大任务；如果不开启 `strict` 模式，Perl 会允许很多糟糕的做法。一旦添加了 `strict`，所有的糟糕代码都必须修复。为了消除这个问题，从一开始就使用\
  \ `strict` 编写所有的应用程序。 |\n\n`Line 6` 加载 `DBI` 模块；这是访问数据库所需的。\n\n`Line 7` 打印一条消息。\n\
  \n`Line 8` 打印 40 个星号。`* 40` 告诉 Perl 打印引号中的文本 40 次。然后我们有一个逗号和一个换行符，将输出放到下一行。\n\n\
  `Line 9` 使用 Perl 的 `join` 函数。`join` 用于将一个数组与一个共同字符串结合。我们连接的字符串是换行符 `\\n`，我们正在连接的数组实际上是\
  \ `DBI->available_drivers()`，因为这个函数返回一个数组。我们在后面加上两个换行符，为程序输出添加两个空行。\n\n\n\n\n在 Perl\
  \ 中读取或写入普通文件，你需要打开一个文件句柄（file handle）。同样，在 Perl 中访问 DBI 数据库，你需要创建一个数据库句柄（database\
  \ handle）。数据库句柄是你用于维护与数据库连接的工具，当你需要调用函数或执行 SQL 查询时，通过它引用特定的数据库连接。一个程序中可以存在多个数据库句柄；这意味着你可以连接到多个数据库，甚至连接到多个数据库服务器。你连接的服务器甚至不需要在同一个大陆！然而，由于目前的网络连接限制，数据库服务器确实需要在同一个星球上。数据库句柄通常通过命名为\
  \ `$dbh` 或类似 `$dbh_accounting` 的变量来引用。\n\n让我们来看连接到某些数据源、获取一些数据、打印并断开连接的程序。并不是所有数据库都需要断开连接，但为了编写真正的可移植代码，你应该始终调用\
  \ `disconnect`。\n\n```\n01: #!/usr/bin/perl -w\n02: #\n03: # connect_multi.pl\n\
  04: # Chapter 2\n05: # Listing 2\n```\n\n`Line 1` 告诉系统去哪里寻找 Perl，并使用 `-w` 选项开启警告。警告可以提供一些额外的诊断信息，这在编写应用程序时非常有帮助。\n\
  \n`Lines 2-5` 仅仅是关于这个程序的注释。\n\n```\n06: use strict;\n07: use DBI;\n```\n\n`Line\
  \ 6` 加载了 `strict` 模块。该模块强制执行比不使用 `strict` 编码更严格的编程规则。强烈建议使用 `strict`，因为它可以防止许多难以调试的简单编程错误——例如拼写错误的变量名。\n\
  \n`Line 7` 加载了 `DBI` 模块；我们需要它，因为它为我们提供了数据库连接的接口。\n\n```\n08: my $dbh_m = \n    \
  \   DBI->connect(\"DBI:mysql:quizzer:dbserver.perlguy.net\",\n       \"bookuser\"\
  ,\n       \"password\") \n09:     or die(\"Cannot connect: $DBI::errstr\");\n```\n\
  \n`Line 8` 稍微拆分了一下，使其看起来更美观且更容易解释。\n\n`line 8` 的第一部分声明了一个名为 `$dbh_m` 的新变量。这代表 *D*ata*B*ase\
  \ *H*andle to *M*ySQL（MySQL 数据库句柄）。\n\n`line 8` 的下部分调用了 `DBI` 的 `connect` 方法。`connect`\
  \ 方法需要传入几个参数——*Data Source Name*（数据源名称）、*username*（用户名）和 *password*（密码）。\n\n`Line\
  \ 9` 是 `line 8` 的延续。如果连接数据库出错，此行会导致程序终止（报错）。\n\n下面是两个示例的连接语句。第一个连接语句包含了你可以传递的所有选项/属性。第二个连接语句包含最少量的选项/属性，同时仍然有效的连接语句。\n\
  \n```\nContaining everything:\nmy %attr => ( RaiseError => 0 );\n$dbh =\nDBI->connect(\"\
  dbi:mysql:dbname=BibleBook:host.hair.net:1023\",\n    \"username\", \"password\"\
  , \\%attr) \n    or die(\"Error: $DBI::errstr\");\nContaining the minimum:\n$dbh->connect(\"\
  dbi:mysql:BibleBook\", \"username\", \"password\")\n    or die(\"Error: $DBI::errstr\"\
  );\n```\n\n## The Data Source Name (DSN)\n\nDSN 是一个将所有连接信息传递给数据库接口的字符串。它以 `DBI:`\
  \ 开始。由于某种原因，这部分不区分大小写，但 DSN 的其余部分是区分大小写的。之后是数据库名称和冒号。对于 MySQL 数据库，我们将像这样开头：`DBI:mysql:`。数据库驱动程序的名称是区分大小写的——所以如果你收到错误但拼写驱动程序名称是正确的，请确保大小写也是正确的。\n\
  \n接下来是数据库名称。不同的数据库在这里需要不同的数据。对于 MySQL（前面的 `connect` 语句正在连接的对象），我们只需列出数据库名称 `quizzer`。对于\
  \ PostgreSQL（我们稍后会提供示例），数据库名称之前必须带有 `dbname=`。对于我们的 PostgreSQL 示例，这变变为 `dbname=quizzer`。在\
  \ MySQL 中，如果你愿意，可以使用 `dbname=`，但这不是强制的。其他数据库（如 Oracle）在这里使用不同的字符串，而 CSV 驱动程序使用字符串\
  \ `dir=`（其中 `dir=` 指向存储数据文件的目录）。\n\n服务器地址和端口号也可以放在 DSN 中！在之前的示例中，我们列出了服务器名称 `dbserver.perlguy.net`；由于我们使用的是默认的\
  \ MySQL 端口 (3306)，我们可以省略它。\n\n一个完整的 DSN 看起来像这样：\n\n```\nDBI:mysql:dbname=quizzer:dbserver.somewhere.com:1234\n\
  ```\n\n这些字符是必须的，其他的是可选的。哇！这确实很多信息，但能够连接到数据库绝对很重要。\n\n`connect` 字符串的接两个部分是 `username`\
  \ 和 `password`。这些不是普通用户的用户名和密码；而是被访问的数据库或或的用户名和密码。数据库通常有自己的权限系统来限制对某些数据的访问——这些用户名和密码值属于数据库权限系统。\n\
  \n`Line 9` 是 `line 8` 的延续。如果连接数据库出错，此行会让系统调用 `die` 函数（终止）并打印错误消息。`DBI::errstr` 是\
  \ `DBI` 模块中的一个变量，每当遇到错误时就会被赋值。此行会导致错误消息打印并停止执行。\n\n```\n10: my $dbh_p = DBI->connect(\"\
  DBI:Pg:dbname=test\",\n        \"postgres\",\"\") \n11:     or die(\"Cannot connect:\
  \ $DBI::errstr\");\n```\n\n`Line 10` 是我们同样连接的 PostgreSQL 数据库的连接语句。该数据库的 DSN 是 `DBI:Pg:dbname=test`。这个连接语句比之前的短得多，因为我们不需要\
  \ `servername` 或 `port`，因为该数据库服务器与程序在同一个系统中。该数据库的用户名是 `postgres`；没有密码，所以我们传递了一个空字符串。\n\
  \n`Line 11` 与 `line 9` 相同。\n\n在程序的这一点，我们拥有了到两个不同服务器上两个不同数据库的两个连接！MySQL 数据库的数据库句柄是\
  \ `$dbh_m`，PostgreSQL 服务器的数据库句柄是 `$dbh_p`。\n\n```\n12: my $sql = qq(select * from\
  \ test_config);\n```\n\n`Line 12` 创建了一个名为 `$sql` 的新标量变量并设置为右侧的字符串。`qq` 函数非常好，因为它的作用与双引号一样；如果你的字符串中包含双引号，你不需要在它们前面放置反斜杠字符。\n\
  \n```\nmy $sql = qq(select * from test WHERE foo = \"bar\");\n```\n\n比下面的写法更容易读：\n\
  \n```\nmy $sql = \"select * from test WHERE foo = \\\"bar\\\"\";\n```\n\n尽管上面的示例非常简单，如果你开始创建包含许多引号变量的查询，你会发现使用\
  \ `qq()` 比引号和反斜杠容易得多，而且不容易出现类型错误。\n\n这个 `$sql` 变量存储了要在两个数据库上运行的 SQL 语句。该 SQL 语句告诉数据库服务器从\
  \ `test_config` 表中选择所有数据。两个数据库都有一个名为 `test_config` 的表。\n\n```\n13: my $sth_m = $dbh_m->prepare($sql);\n\
  14: my $sth_p = $dbh_p->prepare($sql);\n```\n\n\n\n`Lines 13-14` 都声明了一个新的标量变量，该变量将用作我们在右侧准备的语句的句柄。`prepare(#LiB0919_split_001.htm_919)`\
  \ 方法接收 SQL 语句并将其存储在内部的编译格式中，数据库可以对其进行处理。\n\n`$sth_` 与我们的数据库句柄 `$dbh_` 类似。语句句柄常用的命名方式是\
  \ `$sth` 或 `$sth_*description*`。\n\n```\n15: $sth_m->execute;\n16: $sth_p->execute;\n\
  ```\n\n`Lines 15-16` 也执行了相同的任务。它们在语句句柄上调用了 `execute(#LiB0912_split_001.htm_912)`\
  \ 方法。`execute(#LiB0912_split_001.htm_912)` 方法接收准备好的 SQL 语句并在数据库引擎上运行它。\n\n```\n\
  17: while(my $p = $sth_m->fetch){\n18:     print \"MySQL: @$p\\n\";\n19: }\n```\n\
  \n`Line 17` 开始了一个 while 循环。这个 while 循环获取了 `line 15` 上执行的 SQL 语句产生的数据。你在 while 条件中看到的\
  \ `fetch` 方法抓取返回数据的一行（*即 a.k.a. 记录*），并返回一个包含这些数据的数组引用（*即 a.k.a. 指针*）。指向该数组的指针存储在变量\
  \ `$p` 中。（`fetch` 方法将在本书稍后部分进行详细介绍。）\n\n`Line 18` 打印该行数据。我们在这里没有使用特殊格式；只是将数据打印出来。\n\
  \n`Line 19` 结束了从 `line 16` 开始的 while 循环。\n\n```\n20: print \"\\n\";\n```\n\n`Line\
  \ 20` 仅仅打印一个空行。这有助于区分两个数据库的输出。\n\n```\n21: while(my $p = $sth_p->fetch){\n22:  \
  \   print \"PostGreSQL: @$p\\n\";\n23: }\n```\n\n`Lines 21-23` 执行的操作与 `lines 17-19`\
  \ 相同，但是在 PostGreSQL 数据库上而非 MySQL 数据库。\n\n```\n24: $dbh_m->disconnect;\n25: $dbh_p->disconnect;\n\
  ```\n\n`Lines 24-25` 将 `disconnect(#LiB0908_split_001.htm_908)` 程序从数据库中分离。`Disconnect(#LiB0908_split_001.htm_908)`\
  \ 确保所有数据都正确写入表中。某些数据库在乎你是否断开连接，而另一些不在。始终使用 `disconnect(#LiB0908_split_001.htm_908)`\
  \ 方法，这样你就不需要担心这个问题。\n\n|  |  |\n\n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0071_split_000.htm)\
  \ ![下一节](img/#LiB0078_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0074_split_000.htm)\
  \ ![下一节](img/#LiB0079_split_000.htm) |\n\n## Oracle 连接\n\n与其他数据库相比，Oracle 处理起来可能更像头头兽。不要误会我；Perl\
  \ 仍然与 Oracle 建立接口并且表现非常好——不过，设置一切可能是一个复杂得的过程，因为安装 Oracle 比安装 MySQL 之类的数据库要任务重得多。\n\
  \nPerl 仍然使用 `DBI` 进行数据库访问，并使用 `DBD` 驱动程序。然而，要设置 `DBD::Oracle` 驱动程序，你需要在系统上正确安装 Oracle\
  \ 客户端软件。这就是为什么在 Oracle 数据库上使用 Perl 时，配置会更加痛苦。设置 Oracle 客户端软件远没有设置 MySQL 或 PostGreSQL\
  \ 那么简单。\n\n此外，在与 Oracle 数据库工作时，运行程序的用户必须设置了正确的 Oracle 环境变量，例如 `ORACLE_HOME` 变量。这些设置应该从你的\
  \ Oracle DBA 处获得。\n\n除了上述注意事项外，连接到 Oracle 数据库并在上面运行命令与处理任何其他数据库的操作相同。\n\n|  |  |\n\
  \n|  |  |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0074_split_000.htm)\
  \ ![下一节](img/#LiB0079_split_000.htm) |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0078_split_000.htm)\
  \ ![下一节](img/#LiB0081_split_000.htm) |\n\n## DBI 的错误处理\n\n本章将涵盖的最后一个主题是错误处理。`DBI->connect`\
  \ 方法可以接收一个额外的属性。此外，你允许向它传递一个引用。\n\n\n\n\n数据库句柄变量通常以 `$dbh` 开头，语句句柄变量通常以 `$sth` 开头。使用这种命名约定可以让查看代码的用户轻松识别各种句柄。\n\
  \n## 程序列表\n\nListing 2-1 包含了本章中完整且连续的代码。\n\nListing 2-1: `connect_multi.pl`\n\n\
  ```\n01: #!/usr/bin/perl -w\n02: #\n03: # connect_multi.pl\n04: # Chapter 2\n05:\
  \ # Listing 2\n06: use strict;\n07: use DBI;\n08: my $dbh_m = \n       DBI->connect(\"\
  dBi:mysql:quizzer:dbserver.perlguy.net\",\n       \"bookuser\", \n       \"password\"\
  ) \n09:     or die(\"Cannot connect: $DBI::errstr\\n\");\n10: my $dbh_p = DBI->connect(\"\
  dbi:Pg:dbname=test\",\n        \"postgres\",\"\") \n11:     or die(\"Cannot connect:\
  \ $DBI::errstr\\n\");\n12: my $sql = qq(select * from test_config);\n13: my $sth_m\
  \ = $dbh_m->prepare($sql);\n14: my $sth_p = $dbh_p->prepare($sql);\n15: $sth_m->execute;\n\
  16: $sth_p->execute;\n17: while(my $p = $sth_m->fetch){\n18:   print \"MySQL: @$p\\\
  n\";\n19: }\n20: print \"\\n\";\n21: while(my $p = $sth_p->fetch){\n22:   print\
  \ \"PostGreSQL: @$p\\n\";\n23: }\n24: $dbh_m->disconnect;\n25: $sth_p->disconnect;\n\
  ```\n\n## 第 3 章：操作数据库表\n\n数据库表代表了某些数据的二维视图。我喜欢将数据库表想象成电子表格页面——你有行和列。列构成了数据库表的定义，而行构成了表中的每条记录。\n\
  \n我们在这个简短的章节中涵盖三个基本的表操作：创建表、修改表和删除表。这些任务都非常简单，但它们值得讨论，因为如果没有表，你就无法操作数据库。\n\n## 什么是表？\n\
  \n正如我之前提到的，数据库表是数据库部分数据的二维视图。\n\n图 3-1 展示了如果将表放入电子表格中它看起来是什么样。列标题将是表的字段名，电子表格中的某行数据将是数据库的一条记录。\n\
  \n![点击展开](img/fg0301_0.jpg) 图 3-1：表示例\n\n对于较小的应用程序，将数据存储在单个表中是非常常见的。然而，当数据库开始变大时，这就会出现一个问题——冗余数据。对于具有多个可能产生冗余数据字段的数据库应用程序来此，更明智的做法是将数据存储在几个不同的表中，每个表存储一组特定的信息。将数据拆分为表以尽可能地减少冗余数据被称为“规范化”——这是我们在书的开头简要介绍的一个主题。\n\
  \n考虑一个包含产品名称、零件号、价格、供应商名称和供应商描述的产品表。即使是这样的小表也可能包含大量的冗余数据！假设该表有 100 个产品，涉及 10 个不同的供应商。如果我们把所有数据放在一个表中，那么在几条记录中会有相同的供应商信息，每个供应商平均出现\
  \ 10 次！这完全不高效。更合理的方法是将数据拆分成几个不同的表，每个表存储一组特定的信息。图 3-2 显示了这些冗余数据。图 3-3 展示了拆分后的情况。\n\
  \n\n\n\n\n## 产品表\n\n下面列出了创建 `products` 表的 SQL 命令。你可以从数据库接口重新创建 `products` 表，也可以编写一个简短的\
  \ Perl 脚本来为你执行这些 SQL。SQL 关键字均采用大写，以便于阅读 SQL 语句。\n\n```\n01: CREATE TABLE products(\n\
  02: Pid   INT NOT NULL,\n03: Item  VARCHAR(50),\n04: Descr VARCHAR(255),\n05: Price\
  \ REAL,\n06: Vid   INT NOT NULL);\n```\n\n这条 SQL 语句创建了一个名为 `products` 的表，其中包含五个项目。\n\
  \n**第 1 行** 创建了名为 `products` 的表，并打开用于数据类型的括号。\n\n**第 2 行** 创建了产品 ID 字段并命名为 `Pid`。它将数据类型设置为\
  \ `INT`（整数）并添加了 `NOT NULL` 子句，如果有人尝试添加记录但留空此字段，数据库服务器将生成错误。\n\n| | 提示 | 将数据类型设置得尽可能具体是一个好主意，因为数据库可以使用这些特定信息来提高存储和访问的效率。\
  \ |\n\n**第 3 行** 创建了项目名称字段并命名为 `Item`。这一行将数据类型设置为 `VARCHAR`，大小为 50。`VARCHAR` 数据类型允许多达\
  \ `x` 数量的记录。\n\n**第 4 行** 创建了一个项目描述字段并命名为 `Descr`。该字段也设置为数据类型 `VARCHAR`，但长度为 255\
  \ 个字符，而不是像之前的 `Item` 字段那样是 50 个。\n\n| | 注意 | 我没有将描述字段缩写为 `Desc`，因为 `DESC` 是 SQL\
  \ 中的保留字，用于按降序排序项目。 |\n\n**第 5 行** 创建了项目价格字段并命名为 `Price`。该字段被设置为 `REAL` 数据类型，因为我们知道价格通常带有小数点，而整数是不允许的。**第\
  \ 6 行**是这条 SQL 语句的最后一行。它创建了一个名为 `Vid` 的字段，代表供应商 ID（Vendor ID）。该字段也是 `INT` 数据类型，并设置为不能为\
  \ `NULL`。\n\n接下来，我们需要一个供应商表，以便将产品与供应商关联起来。\n\n```\n01: CREATE TABLE vendors(\n02:\
  \ Vid     INT NOT NULL,\n03: Name    VARCHAR(100),\n04: Address VARCHAR(100),\n\
  05: City    VARCHAR(50),\n06: State   CHAR(2),\n07: Zip     VARCHAR(10),\n08: Phone\
  \   VARCHAR(25));\n```\n\n**第 1 行** 创建了名为 `vendors` 的表，并打开用于数据类型的括号。\n\n**第 2 行**\
  \ 创建了供应商 ID 字段并命名为 `Vid`。它将数据类型设置为 `INT` 并添加了 `NOT NULL` 子句，如果有人尝试添加记录但留空此字段，数据库服务器将生成错误。我们将使用这个字段来保持产品与供应商之间的关系。\n\
  \n**第 3 行** 创建了名称字段并命名为 `Name`。这一行将数据类型设置为 `VARCHAR`，大小为 100。\n\n**第 4 行** 创建了地址字段并命名为\
  \ `Address`。该字段被设置为数据类型 `VARCHAR`，且长度同样为 100 个字符。\n\n**第 5 行** 创建了城市字段并命名为 `City`。该字段被设置为数据类型\
  \ `VARCHAR`，长度为 50 个字符。\n\n**第 6 行** 创建了州字段并命名为 `State`。该字段被设置为数据类型 `CHAR`，长度为 2\
  \ 个字符。保持这么短是为了仅允许每个州两个字母的缩写。\n\n**第 7 行** 创建了邮政编码字段并命名为 `Zip`。该字段设置为数据类型 `VARCHAR`，长度为\
  \ 10 个字符。\n\n**第 8 行** 创建了电话字段并命名为 `Phone`。该字段设置为数据类型 `VARCHAR`，长度为 25 个字符。\n\n\
  ## 修改表\n\n修改表是对对现有表进行更改的过程。在修改表时请务必小心。数据库`通常`会保存任何现有数据，但如果修改涉及不兼容，数据将会丢失。例如，如果你有一个表并想添加一列，可以使用\
  \ `ALTER TABLE` 命令：\n\n```sql\nALTER TABLE products ADD category VARCHAR(50);\n\
  ```\n\n 程序示例\n\n下面的小型程序示例向现有数据库添加了一个表。我只展示了一个示例，因为我们实际上只是在执行一条不会用到的快速 SQL 语句。\n\n\
  ```\n01: #!/usr/bin/perl -w\n02: # add_table.pl\n03: # Chapter 3\n04: # Listing\
  \ 1\n```\n\n**第 1 行** 告诉系统去哪里寻找 Perl 并通过 `-w` 开启警告。\n\n**第 2-4 行** 是关于此程序的注释。\n\n\
  ```perl\n05: use strict;\n06: use DBI;\n```\n\n**第 5 行** 加载 `strict` 模块。该模块用于帮助程序员。它强制程序员声明变量并可以捕捉难以调试的常见错误。\n\
  \n**第 6 行** 加载 `DBI` 模块，这样我们就可以访问数据库。\n\n```perl\n07: my $dbh = DBI->connect(\"\
  DBI:mysql:widgets\",\n     \"bookuser\",\"testpass\") \n08:     or die(\"Cannot\
  \ connect: $DBI::errstr\");\n```\n\n\n\n\n\n`Line 7` 声明了一个名为 `$dbh` 的标量变量并连接到数据库。使用\
  \ `DBI->connect` 方法来连接数据库；我们传递了数据库驱动和名称（`DBI:mysql:widgets`）、用户名（`bookuser`）和密码（`testpass`）以便连接。如果一切顺利，`connect`\
  \ 方法将返回数据库句柄。该句柄存储在变量 `$dbh` 中。\n\n`Line 8` 是 `line 7` 的延续。如果连接数据库时出现问题，将执行此行。此行会导致程序终止并向用户显示错误消息。\n\
  \n```\n09: my $sql = qq{CREATE TABLE products (\n10:               Pid   INT NOT\
  \ NULL,\n11:               Item  VARCHAR(255),\n12:               Descr VARCHAR(255),\n\
  13:               Price REAL,\n14:               Vid   INT NOT NULL)};\n```\n\n\
  `Lines 9-14` 是向数据库添加表的 SQL 语句。在 `line 9` 上，我们声明了一个名为 `$sql` 的标量变量，并将其赋值为构成 SQL 语句的字符串。注意，对于\
  \ `qq` 函数，我们使用大括号 `{}` 而不是圆括号 `()`，因为我们需要在引号字符串内部包含括号。\n\n这与我们在上面创建 `products` 表时使用的\
  \ SQL 语句相同。这仅仅是一种使用 Perl 而不是数据库命令行来创建表的方法。\n\n```\n15: my $return = $dbh->do($sql);\n\
  ```\n\n`Line 15` 调用了 `$dbh` 句柄上的 `do` 方法，并通过 `$sql` 将 SQL 语句传递给该方法。当你不期望返回数据时，`do`\
  \ 方法可以节省时间，因为它同时取代了 `prepare` 和 `execute` 方法的作用。`do` 方法返回的值被存储在名为 `$return` 的新标量变量中。\n\
  \n```\n16: if($return) {\n17:     print \"Table addition successful!\\n\";\n18:\
  \ }\n19: else {\n20:     print \"\\n\\nERROR! $DBI::errstr\\n\";\n21: }\n```\n\n\
  `Lines 16-21` 检查了发生的情况。`Line 16` 使用 `if` 函数检查 `$return` 是否包含任何内容。如果 SQL 语句执行成功，值将存储在\
  \ `$return` 中。只要有值，具体是什么值其实并不重要。\n\n`Line 17` 在 SQL 表添加成功时打印成功消息。\n\n`Line 18` 结束了\
  \ `if` 块。\n\n`Line 19` 开始 `else` 块。如果 `$return` 中没有值，程序将进入该代码块。如果发生错误，`$return`\
  \ 将包含 `undef`，这不是一个会被求值为真的的值，因此之前的 `if` 块不会执行。\n\n`Line 20` 打印错误消息以及设置在 `$DBI::errstr`\
  \ 变量中的错误文本。\n\n`Line 21` 关闭 `if..else` 块，这也是该程序的最后一行。\n\n## 总结\n\n关于操作表的基础知识就这些了；它们非常简单。我们为此示例创建的\
  \ Perl 程序可以用于你可能需要的任何 SQL 表方法。通过简单更改执行特定任务的 SQL 语句，就可以添加表、删除表和修改表。\n\n## 程序列表\n\n\
  `Listing 3-1` 包含了本章程序示例的完整且连续的代码。\n\nListing 3-1: Table Add\n\n```\n01: #!/usr/bin/perl\
  \ -w\n\n02: # add_table.pl\n03: # Chapter 3\n04: # Listing 1\n05: use strict;\n\
  06: use DBI;\n07: my $dbh = DBI->connect(\"DBI:mysql:widgets\",\"bookuser\",\"testpass\"\
  )\n08: or die($DBI::errstr\\n);\n09: my $sql = qq{CREATE TABLE products (\n10: \
  \              Pid   INT NOT NULL,\n11:               Item  VARCHAR(255),\n12: \
  \              Descr VARCHAR(255),\n13:               Price REAL,\n14:         \
  \      Vid   INT NOT NULL)};\n15: my $return = $dbh->do($sql);\n16: if($return)\
  \ {\n17:     print \"Table addition successful!\\n\";\n18: }\n19: else {\n20:  \
  \   print \"\\n\\nERROR! $DBI::errstr\\n\";\n21: }\n```\n\n\n\n\n让我们来看一个短程序，它可以从数据库中名为\
  \ `library` 的表中获取某些数据。这个 `library` 表填满了个人图书馆中许多计算机书籍的信息。在接下来的部分中，你将看到代码块；然后你将看到对这些行含义的解释。添加数字是为了清晰起见，它们并不是代码的一部分。\n\
  \n| | 注意 | 如果你没有从书籍网站下载 `library` 数据，你将需要向 `library` 表输入一些示例数据，以便这些示例能够运行。 |\n\n\
  ```perl\n01: #!/usr/bin/perl -w\n02: #\n03: # select1.pl\n04: # Chapter 4\n05: #\
  \ Listing 4-1\n06: #\n07: use strict;\n08: use DBI;\n```\n\n**第 1 行**告诉系统去哪里寻找 Perl，并使用\
  \ `-w` 标志开启警告。\n\n**第 2-6 行**是注释，提供了关于程序的信息。\n\n**第 7 行**开启了 `strict` 伪指令。这强制程序员使用更好的编程实践，例如在在使用变量之前声明它们。此外，开启\
  \ `strict` 可以消除一些难以发现的错误——例如使用两个同名的变量。\n\n**第 8 行**加载了 `DBI` 模块——由于我们要与数据库进行交互，因此我们需要加载数据库接口（DataBase\
  \ interface）。\n\n```perl\n09: my $dbh = DBI->connect (\"DBI:mysql:BibleBook\",\"\
  bookuser\",\"testpass\") \n10:     or die(\"Cannot connect: $DBI::errstr\");\n```\n\
  \n**第 9-10 行**构成了一个完整的 Perl 语句，尝试创建一个 `DBI` 类的对象，表示与数据库的连接。如果无法连接，我们对 `DBI->connect`\
  \ 的调用将失败，并使用 `die` 终止程序。`$dbh` 代表数据库句柄（DataBase Handle）。\n\n```perl\n11: my $sql\
  \ = qq(SELECT * FROM library);\n```\n\n**第 11 行**是我们用于从数据库表中获取数据的 SQL 语句。双引号运算符\
  \ `qq` 在你创建可能包含引号的字符串时非常好用。`qq` 操作符的作用就像双引号一样，但你不需要对字符串中可能存在的任何双引号进行转义。\n\n这条 SQL\
  \ 语句告诉 DBMS 从请求的表（`library`）获取（`SELECT`）所有数据（`*`）。\n\n```perl\n12: my $sth = $dbh->prepare($sql);\n\
  ```\n\n**第 12 行**调用了 DBI 的 `prepare` 方法。当你 `prepare` 一个 SQL 语句时，某些数据库会将该 SQL 语句以内部编译的形式存储，以便在调用\
  \ `execute` 方法时，它执行得更快。MySQL 不编译 SQL 语句，只是简单将其存储。然而，如果你从 MySQL 移动到另一个数据库，你不需要进行任何更改即可操作新数据库。\n\
  \n`prepare` 方法返回一个句柄（`$sth`），用于访问该特定 SQL 语句的 `DBI` 方法。`$sth` 代表语句句柄（Statement Handle）。\n\
  \n```perl\n13: $sth->execute;\n14: my $counter = 1;\n```\n\n**第 13 行**对 SQL 语句调用\
  \ `execute` 方法。这在数据库上运行该 SQL 语句——SQL 调用的结果将作为引用存储在语句句柄（`$sth`）中。\n\n**第 14 行**声明并初始化了一个名为\
  \ `$counter` 的变量为 1。我们使用这个变量在显示 SQL 调用结果时对记录进行计数。\n\n```perl\n15: while(my $record\
  \ = $sth->fetch){\n```\n\n**第 15 行**开始了一个 while 循环，它会一次返回一条数据，直到没有数据可以返回为止。它返回的数据来自**第\
  \ 13 行** SQL 调用的结果。\n\n在 while 声明内部，我们声明了一个名为 `$record` 的变量。我们使用这个变量作为指针。每次通过 while\
  \ 循环，`$sth->fetch` 都会从 SQL 用的结果中获取一条记录，并将数组的引用存储在 `$record` 中。\n\n这可能有点难以理解，但一旦我们过完接下来的几行代码，就应该明白了。现在，只需记住\
  \ `$record` 持有一个数组的引用即可。这就像在普通 Perl 代码中存储数组引用时说 `$record = \\@foo;` 一样。\n\n```perl\n\
  16:     print \"$counter: \";\n```\n\n**第 16 行**为我们的输出打印一些文本，并显示 `$counter` 中的当前值。\n\
  \n```perl\n17:     for my $field (@$record){\n18:         print \"$field - \";\n\
  19:     }\n```\n\n**第 17 行**开始一个 for 循环，遍历 `@$record` 数组中的每个项目。当然，与其写 `@$record`，我们也可以写成\
  \ `@{$record}`，它的含义完全相同。如果你不熟悉这两种语法中的任何一种，请参考 Perl 自带的 `perlreftut` 手册页。\n\n**第\
  \ 18 行**打印循环中的当前字段值（`$field`），并在后面打印一个带空格的破折号。\n\n**第 19 行**结束 for 循环。\n\n```perl\n\
  20:     $counter++;\n21:     print \"\\n\";\n22: }\n```\n\n**第 20 行**将 `$counter`\
  \ 变量加 1。\n\n**第 21 行**打印换行符，以便输出可以在视觉上隔离开。\n\n**第 22 行**同样结束了 while 循环。\n\n此程序建立了数据库连接，创建一个获取所有数据的\
  \ SQL 语句，然后在屏幕上显示结果。部分内容如下代码所示\n\n### 带有 WHERE 的 SELECT 语句\n\n现在我们知道如何获取数据库中的所有记录。但如果你只需要某些记录，或者一条，你不想自己去筛选所有数据。相反，让数据库为你工作吧！我们可以稍稍修改第一个程序，使其查找特定的记录。\n\
  \n```perl\n01: #!/usr/bin/perl -w\n02: #\n03: # select2.pl\n04: # Chapter 4\n05:\
  \ # Listing 4-2\n06: #\n07: use strict;\n08: use DBI;\n09: my $dbh = DBI->connect\n\
  (\"DBI:mysql:BibleBook\",\"bookuser\",\"testpass\")\n10:     or die(\"Cannot connect:\
