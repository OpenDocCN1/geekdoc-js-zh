  \ 12` 定义的变量 `$dbh` 中。如果连接失败，`line 13` 将显示一条错误消息告知我们。\n\n```\n14: my %item = ();\n\
  15: print header;\n```\n\n`Line 14` 声明了一个名为 `%item` 的哈希变量，并将其初始化为空集。\n\n`Line 15`\
  \ 打印调用 `header` 函数的结果。`header` 函数是 `CGI` 模块的一部分，用于打印有效的 HTTP 头部。\n\n```\n16: $item{item_list}\
  \    = Drop_Down_Item_List($dbh, $a_id, \n        \"name\");\n17: $item{auction_name}\
  \ = Page_Header($dbh, $tmpl, $a_id);\n```\n\n`Line 16` 调用了 `Drop_Down_Item_List()`\
  \ 函数，并将结果存储在 `%item` 哈希的 `item_list` 键下。该函数属于 `SmallAuction` 模块，用于获取所有拍卖物品并以格式返回它们，以便在\
  \ HTML `select` 列表中显示。传递的参数是数据库句柄（`$dbh`）、拍卖 ID（`$a_id`）以及我们要排序数据的字段（`name`）。\n\n\
  `Line 17` 调用了 `Page_Header()` 函数用于显示页面开头的 HTML。该函数也是 `SmallAuction` 模块的一部分，并传递了数据库句柄（`$dbh`）、模板目录（`$tmpl`）和拍卖\
  \ ID（`$a_id`）。\n\n```\n18: Print_Page($tmpl, \"index.tmpl\", \\%item);\n19: $dbh->disconnect;\n\
  ```\n\n`Line 18` 调用了 `Print_Page()` 子程序。该子程序是 `SmallAuction` 模块的一部分。该函数用于打印由模板生成的\
  \ HTML 页面。该函数接收模板目录（`$tmpl`）、模板名称（`index.tmpl`）以及 `%item` 哈希的引用。`%item` 哈希存储了来自数据库的所有数据，以便在\
  \ `Print_Page()` 函数生成页面时可以将它们动态地添加到 HTML 页面中。\n\n`Line 19` 调用 `disconnect()` 函数将程序与数据库断开连接。\n\
  \n`index.cgi` 程序就这些了。大部分工作由 `SmallAuction` 模块中的函数处理，因此该程序非常短。\n\n我们将看到的下一个程序是 `view_all.cgi`。该程序以表格格式显示数据，并允许一次显示固定数量的匹配项，如图\
  \ 7-2 所示。\n\n![Click To expand](img/fg0702_0.jpg)\n\n图 7-2：view_all.cgi 页面\n\n注意，我们再次有一个物品下拉列表。这让用户可以选择点击表格中的某项，也可以从下拉列表中选择某项。\n\
  \n这个程序虽然使用了模板，但由于涉及的内容更多，它比 `index.cgi` 程序长得多。该程序的脚本展示了如何使用 `bind_columns()` 让你的代码更容易读。使用\
  \ `bind_columns()` 可以让你的代码更容易读。\n\n\n\n\n`Line 17` 调用了 `Get_Item_Table` 函数。该函数接收了数据库句柄\
  \ (`$dbh`)、用于对结果排序的字段 (`\"name\"`)、起始编号 (`$begin_at`) 以及要显示的项目数量 (`$num_to_display`)。通过指定起始编号和要显示的项目数量，我们可以非常方便地列出类似于每页五个或十个项目的项目列表。\n\
  \n`Get_Item_Table` 函数返回两个 `handles`（`$sth_item` 和 `$sth_bids`）。这些句柄包含了数据位置的引用，就像我们为数据库查询创建一个语句句柄一样。这样做让我们能够很容易地获取返回的数据。\n\
  \n```\n18: my ($name, $item_id, $descr, $min_bid, $min_incr);\n19: $sth_item->bind_columns\n\
  \    (\\($name, $item_id, $descr, $min_bid, $min_incr));\n```\n\n`Line 18` 简单地声明了我们稍后将使用的几个标量变量。\n\
  \n`Line 19` 是我们之前还没见过的一行。注意我们使用了一个名为 `bind_columns` 的新 DBI 函数。该函数绑定了列出的变量；每当我们调用\
  \ `fetch()` 时，变量会自动填充当前记录的信息。使用这个函数非常好，因为你再也不需要担心在每次获取数据时都设置变量了。\n\n```\n20: print\
  \ header;\n21: my $auction_name = Page_Header($dbh, $tmpl, $a_id);\n22: Print_Page($tmpl,\
  \ \"view_all.tmpl\", \\%item);\n```\n\n`Line 20` 打印 header 函数的结果。header 函数是 CGI\
  \ 模块的一部分。它返回构成有效 HTTP 标头的文本。\n\n`Line 21` 调用 `Page_Header` 函数，并将数据库句柄 (`$dbh`)、模板目录\
  \ (`$tmpl`) 和拍卖 ID (`$a_id`) 传递给它。该函数返回一个包含拍卖名称的字符串。\n\n`Line 22` 调用 `Print_Page`\
  \ 函数。该函数接收模板目录 (`$tmpl`)、我们想要使用的模板名称 (`\"view_all.tmpl\"`) 以及对 `%item` 哈希的引用。记住`%item`\
  \ 哈希包含了当前记录所需的所有数据。\n\n```\n23: my %hi_bid;\n24: while(my($amount, $item, $fname,\
  \ $lname) = \n      $sth_bids->fetchrow_array){\n25:     $hi_bid{$item}->{name}\
  \   = \"$fname $lname\";\n26:     $hi_bid{$item}->{amount} = \"$amount\";\n27: }\n\
  ```\n\n`Line 23` 声明了一个名为 `%hi_bid` 的新哈希。\n\n`Line 24` 开始于一个 while 循环，该循环调用 `fetchrow_array`\
  \ 并将其返回的值设置为若干项。我们在这里调用 `fetchrow_array` 函数来获取当前记录。\n\n`Line 25` 将哈希扩展到另一个级别。在这一级，出价者的名和姓被添加到新键\
  \ `$hi_bid{$item}->{name}` 中。\n\n`Line 26` 执行了与上一行代码相同的基本操作，只是我们调用的是金额。\n\n`Line\
  \ 27` 结束了从 `line 24` 开始的 while 循环。\n\n```\n28: my $color = \"e0e0e0\";\n29: my $count\
  \ = 0;\n```\n\n`Line 28` 声明了一个名为 `$color` 的新标量变量，并设置为字符串 `\"e0e0e0\"`。我们将使用这个值作为在输出结果的表格上交替颜色的方法。\n\
  \n`Line 29` 声明了一个名为 `$count` 的新标量变量，并将其初始化为 0。\n\n```\n30: while($sth_item->fetch){\n\
  31:     my $hi_bid;\n32:     $count++;\n33:     $color = ($color eq \"e0e0e0\")\
  \ ? \"ffffff\" : \"e0e0e0\";\n```\n\n`Line 30` 开始一个 while 循环，不断获取数据直到没有更多数据可供获取。\n\
  \n`Line 31` 声明了一个名为 `$hi_bid` 的新标量变量。\n\n`Line 32` 变量 `$count` 加增。该变量用于在遍历数据时维护我们的位置。\n\
  \n`Line 33` 检查颜色是否等于 `e0e0e0`。如果是，则调用问号后的第一个项——将颜色设置为 `ffffff`。如果不是（当前颜色为 `ffffff`），我们将颜色设置为问号后的第二个值。这样做是为了让行颜色交替出现，以便于阅读。\n\
  \n`line 33` 上的 `(foo) ? bar : blech` 操作被称为三元运算符（trinary or ternary operator）。它有两个名字。使用喜欢的任何一个即可。它检查\
  \ `?` 左侧的项以判断其是否为真。如果为真，执行 `?` 后的第一个项。如果为假，则执行第二个项。\n\n```\n34:     if(length($descr)\
  \ > 40){\n35:         $descr  = substr($descr, 0, 37);\n36:         $descr .= \"\
  ...\";\n37:     }\n```\n\n`Line 34` 检查 `$descr` 变量中值的长度是否大于 40。如果是，我们希望截断数据，以免出现巨大的项目描述，导致我们的表格看起来非常糟糕。\n\
  \n`Line 35` 使用 `substr` 函数提取字符 0-37，并将它们存储在 `$descr` 变量中。我们只需要 37 个字符，因为当我们向字符串末尾追加省略号时，它将达到我们\
  \ 40 个字符的最大值。\n\n`Line 36` 在字符串末尾追加省略号（`...`），以便页面的观众可以看到描述中还有更多数据可以阅读。\n\n`Line\
  \ 37` 关闭了从 `line 34` 开始的 `if` 块。\n\n`Line 38` 设置 `$name` 变量为指向 `/cgi-bin/view_all.tmpl?item=$id`\
  \ 的链接。\n\n`Line 39` 完成了 `line 38` 的内容。\n\n```\n40:     $min_bid  = sprintf(\"%2f\"\
  , $min_bid);\n41:     $min_incr = sprintf(\"%2f\", $min_incr);\n42: });\n```\n\n\
  `Lines 40-42` 使用 `sprintf` 对从数据库获取的 `$min_bid` 和 `$min_incr` 进行格式化，使其保留两位。`\"%2f\"\
  ` 意味着这是一个浮点数。\n\n\n\n\n\n```\n72: $prev_link = qq(<b><a href=\"?begin_at=$prev\"\
  \n73:         >&lt; View Prev $num_to_display items</a></b>) unless($prev < 0);\n\
  ```\n\n**第 72-73 行** 将 `$prev_link` 设置为一个字符串，`line 71` 也是如此。然而，这次我们实际上是将 `$prev_link`\
  \ 设置为一个 HTML 链接。我们之所以进入这一部分是因为有页面需要显示——所以我们将其设置为链接。结尾的 `unless($prev < 0)` 告诉 Perl\
  \ 只有当 `$previous` 不小于 0 时才执行此字符串赋值。\n\n```\n74: if($count == $num_to_display) {\n\
  75:     $next = ($begin_at + $num_to_display);\n76:     $next_link = qq(<b><a href=\"\
  ?begin_at=$next\"\n77:         >View Next $num_to_display items &gt;</a></b>);\n\
  78: }\n```\n\n**第 74 行** 开始了另一个 if..else 块。此块检查 `$count` 的值是否等于 `$num_to_display`\
  \ 的值。如果是，我们就进入该块的第一部分。\n\n**第 75 行** 将 `$next` 设置为 `$begin_at` 加上 `$num_to_display`\
  \ 的值。这与我们在 `line 70` 中的做法类似。\n\n**第 76 行** 创建了一个 HTML 字符串并将 `$next_link` 变量设置为它。这用于为用户提供链接，以便在有更多数据时能够移动到数据的下一页。\n\
  \n**第 77 行** 继续完成 `line 76` 开始的内容。\n\n**第 78 行** 关闭了 if..else 块的这部分内容。\n\n```\n\
  79: else {\n80:    $next_link = qq(View Next $num_to_display items &gt;);\n81: }\n\
