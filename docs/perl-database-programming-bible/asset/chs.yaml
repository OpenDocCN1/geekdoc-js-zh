  # 附录 A：配置你的系统\n\n## 概述\n\n为了使用书中的示例，准备一个配置了 Web 服务器和数据库服务器的系统非常有帮助，这样你可以在阅读时在上面测试代码。本书旨在尽可能跨平台，以便触及尽可能广泛读者。本附录涵盖了如何为\
  \ Linux 和 Windows 系统配置 Perl、Apache Web 服务器和 MySQL 数据库。使用 Apache 和 MySQL 的原因是它们都是免费的、易于获取并且在各自领域非常出色。\n\
  \n本附录仅涵盖基础安装和配置。如果你需要进行一些自定义，或者你有特殊的配置，你可能需要翻阅手册来研究如何按照你想要的方式进行配置。\n\n自我开始使用这些工具以来，Windows\
  \ 系统的安装已经进步巨大。在大多数情况下，安装过程就像安装任何其他 Windows 程序一样简单。\n\n| | 注意事项 | 在准备本附录期间，我了解到适用于\
  \ Windows32 系统的 Apache *可能* 无法运行在 Windows 98 或 Windows 95 上。文档说它“可能”运行，我的一个编辑也说在他那里可以运行，但根据我的经验并行的。我在\
  \ Windows 2000 系统上安装过 Apache。（非常感谢 `#perl` IRC 频道的 `kane` 帮助我获取本节所需的工具。） |\n\nPerl、Apache\
  \ 和 MySQL 通过 NNTP 新闻群组和邮件列表获得良好的支持。开源软件的社区支持通常比我遇到过的任何商业产品支持都更快、更有帮助。\n\n| | |\n\
  | | |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0778_split_000.htm) ![下一节](img/#LiB0821_split_000.htm)\
  \ |\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0819_split_000.htm) ![下一节](img/#LiB0834_split_000.htm)\
  \ |\n\n## 在 Windows 上安装 Perl\n\n在 Windows 上安装 Perl 相当于在运行 Windows 的电脑上安装任何其他程序。\n\
  \n1. 下载 Perl 软件。ActiveState 在 [`www.activestate.com`](http://www.activestate.com)\
  \ 免费提供 Perl。\n\n2. 下载好 Perl 后，双击文件开始安装。如果你下载的是 Microsoft Installer 程序包，可能需要右键点击文件并从弹出菜单中选择“安装”。\n\
  \n   图 A-1 显示了开始安装时出现的第一个。\n\n   ![点击展开](img/fgaa01_0.jpg) 图 A-1：ActivePerl 安装界面\n\
  \n3. 点击“下一步”（Next）按钮继续安装。\n\n   图 A-2 显示许可协议。你必须接受许可条款才能继续安装。\n\n   ![点击展开](img/fgaa02_0.jpg)\
  \ 图 A-2：ActivePerl 许可协议界面\n\n4. 点击“下一步”按钮继续安装。\n\n   图 A-3 显示自定义设置界面。通常，你应该保持这些设置不变；默认安装对于大多数情况都是完美的。\n\
  \n   ![点击展开](img/fgaa03_0.jpg) 图 A-3：ActivePerl 自定义设置界面\n\n5. 点击“下一步”按钮继续安装。\n\n\
  \   图 A-4 显示新 PPM（Perl 包管理器）特性界面。PPM 用于将预编译模块安装到 Windows 系统。如果你想让 ActiveState 看到你系统的\
  \ Perl 配置，请勾选该框。\n\n   ![点击展开](img/fgaa04_0.jpg) 图 A-4：新 PPM 特性界面\n\n6. 点击“下一步”按钮继续安装。\n\
  \n   图 A-5 显示选择设置选项界面。通常，这些设置也应该保持不变。ActivePerl 安装程序会检查你的系统并尝试选择最适合所安装系统的设置。\n\n\
  \   ![点击展开](img/fgaa05_0.jpg) 图 A-5：ActivePerl 选择设置选项界面\n\n7. 点击“下一步”按钮继续安装。\n\n\
  \   图 A-6 显示准备好安装界面。这是你在安装开始前看到的最后一个界面。\n\n   ![点击展开](img/fgaa06_0.jpg) 图 A-6：ActivePerl\
  \ 准备绪界面\n\n8. 点击“安装”（Install）按钮开始文件安装。\n\n   图 A-7 显示最后的设置界面。此界面提供了一些促销信息以及指向 ActiveState\
  \ Perl 网站的 HTML 链接。\n\n   ![点击展开](img/fgaa07_0.jpg) 图 A-7：ActivePerl 设置界面\n\n9.\
  \ 点击“完成”（Finish）按钮完成安装。\n\nActivePerl 的 Windows 安装此此。如果你在安装过程中遇到任何问题，请查看 ActiveState\
  \ 网站出色的支持和故障排除信息。\n\n| | |\n| | |\n\n| ![Team LiB](img/#_back.htm) | ![上一节](img/#LiB0778_split_000.htm)\
  \ ![下一节](img/#LiB0821_split_000.htm) |\n\n## 在 Linux 上安装 Perl\n\n在 Linux 上安装 Perl\
  \ 比在 Windows 上要多做一些。第一步是获取 Perl。\n\n1. 访问 [`www.perl.com`](http://www.perl.com)\
  \ 并点击“下载”链接。\n\n2. 点击“源码发行”列表下的“稳定发布版”（Stable Production Release）链接 | 提示：通过源码编译\
  \ Perl，你将获得最适合你系统的 Perl。\n\n3. 下载 `stable.tar.gz` 并将其放置在你想要解压的地方。例如：\n\n```bash\n\
  mkdir temp\nmv stable.tar.gz temp\ncd temp\n```\n\n4. 然后解压包：\n\n```bash\ntar -xzvf\
  \ stable.tar.gz\n```\n这将创建一个以当前 Perl 版本命名的子目录。\n\n5. 进入该目录：\n\n```bash\ncd perl-5.x.x\n\
  ```\n\n6. 运行配置脚本。`-d` 选项将为所有选项选择默认值；这是安装 Perl 最简单的方法。\n\n```bash\nsh Configure -d\n\
  ```\n脚本配置完成后，会出现提示“按回车或使用 shell 转义编辑 config.sh。”按下回车键。完成后，你必须编译 Perl。等待-这部分需要几分钟。\n\
  \n编译完成后，运行测试套件以确保一切正常。如果任何测试失败，你必须读取错误信息并在解决问题后继续。目标是让其显示“所有测试通过”的消息。\n\n```bash\n\
  make\ntest\n```\n\n测试完成后，你必须安装 Perl（此部分必须以 root 身份执行）。\n\n```bash\nmake install\n\
  ```\n留意执行时可能出现的任何问题；默认选项通常是安全的。\n\n一旦完成，你可以输入 `perl -v` 来验证 Perl 是否已安装以及版本号是否符合预期。\n\
  \n\n\n\n以上是在 Windows 系统和 Linux 系统上安装 Perl 的全部内容。其他 Unix 系统的用户应该遵循 Linux 的说明，因为这些说明与他们需要的操作完全相同。\n\
  \n## 在 Windows 上安装 Apache\n\n在 Windows 上安装 Apache 与安装任何其他程序一样简单。正如本附录前面提到的，Apache\
  \ Web 服务器不运行在 Windows 9*x* 系统上。虽然*有*在 Windows 95 上安装 Apache 的说明，但根据我的经验，它无法运行。不过，尝试一下也没有坏处——我收到过其他人的报告，他们完全没有问题。\n\
  \n1. 要下载适用于 Windows 的最新版本 Apache，请访问 http://www.apache.org`](http://www.apache.org)。\n\
  \n2. 在此页面上，点击页面“Download!”区域下方的“from here”链接。这将带你进入一个目录列表。你需要点击 `binaries` 文件夹，然后点击\
  \ `win32` 文件夹获取 Windows 软件。\n\n3. 下载最新的 `stable`（稳定）版本。至少有两个选择：一个是 Microsoft 安装程序，另一个是普通的\
  \ `.exe` 文件。两者都可以用。\n\n4. 文件下载完成后，如果是 `.exe` 文件，双击它进行执行；如果是 Microsoft Installer\
  \ 文件，则右键点击它并在弹出菜单中选择 `Install`。\n\n   [图 A-8]显示了安装 Apache Web 服务器的第一个屏幕。此屏幕仅提供信息。\n\
  \n   ![Click To expand](img/fgaa08_0.jpg) 图 A-8：Apache 安装向导\n\n5. 点击 Next 按钮继续安装。\n\
  \n   [图 A-9]显示了 Apache Web 服务器的许可协议。你必须接受条款才能继续安装。\n\n   ![Click To expand](img/fgaa09_0.jpg)\
  \ 图 A-9：Apache 许可协议\n\n6. 点击 Next 按钮继续安装。\n\n   [图 A-10]显示了“Read This First”（先读此内容）屏幕，它向你展示了正在安装的\
  \ Apache Web 服务器的最新信息。\n\n   ![Click To expand](img/fgaa10_0.jpg) 图 A-10：Apache\
  \ 安装“先读此”\n\n7. 点击 Next 按钮继续安装。\n\n   [图 A-11]显示了 Server Information（服务器信息）屏幕。此屏幕收集你的系统信息，以便正确配置\
  \ Web 服务器。\n\n   ![Click To expand](img/fgaa11_0.jpg) 图 A-11：Apache 服务器信息屏幕\n\n\
  8. 输入与你安装 Apache 的服务器相关的信息，并点击 Next 按钮继续安装。\n\n   [图 A-12]显示了 Setup Type（安装类型）屏幕。在这里使用默认值即可，所以将选项保持在“Complete”（完成版）。\n\
  \n   ![Click To expand](img/fgaa12_0.jpg) 图 A-12：Apache 安装类型屏幕\n\n9. 点击 Next 按钮继续安装。\n\
  \n   [图 A-13]显示了 Installation Destination Folder（安装目标文件夹）屏幕，显示了 Apache 软件将安装的位置，并提供更改此位置的选项。\n\
  \n   ![Click To expand](img/fgaa13_0.jpg) 图 A-13：Apache 安装目标文件夹屏幕\n\n10. 点击 Next\
  \ 按钮继续安装。\n\n    安装程序会将软件复制到目标文件夹并启动 Apache Web 服务器服务。如果一切顺利，你将看到一个屏幕，提示安装向导已完成。\n\
  \n接下来，我们必须编辑其中一个配置文件，以便 Web 服务器知道如何处理 Perl CGI 程序。\n\n如果你是默认安装的 Apache，配置文件将安装在\
  \ `C:\\Program Files\\Apache Group\\Apache\\conf` 中。\n\n我们要编辑的是 `httpd.conf`。\n\n\
  确保以下行\n```\nScriptAlias /cgi-bin/ \"C:/Program Files/Apache Group/Apache/\"\n```\n\
  没有被注释掉。该行允许指定目录下的文件被执行。\n\n此外，查找并根据需要添加如下行：\n\n```\nAddHandler cgi-script .cgi\n\
  ```\n\n这将导致 .cgi 结尾的文件被处理。\n\n## 在 Linux 系统上安装 Apache\n\n在 Linux（以及 Unix）上安装 Apache\
  \ Web 服务器与安装 Perl 类似，但情况可能会复杂一些，而且你没有图形界面。\n\n第一步是获取软件。\n\n1. 要获取最新版本的 Apache，前往[`www.apache.org``](http://www.apache.org)\
  \ 并点击“Download!”区域下的“from here”链接。这将带你进入目录列表；点击 `httpd` 文件夹获取下载列表。在此子目录中，找到你需要的版本。当前的稳定版本是\
  \ 1.23——我将选择 `apache_1.23.tar.gz` 作为下载的文件。\n\n2. 将文件移动到可以解压的地方，如下所示：\n\n```\nmkdir\
  \ temp\nmv apache_1.23.tar.gz temp\ncd temp\ntar -xzvf apache_1.23.tar.gz\n```\n\
  \n以下命令将创建一个名为 `apache_1.23` 的目录：\n\n```\ncd apache_1.23\n```\n\n3. 要配置 Apache，输入\
  \ `./configure` 命令并跟上你想安装的路径。例如：\n\n```\n./configure --prefix=/usr/local/apache\n\
  ```\n\n完成后，你需要编译源码。\n\n1. 构建发行版。\n\n```\nmake\n```\n\n2. 然后，以 root 身份安装 Apache Web\
  \ 服务器：\n\n```\nmake install\n```\n\n现在你已经安装了 Apache Web 服务器，但还需要进行一些操作才能使其正常工作。\n\
  \n接下来，你必须确保你的配置文件 `httpd.conf` 包含正确的指令，以便运行 CGI 程序。\n\n1. 检查该文件；如果是按照前面的前缀安装的，它将位于\
  \ `/usr/local/apache/conf/httpd.conf`。\n\n查找：\n\n```\nScriptAlias /cgi-bin/ /usr/local/apache/cgi-bin/\n\
  ```\n\n并查找：\n\n```\nAddHandler cgi-script .cgi\n```\n\n如果你想在 ScriptAlias 目录之外运行\
  \ CGI 程序，这将是可选的。\n\n2. 最后，你需要检查 `<Directory>` 指令。查找：\n\n```\n<Directory /usr/local/apache/cgi-bin>\n\
  \    AllowOverride None\n    Options None\n    Order allow,deny\n    Allow from\
  \ all\n</Directory>\n```\n\n确保你修改了目录以匹配你安装 Apache 的位置。\n\n\n\n\n\n### 3. 要启动 Web\
  \ 服务器，进入 `/usr/local/apache/bin` 子目录并输入：\n\n```\n./apachectl start\n```\n\n你现在应该已经启动并运行了！\n\
