  \ 是构建数据的经典指南。\n\n\n\n\nPerl 运行在许多平台上。事实上，Perl 运行的平台比 Java 还要，而 Java 理论上应该是平台无关的。\n\
  \n## 谁应该读这本书\n\n这本书同时适合初学者和专家。初级 Perl 程序员可以从书中中学到很多知识。书中的每一行代码都经过了仔细解释，以便读者能够确切地看到程序的每个部分是如何工作的。然而，本书并不是\
  \ Perl 编程的全面指南。在充分利用这本书之前，你至少需要对 Perl 有基本的了解。对于专家来说，这本书是学习 Perl 数据库编程的宝贵资源，因为有许多示例可以学习。\n\
  \n我写这本书的目标是创建一个 Perl 指南，能够帮助任何需要学习如何使用 Perl 操作数据库的程序员。在某些情况下，你可能有一个关乎你工作的重要数据库项目。这本书应该能让你有一个良好的开始，并为你构建知识体系提供提供坚实的基础。\n\
  \n## 本书的结构\n\n以下是本书涵盖主题的概要介绍。\n\n# 第一部分：Perl 与数据库基础\n\n在这一节中，你将学习使用 Perl 处理数据库的基本知识。完成本节后，你应该对使用哪些模块以及如何使用\
  \ Perl 操作数据库有一个良好的基础理解。\n\n# 第二部分：高级数据库编程\n\n这部分将带你更进一步。我们将介绍 Web 端的数据库编程、更高级的数据访问方法，以及让你的程序更强大的技巧和技术。\n\
  \n### 第三部分：Perl 与 Web 服务\n\n这部分向你介绍一些基本的 Web 服务技术。你将创建一个 SOAP 客户端和一个 SOAP 服务器，可以使用任何编程语言通过任何\
  \ SOAP 客户端访问。\n\n### 第四部分：Perl 与通用 Web 编程\n\n这部分旨在巩固你的知识。在其中，我们涵盖了更高级、真实的数据库应用，以便你磨练新学的技能。\n\
  \n## 本书中使用的数据库\n\n我们提供了多个数据库的示例。涵盖了 MySQL、PostgreSQL、Oracle 和 CSV 数据库。我们重点的数据库是\
  \ MySQL。为什么呢？原因有很多：MySQL 非常容易安装和运行。它被广泛使用，速度快，并且支持许多平台。\n\n## 简化数据库概念\n\n以下是书中用到的一些术语和概念。\n\
  \n### 数据库\n\n数据库本质就是数据的集合。当我们在 `MySQL` 中创建一个数据库时，是在创建一个与相似主题相关的数据集合。我们不能直接向数据库添加数据；相反，我们必须通过表来操作。\n\
  \n### 表\n\n表是存储数据的地方。一个数据库可以有很多表，而表之间可能是相互依赖的。\n\n### 记录\n\n记录是表中的一项。如果你有一个名为 `books`\
  \ 的数据库和一个名为 `library` 的表，那么记录就是构成单本书籍条目的数据行。\n\n### 字段\n\n字段是记录中的一个项目。如果你有一个名为 `library`\
  \ 的表，那么字段就是该记录中的一个具体条目，例如“书名”。\n\n### 主键\n\n主键是表中唯一的字段，且不能为 `NULL`。主键用于确保数据库中记录的唯一性。\n\
  \n### 归一化\n\n数据库规范化是组织数据库中数据的过程，旨在减少冗余并提高数据完整性。\n\n### 关系数据库\n\n关系数据库是将数据组织成表的数据库。这些表通过公共键（common\
  \ keys）关联。\n\n### 数据库接口\n\n数据库接口提供了软件程序与数据库交互的方法。在 Perl 中，`DBI` 模块是访问数据库的标准接口。针对不同的数据库有许多驱动程序，例如\
  \ `DBD::mysql`、`DBD::Pg`、`DBD::Oracle` 和 `DBD::CSV`。\n\n## 本书中使用的规范\n\n本书的格式和编写方式可能与其他任何书都不同。在整本书中，你会发现许多不同的程序示例，示例之间的文字较少。相反，程序的每一行都经过了详细描述，以便你能够完全理解为什么会有这些代码以及它是如何运行的。\n\
  \n如果你发现逐行描述让你很难全面掌握程序在做什么，我们在每一章的末尾提供了完整的、不间断的代码列表。在整本书中，代码无论是出现在正文中还是在较长的代码列表中，都以等宽字体显示。\n\
  \n## 辅助网站\n\n本书的辅助网站包含了所有的程序列表、数据库表定义以及印刷版的任何错误说明。你可以在 `www.wiley.com/compbooks/Michalski`\
  \ 找到该网站。\n\n\n\n\n# 第一部分：Perl 与数据库基础\n\n## 本部分内容\n\n第 1 章： 数据库基础\n第 2 章： 操作数据库\n\
  第 3 章： 操作数据库表\n第 4 章： 从数据库中获取数据（基础）\n第 5 章： 修改你的数据\n\n## 第 1 章：数据库基础\n\n在本章中，你将获得关于数据库的概述：包括概念和术语、它们的用途以及你可以用它们做什么。此外，你还将学习数据库设计，这涉及如何结构化你的数据以便以便于使用。\n\
  \n如果你之前使用过数据库，可以跳到下一章，了解如何开始使用 Perl 操作数据库。\n\n## 数据库的好处\n\n在数据库开发之前，程序共享数据文件时，任何一个程序对数据结构要求的更改意味着所有程序都必须进行更改。数据库管理系统（DBMS）提供了若干服务，缓解了一些常见的数据库头疼问题：\n\
  \n* 它们安全且可靠地存储数据，使得只有允许查看和修改数据的人和程序才能这样做。DBMS 应该能够防止崩溃而不丢失数据。\n* 它们可以轻松地从数据中提取有用信息。\n\
  * 它们管理数据的共享访问：在更新数据时，DBMS 会锁定数据，以防止多个程序同时更新导致数据损坏。\n* 它们强制执行值和数据结构的致性：例如，没有任何发票记录会缺少地址记录；地址中的状态必须有效。\n\
  * 最重要的是，DBMS 将程序（以及程序员！）与数据存储的细节隔离开来。数据结构的更改不需要自动要求更改所有程序。\n\n## 关系型数据库\n\n有多种类型的数据库。现在最常见的是关系型数据库。“`relational`”（关系）源自数学。“`Relations`”（关系）就是我们说的表。\n\
  \n### 关系型数据库中的表\n\n在关系型数据库中，表是数据的集合，布局像电子表格。每个表都有一个名称，该名称在数据库中必须是唯一的。表中的每一列存储相同类型的数据：姓名、出生日期、ISBN\
  \ 和电话号码。每列都有一个名称，该名称在表中必须是唯一的。表中的每一行包含关于某件事的信息（一个人、一本书、一张 CD，取决于该表被用来存储什么信息）。\n\n\
  图 1-1 显示了一个简单的地址表，包含 name、`phone_type`、`phone_number` 和 `address` 列。\n\n![Click\
  \ To expand](img/fg0101_0.jpg) 图 1-1：姓名、地址和电话号码表\n\n不同的 DBMS 对表名和列名有不同的规则。有些对大小写敏感。有些允许名称中包含空格；有些则不允许。良好的策略是假设最坏的情况：使用下划线分隔单词。所有名称统一使用大写或小写字母。确保表名在数据库中唯一，列名在表中唯一。\n\
  \n有些人喜欢通过添加缩写的表名前缀来使列名在数据库中唯一：例如 `pers_name`、`pers_address` 等。我倾向于不使用前缀，但这意味着使用多个表的查询可能会出现产生歧义的列名。\n\
  \n在任何可以使用列名的地方，你都可以加上完整的表名作为缀：`person.name`、`person.address`。\n\n### 表中的值\n\n表中的每条信息（电子表格中的每个单元格）都是原子的，用\
  \ Perl 的话说就是标量值（scalar value）。数据类型的细节在不同 DBMS 之间略有不同，但包括字符串、数字（整数、浮点和货币分为不同类型）。常见类型包括：\n\
  \n* `INTEGER`：整数。\n* `FLOAT`:浮点数。\n* `DECIMAL`：货币。\n* `CHAR`:固定长度字符串。\n* `VARCHAR`：变长度字符串。\n\
  * `BLOB`:用于文档、图像和视频的二进制大对象。\n* `DATE`, `TIME`, `DATETIME`：日期和时间。\n* `TIMESTAMP`:时区。\n\
  \n### NULL 值\n\n列还可以存储另一个值：`NULL`。`NULL` 与所有合法值都不同。它允许你区分从未设置过的值。\n\n## 数据库操作\n\n\
  书中的剩余章节将展示你可以用数据库做什么。操作主要分为两类。第 3 章中，指定的行是名为 \"Andy\" 的行。\n\n![Click To expand](img/fg0102_0.jpg)\
  \ 图 1-2：RESTRICT 返回行的子集。\n\n\n\n\n\n以下是图 1-2 的 SQL 代码：\n\n```\nSELECT * FROM person\
  \ WHERE name = ‘Andy'\n```\n\n### PROJECT 列\n\n`PROJECT` 操作指定了你想要的 `columns`（列）。从图\
  \ 1-2 返回的行中，选取了 `phone_type` 和 `phone_number` 列，如图图 1-3 所示。\n\n![点击展开](img/fg0103_0.jpg)\n\
  \n图 1-3：PROJECT 返回列列的子集。\n\n你可以将 `RESTRICT` 和 `PROJECT` 的结果视为另一个表——行和列都更少——你可以在程序中对其进行打印或处理，一次处理一行或一次性处理所有。\n\
  \n以下是图 1-3 的 SQL 代码：\n\n```\nSELECT phone_type, phone_number FROM person WHERE name\
  \ = ‘Andy'\n```\n\n### JOIN 表\n\n只有一个表的数据库其实不怎么好玩。大多数数据库都有多个表，我们经常想要从多个表中获取相关数据。`JOIN`\
  \ 操作通过在具有相同取值的列上连接这些表，来创建一个新的虚拟表。\n\n图 1-4 的顶部显示了一个更真实的表结构，其中地址和电话号码被拆分到了不同的表中。我们可以通过合并两个表中\
  \ `name` 列中具有相同值的行来恢复原始表，如图图 1-4 的底部所示。\n\n![点击展开](img/fg0104_0.jpg)\n\n图 1-4：JOIN\
  \ 返回一个通过合并源表而成的表。\n\n以下是图 1-4 的 SQL 代码：\n\n```\nSELECT phone.name, phone_type, phone_number,\
  \ address\nFROM phone, address\nWHERE phone.name = address.name\n```\n\n| | 注意 |\
  \ | 如果你不告诉 DBMS 要通过哪些列进行连接，你将得到一个自然连接（natural join）：即每个表中行的所有可能的组合。 |\n\n能够通过任何具有共同取值的列来连接表，这使得关系型数据库变得如此强大且有用。有时，连接表并不能提供你想要的结果。如果某个地址没有匹配的电话号码，该地址就不会被选中。如果你想要的是“所有带有电话号码的地址”，你需要使用\
  \ `OUTER JOIN`（外连接）。如果 `OUTER JOIN` 在表中无法找到匹配的行，它将返回一行在缺失字段上为 `NULL` 值的行，如图图 1-5\
  \ 所示。\n\n![点击展开](img/fg0105_0.jpg)\n\n图 1-5：OUTER JOIN 为缺失数据提供 NULL 值。\n\n### 查询的\
  \ UNION\n\n大多数数据库查询在单张或多个连接的表上使用 `RESTRICT` 和 `PROJECT`。但有时你需要组合多个查询的结果：例如，你可能想要将书籍表的标题和作者*以及*\
  \ CD 表的标题和艺术家合并到同一张表中。这就是 `UNION` 作用的。\n\n在图 1-6 中，查询返回了书籍表中的标题和作者，以及 CD 表中的标题和艺术家；`UNION`\
  \ 将这些内容合并成了一张表。唯一的限制是，你必须从每张表中选择相同数量的列，并且它们的数据类型必须兼容。\n\n![点击展开](img/fg0106_0.jpg)\n\
  \n图 1-6：UNION 返回一个通过合并两个相似表而成的表。\n\n之前所有的操作都将在后续章节中使用。\n\n| | |\n\n| | |\n\n| ![Team\
