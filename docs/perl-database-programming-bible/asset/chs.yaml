  \ ![Previous Section](img/#LiB0531_split_000.htm) ![Next Section](img/#LiB0534_split_000.htm)\
  \ |\n\n## 什么是 SOAP？\n\n万维网联盟（World Wide Web Consortium）对 `SOAP` 最新版本的描述如下：\n\n`SOAP`\
  \ 1.2 版本提供了一种简单且轻量级的机制，用于使用 XML 在去中心化的分布式环境中节点之间交换结构化和类型化的信息。`SOAP` 本身并不定义任何应用语义，例如编程模型或特定实现的语义；相反，它定义了一种简单的机制，通过提供模块化的封装模型和应用程序定义数据的编码机制来表达应用语义。这使得\
  \ `SOAP` 可用于从消息系统到远程过程调用（RPC）调用的各种用途。在规范的之前的版本中，`SOAP` 名称是一个缩写。现在情况不再如此了。\n\n哇，这听起来就像是由一个委员会写的；它实际上是由一个委员会写的。但我们可以将其破译为对我们有意义的内容。\n\
  \n`SOAP` 允许我们创建一个“SOAP 服务器”，它处理请求并返回结果。它还允许我们创建一个“SOAP 客户端”，它发出请求并收集 `SOAP` 服务器返回的数据。这一切这些在现在听起来应该非常熟悉——几乎就像\
  \ Web 服务器和 Web 浏览器。但简单来说，`SOAP` 服务器提供的是函数，而不是页面。\n\n提供函数意味着什么？就像你可以调用特定的函数一样，`SOAP`\
  \ 服务器也是如此。它们包含了已经开放的函数，以便其他程序可以访问它们。这些服务器可以在 `HTTP`、`SMTP`、`FTP` 等协议上运行。\n\n这一切的奇妙之处在于，`SOAP`\
  \ 是一个标准接口，只要你遵循发送和接收数据的标准规范，你使用的语言并无区别！所以，如果我用 `C++` 写了一个 `SOAP` 服务器，并不意味着我局限于在\
  \ `C++` 中调用它的函数；你可以使用 `Perl`、`Tcl`、`BASIC`、`C` 或任何你想使用的语言——只要你遵循既定的指南即可。\n\n我提供了一个关于\
  \ `SOAP` 是什么非常简单的概述。`SOAP` 可能非常复杂。幸运的是，`SOAP-Lite` `Perl` 模块为我们处理了 99% 的细节；我们只需要写一点\
  \ `Perl` 来实现 `SOAP` 客户端或服务器。\n\n我们将涵盖如何创建一个简单的 `SOAP` 服务器和 `SOAP` 客户端来实现来实现基于 Web\
  \ 的目录系统。该目录系统提供产品列表；当用户点击产品编号时，系统会提供关于该产品的详细信息。\n\n|  |  |\n|  |  |\n| ![Team LiB](img/#_back.htm)\
  \ | ![Previous Section](img/#LiB0531_split_000.htm) ![Next Section](img/#LiB0536_split_000.htm)\
  \ |\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0534_split_000.htm)\
  \ ![Next Section](img/#LiB0544_split_000.htm) |\n\n## 构建 SOAP 服务器\n\n我们将创建的 `SOAP`\
  \ 服务器将暴露两个供 `SOAP` 客户端访问的函数。一个函数返回数据库中所有产品的列表；该函数不期望任何参数，并返回一个数组引用的数组（也称为“列表列表”）。另一个函数期望接收一个编号，并返回一个\
  \ XML 文档，我们将解析该文档以创建一个关于产品详细信息的页面。\n\n我们将首先查看构成 `SOAP` 服务器的代码。这实际上只是一个 `CGI` 程序，添加了一些内容以让它表现得像一个\
  \ `SOAP` 服务器。\n\n```\n01: #!/usr/bin/perl -w\n02: # A simple SOAP server\n03: use\
  \ strict;\n04: use DBI;\n05: use LWP::Simple ();\n06: use HTML::Linkor;\n07: use\
  \ SOAP::Transport::HTTP;\n```\n\n第 1 行是解释器路径。\n\n第 2 行是关于简单 服务器的注释。\n\n第 3 行加载了\
  \ `strict` 模块。该模块导致 Perl 变得严格。\n\n第 4 行加载了 `DBI` 模块。这是 Perl 的数据库接口。\n\n第 5 行加载了\
  \ `LWP::Simple`。该模块让获取文档变得简单。\n\n第 6 行加载了 `HTML::Linkor`。该模块从 HTML 文档中提取链接。\n\n\
  第 7 行加载了 `SOAP::Transport::HTTP`。这是我们使用 HTTP 协议创建 SOAP 服务器的方法。\n\n```\n08: package\
  \ Catalog;\n09: my $dbh = DBI->connect\n(\"DBI:mysql:books:switch.perlguy.net\"\
  ,\n      \"bookuser\",\"\")\n10:     or die(\"Cannot connect: $DBI::errstr\\nAborting.\"\
  );\n11: my @imgs;\n```\n\n第 8 行声明我们现在处于 `Catalog` 包中。包用于声明不同的命名空间。\n\n第 9 行连接数据库并返回一个句柄。返回句柄后存储在新定义的变量\
  \ `$dbh` 中（数据库句柄）。\n\n第 10 行是第 9 行的延续；如果连接数据库时出现问题，`die` 函数会导致程序终止并显示错误消息。\n\n第\
  \ 11 行声明了一个新数组 `@imgs`。这个新定义的数组和第 9 行的变量 `$dbh` 对 `Catalog` 包内的所有函数可用，因为它们定义在任何子程序之外。\n\
  \n```\n12: SOAP::Transport::HTTP::CGI\n13:   -> dispatch_to('Catalog')\n14:   ->\
  \ handle;\n```\n\n第 12-14 行为 `Catalog` 包创建了一个封装。\n\n第一部分第 12 行告诉系统我们要使用 HTTP 协议创建一个\
  \ SOAP 服务器，并且它将像基于 CGI 的服务器一样运行。这些都是 `SOAP::Lite` 包的一部分。\n\n第二部分第 13 行告诉这个 SOAP\
  \ 服务器，当有人尝试访问某个方法时，必须请求将其分发到 `Catalog` 包。\n\n最后一部分第 14 行简单将控制权交给 `handle` 方法，以便请求得到妥善处理。\n\
  \n这之前的三行代码使得这个 CGI 程序成为了一个 SOAP 服务器。\n\n\n\n\n\n```perl\n15: sub Get_Product_List\
  \ {\n16:     my $sql = qq(SELECT title, isbn FROM library);\n17:     my $sth = $dbh->prepare($sql);\n\
  18:     $sth->execute;\n```\n\n`Line 15` 开始一个名为 `Get_Product_List` 的子程序。该子程序是我们作为\
  \ SOAP 服务提供的两个子程序之一。`Get_Product_List` 不接受任何参数；它只是查询数据库并返回产品列表。\n\n`Line 16` 创建了一个名为\
  \ `$sql` 的新变量，并在其中存储了从数据库中获取数据所需的 SQL 语句。\n\n`Line 17` 准备 SQL 语句，并将准备好的语句存储在名为 `$sth`\
  \ 的新变量中。`STH` 代表 `StatementHandle`（语句句柄）。\n\n`Line 18` 在 `$sth` 句柄上调用 `execute`\
  \ 方法。这会导致 SQL 语句在数据库上运行，其结果也作为引用存储在 `$sth` 句柄中。\n\n```perl\n19:     my @products;\n\
  20:     while(my $ptr = $sth->fetch){\n21:         push (@products, [ @$ptr ]);\
  \ \n22:     }\n```\n\n`Line 19` 声明了一个名为 `@products` 的新数组。\n\n`Line 20` 开始一个 `while`\
  \ 循环，只要 `$sth->fetch` 调用返回数据，循环就会继续。一旦 fetch 调用没有更多可检索的数据，`$ptr` 将被设置为 `undef` 且\
  \ `while` 循环终止。\n\n`Line 21` 将一个包含当前值的新匿名数组的引用推送到 `@products` 数组上。每次通过循环时，`$ptr`\
  \ 都会存储一个包含当前值的数组的引用。要获取数组值，可以在引用前加上 `@`。`@$ptr` 外围的方括号 `[]` 会将数组的当前值复制到一个新的匿名数组中。该匿名数组的引用被推送到\
  \ `@products` 数组中。每个新的匿名数组都是自己的数组，并占据自己的内存。如果我们尝试使用 `$ptr` 传递数组的引用，我们将在每次循环时覆盖数据，因为我们将其存储在同一个数组内存中。循环结束后，我们最终将得到一组指向我们访问的最后一条记录的数组——这并不是我们想要的。`Line\
  \ 22` 结束了从 `line 20` 开始的 `while` 循环。\n\n```perl\n23:     return(\\products);\n24:\
  \ }\n```\n\n`Line 23` 返回 `@products` 的引用。这就是任何调用此程序的 SOAP 客户端将得到的返回：一个列表列表。`Line\
  \ 24` 结束了 `Get_Product_List` 子程序。\n\n```perl\n25: sub Get_Data {\n26:     my $rval;\n\
  27:     my ($class, $input) = @_;\n28:     die \"Bad Number.\" \n          unless($input\
  \ =~ m/[\\dXx-]{10,13}$);\n29:     $Catalog::input     =$input;\n```\n\n`Line 25`\
  \ 开始 `Get_Data` 子程序。该子程序同样可以通过 SOAP 服务器访问。该子程序预期接收一个用户想要获取详情的物品零件号。该零件号存储在 `$input`\
  \ 变量中。`Line 26` 声明了一个名为 `$rval` 的新标量变量。\n\n`Line 27` 声明了两个标量变量。`$class` 是指向包的引用；此值会自动传递。`$input`\
  \ 是函数调用传递的值；它应该包含我们要查找的物品零件号。`Line 28` 如果传递给 `$input` 的值不匹配正则表达式，则调用 `die` 函数。正则表达式检查\
  \ `$input` 变量中只出现数字、连字符和字母 X。它还检查 `$input` 中的值长度是否在 10 到 13 个字符之间。这允许我们验证是否获取了预期的输入类型。允许任何任意数据将带来安全风险，这是我们想要避免的。`Line\
  \ 29` 将一个名为 `$Catalog::input` 的包级变量设置为值 `$input`。在 `line 27` 上声明的 `$input` 作用域仅此子程序。但通过声明\
  \ `$Catalog::input`，我们实际上创建了一个在 `Catalog` 包内可访问的新变量。\n\n```perl\n30:    my $sql\
  \  = \"SELECT * FROM library WHERE isbn = '$input'\";\n31:    my $p       = $dbh->selectrow_hashref($sql);\n\
  32:    $p{image} = _get_image($input);\n```\n\n`Line 30` 声明了一个名为 `$sql` 的新标量变量，并赋值为右侧的\
  \ SQL 语句。\n\n`Line 31` 创建了一个名为 `$p` 的新标量变量，我们将其作为指向 `selectrow_hashref` 方法返回值的指针。`selectrow_hashref`\
  \ 是使用 `DBI` 从数据库获取数据的另一种方法。注意我们不需要对此语句执行 `prepare` 和 `execute`。由于我们只返回一个项目，而且我们提前知道这一点，因此可以使用\
  \ `selectrow_hashref` 方法。该方法直接从数据库句柄（`$dbh`）引用，SQL 语句直接传递给它。一旦 `selectrow_hashref`\
  \ 完成它的魔术，变量 `$p` 将包含一个指向哈希的引用，该哈希包含了返回的数据。`Line 32` 将 `$p{image}` 设置为 `_get_image($input)`\
  \ 的返回值。\n\n```perl\n33:     if($p){\n34:         $rval = qq(<?xml version=\"1.0\"\
  ?>\\n);\n35:         $rval .= qq( <catalog_item>\\n);\n36:         while(my($k,$v)\
  \ = each %$p) {\n37:             if($v) {\n38:                 $v     ~ s/^ +//;\n\
  39:                 $v     ~ s/(\\015?\\012)$//;\n40:                 $rval .= \"\
  <$k>$v</$k>\\n\";\n41:             }\n42:         }\n43:         $rval .= qq( </catalog_item>\\\
  n);\n44:     }\n```\n*(注：此处根据上下文逻辑补全了翻译逻辑)*\n\n`Line 33` 检查 `$p` 是否有值。如果存在，则进入该块。`Line\
  \ 34` 将 `$rval` 设置为 XML 头。`Line 35` 为 `$rval` 附加 `<catalog_item>`。\n\n`Line 36`\
  \ 开始一个 `while` 循环，遍历 `$p` 引用的哈希中的元素。对于每个哈希元素，`$k` 和 `$v` 分别被赋值为键和值。`Line 37` 检查\
  \ `$v` 是否有值。`Line 38` 使用正则表达式移除 `$v` 开头的任何空格。`Line 39` 从 `$v` 的末尾移除回车符和或换行符。`Line\
  \ 40` 向 `$rval` 附加 `<$k>$v</$k>\\n`。`Line 41` 结束 `if` 块。`Line 42` 结束循环。\n\n`Line\
  \ 43` 向 `$rval` 附加 `</catalog_item>`。`Line 44` 结束从 `line 33` 开始的代码块。`Line 45` 断开与数据库的连接。`Line\
  \ 46` 返回 `$rval`。`rval` 包含了整个 XML 文档的大型字符串。`Line 47` 结束 `Get_Product_Data` 子程序。\n\
  \n\n\n\n\n`Line 48` 开始了 `_get_image` 子程序。该子程序以下划线开头，且名称使用小写，这是因为该子程序仅供程序中的其他子程序内部使用。这是一个常见的做法，让你轻松地看出哪些子程序是“私有”的，哪些是“公共”的。\n\
  \n`Line 49` 声明了一个名为 `$input` 的新标量变量，并将其设置为 `$Catalog::input` 中的值。\n\n`Line 50` 声明了一个名为\
  \ `$url` 的新标量变量，并根据固定字符串和 `$input` 变量中的值创建一个 URL。$input` 变量中的值应该是部件号。\n\n```\n51:\
  \     my $p = HTML::LinkExtor\n52:              ->new(\\&_callback)\n53:       \
  \       ->parse(LWP::Simple::get($url));\n```\n\n`Line 51` 创建了一个名为 `$p` 的新标量变量，并将其设置为调用\
  \ `HTML::LinkExtor` 返回的值。对 `HTML::LinkExtor` 的这次调用跨越了 `lines 51-53`。\n\n`Line 52`\
  \ 调用了 `HTML::LinkExtor` 的新方法，并向其传递了 `_callback` 函数的引用。当我们向 `$p` 传递数据时，就会调用 `_callback`\
  \ 函数。\n\n`Line 53` 调用了 `HTML::LinkExtor` 的 `parse` 方法。该方法接收了从 `LWP::Simple::get($url)`\
  \ 返回的值。`LWP::Simple::get($url)` 会访问互联网并获取 `$url` 指向的 HTML 文件。调用返回的 HTML 页面将由 `LinkExtor`\
  \ 模块进行解析。\n\n我们将很快介绍 `_callback` 函数，它决定了从刚刚获取的 HTML 页面中检索哪些数据。\n\n```\n54:     return($imgs[0]);\n\
  55: }\n```\n\n`Line 54` 返回 `@imgs` 数组中第一个元素的值。该值应该包含一个指向亚马逊网站上书籍图片的链接。\n\n`Line\
  \ 55` 结束了 `_get_image` 子程序。\n\n```\n56: sub _callback {\n57:     my($tag, %attr)\
  \ = @_;\n58:     return if $tag ne 'img';\n```\n\n`Line 56` 开始了 `_callback` 子程序。该子程序用于从\
  \ `_get_image` 子程序获取的 HTML 页面过滤掉我们不需要的数据。\n\n`LinkExtor` 模块解析出网页中的所有链接。这些链接随后被传递给\
  \ `_callback` 函数，以及 HTML 标签中的任何属性。\n\n`Line 57` 声明了一个标量变量和一个哈希表，并存储传递给子程序的值。`$tag`\
  \ 包含当前标签，%attr` 包含 HTML 页面上该标签中的属性。\n\n`Line 58` 如果当前标签不是图像标签，则从子程序返回。\n\n```\n\
  59:     my @foo = values %attr;\n60:     return if($foo[0] !~ /$Catalog::input/i);\n\
  61:     push(@imgs, values %attr);\n62: }\n```\n\n`Line 59` 声明了一个名为 `@foo` 的新数组，并将\
  \ `%attr` 数组中的值存储其中。\n\n如果我们有像这样的 `<img src=\"/images/foo.png\">` 的图像标签，`%attr`\
  \ 哈希表将包含一个键 `src` 和值 `/images/foo.png`。\n\n`Line 60` 如果 `@foo` 数组的第一个元素不包含存储在 `$Catalog::input`\
  \ 中的数据，则返回。$Catalog::input` 中的值是部件号（在本例中为 ISBN）。\n\n`Line 61` 将当前值推入 `@imgs` 数组。\n\
  \n`Line 62` 结束了 `_callback` 子程序。\n\n就是这样！只需要 62 行代码就能创建一个包含两个有用命令的 SOAP 服务器。\n\n\
  ## 列出所有项目\n\n接下来，我们将介绍目录程序。该程序会创建一个包含所有产品列表及其部件号的 Web 页面。本示例中的产品是一个书籍列表，部件号实际上是这些书籍的\
  \ ISBN。在现实中，部件和部件号可以是任何类型的产品。我恰好有一个已经填充好的书籍数据库，所以我很容易基于现有数据创建一个示例。\n\n该程序创建的目录页面并不是为了美观；它是为了作为一个易于使用的简单示例。对于实际应用，你可能希望为你的客户让用户界面看起来漂亮得多。图\
  \ 12-1 显示了该程序生成的示例。\n\n```\n#!/usr/bin/perl\n-w\nuse strict;\nuse warnings;\n\n\
  my %Catalog = (\n    '1234567890' => 'The Great Gatsby',\n    '0987654321' => '1984',\n\
  \    '1552233445' => 'Moby Dick',\n);\n\nprint <<HTML;\n<html>\n<head><title>Product\
  \ Catalog</title></head>\n<body>\n<table border=\"1\" cellspacing=\"0\" align=\"\
  center\">\n   <tr>\n     <td colspan=\"2\" align=\"center\">\n      <font size=\"\
  6\">\n       Product Catalog\n      </font>\n     </td>\n   </tr>\n   <tr>\n   \
  \  <td align=\"center\">Part #</td>\n     <td align=\"center\">Item</td>\n   </tr>\n\
  HTML\n\nfor (sort keys %Catalog){\n    print q(   <tr><td);\n    print q(<a href=\"\
  /cgi-bin/item_details.cgi?item_num=\");\n          $_\">\">$_</a>);\n    print q(\
  \    </td><td>$Catalog{$_});\n    print q(   </td></tr>\\n);\n}\n\nprint <<HTML;\n\
  \  </table>\n</body>\n</html>\nHTML\n```\n\n\n\n\n我们现在已经有了 SOAP 服务器以及调用其中一个 SOAP\
  \ 函数的程序。接下来，我们将查看显示已点击项目详细信息的程序。\n\n## 显示项目详情\n\n接下来的程序执行了几个不同的操作，向你展示即使是一个小程序也可以完成多项任务，并成为相当复杂系统的一部分。\n\
  \n本示例中的 `item_details.cgi` 程序运行在一个服务器上，连接到一个从完全不同的服务器获取产品信息的 SOAP 服务器，并将结果作为 XML\
  \ 文档返回。该 SOAP 服务器还会从 `Amazon.com` 获取一个网页并对其进行解析，我们只保留产品或书籍图像的 URL。\n\n在这个小程序中，我们连接到一个连接到另外两个服务器的\
  \ SOAP 服务，并将所有这些数据整合到一个页面中——对用户来说完全无缝！\n\n图 12-2 显示了详细产品页的样子。\n\n![点击展开](img/fg1202_0.jpg)\
  \ 图 12-2: 详细产品页\n\n```\n01: #!/usr/bin/perl -wT\n02: use strict;\n03: use CGI qw(:standard);\n\
  04: use SOAP::Lite;\n05: use XML::Simple;\n```\n\n`Line 1` 告诉系统去何查找 Perl，并开启警告和污染检查（taint\
  \ checking）。\n\n`Line 2` 加载 `strict` 模块。\n\n`Line 3` 加载 `CGI` 模块及其标准函数。\n\n`Line\
  \ 4` 加载 `SOAP::Lite` 模块。\n\n`Line 5` 加载 `XML::Simple` 模块。\n\n```\n06: print header;\n\
  07: my $input = param(‘item_num');\n```\n\n`Line 6` 打印 `header` 函数返回的数据。`header`\
  \ 函数是 `CGI` 模块的一部分。\n\n`Line 7` 声明了一个名为 `$input` 的新变量，并将其设置为 `param` 函数返回的值。在这种情况下，`param`\
  \ 函数正在查找通过 URL 以 HTML GET 形式传递的值。\n\n```\n08: my $data = SOAP::Lite\n09:   -> uri(‘http://goliath.perlguy.net/Catalog')\n\
  10:   -> proxy(‘http://goliath.perlguy.net/cgi-\n    bin/soap_server.cgi')\n11:\
  \   -> Get_Product_Data($input)\n12:   -> result;\n```\n\n`Line 8` 声明了一个名为 `$data`\
  \ 的标量变量，并赋值为调用 `SOAP::Lite` 模块返回的值。`Get_Product_Data` 返回的是组成 XML 文档的字符串。\n\n`Lines\
  \ 8-12` 实际上是 `SOAP::Lite` 模块中多个方法的连接。这些命令构成了一个从 SOAP 服务器检索取数据的 SOAP 客户端。\n\n`Line\
  \ 9` 告诉 SOAP 客户端我们正在调用的服务的 URI 或命名空间。\n\n`Line 10` 是我们要联系的 SOAP 服务器的地址。\n\n`Line\
  \ 11` 是我们在 SOAP 服务器上调用的远程函数；我们将 `$input` 中的值传递给 `Get_Product_Data` 函数。\n\n`Line\
  \ 12` 调用了 `result` 方法，该方法返回我们所调用的函数的结果。\n\n```\n13: $data =~ s/\\&amp;|\\&/\\&amp;/g;\n\
  14: my $item = XMLin($data);\n```\n\n`Line 13` 将返回的 XML 文档中的任何 & 号 HTML 标记（`&amp;`）或孤立的\
  \ & 号（`&`）替换为等效的 HTML 标记（`&amp;`）。XML 文档中的纯 & 会导致文档解析出错。我们在搜索中包含 `&amp;`，以确保不会将已经标记过的\
  \ & 号从 `&amp;` 更改为 `&amp;amp;`。\n\n`Line 14` 声明了一个名为 `$item` 的标量变量。这个新标量变量被设置为 `XMLin`\
  \ 函数返回的值。`XMLin` 是 `XML::Simple` 模块的一部分，它返回一个包含解析后的 XML 文档的哈希表引用。\n\n```\n15: print<<HTML;\n\
  16: <html>\n17:  <head><title>Product $item->{title}</title></head>\n18:  <body><body>\n\
  19:   <table border=\"1\" align=\"center\">\n20:    <tr bgcolor=\"#c0c0c0\">\n21:\
