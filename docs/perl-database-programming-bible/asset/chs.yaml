  \ |\n\n## 界面设计\n\n在为 Web 应用设计界面时，你应该考虑几点以便应用程序对用户更友好。例如，考虑图 6-1 中的表单。不太漂亮，对吧？什么都没有对齐，甚至很难辨出哪些字段对应哪些描述。\n\
  \n![点击展开](img/fg0601_0.jpg) 图 6-1: 格式化不当的 HTML 表单\n\n让我们使用表格来清理一下界面。看看图 6-2。它是同一个表单，只是表格格式。这样不是好得多吗？通过使用表格，我们能够让表单看起来漂亮得多。确定哪些字段对应哪些描述也变得更容易。\n\
  \n![点击展开](img/fg0602_0.jpg)\n\n图 6-2: 表格格式的 HTML 表单\n\n这个表单的信息比我们电话录应用真正需要的多一点。展示这些额外的元素是为了让你对它们熟悉。。表单的\
  \ HTML 代码包含在本书的网站上。看看这个表单，并尝试操作上面的字段和按钮。\n\n图 6-3 显示了我们将实际使用的界面，用于向此版本的 Web 电话录应用中输入新记录。\n\
  \n![点击展开](img/fg0603_0.jpg)\n\n图 6-3: Web 电话录屏幕\n\n| **![侧边栏开始](img/_1.gif)** |\n\
  \n### 设计技巧\n\n在考虑你的界面设计时，有几点需要注意：\n\n* 尽可能保持 HTML 表单整洁、不杂乱。\n* 仅收集必要的信息。\n* 对齐字段，使它们不要散落在表单各个角落。\n\
  * 尽量让表单保持在一个屏幕内。（不要让用户滚动。）\n\n| **![侧边栏结束](img/_1.gif)** |\n\n| 安全\n\n### 安全问题\n\
  \n安全性极其重要，尤其是当你处理 Web 时。有许多专门关于安全和 Web 编程的书籍。在这个小小的章节中，我们无法涵盖 Web 编程安全的所有方面。幸运的是，Perl\
  \ 有一个非常优秀的特性可以帮助你的 Web 程序变得安全得多。`taint` 模式 Perl 中的一个开关，它让 Perl 将所有来自外部源的数据视为“污染的（tainted）”。当一个变量被污染时，它不能用于任何类型的系统调用。程序员可以通过正则表达式对变量进行过滤来取消污染。通过污染变量，你无法无意中从恶意用户输入执行额外的\
  \ shell 命令。\n\n要开启污染模式，你需要在程序的第一行传递 `-T` 标志。\n\n```\n#!/usr/bin/perl -T\n```\n\n\
  前面的代码行告诉系统哪里可以找到 Perl 并开启污染模式。\n\n```\n1: my $var1 = shift;          # 被污染的\n2:\
  \ my $var2 = \"Brent \";     # 未污染的\n3: my $var3 = $var2 . $var1;  # 被污染的\n4: $var3\
  \ =~ /^([\\w ]+)$/ or die \"Not Cleaned!\";     # 清理变量...\n5: $var3 = $1;      \
  \          # 现在 $var3 未被污染了。\n```\n\n**第 1 行** `$var1` 被污染了，因为数据来自外部源——命令行。\n\n\
  **第 2 行** 未污染，因为变量来自程序内部；没有外部数据接触过这个变量。\n\n**第 3 行** 被污染了，因为它与第一个被污染的变量连接在了一起。\n\
  \n**第 4 行**通过正则表达式运行 `$var3` 变量。正则表达式只允许字母、数字、下划线或空格。正则表达式以 `^` 开始并以 `$` 结尾，因此不会有非法字符。如果匹配失败，将调用\
  \ `die` 函数终止程序。在**第 5 行**，我们将 `$var3` 设置为 `$1`。如果匹配成功，`var3` 现在未被污染。\n\n假设我们有一个名为\
  \ `taint.pl` 的程序，带有上述代码。让我们这样运行：\n\n```\ntaint.pl Brent\n```\n\n如果 `$var3` 然后被打印出来，它将包含“Brent”。然而，如果我们这样运行程序：\n\
  \n```\ntaint.pl alski\n```\n\n`var3` 将是空的。\n\n| **![侧边栏开始](img/_1.gif)** |\n\n###\
  \ 安全技巧\n\n在处理你的网站安全时，以下提示非常有用：\n\n* 始终使用污染检查（taint）。\n* 使用 strict。\n* 不要信任任何源自程序外部的数据；这包括环境变量。（如果开启了污染检查，你无法这样做。）\n\
  * 验证所有输入的长度，并检查是否为有效数据。\n\n| **![侧边栏结束](img/_1.gif)** |\n\n污染检查和取消污染可能会很困惑。perlsec\
  \ 文档关于污染有很多很好的信息.*Writing CGI Applications with Perl* (Addison Wesley, 2001) 也有一个专门介绍安全的章节，书中的所有示例都使用了\
  \ `-T` 标志。要查看 `perlsec` 文档，在提示符中输入 `perldoc perlsec`。\n\n### 速度考虑\n\n如果不使用加速工具或方法，Perl\
  \ CGI 程序无法处理大量负载，而且不会很快。这没关系；没有任何东西是在没有其他工具的情况下真正的。\n\n许多公司（即使是大型公司）似乎认为如果你想要企业级应用，就必须支付企业级的价格来处理负载。这完全不是如此；许多繁忙的网站——例如\
  \ http://slashdot.org——每天经常处理数百万次点击。许多网站仅使用 Perl 和开源软件。然而，如果你询问管理员，他们对性能非常满意，价格也绝对合适。此外，注意到与企业级解决方案需要开发团队维护相比，许多此类网站维护所需的程序员数量非常少。\n\
  \n\n\n\n有很多 `mod_perl` 插件可以让网站设计变得更简单。`HTML::Mason` 是创建一个网站的优秀工具，允许你将 Perl 嵌入 HTML\
  \ 文档中。`epage` 是另一个很好的工具；它也让你将 Perl 嵌入 HTML。`Embperl` 是另一个工具，允许你将 Perl 嵌入 HTML。所有这些工具都比单纯运行\
  \ Perl CGI 程序提供了显著的增强。表 6-1 列出了这些工具的 URL。\n\n表 6-1：启用 Perl 的 HTML 工具\n\n| 工具 | URL\
  \ |\n| --- | --- |\n| mod_perl (以及更多) | [`perl.apache.org`](http://perl.apache.org)\
  \ |\n| HTML Mason | [`www.masonhq.com`](http://www.masonhq.com) |\n| Embperl | [`perl.apache.org/embperl`](http://perl.apache.org/embperl)\
  \ |\n| eperl | [`www.ossp.org/tool/eperl/`](http://www.ossp.org/tool/eperl/) |\n\
  \n## 程序\n\n首先，让我们开发一个基于 Web 的电话录，以便你可以获得与 Web 界面操作数据库的经验。我们将创建 Web 应用程序将执行以下操作：\n\
  \n*   应用程序将显示一个带有添加记录链接和搜索区域的启动界面。\n*   添加记录链接将指向另一个带有新记录表单字段的 HTML 页面。\n*   添加记录页面将接收用户输入并添加到数据库。\n\
  *   主页面上的搜索区域将接收用户输入，使用用户输入生成 SQL 查询语句，并显示匹配的结果。\n\n这是一个简单的基于 Web 的电话录；它不像你可能发现那些完整，但它是为了学习。你可以自由添加功能。添加功能也是学习程序和\
  \ Web 编程的极佳方法。\n\n### Web 电话录\n\n首先，让我们看看为电话录需要的两个 HTML 页面。在这些 HTML 文件，我们尝试使用不同的\
