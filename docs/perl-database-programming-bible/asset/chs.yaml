  14:     or die(\"Error! $!\\nAborting\");\n15: while( read($image_handle, $data,\
  \ 2048) ) {\n16:     $image_data .= $data;\n17: }\n18: $image_data = $dbh->quote($image_data);\n\
  19: my $mime       = $dbh->quote($mime);\n20: my $sql = qq{INSERT INTO item\n21:\
  \   ( name, description, donor_id, value, min_bid, \n22:     min_incr, auction_id,\
  \ item_image, mime)\n23:   VALUES \n24:     (?, ?, ?, ?, ?, ?, ?, $image_data, $mime)\
  \ };\n25: my $sth   = $dbh->prepare($sql);\n26: $sth->execute( @fd{ qw(item_name\
  \ description donor_id \n27:                     value min_bid min_incr auction_id)\
  \ }) \n28:     or die(\"Error: $DBI::errstr \\nAborting\");\n29: print \"Success!\\\
  n\";\n30: print \"MIME type: $mime\\n\";\n```\n\n### 列表 8-3: display_image.cgi\n\
  \n```\n01: #!/usr/bin/perl -wT\n02: # display_image.cgi\n03: use strict;\n04: use\
  \ DBI;\n05: use CGI qw(:standard);\n06: my $a_id    = param(\"a_id\");\n07: my $item_id\
  \ = param(\"item_id\");\n08: my ($sth, $sql, $item);\n09: my $dbh = DBI->connect(\"\
  dbi:mysql:auction_img\", \n        \"bookuser\", \"testpass\")\n10:     or die(\"\
  Error! $DBI::errstr\\nAborting\");\n11: if($a_id) {\n12:     die \"No valid a_id?\"\
  \ unless $a_id =~ m/\\A\\d+\\z/;\n13:     $sql = qq{SELECT logo, mime FROM auction\n\
  14:       WHERE auction_id = ? };\n```\n\n\n\n\n| ![Team LiB](img/#_back.htm) |\
  \ ![Previous Section](img/#LiB0437_split_000.htm) ![Next Section](img/#LiB0442_split_000.htm)\
  \ |\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0440_split_000.htm)\
  \ ![Next Section](img/#LiB0470_split_000.htm) |\n\n## 程序示例\n\n我们将创建的程序是一个包含两个页面的网站。其中一个页面用于“用户注册”，另一个页面是注册用户的索引。现实世界中的网站有许多页面，但正如你从示例中看到的，向此网站添加页面是非常简单的。\n\
  \n图 9-1 显示了我们网站的“用户注册”屏幕。我们将收集一些数据来生成一个个性化的网页。其中一些数据是必需信息，因此在强制字段旁边有一个 `*`。\n\n\
  ![点击展开](img/fg0901_0.jpg) 图 9-1: 注册/注册\n\n对于我们的示例，我们将获取*名*、*姓*、三个*收藏链接*、一张*收藏图片*、*收藏名言*、*页面颜色*、*页面背景颜色*以及我们应该存储这些信息的时间。\n\
  \n`signup.cgi`\n\n| **![开始示例](img/_1.gif)** |\n\n```\n01: #!/usr/bin/perl -wT\n\
  02: # signup.cgi\n03: use strict;\n04: use lib qw(.);\n05: use BasicSession;\n06:\
  \ use CGI qw(:standard);\n```\n\n| **![结束示例](img/_1.gif)** |\n\n`Line 1` 告诉系统去哪里寻找\
  \ Perl，并开启警告和污染检查（taint checking）。\n\n`Line 2` 是关于此程序的注释。\n\n`Line 3` 载入了 `strict`\
  \ 模块。`strict` 模块可以防止程序员犯简单的错误，例如重复声明变量或拼错变量名。所有变量在使用之前都必须声明——如果变量名拼错，就会发生错误，从而警告程序员。\n\
  \n`Line 4` 让 Perl 在当前目录（`.`）中搜索模块。\n\n`Line 5` 载入了 `BasicSession.pm` 模块。这是我们将创建一个模块，它包含了会话跟踪代码以及将我们的哈希表绑定到数据库的代码。\n\
  \n`Line 6` 载入了 `CGI.pm` 模块及其 `:standard` 标准函数集。\n\n```\n07: my  (%item, $errors);\n\
  08: my $remember_for = param(‘remember’);\n```\n\n`Line 7` 声明了一个名为 `%item` 的哈希变量和一个名为\
  \ `$errors` 的标量。\n\n`Line 8` 声明了一个名为 `$remember_for` 的标量变量，并将其设置为从 HTML 表单的 `remember`\
  \ 变量传递的值。使用 `CGI.pm param` 函数来获取并解码该值。\n\n```perl\n09: if(my $clear = param(‘clear’))\
  \ {\n10:     our $sess     = Get_Session(\"clear\");\n11: }\n```\n\n`Line 9` 声明了一个名为\
  \ `$clear` 的变量，并将其设置为 `param('clear')` 返回的值。如果从网页上通过 `clear` 变量传递了值，将进入此代码块。\n\n\
  `Line 10` 如果在 `clear` 变量中传递了内容，则执行。它声明了一个名为 `$sess` 的 `our` 变量，并将其设置为 `Get_Session`\
  \ 函数返回的值。通过将变量声明为 `our`，我们将其声明为*全局*变量。通过将值 `\"clear\"` 传递给 `Get_Session` 函数，我们正在清除用户系统上的\
  \ cookie。\n\n`Line 11` 关闭了此代码块。\n\n```perl\n12: else {\n13:     our $sess     =\
  \ Get_Session($remember_for);\n14: }\n```\n\n`Line 12` 是此 `if..else` 块的 `else` 部分。如果\
  \ `line 9` 上的语句为假（即没有通过 `clear` 变量传递任何值），则进入此处。\n\n`Line 13` 声明了一个名为 `$sess` 的 `our`\
  \ 变量，并将 `$remember_for` 中的值传递给 `Get_Session` 函数。这会在用户的系统中设置一个 cookie，并将“会话值”返回并存储在\
  \ `$sess` 变量中。`$sess` 变量是我们整个程序过程中确定该用户身份的键值。因此，`$sess` 非常重要。\n\n`Line 14` 关闭此 `if..else`\
  \ 块。\n\n```perl\n15: my  @fields   = qw(first_name last_name link1 link2\n16:  \
  \                  link3 image text_color bg_color\n17:                 remember\
  \ fav_quote);\n```\n\n`Lines 15–17` 声明了一个名为 `@fields` 的数组，并将其设置为 HTML 表单字段名。\n\n\
  ```perl\n18: my  @required = qw(first_name last_name link1\n19:                \
  \    image text_color bg_color);\n```\n\n\n\n\n\n在我们操作这个 `%item` 哈希时，需要记住的一点是，由于我们将哈希绑定到了\
  \ `BasicSession` 模块，它的行为并不像普通的哈希。。实际上，当我们向此哈希添加或删除数据时，我们是在向 MySQL 数据库中进行添加和删除。\n\
  \n`Line 43` 关闭了从 `line 21` 开始的 `if` 块。\n\n```\n44: Wrap_Page(\"./templates\", \"\
  signup.tmpl\", \\%item);\n```\n\n`Line 44` 调用了 `Wrap_Page` 函数并传递了三个值：*模板目录*、*要显示的文件*以及\
  \ `%item` 哈希的*引用*。\n\n我们通过此程序显示的所有页面仅仅是 HTML 模板。我们使用该函数来打印页眉、读取并显示模板文件，以及显示页脚。\n\
  \n```\n45: sub Check_Fields {\n46:     return if(param(‘clear’) == 1);\n```\n\n\
  `Line 45` 开始定义 `Check_Fields` 函数。\n\n`Line 46` 如果 `clear` 参数被设置为 1，则返回。如果是这样，我们就不希望在该函数中继续执行。\n\
  \n```\n47:     for my $fld (@required) {\n48:         next if(param($fld));\n49:\
  \         $errors++;\n50:     }\n```\n\n`Line 47` 遍历 `@required` 数组中的所有项。这些必须包含数据的项。\n\
  \n`Line 48` 如果找到了数据，则调用 `next` 跳到循环的下一次迭代。\n\n`Line 49` 如果我们运行到了这里，则将 `$errors`\
  \ 加 1。到达这里的唯一方法是必填项的值为空。\n\n`Line 50` 关闭了此 `for` 循环。\n\n```\n51:     return $errors;\n\
  52: }\n```\n\n`Line 51` 返回 `$errors` 中的任何内容。希望它是是空的！\n\n`Line 52` 关闭了 `Check_Fields`\
  \ 函数。\n\n这就是我们 `signup.cgi` 程序的结束。该程序读取注册界面的所有数据，并将其设置 `%item` 哈希（从而设置数据库）中。\n\n\
  一旦你填写了值并点击提交按钮，你将看到类似图 9-2 所示的内容。\n\n![点击展开](img/fg0902_0.jpg)\n\n图 9-2：点击注册\n\n\
  从这里开始，点击链接进入 `index.cgi` 页面，如图 9-3 所示（注意第二个屏幕中的额外文本）。\n\n![点击展开](img/fg0903_0.jpg)\n\
  \n图 9-3：index.cgi 页面\n\n但它是如何知道在什么位置放置什么值的呢？嗯，通过对 HTML 页面使用模板，我们可以动态地替换值。通过在想要的“变量”周围加上\
  \ `%%`，我们可以创建一个易于替换的变量。例如，如果我们想在 HTML 页面的某个地方放置 `first_name`，只需在我们想要的地方放置 `%%first_name%%`\
  \ 即可。\n\n让我们仔细观察模板。\n\n`index.tmpl`\n\n| **![示例开始](img/_1.gif)** |\n\n```\n01: <div\
  \ align=\"center\">\n02:  <table border=\"1\">\n03:   <tr>\n04:    <td>\n05:   \
  \  <img src=\"http://%%image%%\" width=\"320\" height=\"240\" alt=\"\">\n06:   \
  \ </td>\n07:    <td valign=\"top\">\n08:     <<h2>>Welcome to %%first_name%% %%last_name%%’s\
  \ Page!</h2><br>><br />\n09:     <font class=\"medium\">\n10:      This is a site\
  \ that contains some of %%first_name%%’s favorite\n         links and quotes.\n\
  11:     </font>\n12:    </td>\n13:   </tr>\n14:   <tr>\n15:    <td valign=\"top\"\
  \ colspan=\"2\">\n16:     <font class=\"big\">\n17:      <b>%%first_name%%’s favorite\
  \ links:</b>\n18:     </font>\n19:     <br />\n20:     <font class=\"small\">\n\
  21:      <a href=\"http://%%link1%%\">%%link1%%</a></a><br />\n22:      <a href=\"\
  http://%%link2%%\">%%link2%%</a></a><br />\n23:      <a href=\"http://%%link3%%\"\
  >%%link3%%</a></a><br />\n24:     <br />\n25:     <font class=\"big\">\n26:    \
  \  <b>%%first_name%%’s favorite quote:</b>\n27:     </font><br />\n28:     <font\
  \ class=\"small\">\n29:      %%fav_quote%%\n30:     </font><br />\n31:     </font>\n\
  32:    </td>\n33:   </tr>\n34:  </table>\n35:  <br /><br />\n36:  <table border=\"\
  0\">\n37:   <tr>\n38:    <td>\n39:     <font class=\"medium\">\n40:      This is\
  \ a site that contains some of %%first_name%%’s favorite\n         links and quotes.\n\
  41:     </font>\n42:    </td>\n43:   </tr>\n44:  </table>\n45: </div>\n```\n\n|\
  \ **![示例结束](img/_1.gif)** |\n\n\n\n\n\n`Line 5` 加载了 strict 模块。我们在*所有*编程中都在严格模式下进行，以避免调试可能悄入程序中的常见错误。\n\
  \n```\n06: use vars qw(@ISA @EXPORT $sess);\n07: @ISA = qw(Tie::StdHash Exporter);\n\
  08: use Exporter;\n09: @EXPORT = qw(Wrap_Page Get_Session);\n```\n\n`Line 6` 声明了变量\
  \ `@ISA`、`@EXPORT` 和 `$sess`，这样 `strict` 就不会对它们报错。\n\n`Line 7` 通过使用 `Tie::StdHash`\
  \ 和 `Exporter` 加载 `@ISA` 数组。`@ISA` 数组用于继承。这告诉 Perl 该模块是 `Tie::StdHash` 和 `Exporter`\
  \ 类的子类。\n\n`Line 8` 调用了 `Exporter` 模块。这允许我们导出选择的函数，以便其他 Perl 程序可以使用它们。\n\n`Line\
  \ 9` 将要导出的函数添加到 `@EXPORT` 数组中。\n\n```\n10: my $dbh = DBI->connect(\"DBI:mysql:user_prefs\"\
  ,\n        \"bookuser\", \"testpass\")\n11:   or die \"Error: $DBI::errstr\\nAborting\"\
  ;\n12: my ($sql, @KEYS);\n```\n\n`Line 10` 使用 `DBI` 模块创建与数据库的连接。连接结果作为句柄存储在 `$dbh`\
  \ 中。\n\n`Line 11` 是 `line 10` 的一部分。如果数据库连接失败，`line 11` 将导致程序终止并显示错误消息。\n\n`Line\
  \ 12` 声明了我们将使用的一些变量。\n\n```\n13: sub STORE {\n14:     my ($self, $key, $val) = @_;\n\
  15:     $val =~ s#^http://##;  # 去掉 http:// \n16:     my $exists = $self->EXISTS($key);\n\
  ```\n\n`Line 13` 开始我们的 `STORE` 子程序。\n\n| | 备注 | 请记住，当哈希（hash）绑定到一个类时，必须创建某些子程序，以便\
  \ Perl 知道在访问哈希的每种可能方式下该做什么。因此，我们需要有 `TIEHASH`；`STORE`；`FETCH`；`EXISTS`；`CLEAR`；`DELETE`；`FIRSTKEY`；`NEXTKEY`\
  \ 和 `DESTROY` 方法。 |\n\n幸运的是，有人为我们完成了所有的初始工作。我们导入的 `Tie::Hash` 模块包含了这些操作的默认方法。所以，如果你想保持默认行为，就不必为它创建方法；它已经做过了。然而，由于我们的哈希直接绑定到数据库，我们需要为这些操作中的大部分创建自己的方法。\n\
  \n`Line 14` 读取传递给子程序的值。第一个值始终是它自身的引用，因此我们命名为 `$self`。接下来两个是键值对，它们将作为哈希项的键和值。\n\n\
  `Line 15` 检查 `$val` 变量并移除字符串开头可能存在的任何 `http://`。这样做是为了确保用户输入的任何链接都不会包含 `http://`。\n\
  \n`Line 16` 检查我们正在设置的值是否已经存在。`EXISTS` 方法期望接收 session 和 `$key`。如果它存在，`$exists` 变量将被设置为真值。\n\
  \n```\n17:     if($exists) {\n18:         $sql = qq{ UPDATE session \n19:      \
  \              SET \n20:               name  =‘$key’, \n21:               value\
  \ = ‘$val’ \n22:               WHERE \n23:               (user_id = ‘$main::sess’\
  \ \n24:                    AND name = ‘$key’) };\n25:     }\n```\n\n`Line 17` 开始一个\
  \ `if..else` 块。此部分检查 `$exists` 变量是否包含真值。如果是，则进入此块。\n\n`Lines 18–24` 创建更新数据库中值所需的\
  \ SQL 语句。由于值已经存在，我们不能执行 `INSERT`，必须执行 `UPDATE`。这会将 `$key` 和 `$val` 设置为新值，其中 user_id\
  \ 为 `$main::sess`，name 为 `$key`。\n\n`Line 25` 结束 `if..else` 块的这部分。\n\n```\n26: \
  \    else {\n27:         $sql = qq{INSERT INTO session \n28:                 (name,\
  \ value, user_id) \n29:             VALUES \n30:              (‘$key’, ‘$val’, ‘$main::sess’)\
  \ };\n31:     }\n```\n\n`Line 26` 是当 `$exists` 变量不包含真值时我们将将到的地方。这意味着我们尝试添加到哈希中的项尚不存在。\n\
  \n`Lines 27–30` 创建将此新值插入数据库所需的 SQL 语句。\n\n`Line 31` 结束此代码块和 `if..else` 语句。\n\n```\n\
  32:     my $sth = $dbh->prepare($sql);\n33:     $sth->execute or die $DBI::errstr;\n\
  34: }\n```\n\n`Line 32` 使用 `$dbh->prepare($sql)` 创建 `$sth`。\n\n`Line 33` 执行 `$sth->execute`\
  \ 或报错 `$DBI::errstr`。\n\n`Line 34` 结束子程序。\n\n\n\n\n\n```\n55:     my $sql = qq{\
  \ SELECT name FROM session\n56:                   WHERE user_id = ? };\n```\n\n\
  **第 55–56 行** 创建了 SQL 语句，用于从 session 表中选择所有 name 项，其中 `user_id` = *(session id)*。\n\
  \n```\n57:     my $sth = $dbh->prepare($sql);\n58:     $sth->execute($main::sess)\
  \ or die $DBI::errstr;\n59:     $self->{DATA}  = $sth->fetchall_arrayref;\n```\n\
  \n**第 57 行** 准备 SQL 语句，并将准备好的语句的引用存储在 `$sth` 变量中。\n\n**第 58 行** 执行 SQL 语句并将 `$main::sess`\
  \ 传递以填充占位符。如果在执行该语句过程中发生问题，`die` 函数将导致程序终止并显示错误消息。\n\n**第 59 行** 将 `$self->{DATA}`\
  \ 设置为调用 `$sth->fetchall_arrayref` 返回的值。`$sth->fetchall_arrayref` 返回一个包含 SQL 调用返回的所有值的数组引用。\n\
  \n```\n60:     for(@{$self->{DATA}}) {\n61:         $_ = $_->[0];\n62:         $_\
  \ = ‘’ unless defined $_;\n63:     }\n```\n\n**第 60 行** 开始一个 `for` 循环，遍历由 `$self->{DATA}`\
  \ 引用的数组中的所有元素。\n\n**第 61 行** 将当前项 `$_` 设置为当前数组元素 `[0]` 的值。\n\n**第 62 行** 如果 `$_`\
  \ 未定义，则将 `$_` 的当前值设置为空字符串。我们不能返回 `undef` 作为键，否则会得到错误。\n\n**第 63 行** 结束此 `for` 循环。\n\
  \n```\n64:     return shift @{ $self->{DATA} };\n65: }\n```\n\n**第 64 行** 返回第一个键，或者返回\
  \ `undef*.*`。\n\n**第 65 行** 结束此 `FIRSTKEY` 子程序。\n\n```\n66: sub NEXTKEY {\n67: \
  \    my ($self) = @_;\n68:     return shift @{ $self->{DATA} };\n69: }\n```\n\n\
  **第 66 行** 开始 `NEXTKEY` 子程序。这是处理绑定哈希（tied hashes）的 `each` 和 `keys` 调用后半部分的程序。\n\n\
  **第 67 行** 获取传递给子程序的值。\n\n**第 68 行** 返回与 `FIRSTKEY` 子程序中返回相同的内容。不过 Perl 知道如何处理此操作并获取哈希的下一个键。\n\
  \n**第 69 行** 结束 `NEXTKEY` 子程序。\n\n```\n70: sub FETCH {\n71:     my ($self, $key)\
  \ = @_;\n```\n\n**第 70 行** 开始 `FETCH` 子程序。当有人尝试从绑定哈希中获取值时，会调用此子程序，如下：\n\n```\nmy\
  \ $foo = $item{first_name};\n```\n\n这被视为获取 `%item` 哈希中键为 `first_name` 的值。结果是调用了\
  \ `FETCH` 子程序。\n\n**第 71 行** 获取传递给子程序的值。\n\n```\n72:     my $sql = qq{ SELECT value\
  \ FROM session\n73:                   WHERE user_id = ? AND\n74:               \
  \    name = ?};\n```\n\n**第 72–74 行** 创建了从数据库中获取项所需的 SQL。这里我们需要项的名称（即键）。`user_id`\
  \ 仅仅是存储在用户浏览器 Cookie 中的 `$main::sess` 变量。\n\n```\n75:     my $sth = $dbh->prepare($sql);\n\
  76:     $sth->execute($main::sess, $key) or die $DBI::errstr;\n```\n\n**第 75 行**\
  \ 准备 SQL 并准备好的 SQL 语句的引用存储在 `$sth` 中。\n\n**第 76 行** 执行 SQL 语句并将 `$main::sess` 和\
  \ `$key` 值传递传递以填充 SQL 语句中的占位符。如果执行 SQL 语句出现问题，将调用 `die` 函数并显示错误消息。\n\n```\n77: \
  \    my $tmp = $sth->fetch;\n78:     return $tmp->[0];\n79: }\n```\n\n**第 77 行**\
  \ 创建一个名为 `$tmp` 的变量，并将其设置为调用 `$sth->fetch` 返回的值。\n\n**第 78 行** 返回 `$tmp` 元素 `[0]`\
  \ 位置的值。由于 SQL 语句正在查找特定项并使用主键（`user_id`）查找值，因此返回的值永远不会超过一个。这就是为什么我们可以依赖使用元素 `[0]`——如果存在该项，它将位于该元素；如果没有，则\
  \ `$tmp->[0]` 的值为 `undef`，这正是当你尝试调用 `$something{\"stuff\"}` 但该哈希中没有相应条目时得到的结果。\n\
  \n**第 79 行** 结束 `FETCH` 子程序。\n\n```\n80: sub DESTROY {\n81:     $dbh->disconnect();\n\
  82: }\n```\n\n**第 80 行** 开始 `DESTROY` 子程序。当绑定哈希对象不再被使用且 Perl 进行垃圾回收时，会调用此子程序。\n\n\
  **第 81 行** 断开数据库连接。\n\n**第 82 行** 结束 `DESTROY` 子程序。\n\n这就是与绑定哈希相关的最后一个子程序。\n\n\n\
  \n\n\n```\n111: sub Print_Page {\n112:     my $tdir = shift;\n113:     my $tmpl\
  \ = shift;\n114:     my $item = shift;\n```\n\n`Line 111` 开始了 `Print_Page` 子程序。该程序负责替换动态变量并打印\
  \ HTML。\n\n`Lines 112–114` 移入传递给子程序的值。这些值与传递给 `Wrap_Page` 子程序的值相同。\n\n```\n115:\
  \     local $^W = 0;\n116:     open(TMPL, \"$tdir/$tmpl\") \n             or die(\"\
  ERROR: $!\\nAborting\");\n117:         while(<TMPL>) {\n118:             s/%%(.*?)%%/$item->{$1}/g;\n\
  119:             print;\n120:         }\n121:     close(TMPL);\n```\n\n`Line 115`\
  \ 关闭此代码块的警告。关闭警告将抑制可能在我们尝试替换一个项目 `%%foo%%` 但不存在 `$item->{\"foo\"}` 时产生的未定义警告消息。\n\
  \n`Line 116` 打开模板文件并将文件句柄存储在 `TMPL` 中。\n\n`Line 117` 逐行遍历文件句柄。\n\n`Line 118` 将模板中的\
  \ `%%varname%%` 字符串替换为相应的值。括号捕获了两个 `%%` 符号之间的变量名，并将其存储在 `$1` 中。然后，在替换的右侧调用 `$item->{$1}`，以获取\
  \ `$item` 哈哈希表中该键的值。因此，\"In %%city%%, I bet it’s hot!\" 会查找 `$item->{‘city’}`，并生成\
  \ \"In Springfield, I bet it’s hot!\"。如果 `$item` 哈希表中没有 \"city\" 条目，则会插值一个空字符串，如\
  \ \"In , I bet it’s hot!\"。`Line 119` 打印当前行。\n\n`Line 120` 关闭从 `line 117` 开始的 `while`\
  \ 循环。\n\n`Line 121` 关闭 `TMPL` 文件句柄。\n\n```\n122:     return;\n123: }\n124: 1;\n\
  ```\n\n`Line 122` 从子程序返回。\n\n`Line 123` 关闭此子程序。\n\n`Line 124` 是必要的，因为所有模块都必须返回一个真值以指示其已正确加载——这里返回了\
  \ `1`，满足了该要求。\n\n|  |  |\n|  |  |\n| ![Team LiB](img/#_back.htm) | ![Previous Section](img/#LiB0440_split_000.htm)\
