  \ |\n\n## 创建电话号码查询程序\n\n将信息存入数据库是一好事，但数据库的目的是让数据易于获取。下一个程序是 Perl 擅长的排序。该程序旨在快速查找电话号码。它从命令行运行，也可以通过宏运行。它看起来如下：\n\
  \n```\n$ phone\nphone: 请提供一个名字！\n用法:      ./phone name\n示例:    ./phone Smith \n\
  $ phone chris\nChris Chalmers (Chris)\n        home: (555) 232-5676\n        mobile:\
  \ 7746 654-2323\n$\n```\n\n这里是代码：\n\n```\n01: #!/usr/bin/perl –w\n02: # \n03: #\
  \ program 14-2, Chapter 14, Listing 2\n04: #\n\n05: use DBI;\n06: use strict;\n\
  ```\n\n**第 1–6 行** 按照通常方式开始：警告、严格模式和 `DBI` 模块。\n\n```\n07: # 检查用户是否提供了搜索词\n08: my\
  \ $name = shift(@ARGV);\n09: unless ($name) {\n10:     die \"$0: 请提供一个名字!\n11: 用法:\
  \      $0 name\n12: 示例:    $0 Smith\\n\";\n13: }\n```\n\n**第 7 行**仅仅是一个注释。\n\n**第\
  \ 8 行** 使用 `shift` 函数从 `@ARGV` 数组获取获取值。`@ARGV` 数组由用户在命令行传递的值填充。\n\n**第 9 行** 检查\
  \ `$name` 是否包含数据。如果没有，则进入此代码块。\n\n**第 10–12 行** 使用 `die` 函数向用户打印消息和程序用法说明。这会导致程序在此停止，因为如果没有数据供搜索，它无法继续。\n\
  \n**第 13 行** 结束了从 **第 9 行** 开始的 `unless` 块。\n\n```\n14: # 连接到 DBMS 并获取数据库句柄\n15:\
  \ my $dsn = ‘DBI:mysql:BibleBook’;\n16: my $connection = DBI->connect($dsn, ‘bookuser’,\
  \ ‘testpass’)\n17:     or die \"无法连接到数据库: $dsn\\n 错误: $DBI::errstr\\n 退出\";\n```\n\
  \n**第 14 行** 是一个注释。\n\n**第 15 行** 创建了一个名为 `$dsn` 的字符串，作为我们的数据源名称。\n\n**第 16 行**\
  \ 创建到数据库连接并将结果存储在 `$connection` 字符串中。\n\n**第 17 行** 调用 `die` 函数并打印错误消息，告诉用户连接数据库时出现问题。\n\
  \n这次数据源名称字符串在单独变量中，以便在错误消息中重用。一种观点认为你不应该不必要提供信息——例如你的数据库名称——但由于用户可以读取 Perl 源码查看数据库、用户名和密码，在这种情况下似乎是无害的。如果用作\
  \ CGI 程序情况就不同了。\n\n```\n18: $name =~ /(\\w+)/;\n19: $name = $connection->quote(\"\
  %$1%\");\n```\n\n**第 18 和 19 行** 对名字进行了一些简单的验证。因为我们不完全信任用户，我们只选择了第一个“单词”字符字符串；然后我们为其添加了\
  \ SQL 通配符，以便匹配不需要完全一致。`DBI quote` 函数正确地对结果字符串加引号。\n\n```\n20: # 准备语句并获取语句句柄\n21:\
  \ my $sql = <<EOS;\n22: SELECT first_name,last_name,greeting,phone_type,phone_number,note\n\
  23: FROM phone\n24: WHERE phone.id = phone.id\n25: AND first_name LIKE $name\n26:\
  \ OR last_name LIKE $name\n27: OR greeting LIKE $name\n28: EOS\n```\n\n**第 20 行**\
  \ 是一个注释。\n\n**第 21 行** 使用 `<<EOS;` 开始一个 here-document。\n\n**第 22–27 行** 定义了 `SELECT`\
  \ 语句。通过共同的 `id` 连接 `person` 和 `phone` 表并根据 `$name` 进行过滤。\n\n**第 28 行** 结束 here-document。\n\
  \n```\n29: my $query = $connection->prepare($sql)\n30:     or die \"无法准备语句: $dsn\\\
  n 错误: $DBI::errstr\\n 退出\";\n31: # 运行查询\n32: $query->execute();\n33: # 获取结果\n34:\
  \ my $current_name = '';\n35: while (my @data = $query->fetchrow_array()) {\n36:\
  \     if ($current_name ne $data[0]) {\n37:         print \"$data[0] $data[1]\\\
  n\";\n38:         $current_name = $data[0];\n39:     }\n40:     print \"\\t$data[2]\\\
  t$data[3]\\t$data[4]\\n\";\n41: }\n42: # 清理\n43: $query->finish();\n44: $connection->disconnect();\n\
  45: exit 0;\n```\n\n**第 29 行** 准备语句。\n\n**第 30 行** 如果准备失败则调用 `die`。\n\n**第 31 行**\
  \ 是注释。\n\n**第 32 行** 执行查询。\n\n**第 33 行** 是注释。\n\n**第 34 行** 初始化变量 `$current_name`。\n\
  \n**第 35 行** 开始一个 `while` 循环，只要 `fetchrow_array()` 返回数据循环就会继续。\n\n**第 36 行** 检查\
  \ `$current_name` 是否等于 `$data[0]`。如果不等于，名字发生了变化，我们需要打印新名字。\n\n**第 37 行** 打印名和姓。\n\
  \n**第 38 行** 更新 `$current_name`。\n\n**第 39 行** 结束 `if` 块。\n\n**第 40 行** 打印电话详情。\n\
  \n**第 41 行** 结束 `while` 循环。\n\n**第 42 行** 是注释。\n\n**第 43 行** 结束语句句柄。\n\n**第 44 行**\
  \ 断开数据库连接。\n\n**第 45 行** 退出程序。\n\n\n\n\n\n`Lines 8–9` 连接到数据库并获取数据库句柄。如果无法连接，我们将调用\
  \ `die` 方法并打印错误信息。\n\n```\n10: my %Fields = (\n11:     id           => {required\
  \ => 1, label => ‘ID’         },\n12:     first_name   => {required => 1, label\
  \ => ‘Forename’   },\n13:     last_name    => {required => 0, label => ‘Surname’\
  \    },\n14:     greeting     => {required => 0, label => ‘Greeting’   },\n15: \
  \    phone_type   => {required => 1, label => ‘Number Type’},\n16:     phone_number\
  \ => {required => 1, label => ‘Number’     },\n17:     note         => {required\
  \ => 0, label => ‘Note’       },\n18: );\n\n19: my @Person_prompts = qw(first_name\
  \ last_name greeting);\n20: my @Phone_prompts  = qw(phone_type phone_number note);\n\
  21: my @Phone_cols     = (‘id’, @Phone_prompts);\n22: my $Main_win;\n23: my ($pr_lst,\
  \ $ph_lst);\n```\n\n`Lines 10–21` 复用了之前之前的命令行程序中的一些全局变量代码，这使得程序易于扩展。\n\n`Line 22`\
  \ 是一个新的全局变量 `$Main_win`，它持有表示程序主窗口的对象。\n\n`Line 23` 声明了我们将要使用的几个变量。\n\n```\n24:\
  \ show_main_form();\n25: MainLoop();\n26: $Connection->disconnect();\n27: exit 0;\n\
  ```\n\n`Line 24` 调用 `show_main_form` 子程序来构建并显示程序主窗口。\n\n`Line 25` 启动 TK 的主事件循环。当用户关闭程序主窗口时，`MainLoop()`\
  \ 将结束。\n\n`Line 26` 干净地断开与数据库的连接。\n\n`Line 27` 退出程序。\n\n```\n28: sub show_main_form\
  \ {\n```\n\n`Line 28` 开始 `show_main_form` 子程序，这是程序中最大的单个子程序。它创建并显示主窗口（带有人员和电话号码的列表框以及添加按钮），并更新和删除人员及电话记录。这些按钮和列表框是程序中其余代码的切入点。\n\
  \n```\n29:     $Main_win = MainWindow->new(-title => ‘Perl/Tk PhoneBook’);\n```\n\
  \n`Line 29` 创建主窗口并赋予其标题。主窗口的引用存储在全局变量中，因为每当我们创建窗口时都需要用到它。\n\n```\n30:     my $person_frame\
  \ = $Main_win->Frame();\n31:     $pr_lst = $person_frame->Scrolled(‘Listbox’,\n\
  32:         -scrollbars => ‘oe’, -height => 10, \n33:         -selectmode => ‘browse’);\n\
  34:     my $phone_frame = $Main_win->Frame();\n35:     $ph_lst = $phone_frame->Scrolled(‘Listbox’,\n\
  36:         -scrollbars => ‘oe’, -height => 4,\n37:         -selectmode => ‘browse’);\n\
  ```\n\n`Lines 30–37` 为人员和电话号码创建框架（frames）和列表框。我们使用框架来分组并控制相关控件的布局。框架是主窗口的子级，列表框是框架的子级。Tk\
  \ 列表框默认没有滚动条。我们使用了 `Scrolled` 构造函数创建了一个带滚动条的列表框。滚动条属性 `oe` 意味着滚动条是“可选的”——仅在需要时显示——并附着在列表框的东侧（右侧）。\n\
  \n```\n38:     my $person_add_b = \n          $person_frame->Button(-text => ‘Add\
  \ Person’,\n39:         -command => sub {\n40:             show_person_form(‘Add\
  \ Person’);\n41:             fill_person_list();\n42:         }\n43:     );\n```\n\
  \n`Line 38` 创建了一个名为 `$person_add_b` 的变量，并开始了在 `$person_frame` 中创建一个“添加人员”按钮的代码。\n\
  \n`Line 39` 声明了一个匿名子程序，每当按下此按钮时就会执行。\n\n`Line 40` 是对 `show_person_form` 子程序的调用。传递给函数调用的“添加人员”文本被用作窗口标题。\n\
  \n`Line 41` 是对 `fill_person_list` 子程序的调用，用于填充人员列表框。\n\n`Line 42` 结束匿名子程序。\n\n`Line\
  \ 43` 结束 `$person_add_b` 按钮的声明。\n\n```\n44:     my $person_upd_b = \n          $person_frame->Button(-text\
  \ => ‘Update Person’,\n45:         -state => ‘disabled’,\n46:         -command =>\
  \ sub {\n47:             show_person_form(‘Update Person’, \n48:               $pr_lst->get(‘active’));\n\
  49:             fill_person_list();\n```\n\n`Line 44` 创建了一个名为 `$person_upd_b` 的变量，并开始了在\
