  \n以下是针对文本中描述部分的翻译：\n\n[content]\n# 第四部分：Perl 与通用网页编程\n\n## 本部分\n\n本部分使用了之前涵盖的许多技能来创建一些功能齐全且用的程序：\n\
  \n*   第 14 章节：创建一个电话录\n*   第 15 章节：创建一个网页版购物车\n*   第 16 章节：创建一个网页相册\n\n# 第 14 章节：创建一个电话录\n\
  \n## 概述\n\n本章节使用了之前涵盖的许多技能来创建一些功能齐全且用的程序：\n\n*   一个用于向人员和电话表中添加人员和号码的命令行程序\n*  \
  \ 一个短的电话号码查找程序\n*   一个用于人员和电话表的大型维护程序\n\n这些程序旨在易更改和扩展。在这些程序中，提示、SQL 和部分验证都依赖于数据；更改数据，程序随之改变。\n\
  \n\n\n`tags` 似乎是 Perl 代码、SQL 架构和碎片句子的杂乱混合，无法形成一个可以逻辑解析的连贯叙述或指令集。\n\n然而，根据你作为高级文档工程师的指令，我已经清理了结构，删除了冗余的导航痕迹，对变量、函数和路径应用了反引号，并对代码块进行了正确的格式化。\n\
