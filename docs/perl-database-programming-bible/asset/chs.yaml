  \ `line 56` 开始。\n\n```\n79:     while(my($k,$v) = each %bid) {\n```\n\n`Line 79`\
  \ 开始一个遍历 `%bid` 哈希的 `while` 循环。对于每个项目，当前的哈希元素和值分别存储在 `$k` 和 `$v` 中。\n\n```\n80:\
  \         if($v->{filter} eq ‘TEXT') {\n81:          push @err, $v->{error} \n82:\
  \              unless($v->{value} =~ /^[\\w \\.\\']+$/);\n83:         }\n```\n\n\
  首先，注意我们正在使用 `$v`（值）来引用这些哈希。这是因为 `%bid` 是一个嵌套哈希。对于每个键，其值也是一个哈希。\n\n`Line 80` 开始处理所有设置为\
  \ `TEXT` 过滤类型的项目。如果过滤哈希元素等于 `TEXT`，我们进入此代码块。\n\n`Line 81` 如果没有通过 `line 82` 的测试，则将\
  \ `$v->{error}` 推送到 `@err` 数组中。\n\n`Line 82` 实际上是 `line 81` 的延续。这一行检查 `$v->{value}`\
  \ 中的数据是否匹配右侧的正则表达式。\n\n\n\n\n让我们仔细观察一下这个正则表达式的具体作用：\n\n```\n/^[\\w \\.\\']+$/ breaks\
  \ down to this.\n```\n\n`^` 将此正则表达式锚定在字符串的开头。这意味着我们从字符串的最开始开始检查；任何东西不能出现在最前面。`[]`\
  \ 中的项是一个字符类。字符类意味着该字符类中的*任何*一个项都是被允许匹配的。\n\n在字符类内部，存在以下条件：\n\n*   `\\w` 是查找*单词字符*（word\
  \ characters）的简写。单词字符包括字母、数字和下划线。\n*   紧接着是一个空格；你可能看不见它，但那里确实有一个物理空格。\n*   接下来是点\
  \ `\\.`。在正则表达式中，点必须经过转义——未经过转义的点在正则表达式中会匹配*任意*字符。\n*   接下来是单引号 `\\'`。这也被转义了。\n\n\
  我们用 `]` 关闭字符类。紧跟在 `]` 之后的 `+` 字符可以匹配一次或多次。\n\n我们 true 有一个 `$`，它将此正则表达式锚定在字符串的末尾。通过在字符串开头使用\
  \ `^` 在末尾使用 `$`，我们将此正则表达式锚定在字符串的开始和结束。如果我们不对正则表达式进行锚定，只要它在字符串的*任何*位置验证了数据，就会被认为匹配成功。\n\
  \n经过这一切，它归结为：我们检查并 `TEXT` 数据类型只包含*字母*、*数字*、*下划线*、*空格*、*点*或*单引号*。\n\n`Line 83` 关闭\
  \ if 块。\n\n```\n84:         elsif($v->{filter} eq ‘CURRENCY') {\n85:         push\
  \ @err, $v->{error} \n86:             unless($v->{value} =~ /^\\$?[\\d\\.\\,]+$/);\n\
  87:         push @err, $v->{error2} \n88:             if($item{needed} > $item{amount});\n\
  89:         }\n```\n\n`Line 84` 是我们检查 `CURRENCY` 类型项的地方。\n\n`Line 85` 如果 `line 86`\
  \ 上的正则表达式没有通过，则将 `$v->{error}` 中的值推送到 `@err` 数组中。\n\n`Line 86` 检查数据是否只包含正则表达式中的数据。这个正则表达式与上一个相似。我们再次使用\
  \ `^` 和 `$` 来锚定字符串。\n\n`\\$?` 查找美元符号（我们转义了这个美元符号）。如果它存在，那是没问题的，但它*不必*非在那里。问号意味着该字符可以存在，但不必。\n\
  \n`\\d` 意味着匹配数字。此外，我们还添加了逗号并移除了单引号和空格。\n\n`Line 87` 如果满足 `line 88` 上的条件，则推送 `$v->{error2}`\
  \ 中的值。\n\n`Line 88` 检查 `$item{needed}` 中的值是否大于 `$item{amount}` 中的值。\n\n`Line 89`\
  \ 关闭了 if..elsif 代码的这部分。\n\n```\n90:         elsif($v->{filter} eq ‘PHONE') {\n91:\
  \         push @err, $v->{error} \n92:             unless($v->{value} =~ /^[\\d\
  \ \\.\\-\\(\\)]{1,20}$/);\n93:     }\n94:     }\n```\n\n`Line 90` 是我们检查 `PHONE`\
  \ 类型项的地方。\n\n`Line 91` 如果 `line 92` 返回真，则将 `$v->{error}` 中的值推送到 `@err` 数组中。\n\n\
  `Line 92` 如果正则表达式对 `$v->{value}` 中值的测试为真，则结果为真。这意味着我们正在执行一个“非”（not NOT）测试。如果值只包含正则表达式中的项，则数据没有错误，因此我们不想将错误消息推送到\
  \ `@err` 数组。\n\n这个正则表达式检查*数字*、*空格*、*点*、*连字符*和*括号*。正则表达式还将字符限制为 20 个。如果字符串包含这些以外的字符，或者为空，测试将失败，并设置错误消息。\n\
  \n`Line 93` 关闭了 if..elsif 块的这部分。\n\n`Line 94` 关闭了从 `line 79` 开始的 while 循环。\n\n```\n\
