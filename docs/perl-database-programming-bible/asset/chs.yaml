  \ |\n\n## 创建图形化报告\n\n这里处理的是电子邮件报告的最后完善：使用动态图形内容。当然，可以使用 `GD` 模块编写自定义的绘图包。`GD` 模块是连接\
  \ Thomas Boutell 的 `gd` 图形库的强大接口。但在大多数情况下，只需要一个简单的图表；在这里，`GD::Graph` 模块变得非常有用。\n\
  \n`GD::Graph` 能够生成中等复杂的图表，但基本函数的操作非常简单：只需提供一个大小相同的数组引用数组。第一个数组引用包含数据行标签，后续的包含数据（`GD::Graph`\
  \ 不支持真正的 X-Y 图表绘制）。三维绘图虽然由依赖于 `GD::Graph` 的独立模块提供，但本质上是类似的。\n\n创建图表包括以下阶段：\n\n1.\
  \ 创建图表（指定大小）。\n2. 设置图表属性（轴标签）。\n3. 填充数据；然后使用函数进行转换。\n4. 使用 `GD` 的输出到图像。\n5. 下面示例生成了一个三维柱状图。\n\
  \n\n\n\n\n`Line 31` 将 `$description[$b]` 中的当前值推送到 `@desc` 数组中。\n\n```\n32:   if\
  \ ($b < $#buckets) {\n33:     my $high = $buckets[$b+1];\n34:     push @where,\n\
  \   \"(unix_timestamp(last_used)-unix_timestamp(first_used)) <= $high\";\n```\n\n\
  `Line 32` 检查 `$b` 是否小于 `$#buckets`（`@buckets` 数组最后一个元素的索引）。\n\n`Line 33` 声明一个名为\
  \ `$high` 的变量并将 `$buckets[$b+1]` 中的值存储其中。\n\n`Line 34` 向 `@where` 数组推一个字符串。该字符串将成为\
  \ SQL 命令的一部分。\n\n```\n35:     push @desc, $description[$b+1];\n```\n\n`Line 35`\
  \ 将存储在 `$description[$b+1]` 中的值推送到 `@desc` 数组中。\n\n```\n36:   } else {\n37:    \
  \ $desc[0] .= ‘+’;\n38:   }\n```\n\n`Line 36` 关闭 if 块的第一部分，并开启一个 else 部分。\n\n`Line\
  \ 37` 在 `@desc` 数组的第一个元素后追加一个加号。\n\n`Line 38` 关闭此 if..else 块。\n\n```\n39:   my $desc\
  \ = join(‘-’, @desc);\n40:   push @{$data[0]}, $desc;\n41:   $loopdata{desc} = $desc;\n\
  42:   my $where = join(‘ AND ‘, @where);\n```\n\n`Line 39` 声明一个名为 `$desc` 的标量变量并使用\
  \ `join` 函数将 `@desc` 数组中的所有值用连字符连接起来并存储其中。\n\n`Line 40` 使用 `push` 函数将 `$desc` 字符串推送到由\
  \ `$data[0]` 用的数组中。\n\n`Line 41` 将 `$loopdata{desc}` 设置为 `$desc` 的值。\n\n`Line 42`\
  \ 声明一个名为 `$where` 的标量变量并使用 `join` 函数将 `@where` 数组中的所有值用 ‘ AND ‘ 连接起来。`$where` 变量将成为\
  \ SQL 语句中的 WHERE 子句。\n\n因此，`lines 24–42` 从 `@description` 列表中自动生成时间段描述；该时间段随后存储在第一个\
  \ `@data` 数组引用中（用于图表）和 `%loopdata` 中（用于表格）。此外，这里组合了一系列基于时间段的限制子句，然后将其拼接成可在实际 SELECT\
  \ 语句使用的格式。\n\n```\n43:   my $sql=\"SELECT COUNT(*)\n44:            FROM session\n\
  45:            WHERE first_used >\n46:             DATE_SUB(SYSDATE(),INTERVAL 7\
  \ DAY)\n47:            AND $where\";\n```\n\n`Lines 43-47` 创建从数据库获取报告所需的 SQL 语句。\n\
  \n```\n48:   my ($value) = $dbh->selectrow_array($sql);\n```\n\n`Line 48` 执行 SQL\
  \ 语句并返回数据库的第一的第一。该数据随后存储在 `$value` 变量中。\n\n```\n49:   push @{$data[1]}, $value;\n\
  50:   $loopdata{count} = $value;\n51:   push @loop, \\%loopdata;\n```\n\n`Lines\
  \ 49–51,` 在获取值后，将其存储在第二个 `@data` 数组引用和 `%loopdata` 中。后者随后追加到模板循环结构中。\n\n```\n52:\
  \ }\n53: $dbh->disconnect;\n54: $template->param(width    => $w,\n55:          \
  \        height   => $h,\n56:                  duration => \\@loop);\n```\n\n`Line\
  \ 52`  foreach 循环。\n\n`Line 53` 断开与数据库的连接。\n\n`Lines 54–56` 将一些参数发送到模板，以便填充到最终报告中。\n\
  \n```\n57: my $gd = $graph->plot(\\@data);\n```\n\n`Line 57` 绘制图表。`$gd` 现在持有一个 GD\
  \ 位图图像对象。\n\n```\n58: my $message=MIME::Lite->new(\n59:               From    =>\
  \ ‘reports@example.com’,\n60:               To      => ‘you@example.com’,\n61: \
  \              Subject => ‘Weekly report’,\n62:               Type    => ‘multipart/mixed’\n\
  63:             );\n```\n\n`Lines 58–63` 准备新消息。\n\n```\n64: $message->attach(Type\
  \ => ‘text/html’,\n65:                  Data => $template->output);\n```\n\n`Lines\
  \ 64–65` 将 HTML 文件附加到邮件消息中。\n\n```\n66: $message->attach(Type     => ‘image/png’,\n\
  67:                  Filename => ‘graph1.png’,\n68:                  Data     =>\
  \ $gd->png);\n```\n\n`Lines 66–68` 将 GD 对象转换为原始 PNG 数据（由于许可问题，GD 库不再支持 GIF）并将其添加到消息。`Filename`\
  \ 参数不是指向实际文件；而是提供了图像在接收时应保存的名称，这与模板中提供的 image-source 标签名称匹配。\n\n```\n69: $message->send;\n\
  ```\n\n`Line 69` 发送消息。\n\n此报告使用的模板与用于 HTML 报告的模板非常相似；唯一的区别是 IMG 标签，它自动插入了高度和宽度以便方便查看者。\n\
