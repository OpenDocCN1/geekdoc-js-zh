  \ |\n\n## 总结\n\n在本章中，我们涵盖了从 HTML 表单收集信息的知识。一旦获取了数据，我们要么将其存储在数据库表中，要么使用这些信息构建 SQL\
  \ 查询，在数据库中搜索匹配记录。我们还创建了一个相当强大的 Web 测验应用，它是创建非常强大的测验应用的绝佳起点。Web 应用在今天非常流行，请利用这些知识并对其进行扩展。\n\
  \n## 程序列表\n\n列表 6-1 到 6-8 包含了本章应用程序完整且不连续的代码列表。\n\n列表 6-1: Web 电话簿应用\n\n| **![Start\
