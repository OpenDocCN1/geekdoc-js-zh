  \n```\n96: Print_Page($tmpl, \"footer.tmpl\", \\%item);\n97: $dbh->disconnect;\n\
  ```\n\n**第 96 行** 页面的页脚。它调用了 `Print_Page` 函数，该函数接受三个参数：模板目录（`$tmpl`）、模板名称（`footer.tmpl`）以及数据的哈希引用，这些数据在显示时会被替换到模板中（`\\\
  %item`）。\n\n**第 97 行** 将程序与数据库的连接。\n\n`view_all.cgi` 程序到此结束。我们拍卖程序的第三个、也是最后一个 CGI\
  \ 脚本是 `view_item.cgi`。这个程序是三个程序中最复杂的。在这个程序中，我们将显示物品信息以便进行竞价。我们还将报价存储到数据库中，验证数据并查看确认页面！图\
  \ 7-3 显示了 `view_item.cgi` 页面。\n\n![点击展开](img/fg0703_0.jpg)\n\n图 7-3: view_item.cgi\
  \ 页面\n\n让我们过一遍完成所有操作所需的代码。\n\n`view_item.cgi`\n\n| **![开始示例](img/_1.gif)** |\n\n\
  ```\n01: #!/usr/bin/perl -wT\n02: # view_item.cgi\n```\n\n| **![结束示例](img/_1.gif)**\
  \ |\n\n|  |\n\n**第 1 行** 告诉系统去哪里寻找 Perl，并开启警告和污染检查（Taint checking）。\n\n**第 2 行**\
  \ 只是关于此程序的注释。\n\n```\n03: use strict;\n04: use CGI qw(:standard);\n05: use DBI;\n\
  ```\n\n**第 3 行** 加载 `strict` 模块。再次强调，在你所有的程序中使用 `strict`。\n\n**第 4 行** 加载 `CGI`\
  \ 模块及其 `:standard` 函数。\n\n**第 5 行** 加载 `DBI` 模块。我们需要这个模块以便能够连接到数据库。\n\n```\n06:\
  \ use lib qw(.);\n07: use SmallAuction;\n```\n\n**第 6 行** 将当前目录 `.` 添加到 `@INC` 数组，以便\
  \ Perl 在当前目录中查找模块。\n\n**第 7 行** 加载 `SmallAuction` 模块。该模块包含了许多我们在拍卖程序中使用的常用函数。\n\n\
  ```\n08: my %item = ();\n09: my %err = ();\n```\n\n**第 8 行** 声明了一个哈希 `%item`。\n\n\
  **第 9 行** 声明了一个哈希 `%err`。\n\n```\n10: $item{button} = param('button');\n11: $item{$_}\
  \ = param()\n12:     for name amount);\n```\n\n**第 10 行** 使用 `param` 函数获取 `'button'`\
  \ 值。\n\n**第 11-12 行** 用 `param()` 返回的值填充 `%item` 哈希。\n\n```\n13: $ENV{PATH} = '';\n\
  14: my $a_id = 1;\n15: my $tmpl = \"templates\";\n16: my $count = 0;\n```\n\n**第\
  \ 13 行** 将 `$ENV{PATH}` 设置为空字符串。\n\n**第 14 行** 将 `$a_id` 设置为 1。\n\n**第 15 行** 将\
  \ `$tmpl` 设置为 `\"templates\"`。\n\n**第 16 行** 将 `$count` 设置为 0。\n\n```\n17: my $dbh\
  \ = DBI->connect(\"dbi:mysql:auction\", \"user\", \"pass\") \n18:     or die(\"\
  Error! $!\");\n```\n\n**第 17 行** 使用 `DBI->connect` 连接数据库。\n\n**第 18 行** 如果连接失败，则\
  \ `die` 并输出错误信息。\n\n```\n19: @money = qw(min_incr amount);\n```\n\n**第 19 行** 声明了一个数组\
  \ `@money`。\n\n```\n20: @item{name item_id min_incr amount} = Get_Details($dbh,\
  \ $item);\n```\n\n**第 20 行** 用 `Get_Details` 返回的值填充 `%item` 哈希。\n\n```\n21: if($item{hi_bid}\
  \ > 0) {\n22:     $item{needed} = $item{hi_bid} + $item{min_incr};\n23: }\n```\n\
  \n**第 21 行** 检查 `$item{hi_bid}` 是否大于 0。\n\n**第 22 行** 将 `$item{hi_bid}` 和 `$item{min_incr}`\
  \ 相加并将结果存入 `$item{needed}`。\n\n```\n24: else {\n25:     $item{needed} = $item{min_bid};\n\
  26: }\n```\n\n**第 24 行** 开始了 `else` 块。\n\n**第 25 行** 将 `$item{needed}` 设置为 `$item{min_bid}`\
  \ 的值。\n\n```\n27: for my $val (@money) {\n28:     $item{$val} = sprintf(\"%0.2f\"\
  , $item{$val});\n29: }\n```\n\n**第 27 行** 开始一个遍历 `@money` 数组的 `for` 循环。\n\n**第 28\
  \ 行** 使用 `sprintf` 格式化 `$item{$val}` 中的值。\n\n**第 29 行** 关闭 for 循环。\n\n\n\n\n\n```\n\
  30: print header;\n31: my $auction_name  = Page_Header($dbh, $tmpl, $a_id);\n32:\
  \ my $empty_form    = 1;\n33: $item{item_list}  = Drop_Down_Item_List($dbh, $a_id,\
  \ \"name\");\n```\n\n`Line 30` 打印由 CGI 的 `header` 函数返回的值。\n\n`Line 31` 声明了一个名为 `$auction_name`\
  \ 的变量，并将其设置为调用 `Page_Header` 函数返回的值。`Page_Header` 接收了三个变量——数据库句柄 (`$dbh`)、模板所在的目录\
