  \ |\n\n## 从命令行创建电话簿\n\n有时在涉及用户界面细节之前，使用命令行程序进行原型设计是有用的。该程序提供了一种添加记录的方法。它循环提示输入人员信息。对于每个人，它都会循环提示输入电话数据。当必填字段未输入数据时，循环将结束。\n\
  \n以下是代码。\n\n```\n01: #!/usr/bin/perl -w\n02: #\n03: # program 14-1, Chapter 14,\
  \ Listing 1\n04: #\n\n05: use DBI;\n06: use strict;\n07: my $Connection = DBI->connect\n\
  \    ('DBI:mysql:test','bookuser','testpass')\n08     or die \"Can’t connect to\
  \ database\\nError: $DBI::errstr\\nExiting\";\n```\n\n`Lines 1–8` 以通常的方式启动程序，加载\
  \ `DBI` 模块并启用警告和 `strict` 范言。然后它们获取数据库连接或带有信息性错误消息退出。\n\n```perl\n09: my $Query_statement\
  \ = undef;\n10: my $Person_insert_statement = undef;\n11: my $Phone_insert_statement\
  \ = undef;\n```\n\n`Lines 9–11` 定义了用于存储语句句的全局变量。你稍后会看到它们是全局的。\n\n```\n12: my %Fields\
  \ = (\n13:     id           => {required => 1, label => 'ID'         },\n14:   \
  \  first_name   => {required => 1, label => 'First Name'   },\n15:     last_name\
  \    => {required => 0, label => 'Last Name'    },\n16:     greeting   => {required\
  \ => 0, label => 'Greeting'   },\n17:     phone_type   => {required => 1, label\
  \ => 'Number Type'   },\n18:     phone_number => {required => 1, label => 'Number\
  \ Type'   },\n19:     note         => {required => 0, label => 'Greeting'   },\n\
  20: );\n```\n\n`Lines 12–20` 定义了一个用于存储数据的哈希。除了键之外，它还显示了字段是否为必填的。\n\n\n\n\n`Line\
  \ 49` 如果由于未知原因 `add_person` 未能将人员添加到数据库表中，则将返回 `undef`。\n\n`Line 50` 结束了从 `line\
  \ 47` 开始的 `unless` 块。\n\n```perl\n51:     return %person;\n52: }\n```\n\n`Line 51`\
  \ 将经过验证的输入返回给主程序。\n\n`Line 52` 结束了 `input_person` 子程序的执行。\n\n```perl\n53: sub get_person_id\
  \ {\n54:     my %person = @_;\n55:     my $person_query_sql = qq(SELECT * FROM person\
  \ \n56:        WHERE first_name = ? AND last_name = ?);\n```\n\n`Lines 53` 开始了 `get_person_id`\
  \ 子程序的定义。`get_person_id` 子程序在数据库中查找与传入名称匹配的行。如果找到，则返回 ID；如果没有找到则返回 `undef`。\n\n\
  `Line 54` 创建参数的本地副本，并将其存储到 `%person` 哈希中。\n\n`Lines 55 and 56` 创建了 SQL 查询字符串。该查询包含两个占位符，用于存放我们要查找的值。\n\
  \n```perl\n57:     $Query_statement ||= $Connection->prepare( $person_query_sql\
  \ )\n58:         or die \"Can’t prepare query\\nError: $DBI::errstr\\nExiting\"\
  ;\n```\n\n`Lines 57 and 58` 准备 SQL 语句并获取语句句柄，但只执行一次。当第一次调用子程序时，全局变量 `$Query_statement`\
  \ 是未定义的，因此或等号赋值运算符会执行 `prepare()` 方法并存储结果。一旦 `$Query_statement` 有了值，`prepare()`\
  \ 就不会重复执行。我们只需要准备一次语句，因为我们使用了占位符。每次执行此 SQL 语句时，我们都可以传递不同的值，占位符会在 SQL 中动态变化。\n\n\
  我们本可以在主程序中准备该语句，但 `SELECT` 语句距离它的使用地方太远了。将 SQL 保持在需要的地方是方便的，至少这样你才不会忘记它使用了哪些列和参数。\n\
  \n```perl\n59:     if ($Query_statement->execute($person{first_name},$person{last_name})){\n\
  60:         my $href = $Query_statement->fetchrow_hashref();\n61:         return\
  \ undef unless $href;\n62:         return $href->{id};\n63:     }\n```\n\n`Line\
  \ 59` 执行查询并传入我们从用户处获取的名称。\n\n`Line 60` 获取包含第一个匹配人员的“列:值”对的哈希引用。（进一步的改进方法是处理多个匹配项。）\n\
  \n`Line 61` 如果引用 `$href` 为 `undef`（即没有匹配的记录），则返回 `undef`。\n\n`Line 62` 返回 ID，我们一定找到了匹配项。\n\
  \n`Line 63` 结束了从 `line 59` 开始的 `if` 语句。\n\n```perl\n64:     else {\n65:        \
  \ warn \"Can’t execute query\\nError: $DBI::errstr\";\n66:         return;\n67:\
  \     }\n68: }\n```\n\n`Line 64` 开始了一个 `else` 块。如果由于某种原因 `line 59` 上的 `execute()`\
  \ 失败，将进入此块。\n\n`Line 65` 打印错误信息，告知用户出现的问题。\n\n`Line 66` 不向程序返回任何内容。\n\n`Line 67`\
  \ 结束了从 `line 59` 开始的 `if..else` 块。\n\n`Line 68` 结束了 `get_person_id` 子程序。\n\n`add_person`\
  \ 子程序向人员表添加一行，并返回人员 ID；如果 `INSERT` 失败，则返回 `undef`。\n\n```perl\n69: sub add_person\
  \ {\n70:     my %person = @_;\n71:     my $person_insert_sql = ‘INSERT INTO person(‘\n\
  72:         . join(‘,’, @Person_prompts) . ‘) VALUES(\n73:         . join(‘,’, map\
  \ {‘?’} @Person_prompts) . ‘)’;\n```\n\n`Line 69` 开始了 `add_person` 子程序的定义。`add_person`\
  \ 子程序向人员表添加一行，并返回人员 ID；如果 `INSERT` 失败，则返回 `undef`。\n\n`Line 70` 创建参数的私有副本，并将其存储到\
  \ `%person` 哈希中。\n\n`Lines 71–73` 定义了我们将使用的 `INSERT` 语句。它没有硬编码列名，而是使用了程序开头定义的列表。我们使用同一个列表通过\
  \ `map` 来生成占位符。\n\n```perl\n74:     $Person_insert_statement ||= $Connection->prepare($person_insert_sql)\n\
  75:         or die \"Can’t prepare insert: $DBI::errstr\";\n```\n\n`Line 74` 准备\
  \ SQL 语句并将结果存储在全局变量 `$Person_insert_statement` 中。\n\n`Line 75` 是 `line 74` 的延续，这里的错误是致命的，因此我们调用了\
  \ `die()` 方法并告知用户。\n\n```perl\n76:     unless ($Person_insert_statement->execute(@person{@Person_prompts}))\
  \ {\n77:         warn \"Can’t execute query\\nError: $DBI::errstr\";\n78:      \
  \   return;\n79:     }\n```\n\n`Lines 76` 使用 `unless` 语句包裹 `execute()`，以便我们知道 SQL\
  \ 语句是否执行。`line 76` 上的 `execute()` 方法通过 `@person{@Person_prompts}` 访问参数，这些参数对应于 SQL\
  \ 语句中的占位符。`Line 77` 如果 `line 76` 上的 `execute()` 失败，打印警告。\n\n`Line 78` 返回 `undef`。\n\
  \n`Line 79` 结束了从 `line 76` 开始的 `unless` 块。\n\n`Line 80` 是注释。\n\n`Line 81` 使用特定的属性来获取值。不同的\
  \ DBMS 以不同的方式实现这一点。例如，PostgreSQL 使用 `nextval()` 和 `currval()`。你可以创建一个生成器并使用如下 SQL：\n\
  \n```\nINSERT INTO person(id,first_name) VALUES(nextval('person_id'),?)\n```\n\n\
  存储来自生成器的值。\n\n`input_phone` 子程序与 `input_person` 相似，但更简单，因为它不检查记录是否存在。\n\n```perl\n\
  83: sub input_phone {\n84:     my %phone;\n\n85:     print \"Enter phone details,\
  \ (Fields marked with * are required)\\n\";\n86:     foreach my $col ( @Phone_prompts\
  \ ) {\n87:         my $req = $Fields{$col}{‘required’} ? ‘*’ : '';\n88:        \
  \ print \"$Fields{$col}{‘label’}$req:\\t\";\n89:         my $line = <STDIN>;\n90:\
  \         return unless defined $line;\n91:         chomp( $line );\n92:       \
  \  if ( $Fields{$col}{‘required’} and $line !~ /\\S+/ {\n93:             warn \"\
  Required field missing, please re-enter\\n\";\n94:             return;\n95:    \
  \     }\n96:         $phone{$col} = $line;\n97:     }\n98:     return %phone;\n\
  99: }\n```\n\n`Lines 83–99` 与 `Lines 32–46` 相同，只是数据存储在 `%phone` 哈希中，并且使用 `@Phone_prompts`\
  \ 列表进行提示。\n\n```perl\n100: sub add_phone {\n101:     my %phone = @_;\n102:     my\
  \ $phone_insert_sql = ‘INSERT INTO phone(‘\n103:         . join(‘,’, @Phone_cols)\
  \ . ‘) VALUES(‘\n104:         . join(‘,’, map {‘?’} @Phone_cols) . ‘)’;\n\n105:\
  \     $Person_insert_statement ||= $Connection->prepare($phone_insert_sql)\n106:\
  \         or die \"Can’t prepare insert\\nError: $DBI::errstr\\nExiting\";\n\n107:\
  \     $Person_insert_statement->execute(@phone{@Phone_cols})\n108:         or warn\
  \ \"Can’t execute insert\\nError: $DBI::errstr\";\n109: }\n```\n\n`Lines 100–109`\
  \ 是 `add_phone` 子程序。`add_phone` 子程序对应于 `add_person`，只是它使用了 `@Phone_cols` 数组作为列列表。\n\
  \n与 `add_person` 的不同点是可能会重复记录。phone 表的主键是 `id+phone_type`，因此如果用户输入了已存在的 `phone_type`\
  \ 值，`execute()` 将失败。\n\n当程序运行时，看起来如下所示：\n\n\n\n\n\n```\n输入人员详情（标记为 * 的字段为必填）\n退出程序请按\
  \ `CTRL-D`。\n名*：      `Harry`\n姓：        `Hotspur`\n称呼：       Sir\n输入电话详情（标记为 *\
  \ 的字段为必填）\n号码类型*:   work\n号码*:        020s 555 1515\n备注：\n输入电话详情（标记为 * 的字段为必填）\n\
  号码类型*：\n缺失必填字段，请重新输入\n输入人员详情（标记为 * 的字段为必填）\n名*：\n缺失必填字段，请重新输入\n```\n\n搞定！程序应该很容易修改以允许更多列；只需更改\
  \ `%Fields` 哈希表和存储列名称的数组即可。你可以进行几处更改：\n\n*   允许在不丢失现有输入的情况下重新输入必填字段。\n*   在添加电话号码之前检查电话表中的重复键，或者允许用户在出现错误后编辑值。\n\
