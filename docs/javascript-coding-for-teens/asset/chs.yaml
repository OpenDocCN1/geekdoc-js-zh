  \n  如果钞票等于 5 美元，退出循环\n  打印钞票\n}\n```\n\n在实际代码中，它看起来像这样。\n\n```javascript\nvar bills\
  \ = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index < bills.length; index++) {\n\
  \  // 如果金额是 5 美元\n  if (bills[index] === 5) {\n    // 完全退出循环\n    break;\n  }\n\
  \  console.log(bills[index]);\n}\n```\n\n![](img/image00283.jpeg)\n\n太棒了！完全正如预期。一旦代码看到\
  \ 5，循环就会停止。\n\n## 实践中的循环\n\n到目前为止，你一直都在确保自己理解如何遍历数组中的所有金额。现在是解决原始提示了：计算你钱包中的总金额！\n\
  \n### 黑客贴士\n\n如果你的电脑在运行 JavaScript 文件时变慢了，请强制退出。循环正在无休地运行，因为它从未遇到终止条件。键盘快捷键 `ctrl\
  \ + z` 将强制停止操作。最坏的情况下，关闭 VS Code。\n\n### 循环\n\n回到你之前的代码，内部没有任何行为。但循环已经准备好遍历钞票数组了。\n\
  \n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var i = 0; i < bills.length;\
  \ i++) {\n\n}\n```\n\n变量 `index` 被缩短为 `i`。这是在循环中跟踪索引的常用变量名。\n\n为了跟踪金额，需要一个变量。该值将从\
  \ 0 开始，因为你的循环还没有计算任何钱。\n\n```javascript\nvar total = 0;\n```\n\n这种变量通常被称为累加器（accumulator）。在我们的循环的每次迭代后，它的值会逐渐增加。在访问每张钞票后，它会“累积”值。\n\
  \n将这一切整合在一起，按索引的每个钞票值都会增加累加器 `total` 的值。\n\n```javascript\nvar bills = [1, 1, 5,\
  \ 10, 20];\nvar total = 0;\n\nfor (var i = 0; i < bills.length; i++) {\n  var currentValue\
  \ = bills[i];\n  total += currentValue;\n}\n\nconsole.log(total);\n```\n\n为了确保你完全理解了发生了什么，让我们创建另一个表格来代表每次迭代。\n\
  \n| 迭代 | I | 条件 | 当前值 | 总计 | 钞票 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
  | 1 | 0 | 0 < 5 | 1 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | 2 | [1, 1,\
  \ 5, 10, 20] |\n| 3 | 2 | 2 < 5 | 5 | 7 | [1, 1, 5, 10, 20] |\n| 4 | 3 | 3 < 5 |\
  \ 10 | 17 | [1, 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 10 | 27 | [1, 1, 5, 10, 20] |\n\
  \n\n\n\n\n`console.log` 在使用后会被销毁吗？绝对不会！函数可以根据需要使用任意次，或者不使用。通常，当程序员看到两种相同的操作时，他们会想出策略来减少重复编写的代码量。函数就是为此的首选策略。\n\
  \n## 抽象 (ABSTRACTION)\n\n如果剥开 `console.log` 的外壳并能够看到它的实现方式，你会看到极其复杂的内容。`console.log`\
  \ 是一个极佳的抽象。它通过简单的命令执行了复杂的运算。一些程序员付出了巨大的努力才让 `console.log` 让世界能够轻松地使用它。\n\n## 解决巨大挑战\n\
  \n主流程序复杂得令人望畏。人类的大脑无法在脑中想出复杂问题的整个解决方案。相反，你的大脑会将大挑战分解成许多较小的挑战。你一个一个解决每个小挑战并将其封装。然后，你组合所有这些小解决方案来解决眼下的问题。函数非常适合这一点。\n\
  \n## 函数创建 (Function Creation)\n\n声明函数有两种方法。这两种方法相似，你不必担心它们之间的细微差别。但作为一名 JavaScript\
  \ 程序员，你会根据情况使用这两种方法。\n\n### 函数声明 (FUNCTION DECLARATION)\n\n第一种语法是使用 `function` 关键字并在后面加上名称。分号是可选的。这种声明风格几乎会被专门使用。\n\
  \n```javascript\nfunction functionNameOfYourChoosing() {\n\n// 在此处编写代码\n\n}\n```\n\
  \n### 函数表达式 (FUNCTION EXPRESSION)\n\n第二种语法是将 `function` 关键字赋值给一个变量，使用 `var` 进行声明。建议加上分号。这种声明风格仅在进行面向对象编程时才会使用。\n\
  \n```javascript\nvar functionNameOfYourChoosing = function () {\n\n// 在此处编写代码\n\
  };\n```\n\n## 函数调用 (Function Invocation)\n\n函数名末尾的括号运行其内部的操作。正式术语是“调用”（invoke）。这种语法对于两种类型的函数声明都是完全相同的。\n\
  \n```javascript\nfunctionNameOfYourChoosing();\n```\n\n## Return 语句 (Return Statement)\n\
  \n在原生情况下，函数不会向外部世界暴露它所计算出来的数据。\n\n```javascript\nfunction add() {\n  var computed\
  \ = 5 + 5;\n}\n\nadd(); // undefined\n```\n\n这是因为你没有告诉 JavaScript 你想要它！使用 `return`\
  \ 关键字，函数可以暴露一段数据。\n\n```javascript\nfunction add() {\n  var computed = 5 + 5\n \
  \ return computed\n}\n\nadd(); // 10\n```\n\n## 函数参数 (Function Parameters)\n\n在在上的示例中，`add`\
  \ 函数只能将 5 和 5 相加。如果可以接收任意两个数字并将它们相加难道不是更好吗？这就是参数发挥作用的地方。\n\n参数是预先准备好的变量。这让函数能够适应许多情况。\n\
  \n```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n```\n\n你已经告诉\
  \ JavaScript 在调用期间可以传入两个变量 `num1` 和 `num2`。有了参数，这个 `add` 函数就可以处理任何数字。\n\n```javascript\n\
  add(10, 5); // 15\nadd(20, 30); // 50\n```\n\n## 使用 Return 提前终止 (Early Termination\
  \ with Return)\n\n`return` 关键字实际上有两个作用：\n\n1. 它从函数输出一个值。\n2. 它停止函数的执行。\n\n你可能会发现自己不想在某个一点之后继续执行代码，或者想做一个决定并停止所有后续操作。\n\
  \n### 极客提示 (HACKER HINT)\n\n当你看到一个重复出现但值不同的算法时，考虑将该操作转换为带有参数的函数。\n\n### 防止加法受类型转换影响\
  \ (PROTECT ADD FROM TYPE COERCION)\n\n让我们改进你的 `add` 函数，并使其免受错误输入的影响。还记得类型转换和 `plus`\
  \ 运算符吗？\n\n```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n\
  \nadd('10', '5'); // '105'\nadd(20, '30'); // '2030'\n```\n\n你的加法函数可以拼接字符串。但你总是想要相加，或者至少尝试这样做。让我们用提前返回来保护它。如果使用的数据不是数字，函数应该返回\
  \ `NaN`。\n\n```javascript\nfunction add(num1, num2) {\n  // 如果 num1 不是数字 或者 num2\
  \ 不是数字\n  if (typeof num1 !== 'number' || typeof num2 !== 'number') {\n    return\
  \ NaN;\n  }\n  return num1 + num2;\n}\n\nadd('10', 5); // 'NaN'\nadd(20, '30');\
  \ // 'NaN'\n```\n\n通过提前返回，你保护了函数免受类型转换或其他任何错误输入的影响。\n\n## 作用域 (Scope)\n\n现在是讨论使用函数时变量可用性的好时机。在编码术语中，变量的可用性被称为“作用域”（scope）。此后将大量编写函数。理解你需要的特定数据是否在代码的特定区域可用是非常。\n\
  \n### VAR: 函数作用域 (VAR: FUNCTION SCOPED)\n\n声明的位置现在变得了。在函数内部声明的变量仅在函数内部可用。\n\n这段代码将产生意料之外的行为。\n\
  \n```javascript\nfunction sampleFunc() {\n  var innerVariable = '我只在这个函数内部可用';\n\
  \  console.log(innerVariable);\n}\n\nfunction otherSampleFunc() {\n  console.log(innerVariable);\n\
  }\n\nsampleFunc();\notherSampleFunc();\n```\n\n运行 `otherSampleFunc()` 会报错。\n\n###\
  \ 词法作用域 (LEXICAL SCOPE)\n\n不同的编程语言在作用域方面有自己的规则。JavaScript 使用词法作用域。词法作用域是指变量在其自身及其内部作用域内可用。\n\
  \n### 嵌套 (Functions Inside Functions)\n\n函数写在函数内部！这创建了两个层的作用域。一个是内部作用域，另一个是外部作用域。在外部作用域声明的变量在任何内部作用域内都可用。\n\
  \n```javascript\nfunction outerScope() {\n  var outerVar = '我在两个作用域中都存在';\n  function\
  \ innerFunc() {\n    console.log(outerVar);\n  }\n  innerFunc();\n}\n\nouterScope();\n\
  ```\n\n但内部作用域在上方无效。\n\n```javascript\nfunction outerScope() {\n  function innerFunc()\
  \ {\n    var innerVar = '我只在这里内部';\n  }\n  console.log(innerVar); // 这会失败\n  innerFunc();\n\
  }\n\nouterScope();\n```\n\n## 电竞表现 (Esports Performance)\n\n使用函数让你能够以优雅的方式解决难题。让我们在解决能力上迈上一大步！Electro\
  \ 是一支顶级电子竞技队，竞技 Undersea。在全球舞台上取得了优异的成绩。凭借丰富的阵容，他们会轮替上场和坐在场边。不参加比赛的选手被称为“板凳”选手。\n\
  \n### 选手参加比赛了吗？ (DID A PLAYER PARTICIPATE?)\n\n第一个挑战是检查选手是否参加比赛。这个函数应该处理任何可能的选手和任何比赛结果。它们必须是参数。\n\
  \n```javascript\nfunction playedInTournament(tournament, player) {\n\n}\n```\n\n\
  在此练习中，`tournament` 参数具有以下结构。它是一个对象结构，只有一个键：`players`。与键关联的值是一个选手名称数组。\n\n```javascript\n\
  {\n  players: ['smirk', 'knight', 'fly']\n}\n```\n\n现在你需要找到某个选手是否参加了比赛。对象中有一个 `players`\
  \ 键。你立即知道需要一个 `for` 循环。数组嵌套在对象中，因此必须通过其键名 `players` 来访问。\n\n\n\n\n\n```javascript\n\
  function playedInTournament(tournament, player) {\n  var players = tournament.players;\n\
  \  for (var i = 0; i < players.length; i++) {\n    var currentPlayer = players[i];\n\
  \    if (currentPlayer === player) {\n\n    }\n  }\n}\n```\n\n如果 `currentPlayer`\
  \ 是要检查的 `player`，则返回 `true`。但什么时候应该返回 `false` 呢？如果检查已经完了数组中的所有玩家，这意味着该 `player`\
  \ 根本没有被找到。在函数的最后面，返回 `false`。\n\n```javascript\n// tournament.js\nfunction playedInTournament(tournament,\
  \ player) {\n  var players = tournament.players;\n  for (var i = 0; i < players.length;\
  \ i++) {\n    var currentPlayer = players[i];\n    if (currentPlayer === player)\
  \ {\n      return true;\n    }\n  }\n  return false;\n}\n```\n\n现在是验证代码的时间。为了实现这一点，你需要使用\
  \ `console.log` 来让函数的数据显示在终端中。我将文件命名为 `tournament.js`。\n\n```javascript\nvar sampleTournament\
  \ = {\n  win: true,\n  players: ['smirk', 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament,\
  \ 'smirk'));\nconsole.log(playedInTournament(sampleTournament, 'superb'));\n```\n\
  \n![](img/image00288.jpeg)\n\n看起来不错！在 `sampleTournament` 对象中，`smirk` 参加了比赛，但 `superb`\
  \ 没有。从文件中删除那两个 `console.log` 语句和数据结构 `sampleTournament`。今后它们将不再需要了。\n\n### 黑客提示\n\
  \n为了防止混淆，可以写一个表格来跟踪每次迭代中发生的情况。\n\n### 嵌套的数据结构\n\n在随后的练习中，需要一个比赛结果列表。在每个比赛结果内部，我们还需要一个参加该比赛的玩家列表。将此数据结构添加到文件中。\n\
  \n```javascript\nvar tournaments = [\n  { win: true, players: ['smirk', 'knight',\
  \ 'fly'] },\n  { win: true, players: ['superb', 'san', 'tired'] },\n  { win: true,\
  \ players: ['smirk', 'knight', 'tired'] },\n  { win: false, players: ['san', 'superb',\
  \ 'fly'] },\n  { win: true, players: ['smirk', 'san', 'fly'] },\n  { win: false,\
  \ players: ['superb', 'knight', 'tired'] },\n];\n```\n\n### 参加的比赛次数\n\n关于玩家参与的数据在\
  \ `tournaments` 数组中。有了数据数组，显然需要一个循环。\n\n```javascript\nfunction tournamentsPlayed(tournaments,\
  \ player) {\n  var playCount = 0;\n  for (var i = 0; i < tournaments.length; i++)\
  \ {\n    var currentTournament = tournaments[i];\n  }\n  return playCount;\n}\n\
  ```\n\n这一次，你需要检查 `player` 是否参加了该 `tournament`。不仅如此，你还必须跟踪这种情况发生的次数。判断一个 `player`\
  \ 是否参加了某场比赛是一项大量工作。每个比赛条目都需要搜索内部数组。但这已经在 `playedInTournament` 中得到了解决。可以重用该函数。\n\n\
  ```javascript\nvar currentTournament = tournaments[i];\nvar playerDidPlay = playedInTournament(currentTournament,\
  \ player);\nif (playerDidPlay) {\n  playCount += 1;\n}\n```\n\n通过 `console.log`\
  \ 运行代码进行验证。\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments, 'smirk'));\n\
  console.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n![](img/image00289.jpeg)\n\
  \n看起来不错。`smirk` 和 `superb` 都参加了三场比赛。现在可以删除这些 `console.log` 语句了。\n\n### 赢得的比赛次数\n\
  \n现在，更进一步。检查特定的 `player` 参加获胜 `tournament` 的次数。为了清楚地实现这一点，你需要：\n\n1. 一个循环\n2. 一个用于跟踪获胜次数的累加变量\n\
  \n```javascript\nfunction tournamentsWon(tournaments, player) {\n  var winCount\
  \ = 0;\n  for (var i = 0; i < tournaments.length; i++) {\n    var currentTournament\
  \ = tournaments[i];\n  }\n  return winCount;\n}\n```\n\n这与 `gamesPlayed` 相比略有不同。需要满足两个条件：\n\
  \n1. `player` 参加了 `tournament`\n2. 团队获胜了\n\n幸运的是，`playedInTournament` 可以用于第一个条件。对于第二个条件，每个条目在\
  \ `win` 键中都有比赛结果。你需要确保在该特定 `player` 参加时，两个条件都为真，以便将比赛计为一次比赛胜利。在这种情况下，使用了与运算符 `&&`\
  \ 来同时断言这两个条件。\n\n```javascript\nfunction tournamentsWon(tournaments, player) {\n\
  \  var winCount = 0;\n  for (var i = 0; i < tournaments.length; i++) {\n    var\
  \ currentTournament = tournaments[i];\n    var playerDidPlay = playedInTournament(currentTournament,\
  \ player);\n    var tournamentWon = currentTournament.win;\n    if (playerDidPlay\
  \ && tournamentWon) {\n      winCount += 1;\n    }\n  }\n  return winCount;\n}\n\
  ```\n\n使用 `console.log` 验证代码。\n\n```javascript\nconsole.log(tournamentsWon(tournaments,\
  \ 'smirk'));\nconsole.log(tournamentsWon(tournaments, 'superb'));\n```\n\n![](img/image00290.jpeg)\n\
  \n看起来不错！`smirk` 似乎赢了三场比赛，`superb` 赢了一场。\n\n### 玩家胜率\n\n现在你感兴趣确定胜率。要解决这个问题，将胜利次数除以比赛次数。\n\
  \n```javascript\nfunction playerWinRate(tournaments, player) {\n  var total = tournamentsPlayed(tournaments,\
  \ player);\n  var won = tournamentsWon(tournaments, player);\n  var percentage =\
  \ (won / total) * 100;\n  return parseInt(percentage);\n}\n```\n\n```javascript\n\
  console.log(playerWinRate(tournaments, 'smirk'));\nconsole.log(playerWinRate(tournaments,\
  \ 'superb'));\n```\n\n### 谁应该参加？\n\n噢不！看起来两名玩家之间发生了纠纷。似乎 `smirk` 和 `superb` 都想参加下一场比赛，但名额只有一个。为了解决这一问题，管理层决定检查每个相应玩家的表现。我们需要使用胜率来决定谁应该参加。\n\
  \n```javascript\nfunction whoShouldPlay(tournaments, player1, player2) {\n  var\
  \ player1WinRate = playerWinRate(tournaments, player1);\n  var player2WinRate =\
  \ playerWinRate(tournaments, player2);\n  var benchedPlayer;\n  var activePlayer;\n\
  \n  if (player1WinRate > player2WinRate) {\n    activePlayer = player1;\n    benchedPlayer\
  \ = player2;\n  } else {\n    activePlayer = player2;\n    benchedPlayer = player1;\n\
  \  }\n}\n```\n\n\n\n\n\n```javascript\nconsole.log(activePlayer + ' should play\
  \ in the next tournament');\n\nconsole.log(benchedPlayer + ' should be benched');\n\
  ```\n\n`whoShouldPlay(tournaments, 'smirk', 'superb');`\n\n![](img/image00293.jpeg)\n\
  \n结果已经出来了，差异显而易见。看来 smirk 是更好的玩家，而 superb 将被下场。\n\n## 总结\n\n这个练习整合了你到为止学过的每一个 JavaScript\
