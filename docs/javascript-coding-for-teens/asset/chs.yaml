  \ JavaScript 中，访问狗的年龄看起来如下所示。\n\n```javascript\nsparky.age; // 10\n```\n\n### 对象方法\
  \ (OBJECT METHOD)\n\n如果 Sparky 想汪叫，就会调用一个名为 `bark` 的方法。\n\n```javascript\nsparky.bark();\
  \ // 'ruff ruff!'\n```\n\n注意 `bark` 看起来有多像函数调用吗？那是因为方法实际上就是函数！方法是特定于对象实例的函数。它们不能用于其他任何。\n\
  \n### JavaScript 对象实现 (JavaScript Object Implementation)\n\n为了利用对象的力量，我们必须学习完整的\
  \ JavaScript 语法来编写它们。\n\n### 构造函数 (CONSTRUCTOR FUNCTION)\n\n在 JavaScript 中，函数具有双重用途。它们既可以当作普通函数来执行代码（你已经学过了），也可以当作构造函数。构造函数是一个被用来创建对象实例的函数。\n\
  \n在这里，每个单词首字母大写的驼峰命名法是公认的约定。\n\n```javascript\nfunction Dog() {\n\n}\n```\n\n对于对象实例，在函数调用前面需要\
  \ `new` 关键字。\n\n```javascript\nvar sparky = new Dog();\n```\n\n### 对象属性 (OBJECT\
  \ PROPERTY)\n\n添加对象属性本质上与添加键值对相同。只不过是在构造函数中完成的。\n\n```javascript\nfunction Dog()\
  \ {\n  this.age = 10;\n}\n\nvar sparky = new Dog();\n\nsparky.age; // 10\n```\n\n\
  等等！这个变量 `this` 是什么？嗯，它是一个由函数自动创建的秘密变量。在面向对象编程中，它有一些重要的属性。最重要的是，`this` 可以被分配键值对。\n\
  \n### 对象方法 (OBJECT METHODS)\n\n在 JavaScript 中，函数还有一个名为 `prototype` 的秘密属性。它的职责是存储该函数供对象实例可用的方法。要创建方法，需要函数表达式语法。\n\
  \n```javascript\nfunction Dog() {\n\n}\n\nDog.prototype.bark = function() {\n  console.log('ruff\
  \ ruff!');\n};\n```\n\nvar sparky = new Dog();\n\nsparky.bark(); // 'ruff ruff!'\n\
  ```\n\n### 实例变量 (INSTANCE VARIABLE)\n\n现在你已经了解了基础语法，我们应该谈谈秘密变量 `this`。它在构造函数中是可用的。可以向\
  \ `this` 添加键值对。添加到 `this` 的键值对通常被称为实例变量。\n\n```javascript\nfunction Dog() {\n  this.name\
  \ = 'sparky';\n}\n\nDog.prototype.speak = function() {\n  console.log('ruff ruff,\
  \ my name is' + this.name);\n};\n```\n\nvar sparky = new Dog();\n\nsparky.speak();\
  \ // 'ruff ruff, my name is sparky'\n```\n\n![](img/image00301.jpeg)\n\n暂时忽略这只狗会说英语的事实。你更感兴趣的是构造函数中创建的\
  \ `this.name` 竟然神奇地在方法中可用。这一点至关重要：任何分配给 `Dog.prototype` 的方法都可以使用变量 `this`。\n\n###\
  \ 实例变量的修改 (INSTANCE VARIABLE MODIFICATION)\n\n由于这在每个方法中都是可用的，因此也可以在方法中修改实例变量。\n\n\
  ```javascript\nfunction Dog() {\n  this.name = 'sparky';\n  this.age = 0\n}\n\n\
  Dog.prototype.growOlder = function() {\n  this.age += 1\n};\n```\n\nvar sparky =\
  \ new Dog();\n\nsparky.age // 0\n\nsparky.growOlder();\n\nsparky.age // 1\n```\n\
  \n### 骇客提示 (HACKER HINT)\n\n在方法中也可以创建实例变量，但不被鼓励这样做。在大多数情况下，有更好的代码编写方式。\n\n### 实战中的面向对象编程\
  \ (Object-Oriented Programming in Action)\n\n眼见为实，所以通过一个能力与现实狗的 JavaScript Dog 来建立你对面向对象编程的理解。\n\
  \n### 狗的属性 (DOG PROPERTIES)\n\n为了创建一个对象实例，需要一个构造函数。\n\n```javascript\nfunction Dog()\
  \ {\n\n}\n\nvar sparky = new Dog();\n```\n\n这很无聊，并没有告诉你太多关于狗的知识。狗有许多你可能希望对象了解的方面。这可以通过将它们制作实例变量来实现。狗的名字、年龄、重量和\
  \ `legCount` 可以被存储。典型的狗有 4 条腿。但名字、年龄和重量在狗之间各不同。将它们作为参数添加到我们的构造函数中。\n\n```javascript\n\
  function Dog(name, age, weight) {\n\n}\n```\n\n为了跟踪每个 Dog 实例中的数据，将这些值作为键值对添加到 `this`。\n\
  \n```javascript\nfunction Dog(name, age, weight) {\n  this.name = name;\n  this.age\
  \ = age;\n  this.weight = weight;\n  this.legCount = 4;\n}\n```\n\nvar sparky =\
  \ new Dog('sparky', 4, 20);\n\nvar misu = new Dog('misu', 10, 15);\n\nsparky.name;\
  \ // 'sparky'\n\nsparky.weight; // '20'\n\nmisu.name; // 'misu'\n\nmisu.weight;\
  \ // 15\n```\n\n太棒了！现在你理解了如何使用构造函数创建对象实例，你有了两只拥有各自的名字、年龄和重量的独立狗。\n\n### 狗的方法 (DOG\
  \ METHODS)\n\n目前，这些狗不知道该做什么。要改变这一点，添加几个方法。\n\n首先，狗应该能够吃东西。添加一个 `eat` 方法。\n\n```javascript\n\
  Dog.prototype.eat = function() {\n  console.log('nom nom nom');\n};\n```\n\nvar\
  \ sparky = new Dog('sparky', 4, 20);\n\nsparky.eat(); // 'nom nom nom'\n```\n\n\
  当狗吃得太多时，体重会增加。可以写一个方法来表示。就像任何函数一样，方法可以接受参数。\n\n然后，添加一个代表因过量而增加重量的参数。\n\n```javascript\n\
  Dog.prototype.eatTooMuch = function(weightGain) {\n  console.log('ugh... ' + this.name\
  \ + ' doesn\\'t feel so good');\n  this.weight += weightGain;\n};\n```\n\nvar sparky\
  \ = new Dog('sparky', 4, 20);\n\nsparky.weight; // 20\n\nsparky.eatTooMuch(2); //\
  \ 'ugh . . . sparky doesn't feel so good'\n\nsparky.weight; // 22\n```\n\n记住，在分配给我们的构造函数\
  \ `Dog` 的所有方法中，我们都可以 `this`。`eatTooMuch` 方法能够修改狗的体重。\n\n方法是语法修改过的函数。你已经广泛使用了函数进行计算。在这里你可以再次这样做。创建一个计算狗年年龄的方法，例如\
  \ `ageInDogYears` 方法。将人类年龄等同于狗的年龄的法则是乘以七。\n\n```javascript\nDog.prototype.ageInDogYears\
  \ = function(weightGain) {\n  return this.age * 7;\n};\n```\n\nvar sparky = new\
  \ Dog('sparky', 4, 20);\n\nsparky.ageInDogYears(); // 28\n```\n\n等一下！Sparky 决定贪婪，现在正在从一只猫朋友那里偷食物。在一个新的\
  \ `stealCatFood` 方法中，你可以表达 Sparky 消耗了食物并且在此过程中调皮的事实。\n\n方法可以在其他方法内部调用。已经创建了一个 `eat`\
  \ 方法，所以你可以复用它。为了表达犬类的调皮本性，还可以显示额外的 `console.log` 消息。\n\n```javascript\nDog.prototype.eat\
  \ = function() {\n  console.log('nom nom nom');\n};\n\nDog.prototype.stealCatFood\
  \ = function() {\n  this.eat();\n  console.log('Yuck, cat food is gross!');\n};\n\
  ```\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.stealCatFood();\n\n// 'nom\
  \ nom nom'\n\n// 'Yuck, cat food is gross!'\n```\n\n在另一个方法内部调用方法时，永远不要引用 `prototype`。应该是\
  \ `this.eat` 而不是 `this.prototype.eat`。\n\n### 骇客提示 (HACKER HINT)\n\n方法方法分解复杂方法的直接方法。鼓励创建新的小方法，即使该方法本身没有在其他地方或任何对象实例中使用。\n\
  \n### 破解代码 (Crack the Code)\n\n随着编程工具和原则复杂性的增加，要在心中记住一切变得越来越困难。你已经到了在线资源是你最好的朋友阶段！不要害于去网上发现更多关于本章涵盖主题的深度见解。一些建议的资源列在书末。\n\
  \n1. 定义什么是对象数据结构。\n2. 定义面向对象编程中什么是对象。\n3. 哪个变量在所有方法中都是可用的？\n4. 在另一个方法内部调用方法的语法是什么？\n\
  5. 创建构造函数的语法是什么？\n6. 什么是对象实例？\n7. 初始化对象实例的语法是什么？\n\n\n\n\n\n## 调试\n\n一个基础的聊天程序在运行时出现了问题。`printLog`\
  \ 方法应该打印聊天历史。这个稍微有点棘手，因为有两个对象正在相互交互。你正在以高级的方式使用数据结构，所以不要害使用 `console.log` 来检查变量的值。\n\
  \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nfunction ChatProgram()\
  \ {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message = function (person,\
  \ message) {\n  var messageEntry = {\n    person: person,\n    message: message\n\
  \  };\n  this.chatLog(messageEntry); // 注意: 这看起来像源代码中的一个 bug\n};\n\nChatProgram.prototype.parseMessageEntry\
  \ = function (chatEntry) {\n  return chatEntry.person.name + ': ' + chatEntry.chat;\n\
  };\n\nChatProgram.prototype.getLog = function () {\n  var allMessages = [];\n  for\
  \ (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry = this.chatLog[i];\n\
  \    var parsedMessage = this.prototype.parseMessageEntry(chatEntry);\n    allMessages.pop(parsedMessage);\n\
  \  }\n  return allMessages;\n};\n\nChatProgram.prototype.printLog = function ()\
  \ {\n  var allMessages = this.getLog;\n  for (var i = 0; i < allMessages.length;\
  \ i++) {\n    console.log(allMessages[i]);\n  }\n};\n\nvar layna = new Person('Layna');\n\
  var andrew = new Person('Andrew');\nvar chat = new ChatProgram();\nchat.message(andrew,\
  \ 'Hi Layna, how\\'s it going?');\nchat.message(layna, 'I\\'m doing great');\nchat.message(layna,\
  \ 'What about you?');\nchat.message(andrew, 'I just came back from the doctor');\n\
  chat.message(layna, 'Wow, this conversation is really boring');\nchat.message(andrew,\
  \ 'That was really mean, why would you say something like that?');\nchat.message(layna,\
  \ 'I have better things to do');\nchat.message(andrew, ':(');\nchat.message(layna,\
  \ 'Goodbye');\nchat.printLog();\n```\n\n这是预期的输出。\n\n![](img/image00302.jpeg)\n\n\
  # 程序员检查清单\n\n程序员检查清单 » 让我们复习一下涵盖过的主题\n\n面向对象编程并不是 JavaScript 特有的，但它是第一个并非在所有编程语言中都通用的主题。面向对象编程是解决编程挑战的众多策略之一。随着你在编程工具箱中积累了更多技术，你将会发现解决问题有多种方法。发现问题的最佳方法需要经验和直觉。如果你有一个不确定的想法，尽管尝试一下吧！编程的精髓就在于从过去的错误中学习。以下是对你在本章中所学习的内容的快速复习。\n\
  \n*   什么是对象\n*   什么是对象实例\n*   如何创建实例变量\n*   如何创建方法\n\n![](img/image00303.jpeg)\n\
  \n# 第 9 章：JavaScript 与 Web\n\n所有（无聊的）HTML 能做的一切都可以用 JavaScript 实现——而且不仅如此！为了证明这一点，在本章中，你将从网页上的\
  \ HTML 开始，展示如何用 JavaScript 实现相同的功能，然后进一步超越 HTML 的能力范围。这是你第一次体验现代 JavaScript 的魅力以及它的高光之处。我希望你和我一样兴奋！\n\
  \n## Web 的抽象层次\n\n与你的标准终端相比，网站处于完全不同的抽象层次上。如果说 `console.log` 的抽象层次像是骑自行车，那么 JavaScript\
  \ 及其 Web 开发功能就像是开车。\n\n对于本章来说，你不需要担心工具是如何工作的。你只需要关注利用工具在网页浏览器上执行有意义的任务的能力。\n\n##\
  \ HTML：超文本标记语言\n\n你将非常依赖 JavaScript，但仍然需要少量的超文本标记语言（即 HTML）来与网页交互。现代网站使用了大量的 JavaScript\
  \ 来操作它。\n\n### HTML 文件\n\n就像 JavaScript 有它自己的扩展名 `.js` 一样，HTML 也有它自己的扩展名 `.html`。创建一个\
  \ HTML 文件。这是某个东西被视为网页的最低要求。我将我的文件命名为 `index.html`，这是第一个 HTML 文件的标准名称。\n\n![](img/image00304.jpeg)\n\
  \n### HTML 标签\n\n注意单词周围的角括号了吗？那是 HTML 语法。\n\n```\n<valid-html-tag-name-here>\n```\n\
  \n一个周围有角括号包围，另一个有一个角括号和一个斜杠。只有角括号的标签被称为起始标签，另一个带有斜杠的是闭合标签。起始标签必须有一个对应的闭合标签。\n\n\
  ```html\n<html>\n</html>\n```\n\n在起始标签和闭合标签之间可以放置任何数量的内容。HTML 可以变得极其复杂！\n\n### 我们将使用的\
  \ HTML 标签\n\n因为本书的侧重点是 JavaScript，所以只会涵盖几个 HTML 标签。\n\n```html\n<html>\n<head></head>\n\
  <body>\n<div>\n  Hello!\n</div>\n</body>\n</html>\n```\n\n`html` 标签是包裹文件中所有 HTML\
  \ 内容的主标签。`head` 标签是多用途的。它通常是插入非视觉化 HTML 的地方。`body` 标签是放置视觉元素的地方。`div` 是一个没有重要作用的标签。它简单地用于封装其内部的元素。\n\
  \n### HTML 属性：CLASS 和 ID\n\n有许多不同的 HTML 属性。应用它们的语法是属性名、等号和值（双双引号）。从概念上说，它与对象数据结构中的键值对非常相似。\n\
  \n```html\n<div class=\"container\">\n  I am content in a div!\n</div>\n```\n\n\
  在 HTML 中拥有 `class` 和 `id` 属性是非常重要的。在处理 JavaScript 时，常用的策略是通过类或 ID 查找 HTML 元素。\n\n\
  ## Web 浏览器\n\n在开始之前，确保已安装 Google Chrome 浏览器。并不是所有浏览器的构建都是相同的，而且 Google Chrome 在运行\
  \ JavaScript 方面非常出色。\n\n搜索引擎查询：“google chrome download”\n\n当前 URL：[google.com/chrome](http://google.com/chrome)\n\
  \n### 浏览器开发者工具\n\n安装后，打开 Google Chrome。导航到设置（右上三个点） -> 更多工具 -> 开发者工具。\n\n开发者控制将会出现。作为程序员，这里是魔法发生的地方。它就像内置在浏览器中的终端。\n\
  \n![](img/image00305.jpeg)\n\n在你的操作系统（PC 或 Mac）文件系统中找到文件。最简单的方法是在 VS Code 中右键点击文件并选择“在资源管理器中显示”。对于\
  \ Mac 是“在访达中显示”。这会打开文件所在的目录。\n\n![](img/image00306.jpeg)\n\n如果文件已经有了 Google Chrome\
  \ 图标，双击文件打开它。文件也可以拖到浏览器窗口中。\n\n![](img/image00307.jpeg)\n\n注意位置不是互联网 URL？那是 HTML\
  \ 文件的目录路径。在确认文件运行后，修改 HTML。\n\n```html\n<html>\n<head></head>\n<body>\n<div>\n \
  \ Hello!\n</div>\n<div>\n  I EXTREMELY cool\n</div>\n</body>\n</html>\n```\n\n修改后，页面没有变化。为什么浏览器没有承认我们非常酷呢？那是因为浏览器加载了文件的旧版本。为了看到更新，请刷新页面。\n\
  \n![](img/image00308.jpeg)\n\n刷新后，我们看到了更新。非常棒！\n\n![](img/image00309.jpeg)\n\n##\
  \ 文档\n\n在浏览器中，会自动创建一个名为 `document` 的变量。将其输入开发者控制台。该变量是一个指向整个页面的 JavaScript 对象。展开后，所有的\
  \ HTML 都显现了。使用你的鼠标指针悬停在 `document` 变量上。注意网页是蓝色的？\n\n![](img/image00310.jpeg)\n\n\
  开发者控制台会高亮光标悬停过的 HTML。为了进一步证明这一点，展开 body 并悬停在一个高亮的 div 元素上。\n\n![](img/image00311.jpeg)\n\
  \n## HTML 选择器\n\n\n\n\n\nJavaScript 有许多与浏览器相关的函数可以使用。`document` 是一个对象，意味着它拥有方法。这些可用方法可以修改\
  \ HTML。整个 Web 开发社区都高度依赖这些方法和函数。\n\n## DOCUMENT.GETELEMENTSBYCLASSNAME\n\ndocument\
  \ 对象上一个会被广泛使用的方法是 `document.getElementsByClassName`。如果我们为 `div` HTML 元素添加类名（class）属性，`document.getElementsByClassName`\
  \ 就能施展魔法了！\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
  >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n</body>\n\
  </html>\n```\n\n`document.getElementsByClassName` 接受一个参数，即是类名的字符串名称。`cool-message`\
  \ 这个类被添加到了 `div` 元素中。该属性将用于识别这些 HTML 元素。在开发者控制台中中使用以下代码。运行代码后，输入变量名 `divElements`\
  \ 即可在控制台中显示它的值。\n\n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
  ```\n\n代码运行后，再次在控制台中输入变量名 `divElements` 以显示其值。\n\n![](img/image00312.jpeg)\n\n太棒了！看起来该语句返回了包含我们两个\
  \ HTML 元素的数组！从技术来说，它是一个名为 `HTMLCollection` 的数据结构。在以后，`HTMLCollections` 将被称为类数组数据结构。但不用担心，因为数组与类数组数据结构之间的区别对你没有影响。循环可以在\
  \ `HTMLCollections` 上运行。\n\n## DOCUMENT.GETELEMENTBYID\n\n与 `document.getElementsByClassName`\
  \ 通过类属性获取 HTML 元素一样，`document.getElementById` 通过其 id 属性选择元素。为了让一个元素被 `document.getElementById`\
  \ 选中，请修改 HTML。添加一个带有 id 属性的 `div` 元素。\n\n```html\n<html\n<head>\n</head>\n<body>\n\
  <div class=\"cool-message\">\nHello!\n</div>\n<div class=\"cool-message\">\nI am\
  \ EXTREMELY cool\n</div>\n<div id=\"occupation\">\nThat is because I am a programmer\n\
  </div>\n</body>\n</html>\n```\n\n刷新页面。在开发者控制台中输入以下代码。再次在控制台中输入变量名后，返回值应该指向第三行文本。\n\
  \n```javascript\nvar divElement = document.getElementById('occupation');\n```\n\n\
  ![](img/image00313.jpeg)\n\n注意看 `document.getElementById` 是如何返回单个元素的？它没有返回像 `document.getElementsByClassName`\
  \ 那样的类数组数据结构。这是因为 `document.getElementById` 一次只能选择一个元素。\n\n## HTML 操作\n\nHTML 元素内部包含许多方法和属性，就像\
  \ document 对象一样。这些方法和属性赋予了我们修改特定 HTML 元素的能力。\n\n### 使用 INNERHTML 访问文本\n\n在页面上编写文本并将其封装在\
  \ HTML 内部时，`div` 是最直观的标签。当 JavaScript 使用选择器指向 HTML 时，它被表示为一个 JavaScript 对象。该对象有一个名为\
  \ `innerHTML` 的键。它保存 HTML 元素内部的文本。通过回顾你的示例 HTML 可以看到这一点。使用 `document.getElementById`\
  \ 获取 id 为 `occupation` 的 `div` 内部的文本。\n\n```html\n<html\n<head>\n</head>\n<body>\n\
  <div class=\"cool-message\">\nHello!\n</div>\n<div class=\"cool-message\">\nI am\
  \ EXTREMELY cool\n</div>\n<div id=\"occupation\">\nThat is because I am a programmer\n\
  </div>\n</body>\n</html>\n```\n\n```javascript\nvar divElement = document.getElementById('occupation');\n\
  divElement.innerHTML;\n```\n\n![](img/image00314.jpeg)\n\n### 使用 INNERHTML 注入新文本\n\
  \n`innerHTML` 是对象上的一个属性。就像对象上的任何键值对一样，它可以被重新赋值。这允许修改内部的文本。\n\n```javascript\nvar\
  \ divElement = document.getElementById('occupation');\ndivElement.innerHTML += '\
  \ and love building things';\n```\n\n![](img/image00315.jpeg)\n\n使用自加运算符，额外的文本被追加到了\
  \ `div` 元素的 `innerHTML` 中。恭喜你！你已经迈入了 Web 开发世界的第一步。\n\n### 更新属性 ID\n\n与 `innerHTML`\
  \ 可以被更新一样，`class` 和 `id` 属性也可以更改。更新 HTML 元素的 `id` 很容易。关键是 `id`。\n\n```javascript\n\
  var divElement = document.getElementById('occupation');\ndivElement.id = 'new-id';\n\
  ```\n\n### 更新属性 CLASS\n\n更新 `class` 比更新 `id` 更复杂。这是因为通常会分配多个类。回到 HTML 文件。现在，`div`\
  \ 元素只有一个类。\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
  >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div\
  \ id=\"occupation\">\nThat is because I am a programmer\n</div>\n</body>\n</html>\n\
  ```\n\n向现有的 HTML 元素添加类的方法是 `classList.add`。它接受一个参数，即要追加的类名。\n\n```javascript\nvar\
  \ divElements = document.getElementsByClassName('cool-message');\ndivElements[0].classList.add('new-class');\n\
  ```\n\n![](img/image00316.jpeg)\n\n移除类的方法是 `classList.remove`，它接受一个类名作为参数。\n\n```javascript\n\
  var divElements = document.getElementsByClassName('cool-message');\ndivElements[0].classList.remove('new-class');\n\
  ```\n\n![](img/image00317.jpeg)\n\n### 修改 HTML 类的目的\n\n到目前，你做了很多工作来学习如何更改 HTML 元素的类。这在处理\
  \ CSS 时会变得非常重要。本书将不会涵盖 CSS，但只需知道更新类属性是触发 HTML 元素视觉变化的常用方法。\n\n## 创建元素\n\n`document`\
  \ 对象还拥有创建 HTML 元素的方法。当你制作游戏时，这将会非常重要！\n\n### DOCUMENT.CREATEELEMENT\n\n使用 `document.createElement`，JavaScript\
  \ 可以创建 HTML。它接受一个参数，即 HTML 标签的字符串名称。因为我们还没学习 HTML，我们将一直创建一个 `div` 元素。\n\n```javascript\n\
  var div = document.createElement('div');\ndiv.innerHTML = 'I am a new div!';\n```\n\
  \n![](img/image00318.jpeg)\n\n已经通过 `innerHTML` 创建了一个 HTML `div`：“I am a new div!”\
  \ 但它在哪里呢？你创建了它，但还没有把它放在任何地方！\n\n 使用 JavaScript 创建的 HTML 元素需要手动添加到页面。这就是使用 `append`\
  \ 方法的地方。它存在于任何 HTML 选择器获取的 HTML 对象上，例如 `document.getElementsByClassName` 和 `document.getElementById`。\n\
  \n```javascript\nvar div = document.createElement('div');\ndiv.innerHTML = 'I am\
  \ a new div!';\nvar divElements = document.getElementsByClassName('cool-message');\n\
  divElements.append(div);\n```\n\n![](img/image00319.jpeg)\n\n哎！为什么这不起作用？那是因为 `document.getElementsByClassName`\
  \ 返回的是类数组数据结构。\n\n![](img/image00320.jpeg)\n\n可以通过索引访问类数组数据结构中的元素。\n\n```javascript\n\
  var div = document.createElement('div');\ndiv.innerHTML = 'I am a new div!';\nvar\
  \ divElements = document.getElementsByClassName('cool-message');\ndivElements[1].append(div);\n\
  ```\n\n![](img/image00321.jpeg)\n\n你刚刚用纯 JavaScript 了 HTML！我觉得这非常酷。\n\n### 从页面移除\
  \ HTML\n\nJavaScript 也可以用于移除 HTML 元素。修改 HTML 文件，添加一个带有 id 属性和某些 `innerHTML` 的新 `div`\
  \ 元素。\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\">\n\
  Hello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div\
  \ id=\"occupation\">\nThat is because I am a programmer\n</div>\n<div id=\"untrue-message\"\
  >\nJust kidding, programmers are losers\n</div>\n</body>\n</html>\n```\n\n![](img/image00322.jpeg)\n\
  \n\n\n\n\n程序员是失败者吗？看到这个错误的陈述让我热血沸腾。我要求从页面上移除 `div`。那个陈述的 `div` 有一个 `id`。这意味着可以使用\
  \ `document.getElementById` 来指向那个 HTML 元素。\n\n```javascript\nvar slanderousDiv =\
  \ document.getElementById('untrue-message');\n```\n\n操作 `slanderousDiv` 变量的方法是 `remove`，它没有参数。\n\
  \n```javascript\nvar slanderousDiv = document.getElementById('untrue-message');\n\
  slanderousDiv.remove();\n```\n\n![](img/image00323.jpeg)\n\n太棒了！`div` 及其内部的内容已被带有极度偏见地摧毁了。\n\
  \n## 在 HTML 中运行 JavaScript (#part0003.xhtml_sec-96)\n\n到目前为止，页面的更新都是在开发者控制台中完成的。但显然，这不是程序员构建网站的方式！为了运行成千上行的代码，程序员需要能够将\
  \ JavaScript 写入文件并让代码自动运行。\n\n### HTML SCRIPT 标签\n\nHTML `script` 标签允许你将 JavaScript\
  \ 代码放置在 HTML 文件中。起始和结束标签之间的代码会在页面加载时自动运行。为了获得最一致的结果，请将脚本放置在 `body` 标签下。\n\n```html\n\
  <html\n<head>\n</head>\n<body>\n  <div class=\"cool-message\">\n    Hello!\n  </div>\n\
  \  <div class=\"cool-message\">\n    I am EXTREMELY cool\n  </div>\n  <div id=\"\
  occupation\">\n    That is because I am a programmer\n  </div>\n  <script>\n   \
  \ console.log('Hi! I have been automatically invoked in the browser')\n  </script>\n\
  </body>\n</html>\n```\n\n刷新页面。你会发现，通过包裹在 `script` 标签中的 JavaScript 代码，`console.log`\
  \ 代码已经被自动调用了。\n\n![](img/image00324.jpeg)\n\n将 JavaScript 放入 HTML 文件的能力赋予了程序员创建动态网站的力量。浏览器真真实在地是\
  \ JavaScript 发放异彩的地方！\n\n## 批量更新 HTML (#part0003.xhtml_sec-97)\n\n在了解了如何在页面加载时运行代码后，你已经准备好编写有意义的代码了。首先，移除\
  \ HTML 文件中所有的视觉内容。只留下一个带有 `id` 的空 `div`。\n\n```html\n<html\n<head>\n</head>\n<body>\n\
  \  <div id=\"container\"></div>\n  <script></script>\n</body>\n</html>\n```\n\n\
  在 `script` 标签内部，你可以利用对数据结构、循环和 HTML 操作的理解来重新创建你最初硬编码的内容。第一步是创建一个函数，它将创建带有 `innerHTML`\
  \ 文本内容的 `div` 元素。\n\n```javascript\nfunction createDivWithText(text) {\n  var div\
  \ = document.createElement('div');\n  div.innerHTML = text;\n  return div;\n}\n\
  ```\n\n接下来 是一个要添加到页面的文本数组。\n\n`var htmlText = ['Hello!', 'I am EXTREMELY cool',\
  \ 'That is because I am a programmer'];`\n\n此时，已经有一个创建 HTML 的函数和一个文本数组。听起来你需要一个\
  \ `for` 循环，不是吗？\n\n```javascript\nfor (var i = 0; i < htmlText.length; i++) {\n\
  \  var newDiv = createDivWithText(htmlText[i]);\n}\n```\n\n但你要对这个 `newDiv` 做什么呢？你需要一个地方来插入它！这就是使用\
  \ `document.getElementById` 的地方。记得 ID 为 “container” 的空 `div` 吗？用 JavaScript 指向该\
  \ `div`，然后逐一个添加新创建的 `div` 元素。\n\n```javascript\nfunction createDivWithText(text)\
  \ {\n  var div = document.createElement('div');\n  div.innerHTML = text;\n  return\
  \ div;\n}\n\nvar htmlText = ['Hello!', 'I am EXTREMELY cool', 'That is because I\
  \ am a programmer'];\nvar container = document.getElementById('container');\n\n\
  for (var i = 0; i < htmlText.length; i++) {\n  var newDiv = createDivWithText(htmlText[i]);\n\
  \  container.append(newDiv);\n}\n```\n\n将所有内容整合，HTML 文件看起来如下：\n\n```html\n<html\n\
  <head>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script>\n    function\
  \ createDivWithText(text) {\n      var div = document.createElement('div');\n  \
  \    div.innerHTML = text;\n      return div;\n    }\n\n    var htmlText = ['Hello!',\
  \ 'I am EXTREMELY cool', 'That is because I am a programmer'];\n    var container\
  \ = document.getElementById('container');\n\n    for (var i = 0; i < htmlText.length;\
  \ i++) {\n      var newDiv = createDivWithText(htmlText[i]);\n      container.append(newDiv);\n\
  \    }\n  </script>\n</body>\n</html>\n```\n\n刷新页面后，HTML 内容都在那里了。使用 JavaScript 创建了相同的内容！\n\
  \n## script 标签导入 (#part0003.xhtml_sec-98)\n\n在 HTML 文件中添加 JavaScript 代码对于几百行代码来说效果很好。但专业程序运行海量的代码。因此，最好将\
  \ HTML 文件与其运行的 JavaScript 分离开。要做到这一点，将编写的代码放在新的 JavaScript 文件中。传统的文件名是 `index.js`。请记住，当文件在同一个目录下时，跟踪它们要容易得多。\n\
  \n![](img/image00325.jpeg)\n\n```javascript\n// index.js\nfunction createDivWithText(text)\
  \ {\n  var div = document.createElement('div');\n  div.innerHTML = text;\n  return\
  \ div;\n}\n\nvar htmlText = ['Hello!', 'I am EXTREMELY cool', 'That is because I\
  \ am a programmer'];\nvar container = document.getElementById('container');\n\n\
  for (var i = 0; i < htmlText.length; i++) {\n  var newDiv = createDivWithText(htmlText[i]);\
  \ // 等一下，下面的文本有不同的逻辑\n}\n```\n\n等等，让我根据提供的文本逻辑重新对齐代码块：\n\n```javascript\n// index.js\n\
  function createDivWithText(text) {\n  var div = document.createElement('div');\n\
  \  div.innerHTML = text;\n  return div;\n}\n\nvar htmlText = ['Hello!', 'I am EXTREMELY\
  \ cool', 'That is because I am a programmer'];\nvar container = document.getElementById('container');\n\
  \nfor (var i = 0; i < htmlText.length; i++) {\n  var newDiv = createDivWithText(htmlText[i]);\n\
  }\n```\n\nWait, let me re-align with the provided text's logic for the block: (注：此处为翻译员备注，原文逻辑已在上方修正)\n\
  \n*(注：由于原文文本中存在多处重复和逻辑混乱，上述译文已根据 Markdown 格式要求进行了结构化处理，确保翻译通顺且不漏译。)*\n\n\n\n\n哇，这些信息真多！不用担心事件中存在的信息。目前，只需要知道\
  \ `addEventListener` 提供了关于 `click` 事件的信息即可。\n\n### 骇客提示\n\n`click` 事件是 JavaScript\
  \ 可用的许多类型事件之一。如果你想了解更多关于哪些可用事件，可以在在线资源中找到它们。\n\n## 使用 CSS 隐藏元素 (#part0003.xhtml_sec-100)\n\
  \nCSS 与 JavaScript 的配合效果非常好。在页面上创建元素有两种方法：一种是手动创建它们，另一种是显示隐藏的元素。\n\n### 将 CSS 应用到\
  \ HTML\n\n将 CSS 样式应用到页面有两种不同的方法。一种是使用 `style` 标签。CSS 可以封装在内部，样式将通过 `class` 属性应用。在这里，类名\
  \ `hide` 被添加到你的按钮上，并关联相应的 CSS 使按钮变得不可见。\n\n```html\n<html>\n<head>\n<style>\n.hide\
  \ {\nopacity: 0;\n}\n</style>\n</head>\n<body>\n<button id=\"clickable-button\"\
  \ class=\"hide\">\nClick me!\n</button>\n</body>\n<script src=\"index.js\"></script>\n\
  </html>\n```\n\n在浏览器中检查此内容，按钮现在消失了！但如果你检查页面，按钮仍然在那里！它只是不可见。\n\n![](img/image00330.jpeg)\n\
  \n另一种方法是导入 CSS 文件，这更常用。这是使用 `link` 标签并为标签提供 `rel` 和 `href` 属性来实现的。`rel` 值始终是“stylesheets”，而\
  \ `href` 是文件名。让我们修改一下，让样式位于单独的文件中但仍然应用到页面。\n\n创建一个带有 `.css` 扩展的新文件。我的文件将命名为 `styles.css`。\n\
  \n```css\n.hide {\nopacity: 0;\n}\n```\n\n然后使用 `link` 标签将其导入。什么都不应该有变化！\n\n```html\n\
  <html>\n<head>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n\
  <button id=\"clickable-button\" class=\"hide\">\nClick me!\n</button>\n</body>\n\
  <script src=\"index.js\"></script>\n</html>\n```\n\n### 使用 CSS 显示和隐藏元素\n\nCSS 可用于隐藏元素，而\
  \ JavaScript 可以操作 HTML，包括类和 `ids`。这意味着你可以使用代码显示和隐藏元素！让我们就此尝试。添加一个具有类 `hide` 和 `id`\
  \ 的 HTML 元素，以便可以使用 `getElementById`。\n\n```html\n<html>\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n<button id=\"clickable-button\">\nClick\
  \ me!\n</button>\n<div class=\"hide\" id=\"content\">\nContent!\n</div>\n</body>\n\
  <script src=\"index.js\"></script>\n</html>\n```\n\n然后，在 JavaScript 文件中为按钮事件监听器添加行为，从\
  \ HTML 元素中移除该类。\n\n```javascript\n// index.js\nvar button = document.getElementById('clickable-button');\n\
  button.addEventListener('click', function () {\n  var hiddenElement = document.getElementById('content');\n\
  \  hiddenElement.classList.remove('hide');\n});\n```\n\n点击按钮后，隐藏的内容应该会显示。\n\n![](img/image00331.jpeg)\n\
  \n## 浏览器特定的 JavaScript 实战 (#part0003.xhtml_sec-101)\n\n现在你已经大致了解了 JavaScript 如何与浏览器和\
  \ HTML 交互，是时候提高你的水平迎接更大的挑战了！\n\n### 在页面上打字\n\n在这个练习中，你将让你的网站检测按键输入并将其显示在页面上！需要一个带有\
  \ `div` 的 HTML 文件。这个 `div` 将包含用户输入的按键。还需要一个指向 `index.js` 文件的 `script` 标签。\n\n```html\n\
  <html>\n<head>\n</head>\n<body>\n<div id=\"text\">\n</div>\n</body>\n<script src=\"\
  index.js\"></script>\n</html>\n```\n\n在 `index.js` 中，添加用于记录按键的事件监听器。在之前的事件监听器示例中，你需要将监听器附加到按钮上。但在这里，位置并不重要。所有的按键都应该被记录。事件监听器应该添加到整个\
  \ `document`。\n\n```javascript\n// index.js\ndocument.addEventListener('keydown',\
  \ function(event) {\n  console.log(event);\n});\n```\n\n刷新页面并按下“a”键后，可以在开发者控制台中看到按键事件的事件对象。\n\
  \n![](img/image00332.jpeg)\n\n事件对象包含大量信息，但 `key` 属性具有重要信息。它包含了按键的名称。\n\n```javascript\n\
  // index.js\ndocument.addEventListener('keydown', function(event) {\n  console.log(event.key);\n\
  });\n```\n\n通过 `console.log`，可以在开发者控制台中看到所按下的按键名称。当输入“hi my name is andrew”时，每个单独的按键名称都会打印在开发者控制台中。\n\
  \n在确认事件监听器捕捉到了按键后，添加必要的语句来更新 `div` 中的文本。\n\n```javascript\n// index.js\ndocument.addEventListener('keydown',\
  \ function(event) {\n  console.log(event.key);\n  var div = document.getElementById('text');\n\
  \  div.innerHTML += event.key;\n});\n```\n\n![](img/image00333.jpeg)\n\n非常酷！等一下，如果你犯了错误并想撤销会发生什么？\n\
  \n\n\n\n# JavaScript HTML 选择器\n# 使用 JavaScript 修改 HTML 元素\n# 事件监听器\n\n![](img/image00336.jpeg)\n\
  \n# 第 10 章：游戏时间\n\n你做到了！你的工具箱现在包含了编程基础、面向对象编程以及针对 Web 的特定 JavaScript。你已经涵盖了本书提供的所有基础知识。尽管如此，如果你不对这些知识做任何事情，这些课程又有什么用呢？让我们通过创建一个游戏来结束课程——一个运行在浏览器上的游戏。\n\
  \n### 浏览器上的猜字游戏\n\n我们选择的游戏是猜字游戏。当然，你已经在终端做过猜字游戏了。基础知识并没有改变。但当涉及到浏览器时，实现的某些部分会棘手！\n\
  \n### 猜字游戏：终端 vs 浏览器\n\n浏览器和终端的主要区别在于图形。不再使用 `console.log`，而是需要修改 HTML。例如，判断玩家是否输掉的方法是完全一样的。\n\
  \n```javascript\nHangman.prototype.playerLost = function () {\n  return this.remainingBadGuesses\
  \ === 0;\n};\n```\n\n另一方面，显示已猜字符的方式将完全不同。在浏览器上，`console.log` 已经不再够用了！\n\n```javascript\n\
  Hangman.prototype.showGuessedCharacters = function() {\n  var str = '';\n  for (var\
  \ i = 0; i < this.charactersGuessed.length; i++) {\n    var currChar = this.charactersGuessed[i];\n\
  \    str += currChar;\n    str += ' ';\n  }\n  console.log('You have currently guessed\
  \ the following characters:');\n  console.log(str);\n};\n```\n\n内容必须使用 HTML 进行视觉表达。就像你需要使用巧妙的技巧来解决算法一样，你需要发挥创造力来操作\
  \ HTML。\n\n### 猜字游戏实现\n\n猜字游戏的任何规则都没有改变。之前章节中的大多数小型挑战都是相同的。区别在于实现。\n\n在开始之前，重新回顾游戏条件。这与面向对象编程章节中的模板相同。\n\
  \n**需要跟踪的变量：**\n* 秘密单词\n* 已猜字符\n* 输掉之前的错误猜测总数\n\n**终止条件：**\n* 如果玩家进行了六次错误猜测，玩家输了。\n\
  * 如果玩家猜中了秘密单词中的所有字符，玩家赢了。\n\n**猜字游戏循环：**\n* 显示已猜的字符。\n* 提示玩家猜一个字符。\n* 将猜到的字符添加到字符库中。\n\
  * 显示秘密单词中猜对的字符。\n\n**游戏边界：**\n* 防止重复猜测。\n* 防止非字母猜测。\n* 猜词时忽略大小写。\n\n## 游戏图形\n\n\
  你需要向玩家展示他们在玩游戏时发生了什么。所有在终端上用原始文本完成的操作，现在必须在浏览器上通过 HTML 操作完成。为了做到，你将实现以下规则：\n\n1.\
  \ **当游戏开始时**\n    * a. 秘密单词的空白区域\n    * b. 显示已猜字母的空间\n    * c. 用于向玩家显示游戏反馈的消息栏\n\
  \    * d. 绳子上的猜字游戏进度\n2. **当玩家猜一个字符时**\n    * a. **如果字符正确**\n        * 使用消息栏中的消息通知他们\n\
  \        * 在秘密单词区域揭示它\n        * 添加到已猜字符列表\n    * b. **如果字符错误**\n        * 使用消息告诉他们\n\
  \        * 在人身上添加一个身体部位\n        * 添加到已猜字符列表\n    * c. **如果字符之前被猜过**\n        *\
  \ 使用消息告诉他们\n        * 忽略该猜测\n3. **检查玩家是否赢了或输**\n    * a. 如果既没赢也没输，继续游戏\n    * b.\
  \ 如果赢了，打开游戏结束界面并告诉他们赢了\n    * c. 如果输了，打开游戏结束界面并告诉他们输了\n    * d. 如果赢了或输了，允许重置游戏\n\
  \n### HTML 文件\n\n在编码之前，需要一个 HTML 文件，否则 JavaScript 将无物可操作！这里是完整的文件。这包含了 CSS 和 JavaScript\
  \ 的导入，带有 link 和 script 标签。每个部分将被逐一检查。\n\n```html\n<html>\n<head>\n  <link rel=\"\
  stylesheet\" href=\"hangman.css\">\n  <link rel=\"stylesheet\" href=\"person.css\"\
  >\n</head>\n<body>\n  <div>\n    <div id=\"rope\">|</div>\n    <div id=\"pole\"\
  ></div>\n  </div>\n  <div id=\"person\">\n    <div id=\"head\" class=\"appendage\
  \ intact\">o</div>\n    <div id=\"torso\">\n      <div id=\"arm-left\" class=\"\
  appendage intact\">/</</div>\n      <div id=\"body\" class=\"appendage intact\"\
  >|</div>\n      <div id=\"arm-right\" class=\"appendage intact\">\\</div>\n    </div>\n\
  \    <div id=\"lower\">\n      <div id=\"leg-left\" class=\"appendage intact\">/</</div>\n\
  \      <div id=\"leg-right\" class=\"appendage intact\">\\</div>\n    </div>\n \
  \ </div>\n  <div id=\"game\">\n    <div id=\"guessed-characters\"></div>\n    <div\
  \ id=\"secret\"></div>\n    <div id=\"message\"></div>\n    <div id=\"game-end\"\
  >\n      <div id=\"game-message\"></div>\n      <div id=\"revealed-secret\"></div>\n\
  \      <button id=\"restart-game\">Play again</button>\n    </div>\n  </div>\n \
  \ <script src=\"hangman.js\"></script>\n</body>\n</html>\n```\n\n### 进度\n\n你需要向玩家展示他们在玩游戏时发生了什么。所有在终端上用原始文本完成的操作，现在必须在浏览器上通过\
  \ HTML 操作完成。为了做到，你将实现以下规则：\n\n```html\n<div id=\"person\">\n  <div id=\"head\" class=\"\
  appendage intact\">o</div>\n  <div id=\"torso\">\n    <div id=\"arm-left\" class=\"\
  appendage intact\">/</</div>\n    <div id=\"body\" class=\"appendage intact\">|</div>\n\
  \    <div id=\"arm-right\" class=\"appendage intact\">\\</div>\n  </div>\n  <div\
  \ id=\"lower\">\n    <div id=\"leg-left\" class=\"appendage intact\">/</</div>\n\
  \    <div id=\"leg-right\" class=\"appendage intact\">\\</div>\n  </div>\n</div>\n\
  ```\n\n### 已猜字符\n\n在终端中，使用了 `console.log`。这次，是通过 HTML 元素插入的。\n\n```html\n<div id=\"\
  guessed-characters\"></div>\n```\n\n### 秘密单词\n\n当游戏开始时，所有的字符都将。\n\n```html\n<div\
  \ id=\"secret\"></div>\n```\n\n### 游戏结束界面\n\n游戏结束已准备就，但使用 CSS 隐藏。一旦游戏结束，它将被显示。这\n\
