  \ 'tired'] |\n| 4 | ANS | 9 | true | ['smirk', 'tired', 'ANS'] |\n\n\n\n\n\n如果你发现自己需要使用\
  \ `delete` 运算符，那么更有可能是你的算法应该改用数组来解决。\n\n### 更新数组中的对象 (#part0003.xhtml_sec-76)\n\n\
