  \ true;\n    }\n  }\n  return false;\n}\n\ntest('includes #1', includes('cat', 'a'),\
  \ true);\ntest('includes #2', includes('cat', 't'), true);\ntest('includes #3',\
  \ includes('cat', 'f'), false);\n```\n\n### createHint\n\n在 `else` 块中，不应该是赋值。该函数的目的是增量构建一个字符串，但使用等号会覆盖之前所有的字符串构建。它应该是加法自赋值。\n\
  \n```javascript\nfunction createHint(actualName, allUserGuesses) {\n  var output\
  \ = '';\n  for (var i = 0; i < actualName.length; i++) {\n    var currChar = actualName[i];\n\
  \    if (includes(allUserGuesses, currChar)) {\n      output += currChar;\n    }\n\
  \  }\n}\n```\n\n\n\n\n\n```javascript\noutput += currChar + ' ';\n\n} else {\n\n\
  output += '_ ';\n\n}\n\n}\n\nreturn output;\n\n}\n```\n\n```javascript\ntest('createHint\
  \ #1', createHint('charlie', 'chle'), 'c h _ _ l _ e ');\n\ntest('createHint #2',\
  \ createHint('cat', ''), '_ _ _ ');\n\ntest('createHint #3', createHint('cat', 'a'),\
  \ '_ a _ ');\n\n### 正确猜中\n\n此函数用于检查 `actualName` 中的每个字符是否存在于 `allUserGuesses` 中。如果\
  \ `currChar` 不在所有玩家猜测的字符串中，我们立即知道游戏还没有结束，可以停止循环。但逻辑应该是相反的，这需要使用非运算符。\n\n```javascript\n\
  function correctlyGuessed(actualName, allUserGuesses) {\n  for (var i = 0; i < actualName.length;\
  \ i++) {\n    var currChar = actualName[i];\n    if (!includes(allUserGuesses, currChar))\
  \ {\n      return false;\n    }\n  }\n  return true;\n}\n```\n\n```javascript\n\
  test('correctlyGuessed #1', correctlyGuessed('charlie', 'chle'), false);\n\ntest('correctlyGuessed\
  \ #2', correctlyGuessed('cat', 'tac'), true);\n\ntest('correctlyGuessed #3', correctlyGuessed('cat',\
  \ 'cat'), true);\n```\n\n### 是否多字符猜测\n\n检查一个猜测是否是多个字符应该检查长度是否不等于 1。\n\n```javascript\n\
  function isMultiCharGuess(guess) {\n  return guess.length !== 1;\n}\n```\n\n```javascript\n\
  test('isMultiCharGuess #1', isMultiCharGuess('a'), false);\n\ntest('isMultiCharGuess\
  \ #2', isMultiCharGuess('av'), true);\n\ntest('isMultiCharGuess #3', isMultiCharGuess('c'),\
  \ false);\n```\n\n# 第 7 章答案\n\n## 破解密码\n\n### 1. 运行此代码后，`players` 是一个包含‘smurf’ 和‘ANS’\
  \ 的数组吗？为什么或为什么不是？\n\n这两个名字都存在。`shift` 操作移除了数组中的第一个元素，即 'super'。\n\n### 2. 什么是可变性？哪些数据类型是可变的？\n\
  \n可变性是在不创建新版本的情况下修改某部分数据的概念。`Objects`和`arrays`是可变的。所有其他数据类型都是不可变的。\n\n### 3. 为什么字符串修改需要重新赋值，而数组和对象的修改则不需要？\n\
  \n在 JavaScript 中，`strings` 是不可变的。为了创建一个包含两个组合值的新字符串，必须使用某种赋值操作。\n\n### 4. 哪些数组方法可以减小数组的大小？\n\
  \n`shift` 和 `pop` 方法会移除数组中的元素。它们分别从前面和后面移除一个元素。\n\n### 5. 哪些数组方法可以增加数组的大小？\n\n`unshift`\
  \ 和 `push` 方法向数组中添加元素。它们分别在前面和后面添加一个元素。\n\n### 6. 为以下函数画一个表格。写出每次迭代时数组的样子以及 `array.length\
