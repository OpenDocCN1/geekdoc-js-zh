  \ // 'Layna one more time'\n```\n\n### 5. 尝试打印此字符串时发生致命运行时错误。\n```javascript\nconsole.log('Layna\\\
  's favorite hobby is being mean to Andrew');\n```\n\n\n\n\n\n`typeof` 运算符可以用于字符串、数字、`null`、`undefined`\
  \ 和布尔值。`typeof` 运算符不能用于检查数组和对象。\n\n### 3. 哪种数据类型使用 `instanceof` 运算符进行正确检查？\n\n`instanceof`\
  \ 运算符可以检查一个数据类型是否为数组。\n\n### 4. 下列代码的输出是什么？\n\nfalse，因为 `true && false` 的求值为 `false`，且右侧已经是\
  \ `false`。\n\n### 5. 下列代码的输出是什么？\n\ntrue，因为 `!false` 的求值为 `true`。右侧的求值为 `false`，但\
  \ OR 运算符（双竖线）只需要其中一侧为真即可。\n\n### 6. 为什么 `array[index] !== undefined` 是检查该索引是否存在于数组中的有效方法？\n\
  \n如果尝试访问的数组不存在该索引，输出将是 `undefined`。\n\n## DEBUGGING\n\n### 1. 代码说该数组是一个对象。\n\n`typeof`\
  \ 运算符不能用于检查某项是否为数组。必须使用 `instanceof` 运算符。\n\n```javascript\nvar item = [];\n\nif\
  \ (item instanceof Array) {\n  console.log('I am an array');\n} else {\n  console.log('I\
  \ am not an array');\n}\n```\n\n### 2. 《超级意大利兄弟 2》已经连续获得 10 多次驴子博士的“年度游戏奖”了。它绝对是一部杰作。但代码的说法并非如此。\n\
  \n在 `if` 条件判断中，值比较器是错误的。它应该是大于 `> `，而不是小于 `<`。\n\n```javascript\nvar game = 'superItalianBrosTwo';\n\
  \nif (donkeysGameScores[game] > 95) {\n  console.log(game + ' is a masterpiece');\n\
  } else {\n  console.log(game + ' is not a masterpiece');\n}\n// superItalianBrosTwo\
  \ is a masterpiece\n```\n\n### 3. 我认为分数在 30 到 80 之间的游戏都是平庸的。《最后的捍卫者》是一部平庸的游戏。但它并不是一个糟糕的游戏。提示：用纯英语写出复杂的条件会有帮助！\n\
  \n在 `else if` 条件中，`AND` 运算符的左侧是错误的。在错误版本中，该条件描述为：如果分数大于 80 且分数大于 30。它应该是：如果分数小于\
