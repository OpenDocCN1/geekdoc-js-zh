  \ textarea 没有恢复回不可编辑状态的能力，它又有什么用呢？让我们使用函数 `createUpdateButton` 添加一个更新按钮。现在，这个按钮什么都不做。添加一个事件监听器来改变。在销毁\
  \ textarea HTML 元素之前，将内部文本保存到一个变量中。\n\n```javascript\nfunction createUpdateButton()\
  \ {\n\nvar updateButton = document.createElement('div');\n\nupdateButton.innerHTML\
