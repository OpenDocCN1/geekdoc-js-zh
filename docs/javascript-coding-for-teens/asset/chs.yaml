  \ 5. 构造函数的语法是什么？\n\n### 6. 什么是对象实例？\n\n## 调试\n\n### message\n\n实例变量 `this.chatLog`\
  \ 不是函数。它是一个应该向其中添加消息的数组。它缺少 `push` 方法。\n\n```javascript\nChatProgram.prototype.message\
  \ = function (person, message) {\n  var messageEntry = {\n    person: person,\n\
