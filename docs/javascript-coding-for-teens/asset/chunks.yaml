    CRACK THE CODE


    [1.](#part0010.xhtml_ch03_Q_1)When are comments useful?


    Comments can be used for many situations. They can be used to explain what the
    code is doing, the purpose of the algorithm that was written, and general self
    notes.


    [2.](#part0010.xhtml_ch03_Q_2)What is the difference between declaration and assignment?


    Declaration is the preparation of a variable. Assignment is associating a piece
    of data to it.


    [3.](#part0010.xhtml_ch03_Q_3)Can the word “var” be used as a variable name? Why
    or why not?


    It cannot, because it is a keyword. All keywords are reserved for JavaScript to
    use and usually will result in a runtime error if the coder attempts to use it
    as a variable.


    [4.](#part0010.xhtml_ch03_Q_4)What keywords were covered in this chapter?


    The following were covered: var, true, false, null, undefined.


    [5.](#part0010.xhtml_ch03_Q_5)What is the main difference between the increment
    operators and self-assignment operators?


    The increment operators do not need to be assigned again (with the sign equal
    operator). Self-assignment is a reassignment.


    [6.](#part0010.xhtml_ch03_Q_6)How are values in an array accessed?


    They are accessed by their numeric position in the array, by index (starting at
    0). This is done using the bracket operator.


    [7.](#part0010.xhtml_ch03_Q_7)How are values in an object accessed?


    They are accessed by their key name with the dot operator or bracket operator.
    If the bracket operator is used, the key name must be a string.


    [8.](#part0010.xhtml_ch03_Q_8)What value is outputted if a nonexistent index is
    accessed in an array?


    It outputs undefined.


    [9.](#part0010.xhtml_ch03_Q_9)What value is outputted if a nonexistent key is
    accessed in an object?


    It outputs undefined.


    [10.](#part0010.xhtml_ch03_Q_10)When is bracket notation necessary for accessing
    a value in an object, instead of the dot operator?


    When using a variable as the key name, the bracket notation must be used.


    DEBUGGING


    [1.](#part0010.xhtml_ch03_D_1)The variable doesn’t seem to change in value, despite
    the fact that it is being incremented.


    Self-incrementing should not be assigned.


    var num = 0;


    num++;


    console.log(num); // 1


    [2.](#part0010.xhtml_ch03_D_2)Adding two numbers together isn’t working properly.


    One of the numbers is a string. Both must be the type “number.”


    var num1 = 10;


    var num2 = 2;


    console.log(num1 + num2); // 12


    [3.](#part0010.xhtml_ch03_D_3)Trying to access your dog’s name ‘Max’ by using
    the key ‘pug’ is outputting undefined.


    When using a variable as a key, the bracket notation has to be used.


    var dogs = {


    pug: ''Max'',


    terrier: ''Appa''


    };


    var myDog = ''pug'';


    console.log(dogs[myDog]); // ''Max''


    [4.](#part0010.xhtml_ch03_D_4)An attempt to access the last entry in the array
    is outputting undefined.


    The index 3 is out of bounds of the array. For arrays, the index starts at 0.


    var meanPeople = [''Layna'', ''Layna again'', ''Layna one more time''];


    console.log(meanPeople[2]); // ''Layna one more time''


    [5.](#part0010.xhtml_ch03_D_5)A fatal runtime error is occuring when trying to
    print this string.


    There is an apostrophe in the middle of the intended message: Layna’s. JavaScript
    thinks that the string ends there, causing a runtime error. The escape operator
    is needed to have a quote in the middle of the string.


    console.log(''Layna\''s favorite hobby is being mean to Andrew'');


    [Chapter 4 Solutions](#part0003.xhtml_sec-124)


    CRACK THE CODE


    [1.](#part0012.xhtml_ch04_Q_1)What is the difference between equality operators
    and strict equality operators?


    The equality operators will use type coercion if the data types are different.
    Strict equality never uses type coercion.


    [2.](#part0012.xhtml_ch04_Q_2)What data types can the typeof operator properly
    check?'
