    确保你已经在 VS Code 中打开了你的文件夹。VS Code 的终端会自动指向你文件夹的目录。在终端中查找并运行代码最简单的方法，就是让它已经指向了你文件所在的目录。为了双重确认，输入命令
    `ls`（顺便说一下，那是小写字母 L）。它将打印出当前目录下所有的文件和文件夹。你应该能在终端输出中看到你的文件 `index.js`。


    ## 编写你的第一段代码


    现在，你已经准备好运行一些 JavaScript 了！但在运行任何代码之前，你必须先写下它。


    ### CONSOLE.LOG


    我们将频繁地使用名为 `console.log` 的东西`console.log` 接收括号内的内容并将其打印到命令行上。此时，你不需要理解 `console.log`
    背后的底层机制。我们在这里只是为了确认你的计算机已准备好编写 JavaScript 了！


    ### 我们来写点 JavaScript 吧！


    我们现在保持简单，只写一个 `console.log`。在 VS Code 的文件中输入以下内容，但先不要按回车。完成后，将文件保存为 `.js` 文件。


    ```javascript

    console.log(''salutations terra!'');

    ```


    ### 我们来运行点 JavaScript 吧！


    在命令行中运行命令的语法始终如下：


    `[command] [parameters]`


    Node.js 是你的运行环境。命令是 `node`，参数是文件名。


    ```bash

    node index.js

    ```


    ![](img/image00268.jpeg)


    恭喜！你正式运行了你的第一段代码。


    ## Bug (Bugs)


    编写算法就像写一篇有说服力的论文。算法是一本文体，其逻辑流指向正确的结论。你将根据以下标准被评分：


    1. 回答：你的文章得出了结论。

    2. 语法：没有违反任何语言规则。

    3. 充分的理由：你整个文章的推理是有逻辑的。


    编写代码有类似的要求：


    1. 回答：你有了预期的行为。

    2. 语法：正确的 JavaScript 语法。

    3. 充分的理由：你算法的逻辑顺序是无可击的。


    老师在评分时往往很和蔼，或者至少很灵活。但计算机是无情的。以下是计算机如何评价你的代码：


    1. 行为不符合预期？部分得分，但仍然是不格分。

    2. 语法错误？运行时错误。0/100

    3. 算法中有一处错误？运行时错误。0/100


    编写代码时你需要满分。任何偏差都意味着你的代码中存在一个或多个缺陷。我们把这些缺陷称为 **bugs**。如果你想要那个及格分，你就需要找到它们。


    专业程序员创建的程序包含惊人的代码量。这些被称为代码库（codebases）。Bug 喜欢躲在成千上万（甚至百万）行代码的缝隙中。这是一项艰巨的工作，但程序员们努力编写无
    bug 的代码。


    ### 黑客提示 (HACKER HINT)


    感到精疲力竭？休息 15 分钟。你回来时大脑会更清醒，并比你想象中更早发现 bug。


    ### Bug 可能会令人沮丧


    当你开始编写代码时，你会写很多不完善的代码。你第一次错，第二次错，甚至可能第 20 次还是错。但关于 bug 最重要的部分是不要让它们影响你的情绪。即使是专业程序员也会感到沮丧。这都是学习过程的一部分，所以不要放弃！


    ![](img/image00269.jpeg)


    ## 第三章：变量与数据类型


    为了有效地编码，理解 JavaScript 为你提供的基础工具箱非常重要。在本章中，你将学习编写代码时用于表示概念的各种数据类型。你还将学习程序员用来跟踪这些数据的策略。程序员组织代码的方式也非常重要。这让我们能够有效地阅读彼此的代码。


    ### 代码结构


    编程语言对于代码的编写方式有基准规则。在你动手之前，我们先过一遍这些规则。这只是一个关于 JavaScript 代码如何结构的层层概览。不需要考虑每一行的内容。


    #### 语句 (STATEMENTS)


    语句是一个执行操作的表达式。语句通常写在一行内。


    ```javascript

    console.log(''I am a statement'');

    var statement = ''I am another statement'';

    ```


    #### 分号 (SEMICOLONS)


    你注意到分号了吗？每个语句末尾都应该有一个分号。如果你忘记了，JavaScript 有一些狡猾的方法可以自动修复，但这种做法很挑剔且容易出错。稳妥起见，养成自己手动添加分号的习惯。


    在某些情况下，语句末尾的分号是非法的语法。我会在后续过程中解释这些情况。


    #### 注释 (COMMENTS)


    有时程序员想要写一些不需要运行的文本，比如给自己的备注。注释是在文件中写入信息的一种，在运行代码时会被忽略。


    你可以出于任何原因写任何你想的内容。复杂的算法可能会变得棘手，而注释是解释代码在做什么的一种方法。其语法是在非代码文本前添加双斜杠。


    ```javascript

    // 将文本输出到浏览器控制台或终端

    console.log(''I am a statement'');

    ```


    #### 缩进 (INDENTATIONS)


    你会注意到某些行有缩进。这是刻意的，但在技术上是可选的。程序员缩进代码是为了提高可读性。随着你编写更多代码，你将理解这些规则。


    ## 变量 (Variables)


    正如我们通过不同的名称来互相标识一样，编程中的名称用于跟踪数据。这些名称被称为变量。


    ### 声明 (DECLARATION)


    关联变量有两个步骤。第一步是声明变量。声明的过程是告诉 JavaScript 某个名称应该被准备作为一个变量。特殊单词 `var` 告诉 JavaScript
    应该一个变量。


    ```javascript

    var aHumanName;

    ```


    ### 赋值 (ASSIGNMENT)


    将数据与变量关联是赋值。一旦变量已经声明，就不需要再次声明。赋值通过运算符执行。


    ```javascript

    aHumanName = ''Andrew'';

    ```


    ### 一个语句中完成赋值与声明


    声明和赋值是两个不同的概念，但通常在一个语句中完成。


    ```javascript

    var aHumanName = ''Andrew'';

    ```


    ### 数据重新赋值 (DATA REASSIGNMENT)


    变量也可以重新赋予不同的值。重新赋值对于后续主题非常重要。


    ```javascript

    var aHumanName = ''Andrew'';

    aHumanName = ''Charlie'';

    ```


    ### 使用变量评估语句


    每当使用变量时，JavaScript 都会提取变量关联的数据并将其替换。


    ```javascript

    var myBirthYear = 1990;

    var currentYear = 2021;

    currentYear - myBirthYear;

    ```


    ### 关键字不能作为变量


    `var` 是 JavaScript 中关键字的一个例子。它的用法始终意味着“一个变量声明”。它会忽略任何其他意图，且严禁用于变量名。


    ```javascript

    // 将创建运行时错误！期待变量声明

    var var = 2021;

    ```


    ### 黑客提示


    语法高亮和 VS Code 的错误建议通常会保护你误用关键字作为变量。但有时错误并不是直观的。唯一确定的是，你的代码中某些出了问题。


