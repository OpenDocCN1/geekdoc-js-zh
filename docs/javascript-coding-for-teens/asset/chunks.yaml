    \ that your algorithm should be solved with an array instead.\n\n### Updating\
    \ Objects in an Array (#part0003.xhtml_sec-76)\n\nLet’s say you have an object\
    \ where the keys are player names and their ages. It would make sense to merge\
    \ the data into a single data structure. You can accomplish this using the strategies\
    \ that you’ve learned.\n\n```javascript\nvar players = [\n{ name: 'superb', skill:\
    \ 3 },\n{ name: 'smirk', skill: 7 },\n{ name: 'tired', skill: 6 },\n{ name: 'ANS',\
    \ skill: 9 }\n];\n\nvar playerAges = {\nsuperb: 21,\nsmirk: 21,\ntired: 22,\n\
    ANS: 21\n};\n```\n\nThis is the expected output.\n\n```javascript\n[\n{ name:\
    \ 'superb', skill: 3, age: 21 },\n{ name: 'smirk', skill: 7, age: 21 },\n{ name:\
    \ 'tired', skill: 6, age: 22 },\n{ name: 'ANS', skill: 9, age: 21 }\n];\n```\n\
    \nLike the previous question, iteration is clearly needed.\n\n```javascript\n\
    function playerWithAges(players, ages) {\n  var playerData = [];\n  for (var i\
    \ = 0; i < players.length; i++) {\n    var player = players[i];\n  }\n  return\
    \ playerData;\n}\n```\n\nBut this time, the return value is not an array of strings.\
    \ It is an array of objects. Inside each iteration, create a new object with the\
    \ data and push it into the array.\n\nPutting it all together, the file and output\
    \ should look like this.\n\n```javascript\nvar players = [\n{ name: 'superb',\
