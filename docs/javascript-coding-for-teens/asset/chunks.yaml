    # 第 1 章

    ## 欢迎学习 JavaScript 编程

    编程是将人类创造力与计算机可以理解的原始逻辑相结合的艺术。后者真正的挑战。你用了一生都在像人类一样思考，但编程要求你像计算机一样思考。这听起来可能很难，但你可以做到的。我会在这里为你提供帮助！编程有助于解决用其他方法无法解决的问题。它可以执行复杂的计算、自动化流程，并完成人类大脑单独无法处理的任务。


    编程语言是一种特定的工具，用于将人类指令翻译成计算机可以解释的内容。世界上有很多种语言，它们都有自己的优缺点。但归根结底，它们做的是同一件事：与计算机交流。对于本书来说，首选的编程语言是
    `JavaScript`。


    ### 为什么选择 JavaScript？

    `JavaScript` 是一种最初为开发网站设计的编程语言。超过 90% 的网页由 `JavaScript` 驱动。它的应用已经远远超了最初的用途。`JavaScript`
    现在是最热门的学习语言之一。


    `JavaScript` 也是任何向往程序员的绝佳入门点。许多编程语言需要深入理解计算机的工作原理。而 `JavaScript` 则为你处理了许多底层细节。


    ### 什么是程序？

    代码通过解决问题来改善现代生活。程序是执行或解决一个完整想法的代码集合。完整想法的概念是非常开放的。程序有各种形状、大小和用途。它们无处不在。我确定你已经知道许多日常生活中使用的程序。这些看起来看起来熟悉吗？


    * 诸如 `Windows` 和 `macOS` 的操作系统

    * 移动应用

    * Web 浏览器


    世界围绕代码旋转。我们使用的大多数程序都在后台运行。是什么控制着你所在社区电网的电力？汽车使用什么来控制转向助力？如何通过摩擦手机表面来访问有趣的猫咪图片？这些现代奇迹是通过创建和利用程序实现的。


    ### 网站是计算机程序吗？

    第一批网站不是计算机程序。但现代绝大多数网站都是。对 Web 历史的简要回顾将解释其原因。


    #### HTML

    超文本标记语言（称为 `HTML`）的创建标志着在 Web 浏览器上通信视觉内容的开始。这些早期网站无聊得令人震惊。它们不包含特殊的字体、颜色或动画。`HTML`
    仅仅是“东西”。这些东西在任何意义上都不是动态的。除了纯文本、图像和可点击的链接。从这个意义上说，它们不是程序。


    是的，`HTML` 中的“L”代表“language”（语言）。但 `HTML` 不是编程语言。它是一种“标记语言”——一种在 Web 浏览器上表示内容的结构良好的方式。


    #### CSS

    层样式表（或 `CSS`）是用于视觉上增强 `HTML` 的补充代码。`CSS` 的引入确实让事情变得丰富起来。它将枯燥的文本、图像和布局并让它们焕然一新。它允许诸如内容的非垂直布局，以及更多的颜色和精美的字体。结果是，查看网站终于变成了一种愉快的体验，尽管观众仍然只是看文本和图像。


    #### JAVASCRIPT

    编程语言很快被引入其中，那是美好事的开始。多种编程语言竞争哪种将成为 Web 浏览器的终极编程语言。`JavaScript` 摧毁了竞争对手。将编程语言嵌入网站功能仅仅是一个开始。


    `JavaScript` 绝不仅仅是一门编程语言。但它包含了一套 Web 特有的功能，可以轻松操作网站内容。在书的最后，有关于 `JavaScript` 如何在网站上发挥魔力的概述。


    ### 基础知识

    最难的编程语言是你学习的第一种语言。高层概念不会随语言改变，它们与计算机交互的方式在很大程度上是通用的。


    伟大的梦想从小开始。从编程知识工具包的基础开始构建你的知识是非常重要的。那么，让我们看看书中将讨论的一些基础编程语言。


    变量


