    # CHAPTER 1

    ## Welcome to Programming in JavaScript

    Programming is the art of combining human creativity with raw logic that a computer
    can understand. The latter is the true challenge. You have spent your entire life
    thinking like a human, but programming asks you to think like a computer. That
    may sound difficult, but you can do this. And I’m here to help! Programming helps
    solve problems that are impossible to solve with other methods. It can perform
    complex computations, automate processes, and accomplish tasks that the human
    brain alone cannot handle.


    A programming language is a specific tool for translating human instructions to
    something a computer can interpret. There are many languages out there, and they
    all have their strengths and weaknesses. But at the end of the day, they all do
    the same thing: They talk to computers. For this book, the programming language
    of choice will be `JavaScript`.


    ### Why JavaScript?

    `JavaScript` is a programming language that was originally made for developing
    websites. More than 90 percent of the web is powered by `JavaScript`. Its application
    has grown far and wide from its original use. `JavaScript` is now one of the hottest
    languages to learn.


    `JavaScript` is also a great entry point for any aspiring programmer. Many programming
    languages require deep understanding of how computers work. `JavaScript`, on the
    other hand, handles many of the nitty-gritty details for you.


    ### What Are Programs?

    Code improves modern life by solving problems. A program is a collection of code
    that performs or solves a complete idea. The concept of a complete idea is very
    open ended. Programs come in all shapes, sizes, and uses. They are all around
    us. I’m sure you already know many programs that you use in your daily life. Do
    these look familiar?


    * Operating systems like `Windows` and `macOS`

    * Mobile apps

    * Web browsers


    The world revolves around code. A majority of the programs we use work in the
    background. What controls the electricity in your neighborhood’s power grid? What
    does an automobile use to control power steering? How is it possible to rub the
    surface of a phone to access funny cat pictures? These modern feats are possible
    through the creation and utilization of programs.


    ### Are Websites Computer Programs?

    The first websites were not computer programs. But an overwhelming majority of
    modern ones are. A very brief recap of the history of the Web will explain why.


    #### HTML

    The creation of hypertext markup language, referred to as `HTML`, marked the start
    of communicating visual content on a web browser. These first websites were shockingly
    boring. They contained no special fonts, colors, or animations. `HTML` is simply
    “stuff.” Stuff that is not dynamic in any sense of the word. Nothing but plain
    text, images, and clickable links. In that sense, they were not programs.


    Yes, the “L” in `HTML` stands for “language.” But `HTML` is not a programming
    language. It is a “markup language”—a well-structured way of representing content
    on a web browser.


    #### CSS

    Cascading Style Sheets, or `CSS`, is supplementary code that visually enhances
    `HTML`. The introduction of `CSS` really spiced things up. It took the boring
    text, images, and layouts and gave them a makeover. It allowed for things such
    as nonvertical layouts of content, as well as more colors and great fonts. As
    a result, looking at a website was finally a pleasant experience, even though
    the viewer was still just looking at text and images.


    #### JAVASCRIPT

    Programming languages soon got thrown into the mix, and that was the start of
    something beautiful. Multiple programming languages jockeyed over which would
    be the definitive programming language for web browsers. `JavaScript` destroyed
    the competition. Embedding a programming language into a website’s function was
    just the beginning.


    `JavaScript` is, first and foremost, a programming language. But it includes a
    suite of Web-specific functionality that makes it easy to manipulate a website’s
    content. Near the end of this book, there is an overview of how `JavaScript` works
    its magic on websites.


    `HTML` is quite easy to learn. It is not as complex as `JavaScript`, but it is
    still outside the scope of this book. This book will provide `HTML` code snippets
    when needed. `CSS`, like `HTML`, won’t be covered, but code will be provided.
    When presented in this book, the `HTML` and `CSS` code will be clearly indicated.


    ### The Fundamentals

    The hardest programming language to learn is the first one you pick up. The high-level
    concepts don’t change across languages, and the way they interact with a computer
    is, for the most part, universal.


    Big dreams start small. It’s important to begin building your tool kit of programming
    knowledge with the fundamentals. So, let’s take a look at some fundamental programming
    language that will be discussed within this book.


