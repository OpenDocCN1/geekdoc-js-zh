    # Definitions


    - **property**: A piece of data (including a method) that is accessible by key;
    applies to object data structures and object instances

    - **pseudo code**: A computer algorithm written in plain English

    - **relational operator**: An operator that compares the value between two pieces
    of data

    - **scope**: The rules of where variables and functions are available for use
    within the code

    - **script tag**: The HTML tag that is used to run code from a JavaScript file

    - **strict equality operator**: An operator that compares equality but never uses
    type coercion

    - **string**: The data type that represents characters

    - **type coercion**: JavaScript’s process that attempts to reconcile illogical
    operations by changing data types for the duration of evaluation

    - **unit testing**: The process of writing tests for individual parts of a program

    - **variable**: A name that can be associated with a piece of data

    - **while loop**: A type of loop that will continue running until its terminating
    condition evaluates to false


