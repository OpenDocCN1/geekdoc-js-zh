    Always download an executable file labeled “windows”, “.msi”, or “.exe”. If there
    are no labels anywhere in the download section and there is only one option, then
    download that. They will all be easy to install. Download and double-click to
    start the installation prompts.


    You will need to install all three programs:


    1. A good command line: `Git Bash`

    2. Text editor: `VS Code`

    3. JavaScript runtime: `Node.js`


    ## Git Bash


    PCs come with a command line built in, but it can be difficult to work with. Instead,
    I suggest using a third-party application called `Git Bash`.


    Search engine query: `Git bash windows download`


    Current URL: [gitforwindows.org](http://gitforwindows.org)


    The installation process does not require any special configuration. While the
    insllation setup wizard runs, continue with all of the default configurations.


    ## VS Code


    Search engine query: `Visual studio code windows download`


    Current URL: [code.visualstudio.com/download](http://code.visualstudio.com/download)


    When you download `VS Code`, click “Next” through all the prompts to install,
    but in the prompt “Select Additional Tasks,” click on “Create a desktop icon to
    create an easily accessible shortcut on your desktop.”


    ## Node.js


    Search engine query: `Node js for windows download`


    Current URL: [nodejs.org/en/download](http://nodejs.org/en/download)


    Keep all of the default configurations during installation.


    Note: After finishing your `Node.js` installation, restart `VS Code` and any `Git
    Bash` windows you have open. This can be performed with the shortcut `alt + F4`.
    Alternatively, at the top right of the `VS Code` window, click the “x” icon to
    close it.


    ## Mac Environment Setup


    If a `.pkg` download is already available, use that one. It’s the easiest installation
    method. Just double-click and it should automatically install. `.app` requires
    a drag-and-drop to the “Applications” folder. Double-click the `.app` file and
    a window should appear, asking you to drag and drop the file.


    ## Terminal


    Macs already come with a powerful and easy-to-use command line, called the “terminal.”
    No `Git Bash` installation required.


    We will need to install only two applications:


    1. Text editor: `VS Code`

    2. JavaScript runtime: `Node.js`


    ### VS Code


    Search engine query: `Visual studio code windows download`


    Current URL: [code.visualstudio.com/download](http://code.visualstudio.com/download)


    ### Node.js


    Search engine query: `Node js mac download`


    Current URL: [nodejs.org/en/download](http://nodejs.org/en/download)


    Note: After finishing your `Node.js` installation, restart `VS Code` and any terminal
    windows you have open. Do this by typing `command + q`. Alternatively, at the
    top of your screen, you’ll see a bar. Open “Code” and click “Quit Visual Studio
    Code.” Save `VS Code` to your desktop so it’s easy to find. This can be done by
    dragging it from your search bar onto your desktop.


    ## Using a Code Editor


    Knowing how to use a programming text editor effectively is an important skill.
    These programs have incredible depth of usability. But you don’t need to learn
    too many features to gain plenty of value from them.


    ### Code Editor: Autoformatting


    If you’ve seen computer code in the past, you may have noticed that there are
    indentations and spacings among lines. Nicely structured, right? Code is structured
    with white space and indentations for readability. This helps us follow the sequence
    of logic.


    ### Hacker Hint


    If `VS Code`’s color highlighting looks strange in certain places, there is a
    syntax error. If an autoformatted line spacing looks inconsistent, it likely means
    missing parentheses or curly brackets.


    ### Code Editor: The Red Squiggles


    It is important not to ignore the red squiggles under your code. `VS Code`, with
    its great JavaScript support, will do a basic analysis of your code and give you
    feedback on syntax errors. Those red squiggles indicate a fatal error in your
    code. JavaScript will not understand what you mean and will stop running your
    code. Not exactly ideal!


    If you see an error (marked by the red squiggles), hover your cursor over it and
    see what `VS Code` has to say about it. Sometimes, the error message won’t be
    helpful. It might be jargon only experienced programmers will understand. But
    at the very least, it will tell you something’s wrong.


    ## Setting Up Your Terminal


    `VS Code` has a feature that embeds your command line right into your text editor.
    To reveal it, go to View (at the top of your screen) -> Terminal.


    Mac users don’t need to do anything special, but Windows users will need to do
    a tiny bit of tweaking. The steps for doing so are included on the next few pages.


    ### Windows-only Instructions for VS Code Terminal


    The default terminal that `VS Code` uses is the Windows built-in command line.
    As mentioned earlier, this command line is harder to work with, so we’re going
    to use `Git Bash` as the default. After opening the terminal by going to Terminal
    (at the top of your screen) -> New Terminal, you will see, on the right-hand bar,
    a terminal selector. Click on “Select default shell.”


    ![](Images/image00262.jpeg)


    A prompt will appear on the top. Select `Git Bash`.


    ![](Images/image00263.jpeg)


    Restart `VS Code`. Look at the bottom of your screen. Your command line should
    now default to `Git Bash` when `VS Code` is opened.


    ![](Images/image00264.jpeg)


    ### Prepare Your JavaScript Folder


    It makes sense to have a folder in your computer that is dedicated to all of your
    code. Programmers call this a “working directory.” Create a folder anywhere in
    your file system, preferably somewhere easily accessible, like your desktop folder.
    All of the files that contain your code will live in this folder.


    To open the folder, click “File” then “Open Folder” in `VS Code`.


    ![](Images/image00265.jpeg)


    Find the folder you created and click “Select Folder.”


    ![](Images/image00266.jpeg)


    Once you open it, `VS Code` should now have the name of the folder on the top
    bar.


    ### Installing JavaScript Packages


    Many algorithms are hard to write, so programmers all over the world share their
    code with one another so they don’t have to reinvent difficult algorithms all
    over again! They are uploaded to a hosting service called `npm` (short for “Node
    Package Manager”), which is available to everyone to download for free. Installing
    packages is a streamlined process for a user. In JavaScript, creating basic programs
    with user interactivity is surprisingly complicated. In many of the exercises
    within this book, you will be using a handy package someone else worked very hard
    to make, named `readline-sync`. The command to install it through the terminal
    is:


    ```

    npm i readline-sync

    ```


    But wait—where do you type this? Easy enough: In the bottom half of your screen,
    beneath the word “terminal,” is the terminal. In that area, you’ll probably see
    a small white box. This is where you’ll type your terminal commands. If you don’t
    see something similar to the image below at the bottom of your window, you haven’t
    opened the `VS Code` terminal. This can be done on the menu bar at Terminal ->
    New Terminal.


    ![](Images/image00267.jpeg)


    ### Prepare the File


    Go to File -> New File and it will open up a new, empty text file for you to start
    coding in. To save a file, go to File -> Save. Let’s try this out. When you first
    save a file, it will ask you to name it. The default extension will be for a .txt
    file. But don’t save yet, because it’s a trap!


    You’re using JavaScript. You have to give it the JavaScript file extension, which
    is .js. As long as you have the correct file extension, .js, it can be named anything.
    But I suggest “index.js.”


    ## Double-checking

