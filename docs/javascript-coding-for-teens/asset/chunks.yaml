    [Updating Text After It Has Been Edited](#part0003.xhtml_sec-119)


    It looks like your to-do entry magically turned into an editable element. But
    what good is a textarea if it doesn’t have the ability to revert back into its
    uneditable state? Let’s add an update button, using the function createUpdateButton.
    Right now, the button doesn’t do anything. Add an event listener to change that.
    Before destroying the textarea HTML element, save the inner text to a variable.


    function createUpdateButton() {


    var updateButton = document.createElement(''div'');


    updateButton.innerHTML = ''update'';


    updateButton.classList.add(''update-button'');


    updateButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(updateButton);


    var updatedText = getTodoText(parentDiv);


    });


    return updateButton;


    }


    Now you’re ready to manipulate the HTML on the page. Destroy the textarea, recreate
    the un-editable to-do entry with the text inside, and insert it in the exact position
    the textarea previously was in. Pretty slick!


    function createUpdateButton() {


    var updateButton = document.createElement(''div'');


    updateButton.innerHTML = ''update'';


    updateButton.classList.add(''update-button'');


    updateButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(updateButton);


    var updatedText = getTodoText(parentDiv);


    destroyInnerContent(parentDiv);


    var textDiv = createTextDiv(updatedText);


    var closeButton = createCloseButton();


    var editButton = createEditButton();


    parentDiv.append(textDiv);


    parentDiv.append(closeButton);


    parentDiv.append(editButton);


    });


    return updateButton;


    }


    [Canceling Text Update](#part0003.xhtml_sec-120)


    But what if the user changes their mind and wants to cancel their update? You
    will need a button for that. This website already has a function called createCancelButton.
    You need to add behavior to it. That means it is time for another event listener!


    When hitting cancel, the text needs to revert back to its original state. But
    you lose the text value when the user starts typing in the textarea. How can this
    be resolved?


    You need to get a little creative! This time around, add a parameter to createCancelButton.
    This parameter will store the original text inside the function.


    function createCancelButton(originalText) {


    var cancelButton = document.createElement(''div'');


    cancelButton.innerHTML = ''cancel'';


    cancelButton.classList.add(''cancel-button'');


    return cancelButton;


    }


    When the cancel button is clicked, the event listener will destroy the textarea,
    create the uneditable div, and reinsert the previously saved text. Give your new
    and improved to-do list a try.


    function createCancelButton(originalText) {


    var cancelButton = document.createElement(''div'');


    cancelButton.innerHTML = ''cancel'';


    cancelButton.classList.add(''cancel-button'');


    cancelButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(cancelButton);


    destroyInnerContent(parentDiv);


    var textDiv = createTextDiv(originalText);


    var closeButton = createCloseButton();


    var editButton = createEditButton();


    parentDiv.append(textDiv);


    parentDiv.append(closeButton);


    parentDiv.append(editButton);


    });


    return cancelButton;


    }


    [Congratulations!](#part0003.xhtml_sec-121)


    You have successfully navigated the basics of JavaScript! This book started with
    the raw basics, and slowly but surely you have learned enough to build a game
    and website in JavaScript. There were a few very challenging chapters in this
    book, and I congratulate you for making it across the finish line!


    With all that said, your journey does not stop here. The fundamentals that have
    been covered in this book are just the tip of the iceberg. I hope you have had
    as much fun working through this book as I had writing it! I’m passionate about
    programming, and I sincerely hope you continue to build your skills as a coder
    in the coming years.


