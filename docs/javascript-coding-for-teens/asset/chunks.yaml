    GUESS MY CAT’S NAME


    Let’s make a quick little game in your terminal using functions. This isn’t easy!
    You will need to break down the problem into many sub-problems and encapsulate
    the algorithm in a function.


    You will type in a character and then you will receive feedback on the progress
    of your guess. Once you have correctly guessed all of the characters, the full
    name will be printed and the program will exit.


    ![](Images/image00295.jpeg)


    Right now, your program isn’t working very well. In fact, it’s not working at
    all. Here is your broken code:


    var prompt = require("readline-sync");


    // important! this function will not work for data structures


    // and objects. Only strings, numbers, null, booleans, and undefined


    function test(description, actual, expected) {


    console.log(description);


    if (actual === expected) {


    console.log('' pass!'');


    } else {


    console.log('' fail!'');


    console.log('' received: '', actual);


    console.log('' expected: '', expected);


    }


    }


    function includes(arrOrStr, item) {


    for (var i = 0; i < arrOrStr.length; i++) {


    var currItem = arrOrStr[i];


    if (currItem !== item) {


    return true;


    }


    }


    return false;


    }


    test(''includes #1'', includes(''cat'', ''a''), true);


    test(''includes #2'', includes(''cat'', ''t''), true);


    test(''includes #3'', includes(''cat'', ''f''), false);


    function createHint(actualName, allUserGuesses) {


    var output = '''';


    for (var i = 0; i < actualName.length; i++) {


    var currChar = actualName[i];


    if (includes(allUserGuesses, currChar)) {


    output += currChar + '' '';


    } else {


    output = ''_ '';


    }


    }


    return output;


    }


    // note the space at the end of the expected values!


    test(''createHint #1'', createHint(''charlie'', ''chle''), ''c h _ _ l _ e '');


    test(''createHint #2'', createHint(''cat'', ''u''), ''_ _ _ '');


    test(''createHint #3'', createHint(''cat'', ''a''), ''_ a _ '');


    function correctlyGuessed(actualName, allUserGuesses) {


    for (var i = 0; i < actualName.length; i++) {


    var currChar = actualName[i];


    if (includes(allUserGuesses, currChar)) {


    return false;


    }


    }


    return true;


    }


    test(''correctlyGuessed #1'', correctlyGuessed(''charlie'', ''chle''), false);


    test(''correctlyGuessed #2'', correctlyGuessed(''cat'', ''tac''), true);


    test(''correctlyGuessed #3'', correctlyGuessed(''cat'', ''cat''), true);


    function isMultiCharGuess(guess) {


    return guess.length === 1;


    }


    test(''isMultiCharGuess #1'', isMultiCharGuess(''a''), false);


    test(''isMultiCharGuess #2'', isMultiCharGuess(''av''), true);


    test(''isMultiCharGuess #3'', isMultiCharGuess(''c''), false);


    function hangCat(catName) {


    var userGuesses = '''';


    // infinite loop until we break out, after figuring out our cat name


    while (true) {


    var guess = prompt.question(''What\’s my cat\’s name?\n'');


    // prevent user from submitting multiple characters


    if (isMultiCharGuess(guess)) {


    console.log(''only guess one character at a time!'');


    continue;


    }


    // add to string of guessed characters


    userGuesses += guess;


    var isCorrect = correctlyGuessed(catName, userGuesses);


    if (isCorrect) {


    console.log(''That is right! My cat is named '' + catName);


    // once name is found, exit loop


    break;


    } else {


    console.log(''Nope! That is not my cat\’s name'');


    console.log(''The characters you have guessed are: '' + userGuesses);


    console.log(''Currently you have correctly guessed: '', createHint(catName, userGuesses));


    }


    }


    }


    // uncomment after all of your tests pass


    // hangCat(''chappy'');


    Notice all of the test cases in this file? They’re failing! Once you get them
    to pass, you can comment out all of your tests and uncomment the very last line
    of the file, and properly play your game. Good luck!


