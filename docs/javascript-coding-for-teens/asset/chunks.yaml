    ## 使用代码编辑器


    了解如何有效地使用编程文本编辑器是一项重要技能。这些程序的易性深度非常惊人。但你不需要学习太多的功能就能从中获得大量的价值。


    ### 代码编辑器：自动格式化


    如果你以前看过计算机代码，可能会注意到行与行之间有缩进和空格。结构良好，对吧？代码通过空格和缩进构建结构以提高可读性。这有助于我们遵循逻辑顺序。


    ### Hacker 提示


    如果 `VS Code` 的颜色高亮在某些地方看起来很奇怪，说明存在语法错误。如果自动格式化的行间距看起来不一致，可能意味着缺少圆括号或大括号。


    ### 代码编辑器：红色波浪线


    不要忽略代码下方的红色波浪线。`VS Code` 凭借其对 JavaScript 的出色支持，会对你的代码进行基础分析并对语法错误提供反馈。那些红色波浪线表示你的代码中存在致命错误。JavaScript
    将无法理解你的意思并停止运行你的代码。这并不理想！


    如果你看到错误（用红色波浪线标记），将光标悬停在上面，看看 `VS Code` 对此说了了什么。有时，错误信息可能没什么帮助。它可能是只有经验丰富的程序员才能听懂的术语。但至少，它会告诉你哪里出问题了。


    ## 设置你的终端


