    跟踪数据和海量的逻辑行对于程序员来说是一项重大挑战，但有一种策略可以帮助你记忆：变量！变量用于将名称与数据关联，并在需要时再次引用它们。在实践中，变量的用途可以广泛得多——但现在，你只需要知道变量是为某条数据命名的概念，以便稍后引用它。


    ## 数据类型

    存在多种数据类型和数据结构。计算机在开始为你承担所有繁重工作之前，需要知道许多不同的事情。你是在尝试组合文本，还是在做数学计算？文本和数字都是数据类型的示例。书中也会介绍更高级的数据类型。


    ## 数据结构

    数据结构是数据的容器。数据结构可以容纳一条数据，也可以容纳百万条数据。它们极其灵活，是编程中最强大的概念之一。存在多种类型的数据结构（例如数组），你将学习如何使用最基础的那些结构。


    ## 条件语句

    为了在一个特定的代码 set 中适应许多情况，它可以具有分支行为：“如果这只动物是狗，就给它吃鸡肉，但如果这只动物是鸟，就给它吃种子。”


    一条语句处理两种情况的可能结果。使用适当的代码可以帮助做出此类决策。在编程中，初始决策（即如果动物是狗）被称为条件语句。


    ## 循环

    你是否执行过某种重复的、且每次都几乎完全相同的活动？该活动的计算机版本被称为循环。循环是根据你指示的时间，自动重复执行一组操作的过程。


    ## 需掌握的词汇

    与任何行业一样，程序员有自己的行业术语。让我们来看几个对你路程有所帮助的关键词。


    ### 算法

    算法是通向结果或输出的逻辑指令序列。


    计算机并不是唯一使用算法的东西。人类也用算法进行思考。任何根据一组规则被视为“指令”的任何都是算法。算法有各种形状、大小和难度。人类在处理指令方面非常灵活，并拥有独特的批判性思维能力。这种能力允许你利用过去的经验来填充任何不完整或糟糕的指令。


    但计算机没有批判性思维能力。它必须经过编程。当计算机接收指令时，必须手口相授地提供每一个细节。即使与你的原始意图有微小的偏差，也可能导致你的算法停止或执行意外之外的操作。这类错误可能会导致灾难性的后果。


    ### 语法

    所有形式的书面交流都遵循如何构建单词和语句的规则。这些规则被称为语法。英语中的一些语法示例包括：


    - 用句号、感叹号或问号结束句子。

    - 当下一个单词以元音字母开头时，使用“an”而不是“a”。

    - 正确地拼写单词。

    - 根据适当的定义使用单词。


    编程语言也有这类规则。所有编程语言都有必须遵守的严格结构。但它们将对正确语法的要求推向了极端。任何语法规则的违反会导致程序崩溃并无法继续运行。幸运的是，编程语言的语法很容易学习。真正的挑战是在编写它时不犯错，否则你将面临一大堆调试工作。


    ### 抽象

    抽象是创建一个可以执行某功能或任务的东西的过程，同时隐藏其如何执行的细节。抽象的概念并非代码所独有。


    世界围绕着抽象运转。你为了使用计算机，需要拥有电气工程学位吗？你为了获得驾照，需要知道如何从零开始组装汽车吗？抽象的格言是：“我不需要知道它是如何工作的。我只需要知道如何使用它。”


    随着你代码规模的增长，从代码的其他部分隐藏不必要的细节变得非常重要。创建抽象的方法有多种，这本书将为你提供基础策略。


    ### 伪代码

    解决编程挑战有两个组成部分：


    1. 拥有正确的问题思考方式。

    2. 在无不一致且无语法错误的情况下实现逻辑。


    有些问题非常有挑战性，以至于程序员不想同时解决这两个部分。相反，他们想出正确的思考方式并用简单的英语将其写下来。这被称为伪代码。当程序员确认他们的推理行得通后，他们就会用真实的代码来实现它。这本书将使用大量的伪代码。在引入新概念或当你被要求解决挑战性问题时，它会对你有帮助。


    ![Images/image00261.jpeg]


    ## 第 2 章

    ### JavaScript：设置

    在开始探索 JavaScript 之前，你需要配置计算机来运行代码。本章将为 Windows 和 macOS 计算机提供逐步说明。在继续后续章节之前，请确保一切运行正常。这本书的其余部分依赖于此！


    ### 编码程序

    你将使用三个不同的程序进行 JavaScript 编码。每个程序的安装说明在 PC 和 Mac 之间不同，因此请务必遵循你操作系统的说明。


    #### 命令行（Windows 使用 GIT BASH，macOS 使用 TERMINAL）

    程序员并不总是使用像网络浏览器那样的友好的点击式视觉界面。很多情况下，你需要输入基于文本的命令。这没什么特别的。就像通过点击图标来运行程序一样，你可以在命令行中输入文本的指令来执行操作。


    #### 文本编辑器（VS CODE）

    编程通常非常复杂。幸运的是，非常聪明的程序员构建了惊人的工具来帮助我们提高效率、尽早发现错误并轻松阅读代码。编程文本编辑器是完全围绕编程设计的程序。它们有点像记事本，但在每一个方面都更好。它们拥有智能功能，如自动补全建议、重要文本的颜色标记、自动保存和强大的快捷键。我们将使用
    Visual Studio Code，或 `VS Code`。它是市面上最流行的免费编辑器之一，并具有非常好的 JavaScript 支持工具。


    #### JavaScript 运行时（NODE.JS）

    命令行只是执行计算机操作的平台。它在默认状态下没有运行 JavaScript 的能力。我们需要安装另一个名为 `Node.js` 的程序，以便在命令行中运行
    JavaScript 代码。我们称 JavaScript 代码的执行过程为运行时。


    #### 下载方法

    寻找这些程序的网站最可靠的方法是通过搜索引擎。最佳搜索词已在此[处]提供。如果你想直接访问网站，也提供了最新的链接（截至本文编写）。


    重要的下载说明

    如果下载位于网站上且有多个文件选项，请勿下载标记为或包含以下任何单词的文件：`source code`、`Linux`、`Ubuntu`、`.deb`、`.tar.gz`、`.rar`
    和 `binary`。


    这些是高级用户或我们不会涵盖的其他操作系统用户使用的。


    如果你有 32 位或 64 位的选择，任何一个都可以。如果可用，我总是使用 64 位的，因为它通常会快一点。


    [Windows (PC) 环境设置]


