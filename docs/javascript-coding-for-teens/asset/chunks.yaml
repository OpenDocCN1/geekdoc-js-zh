    [Chapter 9 Solutions](#part0003.xhtml_sec-129)


    CRACK THE CODE


    [1.](#part0022.xhtml_ch09_Q_1)After an HTML file is updated and saved, the browser
    does not immediately update. Why?


    The browser currently has an older version of the HTML file loaded. Refreshing
    the page will update it.


    [2.](#part0022.xhtml_ch09_Q_2)What is the document object?


    The document object is JavaScript’s representation of the HTML page.


    [3.](#part0022.xhtml_ch09_Q_3)What is the purpose of document.getElementsByClassName
    and document.getElementById?


    These functions are used to have JavaScript point to and manipulate HTML elements
    on the page.


    [4.](#part0022.xhtml_ch09_Q_4)How are document.getElementsByClassName and document.getElementById
    different?


    document.getElementsByClassName searches for all instances of the particular class
    that is being searched for and returns an array-like data structure. document.getElementById,
    on the other hand, finds only one.


    [5.](#part0022.xhtml_ch09_Q_5)What property contains the text inside an HTML element?


    The JavaScript property that contains text is innerHTML.


    [6.](#part0022.xhtml_ch09_Q_6)What is an event listener?


    An event listener is a JavaScript function that is invoked once and then waits
    for a particular interaction with the page to occur. This can range from key presses
    to button clicks. Once an interaction occurs, JavaScript will run the code inside
    the second argument, the function.


    [7.](#part0022.xhtml_ch09_Q_7)In our examples, the click event listener was applied
    directly to the button. But the keystroke event listener was applied to the entire
    document. Why?


    The event should be on the button, because the event to be observed is a click
    on it. A click event listener on the document would fire if the user clicks anywhere
    on the page. Keystrokes, on the other hand, were not specific to a particular
    HTML element on the page. As long as the user is on the page, we want to invoke
    behavior.


    [8.](#part0022.xhtml_ch09_Q_8)What are the two ways to use the HTML script tag
    to run JavaScript code when the page loads?


    The HTML script tag can have JavaScript code wrapped inside it. It can also be
    used to import JavaScript code a .js file, with the attribute src.


    [DEBUGGING](#part0022.xhtml_sec_103)


    The event listener is appended to the wrong element. Adding the event listener
    to the document will invoke the behavior on any click. It has to be on the button.
    Also, the event handler is not selecting the correct id. The text to be cleared
    is inside the div with the id that is ''text''.


    var button = document.getElementById(''delete-all'');


    button.addEventListener(''click'', function() {


    var div = document.getElementById(''text'');


    div.innerHTML = '''';


    });


