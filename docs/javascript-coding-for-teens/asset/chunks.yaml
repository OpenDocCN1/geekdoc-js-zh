    // tournament.js\nfunction playedInTournament(tournament, player) {\n  var players\
    \ = tournament.players;\n  for (var i = 0; i < players.length; i++) {\n    var\
    \ currentPlayer = players[i];\n    if (currentPlayer === player) {\n      return\
    \ true;\n    }\n  }\n  return false;\n}\n```\n\n现在是验证代码的时间。为了实现这一点，你需要使用 `console.log`\
