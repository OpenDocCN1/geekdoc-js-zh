    \n## CRACK THE CODE\n\n### 1. After an HTML file is updated and saved, the browser\
    \ does not immediately update. Why?\nThe browser currently has an older version\
    \ of the HTML file loaded. Refreshing the page will update it.\n\n### 2. What\
    \ is the document object?\nThe `document` object is JavaScript’s representation\
    \ of the HTML page.\n\n### 3. What is the purpose of `document.getElementsByClassName`\
    \ and `document.getElementById`?\nThese functions are used to have JavaScript\
    \ point to and manipulate HTML elements on the page.\n\n### 4. How are `document.getElementsByClassName`\
    \ and `document.getElementById` different?\n`document.getElementsByClassName`\
    \ searches for all instances of the particular class that is being searched for\
    \ and returns an array-like data structure. `document.getElementById`, on the\
    \ other hand, finds only one.\n\n### 5. What property contains the text inside\
    \ an HTML element?\nThe JavaScript property that contains text is `innerHTML`.\n\
    \n### 6. What is an event listener?\nAn event listener is a JavaScript function\
    \ that is invoked once and then waits for a particular interaction with the page\
    \ to occur. This can range from key presses to button clicks. Once an interaction\
    \ occurs, JavaScript will run the code inside the second argument, the function.\n\
    \n### 7. In our examples, the click event listener was applied directly to the\
    \ button. But the keystroke event listener was applied to the entire document.\
    \ Why?\nThe event should be on the button, because the event to be observed is\
    \ a click on it. A click event listener on the `document` would fire if the user\
    \ clicks anywhere on the page. Keystrokes, on the other hand, were not specific\
    \ to a particular HTML element on the page. As long as the user is on the page,\
    \ we want to invoke behavior.\n\n### 8. What are the two ways to use the HTML\
    \ script tag to run JavaScript code when the page loads?\nThe HTML `script` tag\
    \ can have JavaScript code wrapped inside it. It can also be used to import JavaScript\
    \ code a `.js` file, with the attribute `src`.\n\n## DEBUGGING\n\nThe event listener\
    \ is appended to the wrong element. Adding the event listener to the `document`\
    \ will invoke the behavior on any click. It has to be on the button. Also, the\
    \ event handler is not selecting the correct `id`. The text to be cleared is inside\
    \ the `div` with the `id` that is `'text'`.\n\n```javascript\nvar button = document.getElementById('delete-all');\n\
    button.addEventListener('click', function() {\n  var div = document.getElementById('text');\n\
    \  div.innerHTML = '';\n});\n```\n\n## Glossary\n\n- **abstraction**: The concept\
    \ of making a complex operation easy to use by hiding its implementation details\n\
    - **accumulator**: A classification of a variable that is used to slowly build\
