    [CODER’S CHECKLIST » Let’s review the topics we covered](#part0003.xhtml_sec-56)


    To be successful in JavaScript, it is incredibly important to understand loops.
    Programs of all sizes extensively use them to solve challenging problems. Hereʼs
    what you learned in this chapter:


    ❏Terminating conditions


    ❏While loops


    ❏For loops


    ❏Premature skipping of an interaction: continue


    ❏Complete exit of the entire loop: break


    ![](Images/image00284.jpeg)


    [CHAPTER 6](#part0003.xhtml_sec-57)


    Functions


    By this point you have been introduced to console.log and prompt.question. These
    are functions, and now you are finally equipped to learn more about them! Functions
    are a way of grouping a collection of statements together to perform a task. They
    are for data manipulation, exhibiting behavior, calculations—anything you can
    imagine. For the purposes of this book, functions have names and are run with
    parentheses to initiate their designed behavior. console.log is a function that
    has already been made for you. But now you are ready to write your own.


    [Why Are Functions Used?](#part0003.xhtml_sec-58)


    Functions have multiple aspects that make them useful to programmers. They are
    a core part of programming. They’ll be some of the first tools you’ll reach for
    when solving problems. Programming challenges that are hard become manageable.
    Challenges that are near impossible can become a reality.


