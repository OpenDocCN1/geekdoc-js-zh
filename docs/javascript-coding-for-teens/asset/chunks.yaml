    \ = {\n  win: true,\n  players: ['smirk', 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament,\
    \ 'smirk'));\nconsole.log(playedInTournament(sampleTournament, 'superb'));\n```\n\
    \n![](img/image00288.jpeg)\n\n看起来不错！在 `sampleTournament` 对象中，`smirk` 参加了比赛，但 `superb`\
    \ 没有。从文件中删除那两个 `console.log` 语句和数据结构 `sampleTournament`。今后它们将不再需要了。\n\n### 黑客提示\n\
    \n为了防止混淆，可以写一个表格来跟踪每次迭代中发生的情况。\n\n### 嵌套的数据结构\n\n在随后的练习中，需要一个比赛结果列表。在每个比赛结果内部，我们还需要一个参加该比赛的玩家列表。将此数据结构添加到文件中。\n\
    \n```javascript\nvar tournaments = [\n  { win: true, players: ['smirk', 'knight',\
    \ 'fly'] },\n  { win: true, players: ['superb', 'san', 'tired'] },\n  { win: true,\
    \ players: ['smirk', 'knight', 'tired'] },\n  { win: false, players: ['san', 'superb',\
    \ 'fly'] },\n  { win: true, players: ['smirk', 'san', 'fly'] },\n  { win: false,\
    \ players: ['superb', 'knight', 'tired'] },\n];\n```\n\n### 参加的比赛次数\n\n关于玩家参与的数据在\
    \ `tournaments` 数组中。有了数据数组，显然需要一个循环。\n\n```javascript\nfunction tournamentsPlayed(tournaments,\
    \ player) {\n  var playCount = 0;\n  for (var i = 0; i < tournaments.length; i++)\
    \ {\n    var currentTournament = tournaments[i];\n  }\n  return playCount;\n}\n\
    ```\n\n这一次，你需要检查 `player` 是否参加了该 `tournament`。不仅如此，你还必须跟踪这种情况发生的次数。判断一个 `player`\
    \ 是否参加了某场比赛是一项大量工作。每个比赛条目都需要搜索内部数组。但这已经在 `playedInTournament` 中得到了解决。可以重用该函数。\n\
    \n```javascript\nvar currentTournament = tournaments[i];\nvar playerDidPlay =\
    \ playedInTournament(currentTournament, player);\nif (playerDidPlay) {\n  playCount\
    \ += 1;\n}\n```\n\n通过 `console.log` 运行代码进行验证。\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments,\
    \ 'smirk'));\nconsole.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n\
    ![](img/image00289.jpeg)\n\n看起来不错。`smirk` 和 `superb` 都参加了三场比赛。现在可以删除这些 `console.log`\
    \ 语句了。\n\n### 赢得的比赛次数\n\n现在，更进一步。检查特定的 `player` 参加获胜 `tournament` 的次数。为了清楚地实现这一点，你需要：\n\
    \n1. 一个循环\n2. 一个用于跟踪获胜次数的累加变量\n\n```javascript\nfunction tournamentsWon(tournaments,\
    \ player) {\n  var winCount = 0;\n  for (var i = 0; i < tournaments.length; i++)\
    \ {\n    var currentTournament = tournaments[i];\n  }\n  return winCount;\n}\n\
    ```\n\n这与 `gamesPlayed` 相比略有不同。需要满足两个条件：\n\n1. `player` 参加了 `tournament`\n2. 团队获胜了\n\
    \n幸运的是，`playedInTournament` 可以用于第一个条件。对于第二个条件，每个条目在 `win` 键中都有比赛结果。你需要确保在该特定 `player`\
    \ 参加时，两个条件都为真，以便将比赛计为一次比赛胜利。在这种情况下，使用了与运算符 `&&` 来同时断言这两个条件。\n\n```javascript\n\
    function tournamentsWon(tournaments, player) {\n  var winCount = 0;\n  for (var\
    \ i = 0; i < tournaments.length; i++) {\n    var currentTournament = tournaments[i];\n\
    \    var playerDidPlay = playedInTournament(currentTournament, player);\n    var\
    \ tournamentWon = currentTournament.win;\n    if (playerDidPlay && tournamentWon)\
    \ {\n      winCount += 1;\n    }\n  }\n  return winCount;\n}\n```\n\n使用 `console.log`\
    \ 验证代码。\n\n```javascript\nconsole.log(tournamentsWon(tournaments, 'smirk'));\n\
    console.log(tournamentsWon(tournaments, 'superb'));\n```\n\n![](img/image00290.jpeg)\n\
    \n看起来不错！`smirk` 似乎赢了三场比赛，`superb` 赢了一场。\n\n### 玩家胜率\n\n现在你感兴趣确定胜率。要解决这个问题，将胜利次数除以比赛次数。\n\
    \n```javascript\nfunction playerWinRate(tournaments, player) {\n  var total =\
    \ tournamentsPlayed(tournaments, player);\n  var won = tournamentsWon(tournaments,\
    \ player);\n  var percentage = (won / total) * 100;\n  return parseInt(percentage);\n\
    }\n```\n\n```javascript\nconsole.log(playerWinRate(tournaments, 'smirk'));\nconsole.log(playerWinRate(tournaments,\
    \ 'superb'));\n```\n\n### 谁应该参加？\n\n噢不！看起来两名玩家之间发生了纠纷。似乎 `smirk` 和 `superb` 都想参加下一场比赛，但名额只有一个。为了解决这一问题，管理层决定检查每个相应玩家的表现。我们需要使用胜率来决定谁应该参加。\n\
    \n```javascript\nfunction whoShouldPlay(tournaments, player1, player2) {\n  var\
    \ player1WinRate = playerWinRate(tournaments, player1);\n  var player2WinRate\
    \ = playerWinRate(tournaments, player2);\n  var benchedPlayer;\n  var activePlayer;\n\
    \n  if (player1WinRate > player2WinRate) {\n    activePlayer = player1;\n    benchedPlayer\
    \ = player2;\n  } else {\n    activePlayer = player2;\n    benchedPlayer = player1;\n\
    \  }\n}\n```\n\n"
