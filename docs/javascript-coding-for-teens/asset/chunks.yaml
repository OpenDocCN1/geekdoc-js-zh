    \n### HTML TAG\n\nNotice the angle brackets surrounding a word? That is HTML syntax.\n\
    \n```\n<valid-html-tag-name-here>\n```\n\nOne has angle brackets surrounding it\
    \ and one has an angle bracket and a slash. The angle bracket–only tag is referred\
    \ to as the open tag and the other, with the slash, is the close tag. An open\
    \ tag must have a correlating close tag.\n\n```html\n<html>\n</html>\n```\n\n\
    Any amount of content can be placed between the open and close tags. HTML can\
    \ get incredibly complex!\n\n### HTML TAGS WE WILL USE\n\nBecause the emphasis\
    \ of this book is on JavaScript, there will be only a handful of HTML tags covered.\n\
    \n```html\n<html>\n<head>\n</head>\n<body>\n<div>\n  Hello!\n</div>\n</body>\n\
    </html>\n```\n\nThe `html` tag is the main tag that wraps around all HTML in a\
    \ file. The `head` tag is multipurpose. It is usually the place where nonvisual\
    \ HTML is inserted. The `body` tag is where visual elements are placed. The `div`\
    \ is a tag that doesn’t have an important role. It is simply used to wrap elements\
    \ inside it.\n\n### HTML ATTRIBUTES: CLASS AND ID\n\nThere are many different\
    \ HTML attributes. The syntax to apply them is the attribute name, an equal sign,\
    \ and the value (double quotes). As a concept, it is quite similar to a key-value\
    \ pair in an object data structure.\n\n```html\n<div class=\"container\">\n  I\
    \ am content in a div!\n</div>\n```\n\nThe attributes `class` and `id` are important\
    \ to have in HTML. The go-to strategy, when working with JavaScript, is to find\
    \ HTML elements by their class or id.\n\n## Web Browser\n\nBefore starting, make\
    \ sure the web browser Google Chrome is installed. Not all browsers are built\
    \ the same and Google Chrome is very good at running JavaScript.\n\nSearch engine\
    \ query: “google chrome download”\n\nCurrent URL: [google.com/chrome](http://google.com/chrome)\n\
    \n### WEB BROWSER DEVELOPER TOOLS\n\nAfter installation, open Google Chrome. Navigate\
    \ to Settings (the triple dot at the top right) -> More Tools -> Developer Tools.\n\
    \nThe developer console will appear. As a JavaScript programmer, this is where\
    \ all the magic happens. It is almost like a terminal built into the browser.\n\
    \n![](Images/image00305.jpeg)\n\nFind the file in your operating system’s (PC\
    \ or Mac) file system. The easiest way to find it is to right click the file in\
    \ VS Code and select “Reveal in Explorer.” For Macs, it is “Reveal in Finder.”\
