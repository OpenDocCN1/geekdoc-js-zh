    Data Manipulation


    So far, most of our time has been spent learning about various ways of working
    with data. But what is just as important is the ability to change data in order
    to solve interesting challenges. Sometimes information is in an object and you
    need to extract information from it and put it in an array.


    Numbers, strings, arrays, and objects can all be modified in ways that help you
    solve challenges. Let’s get started!


    [Numbers](#part0003.xhtml_sec-70)


    Numbers are a very straightforward concept, so they don’t have too much to them.
    They can be either slightly modified or converted to a string.


    PARSEINT


    The function parseInt takes a number and turns it into a whole number. It does
    not round up or down, technically. It removes the decimal places from the number.
    More importantly, however, it is a way of taking a stringified version of a number
    and converting the actual data type to a number.


    parseInt(1322.23423); // 1322


    parseInt(''1322.23423''); // 1322


