    [5.](#part0027.xhtml_ch05_Q5)Write a table for the following loop.


    var gamers = [''super'', ''smurf'', ''sleepy'', ''moth''];


    for (var i = 0; i < gamers.length; i++) {


    var gamer = gamers[i];


    console.log(gamer);


