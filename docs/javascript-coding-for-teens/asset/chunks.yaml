    \ div;\n}\n\nvar htmlText = ['Hello!', 'I am EXTREMELY cool', 'That is because\
    \ I am a programmer'];\nvar container = document.getElementById('container');\n\
    \nfor (var i = 0; i < htmlText.length; i++) {\n  var newDiv = createDivWithText(htmlText[i]);\n\
    \  container.append(newDiv);\n}\n```\n\nPutting it all together, the HTML file\
    \ looks like this:\n\n```html\n<html>\n<head>\n</head>\n<body>\n  <div id=\"container\"\
    ></div>\n  <script>\n    function createDivWithText(text) {\n      var div = document.createElement('div');\n\
    \      div.innerHTML = text;\n      return div;\n    }\n\n    var htmlText = ['Hello!',\
    \ 'I am EXTREMELY cool', 'That is because I am a programmer'];\n    var container\
    \ = document.getElementById('container');\n\n    for (var i = 0; i < htmlText.length;\
    \ i++) {\n      var newDiv = createDivWithText(htmlText[i]);\n      container.append(newDiv);\n\
