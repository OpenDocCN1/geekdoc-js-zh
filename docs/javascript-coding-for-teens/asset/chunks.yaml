  trans: "\n\n`console.log` 在使用后会被销毁吗？绝对不会！函数可以根据需要使用任意次，或者不使用。通常，当程序员看到两种相同的操作时，他们会想出策略来减少重复编写的代码量。函数就是为此的首选策略。\n\
    \n## 抽象 (ABSTRACTION)\n\n如果剥开 `console.log` 的外壳并能够看到它的实现方式，你会看到极其复杂的内容。`console.log`\
    \ 是一个极佳的抽象。它通过简单的命令执行了复杂的运算。一些程序员付出了巨大的努力才让 `console.log` 让世界能够轻松地使用它。\n\n## 解决巨大挑战\n\
    \n主流程序复杂得令人望畏。人类的大脑无法在脑中想出复杂问题的整个解决方案。相反，你的大脑会将大挑战分解成许多较小的挑战。你一个一个解决每个小挑战并将其封装。然后，你组合所有这些小解决方案来解决眼下的问题。函数非常适合这一点。\n\
    \n## 函数创建 (Function Creation)\n\n声明函数有两种方法。这两种方法相似，你不必担心它们之间的细微差别。但作为一名 JavaScript\
    \ 程序员，你会根据情况使用这两种方法。\n\n### 函数声明 (FUNCTION DECLARATION)\n\n第一种语法是使用 `function`\
    \ 关键字并在后面加上名称。分号是可选的。这种声明风格几乎会被专门使用。\n\n```javascript\nfunction functionNameOfYourChoosing()\
    \ {\n\n// 在此处编写代码\n\n}\n```\n\n### 函数表达式 (FUNCTION EXPRESSION)\n\n第二种语法是将 `function`\
    \ 关键字赋值给一个变量，使用 `var` 进行声明。建议加上分号。这种声明风格仅在进行面向对象编程时才会使用。\n\n```javascript\nvar\
    \ functionNameOfYourChoosing = function () {\n\n// 在此处编写代码\n};\n```\n\n## 函数调用\
    \ (Function Invocation)\n\n函数名末尾的括号运行其内部的操作。正式术语是“调用”（invoke）。这种语法对于两种类型的函数声明都是完全相同的。\n\
    \n```javascript\nfunctionNameOfYourChoosing();\n```\n\n## Return 语句 (Return Statement)\n\
    \n在原生情况下，函数不会向外部世界暴露它所计算出来的数据。\n\n```javascript\nfunction add() {\n  var computed\
    \ = 5 + 5;\n}\n\nadd(); // undefined\n```\n\n这是因为你没有告诉 JavaScript 你想要它！使用 `return`\
    \ 关键字，函数可以暴露一段数据。\n\n```javascript\nfunction add() {\n  var computed = 5 + 5\n\
    \  return computed\n}\n\nadd(); // 10\n```\n\n## 函数参数 (Function Parameters)\n\n\
    在在上的示例中，`add` 函数只能将 5 和 5 相加。如果可以接收任意两个数字并将它们相加难道不是更好吗？这就是参数发挥作用的地方。\n\n参数是预先准备好的变量。这让函数能够适应许多情况。\n\
    \n```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n```\n\n\
    你已经告诉 JavaScript 在调用期间可以传入两个变量 `num1` 和 `num2`。有了参数，这个 `add` 函数就可以处理任何数字。\n\n\
    ```javascript\nadd(10, 5); // 15\nadd(20, 30); // 50\n```\n\n## 使用 Return 提前终止\
    \ (Early Termination with Return)\n\n`return` 关键字实际上有两个作用：\n\n1. 它从函数输出一个值。\n\
    2. 它停止函数的执行。\n\n你可能会发现自己不想在某个一点之后继续执行代码，或者想做一个决定并停止所有后续操作。\n\n### 极客提示 (HACKER\
    \ HINT)\n\n当你看到一个重复出现但值不同的算法时，考虑将该操作转换为带有参数的函数。\n\n### 防止加法受类型转换影响 (PROTECT ADD\
    \ FROM TYPE COERCION)\n\n让我们改进你的 `add` 函数，并使其免受错误输入的影响。还记得类型转换和 `plus` 运算符吗？\n\
    \n```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n\nadd('10',\
    \ '5'); // '105'\nadd(20, '30'); // '2030'\n```\n\n你的加法函数可以拼接字符串。但你总是想要相加，或者至少尝试这样做。让我们用提前返回来保护它。如果使用的数据不是数字，函数应该返回\
    \ `NaN`。\n\n```javascript\nfunction add(num1, num2) {\n  // 如果 num1 不是数字 或者 num2\
    \ 不是数字\n  if (typeof num1 !== 'number' || typeof num2 !== 'number') {\n    return\
    \ NaN;\n  }\n  return num1 + num2;\n}\n\nadd('10', 5); // 'NaN'\nadd(20, '30');\
    \ // 'NaN'\n```\n\n通过提前返回，你保护了函数免受类型转换或其他任何错误输入的影响。\n\n## 作用域 (Scope)\n\n现在是讨论使用函数时变量可用性的好时机。在编码术语中，变量的可用性被称为“作用域”（scope）。此后将大量编写函数。理解你需要的特定数据是否在代码的特定区域可用是非常。\n\
    \n### VAR: 函数作用域 (VAR: FUNCTION SCOPED)\n\n声明的位置现在变得了。在函数内部声明的变量仅在函数内部可用。\n\n\
    这段代码将产生意料之外的行为。\n\n```javascript\nfunction sampleFunc() {\n  var innerVariable\
    \ = '我只在这个函数内部可用';\n  console.log(innerVariable);\n}\n\nfunction otherSampleFunc()\
    \ {\n  console.log(innerVariable);\n}\n\nsampleFunc();\notherSampleFunc();\n```\n\
    \n运行 `otherSampleFunc()` 会报错。\n\n### 词法作用域 (LEXICAL SCOPE)\n\n不同的编程语言在作用域方面有自己的规则。JavaScript\
    \ 使用词法作用域。词法作用域是指变量在其自身及其内部作用域内可用。\n\n### 嵌套 (Functions Inside Functions)\n\n\
    函数写在函数内部！这创建了两个层的作用域。一个是内部作用域，另一个是外部作用域。在外部作用域声明的变量在任何内部作用域内都可用。\n\n```javascript\n\
    function outerScope() {\n  var outerVar = '我在两个作用域中都存在';\n  function innerFunc()\
    \ {\n    console.log(outerVar);\n  }\n  innerFunc();\n}\n\nouterScope();\n```\n\
    \n但内部作用域在上方无效。\n\n```javascript\nfunction outerScope() {\n  function innerFunc()\
    \ {\n    var innerVar = '我只在这里内部';\n  }\n  console.log(innerVar); // 这会失败\n  innerFunc();\n\
    }\n\nouterScope();\n```\n\n## 电竞表现 (Esports Performance)\n\n使用函数让你能够以优雅的方式解决难题。让我们在解决能力上迈上一大步！Electro\
    \ 是一支顶级电子竞技队，竞技 Undersea。在全球舞台上取得了优异的成绩。凭借丰富的阵容，他们会轮替上场和坐在场边。不参加比赛的选手被称为“板凳”选手。\n\
    \n### 选手参加比赛了吗？ (DID A PLAYER PARTICIPATE?)\n\n第一个挑战是检查选手是否参加比赛。这个函数应该处理任何可能的选手和任何比赛结果。它们必须是参数。\n\
    \n```javascript\nfunction playedInTournament(tournament, player) {\n\n}\n```\n\
    \n在此练习中，`tournament` 参数具有以下结构。它是一个对象结构，只有一个键：`players`。与键关联的值是一个选手名称数组。\n\n```javascript\n\
    {\n  players: ['smirk', 'knight', 'fly']\n}\n```\n\n现在你需要找到某个选手是否参加了比赛。对象中有一个\
    \ `players` 键。你立即知道需要一个 `for` 循环。数组嵌套在对象中，因此必须通过其键名 `players` 来访问。\n\n"
- fmt: "\n```javascript\nfunction playedInTournament(tournament, player) {\n  var\
    \ players = tournament.players;\n  for (var i = 0; i < players.length; i++) {\n\
    \    var currentPlayer = players[i];\n    if (currentPlayer === player) {\n\n\
    \    }\n  }\n}\n```\n\nIf `currentPlayer` is the `player` to check, return `true`.\
    \ But when should `false` be returned? If the check has exhausted all players\
    \ in the array, that implies the `player` has not been found at all. At the very\
    \ end of the function, return `false`.\n\n```javascript\n// tournament.js\nfunction\
    \ playedInTournament(tournament, player) {\n  var players = tournament.players;\n\
    \  for (var i = 0; i < players.length; i++) {\n    var currentPlayer = players[i];\n\
    \    if (currentPlayer === player) {\n      return true;\n    }\n  }\n  return\
    \ false;\n}\n```\n\nIt’s time to validate the code. To do so, you will need a\
    \ `console.log` in order to have the data from the function appear in the terminal.\
    \ I named the file `tournament.js`.\n\n```javascript\nvar sampleTournament = {\n\
    \  win: true,\n  players: ['smirk', 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament,\
    \ 'smirk'));\nconsole.log(playedInTournament(sampleTournament, 'superb'));\n```\n\
    \n![](Images/image00288.jpeg)\n\nLooks good! In the `sampleTournament` object,\
    \ `smirk` played but `superb` did not. Remove the two `console.log` statements\
    \ and the data structure `sampleTournament` from the file. Moving forward, they\
    \ will not be necessary.\n\n### HACKER HINT\n\nTo prevent confusion, write a table\
    \ to track what is happening on each iteration.\n\n### DATA STRUCTURES INSIDE\
    \ DATA STRUCTURES\n\nFor subsequent exercises, a list of tournament results is\
    \ required. Inside each tournament result, we also need a list of players who\
    \ participated in the tournament. Add this data structure to the file.\n\n```javascript\n\
    var tournaments = [\n  { win: true, players: ['smirk', 'knight', 'fly'] },\n \
    \ { win: true, players: ['superb', 'san', 'tired'] },\n  { win: true, players:\
    \ ['smirk', 'knight', 'tired'] },\n  { win: false, players: ['san', 'superb',\
    \ 'fly'] },\n  { win: true, players: ['smirk', 'san', 'fly'] },\n  { win: false,\
    \ players: ['superb', 'knight', 'tired'] },\n];\n```\n\n### NUMBER OF TOURNAMENTS\
    \ PLAYED\n\nThe data about player participation is inside the array of `tournaments`.\
    \ With an array of data, there is a clear need for a loop.\n\n```javascript\n\
    function tournamentsPlayed(tournaments, player) {\n  var playCount = 0;\n  for\
    \ (var i = 0; i < tournaments.length; i++) {\n    var currentTournament = tournaments[i];\n\
    \  }\n  return playCount;\n}\n```\n\nThis time, you need to check to see if the\
    \ `player` participated in the `tournament`. Not only that, but you have to keep\
    \ track of the number of times this has occurred. Figuring out if a `player` played\
    \ in a particular tournament is a lot of work. Each tournament entry needs to\
    \ have the inner array searched. But this has already been solved in `playedInTournament`.\
    \ The function can be reused instead.\n\n```javascript\nvar currentTournament\
    \ = tournaments[i];\nvar playerDidPlay = playedInTournament(currentTournament,\
    \ player);\nif (playerDidPlay) {\n  playCount += 1;\n}\n```\n\nValidate the code\
    \ by running it with `console.log`.\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments,\
    \ 'smirk'));\nconsole.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n\
    ![](Images/image00289.jpeg)\n\nLooks good. Both `smirk` and `superb` played in\
    \ three tournaments. These `console.log` statements can be removed now.\n\n###\
    \ NUMBER OF TOURNAMENTS WON\n\nNow, take it one step further. Check and see the\
    \ number of times a particular `player` has participated in a `tournament` where\
    \ the team won. To do so clearly, you will need:\n\n1. A loop\n2. An accumulator\
    \ variable to track the number of tournaments won\n\n```javascript\nfunction tournamentsWon(tournaments,\
    \ player) {\n  var winCount = 0;\n  for (var i = 0; i < tournaments.length; i++)\
    \ {\n    var currentTournament = tournaments[i];\n  }\n  return winCount;\n}\n\
    ```\n\nThings are a little different compared to `gamesPlayed`. Two conditions\
    \ are necessary:\n\n1. The `player` participated in the `tournament`\n2. The team\
    \ won\n\nLuckily, `playedInTournament` can be used for the first condition. For\
    \ the second, each entry has the tournament result, in the key `win`. You need\
    \ both to be true in order to count the game as a tournament win when that particular\
    \ `player` participated. In this case, the AND operator, `&&`, is used to assert\
    \ both at once.\n\n```javascript\nfunction tournamentsWon(tournaments, player)\
    \ {\n  var winCount = 0;\n  for (var i = 0; i < tournaments.length; i++) {\n \
    \   var currentTournament = tournaments[i];\n    var playerDidPlay = playedInTournament(currentTournament,\
    \ player);\n    var tournamentWon = currentTournament.win;\n    if (playerDidPlay\
    \ && tournamentWon) {\n      winCount += 1;\n    }\n  }\n  return winCount;\n\
    }\n```\n\nValidate the code with a `console.log`.\n\n```javascript\nconsole.log(tournamentsWon(tournaments,\
    \ 'smirk'));\nconsole.log(tournamentsWon(tournaments, 'superb'));\n```\n\n![](Images/image00290.jpeg)\n\
    \nLooks good! It looks like `smirk` has won three tournaments and `superb` has\
    \ won one.\n\n### PLAYER WIN RATE\n\nNow you are interested in determining the\
    \ win rates. To solve this, divide the number of wins by the number of tournaments.\n\
    \n```javascript\nfunction playerWinRate(tournaments, player) {\n  var total =\
    \ tournamentsPlayed(tournaments, player);\n  var won = tournamentsWon(tournaments,\
    \ player);\n  var percentage = (won / total) * 100;\n  return parseInt(percentage);\n\
    }\n```\n\n```javascript\nconsole.log(playerWinRate(tournaments, 'smirk'));\nconsole.log(playerWinRate(tournaments,\
    \ 'superb'));\n```\n\n### WHO SHOULD PLAY?\n\nOh no! It looks like there is a\
    \ dispute between two players. It appears `smirk` and `superb` both want to play\
    \ in the next tournament, but there is room for only one. To resolve this, management\
    \ has decided to check the performance of each respective player. We need to use\
    \ the win rate to determine who should play.\n\n```javascript\nfunction whoShouldPlay(tournaments,\
    \ player1, player2) {\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
    \  var player2WinRate = playerWinRate(tournaments, player2);\n  var benchedPlayer;\n\
    \  var activePlayer;\n\n  if (player1WinRate > player2WinRate) {\n    activePlayer\
    \ = player1;\n    benchedPlayer = player2;\n  } else {\n    activePlayer = player2;\n\
    \    benchedPlayer = player1;\n  }\n}\n```\n"
