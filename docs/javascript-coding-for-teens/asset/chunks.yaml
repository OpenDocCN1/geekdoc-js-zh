    ## HTML Selectors\n"
  raw: '[Debugging](#part0003.xhtml_sec-86)


    A rudimentary chat program is having problems running correctly. The method printLog
    should print the chat history. This one is a little tricky, because two objects
    are interacting with each other. You’re using data structures in an advanced way,
    so don’t be shy about using console.log to check the values of variables.


    function Person(name) {


    this.name = name;


    }


    function ChatProgram() {


    this.chatLog = [];


    }


    ChatProgram.prototype.message = function (person, message) {


    var messageEntry = {


    person: person,


    message: message


    };


    this.chatLog(messageEntry);


    };


    ChatProgram.prototype.parseMessageEntry = function (chatEntry) {


    return chatEntry.person.name + '': '' + chatEntry.chat;


    };


    ChatProgram.prototype.getLog = function () {


    var allMessages = [];


    for (var i = 0; i < this.chatLog.length; i++) {


    var chatEntry = this.chatLog[i];


    var parsedMessage = this.prototype.parseMessageEntry(chatEntry);


    allMessages.pop(parsedMessage);


    }


    return allMessages;


    };


    ChatProgram.prototype.printLog = function () {


    var allMessages = this.getLog;


    for (var i = 0; i < allMessages.length; i++) {


    console.log(allMessages[i]);


    }


    };


    var layna = new Person(''Layna'');


    var andrew = new Person(''Andrew'');


    var chat = new ChatProgram();


    chat.message(andrew, ''Hi Layna, how\''s it going?'');


    chat.message(layna, ''I\''m doing great'');


    chat.message(layna, ''What about you?'');


    chat.message(andrew, ''I just came back from the doctor'');


    chat.message(layna, ''Wow, this conversation is really boring'');


    chat.message(andrew, ''That was really mean, why would you say something like
    that?'');


    chat.message(layna, ''I have better things to do'');


    chat.message(andrew, '':('');


    chat.message(layna, ''Goodbye'');


    chat.printLog();


    This is the expected output.


    ![](Images/image00302.jpeg)


    [CODER’S CHECKLIST](#part0003.xhtml_sec-87)


    CODER’S CHECKLIST » Let’s review the topics we covered


    Object-oriented programming isn’t unique to JavaScript, but it is the first topic
    that is not universal among all programming languages. Object-oriented programming
    is one strategy, out of many, for solving a programming challenge. As you accumulate
    more techniques in your programming tool kit, you will find multiple approaches
    to solving a problem. It takes experience and intuition to discover the best way
    to solve it. If you have an idea that you’re unsure of, give it a shot anyway!
    Programming is all about learning from past mistakes. Here’s a quick review of
    what you learned in this chapter.


    ❏What an object is


    ❏What an object instance is


    ❏How to create instance variables


    ❏How to create methods


    ![](Images/image00303.jpeg)


    [CHAPTER 9](#part0003.xhtml_sec-88)


    JavaScript and the Web


    Everything that (boring) HTML can do can be done using JavaScript— and then some!
    To prove it, in this chapter, you’ll start with HTML on a web page, show how the
    same thing can be done in JavaScript, and then take it a step beyond what HTML
    can do. This is your first taste of what modern JavaScript is and where it shines.
    I hope you’re as excited as I am!


    [Abstraction Level of the Web](#part0003.xhtml_sec-89)


    Websites are on an entirely different level of abstraction when compared to your
    standard terminal. If the abstraction level of console.log is like riding a bike,
    JavaScript and its web development features are like driving a car.


    For this chapter, you are not concerned with how the tools work. You are only
    concerned with your ability to leverage the tools to perform meaningful tasks
    on the web browser.


    [HTML: HyperText Markup Language](#part0003.xhtml_sec-90)


    You will lean very heavily on JavaScript, but a small amount of hypertext markup
    language, or HTML, is still required to interact with a web page. Modern websites
    use incredible amounts of JavaScript to manipulate it.


    HTML FILE


    In the same way JavaScript has its own file extension, .js, HTML has its own file
    extension, .html. Make an HTML file. This is the bare minimum for something to
    be considered a web page. I have named mine index.html, which is the standard
    name for the first HTML file.


    ![](Images/image00304.jpeg)


    HTML TAG


    Notice the angle brackets surrounding a word? That is HTML syntax.


    <valid-html-tag-name-here>


    One has angle brackets surrounding it and one has an angle bracket and a slash.
    The angle bracket–only tag is referred to as the open tag and the other, with
    the slash, is the close tag. An open tag must have a correlating close tag.


    <html>


    </html>


    Any amount of content can be placed between the open and close tags. HTML can
    get incredibly complex!


    HTML TAGS WE WILL USE


    Because the emphasis of this book is on JavaScript, there will be only a handful
    of HTML tags covered.


    <html>


    <head>


    </head>


    <body>


    <div>


    Hello!


    </div>


    </body>


    </html>


    The html tag is the main tag that wraps around all HTML in a file. The head tag
    is multipurpose. It is usually the place where nonvisual HTML is inserted. The
    body tag is where visual elements are placed. div is a tag that doesn’t have an
    important role. It is simply used to wrap elements inside it.


    HTML ATTRIBUTES: CLASS AND ID


    There are many different HTML attributes. The syntax to apply them is the attribute
    name, an equal sign, and the value (double quotes). As a concept, it is quite
    similar to a key-value pair in an object data structure.


    <div class="container">


    I am content in a div!


    </div>


    The attributes class and id are important to have in HTML. The go-to strategy,
    when working with JavaScript, is to find HTML elements by their class or id.


    [Web Browser](#part0003.xhtml_sec-91)


    Before starting, make sure the web browser Google Chrome is installed. Not all
    browsers are built the same and Google Chrome is very good at running JavaScript.


    Search engine query: “google chrome download”


    Current URL: [google.com/chrome](http://google.com/chrome)


    WEB BROWSER DEVELOPER TOOLS


    After installation, open Google Chrome. Navigate to Settings (the triple dot at
    the top right) -> More Tools -> Developer Tools.


    The developer console will appear. As a JavaScript programmer, this is where all
    of the magic happens. JavaScript can be written inside. It is almost like a mini
    terminal built into the browser.


    ![](Images/image00305.jpeg)


    Remember the barebones [index.html](#part0022.xhtml_page104)? Find the file in
    your operating system’s (PC or Mac) file system. The easiest way to find it is
    to right click the file in VS Code and select “Reveal in File Explorer.” For Macs,
    it is “Reveal in Finder.” Code will open the directory where the file exists.


    ![](Images/image00306.jpeg)


    If the file already has the Google Chrome icon, double click the file to open
    it. The file can also be dragged and dropped to the browser window.


    ![](Images/image00307.jpeg)


    Notice how the location is not an internet URL? That’s the directory path to the
    HTML file. After confirming the file is running, modify the HTML.


    <html>


    <head>


    </head>


    <body>


    <div>


    Hello!


    </div>


    <div>


    I am EXTREMELY cool


    </div>


    </body>


    </html>


    After modification, the page has not changed. Why isn’t the browser acknowledging
    the fact that we are extremely cool? That’s because the browser has the old version
    of the file loaded. In order to see updates, refresh the page.


    ![](Images/image00308.jpeg)


    After a refresh, we see our update. Very nice!


    ![](Images/image00309.jpeg)


    [Document](#part0003.xhtml_sec-92)


    In the browser, there is a variable that is automatically created called document.
    Type it into the developer console. The variable is a JavaScript object that refers
    to the entire page. After expansion, all the HTML is revealed. Use your mouse
    cursor and hover over the document variable. Notice how the web page is blue?


    ![](Images/image00310.jpeg)


    The developer console highlights HTML that the cursor is hovering over. To further
    prove this, expand the body and hover over a highlighted div element.


    ![](Images/image00311.jpeg)


