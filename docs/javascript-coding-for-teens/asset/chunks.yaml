    You’ve come a long way! You are now officially done with programming fundamentals.
    Moving forward, you are going to learn about features that are more specific to
    JavaScript. That means object-oriented programming and website programming. The
    challenges are going to get harder, but you’ve been slowly building yourself up
    to make sure you’re prepared to face them.


    ❏Adding and removing elements from an array


    ❏Converting a string of numbers into the number data type


    ❏Accessing characters in a string by index


    ❏Adding and updating keys in an object


    ![](Images/image00300.jpeg)


    [CHAPTER 8](#part0003.xhtml_sec-80)


    Object-Oriented Programming


    So far, we have discussed that an object is a data structure that holds key-value
    pairs. It is also important to know that the word “object” has multiple meanings
    in JavaScript. The objects that will be discussed are a core design principle
    that JavaScript is built on. In this chapter, you’ll be making your own and applying
    them in challenges where their utility shines!


    [Objects as Entities](#part0003.xhtml_sec-81)


    There is a type of data in JavaScript that is called an “object” but is not a
    data structure. It is an entity—a collection of functions and properties wrapped
    up in a tidy package. Let’s look at a few examples to learn more about objects.


    DOGS AS REAL-WORLD OBJECTS


    Let’s describe a dog in a technical fashion. They have many qualifiable aspects
    about them, such as age, name, sex, and fur color. Dogs are also capable of performing
    actions, such as running, barking, and eating.


    DOGS AS INDIVIDUALS


    What about a specific dog? My neighbor has a dog whose name is Sparky. My favorite
    part about Sparky is the fact that he barks very loudly at 6:00 a.m. I love waking
    up to Sparky’s barking, because I don’t like getting eight hours of quality sleep
    each night. There are many dogs who share all of the same properties, but there
    is only one Sparky, the special dog in my neighborhood who likes to remind me
    that sleeping is a bad idea.


    JAVASCRIPT OBJECT INSTANCE


    Sparky is the only dog in the world who is Sparky. So, they are their own entity.
    In JavaScript, Sparky would be referred to as an object instance.


    var sparky = new Dog();


    [Dogs as JavaScript Objects](#part0003.xhtml_sec-82)


    The ideas that were just presented have the same parallels in programming. A dog
    object would have many properties about itself and have many methods that it could
    invoke.


