    ![](Images/image00336.jpeg)


    [CHAPTER 10](#part0003.xhtml_sec-105)


    Game Time


    You made it! Your tool kit now consists of programming fundamentals, object-oriented
    programming, and web-specific JavaScript. You have covered all of the fundamentals
    that this book has to offer. That being said, what good are these lessons if you
    don’t do anything with them? Let’s wrap it up by creating a game—one that will
    run on the browser.


    [Hangman on the Browser](#part0003.xhtml_sec-106)


    The game of choice is Hangman. Sure, you’ve made Hangman for the terminal. The
    fundamentals don’t change. But when it comes to the browser, some parts of the
    implementation are tricky!


    [Hangman: Terminal vs. Browser](#part0003.xhtml_sec-107)


    The main difference between browser and terminal are the graphics. Instead of
    console.log, HTML needs to be modified. For example, the way you decide whether
    a player has lost is identical.


    Hangman.prototype.playerLost = function () {


    return this.remainingBadGuesses === 0;


    };


    On the other hand, the way guessed characters are shown is going to be completely
    different. On the browser, a console.log isn’t going to cut it anymore!


    Hangman.prototype.showGuessedCharacters = function() {


    var str = '''';


    for (var i = 0; i < this.charactersGuessed.length; i++) {


    var currChar = this.charactersGuessed[i];


    str += currChar;


    str += '' '';


    }


    console.log(''You have currently guessed the following characters:'');


    console.log(str);


    };


    Content must be visually expressed using HTML. In the same way you need to use
    clever tricks to solve algorithms, you need to get creative to manipulate HTML.


    [Hangman Implementation](#part0003.xhtml_sec-108)


    None of the rules of Hangman change. A majority of the smaller challenges from
    the previous chapters are the same. The difference is the implementation.


    Before starting, revisit the game conditions. This is an identical template from
    the [object-oriented programming](#part0020.xhtml_sec_80) chapter.


    Variables to Track:


    →The secret word


    →Characters guessed


    →Total number of bad guesses before losing


    Terminating Conditions:


    →If the player has made six bad guesses, the player has lost.


    →If the player has guessed all the characters in the secret word, the player has
    won.


    Hangman Game Cycle:


    →Show characters that have been guessed.


    →Prompt the player to guess a character.


    →Add the guessed character to a character bank.


    →Reveal correctly guessed characters in the secret word.


    Game Bounds:


    →Prevent identical guesses.


    →Prevent non-alphabetic guesses.


    →Ignore capitalization when guessing.


    GAME GRAPHICS


    You need to show the player what is happening while they are playing the game.
    Everything that was done on the terminal, with raw text, now must be done on the
    browser, with HTML manipulation. To do so you will implement the following rules:


    1.When the game starts


    a.Blank spaces for the secret word


    b.Space to show letters that have been guessed


    c.Message bar to display game feedback to the player


    d.Hangman progress on the rope


    2.When the player guesses a character


    a.If character is correct


    •Inform them using message in the message bar


    •Reveal it in the secret word section


    •Add to the list of guessed characters


    b.If character is wrong


    •Tell them using a message


    •Add a body part to the person


    •Add to the list of guessed characters


    c.If character has been previously guessed


    •Tell them using a message


    •Ignore the guess


    3.Check to see if the player has won or lost


    a.If neither won or lost, continue game


    b.If won, open game over screen and tell them they won


    c.If lost, open game over screen and tell them they lost


    d.If won or lost, allow game resetting


    [HTML File](#part0003.xhtml_sec-109)


    Before coding, an HTML file is needed, or else JavaScript would have nothing to
    manipulate! Here is the file in full. This is including the CSS and JavaScript
    imports, with link and script tags. Each part will be individually examined.


    <html>


    <head>


    <link rel="stylesheet" href="hangman.css">


    <link rel="stylesheet" href="person.css">


    </head>


    <body>


    <div>


    <div id="rope">


    |


    </div>


    <div id="pole">


    </div>


    </div>


    <div id="person">


    <div id="head" class="appendage intact">


    o


    </div>


    <div id="torso">


    <div id="arm-left" class="appendage intact">


    /


    </div>


    <div id="body" class="appendage intact">


    |


    </div>


    <div id="arm-right" class="appendage intact">


    \


    </div>


    </div>


    <div id="lower">


    <div id="leg-left" class="appendage intact">


    /


    </div>


    <div id="leg-right" class="appendage intact">


    \


    </div>


    </div>


    </div>


    <div id="game">


    <div id="guessed-characters">


    </div>


    <div id="secret-word">


    </div>


    <div id="game-message">


    </div>


    </div>


    <div id="game-end" class="no-display">


    <div id="game-end-message" class="end-text">


    </div>


    <div id="revealed-secret" class="end-text">


    </div>


    <button id="restart-game" class="end-text">


    Play again


    </button>


    </div>


    </body>


    <script src="hangman.js"></script>


    </html>


    HANGMAN PROGRESS


    This is the set of elements that create your person to be hanged. All of the elements
    are hidden when the game starts and will progressively be revealed when the player
    gives incorrect guesses. Body-part revealing will be performed by removing the
    class “intact”.


    <div id="person">


    <div id="head" class="appendage intact">


    o


    </div>


    <div id="torso">


    <div id="arm-left" class="appendage intact">


    /


    </div>


    <div id="body" class="appendage intact">


    |


    </div>


    <div id="arm-right" class="appendage intact">


    \


    </div>


    </div>


    <div id="lower">


    <div id="leg-left" class="appendage intact">


    /


    </div>


    <div id="leg-right" class="appendage intact">


    \


    </div>


    </div>


    </div>


    GUESSED CHARACTERS


    In the terminal, console.log was used. This time, HTML div elements with the character
    is required. Those div elements will be inserted inside.


    <div id="guessed-characters">


    </div>


    SECRET WORD


    When the game starts, all of the characters will be pre-inserted into the page
    as div elements with the characters inside. JavaScript and CSS will be used to
    reveal them when they have been correctly guessed.


    <div id="secret-word">


    </div>


    GAME OVER SCREEN


    The game over HTML is prepared but is hidden using CSS, with the class “no-display”.
    Once the game ends in a win or loss, this content will be revealed. JavaScript
    will be used to display a message, reveal the secret word, and give the player
    an option to reset the game and play again.


    <div id="game-end" class="no-display">


    <div id="game-end-message" class="end-text">


    </div>


    <div id="revealed-secret" class="end-text">


    </div>


    <button id="restart-game" class="end-text">


    Play again


    </button>


    </div>


    [CSS Game Files](#part0003.xhtml_sec-110)


    As stated previously, this book won’t be covering the inner workings of the CSS.
    So far, only the role of each id and class has been discussed. In addition to
    that, in order to complete the task at hand, below is all of the necessary CSS
    that you will need to know. Remember that the file name is important.


    hangman.css


