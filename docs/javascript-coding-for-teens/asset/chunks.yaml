    var dogBreeds = [''pug'', ''golden retriever'', ''german shepherd''];


    for (var i = 0; i < dogBreeds.length; i++) {


    var breed = dogBreeds[i];


    console.log(breed);


    }


    | ITERATION | I | CONDITION | BREED |


    |  |  |  |  |


