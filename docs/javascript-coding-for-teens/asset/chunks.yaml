- fmt: "\nIn the same way `parseInt` parses a number and a string version of a number,\
    \ `parseFloat` does, too, except it keeps all decimal values from the original\
    \ number.\n\n```javascript\nparseFloat(1322.23423); // 1322.23423\nparseFloat('1322.23423');\
    \ // 1322.23423\n```\n\n## Strings\n\nWithin the scope of this book, most string\
    \ operations will be omitted. But there are still two important manipulations\
    \ to be mindful of.\n\n### ACCESS BY INDEX\n\nFor some algorithms, it is important\
    \ to inspect a string, element by element. This can be accomplished by accessing\
    \ each character by index. The way strings and arrays access elements, by index,\
    \ is identical.\n\n```javascript\nvar dog = 'Misu';\ndog[0]; // 'M'\ndog[2]; //\
    \ 's'\n```\n\n### TOLOWERCASE AND TOUPPERCASE\n\nTo change the characters to all\
    \ lower or all upper cases can be done using `toLowerCase` and `toUpperCase`,\
    \ respectively.\n\n```javascript\nvar dog = 'Misu';\ndog.toLowerCase(); // 'misu'\n\
    dog.toUpperCase(); // 'MISU'\n```\n\nWait! Why is this function being used behind\
    \ the variable name? Well, the function is technically a method. There will be\
    \ a deep dive into the purpose and reason of this difference. For the time being,\
    \ just know that methods are invoked with this syntax.\n\n## Arrays\n\nModifying\
    \ arrays is so common that JavaScript includes many built-in operations to modify\
    \ them in the ways we need.\n\n### INSERTION\n\nEntries in an array are accessed\
    \ by index.\n\n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\n\
    animals[0]; // 'dog'\n```\n\nThe same syntax to access an entry in an array can\
    \ also be used to reassign a new value into an index.\n\n```javascript\nvar animals\
    \ = ['dog', 'cat', 'horse', 'bird'];\nanimals[0] = 'pig';\nanimals[0]; // 'pig'\n\
    ```\n\n### PUSH\n\nA common operation is inserting at the end of an array. The\
    \ array method name is `push`.\n\n```javascript\nvar sampleArray = [];\nsampleArray.push(10);\n\
    sampleArray; // [10]\n```\n\n### POP\n\nAnother common operation is the removal\
    \ of the last entry in the array, using the method `pop`.\n\n```javascript\nvar\
    \ sampleArray = [2, 10];\nsampleArray.pop();\nsampleArray; // [2]\n```\n\n###\
    \ SHIFT\n\nThe first element of an array can be removed using the method `shift`.\n\
    \n```javascript\nvar sampleArray = [2, 10];\nsampleArray.shift();\nsampleArray;\
    \ // [10]\n```\n\n### UNSHIFT\n\nThe last array operation is `unshift`, which\
    \ inserts an element to the front of the array.\n\n```javascript\nvar sampleArray\
    \ = [2, 10];\nsampleArray.unshift(5);\nsampleArray; // [5, 2, 10]\n```\n\n## Objects\n\
    \nCompared to arrays, objects are not modified to the same extent. This is for\
    \ more advanced, technical reasons. But objects still support insertion, replacement,\
    \ and deletion.\n\n### INSERTION AND REPLACEMENT\n\nObject value insertion is\
    \ performed with the equal sign.\n\n```javascript\nvar animals = {};\nanimals.dog\
    \ = 'sparky';\nanimals; // { dog: 'sparky' }\n```\n\nThe syntax for insertion\
    \ is the same as replace. If the key already exists, it will replace the value.\n\
    \n```javascript\nvar animals = {\n  dog: 'sparky'\n};\nanimals.dog = 'not sparky';\n\
    animals; // { dog: 'not sparky' }\n```\n\n### DELETION\n\nRemoving an element\
    \ from an object is an uncommon operation. The `delete` operator removes a key-value\
    \ pair in an object.\n\n```javascript\nvar animals = {\n  dog: 'sparky'\n};\n\
    delete animals.dog;\nanimals; // { }\n```\n\n## Mutation\n\nThe idea of modifying\
    \ a data type, as opposed to always making a new version, is referred to as mutability.\
    \ An operation can be mutative, which means it modifies the existing data. A piece\
    \ of data can also be referred to as immutable, which means it fundamentally cannot\
    \ be modified.\n\nIn the below example, we did not assign or reassign to a new\
    \ variable when using the array and object operations. That is because `push`,\
    \ `pop`, `shift`, and `unshift` are operations that mutate the existing array.\
    \ The operations that were shown are ones that change the existing data structure.\n\
    \n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\nanimals.push('lizard');\n\
    animals; // ['dog', 'cat', 'horse', 'bird', 'lizard'];\n```\n\nIn fact, reassigning\
    \ is a very bad thing. It can create very unintuitive code.\n\n```javascript\n\
    var animals = ['dog', 'cat', 'horse', 'bird'];\nanimals = animals.push('lizard');\n\
    animals; // 5\n```\n\nThe return value is 5 because that is the length of the\
    \ new array, after pushing lizard into it. But that probably is not the desired\
    \ output. More likely than not, the desired output is the array itself.\n\n###\
    \ STRINGS ARE IMMUTABLE\n\n```javascript\nvar animal = 'd';\nanimal += 'og';\n\
    animal; // 'dog'\n```\n\nHave you noticed how you have been using the reassign\
    \ operator? That’s because strings are immutable. An existing string cannot be\
    \ updated. It must be reassigned to create an entirely new string.\n\n```javascript\n\
    var animal = 'd';\nanimal + 'dog';\nanimal; // 'd'\n```\n\nBecause of the fact\
    \ that JavaScript’s strings are immutable, string concatenation does not modify\
    \ `animal`.\n\n## Data Manipulation in Action\n\nIt is much easier to understand\
    \ data manipulation when you see it in action. We’ll also go over the most common\
    \ data manipulation strategies you will encounter. Let’s get started!\n\n### BUILDING\
    \ A NEW ARRAY\n\nTaking an array and modifying it, in one form or another, is\
    \ one of the most common operations in all programs. In many situations, it is\
    \ more advantageous to build an entirely new array than to modify the existing\
    \ one.\n\nGiven the following array, create an array of the names of players with\
    \ a skill level that is higher than 5.\n\n```javascript\nvar players = [\n  {\
    \ name: 'superb', skill: 3 },\n  { name: 'smirk', skill: 7 },\n  { name: 'tired',\
    \ skill: 6 },\n  { name: 'ANS', skill: 9 }\n];\n```\n\nThis is the expected output:\n\
    `['smirk', 'tired', 'ANS']`\n\nTo make the code more manageable, you will place\
    \ the algorithm in a function. If there is an array of elements to inspect, a\
    \ `for` loop should be your first thought.\n\n```javascript\nfunction getSkilledPlayers(allPlayers)\
    \ {\n  for (var i = 0; i < allPlayers.length; i++) {\n    // logic here\n  }\n\
    }\n```\n\nThe pseudo code would look like this:\n```javascript\nfunction getSkilledPlayers(allPlayers)\
    \ {\n  var skilledPlayers = [];\n  for (var i = 0; i < allPlayers.length; i++)\
    \ {\n    // inspect each element, one by one\n    // if player meets the criteria,\
    \ push in their name\n  }\n  return skilledPlayers;\n}\n```\n\nPutting it all\
    \ together, this is your code and your expected output:\n\n```javascript\nfunction\
    \ getSkilledPlayers(allPlayers) {\n  var skilledPlayers = [];\n  for (var i =\
    \ 0; i < allPlayers.length; i++) {\n    var player = allPlayers[i];\n    if (player.skill\
    \ > 5) {\n      skilledPlayers.push(player.name);\n    }\n  }\n  return skilledPlayers;\n\
    }\n\nconsole.log(getSkilledPlayers(players));\n```\n\nFor good measure, a table\
    \ can be written to see how values are changing after each iteration:\n\n| ITERATION\
    \ | PLAYER.NAME | PLAYER.SKILL | PLAYER.SKILL > 5 | SKILLEDPLAYERS |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| | | | | [] |\n| 1 | superb | 3 | false | [] |\n\
    | 2 | smirk | 7 | true | ['smirk'] |\n| 3 | tired | 6 | true | ['smirk', 'tired']\
    \ |\n| 4 | ANS | 9 | true | ['smirk', 'tired', 'ANS'] |\n\n## HACKER HINT\n"
  raw: 'In the same way parseInt parses a number and a string version of a number,
    parseFloat does, too, except it keeps all decimal values from the original number.


    parseFloat(1322.23423); // 1322.23423


    parseFloat(''1322.23423''); // 1322.23423


    [Strings](#part0003.xhtml_sec-71)


    Within the scope of this book, most string operations will be omitted. But there
    are still two important manipulations to be mindful of.


    ACCESSING BY INDEX


    For some algorithms, it is important to inspect a string, element by element.
    This can be accomplished by accessing each character by index. The way strings
    and arrays access elements, by index, is identical.


    var dog = ''Misu'';


    dog[0]; // ''M''


    dog[2]; // ''s''


    TOLOWERCASE AND TOUPPERCASE


    To change the characters to all lower or all upper cases can be done using toLowerCase
    and toUpperCase, respectively.


    var dog = ''Misu'';


    dog.toLowerCase(); // ''misu''


    dog.toUpperCase(); // ''MISU''


    Wait! Why is this function being used behind the variable name? Well, the function
    is technically a method. There will be a deep dive into the purpose and reason
    of this difference. For the time being, just know that methods are invoked with
    this syntax.


    [Arrays](#part0003.xhtml_sec-72)


    Modifying arrays is so common that JavaScript includes many built-in operations
    to modify them in the ways we need.


    INSERTION


    Entries in an array are accessed by index.


    var animals = [''dog'', ''cat'', ''horse'', ''bird''];


    animals[0]; // ''dog''


    The same syntax to access an entry in an array can also be used to reassign a
    new value into an index.


    var animals = [''dog'', ''cat'', ''horse'', ''bird''];


    animals[0] = ''pig'';


    animals[0]; // ''pig''


    PUSH


    A common operation is inserting at the end of an array. The array method name
    is push.


    var sampleArray = [];


    sampleArray.push(10);


    sampleArray; // [10]


    POP


    Another common operation is the removal of the last entry in the array, using
    the method pop.


    var sampleArray = [2, 10];


    sampleArray.pop();


    sampleArray; // [2]


    SHIFT


    The first element of an array can removed using the method shift.


    var sampleArray = [2, 10];


    sampleArray.shift();


    sampleArray; // [10]


    UNSHIFT


    The last array operation is unshift, which inserts an element to the front of
    the array.


    var sampleArray = [2, 10];


    sampleArray.unshift(5);


    sampleArray; // [5, 2, 10]


    [Objects](#part0003.xhtml_sec-73)


    Compared to arrays, objects are not modified to the same extent. This is for more
    advanced, technical reasons. But objects still support insertion, replacement,
    and deletion.


    INSERTION AND REPLACEMENT


    Object value insertion is performed with the equal sign.


    var animals = {};


    animals.dog = ''sparky'';


    animals; // { dog: ''sparky'' }


    The syntax for insertion is the same as replace. If the key already exists, it
    will replace the value.


    var animals = {


    dog: ''sparky''


    };


    animals.dog = ''not sparky'';


    animals; // { dog: ''not sparky'' }


    DELETION


    Removing an element from an object is an uncommon operation. The delete operator
    removes a key-value pair in an object.


    var animals = {


    dog: ''sparky''


    };


    delete animals.dog;


    animals; // { }


    [Mutation](#part0003.xhtml_sec-74)


    The idea of modifying a data type, as opposed to always making a new version,
    is referred to as mutability. An operation can be mutative, which means it modifies
    the existing data. A piece of data can also be referred to as immutable, which
    means it fundamentally cannot be modified.


    In the below example, we did not assign or reassign to a new variable when using
    the array and object operations. That is because push, pop, shift, and unshift
    are operations that mutate the existing array. The operations that were shown
    are ones that change the existing data structure.


    var animals = [''dog'', ''cat'', ''horse'', ''bird''];


    animals.push(''lizard'');


    animals; // [''dog'', ''cat'', ''horse'', ''bird'', ''lizard''];


    In fact, reassigning is a very bad thing. It can create very unintuitive code.


    var animals = [''dog'', ''cat'', ''horse'', ''bird''];


    animals = animals.push(''lizard'');


    animals; // 5


    The return value is 5 because that is the length of the new array, after pushing
    lizard into it. But that probably is not the desired output. More likely than
    not, the desired output is the array itself.


    STRINGS ARE IMMUTABLE


    var animal = ''d'';


    animal += ''og'';


    animal; // ''dog


    Have you noticed how you have been using the reassign operator? That’s because
    strings are immutable. An existing string cannot be updated. It must be reassigned
    to create an entirely new string.


    var animal = ''d'';


    animal + ''dog'';


    animal; // ''d''


    Because of the fact that JavaScript’s strings are immutable, string concatenation
    does not modify animal.


    [Data Manipulation in Action](#part0003.xhtml_sec-75)


    It is much easier to understand data manipulation when you see it in action. We’ll
    also go over the most common data manipulation strategies you will encounter.
    Let’s get started!


    BUILDING A NEW ARRAY


    Taking an array and modifying it, in one form or another, is one of the most common
    operations in all programs. In many situations, it is more advantageous to build
    an entirely new array than to modify the existing one.


    Given the following array, create an array of the names of players with a skill
    level that is higher than 5.


    var players = [


    { name: ''superb'', skill: 3 },


    { name: ''smirk'', skill: 7 },


    { name: ''tired'', skill: 6 },


    { name: ''ANS'', skill: 9 }


    ];


    This is the expected output.


    [''smirk'', ''tired'', ''ANS''];


    To make the code more manageable, you will place the algorithm in a function.
    If there is an array of elements to inspect, a for loop should be your first thought.


    function getSkilledPlayers(allPlayers) {


    for (var i = 0; i < allPlayers.length; i++) {


    }


    }


    Start with an empty array and continually push in players (if they are skilled)
    into it. The pseudo code would look something like this.


    function getSkilledPlayers(allPlayers) {


    start with an empty array


    inspect each element, one by one


    if the player is skilled, add the player’s name to the empty array


    return the new array


    }


    First, prep the loop, our empty array, and return value.


    function getSkilledPlayers(allPlayers) {


    var skilledPlayers = [];


    for (var i = 0; i < allPlayers.length; i++) {


    var player = allPlayers[i]


    }


    return skilledPlayers;


    }


    You are interested in whether the player is of a certain caliber of skill. Clearly,
    a conditional is needed.


    function getSkilledPlayers(allPlayers) {


    var skilledPlayers = [];


    for (var i = 0; i < allPlayers.length; i++) {


    var player = allPlayers[i]


    if (player.skill > 5) {


    }


    }


    return skilledPlayers;


    }


    So far, nothing is new. You have seen all of this logic before. But this time
    around, the array needs to be built up, one by one. If a particular player meets
    the criteria, push in their name.


    function getSkilledPlayers(allPlayers) {


    var skilledPlayers = [];


    for (var i = 0; i < allPlayers.length; i++) {


    var player = allPlayers[i];


    if (player.skill > 5) {


    skilledPlayers.push(player.name);


    }


    }


    return skilledPlayers;


    }


    Putting it all together, this is your code and your expected output.


    var players = [


    { name: ''superb'', skill: 3 },


    { name: ''smirk'', skill: 7 },


    { name: ''tired'', skill: 6 },


    { name: ''ANS'', skill: 9 }


    ];


    function getSkilledPlayers(allPlayers) {


    var skilledPlayers = [];


    for (var i = 0; i < allPlayers.length; i++) {


    var player = allPlayers[i];


    if (player.skill > 5) {


    skilledPlayers.push(player.name);


    }


    }


    return skilledPlayers;


    }


    console.log(getSkilledPlayers(players));


    ![](Images/image00298.jpeg)


    For good measure, a table can be written to see how values are changing after
    each iteration.


    | ITERATION | PLAYER.NAME | PLAYER.SKILL | PLAYER.SKILL > 5 | SKILLEDPLAYERS |


    |  |  |  |  | [] |


    | 1 | superb | 3 | false | [] |


    | 2 | smirk | 7 | true | [‘smirk’] |


    | 3 | tired | 6 | true | [‘smirk’, ‘tired’] |


    | 4 | ANS | 9 | true | [‘smirk’, ‘tired’, ‘ANS’] |


