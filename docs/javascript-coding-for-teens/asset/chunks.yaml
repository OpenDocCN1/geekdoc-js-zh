    iterate over the array of bills.


    var bills = [1, 1, 5, 10, 20];


    for (var i = 0; i < bills.length; i++) {


    }


    The variable index is shortened to i. This is the common variable name when tracking
    index in a loop.


    In order to track the amount of money, a variable is needed. The value will start
    at 0, because your loop has not counted any money yet.


    var total = 0;


    This type of variable is commonly referred to as an accumulator. It will progressively
    increase in value after every iteration of our loop. It “accumulates” value after
    each bill is visited.


    Putting it all together, the value of each bill by index increases the value of
    total, the accumulator.


    var bills = [1, 1, 5, 10, 20];


    var total = 0;


    for (var i = 0; i < bills.length; i++) {


    var currentValue = bills[i];


    total += currentValue;


    }


    console.log(total);


    To make sure you have a full understanding of what is happening, let’s create
    another table that represents each iteration.


    | ITERATION | I | CONDITION | CURRENTVALUE | TOTAL | BILLS |


    | 1 | 0 | 0 < 5 | 1 | 1 | [1, 1, 5, 10, 20] |


    | 2 | 1 | 1 < 5 | 1 | 2 | [1, 1, 5, 10, 20] |


    | 3 | 2 | 2 < 5 | 5 | 7 | [1, 1, 5, 10, 20] |


    | 4 | 3 | 3 < 5 | 10 | 17 | [1, 1, 5, 10, 20] |


    | 5 | 4 | 4 < 5 | 20 | 37 | [1, 1, 5, 10, 20] |


    [Crack the Code](#part0003.xhtml_sec-54)


