    [3.](#part0027.xhtml_ch05_D3)The loop is iterating one too many times. The last
    value printed is undefined.


    var hangmanLetters = [''d'', ''a'', ''r'', ''k'', ''s'', ''o'', ''u'', ''l'',
    ''s''];


    for (var i = 0; i <= hangmanLetters.length; i++) {


    console.log(hangmanLetters[i]);


    }


    [4.](#part0027.xhtml_ch05_D4)The loop is not printing the cat names.


    var catNames = [''Pegasus'', ''Maximillion'', ''Joey''];


    for (var i; i < catNames.length; i++) {


