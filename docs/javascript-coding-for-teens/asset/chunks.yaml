    function destroyArray(array) {


    var i = 0;


    while (array.length > 0) {


    array.pop();


    i++;


    }


    }


    var arr = [10, 20, 12, 30, 25];


    destroyArray(arr);


    [7.](#part0027.xhtml_ch07_Q7)What is the output of the following code? Draw a
    table if necessary.


    function modifyString(str) {


    var newStr = '''';


    for (var i = 0; i < str.length - 1; i++) {


    newStr += str[i];


    }


    return newStr;


    }


    modifyString(''abcdefg'')


