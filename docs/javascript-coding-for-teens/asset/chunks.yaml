  trans: "\n\n# JavaScript HTML 选择器\n# 使用 JavaScript 修改 HTML 元素\n# 事件监听器\n\n![](img/image00336.jpeg)\n\
    \n## 第 10 章：游戏时间\n\n你做到了！你的工具箱现在包含了编程基础、面向对象编程以及针对 Web 的特定 JavaScript。你已经涵盖了本书提供的所有基础知识。尽管如此，如果你不对这些知识做任何事情，这些课程又有什么用呢？让我们通过创建一个游戏来结束课程——一个运行在浏览器上的游戏。\n\
    \n### 浏览器上的猜字游戏\n\n我们选择的游戏是猜字游戏。当然，你已经在终端做过猜字游戏了。基础知识并没有改变。但当涉及到浏览器时，实现的某些部分会棘手！\n\
    \n### 猜字游戏：终端 vs 浏览器\n\n浏览器和终端的主要区别在于图形。不再使用 `console.log`，而是需要修改 HTML。例如，判断玩家是否输掉的方法是完全一样的。\n\
    \n```javascript\nHangman.prototype.playerLost = function () {\n  return this.remainingBadGuesses\
    \ === 0;\n};\n```\n\n另一方面，显示已猜字符的方式将完全不同。在浏览器上，`console.log` 已经不再够用了！\n\n```javascript\n\
    Hangman.prototype.showGuessedCharacters = function() {\n  var str = '';\n  for\
    \ (var i = 0; i < this.charactersGuessed.length; i++) {\n    var currChar = this.charactersGuessed[i];\n\
    \    str += currChar;\n    str += ' ';\n  }\n  console.log('You have currently\
    \ guessed the following characters:');\n  console.log(str);\n};\n```\n\n内容必须使用\
    \ HTML 进行视觉表达。就像你需要使用巧妙的技巧来解决算法一样，你需要发挥创造力来操作 HTML。\n\n### 猜字游戏实现\n\n猜字游戏的任何规则都没有改变。之前章节中的大多数小型挑战都是相同的。区别在于实现。\n\
    \n在开始之前，重新回顾游戏条件。这与面向对象编程章节中的模板相同。\n\n**需要跟踪的变量：**\n* 秘密单词\n* 已猜字符\n* 输掉之前的错误猜测总数\n\
    \n**终止条件：**\n* 如果玩家进行了六次错误猜测，玩家输了。\n* 如果玩家猜中了秘密单词中的所有字符，玩家赢了。\n\n**猜字游戏循环：**\n\
    * 显示已猜的字符。\n* 提示玩家猜一个字符。\n* 将猜到的字符添加到字符库中。\n* 显示秘密单词中猜对的字符。\n\n**游戏边界：**\n* 防止重复猜测。\n\
    * 防止非字母猜测。\n* 猜词时忽略大小写。\n\n## 游戏图形\n\n你需要向玩家展示他们在玩游戏时发生了什么。所有在终端上用原始文本完成的操作，现在必须在浏览器上通过\
    \ HTML 操作完成。为了做到，你将实现以下规则：\n\n1. **当游戏开始时**\n    * a. 秘密单词的空白区域\n    * b. 显示已猜字母的空间\n\
    \    * c. 用于向玩家显示游戏反馈的消息栏\n    * d. 绳子上的猜字游戏进度\n2. **当玩家猜一个字符时**\n    * a. **如果字符正确**\n\
    \        * 使用消息栏中的消息通知他们\n        * 在秘密单词区域揭示它\n        * 添加到已猜字符列表\n    * b.\
    \ **如果字符错误**\n        * 使用消息告诉他们\n        * 在人身上添加一个身体部位\n        * 添加到已猜字符列表\n\
    \    * c. **如果字符之前被猜过**\n        * 使用消息告诉他们\n        * 忽略该猜测\n3. **检查玩家是否赢了或输**\n\
    \    * a. 如果既没赢也没输，继续游戏\n    * b. 如果赢了，打开游戏结束界面并告诉他们赢了\n    * c. 如果输了，打开游戏结束界面并告诉他们输了\n\
    \    * d. 如果赢了或输了，允许重置游戏\n\n### HTML 文件\n\n在编码之前，需要一个 HTML 文件，否则 JavaScript 将无物可操作！这里是完整的文件。这包含了\
    \ CSS 和 JavaScript 的导入，带有 link 和 script 标签。每个部分将被逐一检查。\n\n```html\n<html>\n<head>\n\
    \  <link rel=\"stylesheet\" href=\"hangman.css\">\n  <link rel=\"stylesheet\"\
    \ href=\"person.css\">\n</head>\n<body>\n  <div>\n    <div id=\"rope\">|</div>\n\
    \    <div id=\"pole\"></div>\n  </div>\n  <div id=\"person\">\n    <div id=\"\
    head\" class=\"appendage intact\">o</div>\n    <div id=\"torso\">\n      <div\
    \ id=\"arm-left\" class=\"appendage intact\">/</</div>\n      <div id=\"body\"\
    \ class=\"appendage intact\">|</div>\n      <div id=\"arm-right\" class=\"appendage\
    \ intact\">\\</div>\n    </div>\n    <div id=\"lower\">\n      <div id=\"leg-left\"\
    \ class=\"appendage intact\">/</</div>\n      <div id=\"leg-right\" class=\"appendage\
    \ intact\">\\</div>\n    </div>\n  </div>\n  <div id=\"game\">\n    <div id=\"\
    guessed-characters\"></div>\n    <div id=\"secret\"></div>\n    <div id=\"message\"\
    ></div>\n    <div id=\"game-end\">\n      <div id=\"game-message\"></div>\n  \
    \    <div id=\"revealed-secret\"></div>\n      <button id=\"restart-game\">Play\
    \ again</button>\n    </div>\n  </div>\n  <script src=\"hangman.js\"></script>\n\
    </body>\n</html>\n```\n\n### 进度\n\n你需要向玩家展示他们在玩游戏时发生了什么。所有在终端上用原始文本完成的操作，现在必须在浏览器上通过\
    \ HTML 操作完成。为了做到，你将实现以下规则：\n\n```html\n<div id=\"person\">\n  <div id=\"head\"\
    \ class=\"appendage intact\">o</div>\n  <div id=\"torso\">\n    <div id=\"arm-left\"\
    \ class=\"appendage intact\">/</</div>\n    <div id=\"body\" class=\"appendage\
    \ intact\">|</div>\n    <div id=\"arm-right\" class=\"appendage intact\">\\</div>\n\
    \  </div>\n  <div id=\"lower\">\n    <div id=\"leg-left\" class=\"appendage intact\"\
    >/</</div>\n    <div id=\"leg-right\" class=\"appendage intact\">\\</div>\n  </div>\n\
    </div>\n```\n\n### 已猜字符\n\n在终端中，使用了 `console.log`。这次，是通过 HTML 元素插入的。\n\n```html\n\
    <div id=\"guessed-characters\"></div>\n```\n\n### 秘密单词\n\n当游戏开始时，所有的字符都将。\n\n\
    ```html\n<div id=\"secret\"></div>\n```\n\n### 游戏结束界面\n\n游戏结束已准备就，但使用 CSS 隐藏。一旦游戏结束，它将被显示。这\n\
    \n```html\n<div id=\"game-end\">\n  <div id=\"game-message\"></div>\n  <div id=\"\
    revealed-secret\"></div>\n  <button id=\"restart-game\">Play again</button>\n\
    </div>\n```\n\n### CSS 游戏文件\n\n正如之前提到的，本书将涵盖 CSS 的内部工作机制。到为止，只讨论了每个 id 和类的作用。此外，为了完成手头的任务，下面是你需要知道的所有\
    \ CSS。记住文件名是非常重要的。\n\n```css\nbody {\n  width: 500px;\n  height: 500px;\n  border:\
    \ 2px solid black;\n  position: relative;\n  display: flex;\n  justify-content:\
    \ center;\n  align-items: center;\n}\n```\n\n"
