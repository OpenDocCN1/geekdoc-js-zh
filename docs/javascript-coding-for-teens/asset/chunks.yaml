- fmt: "\nJavaScript provides two basic data structures to manage data. They are called\
    \ `arrays` and `objects`.\n\n## Objects\n\nObjects are data structures. They hold\
    \ their data in key-value pairs. Keys are also referred to as properties of the\
    \ object.\n\n```javascript\nvar dogBreedAndName = {\n  terrier: 'suzy', // key:\
    \ terrier, value: 'suzy'\n  shiba: 'yin-yin', // key: shiba, value: 'yin-yin'\n\
    \  goldenRetriever: 'sparky' // key: goldenRetriever, value: 'sparky'\n};\n```\n\
    \nAccessing values is done by referring to the associated key name. This can be\
    \ performed with the dot operator (a period).\n\n```javascript\n// get the value\
    \ 'suzy' by accessing the key 'terrier'\ndogBreedAndName.terrier; // 'suzy'\n\
    ```\n\nBracket notation also works. It accesses the value using the string value\
    \ of the key.\n\n```javascript\n// get the value 'suzy' by accessing the key 'terrier'\n\
    dogBreedAndName['terrier']; // 'suzy'\n```\n\n### OBJECT AND UNDEFINED\n\nAny\
    \ attempt to access a key that does not exist will output `undefined`.\n\n```javascript\n\
    var dogs = {\n  terrier: 'suzy'\n};\n\n// No key 'shiba' exists in the object\n\
    dogs.shiba; // undefined.\n```\n\n### DOT OPERATOR VS. BRACKET NOTATION\n\nThe\
    \ dot operator cannot access anything except the name that has been explicitly\
    \ declared. The following will not work.\n\n```javascript\nvar dogName = 'terrier';\n\
    dogBreedAndName.dogName; // undefined\n```\n\nThe intention of this code is to\
    \ use “terrier” as a key to access the string “suzy”. But in this case, the variable\
    \ `dogName` was assigned first. The dot operator will attempt to access the name\
    \ as a string.\n\n```javascript\n// equivalent statements\ndogBreedAndName.dogName;\
    \ // undefined\ndogBreedAndName['dogName']; // undefined\n```\n\nAccessing values\
    \ from a variable name must use bracket notation.\n\n```javascript\nvar dogName\
    \ = 'terrier';\ndogBreedAndName[dogName]; // 'suzy'\n```\n\n## Arrays\n\nAn array\
    \ is a data structure with a syntax of square brackets, with commas separating\
    \ each piece of data from the other.\n\n```javascript\n[1, 2, 3]; // an array\
    \ of numbers\n```\n\nArrays have indexes. Indexes are “slots” that can have data\
    \ inserted into them. Each item inside an array can be accessed by index using\
    \ bracket notation. Indexes in an array start at 0.\n\n```javascript\nvar array\
    \ = [30, 21, 43, 34];\narray[0]; // 30\narray[1]; // 21\narray[2]; // 43\narray[3];\
    \ // 34\n```\n\n### ARRAYS AND UNDEFINED\n\nAn attempt to access an index that\
    \ is out of the bounds of the size of the array will cause problems in your code.\
    \ Your output will be `undefined`.\n\n```javascript\nvar array = [30, 21, 43,\
    \ 34];\n// array is not long enough to have an index of 4\narray[4]; // undefined\n\
    ```\n\n### ARRAY PROPERTY: LENGTH\n\nMore will be explained later in this book,\
    \ but arrays also have the concept of properties. The most important one that\
    \ will be used is the `length` property.\n\n```javascript\nvar array = [30, 21,\
    \ 43, 34];\narray.length; // 4\n```\n\n## Data and Variables in Action\n\nLet’s\
    \ imagine you have lots of dogs and want the option to provide the dog breed and\
    \ print out the name of each of your dogs. Let’s take everything you’ve learned\
    \ so far and apply it!\n\n### RECAP: CONFIRM FILE LOCATION\n\nFor your first challenge,\
    \ let’s re-review the file-creation and code-running processes. Create a file\
    \ and name it `dogNames.js`. Here is what my VS Code explorer looks like right\
    \ now. Yours may look different. You can manage your files however you’d like.\n\
    \n![](Images/image00270.jpeg)\n\n### HACKER HINT\n\nIf you’ve gone into the wrong\
    \ nested directory, the command to go back up is `cd ..` (the command `cd`, a\
    \ space, and two periods). If you’re completely lost, restarting VS Code will\
    \ reset the directory.\n\n### RECAP: CONFIRM LOCATION IN TERMINAL\n\nRemember\
    \ your terminal command `ls`? Use it to confirm that the command line is currently\
    \ pointed to the right folder.\n\n![](Images/image00271.jpeg)\n\nUh-oh! You’re\
    \ in the wrong directory. Your `dogNames.js` file isn’t there. After inspecting\
    \ your explorer, you see that it is nested in two subfolders: “exercises” and\
    \ “ch3.” You need to point to the right directory or you can’t run your code.\
    \ You can do it using the terminal command `cd`.\n\n![](Images/image00272.jpeg)\n\
    \nDouble-check with `ls` to confirm the correct location.\n\n### PREPPING INTERACTIVITY\n\
    \nAdd your first snippet of JavaScript to prepare for the exercise.\n\n```javascript\n\
    // the content of our file\nvar prompt = require('readline-sync');\nvar breed\
    \ = prompt.question('what breed is your dog? ');\n```\n\nDon’t sweat the details.\
    \ Just know that these two lines make the JavaScript interactable. Running this\
    \ code will create a text prompt. After entering text, it will be saved to the\
    \ variable `breed`.\n\nTaking things one step at a time helps you find bugs sooner.\
    \ Before trying to solve any challenges, print the input variable `breed`.\n\n\
    The file should temporarily look like this. Remember to save the file before running\
    \ it.\n\n```javascript\n// the content of our file\nvar prompt = require('readline-sync');\n\
    var breed = prompt.question('what breed is your dog? ');\nconsole.log(breed);\n\
    ```\n\n### RUN THE CODE\n\nAn interactive experience has been prepared! Use the\
    \ terminal command `node` and the file name to run it.\n\n![](Images/image00273.jpeg)\n\
    \nGood! Now your JavaScript is waiting for you to type in a dog breed. Type something\
    \ in and press Enter.\n\n![](Images/image00274.jpeg)\n\nYou have now confirmed\
    \ that your code is accepting user inputs and printing out values in your command\
    \ line.\n\n### ADD DATA\n\nWith a prompt set up, create a data structure with\
    \ lovely dog information. Any key-value pairs can be added. As an example, I will\
    \ provide excellent names that any dog would enjoy being called.\n\n```javascript\n\
    var dogs = {\n  terrier: 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious\
    \ P.U.G.'\n};\n```\n\n### PRINT AN INTERESTING STRING\n\nYou now have input capability\
    \ and data. Perhaps it is time for you to print an interesting string? To do this,\
    \ you are going to use string concatenation, a string, a string access of an object\
    \ using bracket notation. (Wait, the text had \"a string, a string access of an\
    \ object in one line\").\n\n```javascript\nconsole.log('Your dog\\'s name is '\
    \ + dogs[breed] + '? fascinating!');\n```\n\nThe file should now look like this.\n\
    \n```javascript\n// dogNames.js\nvar prompt = require('readline-sync');\nvar breed\
    \ = prompt.question('what breed is your dog? ');\nvar dogs = {\n  terrier: 'Suzy',\n\
    \  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? fascinating!');\n```\n\n### RUN THE FILE\n\
    \nRemember to save. Run the code one more time.\n\n![](Images/image00275.jpeg)\n\
    \nWith the input terrier, the object accessed the terrier key and gave the string\
    \ “Suzy”. But what if we type a string that is not a key in our object?\n\n![](Images/image00276.jpeg)\n\
    \nWe can agree to disagree, but I find undefined to be a terrible name for a dog.\
    \ Clearly, this is an oversight in the code. It is something to look forward to\
    \ in the next chapter.\n\n## Crack the Code\n\n1. When are comments useful?\n\
    2. What is the difference between declaration and assignment?\n3. Can `var` be\
    \ used as a variable name? Why or why not?\n4. What keywords were covered in this\
    \ chapter?\n5. What is the main difference between increment operators and self-assignment\
    \ operators?\n6. How are values in an array accessed?\n7. How are values in an\
    \ object accessed?\n8. What value is outputted if a nonexistent index is accessed\
    \ in an array?\n9. What value is outputted if a nonexistent key is accessed in\
    \ an object?\n10. When is bracket notation necessary for accessing a value in\
    \ an object, instead of the dot operator?\n\n## Debugging\n\nWhen debugging code,\
    \ it can be helpful to place the code in a file and run it in the command line.\
    \ You will get real-time feedback on your answer.\n\n1. The variable doesn’t seem\
    \ to change in value, despite the fact that it is being incremented.\n"
