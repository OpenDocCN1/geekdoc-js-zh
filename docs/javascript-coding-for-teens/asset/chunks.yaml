    [5.](#part0027.xhtml_ch05_D5)The loop should be skipping data if the entry in
    the array is a string. I am trying to use continue to skip the loop’s operations
    prematurely. But my loop is still printing out all of the data.


    var mixedDataTypes = [''a'', 30, ''b'', ''d'', ''d'', 1, 3];


    for (var i = 0; i < mixedDataTypes.length; i++) {


    var currData = mixedDataTypes[i];


    console.log(currData);


    if (typeof currData === ''string'') {


    continue;


