  trans: "\n当操作需要执行的次数未知，但你知道何时停止时，就会使用循环。\n\n人类的思维方式也是循环的——你只是没有意识到而已！停下来思考一下你是如何数钱的。想象一下你打开了自己的钱包或钱包。现在，想象里面有实体货币。你会如何计算总美元金额？\n\
    \n与计算机交道的核心在于理解操作背后的规则。为了方便起见，让我们列出数钱涉及的规则：\n\n1. 收集好你的钞票。\n2. 逐一检查每张钞票。\n3. 在继续计数的过程中，在心里跟踪总额。一张一张地累加金额。\n\
    4. 在检查完所有钞票后停止计数。\n\n最后规则是最重要的规则。在你的一生中，你的钱包里出现过多少张钞票？昨天，你有五张。那么为什么规则不是“数完五张后停止”呢？因为钞票的数量无法保证是特定的数字。所以你不能用特定的数字作为规则。为了保持灵活并让规则适应任何数量的钞票，你只能说明何时应该停止计数。\n\
    \n一旦你学会了 `while` 循环和 `for` 循环，你就可以使用计算机可以理解的这种逻辑来编写代码。\n\n## While Loops\n\n`while`\
    \ 循环是 JavaScript 中存在的一种循环。\n\n```javascript\nwhile (condition) {\n\n}\n```\n\n\
    `while` 循环会不断重复，直到条件求值为 `false` 为止。\n\n### 停止循环\n\n循环中的条件也被称为循环的终止条件。通过刻意引导循环进入一个\
    \ `false` 值来停止循环。一旦值变为 `false`，循环将结束，循环下方的代码将继续运行。\n\n### 循环逻辑\n\n数钱的规则可以帮助你理解逻辑。但现在你需要弄清楚计算机实际上可以执行的操作。\n\
    \n首先，准备一个装满钞票的钱包。但在 JavaScript 中并不存在钱包的概念。相反，你将拥有一个钞票数组。\n\n检查完钱包后，你看到两张 1 美元钞、一张\
    \ 5 美元钞、一张 10 美元钞和一张 20 美元钞。因此，你的钞票数组看起来如下。\n\n```javascript\nvar bills = [1,\
    \ 1, 5, 10, 20];\n```\n\n这里变得有点棘手了。作为程序员，我们需要使用计算机的规则。这需要一点创造力。你可以这样修改这些规则：\n\n\
    1. 创建一个钞票数组。\n2. 通过索引访问数组中每个项的值。\n3. 创建一个变量，用于累加数组中每个项的值。\n4. 创建一个变量，其目的是通过索引获取数组中的每个项。每处理一张钞票后递增。\n\
    5. 只要索引变量仍在数组范围内，就继续重复。\n\n### 迭代\n\n在数钱之前，写一个循环来打印出每张钞票。同时验证索引。\n\n#### 准备工作\n\
    \n准备钞票数组并声明索引，索引从 0 开始。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10, 20];\n\
    \n// 用于访问数组值的的索引\nvar index = 0;\n```\n\n### 终止条件：length 属性\n\n还记得之前关于数组 `length`\
    \ 属性的讨论吗？它是所有魔法的关键。`length` 输出的数字将根据数组的大小而变化。这能让你在无需进行任何额外工作的情况下知道数组有多大！\n\n```javascript\n\
    bills.length; // 5\n```\n\n当循环运行时，数组的索引和 `length` 会进行比较。只要索引值小于数组的 `length`，就意味着循环仍在数组范围内。\n\
    \n```javascript\n// 我们的终止条件\nindex < bills.length;\n```\n\n只要 `index < bills.length`\
    \ 继续为 `true`，循环就应该继续。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10, 20];\n\
    \n// 用于访问数组值的索引\nvar index = 0;\n\n// 终止条件\nwhile (index < bills.length) {\n \
    \ // 递增索引以最终满足我们的终止条件\n  index++;\n}\n```\n\n你现在有了一个可以终止的代码循环。但内部并没有发生任何有趣的事情。在解决你的原始问题之前，先用\
    \ `console.log` 语句确认一切运行正常。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10,\
    \ 20];\n\n// 用于访问数组值的索引\nvar index = 0;\n\n// 终止条件\nwhile (index < bills.length)\
    \ {\n  var currentBill = bills[index];\n  var indexPrint = 'I am on index' + index;\n\
    \  console.log(indexPrint);\n  var printedBill = 'I am currently on a $' + currentBill\
    \ + 'bill!';\n  console.log(printedBill);\n  // 递增索引以最终满足我们的终止条件\n  index++;\n\
    }\n```\n\n将此代码放在文件中并运行它。\n\n![](img/image00281.jpeg)\n\n太棒了！循环运行预期。\n\n### 理解每次迭代\n\
    \n描述循环的一个常用词是 `iterate`（迭代）。理解循环的最佳方法之一是找出每次迭代时变量的值是多少。随着你编程能力的成熟，在脑海中进行这种脑体操会变得容易。但如果有一个视觉化的表示总是是好的。如果你发现自己不确定循环中发生了什么，可以写一个表格，在循环运行期间跟踪所有的值。\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\nwhile (index\
    \ < bills.length) {\n  console.log(bills[index]);\n  index++;\n}\n```\n\n| 迭代\
    \ | 索引 | 条件 | BILLS[INDEX] | BILLS |\n| :--- | :--- | :--- | :--- | :--- |\n|\
    \ 1 | 0 | 0 < 5 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | [1, 1, 5, 10,\
    \ 20] |\n| 3 | 2 | 2 < 5 | 5 | [1, 1, 5, 10, 20] |\n| 4 | 3 | 3 < 5 | 10 | [1,\
    \ 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 20 | [1, 1, 5, 10, 20] |\n\n## While Loops\n\
    \n`while` 循环是 JavaScript 中存在的一种循环。\n\n```javascript\nwhile (condition) {\n\n}\n\
    ```\n\n`while` 循环会不断重复，直到条件求值为 `false` 为止。\n\n### 停止循环\n\n循环中的条件也被称为循环的终止条件。通过刻意引导循环进入一个\
    \ `false` 值来停止循环。一旦值变为 `false`，循环将结束，循环下方的代码将继续运行。\n\n### 循环逻辑\n\n数钱的规则可以帮助你理解逻辑。但现在你需要弄清楚计算机实际上可以执行的操作。\n\
    \n首先，准备一个装满钞票的钱包。但在 JavaScript 中并不存在钱包的概念。相反，你将拥有一个钞票数组。\n\n检查完钱包后，你看到两张 1 美元钞、一张\
    \ 5 美元钞、一张 10 美元钞和一张 20 美元钞。因此，你的钞票数组看起来如下。\n\n```javascript\nvar bills = [1,\
    \ 1, 5, 10, 20];\n```\n\n这里变得有点棘手了。作为程序员，我们需要使用计算机的规则。这需要一点创造力。你可以这样修改这些规则：\n\n\
    1. 创建一个钞票数组。\n2. 通过索引访问数组中每个项的值。\n3. 创建一个变量，用于累加数组中每个项的值。\n4. 创建一个变量，其目的是通过索引获取数组中的每个项。每处理一张钞票后递增。\n\
    5. 只要索引变量仍在数组范围内，就继续重复。\n\n### 迭代\n\n在数钱之前，写一个循环来打印出每张钞票。同时验证索引。\n\n#### 准备工作\n\
    \n准备钞票数组并声明索引，索引从 0 开始。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10, 20];\n\
    \n// 用于访问数组值的索引\nvar index = 0;\n```\n\n### 终止条件：length 属性\n\n还记得之前关于数组 `length`\
    \ 属性的讨论吗？它是所有魔法的关键。`length` 输出的数字将根据数组的大小而变化。这能让你在无需进行任何额外工作的情况下知道数组有多大！\n\n```javascript\n\
    bills.length; // 5\n```\n\n当循环运行时，数组的索引和 `length` 会进行比较。只要索引值小于数组的 `length`，就意味着循环仍在数组范围内。\n\
    \n```javascript\n// 我们的终止条件\nindex < bills.length;\n```\n\n只要 `index < bills.length`\
    \ 继续为 `true`，循环就应该继续。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10, 20];\n\
    \n// 用于访问数组值的索引\nvar index = 0;\n\n// 终止条件\nwhile (index < bills.length) {\n \
    \ // 递增索引以最终满足我们的终止条件\n  index++;\n}\n```\n\n你现在有了一个可以终止的代码循环。但内部并没有发生任何有趣的事情。在解决你的原始问题之前，先用\
    \ `console.log` 语句确认一切运行正常。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10,\
    \ 20];\n\n// 用于访问数组值的索引\nvar index = 0;\n\n// 终止条件\nwhile (index < bills.length)\
    \ {\n  var currentBill = bills[index];\n  var indexPrint = 'I am on index' + index;\n\
    \  console.log(indexPrint);\n  var printedBill = 'I am currently on a $' + currentBill\
    \ + 'bill!';\n  console.log(printedBill);\n  // 递增索引以最终满足我们的终止条件\n  index++;\n\
    }\n```\n\n将此代码放在文件中并运行它。\n\n![](img/image00281.jpeg)\n\n太棒了！循环运行预期。\n\n### 理解每次迭代\n\
    \n描述循环的一个常用词是 `iterate`（迭代）。理解循环的最佳方法之一是找出每次迭代时变量的值是多少。随着你编程能力的成熟，在脑海中进行这种脑体操会变得容易。但如果有一个视觉化的表示总是是好的。如果你发现自己不确定循环中发生了什么，可以写一个表格，在循环运行期间跟踪所有的值。\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\nwhile (index\
    \ < bills.length) {\n  console.log(bills[index]);\n  index++;\n}\n```\n\n| 迭代\
    \ | 索引 | 条件 | BILLS[INDEX] | BILLS |\n| :--- | :--- | :--- | :--- | :--- |\n|\
    \ 1 | 0 | 0 < 5 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | [1, 1, 5, 10,\
    \ 20] |\n| 3 | 2 | 2 < 5 | 5 | [1, 1, 5, 10, 20] |\n| 4 | 3 | 3 < 5 | 10 | [1,\
    \ 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 20 | [1, 1, 5, 10, 20] |\n\n## For Loops\n\
    \n`while` 循环是一个很好的切入点，但 `for` 循环更常用。\n\n### 结构\n\n语法如下。注意分号。\n\n```javascript\n\
    for (initialization; condition; after) {\n\n}\n```\n\n1. `initialization`: 在任何迭代之前执行的操作。\n\
    2. `condition`: 在迭代之前检查的终止条件。\n3. `after`: 迭代后执行的操作。\n\n### WHILE LOOP VS. FOR\
    \ LOOP SYNTAX\n\n让我们重新审视使用 `while` 循环遍历数组的策略，伪代码。\n\n```\n初始化索引\nwhile (index\
    \ 小于 array.length) {\n  递增索引\n}\n```\n\n1. 初始化变量\n2. 终止条件\n3. 递增索引\n\n`for` 循环将这些操作压缩在一行。每个操作由分号隔开。\n\
    \n```javascript\nfor (index; condition; after) {\n```\n\n之前的 `while` 循环示例可以写成\
    \ `for` 循环。\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\
    \nwhile (index < bills.length) {\n  console.log(bills[index]);\n  index++;\n}\n\
    ```\n\n它们是一样的，只是更短。\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var\
    \ index = 0; index < bills.length; index++) {\n  console.log(bills[index]);\n\
    }\n```\n\n## 循环修改关键字\n\n在某些算法中，需要跳过当前迭代的后续操作并进入下一次迭代，或者直接离开循环。\n\n### CONTINUE\n\
    \n一旦找到 `continue` 语句，当前迭代将停止并进入下一次迭代。让我们更改我们的提示，以便在解决方案中使用 `continue`。\n\n只打印大于\
    \ 5 美元的钞票。这在代码中如何表达？\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var\
    \ index = 0; index < bills.length; index++) {\n  if (bills[index] >= 5) {\n  \
    \  console.log(bills[index]);\n  }\n}\n```\n\n简单的内容。但你可以使用 `continue` 语句来解决同样的挑战。这就是伪代码看起来的样子。\n\
    \n```javascript\nfor (遍历每张钞票) {\n  如果钞票小于 5 美元，跳过此语句下方的所有内容\n  打印钞票\n}\n```\n"
- fmt: "\nIf the iteration stops when the bill is less than $5, it is implied that\
    \ the bill won’t be printed. In real code, it would look like this.\n\n```javascript\n\
    var bills = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index < bills.length; index++)\
    \ {\n  // if the bill is less than 5 dollars\n  if (bills[index] < 5) {\n    //\
    \ skip\n    continue;\n  }\n  console.log(bills[index]);\n}\n```\n\nThe output\
    \ is as expected. The first two values in the array are ignored because they are\
    \ less than 5. The loop never operates `console.log` because the `continue` statement\
    \ inside the conditional prematurely stops the iteration.\n\n![](Images/image00282.jpeg)\n\
    \n## BREAK\n\nThe keyword `continue` skips the subsequent operations inside a\
    \ loop. But what if you want to cancel the loop completely? A `break` statement\
    \ stops the current iteration in the same way `continue` does. But `break` goes\
    \ even further and stops all subsequent iterations, too!\n\nNow, change the prompt\
    \ one more time. If you see a $5 bill, stop printing. This can be done without\
    \ a `break` statement. But using one makes the algorithm easier to understand.\n\
    \n```javascript\nfor (loop over each bill) {\n  if (the bill is equal to 5 dollars,\
    \ exit loop\n  print the bill\n}\n```\n\nIn real code, it would look like this.\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index <\
    \ bills.length; index++) {\n  // if the bill is 5 dollars\n  if (bills[index]\
    \ === 5) {\n    // exit loop completely\n    break;\n  }\n  console.log(bills[index]);\n\
    }\n```\n\n![](Images/image00283.jpeg)\n\nExcellent! Just what you would expect.\
    \ Once the code sees a 5, the loop stops.\n\n## Loops in Action (#part0003.xhtml_sec-53)\n\
    \nSo far, you have spent the entire time making sure you understand how to cycle\
    \ through all the bills in the array. It’s time to solve the original prompt:\
    \ Count the total amount in your wallet!\n\n### HACKER HINT\n\nIf your computer\
    \ slows down when running a JavaScript file, force quit. The loop is endlessly\
    \ running because it is never meeting its terminating condition. The keyboard\
    \ command `ctrl + z` will force quit the operation. Worst case scenario, close\
    \ VS Code.\n\n### LOOP\n\nRevisiting your previous code, no behavior inside. But\
    \ the loop is prepared to iterate over the array of bills.\n\n```javascript\n\
    var bills = [1, 1, 5, 10, 20];\n\nfor (var i = 0; i < bills.length; i++) {\n\n\
    }\n```\n\nThe variable `index` is shortened to `i`. This is the common variable\
    \ name when tracking index in a loop.\n\nIn order to track the amount of money,\
    \ a variable is needed. The value will start at 0, because your loop has not counted\
    \ any money yet.\n\n```javascript\nvar total = 0;\n```\n\nThis type of variable\
    \ is commonly referred to as an accumulator. It will progressively increase in\
    \ value after every iteration of our loop. It “accumulates” value after each bill\
    \ is visited.\n\nPutting it all together, the value of each bill by index increases\
    \ the value of `total`, the accumulator.\n\n```javascript\nvar bills = [1, 1,\
    \ 5, 10, 20];\nvar total = 0;\n\nfor (var i = 0; i < bills.length; i++) {\n  var\
    \ currentValue = bills[i];\n  total += currentValue;\n}\n\nconsole.log(total);\n\
    ```\n\nTo make sure you have a full understanding of what is happening, let’s\
    \ create another table that represents each iteration.\n\n| ITERATION | I | CONDITION\
    \ | CURRENTVALUE | TOTAL | BILLS |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| 1 | 0 | 0 < 5 | 1 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | 2 |\
    \ [1, 1, 5, 10, 20] |\n| 3 | 2 | 2 < 5 | 5 | 7 | [1, 1, 5, 10, 20] |\n| 4 | 3\
    \ | 3 < 5 | 10 | 17 | [1, 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 10 | 27 | [1, 1,\
    \ 5, 10, 20] |\n"
