    \nIf the file already has the Google Chrome icon, double click the file to open\
    \ it. The file can also be dragged and dropped to the browser window.\n\n![](Images/image00307.jpeg)\n\
    \nNotice how the location is not an internet URL? That’s the directory path to\
    \ the HTML file. After confirming the file is running, modify the HTML.\n\n```html\n\
    <html>\n<head>\n</head>\n<body>\n<div>\n  Hello!\n</div>\n<div>\n  I EXTREMELY\
