  trans: "\n\nJavaScript 有许多与浏览器相关的函数可以使用。`document` 是一个对象，意味着它拥有方法。这些可用方法可以修改 HTML。整个\
    \ Web 开发社区都高度依赖这些方法和函数。\n\n## DOCUMENT.GETELEMENTSBYCLASSNAME\n\ndocument 对象上一个会被广泛使用的方法是\
    \ `document.getElementsByClassName`。如果我们为 `div` HTML 元素添加类名（class）属性，`document.getElementsByClassName`\
    \ 就能施展魔法了！\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
    >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n\
    </body>\n</html>\n```\n\n`document.getElementsByClassName` 接受一个参数，即是类名的字符串名称。`cool-message`\
    \ 这个类被添加到了 `div` 元素中。该属性将用于识别这些 HTML 元素。在开发者控制台中中使用以下代码。运行代码后，输入变量名 `divElements`\
    \ 即可在控制台中显示它的值。\n\n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
    ```\n\n代码运行后，再次在控制台中输入变量名 `divElements` 以显示其值。\n\n![](img/image00312.jpeg)\n\n\
    太棒了！看起来该语句返回了包含我们两个 HTML 元素的数组！从技术来说，它是一个名为 `HTMLCollection` 的数据结构。在以后，`HTMLCollections`\
    \ 将被称为类数组数据结构。但不用担心，因为数组与类数组数据结构之间的区别对你没有影响。循环可以在 `HTMLCollections` 上运行。\n\n##\
    \ DOCUMENT.GETELEMENTBYID\n\n与 `document.getElementsByClassName` 通过类属性获取 HTML\
    \ 元素一样，`document.getElementById` 通过其 id 属性选择元素。为了让一个元素被 `document.getElementById`\
    \ 选中，请修改 HTML。添加一个带有 id 属性的 `div` 元素。\n\n```html\n<html\n<head>\n</head>\n<body>\n\
    <div class=\"cool-message\">\nHello!\n</div>\n<div class=\"cool-message\">\nI\
    \ am EXTREMELY cool\n</div>\n<div id=\"occupation\">\nThat is because I am a programmer\n\
    </div>\n</body>\n</html>\n```\n\n刷新页面。在开发者控制台中输入以下代码。再次在控制台中输入变量名后，返回值应该指向第三行文本。\n\
    \n```javascript\nvar divElement = document.getElementById('occupation');\n```\n\
    \n![](img/image00313.jpeg)\n\n注意看 `document.getElementById` 是如何返回单个元素的？它没有返回像\
    \ `document.getElementsByClassName` 那样的类数组数据结构。这是因为 `document.getElementById`\
    \ 一次只能选择一个元素。\n\n## HTML 操作\n\nHTML 元素内部包含许多方法和属性，就像 document 对象一样。这些方法和属性赋予了我们修改特定\
    \ HTML 元素的能力。\n\n### 使用 INNERHTML 访问文本\n\n在页面上编写文本并将其封装在 HTML 内部时，`div` 是最直观的标签。当\
    \ JavaScript 使用选择器指向 HTML 时，它被表示为一个 JavaScript 对象。该对象有一个名为 `innerHTML` 的键。它保存\
    \ HTML 元素内部的文本。通过回顾你的示例 HTML 可以看到这一点。使用 `document.getElementById` 获取 id 为 `occupation`\
    \ 的 `div` 内部的文本。\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
    >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n\
    <div id=\"occupation\">\nThat is because I am a programmer\n</div>\n</body>\n\
    </html>\n```\n\n```javascript\nvar divElement = document.getElementById('occupation');\n\
    divElement.innerHTML;\n```\n\n![](img/image00314.jpeg)\n\n### 使用 INNERHTML 注入新文本\n\
    \n`innerHTML` 是对象上的一个属性。就像对象上的任何键值对一样，它可以被重新赋值。这允许修改内部的文本。\n\n```javascript\n\
    var divElement = document.getElementById('occupation');\ndivElement.innerHTML\
    \ += ' and love building things';\n```\n\n![](img/image00315.jpeg)\n\n使用自加运算符，额外的文本被追加到了\
    \ `div` 元素的 `innerHTML` 中。恭喜你！你已经迈入了 Web 开发世界的第一步。\n\n### 更新属性 ID\n\n与 `innerHTML`\
    \ 可以被更新一样，`class` 和 `id` 属性也可以更改。更新 HTML 元素的 `id` 很容易。关键是 `id`。\n\n```javascript\n\
    var divElement = document.getElementById('occupation');\ndivElement.id = 'new-id';\n\
    ```\n\n### 更新属性 CLASS\n\n更新 `class` 比更新 `id` 更复杂。这是因为通常会分配多个类。回到 HTML 文件。现在，`div`\
    \ 元素只有一个类。\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
    >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n\
    <div id=\"occupation\">\nThat is because I am a programmer\n</div>\n</body>\n\
    </html>\n```\n\n向现有的 HTML 元素添加类的方法是 `classList.add`。它接受一个参数，即要追加的类名。\n\n```javascript\n\
    var divElements = document.getElementsByClassName('cool-message');\ndivElements[0].classList.add('new-class');\n\
    ```\n\n![](img/image00316.jpeg)\n\n移除类的方法是 `classList.remove`，它接受一个类名作为参数。\n\n\
    ```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
    divElements[0].classList.remove('new-class');\n```\n\n![](img/image00317.jpeg)\n\
    \n### 修改 HTML 类的目的\n\n到目前，你做了很多工作来学习如何更改 HTML 元素的类。这在处理 CSS 时会变得非常重要。本书将不会涵盖 CSS，但只需知道更新类属性是触发\
    \ HTML 元素视觉变化的常用方法。\n\n## 创建元素\n\n`document` 对象还拥有创建 HTML 元素的方法。当你制作游戏时，这将会非常重要！\n\
    \n### DOCUMENT.CREATEELEMENT\n\n使用 `document.createElement`，JavaScript 可以创建 HTML。它接受一个参数，即\
    \ HTML 标签的字符串名称。因为我们还没学习 HTML，我们将一直创建一个 `div` 元素。\n\n```javascript\nvar div =\
    \ document.createElement('div');\ndiv.innerHTML = 'I am a new div!';\n```\n\n\
    ![](img/image00318.jpeg)\n\n已经通过 `innerHTML` 创建了一个 HTML `div`：“I am a new div!”\
    \ 但它在哪里呢？你创建了它，但还没有把它放在任何地方！\n\n 使用 JavaScript 创建的 HTML 元素需要手动添加到页面。这就是使用 `append`\
    \ 方法的地方。它存在于任何 HTML 选择器获取的 HTML 对象上，例如 `document.getElementsByClassName` 和 `document.getElementById`。\n\
    \n```javascript\nvar div = document.createElement('div');\ndiv.innerHTML = 'I\
    \ am a new div!';\nvar divElements = document.getElementsByClassName('cool-message');\n\
    divElements.append(div);\n```\n\n![](img/image00319.jpeg)\n\n哎！为什么这不起作用？那是因为 `document.getElementsByClassName`\
    \ 返回的是类数组数据结构。\n\n![](img/image00320.jpeg)\n\n可以通过索引访问类数组数据结构中的元素。\n\n```javascript\n\
    var div = document.createElement('div');\ndiv.innerHTML = 'I am a new div!';\n\
    var divElements = document.getElementsByClassName('cool-message');\ndivElements[1].append(div);\n\
    ```\n\n![](img/image00321.jpeg)\n\n你刚刚用纯 JavaScript 了 HTML！我觉得这非常酷。\n\n### 从页面移除\
    \ HTML\n\nJavaScript 也可以用于移除 HTML 元素。修改 HTML 文件，添加一个带有 id 属性和某些 `innerHTML` 的新\
    \ `div` 元素。\n\n```html\n<html\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
    >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n\
    <div id=\"occupation\">\nThat is because I am a programmer\n</div>\n<div id=\"\
    untrue-message\">\nJust kidding, programmers are losers\n</div>\n</body>\n</html>\n\
    ```\n\n![](img/image00322.jpeg)\n\n"
- fmt: "\nProgrammers are losers? Seeing this false statement makes my blood boil.\
    \ I demand that `div` be removed from the page. That statement’s div has an `id`.\
    \ That means `document.getElementById` can be used to point to that HTML element.\n\
    \n```javascript\nvar slanderousDiv = document.getElementById('untrue-message');\n\
    ```\n\nThe method to operate on the `slanderousDiv` variable is `remove`, which\
    \ has no parameters.\n\n```javascript\nvar slanderousDiv = document.getElementById('untrue-message');\n\
    slanderousDiv.remove();\n```\n\n![](Images/image00323.jpeg)\n\nExcellent! The\
    \ `div`, along with the content inside of it, has been destroyed with extreme\
