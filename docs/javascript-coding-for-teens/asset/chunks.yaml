    Make sure you have your folder open in VS Code. VS Code’s terminal will automatically
    point to your folder’s directory. The easiest way to find and run your code in
    the terminal is to have it already pointing to the directory your files live in.
    To double-check, type in the command `ls` (FYI, that’s a lowercase L). It will
    print out all of the files and folders in the current directory. You should see
    your file, `index.js`, in the terminal output.


    ## Writing Your First Code


    Now you’re properly equipped to run some JavaScript! But before you can run any
    code, you have to write it.


    ### CONSOLE.LOG


    We’ll be constantly using something called `console.log`. `console.log` takes
    what is wrapped in its parentheses and prints it onto the command line. At this
    point, you don’t need to understand the underlying mechanisms behind `console.log`.
    We’re just here to confirm that your computer is ready to write JavaScript!


    ### LET’S WRITE SOME JAVASCRIPT!


    We’ll keep it simple for now, with a single `console.log`. Type this into your
    file in VS Code, but don’t hit Enter. Save the file as a `.js` file after you’re
    done.


    ```javascript

    console.log(''salutations terra!'');

    ```


    ### LET’S RUN SOME JAVASCRIPT!


    The syntax to run commands on a command line is always as follows:


    `[command] [parameters]`


    Node.js is your runtime. The command is `node`, and the parameter is the file
    name.


    ```bash

    node index.js

    ```


    ![](Images/image00268.jpeg)


    Congrats! You have officially run your first piece of code.


    ## Bugs


    Writing an algorithm is like writing a persuasive essay. An algorithm is a body
    of writing in which the logic flow leads to the correct conclusion. You get graded
    on the following criteria:


    1. Answered: Your essay comes to the correct conclusion.

    2. Grammar: No written language rules are broken.

    3. Good justification: Your reasoning throughout the essay makes sense.


    Writing code has similar requirements:


    1. Answered: You have expected behavior.

    2. Grammar: Correct JavaScript syntax.

    3. Good justification: Your algorithm’s sequence of logic is bulletproof.


    Teachers tend to be kind, or at least mildly flexible, when it comes to grades.
    A computer is ruthless. Here is how a computer grades your code:


    1. Not expected behavior? Partial credit, but still a failing score.

    2. Incorrect syntax? Runtime error. 0/100

    3. One mistake in algorithm? Runtime error. 0/100


    You need a perfect score when writing code. Any deviation means you have one or
    more imperfections in your code. We refer to imperfections as bugs. If you want
    that passing score, you’ll need to find them all.


    Professional programmers create programs with an unbelievable amount of code.
    They are referred to as codebases. Bugs love to hide in nooks and crannies of
    thousands (if not millions) lines of code. It’s a tough job, but programmers strive
    to write bug-free code.


    ### HACKER HINT


    Feeling burnt out? Take a 15-minute break. You will come back with a clearer head
    and find the bug sooner than you think.


    ### BGS CAN BE FRUSTRATING


    When you begin coding, you will write a lot of imperfect code. You will get it
    wrong the first time, the second time, maybe even the twentieth time. But the
    most important part about bugs is to not let them get to your head. Even professional
    programmers get frustrated. It is all part of the learning process, so don’t give
    up!


    ![](Images/image00269.jpeg)


    ## CHAPTER 3: Variables and Data Types


    In order to code effectively, it is important to understand the fundamental tool
    kit JavaScript gives you. In this chapter, you’ll be learning about the various
    types of data used to represent concepts when writing code. You’ll also learn
    the strategies programmers use to keep track of this data. The way programmers
    structure their code is also very important. It’s what gives us the ability to
    effectively read one another’s code.


    ### Code Structure


    Programming languages have baseline rules about how they should be written. Let’s
    go over them before you get your hands dirty. This is just a high-level overview
    to understand how JavaScript code is structured. No need to think about the content
    of the lines.


    #### STATEMENTS


    A statement is an expression that performs an action. Statements are usually written
    on a single line.


    ```javascript

    console.log(''I am a statement'');

    var statement = ''I am another statement'';

    ```


    #### SEMICOLONS


    Have you noticed the semicolons? Each statement should have a semicolon at the
    end. JavaScript has some sneaky ways of fixing itself if you forget, but it’s
    finicky and prone to errors. Play it safe and get into the habit of always adding
    the semicolon yourself.


    There are situations where semicolons at the end of a statement are illegal syntax.
    I’ll explain those situations as we go along.


    #### COMMENTS


    There are times when a programmer wants to write text that should not be run,
    like a note to yourself. A comment is a way of writing information in the file
    that will be ignored when the code is run.


    You can write whatever you want, for whatever reason. Complex algorithms can get
    hairy, and comments are one way to help explain what the code is doing. The syntax
    is adding double slashes in front of the text that is not code.


    ```javascript

    // outputs text to the browser console or terminal

    console.log(''I am a statement'');

    ```


    #### INDENTATIONS


    You will notice indentations on some lines. It is intentional, but technically
    optional. Programmers indent code for readability. As you write more code, you
    will begin to understand the rules.


    ## Variables


    In the same way you and I have different names to keep track of each other, names
    in programming are used to keep track of data. Coding names are referred to as
    variables.


    ### DECLARATION


    Associating a variable is a two-step process. The first step is to declare a variable.
    The process of declaration is telling JavaScript that a particular name should
    be prepared as a variable. The special word `var` tells JavaScript that a variable
    should be declared.


    ```javascript

    var aHumanName;

    ```


    ### ASSIGNMENT


    The association of data with a variable is assignment. Once a variable has been
    declared, it does not need to be redeclared. Assignment is executed with the operator.


    ```javascript

    aHumanName = ''Andrew'';

    ```


    ### ASSIGNMENT AND DECLARATION IN ONE STATEMENT


    Declaration and assignment are two distinct ideas, but they are often performed
    in one statement.


    ```javascript

    var aHumanName = ''Andrew'';

    ```


    ### DATA REASSIGNMENT


    Variables can also be reassigned to different values. The ability to reassign
    is important for upcoming topics.


    ```javascript

    var aHumanName = ''Andrew'';

    aHumanName = ''Charlie'';

    ```


    ### EVALUATING STATEMENTS WITH VARIABLES


    Every time a variable is used, JavaScript will extract the data the variable is
    associated with and use it in its place.


    ```javascript

    var myBirthYear = 1990;

    var currentYear = 2021;

    currentYear - myBirthYear;

    ```


    ### KEYWORDS CAN’T BE VARIABLES


    The word `var` is one example of a keyword in JavaScript. Its usage always means
    “a variable declaration.” It will ignore any other intent and is off-limits for
    variable names.


    ```javascript

    // will create runtime error! variable declaration expected

    var var = 2021;

    ```


    ### HACKER HINT


    Syntax highlighting and VS Code error recommendations will usually protect you
    from accidentally using keywords as variables. But sometimes the error is not
    straightforward. The only thing that is guaranteed is that something in your code
    is wrong.

