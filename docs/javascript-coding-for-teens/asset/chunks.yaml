  trans: "\nJavaScript 两种基本数据结构来管理数据。它们被称为 `arrays`（数组）和 `objects`（对象）。\n\n## Objects\n\
    \n对象是数据结构。它们以键值对的形式存储数据。键也被称为对象的属性。\n\n```javascript\nvar dogBreedAndName = {\n\
    \  terrier: 'suzy', // key: terrier, value: 'suzy'\n  shiba: 'yin-yin', // key:\
    \ shiba, value: 'yin-yin'\n  goldenRetriever: 'sparky' // key: goldenRetriever,\
    \ value: 'sparky'\n};\n```\n\n通过引用关联的键名来访问值。可以使用点运算符（句号）完成。\n\n```javascript\n\
    // 通过访问键 'terrier' 获取值 'suzy'\ndogBreedAndName.terrier; // 'suzy'\n```\n\n中括号表示法同样有效。它通过键的字符串值来访问值。\n\
    \n```javascript\n// 通过访问键 'terrier' 获取值 'suzy'\ndogBreedAndName['terrier']; //\
    \ 'suzy'\n```\n\n### OBJECT AND UNDEFINED\n\n任何访问不存在的键的尝试都会输出 `undefined`。\n\n\
    ```javascript\nvar dogs = {\n  terrier: 'suzy'\n};\n\n// 对象中不存在键 'shiba'\ndogs.shiba;\
    \ // undefined.\n```\n\n### DOT OPERATOR VS. BRACKET NOTATION\n\n点运算符无法访问显式声明的名称以外的任何内容。以下操作将无效。\n\
    \n```javascript\nvar dogName = 'terrier';\ndogBreedAndName.dogName; // undefined\n\
    ```\n\n这段代码的意图是使用“terrier”作为键来访问字符串“suzy”。但在这种，变量 `dogName` 先被赋值了。点运算符会尝试将该名称作为字符串访问。\n\
    \n```javascript\n// 等价语句\ndogBreedAndName.dogName; // undefined\ndogBreedAndName['dogName'];\
    \ // undefined\n```\n\n从变量名访问值必须使用中括号表示法。\n\n```javascript\nvar dogName = 'terrier';\n\
    dogBreedAndName[dogName]; // 'suzy'\n```\n\n## Arrays\n\n数组是一种使用方括号语法的数据结构，用逗号分隔每部分数据。\n\
    \n```javascript\n[1, 2, 3]; // 一个数字数组\n```\n\n数组具有索引。索引是可以用来插入数据的“槽”。数组中的每个项都可以使用中括号表示法通过索引访问。数组中的索引从\
    \ 0 开始。\n\n```javascript\nvar array = [30, 21, 43, 34];\narray[0]; // 30\narray[1];\
    \ // 21\narray[2]; // 43\narray[3]; // 34\n```\n\n### ARRAYS AND UNDEFINED\n\n\
    访问超出数组大小范围的索引会导致代码出现问题。你的输出将是 `undefined`。\n\n```javascript\nvar array = [30,\
    \ 21, 43, 34];\n// array 长度不足以包含索引 4\narray[4]; // undefined\n```\n\n### ARRAY\
    \ PROPERTY: LENGTH\n\n书中稍后将进行更多解释，但数组也有属性的概念。最重要的一个属性是 `length` 属性。\n\n```javascript\n\
    var array = [30, 21, 43, 34];\narray.length; // 4\n```\n\n## Data and Variables\
    \ in Action\n\n想象一下你有很多狗，并且能够提供狗的品种并打印出每只狗的名字。让我们把目前所学到的知识都应用起来吧！\n\n### RECAP:\
    \ CONFIRM FILE LOCATION\n\n对于第一个挑战，让我们重新回顾创建文件和运行代码的过程。创建一个文件并命名为 `dogNames.js`。这是我目前的\
    \ VS Code 资源管理器的样子。你的可能看起来不同。你可以以任何喜欢的方式管理文件。\n\n![](img/image00270.jpeg)\n\n\
    ### HACKER HINT\n\n如果你进入了错误的嵌套目录，返回上一级的命令是 `cd ..`（命令 `cd`、空格和两个点）。如果你完全迷路了，重启\
    \ VS Code 将重置目录。\n\n### RECAP: CONFIRM LOCATION IN TERMINAL\n\n记得你的终端命令 `ls` 吗？使用它来确认命令行当前正指向正确的文件夹。\n\
    \n![](img/image00271.jpeg)\n\n哎呀！你处于错误的目录。你的 `dogNames.js` 文件不在那里。在检查资源管理器后，你发现它嵌套在两个子文件夹中：“exercises”和“ch3”。你需要指向正确的目录，否则你无法运行代码。你可以使用终端命令\
    \ `cd` 来做到。\n\n![](img/image00272.jpeg)\n\n双击 `ls` 以确认正确的位置。\n\n### PREPPING INTERACTIVITY\n\
    \n添加你的第一段 JavaScript 代码来准备练习。\n\n```javascript\n// 文件的内容\nvar prompt = require('readline-sync');\n\
    var breed = prompt.question('what breed is your dog? ');\n```\n\n不要纠结细节。只需知道这两行让\
    \ JavaScript 变得可交互。运行这段代码将创建一个文本提示。输入文本后，它将被保存到变量 `breed` 中。\n\n一步一步来有助于你早早发现\
    \ Bug。在尝试解决任何挑战之前，打印输入变量 `breed`。\n\n文件暂时看起来应该是这样。运行之前记得保存文件。\n\n```javascript\n\
    // 文件的内容\nvar prompt = require('readline-sync');\nvar breed = prompt.question('what\
    \ breed is your dog? ');\nconsole.log(breed);\n```\n\n### RUN THE CODE\n\n交互体验已准备就绪！使用终端命令\
    \ `node` 和文件名来运行它。\n\n![](img/image00273.jpeg)\n\n很好！现在你的 JavaScript 正在等待你输入狗的品种。输入内容并按回车键。\n\
    \n![](img/image00274.jpeg)\n\n你现在确认了你的代码正在接受用户输入并在命令行中打印值。\n\n### ADD DATA\n\n\
    设置好提示后，创建一个包含可爱小狗信息的数据结构。可以添加任何键值对。例如，我将提供任何狗都会喜欢的称呼的棒名字。\n\n```javascript\nvar\
    \ dogs = {\n  terrier: 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious\
    \ P.U.G.'\n};\n```\n\n### PRINT AN INTERESTING STRING\n\n你现在拥有了输入能力和数据。也许是时候打印一个有趣的字符串了？为了做到这一点，你将使用字符串拼接、一个字符串、使用中括号表示法对对象的字符串访问。（等等，原文在一行里写的是“a\
    \ string, a string access of an object”）。\n\n```javascript\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? fascinating!');\n```\n\n文件现在看起来应该是这样。\n\
    \n```javascript\n// dogNames.js\nvar prompt = require('readline-sync');\nvar breed\
    \ = prompt.question('what breed is your dog? ');\nvar dogs = {\n  terrier: 'Suzy',\n\
    \  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? fascinating!');\n```\n\n### RUN THE FILE\n\
    \n记得保存。再次运行代码。\n\n![](img/image00275.jpeg)\n\n输入 `terrier`，对象访问了 `terrier` 键并给了字符串“Suzy”。但如果我们输入一个对象中不存在的键的字符串呢？\n\
    \n![](img/image00276.jpeg)\n\n我们可以保留各自意见，但我认为 `undefined` 是一个非常糟糕的名字。显然，这是代码中的一个疏忽。这是下一章值得期待的内容。\n\
    \n## Crack the Code\n\n1. 注释什么时候有用？\n2. 声明（declaration）和赋值（assignment）的区别是什么？\n\
    3. `var` 可以用变量名吗？为什么或为什么？\n4. 本章涵盖了哪些关键词？\n5. 自增运算符和自赋值运算符的主要区别是什么？\n6. 如何访问数组中的值？\n\
    7. 如何访问对象中的值？\n8. 如果访问数组中不存在的索引，会输出什么值？\n9. 如果访问对象中不存在的键，会输出什么值？\n10. 在访问对象中的值时，什么时候必须使用中括号表示法而不是点运算符？\n\
    \n## Debugging\n\n在调试代码时，将代码放在文件中并在命令行中运行会有帮助。你将获得关于答案的实时反馈。\n\n1. 尽管变量正在自增，但变量的值似乎没有变化。\n"
- fmt: "\n```javascript\nvar num = 0;\nnum = num++; // increment num\nconsole.log(num);\
    \ // 0\n```\n\n### 2. Adding two numbers together isn’t working properly.\n\n\
    ```javascript\nvar num1 = 10;\nvar num2 = '2';\nconsole.log(num1 + num2); // ‘102’\n\
    ```\n\n### 3. Trying to access your dog’s name “Max” by using the key “pug” is\
    \ outputting undefined.\n\n```javascript\nvar dogs = {\n  pug: 'Max',\n  terrier:\
    \ 'Appa'\n};\nvar myDog = 'pug';\nconsole.log(dogs.myDog); // undefined\n```\n\
    \n### 4. An attempt to access the last entry in the array is outputting undefined.\n\
    \n```javascript\nvar meanPeople = ['Layna', 'Layna again', 'Layna one more time'];\n\
    console.log(meanPeople[3]); // undefined\n```\n\n### 5. A fatal runtime error\
    \ is occurring when trying to print this string.\n\n```javascript\nconsole.log('Layna's\
    \ favorite hobby is being mean to Andrew'); // Uncaught SyntaxError: missing )\
    \ after argument list\n```\n\n## CODER’S CHECKLIST » Let’s review the topics we\
    \ covered\n\nLet’s take a quick minute to review what was covered in this chapter.\
    \ An understanding of arrays and data types are especially important.\n\n*   Data\
    \ types\n*   Type coercion\n*   Data structures—arrays and objects\n*   Accessing\
    \ data within data structures\n\n![](Images/image00277.jpeg)\n\n## CHAPTER 4:\
    \ Conditionals\n\nComputers operate in very logical ways. Some of a computer’s\
    \ favorite answers are “yes” and “no.” In computer terms, this is the equivalent\
    \ of “true” and “false.” The ability to discern between true and false is an incredible\
    \ strength. It means a computer can decide what code should run depending on the\
    \ situation. This also means that one program can do many things and make its\
    \ own decisions! The decisions are controlled using conditionals.\n\n### Data\
    \ Checking and Validation\n\nBefore leveraging the power of conditionals, the\
    \ strategies that are used to create proper decision-making need to be covered.\
    \ The raw values `true` and `false` are not commonly used in conditionals. Instead,\
    \ they are almost always computed through other operations.\n\n### Equality Operators\n\
    \nThe most common comparison operation that will be made is checking if two values\
    \ are identical or not identical.\n\n#### EQUALITY OPERATOR\n\nThe equality operator,\
    \ denoted as a double equal sign, checks if two values are identical.\n\n```javascript\n\
    10 == 10; // true\n'pizza' == 'pizza'; // true\n'pizza' == 'Pizza'; // false\n\
    false == false; // true\n```\n\nReady for an unfun surprise? The equality operator\
    \ will use type coercion if possible.\n\n```javascript\n'10' == 10; // true\n\
    ```\n\nIt is recommended to not use the equality operator. A different operator\
    \ does a better job for the same purpose.\n\n#### STRICT EQUALITY OPERATOR\n\n\
    The strict equality operator is the equality operator’s more logical sibling,\
    \ denoted as a triple equal sign. It checks equality and never uses type coercion.\n\
    \n```javascript\n10 === 10; // true\n'pizza' === 'pizza'; // true\n'pizza' ===\
    \ 'Pizza'; // false\nfalse === false; // true\n// no type coercion performed\n\
    '10' === 10; // false\n```\n\n#### INEQUALITY OPERATOR\n\nThe inequality operator,\
    \ denoted as an exclamation point and equal sign, checks if two values are not\
    \ identical.\n\n```javascript\n10 != 10; // false\n'pizza' != 'pizza'; // false\n\
    'pizza' != 'Pizza'; // true\nfalse != false; // false\n```\n\nJust like with the\
    \ equality operator, the inequality operator will use type coercion.\n\n```javascript\n\
    '10' != 10; // false\n```\n\n#### STRICT INEQUALITY OPERATOR\n\nThe strict inequality\
    \ operator is the better version of the inequality operator. Just like strict\
    \ equality, strict inequality does not perform any type coercion. Compared to\
    \ regular inequality, it is the safer bet for JavaScript code. Its syntax is denoted\
    \ as an exclamation point and double equal sign. Please use this instead of the\
    \ regular inequality operator.\n\n```javascript\n10 !== 10; // false\n'pizza'\
    \ !== 'pizza'; // false\n'pizza' !== 'Pizza'; // true\nfalse !== false; // false\n\
    // no type coercion performed\n'10' !== 10; // true\n```\n\n### Relational Operators\n\
    \nIn the same way two values can be checked for equality or inequality, values\
    \ can be checked for whether they are greater than or less than.\n\n#### LESS\
    \ THAN OPERATORS\n\nTwo available comparison operators are the less than operator\
    \ and the less than or equal to operator. They do exactly what they sound like.\
    \ Numbers are compared numerically, and strings are compared alphabetically. It\
    \ is important to note that capitalization matters,\n\n```javascript\n10 < 8;\
    \ // false\n'a' < 'b'; // true\n'A' > 'a'; // false\n10 <= 8; // false\n```\n\n\
    #### GREATER THAN OPERATORS\n\nThe greater than operator and greater than or equal\
    \ to operator share the same principles as the less than operators, and capitalization\
    \ still matters.\n\n```javascript\n10 > 8; // true\n'a' > 'b'; // false\n'a' >=\
    \ 'b'; // true\n```\n\n### Logical Operators\n\nAside from equality operators,\
    \ JavaScript provides operators that help combine conditions. Whether you are\
    \ dealing with simple logic, these tools are essential.\n\n#### OR OPERATOR\n\n\
    The OR operator, denoted as pipes, checks if either operation is true.\n\n```javascript\n\
    true || false; // true\nfalse || false; // false\n```\n\n#### AND OPERATOR\n\n\
    The AND operator, denoted as double ampersand, checks if both operations are true.\n\
    \n```javascript\ntrue && true; // true\ntrue && false; // false\nfalse && false;\
    \ // false\n```\n\n#### NOT OPERATOR\n\nIn programming, there is also the NOT\
    \ operator, denoted as an exclamation point in front of a value. It flips the\
    \ boolean value it is operated on.\n\n```javascript\n!true; // false\n!false;\
    \ // true\n```\n\n### Mix and Match Logical Operators and Equalities\n\nNow that\
    \ you have equality and logical operators, you will see conditions range from\
    \ simple to complex.\n\n### Data Validation\n\nChecking if a value is undefined\
    \ or null is easy.\n\n```javascript\nvar mySocialLife = null;\nmySocialLife ===\
    \ null; // true\n```\n\nThe equality operator handles it, because those data types\
    \ have one possible value. But what about numbers, strings, booleans, and arrays?\
    \ What if you aren’t interested in the value of the number? Perhaps you simply\
    \ want to know whether or not it is a number? Luckily, there are operators for\
    \ these situations.\n\n#### TYPE OPERATOR\n\nThe `typeof` operator outputs the\
    \ variable’s data type, in the form of a string. This is especially helpful when\
    \ debugging code. Incorrect data types are a common source of errors!\n\n```javascript\n\
    typeof 10; // 'number'\ntypeof ''; // 'string'\ntypeof undefined; // 'undefined'\n\
    typeof true; // 'boolean'\n```\n\nSimple stuff. But let me throw a curveball at\
    \ you.\n\n```javascript\ntypeof null; // 'object'\n```\n\nHuh? Why doesn’t `typeof`\
    \ output the string null? It is debatable as to whether this is a bug. But at\
    \ the end of the day, it is incredibly unintuitive. Instead, check for null using\
    \ the equality operator.\n\n```javascript\nnull === null // true\n```\n\n####\
    \ INSTANCEOF\n\nWhen checking whether an item is an array, the `typeof` operator\
    \ is very deceptive.\n\n```javascript\ntypeof []; // 'object'\n```\n\nThe underlying\
    \ reason why the output is “object” technically makes sense, but it is unhelpful\
    \ and unintuitive. Array validation can be properly performed using the `instanceof`\
    \ operator.\n\n```javascript\n[] instanceof Array; // true\n```\n\n#### Don’t\
    \ Use instanceof for Objects\n\nChecking to see if a value is an object is extremely\
    \ challenging. That’s because `typeof` and `instanceof` don’t work. The worst\
    \ part is that they appear to work, but this is not the case.\n\n```javascript\n\
    var anObject = {};\nanObject instanceof Object; // true\ntypeof anObject === 'object';\
    \ // true\n```\n"
