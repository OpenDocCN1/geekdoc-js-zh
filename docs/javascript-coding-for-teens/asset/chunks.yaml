    \ Text After It Has Been Edited](#part0003.xhtml_sec-119)\n\nIt looks like your\
    \ to-do entry magically turned into an editable element. But what good is a textarea\
    \ if it doesn’t have the ability to revert back into its uneditable state? Let’s\
    \ add an update button, using the function `createUpdateButton`. Right now, the\
    \ button doesn’t do anything. Add an event listener to change that. Before destroying\
    \ the textarea HTML element, save the inner text to a variable.\n\n```javascript\n\
    function createUpdateButton() {\n\nvar updateButton = document.createElement('div');\n\
    \nupdateButton.innerHTML = 'update';\n\nupdateButton.classList.add('update-button');\n\
    \nupdateButton.addEventListener('click', function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\
    \nvar updatedText = getTodoText(parentDiv);\n\n});\n\nreturn updateButton;\n\n\
    }\n```\n\nNow you’re ready to manipulate the HTML on the page. Destroy the textarea,\
    \ recreate the un-editable to-do entry with the text inside, and insert it in\
    \ the exact position the textarea previously was in. Pretty slick!\n\n```javascript\n\
    function createUpdateButton() {\n\nvar updateButton = document.createElement('div');\n\
    \nupdateButton.innerHTML = 'update';\n\nupdateButton.classList.add('update-button');\n\
    \nupdateButton.addEventListener('click', function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\
    \nvar updatedText = getTodoText(parentDiv);\n\ndestroyInnerContent(parentDiv);\n\
    \nvar textDiv = createTextDiv(updatedText);\n\nvar closeButton = createCloseButton();\n\
    \nvar editButton = createEditButton();\n\nparentDiv.append(textDiv);\n\nparentDiv.append(closeButton);\n\
    \nparentDiv.append(editButton);\n\n});\n\nreturn updateButton;\n\n}\n```\n\n##\
    \ [Canceling Text Update](#part0003.xhtml_sec-120)\n\nBut what if the user changes\
    \ their mind and wants to cancel their update? You will need a button for that.\
    \ This website already has a function called `createCancelButton`. You need to\
    \ add behavior to it. That means it is time for another event listener!\n\nWhen\
    \ hitting cancel, the text needs to revert back to its original state. But you\
    \ lose the text value when the user starts typing in the textarea. How can this\
    \ be resolved?\n\nYou need to get a little creative! This time around, add a parameter\
    \ to `createCancelButton`. This parameter will store the original text inside\
    \ the function.\n\n```javascript\nfunction createCancelButton(originalText) {\n\
    \nvar cancelButton = document.createElement('div');\n\ncancelButton.innerHTML\
    \ = 'cancel';\n\ncancelButton.classList.add('cancel-button');\n\nreturn cancelButton;\n\
    }\n```\n\nWhen the cancel button is clicked, the text needs to revert back to\
    \ its original state. Destroy the textarea HTML element, and reinsert it using\
    \ the saved text.\n\n```javascript\nfunction createCancelButton(originalText)\
    \ {\n\nvar cancelButton = document.createElement('div');\n\ncancelButton.innerHTML\
    \ = 'cancel';\n\ncancelButton.classList.add('cancel-button');\n\ncancelButton.addEventListener('click',\
    \ function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\nvar updatedText\
    \ = getTodoText(parentDiv);\n\ndestroyInnerContent(parentDiv);\n\nvar textDiv\
    \ = createTextDiv(updatedText);\n\nvar closeButton = createCloseButton();\n\n\
    var editButton = createEditButton();\n\nparentDiv.append(textDiv);\n\nparentDiv.append(closeButton);\n\
    \nparentDiv.append(editButton);\n\n});\n\nreturn cancelButton;\n\n}\n```\n\n##\
    \ [Congratulations!](#part0003.xhtml_sec-121)\n\nYou have successfully navigated\
    \ the challenges of this chapter! You have learned how to manipulate the DOM,\
    \ handle events, and use variables effectively.\n\n## [Answer Key](#part0003.xhtml_sec-122)\n\
    \n## [Chapter 3](#part0003.xhtml_sec-123)\n\n### CRACK THE CODE\n\nComments are\
    \ used to explain code in JavaScript. They are ignored by the browser.\n\n```javascript\n\
    // This is a comment\nvar x = 10;\n\n/*\n  This is a\n  multi-line comment\n*/\n\
    ```\n\n### 1. When are comments useful?\nComments are used to explain what the\
    \ code does to other developers or for your future self.\n\n### 2. What is the\
    \ difference between declaration and assignment?\nDeclaration creates the variable\
    \ (using `var`, `let`, or `const`). Assignment gives a value to that variable\
    \ (using `=`).\n\n### 3. Can the word “var” be used as a variable name?\nNo, `var`\
    \ is a reserved keyword in JavaScript and cannot be used as an identifier.\n\n\
    ### 4. What keywords were covered in this chapter?\nKeywords like `var`, `let`,\
    \ `const`, `if`, `else`, `function`, `return`, and `addEventListener` were covered.\n\
    \n### 5. What is the difference between increment operators and assignment?\n\
    Increment operators (`++`) increase a value by 1. Assignment (`=`) sets a specific\
    \ value.\n\n### 6. How are values in an array accessed?\nThey are accessed using\
    \ their index, which starts at 0.\n\n### 7. How are values in an object accessed?\n\
    They are accessed using their key via either dot notation (`.key`) or bracket\
    \ notation (`[\"key\"]`).\n\n### 8. What value is outputted if a nonexistent index\
    \ is accessed in an array?\nIt returns `undefined`.\n\n### 9. What value is outputted\
    \ if a nonexistent key is accessed in an object?\nIt returns `undefined`.\n\n\
    ### 10. When is bracket notation necessary for accessing a value in an object?\n\
    Bracket notation is necessary when the key is stored in a variable or contains\
    \ special characters/spaces.\n\n## DEBUGGING\n\n### 1. The variable doesn’t seem\
    \ to change value, despite the fact that it is incremented.\n```javascript\nvar\
    \ num = 0;\nnum++;\nconsole.log(num); // 1\n```\n\n### 2. Adding two numbers together\
    \ isn’t working properly.\nOne of the numbers is a string, so JavaScript performs\
