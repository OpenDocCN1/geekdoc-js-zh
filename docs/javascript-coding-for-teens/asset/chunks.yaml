    NONE OF THE BUTTONS WORK


    A fully functional to-do list, kind of? After hovering over an entry, a few buttons
    will show up. Clicking them doesn’t do anything.


    ![](Images/image00341.jpeg)


    Wow, what a coincidence. That was definitely not set up by the author of this
    book! Let’s use your understanding of how JavaScript can be used, in conjunction
    with HTML, to implement the missing features.


    [Helper Functions](#part0003.xhtml_sec-116)


    A few helper functions have been prepared for convenience.


    DESTROYINNERCONTENT


    This function removes all HTML elements that are inside it.


    function destroyInnerContent(htmlElement) {


    htmlElement.innerHTML = '''';


    }


    GETPARENTDIV


    This function will get the parent element of a particular HTML element. This will
    be used when you want to have HTML destroy itself.


    function getParentDiv(htmlElement) {


    return htmlElement.parentElement;


    }


    GETHTMLELEMENTHEIGHT


    This function will get the height of the HTML element. This will be used to manually
    change the height of HTML elements.


    function getHtmlElementHeight(htmlElement) {


    return htmlElement.offsetHeight;


    }


    GETTODOTEXT


    This function’s parameter is the to-do entry div and will extract the text inside.


    function getTodoText(parentDiv) {


    var editableTodo = parentDiv.getElementsByClassName(''editing-todo'');


    var nonEditableTodo = parentDiv.getElementsByClassName(''todo'');


    if (editableTodo[0] !== undefined) {


    return editableTodo[0].value;


    } else {


    return nonEditableTodo[0].innerHTML;


    }


    }


    [Deleting a To-Do Entry](#part0003.xhtml_sec-117)


    When the close icon is clicked, it would make perfect sense to have the entry
    be deleted, right? Let’s do that. First, inspect how the close button is made.
    The function is called createCloseButton. Right now, the only thing this function
    is doing is creating a close button. But there is no behavior associated with
    it! It’s time to add an event listener.


    In order to remove a to-do entry, we need a variable that points to the parent
    of the close button. In the process of removing the parent from the page, this
    will destroy all of the content inside. Easy peasy, right?


    function createCloseButton() {


    var closeButton = document.createElement(''span'');


    closeButton.innerHTML = ''x'';


    closeButton.classList.add(''close-button'');


    closeButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(closeButton);


    parentDiv.remove();


    });


    return closeButton;


    }


    [Editing a To-Do Entry](#part0003.xhtml_sec-118)


    Are you ready for hard mode? This time, you will add the ability to update an
    existing to-do entry.


    In order to accomplish this, you have to get clever about how you manipulate the
    HTML on the page.


    CREATE EDITABLE TEXT


    Currently, to-do entries exist as characters on the page, which can’t be manipulated
    by a visitor to the page. But there is a special type of HTML called textarea
    that creates a textbox for users to type into.


    What if you were to destroy the HTML that is holding the text, immediately insert
    the textarea in the exact same spot, insert the previous text into the textarea,
    and then style the textarea in the exact same way? Wouldn’t it look like the div
    was somehow converted into a textarea?


    Inside the createEditButton function, a click event listener is needed. This is
    where things get very tricky!


    First, create the textarea. There already is a function for that, called createEditableTextAreaWithHeight,
    which takes two arguments. One is the text to pre-insert into the textarea. The
    other is the height of HTML element. In order to make it look like it magically
    changed to a textarea, the height of the textarea needs to be the same as the
    HTML element it is replacing.


    function createEditButton() {


    var editButton = document.createElement(''span'');


    editButton.innerHTML = ''edit'';


    editButton.classList.add(''edit-button'');


    editButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(editButton);


    var originalText = getTodoText(parentDiv);


    var currentHTMLHeight = getHtmlElementHeight(parentDiv);


    var editingTextArea = createEditableTextAreaWithHeight(originalText, currentHTMLHeight);


    });


    return editButton;


    }


    After setting that up, the div with the uneditable text needs to be destroyed.
    Append the newly created textarea. The create and update buttons now need to be
    recreated and inserted into the page.


    For a better user experience, a method called focus can be used on the textarea
    so the cursor immediately jumps into the textarea after the edit button is clicked.
    Test it out yourself now! It should change to an editable HTML element.


    function createEditButton() {


    var editButton = document.createElement(''span'');


    editButton.innerHTML = ''edit'';


    editButton.classList.add(''edit-button'');


    editButton.addEventListener(''click'', function () {


    var parentDiv = getParentDiv(editButton);


    var originalText = getTodoText(parentDiv);


    var currentHTMLHeight = getHtmlElementHeight(parentDiv);


    var editingTextArea = createEditableTextAreaWithHeight (originalText, currentHTMLHeight);


    destroyInnerContent(parentDiv);


    parentDiv.append(editingTextArea);


