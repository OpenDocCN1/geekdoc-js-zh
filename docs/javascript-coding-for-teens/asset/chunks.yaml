    ```javascript\nfunction includes(char, string) {\n  for (var i = 0; i < string.length;\
    \ i++) {\n    var currentStrChar = string[i];\n    if (char === currentStrChar)\
    \ {\n      return true;\n    }\n  }\n  return false;\n}\n```\n\n#### createDivWithText\n\
    \nThis function, using JavaScript, will create a div element and insert text.\n\
    \n```javascript\nfunction createDivWithText(text) {\n  var div = document.createElement('div');\n\
    \  div.innerHTML = text;\n  return div;\n}\n```\n\n#### getRandomEntry\n\nThis\
    \ function accepts an array and returns a random element from it. Don’t sweat\
    \ the details.\n\n```javascript\nfunction getRandomEntry(array) {\n  var randomIdx\
    \ = Math.floor(Math.random() * array.length);\n  return array[randomIdx];\n}\n\
    ```\n\n### INITIALIZE HANGMAN OBJECT\n\nA constructor function is needed! Recall\
    \ that the following elements need to be tracked:\n- The secret word\n- The Characters\
    \ guessed\n- The Total number of bad guesses before losing\n\nSounds like instance\
    \ variables are needed. The parameter will be a secret word. There are six bad\
    \ guesses because a person has six body parts in Hangman (head, body, right arm,\
    \ left arm, right leg, left leg).\n\n```javascript\nfunction Hangman(secretWord)\
    \ {\n  this.secretWord = secretWord;\n  this.charactersGuessed = '';\n  this.remainingBadGuesses\
    \ = 6;\n}\n```\n\nBut wait! How is a secret word going to be selected? Using an\
    \ array of secret words, a random one can be selected using the `getRandomEntry`\
    \ function. Easy, right? Here is what the `initialize` function currently looks\
    \ like.\n\n```javascript\nfunction initialize() {\n  var wordBank = [ // add whatever\
    \ words you want here!\n    'cat',\n    'soul',\n    'watch',\n  ];\n  var randomWord\
    \ = getRandomEntry(wordBank);\n  var game = new Hangman(randomWord);\n}\n```\n\
    \n### INSERT SECRET WORD INTO HTML\n\nTo add the secret word on the page, JavaScript\
    \ will be used to create it. Another class, `hidden`, is added to hide the character.\n\
    \n```javascript\nHangman.prototype.initializeSecretWord = function () {\n  var\
    \ container = document.getElementById('secret-word');\n  for (var i = 0; i < this.secretWord.length;\
    \ i++) {\n    var secretChar = this.secretWord[i];\n    var div = createDivWithText(secretChar);\n\
    \    div.classList.add('secret-character', 'hidden');\n    container.append(div);\n\
    \  }\n};\n```\n\n### KEYDOWN LISTENER\n\nThe player will type keys and the game\
    \ should react to it. A `keydown` event listener is needed. A majority of the\
    \ game logic will be placed here!\n\n#### Get the Pressed Key\n\nThe event parameter\
    \ of the event listener contains the key that was pressed. When the player is\
    \ guessing, capitalization doesn’t matter, so lowercasing will be performed on\
    \ the key value.\n\n```javascript\ndocument.addEventListener('keydown', function\
    \ (event) {\n  // logic here\n});\n```\n\n#### Check If the Key Is Not Alphabetic\n\
    \nThe event listener should have no behavior if the player types a non-alphabetic\
    \ key. This is the first place where we will use the `includes` function to solve\
