    # Introduction

    Hey there, my name is Andrew Yueh. I’m a hobbyist programmer and professional
    software developer. Building products that people use and solving technical challenges
    are my favorite things about programming. My programming language of choice in
    my professional and personal life is JavaScript.


    We are here to get your feet wet in the world of `JavaScript` and programming
    fundamentals. `Chapters 1` and `2` cover what programming is and how to get your
    computer ready for `JavaScript` programming. `Chapters 3` through `9` are where
    the real learning starts. These chapters teach the basics of a variety of core
    programming concepts.


