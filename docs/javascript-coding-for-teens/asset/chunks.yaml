  trans: "\n哇，这些信息真多！不用担心事件中存在的信息。目前，只需要知道 `addEventListener` 提供了关于 `click` 事件的信息即可。\n\
    \n### 骇客提示\n\n`click` 事件是 JavaScript 可用的许多类型事件之一。如果你想了解更多关于哪些可用事件，可以在在线资源中找到它们。\n\
    \n## 使用 CSS 隐藏元素 (#part0003.xhtml_sec-100)\n\nCSS 与 JavaScript 的配合效果非常好。在页面上创建元素有两种方法：一种是手动创建它们，另一种是显示隐藏的元素。\n\
    \n### 将 CSS 应用到 HTML\n\n将 CSS 样式应用到页面有两种不同的方法。一种是使用 `style` 标签。CSS 可以封装在内部，样式将通过\
    \ `class` 属性应用。在这里，类名 `hide` 被添加到你的按钮上，并关联相应的 CSS 使按钮变得不可见。\n\n```html\n<html>\n\
    <head>\n<style>\n.hide {\nopacity: 0;\n}\n</style>\n</head>\n<body>\n<button id=\"\
    clickable-button\" class=\"hide\">\nClick me!\n</button>\n</body>\n<script src=\"\
    index.js\"></script>\n</html>\n```\n\n在浏览器中检查此内容，按钮现在消失了！但如果你检查页面，按钮仍然在那里！它只是不可见。\n\
    \n![](img/image00330.jpeg)\n\n另一种方法是导入 CSS 文件，这更常用。这是使用 `link` 标签并为标签提供 `rel`\
    \ 和 `href` 属性来实现的。`rel` 值始终是“stylesheets”，而 `href` 是文件名。让我们修改一下，让样式位于单独的文件中但仍然应用到页面。\n\
    \n创建一个带有 `.css` 扩展的新文件。我的文件将命名为 `styles.css`。\n\n```css\n.hide {\nopacity: 0;\n\
    }\n```\n\n然后使用 `link` 标签将其导入。什么都不应该有变化！\n\n```html\n<html>\n<head>\n<link rel=\"\
    stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<button id=\"clickable-button\"\
    \ class=\"hide\">\nClick me!\n</button>\n</body>\n<script src=\"index.js\"></script>\n\
    </html>\n```\n\n### 使用 CSS 显示和隐藏元素\n\nCSS 可用于隐藏元素，而 JavaScript 可以操作 HTML，包括类和\
    \ `ids`。这意味着你可以使用代码显示和隐藏元素！让我们就此尝试。添加一个具有类 `hide` 和 `id` 的 HTML 元素，以便可以使用 `getElementById`。\n\
    \n```html\n<html>\n<head>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
    <body>\n<button id=\"clickable-button\">\nClick me!\n</button>\n<div class=\"\
    hide\" id=\"content\">\nContent!\n</div>\n</body>\n<script src=\"index.js\"></script>\n\
    </html>\n```\n\n然后，在 JavaScript 文件中为按钮事件监听器添加行为，从 HTML 元素中移除该类。\n\n```javascript\n\
    // index.js\nvar button = document.getElementById('clickable-button');\nbutton.addEventListener('click',\
    \ function () {\n  var hiddenElement = document.getElementById('content');\n \
    \ hiddenElement.classList.remove('hide');\n});\n```\n\n点击按钮后，隐藏的内容应该会显示。\n\n![](img/image00331.jpeg)\n\
    \n## 浏览器特定的 JavaScript 实战 (#part0003.xhtml_sec-101)\n\n现在你已经大致了解了 JavaScript 如何与浏览器和\
    \ HTML 交互，是时候提高你的水平迎接更大的挑战了！\n\n### 在页面上打字\n\n在这个练习中，你将让你的网站检测按键输入并将其显示在页面上！需要一个带有\
    \ `div` 的 HTML 文件。这个 `div` 将包含用户输入的按键。还需要一个指向 `index.js` 文件的 `script` 标签。\n\n\
    ```html\n<html>\n<head>\n</head>\n<body>\n<div id=\"text\">\n</div>\n</body>\n\
    <script src=\"index.js\"></script>\n</html>\n```\n\n在 `index.js` 中，添加用于记录按键的事件监听器。在之前的事件监听器示例中，你需要将监听器附加到按钮上。但在这里，位置并不重要。所有的按键都应该被记录。事件监听器应该添加到整个\
    \ `document`。\n\n```javascript\n// index.js\ndocument.addEventListener('keydown',\
    \ function(event) {\n  console.log(event);\n});\n```\n\n刷新页面并按下“a”键后，可以在开发者控制台中看到按键事件的事件对象。\n\
    \n![](img/image00332.jpeg)\n\n事件对象包含大量信息，但 `key` 属性具有重要信息。它包含了按键的名称。\n\n```javascript\n\
    // index.js\ndocument.addEventListener('keydown', function(event) {\n  console.log(event.key);\n\
    });\n```\n\n通过 `console.log`，可以在开发者控制台中看到所按下的按键名称。当输入“hi my name is andrew”时，每个单独的按键名称都会打印在开发者控制台中。\n\
    \n在确认事件监听器捕捉到了按键后，添加必要的语句来更新 `div` 中的文本。\n\n```javascript\n// index.js\ndocument.addEventListener('keydown',\
    \ function(event) {\n  console.log(event.key);\n  var div = document.getElementById('text');\n\
    \  div.innerHTML += event.key;\n});\n```\n\n![](img/image00333.jpeg)\n\n非常酷！等一下，如果你犯了错误并想撤销会发生什么？\n"
- fmt: "\n# JavaScript HTML selectors\n# Modifying HTML elements using JavaScript\n\
    # Event listeners\n\n![](Images/image00336.jpeg)\n\n## CHAPTER 10: Game Time\n\
    \nYou made it! Your tool-kit now consists of programming fundamentals, object-oriented\
    \ programming, and web-specific JavaScript. You have covered all of the fundamentals\
    \ that this book has to offer. That being said, what good are these lessons if\
    \ you don’t do anything with them? Let’s wrap it up by creating a game—one that\
    \ will run on the browser.\n\n### Hangman on the Browser\n\nThe game of choice\
    \ is Hangman. Sure, you’ve made Hangman for the terminal. The fundamentals don’t\
    \ change. But when it comes to the browser, some parts of the implementation are\
    \ tricky!\n\n### Hangman: Terminal vs. Browser\n\nThe main difference between\
    \ browser and terminal are the graphics. Instead of `console.log`, HTML needs\
    \ to be modified. For example, the way you decide whether a player has lost is\
    \ identical.\n\n```javascript\nHangman.prototype.playerLost = function () {\n\
    \  return this.remainingBadGuesses === 0;\n};\n```\n\nOn the other hand, the way\
    \ guessed characters are shown is going to be completely different. On the browser,\
    \ a `console.log` isn’t going to cut it anymore!\n\n```javascript\nHangman.prototype.showGuessedCharacters\
    \ = function() {\n  var str = '';\n  for (var i = 0; i < this.charactersGuessed.length;\
    \ i++) {\n    var currChar = this.charactersGuessed[i];\n    str += currChar;\n\
    \    str += ' ';\n  }\n  console.log('You have currently guessed the following\
    \ characters:');\n  console.log(str);\n};\n```\n\nContent must be visually expressed\
    \ using HTML. In the same way you need to use clever tricks to solve algorithms,\
    \ you need to get creative to manipulate HTML.\n\n### Hangman Implementation\n\
    \nNone of the rules of Hangman change. A majority of the smaller challenges from\
    \ the previous chapters are the same. The difference is the implementation.\n\n\
    Before starting, revisit the game conditions. This is an identical template from\
    \ the object-oriented programming chapter.\n\n**Variables to Track:**\n* The secret\
    \ word\n* Characters guessed\n* Total number of bad guesses before losing\n\n\
    **Terminating Conditions:**\n* If the player has made six bad guesses, the player\
    \ has lost.\n* If the player has guessed all the characters in the secret word,\
    \ the player has won.\n\n**Hangman Game Cycle:**\n* Show characters that have\
    \ been guessed.\n* Prompt the player to guess a character.\n* Add the guessed\
    \ character to a character bank.\n* Reveal correctly guessed characters in the\
    \ secret word.\n\n**Game Bounds:**\n* Prevent identical guesses.\n* Prevent non-alphabetic\
    \ guesses.\n* Ignore capitalization when guessing.\n\n## GAME GRAPHICS\n\nYou\
    \ need to show the player what is happening while they are playing the game. Everything\
    \ that was done on the terminal, with raw text, now must be done on the browser,\
    \ with HTML manipulation. To do so you will implement the following rules:\n\n\
    1. **When the game starts**\n    * a. Blank spaces for the secret word\n    *\
    \ b. Space to show letters that have been guessed\n    * c. Message bar to display\
    \ game feedback to the player\n    * d. Hangman progress on the rope\n2. **When\
    \ the player guesses a character**\n    * a. **If character is correct**\n   \
    \     * Inform them using message in the message bar\n        * Reveal it in the\
    \ secret word section\n        * Add to the list of guessed characters\n    *\
    \ b. **If character is wrong**\n        * Tell them using a message\n        *\
    \ Add a body part to the person\n        * Add to the list of guessed characters\n\
    \    * c. **If character has been previously guessed**\n        * Tell them using\
    \ a message\n        * Ignore the guess\n3. **Check to see if the player has won\
    \ or lost**\n    * a. If neither won or lost, continue game\n    * b. If won,\
    \ open game over screen and tell them they won\n    * c. If lost, open game over\
    \ screen and tell them they lost\n    * d. If won or lost, allow game resetting\n\
    \n### HTML File\n\nBefore coding, an HTML file is needed, or else JavaScript would\
    \ have nothing to manipulate! Here is the file in full. This is including the\
    \ CSS and JavaScript imports, with link and script tags. Each part will be individually\
    \ examined.\n\n```html\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"hangman.css\"\
    >\n  <link rel=\"stylesheet\" href=\"person.css\">\n</head>\n<body>\n  <div>\n\
    \    <div id=\"rope\">|</div>\n    <div id=\"pole\"></div>\n  </div>\n  <div id=\"\
    person\">\n    <div id=\"head\" class=\"appendage intact\">o</div>\n    <div id=\"\
