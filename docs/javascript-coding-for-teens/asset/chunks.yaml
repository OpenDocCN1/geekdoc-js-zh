  trans: "\n\n# 调试\n\n一个基础的聊天程序在运行时出现了问题。`printLog` 方法应该打印聊天历史。这个稍微有点棘手，因为有两个对象正在相互交互。你正在以高级的方式使用数据结构，所以不要害使用\
    \ `console.log` 来检查变量的值。\n\n```javascript\nfunction Person(name) {\n  this.name\
    \ = name;\n}\n\nfunction ChatProgram() {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message\
    \ = function (person, message) {\n  var messageEntry = {\n    person: person,\n\
    \    message: message\n  };\n  this.chatLog(messageEntry); // 注意: 这看起来像源代码中的一个\
    \ bug\n};\n\nChatProgram.prototype.parseMessageEntry = function (chatEntry) {\n\
    \  return chatEntry.person.name + ': ' + chatEntry.chat;\n};\n\nChatProgram.prototype.getLog\
    \ = function () {\n  var allMessages = [];\n  for (var i = 0; i < this.chatLog.length;\
    \ i++) {\n    var chatEntry = this.chatLog[i];\n    var parsedMessage = this.prototype.parseMessageEntry(chatEntry);\n\
    \    allMessages.pop(parsedMessage);\n  }\n  return allMessages;\n};\n\nChatProgram.prototype.printLog\
    \ = function () {\n  var allMessages = this.getLog;\n  for (var i = 0; i < allMessages.length;\
    \ i++) {\n    console.log(allMessages[i]);\n  }\n};\n\nvar layna = new Person('Layna');\n\
    var andrew = new Person('Andrew');\nvar chat = new ChatProgram();\nchat.message(andrew,\
    \ 'Hi Layna, how\\'s it going?');\nchat.message(layna, 'I\\'m doing great');\n\
    chat.message(layna, 'What about you?');\nchat.message(andrew, 'I just came back\
    \ from the doctor');\nchat.message(layna, 'Wow, this conversation is really boring');\n\
    chat.message(andrew, 'That was really mean, why would you say something like that?');\n\
    chat.message(layna, 'I have better things to do');\nchat.message(andrew, ':(');\n\
    chat.message(layna, 'Goodbye');\nchat.printLog();\n```\n\n这是预期的输出。\n\n![](img/image00302.jpeg)\n\
    \n# 程序员检查清单\n\n程序员检查清单 » 让我们复习一下涵盖过的主题\n\n面向对象编程并不是 JavaScript 特有的，但它是第一个并非在所有编程语言中都通用的主题。面向对象编程是解决编程挑战的众多策略之一。随着你在编程工具箱中积累了更多技术，你将会发现解决问题有多种方法。发现问题的最佳方法需要经验和直觉。如果你有一个不确定的想法，尽管尝试一下吧！编程的精髓就在于从过去的错误中学习。以下是对你在本章中所学习的内容的快速复习。\n\
    \n*   什么是对象\n*   什么是对象实例\n*   如何创建实例变量\n*   如何创建方法\n\n![](img/image00303.jpeg)\n\
    \n# 第 9 章：JavaScript 与 Web\n\n所有（无聊的）HTML 能做的一切都可以用 JavaScript 实现——而且不仅如此！为了证明这一点，在本章中，你将从网页上的\
    \ HTML 开始，展示如何用 JavaScript 实现相同的功能，然后进一步超越 HTML 的能力范围。这是你第一次体验现代 JavaScript 的魅力以及它的高光之处。我希望你和我一样兴奋！\n\
    \n## Web 的抽象层次\n\n与你的标准终端相比，网站处于完全不同的抽象层次上。如果说 `console.log` 的抽象层次像是骑自行车，那么 JavaScript\
    \ 及其 Web 开发功能就像是开车。\n\n对于本章来说，你不需要担心工具是如何工作的。你只需要关注利用工具在网页浏览器上执行有意义的任务的能力。\n\n\
    ## HTML：超文本标记语言\n\n你将非常依赖 JavaScript，但仍然需要少量的超文本标记语言（即 HTML）来与网页交互。现代网站使用了大量的\
    \ JavaScript 来操作它。\n\n### HTML 文件\n\n就像 JavaScript 有它自己的扩展名 `.js` 一样，HTML 也有它自己的扩展名\
    \ `.html`。创建一个 HTML 文件。这是某个东西被视为网页的最低要求。我将我的文件命名为 `index.html`，这是第一个 HTML 文件的标准名称。\n\
    \n![](img/image00304.jpeg)\n\n### HTML 标签\n\n注意单词周围的角括号了吗？那是 HTML 语法。\n\n```\n\
    <valid-html-tag-name-here>\n```\n\n一个周围有角括号包围，另一个有一个角括号和一个斜杠。只有角括号的标签被称为起始标签，另一个带有斜杠的是闭合标签。起始标签必须有一个对应的闭合标签。\n\
    \n```html\n<html>\n</html>\n```\n\n在起始标签和闭合标签之间可以放置任何数量的内容。HTML 可以变得极其复杂！\n\n\
    ### 我们将使用的 HTML 标签\n\n因为本书的侧重点是 JavaScript，所以只会涵盖几个 HTML 标签。\n\n```html\n<html>\n\
    <head></head>\n<body>\n<div>\n  Hello!\n</div>\n</body>\n</html>\n```\n\n`html`\
    \ 标签是包裹文件中所有 HTML 内容的主标签。`head` 标签是多用途的。它通常是插入非视觉化 HTML 的地方。`body` 标签是放置视觉元素的地方。`div`\
    \ 是一个没有重要作用的标签。它简单地用于封装其内部的元素。\n\n### HTML 属性：CLASS 和 ID\n\n有许多不同的 HTML 属性。应用它们的语法是属性名、等号和值（双双引号）。从概念上说，它与对象数据结构中的键值对非常相似。\n\
    \n```html\n<div class=\"container\">\n  I am content in a div!\n</div>\n```\n\n\
    在 HTML 中拥有 `class` 和 `id` 属性是非常重要的。在处理 JavaScript 时，常用的策略是通过类或 ID 查找 HTML 元素。\n\
    \n## Web 浏览器\n\n在开始之前，确保已安装 Google Chrome 浏览器。并不是所有浏览器的构建都是相同的，而且 Google Chrome\
    \ 在运行 JavaScript 方面非常出色。\n\n搜索引擎查询：“google chrome download”\n\n当前 URL：[google.com/chrome](http://google.com/chrome)\n\
    \n### 浏览器开发者工具\n\n安装后，打开 Google Chrome。导航到设置（右上三个点） -> 更多工具 -> 开发者工具。\n\n开发者控制将会出现。作为程序员，这里是魔法发生的地方。它就像内置在浏览器中的终端。\n\
    \n![](img/image00305.jpeg)\n\n在你的操作系统（PC 或 Mac）文件系统中找到文件。最简单的方法是在 VS Code 中右键点击文件并选择“在资源管理器中显示”。对于\
    \ Mac 是“在访达中显示”。这会打开文件所在的目录。\n\n![](img/image00306.jpeg)\n\n如果文件已经有了 Google Chrome\
    \ 图标，双击文件打开它。文件也可以拖到浏览器窗口中。\n\n![](img/image00307.jpeg)\n\n注意位置不是互联网 URL？那是 HTML\
    \ 文件的目录路径。在确认文件运行后，修改 HTML。\n\n```html\n<html>\n<head></head>\n<body>\n<div>\n\
    \  Hello!\n</div>\n<div>\n  I EXTREMELY cool\n</div>\n</body>\n</html>\n```\n\n\
    修改后，页面没有变化。为什么浏览器没有承认我们非常酷呢？那是因为浏览器加载了文件的旧版本。为了看到更新，请刷新页面。\n\n![](img/image00308.jpeg)\n\
    \n刷新后，我们看到了更新。非常棒！\n\n![](img/image00309.jpeg)\n\n## 文档\n\n在浏览器中，会自动创建一个名为 `document`\
    \ 的变量。将其输入开发者控制台。该变量是一个指向整个页面的 JavaScript 对象。展开后，所有的 HTML 都显现了。使用你的鼠标指针悬停在 `document`\
    \ 变量上。注意网页是蓝色的？\n\n![](img/image00310.jpeg)\n\n开发者控制台会高亮光标悬停过的 HTML。为了进一步证明这一点，展开\
    \ body 并悬停在一个高亮的 div 元素上。\n\n![](img/image00311.jpeg)\n\n## HTML 选择器\n\n"
- fmt: "\nJavaScript has many browser-related functions to use. `document` is an object,\
    \ which means it has methods. The available methods can modify HTML. The entire\
    \ web development community relies heavily on this handful of methods and functions.\n\
    \n## DOCUMENT.GETELEMENTSBYCLASSNAME\n\nOne method on the document object that\
    \ will be used extensively is `document.getElementsByClassName`. If we change\
    \ the `div` HTML elements to have class attributes, `document.getElementsByClassName`\
    \ can work its magic!\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"\
    cool-message\">\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY\
    \ cool\n</div>\n</body>\n</html>\n```\n\n`document.getElementsByClassName` accepts\
    \ one parameter. It is the string name of the class. The class `cool-message`\
    \ was added to the `div` elements. This attribute will be used to identify the\
    \ HTML elements. Use the following code in the developer console. After the code\
    \ is run, type the variable name `divElements` to show its value in the console.\n\
    \n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
    ```\n\nAfter the code is run, type the variable name `divElements` into the console\
    \ again to show its value.\n\n![](Images/image00312.jpeg)\n\nGreat! Looks like\
    \ the statement returned an array of our two HTML elements! Well, technically,\
    \ it is a data structure called an `HTMLCollection`. Moving forward, `HTMLCollections`\
    \ will be referred to as an array-like data structure. But don’t worry, because\
    \ the distinction between arrays and array-like data structures won’t impact you.\
    \ Loops work on `HTMLCollections`.\n\n## DOCUMENT.GETELEMENTBYID\n\nIn the same\
    \ way `document.getElementsByClassName` gets HTML elements by their class attribute,\
    \ `document.getElementById` selects an element by its id attribute. In order to\
    \ have an element get selected by `document.getElementById`, modify the HTML.\
    \ Add a `div` element with an id attribute. \n\n```html\n<html>\n<head>\n</head>\n\
    <body>\n<div class=\"cool-message\">\nHello!\n</div>\n<div class=\"cool-message\"\
    >\nI am EXTREMELY cool\n</div>\n<div id=\"occupation\">\nThat is because I am\
    \ a programmer\n</div>\n</body>\n</html>\n```\n\nRefresh the page. Type the following\
    \ code into the developer console. After typing the variable name into the console\
    \ again, the return value should be pointing to the third line of text.\n\n```javascript\n\
    var divElement = document.getElementById('occupation');\n```\n\n![](Images/image00313.jpeg)\n\
    \nNotice how `document.getElementById` returns a single element? It does not return\
    \ an array-like data structure, like `document.getElementsByClassName` does. That’s\
    \ because `document.getElementById` can only select one element at a time.\n\n\
    ## HTML Manipulation\n\nHTML elements have many methods and properties in them,\
    \ just like the document object. These methods and properties give us the ability\
    \ to modify specific HTML elements.\n\n### ACCESS TEXT WITH INNERHTML\n\nWhen\
    \ writing text on the page and wrapping it inside HTML, `div` is the most straightforward\
    \ tag to use. When JavaScript uses a selector to point to the HTML, it is represented\
    \ as a JavaScript object. This object has a key named `innerHTML`. It holds the\
    \ text inside an HTML element. This can be seen by revisiting your sample HTML.\
    \ Grab the text inside the `div` with the id of `occupation` using `document.getElementById`.\n\
    \n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"cool-message\">\nHello!\n\
    </div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div id=\"\
    occupation\">\nThat is because I am a programmer\n</div>\n</body>\n</html>\n```\n\
    \n```javascript\nvar divElement = document.getElementById('occupation');\ndivElement.innerHTML;\n\
    ```\n\n![](Images/image00314.jpeg)\n\n### INJECTING NEW TEXT WITH INNERHTML\n\n\
    `innerHTML` is a property on the object. Just like with any key-value pair on\
    \ an object, it can be reassigned. This allows modification of the text inside.\n\
    \n```javascript\nvar divElement = document.getElementById('occupation');\ndivElement.innerHTML\
    \ += ' and love building things';\n```\n\n![](Images/image00315.jpeg)\n\nUsing\
    \ the self-addition operator, extra text was appended to the `div` element’s `innerHTML`.\
    \ Congrats! You have taken the first step into the world of web development.\n\
    \n### UPDATING ATTRIBUTE ID\n\nIn the same way `innerHTML` can be updated, the\
    \ attributes `class` and `id` can be changed as well. Updating the `id` of an\
    \ HTML element is easy. The key is `id`.\n\n```javascript\nvar divElement = document.getElementById('occupation');\n\
    divElement.id = 'new-id';\n```\n\n### UPDATING ATTRIBUTE CLASS\n\nUpdating `class`\
    \ is trickier than `id`. This is because it is common to have multiple classes\
    \ assigned. Revisit the HTML file. Right now, the `div` elements have a single\
    \ class.\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
    >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n\
    <div id=\"occupation\">\nThat is because I am a programmer\n</div>\n</body>\n\
    </html>\n```\n\nThe method to add a class to an existing HTML element is `classList.add`.\
    \ It takes a single parameter, which is the name of the class, to append.\n\n\
    ```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
    divElements[0].classList.add('new-class');\n```\n\n![](Images/image00316.jpeg)\n\
    \nThe method to remove a class is `classList.remove`, which takes a single argument\
    \ that is the name of the class.\n\n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
    divElements[0].classList.remove('new-class');\n```\n\n![](Images/image00317.jpeg)\n\
    \n## PURPOSE OF CHANGING HTML CLASS\n\nSo far, you’ve been doing a lot of work\
    \ to learn how to change an HTML element’s class. This becomes important when\
    \ working with CSS. This book won’t be covering CSS, but just know that updating\
    \ the class attribute is a common way of triggering visual changes on HTML elements.\n\
    \n## Creating Elements\n\nThe `document` object also has methods to create HTML\
    \ elements. This will become important when you make your game!\n\n### DOCUMENT.CREATEELEMENT\n\
    \nUsing `document.createElement`, JavaScript can create HTML. It accepts one parameter,\
    \ which is the string name of the HTML tag. Because we aren’t learning much HTML,\
    \ we will always be creating a `div` element.\n\n```javascript\nvar div = document.createElement('div');\n\
    div.innerHTML = 'I am a new div!';\n```\n\n![](Images/image00318.jpeg)\n\nAn HTML\
    \ `div` has been created with `innerHTML`: “I am a new div!” But where is it?\
    \ You’ve created it, but you haven’t put it anywhere!\n\n### APPENDING HTML TO\
    \ THE PAGE\n\nAn HTML element that is created with JavaScript needs to be manually\
    \ added to the page. This is where the method `append` is used. It exists on the\
    \ HTML object that is retrieved using any HTML selector, such as `document.getElementsByClassName`\
    \ and `document.getElementById`.\n\n```javascript\nvar div = document.createElement('div');\n\
    div.innerHTML = 'I am a new div!';\nvar divElements = document.getElementsByClassName('cool-message');\n\
    divElements.append(div);\n```\n\n![](Images/image00319.jpeg)\n\nWhoops! Why did\
    \ this not work? That’s because `document.getElementsByClassName` returns an array-like\
    \ data structure.\n\n![](Images/image00320.jpeg)\n\nAccessing an element in the\
    \ array-like data structure can be done by index.\n\n```javascript\nvar div =\
    \ document.createElement('div');\ndiv.innerHTML = 'I am a new div!';\nvar divElements\
    \ = document.getElementsByClassName('cool-message');\ndivElements[1].append(div);\n\
    ```\n\n![](Images/image00321.jpeg)\n\nYou just used pure JavaScript to make HTML!\
    \ I think that’s pretty cool.\n\n### REMOVING HTML FROM THE PAGE\n\nJavaScript\
    \ can be used to remove HTML elements as well. Modify the HTML file with a new\
    \ `div` element that has an id attribute with some `innerHTML`.\n\n```html\n<html>\n\
    <head>\n</head>\n<body>\n<div class=\"cool-message\">\nHello!\n</div>\n<div class=\"\
    cool-message\">\nI am EXTREMELY cool\n</div>\n<div id=\"occupation\">\nThat is\
    \ because I am a programmer\n</div>\n<div id=\"untrue-message\">\nJust kidding,\
    \ programmers are losers\n</div>\n</body>\n</html>\n```\n\n![](Images/image00322.jpeg)\n"
  raw: 'JavaScript has many browser-related functions to use. document is an object,
    which means it has methods. The available methods can modify HTML. The entire
    web development community relies heavily on this handful of methods and functions.


    DOCUMENT.GETELEMENTSBYCLASSNAME


    One method on the document object that will be used extensively is document.get
    ElementsByClassName. If we change the div HTML elements to have class attributes,
    document.getElementsByClassName can work its magic!


    <html>


    <head>


    </head>


    <body>


    <div class="cool-message">


    Hello!


    </div>


    <div class="cool-message">


    I am EXTREMELY cool


    </div>


    </body>


    </html>


    document.getElementsByClassName accepts one parameter. It is the string name of
    the class. The class “cool-message” was added to the div elements. This attribute
    will be used to identify the HTML elements. Use the following code in the developer
    console. After the code is run, type the variable name to show its value in the
    console.


    var divElements = document.getElementsByClassName(''cool-message'');


    After the code is run, type the variable name divElements into the console again
    to show its value.


    ![](Images/image00312.jpeg)


    Great! Looks like the statement returned an array of our two HTML elements! Well,
    technically, it is a data structure called an HTMLCollection. Moving forward,
    HTMLCollections will be referred to as an array-like data structure. But don’t
    worry, because the distinction between arrays and array-like data structures won’t
    impact you. Loops work on HTMLCollections.


    DOCUMENT.GETELEMENTBYID


    In the same way document.getElementsByClassName gets HTML elements by their class
    attribute, document.getElementById selects an element by its id attribute. In
    order to have an element get selected by document.getElementById, modify the HTML.
    Add a div element with an id attribute.


    <html>


    <head>


    </head>


    <body>


    <div class="cool-message">


    Hello!


    </div>


    <div class="cool-message">


    I am EXTREMELY cool


    </div>


    <div id="occupation">


    That is because I am a programmer


    </div>


    </body>


    </html>


    Refresh the page. Type the following code into the developer console. After typing
    the variable name into the console again, the return value should be pointing
    to the third line of text.


    var divElement = document.getElementById(''occupation'');


    ![](Images/image00313.jpeg)


    Notice how document.getElementById returns a single element? It does not return
    an array-like data structure, like document.getElementsByClassName does. That’s
    because document.getElementById can only select one element at a time.


    [HTML Manipulation](#part0003.xhtml_sec-94)


    HTML elements have many methods and properties in them, just like the document
    object. These methods and properties give us the ability to modify specific HTML
    elements.


    ACCESS TEXT WITH INNERHTML


    When writing text on the page and wrapping it inside HTML, div is the most straightforward
    tag to use. When JavaScript uses a selector to point to the HTML, it is represented
    as a JavaScript object. This object has a key named innerHTML. It holds the text
    inside an HTML element. This can be seen by revisiting your sample HTML. Grab
    the text inside the div with the id of “occupation” using document.getElementById.


    <html>


    <head>


    </head>


    <body>


    <div class="cool-message">


    Hello!


    </div>


    <div class="cool-message">


    I am EXTREMELY cool


    </div>


    <div id="occupation">


    That is because I am a programmer


    </div>


    </body>


    </html>


    var divElement = document.getElementById(''occupation'');


    divElement.innerHTML;


    ![](Images/image00314.jpeg)


    INJECTING NEW TEXT WITH INNERHTML


    innerHTML is a property on the object. Just like with any key-value pair on an
    object, it can be reassigned. This allows modification of the text inside.


    var divElement = document.getElementById(''occupation'');


    divElement.innerHTML += '' and love building things'';


    ![](Images/image00315.jpeg)


    Using the self-addition operator, extra text was appended to the div element’s
    innerHTML. Congrats! You have taken the first step into the world of web development.


    UPDATING ATTRIBUTE ID


    In the same way innerHTML can be updated, the attributes class and id can be changed
    as well. Updating the id of an HTML element is easy. The key is id.


    var divElement = document.getElementById(''occupation'');


    divElement.id = ''new-id'';


    UPDATING ATTRIBUTE CLASS


    Updating class is trickier than id. This is because it is common to have multiple
    classes assigned. Revisit the HTML file. Right now, the div elements have a single
    class.


    <html>


    <head>


    </head>


    <body>


    <div class="cool-message">


    Hello!


    </div>


    <div class="cool-message">


    I am EXTREMELY cool


    </div>


    <div id="occupation">


    That is because I am a programmer


    </div>


    </body>


    </html>


    The method to add a class to an existing HTML element is classList.add. It takes
    a single parameter, which is the name of the class, to append.


    var divElements = document.getElementsByClassName(''cool-message'');


    divElements[0].classList.add(''new-class'');


    ![](Images/image00316.jpeg)


    The method to remove a class is classList.remove, which takes a single argument
    that is the name of the class to be removed.


    var divElements = document.getElementsByClassName(''cool-message'');


    divElements[0].classList.remove(''new-class'');


    ![](Images/image00317.jpeg)


    PURPOSE OF CHANGING HTML CLASS


    So far, you’ve been doing a lot of work to learn about how to change an HTML element’s
    class. This becomes important when you’re working with CSS. This book won’t be
    covering CSS, but just know that updating the class attribute is a common way
    of triggering visual changes on HTML elements.


    [Creating HTML Elements](#part0003.xhtml_sec-95)


    The document object also has methods to create HTML elements. This will become
    especially important when you make your game!


    DOCUMENT.CREATEELEMENT


    Using document.createElement, JavaScript can create HTML. It accepts one parameter,
    which is the string name of the HTML tag. Because we aren’t learning much HTML,
    we will always be creating a div element when using document.createElement.


    var div = document.createElement(''div'');


    div.innerHTML = ''I am a new div!'';


    ![](Images/image00318.jpeg)


    An HTML div has been created with innerHTML: “I am a new div!” But where is it?
    It isn’t on the page. You’ve created it, but you haven’t put it anywhere!


    APPENDING HTML TO THE PAGE


    An HTML element that is created with JavaScript needs to be manually added to
    the page. This is where the method append is used. It exists on the HTML object
    that is retrieved using any HTML selector, such as document.getElementsByClassName
    and document.getElementById.


    var div = document.createElement(''div'');


    div.innerHTML = ''I am a new div!'';


    var divElements = document.getElementsByClassName(''cool-message'');


    divElements.append(div);


    ![](Images/image00319.jpeg)


    Whoops! Why did this not work? That’s because document.getElementsByClassName
    returns an array-like data structure.


    ![](Images/image00320.jpeg)


    Accessing an element in the array-like data structure can be done by index.


    var div = document.createElement(''div'');


    div.innerHTML = ''I am a new div!'';


    var divElements = document.getElementsByClassName(''cool-message'');


    divElements[1].append(div);


    ![](Images/image00321.jpeg)


    You just used pure JavaScript to make HTML! I think that’s pretty cool.


    REMOVING HTML FROM THE PAGE


    JavaScript can be used to remove HTML elements as well. Modify the HTML file with
    a new div element that has an id attribute with some innerHTML.


    <html>


    <head>


    </head>


    <body>


    <div class="cool-message">


    Hello!


    </div>


    <div class="cool-message">


    I am EXTREMELY cool


    </div>


    <div id="occupation">


    That is because I am a programmer


    </div>


    <div id="untrue-message">


    Just kidding, programmers are losers


    </div>


    </body>


    </html>


    ![](Images/image00322.jpeg)'
