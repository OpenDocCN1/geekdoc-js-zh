  trans: "\n\n```javascript\nvar num = 0;\nnum = num++; // increment num\nconsole.log(num);\
    \ // 0\n```\n\n### 2. 两个数字相加没有正常工作。\n\n```javascript\nvar num1 = 10;\nvar num2\
    \ = '2';\nconsole.log(num1 + num2); // ‘102’\n```\n\n### 3. 尝试使用键“pug”来访问你的狗的名字“Max”，输出了\
    \ undefined。\n\n```javascript\nvar dogs = {\n  pug: 'Max',\n  terrier: 'Appa'\n\
    };\nvar myDog = 'pug';\nconsole.log(dogs.myDog); // undefined\n```\n\n### 4. 尝试访问数组的最后一个条输出了\
    \ undefined。\n\n```javascript\nvar meanPeople = ['Layna', 'Layna again', 'Layna\
    \ one more time'];\nconsole.log(meanPeople[3]); // undefined\n```\n\n### 5. 尝试打印此字符串时发生了致命运行时错误。\n\
    \n```javascript\nconsole.log('Layna's favorite hobby is being mean to Andrew');\
    \ // Uncaught SyntaxError: missing ) after argument list\n```\n\n## 开发者检查清单 »\
    \ 让我们复习一下过的过的\n\n让我们花几分钟快速回顾一下本章的内容。理解数组和数据类型尤为重要。\n\n*   数据类型\n*   类型转换\n*  \
    \ 数据结构——数组和对象\n*   在数据结构中访问数据\n\n![](img/image00277.jpeg)\n\n## 第 4 章：条件语句\n\n\
    计算机的运行方式非常有逻辑性。计算机最喜欢的答案之一是“是”和“否”。在计算机术语中，这等同于“true”（真）和“false”（假）。辨别真假的能力是一项强大的力量。这意味着计算机可以根据情况决定应该运行哪些代码。这也意味着一个程序可以做很多事情并做出自己的决定！这些决策是通过条件语句来控制的。\n\
    \n#### 数据检查与验证\n\n在利用条件语句的力量之前，需要涵盖创建正确决策的策略。原始值 `true` 和 `false` 并不常用于条件语句中。相反，它们几乎总是通过其他操作计算得。\n\
    \n### 等于运算符\n\n最常见的比较操作是检查两个值是否相同或不相同。\n\n#### 等于运算符\n\n相等运算符用双等号表示，用于检查两个值是否相同。\n\
    \n```javascript\n10 == 10; // true\n'pizza' == 'pizza'; // true\n'pizza' == 'Pizza';\
    \ // false\nfalse == false; // true\n```\n\n准备好接受一个不妙的惊喜了吗？相等运算符在可能的情况下会类型转换。\n\
    \n```javascript\n'10' == 10; // true\n```\n\n建议不要使用相等运算符。另一个运算符在相同目的上表现更好。\n\n\
    #### 严格相等运算符\n\n严格相等运算符是相等运算符更具逻辑性的兄弟，用三等号表示。它检查相等性且永远不会使用类型转换。\n\n```javascript\n\
    10 === 10; // true\n'pizza' === 'pizza'; // true\n'pizza' === 'Pizza'; // false\n\
    false === false; // true\n// 未执行类型转换\n'10' === 10; // false\n```\n\n#### 不等于运算符\n\
    \n不等运算符用感叹号和等号表示，用于检查两个值是否不相同。\n\n```javascript\n10 != 10; // false\n'pizza' !=\
    \ 'pizza'; // false\n'pizza' != 'Pizza'; // true\nfalse != false; // false\n```\n\
    \n和相等运算符一样，不等运算符也会使用类型转换。\n\n```javascript\n'10' != 10; // false\n```\n\n####\
    \ 严格不等运算符\n\n严格不等运算符是不等运算符的更好版本。与严格相等一样，严格不等不执行任何类型转换。与普通不等运算符相比，它是 JavaScript\
    \ 代码更安全的选择。它的语法用感叹号和双等号表示。请使用此运算符代替普通不等运算符。\n\n```javascript\n10 !== 10; // false\n\
    'pizza' !== 'pizza'; // false\n'pizza' !== 'Pizza'; // true\nfalse !== false;\
    \ // false\n// 未执行类型转换\n'10' !== 10; // true\n```\n\n#### 关系运算符\n\n就像可以检查两个值是否相等或不相等一样，还可以检查值是否大于或小于。\n\
    \n#### 小于运算符\n\n两个可用的比较运算符是小于运算符和小于等于运算符。它们的作用正如其名。数字按数值进行比较，字符串按字母顺序进行比较。注意的是，大小写是敏感的，\n\
    \n```javascript\n10 < 8; // false\n'a' < 'b'; // true\n'A' > 'a'; // false\n10\
    \ <= 8; // false\n```\n\n#### 大于运算符\n\n大于运算符和大于等于运算符与小于运算符具有相同的原理，且大小写仍然敏感。\n\n\
    ```javascript\n10 > 8; // true\n'a' > 'b'; // false\n'a' >= 'b'; // true\n```\n\
    \n### 逻辑运算符\n\n除了相等运算符，JavaScript 还提供了帮助组合条件的运算符。无论你处理的是简单的逻辑，这些工具都是必不可少的。\n\n\
    #### 或运算符\n\n或运算符用竖线 `||` 表示，检查检查任一个操作是否为真。\n\n```javascript\ntrue || false; //\
    \ true\nfalse || false; // false\n```\n\n#### 与运算符\n\n与运算符用双和符号 `&&` 表示，检查两个操作是否为真。\n\
    \n```javascript\ntrue && true; // true\ntrue && false; // false\nfalse && false;\
    \ // false\n```\n\n#### 非运算符\n\n在编程中，还有非运算符，用值前面的感叹号 `!` 表示。它会反转所操作的布尔值。\n\n```javascript\n\
    !true; // false\n!false; // true\n```\n\n### 逻辑运算符与相等运算符\n\n现在你有了相等运算符和逻辑运算符，你会发现条件从简单到复杂。\n\
    \n### 数据验证\n\n检查值是否为 `undefined` 或 `null` 是很容易的。\n\n```javascript\nvar mySocialLife\
    \ = null;\nmySocialLife === null; // true\n```\n\n相等运算符可以处理，因为这些数据类型只有一个值。但数字、字符串、布尔值和数组呢？如果你对数字的值感兴趣呢？由于这些情况都有运算符。\n\
    \n#### 类型运算符\n\n`typeof` 运算符以字符串的形式输出变量类型。这在调试代码时特别有用。错误的数据类型是错误的根源！\n\n```javascript\n\
    typeof 10; // 'number'\ntypeof ''; // 'string'\ntypeof undefined; // 'undefined'\n\
    typeof true; // 'boolean'\n```\n\n很简单。但给你抛出一个难题。\n\n```javascript\ntypeof null;\
    \ // 'object'\n```\n\n哈？为什么 `typeof` 不输出字符串 null？关于这是否是一个 bug 还有争议。但归根结底，它非常不符合直觉。相反，使用相等运算符检查\
    \ null。\n\n```javascript\nnull === null // true\n```\n\n#### 实例运算符\n\n在检查项目是否为数组时，`typeof`\
    \ 运算符非常有误导性。\n\n```javascript\ntypeof []; // 'object'\n```\n\n输出“object”的底层原因在技术上说通，但它没有帮助且不符合直觉。可以使用\
    \ `instanceof` 运算符进行正确的数组验证。\n\n```javascript\n[] instanceof Array; // true\n\
    ```\n\n#### 不要使用 instanceof 检查对象\n\n检查一个值是否为对象极具挑战性。那是因为 `typeof` 和 `instanceof`\
    \ 不起作用。糟糕的是它们看起来起作用，但事实并非如此。\n\n```javascript\nvar anObject = {};\nanObject instanceof\
    \ Object; // true\ntypeof anObject === 'object'; // true\n```\n"
- fmt: "\nThe problem lies in the fact that too many nonobject values will output\
    \ the exact same thing when `typeof` and `instanceof` are called on them.\n\n\
    ```javascript\n[] instanceof Object; // true\ntypeof [] === 'object'; // true\n\
    ```\n\n## Conditional Statements\n\nAfter learning about all of the ways to validate\
    \ data and compare values, you are ready to use them to solve meaningful challenges.\
    \ The most common conditional statements are `if` . . . `else if` . . . `else`\
    \ statements.\n\n### Conditional Branching Statements\n\nThe term “conditional\
    \ branching statements” is a fancy way of describing an `if` . . . `else if` .\
    \ . . `else` statement. It allows a programmer to perform actions based on certain\
    \ conditions.\n\n#### IF STATEMENT\n\nAn if statement runs code if the condition\
    \ evaluates to true. The keyword is `if`, with parentheses around the condition\
    \ and curly brackets wrapping the operations. Any number of operations can be\
    \ placed inside an `if` statement. Notice that there are no semicolons.\n\n```javascript\n\
    if (condition) {\n// do something here\n}\n```\n\nLet’s conditionally modify a\
    \ string, based on its value.\n\n```javascript\nvar dogName = 'Max';\nif (dogName\
    \ === 'Max') {\n  dogName += ' is an awesome dog';\n}\ndogName; // 'Max is an\
    \ awesome dog'\n```\n\nGreat! We love dogs named Max.\n\n#### ELSE STATEMENT\n\
    \nWhat if you want to express your disdain for dogs that are not named Max? That\
    \ is where the `else` statement comes into play. After an `if` statement, an `else`\
    \ statement can be chained to it. If the `if` condition fails, the `else` statement’s\
    \ code will run.\n\n```javascript\nvar dogName = 'Layna';\nif (dogName === 'Max')\
    \ {\n  dogName += ' is an awesome dog';\n} else {\n  dogName += ' is NOT an awesome\
    \ dog';\n}\ndogName; // 'Layna is NOT an awesome dog'\n```\n\nA dog that is named\
    \ Layna? Inconceivable.\n\n#### ELSE IF STATEMENT\n\nWhat if you also decide that\
    \ Charlie is an acceptable name for a dog? An `else if` statement can be added\
    \ to the conditional chain. It follows the same syntax as an `if` statement.\n\
    \n```javascript\nvar dogName = 'Charlie';\nif (dogName === 'Max') {\n  dogName\
    \ += ' is an awesome dog';\n} else if (dogName === 'Charlie') {\n  dogName +=\
    \ ' is an okay dog';\n} else {\n  dogName += ' is NOT an awesome dog';\n}\ndogName;\
    \ // 'Charlie is an okay dog'\n```\n\n### Conditionals in Action\n\nRemember our\
    \ challenge from the previous chapter?\n\n```javascript\nvar prompt = require('readline-sync');\n\
    var breed = prompt.question('what breed is your dog? ');\nvar dogs = {\n  terrier:\
    \ 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? How fascinating!');\n```\n\n![](Images/image00278.jpeg)\n\
    \nWhen the breed does not exist in the object, the output was `undefined`. That’s\
    \ not a good representation of what is happening, because the real issue is that\
    \ the `dogs` object does not account for every breed on the planet. The code should\
    \ communicate this.\n\nUsing conditionals, let’s solve our previous problem! Before\
    \ implementing this, let’s write some pseudo code.\n\n#### CONDITIONALS HAVE MULTIPLE\
    \ APPROACHES\n\nFor algorithms that involve conditionals, there are many ways\
    \ to say the same thing. Here are two different ways to say the same thing:\n\n\
    1. If we find the breed in the object then print: our dog name. Else, print: dog\
    \ not found\n2. If we do not find a breed, then print: dog not found. Else, print:\
    \ our dog name\n\nWhen you think about it, these are two sides of the same coin.\
    \ They say the exact same thing, except in opposite order. Let’s express your\
    \ two possible statements using JavaScript syntax.\n\n```javascript\nif (we find\
    \ a value) {\n  print our dog name\n} else {\n  print dog not found\n}\n\nif (we\
    \ do not find a value) {\n  print dog not found\n} else {\n  print our dog name\n\
    }\n```\n\nTranslating this logic requires you to think like a computer. You need\
    \ the JavaScript equivalent of “find a value.” Accessing a key in an object that\
    \ does not exist, you get `undefined`. If the value is `undefined`, that implies\
    \ that the key does not exist. There are two different ways of writing this.\n\
    \n```javascript\ntypeof value === 'undefined';\nvalue === undefined;\n```\n\n\
    Same difference, right? Let’s use the second one. Finally, your code from chapter\
    \ 3 makes sense!\n\n```javascript\nvar prompt = require('readline-sync');\nvar\
    \ breed = prompt.question('what breed is your dog? ');\nvar dogs = {\n  terrier:\
    \ 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\nif (dogs[breed]\
    \ === undefined) {\n  console.log('A dog was not found :(');\n} else {\n  console.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? How fascinating!');\n}\n```\n\n![](Images/image00279.jpeg)\n\
    \nMuch better. There are no dogs named `undefined`. The output is now properly\
    \ communicating what is happening within the code.\n\n#### HACKER HINT\n\nPick\
    \ the most straightforward way of writing your conditions. Being clever, especially\
    \ as a newcomer to programming, is not going to do you any favors!\n\n### Crack\
    \ the Code\n\nSome very important concepts have been introduced in this chapter.\
    \ Before continuing further, make sure you have full confidence in your answers\
    \ to the following questions. This is important, because moving forward, conditionals\
    \ will be used extensively.\n\n1. What is the difference between equality operators\
    \ and strict equality operators?\n2. What data types can the `typeof` operator\
    \ properly check?\n3. What data type uses the `instanceof` operator for proper\
    \ checking?\n4. What is the output of the following code? `(true && false) ||\
    \ false;`\n5. What is the output of the following code? `!false || (false && true);`\n\
    6. Why is `array[index] !== undefined` an effective way of checking to see if\
    \ that index exists inside an array?\n\n### Debugging\n\nReady for a few challenges?\
    \ Remember to run the code in your terminal to see what is happening!\n\n1. The\
    \ code is saying item is not an array.\n```javascript\nvar item = [];\nif (typeof\
    \ item === 'array') {\n  console.log('I am an array');\n} else {\n  console.log('I\
    \ am not an array');\n}\n```\n// I am not an array\n\n2. Dr. Donkey is a professional\
    \ game critic and has reviewed many games. Here are a few of them, along with\
    \ their scores. The code is saying otherwise.\n```javascript\nvar donkeysGameScores\
    \ = {\n  superItalianBrosTwo: 100,\n  theLastDefender: 40,\n  leagueOfHeroes:\
    \ 30,\n  aldaAndFluteOfTime: 98\n};\nvar game = 'superItalianBrosTwo';\nif (donkeysGameScores[game]\
    \ < 95) {\n  console.log(game + ' is a masterpiece');\n} else {\n  console.log(game\
    \ + ' is not a masterpiece');\n}\n```\n// superItalianBrosTwo is not a masterpiece\n\
    \n3. I consider a game to be a mediocre game if the score is anywhere between\
    \ 30 and 80. The Last Defender was a mediocre game. But it was not a bad one.\
    \ Hint: Writing out complex conditions in plain English helps.\n```javascript\n\
    var game = 'theLastDefender';\nvar score = donkeysGameScores[game];\nif (score\
    \ >= 80) {\n  console.log(game + ' was a fun game');\n} else if (score > 80 &&\
    \ score > 30) {\n  console.log(game + ' was an ok game');\n} else {\n  console.log(game\
    \ + ' was a bad game');\n}\n```\n\n### CODER’S CHECKLIST\n\nLet’s review the topics\
    \ we covered. Pay special attention to equality operators, logical operators,\
    \ and `if` . . . `else if` . . . `else` conditional statements. It will carry\
    \ you through your entire programming experience. Here’s what you learned in this\
    \ chapter.\n\n- Equality and comparison operators\n- Logical operators\n- Data\
    \ validation using `typeof` and `instanceof` operators\n- `if` . . . `else if`\
    \ . . . `else` conditional statements\n\n![](Images/image00280.jpeg)\n\n## CHAPTER\
    \ 5: Loops\n\nLoops are one of the most powerful concepts in the programming world.\
    \ Loops are how you tell a computer to repeat a set of operations as many times\
    \ as needed.\n\n### Why Are Loops Used?\n"
