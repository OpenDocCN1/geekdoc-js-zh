    [Updating Objects in an Array](#part0003.xhtml_sec-76)


    Let’s say you have an object where the keys are player names and their ages. It
    would make sense to merge the data into a single data structure. You can accomplish
    this using the strategies that you’ve learned.


    var players = [


    { name: ''superb'', skill: 3 },


    { name: ''smirk'', skill: 7 },


    { name: ''tired'', skill: 6 },


    { name: ''ANS'', skill: 9 }


    ];


    var playerAges = {


    superb: 21,


    smirk: 21,


    tired: 22,


    ANS: 21


    };


    This is the expected output.


    [


    { name: ''superb'', skill: 3, age: 21 },


    { name: ''smirk'', skill: 7, age: 21 },


    { name: ''tired'', skill: 6, age: 22 },


    { name: ''ANS'', skill: 9, age: 21 }


    ];


    Like the previous question, iteration is clearly needed.


    function playerWithAges(players, ages) {


    var playerData = [];


    for (var i = 0; i < players.length; i++) {


    var player = players[i];


    }


    return playerData;


    }


    But this time, the return value is not an array of strings. It is an array of
    objects. Inside each iteration, create a new object with the data and push it
    into the array.


    Putting it all together, the file and output should look like this.


    var players = [


    { name: ''superb'', skill: 3 },


    { name: ''smirk'', skill: 7 },


    { name: ''tired'', skill: 6 },


    { name: ''ANS'', skill: 9 }


    ];


    var playerAges = {


    superb: 21,


    smirk: 21,


    tired: 22,


    ANS: 21


    };


    function playerWithAges(players, ages) {


    var playerData = [];


    for (var i = 0; i < players.length; i++) {


    var player = players[i];


    var playerEntry = {


    name: player.name,


    skill: player.skill,


    age: ages[player.name]


    };


    playerData.push(playerEntry);


    }


    return playerData;


    }


    console.log(playerWithAges(players, playerAges));


    ![](Images/image00299.jpeg)


    Very nice! If any part of this question left you scratching your head, write a
    table.


