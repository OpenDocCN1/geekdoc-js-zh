    Mac 用户不需要进行任何特殊操作，但 Windows 用户需要进行微调。操作步骤包含在接下来的几页中。


    ### 仅限 Windows 的 VS Code 终端指令


    `VS Code` 使用的默认终端是 Windows 内置命令行。如前所述，该命令行用起来较困难，因此我们将使用 `Git Bash` 作为默认。在通过终端（屏幕顶部）->
    新终端（New Terminal）打开终端后，你将在右侧边栏看到一个终端选择器。点击“选择默认 shell”。


    ![](img/image00262.jpeg)


    顶部会出现一个提示。选择 `Git Bash`。


    ![](img/image00263.jpeg)


    重启 `VS Code`。查看屏幕底部。当 `VS Code` 运行时，你的命令行现在应该默认为 `Git Bash`。


    ![](img/image00264.jpeg)


    ### 准备你的 JavaScript 文件夹


    在你的系统中创建一个专门用于代码的文件夹是合理的。程序员称之为“工作目录”。在任何方便访问的地方创建一个，比如桌面。所有的代码文件将位于该文件夹中。


    要打开文件夹，点击 `VS Code` 中的“文件”然后“打开文件夹”。


    ![](img/image00265.jpeg)


    找到你创建的文件夹并点击“选择文件夹”。


    ![](img/image00266.jpeg)


    打开后，`VS Code` 顶栏应会显示文件夹名称。


    ### 安装 JavaScript 包


    许多算法编写起来很困难，因此全世界的程序员共享代码，这样无需重复编写复杂的算法！它们被上传到一个名为 `npm`（Node 包管理器的简称）的托管服务，任何人都可以免费下载。安装包对于用户来说是一个流畅的过程。在
    JavaScript 中，创建具有交互性的程序异常复杂。在书中许多练习中，我们将使用别人辛苦制作的包，名为 `readline-sync`。通过终端安装它的命令是：


    ```

    npm i readline-sync

    ```


    但等一下——在哪里输入这个？很简单：在屏幕下半部分，“终端”字样下方就是终端。在该区域，你可能会看到一个小白框。这就是你输入终端命令的地方。如果你在底部没有看到类似图片的内容，说明你还没有打开
    `VS Code` 终端。这可以通过菜单栏上的终端 -> 新终端完成。


    ![](img/image00267.jpeg)


