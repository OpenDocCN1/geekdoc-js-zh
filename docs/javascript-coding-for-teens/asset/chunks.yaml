  trans: '


    # 变量命名规范


    程序员喜欢保持变量结构的一致性。这通常被称为规范。JavaScript 的变量命名规范是使用 `camelCase`（驼峰命名法）：第一个单词小写，其后的所有单词首字母大写——还记得中间那个“驼峰”的写法吗？


    ```javascript

    // 接受的 camelCase 规范

    var currentYear = 2021;


    // 在运行时不会报错，但如果你不这样做会更好

    var current_year = 2021;


    // 我们再也不是朋友了

    var xXx_CuRrEnTyEaR_xXx = 2021;

    ```


    之后，我们将针对特定主题使用不同的规范。现在，请始终使用 `camelCase`。


    ## 数据类型


    现在你已经知道了变量是如何工作的，是时候学习可以赋值给它们的数据类型了。


    ### NUMBER 数字


    数字遵循基本的算术规则。运算顺序是：括号、指数、乘法、除法、加法，然后是减法。


    ```javascript

    10 + 20; // 30

    20 * 10; // 200

    (20 + 3) * 10; // 230 - 遵循运算顺序

    ```


    ### INCREMENT OPERATOR 自增运算符


    在编程中，将变量的值加 1 或减 1 是常见操作，因此有一个简写形式。使用 `++` 和 `--` 运算符分别进行自增和自减。


    ```javascript

    var num = 1;

    num++; // num 现在是 2

    num--; // num 现在回到了 1

    ```


    #### 永远不要对自增语句赋值


    在自增时要小心赋值，因为这样做变量的值不会改变。会发生意外的行为。


    ```javascript

    var num = 1;

    num++; // 好！

    num = num++; // 不！糟糕！

    ```


    ### SELF-OPERATING MATH 简写赋值


    对变量进行数学运算并重新赋值之前的值是另一个常见操作。程序员对此有一个简写形式。这些运算符的统术语是算术赋值。它是一个算术运算符和赋值运算符结合成的单一运算符。


    ```javascript

    var num = 1;

    num += 2; // 等于 num = num + 2

    num; // 3


    var num = 1;

    num *= 3; // 乘法和除法原理相同

    num; // 3

    ```


    ### NAN: NOT A NUMBER 不是数字


    数字看起来很简单，对吧？嗯，是时候聊聊数字的阴暗面了。


    有一种特殊的数字类型它并不是数字。是的，你读得正确。它是一个代表不是数字内容的数字。它的名字是 `NaN`，代表“Not a Number”（不是数字）。


    `NaN` 是数值类型的关键字。可以对其进行数学运算。任何对 `NaN` 尝试的数学计算结果都是 `NaN`。


    ```javascript

    NaN * 10; // NaN

    ```


    如何得到 `NaN` 呢？为了这一点，你必须做一些在数学上不逻辑的操作。


    ```javascript

    10 / ''dog''; // NaN

    ```


    “10 除以狗”是什么？JavaScript 将这种无意义的内容视为 `NaN`。


    ## Strings 字符串


    字符的集合被称为字符串。把它想象成一“字符串链”。创建字符串非常简单。你只需要将文本包裹在引号中。双引号和单引号都可以用于创建字符串。


    ```javascript

    // 都是有效的字符串

    "dog";

    ''dog'';

    ```


    ### STRING CONCATENATION 字符串拼接


    JavaScript 在修改字符串方面有很多巧妙的技巧。但目前，你只需要知道字符串可以使用加法运算符进行组合。组合字符串的概念被称为“字符串拼接”（concatenation），简称为
    `concat`。任何数量的字符串都可以使用 `+` 运算符组合。


    ```javascript

    ''one '' + ''two''; // ''one two''

    ''one '' + ''two'' + ''three'' + ''four''; // ''one two three four''

    ```


    注意除了最后一个外，所有字符串末尾的空格了吗？因为空格也是字符。在执行拼接时，需要它们来分隔单词。


    ### SELF-OPERATING STRING CONCATENATION 字符串拼接简写


    与通常计算数学并重新赋值给同一个变量一样，字符串也会进行拼接并重新赋值。技术上，字符串也称为加赋值。加赋值运算符可以用于两者。


    ```javascript

    var numWords = ''one two''; // ''one two''

    numWords += ''three four'';

    numWords; // ''one two three four''

    ```


    ### ESCAPE CHARACTERS 转义字符


    将文本包裹在引号中表示字符串。但如果你想在字符串内部包含一个引号呢？


    ```javascript

    ''hello, my dog''s name is Suzy''; // 运行时错误

    ```


    JavaScript 将此读取为在 dog 处结束的字符串。“dog’s”中的单引号偏离了它。随后的文本被解释为无意义的代码并在运行时崩溃。为了表达“dog’s”中的单引号应该是字符串的一部分，我们需要转义它。这是通过使用反斜杠运算符实现的


    ```javascript

    ''hello, my dog\''s name is Suzy''; // 好得多

    ```


    ### NUMBERS AND STRINGS: 数字 数字与字符串的区别


    字符串被视为文本。从这个意义上说，我们可以有一个看起来像数字但实际上不是的字符串。数字十 (`10`）和由“1”和“0”组成的字符串（`“10”）的解释方式不同。数字可以进行数学运算。对字符串进行数学运算是不符合逻辑的。


    ---


    ## Boolean 布尔值


    字符串被视为文本。从这个意义上说，我们可以有一个看起来像数字但实际上不是的字符串。数字十 (`10`）和由“1”和“0”组成的字符串（`“10”）的解释方式不同。数字可以进行数学运算。对字符串进行数学运算是不符合逻辑的。


    简单来说，布尔值是 `true` 或 `false` 的数据类型。


    ```javascript

    true;

    false;

    ```


    ## Null 空


    字符串被视为文本。从这个意义上说，我们可以有一个看起来像数字但实际上不是的字符串。数字十 (`10`）和由“1”和“0”组成的字符串（`“10”）的解释方式不同。数字可以进行数学运算。对字符串进行数学运算是不符合逻辑的。


    ```javascript

    10; // 数字十

    ''10''; // 两个字符

    ```


    ## Undefined 未定义


    字符串被视为文本。从这个意义上说，我们可以有一个看起来像数字但实际上不是的字符串。数字十 (`10`）和由“1”和“0”组成的字符串（`“10”）的解释方式不同。数字可以进行数学运算。对字符串进行数学运算是不符合逻辑的。


    ```javascript

    10; // 数字十

    ''10''; // 两个字符

    ```


    ## Type Coercion 类型转换


    字符串被视为文本。从这个意义上说，我们可以有一个看起来像数字但实际上不是的字符串。数字十 (`10`）和由“1”和“0”组成的字符串（`“10”）的解释方式不同。数字可以进行数学运算。对字符串进行数学运算是不符合逻辑的。


    ```javascript

    10; // 数字十

    ''10''; // 两个字符

    ```


    ### CONFUSING TYPE COERCION 令人困惑的转换


    有些人可能认为这是一种强烈的观点，但我认为类型转换体现了“你可以这样做并不意味着你应该这样做”这句话。


    直率地说，类型转换背后的许多规则绝对荒谬。让我们来看一个我意思的例子。下面是一个非完整的列表，如果你尝试编写大量依赖类型转换的代码，这些例子会让你的大脑爆炸。


    ```javascript

    // 数字 30 减去字符串 ''20'' 等于数字 10

    30 - ''20''; // 10


    // 如果是加法，字符串拼接的优先级高于加法

    30 + ''20''; // ''3020''


    // null 转换为 0

    10 + null; // 1


    极少数例外之一是使用空字符串上的连接运算符将数字转换为字符串。


    ```javascript

    // 使用类型转换将数字 -> 字符串

    '''' + 10; // ''10''

    ```


    ## Data Structures 数据结构


    在现实场景中，程序员处理大量数据。许多现代程序处理成千上万甚至数百万的数据。


    正因为如此，程序员创建数据管理策略是完全合理的。与其一个一个将单个数据赋值给变量，为什么不创建一个包含许多数据数据的集合呢？这就是数据结构。


