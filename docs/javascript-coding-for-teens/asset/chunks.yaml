  trans: "\n问题在于，当对许多非对象值调用 `typeof` 和 `instanceof` 时，它们会输出完全相同的结果。\n\n```javascript\n\
    [] instanceof Object; // true\ntypeof [] === 'object'; // true\n```\n\n## 条件语句\n\
    \n在学习了所有验证数据和比较值的方法后，你已经准备好使用它们来解决一些有意义的挑战了。最常见的条件语句是 `if` . . . `else if` . .\
    \ . `else` 语句。\n\n### 条件分支语句\n\n“条件分支语句”这个术语是对 `if` . . . `else if` . . . `else`\
    \ 语句的一种通俗说法。它允许程序员根据某些条件执行操作。\n\n#### IF 语句\n\n如果条件求值为真（true），`if` 语句将运行代码。关键字是\
    \ `if`，条件两边有括号，操作用大括号包裹。在 `if` 语句中可以放置任意数量的操作。注意，这里没有分号。\n\n```javascript\nif\
    \ (condition) {\n// 在此处执行某些操作\n}\n```\n\n让我们根据字符串的值有条件地修改字符串。\n\n```javascript\n\
    var dogName = 'Max';\nif (dogName === 'Max') {\n  dogName += ' is an awesome dog';\n\
    }\ndogName; // 'Max is an awesome dog'\n```\n\n太棒了！我们喜欢叫 Max 的狗。\n\n#### ELSE\
    \ 语句\n\n如果你想对不叫 Max 的狗表示鄙视怎么办？这就是 `else` 语句派上用场的地方。在 `if` 语句之后可以链接一个 `else` 语句。如果\
    \ `if` 条件失败，则运行 `else` 语句的代码。\n\n```javascript\nvar dogName = 'Layna';\nif (dogName\
    \ === 'Max') {\n  dogName += ' is an awesome dog';\n} else {\n  dogName += ' is\
    \ NOT an awesome dog';\n}\ndogName; // 'Layna is NOT an awesome dog'\n```\n\n\
    一只叫 Layna 的狗？不可思议。\n\n#### ELSE IF 语句\n\n如果你也觉得 Charlie 是一个可以接受狗的名字呢？可以在条件链中添加一个\
    \ `else if` 语句。它的语法与 `if` 语句相同。\n\n```javascript\nvar dogName = 'Charlie';\nif\
    \ (dogName === 'Max') {\n  dogName += ' is an awesome dog';\n} else if (dogName\
    \ === 'Charlie') {\n  dogName += ' is an okay dog';\n} else {\n  dogName += '\
    \ is NOT an awesome dog';\n}\ndogName; // 'Charlie is an okay dog'\n```\n\n###\
    \ 实战中的条件语句还记得我们上一章节的挑战吗？\n\n```javascript\nvar prompt = require('readline-sync');\n\
    var breed = prompt.question('what breed is your dog? ');\nvar dogs = {\n  terrier:\
    \ 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? How fascinating!');\n```\n\n![](img/image00278.jpeg)\n\
    \n当对象中不存在该品种时，输出是 `undefined`。这不能很好地代表发生的情况，因为真正的问题是 `dogs` 对象没有考虑到地球上的每种品种。代码应该表达这一点。\n\
    \n使用条件语句，让我们解决之前的问题吧！在实现之前，让我们先写一些伪代码。\n\n#### 条件语句有多种实现方法\n\n对于涉及条件的算法，有很多方法可以表达相同的意思。这里是两种表达相同意思的不同方式：\n\
    \n1. 如果我们在对象中找到了该品种，则打印：我们的狗的名字。否则，打印：未找到狗。\n2. 如果我们没有找到品种，则打印：未找到狗。否则，打印：我们的狗的名字。\n\
    \n仔细想想，它们是硬币的两面。它们的意思完全相同，只是顺序相反。让我们用 JavaScript 语法来表达你两种可能的语句。\n\n```javascript\n\
    if (we find a value) {\n  print our dog name\n} else {\n  print dog not found\n\
    }\n\nif (we do not find a value) {\n  print dog not found\n} else {\n  print our\
    \ dog name\n}\n```\n\n翻译这种逻辑需要你像计算机一样思考。你需要“找到一个值”的 JavaScript 等价写法。访问对象中不存在的键，你会得到\
    \ `undefined`。如果值是 `undefined`，则意味着该键不存在。这有两种不同的写法。\n\n```javascript\ntypeof value\
    \ === 'undefined';\nvalue === undefined;\n```\n\n没区别，吧？让我们使用第二种。最后，你在第 3 章的代码就说通了！\n\
    \n```javascript\nvar prompt = require('readline-sync');\nvar breed = prompt.question('what\
    \ breed is your dog? ');\nvar dogs = {\n  terrier: 'Suzy',\n  husky: 'Sir Sniffybums\
    \ III',\n  pug: 'Notorious P.U.G.'\n};\nif (dogs[breed] === undefined) {\n  console.log('A\
    \ dog was not found :(');\n} else {\n  console.log('Your dog\\'s name is ' + dogs[breed]\
    \ + '? How fascinating!');\n}\n```\n\n![](img/image00279.jpeg)\n\n好多了。没有名字叫 `undefined`\
    \ 的狗。输出现在正确地传达了代码内部发生的情况。\n\n#### 黑客提示\n\n选择一种最直接的方式来编写你的代码。\n\n"
- fmt: "\nLoops are used when the number of times an operation should be performed\
    \ is unknown, but you know when you should stop.\n\nHumans think in loops as well—you\
    \ just don’t realize it! Stop to think for a minute about how you would count\
    \ money. Imagine opening up your wallet or purse. Now, imagine there is physical\
    \ money in there. How would you count the total dollar amount?\n\nWorking with\
    \ computers is all about understanding the rules behind an operation. For convenience,\
    \ let’s write out the rules involved in counting money:\n\n1. Collect your stack\
    \ of bills.\n2. Inspect each bill, one by one.\n3. Mentally track the total as\
    \ you continue to count. Add the value, bill by bill.\n4. Stop counting after\
    \ all bills have been inspected.\n\nThe last rule is the most important one to\
    \ understand. Over the course of your life, how many bills have been in your wallet?\
    \ Yesterday, you had five bills. So why isn’t the rule “Stop after counting five\
    \ bills”? Because the number of bills is not guaranteed to be any specific amount.\
    \ So you can’t use a specific number as a rule. In order to be flexible and have\
    \ the rule accommodate for any number of bills, you can only say when you should\
    \ stop counting.\n\nOnce you learn about while and for loops, you can write code\
    \ using this style of logic that a computer can understand.\n\n## While Loops\n\
    \nA while loop is one type of loop that exists in JavaScript.\n\n```javascript\n\
    while (condition) {\n\n}\n```\n\nA while loop will keep repeating until the condition\
    \ evaluates to false.\n\n### STOPPING A LOOP\n\nThe condition in a loop is also\
    \ referred to as the terminating condition of the loop. A loop is stopped by intentionally\
    \ leading it to a false value. Once the value is false, the loop will end and\
    \ the rest of the code beneath the loop will continue operating.\n\n### Loop Logic\n\
    \nThe rules of counting money can help you with the logic. But now you need to\
    \ figure out the operations that a computer can actually perform.\n\nFirst, get\
    \ a wallet full of bills. But the concept of a wallet does not exist in JavaScript.\
    \ Instead, you would have an array of bills.\n\nAfter checking your wallet, you\
    \ see two $1 bills, one $5 bill, one $10 bill, and one $20 bill. So, your array\
    \ of bills would look like this.\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\
    ```\n\nThis is where it gets a little tricky. As programmers, we need to use a\
    \ computer’s rules. This requires a little creativity. This is how you can modify\
    \ them:\n\n1. Create an array of bills.\n2. Access the value of each item in the\
    \ array, by its index.\n3. Create a variable that will accumulate its value from\
    \ each item in the array.\n4. Create a variable whose purpose is to get each item\
    \ in the array by its index. Increment after each bill.\n5. While the index variable\
    \ is still within the bounds of the array, keep repeating.\n\n### Iteration\n\n\
    Before counting, write a loop that prints out each bill. Also validate the index.\n\
    \n#### Prep Work\n\nPrepare the array of bills and declaration of the index, which\
    \ starts at 0.\n\n```javascript\n// array of bills\nvar bills = [1, 1, 5, 10,\
    \ 20];\n\n// index to access array values\nvar index = 0;\n```\n\n### Terminating\
    \ Condition: The Length Property\n\nRemember the earlier discussion about the\
    \ length property on arrays? It is the key to all the magic. The number output\
    \ of `length` will change based on the size of the array. This will tell you how\
    \ large the array is without you doing any extra work!\n\n```javascript\nbills.length;\
    \ // 5\n```\n\nAs the loop operates, the index and length of the array is compared.\
    \ While the index value is less than the length of the array, it is implied that\
    \ the loop is still within the bounds of the array.\n\n```javascript\n// our terminating\
    \ condition\nindex < bills.length;\n```\n\nWhile `index < bills.length` continues\
    \ to be true, the loop should continue.\n\n```javascript\n// array of bills\n\
    var bills = [1, 1, 5, 10, 20];\n\n// index to access array values\nvar index =\
    \ 0;\n\n// terminating condition\nwhile (index < bills.length) {\n  // increment\
    \ index to eventually meet our terminating condition\n  index++;\n}\n```\n\nYou\
    \ now have a code loop that will terminate. But nothing interesting is happening\
    \ inside. Before solving your original problem, confirm things are working with\
    \ a `console.log` statement.\n\n```javascript\n// array of bills\nvar bills =\
    \ [1, 1, 5, 10, 20];\n\n// index to access array values\nvar index = 0;\n\n//\
    \ terminating condition\nwhile (index < bills.length) {\n  var currentBill = bills[index];\n\
    \  var indexPrint = 'I am on index' + index;\n  console.log(indexPrint);\n  var\
    \ printedBill = 'I am currently on a $' + currentBill + 'bill!';\n  console.log(printedBill);\n\
    \  // increment index to eventually meet our terminating condition\n  index++;\n\
    }\n```\n\nPlace this code in a file and run it.\n\n![](Images/image00281.jpeg)\n\
    \nExcellent! The loop is working as expected.\n\n### UNDERSTANDING EACH ITERATION\n\
    \nA common way to refer to looping is the word iterate. One of the best ways to\
    \ understand loops is to figure out what the values of the variables are upon\
    \ each iteration. As your programming ability matures, it becomes easy to do the\
    \ mental gymnastics in your head. But it’s always nice to have a visual representation.\
    \ If you ever find yourself unsure about what is happening in the loop, write\
    \ a table to keep track of all of the values as your loop continues to run.\n\n\
    ```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\nwhile (index\
    \ < bills.length) {\n  console.log(bills[index]);\n  index++;\n}\n```\n\n| ITERATION\
    \ | INDEX | CONDITION | BILLS[INDEX] | BILLS |\n| :--- | :--- | :--- | :--- |\
    \ :--- |\n| 1 | 0 | 0 < 5 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | [1,\
    \ 1, 5, 10, 20] |\n| 3 | 2 | 2 < 5 | 5 | [1, 1, 5, 10, 20] |\n| 4 | 3 | 3 < 5\
    \ | 10 | [1, 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 20 | [1, 1, 5, 10, 20] |\n\nBefore\
    \ attempting iteration 6, the code checks `5 < 5`, which is false.\n\n## For Loops\n\
    \nA while loop is a great entry point into loops, but the for loop is more commonly\
    \ used. It covers the most common situations with concise syntax.\n\n### STRUCTURE\n\
    \nThe syntax is as follows. Note the semicolons.\n\n```javascript\nfor (initialization;\
    \ condition; after) {\n\n}\n```\n\n1. `initialization`: The operation performed\
    \ before any iteration. This is performed once.\n2. `condition`: The terminating\
    \ condition that is checked right before next iteration.\n3. `after`: The operation\
    \ performed after iteration. This is performed after iteration.\n\n### WHILE LOOP\
    \ VS. FOR LOOP SYNTAX\n\nLet’s revisit the strategy to iterate over an array in\
    \ a while loop, in pseudo code.\n\n```javascript\ninitialize index\nwhile (index\
    \ is less than array.length) {\n  increment index\n}\n```\n\n1. Initialize variable\
    \ to track index\n2. Terminating condition\n3. Increment index\n\nA for loop takes\
    \ these operations and squashes them onto a single line. Each operation is separated\
    \ by a semicolon.\n\n```javascript\nfor (index; condition; after) {\n```\n\nThe\
    \ previous while loop example can be written as a for loop.\n\n```javascript\n\
    var bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\nwhile (index < bills.length)\
    \ {\n  console.log(bills[index]);\n  index++;\n}\n```\n\nIt’s all the same, just\
    \ shorter.\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var index\
    \ = 0; index < bills.length; index++) {\n  console.log(bills[index]);\n}\n```\n\
    \n## Loop Modifying Keywords\n\nThere are algorithms where it makes sense to either\
    \ skip subsequent operations in an iteration and move to the next iteration or\
    \ outright leave the loop.\n\n### CONTINUE\n\nOnce a `continue` statement is found,\
    \ the current iteration stops and progresses to the next. Let’s change our prompt\
    \ so we can use a `continue` in the solution.\n\nOnly print bills that are $5\
    \ or greater. How would that be expressed in code?\n\n```javascript\nvar bills\
    \ = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index < bills.length; index++) {\n\
    \  if (bills[index] >= 5) {\n    console.log(bills[index]);\n  }\n}\n```\n\nSimple\
    \ stuff. But you can use a `continue` statement to solve the same challenge. This\
    \ is what the pseudo code would look like.\n\n```javascript\nfor (loop over each\
    \ bill) {\n  if the bill is less than 5 dollars, skip everything beneath this\
    \ statement\n  print the bill\n}\n```\n"
  raw: 'Loops are used when the number of times an operation should be performed is
    unknown, but you know when you should stop.


    Humans think in loops as well—you just don’t realize it! Stop to think for a minute
    about how you would count money. Imagine opening up your wallet or purse. Now,
    imagine there is physical money in there. How would you count the total dollar
    amount?


    Working with computers is all about understanding the rules behind an operation.
    For convenience, let’s write out the rules involved in counting money:


    1.Collect your stack of bills.


    2.Inspect each bill, one by one.


    3.Mentally track the total as you continue to count. Add the value, bill by bill.


    4.Stop counting after all bills have been inspected.


    The last rule is the most important one to understand. Over the course of your
    life, how many bills have been in your wallet? Yesterday, you had five bills.
    So why isn’t the rule “Stop after counting five bills”? Because the number of
    bills is not guaranteed to be any specific amount. So you can’t use a specific
    number as a rule. In order to be flexible and have the rule accommodate for any
    number of bills, you can only say when you should stop counting.


    Once you learn about while and for loops, you can write code using this style
    of logic that a computer can understand.


    [While Loops](#part0003.xhtml_sec-50)


    A while loop is one type of loop that exists in JavaScript.


    while (condition) {


    }


    A while loop will keep repeating until the condition evaluates to false.


    STOPPING A LOOP


    The condition in a loop is also referred to as the terminating condition of the
    loop. A loop is stopped by intentionally leading it to a false value. Once the
    value is false, the loop will end and the rest of the code beneath the loop will
    continue operating.


    Loop Logic


    The rules of counting money can help you with the logic. But now you need to figure
    out the operations that a computer can actually perform.


    First, get a wallet full of bills. But the concept of a wallet does not exist
    in JavaScript. Instead, you would have an array of bills.


    After checking your wallet, you see two $1 bills, one $5 bill, one $10 bill, and
    one $20 bill. So, your array of bills would look like this.


    var bills = [1, 1, 5, 10, 20];


    This is where it gets a little tricky. As programmers, we need to use a computer’s
    rules. This requires a little creativity. This is how you can modify them:


    1.Create an array of bills.


    2.Access the value of each item in the array, by its index.


    3.Create a variable that will accumulate its value from each item in the array.


    4.Create a variable whose purpose is to get each item in the array by its index.
    Increment after each bill.


    5.While the index variable is still within the bounds of the array, keep repeating.


    Iteration


    Before counting, write a loop that prints out each bill. Also validate the index.


    Prep Work


    Prepare the array of bills and declaration of the index, which starts at 0.


    // array of bills


    var bills = [1, 1, 5, 10, 20];


    // index to access array values


    var index = 0;


    Terminating Condition: The Length Property


    Remember the earlier discussion about the length property on arrays? It is the
    key to all the magic. The number output of length will change based on the size
    of the array. This will tell you how large the array is without you doing any
    extra work!


    bills.length; // 5


    As the loop operates, the index and length of the array is compared. While the
    index value is less than the length of the array, it is implied that the loop
    is still within the bounds of the array.


    // our terminating condition


    index < bills.length;


    While index < bills.length continues to be true, the loop should continue.


    // array of bills


    var bills = [1, 1, 5, 10, 20];


    // index to access array values


    var index = 0;


    // terminating condition


    while (index < bills.length) {


    // increment index to eventually meet our terminating condition


    index++;


    }


    You now have a code loop that will terminate. But nothing interesting is happening
    inside. Before solving your original problem, confirm things are working with
    a console.log statement.


    // array of bills


    var bills = [1, 1, 5, 10, 20];


    // index to access array values


    var index = 0;


    // terminating condition


    while (index < bills.length) {


    var currentBill = bills[index];


    var indexPrint = ''I am on index'' + index;


    console.log(indexPrint);


    var printedBill = ''I am currently on a $'' + currentBill + ''bill!'';


    console.log(printedBill);


    // increment index to eventually meet our terminating condition


    index++;


    }


    Place this code in a file and run it.


    ![](Images/image00281.jpeg)


    Excellent! The loop is working as expected.


    UNDERSTANDING EACH ITERATION


    A common way to refer to looping is the word iterate. One of the best ways to
    understand loops is to figure out what the values of the variables are upon each
    iteration. As your programming ability matures, it becomes easy to do the mental
    gymnastics in your head. But it’s always nice to have a visual representation.
    If you ever find yourself unsure about what is happening in the loop, write a
    table to keep track of all of the values as your loop continues to run.


    var bills = [1, 1, 5, 10, 20];


    var index = 0;


    while (index < bills.length) {


    console.log(bills[index]);


    index++;


    }


    | ITERATION | INDEX | CONDITION | BILLS[INDEX] | BILLS |


    | 1 | 0 | 0 < 5 | 1 | [1, 1, 5, 10, 20] |


    | 2 | 1 | 1 < 5 | 1 | [1, 1, 5, 10, 20] |


    | 3 | 2 | 2 < 5 | 5 | [1, 1, 5, 10, 20] |


    | 4 | 3 | 3 < 5 | 10 | [1, 1, 5, 10, 20] |


    | 5 | 4 | 4 < 5 | 20 | [1, 1, 5, 10, 20] |


    Before attempting iteration 6, the code checks 5 < 5, which is false. It stops
    and any code beneath the loop is finally run.


    [For Loops](#part0003.xhtml_sec-51)


    A while loop is a great entry point into loops, but the for loop is more commonly
    used. It covers the most common situations with concise syntax.


    STRUCTURE


    The syntax is as follows. Note the semicolons.


    for (initialization; condition; after) {


    }


    1.Initialization: The operation performed before any iteration. This is only performed
    once.


    2.Condition: The terminating condition that is checked right before the next iteration.


    3.After: The operation performed after an iteration. This is performed after event
    iteration.


    WHILE LOOP VS. FOR LOOP SYNTAX


    Let’s revisit the strategy to iterate over an array in a while loop, in pseudo
    code.


    initialize index


    while (index is less than array.length) {


    increment index


    }


    1.Initialize variable to track index


    2.Terminating condition


    3.Increment index variable


    A for loop takes these operations and squashes them onto a single line. Each operation
    is separated by a semicolon.


    for (initialize index; index is less than array.length; increment index) {


    }


    The previous while loop example can be written as a for loop.


    var bills = [1, 1, 5, 10, 20];


    var index = 0;


    while (index < bills.length) {


    console.log(bills[index]);


    index++;


    }


    It’s all the same, just shorter.


    var bills = [1, 1, 5, 10, 20];


    for (var index = 0; index < bills.length; index++) {


    console.log(bills[index]);


    }


    [Loop Modifying Keywords](#part0003.xhtml_sec-52)


    There are algorithms where it makes sense to either skip subsequent operations
    in an iteration and move to the next iteration or outright leave the loop.


    CONTINUE


    Once a continue statement is found, the current iteration stops and progresses
    to the next. Let’s change our prompt so we can use a continue in the solution.


    Only print bills that are $5 or greater. How would that be expressed in code?


    var bills = [1, 1, 5, 10, 20];


    for (var index = 0; index < bills.length; index++) {


    if (bills[index] >= 5) {


    console.log(bills[index]);


    }


    }


    Simple stuff. But you can use a continue statement to solve the same challenge.
    This is what the pseudo code would look like.


    for (loop over each bill) {


    if the bill is less than 5 dollars, skip everything beneath this statement


    print the bill


    }'
