    value === undefined;


    Same difference, right? Let’s use the second one. Finally, your code from [chapter
    3](#part0010.xhtml_sec_19) makes sense!


    var prompt = require(''readline-sync'');


    var breed = prompt.question(''what breed is your dog? '');


    var dogs = {


    terrier: ''Suzy'',


    husky: ''Sir Sniffybums III'',


    pug: ''Notorious P.U.G.''


    };


    if (dogs[breed] === undefined) {


    console.log(''A dog was not found :('');


    } else {


    console.log(''Your dog\''s name is '' + dogs[breed] + ''? How fascinating!'');


    }


    ![](Images/image00279.jpeg)


    Much better. There are no dogs named undefined. The output is now properly communicating
    what is happening within the code.


    HACKER HINT


    Pick the most straightforward way of writing your conditions. Being clever, especially
    as a newcomer to programming, is not going to do you any favors!


    [Crack the Code](#part0003.xhtml_sec-45)


    Some very important concepts have been introduced in this chapter. Before continuing
    further, make sure you have full confidence in your answers to the following questions.
    This is important, because moving forward, conditionals will be used extensively.


    [1.](#part0027.xhtml_ch04_Q1)What is the difference between equality operators
    and strict equality operators?


    [2.](#part0027.xhtml_ch04_Q2)What data types can the typeof operator properly
    check?


    [3.](#part0027.xhtml_ch04_Q3)What data type uses the instanceof operator for proper
    checking?


    [4.](#part0027.xhtml_ch04_Q4)What is the output of the following code?


    (true && false) || false;


    [5.](#part0027.xhtml_ch04_Q5)What is the output of the following code?


    !false || (false && true);


    [6.](#part0027.xhtml_ch04_Q6)Why is array[index] !== undefined an effective way
    of checking to see if that index exists inside an array?


    [Debugging](#part0003.xhtml_sec-46)


    Ready for a few challenges? Remember to run the code in your terminal to actively
    see what is happening!


    [1.](#part0027.xhtml_ch04_D1)The code is saying that item is not an array.


    var item = [];


    if (typeof item === ''array'') {


    console.log(''I am an array'');


    } else {


    console.log(''I am not an array'');


    }


    // I am not an array


    [2.](#part0027.xhtml_ch04_D2)Dr. Donkey is a professional game critic and has
    reviewed many games. Here are a few of them, along with their respective scores.


    var donkeysGameScores = {


    superItalianBrosTwo: 100,


    theLastDefender: 40,


    leagueOfHeroes: 30,


    aldaAndTheFluteOfTime: 98


    };


    Super Italian Bros Two has won Dr. Donkey’s “Game of the Year” award more than
    10 times in a row. It definitely is a masterpiece. But the code is saying otherwise.


    var game = ''superItalianBrosTwo'';


    if (donkeysGameScores[game] < 95) {


    console.log(game + '' is a masterpiece'');


    } else {


    console.log(game + '' is not a masterpiece'');


    }


    // superItalianBrosTwo is not a masterpiece


    [3.](#part0027.xhtml_ch04_D3)I consider a game to be a mediocre game if the score
    is anywhere between 30 and 80\. The Last Defender was a mediocre game. But it
    was not a bad one. Hint: Writing out complex conditions in plain English helps.


    var game = ''theLastDefender'';


    var score = donkeysGameScores[game];


    if (score >= 80) {


    console.log(game + '' was a fun game'');


    } else if (score > 80 && score > 30) {


    console.log(game + '' was an ok game'');


    } else {


    console.log(game + '' was a bad game'');


    }


    [CODER’S CHECKLIST » Let’s review the topics we covered](#part0003.xhtml_sec-47)


    Pay special attention to equality operators, logical operators, and if … else
    if … else conditional statements. It will carry you through your entire programming
    experience. Hereʼs what you learned in this chapter.


    ❏Equality and comparison operators


    ❏Logical operators


    ❏Data validation using typeof and instanceof operators


    ❏if … else if … else conditional statements


    ![](Images/image00280.jpeg)


    [CHAPTER 5](#part0003.xhtml_sec-48)


    Loops


    Loops are one of the most powerful concepts in the programming world. Loops are
    how you tell a computer to repeat a set of operations as many times as needed.


    [Why Are Loops Used?](#part0003.xhtml_sec-49)'
