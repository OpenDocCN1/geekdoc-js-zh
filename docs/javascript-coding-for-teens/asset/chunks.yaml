    \ listener should halt subsequent operations.\n\n```javascript\nHangman.prototype.isInvalidGuess\
    \ = function (guessedKey) {\n  var isAlphabetic = includes(guessedKey, 'abcdefghijklmnopqrstuvwxyz');\n\
    \  return !isAlphabetic;\n};\n```\n\n#### Check If the Key Was Already Guessed\n\
    \nThe player should not be penalized for making duplicate guesses. This check\
    \ can be done using `this.charactersGuessed` to see if it is in the string of\
