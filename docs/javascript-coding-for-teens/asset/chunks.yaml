  trans: "\n\n在 JavaScript 中，访问狗的年龄看起来如下所示。\n\n```javascript\nsparky.age; // 10\n\
    ```\n\n### 对象方法 (OBJECT METHOD)\n\n如果 Sparky 想汪叫，就会调用一个名为 `bark` 的方法。\n\n```javascript\n\
    sparky.bark(); // 'ruff ruff!'\n```\n\n注意 `bark` 看起来有多像函数调用吗？那是因为方法实际上就是函数！方法是特定于对象实例的函数。它们不能用于其他任何。\n\
    \n### JavaScript 对象实现 (JavaScript Object Implementation)\n\n为了利用对象的力量，我们必须学习完整的\
    \ JavaScript 语法来编写它们。\n\n### 构造函数 (CONSTRUCTOR FUNCTION)\n\n在 JavaScript 中，函数具有双重用途。它们既可以当作普通函数来执行代码（你已经学过了），也可以当作构造函数。构造函数是一个被用来创建对象实例的函数。\n\
    \n在这里，每个单词首字母大写的驼峰命名法是公认的约定。\n\n```javascript\nfunction Dog() {\n\n}\n```\n\n\
    对于对象实例，在函数调用前面需要 `new` 关键字。\n\n```javascript\nvar sparky = new Dog();\n```\n\n\
    ### 对象属性 (OBJECT PROPERTY)\n\n添加对象属性本质上与添加键值对相同。只不过是在构造函数中完成的。\n\n```javascript\n\
    function Dog() {\n  this.age = 10;\n}\n\nvar sparky = new Dog();\n\nsparky.age;\
    \ // 10\n```\n\n等等！这个变量 `this` 是什么？嗯，它是一个由函数自动创建的秘密变量。在面向对象编程中，它有一些重要的属性。最重要的是，`this`\
    \ 可以被分配键值对。\n\n### 对象方法 (OBJECT METHODS)\n\n在 JavaScript 中，函数还有一个名为 `prototype`\
    \ 的秘密属性。它的职责是存储该函数供对象实例可用的方法。要创建方法，需要函数表达式语法。\n\n```javascript\nfunction Dog()\
    \ {\n\n}\n\nDog.prototype.bark = function() {\n  console.log('ruff ruff!');\n\
    };\n```\n\nvar sparky = new Dog();\n\nsparky.bark(); // 'ruff ruff!'\n```\n\n\
    ### 实例变量 (INSTANCE VARIABLE)\n\n现在你已经了解了基础语法，我们应该谈谈秘密变量 `this`。它在构造函数中是可用的。可以向\
    \ `this` 添加键值对。添加到 `this` 的键值对通常被称为实例变量。\n\n```javascript\nfunction Dog() {\n\
    \  this.name = 'sparky';\n}\n\nDog.prototype.speak = function() {\n  console.log('ruff\
    \ ruff, my name is' + this.name);\n};\n```\n\nvar sparky = new Dog();\n\nsparky.speak();\
    \ // 'ruff ruff, my name is sparky'\n```\n\n![](img/image00301.jpeg)\n\n暂时忽略这只狗会说英语的事实。你更感兴趣的是构造函数中创建的\
    \ `this.name` 竟然神奇地在方法中可用。这一点至关重要：任何分配给 `Dog.prototype` 的方法都可以使用变量 `this`。\n\n\
    ### 实例变量的修改 (INSTANCE VARIABLE MODIFICATION)\n\n由于这在每个方法中都是可用的，因此也可以在方法中修改实例变量。\n\
    \n```javascript\nfunction Dog() {\n  this.name = 'sparky';\n  this.age = 0\n}\n\
    \nDog.prototype.growOlder = function() {\n  this.age += 1\n};\n```\n\nvar sparky\
    \ = new Dog();\n\nsparky.age // 0\n\nsparky.growOlder();\n\nsparky.age // 1\n\
    ```\n\n### 骇客提示 (HACKER HINT)\n\n在方法中也可以创建实例变量，但不被鼓励这样做。在大多数情况下，有更好的代码编写方式。\n\n\
    ### 实战中的面向对象编程 (Object-Oriented Programming in Action)\n\n眼见为实，所以通过一个能力与现实狗的 JavaScript\
    \ Dog 来建立你对面向对象编程的理解。\n\n### 狗的属性 (DOG PROPERTIES)\n\n为了创建一个对象实例，需要一个构造函数。\n\n\
    ```javascript\nfunction Dog() {\n\n}\n\nvar sparky = new Dog();\n```\n\n这很无聊，并没有告诉你太多关于狗的知识。狗有许多你可能希望对象了解的方面。这可以通过将它们制作实例变量来实现。狗的名字、年龄、重量和\
    \ `legCount` 可以被存储。典型的狗有 4 条腿。但名字、年龄和重量在狗之间各不同。将它们作为参数添加到我们的构造函数中。\n\n```javascript\n\
    function Dog(name, age, weight) {\n\n}\n```\n\n为了跟踪每个 Dog 实例中的数据，将这些值作为键值对添加到\
    \ `this`。\n\n```javascript\nfunction Dog(name, age, weight) {\n  this.name = name;\n\
    \  this.age = age;\n  this.weight = weight;\n  this.legCount = 4;\n}\n```\n\n\
    var sparky = new Dog('sparky', 4, 20);\n\nvar misu = new Dog('misu', 10, 15);\n\
    \nsparky.name; // 'sparky'\n\nsparky.weight; // '20'\n\nmisu.name; // 'misu'\n\
    \nmisu.weight; // 15\n```\n\n太棒了！现在你理解了如何使用构造函数创建对象实例，你有了两只拥有各自的名字、年龄和重量的独立狗。\n\
    \n### 狗的方法 (DOG METHODS)\n\n目前，这些狗不知道该做什么。要改变这一点，添加几个方法。\n\n首先，狗应该能够吃东西。添加一个 `eat`\
    \ 方法。\n\n```javascript\nDog.prototype.eat = function() {\n  console.log('nom nom\
    \ nom');\n};\n```\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.eat(); //\
    \ 'nom nom nom'\n```\n\n当狗吃得太多时，体重会增加。可以写一个方法来表示。就像任何函数一样，方法可以接受参数。\n\n然后，添加一个代表因过量而增加重量的参数。\n\
    \n```javascript\nDog.prototype.eatTooMuch = function(weightGain) {\n  console.log('ugh...\
    \ ' + this.name + ' doesn\\'t feel so good');\n  this.weight += weightGain;\n\
    };\n```\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.weight; // 20\n\n\
    sparky.eatTooMuch(2); // 'ugh . . . sparky doesn't feel so good'\n\nsparky.weight;\
    \ // 22\n```\n\n记住，在分配给我们的构造函数 `Dog` 的所有方法中，我们都可以 `this`。`eatTooMuch` 方法能够修改狗的体重。\n\
    \n方法是语法修改过的函数。你已经广泛使用了函数进行计算。在这里你可以再次这样做。创建一个计算狗年年龄的方法，例如 `ageInDogYears` 方法。将人类年龄等同于狗的年龄的法则是乘以七。\n\
    \n```javascript\nDog.prototype.ageInDogYears = function(weightGain) {\n  return\
    \ this.age * 7;\n};\n```\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.ageInDogYears();\
    \ // 28\n```\n\n等一下！Sparky 决定贪婪，现在正在从一只猫朋友那里偷食物。在一个新的 `stealCatFood` 方法中，你可以表达\
    \ Sparky 消耗了食物并且在此过程中调皮的事实。\n\n方法可以在其他方法内部调用。已经创建了一个 `eat` 方法，所以你可以复用它。为了表达犬类的调皮本性，还可以显示额外的\
    \ `console.log` 消息。\n\n```javascript\nDog.prototype.eat = function() {\n  console.log('nom\
    \ nom nom');\n};\n\nDog.prototype.stealCatFood = function() {\n  this.eat();\n\
    \  console.log('Yuck, cat food is gross!');\n};\n```\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.stealCatFood();\n\n// 'nom nom nom'\n\n// 'Yuck, cat food\
    \ is gross!'\n```\n\n在另一个方法内部调用方法时，永远不要引用 `prototype`。应该是 `this.eat` 而不是 `this.prototype.eat`。\n\
    \n### 骇客提示 (HACKER HINT)\n\n方法方法分解复杂方法的直接方法。鼓励创建新的小方法，即使该方法本身没有在其他地方或任何对象实例中使用。\n\
    \n### 破解代码 (Crack the Code)\n\n随着编程工具和原则复杂性的增加，要在心中记住一切变得越来越困难。你已经到了在线资源是你最好的朋友阶段！不要害于去网上发现更多关于本章涵盖主题的深度见解。一些建议的资源列在书末。\n\
    \n1. 定义什么是对象数据结构。\n2. 定义面向对象编程中什么是对象。\n3. 哪个变量在所有方法中都是可用的？\n4. 在另一个方法内部调用方法的语法是什么？\n\
    5. 创建构造函数的语法是什么？\n6. 什么是对象实例？\n7. 初始化对象实例的语法是什么？\n\n"
- fmt: "\n# Debugging\n\nA rudimentary chat program is having problems running correctly.\
    \ The `printLog` method should print the chat history. This one is a little tricky\
    \ because two objects are interacting with each other. You’re using data structures\
    \ in an advanced way, so don’t be shy about using `console.log` to check the values\
    \ of variables.\n\n```javascript\nfunction Person(name) {\n  this.name = name;\n\
    }\n\nfunction ChatProgram() {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message\
    \ = function (person, message) {\n  var messageEntry = {\n    person: person,\n\
    \    message: message\n  };\n  this.chatLog(messageEntry); // Note: This looks\
    \ like a bug in the original source\n};\n\nChatProgram.prototype.parseMessageEntry\
    \ = function (chatEntry) {\n  return chatEntry.person.name + ': ' + chatEntry.chat;\n\
    };\n\nChatProgram.prototype.getLog = function () {\n  var allMessages = [];\n\
    \  for (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry = this.chatLog[i];\n\
    \    var parsedMessage = this.prototype.parseMessageEntry(chatEntry);\n    allMessages.pop(parsedMessage);\n\
    \  }\n  return allMessages;\n};\n\nChatProgram.prototype.printLog = function ()\
    \ {\n  var allMessages = this.getLog;\n  for (var i = 0; i < allMessages.length;\
    \ i++) {\n    console.log(allMessages[i]);\n  }\n};\n\nvar layna = new Person('Layna');\n\
    var andrew = new Person('Andrew');\nvar chat = new ChatProgram();\nchat.message(andrew,\
    \ 'Hi Layna, how\\'s it going?');\nchat.message(layna, 'I\\'m doing great');\n\
    chat.message(layna, 'What about you?');\nchat.message(andrew, 'I just came back\
    \ from the doctor');\nchat.message(layna, 'Wow, this conversation is really boring');\n\
    chat.message(andrew, 'That was really mean, why would you say something like that?');\n\
    chat.message(layna, 'I have better things to do');\nchat.message(andrew, ':(');\n\
    chat.message(layna, 'Goodbye');\nchat.printLog();\n```\n\nThis is the expected\
    \ output.\n\n![](Images/image00302.jpeg)\n\n# CODER’S CHECKLIST\n\nCODER’S CHECKLIST\
    \ » Let’s review the topics we covered\n\nObject-oriented programming isn’t unique\
