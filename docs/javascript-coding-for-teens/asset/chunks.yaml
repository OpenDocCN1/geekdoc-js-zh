    \  top: 137px;\n}\n\n#rope {\n  position: absolute;\n  top: 129px;\n  right: 233px;\n\
    \  font-size: 40px\n}\n```\n\n# 预览\n\n在准备好 HTML 和 CSS 文件后，你的游戏在浏览器中看起来应该是这样！\n\
    \n![](img/image00337.jpeg)\n\n## 游戏 CSS\n\nCSS 操作是隐藏和显示元素的常用策略。这里是一些你可能会用到的常用方法。如果你在获取\
    \ HTML 元素并更改其类时感到困惑，请返回参考此节！\n\n### 类：\n\n1. `.hidden`: 隐藏秘密字符\n2. `.intact`:\
    \ 隐藏身体部分\n3. `.no-display`: 隐藏游戏结束屏幕\n4. `.character`: 已猜字符的样式\n5. `.secret-character`:\
    \ 秘密字符的样式\n\n## 游戏伪代码\n\n由于游戏代码的极其复杂性，准备了这段伪代码以帮助我们在解决每个单独挑战时保持思路。\n\n```javascript\n\
    function initialize() {\n  初始化吊字游戏对象\n  在 HTML 上插入秘密单词\n  document.addEventListener('keydown',\
    \ function (event) {\n    从事件参数中获取按下的按键\n    if (该按键不是字母) {\n      停止后续操作\n  \
    \  }\n    if (该按键已经被猜过) {\n      更新游戏消息并告知玩家\n      停止后续操作\n    }\n    跟踪已猜字符\n\
    \    将字符作为 HTML 插入页面\n    if (该按键存在于秘密单词中) {\n      更新游戏消息并告知玩家\n      更新秘密单词以显示猜对的键\n\
    \    } else {\n      更新游戏消息并告知玩家按键错误\n      为人物添加一个身体部分\n    }\n    if (玩家已赢或输了)\
    \ {\n      显示游戏结束的 HTML，包括消息和重置按钮\n    }\n  });\n  ResetButton.addEventListener('click',\
    \ function () {\n    清除游戏状态\n    重新开始游戏\n  });\n}\n```\n\n## 游戏实现\n\n现在是深入研究代码了。别担心，每个挑战将一个一个地解决。\n\
    \n### 辅助函数\n\n在开始之前，编写一些能让生活更轻松的函数很有帮助。将这些函数添加到 JavaScript 文件的顶部。\n\n#### includes\n\
    \n此函数检查特定字符是否存在于字符串内部。\n\n```javascript\nfunction includes(char, string) {\n \
    \ for (var i = 0; i < string.length; i++) {\n    var currentStrChar = string[i];\n\
    \    if (char === currentStrChar) {\n      return true;\n    }\n  }\n  return\
    \ false;\n}\n```\n\n#### createDivWithText\n\n此函数使用 JavaScript 创建一个 div 元素并插入文本。\n\
    \n```javascript\nfunction createDivWithText(text) {\n  var div = document.createElement('div');\n\
    \  div.innerHTML = text;\n  return div;\n}\n```\n\n#### getRandomEntry\n\n此函数接受一个数组并返回其中的一个随机元素。不要纠结细节。\n\
    \n```javascript\nfunction getRandomEntry(array) {\n  var randomIdx = Math.floor(Math.random()\
    \ * array.length);\n  return array[randomIdx];\n}\n```\n\n### 初始化吊字游戏对象\n\n需要一个构造函数！记住以下元素需要被跟踪：\n\
    - 秘密单词\n- 已猜的字符\n- 失败前的错误猜测总数\n\n听起来需要实例变量。参数将是一个秘密单词。之所以有六次错误是因为吊字游戏中一个人有六个身体部分（头、躯、右臂、左臂、右腿、左腿）。\n\
    \n```javascript\nfunction Hangman(secretWord) {\n  this.secretWord = secretWord;\n\
    \  this.charactersGuessed = '';\n  this.remainingBadGuesses = 6;\n}\n```\n\n但等一下！如何选择秘密单词？使用秘密单词数组，可以使用\
    \ `getRandomEntry` 函数随机选择一个。很简单，对吧？这里是 `initialize` 函数目前的样式。\n\n```javascript\n\
    function initialize() {\n  var wordBank = [ // 在这里添加任何你想要的单词！\n    'cat',\n  \
    \  'soul',\n    'watch',\n  ];\n  var randomWord = getRandomEntry(wordBank);\n\
    \  var game = new Hangman(randomWord);\n}\n```\n\n### 将秘密单词插入 HTML\n\n为了在页面上添加秘密单词，将使用\
    \ JavaScript 创建它。添加另一个类 `hidden` 来隐藏字符。\n\n```javascript\nHangman.prototype.initializeSecretWord\
    \ = function () {\n  var container = document.getElementById('secret-word');\n\
    \  for (var i = 0; i < this.secretWord.length; i++) {\n    var secretChar = this.secretWord[i];\n\
    \    var div = createDivWithText(secretChar);\n    div.classList.add('secret-character',\
    \ 'hidden');\n    container.append(div);\n  }\n};\n```\n\n### KEYDOWN 监听器\n\n\
    玩家将输入按键，游戏应该对此做出反应。需要一个 `keydown` 事件监听器。大部分游戏逻辑将放在这里！\n\n#### 获取按下的键\n\n事件监听器的事件参数包含了按下的按键。当玩家在猜测时，大小写并不重要，因此将对按键值进行小写处理。\n\
    \n```javascript\ndocument.addEventListener('keydown', function (event) {\n  //\
    \ 逻辑在此\n});\n```\n\n#### 检查按键是否不是字母\n\n如果玩家输入非字母按键，事件监听器不应有行为。这是我们将第一次使用 `includes`\
    \ 函数以优雅的方式解决问题。如果按键不是字母，则事件监听器应该停止后续操作。\n\n```javascript\nHangman.prototype.isInvalidGuess\
    \ = function (guessedKey) {\n  var isAlphabetic = includes(guessedKey, 'abcdefghijklmnopqrstuvwxyz');\n\
    \  return !isAlphabetic;\n};\n```\n\n#### 检查键是否已经被猜\n\n玩家不应因为重复猜测而受到处罚。此检查可以使用\
    \ `this.charactersGuessed` 来完成，查看它是否在已猜字符串中。\n\n```javascript\nHangman.prototype.alreadyGuessed\
    \ = function (guessedKey) {\n  return includes(guessedKey, this.charactersGuessed);\n\
    };\n```\n\n就像玩家输入非字母键一样，后续操作将被忽略。\n\n#### 打印按键已被猜的消息\n\n在 HTML 文件中，有一个 id 为 `game-message`\
    \ 的 div。这是反馈消息将打印在页面上的。\n\n```javascript\nHangman.prototype.updateGameMessage\
    \ = function (msg) {\n  var messageContainer = document.getElementById('game-message');\n\
    \  messageContainer.innerHTML = msg;\n};\n```\n\n该方法第一次使用的地方是告知玩家按了之前猜过的键。\n\n\
    #### 跟踪已猜字符\n\n当用户输入一个有效猜测的键后，需要更新实例变量 `this.charactersGuessed`。\n\n```javascript\n\
