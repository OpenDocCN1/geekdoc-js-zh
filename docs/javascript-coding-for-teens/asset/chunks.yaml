    \n});\n\nreturn editButton;\n\n}\n```\n\n![](img/image00342.jpeg)\n\n## 编辑后更新文本\n\
    \n看起来你的待办事项条神奇地变成了一个可编辑元素。但如果一个 textarea 没有恢复回不可编辑状态的能力，它又有什么用呢？让我们使用函数 `createUpdateButton`\
    \ 添加一个更新按钮。现在，这个按钮什么都不做。添加一个事件监听器来改变。在销毁 textarea HTML 元素之前，将内部文本保存到一个变量中。\n\n\
    ```javascript\nfunction createUpdateButton() {\n\nvar updateButton = document.createElement('div');\n\
    \nupdateButton.innerHTML = 'update';\n\nupdateButton.classList.add('update-button');\n\
    \nupdateButton.addEventListener('click', function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\
    \nvar updatedText = getTodoText(parentDiv);\n\n});\n\nreturn updateButton;\n\n\
    }\n```\n\n现在你准备好操作页面上的 HTML 了。销毁 textarea，使用内部的文本重新创建一个不可编辑的待办事项，并将其插入到 textarea\
    \ 之前所在的位置。太酷了！\n\n```javascript\nfunction createUpdateButton() {\n\nvar updateButton\
    \ = document.createElement('div');\n\nupdateButton.innerHTML = 'update';\n\nupdateButton.classList.add('update-button');\n\
    \nupdateButton.addEventListener('click', function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\
    \nvar updatedText = getTodoText(parentDiv);\n\ndestroyInnerContent(parentDiv);\n\
    \nvar textDiv = createTextDiv(updatedText);\n\nvar closeButton = createCloseButton();\n\
    \nvar editButton = createEditButton();\n\nparentDiv.append(textDiv);\n\nparentDiv.append(closeButton);\n\
    \nparentDiv.append(editButton);\n\n});\n\nreturn updateButton;\n\n}\n```\n\n##\
    \ 取消文本更新\n\n但如果用户改变了主意并想取消更新呢？你需要一个按钮来实现。这个网站已经有一个名为 `createCancelButton` 的函数了。你需要为它添加行为。这意味着是时候添加另一个事件监听器了！\n\
    \n当点击取消时，文本需要恢复到原始状态。但当用户在 textarea 中打字时，你会丢失文本值。如何解决这个问题呢？\n\n你需要发挥一点创意！这次，为\
    \ `createCancelButton` 添加一个参数。这个参数将在函数内部存储原始文本。\n\n```javascript\nfunction createCancelButton(originalText)\
    \ {\n\nvar cancelButton = document.createElement('div');\n\ncancelButton.innerHTML\
    \ = 'cancel';\n\ncancelButton.classList.add('cancel-button');\n\nreturn cancelButton;\n\
    }\n```\n\n当点击取消按钮时，文本需要恢复到原始状态。销毁 textarea HTML 元素，并使用保存的文本重新插入。\n\n```javascript\n\
    function createCancelButton(originalText) {\n\nvar cancelButton = document.createElement('div');\n\
    \ncancelButton.innerHTML = 'cancel';\n\ncancelButton.classList.add('cancel-button');\n\
    \ncancelButton.addEventListener('click', function () {\n\nvar parentDiv = getParentDiv(updateButton);\n\
    \nvar updatedText = getTodoText(parentDiv);\n\ndestroyInnerContent(parentDiv);\n\
    \nvar textDiv = createTextDiv(updatedText);\n\nvar closeButton = createCloseButton();\n\
    \nvar editButton = createEditButton();\n\nparentDiv.append(textDiv);\n\nparentDiv.append(closeButton);\n\
    \nparentDiv.append(editButton);\n\n});\n\nreturn cancelButton;\n\n}\n```\n\n##\
    \ 恭喜！\n\n你已经成功克服了本章的挑战！你学会了如何操作 DOM、处理事件以及有效地使用变量。\n\n## 答案页\n\n## 第 3 章\n\n###\
    \ 破解代码\n\n注释用于在 JavaScript 中解释代码。浏览器会忽略它们。\n\n```javascript\n// 这是一个注释\nvar x\
    \ = 10;\n\n/*\n  这是一个\n  多行注释\n*/\n```\n\n### 1. 注释什么时候有用？\n注释用于向其他开发者解释代码的功能，或者供未来的自己查看。\n\
    \n### 2. 声明和赋值之间有什么区别？\n声明创建变量（使用 `var`、`let` 或 `const`）。赋值是给该变量一个值（使用 `=`）。\n\
    \n### 3. “var” 单词可以作为变量名吗？\n不可以，`var` 是 JavaScript 中的保留关键字，不能作为标识符。\n\n### 4.\
    \ 本章涵盖了哪些关键字？\n涵盖了 `var`、`let`、`const`、`if`、`else`、`function`、`return` 和 `addEventListener`\
    \ 等关键字。\n\n### 5. 增位运算符和赋值之间有什么区别？\n增位运算符（`++`）将值加 1。赋值（`=`）设置特定的值。\n\n### 6.\
    \ 如何访问数组中的值？\n使用它们的索引访问，索引从 0 开始。\n\n### 7. 如何访问对象中的值？\n通过键（key）访问，可以使用点符号法（`.key`）或括号法（`[\"\
    key\"]`）。\n\n### 8. 如果访问数组中不存在的索引会输出什么值？\n返回 `undefined`。\n\n### 9. 如果访问对象中不存在的键，会输出什么值？\n\
    返回 `undefined`。\n\n### 10. 什么时候访问对象中的值时必须使用括号法？\n当键存储在变量中，或者包含特殊字符/空格时，必须使用括号法。\n\
    \n## 调试\n\n### 1. 变量似乎没有改变值，尽管它已经自增。\n```javascript\nvar num = 0;\nnum++;\nconsole.log(num);\
    \ // 1\n```\n\n### 2. 两个数字相加工作不正常。\n其中一个数字是字符串，所以 JavaScript 执行了字符串拼接。\n```javascript\n\
    var num1 = 10;\nvar num2 = \"2\";\nconsole.log(num1 + num2); // \"102\"\n```\n\
    \n### 3. 尝试使用键 ‘pug’ 你的狗的名字 ‘Max’ 输出 undefined。\n```javascript\nvar dogs = {\n\
    \  pug: 'Max',\n  terrier: 'Appa'\n};\nvar myDog = \"pug\";\nconsole.log(dogs[myDog]);\
    \ // 'Max'\n```\n\n### 4. 尝试访问数组的最后一项输出 undefined。\n```javascript\nvar meanPeople\
    \ = ['Layna', 'Layna again', 'Layna one more time'];\nconsole.log(meanPeople[2]);\
    \ // 'Layna one more time'\n```\n\n### 5. 尝试打印此字符串时发生致命运行时错误。\n```javascript\n\
    console.log('Layna\\'s favorite hobby is being mean to Andrew');\n```\n\n"
- fmt: "\nThe `typeof` operator can be used on strings, numbers, `null`, `undefined`,\
    \ and booleans. The `typeof` operator cannot be used to check arrays and objects.\n\
    \n### [3.](#part0012.xhtml_ch04_Q_3) What data type uses the `instanceof` operator\
    \ for proper checking?\n\nThe `instanceof` operator can be used to check if a\
    \ data type is an array.\n\n### [4.](#part0012.xhtml_ch04_Q_4) What is the output\
    \ of the following code?\n\nfalse, because `true && false` evaluates to `false`\
    \ and the right–hand side is already false.\n\n### [5.](#part0012.xhtml_ch04_Q_5)\
    \ What is the output of the following code?\n\ntrue, because `!false` evaluates\
    \ to `true`. The right-hand side evaluates to `false`, but the OR operator (double\
    \ pipes) only requires one of the sides to be true.\n\n### [6.](#part0012.xhtml_ch04_Q_6)\
    \ Why is `array[index] !== undefined` an effective way of checking to see if that\
    \ index exists inside an array?\n\nIf an index does not exist in an array that\
    \ is attempted to be accessed, the output will be `undefined`.\n\n## DEBUGGING\n\
    \n### [1.](#part0012.xhtml_ch04_D_1) The code is saying that the array is an object.\n\
    \nThe `typeof` operator cannot be used to check if an item is an array. The `instanceof`\
    \ operator has to be used.\n\n```javascript\nvar item = [];\n\nif (item instanceof\
    \ Array) {\n  console.log('I am an array');\n} else {\n  console.log('I am not\
    \ an array');\n}\n```\n\n### [2.](#part0012.xhtml_ch04_D_2) Super Italian Bros\
    \ Two has won Dr. Donkey’s “Game of the Year” award more than 10 times in a row.\
    \ It definitely is a masterpiece. But the code is saying otherwise.\n\nIn the\
    \ `if` conditional, the value comparator is the wrong one. It should be greater\
    \ than, `>`, not less than, `<`.\n\n```javascript\nvar game = 'superItalianBrosTwo';\n\
    \nif (donkeysGameScores[game] > 95) {\n  console.log(game + ' is a masterpiece');\n\
    } else {\n  console.log(game + ' is not a masterpiece');\n}\n// superItalianBrosTwo\
    \ is a masterpiece\n```\n\n### [3.](#part0012.xhtml_ch04_D_3) I consider a game\
    \ to be a mediocre game if the score is anywhere between 30 and 80. The Last Defender\
    \ was a mediocre game. But it was not a bad one. Hint: Writing out complex conditions\
    \ in plain English helps!\n\nIn the `else if` condition, the left-hand side of\
    \ the `AND` operator is incorrect. In the buggy version, that condition states:\
    \ If the score is greater than 80 and the score is greater than 30. It should\
    \ read: If the score is less than 80 and the score is greater than 30.\n\n```javascript\n\
    var game = 'theLastDefender';\nvar score = donkeysGameScores[game];\n\nif (score\
    \ >= 80) {\n  console.log(game + ' was a fun game');\n} else if (score < 80 &&\
    \ score > 30) {\n  console.log(game + ' was an ok game');\n} else {\n  console.log(game\
    \ + ' was a bad game');\n}\n// theLastDefender was an ok game\n```\n\n## [Chapter\
    \ 5 Solutions](#part0003.xhtml_sec-125)\n\n## CRACK THE CODE\n\n### [1.](#part0014.xhtml_ch05_Q_1)\
    \ Why is a terminating condition important when working with loops?\n\nA loop\
    \ with a terminating statement that never evaluates to false will loop forever.\n\
    \n### [2.](#part0014.xhtml_ch05_Q_2) When iterating over an array using a `for`\
    \ loop, a variable, usually `i`, is initialized to the value 0. What is the purpose\
    \ of this variable when used as part of the loop terminating condition?\n\nFor\
    \ the terminating condition, the variable `i` is used to track the index of the\
    \ loop.\n\n### [3.](#part0014.xhtml_ch05_Q_3) When iterating over an array using\
    \ a `for` loop, a variable, usually `i`, is initialized to the value 0. What is\
    \ its purpose when used on the array inside the loop?\n\nThe variable `i` is used\
    \ to access a value inside the array.\n\n### [4.](#part0014.xhtml_ch05_Q_4) Write\
    \ a table for the following loop.\n\n| ITERATION | I | CONDITION | BREED |\n|\
    \ :--- | :--- | :--- | :--- |\n| 1 | 0 | 0 < 3 | pug |\n| 2 | 1 | 1 < 3 | golden\
    \ retriever |\n| 3 | 2 | 2 < 3 | german shepherd |\n\n### [5.](#part0014.xhtml_ch05_Q_5)\
    \ Write a table for the following loop.\n\n| ITERATION | I | CONDITION | GAMER\
    \ |\n| :--- | :--- | :--- | :--- |\n| 1 | 0 | 0 < 4 | super |\n| 2 | 1 | 1 < 4\
    \ | smurf |\n| 3 | 2 | 2 < 4 | sleepy |\n| 4 | 3 | 3 < 4 | moth |\n\n### [6.](#part0014.xhtml_ch05_Q_6)\
    \ Write a table for the following loop. Note the nonstandard incrementor, `i +=\
    \ 2`!\n\n| ITERATION | I | CONDITION |\n| :--- | :--- | :--- |\n| 1 | 0 | 0 <\
    \ 7 |\n| 2 | 2 | 2 < 7 |\n| 3 | 4 | 4 < 7 |\n| 4 | 6 | 6 < 7 |\n\n## DEBUGGING\n\
    \n### [1.](#part0014.xhtml_ch05_D_1) The loop is not printing the cat breeds.\n\
    \nThe terminating condition is incorrect. It needs to be `catBreeds.length`.\n\
    \n```javascript\nvar catBreeds = [\n  'Maine Coon',\n  'ragdoll'\n];\n\nfor (var\
