    [Debugging](#part0003.xhtml_sec-55)


    Here’s a quick reminder that it helps to run the code in the terminal. Seeing
    is believing.


    [1.](#part0027.xhtml_ch05_D1)The loop is not printing the cat breeds.


    var catBreeds = [


    ''Maine Coon'',


    ''ragdoll''


    ];


    for (var i = 0; i < catBreeds; i++) {


    console.log(catBreeds[i]);


    }


    [2.](#part0027.xhtml_ch05_D2)The loop is not printing the bills.


    var bills = [1, 5, 10, 20, 50];


    for (var i = 0; i > bills.length; i++) {


    console.log(bills[i]);


