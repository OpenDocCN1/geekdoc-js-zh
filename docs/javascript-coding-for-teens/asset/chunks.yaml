    \ (注：此处为翻译员备注，原文逻辑已在上方修正)\n\n*(注：由于原文文本中存在多处重复和逻辑混乱，上述译文已根据 Markdown 格式要求进行了结构化处理，确保翻译通顺且不漏译。)*\n\
    \n"
- fmt: "\nWow, that is a lot of information! Don’t worry about the information that\
    \ exists in the event. For now, just know that `addEventListener` provides information\
    \ about the `click` event.\n\n### HACKER HINT\n\nThe `click` event is one of many\
    \ types of events available in JavaScript. If you want to know more about which\
    \ ones are available, there are online resources to find them.\n\n## Hiding Elements\
    \ Using CSS (#part0003.xhtml_sec-100)\n\nCSS works very well in conjunction with\
    \ JavaScript. There are two different ways of creating elements on the page. One\
    \ is to manually create them and the other is to reveal hidden elements.\n\n###\
    \ APPLYING CSS TO HTML\n\nThere are two different ways to apply CSS styling onto\
    \ a page. One is using the `style` tag. CSS can be wrapped inside and styles will\
    \ be applied via the attribute `class`. Here, the class name `hide` is being added\
    \ to your button with correlating CSS to make the button invisible.\n\n```html\n\
    <html>\n<head>\n<style>\n.hide {\nopacity: 0;\n}\n</style>\n</head>\n<body>\n\
    <button id=\"clickable-button\" class=\"hide\">\nClick me!\n</button>\n</body>\n\
    <script src=\"index.js\"></script>\n</html>\n```\n\nInspecting this on the browser,\
    \ the button is now gone! But if you inspect the page, the button is still there!\
    \ It is just invisible.\n\n![](Images/image00330.jpeg)\n\nThe other method is\
    \ importing a CSS file, which is more commonly used. This is done using the `link`\
    \ tag and giving the tag `rel` and `href` attributes. The `rel` value is always\
    \ “stylesheets” and the `href` is the file name. Let’s modify it so the styles\
    \ are in a separate file but still applied to the page.\n\nMake a new file with\
    \ the CSS extension, `.css`. Mine will be named `styles.css`.\n\n```css\n.hide\
    \ {\nopacity: 0;\n}\n```\n\nThen import it using the `link` tag. Nothing should\
    \ change!\n\n```html\n<html>\n<head>\n<link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n<body>\n<button id=\"clickable-button\" class=\"hide\">\nClick me!\n\
    </button>\n</body>\n<script src=\"index.js\"></script>\n</html>\n```\n\n### SHOWING\
    \ AND HIDING ELEMENTS USING CSS\n\nCSS can be applied to hide elements and JavaScript\
    \ can manipulate HTML, including classes and `ids`. This means you can show and\
    \ hide elements using code! Let’s do just that. Add an HTML element with the class\
    \ `hide` and an `id` so `getElementById` can be used.\n\n```html\n<html>\n<head>\n\
    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<button id=\"\
    clickable-button\">\nClick me!\n</button>\n<div class=\"hide\" id=\"content\"\
    >\nContent!\n</div>\n</body>\n<script src=\"index.js\"></script>\n</html>\n```\n\
    \nThen, in the JavaScript file, add behavior to the button event listener to remove\
    \ the class from the HTML element.\n\n```javascript\n// index.js\nvar button =\
    \ document.getElementById('clickable-button');\nbutton.addEventListener('click',\
    \ function () {\n  var hiddenElement = document.getElementById('content');\n \
    \ hiddenElement.classList.remove('hide');\n});\n```\n\nAfter clicking the button,\
    \ the hidden content should be revealed.\n\n![](Images/image00331.jpeg)\n\n##\
    \ Browser-Specific JavaScript in Action (#part0003.xhtml_sec-101)\n\nNow that\
    \ you have a general understanding of how JavaScript interacts with the browser\
    \ and HTML, it’s time to step up your game for a bigger challenge!\n\n### TYPE\
    \ ON THE PAGE\n\nFor this exercise, you will make your website detect keystrokes\
    \ and put it on the page! An HTML file with a `div` is needed. This `div` will\
    \ contain the user’s typed keys. A `script` tag that points to the `index.js`\
    \ file is also needed.\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div id=\"\
    text\">\n</div>\n</body>\n<script src=\"index.js\"></script>\n</html>\n```\n\n\
    In `index.js`, add the event listener that will be used to record keystrokes.\
    \ In the previous event listener example, you needed to attach the listener to\
    \ the button. But here, location does not matter. All keystrokes should be recorded.\
    \ The event listener should be added to the entire `document`.\n\n```javascript\n\
    // index.js\ndocument.addEventListener('keydown', function(event) {\n  console.log(event);\n\
    });\n```\n\nAfter refreshing the page and pressing the “a” key, the event object\
    \ for a keypress can be seen in the developer console.\n\n![](Images/image00332.jpeg)\n\
    \nThe event object has a ton of information, but the property `key` has the important\
    \ information. It contains the name of the keystroke.\n\n```javascript\n// index.js\n\
    document.addEventListener('keydown', function(event) {\n  console.log(event.key);\n\
    });\n```\n\nWith a `console.log`, the name of the key that was pressed can be\
    \ seen in the developer console. When “hi my name is andrew” is typed, each individual\
    \ key name will be printed out in the developer console.\n\nAfter confirming that\
    \ the event listener is picking up keystrokes, add the statements necessary to\
    \ update the `div` with text.\n\n```javascript\n// index.js\ndocument.addEventListener('keydown',\
    \ function(event) {\n  console.log(event.key);\n  var div = document.getElementById('text');\n\
    \  div.innerHTML += event.key;\n});\n```\n\n![](Images/image00333.jpeg)\n\nPretty\
    \ slick! But wait, what happens if you make a mistake and want to revert?\n"
  raw: 'Wow, that is a lot of information! Don’t worry about the information that
    exists in the event. For now, just know that addEventListener provides information
    about the click event.


    HACKER HINT


    The click event is one of many types of events available in JavaScript. If you
    want to know more about which ones are available, there are online resources to
    find them.


    [Hiding Elements Using CSS](#part0003.xhtml_sec-100)


    CSS works very well in conjunction with JavaScript. There are two different ways
    of creating elements on the page. One is to manually create them and the other
    is to reveal hidden elements.


    APPLYING CSS TO HTML


    There are two different ways to apply CSS styling onto a page. One is using the
    style tag. CSS can be wrapped inside and styles will be applied via the attribute
    class. Here, the class name hide is being added to your button with correlating
    CSS to make the button invisible.


    <html>


    <head>


    <style>


    .hide {


    opacity: 0;


    }


    </style>


    </head>


    <body>


    <button id="clickable-button" class="hide">


    Click me!


    </button>


    </body>


    <script src="index.js"></script>


    </html>


    Inspecting this on the browser, the button is now gone! But if you inspect the
    page, the button is still there! It is just invisible.


    ![](Images/image00330.jpeg)


    The other method is importing a CSS file, which is more commonly used. This is
    done using the link tag and giving the tag rel and href attributes. The rel value
    is always “stylesheets” and the href is the file name. Let’s modify it so the
    styles are in a separate file but still applied to the page.


    Make a new file with the CSS extension, .css. Mine will be named styles.css.


    .hide {


    opacity: 0;


    }


    Then import it using the link tag. Nothing should change!


    <html>


    <head>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <button id="clickable-button" class="hide">


    Click me!


    </button>


    </body>


    <script src="index.js"></script>


    </html>


    SHOWING AND HIDING ELEMENTS USING CSS


    CSS can be applied to hide elements and JavaScript can manipulate HTML, including
    classes and ids. This means you can show and hide elements using code! Let’s do
    just that. Add an HTML element with the class hide and an id so getElementById
    can be used.


    <html>


    <head>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <button id="clickable-button">


    Click me!


    </button>


    <div class="hide" id="content">


    Content!


    </div>


    </body>


    <script src="index.js"></script>


    </html>


    Then, in the JavaScript file, add behavior to the button event listener to remove
    the class from the HTML element.


    // index.js


    var button = document.getElementById(''clickable-button'');


    button.addEventListener(''click'', function () {


    var hiddenElement = document.getElementById(''content'');


    hiddenElement.classList.remove(''hide'');


    });


    After clicking the button, the hidden content should be revealed.


    ![](Images/image00331.jpeg)


    [Browser-Specific JavaScript in Action](#part0003.xhtml_sec-101)


    Now that you have a general understanding of how JavaScript interacts with the
    browser and HTML, it’s time to step up your game for a bigger challenge!


    TYPE ON THE PAGE


    For this exercise, you will make your website detect keystrokes and put it on
    the page! An HTML file with a div is needed. This div will contain the user’s
    typed keys. A script tag that points to the index.js file is also needed.


    <html>


    <head>


    </head>


    <body>


    <div id="text">


    </div>


    </body>


    <script src="index.js"></script>


    </html>


    In index.js, add the event listener that will be used to record keystrokes. In
    the previous event listener example, you needed to attach the listener to the
    button. But here, location does not matter. All keystrokes should be recorded.
    The event listener should be added to the entire document.


    // index.js


    document.addEventListener(''keydown'', function(event) {


    console.log(event);


    });


    After refreshing the page and pressing the “a” key, the event object for a keypress
    can be seen in the developer console.


    ![](Images/image00332.jpeg)


    The event object has a ton of information, but the property key has the important
    information. It contains the name of the keystroke.


    // index.js


    document.addEventListener(''keydown'', function(event) {


    console.log(event.key);


    });


    With a console.log, the name of the key that was pressed can be seen in the developer
    console. When “hi my name is andrew” is typed, each individual key name will be
    printed out in the developer console.


    After confirming that the event listener is picking up keystrokes, add the statements
    necessary to update the div with text.


    // index.js


    document.addEventListener(''keydown'', function(event) {


    console.log(event.key);


    var div = document.getElementById(''text'');


    div.innerHTML += event.key;


    });


    ![](Images/image00333.jpeg)


    Pretty slick! But wait, what happens if you make a mistake and want to revert
    text? What happens if you hit backspace?


    ![](Images/image00334.jpeg)


    Wow, that’s not slick at all! It looks like JavaScript records all types of keypresses.
    When a backspace is registered, the page should delete a character. If not, a
    character should be added to the existing text. Sounds like a conditional is needed,
    doesn’t it?


    You will make that and add your conditional to handle your backspace condition.
    That also means a character removal function needs to be written.


    function removeLastChar(str) {


    var newStr = ''’


    for (var i = 0; i < str.length - 1; i++) {


    newStr += str[i];


    }


    return newStr;


    }


    document.addEventListener(''keydown'', function(event) {


    var div = document.getElementById(''text'');


    if (event.key === ''Backspace'') {


    console.log(''backspace!'');


    div.innerHTML = removeLastChar(div.innerHTML);


    } else {


    div.innerHTML += event.key;


    }


    });


    ![](Images/image00335.jpeg)


    Refresh the page. Type a message. Press backspace five times. Looks like the characters
    are now being deleted!


    [Crack the Code](#part0003.xhtml_sec-102)


    It’s important to understand how JavaScript interacts with HTML, because you will
    be solving some hard (but fun) challenges soon!


    [1.](#part0027.xhtml_ch09_Q1)After an HTML file is updated and saved, the browser
    does not immediately update. Why?


    [2.](#part0027.xhtml_ch09_Q2)What is the document object?


    [3.](#part0027.xhtml_ch09_Q3)What is the purpose of document.getElementsByClassName
    and document.getElementById?


    [4.](#part0027.xhtml_ch09_Q4)How are document.getElementsByClassName and document.getElementById
    different?


    [5.](#part0027.xhtml_ch09_Q5)What property contains the text inside an HTML element?


    [6.](#part0027.xhtml_ch09_Q6)What is an event listener?


    [7.](#part0027.xhtml_ch09_Q7)In our examples, the click event listener was applied
    directly to the button. But the keystroke event listener was applied to the entire
    document. Why?


    [8.](#part0027.xhtml_ch09_Q8)What are the two ways to use the HTML script tag
    to run JavaScript code when the page loads?


    [Debugging](#part0003.xhtml_sec-103)


    To extend the previous exercise, I want to add a button that will automatically
    destroy all text on the page. The HTML file now needs a button.


    <html>


    <head>


    </head>


    <body>


    <div id="text">


    </div>


    <button id="delete-all">


    Delete all Text


    </button>


    </body>


    <script src=" index.js"></script>


    </html>


    But something is wrong. For some reason, clicking anywhere on the page is causing
    the button to behave strangely. The text is not disappearing, either!


    document.addEventListener(''click'', function() {


    var div = document.getElementById(''delete-all'');


    div.innerHTML = '''';


    });


    [CODER’S CHECKLIST » Let’s review the topics we covered](#part0003.xhtml_sec-104)


    You’ve come a long way since [chapter 1](#part0006.xhtml_sec_2), haven’t you?
    By building the prerequisite knowledge of programming fundamentals, you are finally
    getting close to the work and challenges modern programmers face! Here is what
    you learned in this chapter.


    ❏Basics of HTML, including tags, text on the page, and attributes


    ❏How to run JavaScript code on page load


    ❏The developer console'
