    \n### HTML 代码\n```html\n<!DOCTYPE html>\n<html\n  <head>\n  <meta charset=\"utf-8\"\
    >\n  <title>编写一个 JavaScript 程序，在摄氏度和华氏度之间进行温度转换</title>\n  </head>\n  <body>\n\
    </body>\n</</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction cToF(celsius)\
    \ {\n  var cTemp = celsius;\n  var cToFahr = cTemp * 9 / 5 + 32;\n  var message\
    \ = cTemp+'\\xB0C is ' + cToFahr + ' \\xB0F.';\n  console.log(message);\n}\nfunction\
    \ fToC(fahrenheit) {\n  var fTemp = fahrenheit;\n  var fToCel = (fTemp - 32) *\
    \ 5 / 9;\n  var message = fTemp+'\\xB0F is ' + fToCel + '\\xB0C.';\n  console.log(message);\n\
    }\ncToF(60);\nfToC(45);\n```\n\n### 输出\n![](img/image00135.jpeg)\n\n"
