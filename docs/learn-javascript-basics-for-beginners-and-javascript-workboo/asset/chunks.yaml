    Function Literals


    The concept of function literals, which is another way to construct functions,
    is introduced in JavaScript 1.2\. It''s an expression that defines a function
    that doesn''t have a name.


    The syntax for a function literal is similar to that of a function statement,
    except that it is used as an expression rather than a statement, and there is
    no need for a function name.


    Syntax


    ##### <script>  


    ##### var variablename = function (Argument List){  


