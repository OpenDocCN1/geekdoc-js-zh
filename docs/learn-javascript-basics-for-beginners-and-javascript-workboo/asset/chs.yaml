  }\nconsole.log(Second_Greatest_Lowest([1,2,3,4,5]));\n```\n\n### 输出\n2,4\n\n###\
  \ 计算给定正整数的两个数字之和\n\n### 长度为二\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n\
