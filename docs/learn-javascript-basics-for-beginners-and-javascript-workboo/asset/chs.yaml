  JavaScript\")); // 输出: true\n```\n\n### 乘法和除法\n```javascript\nfunction multiply(a,\
  \ b) {\n  return a * b;\n}\nfunction divide(a, b) {\n  if (b === 0) return \"Cannot\
  \ divide by zero\";\n  return a / b;\n}\nconsole.log(multiply(4, 5)); // 输出: 20\n\
  console.log(divide(10, 2)); // 输出: 5\n```\n\n### 温度转换\n```javascript\nfunction celsiusToFahrenheit(c)\
  \ {\n  return (c * 9/5) + 32;\n}\nfunction fahrenheitToCelsius(f) {\n  return (f\
  \ - 32) * 5/9;\n}\nconsole.log(celsiusToFahrenheit(25)); // 输出: 77\nconsole.log(fahrenheitToCelsius(77));\
  \ // 输出: 25\n```\n\n\n\n\n```html\n<script>  \n  /* 这是一个多行注释。  \n  它不会被显示 */  \n\
  \  document.write (\"Example of JavaScript multi line comment\");  \n</script> \
  \ \n</body>  \n</html\n```\n\n## JavaScript 变量\n\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。在使用变量之前，必须先对其声明。要声明变量，我们如下使用\
  \ `var` 关键字：\n\n```javascript\nvar name;\n```\n\n变量有 2  类型：\n\n1. 局部变量\n2. 全局变量\n\
  \n### 局部变量\n它在函数或块内部声明。\n\n### 示例\n```html\n<script>  \nfunction abc(){  \n  var\
  \ x=10; //局部变量  \n</script>\n```\n\n### 全局变量\n它具有全局作用域，意味着可以在 JavaScript 代码的任何地方定义。在函数外部声明的变量。\n\
  \n### 示例\n```html\n<!DOCTYPE html>  \n<html>  \n<body>  \n<script>  \nvar data =200;\
  \ //global 变量  \nfunction a(){  \n  document.writeln(data);  \n}  \nfunction b(){\
  \  \n  document.writeln(data);  \n}  \na();//调用 javascript 函数  \nb();  \n</script>\
  \  \n</body>  \n</html>\n```\n\n### 在 JavaScript 中，在函数内部声明全局变量\n若要在函数内部声明 JavaScript\
  \ 全局变量，我们必须使用 `window` 对象。\n\n### 示例\n```javascript\nwindow.value=90;\n```\n现在可以在任何函数内部声明它，并从任何函数内部访问。\n\
  \n### 示例\n```html\n<!DOCTYPE html>  \n<html>  \n<body>  \n<script>  \nfunction a(){\
  \  \n  window.value=50; //使用 window 对象声明全局变量  \n}  \nfunction b(){  \n  alert(window.value);//从其他函数访问全局变量\
  \  \n}  \na();  \nb();      \n</script>  \n</body>  \n</html>\n```\n\n## JavaScript\
  \ 数据类型\n\n它有多种数据类型来存放各种类型的值。在 JavaScript 中，有两种类的数据类型。\n\n1. 原始数据类型（Primitive data\
  \ types）。\n2. 非原始数据类型（Non-primitive data types）。\n\n由于 JavaScript 是动态类型语言，我们不需要定义变量的类型，因为\
  \ JavaScript 引擎会动态使用它。在这种情况下，使用 `var` 指定数据类型。它可以存储任何类型的值，包括数字、字符串和对象。\n\n### 示例\n\
  ```javascript\nvar a=Ram; //String  \nvar b=20; //Number  \nvar x= {FirstName:'Ram',\
  \ lastName:'Doe'}; //Object\n```\n\n### JavaScript - 原始数据类型\n在 JavaScript 中，有五种不同的原始数据类型。\n\
