  ```\n\n### JASCRIPT 练习册\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\n<p>欢迎使用 JavaScript\
  \ 练习册！</p>\n\n</body>\n</html>\n```\n\n### 练习 1：首字母大写\n```javascript\nfunction capitalize(str)\
  \ {\n  return str.charAt(0).toUpperCase() + str.slice(1);\n}\nconsole.log(capitalize(\"\
  hello\")); // 输出: \"Hello\"\n```\n\n### 练习 2：统计元音数量\n```javascript\nfunction countVowels(str)\
  \ {\n  let count = 0;\n  const vowels = \"aeiouAEIOU\";\n  for (let char of str)\
  \ {\n    if (vowels.includes(char)) {\n      count++;\n    }\n  }\n  return count;\n\
  }\nconsole.log(countVowels(\"hello\")); // 输出: 2\n```\n\n### 练习 3：创建一个新字符串\n```javascript\n\
  function createString(str1, str2) {\n  return str1 + str2;\n}\nconsole.log(createString(\"\
  Hello \", \"World\")); // 输出: \"Hello World\"\n```\n\n### 练习 4：拼接两个字符串\n```javascript\n\
  function concatenateStrings(str1, str2) {\n  return str1 + \" \" + str2;\n}\nconsole.log(concatenateStrings(\"\
  Hello\", \"World\")); // 输出: \"Hello World\"\n```\n\n### 练习 5：第一个非重复字符\n```javascript\n\
  function firstNonRepeatedChar(str) {\n  let charCount = {};\n  for (let char of\
  \ str) {\n    charCount[char] = (charCount[char] || 0) + 1;\n  }\n  for (let char\
  \ of str) {\n    if (charCount[char] === 1) {\n      return char;\n    }\n  }\n\
  \  return null;\n}\nconsole.log(firstNonRepeatedChar(\"swiss\")); // 输出: \"w\"\n\
  ```\n\n### 练习 6：找到最长单词\n```javascript\nfunction findLongestWord(str) {\n  let words\
  \ = str.split(\" \");\n  let longest = \"\";\n  for (let word of words) {\n    if\
  \ (word.length > longest.length) {\n      longest = word;\n    }\n  }\n  return\
  \ longest;\n}\nconsole.log(findLongestWord(\"The quick brown fox jumps over the\
  \ lazy dog\")); // 输出: \"jumps\"\n```\n\n### 练习 7：统计元音个数\n```javascript\nfunction\
  \ countVowels(str) {\n  let count = 0;\n  const vowels = \"aeiouAEIOU\";\n  for\
  \ (let char of str) {\n    if (vowels.includes(char)) {\n      count++;\n    }\n\
  \  }\n  return count;\n}\nconsole.log(countVowels(\"JavaScript programming\"));\
  \ // 输出: 5\n```\n\n### 练习 8：检查数字是否为素数\n```javascript\nfunction isPrime(num) {\n\
  \  if (num <= 1) return false;\n  for (let i = 2; i <= Math.sqrt(num); i++) {\n\
  \    if (num % i === 0) return false;\n  }\n  return true;\n}\nconsole.log(isPrime(11));\
  \ // 输出: true\n```\n\n### JavaScript: 获取数据类型\n```javascript\nconsole.log(typeof\
