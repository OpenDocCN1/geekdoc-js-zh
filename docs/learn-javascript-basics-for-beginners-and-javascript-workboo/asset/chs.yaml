  \ []); // 输出: \"object\"\n```\n\n### 寻找第二小和第二大\n```javascript\nfunction findSecondLowestAndGreatest(arr)\
  \ {\n  let uniqueArr = [...new Set(arr)].sort((a, b) => a - b);\n  if (uniqueArr.length\
  \ < 2) return null;\n  return {\n    secondLowest: uniqueArr[1],\n    secondGreatest:\
  \ uniqueArr[uniqueArr.length - 2]\n  };\n}\nconsole.log(findSecondLowestAndGreatest([1,\
  \ 5, 2, 8, 3, 1])); // 输出: {secondLowest: 2, secondGreatest: 5}\n```\n\n### 两个数字相加\n\
  ```javascript\nfunction addDigits(a, b) {\n  return a + b;\n}\nconsole.log(addDigits(5,\
  \ 10)); // 输出: 15\n```\n\n### 闰年检查\n```javascript\nfunction isLeapYear(year) {\n\
  \  return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);\n}\nconsole.log(isLeapYear(2000));\
  \ // 输出: true\nconsole.log(isLeapYear(2023)); // 输出: false\n```\n\n### 检查给定的正数\n\
