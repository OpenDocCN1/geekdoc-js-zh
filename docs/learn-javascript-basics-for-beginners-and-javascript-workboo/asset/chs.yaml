  ```\n\n### 输出:\n7\n5\n\n### 闰年检查\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n  <meta charset=utf-8 />\n  <title>查找闰年</title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction leapyear(year) {\n  return\
  \ (year % 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
  console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
  console.log(leapyear(100));\n```\n\n### 输出\ntrue\ntrue\nfalse\nfalse\nfalse\n\n\
  ### 检查给定的正整数\n\n### ![](img/image00125.jpeg)\n\n### HTML 代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
  width=device-width\">\n  <title>检查给定的正整数是否是 3 的倍数或 7 的倍数的 JavaScript 程序。</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
  \ test37(x) {\n  if (x % 3 == 0 || x % 7 == 0) {\n    return true;\n  }\n  else\
