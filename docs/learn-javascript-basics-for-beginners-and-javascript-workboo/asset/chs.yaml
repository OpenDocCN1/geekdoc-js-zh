  \n## JavaScript 运算符\n\n运算符是 JavaScript 中的符号，用于对操作数执行操作。简单来说，`3+2` 等于 `5`。这里的操作数是\
  \ `3` 和 `2`，运算符是 `+`。\n\nJavaScript 运算符如下：\n\n1. 算术运算符。\n2. 比较（关系）运算符。\n3. 位运算符。\n\
  4. 逻辑运算符。\n5. 赋值运算符。\n6. 特殊运算符。\n\n### 算术运算符\n我们在算术运算符对操作数使用算术操作。\n![](img/image00103.jpeg)\n\
