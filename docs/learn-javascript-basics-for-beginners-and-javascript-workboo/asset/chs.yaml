  \ 寻找接近 100 的值\n```javascript\nfunction nearestTo100(num) {\n  if (Math.abs(100 -\
  \ num) <= 49) {\n    return Math.round(num / 100) * 100;\n  } else {\n    return\
  \ Math.floor(num / 100) * 100;\n  }\n}\nconsole.log(nearestTo100(95)); // 输出: 100\n\
  console.log(nearestTo100(150)); // 输出: 100\n```\n\n### 正数 - 检查\n```javascript\n\
