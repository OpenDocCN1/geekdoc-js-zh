  ### 从数组中寻找第二小和第二大的数字\n\n![](img/image0012.jpeg)\n\n### HTML 代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <meta charset=utf-8 />\n  <title>从数组中寻找第二小和第二大的数字</title>\n\
