    for declaring an anonymous function is a little different. They are dynamic in
    nature because they are executed at runtime rather than waiting to be called.


    Anonymous functions perform well in the browser because there is no reference
    to them in another part of the document. This comes with maine and minuses. So
    as you write your JavaScript, it is always good to note that if you rewrite an
    anonymous function over and over, it''s probably best to pull it out into a normal
    function to cut down maintenance and repetitive code.


    There is often a confusion as to the purpose of anonymous functions. If you want-thing
    to execute at runtime, why wouldn''t you just dump the code right into your JavaScript'
