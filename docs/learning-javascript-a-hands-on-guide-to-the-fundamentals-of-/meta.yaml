  md: "# A Function as a Method\n\nJust as you group variables and data into objects,\
    \ you can also do it with functions. When you group functions into objects, they're\
    \ not called functions anymore; they're called \"methods.\"\n\nWhen I first started\
    \ out with JavaScript, I came from a design background rather than a developer.\
    \ I wasn't familiar with common programming terms such as object, function, method,\
    \ loop, and so on. I quickly learned what a function was and how to work with\
    \ them through a bit of Googling. But I would hear people talk the alert() method\
    \ and other methods native to JavaScript, and I wouldn't really get it because\
    \ they look the same as functions. Why isn't it the \"alert function\"? I had\
    \ no idea. This comes up when you're dealing with JavaScript libraries as well\
    \ (we get into that later in the book); everything is a method and not is a function,\
    \ even though they all look and act the same.\n\nHere's what going on. In Chapter\
    \ 5, \"Storing Data in JavaScript,\" you learned about storing information in\
    \ objects. I mentioned that you could also store functions in objects. When you\
    \ do, they methods instead of functions, but they work the same way. It's weird,\
    \ I know, and it's not even an important distinction while you're coding. It's\
    \ more about organizing your functions in groups to make them easier to maintain.\
    \ The alert() method lives inside a global object (which you never see it), which\
    \ is why it's called a method.\n\nNow that we're past that ordeal, organizing\
    \ your functions into meaningful objects can clean up a lot of your code, especially\
    \ on larger projects where you need the code organization to keep your sanity\
    \ Listing 6.4 should look a little familiar, it shows how to organize our functions\
    \ (sayHello and startle inside an object \"addressBookMethods.\" If we were building\
    \ a large-scale application with many features, this would be a great way to section\
    \ off the functionality meant only for the address book feature.\n\n# Listing\
    \ 6.4 Grouping Similar Functions\n\n```\nvar addressBookMethods = {\n  sayHello:\
    \ function(message) {\n    return message;\n  },\n  startle: function() {\n  \
    \  alert(addressBookMethods.sayHello(\"hey there, called from a method\"));\n\
    \  }\n}\n\n/* call the function */\naddressBookMethods.startle();\n```"
