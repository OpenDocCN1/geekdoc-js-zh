  md: "# Listing 9.7 Code with Poor Whitespace\n\n```\n/* determine how many slices\
    \ of pizza each person can eat */\nfunction pizzaParty(totalSlices, personCount)\
    \ {\n  use strict;\n  // take the arguments and decide how many pieces per person\
