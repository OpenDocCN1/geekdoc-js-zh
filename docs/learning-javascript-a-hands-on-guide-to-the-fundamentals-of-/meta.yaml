    # shift and unshift


    shift and unshift are methods used to add and remove items to/from the beginning
    of a array. In Listing 5.12.2 the shift method is set to remove the array item
    "meatball" from the dinner array defined in Listing 5.12. The unshift method will
    then add the array item of "Nacho Cheese-wich" to the beginning of the same array.
    You can then see the result-array with "meatball" removed and "Nacho Cheese-wich"
    added for an extra-delicious dinner sandwich array.


    # Listing 5.12.2 Remove and Add Items to the Beginning of an Array


    ```

    /*

    SHIFT

    */

    * remove the first element of dinner * /

