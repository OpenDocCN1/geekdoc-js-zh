  md: "# Listing 7.1 Adding a Basic onOnClick Event Through an Event Handler\n\n```\n\
    // wrap it in an anonymous function to contain the variables *\n\nfunction(){\n\
    \  // HTML: <button type=\"button\" id=\"btn\">a button</button>\n\n  // save\
    \ the button to a variable\n  var btn = document.getElementById(\"btn\");\n\n\
    \  // Use an event handler to attach the \"onclick\"\n  btn.onclick = function()\
    \ {\n    // alert inside this anonymous callback function\n    alert('clicked\
    \ the button');\n  };\n}\n();\n```\n\nWhen using event handlers, the normal event\
    \ you would attach is always prefaced with the word \"on.\" rather than just \"\
    click.\" This pattern is applied to all events: onsubmit, onchange, onfocus, onblur,\
    \ onclick, onmouseout, ontouchstart, ongesturestart, and so on. You get the point;\
    \ every event is <event> when using event handlers.\n\nFor the most part, event\
    \ handlers are fine; they have great browser support and actually predict the\
    \ DOM standard. With handlers is you can attach only a single function to a specific\
    \ event of a DOM node. Basically, that means you cannot attach two click functions\
    \ to the same button. You might be thinking, \"So what?\" It's true that you probably\
    \ won't be attaching two functions to the same event on the same DOM node, but\
    \ there are cases where it applies—for example, wanting to validate all the inputs\
    \ in a form on submit, and then using Ajax to submit the form. I won't tell you\
    \ to never use event handlers, because a lot of the time it's fine, and I do them\
    \ from time to time. Knowing the limitations of the method is important, and if\
    \ you want to get in the habit of using a method that doesn't have limitations—I\
    \ recommend using an event listener instead of an event handler. A great segue!\n\
    \n# Event Listeners\n\nEvent listeners have a similar function to event handlers\
    \ that you still need a DOM element to attach them to, you still need to identify\
    \ the event, and you still need a function to call. The difference is that you\
    \ don't have the limitation of the handler when assigning multiple functions to\
    \ the same DOM element and event. It unties your hands a little as a developer,\
    \ and I personally prefer working with them a little more than I do handlers."
  merge: -1
  pgno: 146
