    utf-8\">\n<!-- 1 HTTP request for the favicon -->\n<link rel=\"shortcut icon\"\
    \ href=\"images/favicon.ico\">\n\n<!-- 1 HTTP request per CSS file (2 total) -->\n\
    <link rel=\"stylesheet\" href=\"css/style.css\" media=\"screen\">\n<link rel=\"\
    stylesheet\" href=\"css/print.css\" media=\"print\">\n</head>\n<body>\nn<!-- 1\
    \ HTTP request per image file (4 total) -->\n<img src=\"picture-of-allie.gif\"\
    \ alt=\"placeholder content\">\n<img src=\"pictures-mug.gif\" alt=\"placeholder\
    \ content\">\n<img src=\"images/clay.gif\" alt=\"placeholder content\">\n<img\
    \ src=\"images/linh-in-a-chair.gif\" alt=\"placeholder content\">\n<!-- 1 HTTP\
    \ request per JavaScript file (2 total)-->\n<script src=\"js/plugins.js\"></script>\n\
    <script src=\"js/script.js\"></script>\n</body>\n</html>\n```\n\nAs you can see\
    \ in Listing 2.1, this is a very basic layout, but it is still firing 10 HTTP\
    \ requests to render the page (including the original request for the HTML). They\
    \ pile up fast, so it's best to keep an eye on them. You may also have hidden\
    \ requests if you're getting images via your CSS file (background images), which\
    \ add to the total count and can dog page performance.\n\nBy default, the average\
    \ browser will fetch these assets in pairs—that is, two at a time. It can get\
    \ two images, two CSS files, and so on until everything has been fetched. It can't\
    \ download everything at the same time because of bandwidth constraints, but there\
    \ is a user setting in most browsers to change this setting from 2 to whatever\
    \ you'd like (it is extremely rare to encounter someone who has changed this).\
    \ It's generally kept at 2 to keep wear on the processor as low as possible to\
