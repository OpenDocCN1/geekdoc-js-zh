    \ jump so far into the tree. From there, you will have to navigate and down with\
    \ some of the most useful methods to JavaScript. In this section we will travel\
    \ around the DOM with five new methods:\n\n+   - own\n- previousSibling\n- nextSibling\n\
    - firstChild\n- lastChild"
