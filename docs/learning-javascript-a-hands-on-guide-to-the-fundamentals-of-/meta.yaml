    # Support


    This is one of those things that where you expect it to work. What do I mean by
    that? Many of the HTML5 features, especially the JavaScript APIs, don''t have
    great support in older browsers, so earlier than IE 8 (IE 6 and 7) and earlier
    than Firefox 3.6 is generally a good bottleneck; this is a lot of new features
    to start with. This is something to keep in mind as you''re developing. Let''s
    take a look at Table 4.2 for the support of this feature.


    # Table 4.2 Browser Support for querySelector and querySelectorAll


    | Internet Explorer | 8.0 & up |

    | Firefox | 3.5 & up |

    | Chrome | 1 & up |

    | Opera | 10 & up |

    | Safari | 3.2 & up |


    Because selectors are such an important part of your JavaScript code, it''s always
    important that they function the way you want to. For things like querySelector()
    you need to check out your own browser statistics and decide if it''s something
    you can safely use. That same old story—we need to start moving off old browsers,
    which can, unfortunately take some time.


    Just like any of selectors that require a small support boost, libraries are available
    to help you detect for feature support and use an appropriate method based on
    those results. These support solutions fall under the same category as the previously
    mentioned getElementsByClassName() method. When using a JavaScript library, you
    won''t know for which method is being used because the library will figure out
    for you; but it is important to know that they exist options.


