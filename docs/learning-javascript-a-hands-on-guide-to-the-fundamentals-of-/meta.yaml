    \ value available\n  return fairness;\n}\n```\n\nListing 9.7.1 shows a cleaned-up\
    \ example of the same pizzaParty() function with better whitespace, creating more\
    \ readable and maintainable code.\n\n# Listing 9.7.1 Code with Better Whitespace\n\
    \n```\n/* determine how many slices of pizza each person can eat */\nfunction\
    \ pizzaParty(totalSlices, personCount) {\n  use strict;\n\n  // take the arguments\
    \ and decide how many pieces per person is fair\n  var fairness = totalSlices\
    \ / personCount;\n\n  // make the fairness value available\n  return fairness;\n\
    }\n```\n\nWhen you combine file concatenation with minification, you can develop\
