    # if versus switch


    Besides syntax there is one major difference in how an/else statement functions
    compared to a switch statement. First, the else in an if/else isn''t required;
    you can just run an if statement like we did in Listing 6.5.3. In a switch statement,
    the default option is required.


    The iteration mechanism is also different. In the if/else statement in Listing
    6.5.4, it still runs the same process over each item in the JSON object. For example,
    the first person listed is “Hillisha,” when the conditional statement is executed
    on that item, it asks three questions:


    +   * Does this name equal “hillisha?” – true

    * Does this name equal “paul?” – false, “hillisha”

    * Does it equal something else – false


    Even if the first condition is true, the statement continues against the other
    conditions. If you have a lot of conditions, this can be very resource intensive.
    This is where the switch statement really shines.


    In the switch statement, after a condition is found to be true, it breaks out
    of the cases there are no more checks. In the switch statement in Listing 6.5.5,
    the second condition of looking for the name “paul” would look something like
    this:


    +   * Does this name equal “paul?” – false, “hillisha”

    * Does this name equal “paul?” – true, found it!

    * Stop asking questions you know the answer.


    Many people like using if/else because it feels more natural, but after you get
    to a certain conditional count, you should consider moving over to the switch
    statement for little better performance in your JavaScript.'
