  md: '# Storing Chunks of Data with JSON


    Web storage currently can take only strings for data. This can be problematic
    when you need to store multiple items. You can get around this limitation by storing
    your data in a JSON object and then using the JSON.stringify method to convert
    the entire object to a string that can be stored using Web storage.


    Listing 5.16 shows how you might take the favoriteSandwiches JSON object that
    was created in Listing 5.14 and save it locally with Web storage.


    # Listing 5.16 Using JSON.stringify to Store Data


    ```

    / stringify the JSON object first */

    var setObject = JSON.stringify(favoriteSandwiches);


    /* add the string object to localStorage */

    localStorage.setItem("favoriteSandwiches", stringObject);

    ```


    Because this JSON object is now a string, and the individual items in the object
    can''t be accessed efficiently, when you access this item it needs to be reconverted
    from a string, back into a JSON object. Listing 5.16.1 shows you how to use JSON.parse
    to convert the string back into a workable JSON format.


    # Listing 5.16.1 Using JSON.parse to Get Data


    ```

    /* get the locally stored data */

    var storedItem = localStorage.getItem("favoriteSandwiches");


    /* convert it from a string, back into a JSON object */

    var convertView = JSON.parse(storedItem);


    /* prove it worked */

    alert(convertObject.breakfast[0].name); // Egg, Sausage and Cheese

    ```


    You can see that the returned value in Listing 5.16.1 is the same value as the
    first breakfast sandwich in the main array, but it is now pulled from Web storage
    rather than from the original array.


    > Support

    Because this type of storage is new with HTML5, you have to be concerned with
    the support levels within your target audience. If you''re targeting only high-end
    devices and browsers, it''s probably not an issue, but for the rest of it is important
    to be aware of. Table 5.1 shows the browser support for HTML5 Web storage in the
    popular browsers.'
