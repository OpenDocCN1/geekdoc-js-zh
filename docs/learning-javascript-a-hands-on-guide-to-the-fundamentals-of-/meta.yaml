    \ but really, why would I even bother bringing it up if it's so bad? it's a method\
    \ that's out there, and it's actually extremely easy to use and pretty helpful.\
    \ Unfortunately, the small upside of using eval() is dwarfed by the enormous downside.\n\
    \nBecause of eval()'s core functionality of evaluating and executing any string\
    \ that is passed into it as an argument, this makes the method extremely insecure\
    \ and very likely one of the largest holes in the entire language. By passing\
    \ strings into the method, we are basically saying, “Do whatever you like here.”\
    \ Because of that, consuming third-party scripts can leave you extremely vulnerable\
    \ to injection hacks.\n\nSecurity is the most obvious problem with using eval(),\
    \ it can also make debugging your script more difficult because it will not report\
    \ proper errors and line numbers. You're much better off using some of the eval()\
