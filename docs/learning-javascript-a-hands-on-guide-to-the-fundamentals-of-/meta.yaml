    \ jQuery's ready() method and how you would attach it to the document.\n\n```\n\
    10.2.1 jQuery.document.ready\n$(document).ready(function () {\n\n  // close document.\n\
    \n});\n```\n\nYou probably noticed in Listing 10.2.1 that we're not using a normal\
    \ method of attaching a method to the document we would do something like document.getElementById().\
    \ There's a dollar sign ($) and parentheses surrounding the document declaration.\
    \ This is your first introduction to a jQuery selector. By wrapping document with\
    \ ($), we are saying, \"Hey, I want to use a jQuery method on this element.\"\
    \ This is the pattern you will consistently be using in jQuery. You will be very\
    \ familiar with the selector as you dive deeper and deeper into the library.\n\
    \n# Selectors\n\nA large barrier of entry for the design community with JavaScript\
    \ was the nonintuitive way to attach methods to elements in the DOM. jQuery solved\
    \ this with the Sizzle engine, which allows you to use CSS syntax to select elements\
    \ in the DOM. Sizzle was added shortly after the initial release of jQuery and\
    \ explained in the Web design world when designers finally understood how to create\
    \ simple cross-browser compatible commands in JavaScript without soliciting help\
    \ from a developer.\n\nAs mentioned previously, the jQuery selector centers around\
    \ the dollar sign ($). The dollar sign is used to signify jQuery code and activate\
    \ the selector. Wrapping ($ around any CSS selector will select that element (or\
    \ group of elements).\n\nListing 10.2 shows three ways to get an element by its\
    \ ID value. The first two should look familiar, because we have covered them earlier\
    \ in this book; they are native to JavaScript. The third item is how you would\
    \ accomplish the same thing using jQuery. jQuery has shortcuts to almost everything,\
    \ and this is the first step: jQuery's way to select an element by 1D."
