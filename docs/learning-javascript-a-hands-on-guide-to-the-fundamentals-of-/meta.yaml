  md: "# The DOM Tree\n\nEvery document has some kind of structure behind it, whether\
    \ it's a chapter of this book, a flier for a yard sale, a newspaper, or an HTML\
    \ document. In this case, we'll obviously talking about an HTML document, but\
    \ the principle is true for most things we create.\n\nThe DOM starts with the\
    \ Web browser. When you visit a website, the browser renders the HTML into a document,\
    \ reads through the elements, and displays them to the user in the correct format.\
    \ This process creates the initial model for the document, and it gets stored\
    \ so we don't have to do all work again to access each individual element (we\
    \ just reference what the browser already has stored for the most part).\n\nConsider\
    \ the HTML structure shown in Listing 4.1.\n\nListing 4.1 Basic HTML Structure\
    \ to Illustrate the DOM\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
    utf-8\">\n  <title>Basic DOM example</title>\n</head>\n<body>\n  <h1>Hello World!</h1>\n\
    \  <p>While this is a<strong>very basic HTML document</strong>, it actually serves\
    \ as a detailed example of the document object model.</p>\n</body>\n</html>\n\
    ```\n\nAt first glance this may look like an extremely basic example of an HTML\
    \ document, and it is, but it's also a pretty good representation of all the items\
    \ we have to deal with the DOM.\n\nThe DOM is made of items called nodes, which\
    \ can have parents, children, and siblings (like a family), and this determines\
    \ its position in the tree. Children underneath parents and siblings are at the\
    \ same level as other siblings (brothers and sisters, if you will). Let's take\
    \ a look at the DOM translation of this HTML document in Figure 4.1.\n\nIn Figure\
    \ 4.1, you can see how we create a parent-child relationship in the DOM by moving\
    \ from the top of the document all to the bottom as nodes to create a pseudo-hierarchy\
    \ in the diagram. I say \"pseudo\" because as we approach the bottom of the document\
    \ branches branch off into different kinds of nodes that are represented by the\
    \ circles that may technically be at the same level as others but are not considered\
    \ to be relevant in the parent-child relationship to each other.\n\nAs you may\
    \ guessed, there are indeed different types of things we call nodes in the DOM.\
    \ Nodes that represent HTML elements are element nodes, ones that represent text\
    \ are called text nodes and last are attribute nodes, represent you guessed, it\
    \ attributes. All nodes are also children of the overall parent document node,\
    \ represented at the top of Figure"
  merge: -1
  pgno: 79
- img_proc: false
  md: '# The DOM Tree 59


    ![](bbox=[0.105, 0.095, 0.843, 0.526])


    Figure 4.1 A graphical representation of the Document Object Model (DOM)


    4.1. It''s important to know the difference between these types of nodes because
    we access them differently when traveling throughout the DOM with JavaScript.


    > Note

    The document is extremely important and often overlooked when building out the
    DOM''s graphical representation. As you will learn later, whenever we want to
    access a node in the document, we first have to pass through the document node
    before we can step down the tree and start any sort of interaction.


    # Element Nodes


    Element nodes will occupy the majority of your document and are the basis for
    how you will move around (we''ll get to that in a bit). These nodes will define
    your structure and hold most of the data and content you will want to interact
    with and modify. The element nodes occupy most of the document and create the
    tree-like structure you see in Figure 4.1. Let''s take a look at our element nodes
    highlighted in Figure 4.2.'
