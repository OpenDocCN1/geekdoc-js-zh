  md: 'We talked about basic functions, anonymous functions, callback functions, and
    functions in objects, along with how to get your functions working together by
    returning and passing data to one another, returning both single and multiple
    values.


    Before this chapter, we were accessing items directly when working with data.
    This chapter showed how to execute the same code over and over for each data item
    in the form of a loop. We learned the for loop specifically and talked about performance
    considerations and why the loop is assembled in the way it is.


    After loops, we got into conditionals in the form of if/else switch statements.
    They appear similar on the surface, but we also talked about why they''re different
    and the scenarios where you may want to use one style over the other.


    This chapter was the first step in building a real JavaScript application (an
    address book). In the next chapter, we start to bring users into the mix when
    we talk about events, and how we might apply user interactions to this application,
    and learn some general information about events in JavaScript.


    # Exercises


    +   1. Why is it best to position all variables at the top of your JavaScript
    file?

    2. Why are some words reserved in JavaScript?

    3. How are anonymous functions different from basic functions?'
