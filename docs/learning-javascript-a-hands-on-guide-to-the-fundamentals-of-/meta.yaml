    Current client-side data storage methods can range from simple variables reference
    within your JavaScript files all the way to databases stored locally in the browser.
    Storing an entire database in the browser is cutting edge of anything, but the
    capabilities of storage in JavaScript are constantly growing and pushing the limits
    to just how fast and responsive you can make an application.


    # How You Should Use JavaScript


    As mentioned before, JavaScript is a dynamic language, and you can do almost anything
    with it. You can do a lot of good, but you can also do a lot of bad. It''s very
    easy to get lost in your JavaScript code. Just because JavaScript can modify HTML
    and control CSS doesn''t mean it should be done. Remember the enhancement layers?
    It is important to stick to those layers as much as you can. There will naturally
    some overlap as you go along. Maybe you will inject an HTML snippet into the document.
    From time to time you will naturally run into things like that, but make sure
    you''re not just doing because you have the JavaScript file open at the time.
    Everything in your codebase should have meaning.


    A good check for yourself is to turn off JavaScript in the browser now and then
    see if, as a user, you can accomplish all your goals. If you can, great—but if
    you can''t, something went wrong along the way and you should take a step back
    to examine where the problem happened. Were you relying too much on JavaScript
    to create your content? Or it be just an oversight. Either way, it is good to
    build some checkpoints in your development and design process to ensure that you
    are not straying away from the goals of the project and that you are always keeping
    user experience in mind.


    # Improving User Experience


    Most of what JavaScript does (or how we''ll be using it, at least) is to improve
    user experience through the behavior layer. We''ll be extending what already exists
    and adding pop to it. Adding behavior to a site or application, making it more
    responsive with things like Ajax, creating local data stores to improve performance,
    and cutting down on lag time between user generated requests (the user clicking
    around) can make or break a project.


    Everything you do with JavaScript should guide user experience, and as you go
    through this book, a path to properly using this powerful language will be exposed.


    # Using JavaScript Responsibly


    Using JavaScript responsibly involves knowing the difference between when you
    need JavaScript and when to use CSS. As mentioned earlier, JavaScript is a performance
    hog.'
