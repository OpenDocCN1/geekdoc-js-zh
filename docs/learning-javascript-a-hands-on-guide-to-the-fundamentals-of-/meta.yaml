  md: '# join


    The join method is a way to combine all the items in an array quickly with a certain
    term or separator. You may have noticed in Listing 5.11 when we alerted the breakfast
    array, it came out in a comma-separated list without spaces. That is the default
    output of an array, but it is still technically an array at that point. If you
    were going to output the contents of array somewhere, you would want to clean
    it up a little, add some spacing, and maybe not even use a comma.


    The join method will convert all items in an array to a string and output them
    in a format you specify. In Listing 5.12 you can see that we''re working with
    the same-based sandwich arrays we have been using throughout the chapter.


    Join takes one parameter, which is the string value you want to output in each
    array item. In this case it is “ plus “. The result will be [array item], plus
    [array item], plus [array item].


    # Listing 5.12 Using join on an Array


    ```

    /* define the sandwich arrays */

    var breakfast = {"Egg, Sausage and Cheese", "Egg Whites on Flatbread", "Egg and
    Cheese"};

    var lunch = {"Turkey Club", "Grilled Cheese", "Peanut Butter and Jelly"};

    var dinner = {"Meatball", "Hamburger", "Oatmeal and banana on Rye"};


    /* clean up breakfast for output */

    var joinBreakfast = breakfast.join(plus, " "); // separate them with a comma,
    spaces and the word "plus"


    /* alert it */

    alert(''join:'', '' '' + joinBreakfast);

    ```


    # slice


    slice has the capability to output a range of items in an array. For example,
    if you want to output items 1 through 4 and leave out anything higher than 5,
    that is a range of values you can target with slice. In Listing 5.12.1 we''re
    accessing the lunch array and outputting values 1 & 2 (Grilled Cheese, Peanut
    Butter and Jelly) and joining them with an ampersand (&). The slice method takes
    two parameters, the first is your starting position and the second is your ending
    position in the array. The start parameter is required, is optional. If it''s
    omitted, the slice will just continue to the end of the array.'
