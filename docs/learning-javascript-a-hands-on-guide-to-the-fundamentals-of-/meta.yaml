  md: "# Final Words on Progressive Enhancement\n\nWhen building in a touch-based\
    \ environment, you lose elements like normal drag and drop or\nover, and you gain\
    \ access to interface delights such as pinch-zoom and swiping/gestures. If\nyou\
    \ focus on these features rather than the device, you can maintain the layer's\
    \ structure and\nplan for these behaviors to be active. 1.1.10 illustrates how\
    \ to detect touch capabili-\nn in a site. This is something that will be in your\
    \ external JavaScript file.\n\nListing 1.1.10 Using Touch-based JavaScript\n\n\
    ```\nif(\"ontouchstart\" in window){\n\n  /* do something for touch devices */\n\
    \  alert(\"You have a touch device!\");\n\n}\n```\n\nWith this bit of JavaScript,\
    \ you can conditionally load features into an interface that speci-\ncally how\
    \ users have access to the gestures and other features like touch activation.\n\
    \nCombining all these features and maintaining the guiding principles before progressive\n\
    enancement will open up opportunities for you to create high-end, high-performance,\n\
    extextremely maintainable websites and applications. It's not to say that there\
    \ won't be challenges\nalong the way, and many times you'll want to divert away\
    \ from full-on progressive enhance-\nment, if you stay the course, you'll be much\
    \ happier later when you have an applic-\ntion built on a single HTML base that\
    \ has the capability of being deployed on an endless\namount of platforms both\
    \ current and in the future.\n\n# Final Words on Progressive Enhancement\n\nWe\
    \ talked about a lot of new items in this chapter that you may not fully understand\
    \ at this\npoint--specific functions, variables, and event listeners in JavaScript.\
    \ But that's okay. The\nmost important thing to take away from this chapter is\
    \ not the code samples; it's the overall\nconcept of progressive enhancement,\
