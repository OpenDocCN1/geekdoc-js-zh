  md: 'expect. Using progressive enhancement will certainly improve workflow. In Figure
    1.2 you can see a clean and meaningful directory structure.


    ![](bbox=[0.357, 0.153, 0.642, 0.263])


    Figure 1.2 A beautiful and organized file structure


    Some of the more obvious benefits in using this method are performance and scalability.
    Let''s talk about those a little bit before you move on to some more intense JavaScript.


    # Performance


    By externally linking your CSS and JavaScript files, you are allowing the browser
    to cache them in memory for each user. What does this mean? When someone accesses
    your home page, many of the assets saved so the user doesn''t have to download
    them. This betters the performance of your site from a user perspective. If all
    the JavaScript for the entire site gets downloaded at the first visit to a site
    or application, as the user navigates around, there is no need to download asset
    again, hence speeding up the load time for the site and minimizing HTTP requests.
    The same rules apply for CSS. All the user needs to download all the assets are
    cached in the new, clean HTML you build for the internal pages. Because no inline
    CSS or JavaScript is in there, it is extremely fast to download.


    # Building for the Future


    There are two types of scaling in progressive enhancement:


    +   - Adding features

    - Scaling to grow for the future (we''re talking about mobile here)


    Adding features to a website or changing the design of a site that has already
    been built with progressive enhancement can be as easy as cracking open the appropriate
    layer, making your enhancements and getting out of it. It also helps working on
    a team where one person can work on the JavaScript while another is playing with
    the CSS and design. Team members can work independently and ensure that all the
    work fits in the end.


    Scaling a small screen interface to grow for the future is a little further out
    there in terms of concepts related to progressive enhancement, but stay with me
    here. Listing 1.1.9 contains a CSS media query, and it goes at the bottom of your
    CSS file.'
