  md: "# Chapter 4 Accessing the DOM\n\nListing 4.7 HTML Example to Illustrate Changing\
    \ Content\n\n```\n<body>\n<div id=\"target-area\">\n  <p>This is our text.</p>\n\
    </div>\n</body>\n```\n\nIn this example, we want to target the text node and change\
    \ it to “hello world”. This content could come from anywhere, such as an Ajax\
    \ call, or it can be hard-coded in, like in the example from Listing 4.7.1.\n\n\
    Listing 4.7.1 Using innerHTML\n\n```\n// targeting the text node\ndocument.getElementById(\"\
    target-area\").innerHTML;\n\n// changing the content in the text node — you can\
    \ jump straight to this.\ndocument.getElementById(\"target-area\").innerHTML =\
    \ \"<p>hello world</p>\";\n```\n\n# Moving Around the DOM\n\nWhen moving around\
    \ inside the DOM, we start to really use the tree structure of the DOM and benefit\
