  md: "# Chapter 8 Communicating with the Server Through Ajax\n\nThe request in Listing\
    \ 8.3.2 would produce the same data as if you were to visit the URL\nsearch.php?searchterm=hill,\
    \ a normal search results page. In our example we are doing the\nsearch processing\
    \ with JavaScript, because this is a JavaScript book.\n\n# Receiving Data Back\
    \ from the Server\n\nAfter the request is sent, the call will return from the\
    \ server, hopefully with the data you\nrequested. As I mentioned little earlier\
    \ in the chapter, Ajax opens up a new property called\nreadystate, which is tied\
    \ to an event called readystatechange, which constantly monitors\nthe progress\
    \ of every Ajax call and reports back to you so you know when the data is available\n\
    parse.\n\n# readyState\n\nreadyState is the property in an Ajax call that reports\
    \ the status that corresponds with a\ncheckpoint in the processing of that Ajax\
    \ call. Five values get reported:\n\n+   - 0 – The open method hasn’t been called\
    \ (uninitialized)\n- 1 – The open method has been called, but the send method\
    \ has not (loading)\n- 2 – The send method has been called and the request is\
    \ being sent (loaded)\n- 3 – The response has started to come back (interacting)\n\
    - 4 – The request is complete (complete)\n\nEach time a readyState value changes,\
    \ the readystatechange event is triggered. Knowing\nthis, you can attach an event\
    \ handler to this new event and wait for the “4” status to be\nreached before\
    \ executing something on the returned data.\n\nIt is possible to listen for each\
    \ step in the process if you want to provide very detailed feedback\nto the user,\
    \ but generally speaking, it’s easier to wait for the request to complete by looking\
    \ for\nt“complete” value.\n\nIn Listing 8.4 we can see our Ajax object followed\
    \ by the event handler for\nonreadystatechange, and then an if statement checking\
    \ the readyState value. Not so\ntough? It looks like a normal function. And it\
    \ is just a function with an if statement.\n\n# Listing 8.4 Checking the Ajax\
    \ Request State\n\n```\nvar request = getHTTPObject();\n\nrequest.onreadystatechange\
    \ = function(){\n  // check if the request is ready\n  if(request.readyState ===\
    \ 4) {\n    // do something\n  }\n}\n```"
  merge: -1
