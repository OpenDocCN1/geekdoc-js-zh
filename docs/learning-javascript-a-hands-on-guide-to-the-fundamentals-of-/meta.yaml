  md: '# About the Author


    Tim Wright has been a Web designer and front-end developer since 2004, primarily
    focusing on CSS, HTML5, accessibility, user experience, and building applications
    with the capability to scale seamlessly from desktop to mobile device. He has
    worked at various universities nationwide and fostered the advancement of Web
    standards at each stop along the way. Tim has written many articles for popular
    Web design online publications, such as Smashing Magazine, SitePoint, and Web
    Designer Depot, on all facets of front-end development from HTML5 and CSS3 to
    user experience and advanced JavaScript techniques. He also writes many articles
    via his personal blog at csskarma.com. Tim holds a Bachelor’s Degree In Marketing
    Management from Virginia Tech, with a specialization in Graphic Design.'
