  md: "# Listing 8.1.1 If Statement to Check for Support of the XMLHttpRequest\n\n\
    ```\nif ( window.XMLHttpRequest ) { // check for support\n\n    // if it's supported,\
    \ use it because it's better\n    xhr = new XMLHttpRequest();\n\n} else if ( window.ActiveObject\
    \ ) { // check for the IE 6 version\n\n    // save it to the xhr variable\n  \
    \  xhr = new ActiveXObject(\"Msxml12.XMLHttpRequest\");\n\n}\n```\n\nBecause this\
    \ is a very common bit of functionality with any Ajax call and will be reused\
    \ over and, it is best to save it to a function. You will find similar functions\
    \ all over the Web with XMLHttpRequest feature detection.\n\nThe goal of this\
    \ function is to detect the correct Ajax object and return it for use wherever\
    \ you need it. Because this is a function that passes information into another\
    \ function, the first step is to initialize the variable, run the normal if statement\
    \ and return the variable so it can be passed into another object(). In Listing\
    \ 8.1.2 you can see the complete function getHTTPObject() and the return value\
    \ of xhr at the end.\n\n# Listing 8.1.2 Function to Return the Correct Ajax Object\n\
    \n```\nfunction getHTTPObject() {\n\n    // initialize the variable\n    var xhr;\n\
    \n    if (window.XMLHttpRequest) { // check for support\n\n        // if it's\
    \ supported, use it because it's better\n        xhr = new XMLHttpRequest();\n\
    \n    } else if (window.ActiveObject) { // check for the IE 6 Ajax\n\n       \
    \ // save it to the xhr variable\n        xhr = new ActiveXObject(\"Msxml12.XMLHttpRequest\"\
    );\n\n}\n    // spit out the correct one so we can use it\n    return xhr;\n}\n\
    ```"
