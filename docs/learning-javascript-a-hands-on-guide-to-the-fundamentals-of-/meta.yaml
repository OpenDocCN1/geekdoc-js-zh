    \ this point you've been creating that do something tangible, usually alerting\
    \ a piece of data into the browser. You won't always want to do that, from time\
    \ to time you will create a function that returns information for another function\
    \ to use. This will make your functions a little smaller, and if the function\
    \ that gathers information is general enough, you can reuse it to pass the same\
    \ (or different) information into multiple functions.\n\nBeing able to return\
    \ data and pass it into another function is a powerful feature of JavaScript.\n\
    \n# Returning a Single Value\n\nGoing back to the sayHello() function that was\
    \ previously executed in Listing 6.2, we're going to remove the alert() action\
    \ that was previously executed when the function was called, and we'll replace\
    \ it with a return statement. This is depicted in Listing 6.3.3.\n\n# Listing\
    \ 6.3.3 Returning Data with a Function\n\n```\nfunction sayHello(message){\n \
