    # Global Variables


    Another kind of variable you may come across is a global variable. Global variables
    are well named because they can be used globally throughout your JavaScript. They
    can be defined three different ways:


    +   - Defining them with "var" outside a function

    - Adding something directly to the window object

    - Defining them anywhere without using "var"


    Something to consider when using global variables is to keep track of the names
    so you don''t have any duplicates. This is especially important when using a large
    amount of JavaScript to prevent naming collisions. Listing 3.2.1 shows you how
    to set up global variables. Use them sparsely.


    # Listing 3.2.1 An Empty Global Variable


    ```

    /* with outside a function */

    var titleOfApplication;


    /* attached to the window object */

    window.titleOfApplication;


    /* global from inside a function */

    titleOfApplication;

    ```


    Global variables like this are generally used for things you know for a fact will
    never change or something that needs to be filtered through an entire JavaScript
    file, like a directory URL or a special prefix you may be using. They can be handy
    on smaller projects but quickly become difficult to work with as an application
    grows larger, so be sure to use them sparsely.'
