    querySelector() is an extremely flexible and powerful method in the JavaScript
    language. It can take multiple selectors, IDs, classes, attributes, and even advanced
    CSS pseudo classes to target elements. The only complaint about this time means
    new methods is that the error messages are not very helpful, but hopefully this
