  md: "# Chapter 6 Variables, Functions, and Loops\n\n```\n\"name\": \"vishaal\",\n\
    \"email\": \"vish@example.com\",\n{\n  \"name\": \"mike\",\n  \"email\": \"grady@example.com\"\
