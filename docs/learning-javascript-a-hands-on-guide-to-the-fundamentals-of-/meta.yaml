- img_proc: false
  md: "By checking the readyState value like this, you can be sure you're not executing\
    \ code before you have data available to parse.\n\n# Server Status\n\nThe readstate\
    \ property is great, but it only tells you what the step-by-step process of an\
    \ Ajax call is. It doesn't give you any information on whether the request was\
    \ successful.\nThe Ajax object also returns a property called status, which correlates\
    \ to the server status codes you would normally find on a Web server, like 404,\
    \ 200, 304, 500, and so on. An Ajax call can, in theory, go go out to the server\
    \ and successfully come back, but encounter some sort of failure on the server\
    \ that prevented the data from being returned. Some of the more common codes you\
    \ can check for\n\n+   - 404 - Page not found\n- 304 - Not modified\n- 500 - Internal\
    \ server error\n- 200 - All is on the server\n\nYou can write conditional code\
    \ for each of these statuses, but for our purposes, we are going to focus on the\
    \ success status of 200 and combine with our readyState of 4.\nIn Listing 8.4.1\
    \ you can see the addition to the if statement, which now not only checks for\
    \ a complete Ajax call, but also for a successful server status code to be returned.\n\
    \n# Listing 8.4.1 Checking the Server Status\n\n```\nvar request = getHTTPObject();\n\
    \nrequest.onreadystatechange = function() {\n// check if the request is ready\
    \ and that it was successful\nif(request.readyState === 4 && request.status ===\
    \ 200 ) {\n    // do something\n}\n}\n\n/* Get all the information ready to go\
    \ */\nrequest.open(\"GET\", \"data/contacts.json\", true);\n\n/* make the actual\
    \ call */\nrequest.send(null);\n```"
