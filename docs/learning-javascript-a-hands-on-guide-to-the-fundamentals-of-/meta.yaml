  md: "Listing 7.4.1 shows the JSON object created to hold contact information. It\
    \ is the same object from previous chapters, but you should feel free to add some\
    \ new people to freshen things up.\n\n# Listing 7.4.1 Address Book Data\n\n```\n\
    var contacts = {\n  \"addressBook\": [\n    {\n      \"name\": \"hillisha\",\n\
    \      \"email\": \"hill@example.com\",\n    },\n    {\n      \"name\": \"paul\"\
    ,\n      \"email\": \"cleveland@example.com\",\n    },\n    {\n      \"name\"\
    : \"vishaal\",\n      \"email\": \"vish@example.com\",\n    },\n    {\n      \"\
    name\": \"mike\",\n      \"email\": \"grady@example.com\",\n    },\n    {\n  \
    \    \"name\": \"jamie\",\n      \"email\": \"dusted@example.com\",\n    }\n \
    \ ]\n};\n```\n\nclick is the most common of all the native events you will encounter.\
    \ It can be applied to any element. You want to ensure that the element you're\
    \ binding a click event to is indeed a clickable element. There are two ways to\
    \ tell if an element clickable. The first is to turn off all CSS and JavaScript\
    \ in the browser and click it; if something happens, you have a clickable element.\
    \ If not, you don't. The second is to tab through an interface and press Enter/Return\
    \ when you get to that element. You will notice in your address book form you\
    \ will be able to tab through the interface and press your Return/Enter key to\
    \ submit the form.\n\nA lot of elements are clickable. A heading (#1), for example,\
    \ is technically clickable, but because you can't execute click with anything\
    \ but a mouse (you can't tab to it and press Return/Enter), you should not attach\
    \ a click event to it no matter how easy it would be."
