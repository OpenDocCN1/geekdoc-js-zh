    }\n;\n```\n\n# for Loop\n\nThere are few different types of loops in JavaScript,\
    \ a while loop, a do-while loop, and a for loop. Most of them are perfectly fine;\
    \ I would avoid the foreach loop because it's known to be a performance hog, but\
    \ the others are fine. A while loop and a for loop are basically the same thing,\
    \ but the for loop is a little more direct, to the point, and it's the most common\
    \ kind of loop you're going to find in the wild. In all the years I've written\
    \ JavaScript, it's been 99% of loops. With in mind, we're going to go over the\
    \ for loop in this book.\n\nListing 6.5.1 will show you a basic for loop, and\
    \ then we'll go over what's happening.\n\n```\nListing 6.5.1 A for Loop Integrating\
    \ Address Book Data\n/* cache some initial variables */\nvar object = contacts.addressBook,\n\
    contactsCount = object.length,\ni;\n\n/* loop through each JSON object until you\
