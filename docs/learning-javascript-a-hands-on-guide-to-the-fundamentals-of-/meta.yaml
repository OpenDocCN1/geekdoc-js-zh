  md: "170 Chapter 8 Communicating with the Server Through Ajax\n\n# Listing 8.10\
    \ ARIA Accessibility for the Contacts Ajax Output Area\n\n```\n<!-- adding aria\
    \ to the HTML output --\n<div id=\"output\" aria-atomic=\"true\" aria-live=\"\
    polite\" aria-relevant=\"additions\n    removals\"></div><!--/output-->\n```\n\
    \nUsing Aria like this will ensure that your application is accessible to disabled\
    \ users as it is to nondis users. As designers and developers, there isn't a whole\
    \ lot we can do to help our disabled audience, so it's always nice to do little\
    \ things like that that can go a long way to improve the overall experience.\n\
    \n# Common Ajax Mistakes\n\nThe number one mistake developers make with Ajax is\
    \ using it because they think it's cool. Ajax is not always the answer. In fact,\
    \ it is often not the answer at all. Use it responsibly and with caution; there\
    \ is nothing worse trying to debug an application that piles up its Ajax calls\
    \ if they are in a ball of yarn.\n\nIn most-browser problems can be traced back\
    \ to a JavaScript or an Ajax origin, and you will avoid a lot of headaches if\
    \ you put serious up-front thought into whether you need to or even use Ajax to\
    \ accomplish a certain goal.\n\n# Providing Feedback\n\nAt this point in our application,\
    \ there isn't any indication to the user that we are fetching data to be pulled\
    \ in, and it's really much of a problem because the data is so close and small\
    \ that the Ajax call executes and completes almost immediately. This won't always\
    \ be the case. Sometimes the server will be sluggish, the data will be large,\
    \ or the Internet connection will slow to a crawl. Because of this, it's best\
    \ practice to provide feedback to the user while the Ajax call is traveling back\
    \ and forth from the server.\n\nWe've seen those spinning windmills and loading\
    \ messages in the browser while a request is happening in the background. These\
    \ messages can go a long way in creating a better user experience. If users trigger\
    \ an Ajax call and nothing happens the request is lagging, they may think something\
    \ is broken and leave the page. A simple message of \"loading...\" can let them\
    \ know something is going on, and they should stick around.\n\nListing 8.10 depicts\
    \ the ajaxCall() function and how we might output a loading message (see the bold\
    \ text). This function is now also taking a third argument to define a region\
    \ to place the loading message. We will also use the same region to output the\
    \ actual content so the loading message is removed when the data is returned."
