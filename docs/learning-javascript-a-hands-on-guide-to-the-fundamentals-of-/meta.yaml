- img_proc: false
  md: 'Ajax History 151


    # Server Communication


    Server communication is at the core of the Ajax technology. The goal has always
    been to be able to send and receive information from the client to the server
    and create a better user experience in the process. Until Ajax came along, all
    server communication happened on the server, and redrawing portions of a page
    required either an iframe (iframes are awful) or a full-page refresh. Neither
    method provided what I would call a good user experience.


    Ajax offers us two types of server communication:


    +   * Synchronous

    * Asynchronous


    # Synchronous


    Synchronous Ajax is not very common, but it is perfectly valid. You probably won''t
    use it, just in case you hit a situation where you need to, it''s good to know
    what it is.


    Synchronous Ajax means that the Ajax call happens at the same time as all the
    other requests in your application. There are positives and negatives to this.
    Making your Ajax calls synchronous will block the download of other assets until
    the request completes, which can create a weird user experience of some extra-heavy
    lifting that needs to happen before a page is completely rendered in the browser.
    Many people skip the synchronous Ajax model and parse the data server-side. This
    is why it''s not often used. Generally, if you can process on the server, it will
    be significantly faster than on the client, and you should take advantage of that.


    On a positive note, you can find a way around the slowness, using synchronous
    Ajax calls opens up the opportunity to store Ajax data into an object and play
    around with the timing of certain functions being executed. If an Ajax call is
    processing something critical for the user to the point that you need to block
    them from doing something while the request is going on, a synchronous Ajax call
    may be what you need.


    # Asynchronous


    Asynchronous Ajax is much more common. You''ll probably use this 99 out of 100
    times you write an Ajax call. (Yes, you''ll write many Ajax calls.) Asynchronous
    means that the Ajax is not firing at the same time as everything else; it''s fairly
    independent and separated from the rest of the assets in a page or Web application.
    These Ajax interactions happen behind the scenes and don''t really block anything
    from downloading. Even if you''re executing an Ajax call with the onload event,
    the timing of that is slightly slower after the normal page load. Asynchronous
    calls can happen at any point and be triggered by any event (click, focus, blur,
    touchstart, and so on). The point of them is that they don''t happen in one large
    chunk bundled together with the rest of the HTTP requests on a page.


    Using asynchronous removes the blocking nature of the synchronous call because
    the user can continue to interact with the page in other ways while the request
    is being processed.'
