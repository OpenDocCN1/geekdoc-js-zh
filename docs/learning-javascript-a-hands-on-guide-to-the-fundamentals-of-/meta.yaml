  md: "# Mouse and Keyboard Events\n\nAll the event examples in the chapter have been\
    \ based on the click event, so I won't spend a lot of time rehashing the same\
    \ information. We can jump right into the address book application you've been\
    \ building. This functionality is going to be tied to the Get All Contacts button.\
    \ You can probably guess what we're going to build.\n\nIn Listing 7.4.2 the first\
    \ step is to define an object to hold all our methods (aka functions). We're going\
    \ to call it \"adr\" and the first method will be \"getAllContacts\". Inside that\
    \ method will be the function loop you defined in the previous chapter to parse\
    \ through all the JSON object and output it in the page.\n\n# Listing 7.4.2 Method\
    \ to Get All Contacts from JSON Object\n\n```\n/* define the adr object to hold\
    \ your methods (aka functions) */\nvar adr = {\n    getAllContacts : function()\
    \ {\n        /* save the DOM element we're putting the output in */\n        var\
    \ target = document.getElementById(\"output\");\n\n        /* save the contacts\
    \ JSON object to a variable */\n        var book = contacts.addressBook;\n\n \
    \       /* save the length to a variable outside the loop for performance */\n\
    \        var count = book.length;\n\n        /* ready the loop! */\n        var\
    \ i;\n\n        /* clear the contents of #output just in case there's something\
    \ in there */\n        target.innerHTML = \"\";\n\n        /* as usual, check\
    \ the count before looping */\n        if(count > 0) {\n            /* loop through\
    \ the contacts * */\n            for(i = 0; i < count; i = i + 1) {\n        \
    \        var obj = book[i];\n                target.innerHTML += '<p>' + obj.name\
    \ + ', <a href=\"mailto:\" + obj.email + \">' + obj.email + '</a><p>';\n     \
    \       } // end loop\n        } // end count\n    } // end method\n}\n```"
