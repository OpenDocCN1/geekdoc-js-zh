  md: 'Using these methods will help you travel around your HTML document without
    having to riddle it with markup, IDs, and classes, while keeping performance at
    a manageable level. However, always evaluate the load time of a page and balance
    it with best practices you''d like to follow. In other words, moving up and down
    the DOM tree is resource intensive for any particular case, you may want to consider
    adding a class or ID to jump to. (I, sorry to be like that, but performance is
    always a gray area—use your best judgment.)


    # Accessing First and Last Child


    JavaScript Scripts offer us alternative routes to get node information; for example,
    moving straight to the first or last item in a NodeList. This is sort of the jumping
    down we do with getById and getElementsByTagName, but like parentNode and childNodes,
    they''re at the NodeList level. So, you would target down to the NodeList and
    dive in from there compared to doing it from the document level. But enough of
    that. Let''s dive into our HTML example from Listing 4.8 and add classes to the
    first and last items in our navigation with the JavaScript from Listing 4.8.


    Listing 4.8.4 Adding a Class to the First and Last Items in Our Nav


    ```

    // travel the first node and add the class

    document.getElementById("nav").firstChild.setAttribute("class", "first");


    // travel to the last node and add the class

    document.getElementById("nav").lastChild.setAttribute("class", "last");

    ```


    And that will generate the HTML in Listing 4.8.5.


    Listing 4.8.5 Generate HTML After Adding Classes


    ```

    <ul id="nav">

    <li class="first"><a href="/" id="home">Home</a></li>

    <li class="a"><a href="/about">About Us</a></li>

    <li class="last"><a href="/contact" id="contact">Contact Us</a></li>

    </ul>

    ```


    Moving up and down the DOM is something you will do a lot, so it''s worth spending
    time on these methods to wrap your head around what''s going on when you use them
    on a real project.


    > Note

    These methods can be a little frustrating to work with because some browsers will
    insert a text to maintain whitespace in your code. In the example we were using,
    this can cause a return of "#text" rather than the first node you''re expecting.
    These examples have been ideal for readability, but in some cases you will want
    to remove the whitespace or adjust your targeting methods. Removing whitespace
    is a good idea for a lot of sites in production because it will make your overall
    page weight smaller and improve performance.'
