  md: '# JavaScript Libraries Basics


    to choose from and be told, most people choose by popularity. Picking the most
    popular library probably isn''t the greatest way to go about things, but there
    is certainly to be said as to why a particular library is the most popular. It
    may actually be the best overall; it may have the best documentation, a really
    strong community, or it may have just been the first to market.


    When you''re choosing a library, you should take into account that you commonly
    do on a project. Because you''re probably not going to switch libraries on every
    project (that would be silly), you should do your best to make an informed decision
    based on the set of criteria you define for yourself. And there is nothing wrong
    with picking a few, using them on different projects, and picking the one that
    feels most right for the way you like to code. When it comes down to it, you can
    until you use it in a real-life situation it is very hard to tell how something
    will work with your personal preferences and style.


    However, you have to start somewhere. There are so many libraries out and so many
    factors to take into account that it is hard to filter out which are at the top
    of their games, which are on the rise, and which are quickly falling into obscurity.


    With any open source project (libraries included), documentation and community
    is often a critical component. Picking the most popular option will usually yield
    the best results if that your criteria. Some JavaScript helpers categorize themselves
    as libraries, some are referred to as toolkits, and others stick to the framework
    pretty


    Some differences exist between the three, but they all accomplish the goal of
    making JavaScript easier to use. Libraries and toolkits are the most common, because
    they generally come in the form of a single file you attach to your HTML document.
    Some toolkits frameworks are the only that doesn''t fit the bill when held up
    to libraries and toolkits. Frameworks are much more than simple libraries; they
    can contain libraries (like one that we will go over) but they speak to an overall
    structural change in the code you write JavaScript, offering many more. The outcome
    of a framework is usually that you will be using a very distinct coding style,
    whereas a library would be free to used however you would like, with little structural
    constraint imposed on the code. Let''s start off by looking into a popular framework,
    YUI.


    # YUI


    YUI is a free source JavaScript and CSS framework whose goal is to create interactive
    Web applications. It is a fully featured and lightweight framework built with
    modularity in mind. It is well built, and supported by, front-end engineers at
    Yahoo!. If you''re looking for a well-documented framework or library, you can
    safely stop your search for YUI. The documentation of YUI is among the best in
    the industry. It also has a strong user community surrounding. It also doesn''t
    hurt to be backed by one of the most popular companies on the Web.'
