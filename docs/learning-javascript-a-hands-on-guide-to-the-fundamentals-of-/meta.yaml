    # Tools Built into the Browser


    By tools built into the browser 1 mean Web applications that have been created
    with the sole purpose of helping you write JavaScript. Nice, right? Browser tools
    can help you remove all whitespace from code to improve performance, like the
    YUI Compressor (www.refresh-sf.comui/). The compressor can greatly help the performance
    of your JavaScript by reducing the file size. This compression can take text (posted
    code), uploaded files, or remote URLs. Use this with caution. The YUI compressor
    is a great tool, but it does make your code basically unmanageable by shrinking
    it all down to one line. With that in mind, if you plan to use this service, to
    have an uncompressed version of the file that you can work in as well.


    Compression applications like YUI Compressor are great, but there''s another online
    service JSLint (http://www.jslint.com), which will parse through your JavaScript
    and look for syntax and formatting problems. The slogan "JSLint will hurt your
    feelings" is absolutely dead on. It''s always a shock to read through this application
    productions. Most are not actually errors in the browser, but JSLint will guide
    you toward best practices in code organization as well, helping you create even
    more streamlined, functional JavaScript.'
