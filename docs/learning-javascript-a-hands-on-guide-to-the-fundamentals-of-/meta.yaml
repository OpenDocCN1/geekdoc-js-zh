  md: "Calling a method is a little different from calling a function. You'll notice\
    \ in Listing 6.4 that instead of calling startle() by itself, you have to call\
    \ addressBookMethods.startle(). This is because before you can access the method,\
    \ you have access to the object and drill down to the method.\n\n# Performance\
    \ Considerations\n\nNesting functions in objects has the same performance implications\
    \ that we spoke of nesting variables in objects. The deeper a function is nested\
    \ inside an object (addressBookMethods), the more resources it extracts. This\
    \ is another place in your code where you will have balance performance with maintainability.\
    \ We're not talking about a ton of time—maybe a few milliseconds difference—but\
    \ it can add up. Most of the time it won't matter, but if you find yourself needing\
    \ a performance boost, function objects would be a place to look for a bottleneck.\
    \ I probably wouldn't go more than a few levels deep when creating these objects.\
    \ Listing 6.4 goes only one level deep, which is a nice balance between performance\
    \ and maintainability.\n\n# Loops\n\nA loop will execute a block of code over\
    \ and until you tell it to stop. It can iterate through data or HTML. For our\
    \ purposes we'll be mostly looping through data. The way a function is a chunk\
    \ of JavaScript code, a loop can make that function execute over and—like a little\
    \ buddy you have to do for your repetitive tasks for you. And they're built right\
    \ into the language!\n\nFor this one, we need some data to loop through. We'll\
    \ be using contact information for the data and saving it to a JSON object called\
    \ \"contacts\". Listing 6.5 shows a small sample of the contact information we\
    \ will be looping through. If it is easier to work with data that represents people,\
    \ because when something goes wrong with one of the items it's much more difficult\
    \ to get angry at someone you know than it is anything else. Free to substitute\
    \ your friends or family in the data so you don't get frustrated if something\
    \ goes wrong.\n\nListing 6.5 Creating Data in a JSON Object\n\n```\nvar contacts\
    \ = {\n  \"addressBook\": [\n    {\n      \"name\": \"hillisha\",\n      \"email\"\
    : \"hill@example.com\"\n    },\n    {\n      \"name\": \"paul\",\n      \"email\"\
    : \"cleveland@example.com\"\n    }\n  ]\n}\n```"
