    # Support


    Support for the getElementsByTagName() method is widespread enough that we can
    feel free to use this as much as we want without worrying.


    # Targeting by Class


    So far the node methods we''ve talked about have been similar to CSS selectors.
    In CSS you can target by both ID and TagName, and they''re very commonly used.
    You can also target by class. JavaScript is no different; however, it has lagged
    behind a bit.


    For years now, since targeting class was active in CSS, the community wanted the
    feature added to JavaScript. It took a while, but we finally have it! Recently
    added to JavaScript was the getElementsByClassName() method. This method functions
    the way getElementsByClassName() does when it comes to producing and accessing
    the NodeList, but we can use other interesting combinations of selectors with
    this method, so let''s get started with the HTML in Listing 4.4.


    Listing 4.4 HTML Snippet Illustrating Element Node with Classes


    ```

    <DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>getElementsByTagName Example</title>

    </head>

    <body>

    <h1>Using getElementsByTagName</h1>

    <p class="dropcap">Content paragraph</p>

    <p id="e" class="dropcap">Content <span class="huge">paragraph</span>/></p>

    <p class="dropcap">Content paragraph</p>

    </body>

    </html>

    ```


    Again, we will be working with the paragraphs in the HTML. Note the classes we''re
    using. The first element has two classes, the second has one class on the paragraph
    and on the child span node, and the last element has one class. With the JavaScript
    behind it in Listing 4.4.1, we can target those nodes individually.'
