    # Variables


    Variables in JavaScript can hold values, objects, or even functions. They can
    change, they can be static, and they can be empty. I guess you could say that
    their function in JavaScript is variable (pun intended). The basic function of
    a variable is to store some information. There are couple types of variables that
    you may encounter as you''re learning JavaScript: local and global variables.


    # Local Variables


    Local variables are defined within a function and can be only used within that
    function (you will learn about functions in a bit). That means you can''t declare
    a local variable inside function A and use it in function B because they are contained
    inside the function which they were defined. Local variables are always prefixed
    using "var" when they''re defined. Listing 3.2 shows a list of basic variables
    defined. These are empty variables right now, but we''ll be filling them up pretty
    soon.'
