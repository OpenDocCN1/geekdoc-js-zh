  md: '# Storing Data in JavaScript


    Storing data is core functionality of JavaScript. It doesn''t make things swoosh
    around the page, slide, fade in/out, or draw the user''s eye. But properly storing
    your data will make it well organized and easy to maintain later in your application,
    which is one of those magic pieces creating a great user experience that the user
    is completely ignorant about (in a good way—they don''t notice it). Quick and
    easy access to data, brilliant!


    In this chapter, you learn the different methods of storing data within a JavaScript
    model. Some methods are internal to your own personal scripting file and are consumed
    externally. Externally generated data can be produced by a database to call your
    application or an external API service (we''ll get into APIs). In some form or
    another, you will be storing and caching data on every project. Knowing not only
    your options but the proper times to use them can be very valuable when you''re
    trying to create a codebase that performs well and is easily to maintain (a constant
    balancing act for all front-end code).


    As you progress through this chapter, you notice a pattern exposing the history
    and future of JavaScript. We start off with the basics, move to more complex storage
    methods, then hit a point where start talking about new methods; you''ll be able
    to see how the once complex data storage methods (they''re still around, which
    is why we''re learning them) begin to come back and feel more thought-out and
    easier to work with. And, as usual, the old methods are important because the
    newer methods may not have support in your target audience. But it''s a movement
    toward JavaScript that works better, and it''s important to realize that pattern
    to utilize the technology.


    # Variables


    Variables are the most basic forms of data storage in JavaScript. They''re used
    in programming languages but are especially important here because they are an
    unavoidable aspect of writing code, high performance JavaScript. A variable is
    a label attached to a value. Sometimes the value changes, sometimes it doesn''t.
    But the label will always stay the same so you can reference throughout your code.'
  merge: -1
  pgno: 102
- img_proc: false
  md: "# Chapter 5 Storing Data in JavaScript\n\nVariables can be used a few different\
    \ ways. You can self-define static variables, you can define dynamic variables,\
    \ or you can use variables that take into account user interaction. These can\
    \ be in the form of strings, numbers, or Boolean values. These values can then\
    \ be passed into a function, checked, combined, or modified as need throughout\
    \ your program. The first step in creating a variable is called declaring a variable,\
    \ which sets the label to what you want. Something to remember when declaring\
    \ variables is that they are case sensitive, so uppercase versus lowercase always\
    \ matters. In Listing 5.1, you can see a few basic declarations.\n\n# Listing\
    \ 5.1 Code Block Title\n\n```\n/* this style is called \"camelCase\" */\nvar myFavoriteSandwich;\n\
    \ some people choose to use underscores instead of camelCase */\nvar MY_FAVORITE_SANDWICH;\n\
    \ all variables are different in the eyes of JavaScript because the case is different,\
    \ even though they all technically read the same to a human */\n```\n\n> Note\n\
    The case-sensitive nature of variables is not an invitation to write variables\
    \ with similar names. Although these variables will not collide from a technical\
    \ standpoint, they can get very confusing when a human eye is trying to debug\
    \ or maintain the script. So it's best to have distinct, meaningful variables.\n\
    \n# Strings\n\nA string is the first type of data that can be assigned to a variable.\
    \ It's nothing more than a collection of characters and can be anything from a\
    \ single word to an entire paragraph or multiple paragraphs. They're contained\
    \ within quotes and are set with an equal sign (=). In Listing 5.2 you can see\
    \ the variables we'll be starting to use via strings.\n\n# Listing 5.2 Saving\
    \ Strings to Variables\n\n```\nvar favoriteBreakfastSandwich = \"Egg, Sausage\
    \ and Cheese\";\nvar favoriteLunchSandwich = \"Turkey Club\";\nvar favoriteDinnerSandwich\
    \ = \"Meatball\";\n```"
  merge: -1
  pgno: 103
- img_proc: false
  md: 'Strings can be saved to variables with either single or double quotes; both
    produce the same result, and it’s more a matter of personal preference. Because
    both single and double quotes are commonly used inside saved strings, they will
    often break your JavaScript and need to be escaped. In Listing 5.3 you can see
    variables saved with single quotes, double quotes, and examples of escaping them
    where applicable.


    # Listing 5.3 Escaping Quotes in a String


    ```

    /* double quotes */

    var favoriteBreakfastSand = "Egg, Sausage and Cheese";


    /* single quotes */

    var favoriteLunchSandwich = ''Turkey Club'';


    /* double quotes escaped */

    var statementOnBreakfast = "I said, \It is important\", you know that.";


    /* single quotes escaped */

    var statementOnLunch = ''It\''s good for your metabolism'';

    ```


    The rules for escaping are that if you use single quotes, you need to escape single
    quotes, and if you use double quotes, you need to escape double quotes in strings.
    Overall, pretty easy stuff right? If you choose one quoting method over the other,
    make sure it’s consistent throughout the JavaScript you’re writing.


    > Tip

    If you are saving HTML to strings a lot, single quotes may save you some time
    because you won’t have to escape all the double-quoted attribute values in HTML.


    # Numbers


    Numbers are exactly what they sound like: they are number values saved to variables.
    The tricky part with numbers is that they can also be strings. For JavaScript
    to consider a variable a number, it cannot be a quoted value; if quoted, JavaScript
    will treat it as a string, and it can be difficult to work with later.


    Numbers can have math preformed on them with JavaScript operators. All the basic
    math functions are available: addition, subtraction, multiplication, and division.
    It’s like having a calculator built right in the JavaScript—very handy. In Listing
    5.4 you see examples of numbers saved to variables and some simple math. Numbers
    can be positive, negative, or even decimals. Note that none of the values are
    quoted, so you can add them together.'
