    \ email + ''\">' + name + '</a></p>';\n  } // end loop\n}\\ // end count check\n\
    }\n```\n\nThere's the address book application as it stands right now. You've\
    \ created the contact information for your five friends and inserted them into\
    \ a JSON object. After storing the JSON object, you're looping through each item\
    \ (person) and outputting them individually into the <body> element, one after\
    \ another. You're also creating HTML fragments that are paragraphs and mailto\
    \ links for each person.\n\nThe processes of looping through data, storing the\
    \ items as variables, and outputting them into the DOM is, by far, the most common\
    \ method you will see as you build more applications with JavaScript. This code\
    \ will not only serve as a base for our application, but also as a reference point\
    \ for your future JavaScript development.\n\n# Summary\n\nIn this chapter, we\
    \ started off diving into a little deeper into variables. You learned the different\
    \ grouping options when declaring variables, along with some best practice considerations\
    \ like why you should declare variables at the top of your JavaScript document.\
    \ We went over the list of reserved terms you should consider when naming functions\
    \ and variables to help prevent collisions in your scripting file.\n\nAfter that,\
    \ we elaborated on the different types of functions, how they differ from each\
    \ other, and discussed different case scenarios for when you might want to use\
    \ each type of function."
