    (unatu- ral) IDs like "homelink" in the example to gain quick access to an element
    node. There are other ways, but performance-wise, this is the fastest. In Listing
    4.2.1 let''s take a look at the JavaScript you would use to access these nodes.


    # Listing 4.2.1 JavaScript Used to Access an Element By Its ID


    ```

    document.getElementById("header");ndocument.getElementById("homelink");

    ```


    As mentioned earlier, you have to access the document object before you can get
    to the node you want. After you have access to the node, you can store, modify,
    or retrieve extra- formation about the element with the plethora of methods built
    into JavaScript that we will be exploring this entire book. It''s important to
    remember that although we are using the ID attribute to access the node, we are
    still accessing the element node and not the attribute node at this point. If
    we were to access the content of the ID attribute (the "header" and "homelink"),
    we would be accessing the attribute node, but since we''re not doing that, we''re
    still on the element node.


    # Support


    Support for the getElementById() is widespread throughout all browsers, because
    it is one of the oldest and most well-used methods we have. In fact, you might
    even call it "retro." We know that retro is hot now, so use it well!


    # Note


    Using IDs throughout your HTML is not only great for JavaScript performance but
    also CSS performance and specificity when applying styles. IDs can also be used
    for accessibility enhance- ments when creating jump or "skip to content" links
    for screen readers or visually impaired users.


    # Targeting by Tag Name


    Because IDs are unique to each document, getElementById() can return only a single
    element. Sometimes that doesn''t fly, and we need more than one, or even a group
    of elements. When this is the case, we use getElementsByTagName() in a similar
    way.


    # Note


    A pretty common (and frustrating) mistake in JavaScript syntax is not pluralizing
    the word "ele- ments" in getElementsByTagName(). Pay close attention to this and
    you''ll save yourself some debugging time.'
