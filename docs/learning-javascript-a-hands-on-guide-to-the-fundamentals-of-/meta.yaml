  md: 'The examples throughout this chapter will assume the contacts.json is in a
    directory called "data.". Just to make sure we''re all on the same page, Figure
    8.1 shows what your directory structure for the application should currently look
    like.


    ![](bbox=[0.355, 0.183, 0.603, 0.266])


    Figure 8.1 Current directory structure for the contacts search form application


    # Sending a Request to the Server


    Ajax talks to the server, the server doesn''t talk to Ajax. Because of this, Ajax
    does two things:


    +   - Sends a request to the server

    - Processes the data returned from the server


    The first thing you should do after you have created an instance of the Ajax object
    to work is to send a request. Sending an Ajax request opens up a new property
    for you to monitor called readystate which we will get in a bit.


    # GET versus POST and Performance


    Ajax calls be in the form of a GET or a POST. You don''t use one over the other
    like using a GET when you''re getting information and a POST when you''re putting
    information. They work more like a normal HTML form method.


    When you''re creating a search form in HTML, there is an attribute in the form
    markup called method; you can set it to GET or POST. What does it on the search
    results page—all the data is exposed in the URL. It''s very common the data isn''t
    sensitive at all. The downside of using a GET is that there is a (pretty large)
    character limit for the data being passed.


    Not all methods are set to GET, some are set to POST because the data is more
    sensitive, such as a username and password. The same principles are applied to
    Ajax GET and POST methods. If you have sensitive data you''re sending through
    an Ajax call, it should be sent via a POST, but if you''re working with nonsensitive
    data (like we are right now), it''s best to use a GET.


    You may be thinking, why not just use a POST all the time for Ajax because the
    URL isn''t exposed? The answer is that GET request performs better than a POST
    in most situations. Because the data in a GET is exposed, less processing is involved,
    which speeds up the performance of the request.'
