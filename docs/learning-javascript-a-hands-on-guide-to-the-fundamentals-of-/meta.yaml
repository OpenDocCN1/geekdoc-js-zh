  md: '# Chapter 1 Progressive Enhancement


    > Note

    You may have noticed that even though the HTML5 example has only one element,
    <nav>, we still choose to target the element by its IDs of #nav in the CSS. This
    is done because there can be multiple <nav> elements on one page that you may
    want to style differently, and also allows a little flexibility in changing the
    HTML. After as the ID value doesn''t change, you can keep your CSS isolated to
    only the HTML. It keeps your CSS that much more independent and maintainable.


    # Behavior Layer


    Everything must be fully functional without JavaScript.

    In this book, you will be spending the most time in the behavior layer. It''s
    the basis for this book because JavaScript is the entire behavior layer, and you''ll
    be learning JavaScript.

    in many cases, JavaScript is nothing more than a luxury. You use it to smooth
    interactions, make Ajax calls, slide elements around a page, and modify HTML.
    It really is another layer in progressive enhancement because by the time you
    it to the third layer, your site or application should be fully functional. It
    needs work completely before you start layering the behavior and how you want
    it. It won''t be as of a user experience, but if you can make it work JavaScript,
    you will not only have built-in fallbacks if JavaScript fails, but if you have
    to write less JavaScript to accomplish the same smooth experience for users. Of
    course, less code means better performance, and better performance means a better
    user experience. That''s what this is all about—providing the best user experience
    we can. If you can do that with less code, you absolutely should.


    Like in CSS, with JavaScript you target elements in HTML and do stuff to them.
    In CSS, you apply style and in JavaScript you apply JavaScript and behavior. And
    also like in CSS, there are a few ways you can apply JavaScript to an HTML document.
    We''re going to talk about three ways:


    +   - Inline JavaScript

    - Embedded JavaScript

    - External JavaScript


    # Inline JavaScript


    Inline JavaScript, like inline CSS, is when you attach JavaScript directly in
    the HTML. This has as many pitfalls as inline CSS, but you still see this quite
    a bit, where inline CSS is all but dead in the wild. One of the most common applications
    of inline JavaScript is adding a click behavior to an element. “Click” is a JavaScript
    event that executes when a user clicks, and you can tie certain behaviors to it
    when adding interaction to a page. Listing 1.1.5 shows how you might apply that
    event with Inline JavaScript.'
