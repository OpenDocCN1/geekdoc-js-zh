  md: "# The Server Response\n\nInside the onreadystatechange event handler, and after\
    \ you check to make sure the request is complete and successful, you can finally\
    \ get the data that was returned from the Ajax call.\n\nIn addition to readyState\
    \ and status, the Ajax object also returns your data as a property. It will either\
    \ be returned in the form of a string or as XML, depending on which data format\
    \ you choose to interact with.\n\n# As a String\n\nIf your data response is in\
    \ the form of a string, it will return as response. This is just a string of data\
    \ that needs to either output as it is returned or parsed with some of the native\
    \ objects available in JavaScript. This is the most common format for Ajax response\
    \ data.\n\nThis format is the most common format because it can contain anything\
    \ from plain text, to HTML, to JSON (hint, hint), and then be parsed accordingly.\
    \ To access this data inside your Ajax call, you access the object, then the responseText\
    \ like: responseText;\n\n# As XML\n\nIf you are returning XML data, the response\
    \ will be in the form of responseXML. Everything is pretty much the same besides.\n\
    \nListing 8.4.2 shows how you would spit out the returned data into the JavaScript\
    \ console to observe the contents of the response.\n\n# Listing 8.4.2 Outputting\
    \ the Returned Data\n\n```\nvar request = getXMLHttpRequest();\n\nrequest.onreadystatechange\
    \ = function(){\n    // check if the request is ready and that it was successful\n\
    \    if(request.readyState === 4 && request.status === 200 ) {\n        // spit\
    \ out the data that comes back\n        console.log(request.responseText);\n \
    \   }\n}\n\n/* Get all the information ready to go **/\nrequest.open(\"GET\",\
    \ \"data/contacts.json\", true);\n\n/* make the actual call */\\nrequest.send(null);\n\
    ```"
  merge: -1
  pgno: 181
- img_proc: false
  md: "# Getting it into a Function\n\nNow that you have a working Ajax call, you\
    \ will probably want to use it more than once in your application. In fact, we\
    \ do want to use it more than once. For the autocomplete functionality and another\
    \ time to get all the contacts in a single call.\n\nTo make the function a little\
    \ easier to reuse, we're going to take what we already have and put it into a\
    \ function, with one small change.\n\nTo be certain that function can be reused\
    \ within the context of this application and retrieve the contacts.json file,\
    \ we are going to pull the reference to data/contacts.json out of the function\
    \ and instead use an argument that will be passed when it is called. Listing 8.5\
    \ shows our complete Ajax function with a dataURL being passed into it.\n\nListing\
    \ 8.5\n\n```\n/* define the Ajax call function *\nfunction ajax(dataURL) {\n \
    \ /* use our function to get the correct Ajax object based on support *\n  var\
    \ request = getHTTObject();\n\n  request.onreadystatechange = function() {\n \
    \   // check to see if the Ajax call went through\n    if ( request.readyState\
    \ === 4 && request.status === 200 ) {\n      // split out the data that comes\
    \ back\n      console.log(request.responseText);\n    }\n    } // end Ajax status\
    \ check\n  };\n\n  request.open(\"GET\", dataURL, true);\n  request.send(null);\n\
    }\n\n```\n\nWith the function listed in Listing 8.5, it would now be called with\
    \ the data source as an argument like this: ajaxCall(\"/data/contacts.json\").\
    \ Calling the function lets us easily reuse it with other data sources, either\
    \ within the same project or on any number of other projects, so you don't have\
    \ to keep writing the same function over and over to accomplish the same outcome\
    \ of a simple Ajax call. This is how you begin building your own JavaScript function\
    \ library."
  merge: -1
  pgno: 182
- img_proc: false
  md: "Currently, it will only output the returned data into the JavaScript console,\
    \ but we want to be able to return and use that data in various ways.\n\n# Returning\
    \ the Data\n\nRight now the data is stuck inside the onreadystate event handler.\
    \ This obviously isn't what we want. If we were using this function only once,\
    \ we could add all the data parsing and output right inside the event handler.\
    \ You could build all your functionality right inside the ajaxCall() function.\
    \ That would be perfectly fine—a little difficult to integrate into our current\
    \ codebase, but there's nothing wrong with.\n\nLucky for you, we're not going\
    \ to settle for \"just fine.\" We can make this function a lot more reusable by\
    \ finding a way to work with the data returning while still remaining inside the\
    \ context of the onreadystate event handler. To accomplish this goal, we need\
    \ to find a way to call the ajaxCall function and allow it to take an extra argument\
    \ that isn't a foreign concept at this point. Remember? This does a little tricky,\
    \ a function that calls another function is called a callback function. With that\
    \ in mind, what we need to do is allow the ajaxCall() function to accept a callback\
    \ function.\n\nThe first step to do is to save the responseText to a variable\
    \ so we can work with it more easily. Listing 8.5.1 introduces a new argument\
    \ callback, which will represent the function we will be passing through to access\
    \ the data response. So we will have two arguments; one will be a string, and\
    \ the other will be a function.\n\nBecause the data is saved to a variable (contacts),\
    \ it is easy to pass that data into the callback function.\n\n# 8.5.1 Accepting\
    \ a Callback Function\n\n```\nfunction ajaxCall(dataURL\n```\n\n```\n* use function\
    \ to get the correct Ajax object based on support *\nvar request = getXMLHttpRequest();\n\
    \nrequest.onreadystatechange = function() {\n  // check if the Ajax call went\
    \ through\n  if ( request.readyState == 4 && request.status == 200 ) {\n    //\
    \ save the ajax response to a variable\n    var contacts = JSON.parse(request.responseText);\n\
    \    // make sure the callback is indeed a function before executing it\n    if(typeof\
    \ callback === \"function\") {\n      callback(contacts);\n    }\n  }\n```"
