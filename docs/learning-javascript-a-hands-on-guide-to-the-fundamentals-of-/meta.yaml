  md: "# Code Design 191\n\nWhen commenting your code, it is important to do your\
    \ best to state the obvious. You can safely assume that someone cracking open\
    \ of your JavaScript files knows the basics of the language (or they probably\
    \ shouldn't be in there the first place). If you're adding a class to a parent\
    \ node, it isn't very helpful to leave a comment that says something like \"add\
    \ a class to parent\"; anyone can tell what you're doing. A better comment would\
    \ read something like \"adding a class to the body element as a style for CSS\
    \ and JS to check the document state. The corresponding CSS lines in application.css.\"\
    \ That would be a helpful comment to a developer coming into the code. Documentation\
    \ can be a pain, but if you document well in your comments, you can dramatically\
    \ cut down on the amount of external development documentation you need to create.\n\
    \nListing 9.6 shows an example from the pizzaParty() function where the comment\
    \ leaves something to be desired.\n\n# Listing 9.6 Example of Bad Commenting\n\
    \n```\n/* pizzaParty(totalSlices, peopleCount) */\n\nfunction pizzaParty(totalSlices,\
    \ peopleCount) {\n\n  use strict;\n\n  // divide the total slices by the people\
    \ <- no kidding!\n  var fairness = totalSlices / peopleCount;\n\n  // return fairness\
    \ value\n  return fairness;\n}\n```\n\nThe comments in Listing 9.6 look like a\
    \ computer wrote them. Not only are they amazingly unhelpful to someone viewing\
    \ the document for the first time, they're all super boring. Coding can always\
    \ be a little more stressful than we would like, so don't be afraid to inject\
    \ some humor into your comments. As far as brightening someone's day when they're\
    \ eyeballs deep in code, it doesn't get better better than a funny comment someone\
    \ left. I've even caught myself laughing at comments I've written in the past.\
    \ It's a nice surprise and lightens the mood.\n\nListing 9.6.1 shows an example\
    \ of commenting that might be a little more helpful.\n\n# Listing 9.6.1 Example\
    \ of Better Commenting\n\n```\n/* determine how many slices of pizza each person\
    \ can eat to get the maximum amount\nof fat in everyone's stomach.\n  Taking 2\
    \ arguments to be a little more flexible / reusable */\n```"
