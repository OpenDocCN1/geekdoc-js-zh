  md: "# Chapter 10 Making JavaScript Easier with Libraries\n\ncomplex, but this is\
    \ always at its core. When you animate the DOM node, you are dynamically updating\
    \ CSS properties.\n\n# Listing 10.2.8 Simple jQuery Animation\n\n```\n// bind\
    \ a click event to the only button on the page\n$('button').click(function ()\
    \ {\n\n  // animate all heights of each module to 0\n  $('.module').animate({\n\
    \    'height': '0px'\n  }, 500, function () {\n\n    // after the animation is\
    \ complete, change the button text\n    $('button').text('now what, smart guy?');\n\
    \  });\n  // close animate anonymous callback function\n}); // close click anonymous\
    \ callback function\n```\n\n# jQuery Nonbasics\n\nAll the basic stuff in jQuery\
    \ is just. The selector and DOM shortcuts combined with ease of animation in the\
    \ library makes it a powerful script right out of the gate. Other the basic stuff\
    \ is just that, basic. You already know how to accomplish all tasks in native\
    \ JavaScript, so the benefit of learning the jQuery versions of them is more for\
    \ your convenience if you choose to move ahead with the library.\n\nThe big savings\
    \ of jQuery (or any library for matter) are what I call the nonbasics. They are\
    \ not quite \"advanced\" topics, which are far beyond the basics of the library\
    \ and where are the real benefits of taking oversized JavaScript library into\
    \ your application to pay off.\n\nThere are three major areas in jQuery where\
    \ the library really steps up to the next: Ajax, loops, and a properly called\
    \ chaining functions. To address these issues, we will be taking a step back into\
    \ the JavaScript file we have been working with for the autocomplete search form.\
    \ We will be replacing the custom Ajax function we made with a jQuery version\
    \ and combining that with the jQuery loop syntax to create the same effect of\
    \ autocomplete searching, but by using a library.\n\n# Using Ajax in jQuery\n\n\
    Remember all loops and if statements we had to write when creating the Ajax call\
    \ from the autocomplete search form? You may be upset when you find out how easy\
    \ it is to make Ajax requests with jQuery. Ajax is one of those things that many\
    \ people consider the saving"
  merge: -1
  pgno: 249
- img_proc: false
  md: "grace of a library because of all the cross-browser problems and checking that\
    \ needs to happen behind the scenes to create a successful-Ajax call.\n\nThe Ajax\
    \ call we wrote in previous chapters was pretty specific to our purposes. We needed\
    \ an Ajax call, which returns a JSON object that will be parsed. Although that\
    \ is an extremely common case, the ajax() object in jQuery offers an extremely\
    \ flexible API where you can easily set configurations for your call, which it\
    \ a GET or POST, using JSON, HTML, XML or script. It also offers straightforward\
    \ options for accepting callbacks in the case of a successful call or a failed\
    \ call.\n\nIn Listing 10.3, you can see the basic setup structure for an Ajax\
    \ call, which uses the jQuery method. This specific call will retrieve the contacts.json\
    \ file, return it, and output the contents in the JavaScript code. You could also\
    \ parse this data directly with a basic for loop.\n\n# Listing 10.3 Basic Ajax\
    \ Call with jQuery\n\n```\n$(document).ready(function () {\najax({\n  type: 'GET',\
    \ // set request type GET or POST\n  url: 'data/contacts.json', // data URL\n\
    \  dataType: 'json', // type: xml, json, script, or html\n  success: function(data)\
    \ {\n    // if the call is a success do this\n    console.log(data.addressBook);\n\
    \  },\n  error: function () {\n    // if the call fails do this\n    alert('ajax\
    \ error occurred');\n  }\n}); // end Ajax call\n}); // close document.ready\n\
    ```\n\n# getJSON\n\nThe ajax() method by itself is very flexible, but because\
    \ our application is using JSON, we can utilize ajax method built into the jQuery\
    \ library that was specifically created to properly parse JSON data. This method\
    \ is called getJSON() and it is a shortcut to the normal ajax() method.\n\ngetJSON()\
    \ takes two arguments. The first is a URL to the JSON data, and the second is\
    \ the function you want to execute upon a successful data return. In Listing 10.3.1\
    \ you can see that"
  merge: -1
  pgno: 250
- img_proc: false
  md: "we are passing the data URL into the JSON() method and using an anonymous callback\
    \ function to save the data to a variable and check the length of its contents.\
    \ This probably looks familiar because it's what we do right before every single\
    \ loop we have gone over to this point in the book.\n\n# Listing 10.3.1 Ajax Call\
    \ with jQuery Targeting Toward JSON Data\n\n```\n$$(document).ready(function ()\
    \ {\n  // start Ajax call\n  $.getJSON('data/contacts.json', function (data) {\n\
    \    var addrBook = data.addressBook,\n    count = addrBook.length;\n\n    //\
    \ clear the target area just in case there's something in it.\n    $('#output').empty();\n\
    \n    // check the count, of course\n    if (count > 0) {\n      console.log(addrBook);\n\
    \    }\n  } // end count check\n}); // end ajax call\n});\n```\n\n> Note\njQuery\
    \ contains shortcuts to other jQuery methods, which are eventually mapped to native\
    \ JavaScript methods.getJSON() is an example of this. It is important to remember\
    \ that passing from one shortcut to another has performance implications. Wherever\
    \ possible, use the shortest path possible.\n\n# Looping Through Data in jQuery\n\
    \nNow we have set up our Ajax request with the getJSON() method, the next step\
    \ is to loop through and output the data that is returned with the jQuery each()\
    \ method.\n\nThis method is among the most popular because it's very human-readable\
    \ and makes sense. The each() method says, \"for each of these things, do something,\"\
    \ which is the same thing a normal for() loop says, but in jQuery you don't have\
    \ to worry about that mashup of weird"
