  md: "# Mouse and Keyboard Events\n\n```\n } else {\n    // if removeEventListener\
    \ isn't supported (IE8 and below)\n    btn.detachEvent(\"click\", alertMessage);\n\
    }\n```\n\nThe most common events, other than load, that you will use are most\
    \ likely mouse and keyboard-based events. What are mouse and keyboard-based events?\
    \ Events such as\n\n+   - click\n- focus\n- blur\n- change\n- mouseover (hover\
    \ part 1)\n- mouseout (hover part 2)\n- submit (form submit)\n\nThere are lot\
    \ of events in JavaScript. You'll probably never use, like double-click. The previous\
    \ list contains the popular mouse and keyboard events that I personally use very\
    \ often and I imagine you will as well.\n\nTo properly go through the following\
    \ example of these events, you'll first need HTML to work with. We'll be jumping\
    \ back into the address book application that we've been building off of this\
    \ chapter. The HTML will consist of a simple search form to find the name of a\
    \ contact and have the contact show on the page. Listing 7.4 shows the basic HTML\
    \ search form you'll use to build this functionality. Ideally, this form should\
    \ be hooked up to a back-end technology (PHP, Python, Ruby, and the like) via\
    \ the form action to process the user's request upon submitting the form so it\
    \ is accessible without JavaScript. It functions in a similar manner to a normal\
    \ search form, but instead of searching millions of websites this form searches\
    \ through JSON object of contacts you made.\n\n# 7.4 Basic HTML Search Form\n\n\
    ```\n<!doctype html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>Address\
    \ Book</title>\n```"
  merge: -1
