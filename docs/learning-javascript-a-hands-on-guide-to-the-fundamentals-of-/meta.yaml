  md: '# pop


    pop is a method reserved for removing and returning the last item in an array.
    In Listing 5.12.3 you can see an example of how to remove the last item from the
    array that was defined in Listing 5.12 to return an Oatmeal and Banana Sandwich
    on Rye bread.


    Listing 5.12.3 An Example of Array Popping


    ```

    /* remove an item from the end of the array */

    var popDinner = dinner.pop();

    ```


    ```

    /* alert it */

    alert("pop: " + popDinner) // Oatmeal and banana on Rye

    ```


    > Note

    Using shift(), unshift() and pop() will all change the physical length of the
    array if you never need to access it again.


    # concat


    concat is short for "concatenate." It''s a method of still exists copying and
    combining multiple arrays into a single array. The original array still exists
    because the combined array is only a copy. In Listing 5.12.4 you can see that
    the breakfast, lunch, and dinner arrays are all concatenated into the new "favoriteSandwiches"
    array.


    Listing 5.12.4 Joining All Arrays into a Single Array


    ```

    /* concatenate all arrays in one */

    var favoriteSandwiches = breakfast.concat(lunch, dinner);

    ```


    ```

    /* save HTML body element to a variable */

    var target = document.getElementsByTagName("body")[0];

