    \ background: #eee; }\n  form > div { padding: 10px; }\n</style>\n</head>\n<body>\n\
    <h1>Address Book</h1>\n\n```\n\n<!-- ideally you would have this hooked up to\
    \ a PHP (any backend) processing page so\nit works without JavaScript as well,\
    \ but we won't get into that -->\n\n```\n<form action=\"\" method=\"get\" id=\"\
    search-form\">\n  <div class=\"group\">\n    <label for=\"q\">Search address book</label>\n\
    \    <input type=\"search\" id=\"q\" name=\"q\" required placeholder=\"type a\
    \ name\">\n  </div><!--section---->\n  <div class=\"button-group\">\n    <button\
    \ type=\"submit\" id=\"btn-search\">search</button>\n    <button type=\"button\"\
    \ id=\"get-all\">get all contacts</button>\n  </div><!--button-group-->\n\n</form>\n\
    ```\n\n```\n<div id=\"output\"></div><!--output-->\n\n<!-- Keeping JS at the bottom,\
    \ because we rock at performance -->\n<script src=\"js/addressbook.js\"></script>\n\
    </body>\n</html>\n```\n\nYou can see in the HTML that we've prepped the interface\
    \ a little, so it's ready for our JavaScript functionality by adding an empty\
    \ div with an ID of “output” to accept our data, and there is also a secondary\
    \ button to get all the contacts into the address book.\n\nThere are a lot of\
    \ active debates over inserting HTML like that into DOM; some people don't like\
