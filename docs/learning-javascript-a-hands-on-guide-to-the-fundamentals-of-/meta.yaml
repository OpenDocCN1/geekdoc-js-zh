  md: '# Code Design


    # 187


    # Note


    This structure model does not have to end at JavaScript. You could easily transfer
    it to your CSS directory if you were to use external CSS libraries as.


    # In-document Script


    Up to this point we have been putting JavaScript at the bottom of the document,
    so by now you should be familiar with how JavaScript blocks the loading of a page.
    By putting script at the bottom, you can create a faster loading page. This is
    nothing new, but it''s important to remember there may be times when you need
    to put a <script> reference at the top of the document to set up any object initializations.


    JavaScript does not have to be grouped together. It''s nice to have everything
    in one place, but in case the situation occurs you need to add a JavaScript file
    reference to the top of the document, you shouldn''t feel like it is up there.
    Some can be at the top and the rest at where it belongs.


    In the same native as the previous section, dealing with external libraries or
    multiple files not only affects your file structure, but it will also affect your
    in-document HTML. With more files, you will have to link up at the bottom of your
    HTML document. 9.3 shows what the bottom of your HTML document might look like
    if you were using an external library, a couple of plug-ins, and your custom script.
    The order of the files is very important in this instance. Because the two plug-files
    (and probably application.js) rely on library.js to function properly, you need
    to make that library.js is loaded before anything that depends on it. The files
    will load in the order they are listed; adding library to the top of the list
    ensures that anything below it can access the dependencies.


    # List 9.3 HTML When Dealing with External Libraries


    ```

    <!-- JavaScript -->

    <script src="/lib/library.js"></script>

    <script src="/lib/plugin.js"></script>

    <script src="/lib/plugin2.js"></script>

    <script src="/js/application.js"></script>


    <body>

    </html>

    ```


    External library plug-ins are often very specific to a certain page of your site
    of the application, it is very tempting to load only on the page where you need
    it. However, because of browser caching it is better to link up all your site''s
    JavaScript all the time. When a user hits a page with the externally linked files,
    which will be cached in the browser and most likely not redownloaded. For that
    reason, if you''re linking multiple files (but try not to), it''s best to link
    them all up and leave it alone.'
