  md: '# 1


    # Progressive Enhancement


    As much as we would like to think that people visit our sites to look at the majestically
    created intricate graphics, slick CSS animations, and semantic HTML, I can confidently
    tell you that, unfortunately, that is not true. I certainly visit some sites because
    of—you may even do so as well—and it''s possible that it''s a topic of conversation
    over after work, but Internet users (we’re not real users); we’re developers and
    designers—we’re “edge cases” don’t notice that stuff. They all care about how
    efficiently they can do what they need to do, whether it’s checking email and
    the weather, downloading a song, or watching a movie. But that’s the point: we’re
    supposed to be designing things so well that the techniques go virtually unnoticed
    by an untrained eye. When they start to stand out, the overall goals get to blurred.


    People come to your site, mine Yahoo!, Google, or MSN for the same reason: content.
    Everyone wants the content; it’s the most important aspect of any website or application.
    Think about time you visit a site. Why are you there? The answer is almost always
    “content.” In the Web design community, we have a guiding principle that stresses
    the importance of content. It guides the way we approach all our projects, big
    and small, and it’s called progressive enhancement.


    # Defining Progressive Enhancement


    Progressive enhancement is the fundamental base for all front-end development.
    At its most basic level, it is creating a functional separation between HTML,
    CSS, and JavaScript. It’s obviously much than than (or there wouldn’t be an entire
    chapter dedicated to it), but if you remember to keep those three technologies
    separate, you’re off to a good start.


    Progressive enhancement is a layered approach to Web design, where focus is on
    content, the user, and accessibility. The first step is keeping your HTML, CSS,
    and JavaScript separated, but we don’t refer to them as HTML, CSS, and JavaScript.
    We refer to these three “layers” as structure, presentation, and behavior, probably
    so the methodology can be accurately applied'
  merge: -1
  pgno: 24
- img_proc: false
  md: '# Chapter 1 Progressive Enhancement


    other areas beyond the current state of Web design. Regards, it is a bottom-up
    or inside-out building model for a website or application.


    You first focus on the content and mark it up with semantic and meaningful HTML.
    This is the first layer, "structure." After the content is properly marked up,
    we can move onto layer two, "presentation." On the presentation layer, we deal
    with CSS. The third layer of progressive enhancement, "behavior," we deal with
    last. This is where we will be spending a lot of time because this is where the
    JavaScript lives. Figure 1.1 shows the different layers of Web design.


    ![](bbox=[0.305, 0.285, 0.685, 0.555])


    Figure 1.1 Graphical representation of progressive enhancement


    The interesting thing about having these three layers is that they are never intended
    to touch each other, yet they''re all integrated—as you move up the ladder, the
    next layer is dependent on the previous. JavaScript needs CSS, and CSS needs HTML.
    This ordering is set up so you can remove each layer from top to bottom and you
    never lose the most important aspect of your site: the content.


    As long as you keep your layers separate, make your site work with only HTML,
    pretty it up with CSS, and smooth out the behavior with JavaScript, you will make
    sure that your content is always accessible.


    # History


    In 2003 in Austin, TX, at South by Southwest, a new term was coined that realigned
    the Web with the original path of Tim Berners-Lee; this term was announced as
    progressive enhancement, and ever since, the face of Web design has been changed.
    The way we build and think moved from focusing on machines (browsers) to a more
    friendly model, centered around'
  merge: -1
  pgno: 25
- img_proc: false
  md: 'people (users). We started realizing that content was more important than decoration.
    We cared about users and we cared about getting them to the content they were
    seeking as quickly and as easily as possible.


    Until this point, Web applications would either break a few browser versions when
    designs stopped testing, or valuable time would be wasted to retrofit newer features
    into alternative outputs. Many things such as new devices, screen sizes, bandwidth
    restrictions and memory limits would constantly crop up. Progressive enhancement
    was our way out of this endless cycle, and almost 10 years later, it''s still
    working great.


    To this day we are still building and finding ways to improve content and focus
    on user-centered design. Progressive enhancement changed the Web.


    # Purpose


    The purpose of progressive enhancement is to put the importance on content, which
    makes perfect sense; it''s why people visit your site. Although the main focus
    is on content, it also takes technology into account. Suppose you''re building
    a site with progressive enhancement and beautiful JavaScript animations, users
    visit your site with JavaScript turned off in their browser. They won''t see any
    of the JavaScript enhancements you''ve added in with care, but it shouldn''t matter
    because you can peel back the layers and effectively get to the content.


    Keeping your layers in separate files will also guarantee that if users were to
    visit without JavaScript, because it''s in an external file, the users wouldn''t
    have to waste the bandwidth to download all that code they won''t use. So it addresses
    performance issues as well.


    # Accessibility


    Putting so much emphasis on content makes sure that you is always accessible,
    no matter what. When you hear the term accessibility, you probably jump to thinking
    about disabled users, and you would be right to assume that, but there is more
    to it than that. Maybe there''s a slow connection or tight bandwidth, but 9 out
    of 10 times the content will still be easy to render and will be meaningful and
    lightweight by not being bogged down with other layers.


    Keeping your HTML clean, meaningful, and semantic will ensure that your content
    is easily consumable by everything from a constricted bandwidth to a disabled
    user accessing your site through screen reading software.


    # Reusability


    Keeping all your layers separated raises the reusability factor of your code.
    You will be able to not only use the same code over and over the same site, but
    as you move forward in your design career, you''ll be able to reuse code from
    past projects. If the layer were not separated, a specific line of JavaScript
    or CSS would be very difficult to locate in a project and'
  merge: -1
  pgno: 26
- img_proc: false
  md: '# Chapter 1 Progressive Enhancement


    reused somewhere else, unless the development conditions were exactly the same—and
    they never are.


    # Progressive Enhancement Versus Graceful Degradation


    Progressive enhancement was built off an old software development methodology
    called grace-degradation, where developers would build software for the most advanced
    version of a browser, but also make sure the software functioned in older browser
    versions. You wouldn''t have all the bells and whistles, but everything would
    function.


    It sounds familiar, isn''t it? In a lot of ways, graceful degradation is similar
    to progressive enhancement. Some might even say it''s all in how you look at it.
    The main difference between the two methodologies is that progressive enhancement''s
    main focus is content, whereas graceful-degradation''s main focus is the browser.
    Progressive enhancement also has a heavy focus on the layered separation between
    structure, presentation, and behavior. Next, let''s take a deeper look into each
    layer, how they relate to each other, and how you''ll build applications with
    this mind.


    # Structure Layer


    Everything has meaning and nothing has design.


    The first step in progressive enhancement is to lay the content, out in a meaningful
    way with HTML. Headings are marked up as headings creating a hierarchical flow,
    paragraphs are wrapped in `<p>`, lists are marked up as `<ul>`, and we make sure
    that the HTML is meaning-ful without communicating anything about the design.


    This is a harder case to make click in someone''s head than you might think. We''ve
    all been wired by what we''ve seen in working with word processing softwares,
    text editors, and what you see on the Web to forget what constitutes “design.”
    Many have forgotten-the difference between the true output for something is versus
    what can be changed with CSS.


    Knowing CSS will make your HTML better. Knowing that just because the default
    behavior of <blockquote> is to indent doesn''t mean you use a `<blockquote>` to
    indent text is a very important principle of progressive enhancement. You need
    to know that `<blockquote>` (it''s for block-level quoted text) and that, for
    your purposes, it''s irrelevant that a Web''s default display is to show that
    element is to indent. HTML’s default output is based on a stylesheet that the
    browser chose for keep content still functional and readable. When you write custom
    CSS for a site, you''re overwriting what the browser did and creating new styles
    to match your design.


    It''s important to know that things like bullet, indentation, bulleted lists,
    and numbered lists are no different from font size, background color, and family,
    that a bullet list is not always an unordered list. Most of the time it will,
    a bullet is nothing more than a style declaration. After you wrap your head around
    that, you''ll be ready to move on to'
