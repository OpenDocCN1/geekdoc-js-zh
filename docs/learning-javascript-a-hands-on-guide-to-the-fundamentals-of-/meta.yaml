  md: '168 Chapter 8 Communicating with the Server Through Ajax


    # Positives


    JSON is my personal favorite because it is native to JavaScript, very fast, flexible,
    and platform agnostic—meaning almost any programming language plays nice with
    JSON.


    Unlike XML, JSON can be consumed cross-domain very easily; it has no native domain
    limits because it is just a JavaScript data format. This makes it the ideal candidate
    for API structures. Because it is such a flexible format, you will find that the
    majority of Web services offered are in JSON format.


    # Negatives


    Although the data format of JSON is very flexible, the syntax is not (but this
    goes with any data format). Every comma, quotation mark, and colon needs to be
    in the right place for the data to be parsed correctly.


    Some security concerns also exist with JSON from any third-party Web service,
    because at its core, it''s just JavaScript, and it''s very easy to remotely inject
    malicious scripting through a AJAX object. This can be protected against, but
    in general you should consume JSON data only from trusted sources.


    # Ajax Accessibility


    One overlooked portion in Ajax development is accessibility. We go through a lot
    of work to make a website accessible to disabled users yet often fall short when
    AJAX functionality is layered on. When the DOM is initially rendered, a sighted
    user is able to easily click and see the feedback of a region of the page when
    it''s updated, but we tend to forget that there are ways to flag a region with
    attributes to let visually impaired users know that a portion of the page is going
    to be updated without a full refresh so they can come back periodically and check
    the content of that area.


    This method is Accessible Rich Internet Applications (ARIA), and it is something
    you should be familiar with before diving too far into the dirty world of AJAX.
    Accessibility is extremely important. Think of it as usability for disabled users.
    The goal of creating a top-notch user experience shouldn''t be derailed because
    a user having trouble seeing or hearing, or any form of disability. We create
    one Web, and that Web should be accessible to everyone, no matter what.


    # Live Regions and ARIA


    Live regions in HTML exist to indicate to assistive technologies (screen readers)
    that a certain area in the document might possibly change without focus or page
    refresh.


    ARIA regions have been around for a few years now, living independently from the
    rest of the W3C specifications, but it is now getting a lot more attention. There
    are currently four types of live region attributes for ARIA:'
  merge: -1
  pgno: 189
- img_proc: false
  md: '# Ajax Accessibility


    +   - aria-atomic

    - aria-busy

    - aria-live

    - aria-relevant


    aria-atomic

    aria-atomic indicates whether a screen reader should present all or parts of a
    live region based on the change notifications. This attribute takes Boolean values,
    either true or false.


    aria-busy

    aria-busy is a state reported to a screen reader, which reports back whether a
    live region is currently being updated. Just like aria-atomic, this attribute
    also takes either true or false value. Because this attribute changes based on
    update status, it needs to be set and updated in the Ajax call.


    aria-live

    ar-live is a way to report how important live changes in the document are. It
    can take one of three values: off, polite, or assertive.


    Setting the aria-live attribute to off prevents updates from bubbling unless the
    user is directly focused on the element. The polite value will be sure to update
    the user only when it is courteous to do so. In other words, it will not interrupt
    the user if something more important is going on, but will update the user at
    the next convenient moment. The last option, assertive, sets changes to the highest
    priority and will notify the user immediately of any changes, no matter what.
    Because this option can be distracting to a user, it should be used only when
    absolutely necessary.


    aria-relevant

    aria-relevant will notify the atomic regions as to what type of change has occurred.
    There are four options for this attribute: additions, removals, text, and all.


    The most common values for this attribute are additions and removals; this means
    that the region contains items and are both removed and added to. Our autocomplete
    form does this. In contrast, a text value to this attribute means that text has
    been added to a DOM node within the region. The last value means everything is
    going on and rather than listing additions, removals, and text, you can use the
    all value.


    Listing 8.10 shows how we are going to apply ARIA live regions to the HTML in
    our auto-complete form by using atomic, live, and relevant.'
  merge: -1
  pgno: 190
