  md: '# Praise for Learning JavaScript


    "Between modern web interfaces, server side technologies, and HTML5 games, JavaScript
    has never been a more important or versatile tool. To anyone just starting out
    with JavaScript or looking to deepen their knowledge of the practical core of
    the language, I would highly recommend Learning JavaScript."


    —Evan Burchard, Independent Web Developer


    "Although I''ve read a couple of books about Learning JavaScript before, as a
    backend developer, I was thrilled to see Tim Wright''s Learning JavaScript. The
    nuances of progressive enhancement versus graceful degradation are finally explained
    in a manner that someone new has ever forgotten. Bravo, Tim."


    —Joe Devon, Cofounder, StartupDevs


    "Tim Wright has written a delightfully practical book for the novice front-end
    developer who wants to learn JavaScript. This book''s strength is in providing
    a good introduction to JavaScript while also illustrating the context of when
    and where it should be used."


    —R. S. Doiel, Senior Software Engineer, USC Web Services


    "Learning JavaScript is a great introduction into modern JavaScript development.
    From covering the history to its exciting future, JavaScript equips the novice
    developer to practical application in the workforce. I wish this book came along
    when I was a novice!"


    —Hillisha Haygood, Senior Web Developer, Sporting News


    "Tim presents invaluable techniques for writing JavaScript with progressive enhancement
    at the forefront. If you are new to JavaScript then this book will prove to be
    a great asset in your learning. Covering all the basics and right through to touch
    events, AJAX, and HTML5 APIs, the examples are clear and easy to follow. Using
    this book, you will learn and how to use JavaScript to great effect."


    —Tom Leadbetter, Freelance Web Designer


    "Learning JavaScript is valuable for both new and veteran developers. It is great
    for new developers because it is easy to read and provides a step-by-step process
    for becoming great at JavaScript. Veteran developers will be reminded of many
    of the best practices they have already forgotten."


    —Christopher Swenar, Manager of Technology, zMags'
