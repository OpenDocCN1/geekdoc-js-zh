  md: '# 2


    # JavaScript in the Browser


    In this chapter, we lay the groundwork to help you keep proper focus as you write
    JavaScript on any project. Just like anything in life, as you get deeper and deeper
    into something, you tend to stray from the path every now and then. Knowing the
    core reasons for each decision you make in your code will not only help you successfully
    defend your choices later on, but also create the best user experience possible
    in writing high-performance JavaScript.


    Step 1 to writing good JavaScript is getting to know your environment. Well, step
    1 is really knowing JavaScript (history and so forth, but we''ll get to that (shortly)).
    As developers and designers, our environment is the browser. The browser is the
    crutch to your limping friend, JavaScript. For all intents and purposes, without
    a browser of some kind, there is little need for a language like this. Later you
    will find out this isn''t necessarily true, but for right now you can take it
    as law.


    When you break down the environment even further, you find that just like in CSS
    it''s not just "the browser", but depending on your audience, the "environment"
    can be anywhere from 1 to 10 or more browsers. In most cases, those browsers will
    have slight differences (quirks from Firefox on a Mac versus Firefox on a PC)
    or massive differences (Google Chrome Internet Explorer 7) in things like rendering
    speed and feature support.


    Feature support is something that you need to test out in each browser (or read/books),
    rendering speed, conventions, and best practices are global to how JavaScript
    interacts with any browser. Knowing those will help you make the right decisions
    with your code and create a top-notch user experience.


    # A People''s History of Santayana


    What''s that old George Santayana saying? "Those who cannot remember the past
    are condemned to repeat it." There are reasons that you''re forced to take history
    classes in school, reasons why you value experience, or even reasons why you might
    ask advice from the elderly. There is knowledge and great power in knowing the
    origins of something before dying in'
