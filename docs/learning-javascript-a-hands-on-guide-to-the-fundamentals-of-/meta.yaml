  md: '# Chapter 2 JavaScript in the Browser


    In Figure 2.1 you can see the basic three-step procedure for getting assets to
    the user. This happens many times for each page. The process of getting assets
    from the server to the client, rendering that content in a browser can be very
    intensive. A normal website can contain many assets that need to be sent to the
    browser, including


    +   - Images

    - HTML

    - JavaScript files

    - CSS files

    - Multimedia content (audio/video)

    - Font files


    In many cases, there are more than one instance of each type of asset (multiple
    images on a page, for example), and each asset requires an individual and costly
    HTTP request to fetch it from the server and display it in the browser.


    # HTTP Requests


    When you visit a URL, it is prefaced with http://. What''s going on is that you
    are creating a single HTTP request for the HTML that lives at that URL. Figure
    2.2 depicts a basic HTTP request for an HTML document. You''re basically saying,
    "Hey, give me the HTML that lives at this address"


    ![](bbox=[0.263, 0.555, 0.755, 0.676])


    Figure 2.2 A URL example of the most basic HTTP request


    Unless the server (or your Internet) is down, your browser will request the HTML
    for the URL. When the HTTP request is completed, the browser begins rendering
    the document, parsing through the HTML code and hitting requests for other resources.
    As it hits these requests, it will fetch them from the server the same way it
    fetched the original HTML document. This will happen until all the assets have
    been fetched and downloaded. Listing 2.1 shows the HTML code a browser will parse
    through and various resources it will need to fetch throughout the document.'
