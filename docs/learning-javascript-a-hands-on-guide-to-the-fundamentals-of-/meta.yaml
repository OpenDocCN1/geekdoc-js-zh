    In Listing 1.1.8 you can see that the contents of script.js are the same as the
    code contained within the <script> tags from Listing 1.1.6. It functions the same,
    as well; the only difference is that it now lives in an external file, can be
    independently cached, and is easily reused throughout the entire site simply by
    linking the file to any applicable HTML document.


    Doing this also allows you to reuse the function and variable defined over and
    over in different ways, rather than constantly rewriting them from scratch.


    Using an event listener in your external JavaScript file is equivalent of using
    the onclick attribute in Listing 1.1.5. They accomplish the same outcome of waiting
    (for the user to click the link before executing the function you defined. Moving
    forward with this model by adding all your CSS into the CSS file you created and
    adding all your JavaScript into the same JavaScript file will ensure you have
    a maintainable site or application that has started on a path toward a good user
    experience through optimal performance.


    # Benefits of Progressive Enhancement


    Now that you have gone through the guts of progressive enhancement, you may be
    asking yourself what the benefits are to all this extra work? Organization up
    front will save you a lot of time fixing it. One of my personal favorites in progressive
    enhancement is the document you come with in the end. Figure 1.2 you can see how
    a file structure starts to get created when you keep your layers separated. There''s
    no guessing, for you or anyone else who may work on this project, where you would
    make a design change. Not only do you know it''s in the CSS file, but you know
    that it is going to live in the "css" directory, providing a direct path to where
    you need to be. The same goes for behavior and structure; they''re all separated
    in the meaningful way.


    Coding mindset can also be helped with this structure—there''s something to be
    said about opening up a JavaScript file and seeing only JavaScript; opening up
    an HTML document and seeing only structural markup; and cracking open your CSS
    file, knowing exactly to'
