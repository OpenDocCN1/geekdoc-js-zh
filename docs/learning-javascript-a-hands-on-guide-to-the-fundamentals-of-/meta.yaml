  md: '![](bbox=[0.118, 0.098, 0.922, 0.588])


    Figure 4.2 Highlighting the element nodes from our DOM. As you can see, this is
    the majority of our document.


    # # Text Nodes


    Text nodes are similar to the element nodes because of how they sit in the DOM
    and the fact that we use the same JavaScript methods to access them. Of course,
    some differences exist between these two types of nodes, or we wouldn''t need
    to learn more terminology.


    The most notable difference is the way they look; element nodes are contained
    in angled brackets (greater than and less symbols). Text nodes are not; they are
    between element nodes. In Figure 4.3, you can see this depicted graphically.


    One important distinction between the two node types is that text nodes cannot
    have children (they''ve been trying for years, no luck). You can see in Figure
    4.1 that the `<p>` element node has a text node and another element node `<strong>
    has children. However, although the element node `<strong>` is technically inside
    the paragraph''s content in the HTML structure, it is not a child of the text
    node. This is where we start getting into the pseudo-hierarchy'
