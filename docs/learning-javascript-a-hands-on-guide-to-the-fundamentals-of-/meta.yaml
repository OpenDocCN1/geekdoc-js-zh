    alert(mondaySandwichCount + tuesdaySandwichCount + wednesdaySandwichCount +

    thursdaySandwichCount + fridaySandwichCount);

    ```


    # Boolean


    Unlike strings and numbers, which can have endless possibilities for their values,
    Boolean values can be only true or false. Boolean values are not contained within
    quotes. They are often used in basic yes/no situations, such as when checking
    for support for a certain feature in a browser. In Listing 5.5 you can see an
    example of a Boolean true value and a Boolean false value.


    # Listing 5.5 Saving Number Values as Variables


    ```

    var fullStomach = true;

    var stillHungry = false;

    ```


    Boolean values may seem limiting, but they are the basis for most programming
    languages and can be very useful when conditionally executing script.


    Instead of using true and false, you can use the numbers 0 or 1: meaning false,
    and 1 meaning true; these are also considered to be Boolean values. This can be
    tricky if you''re setting a 0 as a number value because a Boolean comparison will
    treat the value as false.


    # Performance in Variables


    When declaring a variable, you''re caching it in your JavaScript file and allowing
    it to be used over and over. This can be a great way to increase the performance
    and maintainability of your'
