  md: '# Ajax History


    Ajax is the concept of refreshing a part of an HTML document without reloading
    the entire page. In Chapter 2, "JavaScript in the Browser," we briefly touched
    on Ajax while going over the history of JavaScript and mentioned how the origins
    of client-server communications started in 1999 when Microsoft created the XMLHttpRequest
    object.


    Microsoft initially brought forth the XMLHttpRequest to fulfill a need in its
    mail client, Web Access 2000. They wanted a way for the client to be able to communicate
    with the server. It was first implemented in Internet Explorer 5 as an ActiveX
    object.


    ActiveX was (and still is) a proprietary Microsoft product for embedding objects
    in HTML. It was very powerful, but riddled with security holes. Because Microsoft
    was taking hold of the XMLHttpRequest and a very powerful technology that would
    later be called "Ajax," a little company Mozilla stepped into the scene, developed
    native to the browser (no need for the ActiveX plug-in) and released it to the
    world in its first Web browser, Mozilla 1.0.


    This has to be one of the greatest examples in the Web industry of a company giving
    information away for free and changing the world, which turned out to be a brilliant
    strategy. Rocketed in other browsers. Everyone from Safari to Opera Mini supported
    the new object, and it quickly became the standard, leaving the XMLHttpRequest
    from Microsoft in its wake. It was so widely adopted that even Microsoft decided
    to adopt the object by version 7 of Internet Explorer.


    The XMLHttpRequest changed the Web as we know it. It is a large part of the JavaScript
    where it is, and it''s the reason I''m writing this chapter right now. The impact
    of the XMLHttpRequest has surely echoed through the entire world, though everyone
    knows it by its "marketing" name: Ajax.


    The term Ajax was coined in 2005 by Jesse Garrett in an article titled Ajax: A
    New Approach to Web Applications. It''s ranked highly in Google and is easy to
    find. I highly recommend it an once-over-for a detailed description of the Ajax
    concept and how it has redefined client-server communications. Since this article
    came out, Ajax has been on the tip of every developer''s tongue and is a must-learn
    for anyone in the industry.


    The term "Ajax" itself has evolved as well; initially it was AJAX, an acronym
    meaning: Asynchronous JavaScript and XML. This was quickly (in a matter of days)
    changed when people realized two important facts in that statement:


    +   - Ajax can be synchronous or asynchronous.

    - Ajax can use XML, JSON, plain text, or HTML as a data source.


    Rather than changing the acronym entirely, they stuck with it and stopped calling
    it an acronym, settling on "Ajax." I don''t care what it says on Wikipedia, Ajax
    doesn''t stand for anything (you heard it here); it''s merely a term that represents
    a collection of technologies that fosters client and server communication.'
