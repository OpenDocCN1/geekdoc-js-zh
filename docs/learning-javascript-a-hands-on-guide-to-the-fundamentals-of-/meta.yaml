  md: '# Target Audience for This Book


    The audience for this book is anyone starting out in Web design and development
    who wants to learn about JavaScript. Before reading this book, you should be knowledgeable
    in HTML and CSS, and be familiar with the concepts behind progressive enhancement.


    This book can equally serve absolute beginners and seasoned Web veterans who are
    expanding their knowledge into JavaScript. All the while, I hope it instills enthusiasm
    to learn more about this rapidly moving industry.


