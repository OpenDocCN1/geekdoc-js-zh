  md: "# Inline CSS\n\nrelative, CSS. Most people are surprised when I tell them that\
    \ the key to writing JavaScript is knowing when to use CSS instead. However, you\
    \ still need to know how to write good CSS. You can use a few ways to attach style\
    \ to a document. Progressive enhancement states that you keep CSS out of your\
    \ HTML (external CSS), and that is correct, but I also want to go over another\
    \ method, inline CSS.\n\nInline CSS is used with a style attribute, which is attached\
    \ directly to an HTML element, and styles are applied to that only element; they\
    \ cannot be cached and cannot be reused like the style applied in Listing 1.1.2.\n\
    \nListing 1.1.2 Example of Inline CSS\n\n```\n<nav id=\"nav\" style=\"background:#c00;padding:10px;\"\
    >\n  <ul style=\"list-style:none;margin:0;\">\n    <li style=\"float:left;\"><<a\
    \ href=\"/about\">About</a></li>\n    <li style=\"float:left;\"><<a href=\"/articles\"\
    >Articles</a></li>\n    <li style=\"float:left;\"><<a href=\"/staff\">Staff</a></li>\n\
    \    <li style=\"float:left;\"><<a href=\"/contact\">Contact</a></li>\n  </ul>\n\
    </nav>\n```\n\nThere are many reasons to not treat your CSS and HTML like this.\
    \ Right off the bat, you can see that this HTML looks very cluttered, and it's\
    \ hard to tell what content is buried in there. I already mentioned that it won't\
    \ be cached, so you will need to rerender the styles each time the page loads\
    \ unless the HTML has been cached. This way of applying styles is very difficult\
    \ to maintain and reuse on a site because everything is coupled and tied to the\
    \ element to it is attached.\n\nInline CSS is fairly important because of the\
    \ functions that are common to JavaScript dynamically generate these attributes\
    \ in HTML, and if all your JavaScript is doing generating CSS, then why not just\
    \ use CSS? This is what I was talking about when I mentioned how well CSS will\
    \ help you write better JavaScript. Generating inline CSS with JavaScript-on-the-fly\
    \ can be as bad as applying them by hand in your HTML. It's certainly something\
    \ to be aware of when you are building a site.\n\n# Linking Your Stylesheet\n\n\
    Keeping your CSS in a completely separate file and linking it to your HTML document,\
    \ is by a wide margin, the most desirable and best way to design a site. You'll\
    \ be applying styles through meaningful hooks you left in the HTML-like classes,\
    \ IDs, and even normal HTML elements. In Listing 1.1.3 you can see how simple\
    \ it is to link a CSS file to an HTML document."
