  md: "# Binding Events\n\nBinding an event in jQuery isn't different from binding\
    \ an element with native JavaScript. There are methods in jQuery that map to each\
    \ type of event in JavaScript, including click, mouseover, mouseout, submit, change,\
    \ blur, focus, keyup, knockdown, and any other event you can think of. There are\
    \ also shortcut events to common actions like hover() and toggle(), which are\
    \ very convenient. Rather than using both mouseover and mouseout, two separate\
    \ events, you can bind to hover() and create the same effect. This is an example\
    \ of a library saving you time. Like jQuery's motto: Write less, do more.\n\n\
    Each event in jQuery can be passed as a callback function, which contains the\
    \ action you want to accomplish, like a normal event binding. With jQuery's syntax,\
    \ you do not need to be concerned about the browser support of an event listener\
    \ versus an event handler; it will take care of that for you.\n\nIn Listing 10.2.7\
    \ you will find the jQuery you need to attach a click event to the button from\
    \ Listing 10.2. This action should result in an alert window that reads \"you\
    \ got me!\" All event bindings in jQuery use this syntax, you can substitute click\
    \ with any event you choose, like focus or blur.\n\n+   Listing 10.2.7 Binding\
    \ a click Event with jQuery\n\n```\n// bind a click event to the only button element\
    \ in the document\n$('button').click(function () {\n\n  // anonymous function\
    \ that shows an alert\n  alert('you got me!');\n\n});\n// close click anonymous\
    \ callback function\n```\n\n# Animation\n\nThe capability to combine events and\
    \ the css() method to create JavaScript animations is one of the most popular\
    \ features in jQuery. For this, the library exposes an animate() method that contains\
    \ CSS properties you want to animate to.\n\nThe animate() method takes three arguments.\
    \ The first is the CSS properties to animate, like those you used with the css()\
    \ method. The second argument is the duration of the animation in milliseconds.\
    \ The third (optional) argument is a callback function you want to execute when\
    \ the animation is finished.\n\nIn Listing 10.2.8 you can see that we are still\
    \ binding a click event to the button element, but instead of showing a JavaScript\
    \ alert() we are animating the height of each .module wherever it is (it's 300px)\
    \ to 0px. This third argument will activate and the button text will change to\
    \ \"now what, smart guy?\" This is how you animate in jQuery. The animations can\
    \ get pretty"
  merge: -1
  pgno: 248
