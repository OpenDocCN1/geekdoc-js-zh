  md: "There are orientation settings for portrait, landscape, upside-down portrait,\
    \ and upside-down landscape, which can be returned with some work, but we're only\
    \ interested in triggering the event that tells us the device orientation has\
    \ changed.\n\nIn Listing 7.5.3 we will use the method `changedOrientation` added\
    \ to the touchControls object to clear the contents of the body when the `orientationchange`\
    \ event is triggered. If you add this method into the object, do some touching\
    \ and dragging; you should be clear the screen by rotating it to either portrait\
    \ or landscape (depending on how you started off).\n\n# Listing 7.5.3 Executing\
    \ a Method on orientationchange\n\n```\n/* Anonymous function wrapper! */\n(function()\
    \ {\n  // the same body variable, no need to redeclare it.\n  var body = document.getElementsByTagName(\"\
    body\")[0];\n\n  // declare an object to hold touch controls\n  var touchControls\
    \ = {\n    /* previously defined methods here * /\n    changedOrientation : function()\
    \ {\n      // clear out the body content\n      body.innerHTML = \"\";\n    }\
    \ // end method\n  }; // end object\n\n  // add event listeners to the body\n\
    \  body.addEventListener(\"orientationchange\", touchControls.changedOrientation,\n\
    \  false);\n\n})();\n```\n\n# Support for Touch Events\n\nSupport for touch events\
    \ is surprisingly good among touch devices. The touch-based events will execute\
    \ only on a device that supports touch (phone, tablet, and so on), and orientation\
    \ events will be supported in any device that has an accelerometer. At first glance,\
    \ these seem like the same thing, but some laptops ship with accelerometers in\
    \ them, even if they're never used."
