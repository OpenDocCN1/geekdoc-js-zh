  md: "# Working with the Attribute Node\n\n+   - getAttribute()\n- setAttribute()\n\
    - removeAttribute()\n- hasAttribute()\n\nIn all these methods we target the attribute\
    \ and return the value, so in an example of class=\"visible\", we would be targeting\
    \ \"class\" and return the value \"visible\".\n\nGetting and changing attributes\
    \ is paramount to writing a Web application that performs well. Because many of\
    \ the most common interactions we create, like hide/show, can be created efficiently\
    \ through CSS, this can be as simple as adding or removing a class. In this example\
    \ we will be working with the following HTML shown in Listing 4.6.\n\nListing\
    \ 4.6 HTML Example for Attribute Nodes\n<img src=\"images/placeholder.png\" class=\"\
    show\" alt=\"placeholder image\" id=\"plc\">\n\n# Getting an Attribute\n\nBefore\
    \ we can get an attribute, we need to jump into the DOM at an element node (using\
    \ one of the methods we have learned about), and then we can gain access to that\
    \ element's attribute. This is one of the ways we get more information about an\
    \ element. The getAttribute() method takes one argument, which is the name of\
    \ the attribute you want to target.\n\nBefore we target an attribute, much like\
    \ we did with the NodeList length, we make sure an element contains the attribute\
    \ we're looking for. This can be done with the hasAttribute() method. Suppose\
    \ you want to target the image referenced in Listing 4.6 and get the class value.\
    \ The JavaScript in Listing 4.6.1 will illustrate how you might accomplish this\
    \ task.\n\nListing 4.6.1 JavaScript Used to Get the Class Value of Our Image\n\
    \n```\n// we target the element and check if it has a class on it\nif(document.getElementById(\"\
    plc\").hasAttribute(\"class\")) {\n  // after we know a class exists, then we\
    \ can get the value\ndocument.getElementById(\"plc\").getAttribute(\"class\");\n\
    \n  // this would return the value of \"show\", which is the class on our image\n\
    }\n```\n\nYou may be well aware that a class exists in the area you're targeting,\
    \ but using hasAttribute() is one of a best practice, just in case it doesn't\
    \ exist (it happens). We don't have to waste valuable processing time executing\
    \ the JavaScript for no reason."
