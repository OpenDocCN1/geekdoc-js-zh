    \ charset=\"utf-8\">\n  <title>getElementsByTagName Example</title>\n</head>\n\
    <body>\n  <h1>UsingElementsByTagName</h1>\n  <p>Content paragraph</p>\n  <p>Content\
    \ paragraph</p>\n  <p>Content paragraph</p>\n</body>\n</html>\n```\n\nWe can grab\
    \ each paragraph in Listing 4.3 with the single line of JavaScript in Listing\
    \ 4.3.1.\n\n# Listing 4.3.1 JavaScript Example of getElementsByTagName\n\n```\n\
    document.getElementsByTagName(\"p\");\n```\n\nThis will return a DOM object called\
    \ NodeList. A NodeList is a collection of nodes that maintain their source order.\
    \ In other words, it's a list of elements, and those elements stay in the same\
    \ order they appear on the page. The order is pretty important because if the\
    \ items were randomly shuffled, they would be very difficult to access when we\
    \ need them.\n\nAfter we have the NodeList, we will also want to check how long\
    \ it is. Checking the length will allow us to make sure values are available before\
    \ we execute a script. We can do this with the length method, depicted in Listing\
    \ 4.3.2.\n\n# Listing 4.3.2 Returning the Total Number of Elements in Our NodeList\n\
    \n```\ndocument.getElementsByTagName(\"p\").length;\n// will return 3\n\n// checking\
    \ the length before executing script\nif(document.getElementsByTagName(\"p\").length\
    \ > 0) {\n  // it returns \"3\", and 3 is greater than \"0\", so we're good to\
    \ go.\n}\n```"
