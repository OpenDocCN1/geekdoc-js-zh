  md: "# Preventing Default Behavior\n\nPreventing default behavior is something you\
    \ need to do when executing JavaScript DOM elements that have another behavior\
    \ attached to them. For example, a link with an href value wants to go to another\
    \ page, or in our case, a form that wants to submit somewhere to do a search query.\n\
    \nPreventing default behavior is done inside the method. You first need to pass\
    \ the event (submit in our case) as an argument to the method. Then attach the\
    \ default() method to it. This is depicted in Listing 7.4.5, but also zoomed in\
    \ Listing 7.4.6.\n\n# Listing 7.4.6 A Zoomed-In Version of preventDefault\n\n\
    ```\nvar adr = {\n  search : function(event) {\n    event.preventDefault();\n\\\
    \    /* continue the rest of the method here */\n  }\n}\n```\n\n# keydown, keypress,\
    \ and keyup\n\nkeydown, keypress, and keyup refer to the user pressing the keys\
    \ on the keyboard. Keydown is the initial press, keyup is when the finger is lifted,\
    \ and keypress is somewhere in the middle. Keyup is the most popular of the three\
    \ events. For example: a person, inside a search box holding down the letter “u,”\
    \ a keydown event would return only a single “u,” whereas a keyup event would\
    \ create a behavior that is akin to using the string: The event tends to be more\
    \ accurate in getting text input, so it’s more widely used. These events are often\
    \ used to perform an autocomplete action on a search form.\n\nBecause an autocomplete\
    \ action is nothing more than a basic search with fewer letters, the search method\
    \ defined in Listing 7.4.5 will be 100% reusable for this purpose. The only modification\
    \ that needs to be made is at the listener level. Instead of using the submit\
    \ event, you need to use a keyup event. The event trigger of key events is as\
    \ follows:\n\n+   - keydown\n- keypress\n- keyup (you want to be right here)"
