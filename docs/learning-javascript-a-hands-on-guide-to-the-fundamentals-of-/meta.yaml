  md: "Enter/Return. In a select menu, the change event is triggered when a new value\
    \ or option is selected by clicking or by keyboard navigation.\n\nOur address\
    \ book doesn't have any use for the change event, but it is extremely useful to\
    \ have in your toolkit, and is attached in the same way all the other events are—via\
    \ listeners.\n\n# mouseover and mouseout (hovering)\n\nThe mouseover event triggers\
    \ when a user positions a cursor over an element. mouseout triggers in the opposite\
    \ case, when the user removes the mouse cursor from the same element. The combination\
    \ of these two events creates a complete hover effect.\n\nLet's go back to our\
    \ address book application and create a simple event behavior of adding a class\
    \ of \"hovering\" to the form on mouseover and removing that class from mouseout.\
    \ You can see in the HTML snippet in Listing 7.4 that we have reserved some CSS\
    \ for this class. Listing 7.4.4 shows how to add this behavior to the search form.\n\
    \n# Listing 7.4.4 Adding a Behavior to the Form\n\n```\n// save the element to\
