    removeItem


    My mom always taught me to clean up after myself, and I try to keep this in my
    head while

    designing and developing applications. The W3C, for mothers everywhere, added
    a method

    in Web storage to help you clean up after yourself; it is called “removeItem”.
    This method

    will delete the item stored locally with the user. It takes one argument, just
    like its companion

    method, getItem. Listing 5.15.2 depicts how to remove a locally stored item.


    Listing 5.15.2 Cleaning Up After Yourself


    ```

    /* delete stored data */

    localStorage.removeItem("favoriteSandwich"); // returns a happy mom :-

    ```


    Both localStorage and sessionStorage use the same syntax and methods. The only
    differ-

    ween the two objects is that localStorage will remain active until explicitly
    removed

    by you (the developer) or the user, by the browser preferences; it''s actually
    pretty difficult for

    a user to clear. sessionStorage acts differently because it is a session-based
    storage method,

    which means it will remove itself at the end of each browser session (when the
    browser is

    closed).'
