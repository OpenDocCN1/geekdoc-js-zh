  md: '# Chapter 2 JavaScript in the Browser


    first and repeating mistakes of the past unnecessarily. Learning history is the
    easiest to plan for the future. With that in mind, let''s take a brief look at
    where JavaScript came from; this will also help you when you''re having conversations
    about the language with other people. Many don''t take the time to learn this
    stuff—hopefully, you will.


    # Origins


    Most people will tell you that Java and JavaScript are completely anymore, unrelated.
    It''s true that they are different languages, but their paths are intertwined
    quite a bit. Without Java, there have been no JavaScript (or “LiveScript” as it
    was originally named). The original purpose fueling JavaScript was to create a
    language that would give easy control and access of Java Applets in the browser.
    We don''t use Java Applets anymore, they were basically interactive blocks in
    the middle of an HTML document, sometimes containing an entire application. It''s
    like the days version of Flash or HTML''s canvas element. JavaScript was intended
    to let designers hook into these without using a more intense language like Java.
    This initiative was championed by a little browser maker called Netscape in late
    1995 (parent company, Mozilla), you probably know them by their current name,
    Firefox.


    Even though the intention of JavaScript was to work with Java Applets, we all
    know that users never use the things we make the way they think. Designers started
    using JavaScript to change HTML, adding some behavior like roll-over effects to
    Web pages (we mostly do this with CSS now).


    The language had great success because of its existence and its dynamic nature.
    You could have a lot of cool stuff relatively quickly, which is the key to the
    success of any product. The support was poor; there were no tools to test code
    other than the browser, and there was a growing mountain of security holes with
    the browser implementations of the language, but people loved it. It continued
    to explode despite written off by traditional programmers as “not a real language.”
    That attitude, to an extent, still exists among the hardcore development community,
    but I can assure you, JavaScript is indeed a programming language. It becomes
    more and more evident with every passing year and with every added feature.


    With subsequent releases of browsers, many of the security holes in JavaScript
    were planned for and blocked in various ways. This created a slightly tainted
    perception of JavaScript with the public. When I was first starting out, the language
    was thought of as easily exploited, and many people around the community made
    an active decision to turn off JavaScript as they browsed the Web. This attitude,
    although fading quickly, still exists in pockets and is the driving reason it
    is best practice to be sure your content and applications are usable without JavaScript
    turned off.


    For a long time Internet Explorer did not support JavaScript, but rather used
    a proprietary language with the same intention of providing interaction with embedding
    page elements (like the Java Applets). They called it JavaScript. We all hated
    it, and it launched the bad practice of browser detection (which is still around
    in various forms). Designers would have to check the browser for JavaScript support,
    write the JavaScript, then either ignore Internet Explorer,'
