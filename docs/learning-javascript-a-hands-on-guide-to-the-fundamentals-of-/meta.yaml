  md: "# Listing 1.1.3 <head> Section of the HTML5 Document\n\n```\n<head>\n<title>Great\
    \ Home Page in HTML5</title>\n<meta charset=\"utf-8\">\n\n<!--CSS-->\n<link rel=\"\
    stylesheet\" href=\"css/styles.css\">\n\n</head>\n```\n\nIt is best to keep all\
    \ your CSS in one file, even though you could, in theory, attach as many as you\
    \ want. Linking any asset (CSS file, JavaScript file, image) to an HTML document\
    \ fires off what is called an HTTP request, which just means the browser to go\
    \ get the asset and download it before it's viewable to the user. It happens all\
    \ the time, and for the most part it's transparent. However, you still want to\
    \ minimize the number of HTTP requests; at some point it will start to go down\
    \ the performance (load time) of a site. If you can, you should keep all CSS contained\
    \ in a single file (one file = one HTTP request). Listing 1.1.4 is what your CSS\
    \ file might contain to be applied to the HTML in Listing 1.1 or Listing 1.1.1.\n\
    \n# Listing 1.1.4 CSS Contained in the styles.css File Referenced in Listing 1.1.3\n\
    \n```\n#nav {\n  background:#000;\n  padding:10px;\n  overflow:hidden;\n}\n\n\
    nav ul {\n  list-style:none;\n  margin:0;\n  padding:0;\n}\n\nnav li {\n  float:left;\n\
    }\n\nnav li a {\n  padding:0 10px; color:#fff;\n}\n```\n\nAdmittedly, this is\
    \ a pretty ugly design at this point, but that's okay because it illustrates the\
    \ point that that it is very easy to separate the structure of a document from\
    \ the way it looks. As you can see in Listing 1.1.4, we are adding some light\
    \ design to the navigation without touching the markup to convey it."
