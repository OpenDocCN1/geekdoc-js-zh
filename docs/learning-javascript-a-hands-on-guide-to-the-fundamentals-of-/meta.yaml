  md: "# Chapter 1 Progressive Enhancement\n\n> Note\nAs you re building a list of\
    \ any kind, you will often need to decide whether to use an unordered list. At\
    \ this point, we generally use unordered lists for navigation and simply move\
    \ on (because we figured that out). Most of the lists you work with probably be\
    \ unordered, but what about when you need guidance for a gray area? Here's a way\
    \ to make sure you're choosing the right kind of list: Ask yourself if list would\
    \ make sense if you were shuffle all the items. If the answer is \"yes,\" there\
    \ is no critical order; if the answer is \"no,\" you probably have something like\
    \ a ranking or a step-by-step recipe where the order truly matters (you can't\
    \ stick a cake in the oven before cracking the eggs and mixing the ingredients).\
    \ This can be tricky at times, so be careful when thinking about mixing the order\
    \ of the list items truly breaks the goal of the content. This will ensure that\
    \ you have a meaningful content structure.\n\n# Adding More Meaning with HTML5\n\
    \nThe document from Listing 1.1 is a perfectly valid and semantically marked-up\
    \ document, and it is a great starting point for any project. You could take that,\
    \ use it, and create a great product. However, with the influx of HTML5 recently,\
    \ we can now take this basic up one step closer to our goal of creating HTML that\
    \ contains meaning and communicates a true structure for CSS to run.\n\nNew elements\
    \ in HTML5 as <header>, <nav>, <section>, <article>, <aside>, and <footer> open\
    \ up opportunities for designers to further describe the content within an element.\
    \ Each of these new elements has special meaning and rules for it, whereas the\
    \ previously used <div> has very little or no semantic meaning. Let's take a look\
    \ at the same document in Listing 1.1.1, now marked up with full HTML5:\n\n# Listing\
    \ 1.1.1 HTML5 Document\n\n```\n<doctype html>\n<html>\n<head>\n  <title>Great\
    \ Home Page in HTML5</title>\n  <meta charset=\"utf-8\">\n</head>\n<body>\n\n\
    <!-- replacing DIV with the new HEADER element -->\n<header id=\"header\" role=\"\
