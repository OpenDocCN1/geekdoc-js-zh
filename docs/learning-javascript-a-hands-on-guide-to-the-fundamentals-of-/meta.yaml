  md: "source code where the elements are being targeted. These are very common methods\
    \ to use in jQuery, but it is important to remember that they are just more readable\
    \ shortcuts to native JavaScript methods.\n\n# Listing 10.2.5 First, Last, Next,\
    \ and Previous DOM Nodes\n\n```\n// get first module\n(\".module\").first().addClass('first-module');\n\
    \n// get next module\n(\".module\").next().addClass('second-module');\n\n// get\
    \ last module\n(\".module\").last().addClass('last-module');\n\n// get previous\
    \ module\n(\".module\").last().prev().addClass('second-to-last-module');\n```\n\
    \n# Adding Style Information\n\nGenerally speaking, adding style information to\
    \ the DOM through JavaScript is not a good idea. You can accomplish the same task\
    \ by adding a class to an element and using CSS from there, you should—it not\
    \ only performs better but also keeps styling information in the presentation\
    \ layer where it belongs.\n\nThere will be times, however, when you need to apply\
    \ dynamic styling to an element with JavaScript—for instance, a value that needs\
    \ to react to a moving cursor (drag-and-drop interface). jQuery makes adding style\
    \ information to a DOM very easy with the css() method. This method takes a single\
    \ argument, which is an object containing all the CSS you want to apply to an\
    \ element.\n\nIn Listing 10.2.6 you can see that we are adding a height of 300px\
    \ and a font color of red to all div elements with a class of module. Just any\
    \ CSS property can be added to a DOM node with this method. The syntax is important\
    \ to note for when we go over JavaScript animation (awesome, right)?\n\n# Listing\
    \ 10.2.6 Adding Style Information with jQuery\n\n```\n// set the height of all\
    \ nodes that have a class of module to 300px\n(\".module\").css({\n  'height':\
    \ '300px',\n  'color': 'red'\n});\n```"
