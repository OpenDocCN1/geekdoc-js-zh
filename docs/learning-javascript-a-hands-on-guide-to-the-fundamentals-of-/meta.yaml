  md: "In previous chapters, we spoke about adding a dynamic nature to functions by\
    \ passing arguments through them. With no parentheses, you can't pass any arguments\
    \ into the function, can you? No, but that's okay.\n\nIn order to pass arguments\
    \ into a function while usingEventListener(), you need to use the function as\
    \ a callback instead of nesting it inside an anonymous function. This may sound\
    \ a little confusing, but Listing 7.3.1 shows you how to use an anonymous function\
    \ and a-callback to achieve this goal.\n\n# 7.3.1 Calling a Listener with Arguments\n\
    \n```\n// save the DOM element you want to attach an event to\nvar btn = document.getElementById(\"\
    btn\");\n\n// define your function normally\nfunction alertMessage(message) {\n\
    \  alert(message);\n}\n\n// use a predefined function (event handler), \"alertMessage\"\
    \nbtn.addEventListener(\"click\", function() {\n  // callback function!\n  alertMessage(\"\
    clicked the button\");\n}, false);\n```\n\nAs you can see, Listing 7.3.1 is very\
    \ similar to Listing 7.3, but instead of simply calling a function, you can pass\
    \ parameters into it.\n\n# Unbinding Events\n\nJust like how you want to bind\
    \ (attach) events to DOM elements, sometimes you want to unbind (detach) events\
    \ from DOM nodes. Most of the time you'll probably attach an event and leave it\
    \ alone, but if you want to clean up after, you can certainly remove the listener\
    \ just as easily as you add it. Internet Explorer version 8 and earlier have their\
    \ own methods for removing events (detaching events). Listing 7.3.2 shows an example\
    \ of how to remove and detach an event similar to the way they are\n\n# 7.3.2\
    \ Removing an Event Listener\n\n```\nif(btn.removeEventListener){\n\n  // if removeEventListener\
    \ is supported\n  btn.removeEventListener(\"click\", alertMessage, false);\n```"
