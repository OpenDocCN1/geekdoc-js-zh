  md: "# touchstart and touchend\n\nThe paring of the touchstart and touchend are\
    \ very common because they mark opposite events. The touchstart event is triggered\
    \ when a user touches the screen, and the touchend event is triggered with the\
    \ opposite action of untouching the (removing whatever you touched from the screen;\
    \ if you touched the screen with your nose, it would execute when you remove your\
    \ nose from the screen).\n\nIn Listing 7.5.1 we're declaring a new object to contain\
    \ the touch-based events and creating two methods intended to be executed on the\
    \ touchstart and touchend events by inserting some text into the document's body\
    \ element.\n\nListing 7.5.1  Using a touch Event\n\n```\n/* Anonymous function\
    \ wrapper again! */\n(function(){\n  var body = document.getElementsByTagName(\"\
    body\")[0];\n\n  // declare an object to hold touch controls\n  var touchControls\
    \ = {\n\n    pokeTheScreen: function({\n      // output a message to the body\n\
    \      body.innerHTML += \"you just poked me, how rude!<br>\";\n    },\n    stopPokingTheScreen:\
    \ function() {\n      // output another message to the body\n      body.innerHTML\
    \ += \"please do not do that again.<br><br>\";\n    }\n  };\n\n  // add event\
    \ listeners to the body\n  body.addEventListener(\"touchstart\", touchControls.pokeTheScreen,\
    \ false);\n  body.addEventListener(\"touchend\", touchControls.stopPokingTheScreen,\
    \ false);\n});\n```\n\nIf you implement the methods in Listing 7.5.1 and view\
    \ them in a browser on a touch-capable device, you will see the text \"you just\
    \ poked me, how rude\" inserted into the body when you touch the screen and the\
    \ text \"please do not do that again\" inserted when you lift your finger off\
    \ the screen. You can repeat this behavior over and over with the same result."
