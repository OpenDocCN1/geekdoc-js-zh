  md: '# Chapter 2 JavaScript the Browser


    guide the creation of a Web that was not more pleasant from a user standpoint,
    but also much more maintainable from a developer/designer standpoint. There was
    no more guessing where an update needed to be made in the code; you knew exactly
    what layer change lived, and it was inevitably separated into its own cacheable
    file where the modifications could be isolated from the rest of the site or application.


    # The Behavior Layer


    Most of this book will be focused on the behavior layer of progressive enhancement
    and tearing it piece by piece, so it is important to understand the layer sits
    in the process, why it is there, and how to utilize its features. Be aware that
    there are good features and bad features. Browser of the mid-90s exposed a lot
    of security flaws in JavaScript, and I''m sorry to say that they aren''t getting
    fixed at the JavaScript level. With other languages, if there is a highly publicized
    security hole, a version patch will come out and fix it. Because JavaScript is
    executed in an environment you can''t control, this is very difficult to do without
    breaking a lot of sites. Unless you go to your grandmother''s house and manually
    upgrade her browser (I''ve done that), it is almost impossible to control. Since
    1995, there have been two major releases of JavaScript as an official language.
    The second one was very recent. With security holes never getting patched, it''s
    more about education than anything. Knowing what not to use can be very powerful.
    In this book you will learn the correct methods.


    Making the jump from inline functions to unobtrusive JavaScript was a struggle
    for some because it was a new way of attacking. Instead of using onClick events
    in HTML, you had to pull that out and start Event Listeners in an external JavaScript
    file. It was a new way of thinking and a large jump, moving CSS to an external
    file was not, because the syntax was often very similar. You didn''t have to learn
    anything new, but this wasn''t the case for unobtrusive JavaScript. It took a
    little to catch on, and it is something we fought against. You will still see
    it quite often in the wild.


    JavaScript as a language is far from perfect. As mentioned previously, it has
    a lot of flaws and inefficiencies, and it can sometimes feel like you''re trying
    to strangle a ball of yarn when coming to find a bug. But when you get that groove
    where you are all cylinders, your behavior layer is completely abstracted from
    structure and presentation, and your code is flying light and fast, you will find
    yourself creating a user experience like no other that is a delight for your users
    to click around and achieve their goals. A happy user is a repeat user. Treating
    JavaScript as a behavioral technology will help you create a mental model for
    effectively constructing your next project.


    # Moving Past Today


    The future of JavaScript obviously has not been written yet, but if you go into
    it with an open mind and a good understanding of its past, you will be able to
    remain flexible to mold into an industry with rapidly changing directions.


    JavaScript has come a long way since it was first conceived in 1995, and it still
    has a long way to go. We use it to create a more pleasant experience in the browser.
    We use it to send data'
