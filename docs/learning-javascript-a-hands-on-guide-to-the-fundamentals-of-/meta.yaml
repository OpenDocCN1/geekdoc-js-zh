    # Making Repeat Ajax Calls


    Creation of real-time data (that''s right, it''s an illusion) is something JavaScript,
    and particularly Ajax are both very good at. We already learned how to create
    and execute an Ajax call once, based on either the load of a page or a user-initiated
    event. But you can also create a system that can automatically make Ajax calls
    over and over.'
  merge: -1
  pgno: 184
- img_proc: false
  md: "This is a useful method when you're trying to create the real-time illusion.\
    \ I say “Illusion” because it not truly a 1 to 1 relationship when data is returned.\
    \ You can use the JavaScript object setInterval() to execute a block of code over\
    \ and over with a time between each call. Listing 8.6 shows how you would use\
    \ this method to execute a JavaScript alert every 5 seconds. The setInterval()\
    \ method takes two arguments. The first is whatever function you'd like to repeat,\
    \ and the second is how much time, in milliseconds, you want to pass in each call.\n\
    \n# Listing 8.6 Using setInterval\n\n+   /* alert a message every 3 seconds */\n\
    \n```\nsetInterval('fire off an AjaxCall(), 5000); // alert something every 5\
    \ seconds\n```\n\nThe same pattern can be applied to your ajaxCall() function\
    \ to fire the call off every 5 seconds. This process of constantly hitting the\
    \ server to check for new information is called polling. If we were pulling data\
    \ that was being constantly updated, it would be very valuable to poll the server\
    \ to refresh the data onscreen every few. Listing 8.6.1 shows how using setInterval()\
    \ with the ajaxCall() function might look. We don't have a lot of use for something\
    \ like this for the autocomplete form, but it is a powerful and frequently used\
    \ method when returning data from a server.\n\n# Listing 8.6.1 Using setInterval\
    \ with Ajax\n\n+   /* make this Ajax call every 5 seconds */\n\n```\nsetInterval('ajaxCall(\"\
    data/contacts.json\"),\n\nfunction() {\n\tconsole.log(\"made a call\");\n\n}),\
    \ 5000); // 5000 milliseconds = 5 seconds\n```\n\nBe careful when polling a server\
    \ for this way; although the illusion of realtime data is believable, hitting\
    \ a server from a high traffic website in too-short intervals can easily bring\
    \ a server to its knees.\n\n# Ajax Data Formats\n\nBecause the X in Ajax doesn't\
    \ stand for anything (especially not XML), Ajax can take one data format. Most\
    \ commonly, you will be dealing with three specific data formats: XML, HTML and\
    \ JSON. Each has positive aspects and negative aspects; knowing the difference\
    \ will help you choose the right tool for the job."
  merge: -1
  pgno: 185
- img_proc: false
  md: "# XML\n\nXML stands for eXtensible Markup Language. It is a very flexible data\
    \ format and immensely popular for use in application data. It is very similar\
    \ to HTML in its anatomy, containing a DOCTYPE, elements, tags, and attributes.\
    \ It even adheres to the same document object model as HTML.\n\nListing 8.7 depicts\
    \ how the contacts.json data file would look if it were converted into XML format.\n\
    \n# Listing 8.7 Example Data in XML Format\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<addressBook>\n\n<person>\n  <name>hillisha</name>\n  <email>hill@example.com</email>\n\
    </person>\n\n<person>\n  <name>paul</name>\n  <email>cleveland@example.com</email>\n\
    </person>\n\n<person>\n  <name>vishal</name>\n  <email>vish@example.com</email>\n\
    </person>\n\n<person>\n  <name>mike</name>\n  <email>grady@example.com</email>\n\
    </person>\n\n<person>\n  <name>jamie</name>\n  <email>dusted@example.com</email>\n\
    </person>\n\n</addressBook>\n```\n\n# Positives\n\nBeing an extensible format\
    \ is a huge plus for XML. You're not locked into any predefined structure because\
    \ you can define it as you go, as long as it is kept consistent throughout the\
    \ file. Adhering to the DOM standard is another positive aspect of XML. After\
    \ pulling the data"
  merge: -1
  pgno: 186
- img_proc: false
  md: "in through an Ajax call, it is parsed the same as a normal HTML document with\
    \ methods like getElementsByTagName(), getAttribute(), parentNode, firstChild,\
    \ and lastChild. Not having to relearn any new methods to parse XML makes it a\
    \ very attractive option.\n\n# Negatives\n\nBecause XML is so similar to HTML\
    \ and uses the same DOM standards, it can take a lot of code to parse through\
    \ and build the output.\n\nOne big drawback of using XML is that it cannot be\
    \ used cross-domain with Ajax. All Ajax calls to an XML data file must come from\
    \ the same domain or the request will fail. For this reason, you don't see a lot\
    \ of public data sources in XML format. If they were, you would need to create\
    \ a server-side proxy to pull in the XML and have the Ajax call reference by way\
    \ of the proxy.\n\n# HTML\n\nWorking with Ajax and HTML snippets couldn't be more\
    \ straightforward. You have an HTML file and you consume its contents in full\
    \ with an Ajax call. Listing 8.8 shows our JSON data in the form of HTML.\n\n\
    +   8.8 Example Data in HTML Format\n\n```\n<ul>\n  <li><a href=\"mailto:hill@example.com\"\
    >hillisha</a></li>\n  <li><a href=\"mailto:cleveland@example.com\">paul</a></li>\n\
    \  <li><a href=\"mailto:vish@example.com\">vishaal</a></li>\n  <li><a href=\"\
    mailto:grady@example.com\">mike</a></li>\n  <li><a href=\"mailto:dusted@example.com\"\
    >jamie</a></li>\n</ul>\n```\n\n# Positives\n\nSpeed is an important reason to\
    \ use this method. Unlike the other data formats, no client-side parsing is needed\
    \ because you're grabbing an entire snippet of HTML and outputting it into the\
    \ DOM. Not having to write a lot of extra JavaScript to parse the incoming HTML\
    \ will not only save you time as a developer, but it will save processing time\
    \ for the user.\n\n# Negatives\n\nUsing HTML as a data source works well when\
    \ you are asynchronously updating a single block of content in a document, but\
    \ it doesn't get you the fine-grained control that XML or JSON will give."
  merge: -1
  pgno: 187
- img_proc: false
  md: "# Ajax Data Formats 167\n\nUnless you're literally updating an HTML document\
    \ with a static block of content, which would be a little odd and, frankly, pretty\
    \ rare, you're going to have to do server-side processing to get the data you\
    \ want. This is generally the fastest way to do it, but if you like working in\
    \ server-side code, that might be something to consider as a downside of using\
    \ HTML as a data format.\n\n# JSON\n\nAhhhh, the wonderful world of JSON; we have\
    \ using JSON as a data format for most of the book, you should be pretty familiar\
    \ with it at this point. It's a very human-readable and machine-readable format,\
    \ which has no structural limitations. Each item in a JSON data format can be\
    \ different from all the others. In our data file, we are using a consistent structure\
    \ of name and, it doesn't have to be like that JSON doesn't force any real consistency\
    \ in its format.\n\nListing 8.9 shows the current JSON data we have been working\
    \ with so you can compare it to the XML and HTML versions in previous listings.\n\
    \n# Listing 8.9 Example Data in JSON Format\n\n```\n{\n  \"addressBook\": [\n\
    \    {\n      \"name\": \"hillisha\",\n      \"email\": \"hill@example.com\"\n\
    \    },\n    {\n      \"name\": \"paul\",\n      \"email\": \"cleveland@example.com\"\
    \n    },\n    {\n      \"name\": \"vishaal\",\n      \"email\": \"vish@example.com\"\
    \n    },\n    {\n      \"name\": \"mike\",\n      \"email\": \"grady@example.com\"\
    \n    },\n    {\n      \"name\": \"jamie\",\n      \"email\": \"dusted@example.com\"\
    \n    }\n  ]\n}\n```"
