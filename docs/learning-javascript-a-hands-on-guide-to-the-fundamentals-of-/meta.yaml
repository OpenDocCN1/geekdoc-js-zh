  md: "# Creating an Ajax Call\n\nCreating the Ajax object instance is a separate\
    \ step from creating the actual Ajax call. All we've done so far is say, \"We're\
    \ getting ready to work with some Ajax goodness.\n\n\nFor our application there\
    \ needs be a little preparation to convert it for with Ajax. The biggest change\
    \ will be the data source. Previously, the data has been stored inside a JSON\
    \ object within the main JavaScript file. Having the data right with the rest\
    \ of your JavaScript will provide the shortest response time but will prevent\
    \ your application from scaling from the five we've been using to something like\
    \ a more real-world address book containing hundreds of people. Your main JavaScript\
    \ file will quickly become difficult to manage. It is also pretty rare to have\
    \ all your data on hand like that; it is generally hosted somewhere else.\n\n\n\
    To create a more accurate situation, we're going to move all the contacts' JSON\
    \ data into an external file called contacts.json. The json file extension isn't\
    \ required, but it is best practice to use file extensions that describe the file's\
    \ contents. Because you already have a valid JSON format for the data, it's pretty\
    \ easy copy and paste into the external file. The only difference is that you'll\
    \ be removing the var statement. Listing 8.2 shows you what the contents of your\
    \ contacts.json file should look like.\n\n\n+   Listing 8.2 Contents of contacts.json\
    \ Data File\n\n```\n{\n  \"address\": [\n    {\n      \"name\": \"hillisha\",\n\
    \      \"email\": \"hill@example.com\"\n    },\n    {\n      \"name\": \"paul\"\
    ,\n      \"email\": \"cleveland@example.com\"\n    },\n    {\n      \"name\":\
    \ \"vishaal\",\n      \"email\": \"vish@example.com\"\n    },\n    {\n      \"\
    name\": \"mike\",\n      \"email\": \"grady@example.com\"\n    },\n    {\n   \
    \   \"name\": \"jamie\",\n      \"email\": \"dusted@example.com\"\n    }\n  ]\n\
