    \ invite people or order\n        \n    }\n})); // close anonymous function\n\
    ```\n\nFigure 9.2 Indentation set to a four-space increment.\n\n# # Whitespace\n\
    \nAs mentioned in the previous section, JavaScript doesn't have a standard surrounding\
    \ whitespace. To a certain extent, it's up to personal preference. Whitespace\
    \ should be used to increase the readability of your JavaScript. Using a lot of\
    \ extra whitespace will increase the size of your JavaScript document. Normally,\
    \ increasing the size of a document is a bad thing, but in this case (and also\
    \ with comments), it can be a good thing, or more likely, a nonissue.\n\nThere\
    \ are two types of files: development files and production files. Production files\
    \ live on the server and get sent out for consumption. Just like the concatenation\
    \ method mentioned earlier, you can do something called \"minification\" on the\
    \ server before a file goes live.\n\nMinification is the process of removing all\
    \ the whitespace from a document. Like concatenation, it is a server-side process.\
    \ When a JavaScript file is minified, all the comments and whitespace are removed,\
    \ and the file is shrunk down to a single line. A file is nearly impossible to\
    \ work with after it has been minified, which is why we have development versions\
    \ of your files as well. The development files will contain all the ample whitespace,\
    \ formatting, and comments you need to effectively work.\n\nListing 9.7 shows\
    \ a block of code (pizzaParty() function) with what I would call poor utilization\
    \ of whitespace. Keep in mind that using whitespace for readability is a completely\
    \ objective thing; what's good for one person may be horrible for another. This\
    \ is another situation where you may want to come to an agreement with other members\
    \ on how to best handle whitespace."
