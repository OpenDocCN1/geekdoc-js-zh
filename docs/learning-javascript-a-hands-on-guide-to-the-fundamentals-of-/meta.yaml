  md: '# A People''s History of JavaScript


    rewrite the functionality in JavaScript to create a consistent user experience.
    It was a terrible model, but everyone followed it for lack of a better way.


    This time in the front-end scripting world wasn''t all for nothing, Through the
    frustration of browser compatibility problems came a desire to create some form
    of Web standards and a common language that worked across many browsers. This
    first attempt at standardization/merging of JavaScript and Javascript was called
    ECMAScript. This new language was more of a standardized version of JavaScript,
    but we still called JavaScript, obviously, or that this book would be called Learning
    ECMAScript. But it didstart the conversation about the Web needing some form of
    standardization.


    This conversation also brought light problems with how browsers were creating
    the outline for an HTML document, whose inconsistencies were the root problem.
    At this point in history we started to see the power of current-day JavaScript
    take its form. This agreed-upon universal outline eventually created the document
    object model (DOM). Creating a truly virtual DOM led the Web back to its roots
    where the actual structure of the document was just—structure, without communicating
    any information about presentation. This was the first step toward true separation
    between structure, presentation, and behavior. As you learned in the previous
    chapter, it wasn''t until years later the official term for this was coined for
    Web and we entered the age of progressive enhancement.


    In 1999, Microsoft created the earliest stage of Ajax in the form of an ActiveX
    XMLHttpRequest, which allowed internal areas of an HTML document to be updated
    without refreshing the browser window, wasting valuable bandwidth. This feature
    was so popular and highly desired that other browser makers adopted it almost
    immediately under its current (technical) name, the XMLHttpRequest object. It
    wasn''t until 2005 that the term Ajax was coined, but the underlying technology
    is still the XMLHttpRequest object in JavaScript.


    All these standards, browser wars, and debates that happened throughout the years
    contributed to what you use in today. It is important to know what is going on
    right now, but it is equally important to learn about the origins, how we got
    to where we are, and the evolution of the language so you can recognize times
    when trends seem to be circling back to old ways. Knowing the history and being
    able to tell when a new technology is going to fail (because something already
    failed in the past) can save you lot of frustration in learning technologies that
    have shortsighted futures.


    # Progressive Enhancement


    As mentioned in the previous chapter, progressive enhancement is the layered approach
    when building for the Web, where the main focus is on accessibility of content
    and the user, rather than the browser (that''s graceful degradation). We use HTML
    for structure, CSS for presentation, and JavaScript for behavior. But you already
    know that from Chapter 1, “Progressive Enhancement,” There was lot of embedded
    and inline JavaScript happening throughout the Web. It makes very difficult to
    maintain, and this methodology helped'
