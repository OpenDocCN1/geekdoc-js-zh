  md: "# Attaching an Event\n\n```\nvar btn = document.getElementById(\"btn\");\n\n\
    // attach a \"click\" listener to the button\nbtn.addEventListener(\"click\",\
    \ function() {\n\n  // alert inside this anonymous callback function\n  alert(\"\
    clicked the button\");\n\n}, false);\n}();\n```\n\n# Browser Support\n\nSupport\
    \ is a caveat of using the addEventListener() method. It's one of the instances\
    \ where \"works it works where you expect it to work.\" **Internet Explorer 8\
    \ and earlier do not support** addEventListener(), but there is something that\
    \ functions in almost the same way. The method used in IE8 and earlier is called\
    \ attachEvent(); the most obvious difference between the two methods is that attachEvent()\
    \ takes only two arguments. It excludes the Boolean value because no event propagation\
    \ model available in IE. So it makes sense why the value didn't exist.\n\nBecause\
    \ there is no overlap in support of the two methods, it either exists or it doesn't;\
    \ you don't need to detect the browser version (which is bad, anyway), you can\
    \ detect for the presence of addEventListener() and modify your script with an\
    \ if statement accordingly. The method exists, use it; if not, use attachEvent().\n\
    \nListing 7.2.2 shows how to use an if statement to detect for the presence of\
    \ addEventListener and conditionally let the browser decide which method to use.\n\
    \n# Listing 7.2.2 IE Fallback Code for Listeners\n\n```\nvar btn = document.getElementById(\"\
    btn\");\n\nif(btn.addEventListener){\n\n  /* if eventListener is supported to\
    \ do this */\n  btn.addEventListener(\"click\", function() {\n\n    // alert inside\
    \ this anonymous callback function\n    alert(\"clicked the button\");\n  });\n\
    \n}, false);\n```"
  merge: -1
  pgno: 148
- img_proc: false
  md: "```\n) else {\n/* if it's not supported do this (for IE8 and below) */\nelement.attachEvent(\"\
    click\", function() {\n\n  // alert inside this anonymous callback function\n\
    \  alert(\"Clicked the button\");\n\n});\n}\n```\n\nThe method of detection in\
    \ Listing 7.2.2 works because in an unsupported browser, btn.\naddEventListener\
    \ will return as undefined and the if statement will continue onto the else\n\
    portion of the statement.\n\n# Binding Events\n\nWhen binding (attaching) events\
    \ to DOM elements, there are a few weird things to note.\nRemember that when a\
    \ function is nested inside an object, it's actually called a method? Well,\n\
    sothing similar is going with event listeners and event binding.\n\nWhen a function\
    \ is inside an addEventListener method(), it's called an event listener.\nIt's\
    \ still a function when it's outside the addEventListener method(), but when it's\
    \ in the\ncontext of that particular method is referred to as an event listener.\
    \ it's the listener's\nadding to the event.\n\nThere is one other strange thing\
    \ about calling functions inside the addEventListener()\nmethod. They don't have\
    \ parentheses like they've had up to this point in the book. Because the\npheses\
    \ mean \"call this now\" and we don't want to do that in a listener, you leave\
    \ them\noff. Listing 7.3 shows how to use a predefined function as a listener\
    \ dropping the parenthe-\ns. If the parentheses were to be left on, the function\
    \ would execute immediately on load\nof page, even if it's inside the addEventListener()\
    \ method.\n\n# Listing 7.3 Binding an Event to a DOM Element\n\n```\n// save the\
    \ DOM element you want to attach an event to\nvar btn = document.getElementById(\"\
    btn\");\n```\n\n```\n// define your function normally\nfunction alertMessage(){\n\
    \  alert(\"clicked the button\");\n}\n```\n\n```\n// or use a predefined function\
    \ (event handler), \"alertMessage\"\nbtn.addEventListener(\"click\", alertMessage,\
    \ false);\n```"
