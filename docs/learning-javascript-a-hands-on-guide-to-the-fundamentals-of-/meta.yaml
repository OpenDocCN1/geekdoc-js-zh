  md: '# Sending Credentials


    The last two arguments in the open() method are reserved for a username and password.
    We would use these arguments when implementing an Ajax call on a sign-in or registration
    form (for example). Whenever you send password information with this method, it
    is important to make sure the data is encrypted for better security. Even though
    you would use a POST method and the URL wouldn''t be exposed publicly, encryption
    is equally important as it is when coding on the server.


    # send()


    After all the data for your Ajax call has been properly prepared in the open()
    method, you can use the send() method to shift off the data and begin waiting
    for the readyState property to let you know when the Ajax call is ready to be
    used.


    In Listing 8.3.1 you see the Ajax call getting built out. We now have the Ajax
    object, the open() method gathering the data, and finally the send() method firing
    off the actual call.


    # Listing 8.3.1 Sending the Actual Data


    ```

    var request = getHTTPObject();


    /* Get all the information ready to go */

    request.open("GET", "data/contacts.json", true);


    /* initiate actual call */

    request.send(null);


    /* OR - initiate the call with some data */

    request.send("hello data");

    ```


    You may have noticed that we''re passing null into the send object, which means
    that we''re not sending any extra data with the Ajax call. We just want the file.


    If you were using back-end processing on the data URL, you can pass the extra
    filtering information through the send() method. Listing 8.3.2 shows something
    like that may look like for a search result.


    # Listing 8.3.2 Sending Extra Data for Server-Side Filtering


    ```

    var request = getHTTPObject();


    /* Get all the information ready to go */

    request.open("GET", "search.php", true);


    /* initiate actual call and filter by the term "hill" */

    request.send("searchterm=hill");

    ```'
