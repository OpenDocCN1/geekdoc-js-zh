  md: '# Listing 4.4.1 Using getElementsByByClassName


    ```

    // returns all elements with a class of dropcap

    document.getElementsByByClassName("dropcap");

    ```


    ```

    // returns all elements with both "dropcap" and "huge" classes (1 in our example)

    document.getElementsByByClassName("dropcap huge");

    ```


    ```

    // returns all elements classed with "huge" that are inside elements ID''d with
    "e" (1 element in our example - the span)

    document.getElementsByById("e").getElementsByByClassName("huge");

    ```


    We have a little more flexibility with this than we do with some of the others,
    because it''s much newer to JavaScript. But as you can see, this can be a very
    helpful method.


    # Support


    As mentioned, this is a pretty new addition to the JavaScript family. It is where
    things start to get a little dice; I will say that support is very good right
    now, but not at 100%. At the time of this writing, all current browser versions
    support this method. When we need to start back in time a little, we notice support
    begins to weaken. The browsers you''ll be concerned with are likely IE 8 and earlier,
    but let''s take a look at the support table, Table 4.1.


    | Table 4.1 Browser Support for getElementsByClassName |

    | Internet Explorer | 9.0 & up |

    | Firefox | 3.0 & up |

    | Chrome | 4.0 & up |

    | Opera | 9.5 & up |

    | Safari | 3.1 & up |


    Because this method was highly sought after for so long, other developers in the
    community have created custom functions to handle the getElementsByClassName method
    in the case of no support. Every JavaScript library/framework available right
    now has also addressed this issue, in different ways. Later on in the book we
    will get into extending JavaScript libraries. In cases where support is lacking
    in older browsers, a library or custom function fallback is a good way to ensure
    that all users will get a similar experience, regardless of how they view your
    site/application.


    # Using CSS Selectors in JavaScript to Target Nodes


    The desire to use easy-to-remember CSS selectors in JavaScript came to fruition
    in 2009 when JavaScript guru John Resig developed the Sizzle Selector Library.
    Sizzle allowed us to maintain'
