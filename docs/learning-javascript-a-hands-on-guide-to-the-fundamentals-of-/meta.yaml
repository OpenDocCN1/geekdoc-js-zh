  md: "# Listing 6.5.3 Basic if Statement\n\n/* if \"hillilla\" comes up, add an exclamation\
    \ point to the end */\n\n```\nif(name === \"hillilla\"){\n    target.innerHTML\
    \ += '<p<a href=\"mailto:' + email + '\\'\">' + name + '</a></p>';\n}\n```\n\n\
    Note that we are using \"===\" in the conditional to check if the names match\
    \ what we're looking for. This triple equal operator signifies an exact match.\
    \ It is also a double equal sign (==) you can use that means \"match\". It's best\
    \ practice to use === rather than == because it's more specific, and when dealing\
    \ in Boolean values it can get confusing true = 1 and false = 0. Therefore if\
    \ you're looking for a \"false\" Boolean value, using a double equal sign would\
    \ not only return what you're looking for, but a \"0\" would do the same. In a\
    \ nutshell, use the == operator and not the == operator and you won't hit that\
    \ weird gray area of false 0 and true 1 when dealing with Booleans.\n\n# if/else\
    \ Statement\n\nIn Listing 6.5.3 the output was only a single person's name because\
    \ the condition was set to handle only one instance of name === \"hillilla\".\
    \ Normally you will want to something for the rest of the people in your address\
    \ book as they are outputed. The if/else state-ment is for that purpose.\n\nThe\
    \ if/else statement gives you the capability to create multiple conditions and\
    \ then a fallback condition for any items that don't meet the conditions' criteria.\
    \ In Listing 6.5.4 you can see that we are still looping through the address book\
    \ JSON object, but this time we're setting three conditions:\n\n+   - if name\
    \ is hillilla\n- if name is paul\n- everyone else\n\n# Listing 6.5.4 if/else Statement\n\
    \n```\nif(name === \"hillilla\"){\n\n/* if \"hillilla\" comes up, add an exclamation\
