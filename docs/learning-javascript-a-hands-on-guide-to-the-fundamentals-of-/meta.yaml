  md: "134 Chapter 7 Interacting with the User Through Events\n\n```\n// save the\
    \ button to a variable\nvar btn = document.getElementById(\"get-all\");\n```\n\
    \n```\n// activate the click event on your button\nbtn.addEventListener(\"click\"\
    , addr.getAllContacts, false);\n```\n\nThe only difference between this example\
    \ and the loop you created in the previous chapter is that this is nested inside\
    \ a method, which is inside an object. Toward the end you can see that we're saving\
    \ the button to a variable and then binding a click to it. If you try this in\
    \ the browser now, it should output your contacts inside the \"output\" <div>\
    \ we created in the HTML.\n\n# focus and blur\n\nBesides click, using focus and\
    \ blur are the most common types of events when building a JavaScript application.\
    \ The Web is made up of a bunch of links and forms, and link and forms are what\
    \ we work with the focus and blur events. A good example of a focus/blur action\
    \ is activating a search input field. Either by clicking in or using the Tab to\
    \ navigate to it be a \"focus\", and whenever you deactivate the search box input\
    \ field (such as clicking off it), that is a blur event.\n\nThink of focus and\
    \ blur like click and unlock (if you could uncomment). They are opposite behaviors\
    \ that mostly relate to forms and elements, but they also can be applied to links.\
    \ Because some elements work well with focus and blur some don't, you first need\
    \ to know whether an element is focusable before you attach this event to it.\
    \ How do you tell if an element is focusable? Tab through a page; if you can reach\
    \ the element you want, then it is focusable. If you're looking for a general\
