  md: "Just as you can get the children of an element node, you can also get its parent\
    \ (or parents), and they all have parents. Let's take a look at the HTML in 4.8\
    \ and assume that we want to get the parent element for the target node and add\
    \ a class of “active” to it.\n\n# Listing 4.8 Basic HTML Example of Navigation\n\
    \n```\n<ul id=\"nav\">\n  <li><a href=\"/\" id=\"Home\">Home</a></li>\n  <li><a\
    \ href=\"/about\" id=\"about\">About Us</a></li>\n  <li><a href=\"/contact\" id=\"\
    contact\">Contact Us</a></li>\n</ul>\n```\n\nUsing the JavaScript in 4.8.1, you\
    \ can execute the desired behavior.\n\n# Listing 4.8.1 Targeting a parentNode\n\
    \n```\n// target the \"about\" link and apply a class to its parent list item\n\
    document.getElementById(\"about\").parentNode.setAttribute(\"class\", \"active\"\
    );\n```\n\nBesides moving in a parent-relationship (up and down), you can also\
    \ move side to side in the DOM and target nodes that sit next to a target node.\
    \ These are called siblings, and two special methods allow us to target them:\
    \ previousSibling and nextSibling. In our example we still want to target the\
    \ About Us link, but instead of adding a class to the parent element, we add a\
    \ class to Home (previousSibling) and Contact Us. We could use the JavaScript\
    \ in 4.8.2.\n\n# Listing 4.8.2 Adding a Class to Previous and Next Sibling Nodes\n\
    \n```\n// get \"about\" parent, then its previous sibling and apply a class\n\
    document.getElementById(\"about\").parentNode.previousSibling.setAttribute(\"\
    class\",\n\"previous\");\n```\n\n```\n// get \"about\" parent, then its next sibling\
    \ and apply a class\ndocument.getElementById(\"about\").parentNode.nextSibling.setAttribute(\"\
    class\", \"next\");\n```\n\nThe JavaScript from Listings 4.8.1 and 4.8.2 should\
    \ generate the HTML in Listing 4.8.3.\n\n# Listing 4.8.3 Generate HTML After Adding\
    \ Classes\n\n```\n<ul id=\"nav\">\n  <li class=\"previous\"><a href=\"/\" id=\"\
    home\">Home</a></li>\n  <li class=\"active\"><a href=\"/about\" id=\"about\">About\
    \ Us</a></li>\n  <li class=\"next\"><a href=\"/contact\" id=\"contact\">Contact\
    \ Us</a></li>\n</ul>\n```"
