  md: '# Attribute Nodes


    Attribute nodes, like the document node, are easy to overlook when building your
    DOM because they appear to be part of the element, they''re an entirely different
    type of node, and are extremely important. They''re also treated differently than
    text and element nodes. In Figure 4.5, you can see the attribute node called separately
    from the element node.


    ![](bbox=[0.168, 0.233, 0.873, 0.375])


    Figure 4.5 Illustrating the position of an attribute node in relation to an element
    node


    Like text nodes cannot have children (it''s a sad story), they''re also not children
    themselves. That''s right, attribute nodes are not considered to be children of
    their containing element; it''s a little odd, but stick with me here. They sit
    in the DOM structure under element nodes because they''re always attached to element
    nodes, but they are not children—they are treated and accessed differently. (Paul
    Newman in *Cool Luke*.) They do their own thing against the norm and refuse to
    conform. This is why the attribute nodes have their own methods in JavaScript.
    We use basic methods to get an attribute, but after we get there we have to use
    special methods to get inside. This may seem a little confusing, but when you
    get used to it, it''s actually nice to have them separate.


    When writing efficient JavaScript (don''t worry, you will be by the time we get
    done), you''ll be constantly adding and removing classes from element nodes, and
    this is where we''ll be heavily using attribute nodes. Let''s take a look at last
    type of node, the attribute node, highlighted in the DOM model in Figure 4.6.


    # Working with the Element Node


    Now that we have a solid understanding of exactly what the DOM is and how parent-child
    relationships are built, we can start accessing it. Every node we talked about
    can be reached in some way. Some are easier than others, I assure you, if something
    is listed in the DOM, we can grab it and store or modify it with JavaScript.


    As mentioned in previous chapters, because of browser weirdness, performance in
    JavaScript is a constant issue, especially when moving through the DOM. You always
    want to minimize the amount of nodes that need to be evaluated to get where you
    need to be in the document. Knowing the different ways to jump into the DOM and
    finding the most efficient access points may seem like a trivial thing, but every
    millisecond counts when we''re talking about creating a good user experience,
    so we want to do this as fast as possible.'
