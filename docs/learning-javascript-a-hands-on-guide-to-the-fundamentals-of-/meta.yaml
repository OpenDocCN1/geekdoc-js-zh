  md: "# Removing an Attribute\n\nRemoving an attribute is as simple as getting one.\
    \ We just target the element node and use the removeAttribute() to get it out\
    \ of there. There are no JavaScript exceptions thrown if you try to remove an\
    \ attribute that doesn't exist, but it's still a best practice to use the same\
    \ hasAttribute() method mentioned earlier, shown in Listing 4.6.4.\n\nListing\
    \ 4.6.4 JavaScript Used to Remove the Class Value of Our Image\n\n```\n// first\
    \ we target the element and check if it has a class on it\nif(document.getElementById(\"\
    plc\").hasAttribute(\"class\")) {\n    // after we know a class exists, we can\
    \ then remove it\n    document.getElementById(\"plc\").removeAttribute(\"class\"\
    );\nn}\n```\n\nIn this example, we simply removed the class from our image.\n\n\
    +   - These methods have full support in all browsers and are okay for you to\
    \ freely use in all browsers.\n\n# Working with the Text Node and Changing Content\n\
    \nNow that we have stepped through both element and attribute nodes, we can move\
    \ onto the last type of node, the text node. When you're working with text nodes,\
    \ most of the work you will be doing is modification of the content. There is\
    \ also no traveling about inside a text node, because it can't have any children.\
    \ Some aspect the ways you will be interacting with these nodes is similar to\
    \ the way you interact with the attribute node. You will be modifying, getting,\
    \ and removing them, but using other methods to do so.\n\nChanging content is\
    \ extremely common with JavaScript. Whether it's for a button toggle value or\
    \ the Ajax loading of content, you will find inserting text or HTML into the DOM\
    \ from time to time. If you want to change or modify all the content in an area\
    \ rather than parsing through the DOM, you can do it in one sweep with the JavaScript\
    \ method innerHTML. There are a lot of benefits to this method, notably performance.\
    \ It is a lot faster to wipe a large chunk of information than it is to do the\
    \ same thing on each individual DOM node you want to replace. In Listing 4.7 you\
    \ will see the HTML snippet this example will be working."
