  md: '# Listing 1.1.9 Using a Media Query in CSS


    ```

    @media only screen and (max-width:480px) {


    /* do something to the design for small screens */

    }

    ```


    The goal of a media query is to detect the screen or window size of the device
    the user is using to view your site or application. In the preceding example,
    you are detecting for a maximum screen size of 480px; then inside the brackets,
    you adjust the design (in the presentation layer) to fit the smaller screen size.
    The best part is that it is device-independent, so you can activate these media
    queries by resizing your browser window to 480px.


    Unless you have made serious structural changes to your document for a mobile
    version of your site, you can use these media queries to reflow the layout or
    make small tweaks to the design to optimize it on a smaller screen device. This
    lets you maintain the progressive enhancement layer stack by applying all changes
    in the design.


    Using a media query is very fast and lightweight to target a user on a smaller
    screen. These are great because they not only apply to mobile devices, but also
    to any device with a smaller screen, such as a notebook. They help a great deal
    in preventing horizontal scrolling, not to mention the user possibly feeling cramped
    when using a smaller browser window, while still presenting a usable design.


    > Note If you loaded the example to this point on a phone, you would notice that
    your media query isn''t working. The Web page probably looks all zoomed out, and
    this obviously isn''t what we''re looking for. There is an HTML meta element that
    you need to add to the <head> of your document to make sure this initial zoom
    happens and media queries work as expected. That element looks like:

    <meta name="viewport" content="width=device-width, initial-scale=1">


    As much as we want it to, a small screen doesn''t necessarily mean a touch device.
    Even a small screen that supports media queries may not be a touch device. So
    this method may work well for general design and layout, it basically transfers
    over into interface design. Some user interactions, drag and drop, work fine on
    a device with a small screen—as long as there''s also a pointing device. With
    a touch-only device, drag and drop are woefully inadequate. There is also the
    possibility that media queries might be unsupported by a given device. Depending
    on your audience, you may want to explore another option.


    # The Touch Interface


    Touch interfaces are awesome, right? They are the wave of the future. But the
    way we interact with a touch-enabled device is a lot different from a nontouch
    device.'
