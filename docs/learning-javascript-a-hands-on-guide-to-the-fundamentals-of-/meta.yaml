  md: "# Setting an Attribute\n\nAn attribute is valuable in many instances, whether\
    \ you're temporarily saving data, setting a class, or replacing an attribute with\
    \ something new. This method has a built-in statement, so we don't need to run\
    \ our conditional on unless we want to do something other than just retrieving\
    \ an attribute value.\n\nThis method takes two arguments—the first is the name\
    \ of the attribute you want to set, and the second is the value you want to set\
    \ it to. See Listing 4.6.2.\n\n+   Listing 4.6.2 JavaScript Used to Set the Class\
    \ Attribute of Our Image\n\n```\n// replace the current class with a value of\
    \ \"hidden\"\ndocument.getElementById(\"plc\").setAttribute(\"class\", \"hidden\"\
    );\n\n// add a new attribute to the image\ndocument.getElementById(\"plc\").setAttribute(\"\
    title\", \"we moved this element off-screen\");\n```\n\nIn this example, we changed\
    \ the class from \"visible\" to \"hidden\" and, for better accessibility and screen\
    \ readers, the class already existed, we added a title to let them know we're\
    \ not displaying this image anymore. The title attribute, on the other hand, was\
    \ not already on the element, so we created it for us (you just created your first\
    \ node in the DOM—conats!). Changing display properties likewise allows us to\
    \ maintain the separation between presentation and behavior that we speak about\
    \ Chapter 1 with progressive enhancement. With this example, you might consider\
    \ the following CSS in Listing 4.6.3.\n\n+   Listing 4.6.3 CSS to Apply to Our\
    \ Image\n\n```\n/* this is the default state of the image */\n.visible {\n  position:\
    \ static;\n}\n\n/* this is applied when our class is changed and moves the image\
    \ out of view */\n.hidden {\n  position: absolute;\n  top: -9999px;\n  left: -9999px;\n\
    }\n```\n\n> Note\nIt's important not to use display: none when working like this\
    \ in CSS because screen readers cannot view content that is set to display: none.\
    \ That is why we choose to hide content like this by simply moving it off the\
    \ screen."
