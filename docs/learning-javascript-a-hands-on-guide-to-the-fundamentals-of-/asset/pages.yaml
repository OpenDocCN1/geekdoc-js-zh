  md: "# Creating a JavaScript Template Within the DOM\n\nNow that all JavaScript\
    \ is set up, let's jump into the HTML document from Listing 12.7, and by using\
    \ Mustache's special template syntax, we'll add some actual content into the <script>\
    \ element we previously left.\n\nWhether you use Mustache or one of the other\
    \ JavaScript templating systems, you will inevitably encounter slight differences\
    \ in the syntax of the templating language, but the concepts are all the same.\
    \ Mustache uses double braces: {{object}} to signify an object that needs to be\
    \ parsed. Listing 12.7.3 shows you the simple template you would need to output\
    \ a list of names from the addressBook JSON object that returned in the Ajax call.\
    \ If you were to run this program, you would see the same output created from\
    \ the examples in Chapter 8, \"Communicating with the Server Through Ajax,\" but\
    \ now rendered as a mustache template.\n\n# Listing 12.7.3 Mustache Templates\
    \ to Be Added to the HTML\n\n```\n<script type=\"text/x-mustache-template\" id=\"\
    mustache-template\">\n<ul>\n  {{addressBook}}\n  <li><a href=\"mailto:{{email}}\"\
    >{{name}}</a></li>\n  {{/addressBook}}\n</ul>\n</script>\n```\n\nMustache will\
    \ parse the information inside the <script> element as a template and then pair\
    \ each {{object}} with its counterpart in the JSON data we called in (the second\
    \ argument in the to_html method). You probably noticed that {{addressBook}},\
    \ {{email}}, and {{name}} are the same objects used in contacts.json. This is\
    \ no coincidence. The objects in your JavaScript template need to match the objects\
    \ in your data source. The data source needs to be an external file brought in\
    \ through an Ajax call; it can also be embedded in the main JavaScript file, but\
    \ using JavaScript templates with Ajax is one of the most common use cases.\n\n\
    In Listing 12.7.4, you can see the contents of contacts.json and how each object\
    \ in the JavaScript template also exists in the JSON data.\n\n# Listing 12.7.4\
    \ Mapping Mustache Template to the Data\n\n```\n{\n  \"addressBook\": [\n    {\n\
    \      \"name\": \"hillisha\",\n      \"email\": \"hill@example.com\"\n    },\n\
    \  {\n    \"name\": \"paul\",\n```"
