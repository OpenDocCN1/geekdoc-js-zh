  md: "One such area you might explore that is gaining a lot of traction right now\
    \ is the concept of using JavaScript as a layout engine to structure a document\
    \ that is being built from a data feed. This is called using JavaScript templates.\n\
    \n# JavaScript Templates\n\nJavaScript templates are used to process and structure\
    \ data inside an HTML document. They function in a very similar way to the view\
    \ level of an MVC framework (back-end code stuff). JavaScript templates are blocks\
    \ of HTML with special hooks built in, wrapped in a `<script>` element inside\
    \ the HTML document. The intention of JavaScript templates is to parse imported\
    \ data, which it's loaded through an Ajax call or data embedded into an object\
    \ in the main scripting file.\n\nThroughout the book you have read about progressive\
    \ enhancement and how important it is to keep the three layers separated. At the\
    \ same time, you have seen HTML in our JavaScript file while looping through data\
    \ and outputting it to the DOM. This creates a little bit of a conflict with the\
    \ methodology when the layers get intertwined like. JavaScript templates address\
    \ this issue in a very direct way.\n\nOne of the major problems with parsing large\
    \ amounts of data is that you might end up with a JavaScript file containing a\
    \ disproportionate amount of HTML snippets that are used to output the data into\
    \ the DOM. You experienced this issue in the autocomplete search form we built\
    \ when we were looping through and outputting the data. Listing 12.7 shows the\
    \ JavaScript snippet we built displaying the HTML code that is embedded in the\
    \ data loop.\n\n# Listing 12.7 HTML in JavaScript (Snippet from autocomplete Search\
    \ Form)\n\n```\nif(count > 0 && searchValue != \"\") {\n\n  // loop through the\
    \ contacts\n  for(i = 0; i < count; i = i + 1) {\n\n    // look through the name\
    \ value to see if it contains the searchterm string\n    var obj = addBook(ij);\n\
    \    isItFound = obj.indexOf(searchValue);\n\n    // anything other than -1 means\
    \ we found a match\n    if(isItFound != -1) {\n      target.innerHTML += '<p>'\
    \ + obj.name + ', <a href=\"mailto:' + obj.email + ' \">' + obj.email + '</a></p>';\n\
    \    }\n  }\n\n} // end for loop\n```\n\n// end count check"
  merge: -1
