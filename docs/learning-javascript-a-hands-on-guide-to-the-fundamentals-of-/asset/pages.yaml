  md: '# The JavaScript APIs


    HTML5 isn''t just HTML—there are a lot of JavaScript hooks into the language and
    a handful of new features, such as the data storage methods we explored earlier,
    localStorage() and sessionStorage(), which are both JavaScript APIs in the HTML5
    specification.


    As we step through some of the JavaScript APIs built into HTML5, there will be
    those you''ve probably heard of, like location-based services, media embedding,
    and server communication. As I mentioned, they''re familiar because they predicate
    HTML5. Some of the APIs we''ll be exploring the formalizations of these concepts.


    # The navigator Object


    The navigator object is a root-level object in JavaScript that reports back information
    whichever browser a user is visiting with. It''s been around for a long time,
    so the navigator object by itself isn''t anything revolutionary, but it does return
    some helpful information:


    +   - Browser name

    - Browser version

    - Platform

    - If cookies are turned on or off

    - If Java is enabled

    - User string


    Previous to HTML5, that''s the only information the navigator object would report
    back; in the post-HTML5 world, let''s take a look at all the data we have now.
    Listing 11.2 shows a JavaScript console log that is being passed the navigator
    object.


    Listing 11.2 Sending the navigator Object to the JavaScript Console for Analysis
    console.log(navigator);


    If you run the code from Listing 11.2 in a browser and open the debug, you will
    be able to see all the information currently being returned in the navigator object.
    As you will see, it''s a lot more than it used to be. Figure 11.2 shows the console
    log from Firefox 11.


    Exploring the navigator object is kind of prop for discovering new browser features,
    because this is where lot of the new items get added as browser information. As
    you can see, the Geolocation API lives inside this object, but as you search down
    the list you see some that you may not recognize, such as mozBattery and mozVibrate.
    These are some of the newest features added to the browser, and we will get to
    explore them in a little more detail when we go over the Device API later in the
    chapter.'
