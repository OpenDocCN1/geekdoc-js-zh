  md: "# Attaching an Event\n\n```\nvar btn = document.getElementById(\"btn\");\n\n\
    // attach a \"click\" listener to the button\nbtn.addEventListener(\"click\",\
    \ function() {\n\n  // alert inside this anonymous callback function\n  alert(\"\
    clicked the button\");\n\n}, false);\n\n();\n```\n\n# Browser Support\n\nSupport\
    \ is a caveat of using the addEventListener() method. It’s one of the instances\
    \ where “it works where you expect it to work.” Internet Explorer 8 and earlier\
    \ do not support addEventListener(), but there is something that functions in\
    \ almost the same way. The method used in IE and earlier is called attachEvent();\
    \ the most obvious difference between the two methods is attachEvent takes only\
    \ two arguments. It excludes the capture Boolean value because Internet Explorer\
    \ 9, there was no event propagation model available in IE. So makes sense why\
    \ the value didn’t exist.\n\nBecause there is no overlap in version of the two\
    \ methods, it exists or it doesn't; you don't need to detect the browser version\
    \ (which is bad, anyway), you can detect for the presence of addEventListener()\
    \ and modify your script with an if statement accordingly. If the method exists,\
    \ use it; if not, use attachEvent().\n\nListing 7.2.2 shows how to use an if statement\
    \ to detect for the presence of addEventListener and conditionally let the browser\
    \ decide which method to use.\n\n# Listing 7.2.2 IE Fallback Code for Listeners\n\
    \n```\nvar btn = document.getElementById(\"btn\");\n\nif(btn.addEventListener)\
    \ {\n\n  /* if eventListener is supported do this */\n  btn.addEventListener(\"\
    click\", function() {\n\n    // alert inside this anonymous callback function\n\
    \    alert(\"clicked the button\");\n  });\n\n}\n}, false);\n```"
  merge: -1
