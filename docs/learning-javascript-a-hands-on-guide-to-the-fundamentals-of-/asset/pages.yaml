  md: "# XML\n\nXML stands for eensible Markup Language. It is a very flexible data\
    \ format and immensely popular for use in application data. It is very similar\
    \ to HTML in its anatomy, containing a DOCTYPE, elements, tags, and attributes.\
    \ It even adheres to the same document model as HTML.\n\nListing 8.7 depicts how\
    \ the contacts.json data file would look if it were converted into XML format.\n\
    \nListing 8.7 Example Data in XML Format\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<addressBook>\n  <person>\n    <name>hillisha</name>\n    <email>hill@example.com</email>\n\
    \  </person>\n  <person>\n    <name>paul</name>\n    <email>cleveland@example.com</email>\n\
    \  </person>\n  <person>\n    <name>vishaal</name>\n    <email>vish@example.com</email>\n\
    \  </person>\n  <person>\n    <name>mike</name>\n    <email>grady@example.com</email>\n\
    \  </person>\n  <person>\n    <name>jamie</name>\n    <email>dusted@example.com</email>\n\
    \  </person>\n</addressBook>\n```\n\n# Positives\n\nBeing an extensible format\
    \ is a huge plus for XML. You're not locked into any predefined structure because\
    \ you can define it as you go, as long as it is kept consistent throughout the\
    \ file. Adhering to the DOM standard is another positive aspect of XML. After\
    \ pulling the data"
