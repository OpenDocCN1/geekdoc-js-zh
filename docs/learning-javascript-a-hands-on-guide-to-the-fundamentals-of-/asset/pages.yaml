  md: "# Chapter 8 Communicating with the Server Through Ajax\n\nThis is a useful\
    \ method when you're trying to create the real-time illusion. I say “Illusion”\
    \ isn't truly a 1 to 1 relationship when data is returned. You can use the JavaScript\
    \ object setInterval() to execute a block of code over and over with a time between\
    \ each call. Listing 8.6 shows how you would use this method to execute a JavaScript\
    \ alert every 5 seconds. The setInterval() method takes two arguments. The first\
    \ is whatever function you'd like to repeat, and the second is how much time,\
    \ in milliseconds, you want to pass in between each call.\n\nListing 8.6 Using\
    \ setInterval\n\n```\n/* alert a message every 3 seconds *\nsetInterval('fire\
    \ off an AjaxCall', 5000); // alert something every 5 seconds\n```\n\nThe same\
    \ pattern can be applied to your ajaxCall() function to fire the call off every\
    \ 5 seconds. This process of constantly hitting the server to check for new information\
    \ is called polling. If we were pulling data that was being constantly updated,\
    \ it would be very valuable to poll the server to refresh the data every onscreen\
    \ event. Listing 8.6.1 shows how using setInternal() with the ajaxCall() function\
    \ might look. We don't have a lot of use for something like this for the autocomplete\
    \ form, but it is a very powerful and frequently used method when returning data\
    \ from a server.\n\nListing 8.6.1 Using setInterval with Ajax\n\n```\n/* make\
    \ this Ajax call every 5 seconds *\nsetInterval('ajaxCall(\"data/contacts.json\"\
    ,\n\nfunction() {\n  console.log(\"made a call\");\n}\n)', 5000); // 5000 milliseconds\
    \ = 5 seconds\n```\n\nBe careful when polling a server for this way; although\
    \ you want to make sure the illusion of real-time data is believable, hitting\
    \ a server from a high traffic website in too-short intervals can easily bring\
    \ a server to its knees.\n\n# Ajax Data Formats\n\nBecause the X in Ajax doesn't\
    \ stand for anything (especially not XML), Ajax can take any data format. Most\
    \ commonly, you will be dealing with three specific data formats: XML, HTML and\
    \ JSON. Each has positive and negative aspects; knowing the difference will help\
    \ you choose the right tool for the job."
