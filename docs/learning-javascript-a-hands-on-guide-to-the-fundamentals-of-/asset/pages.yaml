  md: 'Chapter 10 Making JavaScript Easier with Libraries


    # Syntax


    Learning a library is similar to learning a new language (spoken language, not
    coding language). You may not know all the words in the English language, but
    you know the ones you use and maybe a bunch that you learned while studying for
    the SATs. Learning a library would be like trying to learn Spanish after already
    knowing English. It''s all about new syntax and discovering a new way to communicate
    the same thing.


    The correct way to learn a library, much like learning a second language, is to
    have a solid grasp of your first language (JavaScript/English) before moving forward.
    Otherwise you will end up saying statements like Mi perro walked to la biblioteca,
    never understanding why that''s a pretty weird statement as a whole. The two languages
    have the same communication goals, but they accomplish them differently. And learning
    a library is very similar.


    All the functionality of a library is native to JavaScript. Things like accessing
    the DOM or executing an Ajax call can all be done, but a library does it in a
    different way; mastering a library is all about learning the special way a library
    solves a particular problem. Most libraries use syntaxes that are generally very
    different from others, so the time to discover which features are best suited
    for you and how to most efficiently apply them to a project time well spent.


    # Focusing on the Goal


    As mentioned earlier, libraries allow you to focus on the interesting stuff (to
    some extent) automating the parts that are overly complex or you don''t want to
    deal with. Either way, it will speed up your development process a great deal
    and focus on the project goals.


    Unless your project is to write an extensible JavaScript library, chances are
    that you say down with the client or earlier development team, the goals for the
    project did not include things like the following:


    +   - Build a powerful JavaScript method to handle multiple levels of cross-browser
    compatible Ajax functionality.


    +   - Create a DOM selection system that uses a more readable syntax.


    +   - Make simple animation models that can be reused.


    Nine times out of ten, your project goals will look something like this:


    +   - Increase conversions.


    +   - Create an engaging user experience.


    +   - Make it perform well in a browser.


    The steps you take to achieve those goals will vary from project to project, but
    one of the most compelling reasons to use a library—and where the power really
    is—relies on the fact that libraries allow you to focus on reaching those project
    goals much more efficiently. At that point'
