  md: '# Chapter 12 Moving Forward with JavaScript


    Plenty of people overlap the two areas, and if you''re still trying to figure
    out which road to travel, I hope this division gives you some insight into what
    you might have to look forward to in each area. As you''re reading, if one area
    feels more “awesome” than the other, you may have your answer for how you can
    progress to the next level of learning JavaScript.


    # A Brief Review of Key Topics


    Looking back on what you''ve learned so far is an important step in moving forward.
    When you sit down to learn a topic as massive as JavaScript, it''s natural to
    forget some things and review. Luckily, this is a book, and you can always flip
    back to check out code sample to jog your memory. Reviewing at this point is especially
    important because we''re talking about moving forward with the language, and you
    can''t effectively that without taking a step back and going over what you already
    know. This is a good practice with anything you learning. If you can create natural
    checkpoints in the process, you will be able to evaluate your progress and make
    sure you''re still on the path you want to be.


    We went over a lot of core JavaScript topics through the course of this book,
    and you will find in a lot of information that will help you in the future. Some
    major concepts like progressive enhancement and accessibility will serve as reminders
    and point you in the right direction as you move from project. These methodologies
    will guide your development strategies at a high level and help you plan out the
    style in which you design and build for the Web. When we speak about them in the
    context of JavaScript, the concepts in progressive enhancement and creating accessible
    content stretch far beyond limitations of a behavioral language like JavaScript.
    These topics will also bleed into your HTML, CSS, and back-end technologies like
    PHP, Python, or Ruby (may even back-end JavaScript,


    +   There also topics more specific to the execution of JavaScript development,
    such as mastering the DOM, data storage, and dealing with server communication.
    These are the topics that build your JavaScript skill. You use these to do the
    actual coding on a project. They include all the interaction design, Ajax calls,
    loops, and event models. The style you choose to pursue in this area will focus
    on performance, responsiveness, and creating an application or site that can scale
    to both traffic and a forever-changing list of devices. Being responsible in your
    JavaScript usage isn''t the sexiest of topics, but in the end if you''re keeping
    user experience in mind, choosing the right tool for the job is all that matters.
    Knowing the capabilities of JavaScript as well as its limitations can be the difference
    between a good career in JavaScript and a great career in JavaScript.


    # Progressive Enhancement


    I realize that the concept of progressive enhancement has been drilled into your
    head a bit, and that it''s so vitally in the development and design processes.
    Progressive enhancement is a layered approach to Web design that focuses on the
    accessibility of content at all times. It recognizes that the consumption of content
    is the main goal of any visitor to the Web, and therefore it should be available
    to the user regardless of the medium by which it is delivered (phone, desktop,
    tablet, paper airplane, and so on).'
