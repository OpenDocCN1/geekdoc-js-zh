  md: '# The Good of Libraries


    faster. This is in fact the case and how this relates to using a library is that
    many (popular) libraries can be centrally hosted through a third-party CDN.


    Google is one of the companies that generously collected a large amount of the
    more popular JavaScript libraries and now centrally host them on their own content
    delivery network, which you can directly link to from your HTML document.


    The list of JavaScript libraries hosted by Google includes the following:


    +   - jQuery

    - Query UI

    - Dojo

    - MooTools

    - Prototype

    - Ext Core


    If you don''t have a CDN of your own to work with, using a central service like
    this to host your library can significantly improve the performance of your site
    or application by not only utilizing the geographic capabilities of a CDN, but
    also freeing up an HTTP request from your domain, allowing more assets to be loaded
    in more quickly.


    Listing 10.5 shows a sample HTML snippet detpping how you would link to jQuery
    hosted on the Google CDN.


    # Listing 10.5 Linking to the Google Hosted jQuery


    ```

    <-- load jquery from the Google CDN --

