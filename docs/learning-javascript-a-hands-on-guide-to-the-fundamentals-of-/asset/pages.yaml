  md: "# Chapter 8 Communicating with the Server Through Ajax\n\n# The Server Response\n\
    \nInside the onreadychange event handler, and after you check to make sure the\
    \ request is complete and successful, you can finally get the data that was returned\
    \ from the Ajax call.\n\nIn addition to readyState and status, the Ajax object\
    \ also returns your data as a property. It will either be returned in the form\
    \ of a string or as XML, depending on which data format you choose to interact\
    \ with.\n\n# As a String\n\nIf your data response is in the form of a string,\
    \ it will return as responseText. This is just a string of data that needs to\
    \ output as it is returned or parsed with some of the native objects available\
    \ in JavaScript. This is the most common format of Ajax response data.\n\nThis\
    \ format is the most common format because it can contain anything from plain\
    \ text, to HTML, to JSON (hint, hint), and then be parsed accordingly. To access\
    \ this data inside your Ajax call, you use the Ajax object, then the responseText\
    \ like this: responseText;\n\n# As XML\n\nIf you are returning XML data, the response\
    \ will be in the form of responseXML. Everything is pretty the same besides that.\n\
    \nListing 8.4.2 shows how you would spit out the returned data into the JavaScript\
    \ console to observe the contents of the response.\n\n# Listing 8.4.2 Outputting\
    \ the Returned Data\n\n```\nvar request = getXMLHttpRequest();\n\nrequest.onreadychange\
    \ = function(){\n    // check if the request is ready and that it was successful\n\
    \    if(request.readyState === 4 && request.status === 200) {\n        // spit\
    \ out the data that comes back\n        console.log(request.responseText);\n \
    \   }\n}\n\n/* Get all the information ready to go */\nrequest.open(\"GET\", \"\
    data/contacts.json\", true);\n\n/* make the actual call */\nrequest.send(null);\n\
    ```"
