  md: '# The Good of Libraries


    As we have said throughout this chapter, all libraries have their good sides and
    bad sides, even jQuery. It''s not so about poking holes in individual libraries,
    such as discussing whether UI is better than jQuery, or whether they''re better
    or worse than other libraries. If you choose to use a library over writing your
    own custom code from scratch, it''s important to know exactly what you''re getting
    into. Before choosing a library, you first have to weigh the good and bad of using
    a library at all. In this section we''re going to stay positive and go over some
    of the better aspects of using a library.


    There''s a large upside with a JavaScript library, the biggest advantage is what
    we have already gone over, where they fix the cross-browser issues inherent in
    JavaScript that no one wants to deal with. Libraries can be extremely helpful
    in streamlining and helping you keep focus on a project in more efficient areas.
    In this section we will look over some of the better aspects of choosing to code
    with a JavaScript library at your side.


    # Popularity and Community


    Some libraries are good because they''re popular, some popular because they''re
    good (more likely), and some are both. I think we can agree that choosing a library
    only because it''s popular is a terrible idea. The library (or any codebase you
    work with) should be the best tool for the job regardless of how popular it is.
    Popularity may be a factor in your decision-making process because it usually
    comes with a strong community and good documentation and support, but it shouldn''t
    be the only factor in your


    Having a strong community around an open source project like a JavaScript library
    can make your development experience most pleasurable. Communities for open source
    projects can create anything from libraries of plug-functionality to meet up groups,
    to discussion forums, free online tutorials, and even books. There are books dedicated
    to helping you learn JavaScript, so there is certainly something to be said about
    surrounding yourself with a strong community.


    The more popular libraries will also be widely distributed among websites and
    applications, increasing the probability that you may already have the library
    you''re using within their browser cache, eliminating the need for them to redownload
    it from your site. Not having to download the library over and over will help
    improve the overall performance of any application.


    # Content Delivery Network


    A content delivery network (CDN) is a large, distributed collection of servers
    that deliver content based on a user''s geographical location. You might be asking
    exactly how this relates to using a JavaScript library. It does and it doesn''t.
    Using CDN to serve up content to users based on where they are considered to be
    a best practice in Web development. If content is sent to a user from a geographically
    closer location, it stands to reason that the content will reach the'
  merge: -1
