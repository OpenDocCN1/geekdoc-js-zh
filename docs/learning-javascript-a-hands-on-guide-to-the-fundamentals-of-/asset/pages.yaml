  md: "Functions can take any number of arguments. They can be any type of information;\
    \ strings, variables, large data sets, and anything else you think of can be passed\
    \ into an argument. As you're defining your functions, you will be assigning names\
    \ to the arguments, sort of like the way you assign names to a variable. After\
    \ that argument is named in the function, it becomes a variable you will be using\
    \ inside that function.\n\nIn Listing 6.2.2 you can see that the sayHello() function\
    \ has a single argument called \"message.\" Inside, the function \"message\" is\
    \ used as a variable that gets passed into the JavaScript alert() method.\n\n\
    # Listing 6.2.2 Passing a Function Through Arguments\n\n```\n/* declare the function\
    \ */\nfunction sayHello(message) {\n    alert(message); // \"message\" is also\
    \ an argument in the \"alert\"\n}\n```\n\n```\n/* call it a couple times with\
    \ different messages */\nsayHello(\"Hey there, you stink!\");\n\nsayHello(\"I\
    \ feel bad I just said that.\");\n```\n\nWhen this function is called, we're setting\
    \ the argument to \"Hey there, you stink!\" and then quickly apologizing with\
    \ another alert, because frankly it was kind of rude. This is a very real-life\
    \ way arguments are used in functions. The string can be declared before calling\
    \ the function (like we're doing in Listing 6.2.2) or it can be declared immediately\
    \ in the function declaration. (Instead of using the message variable, you could\
    \ insert the string.) Calling the way we do is much more common in the real world,\
    \ though.\n\n# Anonymous Functions\n\nAnonymous functions are functions that have\
    \ no name (obviously—they're anonymous). They execute immediately and can contain\
    \ any number of other functions. The syntax for declaring an anonymous function\
    \ is a little different. They are dynamic in nature because they execute at runtime\
    \ rather than waiting to be called.\n\nAnonymous functions perform well in the\
    \ browser because there is no reference to them in another part of the document.\
    \ This comes with maine and minuses. So as you write your JavaScript, it is always\
    \ good to note that if you want to rewrite an anonymous function over and over,\
    \ it's probably best to pull it out into a normal function to cut down on maintenance\
    \ and repetitive code.\n\nThere is often a confusion as to the purpose of anonymous\
    \ functions. If you want something to execute at runtime, why wouldn't you just\
    \ dump the code right into your JavaScript"
