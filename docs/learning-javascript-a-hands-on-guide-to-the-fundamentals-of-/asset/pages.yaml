  md: "Chapter 5 Storing Data in JavaScript\n\n# Table 5.1 Browser Support for localStorage\
    \ and sessionStorage\n\n| | | |\n| --- | --- |\n| Internet Explorer | 8.0 and\
    \ up |\n| Firefox | 3.5 and up |\n| Chrome | 4.0 and up |\n| Opera | 10.5 and\
    \ up |\n| Safari | 4.0 and up |\n\n# Using Web Storage Responsibly\n\nAs you can\
    \ see from Table 5.1, Web storage is not supported everywhere yet. coupled with\
    \ a general desire to create a fluid user experience no matter what browser a\
    \ user is in, brings us back to something called feature detection, which was\
    \ briefly covered in an earlier chapter. It will be a main theme whenever we're\
    \ coding for these new standards brought forth HTML5.\n\nThe main idea is that\
    \ localStorage and sessionStorage are features of advanced browsers. You can detect\
    \ for the presence of that feature and code for or against it. If the feature\
    \ doesn't exist, you can use an alternative method that may be a little older\
    \ or that might not perform as well, but it still gets the job done. Listing 5.17\
    \ shows you how you might use feature detection with localStorage.\n\n# Listing\
    \ 5.17 Checking for localStorage Support Before Moving Forward\n\n```\n/* check\
    \ for localStorage support */\nif(typeof(localStorage) === \"undefined\") {\n\n\
    \  // localStorage is not supported, maybe use cookies;\n\n} else {\n\n  // localStorage\
    \ is supported, use it and be well.\n  // add your localStorage code in here\n\
    }\n```\n\nUsing this method of feature detection will make sure your users are\
    \ using the latest and great-est options available available. Using the if statement\
    \ will ensure a browser that doesn't support localStorage won't have to waste\
    \ valuable time parsing code it won't understand anyway—or worse, throw an error,\
    \ which prevents the rest of your JavaScript from executing."
