  md: "There are orientation settings for portrait, landscape, upside-down portrait,\
    \ and upside-down landscape, which can be returned with some work, but we're only\
    \ interested in triggering the event that tells us the device orientation has\
    \ changed.\n\nIn Listing 7.5.3 you will use the method \"changedOrientation\"\
    \ added to the touchControls object. This new method is set up to clear the contents\
