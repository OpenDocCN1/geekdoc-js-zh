  md: "# Usage\n\nBecause we aren't calling the original pizzaParty() function more\
    \ than once, it is faster to use it as part of the anonymous function, foregoing\
    \ the time it takes to travel up to the function. It is a slight performance enhancement,\
    \ but this is an instance where throwing a blanket policy over extracting all\
    \ functions may not be the best way to achieve this individual.\n\nAn anonymous\
    \ function is probably the best for this situation, but if we ever wanted to use\
    \ that calculation again, it would either need to be rewritten or pulled out into\
    \ another function.\n\n# Functions as Variables\n\nFunctions can also be declared\
    \ as variables. There is no function difference between the function and the original\
    \ pizzaParty() function. They produce the same outcome and are even called the\
    \ same way pizzaParty(argument1, argument2).\n\nThis is a stylistic choice and\
    \ leans more toward the function as an object/method style of development. Listing\
    \ 9.15 shows this style of function declaration.\n\n+   Listing 9.15 Example of\
    \ a Function as a Variable\n\n```\nvar pizzaParty = function(totalSlices, peopleCount)\
    \ {\n\" strict\";\n// take the arguments and decide how many pieces per person\
    \ is fair\nvar fairness = totalSlices / peopleCount;\n// make the fairness value\
    \ available\nreturn fairness;\n} // semicolon at the end, because it's still a\
    \ variable\n\n/*\n to call: pizzaParty(sliceCount, peopleCount)\n*/\n```\n\n#\
    \ Usage\n\nThe usage for this function syntax is the same as the normal function\
    \ syntax, if you have a block of code that you need to execute more than once.\
    \ However, because it is so stylistically different, it is pretty rare to see\
    \ the two occupying the same document.\n\n# Functions as Methods\n\nOur autocomplete\
