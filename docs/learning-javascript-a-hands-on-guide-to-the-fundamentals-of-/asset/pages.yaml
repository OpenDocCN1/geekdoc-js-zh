  md: "# JavaScript Designers 285\n\nto user-interaction patterns. A pinch-zoom on\
    \ an object, a drag and drop, or the rotation of an object in the browser by the\
    \ user are all examples of what you would have to write styles dynamically to\
    \ respond to how users are moving their finger, fingers, or mouse.\n\nBecause\
    \ we're applying CSS transforms with JavaScript, we are going to focus on an example\
    \ of creating a pinch-zoom effect on an object. To effectively test a pinch-zoom,\
    \ you need either a touch-capable device or a simulator.\n\nIn the chapter about\
    \ HTML5 JavaScript APIs, I mentioned that some of the experimental properties\
    \ in JavaScript are treated the same as they are in CSS, by adding vendor extensions.\
    \ The extensions have a similar syntax (-moz vs. Moz, -webkit- vs. Webkit, and\
    \ so on) and when dealing with transformations in JavaScript, they need to use\
    \ them by checking for a match. Unlike the way in CSS that we pile up all the\
    \ vendor extensions, in JavaScript we have functions, objects, and variables at\
    \ our disposal, and we can use them to detect the proper vendor extension that\
    \ needs to be applied.\n\nListing 12.5 shows a function called getTransformExtension\
    \ that lists all the possible extensions in a properties array, then loops through\
    \ them checking for a match in the element that is passed through the sole argument.\
    \ When a match is found, the correct property is returned. This is a very valuable\
    \ function for when dealing with CSS transforms in JavaScript.\n\n# Listing 12.5\
    \ Getting the transform extension\n\n```\n// get the proper transformExtension(element)\n\
    function getTransformExtension(element) {\n\n  \"use strict\";\n\n  // create\
    \ a static array of known extensions\n  var properties = [\n    \"transform\"\
    , // normal\n    \"WebkitTransform\", // Safari and Webkit\n    \"msTransform\"\
    , // Internet Explorer\n    \"MozTransform\", // Firefox\n    \"OTransform\" //\
    \ Opera\n  ];\n\n  // get array count for looping\n  var count = properties.length,\n\
    \  i;\n\n  // loop through the array\n  for (i = 0; i < count; i = i + 1) {\n\n\
    \    // save the property in context to a variable\n    var property = properties[i];\n\
    \  }\n```"
