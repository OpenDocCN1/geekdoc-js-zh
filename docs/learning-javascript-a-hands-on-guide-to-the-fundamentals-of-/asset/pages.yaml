    ```\n// get \"about\" parent, then its next sibling and apply a class\ndocument.getElementById(\"\
    about\").parentNode.nextSibling.setAttribute(\"class\", \"next\");\n```\n\nThe\
    \ JavaScript from Listings 4.8.1 and 4.8.2 should generate the HTML in Listing\
    \ 4.8.3.\n\n# Listing 4.8.3 Generate HTML After Adding Classes\n\n```\n<ul id=\"\
    nav\">\n  <li class=\"previous\"><a href=\"/\" id=\"home\">Home</a></li>\n  <li\
    \ class=\"active\"><a href=\"/about\" id=\"about\">About Us</a></li>\n  <li class=\"\
