  md: "# Chapter 4 Accepting the DOM\n\nUsing these methods will help you travel around\
    \ your HTML document without having to riddle it with markup, IDs, and classes,\
    \ while keeping performance at a manageable level. However, always evaluate the\
    \ load time of a page and balance it with best practices you'd like to follow.\
    \ In other words, moving up and down the DOM tree is resource intensive for any\
    \ particular case, you may want to consider adding a class or ID to jump to (I\
    \ know, sorry to be like that, but performance is always a gray area—use your\
    \ judgment.)\n\n# Access First and Last Child\n\nJavaScript offers us some alternative\
    \ routes to node information; for example, moving straight to the first or last\
    \ item in a NodeList. This is sort of like jumping down with getElementById and\
    \ getElementsByTagName, but like parentNode and childNodes, they're at the NodeList\
    \ level. So, you would target down the NodeList and dive in from compared to doing\
    \ it from the document level. But enough of that. Let's dive into our HTML example\
    \ from 4.8 and add classes to the first and last items in our navigation with\
    \ the JavaScript from Listing 4.8.\n\nListing 4.8.4 Adding a Class to the First\
    \ and Last Items in Our Nav\n\n```\n// to the first node and add the class\ndocument.getElementById('nav').firstChild.setAttribute(\"\
    class\", \"first\");\n```\n\n```\n// to the last node and add a class\ndocument.getElementById('nav').lastChild.setAttribute(\"\
    class\", \"last\");\n```\n\nAnd what will generate the HTML in Listing 4.8.5.\n\
    \nListing 4.8.5 Generate HTML After Adding Classes\n\n```\n<ul id=\"nav\">\n \
    \ <li class=\"first\"><a href=\"/\" id=\"home\">Home</a></li>\n  <li><a href=\"\
    about\" id=\"about\">About Us</a></li>\n  <li class=\"last\"><a href=\"contact\"\
    \ id=\"contact\">Contact Us</a></li>\n</ul>\n```\n\nMoving up and down the DOM\
    \ is something you will do a lot, so it's worth spending some time on these methods\
    \ to wrap your head around what's going on when you are using them on a real project.\n\
    \n> Note\nThese methods can be a little frustrating to work with because some\
    \ browsers will insert a text to maintain whitespace in your code. In the example\
    \ we were using, this can cause a return of \"#first\" rather than the first node\
    \ you're expecting. These examples were ideal for readability, but in some cases\
    \ you will want to remove the whitespace or adjust your targeting methods. Removing\
    \ whitespace is a good idea for a lot of sites in production because it will make\
    \ your overall page weight smaller and improve performance."
