    # Making Repeat Ajax Calls


    Creating the illusion of real-time data (that''s right, it''s an illusion) is
    something JavaScript, and particularly Ajax are both very good at. We already
    learned how to create and execute an Ajax call once, based on either the load
    of a page or a user-initiated event. But you can also create a system that can
    automatically make Ajax calls over and over.'
