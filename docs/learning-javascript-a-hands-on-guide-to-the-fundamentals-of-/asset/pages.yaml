  md: '# # join


    The join method is a way to combine all the items in an array quickly with a certain
    term or separator. You may have noticed Listing 5.11 that when we alerted the
    breakfast array, it came out in a comma-separated list without spaces. That is
    the default output of array, but it is still technically an array at that point.
    If you were going to output the contents of that array somewhere, you would want
    to clean it up a little, adding some spacing, and maybe not even use a comma.


