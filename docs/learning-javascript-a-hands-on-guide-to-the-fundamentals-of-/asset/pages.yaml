  md: '# Chapter 10 Making JavaScript Easier with Libraries


    In using a library, you can generally expect that things looping, parsing the
    DOM, and executing Ajax calls will be done in the most efficient way possible.
    Because library code is open source and free to the public, it is always under
    heavy scrutiny. It may sometimes be frustrating to the authors, but it usually
    results in a log of bugs and feature requests submitted by the public. There is
    a lot of value in having such huge audience of Quality testers constantly poking
    holes in the codebase. This will either result in the library being dropped (survival
    of the fittest) or the creation of a great, strong, and efficient JavaScript library
    that you can use with confidence.


    The best of this is that if you find a performance hole in a library, you can
    tackle it in a few different ways:


    +   - Submit a bug report to the author.

    - Do nothing and wait for a library version update.

    - Ignore that part of the library and use native JavaScript for that instead.


    This circles back to one of the original points of working with libraries—that
    it''s just JavaScript and you shouldn''t feel obligated to use something in a
    library that you think could be better.


    # The Bad of Libraries


    Libraries can cause as much frustration as they shield you from if you let them.
    Just like everything in life, JavaScript libraries are not 100% good. There are
    probably as many reasons to not use them instead as are to use them. In this section
    we''re going to get negative with hopes of appealing to the pessimist in you libraries.
    It''s important to not only know the good libraries, but also the bad before you
    start your journey.


    When libraries are used in a responsible manner, they can do amazing things, unfortunately,
    because the barrier to JavaScript has been lowered so much by some libraries,
    they mask the actual language and can prevent developers and designers from writing
    efficient front-end code. I say “front end code” instead of “JavaScript” while
    using libraries, many people fall into the trap I''ve been mentioning: using JavaScript
    in various places where CSS could be a better option. This issue is often amplified
    when using a library. There are also a few others downsides to library usage.


    # Overhead


    Libraries are large. You won''t be using every feature contained within the library,
    but in most cases the entire library needs to be included and downloaded if you
    want to use any features in it. This can create a lot of unnecessary overhead
    in your site or application forcing a user to download, especially when you are
    trying to perform tune a user experience.


    Unfortunately there isn''t a lot you can do about the overhead caused by using
    a library. You need to weigh the cost of the extra file size you''re having a
    user download the level'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# The Bad of Libraries 239


    of interaction you''re relying on the library to provide. Most of the time, using
    the library will win, but you would be surprised to find how many times a JavaScript
    library is loaded into a document, and either it is not being used at all or it
    is being used in a way that is easily replaced with native JavaScript.


    # Performance


    We''ve already talked about the performance implications of using a library. There
    are a couple different levels to be aware of. There is the performance hit you
    take simply by downloading all the extra code and also the performance problems
    internal to the library itself within the methods and functions that are available
    to you.


    I mentioned in the section of this chapter about looping data with jQuery that
    it is among the worst performers in the entire library because of the chain reaction
    it causes it to execute all the required functions in its path back to the original
    JavaScript method. That is a very common problem in library usage. It is important
    to remember that everything in the library is just a reference to a method that
    is native to JavaScript; therefore, they will never be able to perform better
    than a browser if you were to use native scripting. There will always be a link
    back to the original method, and that distance will always take time to travel.


    Keeping that in mind, you will be able to make intelligent decisions about when
    to use a library method and when it is best to use something native and preserve
    performance.


    # Overreliance and Shelf Life


    Overreliance on a library can be a pretty serious problem for a developer or designer.
    Many times people learn libraries before learning the core language. This goes
    far beyond the scope of JavaScript; it is a problem in any programming language
    where there is a jump to learning a framework or library before learning the underlying
    language. With JavaScript, you see the scenario previously mentioned where a library
    is loaded into a document to perform an incredibly simple task that could be achieved
    with less code. Because of this overreliance on the library, there isn''t a performance
    to tune an application because there''s only so much you can do while staying
    within the library itself. Because library is already optimized, you can do very
    little without breaking out of the library and back into native JavaScript.


    Another problem with libraries is their shelf life. Sure, some are very popular
    and stay around for years, but this is the Web we''re talking about. It''s a medium
    that changes almost daily and gets flooded with new technologies every day. All
    libraries and frameworks will eventually die off. If you are heavily using a library
    without ever noticing that your favorite library has a shiny new competitor, it''s
    a matter of time before your library drops in popularity and fades into the background.
    It happens with everything. Learning the core language of JavaScript will help
    you be a better, more flexible, front-end coder. You will be able to use libraries
    when you want, switch to new ones when others do, and most important, not use
    them at all. In an industry that moves as fast as the Web does, it''s important
    for you to be flexible in what you can learn.'
