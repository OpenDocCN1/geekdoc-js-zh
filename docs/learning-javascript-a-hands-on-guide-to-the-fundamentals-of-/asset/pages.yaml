    # popstate


    If you try this example in a browser, you will notice one glaring problem with:
    the back and forward buttons don''t work as expected. Sure, you can hit them and
    the URL steps back or forward to what it was, but the content isn''t changing.
    That works because we have been pushing data into the history object with pushState().


    Obviously, the back button not working is going to create a weird user experience,
    so it needs to be fixed. Luckily, the history API gives us a new event called
    popstate. popstate listens for the back and forward buttons to be activated. When
    this happens you can access the data properly stored in the history object (the
    URL you want) and create another Ajax call to load in the appropriate content.


    Listing 11.5.4 shows how you would set up a listener on the popstate event, access
    the data, and execute another Ajax call (you''re probably an old pro at Ajax calls
    by now).'
