  md: "# The JavaScript APIs\n\nhave implemented a permissions system to deal with\
    \ geolocation. Most of them come in the form of a pop-up message asking for permission\
    \ to get the user's current location. After you have permission, you can continue\
    \ with the data. There is no way to do so without permission from the user.\n\n\
    Gathering location-based information from a user can be a very powerful and interesting\
    \ thing when used properly, but super annoying when used poorly or in an unethical\
    \ manner. If you keep the user's needs in mind, you will be sure to use the data\
    \ in a responsive and useful way.\n\n# Audio and Video\n\nAgain, embedding audio\
    \ and video into an HTML document isn't a new concept, but until HTML5 standardized\
    \ we were reliant on third-party plug-ins like Flash and QuickTime for embedding\
    \ media. The standardization of this area means that anyone is able to access\
    \ the content from anywhere and from any device without the previous limitations\
    \ and security holes that go along with a technology like Flash.\n\nThe <audio>\
    \ and <video> are more than just new elements in the HTML5 specification. They\
    \ also have JavaScript API hooks included to tie into features such as creating\
    \ audio and video controls. The elements both come with default controls built\
    \ into the interface and designed by the browser markets. Listing 11.4 shows what\
    \ a normal HTML5 audio player would look like HTML. Note the controls attribute;\
    \ this is how you use the default generated media controls available in the browser.\n\
    \n+   Listing 11.4 Normal Audio Element with Standard Attributes\n\n```\n<audio\
    \ id=\"player\" preload=\"auto\" autoplay>\n  <source src=\"audio/demo.mp3\">\n\
    \  <source src=\"audio/demo.ogg\">\n</audio>\n```\n\nNotice the two <source> elements\
    \ inside the <audio> element in Listing 11.4. This shows how you can create fallback\
    \ support inside the element itself. We have been with browser support of various\
    \ elements and methods throughout the book, so there is that aspect of rendering\
    \ this new element, but there is a secondary support consideration when dealing\
    \ with media files in the browser. The browser has to support both the element\
    \ and the audio/video file format to play properly.\n\nStacking multiple <source>\
    \ elements lets the browser travel down the line and whichever it supports. If\
    \ it supports multiple formats, it will take the first one it hits.\n\nIf you\
    \ don't like the default controls, for whatever reason, the audio and video APIs\
    \ contain hooks so you can remotely, with JavaScript, create actions like: play,\
    \ pause, volume, and volume down. There is no stop option, only pause. To remove\
    \ the default controls, you just need to remove the controls attribute, but remember\
    \ to create new controls."
