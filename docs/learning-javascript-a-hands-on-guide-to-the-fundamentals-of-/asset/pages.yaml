  md: "# Chapter 11 HTML5 JavaScript APIs\n\n+   - Battery level (number from 0 to\
    \ 1)\n- Battery charging status (true or false)\n- Battery charging time (how\
    \ long until the battery is fully charged)\n- Battery discharge time (how long\
    \ until the battery is dead)\n\nEach piece of information can be accessed through\
    \ the navigator object, like navigator.battery.level. In addition to the new objects,\
    \ this API also opens up four JavaScript events to constantly monitor the battery\
    \ status:\n\n+   - chargingchange (when the level increases)\n- chargingtime (when\
    \ change time changes)\n- dischargingtimechange (when discharge time changes)\n\
    \nAttaching an event listener to these events will help you customize processing\
    \ if a user stays on your site for an extended period of time. Listing 11.7 shows\
    \ an example of how to implement the Battery Status API with the official W3C\
    \ syntax. This example can be used with any HTML document, because it will append\
    \ output information into the body. It should show you the current battery information\
    \ for your device.\n\n# Listing 11.7 Using the Battery Status API\n\n```\n// anonymous\
    \ function to contain the variables\nfunction() {\n  var battery = navigator.battery,\n\
    \  body = document.getElementsByTagName(\"body\")[0];\n\n  function updateBatteryStatus()\
    \ {\n    body.innerHTML += \"<p>Battery level: \" + battery.level * 100 + \"</p>\"\
    ;\n    body.innerHTML += \"<p>Battery is charging: \" + battery.charging + \"\
