  md: "# Dynamically Adding and Removing Nodes from the DOM\n\nUp to now, we have\
    \ been accessing nodes in the DOM that already exist. When building an interface,\
    \ you'll need to dynamically insert nodes into the DOM, create new elements, fill\
    \ them with content, and drop them into the document somewhere. Luckily, we have\
    \ this capability built into JavaScript. In this section, we will be introducing\
    \ four new methods:\n\n+   * createElement()\n* createTextNode()\n* appendChild()\n\
    * removeChild()\n\nThe first three methods will inevitably intertwine as you insert\
    \ new elements into the DOM, so we will go over them all at once, and use the\
    \ HTML from Listing 4.9.\n\nListing 4.9 HTML Example to Create a New Element\n\
    \n```\n<body>\n  <div id=\"target-area\">\n    <p id=\"tagline\">Hello World!</p>\n\
    \  </div>\n</body>\n```\n\n# Adding Elements to the DOM\n\nCreating and inserting\
    \ a new element is generally a three-step process:\n\n+   1. Create the element.\n\
    2. Fill it with content (or leave it blank).\n3. Put it in DOM.\n\nFirst, we use\
    \ the `createElement([tagName])` method to create the element. This method takes\
    \ one argument, which is the tag name of the element you want to create. When\
    \ I say we create the element, it doesn't actually exist anywhere until we put\
    \ it in the DOM; this helps to perceive this method as thinking of an idea. The\
    \ idea is floating around your head, but isn't a physical thing until you put\
    \ it on paper, tell someone, or build it.\n\nThe second step is to add content\
    \ to your element. You can do this right away, or you can do it later, but eventually\
    \ the element will be filled with something: what good is an empty element? We\
    \ use the `createTextNodeNode()` method to do this. It takes one argument, which\
    \ is a string of text that will be inserted into the element."
  merge: -1
  pgno: 98
- img_proc: true
  md: "The last step is picking a point in the DOM to insert your new element. We\
    \ do this with the appendChild() method. Method takes one argument, which is the\
    \ completed element you want to insert. Then, like magic, you've created a new\
    \ element.\n\nWe went over creating nodes earlier in the chapter with the setAttribute()\
    \ method because it can also dynamically create nodes in the DOM. Now let's look\
    \ at an example of creating a new element; remember, we'll be using the HTML from\
    \ Listing 4.9 for this exercise and applying the JavaScript from Listing 4.9.1.\n\
    \n# Listing 4.9.1 HTML Example to Create a New Element\n\n```\n// store the target\
    \ area to a variable to keep things neat\nvar targetArea = document.getElementById(\"\
    target-area\");\n\n// create our <p> element\nvar p = document.createElement(\"\
    p\");\n\n// create a text node inside the <p>, note that we're using a variable\
    \ \"p\" here\nvar snippet = p.createTextNode(\"this was a generated paragraph\"\
    );\n\n// insert our generated paragraph into the DOM\ntargetArea.appendChild(snippet);\n\
    ```\n\nThe generated HTML should look like Listing 4.9.2.\n\n# Listing 4.9.2 New\
    \ Element Inserted into the DOM\n\n```\n<body>\n<div id=\"target-area\">\n  <p\
    \ id=\"tagline\">Hello World!</p>\n  <p>this was a generated paragraph</p>\n</div>\n\
    </body>\n```\n\n# Removing Elements from the DOM\n\nJust as you can add elements\
    \ to the document, you can also take them away. It is a similar process, but instead\
    \ of needing three methods, we need only one. It takes a year to build a house,\
    \ but only a few minutes to bring it down.\n\nUsing the same HTML from Listing\
    \ 4.9, let's say that instead of creating a new paragraph, we want to remove the\
    \ tagline. We can do this by navigating to its parent and removing the child with\
    \ the removeChild() method, as shown in Listing 4.9.3."
