  md: "# Code Design 197\n\nUsing math in JavaScript follows the same rules as math\
    \ in the real world (except you use it) more in JavaScript. Just like in the real\
    \ world, you can perform math on numbers. If you try to add two strings together,\
    \ they will be concatenated rather than added; even if it looks like a number\
    \ to you, it may not be a number to JavaScript. And just like in the real world,\
    \ you can use addition, subtraction, division, multiplication, get percentages,\
    \ and even group with parentheses. And it follows the same procedural rule.\n\n\
    My sixth-grade teacher, My. Day (I feel like I can probably call him Richard now),\
    \ taught me the math principle for the order of operations, PEMDAS or Please Excuse\
    \ My Dear Aunt Sally to the layman. If you are not familiar, PEMDAS tells us which\
    \ actions to do in a math equation. It goes like this:\n\n+   - Parentheses\n\
    - Exponents\n- Multiply or Divide\n- Add or Subtract\n\nListing 9.11 shows a calculator()\
    \ function that takes three arguments and plugs them into an equation, which implements\
    \ the order of operations principle.\n\nListing 9.11 Using PEMDAS\n\n```\nfunction\
    \ calculator(a, b, c) {\n  // do some math for us\n  return (a + b) * c;\n}\n\n\
    (function() {\n  // save the result to a variable\n  var result = calculator(1,\
    \ 2, 3);\n  alert(result); // returns 9\n})()\n```\n\n# Using eval()\n\neval()\
    \ method has the capability of evaluating or executing its argument. eval() is\
    \ generally thought to not be a safe function for casual use (or to ever use).\
    \ A couple things to remember right off the bat with this method are\n\n+   -\
    \ eval() is terrible aka \"evil\"\n- Don't use eval()"
