  md: '# Listing 12.8 Contents of server.js, including the http Module


    ```

    // include the http module you need

    var http = require("http");

    ```


    If the http module were a library by itself, using the require() method would
    be the equivalent of adding a reference http.js to the bottom of your HTML document.
    Any methods, objects, or functions stored in Node within the http object can now
    be used in your application.


    # Writing the Server


    After the http module is included, you need to access the createServer() method
    inside the http object to begin building the server.


    Inside this method you will start the response, set the content type (text/plain
    for us), and then pass any data into the server that you would like output. This
    very basic example of writing an http server with Node.js is illustrated in Listing
    12.8.1.


    # Listing 12.8.1 Contents of server.js


    ```

    // include the http module you need

    var http = require("http");

    // access the createServer method in the http object

    http.createServer(function(request, response) {

    ```


    ```

    // tell the server what kind of file is coming to it

    response.writeHead(200, {"Content-Type":"text/plain"});


    // make the server output a message

    response.write("Welcome to the future of JavaScript.");


    // End the server interaction

    response.end();


    )).listen(3000); // listening on port 3000

    ```


    After the server is created, you need to set a port for it to listen on. This
    port is how you will access the server contents through a browser window. In Listing
    12.8.1, toward the end of the server setup function, you can see that we are telling
    the server to listen on port 3000. This means that after start running the server,
    you can visit http://localhost:3000 in a Web browser and see the output of "Welcome
    to the future of JavaScript."


    So far, you have installed Node.js, included the http module in a server file,
    write the server itself, and set it to listen on port 3000. (You can set the port
    to anything you''d like.) The last step in the process is to actually run the
