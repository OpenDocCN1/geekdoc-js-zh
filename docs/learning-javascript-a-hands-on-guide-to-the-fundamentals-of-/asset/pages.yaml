  md: 'Chapter 10 Making JavaScript Easier with Libraries


    # Fixing Browser Issues


    What is the worst part of any front-end developer''s job? If you ask 100 front-end
    coders (HTML, CSS, JavaScript people) 99 of them will tell you what they hate
    the most is testing and fixing code that breaks across different browsers and
    platforms. Unless you''re not one person who gets fired about something else,
    this is where you will really love working with a JavaScript library.


    A few years ago, there was a development in the CSS world that was called "CSS
    Reset." Man himself, Eric Meyer, came out with the idea of fixing all the browser
    inconsistencies by resetting margin, padding, sizing, positioning, and border
    values to a baseline starting point in an attempt to cut down on the cross-browser
    problems, testing headaches, and hacks we all dealt with on a day-to-day basis.
    It worked amazingly. We all loved the CSS reset, other than a few folks (but you''ll
    get with everything). It saved a lot of time and frustration. We had to deal cross-browser
    test, but using a reset made the experience much more bearable. JavaScript libraries
    do something similar.


    Libraries will solve your cross-browser JavaScript problems. There were a few
    specific examples in previous chapters where we had to do checks before moving
    forward with our code. The checks in were general support checking, like the XMLHttpRequest
    and addEventListener. Although the methodology of checking for support rather
    than checking for a browser still will apply to this model, we''re really checking
    because they don''t work in older versions of Internet Explorer; so when you do
    your browser testing, everything will work. What libraries do is create method
    shortcuts to things a support check like the XMLHttpRequest and methods like addEventListener
    and return the correctly supported method—behind the scenes. You rarely have to
    engage in JavaScript testing when using a library because they are (generally)
    extremely well tested before released to the public through various rounds of
    quality assurance.


    No one likes browser testing, so this is another great use for a library. JavaScript
    and learning a library in great detail will help you identify the spots in JavaScript
    where you know there will be browser issues and use the cross-browser-tested methods
    in the library in appropriate situations. It will also allow you to identify places
    in the library where there are cross-browser issues in the native JavaScript version
    of a method, so you can avoid any unnecessary overhead.


    As browsers get more advanced and modern JavaScript methods become globally supported
    while old browsers slowly die off, the need for some of these library functionalities
    will fade away. That day may be, but the horizon is still pretty far away. If
    the only function of a library was to save you from dealing with cross-browser
    support and building JavaScript fallbacks for better support, I would still say
    they''re worth using. Fortunately, they do lot more than that.


    # Popular Libraries


    As you go about the JavaScript development life, you will probably be choosing
    a go-to library (if you haven''t gotten one already). There are currently an overwhelming
    amount of libraries'
