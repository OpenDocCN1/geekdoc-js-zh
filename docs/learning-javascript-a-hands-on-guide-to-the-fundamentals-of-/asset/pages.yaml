  md: '# Where Is Ajax Going?


    Ajax, as it currently sits, a surprisingly old technology, but we still use it
    in almost the same way we used it in the early days of its existence. With the
    speed the Web moves, sometimes we ask ourselves, what''s next? Well, next for
    Ajax?


    The question isn''t so much what''s next for Ajax, but rather, “What''s next for
    client-side server communication?” That''s really the goal of Ajax, to help us
    communicate with the server from the front-end and systematically refreshes piece
    of a Web application without reloading the entire document. As long as we''re
    addressing the overall goal of a better user experience, the technology is almost
    irrelevant. Ajax will probably be relevant for decades more, whether there is
    a serious competitor or not. Some will abandon Ajax for something like Web Sockets.
    Ajax was created to increase the responsiveness of the Web, making it more pleasant
    to use. In the coming chapters we will talk about technologies that do just that—make
    the Web a more pleasing place to spend your time. Always, we should focus on an
    improved user experience.


    # Summary


    In this chapter, you learned about Ajax. You first started off with a short history
    about the origins of Ajax in its early days with Microsoft and then learned about
    how it came to be in its current form, along with the difference between synchronous
    and asynchronous server communication.


    We broke down the individual pieces of the famous XMLHttpRequest, including open
    and send methods and the kinds of information that can be passed into each of
    them. We introduced a new JavaScript event readyState, which is triggered by the
    Ajax call itself and returns five state values you can check before executing
    a block of code after a call has completed.


    We talked about the different data formats that can be used when dealing with
    Ajax, namely: JSON, HTML and XML, and visited some positive and negative aspects
    of each, including use-cases for each in the event you hit a time where you may
    want to use one over the other.


    We converted the Ajax call into a function that was able to autocomplete the contact
    form application we''ve been building throughout the course of this book. We were
    able to reuse the function because it was written in a way where it was kept extensible
    by implementing a callback function.


    We also talked about Ajax accessibility and why it is important to flag zones
    of your application using ARIA so screen readers can identify certain areas of
    the page as being updated by Ajax. We also mentioned some common mistakes people
    make using Ajax, such as failing to provide feedback to the user and how that
    incorporates with the guiding principles of progressive enhancement. (Are you
    sick of hearing about progressive enhancement yet?)'
