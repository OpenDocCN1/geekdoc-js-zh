  md: "# Chapter 9 Code Organization\n\n```\nfunction pizzaParty(totalSlices, peopleCount)\
    \ {\n  \"use strict\";\n\n  // take the arguments and decide how many pieces per\
    \ person is fair... life may\n  not be fair, but this function is!\n  var fairness\
    \ = totalSlices / peopleCount;\n\n  // make the fairness value available\n  return\
    \ fairness;\n}\n```\n\n# Indentation\n\nJavaScript doesn't have any rules about\
    \ indentation and whitespace like a language such as Python may have. Because\
    \ of this, it can be the Wild West in JavaScript files. Depending on the text\
    \ editor you use, you can make life miserable for another person by pressing the\
    \ Tab key a couple of times. Because no standards exist for the amount of space\
    \ one \"tab\" it creates a lot of dissonance in the coding world. Unfortunately,\
    \ there's not much we can do about how different programs use the Tab key. The\
    \ solution is to use spaces instead.\n\nSome programs will let you tab distance\
    \ to a space value. If that's an option to you, it's certainly preferred to pressing\
    \ the spacebar multiple times. A single indentation unit should equal four spaces.\
    \ This is an industry standard (what a thing to have a standard, eh?) and creates\
    \ uniformity in your code. You need more than a single indentation unit, so increment\
    \ by four each time. Two indentations equal eight spaces; three twelve, and so\
    \ on in that fashion until your eyeballs fail out of your head and your fingers\
    \ cram up.\n\nWe have been this indentation pattern throughout the book. Figure\
    \ 9.2 illustrates the anonymous function we have used so far in this chapter and\
    \ shows the level of indentation for some of the lines of the code block.\n\n\
    When I first heard about the standardization of indentation in JavaScript, I thought\
    \ it was over the top and refused to pay attention to such a thing. But I ran\
    \ into few back-end developers who requested that I move from tabs to spaces because\
    \ of the cross-editor formatting problems. I won lie—if there's a setting in my\
    \ text editor to produce spaces rather than tabs, I probably would have fought\
    \ the tooth and nail. But it is a change for the best because you can make the\
    \ code you write doesn't mess up the formatting of someone else's code, and vice\
    \ versa. It s a small price to pay for avoiding a headache.\n\n> Note: Using spaces\
    \ instead of tabs will increase the overall size of your file, but don't worry\
    \ about this excess whitespace; you can remove it with simple minification of\
    \ the file before serving it up to the public."
