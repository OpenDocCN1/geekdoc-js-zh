    you can safely apply to each project and treat as standard practice. These include
    things as properly applying the concept of scope to your projects, creating a
    codebase that not succeeds fast, but fails even faster (that sounds weird, I know
    we''ll get to it), all the while keeping your eye on the prize: creating a good
    user experience.


    In a way, you have already been introduced to some general coding style best practice
    situations. So throughout this book, we have been using called feature detection
    to test for various features a browser may have; this is a specific coding style.
    Rather testing for a device or browser that will constantly change over time,
    you test for the'
