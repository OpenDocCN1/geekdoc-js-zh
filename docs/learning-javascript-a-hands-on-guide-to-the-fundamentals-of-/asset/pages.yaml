    ```


    Just like before, linking to the remote library happens at the bottom of your
    HTML document.


    # Efficient Code


    It is a general assumption that if someone took the time to assemble and release
    a public JavaScript library, the individual or team putting it is very good at
    writing efficient JavaScript. Using a library that someone else put together will
    usually make sure that the code and predefined method you are using (using, not
    writing) were written with efficiency and performance in mind. A lot of performance
    bottlenecks can exist in JavaScript, and having all of that worked out behind
    the scenes by a team of people who write JavaScript for living can help your project
    start off on the right foot.'
