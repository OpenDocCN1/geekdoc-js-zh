    \ same file or why you keep all JavaScript in the same file—you know exactly where\
    \ it is when you need to change or add something.\n\nYou've been using functions\
    \ in earlier chapters when you pass data into an alert(). \"Alert\" is technically\
    \ called a method but for all intents and purposes, it's the same as a function.\n\
    \n# Basic Functions\n\nThe chance of creating a JavaScript application without\
