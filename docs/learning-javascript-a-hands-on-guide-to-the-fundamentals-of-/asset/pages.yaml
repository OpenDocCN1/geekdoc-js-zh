  md: '# 4


    # Accessing the DOM


    In this chapter, we start putting into practice some of the concepts you learned
    in previous chapters and begin coding basic JavaScript. We get into the different
    ways to manipulate elements within a page, access HTML nodes, and learn how to
    move up and down the document structure. This is the basis for all JavaScript
    interaction; as you move forward in your JavaScript life cycle, these are skills
    you will be using on most days (the good ones, at least).


    # What Is the DOM?


    When you hear people talking about JavaScript, they often mention the "DOM," or
    "Document Object Model." This is one of the most common and important aspects
    of JavaScript that you''ll encounter. You will use it every time you modify a
    page and every time you insert data or modify an interface. In a nutshell, the
    DOM is a mapping layout model for your HTML and a way for JavaScript to get there
    and do its thing. The DOM can be a JavaScript''s best friend after it is mastered.


    The DOM is not HTML and not JavaScript, but they are all interconnected. It contains
    some very basic concepts, and as you lift the hood to see all the possibilities,
    you''ll notice that it''s more than a mass of HTML thing. It is the combinations
    of the elements you use (object), the order you choose to display them (model),
    and an endless offering of access points for you to add, delete, or modify any
    of the overall structure (document) while navigating around the various methods
    JavaScript provides.


    Step one, and something that many beginners get stuck on conceptually, is that
    the HTML is a document when we talk about the Document Object Model. Your document
    is made up of a bunch of objects (HTML elements, text, and attributes). Those
    objects come together in a certain order, which is considered the "model."


    JavaScript is all about creating behaviors and data interactions by accessing
    the DOM. To create and control truly interactive experiences through interface
    design, you will certainly have to master and grow accustomed to working in this
    robust environment.'
  merge: -1
  pgno: 78
