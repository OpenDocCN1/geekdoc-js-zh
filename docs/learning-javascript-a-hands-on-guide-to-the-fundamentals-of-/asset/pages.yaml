  md: "```\n<div class=\"button-group\" id=\"search-btn\">\n  <button type=\"submit\"\
    \ id=\"search\"></button>\n  <button type=\"button\" id=\"get-all\">get all contacts</button>\n\
    </div><!--.button-group-->\n```\n\n</form>\n\n```\n<div id=\"output\" aria-atomic=\"\
    true\" aria-live=\"polite\"></div>\n```\n\n```\n<script type=\"text/x-mustache-tmpl\"\
    \ id=\"mustache-template\">\n\n  // special mustache templates go here\n</script>\n\
    ```\n\n```\n<!---js-->\n<script src=\"js/mustache.js\"></script>\n<script src=\"\
    js/addressbook.js\"></script>\n\n<body>\n</html>\n```\n\nYou might notice that\
    \ the <script> element has an id of mustache-template. This can be whatever you\
    \ want, and it's just a normal id value for a DOM hook in the JavaScript file.\
    \ The type attribute is also semi-arbitrary; if omitted, the template will render\
    \ just fine, but there are issues in other libraries, which can clash with JavaScript\
    \ templates embedded in <script> elements if you don't provide a type attribute.\
    \ Using a unique attribute such as x-text/mustache-tmpl will ensure that the value\
    \ never clashes in the future and also create a semi-human-readable description\
    \ of the element's contents. It will also make sure browsers don't attempt to\
    \ execute the contents of the <script> element as normal JavaScript, which can\
    \ cause the browser to throw errors in some cases.\n\nNow that our HTML document\
    \ is prepared to include the Mustache-style templates, let's jump over to the\
    \ main JavaScript file where HTML snippet lives. We will be replacing it with\
    \ a call to an object in the Mustache library that converts the contents of the\
    \ <script> block into HTML.\n\n# Integrating a Templating System into Your JavaScript\n\
    \nThe first step to rendering the Mustache template is to target the <script>\
    \ element. Even though isn't a normal element we target with JavaScript, it's\
    \ still an HTML element in the DOM, so it can get saved to a variable. After it's\
    \ saved to a variable, you need to save all of the contents; this is how you bring\
    \ the template into JavaScript to be processed. In Listing 12.7.2 you can see\
    \ the block containing a reference to the <script> element in our HTML and how\
    \ we are storing all the contents with innerHTML, being saved to the template\
    \ variable. We'll be passing this variable into the Mustache rendering method\
    \ to parse the content."
