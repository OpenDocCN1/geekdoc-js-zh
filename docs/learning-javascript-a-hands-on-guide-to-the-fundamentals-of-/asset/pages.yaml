  md: '# Files and Directories


    Dealing with JavaScript files and directory structures is pretty straightforward
    and follows much the same model as any type of front-end code like HTML or CSS.
    All JavaScript files should be contained within the same parent directory and
    share all .js file extension. Using a .js file extension isn''t actually required
    (I tried a stint of using a .tim extension for a short period of time—it was awesome),
    but it is one of those industry standards that exists because it makes sense,
    and changing it would confuse people. File extensions should describe the coding
    contents of a file, .html contains HTML, .css contains CSS, .json contains JSON
    data, and .js JavaScript.


    In an open-source development, you will likely find yourself, in one form or another,
    using code that another developer wrote. There''s absolutely nothing wrong with
    that; it''s common to use a JavaScript library to fill the developmental gaps
    that you don''t want to deal with yourself. In the next chapter we get into JavaScript
    libraries and how they can help you, and for now it is always a best practice
    to section them off into their own subdirectory of the parent JavaScript folder.


    File naming conventions also come into play when dealing with external libraries.
    You may be using multiple plug-ins or add-on functionalities that are based off
    of the main library. In this case, it is best to prefix the plug-in with the name
    of the actual library so you can quickly distinguish between library-base plug-ins
    and any other external code you may be using on a project.


    Figure 9.1 shows a depiction of the file structure described above. As you can
    see, a "js" directory contains a subdirectory of "lib". This "lib" directory is
    where all the third-party code would go (code other people wrote). In this case
    the name of the application is "application" and the name of the external library
    is "library." The names of the actual directories would be for debate on your
    team. Some prefer "script" or "javascript" rather than "js" but the overall principle
    remains for sectioning off a directory specifically for JavaScript.


    ![](img/1fc495d5f409712b6e281b5d531f60c4_207_0.png)


    Figure 9.1 Suggested directory structure when dealing with JavaScript and libraries'
