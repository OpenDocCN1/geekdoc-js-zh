  md: '# Chapter 8 Communicating with the Server Through Ajax


    Many asynchronous Ajax calls go on constantly without the user even knowing that
    something is happening. Don''t believe me? Visit your favorite email app in a
    Web browser and open up your JavaScript debug console. You will be able to see
    each Ajax request executed and note how most people never notice something happened
    in the background, aka asynchronously.


    # The XMLHttpRequest


    The XMLHttpRequest object is the heart of any Ajax call. We just went over the
    origins of this object a few paragraphs ago, so I won''t get into that again.
    Next, we will be cracking the contacts search form that you have been building
    throughout the course of the book and adding Ajax functionality to the autocomplete
    feature.


    Creating an instance of the XMLHttpRequest is the first step in making an Ajax
    call, and it''s pretty easy. In Listing 8.1 you can see that we''re grabbing an
    instance of the object and saving to the xhr variable so we can use it.


    ```

    Listing 8.1 Creating an instance of the XMLHttpRequest

    var xhr = new XMLHttpRequest();

    ```


    # Cross-Browser Issues


    Remember, from earlier in this chapter, Microsoft first invented the XMLHttpRequest
    object that later became the more popular XMLHttpRequest. This does a cause of
    an issue because the Ajax supported in Internet Explorer 5 and Internet Explorer
    6. No one supports IE 5 anymore, so we''ll ignore that. Even though support for
    IE 6 is falling fast, it''s worth addressing that problem upfront.


    If someone were to visit your Ajax enabled application with IE 6, it wouldn''t
    support the normal XMLHttpRequest object, but rather the older XMLHttpRequest
    object. It''s a little of a pain, but if you don''t personally support IE 6 in
    your development process anymore, don''t worry about it. It''s easy to do a quick
    check for the XMLHttpRequest and move on from there, just in case someone from
    rapidly falling market share were to stumble upon your application.


    In Listing 8.1 you see the steps to check for support. All we''re running a simple
    statement to check for the presence of either the XMLHttpRequest or the ActiveX
    and then setting the proper Ajax object to the xhr variable. This is a form of
    feature detection. Rather than targeting IE 6 directly (because that''s very specific),
    we are instead casting a blanket over a possibly wider audience of supporters.
    Again, if you don''t support IE 6 at all, you don''t have to worry about this
    step.'
