  md: '# Chapter 10 Making JavaScript Easier with Libraries


    # Listing 10.2.2 Selecting an Element by ID


    ```

    // native JavaScript version

    var container = document.getElementById("container");


    // native JavaScript - newer version

    var container = document.querySelector("#container");


    // jQuery version

    var container = \("#container");

    ```


    Because these methods are shortcuts to the native methods in JavaScript, they
    will give you the performance boost of using native JavaScript. This is a concept
    you need to be conscious of when using a library. Libraries are best used to minimize
    the work you would have to do in creating cross-browser code that is flexible
    and extensible. Listing 10.2.3 is an example of where you would want to use a
    library. Because the functionality of getting an element by its class is not well
    supported in native JavaScript, using jQuery for it assures that you won''t have
    to write complex code to make this feature work the way you want it to.


    # Listing 10.2.3 Selecting an Element by Class Name


    ```

    // native JavaScript version

    var module = document.getElementsByClassName("module");


    // native JavaScript - newer version

    var module = document.querySelector(".module");


    // native JavaScript - newer version, return array

    var module = document.querySelectorAll(".module");


    // jQuery version

    var module = \(".module");

    ```


    Although it may not seem like it, jQuery goes through a series of checks when
    using something like the example in Listing 10.2.3. You see only the nice clean
    version of the selector \(".module"), but behind the scenes the library is running
    through feature detection checks the browser you are using to see which native
    method it should use for the highest efficiency possible.


    It first checks querySelectorAll, then getElementsByClassName, and if all else
    fails, it will use a custom-written function to return the element or elements
    requested by class name. These are the steps you would have taken if you were
    to write this code yourself, so using a library in this way saves valuable development
    and browser testing time.'
