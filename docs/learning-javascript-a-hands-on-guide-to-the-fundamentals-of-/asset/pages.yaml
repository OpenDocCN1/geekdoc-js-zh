    ```\n\nThe Battery Status and Vibration APIs are two of the best examples of the\
    \ type of fine-grained access you will have to the device. Having both of these\
    \ APIs in your toolkit will help you create unique experiences for your users.\n\
    \n# The Network Information API\n\nThe Network Information API is the last item\
    \ in the Device API that we're going to check out. It's one of those APIs that\
    \ the user really has no idea about. I always say Web development is like cinematography\
    \ in a movie; when it's great you never notice it. This API is a testament to\
    \ that statement. It has the potential to be the most powerful API released to\
    \ date, let's get it.\n\nThe Network Information API provides access to information\
    \ about the underlying connection of a device. What does that mean? It can run\
