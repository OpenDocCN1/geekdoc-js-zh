  md: '# JavaScript for Designers 279


    # Server Communication


    Ajax the elephant in the room when you talk about JavaScript server communications.
    We were able to use Ajax in a logical way when we were building the autocomplete
    search form application, but often Ajax is not used in a logical way. This is
    what one of the most used methods in JavaScript, by far, mostly due to its "coolness
    factor" and marketing popularity. For this reason you will see a lot of Web applications
    that are hacked together with too much JavaScript and are hampered with crippling
    performance issues due to poor planning and lazy development.


    Many developers who are dealing with Ajax ignore the rules and build a model of
    progressive enhancement by adding the behavior layer too early in the process.
    For whatever reason this happens, it creates more problems than it solves by relying
    on a cross-browser sensitive like JavaScript for your application''s core functionality
    and not providing a way for the experience to degrade gracefully in the browser.
    This is what I was referring to saying that there is a difference in ignoring
    progressive enhancement rules and breaking them.


    We took server communication one step further when we got into Web workers and
    the HTML5 APIs. By creating a better user experience from the single-thread, blocking
    nature of JavaScript, we opened up another door in clientide server communication.
    Using Web workers is not dissimilar from using CSS together with JavaScript. They''re
    extremely different technologies that do very different things, but they accomplish
    their goals by offloading some of the processing put onto a JavaScript file.


    JavaScript certainly has its shortcomings, but using these technologies together
    in a responsible and well-thought-out way can ensure that you are using all in
    the most logical way, to create the best possible user experience.


    # JavaScript for Designers


    JavaScript is such a diverse language that you can have two people with expert-level
    knowledge who do completely different things. There are interface designers who
    work heavily with JavaScript but never get into the heavy data manipulation of
    the language. There are also JavaScript developers who get into the interface
    side of things.


    Up to this point in the book, all the JavaScript knowledge you have attained addressed
    the needs of both the design and development communities. But as you move forward,
    you will probably find yourself leaning toward one side or the other, especially
    as time progresses and the techniques get exponentially complex. Chances are that
    if you are a web designer, you might settle on using JavaScript as an interface
    design tool, and if you''re already a developer, you might use it as a developmental
    language. Either way, the focus is always on user experience—from two different
    angles but always meeting in the middle.


    This section is targeted towards a level of JavaScript you might find yourself
    getting into if you are designing an interface. We''ll call it JavaScript for
    Designers for now, I''m sure you''ll find the path to designing is dusted with
    development.'
