  md: '# Chapter 12 Moving Forward with JavaScript


    Node, a back-end library is provided that includes modules to help you easily
    write your own Node server. That probably sounds really complicated, but in a
    little while I''ll show you how easy it is to write your own server running Node
    JavaScript on the server.


    The Web browser is considered to be a context in which you can run JavaScript.
    JavaScript in the browser runs on the client and is susceptible to rendering errors,
    browser problems, security holes, and communication bottlenecks. You may not be
    thrilled to hear negative things being said about a language you''re almost finished
    reading an entire book about. But it''s no secret that JavaScript has its problems
    in the past, many of which we''re still paying for in the form of support checks
    and conditional statements. However, JavaScript is still a very powerful programming
    language. It is generally easy to use, make sense, and it is widely adopted and
    gaining momentum at a rate that few other languages have experienced. For this
    reason, JavaScript is testing its out legs and trying to break free of the browser.
    The server is now another “context” in which we can run JavaScript. This is the
    Node project.


    As I mentioned earlier, the Node platform is somewhat of a library because it
    provides you with a set of predefined functions and methods to access, but they''re
    much powerful than using a module model called the Asynchronous Module Definition
    API (AMD). The AMD loading model is also applied to a lot of front-end JavaScript
    libraries as a way to manage resources. Think of it like a PHP include. In Node
    there are bunch of modules available for use, but to use them, you don''t have
    to load the entire codebase. The AMD loading model allows you to load only the
    modules that you are going to using.


    In this section, we jump straight into the fire with Node and go over installation
    and how to set up an http server in a surprisingly small number of steps.


    # Installing Node


    The first step to using Node is installing it. Installation packages for both
    Windows and Mac can be found at nodejs.org. After you have NodeJS installed, we
    can start putting together the server.


    As a developer, you will probably find yourself spending a fair amount of time
    on the command line. If you''re a designer, you probably hate it with a passion.
    Running a server of any kind requires a little time on the command line, and Node
    is no different. To start off, let''s create a directory called “node” and put
    a file called server.js inside it. It doesn''t matter where the directories live,
    but be sure you can easily access it from the command line for when we start to
    run the server. As long as you have Node successfully installed, you''ll be fine.


    Next we''re going to go over server.js and get to work. NodeJS creates a module
    specifically for creating a server, called http, and, you guessed, it''s for creating
    an http server. Using the AMD loading model we can include that module and save
    it to a variable we will reference later. Listing 12.8 shows code to include the
    http module inside of server.js.'
