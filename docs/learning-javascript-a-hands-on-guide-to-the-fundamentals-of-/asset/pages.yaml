  md: '# Chapter 1 Progressive Enhancement


    Note


    You may have noticed that even though the HTML5 example has one element, <nav>,
    we still choose to target the element by its IDs of #nav in the CSS. This is done
    because there can be multiple <nav> elements on one page that you want to style
    differently, and it also allows a flexibility in changing the HTML. As long as
    the ID value doesn''t change, you can keep your CSS isolated to only the HTML.
    It keeps your CSS that much more independent and maintainable.


    # Behavior Layer


    Everything must be fully functional without JavaScript.


    In this book, you will be spending the most time in the behavior layer. It''s
    the basis for this book because JavaScript is the entire behavior layer, and you''ll
    be learning JavaScript.

    In many cases, JavaScript is nothing more than a luxury. You use it to sort interactions,
    make Ajax calls, slide elements around a page, and modify HTML. It really is another
    layer in progressive enhancement because by the time you make it to the third
    layer, your site or application should be fully functional. It needs to work completely
    before you start laying the behavior and how you want it. As of a user experience,
    if you can make it without JavaScript, you will not only have built-in fallbacks
    if JavaScript fails, but you will have to write far less JavaScript to accomplish
    the same experience for your users. Of course, less code means better performance
    and performance means a better user experience. That''s what this is all about—providing
    the best user experience we can. You can do that with less code, you absolutely
    should.


    Like in CSS, with JavaScript you target elements in HTML and do stuff to them.
    In CSS, you apply style and in JavaScript you apply JavaScript and behavior. And
    also like in CSS, there are a few ways you can apply JavaScript to an HTML document.
    We''re going to talk about three ways:


    +   - Inline JavaScript

    - Embedded JavaScript

    - External JavaScript


    # Inline JavaScript


    Inline JavaScript, like inline CSS, is when you attach JavaScript directly in
    the HTML. This has the same pitfalls as inline CSS has, but you still see this
    quite a bit, where inline CSS is all dead in the wild. One of the most common
    applications of inline JavaScript is adding a click behavior to an element. “Click”
    is a JavaScript event that executes when a user clicks, and you can tie certain
    behaviors to it when adding interaction to a page. Listing 1.1.5 shows how you
    might apply that event with Inline JavaScript.'
  merge: -1
  pgno: 33
- img_proc: true
  md: "# Listing 1.1.5 <nav> Section of the HTML5 Document with Inline JavaScript\n\
    \n```\n<nav>\n<ul>\n  <li><a href=\"/\" onclick=\"alert('this is the thing');\"\
    >About</a></li>\n  <li><a href=\"/articles\">Articles</a></li>\n  <li><a href=\"\
    /staff\">Staff</a></li>\n  <li><a href=\"/contact\">Contact</a></li>\n</ul>\n\
    </nav>\n```\n\nIn this example, when the user clicks \"about\" a JavaScript alert\
    \ will pop up, saying “This is the thing” and then execute the normal link behavior\
    \ of visiting the About page. It’s a simple interaction, but anything could be\
    \ substituted in place of the alert; any function, call or method can be executed\
    \ upon clicking the link. There are ways to prevent the normal link behavior from\
    \ executing, but we’ll get into that bit later in the book. If curiosity is overwhelming\
    \ you now, feel free to flip to the index and use “return false” or “preventDefault.\"\
    \n\nUsing inline JavaScript is generally not a good idea, even if it is a good\
    \ way to interact with the user through JavaScript events. Using this way will\
    \ clutter your HTML with unnecessary behavior, which should be sectioned off and\
    \ isolated in its layer. When JavaScript is inline to the HTML like this, we refer\
    \ to it as unobtrusive JavaScript because it is kind of intrusive. Our goal is\
    \ to write unobtrusive JavaScript.\n\n# Embedded JavaScript\n\nUsing embedded\
    \ JavaScript is your first step toward having the language unobtrusive to the\
    \ HTML. It’s not totally unobtrusive because it still sits in the HTML, but the\
    \ syntax style is the same as fully unobtrusive JavaScript.\n\nEmbedded JavaScript\
    \ is JavaScript that is inside an HTML document, but contained within a <script>\
    \ element executed only on page.\n\nIn 1.1.6, we added an ID of “about” to the\
    \ first anchor (the first link) in the navigation. This was done because it is\
    \ valid HTML, remains still semantic, and now you can easily target that link\
    \ without adding any JavaScript inline to the document. This is a way to maintain\
    \ the layer separation we’re looking for in progressive enhancement, even if you\
    \ are collapsing the layers by having JavaScript inside your HTML document. Listing\
    \ 1.1.6 illustrates the same functionality as Listing 1.1.5, but in an embedded\
    \ style.\n\n# Listing 1.1.6 HTML Document with Embedded JavaScript\n\n```\n<nav>\n\
    <ul>\n  <li><a href=\"/about\" id=\"about\">About</a></li>\n  <li><a href=\"/articles\"\
    >Articles</a></li>\n  <li><a href=\"/staff\">Staff</a></li>\n</ul>\n```"
  merge: -1
