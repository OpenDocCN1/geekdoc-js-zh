  md: '# Code Organization


    Don''t skip this chapter—it''s really important. If we were sitting next to each
    other or in a classroom setting, this is the point where I would ask if what we
    need to do all the basics of JavaScript. The previous chapters have given you
    the knowledge you need to do all. Along the way we have addressed many of the
    action-oriented aspects of the language. You have a function or method, and an
    action is directly tied to it. getElementById accesses the DOM; you know that
    now. You also know that an if/else statement sets a condition to execute a block
    of code. You learned how to add, remove items from an array directly or by looping
    through them. You even know how to create functions and methods with JavaScript,
    how to store data externally, and how to access it by an Ajax class.


    These aspects of JavaScript depict the functions, or "things JavaScript can do."
    There is a lot more to the coding in this language than making something that
    "just works." Getting your code to work may be a primary goal, because what good
    is code that doesn''t work? Besides getting it to work, you have to do a few more
    things:


    +   - Make the code work well (performance)

    - Make the code easy to follow (readability)

    - Make the code reusable as possible


    In this chapter we talk through the different aspects of code organization. It
    may not be the seeliest topic, but when our main focus is creating a good user
    experience, proper organization of your code can result in a better overall experience
    not only for the user visiting a site or application, also for yourself and other
    team members who may need to work in the same codebase.


    We address two main types of code organization in this chapter—areas I like to
    refer to as the script and style of JavaScript. We''ve been working with the script
    aspect so far, which may make the phrase "script of JavaScript" so redundant.
    By this I mean the actual syntax of JavaScript, the functions, the methods, object-oriented
    models versus script models, and so on. All these aspects of JavaScript have specific
    uses, and we go over each of them, getting into the cases when you may want to
    use each and when else may be a better choice. The key to solving any problem
    effectively is to use the right tool'
