    To prevent these issues with native JavaScript, there are some reserved words
    (keywords) that you can''t use when defining variables, functions, methods, or
    identifiers within your code. Following is a list of the reserved words:

    - break

    - new

    - case

    - package

    - catch

    - private

    - protected\protected

    - public

