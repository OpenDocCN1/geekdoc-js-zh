    \ false, false, false, 0,\nnull);\n\n// trigger the event on the item in context\n\
    first.target.dispatchEvent(simulatedEvent);\n```\n\nWhen a user touches a screen,\
    \ an array of the touch coordinated for each finger is available to the browser\
