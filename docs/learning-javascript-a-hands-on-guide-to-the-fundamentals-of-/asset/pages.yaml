  md: "One of the biggest problems right now with building a Web experience is management.\
    \ Building a design that works in all browsers and large screen resolutions is\
    \ a difficult task that is made even harder with the problems that arise with\
    \ us the constrained bandwidths of a cellular network. The Network Information\
    \ API allows us to throttle back assets such as high-resolution images if the\
    \ available bandwidth doesn't lend to large graphics. We can load images that\
    \ are more appropriate for the data exchange rate, again ensuring a smooth user\
    \ experience. It's all about user experience, I'm sure you know that by now.\n\
    \nAccessing connection information is the same as anything else in the navigator\
    \ object. You first travel in the connection object, then type like: navigator.connection.type.\
    \ The API returns a numerical value, which maps to a connection speed.\n\nTo illustrate\
    \ this, let's see if we can solve the asset management problem with this API and\
    \ a few lines of JavaScript. Listing 11.9 shows an HTML document containing a\
    \ reference to an image. By default we're loading a small image into the DOM and\
    \ utilizing HTML custom data attribute to provide the source for a large image\
    \ that will be loaded in the extra bandwidth.\n\n# Listing 11.9 HTML Document\
    \ to Show Off the Network Information API\n\n```\n<!DOCTYPE html>\n<html class=\"\
    no-js\" lang=\"en\">\n<head>\n  <title>Chapter 11 - Network Connection</title>\n\
    \  <meta charset=\"utf-8\">\n</head>\n<body>\n  <img src=\"images/small.jpg\"\
    \ data-large=\"images/large.jpg\">\n  <script src=\"js/html5.js\"></script>\n\
    </body>\n</html>\n```\n\nIn Listing 11.9.1, you will find the JavaScript that\
    \ goes with the HTML in Listing 11.9.\n\nIn this example we are running a normal\
    \ for loop over each image on the page, checking if the connection speed is either\
    \ unknown, Ethernet, or WiFi (0, 1, 2 type codes), and if true, we are grabbing\
    \ the large image source and loading it into the DOM."
