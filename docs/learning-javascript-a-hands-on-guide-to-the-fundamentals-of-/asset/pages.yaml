    \ href=\"mailto:' + email + ''> + name + '</a></p>';\n\n}\n```\n\nOn line 5 of\
    \ Listing 6.5.4, you can see that you can combine the two types of statements\
    \ into else to create a flow of conditional statements. Using this method, there\
    \ is no limit to the amount of conditionals you can create. When you get to a\
    \ large number of conditionals like this, you may consider changing from an if/else\
    \ statement to a slightly more efficient switch statement.\n\n# switch Statement\n\
    \nA switch statement, on the surface, functions almost exactly like an if/else\
    \ statement. In a switch statement, you first have to set a switch value (the\
    \ thing you're going to check for); in this example, we have checking for name,\
    \ so that's the switch value. You then set up cases to test against. We checked\
    \ for \"hillishisa\" once and also \"paul\"; those would be the cases used. Last,\
    \ there is a default state if none of the cases return as true.\n\nThe switch\
    \ statement in Listing 6.5.5 creates the same output as the if/else statement\
    \ in Listing 6.5.4, but under the hood and in syntax they are pretty different.\
    \ Let's take a look at\n\n# Listing 6.5.5 Basic switch Statement\n\n```\nswitch(name){\n\
    case \"hillishisa\":\n\n  * if \"hillishisa\" comes up, add an exclamation point\
    \ to the end *\ntarget.innerHTML += '<p><a href=\"mailto:' + email + ''> + name\
    \ + '</a></p>';\n\n  * break out of the statement *\n  break;\ncase \"paul\":\n\
    \n  * if \"paul\" comes up, add a question mark *\ntarget.innerHTML += '<p><a\
    \ href=\"mailto:' + email + ''> + name + '</a></p>';\n```"
