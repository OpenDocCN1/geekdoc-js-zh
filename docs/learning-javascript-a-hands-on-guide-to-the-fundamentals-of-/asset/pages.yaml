  md: "file? Why even bother wrapping it in an anonymous function? Well, this is a\
    \ good place to bring up a term you may hear a lot: scope.\n\n# Scope\n\nScope\
    \ is a programming concept that exists to reduce the amount of variable and function\
    \ collisions in your code. It controls how far information can travel throughout\
    \ your JavaScript document. Earlier on, we briefly mentioned global variables.\
    \ “Global” is a type of scope; the global scope for a variable means that the\
    \ variable can be accessed and used anywhere in the document. Global variables\
    \ are generally a bad thing, especially in larger files where naming collisions\
    \ are more likely. Try to keep things out of the global scope if possible. Listing\
    \ 6.3 shows how to declare an anonymous function and keep variables out of the\
    \ scope.\n\nListing 6.3 Defining an Anonymous Function\n\n```\n/* set up your\
    \ anonymous function */\n(function () {\n\n  /* define a variable inside the function\
    \ */\n  var greeting = \"Hello Tim\";\n\n  /* access the variable inside the function\
    \ */\n  alert(in scope: \" + greeting);\n\n}); // end anonymous function\n```\n\
    \nFor the most part, you will be dealing in function-level scope. This means that\
    \ any variable defined inside a function cannot be used outside that function.\
    \ This is a great benefit of using anonymous functions. If you wrap a code block\
    \ in an anonymous function, the contents of that function, which would normally\
    \ default to the global scope, will now be contained within the scope of that\
    \ anonymous function.\n\nListing 6.3.1 defines a variable inside an anonymous\
    \ function, alerts the variable, and tries to alert the variable outside, outside\
    \ the function (it won't end well).\n\nListing 6.3.1 Showing Scope Inside an Anonymous\
    \ Function\n\n```\n/* set up your anonymous function */\n(function () {\n\n  /*\
    \ define a variable inside the function */\n  var greeting = \"Hello Tim\";\n\
    ```"
