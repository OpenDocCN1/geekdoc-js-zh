  md: '# Chapter 2 JavaScript in the Browser


    Two is our magic number here. Assume that you can get the browser to download
    only two assets at a time. This is the exact reason that you want to do your best
    to keep the number of HTTP requests to an absolute minimum. There are some that
    you really can''t control, like the number of content images in a news article;
    what you need for something like that. What you can control are the elements of
    the page that you constructed, the overall design, the CSS, HTML, and JavaScript.


    # HTML


    Keeping HTML as lean as possible will ensure that a browser does not have to parse
    through unnecessary HTML elements to display content to the user. Keeping your
    HTML as semantic while still being able to achieve your design goals is important.
    Be not one of those people who throw a bunch of meaningless div elements. From
    a document-parsing perspective, having too many HTML elements is just as bad (sometimes
    worse) than using a table-based layout. Keeping HTML to a minimum will also speed
    up your JavaScript, but cut back on the number of elements that need to be parsed.


    # CSS


    CSS is often broken apart into easy-to-modules in a file structure and then combined
    later. As long as the combination happens on the server and not the client, this
    is fine. You will get into performance trouble when using more than one CSS file
    per document because each additional file requires an HTTP request (cacheable)
    file on the server. If you''re looking for having all your CSS in a single (cacheable)
    file as a general rule, anything more than one CSS file is generally unnecessary
    and bad for performance. There are constant battles being waged between performance
    and maintainability, but plenty of server-side technologies can combine and minify
    (remove all whitespace from) your CSS files to keep the number of HTTP requests
    as low as possible.


    # JavaScript


    JavaScript follows the same HTTP rules as CSS. The fewer the better. In the real
    world it''s uncommon to see three JavaScript files attached to a document and
    have it be fully justified if you''re using libraries and code extensions (plug-ins),
    but that''s a topic we will cover in Chapter 10, "Making JavaScript Easier with
    Libraries."


    One notable and important difference exists between the HTTP requests that assets
    like images and CSS and other assets use the HTTP process JavaScript uses. As
    previously mentioned, assets downloaded two at a time. This is true for everything
    other JavaScript is sort of treated like the queen of the browser. When it travels
    via an HTTP request everything else stops. Nothing else while JavaScript is coming
    in, and this causes an interesting problem in all browsers. This is what people
    are talking about when they say that JavaScript is blocking. The way implement
    JavaScript makes it block everything else from being downloaded until it''s finished.
    So, JavaScript in itself isn''t blocking; it''s'
  merge: -1
