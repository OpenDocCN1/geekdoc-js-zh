  md: "```\n\"name\": \"vishaal\",\n\"email\": \"vish@example.com\",\n{\n  \"name\"\
    : \"mike\",\n  \"email\": \"grady@example.com\",\n{\n  \"name\": \"jamie\",\n\
    \  \"email\": \"dusted@example.com\"\n  }\n}\n;\n```\n\n# for Loop\n\nThere are\
    \ few different types of loops in JavaScript, a while loop, a do-while loop, and\
    \ a for loop. Most of them are perfectly fine; I would avoid the foreach loop\
    \ because it's known to be a performance hog, but the others are fine. A while\
    \ loop and a for loop are basically the same thing, the for loop is a little more\
    \ direct, to the point, and it's the most common kind of loop you're going to\
    \ find in the wild. In all the years I've been writing JavaScript, it's been 99%\
    \ for loops. With that in mind, we're going to go over the for loop in this book.\n\
    \nListing 6.5.1 will show you a basic loop, and then we'll go over what's happening.\n\
    \n```\nListing 6.5.1 A for Loop Integrating Address Book Data\n/* cache some initial\
    \ variables */\nvar object = contacts.addressBook,\ncontactsCount = object.length,\n\
    i;\n\n/* loop through each JSON object item until you hit #5, then stop */\nfor\
    \ (i = 0; i < contactsCount; i = i + 1) {\n\n  // code you want to execute over\
    \ and again\n} // end for loop\n```\n\nRight away, we can see that we're saving\
    \ some information to variables. The first variable \"object\" is saving the JSON\
    \ object we create to a variable so it's a little easier to work with. The second\
    \ variable, \"contactsCount\", looks through the JSON object and counts the number\
    \ of items in there. This will let us know how many times to loop through the\
    \ data. The third variable, \"i\", is just a way to declare the counting variable\
    \ for our loop. Later on we'll be setting the value."
