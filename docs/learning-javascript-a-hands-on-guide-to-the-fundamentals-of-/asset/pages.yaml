    \  \"email\": \"dusted@example.com\"\n}\n```\n\n# Benefits of JavaScript Templates\n\
    \nThere are many benefits of using a system of JavaScript templating. For those\
    \ who very much dislike HTML content inside a JavaScript file, they are a great\
    \ way to abstract structure out of your behavior and put it back into the HTML\
    \ where it belongs, in a slightly different, more dynamic way.\n\nThere's always\
    \ the debate over putting behavior in your CSS file with animations, and now there's\
    \ another debate over about putting part of the structure layer into your JavaScript.\
    \ Using JavaScript templates that render content on the client don't align with\
    \ the concepts of progressive enhancement in the way that you may have content\
    \ available, in other ways using these templates creates a harder line for the\
    \ structure layer because it's not JavaScript in the normal sense. I don't think\
    \ there are any developers in the world who honestly say that the first time they\
    \ saw a JavaScript template they said, \"Oh, yeah, that's definitely JavaScript.\"\
    \ It doesn't look or like JavaScript. The only way you can really tell is that\
    \ it's wrapped in a <script> element, and if you turn off JavaScript, it breaks.\n\
    \nHaving correct content without JavaScript is a big deal; won't lie. It's an\
    \ issue where you would need to poll your audience to see if any of them turn\
    \ off JavaScript. If your audience has 100% JavaScript usage, the risk of rendered\
    \ content not appearing is extremely low. These are decisions you will have to\
    \ make as a developer. At times it can be difficult calls to make, such as when\
    \ you drop support for a certain browser, but with the right amount of analytics\
    \ data you can be assured the right decision for your users.\n\n# JavaScript on\
    \ the Server with NodeJS\n\nNodeJS is a server-side implementation of JavaScript,\
    \ but it goes much further than that. The goal of NodeJS is to provide a platform\
    \ to create incredibly fast network applications. It's more than just JavaScript\
    \ running on a server though; the server itself is written in JavaScript. With"
