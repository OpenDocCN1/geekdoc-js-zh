  md: "# Listing 10.4.1 Zebra Striping jQuery Plug-in\n\n```\n// enclose the plug-in\
    \ so no variables leak out\n(function() {\n```\n\n```\n// define and name the\
    \ plug-in\n$.fn.zebraStripe = function(options) {\n\n  // define default options\n\
    \  var defaults = {\n    elToStripe: \"tr\"\n  };\n\n  // let options can be customized\
    \ by the user\n  var options = $.extend(defaults, options);\n\n  // loop through\
    \ each element you're attaching the plug-in\n  return this.each(function() {\n\
    \n    // use the attached element and option value\n    $(this).find(options.elToStripe\
    \ + ':odd').css({\n      'background': '#ccc'\n    });\n  }); // end loop\n});\n\
    }(jQuery);\n```\n\n```\n$(document).ready(function () {\n```\n\n```\n// attached\
    \ zebra strip plug-in to the output div\n$('#output').zebraStripe({\n  elToStripe:\
    \ \"tr\" // if you want to change the option (we didn't)\n});\n```\n\n```\n});\
    \ // close document.\n```\n\nYou see that the difference between the normal function\
    \ and the jQuery plug-in is how they are called. The plug-in is utilizing the\
    \ jQuery selector engine, which feels more natural when working with the library.\
    \ The second argument in the first function is now an option inside the function.\
    \ This pattern probably looks familiar from the JSON object and the jQuery css(),\
    \ animate(), and ajax() methods.\n\nWriting your jQuery code in the form of a\
    \ plug-in not always be the answer, but because you will most likely be using\
    \ plug-ins that others have built, it is nice to know how they are put together,\
    \ which may give you the skills to contribute back to the vast community associated\
    \ with whichever library you choose to work with."
