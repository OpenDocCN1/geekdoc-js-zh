- img_proc: true
  md: '# Interacting with the User Through Events


    In this chapter, you learn how to interact with users by creating and executing
    events. Up to this point, you (as the developer) have been in full control over
    all the conditions in which your functions get executed. You''ve learned to create
    functions, build loops, store data, and travel around the DOM. All the interaction
    controls have been right at your fingertips. lot of the behind-the-scenes part
    of an application works this way, but it''s only half the battle. You won''t always
    have control over when functions get executed. You''ll need to let the user decide
    when it''s best to utilize a certain function. These are called events.


    Events are triggered in the browser when something happens (obviously); users
    do not always initiate them, but they often do. For example, "load" is an event
    that fires when a page is first loaded; although the user did technically something
    to make the page load, it''s more indirect than, for instance, a user clicking
    a link. Click is another event, which happens when a user clicks something (it
    doesn''t matter what it is, we''ll get into that in a bit).


    These events need to be attached to DOM elements to be executed. The statement
    "click a link" means that the event "click" is being attached to a "link," then
    a function is executed. Whether that function is designed to open a URL from an
    href attribute, to hide/show content, or maybe even load someone''s contact information
    from a beautifully designed JSON object from a previous chapter (hint, hint),
    the same model applies:


    +   1. Get a DOM node.

    2. Attach an event to it.

    3. Execute a function when the event is triggered.


    You may have heard something referred as event-driven JavaScript. Just like some
    back-end technologies are best at a class-heavy object-oriented model, JavaScript
    is best at dealing with an event-driven model. This means that you write code,
    something happens (an event), and then it gets executed (a function/method). There
    are constant debates over the best way to format JavaScript: whether to let it
    go wild, whether to use a back-end model view-controller method,'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'how object-oriented you should get, or whether to use an event-driven model.
    Some technolo-gies in a certain area and are meant for a very object-oriented
    model. One of my favorite parts of JavaScript is its freedom in design; it has
    no real implied structure, and you can do whatever is best for you, your team,
    and your users. Personally, I like an event-driven model because it feels more
    natural to the language and the idea of creating user-centered designs. Event-driven
    models also allow you to code in any style you want, and depending on the situ-ation,
    you can use normal functions, methods, objects, or any anonymous functions when
    attach-ing to a DOM element.


    # # Attaching an Event


    Now that you are thinking about events, we can talk about attaching them to DOM
    elements. Events and functions are great; they create human-readable statements
    like "alert message on click." That’s all well and good, but by itself that means
    very little; JavaScript needs more information to complete the task at hand. You
    need to tell the browser exactly what to do when something is clicked. So statements
    like "alert a warning message on click of the button" or "validate this form when
    it is submitted" are a lot more meaningful to a program.


    Attaching an event to a DOM element is one of the most important places to keep
    the meth-ologies behind progressive enhancement in; it’s very easy to create events
    that (for example) communicate to the server or a data set and overlook the fact
    that there is no server-side fallback being in case JavaScript is turned off.
    As previously mentioned, coding this will not only ensure that your content is
    available to all users, but it will also cut down the amount of JavaScript you’ll
    need to write. This will result in better performance and a smoother experience.


    There are a lot of ways to attach an event to a DOM element. Some are flat out
    wrong (using inline JavaScript in your HTML), some are less wrong, and some are
    much better. We’ll be going over two methods:


    +   - Event handlers

    - Event listeners


    # ## Event Handlers


    Event handlers are what I refer to as the "less wrong" way of attaching an event
    to a DOM element. That may have been a little dramatic—there’s nothing technically
    wrong with using an event handler. The method has some drawbacks, which are fixed
    by using other methods.


    Event handlers are very simple to use because they’re very human-readable. In
    Listing 7.1 we can see that we’re using a button element with an id value of "btn"
    and attaching a click event to it in the form of "onclick"; then we set that to
    an anonymous function, which will alert the text "clicked the button."'
