  md: "# JavaScript Designers 281\n\nThe mousemove event is going to do the same action\
    \ as touchmove (like a drag action), you can save yourself some code writing by\
    \ directly mapping the mousemove event to the touchmove event and binding your\
    \ events to the mousemove event instead of both. This sounds a little complex,\
    \ but it really means that you use an event listener for the mousemove event,\
    \ and whenever a touchmove event is triggered, you will force the mousemove event\
    \ to trigger so that its accompanying function will also execute. You can map\
    \ any event to any other event in this way to ensure that you're writing (maintaining)\
    \ any extra code.\n\nListing 12.4.1 shows exactly how you might map touch events\
    \ to mouse events, allowing you to execute the same function without handling\
    \ separate events. There is a lot going on in the example, let's take a look at\
    \ it and go step by step.\n\n# Listing 12.4.1 Mapping Touch to Click\n\n```\n\
    // declare a function to map touch events to mouse events\nfunction mapTouches()\
    \ {\n\n  e.preventDefault();\n\n  var first = e.touches[0], // get the first touch\n\
    \    type = \"\"\n    simulatedEvent = document.createElement(\"MouseEvent\");\
    \ // initialize a phantom\nmouse event\n\n  switch(e.type) {\n\n    // if the\
    \ event is touchstart map it to mousedown\n    case \"mousedown\":\n      break;\n\
    \n    // if the event is touchmove map it to touchmove\n    case \"touchmove\"\
    :\n      break;\n\n    // if the event is touchend map it to mouseup\n    case\
    \ \"touchend\":\n      break;\n  }\n\n// ... code continues on next page\n```"
  merge: -1
