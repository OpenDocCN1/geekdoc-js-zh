  md: '# Traveling Through the DOM


    Using the HTML example from Listing 10.2, we will begin to travel around the DOM,
    like we did in Chapter 4, “Accessing the DOM,” but this time we''ll use the jQuery
    library shortcuts.


    All the functionality of moving up, down, and side to the object model you have
    already done has been rebuilt within jQuery. You may remember that when using
    native JavaScript, you can run into problems with whitespace in your code, causing
    false returns as you travel around the document. This isn''t a problem in jQuery,
    which is another benefit of using a library (it takes care of many common problems).


    In Listing 10.2.4, you will find four methods of traveling around the DOM:


    +   * parents()— Get the immediate parent node.

    * parents()— Look through all parent nodes until you find a selector match (can
    travel multiple levels).

    * find()— Travel the DOM until you find a match (can travel multiple levels).

    * siblings()— Get sibling elements that match the selector.


    You may notice the add() method, as well; this (if you guessed) add a class to
    the selected element. This is in place so you will be able to tell that the elements
    are indeed selected if you were to view the generated source code. addClass()
    takes a single parameter, which is the class to be appended to the element.


    # Listing 10.2.4 Traveling Through the DOM with jQuery


    ```

    // travels up one level

    $(''.module'').parent().addClass(''module-parent'');


    // travels up multiple levels

    $(''p'').parents(''#container'').addClass(''p-parents'');


    // travels down

    $(''#container'').find(''.module'').addClass(''container-find'');


    // travels sideways

    $(''.module'').siblings(''.module'').addClass(''module-siblings'');

    ```


    Just as in JavaScript, jQuery contains shortcut methods for more fine-grained
    travel through the DOM. There are shortcuts to jump to the first item in an array
    of DOM nodes, to the last item, and to move either one node up or down with the
    next() and prev().


    Listing 10.2.5 shows how to use these shortcut methods to jump into and travel
    around the DOM. In this example we are again using the addClass() method to show
    in the generated'
