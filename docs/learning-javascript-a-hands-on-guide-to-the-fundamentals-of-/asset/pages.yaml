    # # Summary


    In this chapter, we went over one of the most important concepts in JavaScript
    development, events. We talked about the different ways that you can tell the
    browser to call a function when an event occurs. We talked about the differences
    between event handlers and event listeners and how to create a cross-browser supported
    version of event listeners. We also went over a few of the more popular events
    you will come across, such as click, focus, blur, keyup, keydown, keypress, mouseover,
    and mouseout. We then took many of those events and directly applied them to our
    address book application.


    The address book should now contain three features: get all contacts, basic search,
    and autocomplete.


    Last, we branched off a bit and got into touch events, giving you some information
    about when and how they are executed along with some basic examples of how they
    work in the real world.


    In the next chapter we''ll begin to explore Ajax and learn how removing the data
    from your JavaScript file will help you create a more scalable and maintainable
    application, which will have the capability to fall back in non-JavaScript environments.


    # # Exercises


    +   1. What is the difference between an event handler and an event listener?

    2. What method is used for fallback support of event listeners in IE8 and earlier?

    3. What is the purpose of the preventDefault() method?'
