  md: '# JavaScript Designers 283


    +   * MutationEvents

    * HTMLEvents


    We won''t get into the other event types at this point, but for our purposes we
    only need to know that we''re using MouseEvents to create the event.


    After the MouseEvent is created, the next step is to initialize the event with
    the initMouseEvent method. In a normal event, this step is also taken care of
    for you. At this point you have to create the event and give it all the appropriate
    properties that a regular event has. It''s like creating a custom event that happens
    to have the same name as a normal event. initMouseEvent method takes 15 arguments.
    The first argument is the most important, the name of the event. We set the name
    of each event in the switch statement by returning the type object, so that Listing
    12.4.2 shows the information and steps in creating this event by using the createEvent
    and initMouseEvent methods.


    # Listing 12.4.2 createEvent() and initMouseEvent()


    ```

    // initialize a phantom mouse event

    var simulatedEvent = document.createElement("MouseEvents");


    // set all the values of the phantom event

    sulatedEvent.initMouseEvent(type, true, true, true, window, 1, first.screenX,

    first.screenY, first.clientX, first.clientY, false, false, false, false, 0,

    null);

    ```


    # The dispatchEvent() Method


    Now that the event is fully created and mapped to the touch event we want, the
    last step is to trigger the event. In our case the event like touchstart, touchmove,
    mousemove, and mouseup (or click). Because these events are now tied, whenever
    the user on a touch device executes one of the events listed, it will automatically
    trigger the mouse event, executing the event listener attached to it (we haven''t
    set up the listener yet, don''t worry).


    As mentioned, now that the events are all mapped, the next step is to trigger
    the event. This method is attached to the object in context; in our case, that
    is the first touch by the user and the target on the finger (first.target).


    In Listing 12.4.3 you can see the dispatchEvent method being passed the simulatedEvent
    object. This is the last step in creating and mapping the events together, but
    we still have to set up the event listeners that will execute the function.'
