    \ to DOM nodes, because it represents a main (a very powerful) feature in JavaScript.\
    \ As browser support for advanced CSS features grows, you will find yourself using\
    \ this model more and more so you can focus JavaScript resources on creating real-time\
    \ data and interaction models.\n\n# List 12.1 Example of CSS with JavaScript\n\
    \n```\n/* the CSS */\n.hide-and-move-up {\n  opacity: 0;\n  position: absolute;\n\
    \  margin-top: -100%;\n  transition: all linear .5s; /* add vendor extensions\
    \ */\n}\n```\n\n```\n/* the JavaScript */\nvar modalWindow = document.getElementById(\"\
    modal-window\");\ncloseButton = document.getElementById(\"close\");\n```\n\n```\n\
    /* when the close button is clicked apply the class */\ncloseButton.addEventListener(\"\
