  md: '# Get Started Fast with Modern JavaScript Development!


    With the arrival of HTML5, jQuery, Ajax, JavaScript web development skills are
    more valuable than ever! This complete, hands-on JavaScript tutorial covers everything
    you need to know now. Using line-by-line code walkthroughs and end-of-chapter
    exercises, top web developer and speaker Tim Wright will help you get results,
    even if you''ve never written a line of JavaScript before.


    Smart, friendly, enthusiastic, and packed with modern examples, Learning JavaScript
    covers both design-level and development-level JavaScript. You''ll find expert
    knowledge and best practices for everything from jQuery and interface to design
    organization and front-end templating. Wright''s focused coverage includes regular
    break points and clear reviews that make modern JavaScript easier to learn—and
    easier to use!


    # Learning JavaScript is your fastest route to success with JavaScript—whether
    you''re entirely new to the language or you need to sharpen and upgrade skills
    you first learned a decade ago!


    All code samples and answers to chapter exercises are available for download at
    informit.com/9780321832740 and on the author''s companion site learningjsbook.com.


