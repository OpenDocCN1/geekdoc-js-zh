  md: '# 218 Chapter 10 Making JavaScript Easier with Libraries


    YUI differs from other libraries that it is modular in nature, which allows it
    to contain the same amount of features as every other library but perform much
    better because you load the parts you need. This allows it to be very scalable
    for large Web applications.


    Some of the features in YUI include utilities for


    +   - Event binding

    - Traveling through the DOM

    - Cache

    - Data Storage

    - Ajax


    YUI has too many features to effectively list here, but you can find an extensive
    list of all the features, widgets, and tools at yilibibrary.com, along with all
    documentation and community activity. To note something about the widget list
    in YUI is that there is an active widget targeting an autocomplete functionality
    for a search form. This is a perfect example of where using a library would have
    saved some time. If we had used YUI to build the autocomplete search form, all
    that functionality, including the Ajax, would have been built for us already.
    Of course, nothing would have been learned, but those are the types of JavaScript
    actions that you build in libraries and frameworks. The YUI is built for the purpose
    of saving your time in your development process


    YUI as a whole is called a framework because it contains the YUI JavaScript Library,
    the YUI CSS Library, and other tools like the YUI Online Code Compressor, which
    will amply minify your code for you. All these tools inside the framework can
    be used independently, but they fit well together and are intended to be used
    as a single unit (aka, framework). The YUI Library contains styles, which map
    directly to classes that are added to the DOM when you use the various widgets
    available in the framework (like autocomplete). Pairing up the CSS and JavaScript
    that helps clean styling of elements by default to prevent the perception that
    there may be a problem if a widget looks a little off when loaded without the
    accompanying CSS file.


    All the information, data, and documentation on the YUI Framework is located on
    yilibibrary.com (deceptive URL, I know, it''s a framework). Many beginners find
    YUI to be a little overwhelmed with its modular nature. It works very well when
    building large-scale Web applications. Yahoo! Mail was written using YUI; the
    YUI''s modular nature makes it very easy to scale while keeping performance at
    the forefront. However, if you need a little more lighthearted for a smaller application
    or site, it''s worth taking a look at the elephant in the room: jQuery.


    # jQuery


    At the time of this writing, jQuery is, by a large margin, the most popular JavaScript
    library being used in more than 50% of all the top websites. It was written by
    John Resig and released in 2006. It is currently being maintained by a small team
    of developers. jQuery, like YUI and most other JavaScript libraries, is open source
    and free to the public.'
