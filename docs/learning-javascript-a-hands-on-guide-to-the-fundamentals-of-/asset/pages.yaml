    <script src="js/script.js"></script>

    </body>

    </html>

    ```


    As you can see in Listing 2.1, this is a very basic layout, but it is still firing
    off 10 HTTP requests to render the page (including the original request for the
    HTML). They pile up fast, so it''s best to keep an eye on them. You may also have
    hidden requests if you''re getting images via your CSS file (background images),
    which add to the total count and can bog down page performance.


    By default, the average browser will fetch these assets in pairs—that is, two
    at a time. It can get two images, two CSS files, and so on until everything is
    fetched at the same time because of bandwidth constraints, but there is a user
    setting in most browsers to change this setting from 2 to whatever you''d like
    (it is extremely rare to encounter someone who has changed this setting). It''s
    generally kept at 2 to keep wear on the processor as low as possible to not affect
    anything else on a user''s machine.'
