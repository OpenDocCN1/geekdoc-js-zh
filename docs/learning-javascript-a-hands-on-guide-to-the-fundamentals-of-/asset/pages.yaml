  md: "```\n} else {\n  // if removeEventListener isn't supported (IE8 and below)\n\
    \  btn.detachEvent(\"click\", alertMessage);\n}\n```\n\n# Mouse and Keyboard Events\n\
    \nThe most common events, other than load, that you will use are most likely mouse\
    \ and keyboard-based events. What are mouse and keyboard-based events? Events\
    \ such as\n\n+   - click\n- focus\n- blur\n- change\n- mouseover (hover part 1)\n\
    - mouseout (hover part 2)\n- submit (form submit)\n\nThere are a lot of events\
