  md: '# Moving Forward with JavaScript


    In this chapter, we take a look into some areas of JavaScript that may help you
    move on to the next level in your coding Journey. Many times when a book is finished
    you''re left with empty feeling, thinking “now what?” With the content presented
    in this chapter, I hope to lead you in a direction so you can decide for yourself
    what the best path forward is. This includes a brief review of the content we''ve
    gone over throughout the course of this book in a single sitting as a refresh
    to your memory of how far you''ve come. Unless you''ve sat down to read this book
    in a solid (which would be amazingly impressive), I''m sure there are gaps in
    the topics we went over. Even though many of the examples retain much of the information,
    there are always pieces that slip through the cracks. Hopefully, we can fill in
    those cracks.


    The JavaScript you have learned to this point has been pretty generalized, with
    the goal of creating a solid knowledge-base that you will need to continue learning
    and building in the language. However, every person who sits down to learn JavaScript
    comes with a different background and mind-set. Some of us are designers, some
    of us are developers, and others don''t quite know yet.


    If you are a designer, you will be using JavaScript in a very different way compared
    to how a developer would use it. This is in part of how diverse JavaScript can
    be as a language. Although the basic knowledge of DOM manipulation, data storage,
    looping, and server communication will always be necessary to a designer or a
    developer, moving towards your goals can be a very different experience.


    We keep the overall user experience in mind, but a designer might focus on user
    interface, animations, and special design-level issues that a developer might
    focus on data transfers and building the DOM in an efficient way. This chapter
    addresses both paths and shows how you might continue your path from here.


    After the review, this chapter is broken up in the two distinct parts:


    +   - JavaScript for Designers

    - JavaScript for Developers'
