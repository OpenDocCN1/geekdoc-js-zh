  md: "# Chapter 1 Progressive Enhancement\n\nrelative, CSS. Most people are surprised\
    \ when I tell them that the key to writing JavaScript is knowing when to use CSS\
    \ instead. However, you still need to know how to write good CSS. Progressive\
    \ enhancement states that you can use a few ways to attach style to a document.\
    \ Progressive enhancement out of your HTML (external CSS), and that is correct,\
    \ but I also want to go over another method, inline CSS.\n\n# Inline CSS\n\nInline\
    \ CSS is used with a style attribute, which is attached directly to an HTML element,\
    \ and styles are applied to only that element; they cannot be cached and cannot\
    \ be reused like the style applied in Listing 1.1.2.\n\nListing 1.1.2 Example\
    \ of Inline CSS\n\n```\n<nav id=\"nav\" style=\"background:#c00;padding:10px;\"\
    >\n<ul style=\"list-style:none;margin:0;\">\n  <li style=\"float:left;\"><a href=\"\
    /about\">About</a></li>\n  <li style=\"float:left;\"><a href=\"/articles\">Articles</a></li>\n\
    \  <li style=\"float:left;\"><a href=\"/staff\">Staff</a></li>\n  <li style=\"\
    float:left;\"><a href=\"/contact\">Contact</a></li>\n</ul>\n</nav>\n```\n\nThere\
    \ are many reasons not to treat your CSS and HTML like this. Right off the bat,\
    \ you can see that this HTML looks cluttered, and is hard to tell what content\
    \ is buried in there. I already mentioned that it won't be cached, so you will\
    \ need to rerender the styles each time the page loads until the HTML has been\
    \ changed. This way of applying styles is very difficult to maintain and reuse\
    \ on a site because everything is coupled and tied to the element to it is attached.\n\
    \nInline CSS is fairly important because many of the functions that are common\
    \ to JavaScript dynamically generate these attributes in HTML, and if all your\
    \ JavaScript is generating CSS, then why not use CSS? This is what I was talking\
    \ about when I mentioned how well CSS will help you better JavaScript. Generating\
    \ inline CSS with JavaScript on-the-fly can be just as bad as applying them by\
    \ hand in your HTML. It's certainly something to be aware of when you are building\
    \ a site.\n\n# Linking Your Stylesheet\n\nKeeping your CSS in a completely separate\
    \ file and linking it to your HTML document, by a wide margin, the most desirable\
    \ and best way to apply design to a site. You'll be applying styles through meaningful\
    \ hooks you left in the HTML-like classes, IDs, and even normal HTML elements.\
    \ In Listing 1.1.3 you can see how simple it is to link a CSS file to an HTML\
    \ document."
  merge: -1
  pgno: 31
- img_proc: true
  md: "# Listing 1.1.3 <head> Section of the HTML5 Document\n\n```\n<head>\n<title>Great\
    \ Home Page in HTML5</title>\n<meta charset=\"utf-8\">\n\n<!--CSS-->\n<link rel=\"\
    stylesheet\" href=\"css/styles.css\">\n\n</head>\n```\n\nIt is best to keep all\
    \ your CSS in one file, even though you could, in theory, attach as many as you\
    \ want. Linking any asset (CSS file, JavaScript file, image) to an HTML document\
    \ fires off what is called an HTTP request, which just means the browser has to\
    \ get the asset and download it before it's viewable to the user. It happens all\
    \ the time, and for the most part it's transparent. However, you still want to\
    \ minimize the number of HTTP requests; at some point it will start to bog the\
    \ performance (load time) of a site. If you keep all CSS contained in a single\
    \ file (one file = one HTTP request). Listing 1.1.4 is what your CSS file might\
    \ contain to be applied to the HTML in Listing 1.1 or Listing 1.1.1.\n\n# Listing\
    \ 1.1.4 CSS Contained in the styles.css File Referenced in Listing 1.1.3\n\n```\n\
    #nav {\n  background:#000;\n  padding:10px;\n  overflow:hidden;\n}\n\n#nav ul\
    \ {\n  list-style:none;\n  margin:0;\n  padding:0;\n}\n\n#nav li {\n  float:left;\n\
    }\n\n#nav li a {\n  padding:0 10px; color:#fff;\n```\n\nAdmittedly, this is a\
    \ pretty ugly design at this point, but that's okay because it illustrates the\
    \ point that it is very easy to separate the structure of a document from how\
    \ it looks. As you can see in Listing 1.1.4, we are adding some light design to\
    \ the navigation without touching the markup to convey it."
  merge: -1
