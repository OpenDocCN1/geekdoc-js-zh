    much more helpful than something like, “firstVariableName”. Something else to
    consider when naming variables is that they cannot start with a number. They can
    contain numbers, as as “dogs3” or “catsStink4Eva”, but they can’t begin with a
    number, as as “3dogs”.


    # Grouping Variables


    When you''re writing an application, it''s best to group all variables at the
    top of your JavaScript file or function (when possible) so they all be immediately
    caught for later reference. Some people find this method a little unnatural because
    functions are defined throughout the document, and it''s a little easier to maintain
    when variables are right there with the function they belong; but grouping variables
    at the top is one of those performance boosts you can give to your application.
    It helps to think of it as one large file containing JavaScript for an application
    versus thinking of the file as a collection of one-off actions that executed.
    When thinking of it as a single unit, it feels a better (to me) when I''m grouping
    all variables at the top.


    You can group variables in your document in two ways. Up to this point we have
    been using a new var declaration for each variable; lot of people prefer this
    method, and it''s perfectly to use. An alternative method is to use a single var
    declaration, using commas to separate the individual variables and a semicolon
    at the very end. Listing 6.1 shows an example of grouping variables with a single
    declaration. Note the commas at the end of each line.


    # Listing 6.1 Grouping Variables with a Single var Declaration


    ```

    var highSchool = "Hill",ncollege = "Paul",ngradSchool = "Vishaal";

    ```


    There''s no difference in the way you access these variables compared to how you
    access variables declared with individual var declarations. At the variable level,
    it''s purely a way to group. It''s not good or bad at this point—it''s only personal
    preference. You''ll see both methods in looking through JavaScript others have
    written, so it''s good to know what''s going on.


    You see this style of variable declaration a lot more when getting into objects,
    methods, and grouping functions together. I prefer it because it feels cleaner
    and a little more consistent, but as you progress you will settle on a preference
    of your own. Both are certainly valid methods.


