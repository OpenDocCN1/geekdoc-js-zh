  md: "```\nsayHello(greeting);\nsayHello(exitStatement);\n\n)();\n```\n\n# Returning\
    \ Data\n\nEvery function you create will not result in a direct output. Up to\
    \ this point you've been creating functions that do something tangible, usually\
    \ alerting a piece of data into the browser. You won't always want to do that,\
    \ from time to time you will create a function that returns information for another\
    \ function to use. This will make your functions a little smaller, and if the\
    \ function that gathers information is general enough, you can reuse it to pass\
    \ the same (or different) information into multiple functions.\n\nBeing able to\
    \ return data and pass it into another function is a powerful feature of JavaScript.\n\
    \n# Returning a Single Value\n\nGoing back to the sayHello() function that was\
    \ previously executed in Listing 6.2, we're going to remove the alert() action\
    \ that was previously executed when the function was called, and we'll replace\
    \ it with a return statement. This is depicted in Listing 6.3.3.\n\n# Listing\
    \ 6.3.3 Returning Data with a Function\n\n```\nfunction sayHello(message){\n \
    \ return message + \"!\"; // add some emotion too\n}\n```\n\nYou'll probably notice\
    \ that the sayHello() function doesn't do anything in the browser anymore. That's\
    \ a good thing (unless you're getting an error—that's a bad thing). It means the\
    \ function is now returning the data but it's just sitting waiting to be used\
    \ by another function.\n\n# Returning Multiple Values\n\nSometimes returning a\
    \ single value isn't enough for what you're trying to accomplish. In that case\
