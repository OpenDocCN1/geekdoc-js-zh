  md: "# Listing 9.4 A Variable Definition Block Example\n\n```\n(function () {\n\n\
    \  \"use strict\";\n\n  var body = document.getElementsByTagName(\"body\")[0];\
    \ // target element\n  partyStarter = \"Starlen\"; // name of the person running\
