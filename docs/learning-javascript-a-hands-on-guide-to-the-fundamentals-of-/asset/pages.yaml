  md: '# A Brief Review of Key Topics 275


    Progressive enhancement also leads into areas such as accessibility and graceful
    degradation, both topics that were central methodologies throughout the content
    of this book and that will guide you as you continue designing and developing
    for the Web.


    When the topic of accessibility is approached, it is generally from the angle
    of a disabled user accessing a site from some kind of assistive technology. We
    spoke about two major areas of accessibility in the form of WAI-ARIA. Both are
    within HTML, flagging zones of a document to more accurately describe the contents,
    and also from a server communication model in making Ajax and the asynchronous
    updating of a document (without a page refresh) visible to a screen reader by
    announcing when an area is updated.


    Accessibility goes beyond screen readers and devices, course. It speaks to the
    main goals of progressive enhancement, creating a system where content is always
    available to the user, whether it is being accessed through a fully featured desktop
    medium, a screen reader, a mobile device, a tablet, or another device for some
    reason is browsing with JavaScript turned off.


    Users browsing with JavaScript turned off are a concern that shrinks with every
    passing day, but until the option is removed from the browser altogether, it is
    something we will all have to be aware of.


    These are the main principles of progressive enhancement, denying no one access
    to what they need. Step one is learning and implementing these guides. Step two,
    which we will get into a little later in the chapter, is breaking them. Of course
    there a difference between ignoring rules altogether and breaking them. The rules
    of progressive enhancement should never be ignored, but breaking them in proper
    responsibilities when it''s the right tool for the job can create interesting
    scenarios in your path to creating a great user experience.


    # DOM Manipulation


    Manipulating and traveling around the DOM are main concepts in JavaScript development.
    There are very few examples of interface design where you don''t have to manipulate
    the DOM in one way or another. Whether you''re outputting data after an Ajax call
    or adding classes to a DOM node based on a user interaction, you''ll be doing
    DOM manipulation in one form or another. It is a skill that both designers and
    developers need to possess to effectively code with JavaScript.


    We went over a lot of different ways to enter the DOM. There are JavaScript methods
    like parentNode, firstName, and lastChild that take advantage of the parent-child
    relationship when you''re traveling around a document. Others, nextSibling and
    previousSibling, allow you to travel horizontally within an HTML document. You
    learned that there is always a way to get to a DOM node: if you get it with JavaScript.
    This includes the more direct methods of DOM entry, such as getElementById, getElementsByTagName,
    and the newer, less supported querySelector and querySelectorAll. By now are,
    hopefully, pretty comfortable with the various methods when entering a document.
    We have talked about the various levels of support for all the DOM'
