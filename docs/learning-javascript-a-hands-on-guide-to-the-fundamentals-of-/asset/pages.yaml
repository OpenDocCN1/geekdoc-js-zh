  md: "# Chapter 7 Interacting with the User Through Events\n\n```\n) else {\n  /*\
    \ if it's not supported do this (for IE8 and below) */\n  element.attachEvent(\"\
    click\", function() {\n\n    // alert inside this anonymous callback function\n\
    \    alert(\"Clicked the button\");\n  });\n}\n```\n\nThe method of detection\
    \ in Listing 7.2.2 works because in an unsupported browser, btn.addEventListener\
    \ will return as undefined and the if statement will continue onto the else portion\
    \ of the statement.\n\n# Binding Events\n\nWhen binding (attaching) events to\
    \ DOM elements, there are a few weird things to note. Remember that when a function\
    \ is nested inside an object, it's actually called a method? Well, something similar\
    \ is going with event listeners and event binding.\n\nWhen a function is inside\
    \ addEventListener() method, it's called an event listener. It's still a function\
    \ when it's outside the addEventListener() method, but when it's in the context\
    \ of that particular method it's referred to as an event listener you're adding\
    \ to.\n\nThere is one other strange thing about calling functions inside the addEventListener()\
    \ method. They don't have parentheses like they've had up to this point in the\
    \ book. Because the parentheses mean \"call this now\" and we don't want to do\
    \ that in a listener, you leave them off. Listing 7.3 shows how to use a predefined\
    \ function as a listener by dropping the parentheses. If the parentheses were\
    \ to be left on, the function would execute immediately on load of the page, even\
    \ if it's inside the addEventListener() method.\n\n# Listing 7.3 Binding an Event\
    \ to a DOM Element\n\n```\n// save the DOM element you want to attach an event\
    \ to\nvar btn = document.getElementById(\"btn\");\n```\n\n```\n// define your\
    \ function normally\nfunction alertMessage() {\n  alert(\"clicked the button\"\
    );\n}\n```\n\n```\n// or use a predefined function (event handler), \"alertMessage\"\
    \nbtn.addEventListener(\"click\", alertMessage, false);\n```"
