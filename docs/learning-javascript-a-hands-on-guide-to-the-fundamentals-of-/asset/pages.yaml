  md: "```\n<li><a href=\"/about\">About</a></li>\n<li><a href=\"/articles\">Articles</a></li>\n\
    <li><a href=\"/staff\">Staff</a></li>\n<li><a href=\"/contact\">Contact</a></li>\n\
    </nav>\n\n<!-- replacing DIV with the new ARTICLE element -->\n<article id=\"\
    main\" role=\"main\">\n[content here]\n</article>\n\n<!-- replacing DIV with the\
    \ new FOOTER element -->\n<footer id=\"footer\" role=\"contentinfo\">\n  <p>&copy;\
    \ 2012 Awesome Site</p>\n</footer>\n\n<body>\n</html>\n```\n\nHTML5 also brought\
    \ with it new accessibility attributes for describing content to HTML5 readers.\
    \ In the preceding listing, you can see \"role\" attributes attached to the new\
    \ HTML5 elements. These elements are very helpful because the HTML5 elements can\
    \ be used over and inside a single document (an element that you can only use\
    \ once isn't super-helpful!) and by assigning a role to an element, you can more\
    \ accurately describe its content. For example, the <header> in Listing 1.1.1\
    \ has a role of \"banner\", which lets you know that, in this case, the <header>\
    \ is used as a banner or masthead of the document. These are called aria roles\
    \ and go slightly beyond the scope of this book, but they are a great enhancement\
    \ to your HTML. Whether you're using HTML5 or not, you can still use these aria\
    \ roles to create more accessible content.\n\nNow that you have a strong understanding\
    \ of document structure, you can begin adding design to the document with the\
    \ second layer of progressive enhancement: CSS.\n\n# Presentation Layer\n\nAll\
    \ content must be reachable without CSS.\n\nAfter your document is laid out in\
    \ a meaningful structure, you can start accessing structure with CSS and applying\
    \ the design. This can be the most important layer in progressive enhancement\
    \ because of how flexible it is. Knowing CSS will help you write better JavaScript.\
    \ For performance, you can't beat the rendering speed of CSS, especially when\
    \ compared to that of JavaScript, which is notoriously slow to render in a browser."
