  md: '# Making JavaScript Easier with Libraries


    In this chapter, I make your life easier. Bold statement, I know, but that''s
    exactly what we''re here for. So far in the course of writing all these chapters,
    I have been doing my absolute best to present the JavaScript language in a unique
    and true-to-life way with the idea that will ease the pain of learning something
    that may have been presented in other mediums as overly complicated. However,
    when some people learn JavaScript, it is a very natural flow with their build
    process, for others, learning a development language like JavaScript can be very
    hard. I realize we do our best to create an understanding and organic flow to
    the learning experience to aid in the creation of what we call "ah-ha moments,"
    where everything you''ve been learning suddenly makes sense, like magic.


    Because JavaScript and the Web as a whole is one giant work in progress, there
    are a lot unknowns, gaps in functionality, and developing standards that we need
    to work with or around. Depending on where your love affair with JavaScript currently
    is, this can either be a delight or a nightmare.


    This chapter is an exploration and introduction to JavaScript libraries. Previous
    to this chapter you have seen very brief references to libraries and how we use
    them. This chapter elaborates on the concepts of libraries in general and how
    they are used in JavaScript. We go over a lot of different aspects that encompass
    the concept of using someone else''s code; we talk about the good, the bad, and
    some alternatives. We also explore some library methods and how they help map
    and relate to their native JavaScript counterparts.


    Working with a JavaScript library will make your life easier, and there are entire
    books dedicated to tutoring through each one (not each one, but the popular ones,
    for sure). At point in your JavaScript career, you will likely use a library of
    some kind; in fact, there is a good chance that you''ve heard of the libraries
    we will be going over. It''s very easy to get lost and overreliant on them, but
    if you keep in mind that it''s still JavaScript, you will be miles ahead and have
    the ability to switch between various libraries with a minimal learning curve.
    As you go through this chapter, keep in mind one important concept that a surprising
    number of people forget about libraries: it''s all still JavaScript.'
  merge: -1
