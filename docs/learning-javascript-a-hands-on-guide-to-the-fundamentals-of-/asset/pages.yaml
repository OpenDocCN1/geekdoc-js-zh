  md: "# Working with the Element Node\n\na consistent syntax in selectors between\
    \ CSS and JavaScript. This caused an explosion in the JavaScript community, and\
    \ all of a sudden previously difficult-to-use language for designers became a\
    \ delight to work with.\n\nWith the release of the HTML5 specification came a\
    \ new flood of JavaScript APIs as well. One of the main themes with HTML5 was\
    \ listening to what the community wanted to be formalized into the language. It\
    \ was clear that they wanted to use CSS selectors in JavaScript, so out came new\
    \ methods: `querySelector()` and `querySelectorAll()`.\n\nBoth methods can take\
    \ selectors in CSS format. The difference between the two is that `querySelectorAll()`\
    \ will return a NodeList (the same as `getElementsByClassName()` and `getElementsByTagName()`)\
    \ do and `querySelector()` will return only the first element that it comes across.\
    \ Let's look at the following HTML in Listing 4.5.\n\n# Listing 4.5 Basic HTML\
    \ Structure with Elements, IDs, and Classes\n\n```\n<body>\n  <div id=\"header\"\
    >\n    <h1>Using querySelector</h1>\n  </div>\n\n  <p class=\"dropcap huge\">Content\
    \ paragraph</p>\n  <p class=\"dropcap\">Content <span class=\"huge\">paragraph</span></span></p>\n\
    \  <p class=\"dropcap\">Content paragraph</p>\n</body>\n```\n\nWe can target those\
    \ elements with the following JavaScript, as shown in Listing 4.5.1.\n\n# Listing\
    \ 4.5.1 Using querySelectors\n\n```\n// get the header ID element\ndocument.querySelector(\"\
    #header\");\n\n// get the first element with a dropcap class\ndocument.querySelector(\"\
    .dropcap\");\n\n// get all the paragraphs with a \"dropcap\" class -- produces\
    \ a NodeList\ndocument.querySelectorAll(\".dropcap\");\n\n// get all elements\
    \ with a class of \"dropcap\" OR \"huge\"\ndocument.querySelectorAll(\".dropcap,\
    \ .huge\");\n\n// get all paragraphs that have a class\ndocument.querySelectorAll(\"\
    p[class]\");\");\n```"
