  md: '# HTML5 JavaScript APIs


    This chapter begins our exploration into HTML5 and its accompanying JavaScript
    APIs. It''s not uncommon to hear the term “HTML5” and immediately jump to the
    typical structure-based mind-set that has been associated with HTML thus far.
    Certainly no one would blame you for immediately thinking like that, especially
    now that you have knowledge of progressive enhancement, but a lot of features
    that shipped with HTML5 are not solely targeted at building an HTML document.
    A whole slew of JavaScript APIs were built with the intention of tying into the
    new elements, and even some that live independently of the DOM.


    The official W3C specification for HTML5 has gone through many revisions that
    are in the spec and which have been removed. When a feature gets removed from
    the specification, it doesn''t mean it is no longer a feature; it can be quite
    the opposite. Although items get removed and dropped, many features get removed
    because they''re too large to be contained inside the specification as other HTML5
    elements. One example is the Geolocation API we talk about later in this chapter.


    Is Geolocation in the current HTML5 specification? No. Was it? Yes. It wasn''t;
    it was removed because it needed its dedicated specification. This has happened
    a bit with other features, as well. Although what is officially HTML5 can change
    from day to day, the cool features available probably don''t. In truth, it''s
    more important to focus on the individual features, such as Geolocation or the
    History API or audio and video implementation, although what we really care about
    is how browsers have implemented the features and if they\u21re handling them
    in a consistent manner


    As this chapter progresses, we go over the most glaring gleams of HTML5: the mark-up
    and the JavaScript APIs. We introduce some of the new structural elements in the
    language and some very common accessibility enhancements that have been added
    into the specification in the form of ARIA roles. It''s going to be a wild ride
    through the world of HTML5, so have a seat, buckle in, and let''s get started.'
