  md: "# Chapter 12 Moving Forward with JavaScript\n\nmethods, and ever explored the\
    \ world of JavaScript libraries and how the methods map to their related methods\
    \ in native JavaScript.\n\nWhen manipulating the DOM for interface design, it\
    \ is important to keep performance in mind because it is our first line of defense\
    \ when molding a user experience. Using an event-driven JavaScript model means\
    \ that many things that happen in an interface are triggered by user feedback,\
    \ in the form of events. When users click, swipe, pinch, or rotate a page in any\
    \ way, they expect some feedback immediately. Feedback could be modal window closing,\
    \ a tapping itself, or the appearance of a loading graphic until data is received.\
    \ Because this feedback needs to be created as fast as possible, it can be invaluable\
    \ to the overall user experience to be able to recognize points in an interaction\
    \ where you can accomplish the same task with CSS that you were trying to create\
    \ with JavaScript, because at this point CSS rendering in a browser happens significantly\
    \ faster than that of JavaScript. The action of adding/removing a class can allow\
    \ you to offload some processing to nonblocking CSS instead of custom features\
    \ in JavaScript that already exist within another language and is readily available\
    \ and possibly served from cache.\n\nList 12.1 shows you an example of how you\
    \ use JavaScript to manipulate the DOM by adding a class to an area and simulate\
