    \ and assume that we will get the parent element for the target node and add a\
    \ class of “active” to it.\n\n# Listing 4.8 Basic HTML Example of Navigation\n\
    \n```\n<ul id=\"nav\">\n  <li><a href=\"/\" id=\"home\">Home</a></li>\n  <li><a\
    \ href=\"/about\" id=\"about\">About Us</a></li>\n  <li><a href=\"/contact\" id=\"\
    contact\">Contact Us</a></li>\n</ul>\n```\n\nUsing the JavaScript in 4.8.1, you\
    \ can execute the desired behavior.\n\n# Listing 4.8.1 Targeting a parentNode\n\
    \n```\n// target the \"about\" link and apply a class to its parent list item\n\
    document.getElementById(\"about\").parentNode.setAttribute(\"class\", \"active\"\
    );\n```\n\nBesides moving in a parent-relationship (or you), you can also move\
    \ side to side in the DOM and target nodes next to a target node. These are called\
    \ siblings, and special methods allow us to target them: previousSibling and nextSibling.\
    \ In our example we still want to add a class to the About link, but instead of\
    \ adding a class to the parent element, we add a class to Home (previousSibling)\
    \ and Contact Us. We could use the JavaScript in 4.8.2.\n\n# Listing 4.8.2 Adding\
    \ a Class to Previous and Next Sibling Nodes\n\n```\n// get \"about\" parent,\
    \ then its previous sibling and apply a class\ndocument.getElementById(\"about\"\
