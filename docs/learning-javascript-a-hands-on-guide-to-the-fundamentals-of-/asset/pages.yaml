    Because it is an experimental object, you may have to use the vendor prefix to
    access the device, as it does, for the example in Listing 11.7 to work properly.
    In Firefox the battery object is navigator.mozBattery, and in Chrome/Safari it
    is navigator.webkitBattery. Vendor extensions for experimental properties in JavaScript
    work the same as they do in CSS, but with a slightly different syntax. So if you
    use a JavaScript object prefixed with webkit or moz, you know you''re living at
    the edge of the Web.


    # The Vibration API


    The Vibration API is another of those bleeding-edge JavaScript APIs that isn''t
    very quite yet, but it does exactly what you think it does. It provides programmatic
    access to the vibration mechanism of a device. Of course, it will work only if
    the host device has a vibration mechanism in the first place. You probably won''t
    be able to vibrate someone''s Apple iPhone, even if you can find a way to get
    it to the latest version of Chrome.


    The official W3C specification for this API doesn''t appear to enforce vibration
    limitations out of the box, so this is going to be one of the more fun APIs to
    play around with after starts to take off. I imagine it will result in a lot of
    dropped frames as well if you start randomly vibrating things. You certainly need
    to be careful with something like this, even though it is meant to be used to
    provide tactile feedback in gaming and not as a generic notification system.


    Like the Battery Status API, the Vibration API is part of the navigator object
    in JavaScript, and it is accessed the same way. It takes a single argument, which
    can be a numerical value representing the length of the vibration (in milliseconds)
    or an array of numbers representing a vibration interval. Listing 11.8 shows the
    two syntax possibilities for calling the vibration.


    Listing 11.8 Basics of the Vibration API


    ```

    // vibrate for 1 second

    navigator.vibrate(1000);

    ```


    ```

    // vibrate for 1 second with an array

    navigator.vibrate([1000]);

    ```


    Listing 11.8 shows the two formats of the Vibration API. The array option exists
    to set up interval vibrations. For example, if you were to enter three numbers
    into the array, the first and third represent the length of two vibrations, and
    the second value is the amount of time the API should be paused before executing
    the second vibration.'
