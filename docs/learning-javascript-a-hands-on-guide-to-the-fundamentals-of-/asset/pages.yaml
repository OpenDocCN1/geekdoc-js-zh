  md: '# The Library Learning Process


    There is a learning process that everyone goes through when exploring libraries
    in general. Most stick to this thought process so tightly that it is almost comical
    to observe a fellow developer or designer travel through it. The steps will inevitably
    take you from loving libraries to hating them, eventually settling somewhere in
    the middle. You may even become one of those really smart people who answer every
    question by saying, "It depends," when asked your opinion about using libraries.


    When you''re due to JavaScript, you''re experiencing a lot of frustrations over
    inconsistent browser support, knowledge gaps, and struggling to fix your coding
    groove with organization. In a nutshell, there''s a growing laundry list of things
    that you don''t want to deal with, whether you fully understand them or not. It''s
    a completely natural reaction to automate the boring stuff so you can focus on
    the more interesting things. For some people, focusing on interaction design is
    on their list, so they may use libraries to handle the more hardcore aspects of
    JavaScript, like server communication (Ajax). Others who enjoy the developer side
    of JavaScript use libraries for easy and immediate user-interface patterns they
    don''t have to worry about the design of things.


    When you discover aspects of the language you like and which ones you don''t,
    you will probably start filling the gaps you don''t like with libraries and let
    someone else do the heavy lifting you don''t want to do. This is the first step
    of getting into a library. In step 1 you like libraries because they do what you
    don''t want to do, and there''s nothing to worry about. You will even start discovering
    aspects of the library that can enhance the parts of the job that you really like.
    Libraries make things easier; it''s really their job and they''re very good at
    it.


    As you get deeper into developing your JavaScript based on a library system, you
    will probably get to step 2 in the learning process where you begin to tighten
    up your general JavaScript skills in areas where you were previously weak, and
    you begin discovering that there is a lot of code in the library that you don''t
    need anymore. Maybe you''re using only a few of the predefined methods and you
    succeed without relying on them. At this point you will begin distancing yourself
    from libraries and start building applications with only native JavaScript. As
    you step through your new library-based JavaScript applications, you rediscover
    a lot of the frustrations you had to deal with when you first started. You may
    even start building your own library before realizing that someone already took
    the time to assemble all the common functions people use. Then, like magic,


    Even though you''re back to using a library, step 3 in the learning process is
    very different from step 1 because of all the knowledge you have gained along
    the way. This is the point where you''ve come to the conclusions that libraries
    can be both good and bad; it all depends on how you use them (there''s "it depends"
    statement). Libraries can be used very elegantly and can be integrated into your
    normal code, and they can be used in ways that overpower an application. It all
    depends on how you use a library whether it''s a good or a bad thing. We get into
    the good and bad later in this chapter.'
  merge: -1
