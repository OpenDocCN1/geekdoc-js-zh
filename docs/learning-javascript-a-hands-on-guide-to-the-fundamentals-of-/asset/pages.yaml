  md: "```\n<li><a href=\"/contact\">Contact</a></li>\n</ul>\n</nav>\n<script>\n/*\n\
    The Function,\ndefine the thing you want to happen\n*/\nfunction doTheThing()\
    \ {\n  alert('This is the thing!');\n}\n/*\nThe Variable,\nget the element you\
    \ want to do it on\n*/\nvar elem = document.getElementById(\"about\");\n\n/*\n\
    The Event Listener,\nset something to listen for the event you want, then execute\
    \ the function\n*/\nelem.addEventListener(\"click\", doTheThing, false);\n</script>\n\
    ```\n\nIn the preceding example, you can see that there is a <script> element\
    \ placed under the <nav> element, and inside the <script> three things are going\
    \ on:\n\n+   - Defining a function\n- Defining a variable\n- Setting up an Event\
    \ Listener\n\nAlthough this JavaScript is completely unobtrusive, it still lives\
    \ in the HTML document, and that's not something progressive enhancement likes\
    \ to. Ideally, all that JavaScript should be placed in an external file. When\
    \ you do, you finally hit the goal of external and fully unobtrusive JavaScript,\
    \ which means all your layers are successfully isolated based on the principles\
    \ of progressive enhancement. Next, we'll take a look at how you can externalize\
    \ this script."
