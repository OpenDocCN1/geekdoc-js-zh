  md: '# Communicating with the Server Through Ajax


    In this chapter, we take a step into the world of Ajax. We extend code from previous
    chapters and take that codebase to the next level by interlacing it with a server
    communication layer to retrieve the data. More specifically, we take the JSON
    object you''ve been working with and move it to an external file. Then we pull
    it in with a combination of user events (just like before) and Ajax calls to create
    another layer of separation where the data source is external to our normal stack
    of structure, presentation, and behavior. The data layer can be in almost any
    form from JSON (which is what we''re using) to a fully functional database.


    In previous chapters, we mentioned Ajax briefly, but in this chapter you learn
    exactly how to create and execute an Ajax call. You break down the anatomy of
    each action and discover new core JavaScript methods in the process. Although
    the functionality of our autocomplete contact search won''t change, the JavaScript
    file will be a little smaller without the JSON object in there, and by moving
    the data to an external source it will become much easier to add more contacts
    to the data set (scaling).


    Something to about the Ajax demos in this chapter is that Ajax is a server communication
    technology, you will need a running server to see the effects of the Ajax we implement.
    Otherwise they will appear to broken. If you don''t have a server to run the demos,
    setting up a local server is very easy. If you are on a Windows machine, there
    is a prepackaged server-setup application called WAMP; the Mac version is called
    MAMP. Both are as close to single-click server installs as you''re going to get.
    They will install a local apache server, the latest version of PHP, and a fully
    functional MySQL database on your local machine. They can easily be turned on
    and off, so don''t worry about having a server running all the time sucking up
    your battery life. It is also just a good idea to have a server available to you
    as a general best practice because you''re already on your way to becoming an
    industry all-star!'
