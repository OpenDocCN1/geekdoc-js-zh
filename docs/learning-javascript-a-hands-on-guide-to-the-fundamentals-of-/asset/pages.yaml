    # Comments


    JavaScript comments are like any comment in another language, but you can use
    two syntaxes. One is intended for blocks of code and the other for single-line
    comments, but it''s really a matter of personal preference; no one will judge
    you if you choose to use one comment style over another. Listing 3.2.3 shows the
    two styles of commenting in JavaScript.


    Listing 3.2.3 JavaScript Comments


    ```

    // this is a single-line comment


    /*

    this is a multiple

    line comment if you need to be more descriptive

    or disable a large chunk of code

    */

    ```


    It''s important to use helpful comments in your code, not only so you can go back
    in a later date and easily make updates, but they can also serve as notes for
    other developers who may be working in the same codebase as you. It''s always
    said that commenting is a sign of a good developer, so comment away! Be sure to
    make your comments meaningful and detailed but still brief; it can serve as the
    front-line type of documentation for your site or application.'
