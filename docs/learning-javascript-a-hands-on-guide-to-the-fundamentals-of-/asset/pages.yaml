  md: "# Chapter 8 Communicating with the Server Through Ajax\n\nCurrently, it will\
    \ only output the returned data into the JavaScript console, but we want to be\
    \ able to return and use that data in various ways.\n\n# Returning the Data\n\n\
    Right now the data is stuck inside the onreadychange event handler. This obviously\
    \ isn't what we want. If we were using this function only once, we could add all\
    \ the data parsing and output right inside the event handler. You could build\
    \ all your functionality right inside a ajaxCall() function. That would be perfectly\
    \ fine—a little difficult to integrate into our current codebase, but there's\
    \ nothing wrong with it.\n\nLucky for you, we're not going to settle for \"just\
    \ fine.\" We can make this function a lot reusable by finding a way to work with\
    \ the data it's returning while still remaining inside the context of the onreadychange\
    \ event handler. To accomplish this goal, we need to find a way to call the ajaxCall()\
    \ function and allow it to take an extra argument that is a goal. This does get\
    \ a little tricky, a function that calls another function isn't a foreign concept\
    \ at this point. Remember? A function that calls another function is called a\
    \ callback function. With that mind, what we need to do is allow the ajaxCall()\
    \ function to execute a callback function.\n\nThe first step to do is to save\
    \ the response to a variable so we can work with it easily. Listing 8.5.1 introduces\
    \ a new argument callback, which will represent the function we will be passing\
    \ through to access the data response. So we will have two arguments; one will\
    \ be a string, and the other will a function.\n\nBecause the data is saved to\
    \ a variable (contacts), it is easy to pass that data into the callback function.\n\
    \n# Listing 8.5.1 Accepting a Callback Function\n\n```\nfunction ajaxCall(dataURL,\
    \ callback) {\n\n  /* use our to get the correct Ajax object based on support\
    \ */\nvar request = getHTTObject();\n\n  request.onreadystate = function() {\n\
    \n    // check to see if the Ajax call went through\n    if ( request.readyState\
    \ === 4 && request.status === 200 ) {\n\n      // save the response to a variable\n\
    \      var contacts = JSON.parse(request.response);\n\n      // make sure the\
    \ callback is indeed a function before executing it\n      if(typeof callback\
    \ === \"function\") {\n\n        callback(contacts);\n      }\n    }\n  }\n}\n\
    ```"
