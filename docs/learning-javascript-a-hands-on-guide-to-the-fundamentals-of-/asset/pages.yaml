  md: '# Pushing Data into an Array


    Now that you know all the different types of arrays and how to pull data from
    them, the next logical step is to start dynamically adding content into an array
    (you don''t always have to do it by hand—that would be awful). There will often
    be times when you need to add new information to an array, either generating the
    information yourself or gathering it through user input—they''re both quite common.


    Listing 5.11 expands on the breakfast array from Listing 5.10. In this example
    we want to do a few things:


    +   - Jalapeño Bagel & Ham to the breakfast array.

    - Alert the entire array to confirm that it was added properly at the end.

    - Directly access the newly added array item (Jalapeño Bagel & Ham) and alert
    it.


    Listing 5.11 Adding Items to an Array


    ```

    /* declare breakfast normally */

    var breakfast = {"Egg, Sausage and Cheese", "Egg Whites on Flatbread", "Egg

    —Cheese"};


    /* add a Jalapeño bagel and ham to the breakfast array */

    breakfast.push("Jalapeño Bagel & Ham");


    /* alert the whole array */

    alert(breakfast);


    /* pull out the newest array member */

    alert(breakfast[3]);

    ```


    # Working with Array Methods


    Accessing and removing items from an array are all the basic interactions you
    will encounter, but because this type of data storage is so critical, JavaScript
    opens up a whole slew of methods dedicated to the purpose of interacting with
    arrays. Knowing that a certain method exists has the battle to solving a problem,
    I''ve handpicked some methods of array interaction that I personally encounter
    often in my day-to-day development. Someone helped me at some point to discover
    these terms, and now I''m going to help you. Hopefully, this will save you hours
    of frustration when an array doesn''t seem to work the way you want it to.


    The methods we''ll be going over are


    +   - join

    - slice

    - shift and unshift

    - pop

    - concat

    - sort'
