  md: '# Performance Considerations


    As mentioned in an earlier chapter, JavaScript, by nature, is blocking. That means
    it will stop the download of other objects on the page until it is finished with
    its business. This can be very evident when dealing with loops. The data we''re
    dealing with is only five items in length, there isn''t a problem executing this
    code of 5 items. However, as the number of elements you''re looping through increases,
    so will the time it takes to iterate over them. This is important to note when
    you''re looping through a lot of items because it can really bog down the loading
    time of a page.


    Any variable that doesn''t change and can be defined outside the loop. You''ll
    notice in our loop that there is a variable called count; it is defined outside
    the loop and then referenced within. We can do this because the length of the
    data never changes while the information is being looped. If it were inside the
    loop, the length would have to be recalculated each time the loop ran, which can
    get very resource intensive. Little things that can help you conserve resources
    when you''re working with loops.


    # Conditionals


    Conditionals are how you let your program make decisions for you. Decisions can
    be based on the data presented (decisions you make) or based on user input, like
    one of those choose-your-adventure books. It''s a way to inject some logic into
    your JavaScript.


    Conditionals can be used for everything from outputting different information
    into the DOM to loading a completely different JavaScript file. They''re very
    powerful things to have in your JavaScript toolkit.


    # if Statement


    By far, the most common type of conditional is the if statement. An if statement
    checks a certain condition, and if true, executes a block of code. The if statement
    is contained within two curly brackets { }, just like the loops we were talking
    about early and the functions before that.


    This is best described through a coding sample let''s move right to it. In Listing
    6.5.3 you can see a if statement that is being applied inside the loop of our
    JSON object in Listing 6.5.2. Inside the loop, if the person''s name is "hillisha"
    the name and mailto link with an exclamation point at the end will be outputting
    into the document. This output should only be Hillisha''s mailto link without
    any other names.'
