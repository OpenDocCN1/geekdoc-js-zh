    # Summary


    In this chapter, we took a short step back to review some of the higher-level
    topics we went over through the course of this book in hopes of jogging your memory
    and connecting the dots from chapter to chapter, exposing the path you took to
    get to this point. We went over progressive enhancement, manipulating the DOM,
    all the ways you learned to store data in JavaScript, and server communication
    models like Ajax and Workers.


    This chapter also broken down into two major components: JavaScript for designers
    and JavaScript for developers to illustrate the two very different paths you can
    take, however you choose to continue learning the language.


    The designer path discussed a future of advanced interface design and creating
    rich applications that not only function cross-device but also touch and enhance
    features of each unique ways. We talked about how to capture touch and mouse events
    to create a single interface that can work without having to refactor feature-specific
    code. We also got into applying dynamic styles with CSS transforms in JavaScript
    and how to make an object respond to touch interactions.


    From there, JavaScript for designers broke out of the browser and onto the desktop
    by a drag-and-drop interface with a combination of new APIs available in JavaScript.


    The developers learned about creating document structure with JavaScript templates.
    We went over a new method of creating and laying out dynamic content with a templating
    system called Mustache. We learned about the pulses and minuses of this type of
    system and how it relates back to progressive enhancement.


    Finally, the designers, the developers broke out of the browser, but in a very
    different way. We introduced a new JavaScript platform for running the language
    outside the context of the browser on its own server. We talked about NodeJS and
    went through a simple implementation example of creating and running a server
    that is based off of NodeJS and written in JavaScript.'
