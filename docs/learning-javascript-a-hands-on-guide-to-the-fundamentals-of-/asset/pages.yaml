- img_proc: true
  md: "these cutting-edge techniques, specific browser support information stops being\
    \ useful. You're fully aware that what you're using isn't going to work in all\
    \ browsers.\n\nKnowing that a feature isn't going to work in all browsers or devices\
    \ allows you to set up something-called feature detection. We have been mentioning\
    \ (and using) this method throughout the book. It's always important, but especially\
    \ important when using some of the newer additions to HTML and JavaScript.\n\n\
    Feature detection is a front-end methodology where you check for the presence\
    \ of an object before executing a block of code depending on it. When you boil\
    \ it down to its core, feature detection accomplishes two things:\n\n+   - Creates\
    \ fallbacks when something isn't supported\n- Prevents blocks of unsupported code\
    \ from being executed\n\nIf an object isn't supported, it will return as undefined,\
    \ so you can set up your conditional statement based on that assumption.\n\nListing\
    \ 11.10 depicts the familiar example of feature detection we used when detecting\
    \ for geolocation support earlier in this chapter.\n\n# Listing 11.10 An Example\
    \ of Feature Detection in Location\n\n```\nif(navigator.geolocation) {\n  // you\
    \ have geolocation\n} else {\n  // the navigator.geolocation object came back\
    \ as undefined, you don't have features\n}\n```\n\nThis model of feature detection\
    \ can be applied to anything in JavaScript, and many things in HTML. If you're\
    \ like me and always want to use the latest and greatest APIs available, this\
    \ will be the way to do that. Because we are always striving to create a rich\
    \ experience for all our users, detecting for feature support is a necessary exercise\
    \ to achieve consistency and relevancy across multiple Web environments.\n\n#\
    \ Summary\n\nIn this chapter, we lifted up the hood of some of the HTML5 JavaScript\
    \ APIs that have begun to explode on the Web development community past couple\
    \ years. We started by going over the general purpose of the HTML5 specification,\
    \ how it was very focused on the developers, and how the language was already\
    \ being used. We discussed the new structural elements in HTML5 create a cleaner\
    \ semantic markup structure and open up a new world of accessibility options with\
    \ the influx of the WAI ARIA specification."
