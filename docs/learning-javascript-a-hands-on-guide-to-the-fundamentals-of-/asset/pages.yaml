  md: '# postMessage()


    The postMessage() method is, to use a baseball term, the pitcher. postMessage()
    takes a single argument, which represents the data or information you want to
    send to the other file. Because data can travel from the main file to the worker
    back to the main file postMessage(), it is used on both sides. Using postMessage()
    will pass whatever information is available to the receiving file and trigger
    the onmessage event.


    # message event


    The message event is triggered after the postMessage() method is called. The receiving
    file will wait for the message event to trigger an action. Listening for the message
    event is the same process as waiting for any other event, like a click to be triggered.
    The only difference is that instead of a user triggering the event, you will be
    triggering it programmatically when you are ready to send and process data.


    This event combined with the postMessage() will allow you to offload some of the
    server communication to the Worker while your main file continues on its normal
    communication model. To depict how a Worker can run in parallel with another script
    that is constantly executing, we set up the HTML in Listing 11.6. There is a button
    to start the worker that we will bind an event to, a couple div elements for catching
    the output, and another button to terminate the worker.


    # Listing 11.6 HTML Document to Display Web Worker Functionality


    ```

    <!doctype html>

    <html lang="en">

    <head>

    <title>Chapter 11 - Web Workers</title>

    <meta charset="utf-8">

    </head>

    <body>

    <button type="button" id="start">start worker</button>

    <button type="button" id="stop">stop worker</button>

    <div id="timer"></div><!--#timer-->

    <div id="output"></div><!--#output-->


    <!---js-->

    <script src="js/html5.js"></script>

    </body>

    </html>

    ```'
