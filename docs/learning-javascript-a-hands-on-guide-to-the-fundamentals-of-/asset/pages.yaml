    # Events


    Events are how you elicit feedback from the user. If you want to execute any JavaScript
    on a page, it must happen through an event of some kind. Loading of the page,
    clicking a link, and submitting a form are all considered events, and you can
    attach functions to them all. There are a lot of events you can attach functions
    to in JavaScript, including


    +   * click

    * dblclick

    * mousedown

    * mousemove

    * mouseout

    * mouseover

    * mouse

    * keydown

    * keypress

    * key

    * blur

    * focus

    * submit

    * load

    * touchstart

    * touchmove

    * touchcancel

    * orientationchange

    * gesturestart

    * gestureend

    * gesturechange


    * New event specialized for touch interactions.


    Listing 3.9 shows how you would execute the getFamilyMemberNames function upon
    loading of a page and then upon clicking anywhere in the document.


    # Listing 3.9 Load and Click Events to Execute the getFamilyMemberNames Function


    ```

    /* execute the function on load of the window*/

    window.addEventListener("load", getFamilyMemberNames, false);


    /* execute the function on clicking the document */

    document.addEventListener("click", getFamilyMemberNames, false);

    ```


