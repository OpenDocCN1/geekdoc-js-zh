  md: "# Advanced Interface Design\n\nFor many years, interface design has been pigeonholed\
    \ into a pretty standard environment in the form of a desktop (laptop). To a large\
    \ extent, this is still the case. You will still be designing interfaces that\
    \ are interacted with a keyboard and mouse, but they will also have to be flexible\
    \ enough to work within other contexts, such as a touch interface.\n\nWith interface\
    \ design it is important to focus on the features of a given environment. For\
    \ instance, screen size is a feature. With screen size you can use CSS media queries\
    \ to modify the design of an application to fit the environment, because the design\
    \ lives in the presentation layer, which is why we deal with it using JavaScript.\
    \ Using the JavaScript method of adding and removing classes also allows you to\
    \ easily modify how a class behaves based on screen size. This is a side effect\
    \ of building your interface in a way that interfaces CSS and JavaScript combined\
    \ with the event-driven model wherever you get built into JavaScript.\n\nTouch\
    \ capabilities is another device feature. This feature will affect your JavaScript\
    \ directly because it is a behavior and is dealt with the behavior layer. When\
    \ building a touch interface, there are a lot of events you may want to be inherited\
    \ from the nontouch interface to the touch version. Because it is important to\
    \ create a consistent user experience across multiple devices so your users don't\
    \ get confused, you can either build a function library to be used for both touch\
    \ and nontouch (mouse events) alike, or you can map touch events to mouse events.\
    \ A lot of events in a touch interface simply will not map directly to a mouse\
    \ event, like a pinchzoom. But a lot of events, like mousedown and touchstart,\
    \ can be directly related to each other in a logical way.\n\nList 12.4 shows how\
    \ you set up two event listeners attached to the document, one event for mousemove\
    \ and another for touchmove. This model works if you want to do two separate things\
    \ for the similar actions, or if you plan to use them independently.\n\n+   12.4\
    \ Using Mouse and Click Events\n\n```\n// set up mousemove event\ndocument.addEventListener(\"\
    mousemove\", function(e) {\n\n  alert('got it!');\n\n}, false);\n\n// set up touchmove\
    \ event\ndocument.addEventListener(\"touchmove\", function(e) {\n\n  alert('got\
    \ it!');\n\n}, false);\n```"
