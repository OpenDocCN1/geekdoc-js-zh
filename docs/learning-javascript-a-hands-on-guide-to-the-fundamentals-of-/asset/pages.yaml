  md: '# Modifying HTML


    With JavaScript, you will be doing a lot of adding, inserting, and removing HTML.
    This can take the form of physically adding a block of markup into a document
    with JavaScript, changing-style properties, or adding or removing attributes.
    Everything in the document is up for grabs.


    It''s very important to not only know that you can change HTML at will with JavaScript,
    but also to identify when you should and—more importantly—when you shouldn''t.
    Again, if you follow the principles of progressive enhancement, you will be able
    to catch yourself doing something that feels a little off. And when that happens
    you can always go back to correct something before it becomes a real problem.


    Make no mistake, modifying HTML in various ways is a huge deal in JavaScript.
    You will be doing it a bit while you''re striving to create that perfect user
    experience. Don''t worry—you''ll be learning the right way to do it, and even
    better, when to do it.


    # Communicating with the Server


    Generally speaking, when you hear people talk about JavaScript communicating with
    the server, they''re talking about Ajax. It''s not always Ajax, but it is. JavaScript
    can communicate with the server in a lot of different ways. The purpose is to
    improve user experience. By using JavaScript to talk to the server, you can save
    yourself and the user time and energy.


    Saving time and energy is your number one concern, and creating an environment
    that offers less hanging around and more real-time (not quite real-time but close)
    interaction can be a breeze when you sprinkle a JavaScript communication layer
    into your application. The ability to refresh parts of a page on-fly grows more
    with every passing year. Creating truly responsive, user-centered applications
    is a desire of every designer. It can be easily accomplished with the proper fallbacks
    and JavaScript.


    Saving yourself headlines is a nice bonus of building for the user. How do JavaScript,
    Ajax, and client-side server communications benefit you? Being able to refresh
    parts of a page a-wise without forcing a user to do a full-page refresh to request
    new data. Using less bandwidth is always better for everybody. Of course you still
    need to have everything work without JavaScript, the small portion of the population
    that is affected still need a page refresh, but the data and content will be available.
    Using JavaScript to communicate with the server can often be more efficient than
    not, and with the proper fallbacks in place, there is little reason to not go
    this route. We''ll get into this in a lot more depth later on in the book.


    # Storing Data


    Another important function of JavaScript is data storage. When I mention data
    storage you might be thinking about databases, and you''re not too far off. Data
    storage in JavaScript is very similar to data storage in most server-side technologies.
    The formats are similar, and the caching is subject to the same rules. The main
    difference is accessing server-side stored'
