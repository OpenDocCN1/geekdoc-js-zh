    to be familiar to succeed. As you go through this book we will be expanding upon
    each of these topics in a lot more detail. We will be going over in-depth examples,
    real-life scenarios, and learning about situational JavaScript (when to use what
    thing).


    We covered everything from the basics, such as the DOM, variables, and strings,
    to definitions of the various types of data storage options in JavaScript (there
    are a lot more, but that''s for a later chapter), and we even delved into the
    more advanced topics like conditionals, loops, and functions.


    If you found this chapter a little overwhelming, don''t worry; we''ll be breaking
