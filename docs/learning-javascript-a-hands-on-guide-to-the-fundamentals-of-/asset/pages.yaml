    remove complications from the process and guide your focus back to areas of a
    project that are much more high impact.


    This is a great use of libraries, getting out of the way and letting you more
    effectively accomplish the goals for the project, which will help create a better
    outcome in the same amount of time.


    # Creating Shortcuts


    Creating shortcuts to code is, at its core, what libraries do. It is important
    to remember this because of the shortcuts, although extremely helpful, can actually
    hurt in the long run. There''s no question that libraries make coding easier.
    If they made it difficult, I guarantee that no one would use them ever, but this
    book would be a chapter shorter. It is not always better, but it is easier, and
    that''s why learning JavaScript before learning a JavaScript library is so important.
    I realize that seems like a "no kidding" kind of statement, but you would be surprised
    by the amount of people who learn a particular library before getting into the
    native language.


    Knowing JavaScript and how a library creates its shortcuts to "easier" functions
    and methods will help you selectively utilize a library without flooding your
    application with unnecessary coding shortcuts.


    This brings up the interesting debate over why you would even use a library that
    creates shortcuts in the code. As I mentioned, all libraries have their ups and
    downs. You''re not always going to utilize all the methods available to you in
    a given library. The benefit lies in that you can choose what you want to use
    on a project from the library, use the same library on another project, and choose
    a completely different set of features to utilize. It''s a way to keep your coding
    sanity.


    I still remember the day I was using a popular JavaScript library and realized
    that every method I was using was just a shortcut to another method that is native
    to JavaScript. The difference was that someone with a vastly better understanding
    of JavaScript architecture wrote it. After I began writing much more efficient
    code, sprinkling the library shortcuts where they were applicable, more started
    to realize where I didn''t need the help of a library and where the code I was
    writing could be more efficient than that written in the library.


    I cannot stress this fact enough—when coding with whichever library you choose,
    be keep telling yourself that it is all JavaScript. Even if it looks a little
    different from what you are used to, you can still use the code you feel will
    be the best for an individual situation. Just because you''re using a library
    doesn''t mean it is the best solution for 100% of the code you write. In this
    chapter we will go over some specific library examples and how they map back to
    what you''ve already learned in previous chapters. We will also discuss when library
    code is less or more efficient/extensible than what you might be writing for yourself.'
