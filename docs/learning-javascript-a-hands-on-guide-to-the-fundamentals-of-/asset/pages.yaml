  md: 'for the job. You will never be able to make a blanket statement to solve everything,
    otherwise, you might find yourself using a railroad spike to hang a photo on the
    wall, where a thumb-ack would have been a better choice—or, for a more direct
    example, using a heavily nested JavaScript method instead of an anonymous function.
    These are all script patterns in JavaScript that will help your code make a lot
    more sense, not only for you, but for anyone who gets it in there.


    The style aspect is a lot lighter than the script aspect of code organization.
    JavaScript style encompasses topics such as


    +   - Comments

    - Whitespace

    - Line breaks

    - Indentation

    - Spacing


    This is all part of JavaScript code design. With this, we get into aspects of
    team coding and generating a style guide/understanding. You learn how to use commenting
    to your advantage, and how it can help your overall coding effectiveness. In an
    ideal world you will be the only person working in your JavaScript file, but in
    reality there are lot of reasons for someone to be in a file you created. For
    this reason it is important to follow some formal style guide so the pain of looking
    through someone else''s code be kept to a minimum. We talk about loose guidelines
    for coding standards and why it is as important in some areas to not have coding
    standards. Making sure the standards you implement are guidelines (and not laws
    to blindly follow) will help foster creativity and innovation within any development
    environment.


    The code organization balancing act is something we have talked about for the
    entire book. It''s something that will need to be addressed individually (at some
    level) as a part of every project. Laying out some general rules, pitfalls, tips,
    and information will help you along the way.


    # General Coding Style Rules


