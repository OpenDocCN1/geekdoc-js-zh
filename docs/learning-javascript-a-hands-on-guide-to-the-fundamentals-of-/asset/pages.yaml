    \ This is what you will be testing against, reflected in the switch statement.\
    \ As you can see, we are running a switch that checks for the event type, and\
    \ if one returns true, we are then resetting the event type object to whatever\
    \ mouse we choose to map to it. From there, we continue to initialize and set\
    \ up the phantom event that is now mapped from a touch event to a mouse event.\n\
    \n# Creating and Executing Phantom Events\n\nIn Listing 12.4.1 you may have noticed\
    \ two methods that we haven't used before createEvent() and initMouseEvent().\
    \ These are the two methods that are used to trigger the events that have been\
    \ mapped in the switch statement. There are three major steps in making a phantom\
    \ event:\n\n+   - Create an instance of an event type.\n- Initialize the actual\
    \ event and give it properties.\n- Trigger the event.\n\n# the createEvent() Method\n\
    \ncreateEvent() is the method used to create an event of any type. It takes a\
    \ single argument, which is the event type. Normally you would think the event\
    \ type is something like click, blur, focus, keyup, or something like that, but\
    \ because we are creating the event program-matically, you will need to take one\
    \ step back from there. The options for event types that can be created from the\
    \ createEvent() method are\n\n+   - UIEvents\n- MouseEvents"
