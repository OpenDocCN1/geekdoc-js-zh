- img_proc: true
  md: '# Benefits of Progressive Enhancement 17


    expect. Using progressive enhancement will certainly improve workflow. In Figure
    1.2 you can see a clean and meaningful directory structure.


    ![](img/1fc495d5f409712b6e281b5d531f60c4_38_0.png)


    Figure 1.2 A beautiful and organized file structure


    Some of the more obvious benefits in using this method are performance and scalability.
    Let''s talk about those a little bit before you move on to some more intense JavaScript.


    # Performance


    By externally linking your CSS and JavaScript files, you are allowing the browser
    to cache them in memory for each user. What does this mean? When someone accesses
    your home page, many of the assets saved so the user doesn''t have to download
    them. This betters the performance of your site from a user perspective. If all
    the JavaScript for the entire site get downloaded at the first visit to a site
    or application, as the user navigates around, there is no need to download that
    asset again, hence speeding up the load time for the site and minimizing HTTP
    requests. The same rules apply for CSS. All the user needs to download all the
    assets are cached in the new, clean HTML you build for the internal pages. Because
    no inline CSS or JavaScript is there, it is extremely fast to download.


    # Building for the Future


    There are two types of scaling in progressive enhancement:


    +   - Adding features

    - Scaling to grow for the future (we''re talking about mobile here)


    Adding features to a website or changing the design of a site that has already
    been built with progressive enhancement can be as easy as cracking open the appropriate
    layer, making your enhancements and getting out of it. It also helps on a team
    where one person can work on the JavaScript while another is playing with the
    CSS and design. Team members can work independently and ensure that all the work
    fits together in the end.


    Scaling a small screen interface to grow for the future is a little further out
    there in terms of concepts related to progressive enhancement, but stay with me.
    Listing 1.1.9 contains a CSS media query, and it goes at the bottom of your CSS
    file.'
  merge: -1
  pgno: 38
- img_proc: true
  md: "# Listing 1.1.9 Using a Media Query in CSS\n\n```\n@media only screen and (max-width:480px)\
    \ {\n  /* do something to the design for small screens */\n}\n```\n\nThe goal\
    \ of a media query is to detect the screen or window size of the device the user\
    \ is using to view your site or application. In the preceding example, you are\
    \ detecting for a maximum screen size of 480px; then inside the brackets, you\
    \ adjust the design (in the presentation layer) to better fit the smaller screen\
    \ size. The best part is it is device-independent, so you can activate these media\
    \ queries by resizing your browser window to 480px.\n\nUnless you have to make\
    \ serious structural changes to your document for a mobile version of your site,\
    \ you can use these media queries to reflow the layout or make small tweaks to\
    \ the design to optimize it on a smaller screen device. This lets you maintain\
    \ the progressive enhancement layer stack by applying all changes in the presentation.\n\
    \nUsing a media query is very fast and lightweight to target a user on a smaller\
    \ screen. These are great because they not only apply to mobile devices, but also\
    \ to any device with a smaller screen, such as a notebook. They help a great deal\
    \ in preventing horizontal scrolling, not to mention the user possibly feeling\
    \ cramped using a smaller browser window, while still presenting a usable design.\n\
    \n> Note If you loaded the example to this point out on a phone, you would notice\
    \ that your media query isn't working. The Web page probably looks all zoomed\
    \ out, and this obviously isn't what we're looking for. There is an HTML meta\
    \ element that you need to add to the <head> of your document to make this initial\
    \ zoom happens and media queries work as expected. That element looks like:\n\
