  md: '# open()


    The open() method is the second step in getting your Ajax call started. Think
    of it like a configuration file for the Ajax call. It doesn''t do any actual work,
    but what it does prepare the statement to be executed by gathering all the necessary
    information. It''s like having an administrative assistant for your Ajax call.


    Listing 8.3 shows the Ajax object function we created being saved to a variable
    called request and then the open() method being attached to it, taking three arguments.


    # Listing 8.3 Prepping the Ajax Call


    ```

    var request = getHTTPObject();


    /* Get all the information ready to go */


    request.open("GET", "data/contacts.json", true);

    ```


    The three arguments in the open() method of Listing 8.3


    +   - The method

    - The file or URL to get

    - A Boolean flag for asynchronous script


    There are also two other optional arguments:


    +   - Username

    - Password


    # Method


    The first argument in the open() method is the method you want to use for your
    Ajax call. This can be set to GET or POST.


    # File or URL


    The file or URL argument is a place for the file path or full HTTP URL of the
    data source you will be pulling in via the Ajax call. If it''s a local file, like
    ours, the path is relative to the HTML document you''re using it in, not the JavaScript
    file. This is why ours is set to data/contacts.json and not ./data/contacts.json.


    # Asynchronous or Synchronous


    The third argument in the open () method is a flag to tell the Ajax call whether
    it will be executed as a synchronous call or an asynchronous call. As mentioned
    earlier, this will be set to true almost all the time, because asynchronous Ajax
    calls usually provide a much better experience when compared to synchronous calls.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Sending Credentials


    The last two arguments in the open() method are reserved for a username and a
    password. We would use these arguments when implementing an Ajax call on a sign-in
    or registration form (for example). Whenever you send password information with
    this method, it is important to make sure the data is encrypted for better security.
    Even though you would use a POST method and the URL wouldn''t be exposed publicly,
    encryption is equally important as it is when coding on the server.


    # send()


    After all the data for your Ajax call has been properly prepared in the open()
    method, you can use the send() method to ship off the data and wait waiting for
    the readyState property to let you know when the Ajax call is ready to be used.


    In Listing 8.3.1 you see the Ajax call getting built out. We now have the Ajax
    object, the open() method gathering the data, and finally the send() method firing
    off the actual call.


    # Listing 8.3.1 Sending the Actual Data


    ```

    var request = getHTTPObject();


    /* Get all the information ready to go */

    request.open("GET", "data/contacts.json", true);


    /* initiate actual call */

    request.send(null);


    /* OR - initiate the call with some data */

    request.send("hello data");

    ```


    You may have noticed that we''re pushing null data into the send object, which
    means we''re not sending any extra data with the Ajax call. We just want the file.


    If you were using back-end processing on the data URL, you can pass the extra
    filtering information through the send() method. Listing 8.3.2 shows something
    like that that may look for a search result.


    # Listing 8.3.2 Sending Extra Data for Server-Side Filtering


    ```

    var request = getHTTPObject();


    /* Get all the information ready to go */

    request.open("GET", "search.php", true);


    /* initiate actual call and filter by the term "hill" */

    request.send("searchterm=hill");

    ```'
