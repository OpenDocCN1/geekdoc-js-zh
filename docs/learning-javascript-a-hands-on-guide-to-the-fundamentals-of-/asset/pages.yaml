  md: '# JavaScript Library Basics


    jQuery is a library in the true sense of the word. It''s a collection of predefined
    functions and methods loaded into your documents through an external script for
    you to access and use as you see fit. jQuery is a very large library and as I
    mentioned previously in this chapter, you probably not going to use the entire
    thing (nor you should). What jQuery does best is make things easy. That feels
    redundant because the goal of any library is to make things easy, but jQuery does
    an exceptionally good job of it.


    Due to its ease with JavaScript, jQuery has lowered the barrier of entry for a
    designer to start coding with JavaScript. The jQuery team has done a great job
    in lifting the veil off JavaScript and making the language accessible to anyone
    who needs to code with. For better or worse, it isn''t uncommon for a designer
    to list jQuery as a skill set and omit JavaScript. jQuery is so popular that many
    people fail to see it as actual jQuery. But, don''t forget it''s still JavaScript.


    The jQuery library contains almost everything you would need to build everything
    from a small marketing to a robust Web application, and the browser support for
    features in the library goes all the way to Internet Explorer. There are countless
    books, articles and blog posts written about every aspect of jquery, including
    full API documentation on jquery.com. Because it is the most popular library available
    now, the community and support surrounding jQuery is unmatched by any other.


    The jQuery library can be downloaded from jquery.com. You can get a production
    version of the library, which has been minified and compressed (no whitespace),
    or a development version, which jQuery can be a great learning resource; it is
    well commented and built by some of the best jQuery minds in the industry. For
    our purposes, we won''t be tearing apart any jQuery core functionality, as you
    might well learn from the best, right? So the production version is probably the
    best. Figure 10.1 shows you how to download the library from jquery.com.


    ![](img/1fc495d5f409712b6e281b5d531f60c4_240_0.png)


    Figure 10.1 Downloading a production version of jQuery from jquery.com'
