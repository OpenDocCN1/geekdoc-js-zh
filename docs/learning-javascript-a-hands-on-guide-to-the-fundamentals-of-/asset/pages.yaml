  md: '# Using Microlibraries


    Each time a major library, toolkit, or framework releases a new version rich with
    features, there is always an inevitable side-effect of the library growing to
    a larger size. This leads to developers and designers constantly questioning whether
    the load and overall weight of a library is worth the benefit of using a full-featured
    library. With the constant need to keep a watchful eye on performance, you can''t
    blame someone for searching for a smaller but more targeted solution to his or
    her front-end development problems.


    In real-life development scenarios, you will probably need only a handful of features
    from whatever library you choose. You might like using jQuery''s select engine
    or what handles complex functions like animation, or you want to take advantage
    of the advanced Ajax support for various data formats. Whether it is, there will
    be a lot of helpful shortcuts in the library, but you would be naive to think
    that any library will solve all your problems. There will be requirements that
    are not met and cannot be solved with a prebuilt plug-in that you have to build
    for each project. That''s the nature of it. At times you may ask yourself if loading
    in a large library is the right tool for the job. If you can accomplish your goals
    with less code, by you must, do that.


    If you come to point where you''re questioning your old standby library because
    of its size relative to how much you''re utilizing on a project, you may want
    to look into using a microlibrary. Using a microlibrary will help you directly
    assemble the pieces you need to complete a project, making sure that there is
    no code to be wasted. This modular format is very attractive to a lot of developers
    and designers because there is little waste, and performance can be finely tuned.


    With all that in mind, let''s take a look at some of the ups and downs (good and
    bad) in microlibraries.


    # The Good


    If you were to take a library like jQuery and pull it apart into all its different
    functions, it would form a bunch of microlibraries. There would be one for DOM
    parsing, one for Ajax functionality, one for animations, and so on that fashion
    the entire library was broken up into pieces. It is similar to dinner being a
    project, and if you went grocery shopping every day, you would get only what you
    need to make dinner and nothing more. It makes one project very targeted and efficient.


    Many microlibraries are highly focused on solving a specific problem. Because
    of this, code is wasted and not used. This is the opposite of using a catchall
    library where there will be a lot of code you don''t use. Less waste means less
    code processing, which means better performance and a cleaner experience for your
    users.


    Many think that using a module architecture in JavaScript is the wave of the future
    because of the way it cuts down the amount of code you need to solve a problem.
    This very well may be the case if the individual libraries integrate well with
    other microlibraries.'
