  md: "# Chapter 9 Code Organization\n\nOther than the contents of each name, you\
    \ should consider some further constraints when naming. First and foremost, the\
    \ name should make sense, and describe the actual content or action associated\
    \ with a label. Second, the name should always start with a lowercase letter,\
    \ never a number, and especially not an underscore.\n\nUsing an underscore in\
    \ other programming languages typically represents a private value. Because this\
    \ concept doesn't exist in JavaScript, prefixing a variable or function name with\
    \ an underscore can be confusing; for this reason it is best to stick to lowercase\
    \ alpha-characters when starting a variable or function name.\n\nListing 9.5 shows\
    \ two different variable declarations. The first, _partyStarter, is a correct\
    \ model by starting with a lowercase letter and following the camelCase syntax\
    \ pattern. The second variable, _partyanimal, is an epic failure of variable declaration.\
    \ Although it will work, starting with an underscore is confusing and inconsistent\
    \ with other languages. If you're a programmer who has had to switch between languages\
    \ in the same day, you know how frustrating it can be when coding styles collide.\
    \ This variable is also using an exclamation-point, which is bad practice in this\
    \ area.\n\n# Listing 9.5 Variable Naming Conventions\n\n```\nfunction () {\n\n\
    \  \"use strict\";\n\n  /* good variable name */\n  var partyStarter = \"Starlen\"\
    ;\n\n  /* bad variable name */\n  var _partyAnimal = \"The Ian\";\n\n});\n```\n\
    \n# Comments\n\nYou can tell how good a coder someone is by the detail level of\
    \ his her comments. It's not the length so much, but the quality. Commenting your\
    \ code is the first line of documentation. Sometimes it's for you and sometimes\
    \ it's for others. But either way, using helpful and descriptive comments can\
    \ cut down on ramp time when jumping into a file (or jumping back into a file).\n\
    \nMake sure to be generous with your comments; they are your chance to explain\
    \ yourself and why you did a certain thing in code. Was there a weird bug you\
    \ needed to patch up? Are you setting up a declaration as a special application\
    \ API hook? Maybe, but no one will know if you don't write it down."
  merge: -1
