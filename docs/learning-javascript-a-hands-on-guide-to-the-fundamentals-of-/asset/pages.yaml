  md: "# touchmove\n\nThe touchmove event is triggered when the user moves their finger\
    \ on the screen. It is always preceded by the touchstart event. Naturally, you\
    \ have to touch the screen before you can move your finger. This is often used\
    \ to create swipe gestures or move objects around the screen.\n\nIn Listing 7.5.2\
    \ we're creating a method inside the touchControls object that will output the\
    \ text \"moving!\" into the body while the touchmove event is being triggered.\
    \ The event will trigger repeatedly until the movement stops. You can see this\
    \ by moving your finger around the screen and observing the output (it should\
    \ say \"moving!\" a bunch of times).\n\n7.5.2 Using a touchmove Event\n/* Anonymous\
    \ function wrapper again! ***\n\n```\nfunction(){\n  // the same body variable,\
    \ no need to redeclare it.\n  var body = document.getElementsByTagName(\"body\"\
    )[0];\n\n  // declare an object to hold touch controls\n  var touchControls =\
    \ {\n\n    /* previously defined methods here */\n    showMovement : function(){\n\
    \      // output a message to the body\n      body.innerHTML += \"moving! <br>\"\
    ;\n    }\n\n    } // end method\n  } // end object\n\n  // add event listeners\
    \ to the body\n  body.addEventListener(\"touchmove\", touchControls.showMovement,\
    \ false);\n}();\n```\n\norientationchange\norientationchange is the only event\
    \ related to touch that really isn't a touch event. As I mentioned earlier, this\
    \ is the event that relies on the presence of an accelerometer in a device. An\
    \ accelerometer is what allows the screen on your phone or tablet to rotate when\
    \ you rotate the device. It also allows high-end gaming because it can return\
    \ how many degrees the user is turning a device in one direction or another."
