  md: "# Listing 9.8 Proper Statement Spacing\n\n```\nif (peopleCount > 0 && pizzaCount\
    \ > 0) {\n    body.innerHTML += \"<p>Dear \" + partyStarter + \", Each person\
    \ can have \"\n+pizzaParty(sliceCount, peopleCount) + \" pieces of pizza</p>\"\
    ; // semicolon at\nthe end of the statement\n} else {\n    body.innerHTML += \"\
    <p>You need to invite people or order pizza</p>\";\n    //semicolon at the end\
    \ of the statement\n} // end if statement\n```\n\nAs a general rule, parentheses\
    \ should have a space before and after a space. This principle can be applied\
    \ to any conditional statement, functions, and any type of JavaScript loop. You'll\
    \ notice in Listing 9.8 that the contents of if statement are wrapped in parentheses\
    \ and illustrate this pattern.\n\nThe else portion of the statement follows a\
    \ similar pattern. Spaces should also be inserted to surround else and else if\
    \ statements, as depicted in Listing 9.8.\n\n# Line Breaks\n\nLines in JavaScript\
    \ can be broken at almost any point as long as the break doesn't come in the middle\
    \ of a word. This can make breaking lines in your document feel a little weird\
    \ and slightly ad hoc. Luckily, some conventions exist in the coding world that\
    \ we can turn to for things like this.\n\nThere's a principle in Java (yes, that's\
    \ Java, not JavaScript) that says lines of code should not exceed 80 characters.\
    \ Some Java-targeted text editors will provide a vertical line on the screen where\
    \ your lines should break. With JavaScript, this is generally a good rule to follow,\
    \ but more around 60 to 80 characters is the point where text (any text) becomes\
    \ harder to read and consume. No one expects you to insert a hard break at 80\
    \ characters in your JavaScript code, but it's something to be aware of.\n\nAnother\
    \ option for breaking a line of code is to do it at an operator. We have been\
    \ breaking all our variables at an operator so for comma. The comma creates a\
    \ natural breakpoint in JavaScript. Other operators +, -, or = are also natural\
    \ breakpoints. If you feel your lines of code are getting too long, don't be afraid\
    \ to go back and insert a few breaks where you use an operator. It can help improve\
    \ readability by great deal.\n\nListing 9.9 shows the variable block we have been\
    \ using, reinforcing the line breaks after each comma."
