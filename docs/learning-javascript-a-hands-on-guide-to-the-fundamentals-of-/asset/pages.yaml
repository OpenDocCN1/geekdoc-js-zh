    \ be doing on every project, and it's very easy to do using the function keyword\
    \ (remember the reserved words list? This is what function is for).\n\nUsing the\
    \ function keyword is like saying, \"Hey, I'm building something over here that\
    \ should be treated as a function.\" Listing 6.2 shows a basic function declaration.\n\
    \n# Listing 6.2 Writing a Basic Function\n\n```\nfunction sayHello() {\n\n  alert(\"\
    hey there!\");\n\n}\n```\n\n# Calling a Function\n\nCalling a function is very\
    \ simple. You type out the name, and then parentheses and the function will be\
