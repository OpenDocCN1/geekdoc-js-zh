  md: "12.5.3 also has an event listener when the pinch is completed. This listener\
    \ checks the scale value and if it is less than 1.5, the block is returned to\
    \ its original scale level of 1. If the ending scale value is greater than 1.5,\
    \ it is zoomed to a level of 3.\n\nBecause we used a linear transition to the\
    \ #block element in the CSS, this action of completing the zoom to 1 or 3 should\
    \ appear to animate. This is an example of how to use CSS and JavaScript together\
    \ to create a seamless interaction and apply a dynamic CSS transform to an object\
    \ that responds to touch events.\n\n# Interacting from the Desktop\n\nAs a designer,\
    \ you are focused on creating the best interaction and visual experience possible\
    \ to the user. Sometimes this includes the most clunky aspects of dealing with\
    \ Web interaction. Uploading files is currently one of the most of the actions\
    \ we are restricted to the browser, and we leave system-level behaviors alone.\
    \ However, as a next-level interface designer, you want to do whatever you can\
    \ create a natural experience in all aspects of an application.\n\nNormally, the\
    \ desktop is the desktop and the browser is the browser, but when uploading files\
    \ from your local machine there can be overlapping. This overlapping allows us\
    \ to hook into the File API to create a desktop-drag-drop file interaction. This\
    \ is where your designs begin to break out of the browser.\n\nIn this section\
    \ we will be going through a somewhat advanced demo on how to create a system\
    \ where the user can drag a file from the desktop and drop it into the browser\
    \ while we render the image and file information that can be used to create a\
    \ file upload system.\n\n# Creating a Desktop-to-Browser Drag-and-Drop Interface\n\
    \nIn Listing 12.6 you can create a basic HTML document containing a div element\
    \ with an ID of drop-zone (where the image will be dropped), CSS to give some\
    \ light styling to the drop zone, and a class set to give the user some feedback\
    \ (we'll get to that).\n\nListing 12.6 HTML Document with Drop Zone for Image\
    \ Upload\n\n```\n<doctype html>\n<html lang=\"en\">\n<head>\n<title>Chapter 12</title>\n\
    <meta charset=\"utf-8\">\n<style>\n#drop-zone {\n  min-height:300px;\n  max-width:300px;\n\
    ```"
