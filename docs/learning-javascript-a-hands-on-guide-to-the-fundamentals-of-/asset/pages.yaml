    # Origins


    Most people will tell you that Java and JavaScript are completely unrelated. It''s
    true that they are different languages, but their paths are intertwined quite
    a bit. Without Java, there would have been no JavaScript (or “LiveScript” as it
    was originally named). The original purpose fueling JavaScript was to create a
    language that would give easy control and access of Java Applets in the browser.
    We don''t use Java Applets anymore, but blocks in the middle of an HTML document,
    sometimes containing an entire application. It''s like the old-days version of
    Flash or HTML5s canvas element. JavaScript was intended to let designers hook
    into these without using a more intense language like Java. This initiative was
    championed by a little browser called Netscape in late 1995 (parent company, Mozilla),
    you probably know them by their current name, Firefox.


    Even though the intention of JavaScript was to work with Java Applets, we all
    know that never use the language to change around HTML, adding some behavior like
    roll-over effects to Web pages (we mostly do this with CSS now).


    The language had rapid success because of its ease and its dynamic nature. You
    could do a lot of cool stuff quickly, which is quite to the key of any product.
    The support was poor; there were no tools to help test code other than the browser,
