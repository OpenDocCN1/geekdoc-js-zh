    # # History API


    The History API allows you to manipulate the browser''s address bar and history
    contents. This is one of the features in the HTML5 JavaScript APIs that didn''t
    previously exist. There was a clear need for it with the influx of Ajax, so it
    was created. It helps to preserve meaningful URLs while loading Ajax content.
    One of the downsides of using Ajax as a main navigation feature in a Web application
    is that the URLs don''t change unless you force them to change. This can make
    for an uncomfortable user experience when sharing URLs and bookmarking is part
    of the natural process of interacting with browser. The History APIs solve this
    by allowing meaningful (and real) URLs to be pushed into the address bar and maintained
    in the browser history (forward and back).


    To help illustrate the History API, we will be using the HTML document from Listing
    11.5. You will also need to create the referenced documents: cat.html, dog.html,
    and bird.html. These files are not complete documents, just HTML snippets (a paragraph)
    that we will pull in with an Ajax call as we step through the example.


