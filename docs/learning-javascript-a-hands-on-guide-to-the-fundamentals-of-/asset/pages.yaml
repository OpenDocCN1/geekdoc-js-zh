  md: "# Listing 6.3.4 Returning Multiple Data Values with a Function\n\n```\nfunction\
    \ sayHello(greeting, exitStatement) {\n\n  /* add some passion to these dry arguments\
    \ */\n  var newGreeting = greeting + \"!\";\n  newExitStatement = exitStatement\
    \ + \"!!\";\n\n  /* return the arguments in an array */\n  return [newGreeting,\
    \ newExitStatement];\n\n}\n```\n\n# Passing Returned Values to Another Function\n\
    \nNow that you're returning variables, the next step is to pass variables into\
    \ another function so they can be actually used. Listing 6.3.5 shows the sayHello()\
    \ function from Listing 6.3.1 returning an array of information and a new function\
    \ called startle(), taking two arguments, passing them through the original sayHello()\
    \ function, and alerting the results.\n\n# Listing 6.3.5 Using Returned Function\
    \ Values Passed into Another Function\n\n```\nfunction sayHello(greeting, exitStatement)\
    \ {\n\n  /* add some passion to these dry arguments */\n  var newGreeting = greeting\
    \ + \"!\";\n  newExitStatement = exitStatement + \"!!\";\n\n  /* return the arguments\
    \ in an array */\n  return [newGreeting, newExitStatement];\n}\n\nfunction startle(polite,\
    \ rude) {\n\n  /* call the sayHello function, with arguments same each response\
    \ to a variable */\n  var greeting = sayHello(polite, rude)[0];\n  exit = sayHello(polite,\
    \ rude)[1];\n\n  /* alert the variables that have been passed through each function\
    \ */\n  alert(greeting + \" -- \" + exit);\n}\n\n/* call the function with our\
    \ arguments defined / */\nstartle(\"thank you\", \"you stink\");\n```"
