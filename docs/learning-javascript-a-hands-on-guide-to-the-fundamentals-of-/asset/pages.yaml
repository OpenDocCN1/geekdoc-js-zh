  md: '# Storing Data in JavaScript


    Storing data is core functionality of JavaScript. It doesn''t make things swoosh
    around the page, slide, fade in/out, or draw the user''s eye. But properly storing
    your data will make it well organized and easy to maintain later in your application,
    which is one of those magic pieces creating a great user experience that the user
    is completely ignorant about (in a good way—they don''t notice it). Quick and
    easy access to data, brilliant!


    In this chapter, you learn the different methods of storing data within a JavaScript
    model. Some methods are internal to your own personal scripting file and are consumed
    externally. Externally generated data can be produced by a database to lock your
    application or an external API service (we''ll get into APIs). In some form or
    another, you will be storing and caching data on every project, Knowing not only
    your options but the proper times to use them can be very valuable when you''re
    trying to create a codebase that performs well and is easily easy to maintain
    (a constant balancing act for all front-end code).


    As progress through this chapter, you notice a pattern exposing the history and
    future of JavaScript. We start off with the basics, move to more complex storage
    methods, then hit a point where we start talking about new methods; you''ll be
    able to see how once very complex data storage methods (they''re still around,
    which is why we''re learning them) come back and feel more thought-out and easier
    to work with. And, as usual, the old methods are important because the newer methods
    may not have support in your target audience. It''s a movement toward JavaScript
    that works better, and it''s important to realize that pattern to utilize the
    technology.


    # Variables


    Variables are the most basic forms of data storage in JavaScript. They''re used
    in all programming languages but are especially important here because they are
    an unavoidable aspect of writing good, high performance JavaScript. A variable
    is a label that is attached to a value. Sometimes the value changes, sometimes
    it doesn''t. But the label will always stay the same so you can reference it throughout
    your code.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Variables can be used a few different ways. You can self-define static variables,
    you can define dynamic variables, or you can use variables that take into account
    user interaction. These can be in the form of strings, numbers, or Boolean. These
    values can then be passed into a function, checked, combined, or modified as need
    throughout your program. The first step in creating a variable is called declaring
    a variable, which sets the label to what you want. Something to remember when
    declaring variables is that they are case sensitive, so uppercase versus lowercase
    always matters. In Listing 5.1, you can see a basic variable declarations.


    # Listing 5.1 Code Block Title


    ```

    /* this style is called "camelCase" */

    var myFavoriteSandwich;


    /* some people choose to use underscores instead of camelCase */

    var MY_FAVORITE_SANDWICH;


    var my_favorite_sandwich;


    /* all these variables are different in the eyes of JavaScript because the case
    is different, even though they technically read the same to a human */

    ```


    > Note

    The case-sensitive nature of variables is not an invitation to write variables
    with similar names. Although these variables will not collide from a technical
    standpoint, they can get confusing when a human eye is trying to debug or maintain
    the script. So it''s best to have distinct, meaningful names.


    # Strings


    A string is the first type of data that can be assigned to a variable. It''s nothing
    more than a collection of characters and can be anything from a single word to
    an entire paragraph or multiple paragraphs. They''re contained within quotes and
    are set with an equal sign (=). In Listing 5.2 you can see the variables we''ll
    be starting to form via strings.


    # Listing 5.2 Saving Strings to Variables


    ```

    var favoriteBreakfastSandwich = "Egg, Sausage and Cheese";

    var favoriteLunchSandwich = "Turkey Club";

    var favoriteDinnerSandwich = "Meatball";

    ```'
