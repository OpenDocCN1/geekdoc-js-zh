  md: 'Another positive aspect of microlibraries is that they are easier to learn.
    With something like jQuery, there can be multiple ways to solve even the simplest
    of problems; the endless number of methods and functions to learn can leave your
    head spinning and never knowing if a single solution is the best. The microlibraries
    are so focused, they can help you tackle very specific problems in very efficient
    ways.


    # The Bad


    With all things in life, there are bad elements and good elements, and microlibraries
    are usually significantly smaller than their library counterparts, that doesn''t
    necessarily mean the code is more efficient. This is where many people trip up
    when choosing a path to explore. Microlibraries can be very tempting when comparing
    a 3K-sized file to a 30K-sized file, it is always important to think about efficiency
    when dealing with performance and waste. Just because they''re smaller doesn''t
    necessarily mean they perform better.


    There are a few downsides to using these smaller, more focused libraries. Basically
    all the reasons for using a major library like jQuery or YUI are the reasons not
    to use a library. Documentation is a major problem with microlibraries. Not that
    it doesn''t, but you will likely use 3 to 6 microlibraries on a project, each
    of which has its own documentation and a repository that you need to be familiar
    with if you ever run into a snag writing your code. Having to jump back and forth
    between documentation sources can really put a damper on your development process.


    When building a project using multiple microlibraries, you will need to make sure
    they all work well together. Some will, and some won''t. This is what happens
    when you piece together things from all over the Web. It applies to anything from
    CSS to JavaScript to whichever back-end language you choose. Whenever you need
    to integrate multiple sources into a single source, you will certainly experience
    situations that don''t go as planned. This is one area where using a full-featured
    library would ease the pain of integrating many features because they all live
    in the same library and have been thoroughly tested, so they work well in the
    same environment.


    Building with this modest mindset can be a great model to follow with your development
    process. However, major libraries and frameworks are available that practice the
    same method-ology of using only what you need. YOU, as briefly mentioned earlier
    in this chapter, a great example of an established JavaScript framework, with
    a team of developers and support and documentation behind it offers a modular
    framework that can help you optimize performance. Many of the major libraries
    are moving over to this modular model, and they are worth exploring before diving
    into a custom collection of microlibraries that may not offer the proper amount
    of sustainability and support your project requires.'
