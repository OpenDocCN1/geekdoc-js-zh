- img_proc: true
  md: "# External and Unobtrusive JavaScript\n\nIn the last layer of progressive enhancement,\
    \ you will be taking the final step in removing all JavaScript from your HTML\
    \ document and tightening the separation between structure, presentation, and\
    \ behavior. As previously mentioned, by the time you get to this point, your application\
    \ or site should be fully functional. You're using JavaScript only to enhance\
    \ the user experience and make a project more responsive to user needs, providing\
    \ quick access to information.\n\nMaking a JavaScript file external isn't that\
    \ different from doing the same as a CSS file. The `<script>` element you learned\
    \ in the previous section has an available attribute `src`, which allows you to\
    \ pull an an external JavaScript file into an HTML document and execute the containing\
    \ functions.\n\nIn Listing 1.1.7 you can see how to link up a JavaScript file\
    \ at the bottom of an HTML document, followed by Listing 1.1.8, which is the contents\
    \ of the JavaScript.\n\n# Listing 1.1.7 Bottom Section of Our HTML5 Document with\
    \ External JavaScript\n\n```\n<script src=\"js/script.js\"></script>\n\n<body>\n\
    </html>\n```\n\n> Note\nLinking your JavaScript file at the bottom of the document\
    \ rather than at the top will let you control the rendering of the page a little\
    \ better. It can technically be linked from anywhere in the HTML document, but\
    \ because there are some pretty nasty performance problems with the way browsers\
    \ render and execute JavaScript, you will want to use the bottom of the document\
    \ to ensure that your JavaScript is the last item loaded. Because you used progressive\
    \ enhancement, your site is fully functional without JavaScript, this shouldn't\
    \ be a problem for the user. On another note, JavaScript is a little easier to\
    \ work with when the entire HTML document has already been rendered, doing so\
    \ will save you some minor headaches down the line.\n\n# Listing 1.1.8 Contents\
    \ of script.js\n\n```\n/*\nThe Function,\ndefine the thing you want to want\n\
    */\n\nfunction doTheThing() {\n  alert(\"This is the thing!\");\n}\n```"
