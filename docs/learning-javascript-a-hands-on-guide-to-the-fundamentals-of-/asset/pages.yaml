    # Targeting by Class


    So far the node targeting methods we''ve talked about have been similar to CSS
    selectors. In CSS you can target by ID and tagName, and they''re very commonly
    used. You can also target by class. JavaScript is no different; however, it has
    lagged behind a bit.


    For years now, since targeting an element by its class was in CSS, the community
    wanted the feature added to JavaScript. It took a while, but we finally have it!
    Recently added to JavaScript was the getElementsByClassName() method when it comes
    to producing and accessing the NodeList, but we can use some interesting combinations
    of selectors with this method, so let''s get started with the HTML in Listing
    4.4.


    # Listing 4.4 HTML Snippet Illustrating Element Node with Classes


    ```

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>getElementsByTagName Example</title>

    </head>

    <body>

    <h1>Using getElementsByTagName</h1>


