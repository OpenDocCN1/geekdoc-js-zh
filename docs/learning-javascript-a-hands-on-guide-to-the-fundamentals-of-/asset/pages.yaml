    # Data Storage


    Storing data is another JavaScript core concept that we spent a lot of time utilizing.
    As you stepped through the examples in this book, the data storage methods became
    more and more stable. We started off by using simple variables to store information
    like strings, numbers, and Boolean values; this was also to storing references
    to DOM nodes. From there, the storage models moved into a more robust system by
    adding different types of arrays (lists of data), like associative arrays and
    multidimensional arrays. Using data storage in these ways showed you that you
    don''t have to rely on flat data models in JavaScript just because there is no
    real concept of a database. Using a combination of variables and arrays can create
    a very robust and flexible data source for an application.


    After we toured through arrays and variables for storing data, we looked into
    saving information in objects—JSON objects, to be more specific. This led to us
    moving data storage to an external JSON file and stepped right into an Ajax interaction
    model to consume external data (pretty smooth?). These are all ways you can store
    information in various formats for use within your application.


    Listing 12.2 shows all the different forms of data storage that we have gone over
    to this point.


    # Listing 12.2 Application Data Storage


    ```

    // storing data in arrays

    var name = "Tim",

    city = "Boston",

    age = "107";


    // storing data in arrays

    dvar dude = [];


    dude["name"] = "Tim",

    dude["city"] = "Boston",

    dude["age"] = "107";

    ```'
