    Because external library plug-ins are often very specific to a certain page of
    your site of

    amapplication, it is very tempting to load that on the page where you need it.
    However,

    because of browser caching it is better to link up all your site''s JavaScript
    all the time. When a

    user hits with the externally linked files, which will all be cached in the browser
    and most

    likely not redownloaded. For that reason, if you''re linking multiple files (but
    try not), it''s

