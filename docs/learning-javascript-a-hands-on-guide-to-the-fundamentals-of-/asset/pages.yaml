  md: "# Chapter 9 Code Organization\n\nThat's pretty much all you need to know about\
    \ using eval(), and many people leave it at that and take it as a blanket statement.\
    \ But what kind of author would I be if I left it at that\n\nThere are a few reasons\
    \ not to use this method, but really, would I even bother bringing it up if it's\
    \ so bad? It's a method that's out there, and it's actually extremely easy to\
    \ use and pretty helpful. Unfortunately, the small upside of using eval() is dwarfed\
    \ by the enormous downside.\n\nBecause of eval()'s core functionality of evaluating\
    \ and executing any string that is passed into it as an argument, this makes the\
    \ method extremely insecure and very likely one of the largest security holes\
    \ in the entire language. By passing strings into the method, we are basically,\
    \ “Do whatever you like here.” Because of that, consuming third-party scripts\
    \ can leave you extremely vulnerable to injection hacks\n\nSecurity is the most\
    \ obvious problem when using eval(), but it can also make debugging your script\
    \ more difficult because it will not report proper errors and line numbers. You're\
    \ much better off using some of the eval() alternatives when a situation comes\
    \ up.\n\nYou've already come across a situation where you could have used eval(),\
    \ but we chose one of the alternative methods instead. In Chapter 8, “Communicating\
    \ with the Server Through AJAX”, when we could parse the JSON data file and saving\
    \ it to a variable using the JSON.parse() method you could have used eval(). However,\
    \ we don't want to consume a data feed like that evaluating the contents can be\
    \ very dangerous. In our case, it wasn't dangerous because we had full control\
    \ over the data in a static disk, where the likelihood of an attack is pretty\
    \ low. However, if it were an external script or being outputted from a database,\
    \ the likelihood of an injection hack increases quite a bit. That's why we use\
    \ JSON.parse() instead of eval(). It's a good habit to get into, especially because\
    \ consuming remote JSON data is an extremely common practice.\n\nIn Listing 9.12\
    \ you can see what the Ajax call from Chapter 8 would have looked like if had\
    \ chosen to use eval() rather than JSON.parse(). It is a small change on the surface,\
    \ but an enormous change under the hood.\n\n# Listing 9.12 Ajax Call from Chapter\
    \ 8 Using eval()\n\n```\nrequest.onreadystatechange = function() {\n\n  // check\
    \ to see if the Ajax call went through\n  if (request.readyState === 4 && request.status\
    \ === 200) {\n\n    // save the ajax response to a variable\n    var contacts\
    \ = eval(\"(\\ + request.responseText + \")\");\n\n    // make sure the callback\
    \ is indeed a function before executing it\n    if(typeof callback === \"function\"\
    ) {\n\n    callback(contacts);\n}\n```"
