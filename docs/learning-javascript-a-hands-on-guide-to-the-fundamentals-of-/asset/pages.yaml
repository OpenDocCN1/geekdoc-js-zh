  md: 'Chapter 11 HTML5 JavaScript APIs


    # # What Is HTML?


    HTML5 is the concept of semantic markup bundled with JavaScript APIs. The term
    “HTML5” has, over the past few years, ballooned into somewhat of a monster catch-all
    that people use when talking about the bucket of new features that have been added
    to our Web development toolkit. However, very few things added into HTML5 would
    be considered “new” to the Web community. Yes, the elements are new and the JavaScript
    APIs hadn’t been seen before. But the core concepts haven’t changed much. I’ll
    explain.


    Arably, one of the greatest things about HTML5 was the user-centered approach
    to the design of the fifth version of the language. Wait, user-centered design
    of code? It sounds weird, but that’s exactly what happened. But everything in
    HTML5 already existed in one or another before the language was formalized. Did
    we validate form fields? Yes. Could we get some geographic location? Yes. Could
    we play audio and video in the browser? What about calendar-style date pickers?
    Most of the main features were already already; we were just creating them as
    nonstandard objects, whether it’s validation on the server or a date picker built
    with JavaScript.


    What happened was the powers-to-be (the W3C) looked at all the struggles and hacking
    what was going on in the community and decided to formalize them into the language.
    Because of the way this model was implemented, just about everything in HTML5
    is usable right now. For example, you can implement HTML5 form validation and
    create a fallback sequence of JavaScript validation, and server-side validation.
    Using this model assures that every user will get the best possible experience,
    even if it’s not what you intended. If a browser doesn’t support a feature, it
    will gracefully degrade to a secondary experience. This method can be applied
    to all the HTML5 features that previously existed in other forms before their
    formal.


    Not all the features existed beforehand, and some are even still being added.
    We go over a few of the JavaScript APIs in this chapter. A few fall into the “we
    could already do that” category, and others won’t. Either way it will be a journey
    discovering the features you can play as you move forward with JavaScript. Let’s
    get started by getting to know some of the new elements before moving onto the
    JavaScript APIs.


    # # The Markup (as HTML)


    At first glance, with HTML5, the new elements jump out and command attention.
    The W3C listened to the community and planned for the future when architecting
    the abundance of new elements. We have everything from basic elements like `<header>`
    and `<footer>` to others like `<video>` and `<audio>` that tap into what seems
    to be a powerful API that allows us the freedom to create more user-friendly applications
    while further distancing ourselves from reliance on Flash for saving data and
    intense animation.


    Because the focus of this book is JavaScript, we won’t be spending a lot of time
    talking about the HTML elements, but the topic of HTML5 in general opens the door
    to discuss the JavaScript APIs that were shipped out with this fifth version of
    language. Some of the'
