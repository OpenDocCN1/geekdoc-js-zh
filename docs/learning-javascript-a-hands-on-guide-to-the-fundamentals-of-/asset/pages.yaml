    # Siblings


    Siblings, like in real life, are on the same level (without the inherent rivalry).
    If a parent has multiple children, they are referred to as siblings. In Listing
    3.1.2 you can see that all the list items underneath the parent <ul> are on the
    same level, making children of the <ul>, but also siblings to each other. They
    can be a child, parent, and sibling all at the same time if they have children.


    # Listing 3.1.2 Sibling Element in HTML


    ```

    <!-- each LI is a sibling of the other list items, because they''re on the same
    level -->

    <ul><li>Joan</li>

    <li>Charlie</li>

    <li>Peter</li>

    <li>Christine</li>

    <li>Anna</li>

    <li>Tim</li>

    </ul>

    ```


    All though the people in Listing 3.1.2 may not be siblings in real life, they
    are in the eyes of the document object model.


    # Variables


    Variables in JavaScript can hold values, objects, or even functions. They can
    change, they can be static, and can even be empty. I guess you could say that
    their function in JavaScript is variable (pun intended). The basic function of
    a variable is to store some information. There are types of variables that you
    may encounter as you''re learning JavaScript: local variables and global variables.


    # Local Variables


    Local variables are defined within a function and can be used only within that
    function (you will learn about functions in a bit). That means you can''t declare
    a local variable inside function A and because B they are contained inside the
    function in which they were defined. Local variables are always prefixed using
    "var" when they''re defined. Listing 3.2 shows a list of basic variables defined.
    These are empty variables right now, but we''ll filling them up pretty soon.'
