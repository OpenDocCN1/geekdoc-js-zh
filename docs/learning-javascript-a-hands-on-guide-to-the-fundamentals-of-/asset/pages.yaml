  md: '# Operators


    Operators are the symbols in JavaScript you may recognize from math class. You
    can add, subtract, multiply, compare, and set values. The equal sign (=) in Listing
    3.2.2 is an example of an operator setting a value. Table 3.1 shows various operators
    you can use and their meaning.


    Table 3.1 JavaScript Operators


    | Operator | Description |

    | --- | --- |

    | + | Add or concatenate |

    | - | Subtract |

    | * | Multiply |

    | / | Divide |

    | ++ | Increment (count up) |

    | -- | Decrement (count down, two minus signs) |

    | = | Set value |


    Listing 3.3, you can see variables and strings being added and concatenated with
    the + operator.


    Listing 3.3 Adding Strings and Numbers Together with Operators.


    ```

    /* save my name to a variable using the = operator */

    var myName = "tim";


    /* adding a variable to a string */

    alert(myName + ", this is me");


    /* adding numbers together */

    alert(100 + 50); // should alert 150


    /* concatenating strings together */

    alert("100" + "50" + ", adding strings together"); // should alert 10050

    ```


    > NotenIf you are using operators for any math, the values must be numbers and
    not strings. You can add, subtract, multiply, divide, or combine (concatenate)
    numbers, but only the actions of strings are combine and compare. If you have
    a number that JavaScript is treating as a string, it needs to be converted to
    an actual number to be treated such by JavaScript operators. But it is best to
    start with a number if you can.'
