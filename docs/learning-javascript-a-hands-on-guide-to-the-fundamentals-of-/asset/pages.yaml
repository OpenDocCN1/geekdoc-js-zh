    # Web Storage in HTML5


    Up to this point in the chapter, we have been talking about data storage from
    the developer''s side (your side). User interactions are what we do with JavaScript—it
    creates a behavior layer (you know this). With that in mind, the next step in
    your JavaScript storage progression is to start using storage as a way to interact
    with the user.


    In the past we''ve used cookies to save user-generated data, but let me be first
    (one of the millions actually) to say that cookies are crappy, a pain to deal
    with, and insecure. We''ve known it for years, and yet we continue to use them.
    The main problem with cookies is that they get such a bad rap for being riddled
    with tracking information and malware that people often browse with them around.
    Luckily, there''s a better way and it''s built right into the language.


    The fine folks at the W3C also noticed how wacky setting, getting, and deleting
    browser cookies was, a new standard for Web storage was created in HTML5: localStorage
    and sessionStorage. These two new kids on the block (pun intended) are already
    changing the way we interact with user-initiated storage data. Let''s take a look
    at them.


    # localStorage and sessionStorage


    As mentioned, storing information in a user''s browser dates back to the early
    days of the Web and cookies. Sometimes it''s just a may saying, "I''ve been here
    before." Sometimes it''s actual data (name, address, and so) triggered by some
    event. Either way, it''s a powerful tool for creating a better and more personalized
    user experience in the browser.


    In HTML5 you have access to two new storage objects: localStorage and sessionStorage.
    These objects are paired with three methods: setItem, getItem, and removeItem.
    Let''s take a look at them individually.


    # setItem


    The set method takes two arguments. The first is the equivalent of a variable
    label, or what you want to call the data being stored. The second argument is
    the data itself, which must be a string. Calling setItem with local/sessionStorage
    will store the data locally for the user.'
