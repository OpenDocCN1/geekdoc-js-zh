  md: '# Device API


    With the Device API we can further narrow the gap between building a native device
    application and developing purely on the Web. It is one of those things out on
    the bleeding edge of the Web. At the time of writing, very few browsers and devices
    support this specification, but it''s by far one of the coolest things on the
    horizon of JavaScript. We finally have a pathway to gaining advanced access to
    the device we are visiting with.


    Up to this point in Web design and development, the limitations of getting advanced
    access to device capabilities have been one of the very few barriers to creating
    our "One Web" goal and building all applications on a single code base of HTML,
    CSS, and JavaScript. This limitation has been attributed, to the negative back-verse
    stigma JavaScript has carried it for years. Even though we were very wary of JavaScript''s
    known problems, we have been able to move the Web forward in a responsible manner.
    One of the first major steps in that is the Device API.


    Parts of the API have been added into JavaScript and other parts in HTML. The
    Device API opens up new world of opportunities with connections to device information,
    such as the battery life and current available bandwidth, with the ability to
    shock the world and vibrate a user''s phone from a browser, which will help create
    a Web that is more targeted to the needs of a user and provide the best possible
    experience customized for each person.


    In this section we will be taking a peek at the Device API and three of its major
    components: the Battery Status API, the Vibration API, and the Network Information
    API. Each API will be going over as an official draft specification with the W3C
    and will be the future of clientside interaction in the browser.


    # The Battery Status API


    The initial specification for the Battery Status API came out in 2010 as part
    of the System Information API specification, but within a year it broke off into
    its own draft so it could be more readily available and implemented independently.
    It was thought to have enough merit to stand on its own, and since the specification
    has grown in a robust document and has gained support in Firefox 10.


    This API provides a way for you to retrieve the battery life and status of a device
    from the browser, which will allow you to design an efficient Web application
    that can respond to the amount of power left in the device provide the best experience
    possible. It can be used to defer or scale excess processing when the device is
    not charging. For example, if you are trying to create the real-time data illusion
    when in the Ajax chapter by using setInterval(), you could adjust the amount of
    Ajax calls to the server, conditionally based upon the amount of battery life.


    You may have noticed from Figure 12 that inside the navigator object was something
    labeled mockBattery. This is the object, in Firefox, for the Battery Status API.
    It provides all the information you need to find out about a device''s battery
    life. The API will return four types of:'
