  md: '# JavaScript Library Basics


    A JavaScript library is a collection of functions and methods presented in a reusable
    format. Libraries can be a set of personal assets and functions that you build
    for an individual project or, more commonly, a set of assets and functions. They
    are carried from project to project to help reduce development time by saving
    and reapplying the common coding patterns over and.


    You may not noticed it, but we have been building a sort of JavaScript library
    throughout this book. I''ll admit it is an extremely small library, but anytime
    you write a flexible function, you have the ability to reuse it beyond the scope
    of the current project. The ajaxCall() function from Chapter 8, "Communicating
    with the Server Through Ajax," is a great example of the kind of asset you would
    build into a library because it was built in a very flexible manner and easily
    used with any local JSON data. In fact, that''s how many of the original JavaScript
    libraries started. There was a single person collecting used functions who gave
    them out for the world to use.


    As I said, libraries are personal collections of code that you save and transport
    from project to project, but most of the libraries you interact with are collections
    of JavaScript methods that other people write. Whether they''re libraries, toolkits,
    or frameworks, they are all basically a collection of JavaScript some other person
    (or a team of people) write for you and others to consume.


    As with anything, there are always ups and downs to using a library. There are
    all of them in the wild and it is an overwhelming experience trying to choose
    the correct one for the job on a particular project.


    There are two very different ends of the spectrum when it comes to opinions about
    using libraries in JavaScript. Many are heavily in favor of using them, and many
    others lean in the other direction. It will be completely up to you to decide
    which side of the fence you want to be on; hopefully, this chapter will help you
    come to a conclusion. The debate about using a library will go on for decades
    and probably won''t come to an end. However, it doesn''t matter because we are
    all out to accomplish the same goal on a project, and whatever set of tools you
    choose to accomplish that goal will be the right ones for the job, whether it''s
    a JavaScript library, a back-end framework, or 100% custom code.


    In this section you''re going to learn some of the basic concepts that help the
    learning process when working with a new library, the purpose of creating a library,
    what goes into a library, and how libraries can save you time in the long run.
    If JavaScript is causing any sort of headache at this point (it''s common, don''t
    worry), you can think of libraries as your wellknown headache medicine that our
    lawyers won''let explicitly call out by name. Most of the time it will stop your
    head from throbbing, although it doesn''t, and be sure you don''t take too much
    or you can find yourself in some serious trouble.'
  merge: -1
