    HTML5 JavaScript APIs.\" For now it's important to note it as something you will\
    \ need to code back into your Ajax applications.\n\n# Security\n\nSensitive information\
    \ always needs to be encrypted before getting sent over the Internet. Usernames,\
    \ passwords, social security numbers, bank accounts, credit card information—these\
    \ are all types of data that are sent through the unencrypted because of developer\
    \ errors.\n\nSending unencrypted information through Ajax calls can lead to hacked\
