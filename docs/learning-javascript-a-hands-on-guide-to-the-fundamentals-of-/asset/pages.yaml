    to get the most out of this book and also feel comfortable in moving forward with
    the language. I''ve always said that the key to solving a problem is first knowing
    how to identify it, and when it isn''t, you have to look it up. a big secret of
    great coders is that we know how to find a solution. Sometimes it''s in your head;
    often times it isn''t, and you go across somewhere. Knowing what a problem is
    or a general solution that you need to expand upon will help guide you to the
    answer. This is why getting to know the terms you will be coming across and what
    they mean is vital to problem solving with JavaScript.


    We go over terms and look at general code examples, so whatever you''re creating
    JavaScript from scratch or jumping into someone else''s code, you''ll be able
    to identify what you''re looking. As you go through this book, knowing what these
    terms will help you through some of the examples.


    # Basics


    You''ll need to know some basic terms in JavaScript, and this section will briefly
    go over those topics and display some code examples where applicable. These are
    terms you should have a strong understanding of before moving on to the next chapter
    because you will encounter them quite a bit in the course of reading this book.


    JavaScript is a very flexible (call it unstructured) language, so many of these
    terms may be called something else in different circumstances like a function
    or method—you''ll get to that. But knowing the basics will help you a lot.


    # Document Object Model (DOM)


    At its simplest level, the DOM is an outline of the HTML document you are accessing.
    It functions in the same way that what an outline for any document would function—a
    book, an article, a grocery list, anything with structure. There are top-level
    items, items nested under them, and items grouped in chunks (like pages in a chapter
    and chapters in a book). These'
