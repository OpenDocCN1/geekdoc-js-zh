    +   - Mastering all of the JavaScript concepts and terminology you need to write
    new programs or easily modify code

    - Creating robust, secure code for both design and development levels

    - Maximizing usability, reusability, accessibility, clarity, and performance

    - Taking full advantage of the browser environments your code will run in

    - Accessing the DOM to create behaviors and data interactions

    - Storing data for easy and efficient access

    - Using variables, functions, loops, and other cor

    - Interacting with users through events

    - Communicating with servers through Ajax

    - Improving your productivity with JavaScript libr


