  md: "# Chapter 12 Moving Forward with JavaScript\n\nBecause gesture events are directly\
    \ related to pinching and zooming of an object, they return a scale value that\
    \ you can access and manually apply to an object. In this example of scaling the\
    \ HTML block with a pinch-zoom, we will be utilizing the getTransformExtension\
    \ function combined with the returned scale value from the gesture event to apply\
    \ the scale transform to our object.\n\nIn Listing 12.5.3, you can see an event\
    \ listener to capture the gesture change event, prevent the default behavior of\
    \ zooming the entire document, and apply the scale value inside the transform.\n\
    \n# Listing 12.5.3 Scaling a Block\n\n```\n// anonymous function to contain the\
    \ variables\nfunction() {\n\n  \"use strict\";\n\n  var body = document.getElementsByTagName(\"\
    body\")[0],\n      block = document.getElementById(\"block\"),\n      extension\
    \ = getTransformExtension(body);\n\n  // rotate the block 10 degrees\n  block.style[extension]\
    \ = \"rotate(10deg)\";\n\n  // when the eventListener changes, apply the scale\
    \ value to the block\n  block.addEventListener(\"gesturechange\", function(e)\
    \ {\n\n    e.preventDefault();\n\n    block.style[extension] = \"scale(\"+ e.scale\
    \ ++\")\";\n\n  }, false);\n\n  // when the pinch is over, check the scale value\n\
    \  block.addEventListener(\"gestureend\", function(e) {\n\n    // if the scale\
    \ is over 1.5, scale to 3, otherwise return to original state\n    if(e.scale\
    \ > 1.5) {\n      block.style[extension] = \"scale(3)\";\n    } else {\n     \
    \ block.style[extension] = \"scale(1) rotate(10deg)\";\n    }\n  }, false);\n\n\
    });\n```"
