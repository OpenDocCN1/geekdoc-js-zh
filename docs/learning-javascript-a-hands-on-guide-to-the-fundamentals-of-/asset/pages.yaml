  md: "# Listing 12.4.3 dispatchEvent()\n\n```\n// trigger the event on the item in\
    \ context\nfirst.target.dispatchEvent(simulatedEvent);\n```\n\nNow that the entire\
    \ mapping has been built into the mapTouches, you get to take a look at something\
    \ that seems a little more familiar in event listeners. The mapTouches function\
    \ still needs to be fired off when the touch event occurs. For this we set up\
    \ a series of listeners for each of the events: touchstart, touchmove, and touchend,\
    \ each of which executes the mapTouches function individually.\n\nListing 12.4.4\
    \ shows how to set up the listeners with each touch event so the events are mapped\
    \ together. Below that you will use a normal mousemove event, which opens a JavaScript\
    \ alert.\n\n# Listing 12.4.4 Listening for Touch Events\n\n```\n// anonymous function\
    \ to contain scope\nfunction() {\n\n  // set up the event listeners\n  document.addEventListener(\"\
    touchstart\", mapTouches, false);\n  document.addEventListener(\"touchmove\",\
    \ mapTouches, false);\n  document.addEventListener(\"touchend\", mapTouches, false);\n\
    \n  // test out the mappings with a mousemove event\n  document.addEventListener(\"\
    mousemove\", function(e) {\n\n    alert('got it!');\n\n  });\n\n));// End anonymous\
    \ function\n```\n\nNow that the events are properly mapped and the listeners are\
    \ set up, you should be able to execute the code in Listings 12.4–12.4.4 in a\
    \ touch-capable browser, swipe your finger across the page, and see the alert\
    \ window pop up. This means your events are properly mapping. If you were to disable\
    \ the mapping and try again, it wouldn't work.\n\n# CSS Transforms in JavaScript\n\
    \nAny style can be added with JavaScript, but as I mentioned a few times before,\
    \ that's generally not a good idea because CSS is so much faster than JavaScript.\
    \ If you can use CSS to apply styles, you should. There are times when you will\
    \ want to use JavaScript to apply dynamic styles to a DOM node. By dynamic styles,\
    \ I don't mean styles that are added after the document has been rendered, but\
    \ rather styles that need to respond"
