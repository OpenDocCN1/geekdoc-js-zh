  md: '# Tools to Help You Use JavaScript


    Every browser has a JavaScript console available, mostly it''s a matter of finding
    it. If there is a Developer menu, it is inevitably there. Figure 2.4 shows where
    the JavaScript console is for Google Chrome.


    ![](img/1fc495d5f409712b6e281b5d531f60c4_58_0.png)


    Entire articles have been written using the console, but for our purposes we will
    use it for debugging, monitoring errors, and Ajax interactions. The console can
    be your best friend when debugging.


    # Tools Built into the Browser


    By tools built into the browser mean Web applications that have been created with
    the sole purpose of helping you write JavaScript. Nice, right? Browser tools can
    help you remove all whitespace from code to improve performance, like the YUI
    Compressor (www.refresh-sf-com/yui/). The compressor can greatly help the performance
    of your JavaScript by reducing the file size. This application can take text (posted
    code), uploaded files, or remote URLs. Use this with caution. The YUI compressor
    is a great tool, but it does make your code basically unmanageable by shrinking
    it all down to one. With that in mind, if you plan to use this service, to be
    as an uncompressed version of the file that you can work in.


    Compression applications like YUI Compressor are great, but there''s another online
    service JSLint (http://www.jslint.com), which will parse through your JavaScript
    and look for syntax and formatting problems. The slogan "JSLint will hurt your
    feelings" is absolutely dead. It''s always a shock to read through error productions.
    Most are not actually errors in the browser, but JSLint will guide you toward
    best practices in code organization as well, helping you create even more streamlined,
    functional JavaScript.'
