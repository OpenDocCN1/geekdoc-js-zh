  md: 'browser''s implementation of the language that actually produces the blocking
    nature of the language.


    Generally speaking, the code you don''t see in the browser, such as <meta> elements,
    the <title> element, DOCTYPE, links to favicons, or an external CSS file, are
    placed in the <head> or at the top of the document, because you want all assets
    to be downloaded first so by the time the document is rendered, your design will
    be worked out and placed correctly.


    If you''ve ever been to a Web page that has a flash of white before it is completely
    rendered in the browser, that is JavaScript (placed in the <head>) being downloaded
    and blocking all the other assets in the process. It is only a second usual, but
    it is certainly something that can be easily fixed by moving your JavaScript reference
    to the bottom of the document. This will ensure that the entire document renders
    smoothly. If you build with progressive enhancement in mind, your website or application
    will still be fully functional before the JavaScript is downloaded and rendered;
    it should be a transparent process to the user, who is most likely there for content
    and not your cool JavaScript animations (don''t worry, I''ll be there for the
    cool animations).


    While assets are being downloaded, the last step in the process is also happening;
    the browser is translating the code you wrote into some form of coherent output.
    This is called **rendering** and all browsers do it differently.


    # JavaScript and Rendering Engines


    A rendering engine in a browser creates what you see on a screen. There are different
    ones for each browser. Table 2.1 shows common browsers paired with their associated
    rendering engine.


    | Table 2.1 Popular Web Browsers and Their Rendering Engines |

    | --- | --- |

    | Firefox | Gecko |

    | Internet Explorer | Trident |

    | Chrome | Webkit |

    | Safari | Webkit |

    | iOS & Android | Webkit |

    | Opera | Presto |


    As you can see in Table 2.1, there are a fair number of rendering engines. When
    you talk about code working differently in different browsers (modern browsers),
    you are generally referring to the rendering engine. That''s why you have very
    few differences in support between Chrome and Safari; they are both built on the
    same open source rendering engine, Webkit.'
