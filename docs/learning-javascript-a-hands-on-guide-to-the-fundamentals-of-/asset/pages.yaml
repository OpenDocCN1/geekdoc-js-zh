  md: "```\npadding:15px;\nborder:4px dashed #999; }\n\n#drop-zone img {\n  max-width:100%;\n\
    \  display:block;\n}\n\n.over {\n  border-color:#333;\n  background:#ddd;\n}\n\
    \n</style>\n```\n\n```\n</head>\n<body>\n<div id=\"drop-zone\"></div><!--/drop-zone-->\n\
    \n<script src=\"js/filedrop.js\"></script>\n\n</body>\n</html>\n```\n\nIf you\
    \ were to load the basic HTML document in a browser and drag an image to it, it\
