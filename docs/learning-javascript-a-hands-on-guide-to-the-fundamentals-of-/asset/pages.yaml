    \ is purely cosmetic. As long as the variables are grouped at the top of each\
    \ function, the formatting is completely up to you. This is an area where a team\
    \ meeting about a style guide would be a good idea; although the result of the\
    \ code is the same, it's nice to use a similar format across a team. Each comment\
    \ should also have its own individual.\n\n# Listing 9.4.1 Multiline Variable Declarations\n\
    \n```\n(function () {\n\n  \"use strict\";\n\n  var body = document.getElementsByTagName(\"\
    body\")[0]; // target element\n  partyStarter = \"Starlen\"; // name of the person\
