  md: '# A People''s History of JavaScript


    rewrite the functionality in JScript to create a consistent user experience. It
    was a terrible model, but everyone followed it for lack of a better way.


    This time in the front-end scripting world wasn''t all for nothing, Through the
    frustration of browser compatibility problems came a desire to create some form
    of Web standards and a common language that worked across many browsers. This
    first attempt at standardization/merging of JavaScript and Jscript was called
    ECMAScript. This new language was more of a standardized version of JavaScript,
    but we still called JavaScript, obviously, or this book would be called Learning
    ECMAScript, but it did kick the conversation with the Web needing some sort of
    standardization.


    This conversation also brought to light problems with how browsers were creating
    the outline for an HTML document, which JavaScript''s main access to the Web created
    the root problem. At this point in history we started to see the power of current-day
    JavaScript take form. This agreed-upon document outline was eventually called
    the object model (DOM). Creating a virtual DOM led the Web back to its roots where
    the actual structure of the document was just—structure, without communicating
    any information about presentation. This was the first step toward true separation
    between structure, presentation, and behavior. As you learned in the previous
    chapter, it wasn''t until years later that the official term for this was coined
    for Web and we entered the age of progressive enhancement.


    In 1999, Microsoft created the earliest stage of Ajax in the form of an ActiveX
    XMLHttpRequest, which allowed internal areas of an HTML document to be updated
    without refreshing the browser window, valuing bandwidth. This feature was so
    popular and highly desired that other browser makers adopted it almost immediately
    under the current (technical) name, the XMLHttpRequest object. It wasn''t until
    2005 that the term Ajax was coined, with the underlying technology still the XMLHttpRequest
    object in JavaScript.


    All these standards, browser wars, and debates that throughout the years contributed
    to what you use today. It is important to know what is going on right now, but
    it is equally important to learn about the origins, how we got to where we are,
    and the evolution of the language so you can recognize when trends seem to be
    circling back to old ways. Knowing the history and being able to tell when a new
    technology is going to fail (because something already failed in the past) can
    save you a lot of frustration in learning technologies that have shortsighted
    futures.


