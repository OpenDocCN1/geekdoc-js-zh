    # Summary


    In this chapter, we learned about the Document Object Model, or the DOM, and the
    different types of nodes that construct the tree and all its branches. We went
    over how to map out an HTML document and talked about how the DOM related to JavaScript.


    We also learned about how to navigate the DOM tree to target specific nodes or
    elements you want to store or modify. Besides navigating up and down the tree,
    we discovered many ways to jump directly to a node based on information attached
    to it, such as IDs, classes, and even the tag name itself.


    Later on we created new DOM nodes, filling them with content and then inserting
    them into the document.


