    # Arrays


    Most variables can hold only a single string, a single number, or a single Boolean
    value. A lot of times you need more than that. If you need to store actual data
    in a variable, you would use what is called an array. They''re declared in a similar
    way, with a var declaration, but they can contain much more information to be
    passed throughout your JavaScript. An array is basically just a list of stuff
    saved into one variable. The benefit is that you can directly access each item
    in the array while having them grouped together in a logical way.


    In Listing 5.6 we see the two ways you can declare an array. Initially declaring
    an array with the new object tells JavaScript, "Hey, I have an array coming at."


    # Listing 5.6 Declaring an Array


    ```

    /* using the "new" keyword */

    var favoriteSandwiches = new Array();

    ```


    ```

    /* using shorthand brackets */

    var favoriteSandwiches = [];

    ```


    After declaring the array, you need to fill it with stuff. If you have the values
    figured out already, you could combine the processes of declaring the array with
    assigning it values. The list doesn''t have to be complete, but you do need something
    in to start building out a list. As you find out later, you can dynamically add
    items to an array, but for now, let''s manually put them in. Listing 5.7 shows
    a combination of declaring the array and assigning some values.


    # Listing 5.7 Declaring an Array and Assigning Values in the Same Time


    ```

    var favoriteSandwiches = ["Egg, Sausage and Cheese", "Turkey Club", "Meatball"];

    ```


    Like a normal variable, an array can be any combination of strings, numbers, objects,
    other arrays, expressions, and/or boolean values.


    # Basic Array


    As mentioned earlier, an array is a list of stuff (usually related stuff) and
    Listing 5.6 depicts an array in its most basic form. When you combine the declaration
    of an array with the value'
