  md: 'through an Ajax call, it is parsed the same as a normal HTML document with
    methods like getElementsByTagName(), getAttribute(), parentNode, firstChild, and
    lastChild. Not having to relearn new methods to parse XML makes it a very attractive
    option.


    # Negatives


    Because XML is so similar to HTML and uses the same DOM standards, it can take
    a lot of code to parse and build the output.


    One big drawback of using XML is that it cannot be used cross-domain with Ajax.
    All Ajax calls to an XML data file must come from the same domain or the request
    will fail. For this reason, you don''t see a lot of public data sources in XML
    format. If they were, you would need to create a server-side proxy to pull in
    the XML and have the Ajax reference data by way of the proxy.


    # HTML


    Working with Ajax and HTML snippets couldn''t be more straightforward. You have
    an HTML file and you consume its contents in full with an Ajax call. Listing 8.8
    shows our JSON data in the form of HTML.


    Listing 8.8 Example Data in HTML Format


    ```

    <ul>

    <li><a href="mailto:hill@example.com">hillishia</a></li>

    <li><a href="mailto:cleveland@example.com">paul</a></li>

    <li><a href="mailto:vish@example.com">vishaal</a></li>

    <li><a href="mailto:grady@example.com">mike</a></li>

    <li><a href="mailto:dusted@example.com">jamie</a></li>

    </ul>

    ```


    # Positives


    Speed is an important reason to use this method. Unlike the other data, client-side
    parsing is needed because you''re grabbing an entire snippet of HTML and outputting
    it into the DOM. Not having to write a lot of extra JavaScript to parse the incoming
    HTML will not only save you time as a developer, but will save processing time
    for the user.


    # Negatives


    Using HTML as a data source works very well if are asynchronously updating a single
    block of content in a document, but it doesn''t get you the fine-grained control
    that XML or JSON give you.'
