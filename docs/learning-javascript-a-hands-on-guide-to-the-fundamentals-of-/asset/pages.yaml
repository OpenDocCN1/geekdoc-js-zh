- img_proc: true
  md: "Removing the HTML snippet inside the data loop in Listing 12.7 will create\
    \ a more fluid JavaScript document. By moving it into the HTML and rendering it\
    \ with JavaScript templates, we can also keep document structure where it belongs,\
    \ in the HTML. I'm leading you into a potential issue, as you might have guessed.\n\
    \nThere are many popular JavaScript templating libraries available today, and\
    \ trying to cover them all wouldn't do you favors. Even though each library contains\
    \ different syntax models, the overall concept of embedding a template in HTML\
    \ and parsing it with JavaScript combined with JSON data still reigns, no matter\
    \ which library you choose to pursue. For our purposes we will be looking into\
    \ the Mustache library for our JavaScript templating needs.\n\n# Learning Mustache\n\
    \nMustache is a JavaScript templating library that holds the principle of rendering\
    \ document structure in HTML better than many other libraries available. Because\
    \ Mustache is a library, it needs to be downloaded and included in the document\
    \ same as we included jQuery into the document in Chapter 10, \"Making JavaScript\
    \ Easier with Libraries.\"\n\n# Including a Templating Library\n\nBecause the\
    \ best way to illustrate the functionality of a JavaScript template is to take\
    \ a look at them, let's examine Listing 12.7.1 and exactly how document is prepared\
    \ to accept JavaScript templates.\n\nThe first glance that you may notice at the\
    \ bottom of the document is the inclusion of the mustache.js file. This is the\
    \ library, the same way we included jquery.js. The other addition that you might\
    \ not recognize is the <script> element. This is where we will come back to add\
    \ in the structure for our JavaScript templates.\n\n# Listing 12.7.1 HTML Structure\
    \ in Preparation for Mustache Templates\n\n```\n<!doctype html>\n<html lang=\"\
    en\">\n<head>\n    <title>Chapter 12 - JS Templates</title>\n    <meta charset=\"\
    utf-8\">\n</head>\n<body>\n<form action=\"\" method=\"get\" id=\"search-form\"\
    >\n<div>\n    <label for=\"q\">Search address book</label>\n    <input type=\"\
    search\" id=\"q\" required placeholder=\"type a name\" autocomplete=\"off\">\n\
    </div>\n```"
