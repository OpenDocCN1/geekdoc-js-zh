  md: '# Listing 8.1.1 If Statement to Check for Support of the XMLHttpRequest


    ```

    if ( window.XMLHttpRequest ) { // check for support


    // if it''s supported, use it because it''s better

    xhr = new XMLHttpRequest();

    ```


    ```

    else if ( window.ActiveObject ) { // check for the IE 6 version


    // save it to the xhr variable

    xr = new ActiveXObject("Msxml12.XMLHTTP");

    ```


    ```

    }

    ```


    Because this is a very common bit of functionality with any Ajax call and will
    be reused and over, it is best to save it to a function. You will find similar
    functions all over the Web with XMLHttpRequest feature detection.


    The goal of this function is to detect the correct Ajax object and return it for
    use wherever you need it. Because this is a function that passes information into
    another function, the first step is to initialize the variable, then run the normal
    if statement and return the variable so it can be passed into another function().
    In Listing 8.1.2 you can see the complete function called getHTTPObject() and
    the return value of xhr at the end.


    # Listing 8.1.2 Function to Return the Correct Ajax Object


    ```

    function getHTTPObject() {


    // initialize the variable

    var xhr;


    if (window.XMLHttpRequest) { // check for support


    // if it''s supported, use it because it''s better

    xr = new XMLHttpRequest();


    else if (window.ActiveObject) { // check for the IE 6 Ajax


    // save it to the xhr variable

    xr = new ActiveXObject("Msxml12.XMLHTTP");


    // spit out the correct one so we can use it

    return xhr;


    }

    ```'
