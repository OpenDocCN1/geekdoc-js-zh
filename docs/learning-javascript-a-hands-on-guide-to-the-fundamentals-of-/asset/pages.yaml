  md: "# The JavaScript APIs\n\nListing 11.5.4 Activating the popstate event with\
    \ the History API\n\n```\n// listen for the popstate event (forward and back buttons)\n\
    window.addEventListener(\"popstate\", function(e) {\n\n  // access the history\
    \ state (the URL that was saved)\n  var storedHistoryData = e.state;\n\n  // make\
    \ the ajax call to get the HTML snippet in the page\n  ajaxCall(storedHistoryData,\
    \ output, function (data) {\n    output.innerHTML = data;\n  });\n});\n// // end\
    \ listener()\n```\n\nWhen combining pushState() and popstate with Ajax, you can\
    \ simulate the normal browsing experience without a single page reload, creating\
    \ a more seamless user experience.\n\n# Web Workers\n\nWeb workers are HTML5's\
    \ attempt at creating a better user experience in an area that to this point has\
    \ been one of the most brutally hacked spaces on the Web: server communication.\
    \ That's right: Ajax. Workers are not to replace Ajax; they exist to supplement\
    \ the server communication model that is currently in place.\n\nJavaScript is\
    \ blocking in nature and you know that; it's why we rely at the bottom of the\
    \ DOM and we execute a single request at a time. Related to JavaScript blocks\
    \ communication is that it also runs on a single thread in the browser. Consider\
    \ a thread like a road, and there is only one road at any given time. When JavaScript\
    \ is traveling down that road, nothing else can happen. Any other request going\
    \ on will be blocked until the original is set and returns successfully. The single\
    \ threading problem in JavaScript has always been around, but only recently it\
    \ has become a larger issue. As we rely on JavaScript and Ajax to create more\
    \ responsive Web applications, the requests begin to collide and block responsiveness,\
    \ creating a clunky user experience.\n\nWeb workers alleviate that problem by\
    \ opening up a secondary thread in which you can pass data back and forth. Web\
    \ workers live in a separate JavaScript file, which is referred from the main\
    \ JavaScript file. Because of security concerns, workers do not have access to\
    \ the DOM; their sole purpose is to fetch and return data to the main file. Organizing\
    \ your script execution and data retrieval into a worker can improve your overall\
    \ user experience. Web workers open up new methods and a new event to provide\
    \ ways to pass information to a worker, cache, and send the processed data to\
    \ the main file. The new additions include\n\n+   - postMessage(data)\n\n+   -\
    \ message event"
