  md: "# Building a Plug-in\n\nMany times the first step to creating a plug-in is\
    \ writing it as a normal JavaScript function and later discovering that it might\
    \ be helpful to others or yourself as a plug-in. Converting a function into a\
    \ jQuery-plugin is pretty straightforward, but let's start off with the plug-in.\n\
    \nSuppose you find yourself in a situation where you are creating a lot of HTML\
    \ data tables that need to have a zebra striping effect, where every other table\
    \ row needs to have a background color of light gray.\n\nListing 10.4 shows a\
    \ function called zebraStripe() that takes two arguments, one is the wrapping\
    \ element (probably a table) and the other is the element you want to add the\
    \ striping effect to (probably the table). The function takes the arguments, finds\
    \ only the odd rows, and sets the background color to #ccc (light gray).\n\nListing\
    \ 10.4 Zebra Striping Function\n\n```\n// define your zebra striping function\n\
    function zebraStripe(wrapper, elStripe)n\n  $(wrapper).find(elStripe + ':odd').css({\n\
    \    'background': '#ccc'\n  });\n}\n\n// wait for the document to be ready\n\
    $(document).ready(function () {\n\n  var output = $('table');\n  tr = output.find('tr');\n\
    \n  // call the function with 2 required arguments\n  zebraStripe(output, tr);\n\
    }\n});\n```\n\nCalling the function in Listing 10.4 is like calling any function\
    \ in JavaScript and passing it the required arguments. This function will work\
    \ perfectly fine with jQuery, but the syntax is not quite there. When calling\
    \ the function, we are not using the normal jQuery selector syntax to attach it\
    \ to a DOM node. This is where we need to convert the normal JavaScript function\
    \ into a jQuery plug-in.\n\nThere is a distinct template for creating a plug-in\
    \ for jQuery, which includes the plug-in name, default options, options that the\
    \ user can overwrite, a loop, and the actual striping code from the zebraStripe()\
    \ function. Listing 10.4.1 shows the zebraStripe() function converted to a jQuery\
    \ plug-in."
  merge: -1
  pgno: 255
