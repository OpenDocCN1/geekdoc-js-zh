  md: "Inside the for you can see three statements. The first statement is setting\
    \ the counter variable (i) to its initial value of 0 (we start at 0). The second\
    \ statement is the condition in which you run the loop. As long as the “i” value\
    \ is less than the overall Count of items in the data, it should execute the code\
    \ contained inside the loop brackets { }. The last statement takes the “i” value\
    \ and adds 1 to each time the loop executes until it’s no longer than the overall.\
    \ In our case, this loop will execute 5 times because there are five people in\
    \ the address book.\n\nListing 6.5.2 will use the loop to iterate through the\
    \ address book saved to the JSON object, and then using the innerHTML DOM method,\
    \ output the result into the document <body> elements. The output, a main difference\
    \ to note in Listing 6.5.2 is we’re now running a check on the contactsCount variable\
    \ to make sure it’s greater than 0 before continuing onto the loop. This is a\
    \ general best practice to prevent unnecessary code from executing there will\
    \ be an error data.\n\n# Listing 6.5.2 A for Loop Iterating Address Book Data\n\
    \n```\n/ cache some initial variables *\nvar object = contacts.addressBook; //\
    \ save the data object\ncontactsCount = object.length; // how many items in the\
    \ JSON object? \"5\"\ntarget = document.getElementsByTagName(\"body\")[0]; //\
