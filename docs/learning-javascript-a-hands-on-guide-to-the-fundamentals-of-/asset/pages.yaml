  md: "After we are inside the Ajax call, you can access the Mustache object and the\
    \ to_html method, which takes two arguments. The first is the template variable\
    \ we previously stored, and the second is the JSON object (data) that was returned\
    \ through the Ajax call.\n\n# Listing 12.7.2  addr.getAllContacts Method Modified\
    \ to Use Mustache Templates\n\n```\n//wrap everything in an anonymous function\
    \ to contain the variables\nfunction() {\n\n    //define the DOM elements and\
    \ common variables you'll need\n    var getAllButton = document.getElementById(\"\
    get-all\");\n\n    // address book methods\n    var addr = {\n\n        getAllContacts\
    \ : function () {\n            // set the output element\n            var output\
    \ = document.getElementById(\"output\");\n            mustacheTemplate = document.getElementById(\"\
    mustache-template\");\n            template = mustacheTemplate.innerHTML;\n\n\
    \            // start Ajax call\n            ajaxCall(\"data/contacts.json\",\
    \ output, function (data) {\n                // render the mustache template by\
    \ combining the HTML with the JSON\n                var renderedContent = Mustache.to_html(template,\
    \ data);\n\n                // put the rendered template into the DOM\n      \
    \          output.innerHTML = renderedContent;\n            }); // end ajax call\n\
    \        }\n    }; // add addr object\n\n    // get all contacts when you click\
    \ the button\n    getAllButton.addEventListener(\"click\", addr.getAllContacts,\
    \ false);\n}\n}(); // end anonymous function\n```\n\nAfter using Mustache's to_html\
    \ method to convert the template into more usable HTML, it's inserted into the\
    \ DOM as usual, by using innerHTML and passing it the renderedContent object."
