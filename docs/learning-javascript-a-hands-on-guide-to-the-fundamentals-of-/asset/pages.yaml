  pgno: 103
- img_proc: true
  md: '# Variables 83


    Strings can be saved to variables with either single or double quotes; they both
    produce the same result, and it’s more a matter of personal preference. Because
    both quotes are commonly used inside saved strings, they will often break your
    JavaScript and need to be escaped. In Listing 5.3 you can see variables saved
    with single quotes, double quotes, and examples of escaping them where applicable.


    # Listing 5.3 Escaping Quotes in a String


    ```

    /* double quotes */

    var favoriteBreakfastSandwich = "Egg, Sausage and Cheese";


    /* single quotes */

    var favoriteLunchSandwich = ''Turkey Club'';


    /* double quotes escaped */

    var statementBreakfast = "I said, \It is important\, you know that.";


    /* single quotes escaped */

    var statementOnLunch = ''It\s good for your metabolism'';

    ```


    The rules for escaping is that if you use single quotes, you need to escape single
    quotes, and if you use double quotes, you need to escape double quotes in strings.
    Overall, pretty easy stuff right? If you choose one quoting method over the other,
    make sure it’s consistent throughout the JavaScript you’re writing.


    > Tip

    If you are saving HTML to strings a lot, single quotes save you some time because
    you won’t have to escape all the double-quoted attribute values in HTML.


    # Numbers


    Numbers are exactly what they sound like: they are number values saved to variables.
    The tricky part with numbers is that they can also be strings. For JavaScript
    to consider a variable number, it can be a quoted value; if quoted, JavaScript
    will treat it as a string, and it can be difficult to work with later.


    Numbers have math performed on them with JavaScript operators. All the basic math
    functions are available: addition, subtraction, multiplication, and division.
    It’s like having a calculator built right the JavaScript—very handy. In Listing
    5.4 you see examples of numbers saved to variables and some simple math. Numbers
    can be positive, negative, or even decimals. Note that none of the values are
    quoted, so you can add them together.'
