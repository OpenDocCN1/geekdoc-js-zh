  md: "The syntax of an event listener is a little different from a handler—most notably,\
    \ the lack of an equal sign and the fact that it looks more like a native method.\
    \ Let's crack one open and look at each part of an event listener. Listing 7.2\
    \ shows an example of an event listener using an anonymous function.\n\n# Listing\
    \ 7.2 Anatomy of an Event Listener\n\n```\n // event listener with an anonymous\
    \ function\nelement.addeventListener(\"event\", function(){\n\n    // you want\
    \ the function to do\n\n}, false);\n```\n\nAn event listener is made up of four\
    \ parts:\n\n+   - The DOM element (\"element\") in Listing 7.2\n- The event type\
    \ (\"event\") in Listing function in Listing 7.2\n- The eventlistener, aka the\
    \ function (anonymous function in Listing 7.2) (set to false in Listing 7.2)\n\
    - A Boolean value used to initiate something called \"capture\" (set to false\
    \ in Listing 7.2)\n\nOther than initiating capture, most arguments in the addEventListener()\
    \ method are pretty straightforward, so let's go over very briefly.\n\nYou will\
    \ be setting this capture option to false 99% of the time. Setting it to true\
    \ is like getting on a megaphone and announcing to all the parent DOM nodes that\
    \ an event is fixing on a particular node. Setting to false prevents this behavior\
    \ because, for the most part, it is unnecessary. It's often called \"event propagation.\\\
    \ There is a very detailed and confusing explanation in the W3C DOM specification,\
    \ as I'll say, 99% of the time you will set it to be false and move on.\n\nIn\
    \ Listing 7.2.1 you will see a real-world example of a basic event listener being\
    \ set on a button, which has an ID value of \"btn\". We're using the getElementById()\
    \ method to save it to a variable and add the event listener to it. The event\
    \ is defined as \"click,\" and we're executing an anonymous function to alert\
    \ a message and setting the capture to false.\n\n# Listing 7.2.1 Adding a Basic\
    \ Click Event Through a Listener\n\n* wrap it in an anonymous function to contain\
    \ the variables /*\n\n```\nfunction(){\n\n  * HTML: <button type=\"button\" id=\"\
    btn\">a button</button> /*\n\n  // save the button to a variable\n```"
