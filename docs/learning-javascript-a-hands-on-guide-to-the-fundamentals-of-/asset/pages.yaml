- img_proc: true
  md: '# The Markup (aka HTML)


    elements come with JavaScript hooks available in them, which we get into this
    chapter. For now, let''s go over some of the basics of HTML5 in the new elements
    you''re probably already running into.


    # Creating Better Semantics


    The goal of creating more meaningful content wrappers is a central goal of the
    W3C when the HTML5 specification was being put together. Creating meaningful layouts
    means that more standards can be created around. When compared to meaningless
    layout elements like the `<div>` (no offense), you can really see the benefit
    in replacing it with an `<article>`, or `<section>`; both have more semantic than
    a normal `<div>`.


    When you look at the new elements, it looks like they''re replacing our common
    `<div>` IDs; and in a way, it''s true. But they can be used more than once on
    a single page they behave more like classes and normal HTML elements that you
    can use over and to retain a semantic structure. Whether it''s a normal website,
    a blog post, or a full-featured application, you have the ability to embed more
    meaning into a document.


    Elements like `<header>` and `<footer>` are not meant to represent the top and
    bottom of the current document. They also represent the `<header>` and `<footer>`
    of each document section, the way we use `<head>` and `<tfoot>` in data tables.


    The benefits of using these structural elements is mainly due to the fact that
    they are extremely well defined and provide a great way to semantically structure
    your document. However, these elements need to be used with some careful thought
    because they can easily beused. Figure 11.1 shows how you might use the new HTML5
    elements to lay out a page.


    # Building More Accessible Content


    Some time before the HTML5 specification was released there was an accessibility
    specification called WAI-ARIA; for short, we call it ARIA. We went over some of
    the ARIA attributes in the chapter, having to do creating accessible Ajax content.
    There is much more to using AJAX purposes; you could also flag normal areas of
    a document to give meaning beyond the semantic elements.


    Let''s look at the `<header>`, for example. A `<header>` is obviously descriptive
    than a `<div>`, but because it is used multiple times in a single document (an
    element you can only use once of much), the meaning could change theory, depending
    on the context. At the very top of a document, the `<header>` may serve as an
    area reserved for branding information or a banner, whereas another `<header>`
    is inside an `<article>` or `<section>` element could very well acting as a header
    for individual section of the document, not the entire document. The same situation
    could be applied to any element, but you will likely see it a lot with the `<header>`
    and `<footer>` elements. These elements by themselves are meaningful, but with
    ARIA attributes, you can add even more meaning.'
