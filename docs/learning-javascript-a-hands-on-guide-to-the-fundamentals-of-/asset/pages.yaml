    # User Experience


    I know it might feel like I''m drilling this point into your head hard, but that
    should show how important it is. Failing quickly, scope, looping performance,
    caching variables, using objects and methods—every one of these things can be
    traced back to our goal of creating a good user experience.


    When you''re going through your application making structural and style decisions
    about how to handle various pieces of your JavaScript, keeping user experience
    in mind will guide your process. When we talk about user experience, we often
    focus on the end user of an application. But in reality, an aspect of user experience
    more referred to as “maintainability” is equally important when developing an
    application. Maintainability is usability for people on your team or anyone who
    might be updating your code. It''s not uncommon for maintainability to be sacrificed
    in favor of end usability. That''s where the main focus should be, as you go through
    the development process, you will have to balance maintainability with performance
    and end-user usability.


    If you hit a tough crossroads, it sometimes helps to ask, “What will be best for
    the end user?” and “How much will that affect our ability to maintain this code
    base moving forward?” If you answer those two questions, you''ll be on your way
    to creating the best possible experience not only for your users, but for the
    other members on your own team.


    # Code Design


    The concept of designing code is a touch area with a lot of developers. Very often,
    especially with seasoned developers, people fall into a natural style of coding
    that they have used for years. For this reason, implementing a style guide for
    code can be a difficult task. Your styles flow naturally with the overall process
    so they don''t turn into something developers begrudgingly adhere to, fighting
    tooth and nail. Rule styles are generally put into place when you''re working
    on a team or sharing code publicly to minimize confusing points on style alone.
    You''re always going to hit spots while reading code where there is a natural
    confusion, but you can make sure points don''t live at a stylistic level that
    encompasses elements like file naming, directory structure, indentation, and inline
    whitespace.


    Front-end style guides are often taken too far, so it''s important not to get
    so specific as to hamper creative freedom and implementing new practices. You
    hire people on a team of their talent level, and to a certain extent you need
    to trust those people and their skills without holding them back with policy,
    red tape, and overly aggressive standardization.'
