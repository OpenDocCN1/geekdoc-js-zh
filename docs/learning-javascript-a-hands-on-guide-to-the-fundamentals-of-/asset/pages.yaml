  md: "In Chapter 2, \"JavaScript,\" when we mentioned browser performance we spoke\n\
    of the HTTP request. A key aspect of creating a high-performance Web application\
    \ is to cut\nout the HTTP requests as much as possible. In Listing 9.3 you probably\
    \ noticed that we're\nstarting to pull up the HTTP requests with the external\
    \ library and plug-ins. This can be a\nproblem. The solution is not to stop using\
    \ external libraries; some of the libraries are already\namazing (we'll get to\
    \ that) cut down on your headaches of cross-browser compat-\nbility great deal.\
    \ To cut down on HTTP requests, we do something called concatenation of the files.\
    \ Concatenation needs to be run on the server, but what happens is that a server-side\n\
    script will look through all your JavaScript files, pull out the contents, and\
    \ dump them all into a single file. Whitespace is also irrelevant in JavaScript,\
    \ the only thing that matters\nis that the files are being combined in the correct\
    \ order. It's best to have something running on the\nserver that can do this for\
    \ you, but you could do it by hand as well. However, it's\nreally hard to maintain,\
    \ so I recommend automating the process if you can. Either way, the\ngoal of using\
    \ all your JavaScript you while cutting down on the HTTP requests can be met.\n\
    \nListing 9.3.1 shows that the bottom of the HTML document in Listing 9.3 would\
    \ look like\nafter the script has been concatenated, using only a single HTTP\
    \ request to accomplish the goal.\n\n# Listing 9.3.1 HTML with Concatenated Script\n\
    \n```\n<!-- JavaScript -->\n<script arc=\"js/application-combined.js\"></script>\n\
    \n<body>\n</html>\n```\n\n# Variable Declarations\n\nGood and consistent variable\
    \ declarations and grouping can make working in someone else's\n a very pleasant\
    \ experience. In contrast, poor declaration patterns can make it an absolute\n\
    nightmare.\n\nWhen declaring variables, you can follow a few simple rules:\n\n\
    +   * Group all variables at the top of the containing function.\n* Use clear\
    \ and descriptive comments.\n* Use a consistent grouping pattern.\n\nGrouping\
    \ patterns in variable declarations describe how they are arranged in your code.\n\
    Because all your local variables begin with var and will be grouped together,\
    \ you can drop\nt var and separate them with commas. This is the pattern all the\
    \ code samples so far in this\nbook have followed. Listing 9.4 shows a variable\
    \ definition block as a comma-separated list."
