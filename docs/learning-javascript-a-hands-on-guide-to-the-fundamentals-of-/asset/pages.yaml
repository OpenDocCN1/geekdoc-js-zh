  md: '# Listing 2.1 A Basic HTML Document with HTTP Requests Bolded


    ```

    <!doctype html>

    <html>

    <head>

    <title>HTTP Request Example</title>

    <meta charset="utf-8">

    <!-- 1 HTTP request for the favicon -->

    <link rel="shortcut icon" href="images/favicon.ico">

    n<!-- 1 HTTP request per CSS file (2 total) -->

    <link rel="stylesheet" href="css/style.css" media="screen">

    <link rel="stylesheet" href="css/print.css" media="print">

    </head>

    <body>

    <!-- 1 HTTP request per image file (4 total) -->

    <img src="picture-of-allie.gif" alt="placeholder content">

    <img src="images/patricks-mug.gif" alt="placeholder content">

    <img src="images/clay.gif" alt="placeholder content">

    <img src="images/lin-in-a-chair.gif" alt="placeholder content">

    <!-- 1 HTTP request per JavaScript file (2 total) -->

