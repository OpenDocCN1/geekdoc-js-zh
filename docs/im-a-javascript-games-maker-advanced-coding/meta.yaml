  md: "# STEP 8 – MOVE THINGS\n\n⇒ All three rocks need to move when the timer calls\
    \ the **moveThings** function. We could do this by writing a section of code to\
    \ move **rock1**, another to move **rock2** and a final section to move **rock3**.\
    \ But this would require a lot of code and would mean we would need to change\
    \ each section if we wanted to make the rocks faster or slower. Instead, we will\
    \ use a loop to move each of the rocks in turn and check if it has hit the spaceship.\
    \ Our loop will count from 1 to 3. The first time it will move **rock1**, then\
    \ **rock2** and then **rock3**. To do this, we need to write a general bit of\
    \ code that will move an imaginary rock, called **rock n**. We can give **n**\
    \ a value between 1 and 3. This will be written as \"rock\"+n.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_22_0.png)\n\
    \n⇒ Finally, we need to move the spaceship up or down. To make the game harder,\
    \ the spaceship won't keep still.\n\n```\nfunction moveThings(){\n    for(var\
    \ n=1; n<=3; n++){\n        var x=getLeft(\"rock\"+n);\n        if(x<-100){\n\
    \            x=window.innerWidth;\n            y=randomNumber(0,window.innerHeight-100);\n\
    \            setTop(\"rock\"+n,y);\n            score=score+10;\n            document.getElementById(\"\
    scoreTB\").innerText=\"Score: \"+score;\n        }\n        setLeft(\"rock\"+n,x-speed-n);\n\
    \        if(isOverlapping(\"rock\"+n,\"ship\")){\n            gameOver();\n  \
    \      }\n    }\n    var y=getTop(\"ship\");\n    if((y<=0) || (y>window.innerHeight-100)){yChange=-yChange;}\n\
    \    setTop(\"ship\",y+yChange);\n}\n```"
