    # 流畅动画


    我们将为图像添加一个过渡属性，使其平滑移动。这意味着图像的样式属性（即其与屏幕左侧或顶部的距离）将在特定时间内逐渐改变。


    所有样式属性都将受到影响。


    ```

    -webkit-transition: all 0.5s;

    ```


    这些改变将在0.5秒（半秒）内逐步完成。


    # 第三步 – 开始新文件


