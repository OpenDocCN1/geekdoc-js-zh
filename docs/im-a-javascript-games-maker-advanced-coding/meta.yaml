- md: "## SUBMARINE EXPLORER\n\nThis game involves the player guiding a submarine\
    \ around the screen, trying to catch treasure that has fallen overboard from a\
    \ shipwreck. It uses a different moving system that is often used in things like\
    \ driving games and side flying games to steer and move at an angle. Some complex\
    \ maths is used to handle the angles. The game also includes basic sound effects.\
    \ The complete code for the game is listed on page 29.\n\n### STEP 1 - PLANNING\n\
    \nThe score is shown in an HTML paragraph element `<p>`.\n\nA timer will move\
    \ the coin and the submarine.\n\nEvery time the sub moves we need to check if\
    \ it has grabbed a coin. This is done by using a function to test for overlapping.\n\
    \nIf a coin has been caught then a sound effect will play.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_25_0.png)\n\
    \nVariables count the score, the speed of the submarine, the angle it's travelling\
    \ at and its co-ordinates.\n\nIf a coin falls to the bottom of the screen, the\
    \ game is over.\n\nPressing the up and down arrow keys will change the angle of\
    \ the sub, steering it around the screen.\n\nClick OK to play again or cancel.\n\
    \n### STEP 2 - FIND SOME PICTURES\n\n- Find an image of a submarine to use. It\
    \ needs to be saved into the same folder as your HTML file.\n- Search the internet\
    \ for submarine clipart.\n- Right-click one image.\n- Click **Save Image As...**\n\
    - Navigate to your **Documents** folder then click **Save**.\n- Now repeat this\
    \ step but search for **coin clipart** to use.\n\n### STEP 3 - SOUND FILE\n\n\
    We need a sound effect to play when the sub grabs a coin. You may already have\
    \ some on your computer. If not, search online for a sound file to download and\
    \ use.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_26_0.png)\n\nEvery website\
    \ shown in your results will be different. Try to find one that will let you download\
    \ mp3 files.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_26_1.png)\n\n### STEP\
    \ 4 - START A NEW FILE\n\nStart by typing in the HTML for the game. Add code for\
    \ the body, both images and a paragraph for the score.\n\n```\n<html>\n<body style=\"\
    background-color:#2980b9\">\n    <img id=\"sub\" style=\"position:absolute; top:500px;\
    \ width:100px;\"\n         src=\"sub.png\">\n    <img id=\"coin\" style=\"position:absolute;\
    \ left:300px; width: 50px;\"\n         src=\"coin.png\">\n    <p id=\"scoreTB\"\
    \ style=\"position:absolute; color:white; font-size:\n         20px; font-family:Arial\"\
    >Score: 0</p>\n</body>\n```\n\nSet the background colour.\nMake sure the src property\
    \ matches the name of the downloaded file for the submarine.\nMake sure the src\
    \ property matches the downloaded file for the coin.\nAdd the score paragraph.\n\
    \n### STEP 5 - SAVE YOUR CODE\n\nClick **File > Save** and type **sub.html** as\
    \ the filename.\nMake sure you save it in your **Documents** folder. Keep saving\
    \ it every time you add some new code.\n\n### STEP 6 - BEGIN THE SCRIPT\n\nAt\
    \ the start of the script we need to:\n\n- create the variables we need\n- tell\
    \ the program which function to run when keys are pressed\n- start the **gameTimer**\
    \ and tell it to call the **moveThings** function every 20 milliseconds\n- define\
    \ some functions to get and set co-ordinates, and make random numbers.\n\n```\n\
    <script>\nvar score=0, angle=0, speed=4, subX=0, subY=500, gameTimer;\nonkeydown=handleKeys;\n\
    gameTimer=window.setInterval(moveThings,20);\nfunction setLeft(id,x){document.getElementById(id).style.left=x+\"\
    px\";}\nfunction setTop(id,y){document.getElementById(id).style.top=y+\"px\";}\n\
    function getLeft(id){return document.getElementById(id).offsetLeft;}\nfunction\
    \ getTop(id){return document.getElementById(id).offsetTop;}\nfunction randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}\n\
    ```\n\n### STEP 7 - OVERLAPPING TEST CODE\n\nWe will use the function used on\
    \ page 20 to test if objects called **ob1** and **ob2** are overlapping.\n\n```\n\
    function isOverlapping(ob1, ob2){\nreturn ((getLeft(ob1)+50>getLeft(ob2)) && (getLeft(ob1)<getLeft(ob2)+50)\
    \ &&\n(getTop(ob1)+50>getTop(ob2)) && (getTop(ob1)<getTop(ob2)+50));}\n```\n\n\
    We need to make some adjustments from the Rock Storm game. This time, one of the\
    \ objects is much smaller so we need to change the 100 to 50.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_27_0.png)\n\
    \n![](img/c5282b3810f6766d06b115517f6f4aac_27_1.png)\n\n### MOVING AT AN ANGLE\n\
    \nWhen we are coding in JavaScript, it is quite simple to move an object left\
    \ and right or up and down. All we need to do is make sure it has its position\
    \ property set to **absolute**, then change the left (x co-ordinates) and top\
    \ (y co-ordinates) style values. To make it move at an angle, we need to use some\
    \ more complex maths. Don't worry if you don't understand it all, but try to work\
    \ out which parts of the following lines of code make it move so you can adapt\
    \ it to use in other games you make.\n\nIf the submarine is travelling down at\
    \ 30 degrees, then its motion can be broken down into how much it moves down and\
    \ how much it moves to the right.\n\n![](img/c5282b3810f6766d06b115517f6f4aac_28_0.png)\n\
    \nBy using the maths functions **sine** and **cosine** we can turn movement at\
    \ an angle into a combination of horizontal and vertical movements. In JavaScript,\
    \ we type these as **Math.sin** and **Math.cos**:\n\nChange **subX** by **speed**\
    \ multiplied by the cosine of the sub's angle.\n\n```\nsubX=subX+speed*Math.cos(Math.PI*angle/180);\n\
    subY=subY+speed*Math.sin(Math.PI*angle/180);\n```\n\nChange **subY** by **speed**\
    \ multiplied by the sine of the sub's angle.\n\n### STEP 8 – MOVE THINGS\n\nEach\
    \ time the timer calls the function, we need to move the submarine and the coin.\
    \ This function also calls another function **checkHit**, which tests to see if\
    \ the sub has grabbed a coin. Finally, we check to see if the coin has got all\
    \ the way to the bottom of the sea.\n\n```\nfunction moveThings(){\n  subX=subX+speed*Math.cos(Math.PI*angle/180);\n\
    \  subY=subY+speed*Math.sin(Math.PI*angle/180);\n  if(subX<-100){subX=innerWidth;}\n\
    \  if(subX>innerWidth){subX=-100;}\n  if(subY<-100){subY=innerHeight;}\n  if(subY>innerHeight){subY=-100;}\n\
    \  setLeft(\"sub\",subX);\n  setTop(\"sub\",subY);\n  y=getTop(\"coin\");\n  setTop(\"\
    coin\", y+1+score*0.1);\n  checkHit();\n  if(y>window.innerHeight){gameOver();}\n\
    }\n```\n\nChange the variables subX and subY according to the sub's angle.\nIf\
    \ the sub has gone past the left edge of the screen, move it to the right.\nIf\
    \ it has gone too far right, move it all the way to the left hand side.\nMove\
    \ it to the bottom if it has gone too high.\nMove it to the top if it has gone\
    \ too low.\n\nWe need to move the submarine now we have worked out its new co-ordinates.\n\
    Find out where the coin is and store it in the variable y.\nMove the coin down,\
    \ getting faster as the score increases.\nCall the function that will check if\
    \ they have collided.\nAdd the code to end the game if the coin has gone past\
    \ the bottom edge of the screen.\n\n### STEP 9 – DIRECT HIT?\n\nThis function\
    \ checks to see if the sub has grabbed a coin, by testing to see if they are overlapping.\
    \ If they are, the score goes up, the coin moves back to the top and a sound effect\
    \ is played.\n\n```\nfunction checkHit(){\n  if(isOverlapping(\"sub\", \"coin\"\
    )){\n    score++;\n    document.getElementById(\"scoreTB\").innerHTML=\"Score:\
    \ \"+score;\n    setTop(\"coin\",0);\n    setLeft(\"coin\",randomNumber(0,innerWidth-100));\n\
    \    new Audio(\"beep.mp3\").play();\n  }\n}\n```\n\nTest to see if the submarine\
    \ is overlapping the coin. If it is, run the following code:\n\nIncrease the score\
    \ by 1.\n\nMove the coin back to the top of the screen.\n\nSet a new random left\
    \ position for the coin.\n\nPlay the sound effect. Make sure the filename you\
    \ type between the quotes matches the mp3 file you downloaded in step 3.\n\nEnd\
    \ the IF statement.\n\n### CUSTOMISE\n\n- Use more than one coin by thinking about\
    \ how the rock storm game works on pages 18 to 23.\n- Make a new game where you\
    \ drive a car around using similar code.\n\n### STEP 10 – STEER THE SUB\n\nType\
    \ in the function below to handle the key press event. It changes the angle variable\
    \ and also rotates the image.\n\n```\nfunction handleKeys(e){\n  if(e.keyCode==38){angle=angle-10;}\n\
    \  if(e.keyCode==40){angle=angle+10;}\n  document.getElementById(\"sub\").style.webkitTransform\
    \ = 'rotate('+angle+'deg)';\n}\n```\n\nReduce the angle variable by 10 degrees,\
    \ if the code for the **up** arrow key has been sent.\n\nIncrease the angle variable\
    \ by 10 degrees, if the code for the **down** arrow key has been sent.\n\nChange\
    \ the angle the image is shown at, to match the angle variable.\n\n### STEP 11\
    \ – GAME OVER\n\nIf one of the coins gets to the bottom of the sea, the following\
    \ function will need to run:\n\n```\nfunction gameOver(){\n  clearInterval(gameTimer);\n\
    \  if(confirm(\"Game Over - Click OK to play again.\")==true){\n    location.reload();\n\
    \  }\n}\n</script>\n</html>\n```\n\nStop the timer running to stop the objects\
    \ moving.\n\nShow a message asking the player if they want to play again? If they\
    \ click OK, run the next line.\n\nReload the page and make the game start again.\n\
    \nEnd the IF statement.\n\nEnd the function.\n\nEnd the script.\n\nEnd the HTML.\n\
    \nSave your file, reload the browser, then play!"
  mdcn: "\n## 潜艇探险家\n\n本游戏涉及玩家在屏幕上引导一艘潜艇，试图抓住从沉船上掉落的宝藏。它使用了一种不同的移动系统，该系统常用于驾驶游戏和侧向飞行游戏中，以便以一定角度操控和移动。游戏使用了一些复杂的数学计算来处理角度问题。游戏还包含基本音效。游戏的完整代码列在第29页。\n\
    \n### 步骤 1 - 规划\n\n分数显示在HTML段落元素 `<p>` 中。\n\n计时器将移动金币和潜艇。\n\n每次潜艇移动时，我们需要检查它是否抓住了金币。这是通过使用一个测试重叠的函数来完成的。\n\
    \n如果金币被抓住，将播放音效。\n\n![](img/c5282b3810f6766d06b115517f6f4aac_25_0.png)\n\n变量用于计算分数、潜艇的速度、其行进角度及其坐标。\n\
    \n如果金币掉落到屏幕底部，游戏结束。\n\n按下上、下箭头键将改变潜艇的角度，在屏幕上进行操控。\n\n单击确定再次游玩或取消。\n\n### 步骤 2\
    \ - 寻找一些图片\n\n-   找到一张潜艇的图片使用。它需要保存到与HTML文件相同的文件夹中。\n-   在互联网上搜索潜艇剪贴画。\n-   右键单击一张图片。\n\
    -   单击 **将图像另存为...**\n-   导航到你的 **文档** 文件夹，然后单击 **保存**。\n-   现在重复此步骤，但搜索 **金币剪贴画**\
    \ 使用。\n\n### 步骤 3 - 声音文件\n\n我们需要一个音效在潜艇抓住金币时播放。你的计算机上可能已有一些。如果没有，在网上搜索要下载使用的声音文件。\n\
    \n![](img/c5282b3810f6766d06b115517f6f4aac_26_0.png)\n\n搜索结果中显示的每个网站都会不同。尝试找到一个允许你下载mp3文件的网站。\n\
    \n![](img/c5282b3810f6766d06b115517f6f4aac_26_1.png)\n\n### 步骤 4 - 开始一个新文件\n\n\
    首先输入游戏的HTML代码。为`body`、两张图片和一个分数段落添加代码。\n\n```\n<html>\n<body style=\"background-color:#2980b9\"\
    >\n    <img id=\"sub\" style=\"position:absolute; top:500px; width:100px;\"\n\
    \         src=\"sub.png\">\n    <img id=\"coin\" style=\"position:absolute; left:300px;\
    \ width: 50px;\"\n         src=\"coin.png\">\n    <p id=\"scoreTB\" style=\"position:absolute;\
    \ color:white; font-size:\n         20px; font-family:Arial\">Score: 0</p>\n</body>\n\
    ```\n\n设置背景颜色。\n确保 `src` 属性与下载的潜艇文件名匹配。\n确保 `src` 属性与下载的金币文件名匹配。\n添加分数段落。\n\n\
    ### 步骤 5 - 保存你的代码\n\n单击 **文件 > 保存** 并输入 **sub.html** 作为文件名。\n确保你将其保存在 **文档** 文件夹中。每次添加新代码时都要保存它。\n\
    \n### 步骤 6 - 开始脚本\n\n在脚本的开头，我们需要：\n\n-   创建所需的变量\n-   告诉程序当按键按下时运行哪个函数\n-   启动\
    \ **gameTimer** 并告诉它每20毫秒调用 **moveThings** 函数\n-   定义一些函数来获取和设置坐标，以及生成随机数。\n\n\
    ```\n<script>\nvar score=0, angle=0, speed=4, subX=0, subY=500, gameTimer;\nonkeydown=handleKeys;\n\
    gameTimer=window.setInterval(moveThings,20);\nfunction setLeft(id,x){document.getElementById(id).style.left=x+\"\
    px\";}\nfunction setTop(id,y){document.getElementById(id).style.top=y+\"px\";}\n\
    function getLeft(id){return document.getElementById(id).offsetLeft;}\nfunction\
    \ getTop(id){return document.getElementById(id).offsetTop;}\nfunction randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}\n\
    ```\n\n### 步骤 7 - 重叠测试代码\n\n我们将使用第20页用过的函数来测试名为 **ob1** 和 **ob2** 的对象是否重叠。\n\n\
    ```\nfunction isOverlapping(ob1, ob2){\nreturn ((getLeft(ob1)+50>getLeft(ob2))\
    \ && (getLeft(ob1)<getLeft(ob2)+50) &&\n(getTop(ob1)+50>getTop(ob2)) && (getTop(ob1)<getTop(ob2)+50));}\n\
    ```\n\n我们需要对Rock Storm游戏进行一些调整。这一次，其中一个对象要小得多，所以我们需要将100改为50。\n\n![](img/c5282b3810f6766d06b115517f6f4aac_27_0.png)\n\
    \n![](img/c5282b3810f6766d06b115517f6f4aac_27_1.png)\n\n### 以一定角度移动\n\n当我们用JavaScript编码时，让对象左右或上下移动相当简单。我们只需确保其\
    \ `position` 属性设置为 **absolute**，然后更改 `left`（x坐标）和 `top`（y坐标）样式值。要使其以一定角度移动，我们需要使用一些更复杂的数学知识。如果你不完全理解，不要担心，但试着找出以下代码行中哪些部分使其移动，这样你就可以将其应用到你制作的其他游戏中。\n\
    \n如果潜艇以30度角向下移动，那么它的运动可以分解为向下移动多少和向右移动多少。\n\n![](img/c5282b3810f6766d06b115517f6f4aac_28_0.png)\n\
    \n通过使用数学函数 **正弦** 和 **余弦**，我们可以将角度移动转换为水平和垂直移动的组合。在JavaScript中，我们将其输入为 **Math.sin**\
    \ 和 **Math.cos**：\n\n通过 **速度** 乘以潜艇角度的余弦值来改变 **subX**。\n\n```\nsubX=subX+speed*Math.cos(Math.PI*angle/180);\n\
    subY=subY+speed*Math.sin(Math.PI*angle/180);\n```\n\n通过 **速度** 乘以潜艇角度的正弦值来改变 **subY**。\n\
    \n### 步骤 8 – 移动物体\n\n每次计时器调用函数时，我们需要移动潜艇和金币。该函数还调用另一个函数 **checkHit**，用于测试潜艇是否抓住了金币。最后，我们检查金币是否已经一路掉到海底。\n\
    \n```\nfunction moveThings(){\n  subX=subX+speed*Math.cos(Math.PI*angle/180);\n\
    \  subY=subY+speed*Math.sin(Math.PI*angle/180);\n  if(subX<-100){subX=innerWidth;}\n\
    \  if(subX>innerWidth){subX=-100;}\n  if(subY<-100){subY=innerHeight;}\n  if(subY>innerHeight){subY=-100;}\n\
    \  setLeft(\"sub\",subX);\n  setTop(\"sub\",subY);\n  y=getTop(\"coin\");\n  setTop(\"\
    coin\", y+1+score*0.1);\n  checkHit();\n  if(y>window.innerHeight){gameOver();}\n\
    }\n```\n\n根据潜艇的角度更改变量subX和subY。\n如果潜艇已经过了屏幕左边缘，将其移到右边。\n如果它已经太靠右，将其全部移到左侧。\n如果它已经太高，将其移到底部。\n\
    如果它已经太低，将其移到顶部。\n\n现在我们已经计算出新的坐标，需要移动潜艇。\n找出金币的位置并将其存储在变量y中。\n将金币向下移动，随着分数增加移动速度加快。\n\
    调用将检查它们是否碰撞的函数。\n如果金币已经过了屏幕底部边缘，则添加结束游戏的代码。\n\n### 步骤 9 – 正中目标？\n\n此函数通过测试它们是否重叠来检查潜艇是否抓住了金币。如果重叠，分数增加，金币移回顶部，并播放音效。\n\
    \n```\nfunction checkHit(){\n  if(isOverlapping(\"sub\", \"coin\")){\n    score++;\n\
