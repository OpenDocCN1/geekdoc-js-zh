    \ value in the **mazeData** item the player is going to move into. If it is 0\
    \ then the player will be allowed to move. If it is 1 then the player would hit\
    \ a wall, so the player cannot move.\n\n```\n39 function handleKeys(e){\n40  \
    \   if((e.keyCode==37)&&mazeData[py][px-1]==0){px--;}\n41     if((e.keyCode==39)&&mazeData[py][px+1]==0){px++;}\n\
