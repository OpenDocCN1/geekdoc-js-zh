- md: "I'M A JAVASCRIPT GAMES MAKER:\n\n{ BUILD 4 PROGRAMS }\n\n## ADVANCED CODING\n\
    \nJ794.8152\n\nLAWYER COMMUNITY\nDO NOT DISTURB\n\n## I’M A JAVASCRIPT GAMES MAKER:\
    \ ADVANCED CODING\n\nMax Wainewright\n\nWAYLAND\nwww.waylandbooks.co.uk\n\nFALKIRK\
    \ COMMUNITY TRUST LIBRARIES\n\n| | |\n|---|---|\n| Falkirk Community Trust | |\n\
    | 30124 03121698 1 | |\n| Askews & Holts | |\n| J794.8152 | £8.99 |\n| MK | |\n\
    \nFOR HELP GO TO: www.maxw.com\n\n## CONTENTS\n\n- INTRODUCTION ......................................\
    \ 5\n- GETTING STARTED .............................. 4\n- UFO POWER UP .................................\
    \ 6\n- GHOST MAZE .................................... 12\n- ROCK STORM ....................................\
    \ 18\n- SUBMARINE EXPLORER ................... 24\n- GLOSSARY .........................................\
    \ 30\n- COMMAND LIST ................................. 31\n- INDEX ...............................................\
    \ 32\n\nRESPECTING COPYRIGHT\n\nCopyright means the legal ownership of something.\
    \ You need to think about who owns the images or sound files you are linking to\
    \ or downloading to your web pages. There shouldn't be any major issues unless\
    \ you try to make a page available to the public. Do check with an adult to make\
    \ sure.\n\nAn alternative is to find a free to use image or sound file: search\
    \ for an image or sound, then look for the Settings button on the website results\
    \ page. Click Advanced Search then look for Usage Rights. On this menu choose\
    \ Free to use, share or modify.\n\n## INTRODUCTION\n\nThis book will show you\
    \ how to code exciting new games using JavaScript. JavaScript is used to make\
    \ web pages more interactive. It can also be used to create online games that\
    \ will run on both desktops and mobile devices. By the end of this book, you will\
    \ have learnt loads of great techniques to make you the ultimate JavaScript expert.\n\
    \nYou could use a plain **text editor** to create your code.\n\n```\nmygame.html\n\
    <script>\nalert('Press any key to start')\n</script>\n```\n\nThis will work fine\
    \ but can be quite fiddly, as the software won't give you any help.\n\nThe best\
    \ thing to use for the activities in this book is an offline HTML text editor.\
    \ This will support you as you type your code, but also give you the opportunity\
    \ to learn actual JavaScript code.\n\nThere are two separate windows that you'll\
    \ be using. Arrange them so you can see them both at the same time.\n\nThere are\
    \ many different web browsers you can use. We recommend using Google Chrome for\
    \ the activities in this book. Make sure you have the latest version installed\
    \ on your computer before you start.\n\nYou will learn some HTML, as well as JavaScript,\
    \ in this book. HTML is the language used to build web pages. JavaScript is the\
    \ language that brings those pages to life!\n\nIf you would like to learn more\
    \ about how HTML works, or if you need a beginner's guide to JavaScript, then\
    \ try reading some of the other books in the *Generation Code* series. But, if\
    \ you haven't used HTML or JavaScript before, you'll still be able to create all\
    \ the games in this book.\n\nSo what are you waiting for? Get coding!\n\n## GETTING\
    \ STARTED\n\nYou need a text editor to start coding in JavaScript. There will\
    \ probably be a simple text editor already on your computer, called Notepad (if\
    \ you have Windows), or TextEdit (on a Mac). This will be sufficient for you to\
    \ get started, but it will be much easier to create JavaScript if you download\
    \ a more powerful text editor. In this book, we will use a text editor called\
    \ Sublime Text. There are many others you could download, such as Brackets or\
    \ Notepad++ – all of these are free for you to try out.\n\n### STEP 1 – FIND THE\
    \ SUBLIME TEXT WEBSITE\n\n- Open your web browser and visit www.sublimetext.com\n\
    \n### STEP 2 – START DOWNLOADING\n\n- Click the Download button near the top of\
    \ the web page.\n- Choose which version of Sublime Text you need. If you are not\
    \ sure, then ask an adult to help you find the correct version: click the Apple\
    \ menu, then About if you are using a Mac. On a PC, click the Start menu, select\
    \ System, and click About.\n- Wait for the download to complete.\n\n### STEP 3\
    \ – INSTALL THE SOFTWARE\n\n- Some web browsers will then ask you to run the installation\
    \ program. Choose Run.\n- If this does not happen, don’t panic. The installer\
    \ file should have been downloaded to your computer. Look in your Downloads folder\
    \ for it. Double-click it to start installing your new text editor. You should\
    \ get a big white or grey box giving you instructions on what to do next. Follow\
    \ these instructions to complete the installation.\n\n### STEP 4 – RUNNING SUBLIME\
    \ TEXT\n\n- **On a PC:**\n  - ➞ Click **Start** > **Programs** > **Sublime Text**.\
    \ Or just click **Sublime Text** if it appears in the **Recently added** section.\n\
    \n- **On a Mac:**\n  - ➞ Click **Finder**.\n  - ➞ Click **Applications**.\n  -\
    \ ➞ Make a shortcut by dragging **Sublime Text** from **Finder** on to your dock\
    \ at the bottom of the **Desktop**.\n  - ➞ Click the **Sublime Text** icon.\n\n\
    ### STEP 5 – START CODING!\n\n➜ Carefully type this code into lines 1, 2 and 3\
    \ of your text editor.\n\n```\n1 <script>\n2     alert(\"Start Coding!\")\n3 </script>\n\
    ```\n\n- Mark the start of a JavaScript section.\n- Show a message box saying\
    \ 'Start Coding!'.\n- Mark the end of the JavaScript section.\n\n### STEP 6 –\
    \ SAVE YOUR CODE\n\n- ➞ Click **File** > **Save**.\n- ➞ Save to your **Documents**\
    \ folder.\n- ➞ Type **start.html** as the filename.\n\n### JAVASCRIPT NEEDS HTML\n\
    \nAlthough we are coding with JavaScript, we need to put our file inside some\
    \ HTML code to make it work. HTML stands for HyperText Markup Language and is\
    \ the language used to build web pages.\n\nHTML is used to describe what objects,\
    \ or elements, are shown on a web page. If you are creating a simple game, you\
    \ need to use HTML to add an image and some text to show the score. JavaScript\
    \ is added to tell the image to move around when different keys are pressed, or\
    \ the mouse is clicked. It can also be used to display the score and make it change.\n\
    \nWe need to use both HTML and JavaScript to make a more interesting game. JavaScript\
    \ was designed to be added to HTML pages to make them more interactive.\n\nYou\
    \ will use a range of HTML elements in this book. Each element uses tags to show\
    \ what type of element it is (see page 31). Tags are enclosed with < > angle brackets.\n\
    \n### STEP 7 – VIEW YOUR PAGE\n\n- ➞ Open your **Documents** folder.\n- ➞ Find\
    \ the **start.html** file and double-click it.\n- ➞ Your web page should now load\
    \ in your normal web browser.\n- ➞ You should get a message saying **Start Coding!**\n\
    \n## UFO POWER UP\n\nIn this game, the player has to move an alien spaceship (a\
    \ UFO) as quickly as possible to get more energy. The player moves the UFO by\
    \ pressing the arrow keys on the keyboard. The symbol for an atom (in green below)\
    \ is used to represent the energy source. After the player has completed the task\
    \ five times, the game stops and the time taken is shown. You can play the game\
    \ against your friends and see who can complete it in the fastest time! The complete\
    \ code for the game is listed on page 11.\n\n### STEP 1 – PLANNING\n\nThe score\
    \ is shown in an HTML paragraph element.\n\nA timer will count how long it takes\
    \ to collect five atoms.\n\nEvery time the UFO moves, we need to check if it has\
    \ reached the atom. This is done by comparing their co-ordinates.\n\nVariables\
    \ count the score, how long the game has been running and the co-ordinates of\
    \ the atom and the UFO.\n\nWhen five atoms have been collected, the game ends\
    \ and the time taken is shown.\n\nWe will only need one atom image. Each time\
    \ it has been collected by the UFO, we will move it to a new random place and\
    \ increase the score by 1.\n\nPressing the arrow keys will change the **ufoX**\
    \ and **ufoY** co-ordinates, making the UFO move around the screen.\n\nClick **OK**\
    \ to play again.\n\n### STEP 2 – FIND SOME PICTURES\n\n- Find an image of an atom\
    \ to use, or find another symbol to represent energy in your game. It needs to\
    \ be saved into the same folder as your HTML file.\n- Search for atom clipart\
    \ to use.\n- Right-click one image.\n- Click Save Image As...\n- Navigate to your\
    \ Documents folder then click Save.\n- Now repeat this step but search for ufo\
    \ clipart to use."
  mdcn: "\n我是JavaScript游戏制作人：\n\n{ 编写4个程序 }\n\n## 高级编程\n\nJ794.8152\n\n律师社区\n请勿打扰\n\
    \n## 我是JavaScript游戏制作人：高级编程\n\nMax Wainewright\n\nWAYLAND\nwww.waylandbooks.co.uk\n\
    \n法尔柯克社区信托图书馆\n\n| | |\n|---|---|\n| 法尔柯克社区信托 | |\n| 30124 03121698 1 | |\n| Askews\
    \ & Holts | |\n| J794.8152 | £8.99 |\n| MK | |\n\n如需帮助请访问：www.maxw.com\n\n## 目录\n\
    \n- 简介 ...................................... 5\n- 入门准备 ..............................\
    \ 4\n- UFO能量补充 ................................. 6\n- 幽灵迷宫 ....................................\
    \ 12\n- 岩石风暴 .................................... 18\n- 潜艇探索者 ...................\
    \ 24\n- 术语表 ......................................... 30\n- 命令列表 .................................\
    \ 31\n- 索引 ............................................... 32\n\n尊重版权\n\n版权意味着对某物的合法所有权。你需要考虑谁拥有你链接到或下载到网页中的图像或声音文件。除非你试图向公众提供页面，否则应该不会有重大问题。请务必与成年人确认一下。\n\
    \n另一种方法是找到免费使用的图像或声音文件：搜索图像或声音，然后在网站结果页面上查找设置按钮。点击高级搜索，然后查找使用权。在此菜单上选择免费使用、共享或修改。\n\
    \n## 简介\n\n本书将向你展示如何使用JavaScript编写激动人心的新游戏。JavaScript用于使网页更具交互性。它也可以用来创建在线游戏，这些游戏可以在桌面和移动设备上运行。在本书结束时，你将学到很多很棒的技巧，使你成为终极JavaScript专家。\n\
    \n你可以使用普通的**文本编辑器**来创建你的代码。\n\n```\nmygame.html\n<script>\nalert('Press any key\
    \ to start')\n</script>\n```\n\n这可以正常工作，但可能相当繁琐，因为软件不会给你任何帮助。\n\n本书活动中最适合使用的是离线HTML文本编辑器。它将在你输入代码时提供支持，同时也让你有机会学习真正的JavaScript代码。\n\
    \n你将使用两个独立的窗口。安排它们，以便你可以同时看到它们。\n\n有许多不同的网络浏览器可供使用。我们建议在本书活动中使用Google Chrome。在开始之前，请确保你的计算机上安装了最新版本。\n\
    \n在本书中，你将学习一些HTML以及JavaScript。HTML是用于构建网页的语言。JavaScript是让这些页面栩栩如生的语言！\n\n如果你想了解更多关于HTML工作原理的知识，或者你需要JavaScript的入门指南，那么请尝试阅读*Generation\
    \ Code*系列中的其他一些书籍。但是，如果你以前从未使用过HTML或JavaScript，你仍然可以创建本书中的所有游戏。\n\n那么你还等什么？开始编程吧！\n\
    \n## 入门准备\n\n你需要一个文本编辑器来开始JavaScript编程。你的计算机上可能已经有一个简单的文本编辑器，名为记事本（如果你使用Windows），或TextEdit（在Mac上）。这足以让你入门，但如果你下载一个更强大的文本编辑器，创建JavaScript会容易得多。在本书中，我们将使用一个名为Sublime\
    \ Text的文本编辑器。你可以下载许多其他编辑器，例如Brackets或Notepad++——所有这些都可以免费试用。\n\n### 第1步 – 查找Sublime\
    \ Text网站\n\n- 打开你的网络浏览器并访问www.sublimetext.com\n\n### 第2步 – 开始下载\n\n- 点击网页顶部的下载按钮。\n\
    - 选择你需要的Sublime Text版本。如果不确定，请让成年人帮助你找到正确的版本：如果你使用Mac，请点击苹果菜单，然后点击关于。在PC上，单击开始菜单，选择系统，然后单击关于。\n\
    - 等待下载完成。\n\n### 第3步 – 安装软件\n\n- 一些网络浏览器随后会要求你运行安装程序。选择运行。\n- 如果这没有发生，不要惊慌。安装程序文件应该已经下载到你的计算机上。在你的下载文件夹中查找它。双击它开始安装你的新文本编辑器。你应该会得到一个大的白色或灰色框，告诉你下一步该怎么做。按照这些说明完成安装。\n\
    \n### 第4步 – 运行Sublime Text\n\n- **在PC上：**\n  - ➞ 点击 **开始** > **程序** > **Sublime\
    \ Text**。或者，如果它出现在 **最近添加** 部分，直接点击 **Sublime Text**。\n\n- **在Mac上：**\n  - ➞ 点击\
    \ **Finder**。\n  - ➞ 点击 **应用程序**。\n  - ➞ 通过将 **Sublime Text** 从 **Finder** 拖到桌面底部的程序坞来创建一个快捷方式。\n\
    \  - ➞ 点击 **Sublime Text** 图标。\n\n### 第5步 – 开始编程！\n\n➜ 在文本编辑器的第1、2、3行仔细输入此代码。\n\
    \n```\n1 <script>\n2     alert(\"Start Coding!\")\n3 </script>\n```\n\n- 标记JavaScript部分的开始。\n\
    - 显示一个消息框，内容为“开始编程！”。\n- 标记JavaScript部分的结束。\n\n### 第6步 – 保存你的代码\n\n- ➞ 点击 **文件**\
    \ > **保存**。\n- ➞ 保存到你的 **文档** 文件夹。\n- ➞ 输入 **start.html** 作为文件名。\n\n### JavaScript需要HTML\n\
    \n虽然我们使用JavaScript编程，但我们需要将文件放在一些HTML代码中才能使其工作。HTML代表超文本标记语言，是用于构建网页的语言。\n\nHTML用于描述网页上显示的对象或元素。如果你正在创建一个简单的游戏，你需要使用HTML来添加图像和一些文本以显示分数。JavaScript被添加来告诉图像在按下不同键或单击鼠标时移动。它也可以用来显示分数并使其变化。\n\
    \n我们需要同时使用HTML和JavaScript来制作更有趣的游戏。JavaScript旨在添加到HTML页面中，使其更具交互性。\n\n你将在本书中使用一系列HTML元素。每个元素使用标签来显示其元素类型（见第31页）。标签用<\
    \ >尖括号括起来。\n\n### 第7步 – 查看你的页面\n\n- ➞ 打开你的 **文档** 文件夹。\n- ➞ 找到 **start.html**\
    \ 文件并双击它。\n- ➞ 你的网页现在应该在正常的网络浏览器中加载。\n- ➞ 你应该会看到一条消息 **开始编程！**\n\n## UFO能量补充\n\
    \n在这个游戏中，玩家必须尽快移动一个外星飞船（UFO）以获取更多能量。玩家通过按键盘上的方向键来移动UFO。原子符号（下面绿色的）用于代表能量源。玩家完成任务五次后，游戏停止并显示所用时间。你可以和朋友比赛，看谁能用最短的时间完成它！游戏的完整代码列在第11页。\n\
    \n### 第1步 – 规划\n\n分数显示在HTML段落元素中。\n\n计时器将计算收集五个原子所需的时间。\n\n每次UFO移动时，我们需要检查它是否已经到达原子位置。这是通过比较它们的坐标来完成的。\n\
    \n变量用于计数分数、游戏运行时间以及原子和UFO的坐标。\n\n当收集到五个原子时，游戏结束并显示所用时间。\n\n我们只需要一张原子图像。每次UFO收集到它，我们都会将其移动到一个新的随机位置，并将分数增加1。\n\
    \n按方向键会改变 **ufoX** 和 **ufoY** 坐标，使UFO在屏幕上移动。\n\n点击 **确定** 再玩一次。\n\n### 第2步 – 寻找一些图片\n\
    \n- 找一张原子图片使用，或者找另一个符号来代表游戏中的能量。它需要保存到与HTML文件相同的文件夹中。\n- 搜索原子剪贴画使用。\n- 右键单击一张图片。\n\
    - 点击图片另存为...\n- 导航到你的文档文件夹，然后点击保存。\n- 现在重复此步骤，但搜索UFO剪贴画使用。\n"
