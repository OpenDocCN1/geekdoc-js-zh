    \ colour.\nMake sure the src property matches the name of the downloaded file\
    \ for the submarine.\nMake sure the src property matches the downloaded file for\
    \ the coin.\nAdd the score paragraph.\n\n# STEP 5 - SAVE YOUR CODE\n\nClick **File\
    \ > Save** and type **sub.html** as the filename.\nMake sure you save it in your\
    \ **Documents** folder. Keep saving it every time you add some new code."
