    # # GETTING STARTED


    You need a text editor to start coding in JavaScript. There will probably be a
    simple text editor already on your computer, called Notepad (if you have Windows),
    or TextEdit (on a Mac). This will be sufficient for you to get started, but it
    will be much easier to create JavaScript if you download a more powerful text
    editor. In this book, we will use a text editor called Sublime Text. There are
    many others you could download, such as Brackets or Notepad++ – all of these are
    free for you to try out.


    # ## STEP 1 – FIND THE SUBLIME TEXT WEBSITE


    +   - Open your web browser and visit www.sublimetext.com


    ![](img/c5282b3810f6766d06b115517f6f4aac_5_0.png)


    # ## STEP 2 – START DOWNLOADING


    +   - Click the Download button near the top of the web page.

    - Choose which version of Sublime Text you need. If you are not sure, then ask
    an adult to help you find the correct version: click the Apple menu, then About
    if you are using a Mac. On a PC, click the Start menu, select System, and click
    About.

    - Wait for the download to complete.


    ![](img/c5282b3810f6766d06b115517f6f4aac_5_1.png)


    ![](img/c5282b3810f6766d06b115517f6f4aac_5_2.png)


    # ## STEP 3 – INSTALL THE SOFTWARE


    +   - Some web browsers will then ask you to run the installation program. Choose
    Run.

    - If this does not happen, don’t panic. The installer file should have been downloaded
    to your computer. Look in your Downloads folder for it. Double-click it to start
    installing your new text editor. You should get a big white or grey box giving
