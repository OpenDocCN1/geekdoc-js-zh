    We will add a transition property to the image to make it move smoothly. This
    means that the images style properties (i.e. how far it is from the left or top
    of the screen) will change gradually over a specific amount of time.


    All of the style properties will be affected.


    ```

    -webkit-transition: all 0.5s;

    ```


    The changes will be spread over 0.5 seconds (half a second).


    # STEP 3 – START A NEW FILE


    ⇒ Start by typing in the HTML for the game, setting out the body, image and a
    paragraph for the score.


    Sublime Text


    ```html

    1 <html>

    2 <body style="background-color:black">

    3   <img id="atom" style="width: 50px; position:absolute" src="atom.png">

    4   <img id="ufo" style="width: 50px; position:absolute; top:0; left:0; -webkit-transition:
    all 0.2s;" src="ufo.png">

    5   <p id="scoreTB" style="position:absolute; color:white;">Score: 0</p>

    6   <p id="timeTB" style="position:absolute; right:50px; color:white;">Time: 0</p>

    7 </body>

    ```


    Set the background colour.


    Add the image of the atom. Make sure the src property matches the name of the
    downloaded file.


    Add the ufo image.


    Add the score paragraph.


    Add the time paragraph.


    ⇒ Click **File > Save** and type ufo.html as the filename.


    ⇒ Make sure you save it in your **Documents** folder. Keep saving it every few
    minutes.


    # STEP 4 – BEGIN THE SCRIPT


    Now that we have defined the elements that go on the page, we need to start on
    the JavaScript.

    At the start of the game we need to:


    - create the variables

    - define a function to make random numbers

    - tell the program which function to run when the page is loaded and ready.


    - tell the program which function to run when keys are pressed

    - define some functions to set co-ordinates


    ```javascript

    8  <script>

    9  var score=0, gameTime=0, gameTimer, ufoX=0, ufoY=0, atomX=0, atomY=0;

    10 onkeydown=handleKeys;

    11 onready=startUp();

    12 function setLeft(id,x){document.getElementById(id).style.left=x+"px";}

    13 function setTop(id,y){document.getElementById(id).style.top=y+"px";}

    14 function randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}

    ```


    Start the script section.

    Create variables to store the score, gameTime and co-ordinates.

    Tell the program which function to run when keys are pressed.

    Tell the program which function to run when the page is ready.


    Define functions to set any element’s co-ordinates.


    Define a function that returns a random number between two values.


    # STEP 5 - GET STARTED


    Once the page has loaded in the browser, the **startUp** function will be called.
    (''Calling'' a function means running it and carrying out all the code inside
    it.) The **startUp** function will run code to move the atom icon to a random
    place and the game timer will be started.


    ```javascript

    15 function startUp(){

    16     moveAtom();

    17     gameTimer=window.setInterval(displayTime, 1000);

    18 }

    ```


    Define the function.


    Call the moveAtom function.


    Start the gameTimer. This timer will call the function named displayTime every
    1000 milliseconds (every second).


    End the function.


    # STEP 6 - HOW LONG?


    Add the **displayTime** variable. This will store how many seconds the game has
    been running.


    ```javascript

    19 function displayTime(){

    20     gameTime++;

    21     document.getElementById("timeTB").innerText="Time:"+gameTime;

    22 }

    ```


    Define the function.


    Add one to the value stored in the gameTime variable.


    Show the time left in the paragraph called timeTB.


    End the function.


    # POSITIONING ELEMENTS


    Computer images are made up of pixels (picture elements). Pixels can be used as
    units for co-ordinates in JavaScript and HTML.


    Elements can be positioned in a particular place by setting their co-ordinates.
    This is done by setting their left and top style properties. Add px on the end
    of the value to measure in pixels.


    (0,0) will always be the co-ordinates for the top left of the browser. The maximum
    values for left and top will depend on the size of the browser window. The co-ordinates
    of the red dot on this screen are (100,50).


    # STEP 7 – MOVE THE ATOM


    We need to define a function that will move the atom to a random place on the
    screen.


    ```javascript

    23 function moveAtom(){

    24 atomX=randomNumber(2,16);

    25 atomY=randomNumber(2,16);

    26 setLeft("atom",50*atomX);

    27 setTop("atom",50*atomY);

    28 }

    ```


    Define the function.

    Set atomX to a random number between 2 and 16.

    Set atomY to a random number between 2 and 16.

    Set the new position for the atom symbol by multiplying atomX by 50 and atomY
    by 50 (* means multiply, and is used in JavaScript instead of the mathematical
    symbol x).


    # STEP 8 – MOVE THE UFO


    When the arrow keys are pressed, we need to move the UFO up, down, left or right
    – which direction depends on which key is pressed. We need to add a special sort
    of variable called a parameter to our function, which will store the information
    about the key that has been pressed. Type (e) after the function name to add the
    parameter.


    Each key on the keyboard has a specific code linked to it. The left arrow has
    a code of 37, the right arrow’s code is 39, up is 38 and down is 40. The code
    for the key pressed will be stored in e.keyCode. Type in this function to trigger
    what will happen when a key is pressed:


    ```javascript

    29 function handleKeys(e){

    30 if(e.keyCode==37){ufoX--;}

    31 if(e.keyCode==39){ufoX++;}

    32 if(e.keyCode==38){ufoY--;}

    33 if(e.keyCode==40){ufoY++;}

    34 setLeft("ufo",50*ufoX);

    35 setTop("ufo",50*ufoY);

    36 checkIfHitAtom();

    37 }

    ```


    Define a function called handleKeys. Information about which key is pressed will
    be put into the variable called e.

    If the code for the left arrow key has been sent, make ufoX go down by 1. (ufoX--
    means subtract one from the value in ufoX.)

    If the code for the right arrow key has been sent, make ufoX go up by 1. (ufoX++
    means add 1 to ufoX.)

    If the up arrow key has been pressed, subtract 1 from ufoY.

    If the down arrow key has been pressed, add 1 to ufoY.

    Set the new position for the UFO by multiplying ufoX by 50 and ufoY by 50.

    Once the UFO has moved, we will need to check if it has hit the atom symbol by
    running the checkIfHitAtom() function.


    > Remember, events are special bits of code that ‘listen’ to the mouse or keyboard
    and wait for certain things to happen before running some other code.


    # STEP 9 – HIT OR MISS?


    Every time the UFO moves, it calls the function below. This function will check
    to see if the UFO has hit the atom symbol. We code this by comparing the x co-ordinates
    (how far from the left) and y co-ordinates (how far from the top) of the atom
    and UFO. If they are equal then they both must be in the same position. Therefore,
    the UFO has hit the atom symbol and topped up its energy levels!


    ```javascript

    38 function checkIfHitAtom(){

    39   if((ufoX===atomX) && (ufoY===atomY)){

    40     score++;

    41     document.getElementById("scoreTB").innerText="Score: "+score;

    42     moveAtom();

    43     if(score===5){gameOver();}

    44   }

    45 }

    ```


    If the co-ordinates match, run the code below (&& means and). Increase the score
    by 1. Show the score in the paragraph called scoreTB. Move the atom symbol to
    a new random place. If the score gets up to 5 then the player has won, so call
    the gameOver function.


    # STEP 10 – GAME OVER


    When the player has collected five atom icons, the game is over and the following
    code is run:


    ```javascript

    46 function gameOver(){

    47   clearInterval(gameTimer);

    48   alert("Well done! Your time was: "+ gameTime);

    49   location.reload();

    50 }

    ```


    Define the function. Stop the timer running, so the time won’t keep going up.
    Show a message explaining how long the player took to complete the game. This
    command will reload the page and make the game start again. (If you don’t want
    this to happen, miss out this line.)


    # STEP 11 – LAST LINES


    Finally, add these two lines to show the end of the script section and the end
    of the HTML.


    ```html

    51 </script>

    52 </html>

    ```


    Save your file, reload the browser, then play!


    # CUSTOMISE


    - Change the game so the player has to collect 10 atom icons.

    - Design your own collecting game using different images.'
