  md: '# # GHOST MAZE


    In this project, you will make a simple maze game. The player will move around
    when the arrow keys are pressed. To stop the player moving through walls, we will
    store the maze shape in a special data structure. This is called a two-dimensional
    array, which is a list of lists that stores which squares in the maze are walls
    and which squares aren’t. Finally, we will check to see where the player is and
    show a message when they reach the exit of the maze. The complete code for the
    game is listed on page 17.


    # ## STEP 1 – PLANNING


    A grid of data is used to draw the maze when the game starts. Walls will be drawn
    in yellow and paths in blue.


    Before the player is allowed to move, we need to check that it is not going to
    hit a wall. This is done by checking **mazeData**.


    Pressing the arrow keys will change the player icon’s co-ordinates, making it
