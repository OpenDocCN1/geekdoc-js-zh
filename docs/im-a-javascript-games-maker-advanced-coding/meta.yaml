  mdcn: "\n## 碰撞还是重叠？\n\n在前两个游戏中，我们每次移动对象50或100像素。通过测试x坐标（距左边的距离）和y坐标（距顶部的距离），可以很容易地判断对象是否发生了碰撞。在一个对象移动距离较小的游戏中，它们可能会发生碰撞，但坐标不会完全相同。为了检测这种情况，我们需要查看两个对象是否重叠。\n\
    \n这两个对象的宽度和高度都是100像素。\n\n我们知道这两个对象是重叠的，因为它们的左边界坐标差值小于宽度：120-50=70\n\n并且它们的顶部坐标差值小于高度：140-85=55\n\
    \n这意味着它们重叠并发生了碰撞。\n\n## 第6步 – 重叠测试代码\n\n我们需要一个函数来测试三个岩石中的任何一个是否与飞船重叠。我们不必为每个岩石编写单独的代码，而是编写一个可以测试任意两个对象是否重叠的函数。我们将这两个假想的对象称为**ob1**和**ob2**。调用函数时，我们会告诉它我们要用哪两个对象进行重叠测试。\n\
    \n```\nfunction isOverlapping(ob1, ob2) {\n  return ((getLeft(ob1) + 100 > getLeft(ob2))\
    \ && (getLeft(ob1) < getLeft(ob2) + 100) &&\n    (getTop(ob1) + 100 > getTop(ob2))\
    \ && (getTop(ob1) < getTop(ob2) + 100));\n}\n```\n\n添加代码，在测试两个对象的坐标后返回（送回）一个值。如果对象重叠，返回true；如果不重叠，返回false。该函数假设对象的高度和宽度都是100像素。\n\
    \n## 第7步 – 启动\n\n页面在浏览器中加载完毕后，将调用**startUp**函数。**startUp**函数将设置一个定时器来移动岩石。\n\n\
    ```\nfunction startUp() {\n  gameTimer = window.setInterval(moveThings, 20);\n\
    }\n```\n\n启动gameTimer。这个定时器将每20毫秒（每秒50次）调用一次名为moveThings的函数。\n\n## 第8步 – 移动对象\n\
    \n当定时器调用**moveThings**函数时，所有三个岩石都需要移动。我们可以通过编写一段代码来移动**rock1**，另一段来移动**rock2**，最后一段来移动**rock3**来实现。但这需要大量代码，并且意味着如果我们想加快或减慢岩石的速度，就需要更改每个部分。相反，我们将使用一个循环来依次移动每个岩石并检查它是否撞到了飞船。我们的循环将从1数到3。第一次移动**rock1**，然后**rock2**，接着**rock3**。为此，我们需要编写一段通用代码来移动一个假想的岩石，称为**rock\
    \ n**。我们可以给**n**赋一个1到3之间的值。这将写成\"rock\"+n。\n\n最后，我们需要让飞船上下移动。为了增加游戏难度，飞船不会保持静止。\n\
    \n```\nfunction moveThings() {\n  for (var n = 1; n <= 3; n++) {\n    var x =\
    \ getLeft(\"rock\" + n);\n    if (x < -100) {\n      x = window.innerWidth;\n\
    \      y = randomNumber(0, window.innerHeight - 100);\n      setTop(\"rock\" +\
    \ n, y);\n      score = score + 10;\n      document.getElementById(\"scoreTB\"\
    ).innerText = \"Score: \" + score;\n    }\n    setLeft(\"rock\" + n, x - speed\
    \ - n);\n    if (isOverlapping(\"rock\" + n, \"ship\")) {\n      gameOver();\n\
    \    }\n  }\n  var y = getTop(\"ship\");\n  if ((y <= 0) || (y > window.innerHeight\
    \ - 100)) {\n    yChange = -yChange;\n  }\n  setTop(\"ship\", y + yChange);\n\
    }\n```\n\n## 第9步 – 改变方向\n\n为了增加游戏难度，飞船会持续向上或向下移动。按下一个键将设定它的方向，但它是在**moveThings**函数中被移动的。输入此函数来决定按下按键时会发生什么。\n\
    \n```\nfunction handleKeys(e) {\n  if (e.keyCode == 38) {\n    yChange = -3;\n\
    \  }\n  if (e.keyCode == 40) {\n    yChange = 3;\n  }\n}\n```\n\n定义一个名为handleKeys的函数。关于按下了哪个键的信息将存储在变量e中。\n\
    \n如果传递给函数的是向上箭头键的代码，将yChange设置为-3。\n\n如果发送的是向下箭头键的代码，将yChange设置为3。\n\n结束函数。\n\n\
    ## 第10步 – 碰撞\n\n如果其中一个岩石撞到了飞船，那么将调用以下函数：\n\n```\nfunction gameOver() {\n  clearInterval(gameTimer);\n\
    \  if (confirm(\"Game Over – Click OK to play again.\") == true) {\n    location.reload();\n\
    \  }\n}\n```\n\n定义函数。\n\n停止定时器运行，这样时间就不会继续增加。\n\n显示一条消息，询问玩家是否想再玩一次。如果他们点击确定，则运行下一行。\n\
