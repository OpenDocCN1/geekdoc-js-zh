  md: '# HIT OR OVERLAPPING?


    In the previous two games, we moved objects by 50 or 100 pixels at a time. This
    made it easy to see if objects had hit each other, after testing the x (how far
    from the left) and y (how far from the top) co-ordinates. In a game where objects
    move by smaller amounts, they may hit each other, but not have exactly the same
    co-ordinates. To test for this, we need to see if the two objects are overlapping.


    ![](img/c5282b3810f6766d06b115517f6f4aac_21_0.png)


    Both of these objects are 100 pixels wide and 100 pixels high.


    We know these objects are overlapping, because the difference between their left
    values is less than their width: 120-50=70


    And the difference between their top values is less than their height: 140-85=55


    This means they are overlapping and have collided.


    # STEP 6 – OVERLAPPING TEST CODE


    We need a function that can test if any of the three rocks are overlapping the
    ship. Rather than write separate code for each rock, we will write a function
    that can test if any two objects are overlapping. We will call these two imaginary
    objects **ob1** and **ob2**. When we call the function, we will tell it which
    two objects we want to use in the overlapping test.


    ```

    18 function isOverlapping(ob1,ob2){

    19   return ((getLeft(ob1)+100>getLeft(ob2)) && (getLeft(ob1)<getLeft(ob2)+100)
    &&

    (getTop(ob1)+100>getTop(ob2)) && (getTop(ob1)<getTop(ob2)+100));}

    ```


    Add the code that returns (sends back) a value after testing co-ordinates of the
    two objects. It returns true if the objects are overlapping, or false if they
    are not. It assumes the objects are 100 pixels high and 100 pixels wide.


    # STEP 7 – START UP


    Once the page has loaded in the browser the **startUp** function will be called.
    The **startUp** function will set up a timer to move the rocks.


    ```

    20 function startUp(){

    21   gameTimer=window.setInterval(moveThings,20);

    22 }

    ```


    Start the gameTimer. This timer will call the function named moveThings every
    20 milliseconds (50 times a second).


    <20>'
