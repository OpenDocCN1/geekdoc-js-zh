  md: '# MOVING AT AN ANGLE


    When we are coding in JavaScript, it is quite simple to move an object left and
    right or up and down. All we need to do is make sure it has its position property
    set to **absolute**, then change the left (x co-ordinates) and top (y co-ordinates)
    style values. To make it move at an angle, we need to use some more complex maths.
    Don''t worry if you don''t understand it all, but try to work out which parts
    of the following lines of code make it move so you can adapt it to use in other
    games you make.


    If the submarine is travelling down at 30 degrees, then its motion can be broken
    down into how much it moves down and how much it moves to the right.


    ![](img/c5282b3810f6766d06b115517f6f4aac_28_0.png)


    By using the maths functions **sine** and **cosine** we can turn movement at an
    angle into a combination of horizontal and vertical movements. In JavaScript,
    we type these as **Math.sin** and **Math.cos**:


    Change **subX** by **speed** multiplied by the cosine of the sub''s angle.


    ```

    subX=subX+speed*Math.cos(Math.PI*angle/180);

    subY=subY+speed*Math.sin(Math.PI*angle/180);

    ```


    Change **subY** by **speed** multiplied by the sine of the sub''s angle.


    # STEP 8 – MOVE THINGS


    Each time the timer calls the function, we need to move the submarine and the
    coin. This function also calls another function **checkHit**, which tests to see
    if the sub has grabbed a coin. Finally, we check to see if the coin has got all
    the way to the bottom of the sea.


    ```

    18 function moveThings(){

    19   subX=subX+speed*Math.cos(Math.PI*angle/180);

    20   subY=subY+speed*Math.sin(Math.PI*angle/180);

    21   if(subX<-100){subX=innerWidth;}

    22   if(subX>innerWidth){subX=-100;}

    23   if(subY<-100){subY=innerHeight;}

    24   if(subY>innerHeight){subY=-100;}

    25   setLeft("sub",subX);

    26   setTop("sub",subY);

    27   y=getTop("coin");

    28   setTop("coin", y+1+score*0.1);

    29   checkHit();

    30   if(y>window.innerHeight){gameOver();}

    31 }

    ```


    Change the variables subX and subY according to the sub''s angle.

    If the sub has gone past the left edge of the screen, move it to the right.

    If it has gone too far right, move it all the way to the left hand side.

    Move it to the bottom if it has gone too high.

    Move it to the top if it has gone too low.


    We need to move the submarine now we have worked out its new co-ordinates.

    Find out where the coin is and store it in the variable y.

    Move the coin down, getting faster as the score increases.

    Call the function that will check if they have collided.

    Add the code to end the game if the coin has gone past the bottom edge of the
    screen.'
