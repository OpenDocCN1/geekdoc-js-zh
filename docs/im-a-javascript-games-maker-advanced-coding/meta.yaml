  md: '# > GLOSSARY


    ANIMATION Making objects in your program move around.


    OVERLAPPING When objects have collided but are not in exactly the same position.


    VARIABLE A value used to store information in a program that can change.


    BROWSER A program used to view web pages, such as Chrome or Internet Explorer.


    PIXEL A small dot on the screen, can be used as a unit of measurement.


    BUGS & DEBUGGING


    BUG An error in a program that stops it working properly.


    PROPERTY Information about the style of an element, such as its colour or size.


    +   When you find your code isn''t working as expected, stop and look through
    each line of code you have put in. Here are some things to check:

    * Check you have spelt the commands correctly.

    * Check you have used the correct case (capitals and lower case).

    * Check you haven''t missed any quotes.

    * Check you have closed tags correctly.

    * If images aren''t showing, check filenames have been typed accurately.

    * If images aren''t moving, check you have set position:absolute.

    * Make sure you have used the correct style of brackets and other symbols.


    DEBUG To remove bugs (or errors) from a program.


    RANDOM NUMBER A number picked by the computer that can''t be predicted.


    ELEMENT One of the objects making up a web page, such as a paragraph or image.


    TAGS Special words in an HTML document, surrounded by angle brackets <> defining
    an element.


    EVENT Something that happens while the program is running, such as a mouse click
    or key press.


    TEXT EDITOR A program used to create and change code.


    FUNCTION A reusable section of code combining a number of commands.


    TIMER An object that runs a function after a specified delay, or at a regular
    interval.


    HTML (HYPERTEXT MARKUP LANGUAGE) The language used to build web pages.


    TWO DIMENSIONAL ARRAY A list of lists used to represent a grid or table of data.


    JAVASCRIPT A programming language used to make web pages interactive or to build
    simple games.'
