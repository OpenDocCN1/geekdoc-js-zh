  md: "# STEP 7 - DRAW THE MAZE\n\n⇒ The maze needs to be drawn on the page using\
    \ the information in the **mazeData** array. The function below will loop through\
    \ the array and create a div element for each square in the maze. It will then\
    \ look at whether the relevant item in the maze data is a 0 or 1. If it is a 1\
    \ it will leave the div yellow, if it is 0 then it will colour it blue.\n\n```\n\
    24 function drawMaze(){\n25     for(var y=0; y<7; y++){\n26         for(var x=0;\
    \ x<8; x++){\n27             var newOb=document.createElement('div');\n28    \
    \         document.getElementById(\"mazeHolder\").appendChild(newOb);\n29    \
    \         var divId=Math.random();\n30             newOb.setAttribute('id',divId);\n\
    31             setLeft(divId,50*x);\n32             setTop(divId,50*y);\n33  \
    \           if(mazeData[y][x]==0){\n34                 document.getElementById(divId).style.backgroundColor=\"\
    blue\";\n35             }\n36         }\n37     }\n38 }\n```\n\n+   - Loop through\
    \ each row of the maze.\n- Loop through each column of the maze.\n- Create a new\
    \ div called newOb.\n- Add it to the mazeHolder.\n- The div needs a name. Make\
    \ up a random one!\n- Teach the div its new name.\n- Position it on the mazeHolder\
    \ in the correct place based on its co-ordinates. The x and y values are multiplied\
    \ (*) by 50 as each block is 50 x 50 pixels.\n- If the relevant item in mazeData\
    \ is 0 then:\n  - Colour the div blue to make it a path.\n  - End the IF command\
    \ block.\n- End the x loop.\n- End the y loop.\n- End the function.\n\n# STEP\
    \ 8 - MOVE THE PLAYER\n\n⇒ When the arrow keys are pressed, we need to move the\
    \ player up, down, left or right. However, we also need to check to see if moving\
