    \ **Documents** folder. Keep saving it every time you add some new code."
  - '[PAGE 27]


    # STEP 6 - BEGIN THE SCRIPT


    At the start of the script we need to:


    +   • create the variables we need

    • tell the program which function to run when keys are pressed

    • start the **gameTimer** and tell it to call the **moveThings** function every
    20 milliseconds

    • define some functions to get and set co-ordinates, and make random numbers.


    ```

    <script>

    var score=0, angle=0, speed=4, subX=0, subY=500, gameTimer;

    onkeydown=handleKeys;

    gameTimer=window.setInterval(moveThings,20);

    function setLeft(id,x){document.getElementById(id).style.left=x+"px";}

    function setTop(id,y){document.getElementById(id).style.top=y+"px";}

    function getLeft(id){return document.getElementById(id).offsetLeft;}

    function getTop(id){return document.getElementById(id).offsetTop;}

    function randomNumber(low,high){return(Math.floor(low+Math.random()*(1+high-low)));}

    ```


    # STEP 7 - OVERLAPPING TEST CODE


    We will use the function used on page 20 to test if objects called **ob1** and
    **ob2** are overlapping.


    ```

    function isOverlapping(ob1, ob2){

    return ((getLeft(ob1)+50>getLeft(ob2)) && (getLeft(ob1)<getLeft(ob2)+50) &&

    (getTop(ob1)+50>getTop(ob2)) && (getTop(ob1)<getTop(ob2)+50));}

    ```


    We need to make some adjustments from the Rock Storm game. This time, one of the
    objects is much smaller so we need to change the 100 to 50.


    ![](img/c5282b3810f6766d06b115517f6f4aac_27_0.png)


