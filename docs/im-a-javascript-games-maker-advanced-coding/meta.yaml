    # # COMMAND LIST


    # ## JAVASCRIPT COMMANDS


    +   - **alert("Hello");** – shows "Hello" as a message in a pop up box.

    - **var score=0;** – defines a variable called score.

    - **var gameTimer=window.setInterval(myFunction, 1000);** – runs a function called
    **myFunction** every second.

    - **clearInterval(gameTimer);** – stops the timer called **gameTimer**.

    - **function gameOver();** – defines a function called **gameOver()**.

    - **document.getElementById("dog")** – selects an element on the page.

    - **Math.random()** – creates a random number between 0 and 1.

    - **Math.round()** – rounds a decimal to the nearest whole number.

    - **location.reload();** – reloads a page to restart the JavaScript (and the game).


    # ## HTML ELEMENTS


    +   - **\<html\>...\</html\>** – starts and ends the HTML file.

    - **\<script\>...\</script\>** – starts and ends the script section.

    - **\<img\>** – tags an image, such as a photo or piece of clipart.

    - **\<p\>...\</p\>** – tags a paragraph or line of text.

    - **\<body\>...\</body\>** – starts and ends the main body of the page, effectively
    the background of your program.


    # ## EVENTS


    +   - **onclick** – the mouse has been clicked.

    - **onmousedown** – the mouse has been pressed down (happens before click and
    mouse up).

    - **onmouseup** – the mouse button has been released.

    - **onkeydown** – a key has been pressed on the keyboard.


    ![](img/c5282b3810f6766d06b115517f6f4aac_32_0.png)


    # ## TIPS TO REDUCE BUGS


    +   - 🐞 If you are making your own web page, spend time planning it before you
    start.

    - 🐞 Practise debugging! Make a very simple web page and get a friend to change
    one line of code while you’re not looking. Can you fix it?

    - 🐞 When things are working properly, spend time looking through your code so
    you understand each line. To be good at debugging, you need to understand what
    each line of your code does and how your code works.


    # ## STYLE PROPERTIES


    +   - **position:absolute** – allows an element to be moved around by changing
    left and top properties.

    - **left** – sets how far across the screen an element (such as an image) is.

    - **top** – sets how far down from the top of the screen an element is.

    - **height** – sets the height of an element, such as an image (eg 20px means
    20 pixels high).

    - **width** – sets the width of an element, such as an image.

    - **-webkit-transition** – sets how quickly an element changes its properties.'
