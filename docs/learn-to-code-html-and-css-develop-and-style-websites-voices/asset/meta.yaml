  - 4. 因为我们对 `<h1>` 元素使用了浮动（float），所以我们需要包含该浮动。`<h1>` 元素的最近父元素是 `<header>` 元素，因此我们想给
    `<header>` 元素添加 `group` 类。这样做可以将我们之前设置的清除（clearfix）样式应用到 `<header>` 元素上。
- - '##'
  - 5. `<header>` 元素已经初具规模，让我们来看看 `<<footer>>` 元素。与处理 `<header>` 元素一样，我们将 `<small>`
    元素内部的版权信息向左浮动，并让所有其他元素在其右侧环绕排列。
- - '##'
  - 6. 现在 `primary-footer` 类已应用于 `<<footer>>` 元素，我们可以使用该类来筛选 `<small>` 元素。我们需要选取 `<small>`
    元素将其向左 `float`（浮动）。不要忘记在我们的 CSS 文件中创建一个章节。
- - '##'
  - 7. 最后，我们在 `<<footer>>` 元素的顶部和底部添加一些 `padding`，帮助它与页面的其他部分离开。我们可以直接使用选择器配合 `primary-footer`
    类来实现。
