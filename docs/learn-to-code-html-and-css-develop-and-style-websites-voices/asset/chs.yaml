  \n## 关于作者\n![Image](img/00002.jpeg)\n\nShay Howe 出生并成长于俄亥俄州的小镇利马（Lima），他从小就喜欢拆解遥控器和其他电子产品，并以此学习它们是如何工作的。当互联网引入时，他被深深吸引了，并立即开始学习关于它的一切知识。高中毕业后，他搬到了亚利桑那州的坦培（Tempe），在先进技术大学就读并获得了数字多媒体文学士学位，专注于网页设计。\n\
  \nShay 目前住在伊利诺伊州芝加哥，他是一名设计师兼前端开发人员，热衷于在构建创意直观的网站的同时解决问题。他专长网页和产品设计以及前端开发，并经常就这些专业领域进行写作和演讲。\n\
  \nShay 是 Chicago Camps 的联合创始人，该机构在芝加哥地区举办低成本、高价值的技术活动。他还是 Refresh Chicago 和 UX Happy\
  \ Hour 的共同组织者，这些活动帮助刷新新媒体事业的创意、技术和专业文化。\n\n但也许最重要的是，Shay 是无可争议的办公室乒乓球冠军。\n\n## 致谢\n\
