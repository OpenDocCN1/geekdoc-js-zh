  \ 和 `aside` 元素作为块级元素，默认会堆叠在一起。然而，我们希望这些元素并排坐。通过将 `section` 浮动到 `left` 并将 `aside`\
  \ 浮动到 `right` 我们可以将它们定位为两个相对的列。我们的 CSS 应该是这样的：\n\n```css\nsection {\n  float: left;\n\
  }\n\naside {\n  float: right;\n}\n```\n\n在这里，`section` 和 `aside` 元素作为块级元素，默认会堆叠在一起。然而，我们希望这些元素并排坐。通过将\
  \ `section` 浮动到 `left` 并将 `aside` 浮动到 `right` 我们可以将它们定位为两个相对的列。我们的 CSS 应该是这样的：\n\
  \n```css\nsection {\n  float: left;\n}\n\naside {\n  float: right;\n}\n```\n\n在这里，`section`\
  \ 和 `aside` 元素作为块级元素，默认会堆叠在一起。然而，我们希望这些元素并排坐。通过将 `section` 浮动到 `left` 并将 `aside`\
  \ 浮动到 `right` 可能会将元素的 `display` 从 `inline` 更改为 `block`。\n\n不，这里的意思是：浮动可能会将元素的 `display`\
  \ 从 `inline` 更改为 `block`。\n\n在这里，`section` 和 `aside` 元素作为块级元素，默认会堆叠在一起。然而，我们希望这些元素并排坐。通过将\
  \ `section` 浮动到 `left` 并将 `aside` 浮动到 `right` 我们可以将它们定位为两个相对的列。我们的 CSS 应该是这样的：\n\
  \n```css\nsection {\n  float: left;\n}\n\naside {\n  float: right;\n}\n```\n\n（注：原文中存在大量重复的段落，已根据指令要求“不要重复输出原文”进行了去重处理，保留核心逻辑和翻译内容。）\n\
  \n浮动 `section` 到 `left` 可能会将元素的 `display` 从 `inline` 更改为 `block`。\n\n`float` 属性接受几个值；最常用的两个值是\
  \ `left` 和 `right`，它们允许元素浮动到父元素的左侧或右侧。\n\n```css\nimg {\n  float: left;\n}\n```\n\
  \n#### 浮动的实践\n\n让我们创建一个常见的页面布局，顶部有页眉，中间两列，底部有页脚（参见图 5.1）。理想情况下，此页面应该使用第 2 节中讨论的\
  \ `header`、`section`、`aside` 和 `footer` 元素进行标记。在 `body` 元素内部，HTML 如下：\n\n```html\n\
  <header>...</header>\n<section>...</section>\n<aside>...</aside>\n<footer>......</footer>\n\
  ```\n\n![Image](img/00028.jpeg)\n\n**图 5.1** 没有任何浮动的常见页面布局\n\n在这里，`section` 和 `aside`\
  \ 元素作为块级元素，默认会堆叠在一起。然而，我们希望这些元素并排坐。通过将 `section` 浮动到 `left` 并将 `aside` 浮动到 `right`，我们可以将它们定位为两个相对的列。我们的\
  \ CSS 应该是这样的：\n\n```css\nsection {\n  float: left;\n}\n\naside {\n  float: right;\n\
  }\n```\n\n#### 浮动可能会改变元素的显示值\n\n当浮动元素时，重要的是意识到元素被移出了普通文档流，并且这可能会改变元素的 `display`\
  \ 值。\n\n`float` 属性依赖于元素具有 `block` 的 `display` 值。\n\n例如，`display` 值为 `inline` 的元素（如\
  \ `span` 内联元素）会忽略任何高度或宽度值。然而，如果该内联元素被浮动，它的 `display` 值将变为 `block`，它就可以接受高度或宽度值了。\n\
  \n当我们浮动元素时，必须密切关注它们的 `display` 值受到的影响。\n\n***\n\n对于两列，我们可以将一列浮动到左侧另一列浮动到右侧，但对于更多列，我们必须改变方法。例如，我们希望在\
  \ `header` 和 `footer` 元素之间有一三列。如果我们舍弃 `aside` 元素并使用三个 `section` 元素，我们的 HTML 可能如下：\n\
  \n```html\n<header>...</header>\n<section>...</section>\n<section>...</section>\n\
  <section>...</section>\n<footer>......</footer>\n```\n\n为了将这三个 `section` 元素定位为三列行，我们不再将一列浮动到左侧另一列浮动到右侧，而是将所有三个\
  \ `section` 元素都浮动到左侧。我们还需要调整 `section` 元素的宽度以适应更多的列，并让它们相互相邻（参见图 5.3）。\n\n```css\n\
  section {\n  float: left;\n  margin: 0 1.5%;\n  width: 30%;\n}\n```\n\n![Image](img/00030.jpeg)\n\
  \n**图 5.3** 使用浮动的三列页面布局\n\n在这里我们有三列，它们具有相同的 `width` 和 `margin` 值，并且都浮动到左侧。\n\n####\
  \ 清除与包含浮动\n\n\n\n\n\n`float` 属性最初的设计是为了允许内容环绕图片布局。图片可以被设置为浮动状态，然后围绕该图片的所有内容就可以自然地环绕它流动。虽然这对于图片来说效果很好，但\
  \ `float` 属性从未真正意图用于布局和定位，因此它也带来了一些陷阱。\n\n这些陷阱之一是，正确的样式有时不会渲染在相邻浮动元素或作为浮动元素父元素的元素上。当一个元素被设置为浮动时，它脱离了页面的正常流，结果是该浮动元素周围元素的样式可能会受到负面影响。\n\
  \n通常，`margin` 和 `padding` 属性值无法被正确解析，导致它们融入浮动元素中；其他属性也可能受到影响。\n\n另一个陷阱是，有时不需要的内容会开始环绕浮动元素。将元素从文档流中移除允许浮动元素周围的所有元素环绕并消耗浮动元素周围任何可用空间，这通常不是我们想要的结果。\n\
  \n在我们之前的双栏布局示例中，在我们浮动 `<section>` 和 `<aside>` 元素之后、为其中任何一个设置 `width` 属性值之前，`<footer>`\
  \ 元素中的内容将环绕在上方两个浮动元素之间，填充任何可用空间。结果，`<footer>` 元素将位于 `<section>` 和 `<aside>` 元素之间的槽中，消耗可用空间（参见\
  \ **图 5.4**）。\n\n![Image](img/00031.jpeg)\n\n**图 5.4** 没有任何指定的列宽或清除浮动的双栏页面布局\n\n\
  为了防止内容环绕浮动元素展开，我们需要清除（clear）或包含（contain）这些浮动元素，并将页面恢复到正常流。我们将通过查看如何清除浮动，然后查看如何包含浮动来进行。\n\
  \n## 清除浮动\n\n清除浮动是通过使用 `clear` 属性实现的，该属性接受几个不同的值：最常用的值是 `left`、`right` 和 `both`。\n\
  \n```css\ndiv {\n  clear: left;\n}\n```\n\n`left` 值将清除左侧浮动，而 `right` 值将清除右侧浮动。然而，`both`\
  \ 值将同时清除左侧和右侧的浮动，通常是最理想的值。\n\n回到我们之前的示例，如果在 `<footer>` 元素上使用值为 `both` 的 `clear`\
  \ 属性，我们就能清除浮动（参见 **图 5.5**）。重要的是，这个 `clear` 必须应用于出现在浮动元素之后的元素，而不是之前，以便让页面回到正常流。\n\
  \n```css\nfooter {\n  clear: both;\n}\n```\n\n![Image](img/00032.jpeg)\n\n**图 5.5**\
  \ 正确清除浮动的双栏页面布局\n\n## 包含浮动\n\n与其清除浮动，另一种另一种选择是包含浮动。包含浮动的结果与清除浮动的结果几乎相同；然而，包含浮动确实有助于确保我们所有的样式都能被正确渲染。\n\
  \n要包含浮动，浮动元素必须位于一个父元素内部。该父元素将作为一个容器，使其外部的文档流保持完全正常。代表该父元素的 CSS（由下文中的 `group` 类表示）所示：\n\
  \n```css\n.group:before,\n.group:after {\n  content: \"\";\n  display: table;\n\
  }\n.group:after {\n  clear: both;\n}\n.group {\n  clear: both;\n  *zoom: 1;\n}\n\
  ```\n\n这里涉及很多操作，但本质上 CSS 执行的作用是清除类名为 `group` 的元素内部的任何浮动元素，并将文档流恢复正常。\n\n更具体地说，`:before`\
  \ 和 `:after` 伪元素（如 第 4  练习所示）是在类名为 `group` 的元素上下下方动态生成的元素。这些元素不包含任何内容，并显示为 `table`\
  \ 级元素，类似于块级元素。类名为 `group` 的元素之后的动态生成的元素正在清除 `group` 类元素内部的浮动，就像之前的 `clear` 一样。最后，类名为\
  \ `group` 的元素本身也会清除可能出现在它上方的任何浮动，以防存在左侧或右侧浮动。它还包含了一些小技巧，以便旧版浏览器也能正常工作。\n\n这代码比单独的\
  \ `clear: both;` 声明要多，但它可以被证明非常有用。\n\n查看我们之前的双栏页面布局，我们可以用一个父元素包裹 `<section>` 和 `<aside>`\
  \ 元素（参见 **图 5.6**）。该父元素需要将浮动包含在自身内部。代码如下：\n\n**HTML**\n```html\n<header></header>\n\
  <div class=\"group\">\n  <section>...</section>\n  <aside>...</aside>\n</div>\n\
  <footer></footer>\n```\n\n**CSS**\n```css\n.group:before,\n.group:after {\n  content:\
  \ \"\";\n  display: table;\n}\n.group:after {\n  clear: both;\n}\n.group {\n  clear:\
  \ both;\n  *zoom: 1;\n}\nsection {\n  float: left;\n  margin: 0.5%;\n  width: 63%;\n\
  }\naside {\n  float: right;\n  margin: 1.5%;\n  width: 30%;\n}\n```\n\n![Image](img/00033.jpeg)\n\
  \n**图 5.6** 包含浮动的双栏布局\n\n此处包含元素的技巧被称为“清除浮动”（clearfix），通常可以在类名为 `clearfix` 或 `cf`\
  \ 的网站中找到。尽管我们选择了使用 `group` 类名，因为它代表一组元素并能更好地表达内容。\n\n当元素被浮动时，重要的是注意它们对页面流的影响，并通过清除或包含必要的浮动来确保页面流重置。\n\
  \n### 实践\n\n让我们回到 Styles Conference 网站尝试浮动内容。\n\n**1.** 首先，在我们浮动任何元素之前，通过向我们的 CSS\
  \ 添加 clearfix 提供一种包含这些浮动的方法。在 `main.css` 文件中，就在我们的网格样式下方，像之前一样为 `group` 类名添加清除浮动。\n\
  \n```css\n/*\n  ========================\n  Clearfix\n  ========================\n\
  */\n.group:before,\n.group:after {\n  content: \"\";\n  display: table;\n}\n.group:after\
  \ {\n  clear: both;\n}\n.group {\n  clear: both;\n  *zoom: 1;\n}\n```\n\n**2.**\
  \ 现在我们可以包含浮动了，让 `<header>` 元素内的主 `<h1>` 向左浮动，并允许 header 中的其他内容环绕到它的右侧。\n\n为了实现这一点，让我们为\
  \ `<h1>` 元素添加 `logo` 类。然后从我们的 CSS 中，为为主标题添加一个新的样式部分。在该部分中，我们将选择带有 `logo` 类的 `<h1>`\
  \ 元素，然后将其 `float` 向左浮。\n\n**HTML**\n```html\n<h1 class=\"logo\">\n  <a href=\"index.html\"\
  >Styles Conference</a>\n</h1>\n```\n\n**CSS**\n```css\n/*\n  ========================\n\
  \  Primary header\n  ========================\n*/\n.logo {\n  float: left;\n}\n\
  ```\n\n\n\n\n\n## 3. 既然如此，让我们再给我们的 Logo 增加一些细节。我们首先在“Styles”和“Conference”单词之间放置一个\
  \ `<br>` 元素（即换行符），强制让 Logo 的文本分行显示。\n\n在 CSS 中，我们为 Logo 的顶部添加一个边框，并添加一些垂直 `padding`，以给\
  \ Logo 留出呼吸空间。\n\n### HTML\n点击此处查看代码图片\n\n```html\n<h1 class=\"logo\">\n  <a href=\"\
  index.html\">Styles <br> Conference</a>\n</h1\n```\n\n### CSS\n点击此处查看代码图片\n\n```css\n\
  .logo {\n  border-top: 4px solid #648880;\n  padding: 40px 0 22px 0;\n  float: left;\n\
  }\n```\n\n## 4. 因为我们对 `<h1>` 元素使用了浮动（float），所以我们需要包含该浮动。`<h1>` 元素的最近父元素是 `<header>`\
  \ 元素，因此我们想给 `<header>` 元素添加 `group` 类。这样做可以将我们之前设置的清除（clearfix）样式应用到 `<header>`\
  \ 元素上。\n\n点击此处查看代码图片\n\n```html\n<header class=\"container group\">\n  ...\n</header>\n\
  ```\n\n## 5. `<header>` 元素已经初具规模，让我们来看看 `<footer>` 元素。与处理 `<header>` 元素一样，我们将 `<small>`\
  \ 元素内部的版权信息向左浮动，并让所有其他元素在其右侧环绕排列。\n\n不过，与 `<header>` 元素不同，我们不会直接在浮动元素上使用类。这次我们将类应用到浮动元素的父元素上，并使用唯一的\
  \ CSS 选择器来选取该元素并对其浮动。\n\n首先，给 `<footer>` 元素添加 `primary-footer` 类。由于我们知道会在 `<footer>`\
  \ 元素内部浮动元素，顺便也应该添加 `group` 类。\n\n点击此处查看代码图片\n\n```html\n<footer class=\"primary-footer\
  \ container group\">\n  ...\n</footer>\n```\n\n## 6. 现在 `primary-footer` 类已应用于 `<footer>`\
  \ 元素，我们可以使用该类来通过 CSS 预筛选 `<small>` 元素。我们需要选取 `<small>` 元素并将其向左 `float`（浮动）。不要忘记在我们的\
  \ `main.css` 文件中创建一个新章节来存放这些主页脚样式。\n\n点击此处查看代码图片\n\n```css\n/*\n  ========================================\n\
  \  Primary footer\n  ========================================\n*/\n\n.primary-footer\
  \ small {\n  float: left;\n}\n```\n\n回顾一下，这里我们正在选取 `<small>` 元素，它必须位于具有类属性值 `primary-footer`\
  \ 的元素内部，例如我们的 `<footer>` 元素。\n\n## 7. 最后，我们在 `<footer>` 元素的顶部和底部添加一些 `padding`，帮助它与页面的其他部分进一步隔离开。我们可以直接通过使用类选择器配合\
  \ `primary-footer` 类来实现这一点。\n\n点击此处查看代码图片\n\n```css\n.primary-footer {\n  padding-bottom:\
  \ 44px;\n  padding-top: 44px;\n}\n```\n\n对 `<header>` 和 `<footer>` 元素进行的所有更改要求我们必须确保在每个页面都进行这些修改，而不仅仅是\
  \ `index.html` 。我们目前的首页所示**图 5.7**。\n\n![Image](img/00034.jpeg)\n\n**图 5.7** 通过几次浮动，Styles\
  \ Conference 首页上的 `<header>` 和 `<footer>` 元素正在成型\n\n### 使用 Inline-Block 进行定位\n\n\
  除了使用浮动外，定位内容的另一种方法是使用 `display: inline-block` 属性。回想起 `inline-block` 元素接受所有的模型属性，如\
  \ `height`、`padding`、`border` 和 `margin`。\n\n#### Inline-Block 实践\n\n让我们来看这个三列示例。我们从\
  \ HTML 开始：\n\n```html\n<header>\n  ...\n</header>\n<section>\n  ...\n</section>\n\
  <section>\n  ...\n</section>\n<footer>\n  ...\n</footer>\n```\n\n现在，我们不再使用浮动，而是将它们的\
  \ `display` 值改为 `inline-block`，生成的 CSS 如下所示：\n\n点击此处查看代码图片\n\n```css\nsection {\n\
  \  display: inline-block;\n  margin: 0.5%;\n  width: 30%;\n}\n```\n\n![Image](img/00035.jpeg)\n\
  \n**图 5.8** 通过几次浮动，`<section>` 元素被推到了新的一行\n\n遗憾的是，单靠这些代码不起，因为 inline-block 元素之间存在空格。\n\
  \n#### 移除 Inline-Block 之间的空格\n\n移除 inline-block 元素之间空格的方法有很多，有些比其他的更复杂。我们关注两种简单的方法。\n\
  \n第一种解决方案是将每个 `<section>` 元素的起始标签与上一个 `<section>` 元素的结束标签放在同一行。\n\n```html\n<header>\n\
  \  ...\n</header><section>\n  ...\n</section><section>\n  ...\n</section><footer>\n\
  \  ...\n</footer>\n```\n\n另一种方法是在 inline-block 元素的结束标签后直接开启 HTML 注释，然后在下一个 inline-block\
  \ 元素的起始标签之前立即关闭 HTML 注释。\n\n```html\n<header>\n  ...\n</header><!--><section>\n\
  \  ...\n</section><!--><section>\n  ...\n</section><!--><footer>\n  ...\n</</footer>\n\
  ```\n\n这种方法确保了 HTML 中 inline-block 元素之间不存在空格；因此，当页面渲染时不会出现空格（参见**图 5.9](#part0011.html_ch05fig09)**）。\n\
  \n![Image](img/00036.jpeg)\n\n**图 5.9** 使用正确移除空格的 inline-block 元素的三列页面\n\n### 创建可复用布局\n\
  \n在构建网站时，最好的方法始终编写可以在其他地方复用的模块化样式，可复用布局是可复用代码中的重要部分。布局可以使用浮动或 inline-block 元素创建，但哪种效果更好？为什么呢？\n\
  \n\n\n\n\n使用浮动（floats）还是内联块（inline-block）元素来布局页面结构，这仍然存在争议。我的方法是使用内联块元素来创建页面的网格（或布局），只有当我希望内容环绕某个特定元素时（正如浮动设计初衷用于图片那样），再使用浮动。通常情况下，我发现内联块元素更容易处理。\n\
  \n尽管如此，请使用最适合你的方法。如果你对其中一种方法感到更自在，那就尽管使用它。\n\n目前，新的 CSS 规范正在制定中——特别是基于 `flex-` 和\
  \ `grid` 的属性——它们将帮助解决如何布局页面。当这些方法开始出现时，请保持关注。\n\n## 在实践中\n\n在对可重用布局有了充分理解后，现在是时候在我们的\
  \ Styles Conference 网站中实现一个了。\n\n1. 对于 Styles Conference 网站，我们将使用 inline-block 元素创建一个三列的可重用布局。我们的实现方式将允许我们拥有三个等宽的列，或者将总宽度分配在两列之间（一列占三分之二，另一列占三分之一）。\n\
  \n首先，我们将创建定义这些列 `width` 的类。我们要的两个类是 `col-1-3`（三分之一）和 `col-2-3`（三分之二）。在 `main.css`\
  \ 文件的网格部分，让我们开始定义这些类及其相应的宽度吧。\n\n```css\n.col-1-3 {\n  width: 33.33%;\n}\n.col-2-3\
  \ {\n  width: 66.66%;\n}\n```\n\n2. 我们希望这两个列都显示为内 inline-block 元素。我们还需要确保它们的垂直对齐方式（vertical\
  \ alignment）设置为每列的 `top`。\n\n让我们创建两个新的选择器，以共享 `display` 和 `vertical-alignment` 属性样式。\n\
  \n点击此处查看代码图片\n\n```css\n.col-1-3,\n.col-2-3 {\n  display: inline-block;\n  vertical-align:\
  \ top;\n}\n```\n\n再次查看 CSS，我们创建了两个用逗号分隔的类选择器 `col-1-3` 和 `col-2-3`。第一个选择器末尾的逗号表示后面还有另一个选择器。第二个选择器后面跟着左大括号\
  \ `{`，表示后面将是样式声明。通过逗号分隔选择器，我们可以一次性将相同的样式绑定到多个选择器上。\n\n3. 我们希望在每列之间留出一些空间以帮助区分内容。我们可以通过给每列添加水平的\
  \ `padding` 来实现这一点。\n\n这种方法效果很好；但是，当两列并排时，它们之间的空间宽度将是外部到边缘空间的两倍。为了平衡这一点，我们将所有列放置在一个网格中，并为所有列添加相同的\
  \ `padding`。\n\n让我们使用类名 `grid` 来标识我们的网格，然后为我们的 `grid`、`col-1-3` 和 `col-2-3` 类指定相同的水平\
  \ `padding`。使用逗号分隔选择器后，我们的 CSS 看起来如下：\n\n点击此处查看代码图片\n\n```css\n.grid,\n.col-1-3,\n\
  .col-2-3 {\n  padding-left: 15px;\n  padding-right: 15px;\n}\n```\n\n4. 当我们设置水平\
  \ `padding` 时，需要非常小心。记得，在上一节中，我们创建了一个名为 `container` 的容器元素，用于将所有内容在 `960` 像素宽的元素上居中。目前，如果我们将类为\
  \ `grid` 的元素放在类为 `container` 的元素内部，它们的 `padding` 就会相加，我们的列看起来将无法达到页面的宽度。\n\n我们不希望这种情况发生，因此，我们必须将\
  \ `container` 规则集中的某些样式与 `grid` 规则集共享。具体来说，我们需要共享 `width` 属性和值（以确保我们的页面固定在 `960`\
  \ 像素宽）以及 `margin` 属性和值（以便让任何类为 `grid` 的元素在页面上居中）。\n\n我们将通过将旧的 `container` 规则集拆分为以下内容来实现这一点：\n\
  \n点击此处查看代码图片\n\n```css\n.container,\n.grid {\n  margin: 0 auto;\n  width: 960px;\n\
  }\n.container {\n  padding-left: 30px;\n  padding-right: 30px;\n}\n```\n\n现在，任何类为\
  \ `container` 或 `grid` 的元素都将 `960` 像素宽并在页面上居中。此外，通过将其移动到一个新的、独立的规则集中，我们保留了任何类为 `container`\
  \ 元素的现有 `padding`。\n\n5. 好了——让可重用网格样式就位的大部分工作已经完成。现在是时候处理 HTML 并观察类的性能了。\n\n我们将从\
  \ `index.html` 文件中首页上的简介（teasers）开始，将它们对齐为三列。目前，简介封装在一个类为 `container` 的 `<section>`\
  \ 元素中。我们希望将该类从 `container` 为 `grid`，以便我们可以在其中放置列。\n\n点击此处查看代码图片\n\n```html\n<section\
  \ class=\"grid\">\n  ...\n</section>\n```\n\n6. 接下来，我们希望为类为 `grid` 的 `<section>`\
  \ 元素中的每个 `<section>` 元素添加 `col-1-3` 类。\n\n点击此处查看代码图片\n\n```html\n<section class=\"\
  grid\">\n  <section class=\"col-1-3\">\n    ...\n  </section>\n  <section class=\"\
  col-1-3\">\n    ...\n  </section>\n  <section class=\"col-1-3\">\n    ...\n  </section>\n\
  </section>\n```\n\n7. 最后，由于我们的每列都是 inline-block 元素，我们希望确保移除它们之间的空空白区域。我们将使用注释来实现这一点，并顺便添加一些文档说明，记录每个即将出现的章节，以便更好地组织代码。\n\
  \n点击此处查看代码图片\n\n```html\n<section class=\"grid\">\n  <!-- Speakers -->\n  <section\
  \ class=\"col-1-3\">\n    ...\n  </section>\n  <!-- Schedule -->\n  <section class=\"\
  col-1-3\">\n    ...\n  </section>\n  <!-- Venue -->\n  <section class=\"col-1-3\"\
  >\n    ...\n  </section>\n</section>\n```\n\n\n\n\n\n有时我们需要精确地定位一个元素，但浮动（floats）或内联块（inline-block）元素无法达到这一效果。浮动会将元素从页面流中移除，这通常会导致周围元素绕过浮动元素流动，从而产生意外的结果。对于内联块元素，除非是在创建列，否则要让它们处于正确的位置会相当困难。针对这些情况，我们可以使用\
  \ `position` 属性结合盒偏移属性（box offset properties）。\n\n`position` 属性确定了元素在页面上*如何*进行定位的，以及它是否会出现在文档的正常流中。它通常与盒偏移属性——`top`、`right`、`bottom`\
  \ 和 `left`——配合使用，这些属性通过在多个方向上移动元素，精确确定元素将定位在*何处*。\n\n默认情况下，每个元素的 `position` 值都是\
  \ `static`，这意味着它存在文档的正常流中，并且不接受任何盒偏移属性。`static` 值最常被覆盖为 `relative` 或 `absolute`\
  \ 值，我们将在接下来进行探讨。\n\n### 相对定位\n\n`position` 属性的 `relative` 值允许元素出现在页面的正常流中，在按预期为元素留出空间的同时，不允许其他元素绕过它；然而，它也允许通过盒偏移属性修改元素的显示位置。例如，考虑以下\
  \ HTML 和 CSS（参见**图 5.11**）：\n\n**HTML**\n\n点击此处查看代码图片\n\n1. `<<div>>...</div>`\n\
  2. `<div class=\"offset\">...</div>`\n3. `<<div>>...</div>`\n\n**CSS**\n\n点击此处查看代码图片\n\
  \n```css\ndiv {\n  border: 1px solid #949599;\n  height: 200px;\n  width: 200px;\n\
  }\n.offset {\n  left: 20px;\n  position: relative;\n  top: 20px;\n}\n```\n\n![Image](img/00038.jpeg)\n\
  \n**图 5.11** 包含 left 和 top 盒偏移属性的相对定位元素\n\n在这里，第二个 `<div>` 元素（类名为 `offset` 的元素）其\
  \ `position` 值为 `relative`，并包含两个盒偏移属性 `left` 和 `top`。这保留了元素的原始位置，并且不允许其他元素移动到该空间。此外，盒偏移属性重新定位了元素，将其从其原始位置向左侧推\
  \ `20` 像素，从顶部推 `20` 像素。\n\n对于相对定位的元素，重要的是要知道盒偏移属性确定了元素根据其原始位置将移动到何处。因此，值为 `20` 像素的\
  \ `left` 属性实际上会将元素从左侧向右推 `20` 像素。然后，值为 `20` 像素的 `top` 属性会将元素从顶部向下推 `20` 像素。\n\n\
  当我们使用盒偏移属性定位元素时，该元素会重叠在其下元素上，而不是像 `margin` 或 `padding` 属性那样将该元素向下移动。\n\n### 绝对定位\n\
  \n`position` 属性的 `absolute` 值与 `relative` 值不同，因为 `position` 值为 `absolute` 的元素不会出现在文档的正常流中，且绝对定位元素的原始空间和位置不会被保留。\n\
  \n此外，绝对定位的元素相对于其最近的相对定位父元素进行移动。如果不存在相对定位的父元素，则绝对定位元素将相对于 `<body>` 元素进行定位。这些信息很多，让我们通过代码来看看它是如何运作的（参见**图\
  \ 5.12**）：\n\n**HTML**\n\n点击此处查看代码图片\n\n1. `<section>`\n2. `<div class=\"offset\"\
  >...</div>`\n3. `</section>`\n\n**CSS**\n\n点击此处查看代码图片\n\n```css\nsection {\n  position:\
  \ relative;\n}\ndiv {\n  position: absolute;\n  right: 20px;\n  top: 20px;\n}\n\
  ```\n\n\n\n\n帮助澄清字体类型（typeface）与字体（font）之间区别的一种方法，是将它们类比为歌曲和 MP3。字体类型（typeface）非常像歌曲，因为它是一件艺术品。它由一位或多位艺术家创作，并向公众开放解释。另一方面，字体（font）非常像\
  \ MP3，因为它本身并不是艺术表现形式，而只是传递艺术价值的方法。\n\n***\n\n### 为文本添加颜色\n\n通常，我们在构建网站时做出的首要决定之一是选择将使用的主要字体类型和文本颜色。虽然还有许多其他属性可以更改——如大小、粗细等——但字体和文本颜色通常对页面的外观和可读性影响最大。放弃浏览器的默认设置并使用我们自己的字体和文本颜色，会立即为我们的页面奠定调。\n\
  \n我们唯一需要设置文本颜色的属性是 `color` 属性。`color` 属性接受一种颜色值，但可以有许多不同的格式。正如我们在第 3 Lesson 中讨论的那样，“了解\
  \ CSS”，这些格式包括关键字、十六进制值、RGB、RGBa、HSL 和 HSLa 值。十六进制值是最常见的，因为它们能以最少的努力提供最强的控制。\n\n\
  让我们来看更改页面上 `<html>` 元素内所有文本颜色所需的 CSS：\n\n```css\nhtml {\n  color: #555;\n}\n```\n\
  \n### 更改字体属性\n\nCSS 提供了许多不同的属性来编辑页面上文本的外观和感受。这些属性分为两类：基于字体的属性和基于文本的属性。这些属性中的大多数将以\
  \ `font-*` 或 `text-*` 开头。首先，我们将讨论基于字体的属性。\n\n#### 字体族 (Font Family)\n\n`font-family`\
  \ 属性用于声明应该使用哪种字体——以及使用哪种备用或替换字体来显示文本。`font-family` 属性的值包含多个字体名称，所有名称用逗号隔开。\n\n从左侧开始的第一个字体是首选字体。如果第一个字体可用，则按照从左到右的偏好顺序在其后声明备用字体。\n\
  \n由两个或多个单词组成的字体名称需要括在引号中。此外，最后一个字体应该是关键字值，它将为指定类型的系统默认字体，最常见的是 `sans-serif` 或 `serif`。\n\
  \n`font-family` 属性的用法如下：\n\n点击此处查看代码图像\n\n```css\nbody {\n  font-family: \"Helvetica\
  \ Neue\", Helvetica, Arial, sans-serif;\n}\n```\n\n在这种情况下，`Helvetica Neue` 是首选的字体。如果该字体在给定设备上不可或未安装，将使用列表中的下一个字体——Helvetica，依此类推。\n\
  \n#### 字体大小号 (Font Size)\n\n`font-size` 属性提供了使用常用长度值设置文本大小的能力，包括像素、em 单位、百分比、点或\
  \ `font-size` 关键字。\n\n这里 CSS 正在 `<body>` 元素上设置 `14` 像素的 `font-size`：\n\n```css\n\
  body {\n  font-size: 14px;\n}\n```\n\n#### 字体样式 (Font Style)\n\n要将文本更改为斜体或防止文本变为斜体，我们将使用\
  \ `font-style` 属性。`font-style` 属性接受四个关键字值：`normal`、`italic`、`oblique` 和 `inherit`。在这四个值中，最常用的是\
  \ `italic`（将文本设置为斜体）和 `normal`（将文本恢复为正常样式）。\n\n以下 CSS 将所有类为 `special` 的元素设置为包含 `italic`\
  \ 的 `font-style`：\n\n```css\n.special {\n  font-style: italic;\n}\n```\n\n#### 字体变体\
  \ (Font Variant)\n\n这种情况并不常见，但有时文本需要设置为小型大写字母，也称为 small caps。对于这种特定情况，我们将使用 `font-variant`\
  \ 属性。`font-variant` 属性接受三个值：`normal`、`small-caps` 和 `inherit`。最常见的值是 `normal` 和\
  \ `small-caps`，用于在普通和小写大写变体之间切换字体类型。\n\n要切换所有类为 `firm` 的元素，我们将使用 `small-caps` 的\
  \ `font-variant`：\n\n点击此处查看代码图像\n\n```css\n.firm {\n  font-variant: small-caps;\n\
  }\n```\n\n#### 字体粗细 (Font Weight)\n\n偶尔，我们想要将文本样式化为粗体或更改字体类型的特定权重。对于这些情况，我们将使用 `font-weight`\
  \ 属性。`font-weight` 属性接受关键字或数值。\n\n关键字包括 `normal`、`bold`、`bolder`、`lighter` 和 `inherit`。在这些关键字值中，建议主要使用\
  \ `normal` 和 `bold` 将文本从普通变为粗体，反之亦然。与其使用关键字值 `bolder` 或 `lighter`，不如使用数值进行更具体的控制。\n\
  \n在实践中，这里是为任何类为 `daring` 的元素将 `font-weight` 设置为 `bold` 的 CSS：\n\n```css\n.daring\
  \ {\n  font-weight: bold;\n}\n```\n\n\n\n\n\n作为简写值，这些属性值从左到右列出，不使用逗号（字体名称除外，因为 `font-family`\
  \ 属性值使用了逗号）。在 `font-size` 和 `line-height` 属性值之间需要一个正斜线 `/` 分隔符。\n\n在使用此简写值时，每个属性值都是可选的，*除了*\
  \ `font-size` 和 `font-family` 属性值。话虽如此，如果我们愿意，可以在简写值中只包含 `font-size` 和 `font-family`\
  \ 属性值。\n\n点击此处查看代码图像\n\n```css\nhtml {\n  font: italic small-caps bold 14px/22px\
  \ \"Helvetica Neue\",\n    Helvetica, Arial, sans-serif;\n}\n```\n\n## 字体属性汇总\n\n\
  让我们来看一个结合使用了所有这些 `font` 属性的示例。下面的 HTML 和 CSS 展示了文本样式化时的不同可能性；这段代码的最终结果可以在**图 6.1**中看到。\n\
  \n![图像](img/00040.jpeg)\n\n**图 6.1** 使用字体属性的示例博客文章预览\n\n### HTML\n\n点击此处查看代码图像\n\
  \n```html\n<h2><a href=\"#\">我是一名构建者</a></h2>\n<p class=\"byline\">由 Shay Howe 发布</p>\n\
  <p>每天我都能看到设计师和开发者并肩工作。他们明智地工作以追求业务目标。他们勤奋地打造卓越的产品。他们解决现实问题并为自己的工作感到自豪。他们是构建者。<a\
  \ href=\"#\">继续&#8230;</a></p>\n```\n\n### CSS\n\n点击此处查看代码图像\n\n```css\nh2,\np {\n\
  \  color: #555;\n  font: 13px/20px \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n\
  }\na {\n  color: #648880;\n}\na:hover {\n  color: #293f50;\n}\nh2 {\n  font-size:\
  \ 22px;\n  font-weight: bold;\n  margin-bottom: 6px;\n}\n.byline {\n  color: #8c8c8c;\n\
  \  font-family: Georgia, Times, \"Times New Roman\", serif;\n  font-style: italic;\n\
  }\n```\n\n## CSS 伪类\n\n这里的演示使用了 `:hover` CSS 伪类，这是我们以前从未见过的。作为参考，伪类是可能添加到选择器末尾的关键字，用于在元素处于唯一状态时对其进行样式化。\n\
  \n`:hover` 伪类在用户鼠标悬停在元素上时对该元素设置样式。当与 `<a> 元素一起使用时（所示），所有 `<a>` 元素在悬停时都将获得独特的样式。现在，我们的\
  \ `<a>` 元素将在被悬停时改变颜色。\n\n## 实践中\n\n回到我们的样式会议网站，让我们开始添加一些字体属性。\n\n**1.** 我们将从更新所有文本的字体开始。为了做到这一点，我们将对\
  \ `<body>` 元素应用样式。我们将从颜色开始，还将通过 `font` 属性和简写值添加 `font-weight`、`font-size`、`line-height`\
  \ 和 `font-family` 值。\n\n为了尽可能保持我们的 `main.css` 文件整洁，让我们为这些自定义样式创建一个新章节，将其放置在重置（reset）样式下方、网格样式上方。\n\
  \n我们需要添加以下内容：\n\n点击此处查看代码图像\n\n```css\n/*\n  =========================\n  自定义样式\n\
  \  =========================\n*/\nbody {\n  color: #888;\n  font: 300 16px/22px\
  \ \"Open Sans\", \"Helvetica Neue\",\n    Arial, sans-serif;\n}\n```\n\n**2.** 在第\
  \ 4 节“[打开盒子”中，我们开始设置一些排版样式，特别是为几级标题添加了 `margin`。在 `main.css` 文件的同一章节中，让我们为一级到四级标题添加颜色。\n\
  \n```css\nh1, h2, h3, h4 {\n  color: #648880;\n}\n```\n\n顺便说一下，让我们也为这些标题级别添加字体大小。我们的\
  \ `<h1>` 和 `<h2>` 元素将使用较大的 `font-size` 值；因此，我们还希望增加它们的 `line-height` 值，以保持这些元素内的文本。作为参考，我们将它们的\
  \ `line-height` 值设置为 44 像素，这是 `<body>` 元素规则中设置的基础 `line-height` 值的两倍。\n\n点击此处查看代码图像\n\
  \n```css\nh1 {\n  font-size: 36px;\n  line-height: 44px;\n}\nh2 {\n  font-size:\
  \ 24px;\n  line-height: 44px;\n}\nh3 {\n  font-size: 21px;\n}\nh4 {\n  font-size:\
  \ 18px;\n}\n```\n\n**3.** 我们的 `<h5>` 元素将比其他标题稍微独特一点。因此，我们将稍微更改它们的样式。我们将为这些元素使用不同的\
  \ `color` 属性值和稍小的 `font-size`，并将 `font-weight` 更改为 `400` 或 `normal`。\n\n默认情况下，浏览器以\
  \ `bold` 的 `font-weight` 渲染标题。然而，我们的标题目前都被设置为 `300` 的 `font-weight`。我们在 `main.css`\
  \ 文件顶部的重置将 `font-weight` 改为了 `normal`，然后我们在 `<body>` 元素规则集中的 `font-weight: 300`\
  \ 将所有标题更改为 `300` 的 `font-weight`。\n\n`<h5>` 元素将比其他标题稍微独特一点。因此，我们将稍微更改它们的样式。`<h5>`\
  \ 元素比其他字体粗一点。\n\n```css\nh5 {\n  color: #a9b2b9;\n  font-size: 14px;\n  font-weight:\
  \ 400;\n}\n```\n\n**4.** 我们在样式表开头的重置重置了 `<strong>`、`<cite>` 和 `<em>` 元素的默认样式。对于\
  \ `<strong>` 元素，我们将设置 `400` 的 `font-weight`。对于 `<cite>` 和 `<em>` 元素，我们将希望设置为 `italic`。\n\
  \n```css\nstrong {\n  font-weight: normal;\n}\ncite,\nem {\n  font-style: italic;\n\
  }\n```\n\n**5.** 我们良好，让我们通过为锚元素添加一些样式来继续。它们目前是默认的蓝色。让它们具有与 `<h1>` 到 `<h4>` 标题元素相同的\
  \ `color`。此外，让我们使用 `:hover` 伪类在用户悬停在锚点时将颜色更改为灰色。\n\n点击此处查看代码图像\n\n```css\n/*\n \
  \ =========================\n  链接\n  =========================\n*/\na {\n  color:\
  \ #648880;\n}\na:hover {\n  color: #a9b2b9;\n}\n```\n\n**6.** 现在让我们看看我们的 `<header>`\
  \ 元素并更新那里的样式。我们将通过在 `logo` 集中添加 `font-size` 和 `line-height` 属性来开始更新标志。加上现有的 `border-top`、`float`\
  \ 和 `padding` 属性，新的规则集应该是：\n\n```css\n.logo {\n  border-top: 4px solid #648880;\n\
  \  float: left;\n  font-size: 48px;\n  line-height: 44px;\n  padding: 40px 0 22px\
  \ 0;\n}\n```\n\n**7.** 因为我们大幅增加了标志的大小，让我们为 `<header>` 元素内的 `<h3>` 元素添加 `margin`\
  \ 以平衡。我们将通过在 `<h3>` 元素上放置 `tagline` 类属性值，然后在我们的 CSS 中使用该类来应用正确的边距。\n\n不要忘记对 `<h3>`\
  \ 元素的更改需要在每个页面上进行。\n\n**HTML**\n\n点击此处查看代码图像\n\n```html\n<h3 class=\"tagline\">8\
  \ 月 24 日&ndash;26 日 &mdash; 芝加哥，伊利诺州</h3>\n```\n\n**CSS**\n\n```css\n.tagline {\n\
  \  margin: 66px 0 22px 0;\n}\n```\n\n\n\n\n\n## 8. 在类属性值为 `tagline` 的 `<h3>` 元素之后是一个\
  \ `<nav>` 元素。让我们给 `<nav>` 元素添加 `class` 属性值 `primary-nav`，并添加 `font-size` 和 `font-weight`\
  \ 属性，使导航栏在头部其他部分脱颖而出。\n\n### HTML\n点击此处查看代码图像\n\n```html\n<nav class=\"primary-nav\"\
  >\n  ...\n</nav>\n```\n\n### CSS\n```css\n.primary-nav {\n  font-size: 14px;\n \
  \ font-weight: 400;\n}\n```\n\n## 9. 既然 `<header>` 元素的形状已经稍微好一点了，让我们也来看看 `<footer>`\
  \ 元素。使用 `primary-footer` 类，让我们更改 `<footer>` 元素内所有文本的 `color` 和 `font-size`。此外，我们将\
  \ `<small>` 元素的 `font-weight` 增加到 `400`。\n\n加上现有样式，我们主页脚部分的样式应该像这样：\n\n点击此处查看代码图像\n\
  \n```css\n.primary-footer {\n  color: #648880;\n  font-size: 14px;\n  padding-bottom:\
  \ 44px;\n  padding-top: 44px;\n}\n.primary-footer small {\n  float: left;\n  font-weight:\
  \ 400;\n}\n```\n\n## 10. 我们也稍微更新一下主页。我们将从英雄区域（hero section）开始，将该区域的整体 `line-height`\
  \ 到 `44` 像素。我们还将让该区域内的文本更大，将 `<h2>` 元素的 `font-size` 增加到 `36` 像素，并将 `<p>` 元素的 `font-size`\
  \ 增加到 `24` 像素。\n\n通过使用现有的 `hero` 类选择器并为 `<h2>` 和 `<p>` 元素创建新的选择器来实现所有这些更改。我们英雄区域的样式现在将拆分：\n\
  \n点击此处查看代码图像\n\n```css\n.hero {\n  line-height: 44px;\n  padding: 22px 80px 66px\
  \ 80px;\n}\n.hero h2 {\n  font-size: 36px;\n}\n.hero p {\n  font-size: 24px;\n}\n\
  ```\n\n## 11. 最后，我们在主页上有一个小问题需要修复。之前，当用户悬停在所有锚点元素上，我们为它们设置了浅灰色颜色值。这效果很好，但主页上的三个简介（teasers）除外，这里的锚点元素包裹了\
  \ `<h3>` 和 `<h5>` 元素。由于 `<h3>` 和 `<h5>` 元素有自己的 `color` 定义，它们不受之前 `:hover` 伪类样式的影响。\n\
  \n幸运的是我们可以修复这个问题，尽管这需要一个相当复杂的选择器。我们首先为主页上的三列都添加 `class` 属性值 `teaser`。稍后我们将使用此类作为限定选择器。\n\
  \n点击此处查看代码图像\n\n```html\n<section class=\"grid\">\n  <!-- Speakers -->\n  <section\
  \ class=\"teaser col-1-3\">\n    <a href=\"speakers.html\">\n      <h5>Speakers</h5>\n\
  \      <h3>World-Class Speakers</h3>\n    </a>\n    <p>从世界各地加入我们的是士有二十多位极佳的演讲者，他们来到这里分享自己的故事。</p>\n\
  \  </section>\n  ...\n</section>\n```\n\n在有了限定类之后，我们准备好进行一些 CSS 重型工作并创建一个复杂的选择器了。我们将从\
  \ `teaser` 类开始编写选择器，因为我们只想针对类名为 `teaser` 的元素内部的元素。从那里开始，我们想要对被悬停的锚点元素应用样式；我们将添加\
  \ `a` 类型选择器以及 `:hover` 伪类。最后，我们将添加 `h3` 类型选择器，以选择我们想要应用的实际 `<h3>` 元素。\n\n总之，我们为这些\
  \ `<h3>` 元素的选择器和样式将如下：\n\n```css\n.teaser a:hover h3 {\n  color: #a92b9;\n}\n```\n\
  \n呼，这确实不少。好消息是我们的样式会议主页开始看起来非常漂亮了，并且显示出了一点个性（见图 6.2](#part0012.html_ch02)）。\n\n\
  ![图像](img/00041.jpeg)\n\n图 6.2 样式会议网站收到了许多字体属性的喜爱\n\n### 应用文本属性\n\n知道如何设置字体族、大小、变体、字重和行高只赢得了一半战斗。此外，我们还可以决定如何对齐、装饰、缩进和间距化文本。让我们从文本对齐开始。\n\
  \n#### 文本对齐 (Text Align)\n对齐文本是建立页面节奏和流动的重要部分；我们使用 `text-align` 属性来实现这一点。`text-align`\
  \ 属性有四个值：`left`、`right`、`center` 和 `justify`。\n\n`text-align` 属性默认值是左对齐。以下 CSS 将所有段落设置为居中对：\n\
  \n```css\np {\n  text-align: center;\n}\n```\n\n#### 文本装饰 (Text Decoration)\n`text-decoration`\
  \ 属性提供了许多装饰文本的方法。它接受关键字值 `none`、`underline`、`overline`、`line-through` 和 `inherit`。\n\
  \n多个 `text-decoration` 值可以通过用空格分隔每个关键字来同时应用于元素。\n\n此处的 CSS 为类为 `note` 的任何元素应用下划线：\n\
  \n点击此处查看代码图像\n\n```css\n.note {\n  text-decoration: underline;\n}\n```\n\n#### 文本缩进\
  \ (Text Indent)\n`text-indent` 属性可以缩进元素的第一行，这在出版物中常见。此属性所有常用的长度值，包括像素、磅、百分比等。正值将向内缩进，而负值将向外缩进。\n\
  \n在这里，CSS 将所有 `<p>` 元素的内缩进 20 像素：\n\n```css\np {\n  text-indent: 20px;\n}\n```\n\
  \n#### 文本阴影 (Text Shadow)\n`text-shadow` 属性允许我们为文本添加一个或多个阴影。该属性通常接受四个值，从左到右依次排列。前三个值是长度，最后一个值是颜色。\n\
  \n在三个长度值中，第一个值决定阴影的水平偏移，第二个值决定阴影的垂直偏移，第三个值决定阴影的模糊半径。第四个最后一个值是阴影的颜色，可以是 `color` 属性中使用的任何颜色值。\n\
  \n这里的 `text-shadow` 属性为所有 `<p>` 元素文本投了一个 30% 透明的黑色阴影，向右 3 像素，向下 6 像素，并模糊 2 像素：\n\
  \n```css\np {\n  text-shadow: 3px 6px 2px rgba(0, 0, 0, .3);\n}\n```\n\n\n\n\n\n\
  `text-shadow` 属性专门为元素的文本添加阴影。如果我们想在整个元素上放置阴影，可以使用 `box-shadow` 属性。`box-shadow` 属性的工作原理与\
  \ `text-shadow` 属性相同，都接受水平和垂直偏移、模糊和颜色的值。\n\n`box-shadow` 属性还接受一个可选的第四个长度值（位于颜色值之前），用于阴影的扩展半径（spread）。作为一个正长度值，扩展半径将使阴影扩大，使其比应用的元素尺寸更大；而作为一个负长度值，扩展半径将收缩阴影，使其比应用的元素尺寸更小。\n\
  \n最后，`box-shadow` 属性可以在值的开头包含一个可选的 `inset` 值，以便将阴影放置在元素内部而不是元素外部。\n\n## 文本变换\n\n\
  与 `font-variant` 属性类似，还有一个 `text-transform` 属性。虽然 `font-variant` 属性寻找的是字体的备变体，但\
  \ `text-transform` 属性可以在不需要备字体的情况下直接内联更改文本。`text-transform` 属性接受五个值：`none`、`capitalize`、`uppercase`、`lowercase`\
  \ 和 `inherit`。\n\n`capitalize` 值将每个单词的首字母大写，`uppercase` 值将每个字母都大写，而 `lowercase`\
  \ 值将每个字母都变为小写。使用 `none` 将将这些继承的任何值还原为原始文本样式。\n\n以下 CSS 设置所有 `<p>` 元素的文本显示为全大写：\n\
  \n点击此处查看代码图像\n\n```css\np {\n  text-transform: uppercase;\n}\n```\n\n## 字母间距\n\n\
  使用 `letter-spacing` 属性，我们可以调整页面上字母之间的间距（或字间距）。正长度值将把字母推得更开，而负长度值将把字母拉得更近。关键字值 `none`\
  \ 将字母之间的间距恢复为正常大小。\n\n在 `letter-spacing` 属性上使用相对长度值有助于确保在更改文本的 `font-size` 时，保持字母之间正确的间距。不过，双重检查我们的工作始终是一个好主意。\n\
  \n通过这里的 CSS，我们 `<p>` 元素中的所有字母将彼此靠近 `.5` em：\n\n点击此处查看代码图像\n\n```css\np {\n  letter-spacing:\
  \ -.5em;\n}\n```\n\n## 单词间距\n\n与 `letter-spacing` 属性类似，我们还可以使用 `word-spacing` 属性调整元素内单词之间的间距。`word-spacing`\
  \ 属性接受与 `letter-spacing` 属性相同的长度值和关键字。然而，`word-spacing` 属性不是将字母分开，而是将这些值应用于单词之间。\n\
  \n在这里，`<p>` 元素内的每个单词之间的间距将为 `.25` em。\n\n点击此处查看代码图像\n\n```css\np {\n  word-spacing:\
  \ .25em;\n}\n```\n\n## 文本属性汇总\n\n让我们重新回顾之前的博客预告演示，这次在我们在基于 `font` 的属性基础上添加了一些基于\
  \ `text` 的属性。结果可以在 图 6.3 中看到。\n\n![Image](img/00042.jpeg)\n\n**图 6.3** 使用基于 `font`\
