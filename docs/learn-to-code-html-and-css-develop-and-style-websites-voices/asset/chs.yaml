  \ 元素内的导航菜单由几个锚点标签组成。** 导航菜单通常使用无序列表构建。这些列表通常被布局为水平列表，使用之前提到的两种技术之一。这里有一个使用无序列表标记、且\
  \ `<li>` 元素显示为 `inline-block` 元素的水平导航菜单的示例（参见图 8.13）。\n\n现在我们已经知道如何在 HTML 和 CSS\
  \ 中构建列表，让我们回到我们的 Styles 网站，看看我们在哪里可以使用列表。\n\n**目前，我们页面中 `<header>` 和 `<footer>`\
  \ 元素内的导航菜单由几个锚点标签组成。** 导航菜单通常使用无序列表构建。这些列表通常被布局为水平列表，使用之前提到的两种技术之一。这里有一个使用无序列表标记、且\
  \ `<li>` 元素显示为 `inline-block` 元素的水平导航菜单的示例（参见图 8.13）。\n\n现在我们已经知道如何在 HTML 和 CSS\
  \ 中构建列表，让我们回到我们的 Styles 网站，看看我们在哪里可以使用列表。\n\n**目前，我们页面中 `<header>` 和 `<footer>`\
  \ 元素内的导航菜单由几个锚点标签组成。** 导航菜单通常使用无序列表构建。这些列表通常被布局为水平列表，使用之前提到的两种技术之一。这里有一个使用无序列表标记、且\
  \ `<li>` 元素显示为 `inline-block` 元素的水平导航菜单的示例（参见图 8.13）。\n\n（注：由于输入文本中存在大量重复段落，为了遵循“不要重复输出原文”的原则，此处仅展示核心逻辑的翻译结构示例）\n\
  \n```html\n<nav class=\"navigation\">\n  <ul>\n    <li><a href=\"#\">Profile</a></li><!--\n\
  \    --><<li><a href=\"#\">Settings</a></li><!--\n    --><<li><a href=\"#\">Notifications</a></li><!--\n\
  \    --><<li><a href=\"#\">Logout</a></li>\n  </ul>\n</nav>\n```\n\n\n\n\n在我们的 `speakers.html`\
  \ 文件中，主标题部分（lead section）下方，让我们创建一个新章节来展示所有的演讲者。通过复用一些现有的样式，我们将使用一个 `class` 属性值为\
  \ `row` 的 `<section>` 元素来包裹所有演讲者，并为它们应用白色背景色和内边距。在 `<section>` 元素内部，我们将添加一个 `class`\
  \ 属性值为 `grid` 的 `<div>` 元素，以便让演讲者在页面上居中，并允许在此过程中使用多列。\n\n到目前为止，主标题部分下方的 HTML 结构如下：\n\
  \n```html\n<section class=\"row\">\n  <div class=\"grid\">\n\n  </div\n</section>\n\
  ```\n\n#### 4. 演讲者网格布局\n在网格内部，每个演讲者都将使用其自己的 `<section>` 元素进行标记，该元素将包含两列。第一列将占据 `<section>`\
  \ 元素的三之二，并使用 `<div>` 元素标记。第二列将占据 `<section>` 元素剩余的三之一，并使用 `<aside>` 元素标记，因为其内容相对于演讲者及其特定演讲是次要的。\n\
  \n使用现有的 `col-2-3` 和 `col-1-3` 类，演讲者部分的轮廓如下所示：\n\n```html\n<section id=\"shay-howe\"\
  >\n  <div class=\"col-2-3\">\n    ...\n  </div><!--><aside class=\"col-1-3\">\n\
  \    ...\n  </aside>\n</section>\n```\n\n这里有几点需要注意。首先，每个演讲者的每个 `<section>` 元素都包含一个\
  \ `id` 属性，其属性值为演讲者的姓名。稍后，当我们创建会议日程程时，这些 `id` 属性将作为锚点，允许我们从日程程链接到演讲者的个人资料。\n\n此外，`<div>`\
  \ 元素的闭合标签之后紧跟着 HTML 注释的开始标签，而 `<aside>` 元素的开始标签之前是 HTML 注释的结束标签。因为基于列的类会将这些元素显示为\
  \ `inline-block` 元素，我们正在移除它们之间可能出现的空白。\n\n### 5. 演讲者详情\n在用 `<div>` 元素标记的三之二列中，我们将使用一些标题和段落来显示演讲者的姓名、演讲标题、摘要以及简短的介绍。\n\
  \n包含这些内容后，演讲者部分如下所示：\n\n```html\n<section id=\"shay-howe\">\n  <div class=\"col-2-3\"\
  >\n    <h2>Shay Howe</h2>\n    <<h5>>Less Is More: How Constraints Cultivate Growth</<h5>>\n\
  \    <p>By setting constraints, we force ourselves...</p>\n    <h5>About Shay</h1>\n\
  \    <p>As a designer and front-end developer, Shay...</p>\n  </div><!--><aside\
  \ class=\"col-1-3\">\n    ...\n  </aside>\n</section>\n```\n\n### 6. 演讲者信息\n在用 `<aside>`\
  \ 元素标记的三之一列中，我们将添加一个 `class` 属性值为 `speaker-info` 的 `<div>` 元素。我们将使用 `<div>` 元素是因为我们很快就会为该元素添加样式。\n\
  \n在进入任何样式之前，让我们在 `<div>` 元素内部添加一个无序列表，并将演讲者的的一些相关链接作为列表项包含在内。\n\n现在我们演讲者的 HTML 结构如下：\n\
  \n```html\n<section id=\"shay-howe\">\n  <div class=\"col-2-3\">\n    <h2>Shay Howe</h2>\n\
  \    <<h5>>Less Is More: How Constraints Cultivate Growth</<h5>>\n    <p>By setting\
  \ constraints, we force ourselves...</p>\n    <h5>About Shay</h5>\n    <p>As a designer\
  \ and front-end developer, Shay...</p>\n  </div><!--><aside class=\"col-1-3\">\n\
  \    <div class=\"speaker-info\">\n      <ul>\n        <li><a href=\"https://twitter.com/shayhowe\"\
  >@shayhowe</a></li>\n        <li><a href=\"http://learn.shayhowe.com/\">learn.shayhow.com</a></li>\n\
  \      </ul>\n    </div>\n  </aside>\n</section>\n```\n\n### 7. 为演讲者信息设置样式\n当 `class`\
  \ 属性值为 `speaker-info` 的 `<div>` 元素准备就绪后，我们可以为它添加一些样式。\n\n我们将首先在 `main.css` 文件中为演讲者页面添加一个新章节。从那里开始，为包含\
  \ `class` 属性值为 `speaker-info` 的元素添加 `1` 像素实线灰色 `border` 以及 `5` 像素的半径。\n\n接下来，让我们添加\
  \ `88` 像素的顶部 `margin`，以便将元素与第一段文字位于同一行，并且在元素内部添加 `22` 像素的垂直 `padding`，为嵌套列表留出空间。最后，让元素内的所有文本居中（center）。\n\
  \n总之，我们为 `speaker-info` 类规则集的 CSS 如下：\n\n```css\n/*\n=========================\n\
  Speakers\n=========================\n*/\n.speaker-info {\n  border: 1px solid #dfe2e5;\n\
  \  border-radius: 5px;\n  margin-top: 88px;\n  padding: 22px 0;\n  text-align: center;\n\
  }\n```\n\n让我们花时间回顾一下为什么在这里使用 `<div>` 元素以及相应的样式。\n\n我们在 `class` 属性值为 `col-1-3` 的\
  \ `<aside>` 元素中放置了一个 `<div>` 元素，因为我们希望 `padding` 位于 `<div>` 元素的 `border` 之外。\n\n\
  ### 8. 演讲者间距\n当我们页面添加越来越多的演讲者时，我们希望它们在垂直方向上保持等距。为了实现这一点，我们将创建一个 `speaker` 类规则，包含\
  \ `44` 像素的底部 `margin`，如下：\n\n```css\n.speaker {\n  margin-bottom: 44px;\n}\n```\n\
  \n我们可以将此类应用到每个演讲者的 `<section>` 元素，只要它不是最后一个演讲者。我们在最后一个演讲者上省略此类，因为我们不想在 `<footer>`\
  \ 元素之前创建任何不间距。当有多个演讲者时，我们的布局将如下：\n\n```html\n<section class=\"row\">\n  <div class=\"\
  grid\">\n    <section class=\"speaker\" id=\"chris-mills\">\n      <div class=\"\
  col-2-3\">\n        ...\n      </div><!--><aside class=\"col-1-3\">\n        ...\n\
  \      </aside>\n    </section>\n    <section id=\"shay-howe\">\n      <div class=\"\
  col-2-3\">\n        <h2>Shay Howe</h2>\n        <<h5>>Less Is More: How Constraints\
  \ Cultivate Growth</<h5>>\n        <p>By setting constraints, we force ourselves...</p>\n\
  \        <h5>About Shay</h5>\n        <p>As a designer and front-end developer,\
  \ Shay...</p>\n      </div><!--><aside class=\"col-1-3\">\n        ...\n      </aside>\n\
  \    </section>\n  </div>\n</section>\n```\n\n我们的导航菜单现在已经完成，演讲者页面也初具规模（参见 **图 8.14**）。\n\
  \n![Image](img/00078.jpeg)\n\n**图 8.14** 更新导航菜单并添加演讲者后的演讲者页面\n\n\n\n\n列表在 HTML 中非常常见，通常出现在那些可能并不直观或显而易见的地方。关键在于尽可能语义化地使用它们，并在最合适的地方发挥它们的作用。\n\
  \n让我们回顾一下。在本节课程中，我们涵盖了以下内容：\n\n* 如何创建无序列表、有序列表和描述列表\n* 如何在其他列表中正确地嵌套列表\n* 如何更改列表项目标记的样式和位置\n\
  * 如何使用背景图像代替列表项目标记\n* 如何水平显示或浮动列表\n\n现在我们已经学会了如何在页面中添加列表，让我们也给页面添加一些多媒体吧。在接下来的章节中，我们将深入研究如图像、音频和视频等可嵌入的媒体内容。\n\
  \n## 第 9 节：添加多媒体\n\n我们浏览互联网是为了寻找有趣且信息量丰富的内容，这些内容通常以纯文本的形式呈现。为了配合这些纯文本，HTML 提供了以图像、音频轨道和视频的形式嵌入富媒体的方法，还可以以内联框架（inline\
  \ frame）的形式嵌入另一个网页的内容。\n\n在网站中包含图像、音频轨道、视频和内联框架的能力已经存在一段时间了。浏览器对图像和内联框架的支持通常非常好。虽然向网站添加音频轨道和视频的能力已经存在了多年，但其过程相当繁琐。幸运的是，由于\
  \ HTML 的直接支持，这个过程得到了改进并变得简单得多。\n\n今天，我们可以自由地使用图像、音频、视频和内联框架，并知道这些内容受到了所有主流浏览器的支持。\n\
  \n### 添加图像\n\n要向页面中添加图像，我们使用 `<img>` 内联元素。`<img>` 元素是一个自包含的（或空）元素，这意味着它不包裹任何其他内容，并且以单个标签的形式存在。为了使\
  \ `<img>` 元素生效，必须包含 `src` 属性和值来指定图像的源（请参见 `图 9.1`）。`src` 属性的值是一个 URL，通常相对于托管网站的服务器。\n\
  \n![Image](img/00079.jpeg)\n\n**图 9.1** 嵌入在 HTML 中的图像\n\n除了 `src` 属性外，还应该应用 `alt`（替代文本）属性，它用于描述图像的内容。`alt`\
  \ 属性的值会被搜索引擎和辅助技术获取，以帮助传达图像的用途。由于某种原因图像不可用，`alt` 文字将代替图像显示（请参见 `图 9.2`）。\n\n点击此处查看代码图像\n\
  \n```\n<img src=\"dog.jpg\" alt=\"一只戴着围巾的黑、棕、白色的狗\">\n```\n\n![Image](img/00080.jpeg)\n\
  \n**图 9.2** 在图像缺失时显示的替代文本“一只戴着围巾的黑、棕、白色的狗”\n\n***\n\n### 支持的图像格式\n\n图像有各种不同的文件格式，每个浏览器可能支持（或不支持）不同的格式。总的来说，网上最常支持的格式是\
  \ `gif`、`jpg` 和 `png` 图像。在这些，如今最广泛使用的格式是 `jpg` 和 `png`。`jpg` 格式在保持良好文件大小的同时提供高色彩数的质量图像，理想于更快的加载速度。`png`\
  \ 格式非常适合具有透明度或低色彩数的图像。我们最常见的是 `jpg` 图像用于照片，`png` 图像用于图标或背景图案。\n\n***\n\n### 调整图像尺寸\n\
  \n识别图像的大小非常重要，以便在页面加载之前告诉浏览器图像应该多大；这样浏览器就可以为图像留空间并更快地渲染页面。有几种不同的方法可以调整图像尺寸，使其在页面上正常工作。一种方法是在\
  \ HTML 的 `<img>` 标签中直接使用 `width` 和 `height` 属性。\n\n此外，可以使用 CSS 中的 `width` 和 `height`\
  \ 属性对图像进行尺寸调整。当同时使用 HTML 属性和 CSS 属性时，CSS 属性将优先于 HTML 属性。\n\n指定宽度或高度都会导致另一个维度自动调整，以保持图像的宽高比例。例如，如果我们希望图像高度为\
  \ 200 像素，但不太具体关心它有多宽，我们可以将 `height` 设置为 `200` 像素，图像的宽度将相应调整。同时设置 `width` 和 `height`\
  \ 也可以运行；然而这样做可能会破坏图像的宽高比例，导致其看起来失真（请参见 `图 9.3`）。\n\n```\nimg {\n  height: 200px;\n\
  \  width: 200px;\n}\n```\n\n![Image](img/00081.jpeg)\n\n**图 9.3** 定义了宽度和高度导致其失真的图像\n\
  \n虽然在 HTML 中直接使用 `width` 和 `height` 属性通过注明图像的原始尺寸提供了一些语义价值，但要管理许多需要相同尺寸的图像可能会困难。\n\
  \n#### 图像的定位\n\n我们可以使用多种不同的方法来定位图像。一种方法是在 HTML 的 `<img>` 标签中直接使用 `width` 和 `height`\
  \ 属性。此外，可以使用 CSS 中的 `width` 和 `height` 属性对图像进行尺寸调整。当同时使用 HTML 属性和 CSS 属性时，CSS 属性将优先于\
  \ HTML 属性。\n\n##### 内联图像\n\n`<img>` 元素是一个自包含的（或空）元素，这意味着它不包裹任何其他内容，并且以单个标签的形式存在。为了使\
  \ `<img>` 元素生效，必须包含 `src` 属性和值来指定图像的源（请参见 `图 9.1`）。`src` 属性的值是一个 URL，通常相对于托管网站的服务器。\n\
  \n默认情况下图像是内联定位的。然而，`<img>` 元素是内联元素（请参见 `图 9.4`）。\n\n点击此处查看代码图像\n\n```\nGatsby 是一只黑棕白混合血犬，喜欢\
  \ <img src=\"dog.jpg\" alt=\"一只戴着围巾的黑、棕、白色的狗\">尽管他大部分时间都在对消防车大叫，但他也会快速追逐进入他视野的鸟\n\
  ```\n\n![Image](img/00082.jpeg)\n\n**图 9.4** 段落中内联显示的图像\n\n##### 块级图像\n\n保持图像的默认定位并不常见。通常，图像作为块级显示或浮动在某一侧。\n\
  \n向图像添加 `display` 属性并将其设置为 `block` 会强制图像成为块级元素（请参见 `图 9.5`）。这使得图像单独成行，允许周围内容位于图像的上方和下方。\n\
  \n```\nimg {\n  display: block;\n}\n```\n\n![Image](img/00083.jpeg)\n\n**图 9.5**\
  \ 段落中作为块显示的图像\n\n##### 靠左或靠右定位\n\n有时将图像显示为 `inline` 或 `block`，甚至是 `inline-block`\
  \ 并不理想。我们可能希望图像出现在其容器元素的左侧或右侧，而所有其他内容环绕图像。要这样做，我们使用 `float` 属性并将值为 `left` 或 `right`。\n\
  \n浮动图像是一个开始；然而，所有其他内容将对其对其。为了在图像周围提供间距，我们将使用 `margin` 属性（请参见 `图 9.6`）。\n\n\n\n\n\
  点击此处查看代码图片\n\n```css\nimg {\n  background: #e8eae9;\n  border: 1px solid #c6c9cc;\n\
  \  float: right;\n  margin: 8px 0 0 20px;\n  padding: 4px;\n}\n```\n\n![Image](img/00084.jpeg)\n\
  \n图 9.6 经过样式化的图像，显示在框内并浮动于其包含元素的右侧\n\n* *\n\n# 何时使用图像元素 vs. 背景图像\n\n向网页中添加图像主要有两种方法。一种方法（如本文此处介绍的）是在\
  \ HTML 中使用 `<img>` 元素。另一种方法是使用 CSS 中的 `background` 或 `background-image` 属性为元素分配背景图像。这两种方案都能实现目标，但它们各自有特定的使用场景。\n\
  \n当使用的图像具有语义价值，且其内容与页面内容相关时，HTML 中的 `<img>` 元素是首选方案。\n\n当使用的图像是页面设计或用户界面的一部分时，CSS\
  \ 中的 `background` 或 `background-image` 属性是首选方案。因此，它与页面内容并不相关。\n\n* *\n\n`<img>`\
  \ 元素非常流行，当它最初被添加到 HTML 规范时，它彻底改变了网站的构建方式。\n\n## 在实践中\n\n现在我们已经知道了如何在页面上添加和定位图像，让我们来看看\
  \ Styles Conference 网站，看看可以在哪里添加几张图像。\n\n### 1. 我们首先在主页上添加一些图像。具体来说，我们将在每个推广我们部分页面的预告章节（teaser\
  \ sections）中添加一张图像。\n\n在开始编写代码之前，让我们先在“assets”文件夹中创建一个名为“images”的新文件夹。然后，在“images”文件夹中，再创建一个名为“home”的文件夹，专门用于我们的主页图像。在“home”文件夹中，我们将添加三张图像：`speakers.jpg`、`schedule.jpg`\
  \ 和 `venue.jpg`。（作为参考，这些图像可以在 [`learn.shayhowe.com/html-css/adding-media`](http://learn.shayhowe.com/html-css/adding-media)\
  \ 找到。）\n\n然后，在我们的 `index.html` 文件中，每个预告章节都有一个 `<a>` 元素包裹着 `<h3>` 和 `<h5>` 元素。我们将\
  \ `<h5>` 元素移动到 `<a>` 元素上方，并将其替换为 `<img>` 元素。每个 `<img>` 元素的 `src` 属性值将对应我们设置的文件夹结构和文件名，而\
  \ `alt` 属性值将描述每张图像的内容。\n\n我们第一个预告章节（演讲者页面）的 HTML 代码如下：\n\n点击此处查看代码图片\n\n```html\n\
  <section class=\"teaser col-1-3\">\n  <h5>Speakers</h5>\n  <a href=\"speakers.html\"\
  >\n    <img src=\"assets/images/home/speakers.jpg\" alt=\"Professional Speaker\"\
  >\n    <h3>World-Class Speakers</h3>\n  </a>\n  <p>来自世界各地的加入我们有二十多位优秀的演讲者，他们将在这里分享自己的故事。</p>\n\
  </section>\n```\n\n让我们对日程（Schedule）和会场（Venue）页面的预告章节也继续这种模式。\n\n### 2. 现在由于我们已经在主页上添加了一些图像，我们需要稍微清理一下它们的样式，并确保它们恰当地融入页面的布局。\n\
  \n由于图像默认是行内元素（inline-level），让我们将预告章节中的图像改为块级元素（block-level）。我们还将它们的最大 `width` 设置为\
  \ `100%`，以确保它们不会超过各自的宽度。更改此 `width` 值是非常重要的，因为它允许我们的图像根据需要随列的宽度进行调整。\n\n最后，让我们稍微圆一下圆角，并对图像应用\
  \ `22` 像素的底部外边距 `margin`，留出一点呼吸空间。\n\n一旦我们将这些新样式添加到现有的主页样式中（使用 `teaser` 类作为 `<img>`\
  \ 元素的限定选择器），我们的 CSS 将如下所示：\n\n点击此处查看代码图片\n\n```css\n.teaser img {\n  border-radius:\
  \ 5px;\n  display: block;\n  margin-bottom: 22px;\n  max-width: 100%;\n}\n```\n\n\
  ### 3. 接下来，让我们在演讲者页面添加所有演讲者的图像。我们首先在“images”文件夹中创建一个“speakers”文件夹，并放置所有演讲者的图像。\n\
  \n在 `speakers.html` 文件中，让我们在每个演讲者的 `<aside>` 元素中添加一个 `<img>` 元素。我们将每个 `<img>` 元素放在\
  \ `class` 属性值为 `speaker-info` 的 `<div>` 中，就在 `<ul>` 元素上方。\n\n每张图像的 `src` 属性值将对应“speakers”文件夹和演讲者的名字；`alt`\
  \ 属性值将是演讲者的名字。我作为演讲者的 `<aside>` 元素如下：\n\n点击此处查看代码图片\n\n```html\n<aside class=\"\
  col-1-3\">\n  <div class=\"speaker-info\">\n    <img src=\"assets/images/speakers/shay.jpg\"\
  \ alt=\"Shay Howe\">\n    <ul>\n      <li><a href=\"#\">Shay Howe</a></li>\n   \
  \ </ul>\n  </div>\n</aside>\n```\n\n### 4. 就像我们在主页上做的那样，现在我们要为演讲者页面上的图像应用一些样式。\n\
  \n我们首先通过应用值为 `50%` 的 `border-radius` 属性将图像变为圆形。然后，为它们设置固定的 `130` 像素 `height`，使其顶部对齐。\n\
  \n在设置了 `height` 和垂直对齐方式后，让我们对图像应用负 `66` 像素的外边距 `margin`，将它们稍微拉出 `<aside>` 元素并与 `speaker-info`\
  \ `<div>` 的顶部对齐。最后，在图像下方应用 `22` 像素的 `margin`，以便与下方的 `<ul>` 元素留空间。\n\n```css\n.speaker-info\
  \ img {\n  border-radius: 50%;\n  height: 130px;\n  margin: -66px 0 22px 0;\n  vertical-align:\
  \ top;\n}\n```\n\n### 5. 由于我们在 `class` 属性值为 `speaker-info` 的 `<div>` 元素使用了激进的负边距，我们需要移除该\
  \ `<div>` 顶部的 `padding`。\n\n之前我们使用值为 `22px 0` 的 `padding` 属性，从而在 `<div>` 元素的顶部和底部放置了\
  \ `22` 像素的 `padding`，在左右放置了 `0` 像素。让我们将此属性和值替换为 `padding-bottom` 属性，因为这是我们唯一需要标识的\
  \ `padding` 并使用 `22` 像素的值。\n\n新的 `speaker-info` 类规则如下：\n\n```css\n.speaker-info\
  \ {\n  border: 1px solid #dfe2e5;\n  border-radius: 5px;\n  margin-top: 88px;\n\
  \  padding-bottom: 22px;\n  text-align: center;\n}\n```\n\n现在，我们的主页和演讲者页面看起来都很棒了，分别如图\
  \ 9.7 和 9.8 所示。\n\n\n\n\n\nHTML5 提供了一种通过 `<audio>` 元素向网站添加音频文件的快速简单方法。与 `<img>`\
  \ 元素类似，`<audio>` 元素接受由 `src` 属性指定的源 URL。但与 `<img>` 元素不同的是，`<audio>` 元素需要包含开始和结束标签，我们稍后会讨论。\n\
  \n点击此处查看代码图片\n\n```html\n<audio src=\"jazz.ogg\"></audio>\n```\n\n### 音频属性\n\n`<audio>`\
  \ 元素的 `src` 属性可能伴随着其他几个属性；最流行的包括 `autoplay`、`controls`、`loop` 和 `preload`。\n\n`autoplay`、`controls`\
  \ 和 `loop` 属性都是布尔属性（Boolean attributes）。作为布尔属性，它们不需要显式赋值。相反，当每个一个属性出现在 `<audio>`\
  \ 元素上时，其值将被设置为 `true`，`<audio>` 元素将据此运行。\n\n默认情况下，`<audio>` 元素不会显示在页面上。如果 `<audio>`\
  \ 元素上存在 `autoplay` 布尔属性，页面上将什么都不出现，但音频文件将在加载时自动播放。\n\n点击此处查看代码图片\n\n```html\n<audio\
  \ src=\"jazz.ogg\" autoplay></audio>\n```\n\n要在页面上显示 `<audio>` 元素，需要 `controls`\
  \ 布尔属性。当它被应用于 `<audio>` 元素时，`controls` 布尔属性将显示浏览器的默认音频控制，包括播放、暂停、进度和音量控制（参见图 9.9]）。\n\
  \n点击此处查看代码图片\n\n```html\n<audio src=\"jazz.ogg\" controls></audio>\n```\n\n![Image](img/00087.jpeg)\n\
  \n**图 9.9** 带有默认 Google Chrome 浏览器控制控件的音频片段\n\n当出现在 `<audio>` 元素上时，`loop` 布尔属性将导致音频文件从头到尾循环播放。\n\
  \n最后，`<audio>` 元素的 `preload` 属性有助于识别在播放片段之前应该加载哪些关于音频文件的信息。它接受三个值：`none`、`auto`\
  \ 和 `metadata`。`none` 值不会预加载任何关于音频文件的信息，而 `auto` 值将预加载关于音频文件的所有信息。`metadata` 值介于\
  \ `none` 和 `auto` 之间，它将预加载关于音频文件的任何可用元数据信息（例如片段长度），但不是所有信息。\n\n当 `<audio>` 元素上不存在\
  \ `preload` 属性时，音频文件的所有信息都将被加载，就像值设置为 `auto` 一样。因此，当音频文件对页面并非必不可时，使用值为 `metadata`\
  \ 或 `none` 的 `preload` 属性是一个好主意。这有助于节省带宽并允许页面加载更快。\n\n### 音频回退与多源\n\n目前，不同的浏览器支持不同的音频格式，其中最流行的三个是\
  \ `ogg`、`mp3` 和 `wav`。为了获得最佳浏览器支持，我们需要使用一些音频回退方案，这些方案包含在 `<audio>` 元素的开始和结束标签内部。\n\
  \n首先，我们将从 `<audio>` 元素中移除 `src` 属性。相反，我们将在 `<audio>` 元素内部嵌套带有 `src` 属性的 `<source>`\
  \ 元素来定义一个新的源。\n\n通过为种文件格式使用 `<source>` 元素和 `src` 属性，我们可以一个一个列出音频文件格式。我们将使用 `type`\
  \ 属性帮助浏览器快速识别可用的音频类型。当浏览器识别出音频文件格式时，它将加载该文件并忽略所有其他格式。\n\n由于它是在 HTML5 中引入的，某些浏览器可能不支持\
  \ `<audio>` 元素。在这种情况下，我们可以在 `<audio>` 元素内的任何 `<source>` 元素之后提供下载音频文件的链接（参见图 9.10]）。\n\
  \n点击此处查看代码图片\n\n```html\n<audio controls>\n  <source src=\"jazz.ogg\" type=\"audio/ogg\"\
  >\n  <source src=\"jazz.mp3\" type=\"audio/mpeg\">\n  <source src=\"jazz.wav\" type=\"\
  audio/wav\">\n  请 <a href=\"jazz.mp3\" download>下载</a>音频文件。\n</audio>\n```\n\n![Image](img/00088.jpeg)\n\
  \n**图 9.10** 当浏览器不支持 <audio> 元素时的锚点文本音频回退\n\n回顾之前的代码，`<audio>` 元素包含了 `controls`\
  \ 布尔属性，以确保在支持该元素的浏览器中显示音频播放器。<audio>` 元素不包含 `src` 属性，而是封装三个不同的 `<source>` 元素。\n\n\
  ### 添加视频\n\n默认情况下，`<audio>` 和 `<video>` 元素的控件由每个浏览器独立决定。根据网站的设计，可能需要对媒体播放器的外观和感觉有更多控制权。如果是这样，可以构建自定义播放器，但它需要一些\
  \ JavaScript 才能工作。\n\n除了 `<audio>` 元素外，HTML5 还引入了 `<video>` 元素，它共享了许多属性。对于 `<audio>`\
  \ 元素，如果没有指定 `controls` 布尔属性，视频将显示。\n\n由于视频会占用页面空间，指定它们的尺寸是有好处的，这通常通过 CSS 中的 `width`\
  \ 和 `height` 属性完成。这有助于确保视频不会太大并保持在布局内。\n\n点击此处查看代码图片\n\n```html\n<video src=\"earth.ogv\"\
  \ controls></video>\n```\n\n### Poster 属性\n\n`<video>` 元素的另一个可用属性是 `poster` 属性。`poster`\
  \ 属性允许我们指定一个图像 格式在视频播放之前显示。下面的示例使用视频截图作为地球视频的封面。\n\n点击此处查看代码图片\n\n```html\n<video\
  \ src=\"earth.ogv\" controls poster=\"earth-video-screenshot.jpg\"></video>\n```\n\
  \n### 视频回退\n\n与 `<audio>` 元素一样，视频回退也是必要的。相同的标记格式（每个文件类型的多个 `<source>` 元素和一个纯文本回退）也适用于\
  \ `<video>` 元素内部。\n\n点击此处查看代码图片\n\n```html\n<video controls>\n  <source src=\"earth.ogv\"\
  \ type=\"video/ogg\">\n  <source src=\"earth.mp4\" type=\"video/mp4\">\n  请 <a href=\"\
  earth.mp4\" download>下载</a>视频。\n</video>\n```\n\n\n\n\n\n除了纯文本备用方案，另一种可选方案是使用 YouTube\
  \ 或 Vimeo 嵌入视频。这些视频托管网站允许我们上传视频，提供标准的视频播放器，并允许我们使用内联框架（inline frame）将视频嵌入到页面中。\n\
  \n***\n\n## HTML5 音频与视频格式\n\n浏览器对 `<audio>` 和 `<video>` 元素的支持各相同，这些元素所需的文件格式也是如此。每个浏览器都有自己偏好的音频和视频文件格式。\n\
  \n有一些工具可以帮助将音频或视频转换为不同的格式，快速搜索就能找到 way。\n\n## 添加内联框架\n\n向页面添加内容的另一种方法是在当前页面中嵌入另一个\
  \ HTML 页面。这是通过内联框架，或 `<iframe>` 元素实现的。`<iframe>` 元素通过 `src` 属性值接受另一个 HTML 页面的 URL；这会将嵌入的\
  \ HTML 页面内容显示在当前页面上。`src` 属性的值可以是相对于 `<iframe>` 元素所在页面的相对 URL，也可以是完全外部页面的绝对 URL。\n\
  \n许多页面使用 `<iframe>` 元素从 Google Maps、YouTube 等外部网站将媒体嵌入页面中。\n\n点击此处查看代码图片\n\n```html\n\
  <iframe src=\"https://www.google.com/maps/embed?...\"></iframe>\n```\n\n![Image](img/00091.jpeg)\n\
  \n**图 9.13** 一个带有嵌入 HTML 页面的页面，显示了来自 Google Maps 的地图\n\n`<iframe>` 元素具有一些默认样式，包括内置\
  \ `border` 以及 `width` 和 `height`。可以使用 `frameborder`、`width` 和 `height` HTML 属性，或使用\
  \ `border`、`width` 和 `height` CSS 属性来调整这些样式。\n\n### 无缝内联框架\n\n`<iframe>` 元素 `src`\
  \ 属性引用的页面按照自己的规则运行，因为它们不会从引用的页面继承任何样式或行为。应用到包含 `<iframe>` 元素的页面任何样式都不会被 `<iframe>`\
  \ 内部引用的页面继承。此外，`<iframe>` 内部引用页面中的链接将在该框架内打开，使包含 `<iframe>` 元素的页面保持不变。\n\n有时我们希望更改这些行为，而\
  \ `seamless` 布尔属性允许我们实现这一点。当 `<iframe>` 元素上存在时，`seamless` 布尔属性允许包含 `<iframe>` 元素的页面样式被\
  \ `<iframe>` 内部引用的页面继承。此外，`seamless` 布尔属性允许在 `<iframe>` 内部引用页面中点击的链接在包含 `<iframe>`\
  \ 元素的原始页面相同窗口中打开。\n\n点击此处查看代码图片\n\n```html\n<iframe src=\"contact.html\" seamless></iframe>\n\
  ```\n\n`seamless` 布尔属性是 HTML5 引入的新属性。尽管浏览器对该属性的支持正在增加，但它在旧版浏览器中无法工作。建议在使用 `seamless`\
  \ 布尔属性之前进行测试。\n\n### 实践\n\n内联框架是为页面添加动态内容的极佳方法。让我们通过用一些地图更新我们的 Venue 页面来尝试一下。\n\n\
  **1.** 在添加任何地图或内联框架之前，让我们先为 Venue 页面准备双列网格。在页面顶部导言部分下方，我们将添加一个 `class` 属性值为 `row`\
  \ 的 `<section>` 元素以标识页面的新章节，并包含一些通用样式，例如白色的 `background` 和一些垂直 `padding`。\n\n直接在\
  \ `<section>` 元素内部，让我们添加一个 `class` 属性值为 `grid` 的 `<div>` 元素。`grid` 类使我们的内容水平居中，并为随后的三分之一和三分之二列做准备。\n\
  \n到为止，我们的 `venue.html` 文件的主部分如下：\n\n```html\n<section class=\"row\">\n  <div class=\"\
  grid\">\n    ...\n  </div>\n</section>\n```\n\n**2.** 在 `class` 属性值为 `grid` 的 `<div>`\
  \ 元素内部，我们将有两个新章节，一个用于会议场地，一个用于会议酒店。让我们添加两个新的 `<section>` 元素，并给每个 `<section>` 元素分配一个与其内容对应的唯一类。我们将使用这些类为每个章节的底部添加外边距。\n\
  \n我们的 HTML 现在看起来应该是这样：\n\n点击此处查看代码图片\n\n```html\n<section class=\"row\">\n  <div\
  \ class=\"grid\">\n    <section class=\"venue-theatre\">\n      ...\n    </section>\n\
  \    <section class=\"venue-hotel\">\n      ...\n    </section>\n  </div>\n</section>\n\
  ```\n\n**3.** 现在我们已经有了一些类，让我们在 `main.css` 中创建一个用于 Venue 样式的章节。我们将为 `class` 属性值为\
  \ `venue-theatre` 的 `<section>` 元素底部添加 `66` 像素的外边距。然后，我们将为 `class` 属性值为 `venue-hotel`\
  \ 的 `<section>` 元素底部添加 `22` 像素的外边距。\n\n`main.css` 文件如下：\n\n```css\n/* Venue */\n\
  .venue-theatre {\n  margin-bottom: 66px;\n}\n.venue-hotel {\n  margin-bottom: 22px;\n\
  }\n```\n\n`class` 值为 `row` 的 `<section>` 元素外边距较小。\n\n**4.** 现在是时候在每个新的 `<section>`\
  \ 元素内部创建列。我们首先添加一个 `class` 属性值为 `col-1-3` 的 `<div>` 元素来建立三分之一列。在其之后，添加一个 `class`\
  \ 属性值为 `col-2-3` 的 `<iframe>` 元素来建立三分之二列。\n\n考虑到列类使 `<div>` 和 `<iframe>` 元素都成为 inline-block\
  \ 元素，我们需要移除它们之间的空白空间。为了这样做，我们将在 `</div>` 标签之后直接打开一个 HTML 注释，并在开启 `<iframe>` 标签之前立即关闭\
  \ HTML 注释。\n\n总之，我们列的 HTML 如下：\n\n```html\n<section class=\"row\">\n  <div class=\"\
  grid\">\n    <section class=\"venue-theatre\">\n      <div class=\"col-1-3\"></div><!------><iframe\
  \ class=\"col-2-3\"></iframe>\n    </section>\n    <section class=\"venue-hotel\"\
  >\n      <div class=\"col-1-3\"></div><!------><iframe class=\"col-2-3\"></iframe>\n\
  \    </section>\n  </div>\n</section>\n```\n\n**5.** 在每个 `class` 属性值为 `col-1-3`\
  \ 的 `<div>` 元素内部，让我们在 `<h2>` 元素中添加场地名称，随后是两个 `<p>` 元素。在第一个 `<p>` 元素中，让我们包含场地的地址，在第二个\
  \ `<p>` 元素中，让我们包含场地的网站（在锚链接内）和电话号码。\n\n在每个段落中，让我们使用换行元素 `<br>` 在地址内部以及网站和电话号码之间进行换行。\n\
  \n\n\n\n\n对于 `class` 属性值为 `venue-theatre` 的 `<section>` 元素，其 HTML 如下：\n\n点击此处查看代码图片\n\
  \n```html\n<section class=\"venue-theatre\">\n  <div class=\"col-1-3\">\n    <h2>Chicago\
  \ Theatre</h2>\n    <p>175 N State St <br> Chicago, IL 60601</p>\n    <p><a href=\"\
  http://www.thechicagotheatre.com/\">thechicagotheatre.com</a> <br> (312) 462-6300</p>\n\
  \  </div><!--\n  --><iframe class=\"col-2-3\"></iframe>\n</section>\n```\n\n此处展示的剧院（theatre）的相同模式也应适用于酒店（当然，要使用正确的地址、网站和电话号码）。\n\
  \n**6.** 我们可以在 Google Maps（[[google.com/maps/](http://google.com/maps/))）中搜索这些地址。一旦定位了地址并创建了自定义地图，我们就有能力将该地图嵌入到页面中。遵循\
  \ Google Maps 关于如何共享和嵌入地图的说明，将为我们提供 `<<iframe>>` 元素的 HTML。\n\n让我们将 HTML——包括 `<iframe>`\
  \ 元素、`src` 属性等所有内容——复制到现有 `<<iframe>>` 元素所在的页面上。我们将为每个位置执行此操作，使用两个不同的 `<<iframe>>`\
  \ 元素。\n\n在从 Google Maps 复制 `<<iframe>>` 元素时，我们需要确保保留现有 `<iframe>` 元素中的 `class` 属性和值\
  \ `col-2-3`。我们还需要注意不要损坏紧接在我们的起始 `<iframe>` 标签之前的 HTML 注释。\n\n再次直接查看 `class` 属性值为\
  \ `venue-theatre` 的 `<section>` 元素，其 HTML 如下所示：\n\n点击此处查看代码图片\n\n```html\n<section\
  \ class=\"venue-theatre\">\n  <div class=\"col-1-3\">\n    <h2>Chicago Theatre</h2>\n\
  \    <p>175 N State St <br> Chicago, IL 60601</p>\n    <p><a href=\"http://www.thechicagotheatre.com/\"\
  >thechicagotheatre.com</a> <br> (312) 462-6300</p>\n  </div><!--\n  --><iframe class=\"\
  col-2-3\" src=\"https://www.google.com/maps/embed?pb=!1m5!3m3!1m2!1s0x880e2ca55810a493%3A0x4700ddf60fcbfad6!2schicago+theatre!5e0!3m2!1sen!2sus!4v1388701393606\"\
  ></iframe>\n</section>\n```\n\n**7.** 最后，我们需要确保引用 Google Maps 的两个 `<<iframe>>` 元素具有相同的高度。为了实现，我们将创建一个新类\
  \ `venue-map`，并将其应用于每个 `<<iframe>>` 元素，同时保留现有的 `col-2-3` 类属性值。\n\n现在，`class` 属性值为\
  \ `venue-theatre` 的 `<section>` 元素的 HTML 如下所示：\n\n点击此处查看代码图片\n\n```html\n<section\
  \ class=\"venue-theatre\">\n  <div class=\"col-1-3\">\n    <h2>Chicago Theatre</h2>\n\
  \    <p>175 N State St <br> Chicago, IL 60601</p>\n    <p><a href=\"http://www.thechicagotheatre.com/\"\
  >thechicagotheatre.com</a> <br> (312) 462-6300</p>\n  </div><!--\n  --><iframe class=\"\
  venue-map col-2-3\" src=\"https://www.google.com/maps/embed?pb=!1m5!3m3!1m2!1s0x880e2ca55810a493%3A0x4700ddf60fcbfad6!2schicago+theatre!5e0!3m2!1sen!2sus!4v1388701393606\"\
  ></iframe>\n</section>\n```\n\n一旦将 `venue-map` 类应用于每个 `<iframe>` 元素，让我们在 `main.css`\
  \ 文件中创建 `venue-map` 类规则。它包含了值为 `264` 的 `height` 属性。\n\n`venue-map` 类规则如下：\n\n```css\n\
  .venue-map {\n  height: 264px;\n}\n```\n\n我们现在有了一个场馆页面（参见图 9.14），包含了不同位置的地图。\n\n\
  ![Image](img/00092.jpeg)\n**图 9.14** 我们的样式场馆页面，现在包含了内联框架\n\n\n\n\n\n我们需要了解如何构建表单以获取用户输入。在本节中，我们将讨论如何使用\
  \ HTML 标记表单，使用哪些元素来捕捉不同类型的数据，以及如何使用 CSS 为表单设置样式。我们不会深入探讨表单信息如何在网站后端进行处理。表单处理是一个更深层次的话题，超出了本书的范围；目前，我们将专注于表单的创建和样式设置。\n\
  \n## 初始化表单\n\n要在页面上添加表单，我们将使用 `<form>` 元素。`<form>` 元素标识了控件出现在页面上的位置。此外，`<form>`\
  \ 元素包裹表单内包含的所有元素，就像 `<div>` 元素一样。\n\n点击此处查看代码图片\n\n```html\n<form action=\"/login\"\
  \ method=\"post\">\n    ...\n</form>\n```\n\n`<form>` 元素可以应用多个属性，其中最常见的是 `action`\
  \ 和 `method`。`action` 属性包含表单内信息发送到服务器进行处理的 URL。`method` 属性是浏览器提交表单数据时应使用的 HTTP 方法。这两个\
  \ `<form>` 属性都与数据的提交和处理有关。\n\n## 文本字段与文本区域\n\n在收集用户文本输入时，表单中有几个不同的元素可用于获取数据。具体来说，文本字段和文本区域（textareas）用于收集文本或基于字符串的数据。这些数据可能包括文本段、密码、电话号码和其他信息。\n\
  \n### 文本字段\n\n从用户获取文本的主要元素之一是 `<input>` 元素。`<input>` 元素使用 `type` 属性定义控件内捕捉什么类型的信息。最常用的\
  \ `type` 属性值是 `text`，表示单行文本输入。\n\n在设置 `type` 属性的同时，最佳实践是为 `<input>` 元素设置一个 `name`\
  \ 属性。`name` 属性的值作为控件名称，并与输入数据一起提交给服务器（参见图 10.1）。\n\n点击此处查看代码图片\n\n```html\n<input\
  \ type=\"text\" name=\"username\">\n```\n\n![Image](img/00095.jpeg)\n\n**图 10.1**\
  \ 使用 `<input>` 元素创建的自包含文本输入\n\n`<input>` 元素是自包含的，这意味着它只使用一个标签并且不包裹任何其他内容。元素的值由其属性及其对应的值提供。\n\
  \n最初，只有两个文本类型的 `type` 属性值是 `text` 和 `password`（用于密码输入）；然而，HTML5 引入了一些新的 `type` 属性值。添加这些值是为了为输入提供更清晰的语义含义，并为用户提供更好的控制。如果浏览器不理解这些\
  \ HTML5 `type` 属性值之一，它将自动回退到 `text` 属性值。以下是新的 HTML5 输入类型列表。\n\n- `color`\n- `date`\n\
  - `datetime`\n- `email`\n- `month`\n- `number`\n- `range`\n- `search`\n- `tel`\n\
  - `time`\n- `url`\n- `week`\n\n接下来的 `<input>` 元素展示了这些 HTML5 `type` 属性值的用法；图 10.2\
  \ 到 10.7 显示了这些唯一值在 iOS 中的外观。注意不同的值如何提供不同的控件，所有这些都让从用户处收集输入变得更容易。\n\n点击此处查看代码图片\n\
  \n```html\n<input type=\"date\" name=\"birthday\">\n<input type=\"time\" name=\"\
  game-time\">\n<input type=\"email\" name=\"email-address\">\n<input type=\"url\"\
  \ name=\"website\">\n<input type=\"number\" name=\"cost\">\n<input type=\"tel\"\
  \ name=\"phone-number\">\n```\n\n![Image](img/00096.jpeg)\n\n**图 10.2** 为 `type`\
  \ 属性值为 `date` 的 `<input>` 元素的 iOS7 控件\n\n![Image](img/00097.jpeg)\n\n**图 10.3**\
  \ 为 `type` 属性值为 `time` 的 `<input>` 元素的 iOS7 控件\n\n![Image](img/00098.jpeg)\n\n**图\
  \ 10.4** 为 `type` 属性值为 `email` 的 `<input>` 元素的 iOS7 控件\n\n![Image](img/00099.jpeg)\n\
  \n**图 10.5** 为 `type` 属性值为 `url` 的 `<input>` 元素的 iOS7 控件\n\n![Image](img/00100.jpeg)\n\
  **图 10.6** 为 `type` 属性值为 `number` 的 `<input>` 元素的 iOS7 控件\n\n![Image](img/00101.jpeg)\n\
  **图 10.7** 为 `type` 属性值为 `tel` 的 `<input>` 元素的 iOS7 控件\n\n### 文本区域\n\n另一个用于捕捉文本段的元素是\
  \ `<textarea>`。`<textarea>` 与 `<input>` 元素的区别在于，它可以包裹多行文本。`<textarea>` 元素有两个尺寸属性：`cols`\
  \ 用于宽度，`rows` 用于高度。\n\n点击此处查看代码图片\n\n```html\n<textarea name=\"comment\">Add your\
  \ comment</textarea>\n```\n\n![Image](img/00102.jpeg)\n**图 10.8** `<textarea>` 示例\n\
  \n## 多选择输入与菜单\n\n除了文本输入外，HTML 还允许用户使用多选择控件选择数据。\n\n### 单选按钮\n\n单选按钮是用户从小型列表中快速选择的简单方式。单选按钮允许用户只选择一个。单选按钮使用\
  \ `type` 属性值为 `radio` 的 `<input>` 元素。单选按钮应具有相同的 `name` 属性，以便组内的所有按钮对应。\n\n对于文本输入，输入的值由用户输入决定；对于单选按钮，用户是在进行选择。因此，我们必须使用\
  \ `value` 属性定义输入值。此外，要预选单选按钮，可以使用布尔属性 `checked`。\n\n点击此处查看代码图片\n\n```html\n<input\
  \ type=\"radio\" name=\"day\" value=\"Friday\" checked>\n<input type=\"radio\" name=\"\
  day\" value=\"Saturday\">\n<input type=\"radio\" name=\"day\" value=\"Sunday\">\n\
  ```\n\n![Image](img/00103.jpeg)\n**图 10.9** 通过 `type` 属性值为 `radio` 的 `<input>` 元素创建的按钮组\n\
  \n### 复选框\n\n复选框与单选按钮非常相似。它们使用相同的属性和模式，仅有 `type` 属性值为 `checkbox`。两者之间的区别在于，复选框允许用户选择多个值并将它们全部绑定到一个控件名称，而单选按钮限制用户只能选择一个值。\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"checkbox\" name=\"day\" value=\"Friday\"\
  \ checked>\n<input type=\"checkbox\" name=\"day\" value=\"Saturday\">\n<input type=\"\
  checkbox\" name=\"day\" value=\"Sunday\">\n```\n\n![Image](img/00104.jpeg)\n**图\
  \ 10.10** 使用 `type` 属性值为 `checkbox` 的 `<input>` 元素创建的多选框组\n\n#### 下拉列表\n\n\n\n\n\
  \n下拉列表是一种以实用方式向用户提供长选项列表的完美方法。在选项列表旁边放置一长列单选按钮不仅视觉上不美观，而且会让用户感到无所从且难以理解，尤其是对于移动设备上的用户。相比之下，下拉列表为长选项列表提供了完美的格式。\n\
  \n要创建一个下拉列表，我们将使用 `<select>` 和 `<option>` 元素。<select>` 元素封装所有的菜单选项，每个菜单选项都使用 `<option>`\
  \ 元素进行标记。\n\n`name` 属性位于 `<select>` 元素，而 `value` 属性位于嵌套在 `<select>` 元素中的 `<option>`\
  \ 元素上。每个 `<option>` 元素上的 `value` 属性对应于 `<select>` 元素上的 `name` 属性。\n\n每个 `<option>`\
  \ 元素封装了列表中单个选项的文本（这是用户可见的）。\n\n就像单选按钮和复选框的 `checked` 布尔属性一样，下拉菜单可以使用 `selected`\
  \ 布尔属性来为用户预选一个选项。\n\n点击此处查看代码图片\n\n```html\n<select name=\"day\">\n  <option value=\"\
  Friday\" selected>Friday</option>\n  <option value=\"Saturday\">Saturday</option>\n\
  \  <option value=\"Sunday\">Sunday</option>\n</select>\n```\n\n![Image](img/00105.jpeg)\n\
  \n**图 10.11** 使用 `<input>` 和 `<option>` 元素创建的下拉菜单\n\n## 多选择\n\n当为标准下拉列表的 `<select>`\
  \ 元素添加 `multiple` 布尔属性时，允许用户一次从列表中选择多个选项。此外，在菜单内在多个 `<option>` 元素上使用 `selected`\
  \ 布尔属性将预选多个选项。\n\n`<select>` 元素的大小可以使用 CSS 控制，并应进行适当调整以允许多次选择。告知用户若要选择多个选项，他们需要按住\
  \ Shift 键并点击进行选择，这可能是值得的。\n\n点击此处查看代码图片\n\n```html\n<select name=\"day\" multiple>\n\
  \  <option value=\"Friday\" selected>Friday</option>\n  <option value=\"Saturday\"\
  >Saturday</option>\n  <option value=\"Sunday\">Sunday</option>\n</select>\n```\n\
  \n![Image](img/00106.jpeg)\n\n**图 10.12** 允许用户选择多个选项的下拉列表\n\n## 表单按钮\n\n在用户输入所需信息后，按钮允许用户将这些信息付诸行动。最常用的是提交输入（submit\
  \ input）或提交按钮来处理数据。\n\n### 提交输入\n\n用户在填写表单后点击提交按钮来处理数据。提交按钮使用 `type` 属性值为 `submit`\
  \ 的 `<input>` 元素创建。`value` 属性用于指定显示在按钮内的文本（参见图 10.13）。\n\n点击此处查看代码图片\n\n```html\n\
  <input type=\"submit\" name=\"submit\" value=\"Send\">\n```\n\n![Image](img/00107.jpeg)\n\
  \n**图 10.13** 通过 `type` 属性值为 `submit` 的 `<input>` 元素创建的提交按钮\n\n### 提交按钮\n\n作为 `<input>`\
  \ 元素，提交按钮是自包含的，不能封装任何其他内容。如果对输入的结构和设计有更多控制——以及封装其他元素的能力——可以使用 `<button>` 元素。\n\n\
  `<button>` 元素的工作方式与 `type` 属性值为 `submit` 的 `<input>` 元素相同；但它包含开始和结束标签，这些可以封装其他元素。默认情况下，`<button>`\
  \ 元素的作用就像具有值为 `submit` 的 `type` 属性，因此如果你愿意，可以在 `<button>` 元素中省略 `type` 属性和值。\n\n\
  与其使用 `value` 属性来控制提交按钮内的文本，显示在 `<button>` 元素开始和结束标签之间的文本将显示（参见图 10.14）。\n\n点击此处查看代码图片\n\
  \n```html\n<button name=\"submit\">\n  <strong>给我们发送</strong> 消息\n</button>\n```\n\
  \n![Image](img/00108.jpeg)\n\n**图 10.14** 使用 `<button>` 元素创建的提交按钮\n\n## 其他输入\n\n\
  除了我们讨论的应用之外，`<input>` 元素还有其他用法。这些包括隐藏输入。\n\n### 隐藏输入\n\n隐藏输入提供了一种在不向用户显示的情况下传递数据。隐藏输入通常用于敏感信息。要创建隐藏输入，使用\
  \ `type` 属性 `hidden`。此外，包含 `name` 和 `value` 属性。\n\n点击此处查看代码图片\n\n```html\n<input\
  \ type=\"hidden\" name=\"tracking\" value=\"abc\">\n```\n\n### 文件输入\n\n要允许用户添加文件，使用\
  \ `type` 属性 `file`（参见图 10.15）。\n\n点击此处查看代码图片\n\n```html\n<input type=\"file\" name=\"\
  upload\">\n```\n\n![Image](img/00109.jpeg)\n\n**图 10.15** 用于文件的输入\n\n## 组织表单元素\n\
  \n知道如何用输入获取数据只是胜利的一半。以实用的方式组织表单元素和控件是另一半。在与表单交互时，用户需要理解要求他们做什么以及如何提供信息。通过使用 label、fieldset\
  \ 和 legend，我们可以更好地组织表单。\n\n### Label\n\n标签为表单控件提供说明或标题，将它们明确联系起来并为所有人创建一个无障碍表单。使用\
  \ `<label>` 元素创建的标签应包含描述所属输入或控件的文本。\n\n标签可以包含 `for` 属性。`for` 属性的值应与表单控件 `id` 属性的值相同。匹配\
  \ `for` 和 `id` 属性值可以将这两个元素绑定，允许用户点击 `<label>` 元素使表单控件聚焦（参见图 10.16）。\n\n点击此处查看代码图片\n\
  \n```html\n<label for=\"username\">用户名</label>\n<input type=\"text\" name=\"username\"\
  \ id=\"username\">\n```\n\n![Image](img/00110.jpeg)\n\n**图 10.16** 绑定的标签和表单控件\n\n\
  如果需要，`<label>` 元素可以封装表单控件，例如单选按钮或复选框（参见图 10.17）。这样做允许省略 `for` 和 `id` 属性。\n\n点击此处查看代码图片\n\
  \n```html\n<label>\n  <input type=\"radio\" name=\"day\" value=\"Friday\" checked>\
  \ 星期五\n</label>\n<label>\n  <input type=\"radio\" name=\"day\" value=\"Saturday\"\
  > 星期六\n</label>\n```\n\n\n\n\n\n```html\n<input type=\"radio\" name=\"day\" value=\"\
  Sunday\"> Sunday\n</label>\n```\n\n![Image](img/00111.jpeg)\n\n**图 10.17** 嵌套在给定\
  \ label 内部的表单控件，允许省略 `for` 和 `id` 属性\n\n### Fieldset（字段集）\n\n`fieldset` 将表单控件和标签分组为有组织的区域。非常类似于\
  \ `<section>` 或其他结构化元素，`<fieldset>` 是一个块级元素，它用于封装相关的元素（特别是在 `<form>` 元素内部），以实现更好的组织（请参见\
  \ 图 10.18）。默认情况下，`fieldset` 还包含一个边框轮廓，可以使用 CSS 进行修改。\n\n点击此处查看代码图像\n\n```html\n\
  <fieldset>\n  <label>\n    Username\n    <input type=\"text\" name=\"username\"\
  >\n  </label>\n  <label>\n    Password\n    <input type=\"text\" name=\"password\"\
  >\n  </label>\n</fieldset>\n```\n\n![Image](img/00112.jpeg)\n\n**图 10.18** 在 `<fieldset>`\
  \ 元素内组织的表单控件和标签\n\n### Legend（图例）\n\n`legend` 为 `<fieldset>` 元素提供说明或标题。`<legend>`\
  \ 元素封装了描述 fieldset 内部表单控件的文本。标记应该直接跟在 `<fieldset>` 标签之后包含 `<legend>` 元素。在页面上，图例将出现在\
  \ fieldset 边框的左上角（请参见 图 10.19）。\n\n点击此处查看代码图像\n\n```html\n<fieldset>\n  <legend>Login</legend>\n\
  \  <label>\n    Username\n    <input type=\"text\" name=\"username\">\n  </label>\n\
  \  <label>\n    Password\n    <input type=\"text\" name=\"password\">\n  </label>\n\
  </fieldset>\n```\n\n![Image](img/00113.jpeg)\n\n**图 10.19** 在包含 `<legend>` 元素的 `<fieldset>`\
  \ 内组织的表单控件和标签\n\n### Form & Input Attributes（表单与输入属性）\n\n为了适应所有不同的表单、输入和控件元素，有很多属性以及对应的值。这些属性和值具有多种功能，例如禁用控件和添加表单验证。接下来描述一些更常用且实用的属性。\n\
  \n#### Disabled（禁用）\n\n`disabled` 布尔值属性会关闭元素或控件，使其无法进行交互或输入。被禁用的元素不会向服务器发送任何值用于表单处理。\n\
  \n对 `<fieldset>` 元素应用 `disabled` 布尔值属性将禁用 fieldset 内部所有的表单控件。如果 `type` 属性具有 `hidden`\
  \ 值，则会忽略 `hidden` 布尔值属性。\n\n点击此处查看代码图像\n\n```html\n<label>\n  Username\n  <input\
  \ type=\"text\" name=\"username\" disabled>\n</label>\n```\n\n![Image](img/00114.jpeg)\n\
  \n**图 10.20** 一个禁用的输入表单控件\n\n#### Placeholder（占位符）\n\n`placeholder` HTML5 属性在 `<input>`\
  \ 或 `<textarea>` 元素的表单控件内提供提示信息，该提示在控件被点击或获得焦点后消失（请参见 图 10.21）。这用于向用户提供有关如何填写表单输入的更多信息，例如应使用的电子邮件地址格式。\n\
  \n点击此处查看代码图像\n\n```html\n<label>\n  Email Address\n  <input type=\"email\" name=\"\
  email-address\" placeholder=\"name@domain.com\">\n</label>\n```\n\n![Image](img/00115.jpeg)\n\
  \n**图 10.21** 带有 `placeholder` 属性的电子邮件输入表单控件\n\n`placeholder` 和 `value` 属性的主要区别在于，当控件获得焦点时，除非用户手动删除，否则\
  \ `value` 属性的文本将保持在原位。这非常适合为用户预填充数据（如个人信息），但不适用于提供建议。\n\n#### Required（必填）\n\n`required`\
  \ HTML5 布尔值属性强制元素或表单控件在提交到服务器时必须包含一个值。如果元素或表单控件没有值，将显示错误消息要求用户完成必填字段。目前，错误消息的样式由浏览器控制，无法用\
  \ CSS 设置样式。而无效的元素和表单控件可以使用 `:optional` 和 `:required` CSS 伪类进行样式设置。\n\n验证也会根据控件的类型进行。例如，`type`\
  \ 属性值为 `email` 的 `<input>` 元素不仅要求存在值，还要求该值是有效的电子邮件地址（请参见 图 10.22）。\n\n点击此处查看代码图像\n\
  \n```html\n<label>\n  Email Address\n  <input type=\"email\" name=\"email-address\"\
  \ required>\n</label>\n```\n\n![Image](img/00116.jpeg)\n\n**图 10.22** 带有要求值的输入表单控件\n\
  \n#### Additional Attributes（其他属性）\n\n其他表单和控件属性包括但不限于以下内容。请自由研究这些：\n- `accept`\n\
  - `autocomplete`\n- `autofocus`\n- `action`\n- `formmethod`\n- `formtarget`\n- `max`\n\
  - `maxlength`\n- `pattern`\n- `readonly`\n- `step`\n\n#### Login\n\n这是一个完整的登录表单示例，包含了不同的元素和属性。这些元素可以使用\
  \ CSS 进行样式设置（请参见 图 10.23）。\n\n![Image](img/00117.jpeg)\n\n**图 10.23** 登录表单示例\n\n\
  ### HTML\n\n点击此处查看代码图像\n\n```html\n<form>\n  <fieldset class=\"account-info\">\n\
  \    <label>\n      Username\n      <input type=\"text\" name=\"username\">\n  \
  \  </label>\n    <label>\n      Password\n      <input type=\"password\" name=\"\
  password\">\n    </label>\n  </fieldset>\n  <fieldset class=\"account-action\">\n\
  \    <label>\n      <input type=\"checkbox\" name=\"remember\"> Stay signed in\n\
  \    </label>\n    <input type=\"submit\" class=\"btn\" value=\"Login\">\n  </fieldset>\n\
  </form>\n```\n\n### CSS\n\n点击此处查看代码图像\n\n```css\n*,\n*before,\n*after {\n  -webkit-box-sizing:\
  \ border-box;\n  -moz-box-sizing: border-box;\n  box-sizing: border-box;\n}\nform\
  \ {\n  border: 1px solid #c67cc;\n  border-radius: 5px;\n  font: 14px/1.4 \"Helvetica\
  \ Neue\", Helvetica, Arial, sans-serif;\n  overflow: hidden;\n  width: 240px;\n\
  }\nfieldset {\n  border: 0;\n  margin: 0;\n  padding: 0;\n}\ninput {\n  border-radius:\
  \ 5px;\n  font: 14px/1.4 \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  margin:\
  \ 0;\n}\n.account-info {\n  padding: 20px 20px 0 20px;\n}\n.account-info label {\n\
  \  color: #395870;\n  display: block;\n  font-weight: bold;\n  margin-bottom: 20px;\n\
  }\n.account-info input {\n  background: #fff;\n  border: 1px solid #c67cc;\n  -webkit-box-shadow:\
  \ inset 0 1px 1px rgba(0, 0, .1);\n  -moz-box-shadow: inset 0 1px 1px rgba(0, 0,\
  \ .1);\n  box-shadow: inset 0 1px 1px rgba(0, 0, .1);\n  color: #636466;\n  padding:\
  \ 6px;\n  margin-top: 6px;\n  width: 100%;\n}\n.account-action {\n  background:\
  \ #f0f0f2;\n  border-top: 1px solid #c67cc;\n  padding: 20px;\n}\n.account-action\
  \ .btn {\n  background: -webkit-linear-gradient(#49708f, #293f50);\n  -moz-linear-gradient(#49708f,\
  \ #293f50);\n  background: linear-gradient(#49708f, #293f50);\n  border: 0;\n  color:\
  \ #fff;\n}\n```\n\n\n\n\n\n```css\ncss {\n  cursor: pointer;\n  font-weight: bold;\n\
  \  float: left;\n  padding: 8px 16px;\n}\n\n.account-action label {\n  color: #7c7c80;\n\
  \  font-size: 12px;\n  float: left;\n  margin: 10px 0 0 20px;\n}\n```\n\n### 实践\n\
  \n在了解了如何在本地构建表单后，让我们为我们的 Styles Conference 网站创建一个注册页面，以便我们开始收集关注并为活动售票。\n\n**1.**\
  \ 进入我们的 `register.html` 文件，我们将遵循之前在“演讲者”（Speakers）和“场地”（Venue）页面中使用的布局模式。这包括在注册引导部分正下方添加一个\
  \ `class` 属性值为 `row` 的 `<section>` 元素，并直接在 `<section>` 元素内部嵌套一个 `class` 属性值为 `grid`\
  \ 的 `<div>` 元素。\n\n注册页面引导部分下方的代码应该如下：\n\n```html\n<section class=\"row\">\n  <div\
  \ class=\"grid\">\n    ...\n  </div>\n</section>\n```\n\n复习一下，`class` 属性值 `row`\
  \ 会添加白色背景 `background` 并提供一些垂直 `padding`，而 `class` 属性值 `grid` 则将我们的内容置于页面中间，并提供一些水平\
  \ `padding`。\n\n**2.** 在 `class` 属性值为 `grid` 的 `<div>` 元素内部，我们将创建列：一个占据页面宽度的三分之二，另一个占据页面宽度的三分之一。三分之二列将是左侧的\
  \ `<section>` 元素，告诉用户为什么要参加我们的会议。那么，三分之一列将是右侧的 `<form>` 元素，为用户提供注册会议的方法。\n\n我们将这两个元素以及它们对应的\
  \ `col-2-3` 和 `col-1-3` 类直接添加到 `class` 属性值为 `grid` 的 `<div>` 元素内部。由于这两个元素都将是 `inline-block`\
  \ 元素，我们需要在三分之二列的结束标签之后直接打开一个注释，然后在三分之一列的开启标签之前关闭该注释。\n\n总而言之，我们的代码应该像这样：\n\n```html\n\
  <section class=\"row\">\n  <div class=\"grid\">\n    <section class=\"col-2-3\"\
  >\n      ...\n    </section><!--\n    --><form class=\"col-1-3\">\n      ...\n \
  \   </form>\n  </div>\n</section>\n```\n\n**3.** 现在，在我们的三分之二列中，添加一些关于我们活动的细节，以及为什么对于有抱的设计师和前端开发人员来说这是一个好主意。我们将使用几个不同级别的标题（以及它们预定义的样式）、一个段落和一个无序列表来完成。\n\
  \n在 `class` 属性值为 `col-2-3` 的 `<section>` 元素中，代码应该如下：\n\n```html\n<section class=\"\
  col-2-3\">\n  <h2>购买会议证</h2>\n  <h5>每张 $99</h5>\n  <p>请使用右侧的表单购买您的 Styles Conference\
  \ 证。可以在同一订单中购买多张通行证，因此请尽管带上一两个朋友。一旦订单完成，我们将跟进并提供您的购买收据。稍后见！</p>\n  <h4>为什么要参会？</h4>\n\
  \  <ul>\n    <li>超过二十位世界级演讲者</li>\n    <li>一整天的工作坊和两整天的演讲</li>\n    <li>在地标建筑芝加哥剧院（The\
  \ Chicago Theatre）举办</li>\n    <li>八月的芝加哥简直太棒了</li>\n  </ul>\n</section>\n```\n\n\
  **4.** 目前，我们的无序列表没有任何列表标记。所有浏览器默认样式已通过我们在第 1 中添加的 CSS 重置被关闭。让我们为此列表创建一些自定义样式。为此，让我们为无序列表添加一个\
  \ `class` 属性值为 `why-attend`。\n\n```html\n<ul class=\"why-attend\">\n  ...\n</ul>\n\
  ```\n\n既然已经有了可以添加样式的类，让我们在 `main.css` 文件的底部为注册页面创建一个新章节。在该章节中，我们将使用该类选择无序列表，并添加\
  \ `square` 的 `list-style` 以及一些底部和左侧边距。\n\n`main.css` 底部的新章节应该如下：\n\n```css\n/*\n\
  \  Register\n*/\n.why-attend {\n  list-style: square;\n  margin: 0 0 22px 30px;\n\
  }\n```\n\n**5.** 我们注册页面的细节部分已经完成，现在是时候处理我们的注册表单了。我们将开始向 `<form>` 元素添加 `action` 和\
  \ `method` 属性。由于我们还没有设置表单处理程序，这些属性将仅作为占位符，以后需要重新考虑。\n\n`<form>` 元素的代码应该如下：\n\n```html\n\
  <form class=\"col-1-3\" action=\"#\" method=\"post\">\n  ...\n</form>\n```\n\n**6.**\
  \ 接下来，在 `<form>` 元素内部我们将添加一个 `<fieldset>` 元素。在 `<fieldset>` 元素内部，我们将添加一组包裹给定表单控件的\
  \ `<label>` 元素。我们想要收集用户的姓名、电子邮件地址、通行证数量以及任何可能的评论。姓名、电子邮件地址和会议证数量是必填字段，我们希望确保为每个表单控件使用适当的元素和属性。\n\
  \n通过混合不同的输入类型、选择菜单、文本区域和属性，我们的表单代码如下所示：\n\n```html\n<form class=\"col-1-3\" action=\"\
  #\" method=\"post\">\n  <fieldset>\n    <label>\n      姓名\n      <input type=\"\
  text\" name=\"name\" placeholder=\"全名\" required>\n    </label>\n    <label>\n \
  \     邮箱\n      <input type=\"email\" name=\"email\" placeholder=\"电子邮件地址\" required>\n\
  \    </label>\n    <label>\n      通行证数量\n      <select name=\"quantity\">\n    \
  \    <option value=\"1\" selected>1</option>\n        <option value=\"2\">2</option>\n\
  \        <option value=\"3\">3</option>\n        <option value=\"4\">4</option>\n\
  \        <option value=\"5\">5</option>\n      </select>\n    </label>\n    <label>\n\
  \      评论\n      <textarea name=\"comments\"></textarea>\n    </label>\n  </fieldset>\n\
  </form>\n```\n\n\n\n\n\n在我们的 `main.css` 文件的注册部分，我们想要添加以下样式：\n\n点击此处查看代码图片\n\n```css\n\
  form {\n  margin-bottom: 22px;\n}\ninput,\nselect,\ntextarea {\n  font: 300 16px/22px\
  \ \"Lato\", \"Open Sans\", \"Helvetica Neue\",\n    Helvetica, Arial, sans-serif;\n\
  }\n```\n\n我们将首先在表单底部设置一个 `22` 像素的外边距（margin），以便使其与其他元素之间保持垂直间距。然后，我们将为所有的 `<input>`、`<select>`\
  \ 和 `<textarea>` 元素添加一些基于字体（`font`）的标准样式——包括 `weight`、`size`、`line-height` 和 `family`。\n\
  \n默认情况下，每个浏览器对表单控件样式的显示方式都有自己的解释。考虑到这一点，我们重复了 `<body>` 元素中的 `font` 样式，以确保我们的样式保持一致。\n\
  \n**8.** 让我们给 `<fieldset>` 元素内部的元素添加一些样式。由于我们以后可能会添加额外的 `<fieldset>` 元素，让我们为现有的\
  \ `<fieldset>` 元素添加一个 `register-group` 类属性值，从那里我们可以对嵌套在其中的元素应用唯一的样式。\n\n点击此处查看代码图片\n\
  \n```css\n<fieldset class=\"register-group\">\n  ...\n</fieldset>\n```\n\n一旦 `register-group`\
  \ 类属性值到位，我们将为 `<fieldset>` 元素内部嵌套的元素添加一些样式。这些样式将出现在我们的 `main.css` 文件中，位于现有表单样式下方。\n\
  \n点击此处查看代码图片\n\n```css\n.register-group label {\n  color: #648880;\n  cursor: pointer;\n\
  \  font-weight: 400;\n}\n.register-group input,\n.register-group select,\n.register-group\
  \ textarea {\n  border: 1px solid #c6c9cc;\n  border-radius: 5px;\n  color: #888;\n\
  \  display: block;\n  margin: 5px 0 27px 0;\n  padding: 5px 8px;\n}\n.register-group\
  \ input,\n.register-group textarea {\n  width: 100%;\n}\n.register-group select\
  \ {\n  height: 34px;\n  width: 60px;\n}\n.register-group textarea {\n  height: 78px;\n\
  }\n```\n\n你会注意到，这些属性和值大部分都围绕着盒模型（box model），我们在第 4 节 中讨论过。我们主要是在设置不同表单控件的大小，确保它们布局合理。除了添加一些盒模型样式外，我们还调整了一些元素的\
  \ `color` 和 `font-weight`。\n\n**9.** 到目前为止良好：我们的表单正在结合得很好。最后一个待样式的元素是提交按钮。由于它是按钮，我们实际上已经有一些现有的样式可以应用。回想我们的首页，英雄区域（hero\
  \ section）包含一个按钮，该按钮通过 `btn` 类属性值获得了一些样式。\n\n让我们为提交按钮添加这个类属性值 `btn`，以及一个新的类属性值 `btn-default`。具体来说，我们将使用\
  \ `btn-default` 类名，因为这个按钮出现在白色 `background` 上，并将将作为之后按钮的默认样式。\n\n点击此处查看代码图片\n\n\
  ```html\n<input class=\"btn btn-default\" type=\"submit\" name=\"submit\" value=\"\
  Purchase\">\n```\n\n现在，我们的提交按钮与首页上的按钮有一些共享样式。我们将使用 `btn-default` 类属性值为我们的提交按钮应用一些新样式。回到\
  \ `main.css` 文件的按钮部分，添加以下内容：\n\n点击此处查看代码图片\n\n```css\n.btn-default {\n  border:\
  \ 0;\n  background: #648880;\n  padding: 1px 30px;\n  font-size: 14px;\n}\n.btn-default:hover\
  \ {\n  background: #77a198;\n}\n```\n\n这些定义了提交按钮大小和 `background` 的新样式将与现有的 `btn`\
  \ 样式相结合，创建最终的呈现。我们的注册页面完成了，参会者现在可以开始预订机票（参见图 10.24）。\n\n![图像](img/0018.jpeg)\n图\
  \ 10.24 我们的注册页面，包含一个表单。本课内练习的源代码可以在 [`learn.shaye.com/html-css/building-forms`](http://learn.shaye.com/html-css/building-forms)\
  \ 找到。\n\n### 总结\n\n表单在用户如何与网站交互、提供信息以及在网站上采取行动方面起着巨大的作用。我们讨论了如何初始化表单、如何标记表单以及如何样式它们。总结一下，在本节中讨论了：\n\
  - 如何初始化表单\n- 从用户获取数据\n- 如何标记表单\n- 用于样式表单的各种元素\n- 如何组织表单\n- 用于提交表单的属性\n\n对 HTML 和\
  \ CSS 的理解进展顺利，我们只剩下一个组件需要学习：表格。在下一章中，我们将学习使用表格组织数据。\n\n## 第 11 章 使用表格组织数据\n\nHTML\
  \ 表格是为了提供一种标记数据的简单方法而创建的。然而，在 HTML 开发期间，CSS 并没有被广泛支持，因此表格也被用于布局。这在当时是可行的，但并不是表格标记的初意，并导致了许多相关问题。\n\
  \n幸运的是，我们取得了很大进步。今天表格专门用于组织数据（正如它们应该的那样），而 CSS 负责布局。构建表格仍然具有挑战，取决于数据以及如何展示。一旦在 HTML\
  \ 中标记，表格就需要使用 CSS 进行样式处理，以便用户更易阅读和理解。\n\n### 创建表格\n\n表格由列和行中的数据组成，HTML 提供了不同的元素来定义和结构化这些项目。表格至少包含\
  \ `<table>`、`<tr>`（表格行）和 `<td>`（表格数据）元素。为了具有更好的结构语义价值，表格可能包含 `<th>`（表格表头）元素以及其他元素。\n\
  \n#### 表格\n\n我们使用 `<table>` 元素在页面上初始化表格。使用 `<table>` 元素意味着该元素中的信息将作为必要的列和行显示的表格数据。\n\
  \n```html\n<table>\n  ...\n</table>\n```\n\n#### 表格行\n\n一旦在 HTML 中定义了表格，就可以使用 `<tr>`\
  \ 元素添加表格行。表格可以有很多行，即 `<tr>` 元素。取决于要显示的信息量，表格行可能很多。\n\n```html\n<table>\n  <tr>\n\
  \    ...\n  </tr>\n  <tr>\n    ...\n  </tr>\n</table>\n```\n\n#### 表格数据\n\n一旦定义了表格并设置了表格内的行，就可以通过表格数据元素\
  \ `<td>` 向表格添加数据单元。连续列出多个 `<td>` 元素将在表格行内创建列（参见图 11.1）。\n\n\n\n\n\n- 《Don’t Make\
  \ Me Think》Steve Krug 著 | 有货 | 1 | $30.02\n- 《A Project Guide to UX Design》Russ\
  \ Unger & Carolyn Chandler 著 | 有货 | 2 | $52.94 ($26.47 × 2)\n- 《Introducing HTML5》Bruce\
  \ Lawson & Remy Sharp 著 | 无货 | 1 | $22.23\n- 《Bulletproof Web Design》Dan Cederholm\
  \ 著 | 有货 | 1 | $30.17\n\n![图片](img/00119.jpeg)\n\n**图 11.1** 一个包含多列和多行的书籍表格\n\n\
  ## 表头 (Table Header)\n\n要为单元格的列或行指定标题，应该使用表格表头元素 `<th>`。`<th>` 元素的工作方式与 `<td>` 元素相同，都会创建一个数据单元格。使用\
  \ `<th>` 元素而非 `<td>` 元素的优势在于，表头元素通过标识单元格内的数据为标题来提供语义价值，而 `<td>` 元素仅代表通用的数据。\n\n\
  这两个元素之间的区别类似于标题（`<h1>` 到 `<h6>` 元素）与段落（`<p>` 元素）之间的区别。虽然标题的内容可以放置在段落中，但这样做是没有意义的。具体来说，使用标题可以为内容增加更多语义价值。表头的情况也是如此。\n\
  \n表头可以同时用在列和行中；表格中的数据决定了表头合适的适用位置。`scope` 属性有助于精确识别表头与哪些内容相关。`scope` 属性通过值 `col`、`row`、`colgroup`\
  \ 和 `rowgroup` 指明表头适用于行还是列。最常用的两个值是 `col` 和 `row`。`col` 值表示该列中的每个单元格都直接关联到该表头，而\
  \ `row` 值表示该行中的每个单元格都直接关联到该表头。\n\n使用 `<th>` 元素配合 `scope` 属性，极大地帮助了屏幕阅读器和辅助技术理解表格的含义。因此，它们对于使用这些技术浏览网页的人也有益处。\n\
  \n此外，根据浏览器的不同，表头可能会接收某些默认样式，通常是加粗并居中（参见图 11.2）。\n\n点击此处查看代码图片\n\n```html\n<table>\n\
  \  <tr>\n    <th scope=\"col\">Item</th>\n    <th scope=\"col\">Availability</th>\n\
  \    <th scope=\"col\">Qty</th>\n    <th scope=\"col\">Price</th>\n  </tr>\n  <tr>\n\
  \    <td>Don’t Make Me Think by Steve Krug</td>\n    <td>In Stock</td>\n    <td>1</td>\n\
  \    <td>$30.02</td>\n  </tr>\n  <tr>\n    <td>A Project Guide to UX Design by Russ\
  \ Unger & Carolyn Chandler</td>\n    <td>In Stock</td>\n    <td>2</td>\n    <td>$52.94\
  \ ($26.47 × 2)</td>\n  </tr>\n  <tr>\n    <td>Introducing HTML5 by Bruce Lawson\
  \ & Remy Sharp</td>\n    <td>Out of Stock</td>\n    <td>1</td>\n    <td>$22.23</td>\n\
  \  </tr>\n  <tr>\n    <td>Bulletproof Web Design by Dan Cederholm</td>\n    <td>In\
  \ Stock</td>\n    <td>1</td>\n    <td>$30.17</td>\n  </tr>\n</table>\n```\n\n![图片](img/00120.jpeg)\n\
  \n**图 11.2** 一个包含表头的书籍表格\n\n将数据放入表格只是开始。虽然我们已经触及了如何语义化地向表格添加数据的皮毛，但我们还可以做更多事情来定义表格的结构。\n\
  \n#### headers 属性 (Headers Attribute)\n\n`headers` 属性与 `scope` 属性非常相似。默认情况下，`scope`\
  \ 属性只能用于 `<th>` 元素。当某个单元格（无论是 `<td>` 还是 `<th>` 元素）需要与不同的标题关联时，`headers` 属性就会派上用场。`<td>`\
  \ 或 `<th>` 元素上的 `headers` 属性值需要与该单元格所属 `<th>` 元素的 `id` 属性值匹配。\n\n### 表格结构 (Table\
  \ Structure)\n\n了解如何构建表格并排列数据是非常强大的；然而，还有额外的元素可以帮助我们组织数据和表格结构。这些元素包括 `<caption>`、`<thead>`、`<tbody>`\
  \ 和 `<tfoot>`。\n\n#### 表格标题 (Table Caption)\n\n`<caption>` 元素为表格提供标题或说明。`caption`\
  \ 将帮助用户识别表格涉及的主题以及他们期望在其中找到什么数据。`<caption>` 元素必须紧跟在 `<table>` 标签之后，并且它默认位于表格的顶部（参见图\
  \ 11.3）。\n\n点击此处查看代码图片\n\n```html\n<table>\n  <caption>Design and Front-End Books</caption>\n\
  \  ...\n```\n\n![图片](img/00121.jpeg)\n\n**图 11.3** 带有标题的表格\n\n#### 表头、正文、页脚 (Head,\
  \ Body, Foot)\n\n表格中的内容可以被分成若干组，即 `<thead>`、`<tbody>` 和 `<tfoot>`。`<thead>` 包含表格的表头行，`<tbody>`\
  \ 包含表格的主文内容，`<tfoot>` 包含表格的页脚行（通常用于总结数据）。参见图 11.4\n\n```html\n<table>\n  <caption>Design\
  \ and Front-End Books</caption>\n  <thead>\n    <tr>\n      <th scope=\"col\">Item</th>\n\
  \      <th scope=\"col\">Availability</th>\n      <th scope=\"col\">Qty</th>\n \
  \     <th scope=\"col\">Price</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n\
  \      <td>Don’t Make Me Think by Steve Krug</td>\n      <td>In Stock</td>\n   \
  \   <td>1</td>\n      <td>$30.02</td>\n    </tr>\n    <tr>\n      <td>A Project\
  \ Guide to UX Design by Russ Unger & Carolyn Chandler</td>\n      <td>In Stock</td>\n\
  \      <td>2</td>\n      <td>$52.94 ($26.47 × 2)</td>\n    </tr>\n    <tr>\n   \
  \   <td>Introducing HTML5 by Bruce Lawson & Remy Sharp</td>\n      <td>Out of Stock</td>\n\
  \      <td>1</td>\n      <td>$22.23</td>\n    </tr>\n    <tr>\n      <td>Bulletproof\
  \ Web Design by Dan Cederholm</td>\n      <td>In Stock</td>\n      <td>1</td>\n\
  \      <td>$30.17</td>\n    </tr>\n  </tbody>\n  <tfoot>\n    <tr>\n      <td>Subtotal</td>\n\
  \      <td></td>\n      <td></td>\n      <td>$135.36</td>\n    </tr>\n    <tr>\n\
  \      <td>Tax</td>\n      <td></td>\n      <td></td>\n      <td>$13.54</td>\n \
  \   </tr>\n    <tr>\n      <td>Total</td>\n      <td></td>\n      <td></td>\n  \
  \    <td>$148.90</td>\n    </tr>\n  </tfoot>\n</table>\n```\n\n![图片](img/00122.jpeg)\n\
  \n**图 11.4** 一个包含标题、表头、正文和页脚元素的书籍表格\n\n#### 合并多个单元格 (Combining Multiple Cells)\n\
  \n通常，需要将两个或多个单元格合并为一个，而不破坏整体的行列布局。可能是相邻的两个单元格包含相同的数据、有一个空单元格，或者为了样式目的需要合并单元格。在这种情况下，可以使用\
  \ `colspan` 和 `rowspan` 属性。\n\n\n\n\n`colspan` 属性用于使表格中的单个单元格跨越多个列，而 `rowspan` 属性用于使单个单元格跨越多个行。每个属性都接受一个整数值，表示跨越的单元格数量，默认值为\
  \ `1`。\n\n使用之前的书籍表格，我们现在可以移除表格页脚（tfoot）中的空表格单元格，并清理表头（thead）（请参见 图 11.5）。\n\n\n\n\
  点击此处查看代码图片\n\n```html\n<table>\n  <caption>设计与前端开发书籍</caption>\n  <thead>\n    <tr>\n\
  \      <th scope=\"col\" colspan=\"2\">项目</th>\n      <th scope=\"col\">数量</th>\n\
  \      <th scope=\"col\">价格</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n \
  \     <td>Don&#8217;t Make Me Think by Steve Krug</td>\n      <td>有货</td>\n    \
  \  <td>1</td>\n      <td>$30.02</td>\n    </tr>\n    ...\n  </tbody>\n  <tfoot\n\
  \    <tr>\n      <td colspan=\"3\">小计</td>\n      <td>$135.36</td>\n    </tr>\n\
  \    <tr>\n      <td colspan=\"3\">税费</td>\n      <td>$13.54</td>\n    </tr>\n \
  \   <tr>\n      <td colspan=\"3\">总计</td>\n      <td>$148.90</td>\n    </tr>\n \
  \ </tfoot>\n</table>\n```\n\n![图像](img/00123.jpeg)\n\n**图 11.5** 包含若干跨越多个列或行的单元格的书籍表格\n\
  \n### 表格边框\n\n有效利用边框可以帮助表格更易读。当用户尝试解释数据并快速扫描信息时，表格或单个单元格周围的边框会产生巨大影响。在使用 CSS 设置表格边框样式时，有两个属性会非常有用：`border-collapse`\
  \ 和 `border-spacing`。\n\n#### border-collapse 属性\n\n表格由父级 `<table>` 元素以及嵌套的 `<th>`\
  \ 或 `<td>` 元素组成。当我们这些元素周围应用边框时，这些边框将开始堆叠，一个元素的边框将与另一个元素的边框相邻。例如，如果我们为整个表格添加 `2`\
  \ 像素的边框，然后为每个表格单元格额外添加 `2` 像素的边框，那么表格中的每个单元格都会有一个 `4` 像素的边框。\n\n`border-collapse`\
  \ 属性决定了表格的边框模型。`border-collapse` 属性有三个值：`collapse`、`separate` 和 `inherit`。默认情况下，`border-collapse`\
  \ 属性值为 `separate`，这意味着如上述，所有不同的边框将相邻堆叠。另一方面，`collapse` 属性将边框合并为一个，并选择表格单元格作为主要边框（请参见\
  \ 图 11.6）。\n\n点击此处查看代码图片\n\n```css\ntable {\n  border-collapse: collapse;\n}\nth,\n\
  td {\n  border: 1px solid #c67cc;\n  padding: 10px 15px;\n}\n```\n\n![图像](img/00124.jpeg)\n\
  \n**图 11.6** 边框已合并的表格\n\n#### border-spacing 属性\n\n由于 `border-collapse` 属性的 `separate`\
  \ 值允许边框相互堆叠，因此 `border-spacing` 属性可以决定边框之间是否会出现多少空间。例如，一个整个表格具有 `1` 像素边框且每个单元格也具有\
  \ `1` 像素边框的表格，由于边框堆叠，每个单元格周围将有一个 `2` 像素的边框。添加 `4` 像素的 `border-spacing` 值将使边框隔开 `4`\
  \ 像素（请参见 图 11.7）。\n\n点击此处查看代码图片\n\n```css\ntable {\n  border-collapse: separate;\n\
  \  border-spacing: 4px;\n}\ntable,\nth,\ntd {\n  border: 1px solid #c67cc;\n}\n\
  th,\ntd {\n  padding: 10px 15px;\n}\n```\n\n![图像](img/00125.jpeg)\n\n**图 11.7**\
  \ 边框已分离的表格\n\n`border-spacing` 属性仅在 `border-collapse` 属性值为其默认值 `separate` 时起作用。如果之前没有使用过\
  \ `border-collapse` 属性，我们可以放心地使用 `border-spacing` 属性。\n\n此外，`border-spacing` 属性可能接受两个长度值：第一个值用于水平间距，第二个值用于垂直间距。例如，`border-spacing:\
  \ 5px 10px;` 声明将在边框之间放置 `5` 像素的水平间距和 `10` 像素的垂直间距。\n\n#### 为行添加边框\n\n为表格的行添加边框有时比较困难，特别是当我们要给行添加边框时。在表格中，我们需要确保\
  \ `border-collapse` 属性设置为 `collapse`，然后为每个 `<tr>` 元素添加底部边框，无论它是 `<th>` 还是 `<td>`\
  \ 元素。如果我们想移除表格页脚（tfoot）中元素的底部边框，可以使用 `last-child` 伪类选择器（参见 图 11.8）。\n\n点击此处查看代码图片\n\
  \n```css\ntable {\n  border-collapse: collapse;\n}\nth,\ntd {\n  border-bottom:\
  \ 1px solid #c67cc;\n  padding: 10px 15px;\n}\ntfoot tr:last-child td {\n  border-bottom:\
  \ 0;\n}\n```\n\n![图像](img/00126.jpeg)\n\n**图 11.8** 行之间有边框的表格\n\n### 表格条纹\n\n为了使表格更易读，一种常见的设计做法是为表格设置条纹。这使得行更加清晰，并为扫描信息提供了视觉提示。一种方法是给每隔一个\
  \ `<tr>` 元素设置类并为该类设置背景颜色。另一种更简单的方法是使用带有 `even` 或 `odd` 参数的 `:nth-child` 伪类选择器来选择每隔一个\
  \ `<tr>` 元素。\n\n在这里，我们的书籍表格使用带有 `even` 参数的 `:nth-child` 伪类选择器选择表格中的所有偶数行并应用背景。因此，主体每隔一行都是灰色的（请参见\
  \ 图 11.9）。\n\n点击此处查看代码图片\n\n```css\ntable {\n  border-collapse: separate;\n  border-spacing:\
  \ 0;\n}\nth,\ntd {\n  padding: 10px 15px;\n}\nthead {\n  background: #395870;\n\
  \  color: #fff;\n}\ntbody tr:nth-child(even) {\n  background: #f0f0f2;\n}\ntd {\n\
  \  border-bottom: 1px solid #c67cc;\n  border-right: 1px solid #c67cc;\n}\ntd:first-child\
  \ {\n  border-left: 1px solid #c67cc;\n}\n```\n\n![图像](img/00127.jpeg)\n\n**图 11.9**\
  \ 带有条纹的表格\n\n这段代码中有一些值得注意的细之处。首先，`<table>` 元素显式地设置了 `border-collapse` 属性为 `separate`，并将\
  \ `border-spacing` 属性设置为 `0`。其由于 `<td>` 元素包含边框，而 `<th>` 元素不包含。如果不将 `border-collapse`\
  \ 属性设置为 `separate`，`<td>` 元素的边框会导致表格主体和页脚比头部宽。\n\n\n\n由于 `border-collapse` 属性被设置为\
  \ `separate`，我们需要小心边框应用到 `<td>` 元素的方式。在这里，边框被设置在所有 `<td>` 元素的右侧和底部。然后，`<tr>` 元素内的第一个\
  \ `<td>` 元素将获得一个左边框。由于所有的 `<td>` 元素堆叠在一起，它们的边框也同样堆叠，从而形成每个元素周围都有实线边框的视觉效果。\n\n最后，所有的\
  \ `<th>` 元素接收蓝色 `background`，每个偶数 `<tr>` 元素通过 `:nth-child` 伪类选择器接收灰色 `background`。\n\
  \n### 文本对齐\n\n除了表格边框和条纹外，单元格内文本的对齐（包括水平和垂直）在表格格式中起着至关重要的作用。名称、描述等通常左对齐，而数字和其他图形则右对齐。其他信息取决于其上下文，可能会居中。我们可以使用\
  \ CSS 中的 `text-align` 属性来水平移动文本，正如我们在第 6 课中“处理排版”中所过的那样。\n\n然而，要垂直对齐文本，则使用 `vertical-align`\
  \ 属性。`vertical-align` 属性仅对内联元素和表格单元格元素有效——它对块级、行内块或任何其它元素级别无效。\n\n`vertical-align`\
  \ 属性接受几个不同的值；最常用的值是 `top`、`middle` 和 `bottom`。这些值相对于表格单元格（对于表格单元格元素）或最近的父元素（对于内联级）垂直定位文本。\n\
  \n通过修改 HTML 和 CSS 以包含 `text-align` 和 `vertical-align` 属性，我们可以清理书籍表格的布局。注意，表格中的数据变得更加清晰且易于阅读（参见图\
  \ 11.10）。\n\n![Image](img/00128.jpeg)\n\n**图 11.10** 具有多种文本对齐方式的表格\n\n### HTML\n\
  \n点击此处查看代码图像\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th scope=\"col\" colspan=\"\
  2\">Item</th>\n      <th scope=\"col\">Qty</th>\n      <th scope=\"col\">Price</th>\n\
  \    </tr>\n  </head>\n  <tbody>\n    <tr>\n      <td>\n        <strong class=\"\
  book-title\">Don’t Make Me Think</strong> by Steve Krug\n      </td>\n      <td\
  \ class=\"item-stock\">In Stock</td>\n      <td class=\"item-qty\">1</td>\n    \
  \  <td class=\"item-price\">$30.02</td>\n    </tr>\n    <tr>\n      <td>\n     \
  \   <strong class=\"book-title\">A Project Guide to UX Design</strong> by Russ Unger\
  \ &; Carolyn Chandler\n      </td>\n      <td class=\"item-stock\">In Stock</td>\n\
