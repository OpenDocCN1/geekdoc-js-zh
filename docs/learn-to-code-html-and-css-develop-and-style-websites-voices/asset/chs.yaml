  >Total</td>\n      <td>$148.90</td>\n    </tr>\n  </tfoot>\n</table>\n```\n\n###\
  \ CSS\n\n点击此处查看代码图像\n\n```css\ntable {\n  border-collapse: separate;\n  border-spacing:\
  \ 0;\n  color: #4a4a4d;\n  font: 14px/1.4 \"Helvetica Neue\", Helvetica, Arial,\
  \ sans-serif;\n}\nth,\ntd {\n  padding: 10px 15px;\n  vertical-align: middle;\n\
  }\nthead {\n  background: #395870;\n  color: #fff;\n}\nth:first-child {\n  text-align:\
  \ left;\n}\ntbody tr:nth-child(even) {\n  background: #f9f9f9;\n}\ntd:first-child\
  \ {\n  border-left: 1px solid #ccc;\n}\ntd:last-child {\n  border-right: 1px solid\
  \ #ccc;\n}\ntr:last-child td {\n  border-bottom: 1px solid #ccc;\n}\n```\n\n\n\n\
  \n```css\n{\n  background: -webkit-linear-gradient(#49708f, #293f50);\n  background:\
  \ -moz-linear-gradient(#49708f, #293f50);\n  background: linear-gradient(#49708f,\
  \ #293f50);\n  color: #fff;\n  font-size: 11px;\n  text-transform: uppercase;\n\
  }\nth:first-child {\n  border-top-left-radius: 5px;\n  text-align: left;\n}\nth:last-child\
  \ {\n  border-top-right-radius: 5px;\n}\ntbody tr:nth-child(even) {\n  background:\
  \ #f0f0f2;\n}\ntd {\n  border-bottom: 1px solid #c6c7cc;\n  border-right: 1px solid\
  \ #c6c7cc;\n}\ntd:first-child {\n  border-left: 1px solid #c6c7cc;\n}\n.book-title\
  \ {\n  color: #395870;\n  display: block;\n}\n.text-offset {\n  color: #7c7c80;\n\
  \  font-size: 12px;\n}\n.item-stock,\n.item-qty {\n  text-align: center;\n}\n.item-price\
  \ {\n  text-align: right;\n}\n.item-multiple {\n  display: block;\n}\ntfoot {\n\
  \  text-align: right;\n}\ntfoot tr:last-child {\n  background: #f0f0f2;\n  color:\
  \ #395870;\n  font-weight: bold;\n}\ntfoot tr:last-child td:first-child {\n  border-bottom-left-radius:\
  \ 5px;\n}\ntfoot tr:last-child td:last-child {\n  border-bottom-right-radius: 5px;\n\
  }\n```\n\n### 实践操作\n\n现在我们已经学会了如何创建和设置表格样式，让我们完成样式会议网站的最后一个页面：日程安排。\n\n**1.** 我们将通过打开\
  \ `schedule.html` 文件开始构建日程页面，并添加一个类名属性值为 `row` 的 `<section>` 元素，就像我们对所有其他子页面做的那样。在这个新的\
  \ `<section>` 元素中，我们也添加一个类名属性值为 `container` 的 `<div>` 元素。\n\n点击此处查看代码\n\n```html\n\
  <section class=\"row\">\n  <div class=\"container\">\n    ...\n  </div>\n</section>\n\
  ```\n\n通过这些元素和类，我们已经在页面上创建了一个具有白色背景（background）和垂直内边距（padding）的新区域，并将内容在页面上居中。这里与所有其他子页面不同之处在于，`<div>`\
  \ 元素上使用的是 `container` 类属性值，而不是之前的 `grid` 类属性值。由于我们没有使用任何基于 `col` 的类，因此我们放弃了 `grid`\
  \ 类属性，转而使用 `container` 类属性值。\n\n**2.** 在新区域中，我们将添加三个表格，每个表格对应会议的每一天。表格将使用三列多行的结构来显示每天的活动，并包含表头（thead）和表体（tbody）。为了开始，让我们先勾勒第一个表格的结构，包括\
  \ `<table>`、`<thead>` 和 `<tbody>` 元素。\n\n点击此处查看代码\n\n```html\n<section class=\"\
  row\">\n  <div class=\"container\">\n    <table>\n      <thead>\n      </thead>\n\
  \      <tbody>\n      </tbody>\n    </table>\n  </div>\n</section>\n```\n\n**3.**\
  \ 目前，尽管我们的第一个表格没有包含任何数据，但它已经应用了一些样式。具体来说，我们在第 1 节 中添加的重置样式以减弱所有默认的浏览器样式，这为表格添加了\
  \ `border-collapse` 属性（值为 `collapse`）和 `border-spacing` 属性（值为 `0`）。我们需要这些样式，所以就保持它们不变；但是，让我们在\
  \ `main.css` 文件中创建一个新区域来添加一些样式。\n\n在我们专门为日程页面的新样式区域中（它将出现在演讲者页面的样式下方），我们将 `<table>`\
  \ 元素的宽度（width）设置为 `100%`，底部外边距（margin）设置为 `44` 像素。然后，使用 `:last-child` 伪类选择器识别区域内的最后一个\
  \ `<table>` 元素，将其底部外边距设置为 `0` 像素。这样做可以防止该表格与类名属性值为 `row` 的 `<section>` 元素的底部内边距（padding）发生冲突。\n\
  \n到为止，`main.css` 文件中的新区域看起来如下：\n\n点击此处查看代码\n\n```css\n/*\n========================\n\
  Schedule\n========================\n*/\ntable {\n  margin-bottom: 44px;\n  width:\
  \ 100%;\n}\ntable:last-child {\n  margin-bottom: 0;\n}\n```\n\n**4.** 现在，为我们的表格添加数据。我们将从会议的第一天开始，即\
  \ 8 月 24 日。\n\n在表格的 `<thead>` 元素中，让我们添加一个 `<tr>` 元素。行的第一个单元格将是 `<th>` 元素，标记为“工作坊”（Workshops）。在\
  \ `<th>` 元素之后是一个 `<td>` 元素，显示日期“8 月 24 日”。我们将为该行添加 `scope=\"row\"` 属性。通常情况下，会有三列：第一列是标识时间的表头，后两列是标识演讲者的普通单元格。由于这一行没有多个演讲者，我们将为\
  \ `<td>` 元素添加 `colspan` 属性，值为 `2`，使其跨越两列。\n\n我们的表格代码现在如下：\n\n点击此处查看代码\n\n```html\n\
  <table>\n  <thead>\n    <tr>\n      <th scope=\"row\">\n        Workshops\n    \
  \  </th>\n      <td colspan=\"2\">\n        August 24th\n      </td>\n    </tr>\n\
  \  </thead>\n  <tbody>\n  </tbody>\n</table>\n```\n\n**5.** 在 `<tbody>` 元素内部，让我们填充内容。我们首先添加一个\
  \ `<tr>` 元素，其中直接包含一个 `<th>` 和一个 `<td>`。在 `<th>` 及其后续元素中，我们将添加 `scope=\"row\"` 属性以在语义上识别该元素为表头。然后在\
  \ `<th>` 元素内部，添加一个 `<time>` 元素来显示当天第一个活动的时间：“8:30 AM”。我们会在 `<time>` 元素上包含一个 `datetime`\
  \ 属性，格式为时、分、秒 `08:30:00`。在 `<th>` 之后的 `<td>` 元素中，我们将包含名称（因为此时没有演讲者），即“注册”（Registration）。由于此时只有一个活动，我们将在\
  \ `<td>` 元素上包含 `colspan` 属性，值为 `2`。\n\n最终，第一个表格的代码看起来如下：\n\n点击此处查看代码\n\n```html\n\
  <table>\n  <thead>\n    <tr>\n      <th scope=\"row\">\n        Workshops\n    \
  \  </th>\n      <td colspan=\"2\">\n        August 24th\n      </td>\n    </tr>\n\
  \  </thead>\n  <tbody>\n    <tr>\n      <th scope=\"row\">\n        <time datetime=\"\
  08:30:00\">8:30 AM</time>\n      </th>\n      <td colspan=\"2\">\n        Registration\n\
  \      </td>\n    </tr>\n  </tbody>\n</table>\n```\n\n**6.** 对于 `<tbody>` 元素中的第二行，让我们在上一行下方添加一个\
  \ `<tr>` 元素。然后，添加 `<th>` 元素并带有值为 `row` 的 `scope` 属性，再次在该 `<th>` 元素内添加一个带有相应时间和 `datetime`\
  \ 属性值的 `<time>` 元素。\n\n\n\n\n\n在 `<th>` 元素之后，让我们为当时正在演讲的两个演讲者添加两个 `<td>` 元素。在每个\
  \ `<td>` 元素内部，我们将添加一个 `<a>` 元素，它将链接回该演讲者在“演讲者（Speakers）”页面上的位置。记得，我们已经在每个演讲者的父元素上添加了带有其名字的\
  \ `id` 属性。通过 `speakers.html` 文件名加上井号 `#` 对应的该 `id` 属性值，我们可以直接链接到演讲者页面中该演讲者的演讲描述和简介。\n\
  \n在 `<a>` 元素内部，我们将包含一个带有演讲者名字的 `<h4>` 元素，随后是演讲标题。\n\n前两个工作坊的代码如下：\n\n点击此处查看代码图像\n\
  \n```html\n<table>\n  <<thead>\n    <tr>\n      <th scope=\"row\">\n        Workshops\n\
  \      </th>\n      <td colspan=\"2\">\n        August 24th\n      </td>\n    </tr>\n\
  \  </thead>\n  <tbody>\n      <tr>\n        <th scope=\"row\">\n          <time\
  \ datetime=\"08:30:00\">8:30 AM</time>\n        </th>\n        <td colspan=\"2\"\
  >\n          Registration\n        </td>\n      </tr>\n      <tr>\n        <th scope=\"\
  row\">\n          <time datetime=\"09:00:00\">9:00 AM</time>\n        </th>\n  \
  \      <td>\n          <a href=\"speakers.html#adam-connor\">\n            <h4>Adam\
  \ Connor</h4>\n            Lights! Camera! Interaction! Design Inspiration from\
  \ Filmmakers\n          </a>\n        </td>\n        <td>\n          <a href=\"\
  speakers.html#jennifer-jones\">\n            <h4>Jennifer Jones</h4>\n         \
  \   What Designers Can Learn from Parenting\n          </a>\n        </td>\n   \
  \   </tr>\n  </tbody>\n</table>\n```\n\n### 7. 从这里开始，我们可以为每个活动和每个演讲者重复这种模式，以完成我们的第一个表格，然后为会议的后两天添加接下来两个表格。\n\
  \n在执行此操作时，请记住 `<thead>` 始终将包含一个注明当天活动的标题和一个显示日期的单元格。然后，在 `<tbody>` 内部，每一行都将有一个显示当天时间的标题。在标题之后将是一项活动、一个演讲者或多个演讲者。活动将位于一个跨越两列的单个\
  \ `<td>` 中。如果某个时间只有一个演讲者演讲，该演讲者也将位于一个跨越两列的单个 `<td>` 中，包含 `<a>` 和 `<h4>` 元素。如果给定时间有两个演讲者，每个演讲者将位于其各自的\
  \ `<td>` 中。\n\n所有表格的完整可以在 `http://learn.howe.com/html-css/organizing-data-tables`\
  \ 找到。作为参考，第一天的表格（包括午餐两个演讲者）所示：点击此处查看图像\n\n```html\n<table>\n  <<thead>\n    <tr>\n\
  \      <th scope=\"row\">\n        Workshops\n      </th>\n      <td colspan=\"\
  2\">\n        August 24th\n      </td>\n    </tr>\n  </thead>\n  <tbody>\n     \
  \ <tr>\n        <th scope=\"row\">\n          <time datetime=\"08:30:00\">8:30 AM</time>\n\
  \        </th>\n        <td colspan=\"2\">\n          Registration\n        </td>\n\
  \      </tr>\n      <tr>\n        <th scope=\"row\">\n          <time datetime=\"\
  09:00:00\">9:00 AM</time>\n        </th>\n        <td>\n          <a href=\"speakers.html#adam-connor\"\
  >\n            <h4>Adam Connor</h4>\n            Lights! Camera! Interaction! Design\
  \ Inspiration from Filmmakers\n          </a>\n        </td>\n        <td>\n   \
  \       <a href=\"speakers.html#jennifer-jones\">\n            <h4>Jennifer Jones</h4>\n\
  \            What Designers Can Learn from Parenting\n          </a>\n        </td>\n\
  \      </tr>\n      <tr>\n        <th scope=\"row\">\n          <time datetime=\"\
  12:30:00\">12:30 PM</time>\n        </th>\n        <td colspan=\"2\">\n        \
  \  Lunch\n        </td>\n      </tr>\n      <tr>\n        <th scope=\"row\">\n \
  \         <time datetime=\"14:00\">2:00 PM</time>\n        </th>\n        <td>\n\
  \          <a href=\"speakers.html#tessa-harmon\">\n            <h4>Tessa Harmon</h4>\n\
  \            Crafty Coding: Generating Patterns\n          </a>\n        </td>\n\
  \        <td>\n          <a href=\"speakers.html#russ-unger\">\n            <h4>Russ\
  \ Unger</h4>\n            From Muppets to Mastery: Core Principles from Mr. Jim\
  \ Henson\n          </a>\n        </td>\n      </tr>\n  </tbody>\n</table>\n```\n\
  \n### 8. 现在我们的表格已经初具规模，是时候为它们添加一些样式了。让我们先通过为 `<th>` 和 `<td>` 元素添加一些通用样式开始。为 `<th>`\
  \ 和 `<td>` 元素添加 22px 的底部 `padding` 和顶部对齐。专门为 `<th>` 元素，我们添加 45px 的右侧 `padding`、右对齐以及\
  \ 20% 的 `width`。然后，为 `<td>` 元素添加 40% 的 `width`。\n\n在我们现有的表格样式下方，代码如下：点击此处查看图像\n\n\
  ```css\nth,\ntd {\n  padding-bottom: 22px;\n  vertical-align: top;\n}\nth {\n  padding-right:\
  \ 45px;\n  text-align: right;\n  width: 20%;\n}\ntd {\n  width: 40%;\n}\n```\n\n\
  ### 9. 接下来，让我们为表头及其元素设置样式。我们将仅为 `<thead>` 元素设置 44px 的 `line-height`，并为 `<thead>`\
  \ 之内部所有 `<th>` 元素设置 #648880 的 `color` 和 24px 的 `font-size`。我们的新样式包括：\n\n```css\n\
  thead {\n  line-height: 44px;\n}\nthead th {\n  color: #648880;\n  font-size: 24px;\n\
  }\n```\n\n### 10. 表头看起来不错，所以让我们也为主体添加一些样式。我们从嵌套在 `<tbody>` 中的 `<th>` 元素开始：更改颜色，添加一些字体和文本样式，并添加一些顶部\
  \ `padding`。\n\n点击此处查看图像\n\n```css\ntbody th {\n  color: #a9b2b9;\n  font-size:\
  \ 14px;\n  font-weight: 400;\n  padding-top: 22px;\n  text-transform: uppercase;\n\
  }\n```\n\n### 11. 我们还将为嵌套在 `<tbody>` 中的 `<td>` 元素添加一些样式。我们将为仅跨一列的 `<td>` 元素设置样式：为左侧列的元素添加\
  \ 15px 的右侧 `padding`，为右侧列的元素添加 15px 的左侧 `padding`。这样做两列之间就有总共 30px 的 `padding`，同时保持每个单元格的大小相同。对于跨两列的\
  \ `<td>` 元素，我们不需要应用任何左或或右 `padding`。\n\n我们将使用 `:first-of-type`、`:last-of-type` 和\
  \ `:only-of-type` 伪类选择器添加所有这些水平 `padding`。这些伪类选择器与我们之前使用的 `:last-child` 伪类选择器工作非常相似。\n\
  \n\n\n\n再次，在我们的案例中，`td:last-of-type` 选择器将选择 `<tr>` 元素内的最后一个 `<td>` 元素。最后，`:only-of-type`\
  \ 伪类选择器会在元素是其父元素内唯一同类型元素时选择该元素。在这里，`td:only-of-type` 选择器只有在 `<td>` 元素是 `<tr>` 元素内唯一的\
  \ `<td>` 元素时才会选择它，例如当 `<td>` 元素跨越两列时。\n\n我们的样式有些复杂，但在处理我们表格需求方面非常灵活。这些新样式包含了以下：\n\
  \n点击此处查看代码图片\n\n```css\ntbody td {\n  border-top: 1px solid #dfe2e5;\n  padding-top:\
  \ 21px;\n}\ntbody td:first-of-type {\n  padding-right: 15px;\n}\ntbody td:last-of-type\
  \ {\n  padding-left: 15px;\n}\ntbody td:only-of-type {\n  padding-left: 0;\n  padding-right:\
  \ 0;\n}\n```\n\n**12.** 我们的日程表——以及显示该日程的表格——正在成型。让我们调整现有元素的一些样式来优化设计。我们首先将表格内所有的链接设置为中灰色。如果我们只针对表格内的\
  \ `<a>` 元素，那么在链接中带有演讲者名称的标题将保持为绿色，而讲座标题将变为灰色，从而在两者之间形成良好的对比。\n\n当我们调整讲座条目的样式之同时，让我们也移除表格内\
  \ `<h4>` 元素的底部 `margin`（外边距），让演讲者的名字更靠近他或她的标题。我们可以通过以下代码实现这些样式：\n\n```css\ntable\
  \ a {\n  color: #888;\n}\ntable h4 {\n  margin-bottom: 0;\n}\n```\n\n**13.** 最后，让我们在全天范围内发生的不同类型的活动之间创建一些视觉对比。在了最新的更改后，所有的演讲看起来都很好。对于所有其他活动，如注册、午餐和休息（位于表格体\
  \ `tbody` 中）以及日期（位于表头 `thead` 中），让我们使用细微的灰色。\n\n我们将通过创建一个新类 `schedule-offset` 并为其赋值颜色\
  \ `#a9b2b9` 来实现这一点。\n\n```css\n.schedule-offset {\n  color: #a9b2b9;\n}\n```\n\n\
  一旦该类就绪，让我们将其添加到所有跨越两列且包含日期或指定活动（注册、午餐或休息）的 `<td>` 元素中。回看我们第一天研讨会日的表格，HTML 看起来像这样：\n\
  \n点击此处查看代码图片\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th scope=\"row\">\n\
  \        Workshops\n      </th>\n      <td class=\"schedule-offset\" colspan=\"\
  2\">\n        August 24th\n      </td>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n\
  \      <th scope=\"row\">\n        <time datetime=\"08:30:00\">8:30 AM</time>\n\
  \      </th>\n      <td class=\"schedule-offset\" colspan=\"2\">\n        Registration\n\
  \      </td>\n    </tr>\n    ...\n    <tr>\n      <th scope=\"row\">\n        <time\
  \ datetime=\"12:30:00\">12:30 PM</time>\n      </th>\n      <td class=\"schedule-offset\"\
  \ colspan=\"2\">\n        Lunch\n      </td>\n    </tr>\n    ...\n  </tbody>\n</table>\n\
  ```\n\n表格表面上看起来可能简单，但非常复杂，我们的样式日程就是如此。好消息是，我们的日程表现在完成了，而且看起来非常棒（参见图 11.12）。\n\n\
  ![图像](img/00130.jpeg)\n\n**图 11.12** Styles 会议日程页面，包含了多个表格。\n\n本课练习的源代码可以在 [`learn.shayhowe.com/html-css/organizing-data-with-tables`](http://learn.shayhowe.com/html-css/organizing-data-with-tables)\
  \ 找到。\n\n### 总结\n\n好了，我们现在知道如何在 HTML 中语义化地布局数据，同时通过 CSS 使其直观化。讨论表格是我们学习 HTML 和 CSS\
  \ 过程中最后一个主要障碍，现在我们正式完成了 Styles 网站。\n\n回顾一下，在本节中我们涵盖了以下内容：\n- 语义化创建表格的最佳方法\n- 如何让单个单元格跨越多列或多行\n\
  - 构成表格的结构性元素\n- 设置表格边框的不同方法，以及不同的边框属性如何影响表格外观\n- 如何在表格内垂直对齐文本\n\n我们在运用所有新技能方面做得非常好，已经比几节课前的水平进步了一大步。\n\
  \n\n\nHTML 元素库非常大，有超过 100 个元素可供使用。决定使用哪些元素来描述不同的内容可能很困难，但这些元素是语义化的骨石。我们需要研究并反复检查代码，以确保我们使用了正确的语义化元素。从长远来看，用户会感谢我们构建了更具无性的网站，而且你的\
  \ HTML 显然会更容易进行样式化。如果你对自己的代码不确定，可以找个朋友帮忙并进行例行的代码审查。\n\n这里的 HTML 没有使用正确的标题和段落元素；相反，它使用了无意义的元素对内容进行样式化和分组。\n\
  \n## 代码\n\n点击此处查看代码\n\n```html\n1. <span class=\"heading\"><strong>Welcome Back</strong></span></span>\n\
  2. <br><br>\n3. It has been a while. What have you been up to lately?\n4. <br><br>\n\
  ```\n\n## 正确代码\n\n点击此处查看代码\n\n```html\n1. <h1>Welcome Back</h1>\n2. <p>It has been\
  \ a while. What have you been up to lately?</p>\n```\n\n## 使用正确的文档结构\n\n如前所述，HTML\
  \ 是一种非常宽容的语言，因此即使不使用 `<!DOCTYPE html>` 文档类型或 `<html>`、`<head>` 和 `<body>` 元素，页面也可以渲染。如果没有文档类型和这些结构性元素，页面在每个浏览器中都无法正常渲染。\n\
  \n我们必须始终确保使用正确的文档结构，包括 `<!DOCTYPE html>` 文档类型以及 `<html>`、`<head>` 和 `<body>` 元素。这样做可以保持我们的页面符合标准且完全语义化，并有助于确保它们按照我们的意愿进行渲染。\n\
  \n## 代码\n\n点击此处查看代码\n\n```html\n1. <html>\n2.   <h1>Hello World</h1>\n3.   <p>This\
  \ is a web page.</p>\n4. </html>\n```\n\n## 正确代码\n\n点击此处查看代码\n\n```html\n1. <!DOCTYPE\
  \ html>\n2. <html>\n3.   <head>\n4.     <title>Hello World</title>\n5.   </head>\n\
  6.   <body>\n7.       <h1>Hello World</h1>\n8.       <p>This is a web page.</p>\n\
  9.   </body>\n10. </html>\n```\n\n## 保持语法整洁\n\n随着页面的增长，管理 HTML 可能会变成一项艰巨的任务。幸运的是，有一些简单的规则可以帮助我们保持语法的整洁和有序。这些包括以下内容：\n\
  \n- 在元素名、属性和值中使用小写字母\n- 对嵌套元素进行缩进\n- 严格使用双引号，不要使用单引号或完全省略引号\n- 移除自闭合元素末尾的斜杠\n- 省略布尔属性的值\n\
  \n遵守这些规则将有助于保持代码的整洁易读。观察这里的两组 HTML，正确的代码更容易理解和消化。\n\n## 代码\n\n点击此处查看代码\n\n```html\n\
  1. <Aside>\n2. <h3>Chicago</h3>\n3. <H5 HIDDEN='HIDDEN'>City in Illinois</H5>\n\
  4. <img src=chicago.jpg alt=\"Chicago, the third most populous city in the United\
  \ States\" />\n5. <ul>\n6. <li>234 square miles</li>\n7. <li>2.715 million residents</li>\n\
  8. </ul>\n9. </ASIDE>\n```\n\n## 正确代码\n\n点击此处查看代码\n\n```html\n1. <aside>\n2.   <h3>Chicago</h3>\n\
  3.   <h5 hidden>City in Illinois</h5>\n4.   <img src=\"chicago.jpg\" alt=\"Chicago,\
  \ the third most populous city in the United States\">\n5.   <ul>\n6.     <li>234\
  \ square miles</li>\n7.     <li>2.715 million residents</li>\n8.   </ul>\n9. </aside>\n\
  ```\n\n## 使用实用的 ID 和 Class 值\n\n创建 ID 和类名（class）值可能是编写 HTML 过程中较具挑战性的部分之一。这些值需要具有实用性，与内容本身相关，而不是内容的样式。使用\
  \ `red` 值来描述红色文本并不是理想的，因为它描述的是内容的呈现方式。如果以后需要将文本样式改为蓝色，不仅需要更改 CSS，每个存在类 `red` 的 HTML\
  \ 实例都需要修改。\n\n这里的 HTML 假设警报消息是红色的。然而，如果警报的样式变为橙色，`red` 类名将不再具有意义，并可能导致混惑。\n\n##\
  \ 代码\n\n点击此处查看代码\n\n```html\n1. <p class=\"red\">Error!</p>\n```\n\n## 正确代码\n\n\
  ```html\n1. <p class=\"alert\">Error!</p>\n```\n\n\n\n\n如果我们愿意，也可以使用注释在文件的顶部构建一个目录。这样做可以准确地提醒我们（以及他人）文件中包含了哪些内容，以及样式所在的位置。\n\
  \n### 坏坏的代码\n```css\n1. header { ... }\n2. article { ... }\n3. .btn { ... }\n```\n\
  \n### 良好的代码\n```css\n1. /* 主标题 */\n2. header { ... }\n3.\n4. /* 特色文章 */\n5. article\
  \ { ... }\n6.\n7. /* 按钮 */\n8. .btn { ... }\n```\n\n#### 使用多行和空格编写 CSS\n\n在编写 CSS\
  \ 时，将每个选择器和声明放置在新行上是非常重要的。然后，在每个选择器内部，我们希望对声明进行缩进。\n\n在选择器之后、第一个声明之前是左大括号 `{`，它的前面应该有一个空格。在声明内部，我们需要在属性随后的冒号\
  \ `:` 之后加上一个空格，并用分号 `;` 结束每个声明。\n\n这样做可以使代码易于阅读也易于编辑。当所有代码堆叠在一个没有空格的单行中时，很难进行扫描和修改。\n\
  \n### 坏的代码\n点击此处查看代码图片\n```css\n1. a,.btn{background:#aaa;color:#f60;font-size:18px;padding:6px;}\n\
  ```\n\n### 良好的代码\n```css\n1. a,\n2. .btn {\n3.   background: #aaa;\n4.   color:\
  \ #f60;\n5.   font-size: 18px;\n6.   padding: 6px;\n7. }\n```\n\n***\n\n### 注释与间距\n\
  \n这两项建议（使用注释组织代码以及使用多行和空格）不仅适用于 CSS，也适用于 HTML 或任何其他语言。总的来说，我们需要保持代码的整洁和良好的文档记录。如果代码的某个部分比较复杂，让我们在注释中解释它是如何工作的以及适用于什么。这样做有助于工作在同一代码库的其他人员，也有帮助我们日后重新查看自己的代码。\n\
  \n***\n\n#### 使用恰当的类名\n\n类名（或值）应该是模块化的，并且尽可能与元素内部的内容有关，而不是外观。这些值的编写方式应该类似于 CSS 语言的语法。因此，类名应该全部全小写，并使用连字符作为分隔符。\n\
  \n### 坏的代码\n```css\n1. .Red_Box { ... }\n```\n\n### 良好的代码\n```css\n1. .alert-message\
  \ { ... }\n```\n\n#### 构建熟练的选择器\n\n如果如果不细心维护，CSS 选择器可能会失控。它们很容易变得过长且具有太强的位置特定性。\n\
  \n选择器越长、包含的前置符越多，它的特异（specificity）越高。特异越高，选择器越容易破坏 CSS 级联并导致不可预的问题。\n\n此外，根据保持选择器特异性尽可能低的原则，让我们不要在选择器中使用\
  \ ID。ID 过于特异了，会迅速提高选择器的特异，并且经常破坏我们 CSS 文件中的级联。使用 ID 的缺点远大于优点，我们避免它们是明智的。\n\n让我们使用更短且主要是直接的选择器。仅将它们嵌套在在二到三层深，并尽可能地移除许多基于位置的限定选择器。\n\
  \n### 坏的代码\n点击此处查看代码图片\n```css\n1. #aside #featured ul.news li a { ... }\n2. #aside\
  \ #featured ul.news li a em.special { ... }\n```\n\n### 良好的代码\n```css\n1. .news\
  \ a { ... }\n2. .news .special { ... }\n```\n\n#### 需要时使用特定的类\n\n有时 CSS 选择器会非常长且具体，以至于它不再具有意义。它会产生性能延迟，并且管理起来很困难。在这种情况下，建议只使用一个类。虽然在目标元素上应用类会在\
  \ HTML 中创建更多代码，但它将允许代码渲染得更快并消除任何管理障碍。\n\n例如，如果一个 `<em>` 元素嵌套在 `<aside>` 元素内部的 `<h1>`\
  \ 元素中，而所有这些又嵌套在一个 `<section>` 元素中，选择器看起来可能像 `aside h1 em`。如果 `<em>` 元素移出 `<h1>`\
  \ 元素，样式将不再生效。一个更好、更灵活的选择器应该使用一个类，例如 `text-offset`，来针对 `em` 元素。\n\n### 坏的代码\n```css\n\
  1. section aside h1 em { ... }\n```\n\n### 良好的代码\n```css\n1. .text-offset { ...\
  \ }\n```\n\n#### 使用简写属性和值\n\nCSS 的功能之一是能够使用简写属性和值。大多数属性和值都有简写的替代方案。例如，与其使用四个基于 `margin`\
  \ 的属性和值来设置元素四边的边边距，不如使用一个 `margin` 属性和值声明来一次设置四边的值。使用简写允许我们快速地设置和识别。\n\n然而，当我们只设置一个值时，不应该使用简写替代方案。如果一个框只需要一个\
  \ `margin`，请使用 `margin-bottom` 属性。这样做可以确保其他 `margin` 值不会被覆盖，并且我们可以轻松识别 `margin`\
  \ 应用于哪一侧。\n\n### 坏的代码\n```css\n1. box {\n2.   margin-top: 5px;\n3.   margin-right:\
  \ 10px;\n4.   margin-bottom: 5px;\n5.   margin-left: 10px;\n6. }\n```\n### 良好的代码\n\
  ```css\n1. box {\n2.   margin: 5px 10px;\n3. }\n```\n\n#### 使用简写十六进制颜色\n\n当可用时，使用三字符简写颜色，并且始终使用小写字母。\n\
  \n### 坏的代码\n```css\n1. .text {\n2.   background: #DDDD;\n3.   color: #FF00;\n4.\
  \ }\n```\n\n### 良好的代码\n```css\n1. .text {\n2.   background: #ddd;\n3.   color: #f60;\n\
  4. }\n```\n\n#### 从零中移除单位\n\n减少代码数量的方法是从零值中移除单位。无论使用什么长度单位——像素、百分比等等——零总是零。\n\n\
  ### 坏的代码\n```css\n1. div {\n2.   margin: 20px 0px;\n3.   padding: 0px;\n4. }\n```\n\
  \n### 良好的代码\n```css\n1. div {\n2.   margin: 20px 0;\n3.   padding: 0;\n4. }\n```\n\
  \n#### 分组并对齐供应商前缀\n\n随着 CSS3，供应商前缀变得流行，为 CSS 文件增加了大量代码。使用供应商前缀的额外工作通常是值得的；但是它们必须保持组织。为了符合编写易读代码的目标，最好分组并缩进单个供应商前缀，使属性名称垂直堆叠，值也是如此。\n\
  \n取决于供应商前缀的位置是在属性上还是值上，对齐可能会不同。例如，下面的良好代码将 `background` 属性对齐，而带有前缀的 `linear-gradient()`\
  \ 函数缩进以保持其值垂直堆叠。然后，根据需要缩进带有前缀的 `box-sizing` 属性，以保持属性和值垂直堆叠。\n\n一如既往，目标是让样式更易读和编辑。\n\
  \n### 坏的代码\n点击此处查看代码图片\n```css\n1. div {\n2.   background: -webkit-linear-gradient(#a1d3b0,\
  \ #f6f1d3);\n3.   background: -moz-linear-gradient(#a1d3b0, #f6f1d3);\n4.   background:\
  \ linear-gradient(#a1d3b0, #f6f1d3);\n5.   -webkit-box-sizing: border-box;\n6. \
  \  -moz-box-sizing: border-box;\n7.   box-sizing: border-box;\n8. }\n```\n\n###\
  \ 良好的代码\n点击此处查看代码图片\n```css\n1. div {\n2.   background: -webkit-linear-gradient(#a1d3b0,\
  \ #f6f1d3);\n3.   background: -moz-linear-gradient(#a1d3b0, #f6f1d3);\n4. }\n```\n\
  \n\n\n\n```css\nbackground: linear-gradient(#a1d3b0, #f6f1d3);\n-webkit-box-sizing:\
  \ border-box;\n-moz-box-sizing: border-box;\nbox-sizing: border-box;\n```\n\n##\
  \ 厂商前缀 (Vendor Prefixes)\n\n在使用厂商前缀时，我们需要确保将不带前缀的属性和值放在最后，放在任何带前缀的版本之后。这样做可以支持不带前缀版本的浏览器根据其在级联中的位置来渲染该样式，即从文件的顶部到底部读取样式。\n\
  \n好消息是，浏览器正在逐渐停止使用厂商前缀。随着时间的推移，这将不再是一个问题；但目前，我们最好仔细检查哪些样式需要厂商前缀，并保持这些前缀井然有序。\n\n\
  ## 样式模块化以便复用\n\nCSS 的设计是为了允许样式被复用，特别是通过类（classes）的使用。因此，分配给类的样式应该是模块化的，并可以根据需要跨元素进行共享。\n\
  \n如果新闻的一个部分包含在一个带有边框、背景颜色和其他样式的框中，那么 `news` 类似乎是一个很好的选择。然而，同样的样式可能也需要应用到即将发生的活动部分。在这种情况下，`news`\
  \ 类就不合适。`feat-box` 类会更有意义，并可能在整个网站广泛使用。\n\n### 错误的代码\n\n```css\n.news {\n  background:\
  \ #eee;\n  border: 1px solid #ccc;\n  border-radius: 6px;\n}\n.events {\n  background:\
  \ #eee;\n  border: 1px solid #ccc;\n  border-radius: 6px;\n}\n```\n\n### 良好的代码\n\
  \n```css\n.feat-box {\n  background: #eee;\n  border: 1px solid #ccc;\n  border-radius:\
  \ 6px;\n}\n```\n\n### 总结\n\n希望编写优 HTML 和 CSS 的原则在这里开始变得清晰。虽然每种语言都有自己的复杂之处，但这些实践中的大部分可以在两种语言之间以及许多其他计算机语言之间共享。\n\
  \n个人而言，我们需要尽力维护这些实践；而在团队工作时，我们需要尽力帮助团队成员了解这些实践。同样，我们的团队可能有宝贵的建议和做法，我们应该共同遵循。\n\n\
  为了突出本课程的一些核心主题，我们的 HTML 和 CSS 应该始终：\n\n- 组织良好，以便于阅读、编辑和维护\n- 模块化且灵活的，允许我们根据需要复用代码和模式\n\
  - 看起来像是由一个人编写的，即使是几个人贡献的\n\n这些实践只是开始，随着语言的演进以及我们编写越来越多的 HTML 和 CSS，我们将开发新的实践。这都是了解\
  \ HTML 和 CSS 的魅力所在。\n\n你现在已经有了一些关于如何使用 HTML 和 CSS 构建网站的强大知识，我很期待看到你的作品。随时向我反馈进展，祝构建愉快！\n\
