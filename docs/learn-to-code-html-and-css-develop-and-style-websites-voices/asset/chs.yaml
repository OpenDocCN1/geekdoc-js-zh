  >$30.17</td>\n    </tr>\n  </tbody>\n  <tfoot>\n    <tr>\n      <td colspan=\"3\"\
  >Subtotal</td>\n      <td>$135.36</td>\n    </tr>\n    <tr>\n      <td colspan=\"\
