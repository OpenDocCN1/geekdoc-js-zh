  \ #555;\n  font: 13px/20px \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n}\n\
  a {\n  color: #648880;\n}\na:hover {\n  color: #293f50;\n}\nh2 {\n  font-size: 22px;\n\
  \  font-weight: bold;\n  letter-spacing: -.02em;\n  margin-bottom: 6px;\n}\nh2 a\
  \ {\n  text-decoration: none;\n  text-shadow: 2px 2px 1px rgba(0, 0, .2);\n}\n.byline\
  \ {\n  color: #8c8cc;\n  font-family: Georgia, \"Times New\", serif;\n  font-style:\
  \ italic;\n}\n.intro {\n  text-indent: 15px;\n}\n.intro a {\n  font-size: 11px;\n\
  \  font-weight: bold;\n  text-decoration: underline;\n}\n```\n\n## 文本变换\n\n（注：由于提供的原文从此处开始是大量重复的示例说明，以下仅翻译后续出现的实际章节标题）\n\
  \n### 实践\n\n（此处为原文中重复部分的起始翻译，已按指令去重复处理）\n\n\n\n\n## 5. 我们还希望 `<header>` 和 `<footer>`\
  \ 元素中的导航菜单能够右对齐齐。由于 `<header>` 和 `<footer>` 元素都包含向左（`left`）浮动的子元素，我们可以使用与处理标语（tagline）时相同的方法。\n\
  \n`<header>` 和 `<footer>` 内部的浮动元素脱离了页面的正常流，这会导致其他元素环绕它们排列。在这种特定情况下，我们的导航菜单就是环绕浮动元素的元素。\n\
  \n由于我们将在两个导航菜单之间共享相同的样式，我们将为它们都赋予 `nav` 类。我们的 `<header>` 元素现在看起来像这样：\n\n点击此处查看代码图片\n\
  \n```html\n<header class=\"container group\">\n  <h1 class=\"logo\">...</h1>1>\n\
  \  <h3 class=\"tagline\">...</h3>3>\n  <nav class=\"nav primary-nav\">\n    ...\n\
  \  </nav>\n</header>\n```\n\n我们的 `<footer>` 元素现在看起来像这样：\n\n点击此处查看代码图片\n\n```html\n\
  <footer class=\"primary-footer container group\">\n  <small>...</small>\n  <nav\
  \ class=\"nav\">\n    ...\n  </nav>\n</footer>\n```\n\n不要忘记，对 `<header>` 和 `<footer>`\
  \ 元素的更改需要在每个页面上进行。\n\n## 6. 在两个导航菜单上都设置好 `nav` 类后，我们在 `main.css` 文件中创建一个新章节，以添加共享的导航样式。我们首先在\
  \ `nav` 类规则集中添加值为 `right` 的 `text-align` 属性。我们稍后会扩展这些样式，但这将将奠定一个很好的基础。\n\n点击此处查看代码图片\n\
  \n```css\n/*\n  ========================================\n  Navigation\n  ========================================\n\
  */\n\n.nav {\n  text-align: right;\n}\n```\n\n## 7. 在我们向几个不同的元素添加 `text-align` 属性的同时，让我们也为\
  \ `hero` 类选择器规则集添加值为 `center` 的 `text-align` 属性。作为参考，这些样式（包括我们现有的 `line-height`\
  \ 和 `padding` 属性）位于 `main.css` 文件的首页部分。\n\n点击此处查看代码图片\n\n```css\n.hero {\n  line-height:\
  \ 44px;\n  padding: 22px 80px 66px 80px;\n  text-align: center;\n}\n```\n\n我们的样式大会（Styles\
  \ Conference）现在看起来很有范儿了。（冷笑话，抱歉。）不过说真的，我们所有的样式进展得非常顺利，我们的网站也在不断完善，如 **图 6.4** 所示。\n\
  \n![Image](img/00043.jpeg)\n\n**图 6.4** 在添加了一些文本属性后，我们的样式大会网站进展顺利。\n\n### 使用网络安全字体\n\
  \n默认情况下，每台电脑、平板电脑、智能手机或其他具备网页浏览能力的设备都预装了几个字体。因为它们已安装在每台设备上，我们可以在网站中自由使用这些字体，而无论用户使用什么设备浏览我们的网站，字体都能正常渲染。这些字体被称为“网络安全字体”（web-safe\
  \ fonts）。这类字体只有几个，最安全的网络安全字体列在这里：\n\n* Arial\n* Courier New, Courier\n* Garamond\n\
  * Georgia\n* Lucida Sans, Lucida Grande, Lucida\n* Palatino Linotype\n* Tahoma\n\
  * Times New Roman, Times\n* Trebuchet\n* Verdana\n\n### 嵌入网络字体\n\n我们还有能力将字体上传到服务器，并通过\
  \ CSS 的 `@font-face` 规则将其包含在网站中。这种能力对在线排版产生了神奇的效果。现在，比以往任何时候都，字体排版在网上变得栩栩生生。\n\n\
  嵌入网络字体看起来大致如下。首先，我们使用 `@font-face` 规则通过 `font-family` 属性识别字体，并通过 `src` 属性识别字源。请参见\
  \ **图 6.5**。\n\n点击此处查看代码图片\n\n```css\n@font-face {\n  font-family: \"Lobster\";\n\
  \  src: local(\"Lobster\"), url(\"lobster.woff\") format(\"woff\");\n}\n\nbody {\n\
  \  font-family: Lobster, cursive;\n}\n```\n\n![Image](img/00044.jpeg)\n\n**图 6.5**\
  \ 通过使用字体\n\n### 练习\n\n为了给我们的网站添加字体，让我们前往 Google Fonts ([www.google.com/fonts](https://www.google.com/fonts))\
  \ 并搜索该字体。当需要选择我们喜欢的字重（weights）时，在我们的集合中添加 `300` 和 `400`。一旦我们在所有页面中添加了 `<link>` 元素，就可以开始使用该字体了。我们将通过向\
  \ `header` 添加 `<link>` 元素来实现。\n\n添加了新的 `<link>` 元素后，我们的 `<header>` 元素看起来像这样：\n\n\
  点击此处查看代码图片\n\n```html\n<head>\n  <meta charset=\"utf-8\">\n  <title>Styles Conference</title>\n\
  \  <link rel=\"stylesheet\" href=\"assets/stylesheets/main.css\">\n  <link rel=\"\
  stylesheet\" href=\"http://fonts.googleapis.com/css?family=Lato:100,300,400\">\n\
  </head>\n```\n\n2. 一旦我们在所有页面中都添加了 `<link>` 元素，就可以开始使用 Lato 字体了。我们将通过在 `<body>` 元素样式的\
  \ `font` 属性将其添加到主字体栈中。\n\n我们将 Lato 添加到字体栈开头，使其变为 `\"Lato\"`、`\"Open Sans\"`、`\"\
  Helvetica Neue\"`、`Helvetica`、`Arial`、`sans-serif`。\n\n尽管 `Lato` 是一个单词，但因为它是嵌入字体，我们在任何\
  \ CSS 引用中都会将其用引号括起来。我们新的 `<body>` 元素样式如下：\n\n```css\nbody {\n  color: #888;\n  font:\
  \ 300 16px/22px \"Lato\", \"Open Sans\", \"Helvetica Neue\",\n  Helvetica, Arial,\
  \ sans-serif;\n}\n```\n\n3. Lato 现在应该已经运行正常了，显示在我们样式大会网站的所有文本中。让我们仔细查看我们的 Logo 并对其进行更新。\n\
  \n\n\n\n\n在我们的 `logo` 类选择器规则集中，我们将首先开始添加 `font-weight` 属性并将值设置为 `100`，使文本看起来非常细。我们还将使用值为\
  \ `uppercase` 的 `text-transform` 属性，使所有字母都大大写，同时使用值为 `.5px` 像素的 `letter-spacing`\
  \ 属性，在 logo 的每个字母之间添加少量的空间。\n\n我们 logo 的样式整体看起来如下：\n\n点击此处查看代码图片\n\n```css\n.logo\
  \ {\n  border-top: 4px solid #648880;\n  float: left;\n  font-size: 48px;\n  font-weight:\
  \ 100;\n  letter-spacing: .5px;\n  line-height: 44px;\n  padding: 40px 0 22px 0;\n\
  \  text-transform: uppercase;\n}\n```\n\n**4.** 既然我们有一个 `100` 的 `font-weight` 属性值可用，让我们也将\
  \ hero 区域内的段落元素设置为该权重。我们可以使用现有的选择器来实现，新的规则集看起来像这样：\n\n```css\n.hero p {\n  font-size:\
  \ 24px;\n  font-weight: 100;\n}\n```\n\n我们的 Styles Conference 网站在这一节中迈出了巨大的进步，我们网站的外观和感受开始真正大放异彩（参见**图\
  \ 6.6**）。\n\n![图片](img/00045.jpeg)\n\n**图 6.6** 添加 Lato Google 网络字体后的 Styles Conference\
  \ 首页\n\n本节中练习题的源代码可以在 [`learn.shayhowe.com/html-css/working-with-typography/`](http://learn.shayhowe.com/html-css/working-with-typography/)\
  \ 找到。\n\n# 包含引用与引言\n\n在线写作有时涉及引用不同的来源或引言。所有不同的引用和引言情况都可以使用 HTML 中的 `<cite>`、`<q>`\
  \ 和 `<blockquote>` 元素在语义上涵盖。由于它们在外观上通常与正文区分开来，我们将在排版课程中讨论它们。\n\n了解何时使用哪个元素和属性来正确标记引用和引言需要一些练习。通常情况下，请遵循这些规则：\n\
  \n- `<cite>`：用于引用创意作品、作者或资源\n- `<q>`：用于短距离的内联引言\n- `<blockquote>`：用于较长的外部引言\n\n\
  ## 引用创意作品\n\n`<cite>` 内联元素在 HTML 中专门用于引用创意作品；该元素必须包含作品的标题、作者姓名或指向该作品的 URL 引用。默认情况下，封装在\
  \ `<cite>` 元素中的内容在浏览器中将以斜体显示。\n\n为了额外的参考，在相关时包含指向引言原始来源的超链接是有帮助的。\n\n在这里，Walter\
  \ Isaacson 写的书籍 *Steve Jobs*（乔布斯传）在 `<cite>` 元素中被引用（参见**图 6.7**）。引用内部还有一个指向书籍的超链接。\n\
  \n点击此处查看代码图片\n\n```html\n<p>书籍 <cite><a href=\"http://www.amazon.com/Steve-Jobs-Walter-Isaacson/dp/1451648537\"\
  >Steve Jobs</a></cite> 真的非常有启发性。</p>\n```\n\n![图片](img/00046.jpeg)\n\n**图 6.7**\
  \ 使用 <cite> 元素对书籍 *Steve Jobs* 的引用\n\n## 对话与散文引用\n\n对话或散文经常以内联形式引用在其他文中。为了这个目的，应该应用\
  \ `<q>`（引用）内联元素。`<q>` 元素在语义上表示被引用的对话或散文，不应用于任何其他用途。\n\n默认情况下，浏览器将为我们插入正确的引号，甚至会根据\
  \ `lang` 全局属性中识别的语言更改引号。\n\n这是一个示例：\n\n点击此处查看代码图片\n\n```html\n<p>Steve Jobs 曾说：<q>一次全垒打比两次二垒打好得多。</q></p>\n\
  ```\n\n## 对话与散文引用\n\n`<q>` 元素上的一个可选属性是 `cite` 属性。`cite` 属性充当以 URL 形式呈现的引言引用。此属性不会更改元素的外观；它只是为屏幕阅读器和其他设备增加了值。由于该属性在浏览器中不可见，因此提供指向此来源的超链接也是有帮助的。\n\
  \n这是一个示例，在 **图 6.8** 中也可以：\n\n点击此处查看代码图片\n\n```html\n<p><a href=\"http://www.businessweek.com/magazine/content/06_06/b397001.htm\"\
  >Steve Jobs</a> 曾说：<q cite=\"http://www.businessweek.com/magazine/content/06_06/b397001.htm\"\
  >一次全垒打比两次二垒打好得多。</q></p>\n```\n\n![图片](img/00047.jpeg)\n\n**图 6.8** 来自 *Businessweek*\
  \ 的对话引用\n\n## 外部引言\n\n为了引用来自外部来源并跨多行的较长文本，我们将使用 `<blockquote>` 元素。\n\n这是一个使用 `<blockquote>`\
  \ 元素的示例：\n\n点击此处查看代码图片\n\n```html\n<blockquote>\n  <p>在大多数人的词汇中，设计是细微的。它是内部装饰。它是家具的织物。但对我来说，这离设计的意义要远得多。设计是人类创作的灵魂，最终通过层层外表表现出来。</p>\n\
  </blockquote>\n```\n\n## 外部引用\n\n在 `<blockquote>` 元素中的较长引言通常包含引用。该引用可能包含 `cite`\
  \ 属性和 `<cite>` 元素。`cite` 属性可以位于 `<blockquote>` 元素上——就像在 `<q>` 元素上使用的那样——以 URL 形式提供引言的引用。`<cite>`\
  \ 元素可以位于引言之后，提供用户可见的额外引用（参见**图 6.9](#part0012.html_ch06fig09)**）。\n\n点击此处查看代码图片\n\
  \n```html\n<blockquote cite=\"http://money.cnn.com/magazines/fortune/fortune_archive/2000/01/24/272277/index.html\"\
  >\n  <p>\"在大多数人的词汇中，设计是细微的。它是内部装饰。它是家具的织物。但对我来说，这离设计的意义要远得多。设计是人类创作的灵魂，最终通过层层外表表现出来。</p>\n\
  \  <p><cite>— Steve Jobs 出自 <a href=\"http://money.cnn.com/magazines/fortune/fortune_archive/2000/01/24/272277/index.html\"\
  >Fortune Magazine</a></cite></p>\n</blockquote>\n```\n\n![图片](img/00048.jpeg)\n\n\
  **图 6.9** 出自 *Fortune Magazine* 的 Steve Jobs 扩展引用\n\n学习样式化文本是令人兴奋的，因为我们的内容开始传递某些情感。我们还可以开始尝试调整内容的层次结构，使我们的网站更易读、更易理解。\n\
  \n快速回顾一下，在本节中我们讨论了以下内容：\n\n- 为文本添加颜色以增强它\n- 应用 `font` 相关属性，包括 `font-family`、`font-size`、`font-style`、`font-weight`\
  \ 等\n\n\n\n\n\n- 应用基于 `text` 的属性，包括 `text-align`、`text-decoration`、`text-indent`、`text-shadow`\
  \ 等\n- 网络安全字体背后的历史以及如何嵌入我们自己的网络字体\n- 如何正确标记引用和引言\n\n通过对文本的精炼和对字体的些许尝试，我们的设计已经有了很大提高。接下来，我们将通过介绍背景和渐变来为网站增添更多色彩。\n\
  \n## 第 7 节：设置背景与渐变\n\n背景对网站的设计有显著影响。它们有助于创建网站的视觉效果和感觉，建立分组并分配优先级，并且对网站的可用性产生相当大的影响。\n\
  \n在 `CSS` 中，元素的背景可以是纯色、图像、渐变，或这些者的组合。在我们决定如何实现这些背景时，应该记住，每一个背景都对网站的整体外观做出了贡献。\n\n\
  在本节中，我们将查看如何为元素分配不同类型的背景（包括渐变）；我们还将尝试一些针对背景的 `CSS3` 属性。\n\n### 添加背景颜色\n\n为元素添加背景最快的方法是使用\
  \ `background` 或 `background-color` 属性添加单色背景。`background` 属性接受简写形式的颜色和图像，而 `background-color`\
  \ 属性专门用于设置纯色背景。这两个属性都可以使用，具体使用哪一个取决于你的偏好以及你使用的场景。\n\n点击此处查看代码图像\n\n```\ndiv {\n\
  \  background-color: #b2b2b2;\n}\n```\n\n在添加背景颜色时，我们对可以使用的值有很多选项。与其他颜色值一样，我们可以从关键字、十六进制代码以及\
  \ RGB、`RGBa`、`HSL` 和 `HSLa` 值中选择。最常见的是十六进制值；但是，我们有时可能使用 `RGBa` 或 `HSLa` 值来实现透明效果。\n\
  \n#### 透明背景\n\n当使用 `RGBa` 或 `HSLa` 值作为透明背景颜色时，提供一个回退颜色是一个好主意，因为并不是所有的浏览器都识别 `RGBa`\
  \ 或 `HSLa` 值。当浏览器遇到它不识别的值时，它会忽略它。\n\n幸运的是，有一种简单的方法提供回退背景。`CSS` 样式是从文件的顶部级联到底部；因此，我们可以在同一个规则集中使用两个\
  \ `background-color` 属性。第一个 `background-color` 属性将使用“安全的”背景颜色（例如十六进制值），而第二个 `background-color`\
  \ 属性将使用 `RGBa` 或 `HSLa` 值。在这里，如果浏览器理解 `RGBa` 或 `HSLa` 值，它就会渲染它；如果不理解，它将回退到上面的十六进制值。\n\
  \n点击此处查看代码图像\n\n```\ndiv {\n  background-color: #b2b2b2;\n  background-color: rgba(0,\
  \ 0, 0, .3);\n}\n```\n\n### 添加背景图像\n\n除了为元素添加背景颜色外，我们还可以添加背景图像。背景图像的工作与背景颜色类似；然而，它们提供了几个额外的属性来精修图像。和之前一样，我们可以使用简写值的\
  \ `background` 属性，也可以直接使用 `background-image` 属性。无论我们使用哪种属性，都必须使用 `url()` 函数标识图像源。\n\
  \n`url()` 函数的值将是背景图像的路径，创建超链接路径的熟悉规则也适用于此处。注意不同的目录，并确保准确显示图像的位置。路径将放在括号内并加引号。\n\n\
  点击此处查看代码图像\n\n```\ndiv {\n  background-image: url(\"alert.png\");\n}\n```\n\n仅使用\
  \ `url` 值添加背景图像可能会导致不人意的结果，因为默认情况下，背景图像将从给定元素的左上角水平和垂直重复，以填充元素的背景。坦率地说，我们可以使用 `background-repeat`\
  \ 和 `background-position` 属性来控制图像如何重复甚至是否重复。\n\n#### 背景重复\n\n除非另有指定，否则背景图像默认将在垂直和水平方向上无限重复。`background-repeat`\
  \ 属性可以更改背景图像重复的方向（如果重复的话）。\n\n点击此处查看代码图像\n\n```\ndiv {\n  background-image: url(\"\
  alert.png\");\n  background-repeat: no-repeat;\n}\n```\n\n`background-repeat` 属性接受四个不同的值：`repeat`、`repeat-x`、`repeat-y`\
  \ 和 `no-repeat`。`repeat` 值是默认值，将在垂直和水平方向重复背景图像。`repeat-x` 值将水平重复，而 `repeat-y` 值将垂直重复。最后，`no-repeat`\
  \ 将告诉浏览器显示一次背景图像。\n\n#### 背景位置\n\n默认情况下，背景图像位于元素的左上角。然而，通过使用 `background-position`\
  \ 属性，我们可以控制图像放置的位置。\n\n点击此处查看代码图像\n\n```\ndiv {\n  background-image: url(\"alert.png\"\
  );\n  background-position: 20px 10px;\n  background-repeat: no-repeat;\n}\n```\n\
  \n`background-position` 属性需要两个值：水平偏移（第一个值）和垂直偏移（第二个值）。如果只指定值，该值将同时用于水平和垂直偏移。\n\n\
  设置 `background-position` 值，我们可以使用 `top`、`right`、`bottom` 和 `left` 关键字、像素、百分比或任何长度单位。关键字和百分比的工作原理非常相似（参见图\
  \ 7.1）。关键字值 `left top` 等于百分比值 `0 0`。关键字值 `right bottom` 等于百分比值 `100% 100%`，会将图像放置在元素的右下角。\n\
  \n![Image](img/00049.jpeg)\n**图 7.1** 背景图像相对于元素的左上角\n\n百分比相对于关键字的优点可以使用 `50%` 值来实现背景图像居中。要将背景图像在顶部居中，可以使用\
  \ `50% 0`。使用像素作为 `background-position` 值也很常见，因为像素让我们精确控制背景的位置。\n\n#### 背景图像简写值\n\
  \n`background-color`、`background-image`、`background-position` 和 `background-repeat`\
  \ 属性可以合并为 `background` 属性的简写值。这些属性作为简写 `background` 属性值的顺序可能会不同，但通常顺序为 `background-color`、`background-image`、`background-position`，然后是\
  \ `background-repeat`。\n\n点击此处查看代码图像\n\n```\ndiv {\n  background: #b2b2b2 url(\"\
  alert.png\") 20px 10px no-repeat;\n}\n```\n\n#### 背景图像示例\n\n在下面的示例中，我们将使用包含 `background-color`、`background-image`、`background-position`\
  \ 和 `background-repeat` 值的简写值 `background` 属性。\n\n\n\n\n请注意，`background-position`\
  \ 值中同时包含相对值和绝对值。第一个值 `20` 像素是水平值，将 `background-image` 位于距离元素左侧 `20` 像素处。第二个值 `50%`\
  \ 是垂直值，使 `background-image` 在垂直方向上居中。\n\n`alert-success` 类规则集内还包含了其他属性和值，用于进一步美化提示消息的样式（参见**图\
  \ 7.2**）。\n\n![Image](img/00050.jpeg)\n\n**图 7.2** 包含背景颜色和图片的成功提示消息\n\n### HTML\n\
  点击此处查看代码图片\n\n```html\n<div class=\"alert-success\">\n  哇！恭喜你，你做到了！\n</div>\n```\n\
  \n### CSS\n点击此处查看代码图片\n\n```css\n.alert-success {\n  background: #67b11c url(\"\
  tick.png\") 20px 50% no-repeat;\n  border: 2px solid #467813;\n  border-radius:\
  \ 5px;\n  color: #fff;\n  font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n\
  \  padding: 15px 20px 15px 50px;\n}\n```\n\n### 实践操作\n\n回到我们的 Styles 大网站，让我们添加一些背景颜色。在操作的同时，我们将更改一些其他样式，以保持所有样式协同工作，并确保所有内容清晰易读。\n\
  \n**1.** 我们首先迈出大一步，为 `<body>` 元素应用蓝色背景，同时保留现有的 `color` 和 `font` 属性。现在 `<body>` 元素规则集中所有样式都包含以下内容：\n\
  \n点击此处查看代码图片\n\n```css\nbody {\n  background: #293f50;\n  color: #888;\n  font:\
  \ 300 16px/22px \"Lato\", \"Open Sans\", \"Helvetica Neue\",\nHelvetica, Arial,\
  \ sans-serif;\n}\n```\n\n我们特意为 `<body>` 元素设置了蓝色 `background`，因为我们的网站将会有几行不同的 `background`\
  \ 颜色，而最频繁使用的 `background` 颜色将是蓝色。\n\n**2.** 现在我们网站上的每个页面都包含了蓝色 `background`，让我们清理一些保留该蓝色背景的区域。具体来说，我们的\
  \ `<header>` 和 `<footer>` 元素将保持蓝色，首页的英雄区块（hero section）也是如此。\n\n在 `<header>` 和 `<footer>`\
  \ 元素中，让我们所有的链接颜色初始设为白色，然后在悬停时转变为与标题相同的绿色。\n\n我们将从 `<header>` 元素开始。为了选择 `<header>`\
  \ 元素内的所有 `<a>` 元素，我们将为 `<header>` 元素添加一个 `primary-header` 类（除了现有的 `container` 和\
  \ `group` 类）。不要忘记，我们需要在所有页面的 `<header>` 元素中添加此类。\n\n点击此处查看代码图片\n\n```html\n<header\
  \ class=\"primary-header container group\">\n  ...\n</header>\n```\n\n在 `<header>`\
  \ 元素上应用 `primary-header` 类，并在 `<footer>` 元素上应用现有的 `primary-footer` 类，我们可以在 `main.css`\
  \ 文件链接部分的底部添加两个新的规则集。\n\n第一个规则集将选择类属性值为 `primary-header` 或 `primary-footer` 的元素中的所有\
  \ `<a>` 元素，并将它们的颜色设置为白色，这是通过逗号分隔两个共享相同属性和值的独立选择器定义的。第二个规则集将选择与之前相同的 `<a>` 元素，但当用户悬停在其上方时，将它们的颜色改为绿色。\n\
  \n点击此处查看代码图片\n\n```css\n.primary-header a,\n.primary-footer a {\n  color: #fff;\n\
  }\n.primary-header a:hover,\n.primary-footer a:hover {\n  color: #64880;\n}\n```\n\
  \n**3.** 在我们将某些文本设为白色的同时，让我们将首页英雄区块内的文本也设为白色，因为它将显示在蓝色 `background` 上。我们有现有的 `hero`\
  \ 类规则集可以添加样式，让我们添加白色的文本 `color`。总之，我们的 `hero` 类规则集应该包含以下内容：\n\n点击此处查看代码图片\n\n```css\n\
  .hero {\n  color: #fff;\n  line-height: 44px;\n  padding: 22px 80px 66px 80px;\n\
  \  text-align: center;\n}\n```\n\n**4.** 同样在首页的英雄区块中，让我们清理一些按钮样式。我们首先在 `main.css`\
  \ 的按钮部分向 `btn` 类规则集添加一些属性。具体来说，将按钮 `color` 设置为白色，确保我们的 `cursor` 始终为 `pointer`，增加\
  \ `font-weight`，添加少量的 `letter-spacing`，并将 `text-transform` 改为 `uppercase`。总之，我们新的\
  \ `btn` 类规则集看起来应该是这样的：\n\n点击此处查看代码图片\n\n```css\n.btn {\n  border-radius: 5px;\n\
  \  color: #fff;\n  cursor: pointer;\n  display: inline-block;\n  font-weight: 400;\n\
  \  letter-spacing: .5px;\n  margin: 0;\n  text-transform: uppercase;\n}\n```\n\n\
  我们还通过 `btn-alt` 类集清理了一些备用按钮样式。具体来说，让按钮的边框变为白色，并添加悬停样式，包括白色 `background` 和蓝色文本 `color`。经过所有添加后，我们新的\
  \ `btn-alt` 类规则集应该是这样的：\n\n点击此处查看代码图片\n\n```css\n.btn-alt {\n  border: 1px solid\
  \ #fff;\n  padding: 10px 30px;\n}\n.btn-alt:hover {\n  background: #fff;\n  color:\
  \ #64880;\n}\n```\n\n**5.** 既然我们已经清理了所有蓝色背景区域，让我们为带有白色背景的行添加样式。在 `main.css` 文件中为行创建一个新的\
  \ section，紧跟在 clearfix section 之后。在这个新的行 section 中，我们创建一个名为 `row` 的新类选择器。\n\n在我们新的\
  \ `row` 类规则集中，让我们添加白色 `background`、`960` 像素的宽度（以确保 `row` 元素大于 `container` 或 `grid`\
  \ 元素的宽度）以及一些垂直 `padding`。我们在 `main.css` 文件中的新行 部分应该是这样的：\n\n点击此处查看代码图片\n\n```css\n\
  /*\n  ========================\n  Rows\n  ========================\n*/\n.row {\n\
  \  background: #fff;\n  min-width: 960px;\n  padding: 66px 0 44px 0;\n}\n```\n\n\
  **6.** 有了 `row` 类样式，让我们为首页添加一个带有白色背景的行。我们将在区块区块进行此操作。目前该区域有一个类为 `grid` 的 `<section>`\
  \ 元素，包裹着三个类为 `teaser` 和 `col-1-3` 的 `<section>` 元素。\n\n为了给此区块添加白色背景，我们将把所有这些元素包裹在一个类为\
  \ `row` 的元素中。\n\n由于我们希望整个区块被封装在 `<section>` 元素中，我们将添加一个新的类为 `row` 的 `<section>`\
  \ 元素来包裹现有的类为 `grid` 的 `<section>` 元素。\n\n两个 `<section>` 元素包裹相同的内容会降低语义价值。为了修正这一点，我们将类为\
  \ `grid` 的第二个 `<section>` 元素更改为 `<div>` 元素。毕竟此时该元素仅用于添加样式，而不是语义含义，作为 `<div>` 元素是合适的。\n\
  \n我们新的区块元素结构应该是这样的：\n\n点击此处查看代码图片\n\n```html\n<section class=\"row\">\n  <div class=\"\
  grid\">\n    <!-- 演讲者 -->\n    <section class=\"teaser col-1-3\">\n      ...\n \
  \   </section><!--\n    日程--><section class=\"teaser col-1-3\">\n      ...\n   \
  \ </section>\n  </div>\n</section>\n```\n\n\n\n\n几个背景颜色就能影响网站的设计，这真是令人惊叹。我们的 Styles\
  \ Conference 网站进展得非常顺利，图 7.3 所示首页证明了这一点。\n\n![Image](img/00051.jpeg)\n\n**图 7.3**\
  \ 添加了一些背景颜色后的 Styles Conference 网站首页\n\n### 设计渐变背景\n\n渐变背景随着 CSS3 的引入而让地的设计师和前端开发者都欢呼鼓舞。虽然渐变背景在旧版浏览器中无法工作，但所有现代浏览器都支持它。\n\
  \n在 CSS 中，渐变背景被视为背景图像。我们可以使用 `background` 或 `background-image` 属性创建渐变，就像普通的背景图像一样。渐变背景的属性值取决于我们想要什么类型的渐变，线性或径向。\n\
  \n#### 渐变背景厂商前缀\n\n在第 4 节——“开启盒模型”中，我们讨论了为新的 CSS 属性或值添加厂商前缀，以便浏览器能够支持最近开发的 CSS 特性。渐变背景值是需要使用厂商前缀的值之一。幸运的是，大多数浏览器已经消除了渲染渐变背景对厂商前缀的需求；然而，为了确保最佳支持，列出厂商前缀仍然值得的。\n\
  \n最初，当我们开始讨论线性渐变背景时，我们会包含每个不同的厂商前缀。之后，为了简洁起见，在我们继续讨论渐变背景（包括径向渐变背景）时，我们将省略不同的前缀。\n\
  \n#### 线性渐变背景\n\n多年，设计师和开发者一直在切割使用图像处理软件创建渐变图像文件，并将其作为元素的线性渐变背景。这种方法有效，但实现需要很长时间，而且非常不灵活。幸运的是，那些日子已经过去了，现在可以在\
  \ CSS 中指定线性渐变背景。如果需要更改颜色，就不需要重新制作和裁剪图像并将其上传到服务器。现在，我们只需要更改 CSS 中的一个快速值（参见图 7.4）。太好了。\n\
  \n点击此处查看代码图像\n\n```css\ndiv {\n  background: #466368;\n  background: -webkit-linear-gradient(#648880,\
  \ #293f50);\n  background: -moz-linear-gradient(#648880, #293f50);\n  background:\
  \ linear-gradient(#648880, #293f50);\n}\n```\n\n![Image](img/00052.jpeg)\n\n**图\
  \ 7.4** 从元素顶部到底过渡的线性渐变背景\n\n线性渐变通过在 `background` 或 `background-image` 属性中使用 `linear-gradient()`\
  \ 函数来标识。`linear-gradient()` 函数必须包含两个颜色值，其中第一个将是起始颜色值，第二个将是结束颜色值。浏览器将处理这两种颜色之间的过渡。\n\
  \n在定义任何渐变背景之前，我们还会设置一个带有纯颜色的默认 `background` 属性。如果浏览器不支持渐变背景，该纯色将作为备用方案。\n\n####\
  \ 更改渐变背景的方向\n\n默认情况下，线性渐变背景从元素的顶部到底部，在第一个颜色值和第二个颜色值之间平滑过渡。然而，这种方向可以使用在任何颜色值之前指定的关键字或角度值进行更改。\n\
  \n例如，如果我们希望渐变从元素的左侧移动到右侧，可以使用关键字值 `to right` 来标识线性渐变应该进展的方向。关键字值也可以组合使用。如果我们希望渐变从元素的左上角移动到右下角，可以使用关键字值\
  \ `to right bottom`（参见图 7.5）。\n\n点击此处查看代码图像\n\n```css\ndiv {\n  background: #466368;\n\
  \  background: linear-gradient(to right bottom, #648880, #293f50);\n}\n```\n\n![Image](img/00053.jpeg)\n\
  \n**图 7.5** 从元素左上角到右下角过渡的线性渐变背景\n\n当我们在不完全正方形的元素上使用对角渐变时，背景渐变将不会直接从一个角移动到另一个角。相反，渐变将识别元素的绝对中心，在它应该进展的垂直角处放置锚点，然后移动到值中指定的角的大致方向。渐变移动的这些角被称为“魔术角”，因为它们不是绝对的。Eric\
  \ Meyer 在他的文章“线性渐变关键字”中对这种语法的概述做得非常出色，文章地址为：[`meyerweb.com/eric/thoughts/2012/04/26/lineargradient-keywords/`](http://meyerweb.com/eric/thoughts/2012/04/26/lineargradient-keywords/)。\n\
  \n除了关键字，角度值也是接受的。如果我们希望渐变移动到元素的左上角，可以使用 `315deg` 的角度值，或者如果我们希望渐变移动到元素的右下角，可以使用 `135deg`\
  \ 的角度值。同样的概念适用于 `0` 到 `360` 的任何角度。\n\n#### 径向渐变背景\n\n虽然线性渐变适用于从一个方向到另一个方向的渐变，但经常也会产生径向渐变的需求（参见图\
  \ 7.6）。径向背景工作与线性渐变类似，并共享许多相同的值。对于径向渐变，我们不在 `background` 或 `background-image` 属性中使用\
  \ `linear-gradient()` 函数，而是使用 `radial-gradient()` 函数。\n\n点击此处查看代码图像\n\n```css\n\
  div {\n  background: #466368;\n  background: radial-gradient(#648880, #293f50);\n\
  }\n```\n\n![Image](img/00054.jpeg)\n\n**图 7.6** 从元素中心到外部过渡的径向渐变背景\n\n径向渐变从元素的内部到外部工作。因此，`radial-gradient()`\
  \ 函数中的第一个颜色位于元素的绝对中心，第二个颜色位于元素的外部。浏览器将处理这两种颜色之间的过渡。\n\n径向渐变和线性渐变之间的主要区别之一是径向渐变非常复杂，具有位置、大小、半径等值。我们将涵盖基础，但请进一步研究径向渐变，因为它们提供的功能比这里概述的要得多。\n\
  \n#### CSS3 渐变背景生成器\n\n手动处理 CSS3 渐变有时非常困难，特别是如果你是初学者。幸运的是，出现了一些 CSS3 渐变生成器。每个生成器的工作方式略有不同，有些提供的选项更多。如果你感兴趣，我建议进行一些研究以找到适合你的生成器。\n\
  \n#### 渐变颜色停止\n\n\n\n\n\n至少，渐变背景是从一种颜色过渡到另一种颜色；然而，我们可以向渐变添加多种颜色，并让浏览器在所有颜色之间进行过渡（参见图\
  \ 7.7]）。要实现这一点，我们将向指定的渐变函数添加颜色停止点，用逗号分隔每个颜色停止点与下一个。\n\n点击此处查看代码图像\n\n```css\ndiv\
  \ {\n  background: #648880;\n  background: linear-gradient(to right, #f6f1d3, #648880,\
  \ #293f50);\n}\n```\n\n![Image](img/00055.jpeg)\n\n**图 7.7** 线性渐变背景，包括从元素左侧到右侧过渡的三颜色\n\
  \n默认情况下，浏览器将每个颜色停止点放置在距离下一个点等距离的位置，并据此在它们之间过渡。如果希望对颜色的定位进行更多控制，可以为每个颜色停止点指定渐变沿线的一个位置。该位置应声明为长度值，并应位于颜色值之后（参见图\
  \ 7.8]）。\n\n点击此处查看代码图像\n\n```css\ndiv {\n  background: #648880;\n  background: linear-gradient(to\
  \ right, #f6f1d3, #648880 85%,\n  #293f50);\n}\n```\n\n![Image](img/00056.jpeg)\n\
  \n**图 7.8** 线性渐变背景，包括三种颜色及其唯一位置，从元素左侧到右侧过渡\n\n除非另有指定，第一个颜色停止点将放置在 `0%`，最后一个颜色停止点将放置在\
  \ `100%`。\n\n#### 渐变背景示例\n\n使用之前相同的成功提示消息，我们将旧的背景图像替换为线性渐变背景图像。\n\n为此，我们将包含两个 `background`\
  \ 属性。第一个 `background` 属性指定了一个纯色十六进制值，作为浏览器不支持线性渐变背景时的备用方案。第二个 `background` 属性包含\
  \ `linear-gradient()` 函数，它标识了一个绿色渐变背景，该背景从元素的顶部过渡到元素的底部（参见图 7.9]）。\n\n![Image](img/00057.jpeg)\n\
  \n**图 7.9** 包含线性渐变背景图像的成功提示消息\n\n### HTML\n\n点击此处查看代码图像\n\n```html\n<div class=\"\
  alert-success\">\n  Woo hoo! Congratulations, you did it!\n</div\n```\n\n### CSS\n\
  \n点击此处查看代码图像\n\n```css\n.alert-success {\n  background: #67b11c;\n  background:\
  \ linear-gradient(#72c41f, #5c9e19);\n  border: 2px solid #467813;\n  border-radius:\
  \ 5px;\n  color: #fff;\n  font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n\
  \  padding: 15px 20px;\n}\n```\n\n## 实践中\n\n现在有了渐变背景，让我们为我们的 Styles Conference 网站创建一个新行，这次我们将使用渐变。\n\
  \n**1.** 我们将使用 `row-alt` 类来创建一个带有渐变 `background` 的新行。因为新行将与 `row` 类选择器共享相同的 `min-width`\
  \ 属性和值，我们将合并这两个选择器。\n\n```css\n.row,\n.row-alt {\n  min-width: 960px;\n}\n```\n\n\
  接下来，我们想要创建新的规则集，以将样式专门应用于 `row-alt` 类选择器。这些新样式将包含一个渐变 `background`，它从绿色开始，并从左到右过渡到黄色。\n\
  \n使用带有适当值和厂商前缀的 `linear-gradient()` 函数，我们为 `row-alt` 类规则集添加渐变 `background`。我们还会在渐变\
  \ `background` 之前包含一个单一的 `background` 颜色作为备用，以防浏览器不支持渐变背景。最后，我们还会添加一些 `padding`。我们更新后的行现在看起来这样：\n\
  \n点击此处查看代码图像\n\n```css\n.row,\n.row-alt {\n  min-width: 960px;\n}\n.row {\n  background:\
  \ #fff;\n  padding: 66px 0 44px;\n}\n.row-alt {\n  background: #cbe21;\n  background:\
  \ -webkit-linear-gradient(to right, #a1d3b0, #f6f1d3);\n  background: -moz-linear-gradient(to\
  \ right, #a1d3b0, #f6f1d3);\n  background: linear-gradient(to right, #a1d3b0, #f6f1d3);\n\
  \  padding: 66px 0 44px;\n}\n```\n*(注：原文 .row-alt 代码块中结束处似乎有闭合括号错误，此处按逻辑补全或保持原样)*\n\
  \n**2.** 在 `row-alt` 样式就绪后，我们将它们用于所有内部页面。目前，所有内部页面都有一个带有 `container` 类的 `<section>`\
  \ 元素。然后，每个 `<section>` 元素内部都有包含标题的 `<h1>` 元素。\n\n我们将像之前处理主页一样，将这些带有 `container`\
  \ 类的 `<section>` 元素包裹在带有 `row-alt` 类的 `<section>` 元素中。我们将更改 ` ` ` ` ` ` ` ` ` `\
  \ ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` 元素为 `<div>`\
  \ 元素以获得更好的语义对齐。\n\n所有内部页面现在应包含以下内容：\n\n点击此处查看代码图像\n\n```html\n<section class=\"\
  row-alt\">\n  <div class=\"container\">\n    <h1></h1>\n  </div>\n</section>\n```\n\
  \n**3.** 由于我们正在更新内部页面，让我们它们的介绍（即导言）更具吸引力。我们将首先在每个带有 `row-alt` 类的 `<section>` 元素中的\
  \ `<h1>` 元素下方添加一个段落。我们的 `speakers.html` 页面现在包含以下导言部分：\n\n点击此处查看代码图像\n\n```html\n\
  <section class=\"row-alt\">\n  <div class=\"container\">\n    <h1>Speakers</h1>\n\
  \    <p>我们欢迎二十多演讲者介绍行业最新技术。准备迎接灵感的盛宴。</p>\n  </div>\n</section>\n```\n\n**4.** 除了插入段落，我们还要更改导言部分中的某些样式。为此，我们将已具有\
  \ `container` 类的 `<div>` 元素添加 `lead` 类；该元素直接嵌套在带有 `row-alt` 类的 `<section>` 元素内部。我们内部页面的导言部分现在看起来如下：\n\
  \n点击此处查看代码图像\n\n```html\n<section class=\"row-alt\">\n  <div class=\"lead container\"\
  >\n    ...\n  </div>\n</section>\n```\n\n**5.** 一旦 `lead` 类就绪，我们将这些 `<div>` 元素中的所有文本居中。我们还会增加这些\
  \ `<div>` 元素内任何段落的 `font-size` 和 `line-height`。\n\n我们将在 `main.css` 文件中、排版部分下方为导言创建一个新章节，并添加以下内容：\n\
  \n点击此处查看代码图像\n\n```css\n/*\n========================================\nLeads\n========================================\n\
  */\n.lead {\n  text-align: center;\n}\n.lead p {\n  font-size: 21px;\n  line-height:\
  \ 33px;\n}\n```\n\n\n\n\n在很长一段时间内，元素只允许有一个背景图像，这在设计页面时造成了相当多的限制。幸运的是，通过 CSS3，我们可以通过在\
  \ `background` 或 `background-image` 属性中用逗号分隔多个背景值，在元素上使用多个背景图像。\n\n第一个出现的背景图像值将是最前景的背景图像，最后列出的背景图像将是最后的背景图像。第一个和最后一个之间的任何值将相应地位于中间层。以下是一个\
  \ `<div>` 元素使用三个背景图像的 CSS 示例：\n\n点击此处查看代码\n\n```css\ndiv {\n  background:\n    url(\"\
  foreground.png\") 0 0 no-repeat,\n    url(\"middle-ground.png\") 0 0 no-repeat,\n\
  \    url(\"background.png\") 0 0 no-repeat;\n}\n```\n\n上述代码使用了 `background` 属性的简写值，将多个背景图像值链在一起。这些简写值也可以被拆分为逗号分隔的值，分布在\
  \ `background-image`、`background-position` 和 `background-repeat` 属性中。\n\n#### 多背景图像示例\n\
  \n让我们再次回到成功警报消息，将勾选背景图像和线性渐变背景图像结合起来。\n\n为了这一点，我们将在第二个背景属性中包含两个值。第一个值（最前景的图像）将是勾选图像（参见图\
  \ 7.11）。第二个值（最后的图像）将是线性渐变。这两个值之间用逗号分隔。\n\n![图像](img/00059.jpeg)\n\n**图 7.11** 带有多个背景图像（包括勾选图像和线性渐变）的成功警报消息\n\
  \n### HTML\n\n点击此处查看代码\n\n```html\n<div class=\"alert-success\">\n  Woo hoo! 恭喜，你做到了！\n\
  </div>\n```\n\n### CSS\n\n点击此处查看代码\n\n```css\n.alert-success {\n  background: #67b11c;\n\
  \  background: url(\"tick.png\") 20px 50% no-repeat, linear-gradient(#72c41f, #5c9e19);\n\
  \  border: 2px solid #467813;\n  border-radius: 5px;\n  color: #fff;\n  font-family:\
  \ \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  padding: 15px 20px 15px 50px;\n\
  }\n```\n\n#### 探索新的背景属性\n\n除了渐变背景和多背景图像，CSS3 还引入了三个新的 CSS 属性：`background-size`、`background-clip`\
  \ 和 `background-origin`。`background-size` 属性允许我们更改背景图像的大小，而 `background-clip` 和\
  \ `background-origin` 属性允许我们控制背景图像的裁剪位置以及在元素内部的位置（例如在边框内部或内边距内部）。\n\n#### CSS3 背景尺寸\n\
  \n`background-size` 属性允许我们为背景图像指定大小。该属性接受几个不同的值，包括长度值和关键字值。\n\n当使用长度值时，我们可以通过两个空格分隔的值来指定宽度和高度值。第一个值将设置背景图像的宽度，而第二个值将设置背景图像的高度。需要注意的是，百分比值是相对于元素的大小，而不是背景图像的原始大小。\n\
  \n因此，设置宽度为 `100%` 的 `background-size` 属性将使背景图像占据元素的整个宽度。如果在宽度之后没有识别出第二个值，则高度将自动设置，以保持背景图像的宽高比例。\n\
  \n关键字值 `auto` 既可以用作宽度或高度值，以保持背景图像的宽高比例。例如，如果我们想将背景图像的高度设置为元素高度的 `75%`，同时保持图像的宽高比例，可以使用\
  \ `background-size` 属性值 `auto 75%`（参见图 7.12）。\n\n点击此处查看代码\n\n```css\ndiv {\n  background:\
  \ url(\"shay.jpg\") 0 0 no-repeat;\n  background-size: auto 75%;\n  border: 1px\
  \ dashed #94959;\n  height: 200px;\n  width: 200px;\n}\n```\n![图像](img/00060.jpeg)\n\
  **图 7.12** 元素高度 75% 的背景图像\n\n#### Cover & Contain 值\n\n除了长度 `background-size` 值外，还有\
  \ `cover` 和 `contain` 关键字值。`cover` 值指定背景图像将完全覆盖元素。`contain` 值指定背景图像将完全包含在元素内，并保持其宽高比例。\n\
  \n`cover` 和 `contain` 关键字值可能导致图像失真，特别是当图像拉伸时。在使用这些值时我们需要注意。\n\n#### CSS3 背景裁剪与起始\n\
  \n`background-clip` 属性指定背景图像覆盖的区域，而 `background-origin` 属性指定 `background-position`\
  \ 的起始位置。这两个属性的引入对应三个关键字值：`border-box`（参见图 7.13）、`padding-box`（参见图 7.14）以及 `content-box`（参见图\
  \ 7.15）。这三个值均可用于 `background-clip` 和 `background-origin` 属性。\n\n点击此处查看代码\n\n```css\n\
  div {\n  background: url(\"shay.jpg\") 0 0 no-repeat;\n  background-clip: padding-box;\n\
  \  background-origin: border-box;\n}\n```\n![图像](img/00061.jpeg)\n**图 7.13** `border-box`\
  \ 值将背景扩展到元素的边框\n\n![图像](img/00062.jpeg)\n**图 7.14** `padding-box` 值将背景扩展到内边距，但背景包含在任何边框内\n\
  \n![图像](img/00063.jpeg)\n**图 7.15** `content-box` 值将背景包含在元素的边框和内边距内\n\n`background-clip`\
  \ 属性值默认设置为 `border-box`，允许背景图像扩展到与边框相同的区域。同时，`background-origin` 属性值默认设置为 `padding-box`，允许背景图像的起始位置扩展到内边距。\n\
  \n我们在第 4 节 “打开盒模型”学习 `box-sizing` 属性时已经讨论过这些关键字值。这些值本身的意思没有改变，但它们的功能在使用不同的背景属性时会发生变化。\n\
  \n### 总结\n\n\n\n\n为我们的页面添加背景和渐变色可以让我们能够让色彩成为设计的焦点。这些功能还有助于定义内容的分组方式，并改进我们页面的整体布局。\n\
  \n回顾一下，本节涵盖了以下内容：\n\n* 如何向元素添加背景颜色和图像\n* CSS 渐变色（包括线性渐变和径向渐变）以及如何对其进行自定义\n* 如何在单个元素上应用多个背景图像\n\
  * 允许我们更改背景图像尺寸、覆盖区域和位置的新 CSS3 属性\n\n添加背景颜色、渐变色和图像为增强我们网站的整体设计提供了许多可能性。很快我们将讨论如何语义化地向页面添加图像（背景图像之外）和其他媒体。但在那之前，让我们先来看看如何语义化地创建列表。\n\
  \n## 课程 8 节：创建列表\n\n列表是日常生活的一部分。待办事项决定了要完成的工作。导航路线提供了逐步的指令列表。食谱提供了配料列表和说明列表。由于几乎每种事情都有列表，因此很容易理解为什么它们在网上也如此流行。\n\
  \n当我们想在网站上使用列表时，HTML 提供了三种不同类型供选择：无序列表、有序列表和描述列表。选择使用哪种类型的列表——或者是否使用列表——取决于内容以及显示该内容在语义上最合适的选项。\n\
  \n除了 HTML 中提供的三种不同类型的列表外，还有多种使用 CSS 对这些列表进行样式设置。例如，我们可以选择在列表上使用什么类型的标记。标记可以是正方形、圆圈、数字、字母，或者根本不存在。此外，我们还可以决定列表应该垂直显示还是水平显示。所有这些选择在我们网页页面的样式设计中都起着重要作用。\n\
  \n### 无序列表\n\n无序列表只是一组顺序无关的相关项目列表。在 HTML 中创建无序列表是使用无序列表块级元素 `<ul>` 完成的（参见图 8.1）。无序列表中的每个项目使用列表项元素\
  \ `<li>` 单独进行标记。\n\n![图像](img/00064.jpeg)\n\n**图 8.1** 一个带有三个列表项的无序列表，其顺序并不重要\n\n\
  在默认情况下，大多数浏览器会为 `<ul>` 元素添加垂直的 `margin` 和左侧的 `padding`，并在每个 `<li>` 元素之前加上一个实心点。这个实心点被称为列表项标记，可以使用\
  \ CSS 进行更改。\n\n```\n<ul>\n  <li>Orange</li>\n  <li>Green</li>\n  <li>Blue</li>\n\
  </ul>\n```\n\n### 有序列表\n\n有序列表元素 `<ol>` 的工作方式与无序列表元素非常相似；单个列表项以相同的方式创建（参见图 8.2）。有序列表和无序列表之间的主要区别在于，在有序列表中，项目的呈现顺序是重要的。\n\
  \n![图像](img/00065.jpeg)\n\n**图 8.2** 一个带有三个列表项的有序列表，其顺序是重要的\n\n因为顺序很重要，所以有序列表使用数字而不是默认的点作为列表项标记。\n\
  \n点击此处查看代码图像\n\n```\n<ol>\n  <li>Head north on N Halsted St</li> <!-- 此处保留英文内容 -->\n\
  \  <li>Turn right on W Diversey Pkwy</li>\n  <li>Turn left on N Orchard St</li>\n\
  </ol>\n```\n\n有序列表还有其独特的属性，包括 `start` 和 `reversed`。\n\n#### Start 属性\n\n`start`\
  \ 属性定义了有序列表应该从哪个数字开始（参见图 8.3）。默认情况下，有序列表从 `1` 开始。但是，某些情况下列表应该从 `30` 或另一个数字开始。当我们在\
  \ `<ol>` 元素上使用 `start` 属性时，我们可以精确识别有序列表应该从哪个数字开始计数。\n\n![图像](img/00066.jpeg)\n\n\
  **图 8.3** 一个带有三个列表项的有序列表，其 `start` 属性值为 `30`\n\n`start` 属性只接受整数值，尽管有序列表可能使用不同的编号系统（例如罗马数字）。\n\
  \n点击此处查看代码图像\n\n```\n<ol start=\"30\">\n  <li>Head north on N Halsted St</li>\n\
  \  <li>Turn right on W Diversey Pkwy</li>\n  <li>Turn left on N Orchard St</li>\n\
  </ol>\n```\n\n#### Reversed 属性\n\n`reversed` 属性当用在 `<ol>` 元素上时，允许列表倒序。一个从 `5` 到\
  \ `1` 的五个数字列表（参见图 8.4）。\n\n![图像](img/00067.jpeg)\n\n**图 8.4** 一个带有三个列表项的 `reversed`\
  \ 属性有序列表\n\n`reversed` 属性是一个布尔属性，因此它不接受任何值。它只有是 true 或 false。\n\n点击此处查看代码图像\n\n\
  ```\n<ol reversed>\n  <li>Head north on N Halsted St</li>\n  <li>Turn right on W\
  \ Diversey Pkwy</li>\n  <li>Turn left on N Orchard St</li>\n</ol>\n```\n\n#### Value\
  \ 属性\n\n`value` 属性可以在有序列表中的单个 `<li>` 元素上更改其值。例如，如果第二个列表项具有 `value` 属性 `9`，则该列表项的数字将显示为第九（参见图\
  \ 8.5）。\n\n```\n<ol>\n  <li>Head north on N Halsted St</li>\n  <li value=\"9\">Turn\
  \ right on W Diversey Pkwy</li>\n  <li>Turn left on N Orchard St</li>\n</ol>\n```\n\
  \n![图像](img/00068.jpeg)\n\n**图 8.5** 一个带有三个列表项的有序列表，第二个列表项的 `value` 属性值为 9\n\n###\
  \ 描述列表\n\n网上看到的另一种列表类型（但不如无序或有序列表那么常见）是描述列表。描述列表用于列出多个术语及其描述，例如词汇表。\n\n在 HTML 中创建描述列表是使用描述列表块级元素\
  \ `<dl>` 完成的。描述列表不需要使用 `<li>` 元素标记列表项，而是两个块级元素：描述术元素 `<dt>` 和描述元素 `<dd>`。\n\n描述列表可以包含许多一个接一个术语和描述（参见图\
  \ 8.6）。\n\n![图像](img/00069.jpeg)\n\n**图 8.6** 一个带有多个术语和描述的描述列表\n\n添加描述列表时，`<dt>`\
  \ 元素必须位于 `<dd>` 元素之前。定义术与其紧随其后的描述是相互对应的；因此，这些元素的顺序是重要的。\n\n点击此处查看代码图像\n\n```\n<dl>\n\
  \  <dt>study</dt>\n  <dd>The devotion of time and attention to acquiring knowledge\
  \ on an academic subject, especially by means of books</dd>\n  <dt>design</dt>\n\
  </dl>\n```\n\n\n\n5. 在建造或制作之前，为了展示建筑、服装或其他物品的外观、功能或工作原理而产生的计划或图纸\n6. 行为、事实或物质对象背后的存在或被认为存在的目的、计划或意图\n\
  7. 业务\n8. 工作\n9. 某人的日常职业、行业或行当\n\n### 嵌套列表（Nesting Lists）\n\n列表极其强大的一个特性之一是它们可以被嵌套。每个列表都可以放置在另一个列表中；它们可以无限嵌套。但无限嵌套列表的潜力并不意味着可以随心所欲。列表仍然应该专门保留在它们具有最大语义价值的地方使用。\n\
  \n嵌套列表的一个技巧是清楚每个列表和列表项的开始和结束位置。具体具体到无序列表和有序列表（因为大多数嵌套都发生在这里），直接存在于 `<ul>` 和 `<ol>`\
  \ 元素中的唯一元素是 `<li>` 元素。重复一遍，我们可以作为 `<ul>` 和 `<ol>` 元素直接子元素的唯一元素是 `<li>` 元素。\n\n尽管如此，一旦进入\
  \ `<li>` 元素，就可以添加一组标准元素，包括任何 `<ul>` 或 `<ol>` 元素。\n\n要嵌套列表而不是关闭列表项，请开始一个新列表（参见图 8.7）。一旦嵌套列表完成并关闭，关闭包裹它的列表项，并继续原始列表。\n\
  \n![Image](img/00070.jpeg)\n\n**图 8.7** 带有嵌套无序列表的有序列表\n\n点击此处查看代码图像\n\n```html\n\
  <ol>\n  <li>散狗</li>\n  <li>折叠衣服</li>\n  <li>\n    去超市买：\n    <ul>\n      <li>牛奶</li>\n\
  \      <li>面包</li>\n      <li>奶士</li>\n    </ul>\n  </li>\n  <li>修剪草坪</li>\n  <li>做晚餐</li>\n\
  </ol>\n```\n\n由于嵌套列表可能有点复杂——而且如果操作不当，会出现不希望的样式——让我们快速回顾一下。`<ul>` 和 `<ol>` 元素只能包含\
  \ `<li>` 元素。`<li>` 元素可以根据需要包含任何普通元素；然而，`<li>` 元素必须是 `<ul>` 或 `<ol>` 元素的直接子元素。\n\n\
  值得注意的是，当列表嵌套在其他列表中时，它们的列表项标记将根据列表嵌套的深度发生变化。在上一个示例中，嵌套在有序列表中的无序列表使用空心圆而不是实心圆作为列表项标记。这种变化发生是因为无序列表嵌套在有序列表中的第一层。\n\
  \n幸运的是，我们可以控制这些列表项标记在任何层级的显示方式，接下来我们将查看这一点。\n\n### 列表项样式（List Item Styling）\n\n\
  无序列表和有序列表默认使用列表项标记。对于无序列表，这些标记通常是实心点，而有序列表通常使用数字。通过 CSS，可以调整这些列表项标记的样式和位置。\n\n####\
  \ 列表类型属性（List Style Type Property）\n\n`list-style-type` 属性用于设置列表项标记的内容（参见图 8.8）。可用值范围从方块、十进制到亚美尼亚数字，且该样式可以放在\
  \ CSS 中的 `<ul>`、`<ol>` 或 `<li>` 元素上。\n\n![Image](img/00071.jpeg)\n\n**图 8.8** 一个\
  \ `list-style-type` 属性值为 `square` 的无序列表\n\n任何 `list-style-type` 属性值都可以添加到无序列表或有序列表中。考虑到这一点，可以在无序列表使用数字列表项标记，并在有序列表使用非数字标记。\n\
  \n**HTML**\n```html\n<ul>\n  <li>橙色</li>\n  <li>绿色</li>\n  <li>蓝色</li>\n</ul>\n\
  ```\n**CSS**\n```css\nul {\n  list-style-type: square;\n}\n```\n\n##### 列表类型值（List\
  \ Type Values）\n\n如前所述，`list-style-type` 属性有一系列不同的值。以下列表列出了这些值以及它们对应的内容。\n\n![Image](img/0072.jpeg)\n\
  \n#### 使用图像作为列表标记（Using an Image as a List Marker）\n\n可能会有那么，默认的 `list-style-type`\
  \ 属性值不够用，我们想要自定义列表项标记。这最常见的实现方法是在列表中的每个 `<li>` 元素上放置背景图像（参见图 8.9）。\n\n![Image](img/0073.jpeg)\n\
  \n**图 8.9** 带有背景自定义列表项标记的无序列表\n\n该过程包括移除任何默认 `list-style-type` 值，并向 `<li>` 元素添加背景图像和内边距（padding）。详细而言，`list-style-type`\
  \ 属性值 `none` 将移除现有的列表项标记。`background` 属性将识别背景图像，以及可能的它的位置和重复值。`padding` 属性将为背景图像左侧提供空间。\n\
  \n**HTML**\n```html\n<ul>\n  <li>橙色</li>\n  <li>绿色</li>\n  <li>蓝色</li>\n</ul>\n\
  ```\n**CSS**\n```css\nli {\n  background: url(\"arrow.png\") 0 50%;\n  list-style-type:\
  \ none;\n  padding-left: 12px;\n}\n```\n\n#### 列表样式位置属性（List Style Property）\n\n\
  默认情况下，列表项标记位于 `<li>` 元素内内容的左侧。这种列表定位被描述为 `outside`，意味着所有内容将位于列表项标记的右侧。使用 `list-style-position`\
  \ 属性，我们可以将默认的 `outside` 更改为 `inside` 或 `inherit`。\n\n`outside` 属性值将列表项标记放置在 `<li>`\
  \ 元素的左侧，不允许内容在其下方换行。`inside` 属性值（很少见）将列表项标记与 `<li>` 元素的第一行对齐，并允许内容在其下方换行（参见图 8.10）。\n\
  \n**HTML**\n```html\n<ul>\n  <li>蛋糕...</li>\n  <li>糖针...</li>\n</ul>\n```\n**CSS**\n\
  ```css\nul {\n  list-style-position: inside;\n}\n```\n\n![Image](img/00074.jpeg)\n\
  \n**图 8.10** `list-style-position` 属性值为 `inside` 的无序列表\n\n#### 简写列表属性（Shorthand\
  \ List Style Property）\n\n到目前讨论的列表样式属性 `list-style-type` 和 `list-style-position`\
  \ 可以合并为一个简写 `list-style` 属性值。使用 `list-style` 属性时，我们可以一次使用一个或所有列表样式值。这些简写值的顺序应该是\
  \ `list-style-type` 后面跟着 `list-style-position`。\n\n点击此处查看代码图像\n\n```css\nul {\n\
  \  list-style: circle inside;\n}\nol {\n  list-style: lower-roman;\n}\n```\n\n###\
  \ 水平显示列表（Horizontally Displaying List）\n\n有时我们可能希望水平显示列表而不是垂直显示。也许我们想将列表分成多列、构建导航列表，或者将几个列表项放在单行中。根据内容和所需的外观，有几种不同的方法可以将列表显示为单行，例如通过将\
  \ `<li>` 元素的 `display` 属性值设置为 `inline` 或 `inline-block`，或者通过浮动。\n\n#### 显示列表（Displaying\
  \ List）\n\n将列表显示在单行的最快的方法是给 `<li>` 元素一个 `display` 属性值 `inline` 或 `inline-block`。这样做会将所有的\
  \ `<li>` 元素放置在单行内，每个列表项之间留有一个空格。\n\n\n\n\n\n如果每个 `<li>` 元素之间的空格让你感到困扰，可以使用我们在第 5\
  \ Lesson 中讨论过的相同技术，即“定位内容”来将其移除。\n\n通常情况下，我们会使用 `inline-block` 属性值而不是 `inline` 属性值。`inline-block`\
  \ 属性值允许我们轻松地为 `<li>` 元素添加垂直边距和其他间距，而 `inline` 属性值则不行。\n\n当将 `display` 属性更改更改 `inline`\
  \ 或 `inline-block` 时，列表项目标记（无论是项目符号、数字或其他样式）都会被移除（参见图 8.11）。\n\n### HTML\n```html\n\
  <ul>\n  <li>Orange</li>\n  <li>Green</li>\n  <li>Blue</li>\n</ul>\n```\n\n### CSS\n\
  点击此处查看代码图片\n\n```css\nli {\n  display: inline-block;\n  margin: 0 10px;\n}\n```\n\
  ![Image](img/00075.jpeg)\n\n**图 8.11** 每个 `<li>` 元素均以 `inline-block` 属性值显示的无序列表\n\
  \n## 浮动列表\n将 `display` 属性更改为 `inline` 或 `inline-block` 很快；但会移除列表项目标记。如果需要列表项目标记，浮动每个\
  \ `<li>` 元素是更改 `display` 属性更好的选择。\n\n将所有 `<li>` 元素的 `float` 属性设置为 `left` 将使所有 `<li>`\
  \ 元素水平对齐在一起，它们之间没有任何空间。当我们浮动每个 `<li>` 元素时，默认显示列表项目标记，并且实际上会位于相邻的 `<li>` 元素之上。为了防止列表项目标记显示在其他\
  \ `<li>` 元素之上，应该添加水平 `margin` 或 `padding`（参见图 8.12）。\n\n### HTML\n```html\n<ul>\n\
  \  <li>Orange</li>\n  <li>Green</li>\n  <li>Blue</li>\n</ul>\n```\n\n### CSS\n```css\n\
  li {\n  float: left;\n  margin: 0 20px;\n}\n```\n![Image](img/00076.jpeg)\n\n**图\
  \ 8.12** 每个 `<li>` 元素均浮动到 `left` 的无序列表\n\n与浮动任何元素一样，这破坏了页面的流。我们必须记住清除浮动——最常用的是使用\
  \ clearfix 技术——并让页面恢复到正常流。\n\n### 导航列表示例\n我们经常开发并发现使用无序列表的导航菜单。这些列表通常被布局为水平列表，使用之前提到的两种技术之一。这里是一个使用无序列表标记、且\
  \ `<li>` 元素显示为 `inline-block` 元素的水平导航菜单的示例（参见图 8.13）。\n\n![Image](img/00077.jpeg)\n\
  \n**图 8.13** 使用无序列表标记的导航菜单\n\n### HTML\n点击此处查看代码图片\n\n```html\n<nav class=\"navigation\"\
  >\n  <ul>\n    <li><a href=\"#\">Profile</a></li><!--\n    --><<li><a href=\"#\"\
  >Settings</a></li><!--\n    --><<li><a href=\"#\">Notifications</a></li><!--\n \
  \   --><<li><a href=\"#\">Logout</a></li>\n  </ul>\n</nav>\n```\n\n### CSS\n点击此处查看代码图片\n\
  \n```css\n.navigation ul {\n  font: bold 11px \"Helvetica Neue\", Helvetica, Arial,\
  \ sans sans sans-serif;\n  margin: 0;\n  padding: 0;\n  text-transform: uppercase;\n\
  }\n.navigation li {\n  display: inline-block;\n}\n.navigation a {\n  background:\
  \ #395870;\n  background: linear-gradient(#4970f, #293f50);\n  border-right: 1px\
  \ solid rgba(0, 0, .3);\n  color: #fff;\n  padding: 12px 20px;\n  text-decoration:\
  \ none;\n}\n.navigation a:hover {\n  background: #314b60;\n  box-shadow: inset 0\
  \ 0 10px 1px rgba(0, 0, .3);\n}\n.navigation li:first-child a {\n  border-radius:\
  \ 4px 0 4px;\n}\n.navigation li:last-child a {\n  border-right: 0;\n  border-radius:\
  \ 0 4px 0;\n}\n```\n\n## 实践中\n现在我们已经知道如何在 HTML 和 CSS 中构建列表，让我们回到我们的 Styles 网站，看看我们在哪里可以使用列表。\n\
