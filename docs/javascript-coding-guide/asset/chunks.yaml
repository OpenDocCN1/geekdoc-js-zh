    # Contents


    # Intro


    # Simple Tiny Book Of JS Questions and Answers


    ## Intro

    In this little book we show you some important and common javascript concepts,
    questions and answers. This book is laid out in a simple QandA format to make
    it easy and simple for you to absorb and learn. The goal of this book was to make
    a very simple guide with no fluff to give you essential knowledge of the JavaScript
    language.


    There are ten must know questions and answers in this handbook.


    ![](OEBPS/Image00000.jpg)


    ## Simple Tiny Book Of JS Questions and Answers


    ### Question 1: JavaScript: What are the mathematical assignment operators?

    `+=`

    `-=`

    `*=`

    `/=`

    `%==`

    `**=`


    ### Question 2: JavaScript: What is the exponentiation operator?

    `**`


    Example:

    ```javascript

    let answer = 3 ** 2;

    ```

    The above code assigns the variable `answer` a value of 9.


    ### Question 3: JavaScript: What Math method returns a random decimal value between
    0 and 1?

    `Random`


    ### Question 4: JavaScript: How are template literals formatted?

    Using backticks `` ` `` instead of quotation marks `''''`.


    ### Question 5: JavaScript: What Number method returns a boolean value based on
    whether or not a given number is an integer?

    `isInteger(number)`


    ### Question 6: JavaScript: What is the use of template literals?

    To insert variables into strings without escaping quotation marks.


    ### Question 7: JavaScript: What keyword declares a variable that can have its
    value changed?

    `Let`


    ### Question 8: JavaScript: How are variables inserted into template literals?

    Inside the curly braces of `${}`.


    Example:

    ```javascript

    console.log(`The number is equal to ${valueOfNumber}`);

    ```


    ### Question 9: JavaScript: How are single line comments formatted?

    Using `//`.


    Example:

    ```javascript

    //Comment here

    ```


    ### Question 10: JavaScript: What operator returns the type of the variable to
    its right as a string?

    `typeof`


    Example:

    ```javascript

    let valueType = typeof 42;

    ```

    The `valueType` variable would be assigned the value `''number''`.


    ![](OEBPS/Image00000.jpg)


    ## Conclusion

    This book contains essential knowledge and features for you to learn about the
    JavaScript programming language. It is recommended that you revisit and revise
    the contents of this book using the recall memory method so you can remember.


    Thank you for reading. We wish you the best of luck on your journey.

    '
