  md: '+   3. **Some values are lonely.** For example, `null` is the only value of
    the Null type, and `undefined` is the only value of the Undefined type. As we
    will learn later, these two lonely values are quite the troublemakers!

    4. **We can ask questions with expressions.** Expressions exist in our code, so
    they are not values. Rather, JavaScript will *answer* our expressions with values.
    For example, the `2 + 2` *expression* is answered with the value `4`.

    5. **We can inspect the type of something by wrapping it in a `typeof` expression.**
    For example, `typeof(4)` results in the string value `"number"`.


