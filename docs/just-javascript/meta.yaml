    # Primitive Values Are Immutable


    Did you get the answer right? This might seem like the kind of trivia question
    that only comes up in JavaScript interviews. Even so, it illustrates an important
    point about primitive values.


    **We can’t change primitive values.**


    I will explain this with a small example. Strings (which are primitive) and arrays
    (which are not) have some superficial similarities. An array is a sequence of
    items, and a string is a sequence of characters:


    ```

    let arr = [212, 8, 506];

