    # Mutation


    *Mutation* is a fancy way of saying “change.”


    **For example, we could say that we *changed* an object’s property, or we could
    say that we *mutated* that object (and its property). This is the same thing.**


    People like to say “mutate” because this word has a sinister undertone. It reminds
    you to exercise extra caution. This doesn’t mean mutation is “bad”—it’s just programming!—but
    you need to be very intentional about it.


    Let’s recall our original task. We wanted to give John a different surname, and
    move him to Malibu. Now let’s look at our two mutations:


    ```

    // Step 3: Changing the Properties

    john.surname = ''Lennon'';

    john.address.city = ''Malibu'';

    ```


    *Which* objects are being mutated here?


    The first line mutates the object `john` points to. This makes sense: we *mean*
    to change John’s surname. That object represents John’s data, so we mutate its
    `surname` property.


    However, the second line does something very different. It doesn’t mutate the
    object that `john` points to. Rather, it mutates a completely different object—'
