  - '[PAGE 60]


    Every time we execute a line of code that contains a function expression, a brand
    new function value appears in our universe.


    ![](img/5f506681f0d75d6067480d5c0ee322f2_60_0.png)


    Here, too, **function() {}** is an expression. Like any expression, a function
    expression is a “question” to our JavaScript universe—**which answers us by *creating*
    a new function value every time we ask**. This is very similar to how **{}** creates
    a new object value when it executes. Functions are like objects!


    Technically, functions *are* objects in JavaScript. We''ll keep treating them
    as a separate fundamental type because they have unique capabilities compared
    to regular objects. But, generally speaking, if you can do something to an object,
    you can also do that to a function too. They are very special objects.


    # Calling a Function


    What does this code print?


    ```

    let countDwarves = function() { return 7; };

    let dwarves = countDwarves;

    console.log(dwarves);

    ```


    You might think that it prints **7**, especially if you''re not looking very closely.


    Now check this snippet in the console! The exact thing it prints depends on the
    browser, but you will see *the function itself* instead of the number **7** there.'
  - '[PAGE 61]


    If you follow our mental model, this behavior should make sense:


    +   1. First, we created a new function value with a `function() { }` expression,
    and pointed the `countDwarves` variable at this value.

    2. Next, we pointed the `dwarves` variable at the value that `countDwarves` is
    pointing to—which is the same function value.

    3. Finally, we logged the value that `dwarves` is currently pointing to.


    *At no point did we call our function!*


    As a result, both `countDwarves` and `dwarves` point to the same value, which
    happens to be a function. See, *functions are values*. We can point variables
    to them, just like we can do with numbers or objects.


    **Of course, if we want to `call` a function, we can do that too:**


    ```

    let countDwarves = function() { return 7; };

    let dwarves = countDwarves(); // () is a function call

    console.log(dwarves);

    ```


    Note that neither the `let` declaration nor the `=` assignment have anything to
    do with our function call. It''s `()` that performs the function call—and it alone!


    **Adding `()` changes the meaning of our code:**


    +   - `let dwarves = countDwarves` means “Point `dwarves` to the value that `countDwarves`
    is currently pointing to.”

    - `let dwarves = countDwarves()` means “Point `dwarves` to the value **returned
    by** the function that `countDwarves` is currently pointing to.”


    In fact, `countDwarves()` is also an expression. It''s known as a *call expression*.
    To “answer” a call expression, JavaScript runs the code inside our function, and
    hands us the returned value as the result (in this example, it''s `7`).'
