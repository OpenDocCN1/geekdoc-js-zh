  - '[PAGE 76]


    > ### Fun Fact

    A quick historical anecdote: ensuring developers could detect `NaN` this way was
    one of the original reasons for making `NaN === NaN` return `false`! This was
    decided before JavaScript even existed.


    # ### Second Special Case: `-0`


    In regular math, there is no such concept as “minus zero,” but it exists in floating-point
    math for practical reasons. Here’s an interesting fact about it.


    Both `0 === -0` and `-0 === 0` are always `true`:


    ```

    let width = 0; // 0

    let height = -width; // -0

    console.log(width === height); // true

    ```


    However, `0` is a *different* value from `-0`:


    ```

    console.log(Object.is(width, height)); // false

    ```


    *That’s confusing too.*


    In practice, I haven’t run into a case where this matters in my entire career.


    # ### Coding Exercise


