  mdcn: "\n## 创建我们自己的对象\n\n对象有一件事特别令人兴奋和独特。**我们可以创建更多的对象！我们可以用自己创建的对象来填充我们的JavaScript宇宙。**\n\
    \n在我们的心智模型中，我们讨论过的所有原始值——`null`、`undefined`、布尔值、数字和字符串——都“一直存在”。我们无法创建一个新的字符串或一个新的数字，我们只能“召唤”那个值：\n\
    \n```javascript\nlet sisters = 3;\nlet musketeers = 3;\n```\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_56_0.png)\n\
    \n对象的不同之处在于我们*可以*创建更多的对象。**每次我们使用`{}`对象字面量，我们都在*创建*一个全新的对象值：**\n\n```javascript\n\
    let shrek = {};\nlet donkey = {};\n```\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_57_0.png)\n\
    \n数组、日期和任何其他对象也是如此。例如，`[]`数组字面量会*创建*一个新的数组值——一个以前从未存在过的值。\n\n## 对象会消失吗？\n\n你可能会想：对象会消失吗，还是会永远存在？JavaScript的设计方式使得我们无法从代码内部判断这一点。例如，我们无法*销毁*一个对象：\n\
    \n```javascript\nlet junk = {};\njunk = null; // 不一定会销毁一个对象\n```\n\n相反，JavaScript是一种垃圾回收语言。\n\
    \n这意味着，尽管我们不能销毁一个对象，但如果无法从我们的代码中通过连线找到它，它*可能*最终会“消失”。\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_57_1.png)\n\
    \nJavaScript并不保证*何时*会发生垃圾回收。\n\n除非你试图找出为什么一个应用程序使用了太多内存，否则你不需要经常考虑垃圾回收。我在这里提到它只是为了让你知道我们可以创建对象——但我们不能销毁它们。\n\
    \n> 在我们的宇宙中，对象和函数最接近我们的代码。这提醒我们，我们可以操纵它们，甚至可以创建更多的它们。\n\n## 函数\n\n我们已经到达了这次旅程的最后一站！\n\
    \n将函数视为与我的代码分离的值，这特别奇怪。毕竟，它们*是*我的代码。或者不是吗？\n\n## 函数是值\n\n我们定义函数是为了以后可以调用它们并运行其中的代码。然而，要真正理解JavaScript中的函数，我们需要暂时忘记它们*为什么*有用。相反，我们将把函数视为另一种值：一个数字，一个对象，*一个函数*。\n\
    \n为了理解函数，我们将把它们与数字和对象进行比较。\n\n首先，考虑这个`for`循环，它运行`console.log(2)`七次：\n\n```javascript\n\
    for (let i = 0; i < 7; i++) {\n  console.log(2);\n}\n```\n\n它向`console.log`传递了多少个不同的值？要回答这个问题，让我们回顾一下当我们写下`2`时它的含义。它是一个数字字面量。字面量是一个表达式——一个对我们宇宙的问题。在我们的宇宙中，每个数字只有一个值，所以它通过每次“召唤”数字`2`的相同值来“回答”我们的问题。**所以答案是一个值。**\
    \ 我们将看到七次日志——但我们在每次调用中传递的是相同的值。\n\n现在让我们简要回顾一下对象。\n\n这是另一个`for`循环，它运行`console.log({})`七次：\n\
    \n```javascript\nfor (let i = 0; i < 7; i++) {\n  console.log({});\n}\n```\n\n\
    现在它向`console.log`传递了多少个不同的值？在这里，`{}`也是一个字面量——只不过它是一个*对象字面量*。正如我们刚刚学到的，我们的JavaScript宇宙不会通过召唤任何东西来“回答”一个对象字面量。相反，它*创建*一个新的对象值——这将是`{}`对象字面量的结果。**所以上面的代码创建并记录了七个完全不同的对象值。**\n\
    \n好好想想这一点。\n\n现在来看看函数。\n\n```javascript\nfor (let i = 0; i < 7; i++) {\n  console.log(function()\
    \ {});\n}\n```\n\n这段代码向`console.log`传递了多少个不同的值？\n\n> # 答案\n>\n> 答案是**七个不同的函数值**。在你确定答案之前不要看答案。\n\
    \n每当我们执行一行包含函数表达式的代码时，我们宇宙中就会出现一个全新的函数值。\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_60_0.png)\n\
    \n在这里，**`function() {}`**也是一个表达式。与任何表达式一样，函数表达式是向我们的JavaScript宇宙提出的一个“问题”——**宇宙通过每次我们提问时都*创建*一个新的函数值来“回答”我们。**\
    \ 这与**`{}`**执行时创建一个新的对象值非常相似。函数就像对象！\n\n从技术上讲，函数在JavaScript中*就是*对象。我们将继续将它们视为一种独立的基本类型，因为它们与常规对象相比具有独特的能力。但总的来说，如果你能对一个对象做某事，你也可以对函数做同样的事情。它们是非常特殊的对象。\n\
    \n## 调用函数\n\n这段代码打印什么？\n\n```javascript\nlet countDwarves = function() { return\
    \ 7; };\nlet dwarves = countDwarves;\nconsole.log(dwarves);\n```\n\n你可能认为它打印**7**，特别是如果你没有仔细看的话。\n\
    \n现在在控制台中检查这个代码片段！它打印的确切内容取决于浏览器，但你会在那里看到*函数本身*而不是数字**7**。\n\n如果你遵循我们的心智模型，这个行为应该是有意义的：\n\
    \n1.  首先，我们使用`function() { }`表达式创建了一个新的函数值，并将`countDwarves`变量指向这个值。\n2.  接下来，我们将`dwarves`变量指向`countDwarves`指向的值——也就是同一个函数值。\n\
    3.  最后，我们记录了`dwarves`当前指向的值。\n\n*我们从未调用过我们的函数！*\n\n结果，`countDwarves`和`dwarves`都指向同一个值，这个值恰好是一个函数。看，*函数是值*。我们可以将变量指向它们，就像我们可以对数字或对象做的那样。\n\
    \n**当然，如果我们想`调用`一个函数，我们也可以这样做：**\n\n```javascript\nlet countDwarves = function()\
    \ { return 7; };\nlet dwarves = countDwarves(); // () 是一个函数调用\nconsole.log(dwarves);\n\
    ```\n\n请注意，`let`声明和`=`赋值都与我们的函数调用无关。是`()`执行了函数调用——并且只有它！\n\n**添加`()`改变了我们代码的含义：**\n\
    \n-   `let dwarves = countDwarves` 意味着“将`dwarves`指向`countDwarves`当前指向的值。”\n- \
    \  `let dwarves = countDwarves()` 意味着“将`dwarves`指向由`countDwarves`当前指向的函数*返回*的值。”\n\
    \n事实上，`countDwarves()`也是一个表达式。它被称为*调用表达式*。为了“回答”一个调用表达式，JavaScript运行我们函数内的代码，并将返回值作为结果交给我们（在这个例子中，是`7`）。\n\
    \n## 总结\n\n这真是一段奇妙的旅程！在过去的两个模块中，我们已经探讨了JavaScript中的每一种值类型。让我们回顾一下我们遇到的每种值类型，从不同的原始类型开始：\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_62_0.png)\n\n-   Undefined\n-   Null\n\
    -   Booleans\n-   Numbers\n-   BigInts\n-   Strings\n-   Symbols\n\n然后，是下面的特殊类型，它们允许我们*创建自己的值*：\n\
    \n-   Objects\n-   Functions\n\n参观JavaScript不同的“天球”很有趣。既然我们已经介绍了所有的值，我们也学习了它们彼此*区别*于何处。\n\
    \n原始值（字符串、数字等），我们在旅程的第一部分遇到过，它们在我们的宇宙中一直存在。**例如，写下`2`或`\"hello\"`总是会“召唤”相同的数字或字符串值。对象和函数的行为不同，允许我们生成自己的值。写下`{}`或`function()\
    \ {}`总是会*创建*一个全新的、不同的值。** 这个想法对于理解JavaScript中的相等性至关重要，这将是我们的下一个主题。\n\n## 练习\n\n\
    这个模块也有供你练习的练习！\n\n**不要跳过它们！**\n\n即使你可能熟悉对象和函数的概念，这些练习将帮助你巩固我们正在构建的心智模型。在我们能够进入更复杂的话题之前，我们需要这个基础。\n\
    \n## 阅读完毕？\n\n将此章节标记为已学习以跟踪你的进度。\n\n标记为已学习\n"
