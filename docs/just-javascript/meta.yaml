- img_proc: true
  md: 'The `const` keyword lets you create read-only variables—also known as *constants*.
    Once we declare a constant, we can''t point it to a different value:


    ```

    shrek = fiona; // TypeError

    ```


    But there''s a crucial nuance. **We can still mutate the *object* our wire points
    to:**


    ```

    shrek.species = ''human'';

    console.log(shrek.species); // ''human''

    ```


    In this example, it is only the `shrek` *variable wire itself* that is read-only
    (`const`). It points to an object—and *that* object''s properties can be mutated!


    The usefulness of `const` is a hotly debated topic. Some prefer to ban `let` altogether
    and always use `const`. Others say that programmers should be trusted to reassign
    their own variables. Whatever your preference may be, remember that `const` prevents
    variable reassignment—not object mutation.


    # Is Mutation Bad?


    Don''t walk away thinking that mutation is “bad.” That''s a lazy oversimplification
    that obscures real understanding. If data changes over time, a mutation happens
    *somewhere*. The question is, *what* should be mutated, *where*, and *when*?


    Mutation is “spooky action at a distance.” Changing `john.address.city` led to
    `console.log(sherlock.address.city)` printing something else.


    **By the time you mutate an object, variables and properties may already be pointing
    to it. Your mutation affects any code “following” those wires later.**


    This is both a blessing and a curse. Mutation makes it easy to change some data
    and immediately “see” the change across the whole program. However, undisciplined
    mutation makes it harder to predict what the program will do.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'There is a school of thought that mutation is best contained to a very narrow
    layer of your application. The benefit, according to this philosophy, is that
    your program’s behavior is more predictable. The downside is that you write more
    code to “pass things around” and avoid mutation.


    It’s worth noting that mutating *new* objects that you’ve just created is always
    okay because there are no other wires pointing to them yet. In other cases, I
    advise you to be very intentional about what you’re mutating and when. The extent
    to which you’ll rely on mutation depends on your app’s architecture.


    # Recap


    +   - Objects are never “nested” in our universe—pay close attention to the wires.

    - Changing an object’s property is also called *mutating* that object.

    - If you mutate an object, your code will “see” that change via any wires pointing
    to that object. Sometimes, this may be what you want. However, mutating accidentally
    shared data may cause bugs.

    - You can declare a variable with `const` instead of `let`. That allows you to
    enforce that this variable always points to the same value. But remember that
    `const` does *not* prevent object mutation!

    - Mutating the objects you’ve just created in code is safe. Broadly, how much
    you’ll use mutation depends on your app’s architecture.


