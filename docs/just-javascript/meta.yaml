    \ they are the same value.\n2. `-0 === 0` and `0 === -0` are `true`, although\
    \ they are different values.\n\nThese cases are uncommon, but we'll still take\
    \ a closer look at them.\n\n## First Special Case: `NaN`\n\nAs we saw in our celestial\
    \ tour of values, `NaN` is a special number that shows up when we do invalid math\
    \ like `0 / 0`:\n\n```\nlet width = 0 / 0; // NaN\n```\n\nFurther calculations\
    \ with `NaN` will give you `NaN` again:\n\n```\nlet height = width * 2; // NaN\n\
    ```\n\nYou probably won't do this intentionally, but it can happen if there is\
    \ a flaw in your data or calculations.\n\n**Remember that** `NaN === NaN` **is\
    \ always** `false`:\n\n```\nconsole.log(width === height); // false\n```\n\nHowever,\
    \ `NaN` is the *same* value as `NaN`:\n\n```\nconsole.log(Object.is(width, height));\
    \ // true\n```\n\nThat’s confusing.\n\nThe reason for `NaN === NaN` being `false`\
