    ```


    **But we can’t.**


    It’s an important detail we need to add to our mental model. A string is a primitive
    value, and **all primitive values are immutable.** “Immutable” is a fancy Latin
    way to say “unchangeable.” Read-only. We can’t mess with primitive values. At
    all.


    JavaScript won’t let us set a property on any primitive value, be it a number,
