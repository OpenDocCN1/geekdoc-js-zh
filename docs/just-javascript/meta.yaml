    \ `john.address` and `sherlock.address` point to the same object, we unintentionally\
    \ mutated shared data.\n\nWith `john.address = { city: 'Malibu' }`, we are mutating\
    \ the `address` property of the object that `john` points to. In other words,\
    \ *we are only mutating the object representing John's data*. This is why `sherlock.address.city`\
    \ remains unchanged.\n\nAs you can see, visually similar code may produce very\
    \ different results. *Always pay attention to the wires!*\n\n## Alternative Solution:\
    \ No Object Mutation\n\nThere is another way we can make `john.address.city` give\
    \ us \"Malibu\" while `sherlock.address.city` continues to say \"London\":\n\n\
    ```javascript\n// Replace Step 3 with this code:\njohn = {\n  surname: 'Lennon',\n\
    \  address: { city: 'Malibu' }\n};\n```\n\nHere, we don't mutate John's object\
    \ at all. Instead, we *reassign* the `john` variable to point to a \"new version\"\
    \ of John's data. From now on, `john` points to a different object, whose `address`\
    \ also points to a completely new object.\n\nYou might notice there's now an \"\
    abandoned\" old version of the John object on our diagram. We don't need to worry\
    \ about it. JavaScript will eventually automatically remove it from memory if\
    \ there are no wires pointing to it.\n\nNote that both of these approaches satisfy\
    \ all of our requirements:\n\n-   `console.log(sherlock.surname);` // \"Sherlock\"\
    \n-   `console.log(sherlock.address.city);` // \"London\"\n-   `console.log(john.surname);`\
    \ // \"Lennon\"\n-   `console.log(john.address.city);` // \"Malibu\"\n\nCompare\
    \ their diagrams. Do you have a personal preference for either of these fixes?\
    \ What are, in your opinion, their advantages and disadvantages?\n\n## Learn From\
    \ Sherlock\n\nSherlock Holmes once said, \"When you have eliminated the impossible,\
    \ whatever remains, however improbable, must be the truth.\"\n\nAs your mental\
    \ model becomes more complete, you will find it easier to debug problems because\
    \ you will know what possible causes to look for.\n\nFor example, if you know\
    \ that `sherlock.address.city` has changed after running some code, the wires\
    \ from our diagram suggest three explanations:\n\n1.  Maybe the `sherlock` variable\
    \ was reassigned.\n2.  Maybe the object we could reach via `sherlock` was mutated,\
    \ and its `address` property was set to something different.\n3.  Maybe the object\
    \ we could reach via `sherlock.address` was mutated, and its `city` property was\
    \ set to something different.\n\nYour mental model gives you a starting point\
    \ from which you can investigate bugs. **This works the other way around too.**\
    \ Sometimes, you can tell a piece of code is *not* the source of a problem—because\
    \ the mental model proves it!\n\nSay, if we point the `john` variable to a different\
    \ object, we can be fairly sure that `sherlock.address.city` won't change. Our\
    \ diagram shows that changing the `john` wire doesn't affect any wires coming\
    \ from `sherlock`.\n\nStill, keep in mind that unless you're Sherlock Holmes,\
    \ you can rarely be *fully* confident in something. This approach is [only as\
    \ good as](https://www.jamesforgety.com/2013/01/28/only-as-good-as-your-mental-model/)\
    \ your mental model! Mental models will help you come up with theories, but you\
    \ need to confirm them with `console.log` or a debugger.\n\n## Let vs. Const\n\
    \nIt is worth noting you can use the `const` keyword as an alternative to `let`:\n\
    \n```javascript\nconst shrek = { species: 'ogre' };\n```\n\nThe `const` keyword\
    \ lets you create read-only variables—also known as *constants*. Once we declare\
    \ a constant, we can't point it to a different value:\n\n```javascript\nshrek\
    \ = fiona; // TypeError\n```\n\nBut there's a crucial nuance. **We can still mutate\
    \ the *object* our wire points to:**\n\n```javascript\nshrek.species = 'human';\n\
    console.log(shrek.species); // 'human'\n```\n\nIn this example, it is only the\
    \ `shrek` *variable wire itself* that is read-only (`const`). It points to an\
    \ object—and *that* object's properties can be mutated!\n\nThe usefulness of `const`\
    \ is a hotly debated topic. Some prefer to ban `let` altogether and always use\
    \ `const`. Others say that programmers should be trusted to reassign their own\
    \ variables. Whatever your preference may be, remember that `const` prevents variable\
    \ reassignment—not object mutation.\n\n## Is Mutation Bad?\n\nDon't walk away\
    \ thinking that mutation is “bad.” That's a lazy oversimplification that obscures\
    \ real understanding. If data changes over time, a mutation happens *somewhere*.\
    \ The question is, *what* should be mutated, *where*, and *when*?\n\nMutation\
    \ is “spooky action at a distance.” Changing `john.address.city` led to `console.log(sherlock.address.city)`\
    \ printing something else.\n\n**By the time you mutate an object, variables and\
    \ properties may already be pointing to it. Your mutation affects any code “following”\
    \ those wires later.**\n\nThis is both a blessing and a curse. Mutation makes\
    \ it easy to change some data and immediately “see” the change across the whole\
    \ program. However, undisciplined mutation makes it harder to predict what the\
