    # Don’t Panic


    Hearing about these special numbers and how they behave can be overwhelming. Don’t
    stress too much about these special cases!


    They’re not very common. Now that you know they exist, you will recognize them
    in practice. In most cases, we can trust our “equality intuition” for both `Object.is(a,
    b)` and `a === b`.


    # Loose Equality


    Finally, we get to the last kind of equality.


    Loose equality (double equals) is the bogeyman of JavaScript. Here are a couple
    of examples to make your skin crawl:


    ```

    console.log([[]] == ''''); // true

    console.log(true == [1]); // true

    console.log(false == [0]); // true

    ```


    Wait, what?!


    The rules of loose equality (also called “abstract equality”) are arcane and confusing.
    Many coding standards prohibit the use of `==` and `!=` in code altogether.


    Although Just JavaScript doesn’t take strong opinions on what features you should
    or shouldn’t use, we’re not going to cover loose equality in much detail. It’s
    uncommon in modern codebases, and its rules don’t play a larger role in the language—or
    in our mental model.'
