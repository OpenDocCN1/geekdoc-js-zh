    \ literal. **So the code above creates and logs seven completely distinct object\
    \ values.**\n\nLet that sink in.\n\nNow have a look at functions.\n\n```javascript\n\
    for (let i = 0; i < 7; i++) {\n  console.log(function() {});\n}\n```\n\nHow many\
    \ different values does this code pass to `console.log`?\n\n> # Answer\n>\n> The\
    \ answer is **seven different function values**. Don't reveal until you have decided\
    \ on an answer.\n\nEvery time we execute a line of code that contains a function\
