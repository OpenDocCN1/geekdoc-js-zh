    john.surname = 'Lennon';\njohn.address.city = 'Malibu';\n```\n\n*Which* objects\
    \ are being mutated here?\n\nThe first line mutates the object `john` points to.\
    \ This makes sense: we *mean* to change John’s surname. That object represents\
