  md: "```\nfunction Donut() {\n  return { shape: 'round' };\n}\nDonut.prototype =\
    \ {\n  eat() {\n    console.log('Nom nom nom');\n  }\n};\n\nlet donut1 = new Donut();\
    \ // __proto__: Donut.prototype\nlet donut2 = new Donut(); // __proto__: Donut.prototype\n\
    \ndonut1.eat();\ndonut2.eat();\n```\n\nNow this pattern has mostly fallen into\
    \ obscurity, but you can still see **prototype** property on the built-in functions\
    \ and even on classes. To conclude, a function's **prototype** specifies the `__proto__`\
    \ of the objects created by calling that function with a **new** keyword.\n\n\
    # Why Does This Matter?\n\nIn practice, you probably won't use prototypes in your\
    \ code directly. (In fact, even using the `__proto__` syntax is [discouraged](https://example.com/discouraged).)\n\
    \nPrototypes are unusual—most frameworks never embraced them as a paradigm. Still,\
    \ you will notice prototypes hiding “beneath the surface” of other JavaScript\
    \ features. For example, people often use prototypes to create a traditional “class\
    \ inheritance” model that’s popular in other programming languages.\n\nThis became\
    \ so common that JavaScript added a class syntax as a convention that “hides”\
    \ prototypes out of sight. To see it in action, look at this [snippet](https://example.com/snippet)\
    \ of a JavaScript class rewritten with `__proto__` for a comparison.\n\nPersonally,\
    \ I don't use a lot of classes in my daily coding, and I rarely deal with prototypes\
    \ directly either. However, it helps to know how those features build on each\
    \ other, and it's important to know what happens when I read or set a property\
    \ on an object."
