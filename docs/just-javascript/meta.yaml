    \n- Undefined\n- Null\n- Booleans\n- Numbers\n- BigInts\n- Strings\n- Symbols\n\
    \nThen, there are the special types below, which let us *make our own values*:\n\
    \n- Objects\n- Functions\n\nIt was fun to visit the different \"celestial spheres\"\
    \ of JavaScript. Now that we've introduced ourselves to all the values, we've\
