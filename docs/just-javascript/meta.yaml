    We haven''t talked about properties in detail yet, so your mental model about
    them might be fuzzy. We will return to properties in a future module.


    # Making Our Own Objects


    There is one thing in particular that makes objects exciting and unique. **We
    can make more of them! We can populate our JavaScript universe with our own objects.**


    In our mental model, all of the primitive values we''ve discussed— null , undefined
    , booleans, numbers, and strings—have “always existed.” We can''t create a new
    string or a new number, we can only “summon” that value:


    ```

    let sisters = 3;

    let musketeers = 3;

    ```


    ![](img/5f506681f0d75d6067480d5c0ee322f2_56_0.png)


    What makes objects different is that we *can* create more of them. **Every time
    we use the `{}` object literal, we *create* a brand new object value:**


    ```

    let shrek = {};

    let donkey = {};

    ```'
  - '[PAGE 57]


    ![](img/5f506681f0d75d6067480d5c0ee322f2_57_0.png)


    The same goes for arrays, dates, and any other objects. For example, the `[]`
    array literal *creates* a new array value—a value that never existed before.


    # Do Objects Disappear?


    You might wonder: do objects ever disappear, or do they hang around forever? JavaScript
    is designed in a way that we can’t tell one way or the other from inside our code.
    For example, we can’t *destroy* an object:


    ```

    let junk = {};

    junk = null; // Doesn''t necessarily destroy an object

    ```


    Instead, JavaScript is a garbage-collected language.


    This means that although we can’t destroy an object, it *might* eventually “disappear”
    if there is no way to reach it by following the wires from our code.


    ![](img/5f506681f0d75d6067480d5c0ee322f2_57_1.png)'
