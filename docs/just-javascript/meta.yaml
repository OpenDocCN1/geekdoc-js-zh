    \ We pass the current value of the `pet` variable. How does this work?\n\nIt turns\
    \ out that a variable name like `pet` can serve as an expression too! When we\
    \ write `pet`, we're asking JavaScript a question: \"What is the current value\
    \ of `pet`?\" To answer our question, JavaScript follows `pet` \"wire,\" and gives\
    \ us back the value at the end of this \"wire.\"\n\nSo the same expression can\
    \ give us different values at different times!\n\n# Nitpicking\n\nWho cares if\
    \ you say \"pass a variable\" or \"pass a value\"? Isn't the difference hopelessly\
    \ pedantic? I certainly don't encourage interrupting your colleagues to correct\
