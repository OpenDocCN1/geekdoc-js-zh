    # Strings Aren’t Objects


    All strings have a few built-in properties.


    ```

    let cat = ''Cheshire'';

    console.log(cat.length); // 8

    console.log(cat[0]); // "C"

    console.log(cat[1]); // "h"

    ```


    This doesn’t mean that strings are objects! String properties are special and
    don’t behave the way object properties do. For example, you can’t assign anything
    to `cat[0]` . Strings are primitives, and all primitives are immutable.


    # A Value for Every Conceivable String


    **In our universe, there is a distinct value for every conceivable string.** Yes,
    this includes your grandmother’s maiden name, the fanfic you published ten years
    ago under an alias, and the script of Matrix 5 which hasn’t been written yet.


    Of course, all possible strings can’t literally fit inside a computer memory chip.
    But *the idea* of every possible string can fit inside your head. Our JavaScript
    universe is a model for humans, not for computers!


    This might prompt a question. Does this code *create* a string?


    ```

    // Try it in your console

    let answer = prompt(''Enter your name'');

    console.log(answer); // ?

    ```


    Or does it merely *summon* a string that already exists in our universe?


    The answer to this question depends on whether we’re studying JavaScript “from
    the outside” or “from the inside.”'
