    **If you don’t have a clear mental model of equality in JavaScript, every day
    is like a carnival—and not in a good way.** You’re never quite sure if you’re
    dealing with the same value, or with two different values. As a result, you’ll
    often make mistakes—like changing a value you didn’t intend to change.


    Luckily, we’ve already done most of the work to establish the concept of equality
    in JavaScript. It fits into our mental model in a very natural way.


    # Kinds of Equality


    In JavaScript, there are several kinds of equality. If you’ve been writing JavaScript
    for a while, you’re probably familiar with at least two of them:


    +   - **Strict Equality:** `a === b` (triple equals).

    - **Loose Equality:** `a == b` (double equals).

    - **Same Value Equality:** `Object.is(a, b)`.


    Most tutorials don’t mention *same value equality* at all. We’ll take a road less
    traveled, and explain it first. We can then use it to explain the other kinds
    of equality.


    # Same Value Equality: `Object.is(a, b)`'
