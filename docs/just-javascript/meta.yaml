  md: 'Now that you know a bug exists, will you read the code differently? If you
    used the “fast” thinking system at first, you might switch to the more laborious
    “slow” system when you realize there''s a bug in the code.


    When we use the “fast” system, we guess what the code does based on its overall
    structure, naming conventions and comments. Using the “slow” system, we retrace
    what the code does step by step—a tiring and time-consuming process.


    This is why having an accurate mental model is so important. Simulating a computer
    in your head is hard, and when you have to fall back to the “slow” thinking system,
    your mental model is all you can rely on. With the wrong mental model, you’ll
    fundamentally misunderstand what to expect from your code, and all your effort
    will be wasted.


    Don’t worry if you can’t find the bug at all—it just means you’ll get the most
    out of this course! Over the next modules, we’ll rebuild our mental model of JavaScript
    together, so that you can catch bugs like this immediately.


    In the next module, we’ll start building mental models for some of the most fundamental
