    # Reading a Property


    We can read a property''s current value by using the "dot notation":


    ```

    console.log(sherlock.age); // 64

    ```


    Here, `sherlock.age` is our old friend, an expression—a question to our JavaScript
    universe. To answer it, JavaScript first follows the `sherlock` wire:


    ![](img/5f506681f0d75d6067480d5c0ee322f2_85_0.png)


    ![](img/5f506681f0d75d6067480d5c0ee322f2_85_1.png)


    It leads to an object. From that object, JavaScript follows the `age` property.


    Our object''s `age` property points to `64`, so `sherlock.age` results in `64`.


    # Property Names


    One important thing to keep in mind when naming a property is that a single object
    can''t have two properties with the same name. For example, our object can''t
    have two properties called `age`.


    Property names are also always case-sensitive! For example, `age` and `Age` would
    be two completely different properties from JavaScript''s point of view.'
