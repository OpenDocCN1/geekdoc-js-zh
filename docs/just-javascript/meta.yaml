    \ countDwarves()` means \"Point `dwarves` to the value **returned by** the function\
    \ that `countDwarves` is currently pointing to.\"\n\nIn fact, `countDwarves()`\
    \ is also an expression. It's known as a *call expression*. To \"answer\" a call\
    \ expression, JavaScript runs the code inside our function, and hands us the returned\
    \ value as the result (in this example, it's `7`).\n\n## Recap\n\nThat was quite\
