  md: 'As your mental model becomes more complete, you will find it easier to debug
    problems because you will know what possible causes to look for.


    For example, if you know that `sherlock.address.city` has changed after running
    some code, the wires from our diagram suggest three explanations:


    +   1. Maybe the `sherlock` variable was reassigned.

    2. Maybe the object we could reach via `sherlock` was mutated, and its `address`
    property was set to something different.

    3. Maybe the object we could reach via `sherlock.address` was mutated, and its
    `city` property was set to something different.


    Your mental model gives you a starting point from which you can investigate bugs.
    **This works the other way around too.** Sometimes, you can tell a piece of code
    is *not* the source of a problem—because the mental model proves it!


    Say, if we point the `john` variable to a different object, we can be fairly sure
    that `sherlock.address.city` won''t change. Our diagram shows that changing the
    `john` wire doesn''t affect any wires coming from `sherlock`:


    Still, keep in mind that unless you''re Sherlock Holmes, you can rarely be *fully*
    confident in something. This approach is [only as good as](https://www.jamesforgety.com/2013/01/28/only-as-good-as-your-mental-model/)
    your mental model! Mental models will help you come up with theories, but you
    need to confirm them with `console.log` or a debugger.


    # Let vs. Const


    It is worth noting you can use the `const` keyword as an alternative to `let`:


    ```

    const shrek = { species: ''ogre'' };

    ```'
