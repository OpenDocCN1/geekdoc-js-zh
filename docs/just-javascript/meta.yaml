  md: 'from math. These analogies might overlap and even contradict each other, but
    they still help you make sense of what’s happening in the code.


    For example, many people first learned about variables as “boxes”—containers that
    hold your stuff. Even if you don’t vividly imagine boxes anymore when you see
    a variable, they might still behave “boxily” in your imagination.


    These approximations of how something works in your head are known as “mental
    models.” It may be hard if you’ve been programming for a long time, but try to
    notice and introspect your mental models. They’re probably a combination of visual,
    spatial, and mechanical mental shortcuts. These intuitions (like “boxiness” of
    variables) influence how we read code our whole lives.


    Unfortunately, sometimes our mental models are wrong. Maybe a tutorial we read
    early on sacrificed accuracy in order to make a concept easier to explain. Maybe,
    when we started learning JavaScript, we incorrectly “brought over” an expected
    behavior from a language we learned earlier. Maybe we inferred a mental model
    from some piece of code but never really verified it was accurate.


    Identifying and fixing these problems is what *Just JavaScript* is all about.
    We will gradually build (or possibly rebuild) your mental model of JavaScript
    to be accurate and useful. A good mental model will give you confidence in your
    own code, and it will let you understand (and fix) code that someone else wrote.


    (By the way, `a` being `0` and `b` being `10` is the correct answer.)


    # Coding, Fast and Slow


    “Thinking, Fast and Slow” is a book by Daniel Kahneman that explores the two different
    “systems” humans use when thinking.


    Whenever we can, we rely on the “fast” system, which is good at pattern matching
    and “gut reactions.” We share this system (which is necessary for survival!) with'
