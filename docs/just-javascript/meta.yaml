    \ is `false` because `cherry` and `chocolate` point to different values.\n3. `Object.is(chocolate,\
    \ banana)` is `true` because `chocolate` and `banana` point to the same value.\n\
    \nAs you can see, we didn't need any additional concepts to explain how **same\
