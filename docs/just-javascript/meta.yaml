    Out of these special numbers, `NaN` is particularly interesting. `NaN`, which
    is the result of `0 / 0` and some other invalid math, stands for "not a number."


    You might be confused by why it claims to be a number:


    ```

    console.log(typeof(NaN)); // "number"

    ```


    However, there is no trick here. From a JavaScript perspective, `NaN` *is* a numeric
    value. It is not null, undefined, a string, or some other type. But in the floating-point
    math, the *name* for that term is ["not a number"](# "not a number"). So it *is*
    a numeric value. It happens to be called "not a number" because it represents
    an invalid result.


    It''s uncommon to write code using these special numbers. However, they might
    come up due to a coding mistake. So it''s good to know they exist.


    # BigInts


    If numbers expanded our JavaScript universe, the next stop on our tour, BigInts,
    will really keep us busy exploring. In fact, we could explore them forever!


    Regular numbers can''t represent large integers with precision, so BigInts [fill
    that gap](# "fill that gap") (literally). How many BigInts are there in our universe?
    The specification says they have *arbitrary precision*. This means that **in our
    JavaScript universe, there is an infinite number of BigInts—one for each integer
    in math.**


    If this sounds strange, consider that you''re already comfortable with the idea
    of there being infinite integers in math. (If you''re not, give it a few moments!)
    It''s not much of a leap then from a "math universe" to a "JavaScript universe."


    (And from there, we can go straight to the [Pepsi Universe](https://www.youtube.com/watch?v=dQw4w9WgXcQ).)


    You can see the idea of arbitrary precision illustrated here:


    ```

    let alot = 9007199254740991n; // n at the end makes it a BigInt!

    console.log(alot + 1n); // 9007199254740992n

    console.log(alot + 2n); // 9007199254740993n

    console.log(alot + 3n); // 9007199254740994n

    console.log(alot + 4n); // 9007199254740995n

    console.log(alot + 5n); // 9007199254740996n

    ```


    No funny business with the rounding! BigInts are great for financial calculations
    where precision is especially important.


    But keep in mind that nothing is free. Operations with *truly* huge numbers may
    take time and resources—we can’t fit all the possible BigInts inside the computer
    memory. If we tried, at some point it would crash or freeze. But conceptually,
    we could tour our JavaScript universe for eternity and never reach every single
    BigInt.


    BigInts were only recently added to JavaScript, so you won’t see them used widely
    yet and if you use an older browser, they won’t work.


    # Strings


    Our next tour stop is Strings, which represent text in JavaScript. There are three
    ways to write strings (single quotes, double quotes, and backticks), but they
    refer to the same concept. These three string literals result in the same string
    value:


    ```

    console.log(typeof("こんにちは")); // "string"

    console.log(typeof(''こんにちは'')); // "string"

    console.log(typeof(`こんにちは`)); // "string"

    ```


    An empty string is a string, too:


    ```

    console.log(typeof('''')); // "string"

    ```


    # Strings Aren’t Objects


    All strings have a few built-in properties.


    ```

    let cat = ''Cheshire'';

    console.log(cat.length); // 8

    console.log(cat[0]); // "C"

    console.log(cat[1]); // "h"

    ```


    This doesn’t mean that strings are objects! String properties are special and
    don’t behave the way object properties do. For example, you can’t assign anything
    to `cat[0]` . Strings are primitives, and all primitives are immutable.


    # A Value for Every Conceivable String


    **In our universe, there is a distinct value for every conceivable string.** Yes,
    this includes your grandmother’s maiden name, the fanfic you published ten years
    ago under an alias, and the script of Matrix 5 which hasn’t been written yet.


    Of course, all possible strings can’t literally fit inside a computer memory chip.
    But *the idea* of every possible string can fit inside your head. Our JavaScript
    universe is a model for humans, not for computers!


    This might prompt a question. Does this code *create* a string?


    ```

    // Try it in your console

    let answer = prompt(''Enter your name'');

    console.log(answer); // ?

    ```


    Or does it merely *summon* a string that already exists in our universe?


    The answer to this question depends on whether we’re studying JavaScript “from
    the outside” or “from the inside.”


    *Outside* our mental model, the answer depends on a specific implementation. Whether
    a string is represented as a single block of memory, multiple blocks, or a special
    data structure like [a rope](https://en.wikipedia.org/wiki/Rope_(data_structure)),
    is up to the JavaScript engine.


    But as we discussed in [Studying from the Inside](https://www.raresnaps.com/posts/js-internals/2020-12-21-studying-from-the-inside/),
    we have agreed to talk about the JavaScript universe as if we lived inside of
    it. We won’t make statements about it that we can’t verify from inside the universe—by
    running some code.


    The question of whether a string already “exists” or is “created” is not something
    we can test from the code. *Inside* our mental model, this question doesn’t mean
    anything. We can’t set up an experiment to say whether strings “get created” or
    “get summoned” within our JavaScript universe.


    To keep our mental model simple, we will say that **all conceivable string values
    already exist from the beginning—one value for every distinct string**.


    # Symbols


    We’ve already explored quite a bit of our JavaScript universe, but there is just
    one more (quick) stop on the first part of our tour: Symbols.


    ```

    let alohomora = Symbol();

    console.log(typeof(alohomora)); // "symbol"

    ```


    It’s important to know that Symbols exist, but it’s hard to explain their role
    and behavior without diving deeper into objects and properties. Symbols serve
    a similar purpose to door keys: they let you hide away some information inside
    an object and control which parts of the code can access it. They are also relatively
    rare, so in this tour of our universe, we’re going to skip them. Sorry, symbols!


