    # # Equality of Values


    It’s time to talk about equality in JavaScript! Here’s why it matters.


    Imagine attending a masked carnival with only a few types of masks to choose from.
    Groups of people with the exact same outfit would be joking, dancing, and moving
    around the room. It would be confusing! You might talk to two people, and not
    realize that you really talked to the same person twice. Or you might *think*
    you talked to one person when, in reality, you talked to two different people!'
