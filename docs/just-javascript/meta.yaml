    ```

    console.log(2 === 2); // true

    console.log({} === {}); // false

    ```


    There is also a corresponding opposite `!==` operator.


    # Same Value Equality vs. Strict Equality


    So what''s the difference between `Object.is` and `===`?


    **Same value equality**— `Object.is(a, b)` —has a direct meaning in our mental
    model. It corresponds to the idea of "the same value" in our universe.


    In almost all cases, the same intuition works for **strict value equality**. For
    example, `2 === 2` is `true` because `2` always "summons" the same value:'
  - '[PAGE 73]


    ```

    console.log( 2 === 2 )

    ```


    Conversely, `{} === {}` is `false` because each `{}` *creates* a different value:


    ```

    console.log( {} === {} )

    ```'
  - '[PAGE 74]


    ![](img/5f506681f0d75d6067480d5c0ee322f2_74_0.png)


    In the above examples, `a === b` behaves the same way as `Object.is(a, b)` . However,
    there are **two rare cases** where the behavior of `===` is different.


    Remember memorizing irregular verbs when you were learning English? The cases
    below are similar—**consider them as exceptions to the rule**.


    Both of these unusual cases involve "special numbers" we discussed in the past:


    +   1. `NaN === NaN` is `false` , although they are the same value.

    2. `-0 === 0` and `0 === -0` are `true` , although they are different values.


    These cases are uncommon, but we''ll still take a closer look at them.


    # **First Special Case:** `NaN`


    As we saw in our celestial tour of values, `NaN` is a special number that shows
    up when we do invalid math like `0 / 0` :


    ```

    let width = 0 / 0; // NaN

    ```


    Further calculations with `NaN` will give you `NaN` again:


    ```

    let height = width * 2; // NaN

    ```


    You probably won''t do this intentionally, but it can happen if there is a flaw
    in your data or calculations.


    **Remember that** `NaN === NaN` **is always** `false` **:**


    ```

    console.log(width === height); // false

    ```


    However, `NaN` is the *same* value as `NaN` :'
  - "[PAGE 75]\n\n```\nconsole.log(Object.is(width, height)); // true\n```\n\nThat’s\
    \ confusing.\n\nThe reason for `NaN === NaN` being `false` is largely historical,\
    \ so I suggest accepting it as a fact of life. You might run into this if you\
    \ try to write some code that checks a value for being `NaN` (for example, to\
    \ print a warning).\n\n```\nfunction resizeImage(size) {\n  if (size === NaN)\
    \ {\n    // This will never get logged: the check is always false!\n    console.log('Something\
    \ is wrong.');\n  }\n  // ...\n}\n```\n\nInstead, here are a few ways (they all\
    \ work!) to check if `size` is `NaN`:\n\n+   - `Number.isNaN(size)`\n- `Object.is(size,\
    \ NaN)`\n- `size !== size`\n\nThe last one might be particularly surprising. Give\
    \ it a few moments. If you don’t see how it detects `NaN`, try re-reading this\
    \ section and thinking about it again.\n\n> Answer\nDon’t reveal until you figured\
    \ out the answer or gave it a few minutes.\nalready learned. So the reverse (`NaN\
    \ !== NaN`) must be `true`.\nSince `NaN` is the only value that does not Equal\
    \ to itself, `size !== size` can only mean that `size` is `NaN`."
- md: "## Fun Fact\nA quick historical anecdote: ensuring developers could detect\
    \ `NaN` this way was one of the original reasons for making `NaN === NaN` return\
    \ `false`! This was decided before JavaScript even existed.\n\n## Second Special\
    \ Case: `-0`\n\nIn regular math, there is no such concept as “minus zero,” but\
    \ it exists in floating-point math for practical reasons. Here’s an interesting\
    \ fact about it.\n\nBoth `0 === -0` and `-0 === 0` are always `true`:\n\n```javascript\n\
    let width = 0; // 0\nlet height = -width; // -0\nconsole.log(width === height);\
    \ // true\n```\n\nHowever, `0` is a *different* value from `-0`:\n\n```javascript\n\
    console.log(Object.is(width, height)); // false\n```\n\n*That’s confusing too.*\n\
    \nIn practice, I haven’t run into a case where this matters in my entire career.\n\
    \n## Coding Exercise\n\nNow that you know how `Object.is` and `===` work, I have\
    \ a small coding exercise for you. You don’t have to complete it, but it’s a fun\
    \ brainteaser.\n\nWrite a function called `strictEquals(a, b)` that returns the\
    \ same value as `a === b`. Your implementation must not use the `===` or `!==`\
    \ operators.\n\nHere is [my answer](my_answer) if you want to check yourself.\
    \ This function is utterly useless, but writing it helps make sense of `===`.\n\
    \n## Don’t Panic\n\nHearing about these special numbers and how they behave can\
    \ be overwhelming. Don’t stress too much about these special cases!\n\nThey’re\
    \ not very common. Now that you know they exist, you will recognize them in practice.\
    \ In most cases, we can trust our “equality intuition” for both `Object.is(a,\
    \ b)` and `a === b`.\n\n## Loose Equality\n\nFinally, we get to the last kind\
    \ of equality.\n\nLoose equality (double equals) is the bogeyman of JavaScript.\
    \ Here are a couple of examples to make your skin crawl:\n\n```javascript\nconsole.log([[]]\
    \ == ''); // true\nconsole.log(true == [1]); // true\nconsole.log(false == [0]);\
    \ // true\n```\n\nWait, what?!\n\nThe rules of loose equality (also called “abstract\
    \ equality”) are arcane and confusing. Many coding standards prohibit the use\
    \ of `==` and `!=` in code altogether.\n\nAlthough Just JavaScript doesn’t take\
    \ strong opinions on what features you should or shouldn’t use, we’re not going\
    \ to cover loose equality in much detail. It’s uncommon in modern codebases, and\
    \ its rules don’t play a larger role in the language—or in our mental model.\n\
    \n### Fun Fact\nThe rules of loose equality are widely acknowledged as an early\
    \ bad design decision of JavaScript, but if you are still curious, you can check\
    \ out [how it works here](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Equality).\
    \ Don’t feel pressured to memorize it—you’ll need that memory for other topics!\n\
    \nThe one relatively common use case worth knowing is:\n\n```javascript\nif (x\
    \ == null) {\n  // ...\n}\n```\n\nThis code is equivalent to writing:\n\n```javascript\n\
    if (x === null || x === undefined) {\n  // ...\n}\n```\n\nHowever, even that usage\
    \ of `==` might be controversial on some teams. It’s best to discuss how much\
    \ `==` is tolerated in your codebase as a team before using it.\n\n## Recap\n\n\
    - JavaScript has several kinds of equality. They include **same value equality**,\
    \ **strict equality**, and **loose equality**.\n- **Same value equality**, or\
    \ `Object.is(a, b)`, matches the concept of the *sameness of values* that we introduced\
    \ in the previous module.\n- Understanding this kind of equality helps prevent\
    \ bugs! You will often need to know when you’re dealing with the same value, and\
    \ when you’re dealing with two different values.\n- When we draw a diagram of\
    \ values and variables, the *same value* cannot appear twice. `Object.is(a, b)`\
    \ is `true` when variables `a` and `b` point to the same value on our diagram.\n\
    - **Same value equality** is verbose and a bit annoying to write, but it's also\
    \ the easiest to explain, which is why we started with it.\n- In practice, you\
    \ will use **strict equality**, or `a === b`, most often. It is equivalent to\
    \ the **same value equality** except for two rare special cases:\n    - `NaN ===\
    \ NaN` is `false`, even though they are the same value.\n    - `0 === -0` and\
    \ `-0 === 0` is `true`, but they are different values.\n- You can check whether\
    \ `x` is `NaN` using `Number.isNaN(x)`.\n- **Loose equality** (`==`) uses a set\
    \ of arcane rules and is often avoided.\n\n## Exercises\n\nThis module also has\
    \ exercises for you to practice!\n\n**Don’t skip them!**\n\nEven though you’re\
    \ likely familiar with the concept of equality, these exercises will help you\
    \ cement the mental model we’re building. We need this foundation before we can\
    \ get to more complex topics.\n\n## Finished reading?\n\nMark this episode as\
    \ learned to track your progress.\n\nMark as learned\n\nUP NEXT\n\n## Take a Quiz\
    \ →\n\n## 08 Properties\n\nMeet Sherlock Holmes, a world-renowned detective from\
    \ London:\n\n```javascript\nlet sherlock = {\n    surname: 'Holmes',\n    address:\
    \ { city: 'London' }\n};\n```\n\nHis friend, John Watson, recently moved in:\n\
    \n```javascript\nlet john = {\n    surname: 'Watson',\n    address: sherlock.address\n\
    };\n```\n\nSherlock is a brilliant detective, but a difficult flatmate. One day,\
    \ John decides he’s had enough—he changes his surname and moves to Malibu:\n\n\
    ```javascript\njohn.surname = 'Lennon';\njohn.address.city = 'Malibu';\n```\n\n\
    Time for a small exercise. **Write down your answers to these questions:**\n\n\
    ```javascript\nconsole.log(sherlock.surname); // ?\nconsole.log(sherlock.address.city);\
    \ // ?\nconsole.log(john.surname); // ?\nconsole.log(john.address.city); // ?\n\
    ```\n\nBefore re-reading the code, I want you to approach these questions in a\
    \ particular way. Use a sketchpad or get paper and a pen, and **sketch out your\
    \ mental model of what happens on every line**. It’s okay if you’re not sure *how*\
    \ to represent it. We haven’t yet discussed these topics, so use your best guess.\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_82_0.png)\n\nThen, with the help of\
    \ your final sketch, answer the four questions above.\n\n## Answer\n\nNow don't\
    \ reveal until you have written the answers to four questions.\n\nThis is not\
    \ a typo—they are the final address. It's not so easy to get away from Sherlock!\
    \ With an inaccurate mental model, one might conclude that `sherlock.address.city`\
    \ is \"London\" —but it's not.\n\nTo see why, we need to learn how properties\
    \ work in our JavaScript universe.\n\n## Properties\n\nWe've talked about objects\
    \ before. For example, here is a `sherlock` variable pointing to an object value.\
    \ We create a new object value by writing `{}` :\n\n```javascript\nlet sherlock\
    \ = {};\n```\n\nIn our universe, it might look like this:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_84_0.png)\n\
    \nHowever, objects are primarily useful to *group* related data together. For\
    \ example, we might want to group different facts about Sherlock:\n\n```javascript\n\
    let sherlock = {\n  surname: 'Holmes',\n  age: 64,\n};\n```\n\nHere, `sherlock`\
    \ is still a variable, but `surname` and `age` are not. They are *properties*.\
    \ Unlike variables, properties *belong* to a particular object.\n\n**In our JavaScript\
    \ universe, both variables and properties act like “wires.”**\nHowever, the wires\
    \ of properties *start from* *objects* rather than from our code:\n\nHere, we\
    \ can see that the `sherlock` **variable** points to an object we have created.\
    \ That object has two **properties**. Its `surname` property points to the `\"\
    Holmes\"` string value, and its `age` property points to the `64` number value.\n\
    \nImportantly, properties don't *contain* values—they *point* to them! Remember\
    \ that our universe is full of wires. Some of them start from our code (variables),\
    \ and others start from objects (properties). All wires always point to values.\n\
    \nBefore reading this, you might have imagined that values live “inside” objects\
    \ because they appear “inside” in code. This intuition often leads to mistakes,\
    \ so we will be “thinking in wires” instead. Take one more look at the code and\
    \ the diagram. Make sure you’re comfortable with them before you continue.\n\n\
    ## Reading a Property\n\nWe can read a property's current value by using the \"\
    dot notation\":\n\n```javascript\nconsole.log(sherlock.age); // 64\n```\n\nHere,\
    \ `sherlock.age` is our old friend, an expression—a question to our JavaScript\
    \ universe. To answer it, JavaScript first follows the `sherlock` wire:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_85_0.png)\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_85_1.png)\n\nIt leads to an object.\
    \ From that object, JavaScript follows the `age` property.\n\nOur object's `age`\
    \ property points to `64`, so `sherlock.age` results in `64`.\n\n## Property Names\n\
    \nOne important thing to keep in mind when naming a property is that a single\
    \ object can't have two properties with the same name. For example, our object\
    \ can't have two properties called `age`.\n\nProperty names are also always case-sensitive!\
    \ For example, `age` and `Age` would be two completely different properties from\
    \ JavaScript's point of view."
  mdcn: "\n## 有趣的事实\n一个简短的历史轶事：确保开发者能用这种方式检测 `NaN`，正是最初让 `NaN === NaN` 返回 `false`\
    \ 的原因之一！这个决定甚至是在 JavaScript 诞生之前做出的。\n\n## 第二个特殊情况：`-0`\n\n在常规数学中，不存在“负零”的概念，但在浮点数数学中，出于实际原因，它确实存在。这里有一个关于它的有趣事实。\n\
    \n`0 === -0` 和 `-0 === 0` 的结果总是 `true`：\n\n```javascript\nlet width = 0; // 0\n\
    let height = -width; // -0\nconsole.log(width === height); // true\n```\n\n然而，`0`\
    \ 和 `-0` 是*不同*的值：\n\n```javascript\nconsole.log(Object.is(width, height)); //\
    \ false\n```\n\n*这也挺令人困惑的。*\n\n实际上，在我整个职业生涯中，还没遇到过需要关心这种情况的案例。\n\n## 编码练习\n\n\
    现在你知道了 `Object.is` 和 `===` 的工作原理，我给你准备了一个小的编码练习。你不一定要完成它，但这是一个有趣的脑筋急转弯。\n\n编写一个名为\
    \ `strictEquals(a, b)` 的函数，使其返回值与 `a === b` 相同。你的实现**不能**使用 `===` 或 `!==` 运算符。\n\
    \n如果你想核对答案，这里是我的[参考答案](my_answer)。这个函数完全没用，但编写它有助于理解 `===` 的本质。\n\n## 别慌\n\n听到这些特殊数字以及它们的行为方式可能会让人不知所措。不要对这些特殊情况过度担忧！\n\
    \n它们并不常见。既然你知道了它们的存在，将来在实践中就能认出它们。在大多数情况下，对于 `Object.is(a, b)` 和 `a === b`，我们都可以相信我们的“相等直觉”。\n\
    \n## 宽松相等\n\n最后，我们来看看最后一种相等性。\n\n宽松相等（双等号）是 JavaScript 的“梦魇”。这里有几个让你“头皮发麻”的例子：\n\
    \n```javascript\nconsole.log([[]] == ''); // true\nconsole.log(true == [1]); //\
    \ true\nconsole.log(false == [0]); // true\n```\n\n等等，什么？！\n\n宽松相等（也称为“抽象相等”）的规则深奥难懂。许多编码规范完全禁止在代码中使用\
    \ `==` 和 `!=`。\n\n尽管《Just JavaScript》对你应该或不应该使用哪些功能不持强烈立场，但我们不会详细讨论宽松相等。它在现代代码库中不常见，并且其规则在语言中——或在我们的思维模型中——并不扮演重要角色。\n\
    \n### 有趣的事实\n宽松相等的规则被广泛认为是 JavaScript 早期一个糟糕的设计决策，但如果你仍然好奇，可以查看[这里的工作原理](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Equality)。别有压力去记住它——你需要把记忆力用在其他主题上！\n\
    \n一个相对常见且值得了解的用法是：\n\n```javascript\nif (x == null) {\n  // ...\n}\n```\n\n这段代码等同于：\n\
    \n```javascript\nif (x === null || x === undefined) {\n  // ...\n}\n```\n\n然而，即使是\
    \ `==` 的这种用法，在某些团队中也可能引起争议。在使用之前，最好与团队讨论一下在你们的代码库中 `==` 的可接受程度。\n\n## 总结\n\n-\
    \ JavaScript 有几种相等性。它们包括**同值相等**、**严格相等**和**宽松相等**。\n- **同值相等**，即 `Object.is(a,\
    \ b)`，与我们在上一模块中介绍的*值的同一性*概念相匹配。\n- 理解这种相等性有助于预防错误！你通常需要知道你是在处理同一个值，还是两个不同的值。\n\
    - 当我们绘制值和变量的示意图时，*同一个值*不能出现两次。当变量 `a` 和 `b` 在示意图上指向同一个值时，`Object.is(a, b)` 的结果是\
    \ `true`。\n- **同值相等**写起来冗长且有点烦人，但它也最容易解释，这就是我们从它开始的原因。\n- 实践中，你会最常使用**严格相等**，即\
    \ `a === b`。除了两个罕见的特殊情况，它等同于**同值相等**：\n    - `NaN === NaN` 是 `false`，即使它们是同一个值。\n\
    \    - `0 === -0` 和 `-0 === 0` 是 `true`，但它们是不同的值。\n- 你可以使用 `Number.isNaN(x)` 来检查\
    \ `x` 是否是 `NaN`。\n- **宽松相等** (`==`) 使用一套深奥的规则，通常被避免使用。\n\n## 练习\n\n本模块也有练习题让你实践！\n\
    \n**别跳过它们！**\n\n即使你可能已经熟悉相等性的概念，这些练习将帮助你巩固我们正在构建的思维模型。在进入更复杂的主题之前，我们需要这个基础。\n\n\
    ## 阅读完毕？\n\n将此章节标记为已学习以跟踪进度。\n\n标记为已学\n\n接下来\n\n## 测验 →\n\n## 08 属性\n\n认识一下夏洛克·福尔摩斯，一位来自伦敦的世界著名侦探：\n\
    \n```javascript\nlet sherlock = {\n    surname: 'Holmes',\n    address: { city:\
    \ 'London' }\n};\n```\n\n他的朋友，约翰·华生，最近搬了进来：\n\n```javascript\nlet john = {\n \
    \   surname: 'Watson',\n    address: sherlock.address\n};\n```\n\n夏洛克是位才华横溢的侦探，但也是个难相处的室友。一天，约翰决定受够了——他改了姓并搬到了马里布：\n\
    \n```javascript\njohn.surname = 'Lennon';\njohn.address.city = 'Malibu';\n```\n\
    \n来个小练习。**写下你对这些问题的答案：**\n\n```javascript\nconsole.log(sherlock.surname); // ?\n\
    console.log(sherlock.address.city); // ?\nconsole.log(john.surname); // ?\nconsole.log(john.address.city);\
    \ // ?\n```\n\n在重新阅读代码之前，我希望你用一种特定的方式来处理这些问题。拿个草稿本或者纸笔，**画出你心中每一行代码执行过程的心理模型**。如果你不确定*如何*表示它也没关系。我们还没讨论过这些话题，所以尽你所能猜测一下。\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_82_0.png)\n\n然后，在你最终草图的帮助下，回答上面的四个问题。\n\
    \n## 答案\n\n现在，在你写出四个问题的答案之前，先不要看这里。\n\n这不是笔误——它们就是最终的地址。想要摆脱夏洛克可没那么容易！如果心理模型不准确，可能会有人得出结论认为\
    \ `sherlock.address.city` 是 \"London\"——但事实并非如此。\n\n要理解为什么，我们需要学习在我们的 JavaScript\
    \ 宇宙中，属性是如何工作的。\n\n## 属性\n\n我们之前讨论过对象。例如，这里有一个 `sherlock` 变量指向一个对象值。我们可以通过写 `{}`\
    \ 来创建一个新的对象值：\n\n```javascript\nlet sherlock = {};\n```\n\n在我们的宇宙中，它可能看起来像这样：\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_84_0.png)\n\n然而，对象主要用于将相关数据*分组*在一起。例如，我们可能想将关于夏洛克的不同事实分组：\n\
    \n```javascript\nlet sherlock = {\n  surname: 'Holmes',\n  age: 64,\n};\n```\n\
    \n这里，`sherlock` 仍然是一个变量，但 `surname` 和 `age` 不是。它们是*属性*。与变量不同，属性*属于*特定的对象。\n\n\
    **在我们的 JavaScript 宇宙中，变量和属性都像“导线”。**\n然而，属性的导线*起始于* *对象*，而不是我们的代码：\n\n这里，我们可以看到\
    \ `sherlock` **变量**指向我们创建的一个对象。该对象有两个**属性**。它的 `surname` 属性指向字符串值 `\"Holmes\"\
    `，它的 `age` 属性指向数字值 `64`。\n\n重要的是，属性不*包含*值——它们*指向*值！记住我们的宇宙充满了导线。有些从我们的代码（变量）开始，有些从对象（属性）开始。所有的导线总是指向值。\n\
    \n在阅读本文之前，你可能想象值是“存储”在对象“内部”的，因为它们在代码中出现在“内部”。这种直觉常常导致错误，所以我们将改为“用导线思考”。再看一遍代码和示意图。在继续之前，确保你理解了它们。\n\
    \n## 读取属性\n\n我们可以使用“点号表示法”来读取属性的当前值：\n\n```javascript\nconsole.log(sherlock.age);\
    \ // 64\n```\n\n这里，`sherlock.age` 是我们的老朋友，一个表达式——向我们的 JavaScript 宇宙提出的一个问题。为了回答它，JavaScript\
    \ 首先沿着 `sherlock` 导线：\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_85_0.png)\n\n\
    ![](img/5f506681f0d75d6067480d5c0ee322f2_85_1.png)\n\n它指向一个对象。从该对象出发，JavaScript\
