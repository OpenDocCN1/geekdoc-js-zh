    # Mutation


    *Mutation* is a fancy way of saying “change.”


    **For example, we could say that we *changed* an object’s property, or we could
    say that we *mutated* that object (and its property). This is the same thing.**


    People like to say “mutate” because this word has a sinister undertone. It reminds
    you to exercise extra caution. This doesn’t mean mutation is “bad”—it’s just programming!—but
    you need to be very intentional about it.


    Let’s recall our original task. We wanted to give John a different surname, and
