    console.log(pet); // "The Kraken"

    ```


    We know that string values can’t change because they are primitive. But the `pet`
    variable *does* change to `"The Kraken"`. What’s up with that?


    This might seem like it’s a contradiction, but it’s not. We said primitive *values*
    can’t change, but we didn’t say anything about *variables*! As we refine our mental
    model, we need to untangle a couple of related concepts:


    **Variables are not values.**


    **Variables point to values.**


    # Assigning a Value to a Variable


    In our JavaScript universe, a variable is a wire that *points* to a value.


    For example, I can point the `pet` variable to the `"Narwhal"` value. (I can also
    say that I’m *assigning* the value `"Narwhal"` to the variable called `pet`):


    ```

    let pet = ''Narwhal'';

    ```


    ![](img/5f506681f0d75d6067480d5c0ee322f2_21_0.png)'
  - '[PAGE 22]


    But what if I want a different pet? No problem—I can point `pet` to another value:


    ```

    pet = ''The Kraken'';

    ```


    ![](img/5f506681f0d75d6067480d5c0ee322f2_22_0.png)


    All I am doing here is instructing JavaScript to point the variable, or a “wire”,
    on the left side ( `pet` ) to the value on the right side ( `The Kraken` ). It
    will keep pointing at that value unless I reassign it again later.


    # Rules of Assignment


    There are two rules when we want to use the `=` assignment operator:'
  - '[PAGE 23]


    1. **The left side of an assignment must be a "wire"—such as the `pet` variable.**

    Note that the left side can''t be a value. (Try these examples in the console):


    ```

    20000 = ''leagues under the sea''; // Nope.

    ''war'' = ''peace''; // Nope.

    ```


    2. **The right side of an assignment must be an expression, so it always results
    in a value.** Our expression can be something simple, like `2` or `''hello''`.
    It can also be a more complicated expression—for example:


    ```

    pet = count + '' Dalmatians'';

    ```


    Here, `count + '' Dalmatians''` is an expression—a question to JavaScript. JavaScript
    will answer it with a value (for example, `"101 Dalmatians"`). From now on, the
    `pet` variable "wire" will point to that particular value.


    > **Fun Fact**


    If the right side must be an expression, does this mean that simple things—numbers
    like `2` or strings like `''The Kraken''`—written in code are also expressions?
    Yes! Such expressions are called *literals*—because we *literally* write down
    the values that they result in.


    # Reading a Value of a Variable


    I can also *read* the value of a variable—for example, to log it:


    ```

    console.log(pet);

    ```


    That''s hardly surprising.'
  - "[PAGE 24]\n\nBut note that it is not the `pet` variable that we pass to `console.log`.\
