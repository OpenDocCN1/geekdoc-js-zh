    \ to them, just like we can do with numbers or objects.\n\n**Of course, if we\
    \ want to `call` a function, we can do that too:**\n\n```javascript\nlet countDwarves\
    \ = function() { return 7; };\nlet dwarves = countDwarves(); // () is a function\
    \ call\nconsole.log(dwarves);\n```\n\nNote that neither the `let` declaration\
    \ nor the `=` assignment have anything to do with our function call. It's `()`\
    \ that performs the function call—and it alone!\n\n**Adding `()` changes the meaning\
    \ of our code:**\n\n- `let dwarves = countDwarves` means \"Point `dwarves` to\
