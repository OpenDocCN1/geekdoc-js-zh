    # The JavaScript Simulation


    I live on my small planet inside our JavaScript universe.


    When I ask our universe a question, it answers with a value. I certainly didn''t
    come up with all these values myself. The variables, the expressions, the values—they
    populate our world. The JavaScript world around me is absolutely real to me.'
