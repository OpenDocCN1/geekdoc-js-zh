    \ on what you can do with each JavaScript concept in your head. You can't skate\
    \ a bike. You can't fly an avocado. You can't sing a mosquito. And you can't pass\
    \ a variable—at least not in JavaScript.\n\nHere's a small example of why these\
    \ details matter.\n\n```\nfunction double(x) {\n  x = x * 2;\n}\n\nlet money =\
    \ 10;\ndouble(money);\nconsole.log(money); // ?\n```\n\nIf we thought `double(money)`\
    \ was passing a variable, we could expect that `x = x * 2` would double the `money`\
    \ variable.\n\nBut that's not right: `double(money)` means \"figure out the value\
