    \ And that's all there is to know about it!\n\n## Strict Equality: a === b\n\n\
    You have probably used the **strict equality** operator before:\n\n```\nconsole.log(2\
    \ === 2); // true\nconsole.log({} === {}); // false\n```\n\nThere is also a corresponding\
    \ opposite `!==` operator.\n\n## Same Value Equality vs. Strict Equality\n\nSo\
    \ what's the difference between `Object.is` and `===`?\n\n**Same value equality**—\
    \ `Object.is(a, b)` —has a direct meaning in our mental model. It corresponds\
    \ to the idea of \"the same value\" in our universe.\n\nIn almost all cases, the\
    \ same intuition works for **strict value equality**. For example, `2 === 2` is\
    \ `true` because `2` always \"summons\" the same value:\n\n```\nconsole.log( 2\
    \ === 2 )\n```\n\nConversely, `{} === {}` is `false` because each `{}` *creates*\
    \ a different value:\n\n```\nconsole.log( {} === {} )\n```\n\nIn the above examples,\
    \ `a === b` behaves the same way as `Object.is(a, b)`. However, there are **two\
    \ rare cases** where the behavior of `===` is different.\n\nRemember memorizing\
    \ irregular verbs when you were learning English? The cases below are similar—**consider\
    \ them as exceptions to the rule**.\n\nBoth of these unusual cases involve \"\
