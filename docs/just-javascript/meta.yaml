  - '[PAGE 104]


    The `const` keyword lets you create read-only variables—also known as *constants*.
    Once we declare a constant, we can''t point it to a different value:


    ```

    shrek = fiona; // TypeError

    ```


    But there''s a crucial nuance. **We can still mutate the *object* our wire points
    to:**


    ```

    shrek.species = ''human'';

    console.log(shrek.species); // ''human''

    ```


    In this example, it is only the `shrek` *variable wire itself* that is read-only
    (`const`). It points to an object—and *that* object''s properties can be mutated!


    The usefulness of `const` is a hotly debated topic. Some prefer to ban `let` altogether
    and always use `const`. Others say that programmers should be trusted to reassign
    their own variables. Whatever your preference may be, remember that `const` prevents
    variable reassignment—not object mutation.


    # Is Mutation Bad?


    Don''t walk away thinking that mutation is “bad.” That''s a lazy oversimplification
    that obscures real understanding. If data changes over time, a mutation happens
    *somewhere*. The question is, *what* should be mutated, *where*, and *when*?


    Mutation is “spooky action at a distance.” Changing `john.address.city` led to
    `console.log(sherlock.address.city)` printing something else.


    **By the time you mutate an object, variables and properties may already be pointing
    to it. Your mutation affects any code “following” those wires later.**


    This is both a blessing and a curse. Mutation makes it easy to change some data
    and immediately “see” the change across the whole program. However, undisciplined
    mutation makes it harder to predict what the program will do.'
- md: "There is a school of thought that mutation is best contained to a very narrow\
    \ layer of your application. The benefit, according to this philosophy, is that\
    \ your program’s behavior is more predictable. The downside is that you write\
    \ more code to “pass things around” and avoid mutation.\n\nIt’s worth noting that\
    \ mutating *new* objects that you’ve just created is always okay because there\
    \ are no other wires pointing to them yet. In other cases, I advise you to be\
    \ very intentional about what you’re mutating and when. The extent to which you’ll\
    \ rely on mutation depends on your app’s architecture.\n\n## Recap\n\n- Objects\
    \ are never “nested” in our universe—pay close attention to the wires.\n- Changing\
    \ an object’s property is also called *mutating* that object.\n- If you mutate\
    \ an object, your code will “see” that change via any wires pointing to that object.\
    \ Sometimes, this may be what you want. However, mutating accidentally shared\
    \ data may cause bugs.\n- You can declare a variable with `const` instead of `let`.\
    \ That allows you to enforce that this variable always points to the same value.\
    \ But remember that `const` does *not* prevent object mutation!\n- Mutating the\
    \ objects you’ve just created in code is safe. Broadly, how much you’ll use mutation\
    \ depends on your app’s architecture.\n\n## Exercises\n\nThis module also has\
    \ exercises for you to practice!\n\n**Don’t skip them!**\n\nEven though you're\
    \ likely familiar with the concept of mutation, these exercises will help you\
    \ cement the mental model we're building. We need this foundation before we can\
    \ get to more complex topics.\n\n## Finished reading?\n\nMark this episode as\
    \ learned to track your progress.\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_106_0.png)\n\
    \n**UP NEXT**\n\n## Take a Quiz →\n\n## Prototypes\n\nIn previous modules, we’ve\
    \ covered object properties and mutation, but we’re not quite done—we still need\
    \ to talk about prototypes!\n\nHere is a small riddle to check our mental model:\n\
    \n```javascript\nlet pizza = {};\nconsole.log(pizza.taste); // \"pineapple\"\n\
    ```\n\nAsk yourself: is this possible?\n\nWe have just created an empty object\
    \ with `{}`. We definitely didn’t set any properties on it before logging, so\
    \ it seems like `pizza.taste` can’t point to \"pineapple\". We would expect `pizza.taste`\
    \ to give us `undefined` instead—we usually get `undefined` when a property doesn’t\
    \ exist, right?\n\nAnd yet, it is possible that `pizza.taste` is \"pineapple\"\
    ! This may be a contrived example, but it shows that our mental model is incomplete.\n\
    \nIn this module, we'll introduce *prototypes*. Prototypes explain what happens\
    \ in this puzzle and—more importantly—are at the heart of several other fundamental\
    \ JavaScript features. Occasionally people neglect to learn about prototypes because\
    \ they seem too unusual, but the core idea is remarkably simple.\n\n## Prototypes\n\
    \nHere's a couple of variables pointing to a couple of objects:\n\n```javascript\n\
    let human = {\n  teeth: 32\n};\n\nlet gwen = {\n  age: 19\n};\n```\n\nWe can represent\
    \ them visually in a familiar way:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_109_0.png)\n\
    \nIn this example, `gwen` points to an object without a `teeth` property. According\
    \ to the rules we've learned, logging this property would give us `undefined`:\n\
    \n```javascript\nconsole.log(gwen.teeth); // undefined\n```\n\nBut the story doesn't\
    \ have to end here. JavaScript's default behavior returns `undefined`, but we\
    \ can instruct it to continue searching for our missing property on another object.\
    \ We can do it with one line of code:\n\n```javascript\nlet human = {\n  teeth:\
    \ 32\n};\n\nlet gwen = {\n  // We added this line:\n  __proto__: human,\n  age:\
    \ 19\n};\n```\n\nWhat is that mysterious `__proto__` property?\n\nIt represents\
    \ the JavaScript concept of a *prototype*. Any JavaScript object may choose another\
    \ object as a prototype. We will discuss what that means in practice but for now,\
    \ let's think of it as a special `__proto__` wire:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_110_0.png)\n\
    \nTake a moment to verify the diagram matches the code. We drew it just like we\
    \ did in the past. The only new thing is the mysterious `__proto__` wire.\n\n\
    By specifying `__proto__` (also known as our object's *prototype*), we instruct\
    \ JavaScript to continue looking for missing properties on that object instead.\n\
    \n## Prototypes in Action\n\nWhen we went looking for `gwen.teeth`, we got `undefined`\
    \ because the `teeth` property doesn't exist on the object that `gwen` points\
    \ to.\n\nBut thanks to `__proto__: human`, the answer is different:\n\n```javascript\n\
    let human = {\n  teeth: 32\n};\n\nlet gwen = {\n  __proto__: human,\n  age: 19\n\
    };\n\nconsole.log(gwen.teeth); // 32\n```\n\nNow the sequence of steps looks like\
    \ this:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_111_0.png)\n\n1. Follow the\
    \ `gwen` wire. It leads to an object.\n2. Does this object have a `teeth` property?\n\
    \    - No.\n    - **But it has a prototype.** Let's check it out.\n3. Does *that*\
    \ object have a `teeth` property?\n    - Yes, it points to `32`.\n    - Therefore,\
    \ the result of `gwen.teeth` is `32`.\n\nThis is similar to saying, “I don't know,\
    \ but Alice might know.” With `__proto__`, you instruct JavaScript to “ask another\
    \ object.”\n\nTo check your understanding so far, write down your answers:\n\n\
    ```javascript\nlet human = {\n  teeth: 32\n};\n\nlet gwen = {\n  __proto__: human,\n\
    \  age: 19\n};\n\nconsole.log(human.age); // ?\nconsole.log(gwen.age); // ?\n\n\
    console.log(human.teeth); // ?\nconsole.log(gwen.teeth); // ?\n\nconsole.log(human.tail);\
    \ // ?\nconsole.log(gwen.tail); // ?\n```\n\n### Answer\n\n*Now Don't reveal until\
    \ you have written the answers to six questions*\n\nThe `human` variable points\
    \ to an object that doesn't have an `age` property, so `human.age` is `undefined`.\
    \ The `gwen` variable points to an object that does have an `age` property. That\
    \ wire points to `19`, so the value of `gwen.age` is `19`:\n\nThe `human` variable\
    \ points to an object that has a `teeth` property, so the value of `human.teeth`\
    \ is `32`. The `gwen` variable points to an object that doesn't have a `teeth`\
    \ property. However, that object has a prototype, which does have a `teeth` property.\
    \ This is why the value of `gwen.teeth` is also `32`.\n\nNeither of our objects\
    \ has a `tail` property, so we get `undefined` for both:\n\nNote how although\
    \ the value of `gwen.teeth` is `32`, it doesn't mean `gwen` has a `teeth` property!\
    \ Indeed, in this example, the object that `gwen` points to *does not* have a\
    \ `teeth` property. But its prototype object—the same one `human` points to—does.\n\
    \nThis serves to remind us that `gwen.teeth` is an *expression*—a question to\
    \ our JavaScript universe—and JavaScript will follow a sequence of steps to answer\
    \ it. Now we know these steps involve looking at the prototype.\n\n## The Prototype\
    \ Chain\n\nA prototype isn't a special \"thing\" in JavaScript. A prototype is\
    \ more like a *relationship*. An object may point to another object as its prototype.\n\
    \nThis naturally leads to a question: but what if my object's prototype has its\
    \ own prototype? And that prototype has *its own* prototype? Would that work?\n\
    \nThe answer is yes—this is *exactly* how it works!\n\n```javascript\nlet mammal\
    \ = {\n    brainy: true,\n};\n\nlet human = {\n    __proto__: mammal,\n    teeth:\
    \ 32\n};\n\nlet gwen = {\n    __proto__: human,\n    age: 19\n};\n\nconsole.log(gwen.brainy);\
    \ // true\n```\n\nWe can see that JavaScript will search for the property on our\
    \ object, then on its prototype, then on *that* object's prototype, and so on.\
    \ We would only get `undefined` if we ran out of prototypes and still hadn't found\
    \ our property.\n\nThis is similar to saying, “I don’t know, but Alice might know.”\
    \ Then Alice might say, “Actually, I don’t know either—ask Bob.” Eventually, you\
    \ will either arrive at the answer or run out of people to ask!\n\nThis sequence\
    \ of objects to “visit” is known as our object’s *prototype chain*. (However,\
    \ unlike a chain you might wear, prototype chains can't be circular!)\n\n## Shadowing\n\
    \nConsider this slightly modified example:\n\n```javascript\nlet human = {\n \
    \   teeth: 32\n};\n\nlet gwen = {\n    __proto__: human,\n    // This object has\
    \ its own teeth property:\n    teeth: 31\n};\n```\n\nBoth objects define a property\
    \ called `teeth`, so the results are different:\n\n```javascript\nconsole.log(human.teeth);\
    \ // 32\nconsole.log(gwen.teeth); // 31\n```\n\nNote that `gwen.teeth` is **31**.\
    \ If `gwen` didn't have its own `teeth` property, we would look at the prototype.\
    \ But because the object that `gwen` points to has its own `teeth` property, we\
    \ don't need to keep searching for the answer."
  mdcn: "\n有一种观点认为，变更应严格限制在应用程序的一个非常狭窄的层级中。根据这种哲学，这样做的好处是程序的行为更可预测。其缺点是，你必须编写更多代码来“传递数据”并避免变更。\n\
    \n值得注意的是，变更你刚刚创建的*新*对象总是可以的，因为此时还没有其他引用指向它们。在其他情况下，我建议你非常审慎地决定何时以及变更什么。你依赖变更的程度取决于你的应用程序架构。\n\
    \n## 回顾\n\n- 在我们的宇宙中，对象从不是“嵌套”的——请密切关注引用。\n- 更改对象的属性也称为*变更*该对象。\n- 如果你变更了一个对象，你的代码将通过任何指向该对象的引用“看到”该变化。有时，这可能是你想要的结果。然而，意外变更共享数据可能导致错误。\n\
    - 你可以使用 `const` 而不是 `let` 来声明变量。这允许你强制该变量始终指向同一个值。但请记住，`const` *并不能*阻止对象变更！\n\
    - 在代码中变更你刚刚创建的对象是安全的。总的来说，你使用变更的频率取决于你的应用程序架构。\n\n## 练习\n\n本模块也包含供你练习的习题！\n\n\
    **不要跳过它们！**\n\n即使你可能已经熟悉变更的概念，这些练习将有助于巩固我们正在构建的心智模型。在进入更复杂的话题之前，我们需要这个基础。\n\n\
    ## 读完了？\n\n将此章节标记为已学习以跟踪你的进度。\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_106_0.png)\n\
    \n**接下来**\n\n## 参与测验 →\n\n## 原型\n\n在前面的模块中，我们涵盖了对象属性和变更，但我们还没完全结束——我们还需要讨论原型！\n\
    \n这里有一个小谜题来检验我们的心智模型：\n\n```javascript\nlet pizza = {};\nconsole.log(pizza.taste);\
    \ // \"pineapple\"\n```\n\n问问自己：这可能吗？\n\n我们刚刚用 `{}` 创建了一个空对象。在记录日志之前，我们肯定没有设置任何属性，所以看起来\
    \ `pizza.taste` 不可能指向 \"pineapple\"。我们原本期望 `pizza.taste` 会返回 `undefined`——当属性不存在时，我们通常会得到\
    \ `undefined`，对吧？\n\n然而，`pizza.taste` 完全有可能是 \"pineapple\"！这可能是一个人为设计的例子，但它表明我们的心智模型是不完整的。\n\
    \n在本模块中，我们将介绍*原型*。原型解释了这个谜题中发生的事情——更重要的是，它们是其他几个 JavaScript 基础特性的核心。有时人们会因为原型看起来太不寻常而忽略学习它们，但其核心思想其实非常简单。\n\
    \n## 原型\n\n这里有几个变量指向几个对象：\n\n```javascript\nlet human = {\n  teeth: 32\n};\n\n\
    let gwen = {\n  age: 19\n};\n```\n\n我们可以用熟悉的方式直观地表示它们：\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_109_0.png)\n\
    \n在这个例子中，`gwen` 指向一个没有 `teeth` 属性的对象。根据我们学过的规则，记录这个属性会得到 `undefined`：\n\n```javascript\n\
    console.log(gwen.teeth); // undefined\n```\n\n但故事不必到此结束。JavaScript 的默认行为是返回 `undefined`，但我们可以指示它在另一个对象上继续查找缺失的属性。我们只需一行代码就能做到：\n\
    \n```javascript\nlet human = {\n  teeth: 32\n};\n\nlet gwen = {\n  // 我们添加了这行：\n\
    \  __proto__: human,\n  age: 19\n};\n```\n\n那个神秘的 `__proto__` 属性是什么？\n\n它代表了 JavaScript\
    \ 中的*原型*概念。任何 JavaScript 对象都可以选择另一个对象作为其原型。我们将讨论这在实践中意味着什么，但现在，让我们把它想象成一条特殊的 `__proto__`\
    \ 引用：\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_110_0.png)\n\n花点时间验证图表是否与代码匹配。我们像过去一样绘制它。唯一的新东西是那条神秘的\
    \ `__proto__` 引用。\n\n通过指定 `__proto__`（也称为我们对象的*原型*），我们指示 JavaScript 在该对象上继续查找缺失的属性。\n\
    \n## 原型实战\n\n当我们查找 `gwen.teeth` 时，得到 `undefined` 是因为 `gwen` 指向的对象上没有 `teeth` 属性。\n\
    \n但多亏了 `__proto__: human`，结果不同了：\n\n```javascript\nlet human = {\n  teeth: 32\n\
    };\n\nlet gwen = {\n  __proto__: human,\n  age: 19\n};\n\nconsole.log(gwen.teeth);\
    \ // 32\n```\n\n现在步骤序列如下所示：\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_111_0.png)\n\
    \n1.  沿着 `gwen` 引用。它指向一个对象。\n2.  这个对象有 `teeth` 属性吗？\n    -   没有。\n    -   **但它有一个原型。**\
    \ 让我们检查一下。\n3.  *那个*对象有 `teeth` 属性吗？\n    -   有，它指向 `32`。\n    -   因此，`gwen.teeth`\
    \ 的结果是 `32`。\n\n这类似于说：“我不知道，但爱丽丝可能知道。”通过 `__proto__`，你指示 JavaScript “去问另一个对象。”\n\
    \n为了检查你目前的理解，请写下你的答案：\n\n```javascript\nlet human = {\n  teeth: 32\n};\n\nlet\
    \ gwen = {\n  __proto__: human,\n  age: 19\n};\n\nconsole.log(human.age); // ?\n\
    console.log(gwen.age); // ?\n\nconsole.log(human.teeth); // ?\nconsole.log(gwen.teeth);\
    \ // ?\n\nconsole.log(human.tail); // ?\nconsole.log(gwen.tail); // ?\n```\n\n\
    ### 答案\n\n*现在，在你写出六个问题的答案之前，请不要查看*\n\n`human` 变量指向一个没有 `age` 属性的对象，所以 `human.age`\
    \ 是 `undefined`。`gwen` 变量指向一个确实有 `age` 属性的对象。那条引用指向 `19`，所以 `gwen.age` 的值是 `19`：\n\
    \n`human` 变量指向一个有 `teeth` 属性的对象，所以 `human.teeth` 的值是 `32`。`gwen` 变量指向一个没有 `teeth`\
    \ 属性的对象。然而，那个对象有一个原型，原型确实有 `teeth` 属性。这就是为什么 `gwen.teeth` 的值也是 `32`。\n\n我们的两个对象都没有\
    \ `tail` 属性，所以两者都得到 `undefined`：\n\n请注意，尽管 `gwen.teeth` 的值是 `32`，但这并不意味着 `gwen`\
    \ 有一个 `teeth` 属性！确实，在这个例子中，`gwen` 指向的对象*没有* `teeth` 属性。但它的原型对象——也就是 `human` 指向的那个——有。\n\
    \n这提醒我们，`gwen.teeth` 是一个*表达式*——一个向我们的 JavaScript 宇宙提出的问题——而 JavaScript 将遵循一系列步骤来回答它。现在我们知道这些步骤包括查看原型。\n\
    \n## 原型链\n\n原型在 JavaScript 中并不是一个特殊的“东西”。原型更像是一种*关系*。一个对象可以指向另一个对象作为其原型。\n\n这自然引出一个问题：但如果我的对象的原型有自己的原型呢？而那个原型又有*它自己的*原型？这行得通吗？\n\
    \n答案是肯定的——这*正是*它的工作方式！\n\n```javascript\nlet mammal = {\n    brainy: true,\n};\n\
    \nlet human = {\n    __proto__: mammal,\n    teeth: 32\n};\n\nlet gwen = {\n \
    \   __proto__: human,\n    age: 19\n};\n\nconsole.log(gwen.brainy); // true\n\
    ```\n\n我们可以看到，JavaScript 会先在我们的对象上查找属性，然后在其原型上查找，接着在*那个*对象的原型上查找，依此类推。只有当我们耗尽了原型链而仍未找到属性时，才会得到\
    \ `undefined`。\n\n这类似于说：“我不知道，但爱丽丝可能知道。”然后爱丽丝可能会说：“其实我也不知道——问问鲍勃吧。”最终，你要么找到答案，要么没有人可问了！\n\
    \n这个需要“访问”的对象序列被称为我们对象的*原型链*。（然而，与你可能佩戴的链条不同，原型链不能是循环的！）\n\n## 遮蔽\n\n考虑这个稍作修改的例子：\n\
    \n```javascript\nlet human = {\n    teeth: 32\n};\n\nlet gwen = {\n    __proto__:\
    \ human,\n    // 这个对象有自己的 teeth 属性：\n    teeth: 31\n};\n```\n\n两个对象都定义了一个名为 `teeth`\
    \ 的属性，所以结果不同：\n\n```javascript\nconsole.log(human.teeth); // 32\nconsole.log(gwen.teeth);\
    \ // 31\n```\n\n请注意 `gwen.teeth` 是 **31**。如果 `gwen` 没有自己的 `teeth` 属性，我们才会去查看原型。但因为\
    \ `gwen` 指向的对象有自己的 `teeth` 属性，我们不需要继续搜索答案了。\n"
