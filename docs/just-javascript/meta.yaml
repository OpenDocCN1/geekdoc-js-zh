- md: "## Take a Quiz →\n\n## Equality of Values\n\nIt’s time to talk about equality\
    \ in JavaScript! Here’s why it matters.\n\nImagine attending a masked carnival\
    \ with only a few types of masks to choose from. Groups of people with the exact\
    \ same outfit would be joking, dancing, and moving around the room. It would be\
    \ confusing! You might talk to two people, and not realize that you really talked\
    \ to the same person twice. Or you might *think* you talked to one person when,\
    \ in reality, you talked to two different people!\n\n**If you don’t have a clear\
    \ mental model of equality in JavaScript, every day is like a carnival—and not\
    \ in a good way.** You’re never quite sure if you’re dealing with the same value,\
    \ or with two different values. As a result, you’ll often make mistakes—like changing\
    \ a value you didn’t intend to change.\n\nLuckily, we’ve already done most of\
    \ the work to establish the concept of equality in JavaScript. It fits into our\
    \ mental model in a very natural way.\n\n## Kinds of Equality\n\nIn JavaScript,\
    \ there are several kinds of equality. If you’ve been writing JavaScript for a\
    \ while, you’re probably familiar with at least two of them:\n\n- **Strict Equality:**\
    \ `a === b` (triple equals).\n- **Loose Equality:** `a == b` (double equals).\n\
    - **Same Value Equality:** `Object.is(a, b)`.\n\nMost tutorials don’t mention\
    \ *same value equality* at all. We’ll take a road less traveled, and explain it\
    \ first. We can then use it to explain the other kinds of equality.\n\n## Same\
    \ Value Equality: `Object.is(a, b)`\n\nIn JavaScript, `Object.is(a, b)` tells\
    \ us if `a` and `b` are the same value:\n\n```\nconsole.log(Object.is(2, 2));\
    \ // true\nconsole.log(Object.is({}, {})); // false\n```\n\nThis is called **same\
    \ value equality**.\n\n> **Fun Fact**\n\nDespite `Object` in the method name,\
    \ `Object.is` is not specific to objects. It can compare any two values, whether\
    \ they are objects or not!\n\nWhat does “same value” mean, exactly, in our mental\
    \ model? You might already know this intuitively, but let's verify your understanding.\n\
    \n## Check Your Intuition\n\nConsider this example from our earlier exercises:\n\
    \n```\nlet dwarves = 7;\nlet continents = '7';\nlet worldWonders = 3 + 4;\n```\n\
    \nAs a reminder, our sketch for this snippet looked like this:\n\nNow try to answer\
    \ these questions **using the diagram above**:\n\n```\nconsole.log(Object.is(dwarves,\
    \ continents)); // ?\nconsole.log(Object.is(continents, worldWonders)); // ?\n\
    console.log(Object.is(worldWonders, dwarves)); // ?\n```\n\nWrite down your answers\
    \ and think about *how* you would explain them.\n\n## Answer\n\n1. `Object.is(dwarves,\
    \ continents)` is `false` because `dwarves` and `continents` point to different\
    \ values.\n2. `Object.is(continents, worldWonders)` is `false` because `continents`\
    \ and `worldWonders` point to different values.\n3. `Object.is(worldWonders, dwarves)`\
    \ is `true` because `worldWonders` and `dwarves` point to the same value.\n\n\
