    \ bug 的起点。**反过来也适用。** 有时，你可以断定某段代码*不是*问题的根源——因为心智模型证明了这一点！\n\n比如说，如果我们把 `john`\
    \ 变量指向一个不同的对象，我们就可以相当确定 `sherlock.address.city` 不会改变。我们的图示显示，改变 `john` 连线不会影响任何从\
