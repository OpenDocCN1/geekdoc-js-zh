- md: "# Mental Models\n\nRead this code:\n\n```\nlet a = 10;\nlet b = a;\na = 0;\n\
    ```\n\nWhat are the values of `a` and `b` after it runs? Work it out in your head\
    \ before reading further.\n\nIf you've been writing JavaScript for a while, you\
    \ might object: \"This snippet is much simpler than the code I'm writing every\
    \ day. What's the point?\"\n\nThe goal of this exercise isn't to introduce you\
    \ to variables. We assume you're already familiar with them. Instead, it is to\
    \ make you notice and reflect on your mental model.\n\n# What’s a Mental Model?\n\
    \nRead the code above again with an intention to *really be sure* what the result\
    \ is. (We’ll see why this intention is important a bit later.)\n\nWhile you’re\
    \ reading it for the second time, pay close attention to what’s happening in your\
    \ head, step by step. You might notice a monologue like this:\n\n- **let a = 10;**\n\
    \  - Declare a variable called `a`. Set it to `10`.\n- **let b = a;**\n  - Declare\
    \ a variable called `b`. Set it to `a`.\n  - Wait, what’s `a` again? Ah, it was\
    \ `10`. So `b` is `10` too.\n- **a = 0;**\n  - Set the `a` variable to `0`.\n\
    - So `a` is `0` now, and `b` is `10`. That’s our answer.\n\nMaybe your monologue\
    \ is a bit different. Maybe you say “assign” instead of “set,” or maybe you read\
    \ it in a slightly different order. Maybe you arrived at a different result. Pay\
    \ attention to how exactly it was different. Note how even this monologue doesn’t\
    \ capture what’s really happening in your head. You might say “set `b` to `a`,”\
    \ but what does it even mean to set a variable?\n\nYou might find that for every\
    \ familiar fundamental programming concept (like a variable) and operations on\
    \ it (like setting its value), there is a set of deep-rooted analogies that you\
    \ associated with it. Some of them may come from the real world. Others may be\
    \ repurposed from other fields you learned first, like numbers from math. These\
    \ analogies might overlap and even contradict each other, but they still help\
    \ you make sense of what’s happening in the code.\n\nFor example, many people\
    \ first learned about variables as “boxes”—containers that hold your stuff. Even\
    \ if you don’t vividly imagine boxes anymore when you see a variable, they might\
    \ still behave “boxily” in your imagination.\n\nThese approximations of how something\
    \ works in your head are known as “mental models.” It may be hard if you’ve been\
    \ programming for a long time, but try to notice and introspect your mental models.\
    \ They’re probably a combination of visual, spatial, and mechanical mental shortcuts.\
    \ These intuitions (like “boxiness” of variables) influence how we read code our\
    \ whole lives.\n\nUnfortunately, sometimes our mental models are wrong. Maybe\
    \ a tutorial we read early on sacrificed accuracy in order to make a concept easier\
    \ to explain. Maybe, when we started learning JavaScript, we incorrectly “brought\
    \ over” an expected behavior from a language we learned earlier. Maybe we inferred\
    \ a mental model from some piece of code but never really verified it was accurate.\n\
    \nIdentifying and fixing these problems is what *Just JavaScript* is all about.\
    \ We will gradually build (or possibly rebuild) your mental model of JavaScript\
    \ to be accurate and useful. A good mental model will give you confidence in your\
    \ own code, and it will let you understand (and fix) code that someone else wrote.\n\
    \n(By the way, `a` being `0` and `b` being `10` is the correct answer.)\n\n# Coding,\
    \ Fast and Slow\n\n“Thinking, Fast and Slow” is a book by Daniel Kahneman that\
    \ explores the two different “systems” humans use when thinking.\n\nWhenever we\
    \ can, we rely on the “fast” system, which is good at pattern matching and “gut\
    \ reactions.” We share this system (which is necessary for survival!) with many\
    \ animals, and it gives us amazing powers like the ability to walk without falling\
    \ over. But it's not good at planning.\n\nUniquely, thanks to the development\
    \ of the frontal lobe, humans also possess a “slow” thinking system. This “slow”\
    \ system is responsible for complex step-by-step reasoning. It lets us plan future\
    \ events, engage in arguments, or follow mathematical proofs.\n\nBecause using\
    \ the “slow” system is so mentally draining, we tend to default to the “fast”\
    \ one—even when dealing with intellectual tasks like coding.\n\nImagine that you're\
    \ in the middle of a lot of work, and you want to quickly identify what this function\
    \ does. Take a glance at it:\n\n```\nfunction duplicateSpreadsheet(original) {\n\
    \  if (original.hasPendingChanges) {\n    throw new Error('You need to save the\
    \ file before you can duplicate it.');\n  }\n  let copy = {\n    created: Date.now(),\n\
    \    author: original.author,\n    cells: original.cells,\n    metadata: original.metadata,\n\
    \  };\n  copy.metadata.title = 'Copy of ' + original.metadata.title;\n  return\
    \ copy;\n}\n```\n\nYou've probably noticed that:\n\n- This function duplicates\
    \ a spreadsheet.\n- It throws an error if the original spreadsheet isn't saved.\n\
    - It prepends “Copy of” to the new spreadsheet's title.\n\nWhat you might *not*\
    \ have noticed (great job if you did!) is that this function *also* accidentally\
    \ changes the title of the original spreadsheet. Missing bugs like this is something\
    \ that happens to every programmer, every day.\n\nNow that you know a bug exists,\
    \ will you read the code differently? If you used the “fast” thinking system at\
    \ first, you might switch to the more laborious “slow” system when you realize\
    \ there's a bug in the code.\n\nWhen we use the “fast” system, we guess what the\
    \ code does based on its overall structure, naming conventions and comments. Using\
    \ the “slow” system, we retrace what the code does step by step—a tiring and time-consuming\
    \ process.\n\nThis is why having an accurate mental model is so important. Simulating\
    \ a computer in your head is hard, and when you have to fall back to the “slow”\
    \ thinking system, your mental model is all you can rely on. With the wrong mental\
    \ model, you’ll fundamentally misunderstand what to expect from your code, and\
    \ all your effort will be wasted.\n\nDon’t worry if you can’t find the bug at\
    \ all—it just means you’ll get the most out of this course! Over the next modules,\
    \ we’ll rebuild our mental model of JavaScript together, so that you can catch\
    \ bugs like this immediately.\n\nIn the next module, we’ll start building mental\
    \ models for some of the most fundamental JavaScript concepts—values and expressions.\n\
    \n# Finished reading?\n\nMark this episode as learned to track your progress.\n\
    \nMark as learned\n\nUP NEXT\n\n# The JavaScript Universe →\n\n# The JavaScript\
    \ Universe\n\n*In the beginning was the Value.*\n\nWhat *is* a value? It's hard\
    \ to say.\n\nWhat is a point in geometry? What is a word in human language? A\
    \ value is a fundamental concept in JavaScript—so we can't define it through other\
    \ terms.\n\nInstead, we'll define it through examples. Numbers and strings are\
    \ values. Objects and functions are values, too.\n\nThere are also a lot of things\
    \ that are *not* values, like the pieces of our code—our `if` statements, loops,\
    \ and variable declarations, for example.\n\n# Values and Code\n\nAs we start\
    \ building our mental model, one of the first common misconceptions we need to\
    \ clear up is that values *are* our code. Instead, we need to think of them separately—our\
    \ code interacts with values, but values exist in a completely separate space.\n\
    \nTo distinguish between values and code in my JavaScript program, I like to imagine\
    \ this drawing of the Little Prince by Antoine de Saint-Exupéry:\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_7_0.png)\n\
    \nI’m standing on a small planet, holding a list of instructions. This list is\
    \ my program—my code. As I read through my list of instructions, I can see a lot\
    \ going on—there are `if` statements, variable declarations, commas and curly\
    \ braces.\n\nMy code contains instructions like “make a function call,” “do this\
    \ thing many times,” or even “throw an error.” I read through these instructions\
    \ step by step from the surface of my little world.\n\n*But every once in a while,\
    \ I look up.*\n\nOn a clear night, I see the different values in the JavaScript\
    \ sky: booleans, numbers, strings, symbols, functions and objects, `null` and\
    \ `undefined` —oh my! I might refer to them in my code, but they don't exist *inside*\
    \ my code.\n\n*In our JavaScript universe, values float in space.*\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_8_0.png)\n\
    \n“Hold on,” you might say, “I always thought of values as being inside of my\
    \ code!” Here, I’m asking you to take a leap of faith. It will take a few more\
    \ modules for this mental model to pay off. [Give it five minutes](http://example.com).\
    \ I know what I’m doing."
  mdcn: "\n# 心智模型\n\n阅读这段代码：\n\n```\nlet a = 10;\nlet b = a;\na = 0;\n```\n\n这段代码运行后，`a`和`b`的值分别是多少？在继续阅读之前，请先在脑海中推算一下。\n\
    \n如果你已经写了一段时间的JavaScript，你可能会反对说：“这个代码片段比我每天写的代码简单多了。有什么意义？”\n\n这个练习的目的不是向你介绍变量。我们假设你已经熟悉变量了。相反，它是为了让你注意并反思自己的心智模型。\n\
    \n# 什么是心智模型？\n\n带着*确保自己完全明白*结果是什么的意图，重新阅读上面的代码。（我们稍后会看到这个意图为什么重要。）\n\n当你第二次阅读时，请密切关注你的头脑中一步一步发生了什么。你可能会注意到这样的内心独白：\n\
    \n- **let a = 10;**\n  - 声明一个名为`a`的变量。将其设置为`10`。\n- **let b = a;**\n  - 声明一个名为`b`的变量。将其设置为`a`。\n\
    \  - 等等，`a`又是什么来着？啊，是`10`。所以`b`也是`10`。\n- **a = 0;**\n  - 将变量`a`设置为`0`。\n- 所以现在`a`是`0`，`b`是`10`。这就是我们的答案。\n\
    \n也许你的独白有点不同。也许你用的是“赋值”而不是“设置”，或者你阅读的顺序略有不同。也许你得出了不同的结果。请特别留意它具体有什么不同。注意，即使是这样的独白也没有完全捕捉到你头脑中真正发生的事情。你可能说“把`b`设置为`a`”，但“设置”一个变量到底是什么意思呢？\n\
    \n你可能会发现，对于每一个熟悉的基本编程概念（如变量）及其操作（如设置其值），都有一套与之相关联的根深蒂固的类比。其中一些可能来自现实世界。另一些可能来自你先前学习的其他领域，例如数学中的数字。这些类比可能相互重叠甚至相互矛盾，但它们仍然帮助你理解代码中发生的事情。\n\
    \n例如，许多人最初学习变量时是将其视为“盒子”——用来装你东西的容器。即使你在看到变量时不再生动地想象盒子，但在你的想象中，它们可能仍然表现得“像盒子一样”。\n\
    \n这些在你头脑中对事物如何工作的近似理解，被称为“心智模型”。如果你已经编程很长时间了，这可能很难，但试着去注意和反思你自己的心智模型。它们可能是视觉、空间和机械心理捷径的结合。这些直觉（比如变量的“盒子性”）影响着我们一生解读代码的方式。\n\
    \n不幸的是，有时我们的心智模型是错误的。也许我们早期阅读的教程为了更容易解释一个概念而牺牲了准确性。也许，在我们开始学习JavaScript时，我们错误地从之前学过的语言中“搬过来”了某种预期的行为。也许我们从某段代码中推断出了一个心智模型，但从未真正验证它是否正确。\n\
    \n识别和修复这些问题正是*Just JavaScript*的核心所在。我们将逐步构建（或可能重建）你关于JavaScript的心智模型，使其准确且有用。一个良好的心智模型将让你对自己的代码充满信心，并让你能够理解（并修复）别人编写的代码。\n\
    \n（顺便说一句，`a`是`0`而`b`是`10`是正确的答案。）\n\n# 快慢编程\n\n丹尼尔·卡尼曼的《思考，快与慢》一书探讨了人类在思考时使用的两种不同“系统”。\n\
    \n只要有可能，我们就会依赖“快”系统，它擅长模式匹配和“直觉反应”。我们与许多动物共享这个系统（这对于生存是必要的！），它赋予我们惊人的能力，比如走路而不摔倒。但它不擅长规划。\n\
    \n得益于大脑额叶的发展，人类还拥有一种独特的“慢”思考系统。这个“慢”系统负责复杂的逐步推理。它让我们能够规划未来事件、进行论证或遵循数学证明。\n\n\
    因为使用“慢”系统非常耗费心力，我们倾向于默认使用“快”系统——即使是在处理像编程这样的智力任务时。\n\n想象一下，你正忙于一大堆工作，想要快速识别这个函数的功能。看一眼：\n\
    \n```\nfunction duplicateSpreadsheet(original) {\n  if (original.hasPendingChanges)\
    \ {\n    throw new Error('You need to save the file before you can duplicate it.');\n\
    \  }\n  let copy = {\n    created: Date.now(),\n    author: original.author,\n\
    \    cells: original.cells,\n    metadata: original.metadata,\n  };\n  copy.metadata.title\
    \ = 'Copy of ' + original.metadata.title;\n  return copy;\n}\n```\n\n你可能已经注意到：\n\
    \n- 这个函数复制一个电子表格。\n- 如果原始电子表格未保存，它会抛出一个错误。\n- 它在新电子表格的标题前加上了“Copy of”。\n\n你可能*没有*注意到（如果你注意到了，干得好！）的是，这个函数*也*不小心更改了原始电子表格的标题。错过这样的错误是每个程序员每天都会发生的事情。\n\
    \n既然你知道存在一个bug，你会用不同的方式阅读代码吗？如果你一开始使用的是“快”思考系统，当你意识到代码中有bug时，你可能会切换到更费力的“慢”系统。\n\
    \n当我们使用“快”系统时，我们根据代码的整体结构、命名约定和注释来猜测代码的功能。使用“慢”系统时，我们逐步追溯代码的功能——这是一个费力且耗时的过程。\n\
    \n这就是为什么拥有一个准确的心智模型如此重要。在头脑中模拟计算机是困难的，当你不得不依赖“慢”思考系统时，你的心智模型就是你唯一可以依赖的东西。如果心智模型错误，你从根本上就会误解你的代码预期会产生什么结果，你所有的努力都将白费。\n\
    \n如果你完全找不到bug，请不要担心——这只是意味着你将从这门课程中获得最大收获！在接下来的模块中，我们将一起重建关于JavaScript的心智模型，这样你就能立即发现这样的错误。\n\
    \n在下一个模块中，我们将开始为一些最基本的JavaScript概念——值和表达式——构建心智模型。\n\n# 阅读完成？\n\n将此章节标记为已学习以跟踪你的进度。\n\
    \n标记为已学习\n\n下一个\n\n# JavaScript 宇宙 →\n\n# JavaScript 宇宙\n\n*太初有值。*\n\n*值*是什么？很难说。\n\
    \n几何学中的点是什么？人类语言中的词是什么？值是JavaScript中的一个基本概念——所以我们不能用其他术语来定义它。\n\n相反，我们将通过示例来定义它。数字和字符串是值。对象和函数也是值。\n\
    \n还有很多东西*不是*值，例如我们代码中的部分——比如我们的`if`语句、循环和变量声明。\n\n# 值与代码\n\n在我们开始构建心智模型时，我们需要澄清的第一个常见误解是：值*就是*我们的代码。相反，我们需要将它们分开思考——我们的代码与值交互，但值存在于一个完全独立的空间中。\n\
    \n为了区分我JavaScript程序中的值和代码，我喜欢想象安东尼·德·圣-埃克苏佩里《小王子》中的这幅画：\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_7_0.png)\n\
    \n我站在一个小星球上，拿着一份指令清单。这份清单就是我的程序——我的代码。当我阅读我的指令清单时，我可以看到很多事情正在发生——有`if`语句、变量声明、逗号和花括号。\n\
    \n我的代码包含像“进行函数调用”、“多次执行此操作”甚至“抛出错误”这样的指令。我从我的小世界表面一步一步地阅读这些指令。\n\n*但偶尔，我会抬起头。*\n\
    \n在一个晴朗的夜晚，我在JavaScript的天空中看到不同的值：布尔值、数字、字符串、符号、函数和对象、`null`和`undefined`——哦天哪！我可能会在我的代码中引用它们，但它们并不存在于*我的代码内部*。\n\
    \n*在我们的JavaScript宇宙中，值漂浮在空间中。*\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_8_0.png)\n\
    \n“等等，”你可能会说，“我一直认为值在我的代码内部！”在这里，我要求你相信我。还需要几个模块，这个心智模型才能显现其价值。[给它五分钟](http://example.com)。我知道自己在做什么。\n"
