    # # Recap


    +   * When reading `obj.something`, if `obj` doesn''t have a `something` property,
    JavaScript will look for `obj.__proto__.something`. Then it will look for `obj.__proto__.__proto__.something`,
    and so on, until it either finds our property or reaches the end of the prototype
    chain.

    * When writing to `obj.something`, JavaScript will usually write to the object
    directly instead of traversing the prototype chain.

    * We can use `obj.hasOwnProperty(''something'')` to determine whether our object
    has its own property called `something`.

    * We can "pollute" a prototype shared by many objects by mutating it. We can even
    do this to the Object Prototype—the default prototype for `{}` objects! (But we
    shouldn''t, unless we''re pranking our colleagues.)

    * You probably won''t use prototypes much directly in practice. However, they
    are fundamental to JavaScript objects, so it is handy to understand their underlying
    mechanics. Some advanced JavaScript features, including classes, can be expressed
    in terms of prototypes.


    # # Exercises


    This module also has exercises for you to practice!


    **Don''t skip them!**


    Even though you''re likely familiar with the concept of prototypes, these exercises
    will help you cement the mental model we''re building. We need this foundation
    before we can get to more complex topics.'
