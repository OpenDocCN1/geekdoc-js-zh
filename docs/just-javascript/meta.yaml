    \ objects pointing to the object we changed.\n\n## Possible Solution: Mutating\
    \ Another Object\n\nOne way to fix this would be to avoid mutating shared data:\n\
    \n```javascript\n// Replace Step 3 with this code:\njohn.surname = 'Lennon';\n\
    john.address = { city: 'Malibu' };\n```\n\nThe difference in the second line is\
