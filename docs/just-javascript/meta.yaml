    running some code.


    The question of whether a string already “exists” or is “created” is not something
    we can test from the code. *Inside* our mental model, this question doesn’t mean
    anything. We can’t set up an experiment to say whether strings “get created” or
    “get summoned” within our JavaScript universe.


    To keep our mental model simple, we will say that **all conceivable string values
    already exist from the beginning—one value for every distinct string**.


