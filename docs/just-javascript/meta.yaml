    \n## Functions are Values\n\nWe define functions so that we can call them later\
    \ and run the code inside them. However, to really understand functions in JavaScript,\
    \ we need to forget about *why* they're useful for a second. Instead, we will\
    \ think about functions as yet another kind of value: a number, an object, *a\
