  md: 'You see, JavaScript doesn''t implement the kind of math we use in real life.

    Floating-point math is “math for computers.” Don''t worry too much about this
    name or how it works exactly. Very few people know about all its subtleties, and
    that''s the point! It works well enough in practice that most of the time you
    won''t think about it. Still, let''s take a quick look at what makes it different.


    # Colors and Numbers


    Have you ever used a scanner to turn a physical photo or a document into a digital
    one? This analogy can help us understand JavaScript numbers.


    Scanners usually distinguish at most 16 million colors. If you draw a picture
    with a red crayon and scan it, the scanned image should come out red too—but it
    will have the closest red color our scanner picked from those 16 million colors.
    So if you have two red crayons with ever so slightly different colors, the scanner
    might be fooled into thinking their color is exactly the same!


    > We can say that a scanner uses colors with *limited precision*.


    Floating-point math is similar. In real math, there is an infinite set of numbers.
    But in floating-point math, **there are only 18 quintillion of them.** So when
    we write numbers in our code or do calculations with them, JavaScript picks the
    *closest* numbers that it knows about—just like our scanner does with colors.


    > In other words, JavaScript uses numbers with *limited precision*.


    We can imagine all of the JavaScript numbers on an axis. The closer we are to

    `0`, the more precision numbers have, and the closer they “sit” to each other:


    ![](img/5f506681f0d75d6067480d5c0ee322f2_45_0.png)'
