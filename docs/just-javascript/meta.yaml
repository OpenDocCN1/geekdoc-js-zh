    # Polluting the Prototype


    Now we know that all JavaScript objects get the same prototype by default. Let’s
    briefly revisit our example from the module about mutation:


    This picture gives us an interesting insight. If JavaScript searches for missing
    properties on the prototype, and most objects share the same prototype, can we
    make new properties “appear” on all objects by mutating that prototype?


    Let’s add these two lines of code:


    ```

    let obj = {};

    obj.__proto__.smell = ''banana'';

    ```


    We mutated the Object Prototype by adding a `smell` property to it. As a result,
    both detectives now appear to be using a banana-flavored perfume:


    ```

    console.log(sherlock.smell); // "banana"

    console.log(watson.smell); // "banana"

    ```


    Mutating a shared prototype like we just did is called *prototype pollution*.


    In the past, prototype pollution was a popular way to extend JavaScript with custom
    features. However, over the years, the web community realized that it is fragile
    and makes it hard to add new language features, so we prefer to avoid it.


