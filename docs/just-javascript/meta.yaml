  md: '# # Values and Code


    As we start building our mental model, one of the first common misconceptions
    we need to clear up is that values *are* our code. Instead, we need to think of
    them separately—our code interacts with values, but values exist in a completely
    separate space.


    To distinguish between values and code in my JavaScript program, I like to imagine
    this drawing of the Little Prince by Antoine de Saint-Exupéry:


    ![](img/5f506681f0d75d6067480d5c0ee322f2_7_0.png)


    I’m standing on a small planet, holding a list of instructions. This list is my
    program—my code. As I read through my list of instructions, I can see a lot going
    on—there are `if` statements, variable declarations, commas and curly braces.


    My code contains instructions like “make a function call,” “do this thing many
    times,” or even “throw an error.” I read through these instructions step by step
    from the surface of my little world.


    *But every once in a while, I look up.*'
