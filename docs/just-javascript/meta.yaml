    \ at the prototype.\n\n# The Prototype Chain\n\nA prototype isn't a special \"\
    thing\" in JavaScript. A prototype is more like a *relationship*. An object may\
    \ point to another object as its prototype.\n\nThis naturally leads to a question:\
    \ but what if my object's prototype has its own prototype? And that prototype\
    \ has *its own* prototype? Would that work?\n\nThe answer is yes—this is *exactly*\
    \ how it works!\n\n```\nlet mammal = {\n    brainy: true,\n};\n\nlet human = {\n\
    \    __proto__: mammal,\n    teeth: 32\n};\n\nlet gwen = {\n    __proto__: human,\n\
    \    age: 19\n};\n\nconsole.log(gwen.brainy); // true\n```"
  - "[PAGE 114]\n\nWe can see that JavaScript will search for the property on our\
    \ object, then on its prototype, then on *that* object's prototype, and so on.\
    \ We would only get `undefined` if we ran out of prototypes and still hadn't found\
    \ our property.\n\nThis is similar to saying, “I don’t know, but Alice might know.”\
    \ Then Alice might say, “Actually, I don’t know either—ask Bob.” Eventually, you\
    \ will either arrive at the answer or run out of people to ask!\n\nThis sequence\
    \ of objects to “visit” is known as our object’s *prototype chain*. (However,\
    \ unlike a chain you might wear, prototype chains can't be circular!)\n\n# Shadowing\n\
    \nConsider this slightly modified example:\n\n```\nlet human = {\n    teeth: 32\n\
    };\n\nlet gwen = {\n    __proto__: human,\n    // This object has its own teeth\
    \ property:\n    teeth: 31\n};\n```\n\nBoth objects define a property called `teeth`,\
    \ so the results are different:\n\n```\nconsole.log(human.teeth); // 32\nconsole.log(gwen.teeth);\
    \ // 31\n```\n\nNote that `gwen.teeth` is **31**. If `gwen` didn't have its own\
    \ `teeth` property, we would look at the prototype. But because the object that\
    \ `gwen` points to has its own `teeth` property, we don't need to keep searching\
    \ for the answer."
- md: "In other words, once we find our property, **we stop the search**.\n\nIf you\
    \ ever want to check if an object has its *own* property wire with a certain name,\
    \ you can call a built-in function called `hasOwnProperty`. It returns **true**\
    \ for \"own\" properties, and does not look at the prototypes. In our last example,\
    \ both objects have their own `teeth` wires, so it is **true** for both:\n\n```\n\
    console.log(human.hasOwnProperty('teeth')); // true\nconsole.log(gwen.hasOwnProperty('teeth'));\
    \ // true\n```\n\n## Assignment\n\nConsider this example:\n\n```\nlet human =\
    \ {\n  teeth: 32\n};\n\nlet gwen = {\n  __proto__: human,\n  // Note: no own teeth\
    \ property\n};\n\ngwen.teeth = 31;\n\nconsole.log(human.teeth); // ?\nconsole.log(gwen.teeth);\
    \ // ?\n```\n\nBefore the assignment, both expressions result in `32`.\n\nThen\
    \ we need to execute this assignment:\n\n```\ngwen.teeth = 31;\n```\n\nNow the\
    \ question is which wire does `gwen.teeth` correspond to? The answer is that,\
    \ generally speaking, assignments happen on the object itself.\n\nSo `gwen.teeth\
    \ = 31` creates a new own property called `teeth` on the object that `gwen` points\
    \ to. It doesn't have any effect on the prototype:\n\nAs a result, `human.teeth`\
    \ is still `32`, but `gwen.teeth` is now `31`:\n\n```\nconsole.log(human.teeth);\
    \ // 32\nconsole.log(gwen.teeth); // 31\n```\n\nWe can summarize this behavior\
    \ with a simple rule of thumb.\n\nWhen we *read* a property that doesn't exist\
    \ on our object, we'll keep looking for it on the prototype chain. If we don't\
    \ find it, we get `undefined`.\n\nBut when we *write* a property that doesn't\
    \ exist on our object, that *creates* the property on our object. Generally speaking,\
    \ prototypes will *not* play a role.\n\n## The Object Prototype\n\nThis object\
    \ doesn't have a prototype, right?\n\n```\nlet obj = {};\n```\n\nTry running this\
    \ in your browser's console:\n\n```\nlet obj = {};\nconsole.log(obj.__proto__);\
    \ // Play with it!\n```\n\nSurprisingly, `obj.__proto__` is not `null` or `undefined`!\
    \ Instead, you'll see a curious object with a bunch of properties, including `hasOwnProperty`.\n\
    \nWe're going to call that special object the Object Prototype:\n\nAt first, this\
    \ might be a bit mind-blowing. Let that sink in. All this time, we were thinking\
    \ `{}` created an \"empty\" object, but it's not so empty after all! It has a\
    \ hidden `__proto__` wire that points to the Object Prototype by default.\n\n\
    This explains why JavaScript objects seem to have \"built-in\" properties:\n\n\
    ```\nlet human = {\n  teeth: 32\n};\nconsole.log(human.hasOwnProperty); // (function)\n\
    console.log(human.toString); // (function)\n```\n\nThese \"built-in\" properties\
    \ are nothing more than normal properties on the Object Prototype. Because our\
    \ object's prototype is the Object Prototype, we can access them.\n\n## An Object\
    \ With No Prototype\n\nWe've just learned that all objects created with the `{}`\
    \ syntax have the special `__proto__` wire pointing to a default Object Prototype.\
    \ But we also know that we can customize the `__proto__`. You might wonder: can\
    \ we set it to `null`?\n\n```\nlet weirdo = {\n  __proto__: null\n};\n```\n\n\
    The answer is yes—this will produce an object that truly doesn't have a prototype\
    \ at all. As a result, it doesn't even have built-in object methods:\n\n```\n\
    console.log(weirdo.hasOwnProperty); // undefined\nconsole.log(weirdo.toString);\
    \ // undefined\n```\n\nYou probably won't want to create objects like this, however\
    \ the Object Prototype is exactly that—an object with no prototype.\n\n## Polluting\
    \ the Prototype\n\nNow we know that all JavaScript objects get the same prototype\
    \ by default. Let's briefly revisit our example from the module about mutation:\n\
    \nThis picture gives us an interesting insight. If JavaScript searches for missing\
    \ properties on the prototype, and most objects share the same prototype, can\
    \ we make new properties \"appear\" on all objects by mutating that prototype?\n\
    \nLet's add these two lines of code:\n\n```\nlet obj = {};\nobj.__proto__.smell\
    \ = 'banana';\n```\n\nWe mutated the Object Prototype by adding a `smell` property\
    \ to it. As a result, both detectives now appear to be using a banana-flavored\
    \ perfume:\n\n```\nconsole.log(sherlock.smell); // \"banana\"\nconsole.log(watson.smell);\
    \ // \"banana\"\n```\n\nMutating a shared prototype like we just did is called\
    \ *prototype pollution*.\n\nIn the past, prototype pollution was a popular way\
    \ to extend JavaScript with custom features. However, over the years, the web\
    \ community realized that it is fragile and makes it hard to add new language\
    \ features, so we prefer to avoid it.\n\nNow you can solve the pineapple pizza\
    \ puzzle from the beginning of this module! Check your solution in your console.\n\
    \n![](img/5f506681f0d75d6067480d5c0ee322f2_118_0.png)\n\n## Fun Fact\n\n**`__proto__`**\
    \ vs. **`prototype`**\n\nYou might be wondering: what in the world is the **`prototype`**\
    \ property? You might have seen it [in MDN documentation](https://developer.mozilla.org).\n\
    \nThe story around this is confusing. Before JavaScript added [classes](https://developer.mozilla.org),\
    \ it was common to write them as functions that produce objects, for example:\n\
    \n```\nfunction Donut() {\n  return { shape: 'round' };\n}\n\nlet donut = Donut();\n\
    ```\n\nYou'd want all donuts to share a prototype with some shared methods. However,\
    \ manually adding **`__proto__`** to every object looks gross:\n\n```\nfunction\
    \ Donut() {\n  return { shape: 'round' };\n}\n\nlet donutProto = {\n  eat() {\n\
    \    console.log('Nom nom nom');\n  }\n};\n\nlet donut1 = Donut();\ndonut1.__proto__\
    \ = donutProto;\nlet donut2 = Donut();\ndonut2.__proto__ = donutProto;\n\ndonut1.eat();\n\
    donut2.eat();\n```\n\nAs a shortcut, adding **`.prototype`** on the function itself\
    \ and adding **`new`** before your function calls would automatically attach the\
    \ **`__proto__`**:\n\n```\nfunction Donut() {\n  return { shape: 'round' };\n\
    }\nDonut.prototype = {\n  eat() {\n    console.log('Nom nom nom');\n  }\n};\n\n\
    let donut1 = new Donut(); // __proto__: Donut.prototype\nlet donut2 = new Donut();\
    \ // __proto__: Donut.prototype\n\ndonut1.eat();\ndonut2.eat();\n```\n\nNow this\
    \ pattern has mostly fallen into obscurity, but you can still see **prototype**\
    \ property on the built-in functions and even on classes. To conclude, a function's\
    \ **prototype** specifies the `__proto__` of the objects created by calling that\
    \ function with a **new** keyword.\n\n## Why Does This Matter?\n\nIn practice,\
    \ you probably won't use prototypes in your code directly. (In fact, even using\
    \ the `__proto__` syntax is [discouraged](https://example.com/discouraged).)\n\
    \nPrototypes are unusual—most frameworks never embraced them as a paradigm. Still,\
    \ you will notice prototypes hiding \"beneath the surface\" of other JavaScript\
    \ features. For example, people often use prototypes to create a traditional \"\
    class inheritance\" model that's popular in other programming languages.\n\nThis\
    \ became so common that JavaScript added a class syntax as a convention that \"\
    hides\" prototypes out of sight. To see it in action, look at this [snippet](https://example.com/snippet)\
    \ of a JavaScript class rewritten with `__proto__` for a comparison.\n\nPersonally,\
    \ I don't use a lot of classes in my daily coding, and I rarely deal with prototypes\
    \ directly either. However, it helps to know how those features build on each\
    \ other, and it's important to know what happens when I read or set a property\
    \ on an object.\n\n## Recap\n\n- When reading `obj.something`, if `obj` doesn't\
    \ have a `something` property, JavaScript will look for `obj.__proto__.something`.\
    \ Then it will look for `obj.__proto__.__proto__.something`, and so on, until\
    \ it either finds our property or reaches the end of the prototype chain.\n- When\
    \ writing to `obj.something`, JavaScript will usually write to the object directly\
    \ instead of traversing the prototype chain.\n- We can use `obj.hasOwnProperty('something')`\
    \ to determine whether our object has its own property called `something`.\n-\
    \ We can \"pollute\" a prototype shared by many objects by mutating it. We can\
    \ even do this to the Object Prototype—the default prototype for `{}` objects!\
    \ (But we shouldn't, unless we're pranking our colleagues.)\n- You probably won't\
    \ use prototypes much directly in practice. However, they are fundamental to JavaScript\
    \ objects, so it is handy to understand their underlying mechanics. Some advanced\
    \ JavaScript features, including classes, can be expressed in terms of prototypes.\n\
    \n## Exercises\n\nThis module also has exercises for you to practice!\n\n**Don't\
    \ skip them!**\n\nEven though you're likely familiar with the concept of prototypes,\
    \ these exercises will help you cement the mental model we're building. We need\
    \ this foundation before we can get to more complex topics."
  mdcn: "\n换句话说，一旦我们找到了属性，**我们就停止搜索**。\n\n如果你想检查一个对象是否拥有名为 *自身的* 属性 `wire`，可以调用一个名为\
    \ `hasOwnProperty` 的内置函数。它对于\"自有\"属性返回 **true**，并且不会查看原型。在上一个例子中，两个对象都有自己的 `teeth`\
    \ `wire`，所以对两者都是 **true**：\n\n```\nconsole.log(human.hasOwnProperty('teeth'));\
    \ // true\nconsole.log(gwen.hasOwnProperty('teeth')); // true\n```\n\n## 赋值\n\n\
    考虑这个例子：\n\n```\nlet human = {\n  teeth: 32\n};\n\nlet gwen = {\n  __proto__: human,\n\
    \  // 注意：没有自己的 teeth 属性\n};\n\ngwen.teeth = 31;\n\nconsole.log(human.teeth); //\
    \ ?\nconsole.log(gwen.teeth); // ?\n```\n\n在赋值之前，两个表达式的结果都是 `32`。\n\n然后我们需要执行这个赋值：\n\
    \n```\ngwen.teeth = 31;\n```\n\n现在的问题是 `gwen.teeth` 对应的是哪个 `wire`？答案是，一般来说，赋值操作发生在对象自身上。\n\
    \n所以 `gwen.teeth = 31` 会在 `gwen` 指向的对象上创建一个名为 `teeth` 的新自有属性。它对原型没有任何影响：\n\n结果是，`human.teeth`\
    \ 仍然是 `32`，但 `gwen.teeth` 现在是 `31`：\n\n```\nconsole.log(human.teeth); // 32\n\
    console.log(gwen.teeth); // 31\n```\n\n我们可以用一个简单的经验法则来总结这种行为。\n\n当我们*读取*一个不存在于我们对象上的属性时，我们会沿着原型链继续查找。如果我们找不到，就会得到\
    \ `undefined`。\n\n但当我们*写入*一个不存在于我们对象上的属性时，那会*创建*这个属性在我们的对象上。一般来说，原型*不会*发挥作用。\n\
    \n## 对象原型\n\n这个对象没有原型，对吧？\n\n```\nlet obj = {};\n```\n\n在你的浏览器控制台里试试运行这个：\n\n\
    ```\nlet obj = {};\nconsole.log(obj.__proto__); // 摆弄一下它！\n```\n\n令人惊讶的是，`obj.__proto__`\
    \ 不是 `null` 也不是 `undefined`！相反，你会看到一个奇怪的对象，带有一堆属性，包括 `hasOwnProperty`。\n\n我们将这个特殊对象称为对象原型：\n\
    \n起初，这可能有点颠覆认知。让它沉淀一下。一直以来，我们都认为 `{}` 创建了一个\"空\"对象，但它其实并不空！它有一个隐藏的 `__proto__`\
    \ `wire`，默认指向对象原型。\n\n这解释了为什么 JavaScript 对象似乎拥有\"内置\"属性：\n\n```\nlet human = {\n\
    \  teeth: 32\n};\nconsole.log(human.hasOwnProperty); // (function)\nconsole.log(human.toString);\
    \ // (function)\n```\n\n这些\"内置\"属性不过是对象原型上的普通属性。因为我们的对象的原型是对象原型，所以我们可以访问它们。\n\n\
    ## 没有原型的对象\n\n我们刚刚了解到，所有用 `{}` 语法创建的对象都有一个特殊的 `__proto__` `wire`，指向一个默认的对象原型。但我们也知道可以自定义\
    \ `__proto__`。你可能想知道：我们能把它设置为 `null` 吗？\n\n```\nlet weirdo = {\n  __proto__: null\n\
    };\n```\n\n答案是肯定的——这将产生一个真正没有原型的对象。因此，它甚至没有内置的对象方法：\n\n```\nconsole.log(weirdo.hasOwnProperty);\
    \ // undefined\nconsole.log(weirdo.toString); // undefined\n```\n\n你可能不想创建这样的对象，然而对象原型正是如此——一个没有原型的对象。\n\
    \n## 污染原型\n\n现在我们知道所有 JavaScript 对象默认获得相同的原型。让我们简要回顾一下关于突变的模块中的例子：\n\n这张图片给了我们一个有趣的洞察。如果\
    \ JavaScript 在原型上查找缺失的属性，并且大多数对象共享同一个原型，我们能否通过突变那个原型，让新属性在所有对象上\"出现\"？\n\n让我们添加这两行代码：\n\
    \n```\nlet obj = {};\nobj.__proto__.smell = 'banana';\n```\n\n我们通过向对象原型添加一个 `smell`\
    \ 属性来突变它。结果是，两个侦探现在似乎都使用了香蕉味的香水：\n\n```\nconsole.log(sherlock.smell); // \"banana\"\
    \nconsole.log(watson.smell); // \"banana\"\n```\n\n像我们刚才那样突变共享的原型称为*原型污染*。\n\n\
    过去，原型污染是扩展 JavaScript 添加自定义功能的流行方式。然而，多年来，网络社区意识到它很脆弱，并且使得添加新语言特性变得困难，所以我们倾向于避免它。\n\
    \n现在你可以解决本模块开头的菠萝披萨谜题了！在你的控制台中检查你的解决方案。\n\n![](img/5f506681f0d75d6067480d5c0ee322f2_118_0.png)\n\
    \n## 有趣的事实\n\n**`__proto__`** vs. **`prototype`**\n\n你可能想知道：**`prototype`** 属性到底是什么？你可能在\
    \ [MDN 文档](https://developer.mozilla.org)中见过它。\n\n这背后的故事很混乱。在 JavaScript 添加 [类](https://developer.mozilla.org)\
    \ 之前，通常将它们写成产生对象的函数，例如：\n\n```\nfunction Donut() {\n  return { shape: 'round'\
    \ };\n}\n\nlet donut = Donut();\n```\n\n你可能希望所有甜甜圈都共享一个带有某些共享方法的原型。然而，手动向每个对象添加\
    \ **`__proto__`** 看起来很丑陋：\n\n```\nfunction Donut() {\n  return { shape: 'round'\
    \ };\n}\n\nlet donutProto = {\n  eat() {\n    console.log('Nom nom nom');\n  }\n\
    };\n\nlet donut1 = Donut();\ndonut1.__proto__ = donutProto;\nlet donut2 = Donut();\n\
    donut2.__proto__ = donutProto;\n\ndonut1.eat();\ndonut2.eat();\n```\n\n作为一个捷径，添加\
    \ **`.prototype`** 到函数本身，并在函数调用前添加 **`new`**，将自动附加 **`__proto__`**：\n\n```\nfunction\
    \ Donut() {\n  return { shape: 'round' };\n}\nDonut.prototype = {\n  eat() {\n\
    \    console.log('Nom nom nom');\n  }\n};\n\nlet donut1 = new Donut(); // __proto__:\
    \ Donut.prototype\nlet donut2 = new Donut(); // __proto__: Donut.prototype\n\n\
    donut1.eat();\ndonut2.eat();\n```\n\n现在这种模式大部分已经过时了，但你仍然可以在内置函数甚至类上看到 **prototype**\
    \ 属性。总之，一个函数的 **prototype** 指定了用 **new** 关键字调用该函数创建的对象的 `__proto__`。\n\n## 为什么这很重要？\n\
    \n在实践中，你可能不会在代码中直接使用原型。（事实上，甚至使用 `__proto__` 语法也是 [不被鼓励的](https://example.com/discouraged)。)\n\
    \n原型是不寻常的——大多数框架从未将它们作为一种范式来接受。尽管如此，你会注意到原型隐藏在其他 JavaScript 特性的\"表面之下\"。例如，人们经常使用原型来创建在其他编程语言中流行的传统的\"\
    类继承\"模型。\n\n这变得如此普遍，以至于 JavaScript 添加了类语法作为一种惯例，将原型\"隐藏\"起来。要看它的实际效果，请查看这个用 `__proto__`\
    \ 重写的 JavaScript 类的[代码片段](https://example.com/snippet)以进行比较。\n\n就我个人而言，我在日常编码中不经常使用类，也很少直接处理原型。然而，了解这些功能如何相互构建是有帮助的，并且了解当我读取或设置对象属性时会发生什么很重要。\n\
    \n## 回顾\n\n- 当读取 `obj.something` 时，如果 `obj` 没有 `something` 属性，JavaScript 会查找 `obj.__proto__.something`。然后它会查找\
    \ `obj.__proto__.__proto__.something`，依此类推，直到它找到我们的属性或到达原型链的末端。\n- 当写入 `obj.something`\
    \ 时，JavaScript 通常会直接写入对象，而不是遍历原型链。\n- 我们可以使用 `obj.hasOwnProperty('something')`\
    \ 来确定我们的对象是否拥有名为 `something` 的自身属性。\n- 我们可以通过突变一个被许多对象共享的原型来\"污染\"它。我们甚至可以对对象原型做这件事——`{}`\
    \ 对象的默认原型！（但我们不应该这样做，除非我们想捉弄我们的同事。）\n- 在实践中，你可能不会经常直接使用原型。然而，它们是 JavaScript 对象的基础，因此了解它们的底层机制很方便。一些高级\
    \ JavaScript 特性，包括类，都可以用原型来表达。\n\n## 练习\n\n这个模块也有供你练习的习题！\n\n**不要跳过它们！**\n\n即使你可能熟悉原型的概念，这些练习将帮助你巩固我们正在构建的心智模型。在我们能够进入更复杂的话题之前，我们需要这个基础。\n"
