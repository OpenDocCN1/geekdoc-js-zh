    ![](Image00005.jpg)


    # Introduction to JavaScript


    JavaScript is an interpreted programming language, built on the ECMAScript standard.
    The language definition is really broad since it can be defined as procedural
    language based on prototypes, imperative, weakly typed, and dynamic.


    JavaScript is mainly used as a client-side programming language implemented as
    part of a web browser to allow developers an improved way to implement user interface
    and dynamic features in web pages, although there are implementations of JavaScript
    on the server side (SSJS) the popularity of the language is due to the client-side
    implementations alone. JavaScript can also be found outside web applications,
    for example as a way to add interactivity to PDF documents and desktop widgets.


    JavaScript was designed with a similar syntax as C, although it takes names and
    conventions from the Java language. However, despite the name Java and JavaScript
    are not related and have different semantics and purposes.


    JavaScript was originally developed by Brendan Eich of Netscape under the name
    Mocha, which was later renamed to LiveScript, to finally being called JavaScript.
    The name coincided approximately with the moment in which Netscape added support
    for Java technology in its web browser Netscape Navigator version 2.0B3 in late
    1995. The name JavaScript was confusion, giving the impression that the language
    is an extension of Java, and it has been characterized by many as a marketing
    strategy for Netscape to gain prestige and innovate in what were the new web programming
    languages.


    The following year Microsoft implemented a similar client-side programming language
    as part of its Internet Explorer 3.0 web browser. Microsoft called its client-side
    language "script", to avoid problems related to the brand. The Script term seems
    so similar that both "javascript" and "script" are often used interchangeably,
    but the specification of Jscript is not 100% compatible with the ECMA.


    To avoid these incompatibilities, the World Web Consortium (W3C) designed the
    standard Document Object Model (DOM, or document model), which was implemented
    in Internet Explorer 6 and Navigator version 7, Mozilla first, and modern browsers
    thereafter. In 1997 there was proposal to submit JavaScript to the European Computer
    Manufacturers ECMA, which its name is not European but based in Gen. In 1997,
    it was adopted as an ECMA standard. JavaScript also became an ISO standard because
    of standard JavaScript became the most used programming language.


    Note: JavaScript is a registered trademark of Oracle Corporation. It is used under
    products created by Netscape Communications and entities such as the Mozilla Foundation.


    # Uses of JavaScript


    JavaScript is present in most web pages today. Chances are that the page you are
    looking at now contains the code for JavaScript. Try this activity: Right-click
    on a web page, then click ''View Source''. You should be able to find the word
    JavaScript somewhere in the code of the page.


    While HTML markup language allows web developers to format content, JavaScript
    allows them to make the page dynamic. For example, HTML allows for making text
    bold, creating text boxes, and creating buttons, whereas JavaScript allows for
    changing text on the page, creating pop-up messages, and validating text in boxes
    to make sure required fields have been filled. JavaScript makes web pages more
    dynamic by allowing users to interact with web pages, click on elements, and change
    the pages.


    ## What JavaScript can do for you


    Let’s take a step back and count the merits of JavaScript:


    JavaScript is very easy to implement. All you need to do is put your code in the
    HTML document and tell the browser that it is JavaScript.


    JavaScript works on web users’ computers - even when they are offline!


    JavaScript allows you to create highly responsive interfaces that improve the
    user experience and provide dynamic functionality, without having to wait for
    the server to react and show another page. JavaScript can load content into the
    document if the user needs it, without reloading the entire page — this is commonly
    referred to as Ajax.


    JavaScript can test for what is possible in your browser and help fix bugs or
    layout issues in browsers. That is a lot for a language that until recently was
    called “high programming”. On the web today we are building more and more applications
    these days, and high interactivity requires Flash (or other plugins). JavaScript
    is arguably the best way to, as it is a web standard, it is supported natively
    across browsers (or less — some things differ), and it is compatible with other
    standards.


    ## Common uses of JavaScript


    The use of JavaScript has changed over the years. At first, JavaScript interaction
    with the site was mostly limited to interacting with forms, giving feedback to
    the user. We used `alert()` to notify the user of something (see Figure 1), `confirm()`
    to ask if something is OK or not and `prompt()` or a form field to get input.


    ![](Image0000.jpg) Figure 1: Telling the end about errors using an `alert()` statement
    was all we could do in the early days of JavaScript. Neither pretty nor subtle.


    This led mostly to validation scripts that stopped the user to send a form to
    the server when there was a mistake, and simple converters and calculators. In
    addition, we also managed to build highly useless things like prompts asking the
    user for their name just to print it out immediately afterwards.


    Another thing used was `document.write()` to add content to the document. We also
    worked with pop windows and frames and lost many a nerve and pulled out hair trying
    to make them talk to each other. Thinking about most of these technologies should
    make any developer rock forward and backward and curl up into a fetal position
    stating “make them go away”, so let''s not dwell on things — there are better
    ways to use JavaScript!


    ## Enter DOM scripting


    When browsers started supporting and implementing the Document Object Model (DOM),
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.


    The DOM is an object representation of the document. The previous paragraph for
    example (check out source using view source) in DOM is an element node with `tagName`
    of `p`. It contains three child nodes — a text node containing “When browsers
    started supporting and implementing the ” which allows us to have much richer
    interaction with web pages, JavaScript started to get more interesting.” an element
    node with `tagName` of `a`, and another text node. The `a` child node also has
    an attribute node called `href` with a value and a child node that is a text node
    with `nodeValue` of “Document Object Model(DOM)”.


    You could also represent this visually using a tree diagram, as seen in Figure
    2.


    ![](Image0001.jpg) Figure 2: A visual representation of our sample DOM tree.


    In human words you can say that the DOM explains both the types, the values and
    the hierarchy of everything in the document — you don’t need to know anything
    more for now.

