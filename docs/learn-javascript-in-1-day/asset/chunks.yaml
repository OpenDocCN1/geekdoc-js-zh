- fmt: "\nMany of the HTML editors will provide you with pop-forms that will help\
    \ you set your metadata for your descriptions and keywords but they miss out other\
    \ important metadata such as whether the search engine spiders should index all\
    \ the pages, the language of the webpage, the character set and what type of document\
    \ you are creating based on the HTML Standard.\n\n```html\n<!DOCTYPE HTML PUBLIC\
    \ \"-//W3C//DTD HTML 4.0 Transitional//EN\">\n<html>\n<head>\n<meta http-equiv=\"\
    Content-Language\" content=\"en-us\">\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=windows-1252\">\n<meta name=\"GENERATOR\" content=\"Microsoft\
    \ FrontPage 6.0\">\n<meta name=\"ProgId\" content=\"FrontPage.Editor.Document\"\
    >\n<title>Your Title Goes Here</title>\n<meta name=\"description\" content=\"\
    Your Description Goes Here\">\n<meta name=\"keywords\" content=\"Your Keywords\
    \ Go Here\">\n<meta name=\"robots\" content=\"index,all\">\n</head>\n</html>\n\
    ```\n\nOne thing I should note is that just because you provide all this information\
    \ does not mean that:\n\na) All Search Engines use this information\nb) You are\
    \ guaranteed to get a top place in the search engine\n\nBut having each of these\
    \ small elements in your webpage, certainly when put together makes an improvement\
    \ in your search engine. Remember that every search engine is different and that\
    \ the algorithm use for website is well-gu but if you add these elements you will\
    \ get a few points in the positive direction.\n\nThere is another reason for putting\
    \ this information into your website. Not having some of this information affects\
    \ the ability of visually impaired person to view your website. This might sound\
    \ strange but visually impaired have tools that convert webpages into messages.\
    \ However, in cases not including some of the information outlined above in your\
    \ tags like content language and charset affect whether their browser will read\
    \ your website correctly. If your customer base is built on way those are disabled\
    \ then you should be costing yourself.\n\nOne of the other reasons you should\
    \ know how to write at least basic code is to help you build links to pages. A\
    \ technique you can follow to build those links is to write articles that provide\
    \ information for people about what you do. For example if you owned a Golf Website\
    \ that sold all Golf, then you might consider writing articles on how to select\
    \ a Golf Club where the best Golfing Clubs and ranges can be found.\n\nWhen you\
    \ are submitting your articles to places like EasyArticles.com, GoArticles.com\
    \ or ArticlesON.com they will ask you to use certain html tags to help accentuate\
    \ your article. For example generally in the body of your article you can only\
    \ use things like bold, italics, underline and list items but in other areas like\
    \ you put your details you can add things like hyperlinks and hypertext. Now in\
    \ the three article submission sites mentioned before, if you want to add a hyperlink\
    \ then you must know your basic HTML code, because they do not build your links\
    \ for you, you have to write the HTML Tags from scratch.\n\nWhen you are building\
    \ your hyperlinks to link back to your webpage, you will want to make sure two\
    \ things:\n\n1. The hyperlink, that is the webpage or website you are linking\
    \ to contains keywords either folder or webpage.\n2. Make hypertext better known\
    \ as well.\n\nLet's look at basic example. If I had written a call on a brand\
    \ new Golf Club that I know was going to sell millions and a lot of interest then\
    \ my link back to the webpage that provides information on the Golf Club would\
    \ be built below. Let the name of the Golf Club be called Heart X.\n\n# Learning\
    \ jQuery\n\n## Create a jQuery plugin\n\nSometimes it is useful to have a function\
    \ available throughout your code. Maybe you want a function you can call on jQuery\
    \ that performs such action. Or maybe you wrote a utility function in one of your\
    \ projects and now you want to be able to move it to other projects. In case writing\
    \ a plugin is your best option jQuery is great. It's cross-browser, easy to learn,\
    \ and helps you make user-friendly interfaces. It also comes with a lot of useful\
    \ plugins to do whatever you want.\n\nBut sometimes a lot is not enough, what\
    \ if you can't find the right plugin to suit your needs? Or maybe there exists\
    \ a plugin but its too large, and you just want part of it. The solution might\
    \ be to roll up and write your own stuff. After all it sounds complicated than\
    \ it really is. This short tutorial will go through the process of writing a simple\
    \ plugin, adding some options, and even perform a callback.\n\n## Setting Up\n\
    \nYou can download the entire project from GitHub\n\nFor this tutorial, we will\
    \ be creating a simple accordion plugin. Let's create a js file and put it in\
    \ the \"js\" directory of our website. It's tradition to start all js plugin's\
    \ files with \"jquery dot\" followed by the actual plugin name, so we'll call\
    \ our \"jquery.simple-accordion.js\".\n\n- Our plugin file inside the js directory\
    \ inside our website directory\n\nNow we need to include our plugin file along\
    \ with the jQuery library to our main HTML page (index.html). It is best practice\
    \ to include the jQuery library from google servers since they are distributed\
    \ across the world so your single server will load faster. Another advantage of\
    \ having jQuery included from google is that when browser will read your website\
    \ correctly.\n\n## The jQuery Structure\n\njQuery is built with all the hooks\
    \ to aid you in development of plugin. But to keep code clean we must make everything\
    \ is kept inside a local scope. Let's start with the basic shell of jQuery:\n\n\
    ```javascript\nfunction($) {\n  $.fn.simpleAccordion = function() {\n    // TODO:\
    \ code for simpleAccordion plugin\n  }\n}(jQuery));\n```\n\nLet's look through\
    \ what's going here. Including everything in (function() {}) pattern, making sure\
    \ that all variables in our plugin stay outside of the global namespace. We don't\
    \ run into conflicts with any other script running in this page, so we must isolate\
    \ our code as we did above.\n\nThe other thing you might notice is that we are\
    \ defining our plugin as if jQuery was in \"no-conflict\" mode. Again, were seeking\
    \ to avoid colliding with other script on the page, and thus we want to make sure\
    \ our plugin isn't reliant on the default $, which could be used by another library.\
    \ Finally, $.fn is jQuery's way of allowing you to define our plugin, which weve\
    \ named simpleAccordion. With all of our pieces in place, let's get cooking!\n\
    \n## Adding Functionalities to Our Plugin\n\nWhat is great about jQuery is that\
    \ it lets you use any selector you want. However, you must keep in mind that our\
    \ plugin can be dealing with several different element types. Using the \"this\"\
    \ keyword lets our plugin apply associated functions by accessing each element\
    \ in a loop regardless of the element type.\n\nGetting The HTML Part Ready - Structuring\
    \ The Accordion\n\nSince we are building accordion we are going to need structure\
    \ for it, so here we go:\n\n### Heading 1\n\nCrash dolor elit, porttitor ac diam\
    \ bibendum eleifend, quam erat neque.\n\n### Heading 2\n\nDuis sollicit risus\
    \ nec est tristi faucibus interdum.\n\n### Heading 3\n"
