    Here’s how it works. HTML tags create objects; JavaScript lets you manipulate
    those objects. For example, you use the `<BODY>` and `</BODY>` tags to create
    a Web page, or document. As shown in Table 1, after that document is created,
    you can interact with it using JavaScript. For example, you can use a special
    JavaScript construct called the `onload` event handler to trigger an action —
    play a little welcoming tune, perhaps — when the document is loaded onto a Web
    browser. Examples of other HTML objects that you interact using JavaScript include
    windows, text fields, images, and embedded Java apps.


    ### Table 1: Creating and Working with Objects


    ![](Image00003.jpg)


    To add JavaScript to a Web page, all you have to do is embed JavaScript code in
    an HTML file. Below the line in which you embed the JavaScript code, you can reference,
    or call, that JavaScript code in response to an event handler or an HTML link.


    You have two choices when it comes to embedding JavaScript code in an HTML file:


    1. You can use the `<SCRIPT>` and `</SCRIPT>` tags to include JavaScript code
    directly into an HTML file.

    2. In the example below, a JavaScript function called `processOrder()` is defined
    at the top of the HTML file. Further down in the HTML file, the JavaScript function
    is associated with an event handler — specifically, the `processOrder` button’s
    `onclick` event handler. (In other words, the JavaScript code contained in the
    `processOrder()` function runs when a user clicks the processOrder button.)


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript"> // JavaScript statements go here


    function processOrder() {

    // More JavaScript statements go here }

    </SCRIPT>

    </HEAD>

    <BODY>

    <FORM NAME="myForm">

    <INPUT TYPE="button" NAME="processOrder" VALUE="Click to process your order" onclick="processOrder();">

    …

    </BODY>

    </HTML>

    ```


    You can use the `<SCRIPT>` and `</SCRIPT>` tags to include a separate, external
    JavaScript file (a file containing only JavaScript statements and bearing a `.js`
    extension) into an HTML file.


    In the example below, the JavaScript `processOrder()` function is defined in `myJS.js`.
    The function is triggered, or called, when the user clicks the Click here Process
    Order link.


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript" SRC="myJS.js"></SCRIPT>

    </HEAD>

    <BODY>

    <A HREF="javascript:processOrder()">Click here to Process Order</A>

    </BODY>

    </HTML>

    ```


    Web pages aren’t made of HTML alone, JavaScript provides more than just HTML objects.
    JavaScript provides objects to browser plugins (such as Reader and Acrobat), the
    name and version of your browser, and current objects you can work with JavaScript.
    Together, all the objects that make up a site — HTML objects, browser plugins,
    and special objects built into the JavaScript language — are known as the document
    model (DOM).


