    \ {\n if(sheet.insertRule) {\nsheet.insertRule(selector + \"{\" + rules + \"}\"\
    , index);\n} else {\nsheet.addRule(selector, rules);\n}\n}\naddCSSRule(document.styleSheets[0],\
    \ \"header\", \"float: left\");\n```\n\nThe most common use case is creating a\
    \ new stylesheet, but if you want to modify an existing stylesheet, go for it.\n\
    \n## Load CSS Files with a Loader\n\nLazy-loading resources like images, JSON,\
    \ and scripts is a great way to decrease load time. We can load those external\
