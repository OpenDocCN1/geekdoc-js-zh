    \ JavaScript 原型属性在后台通过 jQuery 的属性 `fn` 使用，`fn` 是原生 JavaScript 原型属性的 jQuery 别名。\n\
    \n简单来说，你通过 `.yourplugin-name` 从 jQuery 扩展你的插件。此外，你还可以为插件添加选项。jQuery 插件包含默认选项。选项是可以传递给插件的参数。与其将一切都作为对象发送，你可以发送多个属性，这是\
    \ jQuery 的标准做法。在插件遵循选项时，最佳实践是使用默认选项。让我们快速为插件添加一些选项，展示我们如何使用 `option:false` 的默认值：因此，如果没有传递任何选项，插件将假设你希望在首次加载时折风琴是关闭的。当插件接收到选项时，你可以依靠\
    \ `.extend` 方法来实现实际的覆盖。`.extend` 方法的作用是合并或多个对象。\n\n# JavaScript 和 CSS\n\nCSS 和\
    \ JavaScript：这两者的界限似乎随着每个浏览器的发布而变得模糊。它们的工作一直非常不同，但最终它们都是前端技术，因此它们需要紧密配合。我们有 .js\
    \ 文件和 .css 文件，但这并不意味着 CSS 和 JS 无法进行比基础 JavaScript 框架允许的更紧密的交互。这里是 JavaScript 和\
    \ CSS 协作工作的五种你可能不知道的方式！\n\n## 使用 JavaScript 获取伪元素属性\n\n我们知道可以通过 `style` 属性获取元素的基本样式值，但伪元素属性呢？是的，JavaScript\
    \ 甚至可以访问它们！\n\n```javascript\n// 获取 element:before 的颜色值\nvar color = window.getComputedStyle(document.querySelector('element'),\
    \ ':before').getProperty('color');\n// 获取 element:before 的内容\nvar content = window.getComputedStyle(document.querySelector('element'),\
    \ ':before').getProperty('content');\n```\n\n## classList API\n\n我们都在喜爱的库中使用过\
    \ `add`、`remove` 和 `toggle`。为了支持旧版浏览器，库会获取元素的类名（字符串格式）并添加/删除类名，然后更新类。这是一个用于添加、删除和切换类的较新\
    \ API，它被称为 `classList`：\n\n```javascript\nclassList.add('classList'); // 添加类\n\
    classList.remove('classList'); // 删除类\nclassList.toggle('classList'); // 切换类\n\
    ```\n\n`classList` 在大多数浏览器中已经实现了很长时间，但这个 API 直到 IE 10 才出现。\n\n## 直接向样式表添加和删除规则\n\
    \n我们都习惯了通过 `element.style` 方法修改样式，并使用 JavaScript 工具包来完成，但你知道你实际上可以读取和写入新旧样式表中的规则吗？这个\
    \ API 实际上非常简单！\n\n```javascript\nfunction addCSSRule(sheet, selector, rules, index)\
    \ {\n if(sheet.insertRule) {\nsheet.insertRule(selector + \"{\" + rules + \"}\"\
    , index);\n} else {\nsheet.addRule(selector, rules);\n}\n}\naddCSSRule(document.styleSheets[0],\
    \ \"header\", \"float: left\");\n```\n\n最常见的用例是创建一个新的样式表，但如果你想修改现有的样式表，尽管去吧。\n\
    \n## 使用加载器加载 CSS 文件\n\n懒加载图像、JSON 和脚本等资源是缩短加载时间的极方法。我们可以使用 JavaScript 加载器（如 curl.js）加载这些外部资源，但你你知道可以懒加载样式表并在同一个回调中获取通知吗？\n\
    \n```javascript\ncurl( [\n  \"namespace/MyWidget\",\n  \"css!namespace/resources/MyWidget.css\"\
    \n],\nfunction(MyWidget) {\n  // 对 MyWidget 进行操作\n  // CSS 引用不在签名中，因为我们不在乎它； //\
    \ 我们只在乎它已经在页面上了\n});\n```\n\n# CSS 基础\n\n## CSS pointer-events\n\nCSS `pointer-events`\
    \ 属性几乎像 JavaScript 一样运行，在值为 `none` 时禁用元素。你可能会说“那怎样”，但 `pointer-events` 甚至可以阻止事件触发。\n\
    \n```css\n.disabled { pointer-events: none; }\n```\n\n该包可以通过 bower `bower install\
    \ css-essentials` 获取或使用 `<link rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/cssessentials.css\"\
    >` 或通过 npm 获取\n\n我们确定比通常的 3-4 个断点才能真正将设计调整到所有屏幕。因此，我们定义了以下断点：\n\n@of-xsm: 460px;\
    \ @of-sm: 606px; @of-md: 800px; @of-lg: 1164px; @of-xlg: 1440px; @of-xxlg: 1740px;\n\
    \n"
- fmt: "\nBy default, row has 24px padding on the side (on xxsm screens is 0, on xsm\
    \ screens is 12px) and each column has 12px padding in between. Row padding can\
    \ be omitted using `.of-row-no-padding`.\n\n## Loading spinner\n\nLoading spinner\
    \ can be used to indicate loading.\n\nQuick start:\n\n```html\n<div class=\"of-row\"\
    >\n  <div class=\"xxsm-col-24\">\n    <div id=\"loading-bar-spinner\">\n     \
    \ <div class=\"spinner-icon\"></div>\n    </div>\n  </div>\n</div>\n```\n\n##\
    \ Truncate text\n\nTruncate text is useful when you want to display text in one\
    \ line and truncate it, if it exceeds the width of a line.\n\nQuick start:\n\n\
    ```html\n<div class=\"of-row\">\n  <div class=\"xxsm-col-12\">\n    <div class=\"\
    truncate-text\">\n      Lorem ipsum dolor sit amet, consectetur adipiscing elit.\
    \ Fusce non elit eget turpis porttitor blandit non as felis. In consequat, ligula\
    \ eu condimentum commodo, mi sapien suscipit metus, as laoreet lorem enim id nulla.\
    \ Phaseellus at tincidunt quam, as auctor ex. Aenean sed gravida orci, vitae tristique\
    \ ante. Suspendisse vestibulum eros orci, vitae bibendum mi ullamcorper et. Nulla\
    \ ultises elementum ipsum, quis congue est molestie vel. Vestibulum ante primis\
    \ in faucibus orci luctus et ultises posuere cubilia Curae; Pellentesque sed elit\
    \ cursus. Duis sodales urna pellentesque feugiat maximus. Quisque viver libero\
    \ eu convallis malesuada. Sed sodales varius aculis. Phaseellus cursus pulvinar\
    \ magna, element arcu blandit in. Vivamus ultices velit vel felis laoreet, at\
    \ cursus metus molestie. Maecenas dolor dui, commodo nec turpis eu, suscipit velit\
    \ vehicula massa.\n    </div>\n  </div>\n</div>\n```\n\n## Push up animation\n\
    \nPush up animation is a nice effect for hovering on elements.\n\nQuick start:\n\
    \nJust append\n\nJust append the `.of-push-up-animation` class to any of your\
    \ elements.\n\n## Customization\n\nIt is possible to edit the grid breakpoints\
    \ by editing the values in the `src/base/breakpoints.less` file and then recompiling\
    \ the project. \n\n```bash\nnpm install && grunt release\n```\n\n## Command Line\
    \ Values\n\nIn addition to this, it is possible to pass in, to the grunt command,\
    \ the desired values for the grid breakpoints:\n\n```bash\nnpm install && grunt\
    \ release --breakpoints='xxsm 0px, xsm 460px, sm 600px, md 800px, lg 1440px, xlg\
    \ 1740px'\n```\n\nThis breakpoints argument will override the default specified\
    \ in `src/base/breakpoints`. It has to be comma separated and each breakpoint\
    \ is made of `name:width` (values are like 0px, 300px, 500px and etc).\n\n## 20\
    \ Essential CSS Every Designer Should Know\n\n### 1. Absolute positioning\n\n\
    If you want to control where an element lives on our website at all times, absolute\
    \ positioning is the key to making this happen. If you think of your browser as\
    \ one big box, absolute positioning allows you to control exactly where element\
    \ stays. Use top, right, bottom and left, accompanied by a pixel value to control\
    \ where element stays.\n\n```css\nposition: absolute;\ntop: 20px;\nright: 20px;\n\
    ```\n\nThe CSS above sets the position of an element 20px from the top and right\
    \ of your browser. You can also use absolute positioning inside a div.\n\n###\
    \ 2. * selector\n\nThe `*` enables you to select all elements of a particular\
    \ selector. For example, if you used `*` and then added CSS styles to that, it\
    \ would do it to all elements in your document with a `<p>` tag. This makes it\
    \ easy to target parts of your website globally.\n\n### 3. Overriding all styles\n\
    \nThis should be used sparingly because if you do this for everything, you are\
    \ going to find yourself in trouble in the long run. However, if you want to override\
    \ another CSS style for a specific element, use `!important` after the style in\
    \ your css. For example, if I wanted the H2 headers in a specific section of my\
    \ site to be red instead of blue, I would use the following CSS:\n\n```css\n.section\
    \ h2 { color:red !important; }\n```\n\n### 4. Centering\n\nCentering is tricky\
    \ because it depends on what you’re trying to center. Let’s take a look at the\
    \ CSS of items to be centered, based on content.\n\n#### Text\nText is centered\
    \ using `text-align:center;`. If you want it to either side, use left or right\
    \ instead of center.\n\n#### Content\nA div (or any other element) can be centered\
    \ by adding the `block` property to it, and then using auto margins. The CSS would\
    \ look like this:\n\n```css\n#div1 {\n  display: block;\n  margin: auto;\n  width:\
    \ anything under 100%;\n}\n```\nThe reason I put “anything under 100%” for width\
    \ is because if it was 100% width, then it would be full-width and wouldn’t need\
    \ centering. It is best to have fixed width, like 60% or 550px, etc.\n\n### 5.\
    \ Vertical alignment (for line of text)\n\nYou will use this in CSS navigation\
    \ menu to ensure that. The key is to make the height of menu and line-height of\
    \ text match. I see this technique a lot when I back and edit websites for clients.\n\
    \n```css\nnav {\n  line-height: 50px;\n  height: 50px;\n}\n```\n\n### 6. Hover\
    \ effect\n\nThis is used for buttons, text links, sections of your site, and more.\
    \ If you want something to change when hover over it, use the same CSS, but add\
    \ `:hover` to it and change the styling.\n\n```css\nh2 {\n  font-size: 36px;\n\
    \  color: #000;\n  font-weight: 800;\n}\nh2:hover {\n  color: #f00;\n}\n```\n\
    What this does is changes color of h2 tag from black to red when hover over it.\
    \ The great thing about using `:hover` is that you don’t have to declare the font-size\
    \ or weight again, if it isn’t changing. It only changes what you specify.\n\n\
    #### Transition\nFor hover effects, like with menus or images in your website,\
    \ you don’t want color snapping to end result. You ideally want to ease the change\
    \ gradually, which is transition comes into play.\n\n```css\nh2:hover {\n  color:\
    \ #f00;\n  transition: all 0.3s ease;\n}\n```\nThis makes the change happen over\
    \ .3 seconds, instead of just snapping to red. This makes the hover effect more\
    \ pleasing to the eye and less jarring.\n\n### 7. Link states\n\nThese styles\
    \ are missed by a lot of designers, and it really causes usability issues with\
    \ visitors. The `:link` pseudo-class controls all links that haven’t been clicked\
    \ yet. The `:visited` pseudo-class handles the styling of all of the links you’ve\
    \ already visited. This tells visitors where they have already been on your site,\
    \ and where they have yet to explore.\n\n```css\na:link { color: blue; }\na:visited\
    \ { color: purple; }\n```\n\n### 8. Easily resize images to fit\n\nSometimes you\
    \ get in a pinch where images need to fit a certain width, while scaling proportionally.\
    \ An easy way to do this is to use max width to handle this. Here is an example:\n\
    \nThis means that the largest image could ever be is 100%, and the height is automatically\
    \ calculated, based on the image width. In some cases, you might have to have\
    \ to specify the width at 100%.\n\n```css\nimg {\n  max-width: 100%;\n  height:\
    \ auto;\n}\n```\n\n### 9. Control the elements of a section\n\nUsing the example\
    \ above, if you only want to target the images of a certain section, like your\
    \ blog, use a class for the section and combine it with the actual selector. This\
    \ enables you to select only the images of the blog section, and not other images,\
    \ such as your logo, or social icons, or images in any other section of your site,\
    \ like the sidebar. Here’s how the CSS would:\n\n```css\n.blog img {\n  max-width:\
    \ 100%;\n  height: auto;\n}\n```\n\n### 10. Direct children\n\nI wish I’d known\
    \ this when I first started using CSS. This would have saved me so much time!\
    \ Use `>` to select the direct children of an element. For example:\n\n```\n#footer\
    \ > a\n```\nThis will select and style all of the active link elements that are\
    \ immediately under the Footer ID. It won’t select anything past the active element,\
    \ or anything else contained in the footer, like plain text.\n"
