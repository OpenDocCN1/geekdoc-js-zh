  trans: "\n许多 HTML 编辑器会为你提供弹出窗口，帮助你设置描述和关键词的元数据，但它们忽略了其他重要的元数据，例如搜索引擎爬虫是否应该索引所有页面、网页语言、字符集以及你根据\
    \ HTML 标准创建的文档类型。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0 Transitional//EN\"\
    >\n<html\n<head>\n<meta http-equiv=\"Content-Language\" content=\"en-us\">\n<meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=windows-1252\">\n<meta\
    \ name=\"GENERATOR\" content=\"Microsoft FrontPage 6.0\">\n<meta name=\"ProgId\"\
    \ content=\"FrontPage.Editor.Document\">\n<title>Your Title Goes Here</title>\n\
    <meta name=\"description\" content=\"Your Description Goes Here\">\n<meta name=\"\
    keywords\" content=\"Your Keywords Go Here\">\n<meta name=\"robots\" content=\"\
    index,all\">\n</head>\n</html>\n```\n\n我应该注意的一点是，仅仅因为你提供了这些信息并不意味着：\n\na) 所有的搜索引擎都使用这些信息\n\
    b) 你保证能在搜索引擎中获得领先位置\n\n但在你的网页中包含这些微小元素，特别是当它们组合在一起时，无疑会对你的搜索引擎表现有所提升。记住，每个搜索引擎都是不同的，用于网站的算法是黑箱，但如果你添加了这些元素，你会在积极方面获得一些分数。\n\
    \n将这些信息放入你的网站还有另一个原因。没有包含这些某些信息会影响视障人士查看你网站的能力。这听起来可能很奇怪，但视障人士可以将网页转换为消息的工具。然而，如果你的标签中没有包含上述概述的信息（如内容语言和字符集），将影响他们的浏览器是否正确读取你的网站。如果你的客户群体是由那些禁用了功能的人组成的，那么你就是在失去客户。\n\
    \n你应该学会编写至少基础代码的其他原因之一是帮助你构建指向页面的链接。你可以用来构建这些链接的技术是编写提供人们关于你业务信息的文章。例如，如果你拥有一个销售所有高尔夫用品的网站，你可能考虑编写关于如何选择高尔夫球杆以及哪里可以找到最好的高尔夫球具的文章。\n\
    \n当你将文章提交到 EasyArticles.com、GoArticles.com 或 ArticlesON.com 等地方时，他们会要求你使用某些 HTML\
    \ 标签来突出你的文章。例如，通常在文章正文中，你只能使用粗体、斜体、下划线和列表项，但在其他区域（如放置详细信息的地方），你可以添加超链接和超文本。现在在之前提到的三个文章提交网站中，如果你想添加超链接，你必须了解基础\
    \ HTML 代码，因为他们不会为你构建链接，你必须从头开始编写 HTML 标签。\n\n当你构建链接回你网页的超链接时，你希望确保两点：\n\n1. 超链接（即你正在链接的网页或网站）包含了文件夹或网页的关键词。\n\
    2. 让超文本也广为人知。\n\n让我们来看一个基础示例。如果我写了一篇关于一款新款高尔夫球杆的介绍，我知道它将售出数百万个并引起大量关注，那么我链接到提供该高尔夫球杆信息的网页的链接将如下所示构建。让这个高尔夫球杆的名字为\
    \ Heart X。\n\n# 学习 jQuery\n\n## 创建一个 jQuery 插件\n\n有时，在整个代码中使用一个函数是很有用的。也许你想要一个可以在\
    \ jQuery 上调用并执行此类操作的函数。或者你可能在你其中一个项目里写了一个工具函数，现在你想能够将其移动到其他项目中。如果编写插件是你的最佳选择，那么\
    \ jQuery 非常棒。它是跨浏览器的，易于学习，并帮助你制作用户友好的界面。它还带有很多许多实用的插件来完成你想要的任何操作。\n\n但有时仅仅这些是不够的，如果你找不到适合你需求的插件怎么办？或者可能存在某个插件，但它太大了，而你只需要一部分。解决方案可能是卷起袖子编写你自己的东西。毕竟，这听起来比实际要复杂。这篇简短教程将介绍编写简单插件、添加一些选项、甚至执行回调的过程。\n\
    \n## 设置\n\n你可以从 GitHub 下载整个项目\n\n在本教程中，我们将创建一个简单的手风琴式（accordion）插件。让我们创建一个 js\
    \ 文件并将其放在网站的 \"js\" 目录下。传统上，所有的 js 插件文件都以 \"jquery dot\" 开头，加上实际插件名称，因此我们将命名为\
    \ \"jquery.simple-accordion.js\"。\n\n- 我们网站目录下的 js 目录中的插件文件\n\n现在，我们需要将插件文件同 jQuery\
    \ 库一起包含到我们的主 HTML 页面（index.html）中。最佳实践是从 Google 服务器引入 jQuery 库，因为它们遍布全球，这样你的单服务器加载速度更快。从\
    \ Google 引入 jQuery 的另一个优势是当浏览器正确读取你的网站时。\n\n## jQuery 结构\n\njQuery 的构建包含了所有帮助你开发插件的钩。但为了保持代码整洁，我们必须确保一切保持在局部作用域内。让我们从\
    \ jQuery 的基本外壳开始：\n\n```javascript\nfunction($) {\n  $.fn.simpleAccordion = function()\
    \ {\n    // TODO: simpleAccordion 插件的代码\n  }\n}(jQuery));\n```\n\n让我们看看这里发生了什么。将所有内容包含在\
    \ (function() {}) 模式中，确保我们插件中的所有变量都留在全局命名空间之外。我们不会与此页面运行的任何其他脚本冲突，所以我们必须像上面那样隔离我们的代码。\n\
    \n你可能注意到的另一个点是，我们是以 jQuery 处于“无冲突”模式的方式来定义插件的。再次，我们正在避免与页面上的其他脚本冲突，因此我们想确保插件不依赖于可能被其他库使用的默认\
    \ $。最后$.fn 是 jQuery 允许你定义插件的方式，我们将其命名为 simpleAccordion。所有组件都就绪后，让我们开始吧！\n\n##\
    \ 为我们的插件添加功能\n\njQuery 的伟大之处在于它允许你使用任何你选择器。然而，你必须记住，我们的插件可能会处理多种不同的元素类型。使用 \"\
    this\" 关键字让我们的插件通过循环访问每个元素，无论元素类型如何来应用关联函数。\n\n准备 HTML 部分 - 构建手风琴结构\n\n由于我们要构建手风琴，我们需要为它准备结构，如下所示：\n\
    \n### 标题 1\n\n### 标题 2\n\n### 标题 3\n"
- fmt: "\nFalse site acute is just malesuada fabulous. Heading 4\n\nAli quam tincidunt\
    \ lobortis sem at porttitor.\n\nThis is a simple accordion structure, defining\
    \ four titles and their respective content areas. So the idea is that our plugin\
    \ will turn this HTML code into a functional accordion, where a user can open\
    \ and collapse different sections.\n\nThis is how it should look like for now:\n\
    \nJust to make it look pretty we should add some simple styles. So here we go:\n\
    \n```css\n.accordion {\nwidth: 600px;\nborder: 1px solid #ccc;\nborder-bottom:\
    \ none;\n}\n\n.accordion dt,.accordion dd {\nborder-bottom: 1px solid #ccc; margin:\
    \ 0px;\n}\n\n.accordion dt {\nbackground: rgb(193, 221, 252, 0.24);\ncursor: pointer;\n\
    padding: 8px 4px;\nfont-size: 14px;\nfont-weight: bold;\n}\n\n.accordion dd {\n\
    padding: 12px 8px;\n}\n```\n\nNow our accordion structure should look like this:\
    \ The jQuery Part - Time To Make It Do Something!\n\nTo add functionality to our\
