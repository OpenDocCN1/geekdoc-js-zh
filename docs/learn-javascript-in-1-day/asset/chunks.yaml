  trans: "\n\n默认情况下，行（row）两侧有 24px 的内边距（在 xxsm 屏幕上为 0，在 xsm 屏幕上为 12px），每列之间有 12px\
    \ 的间距。可以使用 `.of-row-no-padding` 去除行的内边距。\n\n## 加载动画\n\n加载动画可以指示正在加载状态。\n\n快速开始：\n\
    \n```html\n<div class=\"of-row\">\n  <div class=\"xxsm-col-24\">\n    <div id=\"\
    loading-bar-spinner\">\n      <div class=\"spinner-icon\"></div>\n    </div>\n\
    \  </div>\n</div>\n```\n\n## 文本截断\n\n当你想让文本在一行内显示并在超出行宽时进行截断时，文本截断功能非常有用。\n\n\
    快速开始：\n\n```html\n<div class=\"of-row\">\n  <div class=\"xxsm-col-12\">\n    <div\
    \ class=\"truncate-text\">\n      Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit. Fusce non elit eget turpis porttitor blandit non as felis. In consequat,\
    \ ligula eu condimentum commodo, mi sapien suscipit metus, as laoreet lorem enim\
    \ id nulla. Phaseellus at tincidunt quam, as auctor ex. Aenean sed gravida orci,\
    \ vitae tristique ante. Suspendisse vestibulum eros orci, vitae bibendum mi ullamcorper\
    \ et. Nulla ultises elementum ipsum, quis congue est molestie vel. Vestibulum\
    \ ante primis in faucibus orci luctus et ultises posuere cubilia Curae; Pellentesque\
    \ sed elit cursus. Duis sodales urna pellentesque feugiat maximus. Quisque viver\
    \ libero eu convallis malesuada. Sed sodales varius aculis. Phaseellus cursus\
    \ pulvinar magna, element arcu blandit in. Vivamus ultices velit vel felis laoreet,\
    \ at cursus metus molestie. Maecenas dolor dui, commodo nec turpis eu, suscipit\
    \ velit vehicula massa.\n    </div>\n  </div>\n</div>\n```\n\n## 向上浮动动画\n\n向上浮动画是元素悬停时的一个很棒的效果。\n\
    \n快速开始：\n\n只需在你的任何元素上添加 `.of-push-up-animation` 类即可。\n\n## 自定义定制\n\n你可以通过编辑 `src/base/breakpoints.less`\
    \ 文件中的值并重新编译项目来编辑网格断点。\n\n```bash\nnpm install && grunt release\n```\n\n## 命令行值\n\
    \n除了此以外，你还可以向 grunt 命令传递网格断点的所需值：\n\n```bash\nnpm install && grunt release --breakpoints='xxsm\
    \ 0px, xsm 460px, sm 600px, md 800px, lg 1440px, xlg 1740px'\n```\n\n此 `breakpoints`\
    \ 参数将覆盖 `src/base/breakpoints` 中指定的默认值。它必须用逗号分隔，每个断点由 `name:width` 组成（值如 0px,\
    \ 300px, 500px 等）。\n\n## 每位设计师都应该知道的 20 个核心 CSS\n\n### 1. 绝对定位\n\n如果你想始终控制元素在网站上的显示位置，绝对定位是实现这一点的关键。如果你将浏览器看作一个大盒子，绝对定位允许你精确控制元素停留的位置。使用\
    \ top、right、bottom 和 left 配合像素值来控制元素的位置。\n\n```css\nposition: absolute;\ntop:\
    \ 20px;\nright: 20px;\n```\n\n上面的 CSS 将元素设置为距离浏览器顶部和右侧 20px。你也可以在 div 内部使用绝对定位。\n\
    \n### 2. * 选择器\n\n`*` 选择器允许你选择特定选择器下的所有元素。例如，如果你使用了 `*` 并给它添加了 CSS 样式，它将应用于文档中所有带有\
    \ `<p>` 标签的元素。这使得全局性定位网站的某些部分变得简单。\n\n### 3. 覆盖所有样式\n\n这应该谨慎使用，因为如果你对所有内容都这样做，从长远来看你会遇到麻烦。然而，如果你想为特定元素覆盖另一个\
    \ CSS 样式，请在 CSS 样式后后使用 `!important`。例如，如果我想让网站中特定区域的 H2 标题变为红色而不是蓝色，我会使用以下 CSS：\n\
    \n```css\n.section h2 { color:red !important; }\n```\n\n### 4. 居中\n\n居中处理起来棘手，因为取决于你想居中什么。让我们来看看基于内容对待居中项的\
    \ CSS。\n\n#### 文本\n文本使用 `text-align:center;` 居中。如果你想让它靠某一侧，请使用 left 或 right 代替\
    \ center。\n\n#### 内容\n通过为 div（或任何其他元素）添加 `block` 属性并使用自动边距（auto margins），可以实现居中。CSS\
    \ 如下：\n\n```css\n#div1 {\n  display: block;\n  margin: auto;\n  width: anything\
    \ under 100%;\n}\n```\n我将宽度设置为“100% 以下的任何值”是因为，如果宽度为 100%，它将是全宽的，不需要居中。最好有一个固定宽度，如\
    \ 60% 或 550px 等。\n\n### 5. 垂直对齐（针对文本行）\n\n你将在 CSS 导航菜单中使用此来确保……关键是让菜单的高度和文本的行高（line-height）匹配。我在为客户回改网站时经常看到这种技术。\n\
    \n```css\nnav {\n  height: 50px;\n  line-height: 50px;\n}\n```\n\n### 6. 悬停效果\n\
    \n这是用于元素悬停时的效果。\n\n#### 过渡\n为了让变化更平滑，你可以使用过渡。\n\n```css\ntransition: all 0.3s\
    \ ease;\n```\n\n### 7. 链接状态\n\n这些样式被很多设计师忽略了，这真的会对用户体验产生影响。`:link` 伪类控制尚未点击的链接。`:visited`\
    \ 伪类处理已访问链接的样式。\n\n```css\na:link { color: blue; }\na:visited { color: purple;\
    \ }\n```\n\n### 8. 轻松缩放图片以适应\n\n有时你需要图片适应特定宽度，同时按比例缩放。处理此问题的一种简单方法是使用最大宽度。这里是一个示例：\n\
    \n```css\nimg {\n  max-width: 100%;\n  height: auto;\n}\n```\n\n### 9. 控制区域的元素\n\
    \n使用上面的示例，如果你只想针对特定区域（如博客）的图片，请为该区域创建一个类并结合实际选择器。这允许你只选择博客区域的图片，而不是其他图片，例如你的 Logo、社交图标或网站任何其他区域（如侧边栏）的图片。CSS\
    \ 如下：\n\n```css\n.blog img {\n  max-width: 100%;\n  height: auto;\n}\n```\n\n\
    ### 10. 直接子元素\n\n我希望自己在刚开始使用 CSS 时就知道这个。这本可以节省我大量时间！使用 `>` 选择元素的直接子元素。例如：\n\n\
    ```\n#footer > a\n```\n这将选择并设置位于 Footer ID 下的所有活动链接元素的样式。它不会选择活动元素之后的元素，也不会选择包含在\
    \ footer 中的任何其他内容（如纯文本）。\n\n"
- fmt: "\n# Specific Child Elements\n\nBelieve me, this is handy when you are styling\
    \ lists. You just need to count how many items down the element is that you want\
    \ to style and then apply that style.\n\n```css\nli:nth-child(2) {\n  font-weight:800;\
    \ color: blue;\n  text-style:underline;\n}\n```\n\n\n\nThe CSS above targets the\
    \ second item in the list and makes it bold, underlined, and blue. Add an \"n\"\
    \ after the number in parentheses and you can target every 2nd list item. Imagine\
    \ being able to style every other line in a table-style layout for easy reading.\
    \ The CSS would be:\n\n```css\nli:nth-child(2n)\n```\n\n## 1 Apply CSS to multiple\
    \ classes, or selectors\n\nLet’s say you wanted to add an identical border around\
    \ all images, the blog section and the sidebar. You don’t have to write out the\
    \ same exact CSS 3 times. Just list those items out, separated by commas. Here\
    \ is an example:\n\n```css\n.blog, img, .sidebar {\n  border: 1px solid #000;\n\
    }\n```\n\nWhether you’ve been a web designer for years, or you’re just starting\
    \ out, learning how to build websites the right way can seem like a rocky, neverending\
    \ journey. Once you’ve narrowed down which languages you want to learn, you have\
    \ to learn and refine your skills.\n\nNo matter what you learn, CSS is one of\
    \ those essential, but daunting skills you have to master. It doesn’t have to\
    \ be so difficult, though, especially if you know a few handy and lesser-known\
    \ CSS techniques to get the job done.\n\n## 12 box-sizing: border-box;\n\nThis\
    \ is a favorite among many web designers, because it solves the problem of padding\
    \ and layout issues. Basically, when you set a box to a specific width, and add\
    \ padding to it, the padding adds to the size of the box. However, with `box-sizing:border-box;`,\
    \ this is negated, and boxes stay the size they are meant to be.\n\n![](Image00004.jpg)\n\
    \n## 13 :before\n\nThis CSS is a selector that allows you to choose a CSS element\
    \ and insert content before every element with a specific class applied to it.\
    \ Let’s say you had a website where you wanted specific text before every H2 tag.\
    \ You would use this setup:\n\n```css\nh2:before {\n  content: \"Read: \";\n \
    \ <span class=\"Apple-converted-space\">color: #F00;</span>\n}\n```\n\nThis is\
    \ extremely handy, especially if you are using an icon font. You can place icons\
    \ before certain elements, and apply it globally.\n\n## 14 :after\n\nLike the\
    \ `:before` selector, you can use `:after` to insert content globally on specific\
    \ elements. A practical use would be adding “read more” after every blog. Here’s\
    \ how you would do that:\n\n```css\nafter {\n  content: \"- Read more...\"; color:#f00;\n\
    }\n```\n\n## 15 content\n\ncontent is a CSS property that comes in when you need\
    \ to insert something that you want to control. The most common use I’ve seen\
    \ is to insert an icon from a specific place. In examples you can see you have\
    \ to wrap the text.\n\n## 16 CSS reset\n\nDifferent browsers have default settings,\
    \ so it is a must to reset those you have an even content field. Think of it as\
    \ building a house, whether you build on the side of a mountain, on a beach, or\
    \ on the middle of a wooded area, you want that foundation. This reset method\
    \ sets a standard base for all your websites, giving them a starting point. It\
    \ removes unwanted borders, margins, padding, heights, styles on lists, etc.\n\
    \n## 17 Drop caps\n\n loves drop caps. It reminds us of traditional printed books\
    \ and is a great way to start content. That first large letter really grabs attention.\
    \ There’s an easy way to create a drop cap in CSS, and it’s using the element\
    \ `:first-letter`. Here’s an example:\n\n```css\n:first-letter {\n  display:block;\
    \ float:left;\n  margin:3px; color:#f00;\n  font-size:300%;\n}\n```\n\nWhat this\
    \ does is set the letter to 3x the size of the other letters. It sets 3px of space\
    \ around the letter to prevent overlapping, and sets the color of the letter to\
    \ red.\n\n## 18 Force text to be all caps, all lowercase, or capitalized\n\nIt\
    \ would be absurd to type an entire section in all caps. Imagine having to go\
    \ back and fix that later when the format of the website changes, or it gets updated.\
    \ Instead, use the following CSS styles to force text to a certain formatting.\
    \ This css targets the h2 title.\n\n```css\nh2 { text-transform: uppercase; }\
    \ – all caps\nh2 { text-transform: lowercase; } – all lowercase\nh2 { text-transform:\
    \ capitalize; } – capitalizes the 1st letter of each word.\n```\n\n## 19 Vertical\
    \ screen height\n\nSometimes you want a section to fill the entire screen, no\
    \ matter what the screen size is. You can control this with `vh`, or view height.\
    \ The number before it is a percentage, so if you want it to fill 100% of the\
    \ browser, you would set it to 100. You might set it to a value like 85% to accommodate\
    \ a fixed navigation menu.\n\nCreate a class for the container and apply the amount\
    \ of vh you want to have. One thing you need to tweak is value for specific orientations\
    \ like portrait. Imagine stretching a landscape to fit portrait. That just wouldn’t\
    \ look good.\n\n```css\n.fullheight { height:85vh; }\n```\n\n## 20 Style links\n\
    \nIf you have a link that says a number when a user taps it, you have to style\
    \ it with the active link selector. Instead, use the following:\n\n```css\na[href^=\"\
    #\"] { <span class=\"Apple-converted-space\">color: #FFF;</span> <span class=\"\
    Apple-space\">text-decoration: none;</span> }\n```\n\n# Different ways to run\
    \ a JavaScript\n\n**1 – anchor named**\n\nCursor not change on hover in some browsers.\
    \ CSS could be used to solve this\n\n**2 – anchor hash href**\n\nHover shows link\
    \ at #Page shift to top on IE6, IE7\n\n3 – anchor pseudo**\n\nOld way of calling\
    \ the function when the link is clicked. Pseudo-protocol `href` are not recommended\
    \ for usability and accessibility reasons. Nowadays consider back programming\
    \ the influx of APIs. It’s messy, it’s long, people see it in the status bar and\
    \ it means nothing. Opera doesn’t like `href=\"javascript:anything\"`\n\n**4 –\
    \ anchor pseudo void**\n\nUsing `javascript:anything` is considered by some to\
    \ be bad practice. Pseudo-protocol `href` can cause IE to enable a waiting state\
    \ anticipating the page to be replaced and automatically disable hungry activity.\
    \ `javascript:anything` is used for bookmarks.\n\nWhat is `javascript:void(0)`?\n\
    \n**5 – anchor return false**\n\nReturn false causes the `href=\"#\"` not to be\
    \ evaluated. Safer method than using Pseudo-protocol examples above such as page\
    \ jumps. Return can be unreliable times.\n\n**6 – anchor pretty url/jQuery**\n\
    \nThe user will see #some-real-url when they hover the link. If JavaScript is\
    \ disabled they see something informative. ...\n\n```javascript\n$(document).on('click',\
    \ 'a.mylink', function(e) {\n  // prevent the page from going to href e.preventDefault();\n\
    \  // run the function foo();\n});\n```\n\n# Learning CSS Syntax and Proper Application\n\
    \nOnce you have a solid understanding of CSS and what it can do, the next step\
    \ is understanding the syntax of CSS and the few ways it can be applied to your\
    \ documents.\n\n## CSS syntax consists of three elements.\n\nSelector: The selector\
    \ is the element within your HTML document you want to style. For instance, if\
    \ you have placed a paragraph tag within your HTML, your selector would be `p`\
    \ - the standard paragraph tag in CSS. If you wanted to style the entire body\
    \ of your website, you would use `body` as the selector.\n\nProperty: Properties\
    \ are those elements that can be applied to a particular selector. Let’s take\
    \ the paragraph from the above example. A few properties you could use to style\
    \ that selector include `font-family`, `font-size`, `color` and a few others.\n"
