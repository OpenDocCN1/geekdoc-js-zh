  trans: "\n\n# 特定子元素\n\n相信我，这在你为列表设置样式时非常有用。你只需要计算你想要样式的元素向下数是第几个项目，然后应用该样式即可。\n\n\
    ```css\nli:nth-child(2) {\n  font-weight:800; color: blue;\n  text-style:underline;\n\
    }\n```\n\n上面的 CSS 针对列表中的第二个项目，并使其加粗、带有下划线并变为蓝色。在括号数字后添加一个 \"n\"，你就可以针对每 2 个列表项目。想象一下能够为表格样式的布局中的每隔行设置样式，以便于阅读。CSS\
    \ 编写如下：\n\n```css\nli:nth-child(2n)\n```\n\n## 1 将 CSS 应用到多个类名或选择器\n\n假设你想为所有图像、博客区域和侧边栏添加相同的边框。你不需要编写\
    \ 3 次完全相同的 CSS。只需要用逗号将这些项目列出来即可。这里有一个示例：\n\n```css\n.blog, img, .sidebar {\n \
    \ border: 1px solid #000;\n}\n```\n\n无论你是已经做了多年的网页设计师，还是刚刚起步，学习如何正确构建网站似乎像是一段坎折且无止尽的旅程。一旦你确定了想要学习的语言，就必须学习并精炼你的技能。\n\
    \n无论你学习什么，CSS 都是必不可少但又令人敬畏的技能之一。不过，它并不一定困难，特别是如果你知道一些实用且鲜为人知的 CSS 技术来完成工作。\n\n\
    ## 12 box-sizing: border-box;\n\n这是许多网页设计师的最爱，因为它解决了内边距（padding）和布局问题。基本上，当你给一个框设置特定宽度并添加内边距时，内边距会框的大小。然而，使用\
    \ `box-sizing:border-box;` 后，这种情况被消除了，框保持其应有的尺寸。\n\n![](img/Image00004.jpg)\n\n\
    ## 13 :before\n\n这种 CSS 选择器允许你选择一个 CSS 元素，并在应用了特定类的每个元素之前插入内容。假设你有一个网站，想在每个 H2\
    \ 标签之前显示特定的文本。你将使用这种设置：\n\n```css\nh2:before {\n  content: \"Read: \";\n  <span\
    \ class=\"Apple-converted-space\">color: #F00;</span>\n}\n```\n\n这非常有用，特别是当你使用图标字体时。你可以在某些元素之前放置图标，并进行全局应用。\n\
    \n## 14 :after\n\n类似于 `:before` 选择器，你可以使用 `:after` 在特定元素上全局插入内容。一个实际的用法是在每篇博客之后添加“阅读更多”。具体方法如下：\n\
    \n```css\nafter {\n  content: \"- Read more...\"; color:#f00;\n}\n```\n\n## 15\
    \ content\n\ncontent 是一个 CSS 属性，当你需要插入想要控制的内容时就会用到。我见过的最常见的用法是从特定位置插入图标。在示例中，你可以看到你必须包裹文本。\n\
    \n## 16 CSS 重置\n\n不同的浏览器有默认设置，因此必须重置这些设置以获得一致的内容字段。将其比比为盖房子，无论你是在山边、海滩上还是林地中间建造，你都需要一个地基。这种重置方法为你的所有网站设置了一个标准基础，给它们一个起点。它移除了不必要的边框、外边距（margins）、内边距（padding）、高度、列表上的样式等。\n\
    \n## 17 字母大字（Drop caps）\n\n我非常喜欢字母大字。它让我们联起传统的印刷书籍，是开始内容的极佳方式。第一个大字母真的非常吸引注意力。在\
    \ CSS 中创建字母大字有一种简单的方法，就是使用元素 `:first-letter`。这里有一个示例：\n\n```css\n:first-letter\
    \ {\n  display:block; float:left;\n  margin:3px; color:#f00;\n  font-size:300%;\n\
    }\n```\n\n此操作的作用是将字母大小设置为其他字母大小的 3 倍。它在字母周围留出 3px 的空间以防止重叠，并将字母颜色设置为红色。\n\n##\
    \ 18 强制文本为全大写、全小写或首字母大写\n\n将整个章节输入为全大写是荒谬的。想象一下，当网站格式改变或更新时，你必须回去修复它。相反，使用以下 CSS\
    \ 样式可以强制文本采用特定格式。此 CSS 针对 h2 标题。\n\n```css\nh2 { text-transform: uppercase; }\
    \ – 全大写\nh2 { text-transform: lowercase; } – 全小写\nh2 { text-transform: capitalize;\
    \ } – 每个单词的首字母大写。\n```\n\n## 19 垂直屏幕高度\n\n有时你希望让一个区域填充整个屏幕，无论屏幕大小如何。你可以通过 `vh`（视口高度）来控制它。前面的数字是一个百分比，所以如果你想让它填充浏览器的\
    \ 100%，则将其设置为 100。你可能会将其设置为 85% 之类的值，以适应固定的导航菜单。\n\n为容器创建一个类，并应用你想要的 vh 数量。你需要调整的一个点是针对特定方向（如竖屏）的值。想象一下将横屏拉伸以适应竖屏。那看起来可并不好。\n\
    \n```css\n.fullheight { height:85vh; }\n```\n\n## 20 设置链接样式\n\n如果你有一个链接在用户点击时会显示数字，你必须使用活动链接选择器对其设置样式。相反，请使用以下代码：\n\
    \n```css\na[href^=\"#\"] { <span class=\"Apple-converted-space\">color: #FFF;</span>\
    \ <span class=\"Apple-space\">text-decoration: none;</span> }\n```\n\n#  JavaScript\
    \ 的不同方式\n\n**1 – 命名锚点**\n\n在某些浏览器中，悬停时光标不会改变。可以使用 CSS 来解决这个问题。\n\n**2 – 锚点哈 href**\n\
    \n悬停时显示链接 #Page，在 IE6、IE7 上会跳转到顶部\n\n**3 – 锚点伪类**\n\n在点击链接时调用函数的旧方法。出于可用性和可访问性考虑，不建议使用伪协议\
    \ `href`。现在考虑对 API 注入进行后端编程。这很杂乱、很长，人们会在状态栏中看到它，而且没有任何意义。Opera 不喜欢 `href=\"javascript:anything\"\
    `。\n\n**4 – 锚点伪 void**\n\n某些人认为使用 `javascript:anything` 是一种坏习惯。伪协议 `href` 会导致\
    \ IE 进入等待状态以预期页面替换。`javascript:anything` 用于书签。\n\n**5 – 锚点返回 false**\n\n返回 false\
    \ 会导致 `href=\"#\"` 不执行。比上述伪协议示例（如页面跳转）更安全的方法。返回可能不可靠。\n\n**6 – 锚点漂亮 URL/jQuery**\n\
    \n用户悬停链接时会看到 #some-real-url。如果禁用了 JavaScript，他们会看到某些信息……\n\n```javascript\n$(document).on('click',\
    \ 'a.mylink', function(e) {\n  // 防止页面跳转 href e.preventDefault();\n  // 执行函数 foo();\n\
    });\n```\n\n# 学习 CSS 语法和正确应用\n\n一旦对 CSS 及其功能有了良好的理解，下一步是理解 CSS 语法以及应用于文档的几种方式。\n\
    \n## CSS 语法由三个元素组成。\n\n选择器：选择器是你想要在 HTML 文档中的元素。例如，如果你在 HTML 中放置了段落标签，你的选择器将是\
    \ `p` —— CSS 中的标准段落标签。如果你想设置整个网站的主体，将使用 `body` 作为选择器。\n\n属性：属性是可以应用于特定选择器的元素。让我们看看上面示例中的段落。你可以用于设置该选择器的某些属性包括\
    \ `font-family`、`font-size`、`color` 以及其他。\n\n"
- fmt: "\nValue: The value is the share, size, dimension, etc. applied to a particular\
    \ property. For instance, you would apply a value of 20px to the property above\
    \ if you wanted your paragraph copy to display at 20px.\n\nSelector: `p {}`\n\n\
    Selector + Property: `p {font-size:}`\n\nSelector + Property + Value: `p {font-size:\
    \ 20px;}`\n\nNow, let's get into the application of CSS. There are three ways\
    \ you can apply styles to your document.\n\n## Inline Styles\n\nInline styles\
    \ simply mean you are placing the style for a particular element within the tag\
    \ itself. For instance, if you wanted to color the text color of a paragraph blue,\
    \ you would apply \"blue;\" within your paragraph tag.\n\nThis method is okay,\
    \ but not recommended. If you had a website 100 pages deep and each page used\
    \ inline styles, when a change needs to be made, you would have to change all\
    \ 100 pages independently.\n\n## Internal Styles\n\nInternal styles mean including\
    \ your styles within the HTML document itself. At the beginning of your HTML document,\
    \ there are `head` tags. Your styles would be placed between these tags for reference.\
    \ You might use this method if you had a single page website.\n\n## External Styles\n\
    \nUsing external styles are the most effective way of using CSS. Your styles are\
    \ held in an outside document that all HTML files connect to. This makes making\
    \ global changes a breeze. Say you wanted to change the color of links on your\
    \ 100 page website. Instead of changing each page independently, you could change\
    \ the style within the external document and there you have it. All pages would\
    \ be changed - because they are all linked to the same style sheet.\n\n## Why\
    \ is case sensitivity so much more important in JavaScript?\n\nIt's the nature\
    \ of the beast. Script is written in plain text, for starters, but it is not just\
    \ markup like HTML (which is largely case-insensitive) it is code, and as such,\
    \ subject to much more scrutiny by the browser's internal workings (DOM API's).\n\
    \n```javascript\nvar names, Names;\n```\n\nThe two variables look alike, almost,\
    \ but to JS they are worlds apart. What is important is that we recognize it,\
    \ not by its importance, but by its very nature. It is what it is.\n\n```javascript\n\
    function Person(name, age){\n  this.name = name;\n  this.age = age;\n}\n\nvar\
    \ person = new Person(\"Zach\", 29);\n```\n\nWe can ignore the makeup of this\
    \ code since objects may not have been covered yet. The point here is to show\
    \ that `person` and `Person` are two completely different objects. `Person` is\
    \ an object constructor function, and `person` is an instance of that constructor.\n\
    \n```javascript\nconsole.log(person); // {name: 'Zach', age: 29}\nconsole.log(Person);\
    \ // [function]\n```\n\nAs it stands, we will have to check your attention or\
    \ meet possible negative consequences such as syntax errors and others. Remember\
    \ JS is case sensitive. Nothing we can do.\n\n## Understanding Comments\n\nYou\
    \ can add and track comments about individuals. You can review all comments about\
    \ an individual or all comments posted by a specific. Personal comments are subjective\
    \ and often confidential, be careful with your input and comments. You should\
    \ also be familiar with administrative functions before setting up or creating\
    \ comments in your system.\n\nWith permissions, you can click the Comments button\
    \ on a page in a function to attach or review comments to an individual's or organization's\
    \ record. You can also navigate through the menu described in this document.\n\
    \n## Colons Used in Sentence\n\nThere are two choices at this time: run away or\
    \ fight. We knew would win the game: the Eagles. He wanted to see three cities\
    \ in Italy: Rome, Florence and Venice. Remember: Two can play that game. She kept\
    \ repeating: “I really want that!” Barry wanted to know why I didn’t respond to\
    \ his text: I haven’t received it. Here are three states that begin with M: Michigan,\
    \ Mississippi and Maine. You can pick me up now: I am feeling much better. Never\
    \ forget this point: Think before you speak. This house has everything I need:\
    \ bedrooms, a backyard and a garage. The town reminded me of childhood vacations:\
    \ both were on the beach. I have several favorite genres of movies: drama, science\
    \ fiction and mystery. This was first said by Shakespeare: “To thine own self\
    \ be true.” I bought a lot of meat at the store: bacon, turkey, chicken and tuna.\
    \ The world is a stage: play your role well. The new boss has many nice traits:\
    \ friendly, outgoing and fair. These are my favorite colors: purple, turquoise,\
    \ pink and yellow.\n\n## Semicolons in Sentence\n\nDad is going bald; his hair\
    \ is getting thinner and thinner. I like beef, with mushroom; pasta, with salad,\
    \ with fresh greens. You should stop eating much; you will have to. You needed\
    \ new breaks; others may not be able to. Star was my favorite show during the\
    \ 1960s; in fact, it is favorite all. I had a hug; however, I am hungry again.\
    \ The Christmas ornaments are finally asked: small, bright ones; and the homemade.\
    \ Self-training; sons word off the assailant. We had students from Lima; San Diego;\
    \ and Vegas. We had too fools; lost the game. I know you don’t like broccoli;\
    \ never it is good for you. Michelle drives a Jaguar; Sony drives a Porsche. I\
