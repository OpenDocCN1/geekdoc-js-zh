    \ {\n    $(this).next().slideUp('fast');\n  }\nfunction reset() {\n    $(this).next().hide();\n\
    \  }\n})(jQuery);\n```\n\nQuickly let's go over what this code is doing. First,\
    \ you need to understand that jQuery is a library that extends the JavaScript\
    \ language. When creating any jQuery plugin, you are essentially extending the\
