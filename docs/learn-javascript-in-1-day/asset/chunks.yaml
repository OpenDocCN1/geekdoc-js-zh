  trans: "\n\n访问文档中的任何元素并操作其外观、内容和属性。\n\n在需要时创建新的元素和内容并将其应用到文档中。\n\n这意味着我们不再需要依赖窗口（windows）、框架（frames）、表单（forms）和丑陋的提示框（alerts），如图所示以精美的样式在文档中向用户提供反馈。\n\
    \n![](img/Image00002.jpg)\n\n图 3：使用 DOM 可以创建更漂亮且侵入性更小的错误消息。\n\n结合事件处理，这是一个创建交互且美观界面的强大工具。事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——例如页面加载完成——但大多数时候，我们对用户对浏览器的操作做出反应。用户可能会调整窗口大小、滚动页面、按下某些键或使用鼠标点击链接、按钮和元素。通过事件处理，我们可以等待这些事情发生，并让网页按照我们的意愿对这些做出响应。过去，点击任何链接都会引导访问者进入另一个文档，现在我们可以劫持此功能并执行其他操作，例如显示和隐藏面板，或者获取链接中的信息并用其连接到网络服务。\n\
    \n## JavaScript 的其他现代用途\n\n这基本上就是我们现今使用 JavaScript 所做的。我们增强了旧的、成熟的 Web 界面——点击链接、输入信息和提交表单等——使其对终端用户的响应更加迅速。例如：\n\
    \n* 注册表单可以在你输入用户名时检查该用户名是否可用，防止你不得不忍受令人沮丧的页面刷新。\n* 搜索框可以在你输入时根据你目前输入的内容提供建议结果（例如，输入“bi”可能会出现包含此字符串的建议供你选择，如“bird”、“big”和“bicycle”）。这种使用模式被称为自动补全。\n\
    *   不断变化的信息可以定期加载，无需用户交互，例如体育比赛结果或股市行情。\n*   锦上添花且对某些用户来说可能冗余的信息，可以在用户选择访问时再加载。例如，网站的导航菜单可以是\
    \ 6 个链接，并在用户激活菜单项时按需显示指向深层页面的链接。\n\nJavaScript 可以修复布局问题。使用 JavaScript，你可以找到页面上任何元素的位置和区域以及浏览器窗口的尺寸。利用这些信息，你可以防止元素重叠等问题。例如，如果你有一个多级菜单；在显示子菜单之前检查是否存在子菜单，可以防止滚动条出现或项目重叠。JavaScript\
    \ 可以增强 HTML 提供的界面。虽然有一个文本输入框很好，但你可能想要一个来自值列表的组合框。使用 JavaScript 你可以增强普通的输入。你可以使用\
    \ JavaScript 对页面元素执行动画——例如显示和隐藏信息，或高亮页面部分——这可以使体验更加可用。\n\n## 明智且负责任地使用 JavaScript\n\
    \n当你将 JavaScript 与 Canvas 等技术混合时，几乎没有什么是你做不到的。然而，能力越大责任越大，在使用 JavaScript 时始终记住以下几点：JavaScript\
    \ 可能不可——这一点很容易测试。但是，依赖 JavaScript 的东西应该基于这种心态创建，并且要确保当 JavaScript 不可用时，你的网站不会崩溃（核心功能无法使用）。\n\
    \n如果使用 JavaScript 并不能帮助用户快速高效地实现目标，那么你可能使用方法错误。JavaScript 经常会打破人们多年使用 Web 遵循的惯例（例如点击链接进入其他页面，或代表“购物车”的小篮子）。虽然这些使用模式可能过时且效率低下，但改变它们仍然意味着用户要改变习惯——这会让人们感到不安。我们喜欢控制感，一旦我们理解了某事，就很难应对变化。你的\
    \ JavaScript 解决方案应该感觉比之前的交互自然地更好，但不至于不同到让用户无法通过之前的经验与之产生共鸣。如果你成功让网站访问者说“啊哈——这意味着我不需要等待了”或“酷酷——现在我不用多此此步了”——你就找到了\
    \ JavaScript 的绝佳用途。\n\nJavaScript 永远不应作为安全措施。如果你需要防止用户访问数据或处理敏感数据，不要依赖 JavaScript。任何保护都可以被绕过，因为所有代码都是可读的。此外，用户可以直接在浏览器中关闭\
    \ JavaScript。\n\n# 开始学习 JavaScript\n\n 入门：设置你的代码\n\n你的 JavaScript 代码放在哪里？基本上，它在你页面的\
    \ `<html>` 标签内部。你的代码以 `<script type=\"text/javascript\"` 开始，并以 `</script>` 结束。\n\
    \n```html\n<html>\n<head>\n<title>这是一个示例页面</title>\n</head>\n<body>\nWelcome to\
    \ JavaScript!\n<script type=\"text/javascript\">\ndocument.write(\"Hi there. This\
    \ text is written using JavaScript!\");\n</script>\n</body>\n</html>\n```\n\n\
    输出：Hi there. This text is written using JavaScript!\n\n如你所见，我们的脚本以 `<script lang=\"\
    javascript\">` 标签开始。红色部分是可选的，因为浏览器假设这是一个 `<script>` 标签，但出于验证考虑，你应该包含它。上面的第二行和倒数第二行是\
    \ `<!--` 和 `-->`，它们是为 JavaScript 标记的注释标签。建议包含它们，以在不支持的旧浏览器中隐藏你的代码。如果你不包含它们且有人正在使用此类浏览器，浏览器会将你所有的代码作为文本“倒”在屏幕上，换句话说，那可不好看！此脚本的唯一“功能部分”是\
    \ `document.write(\".......\")` 部分。它基本上是将你放在引号内的任何内容写入页面。先不要太担心为什么，我们稍后会详细讨论。我们用\
    \ `</script>` 结束整个代码。这会终止你的脚本并回到 html。\n\n像 html 一样，你可以在 JavaScript 代码中插入注释。JavaScript\
    \ 注释与 HTML 注释不同，后者是注释掉脚本中的行使其不被解析。JavaScript 注释的语法为：\n\n```javascript\n//这里是注释\n\
    ```\n用于单行注释，或者\n\n```javascript\n/*\n这里是注释 */\n```\n用于多行注释。\n\n例如：\n\n```javascript\n\
    <script lang=\"javascript\">\n//这个脚本什么都不做，没用处！/*\n嘿，别把我扯进这事里！\n*/\n//-->\n</script>\n\
    ```\n\n好了，我们现在准备好开始真正的编程了！\n\nJavaScript 与许多编程语言一样，依赖对象、函数和事件处理器来创建可运行的程序。如果你对这些技术术语以及如何使用它们一无知，不要担心。等我们完成这个教程时，你就会了。\n\
    \n# JavaScript 和 HTML\n\n你可以把 JavaScript 视为 HTML 的扩展；如果愿意的话，一个插件。\n\n"
- fmt: '

    Here’s how it works. HTML tags create objects; JavaScript lets you manipulate
    those objects. For example, you use the `<BODY>` and `</BODY>` tags to create
    a Web page, or document. As shown in Table 1, after that document is created,
    you can interact with it using JavaScript. For example, you can use a special
    JavaScript construct called the `onload` event handler to trigger an action —
    play a little welcoming tune, perhaps — when the document is loaded onto a Web
    browser. Examples of other HTML objects that you interact using JavaScript include
    windows, text fields, images, and embedded Java apps.


    ### Table 1: Creating and Working with Objects


    ![](Image00003.jpg)


    To add JavaScript to a Web page, all you have to do is embed JavaScript code in
    an HTML file. Below you embed the JavaScript code, you can reference, or call,
    that JavaScript code in response to an event handler or an HTML link.


    You have two choices when it comes to embedding JavaScript code in an HTML file:


    You can use the `<SCRIPT>` and `</SCRIPT>` tags to include JavaScript code directly
    into an HTML file.


    In the example below, a JavaScript function called `processOrder()` is defined
    at the top of the HTML file. Further down in the HTML file, the JavaScript function
    is associated with an event handler — specifically, the `processOrder` button’s
    `onclick` event handler. (In other words, the JavaScript code contained in the
    `processOrder()` function runs when a user clicks the processOrder button.)


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript"> // JavaScript statements go here


    function processOrder() {

    // More JavaScript statements go here }

    </SCRIPT>

    </HEAD>

    <BODY>

    <FORM NAME="myForm">

    <INPUT TYPE="button" NAME="processOrder" VALUE="Click to process your order" onclick="processOrder();">

    …

    </BODY>

    </HTML>

    ```


    You can use the `<SCRIPT>` and `</SCRIPT>` tags to include a separate, external
    JavaScript file (a file containing only JavaScript statements and bearing a `.js`
    extension) into an HTML file.


    In the example below, the JavaScript `processOrder()` function is defined in `myJS.js`.
    The function is triggered, or called, when the user clicks the Click here Process
    Order link.


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript" SRC="myJS.js"></SCRIPT>

    </HEAD>

    <BODY>

    <A HREF="javascript:processOrder()">Click here to Process Order</A>

    </BODY>

    ```


    Web pages aren’t made of HTML alone, JavaScript provides more than just HTML objects.
    JavaScript provides objects to browser plugins (such as Reader and Acrobat), the
    name and version of your browser, and current objects you can work with JavaScript.
    Together, all the objects that make up a site — HTML objects, browser plugins,
    and special objects built into the JavaScript language — are known as the document
    model (DOM).


