  trans: "\n\n设计策略应该触角渗透到公司战略的每一个，这就是为什么它是必要的并且是一个无比拟的竞争优势。它超越了身份识别和图形设计的问题；它关乎你公司发生的一切。你的客户服务如何响应？办公室里是否有鲜花和水果？接待室播放的是什么音乐？你的物流是否经过完全优化？你的产品服务排名如何？你又是如何展示它的？一切都关重要，没有什么是无关紧要，你必须拥有全局观并管理流程——设计流程。这是你最重要的流程，因为设计能帮助你在沟通中取得成功。通过良好的沟通，你将触达客户，并成为客户脑海中一个快乐且可能积极的一部分。\n\
    \n总结一下关于永恒的品牌讨论：品牌及其价值是设计过程的结果。\n\n# 我们的结语\n\n今天我们都知道，必须发展、创新并寻找新的生存方式——无论是业务、个人还是环境方面的考虑。在\
    \ David Report，我们承担起责任并关注一个业务困境——既然你可以通过创新的研发来更有强大的事情，实际上既能建立品牌又能售出更多产品/服务，为什么还要打广告呢？\n\
    \n正如你上面所读，我们主张从广告转向以设计为中心的研发。在我们看来，这是通往未来社会和商业生活的唯一途径。设计也是视觉化你的品牌和业务战略的最佳方式。聪明一点，质疑广告标准，并在我们的信誉循环中体验一下，或者换句话说：通过智能明的设计策略来建立你的品牌。\n\
    \n## C# .Net 中的数组\n\n### 什么是数组？\n\n简单来说，数组是一个有组织的集合。它可以是任何东西的集合。需要记住的重要点是它是一个集合。\n\
    \n我们每天都在使用数组\n\n一包 M&Ms 糖是数组的一个绝佳例子。我们很容易想象这袋受欢迎的糖。我们可以想象每一颗 M&Ms 从袋子里取出来时的样子。它们基本上都是一样的，但颜色不同。尽管颜色不同，但它们都是带有硬糖果外壳的巧克力糖果。一袋\
    \ M&Ms 是数据类型为 M&M's 的数组。它是糖果的集合。\n\n### 如何声明数组？\n\n声明数组与声明其他变量非常相似。唯一的区别在于你正在声明一个包含多个对象的变量。让我们比较一下这两个声明。\n\
    \n```\nString strEmotion = \"happy\";\nString[] strEmotions = {\"happy\",\"sad\"\
    ,\"elated\",\"afraid\",\"angry\",\"peaceful\"};\n```\n\n上述两个变量 `strEmotion` 和\
    \ `strEmotions` 都是使用显式声明（Explicit Declaration）声明的，这意味着值在创建的同时被设置了。通过使用括号 `[]`，编译器知道变量\
    \ `strEmotions` 将包含多个值。项目的的数量和值是通过 `=` 设置的。\n\n```\n{\"happy\",\"sad\",\"elated\"\
    ,\"afraid\",\"angry\",\"peaceful\"};\n```\n\n在这种情况下，我们将数组的大小设置为 6，因为我们添加了 6 个值。\n\
    \n### 如何获取特定值？\n\n一旦你理解了数组如何引用每个项，获取每个项目的值就并不难。起初可能会有点困惑，因为数组使用从 0 开始的引用。这意味着列表中的第一个项位于\
    \ 0 位置。哈？好的，看接几行，你就会理解了。\n\n```\nString [] strEmotions = {\"happy\",\"sad\",\"\
    elated\",\"afraid\",\"angry\",\"peaceful\"};\nstrEmotions[0] = happy (数组中第 0 位置的值)\n\
    strEmotions[1] = sad (数组中第 1 位置的值)\nstrEmotions[2] = elated (数组中第 2 位置的值)\nstrEmotions[3]\
    \ = afraid (数组中第 3 位置的值)\nstrEmotions[4] = angry (数组中第 4 位置的值)\nstrEmotions[5]\
    \ = peaceful (数组中第 5 位置的值)\n```\n\n### 将其投入应用\n\n在这个示例中，我们有一个 `System.Drawing.Color`\
    \ 数据数组，我们将用它来更改表单的背景颜色。这个非常简单的应用程序有助于理解如何引用数组中的每个不同项。它还展示了如何找到调用该函数的控件。让我们来看每一行……\n\
    \n首先声明了一个 `System.Drawing.Color` 数据数组，并同时添加了四种颜色：绿、红、黄和蓝。注意括号 `[]` 表示数组声明。因为我们在声明时填充了数组，所以我们说它是显式声明的。\n\
    \n```\nSystem.Drawing.Color[] myColor = {System.Drawing.Color.Green, System.Drawing.Color.Red,\
    \ System.Drawing.Color.Yellow, System.Drawing.Color.Blue};\n```\n\n现在我们添加一个方法并将其分配给所有单选按钮的点击事件。我们本可以为每个按钮写四个方法，但由于它们几乎完全相同，最好将它们添加到一个方法中，然后找到哪个单选按钮调用了它。这使得未来的维护也变得容易得多（一个方法胜于四个方法）。\n\
    \n```\nprivate void ChangeColors(object sender, EventArgs e)\n{\n    /* 获取调用该函数的单选按钮的引用。我们知道调用此方法的控件将是一个单选按钮，所以我们先创建一个\
    \ RadioButton 类型的变量，然后将其设置为 sender。但我们首先需要转换 sender 变量 */\n    System.Windows.Forms.RadioButton\
    \ rbtn = (System.Windows.Forms.RadioButton)sender;\n    // 现在通过名称找出是哪个单选按钮\n \
    \   if (rbtn.Name == \"rbtnGreen\") this.BackColor = myColor[0];\n}\n```\n\n##\
    \ JavaScript 和 Ajax\n\n"
