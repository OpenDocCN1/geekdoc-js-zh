    # CSS - The Basics


    Thinking about CSS, but want to learn what you need to know, or need to learn
    before jumping onto the CSS bandwidth? Let me begin by saying that CSS can reduce
    your time at the computer. But knowledge do you need to learn and is CSS compatible
    with the search engines and your browsers? These are some of the questions I''ll
    try to answer,as well as, explain a little about what CSS is all about.


    ## What is CSS?


    CSS stands for Cascading Sheets. CSS is a set of formatting instructions that
    control the looks of a web page or pages. Some of the browsers that support CSS
    is: (Firefox,IE3 or later, NN4 or later). You may be saying, great this will definitely
    save me some time. Not so fast, you also need to know that though, the majority
    of the browsers understand CSS, they do not fully support all of its capabilities.


    XHTML - XHTML is Extensible HyperText Markup Language. XHTML Is HTML with strict
    rules-that adds conformity and, is 100% XML compliant. So you should be familiar
    with or become more comfortable with HTML, XHTML, and the style properties of
    CSS.


    ## What can you do with CSS


    You can build your layout, adjusting size and color of your headings or body text,
    as well as positioning your pictures. This translates into like pages being programmed
    once, without the choice of inputting the same coding into each of your web pages
    manually. Translated, elimination of duplicate formatting.


    ## How to get the Search Engines to See Your Copy


    It has been said that the Search Engines still have some problems with understanding
    CSS. But if you want to use CSS, is there a way to get the search engines to see
    what you want.


    1. Keep your text clean, if you have too much garbage in your web page, then the
    spiders will have a difficult time in determining what is relevant and what is
    not. Thus CSS keeps your web page clean, without the redundant coding needed for
    each element of code. Here is an example of how to code a headline with the CSS
    below.


    Example: `<h1>Title</h1> (beginning and ending with ) CSS code: `h1 {font-family:
    Arial; size: 18px; bold;}`


    ## Syntax of CSS


    First, CSS can be written within any editor. But the text must be saved with a
    CSS extension.


    Syntax of CSS consists of selector and the declaration. selector is the identifier
    within the body of your web page; declaration is the code that identifies the
    style you want to put as property and rule. Let say you want all your H1 headlines
    to be green, with the font. The code for CSS would be follows:


    Note: Do not include brackets around the code.


    `selector {property: rule}`


    `H1 {color: green; font-family: Arial;}` Note that property and rule must be enclosed
    in `{}`


    ## Placement of CSS


    There are three places to put your CSS code:


    In the Head (Internal), in an external file, or within an individual tag (Inline).


    Internal - used within a single web page that may have a unique style.


    Inline - mixes code with content. Sometimes you may need to use it, but this style
    seems to eliminate the need of even using a stylesheet.


    External - The CSS is separate from the body of the web page and is linked with
    the web page. Thus, to link an external file into a web page you will need to
    use the link tag.


    Example:


    `<link rel="stylesheet" type="text/css" href="NameOfCSS.css">` (Goes in the head
    section after the title tag)


    Which way do you go? If you have a large site or a site that will be expanding,
    an external file would be a better way to quickly and easily manipulate all your
    web pages at once


    ## Watch out for Spam


    But with anything on the Internet, can be used for the good and the bad. And obviously,
    if you want to keep your site up and running for a long time, some CSS techniques
    should be avoided. Why? Because some techniques can be considered bad for search
    engines. This includes hiding techniques as: 1) hiding headlines from search 2)
    hiding content using JavaScript.


    JavaScript is also used for making your system available offline. If you are not
    familiar with CSS, take time to look at tutorials. It is informative and can get
    started with JavaScript.


    # Conclusion


    JavaScript is a wonderful technology to use on. It is not hard to learn and it
    is very versatile. It allows you to build responsive interfaces, prevent frustrating
    page loads and even fix issues for support. Using the right browser Add-ons (such
    as Google Gears or Yahoo Browser) you can even make online systems available offline
    once the computer goes online. JavaScript is also not restricted to browsers.
    The speed and small memory footprint of JavaScript in comparison to other languages
    brings up more uses for it from server-side language. The future is wide


