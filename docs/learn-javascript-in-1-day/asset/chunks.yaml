    \ but that doesn't mean that CSS and JS can't interact more closely than the basic\
    \ JavaScript frameworks will allow. Here are five ways that JavaScript and CSS\
    \ work together that you may not know about!\n\n## Get Pseudo-Element Properties\
    \ with JavaScript\n\nWe know that we can get basic style values for an element\
    \ with the style property, but what about pseudo-element properties? Yes, JavaScript\
    \ can even access those!\n\n```javascript\n// Get the color value of element:before\n\
    var color = window.getComputedStyle(document.querySelector('element'), ':before').getProperty('color');\n\
    // Get the content of element:before\nvar content = window.getComputedStyle(document.querySelector('element'),\
    \ ':before').getProperty('content');\n```\n\n## classList API\n\nWe've all used\
    \ add, remove, and toggle in favorite libraries. For the sake of supporting older\
    \ browsers, library would grab the element classes (in string format) and appending/removing\
    \ classes, then updates classes. It's a newer API for adding, removing, and toggling\
    \ classes, and it's called classList:\n\n```javascript\nclassList.add('classList');\
    \ // Adds classes\nclassList.remove('classList'); // Removes a class\nclassList.toggle('classList');\
    \ // Toggles a class\n```\n\nclassList has been implemented for a long time in\
    \ most browsers, but this API hit IE 10.\n\n## Add and Remove Rules Directly to\
    \ Stylesheets\n\nWe're all well used modifying styles via the element.style method,\
