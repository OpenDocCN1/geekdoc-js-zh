    这是它的工作原理。HTML 标签创建对象；JavaScript 让你可以操作这些对象。例如，你使用 `<BODY>` 和 `</BODY>` 标签来创建一个网页（或文档）。如表
    1 所示，创建该文档后，你可以使用 JavaScript 与其交互。例如，你可以使用一个特殊的 JavaScript 结构——`onload` 事件处理器在文档加载到网络浏览器时触发某个操作——也许播放一段简短的欢迎曲。其他你使用
    JavaScript 交互的 HTML 对象包括窗口、文本字段、图像和嵌入的 Java 应用。


    ### 表 1：创建和使用对象


    ![](img/Image00003.jpg)


    要在网页中添加 JavaScript，你所做的是将 JavaScript 代码嵌入到 HTML 文件中。在下方嵌入 JavaScript 代码处，你可以根据响应事件处理程序或
    HTML 链接来引用或调用该 JavaScript 代码。


    在 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：


    1.  你可以使用 `<SCRIPT>` 和 `</SCRIPT>` 标签将 JavaScript 代码直接包含在 HTML 文件中。

    2.  在下面的示例中，一个名为 `processOrder()` 的 JavaScript 函数定义在 HTML 文件的顶部。在 HTML 文件的后续，该
    JavaScript 函数与一个事件处理器关联——具体说是 `processOrder` 按钮的 `onclick` 事件处理器。（换句话说，当用户点击 `processOrder`
    按钮时，`processOrder()` 函数中的 JavaScript 代码就会运行。）


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript"> // 这里放置 JavaScript 语句


    function processOrder() {

    // 这里可以有更多的 JavaScript 语句 }

    </SCRIPT>

    </HEAD>

    <BODY>

    <FORM NAME="myForm">

    <INPUT TYPE="button" NAME="processOrder" VALUE="Click to process your order" onclick="processOrder();">

    …

    </BODY>

    </HTML>

    ```


    你可以使用 `<SCRIPT>` 和 `</SCRIPT>` 标签将一个独立的外部 JavaScript 文件（仅包含 JavaScript 语句并带有 `.js`
    扩展的文件）引入 HTML 文件中。


    在下面的示例中，JavaScript 函数 `processOrder()` 定义在 `myJS.js` 中。当用户点击“Click here Process
    Order”链接时，该函数会被触发或调用。


    ```html

    <HTML>

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript" SRC="myJS.js"></SCRIPT>

    </HEAD>

    <BODY>

    <A HREF="javascript:processOrder()">Click here to Process Order</A>

    </BODY>

    </HTML>

    ```


    网页不仅仅由 HTML 组成，JavaScript 提供的不仅是 HTML 对象。JavaScript 为浏览器插件（如 Reader 和 Acrobat）、你的器的名称和版本号提供对象，以及你可以使用
    JavaScript 处理的当前对象。组成网站的所有对象——HTML 对象、浏览器插件以及 JavaScript 语言内置的特殊对象——统称为文档对象模型（DOM）。


    ## HTML 基础


    如果你对 HTML 一无所知，你绝对应该从基础开始；可能先在网上做些研究。一旦你掌握了基础，其余部分应该会非常简单。然而，像每个学科一样，HTML 基础必须细心学习。你不能跳过任何一个步骤。建议一次学习
    HTML 的一个方面，只有在理解了较简单的内容后，再进入高级阶段。最后给一点建议——不要感到气馁，因为 HTML 基础看起来可能需要很长时间才能学会；但这一切最终都是值得的。


    首先，你必须知道 HTML 是什么以及为什么要使用它。HTML 是 HyperText Markup Language（超文本标记语言）的缩写，它是一种脚本语言。简单来说，HTML
    是一个仅由标记语言（文本）构成的纯文本文件。当浏览器被指示打开一个网页时，它会查找页面中的 HTML 代码。然后浏览器将将这些代码转换为布局、图像和指向其他站点的链接。你必须记住的其他基础知识之一是
    HTML 是文本文件，因此可以使用最简单的文本编辑器进行编写。一些流行的文本编辑器，如记事本（Notepad）和 Dreamweaver，可以让你使用 Word
    来创建页面。现在，这如何能让事情变得更简单，让你发现更多你感兴趣的 HTML 呢？一旦你通过文本编辑器获取页面布局，你就可以自己完成 HTML 部分。此外，如果你仍然认为自己编写
    HTML 很酷，例如，如果你觉得有互动，甚至可以从别人那里借用代码。你只需要编写代码并输出 HTML。


    关于 HTML 基础，你了解的另一个重要点是标签。标签告诉浏览器如何解码文本。然后你必须关注你自己的结构。页面结构由头部（head）、不可见的文本和标签以及可见的身体（body）组成。你必须学习每个部分以及高级结构。一旦你掌握了窍门，这应该很有趣，你会喜欢结果的。


    ## 你知道 HTML 是什么吗？


    HTML 代表 HyperText Language（超文本语言）。它本质上是人们在世界网上作为核心标记语言进行相互通信和认可的方式。超文本语言的最新版本
    HTML5 最近发布，并带有新的功能和元素。它非常易用；它就是这样设计的。你不需要成为程序员就可以使用它。它是一种为了创建网站而设计的计算机语言。这些网站随后可以被任何连接到互联网的人查看。


