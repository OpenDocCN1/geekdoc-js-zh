  trans: '


    并不是所有浏览器都严格遵守任何特定标准，因此编写一个独立浏览器的 JavaScript 程序并不容易。


    JavaScript 仅用于某些对数据安全不是主要考虑因素特定应用程序，而 Ajax 应用的范围是无限的。


    # CSS - 基础


    在思考 CSS 时，想要学习你需要了解的知识，或者在进入 CSS 领域之前需要学习什么？让我先说，CSS 可以缩短你坐在电脑前的时间。但你需要学习哪些知识呢？CSS
    是否兼容搜索引擎和你的浏览器？这些都是我将尝试回答的问题，同时也会简单解释一下 CSS 的本质。


    ## 什么是 CSS？


    CSS 代表层叠样式（Cascading Sheets）。CSS 是一组格式指令，用于控制单个或多个网页的外观。支持 CSS 的浏览器包括：（Firefox、IE3
    或更高版本、NN4 或更高版本）。你可能会说，太好了，这绝对会为我节省一些时间。别太急，你还需要知道，尽管大多数浏览器理解 CSS，但它们并没有完全支持它的所有功能。


    XHTML - XHTML 是扩展超文本标记语言。XHTML 是具有严格规则的 HTML——它增加了一致性，并且 100% 符合 XML 标准。因此，你应该熟悉
    HTML、XHTML 以及 CSS 的样式属性，并变得更加习惯。


    ## 你用 CSS 可以做什么


    你可以构建布局，调整标题或正文文本的大小和颜色，还可以定位你的图片。这意味着页面只需要编写一次，而无需手动在每个网页中输入相同的代码。换句话说，就是消除了重复的格式化。


    ## 如何让搜索引擎看到你的内容


    有人说，搜索引擎在理解 CSS 方面仍然存在一些问题。但如果你想使用 CSS，有没有办法让搜索引擎看到你想展示的内容呢？


    1. 保持你的文本整洁，如果你的网页中有太多垃圾内容，爬虫将很难判断哪些是相关的，哪些不是。因此，CSS 可以保持你的网页整洁，而无需为每个代码元素编写冗余代码。以下是一个使用
    CSS 编写标题的示例。


    示例：`<h1>Title</h1>`（以 ) 开头和结尾）CSS 代码：`h1 {font-family: Arial; size: 18px; bold;}`


    ## CSS 语法


    首先，CSS 可以在任何编辑器中编写。但文本必须以 CSS 扩展名保存。


    CSS 语法由选择器（selector）和声明（declaration）组成。选择器是网页正体内的标识符；声明是标识你想作为属性和规则的样式的代码。假设你想让你所有的
    H1 标题都变成绿色，并使用某种字体。CSS 的代码如下：


    注意：不要在代码周围包含括号。


    `selector {property: rule}`


    `H1 {color: green; font-family: Arial;}` 注意，属性和规则必须包含在 `{}` 中


    ## CSS 的放置位置


    有三个放置 CSS 代码的地方：


    在 `head` 标签中（内部）、在外部文件中，或者在单个标签内（内联）。


    内部 - 用于具有独特样式的单个网页内。


    内联 - 将代码与内容混合。有时你可能需要使用它，但这种样式似乎甚至消除了了使用样式表的需求。


    外部 - CSS 与网页正体分离并与网页链接。因此，要将外部文件链接到网页中，你需要使用 `link` 标签。


    示例：


    `<link rel="stylesheet" type="text/css" href="NameOfCSS.css">`（放在 `title` 标签之后的
    `head` 部分）


    你会选择哪种方式？如果你有一个大型网站或一个将扩展的网站，外部文件将是快速方便地同时操作所有网页的更好方法。


    ## 注意防垃圾信息


    但对于互联网上的任何事物，都可以用于善意，也可以用于恶意。显然，如果你想让你的网站长期运行，就应该避免某些 CSS 技术。为什么？因为某些技术被认为对搜索引擎是有害的。这包括隐藏技术，如：1)
    从搜索中隐藏标题 2) 使用 JavaScript 隐藏内容。


    JavaScript 也用于让你的系统离线可用。如果你不熟悉 CSS，花时间看一些教程。它们信息丰富，并且可以开始学习 JavaScript。


    # 结论


    JavaScript 是一项非常值得投入的技术。它并不难学，而且非常通用。它允许你构建响应式界面，防止令人沮的页面加载，甚至为支持工作修复问题。使用正确的浏览器插件（如
    Google Gears 或 Yahoo 浏览器），你甚至可以在电脑上线后让在线系统离线可用。JavaScript 并不局限于浏览器。与其他语言相比，JavaScript
    的速度和低内存占用使其在服务器端语言方面具有了更多用途。未来是广阔的。


