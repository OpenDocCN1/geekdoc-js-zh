  \n*自我修正：提供的文本包含大量重复段落。我将根据“保留核心内容”的指令进行去重。*\n\n（实际上，查看输入，重复是源文本中的复制粘贴错误。我将确保最终输出是干净且格式正确的。）\n\
  \n这是它的工作原理。HTML 标签创建对象；JavaScript 让你可以操作这些对象。例如，你使用 `<BODY>` 和 `</BODY>/>` 标签来创建一个网页（或文档）。如表\
  \ 1 所示，创建该文档后，你可以使用 JavaScript 与其交互。例如，你可以使用一个特殊的 JavaScript 结构——`onload` 事件处理器在文档加载到网络浏览器时触发某个操作——也许播放一段简短的欢迎曲。其他你使用\
  \ JavaScript 交互的 HTML 对象包括窗口、文本字段、图像和嵌入的 Java 应用。\n\n## 表 1：创建和使用对象\n\n![](img/Image00003.jpg)\n\
  \n要在网页中添加 JavaScript，你所做的是将 JavaScript 代码嵌入到 HTML 文件中。在下方嵌入 JavaScript 代码处，你可以根据响应事件处理程序或\
  \ HTML 链接来引用或调用该 JavaScript 代码。\n\n在 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：\n\n1.  你可以使用\
  \ `<SCRIPT>` 和 `</SCRIPT>` 标签将 JavaScript 代码直接包含在 HTML 文件中。\n2.  在下面的示例中，一个名为 `processOrder()`\
  \ 的 JavaScript 函数定义在 HTML 文件的顶部。在 HTML 文件的后续，该 JavaScript 函数与一个事件处理器关联——具体说是 `processOrder`\
  \ 按钮的 `onclick` 事件处理器。（换句话说，当用户点击 `processOrder` 按钮时，`processOrder()` 函数中的 JavaScript\
  \ 代码就会运行。）\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT LANGUAGE=\"JavaScript\"> // 这里放置\
  \ JavaScript 语句\n\nfunction processOrder() {\n// 这里可以有更多的 JavaScript 语句 }\n</SCRIPT>\n\
  </HEAD>\n<BODY>\n<FORM NAME=\"myForm\">\n<INPUT TYPE=\"button\" NAME=\"processOrder\"\
  \ VALUE=\"Click to process your order\" onclick=\"processOrder();\">\n…\n</BODY>\n\
  </HTML>\n```\n\n你可以使用 `<SCRIPT>` 和 `</SCRIPT>` 标签将一个独立的外部 JavaScript 文件（仅包含 JavaScript\
  \ 语句并带有 `.js` 扩展的文件）引入 HTML 文件中。\n\n在下面的示例中，JavaScript 函数 `processOrder()` 定义在 `myJS.js`\
  \ 中。当用户点击“Click here Process Order”链接时，该函数会被触发或调用。\n\n```html\n<HTML>\n<HEAD>\n\
  <SCRIPT LANGUAGE=\"JavaScript\" SRC=\"myJS.js\"></SCRIPT>\n</HEAD>\n<BODY>\n<A HREF=\"\
  javascript:processOrder()\">Click here to Process Order</A>\n</BODY>\n</HTML>\n\
  ```\n\n网页不仅仅由 HTML 组成，JavaScript 提供的不仅是 HTML 对象。JavaScript 为浏览器插件（如 Reader 和 Acrobat）提供对象、你的器的名称和版本号，以及你可以使用\
  \ JavaScript 处理的当前对象。组成网站的所有对象——HTML 对象、浏览器插件以及 JavaScript 语言内置的特殊对象——统称为文档对象模型（DOM）。\n\
  \nHTML 基础\n\n如果你对 HTML 一无所知，你绝对应该从基础开始；可能先在网上做些研究。一旦你掌握了基础，其余部分应该会非常简单。然而，像每个学科一样，HTML\
  \ 基础必须细心学习。你不能跳过任何一个步骤。建议一次学习 HTML 的一个方面，只有在理解了较简单的内容后，再进入高级阶段。最后给一点建议——不要感到气馁，因为\
  \ HTML 基础看起来可能需要很长时间才能学会；但这一切最终都是值得的。\n\n首先，你必须知道 HTML 是什么以及为什么要使用它。HTML 是 HyperText\
  \ Markup Language（超文本标记语言）的缩写，它是一种脚本语言。简单来说，HTML 是一个仅由标记语言（文本）构成的纯文本文件。当浏览器被指示打开一个网页时，它会查找页面中的\
  \ HTML 代码。然后浏览器将将这些代码转换为布局、图像和指向其他站点的链接。你必须记住的其他基础知识之一是 HTML 是文本文件，因此可以使用最简单的文本编辑器进行编写。一些流行的文本编辑器，如记事本（Notepad）和\
  \ Dreamweaver，可以让你使用 Word 来创建页面。现在，这如何能让事情变得更简单，让你发现更多你感兴趣的 HTML 呢？一旦你通过文本编辑器获取页面布局，你就可以自己完成\
  \ HTML 部分。此外，如果你仍然认为自己编写 HTML 很酷，例如，如果你觉得有互动，甚至可以从别人那里借用代码。你只需要编写代码并输出 HTML。\n\n\
  关于 HTML 基础，你了解的另一个重要点是标签。标签告诉浏览器如何解码文本。然后你必须关注你自己的结构。页面结构由头部（head）、不可见的文本和标签以及可见的身体（body）组成。你必须学习每个部分以及高级结构。一旦你掌握了窍门，这应该很有趣，你会喜欢结果的。\n\
  \n你知道 HTML 是什么吗？\n\nHTML 代表 HyperText Language（超文本语言）。它本质上是人们在世界网上作为核心标记语言进行相互通信和认可的方式。超文本语言的最新版本\
  \ HTML5 最近发布，并带有新的功能和元素。它非常易用；它就是这样设计的。你不需要成为程序员就可以使用它。它是一种为了创建网站而设计的计算机语言。这些网站随后可以被任何连接到互联网的人查看。\n\
  \n它是浏览器用于显示网页内容的标记语言。它控制网页上的格式、字体、页边距、布局、颜色、链接以及网页上的其他若干项。它并不是设计用于控制文档布局的这些方面。你应该做的是使用它来标记段落、列表、超文本链接以及文档的其他结构部分，然后添加样式表。（此处省略重复内容翻译，仅保留核心逻辑）\n\
  \nHTML 代表 HyperText Language（超文本语言）。它本质上是人们在世界网上作为核心标记语言进行相互通信和认可的方式。超文本语言的最新版本\
  \ HTML5 最近发布，并带有新的功能和元素。它非常易用；它就是这样设计的。你不需要成为程序员就可以使用它。它是一种为了创建网站而设计的计算机语言。这些网站随后可以被任何连接到互联网的人查看。\n\
  \n\n\n\n\n这是一种非常稳定的标记语言格式。其命令在任何地方含义都相同。它经常被人们批评为一种糟糕的语言。习惯了使用 XML 的人们经常抱怨它缺乏用于标记作者和日期等内容的良好元素。\n\
  \n它被用于结构化信息——将某些文本标记为标题、段落、列表等——并可以在某种程度上描述文档的外观和语义。\n\n它是为了构建文档而设计的。关键在于：如果你按照它的预期用途使用它，你将拥有一个漂亮且更具语义化的网络，它终于可以停止被滥用来构建那些并非设计初的复杂应用程序。它并不是，因为它是一种功能性标记语言（具体主要用于文档结构），而不是页面布局语言。其具体的渲染效果并非由发布的文档指定，而是在某种程度上由浏览器决定。\n\
  \n它是最为人知的标记语言。尽管该库是用 C 语言编写的，但各种语言绑定使其能够在其他环境中可用。它是一种非交互式布局语言。它可以布局文本和图形，并提供颜色、粗体字体、闪烁字体等。HTML\
  \ 也是一种超文本标记语言。超文本是任何格式的文本，但增加了一个功能：文本部分部分链接到其他部分，使得从一个部分跳转到另一个部分变得容易。\n\n它并不是为了持有内容，它包含了描述自身和引用内容的数据。网络上的文本不是线性的，而是超文本。它的目的不是产生预期的视觉效果，而是为了允许信息以结构化的方式组织，以便任何基于文本的格式中渲染。它就是代码，仅此而已。\n\
  \n它不是一种编程语言——它是一种“标记”语言，其中嵌入了描述文档结构、布局和格式的代码。这些代码由浏览器“解释”或“解析”，然后页面完全是按照设计意图生成的。它通常在\
  \ Firefox 或 Internet Explorer 等浏览器中读取。由于网页的默认属性已经了定义，HTML 在不同浏览器中的看起来可能有所不同。它本质上是人们在万网上交流和认可彼此的方式，是核心标记语言。最新版本的超文本标记语言\
  \ HTML5 最近已发布，带有许多值得自豪的新功能和元素。\n\n它并不是一种语言。它由放置在元素周围的标签组成，这些标签会改变元素的属性。HTML 是一种复杂的脚本语言，而这个免费文本编辑器可能就是轻松创建网站的关键。它由一系列类似于命令的标签组成，告诉浏览器要做什么。这些标签可以输入到任何普通的文本编辑器（如记事本或\
  \ Simple text）中，并按照正确的顺序形成网页。\n\n它是相对弱的超文本实现的基础。早期的超文本系统具有如类型链接、传输和源跟踪等功能。它是主要用于设计网页的语言。我们可以在\
  \ HTML 的帮助下进行格式设置和表单设计。它的读法是一个字母一个字母地，就像拼写 HTML 这个词一样。它不读作 \"hitmill\"，而且它不是编程语言。它并非用于控制元素部分。你应该用它来标记文档的标题、段落、列表和其他部分，然后单独添加样式进行布局，就像你在任何\
  \ DTP 出版页面中做的那样。它是世界上最基础、常见的语言，而且值得学习。\n\n它是最先进且完全按人类意图创建的内容。但处理过程（无论是可访问性问题还是浏览器本身）对于在线信息已变得与人类阅读内容一样重要。它优于\
  \ HTML，并且得到了所有主流浏览器的更好支持。它是 SGML（缩短了语言并带有数量标签的）。SGML 本身有一套语法，所有用它创建的应用程序必须遵循该语法，但本身（此处省略与此显示无关的标签）。\n\
  \nHTML 是一系列用于在 Yelp 上创建网页以及更改所显示功能的代码。对于一个简单易懂的 HTML 教程，应该先创建一个计数。HTML 由浏览器处理。当浏览器读取你\
  \ HTML 文档中的 JavaScript 时，它会处理代码，然后在网页中显示任何输出。\n\n# 为什么你正在构建网站就应该了解 HTML 代码\n\n20\
  \ 年前，当互联网还处于婴儿时代时，构建网页的唯一方法就是简单使用记事本，这是 Microsoft Windows 带的一个免费文本编辑器。现在，随着互联网变成音乐、特效和闪烁的合集，编写\
  \ HTML 代码的艺术正逐渐被 Microsoft Homepage 和 Macromedia Weaver 等 HTML 编辑器所取代。然而，无论你喜不喜欢，要构建网站，你仍然需要知道基础的\
  \ HTML 代码。\n\n让我来解释一下……\n\nHTML 或超文本标记语言本质上是万维网的语言。没有 HTML，我们的浏览器（如 Netscape、Internet\
  \ Explorer 或 Firefox）将无法解析我们的网页。HTML 是一系列用于在 Yelp 上创建网页以及更改所显示功能的代码。对于一个简单易懂的 HTML\
  \ 教程，应该先创建一个计数。HTML 由浏览器处理。当浏览器读取你 HTML 文档中的 JavaScript 时，它会处理代码，然后在网页中显示任何输出。\n\
  \n\n\n\n许多 HTML 编辑器会为你提供弹出窗口，帮助你设置描述和关键词的元数据，但它们忽略了其他重要的元数据，例如搜索引擎爬虫是否应该索引所有页面、网页语言、字符集以及你根据\
  \ HTML 标准创建的文档类型。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0 Transitional//EN\"\
  >\n<html\n<head>\n<meta http-equiv=\"Content-Language\" content=\"en-us\">\n<meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=windows-1252\">\n<meta\
  \ name=\"GENERATOR\" content=\"Microsoft FrontPage 6.0\">\n<meta name=\"ProgId\"\
  \ content=\"FrontPage.Editor.Document\">\n<title>Your Title Goes Here</title>\n\
  <meta name=\"description\" content=\"Your Description Goes Here\">\n<meta name=\"\
  keywords\" content=\"Your Keywords Go Here\">\n<meta name=\"robots\" content=\"\
  index,all\">\n</head>\n</html>\n```\n\n我应该注意的一点是，仅仅因为你提供了这些信息并不意味着：\n\na) 所有的搜索引擎都使用这些信息\n\
  b) 你保证能在搜索引擎中获得领先位置\n\n但在你的网页中包含这些微小元素，特别是当它们组合在一起时，无疑会对你的搜索引擎表现有所提升。记住，每个搜索引擎都是不同的，用于网站的算法是黑箱，但如果你添加了这些元素，你会在积极方面获得一些分数。\n\
  \n将这些信息放入你的网站还有另一个原因。没有包含这些某些信息会影响视障人士查看你网站的能力。这听起来可能很奇怪，但视障人士可以将网页转换为消息的工具。然而，如果你的标签中没有包含上述概述的信息（如内容语言和字符集），将影响他们的浏览器是否正确读取你的网站。如果你的客户群体是由那些禁用了功能的人组成的，那么你就是在失去客户。\n\
  \n你应该学会编写至少基础代码的其他原因之一是帮助你构建指向页面的链接。你可以用来构建这些链接的技术是编写提供人们关于你业务信息的文章。例如，如果你拥有一个销售所有高尔夫用品的网站，你可能考虑编写关于如何选择高尔夫球杆以及哪里可以找到最好的高尔夫球具的文章。\n\
  \n当你将文章提交到 EasyArticles.com、GoArticles.com 或 ArticlesON.com 等地方时，他们会要求你使用某些 HTML\
  \ 标签来突出你的文章。例如，通常在文章正文中，你只能使用粗体、斜体、下划线和列表项，但在其他区域（如放置详细信息的地方），你可以添加超链接和超文本。现在在之前提到的三个文章提交网站中，如果你想添加超链接，你必须了解基础\
  \ HTML 代码，因为他们不会为你构建链接，你必须从头开始编写 HTML 标签。\n\n当你构建链接回你网页的超链接时，你希望确保两点：\n\n1. 超链接（即你正在链接的网页或网站）包含了文件夹或网页的关键词。\n\
  2. 让超文本也广为人知。\n\n让我们来看一个基础示例。如果我写了一篇关于一款新款高尔夫球杆的介绍，我知道它将售出数百万个并引起大量关注，那么我链接到提供该高尔夫球杆信息的网页的链接将如下所示构建。让这个高尔夫球杆的名字为\
  \ Heart X。\n\n# 学习 jQuery\n\n## 创建一个 jQuery 插件\n\n有时，在整个代码中使用一个函数是很有用的。也许你想要一个可以在\
  \ jQuery 上调用并执行此类操作的函数。或者你可能在你其中一个项目里写了一个工具函数，现在你想能够将其移动到其他项目中。如果编写插件是你的最佳选择，那么\
  \ jQuery 非常棒。它是跨浏览器的，易于学习，并帮助你制作用户友好的界面。它还带有很多许多实用的插件来完成你想要的任何操作。\n\n但有时仅仅这些是不够的，如果你找不到适合你需求的插件怎么办？或者可能存在某个插件，但它太大了，而你只需要一部分。解决方案可能是卷起袖子编写你自己的东西。毕竟，这听起来比实际要复杂。这篇简短教程将介绍编写简单插件、添加一些选项、甚至执行回调的过程。\n\
  \n## 设置\n\n你可以从 GitHub 下载整个项目\n\n在本教程中，我们将创建一个简单的手风琴式（accordion）插件。让我们创建一个 js 文件并将其放在网站的\
  \ \"js\" 目录下。传统上，所有的 js 插件文件都以 \"jquery dot\" 开头，加上实际插件名称，因此我们将命名为 \"jquery.simple-accordion.js\"\
  。\n\n- 我们网站目录下的 js 目录中的插件文件\n\n现在，我们需要将插件文件同 jQuery 库一起包含到我们的主 HTML 页面（index.html）中。最佳实践是从\
  \ Google 服务器引入 jQuery 库，因为它们遍布全球，这样你的单服务器加载速度更快。从 Google 引入 jQuery 的另一个优势是当浏览器正确读取你的网站时。\n\
  \n## jQuery 结构\n\njQuery 的构建包含了所有帮助你开发插件的钩。但为了保持代码整洁，我们必须确保一切保持在局部作用域内。让我们从 jQuery\
  \ 的基本外壳开始：\n\n```javascript\nfunction($) {\n  $.fn.simpleAccordion = function()\
  \ {\n    // TODO: simpleAccordion 插件的代码\n  }\n}(jQuery));\n```\n\n让我们看看这里发生了什么。将所有内容包含在\
  \ (function() {}) 模式中，确保我们插件中的所有变量都留在全局命名空间之外。我们不会与此页面运行的任何其他脚本冲突，所以我们必须像上面那样隔离我们的代码。\n\
  \n你可能注意到的另一个点是，我们是以 jQuery 处于“无冲突”模式的方式来定义插件的。再次，我们正在避免与页面上的其他脚本冲突，因此我们想确保插件不依赖于可能被其他库使用的默认\
  \ $。最后$.fn 是 jQuery 允许你定义插件的方式，我们将其命名为 simpleAccordion。所有组件都就绪后，让我们开始吧！\n\n## 为我们的插件添加功能\n\
  \njQuery 的伟大之处在于它允许你使用任何你选择器。然而，你必须记住，我们的插件可能会处理多种不同的元素类型。使用 \"this\" 关键字让我们的插件通过循环访问每个元素，无论元素类型如何来应用关联函数。\n\
  \n准备 HTML 部分 - 构建手风琴结构\n\n由于我们要构建手风琴，我们需要为它准备结构，如下所示：\n\n### 标题 1\n\n### 标题 2\n\n\
  ### 标题 3\n\n\n\n\nFalse site acute is just malesuada fabulous. Heading 4\n\nAli\
  \ quam tincidunt lobortis sem at porttitor.\n\n这是一个简单的折风琴结构，定义了四个标题及其各自的内容区域。我们的思路是，插件将把这段\
  \ HTML 代码转换为一个功能性的折风琴，用户可以打开和折叠不同的部分。\n\n它目前看起来应该是这样的：\n\n为了让它看起来更漂亮，我们需要添加一些简单的样式。我们开始：\n\
  \n```css\n.accordion {\nwidth: 600px;\nborder: 1px solid #ccc;\nborder-bottom: none;\n\
  }\n\n.accordion dt,.accordion dd {\nborder-bottom: 1px solid #ccc; margin: 0px;\n\
  }\n\n.accordion dt {\nbackground: rgb(193, 221, 252, 0.24);\ncursor: pointer;\n\
  padding: 8px 4px;\nfont-size: 14px;\nfont-weight: bold;\n}\n\n.accordion dd {\n\
  padding: 12px 8px;\n}\n```\n\n现在我们的折风琴结构看起来应该是这样的：jQuery 部分 - 是时候让它动起来了！\n\n为了给我们的插件添加功能，我们将编辑\
  \ js 文件并添加以下代码：\n\n```javascript\n(function($) {\n  $.fn.simpleAccordion = function(options)\
  \ {\n    return this.each(function() {\n      var dts = $(this).children('dt');\n\
  \      dts.click(accordionClick);\n      dts.each(reset);\n    });\n    function\
  \ accordionClick() {\n    $(this).siblings('dt').each(hide);\n    $(this).next().slideDown('fast');\n\
  \    return false; }\n  function hide() {\n    $(this).next().slideUp('fast');\n\
  \  }\nfunction reset() {\n    $(this).next().hide();\n  }\n})(jQuery);\n```\n\n\
  让我们快速过一下这段代码的作用。首先，你需要理解 jQuery 是一个扩展 JavaScript 语言的库。在创建任何 jQuery 插件时，你本质上是在扩展\
  \ jQuery 库，而 jQuery 正在扩展 JavaScript。真正理解你的插件如何扩展 jQuery 库，需要理解 JavaScript 的原型（prototype）属性。虽然它没有被直接使用，但\
  \ JavaScript 原型属性在后台通过 jQuery 的属性 `fn` 使用，`fn` 是原生 JavaScript 原型属性的 jQuery 别名。\n\
  \n简单来说，你通过 `.yourplugin-name` 从 jQuery 扩展你的插件。此外，你还可以为插件添加选项。jQuery 插件包含默认选项。选项是可以传递给插件的参数。与其将一切都作为对象发送，你可以发送多个属性，这是\
  \ jQuery 的标准做法。在插件遵循选项时，最佳实践是使用默认选项。让我们快速为插件添加一些选项，展示我们如何使用 `option:false` 的默认值：因此，如果没有传递任何选项，插件将假设你希望在首次加载时折风琴是关闭的。当插件接收到选项时，你可以依靠\
  \ `.extend` 方法来实现实际的覆盖。`.extend` 方法的作用是合并或多个对象。\n\n# JavaScript 和 CSS\n\nCSS 和 JavaScript：这两者的界限似乎随着每个浏览器的发布而变得模糊。它们的工作一直非常不同，但最终它们都是前端技术，因此它们需要紧密配合。我们有\
  \ .js 文件和 .css 文件，但这并不意味着 CSS 和 JS 无法进行比基础 JavaScript 框架允许的更紧密的交互。这里是 JavaScript\
  \ 和 CSS 协作工作的五种你可能不知道的方式！\n\n## 使用 JavaScript 获取伪元素属性\n\n我们知道可以通过 `style` 属性获取元素的基本样式值，但伪元素属性呢？是的，JavaScript\
  \ 甚至可以访问它们！\n\n```javascript\n// 获取 element:before 的颜色值\nvar color = window.getComputedStyle(document.querySelector('element'),\
  \ ':before').getProperty('color');\n// 获取 element:before 的内容\nvar content = window.getComputedStyle(document.querySelector('element'),\
  \ ':before').getProperty('content');\n```\n\n## classList API\n\n我们都在喜爱的库中使用过 `add`、`remove`\
  \ 和 `toggle`。为了支持旧版浏览器，库会获取元素的类名（字符串格式）并添加/删除类名，然后更新类。这是一个用于添加、删除和切换类的较新 API，它被称为\
  \ `classList`：\n\n```javascript\nclassList.add('classList'); // 添加类\nclassList.remove('classList');\
  \ // 删除类\nclassList.toggle('classList'); // 切换类\n```\n\n`classList` 在大多数浏览器中已经实现了很长时间，但这个\
  \ API 直到 IE 10 才出现。\n\n## 直接向样式表添加和删除规则\n\n我们都习惯了通过 `element.style` 方法修改样式，并使用 JavaScript\
  \ 工具包来完成，但你知道你实际上可以读取和写入新旧样式表中的规则吗？这个 API 实际上非常简单！\n\n```javascript\nfunction addCSSRule(sheet,\
  \ selector, rules, index) {\n if(sheet.insertRule) {\nsheet.insertRule(selector\
  \ + \"{\" + rules + \"}\", index);\n} else {\nsheet.addRule(selector, rules);\n\
  }\n}\naddCSSRule(document.styleSheets[0], \"header\", \"float: left\");\n```\n\n\
  最常见的用例是创建一个新的样式表，但如果你想修改现有的样式表，尽管去吧。\n\n## 使用加载器加载 CSS 文件\n\n懒加载图像、JSON 和脚本等资源是缩短加载时间的极方法。我们可以使用\
  \ JavaScript 加载器（如 curl.js）加载这些外部资源，但你你知道可以懒加载样式表并在同一个回调中获取通知吗？\n\n```javascript\n\
  curl( [\n  \"namespace/MyWidget\",\n  \"css!namespace/resources/MyWidget.css\"\n\
  ],\nfunction(MyWidget) {\n  // 对 MyWidget 进行操作\n  // CSS 引用不在签名中，因为我们不在乎它； // 我们只在乎它已经在页面上了\n\
  });\n```\n\n# CSS 基础\n\n## CSS pointer-events\n\nCSS `pointer-events` 属性几乎像 JavaScript\
  \ 一样运行，在值为 `none` 时禁用元素。你可能会说“那怎样”，但 `pointer-events` 甚至可以阻止事件触发。\n\n```css\n.disabled\
  \ { pointer-events: none; }\n```\n\n该包可以通过 bower `bower install css-essentials`\
  \ 获取或使用 `<link rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/cssessentials.css\"\
  >` 或通过 npm 获取\n\n我们确定比通常的 3-4 个断点才能真正将设计调整到所有屏幕。因此，我们定义了以下断点：\n\n@of-xsm: 460px;\
  \ @of-sm: 606px; @of-md: 800px; @of-lg: 1164px; @of-xlg: 1440px; @of-xxlg: 1740px;\n\
  \n\n\n\n\n默认情况下，行（row）两侧有 24px 的内边距（在 xxsm 屏幕上为 0，在 xsm 屏幕上为 12px），每列之间有 12px 的间距。可以使用\
  \ `.of-row-no-padding` 去除行的内边距。\n\n## 加载动画\n\n加载动画可以指示正在加载状态。\n\n快速开始：\n\n```html\n\
  <div class=\"of-row\">\n  <div class=\"xxsm-col-24\">\n    <div id=\"loading-bar-spinner\"\
  >\n      <div class=\"spinner-icon\"></div>\n    </div>\n  </div>\n</div>\n```\n\
  \n## 文本截断\n\n当你想让文本在一行内显示并在超出行宽时进行截断时，文本截断功能非常有用。\n\n快速开始：\n\n```html\n<div class=\"\
  of-row\">\n  <div class=\"xxsm-col-12\">\n    <div class=\"truncate-text\">\n  \
  \    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce non elit eget\
  \ turpis porttitor blandit non as felis. In consequat, ligula eu condimentum commodo,\
  \ mi sapien suscipit metus, as laoreet lorem enim id nulla. Phaseellus at tincidunt\
  \ quam, as auctor ex. Aenean sed gravida orci, vitae tristique ante. Suspendisse\
  \ vestibulum eros orci, vitae bibendum mi ullamcorper et. Nulla ultises elementum\
  \ ipsum, quis congue est molestie vel. Vestibulum ante primis in faucibus orci luctus\
  \ et ultises posuere cubilia Curae; Pellentesque sed elit cursus. Duis sodales urna\
  \ pellentesque feugiat maximus. Quisque viver libero eu convallis malesuada. Sed\
  \ sodales varius aculis. Phaseellus cursus pulvinar magna, element arcu blandit\
  \ in. Vivamus ultices velit vel felis laoreet, at cursus metus molestie. Maecenas\
  \ dolor dui, commodo nec turpis eu, suscipit velit vehicula massa.\n    </div>\n\
  \  </div>\n</div>\n```\n\n## 向上浮动动画\n\n向上浮动画是元素悬停时的一个很棒的效果。\n\n快速开始：\n\n只需在你的任何元素上添加\
  \ `.of-push-up-animation` 类即可。\n\n## 自定义定制\n\n你可以通过编辑 `src/base/breakpoints.less`\
  \ 文件中的值并重新编译项目来编辑网格断点。\n\n```bash\nnpm install && grunt release\n```\n\n## 命令行值\n\
  \n除了此以外，你还可以向 grunt 命令传递网格断点的所需值：\n\n```bash\nnpm install && grunt release --breakpoints='xxsm\
  \ 0px, xsm 460px, sm 600px, md 800px, lg 1440px, xlg 1740px'\n```\n\n此 `breakpoints`\
  \ 参数将覆盖 `src/base/breakpoints` 中指定的默认值。它必须用逗号分隔，每个断点由 `name:width` 组成（值如 0px, 300px,\
  \ 500px 等）。\n\n## 每位设计师都应该知道的 20 个核心 CSS\n\n### 1. 绝对定位\n\n如果你想始终控制元素在网站上的显示位置，绝对定位是实现这一点的关键。如果你将浏览器看作一个大盒子，绝对定位允许你精确控制元素停留的位置。使用\
  \ top、right、bottom 和 left 配合像素值来控制元素的位置。\n\n```css\nposition: absolute;\ntop: 20px;\n\
  right: 20px;\n```\n\n上面的 CSS 将元素设置为距离浏览器顶部和右侧 20px。你也可以在 div 内部使用绝对定位。\n\n### 2.\
  \ * 选择器\n\n`*` 选择器允许你选择特定选择器下的所有元素。例如，如果你使用了 `*` 并给它添加了 CSS 样式，它将应用于文档中所有带有 `<p>`\
  \ 标签的元素。这使得全局性定位网站的某些部分变得简单。\n\n### 3. 覆盖所有样式\n\n这应该谨慎使用，因为如果你对所有内容都这样做，从长远来看你会遇到麻烦。然而，如果你想为特定元素覆盖另一个\
  \ CSS 样式，请在 CSS 样式后后使用 `!important`。例如，如果我想让网站中特定区域的 H2 标题变为红色而不是蓝色，我会使用以下 CSS：\n\
  \n```css\n.section h2 { color:red !important; }\n```\n\n### 4. 居中\n\n居中处理起来棘手，因为取决于你想居中什么。让我们来看看基于内容对待居中项的\
  \ CSS。\n\n#### 文本\n文本使用 `text-align:center;` 居中。如果你想让它靠某一侧，请使用 left 或 right 代替 center。\n\
  \n#### 内容\n通过为 div（或任何其他元素）添加 `block` 属性并使用自动边距（auto margins），可以实现居中。CSS 如下：\n\n\
  ```css\n#div1 {\n  display: block;\n  margin: auto;\n  width: anything under 100%;\n\
  }\n```\n我将宽度设置为“100% 以下的任何值”是因为，如果宽度为 100%，它将是全宽的，不需要居中。最好有一个固定宽度，如 60% 或 550px\
  \ 等。\n\n### 5. 垂直对齐（针对文本行）\n\n你将在 CSS 导航菜单中使用此来确保……关键是让菜单的高度和文本的行高（line-height）匹配。我在为客户回改网站时经常看到这种技术。\n\
  \n```css\nnav {\n  height: 50px;\n  line-height: 50px;\n}\n```\n\n### 6. 悬停效果\n\n\
  这是用于元素悬停时的效果。\n\n#### 过渡\n为了让变化更平滑，你可以使用过渡。\n\n```css\ntransition: all 0.3s ease;\n\
  ```\n\n### 7. 链接状态\n\n这些样式被很多设计师忽略了，这真的会对用户体验产生影响。`:link` 伪类控制尚未点击的链接。`:visited`\
  \ 伪类处理已访问链接的样式。\n\n```css\na:link { color: blue; }\na:visited { color: purple; }\n\
  ```\n\n### 8. 轻松缩放图片以适应\n\n有时你需要图片适应特定宽度，同时按比例缩放。处理此问题的一种简单方法是使用最大宽度。这里是一个示例：\n\n\
  ```css\nimg {\n  max-width: 100%;\n  height: auto;\n}\n```\n\n### 9. 控制区域的元素\n\n\
  使用上面的示例，如果你只想针对特定区域（如博客）的图片，请为该区域创建一个类并结合实际选择器。这允许你只选择博客区域的图片，而不是其他图片，例如你的 Logo、社交图标或网站任何其他区域（如侧边栏）的图片。CSS\
  \ 如下：\n\n```css\n.blog img {\n  max-width: 100%;\n  height: auto;\n}\n```\n\n###\
  \ 10. 直接子元素\n\n我希望自己在刚开始使用 CSS 时就知道这个。这本可以节省我大量时间！使用 `>` 选择元素的直接子元素。例如：\n\n```\n\
  #footer > a\n```\n这将选择并设置位于 Footer ID 下的所有活动链接元素的样式。它不会选择活动元素之后的元素，也不会选择包含在 footer\
  \ 中的任何其他内容（如纯文本）。\n\n\n\n\n\n# 特定子元素\n\n相信我，这在你为列表设置样式时非常有用。你只需要计算你想要样式的元素向下数是第几个项目，然后应用该样式即可。\n\
  \n```css\nli:nth-child(2) {\n  font-weight:800; color: blue;\n  text-style:underline;\n\
  }\n```\n\n上面的 CSS 针对列表中的第二个项目，并使其加粗、带有下划线并变为蓝色。在括号数字后添加一个 \"n\"，你就可以针对每 2 个列表项目。想象一下能够为表格样式的布局中的每隔行设置样式，以便于阅读。CSS\
  \ 编写如下：\n\n```css\nli:nth-child(2n)\n```\n\n## 1 将 CSS 应用到多个类名或选择器\n\n假设你想为所有图像、博客区域和侧边栏添加相同的边框。你不需要编写\
  \ 3 次完全相同的 CSS。只需要用逗号将这些项目列出来即可。这里有一个示例：\n\n```css\n.blog, img, .sidebar {\n  border:\
  \ 1px solid #000;\n}\n```\n\n无论你是已经做了多年的网页设计师，还是刚刚起步，学习如何正确构建网站似乎像是一段坎折且无止尽的旅程。一旦你确定了想要学习的语言，就必须学习并精炼你的技能。\n\
  \n无论你学习什么，CSS 都是必不可少但又令人敬畏的技能之一。不过，它并不一定困难，特别是如果你知道一些实用且鲜为人知的 CSS 技术来完成工作。\n\n##\
  \ 12 box-sizing: border-box;\n\n这是许多网页设计师的最爱，因为它解决了内边距（padding）和布局问题。基本上，当你给一个框设置特定宽度并添加内边距时，内边距会框的大小。然而，使用\
  \ `box-sizing:border-box;` 后，这种情况被消除了，框保持其应有的尺寸。\n\n![](img/Image00004.jpg)\n\n\
  ## 13 :before\n\n这种 CSS 选择器允许你选择一个 CSS 元素，并在应用了特定类的每个元素之前插入内容。假设你有一个网站，想在每个 H2 标签之前显示特定的文本。你将使用这种设置：\n\
  \n```css\nh2:before {\n  content: \"Read: \";\n  <span class=\"Apple-converted-space\"\
  >color: #F00;</span>\n}\n```\n\n这非常有用，特别是当你使用图标字体时。你可以在某些元素之前放置图标，并进行全局应用。\n\n##\
  \ 14 :after\n\n类似于 `:before` 选择器，你可以使用 `:after` 在特定元素上全局插入内容。一个实际的用法是在每篇博客之后添加“阅读更多”。具体方法如下：\n\
  \n```css\nafter {\n  content: \"- Read more...\"; color:#f00;\n}\n```\n\n## 15 content\n\
  \ncontent 是一个 CSS 属性，当你需要插入想要控制的内容时就会用到。我见过的最常见的用法是从特定位置插入图标。在示例中，你可以看到你必须包裹文本。\n\
  \n## 16 CSS 重置\n\n不同的浏览器有默认设置，因此必须重置这些设置以获得一致的内容字段。将其比比为盖房子，无论你是在山边、海滩上还是林地中间建造，你都需要一个地基。这种重置方法为你的所有网站设置了一个标准基础，给它们一个起点。它移除了不必要的边框、外边距（margins）、内边距（padding）、高度、列表上的样式等。\n\
  \n## 17 字母大字（Drop caps）\n\n我非常喜欢字母大字。它让我们联起传统的印刷书籍，是开始内容的极佳方式。第一个大字母真的非常吸引注意力。在\
  \ CSS 中创建字母大字有一种简单的方法，就是使用元素 `:first-letter`。这里有一个示例：\n\n```css\n:first-letter {\n\
  \  display:block; float:left;\n  margin:3px; color:#f00;\n  font-size:300%;\n}\n\
  ```\n\n此操作的作用是将字母大小设置为其他字母大小的 3 倍。它在字母周围留出 3px 的空间以防止重叠，并将字母颜色设置为红色。\n\n## 18 强制文本为全大写、全小写或首字母大写\n\
  \n将整个章节输入为全大写是荒谬的。想象一下，当网站格式改变或更新时，你必须回去修复它。相反，使用以下 CSS 样式可以强制文本采用特定格式。此 CSS 针对\
  \ h2 标题。\n\n```css\nh2 { text-transform: uppercase; } – 全大写\nh2 { text-transform:\
  \ lowercase; } – 全小写\nh2 { text-transform: capitalize; } – 每个单词的首字母大写。\n```\n\n\
  ## 19 垂直屏幕高度\n\n有时你希望让一个区域填充整个屏幕，无论屏幕大小如何。你可以通过 `vh`（视口高度）来控制它。前面的数字是一个百分比，所以如果你想让它填充浏览器的\
  \ 100%，则将其设置为 100。你可能会将其设置为 85% 之类的值，以适应固定的导航菜单。\n\n为容器创建一个类，并应用你想要的 vh 数量。你需要调整的一个点是针对特定方向（如竖屏）的值。想象一下将横屏拉伸以适应竖屏。那看起来可并不好。\n\
  \n```css\n.fullheight { height:85vh; }\n```\n\n## 20 设置链接样式\n\n如果你有一个链接在用户点击时会显示数字，你必须使用活动链接选择器对其设置样式。相反，请使用以下代码：\n\
  \n```css\na[href^=\"#\"] { <span class=\"Apple-converted-space\">color: #FFF;</span>\
  \ <span class=\"Apple-space\">text-decoration: none;</span> }\n```\n\n# JavaScript\
  \ 的不同方式\n\n**1 – 命名锚点**\n\n在某些浏览器中，悬停时光标不会改变。可以使用 CSS 来解决这个问题。\n\n**2 – 锚点哈 href**\n\
  \n悬停时显示链接 #Page，在 IE6、IE7 上会跳转到顶部\n\n**3 – 锚点伪类**\n\n在点击链接时调用函数的旧方法。出于可用性和可访问性考虑，不建议使用伪协议\
  \ `href`。现在考虑对 API 注入进行后端编程。这很杂乱、很长，人们会在状态栏中看到它，而且没有任何意义。Opera 不喜欢 `href=\"javascript:anything\"\
  `。\n\n**4 – 锚点伪 void**\n\n某些人认为使用 `javascript:anything` 是一种坏习惯。伪协议 `href` 会导致 IE\
  \ 进入等待状态以预期页面替换。`javascript:anything` 用于书签。\n\n**5 – 锚点返回 false**\n\n返回 false 会导致\
  \ `href=\"#\"` 不执行。比上述伪协议示例（如页面跳转）更安全的方法。返回可能不可靠。\n\n**6 – 锚点漂亮 URL/jQuery**\n\n\
  用户悬停链接时会看到 #some-real-url。如果禁用了 JavaScript，他们会看到某些信息……\n\n```javascript\n$(document).on('click',\
  \ 'a.mylink', function(e) {\n  // 防止页面跳转 href e.preventDefault();\n  // 执行函数 foo();\n\
  });\n```\n\n# 学习 CSS 语法和正确应用\n\n一旦对 CSS 及其功能有了良好的理解，下一步是理解 CSS 语法以及应用于文档的几种方式。\n\
  \n## CSS 语法由三个元素组成。\n\n选择器：选择器是你想要在 HTML 文档中的元素。例如，如果你在 HTML 中放置了段落标签，你的选择器将是 `p`\
  \ —— CSS 中的标准段落标签。如果你想设置整个网站的主体，将使用 `body` 作为选择器。\n\n属性：属性是可以应用于特定选择器的元素。让我们看看上面示例中的段落。你可以用于设置该选择器的某些属性包括\
  \ `font-family`、`font-size`、`color` 以及其他。\n\n\n\n\n值（Value）：值应用于特定属性的份额、尺寸、维度等。例如，如果你想让段落文字显示为\
  \ 20px，你就会对上述属性应用 20px 的值。\n\n选择器：`p {}`\n\n选择器 + 属性：`p {font-size:}`\n\n选择器 + 属性\
  \ + 值：`p {font-size: 20px;}`\n\n现在，让我们进入 CSS 的应用。有方法可以将样式应用到文档中。\n\n## 内联样式 (Inline\
  \ Styles)\n\n内联样式意味着你将特定元素的样式放置在标签内部。例如，如果你想让段落的文字颜色变为蓝色，可以在段落标签内应用 \"blue;\"。\n\
  \n这种方法可以，但不推荐。如果你有一个 100 页的网站，且每页都使用内联样式，当需要更改时，你必须独立更改这 100 页。\n\n## 内部样式 (Internal\
  \ Styles)\n\n内部样式意味着将样式包含在 HTML 文档本身。在 HTML 文档的开头有 `head` 标签。你的样式将放在这些标签之间以便引用。如果你有一个单页网站，可以使用这种方法。\n\
  \n## 外部样式 (External Styles)\n\n使用外部样式是使用 CSS 最有效的方法。你的样式存储在所有 HTML 文件都连接的外部文件中。这使得全局更改变得轻而易举。假设你想更改\
  \ 100 页网站上链接的颜色。你不需要独立更改每个页面，只需在外部文档中更改样式即可。所有页面都会被更改——因为它们都链接到同一个样式表。\n\n## 为什么\
  \ JavaScript 对大小写敏感如此重要？\n\n这是这种“物”的本性。首先，脚本是用纯文本编写的，但它不仅仅是 HTML（HTML 在很大程度上不区分大小写）那样的标记语言，它是代码，因此会受到浏览器内部机制（DOM\
  \ API）更严格的审视。\n\n```javascript\nvar names, Names;\n```\n\n这两个变量看起来非常相似，但对 JS 来说，它们是两个不同的世界。重要的是我们要意识到这一点，不是因为它的重要性，而是因为它的本质。它本身就是那个样子。\n\
  \n```javascript\nfunction Person(name, age){\n  this.name = name;\n  this.age =\
  \ age;\n}\n\nvar person = new Person(\"Zach\", 29);\n```\n\n我们可以忽略这段代码的组成，因为可能还没有涵盖对象。这里的重点是说明\
  \ `person` 和 `Person` 是两个完全不同的对象。`Person` 是一个对象构造函数，而 `person` 是该构造函数的一个实例。\n\n\
  ```javascript\nconsole.log(person); // {name: 'Zach', age: 29}\nconsole.log(Person);\
  \ // [function]\n```\n\n目前，我们必须检查你的注意力，或者面对可能产生的负面后果，如语法错误等。记住，JS 是区分大小写的。我们对此无能为力。\n\
  \n## 理解评论 (Understanding Comments)\n\n你可以添加并跟踪关于个人的评论。你可以查看关于某个特定个人的所有评论，或查看由某个特定人员发布的所有评论。个人评论是主观且通常是保密的，在输入和发表评论时要小心。在系统中设置或创建评论之前，你还应该熟悉管理功能。\n\
  \n在权限允许的情况下，你可以点击页面上的“评论”按钮，为个人或机构的记录附上或查看评论。你也可以通过本文档描述的菜单进行导航。\n\n## 句子中的冒号\n\n\
  目前有两种选择：逃跑或战斗。我们知道谁会赢得比赛：老鹰队。他想看意大利的三座城市：罗马、佛罗伦萨和威尼斯。记住：这种游戏两个玩家都可以玩。她不断重复道：“我真的想要那个！”巴里想知道我为什么没有回他的短信：我没有收到。这里有三个以\
  \ M 开头的州：密歇根州、密西西比州和缅因州。你现在可以接我：我感觉好多了。永远不要忘记这一点：三思而后行。这房子有我需要的一切：卧室、后院和车库。这个小镇让我想起童年的假期：两次都在海边。我有好几种喜喜欢的电影类型：剧情、科幻和悬疑。这是莎士比亚最先说的话：“要对自己诚实。”我在商店里买了很多肉：培根、火鸡肉、鸡肉和金枪鱼。世界是一个舞台：演好你的角色。新老板有很多种良好的特质：友好、外向且公平。这些是我最喜欢的颜色：紫色、青绿色、粉色和黄色。\n\
  \n## 句子中的分号\n\n爸爸要秃顶了；他的头发变得越来越稀少。我喜欢牛肉，加蘑菇；面条，加沙拉，加新鲜蔬菜。你应该少吃点；你将不得不如此。你需要新的休息时间；别人可能不能。《星光》是\
  \ 20 世纪 60 年代我最喜欢的节目；事实上，它是我最喜欢的。我抱了一个抱；然而，我又饿了。圣诞装饰终于问了：小的、明亮的；以及手工的。自学；儿子的话从攻击者那里离开了。我们有来自利马、圣地亚哥和拉斯加斯的学生。我们有两个傻瓜；输掉了比赛。我知道你不喜欢西兰花；它对你永远没有好处。米歇尔开着捷豹；索尼开着保时捷。我完成了主菜；现在我得做饭了。春天带来了细雨和更温暖的天气；此外雷雨和冰雹。她称之为浴室间；我称之为厕所。妈妈想完成家务；而且她希望完成得体面。我一工作完就过去；这是一个我一定会遵守的承诺。她没有看到那辆车开过来；现在她的车上有了一个巨大的凹痕。全球变暖的证据正在增加；当然，有些人永远不信这个。\n\
  \n# 信誉循环 (The Credibility Loop)\n\n时而如此\n\n在旧世界，我们去学校获取信息，我们信任法律和其他权威，并将广告视为娱乐。大多数\
  \ 30 岁以上的人还记得那个时期，每个人在电影开始前十分钟到达电影院只为了看广告。今天，我们几乎在任何地方都能获取信息。我们质疑权威，因为他们服务的是系统而不是人民，而广告已迅速成为最不可信的信息类型。广告是单向通信，而今天的消费者渴望并要求互动。\n\
  \n我们变得越来越具有批判性、见多识广，并希望自己搜索并发现信息。经常向朋友或小型社区/亚文化查询参考，这或少是一条规则；我们绝不相信页面上的内容。广告行业长期以来一直在生产低质但高价的内容，这在未来将是不可能的。我们都知道，今天的媒体热中很难让你的声音被听到，再增加一次广告活动并不是让你穿过噪音的最佳解决方案。\n\
  \n我们质疑的是广告本身的现象，以及所有（在其他意义上）将昔日的文化护在翼下的精明商人和女性。\n\n\n\n\n# 媒体预算的心理学\n\n哪些基本因素用于设定媒体预算？我们只能推测，但可以肯定的是，心理影响是巨大的。对安全的渴望和对失败的恐惧盖过了以往做法及其结果的质疑。\n\
  \n一个昂贵且失败的广告活动不能仅仅通过财务或理性来辩护。但出于情感和心理原因，这种情况经常发生。我们看到的是一种全球性的群体幻幻，一群成功的公司（广告代理商）正在销售一种被过度渲染的产品。这怎么会发生？广告已经变成了一种非常昂贵的保险费吗？\n\
  \n## 感知\n\n人们对现状的认知已经发生了。随着互联网以及某些地区的全球化（从积极角度来看），如今的人拥有质疑广告权力的独特机会。昨天，传播信息需要几天或几个月，而今天只需要一秒。如今，人们倾向于直接从网络搜索引擎、朋友、影响力群体或编辑媒体获取他们的价值观、影响和建议。例如：如果你要去纽约并想住一家非常特殊的酒店，你会查看酒店广告吗？不太可能。你更倾向于问一个朋友或阅读酒店评论。很少有人会相信酒店广告：它们是主观的，且传递的是酒店的信息。这种信息有多大的可信度？\n\
  \n## GNP\n\n某些公司的广告费用超过了某些国家的国内生产总值（GNP）。据低估计，2004 年全球广告支出至少为 1 万亿或一千亿（1,000,000,000,000）美元。仅在美国，支出就至少达到\
  \ 5000 亿（宝洁支出最高：290 亿）。\n\n将此与 2005 年全球军事开支的 1.1 万亿美元（1,118,000,000,000）相比，或者说，对于阿尔尔·里斯（Al\
  \ Ries，美国营销策略师）描述的“……广告肮脏的小秘密：它没有任何实际用处”来说，这合理吗？\n\n## 所以……\n\n我们希望从整体和人性的角度来挑战上述\
  \ GNP 事实；仅用其中的一小部分就能多少人、多少受威胁的人以及多少资金？解读这一点很重要，但在本期中，我们决定只探讨这种情况的一部分。我们有一个当今广告的替代方案，我们认为它更适合进行品牌营销。我们称之为“信誉环路”（The\
  \ Credibility Loop）。\n\n## 线索之前\n\n现在想要进入市场你就需要设计因素。所有的竞争对手都有良好的质量、良好的分销、良好的性能、良好的价格、良好的沟通等等……有一种说法，所有产品的功能、性能和价格都是相同的。将他们的产品与竞争对手区分开唯一因素就是设计。为什么不把大部分精力放在开发良好的设计上呢？\n\
  \n创意行业内部有很多关于线上营销（ATL）和线下营销（BTL）传播的讨论。红角坐着 ATL，涉及杂志、广播、电视和户外印刷等传统广告。在蓝角我们找到 BTL，它涉及公关（PR）、网络、直邮（DM）、零售沟通等。如果你问我们，ATL\
  \ 已经被击倒了。但我们更进一步，引入了我们自己的 BTL：线索之前（Before the Line）。我们的 BTL 像蝴蝶一样飞舞，像蜜蜂一样移动……更快的马。\n\
  \n直到今天，营销人员一直负责将新产品引入市场，这（仅仅是因为他们的工作是了解人们喜欢和想要。但他们真的知道人们需要什么吗？观察人们在做什么比听他们说什么更有趣。看看你的孩子；他们喜欢像你那样做，而不是像你告诉他们做的那样。亨利·福特（Henry\
  \ Ford）在直接询问人们的需求时，可能得到的答案是“更快的马”，而不是“带四个轮子的汽车”。\n\n我们认为营销人员往往具有同样的狭隘思维。他们中的许多人看不到现有类别之外的东西，通常只关注可用和可能的事物。因此，让设计文化通过组织成长，并将研发部门的创新人才与营销部门的人才相结合吧。只有将不同的技能和思想相结合，你才能创造出让你改变未来的可能的创新。因为你赢不了广告战——顺随大流吧！让产品自己说话吧。给它们一个理由、个性和灵魂！这可能是区分产品供应最好的方式。从财务角度看：有什么理由不让产品更高效呢？为什么不将资金和精力从产品生命期的末端（广告）转移到开头（研发）？这样做，公司可以更具创新性，并让他们有可能从一开始就将功能植入产品。通过赋予产品和服务更好的意义，目标群体自发寻找它们的机会要大得多。一个很好的例子：当\
  \ iPod 在 2001 年推出时，苹果花费了 2.45 亿美元发布该产品。这是一笔巨款，但如果使用一个吸引力较小的产品达到同样的全球成功，成本仅是它的十分之一。良好的设计和口碑完成了大部分工作。设计\
  \ = 经济，正如伟瑞典设计师拉格·埃塞尔（Lage Eksell）在 1964 年描述的那样。最后：这一切关于随处负责。\n\n我们确信，公司将通过良好的设计和创新策略建立一个更有信誉的品牌，而不是仅仅在最后用广告包装产品。广告资金应该更好地用于那些能产生影响并造福企业和社会的创新。谁不想通过开发更具吸引力和可持续性的产品或服务，来让人们的生活变得更好、更平等、更快乐呢？有人可能会认为一切都会被复制：产品或服务。如果它足够成功，它当然会。\n\
  \n\n\n\n\n设计策略应该触角渗透到公司战略的每一个，这就是为什么它是必要的并且是一个无比拟的竞争优势。它超越了身份识别和图形设计的问题；它关乎你公司发生的一切。你的客户服务如何响应？办公室里是否有鲜花和水果？接待室播放的是什么音乐？你的物流是否经过完全优化？你的产品服务排名如何？你又是如何展示它的？一切都关重要，没有什么是无关紧要，你必须拥有全局观并管理流程——设计流程。这是你最重要的流程，因为设计能帮助你在沟通中取得成功。通过良好的沟通，你将触达客户，并成为客户脑海中一个快乐且可能积极的一部分。\n\
  \n总结一下关于永恒的品牌讨论：品牌及其价值是设计过程的结果。\n\n# 我们的结语\n\n今天我们都知道，必须发展、创新并寻找新的生存方式——无论是业务、个人还是环境方面的考虑。在\
  \ David Report，我们承担起责任并关注一个业务困境——既然你可以通过创新的研发来更有强大的事情，实际上既能建立品牌又能售出更多产品/服务，为什么还要打广告呢？\n\
  \n正如你上面所读，我们主张从广告转向以设计为中心的研发。在我们看来，这是通往未来社会和商业生活的唯一途径。设计也是视觉化你的品牌和业务战略的最佳方式。聪明一点，质疑广告标准，并在我们的信誉循环中体验一下，或者换句话说：通过智能明的设计策略来建立你的品牌。\n\
  \n## C# .Net 中的数组\n\n### 什么是数组？\n\n简单来说，数组是一个有组织的集合。它可以是任何东西的集合。需要记住的重要点是它是一个集合。\n\
  \n我们每天都在使用数组\n\n一包 M&Ms 糖是数组的一个绝佳例子。我们很容易想象这袋受欢迎的糖。我们可以想象每一颗 M&Ms 从袋子里取出来时的样子。它们基本上都是一样的，但颜色不同。尽管颜色不同，但它们都是带有硬糖果外壳的巧克力糖果。一袋\
  \ M&Ms 是数据类型为 M&M's 的数组。它是糖果的集合。\n\n### 如何声明数组？\n\n声明数组与声明其他变量非常相似。唯一的区别在于你正在声明一个包含多个对象的变量。让我们比较一下这两个声明。\n\
  \n```\nString strEmotion = \"happy\";\nString[] strEmotions = {\"happy\",\"sad\"\
  ,\"elated\",\"afraid\",\"angry\",\"peaceful\"};\n```\n\n上述两个变量 `strEmotion` 和 `strEmotions`\
  \ 都是使用显式声明（Explicit Declaration）声明的，这意味着值在创建的同时被设置了。通过使用括号 `[]`，编译器知道变量 `strEmotions`\
  \ 将包含多个值。项目的的数量和值是通过 `=` 设置的。\n\n```\n{\"happy\",\"sad\",\"elated\",\"afraid\",\"\
  angry\",\"peaceful\"};\n```\n\n在这种情况下，我们将数组的大小设置为 6，因为我们添加了 6 个值。\n\n### 如何获取特定值？\n\
  \n一旦你理解了数组如何引用每个项，获取每个项目的值就并不难。起初可能会有点困惑，因为数组使用从 0 开始的引用。这意味着列表中的第一个项位于 0 位置。哈？好的，看接几行，你就会理解了。\n\
  \n```\nString [] strEmotions = {\"happy\",\"sad\",\"elated\",\"afraid\",\"angry\"\
  ,\"peaceful\"};\nstrEmotions[0] = happy (数组中第 0 位置的值)\nstrEmotions[1] = sad (数组中第\
  \ 1 位置的值)\nstrEmotions[2] = elated (数组中第 2 位置的值)\nstrEmotions[3] = afraid (数组中第\
  \ 3 位置的值)\nstrEmotions[4] = angry (数组中第 4 位置的值)\nstrEmotions[5] = peaceful (数组中第\
  \ 5 位置的值)\n```\n\n### 将其投入应用\n\n在这个示例中，我们有一个 `System.Drawing.Color` 数据数组，我们将用它来更改表单的背景颜色。这个非常简单的应用程序有助于理解如何引用数组中的每个不同项。它还展示了如何找到调用该函数的控件。让我们来看每一行……\n\
  \n首先声明了一个 `System.Drawing.Color` 数据数组，并同时添加了四种颜色：绿、红、黄和蓝。注意括号 `[]` 表示数组声明。因为我们在声明时填充了数组，所以我们说它是显式声明的。\n\
  \n```\nSystem.Drawing.Color[] myColor = {System.Drawing.Color.Green, System.Drawing.Color.Red,\
  \ System.Drawing.Color.Yellow, System.Drawing.Color.Blue};\n```\n\n现在我们添加一个方法并将其分配给所有单选按钮的点击事件。我们本可以为每个按钮写四个方法，但由于它们几乎完全相同，最好将它们添加到一个方法中，然后找到哪个单选按钮调用了它。这使得未来的维护也变得容易得多（一个方法胜于四个方法）。\n\
  \n```\nprivate void ChangeColors(object sender, EventArgs e)\n{\n    /* 获取调用该函数的单选按钮的引用。我们知道调用此方法的控件将是一个单选按钮，所以我们先创建一个\
  \ RadioButton 类型的变量，然后将其设置为 sender。但我们首先需要转换 sender 变量 */\n    System.Windows.Forms.RadioButton\
  \ rbtn = (System.Windows.Forms.RadioButton)sender;\n    // 现在通过名称找出是哪个单选按钮\n   \
  \ if (rbtn.Name == \"rbtnGreen\") this.BackColor = myColor[0];\n}\n```\n\n## JavaScript\
  \ 和 Ajax\n\n\n\n\n\n并不是所有浏览器都严格遵守任何特定标准，因此编写一个独立浏览器的 JavaScript 程序并不容易。\n\nJavaScript\
  \ 仅用于某些对数据安全不是主要考虑因素特定应用程序，而 Ajax 应用的范围是无限的。\n\n# CSS - 基础\n\n在思考 CSS 时，想要学习你需要了解的知识，或者在进入\
  \ CSS 领域之前需要学习什么？让我先说，CSS 可以缩短你坐在电脑前的时间。但你需要学习哪些知识呢？CSS 是否兼容搜索引擎和你的浏览器？这些都是我将尝试回答的问题，同时也会简单解释一下\
  \ CSS 的本质。\n\n## 什么是 CSS？\n\nCSS 代表层叠样式（Cascading Sheets）。CSS 是一组格式指令，用于控制单个或多个网页的外观。支持\
  \ CSS 的浏览器包括：（Firefox、IE3 或更高版本、NN4 或更高版本）。你可能会说，太好了，这绝对会为我节省一些时间。别太急，你还需要知道，尽管大多数浏览器理解\
  \ CSS，但它们并没有完全支持它的所有功能。\n\nXHTML - XHTML 是扩展超文本标记语言。XHTML 是具有严格规则的 HTML——它增加了一致性，并且\
  \ 100% 符合 XML 标准。因此，你应该熟悉 HTML、XHTML 以及 CSS 的样式属性，并变得更加习惯。\n\n## 你用 CSS 可以做什么\n\n\
  你可以构建布局，调整标题或正文文本的大小和颜色，还可以定位你的图片。这意味着页面只需要编写一次，而无需手动在每个网页中输入相同的代码。换句话说，就是消除了重复的格式化。\n\
  \n## 如何让搜索引擎看到你的内容\n\n有人说，搜索引擎在理解 CSS 方面仍然存在一些问题。但如果你想使用 CSS，有没有办法让搜索引擎看到你想展示的内容呢？\n\
  \n1. 保持你的文本整洁，如果你的网页中有太多垃圾内容，爬虫将很难判断哪些是相关的，哪些不是。因此，CSS 可以保持你的网页整洁，而无需为每个代码元素编写冗余代码。以下是一个使用\
  \ CSS 编写标题的示例。\n\n示例：`<h1>Title</h1>`（以 ) 开头和结尾）CSS 代码：`h1 {font-family: Arial;\
  \ size: 18px; bold;}`\n\n## CSS 语法\n\n首先，CSS 可以在任何编辑器中编写。但文本必须以 CSS 扩展名保存。\n\nCSS\
  \ 语法由选择器（selector）和声明（declaration）组成。选择器是网页正体内的标识符；声明是标识你想作为属性和规则的样式的代码。假设你想让你所有的\
  \ H1 标题都变成绿色，并使用某种字体。CSS 的代码如下：\n\n注意：不要在代码周围包含括号。\n\n`selector {property: rule}`\n\
  \n`H1 {color: green; font-family: Arial;}` 注意，属性和规则必须包含在 `{}` 中\n\n## CSS 的放置位置\n\
  \n有三个放置 CSS 代码的地方：\n\n在 `head` 标签中（内部）、在外部文件中，或者在单个标签内（内联）。\n\n内部 - 用于具有独特样式的单个网页内。\n\
  \n内联 - 将代码与内容混合。有时你可能需要使用它，但这种样式似乎甚至消除了了使用样式表的需求。\n\n外部 - CSS 与网页正体分离并与网页链接。因此，要将外部文件链接到网页中，你需要使用\
  \ `link` 标签。\n\n示例：\n\n`<link rel=\"stylesheet\" type=\"text/css\" href=\"NameOfCSS.css\"\
  >`（放在 `title` 标签之后的 `head` 部分）\n\n你会选择哪种方式？如果你有一个大型网站或一个将扩展的网站，外部文件将是快速方便地同时操作所有网页的更好方法。\n\
  \n## 注意防垃圾信息\n\n但对于互联网上的任何事物，都可以用于善意，也可以用于恶意。显然，如果你想让你的网站长期运行，就应该避免某些 CSS 技术。为什么？因为某些技术被认为对搜索引擎是有害的。这包括隐藏技术，如：1)\
  \ 从搜索中隐藏标题 2) 使用 JavaScript 隐藏内容。\n\nJavaScript 也用于让你的系统离线可用。如果你不熟悉 CSS，花时间看一些教程。它们信息丰富，并且可以开始学习\
  \ JavaScript。\n\n# 结论\n\nJavaScript 是一项非常值得投入的技术。它并不难学，而且非常通用。它允许你构建响应式界面，防止令人沮的页面加载，甚至为支持工作修复问题。使用正确的浏览器插件（如\
  \ Google Gears 或 Yahoo 浏览器），你甚至可以在电脑上线后让在线系统离线可用。JavaScript 并不局限于浏览器。与其他语言相比，JavaScript\
  \ 的速度和低内存占用使其在服务器端语言方面具有了更多用途。未来是广阔的。\n\n"
