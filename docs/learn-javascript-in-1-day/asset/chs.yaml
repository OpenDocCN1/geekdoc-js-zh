- "# 1天学会 Javascript\n\n\n\n![](img/Image00005.jpg)\n\n\nJavaScript 是一种解释型编程语言，基于\
  \ ECMAScript 标准构建。该语言的定义非常广泛，因为它可以被定义为基于原型的过程化语言、命令式语言、弱类型和动态语言。\n\nJavaScript 主要作为客户端编程语言使用，作为\
  \ Web 浏览器的一部分实现，允许开发者以更改进的方式在网页中实现用户界面和动态功能；尽管也有服务器端 JavaScript (SSJS) 的实现，但该语言的流行主要归功于客户端实现。JavaScript\
  \ 也可以用于 Web 之外，例如作为为 PDF 文档和桌面组件添加交互功能的方法。\n\nJavaScript 的设计语法与 C 语言相似，尽管它借鉴了 Java\
  \ 语言的命名方式和约定。然而，尽管名字相似，Java 和 JavaScript 之间并没有关系，且它们具有不同的语义和用途。\n\nJavaScript 最初由\
  \ Netscape 的 Brendan Eich 以 Mocha 的命名开发，后来更命名为 LiveScript，最后被称为 JavaScript。这个名字的出现恰好与\
  \ 1995 年底 Netscape 在其网页浏览器 Netscape Navigator 2.0B3 版本中增加对 Java 技术支持的时刻相合。JavaScript\
  \ 这个名字引起了误解，给人一种该语言是 Java 扩展的印象，许多人将其描述为 Netscape 的营销策略，旨在在当时新的 Web 编程语言中获得声誉并创新。\n\
  \n次年，微软在其 Internet Explorer 3.0 网页浏览器中实现了一种类似的客户端编程语言。微软将其客户端语言命名为“script”，以避免与品牌相关的问题。Script\
  \ 这个词看起来如此相似，以至于 \"javascript\" 和 \"script\" 经常互替使用，但 Jscript 的规范并不 100% 兼容 ECMA。\n\
  \n为了避免这些不兼容性，世界维网联盟（W3C）设计了标准的文档对象模型（DOM，或文档模型），该模型在 Internet Explorer 6 和 Navigator\
  \ 7 版本、Mozilla First 以及随后的现代浏览器中得以实现。1997 年，有一项建议将 JavaScript 提交给欧洲计算机厂商协会 ECMA（其名称虽然不是欧洲，但总部位于日内瓦）。1997\
  \ 年，它被采用为 ECMA 标准。由于 JavaScript 成为最常用的编程语言，它也成为了一项 ISO 标准。\n\n注意：JavaScript 是 Oracle\
  \ 公司的注册商标。它被用于由 Netscape Communications 及 Mozilla 基金等实体创建的产品下。\n\n# JavaScript 的用途\n\
  \nJavaScript 存在于今天大多数网页中。很有可能你现在查看的页面就包含了 JavaScript 代码。尝试一下这个活动：右键点击网页，然后点击“查看源代码”。你应该能够在网页代码某处找到\
  \ JavaScript 这个词。\n\n虽然 HTML 标记语言允许 Web 开发者格式化内容，但 JavaScript 允许他们让页面变得动态。例如，HTML\
  \ 允许将文本加粗、创建文本框和创建按钮，而 JavaScript 则允许更改页面上的文本、创建弹出消息并验证框中的文本，以确保必填字段已填写。JavaScript\
  \ 通过允许用户与网页交互、点击元素和更改页面，使网页变得更加动态。\n\n## JavaScript 能为你做什么\n\n让我们后退一步，数数 JavaScript\
  \ 的优点：\n\nJavaScript 非常容易实现。你只需要将代码放在 HTML 文档中并告诉浏览器它是 JavaScript 即可。\n\nJavaScript\
  \ 运行在 Web 用户的计算机上——即使在离线状态下也是如此！\n\nJavaScript 允许你创建高响应界面，改善用户体验并提供动态功能，而无需等待服务器响应并显示另一个页面。如果用户需要，JavaScript\
  \ 可以将内容加载到文档中，而无需重新加载整个页面——这通常被称为 Ajax。\n\nJavaScript 可以测试浏览器中哪些是可能的，并帮助修复浏览器中的错误或布局问题。对于一个直到最近还被称为“高级编程”的语言来说，这已经很厉害了。在当今的\
  \ Web 上，我们正在构建越来越多的应用程序，而高交互性需要 Flash（或其他插件）。JavaScript 可疑是最好的方式，因为它是一个 Web 标准，被浏览器原生支持（尽管某些有不同），并且兼容其他标准。\n\
  \n## DOM 脚本的引入\n\n当浏览器开始支持并实现文档对象模型（DOM）并允许我们与网页进行更丰富的交互时，JavaScript 开始变得有趣起来。\n\
  \nDOM 是文档的对象的表示。例如，之前的段落（使用查看源代码查看输出示例）在 DOM 中是一个 `tagName` 为 `p` 的元素节点。它包含三个子节点——一个包含“当浏览器开始支持并实现允许我们与网页进行更丰富的交互时，JavaScript\
  \ 开始变得有趣。”的文本节点；一个 `tagName` 为 `a` 的元素节点；以及另一个文本节点。`a` 子节点还有一个名为 `href` 的属性节点，带有一个值，以及一个\
  \ `nodeValue` 为“文档对象模型(DOM)”的文本节点子节点。\n\n你也可以使用树形图将其可视化，如图 2 所示。\n\n![](img/Image0001.jpg)\
  \ 图 2：示例 DOM 树的可视化表示。\n\n用人话说，你可以说 DOM 解释了文档中一切的类型、值和层次结构——你暂时不需要更多。\n\n## JavaScript\
  \ 的常见用途\n\nJavaScript 的用途随时间发生了变化。最初，JavaScript 与网站的交互主要限于表单向用户提供反馈。我们使用 `alert()`\
  \ 通知用户（见图 1），使用 `confirm()` 询问是否以及使用 `prompt()` 或表单字段获取输入。\n\n![](img/Image0000.jpg)\
  \ 图 1：使用 `alert()` 语句告知错误是我们在 JavaScript 早期能做的一切。既不美也不微妙。\n\n\n\n\n\n访问文档中的任何元素并操作其外观、内容和属性。\n\
  \n在需要时创建新的元素和内容并将其应用到文档中。\n\n这意味着我们不再需要依赖窗口（windows）、框架（frames）、表单（forms）和丑陋的提示框（alerts），如图所示以精美的样式在文档中向用户提供反馈。\n\
  \n![](img/Image00002.jpg)\n\n图 3：使用 DOM 可以创建更漂亮且侵入性更小的错误消息。\n\n结合事件处理，这是一个创建交互且美观界面的强大工具。事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——例如页面加载完成——但大多数时候，我们对用户对浏览器的操作做出反应。用户可能会调整窗口大小、滚动页面、按下某些键或使用鼠标点击链接、按钮和元素。通过事件处理，我们可以等待这些事情发生，并让网页按照我们的意愿对这些做出响应。过去，点击任何链接都会引导访问者进入另一个文档，现在我们可以劫持此功能并执行其他操作，例如显示和隐藏面板，或者获取链接中的信息并用其连接到网络服务。\n\
  \n## JavaScript 的其他现代用途\n\n这基本上就是我们现今使用 JavaScript 所做的。我们增强了旧的、成熟的 Web 界面——点击链接、输入信息和提交表单等——使其对终端用户的响应更加迅速。例如：\n\
  \n* 注册表单可以在你输入用户名时检查该用户名是否可用，防止你不得不忍受令人沮丧的页面刷新。\n* 搜索框可以在你输入时根据你目前输入的内容提供建议结果（例如，输入“bi”可能会出现包含此字符串的建议供你选择，如“bird”、“big”和“bicycle”）。这种使用模式被称为自动补全。\n\
  *   不断变化的信息可以定期加载，无需用户交互，例如体育比赛结果或股市行情。\n*   锦上添花且对某些用户来说可能冗余的信息，可以在用户选择访问时再加载。例如，网站的导航菜单可以是\
  \ 6 个链接，并在用户激活菜单项时按需显示指向深层页面的链接。\n\nJavaScript 可以修复布局问题。使用 JavaScript，你可以找到页面上任何元素的位置和区域以及浏览器窗口的尺寸。利用这些信息，你可以防止元素重叠等问题。例如，如果你有一个多级菜单；在显示子菜单之前检查是否存在子菜单，可以防止滚动条出现或项目重叠。JavaScript\
  \ 可以增强 HTML 提供的界面。虽然有一个文本输入框很好，但你可能想要一个来自值列表的组合框。使用 JavaScript 你可以增强普通的输入。你可以使用\
  \ JavaScript 对页面元素执行动画——例如显示和隐藏信息，或高亮页面部分——这可以使体验更加可用。\n\n## 明智且负责任地使用 JavaScript\n\
  \n当你将 JavaScript 与 Canvas 等技术混合时，几乎没有什么是你做不到的。然而，能力越大责任越大，在使用 JavaScript 时始终记住以下几点：JavaScript\
  \ 可能不可——这一点很容易测试。但是，依赖 JavaScript 的东西应该基于这种心态创建，并且要确保当 JavaScript 不可用时，你的网站不会崩溃（核心功能无法使用）。\n\
  \n如果使用 JavaScript 并不能帮助用户快速高效地实现目标，那么你可能使用方法错误。JavaScript 经常会打破人们多年使用 Web 遵循的惯例（例如点击链接进入其他页面，或代表“购物车”的小篮子）。虽然这些使用模式可能过时且效率低下，但改变它们仍然意味着用户要改变习惯——这会让人们感到不安。我们喜欢控制感，一旦我们理解了某事，就很难应对变化。你的\
  \ JavaScript 解决方案应该感觉比之前的交互自然地更好，但不至于不同到让用户无法通过之前的经验与之产生共鸣。如果你成功让网站访问者说“啊哈——这意味着我不需要等待了”或“酷酷——现在我不用多此此步了”——你就找到了\
  \ JavaScript 的绝佳用途。\n\nJavaScript 永远不应作为安全措施。如果你需要防止用户访问数据或处理敏感数据，不要依赖 JavaScript。任何保护都可以被绕过，因为所有代码都是可读的。此外，用户可以直接在浏览器中关闭\
  \ JavaScript。\n\n# 开始学习 JavaScript\n\n 入门：设置你的代码\n\n你的 JavaScript 代码放在哪里？基本上，它在你页面的\
  \ `<html>` 标签内部。你的代码以 `<script type=\"text/javascript\"` 开始，并以 `</script>` 结束。\n\
  \n```html\n<html>\n<head>\n<title>这是一个示例页面</title>\n</head>\n<body>\nWelcome to\
  \ JavaScript!\n<script type=\"text/javascript\">\ndocument.write(\"Hi there. This\
  \ text is written using JavaScript!\");\n</script>\n</body>\n</html>\n```\n\n输出：Hi\
  \ there. This text is written using JavaScript!\n\n如你所见，我们的脚本以 `<script lang=\"\
  javascript\">` 标签开始。红色部分是可选的，因为浏览器假设这是一个 `<script>` 标签，但出于验证考虑，你应该包含它。上面的第二行和倒数第二行是\
  \ `<!--` 和 `-->`，它们是为 JavaScript 标记的注释标签。建议包含它们，以在不支持的旧浏览器中隐藏你的代码。如果你不包含它们且有人正在使用此类浏览器，浏览器会将你所有的代码作为文本“倒”在屏幕上，换句话说，那可不好看！此脚本的唯一“功能部分”是\
  \ `document.write(\".......\")` 部分。它基本上是将你放在引号内的任何内容写入页面。先不要太担心为什么，我们稍后会详细讨论。我们用\
  \ `</script>` 结束整个代码。这会终止你的脚本并回到 html。\n\n像 html 一样，你可以在 JavaScript 代码中插入注释。JavaScript\
  \ 注释与 HTML 注释不同，后者是注释掉脚本中的行使其不被解析。JavaScript 注释的语法为：\n\n```javascript\n//这里是注释\n\
  ```\n用于单行注释，或者\n\n```javascript\n/*\n这里是注释 */\n```\n用于多行注释。\n\n例如：\n\n```javascript\n\
  <script lang=\"javascript\">\n//这个脚本什么都不做，没用处！/*\n嘿，别把我扯进这事里！\n*/\n//-->\n</script>\n\
  ```\n\n好了，我们现在准备好开始真正的编程了！\n\nJavaScript 与许多编程语言一样，依赖对象、函数和事件处理器来创建可运行的程序。如果你对这些技术术语以及如何使用它们一无知，不要担心。等我们完成这个教程时，你就会了。\n\
  \n# JavaScript 和 HTML\n\n你可以把 JavaScript 视为 HTML 的扩展；如果愿意的话，一个插件。\n\n\n\n\n这是它的工作原理。HTML\
  \ 标签创建对象；JavaScript 让你可以操作这些对象。例如，你使用 `<BODY>` 和 `</BODY>` 标签来创建一个网页（或文档）。如表 1 所示，创建该文档后，你可以使用\
  \ JavaScript 与其交互。例如，你可以使用一个特殊的 JavaScript 结构——`onload` 事件处理器在文档加载到网络浏览器时触发某个操作——也许播放一段简短的欢迎曲。其他你使用\
  \ JavaScript 交互的 HTML 对象包括窗口、文本字段、图像和嵌入的 Java 应用。\n\n## 表 1：创建和使用对象\n\n![](img/Image00003.jpg)\n\
  \n要在网页中添加 JavaScript，你所做的是将 JavaScript 代码嵌入到 HTML 文件中。在下方嵌入 JavaScript 代码处，你可以根据响应事件处理程序或\
  \ HTML 链接来引用或调用该 JavaScript 代码。\n\n在 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：\n\n1.  你可以使用\
  \ `<SCRIPT>` 和 `</SCRIPT>` 标签将 JavaScript 代码直接包含在 HTML 文件中。\n2.  在下面的示例中，一个名为 `processOrder()`\
  \ 的 JavaScript 函数定义在 HTML 文件的顶部。在 HTML 文件的后续，该 JavaScript 函数与一个事件处理器关联——具体说是 `processOrder`\
  \ 按钮的 `onclick` 事件处理器。（换句话说，当用户点击 `processOrder` 按钮时，`processOrder()` 函数中的 JavaScript\
  \ 代码就会运行。）\n\n```html\n<HTML>\n<HEAD>\n<SCRIPT LANGUAGE=\"JavaScript\"> // 这里放置\
  \ JavaScript 语句\n\nfunction processOrder() {\n// 这里可以有更多的 JavaScript 语句 }\n</SCRIPT>\n\
  </HEAD>\n<BODY>\n<FORM NAME=\"myForm\">\n<INPUT TYPE=\"button\" NAME=\"processOrder\"\
  \ VALUE=\"Click to process your order\" onclick=\"processOrder();\">\n…\n</BODY>\n\
  </HTML>\n```\n\n你可以使用 `<SCRIPT>` 和 `</SCRIPT>` 标签将一个独立的外部 JavaScript 文件（仅包含 JavaScript\
  \ 语句并带有 `.js` 扩展的文件）引入 HTML 文件中。\n\n在下面的示例中，JavaScript 函数 `processOrder()` 定义在 `myJS.js`\
  \ 中。当用户点击“Click here Process Order”链接时，该函数会被触发或调用。\n\n```html\n<HTML>\n<HEAD>\n\
  <SCRIPT LANGUAGE=\"JavaScript\" SRC=\"myJS.js\"></SCRIPT>\n</HEAD>\n<BODY>\n<A HREF=\"\
  javascript:processOrder()\">Click here to Process Order</A>\n</BODY>\n</HTML>\n\
  ```\n\n网页不仅仅由 HTML 组成，JavaScript 提供的不仅是 HTML 对象。JavaScript 为浏览器插件（如 Reader 和 Acrobat）、你的器的名称和版本号提供对象，以及你可以使用\
  \ JavaScript 处理的当前对象。组成网站的所有对象——HTML 对象、浏览器插件以及 JavaScript 语言内置的特殊对象——统称为文档对象模型（DOM）。\n\
  \n## HTML 基础\n\n如果你对 HTML 一无所知，你绝对应该从基础开始；可能先在网上做些研究。一旦你掌握了基础，其余部分应该会非常简单。然而，像每个学科一样，HTML\
  \ 基础必须细心学习。你不能跳过任何一个步骤。建议一次学习 HTML 的一个方面，只有在理解了较简单的内容后，再进入高级阶段。最后给一点建议——不要感到气馁，因为\
  \ HTML 基础看起来可能需要很长时间才能学会；但这一切最终都是值得的。\n\n首先，你必须知道 HTML 是什么以及为什么要使用它。HTML 是 HyperText\
  \ Markup Language（超文本标记语言）的缩写，它是一种脚本语言。简单来说，HTML 是一个仅由标记语言（文本）构成的纯文本文件。当浏览器被指示打开一个网页时，它会查找页面中的\
  \ HTML 代码。然后浏览器将将这些代码转换为布局、图像和指向其他站点的链接。你必须记住的其他基础知识之一是 HTML 是文本文件，因此可以使用最简单的文本编辑器进行编写。一些流行的文本编辑器，如记事本（Notepad）和\
  \ Dreamweaver，可以让你使用 Word 来创建页面。现在，这如何能让事情变得更简单，让你发现更多你感兴趣的 HTML 呢？一旦你通过文本编辑器获取页面布局，你就可以自己完成\
  \ HTML 部分。此外，如果你仍然认为自己编写 HTML 很酷，例如，如果你觉得有互动，甚至可以从别人那里借用代码。你只需要编写代码并输出 HTML。\n\n\
  关于 HTML 基础，你了解的另一个重要点是标签。标签告诉浏览器如何解码文本。然后你必须关注你自己的结构。页面结构由头部（head）、不可见的文本和标签以及可见的身体（body）组成。你必须学习每个部分以及高级结构。一旦你掌握了窍门，这应该很有趣，你会喜欢结果的。\n\
  \n## 你知道 HTML 是什么吗？\n\nHTML 代表 HyperText Language（超文本语言）。它本质上是人们在世界网上作为核心标记语言进行相互通信和认可的方式。超文本语言的最新版本\
  \ HTML5 最近发布，并带有新的功能和元素。它非常易用；它就是这样设计的。你不需要成为程序员就可以使用它。它是一种为了创建网站而设计的计算机语言。这些网站随后可以被任何连接到互联网的人查看。\n\
