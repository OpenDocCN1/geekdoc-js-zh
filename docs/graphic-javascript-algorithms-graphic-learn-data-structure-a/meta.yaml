    \n![](img/f048677f9e730c94d3013e7a7cb78278_257_0.png)\n\n## Dijkstra\n\nThe tricolor\
    \ flag was originally raised by E.W. Dijkstra, who used the Dutch national flag\
    \ (Dijkstra is Dutch).\n\nSuppose there is a rope with red, white, and blue flags.\
    \ At first all the flags on the rope are not in order. You need to arrange them\
    \ in the order of blue -> white -> red. How to move them with the least times.\
    \ you just only do this on the rope, and only swap two flags at a time.\n\n![](img/f048677f9e730c94d3013e7a7cb78278_258_0.png)\n\
    \nR B W B R W -> B W W B R R\n\n**Solution:**\n\nUse the char arrays to store\
    \ the flags. For example, b, w, and r indicate the position of blue, white and\
    \ red flags. The beginning of b and w is 0 of the array, and r is at the end of\
    \ the array.\n\n- (1) If the position of w is a blue flag, flags[w] exchange with\
    \ flags[b]. And whiteIndex and b is moved backward by 1.\n\n- (2) If the position\
    \ of w is a white flag, w moves backward by 1.\n\n- (3) If the position of w is\
    \ a red flag, flags[w] exchange with flags[r]. r moves forward by 1.\n\nIn the\
    \ end, the flags in front of b are all blue, and the flags behind r are all red.\n\
    \n## Graphic Solution\n\n![](img/f048677f9e730c94d3013e7a7cb78278_259_0.png)\n\
    \nb w\n\nR B W B R W\n\nflags[w]==R, swap with flags[r], r--\n\nb w\n\nW B W B\
    \ R R\n\nflags[w]==W, no swap, w++\n\nb w\n\nW B W B R R\n\nflags[w]==B, swap\
    \ with flags[b], b++, w++\n\n![](img/f048677f9e730c94d3013e7a7cb78278_260_0.png)\n\
    \nflags[w]==W, no swap, w++\n\nflags[w]==B, swap with flags[b], b++, w++\n\n1.\
    \ Create a **Dijkstra.html** with **Notepad** and open it in your browser.\n\n\
    ```\n<script type =\"text/javascript\" >\n  function dijkstra( flags) {\n    var\
    \ b = 0 , w = 0 , r = flags.length - 1 ;\n    var count = 0 ;\n    while ( w <=\
    \ r) {\n      if ( flags[ w] == 'W' ) {\n        w++;\n      } else if ( flags[\
    \ w] == 'B' ) {\n        var temp = flags[ w];\n        flags[ w] = flags[ b];\n\
    \        flags[ b] = temp;\n        w++;\n        b++;\n        count++;\n   \
    \   } else if ( flags[ w] == 'R' ) {\n        var m = flags[ w];\n        flags[\
    \ w] = flags[ r];\n        flags[ r] = m;\n        r--;\n        count++;\n  \
    \    }\n    }\n  }\n\n  ///////////////////testing//////////////////\n  var flags\
    \ = [ 'R' , 'B' , 'W' , 'B' , 'R' , 'W' ];\n  dijkstra( flags);\n  for ( var i\
