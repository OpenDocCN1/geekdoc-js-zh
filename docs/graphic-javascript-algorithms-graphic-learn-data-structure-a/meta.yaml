  - "[PAGE 32]\n\n1. Create a **TestReverse.html** with **Notepad** and open it in\
    \ your browser.\n\n```\n<script type =\"text/javascript\" >\n  function reverse(arrays)\
    \ {\n    var length = arrays.length;\n    var middle = length / 2 ;\n    for (\
    \ var i = 0 ; i <= middle; i++) {\n      var temp = arrays[ i];\n      arrays[\
    \ i] = arrays[ length - i - 1 ];\n      arrays[ length - i - 1 ] = temp;\n   \
    \ }\n  }\n\n//////////////////testing//////////////////\n\n  var scores = [ 50\
    \ , 60 , 70 , 80 , 90 ];\n  reverse( scores);\n  for ( var i = 0 ; i < scores.length;\
