  md: "# Create a TestQuickSort.html with Notepad\n\n```\n<script type =\"text/javascript\"\
    \ >\n  class QuickSort{\n    sort( array) {\n      if ( array.length > 0 ) {\n\
    \        this.quickSort( array, 0 , array.length - 1 );\n      }\n    }\n\n  \
    \  quickSort( array, low, high) {\n      if ( low > high) {\n        return ;\n\
    \      }\n      var i = low;\n      var j = high;\n      var threshold = array[\
    \ low];\n      // Alternately scanned from both ends of the list\n      while\
    \ ( i < j) {\n        // Find the first position less than threshold from right\
    \ to left\n        while ( i < j && array[ j] > threshold) {\n          j--;\n\
    \        }\n        //Replace the low with a smaller number than the threshold\n\
    \        if ( i < j)\n          array[ i++] = array[ j];\n\n        // Find the\
    \ first position greater than threshold from left to right\n        while ( i\
    \ < j && array[ i] <= threshold) {\n          i++;\n        }\n\n        //Replace\
    \ the high with a number larger than the threshold\n        if ( i < j)\n    \
    \      array[ j--] = array[ i];\n      }\n      array[ i] = threshold;\n```"
