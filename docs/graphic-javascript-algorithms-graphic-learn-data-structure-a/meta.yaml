    # Mouse Walking Maze


    Mouse Walking Maze is a basic type of recursive solution. We use **2** to represent
    the *wall* in a *two-dimensional array*, and use **1** to represent the *path*
    of the mouse, and try to find the path from the entrance to the exit.


    **Solution:**

    The mouse moves in four directions: *up, left, down, and right*. If hit the *wall*
    go back and select the next forward direction, so test the four directions in
    the array until mouse reach the exit.


