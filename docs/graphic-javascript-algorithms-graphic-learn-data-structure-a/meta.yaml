  md: "# Create a TestBinaryHeapSorting.html with Notepad\n\n```\n<script type =\"\
    text/javascript\" >\n  class HeapSort {\n    constructor(){\n      this.array\
    \ = [];\n    }\n\n    //Initialize the heap\n    createHeap( array) {\n      this.array\
    \ = array;\n\n      // Build a heap, (array.length - 1) / 2 scan half of the nodes\
    \ with child nodes\n      for ( var i = ( array.length - 1 ) / 2 ; i >= 0 ; i--)\
    \ {\n        this.adjustHeap( i, array.length - 1 );\n      }\n    }\n\n    //Adjustment\
    \ heap\n    adjustHeap( currentIndex, maxLength) {\n      var noLeafValue = this.array[\
    \ currentIndex]; // Current non-leaf node\n\n      //2 * currentIndex + 1  Current\
    \ left subtree subscript\n      for ( var j = 2 * currentIndex + 1 ; j <= maxLength;\
    \ j = currentIndex * + 1 ) {\n        if ( j < maxLength && this.array[ j] < this.array[\
    \ j + 1 ]) {\n          j++; // j Large subscript\n        }\n\n        if ( noLeafValue\
    \ >= this.array[ j]) {\n          break ;\n        }\n\n        this.array[ currentIndex]\
    \ = this.array[ j]; // Move up to the parent node\n        currentIndex = j;\n\
    \      }\n    }\n  }\n```"
