  - "[PAGE 42]\n\n1. Create a **TestShellSort.html** with **Notepad** and open it\
    \ in your browser.\n\n```\n<script type =\"text/javascript\" >\n    function shellSort(\
    \ array) {\n        var middle = parseInt( array.length / 2 );\n        for (\
    \ var gap = middle ; gap > 0 ; gap = parseInt( gap / 2 )) {\n            for (\
    \ var i = gap; i < array.length; i++) {\n                var j = i;\n        \
    \        while ( j - gap >= 0 && array[ j] < array[ j - gap]) {\n            \
    \        swap( array, j, j - gap);\n                    j = j - gap;\n       \
    \         }\n            }\n        }\n    }\n\n    function swap( array, a, b)\
    \ {\n        array[ a] = array[ a] + array[ b];\n        array[ b] = array[ a]\
    \ - array[ b];\n        array[ a] = array[ a] - array[ b];\n    }\n\n    ///////////////////testing//////////////////////\n\
    \n    var scores = [ 9 , 6 , 5 , 8 , 0 , 7 , 4 , 3 , 1 , 2 ];\n    shellSort(\
    \ scores);\n    for ( var i = 0 ; i < scores.length; i++) {\n        document.write(\
    \ scores[ i] + \",\" );\n    }\n\n</script>\n```\n\nResult:"
