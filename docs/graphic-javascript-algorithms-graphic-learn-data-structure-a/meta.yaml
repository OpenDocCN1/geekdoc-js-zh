    \n![](img/f048677f9e730c94d3013e7a7cb78278_192_0.png)\n\n## Hash Table\n\nHash\
    \ Table:\nAccess by mapping key => values in the table.\n\n- 1. Map {19, 18, 35,\
    \ 40, 41, 42} to the HashTable mapping rule **key % 4**\n\n19 % 4 = 3\n\n18 %\
    \ 4 = 2\n\n35 % 4 = 3\n\n![](img/f048677f9e730c94d3013e7a7cb78278_194_0.png)\n\
    \n## 2. Implement a Hashtable\n\n![](img/f048677f9e730c94d3013e7a7cb78278_195_0.png)\n\
    \n## Create a TestHashtable.html with Notepad\n\n```javascript\n<script type=\"\
    text/javascript\">\nclass Node {\n  constructor(key, value, hash, next) {\n  \
    \  this.key = key;\n    this.value = value;\n    this.hash = hash;\n    this.next\
    \ = next;\n  }\n\n  getKey() {\n    return this.key;\n  }\n  setKey(key) {\n \
    \   this.key = key;\n  }\n\n  getValue() {\n    return this.value;\n  }\n  setValue(value)\
    \ {\n    this.value = value;\n  }\n\n  getHash() {\n    return this.hash;\n  }\n\
    \  setHash(hash) {\n    this.hash = hash;\n  }\n}\n\nclass Hashtable {\n  constructor()\
    \ {\n    this.capacity = 16;\n    this.table = new Array(this.capacity);\n   \
    \ this.size = 0;\n  }\n\n  size() {\n    return this.size;\n  }\n\n  isEmpty()\
    \ {\n    return this.size == 0 ? true : false;\n  }\n\n  hash(key) {\n    var\
    \ hash = 0;\n    for (var i = 0; i < key.length; i++) {\n      hash += key.charCodeAt(i);\n\
    \    }\n    return hash % 37;\n  }\n\n  // Calculate the hash value according\
    \ to the key hash algorithm\n  hashCode(key) {\n    var avg = this.hash(key) *\
    \ (Math.pow(5, 0.5) - 1) / 2; // hash policy middle-square method\n    var numeric\
    \ = avg - Math.floor(avg);\n    return parseInt(Math.floor(numeric * this.table.length));\n\
    \  }\n\n  put(key, value) {\n    if (key == null) {\n      throw new IllegalArgumentException();\n\
    \    }\n\n    var hash = this.hashCode(key);\n    var newNode = new Node(key,\
