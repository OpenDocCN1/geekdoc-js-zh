    \n## Binary Heap Sorting\n\n**Binary Heap Sorting:**\nThe value of the non-terminal\
    \ node in the binary tree is not greater than the value of its left and right\
    \ child nodes.\n\nSmall top heap: ki <= k2i and ki <= k2i+1\nBig top heap: ki\
    \ >= k2i and ki >= k2i+1\n\nParent node subscript = (i-1)/2\nLeft subnode subscript\
    \ = 2*i+1\nRight subnode subscript = 2*i+2\n\n**Heap sorting process:**\n\n1.\
    \ Build a heap\n2. After outputting the top element of the heap, adjust from top\
    \ to bottom, compare the top element with the root node of its left and right\
    \ subtrees, and swap the smallest element to the top of the heap; then adjust\
    \ continuously until the leaf nodes to get new heap.\n\n1. {10, 90, 20, 80, 30,\
    \ 70, 40, 60, 50} build heap and then heap sort output.\n\n**Initialize the heap\
    \ and build the heap**\n\n![](img/f048677f9e730c94d3013e7a7cb78278_171_0.png)\n\
