    # Reverse Array


    **Inversion of ordered sequences:**


    ![](img/f048677f9e730c94d3013e7a7cb78278_30_0.png)


    **1. Algorithmic ideas**

    Initial `i = 0` and then swap the first element `arrays[i]` with last element
    `arrays[length - i - 1]`

    Repeat until index of middle `i == length / 2` .'
