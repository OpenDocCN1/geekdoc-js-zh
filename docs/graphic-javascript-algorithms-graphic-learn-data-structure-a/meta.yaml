    \ traversal is the right child until it is empty, the current node is the largest\
    \ node.\n\n![](img/f048677f9e730c94d3013e7a7cb78278_156_0.png)\n\n![](img/f048677f9e730c94d3013e7a7cb78278_157_0.png)\n\
