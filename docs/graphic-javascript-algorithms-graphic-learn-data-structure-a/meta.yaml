    | B | 1 | 0 | 1 | 1 | 0 |

    | C | 1 | 1 | 0 | 1 | 0 |

    | D | 1 | 1 | 1 | 0 | 1 |

    | E | 0 | 0 | 0 | 1 | 0 |'
