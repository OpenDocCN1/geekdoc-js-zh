  md: '# Binary Search Tree


    **Binary Search Tree:**


    +   1. If the left subtree of any node is not empty, the value of all nodes on
    the left subtree is less than the value of its root node;

    2. If the right subtree of any node is not empty, the value of all nodes on the
    right subtree is greater than the value of its root node;

    3. The left subtree and the right subtree of any node are also binary search trees.


