- md: " # Graphic JavaScript Algorithms\n\nAlgorithms JavaScript Practice Implementation\n\
    \n---\n\nYANG HU\n\nThe complexity of life, because they do not understand to\
    \ simplify the complex, simple is the beginning of wisdom. the essence of practice,\
    \ to briefly explain the concept, and vividly cultivate programming interest,\
    \ this book deeply analyzes Data Structures Algorithms ES6+ Javascript and fun\
    \ of programming.\n\n[http://en.verejava.com](http://en.verejava.com)\n\nCopyright\
    \ © 2020 Yang Hu\nAll rights reserved.\nISBN : 9798629790525\n\n# CONTENTS\n\n\
    - 1. [Maximum Value](https://example.com)\n- 2. [Bubble Sorting Algorithm](https://example.com)\n\
    - 3. [Minimum Value](https://example.com)\n- 4. [Select Sorting Algorithm](https://example.com)\n\
    - 5. [Insert Sorting Algorithm](https://example.com)\n- 6. [Reverse Array](#)\n\
    - 7. [Dichotomy Binary Search](#)\n- 8. [Shell Sorting](#)\n- 9. [Unidirectional\
    \ Linked List](#)\n  - 9.1 [Create and Initialization](#)\n  - 9.2 [Add Node](#)\n\
    \  - 9.3 [Insert Node](#)\n  - 9.4 [Delete Node](#)\n- 10. [Doubly Linked List](#)\n\
    \  - 10.1 [Create and Initialization](#)\n  - 10.2 [Add Node](#)\n  - 10.3 [Insert\
    \ Node](#)\n  - 10.4 [Delete Node](#)\n- 11. [One-way Circular LinkedList](#)\n\
    \  - 11.1 [Initialization and Traversal](#)\n  - 11.2 [Insert Node](#)\n  - 11.3\
    \ [Delete Node](#)\n- 12. [Two-way Circular LinkedList](#)\n  - 12.1 [Initialization\
    \ and Traversal](#)\n  - 12.2 [Insert Node](#)\n  - 12.3 [Delete Node](#)\n- 13.\
    \ [Queue](#)\n- 14. [Stack](#)\n- 15. [Recursive Algorithm](#)\n- 16. [Two-way\
    \ Merge Algorithm](#)\n- 17. [Quick Sort Algorithm](#)\n- 18. [Binary Search Tree](#)\n\
    \  - 18.1 [Construct a binary search tree](#)\n  - 18.2 [Binary search tree In-order\
    \ traversal](#)\n  - 18.3 [Binary search tree Pre-order traversal](#)\n  - 18.4\
    \ [Binary search tree Post-order traversal](#)\n  - 18.5 [Binary search tree Maximum\
    \ and minimum](#)\n  - 18.6 [Binary search tree Delete Node](#)\n- 19. [Binary\
    \ Heap Sorting](#)\n- 20. [Hash Table](#)\n- 21. [Graph](#)\n  - 21.1 [Undirected\
    \ Graph and Depth-First Search](#)\n  - 21.2 [Undirected Graph and Breadth-First\
    \ Search](#)\n  - 21.3 [Directed Graph and Depth-First Search](#)\n  - 21.4 [Directed\
    \ Graph and Breadth-First Search](#)\n  - 21.5 [Directed Graph Topological Sorting](#)\n\
    - 22. [Towers of Hanoi](#)\n- 23. [Fibonacci](#)\n- 24. [Dijkstra](#)\n- 25. [Mouse\
    \ Walking Maze](#)\n- 26. [Eight Coins](#)\n- 27. [Josephus Problem](#)\n\n# Maximum\
    \ Value\n\n**Computing the Maximum of Integer Sequences:**\n\n## 1. Algorithmic\
    \ ideas\n\nCompare `arrays[i]` with `arrays[i + 1]`, if `arrays[i] > arrays[i\
    \ + 1]` are exchanged. So continue until the last number, `arrays[length - 1]`\
    \ is the maximum.\n\n## 1. Create a **TestMaxValue.html** with **Notepad** and\
    \ open it in your browser\n\n```\n<script type =\"text/javascript\" >\n  function\
    \ max( arrays) {\n    // Maximum initialization value is 0\n    for ( var i =\
    \ 0 ; i < arrays.length - 1 ; i++) {\n      if ( arrays[ i ] > arrays[ i + 1 ])\
    \ { // swap\n        var temp = arrays[ i ];\n        arrays[ i ] = arrays[ i\
    \ + 1 ];\n        arrays[ i + 1 ] = temp;\n      }\n    }\n    var maxValue =\
    \ arrays[ arrays.length - 1 ];\n    return maxValue;\n  }\n\n  /////////////////////testing/////////////////////\n\
    \n  var scores = [ 60 , 50 , 95 , 80 , 70 ];\n  var maxValue = max( scores);\n\
    \  document.write( \"maxValue = \" + maxValue);\n\n</script>\n```\n\nResult:\n\
    \n# Bubble Sorting Algorithm\n\n**Bubble Sorting Algorithm:**\nCompare `arrays[j]`\
    \ with `arrays[j + 1]`, if `arrays[j] > arrays[j + 1]` are exchanged.\nRemaining\
    \ elements repeat this process, until sorting is completed.\n\n**Sort the following\
    \ numbers from small to large**\n\n**Explanation:**\n\n## 1. First sorting:\n\n\
    ## 2. Second sorting:\n\n## 3. Third sorting:\n\n**No swap so terminate sorting**:\
    \ we can get the sorting numbers from small to large\n\n## 1. Create a **TestBubbleSort.html**\
    \ with **Notepad** and open it in your browser.\n\n```\n<script type =\"text/javascript\"\
    \ >\n  class BubbleSort{\n    static sort( arrays) {\n      for ( var i = 0 ;\
    \ i < arrays.length - 1 ; i++) {\n        for ( var j = 0 ; j < arrays.length\
    \ - i - 1 ; j++) {\n          //swap\n          if ( arrays[ j] > arrays[ j +\
    \ 1 ]) {\n            var flag = arrays[ j];\n            arrays[ j] = arrays[\
    \ j + 1 ];\n            arrays[ j + 1 ] = flag;\n          }\n        }\n    \
    \  }\n    }\n  }\n\n  ////////////////////testing///////////////////\n\n  var\
    \ scores = [ 60 , 50 , 95 , 80 , 70 ];\n  BubbleSort.sort( scores);\n  for ( var\
    \ i = 0 ; i < scores.length; i++) {\n    document.write( scores[ i] + \",\" );\n\
    \  }\n</script>\n```\n\n**Result:**\n\n# Minimum Value\n\nSearch the Minimum of\
    \ Integer Sequences:\n\n## 1. Algorithmic ideas\n\nInitial value `minIndex=0`,\
    \ `j=1` Compare `arrays[minIndex]` with `arrays[j]` if `arrays[minIndex] > arrays[j]`\
    \ then `minIndex=j`, `j++` else `j++`. continue until the last number, `arrays[minIndex]`\
    \ is the Min Value.\n\n## 1. Create a **TestMinValue.html** with **Notepad** and\
    \ open it in your browser\n\n```\n<script type =\"text/javascript\" >\n    function\
    \ min( arrays) {\n        var minIndex = 0 ; // the index of the minimum\n   \
    \     for ( var j = 1 ; j < arrays.length; j++) {\n            if ( arrays[ minIndex]\
    \ > arrays[ j]) {\n                minIndex = j;\n            }\n        }\n \
    \       return arrays[ minIndex];\n    }\n\n    //////////////////testing//////////////////////\n\
    \n    var scores = [ 60 , 80 , 95 , 50 , 70 ];\n    var minValue = min( scores);\n\
    \    document.write( \"Min Value = \" + minValue);\n\n</script>\n```\n\n**Result:**\n\
    \n# Select Sorting Algorithm\n\n**Select Sorting Algorithm:**\nSelect the smallest\
    \ one of the remaining unsorted elements in the array, inserting the one that\
    \ has been sorted before.\n\n**Sort the following numbers from small to large**\n\
    \n**Explanation:**\n\n## 1. First sorting:\n\n## 2. Second sorting:\n\n## 3. Third\
    \ sorting:\n\n## 4. Forth sorting:\n\nwe can get the sorting numbers from small\
    \ to large\n\n## 1. Create a TestSelectSort.html with Notepad and open it in your\
    \ browser\n\n```\n<script type =\"text/javascript\" >\n    class SelectSort{\n\
    \        static sort( arrays) {\n            var len = arrays.length - 1 ;\n \
    \           var minIndex; // Save the index of the selected minimum\n\n      \
    \      for ( var i = 0 ; i < len; i++) {\n                minIndex = i;\n    \
    \            //Save the minimum value of each loop as the first element\n    \
    \            var minValue = arrays[ minIndex];\n                for ( var j =\
    \ i; j < len; j++) {\n                    // Compare with each element if it is\
    \ less than the minimum value, exchange the minIndex\n                    if (\
    \ minValue > arrays[ j + 1 ]) {\n                        minValue = arrays[ j\
    \ + 1 ];\n                        minIndex = j + 1 ;\n                    }\n\
    \                }\n\n                //if the minimum index changes, the current\
    \ minimum is exchanged with the minIndex\n                if ( i != minIndex){\n\
    \                    var temp = arrays[ i];\n                    arrays[ i] =\
    \ arrays[ minIndex];\n                    arrays[ minIndex] = temp;\n        \
    \        }\n            }\n        }\n    }\n\n    ////////////////////testing////////////////////\n\
    \n    var scores = [ 90 , 70 , 50 , 80 , 60 , 85 ];\n\n    SelectSort.sort( scores);\n\
    ```"
  mdcn: "\n # 图解 JavaScript 算法\n\n算法 JavaScript 实践实现\n\n---\n\nYANG HU\n\n生活的复杂，在于不懂化繁为简，简单是智慧的开端。本书以实践为本，简明扼要地讲解概念，生动有趣地培养编程兴趣，深入剖析数据结构、算法、ES6+\
    \ JavaScript 以及编程的乐趣。\n\n[http://en.verejava.com](http://en.verejava.com)\n\n\
    Copyright © 2020 Yang Hu\nAll rights reserved.\nISBN : 9798629790525\n\n# 目录\n\
    \n- 1. [最大值](https://example.com)\n- 2. [冒泡排序算法](https://example.com)\n- 3. [最小值](https://example.com)\n\
    - 4. [选择排序算法](https://example.com)\n- 5. [插入排序算法](https://example.com)\n- 6. [数组反转](#)\n\
    - 7. [二分查找](#)\n- 8. [希尔排序](#)\n- 9. [单向链表](#)\n  - 9.1 [创建与初始化](#)\n  - 9.2 [添加节点](#)\n\
    \  - 9.3 [插入节点](#)\n  - 9.4 [删除节点](#)\n- 10. [双向链表](#)\n  - 10.1 [创建与初始化](#)\n\
    \  - 10.2 [添加节点](#)\n  - 10.3 [插入节点](#)\n  - 10.4 [删除节点](#)\n- 11. [单向循环链表](#)\n\
    \  - 11.1 [初始化与遍历](#)\n  - 11.2 [插入节点](#)\n  - 11.3 [删除节点](#)\n- 12. [双向循环链表](#)\n\
    \  - 12.1 [初始化与遍历](#)\n  - 12.2 [插入节点](#)\n  - 12.3 [删除节点](#)\n- 13. [队列](#)\n\
    - 14. [栈](#)\n- 15. [递归算法](#)\n- 16. [双向归并算法](#)\n- 17. [快速排序算法](#)\n- 18. [二叉查找树](#)\n\
    \  - 18.1 [构建二叉查找树](#)\n  - 18.2 [二叉查找树中序遍历](#)\n  - 18.3 [二叉查找树前序遍历](#)\n  -\
    \ 18.4 [二叉查找树后序遍历](#)\n  - 18.5 [二叉查找树最大与最小值](#)\n  - 18.6 [二叉查找树删除节点](#)\n- 19.\
    \ [二叉堆排序](#)\n- 20. [哈希表](#)\n- 21. [图](#)\n  - 21.1 [无向图与深度优先搜索](#)\n  - 21.2\
    \ [无向图与广度优先搜索](#)\n  - 21.3 [有向图与深度优先搜索](#)\n  - 21.4 [有向图与广度优先搜索](#)\n  - 21.5\
    \ [有向图拓扑排序](#)\n- 22. [汉诺塔](#)\n- 23. [斐波那契数列](#)\n- 24. [迪杰斯特拉算法](#)\n- 25. [老鼠走迷宫](#)\n\
    - 26. [八枚硬币](#)\n- 27. [约瑟夫环问题](#)\n\n# 最大值\n\n**计算整数序列的最大值：**\n\n## 1. 算法思路\n\
    \n将 `arrays[i]` 和 `arrays[i + 1]` 进行比较，如果 `arrays[i] > arrays[i + 1]` 则交换。继续这个过程直到最后一个数，`arrays[length\
    \ - 1]` 即为最大值。\n\n## 1. 使用**记事本**创建一个 **TestMaxValue.html** 并在浏览器中打开\n\n```\n\
    <script type =\"text/javascript\" >\n  function max( arrays) {\n    // 最大值初始化为0\n\
    \    for ( var i = 0 ; i < arrays.length - 1 ; i++) {\n      if ( arrays[ i ]\
    \ > arrays[ i + 1 ]) { // 交换\n        var temp = arrays[ i ];\n        arrays[\
    \ i ] = arrays[ i + 1 ];\n        arrays[ i + 1 ] = temp;\n      }\n    }\n  \
    \  var maxValue = arrays[ arrays.length - 1 ];\n    return maxValue;\n  }\n\n\
    \  /////////////////////测试/////////////////////\n\n  var scores = [ 60 , 50 ,\
    \ 95 , 80 , 70 ];\n  var maxValue = max( scores);\n  document.write( \"maxValue\
    \ = \" + maxValue);\n\n</script>\n```\n\n结果：\n\n# 冒泡排序算法\n\n**冒泡排序算法：**\n将 `arrays[j]`\
    \ 与 `arrays[j + 1]` 进行比较，如果 `arrays[j] > arrays[j + 1]` 则交换。\n对剩余元素重复此过程，直到排序完成。\n\
    \n**将下列数字从小到大排序**\n\n**说明：**\n\n## 1. 第一次排序：\n\n## 2. 第二次排序：\n\n## 3. 第三次排序：\n\
    \n**已无需交换，因此终止排序**：我们可以得到从小到大排序的数字\n\n## 1. 使用**记事本**创建一个 **TestBubbleSort.html**\
    \ 并在浏览器中打开。\n\n```\n<script type =\"text/javascript\" >\n  class BubbleSort{\n\
    \    static sort( arrays) {\n      for ( var i = 0 ; i < arrays.length - 1 ; i++)\
    \ {\n        for ( var j = 0 ; j < arrays.length - i - 1 ; j++) {\n          //交换\n\
    \          if ( arrays[ j] > arrays[ j + 1 ]) {\n            var flag = arrays[\
    \ j];\n            arrays[ j] = arrays[ j + 1 ];\n            arrays[ j + 1 ]\
    \ = flag;\n          }\n        }\n      }\n    }\n  }\n\n  ////////////////////测试///////////////////\n\
    \n  var scores = [ 60 , 50 , 95 , 80 , 70 ];\n  BubbleSort.sort( scores);\n  for\
    \ ( var i = 0 ; i < scores.length; i++) {\n    document.write( scores[ i] + \"\
    ,\" );\n  }\n</script>\n```\n\n**结果：**\n\n# 最小值\n\n搜索整数序列的最小值：\n\n## 1. 算法思路\n\
    \n初始值 `minIndex=0`，`j=1` 比较 `arrays[minIndex]` 与 `arrays[j]` 如果 `arrays[minIndex]\
    \ > arrays[j]` 则 `minIndex=j`，`j++` 否则 `j++`。继续直到最后一个数，`arrays[minIndex]` 即为最小值。\n\
    \n## 1. 使用**记事本**创建一个 **TestMinValue.html** 并在浏览器中打开\n\n```\n<script type =\"\
    text/javascript\" >\n    function min( arrays) {\n        var minIndex = 0 ; //\
    \ 最小值的索引\n        for ( var j = 1 ; j < arrays.length; j++) {\n            if\
    \ ( arrays[ minIndex] > arrays[ j]) {\n                minIndex = j;\n       \
    \     }\n        }\n        return arrays[ minIndex];\n    }\n\n    //////////////////测试//////////////////////\n\
    \n    var scores = [ 60 , 80 , 95 , 50 , 70 ];\n    var minValue = min( scores);\n\
    \    document.write( \"Min Value = \" + minValue);\n\n</script>\n```\n\n**结果：**\n\
    \n# 选择排序算法\n\n**选择排序算法：**\n在数组剩余的未排序元素中选出最小的一个，插入到已排序的元素前面。\n\n**将下列数字从小到大排序**\n\
    \n**说明：**\n\n## 1. 第一次排序：\n\n## 2. 第二次排序：\n\n## 3. 第三次排序：\n\n## 4. 第四次排序：\n\n\
    我们可以得到从小到大排序的数字\n\n## 1. 使用记事本创建一个 TestSelectSort.html 并在浏览器中打开\n\n```\n<script\
    \ type =\"text/javascript\" >\n    class SelectSort{\n        static sort( arrays)\
    \ {\n            var len = arrays.length - 1 ;\n            var minIndex; // 保存被选中最小值的索引\n\
    \n            for ( var i = 0 ; i < len; i++) {\n                minIndex = i;\n\
    \                //将每次循环的最小值保存为第一个元素\n                var minValue = arrays[ minIndex];\n\
    \                for ( var j = i; j < len; j++) {\n                    // 与每个元素比较，如果小于最小值，则交换\
    \ minIndex\n                    if ( minValue > arrays[ j + 1 ]) {\n         \
    \               minValue = arrays[ j + 1 ];\n                        minIndex\
    \ = j + 1 ;\n                    }\n                }\n\n                //如果最小值索引发生变化，将当前最小值与\
    \ minIndex 交换\n                if ( i != minIndex){\n                    var temp\
    \ = arrays[ i];\n                    arrays[ i] = arrays[ minIndex];\n       \
    \             arrays[ minIndex] = temp;\n                }\n            }\n  \
    \      }\n    }\n\n    ////////////////////测试////////////////////\n\n    var scores\
    \ = [ 90 , 70 , 50 , 80 , 60 , 85 ];\n\n    SelectSort.sort( scores);\n```\n"
