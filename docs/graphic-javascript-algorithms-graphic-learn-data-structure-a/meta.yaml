  md: '# ## 6. binary search tree Delete Node


    Binary search tree delete node 3 cases


    +   1. If there is no child node, delete it directly

    2. If there is only one child node, the child node replaces the current node,
    and then deletes the current node.

    3. If there are two child nodes, replace the current node with the smallest node
    from the right subtree, because the smallest node on the right is also larger
    than the value on the left.


