    placed 64 gold discs from top to bottom on the first Pillar. God ordered the monks
    to move all gold discs from the first Pillar to the third Pillar. The principle
    of large plates under small plates during the handling process. If only one plate
    is moved daily, the tower will be destroyed. when all the discs are moved that
    is the end of the world.


    **Let''s turn this story into an algorithm:**


    Mark the three columns as ABC.

    1. If there is only one disc, move it directly to C (A->C).

    2 completeness. When there are two discs, use B as an auxiliary (A->B, A->C,B->C).

    3. If there are more than two discs, use B as an auxiliary(A->B, A->C,B->C), and
    continue to recursive process.


