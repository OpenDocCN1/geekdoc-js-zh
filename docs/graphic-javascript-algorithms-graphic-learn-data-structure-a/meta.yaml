    # Eight Coins


    There are eight coins with the same appearance, one is a counterfeit coin, and
    the weight of counterfeit coin is different from the real coin, but it is unknown
    whether the counterfeit coin is lighter or heavier than the real coin. Please
    design a efficient algorithm to detect this counterfeit coin.


    # Solution:


    Take six **a**, **b**, **c**, **d**, **e**, **f** from eight coins, and put three
    to the balance for comparison. Suppose **a**, **b**, **c** are placed on one side,
    and **d**, **e**, **f** are placed on the other side.


    +   1. a + b + c> d + e + f

    2. a + b + c = d + e + f

    3. a + b + c <d + e + f


    If **a + b + c> d + e + f** , there is a counterfeit coin in one of the six coins,
    and **g**, **h** are real coins. At this time, one coin can be removed from both
    side. Suppose that **c** and **f** are removed. At the same time, one coin at
    each side is replaced. Suppose the coins **b** and **e** are interchanged, and
    then the second comparison. There are also three possibilities:


    +   1. **a + e> d + b**: the counterfeit currency must be one of **a**, **d**.
    as long as we compare a real currency **h** with **a** , we can find the counterfeit
    currency. If **a> h** , **a** is a heavier counterfeit currency; if **a = h**
    , **d** is a lighter counterfeit currency.

    2. **a + e = d + b**: the counterfeit currency must be one of **c**, **f**, and
    the real coin **h** is compared with **c** . If **c> h** , **c** is a heavier
    counterfeit currency; if **c = h** , then **f** is a lighter counterfeit currency.

    3. **a + e <d + b**: one of **b** or **e** is a counterfeit coin , Also use the
    real coin **h** to compare with **b**, if **b> h**, then **b** is a heavier counterfeit
    currency; if **b = h**, then **e** is a lighter counterfeit currency;


