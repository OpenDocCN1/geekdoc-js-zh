    \n## 三色旗排序\n\n三色旗问题最初由 E.W. Dijkstra 提出，他以荷兰国旗为灵感（Dijkstra 是荷兰人）。\n\n假设有一根绳子，上面挂着红、白、蓝三种颜色的旗子。起初绳子上的所有旗子都是无序的。你需要将它们按蓝色\
    \ -> 白色 -> 红色的顺序排列。如何用最少次数移动它们。你只能在这根绳子上操作，并且每次只能交换两面旗子。\n\n![](img/f048677f9e730c94d3013e7a7cb78278_258_0.png)\n\
    \nR B W B R W -> B W W B R R\n\n**解决方案：**\n\n使用字符数组来存储旗子。例如，b、w 和 r 分别表示蓝色、白色和红色旗子的位置。b\
    \ 和 w 从数组的 0 位置开始，r 在数组的末尾。\n\n- (1) 如果 w 位置是蓝色旗子，flags[w] 与 flags[b] 交换。whiteIndex\
