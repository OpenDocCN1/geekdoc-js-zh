    \ to the third Pillar. The principle of large plates under small plates during\
    \ the handling process. If only one plate is moved daily, the tower will be destroyed.\
    \ when all the discs are moved that is the end of the world.\n\n**Let's turn this\
    \ story into an algorithm:**\n\nMark the three columns as ABC.\n\n1. If there\
    \ is only one disc, move it directly to C (A->C).\n2. When there are two discs,\
    \ use B as an auxiliary (A->B, A->C, B->C).\n3. If there are more than two discs,\
    \ use B as an auxiliary (A->B, A->C, B->C), and continue to recursive process.\n\
