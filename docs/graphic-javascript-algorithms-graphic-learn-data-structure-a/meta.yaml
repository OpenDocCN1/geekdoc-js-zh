    \n190\n\n## 用记事本创建 TestBinaryHeapSorting.html\n\n```javascript\n<script type=\"\
    text/javascript\">\nclass HeapSort {\n  constructor() {\n    this.array = [];\n\
    \  }\n\n  // Initialize the heap\n  createHeap(array) {\n    this.array = array;\n\
    \n    // Build a heap, (array.length - 1) / 2 scan half of the nodes with child\
    \ nodes\n    for (var i = (array.length - 1) / 2; i >= 0; i--) {\n      this.adjustHeap(i,\
    \ array.length - 1);\n    }\n  }\n\n  // Adjustment heap\n  adjustHeap(currentIndex,\
    \ maxLength) {\n    var noLeafValue = this.array[currentIndex]; // Current non-leaf\
    \ node\n\n    // 2 * currentIndex + 1 Current left subtree subscript\n    for\
    \ (var j = 2 * currentIndex + 1; j <= maxLength; j = currentIndex * 2 + 1) {\n\
    \      if (j < maxLength && this.array[j] < this.array[j + 1]) {\n        j++;\
    \ // j Large subscript\n      }\n\n      if (noLeafValue >= this.array[j]) {\n\
    \        break;\n      }\n\n      this.array[currentIndex] = this.array[j]; //\
    \ Move up to the parent node\n      currentIndex = j;\n    }\n    this.array[currentIndex]\
    \ = noLeafValue; // To put in the position\n  }\n\n  heapSort() {\n    for (var\
    \ i = this.array.length - 1; i > 0; i--) {\n      var temp = this.array[0];\n\
    \      this.array[0] = this.array[i];\n      this.array[i] = temp;\n      this.adjustHeap(0,\
    \ i - 1);\n    }\n  }\n}\n\n///////////////////testing///////////////////\n\n\
    var heapSort = new HeapSort();\n\nvar scores = [10, 90, 20, 80, 30, 70, 40, 60,\
    \ 50];\n\ndocument.write(\"Before building a heap : <br>\");\nfor (var i = 0;\
    \ i < scores.length; i++) {\n  document.write(scores[i] + \", \");\n}\ndocument.write(\"\
    <br><br>\");\n\n/////////////////////////////////////////////\n\ndocument.write(\"\
    After building a heap : <br>\");\nheapSort.createHeap(scores);\nfor (var i = 0;\
