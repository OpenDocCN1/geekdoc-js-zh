  \ |\n| 邮寄：Que, 201 West 103rd Street, Indianapolis, IN 46290 USA |\n\n# 引言\n\n##\
  \ 示例系列\n\n学习 JavaScript 如果通过示例进行有两个明显的优势。首先，通过在阅读每一章时完成示例，概念会立即得到强化，这比仅仅阅读文字要有效得多。其次，通过\
  \ Web 上可以下载的示例，JavaScript 让您在当今占据极佳位置，同时让您能够练习自己的新技能。\n\n## 谁应该阅读这本书\n\n本书向初级程序员教授如何编写和创建\
  \ JavaScript 脚本，这些人员可能从未见过过 JavaScript 语句。本书假设读者没有任何 JavaScript 经验，并从零开始循序渐进地涵盖所有内容。如果您在今天早上之前从未听说过\
  \ JavaScript，或者过去曾渴望地看着示例，希望自己也能像那样写出 JavaScript，那么这本书就是适合您的！\n\n## 本书的结构\n\n本文侧重于如何编写正确的\
  \ JavaScript，教授您所需的所有技术和技能。您将从简单的示例开始，一个一个、一个概念一个地构建自己的知识和理解。我们不会迫使您在第一章中创建一个“超级示例”，也不会介绍一些供您剪切粘贴到\
  \ Web 页面中的脚本库。您在这里将发现对 JavaScript 的坚实基础，这将使您能够以自己想要的方式使用这种语言！\n\n\n\n\n\n在本书中，你将看到人们实际上是如何将\
  \ JavaScript 应用于他们的网站的示例。这些示例将会有详细的文档说明，你会有很多机会通过实验和扩展这些章节中介绍的示例来磨练你的 JavaScript\
  \ 技能。\n\n请访问 by Example 网站获取代码示例或与本书相关的其他材料。你可以在 [`www.quecorp.com/series/by_example`](http://www.quecorp.com/series/by_example)\
  \ 找到它们。\n\n## 本书使用的字体约定\n\n本书使用了以下字体约定：\n\n| 字体 | 含义 |\n| --- | --- |\n| *斜体 (Italic)*\
