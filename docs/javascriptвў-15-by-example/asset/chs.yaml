  \ device off -->\n</script>\n</head>\n<body>\n\n</</body>>\n</html>\n```\n\n以这种方式创建数组的优势在于，你不需要预先担心有多少个元素。使用这种方法，会自动创建一个具有适当数量元素的数组。\n\
  \n该数组在功能上与上一个示例相同，并且以完全相同的方式访问其元素。\n\n### 数组的长度\n\n之前，你读到数组的长度隐藏在 `length` 属性中。`length`\
  \ 是数组的一个属性，尽管它可能是隐藏的，但它并非不可及。\n\n要找出 `days_of_week` 数组中有多少元素，你可以使用以下：\n\n```\n days_of_week.length\n\
