  ` |\n| Boolean | `\"boolean\"` |\n| Number | `\"number\"` |\n| String | `\"string\"\
  ` |\n| Object (非函数) | `\"object\"` |\n| Object (函数) | `\"function\"` |\n\n**注意**\n\
