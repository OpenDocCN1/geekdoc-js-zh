  \ = \"Wednesday\";\ndays_of_week[4] = \"Thursday\";\ndays_of_week[5] = \"Friday\"\
  ;\ndays_of_week[6] = \"Saturday\";\nvar x = 2;\nalert(days_of_week[x]);\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n\n</</body>>\n</html>\n```\n\n在这里，你看到一个创建变量\
  \ `x` 并将数字 `2` 赋值为其值的示例。然后将变量 `x` 放在方括号中，结果返回了数组中的第 2 个元素。\n\n**练习**\n\n创建一个数组来存储一年的月份，并使用两种获取值的方法来显示\
  \ 2 月和 8 月。（从现在起，对你的代码进行有效注释这一点是不言自明的！）\n\n### 快速创建数组！\n\n这里有一种创建与上一个示例完全相同的数组的快得多的方法——这次，只需一行代码：\n\
  \n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
