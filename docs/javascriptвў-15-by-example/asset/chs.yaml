  JavaScript\">\n<!-- Cloaking device on!\nalert(Math.random());\n// Cloaking device\
  \ off -->\n</script>\n```\n\n如果你想要 0 到 10 之间的随机整数，你必须将随机数乘以 10，然后使用 `round` 方法将其四舍五入（参见\
  \ 图 9.6）：\n\n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nrndNum = Math.random();\nrndNum = rndNum * 10;\nalert(Math.round(rndNum));\n\
  // Cloaking device off -->\n</script>\n```\n\n##### 图 9.6. 0 到 10 之间的伪随机数。\n\n![](img/0789724995_ch09lev1sec4_image20.gif)\n\
  \n![](img/0789724995_ch09lev1sec4_image21.gif)\n\n\n\n\n##### 图 9.7 一个 0 到 100 之间的随机数。\n\
  \n![](img/0789724995_ch09lev1sec4_image22.gif)\n\n![](img/0789724995_ch09lev1sec4_image23.gif)\n\
  \n### 练习\n在以下示例中练习 `Math` 对象，尝试你自己的计算，记得进行舍入并可能使用一些随机数。\n\n### `Date` 对象\n`Date`\
  \ 对象提供了丰富的日期相关属性和方法。要使用 `Date` 对象，第一步是给它分配一个变量（类似于你使用 `Array` 对象的方式）：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\ndateVar = new Date();\n// 关闭隐藏设备\
  \ -->\n</script>\n```\n现在你完成了这一步，就可以使用 `Date` 对象了。\n\n**注意**\n不带参数的 `new Date()`\
  \ 返回系统当前的日期和时间。\n\n**注意**\n`Date` 对象可以表示的日期范围大约是从 1970 年 1 月 1 日开始的！\n\n#### `getFullYear`\
  \ 方法\n你可以首先尝试使用 `getFullYear` 方法获取完整年份（参见图 9.8）：\n\n```javascript\n <script language=\"\
  JavaScript\">\n<!-- 开启隐藏设备 -->\ndateVar = new Date();\nalert(dateVar.getFullYear());\n\
  // 关闭隐藏设备 -->\n</script>\n```\n\n##### 图 9.8 框中显示的完整年份。\n\n![](img/0789724995_ch09lev1sec5_image01.gif)\n\
  \n此方法无论年份是多少都返回四位数，从而解决了 Y2K 问题。相比之下，`getYear` 方法对于 1900-1999 年返回两位年份。对于在该范围之外的日期，它返回原值。例如，1995\
  \ 将返回 95，但 1825 和 2025 将返回原值。\n\n#### `getMonth` 方法\n使用 `getMonth` 方法获取月份与获取年份一样简单。此方法返回\
  \ 0 到 11 之间的数字，代表一月到十二月。图 9.9 展示了代码的运行情况。\n\n##### 图 9.9 框中显示的月份数字。\n\n![](img/0789724995_ch09lev1sec5_image02.gif)\n\
  \n![](img/0789724995_ch09lev1sec5_image03.gif)\n\n**警告**\n记住月份是从 0 开始而不是 1！\n\n\
  ```javascript\n <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\ndateVar = new\
  \ Date();\nalert(dateVar.getMonth());\n// 关闭隐藏设备 -->\n</script>\n```\n\n使用此数字显示实际月份需要使用\
  \ `if` 语句测试结果并根据此条件将月份名称分配给变量。这是一个简单的示例（参见图 9.10）：\n\n```javascript\n <script language=\"\
  JavaScript\">\n<!-- 开启隐藏设备 -->\ndateVar = new Date();\nmonthNow = dateVar.getMonth();\n\
  if (monthNow == 0)\n{\ntxtMonth = \"January\";\n}\nif (monthNow == 1)\n{\ntxtMonth\
  \ = \"February\";\n}\nif (monthNow == 2)\n{\ntxtMonth = \"March\";\n}\nif (monthNow\
  \ == 3)\n{\ntxtMonth = \"April\";\n}\nif (monthNow == 4)\n{\ntxtMonth = \"May\"\
  ;\n}\nif (monthNow == 5)\n{\ntxtMonth = \"June\";\n}\nif (monthNow == 6)\n{\ntxtMonth\
  \ = \"July\";\n}\nif (monthNow == 7)\n{\ntxtMonth = \"August\";\n}\nif (monthNow\
  \ == 8)\n{\ntxtMonth = \"September\";\n}\nif (monthNow == 9)\n{\ntxtMonth = \"October\"\
  ;\n}\nif (monthNow == 10)\n{\ntxtMonth = \"November\";\n}\nif (monthNow == 11)\n\
  {\ntxtMonth = \"December\";\n}\nalert(\"The month now is: \" + txtMonth);\n// 关闭隐藏设备\
  \ -->\n</script> \n```\n\n##### 图 9.10 显示的真实月份。\n\n![](img/0789724995_ch09lev1sec5_image04.gif)\n\
  \n#### `getDay` 方法\n同样，`getDay` 与 `getMonth` 和 `getYear` 类似。此方法返回 0 到 6 之间的数字，代表周日到周六（参见图\
  \ 9.11）：\n\n```javascript\n <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\n\
  dateVar = new Date();\nalert(dateVar.getDay());\n// 关闭隐藏设备 -->\n</script>\n```\n\
  \n##### 图 9.11 框中显示的月份数字。\n\n![](img/0789724995_ch09lev1sec5_image05.gif)\n\n**警告**\n\
  记住日期是从 0 开始而不是 1！\n\n### `String` 对象\n`String` 对象允许你操作字符串。\n\n#### `toUpperCase`\
  \ 和 `toLowerCase` 方法\n`String` 对象最简单的方法是 `toUpperCase` 和 `toLowerCase`。这里是将文本转换为大写的的一个示例：\n\
  \n```javascript\n <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\nstr = \"hello\
  \ world\";\nalert(str.toUpperCase());\n// 关闭隐藏设备 -->\n</script>\n```\n\n##### 图\
  \ 9.12 转换为大写的字符串。\n\n![](img/0789724995_ch09lev1sec5_image06.gif)\n\n这里是将文本转换为小写的的一个示例：\n\
  \n```javascript\n <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\nstr = \"HELLO\
  \ WORLD\";\nalert(str.toLowerCase());\n// 关闭隐藏设备 -->\n</script>\n```\n\n##### 图\
  \ 9.13 转换为小写的字符串。\n\n![](img/0789724995_ch09lev1sec5_image07.gif)\n\n#### `substring`\
  \ 方法\n`substring` 方法用于返回指定位置的子字符串。这是 `substring` 方法的运行情况（参见图 9.14）：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- 开启隐藏设备 -->\nstr = \"Hello world\";\nalert(str.substring(0,\
  \ 5));\n// 关闭隐藏设备 -->\n</script>\n```\n\n##### 图 9.14 从字符串中提取的子字符串。\n\n![](img/0789724995_ch09lev1sec5_image08.gif)\n\
  \n`substring` 方法使用括号内的两个数字来确定从字符串中提取的子字符串（参见图 9.15)）。第一个数字是起始位置（从 0 开始计数），从字符串开头开始。第二个数字是结束位置。\n\
  \n##### 图 9.15 显示如何从字符串中提取子字符串的图。\n\n![](img/0789724995_ch09lev1sec5_image09.gif)\n\
  \n**注意**\n有趣的是，`substring` 方法始终使用较小的值开始并进行到较大的值。这意味着 `str.substring(0, 4)` 和 `str.substring(4,\
  \ 0)` 返回相同的子字符串。\n\n\n\n\n\n尝试练习 `String` 对象，特别是从字符串中提取子字符串。尝试用更多的代码来操作这些字符串吧！\n\
  \n## `with` 语句\n\n暂时回到语句这一部分，`with` 语句通过减少需要编写的代码量，使得在 JavaScript 中使用对象变得更加简单。\n\
  \n`with` 语句允许你为语句创建一个默认对象，从而简化代码并减少了你输入的字符数。\n\n以下是一个示例：\n\n```javascript\n <script\
  \ language=\"JavaScript\">\n<!-- 开启伪装设备!\ninp1 = prompt(\"Enter a number\",\"Number\
  \ goes here\");\ninp2 = prompt(\"Enter a number\",\"Number goes here\");\ninp3 =\
  \ prompt(\"Enter a number\",\"Number goes here\");\nalert(\"The largest number entered\
  \ was \" + Math.max(inp1, inp2, inp3));\nalert(\"The smallest number entered was\
  \ \" + Math.min(inp1, inp2, inp3));\n// 伪装设备关闭 -->\n</script>\n```\n\n使用 `with`\
  \ 语句，对 `Math` 属性的使用可以简化如下：\n\n```javascript\n <script language=\"JavaScript\">\n\
  <!-- 开启伪装设备!\ninp1 = prompt(\"Enter a number\",\"Number goes here\");\ninp2 = prompt(\"\
  Enter a number\",\"Number goes here\");\ninp3 = prompt(\"Enter a number\",\"Number\
  \ goes here\");\nwith (Math)\n{\nalert(\"The largest number entered was \" + max(inp1,\
  \ inp2, inp3));\nalert(\"The smallest number entered was \" + min(inp1, inp2, inp3));\n\
  }\n// 伪装设备关闭 -->\n</script>\n```\n\n这看起来可能不是什么巨大的改进，但如果你打算使用 JavaScript 处理多个属性或方法，你将会发现使用\
  \ `with` 语句非常有益！\n\n## 对象方法与属性\n\n### `Array` 对象\n\n#### 属性\n`constructor` 属性 |\
