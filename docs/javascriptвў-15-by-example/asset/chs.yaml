  ![](img/0789724995_ch06lev1sec2_image56.gif)\n\n##### 杂项运算符\n\n你还需要的另外三个不属于上述任何类别的运算符是三元条件运算符（?:`）、二元字符串拼接运算符（+`）以及一元\
  \ `typeof` 运算符。\n\n条件运算符是一种快速简单的方法，根据条件的结果为变量赋值两个可能值中的之一。考虑以下示例：\n\n```javascript\n\
  W = 1, X = 2, Y = 3, Z = 4\nAns = (W < X) ? Y : Z\n```\n\n`Ans` 等于 `4`。\n\n这看起来很复杂，但其实不然。它的工作原理是：如果\
  \ `?` 之前的表达式（这是一个条件）为 `true`，则将冒号（`:`）左侧表达式的值赋值给变量 `Ans`。否则，使用左侧的表达式（如本例所示）。\n\n\
  字符串拼接运算符用于通过将两个独立的字符串连接（拼接）来创建一个新字符串：\n\n```javascript\nA = \"JavaScript \"\nB =\
  \ \"by Example!\"\nC = A + B\n```\n\n**注意**\n\n注意此运算符与算术加法运算符相同。同一个运算符的不同含义是 JavaScript\
  \ 中让初学者感到困惑的领域之一。为了避免这种情况，你必须对每个运算符使用正确的术语。避免使用“加”（plus）和“减”（minus）等术语，因为它们是模糊的！\n\
  \n最后一个运算符是 `typeof` 运算符。该运算符用于告诉你变量中存储或由条件返回的数据类型。\n\n**警告**\n\nNetscape Navigator\
  \ 2.02 中不包含 `typeof` 运算符。\n\n表 6.1 显示了根据操作的类型而得到的七种常见输出。\n\n表 6.1. `typeof` 字符串\n\
