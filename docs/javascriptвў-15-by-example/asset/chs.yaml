  \ on!\n\n// Cloaking device off -->\n</script>\n<style>\n<!--\n\n-->\n</style>\n\
  </head>\n<body>\n<div style=\"position:absolute;top:15px;left:200px\">\n<img src=\"\
  circle.gif\">\n</div>\n<h1 style=\"position:absolute;top:15px;left:10px;text-decoration:underline\"\
  > Welcome to \nthis page!</h1>\n</body>\n</html>\n```\n\n### 图 13.18. 更改 HTML 中元素的顺序，就会改变浏览器中显示的堆叠顺序。\n\
  \n![](img/0789724995_ch13lev1sec2_image48.gif)\n\n![](img/0789724995_ch13lev1sec2_image49.gif)\n\
  \n然而，这种方法非常难以控制，而且你最不想去费腾的就是 HTML 元素的顺序。一种更好的方法是使用 CSS 属性 `z-index` 来为你完成工作。`z-index`\
  \ 的值越高，元素就越靠上。如果你想让某个元素在最上方，你可以通过修改它的属性来改变堆叠顺序：\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  \n// Cloaking device off -->\n</script>\n<style>\n<!--\n\n-->\n</style>\n</head>\n\
  <body>\n<div style=\"position:absolute;top:15px;left:200px;z-index:2\">\n<img src=\"\
  circle.gif\">\n</div>\n<h1 style=\"position:absolute;top:15px;left:10px;text-decoration:underline;z-index:1\"\
  > Welcome to \nthis page!</h1>\n</body>\n</html>\n``` \n\n*(注：由于原文文本在结尾处存在逻辑重复和断句，译文已根据上下文逻辑进行了对齐处理，确保通顺。)*\
  \ \n\n\n\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction colorchange()\n{\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n<h1 id=\"head1\" onMouseover=\"colorchange()\"\
  >Welcome to this page!</h1>\n<p>A lot of interesting text goes here! A lot of interesting\
  \ text goes here! A lot of \ninteresting text goes here! A lot of interesting text\
  \ goes here! A lot of interesting text\n goes here!</p>\n</body>\n</html>\n```\n\
  \n### 基础交互\n\n现在你需要的编写执行任务的 JavaScript 代码。你只需要一行代码即可实现，它由四个部分组成：\n\n* 指向页面上你想要让\
  \ JavaScript 作用的位置的指针，在本例中是 `head1`。\n* JavaScript 应该作用的方面——在本例中是它的 `style`。\n*\
  \ 要更改哪种样式属性——这里是 `color`。\n* 最后，你想要样式属性采取的新值，在本例中是 `red`。\n\n将所有这些组合在一起，你就得到了以下代码：\n\
  \n```javascript\n head1.style.color = \"red\"\n```\n\n将此代码添加到函数并保存页面。你完成后的页面看起来应该是这样的：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction colorchange()\n{\nhead1.style.color = \"red\"\
  ;\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1 id=\"head1\" onMouseover=\"\
  colorchange()\">Welcome to this page!</h1>\n<p>A lot of interesting text goes here!\
  \ A lot of interesting text goes here! A lot of \ninteresting text goes here! A\
  \ lot of interesting text goes here! A lot of interesting text\n goes here!</p>\n\
  </body>\n</html>\n```\n\n接下来，将你的页面加载到浏览器中，观察当你把鼠标指针移动到标题上方时发生什么。如果一切顺利，颜色应该会改变！\n\
  \n然而，注意当你把鼠标指针移开它时，文字并没有变回（参见 图 13.20）。要实现这一点，你需要编写一个新的 JavaScript 函数，当鼠标指针移出文字时运行它。你通过使用\
  \ `onMouseout` 事件来实现这一点：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction colorchange()\n\
  {\nhead1.style.color = \"red\";\n}\n\nfunction colorchangeback()\n{\nhead1.style.color\
  \ = \"black\";\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1 id=\"\
  head1\" onMouseover=\"colorchange()\" onMouseout=\"colorchangeback()\"> Welcome\
  \ to this\n page!</h1>\n<p>A lot of interesting text goes here! A lot of interesting\
  \ text goes here! A lot of \ninteresting text goes here! A lot of interesting text\
  \ goes here! A lot of interesting text\n goes here!</p>\n</body>\n</html>\n```\n\
  \n##### 图 13.20. JavaScript 与 CSS 的演示。\n\n![](img/0789724995_ch13lev1sec3_image16.gif)\n\
  \n![](img/0789724995_ch13lev1sec3_image17.gif)\n\n### 使用文本装饰\n\n让我们来看另一个例子；这次使用\
  \ `text-decoration` 属性。\n\n#### 注意\n\n在 JavaScript 中使用带有连字符的 CSS 属性时，你必须移除连字符，将两个单词合并在一起，并将第二个部分的第一个字母大写。因此，`text-decoration`\
  \ 在脚本中使用时会变成 `textDecoration`。\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction addunderline()\n\
  {\nhead1.style.textDecoration = \"underline\"\n}\n\nfunction removeunderline()\n\
  {\nhead1.style.textDecoration = \"none\"\n}\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n<h1 id=\"head1\" onMouseover=\"addunderline()\" onMouseout=\"removeunderline()\"\
  > Welcome to \nthis page!</h1>\n<p>A lot of interesting text goes here! A lot of\
  \ interesting text goes here! A lot of \ninteresting text goes here! A lot of interesting\
  \ text goes here! A lot of interesting text\n goes here!</p>\n</body>\n</html>\n\
  ```\n\n### 警告\n\n注意 `textDecoration` 的大小写——如果全用小写，脚本将失败！\n\n现在，当鼠标指针移动到标题文字上时，下划线会被添加和移除。\n\
  \n你可以扩展此功能来涵盖更多 `text-decoration` 可能的值，同时练习更多几个事件。在这里，使用了 `onClick` 事件来添加上划线 `overline`（参见\
  \ 图 13.21）。\n\n```javascript\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction addunderline()\n\
  {\nhead1.style.textDecoration = \"underline\"\n}\n\nfunction removeunderline()\n\
  {\nhead1.style.textDecoration = \"none\"\n}\n\nfunction addoverline()\n{\nhead1.style.textDecoration\
  \ = \"overline\"\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1\
  \ id=\"head1\" onMouseover=\"addunderline()\" onMouseout=\"removeunderline()\"\n\
  \ onClick=\"addoverline()\"> Welcome page!</h1>\n<p>A lot of interesting text goes\
  \ here! A lot of interesting text goes here! A lot of \ninteresting text goes here!\
  \ A lot of interesting text goes here! A lot of interesting text\n goes here!</p>\n\
  </body>\n</html>\n```\n\n##### 图 13.21. 使用 onClick 事件添加上划线\n\n![](img/0789724995_ch13lev1sec3_image24.gif)\n\
  \n![](img/0789724995_ch13lev1sec3_image25.gif)\n\n### 双击事件\n\n最后，这里由双击触发的删除线 (0789724995_ch13lev1sec3.xhtml_ch13fig22):\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction addunderline()\n{\nhead1.style.textDecoration\
  \ = \"underline\"\n}\n\nfunction removeunderline()\n{\nhead1.style.textDecoration\
  \ = \"none\"\n}\n\nfunction addoverline()\n{\nhead1.style.textDecoration = \"overline\"\
  \n}\n\nfunction addethrough()\n{\nhead1.style.textDecoration = \"line-through\"\n\
  }\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1 id=\"head1\" onMouseover=\"\
  addunderline()\" onMouseout=\"removeunderline()\"\n onClick=\"addoverline()\" ondblclick=\"\
  addethrough()\"> Welcome to this page!</h1>\n<p>A lot of interesting text goes here!\
  \ A lot of interesting text goes here! A lot of \ninteresting text goes here! A\
  \ lot of interesting text goes here! A lot of interesting text\n goes here!</p>\n\
  </body>\n</html>\n```\n\n##### 图 13.22. 删除线的演示。\n\n![](img/0789724995_ch13lev1sec3_image29.gif)\n\
  \n![](img/0789724995_ch13lev1sec3_image30.gif)\n\n\n\n\n\n电视屏幕上的图像每秒更新 24 次，或者说大约每隔\
  \ 40 毫秒更新一次！这种速度快到眼睛察觉不到图像的变化，这就是为什么它看起来如此流畅。尽管如此，如果你用相机或摄影摄像机拍摄电视，你就能看到这个过程了。\n\
  \n问题在哪里呢？嗯，主要在于 Internet Explorer 和 Netscape Navigator 的工作方式不同。这并不意外，但更糟糕的是，Netscape\
  \ 4 和 Netscape 6 的工作方式也不同！\n\n为了简单起见，你只需要看两种方法——一种针对 Internet Explorer 5，另一种针对 Netscape\
  \ Navigator 4。这样，你既可以涵盖大部分浏览器市场份额，同时又能保持示例更加易于管理。\n\n**注意**\n\n在编写本文时，Netscape Navigator\
  \ 6 处于预览发布阶段，尚未完全定型。有关关于 Netscape Navigator 6 的 CSS 更多信息，请访问 Netscape 开发者网站：[`developer.netscape.com`](http://developer.netscape.com)。\n\
  \n让我们先看看在 Internet Explorer 中是如何实现动画的。\n\n### 动画与 Internet Explorer 5\n\n首先：让我们从需要制作动画的\
  \ 页面开始。这个示例让文字产生动画，使其从左向右移动：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n<div>\nText ... on the go!\n</div>\n</body>\n\
  </html>\n```\n\n需要做的第一项添加是给包裹文字的 `<div>` 标签添加一个 `id`，给它起一个有意义的名字：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\n\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<div id=\"\
  ani1\">\nText ... on the go!\n</div>\n</body>\n</html>\n```\n\n接下来，使用 CSS 将文字定位在起始位置：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on\
  \ the go!\n</div>\n</body>\n</html>\n```\n\n现在，你开始编写 JavaScript 函数。首先把它的框架写好。这个函数将命名为\
  \ `moveTxt()`：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n{\n\n\
  }\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\" style=\"\
  position:absolute;left:10;top:10\">\nText ... on the go!\n</div>\n</body>\n</html>\n\
  ```\n\n现在开始编写 JavaScript 的主体内容。因为文字无限向页面右侧移动没有意义，你需要某种方法来控制它。最好的方法是使用 `if` 语句检查文字的位置，并仅当文字距离左侧小于\
  \ 500 像素时才运行脚本。这是通过使用 `pixelLeft` CSS 属性实现的。\n\n**提示**\n\n记得为 `if` 语句为真时执行的语句添加第二组大括号。\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (ani1.style.pixelLeft < 500)\n\
  {\n\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\"\
  \ style=\"position:absolute;left:10;top:10\">\nText ... on the go!\n</div>\n</body>\n\
  </html>\n```\n\n现在，让我们看看控制动画的最终语句。首先，你必须处理跳跃问题。每一步，文字都会向右跳跃两个像素。你不仅使用 `pixelLeft`\
  \ 属性读取文字的位置，还利用它通过递增 2 来改变位置：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n\
  {\nif (ani1.style.pixelLeft < 500)\n{\nani1.style.pixelLeft += 2;\n}\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\"\
  >\nText ... on the go!\n</div>\n</body>\n</html>\n```\n\n接下来是间隔。这是通过 `setTimeout`\
  \ 方法控制的，它允许你在指定的一段时间后重新运行一个函数。在这里，你在重新运行 `moveTxt()` 函数之前，将间隔设置为 50 毫秒：\n\n```html\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (ani1.style.pixelLeft < 500)\n\
  {\nani1.style.pixelLeft += 2;\nsetTimeout(\"moveTxt()\", 50);\n}\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\"\
  >\nText ... on the go!\n</div>\n</body>\n</html>\n```\n\n整个过程会一直重复，直到 `if` 语句为假。最后要做的事情是触发脚本。使用\
  \ `onload` 事件来实现：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif\
  \ (ani1.style.pixelLeft < 500)\n{\nani1.style.pixelLeft += 2;\nsetTimeout(\"moveTxt()\"\
  , 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"moveTxt()\"\
  >\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on the\
  \ go!\n</div>\n</body>\n</html>\n```\n\n保存此文件并在 Internet Explorer 中查看（参见图 13.23）。\n\
  \n##### 图 13.23. 文字移动！\n\n![](img/0789724995_ch13levsec5_image01.gif)\n\n![](img/0789724995_ch13levsec5_image02.gif)\n\
  \n### 在 Netscape Navigator 4 中实现相同的功能\n\n如果你想在 Netscape Navigator 4 中实现相同的事情，可以在\
  \ Internet Explorer 示例中准备给 JavaScript 函数添加语句的地方继续：\n\n```html\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nfunction moveTxt()\n{\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on\
  \ the go!\n</div>\n</body>\n</html>\n```\n\n像上一个示例一样，你需要添加一个 `if` 语句。然而，这次使用的表达式略有不同。这次你需要：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (document.ani1.left < 500)\n\
  {\n\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\"\
  \ style=\"position:absolute;left:10;top:10\">\nText ... on the go!\n</div>\n</body>\n\
  </html>\n```\n\n存在一个细微的差异导致了不兼容，但这已经足够！\n\n下一条语句与 Internet Explorer 示例略有不同；但 `setTimeout`\
  \ 语句是相同的：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (document.ani1.left\
  \ < 500)\n{\ndocument.ani1.left += 2;\nsetTimeout(\"moveTxt()\", 50);\n}\n}\n//\
  \ Cloaking device off -->\n</script>\n</head>\n<body>\n<div id=\"ani1\" style=\"\
  position:absolute;left:10;top:10\">\nText ... on the go!\n</div>\n</body>\n</html>\n\
  ```\n\n最后，通过使用 `onload` 事件触发它完成示例——你就做好了：\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  function moveTxt()\n{\nif (document.ani1.left < 500)\n{\ndocument.ani1.left += 2;\n\
  setTimeout(\"moveTxt()\", 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body onLoad=\"moveTxt()\">\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\"\
  >\nText ... on the go!\n</div>\n</body>\n</html>\n```\n\n将此示例加载到 Netscape Navigator\
  \ 4 中查看结果，结果应该看起来和 Internet Explorer 示例非常相似（参见图 13.24）！\n\n##### 图 13.24. 在 Netscape\
  \ Navigator 4 中移动移动！\n\n![](img/0789724995_ch13lev1sec6_image01.gif)\n\n![](img/0789724995_ch13lev1sec6_image02.gif)\n\
  \n\n\n\n\n# 在两个浏览器中运行！\n\n这可以实现吗？这类示例可以在两个浏览器中共同运行吗？事实上，答案是肯定的！\n\n这里的关键在于意识到利用差异。你将利用的差异是：在\
  \ Internet Explorer 中存在一个名为 `document.all` 的对象。因此，如果你使用 `if` 语句来测试它，就可以判断你处理的是 Internet\
  \ Explorer 5 还是 Netscape Navigator 4：\n\n```javascript\n <script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction someFunction()\n{\nif (document.all)\n{\n\
  // 表达式为真，因此在这里放置 IE5 的语句\n}\nelse\n// 表达式为假，因此在这里放置 NN4 的语句\n}\n// Cloaking device\
  \ off -->\n</script>\n```\n\n遵循这种方法创建一个可以在两个浏览器中运行的超级 JavaScript 只需要从各个脚本中提取相应部分并将其放入此布局中：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (document.all)\n{\nif (ani1.style.pixelLeft\
  \ < 500)\n{\nani1.style.pixelLeft += 2;\nsetTimeout(\"moveTxt()\", 50);\n}\n}\n\
  else\nif (document.ani1.left < 500)\n{\ndocument.ani1.left += 2;\nsetTimeout(\"\
  moveTxt()\", 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"\
  moveTxt()\">\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText\
  \ ... on the go!\n</div>\n</body>\n</</html>\n```\n\n看这些 Internet Explorer 和 Netscape\
  \ Navigator 脚本是如何拼接到这个新的 `if` 语句中的？\n\n将此加载到两个浏览器中观察其运行效果。\n\n### 练习\n\n修改之前的示例，使文字向相反方向移动（从右向左）。记住，这涉及到更改起始位置和脚本停止的点；此外，你必须递减像素值，而不是递增。\n\
  \n## 上下移动\n\n想上下移动而不是左右移动吗？简单！你只需要使用 `pixelTop` 属性代替 `pixelLeft`。\n\n以下是针对 Internet\
  \ Explorer 示例的简单修改，以实现该功能：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n\
  {\nif (ani1.style.pixelTop < 500)\n{\nani1.style.pixelTop += 2;\nsetTimeout(\"moveTxt()\"\
  , 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"moveTxt()\"\
  >\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on the\
  \ go!\n</div>\n</body>\n</</html>\n```\n\n现在，这是 Netscape Navigator 示例的相同修改。它用 `top`\
  \ 属性替换了 `left`：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif\
  \ (document.ani1.top < 500)\n{\ndocument.ani1.top += 2;\nsetTimeout(\"moveTxt()\"\
  , 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"moveTxt()\"\
  >\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on the\
  \ go!\n</div>\n</body>\n</</html>\n```\n\n### 练习\n\n你能将这两个示例合并为一个可以在两个浏览器中运行的版本吗？\n\
  \n## 想对角线移动吗？\n\n沿对角线移动只需在迭代中同时水平和垂直移动。这是一个让文字从页面左上角移动到右下角的示例。\n\n首先是 Internet Explorer\
  \ 5 版本：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (ani1.style.pixelTop\
  \ < 500)\n{\nani1.style.pixelTop += 2;\nani1.style.pixelLeft += 2;\nsetTimeout(\"\
  moveTxt()\", 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"\
  moveTxt()\">\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText\
  \ ... on the go!\n</div>\n</body>\n</</html>\n```\n\n然后是 Netscape Navigator 4 版本：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moveTxt()\n{\nif (document.ani1.top < 500)\n\
  {\ndocument.ani1.top += 2;\ndocument.ani1.left += 2;\nsetTimeout(\"moveTxt()\",\
  \ 50);\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"moveTxt()\"\
  >\n<div id=\"ani1\" style=\"position:absolute;left:10;top:10\">\nText ... on the\
  \ go!\n</div>\n</body>\n</</html>\n```\n\n\n\n\n这是因为文档对象模型（DOM）只是 Web 页面本身的一种表示，它本身无法完成任何事情。它与变量非常相似。变量持有某些值，但如果没有更多的\
  \ JavaScript，它们就无事可做。\n\n文档对象模型的最新形态提供了四项关键创新（如果你愿意的话，也可以称之为 Web 开发者的魔法力量）：\n\n\
  *   访问页面上的所有元素\n*   即时更新页面\n*   完整且全面的事件模型\n*   动态更改页面内容\n\n还有一个关键特性：可以随时对 Web 页面进行更改！在页面加载之前、加载期间以及加载之后，当用户按下键、点击鼠标、移动鼠标，或者当在\
  \ 6 月 12 日，当在午夜、正午，或者仅当访问者拥有红色桌面时（是的，我是认真的！）！任何时候都行。完全控制！\n\n带着这种强大的力量，让我们来看看它是如何工作的吧！\n\
  \n## 访问页面元素\n\n在 Internet Explorer 3.0 和 Netscape Navigator 3.0 时代（不，并没有听起来那么久远！），Web\
  \ 开发者已经可以使用脚本访问 Web 页面上的某些元素。这些被选中的元素是如 `<a>`（锚点标签）、`<applet>`（applet 标签）和 `<form>`（定义表单）之类的元素。\n\
  \n注意\n\n回想起来，那些聪明的 Web 开发者竟然利用这些有限的能力实现了这些，真是令人惊叹！即使在那时，Web 上已经有很多优秀的内容了！\n\n然而，操作上确实存在限制。例如，即使你想访问一个标题，你也做不到。\n\
  \n现在不再了。有了 DOM，情况已不同。Web 页面上的每一个元素现在都是可以访问的。文档有一个名为 `all` 的集合。该集合包含了页面上的所有元素，你可以通过\
  \ `name` 和 `id` 属性对该集合进行索引。\n\n### 访问页面元素的简单示例\n\n以下是一个示例。想检查你的页面是否包含 `<h1>` 吗？简单。这里有一个带有\
  \ `<h1>` 元素的简单页面：\n\n```\n|ÓDOM|accessing page elements\n```\n\n```\n|Ópage elements|accessing\
  \ (DOM)\n```\n\n```\n|Óaccessing|page elements (DOM)\n```\n\n```\n|ÓWeb pages|elements|accessing\
  \ (DOM)\n```\n\n```\n|Óexamples|accessing page elements (DOM)\n```\n\n```html\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n<h1 id=\"head1\">Heading One</h1>\n</body>\n</</html>\n```\n\n你可以使用 `document.all`\
  \ 集合来检测该元素的存在：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction findhead1()\n{\n\
  var detectElement;\ndetectElement = document.all(\"head1\");\nif (detectElement\
  \ == head1)\n{\nalert(\"Element \\ 'head1\\ ' exists\");\n}\n}\n\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body onload=\"findhead1()\">\n<h1 id=\"head1\">Heading\
  \ One</h1>\n</body>\n</</html>\n```\n\n将此页面加载到浏览器后，你将面对图 14.1 所示的警告框。\n\n##### 图\
  \ 14.1 确认标题存在。\n\n![](img/0789724995_ch14lev1sec3_image01.gif)\n\n![](img/0789724995_ch14lev1sec3_image02.gif)\n\
  \n你可以基于此示例进行扩展，让 JavaScript 将页面上的所有元素都返回给你：\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  function findhead1()\n{\nvar tag, tags;\ntags = \"The tags in the page are:\"\n\
  for(i = 0; i < document.all.length; i++)\n{\ntag = document.all(i).tagName;\ntags\
  \ = tags + \"\\ r\" + tag;\n}\nalert(tags);\n}\n// Cloaking device off -->\n</script>\n\
  </head>\n<body onload=\"findhead1()\">\n<h1>Heading One</h1>\n</body>\n</</html>\n\
  ```\n\n让我们逐步分析一下这段脚本的作用。\n\n```javascript\n var tag, tags;\n```\n\n脚本的第一行声明了你在此处将使用的变量。\n\
  \n```javascript\n tags = \"The tags in the page are:\"\n```\n\n接下来这一行给变量 `tags`\
  \ 分配了一个值。这样做是为了避免脚本后期出现问题。\n\n```javascript\n for(i = 0; i < document.all.length;\
  \ i++)\n{\ntag = document.all(i).tagName;\ntags = tags + \"\\ r\" + tag;\n}\n```\n\
  \n脚本的下一部分是 `for` 循环。第一行通过 `all` 属性遍历页面上的所有元素，从 `0` 开始，到 `document.all.length` 结束。每次使用\
  \ `tagName` 属性获取标签并存储在 `tags` 变量中。然后，使用回车符（`\\ r`）和 `tag` 更新 `tags` 变量。最后，通过 `alert(tags)`\
  \ 显示结果。\n\n\n\n\n关于 `window.status` 对象的更多信息，请参阅第 15 章，“示例、示例、示例！”\n\n## 添加 `id`\n\
  \n通过稍小的修改，可以使此示例为显示特定标签的 `id`（参见图 14.5）。要获取此信息，您可以使用 `window.event.srcElement.id`：\n\
  \n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- 开启遮装设备！\nfunction tagInfo()\n{\nvar tag;\ntag = \"Element name: \" + window.event.srcElement.tagName\
  \ + \" ID: \" +\nwindow.event.srcElement.id;\nwindow.status = tag;\n}\n// 关闭遮装设备\
  \ -->\n</script>\n<head>\n<body onMouseover=\"tagInfo()\" id=\"body1\">\n<h1 id=\"\
  head1\">Heading One</h1>\n<p id=\"para1\">Some text</p>\n<h2 id=\"head2\">Another\
  \ heading</h2>\n<p id=\"para2\">More text and some <b id=\"bold1\">bold</b> text</p>\n\
  <h3 id=\"head3\">Another heading</h3>\n<p id=\"para3\">More text and some <i id=\"\
  italics1\">italics</i> text</p>\n</body>\n</html>\n```\n\n### 图 14.5 浏览器状态栏中显示的标签名称和\
  \ `id`。\n\n![](img/0789724995_ch14lev1sec3_image10.gif)\n\n![](img/0789724995_ch14lev1sec3_image1.gif)\n\
  \n## 父元素和子元素\n\n进一步的增强（还有什么做什么？）是可以找到元素的父元素。父元素是嵌套元素的元素；嵌套元素被称为子元素。\n\n以下是一个 JavaScript\
  \ 示例，用于显示页面上任何元素的父元素（参见图 14.6）：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- 开启遮装设备！\nfunction tagInfo()\n{\nvar tag;\n\
  tag = \"Element name: \" + window.event.srcElement.tagName + \" ID: \" +\nwindow.event.srcElement.id\
  \ + \" Parent: \" + window.event.srcElement.parentElement.tagName;\nwindow.status\
  \ = tag;\n}\n// 关闭遮装设备 -->\n</script>\n<head>\n<body onMouseover=\"tagInfo()\" id=\"\
  body1\">\n<h1 id=\"head1\">Heading One</h1>\n<p id=\"para1\">Some text</p>\n<h2\
  \ id=\"head2\">Another heading</h2>\n<p id=\"para2\">More text and some <b id=\"\
  bold1\">bold</b> text</p>\n<h3 id=\"head3\">Another heading</h3>\n<p id=\"para3\"\
  >More text and some <i id=\"italics1\">italics</i> text</p>\n</body>\n</html>\n\
  ```\n\n### 图 14.6 浏览器状态栏中显示的标签名称、`id` 和父元素。。\n\n![](img/0789724995_ch14lev1sec3_image13.gif)\n\
  \n![](img/0789724995_ch14lev1sec3_image14.gif)\n\n以下示例当父元素为 `p` 标签且鼠标移动到其上方时，为所有加粗标签添加下划线（参见图\
  \ 14.7）。父元素为 `h2` 的 `b` 标签不受影响（参见图 14.8）。这里是该示例：\n\n```\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- 开启遮装设备！\nfunction\
  \ checkBold()\n{\nvar thistag, parentTag;\nthistag = window.event.srcElement.tagName;\n\
  parentTag = window.event.srcElement.parentElement.tagName;\nif (thistag == \"B\"\
  \ && parentTag == \"P\")\n{\nwindow.event.srcElement.style.textDecoration = \"underline\"\
  ;\n}\n\nfunction checkBoldOff()\n{\nvar thistag, parentTag;\nthistag = window.event.srcElement.tagName;\n\
  parentTag = window.event.srcElement.parentElement.tagName;\nif (thistag == \"B\"\
  \ && parentTag == \"P\")\n{\nwindow.event.srcElement.style.textDecoration = \"none\"\
  ;\n}\n// 关闭遮装设备 -->\n</script>\n<head>\n<body onMouseover=\"checkBold()\" onMouseout=\"\
  checkBoldOff()\" id=\"body1\">\n<h1 id=\"head1\">Heading One</h1>\n<p id=\"para1\"\
  >Some text</p>\n<h2 id=\"head2\">Another heading</h2>\n<p id=\"para2\">More text\
  \ and some <b id=\"bold1\">bold</b> text</p>\n<h3 id=\"head3\">Another heading</h3>\n\
  <p id=\"para3\">More text and some <i id=\"italics1\">italics</i> text</p>\n<h2><b>All\
  \ bold!</b></h2>\n</body>\n</html>\n```\n\n### 图 14.7 父元素为 `p` 标签且鼠标移动到其上方时 `b`\
  \ 标签带有下划线。\n\n![](img/0789724995_ch14lev1sec3_image15.gif)\n\n![](img/0789724995_ch14lev1sec3_image16.gif)\n\
  \n### 图 14.8 没有 `p` 元素的 `b` 标签\n\n![](img/0789724995_ch14lev1sec3_image17.gif)\n\
  \n![](img/0789724995_ch14lev1sec3_image18.gif)\n\n此脚本也是复杂的，因为它有一个用于在鼠标移出时移除下划线的第二个函数。**警告**：使用小写字母会导致脚本失败。\n\
  \n## 展开-折叠文本\n\n这种非常有用的方法是根据需要显示或隐藏文本量。要实现这一点，您需要使用 `display` 属性。该属性具有两个值：`none`（隐藏）和\
  \ `block`（显示）。这里是该方法的代码，如第 14.9 章所示：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- 开启遮装设备！\nfunction clickEvent()\n{\nvar thistag,\
  \ parentTag;\nthistag = window.event.srcElement.tagName;\nparentTag = window.event.srcElement.parentElement.tagName;\n\
  if (thistag == \"H\" && parentTag == \"BODY\")\n{\nif(document.all(window.event.srcElement.id\
  \ + \"p\").style. display == \"none\")\n{\ndocument.all(window.event.srcElement.id\
  \ + \"p\").style.display = \"\";\n}\nelse\n{\ndocument.all(window.event.srcElement.id\
  \ + \"p\").style.display = \"none\";\n}\n}\n}\n// 关闭遮装设备 -->\n</script>\n<head>\n\
  <body onclick=\"clickEvent()\">\n<h1 id=\"head1\">Heading One</h1>\n<p id=\"para1\"\
  \ style=\"display:none\">Lots of interesting text goes here...</p>\n<h1 id=\"head2\"\
  >Heading Two</h1>\n<p id=\"para2\" style=\"display:none\">Lots of interesting text\
  \ goes here...</p>\n<h1 id=\"head3\">Heading Three</h1>\n<p id=\"para3\" style=\"\
  display:none\">Lots of interesting text goes here...</p>\n</body>\n</html>\n```\n\
  \n### 图 14.9 页面初始状态。\n\n![](img/0789724995_ch14lev1sec3_image28.gif)\n\n![](img/0789724995_ch14lev1sec3_image29.gif)\n\
  \n### 图 14.10 点击标题显示文本。\n\n![](img/0789724995_ch14lev1sec3_image30.gif)\n\n![](img/0789724995_ch14lev1sec3_image31.gif)\n\
  \n\n\n\n第一个语句是条件，如果该条件为真（即 `id` 为 `window.event.srcElement.id + \"p\"` 的元素的 `id`\
  \ 默认值为 `\"none\"`），则将源元素的 `id` 与字母 `p` 拼接，就会生成标题下方段落的 `id`。（在创建这种效果时，你必须对你所使用的 `id`\
  \ 进行深思考虑。不过，一旦你有了一个示例，你就可以一直修改它，直到你有足够的信心从头开始创建它。）页面上的文本起初是隐藏的，然后通过下一条语句使其显示。如果条件为假（即文本未隐藏），则它对用户是隐藏的。这就是通过对标题第二次点击让文本消失的方法。\n\
  \n## 表格单元格示例\n\n有时，在用户执行操作时给他们提供一点反馈是有帮助的。这里有一个值得记住的简便示例，特别是当你使用大量表格时。它会将鼠标指针所在单元格的颜色更改为另一种颜色，这在阅读大型表格时非常有帮助。\n\
  \n以下示例使用了 `sourceIndex` 属性，它允许你在多个元素中间精确定位单个元素，而无需为页面上的每一个元素分配 `id`。同样，从 JavaScript\
  \ 的角度来看，该脚本只是对你已经看到的内容的修改。这些脚本演示了访问文档对象模型（DOM）是多么快速和简单。此示例的结果如图 14.11 所示：\n\n```\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction chgColor()\n{\nvar thistag, parentTag;\nthistag\
  \ = window.event.srcElement.tagName;\nif (thistag == \"TD\")\n{\ndocument.all(window.event.srcElement.sourceIndex).bgColor\
  \ = \"lemonchiffon\"\n}\n}\n\nfunction chgBack()\n{\nvar thistag, parentTag;\nthistag\
  \ = window.event.srcElement.tagName;\nif (thistag == \"TD\")\n{\ndocument.all(window.event.srcElement.sourceIndex).bgColor\
  \ = \"\"\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onMouseover=\"\
  chgColor()\" onMouseout=\"chgBack()\">\n<table border=\"1\" width=\"28%\">\n<tr>\n\
  <td width=\"25%\">&nbsp;</td>\n<td width=\"25%\">&nbsp;</td>\n<td width=\"25%\"\
  >&nbsp;</td>\n<td width=\"25%\">&nbsp;</td>\n</tr>\n<tr>\n<td width=\"25%\">&nbsp;</td>\n\
  <td width=\"25%\">&nbsp;</td>\n<td width=\"25%\">&nbsp;</td>\n<td width=\"25%\"\
  >&nbsp;</td>\n</tr>\n<tr>\n<td width=\"25%\">&nbsp;</td>\n<td width=\"25%\">&nbsp;</td>\n\
  <td width=\"25%\">&nbsp;</td>\n<td width=\"25%\">&nbsp;</td>\n</tr>\n</table>\n\
  </body>\n</</html>\n```\n\n### 图 14.11. 鼠标移动过单元格时，单元格颜色会改变。\n\n![](img/0789724995_ch14lev1sec3_image32.gif)\n\
  \n![](img/0789724995_ch14lev1sec3_image33.gif)\n\n#### 注意\n所有这些效果的发生完全不需要浏览器与服务器进行通信。即使在用户离线时它们也能工作。\n\
  \n## 事件模型\n\n事件模型支持全范围的用户事件。这些事件是用户通过鼠标、键盘、焦点和其他特殊事件可以产生的。\n\n接下来的章节将讨论 Internet\
  \ Explorer 5.5 支持的一些事件。\n\n### onClick 事件\n\n当用户在文档中点击鼠标左键时，触发此事件。\n\n### onContextmenu\
  \ 事件\n\n当用户在文档区域点击鼠标右键以打开上下文菜单时，触发此事件。使用此事件允许你在上下文菜单弹出之前运行脚本，或者完全禁用它（请参见图 14.12）。你可以通过使用\
  \ `event.returnValue` 属性并将其设置为 `false` 来取消事件。这会导致本应发生的默认事件丢失。这是一个示例：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nfunction menu()\n{\nalert(\"No context menu here!\");\nevent.returnValue\
  \ = false;\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onContextmenu=\"\
  menu()\">\n\n</body>\n</</html>\n```\n\n### 图 14.12. 标准的右键上下文菜单被禁用。\n\n![](img/0789724995_ch14lev1sec4_image31.gif)\n\
  \n#### 注意\n所有这些效果的发生完全不需要浏览器与服务器进行通信。即使在用户离线时它们也能工作。\n\n### onblclick 事件\n\n![](img/0789724995_ch14lev1sec3_image32.gif)\
  \ 当用户双击时，触发此事件。\n\n### onHelp 事件\n\n事件模型支持全范围的用户事件。这些事件是用户通过鼠标、键盘、焦点和其他特殊事件可以产生的。\n\
  \n下面的示例展示了如何使用它：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction menu()\n{\nalert(\"\
  No context menu here!\");\nevent.returnValue = false;\n}\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body onContextmenu=\"menu()\">\n\n</body>\n</</html>\n\
  ```\n\n### 图 14.11. 鼠标移动过单元格时，单元格颜色会改变。\n\n![](img/0789724995_ch14lev1sec3_image32.gif)\n\
  \n![](img/0789724995_ch14lev1sec3_image33.gif)\n\n#### 注意\n所有这些效果的发生完全不需要浏览器与服务器进行通信。即使在用户离线时它们也能工作。\n\
  \n### onkeydown 事件\n\n当用户按下按键时，触发此事件。\n\n### onKeypress 事件\n\n当用户按下字母数字键时，触发此事件。它与\
  \ `onkeydown` 的不同在于，此事件在按键完全按下时才被触发（而不是在按下过程中）。\n\n### onKeyup 事件\n\n此键盘事件在用户释放按键时也会触发。它是在按键从\
  \ `onkeydown` 位置释放时触发的。\n\n\n\n当用户用任何一个鼠标按钮点击文档时，会触发此事件。\n\n此示例使用 `event.x` 和 `event.y`\
  \ 来查找事件在页面上的位置，并将此信息输出到状态栏。图 14.15 显示了结果：\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  function clicked()\n{\nwindow.status = \"You clicked at the coordinates: X = \"\
  \ + event.x + \" Y = \" + event.y\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body onmousedown=\"clicked()\">\n\n</body>\n</html>\n```\n\n##### 图 14.15. 状态栏显示点击位置。\n\
  \n![](img/0789724995_ch14lev1sec4_image08.gif)\n\n![](img/0789724995_ch14lev1sec4_image09.gif)\n\
  \n### `onMousemove` 事件\n\n这是另一个鼠标事件，当用户在文档上移动鼠标时会触发。此示例会全程跟踪用户的鼠标指针，文本也会对其进行跟踪。结果请参见图\
  \ 14.16\n\n\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction moved()\n{\nwindow.status = \"\
  Current mouse coordinates: X = \" + event.x + \" Y = \" + event.y\nfollower.style.pixelTop\
  \ = event.y\nfollower.style.pixelLeft = event.x\n}\n// Cloaking device off -->\n\
  </script>\n</head>\n<body onmousemove=\"moved()\">\n<p id=\"follower\" style=\"\
  position:absolute\">Squeak!</p>\n</body>\n</html>\n```\n\n##### 图 14.16. 状态栏显示鼠标指针的位置。\n\
  \n![](img/0789724995_ch14lev1sec4_image10.gif)\n\n![](img/0789724995_ch14lev1sec4_image11.gif)\n\
  \n#### `onMouseout` 事件\n\n当用户将鼠标指针移出文档边界时，会触发此鼠标事件。这包括移动到另一个元素。\n\n在示例中，当鼠标移动文档外部时，会显示消息。当指针快速向文本移动时，也会显示相同的消息。这是因为用户移动指针的速度可能比文本移动的速度快，因此实际上是移动到了另一个元素并触发了事件。以下是示例：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction moved()\n{\nwindow.status = \"Current mouse\
  \ coordinates: X = \" + event.x + \" Y = \" + event.y\nfollower.style.pixelTop =\
  \ event.y\nfollower.style.pixelLeft = event.x\n}\n\nfunction outofbounds()\n{\n\
  alert(\"Hey, come back!I can't follow you!\");\n}\n// Cloaking device off -->\n\
  </script>\n<body onmousemove=\"moved()\" onmouseout=\"outofbounds()\">\n<p id=\"\
  follower\" style=\"position:absolute\">Squeak!</p>\n</body>\n</html>\n```\n\n####\
  \ `onMouseover` 事件\n\n当用户将鼠标指针移入文档时，此鼠标事件做出响应。\n\n### `onMouseup` 事件\n\n当用户在鼠标位于文档上方释放鼠标按钮时，触发\
  \ `onMouseup` 事件。它是 `onClick` 事件之后发生的事件。\n\n### `Stop` 事件\n\n这是你将看到的最后一个事件。当用户点击浏览器中的停止按钮或离开\
  \ Web 页面到另一个页面时，会触发此事件：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction stopped()\n\
  {\nalert(\"Hey, don't go\")\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body onstop=\"stopped()\">\n\n</body>\n</html>\n```\n\n提示：此示例可能是 `Stop` 事件最不烦人的用法之一。在\
  \ Web 页面上，不要用它来将访问者困在你的网站或触发大量加载——这些行为会让用户感到反感！此事件的一个良好用途是在内网页面上（可能为了让自助终端保持开启），或者你正在开发某种在线游戏的东西（提醒访问者离开将影响他们的分数之类的）。\n\
  \n### JavaScript\n\n本章并没有声称是对文档对象模型（DOM）的全面涵盖；仅仅为了一个浏览器，那将是一本非常厚的书！计划是通过提供示例来让你了解你可以做的事情，并让你遵循这些示例以获得关于它们如何实现的概念。这些示例可以很容易地修改并应用于你的\
  \ Web 网站以实现某些功能。\n\n如前所述，浏览器在不断变化，关于它们最好的信息来源是它们本身。\n\n\n\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nfunction gettime() {\nvar date= new Date();\nvar hr = date.getHours();\n\
  var m = date.getMinutes();\nvar s = date.getSeconds();\nvar ampm = \"AM\";\nif (hr\
  \ > 11)\n{\nampm = \"PM\"\n}\nif (hr > 12)\n{\nhr -= 12\n}\nif(m < 10)\n{\nm = \"\
  0\" + m\n}\nif(s < 10)\n{\ns = \"0\" + s\n}\ndocument.clockform.clock.value = hr\
  \ + \":\" + m + \":\" + s + \" \" +ampm;\nsetTimeout(\"gettime()\",100)\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body onload=\"gettime()\">\n<form name=\"\
  clockform\">\n<input type=\"text\" name=\"clock\">\n</form>\n</body></html>\n```\n\
  ##### 图 15.2. 网页上的时钟。\n\n![](img/0789724995_ch15lev1sec2_image01.gif)\n\n#### 修改\n\
  \n如果你删掉部分代码（对 `AM` 和 `PM` 的引用，以及当小时大于 12 时将小时减去 12 的 `if` 语句），时钟就变成了军事时间（或 24 小时制）（参见图\
  \ 15.3）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction gettime() {\nvar date= new Date();\n\
  var hr = date.getHours();\nvar m = date.getMinutes();\nvar s = date.getSeconds();\n\
  if(m < 10)\n{\nm = \"0\" + m\n}\nif(s < 10)\n{\ns = \"0\" + s\n}\ndocument.clockform.clock.value\
  \ = hr + \":\" + m + \":\" + s;\nsetTimeout(\"gettime()\",100)\n}\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body onload=\"gettime()\">\n<form name=\"clockform\"\
  >\n<input type=\"text\" name=\"clock\">\n</form>\n</body>\n</html>\n```\n##### 图\
  \ 15.3. 网页上显示军事时间的时钟。\n\n![](img/0789724995_ch15lev1sec2_image02.gif)\n\n![](img/0789724995_ch15lev1sec2_image03.gif)\n\
  \n### 示例 3—简单倒计时计数器\n\n如果你想在页面上设置一个计数器，这个脚本非常实用。计数器可以用于许多场景，例如如果你有一个定期更新图像的摄像头，计数器可以显示页面或图像何时可能刷新。实际的页面更改可以通过\
  \ meta 标签刷新器（出现在 `title` 标签之后）来实现。\n\n这是一个简单的示例，其结果如图 15.4 所示：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<meta http-equiv=\"refresh\" content=\"30\"\
  >\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x=30;\nvar y=1;\n\
  function startClock(){\nx=x-y;\ndocument.form1.clock.value = x;\ntimerID=setTimeout(\"\
  startClock()\", 1000);\n}\n// Cloaking device off -->\n</script>\n</head>\n<body\
  \ onload=\"startClock()\">\n<form name=\"form1\">\n<input type=\"text\" name=\"\
  clock\">\n</form>\n</body>\n</html>\n```\n##### 图 15.4. 中的倒计时。\n\n![](img/0789724995_ch15lev1sec3_image01.gif)\n\
  \n![](img/0789724995_ch15lev1sec3_image02.gif)\n\n#### 修改\n\n你可以对这个计数器进行一些修改。你可以更改计数器的起始点（通过更改变量\
  \ `x` 的值），或者更改间隔（通过更改变量 `y` 的值）。\n\n### 示例 4—简单表单验证\n\n如果你在网站上有任何种类型的表单，你可能希望减少收到的垃圾信息或不准确信息。实现这一点最快的方法之一是使用脚本来验证发送给你的信息。\n\
  \n这是一个简单的示例，用于验证一个预期接收文本的输入框。如果它是空的，它将拒绝提交表单并告诉用户输入文本（参见图 15.5）：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nfunction sendMe()\n{\nreturn confirm(\"Do you want to continue?\"\
  );\n}\n\nfunction chkForm()\n{\nif (form1.inp1.value == \"\")\n{\nalert(\"Please\
  \ fill in the text box\");\nform1.inp1.focus();\nreturn false;\n}\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n<form name=\"form1\" method=\"POST\"\
  \ action=\"someCGI.cgi\" onSubmit=\"return sendMe()\">\n<p><input type=\"text\"\
  \ name=\"inp1\">\n<input type=\"submit\" value=\"Submit\" onClick=\"return chkForm()\"\
  >\n<input type=\"reset\" value=\"Reset\"></p>\n</form>\n</body>\n</html>\n```\n\
  ##### 图 15.5. 如果不在输入框中输入文字，则会显示警告框。\n\n![](img/0789724995_ch15lev1sec4_image01.gif)\n\
  \n![](img/0789724995_ch15lev1sec4_image02.gif)\n\n使用 `form1.inp1.value == \"\"`\
  \ 检查输入是否为空，并使用 `form1.inp1.focus()` 设置光标。\n\n#### 修改\n\n可以进行许多修改，但它们实际上都围绕同一个主题。你可以在不同的图像上添加更多悬停效果，将图像放大、缩小等等。\n\
  \n### 示例 5—悬停效果 (Rollovers)\n\n悬停是一种当用户鼠标指针移动到图像上时用一个图像替换另一个的效果。这通常用于带有链接的图像，但并不限于悬停效果。以下是一个示例：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nif (document.images)\n{\nimg1 = new Image;\nimg2 =\
  \ new Image;\nimg1.src = \"img1.gif\";\nimg2.src = \"img2.gif\";\n}\nelse\n{\nimg1\
  \ = \"\";\nimg2 = \"\";\ndocument.imgSwap = \"\";\n}\n// Cloaking device off -->\n\
  </script>\n</head>\n<body>\n<a href=\"moveon.htm\" onMouseover=\"document.imgSwap.src\
  \ = img2.src\" onMouseout=\"document.imgSwap.src = img1.src\">\n<img src=\"img1.gif\"\
  \ name=\"imgSwap\" border=\"0\">\n</a>\n</body>\n</html>\n```\n`if` 语句的作用是排除不理解\
  \ `document.images` 但可能理解 JavaScript 的浏览器。这种单一策略防止任何不符合 JavaScript 1.1 标准的浏览器使用该脚本——在这种情况下该脚本将无法工作。图\
  \ 15.7 显示了悬停效果。\n\n如果你删掉部分代码（对 `AM` 和 `PM` 的`ampm = \"PM\"` 以及当小时大于 12 时将小时减去 12\
  \ 的 `if` 语句），时钟就变成了军事时间（或 24 小时制）（参见图 15.3）：\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  function gettime() {\nvar date= new Date();\nvar hr = date.getHours();\nvar m =\
  \ date.getMinutes();\nvar s = date.getSeconds();\nif(m < 10)\n{\nm = \"0\" + m\n\
  }\nif(s < 10)\n{\ns = \"0\" + s\n}\ndocument.clockform.clock.value = hr + \":\"\
  \ + m + \":\" + s;\nsetTimeout(\"gettime()\",100)\n}\n// Cloaking device off -->\n\
  </script>\n</head>\n<body onload=\"gettime()\">\n<form name=\"clockform\">\n<input\
  \ type=\"text\" name=\"clock\">\n</form>\n</body\n</html>\n```\n##### 图 15.3. 网页上显示军事时间的时钟。\n\
  \n![](img/0789724995_ch15lev1sec2_image02.gif)\n\n![](img/0789724995_ch15lev1sec2_image03.gif)\n\
  \n### 示例 3—简单倒计时计数器\n\n如果你想在页面上设置一个计数器，这个脚本非常实用。计数器可以用于许多场景，例如如果你有一个定期更新图像的摄像头，计数器可以显示页面或图像何时可能刷新。实际的页面更改可以通过\
  \ meta 标签刷新器（出现在 `title` 标签之后）来实现。\n\n这是一个简单的示例，其结果如图 15.4 所示：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<meta http-equiv=\"refresh\" content=\"30\"\
  >\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x=30;\nvar y=1;\n\
  function startClock(){\nx=x-y;\ndocument.form1.clock.value = x;\ntimerID=setTimeout(\"\
  startClock()\", 1000);\n}\n// Cloaking device off -->\n</script>\n</head>\n<body\
  \ onload=\"startClock()\">\n<form name=\"form1\">\n<input type=\"text\" name=\"\
  clock\">\n</form>\n</body>\n</html>\n```\n##### 图 15.4. 中的倒计时。\n\n![](img/0789724995_ch15lev1sec3_image01.gif)\n\
  \n![](img/0789724995_ch15lev1sec3_image02.gif)\n\n#### 修改\n\n你可以对这个计数器进行一些修改。你可以更改计数器的起始点（通过更改变量\
  \ `x` 的值），或者更改间隔（通过更改变量 `y` 的值）。\n\n### 示例 4—简单表单验证\n\n如果你在网站上有任何种类型的表单，你可能希望减少收到的垃圾信息或不准确信息。实现这一点最快的方法之一是使用脚本来验证发送给你的信息。\n\
  \n这是一个简单的示例，用于验证一个预期接收文本的输入框。如果它是空的，它将拒绝提交表单并告诉用户输入文本（参见图 15.5）：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nfunction sendMe()\n{\nreturn confirm(\"Do you want to continue?\"\
  );\n}\n\nfunction chkForm()\n{\nif (form1.inp1.value == \"\")\n{\nalert(\"Please\
  \ fill in the text box\");\nform1.inp1.focus();\nreturn false;\n}\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n<form name=\"form1\" method=\"POST\"\
  \ action=\"someCGI.cgi\" onSubmit=\"return sendMe()\">\n<p><input type=\"text\"\
  \ name=\"inp1\">\n<input type=\"submit\" value=\"Submit\" onClick=\"return chkForm()\"\
  >\n<input type=\"reset\" value=\"Reset\"></p>\n</form>\n</body>\n</html>\n```\n\
  ##### 图 15.5. 如果不在输入框中输入文字，则会显示警告框。\n\n![](img/0789724995_ch15lev1sec4_image01.gif)\n\
  \n![](img/0789724995_ch15lev1sec4_image02.gif)\n\n使用 `form1.inp1.value == \"\"`\
  \ 检查输入是否为空，并使用 `form1.inp1.focus()` 设置光标。\n\n\n\n\n\n另一种常见的 JavaScript 驱动效果是浏览器状态栏中的滚动消息。这是向访问者传递少量信息的极佳方法，无需使用警框框（alert\
  \ boxes）。尽管状态栏很小且不显眼，但它仍然非常有效。\n\n这是一个简单的示例，当用户将鼠标悬停在图像超链接上时，会在状态栏中显示少量信息：\n\n```html\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction addMsg()\n{\nwindow.status=\"Sample image\"\
  ;\nreturn true;\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<a href=\"\
  moveon.htm\" onMouseover=\"window.status='Sample image'; return true\"\n onMouseout=\"\
  window.status='';return true\">\n<img src=\"img1.gif\" border=\"0\">\n</a>\n</body>\n\
  </html>\n```\n\n将鼠标指针移动到图像或超链接上，消息就会显示在浏览器的状态栏中（参见图 15.8）。\n\n##### 图 15.8。状态栏中的测试消息。\n\
  \n![](img/0789724995_ch15lev1sec6_image02.gif)\n\n**注意**\n\n代码中需要 `return true`\
  \ 才能使其工作。\n\n### 修改\n\n状态栏消息最流行的修改之一是升级 JavaScript，以便你获得滚动消息而不是静态消息。这里有一个示例（在图 15.9\n\
  {\nwindow.status = msg;\nmsg = msg.substring(1,msg.length) + msg.substring(0,1);\n\
  setTimeout(\"scrollMsg()\",150);\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body onload=\"scrollMsg()\">\n\n</body>\n</html>\n```\n\n##### 图 15.9。滚动的状态栏消息。\n\
  \n![](img/0789724995_ch15lev1sec6_image03.gif)\n\n![](img/0789724995_ch15lev1sec6_image04.gif)\n\
  \n此 JavaScript 的控制部分是语句：\n\n```javascript\nmsg = msg.substring(1,msg.length) + msg.substring(0,1)\n\
  ```\n\n这些语句中的第一个是脚本中实际对存储在变量 `msg` 中的初始消息进行切分的部分。等号右侧语句的部分代表原始消息。左侧是切割后的版本，在脚本的每次运行时，它会获取显示的消息的第一个字符并将其放在末尾——从而产生消息正在滚动的错觉。事实上，发生的一切只是字符串正在被重新排列——第一个字符被移动到了末尾。\n\
  \n所以让我们来拆解一下：\n\n* `msg`——这是当前的字符串。\n* `msg.substring(1, msg.length)`——这是除第一个字符以外的整个字符串（因为编号从\
  \ 0 开始）。\n* `msg.substring(0, 1)`——这是第一个字符，它被从前面取出并胶到 `msg.substring(1, msg.length)`\
  \ 所代表的部分的末尾。\n\n因此，在脚本的每次运行中（由下一行出现的 `setTimeout(\"showMsg()\",150)` 语句控制），这个过程都会重复——字符串开头的字母被移动到末尾。脚本每隔\
  \ 150 毫秒运行一次。这是一个任意值，你可以根据需要自由更改。\n\n### 更多修改\n\n让滚动文本一直在那里可能会让某些用户反感，所以为什么不让它只运行一次呢？要做到这一点，记录你执行“前字符到后字符”交换的次数，并在完成所有交换后停止。这个示例有\
  \ 39 个字符，所以当你从 0 运行到 38 后，该停止了：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar counter = 0\nvar\
  \ msg = \"Thanks for visiting our Web site! ... \";\nfunction scrollMsg()\n{\nif\
  \ (counter < 38)\n{\nwindow.status = msg;\nmsg = msg.substring(1,msg.length) + msg.substring(0,1);\n\
  setTimeout(\"scrollMsg()\",150);\ncounter += 1\n}\nelse\n{\nwindow.status = \"\"\
  ;\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onload=\"scrollMsg()\"\
  >\n\n</body>\n</html>\n```\n\n**提示**\n\n不要让滚动文本一直在那里。\n\n\n\n\n函数的第一个语句读取输入框的内容，第二行创建了\
  \ cookie。该 cookie 由两部分组成。第一部分（`\"name=\" + username`）获取 `username` 的值，并将其与一个选定的伪变量（实际上不是真正的变量，更像是分配给数据的名称）拼接起来作为值（这里选择了\
  \ `name`）。确保你没有在你创建的字符串中输入无意的空格；否则，结果将不符合预期。第二部分（`\";expires=\" + expireAt.toGMTString()`）设置了\
  \ cookie 的过期时间（换句话说，就是它停止工作的时间）。这是从创建时间起三个月后的日期。此时间格式需要是 GMT 格式，因此使用了 `expireAt.toGMTString()`\
  \ 方法。\n\n此页面的最后一步工作是在超链接上使用 `onclick` 事件来触发函数 `makeCookie()`：\n\n```html\n <html>\n\
  <head>\n<title>Page 1</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nexpireAt = new Date;\nexpireAt.setMonth(expireAt.getMonth() + 3);\nusername\
  \ = \"\";\n\nfunction makeCookie()\n{\nusername = document.form1.user1.value\ndocument.cookie\
  \ = \"name=\" + username + \";expires=\" + expireAt.toGMTString()\n}\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body\n<form name=\"form1\">\n<p>Username:\
  \ <input type=\"text\" name=\"user1\"><br>\n<a href=\"page2.htm\" onclick=\"makeCookie()\"\
  >continue ...</a></p>\n</form>\n</body>\n</</html>\n```\n\n这个页面现在已经完成了。现在需要的是创建一个第二个页面（名为\
  \ `page2.htm`）来读取 cookie。这里是实现该功能的页面：\n\n```html\n <html>\n<head>\n<title>Page 2</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction fillIn()\n\
  {\nif (document.cookie != \"\")\n{\ncookieCrumb = document.cookie.split(\"=\")[1];\n\
  document.form1.read1.value = cookieCrumb;\n}\nelse\n{\ndocument.form1.read1.value\
  \ = \"Cookie empty!\";\n}\n}\n// Cloaking device off -->\n</script>\n</head>\n<body\
  \ onload=\"fillIn()\">\n<form name=\"form1\">\n<p>The username you entered was:\
  \ <input type=\"text\" name=\"read1\"></p>\n</form>\n</body>\n</</html>\n```\n\n\
  此函数 `fillIn()` 在页面加载时由 `onload` 事件运行。`if` 语句首先检查 cookie 是否为空（即对于该页面而言该 cookie）。如果\
  \ cookie 不存在，则输入框将填充字符串 `Cookie Empty`。如果它存在，则下一条语句会在 `=` 符号处拆分 cookie 字符串，第二部分（通过结尾的\
  \ `[1]` 定义，因为第一部分将是 `[0]`）被赋值给变量 `cookieCrumb`。最后，这个碎片被传递到输入框中显示。\n\n在保存了两个页面后，你可以尝试这个示例。打开第一个页面并在输入框中输入某些内容（参见\
  \ 图 15.10）。\n\n##### 图 15.10。在输入框中输入一些文本。\n\n![](img/0789724995_ch15lev1sec7_image01.gif)\n\
  \n![](img/0789724995_ch15lev1sec7_image02.gif)\n\n然后，点击页面底部的超链接加载第二个页面，cookie 的内容将显示在输入框中（参见\
  \ 图 15.11）。\n\n##### 图 15.11。cookie 的内容被放在第二个页面的输入框中。\n\n![](img/0789724995_ch15lev1sec7_image03.gif)\n\
  \n![](img/0789724995_ch15lev1sec7_image04.gif)\n\n### 修改\n\n你可以 cookie 做很多事情。你可以在\
  \ cookie 中保存几乎任何类型的小数据（即使是像 CSS 属性值这样的内容），因此它们的范围非常广泛。你可能在某个时刻想要对 cookie 执行的操作是给用户提供删除它们的方法。删除\
  \ cookie（或者有时称为使其失效）是一个简单的过程，将 cookie 的过期日期更改为已过去的日期。\n\n这里有一个函数通过将其过期日期更改为当前系统日期前一个月来删除你创建的\
  \ cookie：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nexpireAt = new Date;\nexpireAt.setMonth(expireAt.getMonth()\
  \ - 1);\n\nif (document.cookie != \"\")\n{\nif (confirm(\"Are you sure you want\
  \ to delete the cookies from this site?\"));\n{\ncrumbs = document.cookie.split(\"\
  ; \");\nfor(i=0; i < crumbs.length; i++)\n{\ncrumbName = crumbs[i].split(\"=\")[0];\n\
  document.cookie = crumbName + \"=;expires=\" + expireAt.toGMTString();\n}\n}\n}\n\
  // Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\
  \n这实际上是删除 cookie 的非常好的方法，因为它给了用户改变主意的机会（参见 图 15.12）。此外，它还允许你通过使用 `length` 遍历站点记录中的所有\
  \ cookie，从而删除站点给用户的所有 cookie。\n\n##### 图 15.12。继续清除 cookie 的选项。\n\n![](img/0789724995_ch15lev1sec7_image05.gif)\n\
  \n![](img/0789724995_ch15lev1sec7_image06.gif)\n\n你可以通过加载设置了 cookie 之前的第二个页面（名为\
  \ `page2.htm`）来检查 cookie 是否已加载。图 15.13 显示 cookie 不存在。\n\n##### 图 15.13。清除后不再使用 cookie。\n\
  \n![](img/0789724995_ch15lev1sec7_image07.gif)\n\n![](img/0789724995_ch15lev1sec7_image08.gif)\n\
  \n### 接下来\n\n那么，书中已经没有更多内容了！你现在要做的就是将你新学的 JavaScript 技能带到网络空间，并充分利用这项伟大且灵活的技术！\n\
  \n祝你好运，玩得开心！\n\nKathie 和 Adrian\n"
