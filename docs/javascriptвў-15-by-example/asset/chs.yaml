  \ JavaScript\n\n| | 进入 JavaScript 世界 | |\n| | 结合 JavaScript 和 HTML | |\n\n## 第 1\
  \ 章。进入 JavaScript 世界！\n\nJavaScript 是一种脚本语言，能够让你为 Web 页面添加新层次的交互和功能。学习 JavaScript\
  \ 后，你的 Web 开发将提升到一个全新的水平。在第一章中，你将发现为什么在如今编写 JavaScript 几乎与知道如何使用 HTML 一样重要。在下一章开始认真编写\
  \ JavaScript 之前，你还将获得一些 JavaScript 的背景知识。\n\n从现在起，你的 Web 页面将变得一不复存在！\n\n本章将教你以下内容：\n\
  \n*   为什么你需要学习 JavaScript\n*   JavaScript 的起源和历史\n*   脚本语言与编程语言之间的一些区别\n*   编写 JavaScript\
  \ 所需的工具\n\n### JavaScript 无处不在\n\n看看你经常访问的一些网站。你看到了什么？页面上可能都有文字，还有大量的图片，对吧？但仔细看看；你还看到了什么？你看到其他东西了吗？也许是一个告诉你时间的钟，或者浏览器状态栏中滚动的消息？也许网站有一个在浏览器状态栏中滚动的消息，或者一个显示你时间的钟？在某些页面上你会看到\
  \ JavaScript 在运行。取决于你运行的浏览器，可能会出现细微的差异。在某些页面上，你会看到 JavaScript 在运行。\n\n**提示 (TIP)**\n\
  在本书中，你将不仅学习 JavaScript 如何工作工作（你你你你你你你你你\n\n\n\n处处。\n\n\n\n JavaScript 无处不在\n\n\n\
  \n你你 ( (，，，你你，，，，，，，，，，，，，。。\n\n JavaScript \n\n， JavaScript 无处不在。\n\n提示提示 ()**)**\n\
  在，，，你你学习 JavaScript 的\n\n你，，你还需要学习 JavaScript。\n\n处，，，， JavaScript 无处的。\n\n### 为什么你需要学习\
  \ JavaScript\n\n这是因为 JavaScript 在 Web 上被如此广泛地使用，你真的需要学习它。在本书中，你不仅将学习 JavaScript\
  \ 如何工作（正如你将脚本添加到你的页面中那样），你还将获得一些实用的 JavaScript 特性。在本书中，通过 JavaScript 让它变得更加令人难忘的。\n\
  \n**提示 (TIP)**\n记住，有时区分成功与失败网站取决于它们的外观感受。\n\n**注意 (CAUTION)**\n警惕你可以发现的 JavaScript\
  \ 无处可见的。例如，几行脚本可以用于引导访问，或者它可以自动执行任务，例如在线表单中的列。这些任务在视觉上可能并不惊艳或令人印象深刻，但它们是专业的标志。\n\
  \n### JavaScript 历史\n\nJavaScript（当时被称为 Livescript）由 Netscape Communications 的 Brendan\
  \ Eich 发明，直到 Java 成为一个非常流行的 Web 术语时才改名。\n\n第一个支持 JavaScript 的浏览器是 Netscape Navigator\
  \ 2.0。那时，微软看到了 Web 脚本语言有多么有用，并为 Internet Explorer 3.0 浏览器发布了自己的变体，称为 JScript。它与\
  \ JavaScript 1.0 基本兼容，这意味着为一个浏览器编写的 JavaScript 在另一个浏览器中很有可能（并非总是 100%）按预期工作。\n\n\
  后来，Netscape 发布 Netscape Navigator 3.0 的 JavaScript 1.1 以及 LiveWire Web 服务器软件。该版本包含了\
  \ JavaScript 1.0 的所有功能，以及许多新功能和能力。微软通过升级自己的 JScript 作回应，但决定不包含 JavaScript 1.1 中包含的所有功能。这就是浏览器不性的开始，即为一个浏览器编写的\
  \ HTML 和脚本在竞争对手浏览器中查看时无法正常工作。\n\nNetscape 公开了 JavaScript 的定义（也就是说，他们试图向所有人公开他们正在做什么来使自己的版本最流行）。不久后，Netscape\
  \ 与包括微软在内的其他机构创建一个中立的标准。欧洲计算机制造协会（ECMA）一个瑞士标准机构从 1996 年 11 月开始制定该标准。1997 年 7 月，他们发布了标准，并将该语言命名为\
  \ ECMAScript。在瑞士发生这一切的同时，Netscape 为其 Netscape Navigator 4.0 发布了 JavaScript 1.2，微软为\
  \ Internet Explorer 3.0 浏览器发布了 JScript 2.0。JavaScript 1.2 和 JScript 2.0 都不 100%\
  \ 符合 ECMAScript 标准（该标准有时也称为 ECMA-262）。\n\n\n\n\n\n那些时期现在通常被认为是对全球 Web 开发者来说非常艰难的时期。他们不仅需要记住每个浏览器版本的哪些方法有效，还必须以某种方式创建既可以在\
  \ Internet Explorer 上运行可以在 Netscape Navigator 上运行的网页。\n\n许多人认为情况不会好转，标准将继续进一步分化；而另一些人则乐观地抱有希望，认为\
  \ `ECMA` 标准将会流行，标准将再次变得兼容。\n\n幸运的是，这些混乱现在大多已被双方对标准的更紧密遵守所取代。`JavaScript 1.5` 和 `JScript\
  \ 5.5`（除了为了向后兼容而保留的少数例外，以及微软和 Netscape 为了预期成为标准而添加的扩展外）都 100% 符合 `ECMAScript Edition\
  \ 3` 标准。这意味着，至少在理论上，你可以编写在两个浏览器中运行效果同样良好的 `JavaScript`。然而，正如你稍后会发现的，浏览器之间的其他差异意味着，这并不像可能认为的那么简单。表\
  \ 1.1 和 1.2 记录了 JavaScript 穿越浏览器的历史。\n\n#### 注意\n\n如果每个人都使用最新版本的浏览器，标准就是完美的。然而，正如你可能已经知道的，事实并非如此。许多人仍在使用版本\
  \ 4、3，在某些情况下甚至是版本 2 或更旧的浏览器上网。如果你有使用这些浏览器的访问，你仍然必须兼顾他们——你稍后会如何这样做。\n\n表 1.1. 穿越浏览器的\
  \ JavaScript——Netscape JavaScript 版本\n\n| 浏览器 | 版本 |\n| --- | --- |\n| Netscape\
  \ 2.0 | 1.0 |\n| Netscape 3.0 | 1.1 |\n| Netscape 4.0 | 1.2 |\n| Netscape 4.5 |\
  \ 1.3/1.4 |\n| Netscape 6.0 | 1.5 |\n\n表 1.2. 穿越浏览器的 JavaScript——Internet Explorer\
  \ JScript 版本\n\n| 浏览器 | 版本 |\n| --- | --- |\n| Internet Explorer 3.0 | 1.0/2.0 |\n\
  | Internet Explorer 4.0 | 3.0 |\n| Internet Explorer 5.0 | 5.0 |\n| Internet Explorer\
  \ 5.5 | 5.5 |\n\n### 今天的 JavaScript\n\n`JavaScript 1.5` 和 `JScript 5.5` 代表了 Web\
  \ 脚本语言的最新水平，让你对页面的外观和行为拥有了强大的力量。当你采用 JavaScript 并将其与最新浏览器中存在的其他尖端技术——例如全面的浏览器 `Document\
  \ Object Model`（文档对象模型）和 `Cascading Style Sheets`（级联样式表，将在书中后面介绍）——你就对网页上发生的一切几乎拥有完全控制权。通过使用\
  \ JavaScript 和浏览器的 `Object Model`（对象模型），你可以创建响应用户点击和键盘输入的网页。另一方面，将 JavaScript 和\
  \ `Cascading Style Sheets` 结合，可以让你随心所欲地隐藏或显示文本、在页面上移动图像、控制浏览器窗口等等非常多的操作。\n\n####\
  \ 提示\n\n如果前面的内容听起来有点沮丧，不要担心——它并没有听起来的那么糟糕！\n\n有了这些技术，你不仅仅是在创建网页，你还在为访问者创建一个环境，这个环境看起来、感觉起来和响应起来就像她电脑上的任何其他应用程序一样。在书后面的章节，你将发现如何做到。\n\
  \n### JavaScript 的未来\n\n随着 `ECMA` 标准将 JavaScript 和 JScript 结合，JavaScript 在 Web 上的未来是有保障的。Netscape\
  \ 和微软（微软还有另一种基于其 Visual Basic 语言的、仅限 Internet Explorer 的脚本语言，称为 `VBScript`）都承诺在未来将继续支持并开发\
  \ JavaScript。除了 Netscape 和微软的参与外，Opera Software 也加入了进来，从版本 3 开始开始为他们的 `Opera` 浏览器增加了\
  \ JavaScript 支持。\n\n这意味着 JavaScript 是面向未来的——你今天学习如何编写它，可以确信它在不久的将来不会消失。\n\n### 脚本和程序之间有什么区别？\n\
  \n这是脚本初学者、甚至是那些已经使用了一段时间脚本的人经常问的问题。技术性的（读作“极客”的”）答案是，脚本是一系列指令（有时甚至是另一个程序），它由另一个程序解释或执行，而不是由计算机的处理器直接执行。这在现实世界中意味着什么？首先，创建一个程序你需要另一个程序（至少是一个\
  \ `compiler` 编译器），而编写脚本最少需要的是一个文本编辑器（几分钟后会详细介绍）。这意味着脚本比程序更容易编写，且通常速度更快，因为程序是用更具结构化且经过编译的语言编写的，例如\
  \ `C` 和 `C++`。\n\n然而，脚本的运行时间比编译后的程序要长，因为脚本中的每条指令首先由另一个程序处理（这需要加载额外的程序并执行更多的指令），而不是直接由处理器处理。然而，这个缺点被一个事实完全弥消了：脚本可以使用免费的文本编辑器编写，而而一个\
  \ `C++` 程序可能需要价值数百美元的软件！\n\n### 脚本语言和编程语言之间的区别是什么？\n\n你可能听过这样的说法：“噢，JavaScript 就像\
  \ C++，”或者“JavaScript 和 Java 是一样的。”事实上，实际上，这些陈述都是错误的。JavaScript 是一种第三代语言，这意味着它是 `C`、`C++`、`Pascal`、`BASIC`、`Java`\
  \ 或 `FORTRAN` 的伙伴。相似之处确实存在，但也存在重要的区别。以下是几点：\n\n- JavaScript 是自由格式。这意味着格式是可选的。\n\
  - JavaScript 是一种解释型语言。这意味着它由另一个程序处理。\n- JavaScript 高可移植性且与硬件无关。这意味着像 `Java` 一样，它可以随处运行。\n\
  - JavaScript 可以轻松嵌入其他软件中，如浏览器（用 `C++` 试试）。\n\n这一切意味着如果你有 `C`、`C++`、`Pascal`、`BASIC`、`Java`\
  \ 或 `FORTRAN` 的经验，你可能会发现 JavaScript 的某些方面很熟悉。然而，不要期望可以使用这些语言来创建 JavaScript——编写 JavaScript\
  \ 你必须使用 JavaScript！\n\n### 脚本编写工具\n\n正如你所知，JavaScript 不需要你去零售店购买昂贵的软件来编写 JavaScript。然而，存在两种不同的软件可以让你完成工作。让我们现在来看看这些。\n\
  \n#### 简单文本编辑器\n\n最好的选择可能是选择一个简单的文本编辑器（例如传统的 Windows 记事本）并以这种方式输入代码。这种方式编写 JavaScript\
  \ 可能是“硬方法”，但它有一些很棒的优点：\n\n- 它是免费的！\n- 你不需要学习如何使用复杂的软件。\n- 你在真正学习 JavaScript，而不是学习如何使用一个软件包。\n\
  - 它让你免受软件包内置 JavaScript 技术的限制。通过自己编写代码，你可以做 JavaScript 允许你做的任何事情。\n- 你可以根据自己的需要对\
  \ JavaScript 进行格式化并添加说明和注释。你了解它的运作方式，所以修改 JavaScript 很容易。\n- 你可以保留编写的所有小 JavaScript\
  \ 代码段，建立你自己的 JavaScript 库。\n- 你会觉得这些 JavaScript 都是你自己的作品，你可以因此获得所有的功劳！\n\n\n\n\n\
  \n不要受到诱使用富文本编辑器（如 Microsoft Word 或 Windows 写字本）来编写 JavaScript，因为可能会导致问题。一个常见的问题是引号。JavaScript\
  \ 要求直引号（`''` 或 `\"\"`），而某些富文本编辑器倾向于使用弯引号“智能引号”。这些简单的、弯曲的智能引号可能会导致大问题。避免这些问题的最好方法是使用简单的文本编辑器。\n\
  \n在整本书中，所有的示例都使用 Windows 记事本（如图 1.1 所示）。\n\n##### 图 1.1。在 Windows 记事本中显示的 JavaScript。\n\
  \n![](img/0789724995_ch01lev1sec8_image01.gif)\n\n## 使用可视化工具\n\n用于编写 JavaScript\
  \ 的可视化工具通常是 HTML 编辑器/创建器，它们允许你向网页中放入简单的脚本来执行简单的任务。此类工具的示例包括 Microsoft FrontPage、Macromedia\
  \ Dreamweaver 和 Adobe GoLive。\n\n通常情况下，你甚至不需要查看或输入任何 JavaScript，这从表面上看似乎是个好主意。但它们在易用性上提供的优势，在灵活性上就失去了平衡。每个工具的技能库中通常只限于几个\
  \ JavaScript 技巧，因此创作空间受到一定的限制。另一个缺点是，这些可视化工具输出的 JavaScript 通常非常长且复杂，即使是专业人员也发现难以阅读，更不用对脚本进行更改或编辑了。一个微小的编辑导致整个\
  \ JavaScript 停止工作并抛出错误并不罕见——这对于你网站的访问者来说可不是好事！\n\n然而，有时你可能需要或必须使用可视化工具。这没关系。关键在于，你可以在需要时编写自己的\
  \ JavaScript，而不必完全依赖软件内置的脚本。\n\n不过，使用可视化工具确实存在一些优势：\n\n* 速度——它们的使用比手动输入快得多。\n* 准确性——如果允许它自行运行，可视化工具输出的\
  \ JavaScript 是可以工作的（尽管一旦你开始修改它，情况可能就不如此了！）。\n* 特功能——如 HTML 颜色编码等功能可以让 HTML 和 JavaScript\
  \ 更具可读性。\n\n提示\n\n在整本书中，我们鼓励你亲手输入这些示例。虽然这看起来可能既枯燥又耗时，但它是学习如何编写 JavaScript，以及更重要的是学习如何用\
  \ JavaScript 思考的最好的方法。这让你对这种语言实际上是如何组合在一起的一种感觉。\n\n## 拥有最新浏览器\n\n由于你在这里将学习前沿的 JavaScript，因此拥有最新的浏览器以利用这一特性非常重要。我们建议你至少安装了\
  \ Netscape Navigator 4.0 和 Microsoft Internet Explorer 5.5。Internet Explorer 5.5\
  \ 和 Netscape Navigator 6 Preview Release 2 分别显示在图 1.2 和图 1.3 中。\n\n##### 图 1.2。Microsoft\
  \ Internet Explorer 5.5。\n\n![](img/0789724995_ch01lev1sec9_image01.gif)\n\n#####\
  \ 图 1.3。Netscape Navigator 6（这是预览版 2 版本）。\n\n提示\n\n这两个浏览器都可以从网上免费下载。访问 [`www.microsoft.com/ie`](http://www.microsoft.com/ie)\
  \ 获取 Internet Explorer 的最新信息，访问 [`www.netscape.com`](http://www.netscape.com) 获取\
  \ Netscape Navigator 的最新信息。\n\n注意\n\n另一个能够运行 JavaScript 的浏览器是 Opera Software 的 Opera（目前为\
  \ 4.5 版本）。该浏览器不免费，但可以从 [`www.opera.com`](http://www.opera.com) 购买并下载。\n\n## 其他工具\n\
  \n还可以做些什么来让你作为 JavaScript 程序员的生活更轻松？这里有一些想法。\n\n### 创建 HTML 模板\n\n如果你将使用文本编辑器来创建网页，那么减少你必须进行的重复输入量是有意义的。实现这一点的方法之一是使用\
  \ HTML 模板。模板是一个包含页面所需的 HTML 骨架的文本文件。它可以进行定制以适应你自己的情况，但作为一个起点，以下内容可能足够：\n\n```html\n\
  \ <html>\n<head>\n<title>HTML 模板页面</title>\n<script language=\"javascript\">\n<!--\n\
  \n// -->\n</script>\n</head>\n<body>\n\n</</body>>\n</html>\n```\n\n此模板经过了定制，以适应你将学习如何编写\
  \ JavaScript 的事实，但如果你理解其中的某些内容请担心。你将在下一章更详细地查看它！\n\n在你创建了此模板（如图 1.4 所示）后，你可以将其保存在硬盘上方便的位置，例如你的桌面或当前项目文件夹。在保存之前重命名它。\n\
  \n##### 图 1.4。在 Windows 记事本中显示的 HTML 模板。\n\n![](img/0789724995_ch01lev1sec10_image01.gif)\n\
  \n注意\n\n有一个标准的 HTML 布局，可以添加这个。\n\n### 脚本库\n\n在学习 JavaScript 的过程中，你可以做的另一件让你更方便的事情是建立自己的脚本库。这只需要是一堆文本文件（只需给它们起有意义的名字，否则查找它们会比手动输入要耗时得多！）\n\
  \n提示\n\n通过建立脚本库，你不仅让未来的编程更简单，而且让你对它们更加熟悉。\n\n### 接下来\n\n现在我们已经涵盖了 JavaScript 的起源、历史和未来，并查看了成为真正的\
  \ JavaScript 程序员所需的一切，你准备好开始编写脚本了！第 2 章 结合 JavaScript 和 HTML\n\n如果你想学习如何编写 JavaScript，首先需要理解\
  \ JavaScript 和 HTML 是如何结合的。在本章中，你将学习这一点。\n\n本章将教你以下内容：\n\n* 如何将 JavaScript 添加到 HTML\
  \ 中\n* `<head>`标签的重要性\n* `<script>` 块是什么以及如何将其添加到网页中\n* 如何向不支持 JavaScript 的旧浏览器隐藏\
  \ JavaScript\n\n### 世界交汇——HTML 和 JavaScript\n\n现在你了解 HTML 如何工作，并且对 JavaScript 有了初步。下一步是查看它们如何在网页上结合并和谐工作。\n\
  \n由于 HTML 和 JavaScript 是完全不同的技术，因此有规则规定 JavaScript 如何插入网页的 HTML 中。事实上，有多种方法可以将 JavaScript\
  \ 添加到网页，但为了让你开始，我们最初专注于最常用且可能是最灵活的方法。在这种方法中，JavaScript 被插入 `<head>` 标签的脚本块中。\n\n\
  #### HTML 骨架\n\n在继续之前，你必须熟悉 HTML 页面的解剖结构。以下是显示在图 2.1 所示浏览器中非常基础网页的 HTML 代码：\n\n\
  ```html\n <html>\n<head>\n<title>简单页面</title>\n</head>\n<body>\n<p>确实是一个非常简单的网页！</p>\n\
  </body>\n</html>\n```\n\n\n\n\n\n##### 图 2.1. 在 Internet Explorer 中显示的简单 HTML Web\
  \ 页面。\n\n![](img/0789724995_ch02lev1sec1_image01.gif)\n![](img/0789724995_ch02lev1sec1_image02.gif)\n\
  \n从 JavaScript 的角度来看，你需要关注的该页面部分是以起始标签 `<head>` 开始并以 `</head>` 结束的 HTML 块。这是页面的\
  \ `<head>` 块，也称为 Web 页的头部（header），你将把 JavaScript 放在这里。\n\n然而，你不能直接将代码放在 `<head>`\
  \ 中。你必须先做一些事情！\n\n#### `<script>` 块\n\n要将 JavaScript 放在 `<head>` 标签内部，你必须向 `<head>`\
  \ 中添加一个新的 HTML 块。这个块就是 `<script>` 块。该脚本块的作用是告诉浏览器，其起始和结束标签之间的任何内容都是脚本——浏览器应该像对待脚本一样处理它。\n\
  \n此块可以添加到 `<head>` 块内的任何位置，但通常添加到末尾，位于闭合标签 `</head>` 之前：\n\n```\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script>\n\n</script>\n</head>\n<body>\n<p>A very\
  \ simple Web page indeed!</p>\n</body>\n</html>\n```\n\nCAUTION\n\n将 `<script>`\
  \ 块放在头部的原因之一是，通过将其放在这里，你可以确保它在任何其他内容之前加载，这极大地减少了错误发生的范围。如果你现在觉得这完全没道理，不要担心，你将在本书的后后部分详细介绍这一点。\n\
  \n在将 JavaScript 添加到 `<script>` 块之前，你必须再做几件事。这些任务的第一是告诉浏览器 `<script>` 标签内包含的是什么类型的脚本。这是因为\
  \ JavaScript 并不是你可以使用的唯一 Web 脚本语言。另一种广泛使用的脚本语言是微软的 VBScript。因此，为了告诉浏览器你使用的语言是 JavaScript，你必须首先如下所示向\
  \ `<script>` 标签添加 `language` 属性：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"\">\n</script>\n</head>\n<body>\n<p>A very simple Web page indeed!</p>\n\
  </body>\n</html>\n```\n\n通过在引号内输入 `JavaScript` 来声明所使用的语言是 JavaScript：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n\n</script>\n\
  </head>\n<body>\n<p>A very simple Web page indeed!</p>\n</body>\n</html>\n```\n\n\
  NOTE\n\n例如，如果你想用 VBScript 写一个脚本，则语言将设置为 `vbscript`：\n\n```\n <script language=\"\
  vbscript\">\n```\n\n你刚刚涵盖了关于该点的两点。\n\n首先，引号。在某些情况下，你可能会看到一些 JavaScript 代码，并发现声明语言时没有使用引号包裹该单词。一切看起来都运行得很好，那么为什么要费心输入它们呢？嗯，这又是那种绝对正确更好的时刻之一。尽管\
  \ Internet Explorer 和 Netscape Navigator 浏览器都能理解带引号或不带引号的语言，但正确的格式是使用引号，这就是为什么在这里显示为这样。可能会有一天有一天，浏览器会要求\
  \ HTML 必须是正确的。通过现在编写格式良好的 HTML，你正在确保你的技能面向未来！\n\n第二点是关于大小敏感的。看看以下：\n\n* `<script\
  \ language=\"javascript\">`\n* `<script language=\"JavaScript\">`\n* `<script language=\"\
  JAVASCRIPT\">`\n\n它们有什么区别？没错，它们是以各种大小写形式编写的。在本书中我们将使用“JavaScript”，但在创建 Web 页面时，目前最好的方法是使用全小写。这不仅速度更快，而且不容易出现拼写错误。\n\
  \n现在，如果你看 Web 上编写的脚本，有时会注意到 `language` 属性被省略了。嗯，这同样运行良好。这背后的原因是，因为 JavaScript 是第一个出现的脚本语言，它被认为是默认值。然而，为了保持格式良好的\
  \ Web 页面，最好包含它。这再次确保了你今天学到的技能是面向未来的。\n\n#### 关于 `language` 属性的更多内容\n\n`language`\
  \ 属性比表面看起来复杂得多。虽然纯 JavaScript 是默认的，但你在上一章中读到存在许多版本或变体版本的 JavaScript。JavaScript 1.0、JavaScript\
  \ 1.1、JScript 等都是可用的。你实际上可以使用 `language` 属性来指定你编写的是具体哪个版本。你指定的版本实际上取决于你想让脚本运行的浏览器和\
  \ JavaScript 版本。这听起来有点复杂，但让我们来看几个示例，这将有所帮助。\n\n如果你使用 `<script language=\"JavaScript\"\
  >`，你是在告诉浏览器这就是 JavaScript，并使用你的 JavaScript 引擎（实际解释 JavaScript 的程序）来运行它。这是默认设置。然而，如果你想让\
  \ JavaScript 只在微软的 Internet Explorer 上运行，最好的方法是将编写的 JavaScript 定义为你所编写的 JavaScript：\n\
  \n```\n <script language=\"JScript\">\n</script>\n```\n\n现在，如果你想针对 Netscape Navigator\
  \ 3.0？根据上一章，你可能记得它的版本是 1.1。\n\n```\n <script language=\"JavaScript\">\n</script>\n\
  ```\n\n这一点是为了给你提供完整的视角。\n\nCAUTION\n\n记住默认值是 `language=\"JavaScript\"`，本书中的大多数示例都使用（如果我们想设置为其他值，我们会说明）。小心不要无意中将其设置为其他值，因为这会导致脚本在浏览器中无法运行，有时发现这个错误可能是困难的！\n\
  \n### 为旧浏览器隐藏 JavaScript\n\nNetscape Navigator 2.0 之前的浏览器完全无法运行 JavaScript，如果它们在\
  \ Web 页面遇到 JavaScript，会导致它们产生一些糟糕的错误。为了避免此类错误的可能性，通过在 `<script>` 块中使用 HTML 注释标签来隐藏放置在页面上的任何脚本。这样做快速且简单，尽管现在旧浏览器已经罕见，但在每个包含\
  \ JavaScript 的 Web 页面中插入注释标签仍然是值得的。\n\n这些注释标签很容易添加。在 `<script>` 标签内部插入另一对标签 `<!--`\
  \ 和 `-->`。你编写的所有代码都在这些标签之间，任何理解 `<script>` 标签的浏览器都会忽略它们。\n\nNOTE\n\n将希望浏览器使用的任何内容放在注释标签中似乎很奇怪，因为这些是用于防止文本显示在页面上的。事实是，所有理解脚本的浏览器都会忽略这些注释标签，就像它们不存在一样。\n\
  \n为了让注释标签更明显，开发者通常会在这些 HTML 注释标签内放置一些（有时是趣味性的！）注释，告诉可能查看代码的人它们的作用：\n\n```\n <script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\n// Cloaking device off -->\n\
  </script>\n```\n\n现在页面看起来如下：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body>\n<p>A very simple Web page indeed!</p>\n</body>\n\
  </html>\n```\n\n\n\n\n\n信不信由，你刚刚遇到了你的第一个 JavaScript 小段落！这就是 JavaScript 注释标签（`//`）。这些与\
  \ HTML 注释标签不同；在下一章中，你将看到它们是如何运作的，以及更多内容。\n\n### 接下来要做什么\n\n你现在已经学习了关于 JavaScript\
  \ 如何融入 HTML 网页中所需的所有知识，你已经准备好开始编写 JavaScript 了！在下一章中，你将学习如何编写几行简单的 JavaScript 代码，这将会向你展示如何让\
  \ JavaScript 显示输出并接受输入。\n\n# 第二部分：语言之旅\n\n- 实战中的 JavaScript\n- 使用变量处理数据\n- JavaScript\
  \ 数组与转义字符\n- 表达式、条件、运算符以及更多字符串和数字\n- JavaScript 中的 Use 语句\n- 通过函数和事件编写更好的 JavaScript\
  \ 脚本\n- 充分利用对象的价值\n- Bug——如何发现并消灭它们\n\n## 第 3 章 实战中的 JavaScript\n\n在本章中，你将获得第一次编写\
  \ JavaScript 的机会！本章将向你正式地介绍 JavaScript。此外，本章是一个重大的实操章节，你将通过示例真正开始学习 JavaScript 的基础知识……\n\
  \n本章将教你学习以下内容：\n\n- JavaScript 的一些基础知识，例如语法、布局、代码注释等\n- JavaScript 的一些术语，以及为什么它被称为面向对象的语言\n\
  - 如何在 Web 上练习阅读和编写 JavaScript\n- 如何使用 JavaScript 创建输入和输出\n\n### 探索 JavaScript 的输入和输出\n\
  \n注意\n\n本章使用了许多微小的 JavaScript 示例。我建议你亲自完成每个示例，实际输入代码。此举目的是让你在进入更复杂的 JavaScript 示例之前，对\
  \ JavaScript 基础知识进行大量的练习。\n\n重复是 JavaScript 成功的关键。\n\nJavaScript 的输入和输出不仅对于编写能够与用户进行双向通信的\
  \ JavaScript 代码非常有用，探索 JavaScript 的这一领域也是你通往精通之路的绝佳起点！\n\n计算本质上就是输入和输出。数据进入，数据流出。没有输入和输出，什么都不会发生，什么也无法完成。文字处理器在接收到用户的输入（通常是按键生成的字符形式）之前不会开始任何操作，而这会导致输出（输出到屏幕上，随后输出到纸张或以电子形式）。\n\
  \n在这里，我们将使用 JavaScript 以各种类型消息框的形式控制输入和输出（可以保证，如果你在网上超过了几分钟，就一定见过这些消息框了！）。\n\n可以使用\
  \ JavaScript 变幻出三种类型的消息框。图 3.1、3.3 和 3.5 显示了 Internet Explorer 的消息框，而 3.2、3.4 和\
  \ 3.6 显示了 Netscape 的消息框。\n\n##### 图 3.1. Internet Explorer 的消息框。\n(0789724995_ch03lev1sec1_image01.gif)\n\
  \n##### 图 3.2. Netscape 的消息框。\n(0789724995_ch03lev1sec1_image02.gif)\n\n##### 图\
  \ 3.3. Internet Explorer 的消息框。\n(0789724995_ch03lev1sec1_image03.gif)\n\n##### 图\
  \ 3.4. Netscape 的消息框。\n(0789724995_ch03lev1sec1_image04.gif)\n\n##### 图 3.5. Internet\
  \ Explorer 的消息框。\n(0789724995_ch03lev1sec1_image05.gif)\n\n##### 图 3.6. Netscape\
  \ 的消息框。\n(0789724995_ch03lev1sec1_image06.gif)\n\n- Alert—— 输出信息。\n- Confirm—— 允许用户选择。\n\
  - Prompt—— 输出一些信息。\n\n注意\n\n为什么 Internet Explorer 的消息框与 Netscape Navigator 不同？正因为如此，`alert`、`confirm`\
  \ 和 `prompt` 都是方法。\n\n### 对象、方法……以及属性\n\n简单来说，对象是一个事物。就像现实世界中的事物对象对象，计算机世界中的事物也被视为对象。\n\
  \n为了理解这一点，你需要熟悉三个术语：是对象让 JavaScript 面向对象。\n\n#### 方法\n\n方法是对象可以做的事情。在现实世界中，对象拥有方法。汽车移动，狗吠叫，美元购买，等等。`alert()`、`confirm()`\
  \ 和 `prompt()` 都是 `Window` 对象的方法。\n\n#### 属性\n\n所有对象都有属性。汽车有轮子，狗有毛。对于 JavaScript\
  \ 来说，诸如浏览器具有名称和版本号。\n\n### 使用 `alert()` 方法\n\n`alert()` 是三个方法中最容易使用的。你可以用它以简单、简洁的方式向用户显示文本信息。当用户读完消息后，只需点击\
  \ OK 即可将其消除。\n\n\n\n\n首先，用你喜欢的文本编辑器打开你的模板 HTML 页面，并以新名称保存到硬盘上方便的路径：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\n\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n\
  </html>\n``````\n\n**注意**\n\n记得使用 `HTM` 或 `HTML` 文件扩展名保存它；否则，程序将无法按照预期运行。\n\n**警告**\n\
  \n在此阶段，可能值得知道的是 `JavaScript` 是一种区分大小写的语言。你将在将后的章节中更详细地学习这一点，但目前，请注意：除了你想要使用的文本字符串外，对于所有的\
  \ `JavaScript`，最好遵循统一的大小写字母选择。\n\n要调出警报消息框，请输入以下内容：\n\n```\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  alert();\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n\
  ```\n\n**注意**\n\n`alert()` 方法末尾的分号被称为行终止符，它是使你的 `JavaScript` 符合 `ECMA` 标准所需的（尽管没有它也能正常工作）。你将在接下来的章节中经常看到它；在第\
  \ 4 章“使用变量处理数据”中，你将确切地了解何时以及何使用它。\n\n现在，关于你想显示的的消息。它被放在括号内的引号中：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nalert(\"An alert triggered by JavaScript!\");\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n保存页面，将其加载到浏览器中，观察消息的出现（参见图\
  \ 3.7）！\n\n##### 图 3.7. Internet Explorer 显示的带有自定义消息的警报框。\n\n![](img/0789724995_ch03lev1sec3_image01.gif)\n\
  \n![](img/0789724995_ch03lev1sec3_image02.gif)\n\n让第二个警报出现与让第一个出现简单——只需在第一个下面的 `<script>`\
  \ 块中添加 `alert()`，并添加你用引号括起来自己的消息：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nalert(\"An alert triggered\
  \ by JavaScript!\");\nalert(\"A second message appears!\");\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n在文本编辑器中保存文件并刷新浏览器。这次请注意弹出了两个消息。但更重要的是，注意它们是如何分开显示的，而不是一个叠在另一个上面。这表明\
  \ `JavaScript` 在每个之间之间停止了，并没有盲目地运行到脚本末尾。它耐心地等待直到用户点击第一个框上的“确定”，然后才继续显示第二个。\n\n**提示**\n\
  \n记住在查看你所做的更改之前重新保存文件。你不会相信有多少用户忘记了这一步并认为自己做错了什么！\n\n**练习**\n\n作为一项练习，回到模板并从零开始创建一个新的\
  \ `JavaScript`，以触发一个带有你所选择消息的警报框。\n\n在你完成之后，按照相同的格式添加第二个警报框。接下来，在新的一行上添加 `alert()`\
  \ 方法，然后在括号内和引号内添加你想显示的消息。\n\n### 在 JavaScript 中添加注释\n\n专业的 `JavaScripters` 努力让他们的代码在他们回来查看时变得易于重新阅读（可能是几个月后）。他们使用的用以帮助自己的工具之一是\
  \ `JavaScript` 注释标签，其中你已经在上一章中遇到过一个——单行注释。\n\n#### 单行注释\n\n这里有一个单行注释标签生效的示例：\n\n\
  ```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n// 第一个 alert 在下方\nalert(\"An alert triggered by JavaScript!\"\
  );\n// 这里是第二个 alert\nalert(\"A second message appears!\");\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n如果你运行这段 `JavaScript`，你不会发现任何不同。那是因为注释标签已经完成了它们的工作，从浏览器的视图中隐藏了注释。\n\
  \n#### 多行注释\n\n有时你需要向你的脚本中添加多行注释，尽管你可以在每一行的开头放置斜杠（`//`），但这并不真正方便。这就是多行注释标签大显身手的地方。\n\
  \n多行注释标签由开启注释标签（`/*`）、注释本身以及随后的结束注释标签（`*/`）组成。\n\n这里是一个多行注释的示例：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\n/*\n下方两个 alert 方法用于触发\n消息——注意在第一个被点击后\n*/\nalert(\"An alert triggered\
  \ by JavaScript!\");\nalert(\"A second message appears!\");\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n向脚本添加有意义的注释是只有通过练习才能掌握的。起初可能看起来很无聊或没必要，但它让你的脚本更容易理解，利用机会为你的脚本注释！\n\
  \n**练习**\n\n对于你创建的示例，使用单行和多行注释你的代码。\n\n### 使用 confirm 方法\n\n`confirm()` 方法与 `alert()`\
  \ 类似，但此框用于提供用户“确定”和“取消”之间的选择。\n\n**注意**\n\n取消按钮需要比你目前涵盖更多的 `JavaScript` 技能才能使其工作。不过不要担心；我们将重新访问\
  \ `confirm()` 方法。\n\n所以再次按照 `alert()` 方法相同的程序，你通过如下在脚本块中添加 `confirm()` 方法开始：\n\n\
  ```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nconfirm();\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n```\n\n再次，你想在框中显示的消息在括号内并用引号包含：\n\n```\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nconfirm(\"Which one will you choose?\");\n// Cloaking device off -->\n\
  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n保存文件（再次使用与模板不同的名称，并记得使用 `HTM`\
  \ 或 `HTML` 文件扩展名）并将其加载到浏览器中（参见图 3.8）。\n\n现在注意框上的按钮——确定和取消。然而，目前当你点击它们时，什么都不会发生，除了框消失消失以及\
  \ `JavaScript` 继续运行之外。在你可以使用确认框上的按钮之前，你将还需要一些 `JavaScript` 技能，之后我们将再次访问 `confirm()`\
  \ 方法。\n\n**练习**\n\n练习在网页上添加 `confirm()` 方法。添加你自己的消息。\n\n在网页上添加几个单独的 `confirm()`\
  \ 方法并注意结果。\n\n### 使用 prompt 方法\n\n\n\n\n\n`prompt()` 方法与你在本章中看到的另外两个方法略有不同。它是唯一一个允许用户对问题输入自己的回答的方法，而不是让脚本仅处理它已有的信息（如\
  \ `alert()` 方法），或者允许用户选择“确定”或“取消”（可以使用 `confirm()` 方法实现）。\n\n添加 `prompt()` 方法的方法与另外两个方法非常相似。首先，在`<script>`\
  \ 块中添加 `prompt()` 方法：\n\n```html\n <html>\n<head>\n<title>一个简单的页面</title>\n<script\
  \ language=\"JavaScript\">\n<!-- 遮装设备开启！\nprompt();\n// 遮装设备关闭 -->\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n```\n\n现在，`prompt()` 方法开始与另外两个方法有所不同，因为因为必须在括号内添加两段文本。第一个是你想显示的消息。\n\
  \n这种方法与之前完全相同。同样，将文本放在括号内和引号内：\n\n```html\n <html>\n<head>\n<title>一个简单的页面</title>\n\
  <script language=\"JavaScript\">\n<!-- 遮装设备开启！\nprompt(\"你的名字是什么？\");\n// 遮装设备关闭\
  \ -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n保存此页面并在浏览器中查看。注意看提示框出现了，询问用户其姓名（参见图\
  \ 3.9）。你可以输入并点击“确定”继续，也可以点击“取消”。\n\n##### 图 3.9。Internet Explorer 显示带有自定义消息的提示框。\n\
  \n![](img/0789724995_ch03lev1sec6_image01.gif)\n\n![](img/0789724995_ch03lev1sec6_image02.gif)\n\
  \n注意输入框中的 `undefined` 单词。这是 Internet Explorer 的特性；Netscape Navigator 则只是让输入框为空（参见图\
  \ 3.10）。\n\n##### 图 3.10。Netscape Navigator 中相同的提示框；注意输入框中没有出现文本。\n\n![](img/0789724995_ch03lev1sec6_image03.gif)\n\
  \n![](img/0789724995_ch03lev1sec6_image04.gif)\n\n目前，无论你做什么，什么都不会发生，但到本章结束时，你将能够通过更多的\
  \ JavaScript 来让它用起来！\n\n我们可以添加的另一段文本是显示在提示框实际输入框中的默认文本。添加这个非常简单，并且可以消除 Internet\
  \ Explorer 显示的丑陋“undefined”。你需要执行的操作是：在括号内的第一段文本之后，在引号外放置一个逗号，然后放置第二段文本（同样使用引号）。以下是该实际运行的示例：\n\
  \n```html\n <html>\n<head>\n<title>一个简单的页面</title>\n<script language=\"JavaScript\"\
  >\n<!-- 遮装设备开启！\nprompt(\"你的名字是什么？\",\"在此输入你的名字。\");\n// 遮装设备关闭 -->\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n```\n\n再次保存页面并刷新浏览器。注意原本为空的输入框现在包含了第二组引号中的文本（参见图\
  \ 3.11）。\n\n##### 图 3.11。Internet Explorer 显示的带有自定义消息和默认输入框文本的提示框。\n\n![](img/0789724995_ch03lev1sec6_image05.gif)\n\
  \n![](img/0789724995_ch03lev1sec6_image06.gif)\n\n### 练习\n\n- 练习在 Web 页面上添加 `prompt()`\
  \ 方法。添加自己的消息和输入框的默认文本。\n- 在 Web 页面上添加几个独立的 `prompt()` 方法并注意结果。\n- 在你的页面中添加一些注释（单行和多行），解释发生了什么以及每个部分的作用。\n\
  \n### 下一步何告\n\n到目前为止，你已经学习了如何使用 JavaScript 显示三种类型的消息框。在下一章中，你将通过探索 JavaScript 两个最重要的领域——使用变量和数组处理数据，学习如何让这些消息框和其他\
  \ JavaScript 代码真正运行。\n\n## 第 4 章。使用变量处理数据\n\n在上章中，你学习了如何使用 JavaScript 生成三种类型的消息框，你可以将它们用于输入和输出决策及文本。然而，你目前看到的\
  \ JavaScript 并不灵活。你编写 JavaScript 时包含了你想显示的消息，没有留任何其他操作的空间。此外，在提示框中输入的任何文本在点击“确定”或“取消”后就会立即丢失。在本章中，你将学习如何改变这一点，让\
  \ JavaScript 真正为你工作！\n\n本章将教你：\n- 变量（Variables）\n- 数组（Arrays）\n- 数字（Numbers）\n-\
  \ 字符串（Strings）\n- 布尔值（Boolean）\n\nVariables（变量）\n- Arrays（数组）\n- Numbers（数字）\n-\
  \ Strings（字符串）\n- Boolean（布尔值）\n\n\n\n\n布尔值与字符串和数字不同，因为它们只有两个值：`True` 和 `False`。\n\
  \n#### 注意\n\n布尔（Boolean）是以英国数学家乔治·布尔（George Boole, 1815–1864）的名字命名的。\n\n以下是布尔值的示例：\n\
  \n```\n Dogs bark = true\nDogs have five legs = false\n```\n\n你将在后的第 6 章“表达式、条件、运算符以及更多字符串和数字”查看表达式和条件时回顾布尔。现在，你只需要知道它存在，并且它是\
  \ `JavaScript` 中一种可能的数值类型。\n\n### 特殊数据类型：数字、Null 和 Undefined\n\n除了你目前已经过的过的类型外，还有几种不那么明显的原始数据类型。这些是四种特殊的数字值：\n\
  \n* 正无穷\n* 负无穷\n* 正 0 和 负 0\n* NaN\n\n还存在两种特殊类型：\n\n* Null\n* Undefined`\n\n简而言之，对于这四个特殊的数字值，你没有办法手动输入它们（你想尝试输入一个无穷大的数字吗？）。`NaN`\
  \ 代表 Not a number（不是数字），它通常是由没有意义的数学运算产生的（例如将任何数字除以零）。与无穷有关的值是因为突破了 `10³⁰⁸` 或 `10^-308`\
  \ 的屏障（例如，将 `1.0e300` 自相乘），所以它们对你来说仍然没用（除了告诉你某处可能出错了之外！）。\n\nnull 类型只有一个值，即 `null`。Null\
  \ 意味着无——没有数据——它仅用于告诉你在在信息或数据方面没有可用的内容。\n\n`undefined` 稍微难理解一点。同样，它有一个值（`undefined`），在大多数情况下这个值与\
  \ `null` 相同。在所有极端情况之外，`undefined`（特别是当显示给访问者时）都是一个不好的信号，它的出现意味着你的 `JavaScript` 出了问题。\n\
  \n### JavaScript 变量\n\n现在你已经了解了 `JavaScript` 值，准备进入 `JavaScript` 变量的世界了。\n\n变量很重要，不仅在\
  \ `JavaScript` 的语境中，在所有的计算机编程语言中都是如此。没有变量，几乎什么都发生不了。有了变量，你就释放了巨大的力量以及移动、改变和处理各种数据的能力。\n\
  \n简单来说，变量是一个容器，你为运行 `JavaScript` 的计算机内存中持有的值（该值始终具有特定的类型）分配一个名称。这个表述实际上可能会让变量听起来比实际情况更复杂，因为在现实世界中，它们非常容易使用。\n\
  \n#### 创建变量\n\n在 `JavaScript` 中创建变量非常简单。为了对变量进行快速且简单的介绍，让我们回到你的标准 HTML 模板：\n\n```\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n\n</body>\n</</html>\n```\n\n要做的第一件事是创建一个变量。你可以通过两种方式实现：声明它们和即时创建。首先，让我们看看在使用之前声明的变量。在本章的晚些时候，我们将查看即时创建它们。\n\
  \n要声明（创建）变量，你使用 `JavaScript` 语句 `var`（variable 的缩写），后面跟着你想要赋值的变量名。因此，下面的行 `JavaScript`\
  \ 代码创建了一个名为 `msg` 的变量：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nvar msg;\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n\n</body>\n</</html>\n```\n\n#### 注意\n\n\
  一个语句相当于英语中的一个完整句子。更多内容请参见第 7 章“在 JavaScript 中使用语句”。\n\n关于变量名，你需要了解以下几点：：\n\n* 变量名可以包含大写字母、小写字母或两者的混合。\n\
  * 在初始化之前，变量的值为 `undefined`。\n* 首字符不能是数字。\n* 变量名不能包含空格；如果你想将两个或多个单词连接在一起，应该使用下线字符（`_`）。\n\
  * 你应该避免在变量名中使用美元符号（`$`），因为 Internet Explorer 3.02（带有 `JScript` 1）不支持它。\n* 变量名区分大小写。\n\
  * 变量名不能是保留字。\n* 变量名不能以数字开头。\n* 变量名不能包含空格。\n* 变量名不能包含特殊字符（除下线外）。\n\n以下是有效的变量名：\n\n\
  ```\n msg\nmsg_name\n$money\n```\n\n以下是无效的变量名：\n\n```\n 123name\n hello world\n\
  \ var\nmsg-name\n```\n\n\n\n练习创建多个变量，最好同时为它们赋值。记住要用逗号分隔不同的变量名。\n\n根据你的需要为 JavaScript\
  \ 代码添加注释。\n\n## 显示变量的内容\n\n现在，你已经创建了变量并为它们分配了字符串和数值值。现在，你可以让它们为你开始工作了！\n\n你可以做的第一件事就是证明所有这些变量操作确实有效。因此，在这个简短的示例中，你将使用\
  \ `alert()` 方法来显示变量的值。\n\n同样，你可以通过声明两个名为 `msg1` 和 `num1` 的变量并为它们赋值`\"Hello there\"\
  `（一个字符串）和 `22`（一个数字）来开始：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar msg1 = \"Hello there\"\
  , num1 = 22;\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n\
  </</html>\n```\n\n接下来，你向页面中添加 `alert()` 方法——确保它位于变量下方：\n\n```html\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nvar msg1 = \"Hello there\", num1 = 22;\nalert();\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body>\n\n</body>\n</</html>\n```\n\n最后，你必须让 `alert()`\
  \ 方法读取变量的值。记得你之前生成一个包含文本的警报框吗？那些文本是放在引号中的。这样做是为了显示它是一个字符串。然而，让警报框显示变量的值要简单得多。你只需要将变量名放在括号内（不加引号，什么都不加）：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nvar msg1 = \"Hello there\", num1 = 22;\nalert(msg1);\n\
  // Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</</html>\n```\n\
  \n保存页面并将其加载到浏览器中查看你的工作成果（请查看 图 4.1）！\n\n##### 图 4.1. 显示变量 `msg1` 值的警报框。\n\n![](img/0789724995_ch04lev1sec2_image01.gif)\n\
  \n![](img/0789724995_ch04lev1sec2_image02.gif)\n\n继续第二个变量，你现在可以在第二个警报框中显示它：\n\n\
  ```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nvar msg1 = \"Hello there\", num1 = 22;\nalert(msg1);\n\
  alert(num1);\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n\
  </</html>\n```\n\n再次保存页面并刷新浏览器以查看你所做的更改。这次会出现两个警报框，接继出现，第二个警报框显示数字 22（请查看 图 4.2）。\n\
  \n##### 图 4.2. 显示变量 `num1` 值的第二个警报框。\n\n![](img/0789724995_ch04lev1sec2_image03.gif)\n\
  \n![](img/0789724995_ch04lev1sec2_image04.gif)\n\n### 练习\n\n为了帮助巩固在本章中学到的的内容，你现在可以根据所学创建几个类似的示例。创建几个变量并为它们分配各种类型的值；然后使用\
  \ `alert()` 方法显示变量的值。\n\n如果你仅使用自己的模板从头开始这些页面，你将获益更多。不要只从我们已经做过的示例中复制粘贴！\n\n使用注释让你的\
  \ JavaScript 代码更易读、易理解。\n\n## 故障排除！\n\n以下示例中有什么问题？\n\n### 示例 1\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nvar msg1 = \"Hello there\", num1 = 22;\nalert(msg11);\nalert(num1);\n\
  // Cloaking device off -->\n</script>\n</head>\n<body>\n</body>\n</</html>\n```\n\
  \n答案：第一个 `alert()` 方法显示了一个尚未创建或未被赋值的变量（`msg11`）。这是一个 `undefined` 值的示例。\n\n### 示例\
  \ 2\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nvar msg1 = \"Hello there\" num1 = 22;\n\
  alert(msg1);\n// Cloaking device off -->\n</script>\n</head>\n<body>\n</body>\n\
  </</html>\n```\n\n答案：变量赋值之间缺少一个逗号。\n\n### 示例 3\n\n```html\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  var msg1 = \"Hello there\", num1 = 22;\nalert(msg11);\n// Cloaking device off -->\n\
  </script>\n</head>\n<body>\n</body>\n</</html>\n```\n\n答案：变量 `msg11` 未定义。\n\n\n\n\
  接下来，点击 OK 按钮，观察弹框出现，其中显示了你的名字（参见图 4.5）。\n\n### 图 4.5. 显示 `yourname` 变量值的弹框。\n\n\
  ![](img/0789724995_ch04lev1sec4_image05.gif)\n\n![](img/0789724995_ch04lev1sec4_image06.gif)\n\
  \n如果你点击取消（Cancel）按钮，`yourname` 的值将被设置为 `null`，它将显示在弹框中（参见图 4.6）。\n\n### 图 4.6. 弹框中显示的\
  \ `null` 值。\n\n![](img/0789724995_ch04lev1sec4_image07.gif)\n\n![](img/0789724995_ch04lev1sec4_image08.gif)\n\
  \n同样注意，你也可以轻松地重新显示变量的值（如下例所示），因为该值在被更改或清除之前是一一直保留的：\n\n```html\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nyourname = prompt(\"What is your name?\",\"Type your name here ...\");\n\
  alert(yourname);\nalert(yourname);\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n\n</body>\n</html>\n```\n\n为了演示你可以更改变量的值，请添加另一个 `prompt()` 方法以获得再次更改的机会：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nyourname = prompt(\"What is your name?\",\"Type your\
  \ name here ...\");\nalert(yourname);\nyourname = prompt(\"Type something different\
  \ in\",\"Something different ...\");\nalert(yourname);\n// Cloaking device off -->\n\
  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n保存页面并在浏览器中尝试。你输入到第二个提示框的文本将存储在同一个变量中，旧值会被无无地丢失。\n\
  \n**注意**\n\n没有方法可以恢复变量之前的值；在它被更改后，它就丢失了。\n\n#### 将变量值传递给另一个变量\n\n如果出于某种原因，你想保留变量的值，可以将该值传递给不同的变量。因此，在更改\
  \ `yourname` 的值之前，你可以将其传递给名为 `yourname2` 的新变量，如下：\n\n```\nyourname2 = yourname\n\
  ```\n\n这会动态创建一个名为 `yourname2` 的新变量，并赋予它与 `yourname` 相同的值。因此，在此时，两个变量具有相同的值。记住，你必须在更改第一个变量的值之前这样做！\n\
  \n以下代码演示了这一点：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nyourname = prompt(\"What is\
  \ your name?\",\"Type your name here ...\");\nalert(yourname);\nyourname2 = yourname\n\
  yourname = prompt(\"Type something different in\",\"Something different ...\");\n\
  alert(yourname);\nalert(yourname2);\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n\n</body>\n</html>\n```\n\n**练习**\n\n练习使用 `prompt()` 为动态创建的变量以及使用 `var`\
  \ 语句创建的变量赋值。\n\n练习将变量值传递给其他变量并复用变量。\n\n像既往一样，添加注释以便你理解每一步操作，并使你的代码更易读！\n\n### 接下来\n\
  \n在下一章中，你将学习一种不同的、能够容纳多个值的变量——数组。\n\n## 第 5 章.JavaScript 数组和转义字符\n\n在上一章中，你查看了如何使用变量。本章在此基础上，向你介绍了数组。\n\
  \n本章将教你以下内容：\n\n* 使用数组\n* 创建数组\n* 创建数组元素\n* 使用转义字符\n\n### 使用数组\n\n数组是大多数编程语言的强大特性，JavaScript\
  \ 程序员也可以使用它们！数组允许你在单个变量中存储多个独立的值。通常，所有这些值都有共同的主题（例如星期期的几几天）。数组非常棒，因为当你知道如何使用它们时，它们真的可以简化你的代码——让你无需创建许多具有相似名称的独立变量。\n\
  \n那么，让我们看看如何创建和使用数组。这里的示例将用于存储一周的七天。\n\n你需要做的第一件事是创建数组：\n\n```html\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nvar days_of_week = new Array(7);\n<!-- Cloaking device off -->\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n```\n\n**警告**\n\n注意 `new Array` 结尾的括号 `()`。常见的错误在这里使用了方括号\
  \ `[]`。\n\n| 描述 |\n| :--- |\n| 第一，它创建了一个名为 `days_of_week` 的变量。 |\n| 第二，你使用 `new\
  \ Array()` 定义大小。 |\n| 第三，它定义了空单元，准备接收值（参见图 5.1）。 |\n\n### 图 5.1. 一个空数组。\n\n![](img/0789724995_ch05lev1sec1_image01.gif)\n\
  \n\n\n\n### 图 5.4. 显示元素编号 2 值的警告框。\n\n![](img/0789724995_ch05lev1sec1_image05.gif)\n\
  \n![](img/0789724995_ch05lev1sec1_image06.gif)\n\n**注意**\n\n记住从 0 开始计数的约定！\n\n这里是实现相同结果另一种方法：\n\
  \n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nvar days_of_week = new Array(7);\ndays_of_week[0] =\
