  \ 常见的错误\n\n## 第 10 章：Bug——如何找到并杀死它们\n\n现在你已经有很多机会接触 JavaScript，你可能遇到了问题。本章将介绍 JavaScript\
  \ Bug 以及如何找到并杀死它们！\n\n### 什么是 Bug？Bug 是代码问题，追踪这些 Bug 的被称为调试。但为什么要用这种奇怪的比喻呢？\n\n\
  实际上，没人知道，但这个词的起源被错误地归于 40 年代的先驱程序员 Grace Hopper。1944 年，年轻的海军预备役官（她后来成为了海军将）在哈佛为\
  \ Mark I 计算机编写程序。在使用后 Mark II 时，技术人员在两个继电器之间发现了一只蛾，这就是导致程序无法运行的“虫”。这只蛾显然被展示了多年，现在属于史密森博物馆。\n\
  \n### Bug 的类型\n就像现实世界有很多种类的爬虫一样，计算机世界也有许多类型的计算机 Bug。事实上有几种不同的“物种”计算机 Bug。最常见的包括\n\
  \n*   语法错误\n*   运行时错误\n*   逻辑错误\n*   运算符优先级使用不当\n\n让我们来看看这些每一个意味着什么。\n\n#### 介绍语法错误\n\
  \n\n\n\n语法错误是程序员遇到的最常见的错误。语法是计算机语言的语法和拼写规则，由于计算机对语言比我们人类更挑剔，因此与它们通信时需要非常小心。你必须学会遵守它们的规则。这意味着，当你使用字符串时，必须将其包含在引号中。不要指想着你可以漏掉其中一个引号——计算机会抓到你的错的！\n\
  \nJavaScript 代码在加载到浏览器时会进行语法错误检查，因此任何错误都会迅速显示。\n\n以下是此类错误的示例：\n\n```\n txtString\
  \ = \"Hello there\n```\n\n另一个语法错误示例是拼写错误：\n\n```\n fnction callMe()\n{\nalert(\"\
  This script has a syntax error in the spelling of function\");\n}\n```\n\n#### 运行时错误\n\
  运行时错误发生在 JavaScript 脚本尝试执行系统无法执行的操作时。它们被称为运行时错误，因为它们可以在脚本生命周期内的任何时候发生。\n\n运行时错误常见示例是尝试调用一个不存在的函数（例如当你拼写错了函数名时）：\n\
  \n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction myFuncion()\n{\nalert(\"Hello there\");\n\
  }\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"myFunction()\"\
  >\n\n</body>\n</html\n```\n\n#### 逻辑错误\n逻辑错误并不是真正的 JavaScript 错误，而是脚本运行方式上的错误。你可能有一个计算销售税的脚本，但它没有将其加到总额中，而是减去了它。这就是逻辑错误。\n\
  \n#### 运算符优先级\n运算符优先级类似于逻辑错误，但它与数学中处理运算符的方式有关。\n\n以下是一个示例：\n\n```\n ans = num1 -\
  \ num2 * num3;\n```\n\n如果你给 `num1`、`num2` 和 `num3` 分配任意数字——例如 3、1 和 6——答案将会是多少？是\
  \ 12（3 减 1 等于 2，乘以 6）还是 -3（6 乘以 -1 等于 -6，加 3）？事实上，答案是 -3，因为运算符的处理顺序顺序。乘法在减法之前执行。\n\
  \n运算符的重要性顺序如下：\n\n* `()`— 分组\n* `--` 和 `++`— 一元运算符\n* `*` `/` 和 `%`— 乘法、除法和取模\n\
  * `+` 和 `-`— 加法和减法\n* `<`, `<=`, `>`, 和 `>=`— 小于、小于等于、大于大于等于\n* `==` 和 `!=`— 等于和不等于\n\
  * `&&`— 逻辑与\n* `||`— 逻辑或\n* `?:`— 条件\n\n**注意** \n熟悉代数优先级的同学会发现这个列表很熟悉，因为它们是相同的。\n\
  \n圆括号用于改变由运算符优先级决定的求值顺序。这意味着括号内的表达式在它的值被用于表达式其余部分之前会被求值。所以，如果你想让上一个示例等于 12，你应该这样写：\n\
  \n```\n ans = (num1 - num2) * num3;\n```\n\n接下来的示例证明了这一点（请参见 图 10.1 和 图 10.2):\n\
  \n##### 图 10.1. 一个显示 3 - 1 * 6 等于 -3 的 alert 框。\n\n![](img/0789724995_ch10lev1sec2_image01.gif)\n\
  \n![](img/0789724995_ch10lev1sec2_image02.gif)\n\n##### 图 10.2. 一个显示 (3 - 1) * 6\
  \ 等于 12 的 alert 框。\n\n![](img/0789724995_ch10lev1sec2_image03.gif)\n\n![](img/0789724995_ch10lev1sec2_image04.gif)\n\
  \n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nalert(3 - 1\
  \ * 6);\nalert((3 - 1) * 6);\n// Cloaking device off -->\n</script>\n```\n\n###\
  \ 查找错误\n让我们来看看 Netscape Navigator 4、Netscape Navigator 6 和 Internet Explorer 5.5\
  \ 如何处理以下错误：\n\n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  alrtt(\"This will not work!\");\n// Cloaking device off -->\n</script>\n```\n\n\
  在这里，注意一个简单的语法错误——“alert”的拼写。\n\n图 10.3 显示了 Netscape Navigator 4 处理此错误的方式。\n\n#####\
  \ 图 10.3. Netscape Navigator 4 中带有语法错误的 Web 页面。\n\n![](img/0789724995_ch10lev1sec2_image01.gif)\n\
  \n![](img/0789724995_ch10lev1sec2_image02.gif)\n\n\n\n\n建议你在继续阅读本章之前下载并安装 `Microsoft\
  \ Script Debugger`（微软脚本调试器）。安装过程很简单：运行你下载的可执行文件，并按照屏幕上的向导引导你完成安装过程。\n\n你可能需要采取的最后一步是检查浏览器关于脚本调试的设置。点击\
  \ `Tools`（工具）并选择 `Internet Options`（Internet 选项参见图 10.10）。\n\n#### 图 10.10 选择工具并进入\
  \ Internet Options。\n\n![](img/0789724995_ch10lev1sec5_image01.gif)\n\n点击 `Advanced`（高级）选项卡，并确保没有勾选\
  \ `Disable Script Debugging`（禁用脚本调试）（参见图 10.11）。\n\n#### 图 10.11 确保未勾选禁用脚本调试。\n\n\
  ![](img/0789724995_ch10lev1sec5_image02.gif)\n\n现在你准备好开始使用 `Microsoft Script Debugger`\
  \ 了！取你之前使用的简单语法错误示例，再次将其加载到 `Internet Explorer` 中。现在当你将此页面加载到 `Internet Explorer`\
  \ 时，你会看到一个对话框，为你提供调试页面的选项，如图图 10.12 所示。\n\n#### 图 10.12 对话框提供了调试页面的选项。\n\n![](img/0789724995_ch10lev1sec5_image03.gif)\n\
  \n如果你点击 OK，`Script Debugger` 将打开，页面上的错误会被高亮（参见图 10.13）。\n\n#### 图 10.13 在 Microsoft\
  \ Script Debugger 中打开的带有错误的页面。\n\n![](img/0789724995_ch10lev1sec5_image04.gif)\n\
  \n发现错误后，你可以打开相关文件并对 `JavaScript` 进行更改。\n\n**注意**\n\n页面在 `Script Debugger` 中是以只读方式打开的，因此无法在窗口中编辑。你必须返回实际文件并在那里进行任何必要的更改。\n\
  \n尽管 `Microsoft Script Debugger` 是一个具有许多用途的工具（包括调试服务器端 ASP 页面），但它对客户端 JavaScript\
  \ 开发者来说也很有用。这是因为大大缩短了调试 JavaScript 项目的时间。\n\n## 常见错误\n\n以下是 `JavaScript` 新手最常犯的错误示例。将这些错误展示给你，以便你意识到这类错误，并在编写代码时避免它们。它们并不是按照任何技术顺序排列的，也远不是完整的列表，但如果你能学会识别这些错误，你的\
  \ `JavaScript` 项目就有更大的可能在第一次就正常运行。\n\n### 拼写错误和打字错误！\n\n在编写 `JavaScript` 时（如果你遵循这里列出的示例），你遇到的大多数错误可能属于以下几类。打字错误发生在你在输入时不小心按了错误的键或键的组合。打字错误的示例例如：\n\
  \n*   按了错误的键：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- 隐身设备开启！\nfunction myFunction()\n{\n// 在关闭下面的括号时按错了键\nalert(\"\
  Hello there\"_;\n}\n// 隐身设备关闭 -->\n</script>\n</head>\n<body onLoad=\"myFunction()\"\
  >\n\n</body>\n</</html>\n```\n\n*   忘记按 Shift 键，例如在花括号之前：\n\n```\n <html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- 隐身设备开启！\nfunction\
  \ myFunction()\n// 在花括号前忘记按 Shift\n [\nalert(\"Hello there\");\n}\n// 隐身设备关闭 -->\n\
  </script>\n</head>\n<body onLoad=\"myFunction()\">\n\n</body>\n</</html>\n```\n\n\
  *   开启了大写锁定 (cAPS LOCK)：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- 隐身设备开启！\n// 开启了大写锁定！\nFUNCTION MYFUNCTION()\n\
  {\nalert(\"Hello there\");\n}\n// 隐身设备关闭 -->\n</script>\n</head>\n<body onLoad=\"\
  myFunction()\">\n\n</body>\n</</html>\n```\n\n*   输入了错误的数学运算符（尤其是使用数字小键盘时）：\n\n\
  ```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- 隐身设备开启！\nfunction myFunction()\n{\n// 拼接运算符错误！\nalert(\"Hello\" - \" there\"\
  );\n}\n</script>\n</head>\n<body onLoad=\"myFunction()\">\n\n</body>\n</</html>\n\
  ```\n\n拼写错误 (Spellos) 与打字错误不同，因为拼写错误发生在你输入了不正确的内容时。示例包括：\n\n*   内置方法和函数：\n\n```\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- 隐身设备开启！\nfunction myFunction()\n{\n// alert 的使用方式错误\nalert(\"Hello there\"\
  );\n}\n</script>\n</head>\n<body onLoad=\"myFunction()\">\n\n</body>\n</</html>\n\
  ```\n\n*   变量：\n\n```\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- 隐身设备开启！\nfunction myFunction()\n{\nvar msg = \"Hello there\"\
  ;\nalert(mss);\n}\n// 隐身设备关闭 -->\n</script>\n</head>\n<body onLoad=\"myFunction()\"\
  >\n\n</body>\n</</html>\n```\n\n另一种错误是使用了错误的括号。记住，`JavaScript` 使用三种：\n\n*   `()`\
  \ \n\n*   `{}` \n\n*   `[]` \n\n它们不是通用的——你必须使用正确的：\n\n```\n <html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- 隐身设备开启！\nfunction\
  \ myFunction()\n(\nvar msg = \"Hello there\"\nalert(msg);\n// 在这里\n)\n// 隐身设备关闭\
  \ -->\n</script>\n</head>\n<body onLoad=\"myFunction()\">\n\n</body>\n</</html>\n\
  ```\n\n这些只是新手经常犯的错误示例。\n\n练习\n\n回顾你过去章节的示例，并尝试回忆你遇到的困难。是否有某些错误是你经常犯的？也许你经常拼错属性或方法。也许你输入了错误的运算符。如果你习惯性地犯某种错误，请花点时间解决它——你会对结果感到惊讶。\n\
  \n### 接下来\n\n现在你已经掌握了调试的基础，是时候跳出思维，查看添加 JavaScript 的其他方法了。\n\n## 第三部分：JavaScript\
  \ 放在哪里？\n\n|  \n\n&#124;   &#124; 跳出思维（或者应该在头部？） &#124; | |\n\n## 第 11 章 跳出思维（或者应该在头部？）\n\
  \n恭喜你！你已经走到了这里！在这一非常短且快速的章节中，你不会学习任何新的 JavaScript。不，我们在这里要看的是你可以在哪里放置你的 JavaScript。\n\
  \n到为止为止你所看到的所有 JavaScript 都被限制在 Web 页面的头部，被禁在 `<script>` 标签之间。现在是时候看看我们如何编写可以突破这些限制的\
  \ JavaScript 了。\n\n本章将教你关于：\n\n*   向 Web 页面添加 JavaScript 的其他方法\n\n*   如何创建 `.JS`\
  \ 文件并链接到 Web 页面\n\n*   如何编写内联 JavaScript\n\n*   每种方法的优缺点\n\n\n\n除了嵌套在 `<script>`\
  \ 标签内部，JavaScript 还可以通过另外两个地方在网页中运行。它既可以放在一个完全独立的文件中并通过 HTML 将 JavaScript 代码链接到网页上（类似于图像作为独立文件但显示为主网页一部分的方式），也可以内联在\
  \ `<body>` 标签内以及其他合适的 HTML 元素中。这两种方法都有各自的优缺点，在本章结束时，你将很清楚地知道何时以及何处使用每种方法。这两种方法都非常简单，你很快就能学会使用它们！\n\
  \n所以，让我们先来看看如何将 JavaScript 链接到网页上。\n\n### 链接、链接、链接！\n\n将 JavaScript 链接到网页涉及将你的 JavaScript\
  \ 写在一个单独的文件中并将网页与该文件链接在一起。概念上简单，实践起来也简单！\n\n必须遵循一些约定——实际上只有一条。包含你 JavaScript 的文件应该具有\
  \ `.JS` 文件扩展名。那些喜欢探究事物工作原理以及为什么不工作的同学会发现，其他文件扩展名也是有效的。但是，`.JS` 是推荐使用的扩展名！\n\n**警告**\n\
  \n如果你发现任何链接的脚本不起作用，在开始拆解你写的代码寻找错误之前，请检查你引用的否正确的文件。这里常见的错误是保存包含 JavaScript 的文件使用了一个文件名，却尝试使用另一个文件名来链接它。\n\
  \n| ![](img/0789724995_ch11lev1sec2_image01.gif) | 无论你的示例简单还是复杂，链接的方式都是一样的。查看以下示例的逐步创建过程：\
  \ |\n\n| **1.** | 使用你最喜欢的文本编辑器（我们将使用老实实的 Windows 记事本）并输入你的 JavaScript（参见图 11.1）。你不需要\
  \ `<script>` 块、注释标签或任何内容。直接输入即可！ |\n\n##### 图 11.1. 输入到文本编辑器中的一些简单 JavaScript。\n\
  \n![](img/0789724995_ch11lev1sec2_image02.gif) |\n\n| **2.** | 将文件保存为 `first.js`，并存放在创建\
  \ HTML 页面的相同位置。 |\n\n| **3.** | 在文本编辑器中打开你的标准模板 HTML 页面。你应该看到以下内容： |\n\n```html\n\
  \ <html\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n\
  <!-- 伪装设备开启！\n\n// 伪装设备关闭 -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n\
  ```\n\n| **4.** | 去掉 `<script>` 块之间的注释标签；这些对于链接并不是必需的： |\n\n```html\n <html\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n</script>\n</head>\n\
  <body>\n\n</body>\n</html>\n```\n\n| **5.** | 链接 JavaScript 文件使用 `script` 标签的 `src`\
  \ 属性（与你使用 `img` 标签的 `src` 属性将图像引入页面非常相似）。让 `src` 属性指向 `.JS` 文件。 |\n\n| **6.** |\
  \ 保存两个文件并在浏览器中加载 HTML 页面。当页面加载时，会显示警报框表明 JavaScript 已经执行（参见图 11.2）。 |\n\n##### 图\
  \ 11.2. 执行链接的 JavaScript 文件时会显示警报框。\n\n![](img/0789724995_ch11lev1sec2_image03.gif)\n\
  ![](img/0789724995_ch11lev1sec2_image04.gif)\n\n就这样！没别的事了！它真的就像记住几点内容一样简单：\n\n*\
  \   你在文本编辑器中输入 JavaScript。\n*   `.JS` 文件中不需要 `<script>` 标签或 HTML 注释标签。\n*   你可以像往常一样注释你的代码，使用\
  \ `//` 或 `/* */`。\n*   你必须以 `.JS` 扩展名保存文件。\n*   记住使用 `<script>` 标签的 `src` 属性指向正确的文件。\n\
  \n简单！\n\n**警告**\n\n请记住，文字处理器（如 Microsoft Word 和 Lotus WordPro）并不是编写 JavaScript 的理想文本编辑器，因为它们会格式化文档的内容。这种格式化可能会导致问题。\n\
  \n为了避免这些问题，请始终使用简单的文本编辑器创建 HTML 文件和 `.JS` 文件！\n\n**练习**\n\n看看你之前的的一些 JavaScript\
  \ 示例，并将 JavaScript 放入外部的 `.JS` 文件中。经历将 JavaScript 从 HTML 页面中提取并放入新文档的过程。以 `.JS`\
  \ 扩展名保存文件并使用 `<script>` 标签中的 `src` 属性链接到它。\n\n### 内联 JavaScript\n\n内联 JavaScript\
  \ 是直接输入到网页 HTML 标签中的 JavaScript。这种方法同样简单，但它在获得简单性的同时也牺牲了功能性。这里有一个适用于简单示例的内联 JavaScript\
  \ ：\n\n```html\n <html\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- 伪装设备开启！\n\n// 伪装设备关闭 -->\n</script>\n</head>\n<body>\n\n<p onclick=\"\
  prompt('你需要几个？', '输入数量')\">点击此处指定数量</p>\n</body>\n</html>\n```\n\n点击文本会弹出提示框，如图\
  \ 11.3 所示。\n\n##### 图 11.3. 点击文字时显示提示框。\n\n![](img/0789724995_ch11lev1sec2_image02.gif)\n\
  \n注意，所有的 JavaScript 都在 `<body>` 中。这里有一个更复杂的示例，其中根据数量确定费用：\n\n```html\n <html\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- 伪装设备开启！\n\n\
  // 伪装设备关闭 -->\n</script>\n</head>\n<body>\n<p onclick=\"units = prompt('你需要几个？',\
  \ '输入数量'); alert('单价为 $9.99，因此 ' + units + ' 个的总价为 $' + units * 9.99)\">点击此处指定数量</p>\n\
  </body>\n</html>\n```\n\n注意此 JavaScript 示例中的第二个语句跟在分号后面并在同一行，而不是另起一行（参见图 11.4）。\n\
  \n##### 图 11.4. 执行中的修改 JavaScript。\n\n![](img/0789724995_ch11lev1sec2_image03.gif)\n\
  \n正如从前面的示例所示，内联 JavaScript 允许你快速地向页面添加小的 JavaScript 代码段。你可以随时随地添加它们添加。\n\n### 何时使用\
  \ `<head>`、何时链接、何时内联！\n\n有选择的问题在于不知道选择哪一个！幸运的是，通过遵循一些简单的准则，你可以得出正确的结论。\n\n**准则一**：如果你使用的\
  \ JavaScript 很大，忘记内联，选择 `<head>` 或链接文件。\n\n**准则二**：如果你想向多个 HTML 页面添加相同的 JavaScript，链接文件将使添加和更新脚本变得简单。\n\
  \n**准则三**：想向页面添加一次性的 JavaScript？使用内联代码。\n\n**准则四**：记住你可以混合使用这三种类型。对于跨页面重复使用的多数 JavaScript\
  \ 使用链接文件，将其他庞大的 JavaScript 放在 `<head>` 中，并将一次性的 JavaScript 内联。\n\n**准则五**：如果不确定，就放在\
  \ `<head>` 中！\n\n**提示**：在一个页面中同时使用所有类型初看起来可能复杂，但你很快就能掌握；诀窍在于练习、练习、再练习！\n\n\n\n\n\
  \n这是一个简单的练习。回顾一下你在前面的章节中创建的一些示例，并决定这三个选项中哪种最合适（你不需要实际操作；只需梳理思考过程即可）。哪些最适合内联 JavaScript？哪些最适合链接文件？哪些最适合留在\
  \ `<head>` 中？\n\n### 接下来要做什么\n\n你已经掌握了 JavaScript！现在，你就可以开始通过将 JavaScript 与动态 HTML（Dynamic\
  \ HTML）的力量结合，真正开始发挥 JavaScript 赋予你的力量了！\n\n## 第四部分：JavaScript 与动态 HTML\n\n| 动态 HTML\
  \ 与 JavaScript |\n| 层叠样式表与 JavaScript！ |\n| JavaScript 与文档对象模型 |\n| 示例、示例、示例！ |\n\
  \n## 第 12 章：动态 HTML 与 JavaScript\n\n到目前为止，你看到的几乎所有内容都是纯 JavaScript（好吧，某些方面，如 `alert`、`confirm`\
  \ 和 `prompt` 框并不严格属于 JavaScript，但如果没有一些输入和输出，很难做任何事情）。JavaScript 是强大的，可以做很多，但你是否注意到它与浏览器的实际整合不足？这是因为直到现在，你仅仅关注的是\
  \ JavaScript 能做什么以及如何做（请记住，几年前，我们目前为止作为示例看到的那些内容就是 JavaScript 所能做的局限性！）。下一步，也是最后一步，是将\
  \ JavaScript、HTML 以及浏览器提供的技术结合，创建混合技术——动态 HTML（DHTML）！\n\n本章将教你以下内容：\n\n* 什么是 DHTML\n\
  * 哪些技术构成了 DHTML\n* 使用 DHTML 可以实现的一些功能\n\n### DHTML 世界\n\n动态 HTML 是一个集合术语。它由新的 HTML\
  \ 标签、选项以及由脚本提供的编程组合而成，让你能够创建比以往任何时候都具有动画感、交互性和响应性的 Web 页面。DHTML 甚至可以允许 Web 页面的行为和感觉就像在计算机上运行的其他应用程序一样，模糊了硬盘和互联网之间的界限。\n\
  \n组成 DHTML 的特性首次出现在 Netscape Navigator 4 和 Microsoft Internet Explorer 4 中。虽然 DHTML\
  \ 的核心（植根于 HTML 4.0 标准）被这两个浏览器都支持，但额外的技术仅由其中一个支持。这是开发者在 Web 页面上使用 DHTML 时面临的问题之一；另一个主要问题是许多\
  \ Web 用户没有使用最新浏览器，仍在使用版本 3 或更早的版本。\n\n注意\n关于各种浏览器的 DHTML 相关问题（不仅是 Internet Explorer\
  \ 和 Navigator 之间的差异，还跨越版本的差异）本身就可以写成一两本书了！你在这里涵盖的是如何编写将与各种 DHTML 技术交互的 JavaScript。在可能的情况下，示例将在所有浏览器上运行。\n\
  \n若要深入了解专有的 DHTML 技术，请访问 `http://msdn.microsoft.com/workshop` 获取 Internet Explorer\
  \ 的信息，并访问 `http://developer.netscape.com` 获取 Netscape Navigator 的信息。\n\n### DHTML\
  \ 的概念和特性\n\nMicrosoft 和 Netscape 的 DHTML 包含以下：\n\n* Web 页面及其所有元素的面向对象的视图\n* 层叠样式表（CSS）和内容分层\n\
  * 可以处理所有（或至少是）页面元素的脚本\n* 动态字体\n\n注意\n本书未涵盖动态字体。\n\n提示\n你们中的许多人可能已经熟悉这些技术；如果是这样，欢迎跳过本节，或者跟我们其他人一起学习。\n\
  \n#### 页面元素的面向对象视图\n\n页面上的每个元素（分段或节、标题、段落、图像、列表、表单等）都被视为一个对象。\n\n注意\nMicrosoft 称为动态\
  \ HTML 对象模型（DOM）；Netscape 称之为 HTML 对象模型（DOM）；而 W3C（Web 标准组织）称之为文档对象模型（DOM）。这些都是同一个东西的不同名称；你自己去琢磨吧！\n\
  \n例如，页面上的每个超链接、标题或文本段落都可以命名、赋予文本样式和颜色的属性，并在包含的页面脚本中通过名称进行访问。该脚本可以用许多语言中的一种编写（例如，`VBScript`），但在这里你自然会看到使用\
  \ JavaScript 来完成这一点！页面上的此元素可以根据指定事件的结果进行更改，例如鼠标悬停在其上方、被点击、按下键或时间的流逝。\n\n不仅可以更改文字内容和颜色，对象中包含的所有内容都可以被替换为新内容，包括新的或额外的\
  \ HTML，以及不同的文本和图像。\n\n#### 样式表与分层\n\n样式表用于描述文档的默认特性。这包括页面布局、字体类型和大小。\n\n就 Web 页面而言，样式表还描述了页面上的默认背景颜色或图像、超链接颜色等。样式表是确保所有页面或一组页面一致性的极佳方法，因为一个样式表可以附加到组成网站的许多文档上。\n\
  \n注意\n就像你可以在页面头部、内联或链接 JavaScript 一样，样式表也是如此——这使得它们非常有用且多功能！\n\n分层是使用样式表通过提供层来改变\
  \ Web 页面的内容。这些层（每个层都有自己的内容，如文本或图像）可以叠加在现有内容之上。层可以被程序化为用户交互（例如点击按钮）的结果或作为演示的一部分\n\
  \n### 脚本\n\n脚本是 DHTML 的第三组成部分，也是本书的重点。脚本已经存在段时间并有多种形式（`JavaScript`、`VBScript`、`Java\
  \ applet`、`ActiveX controls` 等），但 DHTML 为 Web 页面提供了更多的编程能力，因为大多数页面元素都可以通过脚本进行处理。\n\
  \n### 为什么浏览器之间存在差异？\n\nWeb 开发新手经常问的问题是：“为什么 Netscape Navigator 和 Microsoft 的 Internet\
  \ Explorer 之间存在差异？”简单的回答是它们就是如此。更详细的回答涉及浏览器及其制造商的历史。就像你使用的任何其他软件软件包一样，每个浏览器制造商都有不同的处理方式，并为浏览器添加他们自己的功能。以两个文字处理器为例。界面会不同，文件格式也会不同。按钮和热键也会不同，结果人们会有自己经常使用的喜欢的文字处理器，并且不喜欢更换品牌。\n\
  \n\n\n\n如果存在几种不同的电视标准，你只有在拥有正确的电视机的情况下观看某些节目，那会怎样？你难道需要准备三、四台不同的电视，以便涵盖所有的标准和技术吗？不，这行不通，Web\
  \ 领域也是如此：用户和开发者都对浏览器之间不断扩大的差距感到厌倦了。\n\n幸运的是，这种差距已经开始缩小，但还需要几年时间，技术和标准之间的差距才能小到不再产生影响的程度。\n\
  \n但增加难度的是，你仍然必须考虑所有没有将浏览器升级到最新版本的用户。\n\n### 你可以用 DHTML 做什么？\n\n实际上，这种可能性几乎是无限的。现在的网页更接近于微应用程序，而不是静态文档。如果你在\
  \ Web 上冲荡一会儿，你会遇到各种将 DHTML 良好（或不当）利用的示例。幻灯片、具有自定义界面的网站、图像悬停和动画、屏幕上文本的交互式演示、游戏、表单检查和计算器都是可能的，而且还有更多、更多！\n\
  \n在本书的剩余章节中，你将看到 JavaScript 如何应用于用户要求的某些常见 Web 任务中，同时学习它是如何工作以及为什么要这样工作的。\n\n**提示**\n\
  \n继续吧，去进行一次网络探险，搜寻技术并看看你能发现什么。重新访问你喜喜欢的一些网站，看看它们使用了多少交互和 DHTML。你喜欢什么？你想自己尝试什么？\n\
  \n为了让 DHTML 起工作，JavaScript 需要与两项关键技术交互。这些是浏览器的对象模型和页面上的样式表信息（也是文档对象模型的一部分）。对象模型控制浏览器及其内部的文档，而样式表控制页面上元素的格式和布局。\n\
  \n### 接下来是什么\n\n在下一章中，你将发现如何使用样式表，并看到如何使用 JavaScript 来控制它们并开始让你的网页变得动态化！\n\n## 第\
  \ 13 章。级联样式表与 JavaScript！\n\n级联样式表（也称为样式表或 CSS）可能是格式化 HTML 文档最好的方式。CSS 不仅快速且易于使用，它还是为整个\
  \ Web 网站实现一致外观和感受的最佳方法。\n\n本章将教你以下内容：\n\n*   CSS 简单历史\n*   CSS 简介\n*   CSS 和 JavaScript\
  \ 如何相互交互\n*   JavaScript/CSS 示例\n\n### 级联样式表的简单历史\n\nCSS Level 1 由 W3C 联盟于 1996\
  \ 年 12 月采纳为标准，它迈出了大一步，将网页的内容（文本、图像等）与页面的格式（布局和文本增强，如字体信息）分离开。这让 HTML 回到了简单的以功能为导向（而不是以形式为导向），同时让用户对页面外观拥有近乎完全控制。\n\
  \n1998 年 5 月，CSS 标准发生了变化并采纳了 CSS2，这让 Web 开发者对网页有了更多的控制权。该标准建立在现有的 CSS Level 1 之上，并增加了功能，例如在网页上精确定位元素和对象的能力，以及允许屏幕阅读软件读取网页内容的听力样式表（这对于视觉障碍的\
  \ Web 浏览者非常有用）。\n\n**注意**\n\n本书不可能涵盖 CSS 的全部——CSS 本身是一项庞大且技术丰富的技术。因此，我们所能做的只是让你领略它。幸运的是，Web\
  \ 有许多很好的 CSS 资源可以提供帮助。这里是微软提供的几个与 CSS 相关的 Web 资源：\n\n*   http://msdn.microsoft.com/workshop/author/css/usingcss.asp\n\
  *   http://msdn.microsoft.com/workshop/author/css/css.asp\n*   http://msdn.microsoft.com/workshop/author/css/reference/attributes.asp\n\
  \nNetscape 也提供了一个很好的 CSS 资源，可以在以下地址找到：\n\n*   http://developer.netscape.com/tech/css/\n\
  \n这些链接在写作时是正确的，但可能会发生变化。\n\n**提示**\n\n如果你还不认识 CSS，不要担心。本章并不假设你对它有任何了解。然而，到本章结束时，你将获得一些\
  \ CSS 技巧和窍门，可以将它们加入到你的 Web 开发工具箱中，并立即在你的 Web 项目中使用它们。然后你可以从容来，在自己的时间里学习如何充分利用 CSS。\n\
  \n### CSS 简介\n\n表面上看，CSS 似乎很复杂，但幸运的是它并不复杂！在最简单的形式中，为网页添加 CSS 就像向现有的 HTML 标签中添加一些新属性一样简单。\n\
  \n考虑这个简单的网页：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device on -->\n\
  </script>\n</head>\n<body>\n<h1>Welcome to this page!</h1>\n<p>A lot of interesting\
  \ text goes here! A lot of interesting text goes here! A lot of\ntext goes here!\
  \ A lot of interesting text goes here! A lot of text\n goes here!</p>\n</body>\n\
  </html>\n```\n\n假设你想用 CSS 给标题添加下划线。为了这一点，你首先在 `<h1>` 标签中插入 `style` 属性：\n\n```html\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device on -->\n</script>\n</head>\n<body>\n\
  <h1 style=\"\">Welcome to this page!</h1>\n<p>A lot of interesting text goes here!\
  \ A lot of interesting text goes here! A lot of\ntext goes here! A lot of interesting\
  \ text goes here! A lot of text\n goes here!</p>\n</body>\n</html>\n```\n\n接下来，在引号内部添加\
  \ CSS 属性 `text-decoration`：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device\
  \ on -->\n</script>\n</head>\n<body>\n<h1 style=\"text-decoration\">Welcome to this\
  \ page!</h1>\n<p>A lot of interesting text goes here! A lot of interesting text\
  \ goes here! A lot of\ntext goes here! A lot of interesting text goes here! A lot\
  \ of text\n goes here!</p>\n</body>\n</html>\n```\n\n最后，你需要属性的值——在这种情况下，为了添加下划线你需要\
  \ `underline`。属性和值之间用冒号分隔，所以这需要放在它们之间：\n\n```html\n <html>\n<head>\n<title>A Simple\
  \ Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\n//\
  \ Cloaking device on -->\n</script>\n</head>\n<body>\n<h1 style=\"text-decoration:underline\"\
  >Welcome to this page!</h1>\n<p>A lot of interesting text goes here! A lot of interesting\
  \ text goes here! A lot of\ntext goes here! A lot of interesting text goes here!\
  \ A lot of text\n goes here!</p>\n</body>\n</html>\n```\n\n现在，保存页面并在浏览器中查看结果（参见\
  \ 图 13.1）！\n\n##### 图 13.1 用于给标题添加下划线的 CSS。\n\n![](img/0789724995_ch13lev1sec2_image09.gif)\n\
  \n![](img/0789724995_ch13lev1sec2_image10.gif)\n\n看看以下一些简单的示例，你以后查看如何使用 JavaScript\
  \ 更改分配给 CSS 属性的值时可以使用。\n\n#### 示例 1——更改文本颜色\n\n在这里，使用 CSS 将标题中的文本设置为红色（输出参见 图 13.2）：\n\
  \n\n\n\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n<h1 style=\"color:red\">欢迎来到此页面！</h1>\n<p>这里有很多有趣的文本！这里有很多有趣的文本！这里有很多\
  \ \ninteresting text goes here! A lot of interesting text goes here! A lot of \n\
  interesting text goes here! A lot of interesting text goes here!</p>\n</body>\n\
  </html>\n```\n\n### 图 13.2. 用于将标题颜色改为红色的 CSS（你可能想亲自尝试一下！）。\n\n![](img/0789724995_ch13lev1sec2_image13.gif)\n\
  \n![](img/0789724995_ch13lev1sec2_image14.gif)\n\n这里是一些其他可用的 CSS 命名颜色：\n\n| 青色 (aqua)\
  \ | 黑色 (black) | 蓝色 (blue) |\n| 品红 (fuchsia) | 灰色 (gray) | 绿色 (green) |\n| 石灰绿 (lime)\
  \ | 栗色 (maroon) | 深蓝色 (navy) |\n| 橄榄色 (olive) | 紫色 (purple) | 红色 (red) |\n| 银色 (silver)\
  \ | 青绿色 (teal) | 白色 (white) |\n| 黄色 (yellow) | | |\n\n### 练习\n\n使用这些颜色尝试你自己的示例！\n\
  \n#### 示例 2—格式化文本\n\n你已经看到了如何使用 CSS 添加下划线或更改某些文本的颜色。但还可以做更多。首先，使用几个 CSS 属性就可以实现**粗体**、*斜体*、上划线和删除线（参见图\
  \ 13.3）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n<h1 style=\"text-decoration:underline\">欢迎来到此页面！</h1>\n<p><span\
  \ style=\"font-weight:bold\">粗体</span>文本的示例</p>\n<p><span style=\"font-style:italic\"\
  >斜体</span>文本的示例</p>\n<p><span style=\"text-decoration:overline\">上划线</span> 文本的示例\
  \ - 在 Netscape Navigator 4 中不起作用！</p>\n<p><span style=\"text-decoration:line-through\"\
  >删除线</span>文本的示例</p>\n<p><span style=\"text-transform:uppercase\">大写</span>文本的示例</p>\n\
  <p><span style=\"text-transform:lowercase\">小写</span>文本的示例</p>\n</body>\n</html>\n\
  ```\n\n### 图 13.3. 在 Internet Explorer 5 中显示的某些 CSS 文本效果。\n\n![](img/0789724995_ch13lev1sec2_image16.gif)\n\
  \n![](img/0789724995_ch13lev1sec2_image17.gif)\n\n所有 CSS 效果在 Internet Explorer 5\
  \ 中均运行良好。\n\n如图 13.4 所示，这些效果在 Netscape Navigator 6 中同样有效。\n\n### 图 13.4. 在 Netscape\
  \ Navigator 6 中显示的某些 CSS 文本效果。\n\n![](img/0789724995_ch13lev1sec2_image18.gif)\n\
  \n![](img/0789724995_ch13lev1sec2_image19.gif)\n\n然而，Netscape Navigator 4 在处理上划线时遇到了一些问题（参见图\
  \ 13.5）。\n\n### 图 13.5. 在 Netscape Navigator 4 中显示的某些 CSS 文本效果。注意上划线效果不起作用。\n\n\
  ![](img/0789724995_ch13lev1sec2_image20.gif)\n\n![](img/0789724995_ch13lev1sec2_image21.gif)\n\
  \n注意所有的 CSS 格式都在 HTML 标签 `<span>` 内部。当你想要封装文本以应用 CSS 而不影响其其他部分时，这个标签是理想的的。`<span>`\
  \ 标签是一个容器元素，它不会向文本传递任何自身的格式，因此非常适合此类用途。\n\n### 练习\n\n在你自己的项目中尝试这些 CSS 属性，特别是当它们对你来说是新概念时。也尝试一下\
  \ `<span>` 标签！\n\n#### 示例 3—格式化超链接\n\n使用 CSS 可以做的另一个酷炫的功能是让超链接看起来更有趣。这种技术与你目前为止看到的\
  \ CSS 不同，因为这次你从内联 CSS（标签本身中的样式信息——此处“内联”的含义与指代 JavaScript 时的相同）转变为放置在文档头部 `<style>`\
  \ 块中的、应用于整个页面的 CSS。\n\n让我们看看完成所需的步骤。\n\n##### 第 1 步—创建一个带有超链接的页面\n\n这里有一个页面：\n\n\
  ```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n<h1 style=\"text-decoration:underline\">欢迎来到此页面！</h1>\n<a href=\"http://www.mcp.com\"\
  >超链接</a>\n<br>\n<a href=\"http://www.kingsley-hughes.com\">另一个超链接</a>\n</body>\n\
  </html>\n```\n\n##### 第 2 步—添加样式\n\n很多人使用 `<style>` 块。这是一个示例：\n\n```html\n <html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\n\n// Cloaking device off -->\n</script>\n<style>\n\n</style>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n##### 第 3 步—添加正确的属性\n\n可以使用几个 CSS 属性为超链接添加特殊效果：\n\
  \n* `a:hover`：当访问者将指针悬停在超链接上时更改其样式。当指针移开后，链接恢复正常。然而，它在 Netscape 4 中不起作用。\n* `a:active`：当访问者点击链接跟随它时，更改其样式。\n\
  * `a:visited`：当访问者最近访问过该链接时，更改其样式。\n* `a:link`：设置访问者尚未访问过的链接的样式。\n\n下面的示例查看 `a:hover`。要使用此属性，你首先需要将其输入样式块中：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n<style>\n\
  <!--\na:hover\n-->\n</style>\n</head>\n<body>\n</body>\n</html>\n```\n\n##### 第\
  \ 4 步—更改超链接\n\n最后一步是添加控制超链接变化的 CSS 信息。这些样式信息放在 `a:hover` 之后的大括号内。再次注意与 JavaScript\
  \ 的相似之处：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n\
  <style>\n<!--\na:hover { }\n-->\n</style>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n你希望超链接在鼠标指针悬停在它上方时变为红色，因此在大括号内添加 `color:red`。\n\n\n\n\n\n```html\n<html\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\n\n// Cloaking device off -->\n</script>\n<style>\n<!--\na:hover { color:red}\n\
  -->\n</style>\n</head>\n<body>\n<h1 style=\"text-decoration:underline\">Welcome\
  \ to this page!</h1>\n<a href=\"http://www.mcp.com\">A hyperlink</a>\n<br>\n<a href=\"\
  http://www.kingsley-hughes.com\">Another hyperlink!</a>\n</body>\n</html>\n```\n\
  \n你可能还想为它添加一个看起来很智能的上划线。要做到这一点，你可以在第一个属性值对（`color:red`）之后添加 `text-decoration:overline`，并使用分号将两者隔开：\n\
  \n```html\n<html\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n<style>\n\
  <!--\na:hover { color:red; text-decoration:overline}\n-->\n</style>\n</head>\n<body>\n\
  <h1 style=\"text-decoration:underline\">Welcome to this page!</h1>\n<a href=\"http://www.mcp.com\"\
  >A hyperlink</a>\n<br>\n<a href=\"http://www.kingsley-hughes.com\">Another hyperlink!</a>\n\
  </body>\n</html>\n```\n\n*(注：由于您提供的文本在第一个代码块后变得不完整，后续关于 Step 5、Example 4 等内容未包含在输入中。)*\n\
  \n\n\n\n在本示例中，使用了另一个容器元素——`<div>` 标签来包裹图像（参见图 13.15）。\n\n### 图 13.15. 定位的图像现在在 Netscape\
  \ Navigator 4 中正常显示。\n\n![](img/0789724995_ch13lev1sec2_image40.gif)\n\n![](img/0789724995_ch13lev1sec2_image41.gif)\n\
  \n如果你尝试不使用 `absolute`（绝对定位），而是使用 `relative`（相对定位），你就会开始看到差异了（参见图 13.16）：\n\n```html\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\n\n// Cloaking device off -->\n</script>\n<style>\n\
  <!--\n\n-->\n</style>\n</head>\n<<body>\n<h1 style=\"text-decoration:underline\"\
  >Welcome to this page!</h1>\n<div style=\"position:relative;top:125px;left:200px\"\
  >\n<img src=\"circle.gif\">\n</div>\n</body>\n</</html>\n```\n\n### 图 13.16. 相对定位的图像在页面上的位置比绝对定位的图像靠下。\n\
  \n![](img/0789724995_ch13lev1sec2_image42.gif)\n\n![](img/0789724995_ch13lev1sec2_image43.gif)\n\
  \n此图像在页面上靠下的的原因是，定位起点（即浏览器移动图像的点）是图像在没有 CSS 信息时本应占据的位置。当你想要创建偏移量（例如将图像向右缩进几像素以形成边距）时，这是一个非常方便的方法。\n\
  \n#### 示例 5—三维工作（确切说是 2.5D！）\n\n2.5D 指不仅能够控制页面上图像和文本的 `top` 和 `left` 位置，还能控制元素的堆叠顺序。通常情况下，在\
  \ HTML 中，堆叠顺序是由对象在 HTML 代码中的位置决定的。如果一个元素在代码位置上位于另一个元素的下方，那么它在显示上会在上方。这里是一些文本，图像在\
  \ HTML 中位于其下方（图 13.17 显示了结果）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device\
  \ off -->\n</script>\n<style>\n<!--\n-->\n</style>\n</head>\n<<body>\n<h1 style=\"\
  position:absolute;top:15px;left:10px;text-decoration:underline\"> Welcome to \n\
  this page!</h1>\n<div style=\"position:absolute;top:15px;left:200px\">\n<img src=\"\
