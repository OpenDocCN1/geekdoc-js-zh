  \n |\n\n练习\n\n练习使用前面示例所示的算术运算符。\n\n#### 关系运算符\n\n关系运算符用于比较。这些运算符如下：\n\n*   小于：`<`\n\
  \    ```\n    5 < 6\n    ```\n*   小于等于：`<=`\n    ```\n    6 <= 6 or 6 <= 7\n   \
  \ ```\n*   大于：`>`\n    ```\n    7 > 4\n    ```\n*   大于等于：`>=`\n    ```\n    5 >=\
  \ 5 or 5 >= 4\n    ```\n*   等于：`==`\n    ```\n    5 == 5\n    ```\n*   不等于：`!=`\n\
  \    ```\n    5 != 3\n    ```\n\n注意\n\n这些都是二元运算符。\n\n\n\n\n在这里，你看到了数字比较的示例，但你也可以将它们用于字符串。（稍后会详细介绍。）最需要遵守的一点是，比较的两个对象必须是相同类型。如果类型不同，`JavaScript`\
  \ 会尝试将数据从一种类型转换为另一种类型，但这并不总是成功的。为了安全起见，请保持被比较的对象类型相同。\n\n## 逻辑运算符\n\n逻辑运算符的工作原理并不十分清晰。当你开始在语句（例如\
  \ `If` 语句）中使用它们时，它们的功能就会变得清晰。\n\n三个逻辑运算符如下：\n\n* 逻辑与 (and)\n    ```\n     &&\n \
  \   ```\n* 逻辑或 (or)\n    ```\n     ||\n    ```\n* 逻辑非 (not)\n    ```\n     !\n \
  \   ```\n\n**注意**\n逻辑与和逻辑二是二运算符，而逻辑非是非元运算符。\n\n这些运算符允许将多个变量测试的结果合并为一个易于使用的结果。\n\n\
  逻辑与 (`&&`) 意味着双方都必须为真。`&&` 的一个真实世界例子可能是司机在刹车前的思考过程：汽车行驶得太快 `&&` 司机想减速。\n\n逻辑或 (`||`)\
  \ 意味着至少一方必须为真。再次使用汽车类比，司机在开启大灯前的思考过程可能是：天黑了 `||` 视线差。\n\n逻辑非 (`!`) 返回真/假的反向结果。所以，要开启汽车大灯，光必须是\
  \ `!` 亮的（因此是黑暗的）。\n\n**注意**\n如果现在觉得这些某些内容看起来有些模糊，不要担心。你以后会有很多机会使用它们，当你创建了几个真实的 `JavaScript`\
  \ 示例后，你一定会掌握其精髓的！\n\n## 其他一元运算符\n\n顾名，这些作用于单一值的一元运算符。这些运算符是：\n\n* 前缀和后缀递增\n    ```\n\
  \     ++\n    ```\n* 前缀和后缀递减\n    ```\n     --\n    ```\n* 一元加\n    ```\n     +\n\
  \    ```\n* 一元负\n    ```\n     -\n    ```\n\n一元负简单地将值的符号从负变为正，反反之亦然。在这四个运算符中，它是最容易理解的。另一方面，一元加并不这样做；它用于将操作数转换为数字类型（例如，从字符串转换）。\n\
  \n前缀/后缀递增/递减运算符提供了一种快速简单的方法来实现 `x = x + 1` 和 `x = x - 1`。然而，前缀和后缀部分对这些运算符的使用结果产生整体影响。\n\
  \n前缀运算符简单且按预期工作。\n\n如果 `a = 5`，那么\n\n```\n ++a + 2 = 8\n```\n因为 `a` 在加 2 之前已经递增到了\
  \ 6，而\n\n```\n --a + 2 = 6\n```\n因为 `a` 在加 2 之前已经减了 1 到 4。\n\n后缀运算符的作用方式不同，因为递增或递减是在表达式使用旧值之后才执行。所以，如果\
  \ `a = 5`，那么\n\n```\n a++ + 2 = 7\n```\n因为只有在表达式执行后才进行递增。\n\n此情况也适用于：\n\n```\n a--\
  \ + 2 = 7\n```\n这是因为 `a` 的递减是在表达式使用旧值之后才执行的。\n\n**提示**\n记住这一点最好的方法是：如果运算符在前面（前缀），则先执行操作。然而，如果它们在后面（后缀），则在表达式之后执行操作。\n\
