  \n## 复习字符串和数字\n\n| ![](img/0789724995_ch06lev1sec3_image01.gif) | 让我们通过一个非常简单的 JavaScript\
  \ 计算器示例来快速复习字符串和数字！在这个示例中，你不仅将看到使用运算符的方法，还将发现如何通过名为“类型转换”（type conversion）的过程将字符串数字转换为真正的数字。\
  \ |\n\n### JavaScript 计算器\n\n| **1.** | 从最基础的 HTML 模板开始： \n\n```html\n<html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\n\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n\
  ``` | |\n\n| **2.** | 在这里声明你将要使用的变量。对于用户将输入的每个数字，你应该有两个变量——一个用于用户想要使用的运算符，最后一个用于存储答案：\
  \ \n\n```html\n<html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nvar num1, op, num2, ans;\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n``` | |\n\n| **3.** |\
  \ 接下来，使用 `prompt()` 方法提示用户输入第一个数字，并将其赋值给变量 `num1`： \n\n```html\n<html>\n<head>\n\
  <title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nvar num1, op, num2, ans;\nnum1 = prompt(\"Enter a number:\",\"a number\"\
  );\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n\
  ``` | |\n\n| **4.** | 添加另一个 `prompt`，这次是询问要使用的运算符。将此值赋值给变量 `op`： \n\n```html\n<html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nvar num1, op, num2, ans;\nnum1 = prompt(\"Enter a number:\",\"a number\"\
  );\nop = prompt(\"Enter an operator (+, -, *, / and %)\", \"operator\");\n// Cloaking\
  \ device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n``` | |\n\n| **5.**\
  \ | 接下来，添加另一个 `prompt` 用于获取第二个数字。这被赋值给 `num2`： \n\n```html\n<html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  var num1, op, num2, ans;\nnum1 = prompt(\"Enter a number:\",\"a number\");\nop =\
  \ prompt(\"Enter an operator (+, -, *, / and %)\", \"operator\");\nnum2 = prompt(\"\
  Enter another number:\", \"a number\");\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n``` | |\n\n| **6.** | 现在，执行求和。在这里，你必须使用 `eval()`\
  \ 方法计算求和。该方法会为你完成数学计算。然而，在进行计算之前，你需要将字符串变量 `num1` 和 `num2` 转换为数字。你可以通过将它们声明为数字来实现这一点。计算的结果被传递给变量\
  \ `ans`： | |\n\n注意\n\n`eval()` 方法将在后面的章节中进行更详细介绍。\n\n```html\n<html>\n<head>\n<title>A\
  \ Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking device on!\n\
  var num1, op, num2, ans;\nnum1 = prompt(\"Enter a number:\",\"a number\");\nop =\
  \ prompt(\"Enter an operator (+, -, *, / and %)\", \"operator\");\nnum2 = prompt(\"\
  Enter another number:\", \"a number\");\nans = eval(Number(num1)+ op + Number(num2));\n\
  // Cloaking device off -->\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\
  \ | |\n\n| **7.** | 最后，使用 `alert()` 方法显示 `ans` 的值。在弹出框中，你会看到总和是通过将变量值与空格以及等号（`=`）拼接而重建并显示的，这使得输出清晰且无歧：\
  \ \n\n```html\n<html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nvar num1, op, num2, ans;\nnum1 = prompt(\"\
  Enter a number:\",\"a number\");\nop = prompt(\"Enter an operator (+, -, *, / and\
  \ %)\", \"operator\");\nnum2 = prompt(\"Enter another number:\", \"a number\");\n\
  ans = eval(Number(num1)+ op + Number(num2));\nalert(num1 + \" \" + op + \" \" +\
  \ num2 + \" = \" + ans);\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\
  \n</body>\n</html>\n``` | |\n\n| **8.** | 保存文件并将其到浏览器。在提示框中输入数字并观察它如何计算！![](img/0789724995_ch06lev1sec3_image01.gif)\
  \ | |\n\n\n\n\n### 简介\n`if` 语句允许你的 JavaScript 脚本在两组备选语句中选择一组来运行（或执行）。这种选择是通过布尔（`true`\
  \ 或 `false`）条件完成的。\n\n让我们重新回顾这个示例中的确认框，并看看如何使用 `if` 语句让这种类型的消息框工作。\n\n你必须做的第一件事是使用\
  \ `confirm()` 方法创建一个简单的确认框：\n\n```javascript\n <script language=\"JavaScript\">\n\
  <!-- Cloaking device on!\nconfirm(\"Do you want to proceed with this book? Click\
  \ OK to proceed otherwise click Cancel.\");\n// Cloaking device off -->\n</script>\n\
  ```\n\n现在它向用户展示了两个选项：确定和取消（请参见 图 7.1）。接下来，让我们编写代码来处理那些点击 确定的人（没人会想到点击取消，对吧？）。\n\n\
  ##### 图 7.1. 显示的确认框。\n\n![](img/0789724995_ch07lev1sec3_image01.gif)\n![](img/0789724995_ch07lev1sec3_image02.gif)\n\
  \n当用户点击 确定时，她创建了一个布尔值 `true`，你可以用它来检测她点击了什么。为了做到这一点，你必须为 `confirm()` 方法分配一个变量，如下所示：\n\
  \n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar\
  \ response = confirm(\"Do you want to proceed with this book? Click OK to proceed\n\
  otherwise click Cancel.\");\n// Cloaking device off -->\n</script>\n```\n\n这个变量\
  \ `response` 存储了用户对问题的回答（与 `prompt()` 方法非常类似，该变量存储了用户输入的字符串）。因此，如果（或当！）她点击 确定时，值\
  \ `true` 就会被赋值给变量 `response`（请参见 图 7.2）。你可以使用 `if` 语句来查找这个值。\n\n##### 图 7.2. 点击\
  \ 确定后显示的警报框。\n\n![](img/0789724995_ch07lev1sec3_image04.gif)\n![](img/0789724995_ch07lev1sec3_image05.gif)\n\
  \n以下是实现此功能的 JavaScript 代码：\n\n```javascript\n <script language=\"JavaScript\">\n\
  <!-- Cloaking device on!\nvar response = confirm(\"Do you want to proceed with this\
  \ book? Click OK to proceed\notherwise click Cancel.\");\nif ( response == true\
  \ )\n{\nalert(\"A fine choice!\");\n}\n// Cloaking device off -->\n</script>\n```\n\
  \n让我们逐行分析这段代码：\n\n```javascript\n if ( response == true )\n```\n\n这一行是 `if` 语句的开始（注意它不是以分号结尾的），它包含一个条件，询问\
  \ `response` 的值是否被设置为 `true`。如果是，你就移动到下一行。\n\n下一行包含左大括号（`{`），对于很多初接触 JavaScript\
  \ 的学者来说，这个字符很难理解。然而，大括号的作用非常直接。大括号（`{` 和 `}`）用于封装语句以保持清晰。\n\n> **提示**\n>\n> 将大括号想象成语句内的段落——所以如果某事为真，则执行：\n\
  >\n> ```javascript\n> {\n>  this;\n>  that;\n>  and the other;\n> }\n> ```\n\n>\
  \ **注意**\n>\n> 关于大括号的位置有几种观点。但这里的习惯是将它们放在单独的行，以获得最佳的 JavaScript 清晰度。\n\n继续下一行，这用于显示警报框，祝贺用户做出了正确的选择。最后，你会看到右大括号（`}`）。\n\
  \n如果你保存此文件并将其加载到浏览器中，就可以观察它是运行的。\n\n首先，你会收到确认框的欢迎（请参见 图 7.3）。\n\n##### 图 7.3. 确认框向你问好。\n\
  \n![](img/0789724995_ch07lev1sec3_image07.gif)\n![](img/0789724995_ch07lev1sec3_image08.gif)\n\
  \n然后，当你点击 确定时，它会被警报框取代（请参见 图 7.4）。\n\n##### 图 7.4. 警报框。\n\n![](img/0789724995_ch07lev1sec3_image09.gif)\n\
  ![](img/0789724995_ch07lev1sec3_image10.gif)\n\n所以，`if` 语句的骨架如下：\n\n```javascript\n\
  \ if (condition)\n{\nstatement1\n}\n```\n\n条件是必须的，是一个布尔表达式。`statement1` 是可选的。\n\n\
  ### 循环语句\n循环是语句或语句块的重复：\n\n*   指定的次数\n*   直到条件满足\n\n四种循环语句可用：\n\n*   `do...while`\
  \ 语句\n*   `while` 语句\n*   `for` 语句\n*   `for...in` 语句\n\n每个语句执行的任务略有不同，但都值得学习如何使用。\n\
  \n#### `do...while` 语句\n`do...while` 语句运行一个语句或语句块，然后在条件为假之前重复整个过程。一个示例可以说明这一点：\n\
  \n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar\
  \ x = 1\ndo\n{\n++x;\nalert(x);\n}\nwhile (x < 10);\n// Cloaking device off -->\n\
  </script>\n```\n\n之前的代码有一个变量 `x`，初始值为 `1`。接下来，脚本的 `do` 部分指定对 `x` 加 1 并在警告框中显示该值。`while`\
  \ 部分指定在 `x` 小于 `10` 时执行此操作。\n\n`do...while` 语句处理的不一定非是数字。在下面的示例中，提示框会持续出现，直到输入文本字符串。在输入某些文本后，脚本的\
  \ `while` 部分变为 `false`，然后运行脚本的后续部分，显示警告框：\n\n```javascript\n <script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\ndo\n{\nsometext = prompt(\"Enter some text\"\
  ,\"\");\n}\nwhile (sometext == \"\");\nalert(sometext);\n// Cloaking device off\
  \ -->\n</script>\n```\n\n注意，为了让之前的示例工作，输入框中不能有默认文本。然而，简单的修改就可以解决这个问题：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- Cloaking device on!\ndo\n{\nsometext =\
  \ prompt(\"Enter some text\",\"Type some text\");\n}\nwhile (sometext == \"Type\
  \ some text\" || sometext == \"\" || sometext == null);\nalert(sometext);\n// Cloaking\
  \ device off -->\n</script>\n```\n\n这个示例解决了三个问题：\n\n*   用户留下了默认文本\n*   用户留空输入框\n\
  \n\n\n\n\n*   用户点击取消\n\n此功能通过使用逻辑或运算符 (`||`) 实现。当 `sometext` 等于 `\"Type some text\"\
  `、空或 `null`（用户点击了取消）时，将运行 `do` 部分的内容。\n\n### 注意事项\n\n在现实世界中，不应过度使用这种示例。请将其留给那些用户输入某个值至关重要的场景，例如需要向其发送某些信息的电子邮箱地址。过度使用会让访问者感到反感，特别是当他们甚至无法退出对话框时！\n\
  \n在使用任何类型的迭代语句时必须小心，因为很容易出错导致代码无限循环！这里有一个此类示例（但可能最好不要尝试运行这个示例！）：\n\n```\n <script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x = 1\ndo\n{\n++x;\nalert(x);\n\
  }\nwhile (x > 0);\n// Cloaking device off -->\n</script>\n```\n\n这个示例会让你永远点击警告框的\
  \ OK 按钮，因为通过不断在之前的值的基础上加 1，`x` 没有任何可能小于或等于零！\n\n### 警告\n\n非常小心这种错误，因为它可以很容易锁定甚至导致访问者的浏览器崩溃！\n\
  \n### 练习\n\n如何纠正上一个示例使其能够正常工作？\n\n### `while` 语句\n\n`while` 语句与 `do ... while` 语句相似，工作方式也大相同：\n\
  \n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x = 1\n\
  while (x < 10)\n{\n++x;\nalert(x);\n}\n// Cloaking device off -->\n</script>\n```\n\
  \n### 注意事项\n\n初学者通常认为 `do ... while` 语句更容易理解。这通常与它们的工作方式有关。在脚本过程中，`do ... while`\
  \ 语句至少运行一次，而 `while` 语句可能完全不需要运行（取决于情况）。这有时会让初学 JavaScript 的人感到困惑。\n\n### 练习\n\n\
  使用 `while` 语句创建一个提示框示例（类似于 `do ... while` 示例）。\n\n### `for` 语句\n\n`for` 语句也与之前的语句相似，但稍微复杂一些。区别在于内置了一种计数方法，使得整个过程不会无限持续下去：\n\
  \n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfor (x = 1;\
  \ x < 10; ++x)\n{\nalert(x);\n}\n// Cloaking device off -->\n</script>\n```\n\n\
  ### 警告\n\n然而，如果设置不当，例如：\n\n```\n for (x=1;x>0;x++)\n```\n\n它确实可能会无限持续！\n\n看一眼执行大部分工作的那行：\n\
  \n```\n for (x = 1; x < 10; ++x)\n```\n\n这行代码用紧凑的形式表示：从 `x = 1` 到 `x < 10`，将 `x`\
  \ 的值加 1。随后的语句将一直运行直到满足条件。\n\n`for` 语句的一种简便思考方式是：\n\n```\n for (initialization; test;\
  \ increment)\n```\n\n`initialization` 是变量开始时的值；`test` 是布尔条件；`increment`（或递减）是在 `test`\
  \ 为 `false` 之前在 `initialization` 变量上执行的操作。\n\n这是一个示例，在每一步中，变量都减少 2：\n\n```\n <script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfor (x = 10; x >= 0; x = x\
  \ - 2)\n{\nalert(x);\n}\n// Cloaking device off -->\n</script>\n```\n\n另一个示例使用 `for`\
  \ 语句创建数组的 10 个元素，并为每个元素分配与其位置对应的值。最后，数组的内容被输出到警告框。示例如下（参见图 7.6）：\n\n##### 图 7.6\
  \ `myarray` 的内容。\n\n![](img/0789724995_ch07lev1sec4_image01.gif)\n\n![](img/0789724995_ch07lev1sec4_image02.gif)\n\
  \n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar myarray\
  \ = new Array();\nfor (i = 0; i < 10; i++)\n{\nmyarray[i] = i;\n}\nalert(myarray);\n\
  // Cloaking device off -->\n</script>\n```\n\n### 练习\n\n修改上一个示例创建一个包含 100 个元素的数组。\n\
  \n### `for ... in` 语句\n\n在这里看到的最后一个迭代语句是 `for ... in` 语句。该语句用于对数组元素执行一个或多个语句。这允许你使用单个语句处理数组的所有元素，而无需为每个元素编写单独的语句。在这个示例中，使用\
  \ `for ... in` 语句为数组的每个元素加 1：\n\n```\n <script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nvar myarray = new Array(5);\nfor (i = 0; i < 5; i++)\n{\nmyarray[i]\
  \ = \"item \" + i;\n}\nalert(myarray);\n// Cloaking device off -->\n</script>\n\
  ```\n\n`for ... in` 语句允许 `x` 取数组的索引并导致值递增（如图 7.7 所示）。\n\n##### 图 7.7 `myarray` 的内容。\n\
  \n![](img/0789724995_ch07lev1sec4_image03.gif)\n\n在这个示例中，你看到 `for ... in` 语句用于填充数组诸如\
  \ \"item 0\"、item 1\"... 等字符串：\n\n![](img/0789724995_ch07lev1sec4_image04.gif)\n\
  \n`for ... in` 语句允许 `x` 取数组的索引并导致值递增（如图 7.8 所示）。\n\n##### 图 7.8 `myarray` 的内容。\n\
  \n![](img/0789724995_ch07lev1sec4_image05.gif)\n\n### 注意事项\n\n如果你觉得 `for ... in`\
  \ 语句的整体概念还不清楚，不要担心。在书中会有很多机会使用它。\n\n### 练习\n\n修改上一个示例创建一个包含 100 个元素的数组。\n\n### `continue`\
  \ 语句\n\n`continue` 语句允许你跳过当前循环体，并强制计算机执行下一次迭代。\n\n`continue` 语句与 `while`、`do...while`、`for`\
  \ 和 `for...in` 语句配合使用。`continue` 语句允许你跳过当前循环体并强制计算机执行下一次迭代。因此，如果 `continue` 语句直接放在语句体内，后续所有的语句都会被忽略。这里有一个示例：\n\
  \n```\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x = 0;\n\
  while (x < 10)\n{\nx++;\nalert(x);\ncontinue;\nalert(\"You never see this!\");\n\
  }\n// Cloaking device off -->\n</script>\n```\n\n这种效果通常是不需要的，在 `if` 语句内部使用 `continue`\
  \ 语句好得多。在这个示例中，当 `x = 5` 时跳过了警告框：\n\n```\n <script language=\"JavaScript\">\n<!--\
  \ Cloaking device on!\nvar x = 0;\nwhile (x < 10)\n{\nx++;\nif (x == 5)\n{\ncontinue;\n\
  }\nalert(x);\n}\n// Cloaking device off -->\n</script>\n```\n\n你可以通过使用条件 `if (x\
  \ % 2 == 0)` 来修改此示例以便只显示奇数，该条件在 `x` 为偶数时为真（结果显示在图 7.9）：\n\n```\n <script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nvar x = 0;\nwhile (x < 10)\n{\nx++;\nif\
  \ (x % 2 == 0)\n{\ncontinue;\n}\nalert(x);\n}\n// Cloaking device off -->\n</script>\n\
  ```\n\n##### 图 7.9 仅显示奇数。\n\n![](img/0789724995_ch07lev1sec4_image01.gif)\n\n![](img/0789724995_ch07lev1sec4_image02.gif)\n\
  \n\n\n\n\n或者，通过更改条件，可以使其仅显示偶数（新输出如图 7.10 所示）：\n\n```javascript\n <script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nvar x = 0;\nwhile (x < 10)\n{\nx++;\nif\
  \ (x % 2 != 0)\n{\ncontinue;\n}\nalert(x);\n}\n// Cloaking device off -->\n</script>\n\
  ```\n\n##### 图 7.10。通过更改条件，现在只显示偶数。\n\n![](img/0789724995_ch07lev1sec5_image03.gif)\n\
  \n![](img/0789724995_ch07lev1sec5_image04.gif)\n\n### 练习\n\n在几个示例脚本中使用 `continue`\
  \ 语句实验。尝试各种条件以真正感受它的工作原理。\n\n### `break` 语句\n\n与 `continue` 语句相对应的是 `break` 语句。`continue`\
  \ 语句强制进入下迭代，而 `break` 语句则让你完全跳出循环！\n\n你通常在 `while`、`for`、`for ... in` 和 `do ...\
  \ while` 语句（以及我们还没有介绍的 `switch` 语句）中使用 `break` 语句。\n\n在下面的示例中，会显示第一个警告框（显示 1），之后\
  \ `break` 语句生效并将你踢出循环：\n\n```javascript\n <script language=\"JavaScript\">\n<!--\
  \ Cloaking device on!\nvar x = 0;\nwhile (x < 10)\n{\nx++;\nalert(x);\nbreak;\n\
  alert(\"Never seen!\");\n}\n// Cloaking device off -->\n</script>\n```\n\n再次，使用\
  \ `break` 语句的最佳方法是结合 `if` 语句一起使用。这个示例允许你输入想要退出 `while` 语句的数字：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar x = 0, breakat;\n\
  breakat = prompt(\"Pick a number between 1 and 10 to break at\", \"\");\nwhile (x\
  \ < 10)\n{\n{\nif (x == breakat)\nbreak;\n}\nalert(x);\nx++;\n}\n// Cloaking device\
  \ off -->\n</script>\n```\n\n`while` 迭代语句一直执行到 `x` 的值等于 `breakat` 的值，此时循环退出。因此，如果你在提示框中输入\
  \ `5`，则会显示 1–4 的警告框。\n\n### 练习\n\n在几个示例脚本中使用 `break` 语句实验。同样，再次尝试各种条件以真正感受它的工作原理。\n\
  \n### `switch` 语句\n\n`switch` 语句允许当指定表达式的值匹配标签（label）时执行一个或多个语句。\n\n脚本采用以下布局：\n\n\
  ```javascript\n switch (expression)\n{\ncase label1:\nstatementlist\ncase label2:\n\
  statementlist\n}\n```\n\n在下面的示例中，输入到提示框中的值决定了运行哪些语句（前后部分分别在图 7.11 和 7.12 中所示）：\n\
  \n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking device on!\nvar\
  \ yourchoice;\nyourchoice = prompt(\"Choose a number between 1 and 4\", \"1, 2,\
  \ 3 or 4\")\nswitch (yourchoice)\n{\ncase \"1\":\nalert(\"You typed in a 1\");\n\
  break;\ncase \"2\":\nalert(\"You typed in a 2\");\nbreak;\ncase \"3\":\nalert(\"\
  You typed in a 3\");\nbreak;\ncase \"4\":\nalert(\"You typed in a 4\");\nbreak;\n\
  }\n// Cloaking device off -->\n</script>\n```\n\n##### 图 7.11。输入到提示框中的一个值。\n\n![](img/0789724995_ch07lev1sec7_image01.gif)\n\
  \n![](img/0789724995_ch07lev1sec7_image02.gif)\n\n##### 图 7.12。警告框显示了运行的是哪个语句。\n\
  \n![](img/0789724995_ch07lev1sec7_image03.gif)\n\n每个语句块都需要以一个 `break` 语句结束；否则，该\
  \ `case` 下的所有语句都将执行。\n\n有时，包含一组默认语句是有用的，当没有任何一个标签值匹配表达式时执行这些语句。前一个示例就是一种情况，如果输入的数字不在\
  \ 1 到 4 之间，就会发生这种情况。\n\n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nvar yourchoice;\nyourchoice = prompt(\"Choose a number between 1 and\
  \ 4\", \"1, 2, 3 or 4\")\nswitch (yourchoice)\n{\ncase \"1\":\nalert(\"You typed\
  \ in a 1\");\nbreak;\ncase \"2\":\nalert(\"You typed in a 2\");\nbreak;\ncase \"\
  3\":\nalert(\"You typed in a 3\");\nbreak;\ncase \"4\":\nalert(\"You typed in a\
  \ 4\");\nbreak;\ndefault:\nalert(\"You didn't type a number between 1 and 4\");\n\
  break;\n}\n// Cloaking device off -->\n</script>\n```\n\n另一种使用 `switch` 的方法是配合 `confirm`\
  \ 框。在下面，有两种结果：`true` 和 `false`：\n\n```javascript\n <script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nvar yourchoice;\nyourchoice = confirm(\"Are you at?\"\
  );\nswitch (yourchoice)\n{\ncase true:\nalert(\"See, I'm at!\");\nbreak;\ncase false:\n\
  alert(\"How can you be?\");\nbreak;\n}\n// Cloaking device off -->\n</script>\n\
  ```\n\n当你加载此页面时，你会看到图 7.13 所示的确认框。\n\n##### 图 7.13。确认框。\n\n![](img/0789724995_ch07lev1sec7_image05.gif)\n\
  \n##### 图 7.14。警告框显示了运行的是哪个语句。\n\n![](img/0789724995_ch07lev1sec7_image06.gif)\n\
  \n\n\n\n\n1. 在你喜欢的文本编辑器中打开你的 HTML 模板页面。\n\n2. 在脚本块（script block）中编写 `function` 单词并给它命名来开始函数（这个函数命名为\
  \ `yourMessage`）。记得在行末尾加上括号：\n\n```javascript\n <script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction yourMessage()\n\n// Cloaking device off -->\n\
  </script>\n```\n\n3. 接下来，添加一对大括号：\n\n```javascript\n <script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction yourMessage()\n{\n\n}\n// Cloaking device\
  \ off -->\n</script>\n```\n\n### 注意事项\n记住以左大括号（`{`）开始并以右大括号（}`）结束。JavaScript 初学者的一个常见错误是混淆括号的顺序，这会导致\
  \ JavaScript 无法工作。\n\n4. 接下来，添加一个简单的语句：\n\n```javascript\n <script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction yourMessage()\n{\nalert(\"Your first function!\"\
  );\n}\n// Cloaking device off -->\n</script>\n```\n\n5. 保存你的工作并将其加载到浏览器中看看结果。\n\n\
  什么都没有发生！嗯。别担心！这并不意味着你的 JavaScript 有问题。之所以这样是因为还没有调用这个函数。你必须这样做，因为与直接在脚本块中输入语句（语句会在浏览器遇到它们时立即运行）不同，函数不会自动运行，所以你必须编写更多的脚本来让它工作！\n\
  \n你可以通过多种方式调用 JavaScript 函数。最简单但效果最低的方法是直接在脚本块中调用它。这只需将函数名放在脚本块中即可：\n\n```javascript\n\
  \ <!-- Cloaking device on!\n\nyourMessage();\n\nfunction yourMessage()\n{\nalert(\"\
  Your first function!\");\n}\n// Cloaking device off -->\n</script>\n```\n\n6. 再次保存页面并将其加载到浏览器中查看你的工作运行情况！（请参见\
  \ 图 8.1）。\n\n##### 图 8.1. 显示了一个警告框，表明函数已被调用并运行。\n\n![](img/0789724995_ch08lev1sec2_image01.gif)\n\
  \n![](img/0789724995_ch08lev1sec2_image02.gif)\n\n我们在上一个示例中调用函数的方法可能是最没用的之一。尽管它有效，但它实际上与你之前直接在脚本块中输入语句并无区别。\n\
  \n正如你之后将看到的，这对于从一个函数调用另一个函数是有用的。但在你做到这一点之前，你需要知道如何运行函数，为了做到这一点，你首先需要学习事件。事件允许你更好地控制函数运行的方式和时。\n\
  \n### 事件 (Events)\n\n调用函数的技巧是使用事件来为你完成工作。JavaScript 是事件驱动的，这意味着发生的一切事情都是事件的结果，或者导致了某些事件的发生。在浏览器窗口中打开新页面是一个事件。移动鼠标指针是一个事件。点击是一个事件。在本书中你将最常用的四个事件是：\n\
  \n* `onLoad`\n* `onClick`\n* `onMouseover`\n* `onMouseout`\n\n让我们快速过一遍每一个事件，以便在继续之前对它们了如。\n\
  \n#### `onLoad` 事件\n\n`onLoad` 事件是在某些内容加载后发生的事件——例如，浏览器已完成将页面加载到浏览器窗口中。此事件只有当整个页面（包括设置为加载的图像）都完成下载时才会发生。\n\
  \n#### 注意\n你可能感兴趣的是，当页面卸载时（通过移动到另一个页面或关闭浏览器窗口）发生的事件被称为 `onUnload`。\n\n当你希望函数在页面加载并准备好使用后触发时，`onLoad`\
  \ 事件是一个非常棒的事件。\n\n#### `onClick` 事件\n\n`onClick` 事件在用户点击页面某处时发生。正如你之后将看到的，页面上的各种元素（如超链接、图像、按钮和文本）可以单独响应\
  \ `onClick` 事件。\n\n当你想要创建与用户交互的 JavaScript 时，这个事件非常有用。\n\n#### `onMouseover` 事件\n\
  \n此事件与 `onClick` 事件类似，但它不是用户点击页面上的元素时，而是用户移动鼠标指针到其上方。此事件再次可以分配给 Web 上的几乎任何对象（文本、图像、按钮、超链接等）。\n\
  \n同样，这对于脚本与用户之间的交互非常有益。\n\n#### `onMouseout` 事件\n\n同样，此事件与 `onMouseover` 事件类似，但它是在鼠标指针移出对象时发生的。\n\
  \n### 使用事件\n\n好了，你已经知道了四个事件，但你如何使用它们呢？好吧，让我们从 `onLoad` 事件开始。\n\n#### 使用 `onLoad`\
  \ 事件\n\n要使用 `onLoad` 事件来触发 JavaScript 函数，你必须将以下事件处理器放置在 `body` 标签中：\n\n#### 注意\n\
  事件处理器是一段根据其发生的结果而处理某些操作的代码，例如运行 JavaScript 函数。现在，保存页面并将其加载到浏览器：\n\n```javascript\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction yourMessage()\n{\nalert(\"Your first function!\"\
  );\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onload=\"yourMessage()\"\
  >\n```\n\n#### 使用 `onClick` 事件\n\n其他事件呢？如果你想用 `onClick` 呢？简单地将 `onLoad` 改为 `onClick`：\n\
  \n```javascript\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction yourMessage()\n{\nalert(\"Your\
  \ first function!\");\n}\n// Cloaking device off -->\n</script>\n</head>\n<body\
  \ onclick=\"yourMessage()\">\n```\n\n如果你保存此将其加载到浏览器，你会发现在点击页面任何地方之前什么都不会发生，然后函数就会运行！\n\
  \n然而，在页面任何地方点击并不是最好的方法。更好的方法是可以更具体地控制——例如，点击超链接。这很简单！与其将事件处理器添加到 `body` 标签上，你只需将\
  \ `onClick` 事件直接添加到超链接上：\n\n```javascript\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction yourMessage()\n\
  {\nalert(\"You clicked a link!\");\n}\n// Cloaking device off -->\n</script>\n</head>\n\
  <body>\n<a href=\"http://www.kingsley-hughes.com\" onclick=\"yourMessage()\">My\
  \ Web site!</a>\n</body>\n</html>\n```\n\n如果你将此示例加载到 Web 浏览器并点击链接，你会在 URL 指向的页面之前看到消息框出现（参见\
  \ 图 8.2）。\n\n##### 图 8.2. 点击链接时显示警告框。\n\n![](img/0789724995_ch081sec4_image01.gif)\n\
  \n![](img/0789724995_ch081sec4_image02.gif)\n\n#### 使用 `onMouseover` 事件\n\n超链接也非常适合用于\
  \ `onMouseover` 事件。这里有一个简单的示例，当用户将鼠标指针移动到超链接上时，会触发 `overMessage()` 函数：\n\n```javascript\n\
  \ <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction overMessage()\n{\nalert(\"This is a great\
  \ link - click on it!\");\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n\
  <a href=\"http://www.kingsley-hughes.com\" onmouseover=\"overMessage()\">My Web\
  \ site!</a>\n</body>\n</html>\n```\n\n练习\n\n\n\n\n创建一个包含超链接的页面，该链接有一个函数，当用户将鼠标指针移离开它时会被触发。\n\
  \n## 挑战\n\n你能创建另一个页面，当用户离开网页时弹出一个告别消息吗？提示：还记得 `onUnload` 事件吗？\n\n## 创建高效的函数！\n\n\
  现在你已经有机会编写了你的第一个函数，并练习了如何使用事件来触发函数，你准备好更深入地探索了。\n\n理解函数的最佳方式是将其视为执行特定任务的语句组。这可以是一个只需要一条一条语句的简单任务（正如我们之前看到的），也可以是一个需要许多语句的复杂函数。无论何种，函数都会执行特定的任务。\n\
  \n所以，如果你回到交互故事示例，你可以通过将所有脚本放入一个函数中并使用按钮上的 `onClick` 事件来触发它，从而整理这些代码并使其更符合用户习惯（参见图\
  \ 8.3）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction story()\n{\n// 创建提示词的数组\nvar promptmsg\
  \ = new Array(\"A time of day\",\"A feeling\",\"An adjective - eg sunny\", \"An\n\
  adjective - eg sunny\",\"A verb - past tense eg walked\",\"An adverb - eg quickly\
  \ or\nmon monstrously\",\"An adverb  - eg quickly or\nmon monstrously\",\"A room\
  \ in a house\", \"A profession\"\n,\"An exclamation!\");\n// 创建默认文本的数组\nvar defaulttxt\
  \ = new Array(\"lunchtime\",\"wet\",\"plump\",\"malodorous\",\"wriggled\", \"hungrily\"\
  \n,\"fiercely\",\"bathroom\",\"Web developer\",\"Yipes\");\n\n// 提示词输入的变量\nvar entry1,\
  \ entry2, entry3, entry4, entry5, entry6, entry7, entry8, entry9, entry10;\n\n//\
  \ 显示提示词！\nentry1  = prompt(promptmsg[0], defaulttxt[0]);\nentry2  = prompt(promptmsg[1],\
  \ defaulttxt[1]);\nentry3  = prompt(promptmsg[2], defaulttxt[2]);\nentry4  = prompt(promptmsg[3],\
  \ defaulttxt[3]);\nentry5  = prompt(promptmsg[4], defaulttxt[4]);\nentry6  = prompt(promptmsg[5],\
  \ defaulttxt[5]);\nentry7  = prompt(promptmsg[6], defaulttxt[6]);\nentry8  = prompt(promptmsg[7],\
  \ defaulttxt[7]);\nentry9  = prompt(promptmsg[8], defaulttxt[8]);\nentry10 = prompt(promptmsg[9],\
  \ defaulttxt[9]);\n\n// 显示警告框！\nalert(\"Once upon a \" + entry1 + \" dreary,\")\n\
  alert(\"while I pondered, \" + entry2 + \" and weary,\")\nalert(\"Over many a \"\
  \ + entry3 + \" and curious volume\")\nalert(\"of \" + entry4 + \" lore\")\nalert(\"\
  While I \" + entry5 + \", nearly napping,\")\nalert(entry6 + \" there came a tapping,\"\
  )\nalert(\"As of someone \" + entry7 + \" rapping,\")\nalert(\"rapping at my \"\
  \ + entry8 + \" door.\")\nalert(\"'Tis some \" + entry9 + \" I muttered,\")\nalert(\"\
  tapping at my \" + entry8 + \" door\")\nalert(\"Only \" + entry10 + \"! and more.\"\
  )\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1>Interactive Story!</h1>\n\
  <p>点击 <input type=\"button\" value=\"HERE\" onClick=\"story()\"> 开始故事！</p>\n</body>\n\
  </html>\n```\n\n图 8.3. 一个在页面上添加了一些内容后的交互式故事——现在它变得更易于使用了了。（OEBPS/Images/0789724995_ch08lev1sec5_image05)\
  \ (OEBPS/Images/0789724995_ch08lev1sec5_image06) 这是一个使用函数来整理页面的快速且简单的方法。\n\n## 函数调用函数\n\
  \n你已经看到事件如何被用来触发函数，但如果一个函数触发另一个函数呢？这很简单！这是一个函数示例，它包含一个由 `onLoad` 事件触发的警告框，而该事件又触发了另一个函数：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction firstMessage()\n{\nalert(\"Here is the first\
  \ message!\");\nsecondMessage();\n}\nfunction secondMessage()\n{\nalert(\"And here\
  \ is the second!\");\n}\n// Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"\
  firstMessage()\">\n\n</body>\n</html>\n```\n\n当你将此页面加载到浏览器时，`onLoad` 事件会触发函数 `firstMessage()`，它会显示第一个警告框（参见图\
  \ 8.4）。\n\n图 8.4. 由运行 `firstMessage()` 的 `onLoad` 事件显示的第一个警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image01)\
  \ (OEBPS/Images/0789724995_ch08lev1sec6_image02) \n\n然而，第二个警告框是由函数 `secondMessage()`\
  \ 生成的，它是由 `firstMessage()` 调用的（参见图 8.5）。图 8.6 显示了函数执行的示意图。\n\n图 8.5. `firstMessage()`\
  \ 调用 `secondMessage()` 生成的第二个警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image03)\n\
  \n图 8.6. 函数执行的顺序。（OEBPS/Images/0789724995_ch08lev1sec6_image04)\n\n如果你不在函数末尾调用另一个函数，顺序将会不那么直接。考虑以下示例：\n\
  \n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\nfunction firstMessage()\n{\nalert(\"Here is the first\
  \ message!\");\nsecondMessage();\n}\n\nfunction secondMessage()\n{\nalert(\"And\
  \ here is the second!\");\n}\n// Cloaking device off -->\n</script>\n</head>\n<body\
  \ onLoad=\"firstMessage()\">\n\n</body>\n</html>\n```\n\n这里发生的是 `onLoad` 事件触发 `firstMessage()`\
  \ 函数，并显示第一个警告框（参见图 8.7 浏览器中所示的结果）。\n\n图 8.7. `onLoad` 事件触发 `firstMessage()` 函数并显示第一个警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image05)\n\
  \n图 8.8. 显示第一个警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image06)\n\n当到达函数 `secondMessage()`\
  \ 的调用时，会从 `firstMessage()` 跳跃到 `secondMessage()` 并运行该函数，这意味着下一个显示的警告框是该函数中的那个（参见图\
  \ 8.9）。\n\n图 8.9. 显示第二个警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image07)\n\n当函数\
  \ `secondMessage()` 完成后，代码将跳回 `firstMessage()` 离开的地方并继续执行剩余语句（参见图 8.10 和 8.11）。\n\
  \n图 8.10. `secondMessage()` 完成后，执行 `firstMessage()` 中的剩余语句。（OEBPS/Images/0789724995_ch08lev1sec6_image08)\n\
  \n图 8.11. 显示最后的警告框。（OEBPS/Images/0789724995_ch08lev1sec6_image09) (OEBPS/Images/0789724995_ch08lev1sec6_image10)\n\
  \n注意\n\n这种被称为分支的效果是一种实用的理解和使用技术；但这意味着你应该很好地注释代码，以确保其清晰且无歧义。\n\n练习\n\n在你自己的几个 JavaScript\
  \ 示例中练习这种分支用法。尝试在函数中放置多个分支并看看会发生什么。\n\n好好注释你的代码，以便所有的步骤和分支对你来说都是清晰的！\n\n\n\n\n这些括号实际上用于持有参数。参数的作用就像变量一样，可以包含几乎你想要的任何数据——文本字符串、数字、`Boolean`\
  \ 值等等。\n\n让我们来看一个使用参数的函数示例：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction yourMessage(quote)\n\
  {\nalert(quote);\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<p>Click\
  \ <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('How come dumb stuff\
  \ seems\n so smart while you\\ 're doing it!')\"> for a message!</p>\n<br>\n<p>Click\
  \ <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('How do you tell when\
  \ you \nrun out of\ninvisible ink?')\"> for another message!</p>\n</body>\n</html>\n\
  ```\n\n**注意**\n\n注意在第一个按钮的消息中使用了转义字符（`\\'`）来表示单引号——如果省略它，就会发生错误！\n\n这是一个包含两个按钮的页面。如果你点击按钮，就会显示一个包含消息的警报框。显示的消息是从\
  \ `onClick` 事件处理器传递给函数参数的。该参数的名为 `quote`。它的作用就像变量一样，它的值被传递给警报框进行显示。\n\n如果这看起来有点复杂，请查看图\
  \ 8.12。\n\n##### 图 8.12 脚本是如何处理的以及参数是如何处理的。\n\n![](img/0789724995_ch08lev1sec7_image03.gif)\n\
  \n**注意**\n\n就像一样，尽量给你的参数起能让你想起其用途的名字。\n\n在此类示例中使用函数和参数的好处是，你可以轻松地添加更多按钮和引用，而无需修改或添加你的\
  \ JavaScript：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction yourMessage(quote)\n\
  {\nalert(quote);\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<p>Click\
  \ <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('How come dumb stuff\
  \ seems\n so smart while you\\ 're doing it!')\"> for a message!</p>\n<br>\n<p>Click\
  \ <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('How do you tell when\
  \ you \nrun out of\ninvisible ink?')\"> for another message!</p>\n<br>\n<p>Click\
  \ <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('Do run with\nscissors\
  \ ... sorry, I mean DON\\ 'T run with scissors!')\"> for another message!</p>\n\
  <br>\n<p>Click <input type=\"button\" value=\"HERE\" onClick=\"yourMessage('If it\
  \ isn\\ 't broken, fix\n it till it is.')\"> for a final message!</p>\n\n</body>\n\
  </html>\n```\n\n**提示**\n\n如果不使用参数而每个按钮都需要一个独立的函数，那么这个网页将会变得复杂得多。\n\n**练习**\n\n创建几个使用函数和参数的类似示例。注意使用参数如何比使用独立函数使代码更易编写和理解。\n\
  \n继续练习你的 JavaScript 注释！\n\n### 函数之间使用参数\n\n你可以使用参数将数据从一个函数（调用函数）传递到另一个函数（接收函数）。\n\
  \n这是一个实际操作的简单示例：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction first()\n{\nvar x\
  \ = 3, y = 5;\ndoAdd(x, y);\n}\n\nfunction doAdd(x, y)\n{\nalert(x + y);\n}\n//\
  \ Cloaking device off -->\n</script>\n</head>\n<body onLoad=\"first()\">\n\n</body>\n\
  </html>\n```\n\n在这个示例中，调用函数（`first()`）将 `x` 和 `y` 传递给接收函数（`doAdd()`）中的参数，后者执行计算并输出答案。\n\
  \n你现在可能觉得这意义不大（为什么不在第一个函数中进行计算而用第二个函数呢？），但稍后你就会看到在函数之间分担工作是有用的。\n\n### `return`\
  \ 语句\n\n你在上一章中没有看过的语句是 `return` 语句。（事实上，还有另一个——`with` 语句——但你将在下一章遇到它！）\n\n上一章省略了\
  \ `return` 语句是因为因为它专门处理函数，那时你还没有发现函数。所以，让我们现在来看它。\n\n你已经看到参数如何用于将数据从调用函数传递到接收函数，以便其对数据进行处理；很好，有一种方法可以将结果传回。这是通过\
  \ `return` 语句实现的：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction calcAvg()\n{\nvar\
  \ inpNum1 = prompt(\"Enter a number\");\nvar inpNum2 = prompt(\"Enter a number\"\
  );\nvar inpNum3 = prompt(\"Enter a number\");\nvar inpNum4 = prompt(\"Enter a number\"\
  );\nnumAvg = calcAvg(inpNum1, inpNum2, inpNum3, inpNum4);\nalert(\"The average of\
  \ the four numbers is \" + numAvg);\n}\n\nfunction calcAvg(inpNum1, inpNum2, inpNum3,\
  \ inpNum4)\n{\nvar ans;\nans = (Number(inpNum1) + Number(inpNum2) + Number(inpNum3)\
  \ + Number(inpNum4)) / 4;\nreturn (ans);\n}\n// Cloaking device off -->\n</script>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n在这个示例中，调用函数（`first()`）将 `x` 和 `y` 传递给接收函数（`doAdd()`）中的参数，后者执行计算并输出答案。\n\
  \n**注意**\n\n如果你调用一个使用 `return` 语句的函数而不进行赋值，例如\n\n```\ncalcAvg(inpNum1, inpNum2,\
  \ inpNum3, inpNum4);\n```\n\n会导致脚本无法运行，因为返回的数据无处可去。请查看图 8.13\n\n##### 图 8.14 计算结果显示在警报框中。\n\
  \n![](img/0789724995_ch08lev1sec7_image02.gif)\n\n![](img/0789724995_ch08lev1sec7_image03.gif)\n\
  \n**注意**\n\n注意接收（`numAvg`）和返回（`ans`）具有不同的名称。这是避免问题的最好方法——你只需要记住哪个变量在哪里。\n\n关于 `return`\
  \ 语句的一个重要点是，虽然一个函数可以接收多个参数，但它只能向调用函数返回单个值。\n\n这引导你采用这种设计策略：创建接收数据并对其处理以输出单个值的函数。数学计算是这种用法的很好的例子，但其他用途可能包括在线表单处理，你需要一个函数来计算邮费。\n\
  \n### 练习—温度转换 JavaScript\n\n1. 考虑以下示例。此示例紧基于你之前看过的示例：\n\n\n\n\n\n```html\n<html>\n\
  <head>\n<title>A Simple Page</title>\n<script language=\"JavaScript\">\n<!-- Cloaking\
  \ device on!\nfunction inputCels()\n{\nvar cels = prompt(\"Enter a temperature in\
  \ Degrees Celsius\",\"Enter a temperature\");\nansFah = doFahCalc(cels);\nalert(cels\
  \ + \" Degrees Celsius is \" + ansFah + \" Degrees Fahrenheit\");\n}\n\nfunction\
  \ inputFah()\n{\nvar fah = prompt(\"Enter a temperature in Degrees Fahrenheit\"\
  ,\"Enter a temperature\");\nansCel = doCelCalc(fah);\nalert(fah + \" Degrees Fahrenheit\
  \ is \" + ansCel + \" Degrees Celsius\");\n}\n\nfunction doCelCalc(fah)\n{\nvar\
  \ ans = ((Number(fah) - 32) / 1.8);\nreturn (ans);\n}\n\nfunction doFahCalc(cels)\n\
  {\nvar ans = ((1.8 * Number(cels)) + 32);\nreturn (ans);\n}\n// Cloaking device\
  \ off -->\n</script>\n</head>\n<body>\n<input type=\"button\" value=\"Convert Celsius\
  \ to Fahrenheit\" onClick=\"inputCels();\">\n<br>\n<br>\n<input type=\"button\"\
  \ value=\"Convert Fahrenheit to Celsius\" onClick=\"inputFah();\">\n</body>\n</html>\n\
  \ \n```\n\n2.  看一下这段代码（将其输入并运行，或者下载示例并尝试一下）。尝试推断出每条语句的作用，以及它们是如何通过参数和 `return` 语句相互作用的。\n\
  \n3.  为脚本中添加注释，帮助你理解它是如何工作的。\n\n4.  尝试修改示例以使用不同的数学公式（销售税、燃油里程等）。\n\n5.  最重要的一点是，玩得开心！轻松一点；查看之前的示例并把它们作为指南，帮助你理解这个\
  \ JavaScript 示例中的交互。这需要一些时间，而且并不一定容易，但绝对值得的！通过亲身实践这个示例，甚至可能创建一个你自己的示例，你正在巩固你的 JavaScript\
  \ 知识，这将帮助你通向 JavaScript 成功的之路！\n\n### 练习\n\n尝试尝试创建函数，使用参数和 `return` 语句在函数之间来传递数据。如果你发现开始很困难，请参考上一个示例，只需更改变量名即可。过段时间，你会发现这变得轻而易。\n\
  \n### 接下来\n\n你现在已经知道了如何编写函数、使用参数简化你的 JavaScript 以及使用 `return` 语句传递数据。在下一章中，当你转向初学者通常感到畏惧的\
  \ JavaScript 领域——对象，你将对函数进行更多练习。\n\n那里见！\n\n## 第 9 章 充分利用对象\n\n你已经涵盖了脚本块；涵盖了语句；还涵盖了运算符、函数和事件。现在是时候查看\
  \ JavaScript 对象了！\n\n本章将教你以下内容：\n\n*   什么是对象\n*   对象与浏览器——不同的浏览器有不同的对象\n*   `Math`\
  \ 对象以及如何使用\n*   `Date` 对象以及如何使用\n*   `String` 对象以及如何使用\n*   结合对象使用 `with` 语句\n\n\
  ### 对象——它们是什么？\n\n从最简单的角度来说，对象是方法和属性的集合。记住这个类比：对象是物体。对象拥有属性（例如电脑有显示器、汽车有轮子等），而方法是对象可以做的事情（汽车可以移动、剪刀可以剪切等）。\n\
  \n如果你将对象、属性和方法结合在一起，你就会更好地理解什么是对象。在 JavaScript 中，对象及其各自的属性和方法通过点（`.`）隔开组合在一起，这被称为点语法（dot\
  \ syntax）。因此，如果现实世界由 JavaScript 控制，你可能会拥有如下：\n\n```\ncomputers.monitors\ncars.wheels\n\
  scissors.cut()\n```\n\n注意这种语法如何让你能够更好地地描述一个对象（`computer.monitor` 是具体的）或描述一个过程（`scissors.cut`）。这种点语法允许你深入钻取对象并变得更加具体：\n\
  \n```\ncars.wheels.rear.right\n```\n\n### 释\n\n当我们之后查看浏览器对象而不是 JavaScript 对象时，这种深入钻取将变得更加明显。\n\
  \n### 对象与浏览器\n\n对于初学者 JavaScript 来说，总是令他们感到惊讶的是并不是所有的浏览器都支持相同的对象。这主要是因为不同的浏览器制造商都希望在随浏览器包含的\
  \ JavaScript 标准中添加自己的专有内容。然而，主要归功于 ECMAScript 标准，部分归功于微软的 JScript 和 Netscape Navigator\
  \ 的 JavaScript 共同起源，大多数对象在两个浏览器中都是可用的。\n\n例如，看看以下内容。ECMAScript 标准包含以下对象：\n\n*  \
  \ `Array`——允许创建新数组\n*   `Boolean`——创建一个新的布尔值\n*   `Date`——允许对日期和时间的基本存储和检索\n*  \
  \ `Function`——创建一个函数\n*   `Global`——一个其目的是将全局方法（如 `eval`）收集到一个对象中的对象\n*   `Math`——一个提供基本数学功能和常量的对象\n\
  *   `Number`——一个表示数字数据的对象\n*   `Object`——提供所有对象共有的功能\n*   `RegExp`——一个存储正则表达式匹配结果的全局对象\n\
  *   `String`——允许对字符串进行操作和格式化\n\n但 Internet Explorer 包含的 JScript 5.5 还有以下：\n\n* \
  \  `Enumerator`\n*   Regular Expression（正则表达式）\n*   `VBArray`\n*   `ActiveObject`\n\
  *   `GetObject`\n\n为了保持简单，这里只涵盖了 ECMAScript 对象。\n\n### JavaScript 对象——深入观察\n\nJavaScript\
  \ 中存在的一些对象是为高级用户提供的，因此不需要涵盖（本章末尾有 ECMAScript 对象的完整列表）。在本章中，你将查看三个有趣且实用的对象。它们是：\n\
  \n*   `Math` 对象\n*   `Date` 对象\n*   `String` 对象\n\n### `Math` 对象\n\n`Math` 对象为 JavaScript\
  \ 带来了你可能需要的所有数学函数和常量。\n\n让我们看看 `Math` 对象的一些示例。\n\n#### 使用 `PI` 属性\n\nπ 常数是一个（约等于\
  \ 3.1415，尽管百万位是 1!）你可能想要使用的常量，特别是当你处理圆时。π 返回圆周长与直径的比率。以下展示了它如何作为数学公式 `Pi x r²` 或\
  \ `Pi x r * r` 的简单圆面积计算器（参见图 9.1）：\n\n```javascript\n<script language=\"JavaScript\"\
  >\n<!-- Cloaking device on!\ninpRadius = prompt(\"输入圆的半径\",\"只需输入数字!\");\nalert(Math.PI\
  \ * ((inpRadius)*(inpRadius)));\n// Cloaking device off -->\n</script>\n```\n\n\
  ##### 图 9.1. 圆面积计算器的运行示例。\n\n(OEBPS/Images/0789724995_ch09lev1sec4_image01.gif)\
  \ (OEBPS/Images/0789724995_ch09lev1sec4_image02.gif)\n\n该属性所做的仅仅是保存数学常量 π 的值；同样的结果可以通过变量实现。然而，`Math`\
  \ 对象的 `PI` 属性可以让你无需查找 π 的值就能实现这一点！\n\n这是另一个示例，这次使用了三个函数：一个用于计算圆面积，另一个用于计算周长，最后一个用于计算球体体积（参见图\
  \ 9.2）：\n\n\n\n\n\n```html\n<html>\n<head>\n<title>A Simple Page</title>\n<script\
  \ language=\"JavaScript\">\n<!-- Cloaking device on!\nfunction calcArea()\n{\ninpRadius\
  \ = prompt(\"Enter the radius for your circle\",\"Radius - digits only!\");\nalert(Math.PI\
  \ * ((inpRadius)*(inpRadius)));\n}\n\nfunction calcPeri()\n{\ninpRadius = prompt(\"\
  Enter the radius for your circle\",\"Radius - digits only!\");\nalert(2 * Math.PI\
  \ * (inpRadius));\n}\nfunction calcVol()\n{\ninpRadius = prompt(\"Enter the radius\
  \ for your sphere\",\"Radius - digits only!\");\nalert(Math.PI * ((inpRadius)*(inpRadius)*(inpRadius))\
  \ * (4/3));\n}\n// Cloaking device off -->\n</script>\n</head>\n<body>\n<h1>关于圆和球的一切!/</h1>\n\
  <p>点击 <input type=\"button\" value=\"HERE\" onclick=\"calcArea();\"> 来计算圆 \n面积!</p>\n\
  <br>\n<p>点击 <input type=\"button\" value=\"HERE\" onclick=\"calcPeri();\"> 来计算圆\
  \ \n周长!</p>\n<br>\n<p>点击 <input type=\"button\" value=\"HERE\" onclick=\"calcVol();\"\
  > 来计算球 \n体积!</p>\n</body>\n</html>\n```\n\n##### 图 9.2. 新的、改进后的圆面积计算器运行中！\n\n![](img/0789724995_ch09lev1sec4_image06.gif)\n\
  \n![](img/0789724995_ch09lev1sec4_image07.gif)\n\n## 使用 `max` 和 `min` 方法\n\n`Math`\
  \ 对象的两个有趣的方法是 `max` 和 `min` 方法。这些方法允许你找到提供的数值表达式中的较大值或较小值。\n\n这是一个简单的示例：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- Cloaking device on!\ninp1 = prompt(\"Enter\
  \ a number\",\"Number goes here\");\ninp2 = prompt(\"Enter a number\",\"Number goes\
  \ here\");\ninp3 = prompt(\"Enter a number\",\"Number goes here\");\nalert(\"The\
  \ largest number entered was \" + Math.max(inp1, inp2, inp3));\nalert(\"The smallest\
  \ number entered was \" + Math.min(inp1, inp2, inp3));\n// Cloaking device off -->\n\
  </script>\n```\n\n第一个弹框使用 `max` 方法显示输入的最高数字，而第二个弹框使用 `min` 方法显示最低数字。这是一个展示这些方法强大之处的简单示例。更复杂的示例可能涉及显示价格列表中最高和最低的价格，或者学生最高和最低的考试分数。\n\
  \n## 使用 `round` 方法\n\n在处理“棘手”的数字时，这是一个非常有用的方法（这里你所观察的实数类型就是一种棘手数字），因为它允许你将它们四舍五入到最近的整数。\n\
  \n如果正数的数部分为 0.5 或更大，则返回的值等于大于该数字的最小整数。否则，`round` 返回小于或等于该数字的最大整数。所以：\n\n*   `1.45`\
  \ 被四舍五入为 `1`。\n*   `6.93` 被四舍五入为 `7`。\n*   `7.5` 被四舍五入为 `8`。\n*   `0.5` 被四舍五入为 `1`。\n\
  *   `0.49` 被四舍五入为 `0`。\n\n这是一个使用 `round` 方法的示例。事实上，它是圆计算器的修改版——这次返回的是四舍五入到最近整数的答案（参见\
  \ 图 9.3]）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction calcArea()\n{\ninpRadius = prompt(\"\
  Enter the radius for your circle\",\"Radius - digits only!\");\nalert(Math.round(Math.PI\
  \ * ((inpRadius)*(inpRadius))));\n}\n\nfunction calcPeri()\n{\ninpRadius = prompt(\"\
  Enter the radius for your circle\",\"Radius - digits only!\");\nalert(Math.round(2\
  \ * Math.PI * (inpRadius)));\n}\n\nfunction calcVol()\n{\ninpRadius = prompt(\"\
  Enter the radius for your sphere\",\"Radius - digits only!\");\nalert(Math.round(Math.PI\
  \ * ((inpRadius)*(inpRadius)*(inpRadius)) * (4/3)));\n}\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body>\n<h1>关于圆和球的一切!/</h1>\n<p>点击 <input type=\"button\"\
  \ value=\"HERE\" onclick=\"calcArea();\"> 来计算圆 \n面积!</p>\n<br>\n<p>点击 <input type=\"\
  button\" value=\"HERE\" onclick=\"calcPeri();\"> 来计算圆 \n周长!</p>\n<br>\n<p>点击 <input\
  \ type=\"button\" value=\"HERE\" onclick=\"calcVol();\"> 来计算球 \n体积!</p>\n</body>\n\
  </html>\n```\n\n##### 图 9.3. 新的、改进后的圆面积计算器运行中——现在有了四舍五入！\n\n![](img/0789724995_ch09lev1sec4_image11.gif)\n\
  \n![](img/0789724995_ch09lev1sec4_image11.gif)\n\n**注意**：之前的公式包含了大量的括号。如果你想保留某些小数，一种快速简单的方法是先将原始数字乘以\
  \ `10`（如果你想要一位小数）、乘以 `100`（如果你想要两位）、乘以 `1000`（如果你想要三位），以此类推。然后进行四舍五入，最后除以该数字。所以，如果你想要圆计算器具有两位小数，你需要执行操作（参见\
  \ 图 9.4）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nfunction calcArea()\n{\ninpRadius = prompt(\"\
  Enter the radius for your circle\",\"Radius - digits only!\");\nalert(Math.round(Math.PI\
  \ * ((inpRadius)*(inpRadius))));\n}\n\nfunction calcPeri()\n{\ninpRadius = prompt(\"\
  Enter the radius for your circle\",\"Radius - digits only!\");\nalert(Math.round(2\
  \ * Math.PI * (inpRadius)));\n}\n\nfunction calcVol()\n{\ninpRadius = prompt(\"\
  Enter the radius for your sphere\",\"Radius - digits only!\");\nalert(Math.round(Math.PI\
  \ * ((inpRadius)*(inpRadius)*(inpRadius)) * (4/3)));\n}\n// Cloaking device off\
  \ -->\n</script>\n</head>\n<body>\n<h1>关于圆和球的一切!/</h1>\n<p>点击 <input type=\"button\"\
  \ value=\"HERE\" onclick=\"calcArea();\"> 来计算圆 \n面积!</p>\n<br>\n<p>点击 <input type=\"\
  button\" value=\"HERE\" onclick=\"calcPeri();\"> 来计算圆 \n周长!</p>\n<br>\n<p>点击 <input\
  \ type=\"button\" value=\"HERE\" onclick=\"calcVol();\"> 来计算球 \n体积!</p>\n</body>\n\
  </html>\n```\n\n##### 图 9.4. 圆计算器的进一步改进！\n\n![](img/0789724995_ch09lev1sec4_image16.gif)\n\
  \n![](img/0789724995_ch09lev1sec4_image17.gif)\n\n## 使用 `random` 方法\n\n`random`\
  \ 方法用于生成 0（包含）到 1（不包含）之间的伪随机数——换句话说，返回的数字可以为 0，但始终小于 1（参见 图 9.5）。\n\n**注意**：生成的数字不是真正的随机（轮盘或掷骰子会给你真正的随机数），因此被称为伪随机。伪随机数是使用特定算法生成的，但它们通过统计随机测试。\n\
  \n**结论**：它们已经是你能获取的最随机的！\n\n使用 `random` 方法非常简单：\n\n```javascript\n <script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nalert(Math.random());\n// Cloaking device\
  \ off -->\n</script>\n```\n\n如果你想要 0 到 10 之间的随机整数，你必须将随机数乘以 10，然后使用 `round` 方法将其四舍五入（参见\
  \ 图 9.6）：\n\n```javascript\n <script language=\"JavaScript\">\n<!-- Cloaking device\
  \ on!\nrndNum = Math.random();\nrndNum = rndNum * 10;\nalert(Math.round(rndNum));\n\
  // Cloaking device off -->\n</script>\n```\n\n##### 图 9.6. 0 到 10 之间的伪随机数。\n\n![](img/0789724995_ch09lev1sec4_image20.gif)\n\
  \n![](img/0789724995_ch09lev1sec4_image21.gif)\n\n## 使用 `max` 和 `min` 方法\n\n`Math`\
  \ 对象的两个有趣的方法是 `max` 和 `min` 方法。这些方法允许你找到提供的数值表达式中的较大值或较小值。\n\n这是一个简单的示例：\n\n```javascript\n\
  \ <script language=\"JavaScript\">\n<!-- Cloaking device on!\ninp1 = prompt(\"Enter\
  \ a number\",\"Number goes here\");\ninp2 = prompt(\"Enter a number\",\"Number goes\
  \ here\");\ninp3 = prompt(\"Enter a number\",\"Number goes here\");\nalert(\"The\
  \ largest number entered was \" + Math.max(inp1, inp2, inp3));\nalert(\"The smallest\
  \ number entered was \" + Math.min(inp1, inp2, inp3));\n// Cloaking device off -->\n\
  </script>\n```\n\n第一个弹框使用 `max` 方法显示输入的最高数字，而第二个弹框使用 `min` 方法显示最低数字。这是一个展示这些方法强大之处的简单示例。更复杂的示例可能涉及显示价格列表中最高和最低的价格，或者学生最高和最低的考试分数。\n\
  \n## 使用 `round` 方法\n\n在处理“棘手”的数字时，这是一个非常有用的方法（这里你所观察的实数类型就是一种棘手数字），因为它允许你将它们四舍五入到最近的整数。\n\
  \n如果正数的数部分为 0.5 或更大，则返回的值等于大于该数字的最小整数。否则，`round` 返回小于或等于该数字的最大整数。所以：\n\n*   `1.45`\
