  你看到其他优化方法了吗？而不是先声明变量，而是使用数组来存储从提示框输入的值。\n\n### 转义字符\n在交互故事中，你看到了 `\\\"`，它代表一个双引号。转义字符用于字符串是为了：\n\
  \n*   防止某些字符引起错误\n*   添加格式（如回车）\n\n表 5.1 列出了可用的转义字符。\n\n| 序列 | 名称 |\n| --- | ---\
  \ |\n| `\\b` | 退格 |\n| `\\t` | 水平制表符 |\n| `\\f` | 分页 |\n| `\\n` | 换行（行符） |\n| `\\\
  r` | 回车 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n\n这些字符可以放置在字符串的任何位置，前后都不需要空格。以下是转义字符实际运行的示例：\n\
  \n*   回车\n    ```javascript\n     <script language=\"JavaScript\">\n    <!-- Cloaking\
  \ device on!\n    alert(\"A carriage return lies\\rin the middle of this line!\"\
  );\n    // Cloaking device off -->\n    </script>\n    ```\n*   单、双引号\n    ```javascript\n\
  \     <script language=\"JavaScript\">\n    <!-- Cloaking device on!\n    alert(\"\
  \\ \"That wasn't how it was at all!\\ \" she said.\");\n    // Cloaking device off\
  \ -->\n    </script>\n    ```\n*   制表符\n\n\n\n\n\n```javascript\n<script language=\"\
  JavaScript\">\n<!-- Cloaking device on!\nalert(\"This line has a tab\\ there\");\n\
  // Cloaking device off -->\n</script>\n```\n\n图 5.9 显示了制表符对字符串的影响。\n\n##### 图 5.9。显示插入制表符的警告框。\n\
  \n![](img/0789724995_ch05lev1sec6_image05.gif)\n![](img/0789724995_ch05lev1sec6_image06.gif)\n\
  \n### 练习\n\n修改交互故事示例，以便使用一个 alert 框来显示整个文本。（提示：你将需要使用转义字符 `\\ r` 在每行之间创建一个换行符。）\n\
  \n### 接下来要做什么\n\n现在你已经熟悉了变量和数组，下一章将开始学习表达式、条件和运算符。\n\n## 第 6 章 表达式、条件、运算符以及更多的字符串和数字\n\
  \n在上一章中，你学习了如何在 JavaScript 代码中使用变量和数组以值的形式存储信息。在本章中，你将在此基础上进一步学习，了解如何处理这些信息。\n\n\
  本章将教你以下内容：\n\n* 表达式\n* 条件\n* 各种类型的运算符及其使用方法\n* 将字符串类型转换为数字——反之亦然！\n\n### 更多术语——什么是表达式和条件？\n\
  \n在学习任何计算机语言时，如果不偶尔跳出来向外观察，都是困难的，JavaScript 也不例外。让我们暂时为你花一点时间，看看在继续你的 JavaScript\
  \ 之旅之前需要熟悉的一些新术语。\n\n#### 表达式和条件\n\n通过变量和数组，你可以自由地以各种类型存储几乎你想要的数据。但是，你最终会对这些信息进行更多操作，而不仅仅是将它们输出到屏幕或\
  \ alert 框中。你会想要更改、处理或验证它们。表达式和条件正是用于这些目的的。\n\n表达式用于组合两个或多个值并并给你第三个新值。例如，作为一个简单的例子，如下求和就是一个表达式：\n\
  \n*   `1 + 2 = 3`\n\n你组合两个值（`1` 和 `2`）得到第三个值（`3`）。\n\n另一个例子是\n\n*   `3 + 3 - 1 =\
  \ 5`\n\n在这里，三个值（`3`、`3` 和 `1`）被组合产生另一个值（`5`）。\n\n相反，条件比较值并返回一个布尔真值——真（true）或假（false）。一个条件的例子是：\n\
  \n*   柠檬是黄色的吗？是的\n\n或者另一个例子是：\n\n*   `3 + 3 = 6` 吗？是的\n\n注意这两个条件都是具有是或否回答的问题好吧，也许柠檬的问题可以是“可能”）。对于\
  \ JavaScript（以及其他计算机语言）来说，条件的结果是是或否。\n\n注意\n\n学习 JavaScript 是有益的，因为它让你对其他编程语言有洞察。此外，事实是，在你学习了一种计算机语言后，其他语言似乎更容易学习了！\n\
  \n### 介绍运算符\n\n表达式和条件使用运算符组合数据。运算符必须作用于某个才能操作。它们可以作用于一个数据，这就是一元运算符；它们可以作用于两个数据，这就是二元运算符；或者它们可以作用于三个数据，这就是三元运算符。让我们来看一些常见的运算符。\n\
  \n#### 算术运算符\n\n这些运算符是熟悉的。它们是：\n\n*   加（+`）\n    ```\n    1 + 3 = 4\n    ```\n*\
  \   减 (`-`)\n    ```\n    2 - 1 = 1\n    ```\n*   除 (`/`)\n    ```\n    4 / 2 =\
  \ 2\n    ```\n*   乘 (`*`)\n    ```\n    2 * 2 = 4\n    ```\n*   模（%`）\n    ```\n\
  \    9 % 5 = 4\n    ```\n\n注意\n\n所有这些运算符都是二元的。唯一可能需要进一步解释的算术运算符是模运算符。这个运算符也称为余数运算符，它查看除法后的剩余部分。因此，`5`\
  \ 除以 `9` 一次，余 `4`。使用整数时，结果也是整数。然而，对于实数（浮点数，不是整数），结果是实数。例如 `5.5 % 2.2 = 1.1`。\n\n\
  警告\n\nJavaScript 在应用模运算符之前会将实数截断为整数，因此 `5.3 % 2.2 = 1`。使用这些运算符时要小心，因为它们如果使用不当，会导致\
