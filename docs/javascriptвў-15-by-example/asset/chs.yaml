  \ HTML 中位于其下方（图 13.17 显示了结果）：\n\n```html\n <html>\n<head>\n<title>A Simple Page</title>\n\
  <script language=\"JavaScript\">\n<!-- Cloaking device on!\n\n// Cloaking device\
  \ off -->\n</script>\n<style>\n<!--\n-->\n</style>\n</head>\n<body>\n<h1 style=\"\
  position:absolute;top:15px;left:10px;text-decoration:underline\"> Welcome to \n\
