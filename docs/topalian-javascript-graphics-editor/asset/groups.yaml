- md: "\n![](img/53420ea31f2d946491030784cbf3b0ae_0_0.png)\n\n**Topalian**\n\n**JavaScript**\n\
    \n**Graphics**\n\n**Editor**\n\n**by**\n\n**Christopher Andrew Topalian**\n\n\
    All Rights Reserved\n\nCopyright 2000-2024\n\n![](img/53420ea31f2d946491030784cbf3b0ae_1_0.png)\n\
    \n**Dedicated**\n\n**to**\n\n**God the Father**\n\n# Christopher Topalian\n\n\
    ![](img/53420ea31f2d946491030784cbf3b0ae_2_0.png)\n\nCollege of Scripting Music\
    \ & Science\nCollegeOfScripting.weebly.com\n\n![](img/53420ea31f2d946491030784cbf3b0ae_7_0.png)\n\
    \n**<!-- Dedicated to God the Father -->**\n\n**<!-- All Rights Reserved Christopher\
    \ Andrew Topalian Copyright 2000-2024 -->**\n\n**<!-- https://github.com/ChristopherTopalian\
    \ -->**\n\n**\\>**\n\n**<!-- https://github.com/ChristopherAndrewTopalian**\n\n\
    **n -->**\n\n**<!-- Topalian_JavaScript_Graphics_Editor.html --\\**\n\n**\\>**\n\
    \n**<!-- Version 001 - (2024-01-09) -->**\n\n![](img/53420ea31f2d946491030784cbf3b0ae_8_0.png)\n\
    \n<html>\n<head>\n<title>Topalian JavaScript Graphics Editor</title>\n<link rel='stylesheet'\
    \ href='css/style001.css'>\n<script>\nfunction ge(whichId) {\n  let result = document.getElementById(whichId);\n\
    \  return result;\n}\n\nfunction ce(whichType) {\n  let result = document.createElement(whichType);\n\
    \  return result;\n}\n\nfunction ba(whichElement) {\n  let result = document.body.append(whichElement);\n\
    \  return result;\n}\n\nfunction menuBrushOptions() {\n  if (ge('mainLineWidthDiv'))\
    \ {\n    ge('mainLineWidthDiv').remove();\n  }\n  let mainDiv = ce('div');\n \
    \ mainDiv.id = 'mainLineWidthDiv';\n  mainDiv.style.position = 'fixed';\n  mainDiv.style.right\
    \ = '3px';\n  mainDiv.style.top = '30px';\n  ba(mainDiv);\n  //-//\n  let brushOptions\
    \ = ce('div');\n  mainDiv.append(brushOptions);\n  //-//\n\n![](img/53420ea31f2d946491030784cbf3b0ae_1_0.png)\n\
    let lineWidthText = ce('span');\nlineWidthText.innerHTML = 'Line Width';\nlineWidthText.style.fontSize\
    \ = '15px';\nbrushOptions.append(lineWidthText);\n//-//\nlet linebreakLineWidthText\
    \ = ce('br');\nbrushOptions.append(linebreakLineWidthText);\n//-//\nlet lineWidthTextbox\
    \ = ce('input');\nlineWidthTextbox.type = 'text';\nlineWidthTextbox.id = 'lineWidthTextbox';\n\
    \n![](img/53420ea31f2d946491030784cbf3b0ae_12_0.png)\nlineWidthTextbox.className\
    \ = 'inputStyle001';\nlineWidthTextbox.onkeyup = function() {\n  lineWidth = lineWidthTextbox.value;\n\
    };\nbrushOptions.append(lineWidthTextbox);\n//-//\nlet brushForceLabel = ce('div');\n\
    brushForceLabel.innerHTML = 'Force N/A';\nbrushForceLabel.id = 'brushForceLabel';\n\
    brushForceLabel.style.fontSize = '15px';\nbrushOptions.append(brushForceLabel);\n\
    //-//\n\n![](img/53420ea31f2d946491030784cbf3b0ae_13_0.png)\nlet brushForceTextbox\
    \ = ce('input');\nbrushForceTextbox.type = 'text';\nbrushForceTextbox.id = 'brushForceTextbox';\n\
    brushForceTextbox.className = 'inputStyle001';\nbrushForceTextbox.title = 'brushForceTextbox';\n\
    brushForceTextbox.placeholder = 'N/A';\nbrushForceTextbox.onkeyup = function()\
    \ {\n  brushForce = brushForceTextbox.value;\n};\nbrushOptions.append(brushForceTextbox);\n\
    //-//\nbrushOptions.append(ce('br'));\n}\n\nfunction updateLineCap() {\n  if (ge('roundCap'))\
    \ {\n    ctx.lineCap = 'round';\n  } else if (ge('squareCap')) {\n    ctx.lineCap\
    \ = 'square';\n  } else if (ge('buttCap')) {\n    ctx.lineCap = 'butt';\n  }\n\
    }\n\n![](img/53420ea31f2d946491030784cbf3b0ae_15_0.png)\nfunction clearCanvas()\
    \ {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n}\n\nfunction toolboxCreate()\
    \ {\n  let mainDivToolBox = ce('div');\n  mainDivToolBox.id = 'toolbox';\n  mainDivToolBox.className\
    \ = 'mainDivToolBox';\n  ba(mainDivToolBox);\n  //-//\n  // saveButton\n  let\
    \ saveButton = ce('button');\n\n![](img/53420ea31f2d946491030784cbf3b0ae_16_0.png)\n\
    saveButton.textContent = 'Save';\n  saveButton.id = 'saveButton';\n  saveButton.className\
    \ = 'toolboxButton';\n  saveButton.onclick = function() {\n    saveDrawing();\n\
    \  };\n  mainDivToolBox.append(saveButton);\n  //-//\n  let linebreakSaveButton\
    \ = ce('br');\n  mainDivToolBox.append(linebreakSaveButton);\n  //-//\n\n![](img/53420ea31f2d946491030784cbf3b0ae_17_0.png)\n\
    // drawButton\nlet drawButton = ce('button');\ndrawButton.textContent = 'Draw';\n\
    drawButton.id = 'drawButton';\ndrawButton.className = 'toolboxButton';\ndrawButton.onclick\
    \ = function() {\n  selectTool('draw');\n};\nmainDivToolBox.append(drawButton);\n\
    //-//\nlet linebreakDrawButton = ce('br');\nmainDivToolBox.append(linebreakDrawButton);\n\
    \n![](img/53420ea31f2d946491030784cbf3b0ae_18_0.png)\n//-//\n// eraseButton\n\
    let eraseButton = ce('button');\neraseButton.textContent = 'Erase';\neraseButton.id\
    \ = 'eraseButton';\neraseButton.className = 'toolboxButton';\neraseButton.onclick\
    \ = function() {\n  selectTool('erase');\n};\nmainDivToolBox.append(eraseButton);\n\
    //-//\nlet linebreakEraseButton = ce('br');\n\n![](img/53420ea31f2d946491030784cbf3b0ae_19_0.png)\n\
    mainDivToolBox.append(linebreakEraseButton);\n//-//\nlet colorChooser = ce('input');\n\
    colorChooser.id = 'colorChooser';\ncolorChooser.type = 'color';\ncolorChooser.oninput\
    \ = function() {\n  lineColor = colorChooser.value;\n};\nmainDivToolBox.append(colorChooser);\n\
    //-//\nmainDivToolBox.append(ce('hr'));\n"
