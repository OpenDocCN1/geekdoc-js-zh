    # THEME DESIGNER


    Imagine a tool, which will help you to reduce this tedious task of changing your
    application basic look and feel without much work. Theme designer is the tool
    to automate the tedious task of changing CSS. It is a ‘What You See Is What You
    Get (WYSIWYG)’ editor.


    ![](img/e0db2820988dc54294b33092f834e7a1_90_0.png)


    You can see in above picture that, Theme designer will have a lot of in-build
    options in right hand side to change the color and basic appearance.


    You can launch Theme designer from your SAP with the Transaction-code:


    **/UI5/THEME_DESIGNER**


    Alternatively, you can go directly to below URL to access this browser based graphical
    editor.


    https://<server>:<port>/sap/bc/theming/theme-designer?sap-client=<client>'
