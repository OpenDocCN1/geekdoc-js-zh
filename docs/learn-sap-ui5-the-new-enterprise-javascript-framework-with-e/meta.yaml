    \ for creating tiles and add these tiles in a tile container. In the cloud9 shared\
    \ workspace you can see ‘tile_demo_basic_1&2.html’. The steps mentioned are simple;\
    \ we create individual tiles using ‘ StandardTile’:\n\n```\nvar oT1 = new sap.m.StandardTile({\n\
    \    title: “Dinosaur”,\n    info: “Mountain”\n    icon: “sap-icon://sap-ui5”\n\
    });\n```\n\nThis is the one tile created for Dinosaur. Similar way we can create\
    \ other tiles and name them oT2, oT3 and oT4. Inside tiles, it contains properties\
    \ like title, info and icon. In the icon property, we need to specify the icon\
    \ we are going to use. For this, we can search in UI5 icon explorer in URL https://openui5.hana.ondemand.com/iconExplorer.html.\
    \ Here select the icon you want to add and copy the name of the icon and paste\
    \ it inside the icon property.\n\nNext, create tile container and add these tiles\
    \ to the container.\n\n```\nvar oTileCont = new sap.m. oTileContainer({\n    tiles:\
