  md: '![](img/e0db2820988dc54294b33092f834e7a1_85_0.png)


    # # Responsiveness and Browser Compatibility


    Responsiveness in UI5 Application can be a make or break decisions. When you deliver
    the product for user acceptance testing, they will test the applications in their
    own devices and environment. It can be a mobile device, tablet or desktop computer.
    So you need to create the applications depends upon what your used are going to
    use. In addition, the browser that user will use should be decided initially.
    Because there are many features, which may not supported in some browsers or work
    differently in different browsers and at later point of time change can result
    into major development.


    You can check additional compatibility with browsers in API reference as well.
    There is a help section for developers in http://openui5.hana.ondemand.com, which
    gives details about browser and platform support guide.


    To put concisely, always consider these three things before taking any major decision:


    +   1. Know your customer devices and environment well.

    2. Check compatibility rules from SAP help document for running environment.

    3. Consider always the cross browser and devices usage in development phase.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# # 12. Styling and Theming for UI5 App


    The Styling and theming will make your webpage more responsive and presentable
    to your users. The responsiveness of your application is depends upon the media
    query. The media query is part of CSS. The CSS plays a major role in UI5 Applications.
    You may ask how much CSS we need to know, if we are creating end-to-end UI5 app,
    to answer this it is necessary to know CSS in detail.


    Generally, in big UI5 projects there are two set of people. Those who are focuses
    on the development and other focusing on the design. The people who are working
    in design will focus on user experience and CSS. If the people are working in
    development, they are focusing on controller, view, data and UI5 Libraries.


    We already have created one ‘Simple APP’ containing an input box and a button.
    We are going to see how to change CSS design so it look much nicer and also we
    are going to bring input box and button to centre in both mobile and desktop view
    of the application.


    ![](img/e0db2820988dc54294b33092f834e7a1_86_0.png)


    To start the process let us open our development toolkit. Now here we are going
    to use our element tab to do the changes. To focus on the input box right click
    on the input box and select inspect element. This will highlight the html content
    of the input in browser console. Let’s look for the class that is assigned to
    input element. Most of the standard CSS class starts with ‘sap’. So be careful
    when you change the standard CSS class. Because, if you change the standard class
    it will be effected everywhere in the application.'
  merge: -1
  pgno: 86
- img_proc: true
  md: "So better not to experiment with the standard classes.\n\nNow I am going to\
    \ create a custom class. For that in styles tab click the ‘+’ sign to add a class\
    \ (The highlighted class has been edited here).To this class add the width property\
    \ and assign it 60% and padding left as 30%. We need our custom styling to be\
    \ taken on highest presidency so we can add‘! important’ keyword after the style\
    \ property value. We can see in output that the input box will be aligned to middle.\
    \ Following the same steps, we can align our button to middle as well. Now, we\
    \ need to take care of the blue background color for our button. This will be\
