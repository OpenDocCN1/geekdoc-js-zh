    ## 8. Table\n\nTable is the most used elements in UI5 Library. The structure of\
    \ the table is similar to excel sheets we work with. In a table, we have a header,\
    \ which contains the title and we have rows, which contain data. Below are simplified\
    \ step to create a table with UI5.\n\n1. The first step is defining and creating\
    \ columns.\n2. The second step is to add the columns to the table.\n3. The third\
    \ step is to define how the rows will look like. Here we use ‘sap.m.ColumnListItem’.\
    \ So each individual record is treated as an individual list item.\n4. In the\
    \ final step we will bind the table with data.\n\n![](img/e0db2820988dc54294b33092f834e7a1_62_0.png)\n\
    \nBelow is the code, to create a simple ‘sap.m.Table’. Initially we define data\
    \ and model.\n\n```\nvar oModel = new sap.ui.model.json.JSONModel();// creating\
    \ a Model with this data\n```\n\nThen we need to create three columns with name,\
    \ place and id labels. Create an oCol object for the label.\n\n```\nvar oCol1\
    \ = new sap.m.Column({ // creating column 1 object for name\n    header:new sap.m.Label({\"\
    Name\"})\n}),\n\nvar oCol2 = new sap.m.Column({// creating column2 object for\
    \ Place\n    header:new sap.m.Label({\"Place\"})\n}),\n```\n\n```\n});\n\nvar\
    \ oCol3 = new sap.m.Column({// creating column3 object for Id\n\nheader:new sap.m.Label({\"\
    Id\"})\n\n}),\n```\n\nAfter that, we add column to the table\n\n```\nvar oTable\
    \ = new sap.m.Table({\n\n title:\"Simple Table\",\n\n columns:[\n\n oCol1\n\n\
    \ oCol2\n\n oCol3\n\n ]\n\n})\n```\n\nNow we need to define how the rows will\
    \ be by creating a template.\n\n```\nvar oTemp = new sap.m.ColumnListItem({\n\n\
    \ cells:[\n\n new sap.m.Text({\n\n text:\"{Name}\"\n\n }),\n\n new sap.m.Text({\n\
    \n text:\"{Place}\"\n\n }),\n\n new sap.m.Text({\n\n text:\"{id}\"\n\n })\n\n\
    \ ]\n\n})\n```\n\nFinally, we do the data binding steps, where we provide the\
    \ data path to the ‘oTemp’. In this case, the individual list items will be generated\
    \ based on the data.\n\n```\noTable.bindItems({\n\n path: \"/names\",\n\n template:\
    \ oTemp\n\n})\n```\n\nIn the previous section we saw, when we are working with\
    \ MVC Pattern, the data and model related activity should be in the controller.\
    \ Place the data and model activity inside the onInit() function of the controller\
    \ as it should be executed when the program starts execution. One more thing we\
    \ have to do is assign the model to global model. Once you set this, then data\
    \ can be accessible from anywhere in the application. Below is the code to do\
    \ that.\n\n```\nsap.ui.getCore().setModel(oModel);\n```\n\nNow when you save and\
    \ run the application. You will get the desired output, which is shown above in\
    \ the image.\n\n### Table using:sap.ui.commons\n\nThere are a lot of variations\
    \ and properties, which are given out of box with UI5 library. One such example\
    \ is use of ‘sap.ui.commons’ table. Below are the steps to perform to create a\
    \ table with commons. If we reuse the code of ‘sap.m.Table’ then, the first thing\
