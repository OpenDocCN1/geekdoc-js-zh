    ## 5. Popular UI5 Components and Data Binding


    ### Simple form creation


    There are many components present in UI5 libraries and many of them are very frequently
    used in our project. In this section, we are going to see how to use some of the
    most common components. When you are using these components, you will be constantly
    looking into the API Reference and Explorer. In Explorer, you will find how the
    components will render and in the API reference, the syntax and details are available.


    ![](img/e0db2820988dc54294b33092f834e7a1_47_0.png)


    In the cloud9 IDE we already had the basic setup for creating our UI5 Application.
    The main reason to go with cloud 9 IDE is to create a demo, which can be accessible
    globally to readers.


    The first thing we need is a simple form. For this go to explorer and search for
    simple form. Once you click on the simple form, you will get the library details
    like how to use this and which component it belongs to. Copy the library and paste
    it in API reference and search. In the results, we are interested in JSDoc Report.
    Click on it and we will get more details about the functions we can use and all
    the functions/properties, which are borrowed from its parent. We also have aggregation,
    which we will see in detail later. Now we work on the simple form and add it to
    our projects.


    To add a simple form use ‘var oSimpleForm = new sap.ui.layout.form.SimpleForm’.
    We need to pass a few properties. Here we focus on the content property. We have
    to place all the elements we need in the form inside it.


    ### Label


    In the example, we need to add a label. We can search for label in explorer, copy
    the detail and search it in API reference (library). In the library, we will get
    a better view and in explorer, we will get examples. It is better to use API Reference
    (Library) because it has detailed information like how to use it. Inside the content
    add the label with the property text (Simple text is the text we are using).


    ### Adding Simple Input


    We have already seen the use of sap.m.Input with parameters. If you don’t know
    how to put the parameters, you can search it in the API Reference for properties.
    Copy and paste the sap.m.Input and check if it is possible to use it in the placeholder
    property. You will find that it will not show any properties because it might
    be inherited from its parent class, which are available in the class sap.m.InputBase
    containing the getPlaceHolder and setPlaceHolder properties. We can also verify
    this in the console. If we open up the console and check by creating an object
    for *sap.m.Input* by entering ‘*i = new sap.m.Input()*’. Then check for the placeholder
    property by entering the ‘*i.setPlaceHolder*’ it will confirm that the property
    value can be used. In cases where you see it as undefined or null that means we
    cannot use that property. So back to the IDE and use the placeholder property
    for the sap.m.Input. Many a times, the properties are not found in the library,
    but are present in its super class.


    ### Press Me Button


    We need to add a button. For this, we use ‘sap.m.Button’ with the text property
    with the value ‘Press Me’.


    ### Rating


    Search it from the explorer if we have something related to rating. Here we need
    a rating indicator. Click on it and see how it looks like. We can use this component
    for our rating part of the requirement. So copy the detail ‘sap.m.RatingIndicator’
    and paste it inside the content. Next step will be to know how to give stars here.
    Sometimes it is easier to find property to use in explorer as well. Here they
    have given the star rating using *‘value = 3.7’* we can directly use that in our
    program. We don’t need to go in API reference because we already figured in the
    explorer about how to use it. However, you can still check in API reference and
    you will get more exposure to other properties as well. It is advisable to study
    all the components present in your library and have a good idea about what can
    be done with them.


    ### Text Area


    Search for the text area in the explorer and see what are the properties of text
    area, for example does it have a placeholder? Moreover, questions similar to that
    we can verify in the console as well. We have a *value* property here so we need
    to use that to write content inside the text area.


    ### Add Date Picker


    We are going to add the date picker. Search it in the explorer and then we are
    going to add that to our IDE. We do not have any value property here. So let’s
    keep it blank.


    ### File Browser


    The next component we have to add is the File browser. Check if we can find that
    in the explorer. Now add it in the application without any property values passed
    onto it. It will add a simple file uploader to your application.


    ### Bar with a Button on Right hand side


    The next thing we see in the form is a bar. We can get it by searching ‘Bar’ in
    the explorer. For the purpose of creating our form, we need to have a component
    bar. Inside this bar to add a component we have to use content with a button on
    the right side. Add a button using ‘sap.m.Button’. The button has a property text
    with *value* as ‘Right Side’.


    ### VBOX Button


    VBOX we will not find in the explorer. But we do have an element in UI5 library
    called VBox. It allows aligning the contents in a vertical alignment (on top of
    each other).


    ### HBOX Button


    HBOX is similar to VBox, it will align the contents in a horizontal manner. Here
    we added two buttons inside the content of HBox to align the buttons horizontally.
    You can get more information about the VBox and HBox in the API reference and
    it will be very frequently used in applications.


    You can verify if the ‘items’ aggregation is possible inside the VBox. Run the
    console window and create an object for ‘sap.m.VBox’ and check if the ‘items’
    aggregation is possible by simply typing it there. Using the text property, we
    will give the name to the buttons ‘VBOX Btn1’ and ‘VBOX Btn2’. The same way we
    can create ‘HBox’ as well.


    Finally, we can place the form content section. We are not going to create app
    or form. We can directly put it inside our ‘div’ by using ‘oSimpleForm.placeAt(“content”)’
    at the end. If we run the application then we will get the result that we are
    expecting and shown in the above screenshot of the form.


