  md: '# 6.Data in UI5 Application


    In this new section, we are going to see how data can be used in our UI5 application.
    We have already seen how to use components and how to create a basic application
    in UI5. We are going to work with JSON Data (Java Script Object Notation). If
    you have not worked with JSON before then below is a short introduction to JSON
    for beginner to JSON. If you are already familiar with it then you can skip to
    next subsection.


    ![](img/e0db2820988dc54294b33092f834e7a1_51_0.png)


    In our database, we represent data in form of table and if we represent this table,
    which is having three columns named as id, Name and waiting number in JSON format.
    Here each row in the table represents one data set. Now, if we see how this table
    can be represented in JSON format.


    In the picture on the right side, we can see that each records into corresponding
    object. The records are enclosed in three curly braces. You can also see that
    each object have some repetitive values. For example: id, Name and waiting_number.
    These are called as ‘Keys’. They represent the column value of database table.
    In the right hand side we have A1,A2 and A3 as id values Ajay, Jon and Bob as
    Name values and 1, 2, 3 for waiting_number values. These are the actual data you
    work with it. Therefore, this is the simple JSON format representation of the
    table.


    To use JSON data inside our UI5 Project. We have to create an object and we call
    that object as a ‘Model’. Then we have to attach the models to view, so that they
    consume the data inside the model. To implement this in your UI5 Application is
    very simple.'
