  mdcn: "\n## 可视化：饼图\n\n创建饼图的过程与柱状图相似。那么，让我们使用饼图和我们的动物列表来创建一个简单的应用程序。我们需要创建一个扁平化的数据集和轴。数据绑定的方式将与柱状图案例中相同，维度和度量也是一样。\n\
    \n因此，我们也需要定义三个重要部分：\n\n-   1. 扁平化的数据集\n-   2. 图表类型（柱状图或饼图）\n-   3. 轴\n\n## 饼图\n\
    \n在饼图的情况下，轴将代表用于区分不同维度的颜色。\n\n```javascript\nvar feedValueAxis = new sap.viz.ui5.controls.common.feeds.FeedItem({\
    \ //Value axis\n    'uid': \"size\",\n    'type': \"Measure\",\n    'values':\
    \ [\"Popularity\"]\n});\n\nvar feedCategoryAxis = new sap.viz.ui5.controls.common.feeds.FeedItem({\
    \ //Category axis\n    'uid': \"color\",\n    'type': \"Dimension\",\n    'values':\
    \ [\"Name\"]\n});\n\noVizFrame.addFeed(feedValueAxis); //adding dataset to value\
    \ axis\noVizFrame.addFeed(feedCategoryAxis);\noVizFrame.setVizType('pie'); //Changed\
    \ to pie\noVizFrame.setDataset(oDataset);\n});\n```\n\n你可以查看 API 参考以了解详细的实现，但目前来说，上述更改足以渲染一个简单的饼图。保存并运行应用程序，你将获得如下所示的输出：\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_130_0.png)\n\n## KPI 磁贴\n\nKPI 磁贴是基于\
    \ Fiori 的应用程序中可视化最基本的部分之一。KPI 代表关键绩效指标。在本节中，我们将看到如何创建 KPI 磁贴并将其添加到 KPI 磁贴容器中。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_130_1.png)\n\n创建 KPI 磁贴的步骤：\n\n-  \
    \ 创建一个通用磁贴\n-   将通用磁贴放置在自定义磁贴内\n-   将所有自定义磁贴放入磁贴容器中\n\n除了 `sap.m` 之外，我们还需要在索引页面中添加\
    \ `sap.suite.ui.commons`, `sap.ui.core`, `sap.viz` 库。\n\n```html\n<script id='sap-ui-bootstrap'\
    \ type='text/javascript' src='https://sapui5.hana.ondemand.com/resources/sap-ui-core.js'\
    \ data-sap-ui-theme='sap_bluecrystal' data-sap-ui-libs='sap.m,sap.suite.ui.commons,sap.ui.core,sap.viz'></script>\n\
    <!-- load the mobile lib \"sap.m\", the layout lib and the \"sap_bluecrystal\"\
    \ theme -->\n```\n\n```javascript\n<script type=\"text/javascript\">\nvar oDinoT\
    \ = new sap.suite.ui.commons.GenericTile({ //Creating tile for dinosaur\n    header:\
    \ \"Dinosaur\",\n    subheader: \"Mountains\",\n    tileContent: [\n        new\
    \ sap.suite.ui.commons.TileContent({\n            footer: \"Rank\",\n        \
    \    content: [\n                new sap.suite.ui.commons.NumericContent({ //Contains\
    \ numeric content\n                    indicator: \"Up\",\n                  \
    \  value: \"1\",\n                    valueColor: \"Good\"\n                })\n\
    \            ]\n        })\n    ]\n});\n\nvar oEleT = new sap.suite.ui.commons.GenericTile({\
    \ //Creating second tile for Elephant\n    header: \"Elephant\",\n    subheader:\
    \ \"Forest\",\n    tileContent: [\n        new sap.suite.ui.commons.TileContent({\n\
    \            footer: \"Rank\",\n            content: [\n                new sap.suite.ui.commons.NumericContent({\n\
    \                    indicator: \"Down\",\n                    value: \"2\",\n\
    \                    valueColor: \"Good\"\n                })\n            ]\n\
    \        })\n    ]\n});\n</script>\n```\n\n现在，如果我们运行代码，它将产生类似下面的结果：\n\n![](img/e0db2820988dc54294b33092f834e7a1_132_0.png)\n\
    \n你也可以查看我们的 SAPUI5 专业开发视频课程以加速学习：[此处](#) 或使用下面的二维码。\n\n## SAP - 学习 SAPUI5 专业开发\n\
    \nUI5 社区网络 · SAP 专家 - SAP 服务、SAP 咨询、SAP 教育\n\n![](img/e0db2820988dc54294b33092f834e7a1_133_0.png)\n\
    \n在顶级 Open UI5 专家的帮助下，深入学习 SAP UI5 / OpenUI5：基础与高级级别，循序渐进\n\n⭐ 56 节课程 ⏱️ 7 小时\
    \ \U0001F530 中级水平\n\n![](img/e0db2820988dc54294b33092f834e7a1_133_1.png)\n\n##\
    \ 参考与参考文献\n\n-   Open UI5 API 参考：[https://openui5.hana.ondemand.com/](https://openui5.hana.ondemand.com/)\n\
    -   UI5CN 官方博客：[http://ui5cn.com/](http://ui5cn.com/)\n-   Udemy UI5 视频课程：[https://www.udemy.com/learn-sapui5/](https://www.udemy.com/learn-sapui5/)\n\
