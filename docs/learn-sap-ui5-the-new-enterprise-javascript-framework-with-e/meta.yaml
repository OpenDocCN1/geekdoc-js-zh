  md: '# # 3. Use of Wireframe and Control Flow In App


    # ## Create a Simple App


    Now before going to the code walkthrough let us create a Simple App. To create
    a simple application we have to create a wireframe. Wireframes are used to bring
    clarity to your design. A mobile application or Website should go through a phase
    where all the requirements should be clear.


    We are going to use moqups to create wireframes. Moqupes(http://moqups.com) is
    an online tool to create wireframe. It is also a wonderful online wireframing
    tool, which can be used for free up to certain limit.


    Once you visit [www.moqups.com](http://www.moqups.com) it will ask you to login.
    You can login using your Google account as well. After login, create a new page
    here. In this page, we can use any components, which are present in the left side
    of the design area.


    For example if you want to use an input box just drag and drop it into the right
    hand side. It also has a mobile component you can search it under the components
    tool bar. We will drag and bring it to design area. Now if you want to place the
    input box on the mobile phone component right click on the box and select the
    ‘bring it forward’ option. This will place the input box on the mobile screen.
    Double click on the box and put a name. Here let us give it a label ‘Enter Name’.


    ![](img/e0db2820988dc54294b33092f834e7a1_28_0.png)


    For this simple application, we will use input box and a button. Let us add a
    button by search in the search bar under the components on left hand side. It
    will filter the button components. Select the button and drag it onto the mobile
    phone. Double click on it and name it as ‘Submit’.'
