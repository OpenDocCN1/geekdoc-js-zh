    Place\"})\n}),\n```\n\n```\n});\n\nvar oCol3 = new sap.m.Column({// 为ID创建列3对象\n\
    \nheader:new sap.m.Label({\"Id\"})\n\n}),\n```\n\n之后，我们将列添加到表格中\n\n```\nvar oTable\
    \ = new sap.m.Table({\n\n title:\"简单表格\",\n\n columns:[\n\n oCol1\n\n oCol2\n\n\
