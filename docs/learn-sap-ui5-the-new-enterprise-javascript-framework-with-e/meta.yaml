  md: '![](img/e0db2820988dc54294b33092f834e7a1_103_0.png)


    In the next section, we will see the bubbling and capturing concept and how they
    define the event execution sequence.


    # Capturing and Bubbling


    Capturing and bubbling are two ways in which an event can trigger. When you are
    working in a big project containing many events ,then sequence of execution of
    these events become important.


    For example let’s assume that we have a simple web app which with a DOM element
    tree. In the top level, we have a window with listener function cFW() for click
    events followed by  a document with action listener function CFD(). And similarly
    HTML, Body and Button that all having its action listener cFH(), cFB() and cFBtn().


    ![](img/e0db2820988dc54294b33092f834e7a1_103_1.png)


    Now if we click the button in the application. The control flow actually starts
    from the top'
  merge: -1
  pgno: 103
- img_proc: true
  md: "it starts from the cFW(), cFD(), cFH(), cFB() and finally cFBtn(). When the\
    \ control flow reaches to the button two things can happen before it goes back\
    \ to top level again. It will execute our cFBtn() function while the way down\
    \ or while the way up. You may think here what the difference is.\n\n**Capturing:**\
    \ The control flow travelling from up to down is called capturing phase. We can\
    \ use capturing if we pass the third argument for event listener function as *true*\
    \ `addEventListener(“click”, doSomething, true)`.\n\n**Bubbling:** The control\
    \ flow travelling from down to up is called Bubbling phase. We can use bubbling\
    \ if we pass the third argument for event listener function as *false* `addEventListener(“click”,\
    \ doSomething, false)`.\n\nIn this case, each of the intermediate functions get\
    \ the control flow twice. If they have the event handler for that function then\
    \ it will be executed twice.\n\nTo explain the difference, we can take the example\
    \ of our draggable button. Now if add a click event listener to this button and\
    \ its immediate parent element in DOM tree. And in first case we:\n\n+   - Execute\
    \ the event handler of button in Bubbling phase(passing false in 3rd parameter)\n\
    - Execute the event handler of its parent element also in Bubbling phase(passing\
    \ false in 3rd parameter)\n\n```\ndocument.getElementById(“_button0”).addEventListener(“click”,\
    \ function(){\n    console.log(“btn”)\n}, false);    //Mentioned false so it will\
    \ be executed in bubbling phase\n```\n\n```\ndocument.getElementById(“_page0-cont”).addEventListener(“click”,\
    \ function(){\n    console.log(“sect”)\n}, false);    //Mentioned false so it\
    \ will be executed in bubbling phase\n```\n\nNow if you click on the button then\
    \ it will show below result in console:"
  merge: -1
  pgno: 104
- img_proc: true
  md: "![](img/e0db2820988dc54294b33092f834e7a1_105_0.png)\n\nNow if we change parent\
    \ element execution sequence by making it execute in capturing phase(by passing\
    \ true in 3rd parameter):\n\n```\ndocument.getElementById(\"_page0-cont\").addEventListener(\"\
    click\", function(){\n    console.log(\"sect\")\n}, true);                   \
    \                       //Mentioned false so it will be executed in capturing\
    \ phase\n```\n\nNow the sequence of result will be reversed in console.\n\n![](img/e0db2820988dc54294b33092f834e7a1_105_1.png)\n\
    \nThis was a simple example is to understand the difference and impact of capturing\
    \ and bubbling events."
  merge: -1
  pgno: 105
