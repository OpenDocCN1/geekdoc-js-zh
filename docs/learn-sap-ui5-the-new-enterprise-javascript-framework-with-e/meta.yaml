    # 1. INTRODUCTION


    The SAPUI5 is a platform for developing rich user interfaces for modern Web business
    applications. It is supported by the browsers that support HTML5 capabilities
    in a web application.An application built with SAPUI5 is responsive across browsers
    and devices - they run on smart phones, tablets, and desktops (device that supports
    HTML5). The responsiveness is provided by the UI controls, which automatically
    adapt based device type.


    # 1.1 Prerequisites


    The skill sets you need to start with UI5 are HTML5, CSS3, JavaScript, jQuery
    and OData. Even if you don’t know any one of these skill set,it is not difficult
    to learn it over a period of time as most of the technologies are easy to learn.

    Below is an image that shows how much one need to be efficient in these technologies
    to start working with UI5.


    ![](img/e0db2820988dc54294b33092f834e7a1_10_0.png)


