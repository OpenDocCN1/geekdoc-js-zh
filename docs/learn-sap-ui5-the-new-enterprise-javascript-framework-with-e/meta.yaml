    # 5. Popular UI5 Components and Data Binding


    # Simple form creation


    There are many components present in UI5 libraries and many of them are very frequently
    used in our project. In this section, we are going to see how to use some of the
    most common components. When you are using these components, you will be constantly
    looking into the API Reference and Explorer. In Explorer, you will find how the
    components will result and in the API reference, the syntax and details are available.


    ![](img/e0db2820988dc54294b33092f834e7a1_47_0.png)


    In the cloud9 IDE we already had the basic setup for creating our UI5 Application.
    The main reason to go with cloud 9 IDE is to create a demo, which can be accessible
    globally to reader.


    The first thing we need is a simple form. For this go to explorer and search for
    simple form. Once you click on the simple form, you will get the library details
    like how to use this and which component it belong to. Copy the library and paste
    it in API reference and search. In the results, we are interested in JSDoc Report.
    Click on it and we will get more details about the function we can use and all
    the function/properties, which are borrowed, from its parent. We also have aggregation,
    which we will see in detail later. Now we work on the simple form and add it to
    our projects.


    To add a simple form use ‘var oSimpleForm = new sap.ui.layout.form.SimpleForm’.
    We need to pass few properties. Here we focused on content property. We have to
    place all the elements we needed in the form inside it.'
