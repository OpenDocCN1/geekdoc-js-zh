  - "[PAGE 53]\n\n![](img/e0db2820988dc54294b33092f834e7a1_53_0.png)\n\n# Two way\
    \ binding\n\nOne of the other term we come across is *two -way binding*. Whenever\
    \ we are binding the data to an element or component through our model, on changing\
    \ the data or elements the model data will also be also changed. So this has a\
    \ two way effect. For example, if you consider your element as your ‘destination’\
    \ and the data present in the model ‘source’. By changing the data in the source,\
    \ the data in the destination also changed and also by changing the data in the\
    \ destination, the source data also changes. This is the concept of *two- way\
    \ Binding*. We are going to see these concepts in action in out next section.\n\
