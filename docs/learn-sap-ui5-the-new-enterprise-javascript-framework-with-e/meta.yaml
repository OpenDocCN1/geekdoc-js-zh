    \nNext, remove the hard coded part, as we are going to use data binding here:\n\
    \nvar oTileTemplate = new sap.m.StandardTile({ //Creating template\nicon: “{icon}”,\n\
    title: “{Name}”,\ninfo: “{Place}”\n});\n\nvar oTileContainer = new sap.m.TileContainer(“idTileAction”,\
    \ {\n});\n\noTileContainer.bindAggregation(“tiles”, “/names”, oTileTemplate);\n\
    \n//Bind aggregation parameters contain (property,/path and template)\n\noTileContainer.setModel(oModel);\n\
    \nvar page = new sap.m.Page({\n    title: \"Simple Tile\",\n    enableScrolling:\
    \ false,\n    content: [\n        oTileContainer\n    ]\n});\nvar app = new sap.m.App();\n\
    app.addPage(page);\napp.placeAt(\"content\");\n\nThis is the general way of creating\
    \ simple tile without any hard coding. Hard coding should be avoided in project.\
    \ While using tiles in real projects as well, we should use bind aggregation function.\
    \ Below is the output, which our program results into:\n\n![](img/e0db2820988dc54294b33092f834e7a1_71_0.png)\n\
    \nYou can also check our SAPUI5 Professional Development video course for accelerated\
    \ learning: [here](https://example.com) or use the below QR code.\n\n![](img/e0db2820988dc54294b33092f834e7a1_72_0.png)\n\
    \n## SAP - Learn SAPUI5 Professional Development\n\nUI5 Community Network • SAP\
    \ Experts - SAP Services, SAP Consulting, SAP Education\n\nLearn SAP UI5 / OpenUI5\
    \ In Detail: Basic & Advanced Levels, Step By Step, With The Help Of The Best\
    \ Open UI5 Experts\n\n4.5 ★★★★★ (36 ratings)\n\n56 lectures • 7 hours • Intermediate\
    \ Level\n\n![](img/e0db2820988dc54294b33092f834e7a1_72_1.png)\n\n## 10. Data Binding\
    \ Using Factory Functions\n\nIf you are wondering, how the data binding is done\
    \ internally then the concept of factory function will give you more clarity.\
    \ Factory function is a way to implement custom logic while data binding is being\
    \ performed.\n\nFor example, if we have a requirement where, we have a list and\
    \ the description is dependent upon the title value. If main content of list is\
    \ name of the animal and the description contains some dependency on it. Then\
    \ factory functions are way to achieve those binding and make these general.\n\
    \nIn our case, if we represent list title as animal name and we have to mention\
    \ description if the animal is extinct or not. Then we need to use bindAggregation\
    \ with an additional third parameter as custom function, which contains the logic\
    \ of returning animal specific description. Below is the picture of how the code\
    \ and output will look like:\n\n![](img/e0db2820988dc54294b33092f834e7a1_74_0.png)\n\
    \nThe third parameter of *bindAggregation* function is going to be custom function,\
    \ which takes two parameter. First is sId and other is oContext. Parameter oContext\
    \ will contain all the necessary information, which you require for your operation:\n\
    \noList.bindAggregation(“items”,\n    “/names”,\nfunction(sId, oContext) {\n \
    \   var sValue = oContext.getProperty(\"Name\");\n\n    var sDesc1 = \"Are still\
    \ roaming around\"; //String Description\n    var sDesc2 = \"Are Extinct\" //String\
    \ Description\n\n    });\n\nif (sValue === \"Dinosaur\") { //If stmt to tell the\
    \ desc is extinct\n    return new sap.m.StandardListItem({\n        title: sValue,\n\
    \        description: sDesc2\n    });\n} else {\n    return new sap.m.StandardListItem({\n\
    \        title: sValue,\n        description: sDesc1\n\n        });\n}\n\nYou\
    \ can also add a debugger to debug the code by adding the ‘ debugger’ keyword\
    \ in the code. After adding the debugger inside your code, if you open the development\
    \ kit (firefox and chrome) then you can even analyse more about behavior of the\
    \ code.\n\n## NAMED MODEL\n\nThe next topic we are going to see is named model.\
    \ Previously we were having the JSON Data and setting the model with JSON Data.\
    \ Then we set that model to the Core. Now the question comes here - can we have\
    \ more than data object set to my core. And for your surprise, yes we can. Using\
    \ the concept of named model.\n\nPreviously we use the ‘sap.ui.getCore().setModel(oModel)’.\
    \ This model was set to the core and can be referred to the global model. However,\
    \ when we are using the concept of named model we have to provide a second argument.\
    \ The second argument is actually the name of the argument we are setting up.\
    \ For example XYZ, ABC or any name. This name should be a valid string character.\
    \ When we are passing the model object and the name of the model then this model\
    \ object can only be retrieved with this name. It will act as a key for this model.\n\
    \n**Global/Core Model syntax (example):** sap.ui.getCore().setModel(oModel)\n\n\
    ## Named Model syntax (example):** sap.ui.getCore().setModel(oModel,XYZ)\n\nNext\
    \ question, which comes, is how to use the named model in data binding? Below\
    \ is a simple comparison between the named model and normal model binding we were\
    \ doing previously. In case of names model we will be using ‘>’ operator to separate\
    \ the name of the model and key value in binding, as shown below:\n\n### Normal\
    \ Model\n\noList.Items({\n    path: “/names”,\n    template: new sap.m.StandardListItem({\n\
    \        title: “{Name}” // No greater than symbols for Normal Model\n       \
    \ description: “{Place}”,\n        type: sap.m.ListType.Navigation,\n        press:\
    \ [oController.showDetails, oController]\n    })\n});\n\n### Named Model\n\noList.Items({\n\
    \    path: “XYZ>/names”,\n    //Greater than symbol to represent Named Model\n\
    \    template: new sap.m.StandardListItem({\n        title: “{XYZ>Name}”\n   \
    \     //Greater than symbol to represent Named Model\n        description: “{XYZ>Place}”,\n\
    \        //Greater than symbol to represent Named Model\n        type: sap.m.ListType.Navigation,\n\
    \        press: [oController.showDetails, oController]\n    })\n});\n\nWhile you\
    \ are using the named model you have to specify name with greater than symbol\
    \ before using the keys. For example: ‘ title:”{XYZ>Name}”’.\n\nNote: Always try\
    \ to use the Global/Core Model and try to restrict the as much as you can for\
    \ named model. While you are creating multiple named model it becomes very complex\
    \ to track how many number of Named Mode actually exists.\n\nYou can also check\
    \ our SAPUI5 Professional Development video course for accelerated learning: [here](https://example.com)\
    \ or use the below QR code.\n\n![](img/e0db2820988dc54294b33092f834e7a1_77_0.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_77_1.png)\n\n## 11. Using Chrome Development\
    \ Toolkit\n\nIn this section, we are going to see how Google Chrome development\
    \ kit can help us speed our development. Google chrome is one of the best browsers\
    \ out there in the marketplace. If you are developing any application, which is\
    \ related to web, then Google Chrome is going to be the first preference. Chrome\
    \ provides a lot of out of the box features that will be very useful for a developer.\
    \ Not only for development but also for finding bugs, analysing style sheets and\
    \ correcting them on the fly. We will see the features of Google Chrome browsers\
    \ one by one.\n\n**Note:** If you have to deliver the application to the customer\
    \ and your customers are not using Google Chrome and might be using Firefox or\
    \ Internet explorer. Then you have to check the application that your customer\
    \ is using and check if everything is working or compatible with that browser\
    \ before delivering the application. Sometimes many features are not compatible\
    \ across browsers.\n\nLet’s look into the features of Google Chrome. You have\
    \ to click ‘F12’ in window machine or simply right click and select inspect element.\
    \ Now development toolkit can placed in right hand side or below the browser or\
    \ you can even separate the development kit window from *customize and control*\
    \ functionality present at top right corner.\n\nThe separate window layout will\
    \ be very useful when you have dual screens setup. For now let’s dock it in the\
    \ right hand side of the browser screen.\n\n![](img/e0db2820988dc54294b33092f834e7a1_79_0.png)"
