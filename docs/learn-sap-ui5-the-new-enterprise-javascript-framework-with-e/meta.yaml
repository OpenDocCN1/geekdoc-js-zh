    # Setting of the Libraries


    When you click on the settings icon on your left hand side of the screen, you
    will get settings to change for which theme you want to see the components. Here
    we have two main themes available. *Blue Crystal Theme* and *High contrast black*.


    # Searching for Components


    It also contains a search option to search for specific component that you can
