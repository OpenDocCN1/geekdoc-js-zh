    \ etc.\n\nFor example in our simple input app example, we can have a ‘change’\
    \ event. And when user tries to write something or change an existing value then\
    \ the action listener of this event is going to be fired.\n\nThe action listener\
    \ function should ideally be implemented in controller and they should have a\
    \ prefix ‘on’ before the name. This will help other developer to identify the\
    \ action listener from rest of the available functions.\n\nNow let us go to the\
