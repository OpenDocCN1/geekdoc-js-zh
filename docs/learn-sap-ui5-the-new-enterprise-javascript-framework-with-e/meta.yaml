    \n![](img/e0db2820988dc54294b33092f834e7a1_72_1.png)\n\n## 10. 使用工厂函数进行数据绑定\n\n\
    如果您想知道数据绑定在内部是如何完成的，那么工厂函数的概念将为您带来更多清晰度。工厂函数是一种在执行数据绑定时实现自定义逻辑的方法。\n\n例如，如果我们有这样的需求：我们有一个列表，其描述依赖于标题值。如果列表的主要内容是动物的名称，而描述中包含一些依赖关系。那么工厂函数就是实现这些绑定并使其通用化的方法。\n\
    \n在我们的例子中，如果我们将列表标题表示为动物名称，并且需要说明该动物是否已灭绝。那么我们需要使用 `bindAggregation`，其第三个参数为自定义函数，该函数包含返回特定动物描述的逻辑。下面是代码和输出效果的示意图：\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_74_0.png)\n\n*bindAggregation* 函数的第三个参数将是一个自定义函数，它接受两个参数。第一个是\
    \ `sId`，另一个是 `oContext`。参数 `oContext` 将包含您操作所需的所有必要信息：\n\noList.bindAggregation(“items”,\n\
    \    “/names”,\nfunction(sId, oContext) {\n    var sValue = oContext.getProperty(“Name”);\n\
    \n    var sDesc1 = “仍在漫游”; //字符串描述\n    var sDesc2 = “已灭绝” //字符串描述\n\n    });\n\
    \nif (sValue === “Dinosaur”) { //如果语句用来说明描述是灭绝\n    return new sap.m.StandardListItem({\n\
    \        title: sValue,\n        description: sDesc2\n    });\n} else {\n    return\
    \ new sap.m.StandardListItem({\n        title: sValue,\n        description: sDesc1\n\
    \n        });\n}\n\n您还可以通过在代码中添加 ‘debugger’ 关键字来添加调试器以调试代码。在代码中添加调试器后，如果您打开开发工具包（Firefox\
    \ 和 Chrome），您甚至可以进一步分析代码的行为。\n\n## 命名模型\n\n接下来我们要看的主题是命名模型。之前我们使用 JSON 数据并用 JSON\
    \ 数据设置模型。然后我们将该模型设置到核心。现在问题来了——能否为我的核心设置多个数据对象？令人惊讶的是，可以。使用命名模型的概念即可。\n\n之前我们使用\
    \ `sap.ui.getCore().setModel(oModel)`。该模型被设置到核心，可以称为全局模型。然而，当我们使用命名模型的概念时，我们必须提供第二个参数。第二个参数实际上是我们设置的模型的名称。例如\
    \ XYZ、ABC 或任何名称。该名称应为有效的字符串字符。当我们传递模型对象和模型名称时，该模型对象只能通过此名称检索。它将充当此模型的键。\n\n**全局/核心模型语法（示例）：**\
    \ sap.ui.getCore().setModel(oModel)\n\n## 命名模型语法（示例）：** sap.ui.getCore().setModel(oModel,XYZ)\n\
    \n接下来的问题是，如何在数据绑定中使用命名模型？下面是命名模型与我们之前使用的普通模型绑定的简单比较。在命名模型的情况下，我们将使用 `>` 运算符来分隔绑定中的模型名称和键值，如下所示：\n\
    \n### 普通模型\n\noList.Items({\n    path: “/names”,\n    template: new sap.m.StandardListItem({\n\
    \        title: “{Name}” // 普通模型没有大于号\n        description: “{Place}”,\n     \
    \   type: sap.m.ListType.Navigation,\n        press: [oController.showDetails,\
    \ oController]\n    })\n});\n\n### 命名模型\n\noList.Items({\n    path: “XYZ>/names”,\n\
    \    //大于号用于表示命名模型\n    template: new sap.m.StandardListItem({\n        title:\
    \ “{XYZ>Name}”\n        //大于号用于表示命名模型\n        description: “{XYZ>Place}”,\n \
    \       //大于号用于表示命名模型\n        type: sap.m.ListType.Navigation,\n        press:\
    \ [oController.showDetails, oController]\n    })\n});\n\n在使用命名模型时，必须在键名之前使用大于号指定名称。例如：`title:”{XYZ>Name}”`。\n\
    \n注意：始终尝试使用全局/核心模型，并尽量限制命名模型的使用。当您创建多个命名模型时，要跟踪实际存在多少个命名模型会变得非常复杂。\n\n您也可以查看我们的SAPUI5专业开发视频课程以加速学习：[这里](https://example.com)\
    \ 或使用下方的二维码。\n\n![](img/e0db2820988dc54294b33092f834e7a1_77_0.png)\n\n![](img/e0db2820988dc54294b33092f834e7a1_77_1.png)\n\
    \n## 11. 使用 Chrome 开发者工具包\n\n在本节中，我们将了解 Google Chrome 开发工具包如何帮助我们加速开发。Google Chrome\
    \ 是市场上最好的浏览器之一。如果您正在开发任何与 Web 相关的应用程序，那么 Google Chrome 将是首选。Chrome 提供了许多开箱即用的功能，这些功能对开发者非常有用。不仅用于开发，还用于查找错误、分析样式表并即时更正它们。我们将逐一查看\
    \ Google Chrome 浏览器的功能。\n\n**注意：** 如果您需要将应用程序交付给客户，而您的客户不使用 Google Chrome，可能使用的是\
    \ Firefox 或 Internet Explorer。那么您必须检查客户使用的浏览器，并在交付应用程序之前检查一切是否正常或与该浏览器兼容。有时许多功能在不同浏览器之间不兼容。\n\
    \n让我们了解一下 Google Chrome 的功能。在 Windows 机器上，您需要按 ‘F12’，或者只需右键单击并选择检查元素。现在开发工具包可以放在右侧或浏览器下方，您甚至可以从右上角的*自定义和控制*功能中将开发工具窗口分离出来。\n\
    \n当您使用双屏幕设置时，单独的窗口布局将非常有用。现在，让我们将其停靠在浏览器屏幕的右侧。\n\n![](img/e0db2820988dc54294b33092f834e7a1_79_0.png)\n"
