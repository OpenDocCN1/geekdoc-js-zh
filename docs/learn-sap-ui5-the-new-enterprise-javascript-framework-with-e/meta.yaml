  md: "# 15. App Improvement Elements\n\n# FORMATTER\n\nFormatter provides more control\
    \ in the way data is represented once it is bound to certain element. For example,\
    \ if we have to create a list that contains name of animals and the locations\
    \ they belong to concatenated together in the title. In this case, we have to\
    \ put it together in a single property.\n\nOne real example is the date. Date\
    \ can be represented in many different formats like dd/mm/yy or mm/dd/yy etc.(dd\
    \ is day, mm is month and yy is year)\n\nLet us look at the first example where\
    \ we can append ‘Name’ and ‘Place’ of the animals together:\n\nWithout Formatter\
    \ the data binding will look like :\n\n```\noList.bindItems({\n    path: “/names”,\n\
    \    template: **new** sap.m.StandardListItem({\n        title: “{Name}”,\n  \
