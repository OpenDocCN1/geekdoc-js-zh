  md: '# # 2. SAP UI5 Basics


    Let’s start with the UI5 libraries. If you want to work in an enterpriseproject
    using ‘SAPUI5’, then you have to understand the ‘UI5 Libraries’ very well.


    # ## UI5 Libraries


    Before starting with SAP UI5 development, you need to understand the UI5 libraries
    so you know ‘How to use them’ and ‘When to use them’. There are two different
    UI5 libraries present in the marketplace:


    +   - Open UI5 (with Apache 2 License)

    - SAPUI5 (with SAP License)


    The OpenUI5 is free and you will be allowed to use it without any permission from
    SAP. However, to use SAPUI5 you need to have an existing SAP license.


    The current version of Open UI5 library is “Version 1.36.6” (The versions change
    frequently. Due to many numbers of developers involved in improving the libraries.)


    ![](img/e0db2820988dc54294b33092f834e7a1_12_0.png)


    # ## Explorer Section


    The Explorer section is where you can see all the components and know how the
    individual components will behave, when we use those components in application.


    Let’s look at the libraries at [https://openui5.hana.ondemand.com/explored.html](https://openui5.hana.ondemand.com/explored.html)


    ![](img/e0db2820988dc54294b33092f834e7a1_12_1.png)


    Here we have a master detail layout where in the left side we have list of components
    and'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'in the right hand side detailed description of the components and how it will
    behave when you are using those components in your application. In mobile devices,
    it automatically adapts and shows the master detail layout in the same screen
    for better User Experience.


    # Setting of the Libraries


    When you click on the settings icon on your left hand side of the screen, you
    will get settings to change for which theme you want to see the components. Here
    we have two main themes available. *Blue Crystal Theme* and *High contrast black*.


    # Searching for Components


    It also contains a search option to search for specific component that you can
    use for UI5 Application. For Example: If you want to add a list item in your application
    then you will search for ‘list’ keyword to get the filtered results that containing
    the keyword “list”.

    Here let’s select the simple list by clicking on it; You will get the detailed
    information about the list, like which library it belongs to (here it belongs
    to “sap.m” this is present from 1.10 Version of SAP UI5). We can see lot of examples
    here, these all are individual examples showing how to use this list item on different
    type of scenarios.


    ![](img/e0db2820988dc54294b33092f834e7a1_13_0.png)


    Let us look for the first one “List-Counter Indication”. Click on that and you
    will get the description and the number in the right hand side (here it is number
    of products in that Power Projector 4713 category).'
  merge: -1
