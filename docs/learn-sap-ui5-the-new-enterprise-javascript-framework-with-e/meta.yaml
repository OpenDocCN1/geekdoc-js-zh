- md: "One of the major benefits of using a cloud-based IDE is that the entire development\
    \ environment is pre-packed. In the coming future, most of the development is\
    \ going to be done based on Cloud environment, so getting familiar with Cloud9\
    \ will be a major boost. Link for Cloud9 IDE https://c9.io/\n\nAll demo files\
    \ are available in the repository. It will be useful for your development of the\
    \ project as well, when you need access to quick syntax. It is made public and\
    \ you can access it and see a live preview of the code in URL: https://ide.c9.io/ajaytech/demo\n\
    \n## Hello World Application\n\nLet us start with the coding using UI5 Application.\
    \ It will be a hello world application. If you already worked with a UI5 Application,\
    \ you can simply skip this step because it will be a very basic Hello World Application.\n\
    \nTo create a new project click File -> New -> Other. You can see the SAP UI5\
    \ Development. If you cannot find the SAP UI5, you can search it using the keyword\
    \ UI5. It will filter down the results. Now select the application project on\
    \ the screen and click next.\n\n![](img/e0db2820988dc54294b33092f834e7a1_23_0.png)\n\
    \nYou will be asked to enter your project name. Choose your own project name.\
    \ Let us select myFirstApp_01 for our first project name. The location of the\
    \ project will be saved at the workspace folder by default, which is the location\
    \ where eclipse artifacts are present if you have not changed the workspace manually.\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_24_0.png)\n\nBelow are the options,\
    \ which you need to select, to start your first project:\n\n- **Library:** Here\
    \ there are two libraries sap.ui.commons and sap.m library. And we are going to\
    \ use the sap.m.\n- **Options:** It is having a checkbox option. If you need the\
    \ initial view to be created by default, then keep the checked option and click\
    \ next.\n\nIn this page, we have to give a name to your view controller pair.\
    \ Here we have given *demo* as the name.\n\nIn the next page, you must have a\
    \ list to select which type of view you need. You have the options like JavaScript,\
    \ XML, JSON and HTML. The JavaScript and XML are common in UI5 Application but\
    \ most people find JavaScript is easier to work with. When you are building an\
    \ enterprise application, then there is a highly likely chance that you will require\
    \ a lot of customization, which are not out of box. So using Javascript is ideal\
    \ for getting extra flexibility.\n\nOn final screen, it will show all the libraries\
    \ that will be added to the application now click finish. It will create your\
    \ Application.\n\nNow you are all set to start development in your first application.\
    \ You can see three tabs *index.html*, *demo.controller.js*, *demo.view.js*. It\
    \ is inside a folder called *myFirstApp_01*. This is the same name of the project,\
    \ which we provided in the project creation wizard.\n\nThe index.html file is\
    \ the centre of action and is the location from where program execution begins.\
    \ We run this file to start our application. To start with, let us go to demo.view.js\
    \ and change the title of the page to ‘Hello World’ instead of ‘Title’.\n\n**Code\
    \ for demo.view.js :**\n\n```javascript\nsap.ui.jsview(\"myFirstApp_01.demo\"\
    , {\n\n    /**Specifies the Controller belonging to this View. \n    *In the case\
    \ that it is not implemented, or that \"null\" is returned, this View does not\
    \ have a Controller. \n    *@member Of myFirstApp_01. demo \n    */\n    getControllerName\
    \ : function() { \n            return\" myFirstApp_01.demo\";\n    },\n\n    /**Is\
    \ initially called once after the Controller has been instantiated. It is the\
    \ place where the UI is constructed. \n    *Since the Controller is given to this\
    \ method, its event handlers can be attached right away. \n    *@member Of myFirstApp_01.demo\
    \ \n    */\n    createContent : function(oController) { \n            returnnew\
    \ sap.m.Page({\n                    title: \"Hello World\",\n                \
    \    content: [\n\n                    ]\n            });\n    }\n\n});\n```\n\
    \nOn running the code by right click on the index.html file from the project explorer\
    \ tab. There will be two major options provided ‘run on server’ and ‘Web App Preview’.\
    \ If you add some server to your eclipse like Tomcat then you can run the application\
    \ on Tomcat. In the current application, we only have HTML5 and Java Script related\
    \ artifacts so we can also go for Web App Preview. Once you press the Web App\
    \ preview, you can see the result in the IDE. Congratulations! You have created\
    \ your first Hello World Program.\n\nYou can also copy the URL and paste it in\
    \ your web browser to see the result. We will be using chrome browser a lot in\
    \ this course. It is very robust and complete development toolkit, which will\
    \ be required for front end UI Developers.\n\n![](img/e0db2820988dc54294b33092f834e7a1_26_0.png)\n\
    \nYou can also check our SAPUI5 Professional Development video course for accelerated\
    \ learning: [here](here) or use the below QR code.\n\n![](img/e0db2820988dc54294b33092f834e7a1_26_1.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_26_2.png)\n\n# 3. Use of Wireframe\
    \ and Control Flow In App\n\n## Create a Simple App\n\nNow before going to the\
    \ code walkthrough let us create a Simple App. To create a simple application\
    \ we have to create a wireframe. Wireframes are used to bring clarity to your\
    \ design. A mobile application or Website should go through a phase where all\
    \ the requirements should be clear.\n\nWe are going to use moqups to create wireframes.\
    \ Moqupes(http://moqups.com) is an online tool to create wireframe. It is also\
    \ a wonderful online wireframing tool, which can be used for free up to certain\
    \ limit.\n\nOnce you visit [www.moqups.com](http://www.moqups.com) it will ask\
    \ you to login. You can login using your Google account as well. After login,\
    \ create a new page here. In this page, we can use any components, which are present\
    \ in the left side of the design area.\n\nFor example if you want to use an input\
    \ box just drag and drop it into the right hand side. It also has a mobile component\
    \ you can search it under the components tool bar. We will drag and bring it to\
    \ design area. Now if you want to place the input box on the mobile phone component\
    \ right click on the box and select the ‘bring it forward’ option. This will place\
    \ the input box on the mobile screen. Double click on the box and put a name.\
    \ Here let us give it a label ‘Enter Name’.\n\n![](img/e0db2820988dc54294b33092f834e7a1_28_0.png)\n\
    \nFor this simple application, we will use input box and a button. Let us add\
    \ a button by search in the search bar under the components on left hand side.\
    \ It will filter the button components. Select the button and drag it onto the\
    \ mobile phone. Double click on it and name it as ‘Submit’.\n\nNow we need a label\
    \ (labels are text content) for title of the page. Search for label on the components\
    \ search bar and drag it to the mobile phone screen top. Change the name of the\
    \ label as 'Simple App'. That is it. This is the mockup, which we are going to\
    \ build in UI5. Finally, we have a simple application with a title as 'Simple\
    \ App', an input box as 'Enter name' and a Submit Button. Let us go into the eclipse\
    \ and start developing the application.\n\n# Simple App Creation\n\nNow we are\
    \ in eclipse. We are going to create a simple application. The first step was\
    \ to change the heading. For this, we can go inside the view. Here you can see\
    \ the code *sap.m.page* with the title property as “Hello World”. Now we are going\
    \ to change the hello world into ‘Simple App’ (Exactly what was mentioned in our\
    \ wireframe).\n\nIf we refer back to our wireframe, we need to create one input\
    \ box and one button now. For this, I have to go inside my Open UI5 library by\
    \ following link\n[https://tools.hana.ondemand.com/](https://tools.hana.ondemand.com/).\n\
    \nIn this case, we need the Explorer and API Reference. Open both in different\
    \ tabs. We can search in the explorer for any application components or Elements,\
    \ which we are going to use. We have to search for the ‘Input’ component that\
    \ we require right now. Search it in the box provided on the left side tab. When\
    \ we search it with sap.m.Input we will see a lot of result, we need to select\
    \ JSDoc one for sap.m.Input. Here we should check first the version which will\
    \ open in the version of UI5 library. As our eclipse version is 1.34 so we can\
    \ use it in our project.\n\nNext step will be to see how this looks in Explorer\
    \ with an example. If we go to Explorer and search ‘Input’, we will see many results,\
    \ select the first example ‘Input – Assisted’ and you can see the output how it\
    \ will look. To view the source codes click the icon on the right top corner.\
    \ This will be XML view, which we will get; here you can see what code will be\
    \ used for input tags. For our purpose, we need an input with a placeholder (‘Enter\
    \ Name’) and we can see in example that we need to use property ‘text’ for that.\
    \ Let’s go into our eclipse and use ‘sap.m.input’.\n\nNow we can go in view file\
    \ in the eclipse and we are going to change the code according to our project.\n\
    \n```javascript\ncreateContent : function(oController) {\n    var oSimpleInput\
    \ = new sap.m.Input({\n        placeholder:\"Enter Name\"\n    })\n    var oBtn\
    \ = new sap.m.Button({\n        text : ‘Submit’\n    })\n    var oPage = new sap.m.Page({\n\
    \        title: “Title”,\n        content: [\n            oSimpleInput,\n    \
    \        oBtn\n        ]\n    });\n```"
  mdcn: "\n使用云端IDE的主要优势之一是整个开发环境是预先打包好的。在未来，大部分开发工作将基于云端环境进行，因此熟悉Cloud9将是一个重要的助力。Cloud9\
    \ IDE的链接是 https://c9.io/\n\n所有示例文件都在代码库中可用。当你在项目开发中需要快速查阅语法时，它也会很有帮助。该代码库是公开的，你可以访问它并在以下网址中实时预览代码：https://ide.c9.io/ajaytech/demo\n\
    \n## Hello World 应用程序\n\n让我们从使用UI5应用程序进行编码开始。这将是一个hello world应用程序。如果你已经使用过UI5应用程序，你可以直接跳过这一步，因为这将是一个非常基础的Hello\
    \ World应用程序。\n\n要创建一个新项目，请点击 File -> New -> Other。你可以看到 SAP UI5 Development 选项。如果找不到\
    \ SAP UI5，可以使用关键字 UI5 进行搜索。它将过滤结果。现在在屏幕上选择 application project 并点击 next。\n\n![](img/e0db2820988dc54294b33092f834e7a1_23_0.png)\n\
    \n系统会要求你输入项目名称。选择你自己的项目名称。让我们为我们的第一个项目名称选择 myFirstApp_01。项目的位置将默认保存在工作区文件夹中，如果你没有手动更改工作区，那就是\
    \ Eclipse 工件所在的位置。\n\n![](img/e0db2820988dc54294b33092f834e7a1_24_0.png)\n\n以下是你需要选择的选项，以开始你的第一个项目：\n\
    \n- **库：** 这里有两个库 sap.ui.commons 和 sap.m 库。我们将使用 sap.m。\n- **选项：** 它有一个复选框选项。如果你需要默认创建初始视图，那么保持选中状态并点击\
    \ next。\n\n在这个页面，我们必须为你的视图控制器对命名。这里我们给它起名为 *demo*。\n\n在下一页，你必须有一个列表来选择你需要哪种类型的视图。你可以选择\
    \ JavaScript、XML、JSON 和 HTML 等选项。JavaScript 和 XML 在 UI5 应用程序中很常见，但大多数人发现 JavaScript\
    \ 更容易使用。当你构建企业应用程序时，你很可能需要大量非开箱即用的定制化功能。因此，使用 Javascript 是获得额外灵活性的理想选择。\n\n在最终屏幕上，它将显示将要添加到应用程序中的所有库，现在点击\
    \ finish。它将创建你的应用程序。\n\n现在你已经准备好开始在你的第一个应用程序中进行开发。你可以看到三个标签页 *index.html*、*demo.controller.js*、*demo.view.js*。它们位于名为\
    \ *myFirstApp_01* 的文件夹中。这与我们在项目创建向导中提供的项目名称相同。\n\nindex.html 文件是行动的中心，是程序执行的起点。我们运行这个文件来启动我们的应用程序。首先，让我们进入\
    \ demo.view.js，将页面的标题从 ‘Title’ 改为 ‘Hello World’。\n\n**demo.view.js 代码：**\n\n```javascript\n\
    sap.ui.jsview(\"myFirstApp_01.demo\", {\n\n    /**Specifies the Controller belonging\
    \ to this View. \n    *In the case that it is not implemented, or that \"null\"\
    \ is returned, this View does not have a Controller. \n    *@member Of myFirstApp_01.\
    \ demo \n    */\n    getControllerName : function() { \n            return\" myFirstApp_01.demo\"\
    ;\n    },\n\n    /**Is initially called once after the Controller has been instantiated.\
    \ It is the place where the UI is constructed. \n    *Since the Controller is\
    \ given to this method, its event handlers can be attached right away. \n    *@member\
    \ Of myFirstApp_01.demo \n    */\n    createContent : function(oController) {\
    \ \n            returnnew sap.m.Page({\n                    title: \"Hello World\"\
    ,\n                    content: [\n\n                    ]\n            });\n\
    \    }\n\n});\n```\n\n在项目资源管理器标签页中，右键单击 index.html 文件运行代码。将提供两个主要选项 ‘run on server’\
    \ 和 ‘Web App Preview’。如果你在 Eclipse 中添加了一些服务器（例如 Tomcat），那么你可以在 Tomcat 上运行应用程序。在当前应用程序中，我们只有\
    \ HTML5 和 JavaScript 相关的工件，所以我们也可以选择 Web App Preview。一旦你按下 Web App preview，你就可以在\
    \ IDE 中看到结果。恭喜！你已经创建了你的第一个 Hello World 程序。\n\n你也可以复制 URL 并将其粘贴到你的网络浏览器中查看结果。本课程中我们将大量使用\
    \ Chrome 浏览器。它是一个非常强大和完整的开发工具包，是前端 UI 开发人员所必需的。\n\n![](img/e0db2820988dc54294b33092f834e7a1_26_0.png)\n\
    \n你也可以查看我们的 SAPUI5 专业开发视频课程以加速学习：[这里](here) 或使用下方的二维码。\n\n![](img/e0db2820988dc54294b33092f834e7a1_26_1.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_26_2.png)\n\n# 3. 线框图和应用控制流的使用\n\n\
    ## 创建一个简单的应用程序\n\n现在，在进行代码讲解之前，让我们创建一个简单的应用程序。为了创建一个简单的应用程序，我们需要创建一个线框图。线框图用于为你的设计带来清晰度。移动应用程序或网站应该经历一个所有需求都清晰的阶段。\n\
    \n我们将使用 moqups 来创建线框图。Moqupes(http://moqups.com) 是一个在线创建线框图的工具。它也是一个出色的在线线框绘制工具，在一定限制内可以免费使用。\n\
    \n访问 [www.moqups.com](http://www.moqups.com) 后，它会要求你登录。你也可以使用你的 Google 帐户登录。登录后，创建一个新页面。在这个页面，我们可以使用设计区域左侧的任何组件。\n\
    \n例如，如果你想使用一个输入框，只需将其拖放到右侧。它也有一个移动组件，你可以在组件工具栏下搜索它。我们将它拖到设计区域。现在，如果你想将输入框放在移动电话组件上，右键单击该框并选择\
    \ ‘bring it forward’ 选项。这将把输入框放置在移动屏幕上。双击该框并输入一个名称。在这里让我们给它一个标签 ‘Enter Name’。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_28_0.png)\n\n对于这个简单的应用程序，我们将使用一个输入框和一个按钮。让我们在左侧组件下的搜索栏中搜索来添加一个按钮。它将过滤按钮组件。选择按钮并将其拖到移动电话上。双击它并命名为\
    \ ‘Submit’。\n\n现在我们需要一个标题标签（标签是文本内容）。在组件搜索栏中搜索标签并将其拖到移动电话屏幕顶部。将标签的名称更改为 'Simple\
    \ App'。就是这样。这就是我们将在 UI5 中构建的模型。最后，我们有一个标题为 'Simple App'、一个标签为 'Enter name' 的输入框和一个提交按钮的简单应用程序。让我们进入\
    \ eclipse 并开始开发应用程序。\n\n# 创建简单应用程序\n\n现在我们在 eclipse 中。我们将创建一个简单的应用程序。第一步是更改标题。为此，我们可以进入视图内部。在这里你可以看到带有\
    \ title 属性为 “Hello World” 的代码 *sap.m.page*。现在我们要将 hello world 改为 ‘Simple App’（与我们在线框图中提到的完全一致）。\n\
    \n如果我们回顾一下我们的线框图，现在需要创建一个输入框和一个按钮。为此，我必须通过以下链接进入我的 Open UI5 库\n[https://tools.hana.ondemand.com/](https://tools.hana.ondemand.com/)。\n\
    \n在这种情况下，我们需要资源管理器和 API 参考。在不同的标签页中打开两者。我们可以在资源管理器中搜索任何我们将要使用的应用程序组件或元素。我们必须搜索我们现在需要的\
    \ ‘Input’ 组件。在左侧标签页提供的框中搜索它。当我们用 sap.m.Input 搜索时，会看到很多结果，我们需要为 sap.m.Input 选择\
    \ JSDoc 那一个。这里我们应该首先检查版本，该版本将在 UI5 库的版本中打开。由于我们的 eclipse 版本是 1.34，所以我们可以在我们的项目中使用它。\n\
    \n下一步将是查看它在资源管理器中的示例外观。如果我们去资源管理器中搜索 ‘Input’，会看到许多结果，选择第一个示例 ‘Input – Assisted’，你可以看到输出的样子。要查看源代码，请单击右上角的图标。这将是\
    \ XML 视图，我们将得到它；在这里你可以看到用于输入标签的代码。为了我们的目的，我们需要一个带有占位符（‘Enter Name’）的输入，我们可以看到在示例中我们需要使用\
    \ ‘text’ 属性。让我们进入我们的 eclipse 并使用 ‘sap.m.input’。\n\n现在我们可以进入 eclipse 中的视图文件，我们将根据我们的项目更改代码。\n\
    \n```javascript\ncreateContent : function(oController) {\n    var oSimpleInput\
    \ = new sap.m.Input({\n        placeholder:\"Enter Name\"\n    })\n    var oBtn\
    \ = new sap.m.Button({\n        text : ‘Submit’\n    })\n    var oPage = new sap.m.Page({\n\
    \        title: “Title”,\n        content: [\n            oSimpleInput,\n    \
    \        oBtn\n        ]\n    });\n```\n"
