  md: "# # Fragments\n\nFragments are like actionable pop ups which comes handy in\
    \ mobile screens or tablet screens. Specifically, when you require action from\
    \ the user it will block the background and the user can only see the popup contains\
    \ some list items or some input forms.\n\n![](img/e0db2820988dc54294b33092f834e7a1_111_0.png)\n\
    \nOne interesting thing about fragment is, it shares the same controller with\
    \ the view. For example if the user want to search in the list then those event\
    \ handler is to be written on the same controller.\n\nSo let us create a simple\
    \ project. Where we will have a button and when we press the button, then the\
    \ fragment should appears. Below is the code, which we will add in the view for\
    \ placing the button in the page.\n\n```\ncreateContent : **function**(oController)\
    \ {\n\n    **var** oButton = **new** sap.m.Button({    //Creating button object\n\
    \n        text:\"Click to open fragment\",\n        press:[oController.openFragment,oController]\n\
    \    });\n\n    **var** oPage = **new** sap.m.Page({           //Creating page\n\
    \        title: \"Fragment example\",\n```"
