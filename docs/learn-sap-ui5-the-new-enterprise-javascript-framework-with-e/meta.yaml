  md: 'to build a wireframe for this and then start the development process.

    Before moving to that we want to clarify how to work with MVC pattern, it is one
    of the most common pattern in programming language and with UI5 it is a bit different
    in implementation.


    # Model View Controller (MVC)


    ![](img/e0db2820988dc54294b33092f834e7a1_39_0.png)


    MVC Stands for **Model View Controller.**


    # View


    The first step is to see what the requirement of view. It can be a wireframe or
    it can be design blue print or even a sketch drawing in pen and paper. For extending
    this application with extra elements, we need add a back button and label on the
    second page.


    # Controller


    The second thing is what the functionalities these components will perform. For
    example, what will happen when we press the back/Navigation button or what action
    needs to be performed when click on a label?


    In addition, if we enter some data in input field and hit enter, should it go
    to second page and display that data.


    # Model


    Anything, which we input in the application or the application, is consuming it
    from some source. It can be from a database or a web service. These are the models,
    which is the data for the application. We should be aware about what are the data
    types which are involve in the application, how we are presented those using view
    controller. UI5 contains some nice set of libraries to do all these model operations.
    In the coming sections, we are going to see model related functions in detail.
    This is the MVC pattern. Let us build the wire frame and after building the wireframe,
    we will go to implementation of the design in Eclipse.'
