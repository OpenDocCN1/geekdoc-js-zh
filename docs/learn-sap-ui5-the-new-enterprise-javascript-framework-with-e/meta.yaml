    After installing eclipse repository, you need to install UI5 components below
    are the steps which archives that or you can also go to [https://tools.hana.ondemand.com/#sapui5](https://tools.hana.ondemand.com/#sapui5):


    # Procedure to prepare development environment


    +   1. After installing eclipse open it and go to help. You can see install new'
