  md: "# 8. Table\n\nTable is the most used elements in UI5 Library. The structure\
    \ of the table is similar to excel sheets we work with. In a table, we have a\
    \ header, which contains the title and we have rows, which contain data. Below\
    \ are simplified step to create a table with UI5.\n\n+   1. The first step is\
    \ defining and creating columns.\n2. The second step is to add the columns to\
    \ the table.\n3. The third step is to define how the rows will look like. Here\
    \ we use ‘sap.m.ColumnListItem’. So each individual record is treated as an individual\
    \ list item.\n4. In the final step we will bind the table with data.\n\n![](img/e0db2820988dc54294b33092f834e7a1_62_0.png)\n\
    \nBelow is the code, to create a simple ‘sap.m.Table’ .Initially we define data\
    \ and model.\n\n```\nvar oModel = new sap.ui.model.json.JSONModel();// creating\
    \ a Model with this data\n```\n\nThen we need to create three columns with name,\
    \ place and id labels. Create an oCol object for the label.\n\n```\nvar oCol1\
    \ = new sap.m.Column({ // creating column 1 object for name\n    header:new sap.m.Label({\"\
    Name\"})\n}),\n\nvar oCol2 = new sap.m.Column({// creating column2 object for\
    \ Place\n    header:new sap.m.Label({\"Place\"})\n}),\n```"
