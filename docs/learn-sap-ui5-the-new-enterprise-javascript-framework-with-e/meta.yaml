    ## Advance Events\n\nMany a times you will get complex requirements. Sometimes\
    \ specifically related to odd events. You may be asked to implement some of the\
    \ events that are not present in the elements itself. One of the very popular\
    \ examples is *drag*.\n\nWhat we do when this situation arises?\n\nLuckily, we\
    \ have a huge number of libraries in Java Script world. One of the popular libraries\
    \ is jQuery UI.\n\nNow we have to create a button and make it draggable using\
    \ UI5. For that, let us create a simple application with a button and add it in\
    \ the page.\n\nNow run the application. As you can see, the button is fixed and\
    \ we drag it. We have to add a third party library here. Inside the index file,\
    \ we need to add the jQuery UI libraries. The UI5 comes with a function $.sap.require,\
    \ which allow us to add third party libraries:\n\n```\n//Third party libraries\
    \ (jQuery)\n$.sap.require('sap.ui.thirdparty.jqueryui.jquery-ui-core'); //Core\
    \ library\n$.sap.require('sap.ui.thirdparty.jqueryui.jquery-ui-widget'); //widget\
    \ library\n$.sap.require('sap.ui.thirdparty.jqueryui.jquery-ui-mouse'); //mouse\
    \ library\n$.sap.require('sap.ui.thirdparty.jqueryui.jquery-ui-draggable'); //draggable\
    \ library\n```\n\nThe ‘$’ denotes the jQuery Library. There are four libraries\
    \ that are added to this application which are core, widget, mouse and draggable.\n\
    \nInside the view, we need to add a special function called ‘addEventDelegation’\
    \ for adding for custom events:\n\n```\n.addEventDelegation({\n})\n```\n\nAdd\
    \ this inside createContent after the button function and inside this function\
    \ add a function called onAfterRendering this will contain the draggable implementation:\n\
    \n```\ncreateContent : function(oController) {\n\n        var oBtn1 = new sap.m.Button({\n\
    \            text: \"Cool Button\"\n        }).addEventDelegate({  //For adding\
    \ custom events\n\n            onAfterRendering:function(oBtn){\n            \
    \    $(oBtn.srcControl.getDomRef()).draggable({\n                    cancel:true\
    \      //jQuery element with drag parameters using a DOM Reference\n\n       \
    \         });\n            }\n        });\n\n        var oPage = new sap.m.Page({\n\
    \            title: \"Event Advance\",\n            content: [\n             \
    \   oBtn1\n            ]\n        });\n        return oPage;\n\n}\n```\n\nLet’s\
    \ run the program and check, if you are able to drag the button present on the\
    \ screen:\n\nIn the next section, we will see the bubbling and capturing concept\
    \ and how they define the event execution sequence.\n\n## Capturing and Bubbling\n\
    \nCapturing and bubbling are two ways in which an event can trigger. When you\
    \ are working in a big project containing many events, then sequence of execution\
    \ of these events become important.\n\nFor example let’s assume that we have a\
    \ simple web app which with a DOM element tree. In the top level, we have a window\
    \ with listener function cFW() for click events followed by a document with action\
    \ listener function CFD(). And similarly HTML, Body and Button that all having\
    \ its action listener cFH(), cFB() and cFBtn().\n\nNow if we click the button\
    \ in the application. The control flow actually starts from the top it starts\
    \ from the cFW(), cFD(), cFH(), cFB() and finally cFBtn(). When the control flow\
    \ reaches to the button two things can happen before it goes back to top level\
    \ again. It will execute our cFBtn() function while the way down or while the\
    \ way up. You may think here what the difference is.\n\n**Capturing:** The control\
    \ flow travelling from up to down is called capturing phase. We can use capturing\
    \ if we pass the third argument for event listener function as *true* `addEventListener(\"\
    click\", doSomething, true)`.\n\n**Bubbling:** The control flow travelling from\
    \ down to up is called Bubbling phase. We can use bubbling if we pass the third\
    \ argument for event listener function as *false* `addEventListener(\"click\"\
    , doSomething, false)`.\n\nIn this case, each of the intermediate functions get\
    \ the control flow twice. If they have the event handler for that function then\
    \ it will be executed twice.\n\nTo explain the difference, we can take the example\
    \ of our draggable button. Now if add a click event listener to this button and\
    \ its immediate parent element in DOM tree. And in first case we:\n\n- Execute\
    \ the event handler of button in Bubbling phase(passing false in 3rd parameter)\n\
    - Execute the event handler of its parent element also in Bubbling phase(passing\
    \ false in 3rd parameter)\n\n```\ndocument.getElementById(\"_button0\").addEventListener(\"\
    click\", function(){\n    console.log(\"btn\")\n}, false);    //Mentioned false\
    \ so it will be executed in bubbling phase\n```\n\n```\ndocument.getElementById(\"\
    _page0-cont\").addEventListener(\"click\", function(){\n    console.log(\"sect\"\
    )\n}, false);    //Mentioned false so it will be executed in bubbling phase\n\
    ```\n\nNow if you click on the button then it will show below result in console:"
