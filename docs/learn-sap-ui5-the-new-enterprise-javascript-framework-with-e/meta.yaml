    Here let’s select the simple list by clicking on it; You will get the detailed
    information about the list, like which library it belongs to (here it belongs
    to “sap.m” this is present from 1.10 Version of SAP UI5). We can see lot of examples
    here, these all are individual examples showing how to use this list item on different
    type of scenarios.


    ![](img/e0db2820988dc54294b33092f834e7a1_13_0.png)


    Let us look for the first one “List-Counter Indication”. Click on that and you
    will get the description and the number in the right hand side (here it is number
    of products in that Power Projector 4713 category).'
- md: 'If you want to see the code, click the icon you have on the right-hand corner
    as shown below:


    ![](img/e0db2820988dc54294b33092f834e7a1_14_0.png)


    On pressing that, you can see we have two files: an XML File and a Java Script
    File. These two files are responsible for generating the content that we see after
    we click the "List-Counter Indication". This helps a lot in the process of development
    when you are looking to add some components and you want to get quick access to
    the code. You can also see the behavior of the code by clicking back.


    At the detailed description page, you have these details like Samples, About,
    Properties, and Aggregations. The Properties and Aggregations will be required
    at the time of development, like the properties the component has and what type
    of aggregations. These are frequently used in your project. We will discuss it
    briefly in the components section in this course.


    ## UI5 Vs FIORI


    One of the popular names, which you might hear, is Fiori. Many of you might have
    this question: what is FIORI? And how is it related to UI5? So let us consider
    the Lego blocks to explain this. If UI5 is Lego blocks, then FIORI is the finished
    product. SAP FIORI are the pre-built applications which SAP ships, and SAP UI5
    are the building blocks to create these applications. Here, main importance is
    given to User Experience (UX). Basically, there are five rules which one has to
    follow to create these applications. These five rules are followed in all the
    FIORI applications, and if you are going to build any application for the purpose
    of consumption, then you should follow these five key principles.


    ![](img/e0db2820988dc54294b33092f834e7a1_14_1.png)


    SAP UI5 is the building box.


    ![](img/e0db2820988dc54294b33092f834e7a1_15_0.png)


    FIORI is the finished application using SAP UI5.


    ## Five UX key principles


    ![](img/e0db2820988dc54294b33092f834e7a1_17_0.png)


    Now we will look into these 5 key principles with an application called WPMS (Work
    Permit Management Solutions). So let''s see how these five key principles mapped
    out to a UI5 Application.


    This is the sample application, which was created for demonstration purposes for
    this book. The application is built with UI5. We are going to see how these five
    user experience principles are used while creating this application.


    ### 1. Simple


    This is the home screen and it is quite simple. It has a user ID, password, and
    a login button. We also have an Assist button on the left-hand corner of the screen.
    When you press the assist button, you will get tiles. When you press any of the
    tiles, then the input fields are automatically filled up. So you can log in with
    these credentials. Once you do that, you can see another tile screen where you
    have a lot of functionalities and features.


    If we log in as a Super User, then we have a total of seven tiles. And each belongs
    to one business functionality.


    This will be an underlying principle throughout the application where you will
    notice that navigation, use of applications is simple, and users can work on this
    application without any user manual.


    ![](img/e0db2820988dc54294b33092f834e7a1_18_0.png)


    Home Screen for Super user with all functionalities, which are **simple** to use.


    ### 2. Role Based


    If we log out from Super User and come back to the home screen, and again log
    in as "Technician", here you will only see five functionalities, which are provided
    for the technician. This is the second principle "The Application should be Role-Based".
    If you log in as a Super User, you have more functionality, and if you log in
    as a Technician, you are allowed to see only five functionalities. This is depending
    upon the business process. Depending upon your role, the functionality will be
    changing.


    ![](img/e0db2820988dc54294b33092f834e7a1_18_1.png)


    Home screen for Technician with only 5 functionalities, so the app is **role-based**.


    ### 3. Instant Value and Delightful


    Let us log in with the super user again and select the "View work permits" to
    see all the work permits with the status on the right side. You can also filter
    the work permits depending upon the status. Simply search it in the ''filter status
    box'' on the right-hand side.


    If you want to see all the approved work permits, you simply type "*approve*"
    in the box, then you will get all the approved work permits on the screen. You
    can also check the details of the work order number by clicking on it.


    Another way to filter the content is using the work order number. You have to
    type the work order number on the left-hand side, then you will get the work permits
    filtered out.


    ![](img/e0db2820988dc54294b33092f834e7a1_19_0.png)


    **See Work permit analytics:**


    If you want to have an overview idea about the status of work permits, then you
    can go into the analytics section and you can see an analytic chart. Here you
    can see the status of work permits corresponding to the work orders. The status
    bar is mentioned in different colors according to the status like Applied, Active,
    Approved, De-active, and Rejected. It is easy to see the work order has a number
    of work permits and status in an Analytic visualization. It gives us an instant
    and delightful experience.


    We can see the third work order "200710135" has multiple work permits like two
    of them are already active, one is approved, one is deactivated, and one is rejected.


    ![](img/e0db2820988dc54294b33092f834e7a1_20_0.png)


    ### 4. Coherent


    The application should be coherent. For example: If an Operational manager is
    going inside the application to activate a work permit, then the user interface
    of that is almost similar to viewing a work permit. This will give the user a
    similar user experience and create no chance for confusion while using the application.


    ![](img/e0db2820988dc54294b33092f834e7a1_20_1.png)


    ### 5. Responsive


    The last key principle is Responsive. We already know the application can support
    all the devices. Therefore, it should be responsive in all the devices like computers,
    tablets, and smartphones. We should be able to use all the features like work
    permits, filter option, analytics, etc., in all these devices.


    ![](img/e0db2820988dc54294b33092f834e7a1_21_0.png)


    ## Setting up the development environment


    To set up the development environment, we need to download "Eclipse Luna" and
    we are going to add the UI5 repositories to it.


    **Eclipse Luna IDE:** Eclipse is used to do your complete project and editing
    with this IDE. [https://eclipse.org/downloads/](https://eclipse.org/downloads/).


    Go to this link and you will directly land on the download page. It automatically
    detects the Operating System. In Windows, there are two versions available: 32-bit
    and 64-bit. To check this, right-click on "My computer or This PC" on your desktop
    and select properties, then find your system type. You need to download depending
    upon your system type.


    **Java:** Java will be required to run Eclipse, and you can download it from:
    [https://java.com/en/download/](https://java.com/en/download/)


    After installing Eclipse, you need to install UI5 components. Below are the steps
    which achieve that, or you can also go to [https://tools.hana.ondemand.com/#sapui5](https://tools.hana.ondemand.com/#sapui5):


    ### Procedure to prepare development environment


    1.  After installing Eclipse, open it and go to help. You can see "install new
    software", click on it and you will get a new window. As we are using Eclipse
    Luna, we should use https://tools.hana.ondemand.com/luna to get repository content.
    Paste this URL into the box. Once you paste the URL, you will be able to see all
    the components, which can be installed in your Eclipse.


    2.  We are focusing on UI5. So select the UI5 development toolkit for HTML5 from
    that list. You can additionally select other tools, but adding unrequired tools
    will affect the performance of the IDE. After selecting your UI Components, click
    next.


    3.  In the next page, it may show the versions which will be added to Eclipse.
    Click Next. You have to accept the license agreement and click Next to Finish.
    Once you finish these steps, your repository content will be installed. And the
    progress of installation steps depends upon your speed of internet connection.


    ![](img/e0db2820988dc54294b33092f834e7a1_22_0.png)


    ### Optional Tools


    **Sublime editor (Optional):** Sublime editor is similar to other editors like
    Notepad++. The Sublime editor has a lot of features to search, to replace, and
    for editing purposes. It is fast, free, and small.


    [www.sublimetext.com](http://www.sublimetext.com)


    **Cloud9 IDE:** It is a cloud-based IDE which is used to write your code, compile,
    and access it anywhere. You need to create an account to use the Cloud9 IDE, and
    it is free. We will be sharing a lot of code in Cloud 9 IDE and are going to use
    it for a lot of development.'
  mdcn: '

    如果你想查看代码，请点击右上角如图所示的图标：


    ![](img/e0db2820988dc54294b33092f834e7a1_14_0.png)


    点击后，你可以看到我们有两个文件：一个XML文件和一个JavaScript文件。这两个文件负责生成我们点击“List-Counter Indication”后看到的内容。这在开发过程中非常有帮助，当你需要添加一些组件并希望快速访问代码时。你也可以通过再次点击来查看代码的行为。


    在详细描述页面，你会看到诸如示例、关于、属性和聚合等详细信息。属性和聚合在开发过程中是必需的，例如组件具有的属性以及聚合的类型。这些在你的项目中经常使用。我们将在本课程的组件部分简要讨论它们。


    ## UI5 与 FIORI


    你可能听过的一个流行名称是Fiori。你们许多人可能会有这个问题：什么是FIORI？它与UI5有什么关系？那么，让我们用乐高积木来解释一下。如果UI5是乐高积木，那么FIORI就是成品。SAP
    FIORI是SAP交付的预构建应用程序，而SAP UI5是创建这些应用程序的构建块。这里主要强调用户体验（UX）。基本上，创建这些应用程序需要遵循五条规则。所有FIORI应用程序都遵循这五条规则，如果你打算构建任何用于消费的应用程序，你也应该遵循这五个关键原则。


    ![](img/e0db2820988dc54294b33092f834e7a1_14_1.png)


    SAP UI5 是构建模块。


    ![](img/e0db2820988dc54294b33092f834e7a1_15_0.png)


    FIORI 是使用 SAP UI5 构建的成品应用程序。


    ## 五个用户体验关键原则


    ![](img/e0db2820988dc54294b33092f834e7a1_17_0.png)


    现在，我们将通过一个名为 WPMS（工作许可证管理解决方案）的应用程序来探讨这五个关键原则。让我们看看这五个关键原则是如何映射到一个UI5应用程序中的。


    这是一个为本书演示目的创建的示例应用程序。该应用程序是用UI5构建的。我们将看到在创建此应用程序时，这五个用户体验原则是如何被应用的。


    ### 1. 简单


    这是主屏幕，非常简单。它包含一个用户ID、一个密码和一个登录按钮。屏幕左上角还有一个辅助按钮。当你按下辅助按钮时，你会看到磁贴。当你点击任何一个磁贴时，输入字段会自动填充。这样你就可以使用这些凭据登录。登录后，你会看到另一个磁贴屏幕，上面有很多功能和特性。


    如果我们以超级用户身份登录，那么总共有七个磁贴。每个磁贴对应一个业务功能。


    这将是整个应用程序的一个基本原则，你会注意到导航和应用程序的使用都很简单，用户无需任何用户手册即可使用此应用程序。


    ![](img/e0db2820988dc54294b33092f834e7a1_18_0.png)


    超级用户的主屏幕，包含所有**简单**易用的功能。


    ### 2. 基于角色


    如果我们从超级用户注销，返回主屏幕，然后再次以“技术人员”身份登录，这里你将只看到五个为技术人员提供的功能。这是第二个原则“应用程序应该是基于角色的”。如果你以超级用户登录，你拥有更多功能；如果你以技术人员登录，则只允许看到五个功能。这取决于业务流程。根据你的角色，功能会相应变化。


    ![](img/e0db2820988dc54294b33092f834e7a1_18_1.png)


    技术人员的主屏幕，仅有5个功能，因此应用程序是**基于角色的**。


    ### 3. 即时价值与愉悦体验


    让我们再次以超级用户身份登录，并选择“查看工作许可证”，以查看所有工作许可证及其右侧的状态。你也可以根据状态筛选工作许可证。只需在右侧的“筛选状态框”中搜索即可。


    如果你想查看所有已批准的工作许可证，只需在框中输入“*approve*”，然后屏幕上就会显示所有已批准的工作许可证。你还可以通过点击来查看工单的详细信息。


    另一种筛选内容的方法是使用工单编号。你需要在左侧输入工单编号，然后就会得到筛选后的工作许可证。


    ![](img/e0db2820988dc54294b33092f834e7a1_19_0.png)


    **查看工作许可证分析：**


    如果你想概览工作许可证的状态，可以进入分析部分查看分析图表。在这里，你可以看到与工作许可证相对应的工作许可证状态。状态栏根据状态（如已申请、活跃、已批准、已停用和已拒绝）以不同颜色显示。通过分析可视化图，可以轻松看到一个工单对应多个工作许可证及其状态。这带给我们即时且愉悦的体验。


    我们可以看到第三个工单“200710135”有多个工作许可证，例如其中两个已经激活，一个已批准，一个已停用，一个已拒绝。


    ![](img/e0db2820988dc54294b33092f834e7a1_20_0.png)


    ### 4. 一致


    应用程序应该保持一致。例如：如果一名运营经理进入应用程序以激活工作许可证，那么该界面的用户界面与查看工作许可证的界面几乎相似。这将给用户带来相似的用户体验，并在使用应用程序时不会产生混淆。


    ![](img/e0db2820988dc54294b33092f834e7a1_20_1.png)


    ### 5. 响应式


    最后一个关键原则是响应式。我们已经知道该应用程序可以支持所有设备。因此，它应该在所有设备（如计算机、平板电脑和智能手机）上都具有响应式设计。我们应该能够在所有这些设备上使用所有功能，如工作许可证、筛选选项、分析等。


    ![](img/e0db2820988dc54294b33092f834e7a1_21_0.png)


    ## 搭建开发环境


    要搭建开发环境，我们需要下载“Eclipse Luna”，并将UI5仓库添加到其中。


    **Eclipse Luna IDE：** Eclipse用于完成整个项目和使用此IDE进行编辑。[https://eclipse.org/downloads/](https://eclipse.org/downloads/)。


    访问此链接，你将直接进入下载页面。它会自动检测操作系统。在Windows中，有两个版本可用：32位和64位。要检查这一点，请右键单击桌面上的“我的电脑或此电脑”，选择属性，然后查找你的系统类型。你需要根据你的系统类型进行下载。


    **Java：** 运行Eclipse需要Java，你可以从以下地址下载：[https://java.com/en/download/](https://java.com/en/download/)


    安装Eclipse后，你需要安装UI5组件。以下是实现此操作的步骤，或者你也可以访问 [https://tools.hana.ondemand.com/#sapui5](https://tools.hana.ondemand.com/#sapui5)：


    ### 准备开发环境的步骤


    1.  安装Eclipse后，打开它并转到帮助。你可以看到“安装新软件”，点击它，你会得到一个新窗口。由于我们使用的是Eclipse Luna，我们应该使用
    https://tools.hana.ondemand.com/luna 来获取仓库内容。将此URL粘贴到框中。粘贴URL后，你将能够看到所有可以安装在Eclipse中的组件。


    2.  我们专注于UI5。因此从该列表中选择用于HTML5的UI5开发工具包。你还可以选择其他工具，但添加不必要的工具会影响IDE的性能。选择UI组件后，点击下一步。


    3.  在下一页，它可能会显示将添加到Eclipse的版本。点击下一步。你必须接受许可协议，然后点击下一步以完成。完成这些步骤后，你的仓库内容将被安装。安装步骤的进度取决于你的互联网连接速度。


    ![](img/e0db2820988dc54294b33092f834e7a1_22_0.png)


    ### 可选工具


    **Sublime编辑器（可选）：** Sublime编辑器类似于其他编辑器，如Notepad++。Sublime编辑器具有许多用于搜索、替换和编辑的功能。它快速、免费且小巧。


    [www.sublimetext.com](http://www.sublimetext.com)


    **Cloud9 IDE：** 这是一个基于云的IDE，用于编写代码、编译和随时随地访问。你需要创建一个账户才能使用Cloud9 IDE，而且它是免费的。我们将在Cloud
    9 IDE中分享大量代码，并将其用于大量开发。

    '
