    \n## 表格中的事件\n\n在前面的例子中，我们看到了列表中的事件。现在在本节中，我们将使用相同的方法为表格应用事件。我们已经有了表格的例子，在这个例子中，我们将添加一些功能，使得当我们点击表格中的某个单元格时，它会跳转到下一页并显示我们点击的行和名称。\n\
