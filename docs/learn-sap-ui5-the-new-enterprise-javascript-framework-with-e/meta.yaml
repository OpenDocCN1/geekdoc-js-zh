    ## 5. 常用 UI5 组件和数据绑定


    ### 创建简单表单


    UI5 库中存在许多组件，其中许多在我们的项目中使用非常频繁。在本节中，我们将了解如何使用一些最常见的组件。当你使用这些组件时，你会不断查看 API 参考和资源管理器。在资源管理器中，你将找到组件将如何呈现，而在
