    # Advance Events


    Many a times you will get complex requirements. Sometimes specifically related
    to odd events. You may be asked to implement some of the events that are not present
    in the elements itself. One of the very popular examples is *drag*.


    What we do when this situation arises?


    Luckily, we have a huge number of libraries in Java Script world. One of the popular
    libraries is jQuery UI.


    Now we have to create a button and make it draggable using UI5. For that, let
    us create a simple application with a button and add it in the page.


    Now run the application. As you can see, the button is fixed and we drag it. We
    have to add a third party library here. Inside the index file, we need to add
    the jQuery UI libraries. The UI5 comes with a function $.sap.require, which allow
    us to add third party libraries:


    ```

    //Third party libraries (jQuery)

    $.sap.require(''sap.ui.thirdparty.jqueryui.jquery-ui-core''); //Core library

    $.sap.require(''sap.ui.thirdparty.jqueryui.jquery-ui-widget''); //widget library

    $.sap.require(''sap.ui.thirdparty.jqueryui.jquery-ui-mouse''); //mouse library

    $.sap.require(''sap.ui.thirdparty.jqueryui.jquery-ui-draggable''); //draggable
    library

    ```'
