    \nRua Aquilino Ribeiro L280,\nPontinha, Lisbon\n1675-292 PT\n+351-968621883\n\
    www.UI5CN.com\n\n1. 本书主要分类 — 计算机 > 企业应用 > 通用\n2. 另一个主题分类 — 计算机 > Web > Web 服务与\
    \ API\n\n技术与工程。\n\n第一版\n\n轻松学习\n\n## 免费礼物券\n\n或\n\n[点击此处](url)\n\n## 您可能还对以下内容感兴趣\n\
    \nSAP® Netweaver Gateway：学习如何为 UI5 和 ABAP 项目使用 SAP® Netweaver Gateway\n\n物联网与\
    \ SAP HANA：使用 Raspberry PI、Arduino Uno、HANA XSJS 和 SAPUI5 构建您的物联网用例\n\n7 个简单步骤实现数据可视化\n\
    \n轻松学习 D3.js\n\n## 目录\n\n1. 引言\n    1.1 前提条件\n2. SAP UI5 基础\n    UI5 库\n    浏览器部分\n\
    \    库的设置\n    搜索组件\n    UI5 对比 FIORI\n    五大用户体验关键原则\n    - 简单\n    - 基于角色\n\
    \    - 即时价值与愉悦体验\n    - 一致性\n    - 响应式\n    搭建开发环境\n    准备开发环境的步骤\n    可选工具\n\
    \    Hello World 应用程序\n3. 在应用中使用线框图和控制流\n    创建一个简单应用\n    简单应用创建\n4. UI5 应用中的控制流\n\
    \    实例化视图控制器\n    验证控制流\n    扩展应用程序\n    模型视图控制器 (MVC)\n    在 Eclipse 中的实现\n\
    5. 常用 UI5 组件和数据绑定\n    创建简单表单\n6. UI5 应用程序中的数据\n7. 列表\n8. 表格\n    使用 sap.ui.commons\
    \ 的表格\n9. 磁贴\n    使用数据绑定（JSON 数据变量）创建磁贴\n10. 使用工厂函数进行数据绑定\n    命名模型\n11. 使用 Chrome\
    \ 开发工具包\n    元素选项卡\n    切换设备模式\n    浏览器控制台\n    源代码\n    网络\n    响应式和浏览器兼容性\n\
    12. UI5 应用的样式与主题\n    样式与主题，高级选项\n    媒体查询\n    主题设计器\n13. 使用事件和处理事件\n    事件\n\
    \    实际项目中的事件\n    表格中的事件\n    高级事件\n    捕获和冒泡\n14. UI5 中的杂项控件\n    UX3 控件 – SHELL\n\
    \    片段\n    分屏应用程序\n15. 应用改进元素\n[格式化器](http://)\n[国际化与本地化](http://)\n16. 使用 UI5\
    \ 进行数据可视化\n    - [Viz：柱状图](http://)\n    - [Viz：饼图](http://)\n    - [KPI 磁贴](http://)\n\
    [参考与参考文献](http://)\n\n# 1. 引言\n\nSAPUI5 是一个用于为现代 Web 业务应用程序开发丰富用户界面的平台。它得到了支持\
    \ Web 应用程序中 HTML5 功能的浏览器的支持。使用 SAPUI5 构建的应用程序具有跨浏览器和设备的响应性 - 它们可在智能手机、平板电脑和支持\
    \ HTML5 的台式机上运行。这种响应性由 UI 控件提供，这些控件会根据设备类型自动调整。\n\n## 1.1 前提条件\n\n开始学习 UI5 所需的技能集是\
    \ HTML5、CSS3、JavaScript、jQuery 和 OData。即使您不了解其中任何一项技能，由于大多数技术都易于学习，在一段时间内掌握它们并不困难。\n\
    下图展示了开始使用 UI5 工作需要在这些技术上达到的熟练程度。\n\n![](img/e0db2820988dc54294b33092f834e7a1_10_0.png)\n\
    \n您也可以查看我们的 SAPUI5 专业开发视频课程以加速学习：[点击此处](https://example.com)或使用下方二维码。\n\n![](img/e0db2820988dc54294b33092f834e7a1_10_1.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_10_2.png)\n\n# 2. SAP UI5 基础\n\n让我们从\
    \ UI5 库开始。如果您想在使用 ‘SAPUI5’ 的企业项目中工作，那么您必须非常了解 ‘UI5 库’。\n\n## UI5 库\n\n在开始 SAP\
    \ UI5 开发之前，您需要了解 UI5 库，以便知道‘如何使用它们’以及‘何时使用它们’。市场上存在两种不同的 UI5 库：\n\n- Open UI5（使用\
    \ Apache 2 许可证）\n- SAPUI5（使用 SAP 许可证）\n\nOpenUI5 是免费的，您无需获得 SAP 的任何许可即可使用它。但是，要使用\
    \ SAPUI5，您需要拥有现有的 SAP 许可证。\n\nOpen UI5 库的当前版本是“版本 1.36.6”（版本频繁更改。由于许多开发人员参与改进库。）\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_12_0.png)\n\n## 浏览器部分\n\n浏览器部分是您可以查看所有组件并了解各个组件行为的地方，当我们应用程序中使用这些组件时。\n\
    \n让我们查看库 [https://openui5.hana.ondemand.com/explored.html](https://openui5.hana.ondemand.com/explored.html)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_12_1.png)\n\n这里我们有一个主详细信息布局，左侧是组件列表，右侧是组件的详细描述以及当您在应用程序中使用这些组件时它将如何表现。在移动设备上，它会自动调整并在同一屏幕上显示主详细信息布局，以提供更好的用户体验。\n\
    \n## 库的设置\n\n当您点击屏幕左侧的设置图标时，您将获得更改组件主题的设置。这里我们有两个主要主题可用。*Blue Crystal 主题*和 *High\
    \ contrast black*。\n\n## 搜索组件\n\n它还包含一个搜索选项，用于搜索您可以用于 UI5 应用程序的特定组件。例如：如果您想在应用程序中添加列表项，那么您将搜索‘list’关键词以获取包含关键词“list”的过滤结果。\n\
    这里，让我们通过点击选择简单列表；您将获得关于该列表的详细信息，例如它属于哪个库（这里它属于“sap.m”，该库从 SAP UI5 的 1.10 版本开始存在）。我们可以在这里看到很多示例，这些都是独立的示例，展示了如何在不同类型的场景中使用此列表项。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_13_0.png)\n\n让我们看看第一个“List-Counter\
    \ Indication”。点击它，您将在右侧获得描述和数字（这里是 Power Projector 4713 类别中的产品数量）。\n"
