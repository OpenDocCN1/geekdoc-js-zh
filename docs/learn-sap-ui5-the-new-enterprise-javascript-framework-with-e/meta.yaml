- img_proc: true
  md: 'If you want to see the code click the icon, you have on the right hand corner
    as shown below:


    ![](img/e0db2820988dc54294b33092f834e7a1_14_0.png)


    On pressing that, you can see we have two files. XML File and Java Script File.
    These two files are responsible for generating the content that we see after we
    clicked the “List-Counter Indication”. This helps a lot in the process of development
    when you are looking to add some components and you want to get a quick access
    to the code. You can also see the behavior of the code by clicking back.


    At the detailed description page, you have these details like Samples, About,
    Properties and Aggregations. The Properties and Aggregations will be required
    at the time of development like, the properties the component have and what type
    of aggregations. These are frequently used in your project. We will discuss it
    briefly in the components section in this course.


    # UI5 Vs FIORI


    One of the popular names, which you might hear, is Fiori. Many of you might have
    this have this question what is FIORI? And how it is related to UI5. So let us
    consider the Lego blocks for explain this. If UI5 is Lego blocks then FIORI is
    the finished product. SAP FIORI are the pre-build applications which SAP ships
    and SAP UI5 are the building blocks to create these applications. Here main importance
    is given to User Experience (UX). Basically there are five rules which one has
    to follow to create these applications. These five rules are followed in all the
    FIORI applications and if you are going to build any application for the purpose
    of consumption then you should follow these five key principles.


    ![](img/e0db2820988dc54294b33092f834e7a1_14_1.png)


    SAP UI5 is the building box'
