    在 cloud9 IDE 中，我们已经有了创建 UI5 应用程序的基本设置。选择 cloud 9 IDE 的主要原因是创建一个可供全球读者访问的演示。


    我们需要的是一个简单的表单。为此，转到资源管理器并搜索简单表单。单击简单表单后，你将获得库的详细信息，例如如何使用它以及它属于哪个组件。复制库并粘贴到 API
    参考中搜索。在结果中，我们感兴趣的是 JSDoc 报告。点击它，我们将获得更多关于我们可使用的函数以及所有从其父级继承的函数/属性的详细信息。我们还有聚合，我们稍后会详细查看。现在我们来处理简单表单并将其添加到我们的项目中。


    要添加简单表单，请使用 ''var oSimpleForm = new sap.ui.layout.form.SimpleForm''。我们需要传递几个属性。这里我们关注
    content 属性。我们必须将所有需要在表单中的元素放在其内部。


    ### 标签


    在示例中，我们需要添加一个标签。我们可以在资源管理器中搜索标签，复制详细信息并在 API 参考（库）中搜索。在库中，我们将获得更好的视图，在资源管理器中，我们将获得示例。最好使用
    API 参考（库），因为它包含有关如何使用它的详细信息。在 content 内部，添加带有 text 属性的标签（Simple text 是我们正在使用的文本）。


    ### 添加简单输入


    我们已经看过带参数的 sap.m.Input 的用法。如果你不知道如何放置参数，可以在 API 参考中搜索属性。复制并粘贴 sap.m.Input 并检查是否可以在
    placeholder 属性中使用。你会发现它不会显示任何属性，因为它可能继承自其父类，这些属性在类 sap.m.InputBase 中可用，包含 getPlaceHolder
    和 setPlaceHolder 属性。我们也可以在控制台中验证这一点。如果我们打开控制台，通过输入 ''*i = new sap.m.Input()*''
    为 *sap.m.Input* 创建一个对象来检查。然后通过输入 ''*i.setPlaceHolder*'' 检查 placeholder 属性，这将确认该属性值可以使用。在某些情况下，如果你看到它是
    undefined 或 null，这意味着我们不能使用该属性。所以回到 IDE 并对 sap.m.Input 使用 placeholder 属性。很多时候，属性在库中找不到，但存在于其超类中。


    ### 按我按钮


    我们需要添加一个按钮。为此，我们使用 ''sap.m.Button''，其 text 属性值为 ''Press Me''。


    ### 评分


    从资源管理器搜索是否有与评分相关的内容。这里我们需要一个评分指标。单击它查看它的样子。我们可以使用此组件来满足评分部分的需求。所以复制详细信息 ''sap.m.RatingIndicator''
    并粘贴到 content 内部。下一步是了解如何在这里给出星级评分。有时在资源管理器中找到要使用的属性更容易。这里他们使用 *''value = 3.7''*
    给出了星级评分，我们可以直接在程序中使用它。我们不需要去 API 参考，因为我们已经在资源管理器中弄清楚了如何使用它。但是，你仍然可以在 API 参考中查看，并且你会接触到更多其他属性。建议研究库中存在的所有组件，并很好地了解它们可以做什么。


    ### 文本区域


    在资源管理器中搜索文本区域，查看文本区域有哪些属性，例如它是否有占位符？此外，类似的问题我们也可以在控制台中验证。这里我们有一个 *value* 属性，所以我们需要使用它来在文本区域中写入内容。


    ### 添加日期选择器


    我们将添加日期选择器。在资源管理器中搜索它，然后将其添加到我们的 IDE 中。这里我们没有任何 value 属性。所以让我们留空。


    ### 文件浏览器


    我们要添加的下一个组件是文件浏览器。检查是否可以在资源管理器中找到它。现在在不传递任何属性值的情况下将其添加到应用程序中。它将向你的应用程序添加一个简单的文件上传器。


    ### 右侧带有按钮的栏


    我们在表单中看到的下一个是一个栏。我们可以通过在资源管理器中搜索 ''Bar'' 来获取它。为了创建我们的表单，我们需要一个组件栏。在这个栏内部添加组件，我们必须使用
    content 并在右侧放置一个按钮。使用 ''sap.m.Button'' 添加一个按钮。按钮有一个 text 属性，*value* 为 ''Right
    Side''。


    ### VBOX 按钮


    我们在资源管理器中找不到 VBOX。但我们在 UI5 库中确实有一个名为 VBox 的元素。它允许以垂直对齐方式（相互堆叠）对齐内容。


    ### HBOX 按钮


    HBOX 与 VBox 类似，它将以水平方式对齐内容。这里我们在 HBox 的 content 内添加了两个按钮以水平对齐按钮。你可以在 API 参考中获取有关
    VBox 和 HBox 的更多信息，它在应用程序中会非常频繁地使用。


    你可以验证 VBox 内部是否可能有 ''items'' 聚合。运行控制台窗口，为 ''sap.m.VBox'' 创建一个对象，并通过简单输入来检查 ''items''
    聚合是否可能。使用 text 属性，我们将为按钮命名 ''VBOX Btn1'' 和 ''VBOX Btn2''。同样，我们也可以创建 ''HBox''。


    最后，我们可以放置表单内容部分。我们不打算创建 app 或 form。我们可以直接将其放入我们的 ''div'' 中，在末尾使用 ''oSimpleForm.placeAt("content")''。如果我们运行应用程序，那么我们将得到预期的结果，并显示在上面表单的截图中。


    你也可以查看我们的 SAPUI5 专业发展视频课程以加速学习：[这里](https://example.com) 或使用下方二维码。


    ![](img/e0db2820988dc54294b33092f834e7a1_49_0.png)


