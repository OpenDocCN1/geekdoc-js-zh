    \ the table\n\n```\nvar oTable = new sap.m.Table({\n\n title:\"Simple Table\"\
    ,\n\n columns:[\n\n oCol1\n\n oCol2\n\n oCol3\n\n ]\n\n})\n```\n\nNow we need\
