    \ which are having both .sapMBtnInnerclass and .btnCss are going change with the\
    \ new style rule. This is achieved by creating style rule inside selector :\n\n\
    ```\n.btnCss>.sapMBtnInner{\n}\n```\n\nFinally, this is how the CSS file will\
