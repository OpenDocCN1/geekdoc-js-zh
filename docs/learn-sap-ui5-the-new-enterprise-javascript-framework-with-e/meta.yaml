    \n                });\n            }\n        });\n\n        **var** oPage = **new**\
    \ sap.m.Page({\n            title: \"Event Advance\",\n            content: [\n\
    \                oBtn1\n            ]\n        });\n        **return** oPage;\n\
    \n}\n```\n\nLet’s run the program and check, if you are able to drag the button\
