    \n## You Might Be Also Interested In\n\nSAP® Netweaver Gateway: Learn how to use\
    \ SAP® Netweaver Gateway for UI5 and ABAP projects\n\nInternet of Things with\
    \ SAP HANA: Build Your IoT Use Case With Raspberry PI, Arduino Uno, HANA XSJS\
    \ and SAPUI5\n\nData Visualization In 7 Simple Steps\n\nLearn D3.js Simple Way\n\
    \n## Contents\n\n1. INTRODUCTION\n    1.1 Prerequisites\n2. SAP UI5 Basics\n \
    \   UI5 Libraries\n    Explorer Section\n    Setting of the Libraries\n    Searching\
    \ for Components\n    UI5 Vs FIORI\n    Five UX key principles\n    - Simple\n\
    \    - Role Based\n    - Instant Value and Delightful\n    - Coherent\n    - Responsive\n\
    \    Setting up the development environment\n    Procedure to prepare development\
    \ environment\n    Optional Tools\n    Hello World Application\n3. Use of Wireframe\
    \ and Control Flow In App\n    Create a Simple App\n    Simple App Creation\n\
    4. Control Flow in UI5 App\n    Instantiating your view controller\n    Validating\
    \ the control flow\n    Extending the Application\n    Model View Controller (MVC)\n\
    \    Implementation in Eclipse\n5. Popular UI5 Components and Data Binding\n \
    \   Simple form creation\n6. Data in UI5 Application\n7. List\n8. Table\n    Table\
    \ using: sap.ui.commons\n9. Tiles\n    Create Tiles Using Data Binding (JSON Data\
    \ variable)\n10. Data Binding Using Factory Functions\n    NAMED MODEL\n11. Using\
    \ Chrome Development Toolkit\n    Elements tab\n    Toggle Device Mode\n    BROWSER\
    \ CONSOLE\n    Source\n    Network\n    Responsiveness and Browser Compatibility\n\
    12. Styling and Theming for UI5 App\n    Styling and Theming, advance options\n\
    \    Media Query\n    THEME DESIGNER\n13. Using Events and Handling Events\n \
    \   EVENTS\n    Events in Real Project\n    Events in Tables\n    Advance Events\n\
    \    Capturing and Bubbling\n14. Miscellaneous Controls in UI5\n    UX3 Control\
    \ – SHELL\n    Fragments\n    Split Screen Application\n15. App Improvement Elements\n\
    [FORMATTER](http://)\n[Internationalization and Localization](http://)\n16. Data\
    \ Visualization Using UI5\n    - [Viz : Bar Chart](http://)\n    - [Viz : Pie\
    \ Chart](http://)\n    - [KPI Tiles](http://)\n[Referencing and Bibliography](http://)\n\
    \n# 1. INTRODUCTION\n\nThe SAPUI5 is a platform for developing rich user interfaces\
    \ for modern Web business applications. It is supported by the browsers that support\
    \ HTML5 capabilities in a web application. An application built with SAPUI5 is\
    \ responsive across browsers and devices - they run on smart phones, tablets,\
    \ and desktops (device that supports HTML5). The responsiveness is provided by\
    \ the UI controls, which automatically adapt based device type.\n\n## 1.1 Prerequisites\n\
    \nThe skill sets you need to start with UI5 are HTML5, CSS3, JavaScript, jQuery\
    \ and OData. Even if you don’t know any one of these skill set, it is not difficult\
    \ to learn it over a period of time as most of the technologies are easy to learn.\n\
    Below is an image that shows how much one need to be efficient in these technologies\
    \ to start working with UI5.\n\n![](img/e0db2820988dc54294b33092f834e7a1_10_0.png)\n\
    \nYou can also check our SAPUI5 Professional Development video course for accelerated\
    \ learning: [here](https://example.com) or use the below QR code.\n\n![](img/e0db2820988dc54294b33092f834e7a1_10_1.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_10_2.png)\n\n# 2. SAP UI5 Basics\n\n\
    Let’s start with the UI5 libraries. If you want to work in an enterprise project\
    \ using ‘SAPUI5’, then you have to understand the ‘UI5 Libraries’ very well.\n\
    \n## UI5 Libraries\n\nBefore starting with SAP UI5 development, you need to understand\
    \ the UI5 libraries so you know ‘How to use them’ and ‘When to use them’. There\
    \ are two different UI5 libraries present in the marketplace:\n\n- Open UI5 (with\
    \ Apache 2 License)\n- SAPUI5 (with SAP License)\n\nThe OpenUI5 is free and you\
    \ will be allowed to use it without any permission from SAP. However, to use SAPUI5\
    \ you need to have an existing SAP license.\n\nThe current version of Open UI5\
    \ library is “Version 1.36.6” (The versions change frequently. Due to many numbers\
    \ of developers involved in improving the libraries.)\n\n![](img/e0db2820988dc54294b33092f834e7a1_12_0.png)\n\
    \n## Explorer Section\n\nThe Explorer section is where you can see all the components\
    \ and know how the individual components will behave, when we use those components\
    \ in application.\n\nLet’s look at the libraries at [https://openui5.hana.ondemand.com/explored.html](https://openui5.hana.ondemand.com/explored.html)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_12_1.png)\n\nHere we have a master\
    \ detail layout where in the left side we have list of components and in the right\
    \ hand side detailed description of the components and how it will behave when\
    \ you are using those components in your application. In mobile devices, it automatically\
    \ adapts and shows the master detail layout in the same screen for better User\
    \ Experience.\n\n## Setting of the Libraries\n\nWhen you click on the settings\
    \ icon on your left hand side of the screen, you will get settings to change for\
    \ which theme you want to see the components. Here we have two main themes available.\
    \ *Blue Crystal Theme* and *High contrast black*.\n\n## Searching for Components\n\
    \nIt also contains a search option to search for specific component that you can\
    \ use for UI5 Application. For Example: If you want to add a list item in your\
    \ application then you will search for ‘list’ keyword to get the filtered results\
    \ that containing the keyword “list”.\nHere let’s select the simple list by clicking\
    \ on it; You will get the detailed information about the list, like which library\
    \ it belongs to (here it belongs to “sap.m” this is present from 1.10 Version\
    \ of SAP UI5). We can see lot of examples here, these all are individual examples\
    \ showing how to use this list item on different type of scenarios.\n\n![](img/e0db2820988dc54294b33092f834e7a1_13_0.png)\n\
    \nLet us look for the first one “List-Counter Indication”. Click on that and you\
    \ will get the description and the number in the right hand side (here it is number\
    \ of products in that Power Projector 4713 category)."
