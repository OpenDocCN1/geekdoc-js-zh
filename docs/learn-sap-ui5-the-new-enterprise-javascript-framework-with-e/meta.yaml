  md: "# 10. Data Binding Using Factory Functions\n\nIf you are wondering, how the\
    \ data binding is done internally then the concept of factory function will give\
    \ you more clarity. Factory function is a way to implement custom logic while\
    \ data binding is being performed.\n\nFor example, if we have a requirement where,\
    \ we have a list and the description is dependent upon the title value. If main\
    \ content of list is name of the animal and the description contains some dependency\
    \ on it. Then factory functions are way to achieve those binding and make these\
    \ general.\n\nIn our case, if we represent list title as animal name and we have\
    \ to mention description if the animal is extinct or not. Then we need to use\
    \ bindAggregation with an additional third parameter as custom function, which\
    \ contains the logic of returning animal specific description. Below is the picture\
    \ of how the code and output will look like:\n\n![](img/e0db2820988dc54294b33092f834e7a1_74_0.png)\n\
    \nThe third parameter of *bindAggregation* function is going to be custom function,\
    \ which takes two parameter. First is sId and other is oContext. Parameter oContextwill\
    \ contain all the necessary information, which you require for your operation:\n\
    \n```\noList.bindAggregation(“items”,\n    “/names”,\n```"
  merge: -1
  pgno: 74
- img_proc: true
  md: "```\nfunction(sId, oContext) {\n    var sValue = oContext.getProperty(\"Name\"\
    );\n\n    var sDesc1 = \"Are still roaming around\"; //String Description\n  \
    \  var sDesc2 = \"Are Extinct\" //String Description\n\n    });\n\nif (sValue\
    \ === \"Dinosaur\") { //If stmt to tell the desc is extinct\n    return new sap.m.StandardListItem({\n\
    \        title: sValue,\n        description: sDesc2\n    });\n} else {\n    returnnew\
    \ sap.m.StandardListItem({\n        title: sValue,\n        description: sDesc1\n\
    \n        });\n}\n```\n\nYou can also add a debugger to debug the code by adding\
    \ the ‘ debugger’ keyword in the code. After adding the debugger inside your code,\
    \ if you open the development kit (firefox and chrome) then you can even analyse\
    \ more about behavior of the code.\n\n# NAMED MODEL\n\nThe next topic we are going\
    \ to see is named model. Previously we were having the JSON Data and setting the\
    \ model with JSON Data. Then we set that model to the Core. Now the question comes\
    \ here -can we have more than data object set to my core. And for your surprise,\
    \ yes we can. Using the concept of named model.\n\nPreviously we use the ‘sap.ui.getCore().setModel(oModel)’.\
    \ This model was set to the core and can be referred to the global model. However,\
    \ when we are using the concept of named model we have to provide a second argument.\
    \ The second argument is actually the name of the argument we are setting up.\
    \ For example XYZ, ABC or any name. This name should be a valid string character.\
    \ When we are passing the model object and the name of the model then this model\
    \ object can only be retrieved with this name. It will act as a key for this model.\n\
    \n**Global/Core Model syntax (example):** sap.ui.getCore().setModel(oModel)"
  merge: -1
  pgno: 75
- img_proc: true
  md: "# **Named Model syntax (example):** sap.ui.getCore().setModel(oModel,XYZ)\n\
    \nNext question, which comes, is how to use the named model in data binding? Below\
    \ is a simple comparison between the named model and normal model binding we were\
    \ doing previously. In case of names model we will be using ‘>’ operator to separate\
    \ the name of the model and key value in binding, as shown below:\n\n# **Normal\
    \ Model**\n\n```\noList.Items({\n    path: “/names”,\n    template: new sap.m.StandardListItem({\n\
    \        title: “{Name}” // No greater than symbols for Normal Model\n       \
    \ description: “{Place}”,\n        type: sap.m.ListType.Navigation,\n        press:\
    \ [oController.showDetails, oController]\n    })\n});\n```\n\n# **Named Model**\n\
    \n```\noList.Items({\n    path: “XYZ>/names”,\n    //Greater than symbol to represent\
    \ Named Model\n    template: new sap.m.StandardListItem({\n        title: “{XYZ>Name}”\n\
    \        //Greater than symbol to represent Named Model\n        description:\
    \ “{XYZ>Place}”,\n        //Greater than symbol to represent Named Model\n   \
    \     type: sap.m.ListType.Navigation,\n        press: [oController.showDetails,\
    \ oController]\n    })\n});\n```\n\nWhile you are using the named model you have\
    \ to specify name with greater than symbol before using the keys. For example:\
    \ ‘ title:”{XYZ>Name}”’.\n\nNote: Always try to use the Global/Core Model and\
    \ try to restrict the as much as you can"
  merge: -1
