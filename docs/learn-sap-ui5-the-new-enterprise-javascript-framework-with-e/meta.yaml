    \ with curly braces\n    })\n});\n```\n\nWith Formatter the data binding will\
    \ look like :\n\n```\noList.bindItems({\n    path: “/names”,\n    template: new\
    \ sap.m.StandardListItem({\n        title: ({\n            parts: [{\n       \
    \         path: “Name”,\n                //Key with path without curly braces\n\
    \                type:\n```"
