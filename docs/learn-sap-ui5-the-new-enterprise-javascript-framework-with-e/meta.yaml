    The header section will gives you a glimpse of all the details like request method,
    request URL and the status code. These will be handy when you are debugging and
    can verify if all the API communications are carried out as expected. In addition,
    there is also a filter tab available where you can filter the contents using name
    and the type like CSS, JS, Image, media and much more.'
