    \  ]\n});\n\nreturn oPage;       /** 返回 oPage */\n}\n```\n\n## 控制器函数\n\n在控制器中，我们添加函数\
    \ ‘goToSecondPage: function(oEvt)’。添加此函数后，控制器将知道当按钮被按下时该做什么。\n\n### 第二页的视图控制器\n\
    \n![视图控制器](img/e0db2820988dc54294b33092f834e7a1_42_0.png)\n\n我们需要为第二页创建一个新的视图控制器。为此，我们转到\
