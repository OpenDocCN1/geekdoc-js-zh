    \ if we enter some data in input field and hit enter, should it go to second page\
    \ and display that data.\n\n## Model\n\nAnything, which we input in the application\
    \ or the application, is consuming it from some source. It can be from a database\
    \ or a web service. These are the models, which is the data for the application.\
