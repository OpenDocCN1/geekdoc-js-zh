  md: "The ‘$’ denotes the jQuery Library. There are four libraries that are added\
    \ to this application which are core, widget, mouse and draggable.\n\nInside the\
    \ view, we need to add a special function called ‘addEventDelegation’ for adding\
    \ for custom events:\n\n```\n.addEventDelegation({\n})\n```\n\nAdd this inside\
    \ createContent after the button function and inside this function add a function\
