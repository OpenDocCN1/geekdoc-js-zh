    \ iPhone, eCommerce, bigfoot 等）。当您在应用程序中使用某个变量时，最好使用一个前缀来表示它的类型。它可能是整数类型、字符串类型或布尔类型。这里我们的\
    \ oPage 对象以 o 开头，表示它是一个对象。现在我们将返回 oPage。\n\n我们可以重新创建在上一节中已经创建的页面。这里我们需要添加输入框和按钮。\n\
    \n`createContent : function(oController) {`\n\n```javascript\nvar oSimpleInput\
