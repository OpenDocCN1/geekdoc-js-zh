  md: "![](img/e0db2820988dc54294b33092f834e7a1_53_0.png)\n\n# Two way binding\n\n\
    One of the other term we come across is *two -way binding*. Whenever we are binding\
    \ the data to an element or component through our model, on changing the data\
    \ or elements the model data will also be also changed. So this has a two way\
    \ effect. For example, if you consider your element as your ‘destination’ and\
    \ the data present in the model ‘source’. By changing the data in the source,\
    \ the data in the destination also changed and also by changing the data in the\
    \ destination, the source data also changes. This is the concept of *two- way\
    \ Binding*. We are going to see these concepts in action in out next section.\n\
    \nNow let us see how to accomplish this using UI5 lib.\n\nNow if we go to our\
    \ *model_demo_basic_1.html* code inside our clou9 editor then, you can see here\
    \ the structure is pretty simple. We are having the script tab, which is including\
    \ our UI5 libraries from ‘openui5.hana.ondemand.com’ with a blue crystal theme\
    \ and we also including the ‘sap.m’ library.\n\nThese are very frequently used\
    \ snippets. In the body, you can see a class called ‘sapUiBody’, which will be\
    \ containing the app. This is the basic skeleton, which will load our UI5 library.\n\
    \nHere we creating two variables and those will be actually two labels of class\
    \ ‘sap.m.label’. With a text property.\n\n```\n<script>\n\nvar label1 =new sap.m.Label({\
    \ /** creating path label1 */\n\ttext:\"{key1}\" \t\t\t\t/** You need to use {}\
    \ for data binding*/\n\t});\n\nvar label2 =new sap.m.Label({ /**creating path\
    \ label2 */\n\ttext:\"{key2}\"\n\t});\n\nvar oData = {\n\t\"key1\":\"Dinosars\"\
    ,\t\t\t /* JSON Data for key 1\n\t\"key2\":\"Elephant\"\t\t /* JSON Data for key\
    \ 2*/\n\t};\n```"
