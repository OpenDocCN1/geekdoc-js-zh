    # # 4. Control Flow in UI5 App


    If we look at the control flow in our UI5 Application the program execution starts
    from the index file which is ‘index.html’. The first action is loading our library
    file.


    ```

    <script


    src=“resources/sap-ui-core.js


    id=“sap-ui-bootstrap”


    data-sap-ui-libs=“sap.m”


    data-sap-ui-theme=“sap_bluecrystal


    </script>

    ```


    You can see here the “src=‘resource/sap-ui-core.js’” will load the core library
    file for our UI5 Application. This process is also called as **Bootstrapping**.
    Here you can also mention the library file that is required for our application.
    One more thing we need is which are the libraries we require for our application
    in this case it is ‘sap.m’. Here you can see that we are only mentioning ‘sap.m’
    but sometimes we may require some feature, which needs analytics in your application.
    In that case we will use library called ‘sap.m,sap.viz’. Which you will be mentioning
    beside ‘sap.m’. Similarly, there are lot of other libraries like “sap.ui.commons”.
    We will see these in future sections.


    The theme, which we are going to use here, is blue crystal theme. It is the most
    commonly used theme in UI5 Application and also the default theme which is created
    when you create the project. In future, we will also see the process of creating
    own custom theme or using custom CSS.


