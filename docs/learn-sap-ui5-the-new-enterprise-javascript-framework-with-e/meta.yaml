  md: '# # Five UX key principles


    ![](img/e0db2820988dc54294b33092f834e7a1_17_0.png)


    Now we will look into these 5 key principles with an application called WPMS (Work
    Permit Management Solutions). So let see how these five key principles mapped
    out to an UI5 Applications.


    This is the sample application, which was created for demonstration purpose for
    this book. The application is built with UI5. We are going to see how these five
    user experience principles are used while creating this application.


    # ## 1. Simple


    This is the home screen and it is quite simple. It has a user ID, password and
    a login button. We also have an Assist button on the left hand corner of the screen.
    When you press the assist button, you will get tiles. When you press any of the
    tiles then the input fields are automatically filled up. So you can log in with
    these credentials. Once you do that, you can see another tile screen where you
    have a lot of functionalities and features.


    If we logged in as a Super User then we have total seven tiles. And each belongs
    to one business functionality.


    This will be an underlying principle thought out the application where you will
    notice that navigation, use of applications is simple, and users can work on this
    application without any user-manual.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '![](img/e0db2820988dc54294b33092f834e7a1_18_0.png)


    Home Screen for Super user with all functionalities, which are **simple** to use.


    # 2. Role Based


    If we, log out from Super User and come back to the home screen. And again login
    as“Technician”. Here you will get only see five functionalities, which are provided
    for technician. This is the second principle “The Application should be Role-Based”.
    If you login as a Super User you have more functionality and if you login as a
    Technician, you are allowed to see only five functionality. This is depending
    upon business Process. Depending upon your role the functionality will be changing.


    ![](img/e0db2820988dc54294b33092f834e7a1_18_1.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Home screen for Technician with only 5 functionalities, so the app is **role-based**.


    # 3. Instant Value and Delightful


    Let us login with the super user again and select the “View work permits” to see
    all the work permits with the status on the right side. You can also filter the
    work permits depending upon the status. Simply search it on the ‘filter status
    box’ on the right hand side.


    If you want to see all the approved work permits, you simply type “*approve*”
    on the box then you will get all the approved work permits on the screen. You
    can also check the details of the work order number by clicking on it.


    Another way to filter the content is using the work order number. You have to
    type the work order number on the left hand side then you will get the work permits
    filtered out.


    ![](img/e0db2820988dc54294b33092f834e7a1_19_0.png)


    **See Work permit analytics:**


    If you want to have an overview idea about the status of work permits, then you
    can go into analytics section and you can see an analytic chart. Here you can
    see the status of work permits corresponding to the work orders. The status bar
    is mentioned in different colors according to the status like Applied, Active,
    Approved, De-active and Rejected. It is easy to see the work order has number
    of work permits and status in an Analytic visualization. It gives us an instant
    and delightful experience.


    We can see the third work order “200710135” has multiple work permits like two
    of them are already active, one is approved, one is deactivated and one is rejected.'
