- md: "So better not to experiment with the standard classes.\n\nNow I am going to\
    \ create a custom class. For that in styles tab click the ‘+’ sign to add a class\
    \ (The highlighted class has been edited here). To this class add the width property\
    \ and assign it 60% and padding left as 30%. We need our custom styling to be\
    \ taken on highest presidency so we can add ‘! important’ keyword after the style\
    \ property value. We can see in output that the input box will be aligned to middle.\
    \ Following the same steps, we can align our button to middle as well. Now, we\
    \ need to take care of the blue background color for our button. This will be\
    \ little tricky because, we have to involve standard style class ‘.sapMBtnInner’\
    \ to make this changes. You will notice that if you add the property:\n\n```\n\
    background:#007cc0;\n```\n\ninside class ‘.sapMBtnInner’, then the background\
    \ of the button will be changed. As we already know that changing the standard\
    \ style class is not a good practice, so to achieve that we will create .btnCss\
    \ custom class. And we will write the styling rule in such a way that all the\
    \ elements which are having both .sapMBtnInner class and .btnCss are going change\
    \ with the new style rule. This is achieved by creating style rule inside selector:\n\
    \n```\n.btnCss>.sapMBtnInner{\n}\n```\n\nFinally, this is how the CSS file will\
    \ look like:\n\n```\n.inputCss{ //CSS class for input\n    width: 60%!important;\n\
    \    padding-left: 30%!important;\n}\n\n.btnCss{ //CSS Class for button\n    width:\
    \ 60%!important;\n    padding-left: 30%!important;\n}\n\n.btnCss>.sapMBtnInner{\
    \ //Apply the property to the element sapMBtnInner\n    background:#007cc0;\n\
    }\n```\n\nto link this CSS file we can use `<link>` tag:\n\n```\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/custom.css\">\n```\n\nNow in view we\
    \ have to use ‘ addStyleClass ’ function to link the new CSS properties as shown\
    \ below:\n\n```\ncreateContent : function(oController) {\n    var oSimpleInput\
    \ = new sap.m.Input({\n        placeholder: \"Enter Name\"\n    }).addStyleClass(\"\
    inputCss\"); //class for CSS\n    var oBtn = new sap.m.Button({\n        text:\
    \ \"Submit\"\n    }).addStyleClass(\"btnCss\"); //Class for CSS\n    var oPage\
    \ = new sap.m.Page({\n        title: \"Simple App\",\n        content: [\n   \
    \         oSimpleInput,\n            oBtn\n        ]\n    });\n```\n\nAnd once\
    \ we run this code in our web browser, we will be able to achieve our desired\
    \ output:\n\n![](img/e0db2820988dc54294b33092f834e7a1_89_0.png)\n\n![](img/e0db2820988dc54294b33092f834e7a1_89_1.png)\n\
    \n## Styling and Theming, advance options\n\n## Media Query\n\nMedia query gives\
    \ you control on, how your application will look in different resolution screen.\
    \ Such as mobile, tablet or desktop computer screen. Below is a simple example\
    \ of media query:\n\n```\n@medi screen and (max-width:600px){\n    .hBoxForm{\n\
    \        padding-left: 10%;\n    }\n    .vBoxForm{\n        padding-left: 18%;\n\
    \    }\n}\n```\n\nIn above CSS, the `.hBoxForm` and `.vBoxForm` are going be applied\
    \ to only the screen which are having less than 600px width. Now you might be\
    \ thinking that, this will result into a big and complex CSS file. That is true\
    \ and the primary reason why CSS files in UI5 projects are generally large in\
    \ size.\n\n## THEME DESIGNER\n\nImagine a tool, which will help you to reduce\
    \ this tedious task of changing your application basic look and feel without much\
    \ work. Theme designer is the tool to automate the tedious task of changing CSS.\
    \ It is a ‘What You See Is What You Get (WYSIWYG)’ editor.\n\n![](img/e0db2820988dc54294b33092f834e7a1_90_0.png)\n\
    \nYou can see in above picture that, Theme designer will have a lot of in-build\
    \ options in right hand side to change the color and basic appearance.\n\nYou\
    \ can launch Theme designer from your SAP with the Transaction-code:\n\n**/UI5/THEME_DESIGNER**\n\
    \nAlternatively, you can go directly to below URL to access this browser based\
    \ graphical editor.\n\nhttps://<server>:<port>/sap/bc/theming/theme-designer?sap-client=<client>\n\
    \n(You need to change server and port name here and replace with the Server and\
    \ Port name of your SAP system).\n\nOnce you are finished with the design and\
    \ changes then, you can see the list of themes available and you can import the\
    \ theme. It will ask for a link. If you have an application running on SAP Server\
    \ then you can use the link to open it in theme designer.\n\n![](img/e0db2820988dc54294b33092f834e7a1_91_0.png)\n\
    \nFor now, we are going to use standard theme present in explorer for demonstration.\
    \ Next option in the page you can see is SAP UI5 Application preview. Select that\
    \ option and in the next page you can see two checkboxes *SAP Fiori launchpad*\
    \ and *Explored*. We are going to select the Explorer. It will open the explorer\
    \ application inside the theme designer.\n\nNow here, we can quickly change the\
    \ options like background color, brand color and highlight color. You can also\
    \ create your custom CSS class and provide those values. There are color palette\
    \ provided which can assist in making choices.\n\n![](img/e0db2820988dc54294b33092f834e7a1_92_0.png)\n\
    \nIf you want to export the changes, you have to go to ‘Theme’ option present\
    \ in top left and select ‘Export’. You can also use the RTL (Right to Left) option\
    \ if your app have to support RTL languages. It will show the export process and\
    \ finally a zip file is automatically downloaded after completion.\n\n![](img/e0db2820988dc54294b33092f834e7a1_92_1.png)\n\
    \nTo use this new theme in eclipse. We have to follow below steps.\n\n- 1. Find\
    \ the location of the application in which we have apply the new theme.\n- 2.\
    \ Now go to the web content folders create a folder as resources.\n- 3. Copy the\
    \ ‘Sap’ folder present inside the UI5 folder and paste it inside the resource\
    \ folder.\n- 4. Change the theme name inside the index file.\n- 5. Save and reload\
    \ the page.\n\nOne you reload the page you will be able to see the new theme applied\
    \ to your application. In our case, we have applied the new theme to our ‘Simple\
    \ App’ demo and it has changed the background, Input Box, and header style (as\
    \ shown in below picture).\n\n![](img/e0db2820988dc54294b33092f834e7a1_93_0.png)\n\
    \nYou can also check our SAPUI5 Professional Development video course for accelerated\
    \ learning: [here](http://here) or use the below QR code.\n\n![](img/e0db2820988dc54294b33092f834e7a1_93_1.png)\n\
    \n## 13. Using Events and Handling Events\n\n## EVENTS\n\nEvents are essential\
    \ part of UI5 application. It tells how the application should respond, if certain\
    \ user interaction happens. Some of the commonly known events are Click, Tap,\
    \ Drag, Press etc. And some commonly used events are change, focus and key press\
    \ etc.\n\nFor example in our simple input app example, we can have a ‘change’\
    \ event. And when user tries to write something or change an existing value then\
    \ the action listener of this event is going to be fired.\n\nThe action listener\
    \ function should ideally be implemented in controller and they should have a\
    \ prefix ‘on’ before the name. This will help other developer to identify the\
    \ action listener from rest of the available functions.\n\nNow let us go to the\
    \ API reference for the input box element and use the property for event listener\
    \ ‘liveChange’. If we go to view and add the ‘liveChange’ property:\n\n```\nvar\
    \ oSimpleInput = new sap.m.Input(\"idInput\",{\n    placeholder:\"Enter Name\"\
    ,\n    liveChange:[oController.onLiveChange,oController], //creating livechange\
    \ function inside the controller\n});\n```\n\nAnd in controller implement the\
    \ action listener with name ‘onLiveChange’:\n\n```\nonLiveChange: function(oEvt){\n\
    \    // debugger;\n    var sValue = oEvt.getParameter('value');\n    sap.m.MessageToast.show(sValue);\
    \ //this toast function will displays the text in nice toast format\n},\n```\n\
    \nAnd save and reload the application. The result is an input button, which will\
    \ show a message toast at bottom of the screen, when you change any value in the\
    \ input field:\n\n![](img/e0db2820988dc54294b33092f834e7a1_96_0.png)\n\n## Events\
    \ in Real Project\n\nIn real projects, use of events will be lot more complex.\
    \ In this section, we will start increasing the complexity of the application.\
    \ We already have a simple list in our application. In this application for now\
    \ only list of animals are shown. If you click any items in that list, it will\
    \ not go to the next page. Here we are going to add the navigation on item press.\n\
    \nNow create a new page in your application in eclipse and name it as second Page.\
    \ Now add the second page inside the application using controllers Init function.\
    \ (Note: All the id’s using inside your application should be unique or else it\
    \ will show an error)\n\n```\nonInit: function() {\n    var page = sap.ui.view({id:\"\
    iddemo2\", viewName:\"eventsdemo2.secondPage\", type:sap.ui.core.mvc.ViewType.JS});\n\
    \    app.addPage(page);\n}\n```\n\nNow we have to add the event listener function.\
    \ So go to the API reference and search for sap.m.List. Here in API reference\
    \ we cannot find the event listener. So go to the super class of sap.m.List and\
    \ look for the event listener property. Now use the property inside the view and\
    \ then add the ‘selectEventHandler’ function inside the controller. Before going\
    \ to add the function check that if the event is fired or not. Use a debugger\
    \ keyword to verify it. Now we will find that when we use ‘select’ event will\
    \ not fire and"
  mdcn: "\n所以最好不要随意尝试标准类。\n\n现在我将创建一个自定义类。为此，在样式选项卡中点击“+”号添加一个类（此处已编辑高亮的类）。为此类添加宽度属性并赋值为60%，左内边距设为30%。我们需要自定义样式具有最高优先级，因此可以在样式属性值后添加“!\
    \ important”关键字。从输出中可以看到输入框将居中对齐。按照同样的步骤，我们也可以将按钮居中对齐。现在，我们需要处理按钮的蓝色背景颜色。这有点棘手，因为我们需要引入标准样式类‘.sapMBtnInner’来实现这一更改。您会注意到，如果在类‘.sapMBtnInner’内添加属性：\n\
    \n```\nbackground:#007cc0;\n```\n\n按钮的背景就会改变。我们已经知道更改标准样式类不是好的做法，因此为了实现这一点，我们将创建.btnCss自定义类。我们将编写样式规则，使得所有同时具有.sapMBtnInner类和.btnCss类的元素都将应用新的样式规则。这是通过创建包含以下选择器的样式规则实现的：\n\
    \n```\n.btnCss>.sapMBtnInner{\n}\n```\n\n最终，CSS文件将如下所示：\n\n```\n.inputCss{ //CSS\
    \ class for input\n    width: 60%!important;\n    padding-left: 30%!important;\n\
    }\n\n.btnCss{ //CSS Class for button\n    width: 60%!important;\n    padding-left:\
    \ 30%!important;\n}\n\n.btnCss>.sapMBtnInner{ //Apply the property to the element\
    \ sapMBtnInner\n    background:#007cc0;\n}\n```\n\n要链接此CSS文件，我们可以使用`<link>`标签：\n\
    \n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/custom.css\">\n```\n\
    \n现在在视图中，我们需要使用‘addStyleClass’函数来链接新的CSS属性，如下所示：\n\n```\ncreateContent : function(oController)\
    \ {\n    var oSimpleInput = new sap.m.Input({\n        placeholder: \"Enter Name\"\
    \n    }).addStyleClass(\"inputCss\"); //class for CSS\n    var oBtn = new sap.m.Button({\n\
    \        text: \"Submit\"\n    }).addStyleClass(\"btnCss\"); //Class for CSS\n\
    \    var oPage = new sap.m.Page({\n        title: \"Simple App\",\n        content:\
    \ [\n            oSimpleInput,\n            oBtn\n        ]\n    });\n```\n\n\
    一旦我们在Web浏览器中运行此代码，我们将能够获得所需的输出：\n\n![](img/e0db2820988dc54294b33092f834e7a1_89_0.png)\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_89_1.png)\n\n## 样式和主题，高级选项\n\n## 媒体查询\n\
    \n媒体查询让您能够控制应用程序在不同分辨率屏幕上的外观，例如移动设备、平板电脑或台式电脑屏幕。以下是媒体查询的一个简单示例：\n\n```\n@medi\
    \ screen and (max-width:600px){\n    .hBoxForm{\n        padding-left: 10%;\n\
    \    }\n    .vBoxForm{\n        padding-left: 18%;\n    }\n}\n```\n\n在上面的CSS中，`.hBoxForm`和`.vBoxForm`将仅应用于宽度小于600px的屏幕。现在您可能在想，这会导致一个庞大而复杂的CSS文件。确实如此，这也是UI5项目中CSS文件通常较大的主要原因。\n\
    \n## 主题设计器\n\n想象一个工具，它可以帮助您减少在不花费太多工作的情况下更改应用程序基本外观和感觉的繁琐任务。主题设计器就是自动化更改CSS这一繁琐任务的工具。它是一个“所见即所得（WYSIWYG）”编辑器。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_90_0.png)\n\n您可以在上图中看到，主题设计器在右侧包含许多内置选项，用于更改颜色和基本外观。\n\
    \n您可以通过事务代码从SAP启动主题设计器：\n\n**/UI5/THEME_DESIGNER**\n\n或者，您可以直接访问以下URL来访问此基于浏览器的图形编辑器。\n\
    \nhttps://<server>:<port>/sap/bc/theming/theme-designer?sap-client=<client>\n\n\
    （您需要在此处更改服务器和端口名称，并替换为SAP系统的服务器和端口名称）。\n\n完成设计和更改后，您可以看到可用主题的列表并导入主题。它会要求提供一个链接。如果您有一个在SAP服务器上运行的应用程序，则可以使用该链接在主题设计器中打开它。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_91_0.png)\n\n目前，我们将使用资源管理器中的标准主题进行演示。页面中的下一个选项是SAP\
    \ UI5应用程序预览。选择该选项，在下一页中您可以看到两个复选框*SAP Fiori启动板*和*资源管理器*。我们将选择资源管理器。它将在主题设计器中打开资源管理器应用程序。\n\
    \n现在在这里，我们可以快速更改背景颜色、品牌颜色和高亮颜色等选项。您还可以创建自定义CSS类并提供这些值。提供调色板可以帮助您进行选择。\n\n![](img/e0db2820988dc54294b33092f834e7a1_92_0.png)\n\
    \n如果要导出更改，您必须转到左上角的“主题”选项并选择“导出”。如果您的应用程序需要支持从右到左（RTL）语言，您也可以使用RTL选项。它将显示导出过程，并在完成后自动下载一个zip文件。\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_92_1.png)\n\n要在Eclipse中使用此新主题。我们必须遵循以下步骤。\n\
    \n- 1. 找到我们应用新主题的应用程序位置。\n- 2. 现在转到Web内容文件夹，创建一个名为resources的文件夹。\n- 3. 将UI5文件夹内的‘Sap’文件夹复制并粘贴到resource文件夹中。\n\
    - 4. 更改index文件中的主题名称。\n- 5. 保存并重新加载页面。\n\n重新加载页面后，您将能够看到新主题已应用于您的应用程序。在我们的案例中，我们已将新主题应用于“Simple\
    \ App”演示，并且它已更改了背景、输入框和页眉样式（如下图所示）。\n\n![](img/e0db2820988dc54294b33092f834e7a1_93_0.png)\n\
    \n您也可以查看我们的SAPUI5专业开发视频课程以加速学习：[此处](http://here)或使用以下二维码。\n\n![](img/e0db2820988dc54294b33092f834e7a1_93_1.png)\n\
    \n## 13. 使用事件和处理事件\n\n## 事件\n\n事件是UI5应用程序的重要组成部分。它告诉应用程序在发生某些用户交互时应如何响应。一些常见的事件包括点击、轻触、拖动、按下等。一些常用的事件有更改、聚焦和按键等。\n\
    \n例如，在我们简单的输入应用示例中，我们可以有一个‘change’事件。当用户尝试写入某些内容或更改现有值时，该事件的动作监听器将被触发。\n\n理想情况下，动作监听器函数应在控制器中实现，并且其名称应带有‘on’前缀。这将帮助其他开发人员从其他可用函数中识别出动作监听器。\n\
    \n现在让我们转到输入框元素的API参考，并使用事件监听器属性‘liveChange’。如果转到视图并添加‘liveChange’属性：\n\n```\n\
    var oSimpleInput = new sap.m.Input(\"idInput\",{\n    placeholder:\"Enter Name\"\
    ,\n    liveChange:[oController.onLiveChange,oController], //creating livechange\
    \ function inside the controller\n});\n```\n\n并在控制器中实现名为‘onLiveChange’的动作监听器：\n\
    \n```\nonLiveChange: function(oEvt){\n    // debugger;\n    var sValue = oEvt.getParameter('value');\n\
    \    sap.m.MessageToast.show(sValue); //this toast function will displays the\
    \ text in nice toast format\n},\n```\n\n然后保存并重新加载应用程序。结果是一个输入按钮，当您在输入字段中更改任何值时，它将在屏幕底部显示一个消息吐司：\n\
    \n![](img/e0db2820988dc54294b33092f834e7a1_96_0.png)\n\n## 实际项目中的事件\n\n在实际项目中，事件的使用将复杂得多。在本节中，我们将开始增加应用程序的复杂性。我们的应用程序中已经有一个简单的列表。目前，此应用程序仅显示动物列表。如果单击该列表中的任何项目，它不会转到下一页。此处，我们将添加项目按下的导航功能。\n\
    \n现在在Eclipse中创建一个新页面，并将其命名为第二个页面。然后使用控制器的Init函数将第二个页面添加到应用程序中。（注意：应用程序中使用的所有ID都应该是唯一的，否则将显示错误）\n\
    \n```\nonInit: function() {\n    var page = sap.ui.view({id:\"iddemo2\", viewName:\"\
    eventsdemo2.secondPage\", type:sap.ui.core.mvc.ViewType.JS});\n    app.addPage(page);\n\
    }\n```\n\n现在我们需要添加事件监听器函数。因此，转到API参考并搜索sap.m.List。在API参考中我们找不到事件监听器。因此转到sap.m.List的超类并查找事件监听器属性。现在在视图中使用该属性，然后在控制器中添加‘selectEventHandler’函数。在添加函数之前，检查事件是否触发。使用debugger关键字进行验证。现在我们将发现，当我们使用‘select’事件时不会触发，并且\n"
