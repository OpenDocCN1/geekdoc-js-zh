    # Internationalization and Localization


    Internationalization and Localization allows our app to be more accessible for
    international audience with their regional languages. Most of the countries are
    not native English speakers. You may work on some project that involves customers
    from non-English speaking countries. English might be the second and third languages
    in some countries. In these cases you need to customize your application into
    their preferred language.


    Assume that user of your application are from USA, Germany and China. And in this
    case you have to make the app compatible with three languages depending upon from
    which region it is accessed.


    To translate the app in compatible languages we have to add the i18n properties.
    For US customer it will be English, for German customers it will be in German
    and the Chinese customers it will be Mandarin. The first step will be to check
    the local language using function:


    ```

    sap.ui.getCore().getConfiguration().getLanguage()

    ```


    This will give you the local language of your application. Once you get the local
    language'
