  md: '# 14.Miscellaneous Controls in UI5


    # UX3 Control – SHELL


    Sometimes you want to develop an application and you don’t have much time to rethink
    about the user experience details. And also if your users are going to use the
    application mostly in desktop environment. Then in that case going for Shell based
    application is a good idea. Shell comes with lot of the out of box properties
    and functions, which makes the development quite easy and fast. To use Shell you
    have to use the `sap.ui.ux3.Shell` control.


    ![](img/e0db2820988dc54294b33092f834e7a1_108_0.png)


    ```

