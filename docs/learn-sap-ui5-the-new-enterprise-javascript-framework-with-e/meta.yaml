    In the next section, we will see the bubbling and capturing concept and how they
    define the event execution sequence.


    # Capturing and Bubbling


    Capturing and bubbling are two ways in which an event can trigger. When you are
    working in a big project containing many events ,then sequence of execution of
    these events become important.


    For example let’s assume that we have a simple web app which with a DOM element
    tree. In the top level, we have a window with listener function cFW() for click
    events followed by  a document with action listener function CFD(). And similarly
    HTML, Body and Button that all having its action listener cFH(), cFB() and cFBtn().


    ![](img/e0db2820988dc54294b33092f834e7a1_103_1.png)


    Now if we click the button in the application. The control flow actually starts
    from the top'
  - "[PAGE 104]\n\nit starts from the cFW(), cFD(), cFH(), cFB() and finally cFBtn().\
    \ When the control flow reaches to the button two things can happen before it\
    \ goes back to top level again. It will execute our cFBtn() function while the\
    \ way down or while the way up. You may think here what the difference is.\n\n\
    **Capturing:** The control flow travelling from up to down is called capturing\
    \ phase. We can use capturing if we pass the third argument for event listener\
    \ function as *true* `addEventListener(“click”, doSomething, true)`.\n\n**Bubbling:**\
    \ The control flow travelling from down to up is called Bubbling phase. We can\
    \ use bubbling if we pass the third argument for event listener function as *false*\
    \ `addEventListener(“click”, doSomething, false)`.\n\nIn this case, each of the\
    \ intermediate functions get the control flow twice. If they have the event handler\
    \ for that function then it will be executed twice.\n\nTo explain the difference,\
    \ we can take the example of our draggable button. Now if add a click event listener\
    \ to this button and its immediate parent element in DOM tree. And in first case\
    \ we:\n\n+   - Execute the event handler of button in Bubbling phase(passing false\
    \ in 3rd parameter)\n- Execute the event handler of its parent element also in\
    \ Bubbling phase(passing false in 3rd parameter)\n\n```\ndocument.getElementById(“_button0”).addEventListener(“click”,\
    \ function(){\n    console.log(“btn”)\n}, false);    //Mentioned false so it will\
    \ be executed in bubbling phase\n```\n\n```\ndocument.getElementById(“_page0-cont”).addEventListener(“click”,\
    \ function(){\n    console.log(“sect”)\n}, false);    //Mentioned false so it\
    \ will be executed in bubbling phase\n```\n\nNow if you click on the button then\
    \ it will show below result in console:"
- md: "Now if we change parent element execution sequence by making it execute in\
    \ capturing phase (by passing true in 3rd parameter):\n\n```javascript\ndocument.getElementById(\"\
    _page0-cont\").addEventListener(\"click\", function(){\n    console.log(\"sect\"\
    )\n}, true);                                          //Mentioned false so it\
    \ will be executed in capturing phase\n```\n\nNow the sequence of result will\
    \ be reversed in console.\n\nThis was a simple example is to understand the difference\
    \ and impact of capturing and bubbling events.\n\n**Note:** Some of the browsers\
    \ like Internet Explorer do not support event capturing. Therefore you need to\
    \ use event bubbling there.\n\nYou can also check our SAPUI5 Professional Development\
    \ video course for accelerated learning: [here](https://example.com) or use the\
    \ below QR code.\n\n# 14. Miscellaneous Controls in UI5\n\n# UX3 Control – SHELL\n\
    \nSometimes you want to develop an application and you don’t have much time to\
    \ rethink about the user experience details. And also if your users are going\
    \ to use the application mostly in desktop environment. Then in that case going\
    \ for Shell based application is a good idea. Shell comes with lot of the out\
    \ of box properties and functions, which makes the development quite easy and\
    \ fast. To use Shell you have to use the `sap.ui.ux3.Shell` control.\n\n```javascript\n\
    sap.ui.ux3.Shell\n```\n\nLet’s create a simple shell app, as shown in above picture\
    \ where we have a home tab and two menu items. You can place any content inside\
    \ the menu tab like table, list, combination of table and list etc. For now let’s\
    \ keep it simple and place a button there.\n\nIn the left hand side, we have a\
    \ search box and a feeder toolbox. Also there is a header which provides options\
    \ to add login or log out feature. In the right side, we have sliding menu. We\
    \ can also place list, table and more.\n\nSo to start the development, we go to\
    \ the API reference to search about the Shell using the ‘sap.ui.ux3.shell’ keyword.\
    \ Where you can get a lot of details and also simple example of its implementation.\n\
    \nNow create a new project in eclipse and as we are going to use Shell based controls\
    \ so we are adding libraries ‘sap.m, sap.ui.ux3’ in bootstrap code.\n\nBelow is\
    \ the UI5 code which will result in the Shell based on our simple requirement:\n\
    \n```javascript\n<script>\n    jQuery.sap.require(\"sap.m.MessageBox\");\n\n \
    \   var oShell = new sap.ui.ux3.Shell({\n\n            appTitle : \"Demo\",\n\
    \            showLogoutButton : true,\n            logoutButtonTooltip : \"Logout\"\
    ,\n            showSearchTool : true,\n            showInspectorTool : true,\n\
    \            showFeederTool : true,\n            showTools : true,\n         \
    \   showPane : true,\n\n            }).placeAt(\"content\");\n</script>\n```\n\
    \nNow add the other properties to the shell.\n\n```javascript\nworksetItems :\
    \ [ new sap.ui.ux3.NavigationItem({ //navigation panel\n        text : \"Home\"\
    ,\n        key : \"Home\",                  //Key for home button\n        press\
    \ : function(oEvt) {\n                    sap.m.MessageToast.show(\"Home pressed!\"\
    );  //This will show a message toast when home button is pressed\n        }\n\
    }), new sap.ui.ux3.NavigationItem({\n        text : \"Menu 1\",\n        key :\
    \ \"M_1\",\n        press : function(oEvt) {\n                    sap.m.MessageToast.show(\"\
    Menu1 pressed!\");  //This will show a message toast when menu1 button is pressed\n\
    \        }\n}) ],\ncontent : [ new sap.m.Button({\n        text : \"Simple Button\"\
    \ \n}) ]\n```\n\n```javascript\n}) ],\nworksetItemSelected : function(oEvt) {\n\
    \n          sap.m.MessageToast.show(oEvt.getParameter(\"id\"));\n\n},\npaneBarItems\
    \ : [          //Pane bar items\n\n new sap.ui.core.Item({\n          text : \"\
    Demo Item\"\n}) ]\n\n}).placeAt(\"content\");\n```\n\n# # Fragments\n\nFragments\
    \ are like actionable pop ups which comes handy in mobile screens or tablet screens.\
    \ Specifically, when you require action from the user it will block the background\
    \ and the user can only see the popup contains some list items or some input forms.\n\
    \nOne interesting thing about fragment is, it shares the same controller with\
    \ the view. For example if the user want to search in the list then those event\
    \ handler is to be written on the same controller.\n\nSo let us create a simple\
    \ project. Where we will have a button and when we press the button, then the\
    \ fragment should appears. Below is the code, which we will add in the view for\
    \ placing the button in the page.\n\n```javascript\ncreateContent : function(oController)\
    \ {\n\n    var oButton = new sap.m.Button({    //Creating button object\n\n  \
    \      text:\"Click to open fragment\",\n        press:[oController.openFragment,oController]\n\
    \    });\n\n    var oPage = new sap.m.Page({           //Creating page\n     \
    \   title: \"Fragment example\",\n```\n\n```javascript\ncontent: [\n         \
    \   oButton\n        ]\n    });\n\n    return oPage;\n}\n\n});\n```\n\nNow we\
    \ need to create a JavaScript file inside our webcontent with same name as view\
    \ controller ‘demo.fragment.js’. And add the js fragment code as below:\n\n```javascript\n\
    sap.ui.jsfragment(\"fragmentdemo.demo\", {\n\n    createContent: function(oController)\
    \ {\n\n\n\nvar oItemTemplate = new sap.m.StandardListItem({\n    title: \"{list>Name}\"\
    ,\n    active: true\n    })\n\n\n        var oSelDialog = new sap.m.SelectDialog({\n\
    \    noDataText: \"Empty\",\n    title: \"Animals\",\n                       \
    \     liveChange: [oController.handleSearch, oController],//Used for search option\
    \ in the fragment\n    confirm: [oController.handleConfirm, oController],\n  \
    \  type: \"Active\"\n    });\n\n\n                            oSelDialog.bindAggregation(\"\
    items\", \"list>/names\", oItemTemplate); //Binding the Data\n\nreturn oSelDialog;\n\
    \    }\n});\n```\n\nNow in controller we will, open the fragment when the button\
    \ is pressed.\n\n```javascript\nopenFragment : function(oEvt){\n\n    if(this.oFragment\
    \ === undefined){\n\n        this.oFragment = sap.ui.jsfragment(\"fragmentdemo.demo\"\
    , this);\n        this.oFragment.open();\n\n    }else{\n\n        this.oFragment.open();\n\
    \n    }\n}\n```\n\nAnd now, if we save and run the application we will get below\
    \ result:\n\n# Split Screen Application\n\nA split screen application contains\
    \ a master page and a detail page. The master page contains the content and when\
    \ you click on the content, you will get the detail of the particular content.\
    \ The real advantage of using the split screen application is adaptable to smaller\
    \ devices.\n\n# # Detail Page\n\n# # Master Page\n\nLet us create a simple split\
    \ screen application in eclipse. We already have a list example with event navigation.\
    \ In this case, Master page will contain the list items. The second page will\
    \ contain the details of the item which will be selected in a Table. So we can\
    \ reuse the content of table example and place in the detail screen.\n\nThe main\
    \ new change will come in the index page. Here we are going to remove 'sap.m.App'\
    \ because we are going to use 'sap.m.SplitApp'. And add the mode as: sap.m.SplitAppMode.ShowHideMode.\n\
    \nBelow is the code to be placed in Index page:\n\n```javascript\n<script>\nsap.ui.localResources(\"\
    masterdetaildemo\");\nvar app = new sap.m.SplitApp(\"idSplitApp\",{\n    mode:sap.m.SplitAppMode.ShowHideMode\
    \ //Show or hiding property\n});\nvar masterPage = sap.ui.view({\n    id:\"idmaster1\"\
    ,\n    viewName:\"masterdetaildemo.master\",\n    type:sap.ui.core.mvc.ViewType.JS\n\
    });\napp.addMasterPage(masterPage); //Master Page\n```\n\n```javascript\nvar detailPage\
    \ = sap.ui.view({\n    id:\"idDet2\",\n    viewName:\"masterdetaildemo.detail\"\
    , type:sap.ui.core.mvc.ViewType.JS\n});\n\napp.addDetailPage(detailPage); //Detail\
    \ page\n\napp.placeAt(\"content\");\n</script>\n```\n\nHere we added the master\
    \ screen and detail screen to our application. Once you create the master and\
    \ detail page and place list and table respectively, then on running the application\
    \ you will see below result:\n\nYou can also check our SAPUI5 Professional Development\
    \ video course for accelerated learning: [here](https://example.com) or use the\
    \ below QR code."
