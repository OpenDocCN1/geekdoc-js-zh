- md: "# SAP - Learn SAPUI5 Professional Development\n\nUI5 Community Network • SAP\
    \ Experts - SAP Services, SAP Consulting, SAP Education\n\nLearn SAP UI5 / OpenUI5\
    \ In Detail: Basic & Advanced Levels, Step By Step, With The Help of The Best\
    \ Open UI5 Experts\n\n56 lectures  7 hours  Intermediate Level\n\n4.5 (36 ratings)\n\
    \n## 15. App Improvement Elements\n\n### FORMATTER\n\nFormatter provides more\
    \ control in the way data is represented once it is bound to certain element.\
    \ For example, if we have to create a list that contains name of animals and the\
    \ locations they belong to concatenated together in the title. In this case, we\
    \ have to put it together in a single property.\n\nOne real example is the date.\
    \ Date can be represented in many different formats like dd/mm/yy or mm/dd/yy\
    \ etc. (dd is day, mm is month and yy is year)\n\nLet us look at the first example\
    \ where we can append ‘Name’ and ‘Place’ of the animals together:\n\nWithout Formatter\
    \ the data binding will look like :\n\n```\noList.bindItems({\n    path: “/names”,\n\
    \    template: new sap.m.StandardListItem({\n        title: “{Name}”,\n      \
    \  //Key with curly braces\n        description: “{Place}”\n        //Key with\
    \ curly braces\n    })\n});\n```\n\nWith Formatter the data binding will look\
    \ like :\n\n```\noList.bindItems({\n    path: “/names”,\n    template: new sap.m.StandardListItem({\n\
    \        title: ({\n            parts: [{\n                path: “Name”,\n   \
    \             //Key with path without curly braces\n                type: new\
    \ sap.ui.model.type.String()\n            }, {\n                path: \"Place\"\
    ,\n                type: new sap.ui.model.type.String()\n            }],\n   \
    \         formatter: function(sName, sPlace){\n                //all parameters\
    \ are strings\n                return sName + \": \" + sPlace;\n             \
    \   // Concatenation\n            }\n        })\n    })\n});\n```\n\nThe differences\
    \ between these two are:\n\n- In first case, we are passing key directly inside\
    \ curly braces.\n- And in the second case we have a formatter function which returns\
    \ what will be the content of the binding.\n\nBelow will be the result of the\
    \ code with and without formatter:\n\n### Formatter\n\n| Animals |\n|---|\n| Dinosaur\
    \ : Mountain |\n| Elephant : Forest |\n| Whale : Sea |\n| Duck : Water |\n| Monkey\
    \ : Tree |\n\n| Animals | |\n|---|---|\n| Dinosaur | Mountain |\n| Elephant |\
    \ Forest |\n| Whale | Sea |\n| Duck | Water |\n| Monkey | Tree |\n\n### Internationalization\
    \ and Localization\n\nInternationalization and Localization allows our app to\
    \ be more accessible for international audience with their regional languages.\
    \ Most of the countries are not native English speakers. You may work on some\
    \ project that involves customers from non-English speaking countries. English\
    \ might be the second and third languages in some countries. In these cases you\
    \ need to customize your application into their preferred language.\n\nAssume\
    \ that user of your application are from USA, Germany and China. And in this case\
    \ you have to make the app compatible with three languages depending upon from\
    \ which region it is accessed.\n\nTo translate the app in compatible languages\
    \ we have to add the i18n properties. For US customer it will be English, for\
    \ German customers it will be in German and the Chinese customers it will be Mandarin.\
    \ The first step will be to check the local language using function:\n\n```\n\
    sap.ui.getCore().getConfiguration().getLanguage()\n```\n\nThis will give you the\
    \ local language of your application. Once you get the local language then link\
    \ the appropriate language file to an app. For that, we have to create a model\
    \ called i18n and bind it in our code. The i18n model will be loaded from different\
    \ files where each file will be specific to one language.\n\nBelow you can see\
    \ the content of the view, where we will have i18n named model:\n\n```\ncreateContent\
    \ : function(oController) {\n    var oBtn = new sap.m.Button({\n        text:\"\
    {i18n>greet}\"  // Button name with local language\n    })\n\n    var oPage =\
    \ new sap.m.Page({\n        title: \"i18n Example\",\n        content: [\n   \
    \         oBtn\n        ]\n    });\n    return oPage;\n}\n```\n\nNow create a\
    \ folder called ‘i18n’ and create the three files inside the folder and name it\
    \ as i18n.properties, i18n_de.properties and i18n_ch.properties. Inside that file\
    \ we have to write the property greet with the different languages in appropriate\
    \ files. Eg. in English ‘greet=Hello’, in German ‘greet=Halo’ and for Mandarin\
    \ we will use the Google translate use the text inside i18n_ch file. In eclipse\
    \ once you enter mandarin language, it will automatically translates it into Unicode\
    \ characters.\n\nInside the demo controller, add code which identifies which file\
    \ type to open depending upon location:\n\n```\nonInit: function() {\n    var\
    \ sLoc = sap.ui.getCore().getConfiguration().getLanguage();\n    var i18nPath\
    \ = \"i18n/i18n\";\n    if(sLoc === \"de_DE\"){  //German language region code\n\
    \        i18nPath = i18nPath + \"_de.properties\";\n    }else if(sLoc === \"zh-Hans\"\
    ){  //Chinese language region code\n        i18nPath = i18nPath + \"_ch.properties\"\
    ;\n    }else{\n        i18nPath = i18nPath + \".properties\";\n    }\n\n    var\
    \ oi18nModel = new sap.ui.model.resource.ResourceModel({\n        bundleUrl:i18nPath\
    \ //Creating model\n    });\n    sap.ui.getCore().setModel(oi18nModel,\"i18n\"\
    );\n},\n```\n\nNote: To get all the regional language codes you can go to Below\
    \ URL :\n\n[https://wpcentral.io/internationalization/](https://wpcentral.io/internationalization/)\n\
    \nNow if we run the application and want to see, how the application will look\
    \ if user from China opens the app. Then for that we can add language suffix to\
    \ our URL ‘?sap-ui-language’ with the language value.\n\n**Example:** [localhost:55913/i18nDemo/index.html?.?sap-ui-language=zh-Hans](localhost:55913/i18nDemo/index.html?.?sap-ui-language=zh-Hans)\n\
    \nThis will display the button in Mandarin language:\n\nYou can also check our\
    \ SAPUI5 Professional Development video course for accelerated learning: [here](here)\
    \ or use the below QR code.\n\n# SAP - Learn SAPUI5 Professional Development\n\
    \nUI5 Community Network - SAP Experts - SAP Services, SAP Consulting, SAP Education\n\
    \nLearn SAP UI5 / OpenUI5 In Detail: Basic & Advanced Levels, Step By Step, With\
    \ The Help of The Best Open UI5 Experts\n\n56 lectures • 7 hours • Intermediate\
    \ Level\n\n4.5 ★★★★★ (36 ratings)\n\n## 16. Data Visualization Using UI5\n\n###\
    \ Viz : Bar Chart\n\nNow we are going to see how to use visualizations capabilities\
    \ of UI5. For this purpose, we will be using Viz library, which are only present\
    \ in SAPUI5 and not present in Open UI5. And from versions 1.34 of SAPUI5, there\
    \ has been a big change on the way we should use it. So let’s see how to make\
    \ use of these libraries.\n\nTo create a simple bar chart with Viz, we have to\
    \ create\n\n- Flattened dataset\n- Axis.\n\n### Flattened dataset\n\nFlattened\
    \ dataset is an object that defines the binding. It has two main parts. First\
    \ one is called dimensions and second one is called measures. Dimensions tell\
    \ us what we are comparing and measure will tell us the value, which we are comparing.\n\
    \n### Axis\n\nAxis also has two main parts that are dimensions and measure. Dimensions\
    \ tell us what we are comparing. Measure will tell us the value, which you are\
    \ comparing.\n\nOnce you created the axis and flattened dataset then you need\
    \ to define the VizFrame.\n\n```\nvar oVizFrame = new sap.viz.ui5.controls.VizFrame();\n\
    ```\n\nWe need to provide three important details to this VizFrame:\n\n1. Flattened\
    \ dataset\n2. Type of chart (Bar or Pie Chart)\n3. Axis\n\nAlso in index.html\
    \ we have to include the additional *sap.viz* library:\n\n```\n<script src=\"\
    resources/sap-ui-core.js\"\n        id=\"sap-ui-bootstrap\"\n        data-sap-ui-libs=\"\
    sap.m,sap.viz\" //viz library\n        data-sap-ui-theme=\"sap_bluecrystal\">\n\
    </script>\n```\n\n```\n<script>\n    sap.ui.localResources(\"newvizframe\");\n\
    \    var app = new sap.m.App({initialPage:\"iddemo1\"});\n    var page = sap.ui.view({id:\"\
    iddemo1\", viewName:\"newvizframe.demo\",\n                            type:sap.ui.core.mvc.ViewType.JS});\n\
    \    app.addPage(page);\n    app.placeAt(\"content\");\n</script>\n```\n\nInside\
    \ the demo view we have to add the flattened dataset (data is going to be our\
    \ old animal list here).\n\n```\ncreateContent : function(oController) {\n   \
    \ var oVizFrame = new sap.viz.ui5.controls.VizFrame();\n    //Create Vizdataset\
    \ to feed to the data to the graph\n    var oDataset = new sap.viz.ui5.data.FlattenedDataset({\
    \ //Flattened dataset\n        dimensions : [{ //dimensions\n```"
  mdcn: "\n# SAP - 学习SAPUI5专业开发\n\nUI5社区网络 • SAP专家 - SAP服务、SAP咨询、SAP教育\n\n在顶尖OpenUI5专家的帮助下，深入学习SAP\
    \ UI5 / OpenUI5：基础与进阶，步步为营\n\n56讲  7小时  中级水平\n\n4.5 (36条评价)\n\n## 15. 应用改进要素\n\
    \n### 格式化器\n\n格式化器在数据绑定到特定元素后，提供了对数据呈现方式的更精细控制。例如，如果我们需要创建一个列表，其中包含动物名称和它们所在地的拼接信息作为标题。在这种情况下，我们需要将它们合并到一个属性中。\n\
    \n一个实际的例子是日期。日期可以用多种不同格式表示，如dd/mm/yy或mm/dd/yy等（dd代表日，mm代表月，yy代表年）。\n\n让我们看第一个例子，我们将动物的‘名称’和‘地点’拼接在一起：\n\
    \n不使用格式化器时，数据绑定将如下所示：\n\n```\noList.bindItems({\n    path: “/names”,\n    template:\
    \ new sap.m.StandardListItem({\n        title: “{Name}”,\n        //带花括号的键\n \
    \       description: “{Place}”\n        //带花括号的键\n    })\n});\n```\n\n使用格式化器时，数据绑定将如下所示：\n\
    \n```\noList.bindItems({\n    path: “/names”,\n    template: new sap.m.StandardListItem({\n\
    \        title: ({\n            parts: [{\n                path: “Name”,\n   \
    \             //不带花括号，仅带路径的键\n                type: new sap.ui.model.type.String()\n\
    \            }, {\n                path: \"Place\",\n                type: new\
    \ sap.ui.model.type.String()\n            }],\n            formatter: function(sName,\
    \ sPlace){\n                //所有参数都是字符串\n                return sName + \": \"\
    \ + sPlace;\n                // 字符串拼接\n            }\n        })\n    })\n});\n\
    ```\n\n两者的区别在于：\n- 第一种情况，我们直接将键名放在花括号内。\n- 第二种情况，我们有一个格式化函数，它返回绑定的内容。\n\n以下是使用和不使用格式化器的代码运行结果：\n\
    \n### 格式化器\n\n| 动物 |\n|---|\n| 恐龙 : 山 |\n| 大象 : 森林 |\n| 鲸鱼 : 海 |\n| 鸭子 : 水 |\n\
    | 猴子 : 树 |\n\n| 动物 | |\n|---|---|\n| 恐龙 | 山 |\n| 大象 | 森林 |\n| 鲸鱼 | 海 |\n| 鸭子 |\
    \ 水 |\n| 猴子 | 树 |\n\n### 国际化和本地化\n\n国际化和本地化使我们的应用能够更好地服务使用其地区语言的国际用户。大多数国家的母语并非英语。你可能会参与一些涉及非英语国家客户的项目。英语在某些国家可能是第二甚至第三语言。在这种情况下，你需要将应用程序定制成他们偏好的语言。\n\
    \n假设你的应用用户来自美国、德国和中国。在这种情况下，你必须根据应用被访问的区域，使其兼容三种语言。\n\n为了将应用翻译成兼容的语言，我们需要添加i18n属性。对美国客户使用英语，对德国客户使用德语，对中国客户使用中文。第一步是使用以下函数检查本地语言：\n\
    \n```\nsap.ui.getCore().getConfiguration().getLanguage()\n```\n\n这将返回你应用的本地语言。获得本地语言后，将相应的语言文件链接到应用。为此，我们必须创建一个名为i18n的模型并在代码中进行绑定。i18n模型将从不同的文件加载，每个文件对应一种特定语言。\n\
    \n以下是你可以看到视图内容的地方，我们将有一个名为i18n的模型：\n\n```\ncreateContent : function(oController)\
    \ {\n    var oBtn = new sap.m.Button({\n        text:\"{i18n>greet}\"  // 使用本地语言的按钮名称\n\
    \    })\n\n    var oPage = new sap.m.Page({\n        title: \"i18n 示例\",\n   \
    \     content: [\n            oBtn\n        ]\n    });\n    return oPage;\n}\n\
    ```\n\n现在，创建一个名为‘i18n’的文件夹，并在该文件夹内创建三个文件，分别命名为i18n.properties、i18n_de.properties和i18n_ch.properties。在相应的文件中，我们需要用不同语言编写greet属性。例如，在英语中是‘greet=Hello’，在德语中是‘greet=Halo’，对于中文，我们将使用谷歌翻译并将文本放在i18n_ch文件中。在Eclipse中输入中文后，它会自动转换为Unicode字符。\n\
    \n在示例控制器中，添加根据位置确定要打开哪个文件的代码：\n\n```\nonInit: function() {\n    var sLoc = sap.ui.getCore().getConfiguration().getLanguage();\n\
    \    var i18nPath = \"i18n/i18n\";\n    if(sLoc === \"de_DE\"){  //德语语言区域代码\n\
    \        i18nPath = i18nPath + \"_de.properties\";\n    }else if(sLoc === \"zh-Hans\"\
    ){  //中文语言区域代码\n        i18nPath = i18nPath + \"_ch.properties\";\n    }else{\n\
    \        i18nPath = i18nPath + \".properties\";\n    }\n\n    var oi18nModel =\
    \ new sap.ui.model.resource.ResourceModel({\n        bundleUrl:i18nPath //创建模型\n\
    \    });\n    sap.ui.getCore().setModel(oi18nModel,\"i18n\");\n},\n```\n\n注意：要获取所有地区语言代码，您可以访问以下网址：\n\
    \n[https://wpcentral.io/internationalization/](https://wpcentral.io/internationalization/)\n\
    \n现在，如果我们运行应用程序，并想查看如果来自中国的用户打开应用，应用会是什么样子。为此，我们可以在URL ‘?sap-ui-language’ 后添加语言值作为后缀。\n\
    \n**示例：** [localhost:55913/i18nDemo/index.html?.?sap-ui-language=zh-Hans](localhost:55913/i18nDemo/index.html?.?sap-ui-language=zh-Hans)\n\
    \n这将显示中文按钮：\n\n您也可以查看我们的SAPUI5专业开发视频课程以加速学习：[点击这里](here)或使用下方二维码。\n\n# SAP - 学习SAPUI5专业开发\n\
    \nUI5社区网络 - SAP专家 - SAP服务、SAP咨询、SAP教育\n\n在顶尖OpenUI5专家的帮助下，深入学习SAP UI5 / OpenUI5：基础与进阶，步步为营\n\
    \n56讲 • 7小时 • 中级水平\n\n4.5 ★★★★★ (36条评价)\n\n## 16. 使用UI5进行数据可视化\n\n### Viz：柱状图\n\
    \n现在，我们将了解如何使用UI5的可视化功能。为此，我们将使用Viz库，该库仅存在于SAPUI5中，OpenUI5中没有。从SAPUI5的1.34版本开始，我们使用它的方式发生了重大变化。那么，让我们看看如何利用这些库。\n\
    \n要使用Viz创建一个简单的柱状图，我们需要创建：\n\n- 展平的数据集\n- 坐标轴\n\n### 展平的数据集\n\n展平的数据集是一个定义绑定的对象。它有两个主要部分：一个称为维度，另一个称为度量。维度告诉我们比较的是什么，度量则告诉我们所比较的值。\n\
    \n### 坐标轴\n\n坐标轴也有两个主要部分：维度和度量。维度告诉我们比较的是什么。度量告诉我们所比较的值。\n\n一旦创建了坐标轴和展平的数据集，然后你需要定义VizFrame。\n\
    \n```\nvar oVizFrame = new sap.viz.ui5.controls.VizFrame();\n```\n\n我们需要为这个VizFrame提供三个重要细节：\n\
    1. 展平的数据集\n2. 图表类型（柱状图或饼图）\n3. 坐标轴\n\n同时，在index.html中，我们必须包含额外的*sap.viz*库：\n\n\
