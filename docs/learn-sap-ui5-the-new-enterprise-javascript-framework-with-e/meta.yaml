    # 16.Data Visualization Using UI5


    # Viz : Bar Chart


    Now we are going to see how to use visualizations capabilities ofUI5. For this
    purpose, we will be using Viz library, which are only present in SAPUI5 and not
    present in Open UI5. And from versions 1.34 of SAPUI5,there has been a big change
    on the way we should use it. So let’s see how to make use of these libraries.


    To create a simple bar chart with Viz, we have to create


    +   - Flattened dataset

    - Axis.


    # Flattened dataset


    Flattened dataset is an object that defines the binding. It has two main parts.
    First one is called dimensions and second one is called measures. Dimensions tell
    us what we are comparing and measure will tell us the value, which we are comparing.


    # Axis


    Axis also has two main parts that are dimensions and measure. Dimensions tell
    us what we are comparing. Measure will tell us the value, which you are comparing.


    Once you created the axis and flattened dataset then you need to define the VizFrame.


    ```

    var oVizFrame = new sap.viz.ui5.controls.VizFrame();

    ```


    We need to provide three important details to this VizFrame:


    +   1. Flattened dataset

    2. Type of chart (Bar or Pie Chart)

    3. Axis'
