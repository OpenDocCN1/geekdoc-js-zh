    # 14.Miscellaneous Controls in UI5


    # UX3 Control – SHELL


    Sometimes you want to develop an application and you don’t have much time to rethink
    about the user experience details. And also if your users are going to use the
    application mostly in desktop environment. Then in that case going for Shell based
    application is a good idea. Shell comes with lot of the out of box properties
    and functions, which makes the development quite easy and fast. To use Shell you
    have to use the `sap.ui.ux3.Shell` control.


    ![](img/e0db2820988dc54294b33092f834e7a1_108_0.png)


    ```

    sap.ui.ux3.Shell

    ```


    Let’s create a simple shell app, as shown in above picture where we have a home
    tab and two menu items. You can place any content inside the menu tab like table,
    list, combination of table and list etc. For now let’s keep it simple and place
    a button there.


    In the left hand side, we have a search box and a feeder toolbox. Also there is
    a header which provides options to add login or log out feature. In the right
    side, we have sliding menu. We can also place list, table and more.


    So to start the development, we go to the API reference to search about the Shell
    using the ‘sap.ui.ux3.shell’ keyword. Where you can get a lot of details and also
    simple example of its implementation.


    Now create a new project in eclipse and as we are going to use Shell based controls
    so we are adding libraries ‘sap.m, sap.ui.ux3’ in bootstrap code.'
