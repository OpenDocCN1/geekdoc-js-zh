    # # 2. SAP UI5 Basics


    Let’s start with the UI5 libraries. If you want to work in an enterpriseproject
    using ‘SAPUI5’, then you have to understand the ‘UI5 Libraries’ very well.


    # ## UI5 Libraries


    Before starting with SAP UI5 development, you need to understand the UI5 libraries
    so you know ‘How to use them’ and ‘When to use them’. There are two different
    UI5 libraries present in the marketplace:


    +   - Open UI5 (with Apache 2 License)

    - SAPUI5 (with SAP License)


    The OpenUI5 is free and you will be allowed to use it without any permission from
    SAP. However, to use SAPUI5 you need to have an existing SAP license.


    The current version of Open UI5 library is “Version 1.36.6” (The versions change
    frequently. Due to many numbers of developers involved in improving the libraries.)


    ![](img/e0db2820988dc54294b33092f834e7a1_12_0.png)


    # ## Explorer Section


    The Explorer section is where you can see all the components and know how the
    individual components will behave, when we use those components in application.


    Let’s look at the libraries at [https://openui5.hana.ondemand.com/explored.html](https://openui5.hana.ondemand.com/explored.html)


    ![](img/e0db2820988dc54294b33092f834e7a1_12_1.png)


    Here we have a master detail layout where in the left side we have list of components
    and'
