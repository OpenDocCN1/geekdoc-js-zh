- md: "## 6. Data in UI5 Application\n\nIn this new section, we are going to see how\
    \ data can be used in our UI5 application. We have already seen how to use components\
    \ and how to create a basic application in UI5. We are going to work with JSON\
    \ Data (JavaScript Object Notation). If you have not worked with JSON before then\
    \ below is a short introduction to JSON for beginners. If you are already familiar\
    \ with it then you can skip to the next subsection.\n\n![img](img/e0db2820988dc54294b33092f834e7a1_51_0.png)\n\
    \nIn our database, we represent data in the form of a table. If we represent this\
    \ table, which has three columns named as id, Name, and waiting_number, in JSON\
    \ format. Here each row in the table represents one dataset. Now, if we see how\
    \ this table can be represented in JSON format.\n\nIn the picture on the right\
    \ side, we can see that each record corresponds to an object. The records are\
    \ enclosed in curly braces. You can also see that each object has some repetitive\
    \ values. For example: id, Name, and waiting_number. These are called ‘Keys’.\
    \ They represent the column values of the database table. In the right hand side\
    \ we have A1, A2, and A3 as id values, Ajay, Jon, and Bob as Name values, and\
    \ 1, 2, 3 for waiting_number values. These are the actual data you work with.\
    \ Therefore, this is the simple JSON format representation of the table.\n\nTo\
    \ use JSON data inside our UI5 project, we have to create an object and we call\
    \ that object a ‘Model’. Then we have to attach the model to the view, so that\
    \ it consumes the data inside the model. To implement this in your UI5 application\
    \ is very simple.\n\n![img](img/e0db2820988dc54294b33092f834e7a1_52_0.png)\n\n\
    First of all, you have to assign the JSON data into the oData variable, and we\
    \ are going to create an object of the model. The object of the model can be created\
    \ by using ‘new sap.ui.model.json.JSONModel()’. Once you are able to create an\
    \ object of the JSON Model, you can use the function called ‘setData’ and put\
    \ the JSON Data inside it. Once you are able to put the JSON Data inside our model\
    \ object, then we will be able to use the model object in our application to use\
    \ those data.\n\n```javascript\nvar data = [\n  {\n    \"id\": \"A1\",\n    \"\
    Name\": \"Ajay\",\n    \"waiting_number\": 1\n  },\n  {\n    \"id\": \"A2\",\n\
    \    \"Name\": \"Jon\",\n    \"waiting_number\": 2\n  },\n  {\n    \"id\": \"\
    A3\",\n    \"Name\": \"Bob\",\n    \"waiting_number\": 3\n  }\n]\n\nvar newModel\
    \ = new sap.ui.model.json.JSONModel();\n\nnewModel.setData(data);\n```\n\nTo use\
    \ this model object inside our application, it consists of getting the element\
    \ or component you want to put your data. And using the function ‘setModel’, you\
    \ can assign the model to the element or component. Once you do that, the element\
    \ will be able to pick the data.\n\n![img](img/e0db2820988dc54294b33092f834e7a1_53_0.png)\n\
    \n## Two-way binding\n\nOne of the other terms we come across is *two-way binding*.\
    \ Whenever we are binding the data to an element or component through our model,\
    \ on changing the data or elements, the model data will also be changed. So this\
    \ has a two-way effect. For example, if you consider your element as your ‘destination’\
    \ and the data present in the model as ‘source’. By changing the data in the source,\
    \ the data in the destination also changes, and also by changing the data in the\
    \ destination, the source data also changes. This is the concept of *two-way binding*.\
    \ We are going to see these concepts in action in our next section.\n\nNow let\
    \ us see how to accomplish this using the UI5 library.\n\nNow if we go to our\
    \ *model_demo_basic_1.html* code inside our Cloud9 editor, then you can see the\
    \ structure is pretty simple. We are having the script tag, which includes our\
    \ UI5 libraries from ‘openui5.hana.ondemand.com’ with a blue crystal theme, and\
    \ we also include the ‘sap.m’ library.\n\nThese are very frequently used snippets.\
    \ In the body, you can see a class called ‘sapUiBody’, which will be containing\
    \ the app. This is the basic skeleton, which will load our UI5 library.\n\nHere\
    \ we are creating two variables and those will be actually two labels of class\
    \ ‘sap.m.Label’. With a text property.\n\n```javascript\n<script>\nvar label1\
    \ = new sap.m.Label({ /** creating path label1 */\n    text: \"{key1}\"      \
    \          /** You need to use {} for data binding*/\n});\n\nvar label2 = new\
    \ sap.m.Label({ /** creating path label2 */\n    text: \"{key2}\"\n});\n\nvar\
    \ oData = {\n    \"key1\": \"Dinosars\",            /* JSON Data for key 1 */\n\
    \    \"key2\": \"Elephant\"             /* JSON Data for key 2 */\n};\n```\n\n\
    ```javascript\nvar newModel = new sap.ui.model.json.JSONModel();\nnewModel.setData(oData);\n\
    /* Adding oData to a model */\nlabel1.setModel(newModel);\n/* Model is bound with\
    \ element(label1) */\nlabel2.setModel(newModel);\n/* Model is bound with element\
    \ (label2) */\nlabel1.placeAt(\"content\");\n/* Using placeAt() function placing\
    \ the label 1 content at HTML Page */\nlabel2.placeAt(\"content1\");\n/* Using\
    \ placeAt() function placing the label 2 content at HTML Page */\n</script>\n\
    ```\n\nIn the above program, we created label1 with the text property and label2\
    \ with a text property. Once we created the object of the label, then we add the\
    \ JSON data key inside ‘{}’ which will be replaced by the actual data values of\
    \ JSON once we bind the data either to the global model or to individual elements.\
    \ Finally, we place the labels in our HTML Page using the ‘placeAt’ function.\
    \ The content is going to be a part of div. If we save and run the live preview,\
    \ we will see the below result:\n\n![img](img/e0db2820988dc54294b33092f834e7a1_54_0.png)\n\
    \nYou can also check our SAPUI5 Professional Development video course for accelerated\
    \ learning: [here](https://example.com) or use the below QR code.\n\n![img](img/e0db2820988dc54294b33092f834e7a1_55_0.png)\n\
    \n## SAP - Learn SAPUI5 Professional Development\n\nUi5 Community Network · SAP\
    \ Experts · SAP Services, SAP Consulting, SAP Education\n\n★★★★★ 4.5 (36 ratings)\n\
    \nLearn SAP UI5 / OpenUI5 In Detail: Basic & Advanced Levels, Step By Step, With\
    \ The Help of The Best Open UI5 Experts\n\n- \U0001F3A5 56 lectures\n- ⏱️ 7 hours\n\
    - \U0001F4CA Intermediate Level\n\n![img](img/e0db2820988dc54294b33092f834e7a1_55_1.png)\n\
    \n## 7. List\n\nIn this section, we are going to see one of the most popular UI5\
    \ elements and that is *List*. To use List in our application, we have to use\
    \ ‘sap.m.List’.\n\n![img](img/e0db2820988dc54294b33092f834e7a1_57_0.png)\n\nLet\
    \ us create a simple list and show one single item as ‘dinosaur’ with a description\
    \ ‘mountain’ inside the list.\n\n### Steps to create a list\n\n1. The first step\
    \ is to create a standard list item. Once we have the standard list items, those\
    \ are the items that will be present inside our list.\n2. The second step is to\
    \ create a list object using ‘sap.m.List’. Once we created the ‘sap.m.List’, we\
    \ can put the standard items inside the list. Here dinosaur is a list item and\
    \ animal is a list.\n3. The third step is providing the data. In the picture you\
    \ might notice the use of curly braces with a forward slash ‘{/}’. This represents\
    \ the data binding.\n\nNow, if we go to our Cloud9 *program list_demo_basic_3.html*,\
    \ to see how to implement this list. We can find the below structure:\n\n```javascript\n\
    <script id='sap-ui-bootstrap' type='text/javascript'\n        src='https://openui5.hana.ondemand.com/resources/sap-ui-core.js'\
    \ data-sap-ui-theme='sap_bluecrystal'\n        data-sap-ui-libs='sap.m'>\n</script>\n\
    ```\n\nIn this application, we are going to use ‘sap.m.App’ and ‘sap.m.Page’ as\
    \ well. First, we create a page and app using the below code:\n\n```javascript\n\
    var oPage = new sap.m.Page({\n    title: \"List Page\",\n    content: [\n    \
    \    oList\n    ]\n});\n\nvar oApp = new sap.m.App({              /** Creating\
    \ an App using oApp */\n    pages: [oPage]\n}).placeAt(\"content\");         \
    \      /** Place the content in the HTML */\n```\n\nWe also have to create the\
    \ content. For that, inside the body tags, create a div element and add the content.\
    \ Now we have the page and list ready. Next, we are going to add a list. Next,\
    \ we need to create the data. Create the oData object and add the data inside\
    \ the JSON data. In the previous data binding example we have only the data present,\
    \ for creating a simple app. Now we are going to add more data. Therefore, what\
    \ we are going to do is create a names property inside the oData and all the data\
    \ can be put inside it.\n\n```javascript\nvar oData = {\n    names: [{\n     \
    \   Name: \"Dinosaur\",\n        Place: \"Mountain\"\n    }, {\n        Name:\
    \ \"Elephant\",\n        Place: \"Forest\"\n    }, {\n        Name: \"Whale\"\
    ,\n        Place: \"Sea\"\n    }, {\n        Name: \"Duck\",\n        Place: \"\
    Water\"\n    }, {\n        Name: \"Monkey\",\n        Place: \"Tree\"\n    }]\n\
    };\n```"
  mdcn: "\n## 6. UI5 应用中的数据\n\n在本新章节中，我们将探讨如何在 UI5 应用中使用数据。我们已经了解了如何使用组件以及如何创建一个基础的\
    \ UI5 应用。我们将处理 JSON 数据（JavaScript 对象表示法）。如果你之前没有使用过 JSON，那么以下是面向初学者的简短介绍。如果你已经熟悉它，则可以直接跳至下一小节。\n\
    \n![img](img/e0db2820988dc54294b33092f834e7a1_51_0.png)\n\n在我们的数据库中，数据以表格形式表示。如果我们用\
    \ JSON 格式来表示这个有三列（分别名为 id、Name 和 waiting_number）的表格。这里表格中的每一行代表一个数据集。现在，让我们看看这个表格如何用\
    \ JSON 格式表示。\n\n在右侧的图片中，我们可以看到每条记录对应一个对象。这些记录包含在花括号中。你还可以看到每个对象都有一些重复的值。例如：id、Name\
    \ 和 waiting_number。这些被称为‘键’，它们代表数据库表的列值。在右侧，我们有 A1、A2、A3 作为 id 值，Ajay、Jon、Bob\
    \ 作为 Name 值，以及 1、2、3 作为 waiting_number 值。这些就是你实际使用的数据。因此，这就是该表格的简单 JSON 格式表示。\n\
    \n要在我们的 UI5 项目中使用 JSON 数据，我们必须创建一个对象，并将该对象称为‘模型’。然后，我们需要将模型附加到视图，以便视图能使用模型中的数据。在你的\
    \ UI5 应用中实现这一点非常简单。\n\n![img](img/e0db2820988dc54294b33092f834e7a1_52_0.png)\n\
    \n首先，你需要将 JSON 数据赋值给 oData 变量，然后我们将创建一个模型对象。模型对象可以通过使用 `new sap.ui.model.json.JSONModel()`\
    \ 来创建。一旦你能够创建 JSON 模型对象，你就可以使用名为 `setData` 的函数并将 JSON 数据放入其中。一旦你能够将 JSON 数据放入我们的模型对象，那么我们就可以在应用中使用该模型对象来访问这些数据。\n\
    \n```javascript\nvar data = [\n  {\n    \"id\": \"A1\",\n    \"Name\": \"Ajay\"\
    ,\n    \"waiting_number\": 1\n  },\n  {\n    \"id\": \"A2\",\n    \"Name\": \"\
    Jon\",\n    \"waiting_number\": 2\n  },\n  {\n    \"id\": \"A3\",\n    \"Name\"\
    : \"Bob\",\n    \"waiting_number\": 3\n  }\n]\n\nvar newModel = new sap.ui.model.json.JSONModel();\n\
    \nnewModel.setData(data);\n```\n\n要在我们的应用中使用这个模型对象，包括获取你想要放置数据的元素或组件。通过使用 `setModel`\
    \ 函数，你可以将模型赋值给该元素或组件。一旦你这样做，该元素就能够获取数据。\n\n![img](img/e0db2820988dc54294b33092f834e7a1_53_0.png)\n\
    \n## 双向绑定\n\n我们遇到的另一个术语是 *双向绑定*。每当我们通过模型将数据绑定到元素或组件时，更改数据或元素，模型数据也会随之更改。因此，这具有双向效应。例如，如果你将你的元素视为‘目的地’，而模型中存在的数据视为‘源’。通过更改源中的数据，目的地中的数据也会更改；同样，通过更改目的地中的数据，源数据也会更改。这就是\
    \ *双向绑定* 的概念。我们将在下一节中实际了解这些概念。\n\n现在，让我们看看如何使用 UI5 库来实现这一点。\n\n现在，如果我们进入 Cloud9\
    \ 编辑器中的 *model_demo_basic_1.html* 代码，你会看到结构相当简单。我们有一个 script 标签，它从 ‘openui5.hana.ondemand.com’\
    \ 加载我们的 UI5 库，使用蓝色水晶主题，同时还包含了 ‘sap.m’ 库。\n\n这些是非常常用的代码片段。在 body 中，你可以看到一个名为 ‘sapUiBody’\
    \ 的类，它将包含应用。这是加载我们 UI5 库的基本骨架。\n\n这里我们创建了两个变量，它们实际上是两个属于 ‘sap.m.Label’ 类的标签。带有一个\
    \ text 属性。\n\n```javascript\n<script>\nvar label1 = new sap.m.Label({ /** 创建路径\
    \ label1 */\n    text: \"{key1}\"                /** 你需要使用 {} 进行数据绑定 */\n});\n\
    \nvar label2 = new sap.m.Label({ /** 创建路径 label2 */\n    text: \"{key2}\"\n});\n\
    \nvar oData = {\n    \"key1\": \"Dinosars\",            /* 键 1 的 JSON 数据 */\n\
    \    \"key2\": \"Elephant\"             /* 键 2 的 JSON 数据 */\n};\n```\n\n```javascript\n\
    var newModel = new sap.ui.model.json.JSONModel();\nnewModel.setData(oData);\n\
    /* 将 oData 添加到模型中 */\nlabel1.setModel(newModel);\n/* 模型已与元素(label1)绑定 */\nlabel2.setModel(newModel);\n\
    /* 模型已与元素(label2)绑定 */\nlabel1.placeAt(\"content\");\n/* 使用 placeAt() 函数将标签 1\
    \ 的内容放置在 HTML 页面中 */\nlabel2.placeAt(\"content1\");\n/* 使用 placeAt() 函数将标签 2 的内容放置在\
    \ HTML 页面中 */\n</script>\n```\n\n在上面的程序中，我们创建了带有 text 属性的 label1 和 label2。一旦我们创建了标签对象，我们就在\
    \ ‘{}’ 内部添加了 JSON 数据的键，当我们绑定数据（无论是绑定到全局模型还是单个元素）时，这些键将被 JSON 的实际数据值替换。最后，我们使用\
    \ ‘placeAt’ 函数将标签放置在我们的 HTML 页面中。content 将成为 div 的一部分。如果我们保存并运行实时预览，我们将看到以下结果：\n\
    \n![img](img/e0db2820988dc54294b33092f834e7a1_54_0.png)\n\n你也可以查看我们的 SAPUI5 专业开发视频课程以加速学习：[此处](https://example.com)或使用下方二维码。\n\
    \n![img](img/e0db2820988dc54294b33092f834e7a1_55_0.png)\n\n## SAP - 学习 SAPUI5\
    \ 专业开发\n\nUi5 社区网络 · SAP 专家 · SAP 服务，SAP 咨询，SAP 教育\n\n★★★★★ 4.5 (36 个评分)\n\n深入学习\
    \ SAP UI5 / OpenUI5：基础与高级水平，循序渐进，在顶尖 Open UI5 专家的帮助下\n\n- \U0001F3A5 56 节课\n-\
    \ ⏱️ 7 小时\n- \U0001F4CA 中级水平\n\n![img](img/e0db2820988dc54294b33092f834e7a1_55_1.png)\n\
    \n## 7. 列表\n\n在本节中，我们将了解 UI5 中最受欢迎的元素之一，那就是 *列表*。要在我们的应用中使用列表，我们必须使用 ‘sap.m.List’。\n\
    \n![img](img/e0db2820988dc54294b33092f834e7a1_57_0.png)\n\n让我们创建一个简单的列表，并在其中显示一个单独的项目，内容为\
    \ ‘dinosaur’，描述为 ‘mountain’。\n\n### 创建列表的步骤\n\n1. 第一步是创建一个标准列表项。一旦我们有了标准列表项，它们就是将出现在我们列表中的项目。\n\
    2. 第二步是使用 ‘sap.m.List’ 创建一个列表对象。一旦我们创建了 ‘sap.m.List’，我们就可以将标准项放入列表中。这里 dinosaur\
    \ 是一个列表项，animal 是一个列表。\n3. 第三步是提供数据。在图片中，你可能注意到使用了带有正斜杠 ‘{/}’ 的花括号。这代表数据绑定。\n\n\
    现在，如果我们进入 Cloud9 中的 *program list_demo_basic_3.html*，看看如何实现这个列表。我们可以找到以下结构：\n\n\
    ```javascript\n<script id='sap-ui-bootstrap' type='text/javascript'\n        src='https://openui5.hana.ondemand.com/resources/sap-ui-core.js'\
    \ data-sap-ui-theme='sap_bluecrystal'\n        data-sap-ui-libs='sap.m'>\n</script>\n\
    ```\n\n在这个应用中，我们还将使用 ‘sap.m.App’ 和 ‘sap.m.Page’。首先，我们使用以下代码创建页面和应用：\n\n```javascript\n\
    var oPage = new sap.m.Page({\n    title: \"List Page\",\n    content: [\n    \
    \    oList\n    ]\n});\n\nvar oApp = new sap.m.App({              /** 使用 oApp\
    \ 创建一个应用 */\n    pages: [oPage]\n}).placeAt(\"content\");               /** 将内容放置到\
    \ HTML 中 */\n```\n\n我们还需要创建内容。为此，在 body 标签内，创建一个 div 元素并添加内容。现在我们已经准备好了页面和列表。接下来，我们将添加一个列表。接着，我们需要创建数据。创建\
    \ oData 对象并在 JSON 数据中添加数据。在之前的绑定示例中，为了创建一个简单的应用，我们只有数据存在。现在我们将添加更多数据。因此，我们要做的是在\
    \ oData 内部创建一个 names 属性，所有数据都可以放入其中。\n\n```javascript\nvar oData = {\n    names:\
    \ [{\n        Name: \"Dinosaur\",\n        Place: \"Mountain\"\n    }, {\n   \
    \     Name: \"Elephant\",\n        Place: \"Forest\"\n    }, {\n        Name:\
