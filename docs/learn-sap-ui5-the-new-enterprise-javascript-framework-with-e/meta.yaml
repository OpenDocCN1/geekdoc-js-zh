    \ the most common pattern in programming language and with UI5 it is a bit different\
    \ in implementation.\n\n## Model View Controller (MVC)\n\n![MVC Diagram](img/e0db2820988dc54294b33092f834e7a1_39_0.png)\n\
    \nMVC Stands for **Model View Controller.**\n\n## View\n\nThe first step is to\
