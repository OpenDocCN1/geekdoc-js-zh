    \nBefore creating the content of the page there are two functions, which will\
    \ be executed. First one is *onInit*. *onInit* function that is written in controller,\
    \ which will be followed by the *onBeforeRendering* (Before the page is actually\
    \ rendered. That is when the objects of all the elements are created).\n\n# onAfterRendering\n\
