    \ as shown below.\n\n```\n<script src=\"resources/sap-ui-core.js\"\n        id=\"\
    sap-ui-bootstrap\"\n        data-sap-ui-libs=\"sap.m,sap.ui.commons,sap.ui.table\"\
    \ //Added additionally sap.ui.commons and sap.ui.table\n        data-sap-ui-theme=\"\
    sap_bluecrystal\">\n</script>\n```\n\nThe in view we have to change the type of\
    \ the columns:\n\n```\nvar oCol1 = new sap.ui.table.Column({\n    label: new sap.m.Label({\n\
    \        text: \"Name\"\n    }),\n    template: new sap.m.Text({\n        text:\
    \ \"{Name}\"\n    })\n});\n\nvar oCol2 = new sap.ui.table.Column({\n    label:\
    \ new sap.m.Label({\n        text: \"Place\"\n    }),\n    template: new sap.m.Text({\n\
    \        text: \"{Place}\"\n    })\n});\n\nvar oCol3 = new sap.ui.table.Column({\n\
    \    label: new sap.m.Label({\n        text: \"Id\"\n    }),\n```\n\nFinally,\
    \ in binding, we can use one simpler version of binding. This is called ‘bindrows’.\
    \ As we already defined template in column level, so we do not need to create\
    \ that separately.\n\n```\noList.bindItems(\"/names\");\n```\n\nThese are the\
    \ simple changes to be made for our new table variant. Now run this application\
    \ and you can see the difference between the old and new table.\n\n| Name | Place\
    \ | Id |\n| :--- | :--- | :--- |\n| Dinosaurs | Mountain | Mountain |\n| Elephant\
    \ | Forest | Forest |\n| Whale | Sea | Sea |\n| Duck | Water | Water |\n| Monkey\
    \ | Tree | Tree |\n\nHere the structure is changed and it is responsive to the\
    \ mobile devices as well up to certain extent. Nevertheless, the main decision\
    \ to select which table (sap.m and sap.ui) to use, depends on two factors:\n\n\
