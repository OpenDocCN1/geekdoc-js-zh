    us speed our development. Google chrome is one of the best browsers out there
    in the marketplace. If you are developing any application, which is related to
    web, then Google Chrome is going to be the first preference. Chrome provides a
    lot of out of the box features that will be very useful for a developer. Not only
    for development but also for finding bugs, analysing style sheets and correcting
    them on the fly. We will see the features of Google Chrome browsers one by one.


    **Note:** If you have to deliver the application to the customer and your customers
    are not using Google Chrome and might be using Firefox or Internet explorer. Then
    you have to check the application that your customer is using and check if everything
    is working or compatible with that browser before delivering the application.
