  - '[PAGE 79]


    # # 11. Using Chrome Development Toolkit


    In this section, we are going to see how Google Chrome development kit can help
    us speed our development. Google chrome is one of the best browsers out there
    in the marketplace. If you are developing any application, which is related to
    web, then Google Chrome is going to be the first preference. Chrome provides a
    lot of out of the box features that will be very useful for a developer. Not only
    for development but also for finding bugs, analysing style sheets and correcting
    them on the fly. We will see the features of Google Chrome browsers one by one.


    **Note:** If you have to deliver the application to the customer and your customers
    are not using Google Chrome and might be using Firefox or Internet explorer. Then
    you have to check the application that your customer is using and check if everything
    is working or compatible with that browser before delivering the application.
    Sometimes many features are not compatible across browsers.


    Let’s look into the features of Google Chrome. You have to click ‘F12’ in window
    machine or simply right click and select inspect element. Now development toolkit
    can placed in right hand side or below the browser or you can even separate the
    development kit window from *customize and control* functionality present at top
    right corner.


    The separate window layout will be very useful when you have dual screens setup.
    For now let’s dock it in the right hand side of the browser screen.


    ![](img/e0db2820988dc54294b33092f834e7a1_79_0.png)'
- md: 'Now let us have a walk through of different tabs present.


    ## Elements tab


    ![](img/e0db2820988dc54294b33092f834e7a1_80_0.png)


    It provides all the HTML elements in a tree format. If we collapse the entire
    tree, we can see which is the root element, which is HTML in this case. You can
    also expand and see what the elements inside the tree are. There are a lot of
    components, which are available. Sometimes, it is very difficult to find these
    elements. Therefore, you can use search here.


    ## Search


    Press ‘Ctrl+F’ in a Windows machine or ‘Command+F’ on a MAC. If you want to search
    and find an element, then you can simply search in the bar by typing in the name
    of the component or even any property or any relative value you know which will
    match the element.


    If we search for the submit button, it will highlight the component in yellow
    color. This is very handy when you are looking for a component in your web page.
    One more option is there if you want to check for a component that is repeated
    in the application. Then enter the component and click enter; every time it will
    show you where in other places it is also used. You can also press ‘Ctrl+Z’ to
    go back to your previous search.


    One handier feature is the **selection element** feature. Once you select this,
    it will turn into blue. When you move the mouse over the screen, then the particular
    ‘div’ element is highlighted in the screen.


    ## Change HTML on the Fly


    If you want to change the HTML, then you can right click and select ‘Edit as HTML’.
    Now you can do changes to your DOM Elements. If we delete the entire element,
    then the particular section will be removed from the web page instantly.


    ## CSS Properties


    ![](img/e0db2820988dc54294b33092f834e7a1_81_0.png)


    CSS is a very powerful tool. When you highlight some DOM elements, then you can
    see the CSS properties linked to that on the right hand side. Here we can perform
    changes in the CSS properties like color, padding, width etc. directly and that
    will be reflected instantly on the web page.


    When you have a requirement to do a lot of design changes in CSS, then changing
    CSS and seeing the result on the fly is essential. For example, if your customer
    asks you to change the color of the button or the button needs to be presented
    at the bottom of the page, the CSS Style tab provides a lot of trial and error
    approach to reach the final optimum CSS code to achieve that.


    For example, to change the background color of the input, we select the input
    and give the class name with the background-color property. Note here that, if
    there are some properties that are overwritten by other properties, then according
    to precedence the final result will be shown. If you mention it as important,
    then the mentioned value will have the higher priority.


    ## Toggle Device Mode


    ![](img/e0db2820988dc54294b33092f834e7a1_82_0.png)


    In toggle device mode, you can view the application to see how it will look in
    other devices like iPhone, Nexus 6 and more. There is also one edit tab as well.
    This will allow you to choose the devices available in the list.


    ## Browser Console


    ![](img/e0db2820988dc54294b33092f834e7a1_83_0.png)


    Console is like a real-time editor of your web page. When you are loading an application,
    if there are some errors and your application is not loading properly, then the
    console is the place where you will find what the errors are. This also provides
    a brief log of your application runtime. This will provide what are the libraries
    that are loaded, which application started running and when.


    We can also write code in our console. When you write code in the console, you
    will get real time feedback for it. You instantly know if particular code is going
    to work in our application or not. To try that now, we are going to clear the
    console using the ‘clear()’ function.


    ## Source


    This tab provides the capability to debug our application, see code and files
    involved in our application. The left side bar will give a glimpse of all the
    files, which are involved in our project. For example, if we want to debug the
    view file, then we can select the view file and fix a debug point by pressing
    on the line number to its left. Then go to the console and refresh the page. It
    will stop you at the debugging point you fixed. The debugging point will be triggered
    only if the console window (development toolkit) is opened. The debugging point
    can be disabled by enabling the icon for ‘Deactivate breaking points’.


    ![](img/e0db2820988dc54294b33092f834e7a1_84_0.png)


    ## Network


    In the network tab you can see all the components that are loaded. If there are
    some components that are called from an API, then you can also see the status,
    check their request and response. If you want to see the data or response, then
    click on it and you will be able to see the details in the response window.


    The header section will give you a glimpse of all the details like request method,
    request URL and the status code. These will be handy when you are debugging and
    can verify if all the API communications are carried out as expected. In addition,
    there is also a filter tab available where you can filter the contents using name
    and the type like CSS, JS, Image, media and much more.


    ## Responsiveness and Browser Compatibility


    ![](img/e0db2820988dc54294b33092f834e7a1_85_0.png)


    Responsiveness in a UI5 Application can be a make or break decision. When you
    deliver the product for user acceptance testing, they will test the applications
    in their own devices and environment. It can be a mobile device, tablet or desktop
    computer. So you need to create the applications depending upon what your users
    are going to use. In addition, the browser that the user will use should be decided
    initially. Because there are many features, which may not be supported in some
    browsers or work differently in different browsers, and at a later point of time,
    change can result in major development.


    You can check additional compatibility with browsers in the API reference as well.
    There is a help section for developers in http://openui5.hana.ondemand.com, which
    gives details about browser and platform support guide.


    To put it concisely, always consider these three things before taking any major
    decision:


    - 1. Know your customer''s devices and environment well.

    - 2. Check compatibility rules from SAP help document for the running environment.

    - 3. Consider always the cross browser and device usage in the development phase.


    ## Styling and Theming for UI5 App


    The styling and theming will make your webpage more responsive and presentable
    to your users. The responsiveness of your application depends upon the media query.
    The media query is part of CSS. The CSS plays a major role in UI5 Applications.
    You may ask how much CSS we need to know if we are creating an end-to-end UI5
    app; to answer this, it is necessary to know CSS in detail.


    Generally, in big UI5 projects, there are two sets of people. Those who are focused
    on the development and others focusing on the design. The people who are working
    in design will focus on user experience and CSS. The people who are working in
    development are focusing on controller, view, data and UI5 Libraries.


    We already have created one ‘Simple APP’ containing an input box and a button.
    We are going to see how to change the CSS design so it looks much nicer and also
    we are going to bring the input box and button to the center in both the mobile
    and desktop view of the application.


    ![](img/e0db2820988dc54294b33092f834e7a1_86_0.png)


    To start the process, let us open our development toolkit. Now here we are going
    to use our element tab to do the changes. To focus on the input box, right click
    on the input box and select inspect element. This will highlight the HTML content
    of the input in the browser console. Let’s look for the class that is assigned
    to the input element. Most of the standard CSS classes start with ‘sap’. So be
    careful when you change the standard CSS class. Because, if you change the standard
    class, it will be affected everywhere in the application.'
