    \ }\n}\n\nvar report = new Report(\"Monthly Sales\");\nreport.print();\n\nvar\
    \ cashreport = new CashReport(\"Monthly Sales\");\ncashreport.print();\n```\n\n\
    `super()` 函数用于调用父类的构造函数。如果子类继承了另一个类，那么在子类的构造函数中它是必须的。\n\n你也可以向子类添加新方法：\n\n```typescript\n\
    class CashReport extends Report {\n    constructor(name: string) {\n        super(name);\n\
