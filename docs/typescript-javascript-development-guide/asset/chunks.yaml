    class Monster {\n    constructor(name, initPosition) {\n        this.name = name;\n\
    \        this.initPosition = initPosition;\n    }\n}\n```\n\n在 `TypeScript` 中，下面的\
    \ `ES 6` 类将无法工作，因为属性没有被定义。你应该使用：\n\n```typescript\nclass Monster {\n    name:\
    \ string;\n    initPosition: number;\n    constructor(name: string, initPosition:\
    \ number) {\n        this.name = name;\n        this.initPosition = initPosition;\n\
    \    }\n}\n```\n\n在 `TypeScript` 中，你可以在构造函数中使用 `public` 或 `private` 修饰符来定义属性。这是一种更短的语法：\n\
    \n```typescript\nclass Monster {\n    public name: string;\n    private initPosition:\
    \ number;\n    constructor(name: string, initPosition: number) {\n        this.name\
    \ = name;\n        this.initPosition = initPosition;\n    }\n}\n```\n\n或者更短：\n\
    \n```typescript\nclass Monster {\n    constructor(public name: string, private\
    \ initPosition: number) {}\n}\n```\n\n## 继承\n\n在 `TypeScript` 中，你可以使用 `extends`\
    \ 关键字从另一个类创建一个新类。这被称为继承。\n\n```typescript\nclass Report {\n    name: string;\n\
