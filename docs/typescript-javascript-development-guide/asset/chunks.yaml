    \ of Object: ' + square.height );\n```\n\n我们上面示例中的对象有两个属性，即 `area` 和 `color`。我们还实现了一个构造函数和\
    \ `shoutit()` 方法。我们的构造函数参数的作用域是局部于构造函数的。由于这一点，在浏览器和编译器中都会观察到错误，如下所示：\n\n```text\n\
    class.ts(12,42): The 'name' property does not exist on the value of type 'Shape'\n\
    class.ts(20,40): The 'name' property does not exist on the value of type 'Shape'\n\
    class.ts(22,41): The 'width' property does not exist on the value of type 'Shape'\n\
    class.ts(23,42): The 'height' property does not exist on the value of type 'Shape'\n\
    ```\n\n`TypeScript` 同时支持 `public` 和 `private` 访问修饰符。对于公共成员，我们可以在任何地方访问它们，而对于私有成员，我们只能在内部访问它们。在\
    \ `JavaScript` 中，没有可以用于强制私有化的特性，这就是为什么它在编译时强制执行，并用于提醒开发者他们将其私有化的意图。\n\n我们需要为构造函数参数\
    \ `name` 添加公共访问修饰符，然后为成员（即 `color`）添加私有修饰符。一旦在构造函数的参数上添加了访问修饰符，它将自动成为具有该访问修饰符的类成员。考虑下面的示例：\n\
    \n...\n\n```typescript\nprivate color: string;\n...\n\nconstructor ( public name:\
