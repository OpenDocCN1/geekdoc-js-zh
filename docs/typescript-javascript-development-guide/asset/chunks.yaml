    \ an enum of string version into a number or maybe a number version of the enum.\
    \ The code given below best describes this:\n\nenum MyEnum {\n\n   False,\n\n\
       True,\n\n   Unknown\n\n}\n\nconsole.log(MyEnum [0]); // \"False\"\n\nconsole.log(MyEnum\
    \ [\"False\"]); // 0\n\nconsole.log(MyEnum [MyEnum.False]); // \"False\" because\
    \ ` MyEnum.False == 0`\n\nIt is also possible for us to change the number which\
    \ is associated with the enum. The default setting is that enums are 0 and each\
    \ subsequent increment is automatically made in intervals of 1\\. Consider the\
    \ code given below which best describes this:\n\nenum Color {\n\n   Red,     //\
    \ 0\n\n   Green,   // 1\n\n   Blue     // 2\n\n}\n\nThe number associated with\
    \ a specific enum can be automatically changed  by specifically assigning to it.\
    \ The example given below shows how this can be done, we begin at 3, and then\
    \ increment from there as shown below:\n\nenum Color {\n\n   LightRed = 3,  //\
    \ 3\n\n   DarkGreen,    // 4\n\n   LightBlue      // 5\n\n}\n\nYou also have to\
    \ know that enums are open ended. Consider the JavaScript code given below, which\
    \ has been generated from an enum:\n\nvar MyEnum;\n\n(function (MyEnum) {\n\n\
       MyEnum [MyEnum [\"False\"] = 0] = \"False\";\n\n   MyEnum [MyEnum [\"True\"\
    ] = 1] = \"True\";\n\n   MyEnum [MyEnum [\"Unknown\"] = 2] = \"Unknown\";\n\n\
    })( MyEnum || (MyEnum = {}));\n\nAn enum definition can be spread across multiple\
    \ files. Consider the example given below, in which we are spreading the definition\
    \ of Color to get two blocks:\n\nenum Color {\n\n   Red,\n\n   Green,\n\n   Blue\n\
    \n}\n\nenum Color {\n\n   LightRed = 3,\n\n   DarkGreen,\n\n   LightBlue\n\n}\n\
    \nEnums as flags\n\nFlgs provide us with an excellent ability  to use enums. Consider\
    \ the example given below:\n\nenum Animal {\n\n   None           = 0,\n\n   PossesClaws\
    \       = 1 << 0,\n\n   Flying         = 1 << 1,\n\n   ConsumesFish       = 1\
    \ << 2,\n\n   Endangered     = 1 << 3\n\n}\n\nIn the above case, we need to get\
    \ bitwise disjoint operators by moving the 1 around.\n\nConsider the next example\
    \ given below:\n\nenum Animal {\n\n   None           = 0,\n\n   PossesClaws       =\
    \ 1 << 0,\n\n   Flies         = 1 << 1,\n\n}\n\nfunction printAnimalAbilities(animal)\
    \ {\n\n   var animFlags = animal.flags;\n\n   if (animFlags & AnimFlags.PossesClaws)\
    \ {\n\n       console.log('The animal has claws');\n\n   }\n\n   if (animFlags\
    \ & AnimFlags.Flies) {\n\n       console.log('The animal can fly');\n\n   }\n\n\
       if (animFlags == AnimFlags.None) {\n\n       console.log('nothing');\n\n   }\n\
    \n}\n\nvar animal = { flags: AnimFlags.None };\n\nprintAnimalAbilities(animal);\
    \ // nothing\n\nanimal.flags |= AnimFlags.PossesClaws;\n\nprintAnimalAbilities(animal);\
    \ //The animal has claws\n\nanimal.flags &= ~AnimFlags.PossesClaws;\n\nprintAnimalAbilities(animal);\
    \ // nothing\n\nanimal.flags |= AnimFlags.PossesClaws | AnimFlags.Flies;\n\nprintAnimalAbilities(animal);\
    \ // The animal has claws and the animal it flies\n\nFlags can be combined for\
    \ the purpose of creating convenient shortcuts in the definition of the enum.\
    \ This is shown in the code given below:\n\nenum Animal {\n\n   None           =\
    \ 0,\n\n   PossesClaws       = 1 << 0,\n\n   Flies         = 1 << 1,\n\n   EatsFish\
    \       = 1 << 2,\n\n   Endangered     = 1 << 3,\n\n   EndangeredFliesClawedEatFish\
    \ = PossesClaws | Flies | EatsFish | Endangered,\n\n}\n\nConst Enums\n\nSuppose\
    \ that you have an enum defined as follows:\n\nenum MyEnum {\n\n   False,\n\n\
       True,\n\n   Unknown\n\n}\n\nvar lie = MyEnum.False;\n\nFor you to boost the\
    \ performance, you have to mark the enum as a “const enum.”  This is shown in\
    \ the code given below:\n\nconst enum MyEnum {\n\n   False,\n\n   True,\n\n   Unknown\n\
    \n}\n\nvar lie = MyEnum.False;\n\nThe above will give the following JavaScript\
    \ code after compilation:\n\nvar lie = 0;\n\nWhat the compiler does is that it\
    \ inilines any enum which has been used. Also, no JavaScript will be generated\
    \ for the definition of the enum. This is because the usages for this will be\
    \ inlined.\n\n# \n\nChapter 13- let\n\nIn JavaScript, variables are function scoped.\
    \ This is not the case with several other programming languages, such as Java\
    \ and C#, in which variables are block scoped. Consider the JavaScript code given\
    \ below:\n\nvar myVar = 123;\n\nif (true) {\n\n   var myVar = 500;\n\n}\n\nconsole.log(myVar);\
    \ // 500\n\nAlthough you expected the above code to print 123, it will print 500\\\
    . This is because our variable “myVar” remains to be the same both inside and\
    \ outside the “if” block. This is one of the most common sources of errors in\
    \ JavaScript. In TypeScript, the keyword “let” was introduced so as to enable\
    \ the programmers to define variables having a true block scope. This means that\
    \ if you use the keyword “let” rather than the “var” keyword to define your variable,\
    \ it will be seen and used differently as outside the scope. The previous example\
    \ can be written using the “let” keyword as shown below:\n\nlet myVar = 123;\n\
    \nif (true) {\n\n   let myVar = 500;\n\n}\n\nconsole.log(myVar); // 123\n\nConsider\
    \ the example given below, which shows how the “let” keyword can be used in loops:\n\
    \nvar index = 0;\n\nvar myArray = [1, 2, 3];\n\nfor (let index = 0; index < myArray.length;\
    \ index++) {\n\n   console.log(myArray[index]);\n\n}\n\nconsole.log(index); //\
    \ 0\n\nReplacing it with the “let” keyword will help save you from errors of the\
    \ loop. This is shown below:\n\nvar index = 0;\n\nvar myArray = [1, 2, 3];\n\n\
    for (let index = 0; index < myArray.length; index++) {\n\n   console.log(myArray[index]);\n\
    \n}\n\nconsole.log(index); // 0\n\nAs shown above, it is always good for you to\
    \ use the “let” keyword whenever possible, and you will be saved from many surprises\
    \ and errors.\n\nFunctions are also used for the purpose of creating a new scope.\
    \ We are in need of demonstrating how a function can be used for creating a new\
    \ variable scope in JavaScript. Consider the code given below:\n\nvar myVar =\
    \ 123;\n\nfunction testFunction() {\n\n   var myVar = 500;\n\n}\n\ntestFunction();\n\
    \nconsole.log(myVar); // 123\n\nThe above code will behave just as you would like.\
    \ Without it, it will be hard for one to write their JavaScript code.\n\nGenerated\
    \ JS\n\nTypeScript generates a JS code in which it is simple to rename the let\
    \ variable if there exists a similar name in the surrounding. Consider the code\
    \ given below, which shows a simple replacement of the var with let. Here is the\
    \ code:\n\nif (true) {\n\n   let myVar = 123;\n\n}\n\n// will become //\n\nif\
    \ (true) {\n\n   var myVar = 123;\n\n}"
