    - 结语\n\n## 免责声明\n尽管已尽力核实书中信息的准确性，但作者对包含的主题内容的错误、遗漏或相反的解释不承担任何责任。书中提供的信息仅供教育和娱乐之用。读者对其自己的行为负责，作者对因使用这些信息而导致的任何实际或感知的责任或损害不承担任何责任。\n\
    \n书中使用的商标均未经任何许可，且商标的出版未获得商标所有者的许可或支持。书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文没有附属关系。\n\n\
    # 引言\n市场对大型软件应用，尤其是 Web 应用的需求日益增长。这背后的原因是软件应用程序需要实现的功能越来越多。这要求我们学习如何开发大型应用程序。这只有在支持它的编程语言中才能实现。TypeScript\
    \ 就是这种语言之一。它支持大型应用程序的创建。本书是你学习 TypeScript 编程的极佳方式。阅读愉快！\n\n# 第 1 章- TypeScript\
    \ 概览\nTypeScript 是由微软开发并维护的编程语言。它是一种开源编程语言。由于它是 JavaScript 的超集，因为它添加了一些额外功能，例如支持面向对象编程和可选静态类型。该语言旨在创建大型应用程序，并且始终编译为\
    \ JavaScript。可以使用 TypeScript 开发客户端和服务器端的 JavaScript 。既然我们说 TypeScript 是 JavaScript\
    \ 的超集，那么用 JavaScript 编写的任何程序也可以视为 TypeScript 程序。TypeScript 编译器也是用 TypeScript 编写。\n\
    \nTypeScript 的目标为开发者提供一种开发大型应用程序的简单机制。它带有类、继承、接口、模块等概念，这些使得开发者能够轻松地创建大型应用程序。\n\
    \n# 第 2 章- 安装 TypeScript\n我们有两种方法可以将 TypeScript 安装到系统中。这些包括：\n\n1. 使用 `npm`（Node\
    \ 包管理器）工具。\n2. 安装 Visual Studio 的 TypeScript 插件。\n\n对于 Windows 用户，如果第二种方案对你更方便，可以使用。只需安装\
    \ Visual Studio，然后下载并安装用于 TypeScript 编程的插件。事实证明这种方案比使用其他代码编辑器略优。\n\n对于使用 Windows\
    \ 其他平台的用户，只需确保你有文本编辑器、浏览器和 TypeScript 的 `npm` 包，以便使用 TypeScript 编程。可以按照以下步骤完成：\n\
    \n1. 首先安装 Node 包管理器。打开终端并执行以下命令：\n```bash\ncurl -sL https://get.nodesource.com/setup_14.x\
    \ | bash -\n```\n2. 下一步全局安装 TypeScript。可以使用以下命令：\n```bash\nnpm install -g typescript\n\
    ```\n\n## Hello 示例\n现在准备好了环境，可以开始编程了。我们将创建一个索引文件。以下是 `index.html` 的代码：\n\n```html\n\
    <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>This\
    \ is TypeScript</title>\n</head>\n<body>\n  <script src=\"hello.ts\"></script>\n\
    </body>\n</html>\n```\n如上述代码所示，我们引用了 `hello.ts` 文件。这是在 `<script src=\"hello.ts\"\
    ></` 行中完成的。文件名中的 `.ts` 扩展名意味着它是 TypeScript 文件。\n\n现在，创建一个文件并命名为 `hello.ts`。在文件中添加以下代码：\n\
    ```typescript\nalert('hello world, this is TypeScript!');\n```\n之后，启动命令行并进入 `hello.ts`\
    \ 文件所在的文件夹。执行以下命令编译文件：\n```bash\ntsc hello.ts\n```\nTypeScript 中的 `tsc` 命令代表 TypeScript\
    \ 编译器，它将生成一个名为 `hello.js` 的新文件。我们将 TypeScript 转换为 JavaScript 文件。\n\n# 第 3 章- 类型注解\n\
    该功能在 TypeScript 中是可选的，允许我们在 TypeScript 程序中表达和实现注解。我们需要通过创建一个计算矩形面积的程序来演示这一点。只需打开文本编辑器创建一个名为\
    \ `area.ts` 的新文件。在文件中添加以下代码：\n\n```typescript\nfunction area(shape: string, width:\
    \ number, height: number) {\n  var area = width * height;\n  return \"The shape\
    \ is \" + shape + \" having an area of \" + area + \" cm squared.\";\n}\n\ndocument.body.innerHTML\
    \ = area(\"rectangle\", 20, 15);\n```\n接下来，打开 `index.html`并将脚本源从 `type.ts` 改为\
    \ `area.ts`。打开终端并执行以下命令编译整个内容：\n```bash\ntsc area.ts\n```\n"
- fmt: "\nThe message together with the area of the rectangle will be displayed. As\
    \ you must have noticed, the type annotations are passed to the parameters of\
    \ the function, and they are used for indicating the kind of parameters which\
    \ are supported by the function. In the above example, the parameter `shape` is\
    \ a string, while the parameters `length` and `width` are numbers.\n\nYou have\
    \ to know that both Type annotations and other TypeScript features are enforced\
    \ during compile time. In case one passes other types of values to these parameters,\
    \ a compile-time error will be displayed by the compiler. This is a very good\
    \ idea when it comes to working with large applications.\n\nWe need to demonstrate\
    \ how errors will be detected in our case. Consider the code given below:\n\n\
    ```typescript\nfunction area(shape: string, width: number, height: number) {\n\
    \    var area = width * height;\n    return \"The shape is \" + shape + \" having\
    \ an area of \" + area + \" cm squared.\";\n}\n\ndocument.body.innerHTML = area(\"\
    rectangle\", \"width\", 15); // wrong type of width\n```\n\nIn the above example,\
    \ the `width` has been passed in as a string, which is wrong. The compiler expects\
    \ that the `width` should be a number. After compiling the program given above,\
    \ you will get the following as the error:\n\n```\n$ tsc type.ts\ntype.ts(6,26):\
    \ Supplied parameters do not match any signature of call target\n```\n\nThat is\
    \ the kind of error you get.\n\nHowever, you must have noticed that although there\
    \ was a warning due to type mismatch, this did not stop the TypeScript file from\
    \ compiling and creating a JavaScript file.\n\nAs shown in the above examples,\
    \ it is very clear that annotations are used for the purpose of recording the\
    \ function which a function or a variable is intended to perform. Suppose that\
    \ you have a function which expects that only a single parameter should be passed\
    \ to it, and the parameter should be of the string type. What should happen once\
    \ we pass an array to it? Consider the example given below:\n\n```typescript\n\
    function welcome(name: string) {\n    return \"Hello, \" + name;\n}\n\nvar user\
    \ = [0, 1, 2];\n\ndocument.body.innerHTML = wlecome(user);\n```\n\nOnce you recompile\
    \ the above code, you will get the following error:\n\n```\nwelcome.ts(7,26):\
    \ Supplied parameters do not match any signature of call target\n```\n\nSimilarly,\
    \ you can try to remove all the parameters from the `welcome` call function. You\
    \ will be warned by the TypeScript compiler that you have passed in an unexpected\
    \ number of parameters.\n\n# Chapter 4- Interfaces\n\nWe need to use our previous\
    \ example by expanding it so as to implement an interface which will describe\
    \ the shape as an object having an optional color property.\n\nCreate a new file,\
    \ and give it the name `interface.ts`. Open the file `index.html` and then modify\
    \ it so as to have the script source as `interface.js`. Add the following code\
    \ to the file `interface.ts`:\n\n```typescript\ninterface Shape {\n    name: string;\n\
    \    width: number;\n    height: number;\n    color?: string;\n}\n\nfunction area(shape\
    \ : Shape) {\n    var area = shape.width * shape.height;\n    return \"The shape\
    \ is \" + shape.name + \" having an area of \" + area + \" cm squared\";\n}\n\n\
    console.log( area( {name: \"rectangle\", width: 20, height: 15} ) );\nconsole.log(\
    \ area( {name: \"square\", width: 20, height: 25, color: \"blue\"} ) );\n```\n\
    \nInterfaces are the names which are given to object types. It is possible for\
    \ us to declare interfaces, and at the same time use it in our type annotation.\n\
    \nOnce you compile the file `interface.js`, you will get no errors. For us to\
    \ make it give us an error, let us add a new line of code to the file `interface.js`\
    \ having a shape with no name property and then observe the result in the console\
    \ of our browser. Append the line of code given below to the file `interface.js`:\n\
    \n```javascript\nconsole.log( area( {width: 20, height: 15} ) );\n```\n\nYou can\
    \ then run the command `tsc interface.js` so as to compile the code in the file.\
    \ An error will be the output, but do not be worried by that for now. Refresh\
    \ your browser, and then observe what the console gives you. The text and the\
    \ area of the rectangle will form the output on the console. The arrow should\
    \ be as follows:\n\n```\ninterface.ts(26,13): Supplied parameters do not match\
    \ any signature of call target:\nCould not apply type 'Shape' to argument 1, which\
    \ is of type '{ width: number; height: number; }'\n```\n\nThe error shown above\
    \ is a result of the fact that the object which has been passed to the function\
    \ `area()` will not conform to the interface named `shape`, and a name property\
    \ is needed so as to do so.\n\nConsider the code given below, which shows how\
    \ an interface can be used in TypeScript:\n\n```typescript\ninterface Person {\n\
    \    fName: string;\n    lName: string;\n}\n\nfunction welcome(person: Person)\
    \ {\n    return \"Hello, \" + person.fName + \" \" + person.lName;\n}\n\nvar user\
    \ = { fName: \"Jane\", lName: \"User\" };\n\ndocument.body.innerHTML = welcome(user);\n\
    ```\n\nIn the above example, we have implemented an interface which is to be used\
    \ for describing a person by use of the first and last name. For two types to\
    \ be compatible in JavaScript, you have to ensure that their internal is also\
    \ compatible. With this, we will be able to implement an interface just by use\
    \ of the shape which is needed by the interface, and we will not need to use an\
    \ explicit `implements` clause.\n\n# Chapter 5- Arrow Function Expressions\n\n\
    For one to understand the scope of the keyword `this`, it is a challenging practice.\
    \ TypeScript supports the use of arrow functions and expressions so as to make\
    \ this a bit easier for you. This is just a new feature which has been introduced\
    \ in ES6 for the first time. In arrow functions, the value for keyword `this`\
    \ is preserved, and this becomes easy for us to write and use callbacks. Consider\
    \ the sample code given below:\n\n```javascript\nvar objectShape = {\n    name:\
    \ \"rectangle\",\n    popup: function() {\n        console.log('The inside popup():\
    \ ' + this.name);\n        setTimeout(function() {\n            console.log('The\
    \ inside popup(): ' + this.name);\n            console.log(\"The shape is \" +\
    \ this.name + \"!\");\n        }, 3000);\n    }\n};\n\nobjectShape.popup();\n\
    ```\n\nThe object `this` will be empty, and this will be depicted clearly on the\
    \ console. The reason behind the above code functioning is that referencing to\
    \ the object `this` will be captured from outside our function body. The above\
    \ code is similar to the JavaScript code given below:\n\n```javascript\nvar objectShape\
    \ = {\n    name: \"rectangle\",\n    popup: function() {\n        console.log('The\
    \ inside popup(): ' + this.name);\n        setTimeout(function() {\n         \
    \   console.log('The inside popup(): ' + this.name);\n            console.log(\"\
    The shape is \" + this.name + \"!\");\n        }, 3000);\n    }\n};\n\nobjectShape.popup();\n\
    ```\n\nThe TypeScript arrow function can be used for the purpose of fixing this\
    \ problem. You have to replace `function()` with `() =>`. This is shown in the\
    \ code below:\n\n```javascript\nvar objectShape = {\n    name: \"rectangle\",\n\
    \    popup: function() {\n        console.log('The inside popup(): ' + this.name);\n\
    \        setTimeout(() => {\n            console.log('The inside popup(): ' +\
    \ this.name);\n            console.log(\"The shape is \" + this.name + \"!\");\n\
    \        }, 3000);\n    }\n};\n\nobjectShape.popup();\n```\n\nYou can then look\
    \ at the JavaScript file which is generated. You will observe that the compiler\
    \ has injected a new variable, which is `_this = this;`, and this will be used\
    \ in the callback `setTimeout()`. Consider the pure JavaScript class given below:\n\
    \n```javascript\nfunction Person(age) {\n    this.age = age;\n    this.becomeOld\
    \ = function() {\n        this.age++;\n    }\n}\n\nvar person = new Person(1);\n\
    \nsetTimeout(person.becomeOld,1000);\n\nsetTimeout(function() { console.log(person.age);\
    \ },2000); // the 1 should have been set to 2\n```\n\nOnce the above code has\
    \ been executed in the browser, the object `this` will point to `window` since\
    \ it will be the one used for executing the `becomeOld` function. This can only\
    \ be solved by executing the arrow function as shown below:\n\n```typescript\n\
    function Person(age) {\n    this.age = age;\n    this.becomeOld = () => {\n  \
    \      this.age++;\n    }\n}\n\nvar person = new Person(1);\n\nsetTimeout(person.becomeOld,1000);\n\
    \nsetTimeout(function() { console.log(person.age); },2000); // 2\n```\n\nThe reason\
    \ behind the above code functioning is that referencing to the object `this` will\
    \ be captured from outside our function body. The above code is similar to the\
    \ JavaScript code given below:\n\n```javascript\nfunction Person(age) {\n    this.age\
    \ = age;\n    var _this = this;  // capture the this\n}\n```\n"
