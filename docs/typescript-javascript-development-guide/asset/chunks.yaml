    \n## Disclaimer\nWhile all attempts have been made to verify the information provided\
    \ in this book, the author does assume any responsibility for errors, omissions,\
    \ or contrary interpretations of the subject matter contained within. The information\
    \ provided in this book is for educational and entertainment purposes only. The\
    \ reader is responsible for his or her own actions and the author does not accept\
    \ any responsibilities for any liabilities or damages, real or perceived, resulting\
    \ from the use of this information.\n\nThe trademarks that are used are without\
    \ any consent, and the publication of the trademark is without permission or backing\
    \ by the trademark owner. All trademarks and brands within this book are for clarifying\
    \ purposes only and are the owned by the owners themselves, not affiliated with\
    \ this document.\n\n# Introduction\nThere is a greater need for large software\
    \ applications, and especially the web applications. The reason behind this is\
    \ the increase in the functionalities which are needed to be implemented in software\
    \ applications. This calls for us to learn how to develop large applications.\
    \ This can only be done in programming languages which are capable of supporting\
    \ that. TypeScript is one of such programming languages. It supports the creation\
    \ of large applications. This book is an excellent way for you to learn how to\
    \ program in TypeScript. Enjoy reading!\n\n# Chapter 1- A Brief Overview of TypeScript\n\
    TypeScript is a programming language which was developed and is maintained by\
    \ Microsoft. It is an open source programming language. The language is a superset\
    \ of JavaScript since it has added some extra features to it, such as support\
    \ for object oriented programming and optional static typing. The language was\
    \ developed for the purpose of creating large applications, and it always compiles\
    \ into JavaScript. One can use TypeScript to develop JavaScript applications for\
    \ both the client side and server side. Since we have said that TypeScript is\
    \ a superset of JavaScript, any program written in JavaScript is also viable to\
    \ be considered a TypeScript program. The TypeScript compiler was also written\
    \ in TypeScript.\n\nThe aim of TypeScript is to provide developers with an easy\
    \ mechanism by which to develop large applications. It comes with concepts such\
    \ as classes, inheritance, interfaces, modules, and others, and these make it\
    \ easy for developers to create large applications with much ease.\n\n# Chapter\
    \ 2- Installing TypeScript\nThere are two ways that we can install TypeScript\
    \ into our system. These include the following:\n\n1. By use of the `npm` (Node\
    \ Package Manager) tool.\n2. By installation of Visual studio plugins for TypeScript.\n\
    \nFor Windows users, you can use the second option if it will be more convenient\
    \ for you. Just install the Visual Studio, and then download and install the necessary\
    \ plugin for programming in TypeScript. This option has been found to be a bit\
    \ superior compared to the use of other code editors.\n\nFor those using platforms\
    \ other than Windows, just ensure that you have a text editor, a browser, and\
    \ the `npm` package for TypeScript so as to be able to program in TypeScript.\
    \ The following steps can be followed for this to be done:\n\n1. Begin by installing\
    \ the Node Package Manager. Just open the terminal, and execute the following:\n\
    ```bash\ncurl -sL https://get.nodesource.com/setup_14.x | bash -\n```\n2. In the\
    \ next step, install TypeScript globally. The following commands can be used for\
    \ doing this:\n```bash\nnpm install -g typescript\n```\n\n## Hello World Example\n\
    Now that we have set up the environment ready, we can begin to program. We will\
    \ begin by creating an index file. Here is the code for the `index.html`:\n\n\
    ```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <title>This is TypeScript</title>\n</head>\n<body>\n  <script src=\"hello.ts\"\
    ></script>\n</body>\n</html>\n```\nAs shown in the above code, we have referenced\
    \ the code in the file `hello.ts`. This has been done in the line `<script src=\"\
    hello.ts\"></`. The extension `.ts` in the file name means that it is a TypeScript\
    \ file.\n\nNow, create a new file and give it the name `hello.ts`. The following\
    \ line of code should then be added to the file:\n```typescript\nalert('hello\
    \ world, this is TypeScript!');\n```\nAfter that, just launch the command line,\
    \ and then navigate to the folder with the file `hello.ts`. Compile the file by\
    \ executing the following command:\n```bash\ntsc hello.ts\n```\nThe `tsc` command\
    \ in TypeScript represents the TypeScript compiler, and it will generate a new\
    \ file with the name `hello.js`. From the extension in the file, we will have\
    \ transformed the TypeScript to a JavaScript file.\n\n# Chapter 3- Type Annotations\n\
    This feature is optional in TypeScript, and it allows us to express and implement\
    \ indentation in our TypeScript programs. We need to demonstrate this by creating\
    \ a program which will calculate the area of a rectangle. Just open your text\
    \ editor and create a new file with the name `area.ts`. Add the following code\
    \ to the file:\n\n```typescript\nfunction area(shape: string, width: number, height:\
    \ number) {\n  var area = width * height;\n  return \"The shape is \" + shape\
    \ + \" having an area of \" + area + \" cm squared.\";\n}\n\ndocument.body.innerHTML\
    \ = area(\"rectangle\", 20, 15);\n```\nNext, open the file `index.html` and change\
    \ the script source from `type.ts` to `area.ts`. Open your terminal, and then\
    \ execute the following command so as to compile the whole thing:\n```bash\ntsc\
    \ area.ts\n```\n"
