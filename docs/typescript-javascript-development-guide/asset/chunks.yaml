    \ as classes, inheritance, interfaces, modules, and others, and these make it\
    \ easy for developers to create large applications with much ease.\n\n# \n\nChapter\
    \ 2- Installing TypeScript\n\nThere are two ways that  we can install TypeScript\
    \ into our system. These include the following:\n\n1.  By use of the npm (Node\
    \ Package Manager) tool.\n\n2.  By installation of Visual studio plugins for TypeScript.\n\
    \nFor Windows users, you can use the second option if it will be more convenient\
    \ for you. Just install the Visual Studio, and then download and install the necessary\
    \ plugin for programming in TypeScript. This option has been found to be a bit\
    \ superior compared to the use of other code editors.\n\nFor those using platforms\
    \ other than Windows, just ensure that you have a text editor, a browser, and\
    \ the npm package for TypeScript so as to be able to program in TypeScript. The\
    \ following steps can be followed for this to be done:\n\n1.  Begin by installing\
    \ the Node Package Manager (npm).\n\nJust open the terminal, and execute the commands\
    \ given below:\n\n$ curl http://npmjs.org/install.sh | sh\n\n$ npm --version\n\
    \n1.1.70\n\n2.  In the next step, install the TypeScript npm package, and this\
    \ should be done globally on the command line. The following commands can be used\
    \ for doing this:\n\n$ npm install -g typescript\n\n$ npm view typescript version\n\
    \nnpm http GET https://registry.npmjs.org/typescript\n\nnpm http 304 https://registry.npmjs.org/typescript\n\
    \n0.8.1-1\n\nMake sure that you use the latest version of your browser, such as\
    \ Chrome. Any text editor is appropriate, and an example of this is the Sublime\
    \ text editor.\n\nHello World Example\n\nNow that we have set up the environment\
    \ ready for programming, we can begin to program. We will begin by creating the\
    \ Hello world example. Remember that TypeScript is a superset of ES5, and it has\
    \ more features for ES6\\. TypeScript is also compiled into JavaScript.\n\nWe\
    \ want to create our index file and then reference it to an external file. Here\
    \ is the code for the file “index.html”:\n\n<!doctype html>\n\n<html lang=\"en\"\
    >\n\n<head>\n\n  <meta charset=\"UTF-8\">\n\n  <title>This is TypeScript</title>\n\
    \n</head>\n\n<body>\n\n    <script src=\"hello.ts\"></script>\n\n</body>\n\n</html>\n\
    \nAs shown in the above code, we have referenced the code in the file to the file\
    \ “hello.ts.” This has been done in the line “<script src=\"hello.ts\"></script>”\
    \ as the script source. The extension “.ts” in the file name means that it is\
    \ a TypeScript file.\n\nNow, create a new file and give it the name “hello.ts.”\
    \ The following line of code should then be added to the file:\n\nalert('hello\
    \ world, this is TypeScript!');\n\nAfter that, just launch the command line, and\
    \ then navigate to the folder with the file “hello.ts.” Compile the file by executing\
    \ the following command:\n\ntsc hello.ts\n\nThe tsc command in TypeScript represents\
    \ the TypeScript compiler, and it will generate a new file with the name “hello.js.”\
    \ From the extension in the file, we will have transformed the TypeScript to a\
    \ JavaScript file, which is what normally happens in TypeScript.\n\n# \n\nChapter\
    \ 3- Type Annotations\n\nThis feature is optional in TypeScript, and it allows\
    \ us to express and implement indentation in our TypeScript programs. We need\
    \ to demonstrate this by creating a program which will calculate the area of a\
    \ rectangle. Just open your text editor and create a new file with the name “area.ts.”\
    \ Add the following code to the file:\n\nfunction area(shape: string, width: number,\
    \ height: number) {\n\n    var area = width * height;\n\n    return \"The shape\
    \ is \" + shape + \" having an area of \" + area + \" cm squared.\";\n\n}\n\n\
    document.body.innerHTML = area(\"rectangle\", 20, 15);\n\nNext, open the file\
    \ “index.html” and change the script source from “type.ts” to “area.ts.” Open\
    \ your terminal, and then execute the following command so as to compile the whole\
    \ thing:\n\ntsc area.ts"
