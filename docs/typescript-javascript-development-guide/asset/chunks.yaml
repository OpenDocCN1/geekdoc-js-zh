    \n## 目录\n- 引言\n- 第 1 章- TypeScript 概览\n- 第 2 章- 安装 TypeScript\n- 第 3 章- 类型注解\n\
    - 第 4 章- 接口\n- 第 5 章- 箭头函数表达式\n- 第 6 章- 类\n- 第 7 章- 解构赋值\n- 第 8 章- for...of\n\
