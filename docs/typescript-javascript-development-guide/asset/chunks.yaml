  trans: "\n\n展开运算符（spread operator）允许你将一个展开后的数组放入另一个数组中。考虑下面的示例，它演示了如何实现：\n\n```javascript\n\
    var list = [5, 6];\nlist = [...list, 7, 8];\nconsole.log(list); // [5,6,7,8]\n\
    ```\n\n# 第 12 章- 枚举 (Enums)\n\n枚举为我们提供了组织具有相关值的集合的方法。除了 JavaScript 外，其他编程语言都提供了枚举数据类型。TypeScript\
    \ 支持这一点。在 TypeScript 中，可以像下面所示声明枚举：\n\n```typescript\nenum Card {\n   Clubs,\n\
    \   Spades,\n   Diamonds,\n   Hearts\n}\n\n// 使用示例\nvar card = Card.Clubs;\n\n\
    // 安全性\ncard = \"It is not a member of the card suit\"; // Error : string is not\
    \ assignable to type `CardSuit`\n```\n\n## 枚举与数字\n\nTypeScript 中的枚举是基于数字的。这意味着我们可以为\
    \ TypeScript 中的枚举实例赋值，对任何与数字兼容的类型也是如此。下面的代码很好地描述了如何实现：\n\n```typescript\nenum\
    \ Color {\n   Red,\n   Green,\n   Blue\n}\n\nvar color = Color.Red;\ncolor = 0;\
    \ // 这相当于 Color.Red\n```\n\n## 枚举与字符串\n\n我们想知道枚举生成的 JavaScript 是什么样的。考虑下面的 TypeScript\
    \ 示例：\n\n```typescript\nenum MyEnum {\n   False,\n   True,\n   Unknown\n}\n```\n\
    \n从上述 TypeScript 代码将生成以下 JavaScript 代码：\n\n```javascript\nvar MyEnum;\n(function\
    \ (MyEnum) {\n   MyEnum [MyEnum [\"False\"] = 0] = \"False\";\n   MyEnum [MyEnum\
    \ [\"True\"] = 1] = \"True\";\n   MyEnum [MyEnum [\"Unknown\"] = 2] = \"Unknown\"\
    ;\n})( MyEnum || (MyEnum = {}));\n```\n\n变量 `MyEnum` 可以将字符串版本的枚举转换为数字，或者转换为数字版本的枚举。下面的代码很好地描述了这一点：\n\
    \n```typescript\nenum MyEnum {\n   False,\n   True,\n   Unknown\n}\n\nconsole.log(MyEnum\
    \ [0]); // \"False\"\nconsole.log(MyEnum [\"False\"]); // 0\nconsole.log(MyEnum\
    \ [MyEnum.False]); // \"False\" 因为 `MyEnum.False == 0`\n```\n\n我们也可以更改与枚举关联的数字。默认设置是枚举为\
    \ 0，随后的每个增量自动以 1 的间隔进行。考虑下面的代码，它很好地描述了这一点：\n\n```typescript\nenum Color {\n  \
    \ Red,      // 0\n   Green,  // 1\n   Blue      // 2\n}\n```\n\n可以通过特定赋值自动更改特定枚举关联的数字。示例演示了如何实现，我们从\
    \ 3 开始，然后像下面所示递增：\n\n```typescript\nenum Color {\n   LightRed = 3,  // 3\n   DarkGreen,\
    \    // 4\n   LightBlue      // 5\n}\n```\n\n你还必须知道枚举是开放结尾的。考虑下面由枚举生成的 JavaScript\
    \ 代码：\n\n```javascript\nvar MyEnum;\n(function (MyEnum) {\n   MyEnum [MyEnum [\"\
    False\"] = 0] = \"False\";\n   MyEnum [MyEnum [\"True\"] = 1] = \"True\";\n  \
    \ MyEnum [MyEnum [\"Unknown\"] = 2] = \"Unknown\";\n})( MyEnum || (MyEnum = {}));\n\
    ```\n\n枚举定义可以跨越多个文件。考虑下面的示例，其中我们展开了 `Color` 的定义以获取两个块：\n\n```typescript\nenum\
    \ Color {\n   Red,\n   Green,\n   Blue\n}\n\nenum Color {\n   LightRed = 3,\n\
    \   DarkGreen,\n   LightBlue\n}\n```\n\n## 枚举作为标志 (Flags)\n\n标志为我们提供了使用枚举的卓越能力。考虑下面的示例：\n\
    \n```typescript\nenum Animal {\n   None            = 0,\n   Flying          =\
    \ 1 << 1,\n   ConsumesFish    = 1 << 2,\n   Endangered      = 1 << 3\n}\n```\n\
    \n（在上述情况下，我们需要通过移动 1 来获取位运算符。考虑接下来的示例：\n\n```typescript\nenum Animal {\n   None\
    \            = 0,\n   PossesClaws      = 1 << 0,\n   Flies           = 1 << 1,\n\
    }\n\nfunction printAbilities(animal) {\n   var animFlags = animal.flags;\n   if\
    \ (animFlags & Animal.PossesClaws) {\n      console.log('The animal has claws');\n\
    \   }\n   if (animFlags & Animal.Flies) {\n      console.log('The animal can fly');\n\
    \   }\n   if (animFlags == Animal.None) {\n      console.log('nothing');\n   }\n\
    }\n\nvar animal = { flags: Animal.None };\nprintAbilities(animal); // nothing\n\
    animal.flags |= Animal.PossesClaws;\nprintAbilities(animal); // The animal has\
    \ claws\nanimal.flags &= ~Animal.PossesClaws;\nprintAbilities(animal); // nothing\n\
    animal.flags |= Animal.Flies;\nprintAbilities(animal); // The animal has claws\
    \ and the animal flies```\n\n标志可以用于在定义中创建快捷方式。如下代码所示：\n\n```typescript\nenum Animal\
    \ {\n   None            = 0,\n   PossesClaws      = 1 << 0,\n   Flies        \
    \   = 1 << 1,\n   EatsFish        = 1 << 2,\n   Endangered      = 1 << 3\n}\n\
    var EndangeredFlies = PossesClaws | Flies\n```\n\n## 常量枚举 (Const Enums)\n\n假设你定义了如下枚举：\n\
    \n```typescript\nenum MyEnum {\n   False,\n   True,\n   Unknown\n}\nvar lie =\
    \ MyEnum.False;\n```\n\n为了提高性能，你必须将枚举标记为 `const enum`。如下所示：\n\n```typescript\n\
    const enum MyEnum {\n   False,\n   True,\n   Unknown\n}\nvar lie = MyEnum.False;\n\
    ```\n\n上述代码编译后将得到以下 JavaScript 代码：\n\n```javascript\nvar lie = 0;\n```\n\n编译器会内联任何使用的枚举。此外，枚举定义不会生成\
    \ JavaScript，因为这些用法将被内联。\n\n# 第 13 章- let\n\n在 JavaScript 中，变量是函数作用域的。Java 和 C#\
    \ 等其他编程语言并非如此，它们是块作用域的。考虑下面的 JavaScript 代码：\n\n```javascript\nvar myVar = 123;\n\
    if (true) {\n   var myVar = 500;\n}\nconsole.log(myVar); // 500\n```\n\n尽管你期望上面的代码输出\
    \ 123，但它会输出 500。这是因为我们的变量 `myVar` 在 `if` 块内外是同一个。这是 JavaScript 中常见的错误来源之一。在 TypeScript\
    \ 中，引入了 `let` 关键字以允许程序员定义具有真实块作用域的变量。这意味着如果你使用 `let` 而不是 `var` 来定义定义变量，它在作用域外的可见和使用方式将不同。之前的示例可以使用\
    \ `let` 关键字编写：\n\n```javascript\nlet myVar = 123;\nif (true) {\n   let myVar =\
    \ 500;\n}\nconsole.log(myVar); // 123\n```\n\n考虑下面的示例，它展示如何在循环中使用 `let` 关键字：\n\
    \n```javascript\nvar index = 0;\nvar myArray = [1, 2, 3];\nfor (var index = 0;\
    \ index < myArray.length; index++) {\n   console.log(myArray[index]);\n}\nconsole.log(index);\
    \ // 0\n```\n\n将其替换为 `let` 关键字将帮助你避免循环错误。如下所示：\n\n```javascript\nvar index = 0;\n\
    var myArray = [1, 2, 3];\nfor (let index = 0; index < myArray.length; index++)\
    \ {\n   console.log(myArray[index]);\n}\nconsole.log(index); // 0\n```\n\n如上所示，尽可能使用\
    \ `let` 关键字总是是好的，你将避开许多意外和错误。\n\n函数也用于创建新的作用域。我们需要演示如何在 JavaScript 中使用函数来创建新的变量作用域。考虑下面的代码：\n\
    \n```javascript\nvar myVar = 123;\nfunction testFunction() {\n   var myVar = 500;\n\
    }\ntestFunction();\nconsole.log(myVar); // 123\n```\n\n## 生成的 JS\n\nTypeScript\
    \ 生成的 JS 代码中如果环境中存在相似名称，很容易重命名 `let` 变量。考虑下面的代码，它展示了将 `var` 简单替换为 `let`。代码如下：\n\
    \n```javascript\nif (true) {\n   let myVar = 123;\n}\n```\n\n// 将变为 //\n\n```javascript\n\
    if (true) {\n   var myVar = 123;\n}\n```\n\n"
- fmt: "\nHowever, if the name of the variable has readily been taken by the surrounding\
    \ scope, then a new variable name will be generated as shown in the code given\
    \ below:\n\n```javascript\nvar myVar = '123';\n\nif (true) {\n    let myVar =\
    \ 123;\n}\n\n// will become //\n\nvar myVar = '123';\n\nif (true) {\n    var _myVar\
    \ = 123; // It has been Renamed\n}\n```\n\n### In Closures\n\nConsider the simple\
    \ JavaScript code given below:\n\n```javascript\nvar functions = [];\n\n// creating\
    \ a bunch of functions\nfor (var j = 0; j < 3; j++) {\n    functions.push(function()\
    \ {\n        console.log(j);\n    })\n}\n\n// call them\nfor (var k = 0; k < 3;\
    \ k++) {\n    functions[k]();\n}\n```\n\nIn most interview questions, you are\
    \ asked about the log in the above JavaScript file. Although most people expect\
    \ the answer to be 0, 2, 3, but the real answer is 3. The reason is that the three\
    \ functions are making use of the variable `j` from our outer scope, and we will\
    \ in turn execute them the value of the variable `j` will be 3. It will form the\
    \ termination condition for our first loop.\n\nThe solution to this problem is\
    \ creation of a variable for each variable, and this should be specifically used\
    \ for iteration in that loop. As you are aware, a new scope for a variable can\
    \ be created by creation of a new function and then executing it immediately.\
    \ This is shown in the code given below:\n\n```javascript\nvar functions = [];\n\
    \n// creating a bunch of functions\nfor (var j = 0; j < 3; j++) {\n    (function()\
    \ {\n        var local = j;\n        functions.push(function() {\n           \
    \ console.log(local);\n        })\n    })();\n}\n\n// calling them\nfor (var k\
    \ = 0; k < 3; k++) {\n    funcs[k]();\n}\n```\n\nOnce you use the `let` keyword\
    \ rather than the `var` keyword, a variable which is unique to each loop iteration\
    \ is created.\n\n### Conclusion\n\nWe have come to the conclusion of this guide.\
    \ TypeScript is a programming language which always compiles into JavaScript.\
    \ The language is open source, and it was developed and maintained by Microsoft.\
    \ It is good for the development of large applications in which features such\
    \ as static typing and object oriented programming are supported. These two features\
    \ are the main ones which suit it for use to develop large applications.\n\nThe\
    \ language supports type annotations which are very good for maintaining the indentations\
    \ in a program. Indentations usually ensure that a program is well readable. You\
    \ have to remember that TypeScript is a superset of JavaScript, meaning that any\
    \ JavaScript code is also a TypeScript code. This is the reason why TypeScript\
    \ always compiles into JavaScript. For you to begin programming in TypeScript,\
    \ you have to first get the environment ready for doing that. For Windows users,\
    \ you just have to simply install the Visual Studio and then download and install\
    \ the necessary plugin, and you will be set to get programming.\n\nIf you are\
    \ using any other platform, then you have to rely on the Node package named `npm`.\
    \ Ensure that you have a text editor and a browser. Once you have installed the\
    \ npm package for TypeScript, you can go ahead and begin to write your TypeScript\
    \ programs.\n"
