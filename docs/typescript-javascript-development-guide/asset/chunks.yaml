    \ constructor() {\n        MyClass.instances++;\n    }\n}\n\nvar s1 = new MyClass();\n\
    var s2 = new MyClass();\n\nconsole.log(MyClass.instances); // 2\n```\n\n"
- fmt: "\nIn TypeScript, access modifiers are supported and these govern how variables\
    \ can be accessed. A variable can be outside a class directly by its instances,\
    \ or it may be accessible in the child classes. The following are the three types\
    \ of access modifiers:\n\n1. `public`: available on the instances everywhere.\n\
    2. `private`: not available for access outside class.\n3. `protected`: available\
    \ on the child classes, but not on the instances directly.\n\nYou should be aware\
    \ that it will have no great impact on your programs, but if you try to access\
    \ them during runtime, they will give you some errors. Consider the example given\
    \ below, which shows how this can be done:\n\n```typescript\nclass ClassBase {\n\
    \   public a: number;\n   private b: number;\n   protected c: number;\n}\n\n//\
    \ EFFECT ON the INSTANCES\nvar myVar = new ClassBase();\nfoo.a; // okay\nfoo.b;\
    \ // ERROR : private\nfoo.c; // ERROR : protected\n\n// EFFECT ON THE CHILD CLASSES\n\
    class ClassChild extends ClassBase {\n   constructor() {\n      super();\n   \
    \   this.a; // okay\n      this.b; // ERROR: private\n      this.c; // okay\n\
    \   }\n}\n```\n\nAs you are aware, the above modifiers will work for both member\
    \ properties and the member functions.\n\n### Define using constructor\n\nA member\
    \ in a class can be initialized as shown below:\n\n```typescript\nclass MyClass\
    \ {\n   x: number;\n   constructor(x:number) {\n      this.x = x;\n   }\n}\n```\n\
    \nThis is a very common scenario in TypeScript, and one can simply prefix the\
    \ member using an access modifier and this will be declared automatically in the\
    \ class and then copied from your constructor. With this, our previous example\
    \ can be written as shown below:\n\n```typescript\nclass MyClass {\n   constructor(public\
    \ x:number) {\n   }\n}\n```\n\n### Property initializer\n\nThis is a very important\
    \ feature which is supported in TypeScript. It is possible for you to initialize\
    \ any member of the class outside the constructor, and it is good for providing\
    \ a default value. Consider the example given below:\n\n```typescript\nclass MyClass\
    \ {\n   members = [];  // Initializing directly\n   add(x) {\n      this.members.push(x);\n\
    \   }\n}\n```\n\n### Rest Parameters\n\nThis feature allows one to accept multiple\
    \ parameters in a function, and then get these as an array. This can be denoted\
    \ as shown in the example given below:\n\n```typescript\nfunction allFunction(first,\
    \ second, ...rest) {\n   console.log(rest);\n}\n\nallFunction ('sample', 'bar');\
    \ // []\nallFunction ('sample', 'bar', 'bas', 'qux'); // ['bas','qux']\n```\n\n\
    # Chapter 7- Destructuring\n\nDestructuring means breaking up the structure. The\
    \ following types of destructuring are supported in TypeScript:\n\n1. Object Destructuring\n\
    2. Array Destructuring\n\nTo make it easy, see destructuring as the inverse of\
    \ structuring. The example given below shows how structuring can be done in JavaScript:\n\
    \n```javascript\nvar myVar = {\n   bar: {\n      bas: 789\n   }\n};\n```\n\nWith\
    \ the support for structuring in JavaScript, the process of creating new objects\
    \ would have been a bit tough. With destructuring, we get the same level of convenience\
    \ to obtaining data out of a particular source.\n\n### Object Destructuring\n\n\
    With destructuring, one can do much work which could have taken lines in just\
    \ a single line. Consider the example given below:\n\n```javascript\nvar rectangle\
    \ = { a: 0, b: 10, width: 20, height: 30 };\n// Destructuring the assignment\n\
    var {a, b, width, height} = rectangle;\nconsole.log(a, b, width, height);\n```\n\
    \nIf we were not to use destructing, the `a`, `b`, `width`, and `height` would\
    \ have been picked separately from the `rectangle`. Deep data can also be obtained\
    \ from a structure by use of destruction. The following code best illustrates\
    \ how this can be done:\n\n```javascript\nvar foo = { bar: { bas: 123 } };\nvar\
    \ {bar: {bas}} = foo; // Effectively `var bas = foo.bar.bas;`\n```\n\n### Array\
    \ Destructuring\n\n`const` is a new addition which is now offered in TypeScript\
    \ and ES6. With it, one can be immutable with variables. This serves a good purpose\
    \ in runtime and for documentation. For you to use it, you just have to replace\
    \ the keyword `var` with `const`. This is best demonstrated below:\n\n```typescript\n\
    const myConst = 123;\n```\n\nIn TypeScript, use of `const` is easy compared to\
    \ what happens in other programming languages. It helps us to avoid magic literals,\
    \ and it is a good practice for improving readability and maintainability. Consider\
    \ the code given below:\n\n```typescript\n// Low readability\nif (a > 10) {\n\
    }\n\n// This one is Better!\nconst maximumRows = 10;\nif (a > maximumRows) {\n\
    }\n```\n\nInitialization of `const` declarations has to be done. In TypeScript,\
    \ use of `const` is easy compared to what happens in other programming languages.\
    \ It helps us to avoid magic literals, and it is a good practice for improving\
    \ readability and maintainability. Consider the code given below:\n\n```typescript\n\
    // Low readability\nif (a > 10) {\n}\n\n// This one is Better!\nconst maximumRows\
    \ = 10;\nif (a > maximumRows) {\n}\n```\n\nWait, let me re-process the provided\
    \ text carefully to ensure no parts are missed and all rules are applied correctly\
