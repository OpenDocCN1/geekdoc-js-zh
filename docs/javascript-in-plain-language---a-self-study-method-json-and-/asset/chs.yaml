  \nJSON 是一个必须了解的话题，因为你迟早会用到它，但在我们在第五部分涵盖的内容中不需要它。\n\n希望你的这段时间收获颇丰，我非常感谢你对这些材料的投入和信任。\n\
  \n[Tony de Araujo](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\n\n## 4.1\
  \ 关于本节\n\n我们已经涵盖了 JavaScript 的很多领域，还有很多内容可以写。然而，一次性全部写完并不是一个好主意，因为这会降低效率并违背初衷。这就是为什么我将\
  \ JavaScript 分成了几个不同的小册：给读者时间来消化每个出版物中涵盖的所有数据。持续的练习、重复以及有意识的扩展似乎是更好的方法。\n\n[JavaScript\
  \ Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
  \ 详细地介绍了每个 JavaScript 库方法，并提供了更高级的概念练习。如果你完成了到目前为止的所有练习，你应该已经完全准备好应对另一卷书了。\n\n另一个非常流行且廉价的练习用电子书是\
  \ [Draw Six Lucky Numbers](http://www.amazon.com/Small-Projects-Learn-JavaScript-Mastering-ebook/dp/B00H4P987A/)，它涵盖了循环、随机数并复习了函数和数组。这是一个适合周日下午完成的快速项目。\n\
  \n**现在我们到了一个十字路口。**\n\n这本书的剩余部分将介绍两个每个 JavaScript 中高级高级程序员都应该掌握的热门技术：\n\n**JSON**\
  \ （**J**avaScript **O**bject **N**otation）是一种数据格式化方法，使其独立于机器。这种格式在许多方面正在取代 XML，并被用于现代\
  \ Web 编程。从某种意义上说，我从书开头就开始介绍它，所以这些材料对你来说应该熟悉，因此这部分将会很短。\n\n最后一个涵盖区域关于 Google 的框架库\
  \ `AngularJS`，它是基于 JavaScript 的。\n\n这个库正在改变我们构建网站的方式，尽管仍处于婴儿阶段，但它已经产生了持久的影响，当你学习它时就会发现原因。当你完成接几章节后，你将以简单且全面的方式将动态数据实现到基础网页中。\n\
  \n请记住，我只是介绍了 `AngularJS`，这并不是一本关于它的完整书籍，因为这个主题跨越了几卷。我希望通过编写这些材料，赋予你进一步研究 `AngularJS`\
  \ 的能力。这些信息将解锁我认为的进入 JSJS 最困难的部分——即第一步。通过所给出的练习和解释，你应该能够轻松克服这第一个障碍。\n\n## 4.2 JSON\
  \ 简介\n\nJavaScript 对象表示法，`JSON`（读作 J SON）是一种开放标准格式，它使用人类可读的文本来传输由键值对（JavaScript\
  \ 对象）组成的数据对象。在传输服务器和 Web 之间的数据方面，它已成为 XML 的替代技术。“替代”一词可能已经过时了，因为现在 JSON 是 Web 服务的首选方法。\n\
  \n我在此处引入 JSON 是因为在写作期间，如果人们想构建现代 Web 页面和 Web 应用，JSON 已成为必须掌握的 JavaScript 子集。它现在应该是任何\
  \ Web 素养课程的一部分。\n\n`JSON` 如此受欢迎，以至于其他语言现在都在自己的词汇中实现它。\n\n好消息是，在整本书中你已经为这项技术做了准备，这只是意识到它的存在的问题。\n\
  \nJSON 格式在语法上与我们创建列表相同，无论是作为数组的数值，还是像对象那样的键值对。我们还可以结合两种格式来创建更复杂的 JSON 数据结构。\n\n\
  以下是用 JSON 格式编写的数据集：\n\n```json\n{\n  \"firstName\": \"Tony\",\n  \"lastName\": \"\
  deAraujo\",\n  \"age\": 99\n}\n```\n\n或者我们也可以有一个数组：\n\n```json\n[1, \"hello\", 33]\n\
  ```\n\n**请注意：** 如果你计划将数组转换为 JSON 格式，请避免使用混合数组数据类型，比如我刚刚展示给你的数组。这是因为 JSON 应该是一种**语言中立**的数据交换协议，许多编程语言不允许混合数组（即包含混合值类型的数组），这会导致混淆。以下内容是可以的，因为数字被视为字符串（对比我之前的示例）：\n\
  \n```json\n[\"1\", \"hello\", \"33\"]\n```\n\n回到我们上面的第一个例子，注意对 JSON 对象或数组没有变量赋值。对象的\
  \ JSON 部分是能够被无缝导出到其他系统中的部分。\n\n在以 JSON 格式编写内容时，我们必须用双引号将键（key）括起来。由于我们从一开始就使用双引号，我们应该不会遇到这个问题。\n\
  \n如果键没有用双引号括，JSON 将抛出错误。单引号不起作用。\n\n\n\n此外，这些数据结构都没有以分号结尾。这不是变量赋值。JSON 数据在目的地被赋值给一个变量，以便我们对数据进行操作，但数据本身导出时是不带变量的。包裹整个数据结构的最外层标签必须是大括号，就像对象格式一样。\n\
  \n在更复杂的设计中，你可能会看到对象数组。数组非常适合收集属于特定标准的一组对象：\n\n![](img/00018.jpeg)\n\n图 18（注意：缺少外层大括号和数组的键。请见下文解释。）\n\
  \n这是可以在机器之间进行传输的数据。然而，**这还不是一个有效的 JSON 对象**，像这样使用可能会导致传输不安全。它需要外层大括号和一个用于数组的键名，才能成为一个良好的\
  \ JSON 数据格式，正如我们在下一张图片中所看到的。\n\n通过这种编写方式（加上外层大括号），我们可以将其输入任何能够将 JSON 数据转换为其自身格式的机器中，就像\
  \ XML 一样，只不过 JSON 的实现更简单。\n\n一段时间以来，网页一直通过交换 JSON 数据与服务器进行通信。我的意思是页面在你的浏览器中加载，每当你点击动态字段时，页面保持不变，但数据通过\
  \ JSON 数据格式交换进行更新。这就是为什么意识到这项技术是必须的理由之一。\n\n*   **记住：** JSON 格式的文本在语法上也是合法的 JavaScript\
  \ 代码。然而，反过来或者另一种情况可能并不成立。这就是为什么，当我们之前学习创建对象时，我选择将键括在双引号中，使其成为 JavaScript 和 JSON\
  \ 的合法语法。\n\n下一张图片将显示一个更详细的 JSON 对象示例。你会看到外层对象被划分为两个键：`staff` 和 `management`。\n\n\
  这些键中的每一个 `staff/management` 都将拥有一个 `array` 作为值。数组将包含若干个对象形式的单独记录。每个对象代表员工层或管理层的一名员工。让我们看看图片：\n\
  \n![](img/00019.jpeg)\n\n图 19 查看[原始文件](http://icontemp.com/jpl/json1b.txt) | bit.ly/1uF1qNH\n\
  \n你看到它是做的了吗？有两个属性：`staff` 和 `management`。\n\n在我们的示例中，属性 `staff` 包含分配给它的人的 `array`，并且每个人都是一个带有自身数据的对象。目前我们只有\
  \ \"Tony\" 作为员工，只有 \"Judy\" 作为管理人员，但我们可以在 \"Tony\" 或 \"Judy\" 的闭合括号后添加一个逗号，并在每个数组中添加另一个人，正如你在页面下方的图片看到的那样。\n\
  \n不要在这里困惑。创建 JSON 数据结构并不一定需要数组。我们可以在 JSON 结构中表示数组、字符串、数字和对象。每个标识符都需要括在双引号中，数字除外，引号是可选的。（之前提到的，如果数字包含在数组中，始终对数字加双引号，以符合禁止混合数组的编程语言）。\n\
  \n### 使用 jsonlint，一个检查 JSON 校验的工具\n\n为了查看代码块在 JSON 语法上是否编写正确，我们可以使用一个名为 [jsonlint](http://jsonlint.com/)\
  \ (jsonlint.com) 的在线工具对其进行检查。该工具是避免错误或不安全的 JSON 数据脚本的一个重要检查。\n\n**练习题：**\n\n1- 从上一张图片中复制代码并将其粘贴到\
  \ `jsonlint` 的框中。然后点击 `validate`。如果一切都写得正确，你应该会在页面上看到一条绿色的条。\n\n2- 尝试删除一个括号、添加一个变量名或添加一个分号，看看它是否仍然通过校验。\n\
  \n### 将 JSON 对象赋值给变量\n\n现在，如果我们想在目的地接收数据后对其进行操作，我们需要将其赋值给一个变量。该变量将指向内存中的数据，以便我们对其进行引用。这就是\
  \ JavaScript 的用场：我们在 JSON 格式中移动数据，并在目的地如果我们想进一步处理数据，就会将数据赋值给变量。\n\n下一张扩展图片将显示我们如何为\
  \ JSON 对象分配一个 `variable`（变量）。\n\n**记住**，在编写代码时，如果你想用 [jsonlint](http://jsonlint.com/)\
  \ 验证你的 JSON 数据，你必须在将 JSON 数据赋值给变量之前以及在末尾添加分号结束语句之前进行。\n\n![](img/00020.jpeg)\n\n\
  图 20 查看[原始文件](http://icontemp.com/jpl/json1.txt) | bit.ly/1DwXd57.\n\n3- 在这一步，用更多数据扩展你自己的对象，或者从图片\
  \ 20 下方的原始文件中复制它。\n\n如果你正在编写自己的脚本并想用 `jsonlint` 验证它，请在添加变量（例如：`var employees =`）和最后的分号之前进行，然后将变量\
  \ `employees` 赋值给对象。\n\n现在我们已经将 JSON 对象赋值给变量 `employees`，我们可以对**编辑**、**添加**、**删除**和**显示**数据或部分数据，因为该对象有一个我们可以引用的\
  \ `name`（名称）。\n\n### 编辑 JSON 对象\n\n属性键 `staff` 被分配了一个 `array`。决定使用数组是为了我们可以包含多个对象作为\
  \ `staff` 的一部分。数组中的每人本身都是一个对象。键 `management` 也是如此。\n\n**练习题：**\n\n4- 如果你还没有这样做，复制原始文件并将其粘贴到\
  \ JavaScript 中。\n\n5- 我们如何引用 `staff` 以获取成员列表？\n\n我们可以以以下方式使用点语法：\n\n```\nemployees.staff\n\
  ```\n这将给出员工列表。控制台可能会显示对象的简短版本，如下：\n\n```\nobject\n```\n\n这将得到每个对象的列表。查看下方图片查看控制台的输出。\n\
  \n![](img/00021.jpeg)\n\n图 21\n\n注意：`proto` 属性是适用于该对象的库方法列表，它与 JSON 无关且不可移植。我们在[第\
  \ 2 卷](https://www.amazon.com/JavaScript-Objects-Functions/dp/B00GDEPB/)书中涵盖了这些库方法。\n\
  \n6- 我们如何引用 `staff` 数组中的第一个对象？\n\n```\nemployees.staff[0];\n```\n解释：\n\n我们从外部对象\
  \ `employees` 开始，然后引用它的 `staff` 成员。然后，由于 `staff` 持有对象数组，我们引用位于零处的第一个元素，结果如下：\n\n\
  *Object {firstName: \"Tony\", lastName: \"deAraujo\", age: 99}*\n\n7- 现在尝试引用 `staff`\
  \ 数组中包含 `Mary` 的对象。她是 staff 数组的第三个元素，对应位置 2。\n\n在此处查看结果：[原始文件](http://icontemp.com/jpl/json2.txt)\
  \ | bit.ly/1sWuXAy。\n\n8- 我们如何向 `staff` 类添加一个新员工？\n\n这是我们需要添加的新员工：\n\n\"firstName\"\
  :\"Loren\", \"lastName\":\"Santos\", \"age\":29\n\n由于 Loren 是一个需要添加到数组的对象，我们可以使用数组方法\
  \ `push()` 将其推入 staff：（参见[原始文件](http://icontemp.com/jpl/json3.txt) | bit.ly/1wKTPPB\
  \ )。\n\n```\nemployees.staff.push({\"firstName\":\"Loren\", \"lastName\":\"Santos\"\
  , \"age\":29});\n```\n\n9- 尝试向 employees `management` 添加新成员，例如：\n\n\"firstName\"\
  :\"Peter\", \"lastName\":\"Jones\", \"age\":55\n\n完成后，尝试在其分配给 management 的数组中的位置引用这个新成员。\n\
  \n查看：[原始文件](http://icontemp.com/jpl/json4.txt) | bit.ly/1tXHoQM\n\n10- 调用 `employees`\
  \ 属性查看它包含什么：\n\n![](img/00022.jpeg)\n\n\n\n\n太棒了！现在让我们来看两种处理 JSON 数据结构的有用方法。\n\n\
  ### JSON 库方法\n\nJavaScript 有两个函数可以将普通的 JavaScript 对象解析为 JSON 格式，或者反之亦然。一旦数据转换为 JSON\
  \ 格式，我们就可以将数据发送到全球其他地方的机器。\n\n让我们看看它们基本上是如何工作的。\n\n## JSON.stringify\n\n`stringify`\
  \ 函数通过删除空白字符并将其转换为字符串来压缩对象，以便其导出。\n\n以我们之前的对象 `employees`（如图 20 所示）为例，我们可以这样对其进行字符串化：\n\
  \n```javascript\nvar myString = JSON.stringify(employees);\n```\n\n我将结果赋值给变量 `myString`（任何名称均可），它现在是一个字符串变量，包含以下数据：\n\
  \n\"{\"staff\":[{\"firstName\":\"Tony\",\"lastName\":\"deAraujo\",\"age\":99},{\"\
  firstName\":\"John\",\"lastName\":\"Smith\",\"age\":33},{\"firstName\":\"Mary\"\
  ,\"lastName\":\"Adams\",\"age\":29}],\"management\":[{\"firstName\":\"Judy\",\"\
  lastName\":\"Garland\",\"age\":43}]}\"\n\n现在这段数据字符串已准备好通过 `http` 或任何其他方法发送到不同的位置或机器。任何具有解码\
  \ JSON（转换为 JSON 或读取为 JSON）方法的编程语言都能使用这些数据。\n\n**注意(1)：** 如果你想用 JSONLINT.com 验证这些数据，你需要排除变量名和外层引号。\n\
  \n**注意(2)：** 使用 `stringify` 时，原始对象内部的函数（方法）不会被包含在内。这是故意为之。被字符串化的数据只有包裹在引号中的字符串键/值对（以及数字）。\n\
  \n**注意(3)：** 有方法可以防止 JSON 压缩数据。该实现将在几页后介绍 `stringify` 的第三个参数时进行讨论。\n\n## 使用第二个参数作为\
  \ stringify 的过滤器\n\n注意：如果目前这些信息量太大，请只需阅读它、理解它、记住它，并在你想重新回顾该主题时回来。\n\n`stringify`\
  \ 方法可以接受第二个参数，用于**过滤**掉除了我们在 `stringify` 期间想要包含之外的所有内容。第二个参数可以是一个数组，也可以是一个函数，取决于我们尝试实现的目标。\n\
  \n### (a) 使用数组作为过滤器时\n\n当我们使用数组作为第二个参数时，我们可以挑选我们想要字符串化的数据。\n\n一如既往，第一个参数是正在使用的对象名称。当第二个参数是数组时，JavaScript\
  \ 仅字符串化该数组提供的键/值。该数组充当了包含性过滤器。\n\n例如，我想只字符串化 `staff` 数组，并且只取每个员工的 own：\n\n```javascript\n\
  var someString = JSON.stringify(employees, [\"staff\", \"firstName\"]);\n```\n\n\
  JavaScript 捕获了 `staff` 并获取它的 `firstName` 属性。此序列化的结果如下：\n\n\"\\\"{\"staff\":[{\"\
  firstName\":\"Tony\"},{\"firstName\":\"John\"},{\"firstName\":\"Mary\"}]}\\\"\n\n\
  这是另一个示例，`age` 也包含在内（但不包含 `lastName`）：\n\n```javascript\nvar someString = JSON.stringify(employees,\
  \ [\"staff\", \"firstName\", \"age\"]);\n```\n\n如果我们想同时获取 `staff` 和 `management`\
  \ 的名字呢？\n\n```javascript\nvar someString = JSON.stringify(employees, [\"staff\"\
  , \"management\", \"firstName\"]);\n```\n\n其结果为：\n\n\"\\\"{\"staff\":[{\"firstName\"\
  :\"Tony\"},{\"firstName\":\"John\"},{\"firstName\":\"Mary\"}],\"management\":[{\"\
  firstName\":\"Judy\"}]}\\}\\\"\n\n注意：如果你尝试用原始格式在 [jsonlint](http://jsonlint.com/)\
  \ 上验证此结果，它将失败。原因是我们需要剥离外层引号（使整个脚本成为字符串的引号）。一旦你删除了外层引号，你将获得 jsonlint 的绿灯。有一种方法可以将此字符串转换回对象。该方法将在下一章讨论。\n\
  \n**自己尝试一下这个：**\n\n如果你想练习一下，尝试对 `staff` 和 `management` 进行字符串化，但只取每个员工的姓和年龄。使用你喜欢的变量名。\n\
  \n### (b) 使用函数作为过滤器时\n\n到目前，我们一直使用数组作为 `stringify` 的第二个参数。这允许我们挑选想要包含在字符串化中的元素。\n\
  \n使用函数作为第二个参数时，我们可以执行相反的操作，**排除元素**，或者修改某些元素的表示方式。\n\n该函数在输入参数中接收两个参数。第一个参数是 `key`，第二个参数是\
  \ `value`。这两个映射参数将代表 JSON 对象的每个键和每个值。换句话说，因为我们在处理之前捕获了每个键和每个值进行评估，我们可以在函数体中编写处理特定键和特定值的脚本，因为函数会扫描每个键和每个值（见下图）。\n\
  \n至于参数名称，你如何称它们并不重要，重要的是它们的位置，位置必须是 (key, value)。你可以称它们为 `(k,v)` 或 `(x,y)` 或其他任何。\n\
  \n例如，下面的图像使用函数 `filter` 从字符串化中排除 `age`：\n\n![](img/00023.jpeg)\n\n图 22 查看[原始文件](http://icontemp.com/jpl/json4b.txt)\
  \ 1v71zu。\n\n这里发生的情况是 `undefined` 值不会被包含在 JSON 文件中，因为在 JSON 中，undefined 表示空键/值对，所以\
  \ `age` 将被包含。（注：原文说“不会被包含”，但逻辑意味着排除）。\n\n首先，注意我们在没有第二个参数的情况下让 JavaScript 读取第三个参数：\n\
  \n*   我们将第二个参数设为 `null`。这是可以的，因为现在我们可以有第三个参数。\n\n其次，数字 `4` 是缩进空格的数字。没有添加行的规定，但 JavaScript\
  \ 在我们请求缩进时会自动添加行。最大数字是 10。\n\n你注意到原始文件中的第二个示例了吗？它显示的是*点*而不是*空格*。\n\n这是通过将第三个参数从数字替换为字符串实现的：\n\
  \n```javascript\nvar myString = JSON.stringify(employees, null, \"...\");\n```\n\
  \n最后一个在 *jsonlint* 上测试时将无法通过，但它用于说明 `stringify` 的第三个参数。\n\n## JSON.parse\n\n为了将字符串转换回我们之前的对象，我们使用\
  \ `JSON.parse` 方法。\n\n查看原始文件：[myString](http://icontemp.com/jpl/json6.txt) | 1rtZclU。\n\
  \n```javascript\nvar myEmployees = JSON.parse(myString);\n```\n\n变量 `myEmployees`\
  \ 现在是一个对象，与我们原始的 `employees` 对象具有的值。\n\n注意：如果解析的数据不是有效的 JSON，将得到错误。\n\n\n\n\n非数组对象的属性不保证以特定顺序进行字符串化（这很合理，因为键值对并不真正需要数值顺序）。在进行字符串化时，请不要依赖同一个对象内属性的顺序。\n\
  \n### 总结\n\n我希望这段对 JSON 的介绍能对你产生兴趣，并激励你开始自己的数据导入导出项目。\n\n这里是一些实用的链接：\n\n* [JSON.org](http://www.json.org/)，官方网站。\n\
  * [JSONLint](http://jsonlint.com/)，JSON 验证工具。\n* [维基百科](https://en.wikipedia.org/wiki/JSON)，独立的资源参考。\n\
  * [Mozilla 基金会](https://developer.mozilla.org/en-US/docs/Glossary/JSON)，一个非常好的术语表和资源中心。\n\
  * [JSON vs XML](http://www.json.org/xml.html) – 由 JSON.org 编写的这两种技术的对比。\n\n在继续之前，让我简要介绍另一种\
  \ JSON 真正能够大放异彩的技术：NoSQL。\n\n## 面向 JSON 数据的文档型数据库\n\n现代 Web 应用的数据需求是 MySQL 等关系型数据库可能难以满足的。一场巨大的变革正在发生，并颠覆着我们所知的数据库世界。今天，三个相互关联的趋势是：大数据、大用户和云计算——它们都在推动\
  \ NoSQL 技术的采用。\n\n### 什么是 NoSQL？\n\n“NoSQL 或 Not Only SQL 数据库提供了一种数据存储和检索机制，其建模方式是关系型数据库中使用的表格关系之外。”\n\
  \n[维基百科](http://en.wikipedia.org/wiki/NoSQL)。\n\n“Not only SQL”（不仅是 SQL）这一术是为了强调它们可能支持类似\
  \ SQL 的查询语言。\n\nNoSQL 越来越多地用于[实时 Web](http://en.wikipedia.org/wiki/Real-time_web)\
  \ 应用程序（例如：Facebook 的新闻动态和 Twitter）。\n\nNoSQL 是面向文档的数据库。与关系型数据库相比，数据集（collection）可以类比为，而文档（document）可以类比记录（文档可以封装并编码为\
  \ XML 或 JSON 等标准格式之一）。\n\n可以在这里找到 NoSQL 数据库列表：[nosql-database.org](http://nosql-database.org/)。\n\
  \n如果你想立即接触这项技术，一个很好的起点是下载 [CouchDB](http://couchdb.apache.org/)，它将数据存储为 JSON 并可以使用\
  \ JavaScript 进行查询。你可以在本地电脑上使用它并在那里学习其操作。CouchDB 是一个由 Apache 支持的开源项目。可以在这里找到基础课程：[指南](http://docs.couchdb.org/en/latest/intro/index.html)。\n\
  \n# 第五部分：击龙\n\n欢迎来到现代 DOM 脚本。\n\n2015 年 10 月\n\n## 5.3 迈向 AngularJS 的坚一步\n\n###\
  \ 简介\n\nAngularJS 是一个用于开发动态网页的框架。它由 Google 创建，旨在解决传统 Web 设计中的多个问题。与其他许多开发者一样，我认为\
  \ AngularJS 是目前最热门的技术以及 Web 设计的未来，而且由于 Google 的支持，会有大量的资源使其扎根。\n\n在某种意义上，AngularJS\
  \ 扩展了 HTML 属性，得益于 AngularJS 提供的库，赋予了它们超能力。该库通过链接连接到你的网页，就像你链接 CSS 或 JavaScript 文件一样。\n\
  \nHTML 是为静态页面设计的。而 AngularJS 就是 HTML 如果为现代应用设计时它本应有的样子。\n\n到此时，你真的需要了解基础 HTML 知识，因为我们将处理标准的\
  \ HTML 页面。你不需要成为专家，最基础的内容即可。如果你需要温习一下或从零开始学习，请访问 [Codecademy](https://www.codecademy.com/)。你有时会在那里看到我担任，特别是在他们的\
  \ JavaScript 练习中，但他们的 HTML 教程非常酷且免费！！\n\n感兴趣的链接（供以后参考）：\n\n[AngularJS.org](https://angularjs.org/)\
  \ | [维基百科](http://en.wikipedia.org/wiki/AngularJS) | [文档](https://docs.angularjs.org/api/ng/directive/ngCloak)。\n\
  \n在阅读他们的材料迷失方向之前，让我们先熟悉基础设置以及它能为尝试设计更动态网页的 Web 开发者提供什么。\n\n欢迎来到现代 Web 设计！\n\n###\
  \ 指令\n\nAngularJS 如何扩展 HTML 能力的？\n\n首先，我们在网页上提供指向 AngularJS 库的链接，就像我们链接 JavaScript\
  \ 或 CSS 文件一样。\n\n然后，页面就连接到了这些你可以使用的海量方法。\n\n假设我们想要对页面上的 DIV 而不是其他任何元素进行增强，例如，你想在网页上创建一个带有动态数据的框。\n\
  \n在链接到库之后，我们要做的只是对 `DIV` 应用一个 `directive`（指令）。指令是 `ng-app`，它让这个 `DIV` 变成由 AngularJS\
  \ 控制的应用程序。`ng-app` 指令告诉 AngularJS 这个 `DIV` 需要扫描可能的 AngularJS 功能。我们稍后来看它是如何工作的。\n\
  \n如果我们对整个页面进行扫描和映射，我们将相同的指令应用到 HTML 标签上，而不是应用到 `DIV`。实际上，任何可以作为容器的 HTML 标签都可以变成一个\
  \ Angular 增强元素，而不会影响页面的其他部分。我们可以使用段落标签、表单标签或有序列表。但在大多数情况下，AngularJS 是非常友好的，我们并不介意将其关联。\n\
  \n\n\n\n指令（Directive）是为现有标准语法引入新功能的机制。它扩展了语法的能力，就像是“教老狗学新花样”。通过将指令附加到现有的 HTML 标签上，该标签的行为将根据\
  \ Angular 库中以该指令命名的内容而发生改变。在某些情况下，指令指定全局行为，而在另一些情况下，它们只影响局部区域，例如一段代码块。\n\nAngularJS\
  \ 通过称为“指令”的结构向浏览器教授新语法。\n\n如果你以前构建过 Web 应用程序，Angular 将是一个完全全新的范式。如果你是 Web 设计的新手，AngularJS\
  \ 将教你现代化的最佳实践，你会认为自己很幸运，因为你不需要为了学习新知识而忘记旧知识。\n\n是的，起初是需要代价的，你会失去灵活性。但你换来的是一致性、开发速度以及在今天和明天都能运行的东西。你不再需要知道如何制造发动机来开车，但你了解得越多，就越能利用汽车提供的功能。AngularJS\
  \ 并不是一项容易学习的技术，但如果你已经读到了这本书的这里，说明你已经具备学习和掌握 AngularJS 的自律和技能。\n\n### ng-app 是什么意思？\n\
  \n它只是告诉浏览器使用 AngularJS 作为页面的根，或者作为 DIV 的根，这取决于我们插入 `ng-app` 标签的位置。通过这样，一切都将相对于 AngularJS，而\
  \ AngularJS 为你的页面提供了核心功能。\n\n在示例中，\n\n```html\n<html ng-app>\n```\n\n整个页面使用 AngularJS\
  \ 作为其根。\n\n在示例中，\n\n```html\n<div ng-app>\n```\n\n只有这个 DIV 使用 AngularJS 作为其根。网页的其他部分感知不到\
  \ AngularJS。\n\n我们还可以通过在指令中添加*应用名称*来命名我们正在构建的应用程序：\n\n```html\n<html ng-app=\"myApp\"\
  >\n```\n\n你很快就会发现，这变得非常有用。\n\n由于在 `ng-app` 指令中包含应用名称非常常见，你会在许多文章中看到以下语法：\n\n```html\n\
  <html ng-app=\"\">\n```\n\n这是另一种编写无名指令的方式，而不是只单独写一个 `ng-app`。\n\n*   **注意：** 除非该名称作为\
  \ `Module`（模块）存在，否则请不要包含名称，因为 AngularJS 将无法工作。我们还没有介绍模块，所以目前我们只使用 `ng-app` 自身，即使在生产环境中这样做也是完全可以的。\n\
  *   **注意：** 注意 `ng-app=\"\"` 引号之间没有空格。空格会被视为一个名称（即使是空的），并且必须创建一个该名称下的模块。再次，我们现在只使用\
  \ `ng-app` 自身即可。\n\n### 不再有 DOM 操作任务\n\n文档对象模型或 `DOM` 是所有现有 HTML 标签或节点的布局映射。为了在网页上编写\
  \ JavaScript 程序的输出，我们需要定位到想要实现结果的 DOM 位置。由于浏览器的不一致性和实现错误，这一直是一个问题。然后 `jQuery` 诞生了。`jQuery`\
  \ 是一个用于处理 DOM 的方法库。当实现良好时，`jQuery` 效果非常好。的是的是`jQuery` 的使用变成了一个问题，因为许多用户不学习 JavaScript，他们只是背诵\
  \ `jQuery` 解决方案，而且 `jQuery` 是手动驱动的，会导致实现错误。\n\nAngularJS 的出现救了急。低级实现将不再由程序员自己完成；它将根据程序员对特定结果的表达性需求由\
  \ AngularJS 完成。程序员变成了一个水管工；为所需的结果接入正确的指令。这将确保最佳实践和无错误的实现。通过 AngularJS，你被从低级操作任务中解放出来，你可以利用额外的时间思考解决方案，而不是代码语法和安全性。\n\
  \n当然，如果你了解 `jQuery`，你仍然可以在 AngularJS 中使用它，但我怀疑 AngularJS 将开发出更多方法来避免某些 `jQuery`\
  \ 流行的实现。\n\n在 AngularJS 中，应用程序接触 DOM 的唯一地方是在指令内部。然而，如果你需要直接访问 DOM，仍然可以通过[自定义指令](https://docs.angularjs.org/guide/directive)\
  \ 来实现。\n\n好了，我们现在对指令有了一些了解。让我们回顾一下表达式（expressions），以便我们扩展 AngularJS 的话题。\n\n###\
  \ 什么是表达式？\n\n你还记得上一个章节中表达式是什么吗？\n\n表达式是 JavaScript 评估为一个单一值的东西。\n\n```javascript\n\
  2 + 5;\n// 结果为 7\n```\n\n```javascript\n\"tony\"\n// 结果为 tony\n```\n\n```javascript\n\
  \"hello\".toUpperCase();\n// 结果为 \"HELLO\"\n```\n\n以此类推……\n\n如果在网页上有我们需要传递 AngularJS\
  \ 以便 JavaScript 解释器评估的表达式，我们通过将其封装在双括号中来实现：\n\n```html\n{{ expression }}\n```\n\n\
  AngularJS 将在双括号所在网页的精确位置写入 JavaScript 的评估结果。这不是 AngularJS 的发明；在 AngularJS 出现之前就已经其他库实现过了。只需快速查看\
  \ [Mustache](http://en.wikipedia.org/wiki/Mustache_%28template_system%29) 即可。\n\n\
  让我们玩几个例子。可能没什么实际作用，但有助于我们熟悉向 AngularJS 传递表达式。\n\n注意：你仍然可以使用 jsbeautifier.org 作为编辑器，但遗憾的是你无法保存。\n\
  \n1- 首先我们获取我们的示例：\n\n2- 将其粘贴到本地编辑器（如 Windows 记事本）。\n\n3- 要进行测试，进入文件列表并双击该文件。由于它是\
  \ HTML 文件，它将在浏览器中打开，你应该看到单词 hello。\n\n4- 现在我们知道文件可以工作了，让我们回到编辑器添加表达式。将单词 hello 替换为以下句子：\n\
  \n```html\nConvert the expression tony to uppercase: {\"tony\".toUpperCase()}}\n\
  ```\n\n5- 保存文件，刷新浏览器或重新打开文件，你应该看到大写的 TONY。\n\n\n\n\n\n我没有写任何 JavaScript 代码。AngularJS\
  \ 负责了内部处理。这是一种更高层次抽象的编程方式。我们还需要了解 JavaScript 吗？当然需要！当我们跳出这些简单的测试时，你对 JavaScript\
  \ 的知识将变得至关重要。\n\n## 我必须一直在我的网页上包含这些表达式吗？\n\n不需要，我们这样做只是在引入模块和控制器之前，为了测试和理解之目的。但是的，你可以在生产环境中一直这样做，它对于简单的内容是有效的。\n\
  \n### ng-init\n\n让我们引入另一个指令，这样我们就有更多的工具可以玩了。\n\n*   `ng-app` 指令初始化 AngularJS 应用。\n\
  *   `ng-init` 指令初始化要在应用程序中使用的数据。\n\n让我们看看 `ng-init` 在最简单的形式下工作的：\n\n1- 打开你的基础 HTML\
  \ 脚本，修改 HTML 标签以包含如下第二个指令：\n\n```html\n<html ng-app ng-init=\"city='Harrisburg';\
  \ state='Pennsylvania'\">\n```\n\n2- 然后在 body 中编写以下内容：\n\n你知道 {{city}} 是 {{state}}\
  \ 的首府吗？\n\n3- 将其保存为 `ang5.html` 并进行测试。\n\n你应该会在浏览器显示中看到以下句子：\n\nDo you know Harrisburg\
  \ is the capital of Pennsylvania?\n\n![](img/00027.jpeg)\n\nFig 26 [raw file](http://icontemp.com/jpl/ang14/ang5.txt)\
  \ | [html](http://icontemp.com/jpl/ang14/ang5.html)\n\n## 你看到发生了什么吗？\n\n我们通过 `ng-init`\
  \ 初始化两个变量：`city` 和 `state`，然后我们通过 HTML 输出上的两个表达式标签来处理它们。不需要通过复杂的脚本来处理 DOM。有更好的方法可以实现这一点，但目前的目标是熟悉\
  \ AngularJS 的基本工具。\n\n通过在 HTML 标签上初始化参数 `city` 和 `state`，它们变得可以在网页上可以使用了。然而，这些变量通常被放置在单独的表格中。\n\
  \n### ng-bind\n\n为了说明双大括号的作用，让我们用不同的方式编写相同的脚本：使用一个名为 `ng-bind` 的指令。\n\n6- 我只对变量\
  \ `city` 这样做，而对变量 `state` 不这样做，只是为了展示两者将如何工作：\n\n```html\nDo you know <span ng-bind=\"\
  city\"></span> is the capital of {{state}}?\n```\n\n显示将是：\n\nDo you know Harrisburg\
  \ is the capital of Pennsylvania?\n\n实际上，AngularJS 在其内部处理过程中始终会将大括号替换为 `ng-bind`。如果你不在意编写额外的\
  \ SPAN 标签，这实际上运行速度会快一点。当你刷新页面（Windows 上的 `CTRL f5`）并关注输出结果时，你会发现 Harrisburg 立即出现，而\
  \ Pennsylvania 会先显示大括号，然后转换为正确的单词。这发生得很快，但你可能捕捉到它。\n\n## ng-bind 是做什么的？\n\n它将数据源绑定到目标。不再需要玩\
  \ `getElementById` 这种 DOM 游戏了。\n\n关于 AngularJS 绑定还有很多需要了解，但我们需要慢一点，只需掌握足够理解后续内容的。这就像那句名言“[罗马不是一天内建成的](https://en.wikipedia.org/wiki/Rome_wasn%27t_built_in_a_day)”。\n\
  \n### ng-cloak: 避免显示闪烁\n\n当使用大括号 `{{ }}` 而不是 `<span ng-bind=\"city\">` 时，你可能会注意到显示上有一个快速的闪烁，因为大括号尚未被\
  \ AngularJS 求值。\n\n如果这对你来说是一个问题，请将库的链接包含在 HEAD 部分而不是 BODY 部分。这样，大括号将在浏览器显示文档之前被求值。将链接包含在头\
  \ 中可能会产生一些副作用，取决于你页面的复杂程度，这也是为什么越来越多的开发者将库链接移动到页面底部的原因。\n\n如果你在页面上嵌入了 AngularJS\
  \ 但没有访问 HEAD 脚本的权限，你可以使用 `ng-bind` 代替大括号，或者使用 `ng-cloak`。\n\n由于 `ng-cloak` 涉及 CSS，我在这里不再进行描述。请查看以下链接以获取有关此实现的完整描述：\n\
  \n[ng-cloak](https://angularjs.org/docs/directive/ngcloak)\n\n## 5.4 实验工作\n\n###\
  \ A 部分：初始化变量并输出计算\n\n在这个新练习中，我们想要初始化两个变量，\n\n`length=9` 和 `width=3`\n\n然后输出以下段落：\n\
  \n**如果长度为 9 宽度为 3，那么周长为 24。**\n\n请记住，在写着 9 和 3 的地方，动态标记应该写成\n\n{{length}} 和 {{width}}\n\
  \n稍后它们会被赋值给每个变量的值替换。\n\n至于总数 24，它应该是矩形的周长。你可以使用自己的公式。\n\n我将使用 `length * 2 + width\
  \ * 2` 作为我的表达式。\n\n完成脚本后，请将其与我的进行对比：\n\n[forum](http://jsplain.com/javascript/index.php/Thread/37-Lab-14b)\
