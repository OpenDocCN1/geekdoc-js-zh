  \ 控制台）。我建议使用 `Google Chrome` 的 `Console`，我将解释如何访问它以及如何将其用于我们的目标。`Opera` 和 `Epic`\
  \ 的用法也一样。当然，只要你知道如何访问，你可以利用你需要的任何其他测试方法。新的 Microsoft Edge 浏览器也可以通过快捷键 `F12` 访问 `JavaScript\
  \ Console`。\n\n除了推荐 `Google Chrome` 之外，我还会推荐 `jsbeautifier`（一个非常有用的在线编辑器），以及我自己的网站论坛，你可以在那里找到所有相关的练习题以及进一步的阅读和练习材料。\n\
  \n现在不用担心这些；在适当的时候会有大量的参考链接发布。\n\n### 在阅读这些材料之前你应该知道的\n\n阅读和练习书中项目的唯一先决条件是你熟悉基础计算机技能，如\
  \ `copy/paste`（复制/粘贴）和 `editing`（编辑）一行文本。\n\n为了获得更完整的体验，你需要访问 `Internet`（互联网）。\n\
