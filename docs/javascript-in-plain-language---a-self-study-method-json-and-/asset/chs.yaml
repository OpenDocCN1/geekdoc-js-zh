  \ `JavaScript`，无论你计划专攻该语言的哪个领域，都能稳健地进步。\n\n基础数学是一个加分项，即使你认为数学不是你的擅长，书中对所有的数学示例都进行了很好的解释。没有人应该在这些上遇到任何问题。\n\
  \n本书将帮助你理解现代 JavaScript。这包括对 `JSON` 和 `AngularJS` 的通俗易懂的介绍，这将为你打开大门并打破障碍，让你进入这些非常热门的技术领域。\n\
  \n字体 代码学习的螺旋法\n\n本电子书利用了下文概述的代码学习“螺旋法”理念：\n\n1- 保留了开发历史。\n2- 首先提供简单的解决方案，然后用更高级、更健壮的解决方案取代。\n\
  3- 仅解释螺旋中用到的概念，并提供进一步阅读材料的链接。\n\n每个项目都保留其增量历史，作为一个可以回顾的有用内容快照，就像螺旋一样。螺旋法是教学中常用的一种技术，首先学习主题的基本事实，而不必担心细节。随着学习的进行，越来越多的细节被引入，同时它们与基础知识联系起来，并反复强调基础以帮助概念的内化。\n\
  \n### 不需要记忆\n\n- 本书必须按顺序阅读，以获得更有效、强大且有意义的体验。\n- 练习题不仅应该在完成当前实验工作后重复，还应该在完成整个章节或读完整本书后重复。\n\
  - 练习就像练习吉他一样：每天且有目的地进行练习。将 `JavaScript` 练习看成要弹奏的音阶。\n- 完成练习后，始终思考如何将所涵盖的概念应用于不同的配方中。像主厨师一样思考。编程就像烹饪。\n\
  - 编程也像水水工程。我们通过促进连接来创建接口。\n- 最后，编程既是科学也是艺术。它结合了这两个世界的领域之长。\n\n### 什么是 JavaScript\n\
  \n`JavaScript` 是一种旨在与计算机浏览器交互的编程语言。目前没有其他语言具有与 `JavaScript` 相同的浏览器兼容性。大多数试图取代 `JavaScript`\
  \ 的语言实际上是将它们的代码 `decompile`（反编译）成 `JavaScript`。\n\n### JavaScript 和 HTML 有什么区别？\n\
  \n`HTML` 是一种演示标记语言。它创建在页面上显示的对象（容器框）。它不会根据用户交互做出决策。`HTML` 在计算机屏幕上绘画。\n\n`JavaScript`\
  \ 扩展了 `HTML`，体现在它通过根据某些条件和结果与用户交互，使页面动态化。\n\n为了创建结果并做出决策，我们需要学习 `JavaScript` 语法，这正是本书的主题。\n\
  \n在随后的章节中，我们将学习如何使用名为 `AngularJS` 的最新实现技术之一来创建现代网页交互。\n\n这本书不会让你成为 `AngularJS` 专家。但它将为你提供一个非常坚实的基础，赋予你力量并让你向前发展。\n\
  \n\n\n\n其他编程语言并不具备这种能力，它们需要运行在特殊的平台上并作为浏览器的进一步接口，并且它们请求 JavaScript 来协助它们完成这种交互。这就是为什么\
  \ JavaScript 成为[互联网](http://en.wikipedia.org/wiki/Internet)上最流行的编程语言的原因。计算机在使用它，网站在使用它，像\
  \ Photoshop、Word、PDF 等软件也在使用它，最后但同样，计算机服务器开始在自己的后端处理中单独使用它，这对 JavaScript 的未来来说是一个好消息。\n\
  \n如果学习方法正确，JavaScript 可以是一门很容易的语言，但它也可以是一门很难学习的语言，因为它非常动态，且规则会根据实际情况而改变。\n\n没有人能保证教你\
  \ JavaScript，因为学习是个人的经历。但我可以向你保证：按顺序阅读这本书，思考每个概念而不是死记硬背，完成所有的练习，当你读读完这本非常短的书时，你将成为一名更出色的程序员。\n\
  \n作为作者，我可能是一名程序员或一名技术作家，但最重要的是，我是一名技术讲师。我的写作经验来自于对成千上万名学生的教学、辅导和代码调试。当我编写这些概念时，我总是会想起自己在学习这些材料时经历过的挣扎，以及看到其他学生在寻求帮助时遇到的挣扎。当我写作时，这些问题就会浮出水面，我会提前解决它们，以防止你陷入常见的陷阱。\n\
  \n## 1.2 需要的材料和工具\n\n书中的所有练习都将使用 Google Chrome 浏览器的 JavaScript 控制台进行测试。偶尔我也会使用 `Opera`，它的工作原理类似。请随时使用你任何需要的测试控制台，因为每个浏览器都有。Firefox\
  \ 也是一个很好的替代方案，但我发现另外两个选项对于初学者来说代码更简洁、更容易编写。\n\n如果你的电脑上没有这些浏览器之一，可以从提供的链接中下载。我建议两者都使用。Google\
  \ [Chrome](https://www.google.com/intl/en/chrome/browser/) | [Opera](http://www.opera.com/computer/)\n\
  \n1. 要访问控制台，加载你的 Chrome 浏览器或 Opera，然后按下以下键序列：\n\n   对于 Windows 系统：`CTRL SHIFT j`\n\
  \n   对于 Mac：`CMD OPT j`\n\n这将调出控制台。\n\n2. 如果这是你第一次使用控制台，可以通过点击控制台左下角显示的`小正方形`（在最新浏览器中，此按钮似乎在右上角）将控制台从浏览器分离。分离控制台将为屏幕提供更多空间，因为你可以在保持控制台开启的同时最小浏览器。\n\
  \n3. 确保控制台顶部的标签设置为 `console`，而不是任何其他可用选项。\n\n4. 当你第一次打开控制台时，可能会在控制台上看到几条错误信息。这是正常的。只需右键点击并选择\
  \ `Clear console` 来清除屏幕。\n\n现在让我们再读几页并在脑中编写代码。几分钟后当我们到达实验室时，我们将进行一些*实操*。\n\n## 1.3\
  \ 声明变量——内存位置的别名\n\n**初步信息：**\n\n浏览器使用计算机内存。计算机内存越大，浏览器运行得越快。由于*运行内存*是有限的，程序需要通过删除过期数据和重新定位仍在使用的数据来不断调整内存中的数据。\n\
  \n当我们用 JavaScript 编程时，我们将数据存储在内存中。这些数据是短暂的，因为一旦关闭浏览器或结束程序，数据就会被清除。\n\n为了在内存中临时存储数据，我们需要用对人类有意义的单词为内存地址位置进行标记，这样我们就可以编写或操作该数据。我们不能仅仅通过给浏览器\
  \ [0x7fffffff](http://en.wikipedia.org/wiki/Physical_address) 的地址来告诉它在内存中存储字符串“hello\
  \ world!”那些日子早已一去不复了，因为这太复杂不实际，而且由于自动的内存重排，数据会在位置与位置之间移动，一直在不断变化。因此，为了解决这个问题，我们使用名称作为分配位置的*别名*，并允许计算机根据其需要管理数据的真实物理地址。\n\
  \n这些内存位置的*别名*被称为`变量`。它们之所以被称为变量有两个原因：数据的地址可以在不通知的情况下更改，而且每个变量中包含的数据也可以随时更改。保持不变的是变量名，它是人类与这块内存房产之间唯一的联系。\n\
  \n至于变量中值的更改，这可以通过程序员在随后的脚本指令中手动完成，也可以由 JavaScript 自身在值的动态重新赋值中自动完成。\n\n*   **记住这一点：**要创建一个内存变量，我们必须对其进行`declare`（声明）（声明变量就像向\
  \ JavaScript 介绍变量）。示例：\n\n```\nvar phoneBill;\n```\n\n（只需跟着读即可。当我们到达章节末尾的实验工作部分，你将有机会自己尝试。所有的章节都刻意写得很短。这是阅读并从概念上理解的时间。然后你将在实验期间自测。所有的实验练习后面都有正确答案，以便你双检查你的工作）\n\
  \n### 关于 var\n\n将 `var` 视为用于创建变量的命令（这有助于你记住在引入变量时使用 `var`）。\n\n`var` 做的另一件事是将变量固定到它被引入的位置，在某种程度上使其成为一个局部变量（稍后会详细介绍）。\n\
  \n### 关于变量名\n\n在编写 `var` 之后，我们提供变量 `name`，在我们的案例中是 `phoneBill`。名称并不重要，它可以是 `x`，因为\
  \ JavaScript 并不关心我们赋予它的“人类意义”。\n\n然而，JavaScript 关心我们使用的字符选择。确保第一个字符是字母的小写字母（小写不是强制的，只是良好的习惯，稍后你会看到）。变量不能以数字或符号开头。随后的字母可以是数字，但永远不允许符号，除非是下划线\
  \ `_`。\n\n*   总结一下：始终以小写字母开始你的变量名。忘记将下划线作为第一个字符，因为它们通常用于非常特殊的情况，因此不应考虑用于正常用途。\n\n\
  我自己的变量 `phoneBill` 中间有一个大写的 B。这是一种常见的变量命名样式。JavaScript 不关心样式，但它在检查脚本时确实让人类眼睛更容易观察。\n\
  \n另一种流行的命名方式是使用下划线分隔变量名中每个单词的“人类意义”。使用下划线的原因是空格或连字符在变量名中是不允许的：`phone_bill`\n\n*\
  \   **记住这一点：**“单词的意义”仅供人类消费。如果我们引入的不是 `phoneBill` 而是仅仅是 `x`，JavaScript 会接受它而不会抱怨。当我们编程时，既是为了让计算机理解，也是为了让人类理解，以便他以后可以故障排除或更新程序。选择你自己的变量编写样式并坚持下去。*一致性很重要*。然而，要熟悉所有常见的样式，因为当你在团队中工作时，你需要适应整个团队约定的通用样式。练习灵活性。\n\
  \n### 关于分号 ;\n\n\n\n\n`statement` 结尾的分号告诉 JavaScript 你已经完成了变量的声明：\n\n```\nvar phoneBill;\n\
  ```\n\n分号充当命令 `terminator`（终止符），或两个不同且独立命令之间的分隔符。换句话说，我们是在指示 JavaScript 停止并将该命令或表达式保存为一条独立于后续指令的独立指令。\n\
  \n*回到变量名来看，*\n\n- **记住这一点：** JavaScript 是区分大小写的。`A` 和 `a` 在 JavaScript 中具有独立含义。`phoneBill`\
  \ 和 `phonebill` 不是同一个单词。此时，`phoneBill` 是一个已声明的变量，而 `phonebill` 什么都不是。如果你误写成 `phonebill`\
  \ 而不是 `phoneBill`，JavaScript 将抛出错误，因为你声明的是变量 `phoneBill` 而不是 `phonebill`。\n\n当然，我们也可以拥有两个独立的变量，一个名为\
  \ `phoneBill`，另一个名为 `phonebill`，这正是重点所在，对于 JavaScript 来说，它们是两个不同的单词。\n\n### 给变量添加数据\n\
  \n一旦声明了变量，就会为该变量预留一个内存位置，然后我们可以将某些数据赋值给该变量。\n\n记住 `phoneBill` 就不是比制作一个预留内存位置的映射要简单吗？\n\
  \n要给变量赋值数据，我们使用 `=` 运算符：\n\n```\nphoneBill = 200;\n```\n\n不要在 200 之前使用 `$`。那会触发错误。如果你愿意，稍后输出数据时可以使用\
  \ `$`，但在将数据输入计算机内存时不能这样做。JavaScript 想要的只是纯形式的数字 200。\n\n我刚刚将数字 200 保存在列为 `phoneBill`\
  \ 的内存位置中。注意结尾的分号。它终止了我的 `statement`（语句）。\n\n我们可以在一个步骤中完成变量的声明并包含数据：\n\n```\nvar\
  \ utilitiesBill = 400;\n```\n\n有时候，我们只是想告诉 JavaScript 在某个特定名称下预留一个位置。而其他时候，我们一次性预留位置并填充数据。不要担心所需内存的大小。与其他语言不同，JavaScript\
  \ 是动态的：它会自动调整内存。\n\n### 修改变量中的值\n\n如果我们想把 `phoneBill` 的值从 200 改为 150 该怎么办？\n\n要更改变量的值，我们只需要对它进行重新赋值（不需要重新声明）：\n\
  \n```\nphoneBill = 150;\n```\n\n200 被删除了，`phoneBill` 位置的计算机内存现在持有值 150。\n\n- **记住这个：**\
  \ **永远不要在同一个变量名上使用两次 `var`**。如果你在重写现有变量时将 `var` 作为前缀，你就会抹掉旧变量，因为你又重新声明了该变量。这可能是你刻意想要做的，但在大多数情况下，这并不是常见的做法。我见过许多新程序员把这当成错误这样做。\n\
  \n### 给变量添加单词而不是数字\n\n到目前为止，我们一直在为变量赋值 `type number`（数字类型）的数据。实际上，我们可以为变量赋值任何内容。\n\
  \n由于变量只是一个内存位置，我们也可以给它赋值字符字符串 `string`（也称为 `string` 类型的值），甚至是其他类型的数据，如 `arrays`（数组）、`functions`（函数）、`objects`（对象）……稍后详细介绍这些。\n\
  \n### 我们聊聊字符串\n\n字符字符串可以赋值给变量，但我们需要告诉 JavaScript 这是一个字符串。我们让它知道的方法是将我们的字符字符串括在引号中：\n\
  \n```\nvar myName = \"Tony\";\n```\n\n任何未被引号括的单词都被视为存储在 JavaScript 库中的 `reserved`（保留）术语。\n\
  \n- 如果我直接写 `var myName = Tony;`（字符串‘Tony’没有加引号），JavaScript 将检查计算机内存中的库，寻找名为 `Tony`\
  \ 的命令或变量。由于 `Tony` 不属于保留术语，JavaScript 将在屏幕上抛出错误。任何 `word data`（单词数据）都需要括在引号中。\n\n\
  在我们声明变量 `myName` 后，单词 `myName` 将变成一个保留术语，直到它从内存中被清除或程序结束。变量名不需要加引号。\n\n- **记住这一点：**\
  \ **不要给变量名加引号**。对于 `string` 类型的数据，我们需要在引号内。*当我们重新赋值时，不需要遗忘。*\n\n### 使用什么引号：单还是双引号\n\
  \n在 JavaScript 中，单引号或双引号的作用是一样的。只需确保引号匹配。\n\n\n\n几乎所有现代浏览器都内置了 `Console`（控制台），用于帮助我们调试或实验\
  \ JavaScript。一旦打开，所有的 `Console` 提供的选项基本上是相同的。最大的区别在于我们访问 `Console` 的方式以及 `Console`\
  \ 在屏幕上的显示外观。\n\n请选择以下浏览器之一。如果你的电脑上没有安装，请下载它。使用这些浏览器之一是为了确保当我们使用自带的 JavaScript 控制台一起编码时，我的指令可以与你的操作保持一致。如果你愿意，也可以随时使用任何其他\
  \ `Console`，但其访问方式可能会有所不同。\n\n[Google Chrome](https://www.google.com/chrome/browser/).\n\
  \n[Opera](http://www.opera.com/).\n\n打开上述两个浏览器之一，然后按下以下键组合打开 `Console`：\n\n1- 如果你使用的是\
  \ Windows 或 Linux：\n\n`CTRL SHIFT j`\n\n如果使用的是 MAC：\n\n`CMD SHIFT j` 或 `ALT-CMD-j`\n\
  \n屏幕底部可能会弹出一个窗口。\n\n2- 确保选中了 `Console` 标签页。\n\n如果你收到任何 `error`（错误）消息，只需在白色区域`右键点击`并选择\
  \ `Clear Console`（清除控制台）即可清除屏幕。这些错误几乎每次打开控制台时都会出现，因为 `Console` 正在检查当前打开的文档（你在访问\
  \ `Console` 之前在屏幕上看到的页面），内容可能不符合 `Console` 的预期，因此产生了错误警告。只需清除消息即可获得更多窗口空间。\n\n3-\
  \ 如果你想（推荐），可以将 `Console` 从浏览器中分离并最小化浏览器，这样它就不会影响你的操作。第一次分离 `Console` 后，它将一直保持分离，除非你通过切换同一个按钮将其重新合并。\n\
  \n要分离 `Console`，请在 `Console` 标签菜单上寻找双正方形图标并点击它。现在你应该有两个不同的窗口。最小化浏览器为你的 `Console`\
  \ 屏幕留出更多空间。\n\n### 声明变量\n\n让我们开始编码...\n\n1- 声明变量 `x`、`y` 和 `z`\n\n（仅进行声明，目前不赋值）\n\
  \n并在每个分号后按 ENTER 键以激活表达式：\n\n它看起来应该是这样的：\n\n```\nvar x;\nvar y;\nvar z;\n```\n\n\
  你也可以只用一个 `var` 并用 `comma`（逗号）分隔变量名。如果你同时要声明多个没有赋值的变量，这可以节省一些时间。别忘记在最后加上 `semicolon`（分号）：\n\
  \n```\nvar x, y, z;\n```\n\n2- 现在，声明另一个变量的同时赋值。\n\n我正在使用值为 `347` 的变量 `a`：\n\n```\n\
  var a = 347;\n```\n\n3- 声明一个包含你名字的变量 `b`（记住，你的名字是一个字符字符串 `string`）：\n\n```\nvar\
  \ b = \"Tony\";\n```\n\n*   **NOTE：** 你可以通过输入变量名、加分号并按 ENTER 来在 `Console` 上读取每个变量的值。例如：\n\
  \n    `b;` 它应该显示 \"Tony\";\n\n之所以可以通过输入变量来显示值是因为我们正在使用测试 `Console`。在现实生活中，正如我们之后看到的，我们需要使用打印命令。\n\
  \n### 检查变量的数据类型\n\n太棒了！到为止我们声明了以下变量：\n\n`x, y, z, a, b`。\n\n变量 `b` 是什么类型的变量？我的意思是，它包含什么类型的数据？我们知道\
  \ `b` 存储了你的名字，对吧？\n\n4- 使用 `typeof` 命令检查变量：\n\n```\ntypeof b;\n```\n\n它显示 \"string\"\
  。变量 `b` 包含带有`quotes`（引号）的姓名，因此它是一个字符字符串。\n\n5- 变量 `a` 呢？\n\n```\ntypeof a;\n```\n\
  \n它显示 \"number\"。变量 `a` 包含数字 `347`，因此它包含类型为 `number`（数字）的数据。\n\n*   **NOTE：** 你注意到\
  \ `Console` 如何尝试补全 `typeof` 这个单词的了吗？如果你不想自己写整个单词，只需在显示器出现提示时按 TAB 键即可。如果你像我一样，更喜欢练习输入，只需注意不要拼写错误。自动补全对于加速编程和避免输入错误变得非常有用，特别是当...\n\
  \n\n\n\n由于 \"Tony\" 的类型是 `string`，我可以对这种类型的数据进行一些操作，或者获取关于 `string` 数据的某些信息，例如它的字符长度：\n\
  \n```\nmyName.length;\n```\n\n控制台将显示 4，这意味着变量 `myName` 的值 \"Tony\" 长度为 4 个字符。\n\n\
  `length` 是从 `type string` 继承的属性之一。其他类型的数据也使用这个属性，因为正如你将反复看到的那样，它在决策非常有用。\n\n你注意到\
  \ `myName` 和 `length` 之间的“点”（`dot`）了吗？\n\n### 点运算符 (The DOT operator)\n\n`myName.length`\
  \ 中的点将变量 `myName` 与它的属性 `length` 粘在一起。\n\n点运算符将变量连接到它的属性，或将父对象连接到子对象。我们先放置根节点，即属性的所有者，然后通过点来映射它的成员或子节点：\n\
  \n```\nparent.child.grandchild;\n```\n\n或者在一个更显式的示例中：\n\n```\nwindow.myName.length;\n\
  ```\n\n`window` 实际上是变量 `myName` 的父级。我们稍后会回到这里。\n\n这几乎就像在说“这个人的名字是什么？”。你看到那个 's'\
  \ 了吗？它将名字与人联系起来。点表示法的工作原理是相同的。\n\n在这种情况下，它非常简单：我们从变量名开始，向下移动一级到达它的属性 `length`。其他情况下，目标地址可能会变得复杂，也许在链条后面还有一两个术语。我们在整本书中都有机会使用点运算符。\n\
  \n在使用`dot operator` 时，我们使用的是所谓的**点表示法 (Dot Notation)**，但还有另一种替代语法，叫做**括号表示法 (Bracket\
  \ Notation)**。\n\n请参阅下一页，获取关于括号表示法的简要介绍说明。\n\n### 括号表示法 (The Bracket notation)\n\
  \n我并不是想通过同时提到两种不同的表示法来让你困惑。我们稍后会广泛使用括号表示法。将其视为关于它的入门介绍即可。\n\n而不是使用：`myName.length;`\n\
  \n在你的控制台中输入以下内容：\n\n```\nmyName[\"length\"];\n```\n\n它显示数字 4，就像使用点表示法时一样。注意 `length`\
  \ 在大括号内部被引号括了起来。我们将 \"length\" 作为一个字符串或标签传递，JavaScript 将其重新转换回其在库中正确的属性级别。使用括号表示法有优势，因为它更通用，但现在先不要为此苦恼。我们将同时使用点表示法和括号表示法。括号表示法主要用于动态情况。你稍后会看到点表示法是“硬连接”，而括号表示法是“软连接”（当我们在编写代码时不知道真实的值）。\n\
  \n有时我们开轿车，有时我们开皮卡！表示法语法也是一的。\n\n### 方法的示例 (An example of a method)\n\n字符串数据还继承了如\
  \ `.toUpperCase()` 等方法：\n\n```\nmyName.toUpperCase();\n```\n\n它显示 \"TONY\" 而不是 \"\
  Tony\"。\n\n变量 `myName` 被改为大写了吗？\n\n没有，没有。它只是在大写模式下显示了它，但值保持原始声明时的状态。\n\n然而，我们可以通过将变量\
  \ `myName` 重新赋值为转换后的自身来将原始值转换为大写：\n\n```\nmyName = myName.toUpperCase();\n```\n\n\
  现在 `myName` 包含的值是 \"TONY\"。原始的 Tony 被丢弃了。你看到它是发生的了吗？我们将原始变量赋值给了它自己的转换。这几乎就像一只能抓住自己尾巴的狗。\n\
  \n### 括号 ( ) 是怎么的？\n\n`toUpperCase` 是一个方法，它处理某些 `action`（动作）。这听起来像是一个 `function`（函数），我们还没有涵盖它。`()`\
  \ 代表动作、函数处理或 `evaluation`（评估）。\n\n每当你看到一对括号时，请想象某些东西正在被 JavaScript 评估，并返回一个结果。在这种情况下，数据被转换为大写；这就是评估的结果。\n\
  \n关于括号的更多信息将在稍后介绍。现在不要担心它，只需承认它并继续前进。\n\n这是另一个方法：`toLowerCase()`：\n\n```\nmyName.toLowerCase();\n\
  ```\n\n现在 `myName` 的值是 \"tony\"。你注意到 T 是小写的了吗？将除第一个字符以外的字符串转换为小写被称为*首字母大写 (capitalizing)*。遗憾的是，JavaScript\
  \ 中中没有直接的方法来进行首字母大写。要么全小写，要么全大写。我们可以通过[方法的组合](http://jsplain.com/javascript/index.php/Thread/98-How-to-capitalizing-just-the-first-character-in-JavaScript/)来实现，但这对现在来说有点高级。此外，如果你知道\
  \ CSS 并且在 HTML 页面上显示结果，你始终可以使用 CSS 文本转换属性 `capitalize`。\n\n*   **注意：** `toUpperCase()`\
  \ 和 `toLowerCase()` 这两个词某些字母是大写，某些是小写，对吧？JavaScript 是区分大小大小的，它认为 `A` 和 `a` 是两个不同的字符。\n\
  \n我之所以这样写 `toUpperCase` 和 `toLowerCase` 并不是因为驼峰命名（camelCase）是我的首选写法；而是因为 JavaScript\
  \ 本身赋予这些方法的正确名称。如果我们写 `tolowercase`，它将无法工作。正如你记得的 `typeof` 全小写，我们不能写 `typeOf`。那将不起通。这就是控制台自动补全功能非常有用的原因之一：它消除了拼写上的疑虑。\n\
  \n\n\n\n声明变量 `y` 并将其赋值为 `x` 的值，但使用大写形式。\n\n```javascript\nvar y = x.toUpperCase();\n\
  ```\n\n10- 调用 `y`：\n\n```javascript\ny;\n```\n\n它显示 \"THE QUICK BROWN FOX JUMPS\
  \ OVER THE LAZY DOG\"\n\n11- *额外额外奖励*：\n\n声明一个名为 `z` 的变量，并将其赋值为 `x` 长度的数值：\n\n```javascript\n\
  var z = x.length;\n```\n\n12- 调用 `z`：\n\n```javascript\nz;\n```\n\n它显示 `43`，`z`\
  \ 的值为 `43`。\n\n实验结束\n\n## 1.7 增加一些 JavaScript 运算符\n\n### +, -, +=, -=, /, /=, %,\
  \ *, *=\n\n- 如果两个操作数都是数字，它将左操作数加到右侧操作数上。\n- 如果一个或两个操作数都是字符串，它将拼接这两个单词或字符。\n- 从左数字操作数中减去右数字操作数。\n\
  - `+=` 将左侧加到右侧并自动**赋值**给**左侧**。\n- `-=` 从左侧减去右侧并自动**赋值**给**左侧**。\n- `/` 将左操作数除以右操作数。\n\
  - `/=` 将左操作数除以右操作数并自动将`quotient`（商）赋值给**左侧**。\n- `%` 取模（获取左操作数除以右操作数后的余数）。\n- `*`\
  \ 将左操作数乘以右操作数。\n- `*=` 将左操作数乘以右操作数并自动将乘积**赋值**给**左侧**。\n\n注意：由于 `+=`、`-=`、`/=` 和\
  \ `*=` 是赋值运算符，因此左操作数必须是一个变量，不能直接是数字。\n\n我们将在编码过程中扩展这些概念。\n\n### + 加法运算符\n\n`+` 符号具有双重功能，取决于\
  \ JavaScript 处理的数据类型。\n\n在字符串类型中，`+` 运算符按照示例所示[拼接](http://en.wikipedia.org/wiki/Concatenation)\
  \ 单词：\n\n```javascript\n\"Hello\" + \"World!\";\n```\n\nJavaScript 将它们组合为 \"HelloWorld!\"\
  \n\n如果你真的想在单词之间留空格，有三种可能的方法完成这项任务：\n\n(1)\n```javascript\n\"Hello\" + \" \" + \"\
  World!\";\n```\n(2)\n```javascript\n\"Hello \" + \"World!\";\n```\n(3)\n```javascript\n\
  \"Hello\" + \" World!\";\n```\n\n在第一个示例中，我通过将其括在引号中添加了一个*独立的*空格。\n在第二个示例中，我在 Hello\
  \ 之后、结束引号之前放置了一个空格。\n在第三个示例中，我在 World! 单词后面添加了一个尾随空格。\n\n第一个示例在我们将两个变量相加时非常有用，因为缺少引号，我们无法将前导或尾随空格与变量结合。\n\
  \n我的意思是：\n\n```javascript\nvar x = \"Hello\";\nvar y = \"World!\";\n```\n\n现在我们将两个变量拼接在一起并将它们赋值给另一个变量：\n\
  \n```javascript\nvar z = x + y;\n```\n\n`z` 的结果是 `HelloWorld!`。在 `x` 和 `y` 之间添加空格的唯一方法是使用第一种技术：\n\
  \n```javascript\nvar z = x + \" \" + y;\n```\n\n现在 `z` 包含 \"Hello World!\"。\n\n\
  ### 使用 + 加法运算符相两个数字\n\n涉及数字时，`+` 运算符将操作数相加如下所示：\n\n```javascript\n3 + 4 + 5;\n```\n\
  \n该表达式的结果将是 12。\n\n```javascript\nvar a = 6;\nvar b = 10;\nvar c = a + b;\n```\n\
  \n变量 `c` 被赋值为 16，它是 `a` 和 `b` 的和。\n\n### 使用 += 赋值运算符\n\n`+=` 非常有用。假设变量 `i` 的值为 3，你想给它加\
  \ 7，我的意思是 3 + 7：\n\n```javascript\nvar i = 3;\n```\n\n我们可以这样做：\n\n```javascript\n\
  i = i + 7;\n```\n\n这会将变量 `i` 赋值为 10。\n\n然而，这种操作非常常见（正如你之后将看到的），所以程序员创建了一个快捷运算符 `+=`（称它为\
  \ *plus equals*，永远不要写成 equals plus，因为那是不起的）：\n\n```javascript\ni += 3;\n```\n\n\
  每当你看到 `+=`，它意味着取左操作数的值并将右操作数加在其上。\n\n所以现在原来的 10 `i` 现在是 13。如果我再做一次会怎样？\n\n```javascript\n\
  i += 1;\n```\n\n现在 `i` 是 14。\n\n那么这个呢：\n\n```javascript\ni += i; // <-- 是 i 不是 1。\n\
  ```\n\n上面的示例等同于 14 + 14，结果为 28。\n\n`+=` 运算符也可以用于字符串，在原始值的右侧添加更多字符：\n\n```javascript\n\
  var n = \"T\";\nn += \"o\"; // 结果为 \"To\"\nn += \"n\"; // 结果为 \"Ton\"\nn += \"y\"\
  ; // 结果为 \"Tony\"\n```\n\n这在*循环*中构建短语或列表时非常有用。\n\n### ++ 自增运算符\n\n我们很多时候想要增加 1 个单位。我们可以通过以下方式实现：\n\
  \n假设 `x = 5`：\n\n```javascript\nx = x + 1; // 现在 x 是 6\nx += 1;     // 现在 x 是 7\n\
  x++;       // 现在 x 是 8\n```\n\n`++` 运算符是最常用的增加值的方法。\n\n### -- 自减运算符\n\n`--` 运算符是\
  \ `++` 运算符的反相反。它减少 1 个单位。\n\n假设 `x = 5`：\n\n```javascript\nx = x - 1; // 现在 x 是\
  \ 4\nx -= 1;     // 现在 x 是 3\nx--;       // 现在 x 是 2\n```\n\n`--` 运算符是最常用的减少值的方法。\n\
  \n### - 减法运算符\n\n`-` 运算符从左数字操作数中减去右数字操作数。\n\n```javascript\n10 - 5; // 结果为 5\n```\n\
  \n我们还可以使用 `-=` 运算符从原始变量中减去值：\n\n```javascript\nx = 10;\nx -= 2; // 现在 是 8\n```\n\
  \n### / 除法运算符\n\n`/` 运算符将左操作数除以右操作数。\n\n```javascript\n10 / 2; // 结果为 5\n```\n\n\
  我们还可以使用 `/=` 运算符除原始变量并将结果赋值给它：\n\n```javascript\nx = 10;\nx /= 2; // 现在 是 5\n```\n\
  \n### * 乘法运算符\n\n`*` 运算符将左操作数乘以右操作数。\n\n```javascript\n3 * 4; // 结果为 12\n```\n\n\
  我们还可以使用 `*=` 运算符乘以原始变量并将结果赋值给它：\n\n```javascript\nx = 5;\nx *= 2; // 现在 是 10\n```\n\
  \n## 1.8 实验 3\n\n让我们练习一下以巩固本章涵盖的概念。\n\n请通过 **CTRL SHIFT j** 或 Mac 的 **CMD SHIFT\
  \ j** 或 **ALT-CMD-j** 打开控制台。\n\n### 第一部分：使用 +, += , ++ 和 --\n\n1- 加 *3* 和 *4*\n\n\
  2- 声明变量 `x` 值为 *3*，变量 `y` 值为 *5*。\n\n\n\n\n然后创建变量 `z` 并将 `x` 和 `y` 的和赋值给它。\n\n调用变量\
  \ `z`，它应该包含值 `8`。\n\n3- `x` 为 `3`。使用一元运算符 `++` 将 `x` 增到 `4`。然后调用 `x` 查看结果。\n\n4-\
  \ 使用一元运算符 `--` 将 `x` 减 `1`。然后调用 `x` 查看结果。\n\n5- 将 `\"Hello\"` 拼接到 `\"World!\"` 上。确保两个单词之间有一个空格。\n\
