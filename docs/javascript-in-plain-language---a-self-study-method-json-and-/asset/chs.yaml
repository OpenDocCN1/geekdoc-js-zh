  \ | bit.ly/1rm2pUg.\n\n### C 部分：在字符串中查找并替换单词\n\n该项目的目标是创建一个机制，查找段落中的一个单词并将其替换为另一个单词。并将是将段落中的\
  \ *brown* 替换为 *red*：\n\n\"The quick **brown** fox jumps over the lazy dog.\"\n\n\
  使用的工具如下：\n\n*   几个作为辅助的变量名：\n\n    `paragraph` – 赋值为原始段落。\n\n    `tempArray` – 赋值为字符串转换为数组的结果。\n\
  \n    `oldWord` – 赋值为单词 \"brown\"，即我们搜索并进行替换的单词。\n\n    `newWord` – 赋值为单词 \"red\"\
  ，即我们想要作为替换的单词。\n\n*   `split()`，将字符串转换为独立单词的数组。\n\n    分割字符串的结果将赋值给名为 `tempArray`\
  \ 的数组。\n\n    （将字符串句子转换为单词数组是为了我们能够定位到想要替换的单词）。\n\n*   一个 `for` 循环。循环将遍历数组以找到目标单词并替换它。\n\
  \n*   `join()`，稍后将数组重新转换回字符串。\n\n我们首先将其拆分为数组，然后搜索并替换，最后转换回字符串并将结果赋值回变量 `paragraph`。\n\
  \n最后我们使用 `console.log` 打印变量 `paragraph` 以显示最终结果。\n\n这听起来可能很复杂，但在第一次尝试之后就会变得简单。\n\
  \n这是一份操作指南：\n\n1. 声明原始字符串变量。\n2. 将变量转换为单个单词。\n3. 引入需要查找的单词。\n4. 引入用于替换现有单词的新单词。\n\
  5. 遍历数组以查找并替换单词。\n6. 通过将修改后的数组赋值给原始变量将其重新转换为字符串。\n7. 显示你的结果。\n\n花时间思考。如果你需要编辑器，请使用\
