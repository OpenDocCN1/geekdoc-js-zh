  \n```\nx % 5;\n```\n\n## 1.9 比较运算符和布尔值\n\n### ===, !==, <, >=\n\n让我们学习更多的比较运算符并向\
  \ JavaScript 提更多问题。\n\n请记住，这些符号比较左操作数和右操作数。\n\n- `<` 小于\n- `>` 大于\n- `<=` 小于\n-\
  \ `>=` 大于\n- `!==` 不等于\n\n### 什么是布尔值？\n\n（实验结束）\n\n所以，我们可以在控制台上创建一个问题来获取布尔值结果：\n\
  \n```\nx === 12;\n```\n\n如果我们之前声明了 `x` 且值为 `12`，JavaScript 将返回 `true`。否则，它将返回 `false`，如下例所示：\n\
  \n```\nx === 14;\n```\n\n\n\n\n**注意：** 你可能在其他地方的书书中见过 JavaScript 中使用的双等号 `==`。在不同的编程语言中这可能是可以的。然而，在\
  \ JavaScript 中，不建议使用双等号比较运算符。这是因为在 JavaScript 中，双等号 `==` 并不会完全检查条件。我的意思是，它没有检查操作数所包含的数据类型。这可能会导致错误，因为有时我们带有引号的数字，这使其变成了字符串，`\"\
  12\"` 的值与 `12` 不同。前者是字符字符串，后者是一个数字。\n\n在 JavaScript 中，比较值时请始终使用三等号：`===`。\n\n##\
