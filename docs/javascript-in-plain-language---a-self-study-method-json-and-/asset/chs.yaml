  \n关于循环：\n\n*   记住：为了使用循环，我们必须填写循环应用。\n\n我们稍后会介绍所有的循环样式。现在让我们谈谈 for 循环。\n\n## 2.6\
  \ for 循环\n\n我们将学习如何填写“for 循环”样式的*形式请求*，因为它将在我们的下一个项目中使用。\n\n*for 循环*的理念是按照指定的次数自我重复。\n\
  \n基础的形式声明有一个头部和一个体，如如下[伪代码](http://en.wikipedia.org/wiki/Pseudocode)代码所示：\n\n*for\
  \ (x 从 0 开始； 且 x 小于 5；增加 x) { 执行此代码 }*\n\n![](img/00009.jpeg)\n\n图 9\n\n在这个形式中有三个指令需要被评估，因此用分号分隔前两个指令（以使它们相互独立）。\n\
  \n***x 从 0 开始；***\n\n在这里 JavaScript 将 x 存储为值为 0 的临时变量。名称 *x* 并不重要，大多数程序员使用名称 *i*。正确的脚本是：\n\
  \nfor(var x = 0; *或者* for (var i = 0; 等...\n\n***且 x 小于 5；***\n\n此时 JavaScript 评估此条件。由于\
  \ *x* 小于 5（因为它是 0），所以条件是*真*的，JavaScript 执行体中的代码一次。正确的表达式是：\n\nx < 5;\n\n***增加 x***\
  \ ++\n\n在 JavaScript 第一次运行代码块（步骤 3）之后，它会返回 *for 循环*声明并增加 *x* 的值（步骤 4）。现在 *x* 是 1\
  \ 而不是 0。\n\n\n\n\n`x++` 或 `x = x + 1`\n\n由于 `x++` 是最后一个被求值的表达式，因此分号并不是必要的。实际上，这样做是不利的，因为它会触发错误，阻止\
  \ JavaScript 运行该代码块，因为它认为它正处于 `for` 循环的结束。`x++` 之后的第一个分号应该位于主体代码块内第一个可执行语句的末尾。\n\
  \n一旦 JavaScript 第一次运行循环，它会返回初始形式进行第二次评估。第二次评估如下：\n\n`(对于 x 从 1 开始；且当 x 小于 5 时；增\
  \ x) { 执行此代码 }`\n\n在第二次迭代中，`x` 为 1 但仍然小于 5，因此代码块再次执行，`x` 在末尾再次增加。以此此类推，直到 `x` 变为\
  \ 5 为止。\n\n### 让我们创建一个简单的 for 循环来看看它是如何工作的。\n\n作为 `x` 使用的临时变量最常用的名称是 `i`。也许这是因为让我们想起了\
  \ `index`（索引）这个词。所以，让我们用经典的名称 `i` 代替 `x`：\n\n```\nfor(var i = 0; i < 5; i++)\n```\n\
  \n这是头部形式，它的意思是：\n\n`对于这个声明的变量 `i`，它的初始值为零；只要 `i` 小于五；在每个循环周期后将 `i` 加 1`。\n\n在第 2\
  \ 行，我们在代码块中包含了可执行的指令。这些指令将被 JavaScript 重复执行 5 次：\n\n下图说明了这一概念：\n\n![](img/00010.jpeg)\n\
  \n图 10\n\n*   请注意：如果你编写了此循环并将其粘贴到控制台中，你可能会得到一个带有 (5) 前缀的单行结果，告诉控制台运行了 5 次。这是控制台的正常行为。为了节省显示空间，它们通常不会重复输出相同的输出，它们只是告诉你循环运行了多少次，但在现实中，你会看到五行显示。然而，如果每次打印的内容不同，那么控制台将单独显示所有\
  \ 5 次迭代。\n\n要查看循环运行的真实显示，请将 `console.log(\"Say hi to Mary!\");` 替换为：\n\n```\nconsole.log(i);\n\
  ```\n\n现在，它会在每次循环重复中打印变量 `i` 的值，由于每次的输出都不同，控制台必须显示每一次迭代。\n\n如果你想要更美观的输出，可以尝试这个：\n\
  \n```\nconsole.log(\"the value of i is now \" + i);\n```\n\n你应该会得到：\n\nthe value\
  \ of i is now 0\nthe value of i is now 1\nthe value of i is now 2\nthe value of\
  \ i is now 3\nthe value of i is now 4\n\n它显示了 0 到 4，是因为 `i` 的计数从 0 开始，第五次是 4。这没关系，它仍然循环了\
  \ 5 次。然而，如果你意图是显示 1 到 5，那么让 `i` 从开始等于 1，而不是从零开始。\n\n## 2.7 遍历字符字符串\n\n你还记得括号法和点符号法吗？\n\
  \n我在第一部分的“操纵变量数据”章节中介绍过它们。\n\n让我们对这个主题稍作回顾并扩展。\n\n我将声明变量 `x` 并赋值为字符串值 \"orange\"\
  ：\n\n```\nvar x = \"orange\";\n```\n\n值 \"orange\" 是顺序字符的集合，每个字符都有一个从零开始的位置数字，例如\
  \ o 是零，`r` 是一，`a` 是二，`n` 是三，等等。\n\n我们可以使用括号法来查找字符串中任何位置的字符数据：\n\n```\nx[location\
  \ Number];\n``` <-- 它给了我们该位置内部的值。\n\n示例：\n\n```\nx[2];\n```\n\n它将显示字符 `a`，它是第三个字符，位置为\
  \ 2（从零开始）。\n\n我在这里不能使用点符号法，因为点符号法不接受数字或符号：\n\n```\nx.2 \n``` <-- 这将给我返回一个错误。\n\n\
  ### 我们用这种括号法语法做什么？\n\n括号法允许我们访问字符串值上的特定字符。\n\n这是一个通过 `console.log` 发送 `x[4]` 来显示变量\
  \ `x` 中字符 `g` 的示例：\n\n```\nconsole.log(x[4]);\n```\n\n这是另一个示例：字符 `ge`：\n\n```\n\
  console.log(x[4] + x[5]);\n```\n\n所以，通过括号法，我们可以探测字符字符串并获取位置数字的内容。\n\n### 点符号法呢？\n\
  \n点符号法非常适合获取字符串值的属性，例如长度（length），记得吗？\n\n```\nx.length;\n``` 或 `console.log(x.length);`\n\
  \n*   点符号语法无法用于数字、符号以及在编写代码时尚未知的名称。这防止了点符号语法在循环中使用，因为循环中的值会在每个循环周期中变化。因此，**当涉及到动态数据时，只能使用括号语法**。\n\
  \n## 2.8 实验 7\n\n### 搜索字符串字符的位置\n\n在这个项目中，我们将变量 `x` 赋值为 \"orange\"。\n\n主意是搜索字符 \"\
