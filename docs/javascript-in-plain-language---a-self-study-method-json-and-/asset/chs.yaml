  \n## 2.3 函数的解剖\n\n在上一个练习中，我们不断按下 `Up Arrow` 来调回程序进行测试。\n\n如果没有向上方向键怎么办？我们必须一遍又地编写脚本，对吧？\n\
  \n这就是函数派上用场的地方。*停止！* 当提到 JavaScript 中的函数时，不要考虑数学。考虑 `functionality`（功能性）。在 JavaScript\
  \ 中，函数是程序例的容器。我们可以将 `if()`、`else` 脚本保存在函数中，只需通过 `calling the function` 来调用它。这只有一个词，而不是\
  \ 10 行文本。\n\n### 关于函数需要预先的的\n\na) 函数是一个闭合容器，就像下面图片中的蓝色矩形。\n\nb) 为了向函数输入数据进行处理，我们需要一个或多个\
  \ `input` 参数。\n\nc) 为了从函数中 `export` 数据以便重复使用，我们需要实现一个名为 `return` 的接口，或者，将某些外部变量赋值给新结果。\n\
  \n![](img/00006.jpeg)\n\n图 6\n\n### 编写函数\n\n函数的表示形式如下：\n\n```javascript\nfunction\
  \ funcName() { stuff to do; }\n```\n\n上面的表示不接受任何输入，它只是执行操作。\n\n要创建一个接受输入参数的函数，我们需要：\n\
  ```javascript\nfunction funcName(inputParameter) { stuff to do; }\n```\n\n当我们说 `call\
  \ the function` 时，意味着编写函数名并附加一对括号：\n\n```javascript\nfuncName();\n```\n\n或者，如果函数有\
  \ `argument`，我们必须包含：\n```javascript\nfuncName(123);\n```\n当 `123` 是数字时。\n\n或者\n\
  ```javascript\nfuncName(\"Tony\");\n```\n当 `Tony` 是字符串时。\n\n这是一个任意命名为 `sizeUp` 的函数，将字符串值转换为大写：\n\
  \n```javascript\nfunction sizeUp(x){console.log(x.toUpperCase());}\n```\n在这里，`x`\
  \ 是输入参数。\n\n1- 调用函数：\n```javascript\nsizeUp(\"red blue\");\n```\n它显示 `RED WHITE\
  \ BLUE`。\n\n\n\n\n\n**4- 调用函数 `test2` 并观察这些数字（3,5,15,21）的每个结果：\n\n```\ntest2(3);\n\
  test2(5);\ntest2(15);\ntest2(21);\ntest2(11);\n``` 等。\n\n函数的输入参数充当临时的内部变量。这非常有用，因为我们可以将数据发送到函数中处理。这就是在我们调用\
  \ `test2()` 函数时发生的情况。\n\n一旦我们掌握了函数的基本语法，就可以开始创建一些非常酷的东西了。\n\n函数对你来说可能仍然很困惑。我将在编码过程中涵盖所有的基础知识。这并不是一个困难的课题，但需要按照正确的顺序来学习。\n\
  \n### 什么是函数调用？\n\n一图胜千万言：\n\n![](img/00008.jpeg)\n\n图 8 (查看原始文件：[此处](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/).\
  \ ) bit.ly/1raw6pT\n\n观察图 8，在左下角，我们调用函数 `addTen()`，并将参数为 4 的 `data` 传递给函数参数 `n`。\n\
  \n然后 4 将变成参数 `n` 的临时值，并执行 `10 + 4` 的和。\n\n最后，`return` 机制导出结果，即数值 14。\n\n我们本可以使用\
  \ `console.log(n + 10)`，但 `console.log` 会将值显示在屏幕上，而不会将其导出函数。换句话说，我们无法在函数外部使用数字 14，因为\
  \ `console.log()` 不导出数据，它实际上是将所有内容作为 `string` 值显示在屏幕上，即使它看起来像一个数字。\n\n所以，`return`\
  \ 是函数中一个非常重要的机制。实际上，它是函数固有的。我们不能在函数外部使用 `return` 命令。JavaScript 不允许这样做。\n\n### return\
  \ 的目的是什么？\n\n`return` 的目的有两个：\n\na) 以原始形式从函数内部导出数据。\n\nb) 停止并结束函数调用。这很重要。返回机制充当中断的作用，并结束调用函数的行为。`return`\
  \ 语句之后函数中的任何内容都不会被处理，因为 JavaScript 在返回时会退出函数。函数返回后，函数调用将从工作内存中擦除。你现在不需要担心这一点，但知道函数调用不会永远留在内存中是有好处的。它们通过退出来释放空间。这可能是将代码包含在函数中的第三个原因：内存效率。\n\
  \n### 当函数返回时数据会发生什么？\n\n如果我们想重用这些数据进行进一步处理，我们需要捕获返回的数据。否则，它就会在空间中丢失。\n\n*我们如何捕获从函数返回的数据？*\n\
  \n捕获它的方法是将返回的值赋值给变量。换句话说，将 `function call` 赋值给变量。\n\n在图 8 的示例中（见图像下方的链接），与其仅仅调用函数：\n\
  \n```\naddTen(4);\n```\n\n我们可以将其赋值给某个变量：\n\n```\nvar y = addTen(4);\n```\n\n现在 `y`\
  \ 持有值 14。函数调用被从内存中擦除，但值被变量 `y` 保留了。\n\n- **总结来说**，如果我们需要在脚本后续使用来自函数的数据，则需要将其 `return`\
  \ 返回并赋值给变量。当我们通过 `console.log()`、`alert()`、`prompt()` 或 `confirm()` 从函数输出数据时，我们只是在显示它，而不是保留它。\n\
  \n## 2.4 实验工作 6\n\n准备好更多实验工作了吗？\n\n### 创建一个将华氏度转换为摄氏度的程序\n\n[优先级](http://en.wikipedia.org/wiki/Order_of_operations)\
  \ 决定了运算符评估的顺序。JavaScript 的优先级接近数学优先级：\n\n- 括号在乘法或除法之前评估，\n  乘法或除法在减法或加法之前评估。\n \
  \ 在相等的情况下，操作数从左到右、从括号内部向外评估。\n  ……不需要记忆，多练习即可。\n\n以下是将华氏度转换为摄氏度的公式：\n\n从变量 `F` 中减去\
  \ 32，\n\n然后将结果乘以 5，\n\n然后将新结果除以 9。\n\n我们需要将减法包含在括号内，以便它先执行。然后写乘法，以便它在最后的除法之前执行（除法应该放在其右侧）。公式看起来如下：\n\
  \n`(f - 32) * 5 / 9`\n\n那是最难的部分。现在我们来写代码。\n\n1- 创建一个名为 `f2c` 的函数，接收一个名为 `f` 的输入参数。\n\
  \n2- 在函数内部将公式的结果发送到屏幕。\n\n换句话说，使用 `console.log()` 打印到屏幕上。这是因为我们只想显示它，而不是重用它。注意输入参数名称\
