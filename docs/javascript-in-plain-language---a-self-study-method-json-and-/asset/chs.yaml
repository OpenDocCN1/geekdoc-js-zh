  \ 从 `array` 中移除项。我们还实验了使用 `splice()` 在特定位置删除、替换或添加新项，以及如何使用 `slice()` 复制 `array`\
  \ 的部分。数组的 `sorting`（排序）呢？以及如何使用 `join()` 将 `array` 转换为字符串。\n\n\n\n\n从函数输出数据的另一种方法是在内部重新赋值外部变量，因为函数可以访问外部变量。至于\
  \ `console.log()`，它只是在屏幕上显示数据的一种方式，并且始终以 `string type` 格式）显示。\n\n这就是全部了，简而言之就是近\
  \ 200 页的乐趣。\n\n## 3.2 更多关于函数\n\n### 什么是表达式（expressions）和语句（statements）？\n\n在本书中，我们一直非正式地使用“表达式”和“语句”这两个术语。现在是停下来思考这些术语了，因为它们有特定的含义。\n\
  \n- 一个 `statement`（语句）是一个完整的命令，指示计算机执行特定任务。它通常写成一行（但并非总是），并以分号（`semicolon`）结束。\n\
  \n**语句示例：**\n\n```javascript\nvar z = 1 + 2 + 3;\nconsole.log(\"Hello World\");\n\
  ```\n\n```javascript\nif(z > 2) {\n  console.log(\"yes it is\");\n}\n```\n\n在最后一个例子中，语句从\
  \ `if` 开始，到分号结束。如果你提前放置分号，将会得到错误。这是我们刚开始编程时常见的错误。\n\n我们还提到过几次“return 语句（return statement）”。除了\
  \ return 只允许在函数中使用外，它是作为语句编写的：\n\n```javascript\nreturn 3 + 4;\n```\n\n很多时候语句被组合成由多个语句组成的组，在这种情况下，我们使用大括号来包裹组合语句：\n\
  \n```javascript\nif(z > 2) {\n  console.log(\"yes it is\");\n  console.log(\"z is\
  \ greater than 2\");\n  console.log(\"z is also the last word of the alphabet\"\
  );\n}\n```\n\n注意最后一个大括号并没有以分号结束。只有当我们把代码块赋值给变量时（例如在创建一个对象时），才会在大括号后面放置分号。\n\n**然后我们还有表达式（expressions）。**\n\
  \n表达式是任何可以求值并得到单个单元的内容。例如，当 JavaScript 看到 `3 + 4` 时，它实际上看到的是 7。JavaScript 查看表达式并将其简化为一个单元。和语句一样，表达式无处可见，并且它们可以是同一的。\n\
  \n示例：\n\n```javascript\nvar x = 4;\n```\n\n上面，`var x = 4;` 既是一个语句也是一个表达式。实际上我们有两个表达式。JavaScript\
  \ 查看代码并将表达式细分为：\n\n1- `x`，求值时结果为 4，以及\n2- `4`，其结果为它本身。JavaScript 查看 4，并将其表达为 4 的结果。\n\
  \n```javascript\nif( 10 < 11) { // do something; }\n```\n\n上面，`if(10 < 11)`是一个表达式，因为\
  \ JavaScript 并没有看到字面量 `10<11`，它只看到 `true` 或 `false`（二者一）。JavaScript 并不真正关心 `10<11`\
  \ 本身，它查看它并在内部将其替换为布尔值 `true`。\n\n- 这是理解该语言的一个非常重要的概念：我们编写表达式，JavaScript 存储这些表达式求值的结果。\n\
  \n当然，10 和 11 本身是独立的表达式，但它们没有 `10<11` 的组合那么重要。JavaScript 解释它并将其保存为纯的 `true`。\n\n\
  现在，看上一个 `if()` 示例中的分号。那是语句结束的地方，它从 `if` 开始，在 `..thing;` 结束。\n\n**函数呢？它本身是一个表达式吗？**\n\
  \n以以下函数为例：\n\n```javascript\nfunction x (num1, num2){\n  return num1 + num2;\n}\n\
  ```\n\n上面的函数本身不会求值为任何内容。它可能可能求值为 `num1 + num2` 的和，但只有在调用函数时才会：\n\n```javascript\n\
  x(2,4);\n```\n\n函数在调用时求值为 6。当我们带参数 2 和 4 调用函数 `x` 时，它是如何求值为 6 的？\n\n- `num1` 变成一个表达式，求值为\
  \ 2。\n- `num2` 变成一个表达式，求值为 4。\n- `num1 + num2` 变成一个表达式，求值为 6。\n\n表达式求值是真正理解 JavaScript（或任何其他语言）的一个重要概念。\n\
  \n在下一个主题中，我们将看到如何将函数赋值给变量，使函数和变量的组合成为一个表达式。\n\n记住，声明变量从 `var` 开始。声明函数从 `function`\
  \ 开始：\n\n```javascript\nvar x = 33;\nfunction y (){ }\n```\n\n接下来我们将看到如何将函数作为值赋值给变量，并回答你可能有的常见问题。\n\
  \n### 将函数赋值给变量\n\n到目前为止，我们一直以以下字面方式声明函数：\n\n```javascript\nfunction x () { return\
  \ 5; }\n```\n\n然而，我们也可以这样将函数赋值给变量：\n\n```javascript\nvar x = function() { return\
  \ 5; };\n```\n\n注意末尾的分号。这是因为整个变量声明本身就是一个语句。语句是给 JavaScript 的完整命令句，它们通常以分号结束，从而与下一个语句隔开。\n\
  \n*等一下，我还是不懂。我在像之前做的那样的函数声明中没有看到分号。为什么这一个需要分号呢？*\n\n分号与函数没有关系。函数本身在被调用之前，它不是一个完整的命令语句。当我们调用函数时，例如\
  \ `x();`，我们添加一个分号。之前提到的分号与变量赋值有关。当我们给变量赋值时，我们用分号结束赋值，因为赋值是一个命令句，或者说是一个表达式。\n\n对于任何其他赋值（如数组）也是如此：\n\
  \n```javascript\nvar y = [1,2,3];\n```\n\n或者对象赋值：\n\n```javascript\nvar z = {\"\
  color\": \"green\"};\n```\n\n或者函数赋值：\n\n```javascript\nvar z = function(){ return\
  \ 5; };\n```\n\n### 什么是匿名函数（anonymous function）？\n\n在在上的例子中，该函数被称为 `anonymous`（匿名）函数，因为它没有正式的名字。`z`\
  \ 只是指向它的某个变量。\n\n然而，如果没有 `z`，函数将不复存在，因为浏览器从内存中清除它，因为没有任何东西指向它。内存中的任何孤立对象都会被丢弃，因为它们无法被识别（记住函数也是对象）。\n\
  \n### 使用变量作为指针\n\n说到指针，之前的变量 `z` 指向赋值给它的函数。我们可以通过将 `z` 的“内容”赋值给另一个变量来使用多个指针。\n\n\
  以下函数赋值示例：\n\n```javascript\nvar z = function(){ return 7; };\n```\n\n现在将 `a` 赋值给\
  \ `z`，将 `b` 赋值给 `a` 看看发生了什么：\n\n```javascript\nvar a = z;\nvar b = a;\n```\n\n记住，赋值是从右到左的。\n\
  \n**变量 z 的内容是什么？**\n\n变量 `z` 的内容是 `function(){ return 7; }`。没错，函数脚本（构成函数的单词和符号字符串）就是变量\
  \ `z` 的内容，或者说 `z` 本身求值的结果。我们得到值 7 的唯一情况是在通过在 `z` 后固定一对括号来调用函数时：`z();`。\n\n因为 `z`\
  \ 的值是一个函数脚本，当我们把 `z` 赋值给 `a` 或将 `z` 赋值给 `b` 时，我们赋值的是函数的脚本。这在 JavaScript 中非常强大，这意味着我们可以将现有函数插入程序的任何地方，并根据需要多次使用。\n\
  \n现在我们可以使用三个变量中的任何一个来调用函数：\n\n```javascript\na(); // 返回 7\nb(); // 返回 7\nz(); //\
  \ 返回 7\n```\n\n**总结**\n\n记住，表达式是任何可以求值并得到单个单元的内容。这个单元是 JavaScript 从我们编写的代码中实际看到的，而不是代码在人眼看来的样子。作为程序员，我们需要像计算机一样思考，知道计算机在遇到表达式时会看到什么。\n\
  \n1- 表达式 `z` 的值是什么？\n*Ans*: `function(){ return 7; }`\n2- `z()` 的值是什么？\n*Ans*: 7\n\
  3- 表达式 `a` 的值是什么？\n*Ans*: `function(){ return 7; }`\n4- 表达式 `a()` 的值是什么？\n*Ans*:\
  \ 7\n5- 表达式 `b` 的值是什么？\n*Ans*: `function(){ return 7; }`\n6- 表达式 `b()` 的值是什么？\n\
  *Ans*: 7\n\n\n\n\n为了进一步巩固这个概念，这里有一个与我们的示例无关的问题：\n\n7- 表达式 `if(10 > 5)` 的值是多少？\n\n\
  答：**true**\n\n当我们写 `(10 > 5)` 时，JavaScript 看到的是 true。顺便说一下，对于 JavaScript 来说，`if()`\
  \ 语句中的表达式实际上是一个**问题**。\n\n### 气球概念\n\n问题：\n\n*如果函数是一个被三根绳子 z、a、b 系着的气球，如果我们剪断绳子\
  \ z，气球会发生什么？*\n\n答案：\n\n气球不会发生变化，它会保持原样，因为 `a` 和 `b` 仍然固定着气球。\n\n如果我们把 `a` 和 `b`\
  \ 都剪掉会发生什么？气球会飞走。\n\n如果气球是我们的函数，它也会飞走，进入[垃圾回收](http://en.wikipedia.org/wiki/Garbage_collection_%28computer_science%29)模式，被浏览器从内存中清除。\n\
  \n在接下来的练习中，我们将练习函数*表达式*（赋值给变量的函数），而不是函数声明（我们最初学过的语法样式）。请记住，使用哪种函数都会得到相同的结果，但熟悉两种样式是非常重要的。\n\
  \n### 函数参数和参数\n\n函数可以有*输入参数*，这样当我们调用函数时，就可以传入*数据参数*。很多时候，程序员对这两个含义使用同一个术语，即参数（parameter）或参数（arguments），并且这种用法被接受了，但定义如下：当我们调用函数时，我们将参数传递给参数。参数是一个物理实体、一个接口、一种输入机制，是一个在函数执行结束后被删除的临时变量。\n\
  \n当我们调用函数时，数据参数的顺序将始终与函数括号中输入参数的物理顺序保持一致。\n\n例如：\n\n```javascript\nvar x = function(num1,\
  \ num2){\n  return num1 - num2;\n};\n```\n\n向输入 `num1` 和 `num2` 传递数据的顺序是重要的，因为函数的内部程序是按照输入参数的布局顺序连接的：\n\
  \n```javascript\nx(5, 3);\n```\n\n它将返回值 **2**，因为 `5 – 3 = 2`。\n\n然而，如果我们调用函数并反向写入参数：\n\
  \n```javascript\nx(3, 5);\n```\n\n函数将返回值 **-2**，因为 `3 - 5 = -2`。\n\n简而言之，当我们调用函数时，需要遵守参数的顺序。\n\
  \n* 如果我们调用函数并传入三个参数而不是两个会发生什么？\n\n```javascript\nx(5, 3, 4);\n```\n结果将是 **2**，因为\
  \ `5 - 3 = 2`。最后一个参数 `(4)` 被忽略了，因为函数内部没有处理它的规定。\n\n* 如果我们调用函数时只传入一个参数，尽管函数硬编码了两个输入参数，会发生什么？\n\
  \n```javascript\nx(5);\n```\n\n在我们的情况下，它返回 **NaN**，这是 JavaScript 的属性，代表 Not-a-Number（不是数字），或无效数字。这是因为输出变成了\
  \ `5 – num2` 的减法，而 `num2` 没有被赋值给任何内容，保持为它的原始值 `\"undefined\"`。\n\n例如，在：\n\n```javascript\n\
  var x = function(input1, input2){\n  return input1 + input2;\n};\n```\n\n如果我用两个参数调用函数：\n\
  \n```javascript\nx(\"Tony\", \"deAraujo\");\n```\n\n我得到输出 `\"TonydeAraujo\"`。\n\n\
  另一方面，如果我只用一个参数，它会假设第一个输入参数，而其他输入参数将是 `undefined`：\n\n```javascript\nx(\"Tony\");\n\
  ```\n它输出 `\"Tonyundefined\"`。\n\n* 我们可以在函数中编写多达 256 个输入参数。\n\n不要记忆所有这些，只需花时间理解它并继续前进。\n\
  \n### 对象参数\n\n程序员将输入参数写入函数中，是因为他/她希望拥有某种数据输入序列，在大多数情况下效果非常好。\n\n然而，JavaScript 函数有另一种方式通过对象来接受参数，该对象属于（且仅属于）函数：`arguments`\
  \ 对象（注意使用复数形式）。\n\n`arguments` 对象的作用类似于数组，因为可以通过数值进行访问，但它不是一个功能完整的数组，因为它只[继承](http://en.wikipedia.org/wiki/Prototype-based_programming)了数组家族的一些功能，而不是整个库。\n\
  \n**让我们看看这个对象是如何工作的**。\n\n```javascript\nvar x = function(){\n  return arguments[0]\
  \ + arguments[1].toUpperCase();\n};\n```\n\n上面的函数没有指定输入参数。然而，当我们调用函数时，它会输出我们给它的第一个参数，以及大写的第二个参数，该参数位于位置\
  \ 1（记住，位置和数组一样从 0 开始）：\n\n```javascript\nx(\"tony\", \"dearaujo\");\n```\n返回：`\"\
  tonyDEARAUJO\"`\n\n所以我们仍然可以按照自己的意愿编写函数，而无需指定输入参数。只需使用 `arguments 对象` 通过数值访问每个数据元素即可。\n\
  \n关于 `arguments` 对象，我在我的另一本[书](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)中有更多细节，尽管它写得早，但可以被认为是这本书的第二卷。\n\
  \n## 3.3 使用函数操作变量\n\n### 按值传递数据\n\n到为止，我们一直通过值传递数据。当我们调用函数时，数据是通过**值**传递。另一种传递方式是将字符串传递给另一个。正如你从书中了解的，原始类型变量（如数字或字符串）将值保存在它们自己的位置中。例如，以下变量：\n\
  \n```javascript\nvar x = 33;\nvar y = x;\n```\n`x` 持有 33，`y` 也持有 33。但这是不同的 33 值。数据是按值传递的，因为我们在内存中添加了新数据。\n\
  \n### 按引用传递数据\n\n复杂值（如函数、数组和对象）存储在*堆*中，而指向它们的变量存储在*栈*中。与简单值不同，这些值及其变量是两个独立的实体。\n\
  \n由于它们是两个独立的实体，当我们把指向复杂数据结构的变量赋值给另一个变量时，值并没有被复制，因此这种交换不是按值传递。我们所做的只是分配引用或按引用传递，以便两个变量现在指向同一个地方：\n\
  \n例如数组 `a`：\n\n```javascript\nvar a = [1, 2, 3, 4];\n```\n\n现在将同一个变量赋值给另一个变量：\n\n\
  ```javascript\nvar b = a;\n```\n\n我们没有复制数组、函数或对象的内容。我们现在有两个指向相同数据的变量。记得那个系有三根绳子\
  \ z、a、b 的气球吗？\n\n所以当我们编辑数组 `a` 中的一个值时，我们实际上也在改变数组 `b` 的值，反之亦然，因为它们都指向同一个数组。\n\n\n\
  \n这被称为`引用传递数据`。这里没有复制；这些变量只是指向同一份数据。如果我们删除了其中一个变量或将其赋值为其他内容，数据仍然保持不变，因为还有另一个变量在地方持有着它，就像之前气球发生的那样。\n\
  \n### 函数是闭包结构\n\n在 JavaScript 中，函数是唯一能够[数据结构](http://en.wikipedia.org/wiki/Data_structure）保护其数据免受外界影响的结构。\n\
  \n这意味着什么呢？\n\n这意味着如果我们在函数内部声明一个变量，它在全局作用域（函数外部）是不可见的。\n\n如果我们把全局作用域与外部世界进行比较，那么全局作用域本身也是一个内部作用域，例如不同标签页上的另一个网页。我们在网页上执行的所有操作都是在\
  \ `window` 对象下进行的，该对象封装了整个页面。这与微软的 Windows 名称没有关系。这里的 `window` 指的是显示页面的浏览器外壳，它在任何计算机系统中都称为\
  \ `window`。\n\n对于网页而言，`window` 对象就是该页面的外部世界或`全局作用域`。在 `window` 对象下声明的任何内容都是 `window`\
  \ 对象的属性或方法。\n\n我们实际上可以把 `window` 对象看作创建一个其内部所有其他内容的函数。\n\n当我们声明一个变量时，例如：\n\n```javascript\n\
  var x = 33;\n```\n\n我们在全局作用域中创建了这个变量，这意味着变量 `x` 的父级是 `window` 对象。要调用这个变量，我们写：\n\n\
  ```javascript\nx;\n```\n\n它显示 33。但我们也可以像下面的示例那样调用它，效果是一样的：\n\n```javascript\nwindow.x;\n\
  ```\n\n通过使用点符号语法，我们确保调用的是正确的变量 `x`，而不是来自外外星系的其他 `x`。在大多数情况下，`window` 是被理解的，我们不需要写出它，正如我们在整书中看到的那样。\n\
  \n那么，那些不同的星系又是什么？你可能会问。\n\n还记得我说过，我们可以把 `window` 对象看作一个大函数，它内部包含了所有的网页功能并保护它们免受其他网页的影响吗？\n\
  \n嗯，我没有完全那样表达，但它起到了这个作用，即每个函数都充当自身数据的保护性父级。在 JavaScript 中，函数是闭合的数据结构。\n\n我们实际上可以在函数内部声明另一个变量\
  \ `x`，因为 JavaScript 会接受它而不会产生冲突，即使它知道已经声明了一个全局变量的 `x`。这是因为全局作用域看不到函数内部的 `x`。\n\n\
  然而，函数可以看到外部的变量 `x`。没错！函数可以访问全局变量，因为函数与它们是兄弟关系。函数可以看到外部变量世界，但外部世界看不到函数内部的内容。函数的兄弟们可以看到该函数，但它们看不到函数内部的东西。好消息是，JavaScript\
  \ 总是会选择被调用的最近的标识符。我的意思是，如果我们从函数内部调用 `x`，JavaScript 将抓取第一个看到的 `x`，即函数内部的那个。所以，即使函数外部有另一个\
  \ `x`，且我们知道函数可以访问它，但只要我们从函数内部引用 `x`，内部的 `x` 就会是 JavaScript 的首选。\n\n例如：\n\n```javascript\n\
  var x = 33; var test = function(){\n  var x = 5;\n  return x;\n};\n```\n\n调用函数 `test`：\n\
  \n```javascript\ntest();\n```\n\n它返回 5。\n\n那么，如果我们想在函数内部使用外部 `x` 的值，该如何从函数内部引用外部\
  \ `x` 呢？\n\n我们会考虑到 `window.x`。\n\n我们将我们将看到如何从函数内部访问全局 `x`。\n\n### “This” 作为对象占位符\n\
  \n如果我们想返回外部变量 `x` 而像上一个示例那样返回内部 `x` 会怎样？\n\n在这种情况下，我们必须使用点符号语法来引用全局 `x`：\n\n```javascript\n\
  var x = 33; var test = function(){\n  var x = 5;\n  return window.x;\n};\n\ntest();\n\
  ```\n\n现在它返回 33，这是外部的 `x`，而不是值为 5 的内部 `x`。这是因为 `window.x` 的是全局变量 `x`，它是 `window`\
  \ 对象的子级。\n\n由于 JavaScript 是极具动态的，而且由于我们应该编写尽可能可移植的代码（适用于任何对象，而不仅仅是 `window` 对象），程序员们想出了一个通用的占位符，用来正确引用当前调用变量的对象。\n\
  \n这个占位符就是单词 `this`。\n\n如果在执行时用 `this.x` 替换 `window.x`，JavaScript 将搜索拥有被调用属性的对象，并将占位符\
  \ `this` 替换为正确的名称，在我们的案例中，该名称是 `window` 对象。\n\n但你可能会问，函数 `test` 不也是一个对象吗？如果是，那么\
  \ `this.x` 的所有者不应该是函数本身，而不是 `window` 对象吗？\n\n并不是（这是一个非常棒的问题）。调用函数 `test()` 动作的所有者是谁？\n\
  \n答：`window` 对象拥有命令 `test()`。\n\n现在，如果函数 `test()` 是其他对象内部的方法，那么 `this` 将就不再代表 `window`，它将代表另一个对象。\n\
  \n正如下面的示例所示：\n\n```javascript\nvar x = 33; var myObject = {\n  x: 7,\n  test: function()\
  \ {\n    var x = 5;\n    return this.x;\n  }\n};\n```\n\n这里我们有一个值为 33 的全局 `x`，一个属于\
  \ `myObject` 值为 7 的 `x`，以及函数内部值为 5 的另一个 `x`。当我们调用方法 `test()` 时：\n\n```javascript\n\
  myObject.test();\n```\n\n它输出 7，这是属于 `myObject` 的第二个 `x`。`this.x` 的所有者不再是 `window`\
  \ 而是 `myObject`。我之前强调过 `this` 是在“执行时”赋值的，不仅是因为替换发生在执行时而不是早期，还因为属性的所有者可能会从声明到调用之间发生变化。\n\
  \n## 3.4 练习 12\n\n 部分 A：表达式、语句、参数\n\n（我的答案链接将发布在页面末尾。你可以在论坛回答问题，因为在点击单个答案按钮之前答案是不可见的。）\n\
