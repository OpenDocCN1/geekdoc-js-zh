  show(portugese);\nshow(spanish);\n```\n\n你可能会在输出句子后看到屏幕显示 `undefined`。这在测试控制台中是正常的。它只是告诉我们\
  \ `show()` 函数没有显式地返回任何内容，因此它会自动返回 `undefined`，因为 JavaScript 函数总是返回某些内容的。\n\n通过以下链接查看最终版本：\n\
