  \n\n\n\n\n## 5.5 进一步走向模块化\n\n### 为 ng-app 分配模块名称\n\n模块化编程是一种设计技术，它强调*将程序的功能拆分为独立的模块*，并且使得每个模块都包含执行目标结果的某一方面所需的所有内容。\n\
  \n模块是 `app` 中不同部分的容器，包括相关的控制器（controllers）、服务（services）、过滤器（filters）和指令（directives）。\n\
  \n你的网页 `app` 就是一个模块。\n\n在我们的网页中，当我们在 HTML 标签上声明 `ng-app` 时，我们实际上是在创建一个模块（我们之前使用的是未命名的模块）。我们之所以没有给测试网页（或模块）命名，是因为一旦命名，在配置好“模块接口”（`module\
  \ interface`）之前它就会停止工作，这意味着我们需要在 `<script></script>` 块内编写声明，以正式地向 AngularJS 注册该模块。\n\
  \n这就是为什么我们将 AngularJS 的声明保持得尽可能简单，只声明了：\n\n```html\n<html ng-app>\n```\n\n然而，一种常见的最佳实践是通过赋予一个模块名称来为网页命名，例如：\n\
  \n```html\n<html ng-app=\"nameOfTheModule\">\n```\n\n`nameOfTheModule` 是该网页在 AngularJS\
  \ 中的身份标识，你可以使用任何喜欢的名称。\n\n除了命名模块是最佳实践外，如果你让页面变得比我们目前所做的更复杂，那么它是强制性的。当然，为了快速测试，我们可以像这样创建一个未命名的\
  \ `ng-app`：\n\n```html\n<html ng-app=\"\">\n```\n\n这里要小心，如果你使用了引号但没有名称，请确保引号之间没有空格，因为该空格会让\
  \ AngularJS 认为模块已命名，导致你会因为文件中没有该名称而报错。\n\n我最喜欢的测试语法仍然是 `ng-app`（或者为了兼容 HTML5 验证而使用\
  \ `data-ng-app`）。只有当我确实有一个需要包含的模块名称时，我才会使用扩展，这正是我们接下来要做的。\n\n### 配置模块接口\n\n一旦我们为\
  \ `ng-app` 分配了名称，我们就必须配置该模块。\n\n以我们做的最后一个练习（**部分 B：初始化变量和输出计算结果**）为例。这个练习简单到足以帮助我们理解如何配置应用名称模块：\n\
  \n![](img/0002.jpeg)\n\n图 27（还没有应用模块名称）\n\n在上面的图片中，`ng-app` 没有名称且运行运行良好。\n\n但是，如果我们在\
  \ `<html ng-app>` 中插入一个名称，例如：\n\n```html\n<html ng-app=\"myFirstAppModule\">\n```\n\
  \n那么页面在配置模块接口之前将停止工作。\n\n配置应用模块的一种方法是在 HTML 页面 `BODY` 底部、指向 AngularJS 的链接正下方，打开一个新的\
  \ `<script></script>` 容器。\n\n在脚本容器中，我们将一个函数调用赋值给某个变量（例如 `x`）。这个特定的函数或方法来自 Angular\
  \ 库，它的名称是 `module`。示例代码：\n\n```javascript\nvar x = angular.module();\n```\n\n下方可以看到此赋值的图片，但请先让我完成对该赋值的解释。\n\
  \n在我们将 `module()` 赋值给变量 `x` 之后，我们将 `app` 的名称作为 `module()` 方法的第一个参数引入。第二个参数是一个空数组，它看起来应该如下：\n\
  \n```javascript\nvar x = angular.module(\"myFirstAppModule\",[]);\n```\n\n传统上，变量\
  \ `x` 会根据模块命名，我们在该声明中会有两个 `myFirstAppModule` 单词（这些术语的重复不会产生冲突，因为它们位于代码的不同区域，但了解变量\
  \ `x` 的用途将有所帮助）。然而，由于名称匹配不是强制性的，我将其命名为 `x`，以刻意说明模块名称所在的位置，以及它与变量无关。\n\n这个声明目前足够让我们的\
  \ `ng-app` 重新恢复活力。\n\n请仔细研究以下图片。\n\n![](img/00029.jpeg)\n\n图 28（在给 ng-app 命名后，我们随后将该名称注册为模块）\n\
  \n自己尝试一下。获取你的原始文件（[原始原始文件](http://icontemp.com/jpl/ang14/ang8.txt)），为你的 `ng-app`\
  \ 添加一个名称，并在 `BODY` 底部编写声明以向 Angular 注册模块。注意模块名称是如何在引号内引入函数 `module()` 的。它是作为字符串传递的。\n\
  \n如果你需要帮助，请查看我的文件：\n\n[最终原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。\n\n**进一步解释：**\n\
  \n查看变量 `x` 的声明。`x` 被赋值给属于对象 `angular` 的函数。这个名为 `module()` 的函数接受两个参数。第一个参数是包含我们要声明的模块名称的字符串。然后，用逗号隔开的是一个空数组。它们都需要被声明。\n\
  \n数组的目的是包含为正在创建的模块未来的依赖项。有时我们希望使用其他子模块来增强这个特定的模块。由于使用其他相关模块非常常见，因此第二个参数是硬编码的，在声明新模块时必须包含它。在我们的情况下，我们只需写一个空数组，它就能工作。但是，如果你跳过了\
  \ `[]`，模块将无法工作。我们必须在那里放置这两个括号。\n\n## 5.6 准备分离数据\n\n### 创建控制器\n\n恭喜，我们正在稳步地进入实际演示。\n\
  \n稳步地进入 AngularJS 的实际演示。请耐心等待，我们快完成了。\n\n到为止，我们一直在使用 `ng-init` 初始化动态数据。\n\n![](img/0030.jpeg)\n\
  \n图 29（ng-init 将被页面底部的控制器取代）\n\n我们需要向正确标记的文件进行分离，但我们还没到那一步。我的意思是，我们应该能够在一个页面中看到整个画面，这正是我们在课程中所做的：学习\
  \ Angular 的基础部分。在这里将代码拆分到文件夹会增加不必要的复杂，我们现在不想这样做。\n\n我们接下来要执行的是停止在页面顶部使用 `ng-init`\
  \ 编写数据，并将数据对象移动到页面底部（在我们插入模块声明的同一个脚本中）。我们的 JavaScript 代码将编写在 `controller` 内部，这是一个特殊的\
  \ AngularJS 函数（我们刚刚创建的模块的方法或属性）。\n\n因此，现在我们将网页的主体分为以下概念区域：\n\na) **标准 HTML 标记**和它的普通数据，即不需要\
  \ AngularJS 影响的数据。这些数据实际上位于页面的任何位置，因为动态数据将如所示封装在块中。\n\nb) **我们希望 AngularJS 显示某些动态数据的区域**。该区域被称为\
  \ `view`。AngularJS 在页面中注入许多微动态 `view`，它们与其余 HTML 演示混合在一起。取决于你真正想做什么，它可能只有一个 `view`\
  \ 或多个 `view`。\n\n\n\n\n\n我们将从上一个练习中移除 `ng-init`，并将数据插入控制器中，但首先，让我们看看控制器的基本结构。让我们从一个空控制器的图像开始：\n\
  \n![](img/00031.jpeg)\n\n图 30 (控制器是模块 x 的子级。JavaScript 代码位于控制器中)\n\n控制器函数是模块的子级，在我们的示例中，它被赋值给变量\
  \ `x` 以于实现控制器（`x` 成为整个模块声明的快捷方式）。因此，将模块 `myFirstAppModule` 赋值给 `x`，然后从变量 `x` 中提取\
  \ `controller` [第 3 行]。在控制器方法内部，有两个参数。第一个参数是我们给控制器的名称，格式为字符串类型（我将其命名为 'myFirstController'）；第二个参数是一个名为\
  \ `$scope` 的 AngularJS 对象。`$scope` 是一个 Angular 对象，用于跟踪我们即将发送到网页上的所有数据和属性，正如我们很快看到的。注意所有这些代码都在\
  \ `SCRIPT` 标签内 [第 1 行和第 7 行]，该标签声明了 `ng-app=\"myFirstAppModule\"` 模块。\n\nAngularJS\
  \ *神奇地* 让 HTML **view**（分配给此控制器的视图）可以使用我们在控制器内部编写并分配给对象 `$scope` 的任何代码和数据。\n\n我们可以说\
  \ `$scope` 是 `controller` 和页面 `view` 之间的胶水。控制器与页面视图没有任何关系，因为它应该是应该是以通用方式编写的。我的意思是，我们可以有多个不同的视图使用来自控制器的相同数据：一个用于桌面屏幕的视图，另一个用于手机的视图等。这由\
  \ `$scope` 来与外部视图世界进行接口，而 AngularJS 在后台提供了此类功能。\n\n在开始练习之前，让我总结一下一些概念，以帮助你进一步理解正在发生什么。\n\
  \n### $scope\n\n`$scope` 是一个映射整个页面 (DOM) 并创建可以访问的属性的对象。在某种意义上，它类似于并行的 DOM。稍后你会看到，我们将\
  \ `$scope` 添加到控制器，然后可以将变量和函数添加到 `$scope` 中，这些内容反过来对网页应用可用。（注意：`$` 看起来像字母“S”，对吧？这提醒我们\
  \ `$scope` 是一个 AngularJS 服务）。\n\n### View (视图)\n\n视图是应用中将放置在显示器上的区域。就像图像、视频或其他嵌入文本一样，我们可以在一个页面上有多个视图，它们可能是硬编码的，也可以从不同的源链接。与\
  \ HTML 标准呈现方式相反，`view` 数据不是持久的，这意味着它会根据 `$scope`（来自分配的控制器）提供的逻辑，或者用户与页面交互的行为而发生变化。视图是由标准\
  \ HTML 元素结合 AngularJS 的数据绑定、指令增强以及花括号 `{{}}` 创建的。\n\n*   任何复杂逻辑都应该放在控制器中，让 `$scope`\
  \ 管理将此逻辑馈给视图。这并不意味着视图不能有任何逻辑；简单的表达式可以放在视图中，正如我们在之前的第一次练习中做过的那样。\n\n### Controller\
  \ (控制器)\n\n控制器是编写在页面运行时执行的 JavaScript 代码的地方。\n\n控制器的目的是提供 AngularJS 所需的逻辑，以初始化对象\
  \ `$scope`，该对象是像 DOM 一样映射网页的标识。\n\n在使用带有 `$scope` 的控制器之前，我们一直使用简单的 `ng-init` 来保存和初始化数据，但那是一个非常有限的实现。`$scope`\
  \ 是一个更强大的对象，也是声明我们的属性和方法的适当方式。\n\n下一张图像显示了我们如何以及在哪里实现之前分配给 `ng-init` 的数据：\n\n![](img/00032.jpeg)\n\
  \n图 31\n\n如所示，所有的 JavaScript 代码都被视为 `$scope` 的属性子级。AngularJS 将获取 `length` 和 `width`\
  \ 并将其保存为 `$scope` 的一部分（记住，`$scope` 将管理 DOM，这就是事物显示的方式和位置）。\n\n只剩下一件事了。我们现在有一个 `app\
  \ name`，并且有一个带有待处理 JavaScript 变量的 `controller`。当我们打开页面时，AngularJS 如何知道在段落的哪里显示这些变量？\n\
  \n提醒一下，这是我们在旧练习的 HTML BODY 中的内容：\n\n![](img/00033.jpeg)\n\n图 32\n\n答案是，我们应该将整个段落封装在一个\
  \ DIV 中，并将 DIV 赋值给名为 `myFirstController` 的控制器：\n\n![](img/00034.jpeg)\n\n图 33 (我们将段落封装在分配给\
  \ myFirstController 的 div 中)\n\n### 轮你了：为你的练习添加控制器\n\n现在，让我们修改之前的练习，为它添加一个控制器。\n\
  \n这是我们在添加模块 `myFirstAppModule` 后留下的原始[原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。\n\
  \n1.  将控制器添加到脚本容器中，位于模块声明下方一行，如图 30 所示。\n2.  将 `length` 和 `width` 赋值给 `$scope`，如图\
  \ 31 所示，然后从你的页面中移除 `ng-init`。\n3.  将你的段落封装在 DIV 中，并将 DIV 赋值给控制器，如图 33 所示。\n4.  测试你的\
  \ HTML Angular 应用。这是我自己的版本：\n\n[原始文件](http://icontemp.com/jpl/ang14/ang8c.txt) |\
  \ [原始文件](http://icontemp.com/jpl/ang14/ang8c.txt)\n\n### 代码 length 和 width 的另一种方式\n\
  \n我们现在有一个 `app name`，并且有一个带有待处理 JavaScript 变量的 `controller`。\n\n```javascript\n\
  $scope.myPerimeter = {\n    \"length\": 9,\n    \"width\": 3\n};\n$scope.length\
  \ = 9;\n$scope.width = 3;\n```\n\n```html\n{{myPerimeter.length}}\n{{myPerimeter.width}}\n\
  ```\n\n```html\n{{myPerimeter.length * 2}}\n{{myPerimeter.width * 2}}\n```\n\n###\
  \ 创建一个程序将华氏度转换为摄氏度\n\n我们*不会*从头开始创建这个程序，因为我们之前在**实验 6** 学习 JavaScript 时已经已经做过了。\n\
  \n[论坛](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/) | bit.ly/1Dp2k\n\
  \n文件](http://icontemp.com/jpl/f2c.txt) | bit.ly/1ruKrzi\n\n我们要做的是创建一个*应用*，在 HTML\
  \ 页面上显示结果。\n\n这个主意是练习在页面上设置 AngularJS，并练习在控制器中包含代码实现的方法。\n\n这是我的示例的配谱：\n\n-   **模块名称：**\
  \ `myAppModule`\n-   **控制器名称：** `myController`\n-   **显示结果的变量：** `result`（提示：它在控制器中是\
  \ `$scope.result`）。\n-   **动态显示的句子：** *100 华氏度等于 37.778 摄氏度。*\n\n**注意：** 在调用函数时，确保将原始的\
  \ `f2c(212)` 更改为 `f2c(100)`。\n\n准备好挑战了吗？\n\n请自己完成练习。这是一个摘要指南：\n\n1.  创建你的 HTML 骨架。\n\
  \    [原始文件](http://icontemp.com/jpl/ang14/ang1.txt)。\n2.  链接 AngularJS（如果你使用的是启动文件，这已经完成了）。\n\
  3.  添加 `ng-app` 指令（已完成）并将其命名为 `myAppModule`。\n4.  在 AngularJS 链接下方添加一个新的 Script\
  \ 容器，并在其中声明你的模块。（我将其赋值给变量 `x`）。\n5.  在模块声明下方添加你的控制器。控制器的名称是 `myController`，它属于变量\
  \ `x`。在它的参数中，显示了一个带有控制器名称的字符串，在用逗号分隔后，第二个参数引入了一个传入 `$scope` 的函数。\n6.  在控制器中添加华氏度到摄氏度的转换函数。\n\
  \n这里有几种替代方案。让我解释一下：\n\n\n\n\n\na) 首先在此处获取原始 JavaScript 脚本副本：[原始文件](http://icontemp.com/jpl/f2c.txt)。\n\
  \nb) 我们需要将 `console.log` 替换为 `return`，因为我们正在捕获结果并将其发送到 `$scope`以便进行显示。\n\nc) 现在我们有两个选项（参见步骤\
  \ c 到 f）：\n\n我们可以通过这种方式将函数 `f2c` 赋值为 `$scope` 的一个属性：\n\n```javascript\n$scope.f2c\
  \ = function(f){return ((f-32) * 5 / 9);}\n```\n\nd) 然后，当我们进入 HTML 页面视图时，我们可以通过这种方式实现结果：\n\
  \n```html\n{{f2c(100)}}\n```\n\ne) **或者**（这是更好的方法，因为避免了在 HTML 视图中使用 JavaScript），我们可以将原始函数插入到控制器中（`console.log`\
  \ 除外），然后给 `$scope` 赋值一个变量（例如 `result`），其值为函数调的结果。\n\n```javascript\nx.controller('myController',\
  \ function($scope){\n  function f2c(f){\n    return (f-32) * 5 / 9;\n  }\n  $scope.result\
  \ = f2c(100);\n})\n```\n\nf) 如果我们使用选项 (e)，我们就可以在视图中这样应用变量 `result`：\n\n```html\n\
  {{result}}\n```\n\n7- 在 HTML 页面的 BODY 中通过添加一个 DIV 容器创建一个视图。\n\n将起始 DIV 标签链接到 `ng-controller=\"\
  myController\"`。\n\n8- 在 DIV 容器内部添加带有以下消息的段落：\n\n```html\n<p>100 degrees Fahrenheit\
  \ is {{YOUR CODE HERE}} Celsius.</p>\n```\n\n9- 在显示 YOUR CODE HERE 的地方，根据你在 (c)\
  \ 或 (e) 中编写的控制器 JavaScript 方式，将其替换为选项 (d) 或选项 (f)。\n\n10- 保存并测试你的应用。显示结果应为：\n\n\
  100 degrees Fahrenheit is 37.77777777777778 Celsius\n\n完成后，将其与我此处的结果进行对比：\n\n[论坛](http://jsplain.com/javascript/index.php/Thread/42-Lab-15c/)\
