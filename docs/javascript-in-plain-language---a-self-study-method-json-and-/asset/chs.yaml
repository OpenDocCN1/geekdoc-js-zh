  \n## 3.5 更多分支技术\n\n### switch\n\n到目前为止，我们学习了 `if()`、可能的 `else if()` 和可选的 `else`\
  \ 条件语句，对吧？\n\n```javascript\nif(true) {\n// 执行此项；\n} else if(true) {\n// 执行那个；\n\
  } else {\n// 转而执行这个；\n}\n```\n\n\n\n\n\n你可以通过上述 `if`、`else` 的这种强大组合来实现任何可能的结果。\n\
  \n然而，有时另一种分支类型会更有意义。我指的是被称为 `Switch` 的那种，我只是想确保对它进行了解释，以防你可能需要使用它。\n\n它之所以被称为 `switch`，是因为有多个可能的结果，JavaScript\
  \ 据此做出可执行的决策。这些可能的结果都处于 `off`（关闭）状态， JavaScript 将根据一个匹配的布尔条件将其中一个设置为 `on`（开启），正如我们接下来将看到的。\n\
  \n这里是布局图：\n\n![](img/00016.jpeg)\n\n图 16\n\n在第 1 行我们声明了一个 `switch`。这个 switch 函数方法接收一个条件，JavaScript\
  \ 将根据该条件比较所有结果，以选择其中一种可能的执行方式。\n\n在我们的通用示例中（基于我们拥有的 cases），“匹配条件”应该被替换为 `1`、`2`\
  \ 或 `3`，这样它就能匹配这些 cases 之一。如果其中任何一个匹配条件，JavaScript 就会执行 `case` 提供的代码。布尔值 `true`\
  \ 是解锁该 case 的关键。\n\n示例：如果正确的 case 是 3，JavaScript 将询问：\n\n“是 1 吗？答案：false”，\n\n“是\
  \ 2 吗？答案：false”，\n\n“是 3 吗？答案：true”，运行代码，\n\nBREAK 并结束。\n\n在执行完一个 `case` 后，JavaScript\
  \ 将由于随后的 `break` 命令而退出 `switch`。如果我们不包含 `break` 命令，那么 JavaScript 将继续寻找更多可能的结果，你可能会有多个正确答案而不是只有一个。即使没有其他正确答案，JavaScript\
  \ 仍然读取所有其他条件，如果 switch 中编写了成千上万种，这可能会导致延迟。因此，`break` 是一个非常重要的实现。\n\n当没有匹配的条件时，可选的\
  \ `default` 将接管作为最终的 `true` 选项并执行其代码。注意，我没有在 `default` 之后包含 `break`。你可以这样做，但没有必要，因为\
  \ JavaScript 此时已经退出了 `switch`。\n\n欲了解更多信息，请访问 `forum` 上的[这篇文章](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)\
  \ | bit.ly/1r4XRCL。让我们用 switch 练习一下。\n\n## 3.6 实验 13\n\n### 13a: Switch - 使用布尔匹配\n\
  \n此脚本将使用具有 4 种可能结果的 `switch`。用户将尝试猜一个数字，程序将显示反馈信息：`too low`（太低）、`too high`（太高）、`right!`（正确！）或\
  \ `That’s not a number`（那不是数字）：\n\n1. 在名为 `guessNum` 的函数内部创建一个 `switch`。\n2. 该函数接收一个输入参数\
  \ `num`。\n3. `switch` 应该硬编码为 `true`。\n\n示例：`switch(true)`\n\n4. cases 应该具有以下条件：\n\
  \   - `num <= 3` 显示 \"too low\"\n   - `num >= 5` 显示 \"too high\"\n   - `num ===\
  \ 4` 显示 \"right, the number was 4\"\n   - 对于 `default` 使用 \"*That's not a number*\"\
  \n\n5. 通过传递数字参数来调用函数，例如：\n```\nguessNum(2);\nguessNum(7);\nguessNum(4);\nguessNum(\"\
  a\");\n```\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n    [论坛板块](http://jsplain.com/javascript/index.php/Thread/32-Lab-13a/)\
  \ | bit.ly/1qqwkWc\n    或直接查看[原始文件](http://icontemp.com/jpl/switch1.txt) | bit.ly/1r50ODq\n\
  *   思考表达式。`num <= 3` 将被转换为 `true` 或 `false`。所有其他 case 也是如此，因此 switch 要匹配的应该是布尔值\
  \ `true`。\n\n### 13b: Switch - 使用字面量匹配\n\n在下一个项目中，我们将使用以下内容：\n\n* 一个名为 `myFavColor`\
  \ 的函数，\n* 使用 `prompt()` 获取用户输入，该输入将转换为小写以匹配其中一个 case。（（JavaScript 是区分大小写的）。\n* 使用一些\
  \ `confirm()` 输出，这样我们就不必总是使用 `console.log`，\n* 以及关于 `color` 的一些有意义的语句。\n\n语句如下（你可以随时创建自己的，或从这个[原始文件](http://icontemp.com/jpl/colors1.txt)\
  \ | bit.ly/1ypn1A2）复制）：\n\n* 绿色是平衡与增长的颜色。\n* 蓝色是信任与和平的颜色。\n* 靛色是直觉的颜色。\n* 紫色是想象的颜色。\n\
  * 橙色是社交与乐观的颜色。\n* 对歉，系统中还没有这种颜色！\n\n1. 请记住：创建函数的目的是再次调用程序而无需重新输入。它在测试目的和现实生活中都非常好用。因此，整个\
  \ `switch` 应该封装在一个函数中。请自由选择你偏好的函数样式：函数声明或赋值给变量的函数表达式。\n\n我将使用第一种：\n```\nfunction\
  \ myFavColor() {}\n```\n\n2. 在函数内部，将 `prompt()` 赋值给变量 `color`。\n3. `switch` 表达式应该是\
  \ `color` 的值：\n```\nswitch (color) {\n```\n4. 每个 case 都需要是小写：\n```\ncase \"green\"\
  :\n```\n5. 每个 `case` 的输出应该是 `confirm()` 后跟一个 `break`：\n```\nconfirm(\"Green is the\
  \ color of balance and growth.\");\nbreak;\n```\n6. 当没有颜色匹配时，由 `default` 执行接管（不需要\
  \ break）：\n```\ndefault:\nconfirm(\"Sorry, that color is not in the system!\");\n\
  ```\n7. 最后，不要忘记两个大括号：一个用于 switch，另一个用于函数（在顶部的红色字样所示）。\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n\
  \    [论坛板块](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/) | bit.ly/Zca\n\
  \    或直接查看[原始文件](http://icontemp.com/jpl/colors2.txt) | bit.ly/1DwVB\n\n要测试你的脚本，调用函数并遵循提示：\n\
  ```\nmyFavColor();\n```\n\n### 13c: 重复的 switch\n\n有时我们希望脚本重复运行，例如在游戏中，直到我们专门决定退出。\n\
  \n为了让我们之前的脚本可以重复运行，我们所做的是在关闭函数之前调用函数 `myFavColor()`，这样就会触发游戏的新实例。\n\n当我第一次引入 `confirm()`\
  \ 机制时，我提到过 `confirm()` 在点击确定时返回布尔值 `true`，点击取消时返回布尔值 `false`。我们可以捕获这些返回的数据来触发新的函数调用，一种方法是在关闭函数之前添加以下代码（变量名\
  \ `replay` 是任意的）：\n\n```\nvar replay = confirm(\"点击确定重玩，或点击取消退出\")\n\nif (replay\
  \ === true) {\n  myFavColor();\n}\n\n} // 这个括号已经存在，它是底部最后一个\n```\n\n所以从意义上说，我们从\
  \ `confirm` 机制获取布尔值 `true` 并重用它来调用 `myFavColor()`。\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n\
  \    [论坛板块](http://jsplain.com/javascript/index.php/Thread/34-Lab-13c/) | bit.ly/1ogVffh\n\
  \    或直接查看[原始文件](http://icontemp.com/jpl/colors3.txt) | bit.ly/1vdaYQT\n\n### 13d:\
  \ 使用 while 循环重复脚本\n\n我们还没有介绍过 while 循环。我们涵盖过的循环只有用于数组的 `for` 循环和用于对象的 `for in` 循环。\n\
  \n***while loop*** 是一种无限运行，直到某些事情触发循环退出。\n\n\n\n\n`while loop` 循环的一个流行例子是扫描计算机键盘的机制。`while\
  \ loop` 会持续读取键盘的输入，直到它接收到某个按键的信号，该信号反过来触发另一个机制。\n\n`while` 循环的设计如下：\n\n```javascript\n\
  while(this Boolean expression is true){\n  // do this stuff;\n  // something to\
  \ change the condition to false in order to end the loop;\n}\n```\n\n在某个操作触发布尔值\
  \ `false` 之前，`while loop` 将一直运行。\n\n我们可以在之前的颜色描述游戏中使用这个 `while` 循环，让 `switch` 无限运行，直到用户点击\
  \ `confirm()` 的 `cancel` 按钮。这样一来，我们就不需要再次调用该函数，我们要做的就是不断让用户输入他喜欢的颜色，直到用户按下 `cancel`\
  \ 按钮。\n\n**那么我们在哪里实现从布尔 `true` 到布尔 `false` 的转换呢？**\n\n我们在每个 `case` 中实现它，因为只有对应的\
  \ `case` 会生效。当用户确认某个 `case` 的输出消息时，如果他们想退出游戏，也有机会点击 `cancel`。在用户按下 `cancel` 之前，游戏将永远进行下去。\n\
  \n请看下面的图来理解我的意思：\n\n![](img/00017.jpeg)\n\n图 17\n\n在第 3 行，我们将整个 `switch` 机制封装在一个\
  \ `while` 循环内部。\n\n当 `replay` 为 `true`（这是它的初始状态）时，`switch` 将运行，循环将不断重启 `switch`，直到我们按下\
  \ `Cancel`（取消）。按下 `ENTER` 等同于按下 `OK`，这意味着运行另一个周期。最终，我们玩腻了这个游戏，点击了确认框上的 `Cancel`\
  \ 选项，这将触发 JavaScript 退出循环。\n\n注意变量 `replay` 的值（它最初是一个布尔值 `true`）在每次提示输出消息时都会被更新。这为用户提供了退出游戏的机会。\n\
  \n它看起来比我们之前做的脚本更专业，如果你对创建游戏感兴趣，这会变得非常有用。\n\n*   在你编写了你自己的版本后，可以将其与我的版本在[论坛板块](http://jsplain.com/javascript/index.php/Thread/35-Lab-13d/)\
  \ | bit.ly/1DwVNYo 进行对比。\n*   或者直接查看[原始文件](http://icontemp.com/jpl/colors4.txt)\
  \ | bit.ly/1sWgeWf\n\n# 第四部分：进入第三领域\n\n**请注意：**\n\n书变得越来越长了！如果你想休息一下，现在是时候了，因为我们接下来要涵盖的内容是补充性的，而不是\
