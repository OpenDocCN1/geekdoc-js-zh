  \ = mySort.slice(1, 3);\n```\n\n## 2.13 实验作业 10\n\n### 构建从数组获取变量的机制\n\n这个练习将回顾变量赋值、创建包含元素的数组、函数声明、变量重新赋值以及\
  \ `indexOf` 的用法。主意是调用函数并选择语言作为参数。然后，根据所选的语言将显示正确的句子。听起来有趣吗？\n\n示例：\n\n调用 `show(english);`\n\
  \n显示此句子：\n\nThe quick brown fox jumped over the lazy dog\n\n* 注意 `english` 没有被引号包裹（并且是小写）。这告诉我们它必须是一个变量名，而不是字符串。\n\
  \n我使用了 [Google 翻译](https://translate.google.com/) 将我的句子从英语翻译成葡萄牙语和西班牙语（后来还有法语）。如果听起来很奇怪，请母语者见谅，我是好的。\n\
  \n***请独立完成练习。最后将提供我自己的文件链接。也将提供中间文件以便你检查工作。***\n\n### 1- 声明名为 *english*、*portuguese*、*spanish*\
  \ 的三个变量。\n\n分别为每个变量分配以下句子：\n\n（方便复制的链接：[原始文件](http://icontemp.com/jpl/fox.txt) |\
  \ bit.ly/1mpqCsr )\n\n\"*The quick brown fox jumped over the lazy dog*\"\n\n\"*A\
  \ ligeira raposa marrom saltou sobre o cão preguiçoso*\"\n\n\n\n敏捷的棕色狐狸跳过了那懒狗\n\n\
  ## 2- 声明一个名为 `langVersion` 的数组，包含以下元素：\n\n`english`, `portuguese`, `spanish`。\n\n\
  记住，由于这些名称已经声明为变量，因此我们不应该给它们加上引号，只需用逗号隔开即可。\n\n这个数组的目的是按顺序保存每个变量。我们难道不能直接使用变量而忽略数组吗？是的，可以的。然而，在大型程序中，这些变量将与其他许多变量一起保存，通过创建一个数组，我们列出了与语言翻译相关的变量，这些变量可以被进一步地操作、编辑、删除，甚至成为更大型语言组的一部分。当然，还有其他方法可以实现这一点，但现在我们正在练习数组，这是一项非常重要的练习。\n\
  \n## 3- 再声明一个名为 `sentence` 的变量，并赋值数值 `0`。\n\n该变量将用于存储我们从数组所有语言中选择的那个语言的索引位置。\n\n\
  我们之所以给这个变量赋值为 0，是为了提前告诉 JavaScript 该变量将是数值类型。实际上，JavaScript 会根据需要更改值的类型，但声明我们的意图是一个良好的习惯，即使这种意图可能只是帮助检查代码的人类，而不是帮助\
  \ JavaScript 处理它。\n\n(指向步骤 1, 2, 3 的方便复制/粘贴链接：[原始文件](http://icontemp.com/jpl/fox1.txt)\
  \ | bit.ly/1Dt7fnS )\n\n## 4- 在你当前代码下方，创建一个名为 `show` 的函数。\n\n该函数的作用是根据我们在调用函数时选择的语言来显示正确的句子。句子将从语言数组中选取。\n\
  \n```\nfunction show() {}\n```\n\n## 5- 为函数引入一个名为 `language` 的输入参数。\n\n## 6- 在函数体第\
  \ 1 行，将已声明的变量 `sentence` 重新赋值为所选语言的位置索引。我们通过使用 `indexOf()` 来查找位置，如下：\n\n```\nsentence\
  \ = langVersion.indexOf(language);\n```\n\n稍后，当我们调用函数时（例如 `show(portugese)`），参数\
  \ `language` 将被传递给函数的任何语言参数所替换。`indexOf(language)` 将为变量 `sentence` 分配该语言正确的数组地址。\n\
  \n## 7- 最后，在下一行且仍在函数体内部，编写一个 `console.log` 来在有人调用函数时显示所选变量的内容：\n\n```\nconsole.log(langVersion[sentence]);\n\
  ```\n\n从步骤 6 中我们知道变量 `sentence` 是数组中某个项的位置索引。\n\n## 8- 将你的代码粘贴到控制台（Console）并调用函数\
