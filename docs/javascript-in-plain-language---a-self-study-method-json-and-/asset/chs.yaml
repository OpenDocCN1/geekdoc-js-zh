  \ `text editor`（文本编辑器）中编写代码，完成后将其复制/粘贴到控制台中。\n\n我确定你的电脑上有某种文本编辑器。不要使用 `Word` 或 `WordPad`，因为它们会添加隐藏的格式代码，干扰你的脚本。Microsoft\
  \ Windows 自带了 `Notepad`（记事本）。记事本非常好用，我每天使用它数百次来过滤从一个来源复制并粘贴到另一个来源的文本，因为它会剔除任何可见或隐藏的格式。但我也会使用其他免费编辑器，例如免费的\
  \ [Notepad++](http://notepad-plus-plus.org/)、[Programmer's Notepad](http://www.pnotepad.org/)\
  \ 以及 [Brackets](http://brackets.io/) 来编写真正的代码。\n\n注意：自 2015 年 5 月起，微软发布了一款非常酷的免费源代码编辑器\
  \ [Visual Studio Code](https://code.visualstudio.com/)，它支持 Windows 7 及以上版本、Linux\
  \ 和 Mac。这非常推荐，但目前我将推荐一个简单得多的来完成练习，你会知道为什么的。请继续阅读。\n\n当然，你可以使用任何你喜欢的 `plain`（纯文本）编辑器，但让我为你介绍一个非常方便的在线编辑器，因为你不需要依赖电脑就可以开始。我每天多次使用这个在线工具，因为它允许我在点击\
  \ `beautify`（美化）按钮时优化代码（创建正确的空格）：\n\n[jsbeautifier.org](http://jsbeautifier.org/)\n\
  \n请 `Bookmark` 该网站。这种安排的唯一缺点是你可以无法直接保存代码，但现在我们不需要保存任何东西，我们正在实验，jsbeautifier 在这方面效果很好，因为它实际上教了我们\
  \ JavaScript 语法应该如何呈现。\n\n### 什么是代码块？\n\n代码块通常是不同语句的集合，组合组合特定的功能。保存代码组的最佳方法是创建一个\
  \ `function`（函数）。我们很快就会接触函数。\n\n代码块通常由左大括号 `{` 和右大括号 `}` 限制（包围）。\n\n这是一个代码块的示例：\n\
  \n```javascript\nvar x = \"Hello\";\nconsole.log(x);\n}\n```\n\n我们将从下一个项目开始使用代码块。\n\
  \n### 代码注释\n\n有时，我们想在代码中做记，，向另一个人类解释某行代码的作用，但我们不希望 JavaScript 在看到我们的注释时抛出错误。\n\n\
  制作注释有两种方法：\n\n1. **使用双正斜杠**。\n\n使用这种风格的注释，我们无法按下 `Enter` 键编写第二行注释。它必须在连续的一行内全部完成：\n\
  \n```javascript\n// 这是一条注释。你好，亲爱的读者，你好吗？\n```\n\n2. **使用斜杠和星号开始注释，使用星号和正斜杠结束注释：`/*\
  \ */`**\n\n这种注释可以跨越你想要的任意行数：\n\n```javascript\n/* 使用这个注释我可以注释一整页内容\n并创建我想要的任何行。从前，在一个非常遥远、名为新泽西的土地（以前被称为\
  \ Schejachbi），那里有一个名为 Lenape 的美国印第安部落... */\n```\n\n让我们进入 `conditional branching`（条件分支），这是进入实际编程非常重要的一步。\n\
  \n## 2.2 条件分支\n\n我们刚刚学习了如何从用户那里获取反馈，但我们无法因此做什么，因为没有工具可以根据用户提供的反馈做出决策。很好，我们现在就要获取这些工具。\n\
  \n假设我们询问用户他/她是否想一起玩，根据用户的回答，我们要么继续玩要么退出程序。这听起来我们需要应用 `if()` `else` 条件代码语句，对吧？\n\n\
  ### if, else 条件语句\n\n要在 JavaScript 中做出分支决策，我们需要了解 `if()`、`else` 条件语句。\n\n分支是指根据分支点呈现的\
  \ `Boolean`（布尔）语句，我们走这条路或走那条路。换句话说，“如果为真走这条路，否则走那条路”。\n\n基础的 `if`, `else` 语法如下：\n\
  \n```javascript\nif(Boolean true) { do this stuff; } else { do that stuff; }\n```\n\
  \n`else` 部分是可选的。\n\n注意 `Boolean true` 这个术语。这是一个许多代码学生在开始时遗漏的重要概念。在括号内部我们有一个 `lock`。无论你在这些括号内写了什么，条件必须始终求值为\
  \ `Boolean true` 才能解锁后续大括号中的代码。`Boolean true` 始终是解锁 `if()` 语句的正确钥匙。只有当该条件为真时，JavaScript\
  \ 才会执行下一个代码块中的代码。另一方面，如果条件求值为 `false`，则代码块将对 JavaScript 隐藏，JavaScript 将退出或执行下一个可用代码块（如果有的话），例如：`else\
  \ { }`。\n\n*   一个 `if()`, `else` 语句在某种意义上是一个逻辑：\n\n    要么执行第一个块，要么执行 `else` 块，但绝者兼者。\n\
  \n*   **请注意：**从现在起，一些实验和理论将并存。请在我们讨论主题时一起编码。**第二部分**将是一场*实践*冒险。\n\n让我们构建一个示例来看看\
  \ `if()`, `else` 是如何工作的。\n\n1- 在你的编辑器（或 [jsbeautifier.org](http://jsbeautifier.org/)）中，将\
  \ `prompt()` 赋值给变量 `x`。\n\n在 `prompt()` 中，询问用户如果他/她想继续就说 `yes`，如果他/她想离开程序就说 `no`。\n\
  \n类似于：\n\n```javascript\nvar x = prompt(\"Would you like to continue? yes or no\"\
  );\n```\n\n2- 构建一个 `if(x === \"yes\")` 语句，在屏幕上打印消息\n\n\"Ok, let's play!\"\n\n否则，在屏幕上打印\
  \ \"Ok, goodbye!\"\n\n编码完成后，如果你使用的是 jsBeautifier，点击“Beautify JavaScript”按钮或按 `CTRL-ENTER`\
  \ 让你的代码更美观。注意编辑器如何调整间隔以符合标准的 JavaScript 样式。\n\n查看下方图片。\n\n![](img/00001.jpeg)\n\n\
  图 1 查看原始文件:( [这里](http://jsplain.com/javascript/index.php/Thread/8-branching1) )\
  \ bit.ly/1uN96zN\n\n\n\n\n\n## 3- 从你自己的编辑器`或从我的链接页面`复制你的脚本并将其粘贴到控制台（Console）上。然后按回车。\n\
  \n如果你遇到错误，请重新检查你的代码。调试是程序员最擅长的事情，因为他们 90% 的时间都花在上面（参见第 4 步，学习如何在控制台上重复执行）。\n\n当提示符出现时，输入不带引号的\
  \ `yes`。如果你的脚本构造得当，你应该会在控制台中看到以下输出：\n\n*Ok，让我们玩吧！*\n\n要从我的个人网站复制代码，请点击代码脚本右侧的`2-page\
  \ 图标`。\n\n## 4- 要重复执行，请将鼠标`聚焦`在控制台上并按`向上方向键`。这会带你回到上一次执行的脚本。从那里开始（如果你需要，可以对其进行编辑），然后按`Enter`\
  \ 再次运行它。\n\n这一次，对提示问题回答 `no`。\n\n你会得到响应：`ok, goodbye!*`\n\n## 5- 你有没有注意到 `prompt()`\
  \ 如何将你带回主浏览器，但随后你必须回过头来看控制台的答案？\n\n你可以将 `console.log()` 替换为 `confirm()` 或 `alert()`，以便在浏览器上也能获得答案。\n\
  \n为了练习目的，将你的第一个 `console.log` 改为 `confirm()`，将第二个 `console.log()` 改为 `alert()`。不要担心这种不一致性，我们只是在练习。\n\
  \n使用 `jsbeautifier` 处的编辑器编写你的脚本。\n\n然后像我们在步骤 3 和 4 中做的那样测试 `if, else` 的两种结果：\n\n\
  ```javascript\nconfirm(\"Ok, let's play!\");\nalert(\"ok, goodbye!\");\n```\n\n\
  ### 复习 if(), else\n\n在 `if(){ do this stuff; }` 括号内部，我们包含一个条件。请记住，解锁代码块的并不是条件本身：而是你在其中编写的\
  \ `question` 的真值（truthiness）解锁了代码。\n\n示例如下：\n\n`if(10 === 10){}` <-- 因为 10 等于 10，JavaScript\
  \ 将该语句求值为 `true` 并解锁下一个代码块。\n\n`if(10 === \"10\"){}` <-- 因为 10 是一个数字而 \"10\" 是一个\
  \ `string`，JavaScript 将该语句求值为 `false` 并跳过下一个代码块而不执行它。\n\n`var x = 33; if(x){}` <--\
  \ 因为 `x` 的值不是 `0`、`undefined` 或 `null`，该语句为 `true`。\n\n`if(!x){}` <-- 因为 `x` 的值不是\
  \ `0`、`undefined` 或 `null`，该语句为 `false`。\n\n`var y = \"yes\";`\n\n`if(y === \"yes\"\
  ){}` <-- 因为 `y` 的值是字符串 `yes`，该语句为 `true`。\n\n`if(y !== \"yes\"){}` <-- 因为 `y` 的值是\
  \ `yes`，该语句为 `false`。\n\n`if(y === \"no\"){}` <-- 因为 `y` 的值是 `yes`，该语句为 `false`。\n\
  \n`if(y === \"no\" || y === \"yes\"){}` <-- 因为其中一个语句为 `true`，所以语句为 `true`。\n\n`if(y\
  \ === \"no\" && y === \"yes\"){}` <-- 因为其中一个操作数为 `false`，所以该语句为 `false`。\n\n###\
  \ 那 else 呢？\n\n`else` 是可选的。我们可以单独使用一个 `if()` 条件语句。然而，我们不能单独使用 `else`，因为 `else` 只是当\
  \ `if()` 失败时的捕获辅助。换句话说，它是 `if()` 的备选方案。\n\n### 在 if(), else 中间添加第二个条件\n\n有时，一个 `if(),\
  \ else,` 不足以涵盖所有结果。在这种情况下，有一个中间语句，它像 `if()` 一样接收条件。这种中间条件被称为 `else if()`。\n\n这里是基本语法：\n\
  \n![](img/00002.jpeg)\n\n图 2\n\n### 如何在条件语句中书写大括号\n\n注意第 1 行的左大括号。这是 JavaScript\
  \ 常见的写法。如果你来自较旧的语言（如 `C`），你可能习惯将左大括号单独写在第二行。这完全没问题。无论你选择哪种方式，请确保不要混合风格。\n\n此外，右大括号始终位于一行的开头（例如：第\
  \ 3、5 和 7 行）。在 `if()` 右大括号之后，我们可以在同一行编写 `else`，或者在适用的情况下编写 `else if`，并以一个左大括号结束该行（参见第\
  \ 3 行）。\n\n最后的右大括号始终单独占据（第 7 行）。这是所有使用大括号的语言通用的。一个非常流行的错误是将右大括号写在最后一个语句的右侧。那样非常难看而且非常难以调试。\n\
  \n有时你会发现没有大括号的 JavaScript 条件语句，它们也是可以的。然而，我不建议这种做法，因为会导致不一致性，并且迟早会触发错误，因为 JavaScript\
  \ 解释器在认为缺少分号时会自动添加分号，而缺少大括号可能会触发解释器认为它已经到达语句的结尾。在掌握这种样式概念之前，请在写完代码后使用 `jsBeautifier`\
  \ 对你的代码进行格式化。\n\n\n\n\n\n在 `line 1` 上，我声明了变量 `x`，值为 15。\n\n在 `line 2` 上，使用了 `&&`\
  \ 逻辑运算符来询问 JavaScript 左右操作数是否都为 `true`。注意每个操作数都必须是具体的。许多新程序员倾向于这样写：`x % 3 && 5 ===\
  \ 0`，JavaScript 无法理解这种语法。每个情况都需要一个独立的布尔条件。\n\n我们可以将每个操作数封装在括号中，以便人类肉眼阅读：\n\n```javascript\n\
  if((x % 3 === 0)) && ((x % 5 === 0))){\n```\n\n如果你这样做，请务必关闭所有的括号。括号的数量应该是偶数。\n\n\
  在 `line 3` 上，我使用 `console.log` 来打印适当的消息。\n\n3- 测试你的脚本以寻找错误并确保获得正确的输出。如果你愿意，可以将 `x`\
  \ 重新赋值为另一个数字（例如 14），并再次运行条件语句。你可以使用 `Up Arrow key` 直到脚本，编辑变量 `x` 并按回车。当 `x` 为 14\
  \ 时，你将不会得到任何输出，这意味着 JavaScript 跳过了代码块，因为条件不再为 `true`。在这种情况下，你会在控制台上看到一条 `undefined`\
  \ 消息。这没关系，它只是控制台的自动回显，对你的脚本没有影响。\n\n**注意：** 将我们的代码项目细分为 `little test steps` 是一个良好的习惯。没有什么比花费一个小时编写脚本，最后却发现它无法运行更糟糕了。\n\
  \n4- 现在我们准备好创建第一个 `else if()` 语句了。\n\n这些条件应该先执行哪一个：\n\n检查是否能被 3 整除的，\n\n还是检查是否能被\
  \ 5 整除的？\n\n在这一点并不重要，因为我们已经解决了同时被两者整除的歧义，但我会按照数字顺序编写，先写 3 的条件。查看下方图片中的第 4 到 6 行：\n\
  \n![](img/00004.jpeg)\n\n图 4（查看原始文件：[这里](http://jsplain.com/javascript/index.php/Thread/9-branching2/)\
  \ ） bit.ly/1uoc1N8\n\n在 `line 4` 上，注意 `else if` 是如何写在上一个 `if()` 结束括号的右侧的。这不是强制性的，但它看起来更专业。\n\
  \n在 `line 6` 上，花括号关闭了 `else if()` 语句。\n\n5- 将你的脚本粘贴到控制台并按回车运行。你仍然应该得到第一个输出，因为变量\
  \ `x` 仍然是 15，这使得第一个条件为 `true`。\n\n为了测试第二个条件，将变量 `x` 重新赋值为 `9`。要更改变量 `x` 的值，按 `Up\
  \ Arrow key` 直到看到整个脚本，将光标放在变量声明处，将值改为 9 并按回车。\n\n现在我们应该得到第二个输出：`x is divisible by\
  \ 3`，因为 9 可以被 3 整除。\n\n6- 是时候编写最后的 `else if` 以及最后的捕获器 `else` 了。查看下一张图片：\n\n![](img/00005.jpeg)\n\
  \n图 5（查看原始文件：[这里](http://jsplain.com/javascript/index.php/Thread/9-branching2/)\
  \ ） bit.ly/1uoc1N8\n\n在 `line 6` 上，我们可以看到第二个 `else if()` 条件。\n\n在 `line 8` 上，`else`\
