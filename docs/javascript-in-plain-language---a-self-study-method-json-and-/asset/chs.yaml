  \ 方法将变量 `french` 插入数组 `langVersion` 中。\n\n```\nlangVersion.push(french);\n```\n\n\
  ## 4- 通过调用来测试脚本\n\n```\nshow(french);\n```\n\n*   点击此处查看最终版本：\n    [论坛](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
  \ | [原始文本](http://icontemp.com/jpl/fox2.txt)。\n\n### 输出数组\n\n你还记得如何创建 *for* 循环吗？在这个项目中，我们将\
  \ *console.log* 数组元素。\n\n## 1- 创建一个 *for* 循环来打印：我将使用常用的标识 `i` 作为计数器，并使用 `langVersion.length`\
  \ 作为限制。\n\n## 2- 在循环体内，*console.log* 数组的内容。\n\n这是通过动态访问 `langVersion[i]` 实现的，随着循环的重复而进行。\n\
  \n\n\n\n- 数组最后一个项的位置始终是 `array` 长度减 1`。不需要死记这个事实，只需要理解位置是从零开始计数的。如果我们以后需要手动向数组添加项，了解这一点是非常有用的。至于自动添加新项，我们可以使用\
  \ `push()` 将它们插入到末尾，或使用 `unshift()` 将它们置于开头，或者如果我们想在特定位置插入一个项，可以使用 `splice()`。另一方面，要删除项时，如果项在末尾则使用\
  \ `pop()`，在开头则使用 `shift()`，如果我们想从特定位置删除项，则使用多能的 `splice()`。\n\n- 至于扫描数组，我们通过 `for\
  \ loop` 遍历数组以打印其内容，我们也知道 JavaScript 库还有许多其他方法可以用来进一步处理数组。其中一些方法在这一本书中已经介绍过，而其他更高级的方法可以在我的“[详细解释](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)”电子书上查阅。\n\
  \n在本主题中，我们将处理`无序列表（unordered lists）`。\n\n在无序列表中，所有项的位置都用一个 `string` 值进行标记。\n\n我们称它们为`无序列表`，是因为每个口袋实际上都贴了标签。这个标签可以是一个字符、一个单词，甚至是一个数字（但是，如果你使用数字作为标签，请记住它们不是连续的，而且它们被视为字符，而不是始终按数字顺序排列的数组）。\n\
  \n事实上，`无序列表`之所以是无序的，是因为 JavaScript `maps` 将标签映射到项上。到最后，这些都是数组，即使这种特征对程序员来说是隐藏的。\n\
  \n在正式数组中，我们不需要命名地址或口袋标签，因为这在数字上是假设的，例如：\n\n```\nvar myArray = [\"duck\", \"lettuce\"\
  , \"sapphire\"];\n```\n\n对于`无序`列表，我们需要标记项的位置，我的意思是存储项的口袋。这对于某些应用是有益的：\n\n```\nvar\
  \ x = {\"animal\": \"duck\", \"vegetable\": \"lettuce\", \"mineral\": \"sapphire\"\
  };\n```\n\n注意每个项的赋值是如何完成的：`\"animal\": \"duck\"`，\n\n`\"animal\"` 是标签，`\"duck\"\
  ` 是值。\n\n有一个冒号 `:` 分隔两者，而不是 `=`。\n\n我们使用`大括号（curly braces）`来包裹列表，而`方括号（square braces）`留给`数组`。\n\
  \n- **请注意：** 包裹标签的引号是可选的，但包裹字符串值的引号不是可选的，因为在我们的示例中使用的是字符串值。\n\n关于这一点稍后会详细介绍。\n\n\
  ### 哈希表、对象、关联数组、无序列表\n\n在 JavaScript 中，所有这些都是同义词。每种编程语言使用不同的术语来表示无序列表。\n\n*Java*\
  \ 使用 `HashMap`、`HashTable`。\n\n*C#* 使用 `HashTable`、`Dictionary`。\n\n*Python* 使用\
  \ `dict`。\n\n*Ruby* 使用 `Hash`。\n\n*Object-c* 使用 `NSDictionary`。\n\n*C++* 使用 `std::unordered_map`。\n\
  \n**而 *JavaScript* 使用 *object（对象）***。我刚刚说了 object 吗？我个人并不喜欢这个命名，因为在 JavaScript 中，几乎一切都是对象。数组也是对象，函数也是如此。然而，JavaScript\
  \ 中 object 的名称已成为`无序列表`的同义词。\n\n另一个流行的名称是`关联数组（associative arrays）`。某些语言实际上拥有关联数组。在\
  \ JavaScript 中，关联数组（即具有`key-value`对关联的数组）被称为 `object`。然而，关联数组通常被称为对象的原因是，从术语上来说对象是由关联数组制成的。对于\
  \ JavaScript 而言，所有这些名称都是`无序列表`，我们称它们为`objects`。\n\n希望通过知道**它们都意味着同一个意思**可以消除一些困惑，但请记住，事情没那么简单，这个主题的内容比这本书所要求的要多得多。\n\
  \n- 从现在起，为了简单起见，我们将任何`键值对结构（key-value pair structure）`称为 `object`。\n\n### 创建对象\n\
  \n对象是值的集合。\n\n这些值可以是任何种东西的混合：字符串、数字、布尔表达式、变量、数组、函数以及（通常）其他类似的对象。\n\nJavaScript 在这方面非常灵活。值列表的大小可以随时缩小或扩大。在接下来的几页中，我们将看到如何执行这些操作，如创建、编辑、添加新项、删除项、搜索和打印项。这些技术大部分已经向你介绍过了，当你接触其中每一个时，你会记起来的。\n\
  \n**同时声明对象并赋值值：**\n\n```\nvar x = {\"animal\": \"duck\", \"vegetable\": \"lettuce\"\
  , \"mineral\": \"sapphire\"};\n```\n\n***上面这些是什么？***\n\n我们有一个名为 `x` 的变量，它指向一个 `object`\
  \ 类型的数据结构。\n\n由于包裹数据的大括号 `{ }`，我们知道它是对象。\n\n### 为什么我们要用双引号包裹标签？\n\n通常，当我们创建一个对象时，并不真的需要给属性部分加引号，你可能会更多地看到这种方式（不带引号）。例如：\n\
  \n```\nvar example = {\"animal\": \"duck\", \"vegetable\": \"lettuce\"};\n```\n\n\
  你可以看到，在对象声明时 `animal` 和 `vegetable` 都没有引号。\n\n然而，由于 [JSON](https://en.wikipedia.org/wiki/Json)\
  \ 的出现，在现代技术中使用双引号包裹标签变得普遍。我们将在后面的章节中介绍 JSON 的基础。\n\n所以，如果你开始学习对象表示法，最好养成在声明对象时为键加双引号的习惯。上面的示例应该看起来像这样：\n\
  \n```\nvar example = {\"animal\": \"duck\", \"vegetable\": \"lettuce\"};\n```\n\n\
  随你意为，但请记住这个概念。\n\n### 给对象分配新的键值对\n\n让我们做一些实验……\n\n1- 在你的控制台上，创建一个新的空对象：\n\n```\n\
  var crazyList = { };\n```\n\n你还记得如何用 `typeof` 检查变量的类型（在*实验 1*中涵盖过）吗？\n\n2- 检查 `crazyList`\
  \ 的 `typeof`：\n\n```\ntypeof crazyList;\n```\n\n它显示 \"*object*\"。我们有一个空对象。\n\n3-\
  \ 现在我们通过赋值给键标签来添加一些值：\n\n```\ncrazyList[\"flower\"] = \"daisy\";\n```\n\n对象 crazyList\
  \ 现在包含 `{flower: \"daisy\"}`。\n\n4-让我们再添加另一个键值对：\n\n```\ncrazyList[\"drink\"] =\
  \ \"water\";\n```\n\ncrazyList 现在有两个值：\n\n`{flower: \"daisy\", drink: \"water\"\
  }`\n\n\n\n\n\n作为一个有趣的现象，请注意 JavaScript 是如何将新项目放在最后一个项目的右侧的。然而，项目被放在哪里并不重要，因为与数组不同，我们不需要此类信息来访问这些项目。\n\
  \n## 5- 现在我们将添加一些数字键，只需看看会发生什么\n\n（这不是常见的实现方式）：\n\n```javascript\ncrazyList[2] =\
  \ \"front teeth\";\n```\n\n`crazyList` 现在持有 3 个项目：\n\n`{\"2\": \"front teeth\",\
  \ \"flower\": \"daisy\", \"drink\": \"water\"}`\n\n你看到数字键是如何被放置在所有字符串类型键的左侧了吗？\n\
  \n再次强调，这对我们没有意义，因为顺序并不真正一致。\n\n## 6- 让我们添加另外两个数字键：\n\n```javascript\ncrazyList[\"\
  1\"] = \"flying bird\";\n```\n\n和\n\n```javascript\ncrazyList[3] = \"is a crowd\"\
  ;\n```\n\n现在 `crazyList` 包含：\n\n`{\"1\": \"flying bird\", \"2\": \"front teeth\"\
  , \"3\": \"is a crowd\", \"flower\": \"daisy\", \"drink\": \"water\"}`\n\n所以我们看到，当键是数字时，项目被放在左侧，并按数字顺序排列。当键是字符串值时，项目被放在最后一个最右侧的项目之后。\n\
  \n还要注意我是如何将 `[\"1\"]` 包裹在引号中的。这只是为了说明，当涉及到数字键时，它们可以加引号也可以不加。这取决于你。\n\n*   键值对的顺序定位目前对我们来说没有价值。这仅仅是作为一个有趣的现象被提到的。请不要尝试记忆这种特性，因为这是一个无序列表，我们将根据需要调用它们的标签来选取项目。\n\
  \n### 在对象中使用点表示法（dot notation）\n\n在上一个示例中，我们使用了括号表示法（bracket notation）来调用对应每个对象属性（值）的标签。\n\
  \n我们也可以使用点表示法来表示对象的属性。\n\n这实际上是访问对象项目的一种非常流行的方法。事实上，我们需要非常熟悉这两种编写风格，因为尽管点表示法很流行，但有时它无法使用。另一方面，如果你只使用括号表示法，你的代码看起来将与标准不同，别人会问你为什么用这种风格。学习如何用点表示法编写某些表达式，而用括号表示法编写其他表达式是值得的。实践会告诉你应该以及何时使用哪一个。\n\
  \n**关于这两种编码风格之间的差异，你应该了解这些：**\n\n1.  点表示法不适用于数字。\n2.  点表示法不适用于动态变量（那些动态变化的变量，例如在循环遍历对象时代表键值对中键的计数器）。\n\
  3.  总结来说，只有当属性名是有效的属性标识符且该标识符不是数字时，才能使用点表示法。\n\n将点表示法想象成“硬连线”（在使用点表示法时必须已知值），将括号表示法想象成“软连线”（值可以动态变化，或者在代码提交给\
  \ JavaScript 解释器时是未）。\n\n## 如何使用点表示法访问对象中的项目？\n\n让我们重复之前的示例，但使用点表示法代替括号表示法：\n\n\
  1- 创建一个新的空对象：\n\n```javascript\nvar crazyList = { };\n```\n\n2- 让我们通过将值分配给键标签来添加一些值：\n\
  \n```javascript\ncrazyList.flower = \"daisy\";\n```\n\n现在 `crazyList` 包含 `{flower:\
  \ \"daisy\"}`\n\n注意在点表示法中，键是不带引号编写的。这是因为 `flower` 已经在内存中作为对象 `crazyList` 属性的声明键。但在括号表示法中，我们总是将键的字符串名称放在引号中，如\
  \ \"flower\"。在点表示法中引号是无效的。\n\n`crazyList.\"flower\"` 将导致错误\n\n3- 添加另一个键值对：\n\n```javascript\n\
  crazyList.drink = \"water\";\n```\n\n现在 `crazyList` 包含：{flower: \"daisy\", drink:\
  \ \"water\"}`\n\n4- 使用点语法添加数字键：\n\n```javascript\ncrazyList.2 = \"front teeth\"\
  ;\n```\n\n我们得到了如下错误：\n\n```\nSyntaxError: Unexpected number\n```\n\n点表示法不允许使用数字。它必须这样处理：\n\
  \n```javascript\ncrazyList[2] = \"front teeth\";\n```\n\n**总结：**\n\n我们可以通过向变量赋值一对大括号来声明一个空对象：\n\
  \n```javascript\nvar z = { };\n```\n\n然后，我们通过通过点表示法或括号表示法提供键和值来添加项目：\n\n```javascript\n\
  z.rent = 750;\nz[\"gasBill\"] = 300;\n```\n\n现在我们有了 `{rent: 750, gasBill: 300}`\n\
  \n**或者**\n\n我们可以声明一个对象并一次性为其分配项目：\n\n```javascript\nvar b = {\"color\": \"red\"\
  , \"fabric\": \"cotton\"};\n```\n\n现在我们有了 `{color: \"red\", \"fabric\": \"cotton\"\
  }`。\n\n### 跨多行声明对象\n\n到为止，我们的对象都是简短的单行的。但在大多数情况下，对象更为复杂，并跨越多行代码。\n\n单行对象和多行对象之间没有区别。第二种编写对象的风格更易视觉，但\
  \ JavaScript 并不在乎哪一种。\n\n1- 这是一个多行语法风格的示例。请按照图片编写代码 ![images/0001.jpg](img/0001.jpg)\n\
  \n还有一个指向[原始文件](http://icontemp.com/car1.txt) | bit.ly/ZbwxY 的链接。\n\n\n\n\n以台式电脑作为一个对象为例；我们可以说显示器、键盘和鼠标是台式电脑的一些属性。那么，我们也可以说\
  \ Firefox 和 Chrome 浏览器，以及 Microsoft Word 是台式电脑的方法，因为这些属性具有功能性，它们在物理意义上并不存在，我们需要像调用函数一样调用它们，才能使用它们。它们代表了台式电脑的一些方法。它们的存在是基于某些程序例程的执行。\n\
  \n当我们提到“执行”时，会立即想到函数，但函数和方法之间是有区别的：\n\n- 一个方法可能包含一个或多个函数。\n\n你看出区别了吗？一个函数可以是一个对象的方法，但它本身并不一定是一个方法。方法是一组功能的集合，用于代表对象来完成某项任务。例如，打印内容列表的方法、更新对象内容的方法、排序内容的方法，或者识别请求对象内容的人的方法等。\n\
  \n### 让我们为我们的汽车对象添加一个方法。\n\n2- 如果你一直在跟我一起写代码，请在 `rating: 9,` 后面添加一个新的逗号，因为我们正要添加另一个属性，即方法\
  \ `printRating`。（使用[编辑器](http://jsbeautifier.org/)）。\n\n3- 为标签 `printRating` 分配一个函数，在屏幕上打印以下消息：\n\
  \n`\"The car rates \" + car.rating + \" out of 10\"`\n\n![](img/00015.jpeg)\n\n\
  图 15 查看[原始文件](http://icontemp.com/jpl/car2.txt) | bit.ly/1C6I5d5。\n\n4- 让我们玩玩这个对象。将上一个原始文件中的对象脚本（或你自己的脚本）粘贴到控制台上。\n\
  \n5- 打印汽车的评分：\n\n```javascript\ncar.printRating();\n```\n\n注意我们是如何从对象上 `call()`\
  \ 一个方法的。它的起始方式与调用任何其他属性一样，但随后我们添加了一对括号 `()`，这创建了一个函数 `action`。如果我们排除括号会发生什么？它只会打印键\
  \ `printRating` 的内容，即该函数的显式描述。当我们想要将相同的功能赋值给另一个变量时，这有时会有用，但为了执行操作，我们需要使用括号。\n\n\
  6- 括号表示法呢？我们如何使用`bracket notation`来调用方法 `printRating`？方法最好用`dot notation`调用，因为它的语法更简单（你稍就会知道原因），但理解其逻辑是有好处的，逻辑如下：\n\
  \n```javascript\ncar[\"printRating\"]();\n```\n\n没有点符号语法那么漂亮，对吧？注意括号在括号外面。所以这是点符号语法主要使用的一个领域。括号语法更多地保留给属性的动态调用。我们在\
  \ for 循环中使用括号语法，是因为在循环进行时，每个属性都需要动态访问。\n\n让我们尝试一下吧！\n\n### 遍历对象\n\n假设你知道一个对象的存在，但你并不确定它包含哪些属性。你可以遍历该对象来找到它的属性。\n\
  \n### 引入 for in 循环\n\n这个循环专门为我们一直讨论的对象编写的：\n\n在此处查看原始文件：[raw file](http://icontemp.com/jpl/car2.txt)\
  \ | bit.ly/1C6I55\n\n循环的写法如下：\n\n```javascript\nfor(var k in car){\n  console.log(k);\n\
  }\n```\n\n`for in` 循环是普通 `for loop` 的变体，体现在某些功能已经在 JavaScript 库中预编程了。让我们逐行分析：\n\n\
  `for(var k in car)` --- `k` 是由程序员引入的变量。它的目的是在每次循环计数中临时获取并持有 `key label`（即与每个循环周期位置编号匹配的标签）。\n\
  \n让我解释一下：对象在某种意义上就像数组。唯一的区别是键的映射方式。在数组中，JavaScript 将每个位置映射为位置 0, 1, 2, 3 等。但在无序列表或使用键的对象中，JavaScript\
  \ 将内部位置（无论位置是多少）映射到最初为任何给定数据值声明的键。\n\n所以，变量 `k` 的目的是计算每个位置（每个周期一次），同时获取与给定计数对应的键名，这样我们就可以获取给它的数据值。并不是\
  \ `k` 完成了这一切，而是 JavaScript 提供了此类信息并存储在 `k` 中。\n\n至于 `k` 这个名字，我们可以使用任何名字，例如 `i`，但\
  \ `k` 更有意义，因为事实上，JavaScript 将 `key` 值临时存储在变量 `k` 中，每次迭代存储一个键。所以字母 `k` 提醒我们存储那里的是什么——一个临时位置实例。你可能在领域或其他文本中看到它是\
  \ `key`、`prop` 或 `property`。\n\n（我为什么要告诉你这些？因为我不希望你开始阅读网络上的帖子时，就认为有成千种不同的 `for in`\
  \ 循环。只有一种 `for in` 循环，每个开发者只是在临时变量名上发挥创意）。\n\n回到我们的 `for k in car`，在这个例子中，我们可以使用任何名字，例如\
  \ `i`，但 `k` 更有意义，因为事实上，JavaScript 将 `key` 值临时存储在变量 `k` 中，每次迭代存储一个键。所以字母 `k` 提醒我们存储那里的是什么——一个临时位置实例。你可能在领域或其他文本中看到它是\
  \ `key`、`prop` 或 `property`。\n\n\n\n\n如果你在好奇的话，我并真的不知道 `Outback` 的评分，数字 9 只是为了练习目的。\n\
