  g\") {\n```\n4. 如果条件为 `true`，将 \"g\" 的位置数字打印到屏幕上。\n```\nconsole.log(i);\n```\n5.\
  \ 关闭 `if()` 条件，然后关闭循环。\n```\n}\n}\n```\n\n- 将 \"g\" 替换为 \"orange\" 中的另一个字符，并创建一个\
  \ `else` 语句捕获它，输出以下内容：\n\"That character was not found!\"\n\n\n\n\n\n与其使用 `i` 作为计数变量，我将使用一个名为\
  \ `apples` 的变量。请随意使用你喜欢的任何名称。这次练习的目标是练习更多的 `for` 循环结构，并思考我们如何区分单数输出和复数输出。\n\n*在这里查看我对第\
  \ 4 题的解：*\n\n[apples](http://jsplain.com/javascript/index.php/Thread/14-Lab-7/)\
  \ ) bit.ly/XScVak\n\n实验结束\n\n## 2.9 数组列表\n\n### 字符串与数组\n\n到目前为止，我们主要在处理 `string`\
  \ 值。这里有一个赋值给已经由 `var` 初始变量 `x` 的字符串值示例：\n\n```\nx = \"orange\";\n```\n\n在字符映射方面，`o`\
  \ 是位于 `zero` 位置的第一个字符，`r` 是位于位置 1 位置的第二个字符，`a` 是位于位置 2 位置的第三个字符，以此此类推。\n\n这是另一个示例：\n\
  \n```\ny = \"orange banana apple\";\n```\n\n在上面的示例中，`b` 是第八个字符（我们必须计算空格），它位于数字为\
  \ `7` 的位置（`0,1,2,3,4,5,6,7`）。\n\n**如果我们想统计单词而不是统计字符数量怎么办？**\n\n我们不能用单个引号将单词分开，因为\
  \ JavaScript 会抛出错误：\n\n```\ny = \"orange\" \"banana\" \"apple\"; <-- 这样行不通。\n```\n\
  \n即使我们用逗号将它们分开，\n\n```\ny = \"orange\",\"banana\",\"apple\";\n```\n\nJavaScript\
  \ 会先将 `y` 赋值为 `orange`，然后重新将 `y` 赋值为 `banana`，最后赋值为 `apple`，最终 `y` 中只会存储最后一个值。\n\
  \n因此，在字符串值中，映射**限于单个字符**。整个字符串被视为一个多个字符的单元。\n\n*   **简而言之**，如果我们想将单词作为独立的独立单元保存在变量中，我们需要使用不同的\
  \ `data type`，因为 `string` 无法做到这一点。其中一种类型被称为 `array`（还有其他的）。\n\n`array` 类型和 `string`\
  \ 类型之间的区别在于我们可以存储单个单词。数组的另一个优势是，我们可以在同一个变量的不同数据包中存储 `number` 类型的值，以及其他类型如 `functions`、`objects`\
  \ 和 `Booleans`。\n\n就像字符串值一样，在数组中，我们也从位置零开始数字地访问每个位置。事实上，字符串值是一个非常简单的单个字符数组。\n\n\
  **把数组想象成一个活页文件夹**。\n\n每个口袋都按顺序标记，在每个口袋中，我们可以存储任何我们想要的内容。\n\n要检索每个口袋的内容，我们使用中括号语法调用数组，并使用位置数字来访问我们尝试获取的数据。\n\
  \n### 数组语法\n\n要声明一个 `array` 类型类型的值，我们使用一对方括号：\n\n```\nvar x = [ ];\n```\n\n你可以在网上读到中括号语法被称为数组语法，这是因为括号语法源于数组口袋位置的概念。\n\
  \n上面的示例是一个空数组，因为括号内部没有任何数据，但方括号已指示 JavaScript 解释器将变量 `y` 声明为 `type array`。\n\n回到我们上一个字符串示例，如果我们想保存独立的单词，可以按照以下方式声明并赋值变量\
  \ `y`：\n\n```\nvar y = [\"orange\",\"banana\",\"apple\"];\n```\n\n现在，如果我们调用 `y`\
  \ 的位置 2，我们得到结果 \"apple\"：\n\n```\ny[2]; <-- 显示 \"apple\"\n```\n\n或者更隐式地：\n\n```\n\
  console.log(y[2]); <-- 显示 apple\n```\n\n由于我们的数组 `y` 有三个跨越从位置零到位置 2 的值，我们可以通过通过访问后续位置来向它添加更多值。示例：\n\
  \n```\ny[3] = \"peach\";\n```\n\n现在，如果我们在控制台中输入 `y;` 调用变量 `y`，我们得到：\n\n```\n[\"\
  orange\", \"banana\", \"apple\", \"peach\"]\n```\n\n如果我们重新赋值已存在的位置之一（例如位置零），会发生什么？\n\
  \n```\ny[0] = \"grape\";\n```\n\n我们覆盖了之前的值，因为我们刚刚将该位置重新赋值为不同的值。数组不会移动位置来容纳更多项目，它只是通过将位置重新赋值为其他来删除现有值。\n\
  \n数组 `y` 现在仍然包含之前数量的值：\n\n```\n[\"grape\", \"banana\", \"apple\", \"peach\"] \"\
  orange\" 被删除了。\n```\n\n### 使用 push() 和 unshift() 向数组插入元素\n\n随着数组变大，几乎不可能知道数组中包含多少项目，这使得添加新项目变得非常困难，因为当我们向数组的某个位置添加项目而该位置已满时，JavaScript\
  \ 会用新项目替换旧项目。旧项目从数组中删除。\n\n为了防止这种删除发生，JavaScript 有两种机制帮助我们向数组添加项目：`push` 和 `unshift`。\n\
  \n### Push()\n\n向数组添加新项目的最常见方法将其添加到列表的最末尾。\n\n*   数组方法 `push()` 将项目添加到列表的最末尾。\n\n\
  你还记得我们如何使用 `+=` 向字符串中追加字符吗？\n\n`+=` 的问题是它将新项目作为最后一个单元添加到最后一个项目。\n\n例如，在\n\n```\n\
  var y = [\"orange\",\"banana\",\"apple\"];\n```\n\n如果我们写 `y += \"cherry\";`，我们将得到\
  \ \"*orange, banana, apple*\"，这不是我们想要的。向数组添加添加项目的正确语法如下：\n\n```\ny.push(\"cherry\"\
  );\n```\n\n现在数组包含：\n\n```\n[\"orange\", \"banana\", \"apple\", \"cherry\"]\n```\n\
  \n让我们再添加一个项目 `avocado`：\n\n```\ny.push(\"avocado\");\n```\n\n现在数组 `y` 包含：\n\n```\n\
  [\"orange\", \"banana\", \"apple\", \"cherry\", \"avocado\"]\n```\n\n**push 的含义**：想象一叠砖块。当我们向堆上放置一块新砖时，由于它的重量会将其他的向下推。堆的顶部是数组的最后一个位置。现在，如果你以水平方式而不是垂直方式可视化数组，最后一个项目在你的右侧。我们在书中会多次使用\
  \ `push()`，因为它是插入新项目的常用方法。\n\n### unshift()\n\n`unshift()` 方法将项目添加到数组的开头。\n\n当我们垂直可视化数组时，数组的开头是底部，而在水平方向上，它是数组的最左侧。\n\
  \n以上一个主题中数组 `y` 的实例为例，我们将 `blueberry` 添加到数组的开头：\n\n```\ny.unshift(\"blueberry\"\
  );\n```\n\n数组现在是：\n\n```\n[\"blueberry\", \"orange\", \"banana\", \"apple\", \"\
  cherry\", \"avocado\"]\n```\n\n注意 \"orange\" 如何移动到位置 1（即第二个项目），为新位置零的 \"blueberry\"\
  \ 让出空间。\n\n**unshift 的含义**：为了在堆的底部插入一块新砖，我们需要向上移动所有的砖块，以便我们能挤进一块新砖作为堆的第一个项目，因为第一个项目位于底部。相反，当我们使用\
  \ `push` 向堆的顶部插入新项目时，我们实际上是在 `push` 时将所有内容向下推，尽管底部没有地方可去。\n\n### 使用 for 循环打印数组项目\n\
  \n\n\n\n\n正如你可能已经注意到的，当我们通过名称调用数组时，它在屏幕上的视觉显示是其原始的视觉格式：\n\n`[\"blueberry\", \"orange\"\
  , \"banana\", \"apple\", \"peach\", \"cherry\", \"avocado\"]`\n\n### 我们如何单独显示项？\n\
  \n我们可以使用数组的 `length` 属性和 `for loop` 来来实现这一操作。\n\n`length` 属性的工作方式与字符串一样。我们可以通过在数组变量名后附加\
  \ `.length` 来找到数组的长度：\n\n`y.length;` <-- 它显示数字 `7`\n\n现在，正如你之前在处理字符串 \"orange\"\
  \ 时（实验工作 7）所记得的，当我们知道要扫描的项的长度时，我们按照以下方式初始化一个 `for loop`：\n\n```javascript\nfor(var\
  \ i = 0; i < 7; i++) { do this stuff; }\n```\n\n然而，在大多数情况下，我们不知道想要扫描的项的长度，这时 `.length`\
  \ 就派上用场了：\n\n```javascript\nfor (var i = 0; i < y.length; i++ ){ do this stuff;\
  \ }\n```\n\n最后这种实现方式效率得多，因为当我们删除或添加新项导致数组长度发生变化时，我们就不需要担心重新循环。\n\n操作数组所需的其余代码将放在“do\
  \ this stuff”代码块所在的位置。在在那里，我们可以打印、搜索或创建许多其他可能的实现。此外，正如你所知道的，代码块通常写在单独的行。\n\n这里有一个将所有项打印到屏幕的示例循环：\n\
  \n![](img/00011.jpeg)\n\n图 11\n\n在第 `2` 行，`console.log()` 正在处理数组的每个位置。我们通过将 `i`\
  \ 赋值为位置的数字来实现这一点。通过这样，随着循环计数 `i` 数字，它会改变 `y[i]` 的位置，每个项都会随之显示（并分行显示）。让我们来尝试一下。\n\
