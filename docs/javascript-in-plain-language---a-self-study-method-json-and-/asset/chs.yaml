  ## 1.11 引入 `console.log`, `alert`, `prompt`, `confirm`\n\n到为止，我们一直通过直接输入变量名并按回车键来测试变量的值。\n\
  \n这之所以有效是因为我们正在使用测试控制台。\n\n然而，随着我们的脚本变得越来越复杂，我们需要一种更显式的机制将数据输出到屏幕上。\n\n这就是 `console.log()`\
  \ 派上用场的地方。\n\n### `console.log`\n\n控制台有一种通过名为 `log()` 的机制显式记录数据到屏幕上的的方法。\n\n要显示的数据放在括号内。如果这些数据是字符串形式，我们用引号括起来。然而，如果数据来自变量或数字，我们总是不带引号地编写变量名或数字。\n\
  \n示例：\n\n`log(\"Hello bluebird\");` <-- 这种写法行不通。在你的控制台上尝试之前，请稍后阅读页面底部的注释。\n\n另一个示例是\
  \ `log(x)`。如果 `x` 是一个已声明的变量，这将显示 `x` 的值。如果 `x` 不是变量，JavaScript 将抛出错误，因为任何不是变量的单词应该像这样放在引号中：`log(\"\
  x\")`。\n\n我们还可以组合字符串和变量：\n\n例如：\n\n```javascript\nvar x = \"big bird\";\nlog(\"\
  Hello\" + \" \" + x);\n```\n这将显示 *Hello big bird*\n\n或者如果你还记得，我们可以这样做：\n\n```javascript\n\
  log(\"Hello \" + x);\n```\n\n**注意：**\n\n`log()` 本身无法工作。我们需要使用点符号语法（Dot syntax）将\
  \ `log()` 绑定到 Console（小写 c）：\n\n```javascript\nconsole.log(\"Hello \" + x);\n```\n\
  \n这是使用 `log()` 的正确方式，即通过点语法将 console 附加到 log() 上。注意 console 是小写的。在编程时引用控制台的正确方式是小写的\
  \ `console`。它是一个名为 `console` 的对象。console 的大写将无效，因为 JavaScript 是区分大小写的。\n\n这里有更多示例：\n\
  \n```javascript\nconsole.log(3 + 5); // 显示 8\nconsole.log(3 > 5); // 显示 false\n\
  ```\n\n或者字符串与数字比较的组合：\n\n```javascript\nconsole.log(\"3 > 5 is \" + (3 > 5)); //\
  \ 显示 3 > 5 is false\n```\n\n### `alert()`\n\n除了 `log()`，我们通过 `window` 对象调用 `alert()`\
  \ 来弹出对话框：\n\n```javascript\nwindow.alert(\"hello!!\");\n```\n\n**为什么是 window？**\n\
  \n`window` 对象是我们在浏览器上所做一切的母体。甚至 Console 也运行在 `window` 下（与微软无关）。\n\n```javascript\n\
  console.log(\"hello!\");\n```\n\n### `confirm()` 和 `prompt()`\n\n另一个流行的对话框是 `confirm()`\n\
  \n就像 `alert()` 一样，`confirm()` 也来自 `window`，我们通常这样编写：\n\n```javascript\nconfirm(\"\
  确定要继续吗？\");\n```\n\n它会弹出一个消息，我们点击两个按钮之一：确定或取消。*确定*将返回布尔值 `true`，而*取消*将返回布尔值 `false`。我们一定要利用这些布尔值，但在处理条件语句时会这样做。另一种输出方法是\
  \ `prompt()`，它也可以作为输入方法。\n\n`prompt()` 对于收集用户信息非常有用，因为 `prompt()` 会打开一个窗口让用户引入一些数据。我们可以将这些数据赋值给变量，并使用该值创建其他结果。\n\
  \n例如：\n\n```javascript\nvar answer = prompt(\"是还是否?\");\n```\n\n然后我们可以通过布尔结果评估答案来进一步处理答案：\n\
  \n```javascript\nanswer === \"yes\";\n```\n\n这实际上是一个 JavaScript 问题，如果答案是 \"yes\"\
  ，它会回答 `true`；如果答案是 \"no\"，则为 `false`。\n\n\n\n\n\n`(10 > 9) && (10 < 11);` <--- JavaScript\
  \ 的答案是 `true`\n\n因为 true 和 true 是 true。\n\n`(10 > 14) && (10 < 11);` <--- JavaScript\
  \ 的答案是 `false`\n\n因为 false 和 true 是 false。\n\n`5 === 7 && 5 === 5;` <--- JavaScript\
  \ 的答案是 `false`\n\n`5 === \"5\" && 5=== 5;` <--- JavaScript 的答案是 `false`\n\n`5 ===\
  \ 5 && 7 > 5;` <--- JavaScript 的答案是 `true`\n\n### 或：||\n\n两个垂直竖线表示“或”（OR）逻辑运算符。在美式\
  \ Windows 中，你可以通过按下 `SHIFT` 键和 `qwerty` 行最右侧的最后一个键来输入 `||`。\n\n使用逻辑或 `||` 时，其中一个操作数需要为\
  \ true 才能得到布尔值 true 作为输出。\n\n通常情况下，如果左侧操作数已经是 true，JavaScript 将不会检查 OR 语句中的右侧操作数。这一点很重要，特别是当我们很快遇到条件决策时。\n\
  \n示例：\n\n`(10 > 9) || (10 < 9);` <--- JavaScript 的答案是 `true`，因为第一个表达式是 true。\n\n\
  `(10 < 9) || (10 > 9);` <--- JavaScript 的答案是 `true`，因为第二个表达式是 true。\n\n`(10 < 9)\
  \ || (10 < 8);` <--- JavaScript 的答案是 `false`，因为没有一个表达式是 `true`。\n\n### 非：!\n\n非运算符\
  \ `!` 用于反转一个语句。在 JavaScript 中，任何数据值都被视为 `true`，但有以下例外：\n\n布尔值 `false`、数字 `zero`、名为\
  \ `undefined` 的值以及我们还没有过的名为 `null` 的值。\n\n让我声明几个变量和值来做一些测试：\n\n`var x = 3;`\n\n\
  `var y = 0;`\n\n`var z = \"Tony\";`\n\n`var a;`\n\n根据我的第一个陈述，变量 `x` 是 `true` 还是\
  \ `false`？它是 true，因为它有一个值。相反，变量 `y` 是 false。\n\n让我介绍一个 JavaScript 方法来找出一个值是 true\
  \ 还是 false：（我们可以在脚本中使用此方法进行决策，但它并不常用。只需记住它即可）：\n\n`Boolean();`\n\n现在我们将比较该方法的正常结果与反转问题后的结果。记住，我们是在让\
  \ JavaScript 检查语句是 `true` 还是 `false`，而不是去检查变量并给我们一个值。这完全取决于我们在 `Boolean()` 方法内部的语句。让我们尝试：\n\
  \n例如，在 `Boolean(x);` 中。我们正在问：“这是 true 吗？”、“我说 x 以 true 存在，我的语句是 true 吗？”然后 JavaScript\
  \ 回复 `true` 或 `false`：\n\n`Boolean(x);` <-- 语句是 `true`（因为我们之前示例中的 `x` 是 3）\n\n`Boolean(!x);`\
  \ <-- 语句是 `false`（因为 `x` 有值，`!x` 是一个假的语句）\n\n`Boolean(y);` <-- 语句是 `false`（`y` 是\
  \ 0，而 0 是 false）\n\n`Boolean(!y);` <-- 语句是 `true`（因为 `y` 是 0，`!y` 是一个真的语句）\n\n`Boolean(z);`\
  \ <-- 语句是 `true`（`z` 是 \"Tony\"，而 Tony 是 true）\n\n`Boolean(!z);` <-- 语句是 `false`（因为\
  \ `z` 有值，`!z` 语句是假的）\n\n`Boolean(a);` <-- 语句是 `false`（`a` 是 `undefined`，我们不能说它是\
  \ true）\n\n`Boolean(!a);` <-- 语句是 `true`（因为 `a` 是 `undefined`，`!a` 是一个真的语句）\n\n\
  让我们做一些实验来复习所有这些概念。\n\n## 1.13 实验 5\n\n### 获取用户的反馈\n\n在本次实验课程中，我们将逐步共同工作。请打开你的 JavaScript\
