  \ 。\n\n### 创建一个将摄氏度转换为华氏度的程序\n\n将摄氏度转换为华氏度的公式是\n\n将 `c` 乘以 9，\n\n然后将结果除以 5，\n\n\
  然后对结果加上 32。\n\n不需要插入括号，只需确保乘法在前：\n\n`c * 9 / 5 + 32`\n\n1- 创建一个名为 `c2f` 的函数，接收一个名为\
