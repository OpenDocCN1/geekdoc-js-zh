  \n## 额外奖励：创建一个通用方法向数组中添加项目\n\n要完成此练习，请回到本次实验作业的第一个练习（见图 12），并重新创建它，使我们能够向任何数组添加项目，而不仅仅像原始示例那样只针对数组\
  \ `x`。\n\n1- 你需要向我称之为 `addMe2` 的函数添加两个输入参数：\n\na) 一个用于数组名的输入（我将将其命名为 `inputArray`），\n\
  \nb) 另一个用于你想添加到数组中的项目的输入（我将将其命名为 `inputItem`）。\n\n2- 然后在函数体内，创建一个脚本，将位置 `inputArray.length`\
  \ 赋值给新项目（`inputItem`）：\n\n```javascript\ninputArray[inputArray.length] = inputItem;\n\
  ```\n\n**注意：** 由于脚本比原始的复杂一点，我使用了人类易读的名字，以帮助他们理解脚本在做什么。即使我们是为了自己的使用而编写代码（而不是为了他人），我们明天回来时也不会忘记它是是什么的。\n\
  \n3- 如果你愿意，在函数体内添加一个 `console.log(inputArray)` 以监控输出。\n\n4- 最后，在函数外部创建一些空数组，然后通过调用函数向其中的每一个数组添加项目。\n\
  \n当你准备好时，请参考我自己的脚本：[论坛板](http://jsplain.com/javascript/index.php/Thread/15-Lab-8/)。\n\
  \n\n\n\n在数组\n\n`var y = [\"grape\", \"apple\", \"banana\"];`\n\n`y.indexOf(\"banana\"\
  );` <-- 返回 2（对应位置 2）\n\n`y.indexOf(\"chestnut\");` <--- 返回 -1（表示“未找到”）\n\n### 示例：\n\
  \n在\n\n`var y = [\"grape\", \"apple\", \"banana\"];` 中\n\n我们可以检查 *chestnut* 是否存在，并编写脚本与用户对话：\n\
  \n```javascript\nif(y.indexOf(\"chestnut\") < 0) {\n  console.log( \"Not found,\
  \ would you like to add it?\");\n}\n```\n\n输出为：\n\n“*Not found, would you like to\
  \ add it?*”\n\n然后我们将像在之前的实验工作中做的那样，编写一个脚本将 *chestnut* 添加到数组中。\n\n* `< 0` 部分用于检查\
  \ `indexOf` 是否为 -1，这意味着该项目不存在。\n* 另一方面，`index` 为零或以上，则意味着该项目已在数组中。\n* 每个 `index`\
  \ 对应一个项目的位置。\n\n### pop() 和 shift()\n\n`push()` 的相反方法是 `pop()`，`push()` 是用于向数组顶部或最右侧添加项目的方法。\n\
  \n想想《拔老鼠》（Pop! Goes the Weasel）！\n\n`pop()` 从数组的最末尾移除一个项目。\n\n在\n\n`var y = [\"\
  grape\", \"apple\", \"banana\"];` 中\n\n`y.pop();`\n\n将移除 \"banana\"。现在 `y` 只有 [\"\
  grape\", \"apple\"]\n\n`shift()` 是 `unshift()` 的相反方法。\n\n我们 *unshift* 所有项目以便在底部或最左侧插入一个项目。\n\
  \n当我们从底部或最左侧移除一个项目时，所有其他项目都会向下移动。\n\n让我们移除当前位于数组 `y` 第一个项目 *\"grape\"*：\n\n`y.shift();`\n\
  \n注意 `pop()` 和 `shift()` 在括号中均不接受任何参数。这是因为它们专门用于移除最后一个或第一个项目，而不是某个命名的项目。\n\n你还记得如何把项目放回去吗？\n\
  \n`y.push(\"banana\");`\n\n`y.unshift(\"grape\");`\n\n现在数组 `y` 回到了原始状态：\n\n[\"grape\"\
  , \"apple\", \"banana\"]\n\n### slice()\n\n`slice()` 方法从一个数组中提取特定项目，并以相同的格式类型输出这些项目：数组。\n\
  \n这意味着，如果我们通过将其赋值给另一个变量来获取输出，我们就了另一个数组。\n\n### join() 和 slice() 之间有什么区别？\n\n* `join()`\
  \ 将输出转换为 `string` 类型值。我们使用括号来确定字符串单词将如何分隔。\n* `slice()` 将输出从数组转换为另一个数组。由于我们不需要确定如何分隔项目（因为它们已经是分开的），我们利用括号来*传入*一些其他参数，如下所示：\n\
  \n`myArray.slice(0,4);` <-- 0 是输出中包含的第一个位置，4 是被排除在外的第一个位置。\n\n### 示例：\n\n在\n\n`var\
  \ fruits = [\"apples\", \"bananas\", \"blueberries\", \"grapes\", \"avocado\", \"\
  peaches\"];` 中\n\n我将声明一个新的数组并使用 `slice()` 从 `fruits` 数组中提取一些水果项目：\n\n`var pickedFruits\
  \ = fruits.slice(0,4);`\n\n数组 `pickedFruits` 现在包含：\n\n[\"apples\", \"bananas\",\
  \ \"blueberries\", \"grapes\"]\n\n* 两个参数 (0,4) 具有以下含义：\n    * 第一个参数表示要提取的第一个位置。\n\
  \    * 第二个参数表示排除在提取之外的第一个位置。\n      (0,1) 将只提取 *apples*，因为它排除了位置 1 的 bananas。\n\
  \      (1,4) 将提取 *bananas, blueberries, grapes*，因为它从位置 1（位置一）即 *bananas* 开始提取，并从位置\
  \ 4（即 *avocado*）处开始排除。\n\n关于 `slice` 的更多高级技巧，请参阅我的电子书：\n\n[JavaScript Objects Functions\
  \ and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)。\n\
  \n### splice()\n\n数组方法 `splice()` 非常有趣。你还记得 `push()` 和 `unshift()` 吗？它们将项目添加到数组的末尾或开头，对吧？\n\
  \n* `splice()` 将项目添加到数组的特定位置。\n\n让我们看看它是如何工作的。\n\n根据你在括号中使用的参数数量，你可以执行以下操作：\n\n\
  a) **删除项目模式**：\n\n当你只使用**两个参数**时，你正在以以下方式提供**索引位置**：\n* *第一个参数*：操作开始的位置（包含），\n*\
  \ *第二个参数*：将移除多少个项目。\n\n在某种程度上，仅有两个两个参数意味着删除，因为没有要添加的内容。\n\n`splice(0,3)`（解释见下文）\n\
  \nb) **添加项目模式**：\n\n如果你插入了**两个以上的参数**，**第三个**及后续参数是**要插入的数据**，在这种情况下，JavaScript\
  \ 假设你想向数组插入项目。\n\n`splice(2,0, \"yellow\")`\n\n在仅添加模式下，第二个参数是*零*。\n\nc) **替换项目模式**：\n\
  \n如果我们使用两个以上的参数且第二个参数大于零，我们就会用新项目替换现有项目。\n\n`splice(2,1, \"orange\")` // 这将索引 2\
  \ 处的项目替换为 \"orange\"。\n\n\n\n\n\n我们刚刚从数组 `x` 中删除了 `blue, red, green`。\n\n### 3-\
  \ 调用数组：`x;`\n\n它返回 `[\"violet\", \"brown\"]`，因为位于位置 0,1,2 的原始项被删除了。\n\n### 使用 `splice()`\
  \ 添加项：\n\n### 4- 让我们把项加回数组，从零位置开始，且不删除任何现有项作为交换：`x.splice(0,0, \"blue\",\"red\"\
  ,\"green\");`\n\n### 5- 调用数组：`x;` 返回 `[\"blue\", \"red\", \"green\", \"violet\"\
  , \"brown\"]`。\n\n我们从零位置开始添加了所有列出的项，并删除了零个项。\n\n你可能在编程中不会频繁使用 `splice()`，但它是需要时去理解并调用的绝佳工具。\n\
  \n我们还有很多可以使用于数组的方法。一次性学习所有方法会让人无所适从。考虑购买我的另一本关于 JavaScript 库方法的[书](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)作为参考，并获取它们如何运作的简单解释，可能会是一个好主意。如果我觉得在这里一次包含所有其他方法会有帮助，我就会这样做。当然，你随时可以搜索并希望不要被互联网上某些虚假的解释所误导或分心。了解这些工具是成为该领域大师的重要一步。\n\
