  \ | \n\n建议：尝试将其他一些 JavaScript 练习转换为 Angular。你可能得不到完美的解决方案，但你会获得大量的练习。\n\n### 将控制器放在单独的文件中\n\
  \n现在我们已经从逻辑上分离了控制器和视图单元（都是模块的一部分），我们可以安全地将 `controller` 和 `module configuration`\
  \ 放在一个单独的文件中。这并不是故事的结束，也许只是一个开始。\n\n对于简单的应用程序，我们可以像之前那样让它们留在同一个页面。然而，作为一名多能的开发者，我们需要练习关注点分离，以便为更大的项目做准备。\n\
  \n这非常简单。以我们刚刚完成的练习（华氏度转摄氏度）为例：\n\n[原始文件](http://icontemp.com/jpl/ang14/angc3m.txt)\
  \ |\n\n1- 以不同的名称保存它，例如 `f2cfinal.html`。\n\n现在我们可以编辑该文件：\n\n2- 复制并剪切（删除）`<script></script>`\
  \ 内部所有关于控制器和模块配置的内容。只保留 `SCRIPT` 标签，以便我们可以添加指向单独文件的链接。\n\n3- 将内容粘贴到新文件中并保存为 `mycontroller.js`（或任何其他名称）。\n\
  \n注意 `.js` 扩展名。确保该文件与 `f2cfinal.html` 相同的文件夹中。\n\n4- 回到 `f2cfinal.html`，在属于控制器的起始\
  \ `SCRIPT` 标签中，输入新文件的路径，应包含 script 标签在内：\n\n```html\n<script src=\"mycontroller.js\"\
  ></script>\n```\n\n5- 保存并测试。\n\n与我此处的结果进行对比：\n\n[原始文件](http://icontemp.com/jpl/ang14/f2cfinal.txt)\
  \ | |\n\n[.js 文件](http://icontemp.com/jpl/ang14/mycontroller.js) | |\n\n[html](http://icontemp.com/jpl/ang14/angc3m.html)\
  \ |\n\n### 额外信息\n\n有关控制器的更新和进一步探索（本电子书涵盖之外），请访问 JSplain.com 上的文章：[关于控制器的笔记](http://jsplain.com/javascript/index.php/Thread/145-AngularJs-controllers-things-we-should-know/)。\n\
  \n### ng-model\n\nAngularJS 有时可以非常简单。\n\n请查看以下基于我们在 C 部分完成的 JavaScript 练习的脚本：\n\n\
  [华氏度转摄氏度 / 转华氏度](http://icontemp.com/jpl/conversions.html) | bit.ly/ZQgTRW\n\n你还记得我们是如何做这个算法的\
  \ JavaScript 原始版本的吗？\n\n复习一下，请看论坛中显示的第三个示例：\n\n[Lab 6](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
  \ | bit.ly/1Dp2SKk\n\n现在，回到上面的第一个链接，它看起来很酷，并且显示在网页上。当我们更改文本框中的值时，它会自动将值转换为摄氏度或华氏度。\n\
  \n让我们看看脚本，看看对它做了什么。它比我们实验室 6 中的原始 JavaScript 版本要简单得多。\n\n在论坛中你会找到一个 `live demo`\
  \ 以及紧随其后的脚本。请阅读每行代码的解释：\n\n[论坛板块](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
  \ | bit.ly/ZQieYU。\n\n在阅读了论坛中的描述并玩了一下 demo 后，请返回这里进行一些实验工作。我们将在不到 10 分钟内完成这个项目，保证！\n\
  \n### 实验工作，创建转换脚本\n\n你是否注意到温度转换程序中没有声明 `controller` 或 `module`？\n\nAngularJS 很多时候可以为我们节省数小时的工作，而且随着他们的不断改进，它正变得更好。对于手头的工作，我们只需要几个工具（以及对\
  \ `ng-model` 指令的介绍）：\n\na) 指向库的链接\n\nb) 一个 `ng-app` 指令\n\nc) 一个 `ng-model` 指令\n\n\
  d) 几个双大括号\n\ne) 以及两个 HTML 输入框。\n\n**准备好开始吗？**\n\n1- 让我们获取基础 HTML 脚本：\n\n[原始文件](http://icontemp.com/jpl/ang14/ang1.txt)\
  \ |\n\n2- 将其保存为 `conversions.html`\n\n3- 在 BODY 中，将 `hello` 替换为一个包含另外两个 `DIV` 的\
  \ `DIV`：\n\n```html\n<div>\n  <div></div>\n  <div></div>\n</div>\n```\n\n4- 如果你没有我提供的启动文件，请确保在你的起始\
  \ HTML 标签上（或在包裹视图的 `DIV` 上）包含一个 `ng-app` 指令。\n\n5- 在步骤 3 中最顶层的起始 `DIV` 标签上，声明一个\
  \ `ng-init` 来初始化如下所示的两个变量（`init` 是因为我们在这个项目中不使用控制器）：\n\n```html\n<div ng-init=\"\
  f=32;c=0\">\n```\n\n此时，我们的 HTML 中应该有以下内容：\n\na) 指向 AngularJS 库的 `link`（它随骨架脚本一起提供），\n\
  \nb) 页面某处的 `ng-app` 指令，\n\nc) 以及引入变量 `f` 和 `c` 的 `ng-init`。\n\n6- 仅出于测试目的，我们在 DIV\
  \ 容器内这样写一些大括号（任何一个容器均可）：\n\n```html\n{{f -c + f}}\n```\n\n然后保存并在浏览器中打开。\n\n*   如果你看到显示上是：{{f\
  \ -c + f}}，说明你有问题。检查你的代码查看缺少了什么或拼写错误。\n*   如果你看到显示数字 `64`，说明你的脚本到为止运行正常。\n\n一旦你的脚本运行正常，删除大括号并继续项目。早期测试始终是一个好主意，可以节省大量的时间头疼。我们应该在进入下一个实施阶段之前分阶段测试。这样我们始终知道问题可能在哪里。\n\
  \n7- 下一步是设计第一个**输入框**。\n\n在由第二对 DIV 创建的容器内部，\n\n写一个类型为 `number` 的输入框。\n\n（关于输入框：[HTML\
  \ input](https://en.wikipedia.org/wiki/Form_%28HTML%29) | bit.ly/1qy2lvA )\n\n在左侧包含一个描述。这是我的示例：\n\
  \n华氏度转摄氏度：<input type=\"number\">\n\n注意：你可能习惯使用自闭合标签，如 ` />`。用种方式都行。随着 HTML5 的出现，我倾向于不写自闭合。\n\
  \n8- 太棒了，现在为 `input` 框添加一个 **ng-model** 并将其赋值给变量 `f`：\n\n华氏度转摄氏度：<input type=\"\
  number\" ng-model=\"f\">\n\n\n\n\n\n如果你看过我在 `forum` `demo` 中关于 `ng-model` 的解释，你就会知道\
  \ `ng-model` 指令是一个用于保存用户输入数据的对象，并将其链接（或绑定）到分配给该 `ng-model` 的变量上，即声明中的 ` ==”someName”`\
  \ 部分（类似于 JavaScript 中将 `prompt()` 赋值给变量时所做的）。在这种情况下，它是变量 `f`，尽管它的默认值为 32，但得亏 `ng-model`\
  \ 提供的绑定，它可以被用户在该文本框中输入的数据所更改。\n\n*   不要混淆这些术语：`model` 与 `module`。\n*   `Module`\
  \ 是整个应用程序。`Model` 是一个保存数据并将其绑定到某些变量的小对象。在一个 `Module` 中可能有成百上千个这样的小模型。\n\n### 9-\
  \ 让我们在 HTML 输入框的右侧添加`双大括号` 来完成这一行。\n\n在大括号内包含从华氏度转换为摄氏度的公式：\n\n```html\n{{(f-32)\
  \ * 5 / 9}}c\n```\n\n注意：右侧的小 `c` 只是一个字符，告诉用户该结果是摄氏度。它与之前声明的变量 `c` 无关。\n\n整行看起来应该是：\n\
  \n```html\nFahrenheit to Celsius: <input type=\"number\" ng-model=\"f\"> {{(f-32)\
  \ * 5 / 9}}c\n```\n\n### 10- 保存并测试。\n\n此时，所有的 DIV 应该像下面：\n\n```html\n<div ng-app\
  \ ng-init=\"f=32;c=0\">\n  <div>\n    Fahrenheit to Celsius: <input type=\"number\"\
  \ ng-model=\"f\"> {{(f-32) * 5 / 9}}c\n  </div>\n  <div></div>\n</div>\n```\n\n\
  ### 11- 现在，让我们为`摄氏度转华氏度` (Celsius to Fahrenheit) 编写输入框。\n\n在下一个 DIV 容器中编写以下代码：\n\
  \n```html\n<div>\n  Celsius to Fahrenheit: <input type=\"number\" ng-model=\"c\"\
  > {{c * 9 / 5 + 32}}f\n</div>\n```\n\n### 12- 测试一下，测试两种转换。\n\n最终结果可以在[论坛板块](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
  \ | bit.ly/ZQieYU 查看。\n\n**你想要进行额外练习吗？**\n\n你可以添加一个额外的框并初始化另一个变量，例如 `k`：\n\n**这里是一些可能的转换公式：**\n\
  \na) 开尔文转华氏度：`(K - 273.15) * 9/5 + 32`\nb) 开尔文转摄氏度：`K - 273.15`\n\n# 更多项目想法\n\n\
