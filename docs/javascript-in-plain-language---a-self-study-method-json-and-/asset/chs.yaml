  \n稍后我们将介绍存储可执行 JavaScript 程序的其他方法。\n\n实验结束\n\n## 2.5 填写表单请求循环\n\n循环是一个[子程序](http://en.wikipedia.org/wiki/Subroutine)，它会重复执行一组编程指令，直到收到*停止*（halt）命令。\n\
