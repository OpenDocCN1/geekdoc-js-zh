  trans: '


    ## 5.5 进一步走向模块化


    ### 为 ng-app 分配模块名称


    模块化编程是一种设计技术，它强调*将程序的功能拆分为独立的模块*，并且使得每个模块都包含执行目标结果的某一方面所需的所有内容。


    模块是 `app` 中不同部分的容器，包括相关的控制器（controllers）、服务（services）、过滤器（filters）和指令（directives）。


    你的网页 `app` 就是一个模块。


    在我们的网页中，当我们在 HTML 标签上声明 `ng-app` 时，我们实际上是在创建一个模块（我们之前使用的是未命名的模块）。我们之所以没有给测试网页（或模块）命名，是因为一旦命名，在配置好“模块接口”（`module
    interface`）之前它就会停止工作，这意味着我们需要在 `<script></script>` 块内编写声明，以正式地向 AngularJS 注册该模块。


    这就是为什么我们将 AngularJS 的声明保持得尽可能简单，只声明了：


    ```html

    <html ng-app>

    ```


    然而，一种常见的最佳实践是通过赋予一个模块名称来为网页命名，例如：


    ```html

    <html ng-app="nameOfTheModule">

    ```


    `nameOfTheModule` 是该网页在 AngularJS 中的身份标识，你可以使用任何喜欢的名称。


    除了命名模块是最佳实践外，如果你让页面变得比我们目前所做的更复杂，那么它是强制性的。当然，为了快速测试，我们可以像这样创建一个未命名的 `ng-app`：


    ```html

    <html ng-app="">

    ```


    这里要小心，如果你使用了引号但没有名称，请确保引号之间没有空格，因为该空格会让 AngularJS 认为模块已命名，导致你会因为文件中没有该名称而报错。


    我最喜欢的测试语法仍然是 `ng-app`（或者为了兼容 HTML5 验证而使用 `data-ng-app`）。只有当我确实有一个需要包含的模块名称时，我才会使用扩展，这正是我们接下来要做的。


    ### 配置模块接口


    一旦我们为 `ng-app` 分配了名称，我们就必须配置该模块。


    以我们做的最后一个练习（**部分 B：初始化变量和输出计算结果**）为例。这个练习简单到足以帮助我们理解如何配置应用名称模块：


    ![](img/0002.jpeg)


    图 27（还没有应用模块名称）


    在上面的图片中，`ng-app` 没有名称且运行运行良好。


    但是，如果我们在 `<html ng-app>` 中插入一个名称，例如：


    ```html

    <html ng-app="myFirstAppModule">

    ```


    那么页面在配置模块接口之前将停止工作。


    配置应用模块的一种方法是在 HTML 页面 `BODY` 底部、指向 AngularJS 的链接正下方，打开一个新的 `<script></script>`
    容器。


    在脚本容器中，我们将一个函数调用赋值给某个变量（例如 `x`）。这个特定的函数或方法来自 Angular 库，它的名称是 `module`。示例代码：


    ```javascript

    var x = angular.module();

    ```


    下方可以看到此赋值的图片，但请先让我完成对该赋值的解释。


    在我们将 `module()` 赋值给变量 `x` 之后，我们将 `app` 的名称作为 `module()` 方法的第一个参数引入。第二个参数是一个空数组，它看起来应该如下：


    ```javascript

    var x = angular.module("myFirstAppModule",[]);

    ```


    传统上，变量 `x` 会根据模块命名，我们在该声明中会有两个 `myFirstAppModule` 单词（这些术语的重复不会产生冲突，因为它们位于代码的不同区域，但了解变量
    `x` 的用途将有所帮助）。然而，由于名称匹配不是强制性的，我将其命名为 `x`，以刻意说明模块名称所在的位置，以及它与变量无关。


    这个声明目前足够让我们的 `ng-app` 重新恢复活力。


    请仔细研究以下图片。


    ![](img/00029.jpeg)


    图 28（在给 ng-app 命名后，我们随后将该名称注册为模块）


    自己尝试一下。获取你的原始文件（[原始原始文件](http://icontemp.com/jpl/ang14/ang8.txt)），为你的 `ng-app`
    添加一个名称，并在 `BODY` 底部编写声明以向 Angular 注册模块。注意模块名称是如何在引号内引入函数 `module()` 的。它是作为字符串传递的。


    如果你需要帮助，请查看我的文件：


    [最终原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。


    **进一步解释：**


    查看变量 `x` 的声明。`x` 被赋值给属于对象 `angular` 的函数。这个名为 `module()` 的函数接受两个参数。第一个参数是包含我们要声明的模块名称的字符串。然后，用逗号隔开的是一个空数组。它们都需要被声明。


    数组的目的是包含为正在创建的模块未来的依赖项。有时我们希望使用其他子模块来增强这个特定的模块。由于使用其他相关模块非常常见，因此第二个参数是硬编码的，在声明新模块时必须包含它。在我们的情况下，我们只需写一个空数组，它就能工作。但是，如果你跳过了
    `[]`，模块将无法工作。我们必须在那里放置这两个括号。


    ## 5.6 准备分离数据


    ### 创建控制器


    恭喜，我们正在稳步地进入实际演示。


    稳步地进入 AngularJS 的实际演示。请耐心等待，我们快完成了。


    到为止，我们一直在使用 `ng-init` 初始化动态数据。


    ![](img/0030.jpeg)


    图 29（ng-init 将被页面底部的控制器取代）


    我们需要向正确标记的文件进行分离，但我们还没到那一步。我的意思是，我们应该能够在一个页面中看到整个画面，这正是我们在课程中所做的：学习 Angular 的基础部分。在这里将代码拆分到文件夹会增加不必要的复杂，我们现在不想这样做。


    我们接下来要执行的是停止在页面顶部使用 `ng-init` 编写数据，并将数据对象移动到页面底部（在我们插入模块声明的同一个脚本中）。我们的 JavaScript
    代码将编写在 `controller` 内部，这是一个特殊的 AngularJS 函数（我们刚刚创建的模块的方法或属性）。


    因此，现在我们将网页的主体分为以下概念区域：


    a) **标准 HTML 标记**和它的普通数据，即不需要 AngularJS 影响的数据。这些数据实际上位于页面的任何位置，因为动态数据将如所示封装在块中。


    b) **我们希望 AngularJS 显示某些动态数据的区域**。该区域被称为 `view`。AngularJS 在页面中注入许多微动态 `view`，它们与其余
    HTML 演示混合在一起。取决于你真正想做什么，它可能只有一个 `view` 或多个 `view`。


