    \ name:** `myController`\n- **Variable to display the result:** `result` (hint:\
    \ it will be `$scope.result` in the controller).\n- **Sentence to be dynamically\
    \ displayed:** *100 degrees Fahrenheit is 37.778 Celsius.*\n\n**NOTE:** make sure\
