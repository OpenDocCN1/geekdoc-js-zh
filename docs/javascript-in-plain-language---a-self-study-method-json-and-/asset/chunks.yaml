    ## 2.3 函数的解剖


    在上一个练习中，我们不断按下 `Up Arrow` 来调回程序进行测试。


    如果没有向上方向键怎么办？我们必须一遍又地编写脚本，对吧？


    这就是函数派上用场的地方。*停止！* 当提到 JavaScript 中的函数时，不要考虑数学。考虑 `functionality`（功能性）。在 JavaScript
    中，函数是程序例的容器。我们可以将 `if()`、`else` 脚本保存在函数中，只需通过 `calling the function` 来调用它。这只有一个词，而不是
    10 行文本。


    ### 关于函数需要预先的的


    a) 函数是一个闭合容器，就像下面图片中的蓝色矩形。


    b) 为了向函数输入数据进行处理，我们需要一个或多个 `input` 参数。


    c) 为了从函数中 `export` 数据以便重复使用，我们需要实现一个名为 `return` 的接口，或者，将某些外部变量赋值给新结果。


    ![](img/00006.jpeg)


    图 6


    ### 编写函数


    函数的表示形式如下：


    ```javascript

    function funcName() { stuff to do; }

    ```


    上面的表示不接受任何输入，它只是执行操作。


    要创建一个接受输入参数的函数，我们需要：

    ```javascript

    function funcName(inputParameter) { stuff to do; }

    ```


    当我们说 `call the function` 时，意味着编写函数名并附加一对括号：


    ```javascript

    funcName();

    ```


    或者，如果函数有 `argument`，我们必须包含：

    ```javascript

    funcName(123);

    ```

    当 `123` 是数字时。


    或者

    ```javascript

    funcName("Tony");

    ```

    当 `Tony` 是字符串时。


    这是一个任意命名为 `sizeUp` 的函数，将字符串值转换为大写：


    ```javascript

    function sizeUp(x){console.log(x.toUpperCase());}

    ```

    在这里，`x` 是输入参数。


    1- 调用函数：

    ```javascript

    sizeUp("red blue");

    ```

    它显示 `RED WHITE BLUE`。


