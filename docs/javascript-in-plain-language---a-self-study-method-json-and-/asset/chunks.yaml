  trans: "\n\n4- 关于问题 2 中的函数赋值，如果我将变量 `addTwo` 赋值给新变量 `x`，稍后我将 `addTwo` 重新赋值为数字 `33`，那么变量\
    \ `x` 和 `x()` 的值分别变成什么？\n\n5- 什么是函数输入参数？我们为什么需要参数？\n\n6- `arguments` 对象是函数原生的。我们该如何编写两个\
    \ `console.log` 语句，一个用于显示 `arguments` 对象中的第一个值，另一个用于显示 `arguments` 对象中的第三个值？\n\
    \n*   答案和进一步解释可以在这里找到：\n\n    [论坛](http://jsplain.com/javascript/index.php/Thread/27-Lab-12a/)\
    \ | bit.ly/1qqmwvg\n\n### B 部分：按值和按引用传递数据\n\n(*我的答案链接将发布在页末尾。你可以实际上导航到论坛在脑中回答这些问题，因为在点击单个答案按钮之前答案是不可见的*)\n\
    \n1- 在下方，我声明了两个变量。变量 `b` 的数值为 33，变量 `a` 被赋值为变量 `b` 的值：\n\n```\nvar b = 33;\nvar\
    \ a = b;\n```\n\na) 这是*按值*赋值还是*按引用*赋值？\n\nb) 如果我给 `b` 加 1，变量 `a` 的值会发生什么？\n\n\
    2- 在下方，我声明并赋值了两个变量。第一个变量 `c` 被赋值为一个数组。第二个变量 `d` 被赋值为一个函数。\n\n```javascript\nvar\
    \ c = [1,2,3];\nvar d = function(){ return 9;};\n```\n\na) 突然，我将 `c` 的值赋值给 `d`，例如\
    \ `d = c`。现在 `d` 的值是什么？重新赋值后，`d` 的原始值发生了什么？\n\nb) 如果我将 `c` 重新赋值为 `null`，那么 `d`\
    \ 的值是多少？\n\n```javascript\nc = null;\n```\n\n3- 在以下脚本中，当我们调用函数 `myCastle()` 时，它的输出是什么？\n\
    \n```javascript\nvar f = 33;\nvar myCastle = function() {\n var f = \"Santarem\"\
    ;\n return f;\n};\nmyCastle();\n```\n\n4- 你如何重写脚本以输出外部变量 `f`，而不是内部变量 `f`？\n\n\
    5- 在普通网页中，哪个对象作为所有全局变量的父对象？\n\n6- JavaScript 中哪种数据结构以私有方式封装元素的能力？\n\n*   答案和进一步解释可以在这里找到：\n\
    \n    [论坛](http://jsplain.com/javascript/index.php/Thread/28-Lab-12b/) | bit.ly/1rm2pUg.\n\
    \n### C 部分：在字符串中查找并替换单词\n\n该项目的目标是创建一个机制，查找段落中的一个单词并将其替换为另一个单词。并将是将段落中的 *brown*\
    \ 替换为 *red*：\n\n\"The quick **brown** fox jumps over the lazy dog.\"\n\n使用的工具如下：\n\
    \n*   几个作为辅助的变量名：\n\n    `paragraph` – 赋值为原始段落。\n\n    `tempArray` – 赋值为字符串转换为数组的结果。\n\
    \n    `oldWord` – 赋值为单词 \"brown\"，即我们搜索并进行替换的单词。\n\n    `newWord` – 赋值为单词 \"red\"\
    ，即我们想要作为替换的单词。\n\n*   `split()`，将字符串转换为独立单词的数组。\n\n    分割字符串的结果将赋值给名为 `tempArray`\
    \ 的数组。\n\n    （将字符串句子转换为单词数组是为了我们能够定位到想要替换的单词）。\n\n*   一个 `for` 循环。循环将遍历数组以找到目标单词并替换它。\n\
    \n*   `join()`，稍后将数组重新转换回字符串。\n\n我们首先将其拆分为数组，然后搜索并替换，最后转换回字符串并将结果赋值回变量 `paragraph`。\n\
    \n最后我们使用 `console.log` 打印变量 `paragraph` 以显示最终结果。\n\n这听起来可能很复杂，但在第一次尝试之后就会变得简单。\n\
    \n这是一份操作指南：\n\n1. 声明原始字符串变量。\n2. 将变量转换为单个单词。\n3. 引入需要查找的单词。\n4. 引入用于替换现有单词的新单词。\n\
    5. 遍历数组以查找并替换单词。\n6. 通过将修改后的数组赋值给原始变量将其重新转换为字符串。\n7. 显示你的结果。\n\n花时间思考。如果你需要编辑器，请使用\
    \ *jsbeautifier.org* 来编写你的脚本。然后将其粘贴到控制台进行测试。\n\n*   如需快速查看或进一步解释以及我这个项目的最终版本，请参考：\n\
    \n    [论坛板块](http://jsplain.com/javascript/index.php/Thread/29-Lab-12-c/) | bit.ly/1pqFAcC.\n\
    \n    或直接查看 [原始文件](http://icontemp.com/jpl/lab12c.txt) | bit.ly/1uVMHjS.\n\n###\
    \ D 部分：使用函数保存并召回我们的代码\n\n做得好！现在让我们更进一步：\n\n让我们将脚本保存在名为 `findReplace` 的函数中。\n\n\
    此思路是将 `oldWord` 和 `newWord` 都转换为输入参数。\n\n```javascript\nfunction findReplace()\
    \ {\n```\n\n或者\n\n```javascript\nvar findReplace = function() { };\n```\n\n此时此时，使用函数创建可以在多个应用程序中重用的方法，其重要性应该是显而易见的。\n\
    \n**示例：**\n\n```javascript\nfindReplace(\"brown\", \"red\");\nfindReplace(\"quick\"\
    , \"slow\");\n```\n\n在上一个项目中我们创建了自动查找和替换，但它只对 `paragraph` 起效。如果能有一个可移植的函数，以便将其应用到其他变量甚至字符串，那就好了。\n\
    \n为了使项目更具可移植性，我们需要添加第三个输入参数，一个代表目标变量或任何字符串的参数。\n\n1- 我们只需要添加第三个参数，并将函数内部所有的 `paragraph`\
    \ 实例替换为新的输入参数名称。\n\n我将我的输入参数命名为 `data`。\n\n*   如需快速查看或进一步解释以及我这个项目的最终版本，请参考：\n\
    \n    [论坛板块](http://jsplain.com/javascript/index.php/Thread/31-Lab-12-e/) | bit.ly/1mqMRhT.\n\
    \n    或直接查看 [原始文件](http://icontemp.com/jpl/lab12e.txt)。bit.ly/1uij9.\n\n如果你想不出可以测试脚本的示例，请查看论坛板块中的两个测试数据样本。你应该在刚刚讨论的脚本下方找到它们。\n\
    \np.s. *我很高兴你能走到这里，感谢你！*\n\n我们几乎完成了 JavaScript 课程和练习。然后，JSON 和 AngularJS 将是可选的学习内容，如果你以后需要休息，可以以后再处理。然而，请记住这个事实：“眼不见为净”。如果你不经常练习，你就会忘记，然后你必须从头开始阅读书籍。\n\
    \n## 3.5 更多分支技术\n\n### switch\n\n到目前为止，我们学习了 `if()`、可能的 `else if()` 和可选的 `else`\
    \ 条件语句，对吧？\n\n```javascript\nif(true) {\n// 执行此项；\n} else if(true) {\n// 执行那个；\n\
    } else {\n// 转而执行这个；\n}\n```\n\n"
- fmt: "\nYou can do any possible outcome by using the above powerful combination\
    \ of `if`, `elses`.\n\nSometimes however, a different kind of branching makes\
    \ more sense. I’m talking about the one known as `Switch` and I just want to make\
    \ sure it is explained in case you need to use it.\n\nIt is called `switch` because\
    \ there are several possible outcomes from which JavaScript makes an executable\
    \ decision. These possible outcomes are all in `off` state, and JavaScript will\
    \ turn one `on` based on a matching Boolean condition, as we you’ll see next.\n\
    \nHere’s the layout diagram:\n\n![](images/00016.jpeg)\n\nFig 16\n\nOn line 1\
    \ we declare a `switch`. This switch function method takes a condition from which\
    \ JavaScript will compare all the outcomes in order to select one of the possible\
    \ executions.\n\nIn our generic example (based on the cases we have), the “condition\
    \ to match” should be substituted by either a `1`, `2`, or `3`, so it matches\
    \ one of the cases presented. If any of these cases matches the condition, JavaScript\
    \ executes the code given by the `case`. The Boolean `true` is what unlocks the\
    \ case.\n\nExample: if the correct case is 3, JavaScript will ask:\n\n“is it 1?\
    \ Ans: false”,\n\nis it 2? Ans: false”,\n\nis it 3? Ans: true”, run the code,\n\
    \nBREAK and END.\n\nAfter the execution of a `case`, JavaScript exits the `switch`\
    \ due to the `break` command that follows. If we don’t include the `break` command,\
    \ then JavaScript will search for more possible results and you may have several\
    \ correct answers instead of just one. And even if there are no other correct\
    \ answers, JavaScript still reads all the other conditions which could be a time\
    \ delay if the switch has thousands of possibilities programmed in it. So the\
    \ `break` is a very important implementation.\n\nWhenever there are no conditions\
    \ that match, the optional `default` takes over as the final and `true` option\
    \ and its code is executed. Notice that I did not include a `break` after `default`.\
    \ You could, but it is not necessary because JavaScript exits the `switch` at\
    \ this time anyway.\n\nFor further reading please visit [this post](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)\
    \ | bit.ly/1r4XRCL on the `forum`. Let’s practice a bit with switches.\n\n## 3.6\
    \ Lab work 13\n\n### 13a: Switch - using Boolean matches\n\nThis script will employ\
    \ a `switch` with 4 possible outcomes. The user will try to guess a number, and\
    \ the program will display a feedback message of either, `too low`, `too high`,\
    \ `right!` or `That’s not a number`:\n\n1. Create a `switch` inside of a function\
    \ named `guessNum`.\n2. This function takes one input parameter, `num`.\n3. The\
    \ `switch` should be hard wired to `true`.\n\nExample: `switch(true)`\n\n4. The\
    \ cases should have the following conditions:\n   - `num <= 3` displays \"too\
    \ low\"\n   - `num >= 5` displays \"too high\"\n   - `num === 4` displays \"right,\
    \ the number was 4\"\n   - for `default` use \"*That's not a number*\"\n\n5. Call\
    \ the function by passing a numeric argument like for example:\n```\nguessNum(2);\n\
    guessNum(7);\nguessNum(4);\nguessNum(\"a\");\n```\n\n*   For a quick peek or further\
    \ explanation and my own final version of this project please refer to the\n \
    \   [forum board](http://jsplain.com/javascript/index.php/Thread/32-Lab-13a/)\
    \ | bit.ly/1qqwkWc\n    or just the [raw file](http://icontemp.com/jpl/switch1.txt)\
    \ | bit.ly/1r50ODq\n*   Think of expressions. `num <= 3` will be converted to\
    \ `true` or `false`. The same goes for all the other cases and therefore the switch\
    \ to match should be a Boolean `true`.\n\n### 13b: Switch - using literal matches\n\
    \nOn this next project we are going to use the following:\n\n* A function named\
    \ `myFavColor`,\n* A `prompt()` to get an input from the user, which will be converted\
    \ to lower case so it matches one of the cases. (JavaScript is case sensitive).\n\
    * Some `confirm()` outputs so that we don’t always use `console.log`,\n* And some\
    \ meaningful statements about `color`.\n\nThe statements are as follows (you can\
    \ always make your own or copy from this [raw file](http://icontemp.com/jpl/colors1.txt)\
    \ | bit.ly/1ypn1A2):\n\n* Green is the color of balance and growth.\n* Blue is\
    \ the color of trust and peace.\n* Indigo is the color of intuition.\n* Purple\
    \ is the color of the imagination.\n* Orange is the color of social communication\
    \ and optimism.\n* Sorry, that color is not in the system yet!\n\n1. Please remember:\
    \ the purpose of creating a function is to recall the program without having to\
    \ retype it again. It works great for testing purposes and in real life as well.\
    \ So the whole `switch` should be wrapped in a function. Please feel free to choose\
    \ the function style you prefer, a function declaration, or a function expression\
    \ which is the one assigned to a variable.\n\nI will use the first method:\n```\n\
    function myFavColor() {}\n```\n\n2. Inside of the function, the `prompt()` will\
    \ be assigned to variable `color`.\n3. The `switch` expression should be the value\
    \ of `color`:\n```\nswitch (color) {\n```\n4. Each case needs to be in lowercase:\n\
    ```\ncase \"green\":\n```\n5. The output from each `case` should be a `confirm()`\
    \ followed by a `break`:\n```\nconfirm(\"Green is the color of balance and growth.\"\
    );\nbreak;\n```\n6. When no color matches, the `default` execution takes over\
    \ (no break is necessary):\n```\ndefault:\nconfirm(\"Sorry, that color is not\
    \ in the system yet!\");\n```\n7. Finally, don’t forget the two closing braces:\
    \ one for the switch and another for the function (the ones shown in red on the\
    \ top of).\n\n*   For a quick peek or further explanation and my own final version\
    \ of this project please refer to the\n    [forum board](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/)\
    \ | bit.ly/Zca\n    or just the [raw file](http://icontemp.com/jpl/colors2.txt)\
    \ | bit.ly/1DwVBsd\n\nTo test your script just call the function and follow the\
    \ prompts:\n```\nmyFavColor();\n```\n\n### 13c: A repeating switch\n\nSometimes\
    \ we want the script to run repeatedly such as for example in a game, until we\
    \ purposely decide to exit.\n\nIn order to make our previous script repeatable\
    \ all we have to do is to call the function `myFavColor()` just before we close\
    \ the function, and the function will trigger a new instance of the game.\n\n\
    When I first introduced the `confirm()` mechanism I had mentioned that `confirm()`\
    \ can return a Boolean `true` if we press OK, or a Boolean `false` if we press\
    \ Cancel. We can catch this returned data to trigger the new function call, and\
    \ one way to do it is add the following code just before closing the outer function\
    \ (the variable name `replay` is arbitrary):\n\n```\nvar replay = confirm(\"click\
    \ ok to play again, or cancel to exit\")\n\nif (replay === true) {\n  myFavColor();\n\
    }\n\n} // this curly brace is already there, it is the very last brace on the\
    \ bottom\n```\n\nSo in a sense we grab the Boolean `true` from the `confirm` mechanism\
    \ and reuse it to call `myFavColor()`.\n\n*   For a quick peek or further explanation\
    \ and my own final version of this project please refer to the\n    [forum board](http://jsplain.com/javascript/index.php/Thread/34-Lab-13c/)\
    \ | bit.ly/1ogVffh\n    or just the [raw file](http://icontemp.com/jpl/colors3.txt)\
    \ | bit.ly/1vdaYQT\n\n### 13d: Using a while loop to repeat the script\n\nWe have\
    \ not covered while loops. The only loops we have covered were the `for loop`\
    \ for arrays and the `for in loop` for objects.\n\nA ***while loop*** is one that\
    \ runs indefinitely until something triggers the loop to exit.\n"
