  trans: "\n我们刚刚从数组 `x` 中删除了 `blue, red, green`。\n\n### 3- 调用数组：`x;`\n\n它返回 `[\"violet\"\
    , \"brown\"]`，因为位于位置 0,1,2 的原始项被删除了。\n\n### 使用 `splice()` 添加项：\n\n### 4- 让我们把项加回数组，从零位置开始，且不删除任何现有项作为交换：`x.splice(0,0,\
    \ \"blue\",\"red\",\"green\");`\n\n### 5- 调用数组：`x;` 返回 `[\"blue\", \"red\", \"\
    green\", \"violet\", \"brown\"]`。\n\n我们从零位置开始添加了所有列出的项，并删除了零个项。\n\n你可能在编程中不会频繁使用\
    \ `splice()`，但它是需要时去理解并调用的绝佳工具。\n\n我们还有很多可以使用于数组的方法。一次性学习所有方法会让人无所适从。考虑购买我的另一本关于\
    \ JavaScript 库方法的[书](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)作为参考，并获取它们如何运作的简单解释，可能会是一个好主意。如果我觉得在这里一次包含所有其他方法会有帮助，我就会这样做。当然，你随时可以搜索并希望不要被互联网上某些虚假的解释所误导或分心。了解这些工具是成为该领域大师的重要一步。\n\
    \n## 2.12 实验作业 9\n\n注意：如果你想和我一起做这个练习，请跳过接 14 步。\n\n将此页留作以后练习。\n\n### 1- 以以下数组\
    \ `y` 为例并对数组排序：\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\n\
    ```\n\n### 2- 现在将排序后的数组 `y` 的内容赋值给新数组 `mySort`。\n\n### 3- 通过在控制台显示内容来测试 `mySort`。\n\
    \n### 4- 现在，以 `string` 类型格式显示数组 `mySort`，并用一个空格分隔项。提示：使用 `join()`。\n\n### 5- 现在，不要仅仅是显示它，而是将\
    \ `mySort` 中的项赋值给新变量 `z`，但使用字符串格式。使用“空格、正斜杠和空格”的组合作为分隔符。\n\n### 6- 调用 `z`。\n\n\
    ### 7- 使用 `indexOf()` 方法找到 \"banana\" 在数组 `y` 中的位置。\n\n### 8- 测试 \"banana\" 是否存在于数组\
    \ `y` 中（使用 if 条件语句），并使用 `console.log()` 在屏幕上显示以下消息：\n\n```javascript\n\"banana\
    \ is contained in array y\"\n```\n\n### 9- 使用与上一个练习相同的方法查找 \"chestnut\"，然后显示两条消息，一个用于\
    \ `if()`，另一个用于 `else`，如下：\n\n`\"chestnut is contained in array y\"` \nelse: `\"\
    chestnut is not found in array y\"`。\n\n### 10- 使用 `pop()` 移除数组 `mySort` 的最后一个项：\n\
    \n### 11- 使用 `shift()` 移除数组 `mySort` 的第一个项：\n\n### 12- 数组 `mySort` 现在应该只包含 \"\
    banana\"。\n\n添加 \"chestnut\" 作为最后一项。使用 `push()`。\n\n`mySort` 现在应该有 2 个项，`[\"banana\"\
    , \"chestnut\"]`。\n\n### 13- 使用 `splice()`，在数组 `mySort` 的位置 1 插入 \"apple\"（作为第二个项）。不要删除任何现有项。\n\
    \n`mySort` 现在应该包含 `[\"banana\", \"apple\", \"chestnut\"]`。\n\n### 14- 使用 `slice()`\
    \ 创建名为 `newArray` 的新数组，其中包含 `mySort` 数组中第二和第三项（\"apple\" 和 \"chestnut\"）的副本。`newArray`\
    \ 现在应该包含 `[\"apple\", \"chestnut\"]`。\n\n（参见我在下一页的结果。）\n\n## 实验作业 9 的答案：\n\n###\
    \ 1- 以以下数组 `y` 为例并对数组排序：\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"\
    ];\ny.sort();\n```\n\n它返回 `[\"apple\", \"banana\", \"grape\"]`\n\n### 2- 将排序数组\
    \ `y` 的内容赋值给新数组 `mySort`：\n\n```javascript\nvar mySort = y.sort();\n```\n\n###\
    \ 3- 测试 `mySort`：\n\n```javascript\nmySort;\n```\n\n它返回 `[\"apple\", \"banana\"\
    , \"grape\"]`\n\n### 4- 现在以字符串类型格式显示数组 `mySort`，并用一个空格分隔项。提示：使用 `join()`：\n\n\
    ```javascript\nmySort.join(\" \");\n```\n或者你可能这样做了，这也是正确的：\n\n```javascript\n\
    console.log(mySort.join(\" \"));\n```\n\n它返回字符串格式的 `\"apple banana grape\"`。\n\
    \n### 5- 现在，不要仅仅是显示它，而是将 `mySort` 中的项赋值给新变量 `z`，但使用字符串格式。使用“空格、正斜杠和空格”的组合作为分隔符：\n\
    \n```javascript\nvar z = mySort.join(\" / \");\n```\n\n### 6- 调用 `z`：\n\n```javascript\n\
    z;\n```\n\n它返回 `\"apple / banana / grape\"`\n\n### 7- 使用 `indexOf()` 方法找到 \"banana\"\
    \ 在数组 `y` 中的位置：\n\n```javascript\ny.indexOf(\"banana\");\n```\n\n它返回 1，意味着 \"\
    banana\" 存在并位于位置 1（第二个项）。\n\n### 8- 测试 \"banana\" 是否存在于数组 `y` 中（使用 if 条件语句），并使用\
    \ `console.log()` 在屏幕上显示以下消息：\n\n```javascript\nif (y.indexOf(\"banana\") >= 0)\
    \ {\n    console.log(\"banana is contained in array y\");\n}\n```\n\n### 9- 使用与上一个练习相同的方法查找\
    \ \"chestnut\"，然后显示两条消息，一个用于 `if()`，另一个用于 `else`，如下：\n\n```javascript\nif (y.indexOf(\"\
    chestnut\") >= 0) {\n    console.log(\"chestnut is contained in array y\");\n\
    } else {\n    console.log(\"chestnut is not found in array y\");\n}\n```\n\n###\
    \ 10- 使用 `pop()` 移除数组 `mySort` 的最后一个项：\n\n```javascript\nmySort.pop();\n```\n\n\
    ### 11- 使用 `shift()` 移除数组 `mySort` 的第一个项：\n\n```javascript\nmySort.shift();\n\
    ```\n\n### 12- 数组 `mySort` 现在应该只包含 \"banana\"。\n\n添加 \"chestnut\" 作为最后一项。使用 `push()`。\n\
    \n```javascript\nmySort.push(\"chestnut\");\n```\n\n### 13- 使用 `splice()`，在数组\
    \ `mySort` 的位置 1 插入 \"apple\"（作为第二个项）。不要删除任何现有项。\n\n```javascript\nmySort.splice(1,\
    \ 0, \"apple\");\n```\n\n### 14- 使用 `slice()` 创建名为 `newArray` 的新数组，其中包含 `mySort`\
    \ 数组中第二和第三项（\"apple\" 和 \"chestnut\"）的副本。\n\n```javascript\nvar newArray = mySort.slice(1,\
    \ 3);\n```\n\n## 2.13 实验作业 10\n\n### 构建从数组获取变量的机制\n\n这个练习将回顾变量赋值、创建包含元素的数组、函数声明、变量重新赋值以及\
    \ `indexOf` 的用法。主意是调用函数并选择语言作为参数。然后，根据所选的语言将显示正确的句子。听起来有趣吗？\n\n示例：\n\n调用 `show(english);`\n\
    \n显示此句子：\n\nThe quick brown fox jumped over the lazy dog\n\n* 注意 `english` 没有被引号包裹（并且是小写）。这告诉我们它必须是一个变量名，而不是字符串。\n\
    \n我使用了 [Google 翻译](https://translate.google.com/) 将我的句子从英语翻译成葡萄牙语和西班牙语（后来还有法语）。如果听起来很奇怪，请母语者见谅，我是好的。\n\
    \n***请独立完成练习。最后将提供我自己的文件链接。也将提供中间文件以便你检查工作。***\n\n### 1- 声明名为 *english*、*portuguese*、*spanish*\
    \ 的三个变量。\n\n分别为每个变量分配以下句子：\n\n（方便复制的链接：[原始文件](http://icontemp.com/jpl/fox.txt)\
    \ | bit.ly/1mpqCsr )\n\n\"*The quick brown fox jumped over the lazy dog*\"\n\n\
    \"*A ligeira raposa marrom saltou sobre o cão preguiçoso*\"\n"
- fmt: "\nEl rápido zorro marrón saltó sobre el perro perezoso\n\n## 2- Declare an\
    \ array named `langVersion` with the following elements:\n\n`english`, `portuguese`,\
    \ `spanish`.\n\nRemember, since these names are already declared as variables,\
    \ we should not write them in quotes, just separate them with commas.\n\nThe purpose\
    \ of this array is to save each variable in a sequence. Couldn’t we just use the\
    \ variables directly and forget about the array? Yes, we could. However, in a\
    \ large program those variables will be saved along with many others and by creating\
    \ an array we are listing the variables related to language translation, which\
    \ can be further manipulated, edited, erased or even become part of a larger group\
    \ of languages. Of course there are other ways to do this but right now we are\
    \ practicing with arrays and it is a very important practice.\n\n## 3- Declare\
    \ one more variable named `sentence` with the numeric value of `0`.\n\nThis variable\
    \ will be used to store the location number of the language we are going to select\
    \ from all the languages in the array.\n\nThe reason why we are giving this variable\
    \ a value of zero is to tell JavaScript ahead of time that this variable will\
    \ be numeric. In reality JavaScript will change the type of value if needs be,\
    \ but it is a good practice to declare our intention, even if this intention may\
    \ only help a human inspecting the code, rather than helping JavaScript to process\
    \ it.\n\n(Link to convenient copy/paste for steps 1,2,3: [raw file](http://icontemp.com/jpl/fox1.txt)\
    \ | bit.ly/1Dt7fnS )\n\n## 4- Below your current code, create a function named\
    \ `show`.\n\nThe purpose of this function will be to display the correct sentence\
    \ based on the language we choose when we call the function. The sentence will\
    \ be picked from the array of languages.\n\n```\nfunction show() {}\n```\n\n##\
    \ 5- Introduce to the function an input parameter named `language`.\n\n## 6- In\
    \ the function’s body, line 1, reassign the already declared variable `sentence`\
    \ to the location number of the language selected. We do this by using `indexOf()`\
    \ to find the location, like this:\n\n```\nsentence = langVersion.indexOf(language);\n\
    ```\n\nLater, when we call the function, like for example `show(portugese)`, the\
    \ parameter `language` will be replaced by whatever language argument we give\
    \ to the function. And the `indexOf(language)` will assign variable `sentence`\
    \ with the correct array address for that language.\n\n## 7- Finally, on the next\
    \ line and still inside of the function body, write a `console.log` to display\
    \ the contents of the variable chosen when someone calls the function:\n\n```\n\
    console.log(langVersion[sentence]);\n```\n\nFrom step 6 we know that variable\
    \ `sentence` is the location number of one of the items in the array.\n\n## 8-\
    \ Paste your code on the Console and call the function `show()` to test each sentence\n\
    \n(Note: if you get an error thank the gods for the opportunity to do some debugging\
    \ because it is a very good practice):\n\n```\nshow(english);\nshow(portugese);\n\
    show(spanish);\n```\n\nYou may see on your screen the term `undefined` after the\
    \ output sentence. That is normal in test Consoles. It is just telling us that\
    \ the function `show()` did not explicitly return anything and so, it automatically\
    \ returns `undefined` because JavaScript functions always return something.\n\n\
    See the final version on the following links:\n\n[forum](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ | [raw text](http://icontemp.com/jpl/fox2.txt).\n\nbit.ly/1r0Ho2D | bit.ly/1mCJogu\n\
    \n### Side note:\n\n*   If something is not clear, do not move forward until you\
    \ consciously frame a question. Stop, step back and try to see what each line\
    \ is attempting to do. Try it 100 times if you need to do so. Then, when you think\
    \ you know what it is that you don’t understand, move forward to see if understanding\
    \ comes at the end of the assignment when you look at the script as a whole. Do\
    \ not let it go if you have any doubts. Concepts need to be thought of; we can’t\
    \ fly over them and think that we will get them later.\n*   On the other hand,\
    \ understanding comes in layers, but we consciously need to make sure we can continue\
    \ our path even if we don’t fully grasp the idea about something. Ask yourself\
    \ a question and give yourself an honest answer before moving forward. They say\
    \ that the act of asking is in itself half of the answer and many times the answer\
    \ becomes obvious when we properly frame the question.\n\n### Adding French to\
    \ the array\n\nSuddenly someone complains because there is not French version\
    \ of the Quick brown fox.\n\n## 1- If you still have your Console open, add a\
    \ variable `french` at the prompt:\n\n```\nvar french =\n```\n\nDon’t worry about\
    \ being all the way at the bottom of the script. We are just testing stuff. Notice\
    \ how `french` is in small letters. Variables start with small letters.\n\n##\
    \ 2- Assign the following line to variable `french`:\n\n\"*Le renard brun rapide\
    \ saute par dessus le chien paresseux*\"\n\n[raw file](http://icontemp.com/jpl/fox3.txt).\
    \ | bit.ly/1wGvYQS.\n\n## 3- Now, use the method `push()` to insert the variable\
    \ `french` into the array `langVersion`.\n\n```\nlangVersion.push(french);\n```\n\
    \n## 4- Test the script by calling\n\n```\nshow(french);\n```\n\n*   See final\
    \ version here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ | [raw text](http://icontemp.com/jpl/fox2.txt).\n\n### Printing out the array\n\
    \nDo you still remember how to create a *for* loop? In this project we will *console.log*\
    \ the array elements.\n\n## 1- Create a *for* loop to print: I will use the common\
    \ designation `i` as a counter, and `langVersion.length` as the limiter.\n\n##\
    \ 2- In the loop body, *console.log* the contents of array.\n\nThis is accomplished\
    \ by dynamically addressing `langVersion[i]`, as the loop repeats.\n"
