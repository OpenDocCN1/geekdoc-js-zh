    \ by calling\n\n**show(french);**\n\n*   See final version here:\n\n    [forum](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ | [raw text](http://icontemp.com/jpl/fox2b.txt).\n\n    bit.ly/1r0Ho2D | bit.ly/1mCJogu\n\
    \n### Printing out the array contents\n\nDo you still remember how to create a\
    \ *for loop*? for loops are great to traverse array elements.\n\nIn this project\
    \ we are going to create a *for loop* to *console.log* the items from array *langVersion*\
    \ just to illustrate a point leading us to our next topic.\n\nIf you don’t have\
    \ the previous script on your Console, copy it from the previous page all the\
    \ way at the bottom, and paste it on the Console. Then proceed to step 1:\n\n\
    1- Create a for loop to print the array elements to screen.\n\nI will use the\
    \ common designation ***i*** as a variable for the counter,\n\nand *langVersion.length*\
    \ as the limiter for my loop repetition.\n\n2- In the loop body, *console.log*\
    \ the contents of the array.\n\nThis is accomplished by dynamically addressing\
    \ *langVersion[i]*,\n\nwhich is the current location of each element as the loop\
    \ repeats itself.\n\n*   See my script on the [forum](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ (the **fourth** script shown) | bit.ly/1r0Ho2D\n\n    or as a [raw file](http://icontemp.com/jpl/fox4.txt)\
    \ | bit.ly/1DtOsZu\n\n***Did you notice how the variable names are not being printed?***\n\
    \nThe only thing we get displayed is the *text value* from each variable.\n\n\
    That’s because each variable name is instantly evaluated by JavaScript and the\
    \ value to which the variable points to is the one that JavaScript fetches and\
    \ displays on the screen.\n\n**What if we just wanted a list of the variable names\
    \ as shown on the array?**\n\nTo get those labels (english, portuguese, etc) we\
    \ would need to write **console.log(i)** by itself, instead of **console.log(langVersion[i])**.\
    \ However, that would only print 0,1,2,3\\. Not the name of the variables, right?\n\
    \nI really would like to display my labels. **How can we list those?**\n\nThat\
    \ will be covered on the next topic. You see, *arrays* work great and are frequently\
    \ used but they are not always the best [data structure](https://en.wikipedia.org/wiki/Data_structure)\
    \ for the job at hand. When it comes to labels such as the names of those variables,\
    \ an ***unordered list*** may be more appropriate, as opposed to an *ordered list*\
    \ like an array.\n\nLet’s move forward and talk about unordered lists. If they\
    \ are unordered we don’t address them numerically, right?\n\nLet’s see how we\
    \ handle unordered lists. They are really popular and useful.\n\nEND OF LAB\n\n\
    ## 2.14 Unordered lists\n\n*   We have seen how the numeric [data structure](http://en.wikipedia.org/wiki/Data_structure)\
    \ of type *array* stores data in its ‘pockets’. The first item goes on pocket\
    \ *zero*, the second item on pocket 1, the third item goes on pocket 2, etc."
