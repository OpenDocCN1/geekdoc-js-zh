  raw: "Instead of using ***i*** as a counter variable I am going to use a variable\
    \ named ***apples***. Please feel free to use whatever you want. The goal for\
    \ this exercise is to practice more ***for*** loop constructs and to think on\
    \ how would we distinguish between a single output and a plural output.\n\n*See\
    \ my own solution here on exercise number 4:*\n\n[apples](http://jsplain.com/javascript/index.php/Thread/14-Lab-7/)\
    \ ) bit.ly/XScVak\n\nEND OF LAB\n\n## 2.9 Array lists\n\n### Strings versus arrays\n\
    \nUp to now we have been working mostly with *string* values. Here’s an example\
    \ of a string value assigned to variable *x* which has already been initialized\
    \ by *var* :\n\nx = \"orange\";\n\nAs far character mapping is concerned, *o*\
    \ is the first character located in position *zero*, *r* is the second character\
    \ located in position 1, *a* is the third character located in position 2, etc.\n\
    \nHere’s another example:\n\ny = \"orange banana apple\";\n\nIn the above example,\
    \ *b* is the eighth character (we must count the white spaces) and it’s located\
    \ in position number **7** (*0,1,2,3,4,5,6,7*).\n\n**What if we wanted to count\
    \ the words instead of counting the number of characters?**\n\nWe can’t separate\
    \ the words with individual quotes because JavaScript will throw an error:\n\n\
    y = \"orange\" \"banana\" \"apple\"; <-- this would not work.\n\nAnd even if we\
    \ separate them with commas,\n\ny = \"orange\",\"banana\",\"apple\";\n\nJavaScript\
    \ will first assign *y* to *orange*, then reassigns y to *banana*, and finally\
    \ to ***apple*** which, in the end, will be the only value stored in *y*.\n\n\
    So in string values, mapping is **limited to individual characters**. The whole\
    \ string is considered one unit of multiple characters.\n\n*   ***In short***,\
    \ if we want to save words as separately independent units on a variable, we need\
    \ to use a different *data type* because *string* will not do it. One of such\
    \ types is called an ***array*** (there are others).\n\nThe difference between\
    \ an *array* type and a *string* type is that we can store individual words. Another\
    \ advantage of an array is that we can also store values of type *number*, as\
    \ well as other types such as *functions*, *objects* and *Booleans* in individual\
    \ packets of the same variable.\n\nJust like a string value, in arrays we also\
    \ address each position numerically starting from location zero. In fact, a string\
    \ value is a very simple array of individual characters.\n\n***Think of an array\
    \ as a pocket folder***.\n\nEach pocket is sequentially labeled and in each pocket,\
    \ we can store anything we want.\n\nTo retrieve the contents of each pocket we\
    \ call the array with bracket syntax and use the location number to address the\
    \ data we are trying to fetch.\n\nArray syntax\n\nTo declare a value of type *array*\
    \ we use a pair of square brackets:\n\nvar x = [ ];\n\nYou may read on the web\
    \ about bracket syntax  as being referred to as array syntax and the reason is\
    \ that bracket syntax comes from the idea of array pocket locations.\n\nThe above\
    \ example is an empty array because it does not have any data inside of the brackets,\
    \ but the square brackets have instructed the JavaScript interpreter to declare\
    \ variable ***y*** as a *type array*.\n\nGoing back to our last string example,\
    \ if we want to save individually independent words we can declare and assign\
    \ variable *y* in the following manner:\n\n **var y = [\"orange\",\"banana\",\"\
    apple\"];**\n\nNow if we call y’s location number 2, we get \"apple\" as a result:\n\
    \n**y[2];** <-- it displays \"apple\"\n\nor more implicitly:\n\n**console.log(**y[2]**);** \
    \ <-- it displays apple\n\nKnowing that our array *y* has three values spanning\
    \ from location zero to location 2, we can add more values to it by addressing\
    \ subsequent locations. Example:\n\n**y[3] = \"peach\";**\n\nNow if we call variable\
    \ *y* on the Console by typing **y;** we get:\n\n[\"orange\", \"banana\", \"apple\"\
    , \"peach\"]\n\nWhat happens if we reassign one of the existing locations such\
    \ as for example location zero?\n\n**y[0] = \"grape\";**\n\nWe overwrite the previous\
    \ value because we have just reassigned the location to a different value. The\
    \ array will not shift positions to accommodate one more items, it just deletes\
    \ the existing value by reassigning the location to something else.\n\nArray *y*\
    \ now still contains the previous number of values as follows:\n\n[\"grape\",\
    \ \"banana\", \"apple\", \"peach\"]  \"orange\" was deleted.\n\n### Using push()\
    \ and unshift() to insert elements into an array\n\nAs arrays get larger it becomes\
    \ almost impossible to know how many items the array contains which makes it very\
    \ difficult to add new items since when we add an item to a position in the array\
    \ and this position is already filled, JavaScript replaces the new item with the\
    \ old item. The old item is deleted from the array.\n\nTo prevent this deletion\
    \ from happening, JavaScript has two mechanisms that help us add items to an array:\
    \ *push* and *unshift*.\n\n**Push()**\n\nThe most common way of adding new items\
    \ to an array is by adding them to the very end of the list.\n\n*   The array\
    \ method *push()* adds items to the very end of the list.\n\nDo you remember how\
    \ we appended characters to a string by using *+=* ?\n\nThe problem with += is\
    \ that it adds the new item to the last item as one unit (by attachment).\n\n\
    For example, in\n\nvar y =[\"orange\",\"banana\",\"apple\",\"peach\"];\n\nIf we\
    \ write **y += \"cherry\";**\n\nwe will get \"*orange, banana, apple, peachcherry*\"\
    \n\nand that’s not what we want to accomplish in an array, right?\n\nWe want independent\
    \ items.\n\n*   The correct syntax to add items to the end of an array is as follows:\n\
    \n    ** y.push(\"cherry\");**\n\nWe call the array method push() with *dot syntax*\
    \ and pass in \"cherry\" as a data argument. It works just like calling a function\
    \ with an argument data.\n\nNow the array contains one more element:\n\n[\"orange\"\
    , \"banana\", \"apple\", \"peach\", \"cherry\"]\n\nLet’s add one more item, *avocado*:\n\
    \n**y.push(\"avocado\");**\n\nNow array ***y*** contains the following items:\n\
    \n[\"orange\", \"banana\", \"apple\", \"peach\", \"cherry\", \"avocado\"]\n\n\
    **The meaning of push:**\n\nImagine a stack of bricks. When we place a new brick\
    \ on the stack it pushes down the others because of its weight. The top of the\
    \ stack is the last position of the array. We push it in order to insert a new\
    \ item into the stack.\n\nNow, if you visualize the array in a horizontal manner\
    \ instead of vertically, the last item is on your right side.\n\nWe will use push()\
    \ many times throughout the book since it is the most common way to insert new\
    \ array items.\n\n**unshift()**\n\nThe method *unshift()* adds items to the beginning\
    \ of the array.\n\nWhen we visualize the array vertically the beginning of the\
    \ array is the very bottom of it, and horizontally, it is the left most side of\
    \ the array.\n\nTaking the last instance of array ***y*** from the previous topic\
    \ as an example, let’s add *blueberry* to the beginning of the array:\n\n **y.unshift(\"\
    blueberry\");**\n\nArray *y* is now:\n\n[\"blueberry\", \"orange\", \"banana\"\
    , \"apple\", \"peach\", \"cherry\", \"avocado\"]\n\nNotice how \"orange\" moved\
    \ to position 1, or second item, to give way to \"blueberry\" as the new position\
    \ zero.\n\n**The meaning of unshift:**\n\nIn order to insert a new brick at the\
    \ bottom of the stack, we need to unshift all the bricks up so that we can squeeze\
    \ a new brick as the first item of the stack since the first item is at the bottom.\n\
    \nOn the other hand, when we do a push to insert a new item to the top of the\
    \ stack, we are actually shifting everything down as we push, even though there\
    \ is nowhere to go at the bottom. (Shift is actually used to remove an item from\
    \ the bottom as we will see later). When we remove the item the bricks get shifted\
    \ down but they are not being pushed because we are not inserting a new item at\
    \ the top of the stack. This is just to help you understand the terms and where\
    \ they came from. Don’t worry about *shift* for now. I will cover it later.\n\n\
    Right now we know about ***push()*** and ***unshift()***.\n\n### Printing array\
    \ items with a for loop"
