    作为一个有趣的现象，请注意 JavaScript 是如何将新项目放在最后一个项目的右侧的。然而，项目被放在哪里并不重要，因为与数组不同，我们不需要此类信息来访问这些项目。


    ## 5- 现在我们将添加一些数字键，只需看看会发生什么


    （这不是常见的实现方式）：


    ```javascript

    crazyList[2] = "front teeth";

    ```


    `crazyList` 现在持有 3 个项目：


    `{"2": "front teeth", "flower": "daisy", "drink": "water"}`


    你看到数字键是如何被放置在所有字符串类型键的左侧了吗？


    再次强调，这对我们没有意义，因为顺序并不真正一致。


    ## 6- 让我们添加另外两个数字键：


    ```javascript

    crazyList["1"] = "flying bird";

    ```


    和


    ```javascript

    crazyList[3] = "is a crowd";

    ```


    现在 `crazyList` 包含：


    `{"1": "flying bird", "2": "front teeth", "3": "is a crowd", "flower": "daisy",
    "drink": "water"}`


    所以我们看到，当键是数字时，项目被放在左侧，并按数字顺序排列。当键是字符串值时，项目被放在最后一个最右侧的项目之后。


    还要注意我是如何将 `["1"]` 包裹在引号中的。这只是为了说明，当涉及到数字键时，它们可以加引号也可以不加。这取决于你。


    *   键值对的顺序定位目前对我们来说没有价值。这仅仅是作为一个有趣的现象被提到的。请不要尝试记忆这种特性，因为这是一个无序列表，我们将根据需要调用它们的标签来选取项目。


    ### 在对象中使用点表示法（dot notation）


    在上一个示例中，我们使用了括号表示法（bracket notation）来调用对应每个对象属性（值）的标签。


    我们也可以使用点表示法来表示对象的属性。


    这实际上是访问对象项目的一种非常流行的方法。事实上，我们需要非常熟悉这两种编写风格，因为尽管点表示法很流行，但有时它无法使用。另一方面，如果你只使用括号表示法，你的代码看起来将与标准不同，别人会问你为什么用这种风格。学习如何用点表示法编写某些表达式，而用括号表示法编写其他表达式是值得的。实践会告诉你应该以及何时使用哪一个。


    **关于这两种编码风格之间的差异，你应该了解这些：**


    1.  点表示法不适用于数字。

    2.  点表示法不适用于动态变量（那些动态变化的变量，例如在循环遍历对象时代表键值对中键的计数器）。

    3.  总结来说，只有当属性名是有效的属性标识符且该标识符不是数字时，才能使用点表示法。


    将点表示法想象成“硬连线”（在使用点表示法时必须已知值），将括号表示法想象成“软连线”（值可以动态变化，或者在代码提交给 JavaScript 解释器时是未）。


    ## 如何使用点表示法访问对象中的项目？


    让我们重复之前的示例，但使用点表示法代替括号表示法：


    1- 创建一个新的空对象：


    ```javascript

    var crazyList = { };

    ```


    2- 让我们通过将值分配给键标签来添加一些值：


    ```javascript

    crazyList.flower = "daisy";

    ```


    现在 `crazyList` 包含 `{flower: "daisy"}`


    注意在点表示法中，键是不带引号编写的。这是因为 `flower` 已经在内存中作为对象 `crazyList` 属性的声明键。但在括号表示法中，我们总是将键的字符串名称放在引号中，如
    "flower"。在点表示法中引号是无效的。


    `crazyList."flower"` 将导致错误


    3- 添加另一个键值对：


    ```javascript

    crazyList.drink = "water";

    ```


    现在 `crazyList` 包含：{flower: "daisy", drink: "water"}`


    4- 使用点语法添加数字键：


    ```javascript

    crazyList.2 = "front teeth";

    ```


    我们得到了如下错误：


    ```

    SyntaxError: Unexpected number

    ```


    点表示法不允许使用数字。它必须这样处理：


    ```javascript

    crazyList[2] = "front teeth";

    ```


    **总结：**


    我们可以通过向变量赋值一对大括号来声明一个空对象：


    ```javascript

    var z = { };

    ```


    然后，我们通过通过点表示法或括号表示法提供键和值来添加项目：


    ```javascript

    z.rent = 750;

    z["gasBill"] = 300;

    ```


    现在我们有了 `{rent: 750, gasBill: 300}`


    **或者**


    我们可以声明一个对象并一次性为其分配项目：


    ```javascript

    var b = {"color": "red", "fabric": "cotton"};

    ```


    现在我们有了 `{color: "red", "fabric": "cotton"}`。


    ### 跨多行声明对象


    到为止，我们的对象都是简短的单行的。但在大多数情况下，对象更为复杂，并跨越多行代码。


    单行对象和多行对象之间没有区别。第二种编写对象的风格更易视觉，但 JavaScript 并不在乎哪一种。


    1- 这是一个多行语法风格的示例。请按照图片编写代码 ![images/0001.jpg](img/0001.jpg)


    还有一个指向[原始文件](http://icontemp.com/car1.txt) | bit.ly/ZbwxY 的链接。


