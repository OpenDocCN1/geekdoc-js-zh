  trans: "\n\n**4- 调用函数 `test2` 并观察这些数字（3,5,15,21）的每个结果：\n\n```\ntest2(3);\ntest2(5);\n\
    test2(15);\ntest2(21);\ntest2(11);\n``` 等。\n\n函数的输入参数充当临时的内部变量。这非常有用，因为我们可以将数据发送到函数中处理。这就是在我们调用\
    \ `test2()` 函数时发生的情况。\n\n一旦我们掌握了函数的基本语法，就可以开始创建一些非常酷的东西了。\n\n函数对你来说可能仍然很困惑。我将在编码过程中涵盖所有的基础知识。这并不是一个困难的课题，但需要按照正确的顺序来学习。\n\
    \n### 什么是函数调用？\n\n一图胜千万言：\n\n![](img/00008.jpeg)\n\n图 8 (查看原始文件：[此处](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/).\
    \ ) bit.ly/1raw6pT\n\n观察图 8，在左下角，我们调用函数 `addTen()`，并将参数为 4 的 `data` 传递给函数参数 `n`。\n\
    \n然后 4 将变成参数 `n` 的临时值，并执行 `10 + 4` 的和。\n\n最后，`return` 机制导出结果，即数值 14。\n\n我们本可以使用\
    \ `console.log(n + 10)`，但 `console.log` 会将值显示在屏幕上，而不会将其导出函数。换句话说，我们无法在函数外部使用数字\
    \ 14，因为 `console.log()` 不导出数据，它实际上是将所有内容作为 `string` 值显示在屏幕上，即使它看起来像一个数字。\n\n所以，`return`\
    \ 是函数中一个非常重要的机制。实际上，它是函数固有的。我们不能在函数外部使用 `return` 命令。JavaScript 不允许这样做。\n\n###\
    \ return 的目的是什么？\n\n`return` 的目的有两个：\n\na) 以原始形式从函数内部导出数据。\n\nb) 停止并结束函数调用。这很重要。返回机制充当中断的作用，并结束调用函数的行为。`return`\
    \ 语句之后函数中的任何内容都不会被处理，因为 JavaScript 在返回时会退出函数。函数返回后，函数调用将从工作内存中擦除。你现在不需要担心这一点，但知道函数调用不会永远留在内存中是有好处的。它们通过退出来释放空间。这可能是将代码包含在函数中的第三个原因：内存效率。\n\
    \n### 当函数返回时数据会发生什么？\n\n如果我们想重用这些数据进行进一步处理，我们需要捕获返回的数据。否则，它就会在空间中丢失。\n\n*我们如何捕获从函数返回的数据？*\n\
    \n捕获它的方法是将返回的值赋值给变量。换句话说，将 `function call` 赋值给变量。\n\n在图 8 的示例中（见图像下方的链接），与其仅仅调用函数：\n\
    \n```\naddTen(4);\n```\n\n我们可以将其赋值给某个变量：\n\n```\nvar y = addTen(4);\n```\n\n现在\
    \ `y` 持有值 14。函数调用被从内存中擦除，但值被变量 `y` 保留了。\n\n- **总结来说**，如果我们需要在脚本后续使用来自函数的数据，则需要将其\
    \ `return` 返回并赋值给变量。当我们通过 `console.log()`、`alert()`、`prompt()` 或 `confirm()` 从函数输出数据时，我们只是在显示它，而不是保留它。\n\
    \n## 2.4 实验工作 6\n\n准备好更多实验工作了吗？\n\n### 创建一个将华氏度转换为摄氏度的程序\n\n[优先级](http://en.wikipedia.org/wiki/Order_of_operations)\
    \ 决定了运算符评估的顺序。JavaScript 的优先级接近数学优先级：\n\n- 括号在乘法或除法之前评估，\n  乘法或除法在减法或加法之前评估。\n\
    \  在相等的情况下，操作数从左到右、从括号内部向外评估。\n  ……不需要记忆，多练习即可。\n\n以下是将华氏度转换为摄氏度的公式：\n\n从变量 `F`\
    \ 中减去 32，\n\n然后将结果乘以 5，\n\n然后将新结果除以 9。\n\n我们需要将减法包含在括号内，以便它先执行。然后写乘法，以便它在最后的除法之前执行（除法应该放在其右侧）。公式看起来如下：\n\
    \n`(f - 32) * 5 / 9`\n\n那是最难的部分。现在我们来写代码。\n\n1- 创建一个名为 `f2c` 的函数，接收一个名为 `f` 的输入参数。\n\
    \n2- 在函数内部将公式的结果发送到屏幕。\n\n换句话说，使用 `console.log()` 打印到屏幕上。这是因为我们只想显示它，而不是重用它。注意输入参数名称\
    \ `f` 如何与提供给公式的变量一致。这样做是有刻意为之，以便 JavaScript 解释器知道在我们调用函数时，将我们要提供的输入数字插入到哪里。\n\n\
    3- 调用函数并传入 212 度华氏度作为参数（直接写数字本身）。你的显示答案应该是 100。\n\n查看我自己的解决方案（**第一个脚本**）：[f2c](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/)\
    \ 。\n\n### 创建一个将摄氏度转换为华氏度的程序\n\n将摄氏度转换为华氏度的公式是\n\n将 `c` 乘以 9，\n\n然后将结果除以 5，\n\n\
    然后对结果加上 32。\n\n不需要插入括号，只需确保乘法在前：\n\n`c * 9 / 5 + 32`\n\n1- 创建一个名为 `c2f` 的函数，接收一个名为\
    \ `c` 的参数。\n\n2- 在函数内部将公式的结果发送到屏幕。\n\n换句话说，使用 `console.log()` 打印到屏幕上。\n\n3- 调用函数并传入\
    \ 100 度摄氏度作为参数（只写数字）。你的答案应该是 212。\n\n查看我自己的解决方案（**第二个脚本**）：[c2f](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/)\
    \ \n\n### 为什么我们使用 console.log() 而不是 return？\n\n正如你可能记得的，`console.log()` 是为了快速测试设计的。目前我们不关心返回值。当我们需要重用值时，我们将使用\
    \ `return` 并将其赋值给变量。\n\n然而，请阅读下一个主题获取关于返回机制的信息。\n\n### 在 JavaScript 中，函数总是返回某些东西\n\
    \n如果你在在我们没有显式使用 `return` 时，`function call` 是否会从内存中清除，答案是*是的*，它会。\n\n在 JavaScript\
    \ 中，每个函数都会在代码解释器到达闭括号时（如果不是在此之前）自动返回。\n\n当这种情况发生时，如果没有手动编写返回语句，JavaScript 将返回\
    \ `undefined` 的值。\n\n在生产环境中你不会直观地看到这种自动返回，但在测试控制台上，如果你没有请求返回，最后你会看到 *undefined*。\n\
    \n这种自动返回确保了正确的内存管理。内存管理实际上由浏览器完成，而不是由 JavaScript。\n\n### 一个转换华氏度的程序……\n\n在这个项目中，我们将引入一个带有两个输入参数的函数。第一个输入参数将接收一个数值，第二个输入参数将作为在摄氏度与华氏度之间切换的条件。\n\
    \n*我们如何在摄氏度和华氏度之间切换？*\n\n我们可以使用 `if(), else if(), else` 语句：\n\n- 如果用户输入 `f` 代表华氏度，`if()`\
    \ 输出将华氏度转换为摄氏度。\n- 否则，如果用户输入 `c`，数字将从摄氏度转换为华氏度。\n\n"
