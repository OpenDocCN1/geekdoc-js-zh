    Great! Now let’s just look at two useful methods to work with JSON data structures.


    ## JSON library methods


    JavaScript has two functions to parse regular JavaScript into a JSON format, or
    vice versa. Once data is converted into a JSON format we can send the data across
    the globe into other machines.


    Let’s see how they basically work.


    ## JSON.stringify


    The function `stringify` compresses the object by stripping its white space and
    converting it into a string so it can be exported.


    Taking for example our previous object `employees` (as seen on image 20), we can
    strigify it like this:


    ```javascript

    var myString = JSON.stringify(employees);

    ```


    I have assigned the result to variable `myString` (any name will do) which is
    now a string variable and contains the following data:


    "{"staff":[{"firstName":"Tony","lastName":"deAraujo","age":99},{"firstName":"John","lastName":"Smith","age":33},{"firstName":"Mary","lastName":"Adams","age":29}],"management":[{"firstName":"Judy","lastName":"Garland","age":43}]}"


    Now this string of data is ready to be sent via `http` or any other method to
    a different location or machine. Any programming language with a way to decode
    JSON (convert to or read to JSON) will be able to use this data.


    **NOTE(1):** If you want to validate this data with JSONLINT.com you need to exclude
    the variable name and the outer quotes.


    **NOTE(2):** When using `stringify`, functions (methods) inside of the original
    object will not be included. This is intentionally done. The only data that gets
    stringified are the string key/value pairs which are wrapped in quotes (as well
    as numbers).


    **NOTE(3):** There is a way to prevent JSON from compressing the data. That implementation
    will be discussed when we cover the third argument for `stringify`, a few pages
    from now.


    ## Using a second argument as a filter on stringify


    NOTE: If this is too much information for now, just read it, understand it, be
    aware of it and return when you want to revisit the subject.


    The method `stringify` can take a second argument to **filter** out everything
    except what we want to include during `stringify`. This second argument can be
    an array, or it can be a function, depending on what we are trying to accomplish.


    ### (a) When using an array as a filter


    When we use and array as second argument, we pick and choose the data we want
    to strigify.


    As always, the first argument is the object name being used. When the second argument
    is an array, JavaScript only strigifies the key/values provided in that array.
    The array acts as an inclusive filter.


    For example, I want to stringify just the array `staff` and only just the first
    name of each employee:


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "firstName"]);

    ```


    JavaScript captures `staff` and grabs its `firstName` property. The result of
    this serialization is as follows:


    "\"{"staff":[{"firstName":"Tony"},{"firstName":"John"},{"firstName":"Mary"}]}\"


    Here’s another example where `age` is also included (but not lastName):


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "firstName", "age"]);

    ```


    What if we want the first name of both `staff` and `management`?


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "management", "firstName"]);

    ```


    It results in:


    "\"{"staff":[{"firstName":"Tony"},{"firstName":"John"},{"firstName":"Mary"}],"management":[{"firstName":"Judy"}]}\}\"


    NOTE: If you try validating this result with [jsonlint](http://jsonlint.com/)
    in its raw format, it will fail. The reason is that we need to strip the outer
    quotation marks (the ones making this whole script a string). Once you remove
    the outer quotes you will get a green light from jsonlint. There is a method to
    convert this string back into an object. This method will be discussed on the
    next chapter.


    **Try this one on your own:**


    If you want some practice, try stringifying both `staff` and `management` but
    only the last name and age of each employee. Use a variable name of your choice.


    ### (b) When using a function as a filter


    So far we have used an array as a second argument for `stringify`. That allowed
    us to pick and choose which elements we wanted to include in the stringification.


    With a function as a second parameter we can do the opposite, **exclude elements**,
    or modify how certain elements will be represented.


    The function takes two arguments in its input parameters. The first argument is
    the `key` and the second argument is the `value`. These two parameters will represent
    every key and every value of the JSON object. In other words, because we are grabbing
    each key and each value for evaluation before processing, we can write a script
    in the body that addresses specific keys and specific values, as the function
    scans each key and each value (see the image below).


    When it comes to parameter names, it doesn’t matter what you call them, what matters
    is their position which needs to be (key, value). You can call them `(k,v)` or
    `(x,y)`, or anything else.


    As an example, the following image uses the function `filter` to exclude the `age`
    from the stringification:


    ![](images/00023.jpeg)


    Fig 22 see [raw file](http://icontemp.com/jpl/json4b.txt) | bit.ly/1v71zuT.


    What happens here is that an `undefined` value will not be included as a JSON
    file because in JSON, undefined represents and an empty key/value pair, so `age`
    will be included. (Wait, the text says "will not be included", but the logic implies
    exclusion).


    First, notice how we made JavaScript read the third argument without having a
    second argument:


    *   We made the second argument `null`. That works because now we can have a third
    argument.


    Second, the number `4` is the number of indented spaces. There is no provision
    for adding lines but JavaScript automatically adds lines when we ask for indentation.
    The maximum number is 10.


    Did you notice the second sample on the raw file? It shows *dots* instead of *spaces*.


    That was done by substituting the third argument from a number to a string:


    ```javascript

    var myString = JSON.stringify(employees, null, "...");

    ```


    This last one will not validate if you test it on *jsonlint*, but it serves to
    illustrate the third argument in `stringify`.


    ## JSON.parse


    To convert the string back into an object just like we had it before, we use the
    method `JSON.parse`.


    See raw file: [myString](http://icontemp.com/jpl/json6.txt) | bit.ly/1rtZclU.


    ```javascript

    var myEmployees = JSON.parse(myString);

    ```


    Variable `myEmployees` is now an object with the same values as our original `employees`
    object.


    Note: You will get an error if the data being parsed is not a valid JSON.

    '
