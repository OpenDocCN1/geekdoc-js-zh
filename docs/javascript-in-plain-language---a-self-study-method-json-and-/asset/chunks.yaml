  trans: "\n\n正如你可能已经注意到的，当我们通过名称调用数组时，它在屏幕上的视觉显示是其原始的视觉格式：\n\n`[\"blueberry\", \"\
    orange\", \"banana\", \"apple\", \"peach\", \"cherry\", \"avocado\"]`\n\n### 我们如何单独显示项？\n\
    \n我们可以使用数组的 `length` 属性和 `for loop` 来来实现这一操作。\n\n`length` 属性的工作方式与字符串一样。我们可以通过在数组变量名后附加\
    \ `.length` 来找到数组的长度：\n\n`y.length;` <-- 它显示数字 `7`\n\n现在，正如你之前在处理字符串 \"orange\"\
    \ 时（实验工作 7）所记得的，当我们知道要扫描的项的长度时，我们按照以下方式初始化一个 `for loop`：\n\n```javascript\nfor(var\
    \ i = 0; i < 7; i++) { do this stuff; }\n```\n\n然而，在大多数情况下，我们不知道想要扫描的项的长度，这时 `.length`\
    \ 就派上用场了：\n\n```javascript\nfor (var i = 0; i < y.length; i++ ){ do this stuff;\
    \ }\n```\n\n最后这种实现方式效率得多，因为当我们删除或添加新项导致数组长度发生变化时，我们就不需要担心重新循环。\n\n操作数组所需的其余代码将放在“do\
    \ this stuff”代码块所在的位置。在在那里，我们可以打印、搜索或创建许多其他可能的实现。此外，正如你所知道的，代码块通常写在单独的行。\n\n这里有一个将所有项打印到屏幕的示例循环：\n\
    \n![](img/00011.jpeg)\n\n图 11\n\n在第 `2` 行，`console.log()` 正在处理数组的每个位置。我们通过将 `i`\
    \ 赋值为位置的数字来实现这一点。通过这样，随着循环计数 `i` 数字，它会改变 `y[i]` 的位置，每个项都会随之显示（并分行显示）。让我们来尝试一下。\n\
    \n## 2.10 实验工作 8\n\n让我们通过一些编程练习来巩固我们对数组创建、添加项以及使用 `for` 循环遍历数组的理解。\n\n请打开你的 JavaScript\
    \ 控制台，让我们大显身手吧！！\n\n*   尝试按照接下来的 7 个步骤自己完成这些练习，或者直接跳转到后面的引导练习，以便在我解释概念的同时进行。\n\
    \n注意：这七个步骤并不是一个项目。每一步都是一个独立的练习，用于观察每个实现是如何完成的。\n\n### 前期项目\n\n1- 创建一个空数组并赋值给变量\
    \ `misc`（miscellaneous 的缩写）。\n\n2- 创建另一个数组赋值给变量 `greekLetters`，并包含以下项：\"alpha\"\
    , \"beta\", \"gamma\", \"delta\"\n\n3- 将数字 `99` 赋值给数组 `misc` 的第一个位置，将单词 `\"bottles\"\
    ` 赋值给 `misc` 的第二个位置，并将单词 `\"beers\"` 赋值给 `misc` 的第九个位置。\n\n4- 打印数组 `greekLetters`\
    \ 的长度。\n\n5- 打印数组 `misc` 的长度。\n\n### 使用 push 和 unshift\n\n6- 在 `greekLetters`\
    \ 数组末尾添加新项 `\"epsilon\"`。\n\n7- 在 `misc` 数组开头添加新项 `\"folk song\"`。\n\n(*参见下一页的我的答案*)\n\
    \n### （引导练习）前期项目\n\n1- 创建一个空数组并赋值给变量 `misc`（miscellaneous 的缩写）\n`var misc = [\
    \ ];`\n\n2- 创建另一个数组赋值给变量 `greekLetters`，并包含以下项：\"alpha\", \"beta\", \"gamma\"\
    , \"delta\"\n`var greekLetters = [\"alpha\", \"beta\", \"gamma\", \"delta\"];`\n\
    \n3- 将数字 `99` 赋值给数组 `misc` 的第一个位置，将单词 `\"bottles\"` 赋值给 `misc` 的第二个位置，并将单词 `\"\
    beers\"` 赋值给 `misc` 的第九个位置。\n```javascript\nmisc[0] = 99;  (数字不需要加引号)\nmisc[1]\
    \ = \"bottles\";\nmisc[8] = \"beers\";\n```\n\n4- 打印数组 `greekLetters` 的长度。\n`console.log(greekLetters.length);`\
    \ <-- 结果为 4\n\n5- 打印数组 `misc` 的长度。\n`console.log(misc.length);` <-- 结果为 9\n\n\
    你注意到我们是如何为数组 `misc` 添加第 9 个位置的吗？\n\n你是否注意到数组 `misc` 现在有 9 个项，这意味着有 6 个项被留为了 `undefined`\
    \ 占位符？\n\n### 使用 push 和 unshift\n\n6- 在 `greekLetters` 数组末尾添加新项 `\"epsilon\"`。\n\
    `greekLetters.push(\"epsilon\");`\n\n7- 在 `misc` 数组开头添加新项 `\"folk song\"`。\n`misc.unshift(\"\
    folk song\");`\n\n练习是精通它的唯一途径。\n\n让我们通过在 `arrays` 上练习 `for` 循环，将功能封装在 `functions`\
    \ 中，并加入一些 `if else` 条件判断。这些项目将涵盖：\n\n### 创建一个向数组添加项的方法\n\n*准备好接受挑战了吗？*\n\n我们将创建一个自动向数组添加项的函数。尝试按照接下来的\
    \ 5 个步骤自己完成这些练习，或者跳转到引导练习以便在我解释概念的同时进行：\n\n1- 声明一个变量 `x` 的空数组。\n\n2- 创建一个名为 `addMe`\
    \ 的函数，它可以自动向数组添加项。\n\na) 使用一个输入参数 `item`。\n\nb) 在函数体内，将输入 `item` 赋值给数组的第一个位置，基于\
    \ `x.length`。\n\nc) 同样在函数内部，创建一个 `console.log` 来打印整个数组。\n\n3- 将你的脚本粘贴到控制台，并通过传入\
    \ `\"grape\"` 作为输入项来调用函数。\n\n4- 然后调用函数并传入 `\"apple\"` 作为输入项。\n\n5- 对 `\"banana\"\
    ` 执行相同的操作。\n\n### （引导练习）向数组添加项的方法\n\n1- 声明一个变量 `x` 的空数组。\n`var x = [];`\n\n2-\
    \ 创建一个名为 `addMe` 的函数，它可以自动向数组添加项。\nd) 使用一个输入参数 `item`。\n\ne) 在函数体内，将输入 `item`\
    \ 赋值给数组的位置，基于 `x.length`。\nf) 同样在函数内部，创建一个 `console.log` 来打印整个数组。\n\n```javascript\n\
    function addMe(item) {\n    x[x.length] = item;\n    console.log(x);\n}\n```\n\
    \n第 1 行声明了数组 `x`。\n\n第 3 行声明了一个带有 `item` 作为输入参数的函数 `addMe`。\n\n第 4 行，当我们调用函数时**传入**的数据被赋值给数组\
    \ `x` 的最大长度。\n\n第 5 行，我们在屏幕上以其新的原始格式打印数组 `x`。\n\n```javascript\naddMe(\"grape\"\
    );\naddMe(\"apple\");\naddMe(\"banana\");\n```\n\n最终结果是：`[\"grape\", \"apple\"\
    , \"banana\"]`。\n\n"
- fmt: "\n# Create a generic method to print out the contents of an array\n\nGeneric\
    \ is synonymous with portable. In programming scripts should be made as portable\
    \ as possible. It leads to reusability and memory efficiency. By creating a portable\
    \ array method we can use it with any array, not just the one we are programming\
    \ at the moment.\n\n1- Create a method (a method is a function mechanism) named\
    \ `printArray` that takes an input parameter arbitrarily named `inputArray`\n\n\
    2- Then inside of the function create a `for loop` that initializes `i` to zero\
    \ and runs as long as `i` is less than the length of the array given to `inputArray`.\n\
    \n3- In the body of the loop, `console.log(inputArray[i])`, this will correspond\
    \ to each item location of the given array, one at a time. \n\n4- Close the loop,\
    \ close the function. You’re done.\n\n**Testing...**\n\n5- If you still have array\
    \ `y` on the console, print array `y`. If not, add array `y` as shown below:\n\
    \n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\n```\n\n6- Print\
    \ array `y` by calling the function `printArray()` and pass `y` as an argument.\n\
    \n7- Create several other arrays and use the generic `printArray()` method to\
    \ print them.\n\n(See my answer and a link to file on the next page).\n\n**(Guided\
    \ exercise**)\n\n**Create a generic method to print out the contents of an array**\n\
    \n1- Create a method (a method is a function mechanism) named `printArray` that\
    \ takes an input parameter arbitrarily named `inputArray`.\n\n```javascript\n\
    function printArray(inputArray) {\n```\n\n2- Then, inside of the function create\
    \ a `for loop` that initializes `i` to zero; and runs as long as `i` is less than\
    \ the length of the array given to `inputArray`.\n\n```javascript\nfor(var i =\
    \ 0; i< inputArray.length; i++){\n```\n\n3- In the body of the loop, `console.log(inputArray[i])`,\
    \ this will correspond to each item of the given array, one at a time.\n\n```javascript\n\
    console.log(inputArray[i]);\n```\n\n4- Close the loop, close the function. You’re\
    \ done.\n\n```javascript\n  } }\n```\n\n5- If you still have array `y` on the\
    \ console, print array `y`. If not, add array `y` as shown below and print it:\n\
    \n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\n```\n\n6- Print\
    \ array `y` by calling the function `printArray()` and pass `y` as an argument.\n\
    \n```javascript\nprintArray(y);\n```\n\n7- Create several other arrays and use\
    \ the generic `printArray()` method to print them.\n\nSee my file: [forum](http://jsplain.com/javascript/index.php/Thread/15-Lab-8/).\
    \ (bit.ly/1rdSRuA).\n\n**Discussion**\n\nGeneric methods are very useful. It is\
    \ always a good idea to save them for future use. However, since you are practicing,\
    \ saving code for a future copy/paste might not be as beneficial to you yet. Code\
    \ snippets act like recipes for cooking. There are many cookbooks for programmers\
    \ out there and although they may not help you at this moment, they may come handy\
    \ in the future. (Personally I don’t own any of those books since I enjoy creating\
    \ my own stuff but in a professional environment they can be useful, especially\
    \ when it comes to more advanced, time consuming implementations).\n\nThe `inputArray`\
    \ parameter serves as a placeholder for whatever `array name` you pass in when\
    \ you call the function `printArray`. Instead of printing the array to screen\
    \ with a `console.log()` we could have done something else with the array, like\
    \ for example sorting it. We will get there when I introduce more properties and\
    \ array methods from the internal JavaScript library.\n\nRemember, this book is\
    \ about learning how to use JavaScript, it is not a dictionary of methods. You\
    \ can always refer to my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ)\
    \ for that purpose, but only after you finish this one.\n\n## Extra bonus: Create\
    \ a generic method to add items into an array\n\nTo do this exercise, go back\
    \ to the first exercise of this lab work (on Fig 12), and recreate it in a way\
    \ that we could add items to any array, not just the array `x` as the original\
    \ example shows.\n\n1- You need to add two input parameters to the function I’m\
    \ calling `addMe2`:\n\na) One input for the array name (I will call it `inputArray`),\n\
    \nb) and one input for the item you want to add to the array (I will call it `inputItem`).\n\
    \n2- Then in the function body, create a script that assigns the location `inputArray.length`\
    \ to the new item (`inputItem`):\n\n```javascript\ninputArray[inputArray.length]\
    \ = inputItem;\n```\n\n**Note:** Since the script gets a bit more complicated\
    \ than the original one, I am using names that make sense to humans in order to\
    \ help them understand what the script does. Even if we code for our own use (as\
    \ opposed to other people), we will not remember what it is when we return tomorrow.\n\
    \n3- If you wish, add a `console.log(inputArray)` to the function body in order\
    \ to monitor the output.\n\n4- Finally, create some empty arrays outside of the\
    \ function, and then add items to each one of them by calling the function.\n\n\
    Whenever you’re ready, please refer to my own script: [forum board](http://jsplain.com/javascript/index.php/Thread/48-Lab-8b/).\
    \ | bit.ly/1pnR5S8\n\nEND OF LAB\n\n## 2.11 Other useful arrays methods\n\n###\
    \ sort()\n\nIn order to sort the contents of an array we can use the JavaScript\
    \ library method `sort()`:\n\nUsing the following array,\n\n```javascript\nvar\
    \ y = [\"grape\", \"apple\", \"banana\"];\n```\n\nWe can sort it like this:\n\n\
    ```javascript\ny.sort();\n```\n\nOr, for displaying purposes:\n\n```javascript\n\
    console.log(y.sort());\n```\n\n*   Please keep in mind that sorting is permanent,\
    \ it affects the original array.\n\nWhen it comes to strings, a `string type`\
    \ value does not have a method to sort because sorting needs to use individual\
    \ elements and a string is just one element all together. If you ever want to\
    \ sort a string you will have to convert it to an array, then sort it, and then\
    \ reconvert to string again. \n\nWe will actual do this exercise in a bit.\n\n\
    ### join()\n\nThe method `join` outputs an array value as a string format:\n\n\
    Examples:\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\n```\n\
    \n```javascript\ny.join();\n```\n\nIt outputs: \"grape,apple,banana\"\n\nWe can\
    \ also use a parameter to determine what separates each word. Here are a few examples\
    \ of separation methods:\n\n*   Adding a pair of quotes as the parameter without\
    \ a space:\n\n```javascript\ny.join(\"\");\n```\nIt outputs: \"grapebanana\"\n\
    \n*   Adding a space in quotes:\n\n```javascript\ny.join(\" \");\n```\nIt outputs:\
    \ \"grape apple banana\"\n\n*   Adding a comma and a space:\n\n```javascript\n\
    y.join(\", \");\n```\nIt outputs: \"grape, apple, banana\"\n\n*   Adding a dash\
    \ in quotes:\n\n```javascript\ny.join(\"/\");\n```\nIt outputs: \"grape/apple/banana\"\
    \n\n*   Adding a space, dash, space:\n\n```javascript\ny.join(\" / \");\n```\n\
    It outputs: \"grape / apple / banana\"\n\nNotice that I have been writing \"it\
    \ outputs\". In order to convert an array value into a string we must catch the\
    \ output by assigning it to a variable. If we assign it to the original variable\
    \ we convert the array into a string. When we assign it to a different variable,\
    \ we copy the values into a string format. The original array remains intact.\n\
    \n**What about sorting before converting to string?**\n\n```javascript\ny.sort().join(\"\
    \ \");\n```\nIt converts to a sorted array, and then it outputs a string: \"apple\
    \ banana grape\"\n\nNotice the dot syntax at work for multiple attached methods.\n\
    \n*   **Important:** Although `join()` does not affect the original array unless\
    \ we assign the output to the original variable, `sort()` works differently. When\
    \ we sort an array, it physically rearranges the locations of each item. Sorting\
    \ is permanent and it does not have to be explicitly assigned.\n\n**Example:**\n\
    \n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\ny[0]; // It displays\
    \ \"grape\"\n```\n\nNow we sort it (without an explicit assignment):\n\n```javascript\n\
    y.sort();\ny[0]; // It displays \"apple\"\n```\n\n**Sorting is permanent**.\n\n\
    ### indexOf()\n\n*   The `indexOf()` method returns the location position of an\
    \ item.\n*   If the item does not exist, it returns a -1.\n\nThis is a very useful\
    \ method to check if a certain item already exists in an array before we add it,\
    \ or to search for a specific item as we will see on the next lab work.\n"
  raw: '### Create a generic method to print out the contents of an array


    Generic is synonymous with portable. In programming scripts should be made as
    portable as possible. It leads to reusability and memory efficiency. By creating
    a portable array method we can use it with any array, not just the one we are
    programming at the moment.


    1- Create a method (a method is a function mechanism) named *printArray* that
    takes an input parameter arbitrarily named *inputArray*


    2- Then inside of the function create a ***for loop*** that initializes *i* to
    zero and runs as long as *i* is less than the length of the array given to inputArray.


    3- In the body of the loop, console.log the  inputArray[i], this will correspond
    to each item location of the given array, one at a time.  


    4- Close the loop, close the function. You’re done.


    **Testing...**


    5- If you still have array *y* on the console, print array *y*. If not, add array
    *y* as shown below:


    var y = ["grape", "apple", "banana"];


    6- Print array y by calling the function ***printArray()*** and pass ***y*** as
    an argument.


    7- Create several other arrays and use the generic printArray() method to print
    them.


    (*See my answer and a link to file on the next page*).


    **(**Guided exercise**)


    Create a generic method to print out the contents of an array**


    1- Create a method (a method is a function mechanism) named ***printArray*** that
    takes an *input parameter* arbitrarily named ***inputArray*.**


    **function printArray(inputArray) {**


    2- Then, inside of the function create a *for loop* that initializes *i* to zero;
    and runs as long as *i* is less than the length of the array given to inputArray.


    **for(var i = 0; i< inputArray.length; i++){**


    3- In the body of the loop, console.log ***inputArray[i]***, this will correspond
    to each item of the given array, one at a time.


    **console.log(inputArray[i]);**


    4- Close the loop, close the function. You’re done.


       **} }**


    5- If you still have array ***y*** on the console, print array *y*. If not, add
    array *y* as shown below and print it:


    **var y = ["grape", "apple", "banana"];**


    6- Print array y by calling the function ***printArray()*** and pass ***y*** as
    an argument.


    printArray(y);


    7- Create several other arrays and use the generic **printArray()** method to
    print them.


    See my file: [forum](http://jsplain.com/javascript/index.php/Thread/15-Lab-8/).
    (bit.ly/1rdSRuA).


    **Discussion**


    Generic methods are very useful. It is always a good idea to save them for future
    use. However, since you are practicing, saving code for a future copy/paste might
    not be as beneficial to you yet. Code snippets act like recipes for cooking. There
    are many cookbooks for programmers out there and although they may not help you
    at this moment, they may come handy in the future. (Personally I don’t own any
    of those books since I enjoy creating my own stuff but in a professional environment
    they can be useful, especially when it comes to more advanced, time consuming
    implementations).


    The inputArray parameter serves as a placeholder for whatever *array name* you
    pass in when you call the function printArray. Instead of printing the array to
    screen with a console.log() we could have done something else with the array,
    like for example sorting it. We will get there when I introduce more properties
    and array methods from the internal JavaScript library.


    Remember, this book is about learning how to use JavaScript, it is not a dictionary
    of methods. You can always refer to my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ)
    for that purpose, but only after you finish this one.


    ### Extra bonus: Create a generic method to add items into an array


    To do this exercise, go back to the first exercise of this lab work (on Fig 12),
    and recreate it in a way that we could add items to any array, not just the array
    **x** as the original example shows.


    1- You need to add two input parameters to the function I’m calling ***addMe2***:


    a) One input for the array name


    ( I will call it ***inputArray***),


    b) and one input for the item you want to add to the array


    ( I will call it ***inputItem***).


    2- Then *in* the function body, create a script that assigns the location ***inputArray.length***
    to the new item (***inputItem***):


    inputArray[inputArray.length] = inputItem;


    **Note:** Since the script gets a bit more complicated than the original one,
    I am using names that make sense to humans in order to help them understand what
    the script does. Even if we code for our own use (as opposed to other people),
    we will not remember what it is when we return tomorrow.


    3- If you wish, add a *console.log(inputArray);* to the function body in order
    to monitor the output.


    4- Finally, create some empty arrays outside of the function, and then add items
    to each one of them by calling the function.


    Whenever you’re ready, please refer to my own script:


     [forum board](http://jsplain.com/javascript/index.php/Thread/48-Lab-8b/). | bit.ly/1pnR5S8


    END OF LAB


    ## 2.11 Other useful arrays methods


    ### sort( )


    In order to sort the contents of an array we can use the JavaScript library method
    *sort()*:


    Using the following array,


    **var y = ["grape", "apple", "banana"];**


    We can sort it like this:


    **y.sort();**


    Or, for displaying purposes:


    console.log(y.sort());


    *   Please keep in mind that sorting is permanent, it affects the original array.


    When it comes to strings, a *string type* value does not have a method to sort
    because sorting needs to use individual elements and a string is just one element
    all together. If you ever want to sort a string you will have to convert it to
    an array, then sort it, and then reconvert to string again. 


    We will actual do this exercise in a bit.


    ### join( )


    The method *join* outputs an array value as a string format:


    Examples:


    **var y = ["grape", "apple", "banana"];**


    **y.join();**


    It outputs: "grape,apple,banana"


    We can also use a parameter to determine what separates each word.


    Here are a few examples of separation methods:


    *   Adding a pair of quotes as the parameter but without a space between quotes:


    **y.join("");**


    It outputs: "grapeapplebanana"


    *   Adding a space in between quotes:


    **y.join(" ");**


    It outputs: "grape apple banana"


    *   Adding a comma and a space:


    **y.join(", ");**


    It outputs:  "grape, apple, banana"


    *   Adding a dash in between the quotes:


    **y.join("/");**


    It outputs: "grape/apple/banana"


    *   Adding a space, dash, space:


    **y.join(" / ");**


    It outputs: "grape / apple / banana"


    Notice that I have been writing “*it outputs*”. In order to convert an array value
    into a string value we must catch the output by assigning it to a variable. If
    we assign it to the original variable we convert the array into a string. When
    we assign it to a different variable, we *copy* the values into a string format.
    The original array remains intact.


    **What about sorting before converting to string?**


     **y.sort().join(" ");**


    It converts to a sorted array, and then it outputs a string:


    "apple banana grape"


    Notice the **dot syntax** at work for multiple attached methods.


    *   **Important:** Although *join()* does not affect the original array unless
    we assign the output to the original variable name, *sort()* works differently.
    When we sort an array, it physically rearranges the locations of each item. Sorting
    is permanent and it does not have to be explicitly assigned.


    **Example:**


    **var y = ["grape", "apple", "banana"];**


    **y[0];** <-- It displays "*grape*"


    Now we sort it (without an explicit assignment):


    **y.sort();**


    **y[0];** <-- It displays "*apple*"


    **Sorting is permanent**.


    ### indexOf( )


    *   The indexOf() method returns the location position of an item.


    *   If the item does not exist, it returns a -1.


    This is a very useful method to check if a certain item already exists in an array
    before we add it, or to search for a specific item as we will see on the next
    lab work.'
