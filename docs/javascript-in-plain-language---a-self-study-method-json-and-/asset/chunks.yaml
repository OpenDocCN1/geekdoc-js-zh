  trans: "\n几乎所有现代浏览器都内置了 `Console`（控制台），用于帮助我们调试或实验 JavaScript。一旦打开，所有的 `Console`\
    \ 提供的选项基本上是相同的。最大的区别在于我们访问 `Console` 的方式以及 `Console` 在屏幕上的显示外观。\n\n请选择以下浏览器之一。如果你的电脑上没有安装，请下载它。使用这些浏览器之一是为了确保当我们使用自带的\
    \ JavaScript 控制台一起编码时，我的指令可以与你的操作保持一致。如果你愿意，也可以随时使用任何其他 `Console`，但其访问方式可能会有所不同。\n\
    \n[Google Chrome](https://www.google.com/chrome/browser/).\n\n[Opera](http://www.opera.com/).\n\
    \n打开上述两个浏览器之一，然后按下以下键组合打开 `Console`：\n\n1- 如果你使用的是 Windows 或 Linux：\n\n`CTRL SHIFT\
    \ j`\n\n如果使用的是 MAC：\n\n`CMD SHIFT j` 或 `ALT-CMD-j`\n\n屏幕底部可能会弹出一个窗口。\n\n2- 确保选中了\
    \ `Console` 标签页。\n\n如果你收到任何 `error`（错误）消息，只需在白色区域`右键点击`并选择 `Clear Console`（清除控制台）即可清除屏幕。这些错误几乎每次打开控制台时都会出现，因为\
    \ `Console` 正在检查当前打开的文档（你在访问 `Console` 之前在屏幕上看到的页面），内容可能不符合 `Console` 的预期，因此产生了错误警告。只需清除消息即可获得更多窗口空间。\n\
    \n3- 如果你想（推荐），可以将 `Console` 从浏览器中分离并最小化浏览器，这样它就不会影响你的操作。第一次分离 `Console` 后，它将一直保持分离，除非你通过切换同一个按钮将其重新合并。\n\
    \n要分离 `Console`，请在 `Console` 标签菜单上寻找双正方形图标并点击它。现在你应该有两个不同的窗口。最小化浏览器为你的 `Console`\
    \ 屏幕留出更多空间。\n\n### 声明变量\n\n让我们开始编码...\n\n1- 声明变量 `x`、`y` 和 `z`\n\n（仅进行声明，目前不赋值）\n\
    \n并在每个分号后按 ENTER 键以激活表达式：\n\n它看起来应该是这样的：\n\n```\nvar x;\nvar y;\nvar z;\n```\n\
    \n你也可以只用一个 `var` 并用 `comma`（逗号）分隔变量名。如果你同时要声明多个没有赋值的变量，这可以节省一些时间。别忘记在最后加上 `semicolon`（分号）：\n\
    \n```\nvar x, y, z;\n```\n\n2- 现在，声明另一个变量的同时赋值。\n\n我正在使用值为 `347` 的变量 `a`：\n\n\
    ```\nvar a = 347;\n```\n\n3- 声明一个包含你名字的变量 `b`（记住，你的名字是一个字符字符串 `string`）：\n\n```\n\
    var b = \"Tony\";\n```\n\n*   **NOTE：** 你可以通过输入变量名、加分号并按 ENTER 来在 `Console` 上读取每个变量的值。例如：\n\
    \n    `b;` 它应该显示 \"Tony\";\n\n之所以可以通过输入变量来显示值是因为我们正在使用测试 `Console`。在现实生活中，正如我们之后看到的，我们需要使用打印命令。\n\
    \n### 检查变量的数据类型\n\n太棒了！到为止我们声明了以下变量：\n\n`x, y, z, a, b`。\n\n变量 `b` 是什么类型的变量？我的意思是，它包含什么类型的数据？我们知道\
    \ `b` 存储了你的名字，对吧？\n\n4- 使用 `typeof` 命令检查变量：\n\n```\ntypeof b;\n```\n\n它显示 \"string\"\
    。变量 `b` 包含带有`quotes`（引号）的姓名，因此它是一个字符字符串。\n\n5- 变量 `a` 呢？\n\n```\ntypeof a;\n```\n\
    \n它显示 \"number\"。变量 `a` 包含数字 `347`，因此它包含类型为 `number`（数字）的数据。\n\n*   **NOTE：**\
    \ 你注意到 `Console` 如何尝试补全 `typeof` 这个单词的了吗？如果你不想自己写整个单词，只需在显示器出现提示时按 TAB 键即可。如果你像我一样，更喜欢练习输入，只需注意不要拼写错误。自动补全对于加速编程和避免输入错误变得非常有用，特别是当...\n"
- fmt: "\nSince \"Tony\" is of type `string`, there are things I can do with this\
    \ type of data, or things I can find out about `string` data, such as its length\
    \ in characters:\n\n```\nmyName.length;\n```\n\nThe Console will display 4 and\
    \ it means that the value of variable `myName` which is \"Tony\", is 4 characters\
    \ long.\n\n`length` is one of the properties inherited from the `type string`.\
    \ Other types of data also use this property because it comes very handy in decision\
    \ making as you will see over and over again.\n\nDid you notice the `dot` between\
    \ `myName` and `length`?\n\n### The DOT operator\n\nThe dot in `myName.length`\
    \ glues variable `myName` to its property `length`.\n\nThe Dot operator connects\
    \ the variable to its property, or the parent to the child. We place the root\
    \ first, or the owner of the property. Then map its members or children by using\
    \ dots:\n\n```\nparent.child.grandchild;\n```\n\nor in a more explicit example:\n\
    \n```\nwindow.myName.length;\n```\n\n`window` is actually the parent of variable\
    \ `myName`. We will come back to it in a while.\n\nIt’s almost like saying “What\
    \ is the person’s name?”, Do you see the ‘’s’? That ties the name to the person.\
    \ The dot notation works under the same principle.\n\nIn this case it is pretty\
    \ simple: we start at the variable name and go down one level to its property\
    \ `length`. Other times the targeting address may become more complex, perhaps\
    \ another term or two down the pipe. We will have a chance to work with the dot\
    \ operator throughout the book.\n\nWhen working with the `dot operator` we are\
    \ using what is called **Dot Notation**, but there is another alternative syntax\
    \ which is called **Bracket Notation**.\n\nPlease refer to the next page for a\
    \ brief introductory explanation of bracket notation.\n\n### The Bracket notation\n\
    \nI don’t mean to confuse you by mentioning two different notations at the same\
    \ time. We will be using bracket notation extensively later. Consider this as\
    \ a primer about it.\n\nInstead of instead: `myName.length;`\n\nType in your console\
    \ the following:\n\n```\nmyName[\"length\"];\n```\n\nIt displays the number 4,\
    \ just like it did with Dot Notation. Notice how `length` is wrapped in quotes\
    \ inside of that bracket. We are passing \"length\" as a string, or as a label,\
    \ and JavaScript will reconvert it back to its rightful rank of a property from\
    \ its library. There are advantages of using Bracket Notation because it is more\
    \ versatile, but don’t break your head over it just yet. We will use both Dot\
    \ Notation and Bracket Notation. Bracket Notation is mostly used in dynamic situations.\
    \ You will see later that Dot Notation is “hard wired” and Bracket Notation is\
    \ “soft wired” (when we don’t know the real value at the time of writing the code).\n\
    \nSometimes we go out on the sedan, and other times we take the pickup truck!\
    \ It is the same thing with notation syntaxes.\n\n### An example of a method\n\
    \nThe string data also inherits methods such as `.toUpperCase()`:\n\n```\nmyName.toUpperCase();\n\
    ```\n\nIt displays \"TONY\" instead of \"Tony\".\n\nWas the variable `myName`\
    \ changed to uppercase?\n\nNo, it wasn’t. It only displayed it in upper case mode,\
    \ but the value remains as it was originally declared.\n\nWe could however convert\
    \ the original value to uppercase by reassigning the variable `myName` to itself\
    \ as it gets transformed:\n\n```\nmyName = myName.toUpperCase();\n```\n\nNow `myName`\
    \ contains \"TONY\" as its value. The original Tony was discarded. Do you see\
    \ how it happened? We assigned the original variable to its own transformation.\
    \ It’s almost like the dog that was able to catch its own tail.\n\n### What’s\
    \ with the parentheses ( ) ?\n\n`toUpperCase` is a method, it processes some `action`.\
    \ That sounds like a `function`, which we haven’t covered yet. The `()` represents\
    \ action, or function processing, or `evaluation`. \n\nWhenever you see a pair\
    \ of parentheses think of something being evaluated by JavaScript, from which\
    \ a result will be returned back. In this case the data is being converted to\
    \ uppercase; that’s the result of the evaluation.\n\nMore about the parentheses\
    \ later. Don’t worry about it for now, juts acknowledge it and move forward.\n\
    \nHere’s another method: `toLowerCase()`:\n\n```\nmyName.toLowerCase();\n```\n\
    \nNow the value of myName is \"tony\". Did you notice the T is in lowercase? To\
    \ transform a string to lowercase except the first character would be called *capitalizing*.\
    \ Unfortunately there is no direct method in JavaScript to capitalize. It’s either\
