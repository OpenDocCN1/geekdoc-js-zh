    \  \n\nBREAK and END.\n\nAfter the execution of a case, JavaScript exits the switch\
    \ due to the ***break*** command that follows. If we don’t include the *break*\
    \ command, then JavaScript will search for more possible results and you may have\
    \ several correct answers instead of just one. And even if there are no other\
    \ correct answers, JavaScript still reads all the other conditions which could\
    \ be a time delay if the switch has thousands of possibilities programmed in it.\
    \ So the *break* is a very important implementation.\n\nWhenever there are no\
    \ conditions that match, the optional ***default*** takes over as the final and\
    \ *true* option and its code is executed. Notice that I did not include a break\
    \ after default. You could, but it is not necessary because JavaScript exits the\
    \ switch at this time anyway.\n\nFor further reading please visit [this post](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)\
    \ | bit.ly/1r4XRCL on the *forum*. Let’s practice a bit with switches.\n\n## 3.6\
    \ Lab work 13\n\n### 13a: Switch - using Boolean matches\n\nThis script will employ\
    \ a switch with 4 possible outcomes. The user will try to guess a number, and\
    \ the program will display a feedback message of either, *too low*, *too high*,\
    \ *right!* or *That’s not a number*:\n\n1- Create a switch inside of a function\
    \ named *guessNum*.\n\n2- This function takes one input parameter, *num* .\n\n\
    3- The switch should be hard wired to *true*.\n\nExample: switch(true) *\n\n4-\
    \ The cases should have the following conditions:\n\n**num <= 3** displays \"\
    too low\"\n\n**num >=5** displays \"too high\"\n\n**num === 4** displays \"right,\
    \ the number was 4\"\n\nfor **default** use \"*That's not a number*\"\n\n5- Call\
    \ the function by passing a numeric argument like for example:\n\nguessNum(2);\n\
    \nguessNum(7);\n\nguessNum(4);\n\nguessNum(\"a\");\n\n*   For a quick peek or\
    \ further explanation and my own final version of this project please refer to\
    \ the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/32-Lab-13a/)\
    \ | bit.ly/1qqwkWc\n\n    or just the [raw file](http://icontemp.com/jpl/switch1.txt)\
    \ | bit.ly/1r50ODq\n\n*   * Think of expressions. *num <= 3* will be converted\
    \ to ***true*** or ***false***. The same goes for all the other cases and therefore\
    \ the switch to match should be a Boolean *true*.\n\n### 13b: Switch - using literal\
    \ matches\n\nOn this next project we are going to use the following:\n\n*   A\
    \ function named *myFavColor*,\n\n*   A prompt() to get an input from the user,\n\
    \n    which will be converted to lower case so it matches\n\n    one of the cases.\
    \ (JavaScript is case sensitive).\n\n*   Some confirm() outputs so that we don’t\
    \ always use console.log,\n\n*   And some meaningful statements about *color*.\n\
    \nThe statements are as follows (you can always make your own\n\nor copy from\
    \ this\n\n[raw file](http://icontemp.com/jpl/colors1.txt) | bit.ly/1ypn1A2):\n\
    \n*   Green is the color of balance and growth.\n\n*   Blue is the color of trust\
    \ and peace.\n\n*   Indigo is the color of intuition.\n\n*   Purple is the color\
    \ of the imagination.\n\n*   Orange is the color of social communication and optimism.\n\
    \n*   Sorry, that color is not in the system yet!\n\n1- Please remember: the purpose\
    \ of creating a function is to recall the program without having to retype it\
    \ again. It works great for testing purposes and in real life as well. So the\
    \ whole switch should be wrapped in a function. Please feel free to choose the\
    \ function style you prefer, a function declaration, or a function expression\
    \ which is the one assigned to a variable.\n\nI will use the first method:\n\n\
    **function myFavColor() {}**\n\n2- Inside of the function, the *prompt()* will\
    \ be assigned to variable *color*.\n\nI will convert the input from the user into\
    \ all lowercased letters so that it matches my cases which will be in all in small\
    \ letters.\n\n**var color = prompt(\"Enter your favorite color\").toLowerCase();**\n\
    \n3- The switch expression should be the value of the variable *color*:\n\n**switch\
    \ (color) { }**\n\n4- Each case needs to be in small letters because the input\
    \ will be converted to lowercase:\n\n**case \"green\":**\n\n5- The output from\
    \ each case should be a *confirm()* followed by a *break*:\n\n**confirm(\"Green\
    \ is the color of balance and growth.\");\n\nbreak;**\n\n6- When no color matches,\
    \ the *default* execution takes over and it could be something like the following\
    \ (no break is necessary):\n\n**default:\n\nconfirm(\"Sorry, that color is not\
    \ in the system yet!\");**\n\n7- Finally, don’t forget the two closing braces:\
    \ one for the switch and another for the function (the ones shown in red on the\
    \ top of this page , steps 1 and 3).\n\n*   For a quick peek or further explanation\
    \ and my own final version of this project please refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/)\
    \  | bit.ly/ZcaDUC\n\n    or just the [raw file](http://icontemp.com/jpl/colors2.txt)\
    \ | bit.ly/1DwVBsd\n\nTo test your script just call the function and follow the\
    \ prompts:\n\nmyFavColor();\n\n### 13c: A repeating switch routine\n\nSometimes\
    \ we want the script to run repeatedly such as for example in a game, until we\
    \ purposely decide to exit.\n\nIn order to make our previous script repeatable\
    \ all we have to do is to call the function *myFavColor()* just before we close\
    \ the function, and the function will trigger a new instance of the game.\n\n\
    When I first introduced the *confirm()* mechanism I had mentioned that confirm()\
    \ can return a Boolean **true** if we press OK, or a Boolean **false** if we press\
    \ Cancel. We can catch this returned data to trigger the new *function call*,\
    \ and one way to do it is to add the following code just before closing the outer\
    \ function (the variable name replay is arbitrary):\n\n**var replay = confirm(\"\
    click ok to play again, or cancel to exit\")\n\n if (replay === true) {\n\n myFavColor();\n\
    \n}\n\n}** <-- this curly brace is already there, it is the very last brace on\
    \ the bottom.\n\nSo in a sense we grab the Boolean *true* from the confirm mechanism\
    \ and reuse it to call myFavColor();\n\n*   For a quick peek or further explanation\
    \ and my own final version of this project please refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/34-Lab-13c/)\
    \ | bit.ly/1ogVffh\n\n    or just the [raw file](http://icontemp.com/jpl/colors3.txt)\
    \ | bit.ly/1vdaYQT\n\n### 13d: Using a while loop to repeat the script\n\nWe have\
    \ not covered while loops. The only loops we have covered were the ***for loop***\
    \ for arrays and the ***for in loop*** for objects. There are many different styles\
    \ of loops and they are all based on the for loop we first learned.\n\nA ***while\
    \ loop*** is one that runs indefinitely until something triggers the loop to exit."
