    \ `WordPad`，因为它们会添加隐藏的格式代码，干扰你的脚本。Microsoft Windows 自带了 `Notepad`（记事本）。记事本非常好用，我每天使用它数百次来过滤从一个来源复制并粘贴到另一个来源的文本，因为它会剔除任何可见或隐藏的格式。但我也会使用其他免费编辑器，例如免费的\
    \ [Notepad++](http://notepad-plus-plus.org/)、[Programmer's Notepad](http://www.pnotepad.org/)\
    \ 以及 [Brackets](http://brackets.io/) 来编写真正的代码。\n\n注意：自 2015 年 5 月起，微软发布了一款非常酷的免费源代码编辑器\
    \ [Visual Studio Code](https://code.visualstudio.com/)，它支持 Windows 7 及以上版本、Linux\
    \ 和 Mac。这非常推荐，但目前我将推荐一个简单得多的来完成练习，你会知道为什么的。请继续阅读。\n\n当然，你可以使用任何你喜欢的 `plain`（纯文本）编辑器，但让我为你介绍一个非常方便的在线编辑器，因为你不需要依赖电脑就可以开始。我每天多次使用这个在线工具，因为它允许我在点击\
    \ `beautify`（美化）按钮时优化代码（创建正确的空格）：\n\n[jsbeautifier.org](http://jsbeautifier.org/)\n\
    \n请 `Bookmark` 该网站。这种安排的唯一缺点是你可以无法直接保存代码，但现在我们不需要保存任何东西，我们正在实验，jsbeautifier 在这方面效果很好，因为它实际上教了我们\
    \ JavaScript 语法应该如何呈现。\n\n### 什么是代码块？\n\n代码块通常是不同语句的集合，组合组合特定的功能。保存代码组的最佳方法是创建一个\
    \ `function`（函数）。我们很快就会接触函数。\n\n代码块通常由左大括号 `{` 和右大括号 `}` 限制（包围）。\n\n这是一个代码块的示例：\n\
    \n```javascript\nvar x = \"Hello\";\nconsole.log(x);\n}\n```\n\n我们将从下一个项目开始使用代码块。\n\
    \n### 代码注释\n\n有时，我们想在代码中做记，，向另一个人类解释某行代码的作用，但我们不希望 JavaScript 在看到我们的注释时抛出错误。\n\
    \n制作注释有两种方法：\n\n1. **使用双正斜杠**。\n\n使用这种风格的注释，我们无法按下 `Enter` 键编写第二行注释。它必须在连续的一行内全部完成：\n\
    \n```javascript\n// 这是一条注释。你好，亲爱的读者，你好吗？\n```\n\n2. **使用斜杠和星号开始注释，使用星号和正斜杠结束注释：`/*\
    \ */`**\n\n这种注释可以跨越你想要的任意行数：\n\n```javascript\n/* 使用这个注释我可以注释一整页内容\n并创建我想要的任何行。从前，在一个非常遥远、名为新泽西的土地（以前被称为\
    \ Schejachbi），那里有一个名为 Lenape 的美国印第安部落... */\n```\n\n让我们进入 `conditional branching`（条件分支），这是进入实际编程非常重要的一步。\n\
    \n## 2.2 条件分支\n\n我们刚刚学习了如何从用户那里获取反馈，但我们无法因此做什么，因为没有工具可以根据用户提供的反馈做出决策。很好，我们现在就要获取这些工具。\n\
    \n假设我们询问用户他/她是否想一起玩，根据用户的回答，我们要么继续玩要么退出程序。这听起来我们需要应用 `if()` `else` 条件代码语句，对吧？\n\
    \n### if, else 条件语句\n\n要在 JavaScript 中做出分支决策，我们需要了解 `if()`、`else` 条件语句。\n\n分支是指根据分支点呈现的\
    \ `Boolean`（布尔）语句，我们走这条路或走那条路。换句话说，“如果为真走这条路，否则走那条路”。\n\n基础的 `if`, `else` 语法如下：\n\
    \n```javascript\nif(Boolean true) { do this stuff; } else { do that stuff; }\n\
    ```\n\n`else` 部分是可选的。\n\n注意 `Boolean true` 这个术语。这是一个许多代码学生在开始时遗漏的重要概念。在括号内部我们有一个\
    \ `lock`。无论你在这些括号内写了什么，条件必须始终求值为 `Boolean true` 才能解锁后续大括号中的代码。`Boolean true` 始终是解锁\
    \ `if()` 语句的正确钥匙。只有当该条件为真时，JavaScript 才会执行下一个代码块中的代码。另一方面，如果条件求值为 `false`，则代码块将对\
    \ JavaScript 隐藏，JavaScript 将退出或执行下一个可用代码块（如果有的话），例如：`else { }`。\n\n*   一个 `if()`,\
    \ `else` 语句在某种意义上是一个逻辑：\n\n    要么执行第一个块，要么执行 `else` 块，但绝者兼者。\n\n*   **请注意：**从现在起，一些实验和理论将并存。请在我们讨论主题时一起编码。**第二部分**将是一场*实践*冒险。\n\
    \n让我们构建一个示例来看看 `if()`, `else` 是如何工作的。\n\n1- 在你的编辑器（或 [jsbeautifier.org](http://jsbeautifier.org/)）中，将\
    \ `prompt()` 赋值给变量 `x`。\n\n在 `prompt()` 中，询问用户如果他/她想继续就说 `yes`，如果他/她想离开程序就说 `no`。\n\
    \n类似于：\n\n```javascript\nvar x = prompt(\"Would you like to continue? yes or no\"\
    );\n```\n\n2- 构建一个 `if(x === \"yes\")` 语句，在屏幕上打印消息\n\n\"Ok, let's play!\"\n\n\
    否则，在屏幕上打印 \"Ok, goodbye!\"\n\n编码完成后，如果你使用的是 jsBeautifier，点击“Beautify JavaScript”按钮或按\
    \ `CTRL-ENTER` 让你的代码更美观。注意编辑器如何调整间隔以符合标准的 JavaScript 样式。\n\n查看下方图片。\n\n![](img/00001.jpeg)\n\
    \n图 1 查看原始文件:( [这里](http://jsplain.com/javascript/index.php/Thread/8-branching1)\
    \ ) bit.ly/1uN96zN\n\n"
