- fmt: '

    A directive is something that introduces new functionality to the existing standard
    syntax. It expands the syntax''s capability, it’s a way of teaching an old dog
    new tricks. By attaching a directive to an existing HTML tag, the behavior of
    that tag changes by what is written on the Angular''s library under the name of
    such directive. In some cases directives specify global behavior, while in other
    cases they only affect a local section, such as a block of programming code.


    AngularJS teaches the browser new syntax through constructs called directives.


    If you ever built web applications before, Angular will be a total new paradigm.
    If you are new to web design, AngularJS will teach you modern and best practices
    and consider yourself lucky because you don’t have to forget the old in order
    to learn the new.


    Yes there is a price to pay at first, you lose flexibility. What you gain in return
    is consistency, speed of development, and something that works today and tomorrow.
    You no longer need to know how to build a motor in order to drive the car, but
    the more you know the better you will take advantage of what the car has to offer.
    AngularJS is not an easy technology to learn, but if you have made it up to here
    in this book, then you have gotten the discipline and skill to learn and master
    AngularJS.


    ### What does ng-app mean?


    It just tells the browser to use AngularJS as the root of the page, or as the
    root of the DIV, depending where we insert the `ng-app` tag. In this way everything
    will be relative to AngularJS which provides core functionality to your page.


    In this example,


    ```html

    <html ng-app>

    ```


    The whole page uses AngularJS as its root.


    In this example,


    ```html

    <div ng-app>

    ```


    Only this DIV uses AngularJS as its root. The rest of the web is not aware of
    AngularJS.


    We can also name the application we are building by adding the *app name to the
    directive:


    ```html

    <html ng-app="myApp">

    ```


    This becomes very useful as you will see soon.


    Because the application name inclusion on the `ng-app` directive is very common,
    you will see the following syntax in many articles out there:


    ```html

    <html ng-app="">

    ```


    That’s another way of writing a directive with no name, instead of just writing
    `ng-app` by itself.


    *   **Note:** Do not include a name unless such name exists as a `Module` because
    AngularJS will not work. We haven’t covered Modules yet so, for now, we only use
    `ng-app` by itself, and it is perfectly fine to do so even in production.

    *   **Note:** Notice how `ng-app=""` does not have a blank space between quotes.
    A blank space would be considered a name (even if blank) and a Module under that
    name would have to be created. Again, let’s just use `ng-app` by itself for now.


    ### No more DOM manipulation tasks


    The Document Object Module or `DOM` is the map layout of all existing HTML tags
    or nodes. In order to write a result of a JavaScript program in a web page we
    need to address the DOM location where we want to implement the scripted result.
    This has always been a problem due to browser inconstancies and implementation
    errors. Then `jQuery` was invented. `jQuery` is a library of methods used to address
    the DOM. When properly implemented, `jQuery` works great. Unfortunately the usage
    of `jQuery` has become a problem because many users do not learn JavaScript, they
    just memorize `jQuery` solutions and `jQuery` is manually driven leading to implementation
    errors.


    AngularJS has come to the rescue. The low level implementation will no longer
    be done by the programmer him/herself; it will be done by AngularJS based of the
    programmer’s expressive desires for a certain outcome. The programmer has become
    a plumber; it plugs in the correct directive for the desired outcome. This will
    assure best practices and error free implementations. With AngularJS you are freed
    from low level manipulation tasks and you can use your extra time to think of
    solutions instead of code grammar and security implementations.


    Of course, if you know `jQuery` you can still use it with AngularJS, but I suspect
    that AngularJS will develop more and more ways to avoid some of the `jQuery` popular
    implementations.


    In AngularJS, the only place where an application touches the DOM is within `directives`.
    If however you need to access the DOM directly you can still do it through the
    writing of [custom directives](https://docs.angularjs.org/guide/directive) | bit.ly/1tYW95Q


    Ok, we now know a bit about `directives`. Let’s review the meaning of `expressions`
    so that we can expand our AngularJS topic.


    ### What is an expression?


    Do you remember from a previous chapter what expressions were?


    An expression is something JavaScript evaluates to a single value.


    ```javascript

    2 + 5;

    // evaluates to 7

    ```


    ```javascript

    "tony"

    // evaluates to tony

    ```


    ```javascript

    "hello".toUpperCase();

    // evaluates to "HELLO"

    ```


    and so on...


    If, on our web page we have an expression that needs to be passed into AngularJS
    in order to be evaluated by the JavaScript interpreter, we do so by wrapping it
    in double braces:


    ```html

    {{ expression }}

    ```


    AngularJS will write the result of a JavaScript evaluation exactly where the braces
    are located on the web page. This is not an AngularJS invention; it has been implemented
    by other libraries away before AngularJS. Just take a quick look at [Mustache](http://en.wikipedia.org/wiki/Mustache_%28template_system%29)
    | bit.ly/1DxihbF


    Let’s play with a couple of examples. It will not be anything practical but it
    serves to familiarize us with passing expressions to AngularJS.


    Note: You still can use jsbeautifier.org as an editor but unfortunately you cannot
    save your.


    1- First we fetch our sample:


    2- Paste it onto a local editor like Windows Notepad.


    3- To test it, go to your file list and double click on the file. Since it is
    an HTML file it will open in the browser and you should see the word hello.


    4- Now that we know the file works, let’s go back to the editor and add an expression.
    Replace the word hello with the following sentence:


    ```html

    Convert the expression tony to uppercase: {"tony".toUpperCase()}}

    ```


    5- Save the file, refresh your browser or reopen the file, and you should see
    the word TONY in upper case.

    '
