    ## 2.9 数组列表


    ### 字符串与数组


    到目前为止，我们主要在处理 `string` 值。这里有一个赋值给已经由 `var` 初始变量 `x` 的字符串值示例：


    ```

    x = "orange";

    ```


    在字符映射方面，`o` 是位于 `zero` 位置的第一个字符，`r` 是位于位置 1 位置的第二个字符，`a` 是位于位置 2 位置的第三个字符，以此此类推。


    这是另一个示例：


    ```

    y = "orange banana apple";

    ```


    在上面的示例中，`b` 是第八个字符（我们必须计算空格），它位于数字为 `7` 的位置（`0,1,2,3,4,5,6,7`）。


    **如果我们想统计单词而不是统计字符数量怎么办？**


    我们不能用单个引号将单词分开，因为 JavaScript 会抛出错误：


    ```

    y = "orange" "banana" "apple"; <-- 这样行不通。

    ```


    即使我们用逗号将它们分开，


    ```

    y = "orange","banana","apple";

    ```


    JavaScript 会先将 `y` 赋值为 `orange`，然后重新将 `y` 赋值为 `banana`，最后赋值为 `apple`，最终 `y` 中只会存储最后一个值。


    因此，在字符串值中，映射**限于单个字符**。整个字符串被视为一个多个字符的单元。


    *   **简而言之**，如果我们想将单词作为独立的独立单元保存在变量中，我们需要使用不同的 `data type`，因为 `string` 无法做到这一点。其中一种类型被称为
    `array`（还有其他的）。


    `array` 类型和 `string` 类型之间的区别在于我们可以存储单个单词。数组的另一个优势是，我们可以在同一个变量的不同数据包中存储 `number`
    类型的值，以及其他类型如 `functions`、`objects` 和 `Booleans`。


    就像字符串值一样，在数组中，我们也从位置零开始数字地访问每个位置。事实上，字符串值是一个非常简单的单个字符数组。


    **把数组想象成一个活页文件夹**。


    每个口袋都按顺序标记，在每个口袋中，我们可以存储任何我们想要的内容。


    要检索每个口袋的内容，我们使用中括号语法调用数组，并使用位置数字来访问我们尝试获取的数据。


    #### 数组语法


    要声明一个 `array` 类型类型的值，我们使用一对方括号：


    ```

    var x = [ ];

    ```


    你可以在网上读到中括号语法被称为数组语法，这是因为括号语法源于数组口袋位置的概念。


    上面的示例是一个空数组，因为括号内部没有任何数据，但方括号已指示 JavaScript 解释器将变量 `y` 声明为 `type array`。


    回到我们上一个字符串示例，如果我们想保存独立的单词，可以按照以下方式声明并赋值变量 `y`：


    ```

    var y = ["orange","banana","apple"];

    ```


    现在，如果我们调用 `y` 的位置 2，我们得到结果 "apple"：


    ```

    y[2]; <-- 显示 "apple"

    ```


    或者更隐式地：


    ```

    console.log(y[2]); <-- 显示 apple

    ```


    由于我们的数组 `y` 有三个跨越从位置零到位置 2 的值，我们可以通过通过访问后续位置来向它添加更多值。示例：


    ```

    y[3] = "peach";

    ```


    现在，如果我们在控制台中输入 `y;` 调用变量 `y`，我们得到：


    ```

    ["orange", "banana", "apple", "peach"]

    ```


    如果我们重新赋值已存在的位置之一（例如位置零），会发生什么？


    ```

    y[0] = "grape";

    ```


    我们覆盖了之前的值，因为我们刚刚将该位置重新赋值为不同的值。数组不会移动位置来容纳更多项目，它只是通过将位置重新赋值为其他来删除现有值。


    数组 `y` 现在仍然包含之前数量的值：


    ```

    ["grape", "banana", "apple", "peach"] "orange" 被删除了。

    ```


    ### 使用 push() 和 unshift() 向数组插入元素


    随着数组变大，几乎不可能知道数组中包含多少项目，这使得添加新项目变得非常困难，因为当我们向数组的某个位置添加项目而该位置已满时，JavaScript 会用新项目替换旧项目。旧项目从数组中删除。


    为了防止这种删除发生，JavaScript 有两种机制帮助我们向数组添加项目：`push` 和 `unshift`。


    #### Push()


    向数组添加新项目的最常见方法将其添加到列表的最末尾。


    *   数组方法 `push()` 将项目添加到列表的最末尾。


    你还记得我们如何使用 `+=` 向字符串中追加字符吗？


    `+=` 的问题是它将新项目作为最后一个单元添加到最后一个项目。


    例如，在


    ```

    var y = ["orange","banana","apple"];

    ```


    如果我们写 `y += "cherry";`，我们将得到 "*orange, banana, apple*"，这不是我们想要的。向数组添加添加项目的正确语法如下：


    ```

    y.push("cherry");

    ```


    现在数组包含：


    ```

    ["orange", "banana", "apple", "cherry"]

    ```


    让我们再添加一个项目 `avocado`：


    ```

    y.push("avocado");

    ```


    现在数组 `y` 包含：


    ```

    ["orange", "banana", "apple", "cherry", "avocado"]

    ```


    **push 的含义**：想象一叠砖块。当我们向堆上放置一块新砖时，由于它的重量会将其他的向下推。堆的顶部是数组的最后一个位置。现在，如果你以水平方式而不是垂直方式可视化数组，最后一个项目在你的右侧。我们在书中会多次使用
    `push()`，因为它是插入新项目的常用方法。


    #### unshift()


    `unshift()` 方法将项目添加到数组的开头。


    当我们垂直可视化数组时，数组的开头是底部，而在水平方向上，它是数组的最左侧。


    以上一个主题中数组 `y` 的实例为例，我们将 `blueberry` 添加到数组的开头：


    ```

    y.unshift("blueberry");

    ```


    数组现在是：


    ```

    ["blueberry", "orange", "banana", "apple", "cherry", "avocado"]

    ```


    注意 "orange" 如何移动到位置 1（即第二个项目），为新位置零的 "blueberry" 让出空间。


    **unshift 的含义**：为了在堆的底部插入一块新砖，我们需要向上移动所有的砖块，以便我们能挤进一块新砖作为堆的第一个项目，因为第一个项目位于底部。相反，当我们使用
    `push` 向堆的顶部插入新项目时，我们实际上是在 `push` 时将所有内容向下推，尽管底部没有地方可去。


    ### 使用 for 循环打印数组项目


