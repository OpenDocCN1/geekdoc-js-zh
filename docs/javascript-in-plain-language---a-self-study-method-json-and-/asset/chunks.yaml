    \ writing objects is just easier for the eye, but JavaScript does not care one\
    \ way or the other.\n\n1- Here’s an example of a multiple line syntax style. Please\
    \ write the code along with me just for practicing purposes. There is also a link\
    \ to a raw file below the image:\n\n![](images/00014.jpeg)\n\nFig 14 see [raw\
    \ file](http://icontemp.com/jpl/car1.txt) | bit.ly/ZbwxY3.\n\nNotice the *commas*.\
    \ Just like in a single line object, all elements are separated by a comma except\
    \ the last item. If you write a comma there (after the last item) you will get\
    \ an error because the JavaScript interpreter will expect another element to its\
    \ right (or in this case below it).\n\nNotice the quotes on numbers 2014 and 67,000.\
    \ The reason I added quotes is because I don’t plan to do any calculations with\
    \ these numbers, so I’ve decided to treat them as strings. This is optional; you\
