    ## 1.7 增加一些 JavaScript 运算符


    ### +, -, +=, -=, /, /=, %, *, *=


    - 如果两个操作数都是数字，它将左操作数加到右侧操作数上。

    - 如果一个或两个操作数都是字符串，它将拼接这两个单词或字符。

    - 从左数字操作数中减去右数字操作数。

    - `+=` 将左侧加到右侧并自动**赋值**给**左侧**。

    - `-=` 从左侧减去右侧并自动**赋值**给**左侧**。

    - `/` 将左操作数除以右操作数。

    - `/=` 将左操作数除以右操作数并自动将`quotient`（商）赋值给**左侧**。

    - `%` 取模（获取左操作数除以右操作数后的余数）。

    - `*` 将左操作数乘以右操作数。

    - `*=` 将左操作数乘以右操作数并自动将乘积**赋值**给**左侧**。


    注意：由于 `+=`、`-=`、`/=` 和 `*=` 是赋值运算符，因此左操作数必须是一个变量，不能直接是数字。


    我们将在编码过程中扩展这些概念。


    ### + 加法运算符


    `+` 符号具有双重功能，取决于 JavaScript 处理的数据类型。


    在字符串类型中，`+` 运算符按照示例所示[拼接](http://en.wikipedia.org/wiki/Concatenation) 单词：


    ```javascript

    "Hello" + "World!";

    ```


    JavaScript 将它们组合为 "HelloWorld!"


    如果你真的想在单词之间留空格，有三种可能的方法完成这项任务：


    (1)

    ```javascript

    "Hello" + " " + "World!";

    ```

    (2)

    ```javascript

    "Hello " + "World!";

    ```

    (3)

    ```javascript

    "Hello" + " World!";

    ```


    在第一个示例中，我通过将其括在引号中添加了一个*独立的*空格。

    在第二个示例中，我在 Hello 之后、结束引号之前放置了一个空格。

    在第三个示例中，我在 World! 单词后面添加了一个尾随空格。


    第一个示例在我们将两个变量相加时非常有用，因为缺少引号，我们无法将前导或尾随空格与变量结合。


    我的意思是：


    ```javascript

    var x = "Hello";

    var y = "World!";

    ```


    现在我们将两个变量拼接在一起并将它们赋值给另一个变量：


    ```javascript

    var z = x + y;

    ```


    `z` 的结果是 `HelloWorld!`。在 `x` 和 `y` 之间添加空格的唯一方法是使用第一种技术：


    ```javascript

    var z = x + " " + y;

    ```


    现在 `z` 包含 "Hello World!"。


    ### 使用 + 加法运算符相两个数字


    涉及数字时，`+` 运算符将操作数相加如下所示：


    ```javascript

    3 + 4 + 5;

    ```


    该表达式的结果将是 12。


    ```javascript

    var a = 6;

    var b = 10;

    var c = a + b;

    ```


    变量 `c` 被赋值为 16，它是 `a` 和 `b` 的和。


    ### 使用 += 赋值运算符


    `+=` 非常有用。假设变量 `i` 的值为 3，你想给它加 7，我的意思是 3 + 7：


    ```javascript

    var i = 3;

    ```


    我们可以这样做：


    ```javascript

    i = i + 7;

    ```


    这会将变量 `i` 赋值为 10。


    然而，这种操作非常常见（正如你之后将看到的），所以程序员创建了一个快捷运算符 `+=`（称它为 *plus equals*，永远不要写成 equals plus，因为那是不起的）：


    ```javascript

    i += 3;

    ```


    每当你看到 `+=`，它意味着取左操作数的值并将右操作数加在其上。


    所以现在原来的 10 `i` 现在是 13。如果我再做一次会怎样？


    ```javascript

    i += 1;

    ```


    现在 `i` 是 14。


    那么这个呢：


    ```javascript

    i += i; // <-- 是 i 不是 1。

    ```


    上面的示例等同于 14 + 14，结果为 28。


    `+=` 运算符也可以用于字符串，在原始值的右侧添加更多字符：


    ```javascript

    var n = "T";

    n += "o"; // 结果为 "To"

    n += "n"; // 结果为 "Ton"

    n += "y"; // 结果为 "Tony"

    ```


    这在*循环*中构建短语或列表时非常有用。


    ### ++ 自增运算符


    我们很多时候想要增加 1 个单位。我们可以通过以下方式实现：


    假设 `x = 5`：


    ```javascript

    x = x + 1; // 现在 x 是 6

    x += 1;     // 现在 x 是 7

    x++;       // 现在 x 是 8

    ```


    `++` 运算符是最常用的增加值的方法。


    ### -- 自减运算符


    `--` 运算符是 `++` 运算符的反相反。它减少 1 个单位。


    假设 `x = 5`：


    ```javascript

    x = x - 1; // 现在 x 是 4

    x -= 1;     // 现在 x 是 3

    x--;       // 现在 x 是 2

    ```


    `--` 运算符是最常用的减少值的方法。


    ### - 减法运算符


    `-` 运算符从左数字操作数中减去右数字操作数。


    ```javascript

    10 - 5; // 结果为 5

    ```


    我们还可以使用 `-=` 运算符从原始变量中减去值：


    ```javascript

    x = 10;

    x -= 2; // 现在 是 8

    ```


    ### / 除法运算符


    `/` 运算符将左操作数除以右操作数。


    ```javascript

    10 / 2; // 结果为 5

    ```


    我们还可以使用 `/=` 运算符除原始变量并将结果赋值给它：


    ```javascript

    x = 10;

    x /= 2; // 现在 是 5

    ```


    ### * 乘法运算符


    `*` 运算符将左操作数乘以右操作数。


    ```javascript

    3 * 4; // 结果为 12

    ```


    我们还可以使用 `*=` 运算符乘以原始变量并将结果赋值给它：


    ```javascript

    x = 5;

    x *= 2; // 现在 是 10

    ```


