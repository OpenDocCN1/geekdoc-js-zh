    `statement` 结尾的分号告诉 JavaScript 你已经完成了变量的声明：


    ```

    var phoneBill;

    ```


    分号充当命令 `terminator`（终止符），或两个不同且独立命令之间的分隔符。换句话说，我们是在指示 JavaScript 停止并将该命令或表达式保存为一条独立于后续指令的独立指令。


    *回到变量名来看，*


    - **记住这一点：** JavaScript 是区分大小写的。`A` 和 `a` 在 JavaScript 中具有独立含义。`phoneBill` 和 `phonebill`
    不是同一个单词。此时，`phoneBill` 是一个已声明的变量，而 `phonebill` 什么都不是。如果你误写成 `phonebill` 而不是 `phoneBill`，JavaScript
    将抛出错误，因为你声明的是变量 `phoneBill` 而不是 `phonebill`。


    当然，我们也可以拥有两个独立的变量，一个名为 `phoneBill`，另一个名为 `phonebill`，这正是重点所在，对于 JavaScript 来说，它们是两个不同的单词。


    ### 给变量添加数据


    一旦声明了变量，就会为该变量预留一个内存位置，然后我们可以将某些数据赋值给该变量。


    记住 `phoneBill` 就不是比制作一个预留内存位置的映射要简单吗？


    要给变量赋值数据，我们使用 `=` 运算符：


    ```

    phoneBill = 200;

    ```


    不要在 200 之前使用 `$`。那会触发错误。如果你愿意，稍后输出数据时可以使用 `$`，但在将数据输入计算机内存时不能这样做。JavaScript 想要的只是纯形式的数字
    200。


    我刚刚将数字 200 保存在列为 `phoneBill` 的内存位置中。注意结尾的分号。它终止了我的 `statement`（语句）。


    我们可以在一个步骤中完成变量的声明并包含数据：


    ```

    var utilitiesBill = 400;

    ```


    有时候，我们只是想告诉 JavaScript 在某个特定名称下预留一个位置。而其他时候，我们一次性预留位置并填充数据。不要担心所需内存的大小。与其他语言不同，JavaScript
    是动态的：它会自动调整内存。


    ### 修改变量中的值


    如果我们想把 `phoneBill` 的值从 200 改为 150 该怎么办？


    要更改变量的值，我们只需要对它进行重新赋值（不需要重新声明）：


    ```

    phoneBill = 150;

    ```


    200 被删除了，`phoneBill` 位置的计算机内存现在持有值 150。


    - **记住这个：** **永远不要在同一个变量名上使用两次 `var`**。如果你在重写现有变量时将 `var` 作为前缀，你就会抹掉旧变量，因为你又重新声明了该变量。这可能是你刻意想要做的，但在大多数情况下，这并不是常见的做法。我见过许多新程序员把这当成错误这样做。


    ### 给变量添加单词而不是数字


    到目前为止，我们一直在为变量赋值 `type number`（数字类型）的数据。实际上，我们可以为变量赋值任何内容。


    由于变量只是一个内存位置，我们也可以给它赋值字符字符串 `string`（也称为 `string` 类型的值），甚至是其他类型的数据，如 `arrays`（数组）、`functions`（函数）、`objects`（对象）……稍后详细介绍这些。


    ### 我们聊聊字符串


    字符字符串可以赋值给变量，但我们需要告诉 JavaScript 这是一个字符串。我们让它知道的方法是将我们的字符字符串括在引号中：


    ```

    var myName = "Tony";

    ```


    任何未被引号括的单词都被视为存储在 JavaScript 库中的 `reserved`（保留）术语。


    - 如果我直接写 `var myName = Tony;`（字符串‘Tony’没有加引号），JavaScript 将检查计算机内存中的库，寻找名为 `Tony`
    的命令或变量。由于 `Tony` 不属于保留术语，JavaScript 将在屏幕上抛出错误。任何 `word data`（单词数据）都需要括在引号中。


    在我们声明变量 `myName` 后，单词 `myName` 将变成一个保留术语，直到它从内存中被清除或程序结束。变量名不需要加引号。


    - **记住这一点：** **不要给变量名加引号**。对于 `string` 类型的数据，我们需要在引号内。*当我们重新赋值时，不需要遗忘。*


    ### 使用什么引号：单还是双引号


    在 JavaScript 中，单引号或双引号的作用是一样的。只需确保引号匹配。

    '
- fmt: "\nAlmost all modern browsers have a `test` `Console` built into the browser\
    \ to assist us in debugging or experimenting with JavaScript. All Consoles provide\
    \ basically the same options once we have them open. The biggest differences are\
    \ how we access the `Console` and what the `Console` looks like on the screen.\n\
    \nSelect one of the following browsers. Download it if you don’t have it installed\
    \ on your computer. The reason to use one of these browsers is so that my instructions\
    \ may coincide with your actions as we code along using the JavaScript Console\
    \ that comes with it. Please feel free to use any other `Console` if you so desire,\
    \ but the way to access it may be different.\n\n[Google Chrome](https://www.google.com/chrome/browser/).\n\
    \n[Opera](http://www.opera.com/).\n\nOpen one of those two browsers and then press\
    \ the following key sequence to open the `Console`:\n\n1- If you are using Windows\
    \ or Linux:\n\n`CTRL SHIFT j`\n\nIf on a MAC:\n\n`CMD SHIFT j` or `ALT-CMD-j`\n\
    \nMost likely a window will open at the bottom of your screen.\n\n2- Make sure\
    \ the tab `Console` is selected.\n\nIf you get any `error` messages, just clear\
    \ the screen by `right clicking` on the white area and selecting `Clear Console`.\
    \ These errors will happen almost every time you open the console because the\
    \ `Console` is inspecting the current opened document, the one you see on screen\
    \ before you access the `Console`, and things may not be 100% as expected by the\
    \ `Console`, hence the error warnings. Just clear the message so that we gain\
    \ more window space.\n\n3- If you want (recommended), you can `detach` the `Console`\
    \ from the browser and minimize the browser so that it gets out of your way. After\
    \ you detach the `Console` for the first time, it will always stay detached unless\
    \ you attach it again by toggling the same button.\n\nTo detach the `Console`\
    \ look for a double square icon on the tab menu of the `Console`, and click on\
    \ it. Now you should have two different windows. Minimize the browser to get more\
    \ room on your `Console` screen.\n\n### Declaring some variables\n\nLet’s start\
    \ coding...\n\n1- Declare variables `x`, `y` and `z`\n\n(declaration only, no\
    \ assignments of values at this moment)\n\nand press ENTER after each semicolon\
    \ in order to activate the expression:\n\nIt should look like this:\n\n```\nvar\
    \ x;\nvar y;\nvar z;\n```\n\nYou could also just use one `var` and separate the\
    \ variable names with a `comma`. That might save you some time if you are simultaneously\
    \ declaring a bunch of variables with no values given. Don’t forget the `semicolon`\
    \ at the end:\n\n```\nvar x, y, z;\n```\n\n2- Now, declare another variable but\
    \ assign a value at the same time. \n\nI’m using variable `a` with the value of\
    \ `347`:\n\n```\nvar a = 347;\n```\n\n3- Declare a variable `b` containing your\
    \ first name ( remember, your name is a `string` of characters):\n\n```\nvar b\
    \ = \"Tony\";\n```\n\n*   **NOTE:** You can read the value of each variable on\
    \ the `Console` by just typing the variable name, followed by the semicolon, and\
    \ pressing ENTER. Example:\n\n    `b;` It should display \"Tony\";\n\nTyping the\
    \ variable by itself in order to get a value displayed is only possible because\
    \ we are using a test `Console`. In real life we would have to use a print command\
    \ as we will see later.\n\n### Inspecting the data type of a variable\n\nGreat!\
    \ So far we have the following variables declared:\n\n`x, y, z, a, b`.\n\nWhat\
    \ kind of variable is variable `b`? I mean, what type of data does it contain?\
    \ We know `b` holds your first name, right?\n\n4- To inspect the variable use\
    \ the command `typeof`:\n\n```\ntypeof b;\n```\n\nIt displays \"string\". Variable\
    \ `b` contains your first name in `quotes` and therefore it is a string of characters.\n\
    \n5- What about variable `a`?\n\n```\ntypeof a;\n```\n\nIt displays \"number\"\
    . Variable `a` contains the number `347` and therefore it contains data of type\
    \ `number`.\n\n*   **NOTE:** Did you notice how the `Console` tries to finish\
    \ the word `typeof`? If you don’t want to write the whole word yourself just press\
    \ the TAB key as soon as you see the hint on the display. Or if you’re like me,\
    \ you’d rather practice typing, just be aware of misspells. The automatic completion\
    \ can become very handy to speed up programming and avoid typing mistakes, especially\
    \ when.\n"
  raw: "Almost all modern browsers have a *test* **Console** built into the browser\
    \ to assist us in debugging or experimenting with JavaScript. All Consoles provide\
    \ basically the same options once we have them open. The biggest differences are\
    \ how we access the Console and what the Console looks like on the screen.\n\n\
    Select one of the following browsers. Download it if you don’t have it installed\
    \ on your computer. The reason to use one of these browsers is so that my instructions\
    \ may coincide with your actions as we code along using the JavaScript Console\
    \ that comes with it. Please feel free to use any other Console if you so desire,\
    \ but the way to access it may be different.\n\n[Google Chrome](https://www.google.com/chrome/browser/).\n\
    \n[Opera](http://www.opera.com/).\n\nOpen one of those two browsers and then press\
    \ the following key sequence to open the Console:\n\n1- If you are using Windows\
    \ or Linux:\n\n**CTRL SHIFT j**\n\nIf on a MAC:\n\n***CMD SHIFT j*** or ***ALT-CMD-j***\n\
    \nMost likely a window will open at the bottom of your screen.\n\n2- Make sure\
    \ the tab *Console* is selected.\n\nIf you get any *error* messages, just clear\
    \ the screen by *right clicking* on the white area and selecting ***“Clear Console”***.\
    \ These errors will happen almost every time you open the console because the\
    \ Console is inspecting the current opened document, the one you see on screen\
    \ before you access the Console, and things may not be 100% as expected by the\
    \ Console, hence the error warnings. Just clear the message so that we gain more\
    \ window space.\n\n3- If you want (recommended), you can *detach* the Console\
    \ from the browser and minimize the browser so that it gets out of your way. After\
    \ you detach the Console for the first time, it will always stay detached unless\
    \ you attach it again by toggling the same button.\n\nTo detach the Console look\
    \ for a double square icon on the tab menu of the Console, and click on it. Now\
    \ you should have two different windows. Minimize the browser to get more room\
    \ on your Console screen.\n\n### Declaring some variables\n\nLet’s start coding...\n\
    \n1- *Declare* variables *x*, *y* and *z*\n\n(declaration only, no assignments\
    \ of values at this moment)\n\nand press ENTER after each semicolon in order to\
    \ activate the expression:\n\nIt should look like this:\n\n**var x;**\n\n**var\
    \ y;**\n\n**var z;**\n\nYou could also just use one *var* and separate the variable\
    \ names with a *comma*. That might save you some time if you are simultaneously\
    \ declaring a bunch of variables with no values given. Don’t forget the *semicolon*\
    \ at the end:\n\n**var x, y, z;**\n\n2- Now, declare another variable but assign\
    \ a value at the same time.\n\nI’m using variable  ***a*** with the value of *347*:\n\
    \nvar a = 347;\n\n3- Declare a variable ***b*** containing your first name ( remember,\
    \ your name is a *string* of characters):\n\nvar b = \"Tony\";\n\n*   **NOTE:**\
    \ You can read the value of each variable on the Console by just typing the variable\
    \ name, followed by the semicolon, and pressing ENTER. Example:\n\n    ***b;***\
    \ It should  display \"*Tony*\";\n\nTyping the variable by itself in order to\
    \ get a value displayed is only possible because we are using a test Console.\
    \ In real life we would have to use a print command as we will see later.\n\n\
    ### Inspecting the data type of a variable\n\nGreat! So far we have the following\
    \ variables declared:\n\n*x, y, z, a, b*.\n\nWhat kind of variable is variable\
    \ ***b***? I mean, what type of data does it contain? We know ***b*** holds your\
    \ first name, right?\n\n4- To inspect the variable use the command ***typeof***:\n\
    \n**typeof b;**\n\nIt displays \"*string*\". Variable ***b*** contains your first\
    \ name in *quotes* and therefore it is a string of characters.\n\n5- What about\
    \ variable ***a***?\n\n**typeof a;**\n\nIt displays \"*number*\". Variable ***a***\
    \ contains the number *347* and therefore it contains data of type *number*.\n\
    \n*   **NOTE:** Did you notice how the Console tries to finish the word *typeof*\
    \ ? If you don’t want to write the whole word yourself just press the TAB key\
    \ as soon as you see the hint on the display. Or if you’re like me, you’d rather\
    \ practice typing, just be aware of misspells. The automatic completion can become\
    \ very handy to speed up programming and avoid typing mistakes, especially when\
    \ it comes to long commands. Auto typing also helps us remember how each command\
    \ is written. The test Console is really useful; I use it in real life hundreds\
    \ of times a day because I’m constantly testing stuff.\n\n### What is *typeof*?\n\
    \n*typeof* is a unary operator. It is called unary (opposite of binary) because\
    \ it only takes one operand, the variable to the right of it. An example of a\
    \ binary operator would be the + sign where we need a left and a right operands.\n\
    \nLet’s do a few more inspections.\n\n6- What type of data is contained in variables\
    \ ***x****, **y***, and ***z***? (test them all)\n\nAnswer to all: \"*undefined*\"\
    .\n\n### Why it “undefined” and what is undefined?  \n\nThese variables hold the\
    \ value of *undefined* because we haven’t assigned any data to them yet.\n\nJavaScript\
    \ reserves some memory for each one of these variables and puts a *placeholder*\
    \ as data. This placeholder is of type \"*undefined*\". It is still a value, a\
    \ special value, and we can take advantage of it for decision making as you will\
    \ see later.\n\nClear the screen by right-clicking and selecting “Clear console”.\
    \ Note: Clearing the screen does not erase the variables from memory; it only\
    \ gives us more space on the screen.\n\nLet’s assign some values to variables\
    \ ***x***, ***y***, ***z***:\n\n7- Assign the following string value to ***x***.\
    \ Make sure to wrap your string of characters with quotes:\n\n**x = \"The quick\
    \ brown fox jumps over the lazy dog\";**\n\n8- Verify its type of value:\n\n**typeof\
    \ x;**\n\nIt now displays \"*string*\" as a type, rather than \"*undefined*\"\
    .\n\n9- Assign the variable ***b*** to variable ***y***\n\n(assignments go from\
    \ right to left):\n\n**y = b;**\n\n***y*** should now contain a copy of your first\
    \ name just like ***b*** does, and its type of value should also be \"*string*\"\
    .\n\n*   **Remember:** Assignments work from the right operand to the left operand.\
    \ Also, y and b values are independent of each other. The = sign does not mean\
    \ equality, it means to assign right to left.\n\n10- Assign a value of type *number*\
    \ (any number) to variable ***z***.\n\n*   **Remember:** numbers don’t take quotes.\
    \ If you wrap a number in quotes it becomes a string of characters and you can’t\
    \ perform any calculations with it.\n\n11- For further practicing, declare some\
    \ new variables of your own, assign some data to them and check their type of\
    \ value.\n\nJust like any other language, the only way to learn JavaScript is\
    \ to practice daily. Memorizing will not do it; just plain practice will succeed\
    \ and persist.\n\nEND OF LAB\n\n## 1.5 Manipulating variable data\n\nWhen we store\
    \ a value in the computer’s memory under JavaScript supervision, this value inherits\
    \ some *properties* and *methods* characteristic of the *type* of data the value\
    \ represents.\n\n***Where do these properties/methods come from?***\n\nThey exist\
    \ in the JavaScript library located in your browser. When we create a new instance\
    \ of one of the common types, our instance immediately inherits lots of tools\
    \ we can use to help us program outcomes.\n\n### Methods and Properties\n\n**[Properties](https://en.wikipedia.org/wiki/Property_(programming))**\
    \ are *qualities* the new data inherits from its data type. It will make more\
    \ sense later.\n\n**[Methods](https://en.wikipedia.org/wiki/Method_(computer_programming))**\
    \ are functionality that creates actions upon the data.\n\n*   There is no need\
    \ to memorize these terms. They will be repeated so many times that you will know\
    \ them by heart before you finish reading the book. Just read along and understand\
    \ the concepts. However, if you’re curious, each term has a link to Wikipedia\
    \ where you can read to your heart’s delight.\n\nTo see an example of a property\
    \ in action let’s declare a new variable of the *string* type:\n\n**var myName\
    \ = \"Tony\";**"
