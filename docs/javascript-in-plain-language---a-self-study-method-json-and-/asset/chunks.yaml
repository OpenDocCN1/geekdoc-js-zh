    太棒了！现在让我们来看两种处理 JSON 数据结构的有用方法。


    ## JSON 库方法


    JavaScript 有两个函数可以将普通的 JavaScript 对象解析为 JSON 格式，或者反之亦然。一旦数据转换为 JSON 格式，我们就可以将数据发送到全球其他地方的机器。


    让我们看看它们基本上是如何工作的。


    ## JSON.stringify


    `stringify` 函数通过删除空白字符并将其转换为字符串来压缩对象，以便其导出。


    以我们之前的对象 `employees`（如图 20 所示）为例，我们可以这样对其进行字符串化：


    ```javascript

    var myString = JSON.stringify(employees);

    ```


    我将结果赋值给变量 `myString`（任何名称均可），它现在是一个字符串变量，包含以下数据：


    "{"staff":[{"firstName":"Tony","lastName":"deAraujo","age":99},{"firstName":"John","lastName":"Smith","age":33},{"firstName":"Mary","lastName":"Adams","age":29}],"management":[{"firstName":"Judy","lastName":"Garland","age":43}]}"


    现在这段数据字符串已准备好通过 `http` 或任何其他方法发送到不同的位置或机器。任何具有解码 JSON（转换为 JSON 或读取为 JSON）方法的编程语言都能使用这些数据。


    **注意(1)：** 如果你想用 JSONLINT.com 验证这些数据，你需要排除变量名和外层引号。


    **注意(2)：** 使用 `stringify` 时，原始对象内部的函数（方法）不会被包含在内。这是故意为之。被字符串化的数据只有包裹在引号中的字符串键/值对（以及数字）。


    **注意(3)：** 有方法可以防止 JSON 压缩数据。该实现将在几页后介绍 `stringify` 的第三个参数时进行讨论。


    ## 使用第二个参数作为 stringify 的过滤器


    注意：如果目前这些信息量太大，请只需阅读它、理解它、记住它，并在你想重新回顾该主题时回来。


    `stringify` 方法可以接受第二个参数，用于**过滤**掉除了我们在 `stringify` 期间想要包含之外的所有内容。第二个参数可以是一个数组，也可以是一个函数，取决于我们尝试实现的目标。


    ### (a) 使用数组作为过滤器时


    当我们使用数组作为第二个参数时，我们可以挑选我们想要字符串化的数据。


    一如既往，第一个参数是正在使用的对象名称。当第二个参数是数组时，JavaScript 仅字符串化该数组提供的键/值。该数组充当了包含性过滤器。


    例如，我想只字符串化 `staff` 数组，并且只取每个员工的 own：


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "firstName"]);

    ```


    JavaScript 捕获了 `staff` 并获取它的 `firstName` 属性。此序列化的结果如下：


    "\"{"staff":[{"firstName":"Tony"},{"firstName":"John"},{"firstName":"Mary"}]}\"


    这是另一个示例，`age` 也包含在内（但不包含 `lastName`）：


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "firstName", "age"]);

    ```


    如果我们想同时获取 `staff` 和 `management` 的名字呢？


    ```javascript

    var someString = JSON.stringify(employees, ["staff", "management", "firstName"]);

    ```


    其结果为：


    "\"{"staff":[{"firstName":"Tony"},{"firstName":"John"},{"firstName":"Mary"}],"management":[{"firstName":"Judy"}]}\}\"


    注意：如果你尝试用原始格式在 [jsonlint](http://jsonlint.com/) 上验证此结果，它将失败。原因是我们需要剥离外层引号（使整个脚本成为字符串的引号）。一旦你删除了外层引号，你将获得
    jsonlint 的绿灯。有一种方法可以将此字符串转换回对象。该方法将在下一章讨论。


    **自己尝试一下这个：**


    如果你想练习一下，尝试对 `staff` 和 `management` 进行字符串化，但只取每个员工的姓和年龄。使用你喜欢的变量名。


    ### (b) 使用函数作为过滤器时


    到目前，我们一直使用数组作为 `stringify` 的第二个参数。这允许我们挑选想要包含在字符串化中的元素。


    使用函数作为第二个参数时，我们可以执行相反的操作，**排除元素**，或者修改某些元素的表示方式。


    该函数在输入参数中接收两个参数。第一个参数是 `key`，第二个参数是 `value`。这两个映射参数将代表 JSON 对象的每个键和每个值。换句话说，因为我们在处理之前捕获了每个键和每个值进行评估，我们可以在函数体中编写处理特定键和特定值的脚本，因为函数会扫描每个键和每个值（见下图）。


    至于参数名称，你如何称它们并不重要，重要的是它们的位置，位置必须是 (key, value)。你可以称它们为 `(k,v)` 或 `(x,y)` 或其他任何。


    例如，下面的图像使用函数 `filter` 从字符串化中排除 `age`：


    ![](img/00023.jpeg)


    图 22 查看[原始文件](http://icontemp.com/jpl/json4b.txt) 1v71zu。


    这里发生的情况是 `undefined` 值不会被包含在 JSON 文件中，因为在 JSON 中，undefined 表示空键/值对，所以 `age` 将被包含。（注：原文说“不会被包含”，但逻辑意味着排除）。


    首先，注意我们在没有第二个参数的情况下让 JavaScript 读取第三个参数：


    *   我们将第二个参数设为 `null`。这是可以的，因为现在我们可以有第三个参数。


    其次，数字 `4` 是缩进空格的数字。没有添加行的规定，但 JavaScript 在我们请求缩进时会自动添加行。最大数字是 10。


    你注意到原始文件中的第二个示例了吗？它显示的是*点*而不是*空格*。


    这是通过将第三个参数从数字替换为字符串实现的：


    ```javascript

    var myString = JSON.stringify(employees, null, "...");

    ```


    最后一个在 *jsonlint* 上测试时将无法通过，但它用于说明 `stringify` 的第三个参数。


    ## JSON.parse


    为了将字符串转换回我们之前的对象，我们使用 `JSON.parse` 方法。


    查看原始文件：[myString](http://icontemp.com/jpl/json6.txt) | 1rtZclU。


    ```javascript

    var myEmployees = JSON.parse(myString);

    ```


    变量 `myEmployees` 现在是一个对象，与我们原始的 `employees` 对象具有的值。


    注意：如果解析的数据不是有效的 JSON，将得到错误。


    '
