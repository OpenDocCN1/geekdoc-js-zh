    这本书适合所有想要在不参加正规课程的情况下，使用 `JavaScript` 语言学习基础编程的人。它也可以作为课堂练习和复习的补充教材。


    - 目标读者是初级、中级或想要重新学习该主题的高级读者。


    书中包含了许多带有答案和解释的练习题。每个章节的长度为一页或更短，每个主题后面都有带有指向原始文件的实验工作。还有一个 `forum board`（论坛板块）方便进一步的阅读和练习。由于所有脚本都很很短，这些链接仅是为了消除你对自己工作可能产生的任何疑问。


    我建议每天至少花上 30 分钟来阅读和练习每一章。不要赶于进度，因为涵盖的主题是掌握该语言的基础。要花时间吸收每个概念。在进入新主题之前，不要有意识地离开电脑，做一些肢体活动，例如简单的拉伸。


    阅读每个子主题并完成练习题。从头到尾读完这本书；之后，你可能想将这些材料作为全面的参考资料来温故知新或用于练习。如需更多练习，请参阅书中后部分介绍的专用论坛平台。


    如果你每天学习，你将在两周左右完成课程。


    如果你只是将其作为复习，你可能在一个周末内完成。


    本书利用了你浏览器的 `JavaScript Console`（JavaScript 控制台）。我建议使用 `Google Chrome` 的 `Console`，我将解释如何访问它以及如何将其用于我们的目标。`Opera`
    和 `Epic` 的用法也一样。当然，只要你知道如何访问，你可以利用你需要的任何其他测试方法。新的 Microsoft Edge 浏览器也可以通过快捷键 `F12`
    访问 `JavaScript Console`。


    除了推荐 `Google Chrome` 之外，我还会推荐 `jsbeautifier`（一个非常有用的在线编辑器），以及我自己的网站论坛，你可以在那里找到所有相关的练习题以及进一步的阅读和练习材料。


    现在不用担心这些；在适当的时候会有大量的参考链接发布。


    ### 在阅读这些材料之前你应该知道的


    阅读和练习书中项目的唯一先决条件是你熟悉基础计算机技能，如 `copy/paste`（复制/粘贴）和 `editing`（编辑）一行文本。


    为了获得更完整的体验，你需要访问 `Internet`（互联网）。


    你可以随时离线查看材料，但如果你不在线，将无法访问我的任何示例文件。


    为了完全理解书的最后部分（用通俗易的语言介绍了 `AngularJS`），你需要了解基础的 HTML 语法，例如理解如何创建一个基础 HTML 页面、`HTML`
    标签、`BODY` 标签、如何创建段落或 `DIV` —— 都不算复杂。


    这本书将为你打下基础，让你熟练掌握 `JavaScript`，无论你计划专攻该语言的哪个领域，都能稳健地进步。


    基础数学是一个加分项，即使你认为数学不是你的擅长，书中对所有的数学示例都进行了很好的解释。没有人应该在这些上遇到任何问题。


    本书将帮助你理解现代 JavaScript。这包括对 `JSON` 和 `AngularJS` 的通俗易懂的介绍，这将为你打开大门并打破障碍，让你进入这些非常热门的技术领域。


    字体 代码学习的螺旋法


    本电子书利用了下文概述的代码学习“螺旋法”理念：


    1- 保留了开发历史。

    2- 首先提供简单的解决方案，然后用更高级、更健壮的解决方案取代。

    3- 仅解释螺旋中用到的概念，并提供进一步阅读材料的链接。


    每个项目都保留其增量历史，作为一个可以回顾的有用内容快照，就像螺旋一样。螺旋法是教学中常用的一种技术，首先学习主题的基本事实，而不必担心细节。随着学习的进行，越来越多的细节被引入，同时它们与基础知识联系起来，并反复强调基础以帮助概念的内化。


    ### 不需要记忆


    - 本书必须按顺序阅读，以获得更有效、强大且有意义的体验。

    - 练习题不仅应该在完成当前实验工作后重复，还应该在完成整个章节或读完整本书后重复。

    - 练习就像练习吉他一样：每天且有目的地进行练习。将 `JavaScript` 练习看成要弹奏的音阶。

    - 完成练习后，始终思考如何将所涵盖的概念应用于不同的配方中。像主厨师一样思考。编程就像烹饪。

    - 编程也像水水工程。我们通过促进连接来创建接口。

    - 最后，编程既是科学也是艺术。它结合了这两个世界的领域之长。


    ### 什么是 JavaScript


    `JavaScript` 是一种旨在与计算机浏览器交互的编程语言。目前没有其他语言具有与 `JavaScript` 相同的浏览器兼容性。大多数试图取代 `JavaScript`
    的语言实际上是将它们的代码 `decompile`（反编译）成 `JavaScript`。


    ### JavaScript 和 HTML 有什么区别？


    `HTML` 是一种演示标记语言。它创建在页面上显示的对象（容器框）。它不会根据用户交互做出决策。`HTML` 在计算机屏幕上绘画。


    `JavaScript` 扩展了 `HTML`，体现在它通过根据某些条件和结果与用户交互，使页面动态化。


    为了创建结果并做出决策，我们需要学习 `JavaScript` 语法，这正是本书的主题。


    在随后的章节中，我们将学习如何使用名为 `AngularJS` 的最新实现技术之一来创建现代网页交互。


    这本书不会让你成为 `AngularJS` 专家。但它将为你提供一个非常坚实的基础，赋予你力量并让你向前发展。


