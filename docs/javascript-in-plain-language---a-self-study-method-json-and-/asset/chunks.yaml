    \ the capability of wrapping its elements in a private manner?\n\n*   Answers\
    \ and further explanation can be found here:\n\n    [forum](http://jsplain.com/javascript/index.php/Thread/28-Lab-12b/)\
    \ | bit.ly/1rm2pUg.\n\n### Part C: Find and replace a word in a string\n\nThe\
    \ goal for this project is to create a mechanism that finds a word in a paragraph\
    \ and replaces it with another word. The idea is to replace *brown* with *red*\
    \ on the following paragraph:\n\n\"The quick **brown** fox jumps over the lazy\
    \ dog.\"\n\nThe tools to use are as follows:\n\n*   Several variable names to\
    \ be used as helpers:\n\n    `paragraph` – assigned to the original paragraph.\n\
    \n    `tempArray` – assigned to the result of converting the string to array.\n\
    \n    `oldWord` – assigned to the word \"brown\", the one we search for in order\
    \ to replace.\n\n    `newWord` – assigned to the word \"red\", the one we want\
    \ to use as a replacement.\n\n*   `split()` which converts the string into an\
    \ array of separate words.\n\n    The result of splitting the string will be assigned\
    \ to an array called `tempArray`.\n\n    (The reason for converting the string\
    \ sentence into an array of words is so that we can target the desired word to\
    \ replace).\n\n*   A `for` loop. The loop will traverse the array in order to\
    \ find the targeted word and replace it.\n\n*   `join()` which will later reconvert\
    \ the array back to string.\n\nWe first split into array, then search and replace,\
    \ then convert back to string and assign the result back to the variable `paragraph`.\n\
    \nFinally we use `console.log` which prints variable `paragraph` displaying the\
    \ end result.\n\nIt may sound complicated but it becomes easier after doing it\
    \ the first time.\n\nHere’s a recipe guide:\n\n1. Declare the original string\
    \ variable.\n2. Convert the variable into individual words.\n3. Introduce the\
    \ word that needs to be found.\n4. Introduce the new word to replace the existing\
    \ word.\n5. Iterate over the array to find and to replace the word.\n6. Reconvert\
    \ the modified array to string by assigning it to the original variable.\n7. Display\
    \ your results.\n\nTake your time to think about it. Should you need an editor\
    \ use *jsbeautifier.org* to write your script. Then paste it onto the Console\
    \ for testing purposes.\n\n*   For a quick peek or further explanation and my\
    \ own final version of this project please refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/29-Lab-12-c/)\
    \ | bit.ly/1pqFAcC.\n\n    Or just the [raw file](http://icontemp.com/jpl/lab12c.txt)\
    \ | bit.ly/1uVMHjS.\n\n### Part D: Using a function to save and recall our code\n\
    \nGreat job! Now let’s take it one step further:\n\nLet’s save the script in a\
    \ function called `findReplace`.\n\nLet’s save the script in a function called\
    \ `findReplace`.\n\nThe idea is to convert both `oldWord` and `newWord` into input\
    \ parameters.\n\n```javascript\nfunction findReplace() {\n```\n\nor\n\n```javascript\n\
    var findReplace = function() { };\n```\n\nAt this point it should be obvious the\
    \ importance of using functions to create methods that can be reused in more than\
    \ one application.\n\n**Examples:**\n\n```javascript\nfindReplace(\"brown\", \"\
    red\");\nfindReplace(\"quick\", \"slow\");\n```\n\nOn the previous project we\
    \ created automatic find and replace, but it only worked with `paragraph`. It\
    \ would be nice to have a portable function so that we can apply it to other variables\
    \ or even strings.\n\nIn order to make the project more portable we need to add\
    \ a third input parameter, one which represents the targeted variable or just\
    \ any string.\n\n1- All we have to do is to add a third parameter and replace\
    \ all the `paragraph` instance names from inside the function, to this new input\
    \ parameter’s name.\n\nI have called my input parameter `data`.\n\n*   For a quick\
    \ peek or further explanation and my own final version of this project please\
    \ refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/31-Lab-12-e/)\
    \ | bit.ly/1mqMRhT.\n\n    Or just the [raw file](http://icontemp.com/jpl/lab12e.txt).\
    \ bit.ly/1uij9.\n\nIf you can’t think of an example to test your script please\
    \ look at the forum board for two samples of test data. You should find them right\
    \ below the script we have just discussed.\n\np.s. *I’m so happy that you have\
    \ made it this far, thank you*!\n\nWe’re almost done with the JavaScript lectures\
    \ and exercises. Then, JSON and AngularJS will be optional studies that you can\
    \ tackle later on if you need to take a break. However, please keep this truth\
    \ in check: “out of sight, out of mind”. You will forget if you don’t keep practicing\
    \ regularly, then you will have to read the book from the beginning again.\n\n\
    ## 3.5 More branching techniques\n\n### The switch\n\nSo far we have learned about\
    \ the `if()`, possible `else if()` and optional `else` conditional statements,\
    \ right?\n\n```javascript\nif(true) {\n// do this;\n} else if(true) {\n// do that;\n\
    } else {\n// do this one instead;\n}\n```\n"
