    \ of function ***myCastle()*** when we call it?\n\nvar f = 33;\n\nvar myCastle\
    \ = function() {\n\n var f = \"Santarem\";\n\n return f;\n\n};\n\nmyCastle();\n\
    \n4- How would you rewrite the script to output the outer variable f, instead\
    \ of the inner variable f?\n\n5- Which object acts as the parent for all global\
    \ variables in a normal web page?\n\n6- What data structure in JavaScript has\
    \ the capability of wrapping its elements in a private manner?\n\n*   Answers\
    \ and further explanation can be found here:\n\n    [forum](http://jsplain.com/javascript/index.php/Thread/28-Lab-12b/)\
    \ | bit.ly/1rm2pUg.\n\n### Part C: Find and replace a word in a string\n\nThe\
    \ goal for this project is to create a mechanism that finds a word in a paragraph\
    \ and replaces it with another word. The idea is to replace *brown* with *red*\
    \ on the following paragraph:\n\n\"The quick **brown** fox jumps over the lazy\
    \ dog.\"\n\nThe tools to use are as follows:\n\n*   Several variable names to\
    \ be used as helpers:\n\n    ***paragraph*** – assigned to the original paragraph.\n\
    \n    *tempArray* – assigned to the result of converting the string to array.\n\
    \n    ***oldWord*** – assigned to the word \"brown\", the one we search for in\
    \ order to replace.\n\n    *newWord* – assigned to the word \"red\", the one we\
    \ want to use as a replacement.\n\n*   ***split()*** which converts the string\
    \ into an array of separate words.\n\n    The result of splitting the string will\
    \ be assigned to an array called ***tempArray***.\n\n    (The reason for converting\
    \ the string sentence into an array of words is so that we can target the desired\
    \ word to replace).\n\n*   A ***for* loop**. The loop will traverse the array\
    \ in order to find the targeted word and replace it.\n\n*   ***join()*** which\
    \ will later reconvert the array back to string.\n\nWe first split into array,\
    \ then search and replace, then convert back to string and assign the result back\
    \ to the variable *paragraph*.\n\nFinally we use ***console.log*** which prints\
    \ variable *paragraph* displaying the end result.\n\nIt may sound complicated\
    \ but it becomes easier after doing it the first time.\n\nHere’s a recipe guide:\n\
    \nDeclare the original string variable.\n\nConvert the variable into individual\
    \ words.\n\nIntroduce the word that needs to be found.\n\nIntroduce the new word\
    \ to replace the existing word\n\nIterate over the array to find and to replace\
    \ the word\n\nReconvert the modified array to string by assigning it to the original\
    \ variable\n\nDisplay your results\n\nTake your time to think about it. Should\
    \ you need an editor use *jsbeautifier.org* to write your script. Then paste it\
    \ onto the Console for testing purposes.\n\n*   For a quick peek or further explanation\
    \ and my own final version of this project please refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/29-Lab-12-c/)\
    \ | bit.ly/1pqFAcC.\n\n    Or just the [raw file](http://icontemp.com/jpl/lab12c.txt)\
    \ | bit.ly/1uVMHjS.\n\n### Part D: Using a function to save and recall our code\n\
    \nGreat job! Now let’s take it one step further:\n\nLet’s save the script in a\
    \ function called ***findReplace***.\n\nThe idea is to convert both variables\
    \ *oldWord* and *newWord* into input parameters, instead of declaring them in\
    \ the script like we’ve done before. This makes our search and replace more flexible\
    \ because from this point on we can search for any word and replace it with any\
    \ other word we want.\n\nUse either choice of function style:\n\nfunction findReplace\
    \ () { }\n\n*or*\n\nvar findReplace = function() { };\n\nI will use the first\
    \ option but either one will be fine.\n\nDon’t forget to include the input parameters.\n\
    \nOnce you’re done, call the function by choosing any word and replacing it with\
    \ any other word of your choice.\n\n**Examples:**\n\nfindReplace(\"brown\", \"\
    red\");\n\nfindReplace(\"quick\", \"slow\");\n\nfindReplace(\"dog\", \"cat\");\
    \  ... you will have a problem with this one because of the dot at the end of\
    \ the paragraph.\n\n*   For a quick peek or further explanation and my own final\
    \ version of this project please refer to the\n\n    [forum board](http://jsplain.com/javascript/index.php/Thread/30-Lab-12-d/)\
    \ | bit.ly/1rtG4EK.\n\n    or just the [raw file](http://icontemp.com/jpl/lab12d.txt)\
    \ | bit.ly/1ypiKg3\n\n### Part E: Making the search and replace more portable\n\
    \nOn the previous project we created an automatic find and replace script, but\
    \ it only worked with variable ***paragraph***. It would be nice to have a portable\
    \ function so that we can apply it to other variables or even to loose strings.\n\
    \nAt this point it should be obvious the importance of using functions to create\
    \ methods that can be reused in more than one application.\n\nIn order to make\
    \ the project more portable we need to add a *third input parameter*, one which\
    \ represents the targeted variable or just any string value for that matter.\n\
    \n1- All we have to do is to add a third input parameter and replace all the *paragraph*\
    \ instance names from inside of the function, to this new input parameter’s name.\n\
    \nI have called my input parameter ***data***.\n\n*   For a quick peek or further\
    \ explanation and my own final version of this project please refer to the\n\n\
    \    [forum board](http://jsplain.com/javascript/index.php/Thread/31-Lab-12-e/)\
    \ | bit.ly/1mqMRhT.\n\n    Or just the  [raw file](http://icontemp.com/jpl/lab12e.txt).\
    \ | bit.ly/1uijwc9.\n\nIf you can’t think of an example to test your scrip please\
    \ look at the forum board for two samples of test data. You should find them right\
    \ below the script we have just discussed.\n\np.s. *I’m so happy that you have\
    \ made it this far, thank you*!\n\nWe’re almost done with the JavaScript lectures\
    \ and exercises. Then, JSON and AngularJS will be optional studies that you can\
    \ tackle later on if you need to take a break. However, please keep this truth\
    \ in check: “out of sight, out of mind”. You will forget if you don’t keep practicing\
    \ regularly, then you will have to read the book from the beginning again.\n\n\
    ## 3.5 More branching techniques\n\n### The switch\n\nSo far we have learned about\
    \ the ***if()***, possible ***else if()*** and optional ***else*** conditional\
    \ statements, right?\n\nif(true) {\n\n// do this;\n\n} else if(true) {\n\n// do\
    \ that;\n\n} else {\n\n// do this one instead;\n\n}"
