    - The location of the last item of an array is always the length of the `array
    minus 1`. Do not memorize this fact, just understand that locations start counting
    from zero. This is great to know if we ever need to manually add an item to the
    array. As for automatically adding new items, we may use `push()` to insert them
    at the end, or `unshift()` to place them at the beginning, or if we want to insert
    an item in a specific location we can use `splice()`. On the other hand, to delete
    items we use `pop()` if the item is at the end, `shift()` if at the beginning,
    and the versatile `splice()` if we want to delete an item from a specific location.


    - As for scanning arrays, we traverse the array with a `for loop` in order to
    print its contents, and we also know that the JavaScript library has many other
    methods we can use for further manipulating arrays. Some of these methods were
    covered in this book, and the other more advanced methods may be read on my “[explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)”
    eBook.


    In this topic we are going to work with `unordered lists`.


    In unordered lists all item locations are labeled with a `string` value.


    We call them `unordered lists` because each pocket is literally labeled. This
    label can be a single character, or a word, or even a number (however if you use
    numbers as labels, know that they are not sequential and they are treated as characters
    as opposed to arrays which are always numerically sequential).


    In truth, the `unordered list` is unordered because JavaScript `maps` the label
    to the item. In the end, these are all arrays, even if such characteristic becomes
    hidden from the programmer.


    In an official array we don’t have to name the address or pocket label because
    it is numerically assumed, like for example:


    ```

    var myArray = ["duck", "lettuce", "sapphire"];

    ```


    For `unordered` lists we need to label the location of the item, I mean the pocket
    where the item is stored. That can be advantageous for certain applications:


    ```

    var x = {"animal": "duck", "vegetable": "lettuce", "mineral": "sapphire"};

    ```


    Notice how the assignment to each item is made like: `"animal": "duck"`,


    `"animal"` is the label and `"duck"` is the value.


    There is a `colon `:` separating the two, rather than an `=`.


    We use the `curly braces` to wrap the list, as opposed to the `square braces`
    which are reserved to `arrays`.


    - **Please note:** The quotes wrapping the label are optional, but not the quotes
    wrapping the string value, those are mandatory because in our example we are using
    string values.


    More about that later.


    ### Hashes, objects, associative arrays, unordered lists


    In JavaScript all these names are synonymous. Each programming language uses a
    different terminology to represent unordered lists.


    *Java* uses `HashMap`, `HashTable`.


    *C#* uses `HashTable`, `Dictionary`.


    *Python* uses `dict`.


    *Ruby* uses `Hash`.


    *Object-c* uses `NSDictionary`.


    *C++* uses `std::unordered_map`.


    **And *JavaScript* uses *object***. Did I just say object? Personally I don’t
    like the name designation because, in JavaScript, almost everything is an object.
    Arrays are also objects, and so are functions. However, the name of object in
    JavaScript has become synonymous with `unordered lists`.


    Another popular name is `associative arrays`. Some languages actually have associative
    arrays. In JavaScript an associative array which is an array with `key-value`
    pair association, is called an `object`. However the reason why an associative
    array is often called an object is because objects in the sense of the term are
    made with associative arrays. As far as JavaScript is concerned, all these names
    are `unordered lists` and we call them `objects`.


    Hopefully this clears up some of the confusion by knowing that **they all mean
    the same thing**, but please keep in mind that things are not that simple, there
    is a lot more to this subject than what this book calls for.


    - From now on and for simplicity’s sake, we are going to call any `key-value pair
    structure` an `object`.


    ### Creating an object


    An object is a collection of values.


    These values can be a mix of anything: strings, numbers, Boolean expressions,
    variables, arrays, functions and (often) other similar objects.


    JavaScript is very versatile in that aspect. The size of a list of values can
    shrink or expand at any time. We will see how to do all these, like creating,
    editing, adding new items, deleting items, searching and printing items in the
    next few pages. Most of these techniques have already been introduced to you and
    you will remember them as we approach each one of them.


    **Declaring an object and assigning values at the same time:**


    ```

    var x = {"animal": "duck", "vegetable": "lettuce", "mineral": "sapphire"};

    ```


    ***What do we have above?***


    We have a variable named `x` that points to a data structure of type `object`.
    We know it is an object because of the curly braces wrapping the data: `{ }`.


    The variable `x` and the data structure in itself are in separate (and different)
    parts of the memory. They are independent of each other. This memory independence
    also happens for `arrays` and `functions`, but there is no separation of variable
    name and value when we declare a simple `string` or a `numeric` variable; those
    reside on the same location as the variable name. We will cover a bit more about
    it later.


    ### Why should we wrap key labels in double?


    Normally, when we create an object we don’t really have to wrap the key portion
    of a property in quotes and you may see more often that way (no quotes). Example:


    ```

    var example = {"animal": "duck", "vegetable": "lettuce"};

    ```


    As you see, there are no quotes for `animal` and for `vegetable` in the object
    declaration.


    However, wrapping key labels with `double` quotes is being used more and in modern
    technology, thanks to the advent of [JSON](https://en.wikipedia.org/wiki/Json)
    which is being applied everywhere. We will cover the basics of JSON on a later
    chapter.


    So if you are beginning to learn object notation, you might as well develop the
    habit of double quoting keys when you declare an object. The above example should
    then look like the following:


    ```

    var example = {"animal": "duck", "vegetable": "lettuce"};

    ```


    Do it as you wish but please keep this concept in mind.


    ### Assigning new key-value pairs to objects


    Let’s do some lab work...


    1- On your Console, create a new and empty object:


    ```

    var crazyList = { };

    ```


    Do you still remember how to check the type of a variable with `typeof` (covered
    on *Lab work 1*)?


    2- Let’s check the `typeof` `crazyList`:


    ```

    typeof crazyList;

    ```


    It displays "*object*". We have an empty object.


    3- Now we add some values by assigning them to key labels:


    ```

    crazyList["flower"] = "daisy";

    ```


    Object crazyList now contains `{flower: "daisy"}`.


    4- Let’s add another key-value pair:


    ```

    crazyList["drink"] = "water";

    ```


    crazyList now has two values:


    `{flower: "daisy", drink: "water"}`

