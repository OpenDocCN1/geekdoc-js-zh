    ## 3- Copy your script from your own editor `or from my own linked page` and paste
    it on the Console. Then press ENTER.


    If you get an error, recheck your code. Debugging is what programmers do best
    because that’s where they spend 90% of their time (see step 4 to learn how to
    repeat the execution on the Console).


    When the prompt appears, type `yes` without quotes. If your script is well constructed
    you should have the following printout on your Console:


    *Ok, let''s play!*


    To copy the code from my own website, click on the `2-page icon` located to the
    right of the code script.


    ## 4- To repeat the execution, `focus` your mouse on the Console and press the
    `Up Arrow`. That will take you up to the last executed script. From there, (you
    can edit it if you need to do so) and then press `Enter` to run it again.


    This time, answer `no` to the prompt question.


    You should get: `ok, goodbye!* as a response.


    ## 5- Did you notice how the `prompt()` takes you to the main browser but then
    you have to look back at the console for an answer?


    You could replace `console.log()` with `confirm()` or with `alert()` in order
    to also get your answer on the browser.


    Just for practicing purposes, change your first `console.log` to `confirm()` and
    your second `console.log()` to `alert()`. Don’t worry about this inconstancy,
    we are just practicing.


    Use the editor at `jsbeautifier` to write your script.


    Then test both `if, else` outcomes like we did on steps 3 and 4:


    ```javascript

    confirm("Ok, let''s play!");

    alert("ok, goodbye!");

    ```


    ### Reviewing if(), else


    Inside of an `if(){ do this stuff; }` parentheses, we include a condition. Keep
    in mind that it is not the condition itself that unlocks the code block: it is
    the truthiness of the `question` you write in there that unlocks the code.


    Examples:


    `if(10 === 10){}` <-- since 10 is the same as 10, JavaScript will evaluate the
    statement as `true` and it unlocks the next code block.


    `if(10 === "10"){}` <-- since 10 is a number and "10" is a `string`, JavaScript
    evaluates the statement as `false` and jumps over the next code block without
    executing it.


    `var x = 33; if(x){}` <-- since `x` has a value other than `0`, `undefined`, or
    `null`, the statement is `true`.


    `if(!x){}` <-- since `x` has a value other than `0`, `undefined`, or `null`, this
    statement is `false`.


    `var y = "yes";`


    `if(y === "yes"){}` <-- since the value of `y` is string `yes`, this statement
    is `true`.


    `if(y !== "yes"){}` <-- since the value of `y` is `yes`, this statement is `false`.


    `if(y === "no"){}` <-- since the value of `y` is `yes`, this statement is `false`.


    `if(y === "no" || y === "yes"){}` <-- since one of the statement is `true`, the
    statement is `true`.


    `if(y === "no" && y === "yes"){}` <-- this statement is `false` since one of the
    operands is `false`.


    ### What about else?


    `else` is optional. We can have an `if()` conditional statement all by itself.
    However, we can’t have an `else` by itself since `else` is just a catcher helper
    for when `if()` fails. In other words, the alternate of `if()`.


    ### Adding a second condition in the middle of if(), else


    Sometimes, an `if(), else,` is not enough to accommodate all the outcomes. In
    that case there is an intermediate statement and it takes a condition just like
    `if()` does. This intermediate conditional is called `else if()`.


    Here’s the basic syntax:


    ![](images/00002.jpeg)


    Fig 2


    ### How to physically write the braces in a conditional statement


    Notice the opening brace on line 1. This is the JavaScript common way of doing
    it. If you come from an older language such as `C`, you may be used to code the
    opening brace on the second line by itself. That is perfectly fine. Whichever
    way you choose to use just make sure you don’t mix styles.


    Also, the closing brace is always at the beginning of a line (example: lines 3,
    5 and 7). After the `if()` closing brace we may write the `else` on the same line,
    or the `else if`, when applicable, and finish the line with an `opening` curly
    brace (see line 3).


    The very final closing brace always stand on its own (line 7). That is common
    to all languages that use braces. A very popular mistake is to write the closing
    brace to the right of the last statement. That is very ugly and very difficult
    to troubleshoot.


    Sometimes you will find JavaScript conditionals without braces and it also works.
    However I do not recommend such practice because it leads to inconstancies and
    it may trigger an error sooner or later because the JavaScript interpreter adds
    semicolons automatically when it thinks they are missing, and the lack of a curly
    brace may trigger the interpreter to think that it has reached the end of a statement.
    Until you master this styling concept use `jsBeautifier` to style your code after
    you are done writing it.

