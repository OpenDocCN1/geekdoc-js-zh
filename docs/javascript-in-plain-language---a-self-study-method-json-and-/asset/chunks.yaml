- fmt: "\n**4- Call function `test2` and see the results for each one of these numbers:\
    \ 3,5,15,21:\n\n```\ntest2(3);\ntest2(5);\ntest2(15);\ntest2(21);\ntest2(11);\n\
    ``` etc.\n\nThe input parameter(s) of a function act as a temporary internal variable.\
    \ This is really useful because we can send data into a function to be processed.\
    \ That’s what happened during our `test2()` function calls.\n\nOnce we master\
    \ the basic syntax of a function we start to create some real cool stuff.\n\n\
    Functions may still be confusing for you. I will cover all the basics as we code\
    \ along. It is not a difficult subject but it needs to be approached in the proper\
    \ sequence.\n\n### What is a function call?\n\nA picture is worth a gazillion\
    \ words:\n\n![](images/00008.jpeg)\n\nFig 8 (See original file: [here](http://jsplain.com/javascript/index.php/Thread/12-Function-Call/).\
    \ ) bit.ly/1raw6pT\n\nLooking at figure 8, on the bottom left side we are calling\
    \ function `addTen()` and passing an argument `data` of 4 to the function parameter\
    \ `n`.\n\nThen 4 will become the temporary value for parameter `n`, and the sum\
    \ of `10 + 4` is executed.\n\nFinally, the `return` mechanism exports the result\
    \ which is the numeric value of 14.\n\nWe could have used `console.log(n + 10)`\
    \ but the `console.log` would display the value on the screen without exporting\
    \ it out of the function. In other words, we would not be able to use the number\
    \ 14 outside of the function because `console.log()` does not export data, it\
    \ actually displays everything as a `string` value on the screen, even if it looks\
    \ like a number.\n\nSo, `return` is a very important mechanism in functions. Actually\
    \ it is native to functions. We cannot use the command `return` outside of functions.\
    \ JavaScript will not allow it.\n\n### What is the purpose of return?\n\nThe purpose\
    \ of `return` is twofold:\n\na) To export data from inside of a function in its\
    \ raw form.\n\nb) To stop and end the function call. This is important. The return\
    \ mechanism acts as a break and ends the act of calling a function. Anything written\
    \ in the function below the `return` statement will not be processed because JavaScript\
    \ exits the function as it returns. After the function returns, the function call\
    \ is wiped out from the working memory. You don’t have to be concerned with this\
    \ at this moment but it is good to know that function calls don’t linger in memory\
    \ forever. They free up space by getting out of the way. This could be a third\
    \ reason to include your code inside of a function: memory efficiency.\n\n###\
    \ What happens to the data when a function returns?\n\nIf we want to reuse the\
    \ data for further processing, we need to catch the returned data. Otherwise it\
    \ just gets lost in space.\n\n*How do we catch the data being returned from a\
    \ function?*\n\nOne way to catch it is to assign the returned value to a variable.\
    \ In other words, assign the `function call` to a variable.\n\nIn the example\
    \ of figure 8 (see the link below the image), instead of just calling the function:\n\
    \n```\naddTen(4);\n```\n\nWe could assign it to some variable:\n\n```\nvar y =\
    \ addTen(4);\n```\n\nNow `y` holds the value 14. The function call gets wiped\
    \ out of memory but the value is retained by variable `y`.\n\n- **In summary**,\
    \ data coming from a function needs to be `returned` and assigned to a variable\
    \ if we need to use it further down the script. When we output data from a function\
    \ via a `console.log()`, `alert()`, `prompt()` or `confirm()`, we are just displaying\
    \ it, not retaining it.\n\n## 2.4 Lab work 6\n\nReady for more lab work?\n\n###\
    \ Create a program to convert Fahrenheit to Celsius\n\nOperator [precedence](http://en.wikipedia.org/wiki/Order_of_operations)\
    \ determines the order in which operators are evaluated. JavaScript precedence\
    \ is close to math precedence:\n\n- Parentheses are evaluated before multiplication\
    \ or division,\n  and multiplication or division are evaluated before subtraction\
    \ or addition.\n  All being equal, operands are evaluated from left to right and\
    \ from inside of parentheses out.\n  ...nothing to memorize, just practice a lot.\n\
    \nThe following is the formula to convert Fahrenheit to Celsius:\n\nDeduct 32\
    \ from the variable `F`,\n\nthen multiply the result by 5,\n\nthen divide the\
    \ new result by 9.\n\nWe need to include the subtraction within parentheses so\
    \ that it is done first. Then write the multiplication next so that it is done\
    \ before the final division which should be placed on its right side. The formula\
    \ looks like this:\n\n`(f - 32) * 5 / 9`\n\nThat was the hard part. Now let’s\
