  trans: "\n敏捷的棕色狐狸跳过了那懒狗\n\n## 2- 声明一个名为 `langVersion` 的数组，包含以下元素：\n\n`english`,\
    \ `portuguese`, `spanish`。\n\n记住，由于这些名称已经声明为变量，因此我们不应该给它们加上引号，只需用逗号隔开即可。\n\n这个数组的目的是按顺序保存每个变量。我们难道不能直接使用变量而忽略数组吗？是的，可以的。然而，在大型程序中，这些变量将与其他许多变量一起保存，通过创建一个数组，我们列出了与语言翻译相关的变量，这些变量可以被进一步地操作、编辑、删除，甚至成为更大型语言组的一部分。当然，还有其他方法可以实现这一点，但现在我们正在练习数组，这是一项非常重要的练习。\n\
    \n## 3- 再声明一个名为 `sentence` 的变量，并赋值数值 `0`。\n\n该变量将用于存储我们从数组所有语言中选择的那个语言的索引位置。\n\
    \n我们之所以给这个变量赋值为 0，是为了提前告诉 JavaScript 该变量将是数值类型。实际上，JavaScript 会根据需要更改值的类型，但声明我们的意图是一个良好的习惯，即使这种意图可能只是帮助检查代码的人类，而不是帮助\
    \ JavaScript 处理它。\n\n(指向步骤 1, 2, 3 的方便复制/粘贴链接：[原始文件](http://icontemp.com/jpl/fox1.txt)\
    \ | bit.ly/1Dt7fnS )\n\n## 4- 在你当前代码下方，创建一个名为 `show` 的函数。\n\n该函数的作用是根据我们在调用函数时选择的语言来显示正确的句子。句子将从语言数组中选取。\n\
    \n```\nfunction show() {}\n```\n\n## 5- 为函数引入一个名为 `language` 的输入参数。\n\n## 6- 在函数体第\
    \ 1 行，将已声明的变量 `sentence` 重新赋值为所选语言的位置索引。我们通过使用 `indexOf()` 来查找位置，如下：\n\n```\n\
    sentence = langVersion.indexOf(language);\n```\n\n稍后，当我们调用函数时（例如 `show(portugese)`），参数\
    \ `language` 将被传递给函数的任何语言参数所替换。`indexOf(language)` 将为变量 `sentence` 分配该语言正确的数组地址。\n\
    \n## 7- 最后，在下一行且仍在函数体内部，编写一个 `console.log` 来在有人调用函数时显示所选变量的内容：\n\n```\nconsole.log(langVersion[sentence]);\n\
    ```\n\n从步骤 6 中我们知道变量 `sentence` 是数组中某个项的位置索引。\n\n## 8- 将你的代码粘贴到控制台（Console）并调用函数\
    \ `show()` 来测试每个句子\n\n（注意：如果你遇到错误，请感谢上天提供了调试的机会，因为这是一个非常好的习惯）：\n\n```\nshow(english);\n\
    show(portugese);\nshow(spanish);\n```\n\n你可能会在输出句子后看到屏幕显示 `undefined`。这在测试控制台中是正常的。它只是告诉我们\
    \ `show()` 函数没有显式地返回任何内容，因此它会自动返回 `undefined`，因为 JavaScript 函数总是返回某些内容的。\n\n通过以下链接查看最终版本：\n\
    \n[论坛](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/) | [原始文本](http://icontemp.com/jpl/fox2.txt)。\n\
    \nbit.ly/1r0Ho2D | bit.ly/1mCJogu\n\n### 备注：\n\n*   如果某些地方不清楚，不要继续进行，直到你有意识地提出问题。停下来，退后一步，尝试观察每一行代码试图做什么。尝试\
    \ 100 次。\n*   另一方面，理解是分层的，但在我们完全理解某些概念之前，我们需要意识地确保自己能够继续。当我们正确提问时，很多时候答案就会显而易见。\n\
    \n### 向数组添加法语\n\n突然有人抱怨没有“敏捷的棕色狐狸”的法语版本。\n\n## 1- 如果你仍然打开控制台，在提示符处添加一个变量 `french`：\n\
    \n```\nvar french =\n```\n\n不要担心在脚本的最底部。我们只是在测试。注意 `french` 是小写的。变量以小写开头。\n\n\
    ## 2- 将以下行赋值给变量 `french`：\n\nLeLeard brun rapide saute par dessus le chien paresseux*\"\
    \n\n[原始文件](http://icontemp.com/jpl/fox3.txt)。 | bit.ly/1wGvYQS。\n\n## 3- 现在，使用\
    \ `push()` 方法将变量 `french` 插入数组 `langVersion` 中。\n\n```\nlangVersion.push(french);\n\
    ```\n\n## 4- 通过调用来测试脚本\n\n```\nshow(french);\n```\n\n*   点击此处查看最终版本：\n    [论坛](http://jsplain.com/javascript/index.php/Thread/18-Lab-10/)\
    \ | [原始文本](http://icontemp.com/jpl/fox2.txt)。\n\n### 输出数组\n\n你还记得如何创建 *for* 循环吗？在这个项目中，我们将\
    \ *console.log* 数组元素。\n\n## 1- 创建一个 *for* 循环来打印：我将使用常用的标识 `i` 作为计数器，并使用 `langVersion.length`\
    \ 作为限制。\n\n## 2- 在循环体内，*console.log* 数组的内容。\n\n这是通过动态访问 `langVersion[i]` 实现的，随着循环的重复而进行。\n"
