  trans: "\n`while loop` 循环的一个流行例子是扫描计算机键盘的机制。`while loop` 会持续读取键盘的输入，直到它接收到某个按键的信号，该信号反过来触发另一个机制。\n\
    \n`while` 循环的设计如下：\n\n```javascript\nwhile(this Boolean expression is true){\n\
    \  // do this stuff;\n  // something to change the condition to false in order\
    \ to end the loop;\n}\n```\n\n在某个操作触发布尔值 `false` 之前，`while loop` 将一直运行。\n\n我们可以在之前的颜色描述游戏中使用这个\
    \ `while` 循环，让 `switch` 无限运行，直到用户点击 `confirm()` 的 `cancel` 按钮。这样一来，我们就不需要再次调用该函数，我们要做的就是不断让用户输入他喜欢的颜色，直到用户按下\
    \ `cancel` 按钮。\n\n**那么我们在哪里实现从布尔 `true` 到布尔 `false` 的转换呢？**\n\n我们在每个 `case` 中实现它，因为只有对应的\
    \ `case` 会生效。当用户确认某个 `case` 的输出消息时，如果他们想退出游戏，也有机会点击 `cancel`。在用户按下 `cancel` 之前，游戏将永远进行下去。\n\
    \n请看下面的图来理解我的意思：\n\n![](img/00017.jpeg)\n\n图 17\n\n在第 3 行，我们将整个 `switch` 机制封装在一个\
    \ `while` 循环内部。\n\n当 `replay` 为 `true`（这是它的初始状态）时，`switch` 将运行，循环将不断重启 `switch`，直到我们按下\
    \ `Cancel`（取消）。按下 `ENTER` 等同于按下 `OK`，这意味着运行另一个周期。最终，我们玩腻了这个游戏，点击了确认框上的 `Cancel`\
    \ 选项，这将触发 JavaScript 退出循环。\n\n注意变量 `replay` 的值（它最初是一个布尔值 `true`）在每次提示输出消息时都会被更新。这为用户提供了退出游戏的机会。\n\
    \n它看起来比我们之前做的脚本更专业，如果你对创建游戏感兴趣，这会变得非常有用。\n\n*   在你编写了你自己的版本后，可以将其与我的版本在[论坛板块](http://jsplain.com/javascript/index.php/Thread/35-Lab-13d/)\
    \ | bit.ly/1DwVNYo 进行对比。\n*   或者直接查看[原始文件](http://icontemp.com/jpl/colors4.txt)\
    \ | bit.ly/1sWgeWf\n\n# 第四部分：进入第三领域\n\n**请注意：**\n\n书变得越来越长了！如果你想休息一下，现在是时候了，因为我们接下来要涵盖的内容是补充性的，而不是\
    \ JavaScript 语法 `core` 的一部分。\n\n另一方面，如果你急着学习 AngularJS，可以安全地暂时跳过 JSON，直接进入第五部分：击败龙。\n\
    \nJSON 是一个必须了解的话题，因为你迟早会用到它，但在我们在第五部分涵盖的内容中不需要它。\n\n希望你的这段时间收获颇丰，我非常感谢你对这些材料的投入和信任。\n\
    \n[Tony de Araujo](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\n\n## 4.1\
    \ 关于本节\n\n我们已经涵盖了 JavaScript 的很多领域，还有很多内容可以写。然而，一次性全部写完并不是一个好主意，因为这会降低效率并违背初衷。这就是为什么我将\
    \ JavaScript 分成了几个不同的小册：给读者时间来消化每个出版物中涵盖的所有数据。持续的练习、重复以及有意识的扩展似乎是更好的方法。\n\n[JavaScript\
    \ Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ 详细地介绍了每个 JavaScript 库方法，并提供了更高级的概念练习。如果你完成了到目前为止的所有练习，你应该已经完全准备好应对另一卷书了。\n\n\
    另一个非常流行且廉价的练习用电子书是 [Draw Six Lucky Numbers](http://www.amazon.com/Small-Projects-Learn-JavaScript-Mastering-ebook/dp/B00H4P987A/)，它涵盖了循环、随机数并复习了函数和数组。这是一个适合周日下午完成的快速项目。\n\
    \n**现在我们到了一个十字路口。**\n\n这本书的剩余部分将介绍两个每个 JavaScript 中高级高级程序员都应该掌握的热门技术：\n\n**JSON**\
    \ （**J**avaScript **O**bject **N**otation）是一种数据格式化方法，使其独立于机器。这种格式在许多方面正在取代 XML，并被用于现代\
    \ Web 编程。从某种意义上说，我从书开头就开始介绍它，所以这些材料对你来说应该熟悉，因此这部分将会很短。\n\n最后一个涵盖区域关于 Google 的框架库\
    \ `AngularJS`，它是基于 JavaScript 的。\n\n这个库正在改变我们构建网站的方式，尽管仍处于婴儿阶段，但它已经产生了持久的影响，当你学习它时就会发现原因。当你完成接几章节后，你将以简单且全面的方式将动态数据实现到基础网页中。\n\
    \n请记住，我只是介绍了 `AngularJS`，这并不是一本关于它的完整书籍，因为这个主题跨越了几卷。我希望通过编写这些材料，赋予你进一步研究 `AngularJS`\
    \ 的能力。这些信息将解锁我认为的进入 JSJS 最困难的部分——即第一步。通过所给出的练习和解释，你应该能够轻松克服这第一个障碍。\n\n## 4.2 JSON\
    \ 简介\n\nJavaScript 对象表示法，`JSON`（读作 J SON）是一种开放标准格式，它使用人类可读的文本来传输由键值对（JavaScript\
    \ 对象）组成的数据对象。在传输服务器和 Web 之间的数据方面，它已成为 XML 的替代技术。“替代”一词可能已经过时了，因为现在 JSON 是 Web\
    \ 服务的首选方法。\n\n我在此处引入 JSON 是因为在写作期间，如果人们想构建现代 Web 页面和 Web 应用，JSON 已成为必须掌握的 JavaScript\
    \ 子集。它现在应该是任何 Web 素养课程的一部分。\n\n`JSON` 如此受欢迎，以至于其他语言现在都在自己的词汇中实现它。\n\n好消息是，在整本书中你已经为这项技术做了准备，这只是意识到它的存在的问题。\n\
    \nJSON 格式在语法上与我们创建列表相同，无论是作为数组的数值，还是像对象那样的键值对。我们还可以结合两种格式来创建更复杂的 JSON 数据结构。\n\n\
    以下是用 JSON 格式编写的数据集：\n\n```json\n{\n  \"firstName\": \"Tony\",\n  \"lastName\"\
    : \"deAraujo\",\n  \"age\": 99\n}\n```\n\n或者我们也可以有一个数组：\n\n```json\n[1, \"hello\"\
    , 33]\n```\n\n**请注意：** 如果你计划将数组转换为 JSON 格式，请避免使用混合数组数据类型，比如我刚刚展示给你的数组。这是因为 JSON\
    \ 应该是一种**语言中立**的数据交换协议，许多编程语言不允许混合数组（即包含混合值类型的数组），这会导致混淆。以下内容是可以的，因为数字被视为字符串（对比我之前的示例）：\n\
    \n```json\n[\"1\", \"hello\", \"33\"]\n```\n\n回到我们上面的第一个例子，注意对 JSON 对象或数组没有变量赋值。对象的\
    \ JSON 部分是能够被无缝导出到其他系统中的部分。\n\n在以 JSON 格式编写内容时，我们必须用双引号将键（key）括起来。由于我们从一开始就使用双引号，我们应该不会遇到这个问题。\n\
    \n如果键没有用双引号括，JSON 将抛出错误。单引号不起作用。\n"
