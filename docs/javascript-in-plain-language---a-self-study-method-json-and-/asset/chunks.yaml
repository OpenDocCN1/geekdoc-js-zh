    On `line 1` I have declared variable `x` with the value of 15.


    On `line 2` the `&&` logical operator is used to ask JavaScript if both left and
    right operands are `true`. Notice how each operand has to be explicit. Many new
    programmers tend to write it this way: `x % 3 && 5 === 0`, JavaScript will not
    understand this syntax. An individual Boolean condition for each case is necessary.


    We could wrap each operand in parentheses to make it easier in the human eye:


    ```javascript

    if((x % 3 === 0)) && ((x % 5 === 0))){

    ```


    If you do it this way, be sure to close all parentheses. There is an even number
    of them.


    On `line 3`, I used `console.log` to print the appropriate message.


    3- Test your script to look for errors and to make sure you get the correct output.
    If you wish, reassign `x` to another number, like for example 14, and run the
    conditional statement again. You can run it by using the `Up Arrow key` until
    you get to the script, edit the variable `x` and press ENTER. When `x` is 14 you
    will not get any output which means that JavaScript jumped over the code block
    because the condition was no longer `true`. In that case you will see an `undefined`
    message on the Console. That is ok, it is just an automatic echo from the Console
    and it does not have any influence on your script.


    **Note:** Subdividing our code project into `little test steps` is a good practice.
    There is nothing worse than spending an hour coding a script only to realize in
    the end that it does not work.


    4- Now we are ready to create our first `else if()` statement.


    Which one of these conditions should we do first:


    the one that checks for divisibility by 3,


    or the one checking divisibility by 5?


    At this point it does not matter since we have resolved the ambiguity of being
    divisible by both, but I would do it in numerical sequence writing the 3 condition
    first. See lines 4 through 6 on the image below:


    ![](images/00004.jpeg)


    Fig 4 (See original file: [here](http://jsplain.com/javascript/index.php/Thread/9-branching2/)
    ) bit.ly/1uoc1N8


    On `line 4` notice how `else if` is coded to the right of the brace that closes
    the previous `if()`. This is not mandatory but it looks more professional.


    On `line 6` the curly brace closes the `else if()` statement.


    5- Paste your script onto the Console and press ENTER to run it. You should still
    get the first output because variable `x` is still 15 which makes the first condition
    `true`.


    In order to test the second condition, reassign variable `x` to `9`. To change
    the value of variable `x` press the `Up Arrow key` until you see the whole script,
    then place your cursor at the variable declaration, change the value to 9 and
    press ENTER.


    Now we should get the second output: `x is divisible by 3` because 9 is divisible
    by 3.


    6- It’s time to write the final `else if` and also the catcher `else` at the very
    end. See the next image:


    ![](images/00005.jpeg)


    Fig 5 (See original file: [here](http://jsplain.com/javascript/index.php/Thread/9-branching2/)
    ) bit.ly/1uoc1N8


    On `line 6` we can see the second `else if()` condition.


    On `line 8`, `else` finally catches anything that is not divisible by 3 or divisible
    by 5. No condition is necessary since this is the “all else” optional outcome.
    JavaScript will throw an error if we ever write a condition for `else`.


    On `line 10` lies the last closing brace which closes the `else` statement.


    Don’t you feel like you are getting there? I hope so. `Conditional branching`
    is an important part of creating real programs.


    We will see how to code this script without using `else if()` in a bit, just to
    illustrate another important concept: nested conditionals. For now, let’s just
    take a break by doing something else.


    ## 2.3 The anatomy of a function


    On the last exercise we kept pressing the `Up Arrow` to recall the program in
    order to test it.


    What if we didn’t have an Up Arrow? We would have to write the script again and
    again, correct?


    This is where functions come handy. *Stop!* Don’t think of math when I mention
    functions in JavaScript. Think of `functionality`. In JavaScript functions are
    containers of program routines. We could have saved our `if()`, `else` script
    in a function and just recall it by `calling the function`. That’s one word, versus
    10 lines of text.


    ### Preliminary things to know about a function


    a) A function is a closed container like the blue rectangle in the picture seen
    below.


    b) To feed data into a function in order to be processed, we need one or more
    `input` parameters.


    c) To `export` data from a function in order to reuse it, we need to implement
    an interface called `return`, or alternatively assign some outer variable to the
    new result.


    ![](images/00006.jpeg)


    Fig 6


    ### Scripting a function


    A representation of a function goes like this:


    ```javascript

    function funcName() { stuff to do; }

    ```


    The representation above does not take any input, it just does stuff.


    To create a function that takes input parameter, we need:

    ```javascript

    function funcName(inputParameter) { stuff to do; }

    ```


    When we say to `call the function` it means to write the function name and attach
    a pair of parentheses:


    ```javascript

    funcName();

    ```


    Or, if the function has `argument` we must include:

    ```javascript

    funcName(123);

    ```

    when `123` is a number.


    or

    ```javascript

    funcName("Tony");

    ```

    when `Tony` is a string.


    Here’s a function arbitrarily named `sizeUp` that converts a string value into
    uppercase:


    ```javascript

    function sizeUp(x){console.log(x.toUpperCase());}

    ```

    Here, `x` is the input parameter.


    1- Calling the function:

    ```javascript

    sizeUp("red blue");

    ```

    It displays `RED WHITE BLUE`.

