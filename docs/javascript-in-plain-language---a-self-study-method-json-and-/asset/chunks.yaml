  raw: '**x++**  *or*  **x = x +1**


    Since  x++ is the last expression to be evaluated, the semicolon is not necessary.
    Actually it is undesirable since it will trigger an error, preventing JavaScript
    from running the code block because it thinks it is at the end of the *for loop*.
    The first semicolon after *x++* should be at the end of the first executable statement
    inside of the body code block.


    Once JavaScript runs the loop the first time, it returns to the form for a second
    evaluation. The second evaluation will be as follows:


    *(For x starting at one; and for x less than 5; increment x) { execute this code
    }*.


    On the second iteration x is 1 but still less than 5 and therefore the code block
    is executed again, and x is incremented again at the end. And so on until x becomes
    5.


    ***Let’s create a simple for loop to see how it works***.


    The most common name for the temporary variable to be used as x is ***i***. Perhaps
    the reason is because it reminds us of the word *index*. So let’s use the classic
    name *i* instead of x:


    for(var i = 0; i < 5; i++)


    That is the header form which means:


    *for this declared  variable **i** which starts with the value of zero; as long
    as **i** is less than five; increment i by 1 after  each loop cycle*.


    On line 2 we include the executable instructions in the code block. These instructions
    will be repeated 5 times by JavaScript:


    The following image illustrates the concept:


    ![](images/00010.jpeg)


    Fig 10


    *   Please note: If you code this loop and paste it onto your console you may
    have a one line result with a prefix of (5) telling you that the Console ran it
    5 times. This is normal behavior of Consoles. They don’t usually repeat the same
    output more than once in order to save display real estate, they just tell you
    how many times the loop ran with it, but in real life you would get five lines
    displayed. However, if the print is different for each time, then the Console
    displays all the 5 iterations separately.


    To see a real display of a loop at work, replace *console.log("Say hi to Mary!");*
    with


    **console.log(i);**


    Now it prints the value of variable *i* in each of the loop repetitions and since
    the output is different each time, the Console must display each one of the iterations.


    If you want a more presentable output you can try this one:


    console.log("the value of i is now  " + i);


    And you should get:


    *the value of i is now 0


    the value of i is now 1


    the value of i is now 2


    the value of i is now 3


    the value of i is now 4*


    It displays 0 through 4 because the count of ***i*** started at 0 and the fifth
    time is 4\. This is ok, it still loops 5 times. However, if your intention is
    to display 1 through 5, then make *i* equals 1 from the start, instead of from
    zero.


    ## 2.7 Looping over a string of characters


    Do you still remember *bracket* notation and *dot* notation?


    I introduced it on Part One, in the chapter ***Manipulating variable data***.


    Let’s review and expand a bit more about the topic.


    I’m going to declare variable ***x*** with "orange" as the string value:


    **var x = "orange";**


    The value "orange" is a collection of sequential characters and each character
    has a location number starting at zero, like o is zero, *r* is one, *a* is two,
    *n* is three, etc.


     We can use *bracket notation* to find the character data in any location of the
    string:


    **x[location Number];** <-- it gives us the value inside of the location.


    Example:


    **x[2];**


    It will display character "***a***" which is the third character and position
    2 (counting from zero)


    I can’t use *dot notation* here because *dot notation* does not accept numbers
    or symbols:


    x.2 *<--* this will give me an error.


    **What can we do with this bracket notation syntax?**


    Bracket notation allows us to address a specific character on the string value.


    Here’s an example of displaying character ***g*** from variable x by sending *x[4]*
    via a console.log:


    **console.log(x[4]);**


    Here’s another example: characters ***ge***:


    **console.log(x[4] + x[5]);**


    So with *bracket notation* we can probe into a string of characters and fetch
    the contents of a location number.


    **What about dot notation?**


    Dot notation is good to grab properties of string values, such as length, remember?


    x.length; *or*  console.log(x.length);


    *   Dot syntax cannot be used with numbers, symbols, and names which values are
    not yet known when the code is being written. This prevents Dot syntax from being
    used in loops since the value in a loop will change for each loop cycle. So **when
    it comes to dynamic data, only Bracket syntax can be used**.


