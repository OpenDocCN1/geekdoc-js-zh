    - 数组最后一个项的位置始终是 `array` 长度减 1`。不需要死记这个事实，只需要理解位置是从零开始计数的。如果我们以后需要手动向数组添加项，了解这一点是非常有用的。至于自动添加新项，我们可以使用
    `push()` 将它们插入到末尾，或使用 `unshift()` 将它们置于开头，或者如果我们想在特定位置插入一个项，可以使用 `splice()`。另一方面，要删除项时，如果项在末尾则使用
    `pop()`，在开头则使用 `shift()`，如果我们想从特定位置删除项，则使用多能的 `splice()`。


    - 至于扫描数组，我们通过 `for loop` 遍历数组以打印其内容，我们也知道 JavaScript 库还有许多其他方法可以用来进一步处理数组。其中一些方法在这一本书中已经介绍过，而其他更高级的方法可以在我的“[详细解释](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)”电子书上查阅。


    在本主题中，我们将处理`无序列表（unordered lists）`。


    在无序列表中，所有项的位置都用一个 `string` 值进行标记。


    我们称它们为`无序列表`，是因为每个口袋实际上都贴了标签。这个标签可以是一个字符、一个单词，甚至是一个数字（但是，如果你使用数字作为标签，请记住它们不是连续的，而且它们被视为字符，而不是始终按数字顺序排列的数组）。


    事实上，`无序列表`之所以是无序的，是因为 JavaScript `maps` 将标签映射到项上。到最后，这些都是数组，即使这种特征对程序员来说是隐藏的。


    在正式数组中，我们不需要命名地址或口袋标签，因为这在数字上是假设的，例如：


    ```

    var myArray = ["duck", "lettuce", "sapphire"];

    ```


    对于`无序`列表，我们需要标记项的位置，我的意思是存储项的口袋。这对于某些应用是有益的：


    ```

    var x = {"animal": "duck", "vegetable": "lettuce", "mineral": "sapphire"};

    ```


    注意每个项的赋值是如何完成的：`"animal": "duck"`，


    `"animal"` 是标签，`"duck"` 是值。


    有一个冒号 `:` 分隔两者，而不是 `=`。


    我们使用`大括号（curly braces）`来包裹列表，而`方括号（square braces）`留给`数组`。


    - **请注意：** 包裹标签的引号是可选的，但包裹字符串值的引号不是可选的，因为在我们的示例中使用的是字符串值。


    关于这一点稍后会详细介绍。


    ### 哈希表、对象、关联数组、无序列表


    在 JavaScript 中，所有这些都是同义词。每种编程语言使用不同的术语来表示无序列表。


    *Java* 使用 `HashMap`、`HashTable`。


    *C#* 使用 `HashTable`、`Dictionary`。


    *Python* 使用 `dict`。


    *Ruby* 使用 `Hash`。


    *Object-c* 使用 `NSDictionary`。


    *C++* 使用 `std::unordered_map`。


    **而 *JavaScript* 使用 *object（对象）***。我刚刚说了 object 吗？我个人并不喜欢这个命名，因为在 JavaScript 中，几乎一切都是对象。数组也是对象，函数也是如此。然而，JavaScript
    中 object 的名称已成为`无序列表`的同义词。


    另一个流行的名称是`关联数组（associative arrays）`。某些语言实际上拥有关联数组。在 JavaScript 中，关联数组（即具有`key-value`对关联的数组）被称为
    `object`。然而，关联数组通常被称为对象的原因是，从术语上来说对象是由关联数组制成的。对于 JavaScript 而言，所有这些名称都是`无序列表`，我们称它们为`objects`。


    希望通过知道**它们都意味着同一个意思**可以消除一些困惑，但请记住，事情没那么简单，这个主题的内容比这本书所要求的要多得多。


    - 从现在起，为了简单起见，我们将任何`键值对结构（key-value pair structure）`称为 `object`。


    ### 创建对象


    对象是值的集合。


    这些值可以是任何种东西的混合：字符串、数字、布尔表达式、变量、数组、函数以及（通常）其他类似的对象。


    JavaScript 在这方面非常灵活。值列表的大小可以随时缩小或扩大。在接下来的几页中，我们将看到如何执行这些操作，如创建、编辑、添加新项、删除项、搜索和打印项。这些技术大部分已经向你介绍过了，当你接触其中每一个时，你会记起来的。


    **同时声明对象并赋值值：**


    ```

    var x = {"animal": "duck", "vegetable": "lettuce", "mineral": "sapphire"};

    ```


    ***上面这些是什么？***


    我们有一个名为 `x` 的变量，它指向一个 `object` 类型的数据结构。


    由于包裹数据的大括号 `{ }`，我们知道它是对象。


    ### 为什么我们要用双引号包裹标签？


    通常，当我们创建一个对象时，并不真的需要给属性部分加引号，你可能会更多地看到这种方式（不带引号）。例如：


    ```

    var example = {"animal": "duck", "vegetable": "lettuce"};

    ```


    你可以看到，在对象声明时 `animal` 和 `vegetable` 都没有引号。


    然而，由于 [JSON](https://en.wikipedia.org/wiki/Json) 的出现，在现代技术中使用双引号包裹标签变得普遍。我们将在后面的章节中介绍
    JSON 的基础。


    所以，如果你开始学习对象表示法，最好养成在声明对象时为键加双引号的习惯。上面的示例应该看起来像这样：


    ```

    var example = {"animal": "duck", "vegetable": "lettuce"};

    ```


    随你意为，但请记住这个概念。


    ### 给对象分配新的键值对


    让我们做一些实验……


    1- 在你的控制台上，创建一个新的空对象：


    ```

    var crazyList = { };

    ```


    你还记得如何用 `typeof` 检查变量的类型（在*实验 1*中涵盖过）吗？


    2- 检查 `crazyList` 的 `typeof`：


    ```

    typeof crazyList;

    ```


    它显示 "*object*"。我们有一个空对象。


    3- 现在我们通过赋值给键标签来添加一些值：


    ```

    crazyList["flower"] = "daisy";

    ```


    对象 crazyList 现在包含 `{flower: "daisy"}`。


    4-让我们再添加另一个键值对：


    ```

    crazyList["drink"] = "water";

    ```


    crazyList 现在有两个值：


    `{flower: "daisy", drink: "water"}`


