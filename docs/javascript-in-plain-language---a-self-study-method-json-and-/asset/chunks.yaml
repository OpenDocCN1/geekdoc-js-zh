  trans: "\n\n如果你看过我在 `forum` `demo` 中关于 `ng-model` 的解释，你就会知道 `ng-model` 指令是一个用于保存用户输入数据的对象，并将其链接（或绑定）到分配给该\
    \ `ng-model` 的变量上，即声明中的 ` ==”someName”` 部分（类似于 JavaScript 中将 `prompt()` 赋值给变量时所做的）。在这种情况下，它是变量\
    \ `f`，尽管它的默认值为 32，但得亏 `ng-model` 提供的绑定，它可以被用户在该文本框中输入的数据所更改。\n\n*   不要混淆这些术语：`model`\
    \ 与 `module`。\n*   `Module` 是整个应用程序。`Model` 是一个保存数据并将其绑定到某些变量的小对象。在一个 `Module`\
    \ 中可能有成百上千个这样的小模型。\n\n### 9- 让我们在 HTML 输入框的右侧添加`双大括号` 来完成这一行。\n\n在大括号内包含从华氏度转换为摄氏度的公式：\n\
    \n```html\n{{(f-32) * 5 / 9}}c\n```\n\n注意：右侧的小 `c` 只是一个字符，告诉用户该结果是摄氏度。它与之前声明的变量\
    \ `c` 无关。\n\n整行看起来应该是：\n\n```html\nFahrenheit to Celsius: <input type=\"number\"\
    \ ng-model=\"f\"> {{(f-32) * 5 / 9}}c\n```\n\n### 10- 保存并测试。\n\n此时，所有的 DIV 应该像下面：\n\
    \n```html\n<div ng-app ng-init=\"f=32;c=0\">\n  <div>\n    Fahrenheit to Celsius:\
    \ <input type=\"number\" ng-model=\"f\"> {{(f-32) * 5 / 9}}c\n  </div>\n  <div></div>\n\
    </div>\n```\n\n### 11- 现在，让我们为`摄氏度转华氏度` (Celsius to Fahrenheit) 编写输入框。\n\n在下一个\
    \ DIV 容器中编写以下代码：\n\n```html\n<div>\n  Celsius to Fahrenheit: <input type=\"number\"\
    \ ng-model=\"c\"> {{c * 9 / 5 + 32}}f\n</div>\n```\n\n### 12- 测试一下，测试两种转换。\n\n\
    最终结果可以在[论坛板块](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
    \ | bit.ly/ZQieYU 查看。\n\n**你想要进行额外练习吗？**\n\n你可以添加一个额外的框并初始化另一个变量，例如 `k`：\n\n**这里是一些可能的转换公式：**\n\
    \na) 开尔文转华氏度：`(K - 273.15) * 9/5 + 32`\nb) 开尔文转摄氏度：`K - 273.15`\n\n# 更多项目想法\n\n\
    欲获取更多项目想法，请访问为本书创建的论坛上的以下链接：\n\n[Angular 中的项目想法](http://jsplain.com/javascript/index.php/Thread/144-Project-ideas-in-Angular/)\n\
    \n## 指令总结与资源\n\n作为回顾，这里是我们涵盖的一些指令，以及其他实用的指令及其对应的官方页面链接。\n\n我将通过在 JSplain 论坛上发布示例来继续解释这些和其他指令以便进一步练习：\n\
    \n[论坛帖子开启](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)\
    \ | bit.ly/1roi5qc\n\n**针对模块/控制器：**\n\n*   [ng-app](https://docs.angularjs.org/api/ng/directive/ngApp),\
    \ 或 `data-ng-app` 或 `ng-app=\"appName\"`\n*   [ng-controller](https://docs.angularjs.org/api/ng/directive/ngController)\n\
    \n**针对数据绑定：**\n\n*   [ng-init](https://docs.angularjs.org/api/ng/directive/ngInit)\n\
    *   [ng-model](https://docs.angularjs.org/api/ng/directive/ngModel)\n*   [ng-bind](https://docs.angularjs.org/api/ng/directive/ngBind)\n\
    \n**针对 DOM 遍历：**\n\n*   [ng-hide](https://docs.angularjs.org/api/ng/directive/ngHide)\n\
    *   [ng-show](https://docs.angularjs.org/api/ng/directive/ngShow)\n*   [ng-view](https://docs.angularjs.org/api/ngRoute/directive/ngView)\n\
    *   [ng-repeat](https://docs.angularjs.org/api/ng/directive/ngRepeat)\n\n**针对事件：**\n\
    \n*   [ng-mouseenter](https://docs.angularjs.org/api/ng/directive/ngMouseenter)\n\
    *   [ng-click](https://docs.angularjs.org/api/ng/directive/ngClick)\n*   [ng-keypress](https://docs.angularjs.org/api/ng/directive/ngKeypress)\n\
    \n欲查看模块和控制器配置的快速示例，请查看我们此处的练习之一：\n\n[论坛](http://jsplain.com/javascript/index.php/Thread/43-Lab-15a2)\
    \ | bit.ly/1ve4e66.\n\n# 结论\n\n感谢你一直陪我走到项目的最后。每当我走到这一部分时，我总是感到有些感性。\n\n关于 JavaScript，我还有很多东西没写。\n\
    \n"
