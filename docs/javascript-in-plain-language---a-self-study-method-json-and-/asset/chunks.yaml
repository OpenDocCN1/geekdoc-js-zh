- fmt: "\nWe are going to remove the `ng-init` from our previous exercise and insert\
    \ the data into the controller but first let’s look at the basic structure of\
    \ a controller. Let’s start with the image of an empty controller:\n\n![](images/00031.jpeg)\n\
    \nFig 30 (controller is a child of module x. JavaScript code goes in the controller)\n\
    \nThe controller function is a child of module which in our example is assigned\
    \ to variable `x` in order to make it easy to implement the controller (`x` becomes\
    \ a shortcut to the whole module declaration). So, the module `myFirstAppModule`\
    \ is assigned to `x` and from variable `x` we extract a `controller` [line 3].\
    \ Inside of the controller method we have two parameters. The first parameter\
    \ is the name we are giving to the controller and in a string type format (I’m\
    \ calling it 'myFirstController'); the second parameter is an AngularJS object\
    \ called `$scope`. `$scope` is an Angular object that keeps track of all data\
    \ and properties we are going to send to the web page as we will see shortly.\
    \ Notice how all this code is inside of the `SCRIPT` tag [lines 1 and 7] where\
    \ the `ng-app=\"myFirstAppModule\"` module was declared.\n\nAngularJS *magically*\
    \ makes available to the HTML **view** (the view assigned to this controller)\
    \ whatever code and data we write inside of the controller and assign to object\
    \ `$scope`.\n\nWe could say that `$scope` is the glue between the `controller`\
    \ and the page `view`. The controller wants nothing to do with the page view because\
    \ it is supposed to be generically written. I mean, we could have several different\
    \ views using the same data from the controller: one view for a desktop screen,\
    \ another view for a mobile phone, etc. It is up to `$scope` to interface with\
    \ the external world of views and AngularJS provides such functionality in the\
    \ background.\n\nBefore we do the exercise let me summarize some concepts to help\
    \ you further understand what is going on.\n\n### $scope\n\n`$scope` is an object\
    \ that maps the whole page (DOM) and creates properties that can be addressed.\
    \ In a sense it is like the DOM in parallel. Later you will see that we add `$scope`\
    \ to our controller and then can add variables and functions into `$scope` which\
    \ in turn will be available to the web page app. (Note: the `$` looks like an\
    \ “S”, right? that reminds us that `$scope` is an AngularJS service).\n\n### View\n\
    \nView is the area of the application that will be placed on display. Just like\
    \ images, videos or other embedded text, we could have several views on one page\
    \ and they may be hardwired or linked from a different source. Contrary to the\
    \ HTML standard presentation, `view` data is not persistent which means that it\
    \ varies based on the logic provided by `$scope` (coming from the assigned controller),\
    \ or the behavior of a user interacting with the page. A view is created by standard\
    \ HTML elements in combination with AngularJS’ enhancements from data binding\
    \ and directives and curly braces `{{}}`.\n\n*   Any complex logic should be placed\
    \ in the controller and let `$scope` manage the feeding of this logic into the\
    \ view. This does not mean that a view can’t have any logic; simple expressions\
    \ can be placed in the view as we have done before during our first exercises.\n\
    \n### Controller\n\nThe controller is where we program the JavaScript code to\
    \ be executed when the page runs.\n\nThe controller’s purpose is to provide the\
    \ logic required by AngularJS in order to initialize the object `$scope`, which\
    \ is the object that maps the webpage like a DOM.\n\nBefore using a controller\
    \ with `$scope`, we were using a simple `ng-init` to save and initialize our data\
    \ but that was a very limited implementation. `$scope` is a more powerful object\
    \ and the most appropriate way to declare our properties and methods.\n\nThis\
    \ next image shows how and where we implement the data we previously assigned\
    \ to `ng-init`:\n\n![](images/00032.jpeg)\n\nFig 31\n\nAs you can see, all the\
    \ JavaScript code is treated as a property child of `$scope`. AngularJS will grab\
    \ both `length` and `width` and saves them as part of `$scope` (remember, `$scope`\
    \ will manage the DOM which is how and where things are displayed).\n\nThere is\
    \ only one thing left. We now have an `app name` and we have a `controller` with\
    \ some JavaScript variables to be processed. But how does AngularJS know where\
    \ to display those variables in the paragraph when we open the page?\n\nAs a reminder,\
    \ this is what we had in the HTML BODY of the old exercise:\n\n![](images/00033.jpeg)\n\
    \nFig 32\n\nThe answer is, we should wrap the whole paragraph in a DIV and assign\
    \ the DIV to the controller which is called `myFirstController`:\n\n![](images/00034.jpeg)\n\
    \nFig 33 (we wrap the paragraph in a div assigned to myFirstController)\n\n###\
    \ Your turn: Add a controller to your exercise\n\nAt this time let’s modify our\
    \ previous exercise to add a controller to it.\n\nHere’s the original [raw file](http://icontemp.com/jpl/ang14/ang8b.txt)\
    \ as we left it after adding the module `myFirstAppModule`.\n\n1.  Add the controller\
