    When it comes to parameter names, it doesn’t matter what you call them, what matters
    is their position which needs to be (key, value). You can call them (k,v) or (x,y),
    or anything else.


    As an example, the following image uses the function filter to exclude the *age*
    from the stringification:


    ![](images/00023.jpeg)


    Fig 22 see [raw file](http://icontemp.com/jpl/json4b.txt) | bit.ly/1v71zuT.


    What happens here is that an ***undefined*** value will not be included as a JSON
    file because in JSON, undefined represents and empty key/value pair, so *age*
    will be stripped from the output.


    As another example, let’s say that you want to show the label *age* but with a
    value of *n/a*. You could change the return value from *undefined* which strips
    the key, to the following:


    **return "n/a";**


    Now "age" will show "n/a" as a value.


    Great!


    Moving along, what about programming the opposite, like for example when we receive
    JSON data and want to reconvert it back into an object?


    We will look at the reconversion in a few minutes but let’s first discuss how
    to prevent ***stringify()*** from compressing the data (I mean how to keep the
    original white space), because it completes our discussion on the function *stringify()*.


    ### Using a third argument on stringify() for controlling white space


    Even if we don’t want to use a second argument to filter out the data (like for
    example an array or a function as explained on the previous page), we could still
    use a third argument (or parameter) to control the white spacing when we *stringify*.


    Taking for example our original *employees* object (see [raw file](http://icontemp.com/jpl/json1.txt)
    | bit.ly/1DwXd57), instead of *stringifying* it like we did before:


    **var myString = JSON.stringify(employees);**


    We could instead, add a third argument, which would activate the third input parameter
    of function stringify:


    **var myString = JSON.stringify(employees, null, 4);**


    And the output would look like in this [raw file](http://icontemp.com/jpl/json5.txt)
    | bit.ly/1oh4ts1.


    First, notice how we made JavaScript read the third argument without having a
    second argument:


    *   We made the second argument ***null***. That works because now we can have
    a third argument.


    Second, the number 4 is the number of indented spaces. There is no provision for
    adding lines but JavaScript automatically adds lines when we ask for indentation.
    The maximum number is 10.


    Did you notice the second sample on the raw file? It shows *dots* instead of *spaces*.


    That was done by substituting the third argument from a number to a string:


    **var myString = JSON.stringify(employees, null, "...");**


    This last one will not validate if you test it on *jsonlint*, but it serves to
    illustrate the third argument in *stringify*.


    ### JSON.parse


    To convert the string back into an object just like we had it before, we use the
    method JSON.parse.


    See raw file: [myString](http://icontemp.com/jpl/json6.txt) | bit.ly/1rtZclU.


    var myEmployees = JSON.parse(myString);


    Variable *myEmployees* is now an object with the same values as our original *employees*
    object.


    Note: You will get an error if the data being parsed is not a valid JSON.'
