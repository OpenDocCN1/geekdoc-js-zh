    c) Else, the script will output something like


    "*Sorry, that conversion is not supported*".


    When we create a function with multiple input parameters like for example...


    ```javascript

    function test(x,y) { return x - y; }

    ```


    ...we need to *call the function* and *pass in* the data *arguments* in the proper
    sequence.


    The value to be assigned to `x` (which is the leftmost input parameter) should
    be written in the function call as the first data argument. On the following function
    call, 10 is grabbed by parameter `x` and 3 is grabbed by parameter `y`:


    ```javascript

    test(10,3);

    ```


    Notice how we separate them by commas. Had I entered 3 first, 3 would become `x`
    and the output result would be incorrect.


    ***Let’s start:***


    1- Create a function named `conversion` that takes two input parameters named
    `num` (reminds me of number), and `degrees`. Notice the comma separating the input
    parameters:


    ```javascript

    function conversion(num,degrees) { }

    ```


    2- Inside of the function create your first `if()` statement that says


    ```javascript

    if(degrees === "f") {

    ```


    and then it console.logs the formula to convert Fahrenheit to Celsius.


    The formula is `(f - 32) * 5 / 9` However, please read the note below:


    NOTE: you must replace the `f` in the formula with our new generic input parameter
    `num`.


    **Bonus:** add a `+ "c"` just before the closing parentheses of your `console.log()`.
    This is so that the output will look like *100c*. Do the same on your next step
    for "f".


    3- Next create the `else if()` statement that says


    ```javascript

    else if(degrees === "c") {

    ```


    and then it console.logs the formula to convert Celsius to Fahrenheit.


    The formula is `c * 9 / 5 + 32`


    NOTE: you must replace the `c` in the formula with our new generic input parameter
    `num`.


    4- Finally, create a catch all `else` statement that console.logs


    "*Sorry, that conversion is not supported*".


    5- Close the function with a curly brace `}.`


    6- Paste your code onto the Console and test it with the following function calls:


    ```javascript

    conversion(212, "f"); <-- should result in 100c

    conversion(100, "c"); <-- should result in 212c

    conversion(300, "b"); <-- Should result in “Sorry, that conversion is not supported”.

    ```


    Remember, the character input is a string and it should be in quotes.


    (See my own solution here (***third*** script): [conversion](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)
