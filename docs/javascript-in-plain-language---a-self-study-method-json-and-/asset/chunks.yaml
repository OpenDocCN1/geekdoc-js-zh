    由于 "Tony" 的类型是 `string`，我可以对这种类型的数据进行一些操作，或者获取关于 `string` 数据的某些信息，例如它的字符长度：


    ```

    myName.length;

    ```


    控制台将显示 4，这意味着变量 `myName` 的值 "Tony" 长度为 4 个字符。


    `length` 是从 `type string` 继承的属性之一。其他类型的数据也使用这个属性，因为正如你将反复看到的那样，它在决策非常有用。


    你注意到 `myName` 和 `length` 之间的“点”（`dot`）了吗？


    ### 点运算符 (The DOT operator)


    `myName.length` 中的点将变量 `myName` 与它的属性 `length` 粘在一起。


    点运算符将变量连接到它的属性，或将父对象连接到子对象。我们先放置根节点，即属性的所有者，然后通过点来映射它的成员或子节点：


    ```

    parent.child.grandchild;

    ```


    或者在一个更显式的示例中：


    ```

    window.myName.length;

    ```


    `window` 实际上是变量 `myName` 的父级。我们稍后会回到这里。


    这几乎就像在说“这个人的名字是什么？”。你看到那个 ''s'' 了吗？它将名字与人联系起来。点表示法的工作原理是相同的。


    在这种情况下，它非常简单：我们从变量名开始，向下移动一级到达它的属性 `length`。其他情况下，目标地址可能会变得复杂，也许在链条后面还有一两个术语。我们在整本书中都有机会使用点运算符。


    在使用`dot operator` 时，我们使用的是所谓的**点表示法 (Dot Notation)**，但还有另一种替代语法，叫做**括号表示法 (Bracket
    Notation)**。


    请参阅下一页，获取关于括号表示法的简要介绍说明。


    ### 括号表示法 (The Bracket notation)


    我并不是想通过同时提到两种不同的表示法来让你困惑。我们稍后会广泛使用括号表示法。将其视为关于它的入门介绍即可。


    而不是使用：`myName.length;`


    在你的控制台中输入以下内容：


    ```

    myName["length"];

    ```


    它显示数字 4，就像使用点表示法时一样。注意 `length` 在大括号内部被引号括了起来。我们将 "length" 作为一个字符串或标签传递，JavaScript
    将其重新转换回其在库中正确的属性级别。使用括号表示法有优势，因为它更通用，但现在先不要为此苦恼。我们将同时使用点表示法和括号表示法。括号表示法主要用于动态情况。你稍后会看到点表示法是“硬连接”，而括号表示法是“软连接”（当我们在编写代码时不知道真实的值）。


    有时我们开轿车，有时我们开皮卡！表示法语法也是一的。


    ### 方法的示例 (An example of a method)


    字符串数据还继承了如 `.toUpperCase()` 等方法：


    ```

    myName.toUpperCase();

    ```


    它显示 "TONY" 而不是 "Tony"。


    变量 `myName` 被改为大写了吗？


    没有，没有。它只是在大写模式下显示了它，但值保持原始声明时的状态。


    然而，我们可以通过将变量 `myName` 重新赋值为转换后的自身来将原始值转换为大写：


    ```

    myName = myName.toUpperCase();

    ```


    现在 `myName` 包含的值是 "TONY"。原始的 Tony 被丢弃了。你看到它是发生的了吗？我们将原始变量赋值给了它自己的转换。这几乎就像一只能抓住自己尾巴的狗。


    ### 括号 ( ) 是怎么的？


    `toUpperCase` 是一个方法，它处理某些 `action`（动作）。这听起来像是一个 `function`（函数），我们还没有涵盖它。`()` 代表动作、函数处理或
    `evaluation`（评估）。


    每当你看到一对括号时，请想象某些东西正在被 JavaScript 评估，并返回一个结果。在这种情况下，数据被转换为大写；这就是评估的结果。


    关于括号的更多信息将在稍后介绍。现在不要担心它，只需承认它并继续前进。


    这是另一个方法：`toLowerCase()`：


    ```

    myName.toLowerCase();

    ```


    现在 `myName` 的值是 "tony"。你注意到 T 是小写的了吗？将除第一个字符以外的字符串转换为小写被称为*首字母大写 (capitalizing)*。遗憾的是，JavaScript
