  trans: "\n\n我们将从上一个练习中移除 `ng-init`，并将数据插入控制器中，但首先，让我们看看控制器的基本结构。让我们从一个空控制器的图像开始：\n\
    \n![](img/00031.jpeg)\n\n图 30 (控制器是模块 x 的子级。JavaScript 代码位于控制器中)\n\n控制器函数是模块的子级，在我们的示例中，它被赋值给变量\
    \ `x` 以于实现控制器（`x` 成为整个模块声明的快捷方式）。因此，将模块 `myFirstAppModule` 赋值给 `x`，然后从变量 `x` 中提取\
    \ `controller` [第 3 行]。在控制器方法内部，有两个参数。第一个参数是我们给控制器的名称，格式为字符串类型（我将其命名为 'myFirstController'）；第二个参数是一个名为\
    \ `$scope` 的 AngularJS 对象。`$scope` 是一个 Angular 对象，用于跟踪我们即将发送到网页上的所有数据和属性，正如我们很快看到的。注意所有这些代码都在\
    \ `SCRIPT` 标签内 [第 1 行和第 7 行]，该标签声明了 `ng-app=\"myFirstAppModule\"` 模块。\n\nAngularJS\
    \ *神奇地* 让 HTML **view**（分配给此控制器的视图）可以使用我们在控制器内部编写并分配给对象 `$scope` 的任何代码和数据。\n\n\
    我们可以说 `$scope` 是 `controller` 和页面 `view` 之间的胶水。控制器与页面视图没有任何关系，因为它应该是应该是以通用方式编写的。我的意思是，我们可以有多个不同的视图使用来自控制器的相同数据：一个用于桌面屏幕的视图，另一个用于手机的视图等。这由\
    \ `$scope` 来与外部视图世界进行接口，而 AngularJS 在后台提供了此类功能。\n\n在开始练习之前，让我总结一下一些概念，以帮助你进一步理解正在发生什么。\n\
    \n### $scope\n\n`$scope` 是一个映射整个页面 (DOM) 并创建可以访问的属性的对象。在某种意义上，它类似于并行的 DOM。稍后你会看到，我们将\
    \ `$scope` 添加到控制器，然后可以将变量和函数添加到 `$scope` 中，这些内容反过来对网页应用可用。（注意：`$` 看起来像字母“S”，对吧？这提醒我们\
    \ `$scope` 是一个 AngularJS 服务）。\n\n### View (视图)\n\n视图是应用中将放置在显示器上的区域。就像图像、视频或其他嵌入文本一样，我们可以在一个页面上有多个视图，它们可能是硬编码的，也可以从不同的源链接。与\
    \ HTML 标准呈现方式相反，`view` 数据不是持久的，这意味着它会根据 `$scope`（来自分配的控制器）提供的逻辑，或者用户与页面交互的行为而发生变化。视图是由标准\
    \ HTML 元素结合 AngularJS 的数据绑定、指令增强以及花括号 `{{}}` 创建的。\n\n*   任何复杂逻辑都应该放在控制器中，让 `$scope`\
    \ 管理将此逻辑馈给视图。这并不意味着视图不能有任何逻辑；简单的表达式可以放在视图中，正如我们在之前的第一次练习中做过的那样。\n\n### Controller\
    \ (控制器)\n\n控制器是编写在页面运行时执行的 JavaScript 代码的地方。\n\n控制器的目的是提供 AngularJS 所需的逻辑，以初始化对象\
    \ `$scope`，该对象是像 DOM 一样映射网页的标识。\n\n在使用带有 `$scope` 的控制器之前，我们一直使用简单的 `ng-init` 来保存和初始化数据，但那是一个非常有限的实现。`$scope`\
    \ 是一个更强大的对象，也是声明我们的属性和方法的适当方式。\n\n下一张图像显示了我们如何以及在哪里实现之前分配给 `ng-init` 的数据：\n\n\
    ![](img/00032.jpeg)\n\n图 31\n\n如所示，所有的 JavaScript 代码都被视为 `$scope` 的属性子级。AngularJS\
    \ 将获取 `length` 和 `width` 并将其保存为 `$scope` 的一部分（记住，`$scope` 将管理 DOM，这就是事物显示的方式和位置）。\n\
    \n只剩下一件事了。我们现在有一个 `app name`，并且有一个带有待处理 JavaScript 变量的 `controller`。当我们打开页面时，AngularJS\
    \ 如何知道在段落的哪里显示这些变量？\n\n提醒一下，这是我们在旧练习的 HTML BODY 中的内容：\n\n![](img/00033.jpeg)\n\
    \n图 32\n\n答案是，我们应该将整个段落封装在一个 DIV 中，并将 DIV 赋值给名为 `myFirstController` 的控制器：\n\n\
    ![](img/00034.jpeg)\n\n图 33 (我们将段落封装在分配给 myFirstController 的 div 中)\n\n### 轮你了：为你的练习添加控制器\n\
    \n现在，让我们修改之前的练习，为它添加一个控制器。\n\n这是我们在添加模块 `myFirstAppModule` 后留下的原始[原始文件](http://icontemp.com/jpl/ang14/ang8b.txt)。\n\
    \n1.  将控制器添加到脚本容器中，位于模块声明下方一行，如图 30 所示。\n2.  将 `length` 和 `width` 赋值给 `$scope`，如图\
    \ 31 所示，然后从你的页面中移除 `ng-init`。\n3.  将你的段落封装在 DIV 中，并将 DIV 赋值给控制器，如图 33 所示。\n4.\
    \  测试你的 HTML Angular 应用。这是我自己的版本：\n\n[原始文件](http://icontemp.com/jpl/ang14/ang8c.txt)\
    \ | [原始文件](http://icontemp.com/jpl/ang14/ang8c.txt)\n\n### 代码 length 和 width 的另一种方式\n\
    \n我们现在有一个 `app name`，并且有一个带有待处理 JavaScript 变量的 `controller`。\n\n```javascript\n\
    $scope.myPerimeter = {\n    \"length\": 9,\n    \"width\": 3\n};\n$scope.length\
    \ = 9;\n$scope.width = 3;\n```\n\n```html\n{{myPerimeter.length}}\n{{myPerimeter.width}}\n\
    ```\n\n```html\n{{myPerimeter.length * 2}}\n{{myPerimeter.width * 2}}\n```\n\n\
    ### 创建一个程序将华氏度转换为摄氏度\n\n我们*不会*从头开始创建这个程序，因为我们之前在**实验 6** 学习 JavaScript 时已经已经做过了。\n\
    \n[论坛](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/) | bit.ly/1Dp2k\n\
    \n文件](http://icontemp.com/jpl/f2c.txt) | bit.ly/1ruKrzi\n\n我们要做的是创建一个*应用*，在 HTML\
    \ 页面上显示结果。\n\n这个主意是练习在页面上设置 AngularJS，并练习在控制器中包含代码实现的方法。\n\n这是我的示例的配谱：\n\n-  \
    \ **模块名称：** `myAppModule`\n-   **控制器名称：** `myController`\n-   **显示结果的变量：** `result`（提示：它在控制器中是\
    \ `$scope.result`）。\n-   **动态显示的句子：** *100 华氏度等于 37.778 摄氏度。*\n\n**注意：** 在调用函数时，确保将原始的\
    \ `f2c(212)` 更改为 `f2c(100)`。\n\n准备好挑战了吗？\n\n请自己完成练习。这是一个摘要指南：\n\n1.  创建你的 HTML\
    \ 骨架。\n    [原始文件](http://icontemp.com/jpl/ang14/ang1.txt)。\n2.  链接 AngularJS（如果你使用的是启动文件，这已经完成了）。\n\
    3.  添加 `ng-app` 指令（已完成）并将其命名为 `myAppModule`。\n4.  在 AngularJS 链接下方添加一个新的 Script\
    \ 容器，并在其中声明你的模块。（我将其赋值给变量 `x`）。\n5.  在模块声明下方添加你的控制器。控制器的名称是 `myController`，它属于变量\
    \ `x`。在它的参数中，显示了一个带有控制器名称的字符串，在用逗号分隔后，第二个参数引入了一个传入 `$scope` 的函数。\n6.  在控制器中添加华氏度到摄氏度的转换函数。\n\
    \n这里有几种替代方案。让我解释一下：\n\n"
- fmt: "\na) First get a copy of the original JavaScript script here: [raw file](http://icontemp.com/jpl/f2c.txt).\n\
    \nb) We need to replace `console.log` with `return` because we are catching the\
    \ result and sending it to `$scope` so that it can be displayed.\n\nc) Now we\
    \ have two options (see steps c through f):\n\nWe could assign function `f2c`\
    \ as a property of `$scope` this way:\n\n```javascript\n$scope.f2c = function(f){return\
    \ ((f-32) * 5 / 9);}\n```\n\nd) Then, when we get to the HTML page view, we can\
    \ implement the result this way:\n\n```html\n{{f2c(100)}}\n```\n\ne) **OR** (and\
    \ this is a better way because it avoids using JavaScript in the HTML view), we\
    \ can insert the original function inside of the controller (except for the console.log),\
    \ and then assign to `$scope` a variable such as for example `result`, with the\
    \ result of a function call.\n\n```javascript\nx.controller('myController', function($scope){\n\
    \  function f2c(f){\n    return (f-32) * 5 / 9;\n  }\n  $scope.result = f2c(100);\n\
    })\n```\n\nf) If we use option (e), we then apply variable `result` in the view\
    \ like this:\n\n```html\n{{result}}\n```\n\n7- In the BODY of the HTML page create\
    \ a view by adding a DIV container.\n\nLink the opening DIV tag to `ng-controller=\"\
    myController\"`.\n\n8- Inside of the DIV container add the paragraph with the\
    \ following message:\n\n```html\n<p>100 degrees Fahrenheit is {{YOUR CODE HERE}}\
    \ Celsius.</p>\n```\n\n9- Where it says YOUR CODE HERE, replace it with option\
    \ (d) or option (f) based on the way you programmed your controller’s JavaScript\
    \ as stated in (c) or (e).\n\n10- Save and test your app. The display result should\
    \ be\n\n100 degrees Fahrenheit is 37.77777777777778 Celsius\n\nWhen you’re done,\
    \ compare it with my result here:\n\n[forum](http://jsplain.com/javascript/index.php/Thread/42-Lab-15c/)\
    \ | bit.ly/1ruKCKT\n\n[raw file](http://icontemp.com/jpl/ang14/angc3m.txt) |\n\
    \n[html](http://icontemp.com/jpl/ang14/angc3m.html) |\n\nSuggestion: Try to convert\
    \ some of the other JavaScript exercises into Angular. You may not get a perfect\
    \ solution but you will get plenty of practice.\n\n### Placing the controller\
    \ on a separate file\n\nNow that we have logically separated the controller and\
    \ view units (both part of the module), we can safely place the `controller` and\
    \ `module configuration` on a separate file. This is by no means the end of the\
    \ story, perhaps just the beginning.\n\nOn simple applications we can just leave\
    \ it on the same page as we have done earlier. However, as versatile developers\
    \ we need to practice separation of concerns in order to get ready for bigger\
    \ things.\n\nIt’s pretty easy. Let’s take for example the exercise we just finished\
    \ (Fahrenheit to Celsius):\n\n[raw file](http://icontemp.com/jpl/ang14/angc3m.txt)\
    \ |\n\n1- Save it under a different name, like for example `f2cfinal.html`.\n\n\
    Now we can edit the file:\n\n2- Copy and cut (delete) all the contents inside\
    \ of the `<script></script>` where the controller and module configuration are.\
    \ Just leave the `SCRIPT` tags by themselves so that we can add a link to the\
    \ separate file.\n\n3- Paste the contents on a new file and save it as `mycontroller.js`\
    \ (or any other name).\n\nNotice the `.js` extension. Make sure the file is on\
    \ the same folder as `f2cfinal.html`.\n\n4- Go back to `f2cfinal.html` and in\
    \ the opening `SCRIPT` tag that belonged to the controller, type the path to the\
    \ new file which should be the following including the script tags:\n\n```html\n\
    <script src=\"mycontroller.js\"></script>\n```\n\n5- Save and test.\n\nCompare\
    \ with my result here:\n\n[raw file](http://icontemp.com/jpl/ang14/f2cfinal.txt)\
    \ | |\n\n[.js file](http://icontemp.com/jpl/ang14/mycontroller.js) | |\n\n[html](http://icontemp.com/jpl/ang14/angc3m.html)\
    \ |\n\n### Additional information\n\nFor updates and further exploration of controllers\
    \ (aside from what is covered in this eBook) please visit the following post at\
    \ JSplain.com: [Notes on controllers](http://jsplain.com/javascript/index.php/Thread/145-AngularJs-controllers-things-we-should-know/).\n\
    \n### The ng-model\n\nAngularJS can sometimes be really simple.\n\nPlease take\
    \ a look at the following script based on the JavaScript exercise we did on Part\
    \ C:\n\n[Fahrenheit to Celsius / to Fahrenheit conversion](http://icontemp.com/jpl/conversions.html)\
    \ | bit.ly/ZQgTRW\n\nDo you still remember how we did the JavaScript raw version\
    \ of this algorithm?\n\nTo refresh your mind see the `third` example shown in\
    \ the forum:\n\n[Lab 6](http://jsplain.com/javascript/index.php/Thread/13-Lab-6/)\
    \ | bit.ly/1Dp2SKk\n\nNow, back to the first link on the top, it looks pretty\
    \ cool and it is being displayed on a web page. When we change the value inside\
    \ of the text box, it converts the value to Celsius or Fahrenheit automatically.\n\
    \nLet’s take a look at the script to see what it was done to it. It is much simpler\
    \ than our original JavaScript version from lab 6.\n\nIn the forum you will find\
    \ a `live demo` and the script right below it. Please read the explanation for\
    \ each line of code:\n\n[forum board](http://jsplain.com/javascript/index.php/Thread/45-Fahrenheit-to-Celsius-ng-model)\
    \ | bit.ly/ZQieYU.\n\nAfter reading the description in the forum and play with\
    \ the demo a bit, please return back here for some lab work. We are going to do\
    \ this project in less than 10 minutes, promise!\n\n### Lab work, creating the\
    \ conversion script\n\nDid you notice there is no `controller` or `module` declared\
    \ for the temperature conversion program?\n\nAngularJS can many times save us\
    \ hours of work and it is getting better as they improve their game. For the job\
    \ at hand all we need are a few tools (and an introduction to the `ng-model` directive):\n\
    \na) A link to the library\n\nb) An `ng-app` directive\n\nc) An `ng-model` directive.\n\
    \nd) A few double curly braces\n\ne) And two HTML input boxes.\n\n**Ready to begin?**\n\
    \n1- Let’s get our basic HTML script:\n\n[raw file](http://icontemp.com/jpl/ang14/ang1.txt)\
    \ |\n\n2- Save it as `conversions.html`\n\n3- In the BODY, replace `hello` with\
    \ one `DIV` containing two other `DIV`s inside it:\n\n```html\n<div>\n  <div></div>\n\
    \  <div></div>\n</div>\n```\n\n4- If you are not using my given starter file,\
    \ make sure to include an `ng-app` directive on your opening HTML tag (or on a\
    \ `DIV` that wraps the view).\n\n5- On the top most opening `DIV` tag from step\
    \ 3, declare an `ng-init` to initialize two variable as shown below (the `init`\
    \ is because we are not going to use a controller in this project):\n\n```html\n\
    <div ng-init=\"f=32;c=0\">\n```\n\nAt this point we should have the following\
    \ on the HTML:\n\na) The `link` to AngularJS library ( it came with the skeleton\
    \ script),\n\nb) The `ng-app` directive somewhere on the page,\n\nc) And the `ng-init`\
    \ to introduce variables `f` and `c`.\n\n6- Just for testing purposes let’s write\
    \ some curly braces inside of the DIV container like this (any of the containers):\n\
    \n```html\n{{f -c + f}}\n```\n\nThen save it and open it on your browser.\n\n\
    *   If you see this: {{f -c + f}} on display, you have a problem. Inspect your\
    \ code to see what is missing or misspelled.\n*   If you see the number `64` displayed,\
    \ then your script is working so far.\n\nOnce your script is working properly,\
    \ remove the curly braces and continue the project. Early testing is always a\
    \ good idea in order to save loads of time and headaches. We should test in gradual\
    \ stages before we move on to the next implementation phase. This way we always\
    \ know where the problem might reside.\n\n7- The next step is to design the first\
    \ **input box**.\n\nInside of the container created by the second pair of DIVs,\n\
    \nwrite an input box of type `number`.\n\n(About input boxes: [HTML input](http://en.wikipedia.org/wiki/Form_%28HTML%29)\
    \ | bit.ly/1qy2lvA )\n\nAlso include a description on the left side. Here’s my\
    \ example:\n\nFahrenheit to Celsius: <input type=\"number\">\n\nNOTE: You may\
    \ be accustomed to use self-closing tags like this />. It works either way. With\
    \ the advent of HTML5 I prefer to write without self-closing.\n\n8- Great, now\
    \ let’s add an **ng-model** to the `input` box and assign it to variable `f`:\n\
    \nFahrenheit to Celsius: <input type=\"number\" ng-model=\"f\">\n"
