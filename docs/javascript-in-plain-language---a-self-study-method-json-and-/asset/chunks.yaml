    ### Scripting a function


    A representation of a function goes like this:


    function funcName() { stuff to do; }


    The above function does not take any input data, it just does stuff.


    To create a function that takes an input parameter and processes it, we need to
    include the parameter inside of the parentheses:


    function funcName(***inputParameter***) { stuff to do; }


    When we say to “*call* a function” it means to have the function execute its *magic*.
    All we have to do to call a function, is to write the function’s name and attach
    a pair of parentheses as a postfix :


    **funcName()**;


    Or, if the function has an input *parameter* we must include and *argument* that
    will replace the parameter:


    **funcName(**123**)**;


    when 123 is a number.


    or


    **funcName(**x**)**;


    when x is a variable.


    or


    **funcName(**"Tony"**)**;


    When Tony is a string of characters.


    Here’s a function arbitrarily named *sizeMeUp* that converts a string value into
    uppercase:


    function sizeMeUp**(**x**){**console.log(x.toUpperCase());**}**


    Here, x is the input parameter that gets replaced by the data we pass in when
    we call the function.


