- fmt: "\nAs a curiosity, notice how JavaScript is placing the new items to the right\
    \ of the last item. However, it doesn’t really matter where the items are being\
    \ placed since, unlike arrays, we don’t need such information in order to access\
    \ those items.\n\n## 5- Now we’re going to add some numeric keys just to see what\
    \ happens\n\n(not a common implementation):\n\n```javascript\ncrazyList[2] = \"\
    front teeth\";\n```\n\n`crazyList` is now holding 3 items:\n\n`{\"2\": \"front\
    \ teeth\", \"flower\": \"daisy\", \"drink\": \"water\"}`\n\nDo you see how the\
    \ numeric key was placed to the left of all the string type keys?\n\nAgain, this\
    \ has no meaning to us because it is not really consistent.\n\n## 6- Let’s add\
    \ two other numeric keys:\n\n```javascript\ncrazyList[\"1\"] = \"flying bird\"\
    ;\n```\n\nand\n\n```javascript\ncrazyList[3] = \"is a crowd\";\n```\n\nNow `crazyList`\
    \ contains:\n\n`{\"1\": \"flying bird\", \"2\": \"front teeth\", \"3\": \"is a\
    \ crowd\", \"flower\": \"daisy\", \"drink\": \"water\"}`\n\nSo we see that when\
    \ the key is numeric, the item is placed on the left side and also in numeric\
    \ sequence. When the key is a string value, the item is placed after the last\
    \ rightmost item.\n\nAlso notice how I wrapped `[\"1\"]` in quotes. That was just\
    \ to show that, when it comes to numeric keys, they can be wrapped or not. It\
    \ is up to you.\n\n*   The sequential positioning of key-value pairs has no value\
    \ for us at this moment. It was just mentioned as a curiosity. Please don’t try\
    \ to memorize such characteristic since this is an unordered list and we will\
    \ pick items by calling their labels at will.\n\n### Using dot notation with objects\n\
    \nOn the previous example we had used bracket notation to call the labels that\
    \ correspond to each object property (the value).\n\nWe can also use dot notation\
    \ to represent object properties.\n\nThis is actually a very popular way to address\
    \ items of an object. In truth, we need to become very familiar with both styles\
    \ of writing because, as much as dot notation is popular, sometimes it cannot\
    \ be used. On the other hand, if you only use bracket notation your code will\
    \ look different than the norm and someone will ask you why such style of writing.\
    \ It is worth learning how to write certain expressions in dot notation and others\
    \ in bracket notation. Practice will tell you which one to use and when.\n\n**Here’s\
    \ what you should know about the differences between these two styles of coding:**\n\
    \n1.  Dot notation will not work with numbers.\n2.  Dot notation will not work\
    \ with dynamic variables (those that change dynamically such as a counter representing\
    \ a key in a key-value pair when traversing an object with a loop).\n3.  In summary,\
    \ dot notation can only be used when the property name is a valid identifier of\
    \ a property and as long as this identifier is not numeric.\n\nThink of dot notation\
    \ as hardwired (the value must be known when dot notation is used), and bracket\
    \ notation as soft wired (the value can dynamically change or be unknown at the\
    \ time the code is presented to the JavaScript interpreter).\n\n## How do we use\
    \ dot notation to address an item in an object?\n\nLet’s repeat our previous examples\
    \ using dot notation instead of bracket notation:\n\n1- Create a new and empty\
    \ object:\n\n```javascript\nvar crazyList = { };\n```\n\n2- Let’s add some values\
    \ by assigning them to key labels:\n\n```javascript\ncrazyList.flower = \"daisy\"\
    ;\n```\n\nNow `crazyList` contains `{flower: \"daisy\"}`\n\nNotice how in dot\
    \ notation a key is written without quotes. This is because `flower` is already\
    \ in memory as a declared key to a property in object `crazyList`. In bracket\
    \ notation however, we always include the key string names in quotes, like \"\
    flower\". In dot notation quotes are not valid.\n\n`crazyList.\"flower\"` would\
    \ result in an error\n\n3- Add another key-value pair:\n\n```javascript\ncrazyList.drink\
    \ = \"water\";\n```\n\nNow `crazyList` contains: `{flower: \"daisy\", drink: \"\
    water\"}`\n\n4- Add a numeric key using dot syntax:\n\n```javascript\ncrazyList.2\
    \ = \"front teeth\";\n```\n\nWe get the following error as a result:\n\n```\n\
    SyntaxError: Unexpected number\n```\n\nNumbers are not allowed in dot syntax.\
    \ It needs to be done this way:\n\n```javascript\ncrazyList[2] = \"front teeth\"\
    ;\n```\n\n**In summary:**\n\nWe can declare an empty object by assigning a pair\
    \ of curly braces to a variable:\n\n```javascript\nvar z = { };\n```\n\nThen we\
    \ can add items by providing a key and a value in either dot notation or bracket\
    \ notation:\n\n```javascript\nz.rent = 750;\nz[\"gasBill\"] = 300;\n```\n\nAnd\
    \ now we have `{rent: 750, gasBill: 300}`\n\n**Or**\n\nWe can declare an object\
    \ and assign items to it all at once:\n\n```javascript\nvar b = {\"color\": \"\
    red\", \"fabric\": \"cotton\"};\n```\n\nAnd now we have `{color: \"red\", \"fabric\"\
    : \"cotton\"}`.\n\n### Spanning an object declaration across multiple lines\n\n\
    Up to this point our objects have been short and one liners. For the most part\
    \ however, objects are more complex and span over several lines of code. \n\n\
    There is no difference between a single line object and a multiple line object.\
    \ The second style of writing objects is just easier for the eye, but JavaScript\
    \ does not care one way or the other.\n\n1- Here’s an example of a multiple line\
    \ syntax style. Please write the code along the. ![images/0001.jpg](images/0001.jpg)\n\
    \nThere is also a link to [raw file](http://icontemp.com/car1.txt) | bit.ly/ZbwxY.\n"
