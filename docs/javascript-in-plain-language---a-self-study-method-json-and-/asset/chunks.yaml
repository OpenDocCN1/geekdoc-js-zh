    Properties of non-array objects are not guaranteed to be stringified in any particular
    order (which makes sense since key-value pairs don’t really need a numeric order).
    Do not rely on ordering of properties within the same object when stringifying.


    ## In summary


    I hope this introduction to JSON has given you the taste for it and inspire you
    to start your own data import export projects.


    Here are a few useful links:


    * [JSON.org](http://www.json.org/), the official website.

    * [JSONLint](http://jsonlint.com/), the JSON validator tool.

    * [Wikipedia](https://en.wikipedia.org/wiki/JSON), an independent reference of
    resources.

    * [Mozila Foundation](https://developer.mozilla.org/en-US/docs/Glossary/JSON),
    a good glossary and resource center.

    * [JSON vs XML](http://www.json.org/xml.html) – A comparison of these two technologies
    written by JSON.org.


    Before we move on, let me just include a brief introduction of another technology
    where JSON really shines: NoSQL.


    ## Document-oriented databases for JSON data


    Modern web applications have data needs that relational databases like MySQL may
    have trouble delivering. A massive change is underway and is disrupting the database
    world as we know it. Today, three interrelated trends are Big Data, Big Users,
    and Cloud Computing – all pushing the adoption of NoSQL technology.


    ### What is NoSQL?


    “A NoSQL or Not Only SQL database provides a mechanism for storage and retrieval
    of data that is modeled in means other than the tabular relations used in relational
    databases.”


    [Wikipedia](http://en.wikipedia.org/wiki/NoSQL).


    The reason for the term "Not only SQL" database is to emphasize that they may
    support SQL-like query languages.


    NoSQL is increasingly used in [real-time web](http://en.wikipedia.org/wiki/Real-time_web)
    applications (example: Facebook’s news feed and Twitter).


    NoSQL are document-oriented databases. Compared to relational databases, a collection
    of data could be considered analogous to a table and a document analogous to a
    record (a document could be encapsulated and encoded in one of the standard formats
    such as XML or JSON).


    A list of NoSQL databases can be found here: [nosql-database.org](http://nosql-database.org/).


    A good starting point if you want to get into this technology right away is to
    download [CouchDB](http://couchdb.apache.org/), which stores data as JSON and
    it can be queried in JavaScript. You can use it on your local computer and learn
    its operation from there. CouchDB is an Open Source project supported by Apache.
    A collection of basic lessons can be found here: [Guides](http://docs.couchdb.org/en/latest/intro/index.html).


    # PART V: DEFEATING THE DRAGON


    Welcome to modern DOM scripting.


    October 2015


    ## 5.3 First solid steps into AngularJS


    ### Intro


    AngularJS is a framework for developing dynamic web pages. It was created by Google
    to address multiple problems with conventional web design. As many other developers,
    I believe AngularJS is the hottest technology available and the future of web
    design, and because it is backed by Google, there will be plenty of resources
    to make it stick.


    In a way, AngularJS extends HTML attributes, giving them superpowers thanks to
    the library provided by AngularJS. The library is connected to your webpage via
    a link just like you would do for CSS or JavaScript.


    HTML was designed for static pages. AngularJS is what HTML could have been if
    it was designed for modern applications.


    At this point you really need to know basic HTML because we will be working with
    a standard HTML page. You don’t need to be an expert, the very basic stuff will
    do. If you need to refresh your mind or learn from scratch, give [Codecademy](https://www.codecademy.com/)
    a visit. You may see me there at times as a moderator, especially on their JavaScript
    exercises, but their HTML tutorial is pretty cool and free!!


    Links of interest (for future reference):


    [AngularJS.org](https://angularjs.org/) | [Wikipedia](http://en.wikipedia.org/wiki/AngularJS)
    | [Documentation](https://docs.angularjs.org/api/ng/directive/ngCloak).


    Before you get yourself lost reading their material let’s become familiar with
    the basic setup and what it can do for a web developer trying to design a more
    dynamic web page.


    Welcome to modern web design!


    ### Directives


    How does AngularJS extend HTML capabilities?


    First we provide a link on the web page to the AngularJS’ library, just like we
    would link to a JavaScript or a CSS file.


    Then the page becomes linked to this huge plethora of methods that can be used
    by you.


    Let’s suppose that we want to supercharge a DIV and nothing else on the page,
    like for example, you want to create a box in your web page with some dynamic
    data.


    After linking to the library, all we have to do is apply a `directive` to the
    `DIV`. The directive is `ng-app`, which makes this `DIV` an application controlled
    by AngularJS. The `ng-app` directive tells AngularJS that this `DIV` needs to
    be scanned for possible AngularJS functionality. We will see how this works in
    a moment.


    If we want the whole page to be scanned and mapped, we apply the same directive
    to the HTML tag instead of applying it to a `DIV`. Actually, any HTML tag able
    to be a container can become an Angular supercharged element without even affecting
    the rest of the page. We could use a paragraph tag, or a form tag, or an ordered
    list. For the most part however, AngularJS is so friendly that we don’t mind associating
    it.

