  trans: "\n\n你可以通过上述 `if`、`else` 的这种强大组合来实现任何可能的结果。\n\n然而，有时另一种分支类型会更有意义。我指的是被称为\
    \ `Switch` 的那种，我只是想确保对它进行了解释，以防你可能需要使用它。\n\n它之所以被称为 `switch`，是因为有多个可能的结果，JavaScript\
    \ 据此做出可执行的决策。这些可能的结果都处于 `off`（关闭）状态， JavaScript 将根据一个匹配的布尔条件将其中一个设置为 `on`（开启），正如我们接下来将看到的。\n\
    \n这里是布局图：\n\n![](img/00016.jpeg)\n\n图 16\n\n在第 1 行我们声明了一个 `switch`。这个 switch 函数方法接收一个条件，JavaScript\
    \ 将根据该条件比较所有结果，以选择其中一种可能的执行方式。\n\n在我们的通用示例中（基于我们拥有的 cases），“匹配条件”应该被替换为 `1`、`2`\
    \ 或 `3`，这样它就能匹配这些 cases 之一。如果其中任何一个匹配条件，JavaScript 就会执行 `case` 提供的代码。布尔值 `true`\
    \ 是解锁该 case 的关键。\n\n示例：如果正确的 case 是 3，JavaScript 将询问：\n\n“是 1 吗？答案：false”，\n\n\
    “是 2 吗？答案：false”，\n\n“是 3 吗？答案：true”，运行代码，\n\nBREAK 并结束。\n\n在执行完一个 `case` 后，JavaScript\
    \ 将由于随后的 `break` 命令而退出 `switch`。如果我们不包含 `break` 命令，那么 JavaScript 将继续寻找更多可能的结果，你可能会有多个正确答案而不是只有一个。即使没有其他正确答案，JavaScript\
    \ 仍然读取所有其他条件，如果 switch 中编写了成千上万种，这可能会导致延迟。因此，`break` 是一个非常重要的实现。\n\n当没有匹配的条件时，可选的\
    \ `default` 将接管作为最终的 `true` 选项并执行其代码。注意，我没有在 `default` 之后包含 `break`。你可以这样做，但没有必要，因为\
    \ JavaScript 此时已经退出了 `switch`。\n\n欲了解更多信息，请访问 `forum` 上的[这篇文章](http://jsplain.com/javascript/index.php/Thread/20-How-does-a-switch-statement-work-in-JavaScript/)\
    \ | bit.ly/1r4XRCL。让我们用 switch 练习一下。\n\n## 3.6 实验 13\n\n### 13a: Switch - 使用布尔匹配\n\
    \n此脚本将使用具有 4 种可能结果的 `switch`。用户将尝试猜一个数字，程序将显示反馈信息：`too low`（太低）、`too high`（太高）、`right!`（正确！）或\
    \ `That’s not a number`（那不是数字）：\n\n1. 在名为 `guessNum` 的函数内部创建一个 `switch`。\n2. 该函数接收一个输入参数\
    \ `num`。\n3. `switch` 应该硬编码为 `true`。\n\n示例：`switch(true)`\n\n4. cases 应该具有以下条件：\n\
    \   - `num <= 3` 显示 \"too low\"\n   - `num >= 5` 显示 \"too high\"\n   - `num ===\
    \ 4` 显示 \"right, the number was 4\"\n   - 对于 `default` 使用 \"*That's not a number*\"\
    \n\n5. 通过传递数字参数来调用函数，例如：\n```\nguessNum(2);\nguessNum(7);\nguessNum(4);\nguessNum(\"\
    a\");\n```\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n    [论坛板块](http://jsplain.com/javascript/index.php/Thread/32-Lab-13a/)\
    \ | bit.ly/1qqwkWc\n    或直接查看[原始文件](http://icontemp.com/jpl/switch1.txt) | bit.ly/1r50ODq\n\
    *   思考表达式。`num <= 3` 将被转换为 `true` 或 `false`。所有其他 case 也是如此，因此 switch 要匹配的应该是布尔值\
    \ `true`。\n\n### 13b: Switch - 使用字面量匹配\n\n在下一个项目中，我们将使用以下内容：\n\n* 一个名为 `myFavColor`\
    \ 的函数，\n* 使用 `prompt()` 获取用户输入，该输入将转换为小写以匹配其中一个 case。（（JavaScript 是区分大小写的）。\n\
    * 使用一些 `confirm()` 输出，这样我们就不必总是使用 `console.log`，\n* 以及关于 `color` 的一些有意义的语句。\n\n\
    语句如下（你可以随时创建自己的，或从这个[原始文件](http://icontemp.com/jpl/colors1.txt) | bit.ly/1ypn1A2）复制）：\n\
    \n* 绿色是平衡与增长的颜色。\n* 蓝色是信任与和平的颜色。\n* 靛色是直觉的颜色。\n* 紫色是想象的颜色。\n* 橙色是社交与乐观的颜色。\n*\
    \ 对歉，系统中还没有这种颜色！\n\n1. 请记住：创建函数的目的是再次调用程序而无需重新输入。它在测试目的和现实生活中都非常好用。因此，整个 `switch`\
    \ 应该封装在一个函数中。请自由选择你偏好的函数样式：函数声明或赋值给变量的函数表达式。\n\n我将使用第一种：\n```\nfunction myFavColor()\
    \ {}\n```\n\n2. 在函数内部，将 `prompt()` 赋值给变量 `color`。\n3. `switch` 表达式应该是 `color`\
    \ 的值：\n```\nswitch (color) {\n```\n4. 每个 case 都需要是小写：\n```\ncase \"green\":\n\
    ```\n5. 每个 `case` 的输出应该是 `confirm()` 后跟一个 `break`：\n```\nconfirm(\"Green is the\
    \ color of balance and growth.\");\nbreak;\n```\n6. 当没有颜色匹配时，由 `default` 执行接管（不需要\
    \ break）：\n```\ndefault:\nconfirm(\"Sorry, that color is not in the system!\"\
    );\n```\n7. 最后，不要忘记两个大括号：一个用于 switch，另一个用于函数（在顶部的红色字样所示）。\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n\
    \    [论坛板块](http://jsplain.com/javascript/index.php/Thread/33-Lab-13b/) | bit.ly/Zca\n\
    \    或直接查看[原始文件](http://icontemp.com/jpl/colors2.txt) | bit.ly/1DwVB\n\n要测试你的脚本，调用函数并遵循提示：\n\
    ```\nmyFavColor();\n```\n\n### 13c: 重复的 switch\n\n有时我们希望脚本重复运行，例如在游戏中，直到我们专门决定退出。\n\
    \n为了让我们之前的脚本可以重复运行，我们所做的是在关闭函数之前调用函数 `myFavColor()`，这样就会触发游戏的新实例。\n\n当我第一次引入 `confirm()`\
    \ 机制时，我提到过 `confirm()` 在点击确定时返回布尔值 `true`，点击取消时返回布尔值 `false`。我们可以捕获这些返回的数据来触发新的函数调用，一种方法是在关闭函数之前添加以下代码（变量名\
    \ `replay` 是任意的）：\n\n```\nvar replay = confirm(\"点击确定重玩，或点击取消退出\")\n\nif (replay\
    \ === true) {\n  myFavColor();\n}\n\n} // 这个括号已经存在，它是底部最后一个\n```\n\n所以从意义上说，我们从\
    \ `confirm` 机制获取布尔值 `true` 并重用它来调用 `myFavColor()`。\n\n*   如需快速浏览或进一步解释以及我这个项目的最终版本，请参考\n\
    \    [论坛板块](http://jsplain.com/javascript/index.php/Thread/34-Lab-13c/) | bit.ly/1ogVffh\n\
    \    或直接查看[原始文件](http://icontemp.com/jpl/colors3.txt) | bit.ly/1vdaYQT\n\n###\
    \ 13d: 使用 while 循环重复脚本\n\n我们还没有介绍过 while 循环。我们涵盖过的循环只有用于数组的 `for` 循环和用于对象的 `for\
    \ in` 循环。\n\n***while loop*** 是一种无限运行，直到某些事情触发循环退出。\n\n"
- fmt: "\nA popular example of a while loop is the mechanism that scans the computer\
    \ keyboard. The `while loop` keeps reading the input from the keyboard until it\
    \ gets a signal from one of the keys which in turn triggers another mechanism.\n\
    \nThe design for a while loop is as follows:\n\n```javascript\nwhile(this Boolean\
    \ expression is true){\n  // do this stuff;\n  // something to change the condition\
    \ to false in order to end the loop;\n}\n```\n\nUntil that something triggers\
    \ a Boolean false, the `while loop` will always run.\n\nWe can use this while\
    \ loop on our previous color description game to run the switch forever until\
    \ the user clicks on the `confirm()`’s `cancel` button. In this way we don’t have\
    \ to recall the function again, all we have to do is to keep asking the user to\
    \ enter his/her favorite color, until the user press the `cancel` button.\n\n\
    **So where do we implement the change from Boolean true, to Boolean false?**\n\
    \nWe implement it on each case because only one case will apply. When the user\
    \ confirms the output message for the case, the user also has a chance to press\
    \ `cancel` when he/she wants to exit the game. Until the user presses `cancel`\
    \ the game will go on forever.\n\nPlease look at the next image to see what I\
    \ mean:\n\n![](images/00017.jpeg)\n\nFig 17\n\nOn line 3 we encapsulate the whole\
    \ switch mechanism inside of a while loop.\n\nWhile `replay` is `true` (which\
    \ is its initial state), the switch will run and the loop will restart the switch\
    \ again and again until we press `Cancel`. Pressing `ENTER` is equivalent to pressing\
    \ `OK` and that means to run another cycle. Eventually we get tired of playing\
    \ the game and press the `Cancel` option on the confirm box which will trigger\
    \ JavaScript to exit the loop.\n\nNotice how the value of variable `replay`, which\
    \ is originally a Boolean `true`, is renewed each time an output message is prompted.\
    \ This gives the user the opportunity to opt out of the game.\n\nIt looks more\
    \ professional than the previous script we had done and if you are interested\
    \ on creating games this can become handy.\n\n*   After you code your own version\
    \ of it you can compare it with mine on the [forum board](http://jsplain.com/javascript/index.php/Thread/35-Lab-13d/)\
    \ | bit.ly/1DwVNYo.\n*   or just the [raw file](http://icontemp.com/jpl/colors4.txt)\
    \ | bit.ly/1sWgeWf\n\n# PART IV: ENTERING THE THIRD REALM\n\n**Please note:**\n\
    \nThe book is getting long! If you wish to take a break, this is the right time\
    \ to do so because what we are going to cover next is supplemental, but not part\
    \ of the JavaScript syntax `core`.\n\nOn the other hand, if you are in a hurry\
    \ to get to AngularJS you can safely jump over JSON for the moment and go to PART\
    \ V: DEFEATING THE DRAGON.\n\nJSON is a necessary topic to know about since you\
    \ will be using it sooner or later, but it is not needed for what we are covering\
    \ on PART V.\n\nI hope your time has been productive and I’m really grateful for\
    \ the investment and trust you placed in this material.\n\n[Tony de Araujo](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\n\
    \n## 4.1 About this section\n\nWe have covered a lot of JavaScript territory and\
    \ there is so much more to write about. However, it is not a good idea to do it\
    \ all at once because it loses its efficiency and defeats the purpose. This is\
    \ the reason why I have subdivided JavaScript into several different booklets:\
    \ to give the reader time to digest all the data covered in each publication.\
    \ Continual practice and repetition with conscious awareness expansion seems to\
    \ be a better way to go.\n\n[JavaScript Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ goes into more detail about each JavaScript Library method, as well as providing\
    \ more advanced practice of concepts. If you did all the exercises covered up\
    \ to this point, you should be more than ready to tackle the other volume.\n\n\
    Another very popular and very inexpensive eBook for practicing purposes is [Draw\
    \ Six Lucky Numbers](http://www.amazon.com/Small-Projects-Learn-JavaScript-Mastering-ebook/dp/B00H4P987A/),\
    \ which covers loops, random numbers and it reviews functions and arrays. This\
    \ is a quick project for a Sunday afternoon.\n\n**Now we have come to a cross\
    \ roads.**\n\nThe rest of this book will be introducing two very hot technologies\
    \ that every JavaScript intermediate to advanced programmer should know:\n\n**JSON**\
    \ (**J**avaScript **O**bject **N**otation) is a way of formatting data to become\
    \ machine independent. This format is in many ways replacing XML and being used\
    \ in modern web programming. In a sense I have been introducing it from the beginning\
    \ of the book so this material should look familiar to you and therefore it will\
    \ be a relatively short section.\n\nThe final area of coverage is about Google’s\
    \ framework library `AngularJS`, which is based on JavaScript.\n\nThis library\
    \ is revolutionizing the way we build websites and although still in its infancy,\
    \ it has already made a permanent impact and you will see why as you get to it.\
    \ By the time you finish the next few chapters you will be able to implement dynamic\
    \ data into your basic webpage in an easy and comprehensive way.\n\nPlease keep\
    \ in mind that I am only introducing `AngularJS`, this is not a complete book\
    \ about it since the topic spans over several volumes. What I hope to achieve\
    \ by writing this material, is to empower you to pursue further studies of `AngularJS`.\
    \ This information will unlock what I consider the hardest part of getting into\
    \ `JSJS`, the very first steps. Through the exercises and explanations given you\
    \ should be able to easily conquer this first barrier.\n\n## 4.2 An introduction\
    \ to JSON\n\nJavaScript Object Notation, `JSON` (it is pronounced J SON), is an\
    \ open standard format that uses human-readable text to transmit data objects\
    \ consisting of key-value pairs (JavaScript objects). It has become an alternate\
    \ technology to XML in its use for transmitting data between a server and web\
    \ application. The term ‘alternate’ may be outdated because nowadays JSON is the\
    \ preferred method for web services. \n\nThe reason why I am introducing JSON\
    \ at this point is because at the time of this writing JSON has become the must\
    \ know subset of JavaScript if one wants to build modern web pages and web apps.\
    \ It should be now part the any web literacy curriculum.\n\n`JSON` has achieved\
    \ such popularity that other languages are now implementing it in their own vocabulary.\n\
    \nThe good news is that you have already been prepared for this technology throughout\
    \ the book and it is just a matter of becoming more aware of its existence.\n\n\
    JSON format is syntactically the same as when we create lists, being it numeric\
    \ as an array or with key-value pairs as in an object. We can also combine the\
    \ two formats to create a more complex JSON data structure.\n\nThe following is\
    \ a collection of data written in the JSON format:\n\n```json\n{\n  \"firstName\"\
    : \"Tony\",\n  \"lastName\": \"deAraujo\",\n  \"age\": 99\n}\n```\n\nOr we can\
    \ also have an array:\n\n```json\n[1, \"hello\", 33]\n```\n\n**Please note:**\
    \ If you are planning to convert an array into a JSON format, avoid using mixed\
    \ array data types like the array I’ve just shown you. This is because JSON is\
    \ supposed to be a **language neutral** data exchange protocol and many programming\
    \ language do not allow mixed arrays (those containing mixed value types) and\
    \ this would cause confusion. The following would be ok because numbers are seen\
    \ as strings (compare with my previous example):\n\n```json\n[\"1\", \"hello\"\
    , \"33\"]\n```\n\nGoing back to our first example on the top, notice there is\
    \ no variable assignment to the JSON object or array. The JSON part of the object\
    \ is the one that gets exported into other systems in a seamless manner.\n\nWhen\
    \ writing in JSON format we must wrap the key in double quotes. Since we have\
    \ used double quotes from the very beginning we should have no problems with that.\n\
    \nJSON will throw an error if keys are not wrapped in double quotes. Single quotes\
    \ will not work.\n"
  raw: "A popular example of a while loop is the mechanism that scans the computer\
    \ keyboard. The wile loop keeps reading the input from the keyboard until it gets\
    \ a signal from one of the keys which in turn triggers another mechanism.\n\n\
    The design for a while loop is as follows:\n\nwhile(this Boolean expression is\
    \ true){\n\n// do this stuff;\n\n// something to change the condition to false\
    \ in order to end the loop;\n\n}\n\nUntil that something triggers a Boolean false,\
    \ the *while loop* will always run.\n\nWe can use this while loop on our previous\
    \ color description game to run the switch forever until the user clicks on the\
    \ confirm()’s cancel button. In this way we don’t have to recall the function\
    \ again, all we have to do is to keep asking the user to enter his/her favorite\
    \ color, until the user press the cancel button.\n\n***So where do we implement\
    \ the change from Boolean true, to Boolean false?***\n\nWe implement it on each\
    \ case because only one case will apply. When the user confirms the output message\
    \ for the case, the user also has a chance to press cancel when he/she wants to\
    \ exit the game. Until the user presses *cancel* the game will go on forever.\n\
    \nPlease look at the next image to see what I mean:\n\n![](images/00017.jpeg)\n\
    \nFig 17\n\nOn line 3 we encapsulate the whole switch mechanism inside of a while\
    \ loop.\n\nWhile replay is *true* (which is its initial state), the switch will\
    \ run and the loop will restart the switch again and again until we press Cancel.\
    \ Pressing ENTER is equivalent to pressing OK and that means to run another cycle. \
    \ Eventually we get tired of playing the game and press the Cancel option on the\
    \ confirm box which will trigger JavaScript to exit the loop.\n\nNotice how the\
    \ value of variable *replay*, which is originally a Boolean *true*, is renewed\
    \ each time an output message is prompted. This gives the user the opportunity\
    \ to opt out of the game.\n\nIt looks more professional than the previous script\
    \ we had done and if you are interested on creating games this can become handy.\n\
    \n*   After you code your own version of it you can compare it with mine on the\n\
    \n    [forum board](http://jsplain.com/javascript/index.php/Thread/35-Lab-13d/)\
    \ | bit.ly/1DwVNYo.\n\n    or just the [raw file](http://icontemp.com/jpl/colors4.txt)\
    \ | bit.ly/1sWgeWf\n\n# PART IV:  ENTERING THE THIRD REALM\n\n**Please note:  **\n\
    \nThe book is getting long! If you wish to take a break, this is the right time\
    \ to do so because what we are going to cover next is supplemental, but not part\
    \ of the JavaScript syntax *core*.\n\nOn the other hand, if you are in a hurry\
    \ to get to AngularJS you can safely jump over JSON for the moment and go to PART\
    \ V: DEFEATING THE DRAGON.\n\nJSON is a necessary topic to know about since you\
    \ will be using it sooner or later, but it is not needed for what we are covering\
    \ on PART V.\n\nI hope your time has been productive and I’m really grateful for\
    \ the investment and trust you placed in this material.\n\n[Tony de Araujo](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\n\
    \n## 4.1 About this section\n\nWe have covered a lot of JavaScript territory and\
    \ there is so much more to write about. However, it is not a good idea to do it\
    \ all at once because it loses its efficiency and defeats the purpose. This is\
    \ the reason why I have subdivided JavaScript into several different booklets:\
    \ to give the reader time to digest all the data covered in each publication.\
    \ Continual practice and repetition with conscious awareness expansion seems to\
    \ be a better way to go.\n\n[JavaScript Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ goes into more detail about each JavaScript Library method, as well as providing\
    \ more advanced practice of concepts. If you did all the exercises covered up\
    \ to this point, you should be more than ready to tackle the other volume.\n\n\
    Another very popular and very inexpensive eBook for practicing purposes is [Draw\
    \ Six Lucky Numbers](http://www.amazon.com/Small-Projects-Learn-JavaScript-Mastering-ebook/dp/B00H4P987A/),\
    \ which covers loops, random numbers and it reviews functions and arrays. This\
    \ is a quick project for a Sunday afternoon.\n\n**Now we have come to a cross\
    \ roads.**\n\nThe rest of this book will be introducing two very hot technologies\
    \ that every JavaScript intermediate to advanced programmer should know:\n\n**JSON**\
    \ (**J**avaScript **O**bject **N**otation) is a way of formatting data to become\
    \ machine independent. This format is in many ways replacing XML and being used\
    \ in modern web programming. In a sense I have been introducing it from the beginning\
    \ of the book so this material should look familiar to you and therefore it will\
    \ be a relatively short section.\n\nThe final area of coverage is about Google’s\
    \ framework library **AngularJS**, which is based on JavaScript.\n\nThis library\
    \ is revolutionizing the way we build websites and although still in its infancy,\
    \ it has already made a permanent impact and you will see why as you get to it.\
    \ By the time you finish the next few chapters you will be able to implement dynamic\
    \ data into your basic webpage in an easy and comprehensive way.\n\nPlease keep\
    \ in mind that I am only introducing AngularJS, this is not a complete book about\
    \ it since the topic spans over several volumes. What I hope to achieve by writing\
    \ this material, is to empower you to pursue further studies of AngularJS. This\
    \ information will unlock what I consider the hardest part of getting into AngularJS,\
    \ the very first steps. Through the exercises and explanations given you should\
    \ be able to easily conquer this first barrier.\n\n## \n\n4.2 An introduction\
    \ to JSON\n\nJavaScript Object Notation, ***JSON*** (it is pronounced J SON),\
    \ is an open standard format that uses human-readable text to transmit data objects\
    \ consisting of key-value pairs (JavaScript objects). It has become an alternate\
    \ technology to XML in its use for transmitting data between a server and web\
    \ application. The term ‘alternate’ may be outdated because nowadays JSON is the\
    \ preferred method for web services. \n\nThe reason why I am introducing JSON\
    \ at this point is because at the time of this writing JSON has become the must\
    \ know subset of JavaScript if one wants to build modern web pages and web apps.\
    \ It should be now part the any web literacy curriculum.\n\nJSON has achieved\
    \ such popularity that other languages are now implementing it in their own vocabulary.\n\
    \nThe good news is that you have already been prepared for this technology throughout\
    \ the book and it is just a matter of becoming more aware of its existence.\n\n\
    JSON format is syntactically the same as when we create lists, being it numeric\
    \ as an array or with key-value pairs as in an object. We can also combine the\
    \ two formats to create a more complex JSON data structure.\n\n The following\
    \ is a collection of data written in the JSON format:\n\n{\n\n\"firstName\": \"\
    Tony\",\n\n\"lastName\": \"deAraujo\",\n\n\"age\": 99\n\n}\n\nOr we can also have\
    \ an array:\n\n[1, \"hello\", 33]  \n\n**Please note:** If you are planning to\
    \ convert an array into a JSON format, avoid using mixed array data types like\
    \ the array I’ve just shown you. This is because JSON is supposed to be a **language\
    \ neutral** data exchange protocol and many programming language do not allow\
    \ mixed arrays (those containing mixed value types) and this would cause confusion.\
    \ The following would be ok because numbers are seen as strings (compare with\
    \ my previous example):\n\n[\"1\", \"hello\", \"33\"]\n\nGoing back to our first\
    \ example on the top, notice how there is no variable assignment to the JSON object\
    \ or array. The JSON part of the object is the one that gets exported into other\
    \ systems in a seamless manner.\n\nWhen writing in JSON format we must wrap the\
    \ key in double quotes. Since we have used double quotes from the very beginning\
    \ we should have no problems with that.\n\nJSON will throw an error if keys are\
    \ not wrapped in double quotes. Single quotes will not work."
