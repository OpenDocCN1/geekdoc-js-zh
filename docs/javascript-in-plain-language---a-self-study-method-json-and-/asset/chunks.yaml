    click on a dynamic field, the page remains the same but the data is updated via
    a JSON data format exchange. This is one of the reasons why becoming aware of
    this technology is a must.


    *   **Keep this in mind:** JSON-formatted text is also syntactically legal JavaScript
    code. However, the opposite or other way around may not be true. This is the reason
    why, when we learned to create objects earlier, I chose to wrap the keys in double
    quotes, making it legal syntax for both JavaScript and JSON.


    The next image will show a more extensive example of a JSON object. You will see
    the outer object subdivided into two key names: ***staff*** and ***management***.


    Each one of these keys, staff/management, will have an *array* as a value. The
    arrays will contain several individual records in the form of objects. Each object
    represents an employee from either staff or management. Let’s look at the image:


    ![](images/00019.jpeg)


    Fig 19 see [raw file](http://icontemp.com/jpl/json1b.txt) | bit.ly/1uF1qNH


    Do you see how that is done? There are two properties: ***staff*** and ***management***.


    In our example, the property ***staff*** contains an **array** of people assigned
    to it, and each person is also an object with its own data. Right now we only
    have "Tony" as staff and we only have "Judy" as management, but we could add a
    comma after the closing brace from "Tony" or from "Judy", and add another person
    to each array, as you will see on the picture further down the page.


    Don’t get confused here. Arrays are not necessary in order to create JSON data
    structures. We can have arrays, strings, numbers and objects, represented in a
    JSON structure. Every identifier needs to be wrapped in double quotes, except
    for numbers in which quotes are optional. (As noted earlier, always double quote
    numbers if they are contained in an array, in order to comply with programming
    languages that forbid mixed arrays).


    ### Use jsonlint, a tool to check JSON validation


    In order to see if a code block is syntactically well written in JSON we can check
    it with an online tool called [jsonlint](http://jsonlint.com/) (jsonlint.com).
    This tool becomes an important check in order to avoid errors or unsecured JSON
    data scripts.


    **Practicing exercise:**


    1- Copy the code from the previous image and paste it on the box at *jsonlint*.
    Then click *validate*. If everything is well written, you should see a green bar
    across the page.


    2- Try removing a brace, or adding a variable name, or a semicolon just to see
    if it still validates.


    ### Assigning a JSON object to a variable


    Now, if we want to manipulate this data after we receive it at the destination,
    we need to assign it to a variable. The variable will point to the data in memory
    so that we can address it. That’s when JavaScript comes in: We move data around
    in the JSON format, and at the destination we assign the data to a variable if
    we want to further manipulate the data.


    The next extended image will show how we can assign a *variable* to the JSON object.


    **Remember**, when writing your code, if you want to validate your JSON data with
    [jsonlint](http://jsonlint.com/), you must do it before assigning the JSON data
    to a variable and before adding the semicolon at the end to terminate the statement.


    ![](images/00020.jpeg)


    Fig 20 see [raw file](http://icontemp.com/jpl/json1.txt) | bit.ly/1DwXd57.


    3- On this step extend your own object with more data, or copy it from the raw
    file below image 20.


    If you are writing your own script and want to validate it with ***jsonlint***,
    do it before adding the variable (ex: ***var employees =*** ) and last semicolon,
    then assign the variable *employees* to the object.


    Now that we have assigned the JSON object to the variable *employees*, we can
    **edit**, **add**, **delete** and **display** the data or part of the data because
    the object has a *name* we can refer to.


    ### Editing the JSON object


    The property key ***staff*** has an array assigned to it. The decision to have
    an array was so that we could include several objects as part of *staff*. Each
    person in the array is an object in itself. The same goes for key ***management***
    which is also a property of the object *employees*.


    **Practicing exercise:  **


    4- If you haven’t done so, copy the raw file and paste it onto your JavaScript
    Console.


    5- How would we address *staff* in order to get a list of its members?


    We could use dot syntax  in the following manner:


    **employees.staff;**


    That would give us a list of employees from the staff array. Your Console might
    display a short version of it, something like *object*, *object*, *object*, which
    represents each employee, but in real life you would get the complete list. To
    see the contents of each object, just click on it (see the image below). That’s
    how the Console treats the output.


    ![](images/00021.jpeg)


    Fig 21


    NOTE: The proto property is a list of all the methods from the JavaScript library
    that apply to this object. Just ignore it because it has nothing to do with JSON
    and it is not portable. I cover all these library methods on the [Volume 2](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)
    book.


    6- How would we address the first object in the staff array?


    **employees.staff[0];**


    Explanation:


    We start with the outer object which is *employees*, and then address its *staff*
    member. Then, since *staff* holds as array of inner objects, we address the first
    element of the array which is at location *zero*, and the result is as follows:


    *Object {firstName: "Tony", lastName: "deAraujo", age: 99}*


    7- Now try addressing the object in the array held by *staff* at the position
    containing *Mary*. She is the third element of the staff array, which corresponds
    to position 2.


    See the result here: [raw file](http://icontemp.com/jpl/json2.txt) | bit.ly/1sWuXAy.


    8- And how would we add a new employee to the staff class?


    This is the new employee we need to add:


    "firstName":"Loren", "lastName":"Santos", "age":29


    Since Loren is an object that needs to be added to an array, we could use the
    array method **push()** to push it into staff: (see [raw file](http://icontemp.com/jpl/json3.txt)
    | bit.ly/1wKTPPB ).


    **employees.staff.push({"firstName":"Loren", "lastName":"Santos", "age":29});**


    9- Try adding a new member to  employees ***management***, like for example:


    "firstName":"Peter", "lastName":"Jones", "age":55


    When finished, try addressing (displaying) this new member at its location in
    the array assigned to management.


    See [raw file](http://icontemp.com/jpl/json4.txt) | bit.ly/1tXHoQM


    10- Call the employees property management to see what it contains:


    ![](images/00022.jpeg)'
