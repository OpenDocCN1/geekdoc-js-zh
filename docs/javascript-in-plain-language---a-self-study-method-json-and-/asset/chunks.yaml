  trans: "\n如果你在好奇的话，我并真的不知道 `Outback` 的评分，数字 9 只是为了练习目的。\n\n## 2.15 实验作业 11 - 重做实验作业\
    \ 10\n\n还记得在 `Lab 10` 中我们用英语、葡萄牙语、西班牙语和法语显示了“敏捷的棕色狐狸跳过了懒狗”吗？\n\n当时四个变量：`english`、`portuguese`、`spanish`\
    \ 和 `french`。然后我们将这些变量添加到变量名的数组中。\n\n我们遇到的问题是尝试将数组内容以变量名或 `key-value` 对的形式列出来，例如：\n\
    \n`english: “The quick brown fox jumps over the lazy dog”`.\n\n我们无法动态地显示数组中的变量名，只能显示值本身。这是因为\
    \ JavaScript 将变量视为一个 `expression`（表达式）并给了我们求值结果，即变量内部的数据。（表达式将在下一个主题中进一步解释）。\n\
    \n好了，现在我们可以做到这一点！我们要做的就是不再声明独立的变量，而是将它们声明为对象的属性。\n\n**让我们开始吧：**\n\n1- 创建一个名为 `langVersion`\
    \ 的对象。\n\n2-为此对象分配四个属性键：`english`、`portuguese`、`spanish`、`french`。\n\n3-对于每个键，根据以下文本添加正确的值：\n\
    \n[原始文件](http://icontemp.com/jpl/fox5a.txt) | bit.ly/1rt9dzZ\n\n不要声明变量，而是像原始文件中所示使用属性键。\n\
    \n4- 现在你应该拥有了一个完整的对象。\n\n接下来，在对象外部创建一个 `for in` 循环，打印出对象的内容。每个属性的显示应该像这样：\n\n\
    `english: \"The quick brown fox jumped over the lazy dog\";`\n\n*   在这里查看我自己的运行结果：\n\
    \    [论坛](http://jsplain.com/javascript/index.php/Thread/23-Lab-11/) | bit.ly/1tWQddJ\n\
    \    或者[原始文件](http://icontemp.com/jpl/fox5.txt) 版本 | bit.ly/1ofRRkS。\n\n### 将\
    \ for in 循环转换为对象方法\n\n5- 一旦你完成了项目且一切运行正常，请重构 `for in` 循环，使其成为对象 `langVersion`\
    \ 的内部方法，如下：\n\n*a)* 在对象原始最后一个属性后添加一个新的`comma`，这样你就可以下方编写另一个属性。\n\n*b)* 给这个新属性一个命名为\
    \ `list` 的标签，以便稍后调用该方法，\n\n*c)* 然后写一个函数作为 `list` 的值。\n\n在函数内部放置当前的 `for in` 循环。\n\
    \n6- 将你的小程序粘贴到控制台上并 `call` 方法，查看它是如何打印的：\n\n`langVersion.list();`\n\n*   在这里对比你的结果和我：\n\
    \    [论坛](http://jsplain.com/javascript/index.php/Thread/24-Lab-11b/) | bit.ly/1uUYgbd\n\
    \    [原始文件](http://icontemp.com/jpl/fox6.txt) | bit.ly/1rl24Bl\n\n*你的列表显示了所有属性，包括方法及其内部脚本，对吧？*\n\
    \n我们可以调整 `list method`（列表方法），过滤掉作为列表一部分打印的方法。\n\n如果你想从打印的列表中删除方法，可以使用 `conditional\
    \ statement`（条件语句）过滤掉任何非 `string` 类型的内容，因为 `list()` 是一个函数。其后的逻辑如下：“如果属性的类型是 'string'，则打印它”。\n\
    \n你还记得如何使用 `typeof` 吗？我们在实验作业 1 中涵盖过它：\n\n当我们写下：\n\n`typeof \"tony\";`\n\nJavaScript\
    \ 回复 `string`。\n\n7- 再次重构循环，使得：\n\n```javascript\nif (typeof langVersion[k] ===\
    \ \"string\") {\n```\n\n`console.log` 期望的输出。这次不需要 `else`。\n\n*   在这里对比你的结果和我：\n\
    \    [论坛](http://jsplain.com/javascript/index.php/Thread/25-Lab-11c/) | bit.ly/1tWSDsR\n\
    \    [原始文件](http://icontemp.com/jpl/fox7.txt) | bit.ly/1pqbvtZ\n\n**总结来说**，有些时候需要使用\
    \ `array data structure`（数组数据结构），而有些时候使用 `object data structure`（对象数据结构）更合适。最终，数组和对象都是\
    \ JavaScript 库中穿着不同外的 `lists`。\n\n在数组中，我们使用普通的 `for loop`，而在对象中，我们使用 `for in loop`，这是一种预配置好的打印标签名称且无需声明长度值的循环。\n\
    \n如果你想进行进一步的练习，请访问新论坛，我将在那里扩展该主题。此外，我的其他 [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ 有许多现实练习，可以强化并扩展这个主题。\n\n实验结束\n\n# 第三部分：强化战士的武器库\n\n*JavaScript 是一种需要演奏的乐器*\n\
    \n## 3.1 总结我们学过的内容给我 5 分钟，我会告诉你我的一切！\n\n有时候感觉就是这样，对吧？\n\n好了，我们涵盖了很多内容：`variables`\
    \ 的用途；我们如何通过前缀 `var` 引入 `data`；`object` 作为引用的类型；我们如何使用 `for loop` 扫描带有 `length`\
    \ 属性的 `array`。我们见过使用 `push()` 和 `unshift()` 向 `array` 插入新项，使用 `pop()` 和 `shift()`\
    \ 从 `array` 中移除项。我们还实验了使用 `splice()` 在特定位置删除、替换或添加新项，以及如何使用 `slice()` 复制 `array`\
    \ 的部分。数组的 `sorting`（排序）呢？以及如何使用 `join()` 将 `array` 转换为字符串。\n"
- fmt: "\nAnother way to output data from a function is to internally reassign an\
    \ outer variable, since functions have access to outer variables. As for `console.log()`,\
    \ it is just a way to display data on the screen and always in a `string type`\
    \ format.\n\nAnd there you have it, close to 200 pages of fun in a nutshell.\n\
    \n## 3.2 More about functions\n\n### What are expressions and statements?\n\n\
    We have been using the terms expression and statement throughout the book in an\
    \ informal way. It is time to stop and think about these terms because they have\
    \ specific meanings.\n\n- A `statement` is a complete command which instructs\
    \ the computer to carry out a specific task. It’s usually written in one line\
    \ (but not always) and terminated by a `semicolon`.\n\n**Examples of statements:**\n\
    \n```javascript\nvar z = 1 + 2 + 3;\nconsole.log(\"Hello World\");\n```\n\n```javascript\n\
    if(z > 2) {\n  console.log(\"yes it is\");\n}\n```\n\nIn the last example, the\
    \ statement starts at `if` and ends at the `semicolon`. If you place the semicolon\
    \ prematurely you will get an error. That is a common mistake when we first start\
    \ programming.\n\nWe have also mentioned several times “the return statement”.\
    \ Aside from a return being only allowed in functions, it is written as a statement:\n\
    \n```javascript\nreturn 3 + 4;\n```\n\nMany times statements are compounded into\
    \ a group of multiple statements in which case we use the curly braces to wrap\
    \ the compound statements:\n\n```javascript\nif(z > 2) {\n  console.log(\"yes\
    \ it is\");\n  console.log(\"z is greater than 2\");\n  console.log(\"z is also\
    \ the last word of the alphabet\");\n}\n```\n\nNotice how the last curly brace\
    \ does not terminate with a semicolon. The only time a semicolon is placed after\
    \ a curly is when we assign a code block to a variable like for example when we\
    \ create and object.\n\n**Then we have expressions**.\n\nAn expression is anything\
    \ that evaluates to a one unit. Like for example, when JavaScript sees `3 + 4`\
    \ it actually see 7. JavaScript looks at the expression and simplifies the expression\
    \ into 1 unit. Just like statements, expressions are everywhere and they can be\
    \ one and the same.\n\nExamples:\n\n```javascript\nvar x = 4;\n```\n\nAbove, `var\
    \ x = 4;` is a statement and also an expression. Actually we have two expressions.\
    \ JavaScript looks at the code and subdivides the expressions into:\n\n1- `x`,\
    \ which results in 4 when evaluated, and\n2- `4`, which results in itself. JavaScript\
    \ looks at a 4 and it expresses 4 as a result.\n\n```javascript\nif( 10 < 11)\
    \ { // do something; }\n```\n\nAbove, `if(10 < 11)` is an expression because JavaScript\
    \ does not see the literal `10<11`, it only sees `true` or `false`, one or the\
    \ other. JavaScript does not really care for `10<11` in itself, it looks at it\
    \ and internally replaces it with a Boolean `true`.\n\n- This is a very important\
    \ concept in order to understand the language: We write expressions, and JavaScript\
    \ stores the result of their evaluation.\n\nOf course 10 and 11 are individual\
    \ expressions in their own right, but they are not as important as the combination\
    \ of `10<11`. JavaScript interprets it and saves it as just plain `true`.\n\n\
    Now, look at the semicolon on the previous `if()` example. That’s where the statement\
    \ ends, it starts on `if` and it ends at `..thing;`.\n\n**What about a function?\
    \ Is it an expression in itself?**\n\nTake for example the following function:\n\
    \n```javascript\nfunction x (num1, num2){\n  return num1 + num2;\n}\n```\n\nThe\
    \ above function by itself does not evaluate to anything. It could potentially\
    \ evaluate to the sum of `num1 + num2` but only when the function is called upon:\n\
    \n```javascript\nx(2,4);\n```\n\nThe function when called evaluates to 6. How\
    \ does it evaluate to 6 when we call function `x` with arguments 2 and 4?\n\n\
    - `num1` becomes an expression and it evaluates to 2.\n- `num2` becomes an expression\
    \ which evaluates to 4.\n- `num1 + num2` become an expression which evaluate to\
    \ 6.\n\nExpression evaluation is an important concept in order to truly understand\
    \ JavaScript (or any other language for that matter).\n\nIn the next topic we\
    \ will see how to assign a function to a variable, making the combination of function\
    \ and variable, an expression.\n\nRemember, to declare a variable we start with\
    \ `var`. To declare a function we start with `function`:\n\n```javascript\nvar\
    \ x = 33;\nfunction y (){ }\n```\n\nNext we are going to see how to assign a function\
    \ as a value to a variable and answer a few of common questions you may have.\n\
    \n### Assigning functions to variables\n\nUp to this point we have been declaring\
    \ functions in the following literal manner:\n\n```javascript\nfunction x () {\
    \ return 5; }\n```\n\nHowever, we could also assign a function to a variable like\
    \ this:\n\n```javascript\nvar x = function() { return 5; };\n```\n\nNotice the\
    \ semicolon at the end. This is because the whole variable declaration is in itself\
    \ a statement. Statements are complete command sentences given to JavaScript and\
    \ they usually terminate with a semicolon which separates them from the next statement.\n\
    \n*Wait, I still don’t get it. I don’t see a semicolon on a function declaration\
    \ like we have done before. Why does this one get a semicolon?*\n\nThe semicolon\
    \ has nothing to do with the function. A function in itself is not a complete\
    \ command statement until it is called in. When we call a function, like for example\
    \ `x();` we add a semicolon. The earlier semicolon in question had to do with\
    \ the variable assignment. When we assign a value to a variable we terminate the\
    \ assignment with a semicolon because the assignment is a command sentence, or\
    \ an expression.\n\nThe same goes for any other assignment such as an array:\n\
    \n```javascript\nvar y = [1,2,3];\n```\n\nOr as for object assignments:\n\n```javascript\n\
    var z = {\"color\": \"green\"};\n```\n\nOr function assignments:\n\n```javascript\n\
    var z = function(){ return 5; };\n```\n\n### What is an anonymous function?\n\n\
    In the previous example, the function is known to be an `anonymous` function because\
    \ it has no proper name. `z` is just some variable that points to it.\n\nHowever,\
    \ without `z` the function ceases to exist because the browsers will clear it\
    \ from memory since it has nothing point at it. Any loose objects in memory get\
    \ discarded because they cannot be identified (remember functions are also objects).\n\
    \n### Using variables as pointers\n\nSpeaking of pointers, the previous variable\
    \ `z` points to the function assigned to it. We could use more than one pointer\
    \ by assigning the “contents” of `z` to another variable.\n\nTake for example\
    \ the following function assignment:\n\n```javascript\nvar z = function(){ return\
    \ 7; };\n```\n\nNow assign `a` to `z` and `b` to `a` to see what happens:\n\n\
    ```javascript\nvar a = z;\nvar b = a;\n```\n\nRemember, assignments are from right\
    \ to left.\n\n**What is the content of variable z?**\n\nThe content of variable\
    \ `z` is `function(){ return 7; }`. That’s right, the function script (the string\
    \ of words and symbols that make up the function) is the content of variable `z`,\
    \ or what `z` evaluates to by itself. The only time we get the value 7 is when\
    \ we call the function by post fixing a pair of parentheses to `z`: `z();`.\n\n\
    Because the-value of `z` is a function script, when we assign `z` to `a`, or `z`\
    \ to `b`, we are assigning the script of the function. This is very powerful in\
    \ JavaScript because it means that we can plug in an existing function anywhere\
    \ in the program and as many times as we need to.\n\nNow we are able to call the\
    \ function with any of the three variables:\n\n```javascript\na(); // returns\
    \ 7\nb(); // returns 7\nz(); // returns7\n```\n\n**In summary**\n\nRemember, an\
    \ expression is anything that evaluates to a one unit. This unit is what JavaScript\
    \ actually sees from the code we write, not what the code looks like to the human\
    \ eye. As programmers we need to think like a computer by knowing what the computer\
    \ is going to see when it encounters an expression.\n\n1- What is the value of\
    \ expression `z`?\n*Ans*: `function(){ return 7; }`\n2- What is the value of `z()`?\n\
    *Ans*: 7\n3- What is the value of expression `a`?\n*Ans*: `function(){ return\
    \ 7; }`\n4- What is the value of expression `a()`?\n*Ans*: 7\n5- What is the value\
    \ of expression `b`?\n*Ans*: `function(){ return 7; }`\n6- What is the value of\
    \ expression `b()`?\n*Ans*: 7\n"
  raw: 'Another way to output data from a function is to internally reassign an outer
    variable, since functions have access to outer variables. As for ***console.log()***,
    it is just a way to display data on the screen and always in a *string type* format.


    And there you have it, close to 200 pages of fun in a nutshell.


    ## 3.2 More about functions


    ### What are expressions and statements?


    We have been using the terms expression and statement throughout the book in an
    informal way. It is time to stop and think about these terms because they have
    specific meanings.


    *   A **statement** is a complete command which instructs the computer to carry
    out a specific task. It’s usually written in one line (but not always) and terminated
    by a **semicolon**.


    **Examples of statements:**


    var z = 1 + 2 + 3;


    console.log("Hello World");


    **if(z > 2) {


      console.log("yes it is");


    }**


    In the last example, the statement starts at ***if*** and ends at the *semicolon*.
    If you place the semicolon prematurely you will get an error. That is a common
    mistake when we first start programming.


    We have also mentioned several times “*the return statement*”. Aside from a return
    being only allowed in functions, it is written as a statement:


    return 3 + 4;


    Many times statements are compounded into a group of multiple statements in which
    case we use the curly braces to wrap the compound statements:


    if(z > 2) **{**


     console.log("yes it is");


     console.log("z is greater than 2");


     console.log("z is also the last word of the alphabet");


    **}**


    Notice how the last curly brace does not terminate with a semicolon. The only
    time a semicolon is placed after a curly is when we assign a code block to a variable
    like for example when we create and object.


    **Then we have expressions**.


    An expression is anything that ***evaluates to*** a one unit. Like for example,
    when JavaScript sees **3 + 4** it actually see 7. JavaScript looks at the expression
    and simplifies the expression into 1 unit. Just like statements, expressions are
    everywhere and they can be one and the same.


    Examples:


    var x = 4;


    Above, var x = 4; is a statement and also an expression. Actually we have two
    expressions. JavaScript looks at the code and subdivides the expressions into:


    1- x, which results in 4 when evaluated, and


    2- 4, which results in itself. JavaScript looks a 4 and it expresses 4 as a result.


    if( 10 < 11) { // do something; }


    Above, if(10 < 11) is an expression because JavaScript does not see the literal
    10<11, it only sees *true* or *false*, one or the other.  JavaScript does not
    really care for 10<11 in itself, it looks at it and internally replaces it with
    a Boolean *true*.


    *   This is a very important concept in order to understand the language: We write
    expressions, and JavaScript stores the result of their evaluation.


    Of course 10 and 11 are individual expressions in their own right, but they are
    not as important as the combination of 10<11. JavaScript interprets it and saves
    it as just plain *true*.


    Now, look at the semicolon on the previous if() example. That’s where the statement
    ends, it starts on ***if*** and it ends at **..thing;**


    **What about a function? Is it an expression in itself?**


    Take for example the following function:


    **function x (num1, num2){


     return num1 + num2;


    }**


    The above function by itself does not evaluate to anything. It could potentially
    evaluate to the sum of num1 + num2 but only when the function is called upon:


    **x(2,4);**


    The function when called evaluates to 6.


    How does it evaluate to 6 when we call function x with arguments 2 and 4?


    **num1 becomes an expression and it evaluates to 2.


    num2 becomes an expression which evaluates to 4.


    num1 + num2 become an expression which evaluate to 6**.


    Expression evaluation is an important concept in order to truly understand JavaScript
    (or any other language for that matter).


    In the next topic we will see how to assign a function to a variable, making the
    combination of function and variable, an expression.


    Remember, to declare a variable we start with ***var***. To declare a function
    we start with ***function***:


    var x = 33;


    **function y (){ }**


    Next we are going to see how to assign a function as a value to a variable and
    answer a few of common questions you may have.


    ### Assigning functions to variables


    Up to this point we have been declaring functions in the following literal manner:


    function x () { return 5; }


    However, we could also assign a function to a variable like this:


    **var x =** function { return 5; }**;**


    Notice the semicolon at the end. This is because the whole variable declaration
    is in itself a statement. Statements are complete command sentences given to JavaScript
    and they usually terminate with a semicolon which separates them from the next
    statement.


    *Wait, I still don’t get it. I don’t see a semicolon on a function declaration
    like we have done before. Why does this one get a semicolon?*


    The semicolon has nothing to do with the function. A function in itself is not
    a complete command statement until it is called in. When we call a function, like
    for example ***x();*** we add a semicolon. The earlier semicolon in question had
    to do with the variable assignment. When we assign a value to a variable we terminate
    the assignment with a semicolon because the assignment is a command sentence,
    or an expression.


    The same goes for any other assignment such as an array:


    **var y =** [1,2,3]**;**


    Or as for object assignments:


    **var z =** {"color": "green"}**;**


    Or function assignments:


    **var z =** function(){ return 5; }**;**


    ### What is an anonymous function?


    In the previous example, the function is known to be an *anonymous* function because
    it has no proper name. z is just some variable that points to it.


    However, without z the function ceases to exist because the browsers will clear
    it from memory since it has nothing point at it. Any loose objects in memory get
    discarded because they cannot be identified (remember functions are also objects).


    ### Using variables as pointers


    Speaking of pointers, the previous variable z points to the function assigned
    to it. We could use more than one pointer by assigning the “contents” of z to
    another variable.


    **Take for example the following function assignment:**


    var z = function(){ return 7; };


    **Now assign**  ***a*** **to** *z* **and** *b* **to** *a* **to see what happens:**


    var a = z;


    var b = a;


    Remember, assignments are from right to left.


    **What is the content of variable z? **


    The content of variable z is ***function(){ return 7; }***. That’s right, the
    function script (the string of words and symbols that make up the function)  is
    the content of variable z, or what z evaluates to by itself. The only time we
    get the value 7 is when we call the function by post fixing a pair of parentheses
    to z: **z();**


    Because the ***value*** of z is a function script, when we assign ***z*** to ***a***,
    or ***z*** to ***b***, we are assigning the script of the function. This is very
    powerful in JavaScript because it means that we can plug in an existing function
    anywhere in the program and as many times as we need to.


    Now we are able to call the function with any of the three variables:


    a(); // returns 7


    b(); // returns 7


    z(); // returns7


    **In summary**


    Remember, an expression is anything that evaluates to a one unit. This unit is
    what JavaScript actually sees from the code we write, not what the code looks
    like to the human eye. As programmers we need to think like a computer by knowing
    what the computer is going to see when it encounters an expression.


    1- What is the value of expression z?


    *Ans*: function(){ return 7; }


    2- What is the value of z();


    *Ans*: 7


    3- What is the value of expression a?


    *Ans*: function(){ return 7; }


    4- What is the value of expression ***a( )***?


    *Ans*: 7


    5- What is the value of expression b?


    *Ans*: **function(){ return 7; }**


    6- What is the value of expression ***b( )***?


    *Ans*: 7'
