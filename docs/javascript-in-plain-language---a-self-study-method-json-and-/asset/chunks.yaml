  trans: "\n在数组\n\n`var y = [\"grape\", \"apple\", \"banana\"];`\n\n`y.indexOf(\"\
    banana\");` <-- 返回 2（对应位置 2）\n\n`y.indexOf(\"chestnut\");` <--- 返回 -1（表示“未找到”）\n\
    \n#### 示例：\n\n在\n\n`var y = [\"grape\", \"apple\", \"banana\"];` 中\n\n我们可以检查 *chestnut*\
    \ 是否存在，并编写脚本与用户对话：\n\n```javascript\nif(y.indexOf(\"chestnut\") < 0) {\n  console.log(\
    \ \"Not found, would you like to add it?\");\n}\n```\n\n输出为：\n\n“*Not found, would\
    \ you like to add it?*”\n\n然后我们将像在之前的实验工作中做的那样，编写一个脚本将 *chestnut* 添加到数组中。\n\n\
    * `< 0` 部分用于检查 `indexOf` 是否为 -1，这意味着该项目不存在。\n* 另一方面，`index` 为零或以上，则意味着该项目已在数组中。\n\
    * 每个 `index` 对应一个项目的位置。\n\n### pop() 和 shift()\n\n`push()` 的相反方法是 `pop()`，`push()`\
    \ 是用于向数组顶部或最右侧添加项目的方法。\n\n想想《拔老鼠》（Pop! Goes the Weasel）！\n\n`pop()` 从数组的最末尾移除一个项目。\n\
    \n在\n\n`var y = [\"grape\", \"apple\", \"banana\"];` 中\n\n`y.pop();`\n\n将移除 \"\
    banana\"。现在 `y` 只有 [\"grape\", \"apple\"]\n\n`shift()` 是 `unshift()` 的相反方法。\n\n\
    我们 *unshift* 所有项目以便在底部或最左侧插入一个项目。\n\n当我们从底部或最左侧移除一个项目时，所有其他项目都会向下移动。\n\n让我们移除当前位于数组\
    \ `y` 第一个项目 *\"grape\"*：\n\n`y.shift();`\n\n注意 `pop()` 和 `shift()` 在括号中均不接受任何参数。这是因为它们专门用于移除最后一个或第一个项目，而不是某个命名的项目。\n\
    \n你还记得如何把项目放回去吗？\n\n`y.push(\"banana\");`\n\n`y.unshift(\"grape\");`\n\n现在数组 `y`\
    \ 回到了原始状态：\n\n[\"grape\", \"apple\", \"banana\"]\n\n### slice()\n\n`slice()` 方法从一个数组中提取特定项目，并以相同的格式类型输出这些项目：数组。\n\
    \n这意味着，如果我们通过将其赋值给另一个变量来获取输出，我们就了另一个数组。\n\n#### join() 和 slice() 之间有什么区别？\n\n\
    * `join()` 将输出转换为 `string` 类型值。我们使用括号来确定字符串单词将如何分隔。\n* `slice()` 将输出从数组转换为另一个数组。由于我们不需要确定如何分隔项目（因为它们已经是分开的），我们利用括号来*传入*一些其他参数，如下所示：\n\
    \n`myArray.slice(0,4);` <-- 0 是输出中包含的第一个位置，4 是被排除在外的第一个位置。\n\n#### 示例：\n\n在\n\n\
    `var fruits = [\"apples\", \"bananas\", \"blueberries\", \"grapes\", \"avocado\"\
    , \"peaches\"];` 中\n\n我将声明一个新的数组并使用 `slice()` 从 `fruits` 数组中提取一些水果项目：\n\n`var\
    \ pickedFruits = fruits.slice(0,4);`\n\n数组 `pickedFruits` 现在包含：\n\n[\"apples\"\
    , \"bananas\", \"blueberries\", \"grapes\"]\n\n* 两个参数 (0,4) 具有以下含义：\n    * 第一个参数表示要提取的第一个位置。\n\
    \    * 第二个参数表示排除在提取之外的第一个位置。\n      (0,1) 将只提取 *apples*，因为它排除了位置 1 的 bananas。\n\
    \      (1,4) 将提取 *bananas, blueberries, grapes*，因为它从位置 1（位置一）即 *bananas* 开始提取，并从位置\
    \ 4（即 *avocado*）处开始排除。\n\n关于 `slice` 的更多高级技巧，请参阅我的电子书：\n\n[JavaScript Objects\
    \ Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)。\n\
    \n### splice()\n\n数组方法 `splice()` 非常有趣。你还记得 `push()` 和 `unshift()` 吗？它们将项目添加到数组的末尾或开头，对吧？\n\
    \n* `splice()` 将项目添加到数组的特定位置。\n\n让我们看看它是如何工作的。\n\n根据你在括号中使用的参数数量，你可以执行以下操作：\n\n\
    a) **删除项目模式**：\n\n当你只使用**两个参数**时，你正在以以下方式提供**索引位置**：\n* *第一个参数*：操作开始的位置（包含），\n\
    * *第二个参数*：将移除多少个项目。\n\n在某种程度上，仅有两个两个参数意味着删除，因为没有要添加的内容。\n\n`splice(0,3)`（解释见下文）\n\
    \nb) **添加项目模式**：\n\n如果你插入了**两个以上的参数**，**第三个**及后续参数是**要插入的数据**，在这种情况下，JavaScript\
    \ 假设你想向数组插入项目。\n\n`splice(2,0, \"yellow\")`\n\n在仅添加模式下，第二个参数是*零*。\n\nc) **替换项目模式**：\n\
    \n如果我们使用两个以上的参数且第二个参数大于零，我们就会用新项目替换现有项目。\n\n`splice(2,1, \"orange\")` // 这将索引\
    \ 2 处的项目替换为 \"orange\"。\n\n\n"
- fmt: "\nWe have just deleted `blue, red, green` from array `x`.\n\n### 3- Call in\
    \ the array: `x;`\n\nIt returns `[\"violet\", \"brown\"]` because the original\
    \ items in positions 0,1,2 were deleted.\n\n### Adding items with `splice()`:\n\
    \n### 4- Let’s add our items back into the array, starting at position zero and\
    \ without deleting any items in exchange: `x.splice(0,0, \"blue\",\"red\",\"green\"\
    );`\n\n### 5- Call the array: `x;` returns `[\"blue\", \"red\", \"green\", \"\
    violet\", \"brown\"]`.\n\nWe started at position zero and added all the listed\
    \ items, and deleted zero items.\n\nYou may not use `splice()` extensively on\
    \ your programming but it is a great tool to understand and call upon it when\
    \ needed.\n\nThere are many more methods we can use with arrays. Learning all\
    \ of them at once is just overwhelming. It may be a good idea to acquire my other\
    \ [book](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)\
    \ about JavaScript library methods for reference purposes and for an easy explanation\
    \ on how they all work. If I thought it would help to include all the other methods\
    \ here at once, I would have done it. Of course you can always search and hope\
    \ not to get confused or sidetracked by some bogus explanation on the internet.\
    \ Knowing these tools is an important step to become a master in the craft.\n\n\
    ## 2.12 Lab work 9\n\nNOTE: If you want to do this exercise along with me jump\
    \ the next 14 steps.\n\nReserve this page for future practice.\n\n### 1- Take\
    \ the following array `y` as an example and sort the array:\n\n```javascript\n\
    var y = [\"grape\", \"apple\", \"banana\"];\n```\n\n### 2- Now assign to a new\
    \ array `mySort`, the contents of the sorted array `y`.\n\n### 3- Test `mySort`\
    \ by displaying its contents on the Console.\n\n### 4- Now, display the array\
    \ `mySort` in a `string` type format and split the items with 1 blank space. Hint:\
    \ use `join()`.\n\n### 5- Now, instead of just displaying it, assign the items\
    \ from `mySort` to a new variable `z`, but in a string format. Use a combination\
    \ of `space, forward slash, and space` as a separator.\n\n### 6- Call `z`.\n\n\
    ### 7- Use the `indexOf()` method to find the position of \"banana\" in array\
    \ `y`.\n\n### 8- Test for the existence of \"banana\" in array `y` ( use an if\
    \ conditional statement), and display the following message on the screen using\
    \ `console.log()`:\n\n```\n\"banana is contained in array y\"\n```\n\n### 9- Using\
    \ the same method as the last exercise, look for \"chestnut\", then display two\
    \ messages, one for `if()` and another for `else` as follows:\n\n`\"chestnut is\
    \ contained in array y\"` \nelse: `\"chestnut is not found in array y\"`.\n\n\
    ### 10- Remove the last item of array `mySort` using `pop()`:\n\n### 11- Remove\
    \ the first item of array `mySort` using `shift()`:\n\n### 12- The array `mySort`\
    \ should now only contain \"banana\".\n\nAdd \"chestnut\" as the last item. Use\
    \ `push()`.\n\n`mySort` should now have 2 items, `[\"banana\", \"chestnut\"]`.\n\
    \n### 13- Using `splice()`, insert \"apple\" in array `mySort` at position 1 (as\
    \ a second item). Do not delete any existing item.\n\n`mySort` should now contain\
    \ `[\"banana\", \"apple\", \"chestnut\"]`.\n\n### 14- Using `slice()`, create\
    \ a new array named `newArray` with a copy of the second and third items (\"apple\"\
    \ and \"chestnut\") from `mySort` array. The `newArray` should now contain `[\"\
    apple\", \"chestnut\"]`.\n\n(*See my results on the next page.*)\n\n## Answers\
    \ to Lab work 9:\n\n### 1- Take the following array `y` as an example and sort\
    \ the array:\n\n```javascript\nvar y = [\"grape\", \"apple\", \"banana\"];\ny.sort();\n\
    ```\n\nIt returns `[\"apple\", \"banana\", \"grape\"]`\n\n### 2- Assign a new\
    \ array named `mySort` to the contents of a sorted array `y`:\n\n```javascript\n\
    var mySort = y.sort();\n```\n\n### 3- Test `mySort`:\n\n```javascript\nmySort;\n\
    ```\n\nIt returns `[\"apple\", \"banana\", \"grape\"]`\n\n### 4- Now display the\
    \ array `mySort` is a string type format, and split the items whit 1 blank space.\
    \ Hint: use `join()`:\n\n```javascript\nmySort.join(\" \");\n```\nor you might\
    \ have done this which is also correct:\n\n```javascript\nconsole.log(mySort.join(\"\
    \ \"));\n```\n\nIt returns `\"apple banana grape\"` in a string format.\n\n###\
    \ 5- Now, instead of just displaying it, assign the items from `mySort` to a new\
    \ variable `z`, but in a string format. Use a combination of space, forward slash,\
    \ and space as a separator:\n\n```javascript\nvar z = mySort.join(\" / \");\n\
    ```\n\n### 6- Call `z`:\n\n```javascript\nz;\n```\n\nIt returns `\"apple / banana\
    \ / grape\"`\n\n### 7- Use the `indexOf()` method to find the position of \"banana\"\
    \ in array `y`:\n\n```javascript\ny.indexOf(\"banana\");\n```\n\nIt returns 1,\
    \ which means that \"banana\" exists and is located on position 1 (second item).\n\
    \n### 8- Test for the existence of \"banana\" in array `y` ( use an if conditional\
    \ statement), and display the following message on the screen using `console.log()`:\n\
    \n```javascript\nif (y.indexOf(\"banana\") >= 0) {\n    console.log(\"banana is\
    \ contained in array y\");\n}\n```\n\n### 9- Using the same method as the last\
    \ exercise, look for \"chestnut\", then display two messages, one for `if()` and\
    \ another for `else` as follows:\n\n```javascript\nif (y.indexOf(\"chestnut\"\
    ) >= 0) {\n    console.log(\"chestnut is contained in array y\");\n} else {\n\
    \    console.log(\"chestnut is not found in array y\");\n}\n```\n\n### 10- Remove\
    \ the last item of array `mySort` using `pop()`:\n\n```javascript\nmySort.pop();\n\
    ```\n\n### 11- Remove the first item of array `mySort` using `shift()`:\n\n```javascript\n\
    mySort.shift();\n```\n\n### 12- The array `mySort` should now contain \"banana\"\
    .\n\nAdd \"chestnut\" as the last item. Use `push()`.\n\n```javascript\nmySort.push(\"\
    chestnut\");\n```\n\n### 13- Using `splice()`, insert \"apple\" in array `mySort`\
    \ at position 1 (as a second item). Do not delete any existing item.\n\n```javascript\n\
    mySort.splice(1, 0, \"apple\");\n```\n\n### 14- Using `slice()`, create a new\
    \ array named `newArray` with a copy of the second and third items (\"apple\"\
    \ and \"chestnut\") from `mySort` array.\n\n```javascript\nvar newArray = mySort.slice(1,\
    \ 3);\n```\n\n## 2.13 Lab work 10\n\n### Building a mechanism to fetch a variable\
    \ from an array\n\nThis exercise will review variable assignments, and creating\
    \ arrays with variables as elements, plus function declarations, reassignment\
    \ of variables and the usage of `indexOf`. The idea is to call a function and\
    \ select a language as an argument. Then, based on the language selected, the\
    \ correct sentence will be displayed. Does it sound interesting?\n\nExample:\n\
    \nWhen calling `show(english);`\n\nThis sentence gets displayed:\n\n\"The quick\
    \ brown fox jumped over the lazy dog\"\n\n* Notice how `english` is not wrapped\
    \ in quotes (and it is in lower case). That tells us that it must be a variable\
    \ name, not a string.\n\nI have used [Google Translate](https://translate.google.com/)\
    \ to convert my sentences from English to Portuguese and Spanish (and later French).\
    \ My apologies to native speakers if it sounds funny, it is well intended.\n\n\
    ***Please do the exercise on your own. A link to my own file will be given in\
    \ the end. Interim files will also be available so that you can check your work.***\n\
    \n### 1- Declare three variables named *english*, *portuguese*, *spanish*.\n\n\
    Respectively, assign to each one of them the following sentences:\n\n(Link to\
    \ convenient copy/paste: [raw file](http://icontemp.com/jpl/fox.txt) | bit.ly/1mpqCsr\
    \ )\n\n\"*The quick brown fox jumped over the lazy dog*\"\n\n\"*A ligeira raposa\
    \ marrom saltou sobre o cão preguiçoso*\"\n"
