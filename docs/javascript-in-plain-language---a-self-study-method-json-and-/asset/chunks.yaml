    \ and consecutive arguments are **data to be inserted**, and in that case JavaScript\
    \ assumes you want to insert items into the array.\n\n**splice(2,0, \"yellow\"\
    )**  \n\nIn just add mode, the second argument is *zero*, which means that no\
    \ items will be deleted in exchange for the items we are adding with the third\
    \ and consecutive parameters.\n\nor...\n\nc) **Replace items** mode.\n\nIf the\
    \ second parameter in ***add mode*** is anything other than zero, this number\
    \ will indicate how many items will be deleted in exchange for the items being\
    \ added.\n\n**splice(2,1, \"yellow\")**\n\nFor example, **splice(0,3)** means\
    \ to delete 3 items: the first, the second and the third. Number 3 represents\
    \ the quantity of items to be removed. The number 3 coincides with the third item\
    \ on the array but it is not necessarily so. If we had splice(2,3) it would remove\
    \ the third, fourth and fifth items, which correspond to positions 2,3,4 and counting\
    \ from zero.\n\n*   The 3^(rd) and consecutive arguments represent the items to\
    \ be inserted.\n\nFor example,\n\n**splice(2,0,  \"yellow\")** means to insert\
    \ *yellow* in position two (third item) and un*shift* the others because the *zero*\
    \ means that no items are to be deleted.\n\n**splice(2,1,**  **\"yellow\")** it\
    \ means to add *yellow* to position 2 ( third item) and remove whatever is there\
    \ (this is a replacement due to the second argument being anything other than\
    \ zero).\n\nSee the next image for a better view of these concepts.\n\n![](images/00013.jpeg)\n\
    \nFig 13\n\n*   Please note that, unlike other implementations where we were displaying\
    \ items, with splice() we are actually editing the original array. It is a permanent\
    \ operation just like sort().\n\nWe could also use splice() to remove and transfer\
    \ some items into  a new array (sort of what we did with slice(), except that\
    \ now we are also editing the original array)\n\n**Here’s an example using the\
    \ following array:**\n\nvar x =[\"blue\",\"red\",\"green\",\"violet\",\"brown\"\
    ];\n\na) Splitting the array by copying the first three items into ***newArray***\
    \ before deleting them:\n\n**var newArray = x.splice(0,3);**\n\nb) Call array\
    \ x:\n\n**x;**\n\nIt returns [\"violet\", \"brown\"]\n\nc) Call array newArray:\n\
    \n**newArray;**\n\nIt returns [\"blue\", \"red\", \"green\"]\n\nWe have split\
    \ the contents of *x* into two different arrays. Had we used *slice()* instead\
    \ of *splice()* we would still have the original array ***x*** intact.\n\n***In\
    \ summary***, splice() is very versatile and it can be used in place of push(),\
    \ pop(), unshift() and shift() whenever we need to address a specific position\
    \ in the array instead of generically using the end or the beginning of the array\
    \ to insert or delete items.\n\nIf at this time your head is spinning with so\
    \ much information know that you’re not alone. You don’t really have to memorize\
    \ these methods. What you really need to do is to understand how they work. Then\
    \ later when you need to use them you can always come back and review the concepts\
    \ one more time. Eventually they will become part of your internal toolset. Just\
    \ make sure you understand how they work.\n\nLet’s practice a bit more to make\
    \ sure you get the idea!\n\n### Splice lab work\n\nLet’s try a few samples to\
    \ illustrate the concept of splice().\n\n**Deleting** items with splice( ):\n\n\
    1- On your Console declare the following array:\n\n**var x = [\"blue\",\"red\"\
    ,\"green\",\"violet\",\"brown\"];**\n\n2- Delete 3 items starting at positions\
    \ 0 which is *blue*.\n\nExclude from deletion position 3, which *violet*: **x.splice(0,3);**"
