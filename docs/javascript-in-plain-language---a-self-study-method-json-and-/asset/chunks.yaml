    我没有写任何 JavaScript 代码。AngularJS 负责了内部处理。这是一种更高层次抽象的编程方式。我们还需要了解 JavaScript 吗？当然需要！当我们跳出这些简单的测试时，你对
    JavaScript 的知识将变得至关重要。


    ## 我必须一直在我的网页上包含这些表达式吗？


    不需要，我们这样做只是在引入模块和控制器之前，为了测试和理解之目的。但是的，你可以在生产环境中一直这样做，它对于简单的内容是有效的。


    ### ng-init


    让我们引入另一个指令，这样我们就有更多的工具可以玩了。


    *   `ng-app` 指令初始化 AngularJS 应用。

    *   `ng-init` 指令初始化要在应用程序中使用的数据。


    让我们看看 `ng-init` 在最简单的形式下工作的：


    1- 打开你的基础 HTML 脚本，修改 HTML 标签以包含如下第二个指令：


    ```html

    <html ng-app ng-init="city=''Harrisburg''; state=''Pennsylvania''">

    ```


    2- 然后在 body 中编写以下内容：


    你知道 {{city}} 是 {{state}} 的首府吗？


    3- 将其保存为 `ang5.html` 并进行测试。


    你应该会在浏览器显示中看到以下句子：


    Do you know Harrisburg is the capital of Pennsylvania?


    ![](img/00027.jpeg)


    Fig 26 [raw file](http://icontemp.com/jpl/ang14/ang5.txt) | [html](http://icontemp.com/jpl/ang14/ang5.html)


    ## 你看到发生了什么吗？


    我们通过 `ng-init` 初始化两个变量：`city` 和 `state`，然后我们通过 HTML 输出上的两个表达式标签来处理它们。不需要通过复杂的脚本来处理
    DOM。有更好的方法可以实现这一点，但目前的目标是熟悉 AngularJS 的基本工具。


    通过在 HTML 标签上初始化参数 `city` 和 `state`，它们变得可以在网页上可以使用了。然而，这些变量通常被放置在单独的表格中。


    ### ng-bind


    为了说明双大括号的作用，让我们用不同的方式编写相同的脚本：使用一个名为 `ng-bind` 的指令。


    6- 我只对变量 `city` 这样做，而对变量 `state` 不这样做，只是为了展示两者将如何工作：


    ```html

    Do you know <span ng-bind="city"></span> is the capital of {{state}}?

    ```


    显示将是：


    Do you know Harrisburg is the capital of Pennsylvania?


    实际上，AngularJS 在其内部处理过程中始终会将大括号替换为 `ng-bind`。如果你不在意编写额外的 SPAN 标签，这实际上运行速度会快一点。当你刷新页面（Windows
    上的 `CTRL f5`）并关注输出结果时，你会发现 Harrisburg 立即出现，而 Pennsylvania 会先显示大括号，然后转换为正确的单词。这发生得很快，但你可能捕捉到它。


    ## ng-bind 是做什么的？


    它将数据源绑定到目标。不再需要玩 `getElementById` 这种 DOM 游戏了。


    关于 AngularJS 绑定还有很多需要了解，但我们需要慢一点，只需掌握足够理解后续内容的。这就像那句名言“[罗马不是一天内建成的](https://en.wikipedia.org/wiki/Rome_wasn%27t_built_in_a_day)”。


    ### ng-cloak: 避免显示闪烁


    当使用大括号 `{{ }}` 而不是 `<span ng-bind="city">` 时，你可能会注意到显示上有一个快速的闪烁，因为大括号尚未被 AngularJS
    求值。


    如果这对你来说是一个问题，请将库的链接包含在 HEAD 部分而不是 BODY 部分。这样，大括号将在浏览器显示文档之前被求值。将链接包含在头 中可能会产生一些副作用，取决于你页面的复杂程度，这也是为什么越来越多的开发者将库链接移动到页面底部的原因。


    如果你在页面上嵌入了 AngularJS 但没有访问 HEAD 脚本的权限，你可以使用 `ng-bind` 代替大括号，或者使用 `ng-cloak`。


    由于 `ng-cloak` 涉及 CSS，我在这里不再进行描述。请查看以下链接以获取有关此实现的完整描述：


    [ng-cloak](https://angularjs.org/docs/directive/ngcloak)


    ## 5.4 实验工作


    ### A 部分：初始化变量并输出计算


    在这个新练习中，我们想要初始化两个变量，


    `length=9` 和 `width=3`


    然后输出以下段落：


    **如果长度为 9 宽度为 3，那么周长为 24。**


    请记住，在写着 9 和 3 的地方，动态标记应该写成


    {{length}} 和 {{width}}


    稍后它们会被赋值给每个变量的值替换。


    至于总数 24，它应该是矩形的周长。你可以使用自己的公式。


    我将使用 `length * 2 + width * 2` 作为我的表达式。


    完成脚本后，请将其与我的进行对比：


    [forum](http://jsplain.com/javascript/index.php/Thread/37-Lab-14b) | bit.ly/1rk2KW8
