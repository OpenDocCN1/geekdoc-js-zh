    这是可以在机器之间进行传输的数据。然而，**这还不是一个有效的 JSON 对象**，像这样使用可能会导致传输不安全。它需要外层大括号和一个用于数组的键名，才能成为一个良好的
    JSON 数据格式，正如我们在下一张图片中所看到的。


    通过这种编写方式（加上外层大括号），我们可以将其输入任何能够将 JSON 数据转换为其自身格式的机器中，就像 XML 一样，只不过 JSON 的实现更简单。


    一段时间以来，网页一直通过交换 JSON 数据与服务器进行通信。我的意思是页面在你的浏览器中加载，每当你点击动态字段时，页面保持不变，但数据通过 JSON
    数据格式交换进行更新。这就是为什么意识到这项技术是必须的理由之一。


    *   **记住：** JSON 格式的文本在语法上也是合法的 JavaScript 代码。然而，反过来或者另一种情况可能并不成立。这就是为什么，当我们之前学习创建对象时，我选择将键括在双引号中，使其成为
    JavaScript 和 JSON 的合法语法。


    下一张图片将显示一个更详细的 JSON 对象示例。你会看到外层对象被划分为两个键：`staff` 和 `management`。


    这些键中的每一个 `staff/management` 都将拥有一个 `array` 作为值。数组将包含若干个对象形式的单独记录。每个对象代表员工层或管理层的一名员工。让我们看看图片：


    ![](img/00019.jpeg)


    图 19 查看[原始文件](http://icontemp.com/jpl/json1b.txt) | bit.ly/1uF1qNH


    你看到它是做的了吗？有两个属性：`staff` 和 `management`。


    在我们的示例中，属性 `staff` 包含分配给它的人的 `array`，并且每个人都是一个带有自身数据的对象。目前我们只有 "Tony" 作为员工，只有
    "Judy" 作为管理人员，但我们可以在 "Tony" 或 "Judy" 的闭合括号后添加一个逗号，并在每个数组中添加另一个人，正如你在页面下方的图片看到的那样。


    不要在这里困惑。创建 JSON 数据结构并不一定需要数组。我们可以在 JSON 结构中表示数组、字符串、数字和对象。每个标识符都需要括在双引号中，数字除外，引号是可选的。（之前提到的，如果数字包含在数组中，始终对数字加双引号，以符合禁止混合数组的编程语言）。


    ### 使用 jsonlint，一个检查 JSON 校验的工具


    为了查看代码块在 JSON 语法上是否编写正确，我们可以使用一个名为 [jsonlint](http://jsonlint.com/) (jsonlint.com)
    的在线工具对其进行检查。该工具是避免错误或不安全的 JSON 数据脚本的一个重要检查。


    **练习题：**


    1- 从上一张图片中复制代码并将其粘贴到 `jsonlint` 的框中。然后点击 `validate`。如果一切都写得正确，你应该会在页面上看到一条绿色的条。


    2- 尝试删除一个括号、添加一个变量名或添加一个分号，看看它是否仍然通过校验。


    ### 将 JSON 对象赋值给变量


    现在，如果我们想在目的地接收数据后对其进行操作，我们需要将其赋值给一个变量。该变量将指向内存中的数据，以便我们对其进行引用。这就是 JavaScript 的用场：我们在
    JSON 格式中移动数据，并在目的地如果我们想进一步处理数据，就会将数据赋值给变量。


    下一张扩展图片将显示我们如何为 JSON 对象分配一个 `variable`（变量）。


    **记住**，在编写代码时，如果你想用 [jsonlint](http://jsonlint.com/) 验证你的 JSON 数据，你必须在将 JSON 数据赋值给变量之前以及在末尾添加分号结束语句之前进行。


    ![](img/00020.jpeg)


    图 20 查看[原始文件](http://icontemp.com/jpl/json1.txt) | bit.ly/1DwXd57.


    3- 在这一步，用更多数据扩展你自己的对象，或者从图片 20 下方的原始文件中复制它。


    如果你正在编写自己的脚本并想用 `jsonlint` 验证它，请在添加变量（例如：`var employees =`）和最后的分号之前进行，然后将变量 `employees`
    赋值给对象。


    现在我们已经将 JSON 对象赋值给变量 `employees`，我们可以对**编辑**、**添加**、**删除**和**显示**数据或部分数据，因为该对象有一个我们可以引用的
    `name`（名称）。


    ### 编辑 JSON 对象


    属性键 `staff` 被分配了一个 `array`。决定使用数组是为了我们可以包含多个对象作为 `staff` 的一部分。数组中的每人本身都是一个对象。键
    `management` 也是如此。


    **练习题：**


    4- 如果你还没有这样做，复制原始文件并将其粘贴到 JavaScript 中。


    5- 我们如何引用 `staff` 以获取成员列表？


    我们可以以以下方式使用点语法：


    ```

    employees.staff

    ```

    这将给出员工列表。控制台可能会显示对象的简短版本，如下：


    ```

    object

    ```


    这将得到每个对象的列表。查看下方图片查看控制台的输出。


    ![](img/00021.jpeg)


    图 21


    注意：`proto` 属性是适用于该对象的库方法列表，它与 JSON 无关且不可移植。我们在[第 2 卷](https://www.amazon.com/JavaScript-Objects-Functions/dp/B00GDEPB/)书中涵盖了这些库方法。


    6- 我们如何引用 `staff` 数组中的第一个对象？


    ```

    employees.staff[0];

    ```

    解释：


    我们从外部对象 `employees` 开始，然后引用它的 `staff` 成员。然后，由于 `staff` 持有对象数组，我们引用位于零处的第一个元素，结果如下：


    *Object {firstName: "Tony", lastName: "deAraujo", age: 99}*


    7- 现在尝试引用 `staff` 数组中包含 `Mary` 的对象。她是 staff 数组的第三个元素，对应位置 2。


    在此处查看结果：[原始文件](http://icontemp.com/jpl/json2.txt) | bit.ly/1sWuXAy。


    8- 我们如何向 `staff` 类添加一个新员工？


    这是我们需要添加的新员工：


    "firstName":"Loren", "lastName":"Santos", "age":29


    由于 Loren 是一个需要添加到数组的对象，我们可以使用数组方法 `push()` 将其推入 staff：（参见[原始文件](http://icontemp.com/jpl/json3.txt)
    | bit.ly/1wKTPPB )。


    ```

    employees.staff.push({"firstName":"Loren", "lastName":"Santos", "age":29});

    ```


    9- 尝试向 employees `management` 添加新成员，例如：


    "firstName":"Peter", "lastName":"Jones", "age":55


    完成后，尝试在其分配给 management 的数组中的位置引用这个新成员。


    查看：[原始文件](http://icontemp.com/jpl/json4.txt) | bit.ly/1tXHoQM


