    ## 2.6 for 循环


    我们将学习如何填写“for 循环”样式的*形式请求*，因为它将在我们的下一个项目中使用。


    *for 循环*的理念是按照指定的次数自我重复。


    基础的形式声明有一个头部和一个体，如如下[伪代码](http://en.wikipedia.org/wiki/Pseudocode)代码所示：


    *for (x 从 0 开始； 且 x 小于 5；增加 x) { 执行此代码 }*


    ![](img/00009.jpeg)


    图 9


    在这个形式中有三个指令需要被评估，因此用分号分隔前两个指令（以使它们相互独立）。


    ***x 从 0 开始；***


    在这里 JavaScript 将 x 存储为值为 0 的临时变量。名称 *x* 并不重要，大多数程序员使用名称 *i*。正确的脚本是：


    for(var x = 0; *或者* for (var i = 0; 等...


    ***且 x 小于 5；***


    此时 JavaScript 评估此条件。由于 *x* 小于 5（因为它是 0），所以条件是*真*的，JavaScript 执行体中的代码一次。正确的表达式是：


    x < 5;


    ***增加 x*** ++


    在 JavaScript 第一次运行代码块（步骤 3）之后，它会返回 *for 循环*声明并增加 *x* 的值（步骤 4）。现在 *x* 是 1 而不是 0。

