    # In conclusion


    Thank you for staying with me until the end of this project. I always feel a bit
    emotional when I get to this part.


    There is so much I haven’t written about JavaScript and AngularJS, but we need
    to take a break in order to digest all we have covered in this book.


    It is my belief that I have provided the necessary boost for you to feel empowered
    and continue your own journey, and if you ever have a question that I may be able
    to help, I’m only a click away on the [new forum platform](http://jsplain.com/javascript/index.php/Thread/49-Directives-Summary-and-Resources/)
    purposely created for this project.


    Please take the time to reread this book and practice all the exercises again.


    If you feel like expanding your JavaScript understanding, my other [eBook](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)
    is all about the JavaScript library methods, objects, closures and memory management.


    As for AngularJS, it is a whole new world and there is so much to write about
    it. We have covered the hardest part of learning to use AngularJS, the very initial
    concepts.


    **Update:** There is a new supplemental exercise eBook if you want to do more
    AngularJS exercises. Please take a look:


    [AngularJS Supplement: Easy Projects on Filters and Directives](http://www.amazon.com/AngularJS-Supplement-Projects-Filters-Directives-ebook/dp/B016FOYH8A/)


    Thank you dear reader, I hope this has been time well spent.


    Tony de Araujo


