    ## 1.11 引入 `console.log`, `alert`, `prompt`, `confirm`


    到为止，我们一直通过直接输入变量名并按回车键来测试变量的值。


    这之所以有效是因为我们正在使用测试控制台。


    然而，随着我们的脚本变得越来越复杂，我们需要一种更显式的机制将数据输出到屏幕上。


    这就是 `console.log()` 派上用场的地方。


    ### `console.log`


    控制台有一种通过名为 `log()` 的机制显式记录数据到屏幕上的的方法。


    要显示的数据放在括号内。如果这些数据是字符串形式，我们用引号括起来。然而，如果数据来自变量或数字，我们总是不带引号地编写变量名或数字。


    示例：


    `log("Hello bluebird");` <-- 这种写法行不通。在你的控制台上尝试之前，请稍后阅读页面底部的注释。


    另一个示例是 `log(x)`。如果 `x` 是一个已声明的变量，这将显示 `x` 的值。如果 `x` 不是变量，JavaScript 将抛出错误，因为任何不是变量的单词应该像这样放在引号中：`log("x")`。


    我们还可以组合字符串和变量：


    例如：


    ```javascript

    var x = "big bird";

    log("Hello" + " " + x);

    ```

    这将显示 *Hello big bird*


    或者如果你还记得，我们可以这样做：


    ```javascript

    log("Hello " + x);

    ```


    **注意：**


    `log()` 本身无法工作。我们需要使用点符号语法（Dot syntax）将 `log()` 绑定到 Console（小写 c）：


    ```javascript

    console.log("Hello " + x);

    ```


    这是使用 `log()` 的正确方式，即通过点语法将 console 附加到 log() 上。注意 console 是小写的。在编程时引用控制台的正确方式是小写的
    `console`。它是一个名为 `console` 的对象。console 的大写将无效，因为 JavaScript 是区分大小写的。


    这里有更多示例：


    ```javascript

    console.log(3 + 5); // 显示 8

    console.log(3 > 5); // 显示 false

    ```


    或者字符串与数字比较的组合：


    ```javascript

    console.log("3 > 5 is " + (3 > 5)); // 显示 3 > 5 is false

    ```


    ### `alert()`


    除了 `log()`，我们通过 `window` 对象调用 `alert()` 来弹出对话框：


    ```javascript

    window.alert("hello!!");

    ```


    **为什么是 window？**


    `window` 对象是我们在浏览器上所做一切的母体。甚至 Console 也运行在 `window` 下（与微软无关）。


    ```javascript

    console.log("hello!");

    ```


    ### `confirm()` 和 `prompt()`


    另一个流行的对话框是 `confirm()`


    就像 `alert()` 一样，`confirm()` 也来自 `window`，我们通常这样编写：


    ```javascript

    confirm("确定要继续吗？");

    ```


    它会弹出一个消息，我们点击两个按钮之一：确定或取消。*确定*将返回布尔值 `true`，而*取消*将返回布尔值 `false`。我们一定要利用这些布尔值，但在处理条件语句时会这样做。另一种输出方法是
    `prompt()`，它也可以作为输入方法。


    `prompt()` 对于收集用户信息非常有用，因为 `prompt()` 会打开一个窗口让用户引入一些数据。我们可以将这些数据赋值给变量，并使用该值创建其他结果。


    例如：


    ```javascript

    var answer = prompt("是还是否?");

    ```


    然后我们可以通过布尔结果评估答案来进一步处理答案：


    ```javascript

    answer === "yes";

    ```


    这实际上是一个 JavaScript 问题，如果答案是 "yes"，它会回答 `true`；如果答案是 "no"，则为 `false`。


