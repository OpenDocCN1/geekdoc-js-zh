  trans: "\n以台式电脑作为一个对象为例；我们可以说显示器、键盘和鼠标是台式电脑的一些属性。那么，我们也可以说 Firefox 和 Chrome 浏览器，以及\
    \ Microsoft Word 是台式电脑的方法，因为这些属性具有功能性，它们在物理意义上并不存在，我们需要像调用函数一样调用它们，才能使用它们。它们代表了台式电脑的一些方法。它们的存在是基于某些程序例程的执行。\n\
    \n当我们提到“执行”时，会立即想到函数，但函数和方法之间是有区别的：\n\n- 一个方法可能包含一个或多个函数。\n\n你看出区别了吗？一个函数可以是一个对象的方法，但它本身并不一定是一个方法。方法是一组功能的集合，用于代表对象来完成某项任务。例如，打印内容列表的方法、更新对象内容的方法、排序内容的方法，或者识别请求对象内容的人的方法等。\n\
    \n### 让我们为我们的汽车对象添加一个方法。\n\n2- 如果你一直在跟我一起写代码，请在 `rating: 9,` 后面添加一个新的逗号，因为我们正要添加另一个属性，即方法\
    \ `printRating`。（使用[编辑器](http://jsbeautifier.org/)）。\n\n3- 为标签 `printRating` 分配一个函数，在屏幕上打印以下消息：\n\
    \n`\"The car rates \" + car.rating + \" out of 10\"`\n\n![](img/00015.jpeg)\n\n\
    图 15 查看[原始文件](http://icontemp.com/jpl/car2.txt) | bit.ly/1C6I5d5。\n\n4- 让我们玩玩这个对象。将上一个原始文件中的对象脚本（或你自己的脚本）粘贴到控制台上。\n\
    \n5- 打印汽车的评分：\n\n```javascript\ncar.printRating();\n```\n\n注意我们是如何从对象上 `call()`\
    \ 一个方法的。它的起始方式与调用任何其他属性一样，但随后我们添加了一对括号 `()`，这创建了一个函数 `action`。如果我们排除括号会发生什么？它只会打印键\
    \ `printRating` 的内容，即该函数的显式描述。当我们想要将相同的功能赋值给另一个变量时，这有时会有用，但为了执行操作，我们需要使用括号。\n\n\
    6- 括号表示法呢？我们如何使用`bracket notation`来调用方法 `printRating`？方法最好用`dot notation`调用，因为它的语法更简单（你稍就会知道原因），但理解其逻辑是有好处的，逻辑如下：\n\
    \n```javascript\ncar[\"printRating\"]();\n```\n\n没有点符号语法那么漂亮，对吧？注意括号在括号外面。所以这是点符号语法主要使用的一个领域。括号语法更多地保留给属性的动态调用。我们在\
    \ for 循环中使用括号语法，是因为在循环进行时，每个属性都需要动态访问。\n\n让我们尝试一下吧！\n\n### 遍历对象\n\n假设你知道一个对象的存在，但你并不确定它包含哪些属性。你可以遍历该对象来找到它的属性。\n\
    \n### 引入 for in 循环\n\n这个循环专门为我们一直讨论的对象编写的：\n\n在此处查看原始文件：[raw file](http://icontemp.com/jpl/car2.txt)\
    \ | bit.ly/1C6I55\n\n循环的写法如下：\n\n```javascript\nfor(var k in car){\n  console.log(k);\n\
    }\n```\n\n`for in` 循环是普通 `for loop` 的变体，体现在某些功能已经在 JavaScript 库中预编程了。让我们逐行分析：\n\
    \n`for(var k in car)` --- `k` 是由程序员引入的变量。它的目的是在每次循环计数中临时获取并持有 `key label`（即与每个循环周期位置编号匹配的标签）。\n\
    \n让我解释一下：对象在某种意义上就像数组。唯一的区别是键的映射方式。在数组中，JavaScript 将每个位置映射为位置 0, 1, 2, 3 等。但在无序列表或使用键的对象中，JavaScript\
    \ 将内部位置（无论位置是多少）映射到最初为任何给定数据值声明的键。\n\n所以，变量 `k` 的目的是计算每个位置（每个周期一次），同时获取与给定计数对应的键名，这样我们就可以获取给它的数据值。并不是\
    \ `k` 完成了这一切，而是 JavaScript 提供了此类信息并存储在 `k` 中。\n\n至于 `k` 这个名字，我们可以使用任何名字，例如 `i`，但\
    \ `k` 更有意义，因为事实上，JavaScript 将 `key` 值临时存储在变量 `k` 中，每次迭代存储一个键。所以字母 `k` 提醒我们存储那里的是什么——一个临时位置实例。你可能在领域或其他文本中看到它是\
    \ `key`、`prop` 或 `property`。\n\n（我为什么要告诉你这些？因为我不希望你开始阅读网络上的帖子时，就认为有成千种不同的 `for\
    \ in` 循环。只有一种 `for in` 循环，每个开发者只是在临时变量名上发挥创意）。\n\n回到我们的 `for k in car`，在这个例子中，我们可以使用任何名字，例如\
    \ `i`，但 `k` 更有意义，因为事实上，JavaScript 将 `key` 值临时存储在变量 `k` 中，每次迭代存储一个键。所以字母 `k` 提醒我们存储那里的是什么——一个临时位置实例。你可能在领域或其他文本中看到它是\
    \ `key`、`prop` 或 `property`。\n\n"
- fmt: "\nIn case you’re wondering about it, I don’t really know the rating for an\
    \ `Outback`, the number 9 is just for practicing purposes only.\n\n## 2.15 Lab\
    \ work 11 - redo lab work 10\n\nDo you still remember when in `Lab 10` we displayed\
    \ “The quick brown fox jumps over the lazy dog” in English, Portuguese, Spanish\
    \ and French?\n\nThere were four variables: `english`, `portuguese`, `spanish`\
    \ and `french`. Then we added the variables to an array of variable names.\n\n\
    The problem we encountered was attempting to list the array contents as variable\
    \ names, or as `key-value` pairs, like for example:\n\n`english: “The quick brown\
    \ fox jumps over the lazy dog”`.\n\nWe could not dynamically display the variable\
    \ name from the array, just the values themselves. This is because JavaScript\
    \ treated the variable as an `expression` and gave us the evaluation result, which\
    \ was the data inside of the variable. (Expressions will be further explained\
    \ on the next topic).\n\nWell, now we can! All we have to do is, instead of declaring\
    \ separate variables, we declare them as properties of an object.\n\n**Let’s do\
    \ this:**\n\n1- Create an object named `langVersion`.\n\n2- Assign to this object\
    \ four property keys: `english`, `portuguese`, `spanish`, `french`.\n\n3- For\
    \ each key add the correct value based on the following text:\n\n[raw file](http://icontemp.com/jpl/fox5a.txt)\
    \ | bit.ly/1rt9dzZ\n\nDo not declare the variables, use property keys instead\
    \ as seen on the raw file.\n\n4- You should now have a complete object.\n\nNext\
    \ create a `for in` loop outside of the object, to print out the contents of the\
    \ object. The display of each property should look something like this:\n\n`english:\
    \ \"The quick brown fox jumped over the lazy dog\";`\n\n*   See my own results\
    \ here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/23-Lab-11/)\
    \ | bit.ly/1tWQddJ\n    or the [raw file](http://icontemp.com/jpl/fox5.txt) version\
    \ | bit.ly/1ofRRkS.\n\n### Transforming the for in loop into an object method\n\
    \n5- Once you have finished the project and everything is working, reengineer\
    \ the `for in` loop so it becomes an internal method of object `langVersion` as\
    \ follows:\n\n*a)* Add a new `comma` after the original last property in the object\
    \ so that you can write another property below it.\n\n*b)* Give this new property\
    \ a label named `list` so that you can call the method later,\n\n*c)* And then\
    \ write a function as the value for `list`.\n\nInside of the function place your\
    \ current `for in` loop.\n\n6- Paste your little program on the Console and `call`\
    \ the method to see how it prints:\n\n`langVersion.list();`\n\n*   Compare your\
    \ results with mine here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/24-Lab-11b/)\
    \ | bit.ly/1uUYgbd\n    [raw file](http://icontemp.com/jpl/fox6.txt) | bit.ly/1rl24Bl\n\
    \n*Your listing displays all the properties including the method and its internal\
    \ script, right?*\n\nWe can tweak the `list method` to filter out methods from\
    \ printing as part of the list.\n\nIf you want to eliminate the method from the\
    \ printed list you can use a `conditional statement` to filter out anything that\
    \ is not of `string` type since `list()` is a function. The logic behind it goes\
    \ like this: “if the type of property is a 'string', print it”.\n\nDo you still\
    \ remember how to use `typeof`? We covered it on Lab work 1:\n\nWhen we write:\n\
    \n`typeof \"tony\";`\n\nJavaScript replies with `string`.\n\n7- Reengineer the\
    \ loop once again so that\n\n```javascript\nif (typeof langVersion[k] === \"string\"\
    ) {\n```\n\n`console.log` the desired output. No `else` is needed for this one..\n\
    \n*   Compare your results with mine here:\n    [forum](http://jsplain.com/javascript/index.php/Thread/25-Lab-11c/)\
