    CSS 并且在 HTML 页面上显示结果，你始终可以使用 CSS 文本转换属性 `capitalize`。


    *   **注意：** `toUpperCase()` 和 `toLowerCase()` 这两个词某些字母是大写，某些是小写，对吧？JavaScript
    是区分大小大小的，它认为 `A` 和 `a` 是两个不同的字符。


    我之所以这样写 `toUpperCase` 和 `toLowerCase` 并不是因为驼峰命名（camelCase）是我的首选写法；而是因为 JavaScript
    本身赋予这些方法的正确名称。如果我们写 `tolowercase`，它将无法工作。正如你记得的 `typeof` 全小写，我们不能写 `typeOf`。那将不起通。这就是控制台自动补全功能非常有用的原因之一：它消除了拼写上的疑虑。


