    ## 3- 从你自己的编辑器`或从我的链接页面`复制你的脚本并将其粘贴到控制台（Console）上。然后按回车。


    如果你遇到错误，请重新检查你的代码。调试是程序员最擅长的事情，因为他们 90% 的时间都花在上面（参见第 4 步，学习如何在控制台上重复执行）。


    当提示符出现时，输入不带引号的 `yes`。如果你的脚本构造得当，你应该会在控制台中看到以下输出：


    *Ok，让我们玩吧！*


    要从我的个人网站复制代码，请点击代码脚本右侧的`2-page 图标`。


    ## 4- 要重复执行，请将鼠标`聚焦`在控制台上并按`向上方向键`。这会带你回到上一次执行的脚本。从那里开始（如果你需要，可以对其进行编辑），然后按`Enter`
    再次运行它。


    这一次，对提示问题回答 `no`。


    你会得到响应：`ok, goodbye!*`


    ## 5- 你有没有注意到 `prompt()` 如何将你带回主浏览器，但随后你必须回过头来看控制台的答案？


    你可以将 `console.log()` 替换为 `confirm()` 或 `alert()`，以便在浏览器上也能获得答案。


    为了练习目的，将你的第一个 `console.log` 改为 `confirm()`，将第二个 `console.log()` 改为 `alert()`。不要担心这种不一致性，我们只是在练习。


    使用 `jsbeautifier` 处的编辑器编写你的脚本。


    然后像我们在步骤 3 和 4 中做的那样测试 `if, else` 的两种结果：


    ```javascript

    confirm("Ok, let''s play!");

    alert("ok, goodbye!");

    ```


    ### 复习 if(), else


    在 `if(){ do this stuff; }` 括号内部，我们包含一个条件。请记住，解锁代码块的并不是条件本身：而是你在其中编写的 `question`
    的真值（truthiness）解锁了代码。


    示例如下：


    `if(10 === 10){}` <-- 因为 10 等于 10，JavaScript 将该语句求值为 `true` 并解锁下一个代码块。


    `if(10 === "10"){}` <-- 因为 10 是一个数字而 "10" 是一个 `string`，JavaScript 将该语句求值为 `false`
    并跳过下一个代码块而不执行它。


    `var x = 33; if(x){}` <-- 因为 `x` 的值不是 `0`、`undefined` 或 `null`，该语句为 `true`。


    `if(!x){}` <-- 因为 `x` 的值不是 `0`、`undefined` 或 `null`，该语句为 `false`。


    `var y = "yes";`


    `if(y === "yes"){}` <-- 因为 `y` 的值是字符串 `yes`，该语句为 `true`。


    `if(y !== "yes"){}` <-- 因为 `y` 的值是 `yes`，该语句为 `false`。


    `if(y === "no"){}` <-- 因为 `y` 的值是 `yes`，该语句为 `false`。


    `if(y === "no" || y === "yes"){}` <-- 因为其中一个语句为 `true`，所以语句为 `true`。


    `if(y === "no" && y === "yes"){}` <-- 因为其中一个操作数为 `false`，所以该语句为 `false`。


    ### 那 else 呢？


    `else` 是可选的。我们可以单独使用一个 `if()` 条件语句。然而，我们不能单独使用 `else`，因为 `else` 只是当 `if()` 失败时的捕获辅助。换句话说，它是
    `if()` 的备选方案。


    ### 在 if(), else 中间添加第二个条件


    有时，一个 `if(), else,` 不足以涵盖所有结果。在这种情况下，有一个中间语句，它像 `if()` 一样接收条件。这种中间条件被称为 `else
    if()`。


    这里是基本语法：


    ![](img/00002.jpeg)


    图 2


    ### 如何在条件语句中书写大括号


    注意第 1 行的左大括号。这是 JavaScript 常见的写法。如果你来自较旧的语言（如 `C`），你可能习惯将左大括号单独写在第二行。这完全没问题。无论你选择哪种方式，请确保不要混合风格。


    此外，右大括号始终位于一行的开头（例如：第 3、5 和 7 行）。在 `if()` 右大括号之后，我们可以在同一行编写 `else`，或者在适用的情况下编写
    `else if`，并以一个左大括号结束该行（参见第 3 行）。


    最后的右大括号始终单独占据（第 7 行）。这是所有使用大括号的语言通用的。一个非常流行的错误是将右大括号写在最后一个语句的右侧。那样非常难看而且非常难以调试。


    有时你会发现没有大括号的 JavaScript 条件语句，它们也是可以的。然而，我不建议这种做法，因为会导致不一致性，并且迟早会触发错误，因为 JavaScript
    解释器在认为缺少分号时会自动添加分号，而缺少大括号可能会触发解释器认为它已经到达语句的结尾。在掌握这种样式概念之前，请在写完代码后使用 `jsBeautifier`
    对你的代码进行格式化。


