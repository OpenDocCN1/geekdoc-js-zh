    \ \"*chestnut is not found in array y*\":\n\n**if(y.indexOf(\"chestnut\") >=0){\n\
    \n console.log(\"chestnut is contained in array y\");\n\n} else {\n\n console.log(\"\
    chestnut is not found in array y\");\n\n}**\n\nIt returns \"*chestnut is not found\
    \ in array y*\"\n\n10- Remove the *last* item of array ***mySort*** using *pop()*:\n\
    \n**mySort.pop();**\n\nIt removes \"grape\"\n\n11- Remove the *first* item of\
    \ array ***mySor***t using *shift()*:\n\n**mySort.shift();**\n\nIt removed \"\
    apple\"\n\n12- *mySort* should now only contain  \"banana\".\n\nAdd \"chestnut\"\
    \ as the last item,  using push():\n\n**mySort.push(\"chestnut\");**\n\n*mySort*\
    \ should now have 2 items, [\"*banana\", \"chestnut\"*]\n\n13- Using **splice()**,\
    \ insert \"apple\" in array **mySort** at position 1 (as a second item) and\n\n\
    do not delete any existing item.\n\n**mySort.splice(1,0,\"apple\");**\n\n*mySort*\
    \ should now contain [*\"banana\", \"apple\", \"chestnut\"*]\n\n14- Using **slice()**,\
    \ create a new array named ***newArray*** with a copy of the second and third\
    \ items ( \"apple\" and \"chestnut\") from *mySort* array:\n\n**var newArray =\
    \ mySort.slice(1,3);**\n\nThe *newArray* now contains [*\"apple\", \"chestnut\"\
    *].\n\nThe argument 1 represents the second location from *mySort*, and argument\
    \ 3 represents the exclusion which starts at location 3.\n\n*   Yes, location\
    \ 3 does not exist, but we had to cover location 2 in order to include *chestnut*.\
    \ The exclusion started at location3, which is item 4.\n\nIt may be overwhelming\
    \ at first.\n\n*Practice, practice, practice*.\n\nEND OF LAB\n\n## 2.13 Lab work\
    \ 10\n\n### Building a mechanism to fetch a variable from an array\n\nThis exercise\
    \ will review variable assignments, and creating arrays with variables as elements,\
    \ plus function declarations, reassignment of variables and the usage of indexOf.\n\
    \nThe idea is to call a function and select a language as an argument. Then, based\
    \ on the language selected, the correct sentence will be displayed. Does it sound\
    \ interesting?\n\nExample:\n\nWhen calling **show(english);**\n\nThis sentence\
    \ gets displayed:\n\n\"**The quick brown fox jumped over the lazy dog**\".\n\n\
    *   Notice how *english* is not wrapped in quotes (and it is in lower case). That\
    \ tells us that it must be a variable name, not a string.\n\nI have used [Google\
    \ Translate](https://translate.google.com/) to convert my sentences from English\
    \ to Portuguese and Spanish (and later French). My apologies to native speakers\
    \ if it sounds funny, it is well intended.\n\nLink to the convenient [jsbeautify](http://jsbeautifier.org/).\n\
    \n*   ***Please do the exercise on your own.\n\n    A link to my own file will\
    \ be given in the end.\n\n    Interim files will also be available so that you\
    \ can check your work***.\n\n1- Declare three variables named\n\n*english*, *portuguese*,\
    \ *spanish*.\n\nRespectively, assign to each one of them the following sentences:\n\
    \n(Link to convenient copy/paste: [raw file](http://icontemp.com/jpl/fox.txt) \
    \ | bit.ly/1mpqCsr )\n\n\"*The quick brown fox jumped over the lazy dog*\"\n\n\
    \"*A ligeira raposa marrom saltou sobre o cão preguiçoso*\""
