- fmt: '

    This book is for everyone who wants to learn basic programming using the `JavaScript`
    language without taking a formal course. It may also serve as a classroom supplement
    for practicing and review.


    - The intended audience is beginning, intermediate, or an advanced reader looking
    to restudy the subject.


    This book contains lots of exercises with answers and explanations. Each section
    is one page or less long and each topic is followed by lab work with links to
    raw files. There is also a `forum board` to facilitate further reading and practice.
    Since all scripts are short, these links are there just to clear any possible
    doubt you may have about your own work.


    I suggest spending at least 30 minutes per day reading and practicing each chapter.
    Do not rush the material because the topics covered are the foundation to master
    the language. Take time to absorb each concept. Do not go into a new subject without
    taking a conscious break from the computer to do some physical activity like for
    example a minor stretch.


    Read each subtopic and do the exercises. Follow the book from beginning to end;
    then later you may want to use this material as a comprehensive reference to refresh
    your mind or for practicing purposes. For further practicing refer to the dedicated
    forum platform presented later in the book.


    If you study every day you will complete the course in about two weeks.


    If you just read it as a review, you may finish it on a weekend’s time.


    The book takes advantage of your browser’s `JavaScript Console`. I recommend using
    the `Console` from `Google Chrome` and I will explain how to access it and use
    it for our purposes. `Opera` and `Epic` will work the same way. Of course, you
    can utilize any other test method you wish as long as you know how to access it.
    The new Microsoft Edge browser also has a `JavaScript Console` accessed by the
    shortcut `F12`.


    Besides recommending `Google Chrome`, I will also recommend the usage of `jsbeautifier`
    (a very useful online editor), as well as my own website forum where you will
    find all the linked exercises and further reading and practicing materials.


    Don’t worry about it for now; there will be plenty of reference links posted at
    the appropriate time.


    ### What you should know before reading this material


    The only prerequisite for reading and practicing the projects in this book is
    that you are familiar with basic computer skills such as `copy/paste` and `editing`
    a line of text.


    For a more complete experience you need access to the `Internet`.


    You can always review the material offline but you will not be able to access
    any of my sample files if you don’t go online.


    In order to fully understand the last section of the book which introduces `AngularJS`
    in plain words, you will need to know basic HTML syntax like for example, understanding
    how a basic HTML page is created, the `HTML` tag, the `BODY` tag, how to create
    a paragraph or a `DIV` – nothing too complex.


    The book will give you the foundation to become comfortable with `JavaScript`
    so that you can advance firmly regardless of which area of the language you plan
    to specialize on.


    Basic math is a plus, but even if you think math is not your call, all math examples
    are well explained in the book. No one should have any problem with them.


    The book will prepare you to understand modern JavaScript. This includes a firm
    introduction to `JSON` and `AngularJS` in plain words, which will open doors and
    break down barriers for you to get into those very hot technologies.


    ### The Spiral approach for code learning


    This eBook utilizes the idea of a spiral approach for code learning as outlined
    below:


    1- The history of development is preserved.

    2- Simple solutions are provided first and then replaced by more advanced, robust
    solutions.

    3- Only the concepts used in a spiral are explained, with links for further reading
    material.


    Each project conserves its incremental history as a snapshot of something useful
    to review, like a spiral. The spiral approach is a technique often used in teaching
    where first the basic facts of a subject are learned, without worrying for detail.
    Then as learning progresses, more and more details are introduced while at the
    same time they are related to the basics which are reemphasized many times to
    help the internalization of concepts.


    ### No memorization is needed


    - The book must be read in sequence for a more effective, powerful and meaningful
    experience.

    - The exercises should be repeated not just right after finishing the current
    lab work, but also after finishing the whole section or reading the whole book.

    - Practice like you would be practicing guitar: every day and with intent. Think
    of `JavaScript` exercises as scales to be played.

    - After finishing an exercise, always think on how you would apply the concepts
    covered for a different recipe. Think like a master chef. Programing is like cooking.

    - Programming is also like plumbing. We create interfaces by facilitating connections.

    - Finally, programming is part science part art. It brings together the best of
    both worlds.


    ### What is JavaScript


    `JavaScript` is a programming language designed to interact with the computer
    browser. There is currently no other language with the same browser compatibility
    as `JavaScript`. Most of those languages trying to replace `JavaScript` actually
    `decompile` their code into `JavaScript`.


    ### What is the difference between JavaScript and HTML?


    `HTML` is a presentation markup language. It creates objects (container boxes)
    that get displayed on the page. It does not make decisions based on user interaction.
    `HTML` paints the computer screen.


    `JavaScript` extends `HTML` in the sense that it makes the page dynamic by interacting
    with the user based on certain conditions and outcomes.


    In order to create outcomes and make decisions we need to learn `JavaScript` syntax
    and that’s what this book is about.


    In later chapters we will learn how to create modern web interaction using one
    of the latest implementation techniques called `AngularJS`.


    The book will not make you an expert in `AngularJS`. It will however give you
    a very solid foundation to empower you and propel you forward.


    This book follows a hands-on approach. Please be prepared for an extensive workout.


    # PART I: AT THE GATES OF ENLIGHTMENT


    “Empty your cup; return to the beginning”.


    ## 1.1 The browser interface


    Every time we go online we get to use an `interface` to communicate with the internet.
    This particular interface is known as “the browser” and its purpose is to translate
    the incoming data from the outer world into our computer screen.


    Browsers place text and images on the screen based on instructions given by the
    programmer in a markup language known as `HTML`. Then this text and images are
    rearranged or beautified by a styling language called `CSS`. Finally, the website
    dynamically interacts with the user via `JavaScript` which is the subject of this
    book.


    `JavaScript` is a computer language designed to interact with and recognized by
    all browsers. This means that we can create useful programs to run in a browser
    by writing instructions in `JavaScript`.

    '
