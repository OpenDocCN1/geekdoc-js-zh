- fmt: "\nAs you’ve probably noticed, the visual display of an array on the screen\
    \ when we call it by name is in its raw visual format:\n\n`[\"blueberry\", \"\
    orange\", \"banana\", \"apple\", \"peach\", \"cherry\", \"avocado\"]`\n\n### How\
    \ do we display the items by themselves?\n\nWe can use the array `length` property,\
    \ and a `for loop`, to do such thing.\n\nThe `length` property works just like\
    \ it did for strings. We can find out the length of an array by attaching `.length`\
    \ to the array variable name:\n\n`y.length;` <-- it display the number `7`\n\n\
    Now, as you remember from playing with the string \"orange\" earlier (Lab work\
    \ 7), when we know the length of the item we are going to scan, we initialize\
    \ a `for loop` in the following manner:\n\n```\nfor(var i = 0; i < 7; i++) { do\
    \ this stuff; }\n```\n\nHowever, for the most part we don’t know the length of\
    \ the item we are trying to scan and that’s when `.length` comes to the rescue:\n\
    \n```javascript\nfor (var i = 0; i < y.length; i++ ){ do this stuff; }\n```\n\n\
    This last implementation is much more efficient because we don’t have to worry\
    \ about redoing the loop if the array ever changes length when we delete or add\
    \ new items to it.\n\nThe rest of the code needed to manipulate the array will\
    \ go where the “do this stuff” code block is. There we could print, search, or\
    \ create many other possible implementations. Also and as you know, the code block\
    \ is usually written on separate lines.\n\nHere’s a sample loop to print all items\
    \ to the screen:\n\n![](images/00011.jpeg)\n\nFig 11\n\nOn line `2` the `console.log()`\
    \ is addressing each array location. We accomplish this by assigning `i` as the\
    \ number for the location. In this way, as the loop counts the `i` numbers, it\
    \ changes the position of the `y[i]` and each items is displayed accordingly (and\
    \ in separate lines). Let’s try it next.\n\n## 2.10 Lab work 8\n\nLet’s do some\
    \ programming to cement our understanding of the array creation, addition of items,\
    \ and traversing the array with a `for` loop.\n\nPlease fire up your JavaScript\
    \ Console and let’s get our hands dirty!!\n\n*   Try doing this exercises yourself\
    \ by following the next 7 steps, or jump to the guided exercise that follows in\
    \ order to do it as I explain the concepts.\n\nNOTE: These seven steps are not\
    \ a project. Each step is an independent exercise to see how each implementation\
    \ is done.\n\n### Preliminary project\n\n1- Create an empty array assigned to\
    \ a variable named `misc` (short for miscellaneous).\n\n2- Create another array\
    \ assigned to a variable named `greekLetters`, and with the following items: \"\
    alpha\", \"beta\", \"gamma\", \"delta\"\n\n3- Assign the number `99` to the first\
    \ position in array `misc`, assign the word `\"bottles\"` to the second position\
    \ in array `misc`, and assign the word `\"beers\"` to the ninth position in array\
    \ `misc`.\n\n4- Print to screen the length of array `greekLetters`.\n\n5- Print\
    \ to screen the length of array `misc`.\n\n### Using push and unshift\n\n6- Add\
    \ a new item `\"epsilon\"` to the end of array `greekLetters`.\n\n7- Add a new\
    \ item `\"folk song\"` to the beginning of array `misc`.\n\n(*See my answers on\
    \ the next page*)\n\n### (Guided exercise) Preliminary project\n\n1- Create an\
    \ empty array assigned to a variable named `misc` (short for miscellaneous)\n\
    `var misc = [ ];`\n\n2- Create another array assigned to a variable named `greekLetters`,\
    \ and with the following items: \"alpha\", \"beta\", \"gamma\", \"delta\"\n`var\
    \ greekLetters = [\"alpha\", \"beta\", \"gamma\", \"delta\"];`\n\n3- Assign the\
    \ number `99` to the first position in array `misc`, assign the word `\"bottles\"\
    ` to the second position in array `misc`, and assign the word `\"beers\"` to the\
    \ ninth position in array `misc`.\n```javascript\nmisc[0] = 99;  (no quotes for\
    \ number)\nmisc[1] = \"bottles\";\nmisc[8] = \"beers\";\n```\n\n4- Print to screen\
    \ the length of array `greekLetters`.\n`console.log(greekLetters.length);` <--\
    \ results in 4\n\n5- Print to screen the length of array `misc`.\n`console.log(misc.length);`\
    \ <-- results in 9\n\nDid you notice how we were able to add a ninth position\
    \ to the array `misc`?\n\nDid you also notice how the array `misc` now has 9 items,\
    \ which means that 6 items are reserved with the placeholder value of `undefined`?\n\
    \n### Using push and unshift\n\n6- Add a new item `\"epsilon\"` to the end of\
    \ array `greekLetters`.\n`greekLetters.push(\"epsilon\");`\n\n7- Add a new item\
    \ `\"folk song\"` to the beginning of array `misc`.\n`misc.unshift(\"folk song\"\
    );`\n\nPracticing is the only way to get good at it.\n\nLet’s practice with `for`\
    \ loops on `arrays` by wrapping functionality in `functions` and use some `if\
    \ else` conditionals in the mix. These projects will cover:\n\n### Creating a\
    \ method to add items into an array\n\n*Ready for a challenge?*\n\nWe are going\
    \ to create a function that automatically adds an item to array. Try doing this\
    \ exercises yourself by following the next 5 steps, or jump to the guided exercise\
    \ as I explain the concepts:\n\n1- Declare an empty array assigned to a variable\
    \ `x`.\n\n2- Create a function named `addMe` that automatically adds an item to\
    \ array `x`.\n\na) Use one input parameter `item`.\n\nb) In the function body\
    \ assign the input `item` to the first empty position in the array, based on `x.length`.\n\
    \nc) Also inside of the function, create a `console.log` to print out the whole\
    \ array.\n\n3- Paste your script on the Console and Call the function by passing\
    \ in `\"grape\"` as an input item.\n\n4- Then Call the function and pass in `\"\
    apple\"` as an input item.\n\n5- Do the same for `\"banana\"`.\n\n### (Guided\
    \ exercise) Create a method to add items into an array\n\n1- Declare an empty\
    \ array assigned to variable `x`.\n`var x = [];`\n\n2- Create a function named\
    \ `addMe` that automatically adds an item to array `x`.\nd) Use one input parameter\
    \ `item`.\n\ne) In the function body assign the input `item` to the first empty\
    \ position in the array, based on `x.length`.\nf) Also inside of the function\
    \ create a `console.log` to print out the whole array.\n\n```javascript\nfunction\
    \ addMe(item) {\n    x[x.length] = item;\n    console.log(x);\n}\n```\n\nOn line\
    \ 1 the array `x` was declared.\n\nOn line 3 a function `addMe` with `item` as\
    \ an input parameter was declared.\n\nOn line 4 whatever data is `passed in` when\
    \ we call the function, the data gets assigned to the maximum length of array\
    \ `x`.\n\nOn line 5 we print the array `x` to screen in its new raw form.\n\n\
    ```javascript\naddMe(\"grape\");\naddMe(\"apple\");\naddMe(\"banana\");\n```\n\
    \nThe final result is: `[\"grape\", \"apple\", \"banana\"]`.\n"
  raw: 'As you’ve probably noticed, the visual display of an array on the screen when
    we call it by name is in its raw visual format:


    **[**"blueberry", "orange", "banana", "apple", "peach", "cherry", "avocado"**]**


    ***How do we display the items by themselves?***


    We can use the array *length* property, and a *for loop*, to do such thing.


    The *length* property works just like it did for strings. We can find out the
    length of an array by attaching *.length* to the array variable name:


    **y.length;** <-- it display the number **7**


    Now, as you remember from playing with the string "orange" earlier (Lab work 7),
    when we know the length of the item we are going to scan, we initialize a ***for
    loop*** in the following manner:


    for(var i = 0; i < 7; i++) { do this stuff; }


    However, for the most part we don’t know the length of the item we are trying
    to scan and that’s when *.length* comes to the rescue:


    **for (var i = 0; i < y.length; i++ ){ do this stuff; }**


    This last implementation is much more efficient because we don’t have to worry
    about redoing the loop if the array ever changes length when we delete or add
    new items to it.


    The rest of the code needed to manipulate the array will go where the “do this
    stuff” code block is. There we could print, search, or create many other possible
    implementations. Also and as you know, the code block is usually written on separate
    lines.


    Here’s a sample loop to print all items to the screen:


    ![](images/00011.jpeg)


    Fig 11


    On **line 2** the console.log() is addressing each array location. We accomplish
    this by assigning ***i*** as the number for the location. In this way, as the
    loop counts the *i* numbers, it changes the position of the *y[i]* and each items
    is displayed accordingly (and in separate lines). Let’s try it next.


    ## 2.10 Lab work 8


    Let’s do some programming to cement our understanding of the array creation, addition
    of items, and traversing the array with a *for* loop.


    Please fire up your JavaScript Console and let’s get our hands dirty!!


    *   Try doing this exercises yourself by following the next 7 steps, or jump to
    the guided exercise that follows in order to do it as I explain the concepts.


    NOTE: These seven steps are not a project. Each step is an independent exercise
    to see how each implementation is done.


    **Preliminary project**


    1- Create an empty array assigned to a variable named *misc* (short for miscellaneous).


    2- Create another array assigned to a variable named  *greekLetters*, and with
    the following items: "alpha", "beta", "gamma", "delta"


    3- Assign the number **99** to the first position in array *misc*,


    assign the word **"bottles"** to the second position in array *misc*,


    and assign the word **"beers"** to the ***ninth*** position in array *misc*.


    4- Print to screen the length of array **greekLetters**.


    5- Print to screen the length of array ***misc***.


    **Using push and unshift **


    6- Add a new item **"epsilon"** to the end of array *greekLetters*.


    7- Add a new item **"folk song"** to the beginning of array *misc*.


    (*See my answers on the next page*)


    **(**Guided exercise**) Preliminary project**


    1- Create an empty array assigned to a variable named *misc* (short for miscellaneous)**var
    misc = [ ];**


    2- Create another array assigned to a variable named  *greekLetters*, and with
    the following items: "alpha", "beta", "gamma", "delta"


    **var greekLetters = ["alpha", "beta", "gamma", "delta"];**


    3- Assign the number **99** to the first position in array *misc*,


    assign the word **"bottles"** to the second position in array *misc*,


    and assign the word **"beers"** to the ***ninth*** position in array *misc*.


    **misc[0] = 99;**   (no quotes for number)


    **misc[1] = "bottles";


    misc[8] = "beers";**


    4- Print to screen the length of array greekLetters.


    **console.log(greekLetters.length);** <-- results in 4


    5- Print to screen the length of array *misc*.


    **console.log(misc.length);** <-- results in 9


    Did you notice how we were able to add a ninth position to the array *misc*?


    Did you also notice how the array *misc* now has 9 items, which means that 6 items
    are reserved with the placeholder value of *undefined*?


    ***Using push and unshift***


    6- Add a new item "epsilon" to the end of array *greekLetters*.


    **greekLetters.push("epsilon");**


    7- Add a new item "folk song" to the beginning of array *misc*.


    **misc.unshift("folk song");**


    Practicing is the only way to get good at it.


    Let’s practice with  ***for*** loops on *arrays* by wrapping functionality in
    *functions* and use some *if else* conditionals in the mix. These projects will
    cover important concepts that can be used often.


    ### Creating a method to add items into an array


    *Ready for a simple challenge?*


    We are going to create a function that automatically adds an item into the array
    when the function is called. This will allow us to practice with *array.length*
    as an alternate solution for *push*.


    *   Use your [editor](http://jsbeautifier.org/) first before pasting onto the
    Console. Try doing this exercise by yourself first by following the next 5 steps,
    or jump to the guided exercise in order to do it as I explain the concepts:


    1- Declare an empty array assigned to the variable ***x***.


    2- Create a function named ***addMe*** that automatically adds an item to array
    x:


    a) Use one input parameter called **item**.


    b) In the function body assign the input *item* to the first empty position in
    the array, based on *x.length*.


    ***x.length*** is always one more number than the address of the last item.  By
    assigning an item to location [x.length] it will always match the next position
    available in the array. Give it some thought and then look at my answer if you
    are unsure on how to do it.


    c) Also inside of the function, create a *console.log* to print out the whole
    array in its raw display form (no loops yet).


    3- Paste the script in the Console and


    Call the function by passing in **"grape"** as an input item.


    4- Then Call the function again and pass in **"apple"** as an input item.


    5- Do the same for **"banana"**.


    (*See the answer on the next page*).


    **(**Guided exercise**) Create a method to add items into an array**


    1- Declare an empty array assigned to the variable x.


    var x = [];


    2- Create a function named ***addMe*** that automatically adds an item to array
    x.


    d) Use one input parameter called **item**.


    e) In the function body assign the input *item* to the first empty position in
    the array, based on *x.length*.


    f) Also inside of the function create a *console.log* to print out the whole array
    in its raw display form (no loops yet).


    ![](images/00012.jpeg)


    Fig 12


    On line 1 the array x was declared.


    On line 3 a function *addMe* with *item* as an input parameter was declared.


    On line 4 whatever data is *passed in* when we call the function, the data gets
    assigned to the maximum length of array x. As you know, the length of an array
    always shows the number of items in existence. It so happens that the number of
    items is always 1 more than the last location of the last item. Therefore, the
    length of the array always corresponds to the next position after the last existing
    location. So we can use this number to calculate the next location available.
    This is actually what push() would do automatically but here we are doing it manually
    in order to understand a bit more about arrays.


    On line 5 we print the array x to screen in its new raw form.


    3- Paste your script on the Console and


    Call the function by passing in "**grape**" as an input item.


    Then Call the function and pass in "**apple**" as an input item.


    Do the same for "**banana**".


    **addMe("grape");


    addMe("apple");


    addMe("banana");**


    The final result is: ["grape", "apple", "banana"].


    Great!


    Whenever you’re ready, please move on to the next page. We are going to create
    a method that prints out the items of an array, any array. Coding generically
    is an important goal as programmers.'
