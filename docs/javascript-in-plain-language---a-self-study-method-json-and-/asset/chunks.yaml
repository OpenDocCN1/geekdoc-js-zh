  trans: "\n为了进一步巩固这个概念，这里有一个与我们的示例无关的问题：\n\n7- 表达式 `if(10 > 5)` 的值是多少？\n\n答：**true**\n\
    \n当我们写 `(10 > 5)` 时，JavaScript 看到的是 true。顺便说一下，对于 JavaScript 来说，`if()` 语句中的表达式实际上是一个**问题**。\n\
    \n# 气球概念\n\n问题：\n\n*如果函数是一个被三根绳子 z、a、b 系着的气球，如果我们剪断绳子 z，气球会发生什么？*\n\n答案：\n\n气球不会发生变化，它会保持原样，因为\
    \ `a` 和 `b` 仍然固定着气球。\n\n如果我们把 `a` 和 `b` 都剪掉会发生什么？气球会飞走。\n\n如果气球是我们的函数，它也会飞走，进入[垃圾回收](http://en.wikipedia.org/wiki/Garbage_collection_%28computer_science%29)模式，被浏览器从内存中清除。\n\
    \n在接下来的练习中，我们将练习函数*表达式*（赋值给变量的函数），而不是函数声明（我们最初学过的语法样式）。请记住，使用哪种函数都会得到相同的结果，但熟悉两种样式是非常重要的。\n\
    \n## 函数参数和参数\n\n函数可以有*输入参数*，这样当我们调用函数时，就可以传入*数据参数*。很多时候，程序员对这两个含义使用同一个术语，即参数（parameter）或参数（arguments），并且这种用法被接受了，但定义如下：当我们调用函数时，我们将参数传递给参数。参数是一个物理实体、一个接口、一种输入机制，是一个在函数执行结束后被删除的临时变量。\n\
    \n当我们调用函数时，数据参数的顺序将始终与函数括号中输入参数的物理顺序保持一致。\n\n例如：\n\n```javascript\nvar x = function(num1,\
    \ num2){\n  return num1 - num2;\n};\n```\n\n向输入 `num1` 和 `num2` 传递数据的顺序是重要的，因为函数的内部程序是按照输入参数的布局顺序连接的：\n\
    \n```javascript\nx(5, 3);\n```\n\n它将返回值 **2**，因为 `5 – 3 = 2`。\n\n然而，如果我们调用函数并反向写入参数：\n\
    \n```javascript\nx(3, 5);\n```\n\n函数将返回值 **-2**，因为 `3 - 5 = -2`。\n\n简而言之，当我们调用函数时，需要遵守参数的顺序。\n\
    \n* 如果我们调用函数并传入三个参数而不是两个会发生什么？\n\n```javascript\nx(5, 3, 4);\n```\n结果将是 **2**，因为\
    \ `5 - 3 = 2`。最后一个参数 `(4)` 被忽略了，因为函数内部没有处理它的规定。\n\n* 如果我们调用函数时只传入一个参数，尽管函数硬编码了两个输入参数，会发生什么？\n\
    \n```javascript\nx(5);\n```\n\n在我们的情况下，它返回 **NaN**，这是 JavaScript 的属性，代表 Not-a-Number（不是数字），或无效数字。这是因为输出变成了\
    \ `5 – num2` 的减法，而 `num2` 没有被赋值给任何内容，保持为它的原始值 `\"undefined\"`。\n\n例如，在：\n\n```javascript\n\
    var x = function(input1, input2){\n  return input1 + input2;\n};\n```\n\n如果我用两个参数调用函数：\n\
    \n```javascript\nx(\"Tony\", \"deAraujo\");\n```\n\n我得到输出 `\"TonydeAraujo\"`。\n\
    \n另一方面，如果我只用一个参数，它会假设第一个输入参数，而其他输入参数将是 `undefined`：\n\n```javascript\nx(\"Tony\"\
    );\n```\n它输出 `\"Tonyundefined\"`。\n\n* 我们可以在函数中编写多达 256 个输入参数。\n\n不要记忆所有这些，只需花时间理解它并继续前进。\n\
    \n## 对象参数\n\n程序员将输入参数写入函数中，是因为他/她希望拥有某种数据输入序列，在大多数情况下效果非常好。\n\n然而，JavaScript 函数有另一种方式通过对象来接受参数，该对象属于（且仅属于）函数：`arguments`\
    \ 对象（注意使用复数形式）。\n\n`arguments` 对象的作用类似于数组，因为可以通过数值进行访问，但它不是一个功能完整的数组，因为它只[继承](http://en.wikipedia.org/wiki/Prototype-based_programming)了数组家族的一些功能，而不是整个库。\n\
    \n**让我们看看这个对象是如何工作的**。\n\n```javascript\nvar x = function(){\n  return arguments[0]\
    \ + arguments[1].toUpperCase();\n};\n```\n\n上面的函数没有指定输入参数。然而，当我们调用函数时，它会输出我们给它的第一个参数，以及大写的第二个参数，该参数位于位置\
    \ 1（记住，位置和数组一样从 0 开始）：\n\n```javascript\nx(\"tony\", \"dearaujo\");\n```\n返回：`\"\
    tonyDEARAUJO\"`\n\n所以我们仍然可以按照自己的意愿编写函数，而无需指定输入参数。只需使用 `arguments 对象` 通过数值访问每个数据元素即可。\n\
    \n关于 `arguments` 对象，我在我的另一本[书](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)中有更多细节，尽管它写得早，但可以被认为是这本书的第二卷。\n\
    \n## 3.3 使用函数操作变量\n\n### 按值传递数据\n\n到为止，我们一直通过值传递数据。当我们调用函数时，数据是通过**值**传递。另一种传递方式是将字符串传递给另一个。正如你从书中了解的，原始类型变量（如数字或字符串）将值保存在它们自己的位置中。例如，以下变量：\n\
    \n```javascript\nvar x = 33;\nvar y = x;\n```\n`x` 持有 33，`y` 也持有 33。但这是不同的 33\
    \ 值。数据是按值传递的，因为我们在内存中添加了新数据。\n\n### 按引用传递数据\n\n复杂值（如函数、数组和对象）存储在*堆*中，而指向它们的变量存储在*栈*中。与简单值不同，这些值及其变量是两个独立的实体。\n\
    \n由于它们是两个独立的实体，当我们把指向复杂数据结构的变量赋值给另一个变量时，值并没有被复制，因此这种交换不是按值传递。我们所做的只是分配引用或按引用传递，以便两个变量现在指向同一个地方：\n\
    \n例如数组 `a`：\n\n```javascript\nvar a = [1, 2, 3, 4];\n```\n\n现在将同一个变量赋值给另一个变量：\n\
    \n```javascript\nvar b = a;\n```\n\n我们没有复制数组、函数或对象的内容。我们现在有两个指向相同数据的变量。记得那个系有三根绳子\
    \ z、a、b 的气球吗？\n\n所以当我们编辑数组 `a` 中的一个值时，我们实际上也在改变数组 `b` 的值，反之亦然，因为它们都指向同一个数组。\n"
- fmt: "\nThat is called `passing data by reference`. There is no duplication; these\
    \ variables just refer to the same data. If we delete one of the variables or\
    \ assign it to something else, the data remains untouched because there is another\
    \ variable holding it in place like it happened with the balloon.\n\n### Functions\
    \ are closed-in structures\n\nIn JavaScript, a function is the only [data structure](http://en.wikipedia.org/wiki/Data_structure)\
    \ able to protect its data from the outer world.\n\nWhat does that mean?\n\nIt\
    \ means that if we declare a variable inside of a function, it can’t be seen from\
    \ the global scope (outside of the function).\n\nThe global scope is in itself\
    \ an inner scope if we compare it to outer worlds, like for example another webpage\
    \ on a different tab. Everything we do on a web page is done under the `window`\
    \ object which wraps the whole page. This has nothing to do with the name Windows\
    \ from Microsoft. `window` here refers to the browser displaying of a page, the\
    \ shell, and it is called `window` in any computer system.\n\nThe `window` object\
    \ is, as far as a web page is concerned, the outer world or the `global scope`\
    \ of the page. Anything declared under the `window` object is a property or method\
    \ of the object `window`.\n\nWe could actually think of the `window` object as\
    \ a function that creates everything else inside it.\n\nWhen we declare a variable,\
    \ like for example\n\n```javascript\nvar x = 33;\n```\n\nWe are creating this\
    \ variable in the global scope, which means that the parent of variable `x` is\
    \ object `window`. To call this variable, we write:\n\n```javascript\nx;\n```\n\
    \nAnd it displays 33. But we could also call it like in the following example\
    \ and it would work the same:\n\n```javascript\nwindow.x;\n```\n\nBy using dot\
    \ syntax we are making sure we call the correct variable `x`, not some other `x`\
    \ from the outer galaxies. For the most part `window` is understood and we don’t\
    \ have to write it down, as we have seen throughout the book.\n\nAnd what are\
    \ those different galaxies? You might ask.\n\nRemember when I said that we could\
    \ think of the `window` object as a big function that holds all the web page functionality\
    \ inside of itself and it protects it from other webpages?\n\nWell, I didn’t put\
    \ it quite like that but it serves the purpose which is to say that every function\
    \ acts as a protective parent for its own data. In JavaScript functions are closed\
    \ in data structures.\n\nWe could actually declare another variable `x` inside\
    \ of a function because JavaScript will accept it without conflict, even knowing\
    \ that there is another `x` declared as a global variable. This is because the\
    \ global scope does not see the inner `x` from the function.\n\nHowever, the function\
    \ can see the outer variable `x`. That’s right! Functions have access to global\
    \ variables because functions are their siblings. A function can see the outer\
    \ variable world, but the outer world cannot see what’s inside of a function.\
    \ The siblings of a function can see the function, but they cannot see what is\
    \ inside of the function. The good news is that JavaScript always picks the closest\
    \ identifier called upon. I mean, if we would call `x` from within the function,\
    \ JavaScript would grab the first `x` that sees which is the one inside of the\
    \ function. So, even if there was another `x` outside of the function and knowing\
    \ that the function has access to it, the inner `x` would be JavaScript’s first\
    \ choice if we ever addressed `x` from within the function.\n\nFor example:\n\n\
    ```javascript\nvar x = 33; var test = function(){\n  var x = 5;\n  return x;\n\
    };\n```\n\nCall function `test`:\n\n```javascript\ntest();\n```\n\nIt returns\
    \ 5.\n\nSo, how would we address the outer `x` from inside of the function if\
    \ we wanted to use its value in the function?\n\n`window.x` would come to mind.\n\
    \nWe will see next how to access the global `x` from within the function.\n\n\
    ### “This” as an object placeholder\n\nWhat if we wanted to return the outer variable\
    \ `x`, instead of the inner `x` like we did on the previous example?\n\nIn that\
    \ case we would have to use dot syntax to address the global `x`:\n\n```javascript\n\
    var x = 33; var test = function(){\n  var x = 5;\n  return window.x;\n};\n\ntest();\n\
    ```\n\nNow it returns 33, which is the outer `x`, not the inner `x` which is 5.\
    \ That’s because `window.x` addresses the global variable `x` which is a child\
    \ of object `window`.\n\nBecause JavaScript is very dynamic and also because we\
    \ should write code as portable as possible (one that could apply to any object,\
    \ not just the window object), programmers have come up with a generic placeholder\
    \ to properly address the object currently calling the variable.\n\nThis placeholder\
    \ is the word `this`.\n\nIf we substitute the expression `window.x` for `this.x`,\
    \ at the time of execution JavaScript will search for the object owning the property\
    \ being called upon, and substitutes the placeholder `this` for the correct name,\
    \ which in our case is object `window`.\n\nBut you might ask, isn’t function `test`\
    \ also an object and if so, isn’t the owner of `this.x` the function itself, instead\
    \ of object `window`?\n\nNot really (but it is a great question). Who is the owner\
    \ of the act of calling function `test()`?\n\nAns: The object `window` owns the\
    \ command `test()`.\n\nNow if function `test()` was a method inside of some other\
    \ object, then `this` would no longer represent `window`, it would represent the\
    \ other object.\n\nJust as an example please look at this sample:\n\n```javascript\n\
    var x = 33; var myObject = {\n  x: 7,\n  test: function() {\n    var x = 5;\n\
    \    return this.x;\n  }\n};\n```\n\nThere, we have a global `x` with value 33,\
    \ another `x` with value 7 that belongs to `myObject`, and another `x` with value\
    \ 5 inside the function. When we call the method `test()`:\n\n```javascript\n\
    myObject.test();\n```\n\nIt prints out 7 which is the second `x`, belonging to\
    \ `myObject`. `window` is no longer the immediate owner of `this.x` because `myObject`\
    \ is.\n\nI have underlined earlier that `this` gets assigned “at the time of execution”,\
    \ not only because the substitution happens at the time of execution and not earlier,\
    \ but also because the object owning the property may change from the time the\
    \ property was declared to the time it is called. JavaScript is a dynamic language\
    \ and we need to be careful with our assumption of what is going to happen dynamically.\
    \ We will see ownership happening and how to tackle each situation ( for more\
    \ of that please read JavaScript Objects Functions and Arrays Explained (http://www.amazon.com/JavaScript-Objects-Arrays-Explained/dp/B00GDEPBZQ/)).\n\
    \nHere’s the original function written in a more portable format where `this`\
    \ replaces `window`:\n\n```javascript\nvar x = 33;\nvar test = function(){\n \
    \ var x = 5;\n  return this.x;\n};\n\ntest(); // Returns 33 instead of 5\n```\n\
    \n## 3.4 Lab work 12\n\n### Part A: Expressions, statements, arguments\n\n(*A\
    \ link to my answers will be posted at the end of this page. You may actually\
    \ navigate to the forum to mentally answer the questions because the answers are\
    \ not visible until you click on the individual answer button.*)\n\nLet’s review\
    \ some of the concepts we have covered in this section. Please try to answer all\
    \ questions before you check my answers.\n\nIn general an *expression* is something\
    \ JavaScript summarizes into one unit, and a *statement* is a complete sentence\
    \ representing a command and terminated by a semicolon.\n\n1- In the following\
    \ example what are the expression(s) and what are the statement(s)?\n\n```javascript\n\
    if(10 < 11) {\n  console.log(\"I love JavaScript\");\n}\n```\n\n2- In the following\
    \ function assignment what is the value of variable `addTwo` and what is the value\
    \ of addTwo with post-fixed parentheses `addTwo()`?\n\n```javascript\nvar addTwo\
    \ = function (){\n  return 3 + 2;\n};\n```\n\n3- In the declaration of the above\
    \ source code, which section of `addTwo` is known as an anonymous function?\n"
  raw: 'That is called **passing data by reference**. There is no duplication; these
    variables just refer to the same data. If we delete one of the variables or assign
    it to something else, the data remains untouched because there is another variable
    holding it in place like it happened with the balloon.


    ### Functions are *closed- in* structures


    In JavaScript, a function is the only [data structure](http://en.wikipedia.org/wiki/Data_structure)
     able to protect its data from the outer world.


    What does that mean?


    It means that if we declare a variable inside of a function, it can’t be seen
    from the global scope (outside of the function).


    The global scope is in itself an inner scope if we compare it to outer worlds,
    like for example another webpage on a different tab. Everything we do on a web
    page is done under the ***window*** object which wraps the whole page. This has
    nothing to do with the name Windows from Microsoft. *window* here refers to the
    browser displaying of a page, the shell,  and it is called *window* in any computer
    system.


    The window object is, as far as a web page is concerned, the outer world or the
    *global scope* of the page. Anything declared under the window object is a property
    or method of the object window.


    We could actually think of the window object as a function that creates everything
    else inside it.


    When we declare a variable, like for example


    **var x = 33;**


    We are creating this variable in the global scope, which means that the parent
    of variable x is object *window*.  To call this variable, we write:


    **x;**


    And it displays 33\. But we could also call it like in the following example and
    it would work the same:


    **window.x;**


    By using *dot* syntax we are making sure we call the correct variable ***x***,
    not some other x from the outer galaxies. For the most part window is understood
    and we don’t have to write it down, as we have seen throughout the book.


    *And what are those different galaxies? You might ask.*


    Remember when I said that we could think of the **window** object as a *big function*
    that holds all the web page functionality inside of itself and it protects it
    from other webpages?


    Well, I didn’t put it quite like that but it serves the purpose which is to say
    that every function acts as a protective parent for its own data. In JavaScript
    functions are *closed in* data structures.


    We could actually declare another variable x inside of a function because JavaScript
    will accept it without conflict, even knowing that there is another x declared
    as a global variable. This is because the global scope does not see the inner
    x from the function.


    However, the function can see the outer variable x. That’s right! Functions have
    access to global variables because functions are their siblings. A function can
    see the outer variable world, but the outer world cannot see what’s inside of
    a function. The siblings of a function can see the function, but they cannot see
    what is inside of the function. The good news is that JavaScript always picks
    the closest identifier called upon. I mean, if we would call x from within the
    function, JavaScript would grab the first x that sees which is the one inside
    of the function. So, even if there was another x outside of the function and knowing
    that the function has access to it, the inner x would be JavaScript’s first choice
    if we ever addressed x from within the function.


    For example:


    **var x = 33;** var test = function()**{**


     **var x = 5;**


     return x;


    **}**;


    Call function test:


    test();


    It returns **5**.


    **So, how would we address the outer *x* from inside of the function if we wanted
    to use its value in the function?**


    ***window.x*** would come to mind.


    We will see next how to access the global *x* from within the function.


    ### “*This”* as an object placeholder


    What if we wanted to return the outer variable ***x***, instead of the inner *x*
    like we did on the previous example?


    In that case we would have to use *dot syntax* to address the global *x*:


    **var x = 33;** var test = function(){


    var x = 5;


    **return window.x;**


    };


    test();


    Now it returns ***33***, which is the outer x, not the inner x which is 5\. That’s
    because ***window.x*** addresses the global variable ***x*** which is a child
    of object *window*.


    Because JavaScript is very dynamic and also because we should write code as portable
    as possible (one that could apply to any object, not just the window object),
    programmers have come up with a generic placeholder to properly address the object
    currently calling the variable.


    This placeholder is the word ***this***.


    If we substitute the expression ***window.x*** for ***this.x***,


    at the time of execution JavaScript will search for the object owning the property
    being called upon, and substitutes the placeholder ***this*** for the correct
    name, which in our case is object ***window***.


    But you might ask, isn’t function test also an object and if so, isn’t the owner
    of ***this.x*** the function itself, instead of object *window*?


    Not really (but it is a great question). ***Who is the owner of the act of calling
    function test()?***


    Ans: The object **window** owns the command *test()*.


    Now if function *test(){}* was a method inside of some other object, then ***this***
    would no longer represent *window*, it would represent the other object.


    Just as an example please look at this sample script:


    **var x = 33;** **var myObject = {** 


     **x: 7**,


     test: function() { 


     **var x = 5;**


     return this.x;


     }


    **};**


    There, we have a global x with the value of 33, another x with the value of 7
    that belongs to ***myObject*** , and another x with the value of 5 inside of the
    function belonging to myObject.


    When we call the method test():


    **myObject.test();**


    It prints out 7 which is the second x, the one that belongs to **myObject**. *window*
    is no longer the immediate owner of *this.x* because *myObject* is.


    I have underlined earlier that *this* gets assigned  “at the time of execution”,
    not only because the substitution happens at the time of execution and not any
    earlier, but also because the object owning the property may change from the time
    the property was declared to the time the property is being called upon. JavaScript
    is a dynamic language and we need to be careful with our assumption of what is
    going to happen dynamically. We will see ownership confusion happening and how
    to tackle each situation as we code more advanced scripts ( for more of that please
    read [JavaScript Objects Functions and Arrays Explained](http://www.amazon.com/JavaScript-Objects-Functions-Arrays-Explained-ebook/dp/B00GDEPBZQ/)).


    Here’s the original function written in a more portable format where ***this***
    replaces ***window***:


    var x = 33;


    var test = function(){


     var x = 5;


     return this.x;


    };


    test(); (It returns 33 instead of 5).


    ## 3.4 Lab work 12


    ### Part A: Expressions, statements, arguments


    (*A link to my answers will be posted at the end of this page. You may actually
    navigate to the forum to mentally answer the questions because the answers are
    not visible until you click on the individual answer button.*)


    Let’s review some of the concepts we have covered in this section. Please try
    to answer all questions before you check my answers.


    In general an *expression* is something JavaScript summarizes into one unit, and
    a *statement* is a complete sentence representing a command and terminated by
    a semicolon.


    1- In the following example what are the expression(s) and what are the statement(s)?


    if(10 < 11) {


    console.log("I love JavaScript");


    }


    2- In the following function assignment what is the value of variable *addTwo*
    and what is the value of addTwo with post-fixed parentheses *addTwo()*?


    var addTwo = function (){


    return 3 + 2;


    };


    3- In the declaration of the above source code, which section of *addTwo* is known
    as an ***anonymous*** function?'
