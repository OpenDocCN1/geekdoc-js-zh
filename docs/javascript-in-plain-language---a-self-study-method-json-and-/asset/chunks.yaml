    Then test both *if, else* outcomes like we did on steps 3 and 4:


    confirm("Ok, let''s play!");


    alert("ok, goodbye!");


    ### Reviewing if(), else


    Inside of an if(){ do this stuff; } parentheses, we include a condition. Keep
    in mind that it is not the condition itself that unlocks the code block: it is
    the truthiness of the *question* you write in there that unlocks the code.


    Examples:


    **if(10 === 10){}** <-- since 10 is the same as 10, JavaScript will evaluate the
    statement as ***true*** and it unlocks the next code block.


    if(10 === "10"){} <-- since 10 is a number and "10" is a *string*, JavaScript
    evaluates the statement as ***false*** and jumps over the next code block without
    executing it.


    **var x = 33;** **if(x){}** <-- since ***x*** has a value other than *0*, *undefined*,
    or *null*, the statement is ***true***.


    **if(!x){}** <-- since x has a value other than *0*, *undefined*, or *null*, this
    statement is ***false***.


    **var y = "yes";**


    **if(y === "yes"){}** <-- since the value of ***y*** is string *yes*, this statement
    is ***true***.


    if(y !== "yes"){} <-- since the value of ***y*** is *yes*, this statement is ***false***.


    **if(y === "no"){}** <--- since the value of ***y*** is *yes*, this statement
    is ***false***.


    **if(y === "no" || y === "yes"){}** <-- since one of the statement is *true*,
    the statement is ***true***.


    **if(y === "no"  && y === "yes"){}** <--- this statement is ***false*** since
    one of the operands is *false*.


    ### What about else?


    *else* is optional. We can have an if() conditional statement all by itself. However,
    we can’t have an *else* by itself since *else* is just a catcher helper for when
    *if()* fails. Or in other words, the alternate of  if().


    ### Adding a second condition in the middle of if(), else


    Sometimes an *if(), else,* is not enough to accommodate all the outcomes. In that
    case there is an intermediate statement and it takes a condition just like *if()*
    does.


    This intermediate conditional is called ***else if()***


    Here’s the basic syntax:


    ![](images/00002.jpeg)


    Fig 2


    ### How to physically write the braces in a conditional statement


    Notice the opening brace on line 1\. This is the JavaScript common way of doing
    it. If you come from an older language such as C , you may be used to code the
    opening brace on the second line by itself. That is perfectly fine. Whichever
    way you choose to use just make sure you don’t mix styles.


    Also, the closing brace is always at the beginning of a line (example: lines 3,
    5 and 7). After the *if()* closing brace we may write the *else* on the same line,
    or the *else if*, when applicable, and finish the line with an *opening* curly
    brace (see line 3).


    The very final closing brace always stand on its own (line 7). That is common
    to all languages that use braces. A very popular mistake is to write the closing
    brace to the right of the last statement. That is very ugly and very difficult
    to troubleshoot.


    Sometimes you will find JavaScript conditionals without braces and it also works.
    However I do not recommend such practice because it leads to inconstancies and
    it may trigger an error sooner or later because the JavaScript interpreter adds
    semicolons automatically when it thinks they are missing, and the lack of a curly
    brace may trigger the interpreter to think that is has reached the end of a statement.
    Until you master this styling concept use jsBeautifier to style your code after
    you are done writing it.


    ### When to use an else if()


    Just like ***else***, the ***else if()*** does not exist without first having
    an ***if()***. We can only have one ***if()*** and one optional ***else***, but
    we can have as many ***else if()***s as we wish.


    ***Question:***


    What is the difference between coding ***else if()***s or just writing a new ***if()***
    statement for a new subsequent condition?


    ***Answer:*** It is a matter of semantics. When we write several ***if()***s,
    we are creating *independent* statements. This means that JavaScript interpreter
    will evaluate all of them and output all those that are *true*. On the other hand,
    when we have ***else if()***s after an ***if()***, we are telling the JavaScript
    interpreter that we want just one output since both conditions are tied together.
    In other words, when the ***if()*** condition is true, output it and do not execute
    the next *else if()* condition because we are done here.


    *   **Side note:** When two conditions could possibly be true for both *if()*
    and *else if()*, try to write the most common condition first, in order to avoid
    an incorrect output.


    Here’s what I mean: If we are probing for numbers that are divisible by  3 or
    divisible by 5, ***or both***, make sure the divisibility 3 && 5 condition goes
    before the divisibility by 3 or by 5.


    Let’s practice some more:


    1- Use your editor to create this code, then paste it to the Console.


    Declare a variable ***x*** and assign it the number 15.


    Then create a condition that prints to the screen (console.log) one of the following:


    "yes, x is divisible by 3"


    "yes, x is divisible by 5"


    "yes, x is divisible by 3 and 5"


    "No, x is not divisible by 3 nor 5"


    Remember to use the *modulus* in order to see if x is divisible by a certain number,
    like for example:


    **if (x % 3 === 0)** Which means that if the remainder is zero, *x* is divisible
    by 3, right?


    See the next page for a script discussion and a link to my own file.


    ### Is Programming an Art or a Science?


    There are many ways to finish the task. Programming is part science and part art.
    In a way it is like planning and cooking a meal.


    First we need to look at possible solutions. In this project we probably need
    three conditional statements, which means that we may have to employ some ***else
    if()***s in the middle before we get to the *catch all else* solution at the end.
    It’s a good idea to take a walk outside while putting all the ingredients together
    in our mind for the recipe we are about to create. Sketching the ingredients on
    a piece of paper also helps a bit (real paper and pencil).


    As mentioned before, we have to address the common condition first, which is when
    *x is divisible by both 3 and 5*. That should become our main ***if()*** condition.
    Then we create two additional ***else if()***s for numbers that are divisible
    by 3 or by 5.


    Finally, we assign the output “*No, x is not divisible by 3 nor 5*" to the catcher
    *else*.


