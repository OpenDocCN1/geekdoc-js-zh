    ## 1.7 Adding some more JavaScript operators


    ### +, -, +=, -=, /, /=, %, *, *=


    - If both operands are numbers it adds the left operand to the right operand.

    - If one or both operands are strings, it concatenates the two words or characters.

    - Subtracts the right numeric operand from left numeric operand.

    - `+=` Adds left to right and automatically **assigns** to the **left**.

    - `-=` Subtracts right from left and automatically **assigns** to the **left**.

    - `/` Divides the left operand by the right operand.

    - `/=` Divides the left operand by the right operand and automatically **assigns**
    the `quotient` to the **left**.

    - `%` modulu (fetches the remainder of the left operand divided by the right operand).

    - `*` Multiplies the left operand by the right operand.

    - `*=` Multiplies the left operand by the right operand and automatically **assigns**
    the product to the **left**.


    Notice: Because `+=`, `-=`, `/=` and `*=` are assignment operators the left operand
    must be a variable, it cannot be a direct number.


    We will expand these concepts as we code along.


    ### The + plus operator


    The `+` sign has a dual function depending on the type of data JavaScript is processing.


    In a string type, the `+` operator [concatenates](http://en.wikipedia.org/wiki/Concatenation)
    words like in the following examples:


    ```javascript

    "Hello" + "World!";

    ```


    JavaScript puts them together as "HelloWorld!"


    If you really want to space out the words there are three possible ways to accomplish
    the task:


    (1)

    ```javascript

    "Hello" + " " + "World!";

    ```

    (2)

    ```javascript

    "Hello " + "World!";

    ```

    (3)

    ```javascript

    "Hello" + " World!";

    ```


    On the first example I’ve added *an independent* blank space by wrapping it in
    quotes.

    On the second example I’ve placed a space after Hello and before the closing quotation
    mark.

    On the third example I’ve added a trailing space on the word World!


    The first example is useful when we add two variables together because we cannot
    combine leading or trailing spaces with variables due to lack of quotation marks.


    Here’s what I mean:


    ```javascript

    var x = "Hello";

    var y = "World!";

    ```


    Now I concatenate both variables together and assign them to some other variable:


    ```javascript

    var z = x + y;

    ```


    The result for `z` is `HelloWorld!`. The only way to add a space between `x` and
    `y` is to use the first technique:


    ```javascript

    var z = x + " " + y;

    ```


    Now `z` contains "Hello World!".


    ### Using the + plus operator to add two numbers


    When it comes to numbers, the `+` operator adds the operands like shown on the
    following example:


    ```javascript

    3 + 4 + 5;

    ```


    That expression will result in 12.


    ```javascript

    var a = 6;

    var b = 10;

    var c = a + b;

    ```


    Variable `c` is assigned to 16 which is the sum of `a` and `b`.


    ### Using the += assignment operator


    The `+=` is very useful. Suppose variable `i` has the value of 3, and you want
    to add 7 to it, I mean 3 + 7:


    ```javascript

    var i = 3;

    ```


    We could do it this way:


    ```javascript

    i = i + 7;

    ```


    That will assign variable `i` to 10.


    However, this operation is so common (as you will see ahead), that programmers
    created a shortcut operator, the `+=` (call it *plus equals* and never write equals
    plus because it will not work):


    ```javascript

    i += 3;

    ```


    Whenever you see `+=` it means to take the value of the left operand and add the
    right operand to it.


    So now `i` which was 10 is now 13. What happens if I do it again?


    ```javascript

    i += 1;

    ```


    Now `i` is 14.


    What about this one:


    ```javascript

    i += i; // <-- that’s i not 1.

    ```


    The above example is the same as 14 + 14, which results in 28.


    The `+=` operator can also be used in strings to add more characters to the right
    side of the original value:


    ```javascript

    var n = "T";

    n += "o"; // results in "To"

    n += "n"; // results in "Ton"

    n += "y"; // results in "Tony"

    ```


    This can be very useful in *loops* in order to automatically construct a phrase
    or a list of names as we will see later.


    ### The ++ (double plus) incrementing operator


    Many times we want to increment the value by just 1 unit. This is a very common
    technique in programming.


    We could do it in three ways:


    Assuming `var x = 5;`:


    ```javascript

    x = x + 1; // now x is 6

    x += 1;     // now x is 7

    x++;       // now x is 8

    ```


    The `++` operator is the most common way to increment a value.


    ### The -- decrement operator


    The `--` operator is the opposite of the `++` operator. It decreases the value
    by 1 unit.


    Assuming `var x = 5;`:


    ```javascript

    x = x - 1; // now x is 4

    x -= 1;     // now x is 3

    x--;       // now x is 2

    ```


    The `--` operator is the most common way to decrement a value.


    ### The subtraction operator


    The `-` operator subtracts the right numeric operand from the left numeric operand.


    ```javascript

    10 - 5; // result in 5

    ```


    We can also use the `-=` operator to subtract a value from the original variable:


    ```javascript

    x = 10;

    x -= 2; // x is now 8

    ```


    ### The division operator /


    The `/` operator divides the left operand by the right operand.


    ```javascript

    10 / 2; // result in 5

    ```


    We can also use the `/=` operator to divide the original variable and assign the
    result back to it:


    ```javascript

    x = 10;

    x /= 2; // x is now 5

    ```


    ### The modulus operator %


    The `%` operator fetches the remainder of the left operand divided by the right
    operand.


    ```javascript

    10 % 3; // result in 1

    ```


    We can also use the `%=` operator to find the remainder and assign it back to
    the variable:


    ```javascript

    x = 10;

    x %= 3; // x is now 1

    ```


    ### The multiplication operator *


