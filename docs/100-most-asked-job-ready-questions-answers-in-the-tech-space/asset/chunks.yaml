    # Java 面试问题与解答


    ### 21. 什么是抽象类？

    回答：抽象类是一个被设计为具有实现缺口（implementation gaps）供子类填充的类，它是刻意不完整的。


    ### 22. 请列举三个支持绘制（painting）的 Component 子类？

    回答：`Canvas`、`Frame`、`Panel`Panel` 和 `Applet` 类支持绘制。


    ### 23. JDK 和 JVM 有什么区别？

    回答：

    - **JDK**：Java 开发工具包（Java Development Kit）。它提供了编译、调试和执行 Java 程序所需的所有工具、可执行文件和二进制文件。

    - **JVM**：Java 虚拟机（Java Virtual Machine）。执行部分由 `JVM` 处理，以提供机器无关性。


    ### 24. 为什么 Java 不支持多继承？

    回答：由于“菱形问题”（Diamond Problem），Java 在类中不支持多继承。


    ### 25. 作为外部类成员的内部类可以使用哪些修饰符？

    回答：一个（非局部）内部类可以被声明为 `public`、`protected`、`private`、`static`、`final` 或 `abstract`。


    ### 26. 哪些 `java.util` 类和接口支持事件处理？

    回答：`Event Object` 类和 `Event Listener` 接口支持事件处理。


    ### 27. 什么是瞬态变量（transient variable）？

    回答：`transient` 变量是一个不可被序列化的变量。


    ### 28. null 是关键字吗？

    回答：不是，`null` 不是关键字。


    ### 29. 什么是 applet？

    回答：Applet 是一种动态且交互的程序，运行在由支持 Java 的浏览器显示的网页内部。


    ### 30. applet 的生命周期是什么？

    回答：

    - `init()` 方法 – 在 applet 首次加载时被调用。

    - `start()` 方法 – 在每次 applet 启动时被调用。

    - `paint()` 方法 – 在 applet 最小化或最大化时被调用。

    - `stop()` 方法 – 当浏览器离开 applet 所在的页面时使用。

    - `destroy()` 方法 – 当浏览器完成对 applet 的使用时被调用。


    ### 31. JDK 1.2 中 stop()、suspend() 和 resume() 方法有什么新变化？

    回答：这些方法（`stop()`、`suspend()`、`resume()`）在 `JDK 1.2` 中已被弃用（deprecated）。


    ### 32. 什么是 Vector 类？

    回答：`Vector` 类提供了实现可增长对象数组的能力。


    ### 33. >> 和 >>> 运算符有什么区别？

    回答：`>>` 运算符在右移时保留符号位，而 `>>>` 则在移出的位上填充零。


    ### 34. this() 和 super() 有什么区别？

    回答：`this()` 用于调用同一类的构造函数，而 `super()` 用于调用父类的构造函数。


    ### 35. 什么是本地方法（native method）？

    回答：本地方法是用 Java 以外的语言实现的方法。


    ### 36. readLine() 在到达文件末尾时返回什么值？

    回答：`readLine()` 方法在到达文件末尾时返回 `null`。


    ### 37. 什么是 Java API？

    回答：Java API 是一个庞大的预制软件组件集合，提供了许多有用的功能，例如图形用户界面（GUI）组件。


    ### 38. 为什么 Java 中没有全局变量？

    回答：全局变量在全局范围内可访问。Java 不支持全局可访问变量的原因如下：

    1. 全局变量破坏了引用透明性（referential transparency）。

    2. 全局变量会在命名空间中产生冲突。


    ### 39. 访问修饰符有哪些不同类型？

    回答：

    - `public`：声明为 `public` 的任何内容都可以从任何地方访问。

    - `private`：声明为 `private` 的任何内容在类外部不可见。

    - `protected`：声明为 `protected` 的任何内容可以被同一包中的类以及其他包中的子类访问。

    - `default` 修饰符：仅能被同一包中的类访问。


    ### 40. 什么是构造函数（Constructor）？

    回答：构造函数是一个特殊的方法，其任务是初始化其类的对象。

    - 它之所以特殊，是因为它的名称与类名相同。

    - 它们没有返回类型，甚至没有 `void`，因此它们不能返回值。

    - 它们不能被继承，尽管派生类可以调用基类构造函数。

    - 每当创建其关联类的对象时，就会调用构造函数。


    ### 41. 什么是迭代器（Iterator）？

    回答：`Iterator` 接口用于遍历 `Collection` 的元素。

    - 迭代器允许你处理 `Collection` 中的每个元素。

    - 无论 `Collection` 如何组织，迭代器都是遍历其所有元素的通用方式。

    - `Iterator` 是一个接口，针对每个 `Collection` 都有不同的实现方式。


    ### 42. Reader/Writer 和 InputStream/OutputStream 有什么区别？

    回答：`Reader`/`Writer` 类是以字符为导向的，而 `InputStream`/`OutputStream` 类是以字节为导向的。


    ### 43. 什么是 servlet？

    回答：Servlets 是扩展请求/响应导向服务器（如支持 Java 的 Web 服务器）的模块。例如，servlet 可能负责接收 HTML 订单输入表单中的数据，并应用业务逻辑来更新公司的订单数据库。


    ### 44. 什么是裁剪（clipping）？

    回答：裁剪是将绘制操作限制在有限区域或形状中的过程。


    ### 45. 什么是内存泄漏（memory leak）？

    回答：内存泄漏是指一个不再被引用且永远不会被再次使用的对象仍然留在内存中，且没有被垃圾回收。


    ### 46. for 语句可以无限循环吗？

    回答：是的，`for` 语句可以无限循环。例如：

    ```

    for(;;)

    ```


    ### 47. 请解释 Java 方法的编码标准？

    回答：

    1. 方法名应以小写字母开头。

    2. 方法名通常是动词。

    3. 如果一个方法包含多个单词，每个内部单词应以大写字母开头。例如：`toString()`。

    4. 方法名必须是动词和名词的组合。例如：`getCarName()`、`getCarNumber()`。


    ### 48. 为什么 Java 不是纯面向对象语言？

    回答：Java 支持基本类型（如 `int`、`byte`、`short`、`long` 等），这就是为什么它不被认为是纯面向对象语言的原因。


    ### 49. 访问修饰符有哪些？

    回答：Java 提供了三种访问控制，如 `public`、`private` 和 `protected` 访问修饰符。当这些都没有使用时，被称为 `default`
    访问修饰符。


    ### 50. 我们可以重载 main 方法吗？

    回答：是的，我们可以使用 `public static void main(String args[])` 这种语法来重载 `main` 方法。


    ### 51. Java 中的方法是什么？

    回答：它包含一个可执行主体，可以应用于类的特定对象。方法包括方法名、参数或实参、返回类型以及可执行代码体。


    语法：

    ```

    type methodName(Argument List){ ... }

    ```

    示例：`public float add(int a, int b, int c)` 方法可以有多个参数。当有多个参数时，用逗号分隔。


    ### 52. 请解释 Java 中的自动类型转换？

    回答：如果满足以下条件，Java 将进行自动类型转换：

    1. 当两种类型兼容时。例如：`int`、`float`；`int` 可以直接赋值给 `float` 变量。

    2. 目标类型大于源类型。例如：`int`、`long`。


    `int` 可以直接赋值给 `long`。如果将 `int` 赋值给 `long`，则会发生自动类型转换，因为 `long` 是比 `int` 更大的数据类型。拓宽转换（Widening
    Conversion）属于自动类型转换。


    ### 53. ++ 运算符的前缀形式和后缀形式有什么区别？

    回答：前缀形式先执行递增操作，然后返回递增后的值。后缀形式先返回整个表达式的当前值，然后对该值执行递增操作。


    ### 54. 在 Java 中有多少种处理异常的方法？

    回答：我们可以通过以下两种方式之一来处理异常：

    1. 通过指定 `try-catch` 块来捕获异常。

    2. 使用 `throws` 子句声明方法。


    ### 55. Java 中的 null 是什么意思？

    回答：当一个引用变量不指向任何值时，它被赋值为 `null`。

    示例：`Employee employee;` 在上述示例中，`employee` 对象尚未实例化，因此它不指向任何地方。


