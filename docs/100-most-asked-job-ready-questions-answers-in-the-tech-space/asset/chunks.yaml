    # SQL 运算符与函数参考


    `LIKE` 运算符用于 `WHERE` 子句中，以搜索列中指定的模式。它允许使用通配符，例如 `%`（匹配任意字符序列）和 `_`（匹配任意单个字符）。


    ## SQL 运算符


    ### 50. `IN` 运算符的作用是什么？

    `IN` 运算符用于 `WHERE` 子句中，检查某个值是否与列表或子查询中的任意值匹配。


    ### 51. `BETWEEN` 运算符的作用是什么？

    `BETWEEN` 运算符` 用于 `WHERE` 子句中，检查某个值是否位于指定的值范围内（包含端点）。


    ### 52. `EXISTS` 运算符的作用是什么？

    `EXISTS` 运算符用于 `WHERE` 子句中，检查子查询是否返回任何行。如果子查询结果集非空，则返回 true。


    ## 聚合函数


    ### 53. `COUNT()` 函数的作用是什么？

    `COUNT()` 函数用于统计行数或列中非空值的数量。


    ### 54. `SUM()` 函数的作用是什么？

    `SUM()` 函数用于计算列中值的总和。


    ### 55. `AVG()` 函数的作用是什么？

    `AVG()` 函数用于计算列的平均值。


    ### 56. `MAX()` 函数的作用是什么？

    `MAX()` 函数用于获取列中的最大值。


    ### 57. `MIN()` 函数的作用是什么？

    `MIN()` 函数用于获取列中的最小值。


    ### 58. `GROUP_CONCAT()` 函数的作用是什么？

    `GROUP_CONCAT()` 函数用于将多行中的值连接成一个字符串，并按特定列进行分组。


    ## 表操作与关系


    ### 59. `JOIN` 关键字的作用是什么？

    `JOIN` 关键字用于根据相关列组合两个或多个表中的行。


    ### 60. 什么是自引用表？

    自引用表是指具有外键列引用自身主键的表。它用于在单个表中表示层次关系。


    ### 61. `UNION` 和 `UNION ALL` 有什么区别？

    `UNION` 合并两个或多个 `SELECT` 语句的结果集，并去除重复行；而 `UNION ALL` 合并结果集但不去除重复行。


    ## 窗口函数


    ### 62. `ROW_NUMBER()` 函数的作用是什么？

    `ROW_NUMBER()` 函数为结果集中的每一行分配一个唯一的连续编号。常用于分页或排名。


    ### 63. `RANK()` 函数的作用是什么？

    `RANK()` 函数根据指定条件（如按列排序）为结果集中的每一行分配一个排名。它允许你识别每一行的排名。


    ### 64. `DENSE_RANK()` 函数的作用是什么？

    `DENSE_RANK()` 函数与 `RANK()` 函数类似，但为行分配连续的排名，没有间隔。如果两行排名相同，则跳过下一个排名。


    ### 65. `LAG()` 函数的作用是什么？

    `LAG()` 函数用于根据指定列访问结果集中前一行的值。它允许你比较相邻行之间的值。


    ### 66. `LEAD()` 函数的作用是什么？

    `LEAD()` 函数用于根据指定列访问结果集中后一行的值。它允许你比较相邻行之间的值。


    ## 高级 SQL 逻辑与语句


    ### 67. `COALESCE()` 函数的作用是什么？

    `COALESCE()` 函数用于返回表达式列表中第一个非空值。常用于在列值为空时提供默认值。


    ### 68. `CASE` 语句的作用是什么？

    `CASE` 语句用于在 SQL 语句中执行条件逻辑。它允许你评估多个条件，并根据结果返回不同的值。


    ### 69. `TRUNCATE TABLE` 语句的作用是什么？

    `TRUNCATE TABLE` 语句用于删除表中的所有行，同时保留表结构。它比使用 `DELETE` 语句删除所有行更快。


    ## 约束与索引


    ### 70. `CONSTRAINT` 关键字的作用是什么？

    `CONSTRAINT` 关键字用于定义表中列上的规则和关系。它确保数据完整性并强制执行业务规则。


    ### 71. `PRIMARY KEY` 约束的作用是什么？

    `PRIMARY KEY` 约束用于唯一标识表中的每条记录。它确保主键列具有唯一值且不能包含空值。


    ### 72. `FOREIGN KEY` 约束的作用是什么？

    `FOREIGN KEY` 约束用于基于公共列建立两个表之间的关系。它通过强制外键列中的值存在于被引用表的主键中，确保引用完整性。


    ### 73. `INDEX` 关键字的作用是什么？

    `INDEX` 关键字用于在表的一个或多个列上创建索引。它通过允许基于索引列更快地检索数据来提高查询性能。


    ### 74. `FOREIGN KEY` 约束中的 `CASCADE` 关键字的作用是什么？

    `CASCADE` 关键字用于指定对被引用表中主键值的更改应传播到引用表中的外键值。这确保关系保持有效。


    ## 数据操作与事务


    ### 75. `UPDATE` 语句的作用是什么？

    `UPDATE` 语句用于修改表中的现有记录。它允许你根据指定条件更改一个或多个列的值。


    ### 76. `DELETE` 语句的作用是什么？

    `DELETE` 语句用于删除表中的一条或多条记录。它允许你根据指定条件删除行。


    ### 77. `COMMIT` 语句的作用是什么？

    `COMMIT` 语句用于永久保存事务中对数据库所做的所有更改。提交后，更改对其他用户可见。


    ### 78. `ROLLBACK` 语句的作用是什么？

    `ROLLBACK` 语句用于撤销事务中所有更改，并将数据库恢复到之前的状态。通常在发生错误或需要取消事务时使用。


    ### 79. `SAVEPOINT` 语句的作用是什么？

    `SAVEPOINT` 语句用于在事务中定义一个特定点，你可以回滚到该点。它允许你撤销到特定保存点，而不必回滚整个事务。


    ### 80. `ALTER TABLE` 语句中的 `CONSTRAINT` 关键字的作用是什么？

    `ALTER TABLE` 语句中的 `CONSTRAINT` 关键字用于在现有表的列上添加、修改或删除约束。


    ## 查询子句


    ### 81. `SELECT` 语句中的 `DISTINCT` 关键字的作用是什么？

    `SELECT` 语句中的 `DISTINCT` 关键字用于从结果集的列中检索唯一值，消除重复行。


    ### 82. `SELECT` 语句中的 `AS` 关键字的作用是什么？

    `SELECT` 语句中的 `AS` 关键字用于为列或表分配别名。它允许你在查询的后续部分中使用该别名引用列或表。


    ### 83. `SELECT` 语句中的 `ORDER BY` 子句的作用是什么？

    `SELECT` 语句中的 `ORDER BY` 子句用于根据一个或多个列按升序或降序对结果集进行排序。


    ### 84. `SELECT` 语句中的 `GROUP BY` 子句的作用是什么？

    `SELECT` 语句中的 `GROUP BY` 子句用于根据一个或多个列对行进行分组。通常与聚合函数一起使用，对每个组执行计算。


    ### 85. `SELECT` 语句中的 `HAVING` 子句的作用是什么？

    `SELECT` 语句中的 `HAVING` 子句用于根据特定条件过滤分组后的行。它作用于 `GROUP BY` 子句的结果。


    ### 86. `SELECT` 语句中的 `LIMIT` 子句的作用是什么？


