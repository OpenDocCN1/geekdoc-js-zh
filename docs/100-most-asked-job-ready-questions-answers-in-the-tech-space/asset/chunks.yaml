    # Python Interview Questions


    ## Decorators and Functions

    ### What are decorators in Python?

    Decorators in Python are a way to modify or enhance the behavior of functions
    or classes without directly modifying their source code. Decorators are implemented
    as functions that wrap around the target function or class and add additional
    functionality.


    ### What is the purpose of the `@property` decorator in Python?

    The `@property` decorator in Python is used to define a method as a getter for
    a class attribute. It allows accessing the attribute as if it were a normal attribute,
    while internally calling the getter method.


    ### What is the purpose of the `@staticmethod` decorator in Python?

    The `@staticmethod` decorator in Python is used to define a static method in a
    class. Static methods do not require an instance of the class to be called and
    can be accessed directly from the class itself.


    ### What is the purpose of the `@classmethod` decorator in Python?

    The `@classmethod` decorator in Python is used to define a class method. Class
    methods receive the class itself as the first parameter, allowing them to access
    and modify class-level attributes and perform operations specific to the class.


    ### What is a lambda function in Python?

    A `lambda` function in Python is an anonymous function that can be defined in
    a single line. It is often used for simple, one-time operations and does not require
    a formal `def` statement.


    ## Modules and Packages

    ### What are modules in Python?

    Modules in Python are files that contain Python code and definitions. They can
    be imported and used in other Python programs to provide reusable functionality.


    ### What are packages in Python?

    Packages in Python are a way to organize related modules into a directory hierarchy.
    They allow for better organization and modularization of code, making it easier
    to manage large projects.


    ### What is the purpose of the `__init__.py` file in a package?

    The `__init__.py` file in a package serves as an indicator that the directory
    is a Python package. It can be empty or contain initialization code that is executed
    when the package is imported.


    ## Standard Library Modules

    ### What is the purpose of the `sys` module in Python?

    The `sys` module in Python provides access to system-specific parameters and functions.
    It allows interaction with the Python interpreter and provides information about
    the runtime environment.


    ### What is the purpose of the `os` module in Python?

    The `os` module in Python provides a way to interact with the operating system.
    It allows performing various operations related to file and directory manipulation,
    process management, and environment variables.


    ### What is the purpose of the `datetime` module in Python?

    The `datetime` module in Python provides classes for manipulating dates and times.
    It allows creating, formatting, and performing operations on dates and times.


    ### What is the purpose of the `random` module in Python?

    The `random` module in Python provides functions for generating random numbers.
    It allows you to generate random integers, floating-point numbers, and make random
    selections from lists.


    ### What is the purpose of the `json` module in Python?

    The `json` module in Python provides functions for working with JSON (JavaScript
    Object Notation) data. It allows encoding Python objects into JSON strings and
    decoding JSON strings into Python objects.


    ### What is the purpose of the `pickle` module in Python?

    The `pickle` module in Python provides functions for serializing and deserializing
    Python objects. It allows you to convert Python objects into a binary format that
    can be stored or transmitted, and then restore them back into objects.


    ## Advanced Concepts

    ### What are generators in Python?

    Generators in Python are functions that can be paused and resumed, allowing them
    to produce a sequence of values over time. They are memory-efficient and provide
    a convenient way to iterate over large or infinite sequences.


    ### What is the purpose of the `yield` keyword in Python?

    The `yield` keyword in Python is used in the context of generators. It allows
    a generator function to temporarily pause and yield a value to the caller, without
    losing its internal state. The generator can then be resumed to continue execution
    from where it left off.


    ### What is the purpose of the `zip()` function in Python?

    The `zip()` function in Python is used to combine multiple iterables (such as
    lists or tuples) into a single iterable of tuples. It pairs up corresponding elements
    from each iterable, stopping when the shortest iterable is exhausted.


    # CHAPTER 2: 100 MOST ASKED SQL JOB INTERVIEW QUESTIONS


    ## SQL Basics

    ### What is SQL?

    SQL (Structured Query Language) is a programming language used for managing relational
    databases. It allows users to store, manipulate, and retrieve data from databases.


    ### What are the different types of SQL statements?

    SQL statements can be categorized into three types:

    - Data Definition Language (DDL): Used for creating, altering, and dropping database
    objects.

    - Data Manipulation Language (DML): Used for querying, inserting, updating, and
    deleting data.

    - Data Control Language (DCL): Used for controlling access to the database, granting
    or revoking privileges.


    ## Keys and Constraints

    ### What is a primary key?

    A primary key is a column or a set of columns that uniquely identifies each record
    in a table. It ensures data integrity and allows efficient retrieval of data.


    ### What is a foreign key?

    A foreign key is a column or a set of columns in a table that refers to the primary
    key of another table. It establishes a relationship between the two tables.


    ### What is a composite key?

    A composite key is a primary key composed of two or more columns. Together, these
    columns uniquely identify each record in a table.


    ## Data Manipulation and Queries

    ### What is the difference between `DELETE` and `TRUNCATE`?

    `DELETE` is a DML statement used to remove specific rows from a table, whereas
    `TRUNCATE` is a DDL statement used to remove all rows from a table, effectively
    resetting the table.


    ### What is a subquery?

    A subquery is a query nested within another query. It can be used to retrieve
    data from one table based on values from another table or perform complex calculations.


    ### What is the difference between a subquery and a join?

    A subquery is a query nested within another query, whereas a join is used to combine
    rows from two or more tables based on related columns.


    ### What is a self-join?

    A self-join is a join operation where a table is joined with itself. It is useful
    when you want to compare rows within the same table.


    ### What are the different types of JOIN operations?

    The different types of `JOIN` operations are:

    - `INNER JOIN`: Returns only the matching rows from both tables.

    - `LEFT JOIN`: Returns all rows from the left table and matching rows from the
    right table.

    - `RIGHT JOIN`: Returns all rows from the right table and matching rows from the
    left table.

    - `FULL JOIN`: Returns all rows from both tables.


    ## Database Design and Optimization

    ### What is normalization in SQL?

    Normalization is the process of organizing data in a database to eliminate redundancy
    and dependency issues. It involves splitting tables into smaller, more manageable
    entities.


    ### What are the different normal forms in database normalization?

    The different normal forms are:

    - First Normal Form (1NF): Eliminates duplicate rows and ensures atomicity of
    values.

    - Second Normal Form (2NF): Ensures that each non-key column depends on the entire
    primary key.

    - Third Normal Form (3NF): Ensures that each non-key column depends only on the
    primary key and not on other non-key columns.

    - Fourth Normal Form (4NF): Eliminates multi-valued dependencies.

    - Fifth Normal Form (5NF): Eliminates join dependencies.


    ### What is an index?

    An index is a database structure that improves the speed of data retrieval operations
    on database tables. It allows faster searching, sorting, and filtering of data.


