    ## JavaScript 知识库


    `filter()` 函数用于创建一个新数组，其中包含通过提供的函数所定义的特定条件的元素。它允许根据特定条件从数组中筛选元素。


    ### 21. JavaScript 中 `reduce()` 函数的作用是什么？

    `reduce()` 函数用于通过对每个元素应用一个函数并累积结果，将数组归约为单个值。它常用于对数组执行计算或转换。


    ### 22. JavaScript 中什么是回调函数？

    回调函数是作为参数传递给另一个函数的函数，并在稍后时间或响应事件时执行。它支持异步和事件驱动编程。


    ### 23. JavaScript 中 `let` 和 `var` 有什么区别？

    `let` 关键字声明块级作用域的变量，而 `var` 关键字声明函数级作用域的变量。使用 `var` 声明的变量会被提升，而使用 `let` 声明的变量则不会。


    ### 24. 什么是 JavaScript 模块？

    JavaScript 模块是可重用的代码片段，封装了相关功能。它们允许在大型 JavaScript 应用程序中实现更好的组织、封装和代码复用。


    ### 25. JavaScript 中什么是对象解构？

    对象解构是一种特性，允许从对象中提取属性并将其赋值给变量。它提供了一种简洁的方式来提取值并处理对象属性。


    ### 26. 什么是 JavaScript 类？

    JavaScript 类是一种定义具有共享属性和行为的对象的方式。它们为创建具有相似特征的多个对象实例提供了模板。


    ### 27. JavaScript 中什么是继承？

    继承是 JavaScript 中的一种机制，其中一个对象可以从另一个对象继承属性和方法。它允许代码复用并在对象之间创建层次关系。


    ### 28. 什么是 JavaScript 的 getter 和 setter？

    Getter 和 setter 是特殊方法，分别用于获取和设置对象属性的值。它们提供对属性访问的控制，并支持数据验证和封装。


    ### 29. JavaScript 中 `try/catch` 语句的作用是什么？

    `try/catch` 语句用于 JavaScript 中的错误处理。它允许捕获并处理代码块执行期间发生的异常。


    ### 30. JavaScript 中 `let` 和 `const` 有什么区别？

    `let` 关键字用于声明可以重新赋值的变量，而 `const` 关键字用于声明只读且不能重新赋值的变量。


    ### 31. JavaScript 中 `forEach()` 函数的作用是什么？

    `forEach()` 函数用于对数组中的每个元素执行一次提供的函数。它提供了一种简便的方法来遍历数组元素并对其执行操作。


    ### 32. JavaScript 中 `localStorage` 对象的作用是什么？

    `localStorage` 对象允许 Web 应用程序在用户浏览器本地存储键值对。它提供了一种简单的方式来持久化存储和检索数据。


    ### 33. 什么是箭头函数？它们与普通函数有何不同？

    箭头函数是 JavaScript 中定义函数的一种简洁语法。与普通函数相比，它们具有更短的语法，并且不绑定自己的 `this` 值。


    ### 34. JavaScript 中 `setTimeout()` 函数的作用是什么？

    `setTimeout()` 函数用于在指定的延迟时间（以毫秒为单位）后调度执行一个函数。它允许在 JavaScript 代码中添加基于时间的延迟。


    ### 35. JavaScript 中什么是事件冒泡？

    事件冒泡是一种机制，其中在特定元素上触发的事件也会在其所有父元素上触发相同的事件。它从最内层元素开始，并在 DOM 树中向上传播。


    ### 36. JavaScript 中 `fetch()` 函数的作用是什么？

    `fetch()` 函数用于发起 HTTP 请求并从网络获取资源。它提供了一种现代且灵活的方式来执行异步网络请求。


    ### 37. `null` 和 `undefined` 有什么区别？

    `null` 是显式赋值的值，表示对象的缺失；而 `undefined` 是 JavaScript 引擎分配给已声明但未赋值的变量的值。


    ### 38. JavaScript 中什么是事件传播？

    事件传播是事件在元素上触发，然后传播到其父元素或从其父元素向下捕获的过程。它允许在 DOM 层次结构的不同级别处理事件。


    ### 39. JavaScript 中 `Object.keys()` 函数的作用是什么？

    `Object.keys()` 函数用于提取对象的所有键，并将它们作为数组返回。它提供了一种简便的方法来遍历对象的属性。


    ### 40. JavaScript 中 `null` 和 `undefined` 有什么区别？

    `null` 是赋值的值，表示有意缺失的对象值；而 `undefined` 表示未初始化或未定义的值，通常用作默认初始值。


    ### 41. JavaScript 中 `addEventListener()` 方法的作用是什么？

    `addEventListener()` 方法用于向元素附加事件监听器。它允许你监听特定事件，并在事件触发时执行一个函数。


    ### 42. JavaScript 中 `parentNode` 属性的作用是什么？

    `parentNode` 属性用于访问 DOM 中元素的父节点。它允许通过访问元素的直接父节点来遍历和操作 DOM 树。


    ### 43. JavaScript 中 `querySelector()` 方法的作用是什么？

    `querySelector()` 方法用于选择与指定 CSS 选择器匹配的第一个元素。它提供了一种基于 CSS 选择器从 DOM 中检索元素的强大方式。


    ### 44. JavaScript 中 `querySelectorAll()` 方法的作用是什么？

    `querySelectorAll()` 方法用于选择与指定 CSS 选择器匹配的所有元素。它返回一个元素集合，可以通过索引进行迭代或访问。


    ### 45. `querySelector()` 和 `getElementById()` 有什么区别？

    `querySelector()` 是一种更通用的方法，允许基于任何 CSS 选择器选择元素，而 `getElementById()` 专门用于通过其唯一的
    `id` 属性选择元素。


    ### 46. JavaScript 中函数声明和函数表达式有什么区别？

    函数声明会被提升，可以在定义之前调用；而函数表达式不会被提升，必须在定义之后才能调用。


    ### 47. JavaScript 中 `bind()` 方法的作用是什么？

    `bind()` 方法用于创建一个新函数，并指定其 `this` 值和初始参数。它允许显式绑定函数内的 `this` 值。


    ### 48. JavaScript 中 `call()` 方法的作用是什么？

    `call()` 方法用于调用一个函数，并指定其 `this` 值以及逐个提供的参数。它允许借用其他对象的方法并显式调用函数。


    ### 49. JavaScript 中 `apply()` 方法的作用是什么？

    `apply()` 方法用于调用一个函数，并指定其 `this` 值以及以数组或类数组对象形式提供的参数。它允许借用其他对象的方法并显式调用函数。


    ### 50. JavaScript 中 `Array.isArray()` 方法的作用是什么？

    `Array.isArray()` 方法用于判断给定值是否为数组。如果该值是数组，则返回 `true`，否则返回 `false`。


    ### 51. JavaScript 中什么是事件捕获？

    事件捕获是事件在到达目标元素之前，首先在元素的父元素上触发的过程。它允许在 DOM 层次结构的最外层捕获事件。


