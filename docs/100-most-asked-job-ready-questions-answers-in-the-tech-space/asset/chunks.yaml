    # JavaScript Date and Utility Methods


    ### 85. What is the purpose of the `setMonth()` method in JavaScript Date objects?

    The `setMonth()` method is used to set the month value of a JavaScript `Date`
    object. It allows modifying the month component of a date.


    ### 86. What is the purpose of the `setDate()` method in JavaScript Date objects?

    The `setDate()` method is used to set the day of the month value of a JavaScript
    `Date` object. It allows modifying the day component of a date.


    ### 87. What is the purpose of the `setHours()` method in JavaScript Date objects?

    The `setHours()` method is used to set the hour value of a JavaScript `Date` object.
    It allows modifying the hour component of a date.


    ### 88. What is the purpose of the `setMinutes()` method in JavaScript Date objects?

    The `setMinutes()` method is used to set the minute value of a JavaScript `Date`
    object. It allows modifying the minute component of a date.


    ### 89. What is the purpose of the `setSeconds()` method in JavaScript Date objects?

    The `setSeconds()` method is used to set the second value of a JavaScript `Date`
    object. It allows modifying the second component of a date.


    ### 90. What is the purpose of the `toLocaleString()` method in JavaScript Date
    objects?

    The `toLocaleString()` method is used to convert a JavaScript `Date` object to
    a localized string representation based on the current locale. It considers the
    user''s time zone and regional settings to format the date and time.


    ### 91. What is the purpose of the `toDateString()` method in JavaScript Date
    objects?

    The `toDateString()` method is used to convert the date portion of a JavaScript
    `Date` object to a human-readable string representation. It returns the date in
    the format ''Day Mon DD YYYY'', such as ''Thu Jun 24 2023''.


    ### 92. What is the purpose of the `getTime()` method in JavaScript Date objects?

    The `getTime()` method is used to retrieve the timestamp value of a JavaScript
    `Date` object. It returns the number of milliseconds elapsed since January 1,
    1970, 00:00:00 UTC.


    ### 93. What is the purpose of the `setTime()` method in JavaScript Date objects?

    The `setTime()` method is used to set the timestamp value of a JavaScript `Date`
    object. It allows modifying the date and time by providing a new timestamp.


    ### 94. What is the purpose of the `setTimeout()` function in JavaScript?

    The `setTimeout()` function is used to execute a specified function or a piece
    of code after a delay specified in milliseconds. It is commonly used for delaying
    the execution of code or creating timeouts.


    ### 95. What is the purpose of the `setInterval()` function in JavaScript?

    The `setInterval()` function is used to repeatedly execute a specified function
    or a piece of code at a fixed interval specified in milliseconds. It is commonly
    used for creating intervals and timers.


    ### 96. What is the purpose of the `clearTimeout()` function in JavaScript?

    The `clearTimeout()` function is used to cancel a timeout set by the `setTimeout()`
    function. It clears the scheduled execution of a function before it is triggered.


    ### 97. What is the purpose of the `clearInterval()` function in JavaScript?

    The `clearInterval()` function is used to cancel an interval set by the `setInterval()`
    function. It stops the repeated execution of a function at a fixed interval.


    ### 98. What is the purpose of the `isNaN()` function in JavaScript?

    The `isNaN()` function is used to check if a value is `NaN` (Not-a-Number). It
    returns `true` if the value is `NaN`, and `false` otherwise.


    ### 99. What is the purpose of the `isFinite()` function in JavaScript?

    The `isFinite()` function is used to check if a value is a finite number. It returns
    `true` if the value is a finite number, and `false` otherwise. It also returns
    `false` for `NaN`, `Infinity`, and `-Infinity`.


    ### 100. What is the purpose of the `parseFloat()` function in JavaScript?

    The `parseFloat()` function is used to parse a string and extract a floating-point
    number from it. It converts the initial portion of the string that represents
    a valid floating-point number into a number value.


    ## CHAPTER 4: 100 MOST ASKED JAVASCRIPT JOB INTERVIEW QUESTIONS


    1. **What is a class in Java?**

    Answer: Java encapsulates the codes in various classes which define new data types.
    These new data types are used to create objects.


    2. **What is a JVM?**

    Answer: `JVM` is Java Virtual Machine which is a run time environment for the
    compiled java class files.


    3. **What is the right data type to represent a price in Java?**

    Answer: `BigDecimal`, if memory is not a concern and Performance, is not critical,
    otherwise `double` with predefined precision.


    4. **Does Java support multiple inheritances?**

    Answer: Java doesn’t support multiple inheritances.


    5. **What are the supported platforms by Java Programming Language?**

    Answer: Java runs on a variety of platforms, such as Windows, Mac OS, and the
    various versions of UNIX/Linux like HP-Unix, Sun Solaris, Red hat Linux, Ubuntu,
    Cent OS, etc.


    6. **List any five features of Java?**

    Answer: Some features include Object Oriented, Platform Independent, Robust, Interpreted,
    Multi-threaded.


    7. **Explain method overloading?**

    Answer: When a Java program contains more than one methods with the same name
    but different properties, then it is called method overloading.


    8. **What restrictions are placed on the location of a package statement within
    a source code file?**

    Answer: A package statement must appear as the first line in a source code file
    (eliminating blank lines and comments).


    9. **What method is used to specify a container’s layout?**

    Answer: The `setLayout()` method is used to specify a container’s layout.


    10. **What is the immediate superclass of the `Applet` class?**

    Answer: The `Panel` class is the immediate superclass of the `Applet` class.


    11. **What are the access modifiers in Java?**

    Answer: There are 3 access modifiers: `public`, `protected` and `private`, and
    the default one if no identifier is specified is called friendly, but programmer
    cannot specify the friendly identifier explicitly.


    12. **What are packages?**

    Answer: A package is a collection of related classes and interfaces providing
    access protection and namespace management.


    13. **What is meant by Inheritance and What are its advantages?**

    Answer: Inheritance is the process of inheriting all the features from a class.
    The advantages of inheritance are reusability of code and accessibility of variables
    and methods of the super class by subclasses.


    14. **Can we rethrow the same exception from catch handler?**

    Answer: Yes, we can rethrow the same exception from our catch handler. If we want
    to rethrow checked exception from a catch block we need to declare that exception.


    15. **What value is a variable of the `String` type automatically initialized?**

    Answer: The default value of a `String` type is `null`.


    16. **When a thread blocks on I/O, what state does it enter?**

    Answer: When it blocks on I/O, A thread enters the waiting state.


    17. **Which containers use a Flow Layout as their default layout?**

    Answer: The `Panel` and `Applet` classes use the Flow Layout as their default
    layout.


    18. **Explain Java Coding Standards for Constants?**

    Answer: Constants in java are created using `static` and `final` keywords.

    1) Constants contain only uppercase letters.

    2) If the constant name is a combination of two words it should be separated by
    an underscore.

    3) Constant names are usually nouns. Ex: `MAX_VALUE`, `MIN_VALUE`, `MAX_PRIORITY`,
    `MIN_PRIORITY`


    19. **What is synchronization and why is it important?**

    Answer: The term synchronization is the ability to control the access of multiple
    threads to shared resources. And it is important because, without it, it is not
    possible for one thread to modify a shared object while another thread is in the
    process of using or updating that object’s value. This often leads to major errors.


    20. **Explain Java Coding Standards for variables?**

    Answer: 1) Variable names should start with small letters. 2) Variable names should
    be nouns 3) Short meaningful names are recommended. 4) If there are multiple words
    every inner world should start with Uppercase character. Ex: `string`, `value`,
    `empName`, `MEP salary`


    21. **What is an abstract class?**

