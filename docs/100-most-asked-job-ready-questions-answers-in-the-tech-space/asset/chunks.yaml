    a.


    The ORDER BY clause in the SELECT statement is used to sort the result set based
    on one or more columns in ascending or descending order.


    84.


    What is the purpose of the GROUP BY clause in the SELECT statement?


    a.


    The GROUP BY clause in the SELECT statement is used to group rows based on one
    or more columns. It is typically used with aggregate functions to perform calculations
    on each group.


    85.


