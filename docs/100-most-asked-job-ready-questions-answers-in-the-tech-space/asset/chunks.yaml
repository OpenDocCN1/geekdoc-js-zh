    # 数据库知识库


    聚集索引决定了表中数据的物理顺序。每个表只能有一个聚集索引，通常创建在主键列上。


    ## 索引与键


    ### 15. 什么是非聚集索引？

    非聚集索引是与表分离的独立结构，包含选定列的排序列表。它能够提升搜索和过滤操作的性能。


    ### 16. 主键和唯一键有什么区别？

    主键是唯一标识表中每条记录的一列或一组列，且不能包含 `NULL` 值。而唯一键允许 `NULL` 值，并强制唯一性，但不会自动定义表的主标识符。


    ### 35. 主键和候选键有什么区别？

    候选键是能够唯一标识表中每条记录的一列或一组列。主键是从候选键中选出的一个，成为表的主要标识符。


    ## 事务与可靠性


    ### 17. 数据库事务中的 ACID 是什么？

    ACID 代表原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）和持久性（Durability）。这是一组确保数据库事务可靠性和完整性的属性。


    ### 22. 什么是事务？

    事务是一个逻辑工作单元，包含一个或多个数据库操作。它确保事务内的所有操作被视为一个整体，要么全部成功，要么全部失败。


    ### 23. 什么是死锁？

    死锁是指两个或多个事务因各自等待对方持有的资源而无法继续执行的情况。这可能导致永久的等待状态。


    ## SQL 对象与可编程性


    ### 19. 什么是视图？

    视图是从一个或多个表派生出的虚拟表。它不存储数据，但提供了一种以自定义或简化方式呈现数据的方法。


    ### 20. 什么是存储过程？

    存储过程是一组预编译的 SQL 语句，用于执行特定任务。它可以被多次调用，并传入不同的参数执行。


    ### 21. 什么是触发器？

    触发器是一组 SQL 语句，当表上发生特定事件（如 `INSERT`、`UPDATE` 或 `DELETE` 操作）时自动执行。


    ### 25. 函数和存储过程有什么区别？

    函数返回一个值，并可在 SQL 语句中使用；而存储过程不直接返回值，但可以执行各种操作。


    ## 查询与数据操作


    ### 18. `UNION` 和 `UNION ALL` 有什么区别？

    `UNION` 合并两个或多个 `SELECT` 语句的结果集并去除重复行，而 `UNION ALL` 合并结果集但不去除重复行。


    ### 26. `GROUP BY` 和 `HAVING` 子句有什么区别？

    `GROUP BY` 用于根据一个或多个列对行进行分组，而 `HAVING` 用于根据特定条件过滤分组后的行。


    ### 30. 什么是相关子查询？

    相关子查询是引用外部查询列的子查询。它针对外部查询的每一行执行，因此依赖于外部查询的结果。


    ### 32. `UNION` 和 `JOIN` 有什么区别？

    `UNION` 垂直合并两个或多个表的行，而 `JOIN` 基于相关列水平合并两个或多个表的列。


    ### 33. `WHERE` 和 `HAVING` 子句有什么区别？

    `WHERE` 用于在查询中对行进行分组前过滤行，而 `HAVING` 用于在分组后过滤分组后的行。


    ### 38. 什么是递归 SQL 查询？

    递归 SQL 查询是指引用自身输出以执行额外操作的查询。它常用于处理层次结构或树状数据结构。


    ### 39. 相关子查询和嵌套子查询有什么区别？

    相关子查询是引用外部查询列的子查询，而嵌套子查询是独立于外部查询的子查询。


    ### 45. `GROUP BY` 子句的作用是什么？

    `GROUP BY` 子句用于根据一个或多个列对行进行分组。它通常与聚合函数一起使用，对每个分组进行计算。


    ### 46. `HAVING` 子句的作用是什么？

    `HAVING` 子句用于根据特定条件过滤分组后的行。它作用于 `GROUP BY` 子句的结果。


    ### 47. `ORDER BY` 子句的作用是什么？

    `ORDER BY` 子句用于根据一个或多个列按升序或降序对结果集进行排序。


    ### 48. `DISTINCT` 关键字的作用是什么？

    `DISTINCT` 关键字用于从结果集的列中检索唯一值，消除重复行。


    ### 49. `LIKE` 运算符的作用是什么？

    （原文内容缺失）


    ## 连接


    ### 37. 什么是自连接？

    自连接是将表与自身进行连接的操作。当需要比较同一表中的行时使用。


    ### 40. 自然连接和等值连接有什么区别？

    自然连接是自动匹配两个表中同名列的连接操作，而等值连接是使用相等运算符显式指定连接条件的连接操作。


    ### 41. 外连接和内连接有什么区别？

    内连接仅返回两个表中匹配的行，而外连接返回一个表中的所有行以及另一个表中的匹配行。


    ### 42. 左连接和右连接有什么区别？

    左连接返回左表中的所有行以及右表中的匹配行，而右连接返回右表中的所有行以及左表中的匹配行。


    ### 43. 什么是全外连接？

    全外连接返回两个表中的所有行（包括不匹配的行），并根据连接条件将它们组合起来。


    ## 数据类型与架构


    ### 24. `CHAR` 和 `VARCHAR` 数据类型有什么区别？

    `CHAR` 是固定长度的字符数据类型，存储指定数量的字符；而 `VARCHAR` 是可变长度的字符数据类型，存储可变数量的字符。


    ### 27. 数据库和模式有什么区别？

    数据库是相关数据的集合，用于存储和组织。而模式是数据库内的逻辑容器，包含表、视图和过程等对象。


    ### 28. 什么是数据仓库？

    数据仓库是从各种来源收集的大型数据存储库，经过结构化和组织，以支持商业智能和报表。


    ### 29. OLTP 和 OLAP 有什么区别？

    OLTP（在线事务处理）用于日常事务操作，侧重于实时处理。OLAP（在线分析处理）用于复杂的分析查询，侧重于历史数据分析。


    ### 31. 临时表和表变量有什么区别？

    临时表是在会话或特定作用域内创建和使用的物理表，而表变量是具有类似表结构的变量，仅在用户定义函数或存储过程的作用域内存在。


    ### 34. 数据库和数据仓库有什么区别？

    数据库是为事务目的而组织的相关数据集合，而数据仓库是为分析目的而组织的大型数据存储库。


    ### 36. 模式和数据库有什么区别？

    数据库是相关数据的集合，而模式是数据库内的逻辑容器，包含表、视图和过程等对象。


    ## 高级约束


    ### 44. 什么是自引用外键？

    自引用外键是引用同一表主键的外键。它用于在单个表内建立层次关系。


