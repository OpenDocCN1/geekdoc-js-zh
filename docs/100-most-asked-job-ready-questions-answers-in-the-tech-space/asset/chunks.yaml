    # Python 面试题：Python


    ## 装饰器与函数

    ### 什么是 Python 中的装饰器？

    Python 中的装饰器是一种在不直接修改源代码的情况下，修改或增强函数或类行为的方法。装饰器是通过包装目标函数或类的函数来实现的，并为其添加额外的功能。


    ### Python 中 `@property` 装饰器的作用是什么？

    Python 中的 `@property` 装饰器用于将一个方法定义为类属性的 getter（获取器）。它允许像访问普通属性一样访问该属性，而内部则调用 getter
    方法。


    ### Python 中 `@staticmethod` 装饰器的作用是什么？

    Python 中的 `@staticmethod` 装饰器用于在类中定义一个静态方法。静态方法不需要类的实例即可调用，可以直接通过类本身访问。


    ### Python 中 `@classmethod` 装饰器的作用是什么？

    Python 中的 `@classmethod` 装饰器用于定义一个类方法。类方法将类本身作为第一个参数接收，使其能够访问和修改类级属性，并执行特定于类的操作。


    ### 什么是 Python 中的 lambda 函数？

    Python 中的 `lambda` 函数是一个可以在单行内定义的匿名函数。它通常用于简单的、一次性的操作，不需要正式的 `def` 语句。


    ## 模块与包

    ### 什么是 Python 中的模块？

    Python 中的模块是包含 Python 代码和定义的的文件。它们可以被导入并用于其他 Python 程序中，以提供可重用的功能。


    ### 什么是 Python 中的包？

    Python 中的包是一种将相关模块组织到目录层级结构中的方式。它们能够实现更好的代码组织和模块化，使管理大型项目变得更加容易。


    ### 包中 `__init__.py` 文件的作用是什么？

    包中的 `__init__.py` 文件作为一个标识，表明该目录是一个 Python 包。它可以为空，也可以包含在导入包时执行的初始化代码。


    ## 标准库模块

    ### Python 中 `sys` 模块的作用是什么？

    Python 中的 `sys` 模块提供了对系统特定参数和函数的访问。它允许与 Python 解释器进行交互，并提供有关运行时环境的信息。


    ### Python 中 `os` module 的作用是什么？

    Python 中的 `os` 模块提供了一种与操作系统交互的方式。它允许执行与文件和目录操作、进程管理以及环境变量相关的各种操作。


    ### Python 中 `datetime` 模块的作用是什么？

    Python 中的 `datetime` 模块提供了用于操作日期和时间的类。它允许创建、格式化以及对日期和时间执行操作。


    ### Python 中 `random` 模块的作用是什么？

    Python 中的 `random` 模块提供了生成随机数的函数。它允许你生成随机整数、浮点数，并从列表中进行随机选择。


    ### Python 中 `json` 模块的作用是什么？

    Python 中的 `json` 模块提供了处理 JSON（JavaScript 对象表示法）数据的函数。它允许将 Python 对象编码为 JSON 字符串，以及将
    JSON 字符串解码为 Python 对象。


    ### Python 中 `pickle` 模块的作用是什么？

    Python 中的 `pickle` 模块提供了序列化和反序列化 Python 对象的函数。它允许你将 Python 对象转换为可以存储或传输的二进制格式，然后将其还原为对象。


    ## 高级概念

    ### 什么是 Python 中的生成器？

    Python 中的生成器是可以在执行过程中暂停和恢复的函数，允许它们随时间产生一系列值。它们具有内存效率，并提供了一种遍历大型或无限序列的便捷方式。


    ### Python 中 `yield` 关键字的作用是什么？

    Python 中的 `yield` 关键字用于生成器上下文中。它允许生成器函数暂时暂停并将一个值返回给调用者，而不会丢失其内部状态。随后生成器可以恢复执行，从上次停止的地方继续。


    ### Python 中 `zip()` 函数的作用是什么？

    Python 中的 `zip()` 函数用于将多个可迭代对象（如列表或元组）组合成一个由元组组成的单个可迭代对象。它将每个可迭代对象中对应的元素配对，直到最短的可迭代对象耗尽为止。


    # 第二章：100 个最常被问到的 SQL 工作面试题


    ## SQL 基础

    ### 什么是 SQL？

    SQL（结构化查询语言）是一种用于管理关系数据库的编程语言。它允许用户存储、操纵和检索数据库中的数据。


    ### SQL 语句有哪些不同类型？

    SQL 语句可分为三类：

    - 数据定义语言 (DDL)：用于创建、修改和删除数据库对象。

    - 数据操纵语言 (DML)：用于查询、插入、更新和删除数据。

    - 数据控制语言 (DCL)：用于控制对数据库的访问，授予或撤销权限。


    ## 键与约束

    ### 什么是主键？

    主键是唯一标识表中每条记录的一列或一组列。它确保了数据的完整性并允许高效地检索数据。


    ### 什么是外键？

    外键是表中的一列或一组列，它引用另一个表的主键。它在两个表之间建立了关系。


    ### 什么是复合键？

    复合键是由两列或多列组成的主键。这些列共同唯一地标识表中的每条记录。


    ## 数据操纵与查询

    ### `DELETE` 和 `TRUNCATE` 有什么区别？

    `DELETE` 是一种 DML 语句，用于从表中删除特定的行；而 `TRUNCATE` 是一种 DDL 语句，用于删除表中的所有行，实际上是重置该表。


    ### 什么是子查询？

    子查询是嵌套在另一个查询内部的查询。它可以用于根据另一个表的值从一个表中检索数据，或执行复杂的计算。


    ### 子查询和连接（Join）有什么区别？

    子查询是一个嵌套在另一个查询内部的查询，而连接（Join）用于根据相关列将两个或多个表中的行组合在一起。


    ### 什么是自连接（Self-join）？

    自连接是一种表与自身进行连接的连接操作。当你想要比较同一表内的行时，它非常有用。


    ### JOIN 操作有哪些不同类型？

    不同类型的 `JOIN` 操作包括：

    - `INNER JOIN`：仅返回两个表中匹配的行。

    - `LEFT JOIN`：返回左表的所有行以及右表中匹配的行。

    - `RIGHT JOIN`：返回右表的所有行以及左表中匹配的行。

    - `FULL JOIN`：返回两个表中的所有行。


    ## 数据库设计与优化

    ### 什么是 SQL 中的规范化？

    规范化是在数据库中组织数据的过程，旨在消除冗余和依赖问题。它涉及将表拆分为更小、更易管理的实体。


    ### 数据库规范化中有哪些不同的范式？

    不同的范式包括：

    - 第一范式 (1NF)：消除重复行并确保值的原子性。

    - 第二范式 (2NF)：确保每个非键列都依赖于整个主键。

    - 第三范式 (3NF)：确保每个非键列仅依赖于主键，而不依赖于其他非键列。

    - 第四范式 (4NF)：消除多值依赖。

    - 第五范式 (5NF)：消除连接依赖。


    ### 什么是索引？

    索引是一种数据库结构，可提高数据库表上数据检索操作的速度。它允许更快地搜索、排序和过滤数据。


