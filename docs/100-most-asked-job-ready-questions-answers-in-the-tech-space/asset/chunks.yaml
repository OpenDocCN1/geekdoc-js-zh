    56. Can we define a package statement after the import statement in java? Answer:
    We can’t define a package statement after the import statement in java. A package
    statement must be the first statement in the source file. We can have commented
    before the package statement.


    57. Define How many objects are created in the following piece of code?


    ```

    MyClass c1, c2, c3;

    c1 = new MyClass ();

    c3 = new MyClass ();

    ```


    Answer: Only 2 objects are created, c1 and c3. The reference c2 is only declared
    and not initialized.


    58. What is JSP? Answer: JSP is a technology that returns dynamic content to the
    Web client using HTML, XML and JAVAelements. JSP page looks like a HTML page but
    is a servlet. It contains Presentation logic and business logic of a web application.


    59. What is the purpose of apache tomcat? Answer: Apache server is a standalone
    server that is used to test servlets and create JSP pages. It is free and open
    source that is integrated in the Apache web server. It is fast, reliable server
    to configure the applications but it is hard to install. It is a servlet container
    that includes tools to configure and manage the server to run the applications.
    It can also be configured by editing XML configuration files.


    60. Explain where variables are created in memory? Answer: When we declare variables
    are created in the stack. So when the variable is out of scope those variables
    get garbage collected.


    61. Can we use catch statement for checked exceptions? Answer: If there is no
    chance of raising an exception in our code then we can’t declare catch block for
    handling checked exceptions. This raises a compile-time error if we try to handle
    checked exceptions when there is no possibility of causing an exception.


    62. Explain a situation where finally block will not be executed? Answer: Finally,
    the block will not be executed whenever JVM shutdowns. If we use `system.exit(0)`
    in try statement finally block if present will not be executed.


    63. What is UNICODE? Answer: Unicode is used for internal representation of characters
    and strings and it uses 16 bits to represent each other.


    64. Explain about the main() method in java? Answer: The `main()` method is the
    starting point of execution for all java applications. `public static void main(String[]
    args) {}` `String args[]` are an array of string objects we need to pass from
    command line arguments. Every Java application must have at least one main method.


    65. Define How destructors are defined in Java? Answer: In Java, there are no
    destructors defined in the class as there is no need to do so. Java has its own
    garbage collection mechanism which does the job automatically by destroying the
    objects when no longer referenced.


    66. What will be the output of `Round(3.7)` and `Ceil(3.7)`? Answer: `Round(3.7)`
    returns 4 and `Ceil(3.7)` returns 4.


    67. What is constructor in java? Answer: A constructor is a special method used
    to initialize objects in the java. we use constructors to initialize all variables
    in the class when an object is created. As and when an object is created it is
    initialized automatically with the help of constructor in java. We have two types
    of constructors Default Constructor Parameterized Constructor


    68. How can we find the actual size of an object on the heap? Answer: In Java,
    there is no way to find out the actual size of an object on the heap.


    69. Can a variable be local and static at the same time? Answer: No a variable
    can’t be `static` as well as local at the same time. Defining a local variable
    as `static` gives compilation error.


    70. Can we have static methods in an Interface? Answer: `Static` methods can’t
    be overridden in any class while any methods in an `Interface` are by default
    abstract and are supposed to be implemented in the classes being implementing
    the interface. So it makes no sense to have `static` methods in an interface in
    Java.


    71. In how many ways we can do synchronization in java? Answer: There are two
    ways to do synchronization in java: 1) `Synchronized` methods 2) `Synchronized`
    blocks To do synchronization we use the `synchronized` keyword.


    72. When do we use synchronized blocks and advantages of using synchronized blocks?
    Answer: If very few lines of code require synchronization then it is recommended
    to use `synchronized` blocks. The main advantage of `synchronized` blocks over
    `synchronized` methods is it reduces the waiting time of threads and improves
    performance of the system.


    73. What is the difference between access specifiers and access modifiers in java?
    Answer: In C++ we have access specifiers as `public`, `private`, `protected` and
    default and access modifiers as `static`, `final`. But there is no such division
    of access specifiers and access modifiers in java. In Java, we have access to
    modifiers and nonaccess modifiers. Access Modifiers: `public`, `private`, `protected`,
    default Non Access Modifiers: `abstract`, `final`, strip.


    74. Define How objects are stored in Java? Answer: In java, each object when created
    gets a memory space from a heap. When an object is destroyed by a garbage collector,
    the space allocated to it from the heap is re-allocated to the heap and becomes
    available for any new objects.


    75. What access modifiers can be used for class? Answer: We can use only two access
    modifiers for class `public` and default. `public`: A class with a `public` modifier
    can be visible


    1) In the same class 2) In the same package subclass 3) In the same package nonsubclass
    4) In the different package subclass 5) In the different package nonsubclass.


    default: A class with default modifier can be accessed


    1) In the same class 2) In the same package subclass 3) In the same package nonsubclass
    4) In the different package subclass 5) In the different package nonsubclass.
    ( )


    76. Explain about abstract classes in java? Answer: Sometimes we may come across
    a situation where we cannot provide implementation to all the methods in a class.
    We want to leave the implementation to a class that extends it. In such a case,
    we declare a class as `abstract`. To make a class `abstract` we use keyword `abstract`.
    Any class that contains one or more `abstract` methods is declared as `abstract`.
    If we don’t declare a class as `abstract` which contains `abstract` methods we
    get a compile-time error. We get the following error. “The type must be an abstract
    class to define abstract methods.” Signature; abstract class.


    For example, if we take a `vehicle` class we cannot provide implementation to
    it because there may be two-wheelers, four-wheelers, etc. At that moment we make
    `vehicle` class `abstract`. All the common features of vehicles are declared as
    `abstract` methods in `vehicle` class. Any class which extends the `vehicle` will
    provide its method implementation. It’s the responsibility of subclass to provide
    the implementation.


    The important features of `abstract` classes are:


    1) `Abstract` classes cannot be instantiated. 2) An `abstract` class contains
    `abstract` methods, concrete methods or both. 3) Any class which extends `abstract`
    class must override all methods of an `abstract` class. 4) An `abstract` class
    can contain either 0 or more `abstract` methods.


    Though we cannot instantiate `abstract` classes we can create object references.
    Through superclass references, we can point to subclass.


    77. Can we create a constructor in abstract class? Answer: We can create a constructor
    in the abstract class, it doesn’t give any compilation error. But when we cannot
    instantiate class there is no use in creating a constructor for abstract class.


    78. String and StringBuffer both represent String objects. Can we compare String
    and StringBuffer in Java? Answer: Although `String` and `StringBuffer` both represent
    String objects, we can’t compare them with each other and if we try to compare
    them, we get an error.


    79. In how many ways we can create threads in java? Answer: We can create threads
    in java by any of the two ways : 1) By extending `Thread` class 2) By implementing
    the `Runnable` interface.

