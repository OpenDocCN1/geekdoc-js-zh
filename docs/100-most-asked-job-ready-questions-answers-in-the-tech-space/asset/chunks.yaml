    ## SQL 面试问题


    `SELECT` 语句中的 `LIMIT` 子句用于限制查询返回的行数。它允许你指定要检索的最大行数。


    ### 87. `SELECT` 语句中 `OFFSET` 子句的作用是什么？

    `SELECT` 语句中的 `OFFSET` 子句与 `LIMIT` 子句配合使用，用于在开始返回结果集之前跳过指定数量的行。


    ### 88. `SELECT` 语句中 `JOIN` 关键字的作用是什么？

    `SELECT` 语句中的 `JOIN` 关键字用于基于相关列组合两个或多个表中的行。它允许你在单个查询中从多个表中检索数据。


    ### 89. `INNER JOIN` 的作用是什么？

    `INNER JOIN` 是一种连接操作，仅根据指定的连接条件返回两个表中匹配的行。它组合了连接列中具有匹配值的行。


    ### 90. `LEFT JOIN` 的作用是什么？

    `LEFT JOIN` 是一种连接操作，根据指定的连接条件返回左表中的所有行以及右表中匹配的行。如果未找到匹配项，则右表的列返回 `null` 值。


    ### 91. `RIGHT JOIN` 的作用是什么？

    `RIGHT JOIN` 是一种连接操作，根据指定的连接条件返回右表中的所有行以及左表中匹配的行。如果未找到匹配项，则左表的列返回 `null` 值。


    ### 92. `FULL OUTER JOIN` 的作用是什么？

    `FULL OUTER JOIN` 是一种连接操作，返回两个表中的所有行（包括不匹配的行），并根据连接条件进行组合。如果未找到匹配项，则相应列返回 `null`
    值。


    ### 93. `UNION` 运算符的作用是什么？

    `UNION` 运算符用于将两个或多个 `SELECT` 语句的结果集合并为一个结果集。它会从最终结果集中删除重复的行。


    ### 94. `UNION ALL` 运算符的作用是什么？

    `UNION ALL` 运算符用于将两个或多个 `SELECT` 语句的结果集合并为一个结果集，包括重复的行。


    ### 95. `WHERE` 子句中 `LIKE` 运算符的作用是什么？

    `LIKE` 运算符用于 `WHERE` 子句中，以搜索列中的指定模式。它允许使用通配符，例如 `%`（匹配任意字符序列）和 `_`（匹配任意单个字符）。


    ### 96. `WHERE` 子句中 `IN` 运算符的作用是什么？

    `IN` 运算符用于 `WHERE` 子句中，以检查某个值是否与列表或子查询中的任何值匹配。


    ### 97. `WHERE` 子句中 `EXISTS` 运算符的作用是什么？

    `EXISTS` 运算符用于 `WHERE` 子句中，以检查子查询是否返回任何行。如果子查询结果集不为空，则返回 `true`。


    ### 98. `SELECT` 语句中 `GROUP BY` 子句的作用是什么？

    `SELECT` 语句中的 `GROUP BY` 子句用于根据一个或多个列对行进行分组。它通常与聚合函数一起使用，对每个组执行计算。


    ### 99. `SELECT` 语句中 `ORDER BY` 子句的作用是什么？

    `SELECT` 语句中的 `ORDER BY` 子句用于根据一个或多个列按升序或降序对结果集进行排序。


    ### 100. `SELECT` 语句中 `DISTINCT` 关键字的作用是什么？

    `SELECT` 语句中的 `DISTINCT` 关键字用于从结果集的列中检索唯一值，消除重复的行。


    ## 第 3 章：100 个最常问的 JavaScript 工作面试问题


    ### 1. 什么是 JavaScript？

    JavaScript 是一种高级、解释型编程语言，主要用于为网页添加交互性。


    ### 2. JavaScript 中有哪些数据类型？

    JavaScript 有六种原始数据类型：`string`、`number`、`boolean`、`null`、`undefined` 和 `symbol`，以及一种复杂数据类型
    `object`。


    ### 3. `null` 和 `undefined` 有什么区别？

    `null` 表示有意缺失任何对象值，而 `undefined` 表示值缺失或变量未初始化。


    ### 4. JavaScript 中的 DOM 是什么？

    文档对象模型（DOM）是一种编程接口，表示 HTML 和 XML 文档的结构。它允许 JavaScript 访问和操作网页的内容和结构。


    ### 5. JavaScript 中的事件是什么？

    事件是浏览器中发生的动作或事件，例如按钮点击或页面加载。JavaScript 可以通过执行代码来响应这些事件。


    ### 6. JavaScript 中的匿名函数是什么？

    匿名函数是没有名称的函数。它可以赋值给变量或作为参数传递给另一个函数。它们通常用于一次性函数或回调函数。


    ### 7. JavaScript 中的闭包是什么？

    闭包是可以访问外部函数变量的函数，即使外部函数已经执行完毕。它们封装数据，并提供在函数调用之间维护状态的方法。


    ### 8. JavaScript 中 `==` 和 `===` 有什么区别？

    `==` 运算符在执行类型转换后检查相等性，而 `===` 运算符在不进行类型转换的情况下检查相等性，确保值和类型都匹配。


    ### 9. JavaScript 中的提升是什么？

    提升是 JavaScript 的一种行为，在编译阶段，变量和函数声明会被移动到其包含作用域的顶部，从而允许在声明之前使用它们。


    ### 10. JavaScript 中的 `this` 关键字是什么？

    `this` 关键字引用当前正在执行代码的对象。它的值由函数的调用方式决定，并提供了一种在函数内访问对象属性和方法的方式。


    ### 11. 在 JavaScript 中定义函数有哪些不同方式？

    JavaScript 中的函数可以通过函数声明、函数表达式、箭头函数以及对象中的方法来定义。


    ### 12. JavaScript 中 `let` 关键字的作用是什么？

    `let` 关键字用于在 JavaScript 中声明块级作用域的变量。使用 `let` 声明的变量仅在其定义的块内可访问。


    ### 13. JavaScript 中 `const` 关键字的作用是什么？

    `const` 关键字用于在 JavaScript 中声明块级作用域的变量，这些变量不能被重新赋值。但它不会使对象或数组变为不可变。


    ### 14. JavaScript 中的模板字面量是什么？

    模板字面量（用反引号 `` ` `` 表示）是一种在 JavaScript 中创建字符串的方式，支持变量插值和多行字符串。


    ### 15. JavaScript 中的 Promise 是什么？

    Promise 用于 JavaScript 中的异步编程。它们表示异步操作的最终完成（或失败），并允许使用 `.then()` 和 `.catch()` 进行链式操作。


    ### 16. JavaScript 中的 `async/await` 语法是什么？

    `async/await` 语法是一种处理异步操作的现代方法。它允许以更类似同步的方式编写异步代码，使其更易于阅读和维护。


    ### 17. JavaScript 中的箭头函数是什么？

    箭头函数是 JavaScript 中定义函数的一种简洁语法。与传统函数表达式相比，它们具有更短的语法，并继承封闭作用域的 `this` 值。


    ### 18. JavaScript 中的事件委托是什么？

    事件委托是一种技术，将事件监听器附加到父元素而不是单个子元素。它允许高效地处理事件，特别是对于动态添加的元素。


    ### 19. JavaScript 中 `map()` 函数的作用是什么？

    `map()` 函数用于通过对现有数组的每个元素应用给定函数来创建一个新数组。它允许轻松地转换和操作数组元素。


