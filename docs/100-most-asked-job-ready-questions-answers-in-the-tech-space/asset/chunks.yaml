    # JavaScript 日期与实用方法


    ### 85. JavaScript Date 对象中 `setMonth()` 方法的作用是什么？

    `setMonth()` 方法用于设置 JavaScript `Date` 对象的月份值。它允许修改日期的月份组件。


    ### 86. JavaScript Date 对象中 `setDate()` 方法的作用是什么？

    `setDate()` 方法用于设置 JavaScript `Date` 对象的日期（一个月中的第几天）值。它允许修改日期的天数组件。


    ### 87. JavaScript Date 对象中 `setHours()` 方法的作用是什么？

    `setHours()` 方法用于设置 JavaScript `Date` 对象的小时值。它允许修改日期的小时组件。


    ### 88. JavaScript Date 对象中 `setMinutes()` 方法的作用是什么？

    `setMinutes()` 方法用于设置 JavaScript `Date` 对象的分钟值。它允许修改日期的分钟组件。


    ### 89. JavaScript Date 对象中 `setSeconds()` 方法的作用是什么？

    `setSeconds()` 方法用于设置 JavaScript `Date` 对象的秒值。它允许修改日期的秒组件。


    ### 90. JavaScript Date 对象中 `toLocaleString()` 方法的作用是什么？

    `toLocaleString()` 方法用于将 JavaScript `Date` 对象转换为基于当前区域设置的本地化字符串表示形式。它会考虑用户的时区和区域设置来格式化日期和时间。


    ### 91. JavaScript Date 对象中 `toDateString()` 方法的作用是什么？

    `toDateString()` 方法用于将 JavaScript `Date` 对象的日期部分转换为人类可读的字符串表示形式。它以 ''Day Mon DD
    YYYY'' 的格式返回日期，例如 ''Thu Jun 24 2023''。


    ### 92. JavaScript Date 对象中 `getTime()` 方法的作用是什么？

    `getTime()` 方法用于获取 JavaScript `Date` 对象的时间戳值。它返回自 1970 年 1 月 1 日 00:00:00 UTC
    以来经过的毫秒数。


    ### 93. JavaScript Date 对象中 `setTime()` 方法的作用是什么？

    `setTime()` 方法用于设置 JavaScript `Date` 对象的时间戳值。它允许通过提供一个新的时间戳来修改日期和时间。


    ### 94. JavaScript 中 `setTimeout()` 函数的作用是什么？

    `setTimeout()` 函数用于在指定的毫秒延迟后执行一个特定的函数或一段代码。它通常用于延迟代码执行或创建超时机制。


    ### 95. JavaScript 中 `setInterval()` 函数的作用是什么？

    `setInterval()` 函数用于每隔指定的毫秒固定时间间隔重复执行一个特定的函数或一段代码。它通常用于创建间隔定时器。


    ### 96. JavaScript 中 `clearTimeout()` 函数的作用是什么？

    `clearTimeout()` 函数用于取消由 `setTimeout()` 函数设置的超时。它在函数被触发之前清除其计划执行的任务。


    ### 97. JavaScript 中 `clearInterval()` 函数的作用是什么？

    `clearInterval()` 函数用于取消由 `setInterval()` 函数设置的间隔。它停止函数在固定时间间隔内的重复执行。


    ### 98. JavaScript 中 `isNaN()` 函数的作用是什么？

    `isNaN()` 函数用于检查一个值是否为 `NaN`（Not-a-Number，非数字）。如果该值为 `NaN`，则返回 `true`，否则返回 `false`。


    ### 99. JavaScript 中 `isFinite()` 函数的作用是什么？

    `isFinite()` 函数用于检查一个值是否为有限数字。如果该值为有限数字，则返回 `true`，否则返回 `false`。对于 `NaN`、`Infinity`
    和 `-Infinity`，它也会返回 `false`。


    ### 100. JavaScript 中 `parseFloat()` 函数的作用是什么？

    `parseFloat()` 函数用于解析字符串并从中提取浮点数。它将字符串中代表有效浮点数的起始部分转换为数值。


    ## 第 4 章：100 个最常问的 JavaScript 工作面试题


    1. **Java 中的类（class）是什么？**

    回答：Java 将代码封装在各种类中，这些类定义了新的数据类型。这些新数据类型用于创建对象。


    2. **什么是 JVM？**

    回答：`JVM` 是 Java 虚拟机，它是编译后的 Java 类文件的运行环境。


    3. **在 Java 中，表示价格的正确数据类型是什么？**

    回答：如果内存不是问题且性能要求不高，则使用 `BigDecimal`；否则使用具有预定义精度的 `double`。


    4. **Java 支持多继承吗？**

    回答：Java 不支持多继承。


    5. **Java 编程语言支持哪些平台？**

    回答：Java 运行在多种平台上，例如 Windows、Mac OS 以及各种版本的 UNIX/Linux（如 HP-Unix、Sun Solaris、Red
    hat Linux、Ubuntu、Cent OS 等）。


    6. **列举 Java 的任意五个特性？**

    回答：部分特性包括：面向对象、平台无关性、健壮性、解释执行、多线程。


    7. **解释方法重载（method overloading）？**

    回答：当一个 Java 程序包含多个同名但属性（参数）不同的方法时，这就称为方法重载。


    8. **在源代码文件中，对 package 语句的位置有什么限制？**

    回答：package 语句必须出现在源代码文件的第一行（排除空行和注释）。


    9. **使用什么方法来指定容器的布局？**

    回答：`setLayout()` 方法用于指定容器的布局。


    10. **`Applet` 类的直接超类是什么？**

    回答：`Panel` 类是 `Applet` 类的直接超类。


    11. **Java 中的访问修饰符有哪些？**

    回答：共有 3 个访问修饰符：`public`、`protected` 和 `private`。如果没有指定标识符，默认的称为 friendly（友好），但程序员不能显式指定
    friendly 标识符。


    12. **什么是包（packages）？**

    回答：包是相关类和接口的集合，提供访问保护和命名空间管理。


    13. **继承（Inheritance）是指什么？它的优点是什么？**

    回答：继承是从一个类继承所有特性的过程。继承的优点是代码的可重用性，以及子类可以访问超类的变量和方法。


    14. **我们可以在 catch 处理程序中重新抛出同一个异常吗？**

    回答：是的，我们可以在 catch 处理程序中重新抛出同一个异常。如果我们想从 catch 块中重新抛出受检异常（checked exception），我们需要声明该异常。


    15. **`String` 类型的变量自动初始化为什么值？**

    回答：`String` 类型的默认值是 `null`。


    16. **当线程在 I/O 上阻塞时，它进入什么状态？**

    回答：当它在 I/O 上阻塞时，线程进入等待状态（waiting state）。


    17. **哪些容器使用 Flow Layout 作为其默认布局？**

    回答：`Panel` 和 `Applet` 类使用 Flow Layout 作为其默认布局。


    18. **解释 Java 常量的编码标准？**

    回答：Java 中的常量使用 `static` 和 `final` 关键字创建。

    1) 常量仅包含大写字母。

    2) 如果常量名由两个单词组合而成，应由下划线分隔。

    3) 常量名通常是名词。例如：`MAX_VALUE`、`MIN_VALUE`、`MAX_PRIORITY`、`MIN_PRIORITY`


    19. **什么是同步（synchronization），为什么它很重要？**

    回答：同步是指控制多个线程访问共享资源的能力。它很重要，因为如果没有同步，一个线程在修改共享对象时，另一个线程可能正在使用或更新该对象的值，这通常会导致严重错误。


    20. **解释 Java 变量的编码标准？**

