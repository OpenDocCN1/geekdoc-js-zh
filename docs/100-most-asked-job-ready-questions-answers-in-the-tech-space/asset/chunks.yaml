    # SQL Operators and Functions Reference


    The `LIKE` operator is used in a `WHERE` clause to search for a specified pattern
    in a column. It allows wildcard characters like `%` (matches any sequence of characters)
    and `_` (matches any single character).


    ## SQL Operators


    ### 50. What is the purpose of the `IN` operator?

    The `IN` operator is used in a `WHERE` clause to check if a value matches any
    value in a list or a subquery.


    ### 51. What is the purpose of the `BETWEEN` operator?

    The `BETWEEN` operator` is used in a `WHERE` clause to check if a value lies within
    a specified range of values, inclusive of the endpoints.


    ### 52. What is the purpose of the `EXISTS` operator?

    The `EXISTS` operator is used in a `WHERE` clause to check if a subquery returns
    any rows. It returns true if the subquery result set is not empty.


    ## Aggregate Functions


    ### 53. What is the purpose of the `COUNT()` function?

    The `COUNT()` function is used to count the number of rows or non-null values
    in a column.


    ### 54. What is the purpose of the `SUM()` function?

    The `SUM()` function is used to calculate the sum of values in a column.


    ### 55. What is the purpose of the `AVG()` function?

    The `AVG()` function is used to calculate the average value of a column.


    ### 56. What is the purpose of the `MAX()` function?

    The `MAX()` function is used to retrieve the maximum value from a column.


    ### 57. What is the purpose of the `MIN()` function?

    The `MIN()` function is used to retrieve the minimum value from a column.


    ### 58. What is the purpose of the `GROUP_CONCAT()` function?

    The `GROUP_CONCAT()` function is used to concatenate values from multiple rows
    into a single string, grouped by a specific column.


    ## Table Operations and Relationships


    ### 59. What is the purpose of the `JOIN` keyword?

    The `JOIN` keyword is used to combine rows from two or more tables based on related
    columns.


    ### 60. What is a self-referencing table?

    A self-referencing table is a table that has a foreign key column referencing
    its own primary key. It is used to represent hierarchical relationships within
    a single table.


    ### 61. What is the difference between `UNION` and `UNION ALL`?

    `UNION` combines the result sets of two or more `SELECT` statements and removes
    duplicate rows, whereas `UNION ALL` combines the result sets without removing
    duplicates.


    ## Window Functions


    ### 62. What is the purpose of the `ROW_NUMBER()` function?

    The `ROW_NUMBER()` function assigns a unique sequential number to each row within
    a result set. It is often used for pagination or ranking purposes.


    ### 63. What is the purpose of the `RANK()` function?

    The `RANK()` function assigns a rank to each row within a result set based on
    a specified criteria, such as ordering by a column. It allows you to identify
    the ranking of each row.


    ### 64. What is the purpose of the `DENSE_RANK()` function?

    The `DENSE_RANK()` function is similar to the `RANK()` function but assigns consecutive
    ranks to rows without gaps. If two rows have the same rank, the next rank is skipped.


    ### 65. What is the purpose of the `LAG()` function?

    The `LAG()` function is used to access the value of a previous row within a result
    set based on a specified column. It allows you to compare values across adjacent
    rows.


    ### 66. What is the purpose of the `LEAD()` function?

    The `LEAD()` function is used to access the value of a subsequent row within a
    result set based on a specified column. It allows you to compare values across
    adjacent rows.


    ## Advanced SQL Logic and Statements


    ### 67. What is the purpose of the `COALESCE()` function?

    The `COALESCE()` function is used to return the first non-null value from a list
    of expressions. It is often used to provide a default value when a column value
    is null.


    ### 68. What is the purpose of the `CASE` statement?

    The `CASE` statement is used to perform conditional logic within a SQL statement.
    It allows you to evaluate multiple conditions and return different values based
    on the result.


    ### 69. What is the purpose of the `TRUNCATE TABLE` statement?

    The `TRUNCATE TABLE` statement is used to remove all rows from a table, while
    keeping the table structure intact. It is faster than deleting all rows using
    the `DELETE` statement.


    ## Constraints and Indexing


    ### 70. What is the purpose of the `CONSTRAINT` keyword?

    The `CONSTRAINT` keyword is used to define rules and relationships on columns
    within a table. It ensures data integrity and enforces business rules.


    ### 71. What is the purpose of the `PRIMARY KEY` constraint?

    The `PRIMARY KEY` constraint is used to uniquely identify each record in a table.
    It ensures that the primary key column(s) have unique values and cannot contain
    null values.


    ### 72. What is the purpose of the `FOREIGN KEY` constraint?

    The `FOREIGN KEY` constraint is used to establish a relationship between two tables
    based on a common column. It ensures referential integrity by enforcing that values
    in the foreign key column exist in the referenced table''s primary key.


    ### 73. What is the purpose of the `INDEX` keyword?

    The `INDEX` keyword is used to create an index on one or more columns of a table.
    It improves query performance by allowing faster data retrieval based on the indexed
    columns.


    ### 74. What is the purpose of the `CASCADE` keyword in a `FOREIGN KEY` constraint?

    The `CASCADE` keyword is used to specify that changes made to the primary key
    values in the referenced table should be propagated to the foreign key values
    in the referring table. This ensures that the relationship remains valid.


    ## Data Manipulation and Transactions


    ### 75. What is the purpose of the `UPDATE` statement?

    The `UPDATE` statement is used to modify existing records in a table. It allows
    you to change the values of one or more columns based on specified conditions.


    ### 76. What is the purpose of the `DELETE` statement?

    The `DELETE` statement is used to remove one or more records from a table. It
    allows you to delete rows based on specified conditions.


    ### 77. What is the purpose of the `COMMIT` statement?

    The `COMMIT` statement is used to permanently save all changes made within a transaction
    to the database. Once committed, the changes are visible to other users.


    ### 78. What is the purpose of the `ROLLBACK` statement?

    The `ROLLBACK` statement is used to undo all changes made within a transaction
    and restore the database to its previous state. It is typically used when an error
    occurs or when the transaction needs to be canceled.


    ### 79. What is the purpose of the `SAVEPOINT` statement?

    The `SAVEPOINT` statement is used to define a specific point within a transaction
    to which you can roll back. It allows you to undo changes up to a specific savepoint
    without rolling back the entire transaction.


    ### 80. What is the purpose of the `CONSTRAINT` keyword in the `ALTER TABLE` statement?

    The `CONSTRAINT` keyword in the `ALTER TABLE` statement is used to add, modify,
    or drop constraints on columns within an existing table.


    ## Query Clauses


    ### 81. What is the purpose of the `DISTINCT` keyword in the `SELECT` statement?

    The `DISTINCT` keyword in the `SELECT` statement is used to retrieve unique values
    from a column in the result set, eliminating duplicate rows.


    ### 82. What is the purpose of the `AS` keyword in the `SELECT` statement?

    The `AS` keyword in the `SELECT` statement is used to assign an alias to a column
    or a table. It allows you to refer to the column or table by the assigned alias
    in subsequent parts of the query.


    ### 83. What is the purpose of the `ORDER BY` clause in the `SELECT` statement?

    The `ORDER BY` clause in the `SELECT` statement is used to sort the result set
    based on one or more columns in ascending or descending order.


    ### 84. What is the purpose of the `GROUP BY` clause in the `SELECT` statement?

    The `GROUP BY` clause in the `SELECT` statement is used to group rows based on
    one or more columns. It is typically used with aggregate functions to perform
    calculations on each group.


    ### 85. What is the purpose of the `HAVING` clause in the `SELECT` statement?

    The `HAVING` clause in the `SELECT` statement is used to filter grouped rows based
    on specific conditions. It operates on the results of the `GROUP BY` clause.


    ### 86. What is the purpose of the `LIMIT` clause in the `SELECT` statement?

