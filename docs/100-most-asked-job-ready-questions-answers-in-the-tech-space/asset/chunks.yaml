    ## SQL Interview Questions


    The `LIMIT` clause in the `SELECT` statement is used to restrict the number of
    rows returned by a query. It allows you to specify the maximum number of rows
    to be retrieved.


    ### 87. What is the purpose of the OFFSET clause in the SELECT statement?

    The `OFFSET` clause in the `SELECT` statement is used in conjunction with the
    `LIMIT` clause to skip a specified number of rows before starting to return the
    result set.


    ### 88. What is the purpose of the JOIN keyword in the SELECT statement?

    The `JOIN` keyword in the `SELECT` statement is used to combine rows from two
    or more tables based on related columns. It allows you to retrieve data from multiple
    tables in a single query.


    ### 89. What is the purpose of the INNER JOIN?

    The `INNER JOIN` is a join operation that returns only the matching rows from
    both tables based on the specified join condition. It combines rows that have
    matching values in the joined columns.


    ### 90. What is the purpose of the LEFT JOIN?

    The `LEFT JOIN` is a join operation that returns all rows from the left table
    and the matching rows from the right table based on the specified join condition.
    If no match is found, `null` values are returned for the right table columns.


    ### 91. What is the purpose of the RIGHT JOIN?

    The `RIGHT JOIN` is a join operation that returns all rows from the right table
    and the matching rows from the left table based on the specified join condition.
    If no match is found, `null` values are returned for the left table columns.


    ### 92. What is the purpose of the FULL OUTER JOIN?

    The `FULL OUTER JOIN` is a join operation that returns all rows from both tables,
    including unmatched rows, and combines them based on the join condition. If no
    match is found, `null` values are returned for the respective columns.


    ### 93. What is the purpose of the UNION operator?

    The `UNION` operator is used to combine the result sets of two or more `SELECT`
    statements into a single result set. It removes duplicate rows from the final
    result set.


    ### 94. What is the purpose of the UNION ALL operator?

    The `UNION ALL` operator is used to combine the result sets of two or more `SELECT`
    statements into a single result set, including duplicate rows.


    ### 95. What is the purpose of the LIKE operator in the WHERE clause?

    The `LIKE` operator is used in the `WHERE` clause to search for a specified pattern
    in a column. It allows wildcard characters like `%` (matches any sequence of characters)
    and `_` (matches any single character).


    ### 96. What is the purpose of the IN operator in the WHERE clause?

    The `IN` operator is used in the `WHERE` clause to check if a value matches any
    value in a list or a subquery.


    ### 97. What is the purpose of the EXISTS operator in the WHERE clause?

    The `EXISTS` operator is used in the `WHERE` clause to check if a subquery returns
    any rows. It returns `true` if the subquery result set is not empty.


    ### 98. What is the purpose of the GROUP BY clause in the SELECT statement?

    The `GROUP BY` clause in the `SELECT` statement is used to group rows based on
    one or more columns. It is typically used with aggregate functions to perform
    calculations on each group.


    ### 99. What is the purpose of the ORDER BY clause in the SELECT statement?

    The `ORDER BY` clause in the `SELECT` statement is used to sort the result set
    based on one or more columns in ascending or descending order.


    ### 100. What is the purpose of the DISTINCT keyword in the SELECT statement?

    The `DISTINCT` keyword in the `SELECT` statement is used to retrieve unique values
    from a column in the result set, eliminating duplicate rows.


    ## CHAPTER 3: 100 MOST ASKED JAVASCRIPT JOB INTERVIEW QUESTIONS


    ### 1. What is JavaScript?

    JavaScript is a high-level, interpreted programming language primarily used for
    adding interactivity to web pages.


    ### 2. What are the data types in JavaScript?

    JavaScript has six primitive data types: `string`, `number`, `boolean`, `null`,
    `undefined`, and `symbol`, along with a complex data type called `object`.


    ### 3. What is the difference between null and undefined?

    `null` represents the intentional absence of any object value, while `undefined`
    indicates the absence of a value or an uninitialized variable.


    ### 4. What is the DOM in JavaScript?

    The Document Object Model (DOM) is a programming interface that represents the
    structure of HTML and XML documents. It allows JavaScript to access and manipulate
    the content and structure of a webpage.


    ### 5. What is an event in JavaScript?

    An event is an action or occurrence that happens in the browser, such as a button
    click or page load. JavaScript can respond to these events by executing code in
    response.


    ### 6. What is an anonymous function in JavaScript?

    An anonymous function is a function without a name. It can be assigned to a variable
    or passed as an argument to another function. They are often used for one-time
    or callback functions.


    ### 7. What are closures in JavaScript?

    Closures are functions that have access to variables from an outer function, even
    after the outer function has finished executing. They encapsulate data and provide
    a way to maintain state between function calls.


    ### 8. What is the difference between == and === in JavaScript?

    The `==` operator checks for equality after performing type coercion, while the
    `===` operator checks for equality without type coercion, ensuring both the value
    and type match.


    ### 9. What is hoisting in JavaScript?

    Hoisting is a JavaScript behavior where variable and function declarations are
    moved to the top of their containing scope during the compilation phase, allowing
    them to be used before they are declared.


    ### 10. What is the this keyword in JavaScript?

    The `this` keyword refers to the object that is currently executing the code.
    Its value is determined by how a function is called, and it provides a way to
    access object properties and methods within a function.


    ### 11. What are the different ways to define a function in JavaScript?

    Functions in JavaScript can be defined using function declarations, function expressions,
    arrow functions, and methods within objects.


    ### 12. What is the purpose of the let keyword in JavaScript?

    The `let` keyword is used to declare block-scoped variables in JavaScript. Variables
    declared with `let` are only accessible within the block where they are defined.


    ### 13. What is the purpose of the const keyword in JavaScript?

    The `const` keyword is used to declare block-scoped variables in JavaScript that
    cannot be re-assigned. However, it does not make objects or arrays immutable.


    ### 14. What are template literals in JavaScript?

    Template literals, denoted by backticks (`` ` ``), are a way to create strings
    in JavaScript that support interpolation of variables and multi-line strings.


    ### 15. What are JavaScript promises?

    Promises are used for asynchronous programming in JavaScript. They represent the
    eventual completion (or failure) of an asynchronous operation and allow chaining
    of operations using `.then()` and `.catch()`.


    ### 16. What is the async/await syntax in JavaScript?

    The `async/await` syntax is a modern approach to handle asynchronous operations.
    It allows writing asynchronous code in a more synchronous-like manner, making
    it easier to read and maintain.


    ### 17. What are arrow functions in JavaScript?

    Arrow functions are a concise syntax for defining functions in JavaScript. They
    have a shorter syntax compared to traditional function expressions and inherit
    the `this` value from the enclosing scope.


    ### 18. What is event delegation in JavaScript?

    Event delegation is a technique where you attach an event listener to a parent
    element instead of individual child elements. It allows handling events efficiently,
    especially for dynamically added elements.


    ### 19. What is the purpose of the map() function in JavaScript?

    The `map()` function is used to create a new array by applying a given function
    to each element of an existing array. It allows transforming and manipulating
    array elements easily.


    ### 20. What is the purpose of the filter() function in JavaScript?

