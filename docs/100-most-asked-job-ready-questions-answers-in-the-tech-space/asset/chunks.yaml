  trans: "\n\n# JavaScript 面试题\n\n## 事件处理\n### 什么是 JavaScript 中的事件委托？\n事件委托是一种将事件监听器附加到父元素而非各个子元素的技术。它能高效地处理事件，尤其适用于动态添加的元素。\n\
    \n## 字符串方法\n### 53. JavaScript 中 `startsWith()` 方法的作用是什么？\n`startsWith()` 方法用于检查字符串是否以指定的子字符串开头。如果字符串以该子字符串开头，则返回\
    \ `true`，否则返回 `false`。\n\n### 54. JavaScript 中 `endsWith()` 方法的作用是什么？\n`endsWith()`\
    \ 方法用于检查字符串是否以指定的子字符串结尾。如果字符串以该子字符串结尾，则返回 `true`，否则返回 `false`。\n\n### 55. JavaScript\
    \ 中 `includes()` 方法的作用是什么？\n`includes()` 方法用于检查字符串是否包含指定的子字符串。如果找到该子字符串，则返回 `true`，否则返回\
    \ `false`。\n\n### 56. JavaScript 中 `padStart()` 方法的作用是什么？\n`padStart()` 方法用于在字符串的开头填充指定字符，直到达到所需长度。它常用于格式化目的。\n\
    \n### 57. JavaScript 中 `padEnd()` 方法的作用是什么？\n`padEnd()` 方法用于在字符串的末尾填充指定字符，直到达到所需长度。它常用于格式化目的。\n\
    \n### 58. JavaScript 中 `charAt()` 方法的作用是什么？\n`charAt()` 方法用于获取字符串中指定索引处的字符。它返回指定索引处的字符，如果索引超出范围则返回空字符串。\n\
    \n### 59. JavaScript 中 `charCodeAt()` 方法的作用是什么？\n`charCodeAt()` 方法用于获取字符串中指定索引处字符的\
    \ Unicode 值。它返回该字符的 Unicode 值，如果索引超出范围则返回 `NaN`。\n\n### 60. JavaScript 中 `String.fromCharCode()`\
    \ 方法的作用是什么？\n`String.fromCharCode()` 方法用于根据一系列 Unicode 值创建字符串。它允许将 Unicode 值转换为对应的字符。\n\
    \n## JSON 与 URI 处理\n### 61. JavaScript 中 `JSON.stringify()` 方法的作用是什么？\n`JSON.stringify()`\
    \ 方法用于将 JavaScript 对象或值转换为 JSON 字符串。它常用于数据序列化以及与 Web 服务器的通信。\n\n### 62. JavaScript\
    \ 中 `JSON.parse()` 方法的作用是什么？\n`JSON.parse()` 方法用于解析 JSON 字符串并将其转换为 JavaScript\
    \ 对象或值。它常用于反序列化从服务器接收的 JSON 数据。\n\n### 63. JavaScript 中 `encodeURIComponent()`\
    \ 函数的作用是什么？\n`encodeURIComponent()` 函数用于对 URL 组件中的特殊字符进行编码。它确保该组件可以包含在 URL 中而不会导致解析错误。\n\
    \n### 64. JavaScript 中 `decodeURIComponent()` 函数的作用是什么？\n`decodeURIComponent()`\
    \ 函数用于解码 URL 编码的组件。它将 URL 编码的字符转换回原始形式。\n\n## 数学函数\n### 65. JavaScript 中 `Math.random()`\
    \ 函数的作用是什么？\n`Math.random()` 函数用于生成一个介于 0（包含）和 1（不包含）之间的随机浮点数。它常用于在 JavaScript\
    \ 程序中引入随机性。\n\n### 66. JavaScript 中 `Math.floor()` 函数的作用是什么？\n`Math.floor()` 函数用于向下取整到最接近的整数。它去除数字的小数部分，并返回小于或等于给定数字的最大整数。\n\
    \n### 67. JavaScript 中 `Math.ceil()` 函数的作用是什么？\n`Math.ceil()` 函数用于向上取整到最接近的整数。它将数字增加到下一个更高的整数，无论小数部分如何。\n\
    \n### 68. JavaScript 中 `Math.round()` 函数的作用是什么？\n`Math.round()` 函数用于将数字四舍五入到最接近的整数。它根据小数部分向上或向下取整。\n\
    \n### 69. JavaScript 中 `Math.max()` 函数的作用是什么？\n`Math.max()` 函数用于在一组参数中找出最大的数字。它返回作为参数传递的最高值。\n\
    \n### 70. JavaScript 中 `Math.min()` 函数的作用是什么？\n`Math.min()` 函数用于在一组参数中找出最小的数字。它返回作为参数传递的最低值。\n\
    \n### 71. JavaScript 中 `Math.pow()` 函数的作用是什么？\n`Math.pow()` 函数用于计算一个数的幂。它接受底数和指数作为参数，并返回底数的指数次幂的结果。\n\
    \n### 72. JavaScript 中 `Math.sqrt()` 函数的作用是什么？\n`Math.sqrt()` 函数用于计算一个数的平方根。它返回给定数的正平方根。\n\
    \n### 73. JavaScript 中 `Math.abs()` 函数的作用是什么？\n`Math.abs()` 函数用于计算一个数的绝对值。它返回该数的大小，不考虑其符号。\n\
    \n### 74. JavaScript 中 `Math.floor()` 和 `Math.random()` 函数一起使用的作用是什么？\n通过结合 `Math.floor()`\
    \ 和 `Math.random()` 函数，可以在指定范围内生成随机整数。例如，`Math.floor(Math.random() * 10)` 生成一个介于\
    \ 0 和 9 之间的随机整数。\n\n## 日期对象\n### 75. JavaScript 中 `Date()` 构造函数的作用是什么？\n`Date()`\
    \ 构造函数用于创建一个新的 JavaScript `Date` 对象，该对象表示特定的日期和时间。它允许处理日期并对其执行各种操作。\n\n### 76.\
    \ JavaScript Date 对象中 `getFullYear()` 方法的作用是什么？\n`getFullYear()` 方法用于获取 JavaScript\
