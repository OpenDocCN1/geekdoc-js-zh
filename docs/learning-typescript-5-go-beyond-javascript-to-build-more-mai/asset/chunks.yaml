    node -v and press Enter. This command displays the version of Node.js installed. Type
    npm -v and press Enter. This command displays the version of npm installed. Next,
    we will install TypeScript using npm: ●    In Command Prompt, type npm install
    -g typescript and press Enter. The -g flag installs TypeScript globally, making
    the tsc (TypeScript compiler) command available from any directory. Type tsc -v
    in the Command Prompt and press Enter. This command displays the version of TypeScript
    installed. Configuring TypeScript Compiler With TypeScript installed, the next
    step is to configure the TypeScript compiler. This involves creating a configuration
