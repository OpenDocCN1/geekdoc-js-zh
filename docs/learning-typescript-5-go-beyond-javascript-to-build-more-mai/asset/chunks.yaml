    is an instructor.`);    }  }  // Course class with access modifiers  class Course
    {   public title: string;   private enrolledStudents: string[] = [];   constructor(title:
    string) {     this.title = title;    }   public enroll(studentName: string) {      this.enrolledStudents.push(studentName);     console.log(`${studentName}
    has enrolled in ${this.title}.`);    }   public displayEnrolledStudents() {     console.log(`Enrolled
    Students in ${this.title}: ${this.enrolledStudents.join(", ")}`);    }  }  //
    Creating instances and demonstrating functionality  const course5 = new Course("TypeScript
