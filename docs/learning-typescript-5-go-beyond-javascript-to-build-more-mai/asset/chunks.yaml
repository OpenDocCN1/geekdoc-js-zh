    Interfaces In TypeScript, interfaces can be extended to create more complex and
    hierarchical structures. This allows you to build upon existing interfaces and
    combine them to define new types, making your code more modular and flexible.
    Extending interfaces can help manage complexity by breaking down large interfaces
    into smaller, more manageable pieces. Extending Interfaces When you extend an
    interface, you create a new interface that inherits all properties and methods
    from one or more existing interfaces. This is done using the extends keyword. Extending
    a Single Interface We will extend the ICourseMember interface to create a more
    specific interface for students, including additional properties and methods.  //
