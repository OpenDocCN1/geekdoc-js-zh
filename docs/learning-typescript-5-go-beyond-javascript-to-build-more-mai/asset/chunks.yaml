    = new Instructor(2, "George", "JavaScript");  student3.enroll(course5);  student3.displayName();
    // Output: Name: Fiona  student3.displayRoleInfo(); // Output: Fiona is a student.  student3.displayCourses();
    // Output: Enrolled Courses for Fiona: TypeScript Fundamentals  instructor3.displayName();
    // Output: Name: George  instructor3.displayRoleInfo(); // Output: George is an
    instructor.  instructor3.displayExpertise(); // Output: George is an expert in
    JavaScript  course5.displayEnrolledStudents(); // Output: Enrolled Students in
    TypeScript Fundamentals: Fiona In the above code, we use abstract classes and
    inheritance to manage course roles in our project. The CourseMember abstract class
    serves as a base for Student and Instructor classes, while access modifiers control
    the visibility and accessibility of class members.  Interfaces in Action Interfaces
    define a contract that a class or object must adhere to. They specify the structure
    of an object, including the properties and methods it should have, without providing
    any implementation. This allows for consistent and interchangeable use of objects
    and classes that implement the interface. Interfaces can also include optional
    and readonly properties, providing flexibility and control over object structures. Defining
    an Interface To define an interface, use the interface keyword followed by the
    interface name and the structure it should enforce. Classes can then implement
    these interfaces using the implements keyword, ensuring they adhere to the defined
    structure. We will define interfaces for CourseMember and Course to represent
    the structure of these entities in our project.  // Defining an interface for
    CourseMember  interface ICourseMember {   id: number;   name: string;   displayRoleInfo():
    void;  }  // Defining an interface for Course  interface ICourse {   title: string;  
    enroll(studentName: string): void;   displayEnrolledStudents(): void;  } In the
    above code, ICourseMember defines the structure for a course member with an and
    a method Similarly, ICourse defines the structure for a course with a title and
    methods for enrolling students and displaying enrolled students. Implementing
    Interfaces in Classes We will implement these interfaces in the and Course classes.  //
    Implementing the ICourseMember interface in the Student class  class Student implements
