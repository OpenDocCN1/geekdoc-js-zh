    how different parts of an application work together. They ensure that components
    interact correctly and produce the expected behavior. We will write integration
    tests for a service that manages students. And for this, we will create the service
    file studentService.ts  // src/services/studentService.ts  interface Student {  
    id: number;   name: string;  }  export class StudentService {   private students:
    Student[] = [];   addStudent(student: Student): void {    this.students.push(student);   }  
    getStudents(): Student[] {   return this.students;   }   findStudentById(id: number):
    Student | undefined {   return this.students.find(student => student.id === id);   }  } Then,
    we will create the test file studentService.test.ts  // src/services/studentService.test.ts  import
    { StudentService } from ''./studentService'';  describe(''StudentService'', ()
