    export default App;\n```\n\nIn the above code, the `App` component wraps its children\
    \ making the theme context available to the `ThemeToggleButton` component. The\
    \ `ThemeToggleButton` uses the `useTheme` hook to access and toggle the theme,\
    \ demonstrating how `TypeScript` and `React Context` work together to manage application-wide\
    \ state.\n\n# Migrating JavaScript Applications to TypeScript\n\nMigrating a JavaScript\
    \ application to TypeScript can bring numerous benefits, including improved code\
    \ quality, better tooling support, and enhanced maintainability. However, the\
    \ migration process requires careful planning and execution to ensure a smooth\
    \ transition. In this topic, we will outline a proven step-by-step process to\
    \ migrate JavaScript applications to TypeScript and provide troubleshooting advice\
    \ for common issues that may arise during the migration.\n\n## Migration Process\n\
    \nMigrating a JavaScript application to TypeScript involves several stages, from\
    \ setting up TypeScript in your project to gradually converting JavaScript files.\
    \ Given below is a step-by-step practical walkthrough to help you navigate this\
    \ process.\n\n### Prepare the Project\n\nBefore starting the migration, ensure\
    \ that your project is in a stable state and that you have a complete backup.\
    \ This precaution will help you revert to the original code if needed.\n\n* Ensure\
    \ that your project dependencies are up-to-date.\n* Remove any unused or deprecated\
    \ libraries.\n* Resolve any existing bugs or issues.\n\n### Install TypeScript\n\
    \nAdd TypeScript to your project as a development dependency using `npm` or `yarn`.\n\
    \n#### Using npm\n```bash\nnpm install --save-dev typescript\n```\n\n#### Using\
    \ yarn\n```bash\nyarn add --dev typescript\n```\n\n### Initialize TypeScript Configuration\n\
    \nCreate a `tsconfig.json` file in your project root directory to configure TypeScript\
    \ settings.\n\n```bash\nnpx tsc --init\n```\n\nThis command generates a default\
    \ `tsconfig.json` file, which you can customize according to your project's needs.\
    \ Key configurations to consider:\n\n* Specify the JavaScript version (e.g., `ES6`).\n\
    * Define the module system (e.g., `\"commonjs\"` or `\"ESNext\"`).\n* Enable strict\
    \ type-checking options for better type safety.\n* Define which files or directories\
    \ to include (e.g., `\"src\"`).\n* Define files or directories to exclude (e.g.,\
    \ `\"node\"`).\n\n### Rename JavaScript Files\n\nBegin migrating files by renaming\
    \ them from `.js` to `.ts`. Start with simpler, isolated files to minimize potential\
    \ issues.\n\n```bash\nmv src/example.js src/example.ts\n```\n\n`TypeScript` can\
    \ compile JavaScript files, so you can rename them incrementally, ensuring that\
    \ the application continues to work.\n\n### Enable Type Checking\n\nRun the TypeScript\
    \ compiler to enable type checking on the renamed files.\n\n```bash\nnpx tsc\n\
    ```\n\nThe TypeScript compiler will report any type errors or issues, allowing\
    \ you to address them before proceeding.\n\n### Add Type Annotations\n\nGradually\
    \ add type annotations to your TypeScript files to improve type safety and code\
    \ readability.\n\n* Annotate function parameters and return types.\n* Define `interfaces`\
    \ or type aliases for complex data structures.\n* Use `TypeScript`'s built-in\
    \ types like `string` and `number`.\n\nCheck the following example to understand\
    \ the add type annotation:\n\n```typescript\n// Before migration (JavaScript)\n\
    function greet(name) {\n  return \"Hello, \" + name;\n}\n\n// After migration\
    \ (TypeScript)\nfunction greet(name: string): string {\n  return \"Hello, \" +\
    \ name;\n}\n```\n\n### Migrate Complex Files\n\nMove on to more complex files,\
    \ such as those with classes, `interfaces`, or external dependencies. Gradually\
    \ replace JavaScript-specific constructs with TypeScript equivalents. See the\
    \ following code to understand migrating a class.\n\n```typescript\n// Before\
    \ migration (JavaScript)\nclass Person {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  sayHello() {\n    console.log(`Hello, my name is ${this.name}`);\n\
    \  }\n}\n\n// After migration (TypeScript)\nclass Person {\n  name: string;\n\
    \  constructor(name: string) {\n    this.name = name;\n  }\n  sayHello(): void\
    \ {\n    console.log(`Hello, my name is ${this.name}`);\n  }\n}\n```\n\n### Address\
    \ Third-Party Libraries\n\nFor third-party libraries that lack TypeScript definitions,\
    \ you can install type definitions from `DefinitelyTyped` or create your own type\
    \ declarations.\n\n#### Install type definitions for a library\n```bash\nnpm install\
    \ --save-dev @types/library-name\n```\n\nIf no type definitions are available,\
    \ you can create a `.d.ts` file to define your own.\n\n```typescript\n// custom-types.d.ts\n\
    declare module 'library-name' {\n  export function someFunction(param: string):\
    \ void;\n}\n```\n\n### Update Project Configuration\n\nOnce the migration is complete,\
    \ update build scripts, linters, and IDE settings to ensure they support TypeScript.\n\
    \n* Update `package.json` scripts to use `tsc` for compilation.\n* Configure linters\
    \ like `ESLint` to work with `TypeScript`.\n* Ensure your IDE is set up to handle\
    \ TypeScript files.\n\n## Troubleshooting Common Migration Issues\n\nDespite careful\
    \ planning, you may encounter challenges during the migration process. Given below\
    \ are some common issues and potential solutions:\n\n### Compilation Errors\n\n\
    Think that the `typeScript` compilation fails with errors. Now, to solve it, we\
    \ will address each error by refining type annotations, fixing type mismatches,\
    \ or resolving dependencies.\n\nThe following is the example error on the Type\
    \ Mismatch:\n\n```typescript\n// Error: Type 'number' is not assignable to type\
    \ 'string'.\nlet name: string = 123;\n\n// Solution\nlet name: string = 'John';\n\
    ```\n\n### Missing Type Definitions\n\nLet us say that the third-party libraries\
    \ lack TypeScript definitions. To resolve it, we install type definitions from\
    \ `DefinitelyTyped` or we may create custom type declarations as shown below:\n\
    \n```bash\nnpm install --save-dev @types/lodash\n```\n\n### Type Inference Issues\n\
    \nLet us say that the `typeScript` is unable to infer types correctly. Now, to\
    \ address it, we will explicitly define types using annotations or `interfaces`\
    \ in order to walkthrough you the `TypeScript`'s inference.\n\n```typescript\n\
    // Without annotations\nconst add = (a, b) => a + b;\n\n// With annotations\n\
    const add = (a: number, b: number): number => a + b;\n```\n\n### Runtime Errors\n\
    \nVery commonly, the `TypeScript` fails or is not able to catch most runtime errors.\
    \ In order to prevent this from happening, I would recommend to conduct thorough\
    \ testing to catch issues that static analysis might miss.\n\n```typescript\n\
    function divide(a: number, b: number): number {\n  if (b === 0) {\n    throw new\
    \ Error('Division by zero');\n  }\n  return a / b;\n}\n```\n\n## Implementing\
    \ Migration\n\nWe will apply the migration process to a hypothetical component.\
    \ Let us consider that `course.js` is the original script component as:\n\n```javascript\n\
    // course.js\nfunction Course(title, description) {\n  this.title = title;\n \
    \ this.description = description;\n}\nCourse.prototype.displayInfo = function()\
    \ {\n  if (this.description) {\n    console.log('Course:', this.description);\n\
    \  } else {\n    console.log('No description available.');\n  }\n};\nconst course\
    \ = new Course('TypeScript', 'Learn the basics of.');\ncourse.displayInfo();\n\
    ```\n\nAnd, the migrated component is `course.ts`:\n\n```typescript\n// course.ts\n\
    class Course {\n  title: string;\n  description?: string;\n  constructor(title:\
    \ string, description?: string) {\n    this.title = title;\n    this.description\
    \ = description;\n  }\n  displayInfo(): void {\n    if (this.description) {\n\
    \      console.log('Course:', this.description);\n    } else {\n      console.log('No\
    \ description available.');\n    }\n  }\n}\nconst course = new Course('TypeScript',\
    \ 'Learn the basics of.');\ncourse.displayInfo();\n```\n\n## Testing TypeScript\
    \ Applications\n\n### Overview\n\nTesting is a critical aspect of software development\
    \ that ensures the reliability and stability of applications. In `TypeScript`\
    \ applications, testing helps verify that the code behaves as expected and identifies\
    \ potential issues before production. In this section, we will learn the different\
    \ elements of an application that are typically tested, introduce and set up the\
    \ `Jest` framework, and demonstrate how to write unit and integration tests.\n\
    \n* **Functions and methods**: Core logic units of an application. Testing them\
    \ verifies they produce the expected output for a given input and handle edge\
    \ cases.\n* **Components**: In component-based frameworks like `Angular` and `React`,\
    \ components are tested to ensure they render correctly, handle user interactions,\
    \ and manage state.\n* **Services**: Encapsulate business logic and interact with\
    \ external resources. Testing services ensure they perform their intended operations\
    \ and handle errors gracefully.\n* **APIs and endpoints**: Tested to verify that\
    \ they return the expected data, handle requests correctly, and manage errors.\
    \ This is crucial for applications that rely on external data sources.\n* **User\
    \ interfaces**: Ensures that the application's visual elements are displayed correctly,\
    \ respond to user actions, and maintain a consistent user experience.\n* **Integration\
    \ testing**: Evaluates how different parts of an application work together. This\
    \ includes testing the interaction between components, services, and `apis`.\n\
    \n### Introduction to Jest\n\n`Jest` is a popular testing framework for `JavaScript`\
    \ and `TypeScript`. It provides a simple and efficient way to write and run tests,\
    \ with built-in support for test runners, assertions, and mocking. `Jest` is well-suited\
    \ for both unit and integration testing, making it a versatile choice for `TypeScript`\
    \ projects.\n\n### Setting up Jest\n\nTo set up `Jest` for a `TypeScript` project,\
    \ first add `Jest` and the necessary `TypeScript` support packages to your project\
    \ as development dependencies:\n\n```bash\nnpm install --save-dev jest ts-jest\
    \ @types/jest\n```\n\nHere in the above code:\n* The core `Jest` testing framework.\n\
    * A `TypeScript` preprocessor for `Jest`, enabling it to run `TypeScript` tests.\n\
    * Type definitions for `Jest`, providing `TypeScript` support for `Jest`'s API.\n\
    \n### Configure Jest\n\nCreate a `jest.config.js` file in the project root directory\
    \ to configure `Jest` settings:\n\n```javascript\nmodule.exports = {\n  preset:\
    \ 'ts-jest',\n  testEnvironment: 'node',\n  testPathIgnorePatterns: ['/node_modules/',\
    \ '/dist/'],\n  moduleFileExtensions: ['ts', 'tsx', 'js', 'jsx'],\n  transform:\
    \ {\n    '^.+\\.(ts|tsx)$': 'ts-jest',\n  },\n};\n```\n\nThis configuration specifies\
    \ that `Jest` should use `ts-jest` to transform `TypeScript` files and run tests\
    \ in a `Node.js` environment.\n\n### Add Jest Scripts\n\nUpdate the `package.json`\
    \ file to include a test script for running `Jest` tests:\n\n```json\n{\n  \"\
    scripts\": {\n    \"test\": \"jest\"\n  }\n}\n```\n\nYou can now run tests using\
    \ the following command:\n\n```bash\nnpm test\n```\n\n### Writing Unit Test Scripts\n\
    \nUnit tests focus on testing individual functions or methods to verify their\
    \ correctness in isolation. `Jest` provides a simple API for writing unit tests.\
    \ Now, let's write unit tests for a utility function that formats dates through\
    \ the utility function file `dateUtils.ts`:\n\n```typescript\n// src/utils/dateUtils.ts\n\
    export function formatDate(date: Date): string {\n  const year = date.getFullYear();\n\
    \  const month = (date.getMonth() + 1).toString().padStart(2, '0');\n  const day\
    \ = date.getDate().toString().padStart(2, '0');\n  return `${year}-${month}-${day}`;\n\
    }\n```\n\nThen, create the test file `dateUtils.test.ts`:\n\n```typescript\n//\
    \ src/utils/dateUtils.test.ts\nimport { formatDate } from './dateUtils';\n\ndescribe('formatDate',\
    \ () => {\n  it('should format the date correctly', () => {\n    const date =\
    \ new Date(2023, 0, 1); // January 1st\n    expect(formatDate(date)).toBe('2023-01-01');\n\
    \  });\n\n  it('should handle single digit months', () => {\n    const date =\
    \ new Date(2023, 4, 5); // May 5th\n    expect(formatDate(date)).toBe('2023-05-05');\n\
    \  });\n});\n```\n\nIn the above code, we define `formatDate` function in `dateUtils.ts`\
    \ and write unit tests for it. The tests verify that the function formats dates\
    \ correctly and handles single-digit months and days. `describe` block groups\
    \ related tests, and `it` blocks individual test cases.\n\n### Writing Integration\
    \ Test Scripts\n\nIntegration tests evaluate how different parts of an application\
    \ work together. They ensure components interact correctly and produce the expected\
    \ behavior.\n\n```typescript\n// src/services/studentService.ts\ninterface Student\
    \ {\n  id: number;\n  name: string;\n  email: string;\n}\n\nexport class StudentService\
    \ {\n  private students: Student[] = [];\n\n  addStudent(student: Student): void\
    \ {\n    this.students.push(student);\n  }\n\n  getStudents(): Student[] {\n \
    \   return this.students;\n  }\n\n  findStudentById(id: number): Student | undefined\
    \ {\n    return this.students.find(s => s.id === id);\n  }\n}\n\n// src/services/studentService.test.ts\n\
    import { StudentService } from './studentService';\n\ndescribe('StudentService',\
    \ () => {\n  let service: StudentService;\n\n  beforeEach(() => {\n    service\
    \ = new StudentService();\n  });\n\n  it('should add and retrieve a student',\
    \ () => {\n    const student = { id: 1, name: 'Alice', email: 'alice@example.com'\
    \ };\n    service.addStudent(student);\n    expect(service.getStudents()).toContain(student);\n\
    \  });\n\n  it('should find a student by ID', () => {\n    const student = { id:\
    \ 2, name: 'Bob', email: 'bob@example.com' };\n    service.addStudent(student);\n\
    \    expect(service.findStudentById(2)).toEqual(student);\n  });\n\n  it('should\
    \ return undefined for a non-existent student', () => {\n    expect(service.findStudentById(99)).toBeUndefined();\n\
    \  });\n});\n```\n\n# Chapter 8: Runtime Behavior and Type Checking\n\n## Chapter\
    \ Overview\n\nThis final chapter will go over the runtime behavior of `TypeScript`\
    \ applications and the different ways `TypeScript` improves type safety. This\
    \ chapter will look at the complexities of runtime type checking, including how\
    \ `TypeScript`'s static type system interacts with `JavaScript`'s dynamic nature.\
    \ We will look at cases in which `TypeScript`'s type checks occur during compilation\
    \ and the implications for runtime behavior, which will help us comprehend the\
    \ distinction between `TypeScript`'s compile-time safety and `JavaScript`'s runtime\
    \ execution.\n\nThe chapter will cover type narrowing techniques that enable developers\
    \ to refine types based on criteria, such as type guards and discriminated unions.\
    \ Type narrowing allows us to use `TypeScript`'s type inference features to construct\
    \ more precise and error-free code. We will also look at the `TypeScript` compiler\
    \ parameters, which control how `TypeScript` code is compiled and checked. This\
    \ includes setting up the compiler to impose tougher type checks, optimize code\
    \ efficiency, and produce output that meets our needs. Understanding these options\
    \ allows us to personalize the development environment to our individual requirements,\
    \ improving development efficiency and code quality.\n\nFinally, the chapter will\
    \ cover how to handle asynchronous code and manage failures in `TypeScript` applications.\
    \ Asynchronous programming is a vital component of current `JavaScript` development,\
    \ and we will look at how `TypeScript` handles asynchronous processes using `async/await`\
    \ syntax and `Promises`. We will also learn about error handling and exception\
    \ management solutions, which will help us ensure that our applications handle\
    \ unexpected events gracefully and provide useful feedback.\n\n## Understanding\
    \ Runtime Type Checking\n\nType checking is a fundamental aspect of programming\
    \ languages that ensures variables, functions, and expressions are used consistently\
    \ according to their types. In statically typed languages like `TypeScript`, this\
    \ happens at compile time, where the compiler validates the types before the code\
    \ is executed. This provides a layer of safety and predictability, allowing developers\
    \ to catch errors early in the development process. However, `TypeScript` code\
    \ ultimately compiles down to `JavaScript`, which is a dynamically typed language.\
    \ This means that type checking at runtime requires additional handling.\n\n###\
    \ What is Type Checking\n\nType checking refers to the process of verifying that\
    \ variables and expressions in a program conform to the expected types. In statically\
    \ typed languages like `TypeScript`, this happens at compile time, where the compiler\
    \ ensures the types are consistent. This helps prevent errors as passing a string\
    \ where a number is expected or invoking a method that doesn't exist. In `TypeScript`,\
    \ type annotations allow developers to explicitly specify the types of variables\
    \ and function parameters. `TypeScript` also performs type inference, automatically\
    \ determining the types based on the context.\n\n### Performing Type Checking\
    \ at Runtime\n\nSince `TypeScript` compiles to `JavaScript`, runtime type checking\
    \ involves writing code that verifies types during execution. This is particularly\
    \ useful when dealing with data from external sources, such as APIs, where the\
    \ type of incoming data may be uncertain. Runtime type checking can be implemented\
    \ using `JavaScript`'s dynamic capabilities and type guards.\n\n### Define the\
    \ Expected Type\n\n```typescript\ninterface User {\n  id: number;\n  name: string;\n\
    \  email: string;\n}\n```\n\n### Create a Guard Function\n\nType guards are functions\
    \ that determine whether a value matches a specific type.\n\n```typescript\nfunction\
    \ isUser(data: any): data is User {\n  return (\n    typeof data === 'object'\
    \ &&\n    typeof data.id === 'number' &&\n    typeof data.name === 'string' &&\n\
    \    typeof data.email === 'string'\n  );\n}\n```\n\n### Use the Type Guard for\
    \ Runtime Checking\n\n```typescript\nfunction handleApiResponse(response: any)\
    \ {\n  if (isUser(response)) {\n    console.log(`User ID: ${response.id}`);\n\
    \    console.log(`User Name: ${response.name}`);\n    console.log(`User Email:\
    \ ${response.email}`);\n  } else {\n    console.error('Invalid user data:', response);\n\
    \  }\n}\n\n// Simulate an API response\nconst apiResponse = {\n  id: 123,\n  name:\
    \ 'Alice',\n  email: 'alice@example.com'\n};\nhandleApiResponse(apiResponse);\n\
    ```\n\n### Troubleshooting and Managing Errors\n\nEven with `TypeScript`'s compile-time\
    \ checks, runtime errors can occur, especially when dealing with dynamic data\
    \ or third-party libraries. Given below are some strategies to troubleshoot and\
    \ manage errors effectively:\n\n#### Validate External Data\n\nWhen working with\
    \ external sources such as APIs, validate the data before processing. This can\
    \ involve using type guards, shown earlier, or employing libraries for robust\
    \ validation.\n\n```typescript\nimport * as t from 'io-ts';\n\nconst UserCodec\
    \ = t.type({\n  id: t.number,\n  name: t.string,\n  email: t.string\n});\n\ntype\
    \ User = t.TypeOf<typeof UserCodec>;\n\nfunction validateUser(data: unknown):\
    \ User | null {\n  const result = UserCodec.decode(data);\n  if (result._tag ===\
    \ 'Right') {\n    return result.right;\n  } else {\n    console.error('Validation\
    \ error:', result.left);\n    return null;\n  }\n}\n\nconst apiResponse = {\n\
    \  id: 123,\n  name: 'Alice',\n  email: 'alice@example.com'\n};\nconst user =\
    \ validateUser(apiResponse);\nif (user) {\n  console.log('Validated User:', user);\n\
    }\n```\n\n#### Use Fallbacks for Undefined or Null Values\n\n`JavaScript` and\
    \ `TypeScript` allow `undefined` and `null` values, which can lead to runtime\
    \ errors if not handled. Use optional chaining and nullish coalescing to manage\
    \ these values gracefully.\n\n```typescript\nfunction getUserEmail(user: User\
    \ | null): string {\n  return user?.email ?? 'Email not available';\n}\n\nconst\
    \ user = { id: 1, name: 'Bob', email: 'bob@example.com' };\nconsole.log(getUserEmail(user));\
    \ // Output: bob@example.com\n\nconst unknownUser = null;\nconsole.log(getUserEmail(unknownUser));\
    \ // Output: Email not available\n```\n\n#### Implement Error Handling Mechanisms\n\
    \nIncorporate error handling mechanisms such as `try-catch` blocks to capture\
    \ and manage runtime errors.\n\n```typescript\nfunction parseJson(jsonString:\
    \ string): any {\n  try {\n    return JSON.parse(jsonString);\n  } catch (error)\
    \ {\n    console.error('Failed to parse JSON:', error);\n    return null;\n  }\n\
    }\n\nconst jsonString = '{\"id\": 1, \"name\": \"Charlie\"}';\nconst parsedData\
    \ = parseJson(jsonString);\nif (parsedData) {\n  console.log('Parsed Data:', parsedData);\n\
    }\n```\n\n#### Leverage Compiler Options\n\nConfigure the `TypeScript` compiler\
    \ to enforce stricter checks and catch potential errors during development.\n\n\
    ```json\n{\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"noImplicitAny\"\
    : true,\n    \"strictNullChecks\": true,\n    \"strictPropertyInitialization\"\
    : true\n  }\n}\n```\n\n#### Document and Communicate Expectations\n\nDocument\
    \ the expected types of functions, `interfaces`, and data structures using comments.\n\
    \n```typescript\n/**\n * Represents a user in the system.\n */\ninterface User\
    \ {\n  id: number; // Unique identifier for the user\n  name: string; // Name\
    \ of the user\n  email: string; // Email address of the user\n}\n\n/**\n * Retrieves\
    \ a user by ID.\n * @param id - The ID of the user to retrieve.\n * @returns The\
    \ user with the specified ID, or undefined if not found.\n */\nfunction getUserById(id:\
    \ number): User | undefined {\n  // Implementation here\n}\n```\n\n## Narrowing\
    \ Techniques\n\nType narrowing is the process of refining a broader or general\
    \ type to a more specific one based on conditions or operations. This allows developers\
    \ to apply specific logic to certain types. `TypeScript` offers several techniques\
    \ for type narrowing, including type guards, control flow analysis, and discriminated\
    \ unions.\n\n### Type Guards\n\nType guards are expressions used to narrow down\
    \ the type of a variable within a conditional block. They are often used with\
    \ `typeof` and `instanceof` operators, as well as user-defined type guard functions.\n\
    \n#### Using `typeof` for Primitives\n\nThe `typeof` operator is commonly used\
    \ to narrow types of primitive values.\n\n```typescript\nfunction printLength(value:\
    \ string | number) {\n  if (typeof value === 'string') {\n    console.log(`String\
    \ length: ${value.length}`);\n  } else {\n    console.log(`Number: ${value}`);\n\
    \  }\n}\n```\n\n#### Using `instanceof` for Objects\n\nThe `instanceof` operator\
    \ is used to narrow types of objects based on their constructor.\n\n```typescript\n\
    class Dog {\n  bark() {\n    console.log('Woof!');\n  }\n}\nclass Cat {\n  meow()\
    \ {\n    console.log('Meow!');\n  }\n}\n\nfunction makeSound(animal: Dog | Cat)\
    \ {\n  if (animal instanceof Dog) {\n    animal.bark();\n  } else {\n    animal.meow();\n\
    \  }\n}\nmakeSound(new Dog()); // Output: Woof!\nmakeSound(new Cat()); // Output:\
    \ Meow!\n```\n\n#### User-Defined Type Guards\n\nUser-defined type guards are\
    \ functions that return a boolean value indicating whether a value matches a specific\
    \ type. They are useful for more complex type checks.\n\n```typescript\ninterface\
    \ Car {\n  drive(): void;\n}\ninterface Boat {\n  sail(): void;\n}\n\nfunction\
    \ isCar(vehicle: Car | Boat): vehicle is Car {\n  return (vehicle as Car).drive\
    \ !== undefined;\n}\n\nfunction operateVehicle(vehicle: Car | Boat) {\n  if (isCar(vehicle))\
    \ {\n    vehicle.drive();\n  } else {\n    vehicle.sail();\n  }\n}\nconst car:\
    \ Car = { drive: () => console.log('Driving') };\nconst boat: Boat = { sail: ()\
    \ => console.log('Sailing') };\noperateVehicle(car); // Output: Driving\noperateVehicle(boat);\
    \ // Output: Sailing\n```\n\n### Control Flow Analysis\n\n`TypeScript` uses control\
    \ flow analysis to refine types based on the flow of the code. This analysis considers\
    \ the path the code takes, allowing `TypeScript` to narrow types more precisely.\n\
    \n#### Narrowing with `if` Statements\n\n`TypeScript` narrows types within `if`\
    \ statements by analyzing the conditions.\n\n```typescript\nfunction checkValue(value:\
    \ number | null) {\n  if (value !== null) {\n    console.log(`Value is a number:\
    \ ${value}`);\n  } else {\n    console.log('Value is null');\n  }\n}\ncheckValue(42);\
    \ // Output: Value is a number: 42\ncheckValue(null); // Output: Value is null\n\
    ```\n\n#### Narrowing with `switch` Statements\n\n`TypeScript` can also narrow\
    \ types within `switch` statements.\n\n```typescript\ntype Shape = 'circle' |\
    \ 'square';\nfunction calculateArea(shape: Shape, size: number) {\n  switch (shape)\
    \ {\n    case 'circle':\n      return Math.PI * size * size;\n    case 'square':\n\
    \      return size * size;\n  }\n}\nconsole.log(calculateArea('circle', 3)); //\
    \ Output: 28.27433388230818\nconsole.log(calculateArea('square', 3)); // Output:\
    \ 9\n```\n\n#### Narrowing with Loops\n\n`TypeScript` can narrow types within\
    \ loops, considering the loop's exit conditions.\n\n```typescript\nfunction findFirstPositive(numbers:\
    \ (number | null)[]): number | undefined {\n  for (const num of numbers) {\n \
    \   if (num !== null && num > 0) {\n      return num;\n    }\n  }\n  return undefined;\n\
    }\nconst numbers = [null, -1, 0, 5, null];\nconsole.log(findFirstPositive(numbers));\
    \ // Output: 5\n```\n\n### Discriminated Unions\n\nDiscriminated unions are a\
    \ powerful pattern that use a common property to differentiate between union members.\
    \ They enable precise narrowing.\n\n```typescript\ninterface Circle {\n  kind:\
    \ 'circle';\n  radius: number;\n}\ninterface Square {\n  kind: 'square';\n  sideLength:\
    \ number;\n}\ntype Shape = Circle | Square;\n\nfunction getArea(shape: Shape)\
    \ {\n  switch (shape.kind) {\n    case 'circle':\n      return Math.PI * shape.radius\
    \ * shape.radius;\n    case 'square':\n      return shape.sideLength * shape.sideLength;\n\
    \  }\n}\nconsole.log(getArea({ kind: 'circle', radius: 2 })); // Output: 12.56637061435917\n\
    console.log(getArea({ kind: 'square', sideLength: 2 })); // Output: 4\n```\n\n\
    # Handling Asynchronous Code\n\nAsynchronous programming is a critical aspect\
    \ of modern `JavaScript` and `TypeScript` development. It allows applications\
    \ to perform long-running tasks, such as fetching data from a server, without\
    \ blocking the execution thread. This ensures that applications remain responsive\
    \ and efficient. In this section, we will explore the fundamentals of asynchronous\
    \ programming using `Promises` and the `async/await` syntax. We will also cover\
    \ troubleshooting techniques for handling errors in asynchronous code.\n\n###\
    \ Introduction to Promises\n\n`Promises` are a key feature of `JavaScript` that\
    \ represent the eventual completion or failure of an asynchronous operation. They\
    \ provide a clean and readable way to handle asynchronous tasks, enabling developers\
    \ to write more manageable code.\n\n### Creating a Promise\n\nA `Promise` can\
    \ be created using the `Promise` constructor, which takes a function as an argument.\
    \ This function receives two parameters: `resolve` and `reject`. These parameters\
    \ are functions used to mark the `Promise` as fulfilled or rejected, respectively.\n\
    \n```typescript\nconst myPromise = new Promise<string>((resolve, reject) => {\n\
    \  const success = true;\n  if (success) {\n    resolve('Operation succeeded');\n\
    \  } else {\n    reject('Operation failed');\n  }\n});\nmyPromise\n  .then((result)\
    \ => console.log(result))\n  .catch((error) => console.error(error));\n```\n\n\
    In the above code, the `Promise` is resolved with a success message if the operation\
    \ succeeds and rejected with an error message if it fails. The `then` method handles\
    \ the resolved value, while the `catch` method handles the rejected value.\n\n\
    ### Chaining Promises\n\n`Promises` can be chained together to perform sequential\
    \ asynchronous operations. Each `then` call returns a new `Promise`, allowing\
    \ multiple operations to be linked.\n\n```typescript\nfunction fetchData(): Promise<string>\
    \ {\n  return new Promise((resolve) => {\n    setTimeout(() => resolve('Data fetched'),\
    \ 1000);\n  });\n}\n\nfunction processData(data: string): Promise<string> {\n\
    \  return new Promise((resolve) => {\n    setTimeout(() => resolve(`${data} processed`),\
    \ 1000);\n  });\n}\n\nfetchData()\n  .then((result) => processData(result))\n\
    \  .then((finalResult) => console.log(finalResult))\n  .catch((error) => console.error(error));\n\
    ```\n\nIn the above code, `fetchData` returns a `Promise` that resolves with a\
    \ data string after 1 second. The resolved value is then passed to `processData`\
    \ which returns another `Promise` that processes the data. The final result is\
    \ logged to the console.\n\n### Async/Await Syntax\n\nThe `async/await` syntax\
    \ provides a more concise and readable way to work with `Promises`. It allows\
    \ developers to write asynchronous code that looks synchronous, making it easier\
    \ to understand.\n\n### Using Async/Await\n\nTo use `async`, declare a function\
    \ as `async` and use the `await` keyword to pause execution until a `Promise`\
    \ is resolved or rejected.\n\n```typescript\nasync function performOperations()\
    \ {\n  try {\n    const data = await fetchData();\n    const processedData = await\
    \ processData(data);\n    console.log(processedData);\n  } catch (error) {\n \
    \   console.error(error);\n  }\n}\n```\n\nIn the above code, `performOperations`\
    \ is marked as `async`, allowing the use of `await` to pause execution until each\
    \ `Promise` is resolved.\n\n### Working with Multiple Promises\n\n`async/await`\
    \ can be used with multiple promises, enabling parallel execution and improved\
    \ performance.\n\n```typescript\nasync function fetchMultipleData() {\n  try {\n\
    \    const [data1, data2] = await Promise.all([fetchData(), processData('Sample')]);\n\
    \    console.log('Data 1:', data1);\n    console.log('Data 2:', data2);\n  } catch\
    \ (error) {\n    console.error(error);\n  }\n}\n```\n\nIn the above code, `Promise.all`\
    \ is used to execute `fetchData` and `processData` in parallel. The results are\
    \ returned as an array, allowing both operations to complete.\n\n### Troubleshooting\
    \ Errors in Asynchronous Code\n\nAsynchronous code can introduce new challenges\
    \ when it comes to error handling. Understanding how to effectively manage errors\
    \ is crucial for building robust applications.\n\n### Handling Promise Rejections\n\
    \nUnhandled `Promise` rejections can lead to unexpected behavior and application\
    \ crashes. Use the `catch` method to handle rejections.\n\n```typescript\nmyPromise\n\
    \  .then((result) => console.log(result))\n  .catch((error) => console.error('Promise\
    \ rejected:', error));\n```\n\nIn the above code, the `catch` method ensures that\
    \ any rejected `Promise` is handled.\n\n### Using Try/Catch with Async/Await\n\
    \nWhen wrapping asynchronous operations in a `try/catch` block to manage errors:\n\
    \n```typescript\nasync function fetchDataWithError() {\n  throw new Error('Failed\
    \ to fetch data');\n}\n\nasync function handleData() {\n  try {\n    const data\
    \ = await fetchDataWithError();\n    console.log(data);\n  } catch (error) {\n\
    \    console.error('Error fetching data:', error);\n  }\n}\n```\n\nIn the above\
    \ code, `fetchDataWithError` throws an error. The `try/catch` block in `handleData`\
    \ catches it and logs it.\n\n## Exception Management\n\nException management is\
    \ a critical aspect of software development that involves handling errors and\
    \ unexpected situations gracefully. In `TypeScript`, exception management ensures\
    \ that applications continue to function even when unexpected issues arise, providing\
    \ a better user experience and more robust applications. This section will explore\
    \ how to use `try/catch` blocks for exception management and how to create custom\
    \ error classes to handle specific error scenarios more effectively.\n\n### Introduction\
    \ to Try/Catch Blocks\n\nThe `try/catch` block is a fundamental construct in `JavaScript`\
    \ and `TypeScript` for managing exceptions. It allows developers to execute a\
    \ block of code and catch any errors that occur within that block. By handling\
    \ exceptions, you can prevent your application from crashing and provide meaningful\
    \ error messages or recovery mechanisms.\n\n### Using Try/Catch Blocks\n\nA `try/catch`\
    \ block consists of two main parts: the `try` block, which contains the code that\
    \ might throw an error, and the `catch` block, which handles the error if it occurs.\n\
    \n```typescript\ntry {\n  // Code that might throw an error\n} catch (error) {\n\
    \  // Handle the error\n}\n```\n\nConsider a scenario where you need to parse\
    \ JSON data, which might be malformed and cause an error.\n\n```typescript\nfunction\
    \ parseJson(jsonString: string): any {\n  try {\n    const data = JSON.parse(jsonString);\n\
    \    console.log('Parsed data:', data);\n    return data;\n  } catch (error) {\n\
    \    console.error('Error parsing JSON:', error);\n    return null;\n  }\n}\n\n\
    const validJson = '{\"id\": 1, \"name\": \"Alice\"}';\nconst invalidJson = '{\"\
    id\": 1, \"name\": \"Alice\"'; // Missing closing brace\n\nparseJson(validJson);\
    \ // Output: Parsed data: {id: 1, name: \"Alice\"}\nparseJson(invalidJson); //\
    \ Output: Error parsing JSON: SyntaxError\n```\n\nIn the above code, the `parseJson`\
    \ function uses a `try/catch` block to handle potential errors. If an error occurs,\
    \ it is caught in the `catch` block, allowing the function to return `null` instead\
    \ of crashing.\n\n### Handling Specific Errors\n\nYou can customize the `catch`\
    \ block to handle specific error types or conditions.\n\n```typescript\nfunction\
    \ divideNumbers(a: number, b: number): number {\n  try {\n    if (b === 0) {\n\
    \      throw new Error('Division by zero');\n    }\n    return a / b;\n  } catch\
    \ (error) {\n    console.error('Error:', error.message);\n    return NaN;\n  }\n\
    }\n\nconsole.log(divideNumbers(10, 2)); // Output: 5\nconsole.log(divideNumbers(10,\
    \ 0)); // Output: Error: Division by zero\n```\n\nIn the above code, the `divideNumbers`\
    \ function throws an error if division by zero is attempted. The `catch` block\
    \ handles this specific error and logs a meaningful message.\n\n### Creating Error\
    \ Classes\n\nWhile built-in error types like `Error` cover many scenarios, creating\
    \ custom classes allows you to define application-specific errors.\n\n```typescript\n\
    class ValidationError extends Error {\n  constructor(message: string, public invalidField:\
    \ string) {\n    super(message);\n    this.name = 'ValidationError';\n  }\n}\n\
    ```\n\n### Defining Error Class\n\nTo create a custom error class, extend the\
    \ built-in `Error` class and add any properties or methods.\n\n```typescript\n\
    class NetworkError extends Error {\n  constructor(message: string, public url:\
    \ string) {\n    super(message);\n    this.name = 'NetworkError';\n  }\n}\n```\n\
    \n### Using Error Classes\n\nCustom error classes can be used to throw and catch\
    \ specific errors in your application.\n\n```typescript\nfunction validateUser(user:\
    \ { name: string; email: string }) {\n  if (!user.name) {\n    throw new ValidationError('Name\
    \ is required', 'name');\n  }\n  if (!user.email) {\n    throw new ValidationError('Email\
    \ is required', 'email');\n  }\n  console.log('User is valid:', user);\n}\n\n\
    try {\n  validateUser({ name: '', email: 'alice@example.com' });\n} catch (error)\
    \ {\n  if (error instanceof ValidationError) {\n    console.error(`Validation\
    \ error on field ${error.invalidField}: ${error.message}`);\n  } else {\n    console.error('Unexpected\
    \ error:', error);\n  }\n}\n```\n\nIn the above code, the `validateUser` function\
    \ throws a `ValidationError` if the user's name or email is missing. The `try/catch`\
    \ block handles this specific error type, providing detailed information about\
    \ the validation error.\n\n### Multiple Error Types\n\nWhen dealing with multiple\
    \ error types, use conditional logic in the `catch` block to handle each type\
    \ appropriately.\n\n```typescript\nclass NetworkError extends Error {\n  constructor(message:\
    \ string, public url: string) {\n    super(message);\n    this.name = 'NetworkError';\n\
    \  }\n}\n\nasync function fetchData(url: string) {\n  try {\n    // Simulate a\
    \ network error\n    throw new NetworkError('Failed to fetch data', url);\n  }\
    \ catch (error) {\n    if (error instanceof NetworkError) {\n      console.error(`Network\
    \ error when fetching ${error.url}: ${error.message}`);\n    } else {\n      console.error('Unexpected\
    \ error:', error);\n    }\n  }\n}\n\nfetchData('https://api.example.com/data');\n\
    ```\n\nIn the above code, the `fetchData` function throws a `NetworkError` when\
    \ a network-related issue occurs. The `catch` block differentiates between `NetworkError`\
    \ and other error types, providing specific error handling for each case.\n\n\
    ### Propagating Errors\n\nIn some cases, it may be appropriate to propagate an\
    \ error to a higher-level function instead of handling it immediately. This allows\
    \ centralized error handling or logging.\n\n```typescript\nfunction fetchDataWithError()\
    \ {\n  throw new Error('Network error');\n}\n\nfunction getData() {\n  try {\n\
    \    fetchDataWithError();\n  } catch (error) {\n    console.error('Error fetching\
    \ data:', error);\n    throw error; // Propagate the error to the caller\n  }\n\
    }\n\ntry {\n  getData();\n} catch (error) {\n  console.error('Error in application:',\
    \ error);\n}\n```\n\nIn the above code, the `getData` function catches the error\
    \ from `fetchDataWithError` and logs it, but then rethrows the error to be handled\
    \ by a higher-level function. This approach allows for more flexible error management\
    \ strategies.\n\n### Summary\n\nIn conclusion, this chapter covered the essentials\
    \ of `TypeScript`'s runtime behavior and type checking, which improved our knowledge\
    \ of how to create efficient and reliable applications. The first part explored\
    \ the integration of `TypeScript` with current frameworks as well as the migration\
    \ of `JavaScript` applications to highlight `TypeScript`'s practical uses. The\
    \ chapter began with the integration of `TypeScript` into `Angular` applications,\
    \ where `TypeScript`'s static typing and interfaces interfaces aided component\
    \ and service development, resulting in better code organization and maintenance.\
    \ The method involved creating an `Angular` project with the `Angular CLI`, designing\
    \ `TypeScript`-based components, and managing services to efficiently encapsulate\
    \ business logic.\n\nThe chapter then went into detail about integrating `TypeScript`\
    \ with `React`, emphasizing how `TypeScript` improves `React` development by providing\
    \ improved type safety and tool support. It addressed how to create a `React`\
    \ project using `Create React App` and how to use `TypeScript` to define `props`,\
    \ `state`, and `hooks` in functional components. This integration demonstrated\
    \ `TypeScript`'s benefits for managing complicated user interfaces and ensuring\
    \ robust application behavior. The chapter also covered transitioning existing\
    \ `JavaScript` apps to `TypeScript` and provided a step-by-step roadmap to ensure\
    \ a smooth transition. This method included installing `TypeScript`, renaming\
    \ JavaScript files, adding type annotations, and addressing third-party libraries.\
    \ Troubleshooting recommendations were provided to address common migration issues,\
    \ such as type mismatches and missing type definitions.\n\nFinally, the chapter\
    \ taught testing `TypeScript` applications with the `Jest` framework. The use\
    \ of `Jest` for `TypeScript` projects was highlighted, as well as the creation\
    \ of unit and integration tests to ensure application functionality. Each function\
    \ was tested independently in unit tests, and the proper interaction between components\
    \ and services was verified via integration tests.\n"
