    Follow the below given steps to install and set up VS Code: Download Visual Studio
    Code Visit the Studio CodeClick on the “Download for Windows” button to download
    the installer.Run the downloaded installer.Follow the on-screen instructions to
    complete the installation process.Ensure that you select the option to add VS
    Code to your PATH during installation. This allows you to open VS Code from the
    command line.After installation, launch VS Code.You can also open VS Code from
    the command line by typing code . in the project directory.In VS Code, click on
    the Extensions icon in the sidebar (or pressSearch for “TypeScript” and install
    the “TypeScript and JavaScript Language Features” extension. Configure VS Code
    for TypeScript Development Open your TypeScript project in VS Code by navigating
    to File > Open Folder and selecting your project directory.VS Code provides built-in
