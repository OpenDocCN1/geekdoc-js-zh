    directly from VS Code, open the terminal in VS Code by navigating to View > Terminal
    or pressing Ctrl+ `.In the terminal, type tsc to compile the TypeScript code,
    and then type node dist/index.js to run the compiled JavaScript code. Enable Auto
    Compilation To enable auto-compilation of TypeScript files, you can use the watch
    mode.In the terminal, type tsc -w to start the TypeScript compiler in watch mode.
    This automatically recompiles TypeScript files whenever changes are detected.You
    can see the output in the terminal and directly run the updated JavaScript file
    without manually compiling each time. Once you''ve followed these steps, your
    Windows system will be fully configured for TypeScript development. You''ve got
    TypeScript and Node.js installed, the TypeScript compiler configured, and Visual
    Studio Code set up so that you can develop TypeScript efficiently.  Basic TypeScript
    Syntax Variables and Constants In TypeScript, similar to what in JavaScript, you
    declare variables using the let and const keywords. The let keyword allows you
    to declare mutable variables, whereas const is used for immutable variables, meaning
    their values cannot be reassigned once set. Declaring Variables with let  let
    message: string = "Hello, TypeScript!";  let count: number = 42;  let isAvailable:
    boolean = true; In the above code, message is a string variable, count is a number
    variable, and isAvailable is a boolean variable. The colon followed by a type
    : : is how TypeScript enforces type annotations. Declaring Constants with const  const
    pi: number = 3.14;  const welcomeMessage: string = "Welcome to TypeScript!"; Here,
    pi and welcomeMessage are constants. Their values cannot be changed once assigned.
    Using const ensures that the assigned values remain constant throughout the program. Data
    Types TypeScript offers a range of basic data types that are similar to those
    in JavaScript but with type annotations to ensure type safety. The commonly used
    data types include: Number All numbers are of type whether they are integers or
    floating-point values.  let age: number = 25;  let temperature: number = 98.6; String The
    string type is used for textual data.  let firstName: string = "John";  let lastName:
    string = "Doe"; Boolean The boolean type represents true or false values.  let
    isLoggedIn: boolean = false;  let hasPermission: boolean = true; Array Arrays
    can hold multiple values of a specific type. They can be declared in two ways.  let
    scores: number[] = [90, 85, 88];  let names: Array= ["Alice", "Bob", "Charlie"]; Tuple Tuples
    allow you to store an array with a fixed number of elements, where each element
    can have a different type.  let user: [number, string] = [1, "John Doe"]; Enum Enums
    provide a way to define a set of named constants.  enum Color { Red, Green, Blue
    }  let c: Color = Color.Green; Any The any type can hold any type of value and
    is used when the type of a variable is unknown during the development phase.  let
    randomValue: any = 10;  randomValue = "Hello";  randomValue = true; Void The void
    type is used to represent the absence of a value, commonly used in functions that
    do not return a value.  function logMessage(message: string): void {    console.log(message);  } Null
    and Undefined These types represent the absence of a value. By default, they are
    subtypes of all other types.  let u: undefined = undefined;  let n: null = null; Type
    Annotations Type annotations provide a way to explicitly specify the type of a
    variable, function parameter, or return value. This helps in catching errors early
    and makes the code more readable and maintainable. Following is the variable type
    annotation:  let userName: string = "Alice";  let userAge: number = 30;  let isAdmin:
    boolean = true; And, the function parameter and return type annotations appear
    like:  function greet(name: string): string {   return `Hello, ${name}!`;  } In
    this function, name is expected to be a string, and the function returns a string. Comparing
    TypeScript to JavaScript Syntax TypeScript is a superset of JavaScript, meaning
    all valid JavaScript code is also valid TypeScript code. However, TypeScript introduces
    type annotations and additional features that provide static typing and enhanced
    development experience. Variable Declarations In JavaScript:  let message = "Hello,
    JavaScript!"; Whereas, in TypeScript:  let message: string = "Hello, TypeScript!"; In
    the TypeScript example, : string is added to specify that the message must be
    a string. This type annotation helps catch errors during compilation rather than
    at runtime. Function Declarations In JavaScript:  function add(a, b) {   return
    a + b;  } Whereas, in TypeScript:  function add(a: number, b: number): number
    {   return a + b;  } In TypeScript, a and b are annotated as numbers, and the
    function is expected to return a number. This ensures that only numbers are passed
    to the function, preventing runtime errors. Array Declarations In JavaScript:  let
    scores = [90, 85, 88]; Whereas, in TypeScript:  let scores: number[] = [90, 85,
    88]; In TypeScript, : number[] specifies that scores is an array of numbers. This
    type annotation ensures that the array only contains numbers. Object Declarations In
    JavaScript:  let person = {   name: "John",   age: 30  }; Whereas, in TypeScript:  let
    person: { name: string; age: number } = {   name: "John",   age: 30  }; In TypeScript,
    { name: string; age: number } explicitly defines the structure of the person object,
    specifying that name must be a string and age must be a number. Function Parameter
    and Return Types In JavaScript, functions do not have type annotations for parameters
    or return values, which can lead to runtime errors if incorrect types are passed
    or returned. Whereas, in TypeScript, function parameters and return values are
    explicitly typed, providing clear expectations and reducing the risk of errors.
    For example:  function multiply(a: number, b: number): number {   return a * b;  } In
    this TypeScript function, a and b are required to be numbers, and the function
    returns a number. If non-number values are passed, TypeScript will generate a
    compile-time error. Tuples and Enums JavaScript does not have native support for
    tuples and enums, which can lead to less structured and harder-to-maintain code
    when dealing with fixed collections of values or sets of named constants. Whereas,
    TypeScript introduces tuples and enums to provide more structured and maintainable
    code. For example:  let user: [number, string] = [1, "John Doe"];  enum Status
    { Active, Inactive, Pending }  let currentStatus: Status = Status.Active; Tuples
    allow you to define a fixed array of values with specific types, while enums enable
    the creation of named constants, improving code readability and maintainability.  Type
    Annotations and Inference Explicit Type Annotations TypeScript allows you to explicitly
    specify the types of variables, function parameters, return values, and object
    properties. This is known as type annotation. Explicit type annotations help the
    TypeScript compiler understand the intended data types, reducing errors and improving
    code readability. Variable Type Annotations You can declare the type of a variable
    explicitly using a colon followed by the type.  let username: string = "Alice";  let
    userAge: number = 30;  let isLoggedIn: boolean = true; In the above code, username
    is explicitly declared as a userAge as a and isLoggedIn as a If you try to assign
    a value of a different type to these variables, the TypeScript compiler will generate
    an error. Function Parameter and Return Type Annotations You can also specify
    types for function parameters and return values.  function add(a: number, b: number):
    number {   return a + b;  } In this function, a and b are explicitly annotated
    as numbers, and the function returns a number. This ensures that only numbers
    can be passed to the function and that the function''s return value will always
    be a number. Object Type Annotations When working with objects, you can define
    the types of properties.  let person: { name: string; age: number; isAdmin: boolean
    } = {   name: "John",   age: 25,   isAdmin: false  }; Here, person is an object
    with three properties: and explicitly annotated as and respectively. Any attempt
    to assign a value of an incorrect type to these properties will result in a compilation
    error. Array Type Annotations Arrays can also be annotated to specify the type
    of elements they contain.  let scores: number[] = [85, 90, 78];  let names: string[]
    = ["Alice", "Bob", "Charlie"]; In these examples, scores is an array of numbers,
    and names is an array of strings. The annotations ensure that the arrays only
    contain elements of the specified types. Tuple Type Annotations Tuples allow you
    to define an array with a fixed number of elements, each with a specific type.  let
    user: [number, string] = [1, "John Doe"]; In the above code, user is a tuple with
    a number as the first element and a string as the second element. The annotation
    enforces this structure. Function Types You can define the types of functions
    using a combination of parameter and return type annotations.  let multiply: (x:
    number, y: number) => number = function(x: number, y: number): number {   return
    x * y;  }; In the above code, multiply is a function that takes two parameters
    and both of which are numbers, and returns a number. The type annotation ensures
    that the function adheres to this signature. Type Inference by Compiler TypeScript
    has a powerful type inference system that automatically determines the types of
    variables and expressions based on the values assigned to them. This can reduce
    the need for explicit type annotations and make the code more concise. Variable
    Type Inference When you declare a variable and initialize it with a value, TypeScript
    infers the type from the value.  let greeting = "Hello, TypeScript!";  let count
    = 42;  let isAvailable = true; In the above code, greeting is inferred to be a
    count is inferred to be a and isAvailable is inferred to be a TypeScript infers
    these types from the assigned values, so there''s no need for explicit type annotations. Function
    Return Type Inference TypeScript can also infer the return type of a function
    based on its return statements.  function sum(a: number, b: number) {   return
    a + b;  } In this function, TypeScript infers that the return type is number because
    the function returns the sum of two numbers. While explicit return type annotations
    can enhance code readability and maintainability, they are not always necessary
    due to TypeScript’s inference capabilities. Complex Type Inference TypeScript
    can infer types for more complex structures, such as objects and arrays.  let
    product = {   id: 1,   name: "Laptop",   price: 1000  }; In the above code, TypeScript
    infers that product is an object with properties id (number), name (string), and
    price (number). This inferred type helps ensure that all subsequent operations
    on the product adhere to this structure. Function Parameter Inference TypeScript
    can infer the types of function parameters in certain contexts, such as when a
    function is used as a callback.  let numbers = [1, 2, 3, 4];  numbers.forEach(number
    => {    console.log(number);  }); In the above code, TypeScript infers that number
    is a number because it knows the array numbers contain numbers. This inference
    makes the code more concise while maintaining type safety. Contextual Typing TypeScript
    uses the surrounding context to infer types. This is particularly useful in situations
    like event handlers and callbacks.  window.addEventListener("click", (event) =>
    {    console.log(event.button);  }); Here, TypeScript infers that the event is
    of type MouseEvent because the addEventListener method is known to handle DOM
    events, specifically mouse events in this case. This inference ensures that the
    event has the properties and methods associated with Combining Type Annotations
    and Inference You can combine explicit type annotations and inference for greater
    clarity and flexibility.  function displayUserInfo(name: string, age: number)
    {   let message = `User ${name} is ${age} years old.`;    console.log(message);  } In
    this function, the parameters name and age are explicitly annotated, but the variable
    message is inferred to be a string based on its initialization. This approach
    leverages the strengths of both explicit annotations and inference. Inferred Types
    in Arrays and Objects When dealing with arrays and objects, TypeScript infers
    the types of elements or properties based on the values assigned.  let colors
    = ["red", "green", "blue"];  let user = {   id: 1,   name: "Alice"  }; In these
    examples, colors is inferred to be an array of strings, and user is inferred to
    be an object with id as a number and name as a string. TypeScript’s type inference
    ensures that operations on these variables remain type-safe. Function Type Inference
    with Higher-Order Functions TypeScript can infer the types of parameters and return
    values in higher-order functions.  function createArray<t>(length:</t> number,
    value: T): T[] {   return Array(length).fill(value);  }  let stringArray = createArray(3,
    "hello");  let numberArray = createArray(3, 42); In the above code, TypeScript
    infers that stringArray is a string[] and numberArray is a number[] based on the
    arguments passed to The generic type T is inferred from the context, making the
    function versatile and type-safe.  Compiling TypeScript to JavaScript What is
    Compilation? Compilation is the process of translating source code written in
    a high-level programming language into a lower-level language, such as machine
    code or an intermediate language that can be executed by a computer. In the context
    of TypeScript, compilation refers to converting TypeScript code into JavaScript,
    the language that browsers and other JavaScript engines can understand and execute. TypeScript
    is a statically typed superset of JavaScript, which means it introduces additional
    syntax and features on top of standard JavaScript. However, web browsers and most
    JavaScript environments do not natively support TypeScript. Therefore, TypeScript
    code must be compiled into JavaScript before it can be run. The Compilation Process The
    TypeScript compilation process involves several steps: The TypeScript compiler
    (tsc) reads the TypeScript code and parses it into an abstract syntax tree (AST),
    which represents the structure of the code.Type The compiler checks the code for
    type errors based on the type annotations and type inference. It ensures that
    the types of variables, function parameters, return values, and object properties
    are consistent and correct.The TypeScript code is transpiled into JavaScript.
    During this step, the TypeScript-specific syntax is converted into standard JavaScript
    syntax.The compiler generates the final JavaScript output files from the transpiled
    code. These files can then be executed in any JavaScript environment. This process
    ensures that TypeScript code is type-safe and error-free before being transformed
    into JavaScript. ‘tsc’ Command The tsc (TypeScript Compiler) command is used to
    compile TypeScript code into JavaScript. It is a powerful tool that allows you
    to compile single files or entire projects with ease. To use the tsc command,
    you need to have TypeScript installed on your system. Now, to compile a single
    TypeScript file, use the following command:  tsc filename.ts This command compiles
    filename.ts into a corresponding JavaScript file, in the same directory. If you
    have multiple TypeScript files to compile, you can list them all in the command:  tsc
    file1.ts file2.ts file3.ts For larger projects, it''s more efficient to use a
    configuration file This file defines the project’s compilation settings and includes
    all the files to be compiled. To compile a project with a tsconfig.json file,
    simply run:  tsc This command reads the configuration from tsconfig.json and compiles
    the entire project according to the specified settings. Configuring tsconfig.json The
    tsconfig.json file is a configuration file that specifies the TypeScript compiler
    options and the files to be included in the project. It allows you to customize
    the compilation process and manage project settings in a centralized way. Creating
    tsconfig.json To create a tsconfig.json file, navigate to your project directory
    in the command line and run:  tsc --init This command generates a default tsconfig.json
    file with a basic configuration. Understanding tsconfig.json The tsconfig.json
    file contains several key sections: ●    This section defines the compiler options
    and settings. ●    Specifies the files or directories to be included in the compilation
    process. ●    Specifies the files or directories to be excluded from the compilation
    process. ●    Lists the specific files to be compiled. Configuring compilerOptions The
    compilerOptions section allows you to customize various aspects of the compilation
    process. Given below are some common options: Specifies the ECMAScript version
    to which the TypeScript code should be compiled. Examples include es5, es6, es2015,
    and esnext. Defines the module system for the compiled code. Examples include
    commonjs, es6, and amd. ●    Specifies the output directory for the compiled JavaScript
    files. ●    Defines the root directory of the TypeScript source files. ●    Enables
    strict type-checking options. ●    Generates source maps for easier debugging. Following
    is the sample tsconfig.json configuration:  {   "compilerOptions": {   "target":
    "es6",   "module": "commonjs",   "outDir": "./dist",   "rootDir": "./src",   "strict":
    true,   "sourceMap": true   },   "include": ["src/**/*.ts"],   "exclude": ["node_modules"]  } With
    the tsconfig.json file configured, you can compile your project by running the
    tsc command in the project directory: The compiled JavaScript files are output
    to the directory specified in the outDir option. Project Structure Given below
    is an example of a simple project structure:  my-typescript-project/  ├── src/  │  ├──
    index.ts  │  └── utils.ts  ├── dist/  └── tsconfig.json Here, in this project,
    the src directory contains the TypeScript source files, and the dist directory
    is the output directory for the compiled JavaScript files. The tsconfig.json file
    is located in the root of the project. Compiling the Project In the src/index.ts
    file, you might have the following TypeScript code:  import { greet } from "./utils";  const
    message: string = greet("TypeScript");  console.log(message); In the src/utils.ts
    file, you might have:  export function greet(name: string): string {   return
    `Hello, ${name}!`;  } By understanding the compilation process, using the tsc
    command, and configuring the tsconfig.json file, you can effectively manage and
    compile your TypeScript projects. This setup ensures that your TypeScript code
    is correctly transformed into JavaScript, ready to be executed in any JavaScript
    environment.  Summary Beginning with a brief outline of TypeScript''s background
    and development, this chapter dove headfirst into the language''s essentials.
    We learned about TypeScript''s key features and benefits, including improved code
    quality, a better developer experience, and early error detection. We also looked
    at a real-world example of Airbnb migrating from JavaScript to TypeScript, which
    demonstrated the tangible benefits of using TypeScript in a large-scale production
    environment. We then learned how to set up the TypeScript environment on a Windows
    system, which included installing Node.js and TypeScript, configuring the TypeScript
    compiler, and configuring Visual Studio Code to facilitate TypeScript development.
    We covered TypeScript''s basic syntax, which includes variables, constants, data
    types, and type annotations, as well as compared TypeScript syntax to JavaScript
    syntax to demonstrate the additional structure and type safety it provides. We
    then looked at type annotations and inference, including how to explicitly specify
    types for variables, function parameters, return values, and object properties,
    as well as how TypeScript''s powerful type inference system determines types based
    on assigned values. Finally, we looked at how to compile TypeScript to JavaScript,
    which included learning about the tsc command and configuring the tsconfig.json
    file to manage compilation settings and streamline development. In sum, this chapter
    established foundations for future chapters'' more advanced material and practical
    applications by providing a firm grasp of TypeScript and how to work with it. Chapter
    2: Working with Basic Types Chapter Overview Building strong and type-safe applications
    relies on a solid understanding of TypeScript''s core data types, which are the
    focus of this chapter. We begin by looking at the fundamental types: numbers,
    strings, and booleans. Understanding these basic types matters because they serve
    as the foundation for any TypeScript program, allowing you to effectively work
    with numerical data, textual information, and boolean logic. Next, we will look
    at arrays and tuples. Arrays allow you to store multiple values of the same type,
    whereas tuples can store a fixed number of elements of different types. Mastering
    these data structures will improve your ability to manage and use large amounts
    of data in your applications. We will look at how TypeScript''s type system outperforms
    JavaScript in terms of safety and structure. Following that, we will look at enum
    types, which allow you to define a set of named constants. Enums improve code
    readability and maintainability by assigning meaningful names to sets of related
    values. We will look at how to define and use enums, making your code more intuitive
    and manageable. Finally, we will learn more advanced types like any, unknown,
    void, null, and undefined. These types are useful in situations where greater
    flexibility is required or when the absence of a value must be represented. Understanding
    how to use these types properly allows you to handle a variety of edge cases while
    also ensuring that your TypeScript code is robust and versatile. This chapter
    aims to give you a thorough understanding of these fundamental types, allowing
    you to create more reliable and maintainable TypeScript applications.  Number,
    String, and Boolean Types From this chapter onwards, we will learn all the concepts
    of TypeScript through a live interactive project called "Anna''s TS Coaching"
    and will continue using it throughout our book in order to have a very effective
    and practical learning experience. In this section, we will start by incorporating
    fundamental TypeScript data types: number, string, and boolean. These types will
    help us manage numerical data, textual information, and boolean logic, which are
    essential for any application. Declaring Number Variables First, let’s declare
    some number variables to represent different numerical values in our project.
    Suppose Anna’s TS Coaching wants to track the number of students enrolled, the
    average score of students, and the maximum capacity of the coaching center. Creating
    the Project Directory Open your terminal and create a new directory for the project,
    then navigate into it:  mkdir annas-ts-coaching  cd annas-ts-coaching Initializing
    the Project Initialize the project by creating a tsconfig.json file:  tsc --init Creating
    Source Files Create a source directory and a TypeScript file:  mkdir src  cd src  touch
    index.ts Declaring Number Variables  Open index.ts in your preferred text editor
    and declare the number variables:// Number variables for Anna''s TS Coaching  let
    studentsEnrolled: number = 30;  let averageScore: number = 85.5;  let maxCapacity:
    number = 50;  console.log(`Students Enrolled: ${studentsEnrolled}`);  console.log(`Average
    Score: ${averageScore}`);  console.log(`Maximum Capacity: ${maxCapacity}`); In
    the above code, and maxCapacity are declared as numbers. We use console.log to
    print these values to the console. Compiling and Running the Code Compile the
    TypeScript code to JavaScript and run the compiled JavaScript file:  tsc  node
    dist/index.js Using Strings Next, we will work with string variables to manage
    textual information such as the names of courses and instructors. Declaring String
    Variables Add the following code to  // String variables for Anna''s TS Coaching  let
    courseName: string = "TypeScript Basics";  let instructorName: string = "Anna";  console.log(`Course
    Name: ${courseName}`);  console.log(`Instructor Name: ${instructorName}`); Here,
    courseName and instructorName are declared as strings, representing the name of
    the course and the instructor. Concatenating Strings You can concatenate strings
    using template literals:  let welcomeMessage: string = `Welcome to ${courseName}
    by ${instructorName}!`;  console.log(welcomeMessage); The template literals make
    it easy to include variables within strings. And, then compile and run the code
    to see the output. Constructing Boolean Logics and Conditions Boolean variables
    help manage true/false values and can be used to control the flow of your application
    using conditional statements. Declaring Boolean Variables Add the following boolean
    variables to  // Boolean variables for Anna''s TS Coaching  let isEnrollmentOpen:
    boolean = true;  let hasVacancies: boolean = studentsEnrolled < maxCapacity;  console.log(`Is
    Enrollment Open? ${isEnrollmentOpen}`);  console.log(`Has Vacancies? ${hasVacancies}`); In
    the above code, isEnrollmentOpen indicates if enrollment is open, and hasVacancies
    checks if the number of students enrolled is less than the maximum capacity. Using
    Boolean Logic in Conditions You can use boolean variables in conditional statements
    to control program flow:  // Conditional logic based on boolean variables  if
    (isEnrollmentOpen && hasVacancies) {   console.log("Students can enroll in the
    course.");  } else if (!hasVacancies) {   console.log("The course is full.");  }
    else {   console.log("Enrollment is currently closed.");  } This above code checks
    if enrollment is open and if there are vacancies, then prints appropriate messages.  Arrays
    and Tuples In this section, we will extend our project by exploring arrays and
    tuples, which are essential data structures for managing collections of data in
    TypeScript. Declaring and Initializing Arrays Arrays are used to store multiple
    values of the same type. We will start by declaring and initializing arrays to
    keep track of student names and their respective scores. Declaring Arrays Arrays
    can be declared using the Array generic type or the shorthand syntax with square
    brackets  // Using Array generic type  let studentNames: Array= ["Alice", "Bob",
    "Charlie"];  let studentScores: Array= [85, 92, 78];  // Using shorthand syntax  let
    courseTitles: string[] = ["TypeScript Basics", "Advanced TypeScript"];  let courseDurations:
    number[] = [10, 15]; Here, studentNames and courseTitles are arrays of strings,
    while studentScores and courseDurations are arrays of numbers. Initializing Arrays Arrays
    can be initialized with values directly or using the Array constructor.  let newStudentNames:
    string[] = [];  let newStudentScores: number[] = new Array(3);  // Adding values
    to the arrays  newStudentNames.push("Dave", "Eve");  newStudentScores[0] = 88;  newStudentScores[1]
    = 76;  newStudentScores[2] = 90;  console.log(newStudentNames);  console.log(newStudentScores); In
    the above code, newStudentNames is initialized as an empty array, and newStudentScores
    is initialized with a specified length. Using Tuples Tuples are a special type
    of array where the types of elements are known and can be different. Tuples are
    useful for representing structured data. Declaring Tuples We will declare tuples
    to store student information, such as their name and score.  let studentInfo:
    [string, number];  // Initializing the tuple  studentInfo = ["Alice", 85];  console.log(`Student
    Name: ${studentInfo[0]}`);  console.log(`Student Score: ${studentInfo[1]}`); In
    the above code, studentInfo is a tuple with a string (name) and a number (score). Using
    Tuple Types Tuples can also be used with more complex structures. For example,
    we can store multiple pieces of information for each course.  let courseDetails:
    [string, number, boolean];  // Initializing the tuple  courseDetails = ["TypeScript
    Basics", 10, true];  console.log(`Course Title: ${courseDetails[0]}`);  console.log(`Course
    Duration: ${courseDetails[1]} hours`);  console.log(`Course Active: ${courseDetails[2]}`); Here,
    courseDetails is a tuple with a string (course title), a number (duration in hours),
    and a boolean (whether the course is active). Nested Tuples Tuples can be nested
    to represent more complex data structures.  let nestedTuple: [number, [string,
    boolean]];  // Initializing the nested tuple  nestedTuple = [1, ["Introduction
    to TypeScript", true]];  console.log(`Course ID: ${nestedTuple[0]}`);  console.log(`Course
    Name: ${nestedTuple[1][0]}`);  console.log(`Course Active: ${nestedTuple[1][1]}`); In
    the above code, nestedTuple contains a number and another tuple. Array Methods
    and Operations TypeScript arrays come with several built-in methods that make
    it easy to manipulate and interact with the data. We will explore some common
    array methods and operations. Adding and Removing Elements Use push to add elements
    to the end of an array and pop to remove the last element.  let students: string[]
    = ["Alice", "Bob", "Charlie"];  // Adding elements  students.push("Dave");  console.log(students);
    // ["Alice", "Bob", "Charlie", "Dave"]  // Removing the last element  let lastStudent
    = students.pop();  console.log(students); // ["Alice", "Bob", "Charlie"]  console.log(`Removed
    Student: ${lastStudent}`); Finding Elements Use indexOf to find the index of an
    element and includes to check if an element exists in the array.  let scores:
    number[] = [85, 92, 78, 88, 76];  // Finding the index of an element  let index
    = scores.indexOf(88);  console.log(`Index of 88: ${index}`); // 3  // Checking
    if an element exists  let hasHighScore = scores.includes(92);  console.log(`Has
    High Score: ${hasHighScore}`); // true Iterating Over Arrays Use forEach to iterate
    over the elements of an array.  let courseTitles: string[] = ["TypeScript Basics",
    "Advanced TypeScript"];  // Iterating over the array  courseTitles.forEach((title,
    index) => {   console.log(`Course ${index + 1}: ${title}`);  }); Transforming
    Arrays Use map to transform the elements of an array.  let scores: number[] =
    [85, 92, 78, 88, 76];  // Transforming the array  let adjustedScores = scores.map(score
    => score + 5);  console.log(adjustedScores); // [90, 97, 83, 93, 81] Filtering
    Arrays Use filter to create a new array with elements that meet certain criteria.  let
    scores: number[] = [85, 92, 78, 88, 76];  // Filtering the array  let highScores
    = scores.filter(score => score >= 85);  console.log(highScores); // [85, 92, 88] Reducing
    Arrays Use reduce to reduce the array to a single value.  let scores: number[]
    = [85, 92, 78, 88, 76];  // Reducing the array  let totalScore = scores.reduce((total,
    score) => total + score, 0);  console.log(`Total Score: ${totalScore}`); // 419 Throughout
    this topic, we declared and initialized arrays to manage collections of data such
    as student names, grades, and course information. We experimented with different
    array methods and operations, such as adding and removing elements, finding elements,
    iterating over arrays, transforming arrays, filtering arrays, and reducing them.
    We also learned about tuples, which allow us to store structured data of various
    types.  Enum Types Enums, short for enumerations, are a feature that allows you
    to define a set of named constants. Enums make your code more readable and maintainable
    by providing meaningful names for sets of related values. Enums are a way of giving
    more friendly names to sets of numeric or string values. They are useful for representing
    a fixed set of related constants, such as days of the week, status codes, or categories.
    In TypeScript, enums can be numeric or string-based. Defining Enums We will define
    an enum to represent different levels of courses offered by Anna''s TS Coaching.
    We will define an enum called CourseLevel with three levels: Beginner, Intermediate,
    and Advanced. Defining Numeric Enums Numeric enums are the default in TypeScript.
    The enum members are assigned numeric values starting from 0\.  // Defining a
    numeric enum for course levels  enum CourseLevel {    Beginner,    Intermediate,  
     Advanced  }  // Using the enum  let courseLevel: CourseLevel = CourseLevel.Beginner;  console.log(`Course
    Level: ${CourseLevel[courseLevel]}`); // Output: Course Level: Beginner In the
    above code, CourseLevel is a numeric enum with members and The CourseLevel[courseLevel]
    syntax is used to get the name of the enum member. Defining String Enums String
    enums allow you to explicitly assign string values to the enum members.  // Defining
    a string enum for course levels  enum CourseLevel {   Beginner = "BEGINNER",  
    Intermediate = "INTERMEDIATE",   Advanced = "ADVANCED"  }  // Using the enum  let
    courseLevel: CourseLevel = CourseLevel.Beginner;  console.log(`Course Level: ${courseLevel}`);
    // Output: Course Level: BEGINNER In the above code, CourseLevel is a string enum
    with members assigned specific string values. The output directly shows the string
    value of the enum member. Enum Members and Values Enum members can be accessed
    using both their names and values. We will explore how to work with enum members
    and values in our ongoing project. Accessing Enum Members You can access enum
    members using the dot notation and retrieve their values.  // Accessing enum members  let
    beginnerLevel: CourseLevel = CourseLevel.Beginner;  let intermediateLevel: CourseLevel
    = CourseLevel.Intermediate;  let advancedLevel: CourseLevel = CourseLevel.Advanced;  console.log(beginnerLevel);
    // Output: BEGINNER  console.log(intermediateLevel); // Output: INTERMEDIATE  console.log(advancedLevel);
    // Output: ADVANCED The above code snippet demonstrates how to assign enum members
    to variables and print their values. Using Enums in Functions Enums can be used
    as function parameters to ensure that only valid enum values are passed.  // Function
    using enum as a parameter  function getCourseDetails(level: CourseLevel): void
    {   switch(level) {     case CourseLevel.Beginner:       console.log("Course Level:
    Beginner - Suitable for newcomers.");        break;     case CourseLevel.Intermediate:       console.log("Course
    Level: Intermediate - For those with basic knowledge.");        break;     case
    CourseLevel.Advanced:       console.log("Course Level: Advanced - For experienced
    learners.");        break;    }  }  // Calling the function with different enum
    values  getCourseDetails(CourseLevel.Beginner);  getCourseDetails(CourseLevel.Intermediate);  getCourseDetails(CourseLevel.Advanced); The
    above code snippet shows how to use enums in a function to control the flow based
    on the enum values. The switch statement checks the enum value and prints the
    corresponding message. Reverse Mapping of Numeric Enums Numeric enums support
    reverse mapping, which means you can get the name of an enum member using its
    value.  // Defining a numeric enum for days of the week  enum DaysOfWeek {    Sunday,  
     Monday,    Tuesday,    Wednesday,    Thursday,    Friday,    Saturday  }  //
    Accessing enum member by value  let day: DaysOfWeek = DaysOfWeek.Wednesday;  console.log(`Day:
    ${DaysOfWeek[day]}`); // Output: Day: Wednesday In the above code, DaysOfWeek
    is a numeric enum, and DaysOfWeek[day] retrieves the name of the enum member.
    Overall, this provided a strong understanding of enums and how these enums enhance
    the readability and maintainability of typescript codes.  Any, Unknown, and Void
    Types Now, we move to three important types in TypeScrip i.e. and These types
    are used in specific scenarios where type flexibility or the absence of a value
    is required. Understanding these types will help you handle various situations
    more effectively. ‘any’ Type The any type is a flexible type that allows you to
    assign any value to a variable. It bypasses TypeScript’s type-checking system,
    meaning any operations can be performed on it without raising compile-time errors.
    This type is useful when migrating JavaScript code to TypeScript or when you need
    a placeholder type.  let anyValue: any = 42;  anyValue = "Hello";  anyValue =
    true; In the above code, anyValue can hold values of different types: a number,
    a string, or a boolean. However, using the any type reduces the benefits of TypeScript''s
    type-checking, so it should be used sparingly. ‘unknown’ Type The unknown type
    is similar to but it is safer and more restrictive. It requires type-checking
    before performing operations on variables of this type. It is useful when the
    type of a variable is not known initially, and you want to perform type-checking
    at runtime.  let unknownValue: unknown = 42;  unknownValue = "Hello";  if (typeof
    unknownValue === "string") {   console.log(unknownValue.toUpperCase()); // Safe
    to use string methods  } In the above code, unknownValue can hold values of different
    types, but type-checking is required before using it as a specific type. ‘void’
    Type The void type represents the absence of a value and is commonly used in functions
    that do not return a value. It indicates that a function performs a side effect
    but does not return any data.  function logMessage(message: string): void {  
     console.log(message);  } In the above code, the logMessage function has a return
    type of indicating that it does not return any value. Sample Program We will incorporate
    these types into our project to understand their practical applications. Using
    ‘any'' Type Suppose we need a variable to temporarily store any type of data coming
    from various sources, such as user inputs or API responses, where the exact type
    is not known.  // Using the any type  let inputData: any;  inputData = "Alice";  console.log(`Name:
    ${inputData}`);  inputData = 25;  console.log(`Age: ${inputData}`);  inputData
    = { enrolled: true, course: "TypeScript Basics" };  console.log(`Enrollment Data:
    ${JSON.stringify(inputData)}`); In the above code, inputData can hold a string,
    a number, or an object. While any allows flexibility, it bypasses type safety,
    so use it with caution. Using ‘unknown’ Type To improve type safety, we can use
    the unknown type when handling data whose type is initially unknown but needs
    type-checking before use.  // Using the unknown type  let userResponse: unknown;  userResponse
    = "Accepted";  if (typeof userResponse === "string") {   console.log(`Response:
    ${userResponse.toUpperCase()}`);  }  userResponse = { accepted: true, date: "2024-08-01"
    };  if (typeof userResponse === "object" && userResponse !== null) {   console.log(`Response
    Data: ${JSON.stringify(userResponse)}`);  } In the above code, userResponse can
    hold different types, but type-checking ensures safe usage. Using ‘void’ Type In
    our project, we can use the void type for functions that perform actions but do
    not return values, such as logging or sending notifications.  // Using the void
    type  function notifyUser(message: string): void {   console.log(`Notification:
    ${message}`);  }  notifyUser("New course available: Advanced TypeScript"); In
    the above code, the notifyUser function has a void return type, indicating it
    performs an action without returning a value.  Null and Undefined Now, we will
    explore how to work with null and undefined values. These values represent the
    absence of data and are important concepts to understand for effective error handling
    and safe coding practices. We will also delve into type guards, optional chaining,
    and nullish coalescing to manage these values more efficiently in our project. Managing
    Null and Undefined Values In both JavaScript and TypeScript, null and undefined
    are used to represent missing or uninitialized values. ●    A variable that has
    been declared but not assigned a value. A variable explicitly assigned null indicates
    the intentional absence of any object value. We will see how these values can
    be used in our project.  // Declaring variables with null and undefined  let studentName:
    string | null = null;  let studentScore: number | undefined = undefined;  console.log(`Student
    Name: ${studentName}`); // Output: Student Name: null  console.log(`Student Score:
    ${studentScore}`); // Output: Student Score: undefined In the above code, studentName
    is explicitly set to and studentScore is set to The use of union types | null
    and number | allows these variables to accept multiple types. You can also assign
    values to variables that were initially null or  // Assigning values later  studentName
    = "Alice";  studentScore = 85;  console.log(`Student Name: ${studentName}`); //
    Output: Student Name: Alice  console.log(`Student Score: ${studentScore}`); //
    Output: Student Score: 85 Here, studentName and studentScore are updated with
    valid values after their initial declaration. Exploring Type Guards Type guards
    are a way to check the type of a variable before performing operations on it.
    They are particularly useful when dealing with null and undefined values. Using
    Type Guards Type guards can be implemented using and other checks.  // Function
    to print student details with type guards  function printStudentDetails(name:
    string | null, score: number | undefined): void {   if (name !== null) {     console.log(`Student
    Name: ${name}`);   } else {     console.log("Student Name is not available.");  
     }   if (typeof score === "number") {     console.log(`Student Score: ${score}`);  
    } else {     console.log("Student Score is not available.");    }  }  // Calling
    the function  printStudentDetails(studentName, studentScore); In the above code,
    type guards are used to safely check whether name and score are available before
    printing their values. Understanding Optional Chaining and Nullish Coalescing Optional
    chaining and nullish coalescing are powerful features that help you safely access
    properties and provide default values when dealing with null or Optional Chaining Optional
    chaining allows you to safely access nested properties of an object without throwing
    an error if a property is null or  // Example object  let course: { title?: string;
    duration?: number } = { title: "TypeScript Basics" };  // Using optional chaining  console.log(`Course
    Title: ${course?.title}`); // Output: Course Title: TypeScript Basics  console.log(`Course
    Duration: ${course?.duration}`); // Output: Course Duration: undefined In the
    above code, optional chaining is used to access title and duration properties
    of the course object. If a property is it simply returns undefined instead of
    throwing an error. Nullish Coalescing Nullish coalescing provides a way to set
    a default value when a variable is null or  // Using nullish coalescing  let courseDuration:
    number = course.duration ?? 10;  console.log(`Course Duration: ${courseDuration}`);
    // Output: Course Duration: 10 In the above code, courseDuration is set to the
    value of course.duration if it is not null or Otherwise, it defaults to Using
    Optional Chaining and Nullish Coalescing in Functions We will see how these features
    can be used in a function to handle optional properties.  // Function to get course
    details with optional chaining and nullish coalescing  function getCourseDetails(course:
    { title?: string; duration?: number }): void {   let title = course?.title ??
    "Untitled Course";   let duration = course?.duration ?? 0;   console.log(`Course
    Title: ${title}`);   console.log(`Course Duration: ${duration} hours`);  }  //
    Calling the function  getCourseDetails(course);  getCourseDetails({}); // Passing
    an empty object In this function, optional chaining is used to access the title
    and duration properties safely, and nullish coalescing provides default values
    when these properties are missing.  Summary This chapter covered the basics of
    TypeScript data types and structures, starting with strings, booleans, and numbers.
    We learned how to declare and initialize number variables to represent numerical
    data, as well as how to manage textual information by concatenating strings with
    template literals. Booleans were used to create logic and conditions, which allowed
    us to control program flow through conditional statements. We then looked at arrays
    and tuples, learning how arrays store collections of values of the same type,
    whereas tuples allow for fixed collections of different types. We learned various
    array methods, such as adding, removing, filtering, and transforming elements. The
    chapter also covered enum types, which use named constants to improve code readability
    and maintainability. We created numeric and string enums and used them to represent
    course levels in our project. Furthermore, we learned the any, unknown, and void
    types. The any type provided flexibility by bypassing type-checking, whereas the
    unknown type required type-checking for safe operation. The void type was used
    for functions that did not return a value, indicating that they performed an action
    instead. Finally, we looked at how to handle null and undefined values with union
    types and type guards to ensure safe operations. We looked at optional chaining
    and nullish coalescing, which are mechanisms for safely accessing nested properties
    and setting default values, respectively. These features helped to prevent runtime
    errors and improve the robustness of our project. This chapter provided us with
    the fundamental knowledge required to effectively work with TypeScript''s basic
    types, laying the groundwork for more complex concepts in subsequent chapters. Chapter
    3: Functions in TypeScript Chapter Overview In this chapter, we will look at TypeScript
    functions, which are an essential part of developing applications. Functions allow
    us to encapsulate logic, resulting in code that is reusable and modular. We start
    by looking at function types and signatures, which define the parameters and return
    types in our programs. This ensures type safety and consistency. Understanding
    function types will help us create precise and dependable functions for our project. Next,
    we will look at optional and default parameters, which help functions handle different
    input scenarios gracefully. Optional parameters enable arguments to be omitted,
    whereas default parameters provide fallback values. We will then look at rest
    parameters and overloads, which allow functions to handle an infinite number of
    arguments and provide multiple signatures for various input types, respectively.
    These features enable us to design functions that are flexible and versatile,
    meeting a wide range of needs. The chapter also teaches arrow functions and their
    impact on this context, which is a common source of confusion in JavaScript. Arrow
    functions have a more concise syntax and provide a consistent context, which can
    be especially useful in certain programming patterns. Finally, we will look at
    callback functions and higher-order functions, which let us pass functions as
    arguments and return them from other functions. These concepts are critical when
    working with asynchronous code and functional programming patterns. Throughout
    this chapter, we will apply these concepts to our project, enhancing its functionality
    and demonstrating the power and flexibility of TypeScript''s function capabilities.  Function
    Types and Signatures Functions can be categorized based on their declaration,
    signature, and return type. We will cover regular functions, function expressions,
    and arrow functions, and also learn about function signatures and call signatures
    and how they are used to ensure type safety in our code. Regular Functions Regular
    functions are similar to those in JavaScript, but with added type annotations
    for parameters and return values.  // Regular function to calculate student grades  function
    calculateGrade(score: number): string {   if (score >= 90) {     return "A";  
    } else if (score >= 80) {     return "B";   } else if (score >= 70) {     return
    "C";   } else if (score >= 60) {     return "D";   } else {     return "F";  
     }  }  // Using the regular function  const studentScore = 85;  const studentGrade
    = calculateGrade(studentScore);  console.log(`Student Score: ${studentScore},
    Grade: ${studentGrade}`); In the above code, calculateGrade is a regular function
    that takes a number as a parameter and returns a The function evaluates the score
    and assigns a grade based on the provided logic. Function Expressions Function
    expressions allow functions to be assigned to variables. This makes them more
    flexible as they can be used as first-class citizens.  // Function expression
    to greet a student  const greetStudent = function(name: string): string {   return
    `Hello, ${name}! Welcome to Anna''s TS Coaching.`;  };  // Using the function
    expression  const greetingMessage = greetStudent("Alice");  console.log(greetingMessage); In
    the above code, greetStudent is a function expression assigned to a constant variable.
    It takes a string as a parameter and returns a greeting message. Arrow Functions Arrow
    functions provide a concise syntax for writing functions and automatically bind
    this context.  // Arrow function to calculate course duration in weeks  const
    calculateCourseDuration = (hoursPerDay: number, totalHours: number): number =>
    {   return Math.ceil(totalHours / (hoursPerDay * 5)); // Assuming 5 days a week  };  //
    Using the arrow function  const courseDuration = calculateCourseDuration(2, 40);  console.log(`Course
    Duration: ${courseDuration} weeks`); In the above code, calculateCourseDuration
    is an arrow function that calculates the course duration in weeks based on the
    number of hours per day and the total course hours. Function Signatures and Call
    Signatures Function signatures, also known as call signatures, define the structure
    of a function by specifying the types of its parameters and return value. They
    allow TypeScript to enforce type-checking and ensure that functions are called
    with the correct arguments. Understanding Function Signatures Function signatures
    provide a way to define the expected input and output of a function, helping to
    maintain type safety. A function signature specifies the number of parameters,
    their types, and the return type of the function.  // Function signature for a
    calculation function  type CalculationFunction = (a: number, b: number) => number;  //
    Implementing a function using the signature  const add: CalculationFunction =
    (a, b) => a + b;  const subtract: CalculationFunction = (a, b) => a - b;  // Using
    the functions  console.log(`Add: ${add(5, 3)}`); // Output: Add: 8  console.log(`Subtract:
    ${subtract(5, 3)}`); // Output: Subtract: 2 In the above code, CalculationFunction
    is a function signature that defines a function taking two number parameters and
    returning a The add and subtract functions are implemented using this signature,
    ensuring type safety. We will see how function signatures can be used in our project
    to define operations such as calculating scores and providing feedback.  // Function
    signature for score calculation  type ScoreCalculator = (scores: number[]) =>
    number;  // Implementing a function using the signature  const averageScore: ScoreCalculator
    = (scores) => {   const total = scores.reduce((sum, score) => sum + score, 0);  
    return total / scores.length;  };  // Using the function  const scores = [85,
    90, 78, 92];  const avgScore = averageScore(scores);  console.log(`Average Score:
    ${avgScore}`); // Output: Average Score: 86.25 In the above code, ScoreCalculator
    is a function signature that defines a function taking an array of number and
    returning a The averageScore function calculates the average score of the students. Call
    Signatures in Object Types Call signatures can also be used within object types
    to define methods for an object.  // Defining an object with a call signature  type
    CourseDetails = {   title: string;   calculateDuration: (hoursPerDay: number,
    totalHours: number) => number;  };  // Implementing the object  const course:
    CourseDetails = {   title: "Advanced TypeScript",   calculateDuration: (hoursPerDay,
    totalHours) => Math.ceil(totalHours / (hoursPerDay * 5))  };  // Using the method  const
    duration = course.calculateDuration(2, 60);  console.log(`Course: ${course.title},
    Duration: ${duration} weeks`); In the above code, CourseDetails is an object type
    with a call signature for the calculateDuration method. The course object implements
    this method, allowing us to calculate the duration of the course based on the
    specified parameters.  Optional and Default Parameters Optional Parameters Optional
    parameters are parameters that may or may not be provided when calling a function.
    In TypeScript, optional parameters are defined by adding a question mark after
    the parameter name in the function signature. This indicates that the parameter
    is optional and can be omitted when the function is invoked. We will define a
    function in our project that calculates the total score of a student, optionally
    including bonus points if they exist.  // Function to calculate total score with
    optional bonus  function calculateTotalScore(score: number, bonus?: number): number
    {   // If bonus is provided, add it to the score, otherwise return the score  
    return score + (bonus || 0);  }  // Using the function with and without bonus
    points  const totalScore1 = calculateTotalScore(85);  const totalScore2 = calculateTotalScore(85,
    10);  console.log(`Total Score without Bonus: ${totalScore1}`); // Output: Total
    Score without Bonus: 85  console.log(`Total Score with Bonus: ${totalScore2}`);
    // Output: Total Score with Bonus: 95 In the above code, the calculateTotalScore
    function has an optional parameter If bonus is not provided, it defaults to The
    function is called twice, once with a bonus and once without, demonstrating how
    optional parameters can be omitted. Default Parameter Values Default parameter
    values allow functions to use a default value for a parameter if no argument is
    provided for it. This simplifies function calls and reduces the need for additional
    logic to handle missing parameters. We will update the previous function to use
    a default value for the bonus parameter.  // Function to calculate total score
    with default bonus value  function calculateTotalScoreWithDefault(score: number,
    bonus: number = 5): number {   // Add bonus to the score, using default value
    if bonus is not provided   return score + bonus;  }  // Using the function with
    and without specifying bonus points  const totalScore3 = calculateTotalScoreWithDefault(85);  const
    totalScore4 = calculateTotalScoreWithDefault(85, 10);  console.log(`Total Score
    with Default Bonus: ${totalScore3}`); // Output: Total Score with Default Bonus:
    90  console.log(`Total Score with Custom Bonus: ${totalScore4}`); // Output: Total
    Score with Custom Bonus: 95 In the above code, the calculateTotalScoreWithDefault
    function has a default value of 5 for the bonus parameter. If no bonus is provided,
    the default value is used. This behavior simplifies function usage and ensures
    a consistent default value is applied. Multiple Default Parameters Functions can
    have multiple default parameters, allowing for more complex default behavior.  //
    Function to generate a course description  function generateCourseDescription(  
    courseName: string,   instructor: string = "Anna",   duration: number = 4  ):
    string {   return `${courseName} by ${instructor}, Duration: ${duration} weeks.`;  }  //
    Using the function with different combinations of parameters  const description1
    = generateCourseDescription("TypeScript Basics");  const description2 = generateCourseDescription("Advanced
    TypeScript", "John", 6);  console.log(description1); // Output: TypeScript Basics
    by Anna, Duration: 4 weeks.  console.log(description2); // Output: Advanced TypeScript
    by John, Duration: 6 weeks. Here, generateCourseDescription provides default values
    for instructor and The function can be called with varying numbers of arguments,
    showcasing the flexibility of default parameters. Rest Parameters and Variadic
    Functions Rest parameters allow functions to accept an indefinite number of arguments
    as an array. This is particularly useful for creating variadic functions, which
    can operate on a variable number of inputs. We will define a function that calculates
    the average score of students using rest parameters.  // Function to calculate
    the average score of students  function calculateAverageScore(...scores: number[]):
    number {   const total = scores.reduce((sum, score) => sum + score, 0);   return
    scores.length ? total / scores.length : 0;  }  // Using the function with different
    numbers of scores  const average1 = calculateAverageScore(85, 90, 78);  const
    average2 = calculateAverageScore(88, 76);  console.log(`Average Score 1: ${average1}`);
    // Output: Average Score 1: 84.33333333333333  console.log(`Average Score 2: ${average2}`);
    // Output: Average Score 2: 82 In the above code, calculateAverageScore uses rest
    parameters to accept multiple score inputs. The function calculates the average
    of the provided scores, demonstrating how rest parameters enable functions to
    handle variable-length input arrays. Creating Variadic Functions Variadic functions
    use rest parameters to perform operations on a variable number of inputs. We will
    implement a function that calculates the total enrollment in multiple courses.  //
    Function to calculate total enrollment using rest parameters  function calculateTotalEnrollment(...enrollments:
    number[]): number {   return enrollments.reduce((sum, enrollment) => sum + enrollment,
    0);  }  // Using the function with different course enrollments  const totalEnrollment1
    = calculateTotalEnrollment(30, 25, 40);  const totalEnrollment2 = calculateTotalEnrollment(20,
    15, 35, 45);  console.log(`Total Enrollment 1: ${totalEnrollment1}`); // Output:
    Total Enrollment 1: 95  console.log(`Total Enrollment 2: ${totalEnrollment2}`);
    // Output: Total Enrollment 2: 115 In the above code, calculateTotalEnrollment
    is a variadic function that calculates the total number of students enrolled in
    multiple courses. The function uses rest parameters to accept multiple enrollment
    numbers, illustrating how variadic functions operate on flexible input sizes. Combining
    Rest Parameters with Other Parameters Rest parameters can be combined with other
    parameters, but they must be the last parameter in the function signature.  //
    Function to create a student report with additional comments  function createStudentReport(studentName:
    string, ...comments: string[]): string {   return `Student: ${studentName}\nComments:
    ${comments.join(", ")}`;  }  // Using the function with different comments  const
    report1 = createStudentReport("Alice", "Excellent performance", "Needs improvement
    in math");  const report2 = createStudentReport("Bob", "Outstanding attendance");  console.log(report1);  console.log(report2); In
    the above code, createStudentReport accepts a student name and an arbitrary number
    of comments as rest parameters. The function generates a report string, demonstrating
    how rest parameters work alongside other parameters.  Function Overloads In TypeScript,
    function overloading allows you to define multiple function signatures for the
    same function name. This means you can create a single function that can handle
    different types and numbers of arguments, providing flexibility and readability
    when dealing with varying input scenarios. What is an Overloaded Function? An
    overloaded function is a function that has multiple type signatures but a single
    implementation. Each signature describes a different way to call the function,
    specifying the types and numbers of parameters and the return type. The implementation
    of the function decides what to do based on the provided arguments. The primary
    purpose of function overloading is to enable a function to perform different tasks
    based on the arguments passed to it. By defining multiple signatures, you can
    ensure type safety while allowing the function to handle a variety of inputs. Function
    overloads are particularly useful in scenarios where: You need a function to handle
    various input types and perform different operations based on those types.The
    function needs to support different numbers of parameters, each requiring different
    processing logic.Depending on the input, the function may need to return different
    types of values.Overloads improve code readability by providing clear and specific
    signatures for different use cases.When working with external libraries or APIs
    that have overloaded functions, implementing similar overloads can ensure seamless
    integration. Sample Program We will implement a practical example in our project
    where function overloads are useful. Consider a scenario where we want to create
    a function that retrieves student information from different sources, such as
    a student ID or a student name. Depending on the input type (number or string),
    the function will return different information. Defining Function Overloads We
    will define overloads for a getStudentInfo function, specifying different signatures
    for different input types.  // Function overload signatures for getStudentInfo  function
    getStudentInfo(id: number): { id: number; name: string; score: number };  function
    getStudentInfo(name: string): { id: number; name: string; score: number }[];  //
    Implementing the function  function getStudentInfo(param: number | string): {
    id: number; name: string; score: number } | { id: number; name: string; score:
    number }[] {   // Mock student data   const students = [     { id: 1, name: "Alice",
    score: 85 },     { id: 2, name: "Bob", score: 90 },     { id: 3, name: "Charlie",
    score: 78 }    ];   // Check the type of the parameter and return appropriate
    data   if (typeof param === "number") {   return students.find(student => student.id
    === param) || { id: 0, name: "Not Found", score: 0 };   } else {     return students.filter(student
    => student.name.toLowerCase().includes(param.toLowerCase()));    }  } In the above
    code, the getStudentInfo function has two overload signatures: One that takes
    a number as an argument and returns a single student object. Another that takes
    a string as an argument and returns an array of student objects that match the
    name. Using the Overloaded Function We can call the getStudentInfo function with
    either an ID or a name to retrieve the corresponding student information.  //
    Retrieving student information by ID  const studentById = getStudentInfo(1);  console.log("Student
    by ID:", studentById);  // Retrieving student information by name  const studentsByName
    = getStudentInfo("b");  console.log("Students by Name:", studentsByName); Here,
    the function is called twice: once with a student ID and once with a name The
    output will show different results based on the input type. Function Overloads
    with Multiple Parameters We will extend the example by adding another overload
    that allows retrieving students based on a combination of ID and minimum score.  //
    Additional overload signature for getStudentInfo  function getStudentInfo(id:
    number, minScore: number): { id: number; name: string; score: number };  // Extending
    the implementation  function getStudentInfo(param: number | string, minScore?:
    number): { id: number; name: string; score: number } | { id: number; name: string;
    score: number }[] {   // Mock student data   const students = [     { id: 1, name:
    "Alice", score: 85 },     { id: 2, name: "Bob", score: 90 },     { id: 3, name:
    "Charlie", score: 78 }    ];   // Check if minScore is provided for the ID overload  
    if (typeof param === "number" && minScore !== undefined) {   return students.find(student
    => student.id === param && student.score >= minScore) || { id: 0, name: "Not Found",
    score: 0 };    }   // Check the type of the parameter and return appropriate data  
    if (typeof param === "number") {   return students.find(student => student.id
    === param) || { id: 0, name: "Not Found", score: 0 };   } else {     return students.filter(student
    => student.name.toLowerCase().includes(param.toLowerCase()));    }  }  // Using
    the additional overload  const studentByIdAndScore = getStudentInfo(1, 80);  console.log("Student
    by ID and Score:", studentByIdAndScore); In this extended example, we added another
    overload signature that takes both an ID and a minimum score as arguments. The
    implementation checks if the minimum score is provided and returns the student
    only if the conditions are met.  Arrow, Callback and Higher-Order Functions Arrow
    Functions Arrow functions are a more concise way to write functions in JavaScript
    and TypeScript. They use a simplified syntax that makes the code easier to read
    and understand. Arrow functions also have a unique feature: they don''t have their
    own this context. Instead, they inherit this from the surrounding code, which
    can be particularly useful in certain scenarios. Syntax of Arrow Functions Arrow
    functions use the => syntax and can omit the function keyword. Given below is
    the basic syntax:  // Arrow function syntax  const add = (a: number, b: number):
    number => {   return a + b;  }; The above code snippet defines an arrow function
    add that takes two parameters a and b and returns their sum. The parentheses around
    the parameters are optional if there is only one parameter. Using Arrow Functions We
    will use arrow functions to simplify some operations in our project.  // Array
    of student scores  const studentScores = [85, 90, 78, 92, 88];  // Using arrow
    function to calculate the average score  const calculateAverage = (scores: number[]):
    number => {   const total = scores.reduce((sum, score) => sum + score, 0);   return
    scores.length ? total / scores.length : 0;  };  // Calculating average score using
    the arrow function  const averageScore = calculateAverage(studentScores);  console.log(`Average
    Score: ${averageScore}`); // Output: Average Score: 86.6 In the above code, we
    use an arrow function calculateAverage to compute the average score of students.
    The arrow function provides a concise way to express the calculation logic. Arrow
    Functions vs. Regular Functions Arrow functions differ from regular functions
    in several ways, particularly in how they handle the this context.  // Regular
    function with its own this context  const instructor = {   name: "Anna",   courses:
    ["TypeScript Basics", "Advanced TypeScript"],   listCourses: function () {     this.courses.forEach(function
    (course) {       console.log(`${this.name} teaches ${course}`); // this.name is
    undefined      });    }  };  // Calling the method  instructor.listCourses();
    // Error: Cannot read property ''name'' of undefined  // Fixing the error with
    an arrow function  const instructorFixed = {   name: "Anna",   courses: ["TypeScript
    Basics", "Advanced TypeScript"],   listCourses: function () {     this.courses.forEach((course)
    => {       console.log(`${this.name} teaches ${course}`); // this.name is "Anna"      });  
     }  };  // Calling the method  instructorFixed.listCourses(); // Output: Anna
    teaches TypeScript Basics, Anna teaches Advanced TypeScript In the first example,
    the regular function inside forEach creates its own this context, causing this.name
    to be By using an arrow function, which doesn''t have its own we can correctly
    reference this.name from the outer function. Callback Functions Callback functions
    are functions passed as arguments to other functions. They allow code to be executed
    after a specific task is completed. Callbacks are often used in asynchronous programming
    and event handling. Defining and Using Callback Functions We will use callback
    functions to handle student enrollment in a course, where we want to execute a
    specific action after enrollment is complete.  // Function to enroll a student
    with a callback  function enrollStudent(student: string, callback: (message: string)
    => void): void {   // Simulate enrollment process   console.log(`Enrolling student:
    ${student}`);   setTimeout(() => {     // Enrollment complete, execute callback     callback(`Student
    ${student} has been successfully enrolled.`);   }, 2000); // Simulated delay  }  //
    Callback function to display a message  const displayMessage = (message: string):
    void => {    console.log(message);  };  // Enrolling a student and using the callback  enrollStudent("Alice",
    displayMessage); In the above code, the enrollStudent function takes a student
    name and a callback function as parameters. The callback function is executed
    after a simulated enrollment process, demonstrating how callbacks work in asynchronous
    operations. Handling Multiple Callbacks We can also pass multiple callback functions
    to handle different stages of a process.  // Function to enroll a student with
    multiple callbacks  function enrollStudentWithCallbacks(   student: string,  
    onSuccess: (message: string) => void,   onError: (error: string) => void  ): void
    {   // Simulate enrollment process   console.log(`Enrolling student: ${student}`);  
    setTimeout(() => {     // Simulate a condition for success or error     const
    isSuccess = Math.random() > 0.5;     if (isSuccess) {       onSuccess(`Student
    ${student} has been successfully enrolled.`);     } else {       onError(`Failed
    to enroll student ${student}. Please try again.`);      }   }, 2000); // Simulated
    delay  }  // Callback functions for success and error  const onSuccess = (message:
    string): void => {    console.log(message);  };  const onError = (error: string):
    void => {    console.error(error);  };  // Enrolling a student with callbacks  enrollStudentWithCallbacks("Bob",
    onSuccess, onError); In the above code, we define enrollStudentWithCallbacks with
    separate callbacks for success and error handling. The function randomly determines
    whether the enrollment is successful and calls the appropriate callback. Higher-Order
    Functions Higher-order functions are functions that can take other functions as
    arguments or return functions as their result. They are a key feature of functional
    programming and are commonly used for tasks like event handling, composition,
    and iteration. Using Higher-Order Functions We will create a higher-order function
    in our project to apply a discount to student scores based on a condition.  //
    Higher-order function to apply a discount  function applyDiscount(   scores: number[],  
    discountFunction: (score: number) => number  ): number[] {   return scores.map(discountFunction);  }  //
    Discount function to reduce score by 10%  const discount10Percent = (score: number):
    number => score * 0.9;  // Using the higher-order function to apply the discount  const
    originalScores = [85, 90, 78, 92];  const discountedScores = applyDiscount(originalScores,
    discount10Percent);  console.log("Original Scores:", originalScores);  console.log("Discounted
    Scores:", discountedScores); In the above code, applyDiscount is a higher-order
    function that takes an array of scores and a discountFunction as arguments. The
    discountFunction is applied to each score using the map method, demonstrating
    how higher-order functions can operate on data using other functions. Returning
    Functions from Higher-Order Functions Higher-order functions can also return functions,
    enabling more dynamic behavior.  // Higher-order function to create a multiplier  function
    createMultiplier(multiplier: number): (value: number) => number {   return (value:
    number) => value * multiplier;  }  // Creating multiplier functions  const double
    = createMultiplier(2);  const triple = createMultiplier(3);  // Using the multiplier
    functions  console.log("Double of 5:", double(5)); // Output: Double of 5: 10  console.log("Triple
    of 5:", triple(5)); // Output: Triple of 5: 15 In the above code, createMultiplier
    is a higher-order function that returns a function to multiply a value by a specified
    multiplier. The returned functions, double and demonstrate how higher-order functions
    can create reusable logic.  Summary To quickly summarize, we started with function
    types and signatures, learning how to define and use different function declarations,
    including regular functions, function expressions, and arrow functions. Function
    signatures were highlighted as a way to ensure type safety by specifying parameters
    and return types. We then delved into optional and default parameters, which allow
    functions to handle varying input scenarios. Optional parameters enable arguments
    to be omitted, while default parameters provide fallback values when no argument
    is supplied. Rest parameters were introduced to support variadic functions, which
    can accept a variable number of arguments, enhancing the adaptability of functions. Function
    overloading was also explored into detail, demonstrating how a single function
    can have multiple signatures, each handling different types and numbers of arguments.
    This feature was applied in our project, allowing the getStudentInfo function
    to retrieve student data based on different criteria. The chapter also covered
    arrow functions, emphasizing their concise syntax and unique handling of this
    context. We contrasted arrow functions with regular functions, illustrating how
    arrow functions can simplify code and maintain the desired context in callbacks. Lastly,
    we explored callback and higher-order functions. Callbacks were used for asynchronous
    operations, enabling functions to be passed as arguments and executed upon task
    completion. Higher-order functions were demonstrated as functions that take or
    return other functions, showcasing their utility in creating flexible and reusable
    code. These concepts provided a comprehensive understanding of TypeScript functions,
    equipping us with the skills to write robust and efficient code in our ongoing
    project. Chapter 4: Complex Types and Union Types Chapter Overview We will look
    at union types and complex types in this chapter, which enable more accurate and
    flexible data modeling. We will start by looking at union and intersection types,
    which allow you to define variables with multiple types or combine multiple types
    into one. These ideas are critical for developing adaptable and robust code that
    can handle a variety of data structures in our "Anna''s TS Coaching" project. Next,
    we will look at type guards and type assertions, which improve type safety by
    allowing you to narrow down types at runtime and explicitly inform the TypeScript
    compiler about a variable''s expected type. These techniques will help you write
    more dependable and error-free code, especially when dealing with complex data
    structures. We will also look at literal types and type aliases, which allow you
    to define specific values and reusable custom types in your code, making it more
    expressive and maintainable. We will also go over nullable types and optional
    properties, which will show you how to deal with values that are missing or undefined.
    Understanding how to work with nullable types and optional properties ensures
    that your code can handle missing data without throwing runtime errors. Finally,
    we will look at advanced object types like mapped types and conditional types,
    which allow you to perform sophisticated type transformations and model complex
    data relationships. This chapter will provide you with a better understanding
    of TypeScript''s type system and its ability to manage complex data types effectively.  Union
    and Intersection Types In TypeScript, union and intersection types allow you to
    create more flexible and powerful type definitions. They enable you to define
    variables and structures that can hold different kinds of data, making your code
    adaptable to various scenarios. We will explore these types in detail and see
    how they can be applied in our project. Union Types Union types allow a variable
    to hold more than one type. They are defined using the pipe symbol, which represents
    a logical "or." A union type is useful when a value can be one of several types,
    providing flexibility while maintaining type safety. Defining Union Types Suppose
    we want to store either a string or a number in a variable to represent a student''s
    ID, which could be a numeric ID or a custom alphanumeric code.  // Defining a
    union type for student ID  type StudentID = number | string;  // Example usage
    of union type  let studentId1: StudentID = 12345; // Numeric ID  let studentId2:
    StudentID = "A1234"; // Alphanumeric ID  console.log(`Student ID 1: ${studentId1}`);  console.log(`Student
    ID 2: ${studentId2}`); In the above code, StudentID is a union type that can hold
    either a number or a The variables studentId1 and studentId2 demonstrate how union
    types enable the use of multiple types for a single variable. Union Types We will
    use union types in a function that calculates tuition fees for a student, depending
    on whether the student has a discount code (string) or a fixed discount amount
    (number).  // Function to calculate tuition fee with union type  function calculateTuitionFee(baseFee:
    number, discount: number | string): number {   if (typeof discount === "number")
    {     // Subtract the discount amount from the base fee     return baseFee - discount;  
    } else if (typeof discount === "string") {     // Check for specific discount
    codes     if (discount === "HALFPRICE") {       return baseFee / 2; // 50% discount     }
    else if (discount === "FREESHIP") {       return baseFee - 20; // $20 off for
    shipping      }    }   return baseFee; // No discount applied  }  // Using the
    function with different discounts  const baseFee = 100;  const feeWithAmountDiscount
    = calculateTuitionFee(baseFee, 15); // Using number  const feeWithCodeDiscount
    = calculateTuitionFee(baseFee, "HALFPRICE"); // Using string  console.log(`Fee
    with Amount Discount: $${feeWithAmountDiscount}`); // Output: Fee with Amount
    Discount: $85  console.log(`Fee with Code Discount: $${feeWithCodeDiscount}`);
    // Output: Fee with Code Discount: $50 In this function, calculateTuitionFee uses
    a union type for the discount parameter, allowing it to handle both numeric and
    string discounts. The function checks the type of discount at runtime and applies
    the appropriate logic. Intersection Types Intersection types allow you to combine
    multiple types into a single type. They are defined using the ampersand symbol,
    representing a logical "and." An intersection type requires that a variable satisfy
    all the combined types, making it useful for merging interfaces or type definitions. Defining
    Intersection Types We will define an intersection type to represent a student
    who is both enrolled in a course and has a profile.  // Defining interfaces for
    enrollment and profile  interface Enrollment {   courseId: number;   status: string;  }  interface
    Profile {   name: string;   age: number;  }  // Intersection type combining enrollment
    and profile  type EnrolledStudent = Enrollment & Profile;  // Example usage of
    intersection type  const student: EnrolledStudent = {   courseId: 101,   status:
    "active",   name: "Alice",   age: 20  };  console.log(`Student Name: ${student.name}`);  console.log(`Course
    ID: ${student.courseId}`);  console.log(`Enrollment Status: ${student.status}`); In
    the above code, EnrolledStudent is an intersection type combining the Enrollment
    and Profile interfaces. The student variable must satisfy both interfaces, ensuring
    that it contains all the necessary properties. Intersection Types We will use
    intersection types in a function that updates both the enrollment and profile
    information of a student.  // Function to update student information using intersection
    type  function updateStudentInfo(student: EnrolledStudent, newInfo: Partial<enrolledstudent>):</enrolledstudent>
    EnrolledStudent {   return { ...student, ...newInfo };  }  // Updating student
    information  const updatedStudent = updateStudentInfo(student, { status: "inactive",
    age: 21 });  console.log(`Updated Student Status: ${updatedStudent.status}`);  console.log(`Updated
    Student Age: ${updatedStudent.age}`); In this function, updateStudentInfo uses
    the EnrolledStudent intersection type to update a student''s information. The
    function accepts an EnrolledStudent object and a Partialobject, allowing selective
    updates to the student''s information while maintaining type safety. Sample Program Suppose
    we want to manage course information, including both online and in-person courses.
    Online courses have a URL, while in-person courses have a location. We will use
    union and intersection types to represent this data structure.  // Defining interfaces
    for online and in-person courses  interface OnlineCourse {   title: string;  
    url: string;  }  interface InPersonCourse {   title: string;   location: string;  }  //
    Union type for course  type Course = OnlineCourse | InPersonCourse;  // Function
    to display course details  function displayCourseDetails(course: Course): void
    {   console.log(`Course Title: ${course.title}`);   if ("url" in course) {     console.log(`Course
    URL: ${course.url}`);   } else if ("location" in course) {     console.log(`Course
    Location: ${course.location}`);    }  }  // Using the function with different
    course types  const onlineCourse: Course = { title: "TypeScript Basics", url:
    "https://example.com/ts-basics" };  const inPersonCourse: Course = { title: "Advanced
    TypeScript", location: "Room 101" };  displayCourseDetails(onlineCourse); // Output:
    Course Title: TypeScript Basics, Course URL: https://example.com/ts-basics  displayCourseDetails(inPersonCourse);
    // Output: Course Title: Advanced TypeScript, Course Location: Room 101 In the
    above code, the Course type is a union of OnlineCourse and allowing us to represent
    courses that can be either online or in-person. The displayCourseDetails function
    uses type narrowing to determine the type of course and display the appropriate
    details.  Type Guards and Type Assertions Type Guards Type guards are techniques
    used to determine the specific type of a variable at runtime. They help ensure
    that operations are performed on the correct type, improving type safety and preventing
    runtime errors. Type guards are particularly useful when working with union types,
    as they allow you to narrow down the type of a variable and access its properties
    safely. Type guards are usually implemented using conditional checks, such as
    or custom type predicates. ‘typeof’ for Type Guards The typeof operator checks
    the type of a variable, making it useful for distinguishing between primitive
    types like string, number, and boolean.  // Function to handle different input
    types using typeof  function processInput(input: number | string) {   if (typeof
    input === "number") {     console.log(`The number is ${input.toFixed(2)}`);  
    } else if (typeof input === "string") {     console.log(`The string length is
    ${input.length}`);    }  }  // Using the function with different types  processInput(42);
    // Output: The number is 42.00  processInput("Hello"); // Output: The string length
    is 5 In the above code, processInput uses typeof to check the type of input and
    perform operations specific to each type. ‘instanceof’ for Type Guards The instanceof
    operator checks if an object is an instance of a particular class, making it useful
    for distinguishing between class instances.  // Classes for OnlineCourse and InPersonCourse  class
    OnlineCourse {   constructor(public title: string, public url: string) {}  }  class
    InPersonCourse {   constructor(public title: string, public location: string)
    {}  }  // Function to display course details using instanceof  function displayCourse(course:
    OnlineCourse | InPersonCourse) {   console.log(`Course Title: ${course.title}`);  
    if (course instanceof OnlineCourse) {     console.log(`Course URL: ${course.url}`);  
    } else if (course instanceof InPersonCourse) {     console.log(`Course Location:
    ${course.location}`);    }  }  // Using the function with different course types  const
    onlineCourse = new OnlineCourse("TypeScript Basics", "https://example.com/ts-basics");  const
    inPersonCourse = new InPersonCourse("Advanced TypeScript", "Room 101");  displayCourse(onlineCourse);
    // Output: Course Title: TypeScript Basics, Course URL: https://example.com/ts-basics  displayCourse(inPersonCourse);
    // Output: Course Title: Advanced TypeScript, Course Location: Room 101 In the
    above code, displayCourse uses instanceof to determine the type of course and
    display the appropriate details. Custom Type Predicates Custom type predicates
    allow you to define more complex type guards by creating functions that return
    a boolean and use the is keyword to narrow the type.  // Interface for a course
    with a URL  interface HasUrl {   url: string;  }  // Type predicate to check if
    an object has a URL  function hasUrl(course: any): course is HasUrl {   return
    (course as HasUrl).url !== undefined;  }  // Function to display course details
    using a custom type guard  function displayCourseDetails(course: OnlineCourse
    | InPersonCourse) {   console.log(`Course Title: ${course.title}`);   if (hasUrl(course))
    {     console.log(`Course URL: ${course.url}`);   } else {     console.log(`Course
    Location: ${course.location}`);    }  }  // Using the function with different
    course types  displayCourseDetails(onlineCourse);  displayCourseDetails(inPersonCourse); In
    the above code, hasUrl is a custom type predicate that checks if an object has
    a url property. The displayCourseDetails function uses this predicate to determine
    the course type. Type Assertions Type assertions are a way to explicitly tell
    the TypeScript compiler about the type of a variable, allowing you to override
    the inferred type. They are useful when you know more about the type of a variable
    than the compiler does, but should be used cautiously to avoid runtime errors. Type
    assertions are helpful when: ●    You need to narrow a type when the compiler
    cannot. You''re working with data from external sources where the type is known
    but not easily inferred. You need to access properties of a variable that are
    known but not recognized by the compiler. Type assertions do not perform any runtime
    checks; they only affect the compile-time type checking. Type Assertions Syntax Type
    assertions can be written in two ways: ●    Using the as keyword:  let someValue:
    any = "This is a string";  let strLength: number = (someValue as string).length;  console.log(strLength);
    // Output: 16 Using angle bracket syntax (not recommended in JSX):  let someValue:
    any = "This is a string";  let strLength: number = (<string>someValue).length;</string>  console.log(strLength);
    // Output: 16 In both examples, someValue is asserted as a allowing access to
    string-specific properties and methods. Type Assertion Implementation We will
    implement type assertions in a situation, where we have data coming from an external
    API and need to assert the types.  // Example data from an API  const apiData:
    any = {   id: 1,   name: "Alice",   courses: ["TypeScript Basics", "Advanced TypeScript"]  };  //
    Defining an interface for the expected data structure  interface StudentData {  
    id: number;   name: string;   courses: string[];  }  // Using type assertion to
    assert the type of apiData  const studentData = apiData as StudentData;  // Accessing
    properties of the asserted type  console.log(`Student ID: ${studentData.id}`);  console.log(`Student
    Name: ${studentData.name}`);  console.log(`Courses: ${studentData.courses.join(",
    ")}`); In the above code, we assert apiData as StudentData using the as keyword,
    allowing us to safely access the properties of the data structure. Type Assertions
    for DOM Manipulation Type assertions are also commonly used when working with
    the DOM to access element-specific properties.  // Accessing an HTML element and
    asserting its type  const inputElement = document.getElementById("myInput") as
    HTMLInputElement;  // Accessing the value property of the input element  inputElement.value
    = "Hello, TypeScript!";  console.log(inputElement.value); // Output: Hello, TypeScript! In
    the above code, we use a type assertion to specify that inputElement is an allowing
    access to the value property.  Literal Types and Type Aliases In TypeScript, literal
    types and type aliases allow you to create more precise and readable type definitions,
    improving code clarity and safety. Literal types restrict a variable to a specific
    value or set of values, while type aliases allow you to define custom types for
    complex structures. We will explore both concepts and apply them in our project. Literal
    Types Literal types are specific types that represent exact values, rather than
    just types like string or They can be string, number, or boolean literals. By
    using literal types, you can restrict variables to specific values, enhancing
    type safety and enabling the compiler to catch errors at compile time. Defining
    Literal Types Suppose we want to define specific statuses for student enrollment:
    "active," "inactive," or "graduated." We can use string literal types to achieve
    this.  // Defining string literal types for student status  type StudentStatus
    = "active" | "inactive" | "graduated";  // Using literal types in a function  function
    getStudentStatus(status: StudentStatus): string {   switch (status) {     case
    "active":       return "The student is currently enrolled.";     case "inactive":       return
    "The student is not enrolled at the moment.";     case "graduated":       return
    "The student has graduated.";      default:       return "Unknown status.";  
     }  }  // Example usage of the function with literal types  console.log(getStudentStatus("active"));
    // Output: The student is currently enrolled.  console.log(getStudentStatus("graduated"));
    // Output: The student has graduated. In the above code, StudentStatus is a string
    literal type that restricts the status parameter to specific values. The getStudentStatus
    function can only accept these defined values, ensuring type safety. Literal Types
    in Conditional Logic Literal types can also be used to represent numeric values
    or specific conditions.  // Defining numeric literal types for grading  type Grade
    = 1 | 2 | 3 | 4 | 5;  // Function to get feedback based on grade  function getFeedback(grade:
    Grade): string {   switch (grade) {     case 1:       return "Excellent work!";     case
    2:       return "Great job!";     case 3:       return "Good effort.";     case
    4:       return "Needs improvement.";     case 5:       return "Unsatisfactory.";      default:       return
    "Invalid grade.";    }  }  // Example usage of the function with numeric literal
    types  console.log(getFeedback(1)); // Output: Excellent work!  console.log(getFeedback(3));
    // Output: Good effort. In the above code, Grade is a numeric literal type representing
    possible grade values. The getFeedback function provides feedback based on the
    specific grade, ensuring that only valid grades are processed. Type Aliases Type
    aliases allow you to create custom type definitions, providing a more readable
    and maintainable way to define complex types. Type aliases are especially useful
    when you have repetitive type definitions or need to represent intricate data
    structures. Creating Type Aliases We will define type aliases for student and
    course structures in our project to simplify type definitions.  // Defining a
    type alias for student  type Student = {   id: number;   name: string;   status:
    StudentStatus;   courses: string[];  };  // Defining a type alias for course  type
    Course = {   id: number;   title: string;   duration: number; // Duration in weeks  };  //
    Function to enroll a student in a course  function enrollStudentInCourse(student:
    Student, course: Course): void {   console.log(`Enrolling ${student.name} in the
    course: ${course.title}`);    student.courses.push(course.title);  }  // Example
    usage of type aliases  const student1: Student = {   id: 1,   name: "Alice",  
    status: "active",   courses: []  };  const course1: Course = {   id: 101,   title:
    "TypeScript Basics",   duration: 4  };  enrollStudentInCourse(student1, course1);  console.log(`${student1.name}
    is enrolled in: ${student1.courses.join(", ")}`); // Output: Alice is enrolled
    in: TypeScript Basics In the above code, Student and Course are type aliases representing
    the structure of a student and a course. The enrollStudentInCourse function uses
    these aliases to ensure that the correct data structure is passed as arguments,
    making the code more readable and maintainable. Type Aliases for Unions and Intersections Type
    aliases can also be used to define unions and intersections, simplifying complex
    type definitions.  // Defining a union type alias for payment methods  type PaymentMethod
    = "credit" | "debit" | "paypal";  // Defining an intersection type alias for a
    course with payment options  type PaidCourse = Course & {   price: number;   paymentMethod:
    PaymentMethod;  };  // Function to purchase a course  function purchaseCourse(student:
    Student, course: PaidCourse): void {   console.log(`${student.name} is purchasing
    the course: ${course.title} for $${course.price} using ${course.paymentMethod}`);  }  //
    Example usage of type aliases with unions and intersections  const paidCourse:
    PaidCourse = {   id: 102,   title: "Advanced TypeScript",   duration: 6,   price:
    100,   paymentMethod: "credit"  };  purchaseCourse(student1, paidCourse); In the
    above code, PaymentMethod is a union type alias representing accepted payment
    methods, and PaidCourse is an intersection type alias combining Course and additional
    properties. The purchaseCourse function uses these aliases to handle course purchases,
    demonstrating how type aliases can simplify complex types. Sample Program Suppose
    we want to manage course enrollment and provide feedback based on student performance.
    We will use literal types and type aliases to structure the data and operations.  //
    Defining literal types for feedback levels  type FeedbackLevel = "excellent" |
    "good" | "average" | "poor";  // Defining a type alias for feedback  type Feedback
    = {   studentId: number;   courseId: number;   level: FeedbackLevel;   comments:
    string;  };  // Function to give feedback  function giveFeedback(feedback: Feedback):
    void {   console.log(`Feedback for Student ID: ${feedback.studentId}, Course ID:
    ${feedback.courseId}`);   console.log(`Level: ${feedback.level}`);   console.log(`Comments:
    ${feedback.comments}`);  }  // Example usage of feedback with literal types and
    type aliases  const feedback1: Feedback = {   studentId: 1,   courseId: 101,  
    level: "excellent",   comments: "Outstanding performance in all assignments and
    exams."  };  giveFeedback(feedback1); In the above code, FeedbackLevel is a string
    literal type representing feedback levels, and Feedback is a type alias for feedback
    data. The giveFeedback function uses these definitions to handle feedback, illustrating
    how literal types and type aliases improve type safety and code organization.  Nullable
    Types and Optional Properties In TypeScript, nullable types and optional properties
    allow you to work with data that may be absent or undefined. This feature is particularly
    useful when dealing with dynamic data structures or incomplete data. In this,
    we will explore how to define and use nullable types and optional properties,
    and how optional chaining can make accessing nested properties safer and more
    concise. We will apply these concepts to our project. Nullable Types Nullable
    types are types that can be either a specific type or null or They are useful
    when a variable or property might not have a value initially or under certain
    conditions. Defining Nullable Types In TypeScript, you can define nullable types
    by using the union type syntax with null and  // Defining nullable types for student
    feedback  type NullableFeedback = string | null | undefined;  // Function to provide
    feedback with nullable types  function provideFeedback(feedback: NullableFeedback):
    string {   if (feedback === null) {     return "No feedback provided.";   } else
    if (feedback === undefined) {     return "Feedback is pending.";   } else {     return
    `Feedback: ${feedback}`;    }  }  // Example usage of nullable types  console.log(provideFeedback("Great
    job!")); // Output: Feedback: Great job!  console.log(provideFeedback(null));
    // Output: No feedback provided.  console.log(provideFeedback(undefined)); //
    Output: Feedback is pending. In the above code, NullableFeedback is a type alias
    that allows a or The provideFeedback function handles each case appropriately,
    demonstrating how nullable types can manage missing or pending data. Applying
    Nullable Types Now, let''s apply nullable types in our project by allowing a student''s
    feedback and enrollment status to be nullable.  // Updated Student type with nullable
    feedback and status  type Student = {   id: number;   name: string;   status:
    StudentStatus | null; // Nullable status   courses: string[];   feedback: NullableFeedback;
    // Nullable feedback  };  // Function to update student status  function updateStudentStatus(student:
    Student, newStatus: StudentStatus | null): void {   student.status = newStatus;  
    console.log(`Student ${student.name}''s status updated to: ${newStatus ?? "Unknown"}`);  }  //
    Example usage  const student1: Student = {   id: 1,   name: "Alice",   status:
    null, // Initially unknown   courses: ["TypeScript Basics"],   feedback: "Excellent
    progress!"  };  updateStudentStatus(student1, "active");  updateStudentStatus(student1,
    null); // Setting status to unknown In the above code, the Student type now includes
    nullable properties for status and The updateStudentStatus function updates a
    student''s status and handles null as an unknown status. Optional Properties Optional
    properties are properties that may or may not be present in an object. They are
    useful when working with data structures that might have missing or optional fields. Defining
    Optional Properties Optional properties are defined by adding a question mark
    after the property name in the type definition.  // Defining a Course type with
    optional properties  type Course = {   id: number;   title: string;   duration:
    number; // Duration in weeks   description?: string; // Optional description  };  //
    Function to display course information  function displayCourseInfo(course: Course):
    void {   console.log(`Course Title: ${course.title}`);   console.log(`Duration:
    ${course.duration} weeks`);   if (course.description) {     console.log(`Description:
    ${course.description}`);   } else {     console.log("No description available.");  
     }  }  // Example usage of optional properties  const course1: Course = {   id:
    101,   title: "TypeScript Basics",   duration: 4  };  const course2: Course =
    {   id: 102,   title: "Advanced TypeScript",   duration: 6,   description: "An
    in-depth look into TypeScript''s advanced features."  };  displayCourseInfo(course1);
    // Output: No description available.  displayCourseInfo(course2); // Output: Description:
    An in-depth look into TypeScript''s advanced features. In the above code, the
    Course type includes an optional description property. The displayCourseInfo function
    checks for the presence of the description property and handles it accordingly. Using
    Optional Properties We will use optional properties in our project by allowing
    some courses to have optional prerequisites.  // Updated Course type with optional
    prerequisites  type Course = {   id: number;   title: string;   duration: number;  
    prerequisites?: string[]; // Optional prerequisites  };  // Function to display
    course details with prerequisites  function displayCourseDetails(course: Course):
    void {   console.log(`Course Title: ${course.title}`);   console.log(`Duration:
    ${course.duration} weeks`);   if (course.prerequisites) {     console.log(`Prerequisites:
    ${course.prerequisites.join(", ")}`);   } else {     console.log("No prerequisites
    required.");    }  }  // Example usage with optional prerequisites  const course3:
    Course = {   id: 103,   title: "Mastering TypeScript",   duration: 8,   prerequisites:
    ["TypeScript Basics", "Advanced TypeScript"]  };  displayCourseDetails(course1);
    // Output: No prerequisites required.  displayCourseDetails(course3); // Output:
    Prerequisites: TypeScript Basics, Advanced TypeScript In the above code, the Course
    type includes optional The displayCourseDetails function checks if the prerequisites
    property is present and displays it if available. Optional Chaining Optional chaining
    is a feature that allows you to safely access nested properties of an object without
    having to check each level for null or It uses the ?. operator to short-circuit
    and return undefined if a property is not present. Using Optional Chaining We
    will use optional chaining to safely access nested properties in our project.  //
    Function to get a student''s first course title using optional chaining  function
    getFirstCourseTitle(student: Student): string {   return student.courses?.[0]
    ?? "No courses enrolled.";  }  // Example usage with optional chaining  const
    student2: Student = {   id: 2,   name: "Bob",   status: "active",   courses: [],
    // No courses enrolled   feedback: undefined  };  console.log(getFirstCourseTitle(student1));
    // Output: TypeScript Basics  console.log(getFirstCourseTitle(student2)); // Output:
    No courses enrolled. In the above code, getFirstCourseTitle uses optional chaining
    to access the first course title in a student''s courses array. If the array is
    empty or it returns a default message. Optional Chaining with Nested Objects Optional
    chaining can also be used with nested objects to access deep properties safely.  //
    Nested type alias for Student with Address  type Address = {   street: string;  
    city: string;   country: string;  };  type StudentWithAddress = Student & {  
    address?: Address; // Optional address  };  // Function to get the student''s
    city using optional chaining  function getStudentCity(student: StudentWithAddress):
    string {   return student.address?.city ?? "City not available.";  }  // Example
    usage with nested optional chaining  const studentWithAddress: StudentWithAddress
    = {    ...student1,   address: { street: "123 Main St", city: "Springfield", country:
    "USA" }  };  console.log(getStudentCity(studentWithAddress)); // Output: Springfield  console.log(getStudentCity(student2));
    // Output: City not available. In the above code, getStudentCity uses optional
    chaining to access the city property of a student''s address object. If the address
    or city is missing, it returns a default message. Sample Program We will apply
    nullable types, optional properties, and optional chaining in our project to manage
    course and student information more effectively.  // Updated Student type with
    nullable feedback and status  type Student = {   id: number;   name: string;  
    status: StudentStatus | null;   courses: string[];   feedback: NullableFeedback;  };  //
    Updated Course type with optional description and prerequisites  type Course =
    {   id: number;   title: string;   duration: number;   description?: string;  
    prerequisites?: string[];  };  // Function to get detailed student information
    using optional chaining  function getStudentInfo(student: Student): void {   console.log(`Student
    Name: ${student.name}`);   console.log(`Status: ${student.status ?? "Unknown"}`);  
    console.log(`Enrolled Courses: ${student.courses.join(", ")}`);   console.log(`Feedback:
    ${student.feedback ?? "No feedback"}`);  }  // Function to display complete course
    details  function displayFullCourseDetails(course: Course): void {   console.log(`Course
    Title: ${course.title}`);   console.log(`Duration: ${course.duration} weeks`);  
    console.log(`Description: ${course.description ?? "No description available."}`);  
    console.log(`Prerequisites: ${course.prerequisites?.join(", ") ?? "None"}`);  }  //
    Example usage of the functions  const student3: Student = {   id: 3,   name: "Charlie",  
    status: "inactive",   courses: ["Advanced TypeScript"],   feedback: null  };  const
    course4: Course = {   id: 104,   title: "TypeScript Masterclass",   duration:
    12  };  getStudentInfo(student3); // Output includes no feedback  displayFullCourseDetails(course4);
    // Output includes no description and no prerequisites In the above code, we use
    nullable types, optional properties, and optional chaining to handle course and
    student data that may be incomplete or missing. This approach ensures that the
    application can gracefully handle situations where data is not available without
    causing runtime errors.  Advanced Object Types Here, we will explore advanced
    object types in TypeScript, focusing on index signatures and recursive types.
    These features allow you to define more dynamic and complex data structures, providing
    flexibility when working with objects whose properties may not be known in advance
    or whose structure may be nested. Index Signatures Index signatures allow you
    to define the shape of objects with dynamic properties. They are used when the
    properties of an object are not known beforehand, or when you want to enforce
    a specific type for all property values. Defining Index Signatures An index signature
    defines a type for the keys and values of an object. The syntax uses square brackets
    with a type annotation for the key and value.  // Defining an index signature
    for a collection of courses  type CourseCollection = {   [key: string]: string;
    // Key is a string, and value is a string  };  // Example usage of index signature  const
    courses: CourseCollection = {   "101": "TypeScript Basics",   "102": "Advanced
    TypeScript",   "103": "TypeScript Masterclass"  };  console.log(`Course 101: ${courses["101"]}`);
    // Output: Course 101: TypeScript Basics  console.log(`Course 102: ${courses["102"]}`);
    // Output: Course 102: Advanced TypeScript In the above code, CourseCollection
    is an index signature that allows any string key with a string value. The courses
    object uses this signature to store course titles with numeric keys represented
    as strings. Implementing Index Signatures We will apply index signatures in our
    project to manage a collection of student scores.  // Defining an index signature
    for student scores  type StudentScores = {   [studentId: number]: number; // Key
    is a number (student ID), and value is a number (score)  };  // Function to calculate
    the average score  function calculateAverageScore(scores: StudentScores): number
    {   const total = Object.values(scores).reduce((sum, score) => sum + score, 0);  
    return total / Object.keys(scores).length;  }  // Example usage with index signatures  const
    scores: StudentScores = {   1: 85,   2: 92,   3: 78,   4: 88  };  console.log(`Average
    Score: ${calculateAverageScore(scores)}`); // Output: Average Score: 85.75 In
    the above code, StudentScores is an index signature where keys are student IDs
    and values are their scores. The calculateAverageScore function computes the average
    score using the index signature, allowing dynamic access to student scores. Recursive
    Types Recursive types are types that refer to themselves in their own definition.
    They are useful for representing data structures that have a recursive or nested
    nature, such as trees, linked lists, or nested objects. Defining Recursive Types Recursive
    types are defined by referencing the type within its definition. We will consider
    a recursive type for a nested category structure.  // Defining a recursive type
    for categories  type Category = {   name: string;   subcategories?: Category[];
    // Recursive reference to Category  };  // Example usage of recursive types  const
    categoryTree: Category = {   name: "Programming",   subcategories: [      {       name:
    "Web Development",       subcategories: [         { name: "Frontend" },         {
    name: "Backend" }        ]      },     { name: "Data Science" }    ]  };  console.log(categoryTree); In
    the above code, Category is a recursive type with a name and optional which is
    an array of Category objects. The categoryTree demonstrates a nested category
    structure using the recursive type. Implementing Recursive Types We will use recursive
    types in our project to represent a curriculum with nested modules.  // Defining
    a recursive type for a curriculum module  type Module = {   title: string;   duration:
    number; // Duration in hours   submodules?: Module[]; // Recursive reference to
    Module  };  // Function to calculate the total duration of a curriculum  function
    calculateTotalDuration(module: Module): number {   let total = module.duration;  
    if (module.submodules) {     for (const submodule of module.submodules) {       total
    += calculateTotalDuration(submodule);      }    }   return total;  }  // Example
    usage of recursive types in a curriculum  const curriculum: Module = {   title:
    "TypeScript Mastery",   duration: 5,   submodules: [      {       title: "Basics",       duration:
    3,       submodules: [         { title: "Introduction", duration: 1 },         {
    title: "Types", duration: 2 }        ]      },      {       title: "Advanced Concepts",       duration:
    4,       submodules: [         { title: "Generics", duration: 2 },         { title:
    "Decorators", duration: 2 }        ]      }    ]  };  console.log(`Total Curriculum
    Duration: ${calculateTotalDuration(curriculum)} hours`); // Output: Total Curriculum
    Duration: 17 hours In the above code, Module is a recursive type representing
    a curriculum module with a and optional The calculateTotalDuration function computes
    the total duration of a curriculum by recursively traversing the module structure. Sample
    Program We will integrate index signatures and recursive types into our project
    to manage dynamic student data and course structures.  // Index signature for
    dynamic student records  type StudentRecord = {   [studentId: number]: {     name:
    string;     score: number;    };  };  // Function to display student records  function
    displayStudentRecords(records: StudentRecord): void {   for (const id in records)
    {     const student = records[id];     console.log(`Student ID: ${id}, Name: ${student.name},
    Score: ${student.score}`);    }  }  // Example usage of index signatures for student
    records  const studentRecords: StudentRecord = {   1: { name: "Alice", score:
    85 },   2: { name: "Bob", score: 92 },   3: { name: "Charlie", score: 78 }  };  displayStudentRecords(studentRecords);  //
    Recursive type for course content  type CourseContent = {   title: string;   lessons:
    number;   subcontent?: CourseContent[]; // Recursive reference to CourseContent  };  //
    Function to count total lessons in a course  function countTotalLessons(content:
    CourseContent): number {   let total = content.lessons;   if (content.subcontent)
    {     for (const sub of content.subcontent) {       total += countTotalLessons(sub);      }  
     }   return total;  }  // Example usage of recursive types for course content  const
    courseContent: CourseContent = {   title: "TypeScript Advanced Course",   lessons:
    5,   subcontent: [      {       title: "Generics",       lessons: 3,       subcontent:
    [         { title: "Introduction to Generics", lessons: 1 },         { title:
    "Generic Functions", lessons: 2 }        ]      },      {       title: "Modules",       lessons:
    4      }    ]  };  console.log(`Total Lessons in Course: ${countTotalLessons(courseContent)}`);
    // Output: Total Lessons in Course: 12 In this project application, index signatures
    and recursive types are used to manage dynamic student records and nested course
    content, providing a flexible and robust way to handle complex data structures.  Summary Overall,
    this chapter looked at complex types and their applications, with a focus on improving
    code flexibility and robustness. We started by looking at union and intersection
    types, which allowed variables to hold multiple types or combine them into one.
    This allowed for greater adaptability in dealing with different data structures
    as well as more precise type definitions. In our project, we used these concepts
    to manage student and course data. Next, we looked at type guards and type assertions,
    which provided tools for ensuring type safety during runtime. Type guards allowed
    us to refine types through runtime checks, whereas type assertions allowed us
    to explicitly specify a variable''s type, improving type accuracy in situations
    where the compiler may not infer the correct type. These techniques were essential
    in dealing with dynamic and complex data structures. We then looked at literal
    types and type aliases, which improve type safety and code clarity by specifying
    specific values and reusable custom types. Literal types limited variables to
    exact values, whereas type aliases allowed for the concise definition of complex
    types. These features were implemented in our project to improve course and student
    data management. We also looked at nullable types and optional properties, which
    helped us deal with missing or incomplete data gracefully. Nullable types allowed
    variables to be null or undefined, while optional properties allowed the definition
    of fields that were not always present in objects. We used these concepts to effectively
    manage course and student data while ensuring robust error handling. Finally,
    we explored the advanced object types like index signatures and recursive types.
    Index signatures made it easier to work with objects that had dynamic properties,
    whereas recursive types represented nested data structures. These advanced types
    provided greater flexibility in managing complex data, strengthening our project
    in its entirety. Chapter 5: Classes and Interfaces Chapter Overview Classes and
    interfaces are TypeScript''s major object-oriented features, which will be covered
    in detail in this chapter. This chapter will help you understand how to structure
    and organize code efficiently, making it more modular and reusable. We begin by
    learning how to define and use classes, which are the fundamental building blocks
    for creating objects. Classes enable us to encapsulate data and functionality,
    thereby providing a blueprint for creating objects with specific properties and
    functions. Next, we will look at class inheritance and modifiers, which allow
    us to reuse code and create hierarchical class structures. Inheritance allows
    one class to inherit the properties and methods of another, making it easier to
    extend and modify existing classes. We will also go over access modifiers like
    public, private, and protected, which control the visibility and accessibility
    of class members while ensuring encapsulation and security. We will then learn
    interfaces, which define contracts for classes by specifying the properties and
    methods that a class must implement. Interfaces ensure consistency across implementations,
    allowing for flexible and interchangeable code. And finally, we will also learn
    how to extend interfaces to create more complex type definitions, which will allow
    us to combine multiple interfaces into a single cohesive structure.  Working with
    Classes Classes are a fundamental part of object-oriented programming in TypeScript.
    They provide a blueprint for creating objects with specific properties and methods,
    allowing you to encapsulate and organize your code effectively. In this section,
    we will learn to create classes, define class constructors and methods, and use
    access modifiers like and protected to control visibility and accessibility. Creating
    Classes In TypeScript, classes are defined using the class keyword. A class can
    have properties and methods, which define the behavior of the objects created
    from the class. We will create a simple class in our project to represent a course.  //
    Defining a Course class  class Course {   title: string;   duration: number; //
    Duration in weeks   // Method to display course details   displayCourseInfo()
    {     console.log(`Course Title: ${this.title}`);     console.log(`Duration: ${this.duration}
    weeks`);    }  }  // Creating an instance of the Course class  const course1 =
    new Course();  course1.title = "TypeScript Basics";  course1.duration = 4;  //
    Displaying course information  course1.displayCourseInfo();  // Output:  // Course
    Title: TypeScript Basics  // Duration: 4 weeks In the above code, we define a
    Course class with two properties: title and The displayCourseInfo method prints
    the course details. We then create an instance of the Course class and set its
    properties before calling the method. Defining Class Constructors and Methods A
    constructor is a special method used to initialize objects created from a class.
    It allows you to set initial values for properties when an object is instantiated. Using
    Constructors We will add a constructor to the Course class to initialize its properties.  //
    Defining a Course class with a constructor  class Course {   title: string;  
    duration: number; // Duration in weeks   // Constructor to initialize properties  
    constructor(title: string, duration: number) {     this.title = title;     this.duration
    = duration;    }   // Method to display course details   displayCourseInfo() {     console.log(`Course
    Title: ${this.title}`);     console.log(`Duration: ${this.duration} weeks`);  
     }  }  // Creating an instance of the Course class using the constructor  const
    course2 = new Course("Advanced TypeScript", 6);  // Displaying course information  course2.displayCourseInfo();  //
    Output:  // Course Title: Advanced TypeScript  // Duration: 6 weeks In the above
    code, the Course class includes a constructor that accepts title and duration
    as parameters, initializing the corresponding properties. This approach simplifies
    the creation of new course instances. Defining Methods Methods are functions defined
    within a class that operate on the object''s properties. They encapsulate the
    behavior associated with the class. We will add more methods to the Course class
    to handle course enrollment.  // Enhancing the Course class with enrollment methods  class
    Course {   title: string;   duration: number; // Duration in weeks   enrolledStudents:
    string[] = []; // Array to store enrolled students   // Constructor to initialize
    properties   constructor(title: string, duration: number) {     this.title = title;     this.duration
    = duration;    }   // Method to display course details   displayCourseInfo() {     console.log(`Course
    Title: ${this.title}`);     console.log(`Duration: ${this.duration} weeks`);  
     }   // Method to enroll a student   enrollStudent(studentName: string) {      this.enrolledStudents.push(studentName);     console.log(`${studentName}
    has been enrolled in ${this.title}.`);    }   // Method to display enrolled students  
    displayEnrolledStudents() {     console.log(`Enrolled Students in ${this.title}:
    ${this.enrolledStudents.join(", ")}`);    }  }  // Creating an instance of the
    Course class  const course3 = new Course("TypeScript Masterclass", 8);  // Enrolling
    students and displaying information  course3.enrollStudent("Alice");  course3.enrollStudent("Bob");  course3.displayCourseInfo();  course3.displayEnrolledStudents();  //
    Output:  // Alice has been enrolled in TypeScript Masterclass.  // Bob has been
    enrolled in TypeScript Masterclass.  // Course Title: TypeScript Masterclass  //
    Duration: 8 weeks  // Enrolled Students in TypeScript Masterclass: Alice, Bob In
    the above code, the Course class includes additional methods: enrollStudent and
    These methods manage the enrollment of students and display relevant information. Public,
    Private, and Protected Modifiers Access modifiers control the visibility and accessibility
    of class members. They determine how properties and methods can be accessed from
    outside the class. Public Modifier The public modifier allows class members to
    be accessed from anywhere. By default, all members are public unless specified
    otherwise.  // Using the public modifier  class Course {   public title: string;  
    public duration: number;   public enrolledStudents: string[] = [];   constructor(title:
    string, duration: number) {     this.title = title;     this.duration = duration;  
     }   public displayCourseInfo() {     console.log(`Course Title: ${this.title}`);     console.log(`Duration:
    ${this.duration} weeks`);    }  } In the above code, all class members are explicitly
    marked as indicating they can be accessed from outside the class. Private Modifier The
    private modifier restricts access to class members, allowing them to be accessed
    only within the class itself.  // Using the private modifier  class Course {  
    private title: string;   private duration: number;   private enrolledStudents:
    string[] = [];   constructor(title: string, duration: number) {     this.title
    = title;     this.duration = duration;    }   public displayCourseInfo() {     console.log(`Course
    Title: ${this.title}`);     console.log(`Duration: ${this.duration} weeks`);  
     }   public enrollStudent(studentName: string) {      this.enrolledStudents.push(studentName);     console.log(`${studentName}
    has been enrolled in ${this.title}.`);    }   public displayEnrolledStudents()
    {     console.log(`Enrolled Students in ${this.title}: ${this.enrolledStudents.join(",
    ")}`);    }  }  // Creating an instance of the Course class  const course4 = new
    Course("TypeScript Masterclass", 8);  // Accessing private members (will result
    in an error)  // course4.title = "New Title"; // Error: Property ''title'' is
    private and only accessible within class ''Course''.  // Using public methods
    to interact with private members  course4.enrollStudent("Alice");  course4.displayCourseInfo(); In
    the above code, the and enrolledStudents properties are marked as preventing direct
    access from outside the class. Instead, public methods are used to interact with
    these private members. Protected Modifier The protected modifier allows access
    to class members within the class and its subclasses but not from outside.  //
    Using the protected modifier  class Course {   protected title: string;   protected
    duration: number;   protected enrolledStudents: string[] = [];   constructor(title:
    string, duration: number) {     this.title = title;     this.duration = duration;  
     }   protected displayCourseInfo() {     console.log(`Course Title: ${this.title}`);     console.log(`Duration:
    ${this.duration} weeks`);    }  }  // Subclass of Course with additional functionality  class
    AdvancedCourse extends Course {   constructor(title: string, duration: number)
    {     super(title, duration);    }   public displayAdvancedCourseInfo() {     this.displayCourseInfo();
    // Accessing protected method     console.log(`This is an advanced course.`);  
     }  }  // Creating an instance of the AdvancedCourse class  const advancedCourse
    = new AdvancedCourse("Advanced TypeScript", 6);  // Accessing protected members
    (will result in an error)  // console.log(advancedCourse.title); // Error: Property
    ''title'' is protected and only accessible within class ''Course'' and its subclasses.  //
    Using subclass methods to access protected members  advancedCourse.displayAdvancedCourseInfo();  //
    Output:  // Course Title: Advanced TypeScript  // Duration: 6 weeks  // This is
    an advanced course. In the above code, the and enrolledStudents properties and
    the displayCourseInfo method are marked as They can be accessed within the AdvancedCourse
    subclass but not from outside the class hierarchy. Sample Program We will integrate
    these concepts into our ongoing project, "Anna''s TS Coaching," to manage student
    and course data effectively.  // Class to represent a student  class Student {  
    private id: number;   public name: string;   public courses: Course[] = [];  
    constructor(id: number, name: string) {     this.id = id;     this.name = name;  
     }   public enrollInCourse(course: Course) {      this.courses.push(course);      course.enrollStudent(this.name);  
     }   public displayStudentInfo() {     console.log(`Student ID: ${this.id}`);     console.log(`Student
    Name: ${this.name}`);     console.log(`Enrolled Courses: ${this.courses.map(course
    => course.title).join(", ")}`);    }  }  // Creating students and enrolling them
    in courses  const student1 = new Student(1, "Alice");  const student2 = new Student(2,
    "Bob");  student1.enrollInCourse(course4);  student2.enrollInCourse(course4);  student1.displayStudentInfo();  student2.displayStudentInfo();  //
    Output:  // Student ID: 1  // Student Name: Alice  // Enrolled Courses: TypeScript
    Masterclass  // Student ID: 2  // Student Name: Bob  // Enrolled Courses: TypeScript
    Masterclass In the above code, we create a Student class with a private id property
    and public methods to enroll in courses and display student information. We demonstrate
    how classes, constructors, methods, and access modifiers work together to manage
    student and course data in our project.  Class Inheritance and Modifiers Class
    inheritance is a fundamental concept in object-oriented programming that allows
    you to create a new class based on an existing class. This enables you to extend
    and customize the behavior of existing classes, promoting code reuse and modularity.
    In TypeScript, you can use inheritance to build hierarchical class structures.
    Additionally, TypeScript provides abstract classes and access modifiers to further
    control class behavior and accessibility. We will explore these concepts and apply
    them to our project. Implementing Inheritance Inheritance allows a class (subclass)
    to inherit properties and methods from another class (superclass). The subclass
    can add or override methods and properties to provide specialized functionality. We
    will create a base class Person and extend it with the Student and Instructor
    classes.  // Defining a base class Person  class Person {   name: string;   age:
    number;   constructor(name: string, age: number) {     this.name = name;     this.age
    = age;    }   displayInfo() {     console.log(`Name: ${this.name}, Age: ${this.age}`);  
     }  }  // Extending the Person class with the Student class  class Student extends
    Person {   courses: string[] = [];   constructor(name: string, age: number) {     super(name,
    age); // Call the constructor of the superclass    }   enroll(course: string)
    {      this.courses.push(course);     console.log(`${this.name} has enrolled in
    ${course}.`);    }   displayCourses() {     console.log(`Enrolled Courses: ${this.courses.join(",
    ")}`);    }  }  // Extending the Person class with the Instructor class  class
    Instructor extends Person {   expertise: string;   constructor(name: string, age:
    number, expertise: string) {     super(name, age);     this.expertise = expertise;  
     }   displayExpertise() {     console.log(`${this.name} is an expert in ${this.expertise}.`);  
     }  }  // Creating instances of Student and Instructor  const student = new Student("Alice",
    20);  const instructor = new Instructor("Bob", 35, "TypeScript");  student.enroll("TypeScript
    Basics");  student.displayInfo(); // Output: Name: Alice, Age: 20  student.displayCourses();
    // Output: Enrolled Courses: TypeScript Basics  instructor.displayInfo(); // Output:
    Name: Bob, Age: 35  instructor.displayExpertise(); // Output: Bob is an expert
    in TypeScript In the above code, the Person class is a base class with common
    properties name and The Student class inherits from Person and adds additional
    methods for course enrollment, while the Instructor class inherits from Person
    and adds expertise-related functionality. The super keyword is used to call the
    constructor of the superclass, allowing the Student and Instructor classes to
    initialize inherited properties. Defining Abstract Classes Abstract classes provide
    a way to define base classes that cannot be instantiated directly. They can contain
    abstract methods without implementation, which must be implemented by subclasses.
    Abstract classes allow you to define a common interface for derived classes while
    enforcing specific behavior. We will create an abstract class CourseMember to
    represent a member of a course and use it as a base for Student and Instructor
    classes.  // Defining an abstract class CourseMember  abstract class CourseMember
    {   name: string;   constructor(name: string) {     this.name = name;    }   //
    Abstract method to display role-specific information   abstract displayRoleInfo():
    void;   displayName() {     console.log(`Name: ${this.name}`);    }  }  // Extending
    the abstract class CourseMember with the Student class  class Student extends
    CourseMember {   courses: string[] = [];   constructor(name: string) {      super(name);  
     }   enroll(course: string) {      this.courses.push(course);     console.log(`${this.name}
    has enrolled in ${course}.`);    }   displayCourses() {     console.log(`Enrolled
    Courses: ${this.courses.join(", ")}`);    }   displayRoleInfo() {     console.log(`${this.name}
    is a student.`);    }  }  // Extending the abstract class CourseMember with the
    Instructor class  class Instructor extends CourseMember {   expertise: string;  
    constructor(name: string, expertise: string) {      super(name);     this.expertise
    = expertise;    }   displayExpertise() {     console.log(`${this.name} is an expert
    in ${this.expertise}.`);    }   displayRoleInfo() {     console.log(`${this.name}
    is an instructor.`);    }  }  // Creating instances of Student and Instructor  const
    student2 = new Student("Charlie");  const instructor2 = new Instructor("David",
    "Advanced TypeScript");  student2.enroll("Advanced TypeScript");  student2.displayName();
    // Output: Name: Charlie  student2.displayRoleInfo(); // Output: Charlie is a
    student.  instructor2.displayName(); // Output: Name: David  instructor2.displayRoleInfo();
    // Output: David is an instructor. In the above code, CourseMember is an abstract
    class with an abstract method The Student and Instructor classes extend CourseMember
    and provide their implementations for defining role-specific behavior. Applying
    Access Modifiers in Inheritance Access modifiers control the visibility and accessibility
    of class members in inheritance scenarios. They determine how properties and methods
    can be accessed from subclasses. We will demonstrate how access modifiers affect
    class inheritance and member accessibility.  // Defining a base class Course  class
    Course {   public title: string;   protected duration: number;   private enrolledStudents:
    string[] = [];   constructor(title: string, duration: number) {     this.title
    = title;     this.duration = duration;    }   public displayTitle() {     console.log(`Course
    Title: ${this.title}`);    }   protected displayDuration() {     console.log(`Course
    Duration: ${this.duration} weeks`);    }   private addStudent(studentName: string)
    {      this.enrolledStudents.push(studentName);    }   public enroll(studentName:
    string) {      this.addStudent(studentName);     console.log(`${studentName} has
    enrolled in ${this.title}.`);    }  }  // Extending the Course class with AdvancedCourse  class
    AdvancedCourse extends Course {   constructor(title: string, duration: number)
    {     super(title, duration);    }   public displayCourseDetails() {      this.displayTitle();     this.displayDuration();
    // Accessing protected method    }  }  // Creating an instance of AdvancedCourse  const
    advancedCourse2 = new AdvancedCourse("Mastering TypeScript", 8);  advancedCourse2.displayCourseDetails();  //
    Output:  // Course Title: Mastering TypeScript  // Course Duration: 8 weeks  advancedCourse2.enroll("Eve");  //
    Output: Eve has enrolled in Mastering TypeScript  // Attempting to access private
    members (will result in an error)  // advancedCourse2.enrolledStudents.push("Eve");
    // Error: Property ''enrolledStudents'' is private and only accessible within
    class ''Course''. In the above code, the Course class has a public property a
    protected property and a private property The AdvancedCourse class extends Course
    and can access the public and protected members but not the private members. The
    displayCourseDetails method demonstrates how protected members can be accessed
    within subclasses. Sample Program We will integrate inheritance, abstract classes,
