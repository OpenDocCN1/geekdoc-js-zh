    const foundStudent = service.findStudentById(2);    expect(foundStudent).toEqual(student);   });  
    it(''should return undefined for a non-existent student ID'', () => {   const
    foundStudent = service.findStudentById(3);    expect(foundStudent).toBeUndefined();   });  }); In
    the above code, we define a StudentService class in studentService.ts and write
