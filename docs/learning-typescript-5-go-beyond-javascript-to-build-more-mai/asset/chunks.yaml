  trans: "\n\n# 欢迎来到 Anna 的 TS 培训！\n\n<app-student-list></app-student-list> 当你重新加载应用时，`StudentListComponent`\
    \ 将渲染并显示学生列表。\n\n## 在 Angular 服务中使用 TypeScript\nAngular 中的服务用于封装业务逻辑和共享用性。它们通常被用于管理数据、处理\
    \ HTTP 请求以及执行需要在组件间共享的操作。TypeScript 的特性（如接口 `interfaces` 和装饰器 `decorators`）增强了\
    \ Angular 服务的开发和组织。\n\n### 创建一个 Angular 服务\n要创建一个新的 Angular 服务，请使用 Angular CLI\
    \ 的 `generate` 命令：\n```bash\nng generate service student\n```\n此命令将在 `src/app/student/`\
    \ 目录下生成一个名为 `StudentService` 的新服务。该服务由单个文件组成：\n- 定义服务逻辑的 `TypeScript` 文件。\n\n\
    ### 使用 TypeScript 定义服务\n我们将探索生成的 `student.service.ts` 文件并添加一些逻辑：\n```typescript\n\
    // student.service.ts\nimport { Injectable } from '@angular/core';\ninterface\
    \ Student {\n  id: number;\n  name: string;\n}\n@Injectable({\n  providedIn: 'root'\n\
    })\nexport class StudentService {\n  private students: Student[] = [\n    { id:\
    \ 1, name: 'Liam' },\n    { id: 2, name: 'Sophia' },\n    { id: 3, name: 'Olivia'\
    \ }\n  ];\n  constructor() {}\n  getStudents(): Student[] {\n    return this.students;\n\
    \  }\n  addStudent(student: Student): void {\n    this.students.push(student);\n\
    \  }\n}\n```\n在上述代码中，我们定义了一个使用 `@Injectable` 装饰器装饰的 `StudentService` 类，表示该服务可以注入到其他组件和服务。`students`\
    \ 数组被定义为 `private` 属性，将学生数据封装在服务内部。`Student` 接口定义了学生的形状，在处理学生数据时提供了类型安全。\n\n`getStudents`\
    \ 方法返回学生列表，而 `addStudent` 方法向数组中添加新学生。TypeScript 的静态类型和接口 `interfaces` 通过强制执行数据结构和方法的正确用法，增强了服务。\n\
    \n### 在 Angular 组件中使用服务\n要在组件中使用 `StudentService`，请将其注入到组件的构造函数并使用其方法。\n```typescript\n\
    // student-list.component.ts\nimport { Component, OnInit } from '@angular/core';\n\
    import { StudentService } from '../student/student.service';\n@Component({\n \
    \ selector: 'app-student-list',\n  templateUrl: './student-list.component.html',\n\
    \  styleUrls: ['./student-list.component.css']\n})\nexport class StudentListComponent\
    \ implements OnInit {\n  students: { id: number; name: string; }[] = [];\n  constructor(private\
    \ studentService: StudentService) {}\n  ngOnInit(): void {\n    this.students\
    \ = this.studentService.getStudents();\n  }\n  addStudent(id: number, name: string):\
    \ void {\n    this.studentService.addStudent({ id, name });\n    this.students\
    \ = this.studentService.getStudents(); // 刷新列表\n  }\n}\n```\n在上述代码中，`StudentService`\
    \ 通过构造函数注入到 `StudentListComponent`，允许组件访问服务的方法。`ngOnInit` 生命周期钩子通过通过服务的服务的 `getStudents`\
    \ 来初始化 `students` 数组。`addStudent` 方法使用服务添加新学生，并通过获取更新的学生数据来刷新列表。\n\n## 将 TypeScript\
    \ 与 Angular 特性集成\nAngular 丰富的生态系统提供了与 TypeScript 无缝集成的各种特性，增强了开发过程和代码质量。\n\n###\
    \ 在 Angular 指令中的 TypeScript\nAngular 指令是为 DOM 元素添加行为的类。TypeScript 的类型注解和装饰器 `decorators`\
    \ 增强了指令的创建和管理。\n```typescript\n// highlight.directive.ts\nimport { Directive,\
    \ ElementRef, Renderer2, HostListener } from '@angular/core';\n@Directive({\n\
    \  selector: '[appHighlight]'\n})\nexport class HighlightDirective {\n  constructor(private\
    \ el: ElementRef, private renderer: Renderer2) {}\n  @HostListener('mouseenter')\
    \ onMouseEnter() {\n    this.renderer.setStyle(this.el.nativeElement, 'background-color',\
    \ 'yellow');\n  }\n  @HostListener('mouseleave') onMouseLeave() {\n    this.renderer.setStyle(this.el.nativeElement,\
    \ 'background-color', 'transparent');\n  }\n}\n```\n在上述代码中，我们定义了一个 `HighlightDirective`，当鼠标进入和离开元素时更改元素的背景颜色。该指令使用\
    \ `@Directive` 装饰器指定其选择器，并使用 TypeScript 的类型注解来管理如 `ElementRef` 等依赖。`@HostListener`\
    \ 装饰器用于将方法绑定到 DOM 事件。\n\n### 在 Angular 管道中使用 TypeScript\nAngular 中的管道（Pipes）在数据显示于视图之前对其进行转换。TypeScript\
    \ 通过提供类型安全和改进的工具支持来增强管道 `pipes`。\n```typescript\n// capitalize.pipe.ts\nimport\
    \ { Pipe, PipeTransform } from '@angular/core';\n@Pipe({\n  name: 'capitalize'\n\
    })\nexport class CapitalizePipe implements PipeTransform {\n  transform(value:\
    \ string): string {\n    if (!value) return '';\n    return value.charAt(0).toUpperCase()\
    \ + value.slice(1).toLowerCase();\n  }\n}\n```\n在上述代码中，我们定义了一个 `CapitalizePipe`\
    \ 将字符串的首字母大写。管道使用 `@Pipe` 装饰器指定其名称并实现 `PipeTransform`。\n\n"
- fmt: "\nIn the above code, we define a `StudentList` component using the `React.FC`\
    \ type to indicate that it is a functional component. We use TypeScript interfaces\
    \ to define the shape of student objects and the props the component expects.\
    \ The `useState` hook is used to manage the list of students, with TypeScript\
    \ ensuring that the state and related functions adhere to the defined types.\n\
    \n## Using the Component in the Application\nAdd the `StudentList` component to\
    \ the `App.tsx` file:\n\n```typescript\n// src/App.tsx\nimport React from 'react';\n\
    import StudentList from './components/StudentList';\n// Initial student data\n\
    const initialStudents = [\n  { id: 1, name: 'Liam' },\n  { id: 2, name: 'Sophia'\
    \ },\n  { id: 3, name: 'Olivia' }\n];\nconst App: React.FC = () => {\n  return\
    \ (\n    <StudentList initialStudents={initialStudents} />\n  );\n};\nexport default\
    \ App;\n```\n\nIn the above code, the `App` component imports and uses the `StudentList`\
    \ component, passing the `initialStudents` array as a prop. TypeScript ensures\
    \ that the prop type matches the expected shape, providing type safety and improved\
    \ development experience.\n\n## Utilizing TypeScript with React Hooks\nReact hooks\
    \ are functions that let you use state and lifecycle features in functional components.\
    \ TypeScript enhances hooks by providing type safety and clarity.\n\n### Using\
    \ TypeScript with useState Hook\nWe've already seen an example of using TypeScript\
    \ with the `useState` hook in the `StudentList` component. We will further explore\
    \ how TypeScript works with hooks by creating a custom hook to manage student\
    \ data. For this, let us first create a new hook file: `useStudentManager.ts`.\n\
    \n```typescript\n// src/hooks/useStudentManager.ts\nimport { useState } from 'react';\n\
    // Define the shape of student objects using an interface\ninterface Student {\n\
    \  id: number;\n  name: string;\n}\nexport const useStudentManager = (initialStudents:\
    \ Student[]) => {\n  const [students, setStudents] = useState<Student[]>(initialStudents);\n\
    \  const addStudent = (name: string) => {\n    const newStudent: Student = { id:\
    \ students.length + 1, name };\n    setStudents([...students, newStudent]);\n\
    \  };\n  const removeStudent = (id: number) => {\n    setStudents(students.filter(student\
    \ => student.id !== id));\n  };\n  return { students, addStudent, removeStudent\
    \ };\n};\n```\n\nIn the above code, the `useStudentManager` hook manages a list\
    \ of students, providing functions to add and remove students. TypeScript ensures\
    \ that the hook's state and functions are correctly typed, enhancing code reliability.\n\
    \n### Using Custom Hook in Component\nUpdate the `StudentList` component to use\
    \ the `useStudentManager` hook:\n\n```typescript\n// src/components/StudentList.tsx\n\
    import React from 'react';\nimport { useStudentManager } from '../hooks/useStudentManager';\n\
    // Define the shape of student objects using an interface\ninterface Student {\n\
    \  id: number;\n  name: string;\n}\n// Define the props interface for the component\n\
    interface StudentListProps {\n  initialStudents: Student[];\n}\nconst StudentList:\
    \ React.FC = ({ initialStudents }) => {\n  const { students, addStudent, removeStudent\
    \ } = useStudentManager(initialStudents);\n  return (\n    <div>\n      {students.map(student\
    \ => (\n        <div key={student.id}>\n          {student.name}\n        </div>\n\
    \      ))}\n    </div>\n  );\n};\nexport default StudentList;\n```\n\nIn this\
    \ updated example, the `StudentList` component uses the `useStudentManager` hook\
    \ to manage student data. The hook provides the state and functions needed to\
    \ add and remove students, demonstrating how TypeScript enhances hooks with type\
    \ safety.\n\n## Utilizing TypeScript with React Context\nReact Context provides\
    \ a way to pass data through the component tree without manually passing props\
    \ at every level. TypeScript can enhance Context by providing clear types for\
    \ the data and functions it manages.\n\n### Creating a Context with TypeScript\n\
    We will create a context to manage the theme of the application with a new context\
    \ file: `ThemeContext.tsx`.\n\n```typescript\n// src/context/ThemeContext.tsx\n\
    import React, { createContext, useContext, useState } from 'react';\n// Define\
    \ the shape of the theme context data\ninterface ThemeContextType {\n  theme:\
    \ string;\n  toggleTheme: () => void;\n}\n// Create a context with an initial\
    \ value\nconst ThemeContext = createContext<ThemeContextType | undefined>(undefined);\n\
    \nexport const ThemeProvider: React.FC<{ children: React.ReactNode }> = ({ children\
    \ }) => {\n  const [theme, setTheme] = useState<string>('light');\n  const toggleTheme\
    \ = () => {\n    setTheme(prevTheme => (prevTheme === 'light' ? 'dark' : 'light'));\n\
    \  };\n  return (\n    <ThemeContext.Provider value={{ theme, toggleTheme }}>\n\
    \      {children}\n    </ThemeContext.Provider>\n  );\n};\n\n// Custom hook to\
    \ use the ThemeContext\nexport const useTheme = ThemeContextType => {\n  const\
    \ context = useContext(ThemeContext);\n  if (!context) {\n    throw new Error('useTheme\
    \ must be used within a ThemeProvider');\n  }\n  return context;\n};\n```\n\n\
    In the above code, we define a `ThemeContext` with a theme state and a `toggleTheme`\
    \ function. The `ThemeProvider` component wraps the application, providing the\
    \ theme context to its children. The `useTheme` hook provides a convenient way\
    \ to access the theme context, ensuring it is used correctly.\n\n### Using the\
    \ Context in a Component\nUpdate the `App` component to use the:\n\n```typescript\n\
    // src/App.tsx\nimport React from 'react';\nimport StudentList from './components/StudentList';\n\
    import { ThemeProvider, useTheme } from './context/ThemeContext';\n// Initial\
    \ student data\nconst initialStudents = [\n  { id: 1, name: 'Liam' },\n  { id:\
    \ 2, name: 'Sophia' },\n  { id: 3, name: 'Olivia' }\n];\n// Theme toggle button\
    \ component\nconst ThemeToggleButton: React.FC = () => {\n  const { theme, toggleTheme\
    \ } = useTheme();\n  return (\n    <button onClick={toggleTheme}>\n      Switch\
    \ to {theme === 'light' ? 'dark' : 'light'} mode\n    </button>\n  );\n};\n\n\
    const App: React.FC = () => {\n  return (\n    <ThemeProvider>\n      <ThemeToggleButton\
    \ />\n      <StudentList initialStudents={initialStudents} />\n    </ThemeProvider>\n\
    \  );\n};\nexport default App;\n```\n"
