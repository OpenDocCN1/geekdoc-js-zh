    a Project Directory Open Command Prompt and navigate to the directory where you
    want to create your project. You can use the cd command to change directories. For
    example, type mkdir my-typescript-project and press Enter to create a new directory.
    Then, type cd my-typescript-project and press Enter to navigate into it. Initialize
    a TypeScript Project ●    In the project directory, type tsc --init and press
    Enter. This command generates a tsconfig.json file, which contains the configuration
    settings for the TypeScript compiler. Configure tsconfig.json Open the tsconfig.json
    file in a text editor. The tsconfig.json file includes various options for configuring
    the TypeScript compiler. The settings include: Specifies the ECMAScript version
    to which TypeScript code is compiled (e.g., ○    Defines the module system for
    the compiled code (e.g., ○    Specifies the output directory for compiled JavaScript
    files. ○    Defines the root directory of the TypeScript source files. ○    Enables
    strict type-checking options. You may check out the following sample configuration:  {  
    "compilerOptions": {   "target": "es6",   "module": "commonjs",   "outDir": "./dist",  
    "rootDir": "./src",   "strict": true   }  } ●    Save the tsconfig.json file after
    making the necessary changes. Create Source and Output Directories In the project
    directory, create a src directory for your TypeScript source files and a dist
    directory for the compiled JavaScript files. ●    Type mkdir src and mkdir dist
    in the Command Prompt and press Enter. Compile TypeScript Code Create a simple
    TypeScript file in the src directory. For example, create a file named index.ts
    with the following content:  const greeting: string = "Hello, TypeScript!";  console.log(greeting); In
    the Command Prompt, navigate to the project directory and type tsc to compile
    the TypeScript code. The compiled JavaScript file will be generated in the dist
