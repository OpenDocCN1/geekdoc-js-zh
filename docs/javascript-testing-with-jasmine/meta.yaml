    \n## 第 1 章：测试简介\n\n### 什么是软件测试？\n\n简单来说，你可以根据规范对软件进行测试。\n\n假设你正在编写一个只进行加法的计算器。在开始之前，先思考它的应该是应该是。它应该能够加正整数。应该能够加负整数。应该能够加小数，而不仅仅是整数。你可以考虑到计算器需要工作的许多不同方式。\n\
    \n在编写任何代码之前，你已经知道你希望它如何运行。你有一份行为规范。\n\n你可以在代码中编写这些规范。你会说好的，它应该这样工作。”你会编写测试来计算\
    \ 1+1、2+2、-1+5、-1.2+6.8、0+0 等。当你运行这些测试时，要么得到成功（它按照规范运行），要么得到失败（不符合规范）。如果你运行所有测试并看到每个都成功，那么你就可以很确定你的计算器工作正常。如果你运行这些测试并发现一些失败，你就知道你的计算器无法工作。\n\
    \n这就是软件测试的本质。你正在根据规范对代码进行测试。有很多工具（其中包括 Jasmine）可以帮助你自动化这些软件测试。\n\n重要的一点是，为每种情况编写测试都是困难的（而且通常是不可能的）。在计算器的示例中，有无限可能的组合。测试时，你应该尝试通过测试许多不同的组（整数、负数、两者的混合等）来涵盖每个合理的情况。你还应该识别边界条件（例如零）和边缘情况，测试尽可能不同的场景。\n\
    \n### 为什么它很有用？\n\n测试之所以有用，有很多原因。\n\n首先，这些测试可以在程序发生更改后评估其正确性。假设所有测试都通过了，然后我想让其中一个函数运行更快。我可以深入研究进行一些更改，并看到它确实更快了。但如果我再次运行测试发现某些失败了，我很快就能发现修复破坏了代码的某些部分。自动化测试让我能在这些错误出现在“真实世界”中之前发现它们。\n\
    \n这些测试还可以作为其他开发者的良好示例。如果一个开发人员试图弄懂如何使用你代码中未文档的部分，编写良好的测试可以帮助他看到那部分代码可以工作。\n\n\
    ### 测试驱动开发\n\n一种相对新的软件开发技术被称为测试驱动开发，或 TDD。该过程如下：\n\n1. 为你代码的特定部分编写测试用例。在计算器示例中，你将为加正数、负数、整数等编写测试。你还没有编写计算器，所以所有这些测试都应该失败！\n\
    2. 编写你的代码来“填充”测试。你的代码的作用只是让所有测试都通过。\n3. 一旦所有测试都通过，返回并清理你的代码（这被称为重构）。\n\n测试驱动开发允许开发者在思路被实现细节困扰之前清晰地思考规范。它还确保了测试始终是有用的。\n\
    \n### 行为驱动开发\n\n通过行为驱动开发（或 BDD），你编写的规范既小又易于阅读。BDD 基本上有两个关键部分：\n\n1. 你的测试必须是微小的。与其测试整个应用程序，不如编写许多微小的测试。在计算器示例中，你为每个部分编写一个测试：一个测试\
