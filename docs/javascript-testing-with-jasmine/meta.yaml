    \ until done is called...unless it takes too long and time out (after 5 seconds).\"\
    \ You can adjust this timeout value by changing jasmine.DEFAULT_TIMEOUT_INTERVAL,\
    \ like so:\n\n```javascript\n// Change default timeout interval to 2 seconds\n\
    jasmine.DEFAULT_TIMEOUT_INTERVAL = 2000;\n```\n\n# jasmine-node and CoffeeScript\n\
    \nIf you want to use jasmine-node with CoffeeScript, you can. You'll need to end\
    \ your filenames with .spec.coffee and then run jasmine-node with the --coffee\
    \ flag, like so:\n\n```bash\njasmine-node /path/to/project/directory --coffee\n\
    ```\n\nThat's all you have to do! Jasmine-node will start picking up .spec.coffee\
    \ files and test them properly.\n\n# Jasmine and Ruby on Rails\n\nJasmine works\
    \ well with Ruby on Rails, allowing you to test your JavaScript without constantly\
    \ editing a spec runner HTML file.\n\nThe Jasmine documentation recommends one\
    \ of Ryan Bates's RailsCasts as a good way to get up with Jasmine and Rails 3+.\
    \ I think it is a fantastic resource, so give it a look if you're interested.\
    \ Or you can follow along here.\n\n# Installation\n\nFirst, you'll need to add\
    \ Jasmine to your Gemfile, like so:\n\n```ruby\ngem \"jasmine\"\n```\n\nNext,\
    \ let's install:\n\n```bash\nbundle install\nrails generate jasmine:install\n\
    ```\n\n# Usage\n\nNow you're all set! This process will create a directory spec\
    \ if you don't already have one. Inside of that, there's a folder javascripts.\
    \ For this example, let's make a test spec in spec/javascripts that contains this:\n\
    \n```javascript\ndescribe(\"Jasmine + Rails test\", function() {\n  it(\"works\"\
    , function() {\n    expect(true).toBeTruthy();\n  });\n});\n```\n\nSave this as\
    \ test.spec.js.\n\nNow, from any directory, run the following command:\n\n```bash\n\
    rake jasmine\n```\n\nAfter chugging a little bit, Jasmine will tell you that your\
    \ tests are located at http://localhost:8888. Visit that in your browser, and\
    \ you'll see the test pass! Now you can change test.spec.js to spec out whatever\
    \ you'd like and go from there.\n\nIf you'd like to run your tests in the terminal,\
    \ you can do that by running rake jasmine:ci.\n\nIf you have helpers (Jasmine\
    \ plug-ins, for example), just put them in spec/javascripts/helpers and they'll\
    \ be automatically included.\n\n# Jasmine with Non-Rails Ruby\n\nYou don't need\
    \ Rails to use Jasmine with Ruby. First, you need to install the Jasmine gem.\n\
    \nIf your project uses Bundler, add the following to your Gemfile:\n\n```ruby\n\
    gem \"jasmine\"\n```\n\nIf not, run the following commands in the command line:\n\
    \n```bash\ngem install jasmine\n```\n\nOnce you've installed Jasmine, you can\
    \ run it like this:\n\n```bash\njasmine init\nrake jasmine:ci\n```\n\nYou should\
    \ be up and running!\n\n# More Tools\n\nThere are countless ways to integrate\
    \ Jasmine into your project. I've covered only a couple here, but there are plenty.\
    \ There's a section on the Jasmine wiki about using Jasmine with Scala, Java,\
    \ .NET, and plenty more.\n\n# CHAPTER 8\nReference\n\n# Jasmine on the Web\n\n\
    - Download Jasmine\n- Jasmine wiki\n\n# The Basic Structure of a Suite\n\n```javascript\n\
    describe(\"colors\", function() {\n  describe(\"red\", function() {\n    var red;\n\
    \    beforeEach(function() {\n      red = new Color(\"red\");\n    });\n    afterEach(function()\
    \ {\n      red = null;\n    });\n    it(\"has the correct value\", function()\
    \ {\n      expect(red.hex).toEqual(\"FF0000\");\n    });\n  });\n  it(\"makes\
    \ orange when mixed with yellow\", function() {\n    var yellow = new Color(\"\
    yellow\");\n    var orange = new Color(\"orange\");\n    expect(red.mix(yellow)).toEqual(orange);\n\
    \  });\n});\n```\n\n# Matchers Reference\n\n- toEqual checks for equality, not\
    \ necessarily the same object.\n- toBe if two objects are the same.\n- toBeTruthy\
    \ checks if a value is truthy (not just true).\n- toBeFalsy checks if a value\
    \ is falsy (not just false).\n- toContain checks if a value is inside another.\n\
    - toDefined checks if a value is defined.\n- toUndefined checks if a value is\
    \ undefined.\n- toNull checks if a value is null.\n- toBeCloseTo decimal proximity.\n\
    - toMatch checks if a value matches a given regular expression.\n- toThrow checks\
    \ if a function throws an error.\n- .not inverts the meaning of the following\
    \ matcher.\n\n# List of Falsy Values\n\n- false\n- 0\n- undefined (note that the\
    \ variable undefined isn't always undefined!)\n- null\n- NaN\n\n# Reserved Words\
    \ in Jasmine\n\nThe following are words that you shouldn't use in your code so\
    \ that you don't cause conflicts with Jasmine:\n\n- jasmine (and everything in\
    \ its namespace)\n- describe\n- it\n- expect\n- beforeEach\n- afterEach\n- runs\n\
    - waits\n- waitsFor\n- spyOn\n- xdescribe\n- xit\n\nThese are, of course, in addition\
    \ to JavaScript's reserved words, which are even more off-limits.\n\n# About the\
    \ Author\n\nEvan Hahn is a JavaScript developer currently enrolled at the University\
    \ of Michigan. He started coding in BASIC when he was six years old. In high school,\
    \ he was the webmaster of the online newspaper, where he learned how to develop\
    \ a website using PHP, MySQL, JavaScript, and jQuery. He most recently worked\
    \ at UniversityNow, an educational startup in San Francisco.\n\n# Colophon\n\n\
    The animal on the cover of JavaScript Testing for Jasmine is a phoebe.\n\nThe\
    \ cover image is from Johnson's Natural History. The cover font is Adobe ITC Garamond.\
    \ The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed;\
    \ and the code font is Dalton Maag's Ubuntu Mono.\n"
  mdcn: "\n\n```javascript\nglobal.hello = function() {\n  return 'world';\n};\n```\n\
    \n一个可能像这样的测试规范：\n\n```javascript\n// 包含我们需要包含的内容：这是针对 jasmine-node 特有的\nrequire(\"\
