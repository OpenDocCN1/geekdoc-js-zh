  md: "```\nglobal.hello = function() {\n  return 'world';\n};\n```\n\nA test spec\
    \ that might look like this:\n\n```\n// Include what we need to include: this\
    \ is specific to jasmine-node\nrequire(\"../src/test.js\");\n\ndescribe(\"hello\"\
    , function() {\n  it(\"returns world\", function() {\n    expect(hello()).toEqual(\"\
    world\");\n  });\n});\n```\n\nOther than the calls that you need to make, the\
    \ specs are just like browser-based Jasmine specs—except for one asynchronous\
    \ component, that is.\n\n# Asynchronous Tests with jasmine-node\n\nAsynchronous\
    \ tests work the same way as they do in \"regular\" Jasmine, but there is another\
    \ syntax that you can use: the done function. This signals to jasmine-node that\
    \ your spec is, well, done.\n\nHere's an example of how you'd use it:\n\n```\n\
    it(\"does an asynchronous call\", function() {\n  exampleAsync(function(response)\
    \ {\n    expect(response).toContain(\"something expected\");\n    done();\n  });\n\
    });\n```\n\nThe done function says to jasmine-node: \"Hey, this is a function\
    \ that deals with asynchronous status. Don't call it until done is called...unless\
    \ it takes too long and time out (after 5 seconds).\" You can adjust this timeout\
    \ value by changing jasmine.DEFAULT_TIMEOUT_INTERVAL, like so:\n\n```\n// Change\
    \ default timeout interval to 2 seconds\njasmine.DEFAULT_TIMEOUT_INTERVAL = 2000;\n\
    ```\n\n# jasmine-node and CoffeeScript\n\nIf you want to use jasmine-node with\
    \ CoffeeScript, you can. You'll need to end your filenames with .spec.coffee and\
    \ then run jasmine-node with the --coffee flag, like so:\n\n```\njasmine-node\
    \ /path/to/project/directory --coffee\n```\n\nThat's all you have to do! Jasmine-node\
    \ will start picking up .spec.coffee files and test them properly."
