  md: "# Making Sure a Spy Returns a Specific Value\n\nYou can also make sure that\
    \ a spy always returns a given value. Let's say that you want the dictionary's\
    \ spy to speak French:\n\n```\nit(\"can give a Spanish hello\", function() {\n\
    \  var dictionary = new Dictionary;\n  var person = new Person;\n  spyOn(dictionary,\
    \ \"hello\").andReturn(\"bonjour\"); // note this new piece\n  var result = person.sayHelloWorld(dictionary);\n\
    \  expect(result).toEqual(\"bonjour world\");\n});\n```\n\nThis can be useful\
    \ if you want to make sure that despite a changed function, everything else works\
    \ well. You can also use this to see how your code performs if given bad output.\
    \ In this example, for instance, dictionary.hello might be broken.\n\n# Replacing\
    \ a Function with a Completely Different Spy\n\nSpies can get even crazier. They\
    \ can call through to a fake function, like so:\n\n```\nit(\"can call a fake function\"\
    , function() {\n  var fakeHello = function() {\n    alert(\"I am a spy! Ha ha!\"\
    );\n    return \"hello\";\n  };\n  var dictionary = new Dictionary();\n  spyOn(dictionary,\
    \ \"hello\").andCallFake(fakeHello);\n  dictionary.hello(); // does an alert\n\
    });\n```\n\nThis means you can test your code against, a buggy API.\n\n# Creating\
    \ a New Spy Function\n\nIn the previous examples, we were building spies that\
    \ replaced existing functions. It is sometimes useful to create a spy for a function\
    \ that does not exist yet. If you want to say, give your Person a getName spy,\
    \ you can do that by creating a new spy.\n\nWhere spyOn created a spy by \"eating\"\
    \ an existing function, jasmine.createSpy doesn't have to it. It can make a new\
    \ one:\n\n```\nit(\"can have a spy function\", function() {\n  var person = new\
    \ Person();\n  person.getName = jasmine.createSpy(\"Name spy\");\n  person.getName();\n\
    \  expect(person.getName).toHaveBeenCalled();\n});\n```"
