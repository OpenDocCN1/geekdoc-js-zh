    # Jasmine and Node.js


    If you want to use Jasmine to test your Node.js projects, you can! You can use
    it to test your browser-based projects, too.


    # Installing jasmine-node on Unix and Linux


    First, you need to install the jasmine-node package. Type the following into your
    terminal:


    ```

    sudo npm install -g jasmine-node

    ```


    The -g flag installs jasmine-node on your system globally. If you''d prefer to
    keep it in a project directory, leave the flag off. This also (probably) means
    you don''t need sudo at the front.


    # Installing jasmine-node on Windows


    First, download a ZIP of jasmine-node.


    Unpack and rename the folder as jasmine-node. Once you do, move it into the same
    directory that you installed .exe into. You should be up and running!


    # Basic Usage


    Now you have jasmine-node installed! Use it as follows:


    ```

    jasmine-node /path/to/project/directory

    ```


    Jasmine-node requires you to put your specs in a directory called spec and for
    the specs in that directory to end with spec.js. You can also put specs in subdirectories
    of the spec directory.


    For example, if you have a function like this in src/test.js:'
