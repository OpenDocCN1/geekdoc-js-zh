- img_proc: true
  md: "That large spec should be split into four different specs, because you're really\
    \ testing four different parts. This is a step in the right direction:\n\n```\n\
    describe(\"calculator addition\", function() {\n  var calc;\n  beforeEach(function()\
    \ {\n    calc = new Calculator();\n  });\n  it(\"can add positive integers\",\
    \ function() {\n    expect(calc.add(2, 3)).toEqual(5);\n  });\n  it(\"can subtract\
    \ positive integers\", function() {\n    expect(calc.sub(8, 5)).toEqual(3);\n\
    \  });\n  it(\"can multiply positive integers\", function() {\n    expect(calc.mult(4,\
    \ 3)).toEqual(12);\n  });\n  it(\"can divide positive integers\", function() {\n\
    \    expect(calc.div(12, 4)).toEqual(3);\n  });\n});\n```\n\nEach spec should\
    \ test only one case or scenario at a time. In the previous, if you had an error\
    \ in your mult function, the spec would fail even if the other components worked\
    \ perfectly. In this example, one test will fail, and you'll be able to more quickly\
    \ pinpoint your multiplication is broken.\n\n# Black-Box Testing\n\nWhen writing\
    \ behavior-focused tests, you can imagine your software being a black box. You\
    \ only care about the software's behavior, not what happens internally.\n\nA simple\
    \ example: if your person object has a function that includes a private method\
    \ (not technically, sorry) called _generateHelloWorld, it might look like this\
    \ when calling HelloWorld:\n\n```\nvar person = {\n  // Private method\n  _generateHelloWorld:\
    \ function() {\n    return \"hello\";\n  },\n  // Public method\n  helloworld:\
    \ function() {\n    return this._generateHelloWorld() + \" world\";\n  }\n};\n\
    ```\n\nBecause _generateHelloWorld is a private method, you'd never test that\
    \ in Jasmine. You don't need to, because you don't care how it works. You just\
    \ care how the public method works."
