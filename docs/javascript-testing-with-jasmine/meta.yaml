    We see that, although spot and cos look really similar and are equal, *they aren''t
    the same object*. Because of that, they evaluate as *equal*, not the same.


    The same is also true for arrays:


    ```

    var arr = [1, 2, 3];

    expect(arr).toEqual([1, 2, 3]); // success; equivalent

    expect(arr).toBe([1, 2, 3]); // failure; not the same array

    ```


    You might notice that toBe works for primitives (numbers, Booleans, strings).
    This is because JavaScript''s === operator evaluates primitives as the same entity.
    Using toBe is essentially using the === operator.


    Use toEqual when checking the equivalence of primitive types, even if toBe will
    work. Using toBe might break your tests if you later decide to change a number
    to an array, for example.


    For more about how this nuance works in JavaScript, see the video JavaScript Primitive
    Types vs References Types.


