  md: "```\nreturn \"Expected \" + this.actual + \" to be large\";\n};\n  return this.actual\
    \ > 100;\n}\n}\n));\n```\n\nThis requires a little bit of knowledge about how\
    \ Jasmine is put together. Every matcher takes an argument to the expect function,\
    \ right? expect(200) has 200 as its argument. This argument, Jasmine, is this.actual\
    \ when we're defining a new matcher; this.message is a function, if the matcher\
    \ fails, the explanatory output message. Finally, we return a Boolean whether\
    \ this.actual is large.\n\nNow we can do the following in our specs:\n\n```\n\
    expect(5).toBeLarge();      // failure\nexpect(200).toBeLarge();     // success\n\
    expect(12).not.toBeLarge();   // success\n```\n\nA more complex matcher might\
    \ want to introduce this syntax as a replacement for toBeCloseTo:\n\n```\n// Expect\
    \ 6 to be within 2 of 5 (between 3 and 7, inclusive)\nexpect(6).toBeWithinOf(2,\
    \ 5);\n```\n\nThis matcher will take two arguments and is otherwise similar to\
    \ the previous example:\n\n```\nbeforeEach(function() {\n  this.addMatchers({\n\
    \    toBeWithinOf: function(distance, base) {\n      this.message = function()\
    \ {\n        var lower = base - distance;\n        var upper = base + distance;\n\
    \        return \"Expected \" + this.actual + \" to be between \" + \n       \
    \        lower + \" and \" \" + upper + \" (inclusive)\";\n      };\n      return\
    \ Math.abs(this.actual - base) <= distance;\n    }\n  });\n});\n\n));\n```\n\n\
    In this example, we're making sure that this.actual is, at most, distance away\
    \ from base. The message calculates the lower and upper bounds, and the matcher's\
    \ result is a simple bounds check."
