    \ expect(result).toEqual(\"hello world\"); // not possible without\n    calling\
    \ through\n\n    expect(dictionary.hello).toHaveBeenCalled();\n    expect(dictionary.world).toHaveBeenCalled();\n\
    \  });\n});\n```\n\nThis spy function will do everything that the old function\
    \ did, and it will be a good spy and let you see its inner workings.\n\n## Making\
    \ Sure a Spy Returns a Specific Value\n\nYou can also make sure that a spy always\
    \ returns a given value. Let's say that you want the dictionary's spy to speak\
