    \ dictionary = new Dictionary;\n  var person = new Person;\n  spyOn(dictionary,\
    \ \"hello\").andReturn(\"bonjour\"); // note this new piece\n  var result = person.sayHelloWorld(dictionary);\n\
    \  expect(result).toEqual(\"bonjour\");\n});\n```\n\nThis can be useful if you\
    \ want to make sure that despite a changed function, everything else works.\n\n\
    ## Replacing a Function with a Completely Different Spy\n\nSpies can get even\
    \ crazier. They can call through to a fake function, like so:\n\n```javascript\n\
    it(\"can call a fake function\", function() {\n  var fakeHello = function() {\n\
    \    alert(\"I am a spy!\");\n    return \"hello\";\n  };\n  var dictionary =\
    \ new Dictionary();\n  spyOn(dictionary, \"hello\").andCallFake(fakeHello);\n\
    \  dictionary.hello();\n});\n```\n\n## Creating New Spy Function\n\nIn the previous\
    \ examples, we were building spies that replaced existing functions. It is sometimes\
    \ useful to create a spy for a function that does not exist yet. If you want,\
    \ you can do that by creating a new one:\n\n```javascript\nit(\"can have a spy\"\
    , function() {\n  var person = new Person();\n  person.getName = jasmine.createSpy(\"\
    getName\");\n  person.getName();\n  expect(person.getName).toHaveBeenCalled();\n\
    });\n```\n\n## Creating a Spy Object\n\nIn addition to making a new spy function,\
    \ you can also have other methods chained onto them:\n\n```javascript\nvar tape\
    \ = jasmine.createSpyObj('tape', ['play', 'stop', 'rewind']);\ntape.play.andReturn(\"\
    James Bond\");\ntape.rewind.andCallFake(function() {\n  alert(\"I am also a spy!\"\
    );\n  return \"Evan\";\n});\n```\n\nThis can be useful for testing whether your\
