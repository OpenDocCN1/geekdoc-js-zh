  md: "+   - null\n\n+   - NaN\n\nIf you haven't seen NaN before, it's a special number\
    \ value that stands for *Not a Number*. It represents nonsensical number values\
    \ like 0/0. It's also returned by some functions that return numbers (for example,\
    \ parseInt(\"hello\") returns NaN because it cannot properly parse a number).\n\
    \nIf you want to make sure something is literally true or false and nothing else,\
    \ use the toEqual matcher like so:\n\n```\nexpect(myVariable).toEqual(true);\n\
    expect(myOtherVariable).toEqual(false);\n```\n\n# Negate Other Matchers with not\n\
    \nIt's frequently useful to reverse Jasmine's matchers to make sure that they\
    \ aren't true. To do that, simply prefix things with .not:\n\n```\nexpect(foo).not.toEqual(bar);\n\
    expect(\"Hello planet\").not.toContain(\"world\");\n```\n\n# Check If an Element\
    \ is Present with toContain\n\nSometimes you want to verify that an element is\
    \ a member of an array, *somewhere*. To do that, you can use the toContain matcher:\n\
    \n```\nexpect([1, 2, 3, 4]).toContain(3);\nexpect([\"Penguin\", \"Turtle\", \"\
    Pig\", \"Duck\"]).toContain(\"Duck\");\n```\n\nNote that contain does not check\
    \ if the array contains the *exact same* object, so the following example will\
    \ succeed:\n\n```\nvar dog = { name: \"Fido\" };\nexpect([\n  { name: \"Spike\"\
    \ },\n  { name: \"Fido\" },\n  { name: \"Spot\" }\n]).toContain(dog);\n```\n\n\
    The toContain matcher also works in strings, as we saw in the first example of\
    \ this book:\n\n```\nexpect(\"Hello world\").toContain(\"world\");\nexpect(FavoriteCandy).not.toContain(\"\
    Almond\");\n```"
