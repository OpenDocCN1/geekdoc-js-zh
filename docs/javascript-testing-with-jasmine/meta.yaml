  md: "Like other spies, spies created with jasmine.createSpy can have other methods\
    \ chained onto them:\n\n```\nperson.getSecretAgentName = jasmine.createSpy(\"\
    Name spy\").andReturn(\"James Bond\");\n\nperson.getName = jasmine.createSpy(\"\
    Name spy 2\").andCallFake(function() {\n  alert(\"I am also a spy! Ha ha!\");\n\
    \  return \"Evan Hahn\";\n});\n```\n\n# # Creating a New Spy Object\n\nIn addition\
    \ to making a new spy *function*, you can also make a new spy *object*:\n\n```\n\
    var tape = jasmine.createSpyObj('tape', ['play', 'pause', 'stop', 'rewind']);\n\
    ```\n\nIt can be used like this:\n\n```\ntape.play();\ntape.rewind(10);\n```\n\
    \nBasically, this creates an object called tape that has play, pause, stop, and\
    \ rewind functions. All of those functions are spy functions and act just like\
    \ the spies we've seen before.\n\nThis can be useful for testing whether your\
