    \ = new Person;\n    spyOn(dictionary, \"hello\"); // replace hello function with\
    \ a spy\n    spyOn(dictionary, \"world\"); // replace world function with another\n\
    \    spy\n\n    var result = person.sayHelloWorld(dictionary);\n    expect(result).toEqual(\"\
    hello world\"); // not possible without\n    calling through\n\n    expect(dictionary.hello).toHaveBeenCalled();\n\
    \    expect(dictionary.world).toHaveBeenCalled();\n  });\n});\n```\n\nThis spy\
    \ function will do everything that the old function did, and it will be a good\
    \ spy and let you see its inner workings."
