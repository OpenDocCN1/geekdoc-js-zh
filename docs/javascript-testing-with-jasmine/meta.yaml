    # CHAPTER

    Matchers in Depth


    There are a lot of useful matchers that come with Jasmine. Later in this section,
    you''ll

    also see how to build your own.


    # Equality: toEqual


    Perhaps the simplest matcher in Jasmine is toEqual. It simply checks if two things
    are

    equal (and *not* necessarily the same exact object, as you''ll see in Chapter
    5).


    The following expect functions pass:


    ```

    expect(true).toEqual(true);

    expect([1

    ```


    Here are some examples of toEqual that will fail:


    ```

    expect(5).toEqual(12);

    expect([1, 2, 4]).toEqual([1, 2, 3]);

    expect(true).toEqual(100);

    ```


    Keep in mind that this is different from the toBe matcher. The subtle difference
    is noted

    next.


    # Identity: toBe


    At first, the toBe matcher looks a lot like the toEqual matcher, but it''s not
    exactly the

    same. toBe checks if two things are the *same object*, not just if they are equivalent.


    Here''s an example that illustrates the difference between toEqual and toBe:


    ```

    var spot = { species: "Border Collie" };

    var cosmo = { species: "Border Collie" };

    expect(spot).toEqual(cosmo); // success; equivalent

    ```'
- md: "\n```javascript\nexpect(spot).toBe(cosmo); // failure; not the same object\n\
    expect(spot).toBe(spot); // success; the same object\n```\n\nWe see that, although\
    \ spot and cos look really similar and are equal, *they aren't the same object*.\
    \ Because of that, they evaluate as *equal*, not the same.\n\nThe same is also\
    \ true for arrays:\n\n```javascript\nvar arr = [1, 2, 3];\nexpect(arr).toEqual([1,\
    \ 2, 3]); // success; equivalent\nexpect(arr).toBe([1, 2, 3]); // failure; not\
    \ the same array\n```\n\nYou might notice that toBe works for primitives (numbers,\
    \ Booleans, strings). This is because JavaScript's === operator evaluates primitives\
    \ as the same entity. Using toBe is essentially using the === operator.\n\nUse\
    \ toEqual when checking the equivalence of primitive types, even if toBe will\
    \ work. Using toBe might break your tests if you later decide to change a number\
    \ to an array, for example.\n\nFor more about how this nuance works in JavaScript,\
    \ see the video JavaScript Primitive Types vs References Types.\n\n## Yes or No?\
    \ toBeTruthy, toBeFalsy\n\nTo test if something evaluates to true, you use the\
    \ toBeTruthy matcher:\n\n```javascript\nexpect(true).toBeTruthy();\nexpect(12).toBeTruthy();\n\
    expect({}).toBeTruthy();\n```\n\nLikewise, to test if something evaluates to false,\
    \ you use toBeFalsy:\n\n```javascript\nexpect(false).toBeFalsy();\nexpect(null).toBeFalsy();\n\
    expect(\"\").toBeFalsy();\n```\n\nNote that Jasmine's evaluation of truthy and\
