    # CHAPTER 2

    Jasmine


    # What Is Jasmine?


    Jasmine is a behavior-driven testing framework for JavaScript programming language.
    It''s a bunch of tools that you can use to test JavaScript code.


    As you learned in the previous chapter, you can test your code against specifications
    that you write. If your code should work in a certain way, Jasmine helps you express
    that intention in code.


    (By the way: if you''ve played around with RSpec for testing Ruby, Jasmine will
    look suspiciously familiar.)


    # Getting Set Up with Jasmine


    Start by downloading the latest standalone release of Jasmine. Unzip it.


    ![](img/b1d158c516dc77f539b87ae9a3d84247_12_0.png)


    Throughout this book, we''ll mostly be using browser-based environment for various
    reasons. If you''d prefer a different environment (Node.js, Ruby/Rails, or other
    environments), take a look at Chapter 7, or the Jasmine wiki. These instructions
    are for a browser-based environment.


    When you open SpecRunner.html in a web browser, you''ll see something like Figure
    2-1.'
