  md: "var dictionary = new Dictionary;\nvar person = new Person;\nperson.sayHelloWorld(dictionary);\
    \ // returns \"hello world\"\n\nIn you consider, to make the HelloWorld function\
    \ return the string literal hello world, but you don't want that—you want to make\
    \ sure that your Person consults the Dictionary.\n\nSpies will help you; you can\
    \ spy on the dictionary and make sure it's used. Here's how to do it:\n\n```\n\
    describe(\"Person\", function() {\n  it(\"uses the dictionary to say \"hello world\"\
    , function() {\n    var dictionary = new Person;\n    spyOn(dictionary, \"hello\"\
    ); // replace hello function with a spy\n    spyOn(dictionary, \"world\"); //\
    \ replace world function with another\n    spy\n    person.sayHelloWorld(dictionary);\n\
    \    expect(dictionary.hello).toBeHaveCalled(); // not possible without first\
    \ spy\n  });\n  });\n```\n\nLet's go through this, line by line. First, we make\
    \ our objects. Then, we'll spyOn the dictionary's hello and world methods. This\
    \ basically tells Jasmine to return dict.hello and dictionary.world with spies.\
    \ Very sneaky. Then we call person.say HelloWorld and make sure that our dictionary's\
    \ methods were called.\n\nThrowing this the spec runner should give you positive\
    \ results; your program should indeed have called the dictionary methods.\n\n\
    Why is this useful? Say you decide to make your dictionary Spanish instead of\
    \ English:\n\n```\nvar Dictionary = function() {\n  Dictionary.prototype.hello\
    \ = function() {\n    return \"hola\";\n  };\n  Dictionary.prototype.world = function()\
    \ {\n    return \"mundo\";\n  };\n```\n\nWhile HelloWorld will return different\
    \ values, the exact same spec will succeed because the dictionary is consulted\
    \ whether you're using Spanish or English!\n\nOK, maybe that's not all you. Maybe\
    \ you want to make sure that +person.+pass[<phrase role=keep-together><literal>sayHelloWorld</literal></phrase>]\
    \ is called with a specific dictionary. Jasmine has got your back. Take a look\
    \ at this example spec:\n\n28 | Chapter 6: Spies"
