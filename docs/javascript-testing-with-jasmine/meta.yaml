    \ have a web page for this book, where we list errata, examples, and any additional\
    \ information. You can access this page at http://oreil.ly/JS_Jasmine.\n\nTo comment\
    \ or ask technical questions about this book, send email to bookquestions@oreilly.com.\n\
    \nFor more information about our books, courses, conferences, and news, see our\
    \ website at http://www.oreilly.com.\n\nFind us on Facebook: http://facebook.com/oreilly\n\
    \nFollow us on Twitter: http://twitter.com/oreillymedia\n\nWatch us on YouTube:\
    \ http://www.youtube.com/oreillymedia\n\n## Acknowledgments\n\nThanks to RockMelt\
    \ for asking me to learn Jasmine.\n\nThanks to Pivotal Labs for creating Jasmine.\n\
    \nThanks to my parents for their constant support.\n\n## CHAPTER 1: Intro to Testing\n\
    \n### What Is Software Testing?\n\nIn short, you can test software against a specification.\n\
    \nLet's say you're writing a simple calculator that just does addition. Before\
    \ you even start, think about how it should behave. It should be able to add positive\
    \ integers. It should be able to add negative integers. It should be able to add\
    \ decimal numbers, not just integers. You can think of many different ways that\
    \ your calculator needs to work.\n\nBefore you've written any of the code, you\
    \ know how you want it to behave. You have a specification for its behavior.\n\
    \nYou can write these specifications in code. You'd say, \"OK, it should work\
    \ this way.\" You'd make tests that added 1 and 1, 2 and 2, -1 and 5, -1.2 and\
    \ 6.8, 0 and 0, and so on. When you run these tests, you'll either get a success\
    \ (it works according to the specification) or a failure (it doesn't). If you\
    \ run all of your tests and saw success for each, then you can be pretty sure\
    \ that your calculator works. If you run these tests and saw some failures, then\
    \ you know that your calculator doesn't work.\n\nThat's software testing in a\
    \ nutshell. You're testing your code against a specification. There are many tools\
    \ (Jasmine among them) that help you automate this software tests.\n\nIt's important\
    \ to know that it's difficult (and often impossible) to write tests for every\
    \ case. In the calculator example, there is an infinite number of possible combinations.\
    \ When testing, you should try to cover every reasonable case by testing a number\
    \ of different groups (integers, negative numbers, mixes of the two, etc.). You\
    \ should also identify boundary conditions (zeros, for example) and edge cases,\
    \ testing as many different scenarios as possible.\n\n### Why Is It Useful?\n\n\
    Testing is useful for a number of reasons.\n\nFirst, these tests can evaluate\
    \ a program's correctness after a change. Let's say all the tests are passing,\
    \ and then I decide want one of my functions to be faster. I can dive in, make\
    \ some changes, and see that it is indeed faster. But if I run the tests again\
    \ and see that some are failing, I quickly discover that my fix has broken some\
    \ part of the code. Automated testing lets me see those errors before they happen\
    \ in the \"real world\".\n\nThese tests can also function as good examples for\
    \ other developers. If a developer is trying to figure out how to use some undocumented\
    \ part of your code, a well-written test can help him see that piece works.\n\n\
    ### Test-Driven Development\n\nA relatively new software development technique\
    \ is called test-driven development, or TDD. The process works like this:\n\n\
    1. Write test cases for a specific part of your code. In the calculator example,\
    \ you'd write tests for adding positive numbers, negative numbers, integers, and\
    \ so on. You haven't written the calculator yet, so all of these tests should\
