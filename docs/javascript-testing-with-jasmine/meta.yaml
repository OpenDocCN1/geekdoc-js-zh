  md: '# CHAPTER 7

    Using Jasmine with Other Tools


    I''ve demonstrated how to run Jasmine using JavaScript in the browser, but you
    don''t have to do it that way. Jasmine works in a variety of other environments
    and with other tools.


    # Jasmine and CoffeeScript


    CoffeeScript is a language that compiles to JavaScript, and it''s beautiful. It
    makes coding in JavaScript much easier, and it reduces all makes your Jasmine
    code look better. Using CoffeeScript with Jasmine is a fairly straightforward
    process, and your specs will look pretty.


    If you don''t already use CoffeeScript, I''d strongly recommend it. It''s easy
    to learn if you know JavaScript, and it reduces a lot of the headaches that come
    with JavaScript. There are some people who don''t like CoffeeScript, though—it''s
    up to you to use it or not.


    If you want to give CoffeeScript a try, you can test it out at CoffeeScript.org,
    where you''ll also find installation instructions and documentation. If you have
    npm installed, you can install CoffeeScript like so:


    ```

    sudo npm install -g coffee-script

    ```


    If you don''t have npm or want to use CoffeeScript in a different way, check the
    CoffeeScript website for more usage instructions.


    One of the things that makes Jasmine specs look nice in CoffeeScript is the language''s
    optional parentheses. The following two lines are equivalent in CoffeeScript:


    ```

    alert("Hello world!")

    alert("Hello world!")

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Because Jasmine''s describe and it are just functions, you can write nice-looking
    specs that don''t have as many brackets and parentheses. You can have specs like
    this:


    ```

    describe "CoffeeScript Jasmine specs", ->

    it "is beautiful!", ->

    expect("your code is so beautiful").toBeTruthy()

    ```


    Aren''t those nice?


    Unfortunately, you can''t remove the parentheses from the expect calls, but you
    can easily remove them from everything else.


    For more about CoffeeScript, take a look at Alex MacCaw''s The Little Book on
    CoffeeScript (O''Reilly).


    # Jasmine and Node.js


    If you want to use Jasmine to test your Node.js projects, you can! You can use
    it to test your browser-based projects, too.


    # Installing jasmine-node on Unix and Linux


    First, you need to install the jasmine-node package. Type the following into your
    terminal:


    ```

    sudo npm install -g jasmine-node

    ```


    The -g flag installs jasmine-node on your system globally. If you''d prefer to
    keep it in a project directory, leave the flag off. This also (probably) means
    you don''t need sudo at the front.


    # Installing jasmine-node on Windows


    First, download a ZIP of jasmine-node.


    Unpack and rename the folder as jasmine-node. Once you do, move it into the same
    directory that you installed .exe into. You should be up and running!


    # Basic Usage


    Now you have jasmine-node installed! Use it as follows:


    ```

    jasmine-node /path/to/project/directory

    ```


    Jasmine-node requires you to put your specs in a directory called spec and for
    the specs in that directory to end with spec.js. You can also put specs in subdirectories
    of the spec directory.


    For example, if you have a function like this in src/test.js:'
