  md: '# Jasmine with Non-Rails Ruby


    You don''t need Rails to use Jasmine with Ruby. First, you need to install the
    Jasmine gem.


    If your project uses Bundler, add the following to your Gemfile:


    ```

    gen "jasmine"

    ```


    If not, run the following commands in the command line:


    ```

    gen install jasmine

    ```


    Once you''ve installed Jasmine, you can run it like this:


    ```

    jasmine init

    rake jasmine:ci

    ```


    You should be up and running!


    # More Tools


    There are countless ways to integrate Jasmine into your project. I''ve covered
    only a couple here, but there are plenty. There''s a section on the Jasmine wiki
    about using Jasmine with Scala, Java, .NET, and plenty more.'
