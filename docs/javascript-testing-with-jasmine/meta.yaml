- img_proc: true
  md: "# Jasmine and Ruby on Rails\n\nJasmine works well with Ruby on Rails, allowing\
    \ you to test your JavaScript without constantly editing a spec runner HTML file.\n\
    \nThe Jasmine documentation recommends one of Ryan Bates's RailsCasts as a good\
    \ way to get up with Jasmine and Rails 3+. I think it is a fantastic resource,\
    \ so give it a look if you're interested. Or you can follow along here.\n\n# Installation\n\
    \nFirst, you'll need to add Jasmine to your Gemfile, like so:\n\n```\ngem \"jasmine\"\
    \n```\n\nNext, let's install:\n\n```\nbundle install\nrails generate jasmine:install\n\
    ```\n\n# Usage\n\nNow you're all set! This process will create a directory spec\
    \ if you don't already have one. Inside of that, there's a folder javascripts.\
    \ For this example, let's make a test spec in spec/javascripts that contains this:\n\
    \n```\ndescribe(\"Jasmine + Rails test\", function() {\n  it(\"works\", function()\
    \ {\n    expect(true).toBeTruthy();\n  });\n});\n```\n\nSave this as test.spec.js.\n\
    \nNow, from any directory, run the following command:\n\n```\nrake jasmine\n```\n\
    \nAfter chugging a little bit, Jasmine will tell you that your tests are located\
    \ at http://localhost:8888. Visit that in your browser, and you'll see the test\
    \ pass! Now you can change test.spec.js to spec out whatever you'd like and go\
    \ from there.\n\nIf you'd like to run your tests in the terminal, you can do that\
    \ by running rake jasmine:ci.\n\nIf you have helpers (Jasmine plug-ins, for example),\
    \ just put them in spec/javascripts/helpers and they'll be automatically included."
  merge: -1
