  md: "# CHAPTER 6\nSpies\n\nAs we've learned, Jasmine will us test if things are\
    \ working the way we want them to. We want to ability to check if functions have\
    \ been called, and whether or not they've been called how we want to be called.\
    \ We specify how our code should work.\n\nIn Jasmine, a spy does pretty much what\
    \ its name implies: it lets you spy on pieces of your program (and in general,\
    \ the pieces that aren't variable checks). A little less exciting than James Bond,\
    \ but still cool spying.\n\n# The Basics: Spying on a Function\n\nSpying allows\
    \ you to replace a part of your program with a spy. A spy can pretend to be a\
    \ function or an object. When is this useful?\n\nLet's say that you have a class\
    \ called Dictionary. It represents an English dictionary, and can return \"hello\"\
    \ and \"world\":\n\n```\nvar Dictionary = function() {\nDictionary.prototype.hello\
    \ = function() {\n  return \"hello\";\n}\n\nDictionary.prototype.world = function()\
    \ {\n  return \"world\";\n}\n```\n\nAnd now let's say that you have a class called\
    \ Person, which should be able to output \"hello world\" using Dictionary (passed\
    \ in as argument). It might work like this:\n\n```\nvar Person = function() {\n\
    Person.prototype.sayHelloWorld = function(dict) {\n  return dict.hello() + \"\
    \ \" + dict.world();\n}\n```\n\nSo, to get your Person to return \"hello world,\"\
    \ you'd do something like this:"
