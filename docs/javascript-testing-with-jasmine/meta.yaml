  md: 'This is different from JavaScript''s built-in isNaN function. The built-in
    isNaN will return true for many nonnumeric strings, objects, and arrays. Jasmine''s
    will be positive only if it''s the value.


    # Comparators: toBeGreaterThan, toBeLessThan


    The toBeGreaterThan and toBeLessThan matchers check if something is greater than
    or less than something. All of these will pass:


    ```

    expect(8).toBeGreaterThan(5);

    expect(5).toBeLessThan(12);

    expect("a").toBeLessThan("z"); // Notice that it works for strings too!

    ```


    Not too difficult!


    # Nearness: toBeCloseTo


    toBeCloseTo allows you to check if a number is close to another number, given
    a certain amount of decimal precision as the second argument.


    If you want to make sure that a variable is close to 12.3 within one decimal point,
    you would code it like this:


    ```

    expect(12.34).toBeCloseTo(12.3, 1); // success

    ```


    If you want it to be the same with two decimal points, change the 1 to a 2. This
    spec will fail—they differ at the second decimal digit:


    ```

    expect(12.34).toBeCloseTo(12.3, 2); // failure

    expect(12.34).toBeCloseTo(12.3, 4); // failure

    expect(12.34).toBeCloseTo(12.3, 5); // failure

    // and so on...

    ```


    In this case, any second argument over 2 will fail, so the following will fail
    with:


    ```

    expect(12.345678).toBeCloseTo(12, 0); // success

    expect(500).toBeCloseTo(500.087315, 0); // success

    expect(500.087315).toBeCloseTo(500, 0); // success

    ```


    Setting the second argument to 0 effectively rounds the number to integers:


    I find toBeCloseTo a confusing and limiting. In "Custom Matchers" on page 20,
    we''ll make a matcher that aims to improve it.


