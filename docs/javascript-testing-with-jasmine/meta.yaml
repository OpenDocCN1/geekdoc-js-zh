    I''ve demonstrated how to run Jasmine using JavaScript in the browser, but you
    don''t have to do it that way. Jasmine works in a variety of other environments
    and with other tools.


    # Jasmine and CoffeeScript


    CoffeeScript is a language that compiles to JavaScript, and it''s beautiful. It
    makes coding in JavaScript much easier, and it reduces all makes your Jasmine
    code look better. Using CoffeeScript with Jasmine is a fairly straightforward
    process, and your specs will look pretty.


    If you don''t already use CoffeeScript, I''d strongly recommend it. It''s easy
    to learn if you know JavaScript, and it reduces a lot of the headaches that come
    with JavaScript. There are some people who don''t like CoffeeScript, though—it''s
    up to you to use it or not.


    If you want to give CoffeeScript a try, you can test it out at CoffeeScript.org,
    where you''ll also find installation instructions and documentation. If you have
    npm installed, you can install CoffeeScript like so:


    ```

    sudo npm install -g coffee-script

    ```


    If you don''t have npm or want to use CoffeeScript in a different way, check the
    CoffeeScript website for more usage instructions.


    One of the things that makes Jasmine specs look nice in CoffeeScript is the language''s
    optional parentheses. The following two lines are equivalent in CoffeeScript:


