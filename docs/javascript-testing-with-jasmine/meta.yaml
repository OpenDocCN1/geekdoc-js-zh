    \ 等更多框架一起使用 Jasmine。\n\n# 第 8 章\n参考\n\n# Web 上的 Jasmine\n\n- 下载 Jasmine\n- Jasmine\
    \ wiki\n\n# 测试套件的基本结构\n\n```javascript\ndescribe(\"colors\", function() {\n  describe(\"\
    red\", function() {\n    var red;\n    beforeEach(function() {\n      red = new\
    \ Color(\"red\");\n    });\n    afterEach(function() {\n      red = null;\n  \
    \  });\n    it(\"has the correct value\", function() {\n      expect(red.hex).toEqual(\"\
    FF0000\");\n    });\n  });\n  it(\"makes orange when mixed with yellow\", function()\
    \ {\n    var yellow = new Color(\"yellow\");\n    var orange = new Color(\"orange\"\
    );\n    expect(red.mix(yellow)).toEqual(orange);\n  });\n});\n```\n\n# 匹配器参考\n\
    \n- `toEqual` 检查相等性，而不一定是同一个对象。\n- `toBe` 如果两个对象是相同的。\n- `toBeTruthy` 检查一个值是否为真（而不仅仅是\
    \ true）。\n- `toBeFalsy` 检查一个值是否为假（而不仅仅是 false）。\n- `toContain` 检查一个值是否在另一个内部。\n\
    - `toDefined` 检查一个值是否已定义。\n- `toUndefined` 检查一个值是否未定义。\n- `toNull` 检查一个值是否为 null。\n\
    - `toBeCloseTo` 小数接近度。\n- `toMatch` 检查一个值是否匹配给定的正则表达式。\n- `toThrow` 检查函数是否抛出了错误。\n\
    - `.not` 反转后续匹配器的含义。\n\n# 假值列表\n\n- false\n- 0\n- undefined（注意：undefined 变量并不总是\
