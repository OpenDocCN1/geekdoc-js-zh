  md: "# CHAPTER 3\nWriting Good Tests\n\nSo, now you know how to write tests with\
    \ Jasmine. In theory, you could write an infinite\nnumber of tests for your code,\
    \ testing weird conditions and more, but you don't\nunlimited time on your hands.\
    \ You have to write the correct specs for the job.\n\nThis is subjective; none\
    \ of this is gospel by any means. These are simply my recom-\\mendations after\
    \ having worked with Jasmine on a number of projects.\n\n# Cardinal Rule: When\
    \ in Doubt, Test\n\nIf you're not sure whether not to test something, it probably\
    \ doesn't hurt to test it. If\nit would take you, as the developer, a long time\
    \ to develop the spec, you might want to\nake sure you really need to build it.\
    \ If it'd make Jasmine run slowly (perhaps it's doing\na large computation), you\
    \ might also want to reconsider. Usually, specs are pretty short\nand speedy,\
    \ so if you're not sure, make a spec!\n\n# Test Components\n\nTest individual\
    \ components of your code, rather than everything at once. For example,\nif you\
    \ have a Calculator class, you don't want to test it like this:\n\n```\ndescribe(\"\
    calculator addition\", function() {\n  it(\"add, subtract, multiply, and divide\
    \ positive integers\",\nfunction() {\n    var calc = new Calculator;\n    expect(calc.add(2,\
    \ 3)).toEqual(5);\n    expect(calc.sub(8, 5)).toEqual(3);\n    expect(calc.mult(4,\
    \ 3)).toEqual(12);\n    expect(calc.div(12, 4)).toEqual(3);\n  });\n});\n```"
