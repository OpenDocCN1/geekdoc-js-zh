  md: '# CHAPTER

    Matchers in Depth


    There are a lot of useful matchers that come with Jasmine. Later in this section,
    you''ll

    also see how to build your own.


    # Equality: toEqual


    Perhaps the simplest matcher in Jasmine is toEqual. It simply checks if two things
    are

    equal (and *not* necessarily the same exact object, as you''ll see in Chapter
    5).


    The following expect functions pass:


    ```

    expect(true).toEqual(true);

    expect([1

    ```


    Here are some examples of toEqual that will fail:


    ```

    expect(5).toEqual(12);

    expect([1, 2, 4]).toEqual([1, 2, 3]);

    expect(true).toEqual(100);

    ```


    Keep in mind that this is different from the toBe matcher. The subtle difference
    is noted

    next.


    # Identity: toBe


    At first, the toBe matcher looks a lot like the toEqual matcher, but it''s not
    exactly the

    same. toBe checks if two things are the *same object*, not just if they are equivalent.


    Here''s an example that illustrates the difference between toEqual and toBe:


    ```

    var spot = { species: "Border Collie" };

    var cosmo = { species: "Border Collie" };

    expect(spot).toEqual(cosmo); // success; equivalent

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: '```

    expect(spot).toBe(cosmo); // failure; not the same object

    expect(spot).toBe(spot); // success; the same object

    ```


    We see that, although spot and cos look really similar and are equal, *they aren''t
    the same object*. Because of that, they evaluate as *equal*, not the same.


    The same is also true for arrays:


    ```

    var arr = [1, 2, 3];

    expect(arr).toEqual([1, 2, 3]); // success; equivalent

    expect(arr).toBe([1, 2, 3]); // failure; not the same array

    ```


    You might notice that toBe works for primitives (numbers, Booleans, strings).
    This is because JavaScript''s === operator evaluates primitives as the same entity.
    Using toBe is essentially using the === operator.


    Use toEqual when checking the equivalence of primitive types, even if toBe will
    work. Using toBe might break your tests if you later decide to change a number
    to an array, for example.


    For more about how this nuance works in JavaScript, see the video JavaScript Primitive
    Types vs References Types.


    # Yes or No? toBeTruthy, toBeFalsy


    To test if something evaluates to true, you use the toBeTruthy matcher:


    ```

    expect(true).toBeTruthy();

    expect(12).toBeTruthy();

    expect({}).toBeTruthy();

    ```


    Likewise, to test if something evaluates to false, you use toBeFalsy:


    ```

    expect(false).toBeFalsy();

    expect(null).toBeFalsy();

    expect("").toBeFalsy();

    ```


    Note that Jasmine''s evaluation of truthy and falsy are identical to JavaScript''s.
    This means that true is truthy, but so is "Hello world", or the number 12, or
    an object. It''s useful to think of all the things that are false, and everything
    else is true.


    For reference, here''s a list of things that are false in Jasmine (and in JavaScript,
    too):


    +   * false

    * 0

    * ""

    * undefined (note that the variable undefined isn''t always undefined!)'
