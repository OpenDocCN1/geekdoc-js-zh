    \ Jasmine）应该自动为你完成这一点。\n\n这两个大准则允许你运行测试套件并*精确地*看到哪里出了问题。如果你看到一堆成功但在“计算器加负数”上有一个失败，你就知道该去哪里找了。Dan\
    \ North 被认为 BDD 的发明者。\n\n## 第 2 章：Jasmine\n\n### 什么是 Jasmine？\n\nJasmine 是一个行为驱动的\
