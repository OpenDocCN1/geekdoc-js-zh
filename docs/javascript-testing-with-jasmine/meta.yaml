  md: "# CHAPTER 5\nMore Jasmine Features\n\nJasmine has a number of other useful\
    \ features, which help you write tests that are more advanced.\n\n# Before and\
    \ After\n\nAnother useful feature of Jasmine is actually a twofer: beforeEach\
    \ and afterEach. They allow you to execute some code—you guessed it—before and\
    \ after each spec. This can be very useful for factoring out common code or cleaning\
    \ up variables after tests.\n\nTo execute some code before every spec, simply\
    \ put it in a beforeEach. Note that you have to scope variables properly in order\
    \ to have them throughout each spec:\n\n```\ndescribe(\"employee\", function()\
    \ {\n  var employee; // Note the scoping of this variable.\n  beforeEach(function()\
    \ {\n    employee = new Employee;\n  });\n  it(\"has a name\", function() {\n\
    \    expect(employee.name).toBeDefined();\n  });\n  it(\"has a role\", function()\
    \ {\n    expect(employee.role).toBeDefined();\n  });\n});\n```\n\nSimilarly, if\
    \ you'd like to execute something after each spec, simply put it in the cleverly\
    \ named afterEach. I use this much less than beforeEach, but it's useful when\
    \ you want to do cleanup, for example:\n\n```\ndescribe(\"Calculator\", function()\
    \ {\n  var calculator = new Calculator;\n  afterEach(function() {\n    calculator.reset();\n\
    \  });\n```"
