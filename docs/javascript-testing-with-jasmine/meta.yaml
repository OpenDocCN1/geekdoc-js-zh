    \ will succeed:\n\n```\nexpect(\"foo bar\").toMatch(/bar/);\nexpect(\"error_ebook.jpg\"\
    ).toMatch(/\\w+\\.(jpg|png|svg)/i);\nexpect(\"jasmine@example.com\").toMatch(/\\\
    w+@\\w+\\.\\w+\");\n```\n\nFor more regular expressions in JavaScript, check this\
    \ very helpful article on the Mozilla Developer Network. (Note that these regular\
    \ expression examples aren't thorough as they could be—a better regular expression\
    \ is very long!)\n\n# Checking If a Function Throws an Error with toThrow\n\n\
    Throw lets you express, \"Hey, I expect this function to throw an error\":\n\n\
    ```\nvar throwMeAnError = function() {\n  throw new Error();\n};\nexpect(throwMeAnError).toThrow();\n\
    ```\n\nYou can use this with anonymous functions too, which can be more useful.\
    \ For example, let's say there's a function that should throw an exception with\
    \ bad input, like so:\n\n```\ncalculate(\"BAD INPUT\"); // This should throw exciting\
    \ exception\n```\n\nTo test that, we use Jasmine like so:\n\n```\nexpect(function()\
    \ {\n  calculate(\"BAD INPUT\");\n}).toThrow();\n```\n\nWhether you use an anonymous\
    \ or named function, you still need to pass a function because Jasmine will call\
    \ it when running your specs.\n\n# Custom Matchers\n\nYou can create custom matchers,\
    \ too! You must add the matcher before every spec in which you want it, you must\
    \ add it. To do that, we'll be using beforeEach, which is explained in more detail\
    \ in Chapter 5.\n\nLet's say you want to add a matcher called toBeLarge, which\
    \ checks if a number is greater than 100. At the very top of a function (or at\
    \ the top of a describe), you can add the following:\n\n```\nbeforeEach(function()\
    \ {\n  this.addMatchers({\n    toBeLarge: function() {\n      this.message = function()\
    \ {\n```"
