  md: '# Is It Defined? toBeDefined, toBeUndefined


    As with truthness and falseness, there are matchers to check if something is defined
    or undefined.


    Before we start, let''s briefly review JavaScript''s notion of undefined and how
    it compares to null: when you declare a new variable with no value specified,
    its type is "undefined" (just like 123''s type is "number"). In other languages,
    it might be null or nil. Not in JavaScript! There''s a lot of confusion around
    this, but it doesn''t directly apply to Jasmine.


    For more background on undefined and how it works, check out Understanding JavaScript''s
    "undefined".


    Here are a few examples to demonstrate how these matchers work:


    ```

    var somethingUndefined;

    expect("Hello").toBeDefined(); // success

    expect(null).toBeDefined(); // success

    expect(somethingUndefined).toBeDefined(); // failure


    var somethingElseUndefined;

    expect(somethingElseUndefined).toBeUndefined(); // success

    expect(12).toBeUndefined(); // failure

    expect(null).toBeUndefined(); // failure

    ```


    It''s worth noting that the variables you''re checking have to be defined. The
    code throws a ReferenceError and will fail:


    ```

    it("testsUndefined", function() {

    expect(undefinedVariable).toBeUndefined();

    // Throws a ReferenceError because someUndefinedVariable hasn''t been declared.

    });

    ```


    # Null: toBeNull


    The toBeNull matcher is fairly straightforward. If you hadn''t guessed by now,
    it checks if something is null:


    ```

    expect(null).toBeNull(); // success

    expect(false).toBeNull(); // failure

    expect(somethingUndefined).toBeNull(); // failure

    ```


    Fairly simple!


    # Is It NaN?: toBeNaN


    Like toBeNull, toBeNaN checks if something is NaN:


    ```

    expect(5).not.toBeNaN(); // success

    expect(0 / 0).toBeNaN(); // success

    expect(parseInt("hello")).toBeNaN(); // success

    ```'
