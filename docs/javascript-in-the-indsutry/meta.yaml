    \ {\n  if (candidate) {\n    const member = members.find(\n      (member) => member.name\
    \ === candidate\n    );\n\n    if (member) {\n      const hasLegalAge = member.age\
    \ > 18;\n\n      if (hasLegalAge) {\n        return member;\n      }\n    }\n\
    \  }\n}\n```\n```\n\nWe have a function, `getValidCandidate`, which checks if\
    \ a candidate is valid, provided a list of members and returns the member if the\
    \ candidate is valid, or undefined otherwise.\n\nThe code is sound.\nBut look\
    \ how nested is it? *If* wrapping other *ifs*, nested 3 times.\n\nUhf. Let's rewrite\
    \ this and use **guard clauses** instead."
  - "[PAGE 29]\n\n```\nfunction getValidCandidate(candidate, members) {\n  if (!candidate)\
    \ {\n    return;\n  }\n  const member = members.find(\n    (member) => member.name\
    \ === candidate\n  );\n  if (!member) {\n    return;\n  }\n  const hasLegalAge\
    \ = member.age > 18;\n  if (!hasLegalAge) {\n    return;\n  }\n  return member;\n\
    }\n```\n\nMuch better! *We flattened* all the nested levels.\n\nAnd we’re now\
    \ using **guard clauses**.\n\nNotice how we have these breakpoints in the function\
    \ every time we check if something is *falsy*?\n\nThese are the guards.\n\nThey\
    \ prevent the function from continuing what it's doing and instead returning early\
    \ if the *guarding condition* is not met.\n\nNaturally, we also know that the\
    \ end result is the *last* return of the function."
- md: "\n# Skip the 'else' part\n\nThe if-else statement. It's one of the first things\
    \ we learn when starting to program.\n\nNow, let's move on by unlearning how to\
    \ use else.\n\nGenerally speaking, if your function includes an else, it's a sign\
    \ that your function is doing more than one thing.\n\nIt's violating the well-known\
    \ Single Responsibility Principle, and often results in error-prone branching\
    \ logic that gets hard to wrap your head around at scale.\n\nSo as a rule of thumb,\
    \ whenever you're about to write else, stop and reconsider what you're doing and\
    \ search for an alternative way to express the logic.\n\nLet's cover a few ways\
    \ that we can avoid using else.\n\nOne of them is guard clauses, which we just\
    \ covered above.\n\nAnother approach is using default values.\n\nLet's take an\
    \ example.\n\nLet's say we have a function, `negateOdd`, which takes a number\
    \ and negates it if the number is odd.\n\n```javascript\nfunction negateOdd(n)\
    \ {\n  let result;\n\n  if (n % 2 === 0) {\n    result = n;\n  } else {\n    result\
    \ = n * -1;\n  }\n\n  return result;\n}\n```\n\nThe function does what it's supposed\
    \ to. But it's unnecessarily using an else. Let's refactor it, and instead, use\
    \ a default value.\n\n```javascript\nfunction negateOdd(n) {\n  let result = n;\n\
    \n  if (n % 2 === 0) {\n    result = n * -1;\n  }\n\n  return result;\n}\n```\n\
    \nBetter already! We now assign result with a default value, and the variable\
    \ will only be changed if the condition in the if-statement is met.\n\nNow, we\
    \ also wrap the special case of the function in an if.\nYou could argue that when\
    \ reading this function later it might help us quickly pinpoint where the essential\
    \ part of the logic is going on.\n\nBut let's do even better. We know from the\
    \ previous chapter that we're supposed to question the use of let and imperative\
    \ code.\nLet's see if we can make this function even more readable and concise.\n\
    \n```javascript\nfunction negateodd(n) {\n  if (n % 2 === 0) {\n    return n;\n\
    \  }\n\n  return n * -1;\n}\n```\n\nThere we go! No variable assignment at all.\
    \ Only different return values based on the given condition.\n\nNotice how we\
    \ moved that essential part of the logic to the end of the function body. A lot\
    \ of developers prefer having the essential part of a function's job put at the\
    \ end of the function body - just like we did with the guard clause before.\n\n\
    There is a version of if-else that is generally accepted.\nIt's the ternary operator.\n\
    \n```javascript\nfunction negateOdd(n) {\n  return n % 2 === 0 ? n : n * -1;\n\
    }\n```\n\nA ternary operator is essentially an if-else.\n\nSo, why is this accepted\
    \ if we're supposed to avoid using else?\nBecause it's used to assign or return\
    \ a value directly.\nThere's no body. No opening to writing multiple lines of\
    \ logic.\n\nThat's also why the ternary operator should be restricted to only\
    \ such usage.\nI have seen developers misuse the ternary operator to branch the\
    \ control flow in very creative and mysterious ways, including the use of nested\
    \ ternaries, which is - by the vast majority of professional teams - considered\
    \ filthy code that should be strictly avoided.\n\nYou could argue how readable\
    \ and clean the solution using ternary operator above is, but in most cases, a\
    \ function like this would pass a code review.\n\n# Using a switch-statement\n\
    \nMost likely, you're not going to need it too often, but there are cases where\
    \ a switch-statement makes sense.\n\n```javascript\nfunction pointsFromGrade(grade)\
    \ {\n  switch (grade) {\n    case \"A\":\n      return 10;\n    case \"B\":\n\
    \      return 8;\n    case \"C\":\n      return 5;\n    case \"I\":\n      return\
    \ 3;\n    case \"F\":\n      return -1;\n    default:\n      return NaN;\n  }\n\
    }\n```\n\nIf you're about to write if-else-if-else... a series of times, you probably\
    \ want to consider using a switch-statement instead.\n\nThere are certain libraries,\
    \ for Redux, for React, that have been using switch-statements as part of their\
    \ reducers, per convention.\n\nYet, for a case like this, you could use an object\
    \ to store the values instead.\nIf the values need logic, you could store functions\
    \ in the object, and call it after an object lookup.\n\n```javascript\nconst pointsFromGrade\
    \ = {\n  A: 10,\n  B: 8,\n  C: 5,\n  I: 3,\n  F: -1\n};\n\nconst p = pointsFromGrade(\"\
    B\");\n```\n\n# Using functions and partial applications\n\nIf you find yourself\
    \ overusing statements and operators that change the control flow, it's typically\
    \ a symptom of your code doing too much. You get what's commonly known as spaghetti\
    \ code.\n\nTake a look at this made-up example. Do you recognize it? I bet you've\
    \ been writing this more than not.\n\n```javascript\nif (someCondition) {\n  const\
    \ toBeUpdated = [];\n  for (let i = 0; i < someArray.length; i++) {\n    const\
    \ hasChanged = didChange(someArray[i]);\n    if (!hasChanged) {\n      toBeUpdated.push(someArray[i]);\n\
    \    }\n  }\n  if (!toBeUpdated.length) {\n    return;\n  }\n} else {\n  const\
    \ service = SomeService();\n  service.doSomething();\n  if (someCondition ===\
    \ null) {\n    return();\n  }\n}\n```\n\nIn particular, notice how the code in\
    \ if and else seems unrelated. I think we can agree that it's hard to follow the\
    \ logic of this kind of code, and it's really easy to sneak in a bug here that\
    \ can take hours to spot.\n\nWhen you find yourself writing code like this, splitting\
    \ into individual functions. You'll end up with a nice, flat list of function\
    \ calls instead, each representing what they do. To include conditionals, you\
    \ can consider using partial applications. Without going into much detail, partial\
    \ application in JavaScript is when a function returns another function, and when\
    \ that inner function gets invoked, it'll have access to the variables from the\
    \ scope of the outer function. This is also known as closure.\n\nTake a look at\
    \ the illustration below as a quick reference.\n\n```javascript\nfunction outer()\
    \ {\n  const n = 42;\n\n  const inner = function() {\n    // inner can access\
    \ 'n'\n    console.log(n);\n  }\n\n  return inner;\n}\n```\n\n```javascript\n\
    const inner = outer();\ninner(); // 42\n```\n\nI have to admit that it's not something\
    \ I have seen used often. Granted, this is a more advanced technique from functional\
    \ programming. Yet, in certain cases, you can use it to create some concise and\
    \ useful constructs.\n\nLet’s take an example. Here, we have a function, `multiply`,\
    \ which takes three numbers as arguments and multiplies them. What makes this\
    \ case complicated is that only the first argument is mandatory. That means we\
    \ have to check for the arguments `b` and `c` before performing the multiplication.\n\
    \n```javascript\nfunction multiply(a, b, c) {\n  if (a && !b) {\n    return a;\n\
    \  }\n\n  if (a && b && !c) {\n    return a * b;\n  }\n\n  if (a && b && c) {\n\
    \    return a * b * c;\n  }\n\n  const m1 = multiply(2); // 2\n  const m2 = multiply(2,\
    \ 2); // 4\n  const m3 = multiply(2, 2, 2); // 8\n```\n\nAs you can see, this\
    \ quickly becomes confusing. A lot of if statements are needed to verify the validity\
    \ of the input, and it doesn’t cover all cases - certain assumptions are still\
    \ made here.\n\nLet's try to refactor it using the construct of a partial application\
    \ instead.\n\n```javascript\nfunction multiply(a) {\n  return function (b) {\n\
    \    return b ? multiply(b * a) : a;\n  }\n}\n\nconst m1 = multiply(2)(); // 2\n\
    const m2 = multiply(2)(2); // 4\nconst m3 = multiply(2)(2)(2); // 8\n\nconsole.log(m1,\
    \ m2, m3);\n```\n\nAs you see, we got the multiply function slimmed down a lot.\
    \ And not only that - now the function can actually multiply an indefinite amount\
    \ of numbers, provided one part at a time.\n\nLet's break down what's happening\
    \ here. The function multiply is returning another function that, if given an\
    \ argument b, calls itself recursively and applies a from the outer function multiplied\
    \ with b. If b is not provided, it simply returns a.\n\nDon't worry if this seems\
    \ confusing at first. Let's take a more lightweight, practical example from React\
    \ instead.\n\nWe're updating a form using controlled input fields.\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_40_0.png)\n\
    \n```javascript\nfunction App() {\n  const [username, setUsername] = useState('');\n\
    \  const [password, setPassword] = useState('');\n\n  const setInput = (setter)\
    \ => (event) => {\n    setter(event.currentTarget.value);\n  }\n\n  return (\n\
    \    <form>\n      <input\n        value={username}\n        onChange={setInput(setUsername)}\n\
    \      />\n      <input\n        value={password}\n        onChange={setInput(setPassword)}\n\
    \      />\n    </form>\n  );\n}\n```\n\nInstead of using multiple function calls,\
    \ arrow function expressions inside of the JSX, or if-statements to determine\
    \ which state to update, we use a partial application (in this case by currying),\
    \ to take a setter function as an argument and then return the handler that is\
    \ provided to the onChange prop.\n"
  mdcn: "\n\n# 跳过 'else' 部分\n\nif-else 语句。这是我们开始学习编程时首先学到的内容之一。\n\n现在，让我们通过“忘记”如何使用\
