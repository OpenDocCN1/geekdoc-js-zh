- img_proc: true
  md: "If you need to do this, either declare the function inside useEffect and call\
    \ it immediately after, or - better - declare it in the component scope instead.\n\
    \n```\nexport function App() {\n  const callSomeApi = async () => {\n    await\
    \ fetch(\"https://some.api\");\n  }\n\n  useEffect(() => {\n    callSomeApi();\n\
    \  }, []);\n\n  return <div className=\"App\"></div>;\nn\n```\n\nMuch better!\
    \ Most likely, as logic grows, we'd have to do that at some point anyway. We might\
    \ as well just do it now and keep the code clean.\n\n# Don't overuse the inbuilt\
    \ hooks\n\nYes, hooks are super cool! And when you learn how to use them, you\
    \ may feel the urge to put them everywhere.\nPlease don't.\n\n# Stop using useMemo\n\
    \nI've encountered this a lot. The fear of assigning a variable from a function\
    \ call directly in the component leads developers to use useMemo."
  merge: -1
  pgno: 61
- img_proc: true
  md: "Let’s take an example.\n\n```\nexport function App({ username, type }) {\n\
    \  const computedValue = useMemo(() => {\n    return getComputedValue(username,\
    \ type);\n  }, [page, type])\n\n  return <HeavyComponent computedValue={computedValue}\
    \ />\n}\n```\n\nIt’s easy to see how the developer has been reasoning here.\n\n\
    The HeavyComponent shouldn’t rerender unnecessarily, so the computedValue is memoized.\n\
    \nThe useMemo hook is meant to prevent extensive computation every time a component\
    \ re-renders, so the first thing we ask ourselves here is; is the getComputedValue\
    \ actually an extensive operation?\n\nIn most cases, it’s not.\n\nAnd the cost\
    \ of having React manage a memoized value actually outweighs the performance benefits\
    \ you get from using useMemo.\n\nInstead, don’t be afraid of calling getComputedValue\
    \ directly from the root of the component."
  merge: -1
  pgno: 62
- img_proc: true
  md: "```\nexport function App({ username, type }) {\n  const computedValue = getComputedValue(username,\
    \ type);\n\n  return <HeavyComponent computedValue={computedValue} />\n}\n```\n\
    \nIf the computedValue resolves to a primitive (a string, number, boolean, etc),\n\
    \ don't have to worry about HeavyComponent re-rendering either.\nIf the value\
    \ doesn't change, it won't re-render.\n\n# Stop overusing useCallback\n\nSimilarly,\
    \ I've seen the useCallback hook being overused as well.\nIt mostly boils down\
    \ to two situations:\n\nEither useCallback is used to set an initial state while\
    \ preventing an infinite\nrender-loop. But in this case, useEffect is really the\
    \ hook for the job.\n\nOr, it is in the belief that the result will be memoized.\n\
    In that case, useMemo is the hook for the job, but most likely, you simply want\n\
    to compute whatever you need in the component itself.\n\nIn fact, improper use\
    \ of useCallback actually worsens performance.\nIf you're in doubt when to use\
    \ useCallback, remember that as a rule of thumb,\nyou're not going to need it."
