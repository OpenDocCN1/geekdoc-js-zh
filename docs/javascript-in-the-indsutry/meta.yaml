  md: "```\nfunction getValidCandidate(candidate, members) {\n  if (!candidate) {\n\
    \    return;\n  }\n  const member = members.find(\n    (member) => member.name\
    \ === candidate\n  );\n  if (!member) {\n    return;\n  }\n  const hasLegalAge\
    \ = member.age > 18;\n  if (!hasLegalAge) {\n    return;\n  }\n  return member;\n\
    }\n```\n\nMuch better! *We flattened* all the nested levels.\n\nAnd we’re now\
    \ using **guard clauses**.\n\nNotice how we have these breakpoints in the function\
    \ every time we check if something is *falsy*?\n\nThese are the guards.\n\nThey\
    \ prevent the function from continuing what it's doing and instead returning early\
    \ if the *guarding condition* is not met.\n\nNaturally, we also know that the\
    \ end result is the *last* return of the function."
