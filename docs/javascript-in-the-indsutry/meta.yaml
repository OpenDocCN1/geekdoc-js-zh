  - '[PAGE 36]


    I think we can agree that it''s hard to follow the logic of this kind of code,
    and that it''s really easy to sneak in a bug here, and can take hours to spot.


    When you find yourself writing code like this, back up, and start splitting into
    individual functions.


    You''ll end up with a nice, flat list of function calls instead, each with a name
    representing what they do.


    To include conditionals, you can consider using *partial applications*.


    Without going into too much detail, a *partial application* in JavaScript, is
    when a function returns another function, and when that inner function gets invoked,
    it''ll have access to the variables from the scope of the outer function. This
    is also known as a closure.


    Take a look at the illustration below as a quick reference.'
  - "[PAGE 37]\n\n```\nfunction outer() {\n  const n = 42;\n\n  const inner = function()\
    \ {\n    // inner can access 'n'\n    console.log(n);\n  }\n\n  return inner;\n\
    }\n```\n\n```\nconst inner = outer();\ninner(); // 42\n```\n\nI will have to admit\
    \ that it's not something I have seen used too often.\nGranted, this is a more\
    \ advanced technique from functional programming.\n\nYet, in certain cases, you\
    \ can use it to create some quite concise and useful constructs."
  - "[PAGE 38]\n\nLet’s take an example.\n\nHere, we have a function, *multiply*,\
    \ which takes three numbers as arguments\n multiplies them. What makes this case\
    \ complicated, is that only the first\nargument is mandatory. That means we have\
    \ to check for the arguments *b\nand c before performing the multiplication.\n\
    \n```\nfunction multiply(a, b, c) {\n  if (a && !b) {\n    return a;\n  }\n\n\
    \  if (a && b && !c) {\n    return a * b;\n  }\n\n  if (a && b && c) {\n    return\
    \ a * b * c;\n  }\n\n  const m1 = multiply(2); // 2\n  const m2 = multiply(2,\
    \ 2); // 4\n  const m3 = multiply(2, 2, 2); // 8\n```\n\nAs you can see, this\
    \ quickly becomes confusing.\nA lot of if statements are needed to verify the\
    \ validity of the input, and it\ndoes’t even cover all cases - certain assumptions\
    \ are still made here."
  - "[PAGE 39]\n\nLet's try to refactor it using the construct of a partial application\
    \ instead.\n\n```\nfunction multiply(a) {\n  return function (b) {\n    return\
    \ b ? multiply(b * a) : a;\n  }\n}\n\nconst m1 = multiply(2)(); // 2\nconst m2\
    \ = multiply(2)(2); // 4\nconst m3 = multiply(2)(2)(2); // 8\n\nconsole.log(m1,\
    \ m2, m3);\n```\n\nAs you see, we got the multiply function slimmed down a lot.\n\
    And not only that - now the function can actually multiply an indefinite amount\
    \ of numbers, provided one part at a time.\n\nLet's break down what's happening\
    \ here.\nThe function multiply is returning another function that, if given an\
    \ argument b, calls itself recursively and applies a from the outer function multiplied\
    \ with b. If b is not provided, it simply returns a.\n\nDon't worry if this seems\
    \ confusing at first.\\nLet's take a more lightweight, practical example from\
    \ React instead."
  - "[PAGE 40]\n\nWe're updating a form using controlled input fields.\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_40_0.png)\n\
    \n```\nfunction App() {\n  const [username, setUsername] = useState('');\n  const\
    \ [password, setPassword] = useState('');\n\n  const setInput = (setter) => (event)\
    \ => {\n    setter(event.currentTarget.value);\n  }\n\n  return (\n    <form>\n\
    \      <input\n        value={username}\n        onChange={setInput(setUsername)}\n\
    \      />\n      <input\n        value={password}\n        onChange={setInput(setPassword)}\n\
    \      />\n    </form>\n  );\n}\n```\n\nInstead of using multiple function calls,\
    \ arrow function expressions inside of the JSX, or if-statements to determine\
    \ which state to update, we use a partial application (in this case by currying),\
