  - "[PAGE 58]\n\n# Don't return JSX from inner functions\n\nI've seen this pattern\
    \ a lot, and I've been involved in a few discussions on this pattern.\n\nYet,\
    \ I've found that most teams dislike this.\nIf you're about to declare an inner\
    \ function in a component (perhaps with a prefix render) that renders JSX conditionally,\
    \ you should reconsider.\n\n```\nexport function App({ username, isLoading })\
    \ {\n  const renderUsername = () => {\n    if (isLoading) {\n      return <div>Is\
    \ Loading...</div>;\n    }\n\n    return <p>{username}</p>\n  };\n\n  return <div\
    \ className=\"App\">{renderUsername()}</div>;\n}\n```\n\nIf you find the need\
    \ to return JSX conditionally, you can use these two popular solutions:\n\n+ \
    \  - Ternary inside the JSX\n- Split into a separate component"
  - "[PAGE 59]\n\n# Ternary inside the JSXK\n\nI've been involved in countless discussions\
    \ on the use of ternary inside the\nJSX, and there seem to be quite heated opinions\
    \ about it.\n\nFrom my experience, most developers are good with a solution like\
    \ this, as\nlong as the logic is kept simple.\n\n```\nexport function App({ username,\
    \ isLoading }) {\n  return (\n    <div className=\"App\">\n      {isLoading ?\
    \ <div>Is Loading...</div> : <p>{username}</p>\n    </div>\n  );\n}\n```\n\n#\
    \ Split into a separate component\n\n```\nexport function App({ username, isLoading\
    \ }) {\n  return (\n    <div className=\"App\">\n      <LoadingUsername username={username}\
    \ isLoading={isLoading} />\n    </div>\n  );\n}\n\nfunction LoadingUsername({\
    \ username, isLoading }) {\n  if (isLoading) {\n    return <div>Is Loading...</div>;\n\
    \  }\n  return <p>{username}</p>\n}\n```"
- md: "\nThis is the most “correct” way to do this in React.\nIt comes with the price\
    \ of having to pass down the username and isLoading props an extra level, and\
    \ if callbacks are needed, these will have to be passed as well.\n\n## Don't wrap\
    \ useEffect in an async IIFE\n\nI've seen this pattern around a few times, and\
    \ it's never a super popular solution.\n\nYou probably recognize the use case.\
    \ You need to do something asynchronous in useEffect, but you cannot use the await\
    \ keyword.\n\n```javascript\nexport function App() {\n  useEffect(() => {\n  \
    \  (async () => {\n      await fetch(\"https://some.api\");\n    })();\n  }, []);\n\
    \n  return <div className=\"App\"></div>;\n}\n```\n\nSome would argue that you\
    \ should be careful about doing something asynchronous in useEffect, to begin\
    \ with.\n\nIn any circumstances, this is not pretty!\n\nIf you need to do this,\
    \ either declare the function inside useEffect and call it immediately after,\
    \ or - better - declare it in the component scope instead.\n\n```javascript\n\
    export function App() {\n  const callSomeApi = async () => {\n    await fetch(\"\
    https://some.api\");\n  }\n\n  useEffect(() => {\n    callSomeApi();\n  }, []);\n\
    \n  return <div className=\"App\"></div>;\n}\n```\n\nMuch better! Most likely,\
    \ as logic grows, we'd have to do that at some point anyway. We might as well\
    \ just do it now and keep the code clean.\n\n## Don't overuse the inbuilt hooks\n\
    \nYes, hooks are super cool! And when you learn how to use them, you may feel\
    \ the urge to put them everywhere.\nPlease don't.\n\n## Stop using useMemo\n\n\
    I've encountered this a lot. The fear of assigning a variable from a function\
    \ call directly in the component leads developers to use useMemo.\n\nLet’s take\
    \ an example.\n\n```javascript\nexport function App({ username, type }) {\n  const\
    \ computedValue = useMemo(() => {\n    return getComputedValue(username, type);\n\
    \  }, [page, type])\n\n  return <HeavyComponent computedValue={computedValue}\
    \ />\n}\n```\n\nIt’s easy to see how the developer has been reasoning here.\n\n\
    The HeavyComponent shouldn’t rerender unnecessarily, so the computedValue is memoized.\n\
    \nThe useMemo hook is meant to prevent extensive computation every time a component\
    \ re-renders, so the first thing we ask ourselves here is; is the getComputedValue\
    \ actually an extensive operation?\n\nIn most cases, it’s not.\n\nAnd the cost\
    \ of having React manage a memoized value actually outweighs the performance benefits\
    \ you get from using useMemo.\n\nInstead, don’t be afraid of calling getComputedValue\
    \ directly from the root of the component.\n\n```javascript\nexport function App({\
    \ username, type }) {\n  const computedValue = getComputedValue(username, type);\n\
    \n  return <HeavyComponent computedValue={computedValue} />\n}\n```\n\nIf the\
    \ computedValue resolves to a primitive (a string, number, boolean, etc.),\ndon't\
    \ have to worry about HeavyComponent re-rendering either.\nIf the value doesn't\
    \ change, it won't re-render.\n\n## Stop overusing useCallback\n\nSimilarly, I've\
    \ seen the useCallback hook being overused as well.\nIt mostly boils down to two\
    \ situations:\n\nEither useCallback is used to set an initial state while preventing\
    \ an infinite render-loop. But in this case, useEffect is really the hook for\
    \ the job.\n\nOr, it is in the belief that the result will be memoized.\nIn that\
    \ case, useMemo is the hook for the job, but most likely, you simply want to compute\
    \ whatever you need in the component itself.\n\nIn fact, improper use of useCallback\
    \ actually worsens performance.\nIf you're in doubt when to use useCallback, remember\
    \ that as a rule of thumb,\nyou're not going to need it.\n\n## NodeJS & AWS Lambda\n\
    \nNodeJS is a backend runtime environment that runs on the V8 engine and enables\
    \ us to write and execute server-side JavaScript.\nSince its initial release 12\
    \ years ago, it has gotten immensely popular.\nIt also happens to be the most\
    \ popular choice when writing serverless functions on AWS (Lambda).\n\nIt's a\
    \ huge topic, and I'll keep this rather short.\nThere are a few things I'd like\
    \ to highlight.\n\n## Use promises instead of callbacks\n\nNodeJS was originally\
    \ built using a callback pattern for asynchronous calls.\nAll of NodeJS's builtins\
    \ are structured this way: You provide the main arguments along with a callback\
    \ function that is applied when the asynchronous operation is done.\n\n```javascript\n\
    const fs = require(\"fs\");\n\nfs.writeFile(\"./file.txt\", \"some-text\", (err,\
    \ data) => {\n  if (err) {\n    console.error();\n  }\n  console.log(data);\n\
    });\n```\n\nRemember, NodeJS was introduced in 2009.\nIn 2021, we use promises.\n\
    \nFortunately, it’s quite easy to convert these methods using promises instead.\
    \ Let’s look at two different ways.\n\n## Using promisify\n\nYou can use a utility\
    \ function, promisify, from the utils module to wrap the function using a callback\
    \ in a promise.\n\nIt works for all functions that follow the NodeJS callback\
    \ convention, which means that it works for a range of old third-party libraries\
    \ for NodeJS as well.\n\n```javascript\nconst fs = require(\"fs\");\nconst { promisify\
    \ } = require(\"util\");\nconst writeFilePromise = promisify(fs.writeFile);\n\n\
    try {\n  const data = await writeFilePromise(\"./file.txt\", \"some-text\");\n\
    } catch (err) {\n  console.error(err);\n}\n```\n\n## Using fs/promises\n\nIn modern\
    \ NodeJS, many builtins come with promises.\n\n```javascript\nconst fs = require(\"\
    fs/promises\");\n\ntry {\n  await fs.writeFile(\"./file.txt\", \"some-text\");\n\
    } catch (err) {\n  console.error(err);\n}\n```\n\n## Async handlers in Lambda\n\
    \nIn AWS Lambda, you can define your handler as async.\n\n```javascript\nexports.handler\
    \ = async (event) => {\n  try {\n    const data = await fs.writeFile(\"./file.txt\"\
    , \"some-text\");\n    return {\n      statusCode: 200,\n      body: JSON.stringify(data),\n\
    \    };\n  } catch (err) {\n    return {\n      statusCode: 500,\n      body:\
    \ err.message,\n    };\n  }\n};\n```\n\n## Final words\n\n## Which conventions\
    \ should I use?\n\nSo, after reading this book, you may be left with the question:\
    \ Which conventions should I use? Should I blindly follow all the rules, styles,\
    \ and conventions from this book?\n\nNo! All teams are different. All codebases\
    \ are different.\nThe two most important things to consider first, are keeping\
    \ a consistent codebase and playing well on a team.\n\nSo if you're invited to\
    \ a team where both the team and codebase are already +6 months old, try your\
    \ best to adopt the styles, preferences, and conventions you already see.\n\n\
    Listen to your team - if everyone prefers it in a specific way, go with that.\n\
    \nThat said, suggestions are always good, and - in my experience - welcomed most\
    \ professional teams.\nRemember, being a software developer in the real world\
    \ is mostly a people’s game. It’s much less about programming than you might think.\n\
    \n> Simon Høiberg\n\n## Additional resources\n\nIf you’re new to JavaScript and\
    \ looking for good resources to get started, I recommend these:\n\n- You Don’t\
    \ Know JS Book Series by Kyle Simpson: https://www.amazon.com/gp/bookseries/B01N9EBP9V\
    \ (Fantastic books!)\n- Free Code Camp’s YouTube Channel: https://www.youtube.com/c/Freecodecamp\
    \ (A gold mine of FREE resources)\n- NodeJS Design Patterns: https://www.nodejsdesignpatterns.com/\
    \ (This is for you that know JavaScript, but want to get better at NodeJS)\n\n\
    Finally, I want to mention Snappify, which I used to create all the cool code\
    \ snippets for this book:\nhttps://snappify.io/ (It's built by some awesome friends\
    \ of mine, you should really check it out)\n"
  mdcn: "\n这是在 React 中实现此操作最“正确”的方法。\n它的代价是必须将 `username` 和 `isLoading` 属性向下传递一层，如果需要回调函数，这些函数也必须一起传递。\n\
    \n## 不要将 useEffect 封装在异步 IIFE 中\n\n我见过这种模式，但它绝不是一种非常受欢迎的解决方案。\n\n你可能认得出这个用例。你需要在\
    \ `useEffect` 中执行某些异步操作，但你无法使用 `await` 关键字。\n\n```javascript\nexport function\
    \ App() {\n  useEffect(() => {\n    (async () => {\n      await fetch(\"https://some.api\"\
    );\n    })();\n  }, []);\n\n  return <div className=\"App\"></div>;\n}\n```\n\n\
    有些人会认为，从根本上来说在 `useEffect` 中执行异步操作就应该谨慎。\n\n在任何情况下，这都不优雅！\n\n如果你需要这样做，要么在 `useEffect`\
    \ 内部声明函数并立即调用它，或者——更好的做法——在组件作用范围内声明它。\n\n```javascript\nexport function App()\
    \ {\n  const callSomeApi = async () => {\n    await fetch(\"https://some.api\"\
    );\n  }\n\n  useEffect(() => {\n    callSomeApi();\n  }, []);\n\n  return <div\
    \ className=\"App\"></div>;\n}\n```\n\n这好得多！很可能随着逻辑的增长，我们以后某个时候还是得这样做。我们不如现在就这样做，并保持代码整洁。\n\
    \n## 不要过度使用内置 hooks\n\n是的，hooks 超级酷！当你学会了如何使用它们时，你可能会产生把它们安放在处处的冲动。\n请不要这样做。\n\
    \n## 停止使用 useMemo\n\n我遇到过很多这种情况。对在组件中直接从函数调用赋值给变量的恐惧，导致开发者使用 `useMemo`。\n\n让我们来看一个例子。\n\
    \n```javascript\nexport function App({ username, type }) {\n  const computedValue\
    \ = useMemo(() => {\n    return getComputedValue(username, type);\n  }, [page,\
    \ type])\n\n  return <HeavyComponent computedValue={computedValue} />\n}\n```\n\
    \n很容易看出开发者的逻辑是怎样的。\n\n`HeavyComponent` 不应该进行不必要的重新渲染，所以 `computedValue` 被缓存了（memoized）。\n\
    \n`useMemo` hook 的目的是防止在每次组件重新渲染时都执行大量的计算，所以我们在这里问的第一个问题是：`getComputedValue` 实际上是一项耗时的操作吗？\n\
    \n在大多数情况下，它不是。\n\n而且，让 React 管理一个缓存值的成本实际上超过了通过使用 `useMemo` 带来的性能收益。\n\n相反，不要害怕从组件根直接调用\
    \ `getComputedValue`。\n\n```javascript\nexport function App({ username, type })\
    \ {\n  const computedValue = getComputedValue(username, type);\n\n  return <HeavyComponent\
    \ computedValue={computedValue} />\n}\n```\n\n如果 `computedValue` 解析为原始类型（字符串、数字、布尔值等），\n\
    你也不需要担心 `HeavyComponent` 重新渲染了。\n如果值没有变化，它就不会重新渲染。\n\n## 停止过度使用 useCallback\n\n\
    同样，我也见过 `useCallback` hook 被过度使用的情况。\n它主要归结为两种情况：\n\n要么使用 `useCallback` 来设置初始状态，同时防止无限渲染循环。但情况下，`useEffect`\
    \ 才是适合这项工作的 hook。\n\n或者，是认为结果会被缓存。\n在这种情况下，`useMemo` 才是适合这项工作的 hook，但很可能，你只是想在组件本身中计算你需要的任何内容。\n\
    \n事实上，不当使用 `useCallback` 反会降低性能。\n如果你对何时使用 `useCallback` 有疑问，请记住作为一个经验法则，\n你不需要它。\n\
    \n## NodeJS & AWS Lambda\n\nNodeJS 是一种运行在 V8 引擎上的后端运行时环境，允许我们编写和执行服务器端 JavaScript。\n\
    自 12 年前首次发布以来，它变得极其流行。\n它恰好也是在 AWS (Lambda) 上编写无服务器函数时最受欢迎的选择。\n\n这是一个巨大的话题，我会保持得简短。\n\
    有几点我想强调一下。\n\n## 使用 promises 代替回调\n\nNodeJS 原初是使用回调模式进行异步调的。\nNodeJS 的所有内置模块都是这种结构：你提供主参数以及一个回调函数，该回调函数在异步操作完成后被应用。\n\
    \n```javascript\nconst fs = require(\"fs\");\n\nfs.writeFile(\"./file.txt\", \"\
    some-text\", (err, data) => {\n  if (err) {\n    console.error();\n  }\n  console.log(data);\n\
    });\n```\n\n记住，NodeJS 是在 2009 年引入的。\n在 2021 年，我们使用 promises。\n\n幸运的是，使用 promises\
    \ 转换这些方法非常简单。让我们来看两种不同的方法。\n\n## 使用 promisify\n\n你可以使用来自 `utils` 模块的工具函数 `promisify`\
    \ 将使用回调的函数封装在 promise 中。\n\n它适用于所有遵循 NodeJS 回调规范的函数，这意味着它也适用于一系列旧的 NodeJS 第三方库。\n\
    \n```javascript\nconst fs = require(\"fs\");\nconst { promisify } = require(\"\
    util\");\nconst writeFilePromise = promisify(fs.writeFile);\n\ntry {\n  const\
    \ data = await writeFilePromise(\"./file.txt\", \"some-text\");\n} catch (err)\
    \ {\n  console.error(err);\n}\n```\n\n## 使用 fs/promises\n\n在现代 NodeJS 中，许多内置模块都带有\
    \ promises。\n\n```javascript\nconst fs = require(\"fs/promises\");\n\ntry {\n\
    \  await fs.writeFile(\"./file.txt\", \"some-text\");\n} catch (err) {\n  console.error(err);\n\
    }\n```\n\n## Lambda 中的异步处理器\n\n在 Lambda 中，你可以将处理器定义为 async。\n\n```javascript\n\
    exports.handler = async (event) => {\n  try {\n    const data = await fs.writeFile(\"\
    ./file.txt\", \"some-text\");\n    return {\n      statusCode: 200,\n      body:\
    \ JSON.stringify(data),\n    };\n  } catch (err) {\n    return {\n      statusCode:\
    \ 500,\n      body: err.message,\n    };\n  }\n};\n```\n\n## 结语\n\n## 哪些规范\n\n\
    所以，读完这本书后，你可能会问：我应该使用哪些规范？我应该盲目遵循书中的所有规则、风格和规范吗？\n\n不！所有的团队都是不同的。所有的代码库也不同。\n\
    首先考虑的最两个事情是保持代码库的一致以及良好的团队合作。\n\n所以如果你加入了一个代码库已存在 6 个以上的团队，请尽可能采用你已经看到的风格、偏好和规范。\n\
    \n尽管如此，建议总是好的，而且根据我的经验，大多数团队都是欢迎的。\n\n记住，在现实世界中成为一名软件开发者更多是一场人际游戏。比你想象的要少取决于编程。\n\
    \n> Simon Høiberg\n\n## 额外资源\n\n如果你是 JavaScript 新手并正在寻找良好的入门资源，我推荐这些：\n\n- Kyle\
    \ Simpson 的 You Don’t Know JS 书系列：https://www.amazon.com/gp/bookseries/B019EBP9V（非常棒的书！）\n\
    - Free Code Camp YouTube 频道：https://www.youtube.com/c/Freecodecamp（免费资源的宝库）\n\
    - NodeJS Design Patterns：https://www.nodejsdesignpatterns.com/（适合那些熟悉 JavaScript\
    \ 但想精通 NodeJS 的人）\n\n最后，我想提一下 Snappify，我用它创建了书中所有的酷炫代码片段：\nhttps://snappify.io/（这是由我一些非常棒的朋友开发的，你真的应该看看）\n"
