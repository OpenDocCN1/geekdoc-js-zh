- img_proc: true
  md: 'Let''s refactor it.


    ```

    const points = [3, 9, 7, 8, 5, 2, 11, 14];nconst totalPoints = points.reduce((total,
    point) => total + point);

    console.log(totalPoints);

    // 59

    ```


    Perfect!


    One line of code. No surrounding states are changed. No variables are being reassigned.


    I sometimes hear people propose this argument:


    > “Reduce is difficult to understand. If you have juniors on your team, you may
    want to go with the imperative approach”.


    I personally couldn''t disagree more.

    It depends on its use - when reduce is kept simple, as in the example above, it
    is perfectly within most junior developers'' capability to comprehend.


    This is often a bad excuse from mid-levels and seniors who still haven''t adapted
    to this way of writing code but lack clear arguments for why they would stick
    in their old imperative ways.

    Let''s take another example. Sorting!'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'This one gets a bit messier.

    Take look at the code below.


    ```

    ```javascript

    const grades = ["C", "A", "I", "B", "F"];

    const sortedGrades = grades.sort();

    console.log(grades);// ["A", "B", "C", "F", "I"]

    ```

    ```


    At first glance, this looks good. We''re not using let, and we''re not mutating
    the original array using something like `push`. We use an Array-method that **declaratively**
    returns the desired result.


    But take a look at the `console.log` statement.

    Yes. JavaScript can be awful like this. It turns out that the sort method is really
    old, and **does not** create a copy of the original array.

    Instead, it **mutates** on the original array and returns its own array from the
    method call.


    Weird? Yes.

    But there are a handful of old Array-methods that do this.

    Be careful with `push`, `shift`, `unshift`, `pop`, `reverse`, `splice`, `sort`,
    and `fill`.

    Fortunately, as we saw in the example from before, most often we can simply avoid
    calling these methods at all, to stay out of trouble.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'However, there are cases, like using sort, where we have to use a method that
    mutates the original array, in lack of better options.


    Array destructuring to the rescue!


    Whenever these occasions arise, make sure to manually copy the array first, before
    performing an operation on it.


    It’s as simple as this.


    ```

    const grades = ["C", "A", "I", "B", "F"];

    const sortedGrades = [...grades].sort();


    console.log(grades);

    // ["C", "A", "I", "B", "F"]


    console.log(sortedGrades);

    // ["A", "B", "C", "F", "I"]

    ```


    That [...grades] makes the entire difference.


    Get this habit into your fingers.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "Let's look at an example using asynchronous operations. Iterative operations\
    \ including asynchronous behavior can be a little tricky to do using a declarative\
    \ style.\n\nLet's say we have a list of names. For each name, we want to make\
    \ an API call and get some information, and then keep a new list with this collection\
    \ of information.\n\nA typical imperative approach may look like this.\n\n```\n\
    const names = ['jack', 'annie', 'peter'];\n\nasync function getInformationFromName(name)\
    \ {\n  const request = await fetch('https://some.api?name=' + name);\n  const\
    \ result = await request.json();\n  return result;\n}\n\nconst namesWithInformation\
    \ = [];\n\nfor (const name of names) {\n  const information = await getInformationFromName(name);\n\
    \  namesWithInformation.push(information);\n}\n```\n\nUsing an imperative approach\
    \ makes a bit more sense in this case. Refactoring to using map or forEach is\
    \ not straightforward here."
  merge: -1
  pgno: 15
- img_proc: true
  md: "The callbacks provided to map or forEach (or any of the array-methods) are\
    \ not awaited, so we have no way of knowing when the full collection of information\
    \ is done and ready to use.\n\nHowever, there is still a way we can write this\
    \ in a nice, declarative way - and it even includes a bonus takeaway!\n\nUsing\
    \ the Promise.all method.\n\n```\nconst names = [\"jack\", \"annie\", \"peter\\\
    ];\n\nasync function getInformationFromName(name) {\n  const request = await fetch('https://some.api?name='\
    \ + name);\n  const result = await request.json();\n  return result;\n}\n\nconst\
    \ namesWithInformation = await Promise.all(\n  names.map(getInformationFromName)\n\
    );\n```\n\nAwesome! Now, map returns a list of promises, and the Promise.all method\
    \ takes a list of promises and resolves them in parallel.\n\nNot only did the\
    \ code become much more nice and clean - but we also benefit from the fact that\
    \ the promises are not resolved sequentially, which speeds up the process and\
    \ increases performance."
