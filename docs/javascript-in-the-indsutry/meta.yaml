  md: "# Let TypeScript infer the type\n\nOne thing I've noticed from new TypeScript\
    \ converts is that they tend to insist on typing *everything.*\n\nAll functions\
    \ must have a return type, all arguments *must* be typed, all variable declarations\
    \ *must* be followed immediately by their type, and so on.\n\nThis is the part\
    \ that's going to feel very tedious and bureaucratic to the rest of the team who\
    \ may not be flying high on TypeScript.\n\nAnd more importantly: it's not necessary.\n\
    \nTypeScript is **very good** at inferring the types themselves. You don't have\
    \ to trivially type out every single thing.\n\n```\nfunction addOne(n: number\
    \ = 0): number {\n  return n + 1;\n}\n```\n\n```\nfunction addOne(n = 0) {\n \
    \ return n + 1;\n}\n```\n\nYou can always hover the mouse over an argument or\
    \ a function to see if TypeScript infers the type (correctly) by itself."
