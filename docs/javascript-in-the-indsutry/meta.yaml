  md: "# NodeJS & AWS Lambda\n\nNodeJS is a backend runtime environment that runs\
    \ on the V8 engine and enables us to write and execute server-side JavaScript.\n\
    Since its initial release 12 years ago, it has gotten immensely popular.\nIt also\
    \ happens to be the most popular choice when writing serverless functions on AWS\
    \ (Lambda).\n\nIt's a huge topic, and I'll keep this rather short.\nThere are\
    \ a few things I'd like to highlight.\n\n# Use promises instead of callbacks\n\
    \nNodeJS was originally built using a callback pattern for asynchronous calls.\n\
    All of NodeJS's builtins are structured this way: You provide the main arguments\
    \ along with a callback function that is applied when the asynchronous operation\
    \ is done.\n\n```\nconst fs = require(\"fs\");\n\nfs.writeFile(\"./file.txt\"\
    , \"some-text\", (err, data) => {\n  if (err) {\n    console.error();\n  }\n \
    \ console.log(data);\n});\n```"
  merge: -1
  pgno: 64
- img_proc: true
  md: "Remember, NodeJS was introduced in 2009.\nIn 2021, we use promises.\n\nFortunately,\
    \ it’s quite easy to convert these methods using promises instead. Let’s look\
    \ at two different ways.\n\n# Using promisify\n\nYou can use a utility function,\
    \ promisify, from the utils module to wrap the function using a callback in a\
    \ promise.\n\nIt works for all functions that follow the NodeJS callback convention,\
    \ which means that it works for a range of old third-party libraries for NodeJS\
    \ as well.\n\n```\nconst fs = require(\"fs\");\nconst { promisify } = require(\"\
    util\");\nconst writeFilePromise = promisify(fs.writeFile);\n\ntry {\n  const\
    \ data = await writeFilePromise(\"./file.txt\", \"some-text\");\n  console.log(data);\n\
    } catch (error) {\n  console.error(error);\n}\n```\n\nFortunately, in NodeJS version\
    \ 12 and up, it became even easier for us."
  merge: -1
  pgno: 65
- img_proc: true
  md: "# Using module/promises\n\nInstead of handling the promise-wrapping yourself,\
    \ all NodeJS builtins come with a promisified version of their functions, straight\
    \ from the module itself.\n\n```\nconst fs = require(\"fs/promises\");ntry {\n\
    \  const data = await fs.writeFile(\"./file.txt\", \"some-text\");\n  console.log(data);\n\
    } catch (error) {\n  console.error(error);\n}\n```\n\nThis is, by far, the easiest\
    \ way to use promises in NodeJS in 2021.\n\nPlease, stick to this pattern anywhere\
    \ you can.\n\n# Async handlers in AWS Lambda\n\nThe same goes for AWS Lambda.\n\
    \nYou don't have to use the callback argument of your AWS Lambda functions anymore.\n\
    \nIf your handle is async, you can simply return the result instead of applying\
    \ it to the callback argument."
  merge: -1
  pgno: 66
- img_proc: true
  md: "This is how an AWS Lambda function was expressed prior to the support of NodeJS\
    \ version 8.\n\n```\nmodule.exports.handler = (event, context, callback) => {\n\
    \  const response = {\n    statusCode: 200,\n    body: JSON.stringify({ message:\
    \ 'hello world' }),\n  };\n\n  callback(null, response);\n};\n```\n\nToday, we\
    \ don't have to use the callback argument anymore.\nInstead, declare the handler\
    \ as async, and return the result instead.\n\n```\nmodule.exports.handler = async\
    \ (event, context) => {\n  const response = {\n    statusCode: 200,\n    body:\
    \ JSON.stringify({ message: 'hello world' }),\n  };\n\n  return response;\n};\n\
    ```\n\nIf you need to fulfill promises during the function call, you simply apply\
    \ the await keyword like you normally would."
  merge: -1
