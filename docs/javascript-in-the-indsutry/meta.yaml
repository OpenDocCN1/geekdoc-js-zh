- img_proc: true
  md: "# Working with arrays\n\nIn JavaScript (and in programming, generally), you'll\
    \ find yourself working with arrays a lot.\n\nThis is why the famous array methods\
    \ introduced in ES6 became so popular. They really make our lives easier.\n\n\
    And recall: They are following a declarative programming style.\n\nIn this example,\
    \ we want to filter a list of candidates to only include candidates who are also\
    \ active members (exists in the activeMembers array). Below is an example of doing\
    \ this imperatively.\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_9_0.png)\n\n\
    ```\nconst activeMembers = [\"alex\", \"stephanie\"];\nconst candidates = [\"\
    alex\", \"martin\", \"anna\"];\n\nconst activeCandidates = [];\n\nfor (const candidate\
    \ of candidates) {\n  if (activeMembers.includes(candidate)) {\n    activeCandidates.push(candidate);\n\
    \  }\n}\n\nconsole.log(activeCandidates);\n// [\"alex\"]\n```"
  merge: -1
  pgno: 9
- img_proc: true
  md: "There are two red flags that should pop up in your mind here.\n\n+   1. You\
    \ are declaring an array outside the body of the loop.\n2. You are using the push\
    \ method to populate an array.\n\nAs a rule of thumb: Whenever you're about to\
    \ call the push method, ask yourself if this can be expressed in a declarative\
    \ way instead.\nThe push method is mutating the array.\n\nLet's refactor it.\n\
    \n```\nconst activeMembers = [\"alex\", \"stephanie\"];\nconst candidates = [\"\
    alex\", \"martin\", \"anna\"];\n\nconst activeCandidates = candidates.filter(\n\
    \  (candidate) => activeMembers.includes(candidate)\n);\n\nconsole.log(activeCandidates);\n\
    // [\"alex\"]\n```\n\nAh, much better!\nNo surrounding states are changed. Nothing\
    \ is mutated on.\nThe activeCandidates is declared and directly assigned the result\
    \ of filter, which takes care of the job for us."
  merge: -1
  pgno: 10
- img_proc: true
  md: "Let’s take another example.\nHere, we want to iterate through a list of numbers\
    \ and find the sum.\nBelow is an example of doing this imperatively.\n\n```\n\
    const points = [3, 9, 7, 8, 5, 2, 11, 14];\nnlet totalPoints = 0;\n\nfor (const\
    \ point of points) {\n  totalPoints += point;\n}\n\nconsole.log(totalPoints);\n\
    // 59\n```\n\nThere are two red flags that should pop up in your mind here.\n\n\
    +   1. You are declaring a variable outside the body of the loop.\n2. You are\
    \ using the let keyword to initiate the variable.\n\nAs a rule of thumb: Whenever\
    \ you find yourself using the let keyword, ask yourself if you can achieve the\
    \ desired result without reassignment the variable.\nIn most cases, you don’t\
    \ want to use let. You want to initiate and assign variables immediately using\
    \ const."
  merge: -1
