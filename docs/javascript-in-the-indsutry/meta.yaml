  - "[PAGE 10]\n\nThere are two red flags that should pop up in your mind here.\n\n\
    +   1. You are declaring an array outside the body of the loop.\n2. You are using\
    \ the push method to populate an array.\n\nAs a rule of thumb: Whenever you're\
    \ about to call the push method, ask yourself if this can be expressed in a declarative\
    \ way instead.\nThe push method is mutating the array.\n\nLet's refactor it.\n\
    \n```\nconst activeMembers = [\"alex\", \"stephanie\"];\nconst candidates = [\"\
    alex\", \"martin\", \"anna\"];\n\nconst activeCandidates = candidates.filter(\n\
    \  (candidate) => activeMembers.includes(candidate)\n);\n\nconsole.log(activeCandidates);\n\
    // [\"alex\"]\n```\n\nAh, much better!\nNo surrounding states are changed. Nothing\
    \ is mutated on.\nThe activeCandidates is declared and directly assigned the result\
    \ of filter, which takes care of the job for us."
  - "[PAGE 11]\n\nLet’s take another example.\nHere, we want to iterate through a\
    \ list of numbers and find the sum.\nBelow is an example of doing this imperatively.\n\
    \n```\nconst points = [3, 9, 7, 8, 5, 2, 11, 14];\nnlet totalPoints = 0;\n\nfor\
    \ (const point of points) {\n  totalPoints += point;\n}\n\nconsole.log(totalPoints);\n\
    // 59\n```\n\nThere are two red flags that should pop up in your mind here.\n\n\
    +   1. You are declaring a variable outside the body of the loop.\n2. You are\
    \ using the let keyword to initiate the variable.\n\nAs a rule of thumb: Whenever\
    \ you find yourself using the let keyword, ask yourself if you can achieve the\
    \ desired result without reassignment the variable.\nIn most cases, you don’t\
    \ want to use let. You want to initiate and assign variables immediately using\
    \ const."
  - '[PAGE 12]


    Let''s refactor it.


    ```

    const points = [3, 9, 7, 8, 5, 2, 11, 14];nconst totalPoints = points.reduce((total,
    point) => total + point);

    console.log(totalPoints);

    // 59

    ```


    Perfect!


    One line of code. No surrounding states are changed. No variables are being reassigned.


    I sometimes hear people propose this argument:


    > “Reduce is difficult to understand. If you have juniors on your team, you may
    want to go with the imperative approach”.


    I personally couldn''t disagree more.

    It depends on its use - when reduce is kept simple, as in the example above, it
    is perfectly within most junior developers'' capability to comprehend.


    This is often a bad excuse from mid-levels and seniors who still haven''t adapted
    to this way of writing code but lack clear arguments for why they would stick
    in their old imperative ways.

    Let''s take another example. Sorting!'
  - '[PAGE 13]


    This one gets a bit messier.

    Take look at the code below.


    ```

    ```javascript

    const grades = ["C", "A", "I", "B", "F"];

    const sortedGrades = grades.sort();

    console.log(grades);// ["A", "B", "C", "F", "I"]

    ```

    ```


    At first glance, this looks good. We''re not using let, and we''re not mutating
    the original array using something like `push`. We use an Array-method that **declaratively**
    returns the desired result.


    But take a look at the `console.log` statement.

    Yes. JavaScript can be awful like this. It turns out that the sort method is really
    old, and **does not** create a copy of the original array.

    Instead, it **mutates** on the original array and returns its own array from the
    method call.


    Weird? Yes.

    But there are a handful of old Array-methods that do this.

    Be careful with `push`, `shift`, `unshift`, `pop`, `reverse`, `splice`, `sort`,
    and `fill`.

    Fortunately, as we saw in the example from before, most often we can simply avoid
    calling these methods at all, to stay out of trouble.'
  - '[PAGE 14]


    However, there are cases, like using sort, where we have to use a method that
    mutates the original array, in lack of better options.


    Array destructuring to the rescue!


    Whenever these occasions arise, make sure to manually copy the array first, before
    performing an operation on it.


    It’s as simple as this.


    ```

    const grades = ["C", "A", "I", "B", "F"];

    const sortedGrades = [...grades].sort();


    console.log(grades);

    // ["C", "A", "I", "B", "F"]


    console.log(sortedGrades);

    // ["A", "B", "C", "F", "I"]

    ```


    That [...grades] makes the entire difference.


    Get this habit into your fingers.'
  - "[PAGE 15]\n\nLet's look at an example using asynchronous operations. Iterative\
    \ operations including asynchronous behavior can be a little tricky to do using\
    \ a declarative style.\n\nLet's say we have a list of names. For each name, we\
    \ want to make an API call and get some information, and then keep a new list\
    \ with this collection of information.\n\nA typical imperative approach may look\
    \ like this.\n\n```\nconst names = ['jack', 'annie', 'peter'];\n\nasync function\
    \ getInformationFromName(name) {\n  const request = await fetch('https://some.api?name='\
    \ + name);\n  const result = await request.json();\n  return result;\n}\n\nconst\
    \ namesWithInformation = [];\n\nfor (const name of names) {\n  const information\
    \ = await getInformationFromName(name);\n  namesWithInformation.push(information);\n\
    }\n```\n\nUsing an imperative approach makes a bit more sense in this case. Refactoring\
    \ to using map or forEach is not straightforward here."
  - "[PAGE 16]\n\nThe callbacks provided to map or forEach (or any of the array-methods)\
    \ are not awaited, so we have no way of knowing when the full collection of information\
    \ is done and ready to use.\n\nHowever, there is still a way we can write this\
    \ in a nice, declarative way - and it even includes a bonus takeaway!\n\nUsing\
    \ the Promise.all method.\n\n```\nconst names = [\"jack\", \"annie\", \"peter\\\
    ];\n\nasync function getInformationFromName(name) {\n  const request = await fetch('https://some.api?name='\
    \ + name);\n  const result = await request.json();\n  return result;\n}\n\nconst\
    \ namesWithInformation = await Promise.all(\n  names.map(getInformationFromName)\n\
    );\n```\n\nAwesome! Now, map returns a list of promises, and the Promise.all method\
    \ takes a list of promises and resolves them in parallel.\n\nNot only did the\
    \ code become much more nice and clean - but we also benefit from the fact that\
    \ the promises are not resolved sequentially, which speeds up the process and\
    \ increases performance."
  - '[PAGE 17]


    # Avoid using classes


    Ahh, classes. At the very root of object-oriented programming lies the concept
    of classes.


    Classes are blueprints for creating objects. They encapsulate data along with
    code to mutate on that data.


    In JavaScript, classes are built on prototypes and are used as a template for
    creating objects.


    They are - as in any other programming language - **inherently imperative** in
    their nature.


    The use of classes has its place. It does make sense on some occasions. But most
    often, you can avoid using them - and if you can, **you should.**


    So generally, whenever you are about to use a class declaration, ask yourself
    if it’s really necessary. Can you express the logic you need in a **declarative**
    way instead, using only functions? In 9/10 cases, I bet you can!


    Let’s take a look at some of the most common uses of classes, which can easily
    be refactored into using a **declarative** programming style instead.'
  - "[PAGE 18]\n\n# Working with instances when you really don't have to\n\nLet's\
    \ look at this class which will format a name and creates a greeting.\n\n```\n\
    class NameBuilder {\n  constructor(name) {\n    this.name = name;\n  }\n\n  capitalize()\
    \ {\n    this.name = this.name\n      .split(' ')\n      .map(s => s.charAt(0).toUpperCase()\
    \ + s.substring(1))\n      .join(' ');\n  }\n\n  createGreeting() {\n    this.name\
    \ = 'Hello, ${this.name}';\n  }\n\n  get modifiedName() {\n    return this.name;\n\
    \  }\n}\n```\n\n```\nconst nameBuilder = new NameBuilder('simon hoiberg');\nnameBuilder.capitalize();\n\
    nameBuilder.createGreeting();\nconst newName = nameBuilder.modifiedName();\n\n\
    console.log(newName);\n// Hello, Simon Hoiberg\n```"
  - '[PAGE 19]


    The idea here is to create a class that encapsulates the logic of building our
    name, so the consumer doesn''t have to worry about implementation details and
    each step in the process.


    And that''s great!


    But the thing is - there is no need to work with instances in this case. Having
    to use the *new* keyword to create a new *NameBuilder* instance doesn''t serve
    any kind of purpose here.


    Yet, this is the most common use of classes I''ve seen in the industry. The intention
    is good - but the implementation is pointless.'
- md: "\n[content]\nNow, when pointing this out in a code review, most programmers\
    \ will get the point. And a common response is: Let’s just make the methods static.\
    \ Then there’s no need to create instances anymore.\n\n```javascript\nclass NameBuilder\
    \ {\n  static capitalize(name) {\n    return name\n    .split(' ')\n    .map(s\
    \ => s.charAt(0).toUpperCase() + s.substring(1))\n    .join(' ');\n  }\n\n  static\
    \ createGreeting(name) {\n    return `Hello, ${name}`;\n  }\n}\n```\n\n```javascript\n\
    const capitalized = NameBuilder.capitalize('simon hoiberg');\nconst greeting =\
    \ NameBuilder.createGreeting(capitalized);\n\nconsole.log(greeting);\n// Hello,\
    \ Simon Hoiberg\n```\n\nGreat! This is definitely an improvement.\n\nWe got rid\
    \ of the instance variable, so no mutation anymore. We also have methods that\
    \ now return values deterministically, based on its argument. They are pure.\n\
    \nBut, now that we're so close - why don't we just get rid of the class entirely?\n\
    It seems there's literally no need for it anymore.\n\n```javascript\nexport function\
    \ capitalize(name) {\n  return name\n    .split(\"\")\n    .map(s => s.charAt(0).toUpperCase()\
    \ + s.substring(1))\n    .join(\"\");\n}\n\nexport function createGreeting(name)\
    \ {\n  return `Hello, ${name}`;\n}\n```\n\n```javascript\nimport { capitalize,\
    \ createGreeting } from \"./namebuilder\";\n\nconst capitalized = capitalize(\"\
    simon hoiberg\");\nconst greeting = createGreeting(capitalized);\n\nconsole.log(greeting);\n\
    // Hello, Simon Hoiberg\n```\n\nAwesome! We did it - we got rid of the class entirely!\n\
    Now, the code is declarative, easier to test, easier to debug, and treeseshakable.\
    \ This means that modern build tools like Webpack and Rollup are able to remove\
    \ the dead code of functions that may never be used in a specific case. It will\
    \ result in a smaller bundle size of your code.\n\n# Classes vs Hooks in React\n\
    \nIn 2018, React introduced hooks.\n\nThey did this to get rid of classes and\
    \ the confusing `this` keyword.\n\nWhy? Because React is an inherently declarative\
    \ UI library, and classes just don't really fit in.\n\nIf you were working with\
    \ React prior to 2018, I bet you've been writing a lot of code like this.\n\n\
    ```javascript\nimport React from \"react\";\n\nexport class ShowCount extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { count: 0 };\n  }\n\n  componentDidMount() {\n    this.setState({ count:\
    \ this.props.count });\n  }\n\n  render() {\n    return (\n      <div>\n     \
    \   <p> Count: {this.state.count}</p>\n      </div>\n    );\n  }\n}\n```\n\nFortunately,\
    \ after hooks were introduced, we can now benefit from writing clean and declarative\
    \ code in React.\n\n```javascript\nimport React, { useEffect, useState } from\
    \ \"react\";\n\nexport function ShowCount(props) {\n  const [count, setCount]\
    \ = useState();\n\n  useEffect(() => {\n    setCount(props.count);\n  }, [props.count]);\n\
    \n  return (\n    <div>\n      <p> Count: {count}</p>\n    </div>\n  );\n}\n```\n\
    \nFunctional components were already a thing before hooks, but we often needed\
    \ to refactor it into a class component when the logic grew.\n\nIn this way, we\
    \ don't have to worry anymore.\nWe also don't have to worry about `this`, binding\
    \ methods, not being able to share logic, and a lot of other things.\n\nI'll be\
    \ covering more React best practices later in this book.\n\n# Create your own\
    \ abstractions\n\nSo, we've covered some good rules of thumb to follow.\nBut often\
    \ enough, the code we write in our software is more complex than the examples\
    \ we've looked at here.\n\nThere are cases where writing declaratively, avoiding\
    \ the `let` keyword, not reassigning variables, not altering data in the surrounding\
    \ scope of a loop, and so on, simply going to produce tedious, verbose, and hard-to-read\
    \ code.\n\nAnd obviously, we don't want to force any style or pattern to an extent\
    \ where it makes our code worse, “just because.... functional programming”.\n\n\
    But instead of turning it all around, we can abstract that code away in a function,\
    \ and... (Wait, the OCR text provided becomes highly corrupted/garbled from page\
    \ 24 onwards. I will process the legible parts and maintain structure where possible).\n\
    \n*(Note: The provided OCR text from page 24 to 30 contains significant character\
    \ corruption and nonsensical strings. I have cleaned up the legible sentences\
    \ and maintained the structure based on the visible patterns.)*\n[/content]\n"
  mdcn: "\n现在，当在代码审查中指出这一点时，大多数程序员都能理解。一种常见的反应是：让我们把方法改为静态的（static）吧。这样就不再需要创建实例了。\n\
    \n```javascript\nclass NameBuilder {\n  static capitalize(name) {\n    return\
    \ name\n    .split(' ')\n    .map(s => s.charAt(0).toUpperCase() + s.substring(1))\n\
    \    .join(' ');\n  }\n\n  static createGreeting(name) {\n    return `Hello, ${name}`;\n\
    \  }\n}\n```\n\n```javascript\nconst capitalized = NameBuilder.capitalize('simon\
    \ hoiberg');\nconst greeting = NameBuilder.createGreeting(capitalized);\n\nconsole.log(greeting);\n\
    // Hello, Simon Hoiberg\n```\n\n棒了！这绝对是一个改进。\n\n我们消除了实例变量，因此不再有数据变异。我们还拥有了根据参数确定性地返回值的方法。它们是纯函数。\n\
    \n但是，既然我们已经如此接近了——为什么我们不直接完全删掉类呢？\n看起来真的完全不再需要它了。\n\n```javascript\nexport function\
    \ capitalize(name) {\n  return name\n    .split(\"\")\n    .map(s => s.charAt(0).toUpperCase()\
    \ + s.substring(1))\n    .join(\"\");\n}\n\nexport function createGreeting(name)\
    \ {\n  return `Hello, ${name}`;\n}\n```\n\n```javascript\nimport { capitalize,\
    \ createGreeting } from \"./namebuilder\";\n\nconst capitalized = capitalize(\"\
    simon hoiberg\");\nconst greeting = createGreeting(capitalized);\n\nconsole.log(greeting);\n\
    // Hello, Simon Hoiberg\n```\n\n太棒了！我们做到了——我们完全删除了类！\n现在，代码是声明式的，更容易测试，更容易调试，并且支持摇树优化（tree-shakable）。这意味着像\
    \ Webpack 和 Rollup 等现代构建工具能够移除在特定情况下可能永远不会使用的死代码函数。这将导致小代码包体积。\n\n# React 中的类与\
    \ Hooks\n\n2018 年，React 引入了 hooks。\n\n它们这样做是为了消除类和令人困惑的 `this` 关键字。\n\n为什么？因为\
    \ React 本质上是一个声明式的 UI 库，而类并不真的契合。\n\n如果你在 2018 年之前使用 React，我打赌你写过很多类似这样的代码。\n\n\
    ```javascript\nimport React from \"react\";\n\nexport class ShowCount extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { count: 0 };\n  }\n\n  componentDidMount() {\n    this.setState({ count:\
    \ this.props.count });\n  }\n\n  render() {\n    return (\n      <div>\n     \
    \   <p> Count: {this.state.count}</p>\n      </div>\n    );\n  }\n}\n```\n\n幸运的是，在\
    \ hooks 引入之后，我们现在可以从在 React 中编写整洁且声明式的代码中受益。\n\n```javascript\nimport React, {\
    \ useEffect, useState } from \"react\";\n\nexport function ShowCount(props) {\n\
    \  const [count, setCount] = useState();\n\n  useEffect(() => {\n    setCount(props.count);\n\
    \  }, [props.count]);\n\n  return (\n    <div>\n      <p> Count: {count}</p>\n\
    \    </div>\n  );\n}\n```\n\n函数组件在 hooks 之前就已经存在了，但当逻辑增长时，我们经常需要将其重构为类组件。\n\n\
    通过这种方式，我们再也不需要担心了。\n我们再也不需要担心 `this`、方法绑定、无法共享逻辑以及许多其他问题。\n\n我将在本书的后续部分介绍更多 React\
    \ 最佳实践。\n\n# 创建你自己的抽象\n\n所以，我们已经涵盖了一些可以遵循的黄金准则。\n但很多时候，我们在软件中编写的代码比我们在这里看到的示例要复杂得多。\n\
    \n在某些情况下，编写声明式、避免使用 `let` 关键字、不重新赋值变量、不修改循环周围作用域内的数据等做法，仅仅会产生冗长、啰嗦且难以阅读的代码。\n\n\
    显然，我们不想强行推行某种风格或模式以至于让我们的代码变得更糟，“仅仅是因为……函数式编程”。\n\n但是，我们并不是把一切都倒转过来，而是可以将这些代码抽象到一个函数中，然后……（等待，提供的\
