    \  const hasChanged = didChange(someVar[i]);\n    if (!hasChanged) {\n      toBeUpdated.push(someVar[i]);\n\
    \    }\n  }\n  if (!toBeUpdated.length) {\n    return;\n  }\n} else {\n  const\
