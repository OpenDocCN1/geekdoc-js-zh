  md: "# Do not extend builtins\n\nWhen you first understand JavaScript’s prototype\
    \ chain and understand how you can extend prototype, including the JavaScript\
    \ builtins, you may experience a sensation of overwhelming superpowers.\n\nNow,\
    \ you can extend the Array prototype to include your own custom array method along\
    \ with map, filter, and reduce.\nmean - is this just cool or what?\n\n```\nArray.prototype.average\
    \ = function () {\n  return this.reduce((acc, elem) => acc + elem / this.length);\n\
    }\n\nconst list = [1, 2, 3];\nconst avg = list.average();\n\nconsole.log(avg);\n\
    // 2\n```\n\nIt’s not! In fact, this is deeply problematic and can lead to a range\
    \ of rather serious issues. Extending the builtins should be avoided at all costs.\n\
    \nIn fact, there are horror stories of entire applications being brought to their\
    \ knees because of this pattern.\n\nUnfortunately, some third-party libraries\
    \ in the past had a bad habit of doing this, and you may accidentally override\
    \ it, causing a world of headaches!"
  merge: -1
  pgno: 46
- img_proc: true
  md: "Instead, keep things separated and pure!\nBuild your own utility pack instead,\
    \ and keep it in its own module.\n\n```\nexport function average(list) {\n  return\
    \ list.reduce((acc, elem) => acc + elem / list.length);\n}\n```\n\n```\nimport\
    \ { average } from \"./array-utils\";\n\nconst list = [1, 2, 3];\nconst avg =\
    \ average(list);\nnconsole.log(avg);\n// 2\n```\n\nMuch better!\nAs this collection\
    \ grows, it's easy to extract it into an NPM package so it can be reused across\
    \ projects.\n\n# Avoid default exports\n\nThis brings us to the next point.\n\
    As you may have noticed, I haven't used export default in any of my examples.\n\
    That's deliberate.\n\nThis is especially important if you're using TypeScript,\
    \ but I strongly recommend getting rid of the habits of using default exports\
    \ entirely.\n\nWhy?"
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Poor Discoverability


    It makes it hard for IntelliSense in modern code editors like VSCode and Webstorm
    to suggest exports from a module when you start typing.


    # Annoying when using CommonJS


    I don''t know if you''ve ever had to put that .default at the end of a require
    statement? Pretty annoying and ugly, isn''t it?


    # Annoying when using Dynamic Imports


    Similar to CommonJS and require, using a Dynamic Import also forces you to dot
    into a .default.


    # Name Protection


    When you import from a default export, you can essentially name the import whatever
    you want. It''s hard to refactor later, and it may result in naming inconsistencies
    and typos.


    # Re-exporting


    Using barrels to re-export modules from a centralized place is common when creating
    packages for NPM, or when dealing with larger code-bases with lots of modules.
    The default export forces you to rename your export, which again may lead to inconsistencies
    in naming.


    Some would argue that it''s a matter of use-case, though using named exports instead
    of default exports doesn''t really come with any tradeoffs, so I suggest simply
    sticking to that.'
  merge: -1
