    - 可发现性较差 49\n- 使用 CommonJS 时的困扰 49\n- 使用动态导入时的困扰 49\n- 命名保护 49\n- 重新导出 49\n- 放弃单字母变量名\
    \ 50\n- 箭头函数 vs. 函数声明 51\n\n## TypeScript 52\n- 不要过度使用 52\n- 让 TypeScript 推断类型\
    \ 54\n- 避免使用 any 56\n\n## React 57\n- 使用 React hooks 57\n- 无需担心 JSX 中的箭头函数 57\n\
    - 不要从内部函数返回 JSX 59\n- JSX 内部的三元运算符 60\n- 拆分为独立的组件 60\n- 不要将异步 IIFE 中封装 useEffect\
    \ 61\n- 不要过度使用内置的 Memo 62\n- 停止使用 useMemo 62\n- 停止过度使用 useCallback 64\n\n## NodeJS\
    \ & AWS Lambda 65\n- 使用 promises 代替回调 65\n- 使用 promisify 66\n- 使用 module/promises\
    \ 67\n- AWS Lambda 中的异步处理程序 67\n\n## 结语 69\n- 我应该使用哪些规范？ 69\n\n## 额外资源 70\n\n\
    ## 引言\n\n当 JavaScript 统治行业时，我一直处于近距离观察的前排。\n\n在担任自由职业顾问的过去十年里，我有幸与许多不同的团队合作过。我参与了无数次\
    \ PR 代码审查，并就 JavaScript、最佳实践、整洁代码、模式和编码风格进行过许多激烈讨论。\n\n我曾在各种演讲和工作坊中教授过 JavaScript、React\
    \ 和 NodeJS。此外，在过去的一年里，我经常向 Twitter 读者展示小段代码，询问他们更倾向于哪种写法以及是否会在 PR 中批准它们。\n\n以下是我的发现、感悟和个人经验。\n\
    它们被整合在一本易于阅读的电子书中，包含了示例和解释。\n\n**这本书是有主观的。**\n\n对于书中的每一个示例，你都会找到持有不同意见的行业开发者。本书介绍的是行业偏好和标准。但从定义上来说，它是主观的。\n\
    \n**这并不是一本 JavaScript 基础书籍。**\n\n请注意，本书假设你对 JavaScript 语言有基础理解。\n\n## 函数式风格\n\n\
    JavaScript 是一种多范式编程语言。\n这意味着语言支持以不同的风格进行编程，包括面向对象、过程化、原型和函数式。\n\n到目前为止，你最常见的风格是面向对象和函数式。\n\
    尽管像 Java 和 C# 这样的面向对象语言对行业产生了巨大影响，但在 2021 年，函数式风格 JavaScript 最受欢迎且最受接受。这是你应该追求的方向。\n\
    \n## 命令式 vs. 声明式\n\n面向对象编程遵循命令式范式。\n函数式编程遵循声明式范式。\n\n让我们来看看区别。\n\n命令式编程侧重于你想要如何完成某事。\n\
    你一步步改变程序的状态。\n\n声明式编程侧重于结果是什么。\n只要获取结果的过程不会改变程序的状态，如何获取结果就不那么重要。\n\n当一个函数以确定的方式执行任务且不改变其环境（改变周围的状态）时，我们称之为“纯函数”。\n\
    假设我们要遍历一个列表并将所有元素乘以 2。\n\n命令式风格看起来像这样：\n\n```javascript\nfunction multiplyAll(list)\
    \ {\n  for (let i = 0; i < list.length; i++) {\n    list[i] *= 2;\n  }\n}\n\n\
    const numbers = [1, 2, 3, 4, 5];\nmultiplyAll(numbers);\nconsole.log(numbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\n声明式风格看起来像这样：\n\n```javascript\nconst numbers = [1,\
    \ 2, 3, 4, 5];\nconst multipliedNumbers = numbers.map(n => n * 2);\n\nconsole.log(multipliedNumbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\n"
