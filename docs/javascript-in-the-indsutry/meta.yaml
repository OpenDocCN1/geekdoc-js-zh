  raw:
  - "[PAGE 41]\n\n# Code hygiene & good practices\n\nWe've covered two fundamental\
    \ areas of programming and which styles and preferences are most commonly accepted\
    \ in the industry.\n\nIn this chapter, I'll provide examples of what many professional\
    \ teams consider good code hygiene in JavaScript, without them being tied to particular\
    \ programming areas or concepts.\n\nLet's start with an example we saw in the\
    \ previous chapter.\n\n# Pass arguments as an object\n\nSay we have a function,\
    \ createUser, which requires four arguments in order to create a new user (by\
    \ calling some API).\n\n```\nfunction createUser(username, date, isAdmin, isMod)\
    \ {\n  return fetch('https://some.api', {\n    method: 'POST',\n    body: JSON.stringify({\n\
    \      username, date, isAdmin, isMod\n    })\n  });\n}\n```\n\nWhen looking at\
    \ the function signature itself, things seem to make pretty good sense."
  - "[PAGE 42]\n\nBut how about when we call it?\n\n```\n```createUser('Simon', '2021-01-01',\
    \ false, true);```\n```\n\nIt's pretty unclear what the arguments mean, right?\n\
    Especially the last two booleans. I would have to go to the implementation to\
    \ look it up.\n\nInstead, we can wrap the arguments in an object.\n\n```\n```function\
    \ createUser({ username, date, isAdmin, isMod }) {\n  return fetch('https://some.api',\
    \ {\n    method: 'POST',\n    body: JSON.stringify({\n      username, date, isAdmin,\
    \ isMod\n    })\n  });\n}```\n```\n\nThanks to ES6 object destructuring, we can\
    \ do this easily by simply adding curly brackets around the arguments."
  - "[PAGE 43]\n\nNow, whenever we call createUser, we pass an object as a single\
    \ argument with the required values as properties instead.\n\n```\n```javascriptncreateUser({\n\
    \  username: 'Simon',\n  date: '2021-01-01',\n  asAdmin: false,\n  isMod: true,\n\
    });\n```\n```\n\nSee how nice that reads out now. We're no longer in doubt what\
    \ those booleans mean.\n\n+   Also, we get a few more benefits from this approach:\n\
    * It's easier to handle optional properties\n* We don't depend on the order of\
    \ the arguments\n\nFrom my experience in the industry, this is a very popular\
    \ approach whenever your function requires more than 1-2 arguments.\n\nThere's\
    \ another version of that I've seen very often: Passing optional arguments as\
    \ an options object. This is adopted in NodeJS and a range of well-known Open-Source\
    \ libraries."
  - "[PAGE 44]\n\nThe idea is to pass 1-2 essential arguments and then pass the remaining\
    \ arguments as an options object.\n\n```\nfunction createUser(username, date,\
    \ options) {\n  return fetch('https://some.api', {\n    method: 'POST',\n    body:\
    \ JSON.stringify({\n    username,\n    date,\n    isAdmin: options ? !!options.isAdmin\
    \ : false,\n    isMod: options ? !!options.isMod : false\n    })\n  });\n}\n```\n\
    \nNow we need to check if the options object is set before accessing its values\
    \ and provide proper fallbacks.\n\nOn the other hand, calling the createUser function\
    \ now looks very clean.\n\n```\ncreateUser('Simon', '2021-01-01', {\n  isMod:\
    \ true,\n});\n```\n\nThe first two arguments are pretty obvious, and we can now\
    \ optionally provide options when needed."
  - "[PAGE 45]\n\n# Return associated data as tuples\n\nIn JavaScript, we can return\
    \ a single value from a function.\nBut often enough, we need to return multiple\
    \ values that are associated\together.\n\nA common approach is to return a tuple\
    \ containing the values.\nIn short, a tuple is an ordered list of elements.\n\n\
    Let's say we have a function, `getElementPosition`, that retrieves a DOM\nelement's\
    \ position given an id.\nIn this case, x and y are associated values. Thus, it\
    \ makes perfect sense to\nreturn them both as a tuple.\n\n```\nfunction getElementPosition(elementID)\
    \ {\n  const element = document.getElementById(elementID);\n\n  if (!element)\
    \ {\n    return [NaN, NaN];\n  }\n\n  const rect = element.getBoundingClientRect();\n\
    \  return [rect.x, rect.y];\n}\n\nconst [x, y] = getElementPosition('my-element');\n\
    console.log(x, y);\n// 278.5, 122.3\n```"
  - "[PAGE 46]\n\n# Do not extend builtins\n\nWhen you first understand JavaScript’s\
    \ prototype chain and understand how you can extend prototype, including the JavaScript\
    \ builtins, you may experience a sensation of overwhelming superpowers.\n\nNow,\
    \ you can extend the Array prototype to include your own custom array method along\
    \ with map, filter, and reduce.\nmean - is this just cool or what?\n\n```\nArray.prototype.average\
    \ = function () {\n  return this.reduce((acc, elem) => acc + elem / this.length);\n\
    }\n\nconst list = [1, 2, 3];\nconst avg = list.average();\n\nconsole.log(avg);\n\
    // 2\n```\n\nIt’s not! In fact, this is deeply problematic and can lead to a range\
    \ of rather serious issues. Extending the builtins should be avoided at all costs.\n\
    \nIn fact, there are horror stories of entire applications being brought to their\
    \ knees because of this pattern.\n\nUnfortunately, some third-party libraries\
    \ in the past had a bad habit of doing this, and you may accidentally override\
    \ it, causing a world of headaches!"
  - "[PAGE 47]\n\nInstead, keep things separated and pure!\nBuild your own utility\
    \ pack instead, and keep it in its own module.\n\n```\nexport function average(list)\
    \ {\n  return list.reduce((acc, elem) => acc + elem / list.length);\n}\n```\n\n\
    ```\nimport { average } from \"./array-utils\";\n\nconst list = [1, 2, 3];\nconst\
    \ avg = average(list);\nnconsole.log(avg);\n// 2\n```\n\nMuch better!\nAs this\
    \ collection grows, it's easy to extract it into an NPM package so it can be reused\
    \ across projects.\n\n# Avoid default exports\n\nThis brings us to the next point.\n\
    As you may have noticed, I haven't used export default in any of my examples.\n\
    That's deliberate.\n\nThis is especially important if you're using TypeScript,\
    \ but I strongly recommend getting rid of the habits of using default exports\
    \ entirely.\n\nWhy?"
  - '[PAGE 48]


    # Poor Discoverability


    It makes it hard for IntelliSense in modern code editors like VSCode and Webstorm
    to suggest exports from a module when you start typing.


    # Annoying when using CommonJS


    I don''t know if you''ve ever had to put that .default at the end of a require
    statement? Pretty annoying and ugly, isn''t it?


    # Annoying when using Dynamic Imports


    Similar to CommonJS and require, using a Dynamic Import also forces you to dot
    into a .default.


    # Name Protection


    When you import from a default export, you can essentially name the import whatever
    you want. It''s hard to refactor later, and it may result in naming inconsistencies
    and typos.


    # Re-exporting


    Using barrels to re-export modules from a centralized place is common when creating
    packages for NPM, or when dealing with larger code-bases with lots of modules.
    The default export forces you to rename your export, which again may lead to inconsistencies
    in naming.


    Some would argue that it''s a matter of use-case, though using named exports instead
    of default exports doesn''t really come with any tradeoffs, so I suggest simply
    sticking to that.'
  - "[PAGE 49]\n\n# Drop the single-letter variable names\n\nI've seen this lot. Single-letter\
    \ variable names, especially in callbacks.\nShort, concise code is not necessarily\
    \ ideal.\nTake a look at this code right here.\n\n```\nconst images = users.filter((u)\
    \ => {\n  return u.entities.find((e = e.type === 'profile_image'));\n});\n```\n\
    \nu and e? No thanks, clarity, and readability is ideal.\nEven if it cost a few\
    \ extra lines.\n\n```\nconst images = users.filter((user) => {\n  return user.entities.find(\n\
    \    (entity = entity.type === 'profile_image')\n  );\n});\n```\n\nThere are a\
    \ few places where the single-letter variable name is conventionally accepted.\
    \ For instance, for for-loops, using the i variable.\nOther than that, get a good\
    \ habit of naming the arguments of the callback.\nTypically, you want to be using\
    \ the singular version of the word of the list.\nLike I do here with users and\
    \ user."
  - "[PAGE 50]\n\n# Arrow function vs. function declaration\n\nYou may have noticed\
    \ that I'm using the function keyword in my examples, rather than using arrow\
    \ function expressions using const.\n\nI'm going to mention it here, even though\
    \ I cannot give you a clear direction on this one.\n\nIn my experience from the\
    \ industry, this is strictly down to preference.\n\n```\nexport function average(list)\
    \ {\n  // implementation\n}\nexport const average = (list) => {\n  // implementation\n\
    }\n```\n\nAfter ES6, the arrow function expression seemed to rise in popularity,\
    \ and indeed, they behave differently than classical function declarations.\n\n\
    In the later years, I've noticed that the function keyword has found its way back,\
    \ and as long as you're using it without depending on its lexical context (using\
    \ it purely, avoid using this, and avoid using it as a constructor), then you're\
    \ fine using either one.\n\nIf you're joining a team and the codebase already\
    \ follows the convention of using either one, stick with that."
- md: "\n# TypeScript\n\nTypeScript is a language for application-scale JavaScript\
    \ development.\nIt's a typed superset of JavaScript used to add static typing\
    \ and describe the shapes of objects while working with JavaScript.\n\nIt's an\
    \ extremely popular choice on professional software teams building complex web,\
    \ mobile, and desktop applications at scale.\n\nYet, it's definitely not all teams\
    \ I've been working with that have been equally excited about it.\nIn fact, some\
    \ teams downright hate it.\n\nIn this chapter, I'll try to describe the “sweet\
    \ spot” that both routed JavaScript developers and TypeScript enthusiasts seem\
    \ to be on board with, as well as describing some do's and don'ts that I've seen\
    \ from the industry.\n\n## Don't overdo it\n\nIf you're working with a team of\
    \ experienced JavaScript developers, who are likely to appreciate some of the\
    \ flexibility you get from the loosely-typed JavaScript, you are going to get\
    \ a lot of pushback if you're trying to introduce (or even enforce) TypeScript\
    \ used to its fullest capacity.\n\nSo from my experience with TypeScript in the\
    \ industry, it stands out very clear: don't overdo it!\n\nIt's great if you're\
    \ enthusiastic about TypeScript. It's an awesome language. But there's not a lot\
    \ of developers who want to see something like this.\n\n```typescript\ntype RequireOnly<T,\
    \ Keys extends keyof T = keyof T> =\n  Pick<T, Exclude<keyof T, Keys>> &\n  {\
    \ [K in Keys]?: Required<Pick<T, K>> }\n  & Partial<Record<Exclude<Keys, K>, undefined>>;;\n\
    ```\n\n(Example code from an actual project I've worked on)\n\nFrom what I've\
    \ seen, the most effective use of TypeScript really boils down to the following:\n\
    \n- Describing the shape of objects with interfaces\n- Typing the arguments and\
    \ return values of functions\n- Using generics to use more general-purpose function\
    \ signatures\n- Using the TypeScript Utility Types for more flexible type descriptions\n\
    \nIn particular, it's popular to describe the JSON response from an API using\
    \ interfaces. IntelliSense enhances productivity quite radically, and with modern\
    \ solutions like GraphQL, you can get tools that auto-generate these interfaces\
    \ based on the schema.\n\nThis part of TypeScript that's not annoying, but simply\
    \ saves time, seems to be quite popular with everyone.\n\n## Let TypeScript infer\
    \ the type\n\nOne thing I've noticed from new TypeScript converts is that they\
    \ tend to insist on typing *everything.*\n\nAll functions must have a return type,\
    \ all arguments *must* be typed, all variable declarations *must* be followed\
    \ immediately by their type, and so on.\n\nThis is the part that's going to feel\
    \ very tedious and bureaucratic to the rest of the team who may not be flying\
    \ high on TypeScript.\n\nAnd more importantly: it's not necessary.\n\nTypeScript\
    \ is **very good** at inferring the types themselves. You don't have to trivially\
    \ type out every single thing.\n\n```typescript\nfunction addOne(n: number = 0):\
    \ number {\n  return n + 1;\n}\n```\n\n```typescript\nfunction addOne(n = 0) {\n\
    \  return n + 1;\n}\n```\n\nYou can always hover the mouse over an argument or\
    \ a function to see if TypeScript infers the type (correctly) by itself.\n\n```typescript\n\
    const name: string = 'simon';\n```\n\nYou can do the same with variables. If you\
    \ hover the mouse over the name variable in the last example, you'll notice that\
    \ TypeScript figured it out from the assignment. No need to type it.\n\n```typescript\n\
    const name = 'simon';\n```\n\n```typescript\nconst [name, setName] = useState<string>('simon');\n\
    ```\n\n```typescript\nconst [name, setName] = useState('simon');\n```\n\nIn React,\
    \ the useState hook is also smart enough to let TypeScript infer the type based\
    \ on the default value. No need to type it.\n\n## Avoid using any\n\nGoing from\
    \ one extreme to another: I've also witnessed quite a few teams changing to TypeScript\
    \ because of the hype.\n\nBut without properly using it, mainly due to writing\
    \ any all over the place.\n\n```typescript\nfunction addOne(n: any): any {\n \
    \ if (typeof n === 'number') {\n    return n + 1;\n  }\n  return !!n;\n}\n```\n\
    \nObviously, TypeScript is adding zero value here.\n\nI totally get it - if you're\
    \ new to TypeScript, some of the rather obscure compile-time errors can be confusing\
    \ and feel like it's slowing you down. But if you're too busy to learn the basics\
    \ of TypeScript, then I strongly suggest not using TypeScript. Stick to JavaScript,\
    \ in that case.\n\nThere's no point in using a strictly typed language if you're\
    \ going to enforce loose typing everywhere.\n\nAvoid using any. Or avoid using\
    \ TypeScript altogether.\n\n## React\n\nReact is a huge subject, and there are\
    \ a lot of different opinions out there.\nIn fact, React is one of the areas of\
    \ work where I have encountered the most disagreement on different teams.\n\n\
    In this chapter, I'll touch upon some of the most common discussions I've witnessed\
    \ and provide my general impression of how most teams prefer their React code.\n\
    \n## Use React hooks\n\nI'll keep this one short. If you're still stuck writing\
    \ class components, get rid of that habit right away.\n\nIt is my clear impression\
    \ that by far most teams have now effectively moved to use React Hooks, unless\
    \ you've been dealing with legacy projects where class components are carried\
    \ over, you can safely expect that the next team you're going to join will be\
    \ using React hooks.\n\n## Don't worry about arrow functions in JSX\n\n(Note:\
    \ The OCR text for this section contained a social media thread noise interrupting\
    \ the main text. Based on the context of the book, the core message is about the\
    \ performance of arrow functions in JSX.)\n\nI've seen this pattern a lot, and\
    \ I've been involved in a few discussions on this.\n\nYet, I've found that most\
    \ teams dislike this. If you're about to declare an inner function in a component\
    \ (perhaps with a prefix render) that renders JSX, you should reconsider.\n"
  mdcn: "\n\n# TypeScript\n\nTypeScript 是一种用于应用级 JavaScript 开发的语言。\n它是 JavaScript\
    \ 的带类型超集，用于在与 JavaScript 工作时添加静态类型并描述对象的形状。\n\n在构建构建复杂的 Web、移动端和桌面应用的专业软件团队中，TypeScript\
    \ 是一个非常受欢迎的选择。\n\n然而，在我合作过的团队中，绝非所有团队都对它感到同样兴奋。\n事实上，有些团队甚至非常讨厌它。\n\n在本章中，我将尝试描述一个让资深\
    \ JavaScript 开发者和 TypeScript 爱好者者似乎都认同的“平衡点”，并描述我在行业中看到的一些“该做”和“不该做”。\n\n## 不要过度使用\n\
    \n如果你正在与一个经验丰富的 JavaScript 开发者团队工作，他们可能很欣赏松散类型 JavaScript 提供的某些灵活性，那么如果你试图完全引入（甚至强制）充分使用\
    \ TypeScript，你将会遇到很多阻力。\n\n因此，根据我在行业中使用 TypeScript 的经验，这一点非常明确：不要过度使用！\n\n如果你对\
    \ TypeScript 充满热情，那是很好的。它是一门很棒的语言。但有很多开发者想看到这样的代码。\n\n```typescript\ntype RequireOnly<T,\
    \ Keys extends keyof T = keyof T> =\n  Pick<T, Exclude<keyof T, Keys>> &\n  {\
    \ [K in Keys]?: Required<Pick<T, K>> }\n  & Partial<Record<Exclude<Keys, K>, undefined>>;;\n\
    ```\n\n（示例代码来自我工作过的实际项目）\n\n根据我的观察，TypeScript 最有效的用法实际上归结为以下几：\n\n- 使用接口描述对象的形状\n\
    - 为函数的参数和返回值编写类型\n- 使用泛型使用更通用的函数签名\n- 使用 TypeScript 用类型进行更灵活的类型描述\n\n特别是，使用接口描述\
    \ API 的 JSON 响应非常流行。IntelliSense 极大地提高了生产力，而且通过 GraphQL 等现代解决方案，你可以根据 schema 自动生成这些接口的工具。\n\
    \nTypeScript 中这部分不烦人且仅仅节省时间的功能似乎非常受欢迎。\n\n## 让 TypeScript 推断类型\n\n我从新转 TypeScript\
    \ 的人员那里注意到，他们倾向于坚持为*所有内容*编写类型。\n\n所有函数必须有返回类型，所有参数*必须*有类型，所有变量声明*必须*紧跟其类型，等等。\n\
    \n对于那些可能还没有沉浸在 TypeScript 喜悦中的团队其他成员来说，这部分会感到非常繁琐和官僚化。\n\n更重要的是：没有必要。\n\nTypeScript\
    \ **非常擅长**推断类型本身。你不需要显式地写出每一个的类型。\n\n```typescript\nfunction addOne(n: number\
    \ = 0): number {\n  return n + 1;\n}\n```\n\n```typescript\nfunction addOne(n\
    \ = 0) {\n  return n + 1;\n}\n```\n\n你可以随时将鼠标悬停在参数或函数上，查看 TypeScript 是否会自动（正确地）推断类型。\n\
    \n```typescript\nconst name: string = 'simon';\n```\n\n你对变量也可以这样做。如果你将鼠标悬停在最后一个例子中的\
    \ `name` 变量上，你会发现 TypeScript 是通过赋值推断出来的。不需要手动写。\n\n```typescript\nconst name =\
    \ 'simon';\n```\n\n```typescript\nconst [name, setName] = useState<string>('simon');\n\
    ```\n\n```typescript\nconst [name, setName] = useState('simon');\n```\n\n在 React\
    \ 中，`useState` 钩子也足够智能，可以让 TypeScript 根据默认值推断类型。不需要手动写。\n\n## 避免使用 any\n\n从一个极端走向另一个极端：我也目证了不少团队因为炒作而转向\
    \ TypeScript。\n\n但并没有正确地使用它，主要是因为到处写 `any`。\n\n```typescript\nfunction addOne(n:\
    \ any): any {\n  if (typeof n === 'number') {\n    return n + 1;\n  }\n  return\
    \ !!n;\n}\n```\n\n显然，TypeScript 在这里没有产生任何价值。\n\n我完全理解——如果你是 TypeScript 新手，某些晦涩的编译错误可能会让你困惑并觉得拖慢了你的速度。但如果你忙到没有时间学习\
    \ TypeScript的基础，我强烈建议不要使用 TypeScript。在这种情况下，坚持使用 JavaScript。\n\n如果你到处强制松散类型，那么使用强类型语言就没有意义。\n\
    \n避免使用 `any`。或者完全不要使用 TypeScript。\n\n## React\n\nReact 是一个巨大的课题，有很多观点。\n事实上，React\
    \ 是我在不同团队中遇到最多争议领域之一。\n\n在本章中，我将涉及我看到的一些常见讨论，并对大多数团队喜欢的 React 代码提供我的总体印象。\n\n\
    ## 使用 React hooks\n\n这一点我简单来说。如果你还在纠结于编写类组件（class components），请立即改这个习惯。\n\n我的明确印象是，到为止大多数团队现在已经有效地转向使用\
    \ React Hooks，除非你正在处理带有类组件的遗留项目，否则你可以放心地你加入的下一个团队将使用 React hooks。\n\n## 不要担心 JSX\
    \ 中的箭头函数\n\n（注：此节的 OCR 文本包含一段干扰正文的社交媒体线程噪音。根据书籍上下文，核心信息是关于箭头函数在 JSX 中的性能。）\n\n\
    我见过很多这种模式，并参与过几次对此的讨论。\n\n然而，我发现大多数团队不喜欢这样做。如果你准备在组件中声明一个内部函数（可能带有 render 前缀）来渲染\
    \ JSX，你应该重新考虑一下。\n\n"
