  md: "# Classes vs Hooks in React\n\nIn 2018, React introduced hooks.\n\nThey did\
    \ this to get rid of classes and the confusing this keyword.\n\nWhy? Because React\
    \ is an inherently declarative UI library, and classes just don't really fit in.\n\
    \nIf you were working with React prior to 2018, I bet you've been writing a lot\
    \ of code like this.\n\n```\nimport React from \"react\";\n\nexport class ShowCount\
    \ extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { count: 0 };\n  }\n\n  componentDidMount() {\n    this.setState({ count:\
    \ this.props.count });\n  }\n\n  render() {\n    return (\n      <div>\n     \
    \   <p> Count: {this.state.count}</p>\n      </div>\n    );\n  }\n}\n```"
