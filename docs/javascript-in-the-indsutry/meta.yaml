    # Introduction


    I have had a front-row seat while JavaScript has taken over the industry.


    In the past ten years of working as a freelance consultant, I''ve had the joy
    of working with many different teams. I''ve participated in countless PR code
    reviews and have many heated discussions about JavaScript, best practices, clean
    code, patterns, and coding styles.


    I have taught JavaScript, React, and NodeJS on various talks and workshops, and
    furthermore, Ive spent the last year notoriously presenting my Twitter audience
    with small bits of code, asking them what they preferred and if they would have
    approved it in a PR.


    Here are my findings, impressions, and personal experience.

    All put together in an easy-to-digest e-book including examples and explanations.


    **This book is opinionated.**


    For each and every example in this book, you will find developers in the industry
    who disagree. This book teaches industry preferences and standards. But it is
    is, by definition, opinionated.


    **This is not a JavaScript fundamentals book.**


    Do note, that this book assumes fundamental understanding of the JavaScript language.'
  - '[PAGE 4]


    # Functional style


    JavaScript is a multi-paradigm programming language.

    This means that the language is open for programming in different styles, including
    object-oriented, procedural, protypal, and functional.


    By far, the most common styles you see are object-oriented and functional.

    Even though object-oriented languages such as Java and C# have had an enormous
    impact on the industry, the functional style JavaScript is the most popular and
    accepted in 2021. This is where you should be heading.


    # Imperative vs. declarative


    Object-oriented programming follows an imperative paradigm.

    Functional programming follows a declarative paradigm.


    Let’s look at the difference.


    Imperative programming focuses on how you want something done.

    You alter the state of your program step by step.


    Declarative programming focuses on what the end result will be.

    How to obtain that result is less interesting, as long as the process of obtaining
    it does not alter the state of your program.'
  - "[PAGE 5]\n\nWhen a function carries out a task in a deterministic way without\
    \ changing its environment (changing state in its surroundings), we call it pure.\n\
    Let's say we want to iterate through a list of numbers and multiply them all by\
    \ 2.\n\nAn imperative style would look something like this.\n\n```\nfunction multiplyAll(list)\
    \ {\n  for (let i = 0; i < list.length; i++) {\n    list[i] *= 2;\n  }\n}\n\n\
    const listOfNumbers = [1, 2, 3, 4, 5];\nmultiplyAll(listOfNumbers);\nconsole.log(listOfNumbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\nSimple and straightforward.\nBut there are two key\
    \ observations we need to make here:\n\n+   1. The function multiplyAll does not\
    \ have a return value.\n   Since it's not returning anything, we cannot determine\
    \ the result based on the input. Hence, it's not pure.\n2. The original listOfNumbers\
    \ array gets mutated.\n   The function alters (changes the state) of the input\
    \ given as an argument. Hence, it's not immutable."
  - "[PAGE 6]\n\nThese two simple behaviors are likely to result in bugs, code that\
    \ is hard to\ndebug, hard to test, and is likely to break your application at\
    \ scale!\nOn a lot of professional teams, this code would be immediately rejected\
    \ in a\nPull Request.\n\nLet’s rewrite it to follow a **declarative** style instead.\n\
    \n```\nconst multipliedNumbers = listOfNumbers.map(n => n * 2);\nconsole.log(multipliedNumbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\nWell, isn’t this our lucky day?\nJavaScript has a\
    \ method on the Array prototype built in that does exactly\nwhat we need. It’s\
    \ called *map*.\n\nLet’s do a few observations again:\n\n+   1. The function *map*\
    \ has a return value. It's a list with each element\naltered as specified in the\
    \ callback function we provide.\n   *Map* doesn’t change its surroundings and\
    \ will return the same result\nevery time, given the same callback and input.\
    \ Hence, *map* is **pure**.\n2. The original *listOfNumbers* stays untouched.\
    \ *Map* will create a new copy\nof the array for us, and alter that one instead.\
    \ Hence, *map* is **immutable**."
  - "[PAGE 7]\n\nAs it turns out, all the Array-methods(forEach, Map, Reduce, Filter,\
    \ ...) following a declarative programming style.\n\nThe code becomes way cleaner,\
    \ easier to test, less prone to introduce bugs, and much more likely to be approved\
    \ in the Pull Request on most professional teams today.\n\nBe careful about the\
    \ pitfalls, though.\nThe Array-methods are only pure and immutable to the extent\
    \ that you use them as intended.\n\n```\nconst names = [\"albert\", \"ronnie\"\
    , \"julie\"];\nconst people = {};\n\nconst peopleWithAges = names.reduce((newPeople,\
    \ name) => {\n  newPeople[name] = Math.floor(Math.random() * 100);\n  return newPeople;\n\
    }, people);\n\nconsole.log(people);\n// { albert: 18, ronnie: 94, julie: 31 }\n\
    ```\n\nThis is an example I've seen often.\nThe People object is still mutated\
    \ on, and the surroundings are still changed.\nDoing it as part of reduce isn't\
    \ changing this."
  - "[PAGE 8]\n\n```\n```javascript\\let max = 0;\nnumbers.forEach((n) => {\n  if\
    \ (n > max) max = n;\n});\n```\n```\n\nOr how about this?\nIt's as imperative\
    \ and mutable as it\\can possibly be!\nWhy not just use a regular for-loop\nthen?\
    \ It has better performance.\n\nSimilarly, utility libraries like lodash and date-fns,\
    \ and UI libraries like React - that are all built with a functional and declarative\
    \ style in mind - are only going to offer all its benefits if it's used the way\
    \ it was intended.\n\nI'm my career as a consultant, I've often witnessed chaotic,\
    \ careless and sometimes tragically funny - mixes of styles piled on top of each\
    \ other, totally defeats the purpose of keeping consistent with conventions and\
    \ coding styles throughout the application.\n\nOf course, software development\
    \ often goes fast, and there are many deadlines, demands from product owners,\
    \ bugs to fix fast, and so on. So the key is to get a good habit of writing clean\
    \ and declarative code under your skin and understand when to be stubborn about\
    \ it and when to simply let go.\n\nIn the rest of this chapter, I will provide\
    \ some of the most common examples of imperative code that could (and should)\
    \ be refactored into declarative code and how to do it."
  - "[PAGE 9]\n\n# Working with arrays\n\nIn JavaScript (and in programming, generally),\
    \ you'll find yourself working with arrays a lot.\n\nThis is why the famous array\
    \ methods introduced in ES6 became so popular. They really make our lives easier.\n\
    \nAnd recall: They are following a declarative programming style.\n\nIn this example,\
    \ we want to filter a list of candidates to only include candidates who are also\
    \ active members (exists in the activeMembers array). Below is an example of doing\
    \ this imperatively.\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_9_0.png)\n\n\
    ```\nconst activeMembers = [\"alex\", \"stephanie\"];\nconst candidates = [\"\
    alex\", \"martin\", \"anna\"];\n\nconst activeCandidates = [];\n\nfor (const candidate\
    \ of candidates) {\n  if (activeMembers.includes(candidate)) {\n    activeCandidates.push(candidate);\n\
    \  }\n}\n\nconsole.log(activeCandidates);\n// [\"alex\"]\n```"
- md: "\nThere are two red flags that should pop up in your mind here.\n\n- 1. You\
    \ are declaring an array outside the body of the loop.\n- 2. You are using the\
    \ push method to populate an array.\n\nAs a rule of thumb: Whenever you're about\
    \ to call the push method, ask yourself if this can be expressed in a declarative\
    \ way instead.\nThe push method is mutating the array.\n\nLet's refactor it.\n\
    \n```javascript\nconst activeMembers = [\"alex\", \"stephanie\"];\nconst candidates\
    \ = [\"alex\", \"martin\", \"anna\"];\n\nconst activeCandidates = candidates.filter(\n\
    \  (candidate) => activeMembers.includes(candidate)\n);\n\nconsole.log(activeCandidates);\n\
    // [\"alex\"]\n```\n\nAh, much better!\nNo surrounding states are changed. Nothing\
    \ is mutated on.\nThe activeCandidates is declared and directly assigned the result\
    \ of filter, which takes care of the job for us.\n\nLet’s take another example.\n\
    Here, we want to iterate through a list of numbers and find the sum.\nBelow is\
    \ an example of doing this imperatively.\n\n```javascript\nconst points = [3,\
    \ 9, 7, 8, 5, 2, 11, 14];\nlet totalPoints = 0;\n\nfor (const point of points)\
    \ {\n  totalPoints += point;\n}\n\nconsole.log(totalPoints);\n// 59\n```\n\nThere\
    \ are two red flags that should pop up in your mind here.\n\n- 1. You are declaring\
    \ a variable outside the body of the loop.\n- 2. You are using the let keyword\
    \ to initiate the variable.\n\nAs a rule of thumb: Whenever you find yourself\
    \ using the let keyword, ask yourself if you can achieve the desired result without\
    \ reassignment the variable.\nIn most cases, you don’t want to use let. You want\
    \ to initiate and assign variables immediately using const.\n\nLet's refactor\
    \ it.\n\n```javascript\nconst points = [3, 9, 7, 8, 5, 2, 11, 14];\nconst totalPoints\
    \ = points.reduce((total, point) => total + point);\nconsole.log(totalPoints);\n\
    // 59\n```\n\nPerfect!\n\nOne line of code. No surrounding states are changed.\
    \ No variables are being reassigned.\n\nI sometimes hear people propose this argument:\n\
    \n> “Reduce is difficult to understand. If you have juniors on your team, you\
    \ may want to go with the imperative approach”.\n\nI personally couldn't disagree\
    \ more.\nIt depends on its use - when reduce is kept simple, as in the example\
    \ above, it is perfectly within most junior developers' capability to comprehend.\n\
    \nThis is often a bad excuse from mid-levels and seniors who still haven't adapted\
    \ to this way of writing code but lack clear arguments for why they would stick\
    \ in their old imperative ways.\nLet's take another example. Sorting!\n\nThis\
    \ one gets a bit messier.\nTake look at the code below.\n\n```javascript\nconst\
    \ grades = [\"C\", \"A\", \"I\", \"B\", \"F\"];\nconst sortedGrades = grades.sort();\n\
    console.log(grades); // [\"A\", \"B\", \"C\", \"F\", \"I\"]\n```\n\nAt first glance,\
    \ this looks good. We're not using let, and we're not mutating the original array\
    \ using something like `push`. We use an Array-method that **declaratively** returns\
    \ the desired result.\n\nBut take a look at the `console.log` statement.\nYes.\
    \ JavaScript can be awful like this. It turns out that the sort method is really\
    \ old, and **does not** create a copy of the original array.\nInstead, it **mutates**\
    \ on the original array and returns its own array from the method call.\n\nWeird?\
    \ Yes.\nBut there are a handful of old Array-methods that do this.\nBe careful\
    \ with `push`, `shift`, `unshift`, `pop`, `reverse`, `splice`, `sort`, and `fill`.\n\
    Fortunately, as we saw in the example from before, most often we can simply avoid\
    \ calling these methods at all, to stay out of trouble.\n\nHowever, there are\
    \ cases, like using sort, where we have to use a method that mutates the original\
    \ array, in lack of better options.\n\nArray destructuring to the rescue!\n\n\
    Whenever these occasions arise, make sure to manually copy the array first, before\
    \ performing an operation on it.\n\nIt’s as simple as this.\n\n```javascript\n\
    const grades = [\"C\", \"A\", \"I\", \"B\", \"F\"];\nconst sortedGrades = [...grades].sort();\n\
    \nconsole.log(grades);\n// [\"C\", \"A\", \"I\", \"B\", \"F\"]\n\nconsole.log(sortedGrades);\n\
    // [\"A\", \"B\", \"C\", \"F\", \"I\"]\n```\n\nThat [...grades] makes the entire\
    \ difference.\n\nGet this habit into your fingers.\n\nLet's look at an example\
    \ using asynchronous operations. Iterative operations including asynchronous behavior\
    \ can be a little tricky to do using a declarative style.\n\nLet's say we have\
    \ a list of names. For each name, we want to make an API call and get some information,\
    \ and then keep a new list with this collection of information.\n\nA typical imperative\
    \ approach may look like this.\n\n```javascript\nconst names = ['jack', 'annie',\
    \ 'peter'];\n\nasync function getInformationFromName(name) {\n  const request\
    \ = await fetch('https://some.api?name=' + name);\n  const result = await request.json();\n\
    \  return result;\n}\n\nconst namesWithInformation = [];\n\nfor (const name of\
    \ names) {\n  const information = await getInformationFromName(name);\n  namesWithInformation.push(information);\n\
    }\n```\n\nIterative operations including asynchronous behavior can be a little\
    \ tricky to do using a declarative style.\n\nLet's say we have a list of names.\
    \ For each name, we want to make an API call and get some information, and then\
    \ keep a new list with this collection of information.\n\nA typical imperative\
    \ approach may look like this.\n\n```javascript\nconst names = ['jack', 'annie',\
    \ 'peter'];\n\nasync function getInformationFromName(name) {\n  const request\
