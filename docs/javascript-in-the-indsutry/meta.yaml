    \ 5, 2, 11, 14];\nconst totalPoints = points.reduce((total, point) => total +\
    \ point);\nconsole.log(totalPoints);\n// 59\n```\n\n完美！\n\n一行代码。周围的状态没有被改变。没有变量被重新赋值。\n\
    \n我有时听到有人提出这种观点：\n\n> “`Reduce` 很难理解。如果你的团队中有初级开发者，你可能倾向于使用命令式方法”。\n\n我个人完全不同意。\n\
    这取决于它的用法——当 `reduce` 保持简单时（如上面的示例），它完全在大多数初级开发者的理解能力范围内。\n\n这通常是中级和高级开发人员的糟糕借口，他们还没有适应这种编写代码的方式，但缺乏明确的论据来解释为什么他们坚持旧的命令式写法。\n\
    让我们再看另一个例子。排序！\n\n这个变得有点复杂。\n看看下面的代码。\n\n```javascript\nconst grades = [\"C\"\
    , \"A\", \"I\", \"B\", \"F\"];\nconst sortedGrades = grades.sort();\nconsole.log(grades);\
    \ // [\"A\", \"B\", \"C\", \"F\", \"I\"]\n```\n\n乍看之下，这看起来很好。我们没有使用 `let`，也没有使用类似\
    \ `push` 的方法修改原数组。我们使用了一个**声明式**返回所需结果的数组方法。\n\n但看看 `console.log` 语句。\n是的。JavaScript\
    \ 可以变得糟糕到这样。事实证明 `sort` 方法非常老旧，而且它**没有**创建原数组的副本。\n相反，它**修改**了原数组，并在方法调用时返回它自身的数组。\n\
    \n奇怪吗？是的。\n但有很多旧的数组方法都是这样。\n小心使用 `push`、`shift`、`unshift`、`pop`、`reverse`、`splice`、`sort`\
    \ 和 `fill`。\n幸运的是，正如我们在之前的示例看到的，通常我们可以直接这些这些方法来避免麻烦。\n\n然而，在某些情况下（例如使用 `sort`），在缺乏更好选择的情况下，我们必须使用修改原数组的方法。\n\
    \n数组解构救了急！\n\n每当这些情况发生时，确保在对数组执行操作之前先手动复制一份。\n\n操作非常简单：\n\n```javascript\nconst\
    \ grades = [\"C\", \"A\", \"I\", \"B\", \"F\"];\nconst sortedGrades = [...grades].sort();\n\
    \nconsole.log(grades);\n// [\"C\", \"A\", \"I\", \"B\", \"F\"]\n\nconsole.log(sortedGrades);\n\
    // [\"A\", \"B\", \"C\", \"F\", \"I\"]\n```\n\n这个 `[...grades]` 产生了本质的区别。\n\n\
    把这个习惯变成肌肉记忆。\n\n让我们看一个使用异步操作的例子。包含异步行为的迭代操作使用声明式风格可能有点棘。\n\n假设我们有一个名称列表。对于每个名称，我们都想调用\
    \ API 获取一些信息，然后保留一个包含这些信息的新列表。\n\n典型的命令式方法可能如下：\n\n```javascript\nconst names\
    \ = ['jack', 'annie', 'peter'];\n\nasync function getInformationFromName(name)\
    \ {\n  const request = await fetch('https://some.api?name=' + name);\n  const\
    \ result = await request.json();\n  return result;\n}\n\nconst namesWithInformation\
    \ = [];\n\nfor (const name of names) {\n  const information = await getInformationFromName(name);\n\
    \  namesWithInformation.push(information);\n}\n```\n"
