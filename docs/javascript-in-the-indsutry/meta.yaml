  md: '# Control flows


    In programming, a control flow is how the interpreter runs your code from top
    to bottom.


    There are a handful of statements and operators that change the control flow.
    They are common for mostly all programming languages; loops, if-else, switch,
    function calls, ternary, etc.


    Hopefully, you know all of these already, and understand how they work. (If not,
    it''s time to revisit fundamentals).


    In this chapter, I''ll discuss how these statements and operators are used, and
    what is widely accepted as best practice in the industry.


    Let''s start with one of my favorites.


    # Guard clauses


    > "In computer programming, a guard is a boolean expression that must evaluate
    true if the program execution is to continue in the branch in question. Regardless
    of which programming language is used, guard code or a guard clause is a check
    of integrity preconditions to avoid errors during execution."


    +   - Wikipedia


    Let''s take a look at an example.'
  merge: -1
  pgno: 27
