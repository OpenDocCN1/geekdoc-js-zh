  md: '# Skip the ''else'' part


    The if-else statement. It''s one of the first things we learn when starting to
    program.


    Now, let''s move on by unlearning how to use else.


    Generally speaking, if your function includes an else, it''s a sign that your
    function is doing more than one thing.


    It''s violating the well-known Single Responsibility Principle, and often results
    in error-prone branching logic that gets hard to wrap your head around at scale.


    So as a rule of thumb, whenever you''re about to write else, stop and reconsider
    what you''re doing and search for an alternative way to express the logic.


    Let''s cover a few ways that we can avoid using else.


    One of them is guard clauses, which we just covered above.


    Another approach is using default values.


    Let''s take an example.'
  merge: -1
  pgno: 30
- img_proc: true
  md: "Let's say we have a function, `negateOdd`, which takes a number and negates\
    \ it if the number is odd.\n\n```\nfunction negateOdd(n) {\n  let result;\n\n\
    \  if (n % 2 === 0) {\n    result = n;\n  } else {\n    result = n * -1;\n  }\n\
    \n  return result;\n}\n```\n\nThe function does what it's supposed to. But it's\
    \ unnecessarily using an else. Let's refactor it, and instead, use a default value.\n\
    \n```\nfunction negateOdd(n) {\n  let result = n;\n\n  if (n % 2 === 0) {\n  \
    \  result = n * -1;\n  }\n\n  return result;\n}\n```"
  merge: -1
  pgno: 31
- img_proc: true
  md: "Better already! We now assign result with a default value, and the variable\
    \ will only be changed if the condition in the if-statement is met.\n\nNow, we\
    \ also wrap the special case of the function in an if.\nYou could argue that when\
    \ reading this function later it might help us quickly pinpoint where the essential\
    \ part of the logic is going on.\n\nBut let's do even better. We know from the\
    \ previous chapter that we're supposed to question the use of let and imperative\
    \ code.\nLet's see if we can make this function even more readable and concise.\n\
    \n```\nfunction negateodd(n) {\n  if (n % 2 === 0) {\n    return n;\n  }\n\n \
    \ return n * -1;\n}\n```\n\nThere we go! No variable assignment at all. Only different\
    \ return values based on the given condition.\n\nNotice how we moved that essential\
    \ part of the logic to the end of the function body. A lot of developers prefer\
    \ having the essential part of a function's job put at the end of the function\
    \ body - just like we did with the guard clause before."
