- md: "\n# Code hygiene & good practices\n\nWe've covered two fundamental areas of\
    \ programming and which styles and preferences are most commonly accepted in the\
    \ industry.\n\nIn this chapter, I'll provide examples of what many professional\
    \ teams consider good code hygiene in JavaScript, without them being tied to particular\
    \ programming areas or concepts.\n\nLet's start with an example we saw in the\
    \ previous chapter.\n\n## Pass arguments as an object\n\nSay we have a function,\
    \ `createUser`, which requires four arguments in order to create a new user (by\
    \ calling some API).\n\n```javascript\nfunction createUser(username, date, isAdmin,\
    \ isMod) {\n  return fetch('https://some.api', {\n    method: 'POST',\n    body:\
    \ JSON.stringify({\n      username, date, isAdmin, isMod\n    })\n  });\n}\n```\n\
    \nWhen looking at the function signature itself, things seem to make pretty good\
    \ sense.\n\nBut how about when we call it?\n\n```javascript\ncreateUser('Simon',\
    \ '2021-01-01', false, true);\n```\n\nIt's pretty unclear what the arguments mean,\
    \ right?\nEspecially the last two booleans. I would have to go to the implementation\
    \ to look it up.\n\nInstead, we can wrap the arguments in an object.\n\n```javascript\n\
    function createUser({ username, date, isAdmin, isMod }) {\n  return fetch('https://some.api',\
    \ {\n    method: 'POST',\n    body: JSON.stringify({\n      username, date, isAdmin,\
    \ isMod\n    })\n  });\n}\n```\n\nThanks to ES6 object destructuring, we can do\
    \ this easily by simply adding curly brackets around the arguments.\n\nNow, whenever\
    \ we call `createUser`, we pass an object as a single argument with the required\
    \ values as properties instead.\n\n```javascript\ncreateUser({\n  username: 'Simon',\n\
    \  date: '2021-01-01',\n  isAdmin: false,\n  isMod: true,\n});\n```\n\nSee how\
    \ nice that reads out now. We're no longer in doubt what those booleans mean.\n\
    \n- Also, we get a few more benefits from this approach:\n- It's easier to handle\
    \ optional properties\n- We don't depend on the order of the arguments\n\nFrom\
    \ my experience in the industry, this is a very popular approach whenever your\
    \ function requires more than 1-2 arguments.\n\nThere's another version of that\
    \ I've seen very often: Passing optional arguments as an options object. This\
    \ is adopted in NodeJS and a range of well-known Open-Source libraries.\n\nThe\
    \ idea is to pass 1-2 essential arguments and then pass the remaining arguments\
    \ as an options object.\n\n```javascript\nfunction createUser(username, date,\
    \ options) {\n  return fetch('https://some.api', {\n    method: 'POST',\n    body:\
    \ JSON.stringify({\n    username,\n    date,\n    isAdmin: options ? !!options.isAdmin\
    \ : false,\n    isMod: options ? !!options.isMod : false\n    })\n  });\n}\n```\n\
    \nNow we need to check if the options object is set before accessing its values\
    \ and provide proper fallbacks.\n\nOn the other hand, calling the `createUser`\
    \ function now looks very clean.\n\n```javascript\ncreateUser('Simon', '2021-01-01',\
    \ {\n  isMod: true,\n});\n```\n\nThe first two arguments are pretty obvious, and\
    \ we can now optionally provide options when needed.\n\n## Return associated data\
    \ as tuples\n\nIn JavaScript, we can return a single value from a function.\n\
    But often enough, we need to return multiple values that are associated together.\n\
    \nA common approach is to return a tuple containing the values.\nIn short, a tuple\
    \ is an ordered list of elements.\n\nLet's say we have a function, `getElementPosition`,\
    \ that retrieves a DOM element's position given an id.\nIn this case, x and y\
    \ are associated values. Thus, it makes perfect sense to return them both as a\
    \ tuple.\n\n```javascript\nfunction getElementPosition(elementID) {\n  const element\
    \ = document.getElementById(elementID);\n\n  if (!element) {\n    return [NaN,\
    \ NaN];\n  }\n\n  const rect = element.getBoundingClientRect();\n  return [rect.x,\
    \ rect.y];\n}\n\nconst [x, y] = getElementPosition('my-element');\nconsole.log(x,\
    \ y);\n// 278.5, 122.3\n```\n\n## Do not extend builtins\n\nWhen you first understand\
    \ JavaScript’s prototype chain and understand how you can extend prototype, including\
    \ the JavaScript builtins, you may experience a sensation of overwhelming superpowers.\n\
    \nNow, you can extend the Array prototype to include your own custom array method\
    \ along with map, filter, and reduce.\nmean - is this just cool or what?\n\n```javascript\n\
    Array.prototype.average = function () {\n  return this.reduce((acc, elem) => acc\
    \ + elem / this.length);\n}\n\nconst list = [1, 2, 3];\nconst avg = list.average();\n\
    \nconsole.log(avg);\n// 2\n```\n\nIt’s not! In fact, this is deeply problematic\
    \ and can lead to a range of rather serious issues. Extending the builtins should\
    \ be avoided at all costs.\n\nIn fact, there are horror stories of entire applications\
    \ being brought to their knees because of this pattern.\n\nUnfortunately, some\
    \ third-party libraries in the past had a bad habit of doing this, and you may\
    \ accidentally override it, causing a world of headaches!\n\nInstead, keep things\
    \ separated and pure!\nBuild your own utility pack instead, and keep it in its\
    \ own module.\n\n```javascript\nexport function average(list) {\n  return list.reduce((acc,\
    \ elem) => acc + elem / list.length);\n}\n```\n\n```javascript\nimport { average\
    \ } from \"./array-utils\";\n\nconst list = [1, 2, 3];\nconst avg = average(list);\n\
    console.log(avg);\n// 2\n```\n\nMuch better!\nAs this collection grows, it's easy\
    \ to extract it into an NPM package so it can be reused across projects.\n\n##\
    \ Avoid default exports\n\nThis brings us to the next point.\nAs you may have\
    \ noticed, I haven't used `export default` in any of my examples.\nThat's deliberate.\n\
    \nThis is especially important if you're using TypeScript, but I strongly recommend\
    \ getting rid of the habits of using default exports entirely.\n\nWhy?\n\n## Poor\
    \ Discoverability\n\nIt makes it hard for IntelliSense in modern code editors\
    \ like VSCode and Webstorm to suggest exports from a module when you start typing.\n\
    \n## Annoying when using CommonJS\n\nI don't know if you've ever had to put that\
    \ `.default` at the end of a require statement? Pretty annoying and ugly, isn't\
    \ it?\n\n## Annoying when using Dynamic Imports\n\nSimilar to CommonJS and require,\
    \ using Dynamic Import also forces you to .default.\n\n## Name Protection\n\n\
    When you import from a default export, you can name the import whatever you want.\n\
    \n## Re-exporting\n\nUsing barrels to re-export modules from a centralized place\
    \ is common when creating packages for NPM, or when dealing with largerbases.\
    \ The default export forces you to rename your export, which again may lead to\
    \ inconsistencies.\n\nUsing named exports instead of default exports doesn't really\
    \ come with any tradeoffs, so I suggest simply sticking to that.\n\n## Drop single-letter\
    \ variable names\n\nI've seen this lot. Single-letter variable names, especially\
    \ in callbacks.\nShort, concise code is not necessarily ideal.\nTake a look at\
    \ this code here.\n\n```javascript\nconst images = users.filter((u) => {\n  return\
    \ u.entities.find((e = e.type === 'profile-image'));\n});\n```\n\nu and e? No\
    \ thanks, clarity and readability is ideal.\nEven if it cost a few lines.\n\n\
    ```javascript\nconst images = users.filter((user) => {\n  return user.entities.find(\n\
    \    (entity = entity.type === 'profile-image')\n  );\n});\n```\n\nThere are a\
    \ few places where the single-letter variable name is conventionally accepted.\
    \ For instance, for for-loops, using the i variable.\nOther than that, get a good\
    \ habit of naming the arguments of the callback.\nTypically, you want to be using\
    \ the singular version of the word of the list.\nLike I do here with users and\
    \ user.\n\n## Arrow function vs. function declaration\n\nYou may have noticed\
    \ that I'm using the function keyword in my examples, rather than using arrow\
    \ function expressions using const.\n\nI'm going to mention it here, even though\
    \ I cannot give you a clear direction on this one.\n\nIn my experience from the\
    \ industry, this is strictly down to preference.\n\n```javascript\nexport function\
    \ average(list) {\n  // implementation\n}\nexport const average = (list) => {\n\
    \  // implementation\n}\n```\n"
  mdcn: "\n\n# 代码整洁与良好实践\n\n我们已经涵盖了编程的两个基础领域，以及行业中最常接受的风格和偏好。\n\n在本章中，我将提供一些许多专业团队认为的\
    \ JavaScript 良好代码整洁示例，这些示例并不限于特定的编程领域或概念。\n\n让我们从上一节看到过的一个示例开始。\n\n## 以对象形式传递参数\n\
    \n假设我们有一个函数 `createUser`，它需要四个参数来创建一个用户（通过调用某些 API）。\n\n```javascript\nfunction\
    \ createUser(username, date, isAdmin, isMod) {\n  return fetch('https://some.api',\
    \ {\n    method: 'POST',\n    body: JSON.stringify({\n      username, date, isAdmin,\
    \ isMod\n    })\n  });\n}\n```\n\n看函数签名本身，这些事情看起来挺通顺的。\n\n当我们调用它时呢？\n\n```javascript\n\
    createUser('Simon', '2021-01-01', false, true);\n```\n\n这些参数的含义非常不清楚，对吧？\n尤其是最后两个布尔值。我必须去查看实现代码才能确认。\n\
    \n相反，我们可以将参数封装在一个对象中。\n\n```javascript\nfunction createUser({ username, date,\
    \ isAdmin, isMod }) {\n  return fetch('https://some.api', {\n    method: 'POST',\n\
    \    body: JSON.stringify({\n      username, date, isAdmin, isMod\n    })\n  });\n\
    }\n```\n\n得益于 ES6 的对象解构，我们可以通过简单在参数周围加上大括号来轻松实现。\n\n现在，每当我们调用 `createUser` 时，我们都传递一个对象作为单个参数，并将所需的值作为属性传递。\n\
    \n```javascript\ncreateUser({\n  username: 'Simon',\n  date: '2021-01-01',\n \
    \ isAdmin: false,\n  isMod: true,\n});\n```\n\n看看现在读起来有多顺畅。我们不再疑惑那些布尔值的含义了。\n\n\
    - 此外，这种方法还让我们带来了一些额外的益处：\n- 更容易处理可选属性\n- 我们不再依赖参数的顺序\n\n根据我的行业经验，当你的函数需要超过 1-2\
    \ 个参数时，这是一个非常流行的方法。\n\n我经常看到这种方法的另一个版本：将可选参数作为配置对象传递。这被 NodeJS 以及一系列著名的开源库所采用。\n\
    \n其想法是传递 1-2 个核心参数，然后将剩余参数作为配置对象传递。\n\n```javascript\nfunction createUser(username,\
    \ date, options) {\n  return fetch('https://some.api', {\n    method: 'POST',\n\
    \    body: JSON.stringify({\n    username,\n    date,\n    isAdmin: options ?\
    \ !!options.isAdmin : false,\n    isMod: options ? !!options.isMod : false\n \
    \   })\n  });\n}\n```\n\n现在，我们需要在访问值之前检查配置对象是否已设置，并提供适当的回退值。\n\n另一方面，现在调用 `createUser`\
    \ 函数看起来非常干净。\n\n```javascript\ncreateUser('Simon', '2021-01-01', {\n  isMod: true,\n\
    });\n```\n\n前两个参数显而易见，我们现在可以根据需要可选地提供选项。\n\n## 以元组返回关联数据\n\n在 JavaScript 中，我们可以从函数返回单个值。\n\
    但通常，我们需要返回多个关联在一起的值。\n\n一种常见的方法是返回一个包含这些值的元组（tuple）。\n简而言之，元组是元素的有序列表。\n\n假设我们有一个函数\
    \ `getElementPosition`，它根据 id 获取 DOM 元素的位置。\n在这种情况下，x 和 y 是关联值。因此，将它们都作为元组返回是完全合逻辑的。\n\
    \n```javascript\nfunction getElementPosition(elementID) {\n  const element = document.getElementById(elementID);\n\
    \n  if (!element) {\n    return [NaN, NaN];\n  }\n\n  const rect = element.getBoundingClientRect();\n\
    \  return [rect.x, rect.y];\n}\n\nconst [x, y] = getElementPosition('my-element');\n\
    console.log(x, y);\n// 278.5, 122.3\n```\n\n## 不要扩展内置对象\n\n当你第一次理解 JavaScript\
    \ 的原型链并理解了你如何扩展原型（包括 JavaScript 内置对象）时，你可能会体验到一种拥有超能力的感觉。\n\n现在，你可以扩展 Array 原型，将你自定义的数组方法与\
    \ map、filter 和 reduce 包含在一起。\n这意味着 - 这难道不很酷吗？\n\n```javascript\nArray.prototype.average\
    \ = function () {\n  return this.reduce((acc, elem) => acc + elem / this.length);\n\
    }\n\nconst list = [1, 2, 3];\nconst avg = list.average();\n\nconsole.log(avg);\n\
    // 2\n```\n\n并不是这样的！事实上，这有严重的问题，并可能导致一系列相当严重的问题。应该尽一切避免扩展内置对象。\n\n事实上，有过整个应用程序因为这种模式而瘫痪的恐怖故事。\n\
    \n不幸的是，过去某些第三方库有这样做的坏习惯，你可能会无意中覆盖它，导致一堆麻烦！\n\n相反，保持事物的分离和纯洁！\n构建你自己的工具包，并将其保持在自己的模块中。\n\
    \n```javascript\nexport function average(list) {\n  return list.reduce((acc, elem)\
    \ => acc + elem / list.length);\n}\n```\n\n```javascript\nimport { average } from\
    \ \"./array-utils\";\n\nconst list = [1, 2, 3];\nconst avg = average(list);\n\
    console.log(avg);\n// 2\n```\n\n好得多！\n随着这个集合的增长，很容易将其提取为 NPM 包，以便在不同项目之间复用。\n\n\
    ## 避免默认导出\n\n这引出了下一点。\n正如你可能注意到的，我在任何示例中都没有用过 `export default`。\n这是故意为。\n\n如果你在使用\
    \ TypeScript，这一点尤为重要，但我强烈建议完全放弃使用默认导出的习惯。\n\n为什么？\n\n## 可发现性较差\n\n这使得 VSCode 和\
    \ Webstorm 等现代代码编辑器中的 IntelliSense 很难在你开始输入时建议来自某个模块的导出内容。\n\n## 使用 CommonJS 时很烦人\n\
    \n我不知道你是否曾经必须在 `require` 语句末尾加上 `.default`？非常烦人又难看，不是吗？\n\n## 使用动态导入时很烦人\n\n与\
    \ CommonJS 和 require 类似，使用动态导入也强制你使用 .default。\n\n## 命名保护\n\n当你从默认导出导入时，你可以为导入内容命名任何名称。\n\
    \n## 重新导出\n\n在创建 NPM 包或处理大型代码库时，使用桶（barrels）从集中位置重新导出模块是很常见的。默认导出迫使你重命名导出，这再次可能导致不一致。\n\
    \n使用具名导出（named exports）代替默认导出（default exports）并没有任何权衡，因此我建议简单地坚持这样做。\n\n## 放弃单字母变量名\n\
    \n我见过很多这种情况。单字母变量名，特别是在回调中。\n短小简洁的代码并不总是理想的。\n看看这段代码。\n\n```javascript\nconst\
    \ images = users.filter((u) => {\n  return u.entities.find((e = e.type === 'profile-image'));\n\
    });\n```\n\nu 和 e？谢了，清晰性和可读性才是理想的。\n即使多花几行。\n\n```javascript\nconst images = users.filter((user)\
