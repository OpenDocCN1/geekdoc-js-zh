  md: '# TypeScript


    TypeScript is a language for application-scale JavaScript development.

    It''s a typed superset of JavaScript used to add static typing and describe the
    shapes of objects while working with JavaScript.


    It''s an extremely popular choice on professional software teams building complex
    web, mobile, and desktop applications at scale.


    Yet, it''s definitely not all teams I''ve been working with that have been equally
    excited about it.

    In fact, some teams downright hate it.


    In this chapter, I''ll try to describe the “sweet spot” that both routed JavaScript
    developers and TypeScript enthusiasts seem to be on board with, as well as describing
    some do''s and don''ts that I''ve seen from the industry.


    # Don''t overdo it


    If you''re working with a team of experienced JavaScript developers, who are likely
    to appreciate some of the flexibility you get from the loosely-typed JavaScript,
    you are going to get a lot of pushback if you''re trying to introduce (or even
    enforce) TypeScript used to its fullest capacity.


    So from my experience with TypeScript in the industry, it stands out very clear:
    don''t overdo it!'
  merge: -1
  pgno: 51
- img_proc: true
  md: "It's great if you're enthusiastic about TypeScript. It's an awesome language.\
    \ But there's not a lot of developers who want to see something like this.\n\n\
    ```\ntype RequireOnly<T, Keys extends keyof T = keyof T =\nPick<T, Exclude<keyof\
    \ T, Keys>> &\n  { [K in Keys]?-:\n    Required<Pick<T, K>>\n    & Partial<Record<Exclude<Keys,\
    \ K>, undefined>>>\n```\n\n(Example code from an actual project I've worked on)\n\
    \nFrom what I've seen, the most effective use of TypeScript really boils down\
    \ to the following:\n\n+   - Describing the shape of objects with interfaces\n\
    - Typing the arguments and return values of functions\n- Using generics to use\
    \ more general-purpose function signatures\n- Using the TypeScript Utility Types\
    \ for more flexible type descriptions\n\nIn particular, it's popular to describe\
    \ the JSON response from an API using interfaces. IntelliSense enhances productivity\
    \ quite radically, and with modern solutions like GraphQL, you can get tools that\
    \ auto-generate these interfaces based on the schema.\n\nThis part of TypeScript\
    \ that's not annoying, but simply saves time, seems to be quite popular with everyone."
  merge: -1
