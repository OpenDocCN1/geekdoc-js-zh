  md: '# React


    React is a huge subject, and there are a lot of different opinions out there.

    In fact, React is one of the areas of work where I have encountered the most disagreement
    on different teams.


    In this chapter, I''ll touch upon some of the most common discussions I''ve witnessed
    and provide my general impression of how most teams prefer their React code.


    # Use React hooks


    I''ll keep this one short. If you''re still stuck writing class components, get
    rid of that habit right away.


    It is my clear impression that by far most teams have now effectively moved to
    use React Hooks, unless you''ve been dealing with legacy projects where class
    components are carried over, you can safely expect that the next team you''re
    going to join will be using React hooks.


    # Don''t worry about arrow functions in JSX


    If you''ve been learning React for a while, I''m sure you''ve been taught that
    you shouldn''t use arrow functions in JSXX.


    An extra function will be created on each render, and it''s bad for performance.'
