  - "[PAGE 33]\n\nThere is a version of if-else that is generally accepted.\nIt's\
    \ the ternary operator.\n\n```\nfunction negateOdd(n) {\n  return n % 2 === 0\
    \ ? n : n * -1;\n}\n```\n\nA ternary operator is essentially an if-else.\n\nSo,\
    \ why is this accepted if we're supposed to avoid using else?\nBecause it's used\
    \ to assign or return a value directly.\nThere's no body. No opening to writing\
    \ multiple lines of logic.\n\nThat's also why the ternary operator should be restricted\
