  md: "Fortunately, after hooks were introduced, we can now benefit from writing clean\
    \ and declarative code in React.\n\n```\nimport React, { useEffect, useState }\
    \ from \"react\";\n\nexport function ShowCount(props) {\n  const [count, setCount]\
    \ = useState();\n\n  useEffect(() => {\n    setCount(props.count);\n  }, [props.count]);\n\
    \n  return (\n    <div>\n      <p> Count: {count}</p>\n    </div>\n  );\n}\n```\n\
    \nFunctional components were already a thing before hooks, but we often needed\
    \ to refactor it into a class component when the logic grew.\n\nIn this way, we\
