  - "[PAGE 55]\n\n# Avoid using any\n\nGoing from one extreme to another: I've also\
    \ witnessed quite a few teams changing to TypeScript because of the hype.\n\n\
    But without properly using it, mainly due to writing any all over the place.\n\
    \n```\nfunction addOne(n: any): any {\n  if (typeof n === 'number') {\n    return\
    \ n + 1;\n  }\n  return !!n;\n}\n```\n\nObviously, TypeScript is adding zero value\
    \ here.\n\nI totally get it - if you're new to TypeScript, some of the rather\
    \ obscure compile-time errors can be confusing and feel like it's slowing you\
    \ down. But if you're too busy to learn the basics of TypeScript, then I strongly\
    \ suggest not using TypeScript. Stick to JavaScript, in that case.\n\nThere's\
    \ no point in using a strictly typed language if you're going to enforce loose\
    \ typing everywhere.\n\nAvoid using any. Or avoid using TypeScript altogether."
