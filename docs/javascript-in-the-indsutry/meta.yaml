    \ Responsibility Principle），并且经常导致容易出错的分支逻辑，在大规模代码中变得难以理解。\n\n所以，作为一个经验法则，每当你准备写\
    \ `else` 时，请停下来重新考虑你正在做的事情，并寻找表达该逻辑的替代方法。\n\n让我们来看几种避免使用 `else` 的方法。\n\n其中一种是守卫语句（guard\
    \ clauses），这是我们上面刚刚讨论过的。\n\n另一种方法是使用默认值。\n\n让我们来看一个例子。\n\n假设我们有一个函数 `negateOdd`，它接收一个数字，如果该数字是奇数，则对其取反。\n\
