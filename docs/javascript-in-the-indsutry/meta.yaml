    \  );\n});\n```\n\n在少数地方，单字母变量名是惯例接受的。例如，在 for 循环中使用变量 `i`。\n除此之外，养成为回调参数命名的良好习惯。\n\
    通常，你想使用列表单词单数形式。\n就像我这里使用的 users 和 user。\n\n## 箭头函数 vs 函数声明\n\n你可能注意到我在示例中使用了\
