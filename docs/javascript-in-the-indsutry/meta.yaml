  md: "```\n```javascript\function getValidCandidate(candidate, members) {\n  if (candidate)\
    \ {\n    const member = members.find(\n      (member) => member.name === candidate\n\
    \    );\n\n    if (member) {\n      const hasLegalAge = member.age > 18;\n\n \
    \     if (hasLegalAge) {\n        return member;\n      }\n    }\n  }\n}\n```\n\
    ```\n\nWe have a function, `getValidCandidate`, which checks if a candidate is\
    \ valid, provided a list of members and returns the member if the candidate is\
    \ valid, or undefined otherwise.\n\nThe code is sound.\nBut look how nested is\
    \ it? *If* wrapping other *ifs*, nested 3 times.\n\nUhf. Let's rewrite this and\
    \ use **guard clauses** instead."
