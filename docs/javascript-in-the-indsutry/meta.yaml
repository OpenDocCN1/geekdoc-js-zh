  md: '# Functional style


    JavaScript is a multi-paradigm programming language.

    This means that the language is open for programming in different styles, including
    object-oriented, procedural, protypal, and functional.


    By far, the most common styles you see are object-oriented and functional.

    Even though object-oriented languages such as Java and C# have had an enormous
    impact on the industry, the functional style JavaScript is the most popular and
    accepted in 2021. This is where you should be heading.


    # Imperative vs. declarative


    Object-oriented programming follows an imperative paradigm.

    Functional programming follows a declarative paradigm.


    Let’s look at the difference.


    Imperative programming focuses on how you want something done.

    You alter the state of your program step by step.


    Declarative programming focuses on what the end result will be.

    How to obtain that result is less interesting, as long as the process of obtaining
    it does not alter the state of your program.'
  merge: -1
  pgno: 4
- img_proc: true
  md: "When a function carries out a task in a deterministic way without changing\
    \ its environment (changing state in its surroundings), we call it pure.\nLet's\
    \ say we want to iterate through a list of numbers and multiply them all by 2.\n\
    \nAn imperative style would look something like this.\n\n```\nfunction multiplyAll(list)\
    \ {\n  for (let i = 0; i < list.length; i++) {\n    list[i] *= 2;\n  }\n}\n\n\
    const listOfNumbers = [1, 2, 3, 4, 5];\nmultiplyAll(listOfNumbers);\nconsole.log(listOfNumbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\nSimple and straightforward.\nBut there are two key\
    \ observations we need to make here:\n\n+   1. The function multiplyAll does not\
    \ have a return value.\n   Since it's not returning anything, we cannot determine\
    \ the result based on the input. Hence, it's not pure.\n2. The original listOfNumbers\
    \ array gets mutated.\n   The function alters (changes the state) of the input\
    \ given as an argument. Hence, it's not immutable."
  merge: -1
  pgno: 5
- img_proc: true
  md: "These two simple behaviors are likely to result in bugs, code that is hard\
    \ to\ndebug, hard to test, and is likely to break your application at scale!\n\
    On a lot of professional teams, this code would be immediately rejected in a\n\
    Pull Request.\n\nLet’s rewrite it to follow a **declarative** style instead.\n\
    \n```\nconst multipliedNumbers = listOfNumbers.map(n => n * 2);\nconsole.log(multipliedNumbers);\n\
    // [2, 4, 6, 8, 10]\n```\n\nWell, isn’t this our lucky day?\nJavaScript has a\
    \ method on the Array prototype built in that does exactly\nwhat we need. It’s\
    \ called *map*.\n\nLet’s do a few observations again:\n\n+   1. The function *map*\
    \ has a return value. It's a list with each element\naltered as specified in the\
    \ callback function we provide.\n   *Map* doesn’t change its surroundings and\
    \ will return the same result\nevery time, given the same callback and input.\
    \ Hence, *map* is **pure**.\n2. The original *listOfNumbers* stays untouched.\
    \ *Map* will create a new copy\nof the array for us, and alter that one instead.\
    \ Hence, *map* is **immutable**."
  merge: -1
  pgno: 6
- img_proc: true
  md: "As it turns out, all the Array-methods(forEach, Map, Reduce, Filter, ...) following\
    \ a declarative programming style.\n\nThe code becomes way cleaner, easier to\
    \ test, less prone to introduce bugs, and much more likely to be approved in the\
    \ Pull Request on most professional teams today.\n\nBe careful about the pitfalls,\
    \ though.\nThe Array-methods are only pure and immutable to the extent that you\
    \ use them as intended.\n\n```\nconst names = [\"albert\", \"ronnie\", \"julie\"\
    ];\nconst people = {};\n\nconst peopleWithAges = names.reduce((newPeople, name)\
    \ => {\n  newPeople[name] = Math.floor(Math.random() * 100);\n  return newPeople;\n\
    }, people);\n\nconsole.log(people);\n// { albert: 18, ronnie: 94, julie: 31 }\n\
    ```\n\nThis is an example I've seen often.\nThe People object is still mutated\
    \ on, and the surroundings are still changed.\nDoing it as part of reduce isn't\
    \ changing this."
  merge: -1
  pgno: 7
- img_proc: true
  md: "```\n```javascript\\let max = 0;\nnumbers.forEach((n) => {\n  if (n > max)\
    \ max = n;\n});\n```\n```\n\nOr how about this?\nIt's as imperative and mutable\
    \ as it\\can possibly be!\nWhy not just use a regular for-loop\nthen? It has better\
    \ performance.\n\nSimilarly, utility libraries like lodash and date-fns, and UI\
    \ libraries like React - that are all built with a functional and declarative\
    \ style in mind - are only going to offer all its benefits if it's used the way\
    \ it was intended.\n\nI'm my career as a consultant, I've often witnessed chaotic,\
    \ careless and sometimes tragically funny - mixes of styles piled on top of each\
    \ other, totally defeats the purpose of keeping consistent with conventions and\
    \ coding styles throughout the application.\n\nOf course, software development\
    \ often goes fast, and there are many deadlines, demands from product owners,\
    \ bugs to fix fast, and so on. So the key is to get a good habit of writing clean\
    \ and declarative code under your skin and understand when to be stubborn about\
    \ it and when to simply let go.\n\nIn the rest of this chapter, I will provide\
    \ some of the most common examples of imperative code that could (and should)\
    \ be refactored into declarative code and how to do it."
  merge: -1
