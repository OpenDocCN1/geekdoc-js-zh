  md: '# Final words


    # Which conventions should I use?


    So, after reading this book, you may be left with the question: Which conventions
    should I use? Should I blindly follow all the rules, styles, and conventions from
    this book?


    No!


    All teams are different. All codebases are different.

    The two most important things to consider first, are keeping a consistent code
    base and playing well on a team.


    So if you''re invited to a team where both the team and code-base are already
    +6 months old, try your best to adopt the styles, preferences, and conventions
    you already see.


    Listen to your team - if everyone prefers it in a specific way, go with that.

    If the codebase uses a certain pattern consistently, stick with that.


    That said, suggestions are always good, and - in my experience - welcomed most
    professional teams.

    Remember, being a software developer in the real world is mostly a people’s game.
    It’s much less about programming than you might think.


    > — Simon Høiberg'
