- md: "\n# JAVASCRIPT IN THE INDUSTRY\n\nHOW PROFESSIONAL TEAMS WANT YOU TO WRITE\
    \ CODE\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_0_0.png)\n\nSimon Høiberg\n\
    \n## Introduction 4\n\n## Functional style 5\n- Imperative vs. declarative 5\n\
    - Working with arrays 10\n- Avoid using classes 18\n- Working with instances when\
    \ you really don’t have to 19\n- Classes vs Hooks in React 23\n- Create your own\
    \ abstractions 25\n\n## Control flows 28\n- Guard clauses 28\n- Skip the ‘else’\
    \ part 31\n- Using a switch-statement 35\n- Using functions and partial applications\
    \ 36\n\n## Code hygiene & good practices 42\n- Pass arguments as an object 42\n\
    - Return associated data as tuples 46\n- Do not extend builtins 47\n- Avoid default\
    \ exports 48\n- Poor Discoverability 49\n- Annoying when using CommonJS 49\n-\
    \ Annoying when using Dynamic Imports 49\n- Name Protection 49\n- Re-exporting\
    \ 49\n- Drop the single-letter variable names 50\n- Arrow function vs. function\
    \ declaration 51\n\n## TypeScript 52\n- Don't overdo it 52\n- Let TypeScript infer\
    \ the type 54\n- Avoid using any 56\n\n## React 57\n- Use React hooks 57\n- Don't\
    \ worry about arrow functions in JSX 57\n- Don't return JSX from inner functions\
    \ 59\n- Ternary inside the JSX 60\n- Split into a separate component 60\n- Don't\
    \ wrap useEffect in an async IIFE 61\n- Don't overuse the inbuilt Memo 62\n- Stop\
    \ using useMemo 62\n- Stop overusing useCallback 64\n\n## NodeJS & AWS Lambda\
    \ 65\n- Use promises instead of callbacks 65\n- Using promisify 66\n- Using module/promises\
    \ 67\n- Async handlers in AWS Lambda 67\n\n## Final words 69\n- Which conventions\
    \ should I use? 69\n\n## Additional resources 70\n\n## Introduction\n\nI have\
    \ had a front-row seat while JavaScript has taken over the industry.\n\nIn the\
    \ past ten years of working as a freelance consultant, I've had the joy of working\
    \ with many different teams. I've participated in countless PR code reviews and\
    \ have many heated discussions about JavaScript, best practices, clean code, patterns,\
    \ and coding styles.\n\nI have taught JavaScript, React, and NodeJS on various\
    \ talks and workshops, and furthermore, I've spent the last year notoriously presenting\
    \ my Twitter audience with small bits of code, asking them what they preferred\
    \ and if they would have approved it in a PR.\n\nHere are my findings, impressions,\
    \ and personal experience.\nAll put together in an easy-to-digest e-book including\
    \ examples and explanations.\n\n**This book is opinionated.**\n\nFor each and\
    \ every example in this book, you will find developers in the industry who disagree.\
    \ This book teaches industry preferences and standards. But it is, by definition,\
    \ opinionated.\n\n**This is not a JavaScript fundamentals book.**\n\nDo note,\
    \ that this book assumes fundamental understanding of the JavaScript language.\n\
    \n## Functional style\n\nJavaScript is a multi-paradigm programming language.\n\
    This means that the language is open for programming in different styles, including\
    \ object-oriented, procedural, prototype, and functional.\n\nBy far, the most\
    \ common styles you see are object-oriented and functional.\nEven though object-oriented\
    \ languages such as Java and C# have had an enormous impact on the industry, the\
    \ functional style JavaScript is the most popular and accepted in 2021. This is\
    \ where you should be heading.\n\n## Imperative vs. declarative\n\nObject-oriented\
    \ programming follows an imperative paradigm.\nFunctional programming follows\
    \ a declarative paradigm.\n\nLet’s look at the difference.\n\nImperative programming\
    \ focuses on how you want something done.\nYou alter the state of your program\
    \ step by step.\n\nDeclarative programming focuses on what the end result will\
    \ be.\nHow to obtain that result is less interesting, as long as the process of\
    \ obtaining it does not alter the state of your program.\n\nWhen a function carries\
    \ out a task in a deterministic way without changing its environment (changing\
    \ state in its surroundings), we call it pure.\nLet's say we want to iterate through\
    \ a list and multiply all by 2.\n\nAn imperative style would look like this:\n\
    \n```javascript\nfunction multiplyAll(list) {\n  for (let i = 0; i < list.length;\
    \ i++) {\n    list[i] *= 2;\n  }\n}\n\nconst numbers = [1, 2, 3, 4, 5];\nmultiplyAll(numbers);\n\
    console.log(numbers);\n// [2, 4, 6, 8, 10]\n```\n\nA declarative style would look\
    \ like this:\n\n```javascript\nconst numbers = [1, 2, 3, 4, 5];\nconst multipliedNumbers\
    \ = numbers.map(n => n * 2);\n\nconsole.log(multipliedNumbers);\n// [2, 4, 6,\
    \ 8, 10]\n"
  mdcn: "\n\n# 行业中的 JAVASCRIPT\n\n专业团队如何希望你编写代码\n\n![](img/d077270db200bfe2e16ba5ef3a76c09d_0_0.png)\n\
    \nSimon Høiberg\n\n## 引言 4\n\n## 函数式风格 5\n- 命令式 vs. 声明式 5\n- 数组操作 10\n- 避免使用类\
