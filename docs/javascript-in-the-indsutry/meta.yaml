  md: '# Avoid using classes


    Ahh, classes. At the very root of object-oriented programming lies the concept
    of classes.


    Classes are blueprints for creating objects. They encapsulate data along with
    code to mutate on that data.


    In JavaScript, classes are built on prototypes and are used as a template for
    creating objects.


    They are - as in any other programming language - **inherently imperative** in
    their nature.


    The use of classes has its place. It does make sense on some occasions. But most
    often, you can avoid using them - and if you can, **you should.**


    So generally, whenever you are about to use a class declaration, ask yourself
    if it’s really necessary. Can you express the logic you need in a **declarative**
    way instead, using only functions? In 9/10 cases, I bet you can!


    Let’s take a look at some of the most common uses of classes, which can easily
    be refactored into using a **declarative** programming style instead.'
  merge: -1
  pgno: 17
