  md: "# Return associated data as tuples\n\nIn JavaScript, we can return a single\
    \ value from a function.\nBut often enough, we need to return multiple values\
    \ that are associated\together.\n\nA common approach is to return a tuple containing\
    \ the values.\nIn short, a tuple is an ordered list of elements.\n\nLet's say\
    \ we have a function, `getElementPosition`, that retrieves a DOM\nelement's position\
    \ given an id.\nIn this case, x and y are associated values. Thus, it makes perfect\
    \ sense to\nreturn them both as a tuple.\n\n```\nfunction getElementPosition(elementID)\
    \ {\n  const element = document.getElementById(elementID);\n\n  if (!element)\
    \ {\n    return [NaN, NaN];\n  }\n\n  const rect = element.getBoundingClientRect();\n\
    \  return [rect.x, rect.y];\n}\n\nconst [x, y] = getElementPosition('my-element');\n\
    console.log(x, y);\n// 278.5, 122.3\n```"
  merge: -1
  pgno: 45
