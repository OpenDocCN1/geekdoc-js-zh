  md: '# Create your own abstractions


    So, we''ve covered some good rules of thumbs to follow.

    But often enough, the code we write in our software is more complex than

    t examples we''ve looked at here.


    There are cases where writing declaratively, avoiding the let keyword, not reassigning
    variables, not altering data in the surrounding scope of a loop, and so on, simply
    going to produce tedious, verbose, and hard-to-read code.


    And obviously, we don''t want to force any style or pattern to an extent where
    it makes our code worse, “just because.... functional programming”.


    But instead of turning it all around, we can abstract that code away in a function,
    and then use that function declaratively in the context where it''s needed.


    Even if the code is not necessarily reusable, it''s still a great practice to
    package it away and keep it in its own function scope where it can''t do any harm.
    Hence, you want to keep that function pure.


    I''ve seen this very often, and it''s a great in-between solution.

    Keep the code procedural, and then let the function return the final result.


    # Procedural code is still imperative code.


    You can reassign variables, alter data outside of loops, and mutate arrays.

    But you still cannot use classes, methods, instance variables, and so on.'
