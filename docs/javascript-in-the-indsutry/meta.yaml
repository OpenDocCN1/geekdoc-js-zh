    \  case \"I\":\n      return 3;\n    case \"F\":\n      return -1;\n    default:\n\
    \      return NaN;\n  }\n}\n```\n\nIf you're about to write if-else-if-else...\
    \ a series of times, you probably want to consider using a switch-statement instead.\n\
    \nThere are certain libraries, for Redux, for React, that have been using switch-statements\
    \ as part of their reducers, per convention.\n\nYet, for a case like this, you\
    \ could use an object to store the values instead.\n\nIf the values need need\
    \ logic to infer, you could store functions in the object, and call it after the\
    \ object lookup.\n\n```\nconst pointsFromGrade = {\n  A: 10,\n  B: 8,\n  C: 5,\n\
    \  I: 3,\n  F: -1\n};\n\nconst p = pointsFromGrade.B;\n```"
