    \nIn any circumstances, this is not pretty!"
  - "[PAGE 61]\n\nIf you need to do this, either declare the function inside useEffect\
    \ and call it immediately after, or - better - declare it in the component scope\
    \ instead.\n\n```\nexport function App() {\n  const callSomeApi = async () =>\
    \ {\n    await fetch(\"https://some.api\");\n  }\n\n  useEffect(() => {\n    callSomeApi();\n\
    \  }, []);\n\n  return <div className=\"App\"></div>;\nn\n```\n\nMuch better!\
    \ Most likely, as logic grows, we'd have to do that at some point anyway. We might\
    \ as well just do it now and keep the code clean.\n\n# Don't overuse the inbuilt\
    \ hooks\n\nYes, hooks are super cool! And when you learn how to use them, you\
    \ may feel the urge to put them everywhere.\nPlease don't.\n\n# Stop using useMemo\n\
    \nI've encountered this a lot. The fear of assigning a variable from a function\
    \ call directly in the component leads developers to use useMemo."
  - "[PAGE 62]\n\nLet’s take an example.\n\n```\nexport function App({ username, type\
    \ }) {\n  const computedValue = useMemo(() => {\n    return getComputedValue(username,\
    \ type);\n  }, [page, type])\n\n  return <HeavyComponent computedValue={computedValue}\
    \ />\n}\n```\n\nIt’s easy to see how the developer has been reasoning here.\n\n\
    The HeavyComponent shouldn’t rerender unnecessarily, so the computedValue is memoized.\n\
    \nThe useMemo hook is meant to prevent extensive computation every time a component\
    \ re-renders, so the first thing we ask ourselves here is; is the getComputedValue\
    \ actually an extensive operation?\n\nIn most cases, it’s not.\n\nAnd the cost\
    \ of having React manage a memoized value actually outweighs the performance benefits\
    \ you get from using useMemo.\n\nInstead, don’t be afraid of calling getComputedValue\
    \ directly from the root of the component."
  - "[PAGE 63]\n\n```\nexport function App({ username, type }) {\n  const computedValue\
    \ = getComputedValue(username, type);\n\n  return <HeavyComponent computedValue={computedValue}\
    \ />\n}\n```\n\nIf the computedValue resolves to a primitive (a string, number,\
    \ boolean, etc),\n don't have to worry about HeavyComponent re-rendering either.\n\
    If the value doesn't change, it won't re-render.\n\n# Stop overusing useCallback\n\
    \nSimilarly, I've seen the useCallback hook being overused as well.\nIt mostly\
    \ boils down to two situations:\n\nEither useCallback is used to set an initial\
    \ state while preventing an infinite\nrender-loop. But in this case, useEffect\
    \ is really the hook for the job.\n\nOr, it is in the belief that the result will\
    \ be memoized.\nIn that case, useMemo is the hook for the job, but most likely,\
    \ you simply want\nto compute whatever you need in the component itself.\n\nIn\
    \ fact, improper use of useCallback actually worsens performance.\nIf you're in\
    \ doubt when to use useCallback, remember that as a rule of thumb,\nyou're not\
    \ going to need it."
  - "[PAGE 64]\n\n# NodeJS & AWS Lambda\n\nNodeJS is a backend runtime environment\
    \ that runs on the V8 engine and enables us to write and execute server-side JavaScript.\n\
    Since its initial release 12 years ago, it has gotten immensely popular.\nIt also\
    \ happens to be the most popular choice when writing serverless functions on AWS\
    \ (Lambda).\n\nIt's a huge topic, and I'll keep this rather short.\nThere are\
    \ a few things I'd like to highlight.\n\n# Use promises instead of callbacks\n\
    \nNodeJS was originally built using a callback pattern for asynchronous calls.\n\
    All of NodeJS's builtins are structured this way: You provide the main arguments\
    \ along with a callback function that is applied when the asynchronous operation\
    \ is done.\n\n```\nconst fs = require(\"fs\");\n\nfs.writeFile(\"./file.txt\"\
    , \"some-text\", (err, data) => {\n  if (err) {\n    console.error();\n  }\n \
    \ console.log(data);\n});\n```"
  - "[PAGE 65]\n\nRemember, NodeJS was introduced in 2009.\nIn 2021, we use promises.\n\
    \nFortunately, it’s quite easy to convert these methods using promises instead.\
    \ Let’s look at two different ways.\n\n# Using promisify\n\nYou can use a utility\
    \ function, promisify, from the utils module to wrap the function using a callback\
    \ in a promise.\n\nIt works for all functions that follow the NodeJS callback\
    \ convention, which means that it works for a range of old third-party libraries\
    \ for NodeJS as well.\n\n```\nconst fs = require(\"fs\");\nconst { promisify }\
    \ = require(\"util\");\nconst writeFilePromise = promisify(fs.writeFile);\n\n\
    try {\n  const data = await writeFilePromise(\"./file.txt\", \"some-text\");\n\
    \  console.log(data);\n} catch (error) {\n  console.error(error);\n}\n```\n\n\
    Fortunately, in NodeJS version 12 and up, it became even easier for us."
  - "[PAGE 66]\n\n# Using module/promises\n\nInstead of handling the promise-wrapping\
    \ yourself, all NodeJS builtins come with a promisified version of their functions,\
    \ straight from the module itself.\n\n```\nconst fs = require(\"fs/promises\"\
    );ntry {\n  const data = await fs.writeFile(\"./file.txt\", \"some-text\");\n\
    \  console.log(data);\n} catch (error) {\n  console.error(error);\n}\n```\n\n\
    This is, by far, the easiest way to use promises in NodeJS in 2021.\n\nPlease,\
    \ stick to this pattern anywhere you can.\n\n# Async handlers in AWS Lambda\n\n\
    The same goes for AWS Lambda.\n\nYou don't have to use the callback argument of\
    \ your AWS Lambda functions anymore.\n\nIf your handle is async, you can simply\
    \ return the result instead of applying it to the callback argument."
  - "[PAGE 67]\n\nThis is how an AWS Lambda function was expressed prior to the support\
    \ of NodeJS version 8.\n\n```\nmodule.exports.handler = (event, context, callback)\
    \ => {\n  const response = {\n    statusCode: 200,\n    body: JSON.stringify({\
    \ message: 'hello world' }),\n  };\n\n  callback(null, response);\n};\n```\n\n\
    Today, we don't have to use the callback argument anymore.\nInstead, declare the\
    \ handler as async, and return the result instead.\n\n```\nmodule.exports.handler\
    \ = async (event, context) => {\n  const response = {\n    statusCode: 200,\n\
    \    body: JSON.stringify({ message: 'hello world' }),\n  };\n\n  return response;\n\
    };\n```\n\nIf you need to fulfill promises during the function call, you simply\
    \ apply the await keyword like you normally would."
  - '[PAGE 68]


    # Final words


    # Which conventions should I use?


    So, after reading this book, you may be left with the question: Which conventions
    should I use? Should I blindly follow all the rules, styles, and conventions from
    this book?


    No!


    All teams are different. All codebases are different.

    The two most important things to consider first, are keeping a consistent code
    base and playing well on a team.


    So if you''re invited to a team where both the team and code-base are already
    +6 months old, try your best to adopt the styles, preferences, and conventions
    you already see.


    Listen to your team - if everyone prefers it in a specific way, go with that.

    If the codebase uses a certain pattern consistently, stick with that.


    That said, suggestions are always good, and - in my experience - welcomed most
    professional teams.

    Remember, being a software developer in the real world is mostly a people’s game.
    It’s much less about programming than you might think.


    > — Simon Høiberg'
