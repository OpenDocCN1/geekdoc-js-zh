  trans: "\n\n# 画布小球弹跳\n\n## 1. 在画布上画一个圆\n\n圆心 = (100, 100), 半径 r = 50, 从 0 到 2*PI.\n\
    \n![](img/Image00084.jpg)\n\n用记事本创建一个`ball.html`文件，并在浏览器中打开它。\n\n`context.arc(x,\
    \ y, r, sAngle, eAngle)`: 以`x`、`y`为圆心，`r`为半径，逆时针旋转 360 度。\n\n```html\n<style>#myCanvas{border:1px\
    \ solid #c3c3c3;position: absolute;}</style>\n<canvas id =\"myCanvas\" width =\"\
    200\" height =\"200\" ></canvas>\n<script type =\"text/javascript\" >\nvar canvas\
    \ = document.getElementById( \"myCanvas\" );\nvar context = canvas.getContext(\
    \ \"2d\" );\ncontext.fillStyle = \"#0000ff\" ;\ncontext.beginPath();\ncontext.arc(\
    \ 100 , 100 , 50 , 0 , 2 * Math.PI);\ncontext.fill();\n</script>\n```\n\n## 2.\
    \ 创建一个函数`drawBall(x, y, r, color)`在画布上画 3 个圆\n\n![](img/Image00085.jpg)\n\n```html\n\
    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style>\n<canvas\
    \ id =\"myCanvas\" width =\"400\" height =\"200\" ></canvas>\n<script type =\"\
    text/javascript\" >\nvar canvas = document.getElementById( \"myCanvas\" );\nvar\
    \ context = canvas.getContext( \"2d\" );\nfunction drawBall( x, y, r, color){\n\
    \    context.fillStyle = color;\n    context.beginPath();\n    context.arc( x,\
    \ y, r, 0 , 2 * Math.PI);\n    context.fill();\n}\ndrawBall( 50 , 50 , 30 , \"\
    #ff0000\" );\ndrawBall( 120 , 50 , 30 , \"#00ff00\" );\ndrawBall( 190 , 50 , 30\
    \ , \"#0000ff\" );\n</script>\n```\n\n## 3. 创建一个类`Ball`，然后创建一个方法`draw()`在画布上画\
    \ 3 个圆\n\n![](img/Image00085.jpg)\n\n```html\n<style>#myCanvas{border:1px solid\
    \ #c3c3c3;position: absolute;}</style>\n<canvas id =\"myCanvas\" width =\"400\"\
    \ height =\"200\" ></canvas>\n<script type =\"text/javascript\" >\nvar canvas\
    \ = document.getElementById( \"myCanvas\" );\nvar context = canvas.getContext(\
    \ \"2d\" );\nclass Ball{\n    constructor( x, y, r, color){\n        this.x =\
    \ x;\n        this.y = y;\n        this.r = r;\n        this.color = color;\n\
    \    }\n    draw(){\n        context.fillStyle = this.color;\n        context.beginPath();\n\
    \        context.arc( this.x, this.y, this.r, 0 , 2 * Math.PI);\n        context.fill();\n\
    \    }\n}\n//new Ball the constructor method will be called automatically\nvar\
    \ redBall = new Ball( 50 , 50 , 30 , \"#ff0000\" );\nredBall.draw();\nvar greenBall\
    \ = new Ball( 120 , 50 , 30 , \"#00ff00\" );\ngreenBall.draw();\nvar blueBall\
    \ = new Ball( 190 , 50 , 30 , \"#0000ff\" );\nblueBall.draw();\n</script>\n```\n\
    \n## 4. 创建一个`Ball`并向下移动\n\n![](img/Image00086.jpg)\n\n```html\n<style>#myCanvas{border:1px\
    \ solid #c3c3c3;position: absolute;}</style>\n<canvas id =\"myCanvas\" width =\"\
    200\" height =\"250\" ></canvas>\n<script type =\"text/javascript\" >\nvar canvas\
    \ = document.getElementById( \"myCanvas\" );\nvar context = canvas.getContext(\
    \ \"2d\" );\nclass Ball{\n    constructor( x, y, r, color){\n        this.x =\
    \ x;\n        this.y = y;\n        this.r = r;\n        this.color = color;\n\
    \    }\n    draw(){\n        context.fillStyle = this.color;\n        context.beginPath();\n\
    \        context.arc( this.x, this.y, this.r, 0 , 2 * Math.PI);\n        context.fill();\n\
    \    }\n    move( distance){\n        this.y = this.y + distance;\n    }\n}\n\
    var ball = new Ball( 100 , 50 , 30 , \"#0000ff\" );\nball.draw();\nfunction continueRun(){\n\
    \    context.clearRect( 0 , 0 , 200 , 250 ); //clear canvas\n    ball.move( 10\
    \ );\n    ball.draw();\n}\n//Run every 200 milliseconds\nvar time = setInterval(\
    \ \"continueRun()\" , 200 );\n</script>\n```\n\n## 5. 小球上下弹跳\n\n![](img/Image00087.jpg)\n\
    \n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style>\n\
    <canvas id =\"myCanvas\" width =\"200\" height =\"250\" ></canvas>\n<script type\
    \ =\"text/javascript\" >\nvar canvas = document.getElementById( \"myCanvas\" );\n\
    var context = canvas.getContext( \"2d\" );\nvar canvasWidth= 200 ;\nvar canvasHeight=\
    \ 250 ;\nclass Ball{\n    constructor( x, y, r, color){\n        this.x = x;\n\
    \        this.y = y;\n        this.r = r;\n        this.color = color;\n    }\n\
    \    draw(){\n        context.fillStyle = this.color;\n        context.beginPath();\n\
    \        context.arc( this.x, this.y, this.r, 0 , 2 * Math.PI);\n        context.fill();\n\
    \    }\n    move( distance){\n        this.y = this.y + distance;\n    }\n   \
    \ getY(){\n        return this.y;\n    }\n    getR(){\n        return this.r;\n\
    \    }\n}\nvar ball = new Ball( 100 , 50 , 30 , \"#0000ff\" );\nball.draw();\n\
    var direction = \"down\" ;\nfunction continueRun(){\n    context.clearRect( 0\
    \ , 0 , canvasWidth, canvasHeight);\n    if ( ball.getY()+ ball.getR() < canvasHeight\
    \ && direction == \"down\" ){\n        ball.move( 10 );\n        ball.draw();\n\
    \    } else {\n        direction = \"up\"\n    }\n    if ( ball.getY()- ball.getR()\
    \ > 0 && direction == \"up\" ){\n        ball.move(- 10 );\n        ball.draw();\n\
    \    } else {\n        direction = \"down\"\n    }\n}\n//Run every 200 milliseconds\n\
    var time = setInterval( \"continueRun()\" , 200 );\n</script>\n```\n\n# 创建类\n\n\
    几乎一切都是对象，拥有其属性和方法。类就像是一个用于创建对象的对象构造器。\n\n在游戏中，飞机、子弹、炸弹和敌机被称为类`Sprite`。\n\n![](img/Image00088.jpg)\n\
    \n1. 用记事本创建一个`class.html`文件，并在浏览器中打开它。\n\n构造方法名称必须是`constructor`。`constructor`：创建对象时会自动调用。\n\
    \n```html\n<script type =\"text/javascript\" >\n// defining a Sprite class\nclass\
    \ Sprite{\n    //constructor method\n    constructor( name, color){\n        this.name\
    \ = name;\n        this.color = color;\n    }\n    // defining method, this: is\
    \ current object\n    draw(){\n        var text = this.color + \" \" + this.name+\
    \ \"&nbsp;&nbsp;is drawn on canvas\" ;\n        document.write( text+ \"<br>\"\
    \ );\n    }\n}\n//create the object constructor will be called automatically\n\
    blueSprite = new Sprite( \"Airplane\" , \"Blue\" );\n//Use sprite access properties\
    \ and methods\nblueSprite.draw();\nredSprite = new Sprite( \"Bullet\" , \"Blue\"\
    \ );\nredSprite.draw();\n</script>\n```\n\n结果：\n\n蓝色飞机&nbsp;&nbsp;被绘制在画布上\n\n\
    蓝色子弹&nbsp;&nbsp;被绘制在画布上\n\n# 继承\n\n所有类`EnemyPlane`、`BluePane`、`RedPlane`、`Bullet`都继承自`Sprite`。\n\
    \n1. `Sprite`被称为父类\n2. `EnemyPlane`、`BluePane`、`RedPlane`、`Bullet`被称为子类\n3. 子类可以调用父类的属性和方法\n\
    \n![](img/Image00089.jpg)\n\n1. 用记事本创建一个`Inheritance.html`文件，并在浏览器中打开它。\n\n```html\n\
    <script type =\"text/javascript\" >\nclass Sprite{\n    constructor( name, color){\n\
    \        this.name = name;\n        this.color = color;\n    }\n    draw(){\n\
    \        var text = this.color + \" \" + this.name+ \"&nbsp;&nbsp;is drawn on\
    \ canvas\" ;\n        document.write( text+ \"<br>\" );\n    }\n}\n//BluePlane\
    \ is Child, extends is inherit, Sprite is Parent\nclass BluePlane extends Sprite{}\n\
    class RedPlane extends Sprite{}\nclass Bullet extends Sprite{}\nblueSprite = new\
    \ Sprite( \"Airplane\" , \"Blue\" );\nblueSprite.draw();\nredSprite = new Sprite(\
    \ \"Bullet\" , \"Blue\" );\nredSprite.draw();\nredBullet= new Bullet( \"Bullet\"\
    \ , \"Red\" ) &nbsp;&nbsp;&nbsp;&nbsp;redBullet.draw()\n</script>\n```\n\n结果：\n\
    \n蓝色飞机&nbsp;&nbsp;被绘制在画布上\n\n红色飞机&nbsp;&nbsp;被绘制在画布上\n\n红色子弹&nbsp;&nbsp;被绘制在画布上\n\
    \n# 重写\n\n重写：子类重写父类的方法，子类的实例将调用重写后的方法。\n\n`Sprite`可以发射子弹，但`BluePlane`可以发射蓝色子弹，`RedPlane`可以发射红色子弹。\n\
    \n![](img/Image00090.jpg)\n\n```html\n<script type =\"text/javascript\" >\nclass\
    \ Sprite{\n    shoot(){\n        document.write( \"fire bullet <br>\" );\n   \
    \ }\n}\n// BluePlane Inherit Sprite\nclass BluePlane extends Sprite{\n    shoot(){\n\
    \        document.write( \"BluePlane fire blue bullet <br>\" );\n    }\n}\n//\
    \ RedPlane Inherit Sprite\nclass RedPlane extends Sprite{\n    shoot(){\n    \
    \    document.write( \"RedPlane fire red bullet <br>\" );\n    }\n}\nbluePlane\
    \ = new BluePlane()\nbluePlane.shoot();\nredPlane = new RedPlane()\nredPlane.shoot();\n\
    </script>\n```\n\n"
