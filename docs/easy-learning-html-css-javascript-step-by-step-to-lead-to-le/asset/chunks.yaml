    ## 事件事件列表：


    | 事件 | 描述 |

    |-------|-------------|

    | Onblur | 元素失去焦点 |

    | Onchange | 内容发生改变 |

    | Onclick | 鼠标点击对象 |

    | Ondblclick | 鼠标双击对象 |

    | Onerror | 加载文档或图像时发生错误 |

    | Onfocus | 元素获得焦点 |

    | Onkeydown | 键盘按键被按下 |

    | Onkeypress | 键盘按键被按下 |

    | Onkeyup | 键盘按键被释放 |

    | Onload | 页面或图像加载完成 |

    | Onmousedown | 鼠标按钮被按下 |

    | Onmousemove | 鼠标移动 |

    | Onmouseout | 鼠标从元素上移开 |

    | Onmouseover | 鼠标移动到元素上 |

    | Onmouseup | 鼠标按钮被释放 |

    | Onreset | 重置按钮被点击 |

    | Onresize | 窗口或框架大小改变 |

    | Onselect | 文本被选中 |

    | Onsubmit | 提交按钮被点击 |

    | Onunload | 退出页面 |


