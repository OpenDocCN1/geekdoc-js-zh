    \ value);</script>\n```\n\n![](img/Image00037.jpg)\n\n# 事件\n\n1. 创建一个文件：`onClick.html`\n\
    \   - `onClick`：当鼠标点击按钮时，会调用一个函数。\n   - `<input type= \" button \" />`：HTML 标签，定义一个可点击的按钮。\n\
    \n```html\n<input type =\"text\" id =\"username\" value =\"Joseph\" /><input type\
    \ =\"button\" value =\"点击我\" onClick =\"doClick()\" /><script type =\"text/javascript\"\
    \ >function doClick(){var divObj = document.getElementById( \"username\" );var\
    \ value = divObj.value;alert( value);}</script>\n```\n\n![](img/Image00038.jpg)\n\
    \n# 创建一个网页计算器\n\n1. 创建一个文件：`WebCaculator.html`\n   ![](img/Image00039.jpg)\n\n\
    ```html\na: <input type =\"text\" id =\"a\" value =\"\" />b: <input type =\"text\"\
