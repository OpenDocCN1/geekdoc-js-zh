    \n"
- fmt: "\n# JavaScript 示例文档\n\n## 基本运算器\n\n以下是一个简单的加减乘除运算器 HTML 代码：\n\n```\n| a: <input\
    \ type=\"text\" id=\"a\" value=\"\" /> b: <input type=\"text\" id=\"b\" value=\"\
    \" /> = <span id=\"result\"></span><br>\n<input type=\"button\" value=\"+\" onClick=\"\
    doAdd()\" />\n<input type=\"button\" value=\"-\" onClick=\"doSub()\" />\n<input\
    \ type=\"button\" value=\"*\" onClick=\"doMultiply()\" />\n<input type=\"button\"\
    \ value=\"/\" onClick=\"doDivide()\" />\n<script type=\"text/javascript\">\nfunction\
    \ doAdd(){\n    var aObj = document.getElementById(\"a\");\n    var bObj = document.getElementById(\"\
    b\");\n    var resultObj = document.getElementById(\"result\");\n    var a = parseInt(aObj.value);\
    \ // Convert string to integer\n    var b = parseInt(bObj.value);\n    resultObj.innerHTML\
    \ = a + b;\n}\nfunction doSub(){\n    var aObj = document.getElementById(\"a\"\
    );\n    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
    result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
    \    resultObj.innerHTML = a - b;\n}\nfunction doMultiply(){\n    var aObj = document.getElementById(\"\
    a\");\n    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
    result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
    \    resultObj.innerHTML = a * b;\n}\nfunction doDivide(){\n    var aObj = document.getElementById(\"\
    a\");\n    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
    result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
    \    resultObj.innerHTML = a / b;\n}\n</script> |\n```\n\n点击不同按钮的结果如下：\n\n- Click\
    \ + button Result: ![](Image00040.jpg)\n- Click - button Result: ![](Image00041.jpg)\n\
    - Click * button Result: ![](Image00042.jpg)\n- Click / button Result: ![](Image00043.jpg)\n\
    \n## Assignment Operator\n\n1. 创建一个 `AssignmentOperator.html` 文件，用记事本编辑并在浏览器中打开。\n\
    \n```\n| <script type=\"text/javascript\">\nvar d = 4;\ndocument.write(d++); //\
    \ = 4 print d and then increment 1\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(++d);\
    \ // = 5 increment 1 and then print d\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(d--);\
    \ // = 4 print d and then decrement 1\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(--d);\
    \ // = 3 decrement 1 and then print d\nvar result = 10;\nresult = result + 1;\n\
    document.write(result); // = 11\ndocument.write(\"<br>\");\nresult = 10;\nresult++;\n\
    document.write(result); // = 11\ndocument.write(\"<br>\");\nresult = 10;\nresult\
    \ += 1;\ndocument.write(result);   // = 11\ndocument.write(\"<br>\");\n</script>\
    \ |\n```\n\n2. 创建一个数量加减器 `quantity.html`。点击 `+` 按钮数量增加 1，点击 `-` 按钮数量减少 1。\n\n\
    ![](Image00044.jpg)\n\n```\n| Quantity:<br>\n<input type=\"text\" style=\"width:30px\"\
    \ id=\"quantity\" value=\"1\" />\n<input type=\"button\" value=\"+\" onClick=\"\
    doAdd()\" />\n<input type=\"button\" value=\"-\" onClick=\"doSub()\" />\n<script\
    \ type=\"text/javascript\">\nfunction doAdd(){\n    var quantityObj = document.getElementById(\"\
    quantity\");\n    var value = parseInt(quantityObj.value);\n    value++;\n   \
    \ quantityObj.value = value;\n}\nfunction doSub(){\n    var quantityObj = document.getElementById(\"\
    quantity\");\n    var value = parseInt(quantityObj.value);\n    value--;\n   \
    \ quantityObj.value = value;\n}\n</script> |\n```\n\n## Relational Operator\n\n\
    1. 创建一个 `RelationalOperator.html` 文件，用记事本编辑并在浏览器中打开。关系运算符的结果只有两个值：`true` 和 `false`。\n\
    \n```\n| <script type=\"text/javascript\">\ndocument.write(1 > 2); // false\n\
    document.write(\"<br>\");\ndocument.write(1 >= 1); // true\ndocument.write(\"\
    <br>\");\ndocument.write(1 < 2); // true\ndocument.write(\"<br>\");\ndocument.write(1\
    \ <= 2); // true\ndocument.write(\"<br>\");\ndocument.write(1 == 1); // true\n\
    document.write(\"<br>\");\ndocument.write(1 != 2); // true\n</script> |\n```\n\
    \n## If Conditional Statement\n\n`if` 语句的三种形式：\n1. `if (expression) { statement\
    \ }`\n2. `if (expression) { statement } else { statement }`\n3. `if (expression)\
    \ { statement } else if { statement }`\n\n1. 创建一个 `If.html` 文件，用记事本编辑并在浏览器中打开。分数示例：\n\
    \   - 如果 `score == 5`：Excellent\n   - 否则如果 `score == 4`：Good\n   - 否则：Need to\
    \ catch up\n\n![](Image00045.jpg) ![](Image00046.jpg) ![](Image00047.jpg)\n\n\
    ```\n| Please input your score:<br>\n<input type=\"text\" id=\"score\" value=\"\
    \" />\n<input type=\"button\" value=\"Submit\" onClick=\"doSubmit()\" /><br>\n\
    <span id=\"message\"></span>\n<script type=\"text/javascript\">\nfunction doSubmit(){\n\
    \    var scoreObj = document.getElementById(\"score\");\n    var messageObj =\
    \ document.getElementById(\"message\");\n    var score = parseInt(scoreObj.value);\n\
    \    if (score == 5) {\n        messageObj.innerHTML = \"Excellent\";\n    } else\
    \ if (score == 4) {\n        messageObj.innerHTML = \"Good\";\n    } else {\n\
    \        messageObj.innerHTML = \"Need to catch up\";\n    }\n}\n</script> |\n\
    ```\n\n## Logic Operator\n\n1. 创建一个 `LogicOperator.html` 文件，用记事本编辑并在浏览器中打开。逻辑运算符：与\
    \ `&&`、或 `||`、非 `!`。\n   - `&&`：两边都为 `true` 时返回 `true`，否则 `false`。\n   - `||`：两边都为\
    \ `false` 时返回 `false`，否则 `true`。\n   - `!`：如果为 `true` 则返回 `false`，否则返回 `true`。\n\
    \n```\n| <script type=\"text/javascript\">\ndocument.write(true && false); //\
    \ false\ndocument.write(\"<br>\");\ndocument.write(false && true); // false\n\
    document.write(\"<br>\");\ndocument.write(false && false); // false\ndocument.write(\"\
    <br>\");\ndocument.write(true && true); // true\ndocument.write(\"<br>\");\ndocument.write(true\
    \ || false); // true\ndocument.write(\"<br>\");\ndocument.write(false || true);\
    \ // true\ndocument.write(\"<br>\");\ndocument.write(true || true); // true\n\
    document.write(\"<br>\");\ndocument.write(false || false); // false\ndocument.write(\"\
    <br>\");\ndocument.write(!true); // false\ndocument.write(\"<br>\");\ndocument.write(!false);\
    \ // true\ndocument.write(\"<br>\");\n</script> |\n```\n\n2. 创建 `LogicOperator2.html`。\n\
    \n```\n| <script type=\"text/javascript\">\ndocument.write(1 > 2 && 3 > 4) //\
    \ = false\ndocument.write(2 > 1 && 3 > 4) // = false\ndocument.write(\"--------------\"\
    )\ndocument.write(2 > 1 || 3 > 4) // = true\ndocument.write(2 > 1 || 3 > 4) //\
    \ = true\ndocument.write(1 > 2 || 3 > 4) // = false\n</script> |\n```\n\n3. 工资税示例：税额\
    \ = 工资 * 税率。等级：\n   - 500 – 2000 $：税率 10%\n   - 2000 – 5000 $：税率 15%\n   - 5000\
    \ – 20000 $：税率 20%\n   - 超过 20000 $：税率 30%\n\n```\n| <script type=\"text/javascript\"\
    >\nvar salary = 10000;\nvar tax = 0;\nif (salary >= 500 && salary < 2000) {\n\
    \    tax = salary * 0.1;\n} else if (salary >= 2000 && salary < 5000) {\n    tax\
    \ = salary * 0.15;\n} else if (salary >= 5000 && salary < 20000) {\n    tax =\
    \ salary * 0.2;\n} else {\n    tax = salary * 0.3;\n}\ndocument.write(\"tax amount=\"\
    \ + tax);\n</script> |\n```\n\n结果：`tax amount=2000`\n\n2. 创建 `WebTax.html`。输入工资，点击\
    \ `Calculate Tax` 按钮。\n\n![](Image00048.jpg)\n\n```\n| Salary: <input type=\"\
    text\" id=\"salary\" value=\"\" /> = <span id=\"tax\"></span>\n<input type=\"\
    button\" value=\"Calculate Tax\" onClick=\"doTax()\" />\n<script type=\"text/javascript\"\
    >\nfunction doTax(){\n    var salaryObj = document.getElementById(\"salary\");\n\
    \    var salary = parseInt(salaryObj.value);\n    var tax = 0;\n    if (salary\
    \ >= 500 && salary < 2000) {\n        tax = salary * 0.1;\n    } else if (salary\
    \ >= 2000 && salary < 5000) {\n        tax = salary * 0.15;\n    } else if (salary\
    \ >= 5000 && salary < 20000) {\n        tax = salary * 0.2;\n    } else {\n  \
    \      tax = salary * 0.3;\n    }\n    document.getElementById(\"tax\").innerHTML\
    \ = tax;\n}\n</script> |\n```\n\n## Switch Statement\n\n1. 创建一个 `switch.html`\
    \ 文件，用记事本编辑并在浏览器中打开。输入数字 1、2、3：\n   - 1：Pay by Visa Card\n   - 2：Pay by Master\
    \ Card\n   - 3：Pay by Paypal\n   - 其他：Pay by face to face\n\n```\n| <script type=\"\
    text/javascript\">\nvar num = 1;\nswitch (num) {\n    case 1:\n        document.write(\"\
    Pay by Visa Card\");\n        break; // terminate the code to continue execution\n\
    \    case 2:\n        document.write(\"Pay by Master Card\");\n        break;\n\
    \    case 3:\n        document.write(\"Pay by Paypal\");\n        break;\n   \
    \ default:\n        document.write(\"Pay by face to face\");\n}\n</script> |\n\
    ```\n\n结果：`Pay by Visa Card`\n\n2. 创建 `WebPay.html`。`this` 表示当前元素对象。\n\n![](Image00049.jpg)\n"
