- fmt: "\n# First Web Page\n\nHTML is a series of tags on a web page that format the\
    \ display.\n\n1. Create a `FirstWebPage.html` file with Notepad or another Editor\
    \ and open it in your browser to see the webpage\n\n![](Image00003.jpg)\n\n`<html>`:\
    \ tag tells the browser that this is an HTML document.  \n`<title>`: tag it defines\
    \ the title of the document.  \n`<body>`: tag defines the document's body.\n\n\
    ```\n<! DOCTYPE HTML>\n<html>\n<head>\n<title> First Web Page </title>\n</head>\n\
    <body>\nA good start is half successful\n</body>\n</html>\n```\n\n## `<div>` CSS\
    \ Box\n\n1. Create a `Box.html` file and open it in your browser to see the webpage\n\
    \n![](Image00004.jpg)\n\n`<div>`: html tag defines a division or a section in\
    \ an HTML document.  \n`<style>`: setting the style of an HTML element.  \n`.class\
    \ selector`: css selects elements with a specific class attribute.  \n`border`:\
    \ CSS properties allow you to specify the style, width, and color of an element's\
    \ border.  \n`Color`: (red:#ff0000 , green:#00ff00 , blue:#0000ff , grey:#cccccc\
    \ )  \n`text-align`: CSS properties specifies the horizontal alignment of text\
    \ (left, center, right)\n\n```\n<! DOCTYPE HTML>\n<html>\n<head>\n<title> Border\
    \ </title>\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:300px;\nheight:150px;\n\
    text-align:center;\n}\n</style>\n</head>\n<body>\n<div class =\"box\" >Better\
    \ Life</div>\n</body>\n</html>\n```\n\n### 2. defines the radius of the div's\
    \ corners.\n\n![](Image00005.jpg)\n\n`border-radius`: CSS3 property defines the\
    \ radius of the element's corners.\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\n\
    width:300px;\nheight:150px;\ntext-align:center;\nborder-radius:25px;\n}\n</style>\n\
    <div class =\"box\" >Better Life</div>\n```\n\n### 3. defines the shadows of the\
    \ div's box.\n\n![](Image00006.jpg)\n\n`box-shadow`: CSS3 property attaches one\
    \ or more shadows to an element.\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\n\
    width:200px;\nheight:200px;\ntext-align:center;\nborder-radius:25px;\nbox-shadow:\
    \ 0px 0px 5px #888888;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n\
    ```\n\n### 4. defines the shadows of the div's box.\n\n![](Image00007.jpg)\n\n\
    `box-shadow`: CSS3 property attaches one or more shadows to an element.  \n`h-offset`:\
    \ The horizontal offset of the shadow.  \n`v-offset`: The vertical offset of the\
    \ shadow.\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:200px;\nheight:200px;\n\
    text-align:center;\nborder-radius:25px;\nbox-shadow: 10px 10px 5px #888888;\n\
    }\n</style>\n<div class =\"box\" >Better Life</div>\n```\n\n### 5. defines the\
    \ background color of the div's box.\n\n![](Image00008.jpg)\n\n`background-color`:\
    \ CSS property define the color of background.  \n`font-size:24px;` CSS property\
    \ define the size of font.  \n`color:#ffffff;` CSS property define the color of\
    \ font.\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:200px;\nheight:200px;\n\
    text-align:center;\nborder-radius:8px;\nbackground-color:#ff0000;\nfont-size:24px;\n\
    color:#ffffff;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n```\n\n###\
    \ 6. defines the absolute position of the div's box.\n\n![](Image00009.jpg)\n\n\
    `position:absolute;` the element is positioned absolutely to its first positioned\
    \ parent.  \n`top: offset;` CSS property defines the top position of an element.\
    \  \n`left: offset;` CSS property defines the left position of an element.\n\n\
    ```\n<style>\n.redBox{\nborder:1px solid #cccccc;\nwidth:100px;\nheight:100px;\n\
    border-radius:8px;\nbackground-color:#ff0000;\nposition:absolute;\ntop:0px;\n\
    left:0px;\n}\n.greenBox{\nborder:1px solid #cccccc;\nwidth:100px;\nheight:100px;\n\
    border-radius:8px;\nbackground-color:#00ff00;\nposition:absolute;\ntop:10px;\n\
    left:10px;\n}\n.blueBox{\nborder:1px solid #cccccc;\nwidth:100px;\nheight:100px;\n\
    border-radius:8px;\nbackground-color:#0000ff;\nposition:absolute;\ntop:20px;\n\
    left:20px;\n}\n</style>\n<div class =\"redBox\" ></div>\n<div class =\"greenBox\"\
    \ ></div>\n<div class =\"blueBox\" ></div>\n```\n\n### 7. defines the relative\
    \ position of the div's box.\n\n![](Image00010.jpg)\n\n`position:relative;` the\
    \ element is positioned relative to its normal position.\n"
