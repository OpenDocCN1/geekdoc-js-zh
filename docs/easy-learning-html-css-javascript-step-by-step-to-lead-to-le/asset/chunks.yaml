    ## Element Hierarchy


    ![](Image00064.jpg)


    1. Change `ElementHierarchy.html` to get all child nodes.


    `obj.childNodes`: get all child nodes of current node


    `obj.nodeName`: get the node’s name


    `obj.nodeType`: get the node’s type


    `obj.innerHTML`: get the node’s html content


    ![](Image00065.jpg)


    `<b>`: tag specifies bold text.


    `<a>`: tag defines a hyperlink, which is used to link from one page to another.


    ```

    <body><div id ="div" ><b> United State </b><span> Book </span><a href ="#" > VereJava
    </a></div><hr><input type ="button" value ="Get Parent Node" onclick ="doGetParentNode()"
    /></body><script type ="text/javascript" >function doGetParentNode(){var divObj=
    document.getElementById( "div" );alert( divObj.parentNode.nodeName);}</script>

    ```


    2. Change `ElementHierarchy.html` to get all child nodes.


    `obj.childNodes`: get all child nodes of current node


    `obj.nodeName`: get the parent node’s name


    `obj.nodeType`: get the parent node’s type


    `obj.innerHTML`: get the parent node’s html content


    ![](Image00066.jpg)


    ```

    <body><div id= "div" ><b> United State </b><span> Book </span><a href ="#" > VereJava
    </a></div><hr><input type ="button" value ="Get Child Nodes" onclick ="doGetChildNodes()"
    /></body><script type ="text/javascript" >function doGetChildNodes(){var div=
    document.getElementById( "div" );var childNodes= div.childNodes;for ( var i= 0
    ; i< childNodes.length; i++){if ( childNodes[ i]. nodeType== 1 ){document.write(
    childNodes[ i]. nodeName+ " , " );document.write( childNodes[ i]. nodeType+ "
    , " );document.write( childNodes[ i]. innerHTML+ "<br>" );}}}</script>

    ```


    3. Change `ElementHierarchy.html` to get book node’s previous and next node.


    `obj.previousSibling`: get previous node of current node


    `obj.nextSibling`: get next node of current node


    ![](Image00067.jpg)


    ```

    <body><div id ="div" ><b> United State </b><span id ="book" > Book </span><a href
    ="#" > VereJava </a></div><hr><input type ="button" value ="Get Sliding Nodes"
    onclick ="doGetSliding()" /></body><script type ="text/javascript" >function doGetSliding(){var
    bookObj= document.getElementById( "book" );document.write( bookObj.previousSibling.innerHTML+
    "<br>" );document.write( bookObj.nextSibling.innerHTML);}</script>

    ```


