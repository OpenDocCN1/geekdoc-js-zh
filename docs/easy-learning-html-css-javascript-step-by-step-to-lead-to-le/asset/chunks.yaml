    login\" ><div> Username: <input class =\"textbox\" type =\"text\" id =\"username\"\
    \ /></div><div> Password: <input class =\"textbox\" type =\"password\" id =\"\
    username\" /></div><div id =\"buttonDiv\" ><input type =\"button\" value =\"Login\"\
    \ /><input type =\"button\" value =\"Close\" /></div></div>\n```\n\n# Javascript\
    \ HelloWorld\n\nJavascript is a web page dynamic interactive language that used\
    \ in web development.\n\n1. Create a `helloworld.html` file with Notepad and open\
    \ it in your browser to see the webpage\n   - `<html>`: tag tells the browser\
    \ that this is an HTML document.\n   - `<head>`: tag is a container for metadata\
    \ about content and charset.\n   - `<title>`: tag defines the title of the document.\n\
    \   - `<body>`: tag defines the document's body.\n   - `<script>`: tag is used\
    \ to define a client-side script (JavaScript).\n   - `document.write()`: writes\
    \ HTML content to document in browser\n\n```html\n<html><head><meta http-equiv\
    \ =\"Content-Type\" content =\"text/html; charset=UTF-8\" ><title> First Web Page\
    \ </title></head><body><script type =\"text/javascript\" >document.write( \"HelloWorld\"\
    \ );</script></body></html>\n```\n\nResult: ![](Image00025.jpg)\n\n# Variable\n\
    \n![](Image00026.jpg)\n\n1. Create a file : `Variable.html` and open it in your\
    \ browser\n   - `//` : single comments are not executed by javascript\n   - `\"\
    \"`: string type\n\n```javascript\n<script type =\"text/javascript\" >var basket\
    \ = \"Apple\" ;document.write( basket);</script>\n```\n\nResult: ![](Image00027.jpg)\n\
    \n2. Change file : `Variable.html` Put \" orange \" to replace \" apple \" . ![](Image00028.jpg)\n\
    \   - `<br>`: html tag wrap a new line\n\n```javascript\n<script type =\"text/javascript\"\
    \ >var basket = \"Apple\" ;document.write( basket);document.write( \"<br>\" );basket\
    \ = \"Orange\" ;document.write( basket);</script>\n```\n\nRun Result: ![](Image00029.jpg)\n\
    \n# Variable and Type\n\nJavascript is dynamic type language\n\n1. Create a `var.html`\
    \ file with Notepad and open it in your browser to see the webpage\n   - `typeof()`:\
    \ find the type of a JavaScript variable\n\n```javascript\n<script type =\"text/javascript\"\
    \ >var x;           //undefinedvar a= 9 ;         //numbervar b= 1.5 ;       //numbervar\
    \ c= true ;      //Booleanvar d= \"abc\" ;     //stringvar e= 'abc' ;     //stringdocument.write(\
    \ typeof ( x) + \"<br>\" );document.write( typeof ( a) + \"<br>\" );document.write(\
    \ typeof ( b) + \"<br>\" );document.write( typeof ( c) + \"<br>\" );document.write(\
    \ typeof ( d) + \"<br>\" );document.write( typeof ( e) + \"<br>\" );</script>\n\
    ```\n\nResult:\n```\nundefined\nnumber\nnumber\nboolean\nstring\nstring\n```\n\
    \n# Arithmetic Operator\n\n1. Create a `ArithmeticOperator.html` file with Notepad\
    \ and open it in your browser\n   - Arithmetic Operator: Add `+`, minus `-`, multiply\
    \ `*`, divisible `/`, take modulo `%`\n   ![](Image00030.jpg)\n\n```javascript\n\
    <script type =\"text/javascript\" >var a = 1 ;var b = 2 ;var c = 3 ;var d = 4\
    \ ;document.write( a + b); // = 3document.write( \"<br>\" );document.write( a\
    \ - b); // = -1document.write( \"<br>\" );document.write( a * b); // = 2document.write(\
    \ \"<br>\" );document.write( b / a); // = 2document.write( \"<br>\" );document.write(\
    \ c % b); // = 1 //number remaining after dividedocument.write( \"<br>\" );</script>\n\
    ```\n\n# Function\n\n![](Image00031.jpg) ![](Image00032.jpg) ![](Image00033.jpg)\n\
    \n1. Create a file : `Function.html`\n\n```javascript\n<script type =\"text/javascript\"\
    \ >function add( a, b){return a + b;}var result = add( 4 , 2 );document.write(\
    \ result); // 6document.write( \"<br>\" );var result = add( 5 , 3 );document.write(\
    \ result)   // 8</script>\n```\n\nRun Result:\n```\n6\n8\n```\n\n2. Add 3 more\
    \ functions about `-`, `*`, `/` to `Function.html`\n\n```javascript\n<script type\
    \ =\"text/javascript\" >function add( a, b){return a + b;}function sub( a, b){return\
    \ a - b;}function multiply( a, b){return a * b;}function divide( a, b){return\
    \ a / b;}var result = add( 4 , 2 );document.write( result); // 6document.write(\
    \ \"<br>\" );var result = sub( 4 , 2 );document.write( result)   // 2document.write(\
    \ \"<br>\" );var result = multiply( 4 , 2 );document.write( result)   // 8document.write(\
    \ \"<br>\" );var result = divide( 4 , 2 );document.write( result)   // 2</script>\n\
    ```\n\n# Class\n\n![](Image00034.jpg)\n\n1. Create a file : `Caculator.html`\n\
    \n```javascript\n<script type =\"text/javascript\" >function Caculator(){this.add=\
    \ function ( a, b){return a + b;}this.sub= function ( a, b){return a - b;}this.multiply=\
    \ function ( a, b){return a * b;}this.divide= function ( a, b){return a / b;}}var\
    \ cal = new Caculator();var result = cal.add( 4 , 2 );document.write( result);\
    \ // 6var result = cal.sub( 4 , 2 );document.write( result)   // 2var result =\
    \ cal.multiply( 4 , 2 );document.write( result)   // 8var result = cal.divide(\
    \ 4 , 2 );document.write( result)   // 2</script>\n```\n\n# Type Conversion\n\n\
    1. Create a `TypeConversion.html`\n   - `parseInt()`: this is javascript default\
    \ function can convert string to integer.\n\n```javascript\n<script type =\"text/javascript\"\
    \ >var a= \"1\" ;        var b= \"2\" ;    var result = a + b; // + concatenate\
    \ two stringsdocument.write( result); // = 12document.write( \"<br>\" );result\
    \ = parseInt( a) + parseInt( b);document.write( result); // = 3</script>\n```\n\
    \nResult:\n```\n12\n3\n```\n\n# DOM\n\nDOM: In Javascript every HTML element is\
    \ a class object.\nDocument Object Model structure diagram: ![](Image00035.jpg)\n\
    \n1. Create a file : `getElementById.html`\n   - `document.getElementById()`:\
    \ is a DOM method to get the element by ID attribute.\n   - `alert()`: is a function\
    \ to open a information window.\n   - `Obj.innerHTML`: sets or returns the inner\
    \ HTML content of an element.\n   - `<div>`: tag defines a division or a section\
    \ in an HTML document.\n\n```html\n<div id =\"word\" > Faith and Hope </div><script\
    \ type =\"text/javascript\" >var divObj = document.getElementById( \"word\" );var\
    \ htmlContent = divObj.innerHTML;alert( htmlContent);</script>\n```\n\n![](Image00036.jpg)\n\
    \n2. Change a file : `getElementById.html`\n   - `<input type= \" text \" />`:\
    \ html tag specifies an input field where the user can enter data.\n\n```html\n\
    <input type =\"text\" id =\"username\" value =\"Joseph\" /><script type =\"text/javascript\"\
    \ >var divObj = document.getElementById( \"username\" );var value = divObj.value;alert(\
    \ value);</script>\n```\n\n![](Image00037.jpg)\n\n# Event\n\n1. Create a file\
    \ : `onClick.html`\n   - `onClick`: when the mouse clicks the button will call\
    \ a function.\n   - `<input type= \" button \" />`: html tag defines a clickable\
    \ button.\n\n```html\n<input type =\"text\" id =\"username\" value =\"Joseph\"\
    \ /><input type =\"button\" value =\"Click Me\" onClick =\"doClick()\" /><script\
    \ type =\"text/javascript\" >function doClick(){var divObj = document.getElementById(\
    \ \"username\" );var value = divObj.value;alert( value);}</script>\n```\n\n![](Image00038.jpg)\n\
    \n# Create a Web Caculator\n\n1. Create a file : `WebCaculator.html`\n   ![](Image00039.jpg)\n\
    \n```html\na: <input type =\"text\" id =\"a\" value =\"\" />b: <input type =\"\
    text\" id =\"b\" value =\"\" />=<span id =\"result\" ></span><br><input type =\"\
    button\" value =\"+\" onClick =\"doAdd()\" /><script type =\"text/javascript\"\
    \ >function doAdd(){var aObj = document.getElementById( \"a\" );var bObj = document.getElementById(\
    \ \"b\" );var resultObj = document.getElementById( \"result\" );var a = parseInt(\
    \ aObj.value); // Convert string to integervar b = parseInt( bObj.value);resultObj.innerHTML\
    \ = a + b;}</script>\n```\n\n2. Add 3 mores function `-`, `*`, `/` to `WebCaculator.html`\n"
