    # 飞机游戏


    结果：蓝色飞机发射蓝色子弹，红色飞机发射红色子弹。


    ## 1. 在画布上绘制图像


    ### 1.1 将两架飞机的图片放入目录

    `images/blue_plane.png`

    `images/red_plane.png`

    ![](img/Image00091.jpg) ![](img/Image00092.jpg)


    ### 1.2 在画布上绘制 `images/blue_plane.png` 和 `images/red_plane.png`

    ![](img/Image00093.jpg)


    所有图片均位于 KidsLearningJavascriptImages.zip 中，请通过此链接下载：[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)


    ## 1. 使用记事本创建 DrawImage.html 文件，并在浏览器中打开


    `Image.onload`：当图像加载完成时触发的事件。`drawImage()`：将图像绘制到画布上。


    ```html

    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas
    id ="myCanvas" width ="300" height ="300" ></canvas><script type ="text/javascript"
    >var canvas = document.getElementById( "myCanvas" );var context = canvas.getContext(
    "2d" );var bluePlaneImage = new Image();bluePlaneImage.src = "./images/blue_plane.png"
    ;bluePlaneImage.onload = function (){     context.drawImage( bluePlaneImage, 60
    , 220 );         };var redPlaneImage = new Image();redPlaneImage.src = "./images/red_Plane.png"
    ;redPlaneImage.onload = function (){context.drawImage( redPlaneImage, 160 , 220
    );               };</script>

    ```


    ## 3. 创建 Airplane 类，并编写 draw 方法在画布上绘制图像

    ![](img/Image00094.jpg)


    ```html

    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas
    id ="myCanvas" width ="300" height ="300" ></canvas><script type ="text/javascript"
    >var canvas = document.getElementById( "myCanvas" );var context = canvas.getContext(
    "2d" );class Airplane{constructor( img, x, y){this.x = x;this.y = y;this.img =
    img;}draw( context){context.drawImage( this.img, this.x, this.y);}}////////////
    test /////////////////var bluePlaneImage = new Image();bluePlaneImage.src = "./images/blue_plane.png"
    ;var bluePlane = new Airplane( bluePlaneImage, 60 , 220 );bluePlaneImage.onload
    = function (){     bluePlane.draw( context);         };var redPlaneImage = new
    Image();redPlaneImage.src = "./images/red_Plane.png" ;var redPlane = new Airplane(
    redPlaneImage, 160 , 220 );redPlaneImage.onload = function (){redPlane.draw( context);
                   };</script>

    ```


    ## 4. 按键事件


    ### 4.1 如果按下上、下、左、右方向键，将调用 `doKeyDown` 函数

    ![](img/Image00095.jpg)


    ```html

    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas
    id ="myCanvas" width ="300" height ="300" ></canvas><script type ="text/javascript"
    >var canvas = document.getElementById( "myCanvas" );var context = canvas.getContext(
    "2d" );class Airplane{constructor( img, x, y){this.x = x;this.y = y;this.img =
    img;}draw( context){context.drawImage( this.img, this.x, this.y);}}////////////
    test /////////////////var bluePlaneImage = new Image();bluePlaneImage.src = "./images/blue_plane.png"
    ;var bluePlane = new Airplane( bluePlaneImage, 60 , 220 );bluePlaneImage.onload
    = function (){     bluePlane.draw( context);         };var redPlaneImage = new
    Image();redPlaneImage.src = "./images/red_Plane.png" ;var redPlane = new Airplane(
    redPlaneImage, 160 , 220 );redPlaneImage.onload = function (){redPlane.draw( context);
                   };canvas.addEventListener( ''keydown'' , doKeyDown, true );canvas.focus();window.addEventListener(
    ''keydown'' , doKeyDown, true );function doKeyDown( e) {var keyID = e.keyCode
    ? e.keyCode : e.which;if ( keyID === 37 )   { //left arrowalert( "left" );e.preventDefault();}if
    ( keyID === 38 )   { //up arrowalert( "up" );e.preventDefault();}if ( keyID ===
    39 )   { //right arrowalert( "right" );e.preventDefault();}if ( keyID === 40 )
      { //down arrowalert( "down" );e.preventDefault();}}</script>

    ```


    ## 4. 按下上、下、左、右方向键移动画布上的飞机

    ![](img/Image00096.jpg)


    ```html

    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas
    id ="myCanvas" width ="300" height ="300" ></canvas><script type ="text/javascript"
    >var canvas = document.getElementById( "myCanvas" );var context = canvas.getContext(
    "2d" );var canvasWidth = 300 ;var canvasHeight = 300 ;class Airplane{constructor(
    img, x, y){this.x = x;this.y = y;this.img = img;}draw( context){context.drawImage(
    this.img, this.x, this.y);}move( context, distanceX, distanceY){this.x = this.x
    + distanceX;this.y = this.y + distanceY;context.drawImage( this.img, this.x, this.y);}}////////////
    test /////////////////var bluePlaneImage = new Image();bluePlaneImage.src = "./images/blue_plane.png"
    ;var bluePlane = new Airplane( bluePlaneImage, 100 , 220 );bluePlaneImage.onload
    = function (){     bluePlane.draw( context);         };canvas.addEventListener(
    ''keydown'' , doKeyDown, true );canvas.focus();window.addEventListener( ''keydown''
    , doKeyDown, true );function doKeyDown( e) {context.clearRect( 0 , 0 , canvasWidth,
    canvasHeight);var keyID = e.keyCode ? e.keyCode : e.which;if ( keyID === 37 )
      { //left arrowbluePlane.move( context,- 5 , 0 )e.preventDefault();}if ( keyID
    === 38 )   { //up arrowbluePlane.move( context, 0 , - 5 )e.preventDefault();}if
    ( keyID === 39 )   { //right arrowbluePlane.move( context, 5 , 0 )e.preventDefault();}if
    ( keyID === 40 )   { //down arrowbluePlane.move( context, 0 , 5 )e.preventDefault();}}</script>

    ```


    ## 5. 飞机发射蓝色子弹


    ### 5.1 子弹从飞机顶部中央发射

    ![](img/Image00097.jpg)


    ### 5.2 启动 `setInterval("reDraw()",200)` 使子弹持续向上移动，当子弹移出画布时，需要销毁子弹（设置 `visible
    = false`），子弹可以重新发射

    ![](img/Image00098.jpg)


    ### 5.3 飞机和子弹继承自 Sprite 以实现复用

    ![](img/Image00099.jpg)


    ## 6. 敌机持续向下移动


    ### 6.1 敌机从画布顶部随机位置开始并向下移动

    ![](img/Image00100.jpg)


    ### 6.2 保持敌机向下移动，当敌机移出画布时，需要销毁敌机（设置 `visible = False`），敌机可以重新生成

    ![](img/Image00101.jpg)


    ### 6.3 飞机、子弹和敌机继承自 Sprite 以实现复用

    ![](img/Image00102.jpg)


    ## 7. 子弹与敌机碰撞并爆炸

    ![](img/Image00103.jpg)


    ### 7.1 子弹与敌机碰撞

    当两张图片中心坐标之差的绝对值小于它们宽度和高度之和的一半时，我们认为它们相交并发生碰撞

    ![](img/Image00104.jpg)


