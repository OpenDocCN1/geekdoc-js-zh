    ## Canvas Progress Bar


    Canvas: HTML `<canvas>` element is used to draw graphics on a web page.


    ![](Image00080.jpg)


    1. Create a `Canvas.html` file with Notepad and open it in your browser.


    `<style>`: describes how HTML elements are to be displayed on screen.


    `#id`: The `#id` selector styles the element with the specified id.


    | `<style>#myCanvas{border:1px solid #c3c3c3;}</style><canvas id ="myCanvas" width
    ="400" height ="200" ></canvas>` |


    ### 2. Draw a line on Canvas


    ![](Image00081.jpg)


    `canvas.getContext("2d")`: returns an object that provides methods for drawing
    on the canvas.


    | `<style>#myCanvas{border:1px solid #c3c3c3;}</style><canvas id ="myCanvas" width
    ="400" height ="200" ></canvas><script type ="text/javascript" >var canvas = document.getElementById(
    "myCanvas" );//Begin a path create a line  move from (20,100) to (200,100):var
    context = canvas.getContext( "2d" );context.beginPath();context.moveTo( 20 , 100
    );context.lineTo( 200 , 100 );context.stroke();</script>` |


    ### 3. Draw a Rectangle on Canvas


    ![](Image00082.jpg)


    `context.fillRect(x, y, width, height)`: draw a rectangle on the canvas.


    `context.fillStyle`: the color to fill rectangle (red: `#ff0000`, green: `#00ff00`,
    blue: `#0000ff`).


    | `<style>#myCanvas{border:1px solid #c3c3c3;}</style><canvas id ="myCanvas" width
    ="400" height ="200" ></canvas><script type ="text/javascript" >var canvas = document.getElementById(
    "myCanvas" );//Begin a path create a rectanglevar context = canvas.getContext(
    "2d" );context.fillStyle = "#ff0000" ;context.fillRect( 100 , 50 , 100 , 50 );</script>`
    |


    ### 4. Draw Progress Bar Animation


    4.1. Draw an empty rectangle first.


    4.2. Draw a solid rectangle, the width increasing by 10 every 200 milliseconds
    until width=100.


    ![](Image00083.jpg)


    `context.strokeRect(x, y, width, height)`: draw a stroke rectangle on the canvas.

