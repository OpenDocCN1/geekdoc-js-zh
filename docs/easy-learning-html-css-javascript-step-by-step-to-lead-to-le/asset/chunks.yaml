  trans: "\n\n# 第一个网页\n\nHTML 是网页上用于格式化显示的一系列标签。\n\n1. 使用记事本或其他编辑器创建一个 `FirstWebPage.html`\
    \ 文件，并在浏览器中打开它以查看网页\n\n![](img/Image00003.jpg)\n\n`<html>`: 标签告诉浏览器这是一个 HTML 文档。\
    \  \n`<title>`: 标签定义文档的标题。  \n`<body>`: 标签定义文档的主体。\n\n```\n<! DOCTYPE HTML>\n\
    <html>\n<head>\n<title> First Web Page </title>\n</head>\n<body>\nA good start\
    \ is half successful\n</body>\n</html>\n```\n\n## `<div>` CSS 盒子\n\n1. 创建一个 `Box.html`\
    \ 文件，并在浏览器中打开它以查看网页\n\n![](img/Image00004.jpg)\n\n`<div>`: HTML 标签定义 HTML 文档中的一个分区或节。\
    \  \n`<style>`: 设置 HTML 元素的样式。  \n`.class 选择器`: CSS 选择具有特定 class 属性的元素。  \n`border`:\
    \ CSS 属性允许你指定元素边框的样式、宽度和颜色。  \n`Color`: (红色:#ff0000 , 绿色:#00ff00 , 蓝色:#0000ff\
    \ , 灰色:#cccccc )  \n`text-align`: CSS 属性指定文本的水平对齐方式（左、中、右）\n\n```\n<! DOCTYPE\
    \ HTML>\n<html>\n<head>\n<title> Border </title>\n<style>\n.box{\nborder:1px solid\
    \ #cccccc;\nwidth:300px;\nheight:150px;\ntext-align:center;\n}\n</style>\n</head>\n\
    <body>\n<div class =\"box\" >Better Life</div>\n</body>\n</html>\n```\n\n### 2.\
    \ 定义 div 圆角的半径。\n\n![](img/Image00005.jpg)\n\n`border-radius`: CSS3 属性定义元素圆角的半径。\n\
    \n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:300px;\nheight:150px;\n\
    text-align:center;\nborder-radius:25px;\n}\n</style>\n<div class =\"box\" >Better\
    \ Life</div>\n```\n\n### 3. 定义 div 盒子的阴影。\n\n![](img/Image00006.jpg)\n\n`box-shadow`:\
    \ CSS3 属性为一个元素添加一个或多个阴影。\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:200px;\n\
    height:200px;\ntext-align:center;\nborder-radius:25px;\nbox-shadow: 0px 0px 5px\
    \ #888888;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n```\n\n### 4.\
    \ 定义 div 盒子的阴影。\n\n![](img/Image00007.jpg)\n\n`box-shadow`: CSS3 属性为一个元素添加一个或多个阴影。\
    \  \n`h-offset`: 阴影的水平偏移量。  \n`v-offset`: 阴影的垂直偏移量。\n\n```\n<style>\n.box{\nborder:1px\
    \ solid #cccccc;\nwidth:200px;\nheight:200px;\ntext-align:center;\nborder-radius:25px;\n\
    box-shadow: 10px 10px 5px #888888;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n\
    ```\n\n### 5. 定义 div 盒子的背景颜色。\n\n![](img/Image00008.jpg)\n\n`background-color`:\
    \ CSS 属性定义背景颜色。  \n`font-size:24px;` CSS 属性定义字体大小。  \n`color:#ffffff;` CSS 属性定义字体颜色。\n\
    \n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:200px;\nheight:200px;\n\
    text-align:center;\nborder-radius:8px;\nbackground-color:#ff0000;\nfont-size:24px;\n\
    color:#ffffff;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n```\n\n###\
    \ 6. 定义 div 盒子的绝对位置。\n\n![](img/Image00009.jpg)\n\n`position:absolute;` 元素相对于其第一个已定位的父元素进行绝对定位。\
    \  \n`top: offset;` CSS 属性定义元素的顶部位置。  \n`left: offset;` CSS 属性定义元素的左侧位置。\n\n```\n\
    <style>\n.redBox{\nborder:1px solid #cccccc;\nwidth:100px;\nheight:100px;\nborder-radius:8px;\n\
    background-color:#ff0000;\nposition:absolute;\ntop:0px;\nleft:0px;\n}\n.greenBox{\n\
    border:1px solid #cccccc;\nwidth:100px;\nheight:100px;\nborder-radius:8px;\nbackground-color:#00ff00;\n\
    position:absolute;\ntop:10px;\nleft:10px;\n}\n.blueBox{\nborder:1px solid #cccccc;\n\
    width:100px;\nheight:100px;\nborder-radius:8px;\nbackground-color:#0000ff;\nposition:absolute;\n\
    top:20px;\nleft:20px;\n}\n</style>\n<div class =\"redBox\" ></div>\n<div class\
    \ =\"greenBox\" ></div>\n<div class =\"blueBox\" ></div>\n```\n\n### 7. 定义 div\
    \ 盒子的相对位置。\n\n![](img/Image00010.jpg)\n\n`position:relative;` 元素相对于其正常位置进行定位。\n\
    \n"
- fmt: "\n```\n<style>.redBox{border:1px solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#ff0000;position:relative;}.greenBox{border:1px\
    \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#00ff00;position:relative;}.blueBox{border:1px\
    \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#0000ff;position:relative;}</style><div\
    \ class =\"redBox\" ></div><div class =\"greenBox\" ></div><div class =\"blueBox\"\
    \ ></div>\n```\n\n8. defines space around an element's content, outside of the\
    \ `div`'s box.![](Image00011.jpg)`margin`: CSS properties are used to create space\
    \ around elements, outside of any defined borders. (top, right, bottom, and left)\
    \  \n1. `margin-top`  \n2. `margin-right`  \n3. `margin-bottom`  \n4. `margin-left`\n\
    \n```\n<style>.redBox{border:1px solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#ff0000;position:relative;}.greenBox{border:1px\
    \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#00ff00;position:relative;}.blueBox{border:1px\
    \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#0000ff;position:relative;}</style><div\
    \ class =\"redBox\" ></div><div class =\"greenBox\" ></div><div class =\"blueBox\"\
    \ ></div>\n```\n\n9. defines space around an element's content, inside of the\
    \ `div`'s box.![](Image00012.jpg)`padding`: CSS properties are used to generate\
    \ space around an element's content, inside of any defined borders. (top, right,\
    \ bottom, and left)  \n1. `padding-top`  \n2. `padding-right`  \n3. `padding-bottom`\
    \  \n4. `padding-left`\n\n```\n<style>.box{border:1px solid #cccccc;width:300px;border-radius:8px;padding:15px\
    \ 15px 15px 15px;}</style><div class =\"box\" >Love is patient, love is kind.\
    \ It does not envy, it does not boast, it is not proud. It is not rude, it is\
    \ not self-seeking, it is not easily angered, it keeps no record of wrongs. Love\
    \ does not delight in evil but rejoices with the truth. It always protects, always\
    \ trusts, always hopes, always perseveres.</div>\n```\n\n10. defines the space\
    \ between two inline elements, inside of the `div`'s box.![](Image00013.jpg)`line-height`:\
    \ CSS property defines the space between two inline elements.  \n`<br>`: html\
    \ tag break a new line.\n\n```\n<style>.box{border:1px solid #cccccc;width:300px;border-radius:8px;padding:15px\
    \ 15px 15px 15px;line-height:40px;}</style><div class =\"box\" >Love never fails.<br>Love\
    \ is patient<br>love is kind<br>It always hopes</div>\n```\n\n11. insert image\
    \ to the `div`'s box.![](Image00014.jpg)`<img>`: tag defines an image in an HTML\
    \ page. `src =\"shirt.jpg\"` image path.\n\n```\n<style>.box{border:1px solid\
    \ #cccccc;width:250px;border-radius:8px;padding:15px 15px 15px 15px;}</style><div\
    \ class =\"box\" ><img src =\"shirt.jpg\" /></div>\n```\n\n12. insert text below\
    \ image to the `div`'s box.![](Image00015.jpg)![](Image00016.jpg)`#id`: CSS to\
    \ select an element with a specific id\n\n```\n<style>.box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
    \ 15px 15px 15px;}#imgBox{width:100%;}#textBox{text-align:center;width:100%;line-height:30px;}</style><div\
    \ class =\"box\" ><div id =\"imgBox\" ><img src =\"shirt.jpg\" /></div><div id\
    \ =\"textBox\" >Life can be love t-shirt.</div></div>\n```\n\n13. Text wraps around\
    \ the image.![](Image00017.jpg)`float`: CSS property specifies how an element\
    \ should float. (left, right, clear)  \n`.box img`: Descendant selector the CSS\
    \ style will be used in child element.  \n`font-family`: \"Times New Roman\",\
    \ Times, serif;\n\n```\n<style>.box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
    \ 15px 15px 15px;font-size:16px;font-family: \"Times New Roman\", Times, serif;}.box\
    \ img{width:80px;float:left;}</style><div class =\"box\" ><img src =\"shirt.jpg\"\
    \ />Love is patient, love is kind. It does not envy, it does not boast, it is\
    \ not proud. It is not rude, it is not self-seeking, it is not easily angered,\
    \ it keeps no record of wrongs. Love does not delight in evil but rejoices with\
    \ the truth. It always protects, always trusts, always hopes, always perseveres.</div>\n\
