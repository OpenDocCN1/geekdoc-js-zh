    document.write(\"<br>\");\ndocument.write(1 != 2); // true\n</script> |\n```\n\
    \n## If 条件语句\n\n`if` 语句的三种形式：\n1. `if (expression) { statement }`\n2. `if (expression)\
    \ { statement } else { statement }`\n3. `if (expression) { statement } else if\
    \ { statement }`\n\n1. 创建一个 `If.html` 文件，用记事本编辑并在浏览器中打开。分数示例：\n   - 如果 `score\
    \ == 5`：Excellent\n   - 否则如果 `score == 4`：Good\n   - 否则：Need to catch up\n\n![](img/Image00045.jpg)\
    \ ![](img/Image00046.jpg) ![](img/Image00047.jpg)\n\n```\n| Please input your\
    \ score:<br>\n<input type=\"text\" id=\"score\" value=\"\" />\n<input type=\"\
    button\" value=\"Submit\" onClick=\"doSubmit()\" /><br>\n<span id=\"message\"\
    ></span>\n<script type=\"text/javascript\">\nfunction doSubmit(){\n    var scoreObj\
    \ = document.getElementById(\"score\");\n    var messageObj = document.getElementById(\"\
    message\");\n    var score = parseInt(scoreObj.value);\n    if (score == 5) {\n\
    \        messageObj.innerHTML = \"Excellent\";\n    } else if (score == 4) {\n\
    \        messageObj.innerHTML = \"Good\";\n    } else {\n        messageObj.innerHTML\
    \ = \"Need to catch up\";\n    }\n}\n</script> |\n```\n\n## 逻辑运算符\n\n1. 创建一个 `LogicOperator.html`\
    \ 文件，用记事本编辑并在浏览器中打开。逻辑运算符：与 `&&`、或 `||`、非 `!`。\n   - `&&`：两边都为 `true` 时返回 `true`，否则\
    \ `false`。\n   - `||`：两边都为 `false` 时返回 `false`，否则 `true`。\n   - `!`：如果为 `true`\
    \ 则返回 `false`，否则返回 `true`。\n\n```\n| <script type=\"text/javascript\">\ndocument.write(true\
    \ && false); // false\ndocument.write(\"<br>\");\ndocument.write(false && true);\
    \ // false\ndocument.write(\"<br>\");\ndocument.write(false && false); // false\n\
    document.write(\"<br>\");\ndocument.write(true && true); // true\ndocument.write(\"\
    <br>\");\ndocument.write(true || false); // true\ndocument.write(\"<br>\");\n\
    document.write(false || true); // true\ndocument.write(\"<br>\");\ndocument.write(true\
    \ || true); // true\ndocument.write(\"<br>\");\ndocument.write(false || false);\
    \ // false\ndocument.write(\"<br>\");\ndocument.write(!true); // false\ndocument.write(\"\
    <br>\");\ndocument.write(!false); // true\ndocument.write(\"<br>\");\n</script>\
    \ |\n```\n\n2. 创建 `LogicOperator2.html`。\n\n```\n| <script type=\"text/javascript\"\
    >\ndocument.write(1 > 2 && 3 > 4) // = false\ndocument.write(2 > 1 && 3 > 4) //\
    \ = false\ndocument.write(\"--------------\")\ndocument.write(2 > 1 || 3 > 4)\
    \ // = true\ndocument.write(2 > 1 || 3 > 4) // = true\ndocument.write(1 > 2 ||\
    \ 3 > 4) // = false\n</script> |\n```\n\n3. 工资税示例：税额 = 工资 * 税率。等级：\n   - 500 –\
