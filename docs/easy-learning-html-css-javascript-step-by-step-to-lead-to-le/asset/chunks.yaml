- fmt: "\n# Canvas Ball Bounce\n\n## 1. Draw a circle on the canvas\n\ncenter = (100,\
    \ 100), r = 50 from 0 to 2*PI.\n\n![](Image00084.jpg)\n\nCreate a `ball.html`\
    \ file with Notepad and open it in your browser.\n\n`context.arc(x, y, r, sAngle,\
    \ eAngle)`: Rotate 360 degrees counterclockwise with `x`, `y` as the center and\
    \ `r` as the radius.\n\n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position:\
    \ absolute;}</style>\n<canvas id =\"myCanvas\" width =\"200\" height =\"200\"\
    \ ></canvas>\n<script type =\"text/javascript\" >\nvar canvas = document.getElementById(\
    \ \"myCanvas\" );\nvar context = canvas.getContext( \"2d\" );\ncontext.fillStyle\
    \ = \"#0000ff\" ;\ncontext.beginPath();\ncontext.arc( 100 , 100 , 50 , 0 , 2 *\
    \ Math.PI);\ncontext.fill();\n</script>\n```\n\n## 2. Create a function `drawBall(x,\
    \ y, r, color)` to draw 3 circles on the canvas\n\n![](Image00085.jpg)\n\n```html\n\
    <style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style>\n<canvas\
    \ id =\"myCanvas\" width =\"400\" height =\"200\" ></canvas>\n<script type =\"\
    text/javascript\" >\nvar canvas = document.getElementById( \"myCanvas\" );\nvar\
    \ context = canvas.getContext( \"2d\" );\nfunction drawBall( x, y, r, color){\n\
    \    context.fillStyle = color;\n    context.beginPath();\n    context.arc( x,\
    \ y, r, 0 , 2 * Math.PI);\n    context.fill();\n}\ndrawBall( 50 , 50 , 30 , \"\
    #ff0000\" );\ndrawBall( 120 , 50 , 30 , \"#00ff00\" );\ndrawBall( 190 , 50 , 30\
    \ , \"#0000ff\" );\n</script>\n```\n\n## 3. Create a class `Ball` and then create\
    \ a method `draw()` to draw 3 circles on the canvas\n\n![](Image00085.jpg)\n\n\
    ```html\n<style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style>\n\
    <canvas id =\"myCanvas\" width =\"400\" height =\"200\" ></canvas>\n<script type\
    \ =\"text/javascript\" >\nvar canvas = document.getElementById( \"myCanvas\" );\n\
    var context = canvas.getContext( \"2d\" );\nclass Ball{\n    constructor( x, y,\
    \ r, color){\n        this.x = x;\n        this.y = y;\n        this.r = r;\n\
    \        this.color = color;\n    }\n    draw(){\n        context.fillStyle =\
    \ this.color;\n        context.beginPath();\n        context.arc( this.x, this.y,\
    \ this.r, 0 , 2 * Math.PI);\n        context.fill();\n    }\n}\n//new Ball the\
    \ constructor method will be called automatically\nvar redBall = new Ball( 50\
    \ , 50 , 30 , \"#ff0000\" );\nredBall.draw();\nvar greenBall = new Ball( 120 ,\
    \ 50 , 30 , \"#00ff00\" );\ngreenBall.draw();\nvar blueBall = new Ball( 190 ,\
    \ 50 , 30 , \"#0000ff\" );\nblueBall.draw();\n</script>\n```\n\n## 4. Create a\
    \ `Ball` and then move down\n\n![](Image00086.jpg)\n\n```html\n<style>#myCanvas{border:1px\
    \ solid #c3c3c3;position: absolute;}</style>\n<canvas id =\"myCanvas\" width =\"\
    200\" height =\"250\" ></canvas>\n<script type =\"text/javascript\" >\nvar canvas\
    \ = document.getElementById( \"myCanvas\" );\nvar context = canvas.getContext(\
    \ \"2d\" );\nclass Ball{\n    constructor( x, y, r, color){\n        this.x =\
    \ x;\n        this.y = y;\n        this.r = r;\n        this.color = color;\n\
    \    }\n    draw(){\n        context.fillStyle = this.color;\n        context.beginPath();\n\
    \        context.arc( this.x, this.y, this.r, 0 , 2 * Math.PI);\n        context.fill();\n\
    \    }\n    move( distance){\n        this.y = this.y + distance;\n    }\n}\n\
    var ball = new Ball( 100 , 50 , 30 , \"#0000ff\" );\nball.draw();\nfunction continueRun(){\n\
    \    context.clearRect( 0 , 0 , 200 , 250 ); //clear canvas\n    ball.move( 10\
    \ );\n    ball.draw();\n}\n//Run every 200 milliseconds\nvar time = setInterval(\
    \ \"continueRun()\" , 200 );\n</script>\n```\n\n## 5. Ball Bounce Upwards and\
    \ Downwards\n\n![](Image00087.jpg)\n\n```html\n<style>#myCanvas{border:1px solid\
    \ #c3c3c3;position: absolute;}</style>\n<canvas id =\"myCanvas\" width =\"200\"\
    \ height =\"250\" ></canvas>\n<script type =\"text/javascript\" >\nvar canvas\
    \ = document.getElementById( \"myCanvas\" );\nvar context = canvas.getContext(\
    \ \"2d\" );\nvar canvasWidth= 200 ;\nvar canvasHeight= 250 ;\nclass Ball{\n  \
    \  constructor( x, y, r, color){\n        this.x = x;\n        this.y = y;\n \
    \       this.r = r;\n        this.color = color;\n    }\n    draw(){\n       \
    \ context.fillStyle = this.color;\n        context.beginPath();\n        context.arc(\
    \ this.x, this.y, this.r, 0 , 2 * Math.PI);\n        context.fill();\n    }\n\
    \    move( distance){\n        this.y = this.y + distance;\n    }\n    getY(){\n\
    \        return this.y;\n    }\n    getR(){\n        return this.r;\n    }\n}\n\
    var ball = new Ball( 100 , 50 , 30 , \"#0000ff\" );\nball.draw();\nvar direction\
    \ = \"down\" ;\nfunction continueRun(){\n    context.clearRect( 0 , 0 , canvasWidth,\
    \ canvasHeight);\n    if ( ball.getY()+ ball.getR() < canvasHeight && direction\
    \ == \"down\" ){\n        ball.move( 10 );\n        ball.draw();\n    } else {\n\
    \        direction = \"up\"\n    }\n    if ( ball.getY()- ball.getR() > 0 && direction\
    \ == \"up\" ){\n        ball.move(- 10 );\n        ball.draw();\n    } else {\n\
    \        direction = \"down\"\n    }\n}\n//Run every 200 milliseconds\nvar time\
    \ = setInterval( \"continueRun()\" , 200 );\n</script>\n```\n\n# Create Class\n\
    \nAlmost everything is an object, with its properties and methods. Class is like\
    \ an object constructor for creating objects.\n\nIn the game, planes, bullets,\
    \ bombs, and enemy planes are called class `Sprite`.\n\n![](Image00088.jpg)\n\n\
    1. Create a `class.html` file with Notepad and open it in your browser.\n\nConstruction\
    \ method name must be `constructor`. `constructor`: when create object will be\
    \ called automatically.\n\n```html\n<script type =\"text/javascript\" >\n// defining\
    \ a Sprite class\nclass Sprite{\n    //constructor method\n    constructor( name,\
    \ color){\n        this.name = name;\n        this.color = color;\n    }\n   \
    \ // defining method, this: is current object\n    draw(){\n        var text =\
    \ this.color + \" \" + this.name+ \"&nbsp;&nbsp;is drawn on canvas\" ;\n     \
    \   document.write( text+ \"<br>\" );\n    }\n}\n//create the object constructor\
    \ will be called automatically\nblueSprite = new Sprite( \"Airplane\" , \"Blue\"\
    \ );\n//Use sprite access properties and methods\nblueSprite.draw();\nredSprite\
    \ = new Sprite( \"Bullet\" , \"Blue\" );\nredSprite.draw();\n</script>\n```\n\n\
    Result:\n\nBlue Airplane&nbsp;&nbsp;is drawn on canvas\n\nBlue Bullet&nbsp;&nbsp;is\
    \ drawn on canvas\n\n# Inheritance\n\nAll Class `EnemyPlane`, `BluePane`, `RedPlane`,\
    \ `Bullet` inherit from `Sprite`.\n\n1. `Sprite` is called Parent Class\n2. `EnemyPlane`,\
    \ `BluePane`, `RedPlane`, `Bullet` are called Child Class\n3. Child Class can\
    \ call the properties and method from Parent Class\n\n![](Image00089.jpg)\n\n\
    1. Create a `Inheritance.html` file with Notepad and open it in your browser.\n\
    \n```html\n<script type =\"text/javascript\" >\nclass Sprite{\n    constructor(\
    \ name, color){\n        this.name = name;\n        this.color = color;\n    }\n\
    \    draw(){\n        var text = this.color + \" \" + this.name+ \"&nbsp;&nbsp;is\
    \ drawn on canvas\" ;\n        document.write( text+ \"<br>\" );\n    }\n}\n//BluePlane\
    \ is Child, extends is inherit, Sprite is Parent\nclass BluePlane extends Sprite{}\n\
    class RedPlane extends Sprite{}\nclass Bullet extends Sprite{}\nblueSprite = new\
    \ Sprite( \"Airplane\" , \"Blue\" );\nblueSprite.draw();\nredSprite = new Sprite(\
    \ \"Bullet\" , \"Blue\" );\nredSprite.draw();\nredBullet= new Bullet( \"Bullet\"\
    \ , \"Red\" ) &nbsp;&nbsp;&nbsp;&nbsp;redBullet.draw()\n</script>\n```\n\nResult:\n\
    \nBlue Airplane&nbsp;&nbsp;is drawn on canvas\n\nRed Airplane&nbsp;&nbsp;is drawn\
    \ on canvas\n\nRed Bullet&nbsp;&nbsp;is drawn on canvas\n\n# Override\n\nOverride:\
    \ the child class overrides the method of the parent class, the instance of the\
    \ child class will call the overridden method.\n\n`Sprite` can fire bullet, but\
    \ `BluePlane` can fire blue bullet and `RedPlane` can fire red bullet.\n\n![](Image00090.jpg)\n\
    \n```html\n<script type =\"text/javascript\" >\nclass Sprite{\n    shoot(){\n\
    \        document.write( \"fire bullet <br>\" );\n    }\n}\n// BluePlane Inherit\
    \ Sprite\nclass BluePlane extends Sprite{\n    shoot(){\n        document.write(\
    \ \"BluePlane fire blue bullet <br>\" );\n    }\n}\n// RedPlane Inherit Sprite\n\
    class RedPlane extends Sprite{\n    shoot(){\n        document.write( \"RedPlane\
    \ fire red bullet <br>\" );\n    }\n}\nbluePlane = new BluePlane()\nbluePlane.shoot();\n\
    redPlane = new RedPlane()\nredPlane.shoot();\n</script>\n```\n"
