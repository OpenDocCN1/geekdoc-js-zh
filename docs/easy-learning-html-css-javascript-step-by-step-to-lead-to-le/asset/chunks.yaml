  trans: "\n\n```html\n<style>#login{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
    \ 15px 15px 15px;font-size:16px;font-family: \"Times New Roman\", Times, serif;}#login\
    \ div{line-height:30px;width:100%;}.textbox{width:160px;}#buttonDiv{text-align:center;}#buttonDiv\
    \ input{border:1px solid #cccccc;background-color:#ffffff;}</style><div id =\"\
    login\" ><div> 用户名：<input class =\"textbox\" type =\"text\" id =\"username\" /></div><div>\
    \ 密码：<input class =\"textbox\" type =\"password\" id =\"username\" /></div><div\
    \ id =\"buttonDiv\" ><input type =\"button\" value =\"登录\" /><input type =\"button\"\
    \ value =\"关闭\" /></div></div>\n```\n\n# JavaScript HelloWorld\n\nJavaScript 是一种用于网页开发的动态交互式语言。\n\
    \n1. 用记事本创建一个 `helloworld.html` 文件，并在浏览器中打开以查看网页\n   - `<html>`：标签告诉浏览器这是一个 HTML\
    \ 文档。\n   - `<head>`：标签是内容和字符集元数据的容器。\n   - `<title>`：标签定义文档的标题。\n   - `<body>`：标签定义文档的主体。\n\
    \   - `<script>`：标签用于定义客户端脚本（JavaScript）。\n   - `document.write()`：向浏览器文档写入 HTML\
    \ 内容。\n\n```html\n<html><head><meta http-equiv =\"Content-Type\" content =\"text/html;\
    \ charset=UTF-8\" ><title> 第一个网页 </title></head><body><script type =\"text/javascript\"\
    \ >document.write( \"HelloWorld\" );</script></body></html>\n```\n\n结果：![](img/Image00025.jpg)\n\
    \n# 变量\n\n![](img/Image00026.jpg)\n\n1. 创建一个文件：`Variable.html` 并在浏览器中打开\n   -\
    \ `//`：单行注释不会被 JavaScript 执行\n   - `\"\"`：字符串类型\n\n```javascript\n<script type\
    \ =\"text/javascript\" >var basket = \"Apple\" ;document.write( basket);</script>\n\
    ```\n\n结果：![](img/Image00027.jpg)\n\n2. 修改文件：`Variable.html`，将 \"apple\" 替换为 \"\
    orange\"。![](img/Image00028.jpg)\n   - `<br>`：HTML 标签，换行\n\n```javascript\n<script\
    \ type =\"text/javascript\" >var basket = \"Apple\" ;document.write( basket);document.write(\
    \ \"<br>\" );basket = \"Orange\" ;document.write( basket);</script>\n```\n\n运行结果：![](img/Image00029.jpg)\n\
    \n# 变量与类型\n\nJavaScript 是动态类型语言\n\n1. 用记事本创建一个 `var.html` 文件，并在浏览器中打开以查看网页\n \
    \  - `typeof()`：查找 JavaScript 变量的类型\n\n```javascript\n<script type =\"text/javascript\"\
    \ >var x;           //undefinedvar a= 9 ;         //numbervar b= 1.5 ;       //numbervar\
    \ c= true ;      //Booleanvar d= \"abc\" ;     //stringvar e= 'abc' ;     //stringdocument.write(\
    \ typeof ( x) + \"<br>\" );document.write( typeof ( a) + \"<br>\" );document.write(\
    \ typeof ( b) + \"<br>\" );document.write( typeof ( c) + \"<br>\" );document.write(\
    \ typeof ( d) + \"<br>\" );document.write( typeof ( e) + \"<br>\" );</script>\n\
    ```\n\n结果：\n```\nundefined\nnumber\nnumber\nboolean\nstring\nstring\n```\n\n#\
    \ 算术运算符\n\n1. 用记事本创建一个 `ArithmeticOperator.html` 文件，并在浏览器中打开\n   - 算术运算符：加 `+`、减\
    \ `-`、乘 `*`、除 `/`、取模 `%`\n   ![](img/Image00030.jpg)\n\n```javascript\n<script\
    \ type =\"text/javascript\" >var a = 1 ;var b = 2 ;var c = 3 ;var d = 4 ;document.write(\
    \ a + b); // = 3document.write( \"<br>\" );document.write( a - b); // = -1document.write(\
    \ \"<br>\" );document.write( a * b); // = 2document.write( \"<br>\" );document.write(\
    \ b / a); // = 2document.write( \"<br>\" );document.write( c % b); // = 1 //除法后的余数\
    \ document.write( \"<br>\" );</script>\n```\n\n# 函数\n\n![](img/Image00031.jpg)\
    \ ![](img/Image00032.jpg) ![](img/Image00033.jpg)\n\n1. 创建一个文件：`Function.html`\n\
    \n```javascript\n<script type =\"text/javascript\" >function add( a, b){return\
    \ a + b;}var result = add( 4 , 2 );document.write( result); // 6document.write(\
    \ \"<br>\" );var result = add( 5 , 3 );document.write( result)   // 8</script>\n\
    ```\n\n运行结果：\n```\n6\n8\n```\n\n2. 在 `Function.html` 中添加关于 `-`、`*`、`/` 的 3 个函数\n\
    \n```javascript\n<script type =\"text/javascript\" >function add( a, b){return\
    \ a + b;}function sub( a, b){return a - b;}function multiply( a, b){return a *\
    \ b;}function divide( a, b){return a / b;}var result = add( 4 , 2 );document.write(\
    \ result); // 6document.write( \"<br>\" );var result = sub( 4 , 2 );document.write(\
    \ result)   // 2document.write( \"<br>\" );var result = multiply( 4 , 2 );document.write(\
    \ result)   // 8document.write( \"<br>\" );var result = divide( 4 , 2 );document.write(\
    \ result)   // 2</script>\n```\n\n# 类\n\n![](img/Image00034.jpg)\n\n1. 创建一个文件：`Caculator.html`\n\
    \n```javascript\n<script type =\"text/javascript\" >function Caculator(){this.add=\
    \ function ( a, b){return a + b;}this.sub= function ( a, b){return a - b;}this.multiply=\
    \ function ( a, b){return a * b;}this.divide= function ( a, b){return a / b;}}var\
    \ cal = new Caculator();var result = cal.add( 4 , 2 );document.write( result);\
    \ // 6var result = cal.sub( 4 , 2 );document.write( result)   // 2var result =\
    \ cal.multiply( 4 , 2 );document.write( result)   // 8var result = cal.divide(\
    \ 4 , 2 );document.write( result)   // 2</script>\n```\n\n# 类型转换\n\n1. 创建一个 `TypeConversion.html`\n\
    \   - `parseInt()`：这是 JavaScript 的默认函数，可以将字符串转换为整数。\n\n```javascript\n<script\
    \ type =\"text/javascript\" >var a= \"1\" ;        var b= \"2\" ;    var result\
    \ = a + b; // + 连接两个字符串 document.write( result); // = 12document.write( \"<br>\"\
    \ );result = parseInt( a) + parseInt( b);document.write( result); // = 3</script>\n\
    ```\n\n结果：\n```\n12\n3\n```\n\n# DOM\n\nDOM：在 JavaScript 中，每个 HTML 元素都是一个类对象。\n\
    文档对象模型结构图：![](img/Image00035.jpg)\n\n1. 创建一个文件：`getElementById.html`\n   - `document.getElementById()`：是一种\
    \ DOM 方法，通过 ID 属性获取元素。\n   - `alert()`：是一个函数，用于打开信息窗口。\n   - `Obj.innerHTML`：设置或返回元素的内部\
    \ HTML 内容。\n   - `<div>`：标签定义 HTML 文档中的一个分区或节。\n\n```html\n<div id =\"word\" >\
    \ 信念与希望 </div><script type =\"text/javascript\" >var divObj = document.getElementById(\
    \ \"word\" );var htmlContent = divObj.innerHTML;alert( htmlContent);</script>\n\
