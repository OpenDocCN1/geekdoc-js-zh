  \n\n\n\n# JavaScript 示例文档\n\n## 基本运算器\n\n以下是一个简单的加减乘除运算器 HTML 代码：\n\n```\n| a: <input\
  \ type=\"text\" id=\"a\" value=\"\" /> b: <input type=\"text\" id=\"b\" value=\"\
  \" /> = <span id=\"result\"></span><br>\n<input type=\"button\" value=\"+\" onClick=\"\
  doAdd()\" />\n<input type=\"button\" value=\"-\" onClick=\"doSub()\" />\n<input\
  \ type=\"button\" value=\"*\" onClick=\"doMultiply()\" />\n<input type=\"button\"\
  \ value=\"/\" onClick=\"doDivide()\" />\n<script type=\"text/javascript\">\nfunction\
  \ doAdd(){\n    var aObj = document.getElementById(\"a\");\n    var bObj = document.getElementById(\"\
  b\");\n    var resultObj = document.getElementById(\"result\");\n    var a = parseInt(aObj.value);\
  \ // Convert string to integer\n    var b = parseInt(bObj.value);\n    resultObj.innerHTML\
  \ = a + b;\n}\nfunction doSub(){\n    var aObj = document.getElementById(\"a\");\n\
  \    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
  result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
  \    resultObj.innerHTML = a - b;\n}\nfunction doMultiply(){\n    var aObj = document.getElementById(\"\
  a\");\n    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
  result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
  \    resultObj.innerHTML = a * b;\n}\nfunction doDivide(){\n    var aObj = document.getElementById(\"\
  a\");\n    var bObj = document.getElementById(\"b\");\n    var resultObj = document.getElementById(\"\
  result\");\n    var a = parseInt(aObj.value);\n    var b = parseInt(bObj.value);\n\
  \    resultObj.innerHTML = a / b;\n}\n</script> |\n```\n\n点击不同按钮的结果如下：\n\n- 点击 +\
  \ 按钮结果：![](img/Image00040.jpg)\n- 点击 - 按钮结果：![](img/Image00041.jpg)\n- 点击 * 按钮结果：![](img/Image00042.jpg)\n\
  - 点击 / 按钮结果：![](img/Image00043.jpg)\n\n## 赋值运算符\n\n1. 创建一个 `AssignmentOperator.html`\
  \ 文件，用记事本编辑并在浏览器中打开。\n\n```\n| <script type=\"text/javascript\">\nvar d = 4;\ndocument.write(d++);\
  \ // = 4 print d and then increment 1\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(++d);\
  \ // = 5 increment 1 and then print d\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(d--);\
  \ // = 4 print d and then decrement 1\ndocument.write(\"<br>\");\nd = 4;\ndocument.write(--d);\
  \ // = 3 decrement 1 and then print d\nvar result = 10;\nresult = result + 1;\n\
  document.write(result); // = 11\ndocument.write(\"<br>\");\nresult = 10;\nresult++;\n\
  document.write(result); // = 11\ndocument.write(\"<br>\");\nresult = 10;\nresult\
  \ += 1;\ndocument.write(result);   // = 11\ndocument.write(\"<br>\");\n</script>\
  \ |\n```\n\n2. 创建一个数量加减器 `quantity.html`。点击 `+` 按钮数量增加 1，点击 `-` 按钮数量减少 1。\n\n![](img/Image00044.jpg)\n\
  \n```\n| Quantity:<br>\n<input type=\"text\" style=\"width:30px\" id=\"quantity\"\
  \ value=\"1\" />\n<input type=\"button\" value=\"+\" onClick=\"doAdd()\" />\n<input\
  \ type=\"button\" value=\"-\" onClick=\"doSub()\" />\n<script type=\"text/javascript\"\
  >\nfunction doAdd(){\n    var quantityObj = document.getElementById(\"quantity\"\
  );\n    var value = parseInt(quantityObj.value);\n    value++;\n    quantityObj.value\
  \ = value;\n}\nfunction doSub(){\n    var quantityObj = document.getElementById(\"\
  quantity\");\n    var value = parseInt(quantityObj.value);\n    value--;\n    quantityObj.value\
  \ = value;\n}\n</script> |\n```\n\n## 关系运算符\n\n1. 创建一个 `RelationalOperator.html`\
  \ 文件，用记事本编辑并在浏览器中打开。关系运算符的结果只有两个值：`true` 和 `false`。\n\n```\n| <script type=\"text/javascript\"\
  >\ndocument.write(1 > 2); // false\ndocument.write(\"<br>\");\ndocument.write(1\
  \ >= 1); // true\ndocument.write(\"<br>\");\ndocument.write(1 < 2); // true\ndocument.write(\"\
  <br>\");\ndocument.write(1 <= 2); // true\ndocument.write(\"<br>\");\ndocument.write(1\
  \ == 1); // true\ndocument.write(\"<br>\");\ndocument.write(1 != 2); // true\n</script>\
  \ |\n```\n\n## If 条件语句\n\n`if` 语句的三种形式：\n1. `if (expression) { statement }`\n2.\
  \ `if (expression) { statement } else { statement }`\n3. `if (expression) { statement\
  \ } else if { statement }`\n\n1. 创建一个 `If.html` 文件，用记事本编辑并在浏览器中打开。分数示例：\n   - 如果\
  \ `score == 5`：Excellent\n   - 否则如果 `score == 4`：Good\n   - 否则：Need to catch up\n\
  \n![](img/Image00045.jpg) ![](img/Image00046.jpg) ![](img/Image00047.jpg)\n\n```\n\
  | Please input your score:<br>\n<input type=\"text\" id=\"score\" value=\"\" />\n\
  <input type=\"button\" value=\"Submit\" onClick=\"doSubmit()\" /><br>\n<span id=\"\
  message\"></span>\n<script type=\"text/javascript\">\nfunction doSubmit(){\n   \
  \ var scoreObj = document.getElementById(\"score\");\n    var messageObj = document.getElementById(\"\
  message\");\n    var score = parseInt(scoreObj.value);\n    if (score == 5) {\n\
  \        messageObj.innerHTML = \"Excellent\";\n    } else if (score == 4) {\n \
  \       messageObj.innerHTML = \"Good\";\n    } else {\n        messageObj.innerHTML\
  \ = \"Need to catch up\";\n    }\n}\n</script> |\n```\n\n## 逻辑运算符\n\n1. 创建一个 `LogicOperator.html`\
  \ 文件，用记事本编辑并在浏览器中打开。逻辑运算符：与 `&&`、或 `||`、非 `!`。\n   - `&&`：两边都为 `true` 时返回 `true`，否则\
  \ `false`。\n   - `||`：两边都为 `false` 时返回 `false`，否则 `true`。\n   - `!`：如果为 `true` 则返回\
  \ `false`，否则返回 `true`。\n\n```\n| <script type=\"text/javascript\">\ndocument.write(true\
  \ && false); // false\ndocument.write(\"<br>\");\ndocument.write(false && true);\
  \ // false\ndocument.write(\"<br>\");\ndocument.write(false && false); // false\n\
  document.write(\"<br>\");\ndocument.write(true && true); // true\ndocument.write(\"\
  <br>\");\ndocument.write(true || false); // true\ndocument.write(\"<br>\");\ndocument.write(false\
  \ || true); // true\ndocument.write(\"<br>\");\ndocument.write(true || true); //\
  \ true\ndocument.write(\"<br>\");\ndocument.write(false || false); // false\ndocument.write(\"\
  <br>\");\ndocument.write(!true); // false\ndocument.write(\"<br>\");\ndocument.write(!false);\
  \ // true\ndocument.write(\"<br>\");\n</script> |\n```\n\n2. 创建 `LogicOperator2.html`。\n\
  \n```\n| <script type=\"text/javascript\">\ndocument.write(1 > 2 && 3 > 4) // =\
  \ false\ndocument.write(2 > 1 && 3 > 4) // = false\ndocument.write(\"--------------\"\
  )\ndocument.write(2 > 1 || 3 > 4) // = true\ndocument.write(2 > 1 || 3 > 4) // =\
  \ true\ndocument.write(1 > 2 || 3 > 4) // = false\n</script> |\n```\n\n3. 工资税示例：税额\
