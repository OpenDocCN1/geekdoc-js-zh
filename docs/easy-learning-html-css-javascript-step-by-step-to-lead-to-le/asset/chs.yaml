  \n1. 修改 `ElementHierarchy.html` 以获取所有子节点。\n\n`obj.childNodes`：获取当前节点的所有子节点\n\n`obj.nodeName`：获取节点的名称\n\
  \n`obj.nodeType`：获取节点的类型\n\n`obj.innerHTML`：获取节点的 HTML 内容\n\n![](img/Image00065.jpg)\n\
  \n`<b>`：标签指定粗体文本。\n\n`<a>`：标签定义超链接，用于从一个页面链接到另一个页面。\n\n```\n<body><div id =\"div\"\
