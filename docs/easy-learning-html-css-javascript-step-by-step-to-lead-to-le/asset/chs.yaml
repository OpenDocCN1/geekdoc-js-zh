  \   - 其他：Pay by face to face\n\n```\n| <script type=\"text/javascript\">\nvar num\
  \ = 1;\nswitch (num) {\n    case 1:\n        document.write(\"Pay by Visa Card\"\
  );\n        break; // terminate the code to continue execution\n    case 2:\n  \
  \      document.write(\"Pay by Master Card\");\n        break;\n    case 3:\n  \
  \      document.write(\"Pay by Paypal\");\n        break;\n    default:\n      \
