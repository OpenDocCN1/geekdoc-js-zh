- "# HTML CSS JavaScript 轻松学习：循序渐进快速学习指南\n\n\n\n# 第一个网页\n\nHTML 是网页上用于格式化显示的一系列标签。\n\
  \n1. 使用记事本或其他编辑器创建一个 `FirstWebPage.html` 文件，并在浏览器中打开它以查看网页\n\n![](img/Image00003.jpg)\n\
  \n`<html>`: 标签告诉浏览器这是一个 HTML 文档。  \n`<title>`: 标签定义文档的标题。  \n`<body>`: 标签定义文档的主体。\n\
  \n```\n<! DOCTYPE HTML>\n<html>\n<head>\n<title> First Web Page </title>\n</head>\n\
  <body>\nA good start is half successful\n</body>\n</html>\n```\n\n## `<div>` CSS\
  \ 盒子\n\n1. 创建一个 `Box.html` 文件，并在浏览器中打开它以查看网页\n\n![](img/Image00004.jpg)\n\n`<div>`:\
  \ HTML 标签定义 HTML 文档中的一个分区或节。  \n`<style>`: 设置 HTML 元素的样式。  \n`.class 选择器`: CSS 选择具有特定\
  \ class 属性的元素。  \n`border`: CSS 属性允许你指定元素边框的样式、宽度和颜色。  \n`Color`: (红色:#ff0000 ,\
  \ 绿色:#00ff00 , 蓝色:#0000ff , 灰色:#cccccc )  \n`text-align`: CSS 属性指定文本的水平对齐方式（左、中、右）\n\
  \n```\n<! DOCTYPE HTML>\n<html>\n<head>\n<title> Border </title>\n<style>\n.box{\n\
  border:1px solid #cccccc;\nwidth:300px;\nheight:150px;\ntext-align:center;\n}\n\
  </style>\n</head>\n<body>\n<div class =\"box\" >Better Life</div>\n</body>\n</html>\n\
  ```\n\n### 2. 定义 div 圆角的半径。\n\n![](img/Image00005.jpg)\n\n`border-radius`: CSS3\
  \ 属性定义元素圆角的半径。\n\n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:300px;\n\
  height:150px;\ntext-align:center;\nborder-radius:25px;\n}\n</style>\n<div class\
  \ =\"box\" >Better Life</div>\n```\n\n### 3. 定义 div 盒子的阴影。\n\n![](img/Image00006.jpg)\n\
  \n`box-shadow`: CSS3 属性为一个元素添加一个或多个阴影。\n\n```\n<style>\n.box{\nborder:1px solid\
  \ #cccccc;\nwidth:200px;\nheight:200px;\ntext-align:center;\nborder-radius:25px;\n\
  box-shadow: 0px 0px 5px #888888;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n\
  ```\n\n### 4. 定义 div 盒子的阴影。\n\n![](img/Image00007.jpg)\n\n`box-shadow`: CSS3 属性为一个元素添加一个或多个阴影。\
  \  \n`h-offset`: 阴影的水平偏移量。  \n`v-offset`: 阴影的垂直偏移量。\n\n```\n<style>\n.box{\nborder:1px\
  \ solid #cccccc;\nwidth:200px;\nheight:200px;\ntext-align:center;\nborder-radius:25px;\n\
  box-shadow: 10px 10px 5px #888888;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n\
  ```\n\n### 5. 定义 div 盒子的背景颜色。\n\n![](img/Image00008.jpg)\n\n`background-color`:\
  \ CSS 属性定义背景颜色。  \n`font-size:24px;` CSS 属性定义字体大小。  \n`color:#ffffff;` CSS 属性定义字体颜色。\n\
  \n```\n<style>\n.box{\nborder:1px solid #cccccc;\nwidth:200px;\nheight:200px;\n\
  text-align:center;\nborder-radius:8px;\nbackground-color:#ff0000;\nfont-size:24px;\n\
  color:#ffffff;\n}\n</style>\n<div class =\"box\" >Better Life</div>\n```\n\n###\
  \ 6. 定义 div 盒子的绝对位置。\n\n![](img/Image00009.jpg)\n\n`position:absolute;` 元素相对于其第一个已定位的父元素进行绝对定位。\
  \  \n`top: offset;` CSS 属性定义元素的顶部位置。  \n`left: offset;` CSS 属性定义元素的左侧位置。\n\n```\n\
  <style>\n.redBox{\nborder:1px solid #cccccc;\nwidth:100px;\nheight:100px;\nborder-radius:8px;\n\
  background-color:#ff0000;\nposition:absolute;\ntop:0px;\nleft:0px;\n}\n.greenBox{\n\
  border:1px solid #cccccc;\nwidth:100px;\nheight:100px;\nborder-radius:8px;\nbackground-color:#00ff00;\n\
  position:absolute;\ntop:10px;\nleft:10px;\n}\n.blueBox{\nborder:1px solid #cccccc;\n\
  width:100px;\nheight:100px;\nborder-radius:8px;\nbackground-color:#0000ff;\nposition:absolute;\n\
  top:20px;\nleft:20px;\n}\n</style>\n<div class =\"redBox\" ></div>\n<div class =\"\
  greenBox\" ></div>\n<div class =\"blueBox\" ></div>\n```\n\n### 7. 定义 div 盒子的相对位置。\n\
  \n![](img/Image00010.jpg)\n\n`position:relative;` 元素相对于其正常位置进行定位。\n\n\n\n\n```\n\
  <style>.redBox{border:1px solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#ff0000;position:relative;}.greenBox{border:1px\
  \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#00ff00;position:relative;}.blueBox{border:1px\
  \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#0000ff;position:relative;}</style><div\
  \ class =\"redBox\" ></div><div class =\"greenBox\" ></div><div class =\"blueBox\"\
  \ ></div>\n```\n\n8. 定义元素内容周围的空间，位于 `div` 盒子外部。![](img/Image00011.jpg)`margin`：CSS\
  \ 属性用于在元素周围创建空间，位于任何已定义边框的外部。（上、右、下、左）  \n1. `margin-top`  \n2. `margin-right` \
  \ \n3. `margin-bottom`  \n4. `margin-left`\n\n```\n<style>.redBox{border:1px solid\
  \ #cccccc;width:100px;height:100px;border-radius:8px;background-color:#ff0000;position:relative;}.greenBox{border:1px\
  \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#00ff00;position:relative;}.blueBox{border:1px\
  \ solid #cccccc;width:100px;height:100px;border-radius:8px;background-color:#0000ff;position:relative;}</style><div\
  \ class =\"redBox\" ></div><div class =\"greenBox\" ></div><div class =\"blueBox\"\
  \ ></div>\n```\n\n9. 定义元素内容周围的空间，位于 `div` 盒子内部。![](img/Image00012.jpg)`padding`：CSS\
  \ 属性用于在元素内容周围生成空间，位于任何已定义边框的内部。（上、右、下、左）  \n1. `padding-top`  \n2. `padding-right`\
  \  \n3. `padding-bottom`  \n4. `padding-left`\n\n```\n<style>.box{border:1px solid\
  \ #cccccc;width:300px;border-radius:8px;padding:15px 15px 15px 15px;}</style><div\
  \ class =\"box\" >Love is patient, love is kind. It does not envy, it does not boast,\
  \ it is not proud. It is not rude, it is not self-seeking, it is not easily angered,\
  \ it keeps no record of wrongs. Love does not delight in evil but rejoices with\
  \ the truth. It always protects, always trusts, always hopes, always perseveres.</div>\n\
  ```\n\n10. 定义两个内联元素之间的空间，位于 `div` 盒子内部。![](img/Image00013.jpg)`line-height`：CSS\
  \ 属性定义两个内联元素之间的空间。  \n`<br>`：HTML 标签，用于换行。\n\n```\n<style>.box{border:1px solid\
  \ #cccccc;width:300px;border-radius:8px;padding:15px 15px 15px 15px;line-height:40px;}</style><div\
  \ class =\"box\" >Love never fails.<br>Love is patient<br>love is kind<br>It always\
  \ hopes</div>\n```\n\n11. 向 `div` 盒子中插入图像。![](img/Image00014.jpg)`<img>`：标签用于在 HTML\
  \ 页面中定义图像。`src =\"shirt.jpg\"` 图像路径。\n\n```\n<style>.box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
  \ 15px 15px 15px;}</style><div class =\"box\" ><img src =\"shirt.jpg\" /></div>\n\
  ```\n\n12. 在图像下方插入文本到 `div` 盒子中。![](img/Image00015.jpg)![](img/Image00016.jpg)`#id`：CSS\
  \ 用于选择具有特定 id 的元素。\n\n```\n<style>.box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
  \ 15px 15px 15px;}#imgBox{width:100%;}#textBox{text-align:center;width:100%;line-height:30px;}</style><div\
  \ class =\"box\" ><div id =\"imgBox\" ><img src =\"shirt.jpg\" /></div><div id =\"\
  textBox\" >Life can be love t-shirt.</div></div>\n```\n\n13. 文本环绕图像。![](img/Image00017.jpg)`float`：CSS\
  \ 属性指定元素应该如何浮动。（左、右、清除）  \n`.box img`：后代选择器，CSS 样式将应用于子元素。  \n`font-family`：\"Times\
  \ New Roman\", Times, serif;\n\n```\n<style>.box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
  \ 15px 15px 15px;font-size:16px;font-family: \"Times New Roman\", Times, serif;}.box\
  \ img{width:80px;float:left;}</style><div class =\"box\" ><img src =\"shirt.jpg\"\
  \ />Love is patient, love is kind. It does not envy, it does not boast, it is not\
  \ proud. It is not rude, it is not self-seeking, it is not easily angered, it keeps\
  \ no record of wrongs. Love does not delight in evil but rejoices with the truth.\
  \ It always protects, always trusts, always hopes, always perseveres.</div>\n```\n\
  \n14. 无序列表：以 `<ul>` 标签开始。每个列表项以 `<li>` 标签开始。![](img/Image00018.jpg)\n\n```\n<style>#box{border:1px\
  \ solid #cccccc;width:250px;border-radius:8px;padding:15px 15px 15px 15px;font-size:16px;font-family:\
  \ \"Times New Roman\", Times, serif;}</style><div id =\"box\" ><ul><li> Easy Learning\
  \ HTML CSS </li><li> Easy Learning Javascript </li><li> Easy Learning Python 3 </li></ul></div>\n\
  ```\n\n15. 无序列表：插入图标图像替换黑色圆点。![](img/Image00019.jpg)`list-style-image:url('icon.jpg')`：CSS\
  \ 属性用于指定用作标记的图像。\n\n```\n<style>#box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
  \ 15px 15px 15px;font-size:16px;font-family: \"Times New Roman\", Times, serif;}#box\
  \ ul li{list-style-image:url('icon.jpg');}</style><div id =\"box\" ><ul><li> Easy\
  \ Learning HTML CSS </li><li> Easy Learning Javascript </li><li> Easy Learning Python\
  \ 3 </li></ul></div>\n```\n\n16. 链接状态样式![](img/Image00020.jpg)`text-decoration:\
  \ none`：从文本中移除文本装饰  \n`li a:link`：用于选择未访问的元素  \n`li a:hover`：用于选择鼠标悬停时的元素  \n`li\
  \ a.active`：CSS 伪类。它指定 `<li> <a>` 处于活动状态。\n\n```\n<style>#box{border:1px solid #cccccc;width:250px;border-radius:8px;padding:15px\
  \ 15px 15px 15px;font-size:16px;font-family: \"Times New Roman\", Times, serif;}#box\
  \ ul li a:link{color:#000000;text-decoration: none;}#box ul li a:hover{color:#0000ff;}#box\
  \ ul li a:active{color:#ff0000;}</style><div id =\"box\" ><ul><li><a href =\"#\"\
  \ > Easy Learning HTML CSS </a></li><li><a href =\"#\" > Easy Learning Javascript\
  \ </a></li><li><a href =\"#\" > Easy Learning Python 3 </a></li></ul></div>\n```\n\
  \n17. 下拉菜单![](img/Image00021.jpg)`list-style-type: none`：CSS 属性，移除 `<li>` 中显示的标记\
  \  \n`display: block`：将元素显示为块级元素（如 `<div>`）。它在新行开始。  \n`li a:hover:not(.active)`：用于选择鼠标悬停但非活动状态的元素。\n\
  \n```\n<style>ul {list-style-type: none;margin: 0;padding: 0;width: 300px;background-color:\
  \ #eeeeee;}li a {display: block;color: #000000;padding: 8px 16px;text-decoration:\
  \ none;}li a.active {background-color: #075272;color: white;}li a:hover:not(.active)\
  \ {background-color: #59c9f9;color: white;}</style><ul><li><a class =\"active\"\
  \ href =\"#\" > Books </a></li><li><a href =\"#\" > Easy Learning Javascript </a></li><li><a\
  \ href =\"#\" > Easy Learning Java </a></li><li><a href =\"#\" > Easy Learning Python\
  \ 3 </a></li></ul>\n```\n\n18. 导航菜单![](img/Image00022.jpg)\n\n```\n<style>ul {list-style-type:\
  \ none;margin: 0;padding: 0;overflow: hidden;background-color: #333;position: fixed;top:\
  \ 10;width: 100%;}li {float: left;}li a {display: block;color: white;text-align:\
  \ center;padding: 15px;text-decoration: none;}li a:hover:not(.active) {background-color:\
  \ #fde352;}.active {background-color: #fde352;}</style><ul><li><a class =\"active\"\
  \ href =\"#\" > HTML </a></li><li><a href =\"#\" > CSS </a></li><li><a href =\"\
  #\" > Javascript </a></li><li><a href =\"#\" > Python </a></li></ul>\n```\n\n19.\
  \ 点击下拉菜单![](img/Image00023.jpg)\n\n```\n<style>.menubtn {background-color: #000000;color:\
  \ white;padding: 16px;font-size: 16px;border: none;cursor: pointer;}.menudown {position:\
  \ relative;display: inline-block;float:left;}.menudown-content {display: none;position:\
  \ absolute;right: 0;background-color: #f9f9f9;min-width: 300px;}.menudown-content\
  \ a {color: black;padding: 12px 16px;text-decoration: none;display: block;}.menudown-content\
  \ a:hover {background-color: #f1f1f1}.menudown:hover .menudown-content {display:\
  \ block;}.menudown:hover .menubtn {background-color: #000000;}</style><div class\
  \ =\"menudown\" ><button class =\"menubtn\" > Books </button><div class =\"menudown-content\"\
  \ style =\"left:0;\" ><a href =\"#\" > Easy Learning HTML CSS </a><a href =\"#\"\
  \ > Easy Learning Javascript </a><a href =\"#\" > Easy Learning Java </a></div></div>\n\
  ```\n\n20. 登录 div 对话框。![](img/Image00024.jpg)\n\n\n\n\n```html\n<style>#login{border:1px\
  \ solid #cccccc;width:250px;border-radius:8px;padding:15px 15px 15px 15px;font-size:16px;font-family:\
  \ \"Times New Roman\", Times, serif;}#login div{line-height:30px;width:100%;}.textbox{width:160px;}#buttonDiv{text-align:center;}#buttonDiv\
  \ input{border:1px solid #cccccc;background-color:#ffffff;}</style><div id =\"login\"\
  \ ><div> 用户名：<input class =\"textbox\" type =\"text\" id =\"username\" /></div><div>\
  \ 密码：<input class =\"textbox\" type =\"password\" id =\"username\" /></div><div\
  \ id =\"buttonDiv\" ><input type =\"button\" value =\"登录\" /><input type =\"button\"\
  \ value =\"关闭\" /></div></div>\n```\n\n# JavaScript HelloWorld\n\nJavaScript 是一种用于网页开发的动态交互式语言。\n\
  \n1. 用记事本创建一个 `helloworld.html` 文件，并在浏览器中打开以查看网页\n   - `<html>`：标签告诉浏览器这是一个 HTML\
  \ 文档。\n   - `<head>`：标签是内容和字符集元数据的容器。\n   - `<title>`：标签定义文档的标题。\n   - `<body>`：标签定义文档的主体。\n\
  \   - `<script>`：标签用于定义客户端脚本（JavaScript）。\n   - `document.write()`：向浏览器文档写入 HTML\
  \ 内容。\n\n```html\n<html><head><meta http-equiv =\"Content-Type\" content =\"text/html;\
  \ charset=UTF-8\" ><title> 第一个网页 </title></head><body><script type =\"text/javascript\"\
  \ >document.write( \"HelloWorld\" );</script></body></html>\n```\n\n结果：![](img/Image00025.jpg)\n\
  \n# 变量\n\n![](img/Image00026.jpg)\n\n1. 创建一个文件：`Variable.html` 并在浏览器中打开\n   - `//`：单行注释不会被\
  \ JavaScript 执行\n   - `\"\"`：字符串类型\n\n```javascript\n<script type =\"text/javascript\"\
  \ >var basket = \"Apple\" ;document.write( basket);</script>\n```\n\n结果：![](img/Image00027.jpg)\n\
  \n2. 修改文件：`Variable.html`，将 \"apple\" 替换为 \"orange\"。![](img/Image00028.jpg)\n \
  \  - `<br>`：HTML 标签，换行\n\n```javascript\n<script type =\"text/javascript\" >var\
  \ basket = \"Apple\" ;document.write( basket);document.write( \"<br>\" );basket\
  \ = \"Orange\" ;document.write( basket);</script>\n```\n\n运行结果：![](img/Image00029.jpg)\n\
  \n# 变量与类型\n\nJavaScript 是动态类型语言\n\n1. 用记事本创建一个 `var.html` 文件，并在浏览器中打开以查看网页\n   -\
  \ `typeof()`：查找 JavaScript 变量的类型\n\n```javascript\n<script type =\"text/javascript\"\
  \ >var x;           //undefinedvar a= 9 ;         //numbervar b= 1.5 ;       //numbervar\
  \ c= true ;      //Booleanvar d= \"abc\" ;     //stringvar e= 'abc' ;     //stringdocument.write(\
  \ typeof ( x) + \"<br>\" );document.write( typeof ( a) + \"<br>\" );document.write(\
  \ typeof ( b) + \"<br>\" );document.write( typeof ( c) + \"<br>\" );document.write(\
  \ typeof ( d) + \"<br>\" );document.write( typeof ( e) + \"<br>\" );</script>\n\
  ```\n\n结果：\n```\nundefined\nnumber\nnumber\nboolean\nstring\nstring\n```\n\n# 算术运算符\n\
  \n1. 用记事本创建一个 `ArithmeticOperator.html` 文件，并在浏览器中打开\n   - 算术运算符：加 `+`、减 `-`、乘 `*`、除\
  \ `/`、取模 `%`\n   ![](img/Image00030.jpg)\n\n```javascript\n<script type =\"text/javascript\"\
  \ >var a = 1 ;var b = 2 ;var c = 3 ;var d = 4 ;document.write( a + b); // = 3document.write(\
  \ \"<br>\" );document.write( a - b); // = -1document.write( \"<br>\" );document.write(\
  \ a * b); // = 2document.write( \"<br>\" );document.write( b / a); // = 2document.write(\
  \ \"<br>\" );document.write( c % b); // = 1 //除法后的余数 document.write( \"<br>\" );</script>\n\
  ```\n\n# 函数\n\n![](img/Image00031.jpg) ![](img/Image00032.jpg) ![](img/Image00033.jpg)\n\
  \n1. 创建一个文件：`Function.html`\n\n```javascript\n<script type =\"text/javascript\"\
  \ >function add( a, b){return a + b;}var result = add( 4 , 2 );document.write( result);\
  \ // 6document.write( \"<br>\" );var result = add( 5 , 3 );document.write( result)\
  \   // 8</script>\n```\n\n运行结果：\n```\n6\n8\n```\n\n2. 在 `Function.html` 中添加关于 `-`、`*`、`/`\
  \ 的 3 个函数\n\n```javascript\n<script type =\"text/javascript\" >function add( a,\
  \ b){return a + b;}function sub( a, b){return a - b;}function multiply( a, b){return\
  \ a * b;}function divide( a, b){return a / b;}var result = add( 4 , 2 );document.write(\
  \ result); // 6document.write( \"<br>\" );var result = sub( 4 , 2 );document.write(\
  \ result)   // 2document.write( \"<br>\" );var result = multiply( 4 , 2 );document.write(\
  \ result)   // 8document.write( \"<br>\" );var result = divide( 4 , 2 );document.write(\
  \ result)   // 2</script>\n```\n\n# 类\n\n![](img/Image00034.jpg)\n\n1. 创建一个文件：`Caculator.html`\n\
  \n```javascript\n<script type =\"text/javascript\" >function Caculator(){this.add=\
  \ function ( a, b){return a + b;}this.sub= function ( a, b){return a - b;}this.multiply=\
  \ function ( a, b){return a * b;}this.divide= function ( a, b){return a / b;}}var\
  \ cal = new Caculator();var result = cal.add( 4 , 2 );document.write( result); //\
  \ 6var result = cal.sub( 4 , 2 );document.write( result)   // 2var result = cal.multiply(\
  \ 4 , 2 );document.write( result)   // 8var result = cal.divide( 4 , 2 );document.write(\
  \ result)   // 2</script>\n```\n\n# 类型转换\n\n1. 创建一个 `TypeConversion.html`\n   -\
  \ `parseInt()`：这是 JavaScript 的默认函数，可以将字符串转换为整数。\n\n```javascript\n<script type =\"\
  text/javascript\" >var a= \"1\" ;        var b= \"2\" ;    var result = a + b; //\
  \ + 连接两个字符串 document.write( result); // = 12document.write( \"<br>\" );result =\
  \ parseInt( a) + parseInt( b);document.write( result); // = 3</script>\n```\n\n\
  结果：\n```\n12\n3\n```\n\n# DOM\n\nDOM：在 JavaScript 中，每个 HTML 元素都是一个类对象。\n文档对象模型结构图：![](img/Image00035.jpg)\n\
  \n1. 创建一个文件：`getElementById.html`\n   - `document.getElementById()`：是一种 DOM 方法，通过\
  \ ID 属性获取元素。\n   - `alert()`：是一个函数，用于打开信息窗口。\n   - `Obj.innerHTML`：设置或返回元素的内部 HTML\
  \ 内容。\n   - `<div>`：标签定义 HTML 文档中的一个分区或节。\n\n```html\n<div id =\"word\" > 信念与希望\
  \ </div><script type =\"text/javascript\" >var divObj = document.getElementById(\
  \ \"word\" );var htmlContent = divObj.innerHTML;alert( htmlContent);</script>\n\
  ```\n\n![](img/Image00036.jpg)\n\n2. 修改文件：`getElementById.html`\n   - `<input type=\
