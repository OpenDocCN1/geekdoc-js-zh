  \ type =\"button\" value =\"Get Parent Node\" onclick =\"doGetParentNode()\" /></body><script\
  \ type =\"text/javascript\" >function doGetParentNode(){var divObj= document.getElementById(\
  \ \"div\" );alert( divObj.parentNode.nodeName);}</script>\n```\n\n2. 修改 `ElementHierarchy.html`\
  \ 以获取所有子节点。\n\n`obj.childNodes`：获取当前节点的所有子节点\n\n`obj.nodeName`：获取父节点的名称\n\n`obj.nodeType`：获取父节点的类型\n\
  \n`obj.innerHTML`：获取父节点的 HTML 内容\n\n![](img/Image00066.jpg)\n\n```\n<body><div id=\
  \ \"div\" ><b> United State </b><span> Book </span><a href =\"#\" > VereJava </a></div><hr><input\
  \ type =\"button\" value =\"Get Child Nodes\" onclick =\"doGetChildNodes()\" /></body><script\
  \ type =\"text/javascript\" >function doGetChildNodes(){var div= document.getElementById(\
  \ \"div\" );var childNodes= div.childNodes;for ( var i= 0 ; i< childNodes.length;\
  \ i++){if ( childNodes[ i]. nodeType== 1 ){document.write( childNodes[ i]. nodeName+\
  \ \" , \" );document.write( childNodes[ i]. nodeType+ \" , \" );document.write(\
  \ childNodes[ i]. innerHTML+ \"<br>\" );}}}</script>\n```\n\n3. 修改 `ElementHierarchy.html`\
  \ 以获取 book 节点的前一个和后一个节点。\n\n`obj.previousSibling`：获取当前节点的前一个节点\n\n`obj.nextSibling`：获取当前节点的后一个节点\n\
  \n![](img/Image00067.jpg)\n\n```\n<body><div id =\"div\" ><b> United State </b><span\
  \ id =\"book\" > Book </span><a href =\"#\" > VereJava </a></div><hr><input type\
