  \ i++){var option= document.createElement( \"option\" );option.text= countryArray[\
  \ i];option.value= countryArray[ i];country.options[ country.options.length]= option;}}function\
  \ doCountryChange( obj){var provinceObj= document.getElementById( \"province\" );provinceObj.options.length=\
  \ 0 ; // clear allvar index= obj.selectedIndex;for ( var i= 0 ; i< provinceArray[\
  \ index]. length; i++){var option= document.createElement( \"option\" );option.text=\
  \ provinceArray[ index][ i];option.value= provinceArray[ index][ i];provinceObj.options[\
  \ provinceObj.options.length]= option;}}</script>\n```\n\n## 事件事件列表：\n\n| 事件 | 描述\
  \ |\n|-------|-------------|\n| Onblur | 元素失去焦点 |\n| Onchange | 内容发生改变 |\n| Onclick\
  \ | 鼠标点击对象 |\n| Ondblclick | 鼠标双击对象 |\n| Onerror | 加载文档或图像时发生错误 |\n| Onfocus | 元素获得焦点\
  \ |\n| Onkeydown | 键盘按键被按下 |\n| Onkeypress | 键盘按键被按下 |\n| Onkeyup | 键盘按键被释放 |\n\
  | Onload | 页面或图像加载完成 |\n| Onmousedown | 鼠标按钮被按下 |\n| Onmousemove | 鼠标移动 |\n| Onmouseout\
  \ | 鼠标从元素上移开 |\n| Onmouseover | 鼠标移动到元素上 |\n| Onmouseup | 鼠标按钮被释放 |\n| Onreset |\
  \ 重置按钮被点击 |\n| Onresize | 窗口或框架大小改变 |\n| Onselect | 文本被选中 |\n| Onsubmit | 提交按钮被点击\
  \ |\n| Onunload | 退出页面 |\n\n## 登录网页\n\n![](img/Image00062.jpg)\n\n1. 使用记事本创建一个 `Login.html`\
