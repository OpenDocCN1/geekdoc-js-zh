  \n所有图片均位于 KidsLearningJavascriptImages.zip 中，请通过此链接下载：[`en.verejava.com/download.jsp?id=1`](http://en.verejava.com/download.jsp?id=1)\n\
  \n## 1. 使用记事本创建 DrawImage.html 文件，并在浏览器中打开\n\n`Image.onload`：当图像加载完成时触发的事件。`drawImage()`：将图像绘制到画布上。\n\
  \n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas\
  \ id =\"myCanvas\" width =\"300\" height =\"300\" ></canvas><script type =\"text/javascript\"\
  \ >var canvas = document.getElementById( \"myCanvas\" );var context = canvas.getContext(\
  \ \"2d\" );var bluePlaneImage = new Image();bluePlaneImage.src = \"./images/blue_plane.png\"\
  \ ;bluePlaneImage.onload = function (){     context.drawImage( bluePlaneImage, 60\
  \ , 220 );         };var redPlaneImage = new Image();redPlaneImage.src = \"./images/red_Plane.png\"\
  \ ;redPlaneImage.onload = function (){context.drawImage( redPlaneImage, 160 , 220\
  \ );               };</script>\n```\n\n## 3. 创建 Airplane 类，并编写 draw 方法在画布上绘制图像\n\
  ![](img/Image00094.jpg)\n\n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position:\
  \ absolute;}</style><canvas id =\"myCanvas\" width =\"300\" height =\"300\" ></canvas><script\
  \ type =\"text/javascript\" >var canvas = document.getElementById( \"myCanvas\"\
  \ );var context = canvas.getContext( \"2d\" );class Airplane{constructor( img, x,\
  \ y){this.x = x;this.y = y;this.img = img;}draw( context){context.drawImage( this.img,\
  \ this.x, this.y);}}//////////// test /////////////////var bluePlaneImage = new\
  \ Image();bluePlaneImage.src = \"./images/blue_plane.png\" ;var bluePlane = new\
  \ Airplane( bluePlaneImage, 60 , 220 );bluePlaneImage.onload = function (){     bluePlane.draw(\
  \ context);         };var redPlaneImage = new Image();redPlaneImage.src = \"./images/red_Plane.png\"\
  \ ;var redPlane = new Airplane( redPlaneImage, 160 , 220 );redPlaneImage.onload\
  \ = function (){redPlane.draw( context);                };</script>\n```\n\n## 4.\
  \ 按键事件\n\n### 4.1 如果按下上、下、左、右方向键，将调用 `doKeyDown` 函数\n![](img/Image00095.jpg)\n\n\
  ```html\n<style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><canvas\
  \ id =\"myCanvas\" width =\"300\" height =\"300\" ></canvas><script type =\"text/javascript\"\
  \ >var canvas = document.getElementById( \"myCanvas\" );var context = canvas.getContext(\
  \ \"2d\" );class Airplane{constructor( img, x, y){this.x = x;this.y = y;this.img\
  \ = img;}draw( context){context.drawImage( this.img, this.x, this.y);}}////////////\
  \ test /////////////////var bluePlaneImage = new Image();bluePlaneImage.src = \"\
  ./images/blue_plane.png\" ;var bluePlane = new Airplane( bluePlaneImage, 60 , 220\
  \ );bluePlaneImage.onload = function (){     bluePlane.draw( context);         };var\
  \ redPlaneImage = new Image();redPlaneImage.src = \"./images/red_Plane.png\" ;var\
  \ redPlane = new Airplane( redPlaneImage, 160 , 220 );redPlaneImage.onload = function\
  \ (){redPlane.draw( context);                };canvas.addEventListener( 'keydown'\
  \ , doKeyDown, true );canvas.focus();window.addEventListener( 'keydown' , doKeyDown,\
  \ true );function doKeyDown( e) {var keyID = e.keyCode ? e.keyCode : e.which;if\
  \ ( keyID === 37 )   { //left arrowalert( \"left\" );e.preventDefault();}if ( keyID\
  \ === 38 )   { //up arrowalert( \"up\" );e.preventDefault();}if ( keyID === 39 )\
  \   { //right arrowalert( \"right\" );e.preventDefault();}if ( keyID === 40 )   {\
  \ //down arrowalert( \"down\" );e.preventDefault();}}</script>\n```\n\n### 4. 按下上、下、左、右方向键移动画布上的飞机\n\
  ![](img/Image00096.jpg)\n\n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position:\
  \ absolute;}</style><canvas id =\"myCanvas\" width =\"300\" height =\"300\" ></canvas><script\
  \ type =\"text/javascript\" >var canvas = document.getElementById( \"myCanvas\"\
  \ );var context = canvas.getContext( \"2d\" );var canvasWidth = 300 ;var canvasHeight\
  \ = 300 ;class Airplane{constructor( img, x, y){this.x = x;this.y = y;this.img =\
  \ img;}draw( context){context.drawImage( this.img, this.x, this.y);}move( context,\
  \ distanceX, distanceY){this.x = this.x + distanceX;this.y = this.y + distanceY;context.drawImage(\
  \ this.img, this.x, this.y);}}//////////// test /////////////////var bluePlaneImage\
  \ = new Image();bluePlaneImage.src = \"./images/blue_plane.png\" ;var bluePlane\
  \ = new Airplane( bluePlaneImage, 100 , 220 );bluePlaneImage.onload = function (){\
  \     bluePlane.draw( context);         };canvas.addEventListener( 'keydown' , doKeyDown,\
  \ true );canvas.focus();window.addEventListener( 'keydown' , doKeyDown, true );function\
  \ doKeyDown( e) {context.clearRect( 0 , 0 , canvasWidth, canvasHeight);var keyID\
  \ = e.keyCode ? e.keyCode : e.which;if ( keyID === 37 )   { //left arrowbluePlane.move(\
  \ context,- 5 , 0 )e.preventDefault();}if ( keyID === 38 )   { //up arrowbluePlane.move(\
  \ context, 0 , - 5 )e.preventDefault();}if ( keyID === 39 )   { //right arrowbluePlane.move(\
  \ context, 5 , 0 )e.preventDefault();}if ( keyID === 40 )   { //down arrowbluePlane.move(\
  \ context, 0 , 5 )e.preventDefault();}}</script>\n```\n\n## 5. 飞机发射蓝色子弹\n\n### 5.1\
  \ 子弹从飞机顶部中央发射\n![](img/Image00097.jpg)\n\n### 5.2 启动 `setInterval(\"reDraw()\",200)`\
  \ 使子弹持续向上移动，当子弹移出画布时，需要销毁子弹（设置 `visible = false`），子弹可以重新发射\n![](img/Image00098.jpg)\n\
  \n### 5.3 飞机和子弹继承自 Sprite 以实现复用\n![](img/Image00099.jpg)\n\n## 6. 敌机持续向下移动\n\n###\
  \ 6.1 敌机从画布顶部随机位置开始并向下移动\n![](img/Image00100.jpg)\n\n### 6.2 保持敌机向下移动，当敌机移出画布时，需要销毁敌机（设置\
  \ `visible = False`），敌机可以重新生成\n![](img/Image00101.jpg)\n\n### 6.3 飞机、子弹和敌机继承自 Sprite\
  \ 以实现复用\n![](img/Image00102.jpg)\n\n## 7. 子弹与敌机碰撞并爆炸\n![](img/Image00103.jpg)\n\n\
  ### 7.1 子弹与敌机碰撞\n当两张图片中心坐标之差的绝对值小于它们宽度和高度之和的一半时，我们认为它们相交并发生碰撞\n![](img/Image00104.jpg)\n\
  \n\n\n\n\n```html\n<style>#myCanvas{border:1px solid #c3c3c3;position: absolute;}</style><span\
  \ id =\"dd\" ></span><br><canvas id =\"myCanvas\" width =\"300\" height =\"300\"\
  \ ></canvas><script type =\"text/javascript\" >var canvas = document.getElementById(\
  \ \"myCanvas\" );var context = canvas.getContext( \"2d\" );var canvasWidth = 300\
  \ ;var canvasHeight = 300 ;class Sprite{constructor( img, x, y){this.x = x;this.y\
  \ = y;this.img = img;}draw( context){context.drawImage( this.img, this.x, this.y);}move(\
  \ context, distanceX, distanceY){this.x = this.x + distanceX;this.y = this.y + distanceY;}collideWith(\
  \ sprite){var centerX = this.x + this.getWidth()/ 2 ;var centerY = this.y + this.getHeight()/\
  \ 2 ;var spriteCenterX = sprite.getX() + sprite.getWidth()/ 2 ;var spriteCenterY\
  \ = sprite.getY() + sprite.getHeight()/ 2 ;if ( Math.abs( centerX - spriteCenterX)\
  \ < ( this.width/ 2 + sprite.getWidth()/ 2 )&&Math.abs( centerY - spriteCenterY)\
  \ <   ( this.height/ 2 + sprite.getHeight()/ 2 ))return trueelsereturn false}isVisible(){return\
  \ this.visible;}setVisible( visible){this.visible = visible;}getX(){return this.x;}setX(\
  \ x){this.x= x;}getY(){return this.y;}setY( y){this.y= y;}getHeight(){return this.height;}setHeight(\
  \ height){this.height = height;}getWidth(){return this.width;}setWidth( width){this.width=\
  \ width;}}class Airplane extends Sprite{}class Bullet extends Sprite{move( context,\
  \ distanceX, distanceY){this.x = this.x + distanceX;this.y = this.y + distanceY;if\
  \ ( this.y + this.height <= 0 ){this.setVisible( false )}}}class EnenmyPlane extends\
  \ Sprite{move( context, distanceX, distanceY){this.x = this.x + distanceX;this.y\
  \ = this.y + distanceY;if ( this.y >= canvasHeight){this.setVisible( false );}}}////////////\
  \ test /////////////////var bluePlaneImage = new Image();bluePlaneImage.src = \"\
  ./images/blue_plane.png\" ;var bluePlane = new Airplane( bluePlaneImage, 100 , 220\
  \ );bluePlaneImage.onload = function (){    bluePlane.setWidth( bluePlaneImage.width);bluePlane.setHeight(\
  \ bluePlaneImage.height);bluePlane.draw( context);};var bulletImage = new Image();bulletImage.src\
  \ = \"./images/blue_bullet.png\" ;var bullet = new Bullet( bulletImage,- 100 ,-\
  \ 100 );bulletImage.onload = function (){    bullet.setWidth( bulletImage.width);bullet.setHeight(\
  \ bulletImage.height);bullet.setVisible( false );bullet.draw( context);        };var\
  \ enemyImage = new Image();enemyImage.src = \"./images/enemy.png\" ;var enemyPlane\
  \ = new EnenmyPlane( enemyImage,- 100 ,- 100 );enemyImage.onload = function (){\
  \    enemyPlane.setWidth( enemyImage.width);enemyPlane.setHeight( enemyImage.height);enemyPlane.setVisible(\
  \ false );enemyPlane.draw( context);        };canvas.addEventListener( 'keydown'\
  \ , doKeyDown, true );canvas.focus();window.addEventListener( 'keydown' , doKeyDown,\
  \ true );function doKeyDown( e) {var keyID = e.keyCode ? e.keyCode : e.which;if\
  \ ( keyID === 37 )   { //left arrowbluePlane.move( context,- 5 , 0 )e.preventDefault();}if\
  \ ( keyID === 38 )   { //up arrowbluePlane.move( context, 0 , - 5 )e.preventDefault();}if\
  \ ( keyID === 39 )   { //right arrowbluePlane.move( context, 5 , 0 )e.preventDefault();}if\
  \ ( keyID === 40 )   { //down arrowbluePlane.move( context, 0 , 5 )e.preventDefault();}if\
  \ ( keyID === 13 )   { //enter arrowif (! bullet.isVisible()){var x = bluePlane.getX()+\
  \ bluePlane.getWidth()/ 2 - bullet.getWidth()/ 2 ;var y = bluePlane.getY() - bullet.getHeight();bullet.setX(\
  \ x);bullet.setY( y);bullet.setVisible( true );}e.preventDefault();}bluePlane.draw(\
  \ context);}function bulletMove(){if ( bullet.isVisible()){bullet.move( context,\
  \ 0 ,- 5 );}bullet.draw( context);}function enemyPlaneMove(){if (! enemyPlane.isVisible()){var\
  \ x = Math.floor( Math.random()* canvasWidth)+ 1 ;var y = - enemyPlane.getHeight();enemyPlane.setX(\
  \ x);enemyPlane.setY( y);enemyPlane.setVisible( true );enemyPlane.draw( context);}if\
  \ ( enemyPlane.isVisible()){enemyPlane.move( context, 0 , 3 );}enemyPlane.draw(\
  \ context);}function collide(){if ( bullet.isVisible() && enemyPlane.isVisible()){if\
  \ ( bullet.collideWith( enemyPlane)){bullet.setX(- 100 );bullet.setY(- 100 );bullet.setVisible(\
  \ false );enemyPlane.setVisible( false );}}}function reDraw(){context.clearRect(\
  \ 0 , 0 , canvasWidth, canvasHeight);bulletMove();enemyPlaneMove();bluePlane.draw(\
  \ context);collide();}window.onload= function (){//Run reDraw() every 200 millisecondsvar\
  \ time = setInterval( \"reDraw()\" , 200 );}</script>\n```\n\n感谢学习，如果你想学习网页编码，请学习这本书[`www.amazon.com/dp/B086T5H983`](https://www.amazon.com/dp/B086T5H983)！![](img/Image00105.jpg)[`www.amazon.com/dp/B08D863KFY`](https://www.amazon.com/dp/B08D863KFY)![](img/Image00106.jpg)如果你喜欢这本书并觉得阅读有所收获，我很想听听你的意见，希望你能花点时间在亚马逊上写一篇评论。你的反馈和支持将帮助我们大大改进，使这本书变得更好。你现在可以点击这个链接。[`www.amazon.com/review/create-review?&asin=B08HTF1J52`](http://www.amazon.com/review/create-review?&asin=B08HTF1J52)不同国家的评论只需修改链接中的亚马逊域名：www.amazon.co.uk\
