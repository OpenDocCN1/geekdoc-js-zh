  md: '# Python Comments


    In any programming language, comments are needed.


    It makes our program more readable, and the Python interpreter ignores the commented
    code.


    In Python code, there are two ways to use comments. It''s a good idea to practice
    using comments in code to make it easier to understand.


    Code can be perplexing without comments.


    If we want to illustrate a code statement without executing it, we can do so by
    commenting it.


    While a comment is not part of the code, it improves readability.


