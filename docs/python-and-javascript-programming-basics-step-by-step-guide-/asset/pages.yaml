  md: '# Python for loop


    In Python, a for loop repeats a block of code based on a given sequence for a
    specified number of times. Python’s for loop is unlike any other programming language,
    such as C or Pascal. It traverses Python data structures such as lists, dictionaries,
    and tuples.


    # Syntax


    for iterating_var in sequence:

    nstatements


    The expression list in a sequence is evaluated first. The iterating variable var
    is then assigned to the first item in the sequence. After that, the statements
    block is run.


    The statement block is executed until the entire sequence is terminated; each
    item in the list is allocated to iterating var.


