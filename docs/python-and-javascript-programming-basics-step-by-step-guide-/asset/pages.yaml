  md: '# Python while loop


    Loops are crucial in Python and any other programming language because they allow
    you to run a block of code repeatedly.


    Often you''ll need to use a piece of code repeatedly, but you don''t want to write
    the same line of code every time, so you''ll want to use Loop.


    Looping statements are used to repeat the execution of several codes or statements
    until the condition stated in the loops is falsely evaluated.


    In Python, there are primarily two loop statements:


    +   1. while loop

    2. for loop


    The while loop will be explained in this topic.


    # while loop:


    The while loop is used to continuously execute a statement until the loop''s condition
    becomes false. It''s used when we don''t know how many iterations we''ll have
    ahead of time.


    # Syntax:


    while expression:


    statement


    # Flow Diagram'
