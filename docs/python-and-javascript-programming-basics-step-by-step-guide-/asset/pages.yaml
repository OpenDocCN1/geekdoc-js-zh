  md: 'In programming languages such as C or C++, there are two steps to executing
    code: first compile it, then run it, while Python does not require compiling.


    Internally, the source code is translated to byte code, which means is a fast
    format.


    Python is an interpreted language, which means that it executes code by line and
    in its entirety. As a result, debugging the code is much simpler.


    It’s a little slower than JAVA because of the interpreter, it’s not a big deal
    because it’s better than other languages.


    Python has a greater degree of flexibility than compiled languages. It manages
    memory for you automatically.


    # 4. Object-Oriented


    Python is an object-oriented programming language that supports concepts such
    as objects, classes, encapsulation, inheritance, and so on.


    It is object-oriented and integrates data and functions. Real-world entities are
    defined in OOPs by objects, and classes are the object’s blueprint.


    It also works with procedural languages.


    Functions are central to procedural language programming, which makes code reusable.


    The most natural and practical approach is object-oriented programming.


    The principles of OOPs allow you to break down your program into smaller problems
    that you can tackle one at a time.


    # 5. Dynamically Typed


    Python is a dynamically typed language, which means that when declaring variables,
    the data type does not delegate.'
