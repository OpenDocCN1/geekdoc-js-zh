- md: "\nThe type of value is determined at runtime rather than in advance.\n\nWhen\
    \ we declare a variable with a value, the value is saved in memory and attaches\
    \ the variable to the memory container.\n\nFor example, we may assign the string\
    \ value x=\"Hello world\" to a string variable.\n\nThe advantage of dynamic memory\
    \ allocation is that it prevents memory waste.\n\nSince all memory allocation\
    \ cannot be used when we use static memory allocation, a lot of memory is lost.\n\
    \n## 6. Large standard Library\n\nWhen you install Python, you’ll be prompted\
    \ to enter a password.\n\nIt came with a large library that you can use instead\
    \ of writing to every variable in your code.\n\nThere’s a library for regular\
    \ expressions, threading, databases, image manipulation, unit-testing web browsers,\
    \ CGI, and more.\n\nA Python library is a collection of functions and methods.\n\
    \nIt helps you to perform a variety of tasks without having to write code.\n\n\
    ## 7. Extensible\n\nPython is extensible, which means you can write Python code\
    \ in languages other than Python, such as Java, C, and C++. Python is therefore\
    \ an extensible language.\n\nIt doesn’t extend Python in any way (syntax, constructs,\
    \ etc.), but it allows you to interact with libraries written in other languages.\
    \ (Mainly C or C++, but you can use C as a bridge to call all other languages\
    \ with C interfaces).\n\n## 8. Portable\n\nPython is platform-agnostic, which\
    \ means it can run on any device. Python code can run on a variety of platforms,\
    \ including Mac, Linux, and Windows.\n\nAssume you wrote the code on a Windows\
    \ computer.\n\nYou don’t need to make any improvements to it now if you want to\
    \ run it on Linux. It is not necessary to write different code for each platform.\n\
    \n## 9. Free and Open Source\n\nPython is available for free on its official website\
    \ (www.python.org).\n\nIt is available for download and installation by anyone.\n\
    \nYou can also get a Python IDE (Integrated Development Environment) like Pycharm,\
    \ Jupyter, Visual Studio, and so on.\n\nPython is an open-source language, which\
    \ ensures that its code source is freely accessible and unrestricted.\n\nAnyone\
    \ can download it, use it, and build new modules or functions with it, which they\
    \ can then share with the Python community.\n\n## 10. GUI Programming\n\nThe acronym\
    \ GUI stands for “Graphical User Interface.”\n\nUsing Python Tkinter or PyQt,\
    \ we can build a simple desktop program.\n\n## 11. Expressive\n\nPython is a language\
    \ that allows you to express yourself.\n\nIt means that single line of Python\
    \ code can be more expressive than a line of code written in another programming\
    \ language.\n\nThe main benefit of using a more expressive language is that the\
    \ fewer lines of code you write, the easier you can finish the project.\n\nIt’s\
    \ easier to debug and keep the code up to date.\n\n# Python Setup guide and installation\n\
    \nPython is a high-level programming language that is commonly used. Python’s\
    \ first version was released in 1991. Python has grown in popularity since then.\
    \ It's widely regarded as one of the most user-friendly and adaptable server-side\
    \ programming languages available.\n\nThe Python interpreter must be installed\
    \ before you begin working with Python. Unlike other Linux distributions, Windows\
    \ does not have Python as a standard feature. However, installing Python on a\
    \ Windows server or a local machine is a simple process. There are several popular\
    \ methods for accomplishing this:\n\n- Python is available for free at www.python.org,\
    \ which is run by the Python Software Foundation. In most cases, this entails\
    \ installing and running a suitable installer for your operating system.\n- Installing\
    \ Homebrew, a package manager for macOS, is the fastest to get Python installed.\n\
    - It comes with a package manager for Linux that can be used to install Python.\n\
    - Applications that have a Python programming environment can be downloaded for\
    \ mobile operating systems such as Android and iOS.\n- A Python programming environment\
    \ is available on a number of websites. These websites allow you to practice coding\
    \ without having to install Python.\n\n# Python Installation on Windows\n\nYou\
    \ must first select a Python version. Python 3.7 must be installed if you want\
    \ to learn the most recent version of Python. This version can be installed alongside\
    \ 2.7, but it is no longer used in industry.\n\nPython on Windows can be installed\
    \ in a few steps. The following are the steps to take:\n\n## Step-1\n\n## Set\
    \ Up for Download\n\n- 1. Open a browser and go to www.python.org, the official\
    \ Python website. It will take you to the website’s home page.\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_14_0.png)\n\
    \n- Go to the Downloads section and choose Windows from the drop-down menu. Look\
    \ for the Python version you like. Python 3 has been updated to version 3.7.4,\
    \ while Python 2 has been updated to version 2.7.16. Consider the following illustration:\n\
    \n![](img/2bfe61f5593c3ea97ff290c1c0335a80_14_1.png)\n\n## Step-2 Select Installer:\n\
    \nTo download Python for 64-bit OS, choose either the window x86-64 executable\
    \ installer or the window x86 executable installer.\n\nNote that you can install\
    \ the 32-bit or 64-bit version of Windows. For the most part, either installer\
    \ can operate on a 64-bit machine. According to the operating system, the 64-bit\
    \ version works better for applications that require it.\n\nIf you’re unsure which\
    \ version to choose, go with 64-bit. However, if you make the wrong decision and\
    \ choose to upgrade to a different version, you can easily uninstall and reinstall.\n\
    \n## Step-3 Run the installer\n\nRun the installer after you’ve downloaded it.\n\
    \n- 1. Check the Add Python 3.7 to Path for all users.\n- 2. Select the option\
    \ to install now, which is the recommended method.\n\nNote that such features\
    \ may not be available in older versions of Python (Integrated Development Environment).\n\
    \n![](img/2bfe61f5593c3ea97ff290c1c0335a80_15_0.png)\n\n- “Setup was successful,”\
    \ says the dialog box. You can allow Python to use long paths by selecting “Disable\
    \ path limit.”\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_16_0.png)\n\n## Step-4\
    \ Check to see if Python is loaded\n\n- 1. Go to the directory where Python was\
    \ installed on your computer. It’s C:\\Users\\Username\\AppData\\Local\\Programs\\\
    Python\\Python37\n- 2. Double-click the “python.exe” (python executable file)\n\
    - 3. You can also use the command prompt to verify it by typing “python --version.”\
    \ It will show you the Python version. If Python is successfully enabled, the\
    \ following output will appear.\n\n## Step-5 Check to see if Pip is installed\n\
    \nPip is a powerful package management system for Python packages. If you install\
    \ an older version of Python, it is possible that Pip would not be pre-installed.\n\
    \n- For most Python packages, Pip is recommended, particularly when working in\
    \ virtual environments.\n- To see if Pip has been successfully installed:\n  \
    \  - Type cmd into the Start menu.\n    - Launch the Command Prompt program.\n\
    \    - In the terminal, type pip --version. If Pip has been successfully mounted,\
    \ the following output will be shown.\n\nHowever, if pip isn’t installed yet,\
    \ you’ll get the following output:\n\n“pip is not recognized as an internal or\
    \ external command, or as a batch file that can be executed.”\n\n## Step-6 Setting\
    \ Environment variable\n\nIf you did not select the Add Python to PATH checkbox,\
    \ or if your installer installer does not include it, follow the steps below:\n\
    \nUsing the Start menu, select +R.\n\n- 1. Open a command prompt and type sysdm.cpl.\
    \ The System Properties window will appear.\n- 2. Go to the Advanced tab and pick\
    \ Environment Variable from the drop-down menu.\n"
  mdcn: "\n\n值的类型是在运行时确定的，而不是提前指定的。\n\n当我们声明带有值的变量时，该值会被保存在内存中，并将变量与内存容器绑定。\n\n例如，我们可能会为字符串变量赋值字符串值\
    \ `x=\"Hello world\"`。\n\n动态内存分配的优点是它可以防止内存浪费。\n\n由于在使用静态内存分配时，所有的内存分配都无法使用，会导致大量的内存丢失。\n\
    \n## 6. 强大的标准库\n\n安装 Python 时，系统会提示你输入密码。\n\n它带有一个大型库，你可以使用它，而不是为代码中的每个变量编写代码。\n\
    \n它有正则表达式、多线程、数据库、图像处理、浏览器单元测试、CGI 等等库。\n\nPython 库是函数和方法的集合。\n\n它可以帮助你执行各种任务，而无需编写代码。\n\
    \n## 7. 可扩展性\n\nPython 是可扩展，这意味着你可以使用 Python以外的语言（如 Java、C 和 C++）编写 Python 代码。因此，Python\
    \ 是一种可扩展语言。\n\n它并没有以任何方式扩展 Python（语法、结构等），但它允许你与用其他语言编写的库交互。（主要是 C 或 C++，但你可以使用\
    \ C 作为桥梁来通过 C 接口调用所有其他语言）。\n\n## 8. 可移植性\n\nPython 是平台无关的，这意味着它可以运行在任何设备。Python\
    \ 代码可以在多种平台上运行，包括 Mac、Linux 和 Windows。\n\n假设你在 Windows 电脑上编写了代码。\n\n如果你想在 Linux\
    \ 上运行它，现在不需要对其进行任何改进。没有为每个平台编写不同的代码。\n\n## 9. 免费且开源\n\nPython 可以在其官方网站（www.python.org）免费获取。\n\
    \n任何人都可以下载并安装它。\n\n你还可以获取 Python IDE（集成开发环境），如 Pycharm、Jupyter、Visual Studio 等。\n\
    \nPython 是一种开源语言，这确保了它的代码源是自由访问且不受限制的。\n\n任何人都可以下载、使用它，并用它构建新的模块或函数，然后将这些内容与 Python\
    \ 社区共享。\n\n## 10. GUI 编程\n\nGUI 的缩写代表“图形化用户界面”。\n\n使用 Python Tkinter 或 PyQt，我们可以构建一个简单的桌面程序。\n\
    \n## 11. 表现力\n\nPython 是一种允许你表达自我的语言。\n\n这意味着单行 Python 代码的表达能力可能比用另一种编程语言编写的代码更强。\n\
    \n使用更具表现力的语言的主要优点是，你编写的代码越少，完成项目就越容易。\n\n调试和保持代码更新也更容易。\n\n# Python 设置指南与安装\n\n\
    Python 是一种常用的高级编程语言。Python 的第一个版本发布于 1991 年。从那时起，Python 的人气日益增加。它被广泛认为是最友好且适应性最强的服务器端编程语言之一。\n\
    \n在开始使用 Python 之前必须安装 Python 解释器。与其他 Linux 发行版不同，Windows 没有将 Python 作为标准功能。然而，在\
    \ Windows 服务器或本地机器上安装 Python 是一个简单的过程。有几种流行的方法可以实现：\n\n- Python 可以在 www.python.org\
    \ 免费获取，该网站由 Python 软件基金运行。在大多数情况下，这意味着需要安装并运行适用于你操作系统的安装程序。\n- 安装 macOS 的包管理器\
    \ Homebrew 是安装 Python 最快的方法。\n- Linux 自带了一个用于安装 Python 的包管理器。\n- 像 Android 和 iOS\
    \ 等移动操作系统可以下载带有 Python 编程环境的应用程序。\n- 许多网站都提供 Python 编程环境。这些网站允许你练习编码，而无需安装 Python。\n\
    \n# Windows 安装 Python\n\n你必须首先选择一个 Python 版本。如果你想学习最新版本的 Python，必须安装 Python 3.7。此版本可以与\
    \ 2.7 并安装，但它已不再工业界使用。\n\n在 Windows 上安装 Python 可以分步骤完成。以下是需要采取的步骤：\n\n## 第一步\n\n\
    ## 准备下载\n\n- 1. 打开浏览器并访问 www.python.org，即 Python 官方网站。它将带你进入网站的首页。\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_14_0.png)\n\
    \n- 进入 Downloads（下载）部分并从下拉列表中选择 Windows。寻找你喜欢的 Python 版本。Python 3 已更新到 3.7.4 版本，而\
    \ Python 2 已更新到 2.7.16 版本。参考以下插图：\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_14_1.png)\n\
    \n## 第二步 选择安装程序：\n\n要为 64 位操作系统下载 Python，请选择 windows x86-64 可执行安装程序或 windows x86\
    \ 可执行安装程序。\n\n注意，你可以安装 32 位或 64 位的 Windows 版本。大多数情况下，任何一个安装程序都可以在64 位机器上运行。根据操作系统的不同，64\
    \ 位版本对于某些应用程序效果更好。\n\n如果你不确定选择哪个版本，请选择 64 位。然而，如果你做错了决定并选择升级到不同的版本，你可以轻松地卸载并重装。\n\
    \n## 第三步 运行安装程序\n\n下载后运行安装程序。\n\n- 1. 勾选 Add Python 3.7 to Path（将 Python 3.7 添加到路径中）。\n\
    - 2. 选择 Install now（立即安装），这是推荐的方法。\n\n注意，此类功能在旧版本的 Python（集成开发环境）中可能不可用。\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_15_0.png)\n\
    \n- 对话框显示“Setup was successful（安装成功）”。你可以通过选择“Disable path limit（禁用路径限制）”允许 Python\
    \ 使用长路径。\n\n![](img/2bfe61f5593c3ea97ff290c1c0335a80_16_0.png)\n\n## 第四步 检查 Python\
    \ 是否加载\n\n- 1. 进入 Python 在你电脑上的安装目录。路径为 C:\\Users\\Username\\AppData\\Local\\\
    Programs\\Python\\Python37\n- 2. 双击“python.exe”（python 执行文件）\n- 3. 你也可以通过命令行输入\
    \ `python --version` 来验证。它将显示 Python 版本。如果 Python 已启用，将出现以下输出。\n\n## 第五步 检查 Pip\
    \ 是否安装\n\nPip 是 Python 包管理系统。如果你安装的是旧版本的 Python，可能没有预装 Pip。\n\n- 对于大多数 Python\
    \ 包，推荐使用 Pip，特别是在虚拟环境中。\n- 检查 Pip 是否已安装：\n    - 在开始菜单中输入 cmd。\n    - 启动命令提示符程序。\n\
    \    - 在终端中输入 `pip --version`。如果 Pip 已挂载，将显示以下输出。\n\n然而，如果尚未安装 pip，你会得到以下输出：\n\
    \n“pip 不是内部或外部命令，也不是可运行的批处理程序。”\n\n## 第六步 设置环境变量\n\n如果你没有勾选 Add Python to PATH\
    \ 复选框，或者你的安装程序没有包含该选项，请按照以下步骤操作：\n\n使用开始菜单，选择 +R。\n\n- 1. 打开命令提示符并输入 `sysdm.cpl`。将属性系统窗口。\n\
    - 2. 转到 Advanced（高级）选项卡，并从下拉列表中选择 Environment Variable（环境变量）。\n\n"
