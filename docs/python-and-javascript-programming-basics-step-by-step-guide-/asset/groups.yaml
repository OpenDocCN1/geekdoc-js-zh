- md: "\n# JavaScript Function\n\nThe ability to define new functions within the `<script>...</script>`\
    \ tag is an important feature of JavaScript. The function keyword is used to declare\
    \ a function in JavaScript.\n\nTo reuse the code, we call the JavaScript method\
    \ numerous times.\n\n# Advantages - JavaScript functions\n\n- 1. Code reusability:\
    \ We use the same method several times to save time and code.\n- 2. Less coding:\
    \ Our application is compressed as a result of this. When we conduct a routine\
    \ task, we don't write a lot of code.\n\n# Syntax\n\n```\nfunction functionName(parameter\
    \ or not)\n{\n  statements\n}\n```\n\n# Example\n\n```html\n<!DOCTYPE html>\n\n\
    <body>\n<script>\nfunction msg()\n{\nalert(\"Hello world!\");\n}\n</script>\n\
    <input type=\"button\" onclick=\"msg()\" value=\"click here\">\n</body>\n</html>\n\
    ```\n\n# Output\n\nHello world!\n\n# Function with arguments\n\nCall function\
    \ by passing arguments.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    function getcube(number)\n{\nalert(number* number* number);\n}\n</script>\n<form>\n\
    <input type=\"button\" value=\"click\" onclick=\"getcube(3)\">\n</form>\n</body>\n\
    </html>\n```\n\n# Output\n\n27\n\n# Example\n\n```html\n<!DOCTYPE html>\n<body>\n\
    <script>\nfunction getname() {\nname=prompt(\"Enter the Name\");\nalert(\"Welcome\
    \ Mr/Mrs \" + name);\n}\n</script>\n</body>\n<form>\n<input type=\"button\" value=\"\
    Click\" onclick=\"classname()\"/>\n</form>\n</html>\n```\n\n# Function with return\
    \ value\n\nCall function that return return value and use it in program.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getInfo()\n{\nreturn \"Hello\
    \ Raj! How are you?\";\n}\n</script>\n<script>\ndocument.write(getInfo());\n</script>\n\
    </body>\n</html>\n```\n\n# Output\n\nHello Raj! How are you?\n\n# The Function()\
    \ Constructor\n\nA function statement isn't just for defining new functions; it\
    \ may also be used to define functions dynamically using the Function() constructor\
    \ and the new operator.\n\n# Syntax\n\n```html\n<script>\nvar variablename = new\
    \ Function(Arg1, Arg2...., \"Function Body\");\n</script>\n```\n\n# Example\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func = new Function(\"\
    a\", \"b\", \"return a+b;\");\nfunction secondFunction() {\nvar result;\nresult\
    \ = func(50,50);\ndocument.write ( result );\n}\n</script>\n</head>\n<body>\n\
    <p>Click button to call the function</p>\n<form>\n<input type=\"button\" onclick=\"\
    secondFunction()\" value=\"Cal Function\">\n</form>\n<p>Use different parameters\
    \ inside the function and try yourself...</p>\n</body>\n</html>\n```\n\n# Function\
    \ Literals\n\nThe concept of function literals, which is another way to construct\
    \ functions, is introduced in JavaScript 1.2. It's an expression that defines\
    \ a function that doesn't have a name.\nThe syntax for a function literal is similar\
    \ to that of a function statement, except that it is used as an expression rather\
    \ than a function statement, and there is no need for a function name.\n\n# Syntax\n\
    \n```html\n<script>\nvar variablen = function (Argument List) {\n    Function\
    \ Body\n};\n</script>\n```\n\n# Example\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<script>\nvar func = function(a,b){ return a+b };\n\nfunction secondFunction()\
    \ {\nvar result;\nresult = func(10,20);\ndocument.write ( result );\n}\n</script>\n\
    </head>\n<body>\n<p>Click the button to call the function</p>\n<form>\n<input\
    \ type=\"button\" onclick=\"secondFunction()\" value=\"Cal Function\">\n</form>\n\
    <p>Use different parameters inside the function and try yourself...</p>\n</body>\n\
    </html>\n```\n\n# Javascript Object\n\nAn object is a state-and-behavioral entity.\
    \ JavaScript is a scripting language that focuses on objects. Although JavaScript\
    \ is template-based than class-based, it allows us to create objects directly.\n\
    \n# Syntax - to add property - to add object\n\n```\nobjectName.objectProperty\
    \ = propertyValue;\n```\n\nWe use the write() method to document objects to write\
    \ any content on the document.\n\n```\nDocument.write(\"Hello world\")\n```\n\n\
    # Example\n\n# The following example\n\nshows how to create an Object.\n\n```html\n\
    <!DOCTYPE html>\n\n<html>\n<head>\n<title>User-defined objects</title>\n<script\
    \ type=\"text/javascript\">\n\nvar book = new Object(); // Object created\nbook.subject\
    \ = \"5 points someone\"; // Properties assign to the object\nbook.author = \"\
    ChetanBhagat\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Book Name is : \" + book.subject + \"<br>\");\ndocument.write(\"\
    Book Author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n\
    ```\n\n# Output\n\nBook Name is : 5 points someone\nBook Author is : ChetanBhagat\n\
    \n# Methods of an Object\n\n# Example\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>User-defined objects</title>\n<script type=\"text/javascript\">// Define\
    \ a function which will work as a method\nfunction addPrice(amount) {\n  this.price\
    \ = amount;\n}\nfunction book(title, author) {\nthis.title = title;\nthis.author\
    \ = author;\nthis.addPrice = addPrice; // Assign method as property.\n}\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvarmyBook = new book(\"5 Points\
    \ Someone\", \"ChetanBhagat\");\nmyBook.addPrice(150);\ndocument.write(\"Book\
    \ Title is : \" + myBook.title + \"<br>\");\ndocument.write(\"Book Author is :\
    \ \" + myBook.author + \"<br>\");\ndocument.write(\"Book Price is : \" + myBook.price\
    \ + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n# Output\n\nBook Title is\
    \ : 5 Points Someone\nBook Author is : ChetanBhagat\nBook Price is : 150\n\n#\
    \ Javascript array\n\nArrays are used to represent a collection of elements in\
    \ a single unit.\nThey are stored in memory.\nArrays are used with indexes.\n\
    In JavaScript, we must use new keyword to declare an array.\n\n# Syntax\n\narray\
    \ = new Array();\n\n# Example\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nvar emp = new Array();\nemp[0] = \"Ajay\";\nemp[1]\
    \ = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3] = \"Shipra\";\n\nfor (i=0; i<emp.length;\
    \ i++)\n{\ndocument.write(emp[i] + \"<br>\");\n}\n</script>\n</body>\n</html>\n\
    ```\n\n# Output\n\nAjay\nAbhay\nArun\nShipra\n\n# Example\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction array()\n\
    {\nnum = new Array(5);\nnum[0] = 10;\nnum[1] = 20;\nnum[2] = 30;\nnum[3] = 40;\n\
    num[4] = 50;\nsum = 0;\nfor (i=0; i<num.length; i++)\n{\nsum = sum + num[i];\n\
    }\nalert(sum)\n}\n</script>\n</head>\n<body>\n<input type=\"button\" onclick=\"\
    array()\" value=\"click here\">\n</body>\n</html>\n```\n\n# Functions used in\
    \ Array\n\n| Functions | Description |\n| --- | --- |\n| concat() | To concat\
    \ the element of one array at the end of another array and returns array. |\n\
    | sort() | Sort all elements of array. |\n| reverse() | Reverse all the elements.\
    \ |\n| slice() | To extract specified number of elements starting from index without\
    \ deleting them from array. |\n| splice() | To extract specified number of elements\
    \ starting from index and delete them from array. |\n| push() | Push all the elements\
    \ in array to top. |\n| pop() | Pop the top elements from array. |\n\n# Javascript\
    \ String\n\nThe String object is used to work with a string of characters.\nIt’s\
    \ a tool for storing and manipulating text.\nIn JavaScript, there are two ways\
    \ to make a string:\n\n- 1. String literal.\n- 2. Using new keyword.\n\n## String\
    \ literal\n\nString literals are created by using double quotes.\n\n## Syntax\n\
    \nvar stringname=\"string value\";\n\n## Example\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\nvar str=\"Hello String Literal\";\ndocument.write(str);\n\
    </script>\n</body>\n</html>\n```\n\n# Output\n\nHello String Literal\n\n## Using\
    \ new keyword\n\n## Syntax\n\nvar stringname=new String(\"new keyword\")\n\n##\
    \ Example\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar stringname=new\
    \ String(\"Hello String\");\ndocument.write(stringname);\n</script>\n</body>\n\
    </html>\n```\n\n# Output\n\nHello String\n\n# String properties\n\nThere is a\
    \ list of string object properties as well as their descriptions.\n\n- 1. constructor.\n\
    - 2. length.\n- 3. prototype.\n\nConstructor– It gives you a reference to the\
    \ string function that made the object in the first place.\n\n# Syntax\n\nstring.constructor\n"
  mdcn: "\n\n# JavaScript 函数\n\n在 `<script>...</script>` 标签内定义新函数的能力是 JavaScript 的重要特性。`function`\
    \ 关键字用于在 JavaScript 中声明函数。\n\n为了复用代码，我们多次调用 JavaScript 方法。\n\n# 优点 - JavaScript\
    \ 函数\n\n- 1. 代码复用：我们多次使用同一个方法来节省时间和代码量。\n- 2. 减少代码量：由于此点的存在，我们的应用程序被压缩了。当我们执行例行任务时，不需要编写大量的代码。\n\
    \n# 语法\n\n```\nfunction functionName(parameter or not)\n{\n  statements\n}\n```\n\
    \n# 示例\n\n```html\n<!DOCTYPE html>\n\n<body>\n<script>\nfunction msg()\n{\nalert(\"\
    Hello world!\");\n}\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"\
    click here\">\n</body>\n</html>\n```\n\n# 输出\n\nHello world!\n\n# 带参数的函数\n\n通过传递参数来调用函数。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getcube(number)\n\
    {\nalert(number* number* number);\n}\n</script>\n<form>\n<input type=\"button\"\
    \ value=\"click\" onclick=\"getcube(3)\">\n</form>\n</body>\n</html>\n```\n\n\
    # 输出\n\n27\n\n# 示例\n\n```html\n<!DOCTYPE html>\n<body>\n<script>\nfunction getname()\
    \ {\nname=prompt(\"Enter the Name\");\nalert(\"Welcome Mr/Mrs \" + name);\n}\n\
    </script>\n</body>\n<form>\n<input type=\"button\" value=\"Click\" onclick=\"\
    classname()\"/>\n</form>\n</html>\n```\n\n# 带返回值的函数\n\n调用返回返回函数并在程序中使用该返回值。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getInfo()\n{\nreturn\
    \ \"Hello Raj! How are you?\";\n}\n</script>\n<script>\ndocument.write(getInfo());\n\
    </script>\n</body>\n</html>\n```\n\n# 输出\n\nHello Raj! How are you?\n\n# Function()\
    \ 构造函数\n\n函数语句不仅用于定义新函数；它还可以用于使用 `Function()` 构造函数和 `new` 运算符来动态定义函数。\n\n# 语法\n\
    \n```html\n<script>\nvar variablename = new Function(Arg1, Arg2...., \"Function\
    \ Body\");\n</script>\n```\n\n# 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nvar func = new Function(\"a\", \"b\", \"return a+b;\");\nfunction secondFunction()\
    \ {\nvar result;\nresult = func(50,50);\ndocument.write ( result );\n}\n</script>\n\
    </head>\n<body>\n<p>点击按钮调用该函数</p>\n<form>\n<input type=\"button\" onclick=\"secondFunction()\"\
    \ value=\"Cal Function\">\n</form>\n<p>在函数内部使用不同的参数并尝试一下吧...</p>\n</body>\n</html>\n\
    ```\n\n# 函数字面量 (Function Literals)\n\n函数字面量的概念是构造函数的另一种方式，它在 JavaScript 1.2 中被引入。它是一个表达式，定义了一个没有名字的函数。\n\
    函数字面量的语法与函数语句相似，不同在于被用作表达式而不是函数语句，并且不需要函数名。\n\n# 语法\n\n```html\n<script>\nvar\
    \ variablen = function (Argument List) {\n    Function Body\n};\n</script>\n```\n\
    \n# 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func = function(a,b){\
    \ return a+b };\n\nfunction secondFunction() {\nvar result;\nresult = func(10,20);\n\
    document.write ( result );\n}\n</script>\n</head>\n<body>\n<p>点击按钮调用该函数</p>\n\
    <form>\n<input type=\"button\" onclick=\"secondFunction()\" value=\"Cal Function\"\
    >\n</form>\n<p>在函数内部使用不同的参数并尝试一下吧...</p>\n</body>\n</html>\n```\n\n# JavaScript\
    \ 对象 (Javascript Object)\n\n对象是一个包含状态和行为的实体。JavaScript 是一种专注于对象的脚本语言。虽然 JavaScript\
    \ 是基于模板的而非基于类的，但它允许我们直接创建对象。\n\n# 语法 - 添加属性 - 添加对象\n\n```\nobjectName.objectProperty\
    \ = propertyValue;\n```\n\n我们使用 `write()` 方法来记录对象，以便在文档上写入任何内容。\n\n```\nDocument.write(\"\
    Hello world\")\n```\n\n# 示例\n\n# 以下示例\n\n展示了如何创建一个对象。\n\n```html\n<!DOCTYPE html>\n\
    \n<html>\n<head>\n<title>用户自定义对象</title>\n<script type=\"text/javascript\">\n\n\
    var book = new Object(); // 创建对象\nbook.subject = \"5 points someone\"; // 给对象赋值属性\n\
    book.author = \"ChetanBhagat\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Book Name is : \" + book.subject + \"<br>\");\ndocument.write(\"\
    Book Author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n\
    ```\n\n# 输出\n\nBook Name is : 5 points someone\nBook Author is : ChetanBhagat\n\
    \n# 对象的方法 (Methods of an Object)\n\n# 示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>用户自定义对象</title>\n<script type=\"text/javascript\">// 定义一个将作为方法的函数\n\
    function addPrice(amount) {\n  this.price = amount;\n}\nfunction book(title, author)\
    \ {\nthis.title = title;\nthis.author = author;\nthis.addPrice = addPrice; //\
    \ 将方法赋值为属性。\n}\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n\
    varmyBook = new book(\"5 Points Someone\", \"ChetanBhagat\");\nmyBook.addPrice(150);\n\
    document.write(\"Book Title is : \" + myBook.title + \"<br>\");\ndocument.write(\"\
    Book Author is : \" + myBook.author + \"<br>\");\ndocument.write(\"Book Price\
    \ is : \" + myBook.price + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n# 输出\n\
    \nBook Title is : 5 Points Someone\nBook Author is : ChetanBhagat\nBook Price\
    \ is : 150\n\n# 数组 (Array)\n\n# 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script type=\"text/javascript\">\n = = Array(); // 创建数组\nemp[0] = \"Ajay\";\n\
    emp[1] = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3] = \"Shipra\";\n\nfor (i=0; i<emp.length;\
    \ i++)\n{\ndocument.write(emp[i] + \"<br>\");\n}\n</script>\n</head>\n</html>\n\
    ```\n\n# 输出\n\nAjay\nAbhay\nArun\nShipra\n\n# 示例\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script type=\"text/javascript\">\nfunction array()\n{\nnum =\
    \ Array(5);\nnum[0] = 10;\nnum[1] = 20;\nnum[2] = 30;\nnum[3] = 40;\nnum[4] =\
    \ 50;\nsum = 0;\nfor (i=0; i<num.length; i++)\n{\nsum = sum + num[i];\n}\nalert(sum)\n\
    }\n</script>\n</head>\n<body>\n<input type=\"button\" onclick=\"array()\" value=\"\
    click here\">\n</body>\n</html>\n```\n\n# 输出\n\n150\n\n# 数组中的方法\n\n| 方法 | 描述 |\n\
    | --- | --- |\n| concat() | 将一个数组的元素连接到另一个数组的末尾并返回数组。 |\n| sort() | 对数组的所有元素排序。\
    \ |\n| reverse() | 反转所有元素。 |\n| slice() | 从索引开始提取指定数量的元素，但不从数组中删除。 |\n| splice()\
    \ | 从索引开始提取指定数量的元素并从数组中删除。 |\n| push() | 将数组中的元素推送到顶部。 |\n| pop() | 从数组顶部弹出元素。\
    \ |\n\n# JavaScript 字符串 (Javascript String)\n\nString 对象用于处理字符字符串。它是存储和操作文本的工具。在\
    \ JavaScript 中，有两种方法创建字符串：\n\n- 1. 字符串字面量。\n- 2. 使用 `new` 关键字。\n\n## 字符串字面量\n\n\
    字符串字面量通过使用双引号创建。\n\n## 语法\n\nvar stringname=\"string value\";\n\n## 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>\nvar str=\"Hello String Literal\";\n\
    document.write(str);\n</script>\n</body>\n</html>\n```\n\n# 输出\n\nHello String\
    \ Literal\n\n## 使用 new 关键字\n\n## 语法\n\nvar stringname=new String(\"new keyword\"\
    )\n\n## 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar stringname=new\
    \ String(\"Hello String\");\ndocument.write(stringname);\n</script>\n</body>\n\
    </html>\n```\n\n# 输出\n\nHello String\n\n# 字符串属性 (String properties)\n\n有一列字符串对象属性及其描述。\n\
    \n- 1. constructor.\n- 2. length.\n- 3. prototype.\n\nconstructor– 它提供指向最初创建对象的字符串函数的引用。\n\
    \n# 语法\n\nstring.constructor\n\n"
