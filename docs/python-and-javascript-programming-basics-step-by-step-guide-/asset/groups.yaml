- md: "\n- Go to the Advanced tab and pick Environment Variable from the drop-down\
    \ menu.\n- Find and pick the Path variable under System Variables, then press\
    \ Edit.\n- Go to the Variable value field and choose it. Add a semicolon before\
    \ the path to the python.exe file (;).\n\n# Python Keywords\n\nKeywords are words\
    \ that are reserved for the compiler and have a specific meaning. They aren’t\
    \ allowed to be used as a variable. Keywords are parts of the syntax, such as:\n\
    \n```\nreturn (a+b)\n```\n\nThe keyword return is used here, while the variables\
    \ a and b are variables.\nThe following is a list of all Python keywords:\n\n\
