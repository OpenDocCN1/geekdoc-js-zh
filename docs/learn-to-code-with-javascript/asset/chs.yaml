- "# JavaScript 编程入门\n\n\n\n![](img/cover.png)\n\n\n\n\n\n\n\n\n\n\n![SitePoint 标志](img/sitepoint-logo-2012.png)\n\
  \n\n## 关于 SitePoint\n\nSitePoint 专门为 Web 专业人士编写有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
  \ 访问我们的博客、书籍、通讯、文章和社区论坛。你可以在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 关于 Darren Jones\n\
  \n自从从他的第一台 Acorn Electron 电脑上学习 BASIC 编程以来，Darren 就喜欢编程。他自学了 Ruby 和 JavaScript，是\
  \ [JavaScript: Novice to Ninja](https://www.sitepoint.com/premium/books/javascript-novice-to-ninja-2nd-edition)\
  \ 和 [Jump Start Sinatra](https://www.sitepoint.com/premium/books/jump-start-sinatra)\
  \ 的作者。他还为 SitePoint Premium 制作了 “[Getting Started With Ruby](https://www.sitepoint.com/premium/courses/hands-on-programming-concepts-with-ruby-2-0-2906)”视频教程，并在\
  \ SitePoint 网站上写过[多篇文章](https://www.sitepoint.com/author/djones/)。他出生于英国曼彻斯特，目前仍居住在那里，并在当地高中教授数学和计算机。你可以在\
  \ Twitter 上找到他 [@daz4126](https://twitter.com/daz4126)。\n\n# 前言\n\n我仍然记得我的第一台电脑：那是一台\
  \ Acorn Electron，我非常喜欢用它来玩游戏，比如《Sphinx Adventure》（一款基于文本的冒险游戏）、《Starship Command》（一款硬射击游戏）和《Chuckie\
  \ Egg》（纯粹的平台动作游戏）。但当我发现可以用一种名为 BASIC 的语言编写自己的代码时，真正的乐趣开始了。我最初的想法是，这个名字起得带有讽刺意味，因为它看起来一点都不基础。它有以十为倍数的行号，以及听起来很奇怪的命令，如\
  \ `GOTO`、`REM` 和 `CLS`，起初看起来就像是一堆乱码。但通过大量的练习（以及许多错误），它开始变得有意义，我被代码如何让我控制计算机的行为所着迷了。我会花几个小时从杂志上抄录代码示例（是的，那是很久以前的事了！），然后尝试进行我自己的修改。正是这些对代码的实验和捣弄帮助我理解了它是如何工作的。我彻底迷上了编程的魔。\n\
  \n我对编程的喜爱源于它要求你遵循编程语言的精确规则，同时鼓励你创造性地思考以实现理想的结果。编程的本质是将抽象变为实用。当我开始写这本书时，我的目标是介绍编程的基本概念，并用大量的实践示例来支持理论。每一章的最后都有编程挑战，将帮助巩固你的理解。我鼓励你深入研究这些挑战，不仅要尝试完成它们，还要尝试用你自己的修改来扩展它们。\n\
  \n我想要编写的一直是游戏，我已经尽可能让书中的许多挑战在编写和玩耍上变得有趣。读到书结束时，你将编写了几个完全可以玩的游戏。你还将为创建交互式网站奠定基础，并处于编写全应用程序的正确道路上。\n\
  \n编程是一项创造性活动；它从根本上说是创造事物。你的代码既需要精确简洁，也需要向其中注入一些花彩让它活起来。这种精确与巧妙的结合，使得在从 Acorn Electron\
  \ 上开始编程多年后，我仍然觉得编程充满乐趣。我希望这本书能激励你开始编程，并希望你在读完最后一页后能很长地享受它。\n\n## 谁应该读这本书？\n\n这本书是为没有任何编程经验但想学习如何编程的人准备的。我们在未使用\
  \ JavaScript 来教你，所以到最后，你将对 JavaScript 有良好的理解，但你可以将所学的原理应用到其他语言。\n\n## 使用的规范\n\n\
  ### 代码示例\n\n书中的代码使用等宽字体显示，例如：\n\n```\n<h1>完美的一天</h1>\n<p>这是一个散步的好日子。鸟儿在歌唱，孩子们在学校。</p>\n\
  ```\n\n你会注意到我们使用了特定的样式来表示不同类型的信息。\n\n### 提示、注意和警告\n\n#### 嘿，你！\n\n提示提供一些建议。\n\n\
  #### 咳，借一下……\n\n注意是与主题相关但并非重要的旁注。你可以把它们视为额外的信息。\n\n#### 务必始终\n\n这些这些要点。\n\n####\
  \ 注意！\n\n警告强调了任何可能让你绊倒的坑。\n\n## 补充材料\n\n*   [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)\
  \ 是 SitePoint 的论坛，用于解决困难的问题。\n*   **books@sitepoint.com** 是我们的电子邮件地址，如果你需要联系我们报告问题或出于其他原因。\n\
  \n# 第一章：点击开始\n\n你想学习编程吗？你做了一个明智的决定。编程是一项非常值得学习的技能，而且非常有趣。它可以用于构建下一代应用程序、黑客树莓派或 Arduino、编写最新的大片游戏以及许多其他事情。事实上，一旦你学会了如何编程，唯一的限制就是你的想象力。\n\
  \n在本章中，我们将简要回顾编程的历史，查看计算机程序是什么，然后介绍 JavaScript 编程语言，我们将用它来学习编程。\n\n我们还将直接投入实践并开始编程，编写不是一个而是两个\
  \ JavaScript 程序！\n\n## 本章涵盖内容\n\n*   编程简史\n*   JavaScript 语言介绍\n*   “Hello, World!”——你的第一个\
  \ JavaScript 程序\n*   浏览器中的 JavaScript\n*   “我能画出彩虹”——你的第二个 JavaScript 程序\n*   程序员的心态\n\
  \n我们还将通过编程挑战来结束本章，帮助你测试新学到的技能——正如我们在书中每一章末尾所的那样。\n\n\n\n\n\n# 编程\n\n`Programming`（编程）是关于让计算机执行你想要它们执行。计算机程序基本上是一系列指令，告诉计算机如何执行特定任务。遗憾的是，计算机使用的语言与我们并不相同。\n\
  \n例如，你不能直接写下“把圆的颜色改为蓝色”并指望计算机能理解。编程语言充当了中介的角色：它是一种计算机和人类都能听得懂的语言。\n\n学习编程有点像学习外语，不同的是计算机对语法的要求*非常*挑剔（甚至比我的法语老师还要挑剔！）。你需要确保将每一个元素都放在正确的位置，并且语法必须完全准确无误。计算机是强大的，你可以让它们做一些真正令人惊叹的事情，但只要有一个括号放错了位置，它们就会分崩离析！\n\
  \n编写程序基本上就是为计算机编写一套需要遵循的指令。问题在于，这些必须是*非常*精确的指令。任何细微的歧义都会导致计算机执行与你设想完全不同的操作——或者它甚至可能会崩溃。\n\
  \n## 算法\n\n`algorithm`（算法）这个词现在被频繁使用。你可能听过“Instagram 算法”或“Google 搜索算法”。但算法到底是什么？“algorithm”一词是波斯数学家阿尔·花瓦西米（Al-Khwarizmi）名字的拉丁化形式，他编写了第一本代数教科书，并喜欢用分步描述的方法来解释他的方法。\n\
  \n![Al-Khwarizmi](img/alkhwarizmi.png)\n\n这导致 `algorithm` 一词被用来描述任何分步的方法。每一步要做什么以及每一步的作用应该是清晰的。例如，这里有一个泡茶的算法：\n\
  \n1. 在壶里烧水。\n2. 拿一个杯子。\n3. 拿一个茶包。\n4. 将茶包放入杯中。\n5. 水烧开后，将水倒入杯中。\n6. 浸泡两分钟。\n7. 从杯中取出茶包。\n\
  8. 拿牛奶。\n9. 在茶中加入牛奶。\n10. 搅拌茶。\n\n![Making tea](img/tea.png)\n\n### 茶后加牛奶\n\n我意识到我在茶好*之后*加入牛奶的指令可能会引起争议。如果你认为应该先加牛奶，我很抱歉，但你只能接受在这一点上你是错的。\n\
  \n这些指令看起来相当基础且直接，但其中包含许多假设，而且某些步骤有些模糊。你是如何烧水的？你从哪里拿杯子和茶包？我应该向杯子里倒多少水？这些问题都留之未答。这通常是可以的，因为大多数人な熟悉泡茶的过程，但一个从未见过别人泡茶的人可能会在遵循某些步骤时遇到困难（尽管我承认可能可能很难找到这样的人）。\n\
  \n## 伪代码\n\n`Pseudocode`（伪代码）是你编写的一种“假装”的代码，用于说明程序的功能，而无需担心实际编程语言的复杂性。它它仍然遵循程序的惯例和结构，并使用精确的命令，但不包含特定语言的细节。\n\
  \n例如，“在屏幕上显示消息”这条指令在伪代码中可以写成 `display(message)`，而在 Python 编程语言中，它会被写成 `print(message)`。注意，Python\
  \ 代码使用了非常特定的 `print` 符号，这是它用于在屏幕上显示消息的命令。其他语言使用不同的命令来基本上完成相同的功能。\n\n泡茶的示例可以用像这样的伪代码编写：\n\
  \n```\nboil(water,250ml) in kettle\nget(cup) from cupboard\nget(teabag) from box\n\
  put(teabag) in cup\nwhen(kettle boils) \n  { pour(water, 250ml) in cup }\nwait(2\
  \ mins)\nremove(teabag) from cup\nget(milk, 20ml)\nadd(milk, 20 ml) to tea\nstir(tea)\n\
  ```\n\n一个知道用特定语言编程的程序员应该能够遵循伪代码示例，然后用他们选择的语言将其编写出来。伪代码对于在开始编码之前规划程序非常有用，它也让使用不同编程语言的程序员更容易分享想法。\n\
  \n## 编程简史\n\n最早的计算机使用打孔卡片编程来表示 `binary number system`（二进制系统），这是计算机使用的数字系统。二进制系统完全由\
  \ 1 和 0 组成，大致翻译为“开”和“关”。在卡片上，有孔代表 `1`，无孔代表 `0`。之后，人们开始开发可以用来与计算机“对话”的语言。\n\n![Early\
  \ computers used punched tape to store data](img/earlycomputer.jpg)\n\n第一批计算机程序是用\
  \ `machine code`（机器码）和 `assembly language`（汇编语言）编写的。这些是 `low-level programming languages`（低级语言），与计算机硬件密切相关。这意味着这些语言很难编写，因为它们涉及编写与计算机架构深度绑定的抽象代码。事实上，现在很少有人用机器码或汇编进行编程了，但那些会这样做的人将与计算机硬件密切工作——例如，编写设备驱动程序或研究嵌入式系统。\n\
  \n`High-level programming languages`（高级编程语言）使用抽象技术，使代码更容易人类阅读和编写。程序用 `Swift`、`C#`\
  \ 或 `Java` 等语言编写，然后被编译成机器码。使用这些语言编写的程序非常快，使得高级语言适用于编写游戏和专业软件。\n\n`Scripting languages`（脚本语言）另一种高级语言，但它们是\
  \ `interpreted`（解释型）而不是 `compiled`（编译型），这意味着它们在程序运行时被翻译成机器码，而不是提前。这意味着它们通常比编译型语言慢，尽管解释器变得越来越复杂，使得某些解释语言几乎和编译语言一样快。你可能听过的常见脚本语言有\
  \ `Python`、`Ruby` 以及当然的 `JavaScript`。\n\n## JavaScript\n\n我们在书中将学习的语言是 `JavaScript`，它通常被称为\
  \ Web 语言。几乎每个网页浏览器都能运行 `JavaScript`，使其成为世界上流行的编程语言之一。\n\n`JavaScript` 是学习编程的极佳语言。它的门槛很低：学习\
  \ `JavaScript` 只需要一个浏览器。它很容易入门，基础知识容易掌握。它也是一种灵活且丰富的语言，可以创建各种强大的程序。\n\n`JavaScript`\
  \ 是一种在运行时解释并编译的脚本语言，这意味着它需要引擎来解释和运行程序。这通常由网页浏览器完成，但也有 `JavaScript` 引擎可以在没有浏览器运行。`JavaScript`\
  \ 还是一种 `dynamic`（动态）语言，这意味着程序的元素可以在运行时发生改变，不像 `C++` 这样的编译型语言。\n\n### JavaScript\
  \ 的历史\n\n万维网最初是由一系列通过链接的页面组成的。用户很快希望与这些页面有更多互动，因此 Netscape（一家早期浏览器供应商）要求其一名员工 Brendan\
  \ Eich 为他们的 Navigator 浏览器开发一种新语言。他在短短十天内设计出了名为 `Mocha` 的原型脚本语言。这种新语言后来被更名为 `LiveScript`，但随后被匆忙重新命名为\
  \ `JavaScript`，以便利用当时 Sun Microsystems 的 Java 语言所吸引的关注度。\n\n“JavaScript”这个名字经常引起一些令人困扰的混淆，导致\
  \ `JavaScript` 常被认为是“简易 Java”，尽管这两种语言完全没有关系。\n\n\n\n\nJavaScript 出于 1995 年，它开启了通过编程控制浏览器来执行任务的兴奋新时代。（不幸的是，在早期，它最常见的用途是创建弹出广告和旋转的\
  \ Logo！）\n\n到 2005 年，像 Google Maps 和 Gmail 这样的网站开始出现，它们证明了 JavaScript 能够创建丰富的互联网应用程序，其外观和行为都像原生桌面应用程序一样。这种进步一直在快速进行中，如今几乎每个网站都会以某种方式使用\
  \ JavaScript。JavaScript 已经进入了许多其他领域，如智能手机应用、可穿戴设备和数据库。\n\n![Google Maps 显示 JavaScript\
  \ 可用于创建高级 应用程序](img/maps.png)\n\n## JavaScript 版本\n\n1996 年，在欧洲计算机厂商协会（ECMA）的帮助下，决定对\
  \ JavaScript 进行标准化，由该协会托管标准。这种标准化语言被命名为 `ECMAScript`，以避免侵犯“Java”商标。这导致了更多基于名称的混淆，但最终\
  \ `ECMAScript` 被指代规范，而 `JavaScript` 被指代语言本身。情况依然如此，尽管关于更改名称的争论一直存在。有一种建议是正式将 JavaScript\
  \ 重命名为“JS”——它通常就是这样被称为它的（就像迈克尔·乔丹常被称为“MJ”一样）。\n\n当 `JavaScript` 在 1997 年标准化时，规范被称为\
  \ `ECMAScript version 1`。2015 年，决定每年发布一个新规范，并以发布的年份命名。由于这一变化，`ECMAScript version\
  \ 6` 在发布时被重命名为 `ES2015`，从那以后，每年都有新的 `JavaScript` 版本。在本书中，我们将使用最新版本的 `JavaScript`，但每年关注该语言的最新新增和变化总是值得的。\n\
  \n### 向后兼容性\n\n`JavaScript` 语言开发中的一个重要概念是`向后兼容性`（backward compatibility）。这意味着当由运行新规范的引擎解释代码时，所有旧代码必须以相同的方式工作。（这有点比说\
  \ PlayStation 5 必须能够运行为之前所有 PlayStation 创建的任何游戏）。这是为了防止 `JavaScript` 通过剧烈变化来“破坏\
  \ Web”，因为这些变化可能导致某些网站上使用的旧遗留代码在现代浏览器中无法按预期运行。\n\n在本书书中，我们假设你正在使用能够运行最新版本 `JS` 的现代浏览器。（尝试更新到你最喜欢的浏览器的最新版本。）\n\
  \n关于 `JavaScript` 的话足够了。让我们写你的第一个程序吧！\n\n## Hello, World! 你的第一个 JavaScript 程序\n\n\
  学习编程语言时，从 `Hello, World!` 程序开始是一个传统。这是一个简单的程序，通过输出“Hello, World!”短语来宣布你来到编程世界。\n\
  \n我们将遵循这一传统，用 `JavaScript` 编写一个 Hello, World! 程序。它将是一个单条语句，向控制台记录“Hello, World!”短语。\n\
  \n### 控制台？\n\n`console`（控制台）基本上是一个用于运行代码的命令行提示符。你可以输入一段代码，它将进行求值并将输出记录到屏幕。控制台是测试和实验代码的极佳方法。你可以在计算机终端中运行\
  \ `JS` 控制台，也可以在智能手机和平板上使用 `JS` 控制台应用。还有许多网站在浏览器中运行控制台，大多数浏览器也内置了控制台。\n\n在本书书中，我们主要使用在线的\
  \ [jsconsole.com](https://jsconsole.com) 作为我们的控制台。我建议你用它来尝试运行书中各处出现的代码片段，以感受它们是如何工作的。通过输入代码来感受总比只阅读要好。这意味着你还可以通过更改代码并检查结果来实验代码。\n\
  \n控制台的另一个选项是使用浏览器内置的控制台。要打开它，只需根据你的浏览器遵循以下指令：\n\n*   **Firefox**: 按住 `Shift` + `Ctrl`\
  \ + `J`（或在 Mac 上为 `Option` + `⌘` + `J`）或按 `F12`\n*   **Safari**: 按住 `Option` + `⌘`\
  \ + `C`（注意，你需要先在偏好中启用开发者菜单）\n*   **Chrome**: 按住 `Shift` + `Ctrl` + `J`（或在 Mac 上为\
  \ `Option` + `⌘` + `J`）或按 `F12`\n*   **Edge/Internet Explorer**: 按 `F12`\n\n一旦你在浏览器中打开控制台，它的作用将与\
  \ `jsconsole.com` 完全相同。下面的图片显示了 Chrome 的内置控制台。\n\n![Chrome 的内置控制台](img/chromeconsole.png)\n\
  \n好了，让我们写我们的第一个程序。前往 [jsconsole.com](https://jsconsole.com) 或打开浏览器的控制台，输入以下代码，然后按下\
  \ `Enter` 键：\n\n```\nconsole.log('Hello, World!');\n```\n\n### Enter? Return?\n\n\
  我刚才让你按下键盘上的 `Enter` 键。为了清楚起见，在大多数 PC 键盘上，你会在右侧看到 `Enter` 键。（有时它只是一个箭头符号：`↵`。）在 Mac\
  \ 键盘上，你大多会看到一个 `return` 键。为了简单起见，从以后我将统称为 `Enter`。\n\n如果一切顺利，你应该会在屏幕上看到“Hello, World!”——如下所示。\n\
  \n![Hello, World!](img/chhelloworld.png)\n\n恭喜！你刚刚写了你的第一个程序！这看起来没什么，但一位智者曾说过，程序员的旅程始于一行代码！\n\
  \n## 浏览器中的 JavaScript\n\n我之前说过 JavaScript 是一种解释型语言，需要运行环境。由于它的起源，`JavaScript` 运行的主要环境是浏览器，尽管它也可以在其他环境中运行。\n\
  \n目前 `JavaScript` 最常见的用途仍然是让网页具有交互性。正因如此，在继续之前，我们应该看一看构成网页的内容。\n\n### 网页的结构\n\n\
  几乎所有的网页由三个关键部分组成：HTML、CSS 和 JavaScript。HTML 用于标记页面内容，CSS 是决定页面外观的呈现层，而 JavaScript\
  \ 则增加了让页面执行任务的交互性。这三种技术共同被称为 *Web 的三层*。在 HTML 中添加 CSS 和 JavaScript 是可能的，但将每一层的代码分开是良好的习惯。\n\
  \n为了避免你花费大量时间来设置和编写网页，书中的许多示例将使用 [CodePen](https://codepen.io) 网站。该网站已为你准备好一切，你只需要添加任何\
  \ HTML、CSS JS 代码即可创建一个功能性的网页。它还将 Web 的三层分在编辑器顶部的三个部分，正如下面的截图所示。\n\n![CodePen 编辑器将\
  \ HTML、CSS 和 JS 分为三个不同的部分](img/codepen.png)\n\nCodePen 还提供了一个控制台。在书中的各个地方，你会发现在\
  \ CodePen 的 **JS** 部分输入 JavaScript 代码，然后通过打开 CodePen 控制台查看这些代码在背后的执行情况。你可以点击 CodePen\
  \ 界面左下角的 **Console** 标签来访问它。\n\n#### 在线编辑器与离线工作\n\n\n\n\n\n还有许多其他方法可以在 HTML 和 CSS\
  \ 运行 JavaScript 代码。只需搜索“online JavaScript editor”查看更多在线选项。你也可以离线工作（即仅在你的电脑上），通过在文本编辑器中编写代码并在浏览器中打开它。访问“[HTML5\
  \ Template：适用于任何项目的基础模板](https://www.sitepoint.com/a-basic-html5-template/)”获取有关如何设置此类内容的说明。\n\
  \n让我们尝试编写我们的第二个程序。\n\n## 我可以编写彩虹：你的第二个 JavaScript 程序\n\n我们将用第二个在浏览器中运行的 JavaScript\
  \ 程序来结束本章。这个示例比上一个复杂得多，包含了许多在后续章节中深入介绍的概念，所以如果你在现阶段没有完全理解正在发生的一切，请不要担心！此处的目的是向你展示\
  \ JavaScript 的能力，并交互式地介绍一些后续章节中将涵盖的重要概念。\n\n前往 [CodePen 网站](https://codepen.io)\
  \ 并开始一个新的 Pen。\n\n在 **HTML** 部分添加以下内容：\n\n```\n<button id='button'>click me</button>\n\
  ```\n\n这将显示一个 ID 为 `button` 的按钮。`ID` 属性是我们的 JavaScript 程序识别并操作页面上某些元素的有用方式。它看起来应该和下面的图片相似。\n\
  \n![点击我](img/button.png)\n\n实际的 JavaScript 代码位于 **JS** 部分。添加以下行代码：\n\n```\nconst\
  \ button = document.getElementById('button');\n\nconst colors = ['red','orange','yellow','green','blue','rebeccapurple','violet'];\n\
  \nfunction change() {      \n  document.body.style.background = colors[Math.floor(7*Math.random())];\n\
  }\n\nbutton.addEventListener('click', change);\n```\n\n我们程序的的第一行创建了一个名为 `button`\
  \ 的变量。（我们在 第 2 章 中介绍了变量。）\n\n然后我们使用 `document.getElementById` 函数来查找 ID 为 `button`\
  \ 的 HTML 元素。这就是我们在 HTML 部分创建的那个按钮元素。它被赋值给变量 `button`，因此从现在起，每当我们引用 `button` 时，程序都知道我们在谈论那个按钮。（查找\
  \ HTML 元素将在 第 10 章 中介绍。）\n\n我们现在创建了另一个名为 `colors` 的变量，它被赋值为一个包含字符串列表的数组，代表彩虹的不同颜色。（我们在\
  \ 第 3 章 中介绍了字符串，在 第 5 章 中介绍了数组。）\n\n然后我们创建了一个名为 `change` 的函数。（我们在 第 8 章 中介绍了函数。）这会将网页中\
  \ body 元素的背景颜色设置为 `colors` 数组中的一种颜色。（更改页面外观将在 第 10 章 中介绍。）\n\n`change` 函数还使用随机数从数组中随机选择一种颜色。（数字，包括生成随机数将在\
  \ 第 4 章 中介绍。）\n\n程序以一个**事件处理器**结束，它负责监听按钮被点击事件。当这种情况发生时，它会运行我们刚刚定义的函数。（事件以及如何处理它们将在\
  \ 第 11 章 中介绍。）\n\n尝试点击几次按钮。如果一切运行正常，背景应该变为彩虹的每种颜色！\n\n你可以查看 [CodePen 上的我的代码](https://codepen.io/SitePoint/pen/PoGgVKB)。\n\
  \n### Rebecca Purple\n\n`rebeccapurple` 是十六进制代码为 `#663399` 颜色的官方名称。它以网页设计师 Eric\
  \ Meyer 的女儿命名，她的女儿不幸去世了，时年仅六岁。这是她最喜欢的颜色，作为对她的纪念，被加入了 CSS 颜色的官方列表中。\n\n## 程序员的思维\n\
  \n在我们结束本章之前，我们需要谈谈*编程风格*。显然，编写计算机程序的目的是让它执行它应该做的事情，但程序的风格也同样重要。你的代码应该是清晰简洁的，并且在遵循规范方面要保持一致——从你为变量选择的名称到你在代码块之间留下的空白量。你的代码还应该是易读的，并包含解释代码作用的注释。\n\
  \n你应该始终寻找改进代码的方法，使其更高效、更易遵循。这个过程被称为**重构**，应该定期进行，以便让你的代码保持更新而不会变得过时。\n\n编程中的一个重要原则是“不要重复自己”规则，或\
  \ **DRY**。这意味着你应该始终寻找避免重复大量代码的方法。遵循这一原则有助于让你的代码更灵活、更易维护和更新。（更改一处代码比更改数百处代码要容易得多！）如果这听起来有点像程序员很懒，那么你完全正确！一个好的程序员总是寻找以最高效、最优雅的方式编写完成任务的代码。代码越少意味着\
  \ Bug 的概率越小，也更容易维护。\n\n一个好的程序并不是瞬间出现的。它始于一个计划，并有机地成长为完成状态。开发一个程序涉及大量的问题解决，有时你会走错弯路并卡住。这是正常现象，你应该准备好进行更改和适应。\n\
  \n## 挑战\n\n1. 尝试用伪代码描述一些日常任务，例如刷牙或骑自行车。\n2. 编写一段伪代码来找到数字列表中的最大值。\n3. 尝试使用 `console.log()`\
  \ 在控制台中打印不同的消息。\n4. 在“我可以编写彩虹”程序的数组中添加更多颜色。\n\n## 总结\n\n*   算法是用于完成特定任务的一系列步骤指令。\n\
  *   伪代码用于在不使用特定编程语言的情况下编写程序。\n*   JavaScript 创建于 1995 年，被认为是 Web 语言。\n*   JavaScript\
  \ 的主要环境是浏览器，但它也可以在其他环境中运行。\n*   每个 JavaScript 版本都必须与旧版本向下兼容。\n*   代码应该是易读的，并定期进行重构以保持运行顺畅。\n\
  *   编码时记住 DRY 原则。不要重复自己！\n\n在下一章中，我们将开始开始学习一些基础知识。让我们开始吧！\n\n\n\n\n\n在你成为程序员的旅程中，第一个任务是学习如何给代码添加“注释”。编程中的`Comments`（注释）就像书中的旁注：它们是解释代码目的和逻辑的说明。这看起来可能像是一个很奇怪的起点，因为编程语言会忽略注释。它们不会产生任何作用。尽管如此，注释仍然极其重要。注释良好的代码是熟练程序员的标志。注释让任何阅读你代码的人（包括你以后！）都能更容易理解正在发生什么——相信我，当你几周后再次回来读到这些代码时，你会感谢自己自己写了注释的。不过，你不需要写长篇文章，只需要写足够让人清楚代码意图的注释即可。\n\
  \n添加注释的方法在不同的编程语言中有所不同。在`JavaScript` 中，有两种类型的注释：\n\n*   单行注释以 `//` 开始，并在行尾结束：\n\n\
  ```\n// this is a short comment\n```\n\n*   多行注释以 `/*` 开始，以 `*/` 结束：\n\n```\n/*\
  \ This is a longer comment\n这里的任何内容都将被忽略\n这是一个放置注释的好地方\n*/\n```\n\n在代码中编写注释是一个良好的习惯，但要确保注释是有用的，而不仅仅是描述代码本身已经显而易见的内容。例如，下面的注释并没有增加任何代码本身并不显而易见的信息：\n\
  \n```\n// log the message to the console\nconsole.log(message);\n```\n\n将注释看作写给未来自己的笔记很有用，它们可以提醒你编写那段特定代码时的思考过程。例如，这里有一条注释解释了代码是通过用户点击左箭头键激活的：\n\
  \n```\n// user has clicked on the left arrow key so move left\ncharacter.style.left\
  \ = left - speed + 'px';\n```\n\n## 编程语法\n\n正如我在上一章中提到的，编程语言类似于口语语言，因为每种语言都有它们自己的语法规则和特点。在本节中，我们将查看编程语言是如何编写的，并结合具体的\
  \ `JavaScript` 示例。\n\n### 语句 (Statements)\n\n程序由一系列`statements`（语句）组成。例如，这里是两个伪代码语句：\n\
  \n```\nstore response to 'Please enter your name.' as name\nprint name to screen\n\
  ```\n\n在`JavaScript` 中，这将是：\n\n```\nconst name = prompt('Please enter your name.');\n\
  alert(name);\n```\n\n#### 以分号结束行 (Ending Lines with Semicolons)\n\n我在上面的每一行末尾都加了分号。严格来说，`当一个语句单独占成一行时`，并不需要用分号结束该语句，但这被认为是一种良好的习惯，这也是我在整本书中将一直做的做法。我鼓励你也这样做，以养成这种习惯。相信我，当你以后编写更大、更复杂的程序时，这将会非常有用的！\n\
  \n如果你在一行中有多个语句，你确实需要用分号将它们隔开。但让每条语句单独占一行会让你的代码更整洁、更易读。\n\n### 块 (Blocks)\n\n一个`block`（代码块）是集合在一起的一系列语句。不同的编程语言有各种方式在块内部收集语句。有些使用关键字来标记块的开始和结束，而另一些则使用缩进来表示块。`JavaScript`\
  \ 使用大括号来包围代码块，如下例所示：\n\n```\n{\n  // 这是一个包含一个注释和两个语句的块\n  const name = prompt('Please\
  \ enter your name.');\n  alert(message);\n}\n```\n\n注意，块不需要用分号结束。\n\n### 空格字符 (Whitespace)\n\
  \n`Whitespace`（如空格、制表符和换行符）用于分隔你代码的不同部分。`JavaScript` 允许你使用所需的任意空格字符来格式化代码，使其整洁且易于阅读。空格字符基本上被程序本身完全忽略。这些示例包括使用空格缩进嵌套代码，以及使用多行来分隔代码块。事实上，这是被高度推荐的，因为良好的代码应该是易于理解的。\n\
  \n在某些语言中，空格字符是程序的一部分。例如，Python 显式使用换行符来开始新语句，并使用行头的空格来开始一个新的代码块。\n\n### 数据类型 (Data\
  \ Types)\n\n编程语言中的每个值都有一个`type`（类型），描述它所包含的数据。这决定了语言将如何解释和使用该值。数据类型决定了它可以取什么值以及它能做什么。\n\
  \n`Primitive data types`（原始数据类型，或简称 `primitives`）在编程语言的底层得以实现，本质上它们是任何程序的构建构建块。原始类型是`immutable`（不可变的），这意味着它们不能被改变或修改。大多数语言都包含了以下原始数据类型的某些变体：\n\
  \n*   `Character`（或 `char`）：单个字符，如字母、数字或符号——例如 `T`、`3`、`@`\n\n*   `String`（字符串）：引号内的字符集合——例如\
  \ `'Hello'`、`\"123!\"`\n\n*   `Integer`（整数）：可以是正负的整数——例如 `7`、`-100`、`0`\n\n*   `Float`（浮点数）：带有小数数字，通常以十进制表示——例如\
  \ `2.5`、`3.14159`、`-7.0`\n\n*   `Boolean`（布尔值）：`Boolean`值可以是“true”（真）或“false”（假）\n\
  \n`JavaScript` 没有 `char` 原始类型，但它确实有“strings”（字符串，我们在下一章将讨论），`char` 可以由单个字符表示。`JavaScript`\
  \ 并不区分整数和浮点数。它只有一个 `Number` 原始类型，我们将在第 4 章介绍。\n\n布尔值是 `JavaScript` 包含的原始类型之一，我们将在第\
  \ 6 章介绍它们。\n\n#### `symbol`、`bigint` 和 `undefined`\n\n`JavaScript` 还有其他三种原始值：`symbol`、`bigint`\
  \ 和 `undefined`。我们不会在书中介绍 `symbol` 和 `bigint`，因为它们的使用不像其他原始类型那样频繁。然而，我们在稍后会要介绍 `undefined`，因为你可能会遇到它。\n\
  \n`Composite data types`（复合数据类型）是由原始类型组合而成的。`JavaScript` 有两种主要的复合类型：“arrays”（数组，我们将在第\
  \ 5 章介绍）和“objects”（对象，我们将在第 9 章介绍）。这两种复合类型都是 mutable（可变的），这意味着它们在创建后可以被更新。\n\n####\
  \ `Map` 和 `Set`\n\n`JavaScript` 还有两种名为 `Map` 和 `Set` 的复合数据类型，但我们不会在书中介绍它们。\n\n###\
  \ 你是什么类型？\n\n让我们通过编写一些代码来探索 JavaScript 使用的不同类型。有一个名为 `typeof` 的特殊运算符，可以用来判断一个值的数据类型。你只需要输入\
  \ `typeof`，后面跟着该值，就会返回其类型。\n\n如果一个值不是原始数据类型之一，`JavaScript` 将返回 `object` 或 `function`。（这些都将在后的章节中介绍。）\n\
  \n让我们再次打开控制台进行一些测试。（提示：一旦你输入了第一行——例如 `typeof 'hello'`——按下 `Enter` 键获取结果，`<< 'string'`。）尝试输入以下代码——逐行输入——以研究各种表达式的类型：\n\
  \n\n\n\n\n```javascript\ntypeof 'hello'; // see Chapter 3\n<< 'string'\n\ntypeof\
  \ 10; // see Chapter 4\n<< 'number'\n\ntypeof true; // see Chapter 6\n<< 'boolean'\n\
  \ntypeof { name: 'JavaScript' }; // see Chapter 9\n<< 'object'\n\ntypeof [ 1, 2,\
  \ 3 ]; // this is an array, covered in Chapter 5, it's also considered an object\n\
  << 'object'\n\ntypeof function(){ }; // this is an empty function, more interesting\
  \ functions are covered in Chapter 8\n<< 'function'\n```\n\n尝试再自己写几个，直到你确信什么是字符串、数字和布尔值。\n\
  \n## 运算符 (Operators)\n\n`operator`（运算符）对一个值执行操作，该值被称为 `operand`（操作数）。一元运算符（unary\
  \ operator）只需要一个操作数。`typeof` 是我们已经用过的一个 JavaScript 运算符示例：\n\n```javascript\ntypeof\
  \ 'hello';\n<< 'string'\n```\n\n运算符是 `typeof`，而字符串 `'hello'` 是操作数。\n\n`binary operator`（二进制运算符）需要两个操作数。例如：\n\
  \n```javascript\n3 + 5\n```\n\n运算符是 `+`，数字 `3` 和 `5` 是操作数。\n\n还有 `ternary operator`（三元运算符），用于评估逻辑语句并需要三个操作数。这在第\
  \ 6 章 中介绍。\n\n## 变量 (Variables)\n\n`Variables`（变量）在编程语言中用于引用存储在内存中的值。它们为我们提供了方便的方法来引用程序中的不同值。它们可以认为是指向不同值的标签。变量是处理长表达式的有用方法，因为它们避免了重复输入这些表达式。\n\
  \n#### 声明和赋值变量 (Declaring and Assigning Variables)\n\n在大多数编程语言中，变量在使用之前必须被`declared`（声明）。这意味着需要在代码中显式地引用它们，并可能进行赋值。\n\
  \n在`strongly typed`（强类型）语言中，变量类型必须与变量一起声明。例如，如果我们想使用变量 `name` 表示字符串 `'Homer Simpson'`，在强类型语言中可能会使用以下代码：\n\
  \n```javascript\nlet name:string = \"Homer Simpson\";\n```\n\n这不仅将变量 `name` 设置指向字符串\
  \ `'Homer Simpson'`，还声明了该变量将是一个字符串。如果你在程序后面尝试将该变量赋值为另一个`not`（不是）字符串的值，将导致错误。\n\n\
  `Weakly typed`（弱类型）编程语言并不坚持在声明时显式说明变量的类型。类型被认为是从赋值给它的实际值隐式产生的，尽管从理论上讲你可以在程序的稍后将变量赋值为不同的类型而不会产生任何问题。在弱类型语言中，可以使用以下代码将变量\
  \ `name` 设置为字符串 `'Homer Simpson'`：\n\n```javascript\nname = \"Homer Simpson\";\n\
  ```\n\n这仍然具有将变量 `name`指向字符串 `'Homer Simpson'` 的效果，但它没有显式说明该变量是字符串，因为这在赋值字符串这一事实中是隐含的。\n\
  \n#### 鸭子类型 (Duck Typing)\n\n动态编程语言（如 Ruby 和 Python）中一个常用概念是 `duck typing`（鸭子类型）。这基于一句话：“如果它走得像鸭子，叫得也像鸭子，那么它就是一只鸭子”。\n\
  \n这句话的本质是不需要担心值或对象的类型。如果它按照预期的方式工作，无论它什么类型并不重要。重点是检查代码的输出是否符合预期，而不是输入的类型。\n\nJavaScript\
  \ 是一种弱类型语言，因此在声明变量时不需要指定类型。这起初看起来可能是一个优势，但当不清楚一个变量应该是什么类型时，它可能会让调试程序变得困难。\n\n####\
  \ TypeScript\n\n[TypeScript](https://www.typescriptlang.org) 是 JavaScript 的扩展，它提供了在声明变量时显式指定变量类型的选项——实际上使其成为了强类型版本的\
  \ JavaScript。它还添加了一些其他功能，旨在使在 JavaScript 中构建大型应用程序更容易。\n\n#### 常量 (Constants)\n\n\
  许多语言还包含了 `constants`（常量），它们的工作方式与变量类似，不同之处它们的值永远不会改变。使用全大写字母表示常量是常见做法。一个例子是常量 `pi`\
  \ 的值（圆周与直径的比率）：\n\n```javascript\nPI = 3.14159;\n```\n\nJavaScript 原本使用 `var` 关键字声明所有变量。更现代的\
  \ JavaScript 版本引入了 `const` 和 `let` 关键字——`const` 用于声明不能重新赋值为新值的变量，`let` 用于声明在程序运行会变化的变量。你可能在某些代码示例中仍看到\
  \ `var`，它的作用几乎与 `let` 相同。`var` 和 `let` 最大的区别在于块作用域（block scope），这在第 13 章 中讨论。\n\n\
  #### JavaScript 中的常量 (Constants in JavaScript)\n\n尽管引入了 `const` 关键字，但重要的是，JavaScript\
  \ 仍然不支持严格意义上的常量。尽管你不能更改使用 `const` 创建的变量的值，但如果该变量包含数组或对象，你可以更改它的属性和值（因为它们是可变的）。\n\
  \n### 赋值 (Assignment)\n\n**Assignment**（赋值）是给常量或变量赋值的过程。大多数语言使用 `=` 运算符来实现此。\n\n\
  让我们在 JavaScript 中尝试声明并赋值一些变量。示例展示了我们如何声明变量 `name` 并赋值 `'JavaScript'`。将以下代码复制到控制台：\n\
  \n```javascript\nconst name = 'JavaScript';\n```\n\n变量 `name` 现在的值为 `'JavaScript'`，因此对\
  \ name 的引用与字符串 `'JavaScript'` 完全相同。我们可以通过检查 name 的类型来验证这一点：\n\n```javascript\ntypeof\
  \ name;\n<< 'string'\n```\n\n使用 `const` 意味着你不能将变量 `name` 重新赋值为另一个值。如果你尝试，将会得到错误。当我们尝试将\
  \ `name` 的值重新赋值为 `'JS'` 时：\n\n```javascript\nname = 'JS';\n<< TypeError: Assignment\
  \ to constant variable.\n```\n\n正如你所见，我们得到了错误信息，并且 `name` 变量仍然指向 `'JavaScript'`：\n\
  \n```javascript\nname;\n```\n\n使用 `const` 似乎是一种限制，但如果值不能改变，它实际上有助于让程序更具预测性。\n\n\
  现在让我们尝试声明并赋值一个可以变化的变量。接下来的示例展示了我们如何声明变量 `score` 并赋值为 `0`：\n\n```javascript\nlet\
  \ score = 0;\n```\n\n变量 `score` 的值初始为 `0`，但它可以在程序过程中变化。\n\n使用 `let` 关键字声明的变量可以在程序的任何时候重新赋值另一个值。这是通过简单给它们赋值新值来实现的。例如，我们可以更新\
  \ `score` 变量为 `5`：\n\n```javascript\nscore = 5;\n```\n\n注意，在重新赋值变量时不需要使用 `let`。它只在第一次声明变量时需要。\n\
  \n### 未定义 (Undefined)\n\n`undefined` 是一种原始数据类型，JavaScript 将其分配给任何显式赋值的变量。它基本上是 JavaScript\
  \ 表达“我找不到这个值的方式”。例如，尝试在控制台中声明一个新变量 `score`，但不给它赋值：\n\n```javascript\nlet score;\n\
  ```\n\n\n\n\n\n```\nlet score;\n```\n\n现在来看这个变量。你会发现 JavaScript 已经给它赋值为 `undefined`\
  \ 的值：\n\n```\nscore;\n<< undefined\n```\n\n## 变量命名\n\n在为常量和变量命名时，你应该尝试给它们起一个合理的名称，描述该变量所代表的内容。例如，`characterSpeed`\
  \ 比 `ac12` 是更好的变量名。\n\n在 JavaScript 中，变量名可以以任何大写或小写字母、下划线（`_`）或美元符号（`$`）开头。它们可以`包含`数字，但不能以数字开头。\n\
  \n以下是一些有效的变量名示例：\n\n```\n$name\n_answer\nfirstName\nlast_name\naddress_line1\n```\n\
  \n变量名是区分大小写的，因此 `ANSWER`、`Answer` 和 `answer` 都是不同的变量。\n\n在为常量和变量名使用多个单词时，有两种常用的约定：\n\
  \n*   `camelCase`（小驼命名法）以小写字母开头，然后每个新单词的首字母大写：\n\n    ```\n    firstNameAndLastName\n\
  \    ```\n\n*   `underscore`（下划线命名法）用下划线分隔每个新单词：\n\n    ```\n    first_name_and_last_name\n\
  \    ```\n\nJavaScript 的内置函数使用 `camelCase` 表示法，这可能是你在编写代码时命名变量时应该遵循的最佳约定。最重要的一点是`保持一致性`。\n\
  \n### 变量名中的符号\n\n在变量名的开头使用 `$` 和 `_` 等符号通常不是一个好主意，因为许多 JavaScript 库都会这样做，这可能会导致问题变得非常混乱。（`library`\
  \ 是由他人编写的用于特定目的的代码，你可以将其与自己的代码一起使用。）\n\n## 弹出交互\n\nJavaScript 提供了三种不同类型的弹出框，用于在浏览器和用户之间提供一些简单的交互。\n\
  \n### 警告框 (Alert Box)\n\n`alert` 框可以显示消息。用户必须点击按钮才能将其移除。\n\n这是一个示例，它将在对话框中显示“Hello”消息：\n\
  \n```\nalert('Hello');\n```\n\n![Alert 弹出框](img/alert1.png)\n\n你还可以使用 `alert()`\
  \ 来显示变量的值：\n\n```javascript\nconst message = 'HELLO THERE!';\nalert(message);\n\
  ```\n\n![带有变量的 Alert 弹出框](img/alert2.png)\n\n### 提示框 (Prompt Box)\n\n`prompt` 框允许用户输入响应，然后可以将其存储在变量中。在下面的示例中，用户被要求输入名称并将响应存储在名为\
  \ `name` 的变量中：\n\n```javascript\nconst name = prompt('What is your name?');\n```\n\
  \n![提示弹出框](img/prompt1.png)\n\n在提示框中输入的任何内容现在都会存储在变量 `name` 中。我们可以在控制台中输入 `name`\
  \ 来查看它现在持有在提示框中输入的值。\n\n![提示的回答被存储在变量中](img/prompt2.png)\n\n### 确认框 (Confirm Box)\n\
  \n`confirm` 框允许用户确认或取消请求。如果用户点击“确定”，则响应将存储为 `true`；如果他们点击“取消”，则存储为 `false`。\n\n\
  例如，以下代码可以用于确认用户是否同意使用其个人数据：\n\n```javascript\nconst permission = confirm('Do you\
  \ give consent for us to steal all of your personal data?');\n```\n\n![确认弹出框](img/confirm1.png)\n\
  \n响应将存储在变量 `permission` 中，可以通过在控制台中输入此内容查看。\n\n![拒绝权限!](img/confirm2.png)\n\n实践中，大多数用户认为这些弹出框很烦人，在大多数实际情况下绝对不建议使用。但它们确实为我们提供了一种提供交互性和从用户那里获取信息的方便方法——至少在我们在本书后面学习更高级的技术之前是。\n\
  \n### 你好 `name`\n\n现在我们已经学习了所有变量以及如何使用弹出框从用户那里收集信息并存储在变量中，让我们尝试写一些代码来为用户提供个性化的问候。\n\
  \n打开 CodePen 并在 `JS` 部分添加以下代码：\n\n```javascript\n// 询问用户的姓名\nconst name = prompt('Please\
  \ enter your name.');\n// 问好\nalert('Hello');\n// 然后进行个性化处理！\nalert(name);\n```\n\
  \n希望注释解释了代码中每行发生了什么：我们使用提示框询问用户的姓名，然后使用警告框说你好，接着是第二个警告框，它对问候进行了个性化处理。\n\n### 自动更新预览\n\
  \nCodePen 有一个名为“自动更新预览”的功能，它在你编写代码时不断运行代码。如果你的代码中包含弹出框，这可能会很烦人，因为你需要关闭它们才能继续编写代码……而且它们不会停止弹出！这有一个简单的解决办法：在\
  \ Pen 中，只需点击 `Settings` 标签页（右上角） > `Behavior` 并关闭 `Auto-Updating preview`。你将得到一个\
  \ `Run` 按钮，可以在完成所有编写后按下它运行你的代码。\n\n尝试运行代码。你应该看到类似下面的内容：\n\n![在提示框中输入 DAZ，然后消息显示\
  \ Hello DAZ!](img/helloname.png)\n\n你可以在[此处查看我的代码](https://codepen.io/SitePoint/pen/NWRQKQK)。\n\
  \n## 挑战\n\n1.  为“Rainbow”程序添加注释，解释每行发生了什么。你可以在[此处查看](https://codepen.io/SitePoint/WwZM)。\n\
  \n2.  找出以下值的类型。你能猜到吗？\n\n    ```\n    42\n    'Twenty20'\n    '123'\n    true\n\
  \    FALSE\n    'true'\n    0\n    ```\n\n    你可以在[此处查看](https://codepen.io/SitePoint/KKgOP)。\n\
  \n3.  使用提示框或确认框收集一些信息并存储在变量中。然后使用警告框显示消息。你可以在[此处查看](https://codepen.io/SitePoint/ZEpgzw)。\n\
  \n## 总结\n\n*   注释被程序忽略，但能让你的程序更易读。\n*   原始类型是程序的构建构建块。\n*   JavaScript 中的原始类型包括字符串（strings）、数字（numbers）和布尔值（Boolean）。\n\
  *   复合数据类型是原始类型的结构化集合。\n*   JavaScript 中的复合数据类型包括数组（arrays）和对象（objects）。\n*   变量指向内存中的值并使用\
  \ `const`、`let` 或 `var` 关键字声明。\n*   使用 `=` 运算符将值赋值给变量。\n*   使用 `const` 声明的变量的值无法更改。\n\
  *   可以使用 `let` 或 `var` 重新给变量赋值。\n*   警告、提示和确认框可以用于网页和用户之间提供一些交互。\n\n在下一章中，我们将更深入地查看字符串如何显示字母和单词。\n\
  \n# 第 3 章：字母与单词\n\n在本章中，我们将查看编程语言如何表示和使用字母和单词。我们还将查看 JavaScript 如何使用字符串表示它们。我们将涵盖以下内容：\n\
  \n   字符与字符串\n*   JavaScript 中的字符串\n*   转义值\n*   查找字符\n*   字符串长度\n*   字符串算术\n*  \
  \ 字符串方法\n*   模板字量和插值\n\n## 字符与字符串\n\n正如我们在上一节中看到的，大多数编程语言都有字符（单个字符）和字符串（字符集合）的原始类型。事实上，你几乎可以认为字符串是一个由字符串连接在一起的字符集合：\n\
  \n![字符串上的字符](img/string.png)\n\nJavaScript 只有一种原始数据类型 String，但它可以用于表示单个字符，也可以表示单词和较长的文本块。这里是一些字符串示例：\n\
  \n```\n'M'\n'@'\n`Hello`\n\"Easy as 1,2,3\"\n`What The F*!#?`\n\"A long time ago,\
  \ in a galaxy far, far away.\"\n'   '\n''\n```\n\n#### 空字符串\n\n\n\n\n最后一个示例只是一个空字符串，内部什么都没有，甚至连空格也没有。这仍然被视为字符串。\n\
  \n字符串可以表示单词、文本段落，甚至是如 HTML 这样的标记。用户输入的几乎所有数据最初都会存储为字符串。\n\n## 在 JavaScript 中创建字符串\n\
  \n创建字符串非常简单。你只需要将其写在引号中。打开控制台并尝试输入以下字符串：\n\n```\n'Hello';\n<< \"Hello\"\n```\n\n\
  这被称为 `string literal`（字符串字面量），因为值的字面表示被直接写在了代码中。你可以使用双引号或单引号来创建字符串字面量。在控制台中尝试以下示例：\n\
  \n```\n\"I'm also a string literal.\"\n<< \"I'm also a string literal.\"\n```\n\n\
  如果你想在字符串中使用单引号作为撇号（apostrophe），那么双引号就会很有用。如果你在上面的字符串周围使用单引号，撇号将终止字符串并导致错误，如下代码所示：\n\
  \n```\n'Don't do this.'\n<< SyntaxError { Unexpected token, expected ; (1:19) }\n\
  ```\n\n但使用双引号可以修复它：\n\n```\n\"That's the way to do it.\" \n<< \"That's the way to\
  \ do it.\"\n```\n\n## 转义值\n\n也可以 `escape`（转义）引号。这是通过在撇号之前放置反斜杠来实现，使其在字符串内部显示为撇号而不是终止字符串。在控制台中输入以下内容：\n\
  \n```\n'It\\'s okay if you escape the apostrophe.'\n<< \"It's okay if you escape\
  \ the apostrophe.\"\n```\n\n反斜杠可以向字符串中插入特殊的空白字符，例如：\n\n* `\\n`: 换行\n* `\\r`: 回车\n\
  * `\\t`: 制表符\n\n如果你想实际写入反斜杠，需要用另一个反斜杠对其进行转义：\n\n```\n\"This is a backslash \\\\\"\
  \n<< \"This is a backslash \\\"\n```\n\n## 查找字符\n\n尽管 JavaScript 没有 `char` 数据类型，但它仍然可以将每个字符串拆分为单个字符。\n\
  \n你可以通过使用 `charAt()` 方法找到字符串中的特定字符。我们可以使用 `dot notation`（点符号符号）对字符串应用方法。这涉及写一个点，后跟我们想要使用的方法。例如，以下代码将告诉我们字符串\
  \ `'Hello'` 中位置 1 的字符是什么。在控制台中输入它：\n\n```\n'Hello'.chartAt(1);\n<< \"e\"\n```\n\n\
  在这个示例中，括号中的数字 `1` 用来指示我们想要知道的字符的位置。\n\n上面的结果告诉我们字符 “e” 位于位置 1。如果你好奇为什么它不是 “H”，这是因为字符串中的第一个字符被归类为位置\
  \ 0。（你会发现在编程中，计数通常从零开始！）\n\n![查找字符](img/charat.png)\n\n还有一种使用方括号 `[]` 引用字符串中单个字符的快捷符号。例如，以下代码将告诉我们字符串的第一个字母：\n\
  \n```\n'Hello'[0];\n<< \"H\"\n```\n\n这种符号为我们引用字符串内部的每个字符提供了一种方便的方法。\n\n## 查找字符\n\
  \n如果你想找到某个字符或子字符串在字符串中出现的位置，可以使用 `indexOf()` 方法。这将返回字符在字符串中第一次出现的位置。在下面的示例中，我们用它来找到字符\
  \ “l” 第一次出现在位置 2（记住计数从零开始，这意味着它是字符串中的第三个字符）：\n\n```\n'Hello'.indexOf('l');\n<< 2\n\
  ```\n\n如果字符不在字符串中出现，将返回 `-1`：\n\n```\n'Hello'.indexOf('z');\n<< -1\n```\n\n如果我们想要字符或子字符串的最后一次出现，可以使用\
  \ `lastIndexOf()` 方法。例如，这告诉我们字符 “l” 在字符串 `'Hello'` 中最后一次出现在位置 3：\n\n```\n'Hello'.lastIndexOf('l');\n\
  << 3\n```\n\n如果我们只需要知道字符串是否包含某个字符，可以使用 `includes()` 方法。这将返回布尔值 `true` 或 `false`，取决于该字符是否在字符串中，如下代码示例所示：\n\
  \n```\n'Hello'.includes('e');\n<< true\n\n'Hello'.includes('z');\n<< false\n```\n\
  \n我们还可以检查字符串是否以某个字符开头 `starts`。为了这一点，我们可以使用 `startsWith()` 方法。但注意，它是区分大小写的：\n\n\
  ```\n'Hello'.startsWith('H');\n<< true\n\n'Hello'.startsWith('h');\n<< false\n```\n\
  \n我们还可以使用类似的 `endsWith()` 方法来检查字符串是否以特定字符结尾：\n\n```\n'Hello'.endsWith('O');\n<<\
  \ false\n\n'Hello'.endsWith('o');\n<< true\n```\n\n## 字符串有多长？\n\n每个字符串都有一个 `length`\
  \ 属性，告诉我们它包含多少字符。该属性也是使用我们在 `charAt()` 方法中使用的点符号来访问。例如，以下代码将告诉我们字符串 `'Hello'` 中有多少个字符：\n\
  \n```\n'Hello'.length;\n<< 5\n```\n\n\n幸运的是，我们可以使用 `length` 属性来帮助找到字符串的最后一个字符，正如我们接下来将看到的。\n\
  \n### 名字代表了什么？\n\n让我们尝试写一些代码，要求用户输入姓名，然后告诉他们名字的第一个字母和最后一个字母。\n\n在上一章的末尾，我们学习了如何使用提示框（prompt\
  \ box）从用户那里收集信息并将其存储在变量中。我们的第一行代码将创建一个提示框，询问他们的名字：\n\n```\nconst name = prompt('What\
  \ is your name?');\n```\n\n如果你在控制台中输入上面的代码，你应该能看到屏幕上出现类似下面所示的内容。\n\n![What is your\
  \ name?](img/promptname.png)\n\n在文本框中输入你的名字并点击 `OK`。你输入的任何内容现在都将作为字符串存储在变量 `name`\
  \ 中。（你可以通过在控制台中输入 `name` 然后按 `Enter` 键来验证。）\n\n现在，让我们创建一个警报框（alert box），来展示我们的字符串处理技能：\n\
  \n```\nalert('Hello ' + name + '. The first letter of your name is ' + name[0] +\
  \ ' and the last letter is ' + name[name.length -1]);\n```\n\n如果你运行这段代码，你将得到与下面图片类似的内容。\n\
  \n![The first and last letter of your name is …](img/alertname.png)\n\n注意看我们是如何使用\
  \ `name[name.length - 1]` 找到变量 `name` 的最后一个字母的。这计算出了字符串的长度（记住，在用户输入名字之前，我们不知道它有多长），然后减去\
  \ `1`（以考虑到字符的位置是从零开始的）。\n\n你可以查看 [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/NWbKdJV)。\n\
  \n### 更改大小写\n\n可以将字符串的大小写转换为全大写字母或全小写字母。为了演示这一点，让我们在控制台中将字符串 `'JavaScript'` 赋值给变量\
  \ `name`：\n\n```\nconst name = 'JavaScript';\n```\n\n现在，我们可以使用 `toUpperCase()` 方法返回一个全大写字母的字符串：\n\
  \n```\nname.toUpperCase();\n<< 'JAVASCRIPT'\n```\n\n或者，我们可以使用 `toLowerCase()` 方法返回一个全小写字母的字符串：\n\
  \n```\nname.toLowerCase();\n<< 'javascript'\n```\n\n#### 变迁皆常……\n\n这两个方法实际上并没有改变存储在\
  \ `name` 变量中的字符串。它们只是返回了一个大小写改变后的值。如果你检查 `name` 变量的值，它应该和我们声明它时一样：\n\n```\nname;\n\
  << 'JavaScript'\n```\n\n### 修剪空格\n\n`trim()` 方法可以删除字符串开头和结尾的任何空白字符。当用户在表单中输入信息时不小心在开头或结尾添加空格时，这非常有用。下面的示例显示字符串开头和结尾的空格被删除了，但中间的空格被保留了：\n\
  \n```\n'    Hello World     '.trim(); \n<< 'Hello World'\n```\n\n它可以消除任何制表符或换行符，正如下面的示例所示：\n\
  \n```\n'   \\t\\t  JavaScript! \\r'.trim(); // 转义制表符和换行符也被删除了\n<< 'JavaScript!'\n\
  ```\n\n如果你只想移除开头或结尾的空白，有更具体的方法来实现这些操作：\n\n```\n'    Hello World     '.trimStart();\
  \ // 移除字符串开头的空白\n<< 'Hello World     '\n\n'    Hello World     '.trimEnd(); // 移除字符串结尾的空白\n\
  << '    Hello World'\n```\n\n\n\n\n2. 现在，试着修改代码，让它告诉用户他们的名字中包含多少个字母。[你可以在 CodePen\
  \ 上查看我的代码](https://codepen.io/SitePoint/pen/LYbPWWm)。\n\n3. 尝试修改 Mad Libs 代码，要求输入更多单词并创建一个更有趣的结果。你一定能比我做得更好！\n\
  \n4. 尝试编写一些代码，询问用户的姓名，然后通过交换第一个和最后一个字母来告诉他们“易位名称”（swappy name）。例如，如果我在提示框中输入“Daz”作为我的名字，警告框应该显示：“Hello\
  \ Daz, your swappy name is Zad.”（注意：这比听起来要难一些。你可能需要为这个挑战研究一下 `slice()` 方法。）[你可以在\
  \ CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/ZEBzeKL)。\n\n## 总结\n\n- 字符串是字符的集合，用于在\
  \ JavaScript 中显示文本块。\n- 特殊值可以通过在它们前面放置反斜杠（`\\`）来`转义`（escaped）。\n- 字符串具有各种属性和方法，可以提供有关它们的信息。\n\
  - `length` 属性告诉我们字符串中有多少个字符。\n- 字符串可以使用 `+` 运算符进行`连接`（concatenated）。\n- 模板字符串字量（Template\
  \ literals）就像增强版的字符串，允许将 JavaScript 代码插入到字符串中。\n\n既然我们已经学习了关于字符串的所有知识，是时候在新章学习关于数字的所有知识了。\n\
  \n# 第 4 章：数字\n\n在第三章中，我们学习了关于字符串的所有知识。现在是学习数字了！在本章中，我们将涵盖以下内容：\n\n- 整数和浮点数\n- 数字字面量\n\
  - 指数计数法\n- 算术运算\n- 变量的变化\n- 数字与字符串之间的转换\n- 随机数\n\n## 整数和浮点数\n\n数字可以分为多种类型。\n\n数字可以是`整数`（integers），即整个数字，例如\
  \ 3、-4 或 0。\n\n![Integers](img/integers.png)\n\n数字也可以是`浮点数`（floating-point numbers）——通常简称为`实数`（reals）、`小数`（decimals）或`浮点数`（floats）。这些包括所有带有分数或小数部分的数字，例如\
  \ 1.5、-3.8 或 pi。\n\n![Floats](img/floats.png)\n\n大多数编程语言对整数和浮点数有单独的原始数据类型，但 JavaScript\
  \ 不区分它们，而将它们统称为“数字”（numbers），正如我们使用 `typeof` 运算符时看到的：\n\n```\ntypeof 42; // 这是一个整数\n\
  << 'number'\n\ntypeof 3.14159; // 这是一个浮点小数\n<< 'number'\n```\n\n## 数字字面量\n\n`数字字面量`（numeric\
  \ literal）是形成十进制数字的序列，且不以领先零开头。在 JavaScript 中创建数字字面量就像直接在控制台中写数字一样简单：\n\n```\n3;\n\
  << 3\n\n-4.67;\n<< -4.67\n```\n\n## 指数计数法\n\n数字也可以用`指数计数法`（exponential notation）表示，这是“乘以\
  \ 10 的几次方”的简写（你可能听过它被称为“科学计数法”或“标准形式”）。下面的示例显示了如何写 1 乘以 10 的 6 次方，即百万：\n\n```\n\
  1e6;\n<< 1000000\n```\n\n下一个示例返回 2 乘以 10 的 3 次方，或 1000：\n\n```\n2E3;\n<< 2000\n\
  ```\n\n可以使用负索引来创建小数值。下面的示例返回 2.5 乘以 10 的负 3 次方，这等同于 2.5 乘以 0.001：\n\n```\n2.5e-3;\n\
  << 0.0025\n```\n\n## 什么时候数字不是数字？\n\n`NaN` 是一个特殊的错误值，是“Not a Number”（不是数字）的缩写。当尝试进行操作但结果不是数值时使用它，例如当你尝试将字符串乘以数字时：\n\
  \n```\n'hello' * 5;\n<< NaN\n```\n\n这里有一个 JavaScript 小笑话，用来放松一下。让我们看看 `NaN` 是什么数据类型。在控制台中输入以下代码：\n\
  \n```\ntypeof NaN;\n<< 'number'\n```\n\n有些讽刺的是，考虑到 `NaN` 代表“不是数字”，JavaScript 却把\
  \ `NaN` 视为……数字！\n\n## 算术运算\n\n大多数编程语言都可以执行所有常规算术运算——就像口袋计算器一样！计算可以像你预期那样列出，并且通常使用我们熟悉的运算符和符号。JavaScript\
  \ 也不例外。让我们尝试在控制台中做一些数学。\n\n**加法**如你预期的使用 `+` 运算符：\n\n```\n5 + 4.3;\n<< 9.3\n```\n\
  \n这个示例显示你可以在计算中混合整数和浮点数。\n\n**减法**使用 `-` 运算符，处理负数时没有问题：\n\n```\n6 - 11;\n>> -5\n\
  ```\n\n**乘法**使用 `*` 运算符：\n\n```\n6 * 7;\n<< 42\n```\n\n**除法**使用 `/` 运算符：\n\n```\n\
  6 / 11;\n<< 0.5454545454545454\n```\n\n**幂**使用 `**` 运算符：\n\n```\n2 ** 3;\n<< 8\n\
  ```\n\n**取余**使用 `%` 运算符：\n\n```\n2 % 7;\n<< 2\n```\n\n## 变量的变化\n\n如果变量已经赋值了一个数值值，可以使用不同的运算符进行修改。例如，假设我们正在创建一个名为\
  \ `score` 的变量来跟踪得分。首先，我们将分数初始化为 0。打开控制台并跟随这些示例：\n\n```\nlet score = 0;\nconsole.log(score);\
  \ // 0\n```\n\n增加分数的一种方法是这样给它加上一个值：\n\n```\nscore = score + 10;\nconsole.log(score);\
  \ // 10\n```\n\n这种写法起初看起来很奇怪，因为左侧和右侧不等，但请记住 `=` 符号用于*赋值*，我们正在将 `score` 变量赋值为当前值加\
  \ 10。\n\n这种操作有一个简写形式，称为**复合赋值运算符** `+=`：\n\n```\nscore += 10;\nconsole.log(score);\
  \ // 20\n```\n\n我们在上一节中看到的所有算术运算符都有等效的复合赋值运算符。例如，你可以这样减少 5 分：\n\n```\nscore -= 5;\n\
  console.log(score); // 15\n```\n\n以下代码将 `score` 的值乘以 2——换句话说，让它翻倍：\n\n```\nscore\
  \ *= 2;\nconsole.log(score); // 30\n```\n\n你也可以将 `score` 的当前值除以一个值。这段代码将其除以 3：\n\
  \n```\nscore /= 3;\nconsole.log(score); // 10\n```\n\n你还可以对 `score` 的值升幂。以下代码将 score\
  \ 的值升到 2 次方，这等同于将其平方：\n\n```\nscore ** 2;\nconsole.log(score); // 100\n```\n\n\n\
  \n\n\n```\nscore **=2;\n<< 100\n```\n\n你也可以使用取余运算符。如果 `score` 的当前值被除以 7，下面的代码会将\
  \ `score` 的值更改为余数：\n\n```\nscore %= 7;\n<< 2\n```\n\n## 递增\n\n如果你只想让一个值加 1，你可以使用递增运算符\
  \ `++`。它可以直接放在变量之前（前置运算符），也可以放在变量之后（后置运算符）。尝试在控制台中输入以下代码来查看它们是如何工作的：\n\n```\nlet\
  \ points = 5;\n\npoints++;\n<< 5\n\n++points;\n<< 7\n```\n\n那么这里发生了什么呢？这两个运算符都将\
  \ `points` 的值增加了 1，尽管第一个操作看起来并没有立即改变任何东西。区别在于递增发生的时间相对于相对于返回的值的时机。\n\n在第一次操作中，`points++`\
  \ 返回 `score` 的原始值 5，*然后*将其增加到 6；而 `++points` 先将值增加 1，然后返回新值 7。\n\n还有一个工作方式相同的 `--`\
  \ 运算符。下面的示例将返回 7，然后将 `points` 的值减 1 到 6：\n\n```\npoints--;\n<< 7\n```\n\n而下面的示例将先将\
  \ `points` 的值减 1，然后返回该值：\n\n```\n--points;\n<< 5\n```\n\n## 多大了？\n\n现在我们已经学习了不同的计算和变量更改，是时候编写代码了。我们将编写一个短程序，询问用户的年龄，然后将其从年转换为秒。\n\
  \n在 CodePen 上创建一个新的 Pen，并在 **JS** 部分输入以下内容（由于我们使用了 `prompt` 和 `alert` 框，别忘记在 **Settings**\
  \ > **Behavior** 中关闭 **Auto-Updating Preview**）：\n\n```\nconst ageInYears = prompt('How\
  \ old are you (in years)?');\n```\n\n这会将用户的答案存储在名为 `ageInYears` 的变量中。现在，让我们将其转换为秒：\n\
  \n```\nconst ageInSeconds = ageInYears * 365.25 * 24 * 60 * 60;\n```\n\n一年中大约有 31,557,600\
  \ 秒，但我们不需要费心记住这个数字。我们所做的只需乘以 365.25（这是一年的近似天数，0.25 是略微高估，这也是我们有闰年的原因）将其转换为天数，然后乘以\
  \ 24 转换为小时，再乘以 60 转换为分钟，最后再次乘以 60 转换为秒。\n\n最后，我们只需要使用 `alert` 框来告知用户结果：\n\n```\n\
  alert(`That means you have been alive for at least ${ageInSeconds} seconds!!`);\n\
  ```\n\n点击 **Run** 查看运行效果。它看起来应该像这样：\n\n![你的秒数年龄](img/ageinseconds.png)\n\n你可以在 [CodePen\
  \ 上查看我的代码](https://codepen.io/SitePoint/pen/XWNWYeY)。\n\n## 数字与字符串的计算\n\n可以将一个数字和一个字符串相加吗？这看起来是一个愚蠢的问题，但\
  \ JavaScript 会尽力尝试回答这个问题，如下例示例所示：\n\n```\n2 + 'two';\n<< \"2two\"\n```\n\n这里发生了什么？数字\
  \ `2` 被转换成了字符串 `'2'`，正如我们在上一节中看到的那样，它与字符串 `'two'` 拼接了一起。这个过程被称为**类型转换**（type coercion），它当运算符的操作数类型不同时发生。JavaScript\
  \ 会尝试将其中一个操作数转换为另一个操作数类型的等效值。例如，如果你尝试将一个字符串和一个数字相乘，JavaScript 将尝试将字符串强制转换为数字，然后将它们相乘：\n\
  \n```\n'2' * 8;\n<< 16\n```\n\n这起初看起来有用，但这个过程并不总是符合逻辑或保持一致，并且可能会导致很多困惑。例如，如果你尝试*相加*一个字符串和一个数字，JavaScript\
  \ 将将数字转换为字符串，然后拼接这两个字符串：\n\n```\n'2' + 8;\n<< '28'\n```\n\nJavaScript 试图提供帮助，但实际上，类型转换使得你发现在代码中发现错误变得非常困难。\n\
  \n最好的方法是掌控局面，对你正在处理的数值类型保持非常明确的态度，并避免在操作中使用不同类型的值。让我们在下一节看看如何这样做。\n\n## 字符串与数字之间的转换\n\
  \n我们可以使用 `Number` 构造函数将数字转换为字符串。这会将数字的字符串形式转换为数字字面量，如下例所示：\n\n```\nNumber('23');\n\
  << 23\n```\n\n如果字符串无法转换为数字，则返回 `NaN`：\n\n```\nNumber('hello');\n<<< NaN\n```\n\n\
  要将数字字面量转换为该数字的字符串字面量表示，我们使用 `String` 构造函数，如下例所示：\n\n```\nString(3);\n<< '3'\n```\n\
  \n这些转换最常见的用途是因为用户在 `prompt` 框中输入的任何内容……（此处原文为重复/不完整内容，已按要求处理）\n\n\n\n\n[content]\n\
  \n在 CodePen 上打开一个新 Pen，并在 `JS` 中输入以下代码：\n\n```\nconst sides = prompt('How many sides\
  \ does the dice have?');\n```\n\n这会将用户输入的数字存储在名为 `sides` 的变量中。现在，让我们添加一个警报消息来让用户“掷”骰子：\n\
  \n```\nalert('Press Enter or click close to roll the dice...');\n```\n\n接下来是用于创建随机数的代码：\n\
  \n```\nconst number = Math.ceil(sides*Math.random());\n```\n\n这与我们之前使用的代码相似，但我们将\
  \ `Math.random()` 乘以了用户指定的骰子面数。这将产生一个在 0 到（面数减 1）之间的之间的随机小数。应用 `Math.ceil` 会将该数字向上取整到下一个整数，从而有效地生成一个\
  \ 1 到面数 之间的随机数。\n\n现在我们只需要告诉用户数字是多少（我们再次使用模板字面量将数字直接插入到字符串中）：\n\n```\nalert(`The\
  \ dice landed on the number ${number}`);\n```\n\n点击 **Run** 来测试此代码。它看起来应该像这样：\n\n\
  ![Roll the dice](img/dice.png)\n\n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/dyOyKab)。\n\
  \n### 更多方法\n\n数字还能做很多其他事情。属性和方法的完整列表可以在 [Mozilla 开发者网络](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number)\
  \ 上找到。\n\n`Math` 对象也有许多你可能会觉得有用的属性和方法。同样，你可以在 [Mozilla 开发者网络](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math)\
  \ 上查看它们。\n\n## 挑战\n\n1. 创建一个提示框询问用户的年龄。然后告诉他们 25 年后他们多大。（注意，在这里你可能会遇到一些类型转换问题，因为在提示框中输入的数字实际上是作为字符串存储存储的。）你可以在\
  \ [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/VwmwdRY)。\n2. 编写一些代码，使用提示框询问用户两个数字，然后显示一个警报框来显示这两个数字相乘的结果。你可以在\
  \ [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/PoboaLb)。\n3. 你能写一些代码来分摊账单吗？你需要使用提示框询问餐费花了多少钱，另一个提示框询问由多少个人分摊。然后用警报框显示每人需要支付多少钱。对于这个挑战，你需要考虑单位和舍入。如果你能添加一个额外的问题来按百分比添加小费，将会获得加分！你可以在\
  \ [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/WNoNKeX)。\n4. 编写一些代码生成两个值之间的随机数。例如，你能写出代码返回一个\
  \ 5 到 10（包含边界值）之间的随机数吗？你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/ExNxpYJ)。\n\
  \n## 总结\n\n*   数字可以是整数（如 2）或浮点数（小数，如 7.8），尽管 JavaScript 并不区分它们，而只有一个原始数据类型 `Number`。\n\
  *   数字可以使用指数计数法表示，例如 `5e6` 表示五百万。\n*   算术运算 `+`、`-`、`*`、`/` 和 `%` 可以应用于任何两个数字。\n\
  *   可以将字符串转换为数字，反之亦然。\n*   如果你尝试在字符串和数字之间执行操作，JavaScript 将尝试转换类型以完成操作。这可能会导致一些不一致和意想不到的结果！\n\
  *   `Math.random()` 方法返回一个 0 到 1 之间的随机数。\n\n现在我们已经学习了字符串和数字，是时候查看 JavaScript 如何处理值的集合了。\n\
  \n# 第 5 章：集合\n\n到目前为止，我们已经了字符串、数字和布尔值等原始数据类型。但如果我们想在一个变量中存储一整个值的集合呢？例如，我们可能有一份价格列表，想要存储在同一个地方。**复合数据类型**可以以结构化的方式收集原始值。\n\
  \n编程语言使用不同的数据结构来存储值，但最常见的之一是数组。\n\n在本章中，我们将涵盖：\n\n*   创建数组\n*   向数组添加值\n*   从数组中移除值\n\
  *   扩展运算符 (spread operator)\n*   多维数组\n\n## 数组\n\n**数组** 是一个值的有序列表。例如，考虑以下购物清单：\n\
  \n*   苹果 (Apple)\n*   香蕉 (Banana)\n*   纸蛋糕 (Cupcake)\n\n这可以表示如下数组：\n\n```\n['Apple',\
  \ 'Banana', 'Cupcake']\n```\n\n![A fruity array](img/list1.png)\n\n数组中的每个值都有一个数字索引，显示它在数组中的位置。在示例中，`'Apple'`\
  \ 的索引为 0（记住计算机从 0 开始计数！），`'Banana'` 的索引为 1，而 `'Cupcake'` 的索引为 2。\n\n![A fruity array\
  \ with indices](img/list2.png)\n\n数组中的每个值都有一个数字索引，显示它在数组中的位置。在示例中，`'Apple'` 的索引为\
  \ 0（记住计算机从 0 开始计数！），`'Banana'` 的索引为 1，而 `'Cupcake'` 的索引为 2。\n\n（注：此处原文中存在大量重复段落，已根据指令要求不重复输出，仅保留核心逻辑翻译）\n\
  \n## JavaScript 中的数组\n\n现在我们已经介绍了数组，让我们尝试编写一些代码。要创建一个**数组字面量**，你只需在方括号内用逗号分隔这些值。例如，以下代码创建了购物清单：\n\
  \n```\nshopping = ['Apple', 'Banana', 'Cupcake'];\n```\n\n要访问数组中的特定值，我们在方括号中写入它的位置。（这被称为**索引**\
  \ index。）例如，以下代码将返回数组中的第一个项：\n\n```\nshopping[0];\n<< 'Apple'\n```\n\n如果我们想查看索引\
  \ 2 的值（购物清单中的第三项），我们将使用以下代码：\n\n```\nshopping[2];\n<< 'Cake'\n```\n\n如果数组中的元素为空，则会返回\
  \ `undefined`，如果我们尝试查看索引 5 的内容所示：\n\n```\nshopping[5]; // 位置 5 没有内容\n<< undefined\n\
  ```\n\n### 向数组添加值\n\n如果我们想向创建的数组添加新项，只需使用索引表示法将值分配给目标位置。例如，以下代码将在位置 3 添加 `'Donut'`（记住这是购物清单中的第四项）：\n\
  \n```\nshopping[3] = 'Donut';\n```\n\n我们可以通过直接在控制台中输入它的名称来查看 `shopping` 数组的内容：\n\
  \n```\nshopping;\n<< ['Apple', 'Banana', 'Cake', 'Donut']\n```\n\n![The updated\
  \ shopping list](img/list3.png)\n\n数组中的每个项都可以像变量一样处理。你可以使用赋值运算符 `=` 修改值。例如，我们可以使用以下代码将位置\
  \ 2 的值从 `'Cake'` 改为 `'Carrot'`：\n\n```\nshopping[2] = 'Carrot';\n```\n\n检查更改是否已生效：\n\
  \n```\nshopping;\n<< ['Apple', 'Banana', 'Carrot', 'Donut']\n```\n\n![A carrot added\
  \ to the shopping list, in place of the cupcake](img/list4.png)\n\n你可以使用索引表示向数组的任何位置添加新项。例如，以下代码将在位置\
  \ 5 添加 `'Eggplant'`：\n\n```\nshopping[5] = 'Eggplant';\n```\n\n现在我们现在控制台中查看 `shopping`\
  \ 数组，可以看到第 6 项（索引为 5）已填充了字符串 `'Eggplant'`。这在数组的位置 4 处留了一个空隙，因此数组中未使用的该位置由值 `undefined`\
  \ 填充：\n\n\n\n\n\n```\nshopping;\n<< ['Apple', 'Banana', 'Carrot', 'Donut', undefined,\
  \ 'Eggplant']\n```\n\n![一个较长的购物列表，其中一项为 undefined](img/list5.png)\n\n## 从数组中删除值\n\
  \n`delete` 运算符可以用于从数组中删除一个项目。例如，如果我们决定真的不应该买甜甜圈，可以使用以下代码从 `shopping` 数组中删除值 `'Donut'`：\n\
  \n```\ndelete shopping[3];\n<< true\n```\n\n这会直接从列表的对应位置删除甜甜圈，在数组中留空一个空位，如下所示所示。\n\
  \n![从数组中删除项目的可视化表示](img/delete.png)\n\n现在，如果我们看一眼 `shopping` 数组，可以看到字符串 `Donut`（索引为\
  \ 3）确实被删除了……而在它的位置留下了一个 `undefined` 值：\n\n```\nshopping;\n<< ['Apple', 'Banana',\
  \ 'Carrot', undefined, undefined, 'Eggplant']\n```\n\n![更新后的购物列表](img/list6.png)\n\
  \n注意这一点，因为这甚至可能让经验丰富的程序员出错。位置 3 的*值*（`'Donut'`）已从数组中删除，但它所占据的空间*仍然在那里*，而且它现在包含一个\
  \ `undefined` 值。这意味着数组的元素数量保持不变，该位置仍然可以作为索引被引用，但它只会返回 `undefined`：\n\n```\nshopping[3];\n\
  << undefined\n```\n\n## 查找数组的长度\n\n每个数组都有一个 `length` 属性，告诉我们它包含多少项目。例如，我们可以使用以下代码找到\
  \ `shopping` 数组中的项目数量：\n\n```\nshopping.length;\n<< 6\n```\n\n注意长度为 6，这是因为在计算数组长度时，包含\
  \ `undefined` 的位置也会被计算在内。\n\n`length` 属性的值可以放在方括号中作为索引的一部分，以找到数组中的最后一个项目。例如，以下代码告诉我们购物列表中的最后一个项目：\n\
  \n```\nconst length = shopping.length;\nshopping[length - 1];\n<< 'Eggplant'\n```\n\
  \n这告诉我们 `'Eggplant'` 是数组中的最后一个项目，但请注意我们必须从 `length` 属性中减去 1。这是因为索引是从 0 开始的，所以数组中的最后一个项目的索引比数组的实际长度少\
  \ 1。\n\n数组的 `length` 属性不是固定的，这意味着可以通过添加或删除项目来动态更改数组的长度。事实上，`length` 属性是可变的，这意味着你可以直接修改它，如下：\n\
  \n```\nshopping.length = 8;\n<< 8\n```\n\n这将使我们的 `shopping` 数组的长度变为 8 而不是 6。如果我们看一眼数组，可以看到额外的空位现在是空的了：\n\
  \n```\nshopping;\n<< ['Apple', 'Banana', 'Carrot', undefined, undefined, 'Eggplant',\
  \ undefined, undefined]\n```\n\n![我们的列表现在的长度为 8](img/list7.png)\n\n如果我们将数组长度更改比当前长度短的值，所有额外的元素将被完全删除。以下代码将保留数组中的前三个项目并删除其余所有项目：\n\
  \n```\nshopping.length = 3;\n<< 3\n```\n\n现在如果我们检查数组的内容，可以看到只剩下了前三个项目：\n\n```\n\
  shopping;\n<< ['Apple', 'Banana', 'Carrot']\n```\n\n![一个较短的购物列表](img/list8.png)\n\
  \n## 没有第二次机会\n\n一旦你通过编辑长度属性来缩短数组，任何被删除的项目都将永久丢失。如果你尝试将长度改回 8，它只会向所有额外的空间中添加 `undefined`，而不是用之前的值来填充它们：\n\
  \n```\nshopping.length = 8;\n<< ['Apple', 'Banana', 'Carrot', undefined, undefined,\
  \ undefined, undefined, undefined,]\n```\n\n因此，在更改数组长度时，请非常小心不要丢失你之后可能需要的任何值。\n\n\
  ## 弹出（Pop）和推送（Push）\n\n数组有名为 `pop` 和 `push` 的方法，用于删除或添加项目。\n\n`pop()` 方法从数组中移除最后一个项目。为了看到效果，让我们创建一个新的购物列表数组：\n\
  \n```\nconst shopping = ['Apple', 'Banana', 'Carrot', 'Donut', 'Eggplant']\n```\n\
  \n![包含五个项目的新列表](img/list9.png)\n\n我们可以使用 `pop()` 方法移除数组的最后一个项目，它会将最后一个项目“弹出”数组，如下图所示。\n\
  \n![从数组中弹出最后一个项目](img/pop.png)\n\n下面的代码显示了如何将该方法应用于 `shopping` 数组：\n\n```\nshopping.pop();\n\
  << 'Eggplant'\n```\n\n该方法返回数组的最后一个项目，并更新数组使其不再包含该项目。如果我们看一眼 `shopping` 数组，我们会发现它不再包含字符串\
  \ `'Eggplant'`：\n\n```\nshopping;\n<< ['Apple', 'Banana', 'Carrot', 'Donut']\n```\n\
  \n![去掉了茄子的我们的数组](img/list10.png)\n\n如果我们想在数组末尾添加一个新值，可以使用 `push()` 方法。例如，我们可以向 `shopping`\
  \ 数组末尾添加 `'cupcake'`，如下所示。\n\n![在末尾添加蛋糕](img/push.png)\n\n我们将使用以下代码：\n\n```\nshopping.push('cupcake');\n\
  << 5\n```\n\n该方法返回数组的新长度，为 5。我们可以通过输入 `shopping` 来检查 `'cupcake'` 已添加：\n\n```\nshopping;\n\
  << ['Apple', 'Banana', 'Carrot', 'Donut', 'cupcake']\n```\n\n# 移位（Shift）和未移（Unshift）\n\
  \n`shift()` 方法与 `pop` 类似，区别在于它从数组中移除*第一个*项目：\n\n```\nshopping.shift();\n<< 'Apple'\n\
  ```\n\n![shift 工作原理](img/shift.png)\n\n`unshift()` 方法与 `push()` 方法类似，但它将新项目添加到数组的*开头*。例如，我们可以以下代码向\
  \ `shopping` 数组开头添加 `'Avocado'`：\n\n```\nshopping.unshift('Avocado');\n<< 5\n```\n\
  \n该方法返回数组的新长度，为 5。我们可以通过输入 `shopping` 来检查 `'Avocado'` 已添加：\n\n```\nshopping;\n<<\
  \ ['Avocado', 'Banana', 'Carrot', 'Donut', 'cupcake']\n```\n\n![带有牛油果的购物列表](img/list11.png)\n\
  \n## 扩展运算符（Spread Operator）\n\n**扩展运算符**是放在内部数组前面的三个点（`...`）。它会将数组中的所有元素展开为独立的值。\n\
  \n如果你把数组想象成一个装满值的盒子，那么扩展运算符等同于将盒子的内容倒进另一个盒子里。\n\n为了看到扩展运算符的作用，尝试在控制台中创建一个数组：\n\n\
  ```\nconst arrayA = [1,2,3];\n```\n\n现在假设我们想把 `arrayA` 中的三个元素放入一个新数组 `arrayB` 中。我们可能会尝试这样做：\n\
  \n```\nconst arrayB = [arrayA];\n```\n\n不幸的是，我们所做的是将整个 `arrayA` 放入了 `arrayB`。这等同于在一个盒子里放了一个装满值的盒子。可以从这一点看出，`arrayB`\
  \ 只包含*一个*元素，如果我们查看长度属性就可以：\n\n```\narrayB.length;\n<< 1\n```\n\n如果我们在 `arrayA` 前使用扩展运算符，那么我们将它的所有元素放入\
  \ `arrayB`：\n\n```\nconst arrayB = [...arrayA];\n```\n\n现在 `arrayB` 包含了三个元素，我们可以通过输入\
  \ `arrayB` 来检查：\n\n```\narrayB;\n<< [1,2,3]\n```\n\n\n\n\n当我们把扩展运算符应用到 `arrayA`\
  \ 并将其放在另一个数组 `arrayC` 内部时，它将解包所有的元素，并将它们视为三个独立的立项值：\n\n```\nconst arrayC = [...arrayA];\n\
  ```\n\n现在，如果我们查看 `arrayC` 的长度，可以发现它确实包含了三个独立的元素：\n\n```\narrayC.length;\n<< 3\n\
  ```\n\n如果如果我们查看 `arrayC` 的内容，可以看到它包含了与 `arrayA` 相同的元素：\n\n```\narrayC;\n<< [1,2,3]\n\
  ```\n\n扩展运算符可以用于将两个或多个数组的元素合并到一个新数组中。为了直观看到这一点，让我们创建三个包含不同类型食物的各种数组：\n\n```\nconst\
  \ fruit = ['Pineapple', 'Melon'];\nconst savory = ['Burger', 'Fries'];\nconst sweets\
  \ = ['Cookie', 'Popcorn'];\n```\n\n现在，我们可以通过将这三个数组放入一个新数组 `food` 中，并对每个数组应用扩展运算符，将它们合并为一个名为\
  \ `food` 的数组，这样所有元素都会从它们各自的数组中解包并成为独立的值：\n\n```\nconst food = [...fruit, ...savory,\
  \ ...sweets];\n<< undefined\n```\n\n我们可以通过查看 `food` 变量来检查操作是否成功：\n\n```\nfood;\n\
  << ['Pineapple', 'Melon', 'Burger', 'Fries', 'Cookie', 'Popcorn']\n```\n\n![我们新的组合数组的视觉](img/list13.png)\n\
  \n如你所见，所有的项目都从它们原始数组容器中展开，并单独放在新的 `food` 数组中。\n\n如果没有使用扩展运算符，新数组中的项仍然会被封装在原始数组中，如下代码所示：\n\
  \n```\nconst food = [fruit, savory, sweets];\n<< [['Pineapple', 'Melon'], ['Burger',\
  \ 'Fries'], ['Cookie', 'Popcorn']]\n```\n\n扩展运算符还可以用于向数组中添加新项。例如，如果我们想在 `food` 数组末尾添加\
  \ `'Coffee'`，而不是使用 `push()` 方法，可以使用以下代码：\n\n```\nfood = [...food, 'Coffee'];\n```\n\
  \n在这个示例中，扩展运算符解包了 `food` 数组中的所有项，并将它们作为独立项放在新数组中。\n\n此外，与其使用 `unshift()` 方法在数组开头添加字符串\
  \ `'Coconut'`，我们可以使用以下代码：\n\n```\nfood = ['Coconut', ...food];\n```\n\n事实上，你可以使用以下代码在一个步内向数组开头添加\
  \ `'Coconut'` 并在末尾添加 `'Coffee'`：\n\n```\nfood = ['Coconut', ...food, 'Coffee'];\n\
  ```\n\n我们可以通过查看数组的内容来看到这次操作的结果：\n\n```\nfood;\n<< ['Coconut', 'Pineapple', 'Melon',\
  \ 'Burger', 'Fries', 'Cookie', 'Popcorn', 'Coffee']\n```\n\n![我们新食物数组的视觉](img/list14.png)\n\
  \n### 切片与拼接 (Slicing and Splicing)\n\n`slice()` 方法创建一个子数组，实际上是从原始数组中从一个位置开始到另一个位置切取一段片段。例如，如果我们想找到\
  \ `food` 数组中的第三和第四项，我们将使用以下代码：\n\n```\nfood.slice(2,4);\n<< ['Melon', 'Burger']\n\
  ```\n\n括号中的第一个数字告诉我们开始切片的索引，第二个数字告诉我们切片到达的索引（但不包含该项）。所以，在上面的示例中，切片将从索引为 2 的 `'Melon'`\
  \ 开始，然后包含所有项，直到但不包括索引为 4 的项 `'Fries'`。\n\n切片操作是非破坏性的，因此数组中没有实际删除任何项，我们可以查看 `food`\
  \ 数组看到：\n\n```\nfood;\n<< ['Coconut', 'Pineapple', 'Melon', 'Burger', 'Fries', 'Cookie',\
  \ 'Popcorn']\n```\n\n`splice()` 方法从数组中删除项并在位置插入新项。例如，以下代码移除字符串 `'Melon'` 并替换为 `'Mango'`：\n\
  \n```\nfood.splice(2, 1, 'Mango');\n<< ['Melon']\n```\n\n括号中的第一个数字告诉我们开始 splice\
  \ 的索引。在示例中，它是索引 2（即数组中的第三个项）。第二个数字告诉我们从数组中删除多少个项。\n\n拼接操作是破坏性的，它会永久改变数组的值，如下所示：\n\
  \n```\nfood;\n<< ['Coconut', 'Pineapple', 'Mango', 'Burger', 'Fries', 'Cookie',\
  \ 'Popcorn']\n```\n\n![更多 melon！](img/list15.png)\n\n（注：由于原文中关于 `splice` 的描述存在大量重复导致文本异常，译文已根据核心逻辑进行了精简与翻译。）\n\
  \n\n\n\n注意，这会永久更改数组的顺序。\n\n### 排序数组值\n\n我们可以使用 `sort()` 方法对数组中的项进行排序。在 `food` 数组上调用此方法将把数组项重新排列为字母顺序：\n\
  \n```\nfood.sort();\n<< ['Coconut', 'Coffee', 'Cookie', 'Fries', 'Mango', 'Pineapple',\
  \ 'Pizza', 'Popcorn']\n```\n\n![已排序的食物](img/list19.png)\n\n注意，这也会永久更改数组的顺序。\n\n\
  ### 字母顺序的数字\n\n字符串默认按字母顺序排序，但数字也是如此！这意味着数字是根据它们的第一位数字进行排序的，而不是根据数值。例如，`9` 会排在 `10`\
  \ 之后，因此你会得到像下面所示的疯狂结果：\n\n```\n[5, 9, 10].sort();\n<< [10, 5, 9]\n```\n\n不过，别担心。这可以使用所谓的“回调”（callback）来修复，我们将在书的后面介绍它。\n\
  \n### 更多方法\n\n数组还有很多可以做的事情。你可以在 [Mozilla 开发者网络](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\
  \ 上找到属性和方法的完整列表。看看你是否能找到任何有趣的，并尝试在控制台中中使用它们。\n\n## 多维数组\n\n你可以通过将多个数组放入一个容器数组中，创建一个数组的数组，这被称为\
  \ `多维数组`。这可以用于创建坐标系，例如：\n\n```\nconst coordinates = [[1,3],[4,2]];\n<< [[1,3],[4,2]]\n\
  ```\n\n要访问多维数组中的值，我们使用两个索引——一个指向项在外层数组中的位置，另一个指向它在内层数组中的位置：\n\n```\ncoordinates[0][0];\
  \ // 第一个数组的第一个值\n<< 1\n\ncoordinates[1][0]; // 第二个数组的第一个值\n<< 4\n\ncoordinates[0][1];\
  \ // 第一个数组的第二个值\n<< 3\n\ncoordinates[1][1]; // 第二个数组的第二个值\n<< 2\n```\n\n二维数组的结构如下所示。\n\
  \n![二维数组](img/coordinates.png)\n\n我们之前见过的展开运算符可以用来“展平”多维数组。`展平` 数组涉及通过将所有值从其数组中取出并放在父数组的同一层，移除所有嵌套数组。你可以从下面的示例中看到，只需将\
  \ `summer` 和 `winter` 数组放入容器数组就会创建一个嵌套数组，但如果我们在将数组放入容器数组时使用展开运算符，我们得到一个只包含其内容的扁平数组：\n\
  \n```\nconst summer = ['Jun', 'Jul', 'Aug'];\nconst winter = ['Dec', 'Jan', 'Feb'];\n\
  const nested = [ summer, winter ];\n<< [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan',\
  \ 'Feb' ] ]\n\nconst flat = [...summer, ...winter];\n<< [ 'Jun', 'Jul', 'Aug', 'Dec',\
  \ 'Jan', 'Feb' ]\n```\n\nJavaScript 还有 `flat()` 方法，它不需要展开运算符即可展平数组，如下所示：\n\n```\n\
  [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan', 'Feb' ] ].flat();\n<< [ 'Jun', 'Jul',\
  \ 'Aug', 'Dec', 'Jan', 'Feb' ]\n```\n\n关于创建和操作数组的总结可以在 [SitePoint 的这篇文章](https://www.sitepoint.com/quick-tip-create-manipulate-arrays-in-javascript/)\
  \ 中找到。\n\n## 挑战\n\n1. 创建名为 `shoppingList` 的变量，初始为一个空数组。尝试使用 `pop`、`push`、`shift`、`unshift`\
  \ 和 `splice`，以及展开运算符从列表中添加和删除项。你可以查看 [CodePen 上的代码](https://codepen.io/SitePoint/pen/BaQNzyz)。\n\
  \n2. 使用三个提示框（prompt）向用户询问三个不同的单词，然后将它们放入数组中。使用警告框（alert）显示数组。你可以查看 [CodePen 上的代码](https://codepen.io/SitePoint/pen/bGBdexY)。\n\
  \n3. 使用提示框让用户输入一个单词。然后使用 `split`、`reverse()` 和 `join()` 方法的组合将单词反过来写。例如，“hello”将变成“olleh”。（提示：为\
  \ `split()` 和 `join()` 方法提供一个空字符串作为参数。）你可以查看 [CodePen 上的代码](https://codepen.io/SitePoint/pen/poNJbOZ)。\n\
  \n4. 编写一段代码，在提示框中向用户询问一个逗号分隔的名称列表，然后创建一个警告框按字母顺序显示这些名称。你可以查看 [CodePen 上的代码](https://codepen.io/SitePoint/pen/abBOZae)。\n\
