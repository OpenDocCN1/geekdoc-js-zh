  \ 上查看我的代码](https://codepen.io/SitePoint/pen/wvoqZWd)。\n\n2. 创建一个 [Tabata 训练计时器](https://www.active.com/fitness/articles/what-is-tabata-training)。它应该交替进行\
  \ 20 秒工作和 10 秒休息，共进行 8 轮。计时器应该指示当前是工作还是休息。作为加分项，添加“Start”（开始）、“Stop”（停止）和“Reset”（重置）按钮。你可以在\
  \ CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/qBqXwNz)。\n\n3. 通过添加一些额外功能改进饼干抓游戏。一些建议可能：添加一个让用户按下启动游戏的按钮；让饼干以随机频率出现；让饼干在出现时大小随机，且它们的分值与大小成反比（饼干越小越难抓到，得到的分数就越多！）\n\
  \n   你还能想到其他的吗？你可以在 CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/ExNvJgr)。\n\
  \n## 总结\n\n* UNIX 时间元（UNIX epoch）是一个任意日期，1970 年 1 月 1 日，计算机语言用它作为测量已时间的参考点。\n* 大多数编程语言都有一个\
  \ `Date` 对象，允许你以各种格式存储日期和时间。\n* `setTimeout()` 方法在提供毫秒数作为参数后调用回调函数。\n* 异步编程意味着代码可以按无顺序执行。它停止了长时间进程阻塞代码流，让程序在等待它们完成的同时继续运行。\n\
  * `setInterval()` 方法每隔给定的时间间隔就会调用调用回调函数。\n* JavaScript 可用于为 CSS 动画添加交互性。\n\n我们现在已经到了书中最后一个实操章节的结尾。但还剩最后一个章节了——希望这一章能激励你进入编码的下一个阶段。\n\
  \n# 第 16 章：结束\n\n仅仅因为你快要读完这本书并不意味着你的编码之旅结束了。相反，它才刚刚开始。本章的目的是为你下一步提供一些想法和启发。我们将查看以下主题：\n\
  \n* 编码实践\n* 深入 JavaScript\n* 学习新语言\n\n## 编码实践\n\n现在你已经可以自信编写代码了，是时候设置你的环境并学习一些最佳实践了。\n\
  \n### 编码工具\n\nCodePen 对于编写书中的示例并立即查看结果非常有用，但现在是你时候建立自己的环境了。你的第一个任务是寻找一个编辑器。\n\n\
  有很多编辑器可供选择，使用 [VS Code](https://code.visualstudio./)、[Sublime Text](https://www.sublimetext.com)\
  \ 或 [Atom](https://atom.io) 都不会错。这些都是功能强大的编辑器，包含了语法高亮、标签、文件浏览和代码补全。Atom 甚至是 HTML、CSS\
  \ 和 JavaScript 构建的！\n\n你可以通过阅读 Bruce Johnson 的 [* Studio Code: End-to-End Editing\
  \ and Debugging Tools for Web Developers](https://www.sitepoint.com/premium/books/visual-studio-code-end-to-end-editing-and-debugging-tools-for-web-developers)*\
  \ 来了解更多关于设置 VS Code 的信息。\n\n![VS Code features syntax highlighting as well as many\
  \ other features](img/vscode.png)\n\n如果你使用 Chrome 浏览器或 ChromeOS，还可以考虑 [Text](https://chrome.google.com/webstore/detail/text/mmfbcljfglbokpmkimbfghdkmjhdgb)\
  \ 和 [Caret](https://chrome.google.com/webstore/detail/caret/clocpococg)，两者都是非常好的选择。\n\
  \n### 风格指南\n\n另一个良好的实践是遵循编码风格指南。这些指南通常由开发团队编写，以确保他们在编写代码时达成一致。[Google](https://google.github.io/styleguide/jsguide.html)\
  \ 和 [Airbnb](https://github.com/airbnb/javascript) 使用的风格指南都是公开的。遵循风格指南中列出的标准有助于提高你编写的代码质量，并保持你编码风格的一致，正如“[为什么我使用\
  \ JavaScript 风格指南以及你也应该这样做](https://www.sitepoint.com/why-use-javascript-style-guide/)”所示。\n\
  \n\n\n你也可以使用[代码检查](https://www.sitepoint.com/comparison-javascript-linting-tools/)工具，它们会高亮代码中的任何样式错误，并帮助确保你编写的任何代码符合你指定的样式指南。尝试将你的代码粘贴到[JSLint\
  \ 在线工具](https://jslint.com)中以获取质量报告。\n\n## 版本控制\n\n版本控制软件允许你跟踪对代码进行的所有更改，因为你代码的每一个版本都被保存了，并且可以随时回溯。\n\
  \n源码管理最流行的工具之一是[Git](http://git-scm.com/)，它由 Linux 的创始人 Linus Torvalds 编写。Git 允许你回滚到代码之前的版本。你还可以对代码进行分支（branch），以便在测试新功能，而不会改变当前的稳定代码库。Git\
  \ 是一个`分布式`源码控制系统，这意味着许多人可以分支（fork）一段代码并独立开发，然后将他们的任何更改合并回主代码库。这意味着如果你犯了错误，可以回滚到上一个正常运行的版本。\n\
  \nGit 使用命令行来发布命令，但有大量的 GUI 前端可以安装，以提供代码的视觉化表示，其中包括出色的[GitHub Desktop](https://desktop.github.com)。\n\
  \n还有各种可以托管 Git 仓库的在线服务，包括[GitHub](https://github.com/), [GitLab](https://gitlab.com)\
  \ 和 [Bitbucket](https://bitbucket.org/)。\n\n随着你编写越来越复杂的代码，将 Git 集成到你的日常工作流会让你的生活变得简单得多。可以通过\
  \ Shaumik Daityari 写的[Jump Start Git](https://www.sitepoint.com/premium/books/jump-start-git-2nd-edition/)了解更多关于\
  \ Git 的信息。\n\n## 测试\n\n当你开始编写更多代码时，你应该尝试养成测试的习惯。指的不仅仅是尝试几次看看它是否有效。`测试`是开发过程中不可或缺的一部分，涉及到在你编写代码的同时编写测试你代码的代码。错误和\
  \ Bug 是编码的一部分，而测试有助于快速识别并处理它们。\n\n`测试驱动开发` (TDD) 是编写任何代码*之前*先编写测试的过程。其理念是你先决定想让代码做什么，为它编写一个测试，然后编写代码通过该测试。起初这看起来很奇怪，但它有助于确保你的代码确实做了它应该做的事。\n\
  \n学习 JavaScript 测试的一个良好起点是“[[初学者函数式 JavaScript 测试指南](https://www.sitepoint.com/testing-functional-javascript/)””。流行的测试库包括\
  \ [Jasmine](https://jasmine.github.io), [Mocha](https://mochajs.org) 和 [Jest](https://jestjs.io)。\n\
  \n## 深入学习 JavaScript\n\n本书侧重于使用 JavaScript 来教授编程基础。如果你喜欢我们目前为止涵盖的内容，那么好消息是还有很多东西可以学习。\n\
  \n### 高级 JavaScript\n\n我们在本书中涵盖了 JavaScript 的基础知识，但还有很多内容需要学习。一个很好的起点是学习 Web `APIs`（应用程序编程接口）。一些亮点包括：Canvas\
  \ API，可用于创建 2D 和 3D 图形；Fetch API，用于发送 HTTP 请求并从其他服务器检索数据；Web Storage API 和 cookies，它们都允许你在用户的计算机上存储数据；以及\
  \ WebSocket API，它允许多个用户同时访问同一个网站。\n\n关于异步编程和 JavaScript 的事件循环还有更多可以学习，包括 promises\
  \ 以及 `async` 和 `await` 关键字。JavaScript 还有[maps](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map)\
  \ 和[sets](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set)，它们是不同的数据结构。\n\
  \nJavaScript `modules` 涉及将你的代码分离到单独的文件中并可以在不同的项目中重用。你还可以导入其他人编写的外部库，为你的代码添加额外功能。阅读“[理解\
  \ ES6 模块](https://www.sitepoint.com/understanding-es6-modules/)”以了解更多。\n\n我们在书中没有提到但学习非常有用的一个领域是`正则表达式`（简称\
  \ `regex`）。这些是描述字符串结构的模式，它们在几乎每种编程语言中都有实现。它们可以用于搜索字符串并执行“查找和替换”类型的操作。正则表达式起初可能有点奇怪，它们像是一门黑艺术，可以很容易写满整本书！在处理大量文本时，它们确实非常有用。以下是一些可以帮助你学习更多正则表达式的有用资源：\n\
  \n* [Regular-Expressions.info](https://www.regular-expressions.info/)\n* [regex101](https://regex101.com/)\n\
  * [Mastering Regular Expressions](https://www.oreilly.com/library/view/mastering-regular-expressions/0596528124/)（一本全面的书）\n\
  \nJavaScript 是一门不断演变的语言，每年都会向语言中添加新功能。如果你渴望了解它的最新功能，你应该阅读 T.J. Crowder 写的[JavaScript:\
  \ The New Toys](https://www.sitepoint.com/premium/books/javascript-the-new-toys/)。\n\
  \nLaurie Voss 的演讲“[JavaScript: 现状、何方以及未来](https://www.sitepoint.com/premium/tech-talks/web-directions-code-leaders-2019/javascript-where-where-next)”详细介绍了\
  \ JavaScript 的现状和趋势。\n\n### 库\n\nJavaScript `library` 是一段提供了更易实现常见任务的方法的代码。JavaScript\
  \ 是一种极其灵活的语言……并不是所有的任务都像应该的那样容易。库会将功能抽象为易于使用的函数。这些函数可以用来完成常见任务，而无需编写大量的重复代码。一个很好的例子是\
  \ [date-fns](https://date-fns.org)（我们在上一章中遇到的一个库），它让处理日期变得更易管理。\n\n[jQuery](https://jquery.com)\
  \ 可能是所有 JavaScript 库中最著名的。它提供了许多方法，使得 DOM 操作、事件处理和 API 调用更易实现。它不像以前那么流行了，因为“原生”现在可以完成许多\
  \ jQuery 经常使用的功能，但它仍然被许多网站使用。如果你想学习任何关于 jQuery 的知识，阅读 Earle Castledine 的[jQuery:\
  \ Novice to Ninja: New Kicks And Tricks](https://www.sitepoint.com/premium/books/jquery-novice-to-ninja-new-kicks-and-tricks/)不会出错的。\n\
  \n尽管如此，编写自己的辅助函数库也是一种非常有用的练习，有助于提高你的编码技能。这涉及到创建一组你在项目中经常使用的函数。一个例子就是我们在书末的几个编码挑战中使用的\
  \ `randomInt` 函数。\n\n### Node.js\n\n\n\n\nJavaScript 最初被认为是一种用于浏览器的前端编程语言。Node.js\
  \ 在 2009 年发布时从根本上改变了 JavaScript 的格局，这意味着 JavaScript 可以在计算机或服务器上运行，而不需要浏览器。这意味着 JavaScript\
  \ 现在可以用于编写服务端代码并与文件系统进行交互。\n\n如果你安装了 Node.js，你就可以在不使用浏览器的情况下运行 JavaScript，并访问 Node\
  \ REPL（读取-评估-打印循环），这是你自己电脑上的命令行 JavaScript 控制台。它还让你能够访问由 [Node 包管理器](https://www.npmjs.com)\
  \ 提供的庞大 Node 软件包库，这些包提供了广泛的功能。其中许多包都是用于帮助你自动化工作流并在部署之前编译你的 JavaScript 代码的工具。\n\n\
  Node.js 还可以用于用于构建与后端数据库交互的服务端应用程序和动态网站。JavaScript 的异步特性使其非常适合具有大量并发用户的实时更新应用程序，因为它能够以非阻塞的方式快速处理请求。\n\
  \n如果你想学习更多关于 Node.js 的知识，一个很好的起点是“[什么是 Node 以及我什么时候应该使用它？](https://www.sitepoint.com/an-introduction-to-node-js/)”，以及\
  \ [你的 Node.js 第一周](https://www.sitepoint.com/premium/books/your-first-week-with-node-js-2nd-edition/)。\n\
  \n## Deno\n\nNode.js 的创建者 Ryan Dahl 创建了一个名为 [Deno](https://deno.land) 的新项目，他声称该项目解决了\
  \ Node.js 的许多问题。\n\nNilson Jacques 写的“[Node.js vs Deno：你需要知道的](https://www.sitepoint.com/node-vs-deno/)”提供了\
  \ Node.js 和 Deno 的用用对比，而 Craig Buckler 的 TechExeter 演讲“[初探 Deno](https://www.sitepoint.com/premium/tech-talks/techexeter-2020/a-first-look-at-deno)”则提供了一个实用的介绍。\n\
  \n## 学习另一种语言\n\n现在你已经学会了使用 JavaScript 的编程基础，你应该会发现学习另一种语言变得容易得多。那里有大量的语言供你尝试。\n\n\
  如果你喜欢学习面向对象的编程，你可能可能想尝试学习 [Ruby](http://www.ruby-lang.org/en/) 或 [Python](https://www.python.org)。你可以通过阅读\
  \ [Python 门徒](https://www.sitepoint.com/premium/books/the-python-apprentice/)开始，然后进阶到\
  \ [Python 行手](https://www.sitepoint.com/premium/books/the-python-journeyman/) 和\
  \ [Python 大师](https://www.sitepoint.com/premium/books/the-python-master/)。\n\n你可能想尝试学习一种需要编译的经典语言，例如\
  \ [Java](https://www.oracle.com/uk/java/)、[C#](https://docs.microsoft.com/en-us/dotnet/csharp/)\
  \ 或 [Swift](https://swift.org)。\n\n如果你想学习更多关于函数式编程的知识，你可以尝试学习 [Haskell](https://www.haskell.org)、[Elixir](https://elixir-lang.org)、[Erlang](https://www.erlang.org)、[Scala](https://www.scala-lang.org)\
  \ 或 [Clojure](https://clojure.org)。\n\n还有其他脚本语言，如 [Lua](https://www.lua.org) 或 [Bash](https://en.wikipedia.org/wiki/Bash_(Unix_shell))。[Go](https://golang.org)\
  \ 是一种现代动态语言，与 JavaScript 有许多相似之处，而 [TypeScript](https://www.typescriptlang.org)\
  \ 是 JavaScript 的超集，增加了许多特性。特别是，它是一种强类型语言（这意味着你必须声明变量的类型，正如我们在第二章 中讨论的那样）。\n\n一种相对较且被证明非常流行的语言是\
  \ [Rust](https://www.rust-lang.org)。它是一种底层语言，类似于 C++，可以用于编写系统级、高性能的代码“[Rust 教程：面向\
  \ JavaScript 开发者的 Rust 简介](https://www.sitepoint.com/rust-tutorial-introduction-javascript-devs/)”对于了解\
  \ JavaScript 如何工作的人来说是一个很好的介绍。\n\n此外还有一些真正古怪的语言，例如只有三个命令的 [Ook](https://www.dangermouse.net/esoteric/ook.html)（`Ook.`、`Ook?`\
  \ 和 `Ook!`）、[ArnoldC](https://github.com/lhartikk/ArnoldC)（完全由阿诺德·施瓦辛格引言组成的语言），以及\
  \ [Tabloid](https://tabloid.vercel.app)（代码读起来像小报纸！）。\n\n有一点是可以肯定的：你可能不需要担心没有语言学，它们都将帮助你加深对编码概念的理解，并让你领略各种编程范式。\n\
  \n## 持续学习\n\n编码世界变化极快，而且每年都在变得更快。你需要确保自己跟上最新的进展和最佳实践。以下是一些关于如何保持知识新颖的建议：\n\n* 在\
  \ [SitePoint](https://www.sitepoint.com/) 上阅读书籍和文章\n* 观看教程\n* 在社交媒体上关注程序员\n* 阅读博客文章并听播客，例如\
  \ [Syntax](https://syntax.fm/)\n* 加入本地或在线用户组\n* 参加会议或线下聚会\n* 观看技术演讲 [SitePoint](https://www.sitepoint.com/premium/tech-talks/)\n\
  \n## 继续编码\n\n你可以学习所有的理论，但唯一进步的方法是实际编码。通过将想法付诸实践，你将开始对编程的感觉。以下是用你的 JavaScript 技能可以构建的一些想法。\n\
  \n以下想法旨在激发你的灵感，并希望能激发你产生项目的想法。这绝不是你能做的完整列表，因为可能性是无限的。\n\n### Web 应用程序\n\nJavaScript\
  \ 最初是为了让网站具有交互性。但从这些基础开始，它已经发展成为一种强大的语言，能够产生像 Gmail、Netflix 和 Uber 这样复杂的应用程序。基础网站可以使用\
  \ HTML 和 CSS 构建，尽管它们通常会使用 JavaScript 添加一些额外的交互。相反，复杂的应用程序通常涉及一个托管数据库的后端服务器以及一个包含\
  \ HTML、CSS 和 JavaScript 的前端。它们通常会托管自己的 API，供其他站点与存储在数据库中的数据交互。这些每一层构成了所谓的开发栈。全栈开发涉及该栈的每个部分。\n\
  \nJavaScript 现在可以用于编写应用程序的前端以及运行在服务器上的后端。它甚至可以与数据库进行交互。这使得 JavaScript 成为编写全栈应用程序的有用语言。如果你将你的\
  \ JavaScript 技能到更高水平，你将完全具备开发严肃、高性能 Web 应用程序的能力。\n\n渐进式 Web 应用（PWA）是使用本地存储使其看起来像原生应用程序的\
  \ Web 。它们加载更快，使用起来更流畅，不需要持续的网络连接。在 Jason Grigsby 的演讲“[规划你的渐进式 Web 应用](https://www.sitepoint.com/premium/tech-talks/web-directions-code-2019/planning-your-progressive-web-app)”中，他涵盖了构建渐进式\
  \ Web 应用时需要考虑的关键事项。\n\n\n\n\n\n许多现代网站和应用程序通过在线 API 与第三方应用程序进行交互，以共享和交换数据。这通常存储为\
  \ [JSON（JavaScript 对象表示）](http://www.json.org)，它是我们在第 9 章中遇到的对象字面量的字符串表示形式。它是一种轻量级数据格式，允许数据以人类可读的形式进行序列化。尽管它源自\
  \ JavaScript 对象，但大多数现代编程语言都包含了生成和解析 JSON 格式数据的方法。\n\n一种变得日益流行的生产模式是 `Jamstack`。这是一个由\
  \ JavaScript、APIs 和标记语言（JAM）组成的技术栈。其核心思想是使用 HTML、CSS 和 JavaScript 构建网站，并使用 API 从网络服务获取数据。Phil\
  \ Hawksworth 曾在 [Pixel Pioneers 上的一场演讲](https://www.sitepoint.com/premium/tech-talks/pixel-pioneers/jamstack-silly-name-serious-stuff)\
  \ 中解释了它的工作原理。\n\n在他在“[JavaScript 拯救世界](https://www.sitepoint.com/premium/tech-talks/dotjs-2019/javascript-saves-the-world)”的演讲中，Asim\
  \ Hussain 提供了一些关于如何提高 Web 应用效率的技巧，这能够带来更好的用户体验，而且既物廉又环保。\n\n许多现代 Web 应用程序需要跟踪数据——无论这些是从外部网络服务获取的数据，还是用户生成的数据。这意味着网页需要能够跟踪数据的任何变化，并相应地更新用户界面（UI）。有几个框架旨在让你更容易制作交互式\
  \ UI，并帮助进行*状态管理*。\n\n主要的巨头是 [React](https://reactjs.org) 和 [Vue](https://vuejs.org)。这两者都为了同一个目标采取了各自独特的方法，即创建组件，这些组件会在用户交互或数据变化时自动更新。关于\
  \ React 和 Vue 的在线教程层出不穷，而且它们在自己的网站上都有良好的入门教程，因此值得尝试一下这两者，看看你更倾向于使用哪一个。\n\n还有 [Svelte](https://svelte.dev)，它是一个更轻量的选择，采用与\
  \ React 和 Vue 略有不同的方法，可能更适合小型项目。它们网站上的教程是一个极佳的起点。\n\n一个很好的起点是我们在本书中创建的待办事项列表应用。你可以尝试将其开发为一个功能齐全的\
  \ Web 应用。\n\n为什么不尝试构建下一个在线热门产品呢？\n\n### 游戏开发\n\n大多数在线游戏过去使用 Flash 编写，但 JavaScript\
  \ 是构建现代浏览器端游戏的首选语言。WebGL 和浏览器 GPU 的发展意味着在浏览器中运行快速渲染的 3D 游戏已成为可能。现代在线经典如 [HexGL](https://hexgl.bkcore.com)、[世界最大的\
  \ PAC-MAN](https://worldsbiggestpacman.com/) 和 [Swooop](https://s3-eu-west-1.amazonaws.com/apps.playcanvas.com/R2axJfsc/index.html)\
  \ 显示了浏览器中可以运行的内容。这些都是可以实现功能的绝佳例子，但游戏不必过于复杂：[Flappy Bird](https://flappybird.io/)\
  \ 的成功表明，一个执行良好的良好创意可以变得非常受欢迎。\n\n![HexGL](img/hexgl.png)\n\n如果你对编写 HTML5 游戏感兴趣，那么由\
  \ Earle Castledine 编写的[HTML5 游戏：从新手到大师](https://www.sitepoint.com/premium/books/html5-games-novice-to-ninja)*\
  \ 将是完美的起点。\n\n为什么不尝试编写下一个大片级游戏呢？\n\n### 移动应用开发\n\nAndroid 和 iOS 不使用 JavaScript 作为它们的原生编程语言。然而，你仍然可以使用\
  \ HTML、CSS 和 JavaScript 构建应用程序，然后使用如 [Ionic](https://ionicframework.com)、[Cordova](https://cordova.apache.org/)\
  \ 或 [PhoneGap](https://phonegap.com/) 等工具将你的代码转换为可以在 Android 和 iOS 平台上运行的原生代码。\n\
  \n为什么不尝试编写下一个热门移动应用呢？\n\n### 桌面应用开发\n\n[Electron](https://electron.atom.io) 是一个开源库，允许你使用\
  \ HTML、CSS 和 JavaScript 构建桌面应用程序。它使用 Chromium（Google Chrome 的开源版本）和 Node.js 创建可以在\
  \ Windows、macOS 和 Linux 上运行的应用程序。\n\nElectron 是 GitHub 在构建 Atom 文本编辑器时开发的。从那时起，Electron\
  \ 已成为想要创建 Web 应用桌面版本的开发者的流行选择。它已被用于创建如 WhatsApp、Microsoft Teams 和 Slack 等桌面应用程序。\n\
  \n为什么不尝试编写下一个热门桌面应用呢？你可以从 Electron 的[快速上手指南](https://www.electronjs.org/docs/tutorial/quick-start)开始。\n\
  \n## 物联网\n\nJavaScript 正在成为与“[物联网](http://en.wikipedia.org/wiki/Internet_of_Things)”通信的首选语言。这包括了一系列设备，从手表、虚拟现实头设备到家庭助手甚至无人机！JavaScript\
  \ 经常是用于为这些不断增长的电子设备编写代码的语言。为什么不尝试为你最新的可穿戴设备或家居设备编写一些自定义代码呢？\n\n## 挑战\n\n本章提供了许多关于你可以做什么的想法，但上述大量的建议可能会让你产生“选择困难症”。因此，后续挑战的目标是让你专注于需要要做的事情。如果你完成了每项挑战，你将走上成为开发者之路：\n\
  \n1. 安装一个文本编辑器。有很多[视频](https://www.youtube.com/results?search_query=how+to+set+up)\
  \ 教你如何设置 VS Code。\n\n2. 安装 Node.js。\n\n3. 使用 `npm` 安装 React。\n\n4. 使用 React 构建 Web\
  \ 应用。（[SitePoint](https://www.sitepoint.com/react/) 有很多此类教程。）\n\n5. 安装 Git 并使用它进行版本控制。\n\
  \n6. 将你的应用推送到 GitHub。\n\n7. 构建另一个 React 应用，从另一个网站获取并显示数据。\n\n8. 重复\n\n## 总结\n\n\
  * 通过安装文本编辑器来设置你的编码环境。\n* 样式指南将有助于以一致的风格编写代码并使其易于阅读。\n* 测试将帮助代码免于 Bug 和错误。\n* 版本控制（如\
  \ `Git`）可以帮助管理代码的任何变化。\n* 更多 JavaScript 需要学习，包括 Web API 和模块。\n* `jQuery`、`Lodash`\
  \ 和 `date-fns` 等 JavaScript 库提供了让开发更容易的方法。\n* `Node.js` 让你在没有浏览器的情况下运行 JavaScript\
  \ 并开发应用程序。\n* 你还有许多其他可以学习的编程语言。\n* `React`、`Vue` 和 `Svelte` 等 JavaScript 框架有助于创建响应数据变化的的用户界面。\n\
  * JavaScript 现在可以编程 Web 开发栈的每一个部分，使其成为全栈开发的完美语言。\n* 你可以使用 JavaScript 构建网站、Web 应用、游戏、手机应用或桌面应用。\n\
  * 得益于物联网，你的编程技能可以控制家中的几乎任何设备。\n* 通过阅读书籍和文章、听播客、看视频以及在社交媒体上关注开发者来保持你的知识更新。\n* 持续不断编写代码并构建东西吧！\n\
  \n\n\n\n\n这标志着本章以及整本书的结束。希望你喜欢学习编程的过程，也希望这一章的内容能激励你将编程水平提升到新的高度。无论你决定做什么，最重要的一点就是坚持写代码。写得越多，进步得越快。编程是为了解决问题和创造事物。所以，你还在等什么？开始编程吧！唯一的限制就是你的想象力！\n"
