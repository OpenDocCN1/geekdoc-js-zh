  \n```\nconst summer = ['Jun', 'Jul', 'Aug'];\nconst winter = ['Dec', 'Jan', 'Feb'];\n\
  const nested = [ summer, winter ];\n<< [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan',\
  \ 'Feb' ] ]\n\nconst flat = [...summer, ...winter];\n<< [ 'Jun', 'Jul', 'Aug', 'Dec',\
  \ 'Jan', 'Feb' ]\n```\n\nJavaScript 还有 `flat()` 方法，它不需要展开运算符即可展平数组，如下所示：\n\n```\n\
  [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan', 'Feb' ] ].flat();\n<< [ 'Jun', 'Jul',\
  \ 'Aug', 'Dec', 'Jan', 'Feb' ]\n```\n\n关于创建和操作数组的总结可以在 [SitePoint 的这篇文章](https://www.sitepoint.com/quick-tip-create-manipulate-arrays-in-javascript/)\
  \ 中找到。\n\n\n\n\n我们的小型游戏只有四个角色：Alfie、Betty、Gemma 和 Del。\n\n![我们“猜猜谁”游戏中的四个角色](img/guesswho.png)\n\
  \n每个角色都有两个特定特征：他们要么戴帽子，要么不戴；他们要么戴眼镜，要么不戴。\n\n例如，如果我问“谁戴了眼镜？”，答案就是“Betty 和 Del”。\n\
  \n![谁戴了眼镜？](img/glasses.png)\n\n### 否定（逻辑非）\n\n`Negation`（否定）返回一个布尔值的反值。因此，真值（truthy\
  \ values）将返回 `false`，而假值（falsy values）将返回 `true`。\n\n例如，如果我正在玩“猜猜谁”游戏，问题“谁**没有**戴眼镜？”是对问题“谁戴了眼镜？”的否定。“NOT”这个词充当了否定操作符，答案是“Alfie\
  \ 和 Gemma”。\n\n![谁没有戴眼镜？](img/notglasses.png)\n\n如果我问“谁**没有**戴帽子”，这将是对所有*戴着*帽子的人的否定，答案将是“Alfie\
  \ 和 Del”。\n\n![谁没有戴帽子？](img/nothat.png)\n\n在 JavaScript 中，通过在值前面加上逻辑非操作符（`!`）来实现否定。这可以被认为是在语句前面加上“NOT”单词是一样的。一个真值总是会被否定为\
  \ `false`，而假值总是会被否定为 `true`。我们可以通过在控制台中尝试以下示例来看到这一点：\n\n```\n!true; // 否定 true 返回\
  \ false\n<< false\n\n!0; // 0 是假值，所以否定它返回 true\n<< true\n\n!'hello'; // 所有非空字符串都是真值\n\
  << false\n```\n\n`Double negation`（双重否定，`!!`）是一种用于判断一个值是真值还是假值的快捷方法，因为它实际上是“否定了否定”，将值变回其原始的布尔值，如下代码所示：\n\
  \n```\n!!''; // 空字符串是假值\n<< false\n\n!!\"hello\"; // 所有非空字符串都是真值\n<< true\n\n!!3;\
  \ // 所有非零数字都是真值\n<< true\n\n!!0; // 零是假值\n<< false\n```\n\n双重否定的效果与我们之前在章节中看到的 `Boolean()`\
  \ 函数相同。\n\n### 逻辑与\n\n为了看到 AND 操作符的示例，让我们再次玩“猜猜谁”游戏。如果我问“谁既戴了眼镜**又**戴了帽子？”，结果将是“Betty”。\n\
  \n![谁戴着帽子和眼镜？](img/glassesandhat.png)\n\n在这种情况下，“AND”这个词充当了逻辑操作符。逻辑 AND 操作符作用于两个或多个值，如果*所有*值都是真值，则返回\
  \ `true`；如果其中*任何*一个是假值，则返回 `false`。\n\n在 JavaScript 中，`&&` 用作逻辑 AND 操作符。如果所有值都是真值，则返回*最后一个*真值；如果某些是假值，则返回*第一个*假值。可以通过下面的代码示例看到：\n\
  \n```\n'hello' && 42;\n<< 42\n```\n\n字符串 `'hello'` 和数字 `42` 都是真值，所以返回最后一个值 `42`。\n\
  \n下一个语句返回 `false`，因为它是语句中的第一个假值：\n\n```\ntrue && false; // 返回 false 是因为它是假值\n<<\
  \ false\n```\n\n### 逻辑或\n\n让我们回到玩“猜猜谁”游戏来演示逻辑 OR 操作符。\n\n如果我们问“谁戴了眼镜**或**戴了帽子？”，这将包括所有戴了眼镜、帽子或两者都戴的人，所以答案是“Betty,\
  \ Gemma 和 Del”。\n\n![谁戴着眼镜或帽子？](img/glassesorhat.png)\n\n在这个例子中，“OR”这个词充当了逻辑操作符。\n\
  \n逻辑 OR 操作符作用于两个或多个值，如果其中*任何*值是真值，则返回 true；如果*所有*值都是假的，则返回 `false`。\n\n在 JavaScript\
  \ 中，`||` 用作逻辑 OR 操作符。如果其中任何一个为真，则返回*第一个*真值；如果所有都是假的，则返回*最后一个*假值。\n\n你可以在下面的代码示例中看到这一点。如果两个表达式都是真值，则返回第一个：\n\
  \n```\n'hello' || 'goodbye';\n<< 'hello'\n```\n\n这返回 `'hello'`，因为它是这个两个值均为真值的复合语句中的第一个真值。\n\
  \n如果值中只有一个是真值，则将返回该值，正如下一个示例所示：\n\n```\n'all' || 0; // 要全或全无！\n<< 'all'\n```\n\n\
  在最后一个示例中，两个值都是假值，所以返回*最后一个*值：\n\n```\nfalse || 0;\n<< 0\n```\n\n### 比较\n\n在编程时，我们经常需要比较值，有多种方法可以实现。\n\
  \n### 等等\n\n`equality operator`（相等操作符）可用于检查两个值是否相等。大多数编程语言使用双等操作符（`==`）来检查相等性。\n\
  \n例如，如果我们想知道变量 `answer` 是否等于 42，我们可以写：\n\n```\nanswer == 42;\n```\n\n\n\n\n```\n\
  answer === Number('42');\n<< true\n```\n\n当你处理用户输入的、且预期其为数字的值时，这种方法非常有用，因为大多数编程语言都会会将用户输入的数据视为字符串。\n\
  \n## 不等性\n\n我们可以使用`不不等运算符`来检查两个值是否`不`相等。这里有一个软不不等运算符（`!=`）和一个强不不等运算符（`!==`）。它们的工作方式与软相等运算符和强相等运算符类似：\n\
  \n```\n16 != '16'; // 类型转换使得它们相等\n<< false\n\n16 !== '16';\n<< true\n```\n\n与相等性判断一样，你应该使用强不不等运算符，因为这将提供更可靠的结果，且不受类型转换的影响。\n\
  \n## 大于和小于\n\n我们可以使用 `>` 运算符来检查一个值是否大于另一个值。以下代码可以用于检查变量 `answer`（值为 42）是否大于 10：\n\
  \n```\nanswer > 10;\n<< true\n```\n\n你也可以以类似的方式使用“小于”运算符（`<`）来检查 `answer` 是否小于 50：\n\
  \n```\nanswer < 50;\n<< true\n```\n\n如果你想检查一个值是否大于、小于*或等于*另一个值，你可以使用 `>=` 和 `<=`\
  \ 运算符。以下代码将检查 `answer` 是否小于或等于 42：\n\n```\nanswer <= 42;\n<< true\n```\n\n这些运算符也可以用于字符串，字符串将按字母顺序排序，以检查其中一个字符串是否“小于”另一个：\n\
  \n```\n'apples' < 'bananas';\n>> true\n```\n\n但请注意，结果是区分大小大小的，且大写字母被认为“小于”小写字母：\n\
  \n```\n'apples' < 'Bananas';\n>> false\n```\n\n## 流程控制\n\n在上一节中，我们查看了如何比较语句，例如检查两个值是否相等。在本节中，我们将根据语句的真假值通过运行不同的代码块，来控制程序的执行流。这有点比在程序中遇到了一个十字路口，你可以决定代码将向哪个方向运行。这将有助于我们的程序变得有趣得多，因为它们可以根据发生的情况产生不同的结果。\n\
  \n### If 语句\n\n`if 语句`可以用于仅在特定条件返回真时运行代码块。例如，假设你想检查自己是否累了。如果你*确实*累了，计划就是去睡觉。这可以通过下面的图所示：\n\
  \n![你累了吗？](img/if-tired.png)\n\n在伪代码中，可以这样写：\n\n```\nif you are tired then go to\
  \ sleep.\n```\n\n在 JavaScript 中，代码看起来如下：\n\n```javascript\nif (tired) {\n  sleep();\n\
  }\n```\n\n块中的内部代码只有在括号中的条件为真时才会运行。如果条件不是布尔值，它将根据它是真（truthy）还是假（falsy）转换为布尔值。\n\n\
  让我们通过在控制台中输入以下内容尝试编写一些条件代码：\n\n```\nlet energy = 10;\nif (energy < 3) {\n  alert('ZZZ...');\n\
  }\n```\n\n只有当 `energy < 3` 求值为 `true` 时，才会显示警告框，因此只有当 `energy` 变量的值小于 3 时。由于 `energy`\
  \ 变量被赋值为 10，这意味着什么都不会发生。\n\n尝试在控制台中将 `energy` 变量的值改为 3 以下的值，然后再次进入 if 块。这一次，警告框将像下图所示显示：\n\
  \n![ZZZ...](img/zzz.png)\n\n显然，在实际程序中，我们不会这样手动更改变量。它们通常取决于用户输入或程序中的其他条件。但别担心——我们很快就会接触更多实用的示例！\n\
  \n### Else 语句\n\n如果条件不为真，你想做些别什么呢？这正是 `else 语句`的作用。\n\n例如，假设你累了就去睡觉，否则你想去跑步。这可以通过下面的图所示：\n\
  \n![睡觉还是跑步？](img/if-tired-else-run.png)\n\n在伪代码中，可以这样写：\n\n```\nif you are tired\
  \ then go to sleep\nelse go for a run\n```\n\n在 JavaScript 中，写法如下：\n\n```javascript\n\
  if(tired){\n  sleep();\n} else {\n  run();\n}\n```\n\n`else` 关键字添加了一个备选代码块，只有当原始条件不为真时才会执行。这意味着其中代码块将会运行。\n\
  \n让我们在控制台中写一个 if–else 语句：\n\n```\nlet energy = 10;\nif (energy < 3) {\n  alert('ZZZ....');\n\
  } else {\n  alert('Time to start running!');\n}\n```\n\n这段代码应该产生一个与下图类似的警告。\n\n\
  ![该开始跑步了！](img/run.png)\n\n### 三元运算符\n\n`三元运算符`（`?`）是编写 if–else 语句的简写方式。它接受三个操作数：一个条件、一个真时的结果和一个假时的结果。\n\
  \n```javascript\nenergy = 10;\nenergy < 3 ? alert('ZZZ...') : alert('Time to start\
  \ running!');\n```\n\n三元运算符可以用于替换简单的 `if...else` 语句。它通常更简洁，但如果逻辑复杂，可能更难以阅读。\n\n\n\
  \n\n\n这里另一个可以根据测试分数生成等级的示例：\n\n```\nconst legs = Number(prompt('How many legs does\
  \ your favorite animal have?'));\nif (legs === 0) {\n  alert('Your favorite animal\
  \ is a fish!');\n} else if (legs === 2) {\n  alert('Your favorite animal is a penguin!');\n\
  } else if(legs === 4){\n  alert('Your favorite animal is an elephant!');\n} else\
  \ if(legs === 8){\n  alert('Your favorite animal is an octopus!');\n} else {\n \
  \ alert(`I'm not sure what animal has that many legs!`);\n}\n```\n\n`switch operator`\
  \ 提供了一种替代表示法，当有很多条件需要测试时（如本例所示），它可以让你的代码更容易读。\n\n上面的示例可以使用 `switch` 语句重写如下：\n\n\
  ```\nconst legs = Number(prompt('How many legs does your favorite animal have?'));\n\
  \nswitch (legs) {\ncase 0:\n  alert('Your favorite animal is a fish!');\n  break;\n\
  case 2:\n  alert('Your favorite animal is a penguin!');\n  break;\ncase 4:\n  alert('Your\
  \ favorite animal is an elephant!');\n  break;\ncase 8:\n  alert('Your favorite\
  \ animal is an octopus!');\n  break;\ndefault:\n  alert(`I'm not sure what animal\
  \ has that many legs!`);\n}\n```\n\n你正在比较的值放在 `switch` 运算符后面的括号中。随后使用 `case` 关键字来对应每个可能出现的值（上述示例中的\
  \ 0, 2, 4 和 8）。在每个 `case` 语句之后是当该 case 发生时应该运行的代码。\n\n`default` 关键字用于末尾，用于在任何 `case`\
  \ 都不真的情况下需要运行的代码。在下面的示例中，如果你没有得到 10、9 或 8 分，它会给出一个遗憾的消息，告诉你测试没格了。\n\n你可以查看 [我在 CodePen\
  \ 上的代码](https://codepen.io/SitePoint/pen/KKNpOPB)。\n\n### 使用 `break`\n\n用 `break`\
  \ 关键字结束每个 `case` 块是非常重要的，因为这会停止任何后续 `case` 块的执行。如果没有 `break` 语句，程序将“贯穿”（fall through）并继续评估后续的\
  \ `case` 块。\n\n## 剪刀石头布\n\n让我们在 CodePen 上尝试另一个编码项目。这次，我们将尝试创建一个经典游戏剪刀石头游戏的互动版本，你将与电脑对战。这将让我们有机会使用在在本章中学习的知识来判断谁赢了游戏。\n\
  \n开始之前，让我们询问玩家他们的选择是什么。打开一个新的 Pen 并在 `JS` 部分添加以下代码：\n\n```\nconst player = prompt('Choose\
  \ rock, paper or scissors').toLowerCase().trim();\n```\n\n这使用一个提示框要求用户输入“rock”、“paper”或“scissors”。\n\
  \n我们还使用 `toLowerCase()` 和 `trim()` 方法对他们的答案进行了“清洗”。这确保了他们的答案全为小写，并移除了任何多余的空格。这个字符串存储在变量\
  \ `player` 中。\n\n接下来，我们需要编写电脑的选择。剪刀石头游戏的最佳策略是随机玩，因此我们可以根据随机数来决定电脑的选择。让我们现在创建那个随机数。添加以下代码：\n\
  \n```\nconst number = Math.ceil(3*Math.random());\n```\n\n这使用了我们在 第 4 章 中遇到过的 `Math.ceil()`\
  \ 和 `Math.random()` 方法来选择 1 到 3 之间的随机数，并将其存储在变量 `number` 中。我们现在需要使用这个数字来选择电脑的选择。我们将使用\
  \ switch 块来实现。添加以下代码：\n\n```\nlet computer;\n\nswitch(number){\n  case 1: \n   \
  \ computer = 'rock'; break;\n  case 2:\n    computer = 'paper'; break;\n  case 3:\n\
  \    computer ='scissors';\n}\n```\n\n首先，这声明了一个名为 `computer` 的变量，用于存储电脑的选择。然后我们创建了一个\
  \ switch 语句，获取我们之前选择的随机数，如果它是 1，则将值“rock”赋值给变量 `computer`；如果是 2，则赋值“paper”，如果是 3，则赋值“scissors”。\n\
  \n我们现在有一个名为 `player` 的变量和另一个名为 `computer` 的变量。这两个变量都包含一个字符串 'rock''paper' 或 'scissors'，分别代表玩家和电脑的选择。我们的下一个工作是根据这些值判断谁赢。最容易测试的结果是平局，因为如果\
  \ `player` 和 `computer` 变量相同，就会发生平局。添加以下代码处理此情况：\n\n```\nif (player === computer){\n\
  \  alert(`It was a draw, we both chose ${player}`);\n}\n```\n\n注意我们如何使用模板字符串和字符串插值来反馈他们都做出的选择。\n\
  \n接下来，我们将查看所有导致玩家胜出的选项。这种情况有三种方式：\n\n*   玩家选择“rock”，电脑选择“scissors”\n*   玩家选择“paper”，电脑选择“rock”\n\
  *   玩家选择“scissors”，电脑选择“paper”\n\n所有这些选项都可以使用逻辑 AND 和 OR 运算符来表示。如下所示：\n\n```javascript\n\
  if (player === 'rock' && computer === 'scissors') ||\n    (player === 'paper' &&\
  \ computer === 'rock') ||\n    (player === 'scissors' && computer === 'paper') {\n\
  \  alert(`You win!`);\n} else if (player === computer) {\n  alert(`It was a draw,\
  \ we both chose ${player}`);\n} else {\n  alert(`You lose!`);\n}\n```\n\n## 挑战\n\
  \n1. 编写一些代码问一个问题，然后检查用户提供的答案是否正确。使用提示框告诉他们是对是错。你可以查看 [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/XNbvd)。\n\
  2. 编写一个“大小”游戏。电脑应该随机选择 1 到 10 之间的数字，然后使用确认框询问用户下一个数字是否更大。电脑应选择另一个 1 到 10 之间的随机数，并告诉用户是对是错。你可以查看\
  \ [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/jOVv)。\n3. 编写一些代码随机两个数字，然后要求用户将它们相乘。使用提示框告诉用户答案是否正确。你可以查看\
  \ [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/NWqr)。\n\n## 总结\n\n*   布尔值是原始值\
  \ `true` 或 `false`。\n*   所有值都有内在的布尔值 `true` 或 `false`。\n*   真值是布尔值为 `true` 的值。大多数值都是真值。\n\
  *   假值是布尔值为 `false` 的值。不同语言中的假值有所不同。JavaScript 中有九个假值。\n*   取反会让真值变假，假值变真。双重取反返回一个值的布尔值。\n\
  *   逻辑运算符（如 AND 和 OR）可以组合多个语句。\n*   可以比较值以查看它们是否等于、大于或小于其他值。\n*   条件语句可以根据条件控制程序的流。\n\
  *   三元运算符是用单行代码编写 if-else 语句的简洁方式。\n*   当有多个选项时，可以使用 switch 语句。\n\n\n\n\n\n计算机非常擅长反复执行重复性任务。它们永远不会感到无聊，并且每次都会完全按照指令执行。循环（Loops）是一种让程序根据特定条件重复某段代码的方法。\n\
  \n在本章中我们将涵盖：\n\n*   什么是循环\n*   无限循环\n*   while 循环\n*   do–while 循环\n*   for 循环\n\
  *   嵌套循环\n\n## 什么是循环？\n\n`loop`（循环）是一段会持续运行直到满足某个特定条件的代码。\n\n为了说明这一点，这里有一张图，展示了火箭发射前的倒计时作为一个循环。\n\
  \n![火箭倒计时循环](img/countdownloop.png)\n\n如你所见，我们从 10 开始，大声说出数字，将数字减去 1，然后检查是否达到了 0。如果还没有达到零，我们就回到开头重复该过程，因此我们继续大声说出数字，然后减\
  \ 1，直到达到 0。一旦发生这种情况，我们就会跳出循环，火箭就可以发射了！\n\n在本章中，我们将学习编写循环的各种不同方法。和往常一样，我们将使用 JavaScript\
  \ 来演示代码，尽管这些原理在大多数其他编程语言中是非常相似的。\n\n## 无限循环\n\n在某个时刻满足停止循环的条件是非常重要的。否则，你的代码将陷入 `infinite\
  \ loop`（无限循环），这可能导致程序崩溃或使其“卡死”。\n\n考虑图中所示的循环。它与上一个非常相似，但有一个细微的。你能发现它并解释为什么这意味着循环永远不会结束吗？\n\
  \n![无限循环](img/infiniteloop.png)\n\n这个示例中的问题是，数字每次通过循环都会*增加* 1，因此它永远不会达到零，从而永远不会跳循环并停止。每当你编写循环时，都需要确保有一种方法让它结束运行。\n\
  \n## While 循环\n\n我们将查看的第一种循环是 `while loop`。当某个条件为真时，它会反复运行一段代码。\n\nwhile 循环的伪代码可能看起来如下：\n\
  \n```\nwhile (some condition is true) {\n  do something\n}\n```\n\n只要括号中设置的条件保持为真，程序就会继续“执行操作”。通常，代码块会执行对条件真值产生影响的操作，最终它将变为假，循环就会结束。\n\
  \n### 十个绿瓶子\n\n循环的一个经典演示是让计算机“唱”热门歌曲 [Ten Green Bottles](https://www.youtube.com/watch?v=Ak7kedzR8bg)\
  \ 的歌词。\n\n接下来的图展示了如何使用 while 循环来实现这一点。\n\n![while 循环是如何工作的](img/whileloop.png)\n\
  \n我们在进入主循环之前，首先将瓶子的数量初始化为 10。在每次循环开始时，都会检查瓶子是否大于零，如果是，循环将继续。否则，它将跳出并停止。\n\n让我们尝试用\
  \ JavaScript 写这段代码。打开控制台并输入以下代码：\n\n```javascript\nlet bottles = 10;\n```\n\n这将一个名为\
  \ `bottles` 的变量初始化为 10。这代表墙上剩余的瓶子数量。在 while 循环中使用的任何变量必须在循环运行之前声明并初始化。否则，在循环中引用它们时将会报错。\n\
  \n现在让我们写这个循环：\n\n```javascript\nwhile (bottles > 0){\n  console.log(`There were\
  \ ${bottles} green bottles, hanging on a wall. And if one green bottle should accidentally\
  \ fall, there'd be ${bottles-1} green bottles hanging on the wall.`);\n  bottles--;\n\
  }\n```\n\n循环以 `while` 关键字开头，后面跟着括号中的条件，即变量 `bottles` 必须大于零。只要该条件为真，循环就会继续执行。这基本上意味着“只要瓶子的数量大于零，就重复这段代码块”。\n\
  \n代码块使用 `console.log` 记录一个使用字符串插值的模板字面量（template literal），以显示剩余瓶子的数量。输出将显示在控制台中。然后使用递减运算符（`--`）将\
  \ `bottles` 变量减少 1。\n\n![在控制台中显示的十个绿瓶子的结果](img/greenbottles.png)\n\n你可以查看[我在 CodePen\
  \ 上的代码](https://codepen.io/SitePoint/pen/poNgevL?editors=1112。（点击左下角的 **Console**\
  \ 标签以查看 CodePen 控制台中的结果。）\n\n## Do–while 循环\n\n`do–while loop` 与 while 循环类似。唯一的区别是条件出现在代码块*之后*。在伪代码中，它可能看起来如下：\n\
  \n```\ndo {\n  // do something\n} while(condition)\n```\n\nwhile 循环和 do–while 循环之间的关键区别在于，在\
  \ do-while 循环中，代码块先执行，这意味着无论条件是否为真，它都会至少运行一次。\n\n接下来的图展示了如何使用 do–while 循环实现“十个绿瓶子”歌曲。\n\
  \n![do–while 循环是如何工作的](img/dowhileloop.png)\n\n如你所见，它与 while 循环非常相似，只是条件移动到了最后。让我们尝试用\
  \ JavaScript 编写它：\n\n```javascript\nlet bottles = 10;\ndo {\n  console.log(`There\
  \ were ${bottles} green bottles, hanging on a wall. And if one green bottle should\
  \ accidentally fall, there'd be ${bottles-1} green bottles hanging on the wall.`);\n\
  \  bottles--;\n} while (bottles > 0);\n```\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/ZEBQ)。\n\
  \n## For 循环\n\n`for loops`（for 循环）是最常见的循环类型，出现在大多数编程语言中。它们的形式如下：\n\n```\nfor (initialization\
  \ ; condition ; update) { \n  do something\n}\n```\n\n括号内设置了三件事：\n\n*   `initialization`（初始化）代码在循环开始之前之前运行，通常用于初始化循环中使用的任何变量。\n\
  *   `condition`（条件）必须满足循环才能继续。\n*   `update`（更新）代码在每次*迭代*之后执行，通常用于更新任何值。\n\n这一过程在图中所示。\n\
  \n![for 循环是如何工作的](img/forloop.png)\n\n对于瓶子歌曲，我们需要将瓶子数量初始化为 10。条件是该数量必须大于零，更新代码是将瓶子数量减少\
  \ 1。如下所示。\n\n![十个绿瓶子的 for 循环](img/forbottles.png)\n\n让我们尝试用 JavaScript 编写。在控制台中输入以下代码：\n\
  \n```javascript\nfor (let bottles = 10 ; bottles > 0 ; bottles--) {\n  console.log(`There\
  \ were ${bottles} green bottles, hanging on a wall. And if one green bottle should\
  \ accidentally fall, there'd be ${bottles-1} green bottles hanging on the wall`);\n\
  }\n```\n\n这把变量 `bottles` 初始化为 10，然后设置条件为 `bottles > 0`，并在每次循环后使用递减运算符 `bottles--`\
  \ 将 `bottles` 变量的值减少 1。\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/Vwmepa)。\n\
  \n结果与之前完全相同。事实上，你可能已经注意到可以使用 while 循环、do–while 循环或 for 循环来实现完全相同的结果。for 循环通常被认为更清晰（并且在\
  \ Web 相关的代码示例中更流行），可能是因为循环的所有细节（初始化、条件和更新代码）都在同一个地方，并保持在实际代码块之外。\n\n\n\n\n\n你可以将一个循环放在另一个循环内部，创建一个**嵌套循环**。它们包含一个内循环，在外层循环执行下一步之前，内循环会完整运行。可以通过下面的图直观地看到这一点。\n\
  \n![嵌套循环如何工作](img/nestedloop.png)\n\n如你所示，对于外层循环的每一步，内循环都会完整运行。一旦内循环运行完毕，外层循环的变量就会更新，然后它再次完整运行内循环。此过程一直持续，直到外层循环满足停止条件。\n\
  \n让我们写一个程序来创建一个乘法表，从“1 的表”一直到“12 的表”。也就是说，1 x 1 = 1，1 x 2 = 2，1 x 3 = 3 …… 直到 12\
  \ x 12 = 144。\n\n为了实现这一点，我们希望外层循环将第一个数字设置为 1，然后使用内循环将其乘以第二个数字，该数字在每一步中将从 1 变为 12。当我们用\
  \ 1 乘以每一个数字后，我们会在外层循环中将第一个数字增加到 2，并在内循环中用它乘以 1 到 12 的所有数字，依此类推，直到得到 12 乘以 12。\n\n\
  在控制台中输入以下代码：\n\n```\n// outer loop\nfor(let i=1 ; i<13 ; i++){\n  // inner loop\n\
  \  for(let j=1 ; j<13 ; j++){\n    console.log(`${j} multiplied by ${i} is ${i*j}`);\n\
  \  }\n}\n```\n\n### 循环变量\n\n我们在上面的代码中创建了两个变量，`i` 和 `j`。在循环中，传统上使用单个字母作为这些“计数器”变量名。为什么呢？因为这样很整洁！但你可以使用任何长度的变量名（就像我们在编写“十个绿瓶子”循环时做的那样）。但是，为什么要写比需要的更长的变量名呢？\n\
  \n需要注意的是，你需要在每个嵌套循环中使用不同的字母作为变量，以免产生混淆。在这个例子中，我们在外层循环中使用 `i`，在内循环中使用 `j`。\n\n外层循环将变量\
  \ `i` 从 1 增加到 12。对于外层循环的每一步，内循环都会将变量 `j` 从 1 增加到 12。因此，第一次迭代从 `i = 1` 和 `j = 1`\
  \ 开始，并在控制台输出输出：\n\n```\n<< 1 multiplied by 1 is 1\n```\n\n在下一步中，我们仍在内循环内部，因此 `i`\
  \ 保持为 1，但 `j` 增加到 2，结果如下：\n\n```\n<< 1 multiplied by 2 is 2\n```\n\n`j` 继续增加直到达到\
  \ 12。之后，程序跳出内循环并返回外层循环，此时 `i` 从 1 更新为 2。然后它重新进入内循环，`j` 被初始化回 1 并再次开始计数到 12。这个过程一直持续，直到最后一次迭代产生这一行：\n\
  \n```\n<< 12 multiplied by 12 is 144\n```\n\n在控制台中运行这段代码。你应该会在控制台中看到与下图所示的输出。\n\n\
  ![乘法表](img/multiplications.png)\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/eYBJvMo)。\n\
  \n## 挑战\n\n1. 写一个从 1 计数到 100 的循环，并检查数字是否是 3 或 5 的倍数。如果是 3 的倍数，应该在控制台打印“Fizz”。如果是\
  \ 5 的倍数，应该在控制台打印“Buzz”。如果是 3 和 5 的倍数，应该在控制台打印“FizzBuzz”，如果两个者都不是倍数，则只需在控制台打印该数字。初始输出应该像这样：\n\
  \n   ```\n   << 1, 2, Fizz, 4, Buzz, Fizz, 7, 8, Fizz, Buzz, 11, Fizz, 13, 14, FizzBuzz,\
  \ ...\n   ```\n\n   提示：这个挑战需要你使用模运算符（`%`）。我们在第 3 章中讨论过模运算符。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/NWbxpzM)。\n\
  \n2. 在上一章中，我们为一个大数字小的游戏写了一些代码，但它只给了用户一次猜大或小的机会。写一些代码，允许用户继续猜直到猜错。它还应该在游戏结束时告诉他们他们猜对了多少次。你可以查看[我在\
  \ CodePen 上的代码](https://codepen.io/SitePoint/pen/yLVeMEG)。\n\n3. 在上一章中，我们写了一个乘法表问题游戏（挑战\
  \ 3）。修改代码，使其询问五个问题并记录用户答对的个数。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/wvoJjdQ)。\n\
  \n## 总结\n\n*   函数是一个可以重用和调用的代码块。\n*   函数有助于减少重复（DRY 原则）。\n*   嵌套循环由包含在另一个内部的循环组成，在外层循环的每一步中，内循环都会完整运行。\n\
  *   函数可以接受输入（参数/参数）并提供输出（返回值）。\n\n\n\n\n\n某些语言（如 Ruby）区分了过程（procedures）和函数（functions），并使用不同的语法来创建它们。JavaScript\
  \ 并没有这样做，它仅使用函数来创建命名的代码块。\n\n如果没有显式指定返回值，JavaScript 函数将返回 `undefined` 值。\n\n# JavaScript\
  \ 中的函数\n\n函数是任何编程语言中不可或缺的部分。它们是大多数 JavaScript 程序的根本构建块，因此掌握理解函数是一项必须掌握的本质技能。\n\n\
  ## 定义函数\n\n在 JavaScript 中定义函数的最常用方法是使用如下所示的 `function declaration`（函数声明）。请尝试在控制台中输入以下内容：\n\
  \n```\nfunction hello(){\n  alert('Hello, World!');\n}\n```\n\n这创建了一个名为 `hello`\
  \ 的函数。描述函数功能的代码块位于大括号内部。这段代码将创建一个显示“Hello, World!”消息的警报框。\n\n不过，定义函数本身并没有执行任何操作。为了实际运行函数内部的代码，你必须“调用”（call）它。\n\
  \n## 调用函数\n\n调用函数将运行函数体内的代码块。要调用我们上面定义的 `hello()` 函数，只需在控制台中输入以下内容并按 `Enter` 键：\n\
  \n```\nhello();\n```\n\n这应该产生一个像所示的警报框。\n\n![Hello, World!](img/hello.png)\n\n你可以通过不断输入函数名后加括号来反复调用该函数（试试看……直到你厌倦了不断关闭那些警报框为止！）。\n\
  \n这是使用函数的优点之一：不需要不断编写重复的代码块。另一个优点是，所有功能都保留在一个地方。因此，如果你想更改部分功能，只需要更新函数声明中的那一段代码即可。例如，如果警报框真的让我们开始很心烦，我们可以将\
  \ `hello()` 函数修改为：\n\n```\nfunction hello(){\n  console.log('Hello, World!');\n\
  }\n```\n\n现在，每次调用函数时，消息都会被记录到控制台中，而不是显示在那些烦人的弹窗警报框中。想象一下这段代码在我们的程序中使用了成百千次：要修改每一个实例将是多么痛苦。通过使用函数，我们只需要更改一个地方的代码，*每一个*实例都会得到更新。这是\
  \ DRY 原则（不要重复自己）生效的完美示例。\n\n## 函数表达式\n\n定义函数的另一种方法是创建 `function expression`（函数表达式）。这会将一个“匿名函数”赋值给一个变量，如下例所示：\n\
  \n```\nconst goodbye = function(){\n  alert('Goodbye, World!');\n};\n```\n\n`anonymous\
  \ function`（匿名函数）是使用我们之前使用的函数声明创建的，但它没有被分配名称。相反，函数被赋值给一个用于引用该函数的变量。在上面的示例中，变量名为\
  \ `goodbye`。\n\n### 赋值与分号\n\n请注意，上面的示例以分号结尾。这结束了赋值语句，而普通的函数声明以代码块结束（分号不会放在代码块的末尾）。\n\
  \n调用函数表达式的方式与调用函数声明相同——通过编写它被赋值的变量名，后跟括号：\n\n```\ngoodbye();\n```\n\n![Goodbye,\
  \ World!](img/goodbye.png)\n\n### 调用 vs 引用函数\n\n请记住，你需要括号来调用函数。如果你忘记添加括号，你只是在引用该函数本身，而不是在调用它。\n\
  \n## 箭头函数\n\n箭头函数（Arrow functions）直到 2015 年才被添加到 JavaScript 中，它们与其他编写函数的方式非常不同。它们使用了更简洁的语法，使得编写起来更快，并以“箭头”符号（`=>`）标识并命名。\n\
  \n`Arrow functions`（箭头函数）总是匿名的，所以如果你想引用它们，必须将它们赋值给一个变量，就像我们对函数表达式做的那样。下面的示例了如何创建一个赋值给变量\
  \ `hola` 的箭头函数：\n\n```\nconst hola = () => alert('Hola, Mundo!');\n```\n\n箭头函数以括号和箭头开头，`()\
  \ =>`。之后的所有内容都是调用函数时将运行的代码。注意，这段代码不需要放在任何大括号内（只要它只有一行代码），这使得函数看起来要简洁得多。\n\n箭头函数的调用方式与任何其他函数完全相同：只需编写它的名字——不要忘记在末尾添加那些括号：\n\
  \n```\nhola();\n```\n\n![Hola, Mundo!](img/hola.png)\n\n# 返回值\n\n函数总是 `return`（返回或输出）一个值。这可以在函数体中使用\
  \ `return` 关键字进行指定。\n\n例如，以下函数将返回字符串 `'Howdy, World!'`：\n\n```\nfunction howdy(){\n\
  \  return 'Howdy, World!';\n}\n```\n\n返回值可以是任何类型的值——甚至是函数！（这将在后面的章节中介绍。）\n\n###\
  \ 返回 undefined\n\n如果没有显式说明返回值，它将默认返回 `undefined`。这是因为一个函数必须返回一个值才能被视为函数。你经常会在调用一个本质上只是过程且不需要返回值的函数后，在控制台中看到\
  \ `undefined` 。我们一直在使用的 `alert` 函数就是这样一个例子。\n\n![The function returns undefined](img/undefined.png)\n\
  \n当使用箭头函数时，如果函数体只有一行，你甚至不需要显式地使用 `return` 关键字。例如，上面的 `howdy` 函数可以使用箭头符号写为：\n\n```\n\
  const howdy = () => 'Howdy, World!';\n```\n\n## 参数\n\n`Parameters`（参数）和 `arguments`（实参）这两个术语经常互换，表示提供给函数的值。不过它们有一个细微的区别：参数是在函数定义时设置的，而参数是在调用函数时提供的。\n\
  \n为了看到使用参数函数的示例，让我们创建一个计算平方的函数。在以下示例中，`square` 函数接受单个参数 `n`，它是要平方的数字。在函数体内，参数名称的作用就像一个变量。我们将此值乘以自身并返回结果：\n\
  \n```\nfunction square(n){\n  return n*n;\n}\n```\n\n当我们调用此函数时，我们需要提供一个参数，它取代定义中参数的位置，它是要平方的数字：\n\
  \n```\nsquare(4.5);\n<< 20.25\n```\n\n在定义带有单个参数的箭头函数时，参数位于箭头之前，函数的主体位于之后。例如，`square`\
  \ 函数可以这样写：\n\n```\nconst square = n => n*n;\n```\n\n注意，箭头函数的参数周围不需要括号，使得它们更加简洁。\n\
  \n在定义函数时，你可以使用任意数量的参数。例如，以下函数通过将三个数字相加并将结果除以三来找到它们的平均值（mean）：\n\n```\nfunction mean(a,b,c){\n\
  \  return (a+b+c)/3;\n}\n```\n\n让我们在控制台中运行它：\n\n```\nmean(8, 3, 4);\n<< 5\n```\n\
  \n当在箭头函数中使用多个参数时，你需要将它们放在括号中，因此 `mean` 函数用箭头符号表示的形式如下：\n\n```\nmean = (a,b,c) =>\
  \ (a+b+c)/3;\n```\n\n\n\n\n\n当调用函数时没有提供参数作为参数时，函数仍会被调用，但缺失的参数将被赋予一个 `undefined`\
  \ 的值。例如，如果我们尝试只用两个参数调用 `mean` 函数，它将返回 `NaN`，这是尝试将数字与 `undefined` 相加得到的结果。尝试在控制台中输入以下示例以查看此结果：\n\
  \n```\nmean(1,2);\n<< NaN\n```\n\n![mean 函数缺少第三个参数，导致了 NaN](img/nan.png)\n\n如果调用函数时提供的参数过多，函数将正常工作，多余的参数将被忽略。下面的示例将返回\
  \ 1, 2 和 3 的平均值，并忽略参数 4 和 5：\n\n```\nmean(1,2,3,4,5);\n<< 2\n```\n\n### 默认参数\n\n\
  JavaScript 提供了一种简便的方法来为函数指定默认参数。这些值是当函数在被调用时没有提供任何参数，函数将将使用的值。要指定默认参数，你只需在函数定义中为它分配默认值即可。例如，以下函数接受一个参数，然后将其添加到字符串\
  \ `'Hello '` 的末尾。该参数被赋予了默认值 `'World'`：\n\n```\nfunction hello(name='World') {\n\
  \  alert(`Hello, ${name}!`);\n}\n```\n\n现在，如果我们不带任何参数就调用此函数，它将默认使用 `'World'` 作为\
  \ `name` 参数：\n\n```\nhello();\n<< 'Hello, World!'\n```\n\n如果你不想使用 `'World'` 作为参数，可以通过指定一个不同的值作为参数来覆盖这个默认值。例如，向宇宙打个好怎么样？\n\
  \n```\nhello('Universe');\n<< 'Hello, Universe!'\n```\n\n默认参数应该始终放在非默认参数之后。否则，你在调用函数时仍然得要输入默认值。考虑下面这个计算商店折扣价的函数：\n\
  \n```javascript\nfunction discount(price, amount=10) {\n  return price*(100-amount)/100;\n\
  }\n```\n\n此函数接受两个参数：商品的价格以及要应用的折扣百分比。商店最常见的折扣是 10%，因此它被作为一个默认值提供。这意味着在大多数情况下可以省略\
  \ `amount` 参数，并且会应用 10% 的折扣。例如，你可以使用以下代码计算一个 20 美元商品在 10% 折扣后的销售价：\n\n```\ndiscount(20);\n\
  << 18\n```\n\n注意，我们并没有指定折扣为 10%。\n\n如果需要应用不同的折扣，可以提供 `amount` 参数。在下面的示例中，一个 15 美元的商品被给予了\
  \ 20% 的折扣：\n\n```\ndiscount(15, 20);\n<< 12\n```\n\n然而，如果参数定义的顺序反了，例如下面的示例所示，这将无法工作：\n\
  \n```javascript\nfunction discount(amount=10, price) {\n  return price*(100-amount)/100;\n\
  }\n```\n\n现在，如果我们尝试只用一个参数使用函数，函数将无法工作，因为 `price` 还没有被设置：\n\n```\ndiscount(20);\n\
  << NaN\n```\n\n这会将 `amount` 设置为 20，但没有为 `price` 提供参数，因此计算无法完成并返回 `NaN`。\n\n不过，如果两个值都输入，它仍然可以工作：\n\
  \n```\ndiscount(10,20);\n<< 18\n```\n\n这在很大程度上违背了设置默认参数的意义！这里要记住的黄金法是始终将默认参数放在所有其他参数*之后*。\n\
  \n### 随机整数\n\n我们在数字章节（第 4 章）遇到过 `Math.random()` 方法，它创建一个 0 到 1 之间的随机小数。在程序中，我们经常需要随机整数值。事实上，在上一章的“猜数字”游戏中，我们使用了以下代码在\
  \ 1 到 10 之间选择一个随机数：\n\n```\nMath.ceil(Math.random()*10);\n```\n\n将这段代码抽象成一个“辅助”函数是一个很有用的练习，你可以在任何需要生成随机整数时使用它。\n\
  \n在上面的代码中，值 10 提供了数字范围的上限，因此我们可以将其作为函数的参数。这将允许我们在调用函数时选择上限。该函数可能像这样，写成函数声明：\n\n\
  ```javascript\nrandomInt(n){\n  return Math.ceil(Math.random()*n);\n}\n```\n\n这将返回一个从\
  \ 1 到作为参数提供的数字之间的随机整数。例如，我们可以使用以下代码生成一个 1 到 6 之间的随机数：\n\n```\nrandomInt(6);\n<<\
  \ 3\n```\n\n如果我们能为此函数添加一个可选的下限，也会很有用。很多时候，当我们需要随机整数时，下限是 1，因此我们将 1 设置为默认值：\n\n```javascript\n\
  randomInt(upper,lower=1){\n  return Math.floor(Math.random()*(upper-lower+1)+lower);\n\
  }\n```\n\n现在它将返回一个作为参数提供的下限和上限值之间的随机整数。\n\n### 将返回值赋值给变量\n\nJavaScript 中的一个重要概念是函数被视为一等对象（first-class\
  \ objects）。这意味着它们的行为与其他数据类型相同：可以被赋值给变量，甚至可以被其他函数使用。\n\n我们将函数调用的返回值赋值给变量。为了看到这种效果，请在控制台中尝试以下代码：\n\
  \n```javascript\nconst hello(){\n  return 'Hello, World!';\n}\n\nconst message =\
  \ hello();\n<< 'Hello, World!'\n```\n\n变量 `message` 现在指向 `hello()` 函数的返回值，即字符串 `'Hello,\
  \ World!'`，正如运行以下代码显示变量的值所示：\n\n```\nmessage;\n<< 'Hello, World!'\n```\n\n这似乎看起来工作量很大且毫无意义：为什么不直接将字符串赋值给变量？答案是，我们可以创建更复杂的函数，根据条件有不同的返回值。这种技术允许我们根据函数的输出为变量赋值不同的值。\n\
  \n例如，假设我们想检查一个人是否超过了 18 岁。我们可以写一个接受年龄作为参数的函数，如果他们超过 18 岁则返回 `true`，否则返回 `false`。它可能像这样：\n\
  \n```javascript\nuserIsChild = function(age){\n  if(age<18){\n    return true;\n\
  \  } else {\n    return false;\n  }\n}\n```\n\n然后，在程序的后续，我们可能想使用名为 `restrictedAccess`\
  \ 的变量来限制儿童访问网站某些部分，如果用户输入的年龄小于 18 岁，该变量即为真。我们可以使用以下代码来实现：\n\n```javascript\nconst\
  \ restrictedAccess = userIsChild(age);\n```\n\n\n\n\n变量 `restrictedAccess` 现在将根据\
  \ `userIsChild` 函数的返回值设置为 `true` 或 `false`。\n\n## 回调函数 (Callbacks)\n\n作为参数传递给另一个函数被称为\
  \ `callback`（回调函数）。回调函数可以在其作为参数的函数体内部调用。能够在函数内部调用不同的函数使得函数变得更加灵活。\n\n为了查看此示例，让我们来看下面这个名为\
  \ `bake` 的函数。这是我们在章节开始时用于解释函数的“烘焙”类比的一个 JavaScript 示例。它接受一个配料字符串作为参数，然后向控制台打印一些消息。尝试在控制台中输入以下内容：\n\
  \n```\nfunction bake(ingredients,callback){\n  console.log(`Mix together ${ingredients}...`);\n\
  \  console.log('Bake in the oven...');\n}\n```\n\n尝试使用像下面示例中的参数调用该函数：\n\n```\nbake('flour,\
  \ water & sugar');\n<< \"Mix together flour, water & sugar...\"\n<< \"Bake in the\
  \ oven...'\n```\n\n我们可以通过添加一个第二个参数作为回调函数来改进这个函数。这是一个在 `bake` 函数内部调用的函数，允许我们添加一些额外信息。在控制台中输入以下代码来更新\
  \ `bake` 函数：\n\n```\nfunction bake(ingredients,callback){\n  console.log(`Mix together\
  \ ${ingredients}`);\n  console.log('Bake in the oven');\n  callback();\n}\n```\n\
  \n### 覆盖函数声明\n\n你可以通过在代码后部分再次声明函数来覆盖之前的函数声明，但如果你使用 `const` 将函数表达式赋值给变量，这种方法将不起作用。\n\
  \n现在我们可以带上回调函数调用 `bake` 函数，该回调会向控制台打印另一条消息。在下面的示例中，回调是一个匿名箭头函数：\n\n```\nbake('flour,\
  \ water & sugar', () => console.log('Add icing on top...'));\n<< \"Mix together\
  \ flour, water & sugar...\"\n<< \"Bake in the oven...'\n<< \"Add icing on top...\"\
  \n```\n\n回调函数不必是一个在函数调用中定义的匿名函数。我们可以定义一个具名函数，然后将该运行的名称作为参数提供。例如，在控制台中输入以下函数：\n\n\
  ```javascript\nfunction eat(){\n  console.log('Eat every last crumb!');\n}\n```\n\
  \n再次，这只是向控制台打印另一条消息，虽然没那么有趣，但对于演示目的已经足够。让我们尝试将此函数作为参数传递给 `bake` 函数：\n\n```\nbake('flour,water\
  \ & sugar', eat);\n<< \"Mix together flour, water & sugar...\"\n<< \"Bake in the\
  \ oven...'\n<< \"Eat every last crumb!\"\n```\n\n注意，当回调作为参数提供时，后面没有跟括号。这是因为它在稍后的函数体内部被调用。\n\
  \n回调函数在许多 JavaScript 函数中被广泛，我们将在书的后面看到更多。事实上，我们将用一个实用示例来结束本章节，解决我们在书中之前遇到过的问题。\n\
  \n#### 使用回调排序数组\n\n在数组章节（第 5 章）中，我们看到数组有一个 `sort()` 方法，可以将数组中的项按字母顺序进行排序。这对于字符串来说没问题，但你可能记得它对数字的效果并不理想：\n\
  \n```\n[1,3,12,5,23,18,7].sort();\n<< [1, 12, 18, 23, 3, 5, 7]\n```\n\n这是因为数字被转换成了字符串并按字母顺序排列，所以\
  \ `'12'` 排在 `'3'` 之前，因为它开头是 `'1'`。\n\n那么，如何对数值数组进行排序呢？答案是将回调函数作为参数传递给 `sort()` 方法。这个回调函数告诉该方法如何比较数组中的任何两个值。我们称它们\
  \ `a` 和 `b`。回调函数应该返回以下内容：\n\n*   如果 `a` 在 `b` 之前，返回一个负值\n*   如果 `a` 和 `b` 相等，返回\
  \ `0`\n*   如果 `a` 在 `b` 之后，返回一个正值\n\n按数值排序值的一种简单方法是使用减法：`a-b`。如果 `b` 大于 `a`，将返回负值；如果\
  \ `a` 和 `b` 相等，返回零；如果 `a` 大于 `b`，返回正值。我们可以通过添加一个匿名箭头回调函数作为第二个参数来实现，如下：\n\n```\n\
  [1,3,12,5,23,18,7].sort((a,b) => a-b);\n<< [1, 3, 5, 7, 12, 18, 23]\n```\n\n回调函数返回的结果有助于\
  \ `sort()` 方法理解一个项比另一个大还是小，这样它就可以按数值对项进行排序。\n\n排序完成！\n\n#### 深入了解 `sort()`\n\n在编程中，你经常会遇到需要复杂解决方案的棘手情况。幸运的是，在你之前已经有人走过这条路，并且几乎任何问题都有现成的解决方案。上面用于排序数字的解决方案只是一个小例子：它是其他需要执行相同操作的人研究出的代码片段。你实际上并不需要理解它是如何工作的。尽管如此，深入研究其工作原理也无坏处。如果你想对\
  \ `sort()` 的工作有更深入的解释，请查看这两篇文章：\n\n*   [高级排序技巧](https://www.sitepoint.com/sophisticated-sorting-in/)\n\
  *   [如何对数组排序](https://www.sitepoint.com/sort-an-array-objects/)\n\n## 选择函数类型\n\n\
  在本章中，我们涵盖了创建函数的几种方法。它们之间存在细微的差异，将在以后介绍。函数声明与其他语言中的声明方式非常相似，而函数表达式的行为就像赋值给变量的值，而不是语言的特性。\n\
  \n箭头函数看起来与函数声明和表达式完全不同，在某些情况下也会产生不同的结果，这意味着它们并不总是可以完全替代。它们写起来更快，因为函数体周围不需要大括号，且不需要\
  \ `return` 关键字。由于这些优势，箭头函数特别流行，我们将在书中后面看到很多例子。然而，一旦函数体超过一行，箭头函数的优势往往会消失。\n\n你选择哪种方法通常取决于个人喜好，而不是哪种最合适。当你读完这本书时，你将能够在任何情况下选择合适的函数类型。\n\
  \n## 挑战\n\n现在你已经学习了如何定义和调用函数，是时候尝试创建一些函数了。这里是一些帮助你提高能力的挑战。\n\n1.  编写一个名为 `lastChar`\
  \ 的函数，接受一个字符串作为参数并返回字符串的最后一个字母。例如，`lastChar('JavaScript')` 应该返回 `'t'`。你可以查看 [我的\
  \ CodePen 代码](https://codepen.io/SitePoint/OJbNJay)。\n\n2.  编写一个名为 `reverse` 的函数，接受一个字符串并返回反转后的字符串。例如，`reverse('JavaScript')`\
  \ 应该返回 `'tpircSavaJ'`。应用两次函数应该返回原始值，所以 `reverse(reverse('JavaScript'))` 应该返回 `'JavaScript'`。你可以查看\
  \ [我的 CodePen 代码](https://codepen.io/SitePoint/poNyoQw)。\n\n3.  编写一些可以在列表中添加和删除项目的函数。列表应该存储为数组，`add('apples')`\
  \ 应该将字符串 `'apples'` 添加到数组，`remove('apples')` 应该从数组中删除 `'apples'`。你可以查看 [我的 CodePen\
  \ 代码](https://codepen.io/SitePoint/JjbXjem)。\n\n\n\n\n## Functions\n\n* 函数可以使用 `function`\
  \ 声明来定义，也可以通过将匿名函数赋值给变量来创建 `function expression`（函数表达式）。\n* 箭头函数是一种简写表示法，可用于编写简短的、单行的匿名函数。\n\
  * 所有函数都会返回一个值。如果没有显式说明，函数将返回 `undefined`。\n* 参数（parameter）是写在函数声明括号中的值，可以在函数体内部像变量一样使用。\n\
  * 变量（argument）是在调用函数时提供给函数的值。\n* 函数的返回值可以赋值给变量。\n* 回调函数（callback）是作为参数传递另一个函数的函数，并且可以在该函数内部被调用。\n\
  \n函数是任何编程语言中都非常重要的部分。但“对象”（objects）也是如此——我们将在下一章学习它们！\n\n# 第 9 章：对象\n\n`Objects`（对象）是编程中使用的抽象数据类型。它们可以用于表示现实世界的物体，如人、动物或地点，也可以表示更抽象的概念，如银行账户详情、日期或文件结构。\n\
  \n在某些语言中（如 Ruby），几乎一切都是对象。没有原始值，只有对象。甚至数字零也是一个对象。许多语言（如 `Java`）是 `class-based`（基于类的）语言。这涉及到创建类，作为创建该类中所有对象的蓝图。例如，`Car`\
  \ 类可能会指定所有的 `Car` 对象都将有一个引擎、四个轮子和可选的颜色。\n\nJavaScript `not`（不是）基于类的语言（尽管如果你想，也可以定义类，正如我们将在书中后面部分看到的）。它允许你快速方便地创建对象，而无需先定义类。\n\
  \n在本章中，我们将涵盖以下主题：\n\n* 属性（properties）和方法（methods）\n* 创建对象字面量\n* 对象属性\n* 对象方法\n*\
  \ 嵌套对象\n* `this`\n\n## 属性和方法\n\n对象可以拥有 `properties`（属性）和 `methods`（方法）。`Properties`\
  \ 是关于对象的信息，而 `methods` 是对象可以执行的操作。\n\n例如，我们可以使用以下对象模型来表示章鱼。\n\n**章鱼 (Octopus)**\n\
  \n![一只章鱼](img/octopus.png)\n\n属性\n名字: “Octavius”\n腿数: 8\n\n方法\n游泳 (Swim)\n行走 (Walk)\n\
  重新长腿 (Regrow leg) *(是的，它们真的可以做到！)*\n\n对象通常用于将任何相关信息和功能保持在一个地方。例如，如果你正在编写涉及正方形的代码，你可能会创建一个具有以下属性和方法的“square”对象。\n\
  \n**正方形 (Square)**\n\n![](img/square.png)\n\n属性\n长度: 5\n\n方法\n周长 (Perimeter) = 4\
  \ * Length\n面积 (Area) = Length * Length\n\n## 在 JavaScript 中创建对象\n\n对象字面量（Object\
  \ literals）是 JavaScript 语言的一个显著特征，因为允许快速创建对象而无需定义类（这在许多其他语言中很常见）。一个 `object literal`（对象字面量）是一个自包含的相关值集合。属性可以是任何数据类型，例如数字、字符串、布尔值、数组甚至其他对象。如果一个属性是函数，那么它被称为\
  \ `method`（方法）。\n\n要在 JavaScript 中创建对象字面量，只需输入一对大括号。接下来的示例创建了一个赋值给变量 `myObject`\
  \ 的空对象：\n\n```\nconst myObject = {};\n```\n\n你不需要从空对象开始。你可以将属性和方法放在大括号内部。以下代码可以用于表示关于正方形的信息：\n\
  \n```\nconst square = { \n    sides: 4,\n    length: 5,\n    perimeter: 20,\n  \
  \  area: 25\n}\n```\n\n每个属性都有一个 `key`（键）和一个关联的 `value`（值）。在上面的示例中，第一个属性的键是 `sides`，其值为\
  \ 4。每个键值对之间用逗号分隔。\n\n### 尾随逗号 (Trailing Commas)\n\n注意上面最后一个键值对没有以逗号结尾。如今，这个“末尾逗号”是可选的，但在\
  \ ECMAScript 5 之前，末尾逗号会抛出错误。只要你的代码不需要在旧浏览器中运行（这是一个重要的考虑因素），如果你以后可能向你的对象中添加更多的键值对，那么包含末尾逗号可能是很有用的，这意味着你不需要记得以后要添加逗号。作为一个一般原则，我不会在书中使用末尾逗号。\n\
  \n### 方法 (Methods)\n\n方法看起来与其他属性相似，但它们被定义为函数。接下来的代码显示了我们如何创建一个对象字面量来表示具有 `quack()`\
  \ 方法的鸭子：\n\n![一只鸭子](img/duck.png)\n\n```\nconst duck = {\n  name: 'Quacky',\n  legs:\
  \ 2,\n\n  quack: function() {\n    alert('QUACK! QUACK!');\n  }\n};\n```\n\n还有另一种描述方法的表示法，它省略了\
  \ `function` 关键字，只需在方法名后放置括号：\n\n```\nconst duck = {\n  name: 'Quacky',\n  legs:\
  \ 2,\n\n  quack() {\n    alert('QUACK! QUACK!');\n  }\n};\n```\n\n这种编写方法的方式最近才引入\
  \ JavaScript，但由于其输入量更少而变得流行。\n\n### 再次猜猜 (Guess Again)\n\n记得我们小游戏中的那四个角色吗\n\n![猜猜？](img/guesswho.png)\n\
  \n我们可以创建对象来代表它们。每个对象将包含属性和布尔值，指示它们是否佩戴了眼镜和帽子。例如，以下对象将表示 Alfie：\n\n```\nconst alfie\
  \ = {\n  name: 'Alfie',\n  picture: '\U0001F935',\n  glasses: false,\n  hat: false\n\
  }\n```\n\n### 从变量创建对象\n\n我们也可以使用已有的变量创建对象，如下例所示：\n\n```\nconst name = 'Dumbo';\n\
  const legs = 4;\nconst fly = () => console.log('Fly, away!');\n\nconst elephant\
  \ = { name, fly };\n```\n\n![一只象](img/elephant.png)\n\n注意，如果变量已经声明并赋值，你只需要将变量名放在对象内部，它就会分配这些属性。这使得创建一个与变量相同的属性和方法对象变得更容易。长写版本在创建\
  \ `elephant` 对象时会涉及重复：\n\n```\nconst elephant = {\n  name: name,\n  legs: legs,\n\
  \  fly: fly\n}\n```\n\n## 访问属性和方法\n\n你可以使用之前章节中见过的点符号来访问对象的属性。下面的示例显示了我们如何访问 `elephant`\
  \ 对象的 `name` 属性：\n\n```\nelephant.name;\n<< \"Dumbo\"\n```\n\n你也可以使用括号符号访问对象的属性。属性由方括号内的字符串表示，因此它需要包含在单引号或双引号中：\n\
  \n```javascript\nelephant['name'];\n<< \"Dumbo\"\n```\n\n访问属性的点符号是最常用的，但当属性名称存储为字符串时，括号符号可以派上用场。例如，如果你有一个名为\
  \ `info` 的变量，其值为字符串 `'name'`，那么下面的代码等同于编写 `elephant.name`：\n\n```javascript\nconst\
  \ info = 'name';\nelephant[info]\n<< \"Dumbo\"\n```\n\n如果你使用 `elephant.info`，将不起作用，因为\
  \ JavaScript 会尝试寻找名为 `info` 的属性。\n\n但在大多数其他情况下，你应该坚持使用点符号。\n\n如果你尝试访问一个不存在的属性，将返回\
  \ `undefined`：\n\n```javascript\nelephant.arms;\n<< undefined\n```\n\n\n\n\n\n`in`\
  \ 操作符可以用于检查一个对象是否具有特定的属性。例如，我们可以使用以下代码检查 `elephant` 对象是否具有名为 `arms` 或 `legs` 的属性：\n\
  \n```\n'arms' in elephant;\n<< false\n\n'legs' in elephant;\n<< true\n```\n\n###\
  \ 调用方法\n\n方法与函数一样，因此我们以相同的方式来调用它们。我们可以使用点符号或方括号表示法来引用对象的方法，就像引用属性一样，但在末尾需要加上括号，因此我们使用以下代码来调用\
  \ `fly` 方法：\n\n```\nelephant.fly()\n<< \"Fly, fly away!\"\n```\n\n![“Fly, fly away!”](img/fly.png)\n\
  \n你也可以使用方括号符号来调用方法：\n\n```\nelephant['fly']();\n<< \"Fly, fly away!\"\n```\n\n###\
  \ 添加更多属性和方法\n\n对象默认是**可变的** (`mutable`) 的，这意味着它们的属性和方法可以被更改或删除，并且可以添加新的属性和方法，即使它们是使用\
  \ `const` 的。\n\n#### 冻结的对象\n\n可以对对象进行**冻结** (`freeze`) 并使其变为不可变。我们在这里不会深入探讨这一点，但你可以在\
  \ [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze)\
  \ 网站上阅读更多信息。\n\n在程序的任何时候，都可以向对象添加新的属性和方法。这是通过简单地为新属性赋值来实现的。例如，如果我们想为我们的 `elephant`\
  \ 对象添加一个新的 `ears` 属性，我们可以这样做：\n\n```\nelephant.ears = 2;\n<< 2\n```\n\n现在我们来看一下\
  \ `elephant` 对象，可以看到它已经了 `ears` 属性：\n\n```\nelephant;\n<< { name: 'Dumbo',\n   \
  \ legs: 4,\n    ears: 2,\n    fly: [Function: fly]  }\n```\n\n### 修改属性\n\n你可以使用赋值操作在任何时候更改对象属性的值。例如，我们可以这样更改\
  \ `name` 属性的值：\n\n```\nelephant.name = 'Elmer';\n<< 'Elmer'\n```\n\n我们可以通过查看对象来检查更新是否已经发生：\n\
  \n```\nelephant;\n<< { name: 'Elmer',\n    legs: 4,\n    ears: 2,\n    fly: [Function:\
  \ fly]  }\n```\n\n### 删除属性\n\n可以使用 `delete` 操作符从对象中删除任何属性。例如，如果我们想从 `elephant` 对象中删除\
  \ `fly` 方法（因为当然，Elmer 不会飞！），我们将输入以下内容：\n\n```\ndelete elephant.fly;\n<< true\n```\n\
  \n现在我们来看一下 `elephant` 对象，可以看到 Elmer 再也不会飞了：\n\n```\nelephant;\n<< { name: 'Elmer',\n\
  \    legs: 4,\n    ears: 2  }\n```\n\n### 嵌套对象\n\n对象甚至可以包含其他对象。这些被称为**嵌套对象** (`nested\
  \ objects`)。\n\n这是一个包含一组嵌套对象的对象示例。每个嵌套对象代表一个不同的形状。容器对象被赋值给变量 `shapes`：\n\n```\n\
  const shapes = {\n  triangle: { sides: 3 },\n  square: { sides: 4 },\n  pentagon:\
  \ { sides: 5 },\n  hexagon: { sides: 6 },\n  octagon: { sides: 8 },\n  megagon:\
  \ { sides: 10e6 },\n}\n```\n\n![Shapes](img/shapes.png)\n\n嵌套对象中的值可以通过顺序使用点符号或方括号表示法引用每个属性名来访问：\n\
  \n```\nshapes.triangle.sides;\n<< 3\n\nshapes['megagon']['sides'];\n<< 1000000\n\
  ```\n\n你甚至可以混合不同的表示法（但如果可能的话，请不要这样做！）：\n\n```\nshapes.hexagon['sides'];\n<< 6\n\
  ```\n\n### `this`\n\n关键字 `this` 可以在对象内部使用，用于引用对象本身。它通常用于方法中，以获取对象属性的访问。\n\n为了查看我们可能使用\
  \ `this` 的示例，请考虑我们之前看到的正方形对象：\n\n```\nconst square = { \n    sides: 4,\n    length:\
  \ 5,\n    perimeter: 20,\n    area: 25\n}\n```\n\n这个对象的问题是，正方形的所有信息都是硬编码为属性的。这是没有必要的，因为我们可以使用方法根据\
  \ `sides` 和 `length` 属性的值来计算周长和面积。我们可以使用 `this` 来访问这些属性。尝试在控制台中输入以下代码：\n\n```\n\
  const square = { \n    sides: 4,\n    length: 5,\n    perimeter() { return this.sides\
  \ * this.length },\n    area() { return this.length * this.length }\n}\n```\n\n\
  `perimeter` 和 `area` 属性现在已变为返回所需值的方法。在这些方法的内部，包含了对对象其他属性的引用：`this.sides` 等于编写 `square.sides`，它的数字是\
  \ 4。\n\n如果我们调用这些方法，它们应该带我们得到相同的结果：\n\n```\nsquare.perimeter()\n<< 20\n\nsquare.area()\n\
  << 25\n```\n\n使用这种方法让对象更加灵活。如果我们更改 `length` 属性：\n\n```\nsquare.length = 8;\n<< 8\n\
  \nsquare.perimeter()\n<< 32\n\nsquare.area()\n<< 64\n```\n\n### 骰子\n\n让我们用一个代码项目结束本章。我们将具有\
  \ `sides` 属性以及返回 1 到 `sides` 之间数字的 `roll()` 方法的骰子对象。这里是创建骰子的代码：\n\n```javascript\n\
  const dice = {\n  sides: 6,\n  roll() {\n    return Math.ceil(Math.random() * this.sides);\n\
  \  }\n}\n```\n\n这个对象有一个 `sides` 属性，告诉我们骰子有六面。在 `roll()` 方法内部，我们使用 `this.sides` 来引用属性的值而不是简单的硬编码\
  \ 6。让我们尝试一下：\n\n```\ndice.roll()\n<< 5\n\ndice.roll()\n<< 3\n```\n\n现在尝试通过修改 `sides`\
  \ 属性来更改面数：\n\n```\ndice.sides = 20;\n<< 20\n```\n\n现在 `roll()` 方法将返回 1 到 20 之间的随机数，而无需修改它：\n\
  \n```\ndice.roll()\n<< 12\n\ndice.roll()\n<< 18\n```\n\n## 挑战\n\n1. 创建描述你喜爱的物品的对象。例如，你可以创建模拟你喜欢的明星的对象，并提供如速度、力量和敏捷度等属性。你可以创建代表电子商务网站上销售的产品的对象，包括描述、价格和评分等属性。在控制台中玩一玩，并练习读取和更新属性以及调用方法。[Top\
  \ Trump](https://en.wikipedia.org/wiki/Top_Trumps) 卡片可能是此挑战的灵感来源。\n2. 编写代表猜猜脸游戏中\
  \ Betty、Gemma 和 Del 的对象。你可以在 CodePen 上查看代码](https://codepen.io/SitePoint/pen/GRNqQPQ)。\n\
  3. 创建圆形对象，它有一个 `radius` 属性并计算周长和面积。提示：此挑战可能需要使用 `Math.PI` 常量。你可以在 CodePen 上查看代码](https://codepen.io/SitePoint/pen/KKNMQbY)。\n\
  4. 创建列表对象，它有一个名为 `items` 的数组属性以及用于向列表添加项目的 `add` 和 `remove()` 方法。例如，`list.add('Apples')`\
  \ 应该将 `Apples` 添加到 `list.items` 数组中。提示：你可以使用上一章挑战 3 中创建的函数作为方法。\n\n## 总结\n\n* 对象包含关于对象的信息的属性，以及对象可以执行的操作的方法。\n\
  \n\n\n\n*   JavaScript 中的对象字面量是一组放在花括号 (`{}`) 内部并用逗号分隔的键值对集合。\n*   属性可以是字符串、数字、布尔值或数组。\n\
  *   方法以函数的形式存储。\n*   可以使用点符号法或方括号法来访问对象的属性和方法。\n*   对象是可变的，这意味着它们的属性和方法可以被更改或删除（即使它们是使用\
  \ `const` 创建的）。\n*   通过将对象放在对象内部可以创建嵌套对象。\n*   在属性和方法可以使用 `this` 关键字来指代对象本身。\n\n\
  现在我们已经学习了编程的所有基础知识，是时候看看我们的代码如何与浏览器环境交互了。\n\n# 第 10 章：文档对象模型 (DOM)\n\n到目前为止，我们主要是在控制台中或通过弹出框与代码交互。自从计算机显示器出现以来，计算机程序能够提供某种图形用户界面\
  \ (GUI)，允许用户与程序进行交互。例如，Windows 或 iOS 这样的操作系统提供了 GUI，允许你与计算机或设备进行交互。\n\n![Windows\
  \ 是一个包含 GUI 的计算机操作系统](img/windows.jpg)\n\n大多数编程语言都会有一个允许你创建 GUI 的库。在浏览器中，我们可以使用\
  \ HTML 和 CSS 创建一个供用户交互的 GUI。\n\n文档对象模型，简称为 DOM，允许我们从代码内部访问 Web 页面的元素。它提供了添加和删除元素以及更新页面内容和样式的工具。\n\
  \nDOM 是`语言无关的`，这意味着它可以在任何编程语言中使用，尽管 JavaScript 是它关联最紧密的的语言。在本章中，我们将重点关注如何使用 JavaScript\
  \ 访问 DOM。\n\n我们将涵盖以下主题：\n*   DOM 简介\n*   获取元素\n*   遍历 DOM\n*   获取和设置元素的属性\n*   通过创建动态标记更新\
  \ DOM\n*   更改元素的 CSS\n\n## 文档对象模型\n\n`Document Object Model` 将 HTML 文档表示为由连接的节点\
  \ (`nodes`) 组成的网络，这些节点形成了一个树形结构。\n\nDOM 将 Web 上的所有内容都视为节点。它将 HTML 标签表示为`元素节点`，将标签内的任何文本表示为`文本节点`。所有这些节点都连接在一起形成一个节点树，描述了\
  \ Web 页面的整体结构。\n\n为了演示这一点，让我们来看这段简短的 HTML 代码：\n\n```\n<h1 id='greeting'>Hello, <em>World!</em></h1>\n\
  ```\n\n这可以表示为所示的节点树图。\n\n![Hello, World! DOM](img/helloworldDOM.png)\n\n`h1` 标签包含了所有内容，因此它显示为节点树顶部的元素节点（在图中用紫色椭圆表示）。单词“Hello”是文本，所以它是子文本节点（在图中用绿色矩形表示）。`em`\
  \ 元素位于 `h1` 标签内部，因此它是子元素节点。这使得 `h1` 元素节点成为这些子节点的父节点。`em` 标签内部的文本是 `em` 元素节点的文本子节点。\n\
  \n在浏览器中，它看起来是这样：\n\n![在浏览器中显示的 Hello, World! 标题](img/helloworld.png)\n\n能够将 HTML\
  \ 标记可视化为节点树将使遍历 DOM 的体验变得简单得多。\n\n### HTML 文档与 DOM\n\n当你访问一个 Web 页面时，浏览器首先下载包含所有\
  \ HTML、文本、图片等的页面文档。然后浏览器会创建该文档的表示（或者如果你喜欢的话，可以称为心理模型），这就是文档对象模型。然后浏览器使用该 DOM 在你的设备上显示\
  \ Web 页面。JavaScript 允许对 页面进行更改，但这些更改是针对 DOM 的，而不是原始的硬编码 HTML。你将在本章后续部分看到这一点。\n\n\
  ### 检查 DOM\n\n浏览器实际上允许你查看 Web 页面的文档对象模型，你甚至可以以各种方式对其进行操作（这有点就像查看汽车引擎盖）。如果你在 Web\
  \ 页面的任何地方点击右键，你会看到“检查”页面的选项。这将显示 DOM 以及各种其他开发者工具。DOM 看起来与原始 HTML 相似，但并不完全相同——特别是如果\
  \ JavaScript 对其进行了修改。\n\n## 获取元素\n\nDOM 提供了一个名为 `getElementById` 的有用方法，它返回一个具有特定\
  \ ID 属性的元素的引用。\n\n例如，我们可以使用其 `id` `greeting` 获取上一个示例中 `h1` 标题元素的引用。\n\n让我们在 CodePen\
  \ 上尝试一下。打开一个新的 Pen 并向 **HTML** 部分添加以下代码：\n\n```\n<h1 id='greeting'>Hello, <em>World!</em></h1>\n\
  ```\n\n现在我们可以通过向 **JS** 部分添加以下代码来获取 `h1` 元素的引用：\n\n```javascript\nconst hello =\
  \ document.getElementById('greeting');\n```\n\n如果不存在提供 ID 的元素，则返回 `null`。我们可以通过在控制台中输入赋值给元素的变量名（`hello`）来查看返回了什么：\n\
  \n```javascript\nhello;\n```\n```\n\"<h1 id='greeting'>Hello, <em>World!</em></h1>\"\
  \n```\n\n## 更新 HTML\n\n更新页面上 HTML 最简单的方法是使用 `innerHTML` 属性。这将返回元素内部的所有 HTML。我们可以通过在控制台中输入以下代码查看结果：\n\
  \n```javascript\nhello.innerHTML;\n```\n```\n\"<h1 id='greeting'>Hello, <em>World!</em></h1>\"\
  \n```\n\n`innerHTML` 属性的伟大之处在于它也是可写的，这为我们向元素插入 HTML 了一种方便的方法。为了演示这一点，让我们添加一些 JavaScript\
  \ 代码来提供个性化的问候。首先，确保我们拥有对标题的引用：\n\n```javascript\nconst hello = document.getElementById('greeting');\n\
  ```\n\n接下来，我们将使用提示框询问用户姓名，并将其存储在变量 `name` 中：\n\n```javascript\nconst name = prompt('你的名字是什么？');\n\
  ```\n\n最后，我们将 `innerHTML` 属性替换为我们的问候，使用了我们刚刚收集的 `name` 变量：\n\n```javascript\nhello.innerHTML\
  \ = `Hello, <em>${name}</em>`;\n```\n\n注意我们使用了模板字符串来生成 HTML。在创建动态插入 Web 页面的 HTML\
  \ 段时非常有用，因为它们允许其中插入变量。\n\n如果一切顺利，你应该看到类似这样的（但希望是你的名字！）：\n\n![这是个性化的](img/personalhello.png)\n\
  \n## 获取多个元素\n\n让我们看看如何一次选择多个元素。在 CodePen 上创建一个 Pen 并向 **HTML** 部分添加以下代码：\n\n```html\n\
  <ul id='food'>\n  <li class='fruit'><<span>\U0001F34F</span>苹果</li>\n  <li class='fruit'><<span>\U0001F34C\
  </span>香蕉</li>\n  <li class='veg'><<span>\U0001F955</span>胡萝卜</li>\n</ul>\n```\n\
  \n这应该创建一个看起来像所示的项目列表：\n\n![我们的新食物列表](img/foodlist.png)\n\n该 HTML 代码段的 DOM 树如下图所示：\n\
  \n![我们的食物列表 DOM 树](img/foodDOM.png)\n\n正如我们已经看到的，我们可以使用以下代码访问 `ul` 元素：\n\n```javascript\n\
  const food = document.getElementById('food');\n```\n\n但我们如何访问一组元素，例如列表项呢？幸运的是，DOM\
  \ 还提供了一些允许我们访问一组元素的方法。\n\n\n\n\n\n### 通过标签名获取元素\n\n我们可以使用 `getElementsByTagName()`\
  \ 返回一个包含所有通过参数提供的标签名对应的元素集合。例如，我们可以使用以下代码获取文档中所有的列表项（HTML 标签为 `<li>`）：\n\n```javascript\n\
  const items = document.getElementsByTagName('li');\n```\n\n变量 `items` 现在包含一个所有列表项元素的元素集合。您可以使用我们之前在字符串和数组中看到过的方括号索引表示法来访问集合中的每个项目。例如，在控制台中输入以下代码将返回集合中的第一个项目：\n\
  \n```\nitems[0];\n<< \"<li class='fruit'><span>\U0001F34F</span>Apple</li>\"\n```\n\
  \n我们还可以使用 `length` 属性来查看集合中有多少个元素：\n\n```\nitems.length;\n<< 3\n```\n\n### 通过类名获取元素\n\
  \n我们也可以使用 `getElementsByClassName()` 方法返回一个包含所有具有特定类名的元素集合。例如，以下代码将返回所有类名为 `fruit`\
  \ 的元素的元素集合：\n\n```javascript\nconst fruit = document.getElementsByClassName('fruit');\n\
  ```\n\n变量 `fruit` 包含两个具有 `fruit` 类的元素集合，正如我们在控制台中输入以下内容所看到的：\n\n```\nfruit.length;\n\
  << 2\n\nfruit[0];\n<< \"<li class ='fruit'><span>\U0001F34F</span>Apples</li>\"\n\
  \nfruit[1];\n<< \"<li class='fruit'><span>\U0001F34C</span>Banana</li>\"\n```\n\n\
  注意，如果没有具有给定类名的元素，仍然会返回一个集合，但它将不包含任何项目且长度为 0。\n\n#### 获取单个元素 vs 获取多个元素\n\n您是否注意到您只能通过\
  \ ID 获取一个元素（`document.getElementById`），但通过类名可以获取多个元素（`document.getElementsByClassName`）？记住这一点的一种简单方法是：每个\
  \ HTML 文档中只允许使用一次特定的 ID，而您可以在同一文档中多次使用特定的类名。\n\n### 查询选择器 (Query Selectors)\n\n\
  在 DOM 中获取元素的另一种方法是使用查询选择器。这些方法的好处是它们允许您使用 CSS 语法来定位特定元素。\n\n`document.querySelector()`\
  \ 方法允许您使用 CSS 语法来查找文档中匹配所提供的 CSS 选择器的第一个元素。\n\n例如，与其使用 `document.getElementById`\
  \ 来获取 ID 为 `food` 的元素的引用，我们可以使用以下代码：\n\n```javascript\nconst food = document.querySelector('#food');\n\
  ```\n\n`document.querySelectorAll()` 方法也使用 CSS 语法，但它返回的是文档中所有匹配 CSS 查询选择器的元素列表。\n\
  \n例如，以下两个语句是等价，并返回相同的节点列表：\n\n```javascript\ndocument.getElementsByClassName('fruit');\n\
  document.querySelectorAll('.fruit');\n```\n\n查询选择器是强大的方法，它们可以模拟之前的所有方法，并允许对返回的元素节点进行更细粒度的控制，因为它们允许您指定页面上的精确项目。例如，CSS\
  \ 伪选择器可以用于精确指向特定元素。\n\n例如，以下代码将仅返回 `food` 列表中的最后一个列表项：\n\n```javascript\nconst carrot\
  \ = document.querySelector('ul#food li:last-child');\n<< \"<li class='veg'><span>\U0001F955\
  </span>Carrot</li>\"\n```\n\n#### CSS 选择器\n\n您必须了解一点 CSS 选择器才能使用这种方法！如果您还没有完全掌握，或者只是需要复习一下，您可能想查看\
  \ SitePoint 的“[CSS 选择器](http://www.sitepoint.com/web-foundations/css-selectors/)”指南，或者阅读\
  \ Tiffany Brown 编写的 [CSS Master](https://www.sitepoint.com/premium/books/css-master-2nd-edition)。\n\
  \n## 遍历 DOM 树\n\nDOM 节点有许多属性和方法用于在文档树中导航。一旦您有了元素的引用，就可以沿着文档树寻找其他节点。\n\n让我们来看看几个更有用的方法。\n\
  \n### 子节点 (Child Nodes)\n\n您可以使用 `children` 属性获取一个元素的所有子元素的集合。在我们的食物列表示例中，`food.children`\
  \ 将返回 ID 为 `food` 的 `<ul>` 元素的所有子元素的节点列表。这些元素在下面的图中被高亮显示。\n\n![高亮显示无序列表三个子列表项](img/children.png)\n\
  \n以下代码显示了我们如何访问一个包含三个子 `<li>` 元素的节点列表：\n\n```javascript\nfood.children.length;\n\
  << 3\n\nfood.children[0];\n<< \"<li class='fruit'><span>\U0001F34F</span>Apple</li>\"\
  \n```\n\n在继续之前，让我们在程序中为这些子节点创建引用。在您的 Pen 的 JS 部分添加以下代码：\n\n```javascript\nconst\
  \ apple = food.children[0];\nconst banana = food.children[1];\nconst carrot = food.children[2];\n\
  ```\n\n（如果您跟着一起操作，这里是您的 Pen [现在应该的样子](https://codepen.io/SitePoint/pen/QWGGbWg)。）\n\
  \n### 父节点 (Parent Node)\n\n`parentNode` 属性返回元素的父节点。\n\n以下代码返回 `food` 节点，因为它是该元素的父元素：\n\
  \n```javascript\napple.parentNode;\n<< \"<ul id='food'>\n<li class='fruit'><span>\U0001F34F\
  </span>Apple</li>\n<li class='fruit'><span>\U0001F34C</span>Banana</li>\n<li class='veg'><span>\U0001F955\
  </span>Carrot</li>\n</ul>\"\n```\n\n这种关系可以在图中看到：\n\n![父节点是无序列表](img/parentNode.png)\n\
  \n## 创建动态标记\n\n到目前为止，我们查看了如何访问不同的不同的元素。但 DOM 的真正威力在于它可以动态更新标记，就像我们之前使用 `innerHTML`\
  \ 那样。在本节中，我们将学习如何创建新元素并将它们添加到页面上，更新已有的元素并删除不需要的元素。\n\n### 创建元素\n\n`document` 对象有一个\
  \ `createElement()` 方法，它接受标签名作为参数并返回该元素。例如，我们可以在控制台中通过以下代码为我们的食物列表创建一个 DOM 节点：\n\
  \n```javascript\nconst melon = document.createElement('li');\n```\n\n目前该元素是空的。为了添加内容，我们将使用\
  \ `innerHTML` 属性：\n\n```javascript\nmelon.innerHTML = `<span>\U0001F349</span>Melon`;\n\
  ```\n\n将上面的两行添加到 Pen 中...\n\n#### 使用 textContent 添加文本\n\n还有一个 `textContent` 属性可以向元素添加文本，但它不能包含任何\
  \ HTML 元素。例如，这样做是可以的：\n\n```javascript\nmelon.textContent = '\U0001F349Melon';\n\
  ```\n\n但如果您尝试在周围添加 `<span>` 标签，它将不会解析 HTML：\n\n```javascript\n// 这段代码不会解析 <span>\
  \ 标签\nmelon.textContent = '<span>\U0001F349</span>Melon';\n```\n\n正如正如从下面的图片看到的，标签将以文本的形式显示在网页上，这通常不是我们想要的。\n\
  \n![HTML 不会被 textContent 解析](img/melon.png)\n\n### 将元素添加到页面\n\n如果您更新了 Pen，会发现还没有任何变化。现在我们已经学习了如何创建\
  \ HTML 元素，需要学习如何将它们放在页面上。有许多方法允许您向 DOM 插入节点。\n\n让我们先看看 `appendChild()`。每个 DOM 节点都有一个\
  \ `appendChild()` 方法，可以将另一个节点（作为参数）作为子节点添加。以下示例将我们创建的 `melon` 元素添加到 `food` 列表的末尾：\n\
  \n```javascript\nfood.appendChild(melon);\n```\n\n下面的图显示了我们创建的新元素将插入到列表的什么。\n\n\
  ![箭头显示了新节点将追加在哪里](img/appendChild.png)\n\n下一张图片显示 melon 现在已经是列表的一部分。\n\n![我们更新后的列表](img/appendChild2.png)\n\
  \n\n\n\n\n（这里是上方内容的[在线 Pen](https://codepen.io/SitePoint/pen/rNWWVxr)。）\n\n### 逐节点构建元素\n\
  \n使用 `innerHTML` 来填充元素内容的另一种替代方案，是逐个构建每个节点，然后使用 `appendChild()` 方法将它们全部组合在一起。\n\n\
  为了演示这一点，让我们创建一个与下方所示节点树匹配的新类型列表元素。\n\n![我们的西兰花节点树](img/broccoliDOM.png)\n\n我们需要为图中的每个节点创建一个节点，然后将它们全部组合在一起。我们已经见过用于创建元素节点（图中的紫色椭圆）的\
  \ `document.createElement()` 方法。此外，还有一个 `document.createTextNode()` 方法，我们可以用用它来创建文本节点（图中的绿色矩形）。\n\
  \n现在来创建这些节点。在你的 Pen 的 `JS` 部分添加以下内容：\n\n```\nconst broccoli = document.createElement('li');\n\
  const text = document.createTextNode('Broccoli');\nconst span = document.createElement('span');\n\
  const emoji = document.createTextNode('\U0001F966');\n```\n\n这将创建所有节点并为它们分配变量。现在我们可以将它们组合起来形成列表项：\n\
  \n```\nspan.appendChild(emoji);\nbroccoli.appendChild(span)\nbroccoli.appendChild(text);\n\
  ```\n\n接下来，我们需要将这个新的列表项插入 HTML 中。\n\n### 插入之前\n\n`appendChild()` 方法非常有用，因为你通常想要在列表底部添加新元素。但如果你想在两个现有元素之间放置一个新元素呢？\n\
  \n`insertBefore()` 方法会将新元素放置在另一个元素之前。需要注意的是，该方法是在`父节点`上被调用的。它接受两个参数：第一个是待添加的新节点，第二个是你想要让它排在之前的节点。（记住参数的顺序就是它们在标记中出现的顺序是有帮助的。）例如，我们可以通过下面这行代码将新的\
  \ `broccoli` 元素放在 `apple` 元素之前：\n\n```\nfood.insertBefore(broccoli,apple);\n```\n\
  \n![在苹果列表项之前插入西兰花列表项](img/insertBefore.png)\n\n如你所见，这将西兰花元素放在列表顶部，位于苹果之前。\n\n![西兰花现在位于列表顶部](img/insertBefore2.png)\n\
  \n这是我们[更新后的 Pen](https://codepen.io/SitePoint/pen/ZEBBGBj)。\n\n有点恼人的是，并没有 `insertAfter()`\
  \ 方法，所以你需要确保你有访问正确元素的权限，以便元素精确地放置在你想要的位置。\n\n### 从页面中移除元素\n\n可以使用 `remove()` 方法从页面中移除元素。该方法在要移除的节点上被调用。它返回被移除移除的引用。例如，如果我们想移除\
  \ `carrot` 元素，将使用以下代码：\n\n```\ncarrot.remove();\n<< \"<li class='veg'><span>\U0001F955\
  </span>Carrot</li>\"\n```\n\n如下方的图所示，胡萝卜已经不在了：\n\n![胡萝卜列表项已被移除](img/removeChild.png)\n\
  \n#### 消失但未消失\n\n让我们在这里提醒一下原始 HTML 和 DOM 之间的区别。这是你更新后的 Pen [现在应该的样子](https://codepen.io/SitePoint/pen/WNoovOX)。胡萝卜项已从渲染视图（即你在浏览器中看到的内容）中移除。但请注意，原始的胡萝卜代码仍在\
  \ HTML 中。JavaScript 从文档对象模型中删除了胡萝卜列表项，并没有从实际 HTML 中删除。\n\n### 替换页面上的元素\n\n可以使用 `replaceChild()`\
  \ 方法用一个节点替换另一个节点。它在父节点上被调用，并有两个参数：新节点和要被替换的节点。例如，如果我们想更改第三个列表项的内容（你可以吃太多香蕉），我们可以用一个新的文本节点替换旧的，如下所示：\n\
  \n```\nconst lemon = document.createElement('li');\nlemon.innerHTML = `<span>\U0001F34B\
  </span>Lemon`;\nfood.replaceChild(lemon,banana); \n```\n\n如下所示，柠檬已经替换了我们列表中的香蕉。\n\
  \n![替换元素](img/replaceChild.png)\n\n这是我们[更新后的 Pen](https://codepen.io/SitePoint/pen/rNWWVdP)。\n\
  \n### 获取和设置属性\n\n所有的 HTML 元素都有大量可能的属性，例如 `class`、`id`、`src` 和 `href`。DOM 有许多方法可以获取或设置这些属性。\n\
  \n### 获取元素的属性\n\n`getAttribute()` 方法返回作为参数提供的属性值。例如，我们可以通过在控制台中输入以下代码来查找 `apple`\
  \ 元素的类：\n\n```\napple.getAttribute('class');\n<< \"fruit\"\n```\n\n如果元素没有给定的属性，它将返回\
  \ `null`。例如，如果在控制台中输入以下代码，我们可以看到 `broccoli` 元素没有 `src` 属性（我们之前在创建元素时没有添加它）：\n\n\
  ```\nbroccoli.getAttribute('src');\n<< null\n```\n\n### 设置元素的属性\n\n`setAttribute()`\
  \ 方法可以更改属性的值。它接受两个参数：你想要更改的属性和新值。\n\n例如，如果我们想为 `broccoli` 元素添加 `veg` 类，可以在控制台中使用以下代码：\n\
  \n```\nbroccoli.setAttribute('class', 'veg');\n```\n\n#### 多个类和 `setAttribute`\n\
  \n使用 `setAttribute()` 方法会覆盖元素已拥有的类。通常使用 `classList` 属性会更好，我们将介绍这一内容。\n\n### `className`\
  \ 属性\n\n正如我们所见，可以使用 `setAttribute()` 方法修改元素的类。还有一个 `className` 属性允许直接设置类。此外，它还可用于查找属性的值：\n\
  \n```\napple.className;\n<< \"fruit\"\n```\n\n我们也可以用它来设置元素的类。例如，我们之前创建的 `melon`\
  \ 元素也没有类属性，所以现在来修复它：\n\n```\nmelon.className = 'fruit';\n<< \"fruit\"\n```\n\n####\
  \ 多个类和 `className`\n\n与上面的 `setAttribute` 一一样，通过赋值更改元素的 `className` 属性也会覆盖元素上设置的其他类。可以通过使用\
  \ `classList` 属性来避免这个问题，我们将介绍这一内容。\n\n### `classList` 属性\n\n`classList` 属性是元素拥有的所有类的列表。它还有许多方法可以修改元素的类。\n\
  \n`add()` 方法用于向元素添加类，而不会覆盖已存在的类。例如，我们可以通过以下代码为之前创建的 `lemon` 元素添加 `fruit` 类：\n\n\
  ```\nlemon.classList.add('fruit');\n```\n\n`remove()` 方法从元素中移除特定的类。例如，我们可以通过以下代码移除刚刚添加的\
  \ `fruit` 类：\n\n```\nlemon.classList.remove('fruit');\n```\n\n`contains()` 方法将检查元素是否包含某个类：\n\
  \n```\napple.classList.contains('fruit');\n<< true\n\napple.classList.contains('veg');\n\
  << false\n```\n\n### 使用 style 操作\n\n每个元素节点都有 `style` 属性。它可以用于动态修改网页上任何元素的样式。\n\n\
  要查看此示例，尝试在你的 Pen 的 **JS** 部分添加以下代码：\n\n```\napple.style.border = \"red 2px solid\"\
  ;\n<< \"red 2px solid\"\n```\n\n这是[更新后的 Pen](https://codepen.io/SitePoint/pen/QWGGxbp)。`apple`\
  \ 列表元素周围添加了红色框。\n\n![为元素样式](img/style.png)\n\n#### CSS 属性名中的连字符\n\n\n\n\n在 JavaScript\
  \ 中引用任何由连字符分隔的 CSS 属性名时，必须使用驼峰法（camelCase）。因此，连字符会被移除，后面的字母将大写。这是因为 JavaScript 不允许在属性名中使用连字符。\n\
  \n例如，CSS 属性 `background-color` 变为 `backgroundColor`，而 `font-size` 变为 `fontSize`。\n\
  \n#### 优雅优雅（Being Classy）\n\n虽然动态元素的样式很有用，但如果你想一次性更改大量的样式，代码就会变得非常混乱。\n\n通常，更好的替代方案是动态更改元素的类（class），并在\
  \ CSS 中为每个类设置不同的样式。\n\n例如，如果我们想给 `apple` 元素添加一个红色边框（出于某种原因突出显示），我们可以采用之前看到的方法，也可以给\
  \ `apple` 元素添加一个 `highlighted` 的类：\n\n```\napple.classList.add('highlighted');\n\
  ```\n\n然后在 `CSS` 部分添加以下内容：\n\n```\n.highlighted {\n  border: red 2px solid;\n}\n\
  ```\n\n这里是[我们更新了该代码的 Pen](https://codepen.io/SitePoint/pen/yLVVEqq)。\n\n使用这种方法的另一个优势是，如果我们以后决定更改突出元素的方式，它赋予了我们更大的灵活性。例如，我们可能想使用蓝色背景和加粗文本，而不是红色边框。我们只需要更改\
  \ CSS 中 `highlighted` 类的代码，而无需在 JavaScript 代码中翻找以更改每个需要突出元素的样式属性。使用类来更新元素样式是一种更符合\
  \ DRY（不要重复）原则的方法。\n\n## 一个简单的待办列表\n\n我们将通过编写一些代码来结束本章，创建一个待办列表，并允许我们向其中添加项目并在完成后将其划掉。所有这些将通过使用\
  \ JavaScript 创建的动态 HTML 完成。在 CodePen 上打开一个新的 Pen 开始吧。\n\n让我们从创建列表元素开始，在 `JS` 部分添加此代码：\n\
  \n```\nconst list = document.createElement('ul');\ndocument.body.appendChild(list);\n\
  ```\n\n这创建了一个无序列表（`<ul>`）并将其附加到文档的 `<body>` 标签上。你还看不到任何渲染内容，因为列表是空的——但它确实在那里！（（如果你检查\
  \ DOM，现在会看到那里有一个空的 `<ul></ul></ul>` 代码。）\n\n接下来，我们将编写一个添加任务的函数。在 `JS` 部分添加以下代码：\n\
  \n```\nfunction add(item){\n  const li = document.createElement('li');\n  li.innerHTML\
  \ = item;\n  list.appendChild(li);\n}\n```\n\n此函数将创建一个列表项（`<li>`）标签，然后将其作为子元素添加到我们创建的\
  \ `<ul>` 元素中。列表项的内容将作为参数传递给函数的内容，因此 `add('Read a book')` 将向列表元素添加以下 HTML：\n\n```\n\
  <li>Read a book</li>\n```\n\n在 CodePen 中打开控制台并向列表添加几个任务：\n\n```\nadd('Bake cake');\n\
  add('Sing song');\nadd('Read book');\n```\n\n当你按下 `Enter` 键时，你应该能看到每个项目都出现在屏幕上。\n\
  \n![动态添加内容](img/add.png)\n\n现在我们来写一个函数，为项目切换 `complete` 类。如果项目没有 `complete` 类，则会添加它；如果它已经有了该类，则会将其移除：\n\
  \n```\nfunction toggle(item){\n  item.classList.toggle('complete');\n}\n```\n\n\
  我们还需要在 `CSS` 部分添加一些代码，为具有 `complete` 类的项目设置样式，使其看起来像被划掉一样：\n\n```\n.complete{\n\
  \  text-decoration: line-through;\n}\n```\n\n再次打开控制台，看看这是否有效。该函数接收我们想要划掉的实际元素作为参数，因此我们可以尝试用以下代码划掉列表中的第一个最后一个项目：\n\
  \n```\ntoggle(list.firstChild);\ntoggle(list.lastChild);\n```\n\n每当你按下 `Enter` 键，你都应该看到相关项目在页面上被划掉。\n\
  \n![切换类](img/toggle.png)\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/qBqqKwE)。\n\
  \n显然，通过控制台与列表交互是令人沮丧的，但至少我们证明了使用 JavaScript 动态添加和编辑内容是可能的。在下一章中，我们将考虑如何在不需要控制台的情况下增加这种交互性。\n\
  \n## 挑战\n\n1. 使用纯 JavaScript 在新的 Pen 中创建一些动态 HTML，包括至少一个标题和一个段落。CodePen 的 `HTML`\
  \ 部分应该是完全空的。你可以看到[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/zYooaXQ)。\n\n\
  2. 为我们编写的待办列表添加一个名为 `destroy` 的函数。它应该从列表中移除作为参数提供的任务。例如，`destroy(list.lastChild)`\
  \ 应该移除列表中的最后一个项目。你可以看到[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/jVKo)。\n\
  \n## 总结\n\n* 文档对象模型（Document Object Model）是一种将页面表示为节点树的方式。\n* DOM 有许多可以用于导航页面的方法。\n\
  * 元素的属性可以通过 `getAttribute()` 方法访问，并通过 `setAttribute()` 方法更新。\n* `innerHTML` 属性可以用于快速插入原始\
  \ HTML。\n* `createElement()` 和 `createTextNode()` 方法可以用于创建标记。\n* 使用 `appendChild()`\
  \ 和 `insertBefore()` 方法可以将标记添加到页面。\n* 元素可以使用 `replaceChild()` 方法替换，并使用 `remove()`\
  \ 方法移除。\n* 可以更新 `style` 属性来更改元素的 CSS 属性。\n\n现在我们已经学习了如何导航和动态更新网页标记，是时候与其交互了。在下一章中，我们将学习如何处理事件。\n\
  \n# 主事件\n\n在上一章中，我们接触了 DOM 以及它允许我们与页面元素交互。在这一章中，我们将研究事件如何提供用户交互与程序之间的联系。没错——这一章是你的代码开始变得完全交互且真正有趣的时刻！\n\
  \n在本章中，我们将涵盖以下主题：\n\n* 事件驱动编程\n* 事件监听器\n* 点击事件\n* 事件对象\n* 表单提交\n* 鼠标事件\n* 键盘事件\n\
  * 移除事件监听器\n* 事件委托\n\n\n\n当事件发生时，`event listener`（事件监听器）就会被触发。事件监听器的工作原理类似于水壶上的哨子。程序不需要不断检查事件是否已经发生，而是让事件监听器在后台运行，直到事件发生，然后通知程序以便其立即做出响应。这允许程序在等待事件发生的同时继续执行其他任务。\n\
  \n## 事件处理器 (Event Handlers)\n\n`event handler`（事件处理器）是一组在事件发生时要执行的操作指令。在上面的水壶的例子中，这就是水壶烧开后要执行的指令——即把它从炉上取下来并泡杯茶！\n\
  \n下面的图展示了这一过程：从一个触发事件监听器的事件开始，然后它通知事件处理器并产生一个操作。\n\n![导致操作的事件！](img/events.png)\n\
  \n在编程中，事件处理器通常以回调函数（callback function）的形式存在，当事件监听器被触发时就会调用。例如，你可能希望在用户点击按钮时显示弹窗通知。这可以通过设置一个在用户点击按钮时触发的事件监听器来实现。然后，事件处理器将调用显示通知的函数。每当事件监听器被触发时，该函数就会被调用，这意味着每次按下按钮时消息都会出现。这一序列在图中所示。\n\
  \n![导致弹出消息的鼠标点击](img/eventClick.png)\n\nJavaScript 是一种基于事件的语言，我们在本章节其余部分来看一些常见浏览器事件的示例。\n\
  \n## 点击事件 (Click Events)\n\n在 JavaScript 中，我们可以通过在元素上调用 `addEventListener()` 方法为页面上的元素附加事件监听器。为了演示这一点，我们将在代表整个页面的\
  \ `document` 对象上附加一个事件监听器。当用户点击页面时，它会被触发并调用事件处理器函数。`click` 事件发生在用户用鼠标点击、按下 `Enter`\
  \ 键或空格键、或者触摸屏幕时，因此它是一个涵盖了许多交互类型的全方位事件。在 CodePen 上打开一个新的 Pen，并在 **JS** 部分输入以下代码：\n\
  \n```\ndocument.addEventListener('click',bang);\n```\n\n该事件监听器接受两个参数：第一个是需要监听的事件（在本例中为\
  \ `click`），第二个是事件处理器（在本例中是一个名为 `bang` 的回调函数）。因此，这个事件监听器将监听 `click` 事件，并在每次发生点击时调用\
  \ `bang` 函数。\n\n注意，当 `bang` 函数作为事件监听器的参数使用时，后面不要加括号。否则，该函数会在设置事件监听器时立即被调用，而不是在事件发生时调用！\n\
  \n在我们测试之前，我们需要定义 `bang` 函数。在事件监听器下方添加以下代码：\n\n```\nfunction bang(){\n  document.body.style.background\
  \ = 'yellow';\n  document.body.innerHTML = `<h1>BANG!!!</h1>`;\n}\n```\n\n此函数使用了我们在上一节中看到的一些\
  \ DOM 方法。首先，它使用 `style` 属性将 `body` 的背景更改为黄色。然后，它使用一个带有“BANG!!!”文本的标题元素更新内部 HTML。\n\
  \n但在触发 `click` 事件之前，这个函数将不会被调用。试一试：只要你点击页面上的任何地方，你就会看到 bang 消息。\n\n![点击并触发！](img/bang.png)\n\
  \n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/wvoJvpy)。\n\n### 点击元素\
  \ (Clicking Elements)\n\n上一个例子中的事件监听器是一个`global event listener`（全局事件监听器），它监听整个页面的点击。我们也可以为页面上的特定元素附加事件监听器。这些监听器只会在事件发生在这些元素上时触发。\n\
  \n为了看到这个示例，我们将创建一个按钮，点击它会更改页面的背景颜色。在 CodePen 上打开一个新的 Pen，并在 **HTML** 部分添加以下代码：\n\
  \n```\n<button id='red'>Red</button>\n```\n\n这在页面上添加了一个按钮。接下来的代码将在 **JS** 部分为我们该按钮的引用：\n\
  \n```\nconst redButton = document.getElementById('red');\n```\n\n现在我们已经有了按钮的引用，可以为它附加一个事件监听器：\n\
  \n```\nredButton.addEventListener('click', e => document.body.style.background =\
  \ 'red');\n```\n\n这在监听 `click` 事件，与上一个例子一样，但第二个参数不是函数名，而是一个直接定义在事件监听器内部的匿名函数。对于短函数非常有用，而箭头函数是使用它们的良好选择，因为只是一行用于将\
  \ body 背景颜色更改为红色的代码。\n\n![点击变红](img/red.png)\n\n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/VwmpwXm)。\n\
  \n敏锐的人可能在想：“但那个字母 `e` 在那里是干什么用的？”如果你发现了它，很好。它是函数的参数，是对事件对象的引用，我们可能应该更详细地查看它。\n\n\
  ### 事件对象 (The Event Object)\n\n每当事件发生时，被调用的函数会自动接收一个 `event object`（事件对象）作为参数。事件对象包含了大量关于事件的信息，以属性的形式存储。例如，`target`\
  \ 属性指向触发事件的元素。\n\n让我们在示例中添加另一个按钮，以便观察事件对象。在 **HTML** 部分添加以下行代码：\n\n```\n<button\
  \ id='green'>Green</button>\n```\n\n这为我们提供了另一个可以玩的按钮。现在在 **JS** 部分，添加以下代码获取其引用：\n\
  \n```\nconst greenButton = document.getElementById('green');\n```\n\n让我们在 **JS**\
  \ 部分为这个按钮添加一个事件处理器：\n\n```\ngreenButton.addEventListener('click', e => document.body.style.background\
  \ = e.target.textContent);\n```\n\n#### 使用 `e` 还是不使用 `e`？\n\n函数参数不必是 `e`。使用 `e`\
  \ 是合理的，因为它是“event”的缩写。\n\n这与我们为红色按钮附加的事件监听器非常相似，只不过我们没有硬编码要设置的颜色，而是将其设置为 `e.target.textContent`。`target`\
  \ 属性指向触发事件的元素，在这种情况下为 `greenButton` 元素。`textContent` 属性引用元素内部的文本，即“Green”。\n\n如果你尝试点击按钮，会将页面的\
  \ CSS `background-color` 属性更改为按钮内的任何文本。尝试将文本改为颜色，你会发现背景颜色更新为该颜色。另一个 DRY（不要重复）代码的示例，因为我们只需要在一个地方指定颜色。\n\
  \n![点击变绿](img/green.png)\n\n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/wvoJvmm)。\n\
  \n事件对象还有许多属性和方法，在 [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/API/Event#Properties)\
  \ 网站上进行了总结。\n\n\n\n\n```\n<p>在下方框中输入您的名称：</p>\n<form name='myForm'>\n  <input type='text'\
  \ name='myName'>\n  <button type='submit'>Submit</button>\n</form>\n<div id='hello'></div>\n\
  ```\n\n这将产生一个输入框，旁边有一个 `Submit`（提交）按钮。注意该按钮有一个类型为 `submit` 的属性：这将在它被按下时会触发一个 `submit`\
  \ 事件。我们还在代码末尾添加了一个 ID 为 `hello` 的空 `<div>` 元素，因为它目前是空的，所以现在屏幕上是不可见的。我们将它用作容器，在表单提交后存放输出内容。\n\
  \n![用于提交名称的表单](img/form.png)\n\n首先，我们需要对这些元素进行引用。在 `JS` 部分添加以下代码：\n\n```\nconst\
  \ form = document.forms.myForm;\n```\n\nDOM 了一种了一种通过 `document.forms` 访问网页上任何表单的方便方法，它将返回页面上所有表单的集合。如果你添加表单的名称，它将返回具有该名称的表单（注意我们的表单在\
  \ HTML 代码中有一个名为 `myForm` 的属性）。\n\n接下来，添加以下 JavaScript 代码：\n\n```\nconst hello =\
  \ document.getElementById('hello');\n```\n\n这为我们提供了 HTML 中 ID 为 `hello` 的那个空 `<div>`\
  \ 元素的引用。\n\n接下来，我们将为表单添加一个事件监听器：\n\n```\nform.addEventListener('submit',sayHello);\n\
  ```\n\n这将在表单提交时调用 `sayHello` 函数。让我们接着来写这个函数：\n\n```\nfunction sayHello(e){\n hello.textContent\
  \ = `Hello, ${form.myName.value}!`;\n}\n```\n\n该函数使用模板字面量（template literal）更新 `hello`\
  \ div 的 `textContent` 属性。注意在模板字面量内部，引用了 `form.myName.value`。它返回一个与 `<input>` 字段内内容匹配的字符串，因为\
  \ `<input>` 标签有一个名为 `myName` 的属性。因此，如果你在输入框中输入“JavaScript”，`hello` div 将包含以下消息：“Hello,\
  \ JavaScript!”\n\n### 引用表单元素\n\n表单内部的任何元素都可以通过它们的 `name` 属性作为表单元素的属性被引用。在上面的示例中，`form.myName`\
  \ 是表单内部 `<input>` 元素的引用，因为它有一个名为 `myName` 的属性。\n\n尝试在输入字段中输入您的名称，然后按下 `Enter` 键或点击\
  \ `Submit` 按钮提交表单。\n\n遗憾的是，你可能会收到类似这样的错误消息：\n\n![错误的路径](img/badpath.png)\n\n这是因为表单有一种默认行为，意味着它们会被提交到服务器。在这种情况下，它尝试提交到\
  \ `/boomboom/v2/index.html`，这是 CodePen 服务器上的一个页面，我们没有权限访问。因此生成了错误消息。不过，不用担心，这很容易修复。\n\
  \n### 表单的 `action` 属性\n\n表单有一个 `action` 属性，可以用于指定你想将它们提交到服务器上的哪个页面。如果没有指定，表单将尝试尝试将自己提交到它所在的页面。这就是这种情况下发生的情况（因为我们没有指定\
  \ `action` 属性），但 CodePen 不允许我们将表单提交到他们的服务器！\n\n### 防止默认行为\n\n网页上的某些元素具有浏览器内置的默认行为。正如我们刚刚看到的，表单在提交时默认会被发送到服务器。\n\
  \n幸运的是，事件对象有一个名为 `preventDefault` 的方法，它可以在事件发生时停止任何默认行为的发生。我们可以在 `sayHello` 函数中使用它来阻止表单被提交到服务器。更新函数使其看起来如下：\n\
  \n```\nfunction sayHello(e){\n  e.preventDefault();\n  hello.textContent = `Hello\
  \ ${form.myName.value}!`;\n}\n```\n\n现在再次提交表单，它应该看起来像这样：\n\n![现在提交表单的结果](img/formresults.png)\n\
  \n你可以查看 [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/RwopwdL)。\n\n## 键盘事件\n\
  \n有两个与用户按下按键相关的主要事件。这些是 `keydown`（按下按键时）和 `keyup`（释放按键时）。\n\n这些事件的事件对象包含两个属性，可以告诉我们按下了哪个键：\n\
  \n*   `code` 属性返回一个与按下的实际物理键相关的字符串。\n*   `key` 属性返回将出现在页面上的实际输出。这可能会受到按住特殊键（如 `shift`\
  \ 或 `alt`）、键盘布局设置和本地设置（如货币符号键）的影响。\n\n例如，如果你按下空格键，`code` 属性将是 `Space`，但 `key` 属性将是（一个空格，即它产生的内容）。你可以通过在\
  \ CodePen 的 `JS` 部分添加以下代码来查看每个按键产生的代码：\n\n```\ndocument.addEventListener('keydown',e\
  \ => document.body.innerHTML = `<div>e.code: ${e.code}</div><div>\ne.key: ${e.key}</div>`);\n\
  ```\n\n每当按下按键就会触发一次。\n\n### 实时输入\n\n为了查看如何使用键盘事件，让我们构建一个更新输出的实时输入。在 CodePen 上打开一个新的\
  \ Pen 并在 **HTML** 部分添加以下内容：\n\n```\n<input id='input'>\n<div id='output'></div>\n\
  ```\n\n这创建了一个输入元素和一个用于输出的空 `<div>`。这两个元素都有 `id` 属性，以便我们从代码中访问它们。让我们将这些添加到 **JS**\
  \ 部分：\n\n```\nconst input = document.getElementById('input');\nconst output = document.getElementById('output');\n\
  ```\n\n最后，我们只需要为输入元素添加一个事件监听器：\n\n```\ninput.addEventListener('keyup', e => output.textContent\
  \ = input.value);\n```\n\n这是一个匿名函数，它会在 `keyup` 事件被触发时被调用。使用 `keyup` 而不是 `keydown`\
  \ 的原因是按键上的字符会在这两个事件之间出现在输入字段中，所以当 `keydown` 事件触发时，字符还没有在那里，但在 `keyup` 事件触发时，它已经在那里了。这很重要，因为函数通过覆盖\
  \ `textContent` 属性将输入字段中的内容插入到 `output` div 中。\n\n尝试在输入字段中输入内容。你应该会在每次按下按键时看到文本出现。\n\
  \n![实时输入](img/liveinput.png)\n\n## 鼠标事件\n\n有很多与鼠标指针及其与页面元素交互相关的事件。\n\n### 鼠标移动\n\
  \n每当鼠标指针移动时，`mousemove` 事件就会触发。为了看到这种示例，我们将编写一些代码，在鼠标指针每次移动时都告诉我们坐标。\n\n在 CodePen\
  \ 上打开一个新的 Pen，并首先在 **JS** 部分添加以下事件监听器：\n\n```\ndocument.addEventListener('mousemove',showCoords);\n\
  ```\n\n每当鼠标指针在页面的任何位置移动时，它都会调用 `showCoords` 函数。现在现在写这个函数：\n\n```\nfunction showCoords(event){\n\
  \  document.body.textContent = `(${event.x},${event.y})`;\n}\n```\n\n\n\n\n\n此函数更新文档\
  \ `body` 的 `textContent` 属性，使其包含鼠标指针的坐标。事件对象的 `x` 和 `y` 属性分别告诉我们鼠标指针的水平和垂直位置。我们可以使用模板字符串字量（template\
  \ literal）在每次鼠标移动时将这些值插入到文档正文的文本内容中。尝试在页面上移动你的鼠标指针，你应该能在左上角看到它的精确坐标。\n\n![跟踪鼠标移动时的坐标](img/mousemove.png)\n\
  \n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/ExNWaxK)。\n\n## 鼠标悬停 (Mouse\
  \ Over)\n\n当鼠标指针移动到元素上方时，会触发 `mouseover` 事件。为了看到这个效果，让我们来创建一个名为“找炸弹”的小游戏。在 CodePen\
  \ 上打开一个新的 Pen，并在 `JS` 部分输入以下代码：\n\n```\nconst bomb = document.createElement('div');\n\
  \  bomb.textContent = '\U0001F4A3';\n  bomb.style.position = 'absolute';\n  bomb.style.top\
  \ = Math.floor(200*Math.random()) + 'px';\n  bomb.style.left = Math.floor(200*Math.random())+'px';\n\
  \  bomb.style.fontSize = '64px';\n  document.body.appendChild(bomb);\n```\n\n这使用了我们在上一节中学到的很多内容来创建一个包含炸弹表情符号作为文本内容的\
  \ `<div>` 元素。它将 `position` 属性设置为 `absolute`，这允许我们使用 `left` 和 `top` 属性分别相对于页面左侧和顶部设置炸弹的位置。然后我们使用在第\
  \ 4 章中学到的知识，将这些属性设置为随机数。最后，我们使用 `appendChild()` 方法将炸弹放置在页面上。每运行一次代码，它都会出现在随机位置。\n\
  \n接下来，我们需要添加事件监听器：\n\n```\nbomb.addEventListener('mouseover', e => {\n document.body.style.background\
  \ = 'red';\n document.body.innerHTML = '<h1>BOOOOOOM!!!</h1>';\n});\n```\n\n这会监听\
  \ `mouseover` 事件。第二个参数是一个匿名函数，当鼠标指针滑过炸弹时会被调用。\n\n试一试看会发生什么！\n\n![这个游戏太棒了！](img/bomb.png)\n\
  \n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/RwopNPx)。\n\n## 鼠标按下与释放\
  \ (Mouse Up and Down)\n\n当左鼠标键被按下时触发 `mousedown` 事件，当释放它时触发 `mouseup` 事件。此事件可以绑定到特定元素上，因此事件仅在鼠标指针位于元素上时才会触发。\n\
  \n我们可以将这些事件与 `mousemove` 事件结合，来实现一个非常简单的拖放界面。在 CodePen 上打开一个新的 Pen，并在 `HTML` 部分输入以下代码：\n\
  \n```\n<div id='star'>⭐️</div>\n```\n\n这只是包含一个星星表情符号的 `<div>` 元素（你可以选择任何喜欢的 emoji！），它是要在页面上移动的元素。\n\
  \n接下来在 `CSS` 部分添加以下代码：\n\n```\n#star{\n  font-size: 64px;\n  position: absolute;\n\
  }\n```\n\n这让元素变大了一些，并将 `position` 属性设置为 `absolute`，这意味着可以使用 `left` 和 `top` 属性更改它的位置。*这对拖放功能的实现至关重要*。\n\
  \n![星星的诞生](img/star.png)\n\n接下来，我们将处理 JavaScript 代码。在 `JS` 部分添加以下内容：\n\n```\nconst\
  \ star = document.querySelector('#star');\n```\n\n我们的第一行使用查询选择器（query selector）获取星星元素的引用。接下来，我们需要为该元素添加几个事件处理器：\n\
  \n```\nstar.addEventListener( 'mousedown', start);\nstar.addEventListener( 'mouseup',\
  \ stop );\n```\n\n当在星星上按下鼠标键时，这会调用 `start` 函数，当释放鼠标键时将调用 `stop` 函数。我们先写 `start`\
  \ 函数：\n\n```\nfunction start(e) {\n  document.addEventListener( 'mousemove', move);\n\
  }\n```\n\n这只是为整个页面添加了一个事件监听器。它正在监听 `mousemove` 事件并调用 `move` 函数。我们接着来写它：\n\n```\n\
  function move(e){\n  star.style.left = `${e.x}px`;\n  star.style.top = `${e.y}px`;\n\
  }\n```\n\n`move` 函数是实现拖拽的关键。它只是将星星的位置（`star.style.left` 和 `star.style.top`）设置为存储在事件对象属性\
  \ `x` 和 `y` 中的鼠标指针位置。（在上面的代码中，事件对象被赋值给参数 `e`）。注意，这里使用了模板字符串，以便在末尾添加 `px`（单位是像素）。\n\
  \n这将导致星星跟随鼠标指针在屏幕上移动。我们希望在释放鼠标并调用 `stop` 函数时停止这种行为。为了停止它，我们需要移除 `mousemove` 事件监听器。\n\
  \n### 移除事件监听器\n\n可以使用 `removeEventListener()` 方法移除事件监听器。\n\n### 为 `addEventListener`\
  \ 函数命名\n\n如果你以后想移除它，则不应该将匿名函数作为 `addEventListener` 的参数。因为需要保持一致的：\n\n```\ndocument.addEventListener(\
  \ 'mousemove', move);\n```\n\n```\nfunction stop(){\n  document.removeEventListener(\
  \ 'mousemove');\n}\n```\n\n## 简单待办事项 (Simple To-do List)\n\n我们将通过整合学到的内容来构建一个更复杂的待办事项应用。它允许你向列表添加项目，并通过点击它们来划掉——无需操作控制台。\n\
  \n开始之前，在 CodePen 上打开一个新的 Pen，并在 **HTML** 部分输入以下内容：\n\n```\n<form name='addTask'>\n\
  \  <input type='text' name='newTask'>\n  <button type='submit'>ADD</button>\n</form>\n\
  \n<ul id='list'></ul>\n```\n\n这与我们在本章早期用于[表单输入示例](https://codepen.io/SitePoint/pen/RwopL)\
  \ 的 HTML 代码几乎相同。它创建一个包含单个输入框和提交按钮的表单。还有一个无序列表元素（`<ul>`），我们在程序运行时动态将项目放入其中。\n\n现在编写让它运行的代码！首先，我们需要获取一些\
  \ HTML 元素的 JavaScript 引用：\n\n```\nconst list = document.getElementById('list');\n\
  const form = document.forms.addTask;\n```\n\n这给了我们 `form` 元素和空 `<ul>` 元素的引用。\n\n\
  现在让我们关注向列表添加项目。为此，我们需要为表单附加一个事件监听器：\n\n```\nform.addEventListener('submit',addTask);\n\
  ```\n\n当提交表单时，这会调用 `addTask` 函数。现在我们只需要编写 `addTask` 函数：\n\n```\nfunction addTask(e){\n\
  \  e.preventDefault();\n  const task= document.createElement('li');\n  task.textContent\
  \ = form.newTask.value;\n  list.appendChild(task);\n}\n```\n\n\n\n\n此函数执行的第一件事是使用\
  \ `preventDefault()` 方法阻止表单提交到服务器。之后，我们使用在上章中学习的某些 DOM 方法创建一个新的列表项（`<li>`）元素，并将其赋值给变量\
  \ `task`。接下来，我们将 `textContent` 属性设置为输入到表单字段中的文本，该文本存储在 `form.newTask.value` 中。最后，我们使用\
  \ `appendChild()` 方法将此新元素添加到 `list` 元素的底部。\n\n尝试在输入框中添加一个任务，如果一切按计划进行，它看起来应该像这样：\n\
  \n![添加任务](img/addtask.png)\n\n现在，我们需要做的是让项目在被点击时能够被划掉（删除线效果）。让我们给项目添加一个事件监听器来处理点击操作：\n\
  \n```javascript\nlist.addEventListener('click',strikeTask);\n```\n\n你可能已经注意到，我将事件监听器添加到了列表元素，而不是单独的列表项。\n\
  \n如果我们为所有的 `<li>` 标签附加 `click` 事件监听器，那么我们需要为每个元素准备一个独立的事件监听器。而且，每当添加新项目时，我们都必须动态地添加新的事件监听器。这可能会导致大量包含相同代码且基本上在做同样事情的事件监听器——这完全不符合\
  \ DRY（不要重复自己）原则！\n\n### 事件委托\n\n处理这种情况的 DRY 方法是使用**事件委托**。这会将事件监听器附加到父元素 `<ul>`\
  \ 上，而不是每个单独的列表项。当点击一个子元素时，事件仍然会触发，我们可以使用事件对象的 `target` 属性来识别被点击的实际元素。\n\n让我们来看一下效果。在\
  \ JS 部分的底部添加以下代码：\n\n```javascript\nfunction strikeTask(e){\n  alert(e.target.textContent);\n\
  }\n```\n\n这是 `strikeTask` 函数，它在列表被点击时触发。目前，它包含一个 alert，用于显示通过 `event.target` 识别出的被点击元素的文本内容。尝试添加一些项目，然后点击其中一个。你应该看到类似下面的内容：\n\
  \n![切换任务状态](img/taskalert.png)\n\n现在我们已经确定它可以正常工作了，让我们更新代码，改为划掉项目。如下所示更新 `strikeTask`\
  \ 函数：\n\n```javascript\nfunction strikeTask(e){\n  e.target.classList.toggle('complete');\n\
  }\n```\n\n这使用了每个元素都有的 `classList` 属性的 `toggle` 方法。如果元素没有该类，它将添加该类；如果已经有了该类，则将其移除。这意味着点击项目将添加\
  \ `complete` 类，或者在它已存在时将其移除。这本身不会产生任何效果，但现在我们可以添加一些 CSS 来样式化任何带有 `complete` 类的元素：\n\
  \n```css\n.complete {\n  text-decoration: line-through;\n}\n```\n\n现在，如果你尝试添加一些项目并点击它们，你应该能够尽情所欲地划掉它们，如下文所示。\n\
  \n![划掉已完成的任务](img/strike.png)\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/JjbWoWN)。\n\
  \n## 挑战\n\n1.  我们在本章中创建的拖放示例是一个非常简单的实现。更健壮的版本可以在[此处](https://codepen.io/SitePoint/pen/vYyxExR)查看。看看代码并是否能理解发生了什么。它还使用了[触摸事件](https://developer.mozilla.org/en-US/docs/Web/API/Touch_events)。\n\
  \n2.  你能更新简单的待办列表代码，以便在添加项目后让 `add` 函数清空输入框并获取焦点，而不是让文本留在那里吗？（提示：你可能想查找表单元素拥有的 `focus()`\
  \ 方法。）你可以在这里查看我的解决方案](https://codepen.io/SitePoint/pen/KKNWwmP)。\n\n3.  在简单的待办列表中，与其划掉项目，你能更改功能使其在被点击时删除项目吗？（提示：你可以使用在上章中介绍过的\
  \ `remove()` 方法。）你可以在这里查看我的解决方案](https://codepen.io/SitePoint/pen/JjbWoNN)。\n\n\
  ## 总结\n\n*   当用户与网页进行交互时，会发生事件。\n*   事件监听器被附加到元素上，并在事件发生时调用回调函数。\n*   事件对象作为参数传递给回调函数，包含许多与事件相关的属性和方法。\n\
  *   有许多类型的事件，包括点击事件、鼠标事件和键盘事件。\n*   表单还有一个 `submit` 事件，可以可以在表单提交之前拦截它。\n*   你可以使用\
  \ `removeEventListener()` 方法移除事件。\n*   事件委托是将事件监听器添加到父元素上，用以捕获发生在多个子元素上的事件，从而避免为每个子元素添加事件监听器。\n\
  \n现在我们已经涵盖了事件，可以让我们的代码更具交互性。在接下来的几章中...\n\n\n\n\n在字符串上使用展开运算符（spread operator）的一个特殊好处是我们可以对它们使用迭代方法。那么，什么是迭代器呢？\n\
  \n## 数组迭代方法\n\n`Array iteration methods` 是允许你遍历数组并对数组中的每个项执行操作的方法。对数组中的某个项执行的每一次操作都称为一次\
  \ `iteration`（迭代）。\n\n![Iterators](img/iterator.png)\n\nJavaScript 包含了许多数组迭代方法，这些方法使用回调函数来提供每次迭代中要执行的操作指令。这些方法总是始终保持原始数组不变，但通常会返回一个新的数组或值。\n\
  \n### 高效的箭头函数\n\n你会发现，在下面的示例中，箭头函数经常被用于声明回调函数。它们是这里很好的候选者，因为它们很短、可以写成一行，并且具有隐式返回值。\n\
  \n### forEach\n\n`forEach()` 方法遍历数组中的每一个项，并在每次迭代时调用一次回调函数。该回调函数接受三个参数：\n\n*   数组中当前项的值\n\
  *   当前项在数组中的索引\n*   数组本身的引用\n\n如果该方法没有使用索引或数组引用，则不需要指定它们。（通常只提供当前项的值作为参数。）\n\n下面的代码显示了一个示例，将数组中每个项的一些信息记录到控制台。它遍历数组中的每个项，并为每个项向控制台打印一条语句。尝试在控制台中输入以下代码（可在[此\
  \ CodePen](https://codepen.io/SitePoint/pen/MWbpXMQ)中找到）：\n\n```\n['\U0001F34F','\U0001F34C\
  ','\U0001F955'].forEach(\n  (item,index,array) => console.log(`Item at position\
  \ ${index} is ${item} (there are ${array.length} items in total).`)\n);\n```\n\n\
  在第一次迭代中，`item` 的值为 \"\U0001F34F\"，`index` 的值为 0，`array` 的值为 `['\U0001F34F','\U0001F34C\
  ',\U0001F955']`。这会在控制台打印出以下字符串：\n\n```\n\"Item at position 0 is \U0001F34F (there\
  \ are 3 items in total).\"\n```\n\n在第二次迭代中，`item` 的值为 \"\U0001F34C\"，`index` 的值为\
  \ 1，`array` 的值为 `['\U0001F34F','\U0001F34C',\U0001F955]`。这会在控制台打印出以下字符串：\n\n```\n\
  \"Item at position 1 is \U0001F34C (there are 3 items in total).\"\n```\n\n在最后一次迭代中，`item`\
  \ 的值为 \"\U0001F955\"，`index` 的值为 2，`array` 的值为 `['\U0001F34F','\U0001F34C',\U0001F955\
  ]`。这会在控制台打印出以下字符串：\n\n```\n\"Item at position 2 is \U0001F955 (there are 3 items\
  \ in total).\"\n```\n\n这总结在下表所示：\n\n| Iteration | `item` | `index` | `array` | `console.log`\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | \"\U0001F34F\" | 0 | ['\U0001F34F','\U0001F34C\
  ','\U0001F955'] | \"Item at position 0 is \U0001F34F (there are 3 items in total).\"\
  \ |\n| 2 | \"\U0001F34C\" | 1 | ['\U0001F34F','\U0001F34C','\U0001F955'] | \"Item\
  \ at position 1 is \U0001F34C (there are 3 items in total).\" |\n| 3 | \"\U0001F955\
  \" | 2 | ['\U0001F34F','\U0001F34C','\U0001F955'] | \"Item at position 2 is \U0001F955\
  \ (there are 3 items in total).\" |\n\n### 扑牌数组\n\n我们可以使用 `forEach()` 方法快速创建一个代表扑牌牌的数组。我们将通过遍历一个代表花色的数组，以及另一个代表该花色中每张牌点值的数组来实现。（你可以从\
  \ [CodePen](https://codepen.io/SitePoint/pen/ZEBejzo) 复制以下示例的代码。）\n\n打开控制台并声明以下变量：\n\
  \n```\nconst suits = ['♠️','♦️','♣️','❤️'];\nconst values = ['Ace',2,3,4,5,6,7,8,9,10,'Jack','Queen','King'];\n\
  const deck = [];\n```\n\n第一个变量 `suits` 是一个包含每种花色字符串表示的数组。变量 `values` 是一个包含每个张牌牌点值字符串表示的数组。变量\
  \ `deck` 是一个空数组，最终将持有整个副牌。\n\n现在我们已经设置好了这些数组，可以遍历 `suits` 数组和 `values` 数组，将元素组合成单牌，并使用\
  \ `push()` 方法将其放入 `deck` 数组中：\n\n```\nsuits.forEach(suit => \n    values.forEach(value\
  \ => \n        deck.push(`${value} of ${suit}`);\n    )\n);\n```\n\n第一个 `forEach`\
  \ 遍历 `suits` 数组。在每次迭代中，都会调用匿名回调函数，参数 `suit` 代表 `suits` 数组中的当前项。第二个 `forEach` 然后遍历\
  \ `values` 数组，并使用参数 `value` 代表该数组中的每个项。我们使用模板字符串（template literal）插值牌的花色和点，创建一个推入\
  \ `deck` 数组的字符串。\n\n例如，在第一次迭代中，`suit` 的值 `suits` 数组中的第一个项 `♠️`，而 `value` 的值是 `values`\
  \ 数组中的第一个项 `Ace`。这产生了一个推入 `deck` 数组的字符串。\n\n### Map\n\n`map()` 方法也遍历数组并使用回调函数作为参数。与\
  \ `forEach` 不同，`map` 返回一个新数组，并将每个值替换为回调函数的返回值。\n\n`map()` 方法的回调函数与 `forEach()` 方法具有相同的参数：\n\
  \n*   数组中当前项的值\n*   当前项在数组中的索引\n*   数组本身的引用\n\n为了演示这一点，请在控制台中尝试[以下代码](https://codepen.io/SitePoint/pen/gOLWxv)：\n\
  \n```\n[\"\U0001F34F\",\"\U0001F34C\",\"\U0001F955\"].map((value,index,array) =>\
  \ '\U0001F60A');\n```\n[\"\U0001F60A\",\"\U0001F60A\",\"\U0001F60A\"]\n\n回调函数是一个带有\
  \ `value`、index` 和 `array` 参数的匿名箭头函数。返回值只是字符串 `'\U0001F60A'`，因此数组中的每个项都被映射为一个笑脸！\n\
  \n在这种情况下，回调函数不需要使用 `item`、`index` 或 `array` 参数，因此它们实际上不需要在那里。以下回调函数使用单个参数 `x` 也是有效的：\n\
  \n```\n[1,2,3].map(x => '\U0001F60A');\n```\n[ \U0001F60A,\U0001F60A,\U0001F60A\
  \ ]\n\n返回值可以基于提供给回调函数的参数。在接下来的示例中，数组中的每个数字都被映射为新数组中自身的平方：\n\n```\n[1,2,3].map(n\
  \ => n*n);\n```\n[1, 4, 9]\n```\n\n你可以为参数命名任何名称。在上面的示例中，我们使用 `n` 代表数组中的每个项。由于回调函数仅依赖于项的值，因此我们只需要提供这个参数。\n\
  \n`map()` 方法的一个特别好的用途是为文本块添加 HTML 标签。例如，接下来的代码接收一个项数组，然后返回每个项在 `<li>` 标签中的内容：\n\n\
  \n\n\n\n```javascript\n['Apple','Banana','Carrot'].map(item => \n`<li>${item}</li>`);\n\
  << [\"<li>Apple</li>\", \"<li>Banana</li>\", \"<li>Carrot</li>\"]\n```\n\n参数 `item`\
  \ 代表每次迭代时数组中的每个字符串。回调函数的返回值是一个模板字面量，它使用字符串插值将字符串插入到 `<li>` 标签内部。\n\n![使用 map 添加标签](img/htmlmap.png)\n\
  \n然后我们可以在末尾链式调用 `join()` 方法并传入空字符串作为参数，将所有项合并成一个的 HTML 字符串：\n\n```javascript\n['Apple','Banana','Carrot'].map(item\
  \ => \n`<li>${item}</li>`).join('');\n<< \"<li>Apple</li><li>Banana</li><li>Carrot</li>\"\
  \n```\n\n然后可以将其插入到 `<ul>` 元素中，根据数组的内容创建一个无序列表。让我们在 CodePen 上尝试一下这个操作。首先在 HTML 部分从一个空的\
  \ `<ul>` 元素开始：\n\n```html\n<ul id='list'></ul>\n```\n\n现在我们将在 JS 部分获取该元素的引用：\n\n\
  ```javascript\nconst list = document.getElementById('list');\n```\n\n现在我们只需要做的就是用我们的\
  \ HTML 字符串更新该元素的 `innerHTML` 属性：\n\n```javascript\nlist.innerHTML = ['Apple','Banana','Carrot'].map(item\
  \ => \n`<li>${item}</li>`).join('');\n```\n\n这会根据数组中的项目，在文档中渲染出一个项目列表：\n\n![将数组渲染为\
  \ HTML 列表](img/arraytoHTML.png)\n\n你可以查看 [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/poNPrrm).\n\
  \n## Reduce (减少)\n\n`reduce()` 方法是另一个遍历数组每个值的方法，每次都会调用回调函数。主要的区别在于，它不是返回一个数组，而是将回调的每个结果合并为一个单一值。\n\
  \n`reduce()` 方法的回调函数描述了如何合并数组的每个值以产生累加运行总和，并有四个参数：\n\n- 累加器（accumulator），用于存储运行总和。该方法将返回它的最终值。\n\
  - 数组中当前项的值。\n- 当前项在数组中的索引。\n- 数组本身的引用。\n\n大多数情况下，只使用前两个参数，任何未使用的参数不需要引用。\n\n以下示例相加数组中的所有数字并返回总和：\n\
  \n```javascript\n[1,2,3].reduce( \n  (acc,value) => acc + value\n);\n<< 6\n```\n\
  \n![使用 reduce 相加数字](img/reduce.png)\n\n在上面的示例中，`acc` 的值从 1 开始（数组中的第一个项）。在每次迭代后，数组中项的值都会加到\
  \ `acc` 的值上。因此在下一次迭代中，2 被加到 `acc` 中使其变为 3。然后在最后一次迭代中，3 被加到 `acc` 中。一旦数组中的每个项都已加在一起，就会返回\
  \ `acc` 的最终值，即 6。\n\n通过对回调函数中的计算进行微调，我们可以将所有数字相乘：\n\n```javascript\n[1,2,3].reduce(\n\
  \  (acc,value) => acc * value\n);\n<< 6\n```\n\n### 加法 vs 乘法\n\n当我们把数字相加和相乘时答案相同，这纯属巧合（尝试使用带有不同数字的数组）。\n\
  \n`reduce()` 方法还接受一个可选的第二个参数，跟在回调函数之后，允许我们设置累加器的初始值。例如，下面的方法相加数组中的所有数字（得到 6），然后在返回\
  \ 16 之前将该结果加到 10：\n\n```javascript\n[1,2,3].reduce(\n  (acc,value) => acc + value,10);\n\
  << 16\n```\n\n## Filter (过滤)\n\n`filter()` 方法测试数组中的每个项，以检查它们是否符合回调函数定义的某些条件。任何在回调中返回真值（truthy）的项都将作为新数组返回。例如，我们可以使用以下代码过滤数字数组，只留下大于\
  \ 2 的数字：\n\n```javascript\n[1, 2, 3, 4].filter(x => x > 2 );\n<< [3,4]\n```\n\n\
  在每次迭代中，回调函数都会检查数组中由参数 `x` 表示的项是否大于 2。如果是，回调函数返回 `true`，该值将保留在新数组中。这个过程可以在图中看到。\n\
  \n![过滤掉不大于 2 的数字](img/filter.png)\n\n`filter()` 方法提供了一种从数组中找到所有真值的有用方法：\n\n```javascript\n\
  [0, 1, '0', false, 'hello' ].filter(Boolean);\n<< [1, 'hello']\n```\n\n这利用了 `Boolean`\
  \ 函数将返回值的布尔表示的这一事实，因此只有真值会返回 `true` 并被 `filter()` 方法返回。要找到所有假值（falsy）值，可以使用以下过滤器：\n\
  \n```javascript\n[0, 1, '0', false, 'hello' ].filter(x => !x);\n<< [0, false]\n\
  ```\n\n这使用了非运算符（`!`）来返回补码。由于 `Boolean` 函数将返回一个值的布尔表示，这意味着只有真值会返回 `true` 并被 `filter()`\
  \ 方法返回。\n\n### 过滤过滤\n\n在第 6 章，我们通过“谁是谁？”游戏使用了这些角色：\n\n![谁的？](img/guesswho.png)\n\
  \n在第 9 章，我们创建了对象来表示它们：\n\n```javascript\nconst alfie = {\n  name: 'Alfie',\n  glasses:\
  \ false,\n  hat: false\n};\nconst betty = {\n  name: 'Betty',\n  glasses: true,\n\
  \  hat: true\n};\nconst gemma = {\n  name: 'Gemma',\n  glasses: false,\n  hat: true\n\
  };\nconst del = {\n  name: 'Del',\n  glasses: true,\n  hat: false\n};\n```\n\n我们可以这样将这些对象放入名为\
  \ `people` 的数组中：\n\n```javascript\nconst people = [alfie,betty,gemma,del];\n```\n\
  \n现在我们可以通过使用 `filter()` 方法对这个数组玩玩“谁是谁？”游戏：\n\n```javascript\npeople.filter(person\
  \ => person.glasses && person.hat);\n<< [{ name: 'Betty', glasses: true, hat: true}]\n\
  ```\n\n上面的过滤器返回了代表 Betty 的对象，因为她戴眼镜又戴帽子。如果我们想找到不戴帽子的人，我们可以在回调函数中使用非运算符：\n\n```javascript\n\
  people.filter(person => person.glasses && !person.hat);\n<< [{ name: 'Del', glasses:\
  \ true, hat: false}]\n```\n\n通过改变回调函数中的条件，你可以不同的方式过滤数组。尝试更改这些条件看看是否可以返回每个人。你可以查看\
  \ [我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/vYymJrp).\n\n\n\n\n`some()`\
  \ 方法与 `every()` 方法非常相似。它也会遍历数组中的每个项，直到回调函数中定义的给定条件返回 `true`。一旦发生这种情况，迭代就会停止，该方法返回\
  \ `true`。如果遍历到数组末尾都没有任何项返回 `true`，它将返回 `false`。这是一种查找数组中至少有一个项符合特定标准的实用方法。\n\n例如，以下代码检查单词中是否有任何一个长度大于七个字符：\n\
  \n```\n['C','C++','Ruby','Python','JavaScript','Swift','Java'].some(word => word.length\
  \ > 7);\n<< true\n```\n\n可以在“[JavaScript 数组迭代器速查表](https://levelup.gitconnected.com/the-array-iterators-cheatsheet-javascript-9d0cfa03f4)”中找到数组迭代方法的有用总结。\n\
  \n在“[函数式 JavaScript 中的过滤与链式调用](https://www.sitepoint.com/filtering-and-chaining-in-functional-javascript/)”中，有一些关于如何链式调用迭代方法的优秀示例。\n\
  \n## 遍历对象\n\n对象和数组一样都是集合，同样可以遍历对象的属性。\n\n例如，考虑以下 `rectangle` 对象，它类似于我们在第 9 章中创建的\
  \ `square` 对象：\n\n```\nconst rectangle = {\n  height: 4,\n  length: 5,\n  perimeter()\
  \ { return 2 * (this.height + this.length); },\n  area() { return this.length *\
  \ this.height; }\n}\n```\n\n我们可以使用 for–in 循环遍历对象的所有属性，该循环会遍历对象中的每一个键。尝试在控制台中输入以下代码（你需要先定义\
  \ `rectangle` 对象）：\n\n```\nfor(const prop in rectangle) {\n  console.log(`${prop}:\
  \ ${rectangle[prop]}`);\n}\n<< height: 4\n<< length: 5\n<< perimeter: function (){\
  \ return 2 * (this.height + this.length) };\n<< area: function { return this.length\
  \ * this.height }\n```\n\n在这个示例中，变量 `prop` 用于在迭代的每一步引用每个属性名。然后我们可以使用 `rectangle[prop]`\
  \ 来查找该属性的值。在示例中，我们简单地使用了 `console.log` 配合模板字字符将属性及其值打印到控制台。\n\n### 键与值\n\nJavaScript\
  \ 还提供了一组方法，返回一个包含对象所有属性和值的数组。这意味着随后可以使用任何数组方法，例如我们在本章中学到的数组迭代方法。\n\n`Object.keys()`\
  \ 方法返回一个包含作为参数提供的对象的所有键的数组：\n\n```\nObject.keys(rectangle);\n<< [\"height\",\"length\"\
  ,\"perimeter\",\"area\"]\n```\n\n如你所见，每个属性的键以字符串的形式列在返回的数组中。\n\n`Object.values()`\
  \ 方法的作用相同，但它返回的是每个属性值的数组：\n\n```\nObject.values(rectangle);\n<< [4,5, perimeter(),\
  \ area()]\n```\n\n数组中的每个值都与其原始数据类型相同——在此例中为数字和函数。\n\n`Object.entries()` 方法返回一个包含键值对的数组。这些键值对以子数组的形式嵌套在数组内部：\n\
  \n```\nObject.entries(rectangle);\n<< [[\"height\",4],[\"length\",5],[\"perimeter\"\
  ,function()],[\"area\",function()]]\n```\n\n由于这些方法返回的是数组，我们可以使用链式调用来立即调用在本章前面介绍过的某个迭代方法。例如，我们可以使用\
  \ `forEach()` 方法将属性及其值打印到控制台：\n\n```\nObject.entries(rectangle).forEach(subArray\
  \ =>console.log(`${subArray[0]}: ${subArray[1]}`));\n<< \"height: 4\"\n   \"length:\
  \ 5\"\n   \"perimeter: function perimeter() {return 2 * (this.height + this.length);}\"\
  \n   \"area: function area() {return this.length * this.height;}\"\n```\n\n这里使用一个名为\
  \ `subArray` 的参数来引用 `Object.entries` 数组中的每个子数组。然后我们使用索引符号来引用子数组中的每个项，因此 `subArray[0]`\
  \ 指属性名，而 `subArray[1]` 指属性值。这虽然可行，但这种使用索引的方法会让代码变得难以理解。\n\n我们可以通过在定义回调函数时显式地命名子数组中的每个项来提高可读性，如下所示：\n\
  \n```\nObject.entries(rectangle).forEach(([prop,value])=>console.log(`${prop}: ${value}`));\n\
  ```\n\n这允许我们将子数组中的第一个项引用为 `prop`，第二个项引用为 `value`，使得代码更具可读性。这种过程被称为**[解构](https://www.sitepoint.com/es6-destructuring-assignment/)**。\n\
  \n## 待事项项目\n\n在上一章中，我们使用事件生成了一个可以运行的待事项列表。这样做的问题在于，待办事项被直接添加到了网页上，从未存储在程序的任何地方。如果程序需要在任何时候知道待事项列表的状态，这就会成为问题。这个概念被称为**状态（state）**。\n\
  \n\n\n这段代码现在需要放在一个 `render` 函数中，该函数使用 `map` 将 `task` 数组中的每一项包裹在 `<li>` 标签中，将它们合并成一个\
  \ HTML 字符串，然后将其插入列表元素中。我们还会添加几行代码来清空输入字段的内容并获取焦点：\n\n```javascript\nfunction render(){\n\
  \  list.innerHTML = tasks.map(task => `<li>${task}</li>>`).join('');\n  form.item.value\
  \ = '';\n  form.item.focus();\n}\n```\n\n最后，我们需要在每次更新数组时调用 `render` 函数——即在调用 `addTask`\
  \ 或 `removeTask` 函数之后。更新这些函数，让它们在更新数组后调用 `render`：\n\n```javascript\nfunction addTask(e){\n\
  \  e.preventDefault();\n  tasks.push(form.item.value);\n  render();\n}\n\nfunction\
  \ removeTask(e){\n  const index = tasks.indexOf(e.target.textContent);\n  if(index>-1){\n\
  \    tasks.splice(i,1);\n  }\n  render();\n}\n```\n\n现在，如果你尝试添加任务，它们应该出现在列表中，点击某个任务将将其删除。这与之前的操作没有区别，但变化的地方全在后台：我们现在现在可以通过访问\
  \ `tasks` 数组来跟踪程序内部创建的所有任务。这意味着我们可以通过查看 `tasks.length()` 方法的返回值，来跟踪还有多少任务需要完成。让我们添加一些代码，在任务列表下方显示这些内容。首先，在\
  \ HTML 部分底部添加一个空的 `<div>` 元素：\n\n```html\n<div id='count'></div>\n```\n\n我们还需要在\
  \ JS 部分添加对该元素的引用：\n\n```javascript\nconst count = document.getElementById('count');\n\
  ```\n\n接下来，在 `render` 函数中添加以下行代码，以便它包含一行用于更新 `count` div 的代码：\n\n```javascript\n\
  count.textContent = `${tasks.length} task${tasks.length==1?'':'s'} left to complete.`\n\
  ```\n\n这使用了模板字面量（template literal）来根据任务数量更新 `textContent` 属性，并使用了三元运算符，在列表中仅有一个任务时使用“task”而不是“tasks”。\n\
  \n尝试添加和删除一些任务。你应该能看到计数器随着它们在列表中出现而更新。\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/poNwvRq)。\n\
  \n## 挑战\n\n1. 编写一个函数，接受字符串数组作为参数，并使用 `map` 返回一个所有单词都写为大写的新数组。你能让它返回一个所有单词都倒序的数组吗？你可以查看[我在\
  \ CodePen 上的代码](https://codepen.io/SitePoint/pen/jOVwEBQ)。\n\n2. 编写一个 `spanner`\
  \ 函数，接受一个字符串并返回一个字符串，使用 `map()` 和 `join()` 方法将每个单独字符包裹在 `<span>` 标签中。例如，`spanner('Hello')`\
  \ 应该返回字符串 `\"<<span>H</span><span>e</span><span>l</span><span>l</span><span>o</span\"\
  `。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/LYbLEyZ)。\n\n3. 扩展你在挑战\
  \ 2 中创建的 `spanner` 函数，创建一个 `coloredLetters` 函数，为每个字母涂上不同的颜色。它应该接受字符串和颜色数组作为参数，然后为每个\
  \ `<span>` 标签添加 `style` 属性。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/KKNBVjO)。\n\
  \n## 总结\n\n* 展开运算符（spread operator）可以应用于字符串，将其展开为包含每个字符作为单独条目的的数组。\n* 迭代方法（Iteration\
  \ methods）遍历集合中的每一个值，并对每个值应用某种操作。\n* JavaScript 拥有许多数组方法，可以对数组中的每项应用回调函数。\n* `forEach()`\
  \ 方法对数组中的每项应用回调函数中的代码。\n* `map()` 方法通过对数组中的每项应用回调函数中的代码来返回一个新数组。\n* `reduce()` 方法通过将回调函数中定义的累加函数应用到数组中的每个值来返回一个单一值——例如，相加数组中的所有值。\n\
  * `filter()` 方法返回一个新数组，其中仅包含原始数组中符合回调函数定义标准的值。\n* `find()` 方法返回数组中第一个符合回调函数给定标准的项。\n\
  * `every()` 方法如果数组中的每一项都符合回调函数给定的标准，则返回 `true`。否则，返回 `false`。\n* `some()` 方法如果数组中的任何一个项符合回调函数给定的标准，则返回\
  \ `true`。如果数组中没有项符合该标准，则返回 `false`。\n* 你可以使用 for–in 循环遍历对象，这将让你能够访问对象中的每个属性。\n*\
  \ `Object.keys()`、`Object.values()` 和 `Object.entries()` 方法将分别返回对象的键、值或键值值对的数组。\n\
  \n在下一章中，我们将开始学习函数式编程。\n\n# 第 13 章：让我们变得函数化\n\n我们涵盖了[函数](https://www.w3schools.com/js/js_functions.asp)，但现在是时候深入探讨这些主题了：\n\
  \n* 命名参数\n* 剩余运算符\n* 变量提升\n* 递归函数\n* 闭包\n* 函数式编程\n* 纯函数\n\n## 命名参数\n\n当一个函数有许多参数时，很难记住编写参数的顺序。例如，考虑这个返回样式化\
  \ `<h1>` 元素的函数：\n\n```javascript\nfunction heading(text,color,size,bgcolor){\n \
  \ return `<h1 style='color:${color};background-color:${bgcolor};font-size:${size}>${text}</1>`\n\
  }\n```\n\n这使用了位置参数，这意味着当调用函数时，参数的位置决定了它被赋值给哪个参数。所以，如果你想要一个内容为“Hello, World!”、大小为\
  \ 48px、红色背景的标题，你会写：\n\n```javascript\nheading('Hello, World!','red','48px','blue');\n\
  ```\n\n在调用函数时可能很难记住这些参数的顺序，这可能会导致颜色混乱，甚至糟糕地给字体大小赋值红色！\n\n许多语言使用命名参数来解决这个问题。通过这些参数，你可以通过名称为每个参数赋值，而不是依赖它的位置。这意味着参数可以按任何顺序列出，如下：\n\
  \n```javascript\nheading(color = 'red',bgcolor = 'blue',text ='Hello, World!',size\
  \ = '48px');\n```\n\n遗憾的是，JavaScript 严格来说并不支持命名参数——所以上面的示例无法运行。好消息是，可以通过使用对象作为参数来模拟它们，让对象的属性充当命名参数的作用。\n\
  \n下面的示例展示了如何通过上面的示例实现这一点。函数需要重写，将参数列为对象字面量的属性：\n\n```javascript\nfunction heading({text,color,size,bgcolor}){\n\
  \  return `<h1 style='color:${color};background-color:${bgcolor};font-size:${size}>${text}</1>`\n\
  }\n```\n\n现在可以调用函数了，提供一个对象作为参数，为命名属性提供值：\n\n```javascript\nheading({color: 'red',bgcolor:\
  \ 'blue',text:'Hello, World!',size: '48px'});\n```\n\n注意，参数对象中属性的顺序与作为参数提供的对象中的顺序并不相同。这种方法的优点是不需要记住编写参数的顺序。另一个优点是它让代码更易读，因为每个参数都有一个描述性的标签来解释它代表什么。\n\
  \n这种技术在函数有大量参数时非常有用，特别是当其中一些参数是可选的。\n\n\n\n\n你可以在 [CodePen 上查看此示例](https://codepen.io/SitePoint/pen/NWbgBGN)。\n\
  \n## 剩余参数 (Rest Parameter)\n\n有时我们并不知道会向函数提供多少参数。处理变数量参数最简单的方法是使用`剩余参数`（rest parameter）。它由放置在函数声明中最后一个参数前面的三个三个点组成。它会将所有参数收集到一个数组中。\n\
  \n尝试在控制台中输入以下函数。该函数接受任意数量的参数，并使用剩余参数将它们全部收集到一个名为 `numbers` 的数组中。然后，它将我们在上一节中见过的\
  \ `reduce()` 方法应用于该数组上，并返回作为参数输入的所有数字之和：\n\n```\nfunction add(...numbers){\n  return\
  \ numbers.reduce((acc,n) => acc + n);\n}\n```\n\n现在尝试用不同数量的参数调用该函数，如下例所示：\n\n```\n\
  add(2,3);\n<< 5\n\nadd(1,2,3,4,5);\n<< 15\n```\n\n## 递归函数 (Recursive Functions)\n\
  \n`递归函数`是指调用自身的函数！这听起来可能有点疯狂，但在函数体内部放置一个自引用函数调用是完全可能的。函数会不断调用自己，直到满足特定条件。在涉及迭代过程时，它是一个非常有用的工具。\n\
  \n一个常见的例子是计算数字[阶乘](http://en.wikipedia.org/wiki/Factorial)的函数：\n\n``` evenfunction\
  \ factorial(n) {\n  if (n === 0) {\n    return 1;\n  } else {\n    return n * factorial(n\
  \ - 1);\n  }\n}\n```\n\n如果提供的参数为 0，该函数返回 1（0 的阶乘为 1），否则它会将参数与使用减 1 参数调用自身的结果相乘。该函数将继续调用自己，直到最终返回参数\
  \ 0 和 1。观察发生过程的最佳方法是使用示例：\n\n```\nfactorial(3);\n<< 6\n```\n\n这将把 3 乘以 `factorial(2)`\
  \ 的返回值，`factorial(2)` 又会将 2 乘以 `factorial(1)` 的返回值，`factorial(1)` 又会将 1 乘以 `factorial(0)`\
  \ 的返回值，而后者是 1。反向推导得出 `1 * 1 * 2 * 3`。这可以通过下面的图看到：\n\n![递归阶乘函数调用](img/recursive.png)\n\
  \n递归函数可以用于类似于我们在第 7 章中看到的循环执行的操作。它们在实现[分治算法](https://en.wikipedia.org/wiki/Divide-and-conquer_algorithm)\
  \ 时特别有用。你可以在“[函数式 JavaScript 中的递归](https://www.sitepoint.com/recursion-functional-javascript/)”中阅读更多关于递归函数的知识。\n\
  \n## 作用域 (Scope)\n\n变量“作用域”的概念在任何编程语言中都非常重要。变量或函数的`作用域`指的是程序可以访问它们的部分。大多数语言都有某种形式的`词法作用域`（lexical\
  \ scope），这意味着变量的作用域取决于它在代码中出现的位置。通常将变量放在块内部会将其作用域限制在该范围内。少数语言（如 Perl 和其他 Lisp 风格语言）使用`动态作用域`（dynamic\
  \ scope），这意味着变量的作用域可以在程序运行时发生变化。\n\n`全局作用域`（Global scope）涵盖整个程序。任何可以在程序任何地方访问的变量或函数都被认为具有全局作用域。\n\
  \n`局部作用域`（Local scope）指的是仅在特定代码块内可函数或变量。定义在块内部的任何函数或变量只能在那个特定块内被“在作用范围内”时被访问。\n\n\
  为了演示这一点，让我们尝试在控制台中定义一些变量。首先，通过直接在程序主体中定义来定义全局作用域中的变量：\n\n```\nconst global = 'Hello,\
  \ Global Scope!';\n```\n\n现在，我们可以通过创建一个名为 `local` 的函数来创建一个局部作用域。在函数体内部，我们将声明一个名为\
  \ `secret` 的变量：\n\n```\nfunction local(){\n  const secret = 'Hello from the local\
  \ scope.';\n}\n```\n\n下面的图显示了每个变量的作用域。`global` 定义在全局作用域中，可以在作用域内的任何地方访问（包括从局部作用域内部）。`secret`\
  \ 定义在 `local` 函数的局部作用域内，只能从该作用域内部访问。\n\n![全局和局部作用域](img/scope.png)\n\n如果我们尝试向控制台打印变量\
  \ `global` 的值，可以看到我们可以访问它：\n\n```\nconsole.log(global);\n<< Hello, Global Scope!\n\
  ```\n\n然而，如果我们尝试访问变量 `secret`，我们会得到一个错误信息，说无法找到它：\n\n```\nconsole.log(secret);\n\
  << ReferenceError: \"Can't find variable secret\"\n```\n\n这是因为变量 `secret` 只有在 `local`\
  \ 函数体内部可用。最后一个命令是从全局作用域发出的，在那里我们无法访问函数的局部作用域。\n\n为了看到我们可以在 `local` 函数的作用域内访问变量 `secret`，让我们重新定义函数，将\
  \ `secret` 变量打印到控制台：\n\n```\nfunction local(){\n  const secret = 'Hello from the\
  \ local scope.';\n  console.log(secret);\n}\n```\n\n现在，如果我们调用 `local` 函数，可以看到它可以访问该变量：\n\
  \n```\nlocal();\n<< Hello from the local scope.\n```\n\n然而，我们只能在块内部访问该变量。\n\n尽管将所有内容放在全局作用域似乎是个好主意，但实际上这被认为是不习惯。事实上，将变量排除在全局作用域之外是良好的做法。这是为了避免`命名冲突`（naming\
  \ collisions），即变量或函数重名导致混淆。这在目前看起来不是问题，但当你与他人代码协作时（作为团队的一部分或使用外部代码库），就会变成一个大问题，因为你不知道哪些变量名已被占用。通过将变量和函数放在各自的作用域内，我们可以更容易追踪它们。\n\
  \n### 块作用域 (Block Scope)\n\nJavaScript 中的所有变量在函数内部都是局部作用域，但变量只有在使用 `const` 和 `let`\
  \ 时才具有块作用域。如果使用 `var` 可以在定义的块之外访问。\n\n如果你尝试在控制台中输入以下代码，它将无法工作，因为变量 `message` 只有块级作用域，因此无法在大括号之外访问：\n\
  \n```\nif(name===\"JavaScript\"){\n  const message = \"Hello ${name}!\";\n}\nconsole.log(message);\n\
  << ReferenceError: \"Can't find variable: message\"\n```\n\n如果用 `var` 代替 `const`，这段代码将无错误运行。或者可以将\
  \ `console.log(message)` 放在块内部。\n\n## 提升 (Hoisting)\n\n使用函数声明定义的函数会自动`提升`到程序作用域的顶部。这意味着它们可以在定义之前被调用。例如，在以下代码中，`hoist()`\
  \ 可以在实际定义之前被调用：\n\n```\n// 在代码开始处调用函数\nhoist();\n\n// ...\n// ... 这里有更多代码\n// ...\n\
  \n// 函数定义在代码末尾\nfunction hoist(){\n  console.log('Hoist Me!');\n\n}\n```\n\n这非常有用，这意味着所有的函数定义可以放在一起（可能放在程序的末尾），而不是要求每个函数在使用之前都必须定义。\n\
  \n如果在使用 `const` 和 `let` 声明之前尝试引用变量，将抛出异常。因此，你应该尝试在块的开头声明任何变量，这样就不需要提升了。\n\n\n\n\n\
  这意味着函数表达式（即将匿名函数赋值给变量）在声明之前不能被调用，这与函数声明不同。\n\n这也许是函数声明和函数表达式之间最大的区别，它可能会影响你关于使用哪种方式的决定。有些人喜欢使用函数表达式意味着你被要求在使用它们之前定义所有函数并将它们赋值给变量，而另一些人则更倾向于有权将所有函数以函数声明的形式统一放在一个地方。你可以在“[快速贴士：函数表达式\
  \ vs 函数声明](https://www.sitepoint.com/function-expressions-vs-declarations/)”中阅读更多关于这些差异的内容。\n\
  \n## 返回函数的函数\n\n我们已经看到函数可以接受另一个函数作为参数（回调），但它们也可以*返回*另一个函数。\n\n下面的示例显示了一个名为 `returnHello()`\
  \ 的函数，它返回一个打印“Hello, World!”的函数：\n\n```\nfunction returnHello() {\n  return function()\
  \ {\n    console.log('Hello, World!');\n  }\n}\n```\n\n当调用 `returnHello()` 函数时，它做的仅仅是返回另一个函数：\n\
  \n```\nreturnHello()\n\n<< function returnHello() {\n     return function() {\n\
  \       console.log('Hello World!');\n    }\n\n   }\n```\n\n或者，可以使用箭头函数让声明看起来更整洁（尽管更难看出发生了什么）：\n\
  \n```\nreturnHello = () => () => console.log('Hello, World!');\n```\n\n第一个箭头之后的表达式是它的返回值，即另一个箭头函数：`()\
  \ => console.log('Hello, World!')`。因此，当调用 `returnHello` 时，它返回了这个函数。\n\n为了使用这个返回的函数，我们需要将其赋值给一个变量：\n\
  \n```\nconst hello = returnHello();\n```\n\n现在我们可以通过在赋值的变量后加上括号来调用这个返回的函数：\n\n```\n\
  hello();\n<< Hello, World!\n```\n\n这看起来可能有点没意义，但让我们更进一步，使用这种技术创建一个通用函数，该函数返回另一个函数，用于根据作为参数提供的特定标签创建\
  \ HTML 片段：\n\n```\nconst html = tag => text => `<${tag}>${text}</${tag}>`\n```\n\
  \n我们现在使用这个函数来创建一个创建 `<h1>` 元素的函数：\n\n```\nconst h1El = html('h1');\n<< text => `<${tag}>${text}</${tag}>`\n\
  ```\n\n现在这个函数可以被用来返回一些标题字符串：\n\n```\nh1El('Hello, World!');\n<< \"<h1>Hello, World!</h1>\"\
  \n```\n\n如果我们还想要一个创建段落的函数，可以使用通用的 `element` 函数来为我们返回一个：\n\n```\nparaEl = element('p');\n\
  << text => `<${tag}>${text}</${tag}>`\n```\n\n然后我们使用这个函数来创建一个段落片段：\n\n```\nparaEl('The\
  \ quick, brown fox jumped over the lazy dog.');\n<< \"<p>The quick, brown fox jumped\
  \ over the lazy dog.</p>\"\n```\n\n我们还可以将两个函数调用链在一起，创建一个函数并在单次调用中使用它：\n\n```\nhtml('h2')('Hello,\
  \ World!');\n<< \"<h2>Hello, World!</h2>\"\n```\n\n## 闭包\n\n闭包是 JavaScript 最强大的功能之一，它们依赖于作用域的概念以及函数返回其他函数的机制。\n\
  \n为了演示这个概念，让我们回到在本节之前讨论作用域概念时看到的这个函数：\n\n```\nfunction local(){\n  const secret\
  \ = 'Top Secret!';\n  console.log(secret);\n} \n```\n\n这个函数包含一个名为 `secret` 的变量，正如我们所见，它只存在于函数的作用域内。\n\
  \n当一个函数可以访问在其作用域之外定义的变量时，就形成了**闭包**。在我们的示例中，我们可以添加一个引用 `secret` 变量的匿名函数：\n\n```javascript\n\
  function local() {\nconst secret = 'Top Secret!';\nfunction () {\n    console.log(secret);\n\
  \  }\n}\n```\n\n匿名函数被认为对 `secret` 变量形成了“闭包”，因为尽管变量没有在函数体内定义，但函数仍然可以访问它。这本身并不特殊，因为我们已经可以在\
  \ `local` 函数内部访问 `secret` 变量了。\n\n然而，如果我们*返回*这个匿名函数，我们就能*保留*在 `local` 函数作用域之外对 `secret`\
  \ 变量的访问：\n\n```javascript\nfunction local() {\n\nconst secret = 'Top Secret!';\n\
  return function () {\n    console.log(secret);\n  }\n}\n```\n\n返回的函数即使在 `local`\
  \ 函数被调用后，仍将保留对 `secret` 变量的访问。这就形成了对 `secret` 变量的*闭包*。\n\n为了使用闭包，我们需要将 `local()`\
  \ 函数的返回值赋值给变量：\n\n```javascript\nconst notSoSecret = local(); \n```\n\n变量 `notSoSecret`\
  \ 现在指向 `local()` 函数返回的匿名函数。该函数现在可以访问在 `local` 函数中定义的但在该函数作用域之外的 `secret` 变量。我们可以调用\
  \ `notSoSecret` 函数来验证这一点：\n\n```javascript\nnotSoSecret();\n<< \"Top Secret!\"\n\
  ```\n\n得益于闭包，我们现在可以访问 `secret` 变量。下图显示了闭包的工作原理：\n\n![闭包的工作原理](img/closure.png)\n\
  \n### 闭包计数\n\n闭包不仅可以访问父函数作用域中的变量，还可以修改这些变量的值。这允许我们创建一个每次调用都会递减的计数函数。在控制台中输入以下代码：\n\
  \n```javascript\nfunction countdown(start){\n  let i = start;\n  return function()\
  \ {\n    return i--;\n  }\n}\n```\n\n我们可以通过将返回值赋值给变量来创建一个计数器：\n\n```javascript\n\
  const count = countdown(3);\n\ncount();\n<< 3\n\ncount();\n<< 2\n\ncount();\n<<\
  \ 1\n```\n\n## 函数式编程\n\n**函数式编程**是一种近年来非常流行的编程风格，部分归功于纯函数语言，如 [Clojure](https://clojure.org)、[Scala](https://www.scala-lang.org)\
  \ 和 [Erlang](https://www.erlang.org)。JavaScript 一直支持函数式编程，因为函数是一等对象。我们在本章涵盖的技术——例如将匿名函数作为参数、向其他函数返回值以及创建闭包——都是函数式编程的基础元素。\n\
  \n### 纯函数\n\n函数式编程的一个关键方面是使用纯函数。**纯函数**是指遵循以下规则的函数：\n\n*   纯函数的返回值仅取决于作为参数提供的值；它不依赖于程序其他地方的值。\n\
  *   没有副作用：纯函数不会改变程序中其他地方的值或数据。它只进行非破坏的数据转换并返回新值，而不是修改任何底层数据。\n*   纯函数具有引用透明性。给定相同的参数，它将总是返回相同的结果。\n\
  \n为了遵循这些规则，任何纯函数必须具备：\n\n\n\n\n*   至少有一个参数：否则，返回值将依赖于 `function` 参数以外的其他内容，这将违反第一条规则。\n\
  *   一个返回值：否则，这个 `function` 就没有意义了（除非它改变了程序中的其他内容，在这种情况下，它就违反了“无副作用”规则）。\n\n纯函数有助于函数式编程代码比其他编程风格更加简洁且更具可预测性。引用透明性（Referential\
  \ transparency）使得纯函数易于测试，因为在提供相同参数时，可以依赖它们返回相同的值。另一个益处是，任何返回值都可以保存在内存中，因为它们总是相同的，这使得函数更高效。没有任何副作用往往会减少代码中出现的\
  \ Bug 数量，因为没有意外的依赖关系。纯函数仅依赖于作为参数提供的任何值。\n\n让我们来看看如何*不应该*编写纯函数。接下来的示例展示了一个不纯的函数，它返回两个两个值相加的结果：\n\
  \n```\nlet number = 42;\n\nlet result = 0;\n\nfunction impureAdd(x) {\n  result\
  \ = number + x;\n}\n\nimpureAdd(10);\nresult;\n\n<< 52\n```\n\n`impureAdd()` 函数是一个不纯的函数，因为它违反了上述规则。它需要定义在函数外部的\
  \ `number` 值。它具有改变 `result` 值（同样定义在程序外部）的副作用，并且如果变量 `number` 的值不同，它将返回不同的值。\n\n\
  这里有一个实现相同结果的纯函数示例：\n\n```\nconst number = 42;\n\nfunction pureAdd(x,y) {\n  return\
  \ x + y;\n}\n\nresult = pureAdd(number,10);\n\n<< 52\n```\n\n`pureAdd` 函数需要两个参数相加，因此变量\
  \ `number` 必须作为参数传递给它。这是一个非破坏性数据转换的示例，因为在变量 `number` 作为参数传递通过函数后，其存储的值保持不变。该函数没有副作用；它只是简单返回两个数字相加的结果。然后将此返回值赋值给变量\
  \ `result`，而不是由函数直接更新变量的值。该函数在给定相同输入时，也始终始终返回相同的值。\n\n### `const` 的用处\n\n使用 `const`\
  \ 声明变量将有助于避免破坏性数据转换，因为任何原始值都无法被更改（尽管使用 `const` 赋值给数组或对象的变量仍然可以被修改，所以这并不是完美的解决方案）。\n\
  \n函数式编程将纯函数作为程序的构建模块。这些函数执行了一系列操作，而不改变程序中的任何底层数据。每个函数形成一个抽象，应该执行单一任务，同时将其实现细节封装在函数体内部。这意味着程序变成了一系列基于纯函数返回值的表达式。重点在于使用函数组合（function\
  \ composition）将多个纯函数组合在一起，以完成更复杂的任务。\n\n你可以在“[函数组合：构建可维护代码的基石](https://www.sitepoint.com/function-composition-building-blocks-for-maintainable-code/)”中阅读更多关于函数组合的知识。\n\
  \n## 纯数组更新\n\n在本书的之前的章节中，我们使用 `push()` 方法向数组添加值。例如，我们的待办事项列表应用包含以下 `addTask` 函数：\n\
  \n```\nfunction addTask(item){\n  list.push(item);\n} \n```\n\n有几点使得这是一个不纯的函数。它依赖于函数体外部的变量\
  \ `list`，并且 `push()` 方法是一种破坏性转换，这意味着数组的值被改变了。\n\n我们可以通过将要添加项的数组作为参数来使此函数纯化。这样，函数就不会访问其作用范围之外的任何变量。我们还可以使用展开运算符（spread\
  \ operator）返回一个包含旧数组所有项并在末尾添加新项的新数组，如下所示：\n\n```\nfunction addTask(task,list){\n\
  \   return [...list,task];\n}\n```\n\n`removeTask` 函数也是不纯的：\n\n```\nfunction removeTask(task){\n\
  \  const index = list.indexOf(task);\n  if(index>-1){\n    list.splice(i,1);\n \
  \ }\n   return list;\n\n}\n```\n\n这是因为我们的代码再次引用了函数外部的 `list` 变量，并且 `splice()` 方法正在修改\
  \ `list` 数组（也就是说，它正在对其进行永久性更改）。我们可以通过将 `list` 作为参数并改用 `filter()` 方法来删除项来修复这个问题：\n\
  \n```\nfunction removeTask(task,list){\n  return list.filter(x => x !== task);\n\
  }\n```\n\n这将返回一个包含所有与作为参数提供的项不同的任务的数组，从而有效地从数组中删除了任务。\n\n为了测试这些内容，让我们在控制台中创建一个简短的任务列表：\n\
  \n```\nlet tasks = ['Bake cake','Read book','Sing song'];\n```\n\n确保你已经在控制台中或 CodePen\
  \ 的 `JS` 区域定义了这些新的纯函数，然后尝试在控制台中输入以下代码：\n\n```\nfunction addTask(task,list){\n  \
  \ return [...list,task];\n}\n\nfunction removeTask(task,list){\n  return list.filter(x\
  \ => x !== task);\n}\n```\n\n现在让我们通过向 `tasks` 数组添加字符串 `'Learn to code'` 来测试 `addTask`\
  \ 函数：\n\n```\naddTask('Learn to code',tasks);\n<< [\"Bake cake\",\"Read book\",\"\
  Sing song\",\"Learn to code\"]\n```\n\n你可以看到，函数返回了一个带有 `'Learn to code'` 的数组。但并没有改变\
  \ `tasks` 变量的值，正如检查它的值所示：\n\n```\ntasks;\n```\n\n现在让我们检查 `removeTask` 函数是否有效：\n\n\
  ```\nremoveTask('Read book',tasks);\n<< [\"Bake cake\",\"Sing song\"]\n```\n\n这返回了一个不包含\
  \ `'Read book'` 的新数组。再次，`tasks` 变量没有被改变：\n\n```\ntasks;\n<< [\"Bake cake\",\"Sing\
  \ song\"]\n```\n\n### 使用纯函数更新数组值\n\n如果你确实想更新 `tasks` 数组的值，你仍然可以使用纯函数来实现，只需将 `tasks`\
  \ 变量赋值为函数调用的返回值。\n\n例如，如果你想更新 `tasks` 数组以移除 `'Sing song'`，可以使用以下代码：\n\n```\ntasks\
  \ = removeTask('Sing song',tasks);\n<< [\"Bake cake\",\"Read book\"]\n```\n\n我们就可以确认这确实更新了\
  \ `tasks` 数组：\n\n```\ntasks;\n<< [\"Bake cake\",\"Read book\"]\n```\n\n### 高阶函数\n\
  \n高阶函数是指接受另一个函数作为参数，或者返回另一个函数作为结果，或者两者兼有的函数。\n\n闭包在高阶函数被广泛使用，因为允许我们创建一个通用函数，并根据其参数返回更具体的函数。这是通过对函数的参数创建一个闭包来实现的，使其在返回函数中保持“活跃”。例如，考虑以下\
  \ `multiplier` 函数：\n\n```\nfunction multiplier(x){\n  return function(y){\n    return\
  \ x*y;\n  }\n}\n```\n\n`multiplier` 函数返回另一个函数，该函数在闭包中捕获了参数 `x` 的值。这供返回函数使用。\n\n\
  现在我们可以使用这个通用的 `multiplier` 函数来创建更具体的函数，如下例所示：\n\n```\ndoubler = multiplier(2);\n\
  ```\n\n这创建了一个名为 `doubler` 的新函数，它将参数乘以二：\n\n```\ndoubler(10);\n<< 20\n```\n\n\n\n\
  \n\n`multiplier()` 函数是一个高阶函数的示例。这意味着我们可以通过使用不同的参数来用它构建其他更具体的函数。例如，可以使用参数 `3` 来创建一个\
  \ `tripler()` 函数，该函数将将其参数乘以 3：\n\n```\ntripler = multiplier(3);\n\ntripler(10);\n\
  << 30\n```\n\n这是函数式编程的核心原则之一：它允许使用通用的高阶函数根据特定参数返回更具体的函数。\n\n使用高阶函数时的一个巧妙技巧是将参数链式连接。接下来的示例将\
  \ 3 和 5 相乘：\n\n```\nmultiplier(3)(5);\n<< 15\n```\n\n这之所以能通，是因为 `multiplier(3)`\
  \ 返回了一个匿名函数，而我们通过在末尾添加括号，立即使用 `5` 作为参数调用了它。\n\n## 挑战\n\n1. 编写一个递归函数，演唱我们在第 7 章中通过各种循环编写的《十个绿瓶子》歌曲。它应该接受瓶子的数量作为参数，唱一段，然后自己调用自己再次演唱。例如，`greenBottles(10)`\
  \ 将从 10 个绿瓶子开始演唱。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/LYbLgLO)。\n\
  2. 创建一个名为 `exponent` 的高阶函数，它返回另一个函数，该函数将计算提供参数的幂。例如，`exponentBase2 = exponent(2)`\
  \ 应该产生一个名为 `exponentBase2` 的函数，该函数将返回提供参数的幂，因此 `exponentBase2(3)` 将返回 8。你应该能够编写\
  \ `exponent(2)(3)` 并同样得到 8。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/NWbgOgZ)。\n\
  3. 更新待事项应用，使 `add` 和 `remove` 函数成为纯函数。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/ExNXdvW)。\n\
  \n## 总结\n\n- 命名参数可以在 JavaScript 中使用对象作为参数来重现。这允许以任何顺序作为对象的属性提供参数。\n- 剩余参数（rest parameter）允许以数组的形式向函数提供任意数量的值。\n\
  - 递归函数是不断调用自身直到达到特定条件的函数。\n- 变量的作用域决定了该变量可以在哪里以及如何被访问。\n- 使用 `function` 关键字声明的函数会被“提升”（hoisted）到作用域顶部，这意味着即使在定义之前也可以调用它们。\n\
  - 变量应该在被引用之前声明。\n- 当函数访问一个在函数周围作用域声明的变量时，就形成了闭包（closure）。通过返回函数，我们可以保持对声明作用域之外变量的访问。\n\
  - 函数式编程是一种编程风格，它结合了执行单一任务的纯函数来执行更复杂的任务。\n- 纯函数不应该引用函数作用域之外的未作为参数提供的任何内容，并且不应该通过改变函数作用域之外的任何内容来产生副作用。它们应该具有`引用透明性`（referential\
  \ transparency），这意味着在给定相同的情况下，它们应该返回相同的值。\n- 高阶函数接受函数作为参数并返回函数。它们可以链式连接以完成更复杂的操作。\n\
  \n在下一章中，我们将深入研究对象和面向对象的编程。\n\n# 第 14 章：走向类（Getting Classy）\n\n我们首次在第 9 章中遇到对象。在本章中，我们将更深入地研究面向对象编程以及如何使用\
  \ JavaScript 创建类。我们将涵盖以下主题：\n\n- 在 JavaScript 中复制对象\n- 面向对象编程\n- 封装\n- 多态\n- 继承\n\
  - JavaScript 中的类\n- extends\n- 一个宠物独角兽（Pet Unicorn）项目\n\n## 在 JavaScript 中复制对象\n\
  \nJavaScript 中的一个重要概念是对象是通过引用（`reference`）赋值的。这意味着如果两个变量被赋值为同一个对象，那么两个变量将指向内存中的同一个对象。\n\
  \n例如，假设你正在创建一个天气应用，变量 `monday` 指向一个晴天的图像对象。如果你使用代码 `const tuesday = monday` 将变量\
  \ `tuesday` 赋值给同一个图像对象，两个变量都将指向同一个图像对象，如下图所示。\n\n![通过引用复制](img/copybyref.png)\n\n\
  如果你更新了 `tuesday` 指向的图像对象，它也会改变 `monday` 指向的图像对象，如下图所示，其中 `tuesday` 被改变为了雨天的图像对象。\n\
  \n![通过引用更新](img/updatebyref.png)\n\n这意味着你对`任意`变量的任何更改都会影响另一个，这使得在不改变 `tuesday` 的情况下无法改变\
  \ `monday`。\n\n为了演示可能导致的问题，让我们创建一些对象来模拟[金发小姑娘的故事](https://en.wikipedia.org/wiki/Goldilocks_and_the_Three_Bears)中的三只熊。\n\
  \n### 控制台问题\n\n在编写时，jsonsole.com 不支持此示例使用的某些代码。出于此原因，我建议使用 CodePen 上的控制台。（它位于 CodePen\
  \ 界面的左下角。）\n\n首先，让我们创建一个描述爸爸熊的对象并将其赋值给变量 `papa`，在控制台中：\n\n```\nconst papa = {\n\
  \  name: 'Papa Bear',\n  type: 'bear',\n  color: 'brown',\n  food: 'porridge',\n\
  \  size: 'large'\n};\n```\n\n现在，如果我们创建一个代表妈妈熊的对象，可以从 `papa` 对象的副本开始，因为许多属性是相同的。我们可以更新需要更改的属性。\n\
  \n一个常见的错误是认为可以这样制作 `papa` 对象的副本：\n\n```\nconst mama = papa;\n```\n\n变量 `mama` 将拥有与\
  \ `papa` 对象相同属性。问题在于我们并没有真正复制 `papa` 对象；`mama` 和 `papa` 引用的是同一个对象！\n\n当我们尝试修改 `mama`\
  \ 的 `name` 属性时，可以看到这一点：\n\n```\nmama.name = 'Mama Bear';\n```\n\n现在，如果我们检查 `papa`\
  \ 对象的 `name` 属性值，我们会发现一个问题：\n\n```\npapa.name;\n<< 'Mama Bear'\n```\n\n更改 `mama`\
  \ 的 `name` 属性导致 `papa` 的 `name` 属性也发生了变化。这是因为 `mama` 和 `papa` 指向内存中的同一个对象。对任意变量的任何更改都会影响另一个。\n\
  \n此问题的解决方法是对想要复制的对象应用扩展运算符。你需要重启控制台并重新定义 `papa` 对象，然后输入以下代码来制作 `papa` 对象的副本：\n\n\
  ```\nconst mama = {...papa}\n```\n\n这创建了一个全新的对象字面量并将 `papa` 对象的属性展开在内部。这意味着变量 `mama`\
  \ 指向内存中一个全新的对象。对其进行的任何更改都不会影响 `papa` 对象，正如我们更新 `name` 和 `size` 属性时所示：\n\n```\nmama.name\
  \ = 'Mama Bear';\n<< \"Mama Bear\"\n\nmama.size = 'medium';\n<< \"medium\"\n```\n\
  \n现在，如果我们观察这两个对象，可以看到 `mama` 对象已经更新了，但 `papa` 对象没有变化：\n\n```\npapa;\n<< { \n  name:\
  \ 'Papa Bear',\n  type: 'bear', \n  color: 'brown',\n  food: 'porridge',\n  size:\
  \ 'large'\n}\n\nmama;\n<<\n{ \n  name: 'Mama Bear'\n  type: 'bear', \n  color: 'brown',\n\
  \  food: 'porridge',\n  size: 'medium'\n}\n```\n\n### 浅拷贝与深拷贝\n\n\n\n\n上面的代码对 `papa`\
  \ 对象进行了 `shallow`（浅）拷贝。这意味着只有第一层属性被复制了。如果任何属性包含嵌套对象，这些对象将仍然通过引用进行复制。而 `deep`（深）拷贝涉及对\
  \ `every`（每一个）属性进行复制，包括嵌套对象。\n\n对对象进行深拷贝可能会很复杂，我建议使用经过良好测试的解决方案，例如 [Lodash 库](https://lodash.com)\
  \ 中的 [`_.cloneDeep`](https://lodash.com/docs/4.17.15#cloneDeep) 方法。\n\n通过在对象字面量的末尾添加新属性，可以一步完成复制对象并更新某些属性。让我们通过再次创建\
  \ `papa` 对象的副本来代表小熊（Baby Bear）：\n\n```javascript\nconst baby = {...papa, name: 'Baby\
  \ Bear', size: 'small'};\n```\n\n在这个示例中，我们复制了 `papa` 对象，然后在同一个对象中更新了 `name` 和 `size`\
  \ 属性。这之所以有效，是因为任何具有相同名称的属性将覆盖之前定义的属性。\n\n我们可以通过查看 `baby` 对象来检查此操作是否成功：\n\n```javascript\n\
  baby;\n<< { \n  name: 'Baby Bear'\n  type: 'bear', \n  color: 'brown',\n  food:\
  \ 'porridge',\n  size: 'small'\n}\n```\n\n正合适！\n\n## 复制数组和函数\n\n在 JavaScript 中，数组是特殊类型的对象，因此在使用数组时会发生相同的问题：它们是通过引用复制的，而使用扩展运算符只会进行浅拷贝。\n\
  \n函数也仅通过引用复制，因此对函数进行的任何更改都将影响对该函数的所有引用。\n\n## 面向对象编程\n\n`面向对象编程`（简称 OOP）是一种编程风格，它将相关的代码封装在对象中，这些对象在程序的生命周期内维持状态。然后对象就可以根据需要重用或轻松地修改。Java、C++、Ruby\
  \ 和 Python 等许多现代语言都是面向面向对象的。\n\nOOP 的三个核心概念是：\n\n* 封装\n* 多态\n* 继承\n\n我将以咖啡机为例，来说明这些概念如何被应用于编程环境中。在许多方面，咖啡机可以被看作一个对象，因为它具有速度、强度和容量等属性，它还具有可以执行的方法或动作，例如酿造、开启和关机。\n\
  \n### 封装\n\n当咖啡机开启时，它会发出一些声音，几分钟后，它会产出一杯热气腾腾的咖啡。你不需要知道机器是如何运作就能制作出完美的咖啡；你只需按下 `on`。这演示了`封装`的概念：内部原理被隐藏在对象内部，只向终端用户暴露基本功能，例如\
  \ `on` 按钮。在 OOP 中，这涉及将所有的编程逻辑保留在对象内部，并提供可用的方法来实现功能，而不需要外部世界知道 `how`（如何）实现的。\n\n\
  ![封装](img/encapsulation.png)\n\n### 多态\n\n`on` 按钮启动了咖啡机的酿造过程。如果存在啤酒机，它也会有一个启动酿造过程的\
  \ `on` 按钮。尽管两台机器都拥有一个名为“酿造”的过程，但该过程的结果非常不同：一个生产咖啡，另一个生产啤酒。这演示了`多态`的概念，即相同的过程在不同的对象中产生不同的结果。在\
  \ OOP 中，这意味着各种对象可以共享相同的方法，但以不同的方式实现它们。\n\n![多态](img/polymorphism.png)\n\n### 继承\n\
  \n想象一台超级咖啡机，它是一种新的改进型号，能够一次制作三杯咖啡。尽管它具有一些额外功能，但仍然使用了与原始咖啡机许多相同的零件。这演示了`继承`的概念，即获取一个对象的特征，然后添加新特征。在\
  \ OOP 中，这意味着我们可以取一个已经存在的对象并继承它所有的属性和方法。我们可以通过添加新的属性和方法来改进它的功能。\n\n![继承](img/inheritance.png)\n\
  \n## 类\n\n大多数面向对象的语言（如 Java 和 Ruby）使用类（classes）来定义对象的蓝图。对象随后作为该类的实例被创建，并继承类所有的属性和方法。在咖啡机的示例中，`CoffeeMachine`\
  \ 类代表设计，生产线上制造的每台机器以及任何其他型号的咖啡机都将该类的实例。\n\n### 类与原型\n\nJavaScript 最初并没有在语言中内置类。但它一直允许使用现有的对象字面量而不是类作为创建相似对象的蓝图。因此，它被称为一种`基于原型的`（prototype-based）语言。在咖啡机的示例中，这可能涉及构建一台真实的原型机，然后使用此原型作为制造所有其他机器的基础。JavaScript\
  \ 现在确实支持类，正如我们将在下一节看到的，但它在后台仍然使用相同的原型继承模型。\n\n### JavaScript 中的类\n\n在“对象”章节（第 9\
  \ 章）中，我们创建了所示的 `dice`（骰子）对象：\n\n```javascript\nconst dice = {\n  sides: 6,\n  roll()\
  \ {\n    return Math.ceil(Math.random()*this.sides)\n  }    \n}\n```\n\n想象你正在创建一个角色游戏，类似于[地下城与龙](https://en.wikipedia.org/wiki/Dungeons_%26_Dragons)。你需要许多不同面数的骰子。要创建这个类，在控制台输入以下代码：\n\
  \n```javascript\nclass Dice {\n  constructor(sides=6) {\n    this.sides = sides;\n\
  \  }\n\n  roll() {\n    return Math.ceil(Math.random()*this.sides);\n  }\n}\n```\n\
  \n#### 类命名\n\n按照惯例，类的声明名称通常大写。所有 JavaScript 类都有一个名为 `constructor` 的函数（如果你不显式编写它，它将在后台创建）。每当创建类的实例时，该函数都会被调用。\n\
  \n`this` 关键字代表由类返回的对象。在上面的 `Dice` 类中，我们使用它让 `sides` 属性等于传递给构造函数的参数，如果没有提供参数，则为 6。它还添加了一个名为\
  \ `roll()` 的方法，返回从 1 到骰子面数的随机数。\n\n我们现在可以使用 `new` 运算符创建一个 Dice 类实例：\n\n```javascript\n\
  redDice = new Dice();\n<< Dice {sides: 6}\n```\n\n这调用了 `Dice` 类中定义的 `constructor`\
  \ 函数，并返回一个赋值给变量 `redDice` 的对象，该对象被认为是 `Dice` 类的实例。这是一个具有 `sides` 属性和 `roll()` 方法的对象。\n\
  \n#### 类\n\n我们可以使用 `instanceof` 运算符来确认这一点：\n\n```javascript\nredDice instanceof\
  \ Dice;\n<< true\n```\n\n通过这种方式创建的新对象都具有类定义的 `sides` 属性和 `roll()` 方法，它们被称为 `Dice`\
  \ 类的实例。例如，我们可以使用以下代码创建一个四面体的蓝色骰子：\n\n```javascript\nblueDice = new Dice(4);\n<<\
  \ Dice {sides: 4}\n```\n\n#### 括号\n\n当使用 `new` 运算符实例化新对象时，括号不是必须的。以下代码也会达到相同的结果：\n\
  \n```javascript\ngreenDice = new Dice;\n<< Dice {sides: 6}\n```\n\n\n\n然而，如果提供了任何参数，则必须使用括号。例如，如果我们想创建一个另一个\
  \ 20 面的 `Dice` 对象，我们就必须将 20 作为参数添加，如下所示：\n\n```\nwhiteDice = new Dice(20);\n<< Dice\
  \ {sides: 20}\n```\n\n你可以在“[面向对象的 JavaScript：ES6 类的深度解析](https://www.sitepoint.com/object-oriented-javascript-deep-dive-es6-classes/)”中阅读更多关于\
  \ ES6 类的知识。\n\n## 类组件 (Classy Components)\n\n类的用途之一创建可复用的 HTML 组件。这允许你在单个类中定义一段\
  \ HTML 代码，然后在程序中多次复用它。\n\n例如，让我们创建一个名为 `Notice` 的类，并用它创建一个 `<div>` 元素，在网页上显示一条消息。\n\
  \n在 CodePen 上打开一个新的 Pen，并在 **JS** 部分中输入以下代码：\n\n```\nclass Notice {\n  constructor(message='Hello,\
  \ World!') {\n    this.element = document.createElement('div');\n     this.element.textContent\
  \ = message;\n     this.css = 'background:silver;border:3px gray solid;color:gray;font:18px\
  \ sans-serif;padding:8px;margin:10px';\n     this.element.style.cssText = this.css;\n\
  \  }\n\n  render(element) {\n     element.appendChild(this.element);\n  }\n}\n```\n\
  \n该类的 `constructor` 函数创建了一个 `<div>` 元素，然后将 `textContent` 属性设置为与 `message` 相同，`message`\
  \ 是创建新实例时作为参数提供的。它还使用 `style.cssText` 属性设置 CSS 属性，允许你在单个字符串中设置多个 CSS 属性。\n\n`Notice`\
  \ 类的每个实例都有一个 `render()` 方法，用于在页面上渲染元素。这使用了我们在 DOM 章节中看到的 `appendChild()` 方法（第 10\
  \ 章），将该元素追加到作为方法参数提供的元素中。\n\n让我们尝试测试这个类来创建一个 `Notice` 组件。在 **JS** 部分的底部添加以下代码行：\n\
  \n```\nwelcome = new Notice;\n```\n\n这创建了一个指向 `constructor` 函数返回的 `<div>` 元素的引用。我们现在可以使用它的\
  \ `render` 方法将其插入页面中。在 **JS** 部分的底部添加以下代码行：\n\n```\nwelcome.render(document.body);\n\
  ```\n\n这将把元素追加到文档的 body 中，看起来应该像这样：\n\n![Notice 组件类](img/Notice.png)\n\n你可以在 [CodePen\
  \ 上查看我的代码](https://codepen.io/SitePoint/pen/jOVLBKv)。\n\n## JavaScript 中的继承 (Inheritance\
  \ in JavaScript)\n\n现在我们已经有了用于创建通知组件的类，我们可以根据这个类创建一些不同类型的通知，但更具具体性。例如，我们可以创建 `Warning`、`Success`\
  \ 和 `Info` 通知，它们都基于我们在上一个节中创建的通用通知元素。\n\n我们可以使用继承的概念来确保我们的新通知继承 `Notice` 类的所有属性和方法。这意味着\
  \ `Warning`、`Success` 和 `Notice` 类将从父类 `Notice` 继承它们的所有属性和方法，如下所示所示。\n\n![继承](img/jsinheritance.png)\n\
  \n在 JavaScript 中，类使用 `extends` 关键字继承自另一个类。在你的 Pen 的 **JS** 部分底部添加以下代码以查看它是如何工作的：\n\
  \n```\nclass Warning extends Notice {\n constructor(message='WARNING!') {\n    super(message);\n\
  \  }\n}\n```\n\n这创建了一个名为 `Warning` 的新类，它继承了 `Notice` 类的所有属性和方法。`super` 关键字引用父类（在本例中为\
  \ `Notice`），并用于访问父类的属性和方法。\n\n不过，我们并不希望 `Warning` 类与 `Notice` 类完全相同（那样有什么意义呢？我们需要更新一些样式属性来改变它的外观。更新类定义以包含以下代码：\n\
  \n```\nclass Warning extends Notice {\n constructor(message='WARNING!') {\n    super(message);\n\
  \    this.element.style.background = 'pink';\n    this.element.style.color = 'red';\n\
  \    this.element.style.borderColor = 'red';\n  }\n}\n```\n\n这些额外的代码行更新了样式属性，以更改背景、边框和文本的颜色。\n\
  \n为了检查这是否有效，让我们创建一个 `Warning` 类的实例并将其插入文档：\n\n```\nconst warning = new Warning('Warning!');\n\
  warning.render(document.body);\n```\n\n这应该将警告通知追加到页面的 body 中，将其放在已有的通知下方，如下图所示。\n\
  \n![Warning 类继承自 Notice 类](img/warning.png)\n\n我们可以通过添加以下代码使用类似的过程创建两个用于成功和信息通知的类：\n\
  \n```\nclass Success extends Notice {\n constructor(message='Success!') {\n    super(message);\n\
  \    this.element.style.background = 'palegreen';\n    this.element.style.color\
  \ = 'green';\n    this.element.style.borderColor = 'green';\n  }\n}\n\nclass Info\
  \ extends Notice {\n constructor(message='Information') {\n    super(message);\n\
  \    this.element.style.background = 'powderblue';\n    this.element.style.color\
  \ = 'blue';\n    this.element.style.borderColor = 'blue';\n  }\n}\n```\n\n这些类以与\
  \ `Warning` 类的方式扩展了 `Notice` 类，但使用了不同的颜色和消息。我们可以使用以下代码测试它们并将它们添加到页面：\n\n```\nsuccess\
  \ = new Success;\nsuccess.render(document.body);\n\ninfo = new Info;\ninfo.render(document.body);\n\
  ```\n\n页面现在应该看起来类似于下面。\n\n![Notice 类及其子类](img/notices.png)\n\n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/GRNvmdY)。\n\
  \n### 自定义 HTML 元素 (Custom HTML Elements)\n\n你可以比示例中所做的更进一步，[创建自己的 HTML 元素](https://dev.to/barakplasma/introduction-to-custom-elements-136c)。\n\
  \n## 宠物精灵游戏 (The Pet Unicorn Game)\n\n我们将通过创建一个基于经典的[电子宠物](https://en.wikipedia.org/wiki/Tamagotchi)玩具的虚拟宠物游戏来结束本章。这个游戏涉及玩家照顾宠物精灵。玩家需要决定何时喂养、玩耍睡觉。\n\
  \n游戏将使用 `Unicorn` 类来实例化代表宠物精灵的对象。该对象将具有跟踪精灵感受的属性，以及允许玩家与宠物交互的方法。此游戏将完全通过在控制台中输入方法来运行。\n\
  \n`Unicorn` 类需要以下属性：\n\n*   `name`：引用宠物\n*   `food`：跟踪宠物肚子里食物的量\n*   `fun`：记录宠物有多快乐\n\
  *   `energy`：跟踪宠物有多少能量\n\n`Unicorn` 类还需要以下方法：\n\n*   `eat`：这将增加 `food` 的值，因为吃东西会让宠物肚子里有食物，但它会减少\
  \ `fun` 的值，因为站在那里吃饭可能无聊。\n*   `sleep`：这将增加 `energy` 的值，因为睡眠为宠物提供了休息，但随着食物消化，`food`\
  \ 的值会减少。它还会减少 `fun` 的值，因为睡觉可能很闷。\n*   `play`：这将增加 `fun` 的值，因为玩很有趣，但它会减少 `energy`\
  \ 的值，因为这很累！\n\n让我们创建一个用于实例化 `Unicorn` 类新实例的构造函数。它应该定义上述的属性。在 CodePen 上打开一个新的 Pen\
  \ 并在 **JS** 部分添加以下类定义：\n\n\n\n\n\n```javascript\nclass Unicorn {\n  constructor(name='Sparkles'){\n\
  \    this.name = name;\n    this.food = 3;\n    this.fun = 3;\n    this.energy =\
  \ 5;\n    console.log(`Your new pet unicorn, ${this.name}, is born!`);\n  }\n}\n\
  ```\n\n这定义了在创建新的 `Unicorn` 对象时会被调用的构造函数。该函数有一个 `name` 参数，其默认值为 `'Sparkles'`。它被用于设置\
  \ `name` 属性。我们还把 `food`、`fun` 和 `energy` 属性设置为了它们的初始值 3、3 和 5。此外，还向控制台打印了一条消息，告知玩家他们的宠物独角兽已经出生了。\n\
  \n接下来，我们需要定义 `eat`、`play()` 和 `sleep()` 方法。这些方法需要更新相关的属性，并在控制台中提供一些反馈，让玩家知道发生了某些事情。不过，我们不会提供关于属性实际值如何变化的细节，因为这些被封装在对象内部（我们不想泄露太多游戏的内部机制！）。\n\
  \n让我们从 `eat()` 方法开始。它应该紧放在 `constructor` 函数之后，但仍在类块内部：\n\n```javascript\neat(){\n\
  \   console.log(`${this.name} gobbles up some glitter.`);\n    this.food += 3;\n\
  \    this.fun -= 1;\n    this.timeGoesBy();\n  }\n```\n\n这向控制台打印了一条消息，告诉用户他们的宠物吃了一些东西。然后，它将\
  \ `food` 属性增加了 3，表示吃了一些食物，并将 `fun` 属性减少了 1，因为任何花在吃饭的时间意味着玩耍的时间少了。在方法的最后，我们调用了另一个名为\
  \ `timeGoesBy` 的方法。这个方法将模拟游戏时间的流逝，并检查独角兽的任何属性值是否过低。我们很快就会编写这个方法，但首先我们必须添加 `play()`\
  \ 和 `sleep()` 方法。将这些方法添加到 `eat()` 方法下方：\n\n```javascript\nplay(){\n    console.log(`${this.name}\
  \ frolics in the meadow.`);\n    this.fun +=2;\n    this.energy -=2;\n    this.timeGoesBy();\n\
  \  }\n\nsleep(){   \n    console.log(`${this.name} falls asleep, dreaming of stars\
  \ & rainbows.`);\n    this.energy += 5;\n    this.fun -= 2;\n    this.food -= 3;\n\
  \    this.timeGoesBy();\n  }\n```\n\n这两个方法都遵循与 `eat()` 方法相似的模式：向控制台打印消息，更新属性，然后调用\
  \ `timeGoesBy()` 方法。现在让我们添加该方法：\n\n```javascript\ntimeGoesBy(){\n    if(this.energy\
  \ < 0){\n     this.dies('exhaustion'); \n    }\n     if(this.food < 0){\n      \
  \  this.dies('starvation');\n     }\n    if(this.fun < 0){\n      this.dies('boredom');\n\
  \    }\n  }\n```\n\n该方法使用 `if` 语句检查独角兽的 `energy`、`food` 和 `fun` 属性是否有一个掉到了零以下。如果是这样，独角兽将不幸地死去。当这种情况发生时，我们调用\
  \ `dies()` 方法，并传递一个描述独角兽死亡原因的参数。接下来我们需要编写这个方法：\n\n```javascript\ndies(reason){ \
  \  \n  console.log(`${this.name} died of ${reason}.`);\n}\n```\n\n该方法接受一个描述独角兽死亡原因的字符串参数。然后它向控制台打印消息，告诉用户他们的宠物独角兽已经去世，并说明死亡原因。\n\
  \n尝试在 CodePen 的控制台中创建一个新的宠物独角兽。尝试调用不同的方法，看看你能让你的独角兽活多久。下面的控制台日志显示了我简单尝试的输出：\n\n\
  ```javascript\npet = new Unicorn;\n<< \"Your new pet unicorn, Sparkles, is born!\"\
  \n\npet.play();\n<< \"Sparkles frolics in the meadow.\"\n\npet.play();\n<< \"Sparkles\
  \ frolics in the meadow.\"\n\npet.eat();\n<< \"Sparkles gobbles up some glitter.\"\
  \n\npet.play();\n<< \"Sparkles frolics in the meadow.\"\n\"Sparkles died of exhaustion.\"\
  \n```\n\n这个故事的寓理是记住给你的宠物一些休息！\n\n你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/vYyJmVa)。\n\
  \n## 挑战\n\n1. 在宠物独角兽游戏中添加一个随机元素，使得每次调用方法时属性改变的数值略有不同。例如，`sleep()` 方法不再增加 5 点能量，而是可以增加\
  \ 4、5 或 6 点。你可以查看[我在 CodePen 上的代码](https://codepen.io/SitePoint/pen/zYodwyw)。\n\n\
  2. 为宠物独角兽游戏添加一个图形界面。这可能涉及以下功能：一个允许用户输入独角兽名称以创建它的输入框；当对象实例化时在文档中显示的带有名称的独角兽图片；在文档中更新宠物的感受，而不是使用\
  \ `console.log`；以及通过点击按钮来执行 `eat`、`sleep` 和 `play` 的每个动作。\n\n    你可以查看[我在 CodePen\
  \ 上的代码](https://codepen.io/SitePoint/pen/ZEBwp)。\n\n## 总结\n\n- JavaScript 对象是通过引用复制的。\n\
  - 面面向编程 (OOP) 是一种将代码封装在对象中的概念。\n- 封装意味着对象的内部工作机制对用户隐藏。\n- 多态意味着对象可以共享相同的方法，但以不同的方式实现。\n\
  - 继承意味着类可以从父类继承属性和方法，并添加自己的。\n- 你可以使用 `class` 关键字在 JavaScript 中创建类。\n- 使用 `new`\
  \ 关键字创建类实例时，类中定义的 `constructor` 函数会被调用。\n\n在下一章，我们将学习如何处理时间和日期。\n\n# 第 15 章：关于时间\n\
  \n在编程语言中处理时间和日期可能是很复杂的。由于这个原因，大多数语言都有内置的 `Date` 对象来使这个过程变得更容易。JavaScript 也不例外，我们将查看它是如何工作的。我们将涵盖：\n\
  \n- Unix 时间\n- 时间和日期\n- 定时函数\n- 异步编程\n- 动画\n- 一个饼干收集游戏\n\n## Unix 时间\n\n[Unix 时间](https://en.wikipedia.org/wiki/Epoch_(computing))\
  \ 是一个任意日期——1970 年 1 月 1 日，它在编程中被用作日期的参考点。这允许日期表示为自该时刻以来的秒数。正如你可以想象的，这产生了巨大的数字，并且在\
  \ 2038 年面临一个潜在的[问题](http://en.wikipedia.org/wiki/Year_2038_problem)，那时自该时刻以来的秒数将超过\
  \ 2,147,483,647，这是某些编程语言可以处理的最大值。幸运的是，JavaScript 没有问题，因为它可以处理更大的值。\n\n## 时间日期\n\n\
  Date 对象包含关于日期时间的信息。每个对象代表一个单一的时刻。\n\n在 JavaScript 中，我们可以使用构造函数来创建一个新的日期对象。尝试在控制台中输入以下代码：\n\
  \n```javascript\nconst today = new Date();\n```\n\n变量 `today` 现在指向一个 `Date` 对象。为了查看日期，我们可以使用对象都拥有的\
  \ `toString()` 方法：\n\n```javascript\ntoday.toString();\n<< 'Mon Dec 07 2020 17:40:51\
  \ GMT+0000 (GMT)'\n```\n\n如果没有提供参数，日期将根据系统时钟和时区设置为当前日期时间。这意味着它是可以操纵的，不应该依赖它作为真实的日期表示。\n\
  \n通过向构造函数传递参数，可以为任何日期创建 `Date` 对象。这可以用多种形式的字符串编写，如下面不同节日的示例所示：\n\n\n\n\n\n```\n\
  const christmas = new Date('2021-12-25');\n// date format is YYYY-MM-DD\nchristmas.toString();\
  \ \n<< \"Sat Dec 25 2021 00:00:00 GMT+0000 (GMT)\"\n\nconst chanukah = new Date('28\
  \ November 2021');\n// First day of Chanukah\nchanukah.toString();\n<< \"Sun Nov\
  \ 28 2021 00:00:00 GMT+0000 (GMT)\"\n\nconst eid = new Date('Wednesday, May 12,\
  \ 2021');\n// Eid-al-Fitr\neid.toString();\n<< \"Wed May 12 2021 00:00:00 GMT+0100\
  \ (BST)\"\n```\n\n如你所见，传递给 `Date` 构造函数的字符串可以是多种格式。然而，为了提高一致性，我建议你将日期的每个部分作为单独的参数提供。提供的参数如下：\n\
  \n```\nnew Date(year,month,day,hour,minutes,seconds,milliseconds);\n```\n\n这里有一个示例：\n\
  \n```\nconst halloween = new Date(2021, 9, 31);\nhalloween.toString();\n<< \"Sun\
  \ Oct 31 2021 00:00:00 GMT+0100 (BST)\"\n```\n\n### 计数月份\n\n稍微有点困惑的是，月份的数值从零开始，所以\
  \ 1 月是 0，2 月是 1，以此类推，12 月是 11。\n\n另一种方法是使用 `timestamp`（时间戳），它是一个表示从元 Epoch（1970\
  \ 年 1 月 1 日）以来过的毫秒数的单个整数参数：\n\n```\nconst diwali = new Date(1635984000000);\ndiwali.toString();\n\
  << \"Thu Nov 04 2021 00:00:00 GMT+0000 (GMT)\"\n```\n\n### Getter 方法 (获取方法)\n\n\
  日期对象的属性无法通过赋值直接查看或更改。相反，它们拥有许多被称为 `getter methods` 的方法，这些方法返回有关日期对象的信息，例如月份和年份。\n\
  \n一旦你创建了日期对象，它就可以访问所有的 getter 方法。大多数方法都有两个版本：一个返回本地时间信息，另一个则使用协调世界时 (UTC)。`getTime()`、`getTimezoneOffset()`\
  \ 和 `getYear()` 方法没有对应的 UTC 版本。\n\n#### UTC 对比 GMT\n\nUTC 是世界调节时钟遵循的首要时间标准。它在 1960\
  \ 年正式制定，与格林威治标准时间 (GMT) 非常相似。主要的区别在于 UTC 是一个由科学界定义的标准，而 GMT 不是。（你可以在[维基百科上阅读关于为什么它被称为“UCT”而不是“CUT”的介绍](https://en.wikipedia.org/wiki/Coordinated_Universal_Time)。）\n\
  \n`getDay()` 和 `getUTCDay()` 方法用于查找日期所在的星期几。它们返回一个数字，从 0（星期日）到 6（星期六）。下面的代码显示 2021\
  \ 年的排节是在周四（第 4 天）：\n\n```\ndiwali.getDay();\n<< 4\n```\n\n`getDate()` 和 `getUTCDate()`\
  \ 方法返回日期对象的几号。（注意这些值从 1 开始计数，而不是 0，所以它们返回的是实际日期。）下面的代码显示 2021 年的排节是在 4 号：\n\n```\n\
  diwali.getDate();\n<< 4\n```\n\n`getMonth()` 和 `getUTCMonth()` 方法可以查找日期对象的月份。它返回一个整数，但记住从\
  \ 0 开始计数！下面的代码显示 2021 年的排节在 11 月（第 10 个）：\n\n```\ndiwali.getMonth();\n<< 10\n```\n\
  \n`getFullYear()` 和 `getUTCFullYear()` 方法返回日期对象的年份。还有一个 `getYear()` 方法，但它不符合 [Y2K](https://en.wikipedia.org/wiki/Year_2000_problem)\
  \ 标准，因此不应该使用，因为它对于 2000 年之后的日期会返回无意义的结果，如下面的代码所示：\n\n```\ndiwali.getYear();\n<<\
  \ 121\n```\n\n如果使用 `getFullYear()` 方法就可以修复这个问题：\n\n```\ndiwali.getFullYear();\n\
  << 2021\n```\n\n还有 `getHours()`、`getUTCHours()`、`getMinutes()`、`getUTCMinutes()`、`getSeconds()`、`getUTCSeconds`、`getMilliseconds()`\
  \ 和 `getUTCMilliseconds()` 方法，它们将返回自午夜以时的、分、秒和毫秒。\n\n`getTime()` 方法返回一个表示 Epoch\
  \ 以来毫秒数的时间戳：\n\n```\ndiwali.getTime();\n<< 1635984000000\n```\n\n这对于增加固定时间的日期非常有用。例如，一天可以用\
  \ `1000 * 60 * 60 * 24` 毫秒表示。下面的示例使用此从圣诞节日期减去一天，以找到圣诞夜的日期：\n\n```\nconst christmasEve\
  \ = new Date(christmas.getTime() - 1000 * 60 * 60 * 24);\nchristmasEve.toString();\n\
  << \"Fri Dec 24 2021 00:00:00 GMT+0000 (GMT)\"\n```\n\n`getTimezoneOffset()` 方法返回本地时间与\
  \ UTC 之间的差（以分钟为单位）。例如，我的时区与 UTC 相同，所以它返回 0：\n\n```\nnew Date().getTimezoneOffset();\n\
  << 0\n```\n\n你可以在[W3Schools 网站上查看更多 `Date` 方法示例](https://www.w3schools.com/js/date_methods.asp)。\n\
  \n### Setter 方法 (设置方法)\n\n上一节介绍的大多数 getter 方法都有对应的 setter 方法。这些方法用于更改 `Date` 对象中存储的日期值。每个方法接收一个表示要更新的日期的参数。例如，我们可以更改\
  \ `diwali` 的值使其包含 2021 年 10 月 24 日：\n\n```\ndiwali.setDate(24);\n<< \"Mon Oct 24\
  \ 2021 00:00:00 GMT+0100 (BST)\"\n```\n\n我们还可以更改 `diwali` 的月份：\n\n```\ndiwali.setMonth(9);\n\
  << \"Sun Oct 24 2021 00:00:00 GMT+0100 (BST)\"\n```\n\n我们还可以更改 `diwali` 的年份：\n\n\
  ```\ndiwali.setFullYear(2022);\n<< \"Mon Oct 24 2022 00:00:00 GMT+0100 (BST)\"\n\
  ```\n\n我们还可以更改 `diwali` 的时间部分：\n\n```\ndiwali.setHours(10);\n<< \"Mon Oct 24 2022\
  \ 10:00:00 GMT+0100 (BST)\"\n```\n\n我们还可以更改 `diwali` 的分钟：\n\n```\ndiwali.setMinutes(30);\n\
  << \"Mon Oct 24 2022 10:30:00 GMT+0100 (BST)\"\n```\n\n我们还可以更改 `diwali` 的秒：\n\n\
  ```\ndiwali.setSeconds(15);\n<< \"Mon Oct 24 2022 10:30:15 GMT+0100 (BST)\"\n```\n\
  \n我们还可以更改 `diwali` 的毫秒：\n\n```\ndiwali.setMilliseconds(500);\n<< \"Mon Oct 24 2022\
  \ 10:30:15.500 GMT+0100 (BST)\"\n```\n\n最后，我们可以使用 `setHours()` 一次性设置 `diwali` 的所有时间：\n\
  \n```\ndiwali.setHours(10, 30, 15, 500);\n<< \"Mon Oct 24 2022 10:30:15.500 GMT+0100\
  \ (BST)\"\n```\n\n我们还可以使用 `setTime()` 通过时间戳设置 `diwali` 的日期：\n\n```\ndiwali.setTime(1666563600000);\n\
  << \"Mon Oct 24 2022 00:00:00 GMT+0100 (BST)\"\n```\n\n#### 时区毫秒\n\n取决于你的时区，时间戳所需的毫秒数对你来说可能不同。\n\
  \n你可以在[W3Schools 网站上查看更多 `Date` 方法方法](https://www.w3schools.com/js/date_methods.asp)。\n\
  \n#### 日期和时间支持\n\n处理日期和时区可能很复杂。但很快将有一个新的 [`Temporal` 对象](https://tc39.es/proposal-temporal/docs/)，旨在修复\
  \ `Date` 对象的一些问题。（你可以在[JavaScript API 简介](https://www.sitepoint.com/javascript-temporal-introduction/)\
  \ 中了解更多信息。）\n\n如果你正在编写使用大量时间戳日期的代码，那么使用如 [date-fns](https://date-fns.org) 这样的外部库可能是值得的，它提供了许多处理日期的方法。你可以在[学习\
  \ date-fns：一个轻量级 JavaScript 日期库](https://www.sitepoint.com/date-fns-javascript-date-library/)\
  \ 中阅读更多信息。\n\n### 将是哪一天？\n\n现在我们已经学会了关于操作 `Date` 对象的所有知识，让我们创建一个小型应用程序，告诉你在指定天数后是星期几。\n\
  \n在 CodePen 上打开一个新的 Pen 并添加以下 HTML：\n\n```\n<form name='myForm'>\n  <input type='number'\
  \ name='number' value='1'>\n  <button type='submit'>Submit</button>\n</form>\n<div\
  \ id='output'></div>\n```\n\n这是一个要求用户输入天数的表单。我们将告诉他们在那天数后是星期几。注意，尽管 `<input>` 元素具有\
  \ `type` 属性 `number`（这是一个良好的习惯），它仍然会以字符串的形式提交。\n\n现在让我们添加一些 JavaScript 来计算将是哪一天。首先，我们将声明一些指向\
  \ `<form>` 元素和包含输出的 `div>` 元素的变量。将以下代码添加到 **JS** 部分：\n\n\n\n\n\n```javascript\n\
  const form = document.forms.myForm;\nconst output = document.getElementById('output');\n\
  ```\n\n我们还需要添加一个包含星期每一天名称的数组。这将某天的名称与 `getDay()` 方法返回对应的数字相匹配，因此 `dayNames[0]` 将是\
  \ `'Sunday'`，`dayNames[1]` 将是 `'Monday'`，依此类推。请在 `JS` 部分添加以下行代码：\n\n```javascript\n\
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n\
  ```\n\n接下来，我们需要编写一个函数来计算并显示星期几。在 `JS` 部分的末尾添加此函数：\n\n```javascript\nfunction nameThatDay(e){\n\
  \  e.preventDefault();\n  const numberOfDays = Number(form.number.value);\n  const\
  \ milliseconds = numberOfDays * 24 * 60 * 60 * 1000;\n  const timestamp = Date.now()\
  \ + milliseconds;\n  const day = new Date(timestamp).getDay();\n  output.textContent\
  \ = `In ${numberOfDays} days, it will be ${dayNames[day]}.`\n}\n```\n\n该函数首先防止表单的默认行为，这样它就不会被提交到服务器。然后它获取表单中输入的值并转换为数字，存储在变量\
  \ `numberOfDays` 中。通过乘以一天的毫秒数，该值被转换为毫秒。我们将其加上自 Epoch 以毫秒数，产生一个时间戳，该时间戳可以作为 `new\
  \ Date()` 构造函数的参数，创建一个新的 `Date` 对象。我们可以调用 `getDay()` 方法来返回该日期是星期几。然后我们使用 `dayNames`\
  \ 数组作为查找表，使用该值作为索引找到对应的星期名称字符串。\n\n最后，我们需要添加一个事件监听器，在表单提交时调用 `nameThatDay` 函数。在\
  \ `JS` 部分的末尾添加以下行代码：\n\n```javascript\nform.addEventListener('submit',nameThatDay);\n\
  ```\n\n现在一切都就绪了，尝试使用该表单看看千年后是星期几（它应该和昨天是同一天）。\n\n![今天是星期几？](img/whatdayisit.png)\n\
  \n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/BaQdbQB)。\n\n## 定时函数\n\
  \nJavaScript 提供了几个实用的方法，使我们能够调度函数的调用时间，或者定期调用某个函数。这些方法对于在事情发生之前产生延迟，或在屏幕上显示计时器非常有用。\n\
  \n### setTimeout\n\n`setTimeout()` 方法接受一个回调函数作为第一个参数，接受一个毫秒单位的数字作为第二个参数。作为第一个参数提供的回调函数将在第二个参数所给的时间后被调用。\n\
  \n要查看其实效果，请尝试在控制台中输入以下代码。它应该在七秒后显示一个警告框。这是因为第一个参数是一个匿名箭头函数，用于显示警示框，而第二个参数是 7000\
  \ 毫秒，即 7 秒：\n\n```javascript\nsetTimeout( () => alert(\"Time's Up!\"), 7000);\n\
  << 1\n```\n\n注意，该方法返回一个整数。这是一个用于引用特定定时器的 ID。你也可以使用 `clearTimeout()` 方法取消定时。尝试再次调用该代码，并记录返回的数字：\n\
  \n```javascript\nsetTimeout( () => alert(\"Time's Up!\"), 7000);\n<< 2\n```\n\n\
  现在，在警告框弹出之前快速输入以下代码，确保你输入的是之前返回的数字（在你的情况下它可能不是 2！）：\n\n```javascript\nclearTimeout(2);\n\
  << undefined\n```\n\n如果你足够快并且使用了正确的 ID，回调将被取消，警示框将永远不会出现。\n\n与其尝试记忆设置定时时返回的值，不如将返回值赋值给变量，如下例代码所示，这样更容易：\n\
  \n```javascript\nconst timer = setTimeout( () => alert(\"Time's Up!\"), 7000);\n\
  << 3\n```\n\n该变量稍后可以用于清除定时器：\n\n```javascript\nclearTimeout(timer);\n<< undefined\n\
  ```\n\n## 异步编程\n\n`synchronous`（同步）程序是按照代码出现的顺序处理每行代码的程序。这种方法的问题在于，如果程序的某部分需要很长时间才能完成，它将阻塞程序的其余部分。这意味着，耗时的事件（如文件下载完成、从数据库获取数据或加载游戏）将阻止任何其他事情的发生。\n\
  \n解决方案之一是启动一个新的 `thread`（线程）来运行程序的不同部分。这意味着如果一个进程在一个线程中运行很长时间，其他线程可以用于其他任务。多线程程序的问题是，很难跟踪每个线程中发生的情况，特别是当一个线程的结果需要另一个线程时。\n\
  \n另一种解决方案是编写 `asynchronous`（异步）代码，它会无序或以`异步`的方式运行。与其等待操作完成，不如创建一个回调（或 `promise`），程序的其余继续运行。这确保了等待过程完成不会阻塞程序其他部分的执行。一旦任务完成，该\
  \ promise 就被认为已解析（resolved）。\n\nJavaScript 在单线程环境中运行，因此一次只能处理一个任务。这就是为什么`异步编程`是一项至关重要的工具，以确保等待不会阻塞程序的执行。我们可以通过使用\
  \ `setTimeout()` 方法来模拟耗时过程，从而演示 JavaScript 的异步特性。下面的图显示了在同步运行时三秒定时器如何阻塞代码，而非阻塞对比。\n\
  \n![阻塞与非阻塞代码](img/async.png)\n\n使用定时器代替一个慢操作（例如下载文件）。尝试将代码输入控制台，但在按下回车之前先猜猜输出将是什么：\n\
  \n```javascript\nconsole.log('Hello');\nsetTimeout(() => { console.log('File Downloaded!');\
  \ }, 3000);\nconsole.log('World');\n```\n\n你猜对了吗？如果程序同步运行，将发生以下情况：\n\n*   `Hello`\
  \ 被打印到控制台\n*   会有三秒的延迟\n*   `File Downloaded!` 被打印到控制台\n*   `World` 被打印到控制台\n\n\
  这是一种阻塞方法，因为三秒的等待阻塞了程序的其余部分的执行。\n\nJavaScript 是一种`non-blocking`（非阻塞）语言，所以回调不会阻塞程序的其余发生。这是实际发生的情况：\n\
  \n*   `Hello` 被打印到控制台\n*   三秒定时开始，但程序继续运行\n*   `World` 被打印到控制台\n*   三秒后，`File Downloaded!`\
  \ 被打印到控制台\n\n记住，JavaScript 是单线程的，因此一次只能处理一个任务。这意味着，即使一个任务只需要很短的时间完成，回调也必须等待程序的其余部分完成才能运行。事实上，即使我们将延迟改为零，字符串打印到控制台的顺序也不会改变。尝试在控制台中执行以下代码查看：\n\
  \n```javascript\nconsole.log('Hello');\nsetTimeout(() => { console.log('File Downloaded!');\
  \ }, 0);\nconsole.log('World');\n```\n\n注意，回调的结果仍然最后打印到控制台，尽管定时被设置为零毫秒。你可能认为这意味着回调将立即发生，但回调总是必须等待任何其他函数解析完毕后才能被处理。\n\
  \n\n\n\n\n### 延迟与睡眠\n\n大多数编程语言都有一个 `delay` 或 `sleep` 函数，它可以停止程序的运行。例如，以下 Ruby 代码使用内置的\
  \ `sleep()` 方法来暂停代码执行三秒：\n\n```\nprint 'Hello'\nsleep 3\nprint 'World!'\n```\n\n\
  这将会显示“Hello”，然后暂停三秒，最后显示“World!”\n\n尽管这看起来与 `setTimeout` 的工作方式相似，但它们并不完全相同，因为 JavaScript\
  \ 的异步特性意味着程序并没有停止运行。\n\n“[JavaScript 中的延迟、睡眠、暂停与等待](https://www.sitepoint.com/delay-sleep-pause-wait/)”\
  \ 解释了如何在 JavaScript 中创建一个类似 sleep 的函数。\n\n## 间隔器 (Intervals)\n\n`setInterval()`\
  \ 方法的工作方式与 `setTimeout` 类似，不同之处在于它会根据第二个参数提供的毫秒数，每隔固定时间反复调用回调函数。\n\n上一个示例使用了匿名函数，但也可以像这样使用具名函数：\n\
  \n```\nfunction hello(){ console.log('Hello, World!'); }\n```\n\n现在我们可以设置间隔器并将其赋值给变量：\n\
  \n```\nconst interval = setInterval(hello,1000);\n<< 1\n```\n\n这应该会在控制台中每秒（1,000\
  \ 毫秒）显示一次“Hello, World!”。\n\n要停止它，我们可以使用 `clearInterval()` 方法并将变量 `interval` 作为参数（这是因为\
  \ `setInterval()` 方法会返回它的 ID，所以这个 ID 会赋值给变量 `interval`）：\n\n```\nclearInterval(interval);\n\
  ```\n\n`setInterval()` 方法对于编写需要按固定间隔运行“游戏循环”的游戏代码特别有用。（事实上，在这一章的末尾，我们将使用它来编写一个游戏！）\n\
  \n#### `requestAnimationFrame`\n\n还有另一种方法名为 [`requestAnimationFrame`](https://developer.mozilla.org/en-US/docs/Web/API/window/requestAnimationFrame)\
  \ 的方法，可以用于动画和运行游戏循环。它不允许指定时间间隔，但每秒大约调用回调函数 60 次。你可以[阅读更多关于它的](https://www.sitepoint.com/premium/books/html5-games-novice-to-ninja/read/3/jzne1xb1)\
  \ 并在 Earle Castledine 编写的优秀书籍 [HTML5 Games: Novice to Ninja](https://www.sitepoint.com/premium/books/html5-games-novice-to-ninja/)\
  \ 中学习用 JavaScript 编写游戏。\n\n### 秒表\n\n我们可以使用 `setInterval()` 方法在浏览器中实现一个简单的秒表。在 CodePen\
  \ 上打开一个新的 Pen 并添加以下 HTML：\n\n```html\n<div id='stopwatch'>00:00</div>\n<button id='start'>Start</button>\n\
  <button id='stop' disabled>Stop</button>\n<button id='reset'>Reset</button>\n```\n\
  \n这包含一个用于显示起始时间 `'00:00'` 的 `<div>` 元素，以及三个用于控制秒表的按钮。（注意，`Stop` 按钮初始是禁用的。）\n\n一点\
  \ CSS 将让秒表看起来更真实。在 CSS 部分添加以下代码：\n\n```css\n#stopwatch{\n  border: 3px solid black;\n\
  \  width: 200px;\n  text-align: center;\n  color: black;\n  font: 64px monospace;\n\
  \  padding: 30px;\n  margin: 0;\n}\n```\n\n现在我们需要让秒表真正工作。首先，我们需要获取对元素的引用。在 JS 部分添加以下代码：\n\
  \n```javascript\nconst stopwatch = document.getElementById('stopwatch');\nconst\
  \ startButton = document.getElementById('start');\nconst stopButton = document.getElementById('stop');\n\
  const resetButton = document.getElementById('reset');\n\nlet time = 0;\n```\n\n\
  前四个变量对应 HTML 中的四个元素。最后一个变量 `time` 将用于记录秒表的时间。由于它不断变化，因此需要使用 `let` 进行声明。\n\n现在我们需要编写一个名为\
  \ `start` 的函数来启动秒表。在 JS 部分添加以下函数定义：\n\n```javascript\nfunction start(){\n timer\
  \ = setInterval(function(){\n  time++;\n  // 百秒\n  let hundredths = time % 100;\n\
  \  if(hundredths < 10){\n    hundredths = '0' + hundredths;\n  }\n\n  // 秒\n  let\
  \ seconds = Math.floor((time - hundredths) / 100);\n  if(seconds < 10){\n    seconds\
  \ = '0' + seconds;\n  }\n  // 显示时间\n  stopwatch.textContent = `${seconds}:${hundredths}`;\n\
  \ }, 10);\n startButton.disabled = true;\n stopButton.disabled = false;\n}\n```\n\
  \n这是一个很长的函数，但其核心是 `setInterval()`，它每 10 毫秒（即每百分之一）调用一次匿名函数。\n\n该匿名函数通过 `++` 运算符将\
  \ `time` 变量的值增加 1。之后，函数解析该值以将时间分为秒和百秒。它是通过...\n\n\n\n\n\n- [CSS 动画：点化不死尸军潮](https://www.sitepoint.com/premium/books/css-animation-de-animating-the-undead-horde/)\n\
  \n可以使用 JavaScript 让这些动画更具交互性。让我们来看一个简单的示例，看看它是如何运作的。\n\n### 跳跃的青蛙\n\n我们将使用 CSS 动画创建一个青蛙跳跃的效果。首先，我们需要在\
  \ **HTML** 部分为我们的青蛙准备一个元素：\n\n```html\n<div id='frog'>\U0001F438</div>\n```\n\n\
  现在，让我们添加一些 CSS 让青蛙就就到位：\n\n```css\n#frog{\n  font-size: 64px;\n  position: absolute;\n\
  \  top: 100px;\n}\n```\n\n这只是让青蛙变大了一点，并让它在页面上获得了一个绝对定位。要使用 CSS 动画，我们需要创建一个 `@keyframes`\
  \ 规则来描述动画的每一帧。在 **CSS** 部分添加以下内容：\n\n```css\n@keyframes jump {\n  to{transform:\
  \ translateY(-100px)}\n}\n```\n\n这个 `@keyframes` 规则只描述了动画的结束状态，即向上垂直平移 `100px`（负值在\
  \ Y 轴方向上向上移动）。为了让它再次落回，我们将使用值为 `alternate` 的 `animation-direction` 属性。这会让动画正向播放，然后反向播放，从而产生跳跃的效果。在\
  \ `#frog` 选择器的样式中，添加以下代码行：\n\n```css\nanimation-name: jump;\nanimation-duration:\
  \ 700ms;\nanimation-iteration-count: infinite;\nanimation-direction: alternate;\n\
  ```\n\n你应该能看到青蛙在跳上跳下。\n\n（这里有一个 Pen 展示了[我们目前所做的内容](https://codepen.io/SitePoint/pen/eYBEomK)。）\n\
  \n我们可以通过为青蛙元素添加一个事件处理程序来给动画添加一些交互性，使其在发生 `click`（点击）时运行动画，而不是一直循环运行。首先，从 **CSS**\
  \ 部分移除动画属性，并在 **JS** 部分添加以下代码：\n\n```javascript\nconst frog = document.getElementById('frog');\n\
  document.addEventListener('click',e =>  frog.style.animation = 'jump 700ms 2 alternate')\n\
  ```\n\n这个事件监听器会在用户点击页面任何地方时触发，并会调用一个匿名箭头函数来更新 `frog` 元素的 `style.animation` 属性。我们使用了使用了简写属性将所有属性写在了一行中。现在，只有当你点击页面时，青蛙才会跳跃。而且它只会跳一次：任何进一步的点击都不会让青蛙移动。此的原因是，一旦设置了\
  \ `style.animation` 属性，它就只会运行一次。再次用相同的值更新样式属性不会让它再次运行。为了让它再次生效，我们需要在动画结束后移除这些样式。幸运的是，正好有一个针对这种情况的事件监听器：`animationend`。在\
  \ **JS** 部分的最后添加以下代码：\n\n```javascript\nfrog.addEventListener('animationend',e =>\
  \ frog.style.animation = 'none');\n```\n\n这会在动画结束后移除动画样式。任何进一步的点击将重新添加这些样式，青蛙将再次跳跃。\n\
  \n还有两个你可能发现有用的 CSS 动画事件监听器：\n\n*   `animationstart`：它会在动画开始时触发\n*   `animationiteration`：它会在动画每次迭代开始时触发，第一次除外\n\
  \n你可以在 [CodePen 上查看我的代码](https://codepen.io/SitePoint/pen/gOLxyaM)。\n\n### 抢饼干游戏\n\
  \n我们的最后一个项目是一个基于游游乐场经典游戏 [打地鼠](https://en.wikipedia.org/wiki/Whack-A-Mole) 的游戏，尽管这是一个更对动物友好的版本，涉及通过点击随机出现在屏幕上的饼干来将其“抓取”。\n\
  \n我们将使用 `setInterval()` 方法创建一个倒计时计时器，给玩家施加压力，让他们尽可能抓住更多的饼干。\n\n首先，让我们用以下 HTML 设置一个新的\
  \ Pen：\n\n```html\n<div id='info'>Score: <span id='score'>0</</span> Time: <span\
  \ id='clock'>20</</span>></div>\n<div id='game'></div>\n```\n\n这只是两个 `<div>` 元素：一个用于放置分数和剩余时间的信息，另一个用于主游戏。\n\
  \n接下来，进入 **CSS** 部分并添加一些样式：\n\n```css\n#game {\n  padding: 30px;\n  border: 3px\
  \ solid pink;\n  position: relative;\n  width: 200px;\n  height: 200px;\n}\n\n.cookie{\n\
  \  font-size: 32px;\n  position: absolute;\n  cursor: grab;\n}\n\n#info{\n  font:\
  \ 24px sans-serif;\n}\n#score,#clock{\n  color: pink;\n}\n```\n\n这大部分内容都是设置游戏中各种元素的大小和颜色。你现在应该能在屏幕上看到主游戏区域。\n\
  \n![抢饼干游戏区域](img/cookiegrabber.png)\n\n最后，进入 **JS** 部分并编写实际的游戏机制。首先，我们需要获取 **HTML**\
  \ 部分中元素的引用。它们都有 ID，所以我们可以使用 `getElementById`：\n\n```javascript\nconst game = document.getElementById('game');\n\
  const clock = document.getElementById('clock');\nconst scoreboard = document.getElementById('score');\n\
  ```\n\n接下来，我们要声明并初始化跟踪时间和分数的变量：\n\n```javascript\nlet time = 20;\nlet score = 0;\n\
  ```\n\n在下一步中，我们通过使用 `setInterval` 方法每隔 500 毫秒调用 `gameLoop` 函数来启动游戏主体：\n\n```javascript\n\
  timer = setInterval(gameLoop,500);\n```\n\n`gameLoop` 函数包含了核心逻辑。每次它被调用时，都需要向游戏区域添加一个饼干，更新\
  \ `time` 变量，并检查时间是否结束。现在创建该函数：\n\n```javascript\nfunction gameLoop(){\n  addCookie();\n\
  \  time--;\n  clock.textContent = time;\n  // 检查时间是否结束\n  if(time <= 0){\n    clearInterval(timer);\n\
  \    game.removeEventListener('click',grab);\n    game.innerHTML = '';\n  }\n}\n\
  ```\n\n我们使用另一个名为 `addCookie` 的函数向游戏区域添加饼干，我们将编写它。我们使用递减运算符 `--` 减少 `time` 变量，然后更新显示时间的元素（由\
  \ `clock` 变量表示）的 `textContent` 属性。最后，检查时间是否达到零。如果是，使用 `clearInterval()` 方法停止计时器，参数为\
  \ `timer`，它指向创建间隔时返回的数字。我们还移除用于“抓取”饼干的事件监听器。（我们还没有创建它，所以如果你不认识它请忽略！）最后，通过将 `game`\
  \ 的 `innerHTML` 属性设置为空字符串来移除任何未抓取的饼干，起到清除游戏区域的效果。\n\n我们的下一个任务是编写 `addCookie` 函数。它需要创建一个类名为\
  \ `cookie` 的元素，并将其放置在游戏区域的随机位置。在 **JS** 部分的最后添加以下代码：\n\n```javascript\nfunction\
  \ addCookie(){\n  const cookie = document.createElement('div');\n  cookie.textContent\
  \ = '\U0001F36A';\n  cookie.className = 'cookie';\n  cookie.style.top = `${randomInt(200)}px`;\
  \ // 此处假设有随机函数\n  cookie.style.left = `${randomInt(200)}px`;\n  game.appendChild(cookie);\n\
  }\n```\n\n\n\n\n这创建了一个空的 `<div>` 元素并将其赋值给变量 `cookie`。我们更新了 `textContent` 属性将其设置为饼干表情符号。然后，我们将\
  \ `className` 属性设置为 `cookie`。这样做是为了让它能够获取我们在 `CSS` 部分设置的样式，我们稍后还会用它来识别饼干是否被点击。用于将饼干放在随机位置的代码使用了\
  \ `style.top` 和 `style.left` 属性，这些属性的作用就像是从 `game` div 左上角开始坐标。然后，我们使用在第 8 章中创建的\
  \ `randomInt` 辅助函数，在 1 到 200（游戏区域的宽度）之间选择一个随机整数来设置这两个属性。最后，我们使用 `appendChild` DOM\
  \ 方法将该元素作为 `game` 元素的子添加。这意味着任何创建的饼干都将出现在游戏区域内的随机位置。\n\n接下来，我们需要添加玩家交互。当玩家点击饼干时，我们希望让他们“抓住”它。我们可以为创建的每个饼干绑定事件监听器来监听\
  \ `click` 事件，但使用事件委托并将事件监听器绑定到 `game` 元素上要简单得多。在 `JS` 部分的末尾添加以下代码：\n\n```\ngame.addEventListener('click',grab);\n\
  ```\n\n每当玩家点击游戏区域内的任何地方时，都会触发 `grab` 函数。这意味着我们需要编写 `grab` 函数，并检查是否点击了饼干。在 `JS` 部分的底部添加以下函数声明：\n\
  \n```\nfunction grab(event){\n  if(event.target.className === 'cookie'){\n    score\
  \ ++;\n    scoreboard.textContent = score;\n    event.target.remove();\n  }\n}\n\
  ```\n\n这段代码查看传递给任何事件处理程序的事件对象的 `target` 属性。该属性返回实际被点击的元素。这意味着我们就可以检查该对象是否具有 `cookie`\
  \ 类。如果是，我们使用递增运算符（`++`）将分数加 1，更新 `scoreboard` 元素的 `textContent` 以显示新分数，然后从 DOM 中移除被点击的元素。这意味着，如果玩家点击了饼干，他们的得分就会增加\
  \ 1 分，饼干就会“消失”！\n\n最后，我们需要包含用于创建创建随机整数的 `randomInt` 辅助函数。由于函数声明会被提升，我们可以将其放在远处，即代码的底部：\n\
  \n```\nfunction randomInt(lower,upper){\n  if(upper===undefined){\n    upper = lower;\n\
  \    lower = 1;\n  }\n  return Math.floor(Math.random()*(upper-lower+1)+lower)\n\
  }\n```\n\n就这些！尝试运行一下代码，看看你能抓到多少个饼干。它看起来应该是这样的：\n\n![Playing Cookie Grabber](img/cookiegrabber.png)\n\
  \n你可以查看 [CodePen 上我的代码](https://codepen.io/SitePoint/pen/abByxNM)。\n\n## 挑战\n\n\
