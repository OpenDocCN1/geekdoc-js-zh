  ![已排序的食物](img/list19.png)\n\n注意这也会永久更改数组的顺序。\n\n### 字母顺序的数字\n\n字符串默认按字母顺序排序，但数字也是如此！这意味着数字是根据它们的第一位数字进行排序的，而不是根据数值。例如，`9`\
  \ 会排在 `10` 之后，因此你会得到像下面所示的疯狂结果：\n\n```\n[5, 9, 10].sort();\n<< [10, 5, 9]\n```\n\
  \n不过，别担心。这可以使用所谓的“回调”（callback）来修复，我们将在书的后面介绍它。\n\n### 更多方法\n\n数组还有很多可以做的事情。你可以在\
  \ [Mozilla 开发者网络](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\
  \ 上找到属性和方法的完整列表。看看你是否能找到任何有趣的，并尝试在控制台中中使用它们。\n\n## 多维数组\n\n你可以通过将多个数组放入一个容器数组中，创建一个数组的数组，这被称为\
  \ `多维数组`。这可以用于创建坐标系，例如：\n\n```\nconst coordinates = [[1,3],[4,2]];\n<< [[1,3],[4,2]]\n\
  ```\n\n要访问多维数组中的值，我们使用两个索引——一个指向项在层层数组中的位置，另一个指向它在内层数组中的位置：\n\n```\ncoordinates[0][0];\
  \ // 第一个数组的第一个值\n<< 1\n\ncoordinates[1][0]; // 第二个数组的第一个值\n<< 4\n\ncoordinates[0][1];\
  \ // 第一个数组的第二个值\n<< 3\n\ncoordinates[1][1]; // 第二个数组的第二个值\n<< 2\n```\n\n二维数组的结构如下所示。\n\
  \n![二维数组](img/coordinates.png)\n\n我们之前见过的展开运算符可以用来“展平”多维数组。`展平` 数组涉及通过将所有值从其数组中取出并放在父数组的同一层，移除所有嵌套数组。你可以从下面的示例中看到，只需将\
  \ `summer` 和 `winter` 数组放入容器数组就会创建一个嵌套数组，但如果我们在将数组放入容器数组时使用展开运算符，我们得到一个只包含其内容的扁平数组：\n\
  \n```\nconst summer = ['Jun', 'Jul', 'Aug'];\nconst winter = ['Dec', 'Jan', 'Feb'];\n\
  const nested = [ summer, winter ];\n<< [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan',\
  \ 'Feb' ] ]\n\nconst flat = [...summer, ...winter];\n<< [ 'Jun', 'Jul', 'Aug', 'Dec',\
  \ 'Jan', 'Feb' ]\n```\n\nJavaScript 还有 `flat()` 方法，它不需要展开运算符即可展平数组，如下所示：\n\n```\n\
  [ [ 'Jun', 'Jul', 'Aug' ], [ 'Dec', 'Jan', 'Feb' ] ].flat();\n<< [ 'Jun', 'Jul',\
  \ 'Aug', 'Dec', 'Jan', 'Feb' ]\n```\n\n关于创建和操作数组的总结可以在 [SitePoint 的这篇文章](https://www.sitepoint.com/quick-tip-create-manipulate-arrays-in-javascript/)\
