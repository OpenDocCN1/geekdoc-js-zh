    \nListing 9.5 Workbook Generated sw.js File in tc2\n\n```\nself.addEventListener('install',\
    \ event => {\n// fires when the browser installs the app\n// here we're just logging\
    \ the event and the contents\n// of the object passed to the event. the purpose\
