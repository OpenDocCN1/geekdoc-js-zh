  md: 'This code is simple as well. All it does create an event listener for the browser''s
    fetch event, then logs the requested resource to the console. The fetch event
    fires whenever the browser, or an app running in the browser, requests an external
    resource (such as a file or data). This is different from the JavaScript fetch
    method, which enables a JavaScript code to request data or resources from the
    network. The browser requesting resources (such as a JavaScript or image file
    referenced in an HTML script or img tag) and a web app''s JavaScript code requesting
    a resource using the fetch method will both catch the fetch event.


    This is the core functionality of a service worker, intercepting fetch events
    and doing something with the request—such as getting the requested resource from
    the network, pulling the requested file from cache, or sending something completely
    different to the app requesting the resource. It is all up to you: your service
    worker delivers as much or as little enhancement needed for your app.


    In this place, refresh the app in the browser and watch what happens. Nothing,
    right? There''s not much to see here since, everything happens under the covers.
    In this example, the service worker does nothing except log the event; as you
    can see in the browser, the app loaded as expected, app''s still working the same
    as it did before.


    Open the browser''s developer tools and look for a tab labeled Application (or
    similar) and a side tab labeled Service Workers. If you did everything right,
    you should see your service worker properly registered in the browser, as shown
    in Figure 3.5 (Google Chrome).


