    (styled by Scott Good, of course). Notifications don''t work unless the app receiving
    them is hosted somewhere (rather than just loaded from the file), so I included
    a push service like the one used in the previous chapters. The setup process is
    a little different than what you''ve seen previously, so don''t skip the instructions
    here or in the next.


    The code for the server app is available in the GitHub repository at https://github.com/johnwargo/learning-pwa-code.
    I provided complete instructions for how to download the code and configure your
    development environment in the section "Preparing to Code" in Chapter 3, "Service
    Workers." If you haven''t already completed these, go there and complete them
    first before picking up again.


