  md: "# Enhancing the PWA Application\n\nThe module code references the store name\
    \ in several places, so I moved the value into a constant so I wouldn't have to\
    \ type it everywhere. I pulled the database version into a constant because I\
    \ might change this value with every app version, and I wanted the value in an\
    \ easy place to find later. It's used only once, but putting it at the top of\
    \ the file makes it very easy to change later. Finally, I moved the database name\
    \ into a constant just because; I had everything here, so it made sense to define\
    \ the database name as well.\n\nNext, add the openDB function, shown next, to\
    \ the new file. The function uses the concepts described earlier in the chapter\
    \ to open the IndexedDB database and return the database object by the calling\
    \ function so it can use it to interact with the open database.\n\n```\nfunction\
    \ openDB() {\n // open the indexedDB database used by the app\n return new Promise((resolve,\
    \ reject) => {\n  // open the feedback database\n  var theDB = self.indexedDB.open(DB_NAME,\
    \ DB_VERSION);\n\n  // success, callback\n  theDB.onsuccess = function (event)\
    \ {\n    console.log('openDB: Successfully opened database');\n    // success,\
    \ return the db object result\n    resolve(event.target.result);\n  };\n\n  //\
    \ define the target error callback\n  theDB.onerror = function (event) {\n   \
    \ let msg = 'Database error ${theDB.error}';\n    console.log('openDB: ${msg}');\n\
    \    Swal.fire('Database Error', msg, 'error');\n    // reject the promise, we\
    \ failed\n    // include the error message with the failure\n    reject(msg);\n\
    \  };\n\n  onupgradeneeded = function (event) {\n    console.log('openDB: Database\
    \ upgrade needed');\n    // get a handle to the database\n    var db = event.target.result;\n\
    \    // does the store already exist?\n    if (!db.objectStoreNames.contains(STORE_NAME))\
    \ {\n      // no? Then create it\n      console.log('openDB: Creating store ${STORE_NAME}');\n\
    \      // first create the configuration options for the store\n      var storeOptions\
    \ = { keyPath: \"idx\", autoIncrement: true };\n      // then create the store\n\
    \      var theStore = db.createObjectStore(STORE_NAME, storeOptions);\n    }\n\
    \  });\n}\n```"
