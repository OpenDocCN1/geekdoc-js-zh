  md: "In this example, the route matches the URL if the full URL to the requested\
    \ resource contains an. If it does, the service worker uses the StaleWhileRevalidate\
    \ strategy for the resource. If not, this resource is ignored and happily picked\
    \ up by other route.\n\nYou can match resources using a regular expression, as\
    \ shown in the following example:\n\n```\nworkbox.routing.registerRoute(\n  /\\\
    ?:html)?$/,\n  new workbox.strategies.NetworkFirst(),\n);\n```\n\nIn this example,\
    \ the regular expression in the first parameter matches any file that has .html\
    \ in the resource path. When the app requests an HTML file, the service worker\
    \ will return the resource using the NetworkFirst strategy.\n\nYou can also use\
    \ different strategies for different types of files. For example, the following\
    \ code uses the StaleWhileRevalidate strategy for .js and .css files, but NetworkFirst\
    \ for .html files:\n\n```\nworkbox.routing.registerRoute(\n  /\\?:(js|css)$$/,\n\
    \  new workbox.strategies.StaleWhileRevalidate(),\n);\n```\n\nworkbox.routing.registerRoute(\n\
    \  /\\?:(html)?$/,\n\n```\nworkbox.routing.registerRoute(\n  '/img/my-logo.png',\n\
    \  new workbox.strategies.CacheFirst(),\n);\n```\n\nIn this example, the route\
    \ matches if the requested resource is the app’s /img/my-logo.png file. When the\
    \ app requests the logo file, the service worker will return the resource using\
    \ the CacheFirst strategy.\n\nLet's add some caching to the Tip Calculator app.\
    \ Make another copy of the project's chapter-09/tip-calc folder, and call this\
    \ version tc3. Next, rename the copied project's sw-start.js file to sw.js and\
    \ open the renamed file in your code editor.\n\nAt the top of the file, add the\
    \ following import:\n\n```\nimportScripts('https://storage.googleapis.com/workbox-cdn/releases/4.3.1/\n\
    workbox-sw.js');\n```\n\nThis adds the Workbox library to the app."
  merge: -1
