    \ worker in a file sw.js, so you can just press Enter to accept the default value.\n\
    \n? Where would you like your service worker file to be saved? (sw.js)\n\nIf you\
    \ change this value to a different name, be sure to update the sw-reg.js file\
    \ to use the new service worker file name.\n\nFinally, the wizard asks for the\
    \ file name for the configuration file by Workbox to store the settings you entered\
    \ or selected. Press Enter to accept the default (workbox-config.js).\n\n? Where\
    \ would you like to save these configuration options? (workbox-config.js)\n\n\
