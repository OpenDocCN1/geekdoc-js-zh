  md: '# Chapter 6 Push Notifications


    When the backend app server has information or data to send to a browser, the
    server


    +   - Encrypts the notification request using the server''s private key.

    - Sends the request to the push service using the Push API.¹

    - The push service decrypts the request, verifies the identity of the sender,
    and, if verified, sends the notification to the target browser.

    - The browser wakes up the app service worker to process the notification.


    In this book, I do not cover anything related to implementation of the Push API.
    It''s an open standard with community-supported libraries, so I''m going to skip
    all the hard work and use a popular open source solution for managing delivery
    of notification requests to a push service. I show how the server uses the open
    solution to send notifications at the end of the chapter.


    # Preparing to Code


