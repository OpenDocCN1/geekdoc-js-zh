  md: '# 3


    # Service Workers


    If building Progressive Web Apps (PWAs) is like building a house, the web app
    manifest file is like a real estate agent working to get people interested in
    buying your house and prepping it so that it''s move-in ready for buyers. Service
    workers, on the other hand, are live-in contractors working behind the scenes
    to make sure the house has a solid foundation and all the walls stay after the
    buyer moves in.


    This chapter introduces service workers and shows how to use them to enable background
    processing in your web app. Here we build a foundation of what service workers
    do and how they do it, starting with simple app resource caching and the service
    worker lifecycle. In the chapters that follow, I show how to add additional functionality
    to an app''s service worker to give it some pizzazz.


