    # Introducing Background Sync


    Background sync is a feature of service workers that enables apps to ensure that
    user actions aren''t lost even if the browser loses network connectivity or the
    user switches to another app or closes the browser or the current tab. By user
    actions, I mean things such as:


    +   - Sending an email.

    - Subscribing to a newsletter.

    - Sending a chat message.

    - Sending a form.


    These actions are essentially any data created or updated in the web app that
    must be sent to the server. The ability to fire and forget action as they know
    it whenever the app (or the browser running the app) regains network connectivity
    is one of the most powerful mobile app features enabled by PWAs. Web apps do this
    using service workers.'
  merge: -1
  pgno: 116
- img_proc: false
  md: 'Developers have two options for implementing this functionality. The first
    option uses the background sync process described in this chapter, and the other
    uses the browser''s ability to send data between a service worker and a web app,
    as described in Chapter 7, “Passing Data between Service Workers and Web Applications.”
    The difference between these two approaches is that background sync accommodates
    scenarios in which service workers can''t send the data to the server immediately;
    instead, the service worker retrieves the action when the browser comes online
    (later). The options described in Chapter 7 enable a web app to pass data between
    the two entities (the web app and the service worker) and is really useful for
    real-time operations.


    To make background sync work, web apps share data with service workers through
    a local database shared by processes:


    +   - The service worker and the web app both share the same local database. The
    web app writes data to the database. The service worker reads action from the
    database, then deletes the action once it''s successfully processed.

    - When the web app invokes background sync event, it writes the action''s data
    to the database and then fires off a sync event to the service worker to process
    the action.

    - When the service worker''s sync event listener receives the event, the event
    listener reads the action from the local database and does whatever it needs to
    do with the data.

    - If the browser (and therefore the service worker) has network connectivity and
    can perform the action immediately, it does. If the action succeeds, the service
    worker deletes the action''s data from the local database. If it fails, it leaves
    the data there for the service worker to try again the next time the sync event
    fires.

    - If the browser doesn''t have network connectivity, the browser queues the event
    to try it later.

    - This can''t go on forever. After some time, the action must be allowed to pass
    on to greener pastures. In this case, the browser warns the service worker that
    it''s done trying to complete the action and the worker must remove the data from
    the queue.


    Figure 5.2 illustrates the process, highlighting the roles the browser and service
    worker play in the process.


    ![](bbox=[0.142, 0.683, 0.879, 0.827])


    Figure 5.2 Service Worker Background Sync Overview'
