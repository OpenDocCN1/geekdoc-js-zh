    console.log(`SW: Event fired: ${event.type}`);

    console.dir(event);

    self.importScripts(''./js/db.js'');

    // Force service worker activation

    self.skipWaiting();

    });

    ```


    All right, now it''s time to tell the service worker how to process the queued
    feedback. The code we''re about to work through is probably the most complicated
    code we''ve looked at so far. To explain it as cleanly as I can, I''ve identified
