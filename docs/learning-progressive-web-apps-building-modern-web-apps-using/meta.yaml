  md: 'Preface xiii


    next step in making the web a first-class development platform—especially for
    mobile apps. My interest in writing this book focuses on PWAs'' impact on mobile
    developers, but everything here applies to web apps running on a desktop browser
    as well.


    If you''ve read any of my books, you already know that this manuscript contains
    no phrases or content in any language but English (I refuse to put down the book
    to look up some obscure phrase in Latin or French to understand a point). This
    book also contains no pop culture references (well, except for one that I describe
    completely so you won''t feel out if you don''t already know.


    Unlike previous technical books, which focused on the technologies and how to
    use them (with lists of code examples), this book is project-based. As you work
    through the chapters, at different points you will start with one complete, standalone
    web apps, then convert into PWAs using service workers and other technologies.


    The sample apps for this book were written to be simple and easy to understand,
    they''re not fancy. I have built them as amazing, modern web apps, leveraging
    JavaScript frameworks such as Vue or React—but I built them using plain, vanilla
    HTML, CSS, and JavaScript. This removes a lot of extraneous code from the apps
    and leaves just what you need to understand at the top of it.


    You can find all of the source code for the sample apps on GitHub at https://github.com/johnwargo/learning-pwa-code.
    To make it easier for readers consuming the printed version of this book, I added
    a resources.md file to the code folder for each chapter; it lists all of the links
    used in the chapter. Rather than typing in long URLs from the chapter content,
    you can simply open the resources file in a browser and quickly access any link
    from the chapter.


    Unlike the code repositories for other books, this book''s source code doesn''t
    contain only before and after versions of the apps. Instead, as you complete a
    chapter section, you''ll find the source code modifications for that section in
    a separate file. This enables you to more easily build the app with the chapter
    content while having that section''s code available in case you have an issue
    and want to compare the completed code with yours. This approach should streamline
    your following along, especially if you create typos or bugs as you work.


    If you have any questions or comments about the book or if you find an error in
    the text or code, please submit them through the issues area in the book''s GitHub
    repository at https://github.com/johnwargo/learning-pwa-code/issues. The code
    is open source, so feel free to use it in your applications (it would be especially
    nice if you referenced the code so others can learn about this book).


    If you find a bug in the code and want to fix it yourself, do so, then submit
    a pull request against the repository, and I''ll take a look. I''m usually very
    good at responding, so you should hear back from me in a day or so. Please be
    nice—GitHub is a very public forum, and we should all treat people as we expect
    to be treated by others.


    +   3. https://vuejs.org/

    4. https://reactjs.org/

    5. https://github.com/johnwargo/learning-pwa-code/blob/master/chapter-01/resources.md'
