  md: "The complete service worker code for this example is in the project folder's\
    \ public\\service-workers\\sw-47.js file.\n\nAll right, for every resource request,\
    \ this service worker does the following:\n\n+   * Tries to retrieve the resource\
    \ from the network.\n* If it gets a response,\n* Checks to see if the response\
    \ is a valid response and not an error.\n* Clones the response (responses are\
    \ streams, so the service worker can't pass a response to the browser and write\
    \ it to the cache at the same time).\n* Writes the cloned response to the cache.\n\
    * Returns the original response to the requestor.\n* If the response is not an\
    \ HTTP response of 200 (success), it returns whatever it has to the requestor\
    \ for the requestor to process the error.\n* If it gets an outright error, \n\
    * Checks the cache to see if it has the resource there.\n* If it does, it returns\
    \ the cached resource.\n* Otherwise, it does nothing and lets the requestor deal\
    \ with the problem (usually showing the page shown in Figure 4.8).\n\nAs processes\
    \ of all the app's requests, the requests return with different response types\
    \ depending on security settings in the browser and in the app. Remember, service\
    \ workers are all about security, so if you request a resource that's not from\
    \ the same origin as the page requesting the resource, the service worker's going\
    \ to complain. The way it complies here is by not caching the resource.\n\nThe\
    \ service worker checks here if the response is valid using the following code:\n\
    \n```\nif (response.status == 200)\n```\n\nSome examples you see online this it\
    \ way:\n\n```\nif (response.status == 200 && response.type == 'basic')\n```\n\n\
    What I learned while testing this is that the service worker will cache only resources\
    \ with a type of basic. There's no need to check the type before caching. All\
    \ the same origin requests arrive as basic, but the image requests, their origin\
    \ is Bing and not the local API server, are ignored and not added to the cache.\
    \ To prove this, look at Figure 4.12; it shows the complete resource cache generated\
    \ by this fetch listener.\n\n+   * https://developer.mozilla.org/en-US/docs/Web/API/Response/type"
