  md: '# Anatomy of a Web App Manifest 25


    Warning

    If the web app contains links to resources outside the scope defined in the manifest,
    the browser will load the links in the current browser window. If the target page
    doesn''t provide navigation help to get the user back to the launching PWA, the
    user will be stuck in the new location.


    To avoid this, include the target="_blank" attribute in any HTML anchor <a> tags
    on the page; with this in place, clicking these links will open them in a new
    browser window and leave the PWA window intact:


    ```

    <a href="https://learningpwa.com" target="_blank">Learning PWA</a>

    ```


    # Setting App Options


    All I''ve shown so far are manifest options required to make an app installable.
    In this section, I cover other options that are useful but not required to install
    your PWA.


    When launching an installed PWA, the browser builds a simple splash screen with
    the app icon and title (defined by the name or short_name properties in the manifest)
    and displays that while it loads your app''s start page and other content. The
    background for the splash screen defaults to white, but if your app page uses
    a different color, the transition from the splash screen''s white to your app''s
    background color may be jarring for users. To improve the user experience, the
    manifest''s background_color property to set the background color for your app''s
    main page. With this in place, the UI transitions smoothly from the splash screen
    to the app.


    In the manifest for the Tip Calculator app, I''ve set the background color to
    white to match the background color in the icon file, as shown here:


    ```

    "background_color": "#FFFFFF",

    ```


    If I were better at making icons, I''d put a fancy border around the app icon,
    leaving the icon background white, then use a contrasting, cool, color for the
    background so the icon pops off the page as it loads. I''ll leave this work to
    you.


    # Additional Options


    The complete list of properties is provided in the specification at https://www.w3.org/TR/appmanifest.
    There are just a couple more that I want to bring to your attention. Look to the
    specification of other interesting things you can use with manifest files.


    On compatible browsers such as Google Chrome, the manifest''s theme_color property
    is a hint that tells the browser what color to use for styling the installed app
    (for example, the styling of the address bar). For the Tip Calculator app, I set
    the theme color to match the blue in the app icon''s jacket sleek:


    ```

    "theme_color": "#3653B3",

    ```


    You can also force an orientation for an installed app


    ```

    "orientation": "landscape",

    ```'
