  md: '# PWA Market Impact


    (service worker caching), holds new or updated records for upload later when there''s
    a network connection (service worker caching coupled with background processing),
    and notifies users when new push messages arrive (service worker background processing).


    On systems that don''t support web manifest files and/or service workers? The
    app works the same way it did before you added the manifest file or service worker
    to the app. When you access the app, the content and data are registered in real
    time from one or more servers.


    So, what impacts are PWAs having in the market? Development organizations quickly
    adopted the technology because the progressive enhancement nature of the approach
    enables teams to dramatically affect performance (for any user running a browser
    that supports it) for users with a few small, simple changes. When users run the
    app on a browser that doesn''t support PWA technologies, they won''t notice anything
    different—the app continues to work as it always did.


    Web app performance, especially on mobile devices, seems better for some apps.
    That''s because many apps implement web manifest files and service workers, and
    these apps now actively manage their client-side behavior (using background processing
    and caching) to the user''s benefit.


    Users engage with PWA-enabled apps. That''s just because apps are snappier (load
    faster) and even when the mobile device is running doesn''t have a network connection.
    The app might not have all its features when offline, but it still works, and
    that''s all that it takes to make users happy.


    Modern web application frameworks and cross-platform development tools adopted
    PWAs in a big way. For example, React, a popular JavaScript library for building
    user interfaces (UIs) (their words, not), preloads its default sample project
    with a service worker automatically. It disables by, but all you must do to turn
    a React app into a PWA is change one line of code, as described in Listing 1.1.


    # Listing 1.1 Sample React app index.js


    ```

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import ''./index.css'';

    import App from ''./App'';

    import as serviceWorker from ''./serviceWorker'';


    ReactDOM.render(<App />, document.getElementById(''root''));


    // if you want your app to work offline and load faster, you

    // can change unregister() to register below. Note this comes

    // with some pitfalls. Learn more about service workers:

    // https://bit.ly/CRA-PWA

    serviceWorker.unregister();

    ```'
