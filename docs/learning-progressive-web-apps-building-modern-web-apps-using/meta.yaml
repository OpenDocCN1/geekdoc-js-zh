    # # Wrap-Up


    In this whirlwind chapter, I showed you how to use Google''s Workbox toolkit to
    generate service workers for your app or build service workers using Workbox''s
    modular caching strategies rather than writing and maintaining all the caching
    code yourself. The material provided in this chapter merely scratches the surface
    of what you can do with Workbox. You should spend some time with Google''s Workbox
    documentation and samples to learn more about how Workbox can make your life easier.


    This chapter wraps up the book as well. I truly hope you enjoyed this journey
    from manifest files to service workers and all the capabilities they provide.
    You now have the knowledge you need to supercharge your web apps with PWA capabilities.
    Enjoy!'
