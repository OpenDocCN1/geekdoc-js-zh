  md: '# Automating Service Workers with Google Workbox


    In Chapter 4, “Resource Caching” we wrote a lot of code to implement different
    caching strategies for the PWA app. You probably completed that chapter and said
    something along the lines of “there’s got to be better way.” Well, there is. With
    Google Workbox, Google, along with the PWA developer community, provides a toolkit
    developers can use to more easily deploy robust and capable service workers. I''d
    like to say that you''re writing less code with Workbox, but that''s not the case.
    You''re still writing code, but you''re writing code that describes how you want
    your service worker to work rather than the code to actually make it work.


    In this chapter, I introduce you to Workbox and show how you can use it to implement
    caching strategies for your web apps. I don''t cover every capability of Workbox;
    the library documentation is good, thorough, and full of examples. What I''ll
    show is how to apply Workbox to an app, using the Tip Calculator app from the
    beginning of the book.


    In the source code for this chapter, I included a slightly modified version of
    the Tip Calculator in Chapter 2, “Web Manifest Files.” Rather than start with
    a clean project and enhance as you work through the chapter, in this chapter,
    you''ll copy the clean version and work in a copy as you proceed through the different
    sections.


    # Automating Workbox


    Workbox is a service worker toolbox containing JavaScript libraries, a Node command-line
    interface (CLI), and Node modules developers use to create service workers and
    manage how they work. The JavaScript libraries deliver the service worker-side
    capabilities of the toolbox, something Google describes as “adding offline support
    to web apps.” The CLI and Node modules automate app resource caching during the
    coding and build process.


    With Workbox, you can build a service worker that


    +   * Precaches the resources used by a web app and serves them from the cache.

    * Implements multiple caching strategies for your web app''s resources.


    > 1 https://developers.google.com/web/tools/workbox/'
  merge: -1
  pgno: 223
- img_proc: false
  md: '# Chapter 9 Automating Service Workers with Google Workbox


    +   - Implements offline capabilities for Google Analytics.

    - Queues network requests for later processing using background sync (similar
    to what you learned in Chapter 5, "Going the Rest of the Offline with Background
    Sync")

    - Programmatically sets expiration for cached resources.

    - Does all sorts of stuff.


    Workbox abstracts away complexity of the work that service workers do, letting
    you want things to work, and the toolbox handles everything for you.


    In this chapter''s examples, I show you how to use the CLI and the JavaScript
    framework in your PWAs. I leave working with the Node module and build tools for
    you to research later. Everything you learn in this chapter applies easily to
    other topics as well.


    # Generating a Precaching Service Worker


    With precaching and service workers, you will build a list of all the local files
    used by your app, use code to preload these into a device''s local cache the first
    time the app runs on the device; we implemented an example of this in Listing
    4.1. In Workbox, Google delivers to that that generating that file list generates
    the service worker that caches the files and serves them from the cache.


    By making a copy of the project''s chapter-09/tip-calc folder Copy the folder,
    paste it back to the same location, renaming the folder copy to t1 during the
    process. When you''re done, you''ll have two folders in the chapter-09: tip-calc
    and t1.


    Next, open a terminal window or command prompt, navigate into the t1 folder, and
    execute the following command:


    ```

    npm install -g workbox-cli

    ```


    This command installs the Workbox CLI for us to use. After the installation completes,
    execute the following command:


    ```

    workbox wizard

    ```


    This starts the process Workbox uses to generate the resource list and service
    worker for your PWA. The wizard will ask you a few questions, then create the
    configuration file that drives the precaching and service worker generation process.
    Listing 9.1 shows the first step in the process.


    The wizard assumes you have a folder structure with a source and distribution
    folder (or some variant), so the first thing it does is ask for the path of the
    app''s source files. For this simple project, everything is in the t1 folder,
