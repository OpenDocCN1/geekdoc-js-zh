  md: "120 Chapter 5 Going the Rest of the Way Offline with Background Sync\n\n# Table\
    \ 5.1 Service Worker Queue Processing\n\n| Step | Method | Description |\n| 1\
    \ | event.waitUntil() | Instruct the service worker to stay active (not shut down)\
    \ until everything completes. |\n| 2 | getFeedbackItems() | Get the feedback items\
    \ from the data store. |\n| 3 | Promise.all() and data.items.map() | Loop through\
    \ each of the feedback items. |\n| 4 | fetch() | POST the data to the server.\
    \ |\n| 5 | deleteFeedback() | Deleted processed feedback from the data store.\
    \ |\n\nEverywhere the service worker does is asynchronous, so I'm using everywhere.\
    \ Update the existing sync event listener in the project's service worker; I'll\
    \ explain the code after you're done it:\n\n```\nself.addEventListener('sync',\
    \ event => {\n  console.log('SW: Sync event fired');\n  if (event.tag === 'feedback')\
    \ {\n    console.log('SW: Processing sync');\n    event.waitUntil(\n      getFeedbackItems()\n\
