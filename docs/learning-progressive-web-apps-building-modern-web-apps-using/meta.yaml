  md: "Remember, we need the subscription object on the server to send notifications\
    \ to the browser later, so next we must upload the object to the server. To accommodate\
    \ this, add the postRegistration function to the project's index.js file:\n\n\
    ```\nfunction postRegistration(subscription) {\n  const serverURL = `${location.origin}/api/subscribe\\\
    `;\n```\n\n```\nreturn new Promise((resolve, reject) => {\n  if (subscription)\
    \ {\n    // build the URL to the app's APIs\n    console.log(`Submitting subscription\
    \ to ${serverURL}`);`\n\n    // the data we're passing to the server\n    const\
    \ data = {\n      subscription: subscription,\n      name: `${platform.name}(${platform.version})`,\n\
    \      platformName: platform.name,\n      platformVersion: platform.version,\n\
    \      platformLayout: platform.layout,\n      platformOS: platform.os,\n    \
    \  platformDesc: platform.description\n    };\n\n    // POST the data to the server\n\
    \    fetch(serverURL, {\n      method: 'POST',\n      headers: { 'Content-Type':\
    \ 'application/json' },\n      body: JSON.stringify(data)\n    })\n    .then(response\
    \ => {\n      console.log(`Received response from the server`);\n      if (response.status\
    \ == 201) {\n        console.log('Subscription submitted');\n        response.json()\n\
    \        .then(data => {\n          console.log(`UUID: ${data.uuid}`);`\n    \
    \      localStorage.setItem(UUID_KEY, data.uuid);\n          resolve();\n    \
    \    });\n      } else {\n        Swal.fire('POST Error', response.statusText,\
    \ 'error');\n        reject(response.statusText);\n      }\n    });\n  } else\
    \ {\n    reject('Missing endpoint value');\n  }\n});\n```"
