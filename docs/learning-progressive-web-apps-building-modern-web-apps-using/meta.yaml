  md: '# Chapter 8 Assessment, Automation, and Deployment


    When you click the Options button, Chrome opens a dialog allowing you to set the
    scope for the audit performed by the extension, as shown in Figure 8.2. All we
    care about right now is the PWA report, so enable the Progressive Web App option
    and disable all others, then click the OK button to return to Lighthouse. You
    can come back later and try out the other options.


    ![](bbox=[0.122, 0.195, 0.552, 0.383])


