    # Claiming Additional Browser Tabs


    In cases, users may have multiple instances of your app running in separate browser
    tabs. When you register a new service worker, you can apply that new service worker
    across all relevant open tabs. To do this, in the service worker''s activate event
    listener, add the following code:


    ```

    // apply this service worker to all tabs running the app

    self.clients.claim();

    ```


