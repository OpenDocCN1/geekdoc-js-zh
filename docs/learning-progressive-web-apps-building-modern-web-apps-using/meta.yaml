- img_proc: false
  md: 'Next, at the bottom of the file, add the following code:


    workbench.routing.registerRoute(

    /.(?:png|svg|js|css|html)$/,

    new workbench.strategies.StaleWhileRevalidate()

    );


    This uses a regular expression to apply the StaleWhileRevalidate caching strategy
    to all .png, .svg, .js, .css, and .html files for the app. This is a simple but
    effective approach to caching app resources and should cover most web resource
    types.


    If you have other file types in your app, you can add the resource''s file extension
    to the regular expression.


    When you load the app in the browser and look at the cache storage, as shown in
    Figure 9.5, you''ll see that all matching files are cached.


