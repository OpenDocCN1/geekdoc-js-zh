  md: '# Send Data from a Service Worker to a Web App


    To send data from a service worker to a web app window, the process is a little
    more complicated. That I said web app window instead of web app. Because it''s
    easy for a web app to send data to a service worker, since there''s only one service
    worker. On the service worker side, it can send data to any browser window or
    tab running the web app serviced by the service worker. Because of that, the service
    worker must do extra work to figure out which window get the message.


    > Note\This is probably a good time to remind you that the browser wakes the service
    worker to process the message from the web app. The service worker therefore has
    a limited window where it knows about the sender of the message. Once the service
    worker finishes processing the message, the browser shuts the service worker down
    and it forgets it knew about the sender and the message it sent.


    The browser maintains a list of the clients windows served by the service worker
    in the service worker''s clients object. Service worker needs the ID for the sending
    window to send a message back to the window''s event. Fortunately, the service
    window includes that value in the message event''s source.id property. In its
    simplest form, the service worker can send a message back to the window using
    the following code:


    ```

    self.clients.get(event.source.id).then(client => {

    client.postMessage(DATA_OBJECT);

    });

    ```


    Knowing the service worker has access to an object storing array of all the client
    windows served by the service worker, a service worker can send a message to every
    associated browser window using the following code:


    ```

    self.clients.matchAll().then(clients => {

    clients.forEach(client => {

    client.postMessage(DATA_OBJECT);

    }));

    ```


    If the browser has the web app open in other windows or tabs, we can use this
    approach to reset each window to the correct state when one window subscribes
    or unsubscribes to notifications. Open the project''s chapter -07/public/sw.js
