    so it doesn''t know you''ve already loaded the database in the feedback page.
    You must explicitly load it in the service worker as well.


    The result should look like this:


    ```

    self.addEventListener(''install'', event => {

    // fires when the browser installs the app

    // here we''re just logging the event and the contents

    // of the object passed to the event. the purpose of the event

    // is to give the service worker a place to set up the local

