    # PWABuilder


    When you get started building PWAs, Google''s Lighthouse is a great tool to help
    you understand what you must do to make it a PWA and validate your work as you
    do it. What building PWA developers really need is something that helps them do
    the work to convert an app into a PWA. To address that need, Microsoft created
    the open source PWABuilder.


    With Lighthouse, you can use PWABuilder to scan your web site to determine what
    must be done to make it into a PWA, but PWABuilder takes it step further and actually
    gives you the code you need to convert the web app to a PWA. You can even use
    PWABuilder to use your PWA to generate native apps for deployment to Android,
    iOS, macOS, and Windows devices.


    Microsoft also has a command-line version of PWABuilder that you can use to validate
    app manifest tests and generate apps for deployment to Android, iOS, macOS, and
    Windows devices.


