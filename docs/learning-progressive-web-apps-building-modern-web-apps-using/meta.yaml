    # Creating an Environment to Test the App on a Physical Device or Device Emulator/Simulator


    If you point a mobile device browser to https://learningwa.com/topcalc, you can
    test installing the app on the device. This is because the version of the app
    fulfills many of the requirements for the app to be installable:


    +   - Includes a web manifest that defines a minimum set of properties (a short-name
    and/or name, icons reference icons at 192 and 512 pixels, a start_url, and display
    property of fullscreen, standalone, or minimal-ui).

    - Has a registered service worker with a fetch event handler.

    - Is served over HTTPS (or localhost when testing).


    The first two are covered by the manifest and service worker files, but the last
    requirement that list can be done only if you have an SSL/TLS certificate installed
    in the local web server running on your development workstation or you''re hosting
    the app via a service provider that provides the certificate.


    There''s an and relatively inexpensive way to set this up yourself. All you need
    is a domain (I get from Google Domains $12 each) and a hosting provider. For the
    Learning Progressive Web Apps, I''m hosting the app at Netlify, which offers a
    free hosting package that''s perfect for your testing. All you must do is point
    Netlify at your project''s GitHub repository and it will host the app for free.
    Once you configure your domain to the Netlify servers and set an SSL/TLS certificate
    for the domain, you''re all set. When you hit the domain from the browser on an
    Android device (iOS doesn''t support installing PWAs yet) the Install button will
    appear, and you can install the app.


    The reason I''m not proposing you install a self-signed certificate in your local
    web server is that you must generate your own SSL certificate, which creates all
    sorts of trust issues in the browser. I don''t want to get into all that in this
    book (it''s about PWAs, not configuring SSL/TLS certificates).


