    # Observing a Service Worker Change


    In the previous section, I showed how to claim service worker control over other
    browser tabs running the same web app after a new service worker activation. In
    this case, you have at least two browser tabs running the same app, and one new
    version of the service worker was just activated.


    To enable the app running in the other tabs to recognize the activation of the
    new service worker, add the following event listener to the bottom of the project''s
    sw.js file:


    ```

    navigator.serviceWorker.addEventListener(''controllerchange'', () => {

    console.log("Hmm, we''re operating under a new service worker");

    });

    ```


    The service worker controller event fires when the browser detects a new service
    worker in play, and you use this listener to inform the user or force the cache
    to reload.


    # Forcing a Service Worker Update


    In the world of single-page apps (SPAs), browsers load the framework of a web
    app once, and then app swap the variable content as needed while the user works.
    These apps don''t get reloaded much because users don''t need to refresh. This
    is kind of a stretch, but if you''re doing frequent development on the app or
    know you''re going to update your app''s service worker frequently, the service
    worker''s registration object (reg in all the source code examples so far) provides
    a way to request an update check from the app''s code


    To enable this, simply execute the following line of code periodically to check
    for updates:

    reg.update();'
