  md: '# xiv Preface


    I created a public web site for the book at https://learningpwa.com. I''ll publish
    errata and, hopefully, related content over time. Forestalling any complaints,
    as I write this, the site isn''t a PWA. It isn''t a PWA because it doesn''t need
    to be a PWA. It''s just a marketing landing page for the book, and there are no
    browser notifications I want to send to visitors, nor is a need to cache the site''s
    content for increased performance and offline use. Just because I can make the
    site into a PWA doesn''t mean I should. Use the power of PWAs only for those sites
    that really need them.


    Two of the three sample apps from the book are published online. The first is
    the Calculator from Chapter 2, which you can access at https://learningpwa.com/tipcal/.
    The other is the PWA News site from Chapters 3, 4, and 5—you can find that at
    https://pwa-news.com. The Learning Progressive Web Apps is a static site hosted
    at Netlify so that one will probably stay active as long as the book is published.
    The PWA News site requires resources (server-side is a node.js application), I''ll
    leave the site up for the server as long as there is interest in the book. Eventually,
    I''ll shut it down, but the full source for the server is included with the book''s
    source code, so you''ll always be able to run a local copy of the server or host
    the site somewhere else yourself.


    That''s it! This preface contains everything I wanted to tell you about the book.
    I believe in PWAs and think they are the future of mobile app development, so
    that''s why I worked to put this book into your hands. I really enjoyed writing
    it, and I hope you enjoy reading it as much or more.


