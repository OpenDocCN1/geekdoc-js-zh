  md: "Using a message channel in a web app looks like this:\n\n```\nconst messageChannel\
    \ = new MessageChannel();\nmessageChannel.port1.onmessage = function (event) {\n\
    \  console.log('Message received on channel');\n  // doing something with the\
    \ message\n}\n```\n\n```\n// send the message to the service worker\nnavigator.serviceWorker.controller.postMessage(DATA_OBJECT,\
    \ [messageChannel.port2]);\n```\n\nStart by creating the message channel, then\
    \ define an event listener for the messages sent to the side of the channel using\
    \ port 1. Finally, send the message to the other participant, passing in port\
    \ 2 as the second parameter to postMessage. It doesn't matter which ports you\
    \ use: all that matters is the one you use for each of the communication channel\
    \ and ports that use exclusively on that end of the conversation.\n\nIn the service\
    \ worker, the event handler handles the value in .ports[0] to send a response\
    \ back to the web app. The value .ports[0] contains the value app passed in the\
    \ second parameter to the call to postMessage.\n\n```\nself.addEventListener('message',\
    \ function (event) {\n  console.log('Sw: Message event fired');\n  let responsePort\
    \ = event.ports[0];\n  // send a message back to the web app using\n  responsePort.postMessage('Some\
