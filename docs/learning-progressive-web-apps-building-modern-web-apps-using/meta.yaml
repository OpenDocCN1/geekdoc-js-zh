  md: "# Cache Management\n\nWe updated our service worker so it caches the main resources\
    \ the app uses, but what do you\nwhen you update your app? How do you get the\
    \ new versions of the app's resources into the\ncache? In this section, we discuss\
    \ strategies for managing your local cache before we get back into\ncaching strategies\
    \ in the sections that follow.\n\nThe first question we must answer as the issue\
    \ of cache management is, How can\napp recognize that there's a new version of\
    \ the web app? In Chapter 2, “Web App Manifest Files,”\nI mentioned that the browser\
    \ downloads the service worker every time you reload the app and\nchecks to make\
    \ sure it is the one currently installed in the browser. If it's different (if\n\
    it changes by just one byte), the browser parses the service worker, executes\
    \ it, and completes\nthe installation and activation process for the downloaded\
    \ service worker. This process gives us\nuseful option: at the top of the service\
    \ worker, add a small variable or constant like this:\n\n```\n// service worker\
    \ version number\nconst SW_VERSION = 1;\n```\n\nThis constant defines a service\
    \ worker version identifier, and when you publish a new ver-\\sion of the app,\
    \ you simply increment this value. With that in place, the browser detects the\
    \ new\nservice worker version, installs the updated service worker, and rebuilds\
    \ the cache with the new\nresources for the app.\n\n> The browser doesn't detect\
    \ the service worker version change because it reads that variable.\nit detects\
    \ the service worker version change because it does a byte comparison between\n\
    t active service worker and the one loaded by the app. If they're different, the\
    \ browser knows\nthere's a new version to register. You could just easily toggle\
    \ the constant between two\nvalues every time you update your service worker to\
    \ get the same result.\n\nWhat if the new app version uses different file names\
    \ for app resources? What do you do now?\nWell, one option is to simply cache\
    \ the new resources and ignore the old ones using what we\nalready have in place\
    \ in Listing 4.1. The problem with that is that you'll be caching data\nyou'll\
    \ never need again, and that's wasteful (especially on mobile devices).\n\nThinking\
    \ out here for a while (no changes for you to make to the app), you could delete\
    \ the\ncache using the following:\n\n```\ncaches.delete('pwa-learn-cache').then(()\
    \ => {\n  console.log('SW: Cache deleted');\n  // do something else here...\n\
    });});\n```\n\nFrom the service worker lifecycle, we know that the current service\
    \ worker is active and still using\nthis cache. If we delete the cache under the\
    \ current service worker, who knows what would hap-\np (probably something bad).\
    \ No, there must be a better way."
