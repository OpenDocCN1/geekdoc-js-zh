    \ 6? That's true, but the service worker doesn't have a trigger that it can use\
    \ to react to the event. It must rely on the app code completing the subscribing\
    \ or unsubscribe process to notify it of the event.\n\nNow that our app informs\
    \ the service worker when subscription status changes, let's look at how the service\
    \ worker responds to the message. As you probably know, the arrival of the message\
    \ from the web app triggers an event in the service worker. To process the message,\
    \ the service worker must register the message event.\n\nOpen the project-07/public/sw.js\
    \ file and add the following code to the end of the file:\n\n```\nself.addEventListener('message',\
    \ event => {\n  console.log('SW: Message event fired');\n  console.dir(event);\n\
