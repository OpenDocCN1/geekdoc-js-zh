  md: 'We build upon the simple push client we used in Chapter 6, "Push Notifications."
    Our task in this chapter doesn''t relate to push, but the app exhibits certain
    behavior that lends itself to the topics in this chapter. For this topic, I deliberately
    didn''t try to manufacture contrived scenarios because I didn''t want to detract
    from the capabilities provided by the browser for interprocess communication.
    I leave it up to you to figure out how to apply these capabilities in your own
    apps.


    # Preparing to Code


    The work we do in this chapter revolves around adding some enhancements to the
    app used in the previous chapter. The code for the server app is available in
    the book''s GitHub repository at https://github.com/johnwargo/learning-pwa-code.
    I provided complete instructions for how to download the code and configure your
    environment in the section "Preparing to Code" in Chapter 3, "Service Workers."
    If you haven''t already completed these steps, go there and complete them first
    before picking up here again.


    Open a terminal window and navigate to the cloned project''s \learning-pwa-code\chapter-07
    folder. This folder contains the completed version of the app as the end of the
    previous chapter. Install the app''s dependencies by executing the following command:


    ```

    npm install

    ```


    Next, execute the following command:


    ```

    node generate-keys.js

    ```


    This executes a little node.js utility I wrote to generate a set of Voluntary
    Application Server Identification (VAPID) keys and write them to the configuration
    files used by the app. The utility calls the web-push module''s webpush.generateVAPIDKeys
    ( ) method, which handles the whole process¹ for us.


    As in previous chapters, I coded the server app in TypeScript, so you can use
    the new configuration files just created, you must execute the following command
    to compile to Java JavaScript:


    ```

    tsc

    ```


    With all the places in place, it''s time to start the server; in the terminal
    window, execute the following command:


    ```

    npm start

    ```


    If everything''s set up properly in the code, the server will respond with the
    following text in the terminal:


    ```

    learning-pwa-push@0.0.1 D:\dev\learning-pwa-code\chapter-07

    node ./bin/www

    ```


    +   1. You can read about the process at https://www.npmjs.com/package/web-push#usage.'
