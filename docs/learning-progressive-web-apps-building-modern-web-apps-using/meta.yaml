  md: '# Chapter 4 Resource Caching


    # Note


    The cache is an interface included with a browser''s support for service workers,
    but you can use the cache outside of a service worker if you need for other parts
    of your application.


    # JavaScript and Promises


    One of the things we haven''t spent time discussing is modern JavaScript development
    approaches and promises.² Stuffy old JavaScript used callbacks to enable asynchronous
    operation: when an app passed a function it wanted executed when the time-consuming
    completed. When you had asynchronous tasks calling other asynchronous tasks, things
    became messy. This created a situation known as callback hell³ and created very
    hard-to-read JavaScript code.


    Recent work by the JavaScript community introduced the concept of promises, a
    construct that fixes this problem. The reason JavaScript promises are important
    is that service workers and their associated cache mechanisms make heavy use of
    promises. In previous chapters, any function or method that we called promises
    were easily handled by the .then and catch methods tracked to the end of the function
    or method.


    In this chapter, we dig into topics that make heavier use of promises, so you''re
    going to have up to speed how they work. This book isn''t about promises, and
    there are a lot of resources online that cover the topic better than I can. If
    you''re not familiar and comfortable working with promises, why don''t you pick
    the book down for a little while and do some external reading on promises before
    picking this back up?


    The Cache interface exposes the following methods:


    +   add—Retrieves the resource from the network and adds the request (and associated
    response) to the cache.


    +   addA1—For an array of objects, retrieves the requested object represented
    by each object in the array and adds each to the cache.


    +   delete—Deletes the requested entry from the cache.


    +   keys—Returns a promise that resolves to an array of keys from the cache; keys
    in this case are request objects.


    +   match—Returns a promise that resolves to the response for the first matching
    request in the cache. Basically, the app passes in a request object, and this
    method returns the first matching response from the cache.


    +   matchA1—Returns a promise that resolves to an array of all request responses
    matching the specified request in the cache.


    +   put—Adds a request/response pair to the cache.


    We use most of these methods throughout the remainder of this chapter.


    +   2. https://developers.google.com/web/fundamentals/primers/promises


    +   3. http://callback.com/'
