  md: 'The SyncManager detects that it can''t complete processing a sync event, it
    waits 5 minutes and tries again. If the retry fails, the SyncManager waits 15
    minutes and tries it again, again but this time it switches the lastChance property
    from false to true. That''s not a very sophisticated algorithm; I can''t imagine
    a Phd at Google spent a lot of time on that one.


    Anyway, that''s a limitation of background sync you must be aware of and accommodate
    in your apps. If the data is important, you''re going to have to force the browser
    to retry the sync more than twice using the strategy I presented in this section.


