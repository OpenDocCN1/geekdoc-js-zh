  md: '# Introducing Service Workers


    Many other browsers support them as well; check first if you know your app''s
    target audience prefers a browser that''s not in that list.


    Depending on how web developers take advantage of service workers in their apps,
    you''ll see


    +   - **Cache content.** Google calls service workers *programmable network proxies*;
    you''ll see in this chapter and the next, you have a lot of options for controlling
    which resources the browser caches and which ones are pulled from the server when
    requested by an app. You can replace requested resources (files or data) dynamically
    at runtime using a service worker.

    - **Perform background processing.** Web apps use service workers to deliver background
    data synchronization and offline support. Service workers install in the browser,
    they''re associated with the app, but they run in the browser''s execution context.
    This means they''re available to do whenever the browser is open, even when the
    app is not loaded. They''re run in the browser''s execution context. This means
    they''re available to do whenever the browser is open, even when the app is not
    loaded. You''ll learn more about this in Chapter 5, "Going the Rest of the Web
    Offline with Background Sync" and Chapter 6, "Push Notifications."

    - **Receive push notifications.** With the right protocols and a backend server
    to send notifications, web apps use the background processing capabilities of
    service workers to enable the processing and delivery of push notifications sent
    to the app. You''ll learn more about this in Chapter 7, "Passing Data between
    Service Workers and Web Applications."


    The primary reasons browsers require a TLS connection to install and enable a
    service worker are those included in the bulleted list you just read. Considering
    all you can do with the capabilities described in that, the service worker has
    complete control over data coming in and out of the app. Browsers require the
    TLS connection to ensure that the app and service worker load from the same location.


    Without a TLS connection and the requirement that the service worker loads from
    the same location as the app


    # The Dread Application Cache


    Earlier, I said, "Web apps use service workers to add additional capabilities
    to the app, capabilities that aren''t generally available to web apps," but that
    wasn''t exactly true. Web developers have been able to implement resource caching
    in web apps for some time now, though an old feature in many browsers called the
    Application Cache (or just AppCache).


    Unfortunately, AppCache is a pretty horrible technology, as famously described
    in Jake Archibald''s "Application Cache is a Doucache." it is so bad that the
    AppCache page at the above link starts with two warnings against using it in your
    apps. Furthermore, it also warns that the technology has been removed from many
    browsers and the feature may cease to work at any time. How''s that? Don''t use
    it.


    +   3. https://developer.mozilla.org/en-US/docs/Web/HTML/Using_the_application_cache

    4. https://alistapart.com/article/application-cache-is-a-doucache/'
