  md: "```\nrequest.onerror = function (event) {\n  // unable to create transaction\n\
    \  reject(db.error);\n}\n);\n};\n```\n\n# Refresh on Success\n\nIn the submitFeedback\
    \ function in feedback.js, the code automatically refreshes the feedback data\
    \ after successfully posting the data to the server. The function can do this\
    \ because the code submitting the data to the server and refreshing the feedback\
    \ data are both available to the Feedback page. When we switch to background sync\
    \ for this, we have the ability to refresh the page because the page never knows\
    \ that the data was successfully submitted. The service worker does, but it can't\
    \ directly refresh the page on success (more on this later).\n\nIn the background\
    \ sync version of the app, the success dialog suggests a page refresh after queuing\
    \ the data in the hope that the data will update by the time the user refreshes\
    \ the page. If the browser is offline or there's some other issue with data upload,\
    \ refreshing the page is a waste of time.\n\nThere are other options.\n\nWhat\
    \ I could have done, not chose to, to check for network connectivity when the\
    \ user clicks the Store Sentiment button, but can also postFeedback if there's\
    \ network connectivity and queueFeedback when there isn't. This approach would\
    \ give the app online/offline feel, and it's probably the best solution, but this\
    \ chapter is all going offline, I decided to go in offline.\n\nI mentioned earlier\
    \ that the browser cannot directly refresh the page, and that was almost a lie\
    \ (sorry). In the next chapter, you'll learn about a mechanism that allows service\
    \ workers to send messages to a browser, and you could easily use this feature\
    \ to refresh the web app after uploading data. I left that topic out of this chapter\
    \ because it makes more sense in the next chapter and would have thoroughly complicated\
    \ this chapter. If you want extra credit, after finishing the next chapter, come\
    \ back and implement it and post your results for some others.\n\nThe complete\
    \ service worker for this example is in the project folder's \\public\\chapter-codeDb.js\
