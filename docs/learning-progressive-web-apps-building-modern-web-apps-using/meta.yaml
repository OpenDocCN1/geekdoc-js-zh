- img_proc: false
  md: 'This is essentially doing the same thing but applying a Unix convention for
    specifying the current folder.


    Other examples show doing something like this:


    ```

    "start_url": "/utm_source=homescreen",

    ```


    or this:


    ```

    "start_url": "?source=pwa",

    ```


    These examples take a query parameter on the URL, enabling the app to distinguish
    whether the app was loaded directly from the hosted site via browser or launched
    as an installed PWA. For example, when loading an app from the server using https://myapp.com,
    if the query string doesn''t include the parameter, the app knows the request
    comes from a URL typed or clicked in the browser. When the user launches the PWA
    version, the extra query string tells the app it''s a PWA, and based on that knowledge,
    the app can then do differently if it wants.


    The query string parameter doesn''t have to be anything special; you could use
    /pwa=1 or /pwa=99 if you wanted. How this is up to you; you could change the page
    content to show it is a PWA (like changing the background color or "PWA") to the
    first heading.


    Later, when we''re adding a web manifest to the Tip Calculator app, I''ll have
    you install a local web server to use for testing. The server doesn''t enable
    you to the setup property for the server, so I changed the start_url property
    to


    ```

    "start_url": "index.html?source=pwa",

    ```


    This forces the browser to open the folder''s index.html file and enables my PWA
    to install correctly in a variety of environments.


    On the web site, I have the Tip Calculator app serving from a subfolder of the
    site, https://learningpwa.com/tipcalc/, so I have to do things differently. For
    my hosting environment, I had to configure my manifest file with the following:


    ```

    "start_url": "/tipcalc/index.html?source=pwa",

    ```


    ```

    "scope": "/tipcalc/",

    ```


    In this example, I had to specify the target folder for my app plus the scope
    parameter pointing to the same folder. If I didn''t have the scope parameter,
    the app would install, but when I launched it, the hosted site 404 (not found)
    error page displayed instead of the Tip Calculator.


    As Gaunt and Kilner describe it:


    The scope defines the set of URLs that the browser considers to be within your
    app, and is used to decide when the user has left the app. The scope controls
    the URL structure that encompasses all the entry and exit points in your web app.
    Your start_url must remain within the scope.


    In this case, I''m using the scope property to tell the installed app that the
    root of all its code begins at the tipcalc folder.'
