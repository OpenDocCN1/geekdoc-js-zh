  md: "# Subscribing to Notifications\n\nIn this section, we subscribe the browser\
    \ for notifications with the push server and share the subscription details with\
    \ the server so it can send notifications to the browser later. At this point\
    \ we use the server's VAPID public key, which we put in the project's chapter-06\\\
    publicjs\\config.js file earlier in the chapter.\n\nOpen the project's chapter-06\\\
    publicindex.html file and add the following lines to the bottom of the file's\
    \ body section\n\n```\n<!-- Push configuration file -->\n<script src=\"config.js\"\
    ></script>\n```\n\nThis makes the file Config object available to the web app.\n\
    \nNext, open the project's chapter-06\\publicjs\\index file and add the following\
    \ code to the top of the file (I'll explain what it's used for):\n\n```\nconst\
    \ VAPID_KEY = 'subscription-uuid';\",\n```\n\nWith changes in place, let's talk\
    \ through the subscription process and add the required code to the project's\
    \ .js file. In the following paragraphs, and the rest of the chapter, I'll describe\
    \ the building blocks we need, then ask you to add complete code blocks to the\
    \ project. I apologize if this is confusing; use the finished files in the project's\
    \ chapter-06\\publicjschapter-code folder if that helps.\n\nTo subscribe for notifications,\
    \ the web app must execute the registration.pushManager.subscribe method. Getting\
    \ access to the registration object and setting up the parameters for the method\
    \ takes a bit of work we must do first.\n\nThe browser doesn't have direct access\
    \ to the registration object, but the app's service worker does, so we can get\
    \ the object through the following:\n\n```\nnavigator.serviceWorker.ready.then(registration\
    \ => {\n\n})\nvar subOptions = {\n  userVisibleOnly: true,\n  applicationServerKey:\
    \ urlBase64ToArray(Config.VAPID_PUBLIC)\n};\n```\n\nThe userVisibleOnly is the\
    \ app's property to the browser that will display a notification for every push\
    \ item it sent to. There's only one supported value, and that's true. The notification\
    \ subscription won't work with any other value assigned to the property.\n\nThe\
    \ applicationServerKey is a specially formatted version of the server's public\
    \ key, which we have available through the Config.VAPID_PUBLIC property in the\
    \ project's config.js file."
