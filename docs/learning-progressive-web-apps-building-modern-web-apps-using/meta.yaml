  md: "# Implementing Additional Caching Strategies\n\nThe following code implements\
    \ a service worker fetch listener that caches every request made by the server.\
    \ What I found in my testing was that it cached every resource request, even the\
    \ API request to the server to retrieve new data. What it didn't do was cache\
    \ the image files—automatically, because I did not anything special to make that\
    \ happen. Not only did it cache the image files for, the web app still displayed\
    \ the image files for I disabled the network and reloaded the page. Surprised?\
    \ Yeah, me. Take a moment to look through the code, and I'll explain everything\
    \ on the other side.\n\n```\nself.addEventListener('fetch', event => {\n  console.log(`SW:\
    \ ${event.type} ${event.request.url}`);\\n  // fires whenever the app requests\
    \ a resource (file or other)\n  event.respondWith(\n    // try to get the file\
    \ from the network\n    fetch(event.request)\n    // we, we got it\n    .then(response\
    \ => {\n      // do we have a valid response?\n      if (response && response.status\
    \ == 200) {\n        // clone the response; it's a stream, so we can't\n     \
    \   // write to the cache and return it as well\n        let responseClone = response.clone();\n\
    \        // try to open the cache\n        caches.open(CACHE_NAME)\n         \
    \ // if we successfully opened the cache\n          .then(function (cache) {\n\
    \            console.log(`SW: Adding ${event.request.url} to the cache`);\\n \
    \           // then put our cloned response\n            cache.put(event.request,\
    \ responseClone);\n          });\n        // return the original response\n  \
    \      return response;\n      } else {\n        // return whatever error response\
    \ we got from the server\n        return response;\n      }\n    })\n    .catch(()\
    \ => {\n      // rats, network resources not available\n      // do we have it\
    \ in the cache?\n      console.log(`SW: Trying Cache ${event.request.url}`);`\n\
    \n      return caches.match(event.request)\n        .then(response => {\n    \
    \      // if it is, then return the cached response\n          // object from\
    \ the cache\n          if (response) {\n            console.log(`SW: Return Cache\
    \ ${event.request.url}`);`\n\n            return response;\n          }\n    \
    \    })\n    });\n  }); // catch\n});\n```"
