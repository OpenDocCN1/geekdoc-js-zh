    \ need, such as the sw-start.js and workbox-config.js files. Forunately, there's\
    \ a solution. The workbox-config.js supports a globIgnores property you can use\
    \ to list the files or specifications for what you ignored during the cache manifest\
    \ generation. To omit those files, add the following property to the workbox-config.js:\n\
    \n```\nglobIgres: [\n  `sw-start.js`,\n  `workbox-config.js`\n]\n```\n\nYou'll\
    \ find the complete contents for the file in Listing 9.3.\n\n# Listing 9.3 Workbox\
    \ Configuration File: workbox-config.js in tc\n\n```\nmodule.exports = {\n  \"\
    globDirectory\": \".\",\n  \"globPatterns\": [\n    `*.{css,png,html,ico,svg}`\n\
    \  ],\\n  \"globIgnores\": [\n    `*/sw-start.js`,\n    `*/workbox-config.js`\n\
    \  ],\n  \"swDest\": \"sw-js\"\n};\n```\n\n9.3 shows a few errors as well, and\
    \ apparently not everything the app is cached correctly."
  merge: -1
