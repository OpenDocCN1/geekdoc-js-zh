  md: '# Remote Notification Architecture


    +   - The subscribing web app sends the subscription object (plus whatever additional
    information it thinks is pertinent) to the backend app where it''s stored away
    for future use when sending notifications.


    The process (except for requesting permission) is highlighted in steps 1 through
    3 in Figure 6.5.


    ![](bbox=[0.142, 0.215, 0.878, 0.673])


    Figure 6.5 Browser Push Notification Process


    # Note


    To protect from rogue notifications, the app back end sends all notification requests
    in encrypted format. To do this, the web app generates a set of encryption keys
    to use in its interaction with the push service. The web app includes the public
    key in the subscription request sent to the push service.


    When the web app back end sends notification requests to the push service, it
    encrypts the request using the server''s private key. Since the push service has
    the public key (from the subscription request), it can decrypt the message and
    know for certain the request was sent by the right server.'
