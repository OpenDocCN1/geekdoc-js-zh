  md: 'This creates a theDB object pointing to an open database. If the database doesn''t
    exist when this code executes, the browser doesn''t have access to the browser''s
    window object, so to create/open an IndexedDB database, use the following code:


    ```

    var theDB = self.indexedDB.open(DATABASE_NAME, 1);

    ```


    We count that runs in both locations, because both the web app and the service
    worker open the database, so we''ll use the latter example for the PWA new.


    Remember, there are no promises here, so to report or act on database operation
    success or failure, you must create callback functions. For IndexedDB operations,
    the two you''ll care the most about are the onsuccess and onerror callbacks:


    ```

    theDB.onsuccess = function (event) {

    console.log(''Open Success'');

    // get a handle to the database

    let db = event.target.result;

    };

    ```


    ;


    ```

    theDB.onerror = function (event) {

    console.log(''Open Error'');

    };

    ```


    ;


    The success callback gets an event object you can use to get a handle to the database,
    as shown in the example. If you keep a reference to the theDB object, you can
    also access the database later from


    let db = theDB.result;


    The database object also supports other callback options:


    ```

    theDB.onclose = function (event) {

    console.log(''Closing database'');

    }


    ```


    ```

    theDB.abort = function (event) {

    console.log(''Aborting...'');

    };

    ```


    You may have noticed that I passed a number to the call to the IndexedDB open
    method. That parameter specifies the version number for the database. When you
    open an IndexedDB database, the browser checks the version number provided against
    an existing database; if they''re different, as will be the case when you create
    a new database, the browser fires the onupgradeneeded callback. This callback
    gives app an opportunity to make any database changes required by the new version.


    ```

    theDB.onupgradeneeded = function (event) {

    console.log(''Database needed'');

    // do something interesting

    };

    ```'
