    folder. This folder contains a relatively empty version of the web app we''ll
    build out as we work through the chapter. Install all the dependencies by executing
    the following command:


    ```

    npm install

    ```


    This command uses the Node Package Manager (npm) to install Node.js modules by
    the server.


    # Generating Encryption Keys


    The notification process requires a set of encryption keys: public and private
    keys used to ensure the integrity of the notification process. Browser notifications
    use Voluntary Application Server Identification (VAPID) for Web Push encryption
    keys to encrypt communication with the push service. I don''t need to go into
    detail about these keys and how they''re made, knowing that


