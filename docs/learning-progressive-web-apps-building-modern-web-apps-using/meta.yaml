    # Dealing with Last Chances


    Early on, I Mentioned that if background sync fails, the browser will retry it
    later. What I didn''t say, and what is not documented, how many times the browser
    will retry until it gets right. I heard somewhere that browsers use an exponential
    backoff algorithm to control how frequently they retry. Looking around to understand
    this better, I came across an article Chrome, the Background Sync API and Exponential
    Backoff, which looks at this specific question.


    Thinking about this problem, you''d think the browser would retry 5, 10, or 20
    times before abandoning a sync event, but it turns out that browsers such as Chrome
    retry twice before abandoning. To quote a line from Kevin Kline''s in A Fish Called
    Wanda: "Disappointed!"


    For our simple PWA News Back page, trying to deliver the data only three times
    isn''t a good deal. For our transactional sync event as a chat or bank app, I
    really want more. The good news is that the browser''s SyncManager tells you when
    it''s about to abandon the request. The following listing contains a quick copy
    and paste of the object passed to the service worker''s sync event listener. In
    there you should see the lastChance property. It''s false, because it was grabbed
    from a first pass to processing the sync event.


    ```

    bubbles: false

    cancelBubble: false

    cancelable: false

    composed: false

    currentTarget:ServiceWorkerGlobalScope(clients: Clients, registration:

    ServiceWorkerRegistration, onactivate: null, fetch: null, onstall: null, ...)

    defaultPrevented: false

    eventPhase: 0

    isTrusted: true

    lastChance: false

    path: [

    returnValue: true

    srcElement:ServiceWorkerGlobalScope(clients: Clients, registration:

    ServiceWorkerRegistration, onactivate: null, fetch: null, onstall: null, ...)

    tag: "feedback"

    target: ServiceWorkerGlobalScope(clients: Clients, registration:

    ServiceWorkerRegistrationRegistration, onactivate: null, fetch: null, onstall:
    null, ...)

    timeStamp: 0

    type: "sync"

    __proto__: SyncEvent

    ```


    When the browser''s SyncManager has enough with this sync event, it switches lastChance
    to true so you''ll know what''s coming and can act the way that makes the most
    sense for your app.'
