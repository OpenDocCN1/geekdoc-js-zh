    # Node.js


    I built the PWA News site using Node.js and Express (a web framework for Node.js).
    It hosts the static PWA News web site plus the application programming interface
    (API) used by the web app. If your development workstation already has Node.js
    installed, skip ahead to the next app. If not, hop over to https://nodejs.org
    and follow the instructions to install the client on your development workstation.


    To confirm that you have Node.js installed, open a new terminal window and execute
    the following command:


    ```

    node -v

    ```


    If the terminal returns a version number (mine v10.16.0), then Node.js is properly
    installed. If you see an error message, then you have some work to do resolving
    the error before continuing.


    # TypeScript


    With Node.js installed, now it''s time to install the TypeScript compiler. In
    the terminal window, execute the following command:


    ```

    npm install -g typescript

    ```


    This installs the tsc command you''ll use many times through the remainder of
    the book to compile the web server app TypeScript code into JavaScript.


