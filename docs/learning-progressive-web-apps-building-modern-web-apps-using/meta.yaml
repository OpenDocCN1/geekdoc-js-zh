  md: '# 4


    # # Resource Caching


    In Chapter 3, “Service Workers,” we added a service worker to a web app and learned
    all about the service worker lifecycle. The service worker didn’t do much of anything,
    but at least we got one working in the app. In this chapter, we cover many of
    the ways you can cache web app content using a service worker.


    Web apps use a cache for two reasons: to speed up app loading and the so, or parts
    of the app, function when the system running the app does not have connectivity.
    Launching a web app using cached resources is one of the things that makes Progressive
    Web Apps (PWAs) perform more like native mobile apps. When the UI appears quickly,
    users don’t mind too much if it takes a little longer to populate the page, whereas
    users get frustrated when it takes a long time to load the app UI and even longer
    to load its data.


    The caching strategy you pick depends on nature of the web app you’re writing
    and how much of it you available when the browser running the app is offline.


    # ## Service Worker Cache Interface


    One of the core enabling service workers is the browser’s Cache Interface.¹ This
    cache provides service workers with a built-in way to cache resources used by
    a web app. The cache is a local repository of request/response pairs; the request
    is an object representing the resource from the web app, and the response is an
    object representing the resource from the server for that specific resource.


    With a properly populated cache, a service worker can respond to resources from
    the cache and the app doesn’t know any better; as far as the app is concerned,
    those resources came directly from the web worker. The cache doesn’t just cache
    the server files (for example, .css, .html, or .js files), it caches the full
    server response for the requested resource (which includes headers, other stuff,
    plus the actual requested file).


    +   1. https://developer.mozilla.org/en-US/docs/Web/API/Cache'
