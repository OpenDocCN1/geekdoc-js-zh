  md: '# Remote Notification Architecture


    Before we jump into all the examples and code, let''s talk about how push works.
    The ability to send notifications to browsers requires three things:


    +   - A browser capable of receiving, processing, and displaying notifications.

    - An app to send notifications to one or more browsers. This is your app backend.

    - Some hardware/software solution to manage delivering notifications to the browser—a
    push service.


    The first one makes a lot of sense; the forced split between the second and third
    requirements causes some soften


    The browser is a container for running other people''s code, and consequently,
    there''s a risk that ill-behaved or malicious code could wreak havoc on the user''s
    system. HTML, CSS, and JavaScript are properly sandboxed by the browser, and there
    are limits on how they can affect anything outside of the current app. Service
    workers change that, of we already talked about the extra security surrounding
    them.


    Early on, many browser vendors allowed developers to push extensions that tweaked
    the inner workings of the browser, but over the years, browsers became increasingly
    restrictive in what they would allow inside the guts of the browser. To deliver
    a secure environment for notifications, support for them must be a core component
    of the browser, available outside of your app''s context and able to wake up a
    service worker when necessary.


    Sending notifications to browsers must be streamlined as well. Backend won''t
    have direct connections to the browser, especially when the app is not loaded
    in the browser. The browser requests a page, then closes the connection. Yes I
    know you could use WebSockets to do this, but who wants to maintain thousands
    or millions of socket connections to target browsers? When a browser has ten or
    more service workers listening for notifications, do you really want backend maintaining
    a connection into your browser? No, you don''t.


    So, to make this possible and minimize the impact on the browser and the computer
    system or smartphone running the browser, the push specification uses an intermediate
    server process to manage subscription and notification delivery. That server runs
    in the cloud and typically comes from the browser vendor. When a web app subscribes
    to notifications, the browser knows exactly where to register the subscription—to
    its own cloud push service.


    Now that you know why push works works it, let me show you how it works, starting
    with the subscription process


    +   - A web app asks the user permission to display notifications in the browser.
    Due to the invasive nature of browser notifications, the notification standard
    requires user approval before any notifications can be sent to the browser.

    - If approved, the web app subscribes the app for notifications through the browser''s
    push service.

    - The push service subscribes the app/browser combination, stores the information
    internally, then returns a subscription object that contains everything a backend
    app needs to send notifications to this app running on its subscribed browser.'
