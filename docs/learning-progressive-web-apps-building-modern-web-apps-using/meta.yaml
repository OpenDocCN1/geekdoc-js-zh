  md: "This tells the web app to load a JavaScript file that registers the service\
    \ worker for us. Next, let's create that file. Create a new file public/js/sw-reg.js\
    \ and populate the file with the code shown in Listing 3.2.\n\n# Listing 3.2 PWA\
    \ News sw-reg.js File\n\n```\n// does the browser support service workers?\nif\
    \ ('serviceWorker' in navigator) {\n  // then register our service worker\n  navigator.serviceWorker.register('/sw.js')\n\
    \  .then(reg => {\n    // display a success message\n    console.log('Service\
    \ Worker Registration (Scope: ${reg.scope})');\n  })\n  .catch(error => {\n  \
    \  // display an error message\n    let msg = 'Service Worker Error (${error})';\n\
    \    console.error(error);\n    // display a warning dialog (using Sweet Alert\
    \ 2)\n    Swal.fire('', '', 'error');\n  });\n} else {\n  // happens when the\
    \ app isn't served over a TLS connection (HTTPS)\n  // or if the browser doesn't\
    \ support service workers\n  console.warn('Service Worker not available');\n}\n\
    ```\n\nThe code here is not too complicated; it all centers around the call to\
    \ navigator.serviceWorker.register. The code first checks to see if the serviceWorker\
    \ object exists in the navigator object. If it does, then browser supports service\
    \ workers. After the code verifies it can register the service worker, it goes\
    \ through the call to navigator.serviceWorker.register.\n\nThe register method\
    \ returns a promise, so the code includes then and catch methods to act on whether\
    \ the installation succeeded or failed. If it succeeds, it tosses a simple message\
    \ to the console. If the call to register fails (with the catch method), we warn\
    \ the user with an alert dialog.\n\nTwo potential error conditions exist here:\
    \ if the browser doesn't support service workers and if service registration fails.\
    \ When the browser doesn't support service workers, I log a simple warning to\
    \ the console (using console.warn). I don't do anything special to warn the user\
    \ because this is progressive enhancement, right? If the browser doesn't support\
    \ service workers, the user continues to use the app as is, with no capabilities\
    \ provided through service workers.\n\nOn the other hand, if registration fails,\
    \ the code is broken because we already know the browser supports service workers),\
    \ and I want to let you know more obviously with an alert dialog. I did this because\
    \ you're learning how this works, and I wanted the error condition to be easily\
    \ recognized. I probably wouldn't do this for production apps because if the service\
    \ worker doesn't register, the app simply falls back to the normal mode of operation."
