  md: '# Wrap-Up


    In this chapter, I showed several ways to pass data between a web app and the
    service worker that services it. With this skill, you have a simple way to manage
    content across multiple browser windows through a service worker.


    This is the last service worker chapter in the book. The remaining chapters deal
    with the tools available to PWA developers to make their lives easier.'
