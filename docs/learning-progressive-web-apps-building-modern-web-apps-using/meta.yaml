    \ in the project's index-71.js and service worker-71.js files in the project's\
    \ chapter-07\\public\\chapter-code\\ folder.\n\n# Two-Way Communication Using\
    \ MessageChannel\n\nThe browser and service worker also support a two-way communication\
    \ channel using postMessage; this approach uses the browser's MessageChannel interface.\
    \ When you create a message channel, you essentially create two communications\
    \ ports: port1 and port2; and each participant uses one of the ports exclusively\
    \ to send messages and data to the other.\n\nA message channel was essentially\
    \ designed to let two parts of a web app (for example, the app's main page and\
    \ an iframe embedded in it) to create a channel and communicate across it. When\
    \ used with service workers, things get a little weird because service workers\
    \ don't run all the time—they're awakened when the browser needs them. Service\
    \ workers don't maintain state, so a message channel is active only until the\
    \ service is shut down by the browser.\n\n+   1. https://developer.mozilla.org/en-US/docs/Web/API/MessageChannel"
