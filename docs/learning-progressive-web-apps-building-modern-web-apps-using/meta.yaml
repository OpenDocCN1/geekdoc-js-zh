  md: '# #2 Web App Manifest Files


    One of the features of Progressive Web Apps (PWAs) is the ability to configure
    a web app so users can install the app on the device running the app. Mobile users
    have been able to do this sort of thing for a long time, through the *Save to
    Home Screen* option available in mobile browsers, but PWAs deliver a better user
    experience.


    The component that delivers this capability to PWAs is an app’s web app manifest.
    In this chapter, I introduce web app manifests and show you how you can use them
    to make your web app installable.


    > Note

    Throughout the remainder of the book, I refer to a web app manifest by its full
    name but also refer to it as a *manifest* or *manifest file*.


    For those who know a bit about manifests and PWAs, the placement of this chapter
    may seem odd because it takes more than just a manifest file to make a web app
    installable. We talk in more depth about the requirements for installability,
    but an app must meet specific criteria and have a manifest file and a service
    worker to be installed. The rest of the book covers service workers detail, or
    rather than such a chapter that isn’t about service workers in the middle of the
    book, I decided to cover this topic now and leave the remainder of the book all
    about service workers.


    For the purpose of the examples in this chapter, I’ve added a simple service worker,
    to make installation possible, but I provide only coverage of the topic. You will
    get more than enough coverage in the following chapters, so I ask you to ignore
    the service worker for now with the promise that you will learn all you know later
    in the book.


    If you''re not happy with this approach, please skip this chapter and come back
    to it after you’ve completed Chapter 3, “Service Workers.”


    In this chapter, we use the first of several apps I created for this book, the
    Tip Calculator shown in Figure 2.1. It is a simple single page app (SPA) that
    renders a rudimentary tip calculator. When users open the app, they enter a meal
    cost in the input field, and the app automatically calculates several tip options
    based on the overall quality of the meal (food, service, environment, etc.).'
