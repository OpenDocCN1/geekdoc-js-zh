  md: 'Chapter 2 Web App Manifest Files


    # Making a Web App Installable


    OK, so I know adding a web app manifest file to your web app enables you to make
    the app installable; throughout the remainder of this chapter, I''ll show you
    how.


    Web App Manifest¹ is an evolving specification published by the World Wide Web
    Consortium (W3C). The specification defines "a JSON-based manifest file that centralizes
    place metadata with a web application." It describes how user agents (browsers)
    should act when a manifest is linked to a web application. As Google has the most
    to support web manifests on Chrome, it has a lot of information available on its
    Web App manifest page in an article written by Matt Gauss and Paul Kilian.


    Note


    Web app manifests are not supported in all modern browsers; in fact, as I type,
    this support is rather dismal. For example, as popular as the Safari browser is
    for iOS and macOS users, Apple still hasn''t added full support for PWAs; its
    Safari browser supports manifest files but not the events you need to install
    the PWA on the device.


    The good news is that developers frequently update their products, so your favorite
    browser should have support. The best way to tell if your app targets support
    the technology is to check the Can I use site.³ Normally, I''d include a screenshot
    of the results, but things change so quickly that it would be a waste of time
    to do so.


    For PWAs, the metadata we''re talking about are properties in the manifest file
    that define what the app looks like when it''s installed (basically just the app
    icon and title) and runs (splash screen, browser chrome options, etc.) and how
    the browser launches and runs the app when the user clicks or taps the app icon.


    We''ll get to the specific format of this file in a bit, but first let''s talk
    about how a browser decides that an app''s installable. The criteria browsers
    use to determine if a web app is installable depends on the browser. Using Google''s
    Chrome browser as an example, it looks like this:


    +   - Is not already installed on the local system.


    +   - Meets a user engagement heuristic; basically, users must look like they''re
    interested in the app.


    +   - Includes a web manifest that defines a minimum set of properties (a short_name
    and/or name, the icons array reference icons at 192 and 512 pixels, a start_url,
    and display property of fullscreen, standalone, or minimal-ui). You''ll learn
    more about these properties.


    +   - Served over HTTPS (or localhost for testing).


    +   - Has a registered worker with a fetch handler.


    ¹ https://www.w3.org/TR/appmanifestmanifest/


    ² https://developers.google.com/web/fundamentals/web-app-manifest/


    ³ https://caniuse.com/#feat=web-app-manifest'
