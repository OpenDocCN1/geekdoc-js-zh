  md: 'Developers used it because AppCache support was built into many browsers, but
    few developers were happy with it. Writing your cache implementation was problematic
    as well, for performance reasons, it must run on a separate thread, which was
    challenging in web apps as well.


    The CacheStorage⁵ API described in Chapter 4, "Resource Caching," was the community''s
    attempt to fix AppCache, and it''s one of the key technologies that make PWAs
    interesting and useful today. My apologies for lying to you, but hope now you
    see why I did.


    Of course, service workers have limitations:


    +   Service workers don''t run unless the browser is open. The web app doesn''t
    have to be open, but the browser does.


    +   Service workers don''t have access to the web app''s document model (DOM),
    but we''ll discuss workarounds for this in Chapter 7.


    The first limitation may be a big deal depending on the browser and operating
    system (OS). On many mobile devices, the browser always runs, so it''s there to
    run the service worker. On desktop systems, the browser runs in the background
    as well or can be configured to do. Chrome exposes an advanced setting. Continue
    running background apps when Google Chrome is closed, as highlighted in Figure
    3.2.


    ![](bbox=[0.119, 0.483, 0.843, 0.638])


    Figure 3.2 Chrome Advanced Settings


    I''ll show you more about what service workers can do and how they do it as we
    work through the rest of the chapter.


