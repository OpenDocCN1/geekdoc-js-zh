  md: "# Validating Notification Support\n\nSome browsers, such as Safari on iOS,\
    \ don't support notifications, so before an app does anything with them, the app\
    \ must first check to see if notifications are even available in the browser.\
    \ Do this, check for the existence of the Notification object using the following:\n\
    \n```\n// does the browser support notification?\nif (\"Notification\" in window)\
    \ {\n  // yes! Do something interesting\n```\n\n```\n} else {\n  // no? Then display\
    \ a warning message\n  // or disable the part of the ui that handles notifications\n\
    }\n```\n\nThis check is a core component of the updateUI function in the project's\
    \ chapter-06/public/js/Index.js. The web app executes this function to update\
    \ the UI at startup and every time the browser's subscription changes.\n\nDoes\
    \ your app have to check for notification support before doing anything related\
    \ to notifications? No, not really. If you don't, any code that uses the Notification\
    \ object will simply fail on browsers that don't support notifications.\n\n# Checking\
    \ Notification Permission\n\nOnce a app knows the browser supports notifications,\
    \ it should check whether the user has granted permission using the Notification\
    \ object's permission property, as shown in the following code:\n\n```\nif (Notification.permission\
    \ === \"granted\") {\n  console.log('User has approved notifications');\n}\n```\n\
    \nThe supported permission values are\n\n+   - granted\n- denied\n- default\n\n\
    A permission value of 'granted' means that the user approved use of notifications\
    \ for this app. A permission value of 'denied' means the opposite: the user did\
    \ not grant permission for notifications for this app. Easy, right?\n\nThe 'default'\
    \ value is a weird one as it means that the browser is not sure whether the user\
    \ approved notifications. In this case, the browser simply assumes the user has\
    \ not granted permission. This happens when the user closes the permissions prompt\
    \ dialog without making a selection."
  merge: -1
  pgno: 154
- img_proc: false
  md: "# Getting Permission for Notifications\n\nNow that you know how to check that\
    \ the browser supports notifications and whether the user has granted permission\
    \ for notifications, it's time to get the user's permission for notifications.\
    \ To do this, an app calls the Notification object's requestPermission method,\
    \ and the browser takes over the approval process from there.\n\nThe requestPermission\
    \ method returns a promise; when the promise resolves, it returns a DOMString\
    \ containing 'granted', 'denied', and 'default' values described in the previous\
    \ section.\n\nThe following code illustrates the requestPermission method in action.\
    \ Open the web app project's chapter-06-public/index.js file and add the code\
    \ to the existing doSubscribe function.\n\n```\nNotification.requestPermission().then(result\
    \ => {\n  switch (result) {\n    case 'granted':\n      // the user gave us permission,\n\
    \      // so we can go ahead and subscribe\n      break;\n    case 'denied':\n\
    \      // code block\n      console.error('Denied');\n      Swal.fire({\n    \
    \    type: 'info',\n        title: 'Subscribe',\n        text: 'You denied access\
    \ to notifications.',\n        footer: 'Please try again when you are ready.'\n\
    \      });\n      break;\n    default:\n      // the user closed the permissions\
    \ dialog\n      // without making a selection\n      console.warn('Default');\n\
    \      Swal.fire({\n        type: 'info',\n        title: 'Subscribe',\n     \
    \   text: 'Dialog closed without making a selection.',\n        footer: 'Please\
    \ try again later.'\n      });\n  }\n});\n```\n\nWhen an app user clicks or taps\
    \ the Subscribe button, this code requests permission for notifications, then\
    \ notifies the user of the result. We'll do more with this result a little later,\
    \ but for now let's just get this working."
  merge: -1
