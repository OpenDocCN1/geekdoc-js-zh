    and the browser cache to cache web resources, including application data. That
    approach works well, because the browser is great at fetching resources and displaying
    them. All we did add a manager in the middle to enable our code to control what''s
    cached and what isn''t. In this chapter, we take app resource caching to the next
    level, using service workers to enable offline mode in a web app.


