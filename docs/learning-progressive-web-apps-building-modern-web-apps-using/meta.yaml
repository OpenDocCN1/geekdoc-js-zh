  md: "# 116 Chapter 5 Going the Rest of the Web Offline with Background Sync\n\n\
    When you open an IndexedDB database, and it doesn't already exist, the act of\
    \ opening it creates it for you.\n\nIn the onupgradeneeded callback, the code\
    \ checks to see if the store we already exists and creates it if it's not already\
    \ there.\n\nThe last piece of this is the code that follows. It takes the selected\
    \ sentiment and stores it in the database inside the feedback-store store. Like\
    \ the generic example shown earlier, this function adds a data object (in this\
    \ case, timestamp: Date.now(), sentiment: feedback ) to the store, then registers\
    \ the sync event that tells the service worker there for it to process. I added\
    \ a timestamp to the data object thinking I display the sync date in the console\
    \ as the service worker processed each queued feedback item. I never got around\
    \ to doing that, but if you want, you are free to use it in your version of the\
    \ app.\n\nAdd the following function to the project's db.js file:\n\n```\nfunction\
    \ queueFeedback(db, feedback) {\n  console.log('queueFeedback()');\n  return new\
    \ Promise((resolve, reject) => {\n    let request = db.transaction([STORE_NAME],\
    \ \"readwrite\")\n      .objectStore(STORE_NAME)\n      .add({timestamp: Date.now(),\
    \ sentiment: feedback});\n\n    request.onsuccess = function (event) {\n     \
    \ console.log('queueFeedback: Successfully added feedback');\n      navigator.serviceWorker.ready.then(reg\
    \ => {\n        console.log('queueFeedback: Registering sync event');\n      \
    \  // fire off the sync request\n        // to the service worker\n        reg.sync.register('feedback')\n\
    \        .then(() => {\n          // tell the user\n          Swal.fire({\n  \
    \          type: 'info',\n            title: 'Request Queued',\n            text:\
    \ 'Your sentiment rating was queued for ' + \n              'submission to the\
    \ server.',\n            footer: 'Please refresh the page.'\n          });\n \
    \         // resolve the promise\n          resolve();\n        })\n      }).catch((err)\
    \ => {\n        // I can't think of why this would happen\n        reject(err);\n\
    \      });\n    });\n  });\n};\n```"
