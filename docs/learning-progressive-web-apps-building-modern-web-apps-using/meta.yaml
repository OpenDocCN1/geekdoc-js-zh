  md: "# Chapter 9 Automating Service Workers with Googlebox\n\n![](bbox=[0.117, 0.098,\
    \ 0.842, 0.498])\n\nFigure 9.6 Working Cache Shown through Developer Tools Network\
    \ Panel\n\nWorkbook supports plugins as well, and there are many available for\
    \ you to use. For example, there's an extension plugin you can use to keep resources\
    \ in a cache for a specific number of seconds:\n\n```\nworkbox.routing.registerRoute(\n\
    /.(?:png|jpg|svg)$,\nnew workbox.CacheFirst({\n  cacheName: 'app-images',\n  plugins:\
    \ [\n    new workbox.expiration.Plugin({\n      maxEntries: 50,\n      maxAgeSeconds:\
    \ 86400\n    })\n  ]\n})));\n```\n\nThis example caches a maximum of 50 .png,\
    \ .jpg, and .svg files for 10 days (864,000 seconds). The example also adds an\
    \ additional cache called app-images just for those image files."
  merge: -1
