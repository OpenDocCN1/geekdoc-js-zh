  md: '# First, a Little Bit of History


    Google and other browser vendors add special features to their browsers all the
    time, striving to provide more tools developers can use to enhance the web. In
    2015, a designer named Frances Berroman and a Chrome engineer Alex Russell coined
    the term Progressive Web Apps to describe, from Wikipedia, “apps taking advantage
    of new features supported by modern browsers, including service workers and web
    manifests, that let users upgrade apps to progressive web in their native operating
    system (OS).


    Google Chrome was the leading browser at the time that supported the required
    technologies, and Google started heavily promoting this approach to building web
    apps.


    # PWAs Are . .


    Google’s Progressive Web Apps landing page·says that PWAs are


    +   - Reliable

    - Fast

    - Engaging


    These terms describe a user''s perception of an app, not anything about how the
    app is built, or what it can do. The technologies used to build PWAs enable developers
    to build web apps that are reliable, fast, and engaging, but only if web developers
    have the skills and take the time to do it. I think Google''s description is off
    base, since there are a lot of inexperienced developers out there who can build
    PWAs that aren''t reliable, fast, or engaging, but the apps are still PWAs.


    So, with that in mind, in this book, PWAs are about the technologies used and
    how to make them. There are a lot of online articles and books available about
    how PWAs are more engaging and the impact they''ve had on businesses'' success
    revenue; the best place to start for information is on PWA Stats.²


    I align with Keith''s definition from What Is a Progressive Web App²5 Here''s
    my: PWAs are web apps with a little bit of special magic that enable them to make
    more mobile apps. It''s the concept of web apps using more mobile apps that makes
    PWAs so interesting.


    If you think about most native apps you use on your phone, they


    +   - Are installable from the phone platform''s public app store (and enterprise
    stores for employee apps), putting an app icon on the device''s home screen.

    - Will load and operate (although in a potentially limited fashion) regardless
    of whether the device has network connectivity. The app''s UI is embedded in the
    application binary and loads locally when you open the app (pulling data from
    the network when it can).


    +   1. https://developers.google.com/web/progressive-web-apps/

    2. https://www.pwastats.com/

    3. https://adactio.com/journal/13098'
  merge: -1
