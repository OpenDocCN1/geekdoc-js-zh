  md: "Anatomy of a Web App Manifest 19\n\nWhen you create the icon files for your\
    \ app, pay special attention to how the icons render on the target device. They\
    \ must render properly against any possible home screen or desktop background,\
    \ so you may want to skip transparency unless your app icon can render cleanly\
    \ against any background.\n\nFor installable apps, you must provide an icons property\
    \ containing icons at 192 and 512 pixels.\n\n# Configuring Display Mode\n\nThe\
    \ web manifest specification enables developers to set how the browser renders\
    \ an installed app's UI using the display property. The available options control\
    \ how much of the browser's UI (its chrome) displays around the app window. The\
    \ supported options are\n\n+   - fullscreen\n- standalone\n- minimal-ui\n- browser\n\
    \nEach option is described in the following sections.\n\nRemember, one of the\
    \ criteria for a browser to consider an installable is a display property set\
    \ to fullscreen, standalone, or minimal-ui. The browser property value does not\
    \ affect PWA app installation through the web manifest.\n\nThe specification allows\
    \ developers to use display-mode in Cascading Style Sheets (CSS) media selectors\
    \ in their web apps to adjust the UI styling depending on which display mode is\
    \ in play when the app launches, as shown in the following CSS example:\n\n```\n\
    @media all and (display-mode: fullscreen) {\n  /* some styling stuff for the 'fullscreen'\
    \ version/\n}\n```\n\nUsing this approach, you can add a toolbar or status bar\
    \ to the top of the screen to mimic the look of a native mobile app when the app\
    \ is installed as a full screen app.\n\n# fullscreen Display Mode\n\nWith display\
    \ set to fullscreen, the installed web app opens without any browser UI and consumes\
    \ the entire screen, as shown in Figure 2.7.\n\nIf the browser doesn't support\
    \ fullscreen mode, it falls back to standalone mode."
