  md: "# App Installation in Action 37\n\nFinally, the code sets the button's display\
    \ style to block, unhiding the button on the page so the user can now see it.\
    \ With that in place, we need the code that does the installation. The beforeinstallprompt\
    \ event listener we just added to the project's js/main. js file, add the following\
    \ function:\n\n```\nfunction doInstall() {\n  // we tapped the button, hide it\n\
    \  installButton.style.display = 'none';\n  // execute the deferred installation\
    \ prompt\n  deferredPrompt.prompt();\n  // wait for the response from the deferred\
    \ prompt\n  deferredPrompt.userChoice((res) => {\n    // did the user approve\
    \ installation?\n    if (res.outcome === 'accepted') {\n      console.log('doInstall:\
    \ accepted');\n    } else {\n      console.log('doInstall: declined');\n    }\n\
    \    // clear the deferred prompt object so we\n    // can only do this once\n\
    \    deferredPrompt = null;\n  });\n}\n```\n\nAs described in the comments, this\
    \ code\n\n+   - Hides the button (no need to install the app twice).\n- Calls\
    \ the prompt method on the deferredPrompt object; we captured that object specifically\
    \ for this reason, so we could call its prompt method to prompt the user to install\
    \ the app.\n- Waits for the user to decide whether or not to install the app.\n\
    - Once the user decides what to do, logs the results to the console and clears\
    \ the deferredPrompt object so it's not used again.\n\nWhen the browser fires\
    \ the beforeinstallprompt event, it passes an object that the app uses later to\
