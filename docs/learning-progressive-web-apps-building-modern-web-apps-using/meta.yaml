- img_proc: false
  md: "# Chapter 9 Automating Service Workers with Google Workbox\n\nThe last error\
    \ in the list doesn't tell you much about its cause; the browser generates error\
    \ when it attempts to load the service worker file as it loads the page. If you\
    \ look at the precache array, you will see that the service worker isn't listed.\
    \ As you probably remember from Chapter 3, \"Service Workers,\" the browser loads\
    \ the service worker with every page load to check there's a new version to install.\
    \ Since Workbox operates the service worker, you get this error.\n\nI got around\
    \ this error in Chapter 3 when I included the service worker in the list of cached\
    \ files. You don't need to include your service worker in the cache. If it's not,\
    \ the browser generates an error and continues. To learn more about how Workbox\
    \ works, and to avoid the error, I set about trying to figure out how to include\
    \ the service worker in the cache (just for fun).\n\nSince we're using Workbox\
    \ to generate the service worker, I don't want to manually add the file to the\
    \ precache array because Workbox will overwrite whenever it generates the file.\n\
    \nI thought a possible solution existed in the workbox-config.js file. Open the\
    \ file and look for the following:\n\n```\nglobPatterns: [\n  \"*/**/*.{css,png,ico,html,js,svg}\"\
    \n]\n```\n\nThis is the file specification that tells Workbox how to identify\
    \ the files we want precached. I tried adding the service worker to the list of\
    \ precached files by adding the following entry to the globPatterns array:\n\n\
    ```\n./sw.js\n```\n\nHere's the complete array definition:\n\n```\nglobPatterns:\
    \ [\n  \"*/**/*.{css,png,ico,html,js,svg}\",\n  \"./sw.js\"\n]\n```\n\nWhen I\
    \ regenerated the service worker and tested it in the browser, Workbox dutiful\
    \ added the service worker to the cache as instructed, but the browser reported\
    \ the same error. Apparently, Workbox can't handle its own service worker. Sorry.\n\
    \nI'm going to ask you to ignore the other errors for now; I'll cover them in\
    \ \"Controlling Caching Strategies in the next chapter.\n\nAs you can see, for\
    \ static sites, this approach generates a service worker in no time and immediately\
    \ improves the offline performance of the site. Unfortunately, it caches everything\
    \ for the site, if it's not used (like many of the icon files in the app).\n\n\
    You can also use the Workbox Node module and Webpack plugin to generate or update\
    \ the service worker in your project at time. Since the focus of this book is\
    \ service workers and PWAs, I'm leaving the details of that for your future research.\n\
    \n+   2. You can learn more about this topic at https://developers.google.com/web/tools/workbox/modules/workbox-build."
  merge: -1
