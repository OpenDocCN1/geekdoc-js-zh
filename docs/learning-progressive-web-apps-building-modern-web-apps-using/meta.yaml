  md: "# Chapter 2 Web App Manifest Files\n\n> Note\nIf an app's index.html file has\
    \ multiple link elements referencing manifest files, the browser will use the\
    \ first one (in tree order) and ignore all others, even if the first reference\
    \ is invalid.\n\nIn the sections that follow, I highlight the properties used\
    \ in this chapter's sample app, then cover some of the other options as well before\
    \ showing you the app in action.\n\n# Setting the App Name\n\nA app's manifest\
    \ file uses one of two JSON string values to define the name or title for the\
    \ app: short_name and name. According to the specification, it's up to the browser\
    \ to decide which one to use when displaying the app icon or information about\
    \ the app on the device where the app is installed.\n\n```\nshort_name: \"TipCalc\"\
    ,\nname: \"Tip Calculator\",\n```\n\nBoth properties are string values, and your\
    \ manifest can have either or both values specified. In my testing in the Chrome\
    \ browser on the desktop and on an Android device, Chrome uses the name property\
    \ value in the installation prompt and the applications lists. On Android, it\
    \ uses the short_name property value for the app title on the screen.\n\nFor install\
    \ apps, you must provide a value for either the name or short_name property.\n\
    \n# Setting App Icons\n\nA web app's manifest file uses the icons property to\
    \ define the array of icon objects for the app. The browser uses one of these\
    \ icons, depending on the screen resolution of the device, the shortcut icon for\
    \ the app on the desktop or mobile device home screen. Populate the array with\
    \ the list of icon files you have defined for the app, as shown in the following:\n\
    \n```\n\"icons\": [\n{\n  \"src\": \"icons/app_icon_192x192.png\",\n  \"sizes\"\
    : \"192x192\",\n  \"type\": \"image/png\"\n},\n{\n  \"src\": \"icons/app_icon_512x512.png\"\
    ,\n  \"sizes\": \"512x512\",\n  \"type\": \"image/png\"\n}\n]\n```\n\n> Note\n\
    Requirements will differ based on the browser running the app, but according to\
    \ Google's documentation, at a minimum you'll need 192 x 192 and 512 x 512 pixels.\
    \ The browser scales one of the available icons to fit the target device's requirements.\
    \ The 512 source includes some extra icons at different resolutions if you want\
    \ to add them to the manifest."
  merge: -1
