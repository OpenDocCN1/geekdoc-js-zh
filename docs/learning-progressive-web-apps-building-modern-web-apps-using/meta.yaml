  md: "Putting all of this, for converting the VAPID public key into the correct format\
    \ is borrowed directly from\n“Using VAPID Key for applicationServerKey”10 and\
    \ is shown here:\n\n```\nfunction urlBase64ToUintArray(base64String) {\n  // this\
    \ code decoded from:\n  // https://www.npmjs.com/package/web-push\n  const padding\
    \ = '='.repeat((4 - base64String.length % 4) % 4);\n  const base64 = (base64String\
    \ + padding)\n    .replace(/-/g, '+')\n    .replace(/_/g, '/');\n\n  const rawData\
    \ = window.atob(base64);\n  const outputArray = new Uint8Array(rawData.length);\n\
    \n  for (let i = 0; i < rawData.length; ++i) {\n    outputArray[i] = rawData.charCodeAt(i);\n\
    \  }\n  return outputArray;\n}\n```\n\nAdd the urlBase64ToUintArray function to\
    \ the project's index.js file; we'll need it in a little\nwhile.\n\n```\nnavigator.serviceWorker.ready.then(registration\
    \ => {\n  var subOptions = {\n    userVisibleOnly: true,\n    applicationServerKey:\
    \ urlBase64ToUintArray(Config.VAPID_PUBLIC)\n  };\n  registration.pushManager.subscribe(subOptions)\n\
    \    .then(sub => {\n      console.log('Browser subscribed');\n    });\n});\n\
    ```\n\nIf the browser successfully subscribes for notifications, the push service\
    \ returns the\nsubscription object, which looks like this:\n\n```\n{\n  endpoint:\
    \ \"https://fcm.googleapis.com/fcm/send/some-unique-id\"\n  expirationTime: null\n\
    \  options: PushSubscriptionOptions\n  applicationServerKey: ArrayBuffer(65) {}\n\
    \  userVisibleOnly: true\n}\n```\n\n+   10. https://www.npmjs.com/package/web-push#using-vapid-key-for-applicationserverkey"
