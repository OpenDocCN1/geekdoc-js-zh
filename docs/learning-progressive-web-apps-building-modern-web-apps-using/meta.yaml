  md: '# Preparing to Code 49


    I wrote server code (the APIs the web app uses) using TypeScript, a typed superset
    of JavaScript. Using TypeScript allowed me to define types for all my app''s variables
    and more easily find errors (based on typing). TypeScript compiles to JavaScript
    using the TypeScript Compiler (tsc), so the .js files you see in the figure are
    compiled versions of my code located in the project''s app folder.


    If you decide to make changes to how the server and API work, you must make your
    modifications in the app folder. Once you''re ready to apply your changes, open
    a terminal window, navigate to the root project folder (the one shown in Figure
    3.3), and execute the following command:


    ```

    tsc

    ```


    This compiles your .ts files into .js files see in the root folder shown in the
    figure. You''ll see errors and warnings from the code''s references to some of
    the objects, but the unmodified code remains, so look for errors from the code
    you modified.


    # Configuring the Server API


    The server process connects the News Search API from Microsoft Azure to collect
    the news data displayed in the app. You''ll need an Azure account and a Bing API
    key to work with the code in this chapter.


    If you already have an Azure account, log in to your account at https://portal.azure.com.
    If you don''t have an account, create a free one at https://azure.microsoft.com/en-us/free/.
