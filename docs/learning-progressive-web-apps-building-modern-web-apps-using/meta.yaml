  md: 'The options object is a simple JavaScript object containing one or more of
    the following properties:


    +   - actions: An array of items representing the actions the user can perform
    with this notification. You''ll see an example of this later.

    - badge: A URL pointing to an image file used to represent the notification when
    there isn''t enough space to display the full notification.

    - body: The body text for the notification. You''ll see an example of this use
    in a minute.

    - data: An arbitrary data object associated with the notification. The service
    worker can use this as it processes the notification.

    - dir: The notification text direction. This property defaults to auto; other
    options are r1 (right to left) and l1 (left to right).

    - icon: A URL pointing to an image file displayed in the notification (typically
    to the left of the notification on Windows and to the right for macOS).

    - image: A URL pointing to an image file displayed in the notification (typically
    above the notification).

    - lang: Specifies the language for the notification.

    - notify: A Boolean value (true/false) specifying whether the browser should notify
    the user when a new notification replaces the previous one. The default value
    is false.

    - requireInteraction: A Boolean value (true/false) specifying whether the notification
    should remain active until the user clicks or dismisses it. This could direct
    the browser to close the notification automatically after a few seconds.

    - tag: A string identifying the notification. To keep the browser from cluttering
    up the user''s system with notifications, when a new notification comes in replaces
    any previous notifications in the queue with the same tag.

    - vibrate: A vibration pattern array to use when notifying users of news notifications.
    The array contains play/pause times specifying number of milliseconds each. For
    example, to vibrate for 200 milliseconds, pausing for 100 milliseconds, repeated
    three times, you would use [200, 100, 200, 100, 200, 100].


    A more thorough description of these options plus listing of newer options not
    supported in many browsers can be found in Notification.Notification().


    # Warning


    Many of the options described here work only on Microsoft Windows. macOS especially,
    but Android as well, do not support all the available options. I could not get
    images or action buttons to display on anything but.


    All I can do is hope that these operating systems (notifications are displayed
    by the OS, not the browser) continue to add support for other options over time.


    > 9. https://developer.mozilla.org/en-US/docs/Web/API/notification/Notification'
