    # Making a Progressive Web App


    Several technologies enable PWAs; without them a web app cannot be a PWA. Those
    technologies are web manifest files, service workers, and Hypertext Transfer Protocol
    (HTTPS) or, more accurately, HTTP over Transport Layer Security (TLS). HTTPS enables
    secure communication between a client and server and isn''t a topic I cover in
    this book except to describe what it''s required for most PWA capabilities and
    I explain why. The following chapters describe in detail how to use web manifest
    files and service workers to build a PWA. For now, it''s good to know that web
    manifest files enable installation of a web app on the local system running and,
    service workers making everything else PWAs do.


    Table 1.1 lists the capabilities from the previous section mapped against the
    PWA technologies that they enable.


    | Capability | Web Manifest | Service Workers | TLS (HTTPS) |

    | --- | --- | --- | --- |

    | Install shortcut | Yes | Required, but not involved | Yes |

    | Cache content | No | Yes | Yes |

    | Background processing | No | Yes | No |

    | Push notifications | No | Yes | Yes |


    A developer must do a lot of work to make a website interesting, engaging, and
    useful. This means crafting the site''s pages so they look good and work well
    on screens or browser windows of varying dimensions (width and height). Web developers
    must take the client-side browser''s capabilities into account when building sites,
    and many developers deliver capabilities in their sites based on what does or
    doesn''t work in the browser at runtime. Some mobile browsers (like ones on phone
    features) can''t process a lot of client-side code, so JavaScript may be disabled
    or have limited capabilities on that device.


    The process developers use to build web pages for these scenarios is called progressive
    enhancement, where the developer focuses on the first content, then layers on
    additional functionality for more capable browsers. This means that the app simply,
    displaying the required content, regardless of whether the browser supports the
    extra bells and whistles (like CSS transforms) the developer added for more robust
    browsers. If those capabilities are there, then the user gets the full experience.
    If they''re not, the user can at least view the content.


    Web apps are more interactive, like Wikipedia (web site) vs. Gmail (web app).
    Web apps use client-side scripting languages such as JavaScript (or its sister
    language TypeScript) to deliver'
