    Click the Generate Report button shown in Figure 8.1, and Chrome opens a new window
    hosting the selected app in a simulated mobile device and exercises the app in
    different conditions. I haven''t studied exactly what tests it, but you can tell
    that it''s loading the app with and without network connectivity and what happens
    in the app. When it completes its assessment, Chrome opens the page shown in Figure
    8.3 listing the results of the audit.


    As you can see from the figure, the results are dismal. Remember though, that
    is the bare bones version of the Tip Calculator app; it doesn''t have a manifest
