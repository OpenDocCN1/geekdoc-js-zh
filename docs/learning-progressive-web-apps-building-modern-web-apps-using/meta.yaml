    a''s more dynamic and exciting client-side experience. With a web app, when you
    first hit the app''s URL, the app''s shell downloads and renders before the app
    goes out to the server for the app''s data.


    You can see an example of this in Figure 1.2. The app shell consists of the side
    navigation and the top bar, while the content in the content area (bound within
    the orange border) changes dynamically based on the choices the user makes in
    the app.


    ![](bbox=[0.137, 0.246, 0.862, 0.653])


    Figure 1.2 Web Shell Structure


    PWAs progressively enhance web apps—that''s, um, why they''re called Progressive
    Web Apps.


    So, let''s assume we have a dynamic web app that''s all about user interaction
    and dynamic data. The app requires a more capable browser and certainly means
    that there''s JavaScript involved (to deliver the dynamic nature of the app).
    The app runs in the browser and uses the system''s network connection to download
    the shell, then, or perhaps in parallel, it retrieves the app''s data from a server.
    When the running app doesn''t have network connectivity, the browser displays
    a spinner or an error message, and the user simply can''t use the app.


    True to PWA''s progressive moniker, you''ll enhance the app when you add a web
    manifest file to enable client-side installation and add a service worker to enable
    caching, background processing, and support for push notifications. On browsers
    that support those capabilities, the PWA becomes installable and lets the user
    run the app when there''s no network connection'
