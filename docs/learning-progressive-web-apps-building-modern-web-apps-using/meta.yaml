    # Setting the Installed App''s Start URL


    A browser uses the start_url to define the URL to launch the app. Using it is
    just a recommendation in the specification, so it''s possible that the browser
    will ignore it. There''s a lot of flexibility in how you use this property for
    your PWAs; how you configure it depends on how your app is coded and served.


    Some examples showing start_url like this:


    ```

    "start_url": "."

    ```


    In this case, it instructs the browser to open the root folder for the web app.
    Other examples suggest using the following:


    ```

    "start_url": "./",

    ```'
  merge: -1
