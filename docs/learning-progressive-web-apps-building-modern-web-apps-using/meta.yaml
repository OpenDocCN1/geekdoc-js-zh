  md: '# Introducing Push Notifications


    Local notifications work only when the web page requesting them is hosted. If
    you open the page directly from the file system (rather than using a URL), notifications
    don''t work.


    Remote notifications, however, require service workers to function. For notifications
    sent by a remote system, it''s the service worker that processes the notification
    when it arrives and decides what to do with it.


    Before the browser can receive notifications from a web app or a remote system,
    the browser user must first grant permission to authorize the browser to show
    notifications on behalf of the app. If the user doesn''t grant permission, you
    can''t send notifications to the browser.


    You''ve probably seen these permissions prompt as you surf the web, sites that
    immediately ask for permission to send notifications to your browser before you
    even know whether the site contains anything of interest. This approach leads
    to greatly annoyed users and tweets such as the one shown in Figure 6.4.


    ![](bbox=[0.143, 0.373, 0.568, 0.648])


    Figure 6.4 Comment about Push Permission Prompt


    Web apps should wait until they''re certain sites are interested in receiving
    notifications before asking permission to send them. You gauge interest based
    on how many users visit or how much time they spend on each, then display the
    permissions only when you''re sure they want them. One option is to use the beforeinstall
    event discussed in Chapter 2, "Web App Manifest Files," to hide a subscribe button
    or link. In the app we work on in this chapter, the code never prevents prompt
    automatically; it instead provides a button the visitor must click to subscribe
    to notifications.


    The browser provides several events a web app can listen for to when the user
    clicked or closed the notification window. Notifications can even be interactive;
    you can do action buttons with your notifications and execute specific code depending
    on what action button the user clicks or taps. We cover all this and more as we
    work through the chapter''s code.'
