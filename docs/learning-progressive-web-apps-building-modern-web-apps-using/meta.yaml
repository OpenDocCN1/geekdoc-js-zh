    There is, in some cases, a simple workaround for this limitation. The PWA News
    app pulls data from a server, and users can''t make any updates to the news, so
    a worker-based sync process can be easily implemented. The approach uses browser
    push and the poke-and-pull method (illustrated in Figure 5.3):


