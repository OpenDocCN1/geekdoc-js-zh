    \ request for news data?\n  if (event.request.url == `${location.origin}/api/news`)\
    \ {\n    console.log(`SW: Data request detected`);\n  }\n}\nelse {\n  // non-data,\
    \ respond with fetch results\n  event.respondWith(\n    // check to see if it's\
