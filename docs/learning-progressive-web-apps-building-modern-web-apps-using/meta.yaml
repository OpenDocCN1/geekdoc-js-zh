  md: "# PWAs Are... \n\n+   - Can run in the background, even doing things or processing\
    \ data while you're doing something else on the device.\n- Can receive push notifications\
    \ (messages sent to the device or an app from an external system).\n- With some\
    \ extra work, can even deliver a rich and robust offline experience, caching records\
    \ for upload later and synchronizing data with a server-based app.\n\nDoes that\
    \ describe many of the mobile apps you use today? Does your email (or fill in\
    \ another app here) work regardless of whether the device has network connectivity?\
    \ If you turn off the radio and open the app, does the app's UI open and display\
    \ much of the data that was there earlier? When you send a message offline, does\
    \ the app queue the data for transmission later? Does the app receive notifications\
    \ (when new mail is available)? Yeah, I thought so; those are core capabilities\
    \ of modern mobile apps.\n\nTurning to PWAs:\n\n+   - PWAs are installable: mobile\
    \ and desktop users can quickly install them on your phone's home screen or using\
