  md: "When you turn off the network connection in the browser developer tools and\
    \ reload the app, you'll see that this version of the app has some of the same\
    \ problems highlighted in Figure 9.3. In this case, the issue is that our caching\
    \ strategy isn't caching several the external resources used by the app (some\
    \ fonts and the SweetAlert2 library). There are several approaches to solving\
    \ this\n\nYou can add handlers for specific resources, putting them in a separate\
    \ cache, as follows:\n\n```\nworkbench.routing.registerRoute(\n  'https://cdn.jsdelivr.net/npm/sweetalert288',\n\
    \  new workbench.strategies.CacheFirst({\n    cacheName: 'external-cache',\n \
    \   plugins: [\n      new workbench.cacheableResponse.Plugin({\n        statuses:\
    \ [0, 200],\n      })\n    ]\n  })\n);\n```\n\nIn this example, I use the cacheableResponse\
    \ plugin to enable caching resources that won't normally be cached by a service\
    \ worker because of cross-origin resource sharing (CORS) issues. I explained this\
    \ in Chapter 4, \"Resource Caching.\"\n\nYou can also implement a route that matches\
    \ any requests for fonts from https://fonts.googleapis.com and store them off\
    \ in a cache:\n\n```\nworkbench.routing.registerRoute(\n  /^https:\\\\/fonts\\\
    .googleapis\\.com/,\n  new workbench.strategies.StaleWhileRevalidate({\n    cacheName:\
    \ 'external-cache',\n  })\n);\n```\n\nProbably the easiest solution in this is\
    \ to set a default handler for missed resources, catching any resources that aren't\
    \ matched using any other route. Adding the following code to the bottom of the\
    \ service worker:\n\n```\nworkbench.routing.setDefaultHandler(\n  new workbench.strategies.NetworkFirst({\n\
    \    cacheName: 'default-cache'\n  })\n);\n```\n\nIn this example, we added a\
    \ cache called default-cache and told Workbox to put all unmatched resources there.\
    \ When you reload the app and look at cache storage, you'll see the external resources\
    \ cached, as shown in Figure 9.7."
  merge: -1
