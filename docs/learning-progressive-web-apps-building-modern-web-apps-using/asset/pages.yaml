    To see the caching strategy in action, disable the network in the browser developer
    tools, then look at the results in the Network panel, shown in Figure 9.6. As
    you can see from the figure, the service worker returns the requested resource
    if it has it, then the fetchWrapper.mjs file tries to retrieve an updated version
    of the file from the network (and fails).'
