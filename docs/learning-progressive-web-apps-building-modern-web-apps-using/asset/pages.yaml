    \n}\n```\n\nThis is because we're sending the notification content through the\
    \ server and we must\npass that as a string value to the server. What we're sending\
    \ is a JavaScript object as a\nstring, so we must put both keys and values in\
    \ quotes.\n\nBecause I wanted to make it easy for you to test the browser notification\
    \ process from end to end,\nScott Good and I created an admin client you can use\
    \ to manage subscriptions on the server and\nsend notifications from a simple\
    \ interface. You can see an example of this app in\nFigure 6.7. Open a new tab\
