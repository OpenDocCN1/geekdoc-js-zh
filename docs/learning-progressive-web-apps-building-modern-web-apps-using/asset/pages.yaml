  md: '# # Automating Service Workers with Google Workbox


    In Chapter 4, “Resource Caching” we wrote a lot of code to implement different
    caching strategies for the PWA app. You probably completed that chapter and said
    something along the lines of “there’s got to be a better way.” Well, there is.
    With Google Workbox, Google, along with the PWA developer community, provides
    a toolkit developers can use to more easily deliver robust and capable service
    workers. I''d like to say that you''re writing less code with Workbox, but that''s
    not the case. You''re still writing, but you''re writing code that describes how
    you want your service worker to work harder than the code to actually make it.


    In this chapter, I introduce you to Workbox and show how you can use it to implement
    caching strategies for your web apps. I don''t cover every capability of Workbox;
    the library documentation is good, thorough, and full of examples. What I''ll
    show here is how to apply Workbox to an app, using the Tip Calculator app from
    the beginning of the book.


    In the source code for this chapter, I included a slightly modified version of
    the Tip Calculator in Chapter 2, “Web Manifest Files.” Rather than start with
    a clean project and enhance as you work through the chapter, in this chapter,
    you''ll copy the clean version and work in it as you proceed through the different
    sections.


    #  Introducing Workbox


    Workbox is a service worker consisting of JavaScript libraries, a Node command-line
    interface (CLI), and Node modules developers use to create service workers and
    manage how they work. The JavaScript libraries deliver the service worker-side
    capabilities of the toolbox, something Google describes as “adding offline support
    to web apps.” The CLI and Node modules automate app resource precisely during
    the coding and build process.


    With Workbox, you can build a service worker that


    +   - Precaches the resources used by a web app and serves them from the cache.


    +   - Implements multiple caching strategies for your web resources.


    > 1. * https://developers.google.com/web/tools/workbox/*'
  merge: -1
  pgno: 223
- img_proc: true
  md: '+   Implements offline capabilities for Google Analytics.


    +   Queues network requests for later processing using background sync (similar
    to what you learned in Chapter 5, "Going the Rest of the Wave with Background
    Sync").


    +   Programmatically sets expiration for cached resources.


    +   Does all sorts of stuff.


    Workbox abstracts the complexity of the work that service workers do, letting
    you describe how you want to work, and the toolbox handles everything for you.


    In this chapter''s examples, I show you how to use the CLI and the JavaScript
    framework in your PWAs. I leave working with the Node module and build tools for
    you to research later. Everything you learn in this chapter easily applies to
    other topics as well.


    # Generating a Precaching Service Worker


    With precaching and service workers, you will build a list of all the file resources
    used by your app, use code to preload those resources into a device''s local cache
    first the app runs on the device; we implemented an example of this in Listing
    4.1. In Workbox, Google delivers tools to automate that file list generating the
    service worker that handles the files and serves them from the cache.


    Start by copying the project''s chapter-09/tip-calc. Copy the folder, paste it
    back to the same, renaming the folder copy to tc1 during the process. When you''re
    done, you''ll have two folders in the chapter-09 folder: tip-calc and tc1.


    Next, open a terminal window or command prompt, navigate into the tc1 folder,
    and execute the following command:


    ```

    npm install -g workbox-cli

    ```


    This command installs the Workbox CLI for us to use. After the installation completes,


    ```

    workbox wizard

    ```


    This starts the process Workbox uses to generate the resource list and service
    worker for your PWA. The wizard will ask you a few questions, then create the
    configuration file that drives the precaching and service worker generation process.
    Figure 9.1 shows the first step in the process.


    The wizard assumes you have a folder structure with a source and distribution
    folder (or some variant), the first time it does is ask for the location of the
    app''s source files. For this simple project, everything is in the tc1 folder,
    select manually enter the path, as highlighted in the figure, then press Enter.


    The wizard then requests the path to your web app:


    ? Please enter the path to the root of your web app:'
