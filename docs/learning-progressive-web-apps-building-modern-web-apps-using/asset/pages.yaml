    # Introducing Background Sync


    Background sync is a feature of service workers that enables apps to ensure that
    user actions aren''t lost even if the browser loses network connectivity or the
    user switches to another app or closes the browser or the current tab. By user
    actions, I mean things such as:


    +   - Sending an email.

    - Subscribing to a newsletter.

    - Sending a chat message.

    - Submitting a form.


    These actions are essentially any data created or updated in the web app that
    will be sent to the server. The ability to fire and forget application actions
    they''ll complete whenever the app (or the browser running the app) regains network
    connectivity is one of the most powerful mobile app features enabled by PWAs.
    Web apps do this using service workers.'
