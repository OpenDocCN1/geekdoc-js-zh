  md: "# Chapter 6 Push Notifications\n\nThe complete code for the project's index.js\
    \ file up to this point in the chapter is in the project's chapter-06-public-code-index-63.js\
    \ file.\n\nAt this point, we're done with the app's index.js file. The web app\
    \ has the UI we need to subscribe and unsubscribe the browser for notifications.\
    \ All that's left is set the app up to process remote notifications sent from\
    \ the server. This work must be done in the project's sw.js file.\n\n# Remote\
    \ Notifications\n\nThe browser delivers push notifications to the service worker.\
    \ The browser fires a special event in the service worker whenever the browser\
    \ receives a remote browser notification (a notification sent by an external app,\
    \ routed through the push service)\n\nEarlier, when we created the subscription,\
    \ we promised the browser's push service that we would display any notification\
    \ alert that comes from our app server. Now it's time to deliver the code that\
    \ does that. In the project's service worker at chapter-06-public-sw.js, add the\
    \ following code to the bottom of:\n\n```\nself.addEventListener('push', event\
    \ => {\n  console.log('Sw Push event fired');\n  console.dir(event);\n  const\
    \ data = event.data.json();\n  console.dir(data);\n  self.registration.showNotification(data.title,\
    \ data);\n});\n```\n\nThis adds an event listener for the push event and contains\
    \ all the code you need to respond to notifications sent to the browser by a remote\
    \ server. When a notification arrives, the code pulls the title from the notification\
    \ data included with the push event, then passes the title and the data object\
    \ to the showNotification method.\n\n# In-Browser Testing\n\nThe browser's developer\
    \ tools give developers an easy way to test their app's service worker for processing\
    \ browser notifications. In the Push section highlighted in Figure 6.17, you can\
    \ enter the content for a push message, click the Push button to send it. This\
    \ delivers the message under the covers; the browser doesn't know it from the\
    \ local developer tools.\n\nWhen the browser receives the notification, it fires\
    \ the push event (as expected), and the service worker's push listener executes\
    \ to process the message.\nNormally, you just send a simple text string to the\
    \ browser using this feature, and the event listener's code would just create\
    \ a generic notification like the first one in this chapter. For our app, the\
    \ event listener accepts a JSON object in the notification payload, so to make\
    \ it display the notification using the title other options, you must format the\
    \ notification string as:\n\n```\n{\"title\": \"test\", \"body\": \"Test push\
    \ message from DevTools\"}\n```\n\nThis is a quick and easy way to test notifications\
    \ without involving external tools to send the notification from the browser's\
    \ push service."
  merge: -1
  pgno: 172
