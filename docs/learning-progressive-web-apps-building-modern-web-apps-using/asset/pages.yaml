    To send data from a service worker to a app window, the process is a little more
    complicated. Notice that I said web app window instead of web app. That''s easy
    for a web app to send data to a service worker, since there''s only one service
    worker. On the service worker side, it can send data to any browser window or
    tab running the web app served by the service worker. Because of that, the service
    worker must do extra work to figure out which window should get the message.


    > Note

    This probably a good time to remind you that the browser wakes the service worker
    to process the message from the web app window. The service worker therefore has
    a limited window where it knows about the sender of the message. Once the service
    worker finishes processing the message, the browser shuts the service worker down
    and forgets it knew about the sender and the message it sent.


    The browser maintains a list of the clients windows served by the service worker
    in the worker''s clients object. The service worker needs the ID for the sender
    to send a message back to the event''s event. Fortunately, the service window
    includes a tail in the message event.source property. In its simplest form, the
    service worker can send a message back to the service window using the following
    code:


    ```

    self.clients.get(event.source.id).then(client => {

    client.postMessage(DATA_OBJECT);

    });

    ```


