  md: '# # Introducing Progressive Web Apps


    A Progressive Web App (PWA) is a web app that leverages browser special capabilities
    to enable the app to act more like a native or mobile app when running on capable
    browsers. That''s it, that''s all that needs to be said—the rest of this book
    is all about showing you how to build them (with lots of code examples, of course).


    Developers build PWAs primarily using two technologies available in most modern
    browsers: web app manifest files and service workers. Chapter 2, "Web Manifest
    Files," tells you pretty much everything you need to know about web manifest files.
    The remaining chapters cover service workers and what you can do with them.


    There''s no standard or bodies for PWAs; a PWA is just a web app built to act
    a certain way. Using as much or as little PWA functionality as you want in your
    web apps. You can have web apps that use PWA capabilities but aren''t PWAs and
    PWAs that use only PWA capabilities.


    PWA has its own community-driven logo, shown in Figure 1.1. You can even create
    your own version of the logo, specifying any color for the W portion using the
    tool at https://diekus.net/logo-pwriter.


    ![](img/d7d0133096e7f06b146f5a2a86773984_17_0.png)


    Figure 1.1 The Community-Driven PWA Logo


    Unfortunately, there are different views of what PWAs are; let me fill you in
    on my view . . .'
