  md: '# Note


    The cache is an interface included with a browser''s support for service workers,
    but you can use the cache outside of a service worker if you need for other parts
    of your application.


    # JavaScript and Promises


    One of the things we haven''t spent any time discussing is modern JavaScript development
    approaches and promises.¹ Stuffy old JavaScript used callbacks to enable asynchronous
    operation: when an app called an asynchronous function or method (which might
    take some time to complete), the app passed in a function it wanted executed when
    the time-consuming completed. When you had asynchronous tasks calling other asynchronous
    tasks, things became messy. This created a situation known as callback hell² and
    created very hard-to-read JavaScript code.


    Recent work by the JavaScript community introduced the concept of promises, a
    construct that fixes much of this problem. The reason Promises is important is
    that service workers and their associated cache mechanisms make heavy use of promises.
    In previous chapters, any function or method we called were easily handled by
    the .then and .catch methods attached to the end of the function or method.


    In this chapter, we dig into topics that make heavier use of promises, so you''re
    going to have to beef up how they work. This book isn''t about promises, and there
    are a lot of great resources online that cover the topic better than I can. So,
    if you''re not familiar and comfortable working with promises, why don''t you
    put the book down for a little while and do some extra reading on promises before
    picking this back up?


    The Cache interface exposes the following methods:


    +   - addRetrieves the requested resource from the network and adds the request
    (and associated) to the cache.

    - addA1—For an array of request objects, retrieves the requested resource represented
    by each object in the array and adds each to the cache.

    - delete—Deletes the specified request entry from the cache.

    - keys—Returns a promise that resolves to an array of keys from the cache; keys
    in this case are request objects.

    - match—Returns a promise that resolves to the response for the first matching
    request in the cache. Basically, the app passes in a request object, and this
    method returns the first matching response from the cache.

    - matchA1—Returns a promise that resolves to an array of all request responses
    matching the specified request in the cache.

    - put—Adds a request/response object pair to the cache.


    We use most of these methods throughout the remainder of this chapter.


    +   1. https://developers.google.com/web/fundamentals/primers/promises


    +   2. http://callbackhell.com/'
