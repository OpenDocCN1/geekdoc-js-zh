  md: "```\n) else {\n  // this should never happen\n  console.log(`SW: Unrecognized\
    \ sync event (${event.tag})`);\n}\n:\n```\n\nHere's what the code does:\n\n+ \
    \  - We don't wait the browser to shut down the service worker until it's processing\
    \ the queue, so the code starts with a call to event.waitUntil() that instructs\
    \ the browser's SyncManager to wait until we're done.\n- waitUntil expects a promise,\
    \ so getFeedbackItems creates one (we'll add that code in a minute) then gets\
    \ to work.\n- getFeedbackItems connects to the database and builds an array of\
    \ all the feedback items, then returns it as the result of the promise.\n- The\
    \ code loops through the feedback item array. It uses Promise.all() to say it's\
    \ to make a bunch of promises, and it will resolve (fail) if one fails.\n- Inside\
    \ Promise.all(), it uses the array.map() method to execute a function against\
    \ each element in the array.\n- The map method calls a fetch() to POST the data\
    \ to the server for each item in the array. The fetch method returns a promise,\
    \ so makes Promise.all() happy.\n- When the POST completes successfully, the code\
    \ calls deleteFeedback(), which deletes the processed item from the store (we'll\
    \ add that code in a minute). Oh, and deleteFeedback returns a promise too.\n\n\
    The result is if the feedback item is successfully uploaded to the server (using\
    \ fetch), the processed item is deleted from the store. That was a lot of code\
    \ to accomplish that simple act, wasn't it?\n\nThe reason promises are so important\
    \ is because promises give the easy way to filter results back up the cascading\
    \ method calls I explained. If just one of the process fails, for whatever reason,\
    \ we want everything in place for the next time the service worker wakes up to\
    \ process the queue. Promises give us an easy way to manage that.\n\nThe service\
    \ worker code for this example is in the project's `public/chapter-code-sw.js`\
    \ file.\n\nMost browser developer tools provide a way to send sync messages to\
    \ a service worker directly from the browser (rather than having to do it via\
    \ code). In Google'Chrome browser, open the developer tools, switch to the Application\
    \ tab, then select the Service worker panel, as shown in Figure 5.7. Look for\
    \ the Sync input highlighted in the figure. Enter the sync tag, then click the\
    \ Sync button to send the tag to the service worker."
