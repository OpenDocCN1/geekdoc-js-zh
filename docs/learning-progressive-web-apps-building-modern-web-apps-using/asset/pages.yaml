    \ manage app's caches.\n\n# Offline Awareness\n\nWhen Scott and I created the\
    \ PWA News site, I knew we'd take the app online and offline as we tested different\
    \ caching strategies, so I wanted to show in the app whether the app was online\
    \ or offline—make it as easy as possible for you. The good news is that the browser\
    \ makes this easy to implement.\n\nIf you look in the project's publicjs/utils.js\
    \ file, you will find the following:\n\n```\n// register listener for both online\
    \ and offline events\n// so we can make sure the UI updates accordingly and it\
    \ always\n// understands the current state\nconsole.log('Registering NetworkStatus\
    \ event listeners');\nwindow.addEventListener(\"offline\", setNetworkStatus);\n\
    window.addEventListener(\"online\", setNetworkStatus);\n```\n\n```\nfunction setNetworkStatus()\
    \ {\n  // what's our status?\n  let netStatus = (navigator.on) ? ONLINE_STR :\
    \ OFFLINE_STR;\n  // tell the developer (just for fun)\n  console.log(`Network\
    \ status: ${netStatus}`);n\n```\n\n```\n// get a handle to the page body, offline\
    \ status is page(body)\n// wide, just in case\nlet body = document.querySelector('body');\n\
    // remove the online class (if it's there)\nbody.classList.remove(ONLINE_STR.toLowerCase());\n\
    // remove the offline class (if it's there)\nbody.classList.remove(OFFLINE_STR.toLowerCase());\n\
    ```\n\n```\n// set the presence value (text)\ndocument.getElementById('presenceValue').textContent\
    \ = netStatus;\n// add the status class to the object\nbody.classList.add(netStatus.toLowerCase());\n\
    }\n```\n\nThe PWA News app registers listeners for both the online and offline\
    \ states, then updates content in the footer when the app enters either state.\
    \ This is something you can easily add to your PWAs to let app users know in mode\
    \ the app is operating."
