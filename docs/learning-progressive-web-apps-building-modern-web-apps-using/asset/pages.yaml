  md: '# Chapter 2 Web App Manifest Files


    This is essentially the same thing but applying a Unix convention for specifying
    the current folder.


    Other examples show doing something like this:


    ```

    "start_url": "/utm_source=homescreen",

    ```


    or this:


    ```

    "start_url": "?source=pwa",

    ```


    These examples take a query parameter on the URL, enabling the app to distinguish
    whether the app was loaded directly from the hosted site via the browser or as
    an installed PWA. For example, loading an app from the server using https://myapp.com,
    if the query string doesn''t include the parameter, the app now comes directly
    from a URL typed or clicked in the browser. When the user launches the PWA version,
    the extra query string parameter tells the app its a PWA, and can then do differently
    if it wants.


    The query string parameter doesn''t have to be anything special; you could use
    /pwa=1 or /pwa=99 if you wanted. How this is up to you; you could change the page
    content to show it is a PWA (like changing the background color or "PWA") to the
    first heading.


    Later, when we''re adding a web manifest to the Tip Calculator app, I''ll have
    you install a local web server to use for testing. The server doesn''t enable
    you to setup the parameter for the server, so I changed the start_url value to


    ```

    "start_url": "index.html?source=pwa",

    ```


    This forces the browser to open the folder''s index.html file and enables my PWA
    to install correctly in a variety of environments.


    On the web''s site, I have the Tip Calculator app serving from a subfolder of
    the site, https://learningpwa.com/tipcalc/, so I have to do things differently.
    For my hosting environment, I need to configure my manifest file with the following:


    ```

    "start_url": "/tipcalc/index.html?source=pwa",

    ```


    ```

    "scope": "/tipcalc/",

    ```


    In this example, I had to specify the target folder for my app plus add the scope
    pointing to the same folder. If I didn''t have the scope parameter, the app would
    install, but when I launched it, the hosted site 404 (not found) error page displayed
    instead of the Tip Calculator.


    As Gauss and Kindle describe it:


    > The scope defines the set of URLs that the browser considers to be within your
    app, and is used to decide when the user has left the app. The scope controls
    the URL structure that encompasses all the entry and exit points in your web app.
    Your start_url must reside within the scope.


    In this case, I''m using the scope property to tell the installed app that the
    root of all its code begins at the tipcalc folder.'
