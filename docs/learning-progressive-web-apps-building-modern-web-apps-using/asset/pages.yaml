  md: "# Create Store\n\nIndexedDB groups related data into stores; you'll need at\
    \ least one store to manage data for an application. The database's onupgradeneeded\
    \ callback is the perfect place to create it:\n\n```\nconst STORE_NAME = 'my-store';\n\
    theDB.onupgradeneeded = function (event) {\n console.log('Database update needed');\n\
    \ // does the store already exist?\n if (db.objectStoreNames.contains(STORE_NAME))\
    \ {\n  // no? Then create it\n console.log('creating store');\n var storeOptions\
    \ = { keyPath: \"3x\", autoIncrement: true };\n var theStore = db.createObjectStore(STORE_NAME,\
    \ storeOptions);\n } else {\n console.log('Store already exists');\n}\n}\n```\n\
    \nAs you can probably tell from the name, IndexedDB is an indexed database, so\
    \ you can create multiple indexes in a store and use them to more easily locate\
    \ objects in the store. In this example, I created an index called idx that the\
    \ IndexedDB engine increments for me. This gives the a unique identifier it can\
    \ use to work and with every object in the store.\n\n# Add Data\n\nUsing the previous\
    \ examples as a base, an app adds a data object to a store by executing the following\
    \ code:\n\n```\n// get a handle to the db\nlet db = theDB.result;\nlet transaction\
    \ = db.transaction([STORE_NAME], \"readonly\");\n// get a handle to the store\n\
    let store = transaction.objectStore(STORE_NAME);\n// finally, add the record\n\
    let request = add({ key1: 'value1', key2: 'value2' });\n```\n\nThat's a lot of\
    \ intermediate variables, right? We can simplify this using the following:\n\n\
    ```\n// get a handle to the db\nlet db = theDB.result;\nlet request = db.transaction([STORE_NAME],\
    \ \"readwrite\");\n.objectStore(STORE_NAME)\n.add({ key1: 'value1', key2: 'value2'\
    \ });\n```\n\n```\nrequest.onsuccess = function (event) {\n console.log('Add successful!');\n\
    };\n```"
