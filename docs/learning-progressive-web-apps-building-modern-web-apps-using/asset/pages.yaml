    # PWABuilder


    When you''re just started building PWAs, Google''s Lighthouse is a great tool
    to help you understand what you must do to make it a PWA and validate your work
    as you do. What PWA developers really need is something that helps them do the
    work to convert an app to PWA. To address that, Microsoft created the open source
    PWABuilder project.


    With Lighthouse, you can use PWABuilder to scan your site to determine what might
    be done to make it into a PWA, but PWABuilder takes it a step further and actually
    gives you the code you need to convert the web app to a PWA. You can even use
    PWABuilder to use your PWA to generate native apps for deployment to Android,
    iOS, macOS, and Windows devices.


    Microsoft also offers a command-line version of PWABuilder that you can use to
    validate web manifest settings and generate apps for deployment to Android, iOS,
    macOS, and Windows devices.


    +   3. https://github.com/GoogleChrome/lighthouse/blob/master/docs/readme.md#using-programmatically

    4. https://www.pwabuilder.com/'
