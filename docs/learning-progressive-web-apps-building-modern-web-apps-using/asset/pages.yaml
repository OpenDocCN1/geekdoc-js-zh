  md: '# Introducing Push Notifications 131


    Local notifications work only when the web page requesting is hosted. If you open
    the page directly from the file system (rather than using a URL), notifications
    don''t work.


    Remote notifications, however, require service workers to function. For notifications
    sent by a remote system, it''s the service worker that processes the notification
    when it arrives and decides what to do with.


    Before the browser can receive notifications from a web app or a remote system,
    the browser user must first grant permission to authorize the browser to show
    notifications on behalf of the app. If the user doesn''t grant permission, you
    can''t send notifications to the browser.


    You''ve probably seen these permissions periodically as you surf the web, sites
    that immediately ask for permission to send notifications to your browser before
    you know whether the site contains anything of interest. This approach leads to
    greatly annoyed users and causes tweets such as the one shown Figure 6.4.


    ![](img/d7d0133096e7f06b146f5a2a86773984_147_0.png)


    Figure 6.4 Tweet Comment about Push Permission Requests


    Web apps should wait until they''re certain sites are interested in receiving
    notifications before asking permission to send them. You gauge interest based
    on how many users visit or how much time they spend on each, then display the
    permissions only when you''re sure they want them. One option is to use the beforeinstall
    event discussed in Chapter 2, "Web App Manifest Files;to hide a subscribe button
    or link. In the app we work on in this chapter, the code never prompts automatically;
    it instead provides a button once the visitor has shown interest in the app. This
    ensures that the visitor must click to subscribe to notifications.


