  md: "# Chapter 4 Resource Caching\n\nThis code is just the first example of what\
    \ I mentioned in the sidebar that you must understand promises to work with service\
    \ workers and caches. The code is a lot less complicated than it would be with\
    \ callbacks, but there's still a lot going on. Keeping your code's methods with\
    \ the right promise or making sure you're returning a promise when you should\
    \ save you some troubleshooting time.\n\nFinally, update the fetch event listener\
    \ so it caches the first fetch before reverting to the network for requested resources.\
    \ Copy or type the following code to replace the existing fetch event in the project's\
    \ sw.js file:\n\n```\nself.addEventListener('fetch', event => {\n  console.log(`SW:\
    \ ${event.type} ${event.request.url}\\`);\n  // fires whenever the app requests\
    \ a resource (file or data)\n  event.respondWith(\n    // check if it's in the\
    \ cache\n    caches.match(event.request)\n    .then((response) => {\n      //\
    \ if it is, return the cached response\n      // object from the cache\n     \
    \ if (response) {\n        console.log(`SW: Return Cache ${event.request.url}\\\
    `);\n        return response;\n      }\n      // otherwise, tell the browser to\
    \ go get the\n      // resource from the network\n      console.log(`SW: Return\
    \ Network ${event.request.url}\\`);\n      return fetch(event.request);\n    });\n\
    \  );\n});\n```\n\nIn this event listener, the code responds to the request with\
    \ a promise; in this case, it is the promise from the call to caches.match. The\
    \ match method returns a promise that should resolve to a fetch response. If the\
    \ cache finds match, the code returns the response object from the cached request\
    \ (essentially the result of the same request processed during the install event).\n\
    \nIf the requested is not in the cache, the code returns a promise from the call\
    \ to fetch the requested resource from the network. When the fetch completes,\
    \ the code returns the result of the fetch (a response object containing the requested\
    \ resource or an error) to the browser for processing.\n\nListing 4.1 shows the\
    \ complete listing for this version of the service worker. The file is in the\
