    \ Promise.all(\n    cache.map(theCache => {\n      // is the cache key different\
    \ than the\n      // current cache name?\n      if (CACHE_NAME !== theCache) {\n\
    \        // if yes, then delete it.\n        return caches.delete(theCache);\n\
    \      }\n    })\n  );\n});\n);\n```\n\nThe problem with this code is that it\
    \ whacks all caches except for the current one used by the service worker. That's\
    \ fine if the app has one cache, but if the app opened other caches, this process\
    \ would delete all caches except for the one service worker cares about.\n\nIn\
    \ the following example, I added a CACHE_ROOT constant the service worker uses\
    \ to build the cache name. We can use this to identify all versions of the service\
    \ worker separately from all others:\n\n```\n// service worker version number\n\
    const SW_VERSION = 1;\n// the root name for our cache\nconst CACHE_ROOT = 'pwa-learn-cache';\n\
    // generates a custom cache name per service worker\nconst CACHE_NAME = `${CACHE_ROOT}-v${SW_VERSION}`;\n\
    ```\n\nAll it requires is a slight change to the statement buried deep within\
    \ the active event listener:\n\n```\nif ((CACHE_NAME !== theCache) && (theCache.startsWith(CACHE_ROOT)))\
    \ {\n```\n\nHere's the code for the event listener:\n\n```\nself.addEventListener('activate',\
    \ event => {\n  // fires after the service worker completes its installation.\n\
    \  // it's a place for the service worker to clean up from previous\n  // service\
    \ worker versions\n  console.log(`SW: ${event.type} event fired`);\n  // don't\
    \ complete the activation until all the code runs\n  event.waitUntil(\n    //\
    \ get the list of cache keys (cache names)\n    caches.keys().then(cachelist =>\
    \ {\n      // don't stop until all complete\n      return Promise.all(\n    })\n\
    \  );\\n});\n```"
