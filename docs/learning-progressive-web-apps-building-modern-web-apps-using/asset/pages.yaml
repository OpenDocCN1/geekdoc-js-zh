  md: '# Choosing a Sync Database


    The code in the web app that loads the data from the local database must have
    a fallback process that pulls the data from the server when it runs on a browser
    that doesn''t support service workers. Remember, PWAs are progressively enhanced
    web apps, they must work even when service workers aren''t supported.


    Is the poke-and-pull method the best approach for this app? No, probably. But,
    for certain types of apps, it is a reasonable approach. For example, many apps
    are built this way, using push notifications or web sockets to let client applications
    know new data.


    # Choosing a Sync Database


    As I showed in earlier section, browsers don''t provide a direct mechanism for
    a web app to send data to service workers for background sync. You can create
    a shared store accessible by both the web app and the service worker. The web
    app queues data to the store then notifies the worker to pick up and process it
    via the sync event.


    There are many ways you can implement this cache store in your web apps, but Google
    recommends, and pretty much all background sync examples on the Internet use,
    the browser''s IndexedDB. Live Data in the Service Worker and Offline Storage
    for Progressive Web Apps that IndexedDB is asynchronous and available to service
    workers. Other available options have limitations (synchronous instead of asynchronous,
    limits in data types, etc.). With that, we''ll use an IndexedDB database for the
    PWA Sync queue.


    I''m not going to provide a detailed primer on IndexedDB; there''s a lot of good
    material online that I''m not inclined to duplicate. I will, however, share some
    core examples to get us both on the same page before we jump into enhancing the
    PWA news for background sync. If you''re already familiar with IndexedDB, feel
    free to skip to the next section.


    IndexedDB provides an outdated approach to asynchronous operation. Instead of
    using the modern promise approach, it uses callbacks to handle asynchronous operations.
    This approach leads quickly to the callback hell described in Chapter 4. To help
    develop this problem, the community responded with several promise-based wrappers
    around the IndexedDB API; you can use these libraries to simplify the readability
    of your IndexedDB code. For this book, I decided not to arbitrarily point you
    to a third-party library and instead to show you the old-school callback hell
    how to interact with an IndexedDB database, but in the enhancements to the PWA
    News, I''ll implement a promise-based approach.


    # Create Database


    To create an IndexedDB database, a web app must execute the following code:


    ```

    var theDB = window.indexedDB.open(DATABASE_NAME, );

    ```


