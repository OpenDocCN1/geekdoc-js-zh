  md: '# Preparing to Code


    I wrote server code (the APIs the web app uses) using TypeScript,⁶ typed superset
    of JavaScript. Using TypeScript allowed me to define types for all my app''s variables
    and more easily find errors (based on typing). TypeScript compiles to JavaScript
