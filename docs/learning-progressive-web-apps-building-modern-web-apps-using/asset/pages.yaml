  md: "# Caching Application Resources\n\nNow, you can spruce the content up with\
    \ styling and whistles, but you're still generating HTML on the fly in your service\
    \ worker, and that's not efficient. Another issue is that this is a rather brute-force\
    \ approach, as it affects any requested resource even the browser is already quite\
    \ capable of dealing with missing images, CSS files, and other stuff. What we\
    \ need is something returns HTML only when the request says it can handle HTML,\
    \ like this:\n\n```\nif (event.request.headers.get('accept').includes('text/html'))\
    \ {\n  // do something cool\n}\n\n```\n\nHere's a full implementation with the\
    \ accepts check and generated HTML content:\n\n```\nreturn fetch(event.request)\n\
    \  .catch(() => {\n    if (event.request.headers.get('accept').includes('text/html'))\
    \ {\n      return Response(\n        \"\"<!DOCTYPE html><html><body>\" + \n  \
    \      \"\"<h1>Access Error</h1>\"\" + \n        \"\"<p>Hmm, I can't see to access\
    \ that page.</p>\"\" + \n        \"\"</body></html>\"\",\n        headers: { \"\
    Content-Type\": \"text/html\" }\n      );\n    }\n  });\n\n```\n\nThis approach\
    \ limits when the service worker responds with HTML, but we're still sending generated\
    \ HTML. What should we do send a custom HTML page that looks like the rest of\
    \ our site. We've already cached the site's CSS file, so all we need to do is\
    \ add the page we want when the app is offline, or the browser can't locate the\
    \ page.\n\nThe app already has this offline page located at the project's public\\\
    offline.html. Let's add it to cache using a slightly different approach. First,\
    \ add the following line to the top of the project's sw.js file:\n\n```\nconst\
    \ OFFLINE_PAGE = '/offline.html';\n```\n\nThis creates a reference to the offline\
    \ file we use when we serve it when a resource is found. Next, update the urlList\
    \ array by adding OFFLINE_PAGE as the last item in the array:\n\n```\nvar urlList\
    \ = [\n  '/',\n  '/webmanifest',\nn  '/index.html',\n  '/css/custom.css',\n  '/img/bing-logo.png',\n\
    \  '/js/index.js',\n  '/js/sw-reg.js',\n  '/js/utils.js',\n  OFFLINE_PAGE\n];\n\
    ```"
