  md: "154\n\nChapter 6 Push Notifications\n\nThe complete code for the project's\
    \ index.js file up to this point in the chapter is in the project's chapter-06\\\
    public\\chapter-code\\index-62.js file.\n\n# Unsubscribing from Notifications\n\
    \nUnsubscribing from notifications is much easier than subscribing to them. You\
    \ still need access to the registration object, and you must use the registration\
    \ object to get to the subscription object. Once you have that, it's a simple\
    \ call to subscription.unsubscribe to unsubscribe from notifications.\n\nOf course,\
    \ everything involved uses promises, so the complete code looks like this:\n\n\
    ```\nnavigator.serviceWorker.ready.then(registration => {\n  registration.pushManager.getSubscription()\n\
    \  .then(subscription => {\n    subscription.unsubscribe()\n    .then(status =>\
    \ {\n      if (status) {\n        // successfully unsubscribed\n      } else {\n\
    \        // Failure\n      }\n    });\n  });\n});\n```\n\nThe status value returned\
    \ from unsubscribe is a Boolean value (true or false) indicating result of the\
    \ operation.\n\nFor our app, we need a little more than that. We want to tell\
    \ the user the subscription completed successfully (or not), plus we must remove\
    \ the subscription from the server so it knows not to send notifications to this\
    \ browser again. With that mind, add the following code to your Unsubscribe function\
    \ in the project's chapter-06\\public\\js\\index.js file.\n\n```\nnavigator.serviceWorker.ready.then(registration\
    \ => {\n  registration.pushManager.getSubscription()\n  .then(subscription =>\
    \ {\n    subscription.unsubscribe()\n    .then(status => {\n      console.log(`doUnsubscribe:\
    \ status: ${status}`)\\n      if (status) {\n        Swal.fire({\n          type:\
    \ 'info',\n          title: 'Unsubscribe',\n          text: 'Successfully unsubscribed',\n\
    \          timer: 2000\n        });\n      }\n    });\n  });\n});\n```"
