  md: '# Chapter 9 Automating Service Workers with Google Workbox


    What follows is a complete service worker for the app. The most important part
    is the precacheManifest, an array of objects representing every file resource
    in the app. Each object consists of a url property containing a relative path
    to the resource file, and the revision property, which is a hash of the file.
    Workbox uses this hash to determine when the file changes so it can update the
    cache.


    At the end of the generated file is the following code:


    ```

    workbox.preaching.precacheAndRoute(self.__precacheManifest, {});

    ```


    This code initiates resource precaching and instructs the Workbox JavaScript library
    to save resources from the cache. That''s; it''s a complete caching service worker
    using Workbox.


    Switch back to the terminal window and start Chapter 2 by executing the following
    command:


    ```

    http-server

    ```


    Open a browser and point it to http://localhost:8080/index.html; the browser will
    show the page you''ve already seen from Figure 2.1. Nothing has changed in the
    UI; what is different under the covers. Open the browser''s developer tools panel
    and look at the console. You should see the output shown in Figure 9.2.


    ![](img/d7d0133096e7f06b146f5a2a86773984_228_0.png)


    Figure 9.2 Workbook Precaching Tip Calculator Files


    Our generated service worker cached 40 files, and those resources are cached and
    ready to enable the browser to run the app offline. To test it, turn off the network,
    reload the app, and look at the console. You''ll see output indicating the service
    worker serving resource files from cache, as shown in Figure 9.3.'
