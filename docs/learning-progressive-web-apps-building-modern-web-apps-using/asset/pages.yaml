  md: "# # Validating Notification Support\n\nSome browsers, such as Safari on iOS,\
    \ don't support notifications, before an app does anything with them, the app\
    \ must first check to see if notifications are even available in the browser.\
    \ To do this, for the existence of the Notification object using the following:\n\
    \n```\n// does the browser support notification?\nif (\"Notification\" in window)\
    \ {\n  // yes! Do something interesting\n```\n\n```\n} else {\n  // no? Then display\
    \ a warning message\n  // or disable the part of the ui that handles notifications\n\
    }\n```\n\nThis check is a core component of the updateUI function in the project's\
    \ chapter-06/public/js/Index.js. The app executes this function to update the\
    \ UI at startup and every time the browser's subscription changes.\n\nDoes your\
    \ app have to check for notification support before doing anything related to\
    \ notifications? No, really. If you don't, any code that uses the Notification\
    \ object will simply fail on browsers that don't support notifications.\n\n# #\
    \ Checking Notification Permission\n\nOnce an app knows the browser supports notifications,\
    \ it should check whether the user has granted permission using the Notification\
    \ object's permission property, as shown in the following code:\n\n```\nif (Notification.permission\
    \ === \"granted\") {\n  console.log('User has approved notifications');\n}\n```\n\
    \nThe supported permission values are\n\n+   - granted\n- denied\n- default\n\n\
    A permission value of 'granted' means that the user approved use of notifications\
    \ for this app. A permission value of 'denied' means the opposite: the user did\
    \ not grant permission for notifications for this app. Easy, right?\n\nThe 'default'\
    \ value is a weird one as it means that the browser is not sure whether the user\
    \ approved notifications. In this case, the browser simply assumes the user has\
    \ not granted permission. This happens when the user closes the permissions prompt\
    \ dialog without making a selection."
