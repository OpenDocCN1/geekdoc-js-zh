    # Send Data from a Web App to a Service Worker


    We kick off the coding sections of this chapter highlighting how to send data
    between a web app and a service worker. In the sample app from Chapter 6, the
    state of the browser changes when the user clicks or taps the Subscribe and Unsubscribe
    buttons. When happens, what if the service worker needs to know this and in some
    way with that information? The service worker''s postMessage method enables an
    app to do this.


    When an need to send data to a service worker, it can send the data using the
    following:


    ```

    navigator.serviceWorker.controller.postMessage(DATA_OBJECT);

    ```


    In this example, the DATA_OBJECT is simply a JavaScript object containing whatever
    the app wants to deliver to the service worker.


    To see this in action, open the project''s chapter-07\public\jsindex.js file,
    and in the file''s doSubscribe function, look for the block of code that executes
    after the browser successfully subscribes for notifications. You''ll find the
    following code:


    ```

    console.log(''doSubscribe: Browser subscribed'');

    ```


    Immediately following that line of code, add the following:


    ```

    // send a message to the service worker letting it know

    navigator.serviceWorker.controller.postMessage({ subscription: true });

    ```


    This code sends a message to the service worker with a data object containing
    the subscription property with a value of true. This data tells the service worker
    the notification state for this browser (immediately after the browser subscribes).
    I you show you how the service worker uses this information.


    Next, in the file''s doSubscribe function, look for the following:


    ```

    if (status) {

    ```


    Immediately following that line of code, add


    ```

    // tell the service worker we are unsubscribed

    navigator.serviceWorker.controller.postMessage({ subscription: false });

    ```'
