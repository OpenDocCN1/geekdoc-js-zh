  md: "# Anatomy of a Web Manifest\n\nTo make a web app manifest available to your\
    \ web app, you must add a link reference to it in the <head> section of the web\
    \ app's index.html file:\n\n```\n<link rel=\"manifest\" href=\"app.webmanifest\"\
    >\n```\n\nIn this example, the link reference points to a file called app.webmanifest\
    \ located in the root folder of the web app. For the chapter sample project, the\
    \ <head> section looks a like this:\n\n```\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Tip Calculator</title>\n  <meta name=\"description\" content=\"A simple\
    \ tip calculator app\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n  <link rel=\"manifest\" href=\"app.webmanifest\">\n</head>\n\
    ```\n\nNow I've shown how a browser uses a manifest and how to link it into the\
    \ app, let's talk about what goes in the manifest file.\n\n# Anatomy of a Web\
    \ App Manifest\n\nA web app manifest is a JavaScript Object Notation (JSON) file.\
    \ The file doesn't have a specific name or extension; what matters is that it\
    \ contains a JSON object with specific properties as in Listing 2.1. In the early\
    \ days, developers usually called something like manifest.json, but nowadays the\
    \ convention is to use a file name with the .webmanifest extension. We're going\
    \ to use the file shown in Listing 2.2 later, but for now we use it as an example\
    \ of a simple .webmanifest file.\n\n# Listing 2.1 A Sample Web App Manifest File\n\
    \n```\n{\n  \"short_name\": \"TipCalc\",\n  \"name\": \"Tip Calculator\",\n  \"\
    icons\": [\n    {\n      \"src\": \"icons/android-icon-192x192.png\",\n      \"\
    sizes\": \"192x192\",\n      \"type\": \"image/png\"\n    },\n    {\n      \"\
    src\": \"icons/android-icon-512x512.png\",\n      \"sizes\": \"512x512\",\n  \
    \    \"type\": \"image/png\"\n    }\n  ],\n  \"start_url\": \"/index.html?source=pwa\"\
    ,\n  \"display\": \"standalone\",\n  \"background_color\": \"#FFFFFF\",\n  \"\
    theme_color\": \"#3653B3\"\n}\n```"
  merge: -1
