  md: "# Adding a Service Worker\n\nAs explained earlier, installable apps must have\
    \ a service worker registered, and the service worker must offer specific capabilities.\
    \ The remaining chapters deal with service workers in detail, so for now we're\
    \ just using a sample I included in the project and dig how do it in later chapters.\
    \ I'll explain a little about what's going on here, but I promise you'll get all\
    \ the details you need on service workers starting with the next chapter.\n\n\
    Open the project's index.html file, and add the following code to the end of the\
    \ file's <head> section:\n\n```\n<script>\n// does the browser support service\
    \ workers?\nif ('serviceWorker' in navigator) {\n  // register our service worker\n\
    \  navigator.serviceWorker.register('./sw.js')\n    .then(function (reg) {\n \
    \     // display a success message\n      console.log(`Service Worker Registration\
    \ (Scope: ${reg.scope})`);\n    })\n    .catch(function (error) {\n      // display\
    \ an error message\n      console.log(`Service Worker Error (${error})`);\n  \
    \  });\n} else {\n  // happens when the app isn't served over a TLS connection\
    \ (HTTPS)\n  console.warn('Service Worker not available');\n}\n</script>\n```\n\
    \n> Tip In this sample code and much of the code in the remainder of the book,\
    \ I use JavaScript's template literals to format console output with values from\
    \ the running app. Pay special attention to the quote marks used: templates use\
    \ the back tick (\\`) ) character, whereas nontemplate code uses the single-quote\
    \ mark ('').\n\nThis code checks whether the browser supports service workers,\
    \ then installs the service worker if it writes a warning to the console if it\
    \ doesn't. The service worker is in a file called sw.js; it doesn't do much of\
    \ anything—it's just to help make the app installable (one of the installable\
    \ requirements).\n\nCould you put this code in an external JavaScript file? Yes.\
    \ There's no reason it's instead of a JavaScript file. I use that in approaching\
    \ the remaining chapters of this book.\n\n+   - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Template_literals"
