  md: '# # Preface


    When building apps targeting desktops, laptops, smartphones, and tablets, developers
    have generally two options to use: native apps built specifically for the target
    platform or web apps that ultimately can run on any system through the abstraction
    layer provided by web browsers. Building native apps for any target platform is
    a time-consuming and expensive proposition, especially when your app targets multiple
    types of systems (desktop computers, smartphones, televisions, etc.).


    Web apps have limitations due to reduced screen real estate, processor speed,
    network bandwidth, and more. Many of these limitations have disappeared, but there''s
    still considerable disparity between native app and web capabilities.


    Web developers have a lot of tools at their disposal to help them build rich,
    engaging apps. Over the years, different technologies such as Sun Microsystems''
    Java and Adobe Flash appeared with the expectation that would change the world
    for web apps—delivering more engaging experiences for users. But did that ultimately
    disappeared from the browser for good reason.


    What developers and users need is a way to enable web apps to work more like native
    apps. If we had that, our web apps would soar and enable us more easily deliver
    cross-platform apps through the browser rather than handicrafting native apps
    for each supported platform.


    Over the years, browsers, especially those running on mobile devices such as smartphones
    and tablets, started exposing native capabilities to web apps. For example, modern
    web apps can access the device''s file system and let browser-based app know the
    device''s geolocation. This enables web apps to work more like native apps, but
    there were still limitations. Service workers are a relatively new technology
    that makes it easier for web apps to bridge the gap between native and web capabilities,
    removing many limitations from web apps.


    This is a book about service workers.


    Yes, I know, the title says the book is about Progressive Web Apps (PWAs), and
    it is, but the book focuses on how to use service workers to enhance the capabilities
    of a web app and create PWAs.


    There are several books out there that focus on the engagement impact of PWAs;
    how to build PWAs that delight and inspire users to do more in the app. This isn''t
    that kind of book.


    This book is focused as much as possible on the technologies enabling PWAs and
    how to use them to enhance your web apps to deliver a more native-like experience
    in your apps.


    I come to you with 15 years of experience with mobile development (I wrote the
    first book on BlackBerry so many years ago), and as Simon said in the Foreword,
    PWAs are the


    +   1. https://en.wikipedia.org/wiki/Java_(software_platform)


    +   2. https://en.wikipedia.org/wiki/Adobe_Flash'
