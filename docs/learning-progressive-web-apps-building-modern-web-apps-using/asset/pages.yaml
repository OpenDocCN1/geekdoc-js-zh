  md: '# Using PWABBuilder CLI


    PWABBuilder supports a command-line option as well, and what you get is essentially
    an updated version of what was available with the ManifoldJS project many years
    ago: the ability to generate deployable apps for multiple platforms based on a
    single manifest.


    To install the PWABBuilder command-line interface (CLI), open a terminal window
    or command prompt and execute the following command:


    ```

    npm install -g pwabuilder

    ```


    Next, to generate apps based on the web at a specific URL, execute the following
    command:


    ```

    pwabuilder <url>

    ```


    Replace <url> with the full URL pointing to the web app. For example, to generate
    apps for the Tip Calculator app, you would execute the following command:


    ```

    pwabuilder https://learningwa.com/tipcalc/

    ```


    For a locally hosted app the ones we created in this book, use the following command:


    ```

    pwabuilder http://localhost:3001

    ```


    The PWABBuilder CLI will scan the file and warn you if it finds any issues with
    the app, as shown in the Figure of 8.14. Since it''s generating apps for each
    target platform, you should fix these issues before continuing. The tool will
    create apps for multiple platforms in a folder named with the name of the scanned
    app.


    ![](img/d7d0133096e7f06b146f5a2a86773984_213_0.png)


    Figure 8.14 PWABBuilder CLI Output and Results


    You can open the newly created folder and read the instructions provided with
    each target platform to build and deploy apps for each.'
