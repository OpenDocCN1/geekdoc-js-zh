  md: 'Preface


    xiii


    next step in making the web a first-class development platform—especially for
    mobile apps. My interest in writing this book focuses on PWAs'' impact on mobile
    developers, but everything here applies to web apps running on a desktop browser
    as well.


    If you''ve read any of my books, you already know that this manuscript contains
    no phrases or content in any language but English (I refuse to put down the book
    to look up obscure phrase in Latin or French to understand a point). This book
    also contains no pop culture references (well, except for one that I describe
    completely so you won''t feel left out if you don''t already know.


    Unlike previous technical books, which focused on the technologies and how to
    use them (with lists of code examples), this book is project-based. As you work
    through the chapters, at different points you will start with one complete, standalone
    web apps, convert into PWAs using service workers and other technologies.


    The sample apps for this book were written to be simple and easy to understand,
    so they''re not fancy. I have built them as amazing, reactive, modern web apps,
    leveraging JavaScript frameworks such as Vue or React—but I built them using vanilla,
    HTML, CSS, and JavaScript. This removes a lot of extraneous code from the apps
    and leaves what you just need to understand the topic at hand.


    You can find all the source code for the sample apps on GitHub at https://github.com/johnwargo/learning-pwa-code.
    I added a resources file for each chapter; it lists all of the links used in the
    chapter. Rather than typing in long URLs from the printed version of this book,
    you can simply open the resources in a separate file and quickly access any link
    from the chapter.


    Unlike the code repositories for other books, this book''s source code doesn''t
    contain only before and after versions of the apps. As you complete a chapter
    section, you''ll find the source code modifications for that section in a separate
    file. This enables you to more easily build the app with the chapter content while
    having that section''s code available in case you have an issue and want to compare
    the completed code with yours. This approach should streamline your following
    along, especially if you create typos or bugs as you work.


    If you have any questions or comments about the book or if you find an error in
    the text or code, please submit them through the issues area in the book''s GitHub
    repository at https://github.com/johnwargo/learning-pwa-code/issues. The code
