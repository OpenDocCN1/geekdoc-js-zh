  md: "# Chapter 4 Resource Caching\n\nWith this in place, the app knows about the\
    \ offline file and will cache it during service worker installation. Finally,\
    \ in the fetch event listener, add the following code to the end of the fetch\
    \ listener when the service worker knows the resource is not in the cache:\n\n\
