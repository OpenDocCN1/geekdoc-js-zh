- img_proc: true
  md: '# Introducing Background Sync


    Developers have two options for implementing this functionality. The first option
    uses the background sync process described in this chapter, and the other uses
    the browser''s ability to send data between a service worker and a web app, as
    described in Chapter 7, “Passing Data between Service Workers and Web Applications.\
    The difference between these two approaches is that background sync accommodates
    scenarios in which service workers can''t send the data to the server immediately;
    instead, the service worker retries the action whenever the browser comes online
    (later). The options described in Chapter 7 enable a web app to pass data between
    the two entities (the web app and the service worker) is really only useful for
    real-time operations.


    To make background sync work, web apps share data with service workers through
    a local database shared by both processes:


    +   - The service worker and the web app both use the same local database. The
    web app writes data to the database. The service worker reads action from the
    database, then deletes action once it''s successfully processed.

    - When the app invokes background sync to process an action, it writes the action''s
    data to the database and then fires off sync event to the service worker to process
    the action.

    - When the service worker''s sync event listener receives the event, in the event
    listener reads the action from the local database and does whatever it needs to
    do with the data.

    - If the browser (and therefore the service worker) has network connectivity and
    can perform the action immediately, it does. If the action succeeds, the service
    worker deletes the action''s data from the local database. If it fails, it leaves
    the data there for the service worker to try again the next time the sync event
    fires.

    - If the browser doesn''t have network connectivity, the browser queues the event
    to try again later.

    - This can''t go on forever. After some time, the action must be allowed to pass
    on to greener pastures. In this case, the browser warns the service worker that
    it''s trying to complete the action and the service worker must remove the data
    from the queue.


    Figure 5.2 illustrates the process, highlighting the roles the browser and service
    worker play in the process.


    ![](img/d7d0133096e7f06b146f5a2a86773984_117_0.png)


    Figure 5.2 Service Worker Background Sync Overview'
