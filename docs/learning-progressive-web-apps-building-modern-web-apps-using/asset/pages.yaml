  md: '# Generating Encryption Keys


    information won''t help you learn push. The push process uses them, so you must
    have a set of keys for any web app you create that sends browser notifications.


    One of the ways to generate a set of keys is to use the Secure VAPID generator.
    The server process included with this chapter''s code uses the popular web-push
    module to manage delivery of notification requests to the browser cloud service.
    It includes a function that generates the keys automatically, so that''s what
    we''ll use.


    Open a terminal window, navigate to the project''s `learning-pwa-code-chapter-06`
    folder, and execute the following command:


    ```

    node generate-keys.js

    ```


    This executes a little node app I wrote that generates a set of VAPID keys and
    writes them to some configuration files used by the web app. The app uses the
    web-push modules webpush.generateVAPIDKeys() method, which handles the whole process
    for us.


    I mentioned earlier that the client requires the server''s public key and the
    server uses the private key, so the process generates two files. The first is
    `chapter-06\app\config.ts`, which looks like this:


    ```

    const Config = {

    GCMAPID_KEY: ''SUPER-SECRET-PUBLIC-KEY'',

    VAPID_PRIVATE: ''SUPER-SECRET-PRIVATE-KEY''

    };

    ```


    The server uses this file to provide the private encryption key when sending notification
    messages through a push service.


    The other file is `chapter-06\public\js\config.js`, which looks like this:


    ```

    const Config = {

    VAPID_PUBLIC: ''SUPER-SECRET-PUBLIC-KEY''

    };

    ```


    The web app uses this file to provide the public encryption key when subscribing
    to notifications.


    > Note

    You don''t have to break your VAPID keys out into separate configuration files
    as I did here. I did this because I know the server source code would be publicly
    available through the book''s GitHub repository, and saving the keys to separate
    files enabled me to omit them from the repository.


    As in previous chapters, I coded the server app in TypeScript, so before you use
    the server with the new configuration file, you must open a terminal window, navigate
    to the project folder, and execute the following command:


    ```

    tsc

    ```


