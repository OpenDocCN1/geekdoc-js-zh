  md: "# Cache Management\n\nWe updated our service worker so it caches the main resources\
    \ the app uses, but what do you do when you update your app? How do you get the\
    \ new versions of the app's resources into the cache? In this section, we discuss\
    \ strategies for managing your local cache before we get back into caching strategies\
    \ in the sections that follow.\n\nThe first question we must answer is the issue\
    \ of cache management is, How can the app recognize that there's a new version\
    \ of the web app? In Chapter 2, \"Web App Manifest Files,\" I mentioned that the\
    \ browser downloads the service worker every time you reload the app and checks\
    \ to make sure it is the same one installed in the browser. If it's different\
    \ (if it changes by least one byte), the browser parses the service worker, executes,\
    \ and completes the installation and activation process for the downloaded service\
    \ worker. This process gives us a useful option: at the top of the service worker,\
    \ add a simple variable or constant like:\n\n```\n// service worker version number\n\
    const SW_VERSION = 1;\n```\n\nThis constant defines a simple service worker version\
    \ identifier, and when you publish a new version of the app, you simply increment\
    \ its value. With that in place, the browser detects the new service worker version,\
    \ installs the updated service worker, and rebuilds the cache with the new resources\
    \ for the app.\n\n> The browser doesn't detect the service worker change because\
    \ it reads variable. It detects the service worker change because it does a byte\
    \ comparison between the active service worker and the one loaded by the app.\
    \ If they're different, the browser knows there's a new version to register. You\
    \ could just easily toggle the constant between two values every time you update\
    \ your service worker to get the same result.\n\nWhat if the new app version uses\
    \ different names for app resources? What do you do now? Well, one option is to\
    \ simply cache the new resources and ignore the old ones which we already have\
    \ in place in Listing 4.1. The problem with that approach is that you'll be caching\
    \ data you'll never need again, and that's wasteful (especially on mobile devices).\n\
    \nThinking out here for a while (no changes for you to make to the app), you could\
    \ delete the cache using the following:\n\n```\ncaches.delete('pwa-learn-cache').then(()\
    \ => {\n  console.log('SW: Cache deleted');\n  // do something else here...\n\n\
    });\n```\n\nFrom the service worker lifecycle, we know that the current service\
    \ worker is active and still using this cache. If we delete the cache under the\
    \ current service worker, who knows what would happen (probably something bad).\
    \ No, there must be a better way."
