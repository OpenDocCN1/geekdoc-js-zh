  md: '# Push Notifications


    One of the things that makes mobile apps so engaging is the mobile platform push
    notification-tion capabilities that enable app developers to send information
    to the device running the app. Depending on the device OS and the type of notification,
    the information sent to the device displays in the device''s notification area
    or appears in-app. Notifications expand the scope of the app beyond what''s currently
    available on the device and deliver a clean way to keep app users informed of
    almost anything.


    Service workers web apps some of the same capabilities. In this chapter, I show
    how to configure a web app to support notifications plus to send notifications
    to subscribed browsers through a server process. Like the previous one, this chapter
    is chock-full of code, so let''s get started.


    # Introducing Push Notifications


    In web apps, notifications are little pop-up windows display when they receive
    a notification message. The web app can send notifications to itself, or you can
    send them to the browser from a remote system, usually by an app or web server.
    Notifications appear only when the target browser is running, but the default
    browser on many smartphones runs constantly, and Google Chrome has a setting that
    users can enable to keep that running in the background as well. Figures 6.1,
    6.2, and 6.3 show the same notification on Windows, macOS, and Android.


    Windows notifications appear at the bottom-left corner of the desktop, while macOS
    notifications appear in the upper-right corner of the desktop. On Android, notifications
    appear alongside other notifications displayed by the device. If you''re wondering
    why I''m not saying anything about iOS, that''s because I write this, iOS doesn''t
    support browser notifications.


    ![](img/d7d0133096e7f06b146f5a2a86773984_145_0.png)


    Figure 6.1 A Browser Notification on Windows'
  merge: -1
  pgno: 145
- img_proc: true
  md: '![](img/d7d0133096e7f06b146f5a2a86773984_146_0.png)


    Figure 6.2 A Browser Notification on macOS


    ![](img/d7d0133096e7f06b146f5a2a86773984_146_1.png)


    Figure 6.3 A Browser Notification on Android


    These are often called *push notifications* because they''re usually pushed to
    the browser over a network connection. I prefer to call *remote notifications*
    because they''re sent from a remote service. The other type of notification is
    what I call *local notifications*, that is, notifications sent to the browser
    by the web app running in that browser. You''ll see examples of both in the code
    we use later in the chapter.'
