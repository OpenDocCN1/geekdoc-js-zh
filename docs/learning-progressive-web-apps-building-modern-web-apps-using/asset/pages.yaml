  md: "# Chapter 9 Automating Service Workers with Googlebox\n\n![](img/d7d0133096e7f06b146f5a2a86773984_238_0.png)\n\
    \nFigure 9.6 Web Caching Shown through Developer Tools Network\n\nWorkbook supports\
    \ plugins as well, and there are many available for you to use. For example, there’s\
    \ an extension plugin you can use to keep resources in a cache for a number of\
    \ seconds:\n\n```\nworkbook.routing.registerRoute(\n  /.(?:png|jpg|svg)$,\n  new\
    \ workbook.strategies.CacheFirst({\n    cacheName: 'app-images',\n    plugins:\
    \ [\n      new workbook.expiration.Plugin({\n        maxEntries: 50,\n       \
    \ maxAgeSeconds: 86400\n      })\n    ]\n  })\n);\n```\n\nThis example can cache\
    \ a maximum of 50 .png, .jpg, and .svg files for 10 days (864,000 seconds). The\
    \ example also adds an additional cache called app-images just for those image\
    \ files."
