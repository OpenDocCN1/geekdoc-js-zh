  md: "# Remote Notifications\n\n![](img/d7d0133096e7f06b146f5a2a86773984_173_0.png)\n\
    \nFigure 6.17 Browser Developer Tools: Sending Push Messages\n\nIf the notification\
    \ includes an action, there's still one more thing you must do: add an event listener\
    \ for the notificationclick event to the sw.js file, which looks like this:\n\n\
    ```\nself.addEventListener('notificationclick', function (event) {\n    console.log('SW:\
    \ Notification clicked');\n    console.dir(event);\n    if (event.action === 'like')\
    \ {\n        waitUntil(\n            // do something for the like action\n   \
    \     );\n    } else {\n        event.waitUntil(\n            // do something\
    \ for the dislike action\n        );\n    }\n});\n```\n\nNotice that the event\
    \ listener uses waitUntil to tell the service worker not to shut down the event\
    \ listener until it's done processing the user's action click.\n\nThe complete\
    \ code for the project's sw.js file up to this point is in the project's chapter-06_public-chapter-sw-62.js\
    \ file.\n\nAt this point, the web app is ready to test; I'll show you two different\
    \ ways to test the work we've done so far. We'll start using a third-party developer\
    \ tool, but also work with the project's admin process (accessible through http://localhost:3001/admin)."
