    > Note

    PWABBuilder started as a Microsoft open source project called ManifoldJS, a framework
    that enabled developers to create a manifest file and web app, then use a command-line
    tool to generate apps for multiple target platforms. The framework basically took
    a web app and generated Apache Cordova apps for several target platforms. It created
    native apps for each target platform, but the app consisted mainly of the web
    app running in a native app container.


