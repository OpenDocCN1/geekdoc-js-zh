  md: "You could extend the earlier example to something like this:\n\n```\n// service\
    \ worker version number\nconst SW_VERSION = 1;\n// generates a custom cache name\
    \ per service worker\nconst CACHE_NAME = `pwa-learn-cache-v${SW_VERSION}\\`;\n\
    ```\n\nThis generates a custom name for each cache version: pwa-learn-cache-v1,\
    \ pwa-learn-cache-v2, pwa-learn-cache-v3, and so on. Every time the swVersion\
    \ value changes, the code generates a new cacheName and therefore a new cache.\
    \ This requires a small change to the service worker's install handler, replacing\
    \ the original version's\n\n```\ncaches.open('pwa-learn-cache')\n\nwith\n\ncaches.open(CACHE_NAME)\n\
    ```\n\nHere's the complete listing for the new event handler:\n\n```\nself.addEventListener('install',\
    \ event => {\n  console.log(`SW: ${event.type} event fired`);\n  event.waitUntil(\n\
    \    // create a local cache for our app resources\n    caches.open(CACHE_NAME)\n\
    \      // once it's open...\n      .then(cache => {\n        console.log(`SW:\
    \ Cache opened`);\n        // cache all of resources from the array\n        return\
    \ cache.addAll(urlList);\n      })\n      .catch(error => {\n        console.error(error);\n\
    \      })\n  );\n});\n```\n\nWell, this gets us part way. We've created and populated\
    \ a new cache for this new service worker version, but left behind the previous\
    \ cache. This would work, but we're still leaving around cached files we will\
    \ never use again. Users would never notice, but it would bother me.\n\nOK, so\
    \ what do we do? The service worker activate event fires after the service worker\
    \ installs and as the service worker becomes the active service worker. At this\
    \ point, the previous service worker is no longer active, so this feels like a\
    \ perfect place for us to clean up the cache. The following code shows an updated\
    \ service worker activate event that deletes all caches that don't match the name\
    \ of the current service worker's cache:\n\n```\nself.addEventListener('activate',\
    \ event => {\n  // fires after the service worker completes its installation.\n\
    \  // it's a place for the service worker to clean up from\n  // previous service\
    \ worker versions\n  console.log(`SW: ${event.type} event fired`);\n```"
