  md: '# Add Precaching to an Existing Service Worker


    Many developers want more control over their app''s service worker, Workbox supports
    a workflow for use case as well. With this approach, you make some simple changes
    to a service worker, then use the Workbox CLI to populate the resource array you
    saw in the previous section. With the resource list in place, you add code to
    the service worker to enable the appropriate caching strategies for your app resources.


    To start, make another copy (second) of the project''s chapter-09/tip-calc folder,
    and call this version tc2. If, for some reason, you didn''t complete the Node
    module installation in the previous section, open a terminal window, navigate
    to the new tc2 folder, then execute the following command:


    ```

    npm install -g workbox-cli

    ```


    The sample project includes a simple service worker in a file called sw-start.js.
    Open that file now in the tc2 folder and add the following lines of code to the
    top of the file:


    ```

    importScripts(''https://storage.googleapis.com/workbox-cdn/releases/4.3.1/workbox-sw.js'');

    ```


    ```

    workbox.precaching.precacheAndRoute([]);

    ```


    This adds the Workbox library to the service worker and a placeholder for the
    resource array you saw in the previous section.


    In the same terminal window, execute the following command:


    ```

    workbox -injectManifest

    ```


    This runs the Workbox Wizard, as we did in the previous section, enabling a mode
    that instructs the CLI that it must prepare its configuration file to update an
    existing service worker rather than generate a new one. The Workbox works the
    same way we saw in the previous section with only one additional change.


    The wizard starts by asking for your app''s source code folder:


    ? Please enter the path to the root of your web app: then press Enter. The period
    indicates the current folder (make sure you''re in the tc2 folder).


    Next, the wizard asks you to select the subfolders containing resources that require
    precaching:


    ? Which file types would you like to precache (Press <space> to select, <a> to
    toggle all, <i> to invert selection)


    +   * (*) css

    (*) png

    (*) ico

    (*) html

    (*) js

    (*) md

    (*) svg'
