  md: "# Controlling Cache Strategies\n\nWhen we skip the whole precaching process,\
    \ we can build a service worker that uses Workbook to implement caching strategies\
    \ for only the app resources needed by the app. Before I show you how to do that,\
    \ I must first cover the different caching strategies available through Workbook.\
    \ Here we go!\n\nWorkbook provides support for the following caching strategies:\n\
    \n+   - CacheFirst: Return the cached version of a resource, retrieving the resource\
    \ from the network (adding it to the cache) if it's not already in the cache.\n\
    - CacheOnly: Return the resource from the cache. If the resource is not in the\
    \ cache, the fetch will fail. Your service worker must populate the cache during\
    \ service worker installation to enable this option.\n- NetworkFirst: Return the\
    \ network version of the resource, retrieving the resource from the cache if the\
    \ network is not available. The fetch fails when the network version is not available\
    \ and the resource is not in the cache.\n- NetworkOnly: Return the network version\
    \ of the resource, failing if it's not available.\n- StaleWhileRevalidate: Return\
    \ the cached version of a resource, update the cached version from the network\
    \ so it's there the next time the app requests the resource. This gets resources\
    \ to app quickly, but it might not be the most recent version.\n\nWhen to a caching\
    \ strategy when a web app requests resources, register a route to the resource\
    \ using the following code:\n\n```\nworkbook.routing.registerRoute( match, handler\
    \ );\n```\n\nIn this example, the match parameter refers to one of the following\
    \ options used to match the requested resource with this route:\n\n+   - Callback\
    \ function\n- Regular expression\n- String\n\nThe handler parameter refers to\
    \ one of the caching strategies listed earlier in this section.\n\nLet's see all\
    \ of this in action.\n the callback option, you provide a function Workbook executes\
    \ to determine whether the requested resource matches the selection criteria for\
    \ this route. Here's an example:\n\n```\nconst matchX = { url, event } => {\n\
    \  return url.href.includes('x');\n};\n\nworkbook.routing.registerRoute(\n  matchX,\n\
    \  new workbook.strategies.StaleWhileRevalidate()\n);\n```"
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 9 Automating Service Workers with Google Workbox


    In this example, the route matches the request URL if the full URL to the requested
    resource contains an. If it does, the service worker uses the StaleWhileRevalidate
    strategy for the resource. If not, this resource is ignored and hopefully picked
    up by some route.


    You can match resources using a regular expression, as shown in the following
    example:


    ```

    workbox.routing.registerRoute(

    /\.(html)?$/,nnew workbox.strategies.NetworkFirst(),

    );

    ```


    In this example, the regular expression in the first parameter matches any file
    that has .html in the resource path. When the app requests an HTML file, the service
    worker will return the resource using the NetworkFirst strategy.


    You can also use different strategies for different types of files. For example,
    the following code uses the StaleWhileRevalidate strategy for .js and .css files,
    but NetworkFirst for .html files:


    ```

    workbox.routing.registerRoute(

    /\.(js|css)$$/,nnew workbox.strategies.StaleWhileRevalidate(),

    );

    ```


    ```

    workbox.routing.registerRoute(

    /\.(html)?$/,nnew workbox.strategies.NetworkFirst(),

    );

    ```


    Finally, you can match resources using a string value, as shown in the following
    example:


    ```

    workbox.routing.registerRoute(

    ''/img/my-logo.png'',

    new workbox.strategies.CacheFirst(),

    );

    ```


    In this example, the route matches if the requested resource is the app''s /img/my-logo.png
    file. When the app requests the logo file, the service worker will return the
    resource using the CacheFirst strategy.


    Let''s add some coding to the Tip Calculator app. Make another copy of the project''s
    chapter-09/tip-calc folder, and add this version tc3. Next, rename the copied
    project''s sw-start.js file to sw.js and open the renamed file in your code editor.


    At the top of the file, add the following import:


    ```

    importScripts(''https://storage.googleapis.com/workbox-cdn/releases/4.3.1/

    workbox-sw.js'');

    ```


    This adds the Workbox library to the app.'
