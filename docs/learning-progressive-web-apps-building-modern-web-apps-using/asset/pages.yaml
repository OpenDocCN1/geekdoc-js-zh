    # Introducing Service Workers


    A service worker is a block of JavaScript code a web app installs in the browser
    under certain conditions and when the browser needs to it (based on events that
    fire). Web apps use service workers to add additional capabilities to the app,
    capabilities that are not generally available to web apps but are available in
    mobile apps.


    For install conditions, a browser installs a service worker if


    +   - The browser supports service workers.

    - The browser loaded the web app using a TLS (HTTPS) connection or from the system''s
    localhost (referring to the local device running the browser).

    - The web app adds the service worker code within the same context (from the server
    location) as the web app for it''s associated.


    Unlike web app manifest files, most modern browsers support service workers; you
    can check the current support matrix on Can I Use.2 As I write this, the following
    browsers support service workers: Chrome (Google), Edge (Microsoft), Firefox (Mozilla),
    Opera (Opera), and Safari (Apple).


    2. https://caniuse.com/#feat=serviceworkers'
