  md: '# Passing Data between Service Workers and Web Applications


    Service workers and web apps have a symbiotic relationship on modern browsers
    that support service workers; the two work closely together to deliver an improved
    experience for users. So far, the only interactions I showed between web apps
    and service workers are situations in which the service worker helps the web app,
    such as managing resource fetching and processing push notifications they arrive.
    In this chapter I show how to pass data between a service worker and a web app
    running in a browser (desktop or mobile). This data communication goes both ways:
    from a service worker to the web app, from a web app to the service worker, or
    even from the service worker to all other tabs running the web app (I show examples
    of each in this chapter).


    As I''ve described throughout this book, the service worker isn''t running all
    the time: the browser awakens it when there''s work for the service worker to
    do. Therefore, you cannot implement a full data synchronization solution in a
    web app using a service worker, as described in Chapter 5, "Going to the Rest
    of the Way Offline with Background Sync." We can, however, use event-triggered
    actions in a service worker or allow split processing between the service worker
    and the app. A web app, for example,


    +   - Pass data calculation activities to the service worker to complete.

    - Let the service worker know when data changed so it can let other instances
    running in other tabs know they need to refresh page content.

    - Share application state, such as logged-in user or shopping cart data, across
    browser tabs through the service worker.


    Web developers can already use the window.postMessage method to send messages
    between window objects (between a window and a pop-up it created or between different
    page components like the page and an iframe embedded in the page). In this chapter,
    we cover the serviceWorker.postMessage method that enables similar communication
    between a service worker and the web app. We also cover how the MessageChannel
    object creates a two-way communication channel that apps can use to streamline
    communication between a service worker and the web app it serves.'
