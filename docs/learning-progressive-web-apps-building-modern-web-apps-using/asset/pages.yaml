  md: '# Service Worker Scope


    Remember when I said that one of the requirements for PWAs was that the browser
    accesses the app using a TLS (HTTPS) or localhost connection? This layer of security
    helps protects apps from rogue agents leading a service worker from another location.


    Another layer of security, the location of the service worker file matters. When
    an app registers a service worker, by default the service worker can work only
    with resources hosted in the same folder location and below; anything higher up
    in the folder structure is ignored.


    If you remember the code that registers the app''s service worker (Listing 3.2),
    when registration completes successfully, the code executes the following line:


    ```

    console.log(`Service Worker Registration (Scope: ${reg.scope})`);

    ```


    This lets the developer know that service worker registered correctly, and it
    outputs the contents of the reg''s scope property:


    Service Worker Registration (Scope: http://localhost:3000/)


    This defines the content and scope of the service worker operational domain, the
    part of the web app over which the service worker has providence. In this example,
    the service worker scope begins at localhost and covers anything under that host.


    If you app content and code in subfolders, for example, app1 and app2, and you
    want to register a separate service worker for each, you can easily do that. One
    option is to place the appropriate service worker in each folder; they automatically
    inherit scope from the folder where the service worker is hosted when you register
    the service worker.


    Another option is to set the scope for the service worker during registration;
    as an example, look at the following code:


    ```

    navigator.serviceWorker.register(''/sw1.js'', {scope: ''/app1/''});

    ```


    This example registers the sw1.js service worker and sets the scope for the service
    worker to the app1 folder. With this place, the service worker will fetch requests
    only for resources located in the app1 folder and below (subfolders).


    # The Service Worker Lifecycle


    Each service worker cycles through multiple states from the moment the browser
    calls navigator.serviceworker.register until it''s discarded or replaced by the
    browser. The states defined in the service worker specification are


    +   - Installing

    - Waiting

    - Active'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# The Service Worker Lifecycle 61


    When an app registers a service worker, the browser


    +   - Locates the service worker (requests it from a server)

    - Downloads the service worker

    - Parses and executes the service worker


    If the browser can''t download or execute the service worker, it discards the
    service worker (if it has it) and informs the code that called navigator.serviceworker.register.
    In Listing 3.3, that means that the catch clause executes and whatever code there
    executes.


    If the browser successfully downloads the service worker, it executes the service
    worker, and that''s how the service worker registers the install and activate
    event listeners in the service worker code.


    At this point, the install event listener fires; where a service worker creates
    its local cache and performs any additional setup steps. A representation of the
    service worker (version 1) by the Installing state is shown in Figure 3.9.


    ![](img/d7d0133096e7f06b146f5a2a86773984_77_0.png)


    Figure 3.9 Service Worker 1 Installing


    If a service worker isn''t currently registered, the service worker transitions
    to the Active state, and it''s ready to fetch requests the next time the app reloads,
    as shown in Figure 3.10.


    ![](img/d7d0133096e7f06b146f5a2a86773984_77_1.png)


    Figure 3.10 Service Worker 1 Active


    If the app attempts to install a new version of the service worker (version 2,
    for example), then the process starts all again for the new service worker. The
    browser downloads and executes service worker v2, the v2 install event fires,
    and it completes its initial setup.


    At this point, the app is still active and has an active service worker (v1) in
    play. Remember, the current service worker remains active until you close the
    browser (or at least all tabs running the web app) or the browser is configured
    to force reloading the service worker. With an existing service worker active,
    service worker v2 goes into a waiting state, as shown in Figure 3.11.'
