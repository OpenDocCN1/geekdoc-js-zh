  md: '![](img/d7d0133096e7f06b146f5a2a86773984_160_0.png)


    # Notification Options


    As I explained in the previous section, what you saw in Figure 6.10 was just a
    simple notification using a title string passed to the Notification object''s
    constructor or, in the second example, to the registration.showNotification method.
    The browser is capable of much more.


    Note


    Since using the Notification object is restricted to desktop browsers (today,
    anyway), I''m going to ignore that form of notification going forward. The good
    news is that everything I show in the rest of the chapter applies to that type
    of notification, so if you want to use them in your apps, you can apply the details
    from this section to it as well.


    To take advantage of additional notification options, you must pass an options
    object to the call registration.showNotification, as shown in the following example:


    ```

    registration.showNotification(title, options);

