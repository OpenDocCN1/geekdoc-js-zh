  md: '# Chapter 4 Resource Caching


    The complete service worker code for this example is in the project folder''s
    `public\service-workers\sw-47.js`.


    All right, for every resource request, this service worker does the:


    +   - Tries to retrieve the resource from the network.

    - If it gets a response,

    - Checks to see if the response is a valid response and not an error.

    - Clones the response (responses are streams, so the service worker can''t pass
    a response to the browser and write it to the cache at the same time).

    - Writes the cloned response to the cache.

    - Returns the original response to the requester.

    - If the response is not an HTTP response of 200 (success), it returns whatever
    it has to the requester for the requester to process the error.


    +   - Checks the cache to see if it has the resource there.

    - If it does, it returns the cached resource.

    - Otherwise, it does nothing and lets the requester decide with the problem (usually
    showing the page shown in Figure 4.8).


    As it processes all of app''s requests, the requests return with different response
    types depending on how the browser views the origin based on security settings
    in the browser and in the app. Remember, service workers are all about security,
    so if you request a resource that''s not from the same origin as the page requesting,
    the service worker''s going to complain. The way it complains is by not caching
    the resource.


    The service worker checks here if the response is valid using the following code:


    ```

    if (response.status == 200)

    ```


    Some examples you see online do this way:


    ```

    if (response.status == 200 && response.type == ''basic'')

    ```


    What I learned while testing this code is that the service worker will cache only
    resources with a type of basic. There''s no need to check the type before caching.
    All the same origin requests arrive as basic, but the image requests, because
    their origin is Bing and not the local API server, are ignored and not added to
    the cache. To prove this, look at Figure 4.12; it shows the complete resource
    cache generated by this `fetch` event listener.


    https://developer.mozilla.org/en-US/docs/Web/API/Response/type'
