  md: '# # Foreword


    I remember how I first became acquainted with John Wargo. I was speaking at a
    PhoneGap Day conference in Portland, Oregon, and I looked over to see Brian LeR
    speaking with someone I didn''t recognize. I leaned over and asked a friend, "Hey,
    who''s the guy in the suit?" to which the friend responded, "Oh, that''s John
    Wargo. He''s an analyst." The suit set him apart at this nerd gathering, as most
    of the attendees were t-shirts with funny slogans. This was before the time Mark
    Zuckerberg popularized the "coder wearing a hoodie" look.


    If I remember correctly, my t-shirt had a pig on it with a speech bubble that
    said, "Hmm ... bacon," and as I reflect back on that, it wasn''t even a suit John
    was wearing—It just a blazer. However, it''s not an exaggeration to say he was
    the best-dressed man at the conference, but I digress.


    "Oh boy!" I thought, "An analyst." You see, had just transitioned from the telecom
    industry to full-on software development. In telecom, analysts do not have the
    greatest of reputations. Then I talked to John. He proceeded to ask insightful
    questions about my work on PhoneGap and the Apache Cordova community.


    Folks, at this point, I''m resisting the urge to insert a dont book by its cover
    joke, and I''ve never been good at making a bad joke.


    John went on to become an important member and educator of the Apache Cordova
    community and to write not one, but four authoritative books on the subject, unlike
    the one you have in your hands now on Progressive Web Apps.


    One of the off-cited tenets of the PhoneGap/Cordova project was ultimately "cease
    to exist," but the other less-mentioned net was to "make the web a first-class
    development platform." Now that promise of being a first-class platform has been
    fulfilled by Progressive Web Apps. Being a major part of the Apache Cordova community
    for so many puts John in a great position, as has been there every step of the
    way to see the evolution of the mobile web.


    Should you happen into John at a conference or at a book-signing someday, come
    prepared with a recommendation on where to get a fresh, delicious doughnut. This
    is one of the traits we share common. The other being dry, sardonic.


    You have made an excellent decision in picking up this book. If I were just starting
    on my learning path to mastery of Progressive Web Apps, there are not many folks
    I would trust more than John to get me there. I only wish that you could hear
    John''s voice while you are reading this book like I did.


    > Simon MacDonald, Developer Advocate, Adobe

    November 2019'
