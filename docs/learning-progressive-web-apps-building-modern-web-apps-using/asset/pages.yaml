  md: '# Chapter 8 Assessment, Automation, and Deployment


    When you click the Options button, Chrome opens a dialog allowing you to set the
    scope for the audit performed by the extension, as shown in Figure 8.2. All we
    care about right now is the PWA report, so enable the Progressive Web App and
    disable all others, then click the OK button to return to Lighthouse. You can
    come back later and try out the options.


    ![](img/d7d0133096e7f06b146f5a2a86773984_200_0.png)


    Figure 8.2 Lighthouse Options


    Click the Generate Report button shown Chrome opens a new window hosting the selected
    app in a simulated mobile device and exercises the app in different conditions.
    I haven''t studied exactly what it tests, but you can tell that it''s loading
    the app with without network connectivity and recovering what happens in the app.
    When it completes its assessment, Chrome opens the page shown in Figure 8.3 listing
    the results of the audit.


    As you can see from the figure, the results are dismal. Remember though, this
    is the bare bones version of the Tip Calculator; it doesn''t have a manifest file
    or a service worker, so the results should not be a surprise. Knowing what you
    know by about service workers and manifest files, you should be able to see where
    these workers would bolster.


    I''m hosting the app on Netlify, and they automatically provide an SSL certificate,
    I get a few extra points here. For your locally hosted app, this result should
    be different, although in my testing, Lighthouse seemed to incorrectly think I
    was hosting over an HTTPS connection when I wasn''t. This is possibly an internal
    browser handler that enables the browser to run PWAs from localhost.


    It''s a little hard to see, but at the top of the page is the PWA logo I highlighted
    in Figure 1.1 so many pages ago. In the report in Figure 8.3, it''s greyed out
    and hard to see because the app is not a PWA, and that''s a simple way the extension
    highlights this fact.'
