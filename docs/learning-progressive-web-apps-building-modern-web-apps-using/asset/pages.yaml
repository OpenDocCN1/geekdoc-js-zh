  md: "# Dealing with Subscription Expiration\n\nOne topic we haven't covered yet\
    \ is what happens when the browser's subscription expires. The browser push services\
    \ won't hold onto these subscriptions forever, so they eventually whack them and\
    \ let the browser know. When this happens, the browser fires the pushsubscriptionchange\
    \ event to the service worker can react through an event listener:\n\n```\nself.addEventListener('pushsubscriptionchange',\
    \ event => {\nconsole.log('SW: Push Subscription Change event fired');\nconsole.dir(event);\n\
    event.waitUntil(\n  self.pushManager.subscribe(regOptions)\n    .then(subscription\
    \ => {\n      console.log('Browser re-subscribed');\n      console.log(subscription)\n\
    \      // now, send the subscription object to the server\n      // just like\
    \ we we did in index.js\n    })\n  .catch(error => {\n    console.error(error);\n\
    \  })\nn);\n```\n\nIn this example, the event listener simply re-subscribes the\
    \ browser for notifications. In a real-world application, you would probably want\
    \ to ask users if they want to subscribe again.\n\nYou can add this code to your\
    \ project's sw.js file if you want, but none of your subscriptions expire as you\
    \ work through this build.\n\nThe complete code for the project's sw.js file up\
    \ to this point in the chapter is in the project's chapter-06\\public\\chapter-code\\\
    sw-63.js.\n\n# Sending Notifications to Push Services\n\nThe thing I haven't shown\
