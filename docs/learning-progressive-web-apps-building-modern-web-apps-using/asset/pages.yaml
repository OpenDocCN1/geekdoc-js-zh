  md: '# Controlling Cache Strategies


    Next, at the bottom of the file, add the following code:

    workbox.routing.registerRoute(

    /.(?:png|svg|js|css|html)$/,

    ew workbox.strategies.StaleWhileRevalidate());


    This uses a regular expression to apply the StaleWhileRevalidate caching strategy
    to all .png, .svg, .js, .css, and .html files for the app. This is a simple but
    effective approach to caching app resources and should cover most web resource
    types.


    If you have other file types in your web app, you can add the resource''s file
    extension to the regular expression.


    When you load the app in the browser and look at the cache store, as shown in
    Figure 9.5, you''ll see all matching files are cached.


    ![](img/d7d0133096e7f06b146f5a2a86773984_237_0.png)


