  md: "# Chapter 5 Going the Rest of the Way Offline with Background Sync\n\nTo trigger\
    \ a sync, a web app registers a sync event using the following code:\n\n```\n\
    navigator.serviceWorker.then(reg) => {\n  reg.sync.register('doThatSyncThing');\n\
    });\n```\n\nThe call to navigator.serviceWorker.ready returns the current service\
    \ worker's registration object (in the example) that the code uses to register\
    \ the sync event.\n\nYou can also register a sync event inside of a service worker\
    \ using the following code:\n\n```\nself.registration.sync.register('doThatSyncThing');\n\
    ```\n\nPassed to the method is an tag identifying the sync event to the service\
    \ worker. You can use as many tags as you want in your app; all that matters is\
    \ that the service worker has code to recognize and process the events (through\
    \ their tags) as they come in.\n\nThe browser keeps track of all registered sync\
    \ events for the service worker and fires the service worker's sync event listener\
    \ repeatedly until the sync event resolves. How a browser manages sync events\
    \ varies depending on the browser, but in general it works like this:\n\n+   *\
    \ If the browser is offline, the sync event fires immediately, and the service\
    \ worker attempts to complete the action.\n\n+   * If the sync fails, the browser\
    \ waits before trying again. It should implement an exponential backoff strategy\
    \ whereby each subsequent retry occurs after a longer delay.\n\n+   * If the browser\
    \ status changes from offline to online, the browser tries again.\n\n+   * Eventually,\
    \ the browser gives up, it knows it's likely never going to complete the action—how\
    \ long that takes is up to the browser.\n\nInside the service worker, an event\
    \ listener listens for the sync event, executes the code associated with the event\
    \ tag passed with the sync event:\n\n```\nself.addEventListener('sync', event)\
    \ => {\n  if (event.tag == 'doThatSyncThing') {\n    // do something...\n  }\n\
    });\n```\n\nTags play an interesting role in this process. In general, an app\
    \ uses tags in a way that enables them to group actions together. For example,\
    \ a chat app may use something like the following:\n\n+   * AddContact\n\n+  \
    \ * DeleteMessage\n\n+   * SendMessage\n\n+   * SetStatus"
