  md: 'I''ve been doing a lot of work lately using the Ionic Framework. Ionic is a
    cross-platform UI and component framework for building mobile and desktop apps.
    Until a short time ago, Ionic apps were typically built using Angular, the Ionic
    team recently switched to web components and Stencil (their open web component
    compiler) and published a PWA Toolkit that delivers a PWA-first approach to web
    apps.


    Most PWAs are easier (much easier) to create than native mobile apps. This means
    apps costs easier to make and maintain. When you package a PWA in an Apache Cordova,
    Ionic Capacitor, GitHub Electron app, you address the needs of users who want
    a native version for mobile devices or desktop computers.


    The technology is so popular that firm Gartner predicts that by 2020, 50% of consumer
    mobile apps will be PWAs (I would give you an online reference for this, but statement
    is everywhere online). But you know that, right? You already purchased, borrowed,
    or stole this book to learn how to create PWAs.


    # PWAs and App Stores


    Developers build mobile apps for many reasons, but one of them is that they can
    distribute their apps through the mobile device platform''s app store. While you
    can install a PWA by opening a web app in the mobile browser (you''ll learn all
    about this in the next chapter), the mobile platform vendors trained users to
    look for apps in the app store. This means that users looking for your app are
    going to look for it in their phone''s app store first.


    Some interesting things are happening in this space. In early 2019, Google announced
    Trusted Web Activity (TWA) for Android. A TWA is essentially aless (no browser
    UI), full-screen Chrome browser inside an Android app. With it, you get a PWA
    packaged with a browser in a native app—fresh and ready for deployment through
    the Google Play Store.


    Microsoft took a different approach, announcing in mid-2018 that developers can
    publish PWAs to the Microsoft Store. If they don''t publish their app to the store,
    Microsoft will do it them anyway (if the PWA meets specific criteria). You''ll
    learn more about this in Chapter 8, “Assessment, Automation, and Deployment,”


    # Wrap-Up


    In this chapter, I gave you a quick introduction to Progressive Web Apps. You''ll
    find a lot more material online and authors who dig deeper into the marketing
    and engagement side of PWAs. Since this is really a book about service workers,
    I want to get to coding as quickly as possible.


    In the next chapter, I show you all about how to make your PWA installable using
    service workers and web manifest files. After, the remainder of the book is all
    about service workers and everything you can do with them.


