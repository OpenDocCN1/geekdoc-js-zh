  md: "# Chapter 6 Push Notifications\n\nLost Subscriptions\nOne of the things I noticed\
    \ as I tested the client app used as in this chapter was when\nI unregistered\
    \ the service worker to force loading an updated version, refreshed the\npage,\
    \ the Unsubscribe button disappeared and was replaced by the Subscribe button.\
    \ I didn't\nexpect that and thought there was a problem with the application logic\
    \ that hid/unhide\nbuttons.\n\nRemember, subscribing for browser notifications\
    \ requires service workers, so when\nunregistered the service worker, the browser\
    \ unsubscribed from the push service.\nUnexpected but cool, right?\n\nYou can\
    \ prove this by unregistering the service worker, then trying to send a notification\
    \ to the\nbrowser using Postman. You'll get a response from the server that looks\
    \ like:\n\n```\n{\n  \"msg\": \"push subscription has unsubscribed or expired.\\\
    \n\"\n}\n```\n\nNotice the content we're sending the server is a little different\
    \ than what you saw in previous\nexamples:\n\n```\n{\n  \"title\": \"I read PWA,\
