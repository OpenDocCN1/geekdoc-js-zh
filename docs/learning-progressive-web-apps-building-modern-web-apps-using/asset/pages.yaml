  md: '# Chapter 1 Introducing Progressive Web Apps


    (service worker caching), holds new or updated records for upload later when there''s
    a network connection (service worker caching coupled with background processing),
    and notifies users when new push messages arrive (service worker background processing).


    On systems that don''t support manifest files and/or service workers. The app
    works the same way it did before you added the manifest file or service worker
    to the app. When you access the app, the app content and data are requested in
    real time from one or more servers.


    # PWA Market Impact


    So, what impacts are PWAs in the market? Development organizations quickly adopted
    the technology because the progressive enhancement of the approach enables development
    teams to dramatically affect performance (for any user running a browser that
    supports it) for users with a few small, changes. When users run the app on a
    browser that doesn''t support PWA technologies, they won''t notice anything—the
    app simply continues to work as it always had.


    Web app performance, especially on mobile devices, suddenly seems better for some
    apps. That''s because many app developers implement manifest files and service
    workers, and these apps now actively manage their client-side behavior (using
    background processing and caching) to the user''s benefit.


    Users engage with PWA-enabled apps. That''s just because apps are snappier (load
    faster) and work even when the mobile device its running doesn''t have a network
    connection. The app might not have all its features offline, but it still works,
    and that is all it takes to make users happy.


    Modern web application frameworks and cross-platform development tools adopted
    PWAs in a big way. For example, React, a very popular JavaScript library for building
    user interfaces (UIs) (their words, not mine), preloads its default sample project
    with a service worker automatically. It disables by default, but all you must
    do to turn a React app into a PWA is change one line of code,


    +   Listing 1.1 Sample React app index.js


    ```

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import ''./index.css'';

    import App from ''./App'';

    import as serviceWorker from ''./serviceWorker'';


    ReactDOM.render(<App />, document.getElementById(''root''));


    // if you want your app to work offline and load faster, you

    // can change unregister() to register() below. Note this

    // with some pitfalls. Learn more about service workers:

    // https://bit.ly/CRA-PWA

    serviceWorker.unregister();

    ```'
