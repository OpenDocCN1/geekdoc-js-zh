  md: '# Chapter 3 Service Workers


    The browser fires the install event when it completes installation of the service
    worker. The event provides the app with an opportunity to do the setup work required
    by the service worker. At this point, the service worker is installed but not
    yet operational (it doesn''t do anything).


    The browser fires the activate event when the current service worker becomes the
    active worker for the app. A service worker works at the browser level, not the
    app level, so when the browser installs it, it does not become active until the
    app reloads in all browser tabs running the app. Once it activates, it stays active
    for any browser tabs running the app until the browser closes all tabs for the
    app or the browser restarts.


    The activate event provides service workers with an opportunity to perform tasks
    when the service worker becomes active worker. Usually, this means cleaning up
    any cache from a previous version of the app (or service worker). You''ll learn
    lot more about this in Chapter 4, "Resource Caching"; for now, let''s add this
    to your existing service worker and see what happens.


    Once you''ve installed the code, reload the page in browser, then open the developer
    console panel and look for the output in Figure 3.7. Chances, you won''t see it—that''s
    because the previous version of the service worker is still active. You should
    see the install event fire, but not the activate event.


    ![](img/d7d0133096e7f06b146f5a2a86773984_74_0.png)


    Figure 3.7 Chrome Browser Tools Console Pane with Installation Output'
