- img_proc: true
  md: '# Assessment, Automation, and Deployment


    Throughout this book, we focused on the core capabilities of the browser, and
    we handcrafted the manifest files and code that make a PWA a PWA. Now we''re past
    all that, it''s time to talk about available tools to help you build and deploy
    PWAs.


    In this chapter, I show tools from Google that developers use to validate the
    quality of a PWA, identifying where an app fulfils PWA requirements and what must
    be done to make the app a full-featured PWA. Next, I show some tools from Microsoft
    that developers can use to convert a web app into a PWA. The first tool shows
    how well you''ve done at delivering your PWA, and the second tool automates the
    stuff of what you need to do to create a PWA.


    # Assessing PWA Quality Using Lighthouse


    As I describe at the beginning of the book, there are different views of what
    makes a PWA. Google tells the story that PWAs are


    +   - Reliable

    - Fast

    - Engaging


    But I argued that there are specific capabilities that define a PWA:


    +   - PWAs are installable: mobile and desktop users can install them on their
    phone''s home screen or desktop using an installation UI provided in the app.

    - PWAs cache the app’s UI on the local device, so when the user opens the app,
    the UI loads quickly when the app goes out to get data from network.

    - PWAs run background tasks, enabling background processing and offline resource
    caching.

    - PWAs can receive push notifications from a backend server regardless of whether
    the app is running.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Chapter 8 Assessment, Automation, and Deployment


    To make it easier for developers to deliver PWAs that meet either criteria, Google
    created Lighthouse. Lighthouse is an open source tool that tests web apps against
    Google''s criteria for PWA; the good news is that Google''s criteria encompass
    mine. The tools test you, then delivers a report highlighting what must be fixed
    to create a complete PWA.


    There are three ways to run Lighthouse:


    +   - Google Chrome extension

    - Google Chrome DevTools

    - Node Module


    In the sections that follow, I show you how each approach works plus some sample
    reports from running Lighthouse against two different versions of the Tip Calculator
    app from Chapter 2, "Web App Manifest Files."


    # Preparing to Code


    In this chapter, we worked with a stripped-down version of the Tip Calculator
    app, which doesn''t require a lot of coding for our purposes.


    The app in Chapter 2 had a rudimentary service worker but no manifest file, so
    we built out the manifest and associated code to make the app installable. In
    this chapter, there''s no manifest file or service worker; it''s just a bare bones
    app. You can find the app in the cloned project''s \learning-pwa-code\chapter-08-tipcalculator
    folder.


    Assuming you''ve worked along all the code in the book so far and have all the
    prerequisites installed, you''re good to go. If not, please hop over to the Preparing
    to Code section of Chapter 2 and complete the steps outlined therein before picking
    back up there.


    To use this chapter''s version of the app, open a terminal or command prompt,
    navigate to the project folder, and execute the following command:


    ```

    http-server

    ```


    You should be able to open a web browser, navigate to http://localhost:8080/index.html,
    and see the Tip Calculator we''re familiar with.


    We''re going to use the Chrome browser next, so if you don''t already have it
    installed, please open a browser, navigate to https://www.google.com/chrome/,
    and install the latest Chrome version.


    # Using the Lighthouse Plugin


    The easiest way to use Lighthouse is through the Lighthouse extension Google publishes.
    To install the extension,


    +   1. https://developers.google.com/web/tools/lighthouse/

    2. https://chrome.google.com/webstore/detail/lighthouse/blipmdkonkipinefehnmjmammfjpmpbjk'
