  md: "# Offline Data Sync 103\n\nThen, in the service worker, the app processes each\
    \ type of event using separate blocks of code. When the app registers a sync event,\
    \ and there's already a sync event queued with the same tag, the browser's SyncManager\
    \ doesn't add a new event to the queue with the duplicate tag; it sees there's\
    \ already an event registered with that tag and ignores the new one, assuming\
    \ the service worker code processing the event will deal with all queued data\
    \ for that particular event.\n\nEarlier I mentioned that the browser will eventually\
    \ give up processing a sync event after tried a bunch of times without success.\
    \ When this happens, it stops processing until another sync event fires with the\
    \ same tag. To protect itself from the impact of this thing, a web app could generate\
    \ a unique tag for each event, as shown here:\n\n```\nnavigator.serviceWorker.ready.then(reg\
    \ => {\n  reg.sync.register('doThatSyncThing');\n});\n```\n\nThen, when processing\
    \ events, the service worker processes all events that match the specific pattern,\
    \ as shown here:\n\n```\nself.addEventListener('sync', event => {\n  if (event.tag.startsWith('doThatSyncThing'))\
    \ {\n    // do something...\n  }\n});\n```\n\nLike everything else with service\
    \ workers, background sync makes heavy use of promises, so if you don't feel comfortable\
    \ with promises in the previous chapter, you should probably sharpen your promises\
    \ now before continuing.\n\n# Offline Data Sync\n\nService workers don't offer\
    \ capabilities for managing offline data in web apps. Service workers run in the\
    \ browser but don't run all the time, and this limitation prohibits their use\
    \ for real background data synchronization. The browser wakes the service worker\
    \ only when there's work for it to do, using the event interfaces shown in previous\
    \ chapters. Unfortunately, there is no option for data events or timer events\
    \ in service workers (today anyway; apparently, Google has periodic background\
    \ sync a feature, but it's not mainstream.\n\nIf your app requires data synchronization,\
    \ you should use one of the many sync development kits (SDKs) available in the\
    \ market, such as the ones from Amazon, Couchbase, and Firebase. Don't write your\
    \ own—it's been done many times already by people smarter than both of us.\n\n\
    +   1. https://www.chromestatus.com/feature/5689383275462656\n2. https://aws.amazon.com/appsync/\n\
    3. https://www.couchbase.com/\n4. https://firebase.google.com/"
