    ![ ](images/00001.jpeg)


    Using classes


    Classes are a fairly new addition to JavaScript. this allows us a lot more flexibility
    than the old function object.


    function Person(firstName, lastName) {


    this.firstName = firstName;


    this.lastName = lastName;


    }


    class Person2 {


    constructor(firstName, lastName) {


    this.firstName = firstName;


    this.lastName = lastName;


    }


    sayName()


    {


