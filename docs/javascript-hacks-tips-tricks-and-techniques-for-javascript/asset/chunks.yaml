    \ (var i = 0; i < numWords; i++) {\n    words[i] = words[i].charAt(0).toUpperCase()\
    \ + words[i].slice(1);\n  }\n  return words.join(\" \");\n}\n```\n\n### 字符串查找字符串\n\
    使用此函数判断一个字符串是否包含另一个字符串。\n\n```javascript\nfunction contains(haystack, needle)\
    \ {\n  return haystack.indexOf(needle) != -1;\n}\n```\n\n"
- fmt: "\n# Miscellaneous\n\n## Shortcut for console.log\n\nIf you use `console.log`\
    \ a lot you can shorten that function and save yourself from some typing by binding\
    \ the function to the `document`\n\n```javascript\nvar cl = console.log.bind(document);\n\
    \ncl('shorter to type');\n```\n\n**Output**\n`shorter to type`\n\n```javascript\n\
    cl(1 + 1);\n```\n\n**Output**\n`2`\n\n## console.table\n\nUse `table.log` to see\
    \ a visual representation of your objects in the console.\n\n```javascript\nvar\
    \ person={'name':'Hero','hp':100};\n\nconsole.table(person);\n```\n\n![ ](images/00001.jpeg)\n\
    \n---\n\n## Using classes\n\nClasses are a fairly new addition to JavaScript.\
    \ this allows us a lot more flexibility than the old function object.\n\n```javascript\n\
    function Person(firstName, lastName) {\n  this.firstName = firstName;\n  this.lastName\
    \ = lastName;\n}\n\nclass Person2 {\n  constructor(firstName, lastName) {\n  \
    \  this.firstName = firstName;\n    this.lastName = lastName;\n  }\n  sayName()\
    \ {\n    console.log(\"Hi \"+this.firstName);\n  }\n}\n\nvar player = new Person('Bob',\
    \ 'Smith');\nvar player2=new Person2('Bob','Smith');\nplayer2.sayName();\n```\n\
    \n---\n\n## Extending Classes\n\nBy using the `Extends` keyword we can take all\
    \ the properties and methods of one class and add on to them in our new class.\n\
    \n```javascript\nclass Person2 {\n  constructor(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n  }\n  sayName() {\n    console.log(\"\
    Hi \" + this.firstName);\n  }\n}\n\nclass Superman extends Person2 {\n  constructor(firstName,\
    \ lastName) {\n    super(firstName, lastName);\n  }\n  fly() {\n    console.log(\"\
    up up and away\");\n  }\n}\n\nvar player = new Superman('Clark', 'Kent');\nplayer.sayName();\n\
    player.fly();\n```\n\n---\n\n## Linked List\n\nA linked list is a series of objects\
    \ that have a reference to either the previous item the next item or both. using\
    \ a linked list can have a great advantage over looping through items. I use it\
    \ frequently when I'm making virtual worlds and it really speeds up the the program.\n\
    \n```javascript\nclass Person {\n  constructor(name) {\n    this.name = name;\n\
    \    this.nextPerson = null;\n  }\n  sayName() {\n    console.log(this.name);\n\
    \    if (this.nextPerson) {\n      this.nextPerson.sayName();\n    }\n  }\n}\n\
    \nvar names = ['Aubrey', 'Marlin', 'Brittanie', 'Summer', 'Araceli', 'Jolie',\
    \ 'Denyse'];\n\nvar firstPerson = null;\nvar previousPerson = null;\n\n//make\
    \ the list\nvar len = names.length;\nfor (var i = 0; i < len; i++) {\n  //make\
    \ a new person\n  var person = new Person(names[i]);\n  // set first person to\
    \ current if not already set\n  if (firstPerson == null) {\n    firstPerson =\
    \ person;\n  }\n  // if previousPerson exists then assign current person as next\n\
    \  if (previousPerson) {\n    previousPerson.nextPerson = person;\n  }\n  previousPerson\
    \ = person;\n}\n//call the first person sayName function\n//to start a chain reaction\n\
    firstPerson.sayName();\n```\n\n### Delete a linked list element\n\nTo remove elements\
    \ from a linked list we need to have a reference to both the next and previous\
    \ elements of the list. To remove an element we simply take the previous element\
    \ and set the next item to the next item of the item we're deleting. It makes\
    \ more sense in the code!\n\n```javascript\nclass Person {\n  constructor(name)\
    \ {\n    this.name = name;\n    this.nextPerson = null;\n    this.previousPerson\
    \ = null;\n  }\n  sayName() {\n    console.log(this.name);\n    if (this.nextPerson)\
    \ {\n      this.nextPerson.sayName();\n    }\n  }\n  removeByName(name) {\n  \
    \  if (this.name == name) {\n      this.previousPerson.nextPerson = this.nextPerson;\n\
    \    }\n    if (this.nextPerson) {\n      this.nextPerson.removeByName(name);\n\
    \    }\n  }\n}\n\nvar names = ['Aubrey', 'Marlin', 'Brittanie', 'Summer', 'Araceli',\
    \ 'Jolie', 'Denyse'];\n\nvar firstPerson = null;\nvar lastPerson = null;\n\nvar\
    \ len = names.length;\nfor (var i = 0; i < len; i++) {\n  //make a new person\n\
    \  var person = new Person(names[i]);\n  // set first person to current if not\
    \ already set\n  if (firstPerson == null) {\n    firstPerson = person;\n  }\n\
    \  // if lastPerson exists then assign current person as next\n  // asign lastPerson\
    \ to previousPerson of current person\n  if (lastPerson) {\n    lastPerson.nextPerson\
    \ = person;\n    person.previousPerson = lastPerson;\n  }\n  lastPerson = person;\n\
    }\nfirstPerson.removeByName('Summer');\nfirstPerson.sayName();\n```\n\n---\n\n\
    ## Collision detection\n\nThis is a function I use in a lot of my games to tell\
    \ if two objects are touching each other.\n\n```javascript\nfunction checkCollide(obj1,\
    \ obj2) {\n  var distX = Math.abs(obj1.x - obj2.x);\n  var distY = Math.abs(obj1.y\
    \ - obj2.y);\n  if (distX < obj1.width / 2) {\n    if (distY < obj1.height / 2)\
    \ {\n      return true;\n    }\n  }\n  return false;\n}\n\nvar obj1={x:100,y:100,width:200,height:50};\n\
    var obj2={x:150,y:120,width:200,height:50};\ncheckCollide(obj1,obj2);\n```\n\n\
    ---\n\n## Convert to Boolean\n\nUse double exclamation points (`!!`) to turn a\
    \ number into a Boolean. Please note this only works with zero for false. negative\
    \ numbers will still give a true value.\n\n```javascript\nfunction checkPlayerHealth(hitPoints)\
    \ {\n  var isAlive = !!hitPoints;\n  return isAlive;\n}\nconsole.log(checkPlayerHealth(100));\n\
    console.log(checkPlayerHealth(0));\n```\n\n---\n\n## Get URL of page\n\nIf you\
    \ need to know the name of the page that you are on use `window.location.href`\n\
    \n```javascript\nfunction getUrl() {\n  return window.location.href;\n}\nconsole.log(getUrl());\n\
    ```\n\n---\n\n## Local storage - Strings\n\nUse local storage to store strings\
    \ into the browser memory cache.\n\n```javascript\n//set the value\nlocalStorage.setItem('monsterName',\
    \ 'orc');\n//get the value\nvar name=localStorage.getItem('monsterName');\n```\n\
    \n---\n\n## Local storage - Objects\n\nTo store an object into local storage first\
    \ use `JSON.stringify` to turn it into a string.\n\n```javascript\nvar monsterObj\
    \ = { 'name':'orc','health':100,'defense':20 };\n// Put the object into storage\n\
    localStorage.setItem('monster', JSON.stringify(monsterObj));\n\n// Retrieve the\
    \ object from storage\nvar monsterObj = localStorage.getItem('monster');\nvar\
    \ monster=JSON.parse(monsterObj);\n```\n\n---\n\n## Swap variables\n\nUse anonymous\
    \ arrays to be able to quickly swap values.\n\n```javascript\nvar a = 'world';\n\
    var b = 'hello';\n[a, b] = [b, a]\nconsole.log(a) //hello\nconsole.log(b) //world\n\
    ```\n\nI hope you enjoyed this collection of JavaScript Snippets and please remember\
    \ if you have any questions or found any mistakes please contact me at [WilliamClarkson.net](https://www.williamclarkson.net/code)\n"
