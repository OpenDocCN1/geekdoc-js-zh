    \ any questions about the code or JavaScript in particular you can contact me\
    \ there and I'll be happy to do my best to help you.\n\nI love talking about code!\n\
    \nIf you are interested in using JavaScript for game design you might want to\
    \ check out some of my other books, or my website on game development [phasergames.com](https://www.phasergames.com).\n\
    \nI hope you enjoy this collection of JavaScript Snippets!\n\n# CHAPTER TWO arrays\n\
    \n## Array to list\n\nThis is a handy little function I've used in a couple of\
    \ my programs to be able to convert an array to an HTML list.\n\n```javascript\n\
    function arrayToList(array) {\n  var oString = \"<ol>\";\n  var len = array.length;\n\
    \  for (var i = 0; i < len; i++) {\n    var word = array[i];\n    oString += \"\
    <li>\" + word + \"</li>\";\n  }\n  oString += \"</ol>\";\n  return oString;\n\
    }\n\nwindow.onload = function() {\n  document.getElementById('output').innerHTML\
    \ = arrayToList(['red', 'blue', 'green']);\n}\n```\n\n## Cache the array length\n\
    \nStoring an array length in a variable means that the browser will not have to\
    \ calculate the length of the array every time the loop is executed. I've seen\
    \ good performance results on my own code over the years.\n\nSome research seems\
    \ to suggest that the browser makers realizing that the array had to be calculated\
    \ every time have now done workarounds to cache the array length for you, however,\
    \ I still like to do it. It is also a good practice because you never know how\
    \ old the browser that your user is using.\n\nnot cached\n```javascript\nfor (i\
    \ = 0; i < array.length; i++) {\n  //do stuff\n}\n```\n\ncached\n```javascript\n\
    var len = array.length;\nfor (var i = 0; i < len; i++) {\n  //do stuff\n}\n```\n\
    \n## Binary search\n\nThis is a trick I used way back in the 80s when computers\
    \ were a lot slower than they are today. It works only on arrays that are alphabetically\
    \ sorted but you could also modify this code where you have an array of objects\
    \ it's alphabetically sorted on a key.\n\nIt works like this: imagine that you\
    \ have a telephone book and you want to find a certain name. You don't start at\
    \ the letter A and work your way through until you find the name that you are\
    \ looking for. However, that's how we often do it in programming with just a for\
    \ Loop going through every name until we find the one that we want. With the phone\
    \ book, we open it to a random page and then turn forwards or backward depending\
    \ on where we landed. This code looks at the element in the middle or halfway\
    \ through the array. It did either discards the last half or the first half of\
    \ the array depending on if the name that is looking for is greater than or less\
    \ than the value of that middle element. It keeps discarding half of the array\
    \ until it finds the one that it wants\n\n```javascript\nfunction binSearch(array,\
    \ value) {\n  var first = 0,\n  last = array.length - 1,\n  middle = Math.floor((last\
    \ + first) / 2);\n  while (array[middle] != value && first < last) {\n    if (value\
    \ < array[middle]) {\n      last = middle - 1;\n    } else if (value > array[middle])\
    \ {\n      first = middle + 1;\n    }\n    middle = Math.floor((last + first)\
    \ / 2);\n  }\n  return (array[middle] != value) ? -1 : middle;\n}\n\nvar array\
    \ = ['Norberto', 'Fay', 'Leonia', 'Silvana', 'Julieann', 'Nubia', 'Verlene', 'Mittie',\
    \ 'Ophelia', 'Kali', 'Mertie', 'Alaine', 'Caryn', 'Joeann', 'Leonie', 'Carolina',\
    \ 'Kimber', 'Lacresha', 'Lianne', 'Tatiana'];\n//sort the array\narray.sort();\n\
    console.log(binSearch(array, 'Nubia'));\n//returns 5\n```\n\n## Clear array\n\n\
    A quick little trick to empty out an array that you want to keep using it simply\
    \ to set the length of the array to zero.\n\n```javascript\nvar array = [11, 22,\
    \ 33, 44, 55, 66];\n//\nconsole.log(array);\n//set length to zero\n//\narray.length=0;\n\
    //\nconsole.log(array);\n```\n\n## Truncate array\n\nJust as setting an array\
    \ length 0 will clear the array, you can also truncate the array by setting the\
    \ length to the number of elements you want to keep.\n\n```javascript\nvar array\
    \ = [11, 22, 33, 44, 55, 66];\n```\n(Note: The provided text ended here).\n"
