  trans: "\n\n![](img/cover.jpeg)\n\n## 目录\n\n- 第一章 引言\n- 第二章 数组\n- 第三章 条件判断\n- 第四章\
    \ 函数\n- 第五章 数字\n- 第六章 对象\n- 第七章 字符串\n- 第八章 杂项\n\n# 第一章 引言\n\n引言\n\n我编写代码已经 30\
    \ 多年了。我每天仍然能发现关于编程的新知识。这里是我多年来总结的一些 JavaScript 技巧、窍门和方法。\n\n你可以在我的网站下载代码示例：[WilliamClarkson.net](https://www.williamclarkson.net/code)，如果你对代码或特别是\
    \ JavaScript 有任何问题，可以在那里联系我，我会乐意尽力帮助你。\n\n我热爱讨论代码！\n\n如果你对使用 JavaScript 进行游戏设计感兴趣，你可能想看看我的其他书籍，或者访问我的游戏开发网站\
    \ [phasergames.com](https://www.phasergames.com)。\n\n希望你喜欢这系列 JavaScript 代码片段！\n\
    \n# 第二章 数组\n\n## 数组转列表\n\n这是一个实用的小函数，我在我的几个程序中使用它，它能将数组转换为 HTML 列表。\n\n```javascript\n\
    function arrayToList(array) {\n  var oString = \"<ol>\";\n  var len = array.length;\n\
    \  for (var i = 0; i < len; i++) {\n    var word = array[i];\n    oString += \"\
    <li>\" + word + \"</li>\";\n  }\n  oString += \"</ol>\";\n  return oString;\n\
    }\n\nwindow.onload = function() {\n  document.getElementById('output').innerHTML\
    \ = arrayToList(['red', 'blue', 'green']);\n}\n```\n\n## 缓存数组长度\n\n将数组长度存储在变量中意味着浏览器每次执行循环时不需要重新计算数组的长度。多年来，我在自己的代码中看到良好的性能结果。\n\
    \n一些研究似乎表明，浏览器厂商在意识到数组每次都需要计算后，现在已经采取了变通方法为你缓存数组长度，然而，我仍然喜欢这样做。这也是一个良好的习惯，因为你永远不知道用户使用的浏览器有多旧。\n\
    \n未缓存\n```javascript\nfor (i = 0; i < array.length; i++) {\n  //执行某些操作\n}\n```\n\
    \n已缓存\n```javascript\nvar len = array.length;\nfor (var i = 0; i < len; i++) {\n\
    \  //执行某些操作\n}\n```\n\n## 二分查找\n\n这是我在 80 年代使用的一种技巧，那时的时的计算机比现在慢得多。它只适用于按字母顺序排序的数组，但你也可以修改这段代码，使其适用于根据某个键（key）按字母顺序排序的对象数组。\n\
    \n它的工作原理是这样的：想象你有一本电话簿，你想找某个名字。你不会从字母 A 开始一直找，直到找到你要找的那个。但在编程中，我们经常这样做，即只用一个 `for`\
    \ 循环遍历每一个名字，直到找到我们想要的那个。对于电话簿，我们随机打开一页，然后根据落脚的位置向前或向后翻页。这段代码查看数组中间或一半位置的元素。根据要查找的名字大于还是小于中间元素的值，它会丢弃数组的后半部分或部分。它不断丢弃数组的一半，直到找到想要的那个。\n\
    \n```javascript\nfunction binSearch(array, value) {\n  var first = 0,\n  last\
    \ = array.length - 1,\n  middle = Math.floor((last + first) / 2);\n  while (array[middle]\
    \ != value && first < last) {\n    if (value < array[middle]) {\n      last =\
    \ middle - 1;\n    } else if (value > array[middle]) {\n      first = middle +\
    \ 1;\n    }\n    middle = Math.floor((last + first) / 2);\n  }\n  return (array[middle]\
    \ != value) ? -1 : middle;\n}\n\nvar array = ['Norberto', 'Fay', 'Leonia', 'Silvana',\
    \ 'Julieann', 'Nubia', 'Verlene', 'Mittie', 'Ophelia', 'Kali', 'Mertie', 'Alaine',\
    \ 'Caryn', 'Joeann', 'Leonie', 'Carolina', 'Kimber', 'Lacresha', 'Lianne', 'Tatiana'];\n\
    //对数组排序\narray.sort();\nconsole.log(binSearch(array, 'Nubia'));\n//返回 5\n```\n\
    \n## 清空数组\n\n清空你想要继续使用的数组的一个快速小技巧就是简单将数组的长度设置为零。\n\n```javascript\nvar array =\
    \ [11, 22, 33, 44, 55, 66];\n//\nconsole.log(array);\n//将长度设置为零\n//\narray.length=0;\n\
    //\nconsole.log(array);\n```\n\n## 截断数组\n\n就像将数组长度设置为 0 会清空数组一样，你也可以通过将长度设置为想要保留的元素数量来截断数组。\n\
    \n```javascript\nvar array = [11, 22, 33, 44, 55, 66];\n```\n\n"
- fmt: "\n```javascript\nvar age = 19;\n\nvar canDrink;\n\nif (age > 20) {\n  canDrink\
    \ = true;\n} else {\n  canDrink = false;\n}\n```\n\n### new way\n```javascript\n\
    var age = 19\ncanDrink = (age > 20) ? true : false;\nConsole.log(canDrink);\n\
    ```\n\nThe formula for this is:\n`variable = (condition) ? meetsCondition : doesNotMeetCondition`\n\
    \n### Ternary operator with methods\nYou can also use ternary operators to call\
    \ a method.\n\n### old way\n```javascript\nif (success) {\n  avatar.start();\n\
    } else {\n  avatar.stop();\n}\n```\n\n### new way\n```javascript\nsuccess ? avatar.start()\
    \ : avatar.stop();\n```\n\n### Switch vs If\nUsing a `switch` statement instead\
    \ of a series of `if-then` statements will make your code more readable and in\
    \ some cases speed up the execution.\n\n### old way\n```javascript\nif (color\
    \ == \"red\") {\n  //do stuff\n}\nif (color == \"blue\") {\n  //do stuff\n}\n\
    if (color == \"green\") {\n  //do stuff\n}\nif (color == \"brown\") {\n  //do\
    \ stuff\n}\nif (color == \"yellow\") {\n  //do stuff\n}\n```\n\n### new way\n\
    ```javascript\nswitch (color) {\n  case \"red\":\n    //do stuff\n    break;\n\
    \  case \"blue\":\n    //do stuff\n    break;\n  case \"green\":\n    //do stuff\n\
    \    break;\n  case \"brown\":\n    //do stuff\n    break;\n  case \"yellow\"\
    :\n    //do stuff\n    break;\n}\n```\n\n# CHAPTER FOUR\n## functions\n\n### Assumed\
    \ Arguments\nIf you want to be able to send an unfixed amount of arguments to\
    \ a function, you can just leave the argument section blank and then use the `arguments`\
    \ keyword to access any parameters past. It's worth noting that although the `arguments`\
    \ act as an array it is not an actual JavaScript array.\n\n```javascript\nfunction\
    \ sum1(a, b) {\n  return a + b;\n}\n\nfunction sum2() {\n  return arguments[0]\
    \ + arguments[1];\n}\n\nfunction sum3() {\n  var sum = 0;\n  for (var i = 0, len\
    \ = arguments.length; i < len; ++i) {\n    sum += arguments[i];\n  }\n}\n\nsum1(1,\
    \ 2);\nsum2(1, 2);\nsum3(1, 2, 3, 4, 5, 6, 7, 8, 9);\n```\n\n### Object vs Parameters\n\
    Many times when I am writing classes there are times when I will wind up with\
    \ 10 to 15 parameters being passed to the constructor. Some of the parameters\
    \ are optional so when I want to add a required parameter later I have to go back\
    \ and change a lot of code. I have found in some cases passing a single object\
    \ as a sole parameter saves a lot of time.\n\n```javascript\nfunction doAttack(weapon,\
    \ damage, monster, useMagic = false) {\n  console.log('you use the ' + weapon\
    \ + ' on the ' + monster);\n}\n\nfunction doAttack2(obj) {\n  console.log('you\
    \ use the ' + obj.weapon + ' on the ' + obj.monster);\n}\n\ndoAttack('sword',\
    \ 10, orc);\n\nvar attackObj = {\n  'weapon': 'sword',\n  'damage': 10,\n  'monster':\
    \ 'orc'\n};\n\nattackObj.extraStuff = 'whatever';\nattackObj.speed = 10;\ndoAttack2(attackObj);\n\
    ```\n\n### Defaults\nUse the double pipe (`||`) `or` keyword to set defaults to\
    \ a variable. The defaults will be set if no value is passed for that variable.\n\
    \n```javascript\nfunction User(name, age) {\n  this.name = name || \"Oliver Stirling\"\
    ;\n  this.age = age || 63;\n}\n```\n\n### Short Hand Functions\nYou can use double\
    \ arrow notation to create a function.\n\n```javascript\nfunction calcCircumference(diameter)\
    \ {\n  return Math.PI * diameter\n}\n\ncalcCircumference = diameter => (Math.PI\
    \ * diameter;)\n```\n\n# CHAPTER FIVE\n## numbers\n\n### Even or Odd?\nIf you\
    \ divide a number by 2 and there is no remainder it is an even number else it\
    \ is odd.\n\n```javascript\nfunction isEven(num) {\n  return num/2 == Math.floor(num/2);\n\
    }\n```\n\n### Is divisible by?\nUse this function to tell if a number is divisible\
