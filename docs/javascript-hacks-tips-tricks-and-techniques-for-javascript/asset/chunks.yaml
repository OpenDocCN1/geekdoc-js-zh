    }


    fly() {


    console.log("up up and away");


    }


    }


    var player = new Superman(''Clark'', ''Kent'');


    player.sayName();


    player.fly();


    Linked List


    A linked list is a series of objects that have a reference to either the previous
    item the next item or both. using a linked list can have a great advantage over
    looping through items. I use it frequently when I''m making virtual worlds and
    it really speeds up the the program.


    class Person {


    constructor(name) {


    this.name = name;


    this.nextPerson = null;


    }


    sayName() {


    console.log(this.name);


    if (this.nextPerson) {


    this.nextPerson.sayName();


    }


    }


    }


    var names = [''Aubrey'', ''Marlin'', ''Brittanie'', ''Summer'', ''Araceli'', ''Jolie'',
    ''Denyse''];


    //


    //


    var firstPerson = null;


    var previousPerson = null;


    //


    //make the list


    var len = names.length;


    for (var i = 0; i < len; i++) {


    //make a new person


    var person = new Person(names[i]);


    //set first person to current if not already set


    if (firstPerson == null) {


    firstPerson = person;


    }


    //if previousPerson exists then assign current person as next


    if (previousPerson) {


    previousPerson.nextPerson = person;


    }


    previousPerson = person;


    }


    //call the first person sayName function


    //to start a chain reaction


    firstPerson.sayName();


    Delete a linked list element


    To remove elements from a linked list we need to have a reference to both the
    next and previous elements of the list. To remove an element we simply take the
    previous element and set the next item to the next item of the item we''re deleting.
    It makes more sense in the code!


    class Person {


    constructor(name) {


    this.name = name;


    this.nextPerson = null;


    this.previousPerson = null;


    }


    sayName() {


    console.log(this.name);


    if (this.nextPerson) {


    this.nextPerson.sayName();


    }


    }


    removeByName(name) {


    if (this.name == name) {


    this.previousPerson.nextPerson = this.nextPerson;


    }


    if (this.nextPerson) {


    this.nextPerson.removeByName(name);


    }


    }


    }


    var names = [''Aubrey'', ''Marlin'', ''Brittanie'', ''Summer'', ''Araceli'', ''Jolie'',
    ''Denyse''];


    //


    //


    var firstPerson = null;


    var lastPerson = null;


    //


    //


    var len = names.length;


    for (var i = 0; i < len; i++) {


    //make a new person


    var person = new Person(names[i]);


    //set first person to current if not already set


    if (firstPerson == null) {


    firstPerson = person;


    }


    //if lastPerson exists then assign current person as next


    //asign lastPerson to previousPerson of current person


    if (lastPerson) {


    lastPerson.nextPerson = person;


    person.previousPerson = lastPerson;


    }


    lastPerson = person;


    }


    firstPerson.removeByName(''Summer'');


    firstPerson.sayName();


