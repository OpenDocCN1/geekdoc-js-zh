  \ `removeAt` 方法。这非常简单，而且如果我们需要修改 `removeAt` 方法中的代码，这样做会更容易——因为两个方法都会随之更改（这就是复用代码的用处）。这样，我们就不需要维护两个从列表中删除项的方法——我们只需要一个！此外，边界限制将由\
  \ `removeAt` 方法进行检查。\n\n### isEmpty, size 和 getHead 方法\n\n`isEmpty` 和 `size` 方法与我们在上一章中为类实现的方法相同。但无论如何，让我们来看它们：\n\
