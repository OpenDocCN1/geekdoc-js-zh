  \ 大于 `length/2`，从末尾开始迭代比从开头开始更好（这样做的话，我们需要遍历列表的元素会更少）。\n\n## 从任意位置删除元素\n\n从双向链表中删除元素与单链表非常相似。唯一的区别是我们还需要设置前一个指针（previous\
  \ pointer）。让我们来看一下实现代码：\n\n```\nthis.removeAt = function(position){ \n\n  // 查找越界值\
  \ \n  if (position > -1 && position < length){ \n\n    let current = head, \n  \
  \  previous, \n    index = 0; \n\n    // 移除第一个项 \n    if (position === 0){ \n\n\
