  \n* 电子书搜索下载\n* 电子书打包资源分享\n* 学习资源分享\n\n# Summary\n\n在本章中，我们涵盖了图的基础概念。你学习了表示这种数据结构的不同方法，并且我们实现了一种使用邻接列表表示图的算法。你还学习了如何使用\
  \ BFS 和 DFS 方法遍历图。本章还涵盖了 BFS 和 DFS 的两个应用，即使用 BFS 寻找最短路径以及使用 DFS 进行拓扑排序。\n\n本章还包含了著名的算法，如计算最短路径的\
  \ Dijkstra 算法和 Floyd-Warshall 算法。我们涵盖了计算图最小生成树的 Prim 算法和 Kruskal 算法。\n\n在下一章中，你将学习计算机科学常用的排序算法。\n\
  \n# 第 10 章 排序与搜索算法\n\n假设我们有一个电话簿（或笔记本）没有。\n\n## 排序算法\n\n当人们第一次学习排序算法时，通常先学习冒泡排序，因为它是所有排序算法中最简单的。然而，从运行时间来说，它是最差的排序算法之一，你将会看到为什么。\n\
  \n冒泡排序比较两个相邻元素，如果第一个比第二个大，则交换它们。它之所以有这个名字，是因为元素往往会移动到正确的顺序，就像气泡浮水面一样。\n\n让我们如下实现冒泡排序算法：\n\
  \n```\nthis.bubbleSort = function(){ \n  var length = array.length;           //{1}\
  \ \n  for (var i=0; i<length; i++){//{2} \n    for (var j=0; j<length-1; j++ ){//{3}\
  \ \n      if (array[j] > array[j+1]){//{4} \n        swap(array, j, j+1);     //{5}\
  \ \n      } \n    } \n  } \n}; \n```\n\n\n\n\n首先，我们声明一个名为 `length` 的变量，它将存储 `array`\
  \ 的大小（行 `{1}`）。这一步将帮助我们在行 `{2}` 和 `{3}` 中获取 `array` 的大小，这一步是可选的。然后，我们有一个外层循环（行 `{2}`），它将从数组的第一个位置迭代到最后一个位置，控制在数组中执行的次数（由于执行次数等于数组的大小，因此数组中的每个元素应该执行一次）。接着，我们有一个内层循环（行\
  \ `{3}`），它将从数组的第一个位置迭代到倒数第二个元素，这实际上会执行当前元素与下一个元素之间的比较（行 `{4}`）。如果元素的的顺序不正确（即当前元素比下一个元素大），我们就交换它们的位置（行\
  \ `{5}`），这意味着 `j+1` 位置的值将转移到 `j` 位置，反之亦然。\n\n现在，我们需要声明 `swap` 函数（一个私有函数，仅对 `ArrayList`\
  \ 类内部的代码可用）：\n\n```\nvar swap = function(array, index1, index2){ \n  var aux = array[index1];\
  \ \n  array[index1] = array[index2]; \n  array[index2] = aux; \n}; \n```\n\n为了进行交换，我们需要一个临时变量来存储其中一个元素的值。我们将此方法也用于其他排序方法，这就是为什么我们将这段交换代码声明为一个函数，以便于复用。\n\
  \n如果我们使用 `ES6` (`ECMAScript 2015`)，可以用以下代码替换前面的函数（它使用了你在第 1 章 `JavaScript 快速概览`\
  \ 中学过的增强对象属性）：\n\n```javascript\n[array[index1], array[index2]] = [array[index2],\
  \ array[index1]]; \n```\n\n下面的图展示了泡泡排序的操作过程：\n\n![Bubble sort](img/Image00094.jpg)\n\
  \n前图中每个不同部分代表外层循环（行 `{2}`）执行的一次遍历，两个相邻元素之间的每次比较由内层循环（行 `{3}`）完成。\n\n为了测试泡泡排序算法并获得与所示相同的结果，我们将使用以下代码：\n\
  \n```javascript\nfunction createNonSortedArray(size){ //{6} \n  var array = new\
  \ ArrayList(); \n  for (var i = size; i> 0; i--){ \n    array.insert(i); \n  } \n\
  \  return array; \n} \n\nvar array = createNonSortedArray(5); /{7} \nconsole.log(array.toString());\
  \       //{8} \n\narray.bubbleSort();                  //{9} \nconsole.log(array.toString());\
  \       //{10} \n```\n\n为了帮助我们测试在本章中学到的排序算法，我们将创建一个根据参数传递的大小自动创建无序数组的函数（行 `{6}`）。如果我们传递\
  \ `5` 作为参数，函数将为我们创建一个如下数组：`[5, 4, 3, 2, 1]`。然后，我们要做的只是调用此函数并将其返回值存储在一个包含已初始化数字的\
  \ `ArrayList` 类实例的变量中（行 `{7}`）。为了确保我们有一个无序数组，我们会在 `console` 上输出数组的内容（行 `{8}`），调用泡泡排序方法（行\
  \ `{9}`），再次在 `console` 上输出数组内容，以便验证数组已排序（行 `{10}`）。\n\n### Note\n\n你可以在从支持页面（或 GitHub\
  \ 仓库）下载的源代码找到 `ArrayList` 类的源代码以及测试代码（带有额外的注释）。\n\n请注意，当算法执行外层循环的第二次遍历（前图的第二个部分）时，数字\
  \ `4` 和 `5` 已经排序好了。尽管如此，在随后的比较中，即使不需要比较，我们仍然继续比较它们。由于这个原因，我们将对泡泡排序算法进行改进。\n\n###\
  \ 改进后的泡泡排序\n\n如果我们从内层循环中减去遍历次数，就可以避免内层循环进行的所有不必要的比较（行 `{1}`）：\n\n```javascript\n\
  this.modifiedBubbleSort = function(){ \n  var length = array.length; \n  for (var\
  \ i=0; i<length; i++){ \n    for (var j=0; j<length-1-i; j++ ){//{1} \n      if\
  \ (array[j] > array[j+1]){ \n        swap(j, j+1); \n      } \n    } \n  } \n};\
  \ \n```\n\n下面的图说明了改进后的泡泡排序是如何工作的：\n\n![Improved bubble sort](img/Image00095.jpg)\n\
  \n### Note\n\n请注意，我们没有比较那些已经就位的数字。尽管我们做出了这个微小的变化来稍微改进泡泡排序算法，但它并不是一种推荐的算法。它的复杂度为\
  \ `O(n² )`。\n\n我们将在第 12 章中详细讨论大 O 表示法。\n\n#### 选择排序\n\n选择排序是一种原地排序。选择排序的基本思想是找到最小值，将其放在第一个位置，然后找到第二个小值，将其放在第二个位置，依此类推。\n\
  \n以下是选择排序的源代码：\n\n```javascript\nthis.selectionSort = function(){ \n  var length\
  \ = array.length; ={1} \n  for (var i=0; i<length-1; i++){//{2} \n    indexMin =\
  \ i;                     //{3}\n    for (var j=i; j<length; j++){//{4} \n      if(array[indexMin]>array[j]){//{5}\
  \ \n        indexMin = j;                     //{6} \n      } \n    } \n    if (i\
  \ !== indexMin){//{7} \n      swap(i, indexMin); \n    } \n  } \n```\n\n首先，我们将声明一些将用到的变量（行\
  \ `{1}`）。然后，我们有一个外层循环（行 `{2}`），它将迭代数组并控制遍历次数（即第 $n$ 个值）。我们假设当前遍历的第一个值是最小值（行 `{3}`）。然后，从当前的\
  \ `i` 值开始到数组末尾（行 `{4}`），我们将比较 `j` 值是否小于当前最小值（行 `{5}`）；如果为真，我们将更新更新为新的最小值（行 `{6}`）。当我们跳出内层循环时（行\
  \ `{4}`），我们就得到了第 $n$ 个最小值。然后，如果最小值与原始最小值不同（行 `{7}`），我们就交换它们。\n\n为了测试选择排序算法，我们可以使用以下代码：\n\
  \n```javascript\narray = createNonSortedArray(5); \nconsole.log(array.toString());\
  \ \narray.selectionSort(); \nconsole.log(array.toString()); \n```\n\n下面的图展示了选择排序算法的操作过程，基于我们前面代码中的数组\
  \ `[5, 4, 3, 2, 1]`：\n\n![Selection sort](img/Image00096.jpg)\n\n数组底部的箭头表示当前正在考虑寻找最小值的的位置（内层循环：行\
  \ `{4}`），而前图的每个步骤代表外层循环（行 `{2}`）。\n\n选择排序也是复杂度为 `O(n² )` 的算法。与泡泡排序类似，它包含两个导致平方复杂度的嵌套循环。然而，选择排序的表现优于我们将学习的插入排序算法。\n\
  \n#### 插入排序\n\n插入排序算法逐元素构建最终的排序数组。它假设第一个元素已经是排序的。然后，与第二个元素进行比较：第二个元素应该留在原处，还是插入到第一个元素之前？因此，前两个元素将变为有序，将与第三个元素进行比较（即它应该插入到第一、第二还是第三位置？），依此类推。\n\
  \n以下代码代表插入排序算法：\n\n\n\n\n\n```\nthis.insertionSort = function(){ \n  var length\
  \ = array.length,            //{1} \n  j, temp; \n  for (var i=1; i<length; i++){\
  \         //{2} \n    j = i;                            //{3} \n    temp = array[i];\
  \                  //{4} \n    while (j>0 && array[j-1] > temp){ //{5} \n      array[j]\
  \ = array[j-1];        //{6} \n      j--; \n    } \n    array[j] = temp;       \
  \           //{7} \n  } \n}; \n```\n\n按照惯例，算法的第一行用于声明我们在源码中使用的变量（第 `{1}` 行）。然后，我们将遍历数组以找到第\
  \ `i^(th)` 个元素的正确位置（第 `{2}` 行）。注意，我们是从第二个位置（索引 1）开始的，而不是位置 0（因为我们认为第一个元素已经是有序的了）。接着，我们初始化一个值为\
  \ `i` 的辅助变量（第 `{3}` 行），并还将该值存储在一个临时值中（第 `{4}` 行），以便我们稍后将其插入到正确的位置。下一步是找到插入元素的正确位置。只要变量\
  \ `j` 大于 `0`（因为数组的第一个索引是 `0`，且没有负数索引）并且数组中的上一个值大于我们正在比较的值（第 `{5}` 行），我们就将上一个值移动到当前位置（第\
  \ `{6}` 行）并减小 `j` 的值。最后，我们将该值插入到它的正确位置。\n\n下面的图展示了插入排序的执行过程：\n\n![插入排序](img/Image00097.jpg)\n\
  \n例如，假设我们要尝试排序的数组是 `[3, 5, 1, 4, 2]`。这些值将按照插入排序算法执行的步骤进行处理，具体如下：\n\n1. 值 `3` 已经是排序的，因此我们将开始排序数组的第二个值，即值\
  \ `5`。由于 `3` 小于值 `5`，所以 `5` 留在原地（即数组的第二个位置）。值 `3` 和 `5` 已经排序有序。\n2. 下一个需要排序并插入到正确位置的值是\
  \ `1`（目前位于数组的第三位置）。值 `5` 大于 `1`，所以 `5` 被移动到第三位置。我们需要分析 `1` 是否应该插入到第二个位置——`1` 大于\
  \ `3` 吗？并不大，所以值 `3` 被移动到第二个位置。接下来，我们需要验证 `1` 是否插入数组的第一个位置。由于 `0` 是第一个位置且没有负数位置，`1`\
  \ 需要被插入到第一个位置。值 `1`、`3` 和 `5` 已经排序有序。\n3. 我们移动到下一个值：`4`。值 `4` 应该留在当前位置（索引 3），还是需要移动到较低的位置？值\
  \ `4` 小于 `5`，所以 `5` 将移动到索引 3。我们应该将 `4` 插入到索引 2 吗？值 `4` 大于 `3`，因此 `4` 被插入到数组的第 3\
  \ 位置。\n4. 下一个要插入的值是 `2`（数组的第 4 位置）。值 `5` 大于 `2`，所以 `5` 被移动到索引 4。值 `4` 大于 `2`，所以\
  \ `4` 也会被移动（位置 3）。值 `3` 也大于 `2`，且 `3` 也被移动。值 `1` 小于 `2`，所以 `2` 被插入到数组的第二个位置。因此，数组排序完成。\n\
  \n该算法在排序较小数组时，性能优于选择排序和冒泡排序算法。\n\n## 合并排序 (Merge Sort)\n\n归并排序算法是第一个可以在现实世界使用的排序算法。你在书中学过的前三个排序算法性能并不良好，但归并排序具有复杂度为\
  \ `O(n log n)` 的良好性能。\n\n### 注意\n\nJavaScript 的 `Array` 类定义了一个 `sort` 函数（`Array.prototype.sort`），可以使用\
  \ JavaScript 对数组进行排序（而无需自己实现算法）。ECMAScript 并没有规定必须使用哪种排序算法，因此每个浏览器都可以实现自己的算法。例如，Mozilla\
  \ Firefox 使用归并排序作为 `Array.prototype.sort` 的实现，而 Chrome 使用的是快速排序的变体（你接下来将要学的）。\n\n\
  归并排序是一种分治算法。其背后的思想是将原始数组分成更小的数组，直到每个小数组只包含一个位置，然后将这些较小的数组合并成更大的数组，直到最后我们得到一个有序的大数组。\n\
  \n由于采用了分治法，归并排序算法也是递归的，如下：\n\n```\nthis.mergeSort = function(){ \n  array = mergeSortRec(array);\
  \ \n}; \n```\n\n由于 `mergeSort` 调用了 `mergeSortRec(array)`，我们需要实现这个递归函数。为了实现这一点，我们首先找到数组的中间，然后将其分成两半，并递归地调用该函数：\n\
  \n```\nvar mergeSortRec = function(array){ \n  var length = array.length; \n  if(length\
  \ <= 1){ \n    return array; \n  }\n  var mid = Math.floor(length / 2); \n  var\
  \ left = array.slice(0, mid); \n  var right = array.slice(mid); \n  return merge(mergeSortRec(left),\
  \ mergeSortRec(right)); \n};\n```\n\n`merge` 函数接收两个有序数组并将它们合并为一个有序数组。我们执行以下代码：\n\
  \n```\nvar merge = function(left, right){ \n  var result = [], //7} \n  il = 0,\n\
  \  ir = 0;\n\n  while(il < left.length && ir < right.length) { //8} \n    if(left[il]\
  \ < right[ir]) { \n      result.push(left[il++]);  //{9} \n    } else{ \n      result.push(right[ir++]);\
  \ // {10} \n    } \n  }\n\n  while (il < left.length){    //{11} \n    result.push(left[il++]);\
  \ \n  }\n\n  while (ir < right.length){   //{12} \n    result.push(right[ir++]);\
  \ \n  } \n\n  return result; // {13} \n}; \n```\n\n\n\n\n接下来，我们将把 `left` 数组中剩余的所有项（行\
  \ `{11}`）添加到合并后的结果数组中，并对 `right` 数组中的剩余项执行相同的操作（行 `{12}`）。最后，我们将返回这个合并后的数组作为结果（行\
  \ `{13}`）。\n\n如果我们执行 `mergeSort` 函数，它的执行过程如下：\n\n![合并排序](img/Image00098.jpg)\n\n\
  请注意，算法首先会拆分原始数组，直到将其拆分为只有一个元素的较小数组，然后开始合并。在合并的过程中，它也会进行排序，直到原始数组完全重新组合并排序好为止。\n\n\
  #### 快速排序\n\n快速排序可能是最常用的排序算法。它的复杂度为 `O(n log n)`，并且通常性能通常优于其他的 `O(n log n)` 排序算法。与\
  \ `merge sort`（合并排序）类似，它也使用了分治法，通过将原始数组划分为更小的数组（但不像归并排序那样进行物理拆分）来完成排序。\n\n快速排序算法比你目前学过的其他算法稍微复杂一点。让我们按照以下步骤逐步学习：\n\
  \n1.  首先，我们需要从数组中选择一个项作为 `pivot`（基准值），它是数组中的中间元素。\n2.  我们将创建两个指针——左侧指针指向数组的第一个元素，右侧指针指向数组的最后一个元素。我们将移动左指针，直到找到一个大于\
  \ `pivot` 的元素；我们也会移动右指针，直到找到一个小于 `pivot` 的元素并交换它们。我们将重复这个过程，直到左侧指针超过右侧指针。这个过程有助于在\
  \ `pivot` 之前放置小于 `pivot` 的值，在 `pivot` 之后放置大于 `pivot` 的值。这被称为分区（partition）操作。\n3.\
  \  接下来，算法会对较小的数组重复上述两个步骤（即值较小的子数组，然后是值较大的子数组），直到数组完全排序完成。\n\n让我们通过以下代码开始快速排序的实现：\n\
  \n```\nthis.quickSort = function(){ \n  quick(array,  0, array.length - 1); \n};\
  \ \n```\n\n与 `merge sort` 类似，我们将开始声明主方法，该方法将调用递归函数，并传入我们要排序的数组以及索引 0 和它的最后位置（因为我们想要对整个数组排序，而不仅仅是它的子集），如下：\n\
  \n```\nvar quick = function(array, left, right){ \n\n  var index; /{1} \n\n  if\
  \ (array.length > 1) { /{2} \n\n    index = partition(array, left, right); /{3}\
  \ \n\n    if (left < index - 1) {           //{4} \n      quick(array, left, index\
  \ - 1);     //{5} \n    } \n\n    if (index < right) {                   //{6} \n\
  \      quick(array, index, right);        //{7} \n    } \n  } \n}; \n```\n\n首先，我们将有一个\
  \ `index` 变量（行 `{1}`），它将帮助我们分离大小值的子数组，以便我们可以再次递归地调用 `quick` 函数。我们将通过 `partition`\
  \ 函数的返回值获取 `index` 值（行 `{3}`）。\n\n如果数组的大小大于 1（因为只有一个元素的数组在行 `{2}` 已经是排序状态），我们将在给定的子数组上执行分区操作（第一次调用将传递整个数组）以获取\
  \ `index`（行 `{3}`）。如果存在元素较小的子数组（行 `{4}`），我们将对该子数组重复该过程（行 `{5}`）。我们对值较大的子数组执行相同的操作。如果存在任何值较大的子数组（行\
  \ `{6}`），我们将重复快速排序过程（行 `{7}`）。\n\n### 分区过程\n\n我们需要做的第一件事是选择 `pivot` 元素。有几种方法可以做到。最简单的方法是选择数组的第一个元素（最左侧的元素）。但研究表明，如果数组几乎有序，这不是一个好的选择，会导致算法出现最坏情况。另一种方法是选择数组的随机元素或中间元素。\n\
  \n```\nvar partition = function(array, left, right) { \n\n  var pivot = array[Math.floor((right\
  \ + left) / 2)], /{8} \n  i = left,                                      //{9} \n\
  \  j = right;                                     //{10} \n\n  while (i <= j) {\
  \                //{11} \n    while (array[i] < pivot) {  //{12} \n      i++; \n\
  \    } \n    while (array[j] > pivot) {  //{13} \n      j--; \n    } \n    if (i\
  \ <= j) { /{14} \n      swap(array, i, j); /{15} \n      i++; \n      j--; \n  \
  \  } \n  } \n  return i; /{16} \n}; \n```\n\n对于此实现，我们将选择中间元素作为 `pivot`（行 `{8}`）。我们还会初始化两个指针：`left`（在\
  \ `{9}` 处）指向数组的第一个元素，`right`（在 `{10}` 处）指向最后一个。当 `i <= j` 时（行 `{11}`），如果 `array[i]\
  \ < pivot`（行 `{12}`），我们 `i++`。如果 `array[j] > pivot`（行 `{13}`），我们 `j--`。如果 `i <=\
  \ j`（行 `{14}`），我们执行 `swap(array, i, j)`（行 `{15}`），然后 `i++` 和 `j--`。最后，我们返回 `i`（行\
  \ `{16}`）。\n\n\n\n\n\n![堆排序](img/Image00104.jpg)\n\n堆排序算法如下：\n\n```\nthis.heapSort\
  \ = function(){ \n  var heapSize = array.length; \n  buildHeap(array); //{1} \n\n\
  \  while (heapSize > 1) { \n    heapSize--; \n    swap(array, 0, heapSize);    //{2}\
  \ \n    heapify(array, heapSize, 0); //{3} \n  } \n}; \n```\n\n第一步是构建一个堆结构（行 `{1}`），使得\
  \ `array[parent(i)] ≥ array[i]`。\n\n然后，作为第二步，我们将第一个位置（数组中的较大值）与当前堆的最后一个位置进行交换（行\
  \ `{2}`）。这样，最大值将被放置在它的排序位置。\n\n步骤 `{2}` 可能会破坏堆属性。由于这个原因，我们需要运行一个名为 `heapify` 的函数，它将把数组重新转换为堆，这意味着它将获取当前堆的根节点（较小的值）并再次将其推送到树的底部。\n\
  \n`buildHeap` 函数如下：\n\n```\nvar buildHeap = function(array){ \n  var heapSize =\
  \ array.length; \n  for (var i = Math.floor(array.length / 2); i >= 0; i--) { \n\
  \    heapify(array, heapSize, i); \n  } \n}; \n```\n\n如果我们将上述函数应用于 `[3,5,1,6,4,7,2]`\
  \ 数组，在堆构建完成之前，将经历以下步骤：\n\n![堆排序](img/Image00105.jpg)\n\n最后，我们将得到一个类似于下面的的 `heapify`\
  \ 函数：\n\n```\nvar heapify = function(array, heapSize, i){ \n  var left = i * 2 +\
  \ 1, \n  right = i * 2 + 2, \n  largest = i; \n\n  if (left < heapSize && array[left]\
  \ > array[largest]) { \n    largest = left; \n  } \n\n  if (right < heapSize &&\
  \ array[right] > array[largest]) { \n    largest = right; \n  } \n\n  if (largest\
  \ !== i) { \n    swap(array, i, largest); \n    heapify(array, heapSize, largest);\
  \ \n  } \n}; \n```\n\n堆准备就绪后，我们可以开始堆排序算法。这些是应用于数组的步骤 `{2}` 和 `{3}`。\n\n![堆排序](img/Image00106.jpg)\n\
  \n## 计数排序、桶排序和基数排序（分布式排序）\n\n到目前为止，你已经学习了如何在不使用任何辅助数据结构的情况下对数组排序。还有另一种类型的排序算法称为分布排序，其中数据从原始数组分到多个中间结构（桶）中，然后将这些桶重新收集并放置在原始数组中。\n\
  \n最著名的分布排序算法是计数排序、桶排序和基数排序。这三种算法非常相似。\n\n### 注意事项\n\n我们不会在书中介绍这些算法。但是，你可以在本书的源码包中，或者在\
  \ Github 仓库 `https://github.com/loiane/javascript-datastructures-algorithms` 中找到这些算法和示例。\n\
  \n# 搜索算法\n\n现在，让我们来讨论一下搜索算法。看看我们在之前的章节中实现的算法，例如 `BinarySearchTree` 类的 `search` 方法（第\
  \ 8 章，*树*）或 `LinkedList` 类的 `indexOf` 方法（第 5 章，*链表*），这些都是搜索算法，而且当然，每一种都是根据其数据结构的行为实现的。所以我们已经熟悉了两种搜索算法；我们只是还不知道它们的“官方”名称！\n\
  \n#### 顺序搜索\n\n顺序搜索或线性搜索是最基础的搜索算法。它将数据结构中的每个元素与我们寻找的元素进行比较。它也是效率最低的一种。\n\n让我们看看它的实现：\n\
  \n```\nthis.sequentialSearch = function(item){ \n  for (var i=0; i<array.length;\
  \ i++){帚 1} \n    if (item === array[i]){         //{2} \n      return i;      \
  \             //{3} \n    } \n  } \n  return -1;  //{4} \n}; \n```\n\n顺序搜索遍历数组（行\
  \ `{1}`），并将每个项目与我们正在搜索的值进行比较（行 `{2}`）。如果我们找到了，我们可以返回某些内容来表示我们找到了它。我们可以返回项目本身、值 `true`\
  \ 或它的索引（行 `{3}`）。在前面的实现中，我们返回了项目的索引。如果我们没有找到该项目，可以返回 `-1`（行 `{4}`），表示该索引不存在；`false`\
  \ 和 `null` 是其他选项之一。\n\n假设我们有一个 `[5, 4,3,2,1]` 数组并且我们正在寻找 `3`，那么下面的内容显示了顺序搜索：\n\n\
  ![顺序搜索](img/Image007.jpg)\n\n## 二分查找\n\n二分查找的工作原理类似于猜数字游戏，有人说“我在想一个 1 到 100 之间的数字”。为了让该算法工作，数据结构需要是排序的。这些是算法遵循的步骤：\n\
  \n1. 选择中间的值。\n2. 如果我们要我们要的值，就完成了。\n3. 如果我们要找的值比选定的小，我们就向左移动（下方）。\n4. 如果我们要找的值比选定的大，我们就向右移动（上方）。\n\
  \n让我们看看它的实现：\n\n```\nthis.binarySearch = function(item){ \n  this.quickSort(); \
  \ //{1} \n\n  var low = 0;                 //{2}\n  high = array.length - 1;   \
  \  //{3} \n  mid, element;\n\n  while (low <= high){4} \n    mid = Math.floor((low\
  \ + high) / 2); //{5} \n    element = array[mid];               //{6} \n    if (element\
  \ < item) {               7} \n      low = mid + 1;                  //{8} \n  \
  \  } else if (element > item) {        9} \n      high = mid - 1;              \
  \   //{10} \n    } else {                             \n      return mid;      \
  \               //{11} \n    } \n  } \n  return -1;                         //{12}\
  \ \n}; \n```\n\n为了开始，我们需要的第一件事是对数组排序。可以使用我们在排序部分实现的任何算法。这里使用了快速排序（行 `{1}`）。在数组排序后，我们将设置\
  \ `low`（行 `{2}`）和 `high`（行 `{3}`）指针。\n\n当 `low` 小于 `high` 时（在这种情况下 `low` 大于 `high`，意味着该值不存在），所以我们将返回\
  \ `-1`（行 `{12}`），找到中间索引（行 `{5}`），从而得到了中间的值（行 `{6}`）。然后我们将开始比较选定的值是否小于我们要找的值（行 `{7}`），我们需要向下（行\
  \ `{8}`）移动并重新开始。如果选定的值大于我们要找的值（行 `{9}`），我们需要向上（行 `{10}`）移动并重新开始。否则这意味着该值与我们要找的值相等，因此我们返回它的索引（行\
  \ `{11}`）。\n\n给定图中的数组，让我们尝试搜索值 `2`。这些是算法执行的步骤：\n\n![二分查找](img/Image0108.jpg)\n\n\
  ### 注意事项\n\n我们在 第 8 章，*树* 中实现的 `BinarySearchTree` 类拥有 `search` 方法，它与二分查找完全相同，但应用于树数据结构。\n\
  \n\n\n\n\n# 第 11 章 算法模式\n\n到目前为止，我们很有趣地讨论了如何实现几种不同的数据结构，其中最常用排序和搜索算法。编程世界中的算法非常有趣。在本章中，你将更多地了解这个世界，如果你感兴趣深入探索这个世界，我们还会讨论后续步骤。\n\
  \n我们将涵盖递归，它在第 8 章、`树` 中被介绍过。我们还将涵盖`动态规划`和`贪心算法`，并将涵盖一些著名的问题。\n\n## 递归\n\n递归是一种解决问题的方法，它通过解决同一个问题的更小部分，直到解决原始较大的问题。它通常涉及调用函数本身。\n\
  \n如果一个方法或函数可以如下所示直接调用自己，则它是递归的：\n\n```\nfunction recursiveFunction(someParam){ \n\
  \  recursiveFunction(someParam); \n}; \n```\n\n如果一个函数可以如下所示间接调用自己，它也被称为递归函数：\n\n\
  ```\nfunction recursiveFunction1(someParam){ \n  recursiveFunction2(someParam);\
  \ \n};\n\nfunction recursiveFunction2(someParam){ \n  recursiveFunction1(someParam);\
  \ \n}; \n```\n\n假设我们必须执行 `recursiveFunction`。结果会是什么？在这种情况下，它将无限执行。因此，每个递归函数都必须有一个基准情况（base\
  \ case），即不再进行递归调用的条件（停止点），以防止无限递归。\n\n## JavaScript 对调用栈大小的限制\n\n当我们忘记添加基准情况来停止函数的递归调用时会发生什么？它不会无限执行；浏览器将抛出一个错误，称为栈溢出错误（stack\
  \ overflow error）。\n\n每个浏览器都有它们自己的限制，我们可以使用以下代码进行一些测试：\n\n```\nvar i = 0; \n\nfunction\
  \ recursiveFn () { \n  i++; \n  recursiveFn(); \n} \n\ntry { \n  recursiveFn();\
  \ \n} catch (ex) { \n  alert('i = ' + i + ' error: ' + ex); \n}\n```\n\n在 `Chrome\
  \ 版本 37` 中，函数执行了 20955 次，浏览器抛出错误 `RangeError: Maximum call stack size exceeded`。在\
  \ `Firefox 版本 27` 中，函数执行了 34329 次，浏览器抛出错误 `InternalError: too much recursion`。\n\
  \n### 注意\n\n取决于你的操作系统和浏览器，值可能会不同，但它们是接近的。ECMAScript 6 具有尾递归优化（tail call optimization）。如果函数调用是函数内的最后一个动作（如高亮行），它是通过“跳转”处理的，而不是“子程序调用”。这意味着代码在\
  \ ECMAScript 6 中可以无限执行。\n\n### 注意\n\n关于尾递归优化的更多信息，请访问 [`goo.gl/ZdTZzg`](http://goo.gl/ZdTZzg)。\n\
  \n#### 波那契序列\n\n让我们回到波那契序列问题，该问题已在第 10 章、`排序和搜索算法` 中被涵盖过。\n\n*   1 或 2 的波那契序列是 1\n\
  *   `n`（当 n>2 时）的波那契序列是 (`n-1`) + (`n-2`)\n\n所以，让我们如下开始实现波那契函数：\n\n```\nfunction\
  \ fibonacci(num){ \n  if (num === 1 || num === 2){\n    return 1;\n  }\n}\n```\n\
  \n我们知道基准情况：1 或 2 的波那契序列是 1。现在，完成它的实现：\n\n```\nfunction fibonacci(num){ \n  if (num\
  \ === 1 || num === 2){\n    return 1;\n  }\n  return fibonacci(num - 1) + fibonacci(num\
  \ - 2); \n}\n```\n\n我们也知道如果 `n` 大于 2，那么 (`n`) 是 (`n-1`) + (`n-2`)。现在我们已经实现了波那契函数。如果尝试寻找\
  \ 6 的波那契序列，将是如下的结果：\n\n![波那契序列](img/Image00109.jpg)\n\n我们也可以以非递归的方式实现波那契函数：\n\n\
  ```javascript\nfunction fib(num){ \n  var n1 = 1, \n  n2 = 1, \n  n = 1; \n  for\
  \ (var i = 3; i<=num; i++){ \n    n = n1 + n2; \n    n1 = n2; \n    n2 = n; \n \
  \ } \n  return n; \n}\n```\n\n为什么要使用递归？它更快吗？递归并不比普通版本更快；更慢。但是，注意递归易于理解，并且代码更少。\n\
  \n### 注意\n\n在 ECMAScript 6 中，由于尾优化，递归并不慢。然而，在其他语言中，递归通常更慢。\n\n所以我们通常使用递归是因为它更容易解决问题。\n\
  \n#### 动态规划\n\n`动态规划` (`DP`) 是一种通过将复杂问题分解为更小的子问题来优化技术。我们之前在第 9 章、`图` 中涵盖了一些动态规划技术。\n\
  \n### 注意\n\n注意动态规划方法与分治法（我们用于合并排序和快速排序）不同。分治法将问题分解为独立的子问题并组合解决方案，而动态规划将问题分解为相关的子问题。\n\
  \n另一个例子是我们在上一节中解决的波那契问题。我们将波那契问题分解成更小的问题，如图所示。\n\n在使用 DP 解决问题时，我们需要遵循三个重要步骤：\n\n\
  1. 定义子问题。\n2. 实现解决子问题的递归方程（在一步中，我们需要遵循上一节中讨论的递归步骤）。\n3. 识别并解决基准情况。\n\n有一些可以使用动态规划解决的著名问题：\n\
  \n*   **背包问题**：在这个问题中，给定一组物品，每个物品都有价值和体积，目标是从中选出最佳物品集合，使总价值最大化。问题的限制是总体积需要“背包”支持的体积或更少。\n\
  *   **最长子序列**：这包括找到一组序列中共同的最长子序列（通过从另一个序列中删除某些元素而不改变剩余元素顺序而得到的序列）。\n*   **矩阵链链乘法**：在这个问题中，给定一个矩阵序列，目标是找到乘以这些矩阵的最有效方法（操作尽可能少）。并不执行乘法；解决方案是找到每个矩阵中需要相乘的序列。\n\
  *   **找零问题**：这包括找到使用给定面额集合 `d1...dn` 为特定金额找零的有多少种不同的方法。\n*   **图中的所有顶点最短路径**：这包括为所有顶点对\
  \ (u,v) 寻找从顶点 u 到 v 的最短路径。你在第 9 章、`图` 中通过 `Floyd-Warshall` 算法学习过这个问题。\n\n我们将在后续主题中涵盖这些问题。\n\
  \n### 提示\n\n这些问题及其解决方案在谷歌、亚马逊、微软、Oracle 等大公司的编程面试中非常常见。\n\n## 最小硬币找零问题\n\n\n\n\n\
  最小硬币找零问题是硬币找零问题的一个变体。硬币找零问题包括使用一组给面值 `d1... dn` 凑出特定金额分钱有多少种方法。而最小硬币找零问题包括找到使用给定一组面值\
  \ `d1... dn` 凑出特定金额分钱所需的最小硬币数量。\n\n例如，美国有以下面值（硬币）：`d1 = 1`；`d2 = 5`；`d3 = 10` 以及\
  \ `d4 = 25`。\n\n如果我们需要为 36 分钱找零，可以使用 1 枚季度分币（25）、1 枚十分角币（10）和 1 枚分币（1）。\n\n我们如何将这个解决方案转换为算法？\n\
  \n最小硬币找零解决方案包含找到 `n` 的最小硬币数量。但为了实现这一点，我们首先需要找到每个 `x < n` 的解决方案。然后，我们可以根据较小值的解决方案构建出解决方案。\n\
  \n让我们来看算法：\n\n```javascript\nfunction MinCoinChange(coins){ \n  var coins = coins;\
  \ //{1} \n  var cache = {};    //{2} \n\n  this.makeChange = function(amount) {\
  \ \n    var me = this; \n    if (!amount) { //{3} \n      return []; \n    } \n\
  \    if (cache[amount]) {帚 4} \n      return cache[amount]; \n    } \n    var min\
  \ = [], newMin, newAmount; \n    for (var i=0; i<coins.length; i++){ //{5} \n  \
  \    var coin = coins[i]; \n      newAmount = amount - coin;  //{6} \n      if (newAmount\
  \ >= 0){ \n        newMin = me.makeChange(newAmount); //{7} \n      } \n      if\
  \ ( \n        newAmount >= 0 && //{8} \n        (newMin.length < min.length-1 ||\
  \ !min.length)//{9} \n        && (newMin.length || !newAmount) //{10})\n       \
  \ {\n          min = [coin].concat(newMin); //{11} \n          console.log('new\
  \ Min ' + min + ' for ' + amount); \n        } \n    } \n    return (cache[amount]\
  \ = min); //{12} \n  }; \n} \n```\n\n为了更有组织性，我们创建了一个类，在给定面值的情况下求解最小硬币找零问题。让我们逐步分析该算法。\n\
  \n我们的 `MinCoinChange` 类接收 `coins` 参数（行 `{1}`），它代表了我们问题的面值。对于美国硬币系统，它将是 `[1, 5, 10,\
  \ 25]`。我们可以传递任何喜欢的面值。此外，为了提高效率且不重复计算，我们将保留 `cache`（行 `{2}`）。\n\n然后，我们有 `makeChange`\
  \ 方法，它是递归的，也是为我们解决问题的方法。首先，如果 `amount` 不是正数（`< 0`），我们将返回一个空数组（行 `{3}`）；在该方法执行结束时，我们将返回一个包含用于找零的每种硬币数量的数组（最少硬币数量）。接下来，我们将检查\
  \ `cache`。如果结果已经缓存（行 `{4}`），我们将直接返回其值；否则，我们执行算法。\n\n为了进一步提供帮助，我们将根据 `coins` 参数（面值）解决问题。因此，对于每个硬币（行\
  \ `{5}`），我们将计算 `newAmount`（行 `{6}`），它将不断减少数值直到达到我们能提供的最小找零金额（记住此算法将计算 `x < amount`\
  \ 的所有 `makeChange` 结果）。如果 `newAmount` 是有效值（正值），我们将为它计算结果（行 `{7}`）。\n\n最后，我们将验证 `newAmount`\
  \ 是否有效、`minValue`（最小硬币数量）是否为最佳结果，以及 `minValue` 和 `newAmount` 是否为有效值（行 `{10}`）。如果所有验证通过，意味着我们得到了比之前更好的结果（行\
  \ `{11}`）。例如，对于 5 分钱，我们可以提供 5 枚分币或 1 枚镍角币，1 枚镍角币是最佳解决方案。最后，我们将返回最终结果（行 `{12}`）。\n\
  \n通过以下代码测试此算法：\n\n```javascript\nvar minCoinChange = new MinCoinChange([1, 5, 10,\
  \ 25]); \nconsole.log(minCoinChange.makeChange(36)); \n```\n\n注意，如果我们检查 `cache`\
  \ 变量，它将持有从 1 到 36 分的所有结果。前述代码的结果将是 `[1, 10, 25]`。\n\n在本书源码中，你将发现一些额外的代码将输出此算法的步骤。例如，如果我们使用面值\
  \ `1`、`3` 和 `4` 并对金额 6 执行算法，我们将产生以下输出：\n\n```\n new Min 1 for 1 \nnew Min 1 for\
  \ 2 \nnew Min 1 for 3 \nnew Min 1 for 4 \nnew Min 2 for 5 \nnew Min 2 for 6 \n```\n\
  \n#### 背包问题\n\n背包问题是一个组合优化问题。它可以被描述为：给定一组具有重量和价值的物品，在一个固定容量的容器中找到可以装下的最大价值。这里有一个例子：\n\
  \n| 项目 # | 重量 | 价值 |\n| :--- | :--- | :--- |\n| 1 | 2 | 3 |\n| 2 | 3 | 4 |\n| 3\
  \ | 4 | 5 |\n\n存在两种版本：0-1 版本（我们只能选取整个物品）以及分数版本（我们可以选取物品的部分，你稍后会学习）。让我们来看看背包算法，如下：\n\
  \n```javascript\nfunction knapSack(capacity, weights, values, n) { \n  var i, w,\
  \ a, b, kS = []; \n\n  for (i = 0; i <= n; i++) { //1}\n    kS[i] = []; \n  }\n\n\
  \  for (i = 1; i <= n; i++){ \n    for (w = 0; w <= capacity; w++){ \n      if (i\
  \ == 0 || w == 0){//2}\n        kS[i][w] = 0;\n      } else if (weights[i-1] <=\
  \ w){//3}\n        a = values[i-1] + kS[i-1][w-weights[i-1]]; \n        b = kS[i-1][w];\
  \ \n        kS[i][w] = (a > b) ? a : b; //4\n      } else{ \n        kS[i][w] =\
  \ kS[i-1][w]; //5\n      } \n    } \n  }\n  return kS[n][capacity]; //6\n} \n```\n\
  \n让我们看看该算法是如何工作的：\n\n*   行 `{1}`：首先，我们将初始化用于寻找解决方案的矩阵。该矩阵是 `ks[n+1][capacity+1]`。\n\
  *   行 `{2}`：我们将忽略矩阵的第一列和第一行，以便只处理非 0 索引。\n*   行 `{3}`：如果物品重量小于限制（容量），则物品 `i` 可能是解决方案的一部分。\n\
  *   行 `{4}`：当我们发现某个物品可以是解决方案的一部分时，我们将选择价值最大的。\n*   行 `{5}`：当这种情况发生时，我们将简单地使用其上一个值。\n\
  *   行 `{6}`：解决方案可以在表格的最后一个单元格中找到，它位于表格的右下角。\n\n使用我们的初始示例测试以下算法：\n\n```javascript\n\
  var values = [3,4,5], \nweights = [2,3,4], \ncapacity = 5, \nn = values.length;\
  \ \nconsole.log(knapSack(capacity, weights, values, n)); //输出 7 \n```\n\n注意，此算法仅输出背包可以携带的最大价值，而不输出具体的物品。我们可以添加以下额外函数来找到解决方案中的物品。\n\
  \n以下图示说明了我们示例中 `kS` 矩阵的构建：\n\n![背包问题](img/Image00110.jpg)\n\n\n\n\n```javascript\n\
  function findValues(n, capacity, kS, weights, values){ \n  var i=n, k=capacity;\
  \ \n  console.log('Items that are part of the solution:'); \n\n  while (i>0 && k>0){\
  \ \n    if (kS[i][k] !== kS[i-1][k]){ \n      console.log('item '+i+' can be part\
  \ of solution w,v: ' +\n      weights[i-1] + ',' + values[i-1]); \n      i--; \n\
  \      k = k - kS[i][k]; \n    } else { \n      i--; \n    } \n  } \n} \n```\n\n\
  我们可以在 `knapsack` 函数的 `{7}` 行之前调用此函数。如果我们执行整个算法，将得到如下输出：\n\n```\n Items that are\
  \ part of the solution: \nitem 2 can be part of solution w,v: 4,3 \nitem 1 can be\
  \ part of solution w,v: 3,2 \nTotal value that can be carried: 7 \n```\n\n### Note\n\
  \n背包问题也可以用递归的方式编写。你可以在本书的源码包中找到递归版本。\n\n#### 最长公共子序列\n\n另一个在编程竞赛题中经常使用的动态规划（DP）问题是最长公共子序列（`LCS`）。这个问题包含寻找两个字符串序列中最长子序列的长度。最长子序列是在两个字符串中以相同的相对顺序出现但不必连续（不是子串）的序列。\n\
  \n考虑以下示例：\n\n![最长公共子序列](img/Image00111.jpg)\n\n现在让我们来看下面的算法：\n\n```javascript\n\
  function lcs(wordX, wordY) { \n\n  var m = wordX.length, \n  n = wordY.length, \n\
  \  l = [], \n  i, j, a, b; \n\n  for (i = 0; i <= m; ++i) { \n    l[i] = []; \n\
  \    //{1} \n    for (j = 0; j <= n; ++j) { \n      l[i][j] = 0; \n      //{2} \n\
  \    } \n  } \n\n  for (i=0; i<=m; i++) { \n    for (j=0; j<=n; j++) { \n      if\
  \ (i == 0 || j == 0){ \n        l[i][j] = 0; \n      } else if (wordX[i-1] == wordY[j-1])\
  \ { \n        l[i][j] = l[i-1][j-1] + 1; \n        //{3} \n        } else { \n \
  \         a = l[i-1][j]; \n          b = l[i][j-1]; \n          l[i][j] = (a > b)\
  \ ? a : b; //max(a,b) \n          //{4} \n        } \n      } \n    } \n    //{5}\
  \ \n    return l[m][n]; \n} \n```\n\n如果我们将背包问题与 `LCS` 算法比较，会发现两者都非常相似。这种技术被称为备忘化（`memoization`），它由以自顶的方式构建解决方案组成，解决方案位于表格/矩阵的右下角。\n\
  \n与背包问题算法一样，这种方法只输出 `LCS` 的长度，而不是实际的 `LCS` 算法。为了提取这些信息，我们需要通过声明一个名为 `solution` 的新矩阵来稍微修改算法。注意，在我们的代码中，有一些注释，我们需要将这些注释替换为以下代码：\n\
  \n*   第 `{1}` 行：`solution[i] = [];`\n*   第 `{2}` 行：`solution[i][j] = '0';`\n*  \
  \ 第 `{3}` 行：`solution[i][j] = 'diagonal';`\n*   第 `{4}` 行：`solution[i][j]=(l[i][j]\
  \ == l[i-1][j]) ? 'top' : 'left';`\n*   第 `{5}` 行：`printSolution(solution, l, wordX,\
  \ wordY, m, n);`\n\n`printSolution` 函数如下：\n\n```javascript\nfunction printSolution(solution,\
  \ l, wordX, wordY, m, n){ \n\n  var a = m, b = n, i, j, \n  x = solution[a][b],\
  \ \n  answer = ''; \n\n  while (x !== '0') { \n    if (solution[a][b] === 'diagonal')\
  \ { \n      answer = wordX[a - 1] + answer; \n      a--; \n      b--; \n    } else\
  \ if (solution[a][b] === 'left') { \n      b--; \n    } else if (solution[a][b]\
  \ === 'top') { \n      a--; \n    } \n    x = solution[a][b]; \n  } \n  console.log('lcs:\
  \ '+ answer); \n} \n```\n\n当解决方案矩阵的方向为对角线时，我们将字符添加到答案中。\n\n如果我们使用字符串 `'acbaed'`\
  \ 和 `'abcadf'` 执行上述述算法，我们将得到输出 `4`。用于构建结果的矩阵 `l` 看起来如下。我们可以使用额外的算法来回溯 LCS 值（如下所示）：\n\
  \n![最长公共子序列](img/Image00112.jpg)\n\n从前面的矩阵中，我们知道 `LCS` 算法是 `4`。\n\n### Note\n\n\
  `LCS` 问题也可以用递归编写。你可以在本书的源码包中找到递归版本。\n\n#### 矩阵链乘法\n\n矩阵乘法是另一个可以用动态规划解决的著名问题。该问题由寻找一组矩阵乘法的最佳方式（顺序）组成。为了更好地理解这个问题，乘以两个矩阵，由于矩阵乘法具有结合律，我们可以以任何顺序乘以这些矩阵。让我们考虑以下情况：\n\
  \n*   `A` 是 10x100 矩阵\n*   `B` 是 100x5 矩阵\n*   `C` 是 5x50 矩阵\n*   `D` 是 50x10 矩阵\n\
  \n结果是 `A*B*C`\n\n在这个例子中，有五种进行这种乘法的方法：\n\n1.  `(A(B(CD)))`：乘法总数为 7\n2.  `((AB)(CD))`：乘法总数为\
  \ 5300\n3.  `(((AB)C)D)`：乘法总数为 8000\n4.  `((A(BC))D)`：乘法总数为 7500\n5.  `(A((BC)D))`：乘法总数为\
  \ 3100\n\n乘法的顺序可以影响执行的法总数。那么，我们如何创建一个算法来找到最小的操作数？`matrixChainOrder` 算法如下：\n\n```javascript\n\
  function matrixChainOrder(p, n) { \n  var i, j, k, l, q, m = []; \n\n  for (i =\
  \ 1; i <= n; i++) { \n    m[i] = []; \n    m[i][i] = 0; \n  } \n\n  for (l = 2;\
  \ l < n; l++) { \n    for (i = 1; i <= n-l+1; i++) { \n      j = i+l-1; \n     \
  \ m[i][j] = Number.MAX_INTEGER; \n      for (k = i; k <= j-1; k++) { \n        q\
  \ = m[i][k] + m[k+1][j] + p[i-1]*p[k]*p[j]; //1\n        if (q < m[i][j]){ \n  \
  \        m[i][j] = q; //2\n        } \n      } \n    } \n  } //3\n  return m[1][n-1];\
  \ \n}\n```\n\n这段代码最重要的行是第 `{1}` 行，因为这是发生魔法的地方，它计算了给定括号的乘法次数并将值存储在辅助矩阵 `m` 中。\n\n\
  如果我们对初始示例执行上述算法，我们将得到输出 `7500`，正如我们之前提到的是最小的操作数。查看这个：\n\n```javascript\nvar p =\
  \ [10, 100, 5, 50, 1], \nn = p.length; \nconsole.log(matrixChainOrder(p, n));\n\
  ```\n\n然而，这个算法也没有为我们提供最优括号顺序。我们可以对代码进行一些更改以获取这些信息。\n\n首先，我们需要通过以下代码声明并初始化辅助矩阵 `s`：\n\
  \n```javascript\nvar s=[]; \nfor (i = 0; i <= n; i++){ \n  s[i] = []; \n  for (j=0;j<=n;\
  \ j++){ \n    s[i][j] = 0; \n  } \n}\n```\n\n然后，在 `matrixChainOrder` 函数的 `{2}` 行，我们将添加以下代码：\n\
  \n```javascript\ns[i][j]=k;\n```\n\n在第 `{3}` 行，我们将调用为我们打印括号的函数，如下：\n\n```javascript\n\
  printOptimalParenthesis(s, 1, n-1);\n```\n\n最后，我们将拥有 `printOptimalParenthesis` 函数，它如下：\n\
  \n```javascript\nfunction printOptimalParenthesis(s, i, j){ \n  if(i == j) { \n\
  \    console.log(\"A[\" + i + \"]\"); \n  } else { \n    console.log(\"(\"); \n\
  \    printOptimalParenthesis(s, i, s[i][j]); \n    printOptimalParenthesis(s, s[i][j]\
  \ + 1, j); \n    console.log(\")\"); \n  } \n}\n```\n\n如果我们执行修改后的算法，也将获得最优的括号顺序\
  \ ``(A1))`，它可以翻译为 `(A(B(CD)))`。\n\n# 贪婪算法\n\n贪婪算法遵循解决问题的启发式，即在每个阶段做出局部最优选择（当时的最佳解决方案），以希望找到全局最优（全局最佳解决方案）。它不会像动态规划算法那样评估大局。\n\
  \n\n\n\n让我们来看看如何使用贪心算法来解决我们在动态规划主题中过的最小硬币找零问题和背包问题。\n\n### 注意\n\n我们在本书的第 9 章，`图论`中介绍过一些其他贪心算法，例如`Dijkstra\
  \ 算法`、`Prim 算法`和`Kruskal 算法`。\n\n## 最小硬币找零问题\n\n最小硬币找零问题也可以用贪心算法解决。大多数情况下结果也是最优的，但对于某些面值，结果将不是最优的。\n\
  \n让我们来看看算法：\n\n```javascript\nfunction MinCoinChange(coins){ \n  var coins = coins;\
  \ //{1} \n\n  this.makeChange = function(amount) { \n    var change = [], \n   \
  \ total = 0; \n    for (var i=coins.length; i>=0; i--){ /{2} \n      var coin =\
  \ coins[i]; \n      while (total + coin <= amount) { /{3} \n        change.push(coin);\
  \           //{4} \n        total += coin;               //{5} \n      } \n    }\
  \ \n    return change; \n  }; \n} \n```\n\n注意，`MinCoinChange` 的贪心版本比 DP 版本要简单得多。类似于动态规划方法，我们将通过传递面值作为参数来实例化\
  \ `MinCoinChange`（行 `{1}`）。\n\n对于每个硬币（行 `{2}`，从大到小），我们将硬币面值添加到 `total` 中，且 `total`\
  \ 需要小于 `amount`（行 `{3}`）。我们将 `coin` 添加到结果中（行 `{4}`），同时也添加到 `total` 中（行 `{5}`）。\n\
  \n如你所示，解决方案非常简单。我们将从值最大的硬币开始，提供该硬币可能的找零。当我们无法为当前的硬币值提供更多硬币时，我们将开始使用第二大硬币进行找零，依此类推。\n\
  \n为了测试代码，我们将使用与 DP 方案中相同的代码，如下：\n\n```javascript\nvar minCoinChange = new MinCoinChange([1,\
  \ 5, 10, 25]); \nconsole.log(minCoinChange.makeChange(36)); \n```\n\n结果也将是 `[25,\
  \ 10, 1]`，与我们使用 DP 得到的结果相同。下面的图说明了算法的执行过程：\n\n![最小硬币找零问题](img/Image00113.jpg)\n\n\
  然而，如果我们使用 `[1, 3, 4]` 面值并执行上述的贪心算法，我们将得到 `[4, 1, 1]` 作为结果。如果使用动态规划解决方案，我们将得到 `[3,\
  \ 3]` 作为结果，这是最优结果。\n\n贪心算法比动态规划算法简单且更快。然而，正如我们注意到的，它并不总是给出最优答案。尽管，平均而言，它可以在执行时间内输出一个可以接受的解决方案。\n\
  \n## 分数背包问题\n\n解决分数背包问题的算法与动态规划版本略不同。在 `0-1` 背包问题中，我们只能使用整个物品填充背包，而在分数背包问题中，我们可以使用物品的部分。让我们使用之前相同的示例来比较差异，如下：\n\
  \n| 物品 # | 重量 | 价值 |\n| :--- | :--- | :--- |\n| 1 | 2 | 3 |\n| 2 | 3 | 4 |\n| 3\
  \ | 4 | 5 |\n\n在动态规划示例中，我们考虑背包只能装载重量为 5。对于这个示例，我们可以说最佳解决方案是用物品 1 和 2 填充背包，它们的总重量为\
  \ 5，总价值为 7。\n\n如果我们为分数背包问题考虑相同的容量，我们将得到相同的输出。因此，让我们考虑容量为 6 而不是 5。\n\n在这种情况下，解决方案是使用物品\
  \ 1 和 2，以及物品 3 的 25%。这将产生总重量 6 的最大价值 8.25。\n\n让我们来看看下面的算法：\n\n```javascript\nfunction\
  \ knapSack(capacity, values, weights) { \n  var n = values.length, \n  load = 0,\
  \ i = 0, val = 0; \n\n  for (i=0; i<n && load < capacity; i++) { /{1} \n\n    if\
  \ (weights[i] <= (capacity-load)) { /{2} \n      val += values[i]; \n      load\
  \ += weights[i]; \n    } else { \n      var r = (capacity-load)/weights[i]; /{3}\
  \ \n      val += r * values[i]; \n      load += weights[i]; \n    } \n  } \n  return\
  \ w; \n} \n```\n\n以下是解释：\n\n*   行 `{1}`：当总负载小于 `capacity` 时\n*   行 `{2}`：如果 `weights[i]`\
  \ 小于或等于 `capacity-load`\n*   行 `{3}`：计算比例 `r = (capacity-load)/weights[i]`\n\n#\
  \ 函数式编程简介\n\n到目前为止，我们使用的是命令式编程。在本主题中，我们将引入一种新的范式——函数式编程。函数式编程曾被学术界使用，得益于 Python\
  \ 和 Ruby 等语言，它在开发者中变得流行。随着现代功能的加入，在 JavaScript 中开发函数式程序变得更加容易。让我们考虑一个示例。\n\n## 函数式对比命令式编程\n\
  \n开发函数式并不困难，只需要习惯它。让我们编写示例来注意差异。\n\n假设我们需要打印数组的所有元素。我们可以使用命令式编程并声明如下函数：\n\n```javascript\n\
  var printArray = function(array){ \n  for (var i=0; i<array.length; i++){ \n   \
  \ console.log(array[i]); \n  } \n}; \nprintArray([1, 2]);\n```\n\n在前面的代码中，我们遍历数组并打印了每个项。\n\
  \n现在，让我们尝试将示例转换为函数式。在函数式编程中，函数是核心。我们需要关注的是什么，而不是怎么做。让我们回到那句话“我们遍历数组并打印了每个项”。所以，我们首先关注的是迭代数据，然后对它采取操作，即打印项。以下函数负责迭代数组：\n\
  \n```javascript\nvar forEach = function(array, action){ \n  for (var i=0; i<array.length;\
  \ i++){ \n    action(array[i]); \n  } \n}; \n```\n\n然后，我们将另一个负责将元素打印到控制台的函数（我们可以将其视为回调函数），如下：\n\
  \n```javascript\nvar logItem = function (item) { \n  console.log(item); \n}; \n\
  ```\n\n最后，我们可以使用声明的函数：\n\n```javascript\nforEach([1, 2], logItem);\n```\n\n通过仔细观察前面的代码，我们可以描述为我们将打印数组的每个项。我们有了第一个函数式编程示例了！\n\
  \n有几点需要注意：\n\n*   主要目标是描述数据以及我们需要对这些数据执行的转换\n*   程序执行的顺序重要性不高，而在命令式编程中，步骤和顺序非常重要\n\
  *   函数和数据集合是函数式编程的核心\n*   我们可以在函数式编程中使用和滥用函数和递归，而循环、赋值、条件判断以及函数在命令式编程中使用\n\n\n\n\
  假设我们要找到数组的最小值。在命令式编程中，为了完成此任务，我们只需要遍历整个数组并验证当前最小值是否大于数组中的值；如果是，我们将分配一个新的最小值，如下：\n\
  \n```javascript\nvar findMinArray = function(array){ \n  var minValue = array[0];\
  \ \n  for (var i=1; i<array.length; i++){ \n    if (minValue > array[i]){ \n   \
  \   minValue = array[i]; \n    } \n  } \n   return minValue; \n}; \nconsole.log(findMinArray([8,6,4,5,9]));\
  \ //outputs 4 \n```\n\n在函数式编程中执行相同任务，我们可以使用 `Math.min` 函数，将数组的所有元素传递给它进行比较。为了将数组转换为单个元素，我们可以使用\
  \ ES2015 解构运算符（`...`），如下例所示：\n\n```javascript\nconst min_ = function(array){ \n\
  \  return Math.min(...array) \n}; \nconsole.log(min_([8,6,4,5,9])); //outputs 4\
  \ \n```\n\n使用 ES2015 箭头函数，我们可以进一步简化上述代码：\n\n```javascript\nconst min = arr => Math.min(...arr);\
  \ \nconsole.log(min([8,6,4,5,9])); \n```\n\n# JavaScript 函数式工具箱 - map, filter, and\
  \ reduce\n\n`map`、`filter` 和 `reduce` 函数（你已经在第 2 章，数组中学习过它们）是函数式编程的基础。\n\n使用 `map`\
  \ 函数，我们可以将一组数据转换或映射为另一个数据集。让我们来看一个命令式编程的示例：\n\n```javascript\nvar daysOfWeek = [\
  \ \n  {name: 'Monday', value: 1}, \n  {name: 'Tuesday', value: 2}, \n  {name: 'Wednesday',\
  \ value: 7} \n]; \n\nvar daysOfWeekValues_ = []; \nfor (var i = 0; i < daysOfWeek.length;\
  \ i++) { \n  daysOfWeekValues_.push(daysOfWeek[i].value); \n} \n```\n\n现在让我们考虑使用函数式编程实现的相同示例，如下：\n\
  \n```javascript\nvar daysOfWeekValues = daysOfWeek.map(function(day) { \n  return\
  \ day.value; \n}); \nconsole.log(daysOfWeekValues); \n```\n\n使用 `filter` 函数，我们可以从集合中过滤出值。让我们考虑一个示例：\n\
  \n```javascript\nvar positiveNumbers_ = function(array){ \n  var positive = [];\
  \ \n  for (var i = 0; i < array.length; i++) { \n    if (array[i] >= 0){ \n    \
  \  positive.push(array[i]); \n    } \n  } \n  return positive; \n} \nconsole.log(positiveNumbers_([-1,1,2,-2]));\
  \ \n```\n\n使用函数式范式编写相同的代码，如下：\n\n```javascript\nvar positiveNumbers = function(array){\
  \ \n  return array.filter(function(num){ \n  return num >= 0; \n  }) \n}; \nconsole.log(positiveNumbers([-1,1,2,-2]));\
  \ \n```\n\n此外，使用 `reduce` 函数，我们可以将集合归约为特定的值。例如，让我们来看如何对数组求和：\n\n```javascript\n\
  var sumValues = function(array){ \n  var total = array[0]; \n  for (var i=1; i<array.length;\
  \ i++){ \n    total += array[i]; \n  } \n  return total; \n}; \nconsole.log(sumValues([1,\
  \ 2, 3, 4, 5])); \n```\n\n我们也可以如下所示编写上述代码：\n\n```javascript\nvar sum_ = function(array){\
  \ \n  return array.reduce(function(a, b){ \n  return a + b; \n  }) \n}; \nconsole.log(sum_([1,\
  \ 2, 3, 4, 5])); \n```\n\n我们还可以通过以下代码将这些函数与 ES2015 功能（如解构运算符和箭头函数）混合：\n\n```javascript\n\
  const sum = arr => arr.reduce((a, b) => a + b); \nconsole.log(sum([1, 2, 3, 4, 5]));\
  \ \n```\n\n让我们来看另一个例子。假设我们需要写一个函数来合并多个数组。为了实现这一点，我们可以创建一个包含其他数组所有元素的新数组。我们可以使用命令式范式执行以下代码：\n\
  \n```javascript\nvar mergeArrays_ = function(arrays){ \n  var count = arrays.length,\
  \ \n  newArray = [], \n  k =0; \n  for (var i=0; i<count; i++){ \n    for (var j=0;\
  \ j<arrays[i].length; j++){ \n      newArray[k++] = arrays[i][j]; \n    } \n  }\
  \ \n  return newArray; \n}; \nconsole.log(mergeArrays_); \n```\n\n\n\n我们如何衡量算法的效率？我们通常使用资源，如\
  \ CPU（时间）使用率、内存占用、磁盘占用和网络占用。在谈论大 O 表示法时，我们通常考虑 CPU（时间）使用率。\n\n让我们尝试通过一些例子来理解大 O\
  \ 表示法的工作原理。\n\n#### O(1)\n\n考虑以下函数：\n\n```\nfunction increment(num){ \n  return\
  \ ++num; \n} \n```\n\n如果我们尝试执行 `increment(1)` 函数，我们的执行时间将等于 `x`。如果我们尝试用不同的参数再次执行\
  \ `increment` 函数（假设 `num` 为 `2`），执行时间也将是 `x`。参数并不重要；函数 `increment` 的性能是相同的。由于这个原因，我们可以说前述函数的复杂度为\
  \ `O(1)`（即常数级）。\n\n#### O(n)\n\n现在，让我们使用第 10 章、*排序与搜索算法*中实现的顺序查找算法作为示例：\n\n```\n\
  function sequentialSearch(array, item){ \n  for (var i=0; i<array.length; i++){\
  \ \n    if (item === array[i]){ //{1} \n      return i; \n    } \n  } \n  return\
  \ -1; \n} \n```\n\n如果我们将一个包含 10 个元素的数组（[1, ..., 10]）传递给此函数并寻找元素 1，在第一次尝试中我们就能找到寻找的元素。假设执行一次行\
  \ `{1}` 的代价为 1。\n\n现在，假设我们正在寻找元素 11。行 `{1}` 将被执行 10 次（它将遍历数组的所有值，并且找不到我们正在寻找的值；因此，它将返回\
  \ `-1`）。如果行 `{1}` 的代价为 1，那么执行 10 次的代价就是 10，这比我们使用的第一个例子大 10 倍。\n\n现在，假设数组有 1000\
  \ 个元素（[1, ..., 1000]）。寻找元素 1001 将导致行 `{1}` 被执行 1000 次（然后返回 `-1`）。\n\n注意，执行 `sequentialSearch`\
  \ 函数的总代价取决于数组的元素数量（大小），也取决于我们正在寻找的值。如果我们寻找的元素存在数组中，那么行 `{1}` 将执行多少次？如果我们寻找的元素不存在，那么行\
  \ `{1}` 将执行数组大小次数次，我们称之为最坏情况。\n\n考虑到 `sequentialSearch` 函数的最坏情况，如果我们有一个大小为 10 的数组，代价将是\
  \ 10。如果我们有一个大小为 1000 的数组，代价将是 1000。我们可以得出 `sequentialSearch` 函数的复杂度为 `O(n)` —— `n`\
  \ 是数组（输入）的大小。\n\n为了在实践中看到前面的解释，让我们修改算法来计算代价（最坏情况），如下：\n\n```\nfunction sequentialSearch(array,\
  \ item){ \n  var cost = 0; \n  for (var i=0; i<array.length; i++){ \n    cost++;\
  \ \n    if (item === array[i]){ //{1} \n      return i; \n    } \n  } \n  console.log('cost\
  \ for sequentialSearch with input size ' +\n  array.length + ' is ' + cost); \n\
  \  return -1; \n} \n```\n\n尝试使用不同的输入大小执行前面的算法，以便看到不同的输出。\n\n#### O(n²)\n\n对于 `O(n²)`\
  \ 示例，让我们使用*冒泡排序*算法：\n\n```\nfunction swap(array, index1, index2){ \n  var aux =\
  \ array[index1]; \n  array[index1] = array[index2]; \n  array[index2] = aux; \n\
  } \n\nfunction bubbleSort(array){ \n  var length = array.length; \n  for (var i=0;\
  \ i<length; i++){        //{1} \n    for (var j=0; j<length-1; j++ ){ //{2} \n \
  \     if (array[j] > array[j+1]){ \n        swap(array, j, j+1); \n      } \n  \
  \  } \n  } \n} \n```\n\n考虑行 `{1}` 和 `{2}` 的代价均为 1。让我们修改算法来计算代价如下：\n\n```\nfunction\
  \ bubbleSort(array){ \n  var length = array.length; \n  var cost = 0; \n  for (var\
  \ i=0; i<length; i++){帚 1} \n    cost++; \n    for (var j=0; j<length-1; j++ ){帚\
  \ 2} \n      cost++; \n      if (array[j] > array[j+1]){ \n        swap(array, j,\
  \ j+1); \n      } \n    } \n  } \n  console.log('cost for bubbleSort with input\
  \ size ' +\n  length + ' is ' + cost); \n}\n```\n\n如果我们对大小为 10 的数组执行 `bubbleSort`，代价将是\
  \ 100 (10²)。如果我们对大小为 100 的数组执行 `bubbleSort`，代价将是 10,000 (100²)。注意，每次增加输入大小时，执行时间都会变长。\n\
  \n注意，`O(n)` 的代码只有一个循环，而 `O(n²)` 有两个嵌套循环。如果算法有三个循环遍历数组，那么它可能是 `O(n³)`。\n\n## 比较复杂度\n\
  \n我们可以使用如下表来比较前面提到的不同大 O 表示法：\n\n![比较复杂度](img/Image0014.jpg)\n\n此图也是使用 JavaScript\
  \ 绘制的！你可以在此书附带示例代码的 `chapter12` 下 `bigOChart` 找到绘制此图的源码。在接下来的章节中，找到一个显示此书中实现的算法复杂度的备查表。\n\
