  \ `{2}` 行），并检查我们要查找的元素是否是当前元素。如果是，返回它的位置（第 `{3}` 行）。如果不是，我们继续计数（第 `{4}` 行），并进入列表的下一个节点（第\
  \ `{5}` 行）。\n\n如果列表为空或者我们到达了列表末尾（`current = current.next` 将为 `null`），则循环将不会执行。如果我们没有找到该值，则返回\
