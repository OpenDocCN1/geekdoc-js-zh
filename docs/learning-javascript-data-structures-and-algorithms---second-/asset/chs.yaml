  \ `{3}` 行）。当我们退出循环时，`current` 变量将是我们想要插入新项的位置之后的元素引用，而 `previous` 将是我们插入新项的位置之前的元素引用。在这种情况下，我们想在\
  \ `previous` 和 `current` 之间添加新项。\n\n## 实现其他方法\n\n在本部分，我们将学习如何实现 `LinkedList` 的其他方法，例如\
  \ `toString`、`indexOf`、`isEmpty` 和 `size`。\n\n### toString 方法\n\n`toString` 方法将\
