  \ O(n) |\n| 哈希表 | O(1) | O(n) | O(1) | O(1) | O(1) |\n| 二叉搜索树 | O(log n) | O(n)\
  \ | O(log n) | O(log n) | O(n) |\n| AVL 树 | O(log n) | O(log n) | O(log n) | O(log\
  \ n) | O(log n) |\n| 红黑树 | O(log n) | O(log n) | O(log n) | O(log n) | O(log n)\
  \ |\n\n### 图\n\n下表显示了图的复杂度：\n\n| 图的表示 | 存储大小 | 添加顶点 | 添加边 | 删除顶点 | 删除边 | 查询 |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- |\n| 邻接列表 | O(V + E) | O(1) | O(1) | O(V\
  \ + E) | O(E) |\n| 邻接矩阵 | O(V²) | O(V²) | O(1) | O(V²) | O(1) |\n\n### 排序算法\n\n\
  下表显示了排序算法的复杂度：\n\n| 算法（应用于数组） | 时间复杂度 | 最好情况 | 平均情况 | 最坏情况 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| 冒泡排序 | O(n²) | O(n) | O(n²) | O(n²) |\n| 选择排序 | O(n²) | O(n²)\
  \ | O(n²) | O(n²) |\n| 插入排序 | O(n²) | O(n) | O(n²) | O(n²) |\n| 归并排序 | O(n log(n))\
  \ | O(n log(n)) | O(n log(n)) | O(n log(n)) |\n| 快速排序 | O(n log(n)) | O(n log(n))\
  \ | O(n log(n)) | O(n²) |\n| 堆排序 | O(n log(n)) | O(n log(n)) | O(n log(n)) | O(n\
  \ log(n)) |\n| 桶排序 | O(n+k) | O(n+k) | O(n+k) | O(n²) |\n| 基数排序 | O(nk) | O(nk)\
  \ | O(nk) | O(nk) |\n\n## NP 完性理论简介\n\n通常，如果一个算法是 `O(n^k)`（其中 `k` 是常数），我们就认为它是高效的，这被称为多项式算法。\n\
  \n对于一个在最坏情况下也有多项式算法的问题，该算法标记为 `P`（多项式）。\n\n另一组算法被称为 **NP**（非确定性多项式时间）。NP 问题是指可以在多项式时间内验证解的问题。\n\
  \n\n\n\n\n如果一个问题 `P` 有一个可以在多项式时间内运行的算法，我们也可以多项式时间内验证它的解。那么，我们可以得出 `P` 是 `NP` 的子集或等于\
  \ `NP`。然而，目前未知 `P = NP`。\n\n`NP-Complete` 问题是 NP 集中最难的问题。如果一个决策问题 `L` 满足以下条件，则它是\
  \ NP-Complete：\n\n1. `L` 属于 NP（这意味着任何给定的 NP-完全问题的解决方案都可以被快速验证，但目前没有高效的解）。\n2. NP\
  \ 中的每个问题都可以在多项式时间内归约为 `L`。\n\n为了理解什么是归约（reduction），请将 `L` 和 `M` 视为两个决策问题。假设算法 `A`\
  \ 解决了 `L`。也就是说，如果 `y` 是 `M` 的输入，那么算法 `B` 将根据 `y` 是否属于 `M` 来回答 `Yes` 或 `No`。其思想是找到一个从\
  \ `L` 到 `M` 的转换，使得算法 `B` 可以成为算法 `A` 的一部分来解决 `A`。\n\n我们还有另一类问题称为 NP-Hard。如果一个问题满足属性\
  \ 2（NP-Complete 的属性），且不需要满足属性 1，那么就是 NP-Hard。因此，NP-Complete 集也是 NP-Hard 集的子集。\n\n\
  ### Note\n\n`P = NP` 是否成立是计算机科学中最大的问题之一。如果有人找到了这个问题的答案，它将对密码学、算法研究、人工智能等许多领域产生巨大影响。\n\
  \n下面的图表示了在 `P < > NP` 的情况下 `P`、`NP`、`NP-Complete` 和 `NP-Hard` 问题的欧图：\n\n![Introduction\
  \ to the NP-Completeness theory](img/Image00115.jpg)\n\n作为不是 NP-Complete 的 NP-Hard\
  \ 问题的例子，我们可以提到停机问题（halting problem）和布尔满足性问题（`SAT`）。\n\n作为 NP-Complete 问题的例子，我们还可以提到子集和问题、旅行员问题和顶点覆盖问题。\n\
  \n### Note\n\n有关关于这些问题的更多信息，请参考 [`en.wikipedia.org/wiki/NP-completeness`](https://en.wikipedia.org/wiki/NP-completeness)。\n\
  \n### 不可能的问题和启发式算法\n\n我们提到的某些问题是不可能解决的。然而，有一些技术可以在满意的时间内获得近似解。一种技术就是使用启发式算法（heuristic\
  \ algorithms）。由启发式产生的解可能不是所有解中的最优解，但在当时解决问题已经足够。\n\n启发式算法的一些例子包括局部搜索、遗传算法、启发式路由和机器学习。欲更多信息，请查看\
  \ [`goo.gl/gxIu9w`](http://goo.gl/gxIu9w)。\n\n### Tip\n\n启发式是尝试解决问题的一种极佳且有趣的方法。你可以尝试挑选一个问题，为你的本科或硕士论文开发一个启发式算法。\n\
  \n# 尽情玩算法\n\n我们学习算法不仅是因为我们在大学里需要学习它们，或者想成为开发者。你可以通过使用在书中中学的算法作为解决问题的方法，提升你的解决问题能力，成为一个更专业的人士。\n\
  \n提升我们解决问题能力的最佳方法是练习，而练习并不需要无聊。在这一节中，我们将介绍一些你可以去并开始尽情玩算法的网站（甚至可以在此赚点钱！）。\n\n以下是一些实用网站的列表（其中一些网站不支持用\
  \ JavaScript 发送问题的解决方案，但我们也可以将书中讨论的逻辑应用于其他编程语言）：\n\n*   `UVa Online Judge` ([`uva.onlinejudge.org/`](http://uva.onlinejudge.org/)):\
  \ 该网站包含了全球多场编程竞赛使用的问题集，包括 IBM 赞助的 ACM 国际大学生程序设计竞赛 (`ICPC`）。如果你还在大学，尝试参加这次比赛，如果你的团队获胜，你可以免费环游世界！）。该网站包含了数百道我们可以使用书中学习的算法解决的问题。\n\
  *   `Sphere Online Judge` ([`www.spoj.com/`](http://www.spoj.com/)): 该网站与 UVa Online\
  \ Judge ，但支持更多语言（包括 JavaScript 提交）。\n*   `Coder Byte` ([`coderbyte.com/`](http://coderbyte.com/)):\
  \ 该网站包含 74 道问题（简单、中等和困难难度），也可以用 JavaScript 解决。\n*   `Project Euler` ([`projecteuler.net/`](https://projecteuler.net/)):\
  \ 该网站包含一系列数学/计算机编程问题。你所做的就是输入问题的答案，但我们可以使用算法来为我们找到答案。\n*   `Hacker Rank` ([`www.hackerrank.com`](https://www.hackerrank.com)):\
  \ 该网站包含 263 个挑战，分为 16 个类别（你可以使用书中学的算法以及更多算法）。它也支持 JavaScript 等其他语言。\n*   `Code Chef`\
  \ ([`www.codechef.com/`](http://www.codechef.com/)): 该网站也包含几个问题并在在线举办竞赛。\n*   `Top\
  \ Coder` ([`www.topcoder.com/`](http://www.topcoder.com/)): 该网站组织编程比赛，通常由 NASA、Google、Yahoo!\
  \ 和 Facebook 等公司赞助。有些比赛提供与赞助公司合作的机会，有些比赛会提供奖金。该网站还提供了很好的解决问题教程。\n\n# Summary\n\n\
  在本章中涵盖了大 O 表示法，并讨论了如何通过这一概念计算算法的复杂度。我们引入了 NP-完全性理论，如果你对学习更多关于解决不可能问题和使用启发式获得近似满意的解决方案感兴趣，可以深入研究。\n\
  \n祝编程愉快！\n\n"
