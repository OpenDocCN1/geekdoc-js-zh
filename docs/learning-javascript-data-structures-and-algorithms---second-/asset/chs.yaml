  \n让我们来看看如何删除第一个元素。`current` 变量是列表第一个元素的引用，即我们要删除的那个元素。我们要做的只是更改 `head` 的引用；不再是 `current`，而是下一个元素（`current.next`\
  \ —— 第 `{1}` 行）。但我们还需要更新 `current.next` 的 `prev` 指针（因为第一个元素的 prev 指针是指向 null 的引用）。因此，我们将\
