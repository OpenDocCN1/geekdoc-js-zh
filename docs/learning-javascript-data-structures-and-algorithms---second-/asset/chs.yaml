  \n[content]\n## 查找最小值和最大值\n\n要找到最小值，我们总是前往树的最左侧节点。要找到最大值，我们总是前往树的最右侧节点。\n\n（此处省略了原文中重复出现的描述，直接进入下一章节）\n\
  \n#### 查找特定值\n\n在之前的章节中，我们还实现了 `find`、`search` 和 `get` 方法在数据结构中查找特定值（这与我们在之前章节中实现的\
  \ `has` 方法相似）。我们也将为二叉搜索树（BST）实现 `search` 方法。让我们来看看它的实现：\n\n```\nthis.search = function(key){\
  \ \n  return searchNode(root, key); //{1} \n}; \n\nvar searchNode = function(node,\
  \ key){ \n\n  if (node === null){2} \n    return false; \n  } \n  if (key < node.key){3}\
  \ \n    return searchNode(node.left, key); //{4} \n\n  } else if (key > node.key){5}\
  \ \n    return searchNode(node.right, key); //{6} \n\n  } else { \n    return true;\
  \ //{7} \n  } \n}; \n```\n\n\n\n\n如果节点不是 `null`，我们需要继续验证。如果我们查找的键小于当前节点（第 `{3}`\
  \ 行），那么我们将继续使用左子树树进行搜索（第 `{4}` 行）。如果我们查找的值大于当前节点（第 `{5}` 行），那么我们将从当前节点的右子节点继续搜索（第\
  \ `{6}` 行）。否则，这意味着我们正在查找的键与当前节点的键相等，我们将返回 `true` 表示我们找到了该键（第 `{7}` 行）。\n\n我们可以使用以下代码来测试此方法：\n\
  \n```\nconsole.log(tree.search(1) ? 'Key 1 found.' : 'Key 1 not found.'); \nconsole.log(tree.search(8)\
  \ ? 'Key 8 found.' : 'Key 8 not found.'); \n```\n\n它将输出以下内容：\n\n```\nValue 1 not\
  \ found.\n\nValue 8 found. \n```\n\n让我们详细查看该方法是如何执行以找到键 `1` 的：\n\n1.  我们调用了 `searchNode`\
  \ 方法，并将根节点作为参数传递（第 `{1}` 行）。`node[root[11]]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第 `{3}`\
  \ 行。\n2.  `key[1] < node[11]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `node[7]` 和 `key[1]` 作为参数。\n3.  `node[7]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第\
  \ `{3}` 行。\n4.  `key[1] < node[7]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `node[5]` 和 `key[1]` 作为参数。\n5.  `node[5]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第\
  \ `{3}` 行。\n6.  `key[1] < node[5]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `node[3]` 和 `key[1]` 作为参数。\n7.  `node[3]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第\
  \ `{3}` 行。\n8.  `key[1] < node[3]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `null` 和 `key[1]` 作为参数。传递 `null` 是因为 `node[3]` 是一个叶节点（它没有子节点，因此左子节点值为 `null`）。\n\
  9.  `node` 为 `null`（在第 `{2}` 行，在这种情况下搜索的 `node` 为 `null`），所以我们将返回 `false`。\n10.\
  \ 在此之后，方法调用栈将弹出，执行结束。\n\n让我们进行同样的练习来查找值 `8`，如下：\n\n1.  我们调用了 `searchNode` 方法，并将\
  \ `root` 作为参数传递（第 `{1}` 行）。`node[root[11]]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第 `{3}`\
  \ 行。\n2.  `key[8] < node[11]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `node[7]` 和 `key[8]` 作为参数。\n3.  `node[7]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第\
  \ `{3}` 行。\n4.  `key[8] < node[7]` 为 `false`（第 `{3}` 行），所以我们将跳转到第 `{5}` 行。\n5. \
  \ `key[8] > node[7]` 为 `true`（第 `{5}` 行），所以我们将跳转到第 `{6}` 行并再次调用 `searchNode` 方法，将\
  \ `node[9]` 和 `key[8]` 作为参数。\n6.  `node[9]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第 `{3}`\
  \ 行。\n7.  `key[8] < node[9]` 为 `true`（第 `{3}` 行），所以我们将跳转到第 `{4}` 行并再次调用 `searchNode`\
  \ 方法，将 `node[8]` 和 `key[8]` 作为参数。\n8.  `node[8]` 不是 `null`（第 `{2}` 行），所以我们将跳转到第\
  \ `{3}` 行。\n9.  `key[8] < node[8]` 为 `false`（第 `{3}` 行），所以我们将跳转到第 `{5}` 行。\n10.\
  \ `key[8] > node[8]` 为 `true`（第 `{5}` 行），所以我们将跳转到第 `{6}` 行...\n\n\n\n\n\n如果该节点没有左孩子（行\
  \ `{12}`），则意味着它有一个右孩子。因此，我们将节点的引用更改为它的右孩子（行 `{13}`），并返回更新后的节点（行 `{14}`）。如果该节点没有右孩子（行\
  \ `{15}`），我们也将执行相同的操作：将节点引用更新为它的左孩子（行 `{16}`），并返回更新后的值（行 `{17}`）。\n\n下面的图展示了删除仅有一个左孩子或右孩子的节点的示例：\n\
  \n![删除仅有左孩子或右孩子的节点](img/Image00070.jpg)\n\n### 1. 删除具有两个子节点的节点\n\n现在是第三种情况，也是最复杂的一种情况，即我们尝试删除的节点有两个孩子：右孩子和左孩子。要删除具有子节点的节点，需要执行以下四个步骤：\n\
  \n1. 一旦我们找到了想要删除的节点，我们需要从它的右侧边缘子树中找到最小节点（即其后继节点行 `{18}`）。\n2. 然后，我们将用其右侧子树中最小节点的键来更新节点的值（行\
  \ `{19}`）。通过此操作，我们替换了该节点的键，这意味着该节点被删除了。\n3. 然而，现在树中有两个具有相同键的节点，这是不允许的。我们现在需要做的是从右树中删除最小节点，因为我们已经移动到了删除节点的位置（行\
  \ `{20}`）。\n4. 最后，我们将更新后的节点引用返回给它的父节点（行 `{21}`）。\n\n`findMinNode` 方法的实现与 `min` 方法完全相同。唯一的区别在于，在\
  \ `min` 方法中我们只返回键，而在 `findMinNode` 方法中，我们返回节点。\n\n下面的图展示了删除仅有左孩子和右孩子节点的示例：\n\n![删除具有两个子节点的节点](img/Image00071.jpg)\n\
  \n# 1. 自平衡树\n\n既然你已经了解了如何操作 BST，如果你愿意，现在可以深入研究树的结构了。\n\nBST 有一个问题：取决于你添加了多少节点，树的一条边可能会非常深，这意味着树的某个分支层级很高，而另一个分支的层级很低，如下：\n\
  \n![自平衡树](img/Image00072.jpg)\n\n这会导致在树的特定边上进行添加、删除和搜索节点时出现性能问题。因此，存在一种树被称为 **Adelson-Velskii\
  \ and Landi 树**（**AVL 树**）。AVL 树是一种自平衡 BST 树，这意味着任何节点的左左右子树的高度差最多为 1。你将在下一个主题中学习更多关于\
  \ AVL 树的知识。\n\n## 2. Adelson-Velskii and Landi 树 (AVL 树)\n\nAVL 树是一种自平衡树，这意味着每当向其或删除节点时，树都会尝试进行自平衡。任何节点（以及任何层级）的左左右子树的高度差最多为\
  \ 1。这意味着树在添加或删除节点时会尽可能尝试成为完全树。\n\n### 2.1 在 AVL 树中插入节点\n\n在 AVL 树中插入和删除节点的方法与 BST\
  \ 相同。然而，AVL 树的区别在于我们需要验证它的**平衡因子**，如果需要，我们将应用逻辑对树进行自平衡。\n\n以下代码在 AVL 树中插入一个新节点：\n\
  \n```\nvar insertNode = function(node, element) { \n  if (node === null) { \n  \
  \  node = new Node(element); \n  } else if (element < node.key) { \n    node.left\
  \ = insertNode(node.left, element); \n\n    if (node.left !== null) { \n      //verify\
  \ if balancing is needed {1}\n\n    } \n  } else if (element > node.key) { \n  \
  \  node.right = insertNode(node.right, element); \n\n    if (node.right !== null)\
  \ { \n      //verify if balancing is needed {2}\n\n    } \n  } \n  return node;\
  \ \n}; \n```\n\n然而，每当我们插入一个新节点时，都需要检查树是否需要平衡（行 `{1}` 和 `{2}`）。\n\n#### 2.1.1 计算平衡因子\n\
  \n在 AVL 树中，对于每个节点，我们需要计算右子树高度（`hr`）和左子树高度（`hl`）之间的差异。`hr - hl` 的结果应该是 0、1 或 -1。如果结果不同于这些值，则意味着树需要平衡。这个概念被称为平衡因子。\n\
  \n下面的图展示了某些树的平衡因子（所有树都是平衡的）：\n\n![计算平衡因子](img/Image00073.jpg)\n\n计算节点高度的代码如下：\n\n\
  ```\nvar heightNode = function(node) { \n  if (node === null) { \n    return -1;\
  \ \n  } else { \n    return Math.max(heightNode(node.left), \n    heightNode(node.right))\
  \ + 1;\n  }\n};\n```\n\n因此，如果我们在左子树中插入新节点，我们将计算高度，如果结果大于 1，则对左侧进行平衡：\n\n```\n//行\
  \ {1}\nheightNode(node.left) - heightNode(node.right) > 1\n```\n\n如果我们在右子树中插入新节点，我们将通过以下代码对其进行平衡：\n\
  \n```\n//行 {2}\nheightNode(node.right) - heightNode(node.left) > 1\n```\n\n####\
  \ 2.1.2 AVL 旋转\n\n向 AVL 树插入节点时，有两种过程可以使用：单旋转或双旋转。在单旋转和双旋转之间，有四种场景：\n\n* **右右 (RR)**：向左单旋转。\n\
  * **左左 (LL)**：向右单旋转。\n* **左右 (LR)**：双旋转。\n* **右左 (RL)**：双旋转。\n\n让我们考虑每种情况是如何工作的。\n\
  \n**右右 (RR)：向左单旋转**\n\n考虑下图：\n\n![AVL 旋转](img/Image00074.jpg)\n\n假设节点 90 是最后插入的。这会导致树不平衡（节点\
  \ 50 的左右高度差为 2），因此我们需要对其进行平衡。我们平衡树的步骤如下：\n\n* 参与平衡的三个节点（X、Y、Z）中的中间节点 X 将替换 Y 的位置，其平衡因子为\
  \ -2（行 `{1}`）。\n* X 的右侧子树不会改变。\n* X 的左侧子树（Z）将被放置为 Y 的右侧子树（行 `{2}`）。\n* X 的左孩子将引用\
  \ Y（行 `{3}`）。\n\n以下代码演示了这一过程：\n\n```\nvar rotationRR = function(node) { \n  var\
  \ tmp = node.right;  //{1} \n  node.right = tmp.left; //{2} \n  tmp.left = node;\
  \       //{3} \n  return tmp; \n}; \n```\n\n**左左 (LL)：向右单旋转**\n\n考虑下图：\n\n![AVL\
  \ 旋转](img/Image00075.jpg)\n\n假设节点 5 是最后插入 AVL 树的。这会导致树不平衡（节点 50 的左右高度差为 2），因此我们需要对其进行平衡。我们平衡树的步骤如下：\n\
  \n* 参与平衡的三个节点（X、Y、Z）中的中间节点 X 将替换 Y 的位置，其平衡因子为 2（行 `{1}`）。\n* X 的左侧子树不会改变。\n* X 的右侧子树（Z）将被放置为\
  \ Y 的左侧子树（行 `{2}`）。\n* X 的右孩子将引用 Y（行 `{3}`）。\n\n\n\n\n\n```javascript\nvar rotationLL\
  \ = function(node) { \n  var tmp = node.left;   //{1} \n  node.left = tmp.right;\
  \ //{2} \n  tmp.right = node;      //{3} \n  return tmp; \n}; \n```\n\n## 左-右 (LR)：向右的双重旋转\n\
  \n考虑下面的图：\n\n![AVL rotations](img/Image00076.jpg)\n\n假设节点 `35` 是 AVL 树中最后插入的。这会导致树失去平衡（节点\
  \ `50` - `Y` 的高度为 `+2`），因此我们需要对其进行平衡处理。以下是执行平衡树的步骤：\n\n*   节点 `X` 将取代平衡因子为 `+2`\
  \ 的节点 `Y`\n*   节点 `X` 及其右侧子树（节点 `Z` ）将作为节点 `Y` 的左侧子树\n*   节点 `X` 及其左侧子树将作为节点 `Z`\
  \ 的右侧子树\n*   节点 `X` 的右孩子将引用节点 `Y`\n*   节点 `X` 的左孩子将引用节点 `Z`\n\n所以基本上，我们先执行一次 RR\
  \ 旋转，然后执行一次 LL 旋转。\n\n下面的代码示例了这一过程：\n\n```javascript\nvar rotationLR = function(node)\
  \ { \n  node.left = rotationRR(node.left); \n  return rotationLL(node); \n}; \n\
  ```\n\n## 右-左 (RL)：向左的双重旋转\n\n考虑下面的图：\n\n![AVL rotations](img/Image00077.jpg)\n\n\
  假设节点 `75` 是 AVL 树中最后插入的。这会导致树失去平衡（节点 `70` - `Y` 的高度为 `-2`），因此我们需要对其进行平衡处理。以下是执行平衡树的步骤：\n\
  \n*   节点 `X` 将取代平衡因子为 `-2` 的节点 `Y`\n*   节点 `X` 及其右侧子树（节点 `Z` ）将作为节点 `Z` 的左侧子树（注：此处原文可能有笔误，通常应为作为节点\
  \ Y 的右侧子树）\n*   节点 `X` 及其左侧子树将作为节点 `Y` 的右侧子树\n*   节点 `X` 的右孩子将引用节点 `Y`\n*   节点 `X`\
  \ 的左孩子将引用节点 `Z`\n\n所以基本上，我们先执行一次 LL 旋转，然后执行一次 RR 旋转。\n\n下面的代码示例了这一过程：\n\n```javascript\n\
  var rotationRL = function(node) { \n  node.right = rotationLL(node.right); \n  return\
  \ rotationRR(node); \n}; \n```\n\n### 完成 insertNode 方法\n\n在验证树树需要平衡后，我们只需要对每种情况应用正确的旋转。\n\
  \n如果我们在左侧子树中插入一个节点，且该节点的值小于其左孩子的值，则我们将执行 LL 旋转。否则，我们将执行 LR 旋转。这里的代码示例了这一过程：\n\n\
  ```javascript\n//此代码替换 insertNode 方法中的第 {1} 行 \nif ((heightNode(node.left) - heightNode(node.right))\
  \ > 1){ \n  // 执行旋转 {3} \n  if (element < node.left.key){ \n    node = rotationLL(node);\
  \ \n  } else { \n    node = rotationLR(node); \n  } \n} \n```\n\n如果我们在右侧子树中插入一个节点，且该节点的值大于其右孩子的值，则我们将执行\
  \ RR 旋转。否则，我们将执行 RL 旋转。下面的代码示例了这一过程：\n\n```javascript\n//此代码替换 insertNode 方法中的第\
  \ {2} 行 \nif ((heightNode(node.right) - heightNode(node.left)) > 1){ \n  // 执行旋转\
  \ {4} \n  if (element > node.right.key){ \n    node = rotationRR(node); \n  } else\
  \ { \n    node = rotationRL(node); \n  } \n} \n```\n\n## 关于二叉树更多\n\n尽管 AVL 树是一种自平衡树，但有时它在插入或删除节点时的性能并不是最好的。更好的选择是使用红黑树。\n\
  \n红黑树允许对其节点进行高效的中序遍历（[`goo.gl/OxED8K`](http://goo.gl/OxED8K) ）。虽然我们不会在书中介绍这种树，但你可以在书的代码包中找到它的源代码。\n\
  \n如果你想学习更多关于树的知识，还应该查看堆树（[`goo.gl/SFlhW6`](http://goo.gl/SFlhW6) ）。\n\n#### 总结\n\
  \n在本章中，我们涵盖了在二叉搜索树中添加、搜索和删除项目的算法，二叉搜索树是计算机科学中广泛使用的树数据结构。我们涵盖了访问树所有节点的种遍历方法。你还学习了如何开发一种名为\
  \ AVL 树的自平衡树。\n\n在下一章中，我们将学习图的基本概念，它们是\n\n\n\n\n在数据结构中，我们有几种方法来表示图。在现有方案中，没有哪种表示方法是完美的。这取决于你需要解决的问题类型以及图的类型。\n\
  \n#### 邻接矩阵\n\n最常见的实现是邻接矩阵。每个节点都关联一个整数，即数组索引。我们将使用二维数组来表示顶点之间的连通性，如果从索引为 `i` 的节点到索引为\
  \ `j` 的节点有边，则 `array[i][j] = 1`，否则为 `array[i][j] = 0`，如下图所示：\n\n![邻接矩阵](img/Image00082.jpg)\n\
  \n非强连通的图（**稀疏图**）将邻接矩阵中具有许多零元素的矩阵表示。这意味着我们将浪费计算机内存空间来表示不存在的边；例如，如果我们需要找到给定顶点的相邻顶点，即使该顶点只有一个相邻顶点，我们也必须遍历整行。这种方法可能不是良好表示方式的另一个原因是图中的顶点数量可能会发生，而二维数组是不灵活的。\n\
  \n## 邻接表\n\n我们也可以使用动态数据结构来表示图，称为**邻接表**。它由图中每个顶点的相邻顶点列表组成。有几种不同的方法可以表示这种数据结构。为了表示相邻顶点列表，我们可以使用列表（数组）、链表，甚至是哈希映射或字典。下图阐述了邻接表数据结构：\n\
  \n![邻接表](img/Image00083.jpg)\n\n这两种表示方法都有用且具有不同的属性（例如，使用邻接矩阵查找顶点 `v` 和 `w` 是否相邻速度更快），尽管邻接表可能对大多数问题更好。我们将在本书的示例中使用邻接表表示法。\n\
  \n## 关联矩阵\n\n我们还可以使用**关联矩阵**来表示图。在关联矩阵中，矩阵的每行代表一个顶点，每列代表一条边。我们将使用二维数组来表示两个对象之间的连通性，如果顶点\
  \ `v` 关联于边 `e`，则 `array[v][e] = 1`，否则为 `array[v][e] = 0`，如下图所示：\n\n![关联矩阵](img/Image00084.jpg)\n\
  \n当边的数量比顶点多时，关联矩阵通常用于节省空间和内存。\n\n# 创建 Graph 类\n\n和往常一样，我们将声明类的骨架：\n\n```\nfunction\
  \ Graph() { \n  var vertices = []; /{1} \n  var adjList = new Dictionary(); /{2}\
  \ \n} \n```\n\n我们将使用数组来存储图中所有顶点的名称（第 `{1}` 行），并使用字典（在第 7 章 中实现）来存储邻接表（第 `{2}` 行）。字典将顶点名称作为键，并将相邻顶点列表作为值。`vertices`\
  \ 数组和 `adjList` 字典都是 `Graph` 类的私有属性。\n\n接下来，我们将实现两个方法：一个向图中添加新顶点（因为当我们实例化图时，它会创建一个空图），另一个是在顶点之间添加边。让我们先实现\
  \ `addVertex` 方法，如下：\n\n```\nthis.addVertex = function(v){ \n  vertices.push(v);\
  \ /{3} \n  adjList.set(v, []); /{4} \n}; \n```\n\n该方法接收一个顶点 `v` 作为参数。我们将此顶点添加到顶点列表中（第\
  \ `{3}` 行），并通过将顶点 `v` 键的字典值设置为空数组来初始化邻接表（第 `{4}` 行）。\n\n现在，让我们通过以下代码实现 `addEdge`\
  \ 方法：\n\n```\nthis.addEdge = function(v, w){ \n  adjList.get(v).push(w); /{5} \n\
  \  adjList.get(w).push(v); /{6} \n}; \n```\n\n该方法接收两个顶点作为参数。首先，我们通过向 `v` 的邻接列表添加\
  \ `w` 来添加顶点 `v` 到顶点 `w` 的边（第 `{5}` 行）。如果你想实现有向图，第 `{5}` 行就足够。由于我们在本章的大多数示例中处理无向图，我们还需要添加从\
  \ `w` 到 `v` 的边（第 `{6}` 行）。\n\n### 注意\n\n注意，我们只向数组添加新元素，因为我们已经在第 `{4}` 行对其进行了初始化。\n\
  \n让我们测试一下代码，如下：\n\n```\nvar graph = new Graph(); \nvar myVertices = ['A','B','C','D','E','F','G','H','I'];\
  \ /{7} \nfor (var i=0; i<myVertices.length; i++){ /{8} \n  graph.addVertex(myVertices[i]);\
  \ \n} \ngraph.addEdge('A','B'); \ngraph.addEdge('A','C'); \ngraph.addEdge('A','D');\
  \ \ngraph.addEdge('B','E'); \ngraph.addEdge('B','F'); \ngraph.addEdge('C','D');\
  \ \ngraph.addEdge('C','G'); \ngraph.addEdge('D','H'); \ngraph.addEdge('E','I');\n\
  ```\n\n\n\nBFS 和 DFS 算法基本上是相同的，唯一的区别在于用于存储待访问顶点列表的数据结构。请看下表：\n\n| 算法 | 数据结构 | 描述\
  \ |\n| :--- | :--- | :--- |\n| DFS | 栈 (Stack) | 通过将顶点存储在栈中（第 3 章，`Stacks` 中学习过），通过沿着路径冲进来探索顶点，如果有可用的相邻顶点，则访问它。\
  \ |\n| BFS | 队列 (Queue) | 通过将顶点存储在队列中（第 4 章，`Queues` 中学习过），首先探索最旧的未探索顶点。 |\n\n在标记我们已经访问过的顶点时，我们将使用三种颜色来反映它们的状态：\n\
  \n* **白色**：表示该顶点未被访问\n* **灰色**：表示该顶点已访问但尚未被探索\n* **黑色**：表示该顶点已完全探索\n\n这就是为什么正如前面提到的，我们最多必须访问每个顶点两次。\n\
  \n#### 广度优先搜索 (BFS)\n\nBFS 算法从第一个指定的顶点开始遍历图，并首先访问所有的邻居（相邻顶点），一次处理图的一层。换句话说，它是先广度访问顶点，再深度访问顶点，如下图所示：\n\
  \n![广度优先搜索 (BFS)](img/Image00085.jpg)\n\n这些是 BFS 算法遵循的步骤，从顶点 `v` 开始：\n\n1. 创建一个队列\
  \ `Q`。\n2. 将 `v` 标记为已发现（灰色）并将 `v` 入队 `Q`。\n3. 当 `Q` 不空时，执行以下步骤：\n    1. 从 `Q` 中取出\
  \ `u`。\n    2. 将 `u` 标记为已发现（灰色）。\n    3. 将 `u` 的所有未访问（白色）邻居 `w` 入队。\n    4. 将 `u`\
  \ 标记为已探索（黑色）。\n\n让我们按照如下方式实现 BFS 算法：\n\n```javascript\nvar initializeColor = function(){\
  \ \n  var color = []; \n  for (var i=0; i<vertices.length; i++){ \n    color[vertices[i]]\
  \ = 'white'; //{1} \n  } \n  return color; \n}; \n\nthis.bfs = function(v, callback){\
  \ \n\n  var color = initializeColor(), //{2} \n  queue = new Queue();       //{3}\
  \ \n  queue.enqueue(v);              //{4} \n\n  while (!queue.isEmpty()){     \
  \ //{5} \n    var u = queue.dequeue(),        //{6} \n    neighbors = adjList.get(u);\
  \ //{7} \n    color[u] = 'grey';                      //{8} \n    for (var i=0;\
  \ i<neighbors.length; i++){ //{9} \n      var w = neighbors[i];               //{10}\
  \ \n      if (color[w] === 'white'){          //{11} \n        color[w] = 'grey';\
  \              //{12} \n        queue.enqueue(w);               //{13} \n      }\
  \ \n    } \n    color[u] = 'black'; //{14} \n    if (callback) {     //{15} \n \
  \     callback(u); \n    } \n  } \n}; \n```\n\n对于 BFS 和 DFS，我们都需要标记已访问的顶点。为了做到，我们将使用一个名为\
  \ `color` 的 `helper` 数组。当我们开始执行 BFS 或 DFS 算法时，所有顶点的颜色都是 `white`（第 `{1}` 行），因此我们可以创建一个名为\
  \ `initializeColor` 的辅助函数，它将为我们实现的两种算法完成这项工作。\n\n让我们深入 BFS 方法的实现。我们将做的第一件事是使用 `initializeColor`\
  \ 函数将 `color` 数组初始化为 `white` 颜色（第 `{2}` 行）。我们还需要声明并创建一个 `Queue` 实例（第 `{3}` 行），它将存储需要访问和探索的顶点。\n\
  \n按照我们在本章开头解释的步骤，`bfs` 方法接收一个顶点，该顶点将作为我们算法的起点。由于我们需要一个起点，会将该顶点 `enqueue` 到队列中（第\
  \ `{4}` 行）。\n\n如果队列不空（第 `{5}` 行），我们将通过出队从队列中移除一个顶点（第 `{6}` 行），并获取包含其所有邻居的邻接列表（第\
  \ `{7}` 行）。我们还将此顶点标记为 `grey`，意味着我们已经发现了它（但尚未完成对其探索）。\n\n对于 `u` 的每个邻居（第 `{9}` 行），我们将获取它的值（顶点的名称，第\
  \ `{10}` 行），如果它尚未被访问（颜色设置为 `white`，第 `{11}` 行），我们将标记为已发现它（颜色设置为 `grey`，第 `{12}`\
  \ 行），并将此顶点添加到队列中（第 `{13}` 行），以便在我们从队列中 `dequeue` 它时可以完成探索。\n\n当我们完成对该顶点及其相邻顶点的探索时，我们将将其标记为已探索（颜色设置为\
  \ `black`，第 `{14}` 行）。\n\n`bfs` 方法接收一个 `callback`（我们在 第 8 章 中用过），它是可选的。如果我们传递 `callback`，将使用以下代码：\n\
  \n```javascript\nfunction printNode(value){ \n  console.log('Visited vertex: ' +\
  \ value); \n}\n```\n\n如果我们传递 `callback`（第 `{15}` 行），我们将输出：\n\n```javascript\ngraph.bfs(0,\
  \ printNode); //16\n```\n\n输出将是：\n\n```\nVisited vertex: A\nVisited vertex: B\n\
  ...\n```\n这是访问顺序（第 `{17}`).\n\n### 使用 BFS 寻找最短路径\n\n到为止，我们只演示了算法是如何工作的。它可以用于输出访问顺序以外的其他事情。`bfs`\
  \ 方法为我们返回一些信息：\n\n* 从 `v` 到 `u` 的距离 `d[u]`\n* 前驱 `pred[u]`，用于推导出 `v` 到其他顶点的最短路径\n\
  \n让我们看看改进版 `BFS` 方法的实现：\n\n```javascript\nthis.BFS = function(v){ \n\n  var color\
  \ = initializeColor(), \n  queue = new Queue(), \n  d = [], //{1} \n  pred = [];\
  \ //{2} \n  queue.enqueue(v); \n\n  for (var i=0; i<vertices.length; i++){帚 3} \n\
  \    d[vertices[i]] = 0;                //{4} \n    pred[vertices[i]] = null;  \
  \        //{5} \n  } \n\n  while (!queue.isEmpty()){ \n    var u = queue.dequeue(),\
  \ \n    neighbors = adjList.get(u); \n    color[u] = 'grey'; \n    for (i=0; i<neighbors.length;\
  \ i++){ \n      var w = neighbors[i]; \n      if (color[w] === 'white'){ \n    \
  \    color[w] = 'grey'; \n        d[w] = d[u] + 1;           //{6} \n        pred[w]\
  \ = u;               //{7} \n        queue.enqueue(w); \n      } \n    } \n    color[u]\
  \ = 'black'; \n  } \n  return {帚 8} \n  distances: d, \n  predecessors: pred \n\
  \  }; \n}; \n```\n\n## 这个版本的 `BFS` 方法发生了哪些变化？\n\n### 注意\n\n本章的源代码包含两个 `bfs` 方法：`bfs`（我们实现的第一个）和\
  \ `BFS`（改进版）。\n\n\n\n\n当我们发现顶点 `u` 的邻居 `w` 时，我们将 `w` 的前驱值设置为 `u`（第 `{7}` 行），并通过加上\
  \ `1` 以及 `u` 的距离来增加 `v` 与 `w` 之间的距离（第 `{6}` 行）（由于 `u` 是 `w` 的前驱，我们已经有了 `d[u]` 的值）。\n\
  \n方法结束后，我们可以返回一个包含 `d` 和 `pred` 的对象（第 `{8}` 行）。\n\n现在，我们可以再次执行 `BFS` 方法将其将其存储在变量中，如下：\n\
  \n```\nvar shortestPathA = graph.BFS(myVertices[0]); \nconsole.log(shortestPathA);\
  \ \n```\n\n由于我们为顶点 `A` 执行了 `BFS` 方法，控制台的输出将是：\n\n```\n distances: [A: 0, B: 1, C:\
  \ 1, D: 1, E: 2, F: 2, G: 2, H: 2 , I: 3], \npredecessors: [A: null, B: \"A\", C:\
  \ \"A\", D: \"A\", E: \"B\", F: \"B\", G: \"C\", H: \"D\", I: \"E\"] \n```\n\n这意味着顶点\
  \ `A` 到顶点 `B`、`C` 和 `D` 的距离为 `1` 条边；到顶点 `E`、`F`、`G` 和 `H` 的距离为 `2` 条边；到顶点 `I` 的距离为\
  \ `3` 条边。\n\n利用前驱数组，我们可以使用以下代码构建从顶点 `A` 到其他顶点的路径：\n\n```\nvar fromVertex = myVertices[0];\
  \ //{9} \nfor (var i=1; i<myVertices.length; i++){ //{10} \n  var toVertex = myVertices[i],\
  \ //{11} \n  path = new Stack();       //{12} \n  for (var v=toVertex; v!== fromVertex;\
  \ \n  v=shortestPathA.predecessors[v]) { //'13} \n    path.push(v);            \
  \              //{14} \n  } \n  path.push(fromVertex);       //{15} \n  var s =\
  \ path.pop();          //{16} \n  while (!path.isEmpty()){     //{17} \n    s +=\
  \ ' - ' + path.pop(); //{18} \n  } \n  console.log(s); //{19} \n} \n```\n\n我们将使用顶点\
  \ `A` 作为源顶点（第 `{9}` 行）。对于其他每一个顶点（顶点 `A` 外，第 `{10}` 行），我们将计算从顶点 `A` 到该顶点的路径。为此，我们将从\
  \ `vertices` 数组中获取 `toVertex` 的值（第 `{11}` 行），并创建一个栈来存储路径值（第 `{12}` 行）。\n\n接下来，我们将沿着从\
  \ `toVertex` 到 `fromVertex` 的路径（第 `{13}` 行）。变量 `v` 将接收其前驱的值，我们能够反向沿着相同的路径。我们将变量\
  \ `v` 添加到栈中（第 `{14}` 行）。最后，我们将源顶点也添加到栈中（第 `{15}` 行），以获得完整的路径。\n\n之后，我们将创建一个字符串 `s`，并将源顶点赋值给它（这将是最后添加到栈中的顶点，因此它是第一个被弹出的项，第\
  \ `{16}` 行）。当栈不空时（第 `{17}` 行），我们将从栈中移除一个项并将其拼接到字符串 `s` 的现有值上（第 `{18}` 行）。最后（第 `{19}`\
  \ 行），我们只需在浏览器控制台中输出路径。\n\n执行之前的代码后，我们将得到以下输出：\n\n```\n A - B \nA - C \nA - D \n\
  A - B - E \nA - B - F \nA - C - G \nA - D - H \nA - B - E - I \n```\n\n在这里，我们得到了从\
  \ `A` 到图中其他顶点的最短路径（边数）。\n\n### 关于最短路径算法的进一步学习\n\n我们在示例中使用的图不是加权图。如果我们想计算加权图中的最短路径（例如城市\
  \ A 和城市 B 之间的最短路径，这是 GPS 和 Google Maps 使用算法），BFS 并不是指定的算法。\n\n例如，有 `Dijkstra 算法`\
  \ 可以解决单源最短路径问题。`Bellman-Ford 算法` 在边权重为负时解决单源问题。`A* 搜索算法` 使用启发式方法尝试加速搜索，为单对顶点提供最短路径。`Floyd-Warshall\
  \ 算法` 提供了所有顶点对之间的最短路径。\n\n正如本章第一页提到的，图是一个广广泛的主题，我们对最短路径问题及其变体有很多解决方案。然而，在开始学习这些其他解决方案之前，你需要学习图的基本概念，我们已经在本章涵盖了这些内容。书中将不会涵盖这些其他解决方案，但你可以开启自己的冒险去探索奇妙图的世界。\n\
  \n### 探索 DFS 算法\n\n到目前为止，我们仅演示了 DFS 算法是如何工作的。我们可以将其用于比输出访问顶点顺序之外更多的功能。\n\n\n\n\n\
  给定一个图 `G`，DFS 算法遍历 `G` 的所有顶点并构建一个森林（一组`rooted trees`），连同一组源顶点集合（`roots`），并输出两个数组：发现时间（discovery\
  \ time）和完成探索时间（finish explorer time）。我们可以修改 `dfs` 方法来为我们返回一些信息，例如：\n\n*   顶点 `u`\
  \ 的发现时间 `d[u]`\n*   当 `u` 被标记为黑色时的完成时间 `f[u]`\n*   `u` 的前驱节点 `p[u]`\n\n让我们来看看改进后的\
  \ `BFS` 方法的实现：\n\n```\nvar time = 0; /{1} \nthis.DFS = function(){ \n  var color\
  \ = initializeColor(), //{2} \n  d = [],                     \n  f = [],       \
  \             \n  p = []; \n  time = 0; \n\n  for (var i=0; i<vertices.length; i++){\
  \ //{3} \n    f[vertices[i]] = 0; \n    d[vertices[i]] = 0; \n    p[vertices[i]]\
  \ = null; \n  } \n  for (i=0; i<vertices.length; i++){              \n    if (color[vertices[i]]\
  \ === 'white'){       \n      DFSVisit(vertices[i], color, d, f, p); \n    } \n\
  \  } \n  return {           //{4} \n    discovery: d, \n    finished: f, \n    predecessors:\
  \ p \n  }; \n}; \n\nvar DFSVisit = function(u, color, d, f, p){ \n  console.log('discovered\
  \ ' + u); \n  color[u] = 'grey'; \n  d[u] = ++time;     //{5} \n  var neighbors\
  \ = adjList.get(u); \n  for (var i=0; i<neighbors.length; i++){ \n    var w = neighbors[i];\
  \                \n    if (color[w] === 'white'){           \n      p[w] = u;  \
  \                     //{6} \n      DFSVisit(w,color, d, f, p);     \n    } \n \
  \ } \n  color[u] = 'black'; \n  f[u] = ++time;      //{7} \n  console.log('explored\
  \ ' + u); \n}; \n```\n\n由于我们想要跟踪发现时间和完成探索的时间，我们需要声明一个变量来实现此（第 `{1}` 行）。我们不能将 `time`\
  \ 作为参数传递，因为非对象变量无法作为引用传递给其他 JavaScript 方法（将变量作为引用传递意味着如果该变量在另一个方法内部被修改，新值也将反映在原始变量中）。接下来，我们还会声明\
  \ `d`、`f` 和 `p` 数组（第 `{2}` 行）。我们为图的每个顶点初始化这些数组（第 `{3}` 行）。在方法的结束处，我们将返回这些值（第 `{4}`\
  \ 行），以便以后使用它们。\n\n当一个顶点首次被发现时，我们会跟踪它的发现时间（第 `{5}` 行）。当它作为来自 `u` 的边被发现时，我们也跟踪它的前驱（第\
  \ `{6}` 行）。最后，当顶点被完全探索完毕，我们会跟踪它的完成时间（第 `{7}` 行）。\n\nDFS 算法背后的思想是什么？边是从最近发现的顶点 `u`\
  \ 开始探索的。只有指向未访问顶点的边会被探索。当 `u` 的所有边都探索完毕后，算法将回溯到发现顶点 `u` 的其他边。该过程持续直到我们发现从原始源顶点可的所有顶点。如果存在任何未发现的顶点，我们将为新的源顶点重复该过程。我们将重复该算法，直到图中的所有顶点都被探索。\n\
  \n对于改进的 DFS 算法，我们需要检查两点：\n\n*   `time` 变量的值只能是从 1 到图顶点数的两倍之间（`2|V|`）\n*   对于所有顶点\
  \ `u`，`d[u] < f[u]`（这意味着发现时间需要小于完成时间，这反过来意味着所有顶点都已探索完毕）\n\n基于这两个假设，我们有以下规则：\n\n\
  ```\n1 ≤ d[u] < f[u] ≤ 2|V| \n```\n\n如果我们再次对同一个图运行新的 DFS 方法，我们将得到图中每个顶点的以下发现/完成时间：\n\
  \n![Exploring the DFS algorithm](img/Image00088.jpg)\n\n然而，我们能用这些信息做些呢？让我们在下一节中考虑这个问题。\n\
  \n### 使用 DFS 进行拓排序\n\n给定下面的图，假设每个顶点都是你需要执行的任务：\n\n![Topological sorting using DFS](img/Image00089.jpg)\n\
  \n### 注意事项\n\n这是一个有向图，这意味着任务的执行有一个特定的顺序。例如，任务 `F` 不能在任务 `A` 之前执行。请注意，之前的图也没有环，意味着它是一个无环图。因此，我们可以说之前的图是一个`有向无环图`（`DAG`）。\n\
  \n当我们需要指定某些任务或步骤的执行顺序时，被称为拓排序。这仅适用于 DAG。那么，我们如何使用拓排序呢？让我们在开始时执行算法：\n\n```\ngraph\
  \ = new Graph(); \nmyVertices = ['A','B','C','D']; \nfor (i=0; i<myVertices.length;\
  \ i++){ \n  graph.addVertex(myVertices[i]); \n} \ngraph.addEdge('A', 'C'); \ngraph.addEdge('A',\
  \ 'D'); \ngraph.addEdge('B', 'D'); \ngraph.addEdge('B', 'E'); \ngraph.addEdge('C',\
  \ 'F'); \ngraph.addEdge('F', 'E'); \nvar result = graph.DFS(); \n```\n\n这段代码将创建图、应用边、执行\
  \ DFS 并结果存储在 `result` 变量中。下图展示了执行 DFS 后的发现时间和完成时间：\n\n![Topological sorting using\
  \ DFS](img/Image0090.jpg)\n\n现在，我们只需要对完成时间数组进行倒序排序，就可以得到图的拓扑排序，如下：\n\n```\nB - A\
  \ - D - C - F\n```\n\n注意，之前的排序结果只是可能的结果之一。如果我们稍微修改算法，可能会有不同的结果。例如，以下结果是许多结果之一：\n\
  \n```\nA - B - C - D - F\n```\n\n这也是可以接受的结果。\n\n# 最短路径算法\n\n给定一张地图，假设你想通过最短路径从 A\
  \ 点到 B 点。我们可以用这个作为这个问题的例子，从洛杉矶的 **Santa Monica Blvd** 到 **Hollywood Blvd** 的路径，如下所示：\n\
  \n![Shortest path algorithms](img/Image0091.jpg)\n\n这是我们生活中非常常见的问题，我们会使用 *Apple*、*Google\
  \ Maps* 和 *Waze* 等应用来尝试解决它，特别是如果你住在大城市。当然，我们还涉及到其他限制条件，如时间和交通状况，但原始问题仍然是：如何通过最短路径从\
  \ A 到 B？\n\n我们可以使用图来为我们解决这个问题，该算法被称为最短路径。有两个非常著名的算法，分别是 **Dijkstra 算法**和 **Floyd-Warshall\
  \ 算法**，我们将在后续的话题中介绍。\n\n#### Dijkstra 算法\n\nDijkstra 算法是一种`贪心算法`（你可以在第 11 章 中学习更多关于贪心算法的知识）*），用于计算单源到所有其他源之间的最短路径，这意味着可以使用它计算从图顶点到所有其他顶点的最短路径。\n\
  \n考虑下面的图：\n\n![Dijkstra's algorithm](img/Image0092.jpg)\n\n\n\n\n让我们来看看如何找到顶点 `A`\
  \ 到所有其他顶点之间的最短路径。首先，我们需要声明表示前述图的邻接矩阵，如下：\n\n```\nvar graph = [[0, 2, 4, 0, 0, 0],\
  \ \n             [0, 0, 1, 4, 2, 0], \n             [0, 0, 0, 0, 3, 0], \n     \
  \        [0, 0, 0, 0, 0, 2], \n             [0, 0, 0, 3, 0, 2], \n             [0,\
  \ 0, 0, 0, 0, 0]]; \n```\n\n现在，让我们通过以下代码考虑 Dijkstra 算法是如何工作的：\n\n```\nthis.dijkstra\
  \ = function(src){ \n  var dist = [], visited = [], \n  length = this.graph.length;\
  \ \n\n  for (var i = 0; i < length; i++) { //{1} \n    dist[i] = INF; \n    visited[i]\
  \ = false; \n  } \n\n  dist[src] = 0; //{2} \n\n  for (var i = 0; i < length-1;\
  \ i++){ //{3} \n\n    var u = minDistance(dist, visited); //{4} \n\n    visited[u]\
  \ = true; //{5} \n\n    for (var v = 0; v < length; v++){ \n      if (!visited[v]\
  \ && \n      this.graph[u][v]!=0 && dist[u] != INF && \n      dist[u]+this.graph[u][v]\
  \ < dist[v]){ //{6} \n        dist[v] = dist[u] + this.graph[u][v]; //{7} \n   \
  \   } \n    } \n  } \n  return dist; //{8} \n}; \n```\n\n以下是该算法的工作原理：\n\n*   第 `{1}`\
  \ 行：首先，我们需要将所有距离 (`dist`) 初始化为无穷大（JavaScript 最大数字 `INF = Number.MAX_SAFE_INTEGER`），并将\
  \ `visited[]` 初始化为 `false`\n*   第 `{2}` 行：其次，我们将源顶点到其自身的距离设置为 `0`\n*   第 `{3}` 行：然后，我们将为所有顶点寻找最短路径\n\
  *   第 `{4}` 行：为了做到这一点，我们需要从尚未处理的顶点集合中选择一个距离最小的顶点\n*   第 `{5}` 行：我们需要将选定的顶点标记为 `visited`，这样我们就不会进行重复计算\n\
  *   第 `{6}` 行：如果发现更短的路径，我们将设置最短路径的新值（第 `{7}` 行）\n*   第 `{8}` 行：处理完所有顶点后，我们将返回包含从源顶点\
  \ (`src`) 到图中所有其他顶点最短路径值的结果\n\n为了计算中间的 `minDistance`，我们将在 `dist` 数组中搜索最小值，如下所示，并返回包含最小值的数组索引：\n\
  \n```\nvar minDistance = function(dist, visited){ \n  var min = INF, minIndex =\
  \ -1; \n\n  for (var v = 0; v < dist.length; v++){ \n    if (visited[v] == false\
  \ && dist[v] <= min){ \n      min = dist[v]; \n      minIndex = v; \n    } \n  }\
  \ \n  return minIndex; \n}; \n```\n\n如果我们在主题开头介绍的图上执行上述算法，将得到以下输出：\n\n```\n 0  \
  \    0 \n1      2 \n2      3 \n3      6 \n4      4 \n5      6 \n```\n\n### 注意\n\
  也可以修改算法以使其不仅返回最短路径的值，还返回路径本身。\n\n#### Floyd-Warshall 算法\n\nFloyd-Warshall 算法是一种动态规划算法（你将在第\
  \ 11 章“算法模式”中学习更多关于动态规划的内容），用于计算图上所有的最短路径。通过该算法，我们可以找到从所有源点到所有顶点的最短路径。\n\nFloyd-Warshall\
  \ 算法如下：\n\n```\nthis.floydWarshall = function(){ \n  var dist = [], length = this.graph.length,\
  \ i, j, k; \n\n  for (i = 0; i < length; i++){ McCoy1} \n    dist[i] = []; \n  \
  \  for (j = 0; j < length; j++){ \n      dist[i][j] = this.graph[i][j]; \n    }\
  \ \n  } \n\n  for (k = 0; k < length; k++){     //{2} \n    for (i = 0; i < length;\
  \ i++){ \n      for (j = 0; j < length; j++){ \n        if (dist[i][k] + dist[k][j]\
  \ < dist[i][j]){ McCoy3} \n          dist[i][j] = dist[i][k] + dist[k][j]; //{4}\
  \ \n        } \n      } \n    } \n  return dist; \n}; \n```\n\n以下是算法的工作原理：\n\n*\
  \   第 `{1}` 行：首先，我们用图权重初始化距离矩阵\n*   第 `{2}` 行：我们遍历每一个顶点作为中间点\n*   第 `{3}` 行：我们检查通过\
  \ `k` 从 `i` 到 `j` 的路径*第 `{4}` 行：如果发现更短的路径，我们将更新 `dist[i]`\n\n#### 最小生成树 (MST)\n\n\
  最小生成树 (MST) 是图的边的一个子集，它连接所有顶点且无环，并且总权重最小。寻找 MST 有两种主要算法：Prim 算法和 Kruskal 算法。\n\n\
  ### Prim 算法\n\nPrim 算法是一种寻找加权图 MST 的贪心算法。让我们看看它是如何工作的：\n\n```\nthis.prim = function()\
  \ { \n  var parent = [], key = [], visited = []; \n  length = this.graph.length,\
  \ i; \n\n  for (i = 0; i < length; i++){ McCoy1} \n    key[i] = INF; \n    visited[i]\
  \ = false; \n  } \n\n  key[0] = 0;     2} \n  parent[0] = -1; \n\n  for (i = 0;\
  \ i < length-1; i++){3} \n    var u = minKey(key, visited); McCoy4} \n\n    visited[u]\
  \ = true;            5} \n\n    for (var v = 0; v < length; v++){ \n      if (this.graph[u][v]\
  \ && visited[v] == false \n      && this.graph[u][v] < key[v]){ McCoy6} \n     \
  \ parent[v] = u;            7} \n      key[v] = this.graph[u][v]; McCoy8} \n   \
  \   } \n    } \n  } \n  return parent; McCoy9} \n}; \n\nfunction minKey(key, visited){\n\
  \  var min = INF, minIndex = -1, v;\n\n  for (v = 0; v < key.length; v++){ \n  \
  \  if (visited[v] == false && key[v] < min){ \n      min = key[v]; \n      minIndex\
  \ = v; \n    } \n  } \n  return minIndex; \n}\n```\n\n\n\n\n如果我们将 Prim 算法与 Dijkstra\
  \ 算法进行比较，会发现它们非常相似，第 `{7}` 行和 `{8}` 行除外。第 `{7}` 行保留了 `parent` 数组，该数组用于存储最小生成树（MST）。第\
  \ `{8}` 行存储了最小边权值，而在 Dijkstra 算法中，使用的是 `distance` 数组而不是 `key` 数组来存储距离。我们可以修改 Dijkstra\
  \ 算法以以向 `parent` 数组中添加内容，通过这种，我们就可以追踪路径及其距离值。\n\n现在让我们针对以下图表执行上述算法：\n\n```\nvar\
  \ graph = [[0, 2, 4, 0, 0, 0], \n             [2, 0, 2, 4, 2, 0], \n           \
  \  [4, 2, 0, 0, 3, 0], \n             [0, 4, 0, 0, 3, 2], \n             [0, 2,\
  \ 3, 3, 0, 2], \n             [0, 0, 0, 2, 2, 0]]; \n```\n\n我们将得到如下的输出：\n\n```\n\
  \ Edge   Weight \n0 - 1   2 \n1 - 2   2 \n5 - 3   2 \n1 - 4   2 \n4 - 5   2 \n```\n\
  \n#### Kruskal 算法\n\n与 Prim 算法类似，Kruskal 算法也是一种贪心算法，用于寻找连通加权无向图的最小生成树。\n\n让我们通过以下代码考虑\
  \ Kruskal 算法的工作原理：\n\n```\nthis.kruskal = function(){ \n  var length = this.graph.length,\
  \ \n  parent = [], cost, \n  ne = 0, a, b, u, v, i, j, min; \n  cost = initializeCost();\
  \ /{1} \n\n  while(ne<length-1) { /{2} \n\n    for(i=0, min = INF;i < length; i++)\
  \ { /{3} \n      for(j=0;j < length; j++) { \n        if(cost[i][j] < min) { \n\
  \          min=cost[i][j]; \n          u = i; \n          v = j; \n        } \n\
  \      } \n    } \n\n    u = find(u, parent); /{4} \n    v = find(v, parent); /{5}\
  \ \n\n    if (union(u, v, parent)){ /{6} \n      ne++; \n    } \n\n    cost[u][v]\
  \ = cost[v][u] = INF; /{7} \n  } \n  return parent; \n} \n```\n\n以下是该算法工作原理的描述：\n\
  \n* 行 `{1}`：首先，我们将邻接矩阵的值复制到 `cost` 数组中，这样就可以对其修改而不丢失原始值（第 `{7}` 行）。\n* 行 `{2}`：当\
  \ MST 的边数少于总边数减 1 时循环。\n* 行 `{3}`：找到代价最小的边。\n* 行 `{4}` 和 `{5}`：为了避免产生环路，验证该边是否已经在\
  \ MST 中。\n* 行 `{6}`：如果边 `u` 和 `v` 不相同，则将其加入 MST。\n* 行 `{7}`：将边从列表中移除，以便我们不会重复计算。\n\
  * 行 `{8}`：返回 MST。\n\n`find` 函数定义如下。它防止 MST 中产生环路：\n\n```\nvar find = function(i,\
  \ parent){ \n  while(parent[i]){ \n    i = parent[i]; \n  } \n  return i; \n}; \n\
  ```\n\n`union` 函数也在此处给出：\n\n```\nvar union = function(i, j, parent){ \n  if(i !=\
  \ j) { \n    parent[j] = i; \n    return true; \n  } \n  return false; \n}; \n```\n\
  \n该算法还有几种变体可以开发。这取决于用于对边权值排序的数据结构（例如 `Priority Queue`）以及图的表示方式。\n\n# 读累了记得休息一会哦~\n\
