  \n#### 双向链表\n\n链表有不同的类型。在本节中我们将介绍双向链表。双向链表和普通链表的区别在于，在单链表中，我们只建立从一个节点到下一个节点的链接；而在双向链表中，我们双向链接：一个指向下一个元素，另一个指向上一个元素，如下图所示：\n\
