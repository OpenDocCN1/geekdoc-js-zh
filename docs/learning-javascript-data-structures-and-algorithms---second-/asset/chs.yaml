  \ 7 简介\n\n# JavaScript 结构与算法\n\n在本书中，你将学习最常用的数据结构和算法。然而，为什么要用 JavaScript 来学习数据结构和算法呢？我们已经回答了这个问题。JavaScript\
  \ 非常流行，并且适合学习新知识，因为它是一种函数式语言。而且，谁说数据结构和算法只是为 `C` 或 `Java` 等语言设计的？你在开发前端时可能需要实现这些语言。\n\
