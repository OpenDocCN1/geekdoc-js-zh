  \ = null; \n\n    } else { \n\n      while (index++ < position){ // {5} \n\n   \
  \     previous = current; \n        current = current.next; \n      } \n\n     \
  \ // 将前一个项与当前的下一个项连接 - 跳过它\n      previous.next = current.next; // {6} \n      current.next.prev\
