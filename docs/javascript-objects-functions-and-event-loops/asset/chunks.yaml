    Extrapolating from two instance variables, you can see that the chaining setter
    style is advantageous when there are a lot of instance variables and those instance
    variables have default values that seldom need overriding. In that case creating
    a new instance becomes easy.


    Note:


    > Does it bother you to use `Calc.prototype` within the definition of `Calc`?
    It works because, when `Calc` is executed, these things have happened;


    > 1) the callable object `Calc` has been created.


    > 2) an archetypal object has been assigned to `Calc.prototype`.


    As shown on the next page, essentially the same definition works for the pseudo-classes.


    Pseudo-class, chaining setter style


    > `function Calc() { }`


    > `Calc.prototype = {`


    > `   x : 1,`


    > `   y : 1,`


    > `   setX:  function(x) { `


    > `      this.x = x;`


    > `      return this;`


    > `   },`


    > `   setY:  function(y) { `


    > `      this.y = y;`


    > `      return this;`


    > `   },`


    > `   add: function() {`


    > `      return this.x+this.y;`


    > `   },`


