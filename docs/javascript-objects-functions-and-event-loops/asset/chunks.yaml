    \nThe `s` in the first `.catch(s)` will execute causing “bad” to be written on\
    \ the console. The promise p2 will become fulfilled with promise value “badbad”.\n\
    \nThe `s` in the second `.catch(s)` will not execute. The promise p3 will become\
    \ fulfilled with promise value “badbad”.\n\nThe `()=>q` will execute. Promise\
    \ p4 will become rejected with promise value “bad” (the same as `q`'s promise\
    \ value).\n\nThe `s` in the third `.catch(s)` will execute causing `bad` to be\
    \ written on the screen. Promise p5 will become fulfilled with the promise value\
    \ `badbad`.\n\nSo what you will see on the screen is\n\n> `That's All Folks!`\n\
    \n> `bad`\n\n> `bad`\n\nIX. Multitasking Example with Promises\n\nThis section\
    \ is mostly an exercise asking you to rewrite the multitasking exercise in [Section\
    \ VII](#index_split_032.html_filepos59787) with promises. However before you can\
    \ do that, you need a way to generate an initial promise. The `hesitating` factory\
    \ method can do that. It is found in [JavascriptEventLoopTools.js](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/JavascriptEventLoopTools.js).\
    \ You first made use of this file in [Section VI](#index_split_027.html_filepos44854).\n\
    \nThis statement\n\n> `var p = hesitating(``<microseconds>``)`\n\nwill create\
    \ a promise that will wait the specified number of microseconds before becoming\
    \ fulfilled with an `undefined` promise value. While it is waiting, tasks on the\
