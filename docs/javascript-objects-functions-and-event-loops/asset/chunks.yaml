- fmt: "\n![](images/calibre_cover.jpg)\n\n# Javascript: Objects, Functions, and Event\
    \ Loops\n\nby J Adrian Zimmer\n\nAuthor's email: `jazimmer@BonsaiReads.com`.\n\
    \nPublished by [Bonsai Reads](http://BonsaiReads.com) and distributed by Amazon.\n\
    \nCover Design: J Adrian Zimmer\n\nCopyright 2017 by J Adrian Zimmer\n\nAll rights\
    \ reserved. Permission to copy is granted to the purchaser for personal use provided\
    \ purchaser takes reasonable steps to prohibit further copying by others.\n\n\
    Edition: 1.0\n\nThere are two tables of contents. One is an annotated list of\
    \ sections. The other has a listing for every major code segment.\n\n## Annotated\
    \ List of Keywords\n\n### Javascript\nFor Javascript programmers who are ready\
    \ to learn something more about how things work.\n\n### Objects\nJavascript is\
    \ object oriented, but not class oriented.\n\n### Functions\nJavascript functions\
    \ are callable objects.\n\n### Event\nEvents from outside the Javascript system\
    \ cause handler functions to be queued for later execution.\n\n### Event Loop\n\
    Event loop processing chooses queued functions one by one for execution. Functions\
    \ are usually, but not exclusively, queued as a response to an outside event.\n\
    \n### Macrotask queue\nThink of the macrotask queue as the event-handler queue.\n\
    \n### Microtask queue\nThink of the microtask queue as the me-first queue.\n\n\
    ### Promises\nPromises handle asynchronous requests, sequencing follow up actions\
    \ on the me-first queue.\n\n### Pseudo Classes\nJavascript's clever use of `new`\
    \ makes an object-based language look class-based.\n\n## Annotated List of Sections\n\
    \n- **I. Object Inheritance**: A quick look at the role of prototypes in object\
    \ inheritance chains.\n- **II. Functions**: Functions are callable objects which\
    \ inherit their function characteristics.\n- **III. Centering Two Lines of Text**:\
    \ A webpage template for our example scripts.\n- **IV. Event Loops**: Making use\
    \ of an event handler.\n- **V. Multitasking with an Event Loop**: Setting up two\
    \ independent repeating processes.\n- **VI. Multitasking with Event Queuing**:\
    \ Eliminating `setTimeout` from repetitive processes.\n- **VII. Functions as Objects**:\
    \ Adding a state to `writeMessage` and `setColor`.\n- **VIII. Promises**: How\
    \ promises decouple the steps of a process while making use of a me-first queue.\n\
    - **IX. Multitasking Example with Promises**: Independent repeating processes\
    \ with promises.\n- **X. Making Promises**: Two examples in which promises manage\
    \ responses to outside events.\n- **XI. Implementing `hesitating`**: Implementing\
    \ the `hesitating` factory method.\n- **XII. More on Object Orientation in Javascript**:\
    \ How the `new` operator fakes classes.\n\n## Preface\n\n“Javascript: Objects,\
    \ Functions, and Event Loops” is not an introductory book nor does it go into\
    \ lots of detail. Rather it goes into depth about a few concepts whose Javascript\
    \ variations confuse many programmers, namely objects, functions, promises, event\
    \ loop programming, and the way Javascript fakes classes. The intent is to provide\
    \ a solid base on which to continue building your understanding of Javascript.\
    \ To that end, each section contains a single exercise which you should attempt\
    \ before paging ahead to the answer. Even if you do not finish the exercise, the\
    \ attempt will make the answer more meaningful and later sections more intelligible.\n\
    \nIt is assumed that you already know some Javascript and are familiar with class-based\
    \ object orientation as found in languages such as Java and Python.\n\nThis ebook\
    \ has a [Github repository](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/)\
    \ where you can find downloadable copies of the answers to exercises. It also\
    \ contains two useful factory methods.\n\nBe aware that the formatting of scripts\
    \ and interactive sessions in this ebook is not meant to be exemplary. Rather\
    \ it is meant to produce short lines so that the scripts can be read more easily\
    \ on small screens.\n\nYou can recognize interactive sessions because they have\
    \ lines beginning with `>`. They are transcribed from the [Node.js](https://nodejs.org/)\
    \ interpreter but the transcriptions have many appearances of `undefined` removed.\
    \ For example\n\n```\n> var x = 'hi'\n> undefined\n> > console.log(x)\n> hi\n\
    > undefined\n```\n\nis transcribed merely as\n\n```\n> var x = 'hi'\n> > console.log(x)\n\
    > hi\n```\n\nBoth `var` and `console.log` actually return `undefined` but to see\
    \ that in the transcript is confusing because we do not think of them as returning\
    \ anything.\n\n## I. Object Inheritance\n\nA counting object in Javascript might\
    \ be defined this way:\n\n```javascript\nvar counter = {\n  val: 0,\n  incr: function()\
    \ {\n    this.val += 1;\n  }\n}\n```\n\nDo not confuse this with a class. It is\
    \ an object. As you will see `prototype`s become [[Prototype]]s of other objects.\
    \ Many objects have a property named `prototype`. As you will see `prototype`\
    \ becomes [[Prototype]]s of other objects. They are not the [[Prototype]]s of\
    \ the objects to which they belong.\n\nFor example `Object.prototype` becomes\
    \ the last object in the inheritance chains of most other objects. So most objects\
    \ have access to a `toString` method because `toString` is present in `Object.prototype`.\n\
    \nThe `getPrototypeOf` method returns the immediate predecessor of its argument\
    \ in inheritance chain. You can think of this as the “super” object. Often it\
    \ is referred to as the [[Prototype]] of an object.\n\nTo get “own” property names\
    \ means to get the properties that are in the object itself and not those inherited\
    \ from other objects.\n\nJavascript has a built-in object `Object` whose methods\
    \ help manipulate objects. Two example methods are `getOwnPropertyNames` and `getPrototypeOf`.\
    \ When applied to `counter` these produce\n\n```\n> Object.getOwnPropertyNames(counter)\n\
    ['val', 'incr']\n```\n\nand\n\n```\n> var getP = Object.getPrototypeOf;\n> getP(counter)\
    \ === Object.prototype\ntrue\n```\n\nThere are other useful functions in `Object`.\
    \ One I will make use of `Object.create` which can create an empty object that\
    \ has a designated [[Prototype]]. In particular this expression\n\n```\nObject.create(obj)\n\
    ```\n\ncreates a new empty object whose [[Prototype]] is `obj`.\n\n### Question\n\
    \nImplement `counter` as above and then\n\n1. create `counter2` which inherits\
    \ from `counter` and adds a `decr` method which decrements `val` by 1.\n2. check\
    \ to see what each of\n   `Object.getOwnPropertyNames(counter2)`\n   `Object.getOwnPropertyNames(counter)`\n\
    \   returns. The answer isn't completely apparent from what has been said, so\
    \ experiment a bit.\n\n### Answer\n\nCreate `counter2` this way\n\n```javascript\n\
    var counter2 = Object.create(counter);\ncounter2.decr = function() { this.val\
    \ -= 1 }\n```\n\nThe own properties of `counter` are of course\n\n```\n> Object.getOwnPropertyNames(counter)\n\
    ['val', 'incr']\n```\n\nHowever the order in which you see them will be depend\
    \ on how the Javascript engine is implemented.\n\nIf you didn't get two different\
    \ answers for the own properties of `counter2`, you missed something. Things change\
    \ when you execute `incr` or `decr`.\n"
