    \n> `   …  `\n\n> `}`\n\n> \n\n> `f1.que( ``<f1 arg>`` )`\n\nThe `que` method\
    \ wraps each `f`[`i`] in a task with an argument of your choice and places the\
    \ task on the event queue.\n\nNotice that the functions `f1`, `f2`, and `f3` are\
    \ not independent of each other: `f2` is mentioned in `f1` and `f3` in `f2`. This\
    \ can make it hard to reuse these functions for other purposes. For example, it\
    \ will be hard to use `f1` in any setting where it is not followed by `f2`.\n\n\
    Promises allow `f1`, `f2`, and `f3` to be decoupled from each other. The next\
    \ page shows how the decoupling works.\n\n`f1`, `f2`, and `f3` with a promise\n\
    \n> `function f1(``f1 arg``) {`\n\n> `   … `\n\n> `   return ``<f1 return val>``;`\n\
    \n> `}`\n\n> \n\n> `function f2(``<f2 arg>``) {`\n\n> `   … `\n\n> `   return ``<f2\
