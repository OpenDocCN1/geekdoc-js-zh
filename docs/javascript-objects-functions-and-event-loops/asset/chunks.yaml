    \ and its promise value will be the same as the previous value.\n\nPrevious promise\
    \ rejected, `p[i]` from `catch`:\n\nIn this case `f[i]` will be wrapped for execution;\
    \ its argument will be previous promise value; `p[i]` will be fulfilled or rejected\
