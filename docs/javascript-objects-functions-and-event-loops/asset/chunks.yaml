  trans: "\n第二个示例也要求你拥有一个可以提供 `Sample.txt` 的运行 Web 服务器。从理论上讲，你可以直接从 Github 获取 `Sample.txt`，但跨源安全限制阻止了这种操作。执行\
    \ `$.ajax` 练习最简单的方法是将 `Sample.txt` 和你的 HTML 页面放在电脑的同一个文件夹中，并建立你自己的 Web 服务器。你可以通过\
    \ Node.js 的 `http-server` 模块轻松实现这一点。使用 Node.js 的 `npm` 安装 `http-server`，然后在包含\
    \ `Sample.txt` 的文件夹中运行它。请确保你任何想要私密的内容都不会通过该文件夹访问。\n\n注意：\n> 如果你不想安装这些东西，你始终可以使用纸和笔来回答本节的问题。这是唯一一个你需要安装这些工具的章节。\n\
    \n## 读取文件\n\n在 Node.js 中，你可以通过这种方式异步读取文件：\n\n```javascript\nvar fs = require('fs');\n\
    fs.readFile('Sample.txt','utf8',callback)\n```\n\n其中 `callback` 已定义用于处理读取失败和成功的情况，如下：\n\
    \n```javascript\nfunction callback(err,data) {\n  if(err)    \"handle error with\"\
    \ err\n  then        \"handle success with\" data\n}\n```\n\n你的操作系统是一个外部力量，使用\
    \ `readFile` 的脚本必须等待它。脚本可以阻塞直到读取操作完成（如果是 `readFileSync` 则会如此），或者可以像上面使用 `readFile`\
    \ 那样利用回调函数。使用 `readFile` 正好符合 promise 执行器（executor）的场景。下一页将展示如何为此操作。\n\n### 使用\
    \ promise 读取。\n\n```javascript\nvar p = new Promise(\n    function (resolve,reject)\
    \ {\n      function callback(err,txt) {\n        if(err)    reject(err)\n    \
    \    then        resolve(txt)\n      }\n      fs.readFile(\n        'Sample.txt',\n\
    \        'utf8',\n        callback\n      )\n    }\n)\n```\n\n注意，我没有尝试在回调中处理文本或错误消息。我正让\
    \ promise 将该处理过程与此请求解耦。给定这些显示错误和文件内容的函数：\n\n```javascript\nfunction showError(e)\
    \ {\n  console.log(\n      \"ERROR:\\n\" + e\n  )\n}\n\nfunction showText(t) {\n\
    \  console.log(t)\n}\n```\n\n这里是处理处理的一种方式：\n\n```javascript\np.then(showText).catch(showError);\n\
    ```\n\n这是另一种方式：\n\n```javascript\np.catch(showError).then(showText);\n```\n\n\
    区别在于，使用第二种方法时，在将文本写入控制台时抛出的任何错误都不会被处理。\n\n注意：\n> 你可能认为 `showText` 不是需要的，因为它可以被\
    \ `console.log` 替换。但 Node.js 的怪癖之一就是这种做法并不总是有效。\n\n## Ajax\n\n可以使用 JQuery 的 `ajax`\
    \ 方法在万维网上进行简单的信息请求，如下所示。\n\n### 一个 ajax 请求\n\n```javascript\n$.ajax({\n  url:\
    \ \"Sample.txt\", \n  success: \"function to process text\"\n  error: \"function\
    \ to process error object\"\n});\n```\n\n我将把此放入一个网页中，当用户点击按钮时请求文件 `Sample.txt`。对于在第三节中显示的模板，需要进行两个微调：\n\
    \n1. 需要一个按钮。将此 `<button id='aButton'>Explain Things</button>` 插入到 `upper` `div`\
    \ 中。\n2. 获取的文本可能需要比页面的一半更多的空间。通过将 `upper` 的下边距改为 80%，并将 `lower` 的上外边距改为 22%，来将内容向上移动。\n\
    \n2% 的间隙为按钮在文本开始前留出了空间。\n\n## 问题\n\n填入\n\n```html\nLOAD SCRIPTS HERE\n```\n\n\
    以及\n\n```html\nINCLUDE SCRIPT HERE\n```\n\n使得网页在用户点击按钮时，会（通过 `$.ajax`）获取并显示 `Sample.txt`。\n\
    \n请注意，你想让 `aButton` 监听器响应的是 `'click'` 事件。你的响应应该创建一个带有 `then/catch` 链的适当 promise。如果报告了错误，你可以从错误事件的\
    \ `statusText` 属性中提取错误消息。\n\n在用户点击按钮之前，你可以在页面上写任何内容。这是一个练习，而不是试图定义生产代码。我忽略了一些重要的事情，例如如何让用户指定文件名以及如果网络请求超时该怎么办，我将\
    \ `Sample.txt` 硬编码在脚本中。如果你想测试错误，请重命名文件。\n\n### 答案\n\n假设第三节中的 HTML 显示已按上述方式进行了微调，答案是：\n\
    \n```html\nLOAD SCRIPTS\n<script type=\"text/javascript\" src=\"JavascriptLoopTools.js\"\
    ></script>\nINCLUDE SCRIPT HERE\n```\n\n```javascript\nfunction writeMessage(txt)\
    \ {\n  document.getElementById('lower').innerText = txt;\n}\n\ndocument.getElementById('aButton').addEventListener('click',\
    \ function() {\n  var p = new Promise(\n    function(resolve,reject) {\n     \
    \ $.ajax({\n        url: \"Sample.txt\", \n        success: resolve,\n       \
    \ error: reject \n      })\n    }\n  );\n  p.then(writeMessage).catch(err => writeMessage(err.statusText))\n\
    })\n```\n\n完整的答案位于 [Display7.html](https://github.com/Adrian-Zimmer/JavascriptObjectsAndEventLoops/master/Display7.html)。\n\
    \n## XI. 实现 hesitating\n\n在本节描述的 `hesitating` 工厂方法用于第九节中的练习以实现 promise。那里只使用了一个参数，但\
    \ `hesitating` 可以接受两个参数：第一个是创建 promise 完成之前等待的微秒数，第二个可选参数是要传递给完成 promise 的值。特别是，这个参数我在第八节](#index_split_06.html_filepos6678)中忽略的\
    \ `arg1`。\n\n如果你读到了这里，你应该能够自己实现 `hesitating` 工厂方法。\n\n### 问题\n\n这是 `hesitating`\
    \ 脚本的开始部分：\n\n```javascript\nfunction hesitating(\n  micros,    // 微秒数，\n  //\
    \ 返回的 promise 在完成前等待\n  // 如果未省略则为 0\n  promise_val  // 返回 promise 的值\n  // 如果未省略\n\
    ) {\n  // 返回一个 promise，它在等待指定的微秒数后\n  // 使用给定的 promise 值进行解析——允许任务\n  // 在事件队列中执行，以便在\
    \ settle 影响发生之前\n  micros = micros || 0;\n  … \n);\n}\n```\n\n完成该实现。你可以通过将 Display6.html\
    \ 中的内容来测试你的答案：\n\n```html\n<script type=\"text/javascript\" src=\"JavascriptLoopTools.js\"\
    ></script>\n```\n\n替换为：\n\n```html\n<script type=\"text/javascript\">你的 hesitating\
    \ 定义\n</script>\n```\n\n### 答案\n\n此答案也出现在 `JavascriptLoopTools.js` 文件中。\n\n```javascript\n\
    function hesitating(\n  micros,    // 微秒数\n  // 返回的 promise 在完成前等待\n  // 如果未省略则为\
    \ 0\n  promise_val  // 返回 promise 的值\n  // 如果未省略\n) {\n  // 返回一个 promise，它在等待指定的微秒数后\n\
    \  // 使用给定的 promise 值进行解析——允许任务\n  // 在事件队列中执行，以便在 settle 影响发生之前\n  micros = micros\
    \ || 0;\n  return new Promise(\n    function(resolve) {\n      setTimeout( \n\
    \        resolve(promise_val)\n      , micros)\n    }\n  );\n}\n```\n\n"
- fmt: "\n# XII. More on Object Orientation in Javascript\n\nObject orientation involves\
    \ defining kinds of objects and then creating working objects that match those\
    \ definitions. The working objects are usually called instances. Object orientation\
    \ also involves some kind of inheritance in which there can be refinements of\
    \ existing kinds of objects.\n\nTraditional languages like `Java` and `Python`\
    \ have a concept of a class that is used for defining kinds of objects. An instance\
    \ is constructed from a class and linked to that class. Javascript is different:\
    \ kinds of objects are defined by example. That is to say you define a prototype\
    \ object and instances are just new objects that inherit from the prototype.\n\
    \nWith the class-based approach it is classes that do the inheriting. With the\
    \ object-based approach it is objects that do the inheriting. Whether object based\
    \ or class based the rules that inheritance follows are pretty much the same.\n\
    \nIn [Section I](#index_split_005.html_filepos8396) and [Section II](#index_split_008.html_filepos15555)\
    \ you saw two built-in `prototype` objects, `Object.prototype` and `Function.prototype`.\
    \ Those prototypes provide services to all objects and/or functions. I use the\
    \ word archetype for prototypes which define a kind of object that programmers\
    \ define for their own use. The next page shows an example of an archetype with\
    \ two instance variables and two methods.\n\n## An archetype\n\n```javascript\n\
    var archetype = { \n    x : 1,\n    y : 1,\n    add: function() {\n      return\
    \ this.x+this.y;\n    },\n    double: function() { \n      this.x = 2*this.x;\n\
    \      this.y = 2*this.y\n    }\n};\n```\n\nOK, it is a silly example but clear\
    \ your mind of that and realize this is an object not a class. Archetypes are\
    \ not meant to be used directly. Instances that inherit from them are constructed\
    \ instead. Inheritance lets the archetype be an unchanging template for all instances\
    \ of the same kind, that is to say all objects that directly inherit from the\
    \ archetype. The unchanging aspect is what makes the archetype a reliable description\
    \ of a kind of object.\n\nIn `Java` and `Python`, when a class is meant to have\
    \ just one instance, it is said to be a singleton. This is a little weird as it\
    \ is like defining a whole subspecies to describe your dog “Rover”. Rover would\
    \ be the single instance of that subspecies or class. In Javascript you merely\
    \ describe Rover and dispense with the subspecies. Said another way: in Javascript\
    \ you describe a single object and dispense with the idea of an archetype. There\
    \ is no need for the concept of singleton in Javascript. Such things are merely\
    \ objects.\n\nWhen archetypes are used to describe kinds of objects, it is the\
    \ `create` method discussed in [Section I](#index_split_005.html_filepos8396)\
    \ that creates instances. For example new instances `obj1` and `obj2` of `archetype`\
    \ can be created this way:\n\n```javascript\nvar obj1 = Object.create(archetype),\n\
    \    obj2 = Object.create(archetype);\n```\n\nBecause of the way inheritance works\
    \ `obj1` and `obj2` are independent of each other. Changes to one do not impact\
    \ the other. The first time `obj1.double()` or `obj2.double()` executes the inheritance\
    \ search for values of `x` and `y` will take 1 from `archetype.x` and `archetype.y`.\
    \ However the doubled values will not be assigned to the same `x` and `y` because\
    \ there is no inheritance search when assigning a value. Instead new properties\
    \ of `x` and `y` will be created in `obj1` or `obj2` and given the doubled values.\
    \ From then on each instance is on its own.\n\nIn this example `obj1` and `obj2`\
    \ are initialized with the same starting values. If they are to be initialized\
    \ with different starting values, a constructor would be useful. A constructor\
    \ is a function that:\n\n1. creates a new object.\n2. initializes the instance\
    \ variables of the newly created object.\n\nOf course `Object.create` can perform\
    \ the first step, but to get both steps we need to write our own constructor function.\
    \ The next page shows one way to do this.\n\n## Archetypal construction\n\n```javascript\n\
    function Calc(x,y) {\n    var obj = Object.create(archetype);\n    obj.x = x;\n\
    \    obj.y = y\n    return obj;\n}\n```\n\nThis is a complete constructor. An\
    \ instance can be created this way `var obj = Calc(2,-3)`. This function may seem\
    \ more like a factory method to you than a constructor because it makes no use\
    \ of `this`. I think of it as a constructor because it is meant to create an specialized\
    \ instance. If writing constructors without `this` or `self` disturbs you, you\
    \ can make use of Javascript's `new` operator whose purpose is to fake class-based\
    \ orientation. With `new` you can define your constructor this way and your methods\
    \ as shown below.\n\n### Pseudo-class construction\n\n```javascript\nfunction\
    \ Calc(x,y) {\n    this.x = x;\n    this.y = y;\n}\nCalc.prototype = {\n    add:\
    \ function() {\n      return this.x + this.y\n    },\n    double: function() {\
