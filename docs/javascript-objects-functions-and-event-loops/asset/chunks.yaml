    \ the next exercise.\n\nQuestion\n\nRedo the multitasking exercise in [Section\
    \ VII](#index_split_032.html_filepos59787). Fill in\n\n> LOAD SCRIPTS HERE\n\n\
    and\n\n> INCLUDE SCRIPT HERE\n\nsuch that the event queuing methodology is replaced\
    \ with promises.\n\nAnswer\n\nNo need to install anything in `Function.prototype`\
    \ here. Instead `hesitating` is used in both `writeMessage` and `setColor`.\n\n\
    LOAD SCRIPTS HERE\n\n> `<script type=\"text/javascript\"`\n\n> `        src=\"\
    JavascriptEventLoopTools.js\">`\n\n> `</script>`\n\nINCLUDE SCRIPT HERE\n\n> `var running = true;`\n\
    \n> \n\n> `// Stateful writeMessage`\n\n> \n\n> `function writeMessage() {`\n\n\
    > `   if( !running ) return;`\n\n> `   var ms = writeMessage.messages,`\n\n> `       i = 2*writeMessage.which;`\n\
    \n> `   writeMessage.which = (writeMessage.which+1)%3;`\n\n> `   document.getElementById('upper').innerText = ms[i];`\n\
    \n> `   document.getElementById('lower').innerText = ms[i+1];`\n\n> `   hesitating(1500).then(writeMessage)   // repeating`\n\
    \n> `}`\n\n> \n\n> `writeMessage.messages = [`\n\n> `   \"Politicians and diapers should be changed frequently\"\
    ,`\n\n> `   \"and for the same reason.\",`\n\n> `   \"Actions speak louder than words\"\
    ,`\n\n> `   \"but not nearly as often.\",`\n\n> `   \"Don't let schooling interfere\"\
    ,`\n\n> `   \"with your education\"`\n\n> `];`\n\n> `writeMessage.which = 0;`\n\
    \n> \n\n> `// Stateful setColor`\n\n> \n\n> `function setColor() {`\n\n> `   if( !running ) return;`\n\
    \n> `   var cs = setColor.colors,`\n\n> `       i = setColor.which;`\n\n> `   setColor.which = (setColor.which+1)%3;`\n\
    \n> `   document.bgColor = cs[i];`\n\n> `   hesitating(850).then(setColor)   // repeating`\n\
    \n> `}`\n\n> \n\n> `setColor.colors = [ \"BBFFFF\", \"FFBBFF\", \"FFFFBB\" ];`\n\
    \n> `setColor.which=0;`\n\n> \n\n> `// Keystroke Event Handler`\n\n> \n\n> `document`\n\
    \n> ` .addEventListener(`\n\n> `   'keydown',`\n\n> `   function (e) {`\n\n> `     if( e.code=='Escape' ) {`\n\
    \n> `        running = false;`\n\n> `     } `\n\n> `   }`\n\n> ` );`\n\n> \n\n\
    > `// Start`\n\n> \n\n> `writeMessage();`\n\n> `setColor();`\n\nThe complete HTML\
    \ is available as [Display6.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display6.html)\n\
    \nX. Making Promises\n\nYou saw in [Section VIII](#index_split_036.html_filepos66178)\
    \ how to use existing promises to decouple a chain of actions from each other.\
    \ Another important use of promises is to make a request of an outside force.\
    \ Making the request and channeling the response to a `then/catch` chain is the\
    \ job of the script which creates the promise.\n\nHere is how promises are created\n\
    \n> `var p = new Promise(e)`\n\nwhere `e` is a function called an executor. I\
    \ distinguish executors from functions passed to `then` and `catch` by calling\
    \ those functions responders.\n\nI'll first show how this works without the outside\
    \ force: an executor takes two arguments, both functions, as in\n\n> `function e(resolve,reject) { … }`\n\
    \nThis executor\n\n> `new Promise(`\n\n> `  function f(resolve,reject) { `\n\n\
    > `     resolve('hi');`\n\n> `})`\n\ncreates a promise which quickly settles with\
    \ a fulfilled promise value of `'hi'`. Similarly this executor\n\n> `new Promise(`\n\
    \n> `  function f(resolve,reject) { `\n\n> `     reject('bad juju');`\n\n> `})`\n\
    \ncreates a promise which quickly settles with a rejected promise value of “bad\
    \ juju”.\n\nTo demonstrate how to create a promise whose settling will depend\
    \ on a response from an outside force I will continue with two examples of outside\
    \ forces\n\n1.  Node.js's run-time system which (in conjunction with your computer's\
    \ operating system) can provide a file's contents.\n\n2.  JQuery's `$.ajax` function\
    \ which (in conjunction with your browser, your computer's operating system, a\
    \ server, and a network) can provide the response to a request made to a server.\n\
    \nBoth these examples will involve displaying a file `Sample.txt`. [Node.js](https://nodejs.org/),\
    \ which the first example requires, is a Javascript interpreter that lacks access\
    \ to a browser's DOM and but has file read/write capability.\n\nJQuery, which\
    \ the second example requires, can be loaded into your browser with an HTML `script`\
    \ tag this way\n\n> `<script`\n\n> `src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
    >`\n\n> `</script> `"
