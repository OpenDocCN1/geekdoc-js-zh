    \nLater promise p2 will become fulfilled with promise value `'good'`. The `s`\
    \ in `.catch(s)` will not execute.\n\nYet later the `s` in `.then(s)` will execute\
    \ causing “good” to be written. Promise p3 will become fulfilled with promise\
    \ value\n\n> `'goodgood'`\n\nSo what you will see on the screen is\n\n> `That's All Folks!`\n\
    \n> `good`\n\nQuestion: Part b\n\nWhat be written on the console and what will\
    \ happen to p1, p2, and p3 if the following executes?\n\n> `q                  // p1`\n\
    \n> ` .catch(s)         // p2`\n\n> ` .catch(s)         // p3`\n\n> ` .then( () => q )  // p4`\n\
    \n> ` .catch(s)         // p5`\n\n> `console.log(\"That's All Folks!\")`\n\nAnswer:\
