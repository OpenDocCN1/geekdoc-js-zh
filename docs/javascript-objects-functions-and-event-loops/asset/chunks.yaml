    be assigned to the same `x` and `y` because there is no inheritance search when
    assigning a value. Instead new properties of `x` and `y` will be created in `obj1`
    or `obj2` and given the doubled values. From then on each instance is on its own.


    In this example `obj1` and `obj2` are initialized with the same starting values.
    If they are to be initialized with different starting values, a constructor would
    be useful. A constructor is a function that


    1.  creates a new object.


    2.  initializes the instance variables of the newly created object.


    Of course `Object.create` can perform the first step, but to get both steps we
    need to write our own constructor function. The next page shows one way to do
    this.


