    \ setter style\n\n```javascript\nfunction Calc() {\n    return Object.create(\n\
    \        Calc.prototype\n    )\n}\nCalc.prototype = {\n    x : 1,\n    y : 1,\n\
    \    setX:  function(x) { \n      this.x = x;\n    }\n};\n```\n"
