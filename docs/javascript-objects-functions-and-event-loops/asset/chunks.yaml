- fmt: "\nI will describe another function such as this\n\n```\nfunction t() { f(2,2)\
    \ }\n```\n\nas a task. Tasks take no arguments and return no values. They can\
    \ be stored for later execution. In fact they often exist just to set up delayed\
    \ execution of another function. A sequence of tasks can be queued and then executed\
    \ one after the other without necessarily influencing each other.\n\nIn the example\
    \ just given, the function `f` is said to be wrapped in the task `t`.\n\nAn event\
    \ loop is a run-time system that takes tasks from a queue and executes them. Each\
    \ task executes to completion before the next is executed.\n\nOf course the rest\
    \ of the world does not stand still while a task is executing. Incoming data arrives.\
    \ Mouse clicks happen. Such things are the result of outside forces. They are\
    \ events. Event loop systems have a mechanism for handling events without having\
    \ any effect on the currently executing task. When the event-loop system becomes\
    \ aware of an event, it wraps an event handler with an argument describing the\
    \ event into a task and enqueues that task. To do this, the system interrupts\
    \ the currently executing task. A task can be interrupted and restarted without\
    \ being aware that the interruption has occurred. Actual processing of an event\
    \ is left for a subsequent task.\n\n### Note\n> Of course an interruption may\
    \ not be necessary on a multi-processor system but most software systems do not\
    \ seem to have caught up with hardware in this respect.\n\nI will use `addEventListener`\
    \ to add listeners to a running Javascript session. The next page shows an example.\
    \ Listeners are normally defined anonymously but in the following example I use\
    \ the name `aHandler` so I can talk about the listener being added.\n\n### Example\
    \ of adding a listener\n\n```javascript\ndocument\n.addEventListener(\n    \"\
    click\",\n    function aHandler (event) {\n      console.log(\n          event.pageX,\n\
    \          event.pageY\n      )\n    }\n  )\n```\n\nAfter this, whenever a click\
    \ event happens the run-time system creates an event object `E` and wraps `aHandler`\
    \ with it this way\n\n```javascriptfunction() { aHandler(E) }\n```\n\nThe task\
    \ is then enqueued.\n\nFor a mouse click, `E`'s content will include the screen\
    \ coordinates `pageX` and `pageY` of the place where the mouse was when the click\
    \ happened.\n\nThe queue where such tasks wait for execution is usually called\
    \ an event queue. But event queues may contain tasks that do not handle actual\
    \ events. In an acknowledgement of this, Javascript documentation writes “macrotask\
    \ queue” instead of “event queue”.\n\n### Note\n> For those who would look this\
    \ up know that, for silly trademark reasons, official Javascript documentation\
    \ describes “ECMAScript” not “Javascript”.\n\n### Question\nFrom [Section III](#index_split_014.html_filepos24867),\
    \ fill in\n\nLOAD SCRIPTS HERE\n\nand\n\nINCLUDE SCRIPT HERE\n\nsuch that, when\
    \ there is a mouse click over the screen, the display lines will be:\n\n`X coordinate:\
    \ \"the X coordinate where the mouse clicked\"`\n`Y coordinate: \"the Y coordinate\
    \ where the mouse clicked\"`\n\nUse `writeMessage` from [Section III](#index_split_014.html_filepos24867)\
    \ to create the splash page (i.e. the initial screen) with\n\n`writeMessage('Click','someplace');`\n\
    \n### Answer\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE SCRIPT HERE\n\n```javascript\n\
    function writeMessage(line1,line2) {\n    document.getElementById('upper').innerText\
    \ = line1;\n    document.getElementById('lower').innerText = line2;\n}\n\ndocument\n\
    .addEventListener(\n    \"click\",\n    function aHandler (event) {\n      writeMessage(\n\
    \          'X coord: ' + event.pageX,\n          'Y coord: ' + event.pageY\n \
    \     )\n    }\n  )\n\nwriteMessage('Click','someplace');\n```\n\nThe complete\
    \ HTML is available at [Display2.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display2.html)\n\
    \n## V. Multitasking with an Event Loop\n\nIn Javascript when you want to put\
    \ your own task on the event queue, you use the `setTimeout` function. Essentially\
    \ what you are doing is enqueuing a handler for a timing event. For example, to\
    \ cause a function `f` to be applied to arguments `\"one\"` and `\"two\"` after\
    \ 5 seconds have elapsed you would write\n\n```javascript\nsetTimeout(\n    function()\
    \ { f(\"one\",\"two\") },\n  5000\n)\n```\n\nThis creates an anonymous task that\
    \ goes on the event queue after 5000 milliseconds.\n\n### Note\nReplace 5000 with\
    \ 0 if you want the task to go on the queue immediately but remember that being\
    \ immediately on the event queue is not the same as executing.\n\nThe following\
    \ page shows what you could write to repeat a task `t` every half second using\
    \ the event queue for repetition.\n\n```javascript\nfunction t() {\n  …\n  setTimeout(\n\
    \    function() { t() },\n    0\n  )\n}\n```\n\nThis looks recursive but it is\
    \ not. Recursive functions call themselves as they would any other function and\
    \ remain ready to continue when the called function returns. The kind of repetition\
    \ `t` shows is different. Instead of calling itself, `t` finishes executing having\
    \ arranged for the Javascript engine to do the calling. Each execution of `t()`\
    \ returns to the same place in the event loop where another task will be chosen\
    \ for execution.\n\nBefore asking this section's question I want to provide you\
    \ with some data. The next page shows three messages attributed to Mark Twain\
    \ and an array of color. You will use them in answer.\n\n### Messages and Colors\n\
    ```javascript\nvar messages = [\n    \"Politicians and diapers\" + \"should be\
    \ changed frequently\",\n    \"and for the same reason.\",\n    \"Actions speak\
    \ louder than words\",\n    \"but not nearly as often.\",\n    \"Don't let schooling\
    \ interfere\",\n    \"with your education\"\n],\n  colors = [\"BBFFFF\", \"FFBBFF\"\
    , \"FFFFBB\"];\n```\n\n### Question\nFill in\n\nLOAD SCRIPTS HERE\n\nand\n\nINCLUDE\
    \ SCRIPT HERE\n\nsuch that the display rotates through the three-line messages\
    \ in `messages` and the background color through the three choices in `colors`.\
    \ These rotations should be independent of each other with the message changing\
    \ approximately 1500 milliseconds and the background color changing approximately\
    \ 850 milliseconds.\n\n### Answer\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE SCRIPT\
    \ HERE\n\n```javascript\nvar messages = [\n    \"Politicians and diapers should\
    \ be changed frequently\",\n    \"and for the same reason.\",\n    \"Actions speak\
    \ louder than words\",\n    \"but not nearly as often.\",\n    \"Don't let schooling\
    \ interfere\",\n    \"with your education\"\n];\nvar colors = [ \"BBFFFF\", \"\
    FFBBFF\", \"FFFFBB\" ];\n\nfunction writeMessage(which) {\n  document.getElementById('upper').innerText\
    \ = messages[2*which];\n  document.getElementById('lower').innerText = messages[2*which+1];\n\
    \  setTimeout(\n    function () { \n      writeMessage( (which+1)%3 )\n    },\n\
    \    1500\n  )\n}\n\nfunction setColor(which) {\n  document.bgColor = colors[which];\n\
    \  setTimeout(\n    function () {\n      setColor( (which+1)%3 )\n    },\n   \
    \ 850\n  )\n}\n\nwriteMessage(0);\nsetColor(0);\n```\n\nThe complete HTML is available\
    \ at [Display3.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display3.html)\n\
    \n## VI. Multitasking with Event Queuing\n\nEvent queuing is a name I give to\
    \ a technique that simplifies writing the kind of script you wrote in the previous\
    \ section's exercise. Event queuing replaces `setTimeout` with single-purpose\
    \ function that can wrap and queue other functions. Suppose this\n\n```javascript\n\
    function f(x,y) { return x+y }\n```\n\nwere the function to be wrapped. Instead\
    \ of doing it this way\n\n```javascript\nsetTimeout(\n    function() { f(2,2)\
    \ },\n  0\n);\n```\n\nevent queuing does it this way\n\n```javascript\nf.que(2,2)\n\
    ```\n\nThe syntax is pleasingly similar to\n\n`f(2,2)`\n\nbut the effect is the\
    \ same as with `setTimeout`.\n"
