    > `}`


    > `Calc.prototype.add = function() {`


    > `                           return this.x+this.y;`


    > `                        };`


    > `Calc.prototype.double = function () {`


    > `                           this.x = 2*this.x;`


    > `                           this.y = 2*this.y`


