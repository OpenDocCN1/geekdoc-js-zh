  trans: "\n\n# XII. 深入理解 Javascript 面对象\n\n面向对象涉及定义各种类型的对象，然后创建匹配这些定义的运行对象。这些运行对象通常被称为实例。面向对象还涉及某种形式的继承，即对现有的对象类型进行改进。\n\
    \n`Java` 和 `Python` 等传统语言具有“类”（class）的概念，用于定义对象的类型。实例由类构造并与该类关联。Javascript 则不同：对象的类型是通过示例来定义的。也就是说，你定义了一个原型对象（prototype\
    \ object），而实例只是继承自该原型的新对象。\n\n在基于类的方法中，是由类进行继承。在基于对象的方法中，是由对象进行继承。无论是基于对象还是基于类，继承遵循的规则基本相同。\n\
    \n在第一节和第二节中，你看到了两个内置的 `prototype` 对象：`Object.prototype` 和 `Function.prototype`。这些原型为所有对象和/或函数提供服务。我使用“原型”（archetype）一词来指代程序员为自己的使用而定义的某种对象的原型。下一页显示了一个带有两个实例变量和两个方法的原型示例。\n\
    \n## 原型\n\n```javascript\nvar archetype = { \n    x : 1,\n    y : 1,\n    add:\
    \ function() {\n      return this.x+this.y;\n    },\n    double: function() {\
    \ \n      this.x = 2*this.x;\n      this.y = 2*this.y\n    }\n};\n```\n\n好了，这是一个愚蠢的例子，但请忘掉它，意识到这是一个对象而不是一个类。原型并不是为了直接使用的。相反，构造的是继承自它们的实例。继承让原型成为所有同类实例的不可改变的模板，也就是说，即所有直接继承自该原型的对象。这种不变性使得原型成为对对象类型的可靠描述。\n\
    \n在 `Java` 和 `Python` 中，当一个类被认为只有一个实例时，它被称为“单例”（singleton）。这有点奇怪，因为就像是为了描述你的你的狗“Rover”而定义了一个整个亚种。Rover\
    \ 将是该亚种或该类的唯一实例。在 Javascript 中，你只需要描述 Rover 并省去亚种的概念。换句话说：在 Javascript 中，你描述单个对象并抛弃原型的概念。Javascript\
    \ 中不需要单例的概念。这些东西仅仅是对象。\n\n当使用原型来描述对象类型时，是由第一节中讨论的 `create` 方法创建实例的。例如，可以这样方式创建\
    \ `archetype` 的新实例 `obj1` 和 `obj2`：\n\n```javascript\nvar obj1 = Object.create(archetype),\n\
    \    obj2 = Object.create(archetype);\n```\n\n由于继承的工作方式，`obj1` 和 `obj2` 彼此是独立的。对其中一个的修改不会影响另一个。当第一次执行\
    \ `obj1.double()` 或 `obj2.double()` 时，对 `x` 和 `y` 值的继承搜索将从 `archetype.x` 和 `archetype.y`\
    \ 取值 1。然而，翻倍后的值不会被赋值给同一个 `x` 和 `y`，因为在赋值值时不会进行继承搜索。相反，将在 `obj1` 或 `obj2` 中创建新的\
    \ `x` 和 `y` 属性，并赋予翻倍后的值。从那时起，每个实例都是自独立的。\n\n在这个示例中，`obj1` 和 `obj2` 用相同的初始值初始化。如果需要用不同的初始值初始化，那么构造函数将很有用。构造函数是一个执行以下操作的函数：\n\
    \n1. 创建新对象。\n2. 初始化新创建对象的实例变量。\n\n当然，`Object.create` 可以执行第一步，但为了完成这两个步骤，我们需要编写自己的构造函数。下一页显示了实现此目标的方法。\n\
    \n## 原型构造\n\n```javascript\nfunction Calc(x,y) {\n    var obj = Object.create(archetype);\n\
    \    obj.x = x;\n    obj.y = y\n    return obj;\n}\n```\n\n这是一个完整的构造函数。可以这样创建实例\
    \ `var obj = Calc(2,-3)`。这个函数对你来说可能更像是一个工厂方法而不是构造函数，因为它没有使用 `this`。我将其视为构造函数，因为它旨在创建一个专门的实例。如果编写不带\
    \ `this` 或 `self` 的构造函数让你感到不安，你可以利用 Javascript 的 `new` 运算符，其目的是为了伪造基于类的面向对象。通过\
    \ `new`，你可以这样定义你的构造函数以及如下所示的方法。\n\n### 伪类构造\n\n```javascript\nfunction Calc(x,y)\
    \ {\n    this.x = x;\n    this.y = y;\n}\nCalc.prototype = {\n    add: function()\
    \ {\n      return this.x + this.y\n    },\n    double: function() { \n      this.x\
    \ = 2*this.x;\n      this.y = 2*this.y\n    }\n};\n```\n\n当我第一次看到这种定义方法时，我觉得它很奇怪。但实际上并非如此。事实是\
    \ `Calc.prototype` 是一个伪装的原型。也就是说，每个用 `new Calc(args)` 创建的实例都具有相同的 `Calc.prototype`。\n\
    \n这就是 `new`的工作方式：它创建的所有实例都继承自预先存在的原型。一旦创建实例，`new` 会运行你的构造函数。它的执行方式使得 `this` 指向新创建的实例。你在第二节中看到了\
    \ `new` 以这种方式这样做。所以 `new` 正在发生的情况实际上是基于对象的面向对象。在上面的定义中，我重新赋值了 `Calc.prototype`\
    \ 为一个包含所需方法的原型。我必须承认，这不是定义方法的正常方式。你更有可能在下一页看到。\n\n### 伪类构造的常见变体\n\n```javascript\n\
    function Calc(x,y) {\n    this.x = x;\n    this.y = y;\n}\nCalc.prototype.add\
    \ = function() {\n    return this.x+this.y;\n};\nCalc.prototype.double = function\
    \ () {\n    this.x = 2*this.x;\n    this.y = 2*this.y\n}\n```\n\n这种定义对象类型的风格向\
    \ `Calc.prototype` 添加属性。每次添加都会保留已有的内容。尽管这种风格常见，但我认为它没有优点，因为我倾向于在一个地方编写完整的定义。\n\
    \n定义对象类型的第三种风格在某些情况下很有用，并且强调了使用 `new` 或不使用 `new` 的相似性。这种风格涉及为每个实例变量编写一个设置器（setter）。这些设置器的编写方式使得它们在创建实例时可以链式调用。这种技术的显而名称是链式设置器技术。我将在原型和伪类风格中向你展示链式设置器技术。下一页显示了以链式原型风格定义的\
    \ `Calc`。\n\n### 原型、链式设置器风格\n\n```javascript\nfunction Calc() {\n    return Object.create(\n\
    \        Calc.prototype\n    )\n}\nCalc.prototype = {\n    x : 1,\n    y : 1,\n\
    \    setX:  function(x) { \n      this.x = x;\n    }\n};\n```\n\n"
- fmt: "\n```javascript\n  return this;\n  },\n  setY: function(y) { \n    this.y\
    \ = y;\n    return this;\n  },\n  add: function() {\n    return this.x+this.y;\n\
    \  },\n  double: function() { \n    this.x = 2*this.x;\n    this.y = 2*this.y\n\
    \  }\n};\nvar add1 = Calc().setX(2).setY(-3);\nadd1.add()\n-1\nvar add2 = Calc().setX(2);\n\
    add2.add()\n2\n```\n\nExtrapolating from two instance variables, you can see that\
    \ the chaining setter style is advantageous when there are a lot of instance variables\
    \ and those instance variables have default values that seldom need overriding.\
    \ In that case creating a new instance becomes easy.\n\n### Note\n\nDoes it bother\
    \ you to use `Calc.prototype` within the definition of `Calc`? It works because,\
    \ when `Calc` is executed, these things have happened:\n\n1) the callable object\
    \ `Calc` has been created.\n2) an archetypal object has been assigned to `Calc.prototype`.\n\
    \nAs shown on the next page, essentially the same definition works for the pseudo-classes.\n\
    \n### Pseudo-class, chaining setter style\n\n```javascript\nfunction Calc() {\
    \ }\nCalc.prototype = {\n  x : 1,\n  y : 1,\n  setX: function(x) { \n    this.x\
    \ = x;\n    return this;\n  },\n  setY: function(y) { \n    this.y = y;\n    return\
    \ this;\n  },\n  add: function() {\n    return this.x+this.y;\n  },\n  double:\
    \ function() { \n    this.x = 2*this.x;\n    this.y = 2*this.y\n  }\n};\nvar add1\
    \ = (new Calc()).setX(2).setY(-3)\nadd1.add()\n-1\nvar add2 = (new Calc()).setX(2)\n\
    add2.add()\n2\n```\n\nBoth variations of the chaining setter style create an object\
    \ with this inheritance chain:\n\n1. The instance\n2. The archetype (`Calc.prototype`)\n\
    3. Object.prototype\n\n### Question\n\nImplement a function `Construct` that can\
    \ be used like this:\n\n```javascript\nvar obj = Construct(Calc,2,-3);\n```\n\n\
    as a replacement for\n\n```javascript\nvar obj = new Calc(2,-3);\n```\n\nOne thing\
    \ you will need to know to answer this question is how to remove the first argument\
    \ from the pseudo-array `arguments`. Do it this way:\n\n```javascript\nvar args\
    \ = Array.from(arguments),\n    F = args.shift();\n```\n\nNow `F` is the first\
    \ argument and `args` is an array of the remaining arguments.\n\n### Answer\n\n\
    ```javascript\nfunction Construct() {\n  var args = Array.from(arguments),\n \
    \     F = args.shift(),\n      obj = Object.create(F.prototype);\n  F.apply(obj,args);\n\
    \  return obj;\n}\n```\n\n### About the Author\n\nAdrian Zimmer (images/00001.jpg)\
