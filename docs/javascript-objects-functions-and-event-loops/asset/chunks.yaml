    XII. More on Object Orientation in Javascript


    Object orientation involves defining kinds of objects and then creating working
    objects that match those definitions. The working objects are usually called instances.
    Object orientation also involves some kind of inheritance in which there can be
    refinements of existing kinds of objects.


    Traditional languages like Java and Python have a concept of a class that is used
    for defining kinds of objects. An instance is constructed from a class and linked
    to that class. Javascript is different: kinds of objects are defined by example.
    That is to say you define a prototype object and instances are just new objects
    that inherit from the prototype.


    With the class-based approach it is classes that do the inheriting. With the object-based
    approach it is objects that do the inheriting. Whether object based or class based
    the rules that inheritance follows are pretty much the same.


    In [Section I](#index_split_005.html_filepos8396) and [Section II](#index_split_008.html_filepos15555)
    you saw two built-in `prototype` objects, `Object.prototype` and `Function.prototype`.
    Those prototypes provide services to all objects and/or functions. I use the word
    archetype for prototypes which define a kind of object that programmers define
    for their own use. The next page shows an example of an archetype with two instance
    variables and two methods.


    An archetype


    > `var archetype = { `


    > `   x : 1,`


    > `   y : 1,`


    > `   add: function() {`


    > `      return this.x+this.y;`


    > `   },`


    > `   double: function() { `


    > `              this.x = 2*this.x;`


    > `              this.y = 2*this.y`


    > `   }`


    > `};`


    OK, it is a silly example but clear your mind of that and realize this is an object
    not a class. Archetypes are not meant to be used directly. Instances that inherit
    from them are constructed instead. Inheritance lets the archetype be an unchanging
    template for all instances of the same kind, that is to say all objects that directly
    inherit from the archetype. The unchanging aspect is what makes the archetype
    a reliable description of a kind of object.


    In Java and Python, when a class is meant to have just one instance, it is said
    to be a singleton. This is a little weird as it is like defining a whole subspecies
    to describe your dog “Rover”. Rover would be the single instance of that subspecies
    or class. In Javascript you merely describe Rover and dispense with the subspecies.
    Said another way: in Javascript you describe a single object and dispense with
    the idea of an archetype. There is no need for the concept of singleton in Javascript.
    Such things are merely objects.


    When archetypes are used to describe kinds of objects, it is the `create` method
    discussed in [Section I](#index_split_005.html_filepos8396) that creates instances.
    For example new instances `obj1` and `obj2` of `archetype` can be created this
    way


    > `var obj1 = Object.create(archetype),`


    > `    obj2 = Object.create(archetype);`


    Because of the way inheritance works `obj1` and `obj2` are independent of each
    other. Changes to one do not impact the other. The first time `obj1.double()`
