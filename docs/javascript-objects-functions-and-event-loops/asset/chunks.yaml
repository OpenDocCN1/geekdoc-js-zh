  trans: "\n\n```html\n<script src=\"JavascriptEventLoopTools.js\"></script>\n```\n\
    \n在此处插入脚本\n\n```javascript\nvar running = true;\n\ninstallQer('q1500',1500);\n\
    installQer('q850',850);\n\n// Stateful writeMessage\nfunction writeMessage() {\n\
    \  if(!running) return;\n  var ms = writeMessage.messages,\n      i = 2*writeMessage.which;\n\
    \  writeMessage.which = (writeMessage.which+1)%3;\n  document.getElementById('upper').innerText\
    \ = ms[i];\n  document.getElementById('lower').innerText = ms[i+1];\n  writeMessage.q1500()\
    \   // repeating\n}\nwriteMessage.messages = [\n    \"Politicians and diapers\
    \ should be changed frequently\",\n    \"and for the same reason.\",\n    \"Actions\
    \ speak louder than words\",\n    \"but not nearly as often.\",\n    \"Don't let\
    \ schooling interfere\",\n    \"with your education\"\n];\nwriteMessage.which\
    \ = 0;\n\n// Stateful setColor\nfunction setColor() {\n  if(!running) return;\n\
    \  var cs = setColor.colors,\n      i = setColor.which;\n  setColor.which = (setColor.which+1)%3;\n\
    \  document.bgColor = cs[i];\n  setColor.q850()   // repeating\n}\nsetColor.colors\
    \ = [ \"BBFFFF\", \"FFBBFF\", \"FFFFBB\" ];\nsetColor.which=0;\n\n// Keystroke\
    \ Event Handler\ndocument\n  .addEventListener(\n    'keydown',\n    function\
    \ (e) {\n      if(e.code=='Escape') running = false;\n    } \n  );\n\n// Start\n\
    writeMessage();\nsetColor();\n```\n\n完整的 HTML 可以在 [Display5.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display5.html)\
    \ 获取。\n\n## VIII. Promises（承诺）\n\n假设你有三个函数 `f1`、`f2` 和 `f3`。进一步假设，你希望 `f2` 在 `f1`\
    \ 完成后执行，但并不一定紧接着执行。相反，你希望让已经队列的任务获得执行的机会。进一步假设，你希望 `f3` 以同样的方式在 `f2` 之后执行。使用事件队列技术，你可以进行如下操作。\n\
    \n顺序使用 `f1.que`、`f2.que` 和 `f3.que`\n\n```javascript\nfunction f1(`<f1 arg>`)\
    \ {\n  ...\n  f2.que(...)\n}\nfunction f2(`<f2 arg>`) {\n  ...\n  f3.que(...)\n\
    }\nfunction f3(`<f3 arg>`) {\n  ...\n}\n\nf1.que(`<f1 arg>`)\n```\n\n`que` 方法将每个\
    \ `f[i]` 封装在一个带有你选择的参数的任务中，并将该任务放入事件队列。\n\n注意，函数 `f1`、`f2` 和 `f3` 之间并不是相互独立的：`f2`\
    \ 在 `f1` 中被提到，`f3` 在 `f2` 中被提到。这可能使得为了其他用途复用这些函数变得困难。例如，在任何不以 `f2` 为后续的环境中使用 `f1`\
    \ 将变得很困难。\n\nPromises 允许 `f1`、`f2` 和 `f3` 相互解耦。下一页将展示这种解耦是如何工作的。带有 promise 的 `f1`、`f2`\
    \ 和 `f3`\n\n```javascript\nfunction f1(`f1 arg`) {\n  ...\n  return `<f1 val>`;\n\
    }\nfunction f2(`f2 arg`) {\n  ...\n  return `<f2 val>`;\n}\nfunction f3(`f3 arg`)\
    \ {\n  ...\n  return `<f3 val>`;\n}\np.then(f1)\n  .then(f2)\n  .then(f3)\n```\n\
    \n这里 `p` 是一个启动任务的 promise。所有的 promise 都有一个 `then` 方法，它可以创建另一个 promise。关于 `p` 以及\
    \ `<f1 arg>` 如何进入场景还有很多话要说，但目前我将关注 `f[i]` 的顺序执行。promise 如何创建的将在 第 X 节 和 第 XI 节\
    \ 中出现。\n\n尽管指定方式不同，但顺序执行与事件队列相似，底层机制会导致每个 `f[i]` 在 `f[i-1]` 完成后被封装并入队。与事件队列不同，每个\
    \ `f[i]` 通过简单返回该值向下一个传递值。\n\n另一个区别是，队列不是在事件队列上完成的。存在额外的队列供 promise 使用。由于这个额外队列上的任务优先级高于事件队列，所以我称它为“优先队列”（me-first\
    \ queue）。然而，它的真实名称是微任务队列（microtask queue）。\n\n这里有一个重新排序 `f[i]` 的示例：\n\n```javascript\n\
    p.then(f1)\n  .then(f3)\n```\n\n这里是另一个\n\n```javascript\np.then(f1)\n  .then(f2)\n\
    \  .then(f2a)\n  .then(f3)\n```\n\n当然，并不是所有函数都能以这些方式重新排序。可以重新排序的包括相互独立作用的函数以及作为彼此过滤函数。\n\
    \n与事件队列的最后一个显著区别是，promise 对错误处理提供了更好的控制。promise 通过 `catch` 方法支持错误处理。`then/catch`\
    \ 链\n\n```javascript\np\n  .then(f1) // p1\n  .catch(f2) // p2\n  .then(f3) //\
    \ p3\n  .catch(f4) // p4\n```\n\n所有的 `f[i]` 都引用由此创建的 promise。你可以看到第一个 `catch`\
    \ 属于 `p1` 并产生 `p2`，第二个 `then` 属于 `p2` 并产生 `p3`，依此类推。\n\n这种方式生成的 promise 都处于 `pending`（等待中）状态。通常\
    \ promise 有三种状态：`pending`（等待事情发生）、`fulfilled`（已完成）和 `rejected`（已拒绝）。已完成和拒绝的 promise\
    \ 被称为已结算。\n\n`p` 如何完成将在 第 X 节 中讨论。当 `p` 完成时，一个处理 `p1` 的任务将进入队列；当 `p1` 完成时，一个处理\
    \ `p2` 的任务将进入队列，依此类推。\n\n与事件队列不同，promise 拥有一种从上一步传递数据到下一步的机制。这种机制将已结算 promise\
    \ 的值传递给下一个 `f[i]`。\n\n`p[i]` 如何结算取决于它是通过 `then` 还是 `catch` 生成的，以及前一个 promise 是已完成还是被拒绝。\n\
    \n通过 `then` 生成的 `p[i]`：\n\n在这种情况下，`f[i]` 被封装并执行，其参数是之前的 promise 值；`p[i]` 根据 `f[i]`\
    \ 的执行结果被完成或拒绝。其 promise 值源于 `f[i]` 的返回值。\n\n通过 `catch` 生成的已完成 `p[i]`：\n\n在这种情况下，`f[i]`\
    \ 不会被执行，`p[i]` 将完成，其 promise 值与前一个值相同。\n\n通过 `then` 生成的已拒绝 `p[i]`：\n\n在这种情况下，`f[i]`\
    \ 不会被执行，`p[i]` 将被拒绝，其 promise 值与前一个值相同。\n\n通过 `catch` 生成的 `p[i]`：\n\n在这种情况下，`f[i]`\
    \ 被封装并执行，其参数是之前的 promise 值；`p[i]` 根据 `f[i]` 的执行结果被完成或拒绝。其 promise 值源于 `f[i]` 的返回值。\n\
    \n注意：\n\n当 `f[i]` 执行时，结果可能是抛出错误、非 promise 返回值或返回的 promise。如果是抛出错误，`p[i]` 将以错误对象为值拒绝。如果是非\
    \ promise 返回值 `rv`，`p[i]` 将 promise 值 `rv` 完成。如果返回值 `rp` 是一个 promise，`p[i]` 将获得与\
    \ `rp` 相同的状态。\n\n"
- fmt: "\nIf neither `p1` or `p2` is rejected `f3` will be skipped and `f4` will receive\
    \ the value that `f2` returned.\n\nThe final `catch` will execute `f5` if, and\
    \ only if, a rejected promise has propagated to it.\n\n## Note\n\n1.  You might\
    \ wonder what advantages event queuing can have over promises. The most obvious\
    \ is that event queuing is easier to understand.\n2.  Less obvious but important\
    \ is that event queuing plays nice with event handlers. Because the settling of\
    \ promises is done with tasks placed on the me-first queue, a promise programmer\
    \ must be careful not to create a `then/catch` chain that will starve tasks on\
    \ the event queue. That would make the script unresponsive to user input.\n3.\
    \  I believe the sequencing flexibility of promise responders will encourage the\
    \ development of utility functions in much the same way the flexibility of Unix\
    \ pipes did.\n\n## Question\n\nAssume there are two settled promises `p` and `q`,\
    \ that `p` is fulfilled with promise value `'good'`, and that `q` is rejected\
    \ with promise value `'bad'`. Assume also that we have a function\n\n```javascript\n\
    function s(x) {\n    console.log(x); return x+x;\n}\n```\n\nThis question has\
    \ two parts, a and b.\n\n### Question: Part a\n\nWhat be written on the console\
    \ and what will happen to `p1`, `p2`, and `p3` if the following executes?\n\n\
    ```javascript\np                  // p1\n  .catch(s)          // p2\n  .then(s);\
    \          // p3\nconsole.log(\"That's All Folks!\")\n```\n\n### Answer: Part\
    \ a\n\nNothing appears on the console while `p1`, `p2`, and `p3` are being created.\
    \ The first to appear will be “That's All Folks!!”\n\nLater promise `p2` will\
    \ become fulfilled with promise value `'good'`. The `s` in `.catch(s)` will not\
    \ execute.\n\nYet later the `s` in `.then(s)` will execute causing “good” to be\
    \ written. Promise `p3` will become fulfilled with promise value `'goodgood'`\n\
    \nSo what you will see on the screen is\n\n```text\nThat's All Folks!\ngood\n\
    ```\n\n### Question: Part b\n\nWhat be written on the console and what will happen\
    \ to `p1`, `p2`, and `p3` if the following executes?\n\n```javascript\nq     \
    \             // p1\n  .catch(s)          // p2\n  .catch(s)          // p3\n\
    \  .then( () => q )   // p4\n  .catch(s)          // p5\nconsole.log(\"That's\
    \ All Folks!\")\n```\n\n### Answer: Part b\n\nAgain “That's All Folks!” will be\
    \ the first to appear on the console.\n\nThe `s` in the first `.catch(s)` will\
    \ execute causing “bad” to be written on the console. The promise `p2` will become\
    \ fulfilled with promise value “badbad”.\n\nThe `s` in the second `.catch(s)`\
    \ will not execute. The promise `p3` will become fulfilled with promise value\
    \ “badbad”.\n\nThe `()=>q` will execute. Promise `p4` will become rejected with\
    \ promise value “bad” (the same as `q`'s promise value).\n\nThe `s` in the third\
    \ `.catch(s)` will execute causing `bad` to be written on the screen. Promise\
    \ `p5` will become fulfilled with the promise value `badbad`.\n\n```text\nThat's\
    \ All Folks!\nbad\nbad\n```\n\n## IX. Multitasking Example with Promises\n\nThis\
    \ section is mostly an exercise asking you to rewrite the multitasking exercise\
    \ in [Section VII](#index_split_032.html_filepos59787) with promises. However\
    \ before you can do that, you need a way to generate an initial promise. The `hesitating`\
    \ factory method can do that. It is found in [JavascriptEventLoopTools.js](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/JavascriptEventLoopTools.js).\
    \ You first made use of this file in [Section VI](#index_split_027.html_filepos44854).\n\
    \nThis statement\n\n```javascript\nvar p = hesitating(`<microseconds>`)\n```\n\
    \nwill create a promise that will wait the specified number of microseconds before\
    \ becoming fulfilled with an `undefined` promise value. While it is waiting, tasks\
    \ on the event queue can execute. Using `hesitating` is the easiest way forward\
    \ with the next exercise.\n\n### Question\n\nRedo the multitasking exercise in\
    \ [Section VII](#index_split_032.html_filepos59787). Fill in\n\n```text\nLOAD\
    \ SCRIPTS HERE\n```\n\nand\n\n```text\nINCLUDE SCRIPT HERE\n```\n\nsuch that the\
    \ event queuing methodology is replaced with promises.\n\n### Answer\n\nNo need\
    \ to install anything in `Function.prototype` here. Instead `hesitating` is used\
    \ in both `writeMessage` and `setColor`.\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"JavascriptEventLoopTools.js\"></script>\n```\n\n```javascript\nvar running\
    \ = true;\n\n// Stateful writeMessage\n\nfunction writeMessage() {\n    if( !running\
    \ ) return;\n    var ms = writeMessage.messages,\n    i = writeMessage.which;\n\
    \    writeMessage.which = (i+1)%3;\n    document.getElementById('upper').innerText\
    \ = ms[i];\n    document.getElementById('lower').innerText = ms[i+1];\n    hesitating(1500).then(writeMessage);\n\
    }\n\nwriteMessage.messages = [\n\"Politicians should be changed frequently\",\n\
    \"and not as as often\",\n\"Actions speak louder than words\",\n\"for the reason\"\
    ,\n\"Don't let interfere with your education\"\n];\nwriteMessage.which = 0;\n\n\
    // Stateful setColor\n\nfunction setColor() {\n    if( !running ) return;\n  \
    \  var cs = setColor.messages,\n    i = setColor.which;\n    setColor.which =\
    \ (i+1)%3;\n    document.getElementById('upper').innerText = cs[i];\n    document.getElementById('lower').innerText\
    \ = cs[i+1];\n    hesitating(850).then(setColor);\n}\n\nsetColor.messages = [\n\
    \"FFFF\",\n\"BB\",\n\"FFFF\"\n];\nsetColor.which = 0;\n\n// Keystroke Event\n\n\
    document.addEventListener('keydown', function (e) {\n    if(e.code=='Escape')\
    \ {\n        running = false;\n    }\n});\n\n// Start\n\nwriteMessage();\nsetColor();\n\
    ```\n"
  raw: "If neither p1 or p2 is rejected `f3` will be skipped and `f4` will receive\
    \ the value that `f2` returned.\n\nThe final `catch` will execute `f5` if, and\
    \ only if, a rejected promise has propagated to it.\n\nNote:\n\n1.  You might\
    \ wonder what advantages event queuing can have over promises. The most obvious\
    \ is that event queuing is easier to understand.\n\n2.  Less obvious but important\
    \ is that event queuing plays nice with event handlers. Because the settling of\
    \ promises is done with tasks placed on the me-first queue, a promise programmer\
    \ must be careful not to create an `then/catch` chain that will starve tasks on\
    \ the event queue. That would make the script unresponsive to user input.\n\n\
    3.  I believe the sequencing flexibility of promise responders will encourage\
    \ the development of utility functions in much the same way the flexibility of\
    \ Unix pipes did.\n\nQuestion\n\nAssume there are two settled promises `p` and\
    \ `q`, that `p` is fulfilled with promise value `'good'`, and that `q` is rejected\
    \ with promise value `'bad'`. Assume also that we have a function\n\n> `function s(x) { `\n\
    \n> `   console.log(x); return x+x;`\n\n> `}`\n\nThis question has two parts,\
    \ a and b.\n\nQuestion: Part a\n\nWhat be written on the console and what will\
