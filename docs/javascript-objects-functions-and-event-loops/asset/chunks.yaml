    > `              this.x = 2*this.x;`


    > `              this.y = 2*this.y`


    > `   }`


    > `};`


    > `> var add1 = (new Calc()).setX(2).setY(-3)`


    > `> add1.add()`


    > `-1`


    > `> var add2 = (new Calc()).setX(2)`


    > `> add2.add()`


    > `2`


    Both variations of the chaining setter style create an object with this inheritance
    chain


    1.  The instance


    2.  The archetype (`Calc.prototype`)


    3.  Object.prototype


    Question


    Implement a function `Construct` that can be used like this


    > `var obj = Construct(Calc,2,-3);`


    as a replacement for


    > `var obj = new Calc(2,-3);`


    One thing you will need to know to answer this question is how to remove the first
    argument from the pseudo-array `arguments`. Do it this way


    > `var args = Array.from(arguments),`


    > `    F = args.shift();`


    Now `F` is the first argument and `args` is an array of the remaining arguments.


    Answer


    > `function Construct() {`


    > `   var args = Array.from(arguments),`


    > `       F = args.shift(),`


    > `       obj = Object.create(F.prototype); `


    > `   F.apply(obj,args);`


    > `   return obj;`


    > `}`


