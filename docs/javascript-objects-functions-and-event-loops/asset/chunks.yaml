  trans: "\n\n### 创建时\n\n```\nObject.getOwnPropertyNames(counter2)\n['decr']\n```\n\
    \n但在执行了 `counter2.incr` 或 `counter2.decr` 之一后，你将得到\n\n```javascript\nObject.getOwnPropertyNames(counter2)\n\
    ['decr', 'val']\n```\n\n原因是因为 `counter2` 可以通过继承从 `counter` 获取数据值，但它无法修改它们。当需要修改时，会在\
    \ `counter2` 中创建一个新属性。此后，从 `counter2` 获取的属性将是 `counter2` 自身的属性，而不是它在 `counter`\
    \ 中原始的属性。\n\n这意味着 `counter` 可以用于为任何作为其 `[[Prototype]]` 的对象提供初始值。\n\n### II. 函数\n\
    \n函数是可调用的对象，这意味着：\n\n- 它们是包含函数主体（很可能是编译后的形式）的对象。\n- 它们的继承链可以访问到执行该函数主体的方法。\n\n\
    函数对象之所以可以访问执行其代码的方法，是因为它们的继承链中被插入了 `Function.prototype`。在 `Function.prototype`\
    \ 中有两个可以执行函数的方法，即 `apply` 和 `call`。\n\n下面的简短交互过程展示了函数的继承链。\n\n#### 澄清 `Function.prototype`\n\
    \n```javascript\nvar getP = Object.getPrototypeOf;\nfunction f() {}\ngetP(f)===Function.prototype\n\
    true\ngetP(Function.prototype)===Object.prototype\ntrue\n```\n\n`apply` 和 `call`\
    \ 都需要一个参数，用于指定在函数执行时 `this` 指向哪个对象。此外，这两个函数都接受普通参数列表。它们唯一的区别在于参数列表的指定方式。你可以在下面的示例中看到这种区别。\n\
    \n#### `call` 和 `apply` 的区别\n\n假设有如下定义\n\n```javascript\nfunction f(x,y) { return\
    \ x+y }\n```\n\n那么这个\n\n```javascript\nf.call({},2,3)\n```\n\n以及这个\n\n```javascript\n\
    f.apply({},[2,3])\n```\n\n都将返回 5。在两种情况下，`this` 都指向一个空对象。\n\n一个更具信息量的示例涉及这个函数\n\
    \n```javascript\nfunction f(x) { return x+this.y }\n```\n\n它期望在一个包含 `y` 的 `this`\
    \ 对象上下文中执行。以这种方式执行它\n\n```javascript\nf(2)\n```\n\n此时 `this` 将指向全局对象。除非全局已赋值了\
    \ `y`，否则执行将失败。\n\n另一种执行 `f` 的方法是\n\n```javascript\nvar obj = {f:f, y:3}\nobj.f(2)\n\
    5\n```\n\n这之所以有效是因为 `obj` 同时包含了 `y` 和 `f`。如果对象中缺少 `f`，则无法工作。\n\n```javascript\n\
    var obj = {y:3}\nobj.f(2) // 不行\n```\n\n`call` 和 `apply` 的作用是允许 `this` 指向与执行 `f`\
    \ 时不同的对象。例如，我们可以从全局对象执行 `f`，并通过这种方式从另一个对象获取 `this.y`\n\n```javascript\nObject.apply({y:3},f)\n\
    5\n```\n\n总结：函数是可调用的对象，方法是函数，而 `this` 由函数执行时的上下文决定。你可以通过使用 `call` 或 `apply` 来处理该上下文。\n\
    \n你可以在下一节中阅读更多关于 `this` 的内容。\n\n#### 问题\n\n当函数 `f` 执行时，`this` 指向的对象由其执行时的上下文决定。但如果我不希望这样呢？假设我想让函数定义中的\
    \ `this` 无论上下文如何都指向相同的内容。这可以通过 `call` 或 `apply` 实现，但这些函数用起来并不好用。\n\n这是一个你可以解决的问题。创建一个工厂方法\
    \ `fixThis`，使得\n\n```javascript\nf.fixThis(obj);\n```\n\n它会返回一个与 `f` 相似的函数，不同之处在于它的\
    \ `this` 指针将始终引用 `obj`。例如\n\n```javascript\nfunction f(z) { return z + this.x\
    \ }\nvar x = '?'\nf('hi')\n'hi?'\nvar obj = {x: '!'}\nvar g = f.fixThis(obj)\n\
    g('hi')\n'hi!'\n```\n\n你可能知道 `Function.prototype` 已经包含一个行为与 `fixThis` 相似的函数 `bind`。使用该函数将就忽略了本次练习的意图。\n\
    \n#### 答案\n\n你可能已经发现定义需要这样开头\n\n```javascript\nFunction.prototype.fixThis = function(obj)\
    \ {\n    ...\n}\n```\n\n并且你需要定义一个供 `fixThis` 返回的函数。该函数必须使用 `apply` 或 `call` 执行\
    \ `f`。在这一点上，你可能会卡住，因为你不确定如何引用 `f`。要正确实现，你需要记住两件事：`f` 是 `fixThis` 内部 `this` 指向的对象，但\
    \ `f` 并不是 `fixThis` 返回的函数中 `this` 指向的对象。如果需要，请带着这个见解再次尝试。\n\n`fixThis` 的实现\n\n\
    ```javascript\nFunction.prototype.fixThis = function(obj) {\n    var that = this;\n\
    \    return function() {\n        return that.apply(obj,arguments);\n    }\n}\n\
