  trans: "\n\n我会描述另一个类似于这样的函数\n\n```\nfunction t() { f(2,2) }\n```\n\n将其称为一个任务（task）。任务不接受参数也不返回返回值。它们可以被存储起来供以后执行。事实上，它们通常存在仅仅是为了设置另一个函数的延迟执行。一系列任务可以被队列，然后一个接一个地执行，而不一定相互影响。\n\
    \n在刚刚给出的示例中，函数 `f` 被认为封装在任务 `t` 中。\n\n事件循环（event loop）是一个从队列中获取任务并执行它们的运行时系统。每个任务在下一个任务执行之前都会执行完成。\n\
    \n当然，当任务正在执行时，世界其他部分并没有停下来。传入的数据到达了。鼠标点击发生了。这些事情是外部力量的结果。它们是事件。事件循环系统有一种处理事件的机制，而对当前执行的任务产生任何影响。当事件循环系统感知到事件时，它会将带有描述事件参数的事件处理器封装成一个任务，并将该任务放入队列。为了做到这一点，系统会中断正在执行的任务。任务可以被中断并重启，而无需感知到中断的发生。事件的实际处理留给随后的任务。\n\
    \n### Note\n> 当然，在多处理器系统上可能不需要中断，但大多数软件系统在这一方面似乎还没有跟上硬件。\n\n我将使用 `addEventListener`\
    \ 为正在运行的 Javascript 会话添加监听器。下一页显示了一个示例。监听器通常是匿名定义的，但在接下来的示例中，我使用了名称 `aHandler`，这样我可以讨论被添加的监听器。\n\
    \n### 添加监听器的示例\n\n```javascript\ndocument\n.addEventListener(\n    \"click\",\n\
    \    function aHandler (event) {\n      console.log(\n          event.pageX,\n\
    \          event.pageY\n      )\n    }\n  )\n```\n\n在此之后，每当点击事件发生时，运行时系统都会创建一个事件对象\
    \ `E` 并以这种方式将其封装进 `aHandler`\n\n```javascriptfunction() { aHandler(E) }\n```\n\
    \n然后该任务被放入队列。\n\n对于鼠标点击，`E` 的内容将包括点击发生时鼠标所在屏幕坐标 `pageX` 和 `pageY`。\n\n此类任务等待执行的队列通常被称为事件队列（event\
    \ queue）。但事件队列可能包含不处理实际事件的任务。为了承认这一点，Javascript 文档写作“宏任务队列”（macrotask queue）而不是“事件队列”。\n\
    \n### Note\n> 那些想要查找此内容的人知道，由于幼稚的商标原因，官方 Javascript 文档描述的是“ECMAScript”而不是“Javascript”。\n\
    \n### Question\n从 Section III 填入\n\nLOAD SCRIPTS HERE\n\n和\n\nINCLUDE SCRIPT HERE\n\
    \n使得当屏幕上发生鼠标点击时，显示行将显示为：\n\n`X 坐标: \"鼠标点击时的 X 坐标\"`\n`Y 坐标: \"鼠标点击时的 Y 坐标\"`\n\
    \n使用 Section III 中的 `writeMessage` 创建启动页（即初始屏幕），内容为：\n\n`writeMessage('Click','someplace');`\n\
    \n### Answer\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE SCRIPT HERE\n\n```javascript\n\
    function writeMessage(line1,line2) {\n    document.getElementById('upper').innerText\
    \ = line1;\n    document.getElementById('lower').innerText = line2;\n}\n\ndocument\n\
    .addEventListener(\n    \"click\",\n    function aHandler (event) {\n      writeMessage(\n\
    \          'X coord: ' + event.pageX,\n          'Y coord: ' + event.pageY\n \
    \     )\n    }\n  )\n\nwriteMessage('Click','someplace');\n```\n\n完整的 HTML 可以在\
    \ [Display2.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display2.html)\
    \ 获取\n\n## V. 使用事件循环多任务\n\n在 Javascript 中，当你想要将自己的任务放入事件队列时，你使用 `setTimeout` 函数。基本上，你所做的是为一个定时事件入队一个处理器。例如，为了在\
    \ 5 秒后让函数 `f` 应用于参数 `\"one\"` 和 `\"two\"`，你会写：\n\n```javascript\nsetTimeout(\n\
    \    function() { f(\"one\",\"two\") },\n  5000\n)\n```\n\n这创建了一个匿名任务，该任务将在 5000\
    \ 毫秒后进入事件队列。\n\n### Note\n如果你想任务立即进入队列，请将 5000 替换为 0，但记住，立即进入事件队列并不同于执行。\n\n下一页显示了你可以写什么来使用事件队列进行每半秒重复一次任务\
    \ `t`。\n\n```javascript\nfunction t() {\n  …\n  setTimeout(\n    function() {\
    \ t() },\n    0\n  )\n}\n```\n\n这看起来是递归的，但其实不是。递归函数像调用其他任何函数一样调用自己，并在被调用函数返回时准备好继续。`t`\
    \ 显示的这种重复是不同的。`t` 并没有调用自己，而是在执行完毕后安排了 Javascript 引擎来完成调用。`t()` 的每次执行都会返回事件循环中的同一个位置，那里将选择另一个任务进行执行。\n\
    \n在询问本节的问题之前，我想为你提供一些数据。下一页显示了三条归属于马克·吐温（Mark Twain）的消息和一个颜色数组。你将在答案中使用它们。\n\n\
    ### 消息与颜色\n```javascript\nvar messages = [\n    \"Politicians and diapers\" +\
    \ \"be changed frequently\",\n    \"and for the same reason.\",\n    \"Actions\
    \ speak louder than words\",\n    \"but not as often.\",\n    \"Don't let schooling\
    \ interfere\",\n    \"with your education\"\n],\n  colors = [\"BBFFFF\", \"FFBBFF\"\
    , \"FFFFBB\"];\n```\n\n### Question\n填入\n\nLOAD SCRIPTS HERE\n\n和\n\nINCLUDE SCRIPT\
    \ HERE\n\n使得显示切换 `messages` 中的三条消息，背景颜色切换 `colors` 中的三个选项。这些切换应该是相互独立的，消息变化大约\
    \ 1500 毫秒，背景颜色变化大约 850 毫秒。\n\n### Answer\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE\
    \ SCRIPT HERE\n\n```javascript\nvar messages = [\n    \"Politicians and diapers\
    \ should be changed frequently\",\n    \"and for the same reason.\",\n    \"Actions\
    \ speak louder than words\",\n    \"but not as often.\",\n    \"Don't let schooling\
    \ interfere\",\n    \"with your education\"\n];\nvar colors = [ \"BBFFFF\", \"\
    FFBBFF\", \"FFFFBB\" ];\n\nfunction writeMessage(which) {\n  document.getElementById('upper').innerText\
    \ = messages[2*which];\n  document.getElementById('lower').innerText = messages[2*which+1];\n\
    \  setTimeout(\n    function () { \n      writeMessage( (which+1)%3 )\n    },\n\
    \    1500\n  )\n}\n\nfunction setColor(which) {\n  document.bgColor = colors[which];\n\
    \  setTimeout(\n    function () {\n      setColor( (which+1)%3 )\n    },\n   \
    \ 850\n  )\n}\n\nwriteMessage(0);\nsetColor(0);\n```\n\n完整的 HTML 可以在 [Display3.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display3.html)\
    \ 获取\n\n## VI. 使用事件队列多任务\n\n事件队列是我给的一种技术命名，用于简化你在上一节练习中编写的类型脚本。事件队列用单一目的函数替换了\
    \ `setTimeout`，该函数可以封装并队列其他函数。假设这个\n\n```javascript\nfunction f(x,y) { return\
    \ x+y }\n```\n\n是需要封装的函数。与其这样这样做：\n\n```javascript\nsetTimeout(\n    function()\
    \ { f(2,2) },\n  0\n);\n```\n\n事件队列这样做这样做：\n\n```javascript\nf.que(2,2)\n```\n\
    \n这种语法与 `f(2,2)` 令人愉快地相似，但效果与 `setTimeout` 相同。\n\n"
- fmt: "\nIt is possible to implement `que` using techniques you have already seen:\
    \ `setTimeout` will arrange for the actual enqueuing and `apply` will do the actual\
    \ executing. So that `que` will be available to any `f`, it will reside in `Function.prototype`.\n\
    \nThe next page shows my first (inadequate) attempt at implementing `que`.\n\n\
    ### Inadequate `que` function.\n\n```javascript\nfunction.prototype.que = function()\
    \ {\n  var that = this;\n  setTimeout(\n    function() {\n        that.apply({},arguments)\n\
    \    },\n    0\n  );\n}\n```\n\nThis definition of `que` works but I was dissatisfied\
    \ with it for three reasons:\n\n1. the name `que` might not always be appropriate.\n\
    2. `Function.prototype` ought not be altered without providing some notification\
    \ of what has been done.\n3. there needs to be a way to choose a delay other than\
    \ 0 milliseconds.\n\nAll three changes are possible if instead of defining `que`\
    \ I define a factory function that makes `que`. I can pass the desired name and\
    \ number of microseconds delay to the factory function. These choices will then\
    \ be built into `que` whose name can be anything. Here is an example\n\n```javascript\n\
    installQer('queue',3000)\n'queue' has been added to Function.prototype.\n```\n\
    \nThis installs a method `queue` in `Function.prototype` and sends a message about\
    \ the installation to the console. Given any `f`, the installation allows this\
    \ statement\n\n```javascript\nf.queue(2,2)\n```\n\nto cause this task\n\n```javascript\n\
    function() { f(2,2) }\n```\n\nto be enqueued after 3 seconds have passed.\n\n\
    Before I implement `installQer` there is a question I need to consider. It concerns\
    \ the visibility of the method being installed. What, for example, should this\
    \ loop\n\n```javascript\nfor(o in Function.prototype) console.log(o)\n```\n\n\
    display? The designers of Javascript chose not to let it display built-in functions\
    \ such as `apply` and `call`. Feel free to disagree but I think a method installed\
    \ by `installQer` is similar and so should be similarly invisible.\n\nThis kind\
    \ of visibility is determined by something called a property descriptor. Javascript\
    \ didn't always have descriptors and not all properties have them but many do.\
    \ Descriptors are like objects in that they have their own properties but these\
    \ descriptor properties are only used to provide information about the property\
    \ they describe. One piece of information of course is the value assigned to the\
    \ described property. The value is placed in the `value` descriptor property.\
    \ Another descriptor property is `enumerable` which determines the visibility\
    \ of the property being described.\n\nThe `Object.defineProperty` function is\
    \ used to create a property with a descriptor. If `installQer`'s installations\
    \ are to have the same limited visibility as the built-in functions, I must use\
    \ it. Here is the general pattern\n\n```javascript\nObject.defineProperty(\nobject,\n\
    property name,\ncomplete or partial descriptor object\n);\n```\n\nWhen a partial\
    \ descriptor object is used Javascript fills in default values.\n\nThe next page\
    \ shows my implementation of `installQer`.\n\n### `installQer`\n\n```javascript\n\
    function installQer(desired_name,delay) {\n  delay = delay || 0;\n  Object.defineProperty(\n\
    \    Function.prototype,\n    desired_name,\n    { enumerable: false,\n      value:\
    \ function() {\n        var that = this;\n        setTimeout(\n          ()=>that.apply({},arguments),\n\
    \          delay\n        )\n      }\n  );\n  console.log(\n    desired_name +\n\
    \    'has been added to Function.prototype'\n  )\n}\n```\n\nThis script contains\
    \ another feature of Javascript you may not be aware of, namely the use of `=>`.\
    \ Know that `()=>that.apply({},args)` stands for\n\n```javascript\nfunction(){return\
    \ that.apply({},args)}\n```\n\nA more use might be `(x)=>x+1`. Because event queuing\
    \ comes in handy I have placed `installQer` in a script named [JavascriptLoopTools.js](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndLoops/master/JavascriptLoopTools.js).\
    \ If you place `JavascriptLoopTools.js` in a folder with your HTML pages, you\
    \ can make its functions available by adding\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"JavascriptLoopTools.js\"></script>\n```\n\nto your header. Note: If this\
    \ were a lecture there would be somebody at the back of the room who would tell\
    \ me: \"You didn't really remove `setTimeout`.\" These of objections, which revolve\
    \ around the semantics of words like “really”, seem to come from the back of the\
    \ room. I did remove `setTimeout` from the scripts we write. In so doing I made\
    \ those scripts intelligible and pleasing to look. Of course `setTimeout` is hiding\
    \ in `installQer` so, in a sense, it is not removed.\n\n#### Question\n\nFill\
    \ in and such that the display is the same as the previous section's exercise\
    \ but the rotating of messages and colors can be stopped by pressing the ESC key.\
    \ The implementation should expand this handler\n\n```javascript\ndocument\n.addEventListener(\n\
    \  'keydown',\n  function (e) {\n    if(e.code=='Escape') {\n      …\n    }\n\
    \  }\n)\n```\n\nand make use of `installQer` instead of `setTimeout`.\n\n####\
    \ Answer\n\n```html\n<script type=\"text/javascript\" src=\"JavascriptLoopTools.js\"\
    ></script>\nvar messages = [\n  \"Politicians and diapers should be changed frequently\"\
    ,\n  \"and for the same reason.\",\n  \"Actions speak louder than words\",\n \
    \ \"but not nearly as often.\",\n  \"Don't let schooling interfere\",\n  \"with\
    \ your education\"\n];\nvar colors = [\"BBFFFF\", \"FFBBFF\", \"FFFFBB\"];\nvar\
    \ running = true;\n\ninstallQer('q1500',1500);\ninstallQer('q850',850);\n\nfunction\
    \ writeMessage(which) {\n  if (!running) return;\n  document.getElementById('upper').innerText\
    \ = messages[2*which];\n  document.getElementById('lower').innerText = messages[2*which+1];\n\
    \  writeMessage.q1500((which+1)%3)\n}\n\nfunction setColor(which) {\n  if (!running)\
    \ return;\n  document.bgColor = colors[which];\n  setColor.q850((which+1)%3)\n\
    }\n\ndocument\n.addEventListener(\n  'keydown',\n  function (e) {\n    if(e.code=='Escape')\
    \ running = false;\n  }\n)\n\nwriteMessage(0);\nsetColor(0);\n```\n\nThe complete\
    \ HTML is available at [Display4.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/master/Display4.html).\n\
    \n### VII. Functions as Objects\n\nSince functions are objects, we can give them\
    \ states that remember what they have done from one execution to the next. The\
    \ following shows how I might add a state to `writeMessage`.\n\n#### Statefull\
    \ `writeMessage`\n\n```javascript\nfunction writeMessage() {\n  if (!running)\
    \ return;\n  var ms = writeMessage.messages,\n  i = 2*writeMessage.which;\n  writeMessage.which\
    \ = (writeMessage.which+1)%3;\n  document.getElementById('upper').innerText =\
    \ ms[i];\n  document.getElementById('lower').innerText = ms[i+1];\n  writeMessage.q1500()\n\
