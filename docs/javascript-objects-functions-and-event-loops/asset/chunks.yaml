  trans: "\n\n![](img/calibre_cover.jpg)\n\n# Javascript：对象、函数与事件循环\n\n作者 J Adrian\
    \ Zimmer\n\n作者邮箱：`jazimmer@BonsaiReads.com`。\n\n由 [Bonsai Reads](http://BonsaiReads.com)\
    \ 出版并在 Amazon 分发。\n\n封面设计：J Adrian Zimmer\n\n版权所有 2017 J Adrian Zimmer\n\n保留所有权利。允许购买者出于个人目的进行复制，前提是购买者采取合理措施防止他人进一步复制。\n\
    \n版本：1.0\n\n本书有两个目录。一个是章节的注释列表；另一个列出了每个主要代码段的列表。\n\n## 关键字注释列表\n\n### Javascript\n\
    适合准备好深入学习其内部工作原理的 Javascript 程序员。\n\n### 对象\nJavascript 是面向对象的，但不是面向类的。\n\n###\
    \ 函数\nJavascript 函数是可调用的对象。\n\n### 事件\n源自 Javascript 系统外部的事件会导致处理函数进入队列以等待稍后执行。\n\
    \n### 事件循环 (Event Loop)\n事件循环逐个选择队列中的函数进行执行。函数通常（但不限于）作为外部事件的响应而进入队列。\n\n### 宏任务队列\
    \ (Macrotask queue)\n将宏任务队列想象为事件处理器队列。\n\n### 微任务队列 (Microtask queue)\n将微任务队列想象为“我优先队列”（me-first\
    \ queue）。\n\n### 承诺 (Promises)\nPromises 处理异步请求，并在“我优先队列”中按顺序执行后续操作。\n\n### 伪类\
    \ (Pseudo Classes)\nJavascript 对 `new` 的巧妙使用让基于对象的语言看起来像基于类。\n\n## 章节注释列表\n\n\
    - **I. 对象继承**：快速查看原型在对象继承链中的作用。\n- **II. 函数**：函数是继承其函数特性的可调用对象。\n- **III. 文本两行居中**：用于示例脚本的网页模板。\n\
    - **IV. 事件循环**：利用事件处理器。\n- **V. 使用事件循环实现多任务处理**：设置两个独立的循环进程。\n- **VI. 使用事件队列实现多任务**：从重复进程中消除\
    \ `setTimeout`。\n- **VII. 作为对象的函数**：为 `writeMessage` 和 `setColor` 添加状态。\n- **VIII.\
    \ Promises**：承诺如何在利用“我优先队列”的同时解耦过程的步骤。\n- **IX. 使用 Promises 的多任务示例**：带有承诺的独立循环进程。\n\
    - **X. 创建 Promises**：两个通过承诺管理对外部事件响应的示例。\n- **XI. 实现 `hesitating`**：实现 `hesitating`\
    \ 工厂方法。\n- **XII. 更多关于 Javascript 中的面向对象内容**：`new` 操作符如何伪造类。\n\n## 前言\n\n《Javascript：对象、函数与事件循环》并不是一本入门书籍，也没有涉及过多的细节。相反，它深入探讨了几个其\
    \ Javascript 变让许多程序员感到困惑的概念，即对象、函数、承诺、事件循环编程以及 Javascript 伪造类的方式。其目的是为继续构建对 Javascript\
    \ 的理解提供一个坚实的基础。为此，每个章节都包含一个练习题，你应该在翻页查看答案之前尝试完成。即使你没有完成练习题，尝试的过程也会让答案更有意义，并让后续章节更易理解。\n\
    \n本书假设你已经了解了一些 Javascript，并熟悉如 Java 和 Python 等语言中基于类的面向对象。\n\n本电子书有一个 [Github\
    \ 仓库](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/)，可以在那里找到练习答案的可下载副本。它还包含了两个实用的工厂方法。\n\
    \n请注意，本电子书中脚本和交互会话的格式并不是为了作为范。相反，它的目的是产生短行，以便在小屏幕上更容易阅读脚本。\n\n你可以通过开头为 `>` 的代码行来识别交互会话。它们转录自\
    \ [Node.js](https://nodejs.org/) 解释器，但转录中删除了许多 `undefined`。例如\n\n```\n> var x\
    \ = 'hi'\n> undefined\n> > console.log(x)\n> hi\n> undefined\n```\n\n仅转录为：\n\n\
    ```\n> var x = 'hi'\n> > console.log(x)\n> hi\n```\n\n`var` 和 `console.log` 实际上都会返回\
    \ `undefined`，但在转录中看到这一点很困惑，因为我们并不认为它们会返回任何内容。\n\n## I. 对象继承\n\nJavascript 中的一个计数对象可以这样定义：\n\
    \n```javascript\nvar counter = {\n  val: 0,\n  incr: function() {\n    this.val\
    \ += 1;\n  }\n}\n```\n\n不要将其与类混淆。它是一个对象。正如你将看到的，`prototype` 成为其他对象的 [[Prototype]]。许多对象都有一个名为\
    \ `prototype` 的属性。正如你将看到的，`prototype` 成为其他对象的 [[Prototype]]。它们并不是它们所所属对象的 [[Prototype]]。\n\
    \n例如，`Object.prototype` 成为大多数其他对象继承链中的最后一个对象。因此，大多数对象都可以访问 `toString` 方法，因为 `toString`\
    \ 存在于 `Object.prototype` 中。\n\n`getPrototypeOf` 方法返回其参数在继承链中的直接前驱。你可以将其构想为“父类”（super）对象。它通常被称为对象的\
    \ [[Prototype]]。\n\n获取“自身”（own）属性名称意味着获取对象本身所拥有的属性，而不是从其他对象继承而来的属性。\n\nJavascript\
    \ 有一个内置对象 `Object`，其方法帮助操作对象。两个示例方法是 `getOwnPropertyNames` 和 `getPrototypeOf`。当应用于\
    \ `counter` 时，它们产生结果：\n\n```\n> Object.getOwnPropertyNames(counter)\n['val', 'incr']\n\
    ```\n\n以及\n\n```\n> var getP = Object.getPrototypeOf;\n> getP(counter) === Object.prototype\n\
    true\n```\n\n`Object` 中还有其他实用的函数。其中一个我将使用 `Object.create`，它可以创建一个具有指定 [[Prototype]]\
    \ 的空对象。特别是这个表达式\n\n```\nObject.create(obj)\n```\n\n会创建一个 [[Prototype]] 为 `obj`\
    \ 的新空对象。\n\n### 问题\n\n按上述实现 `counter`，然后\n\n1. 创建 `counter2`，它继承自 `counter` 并添加一个\
    \ `decr` 方法，使 `val` 减 1。\n2. 检查以下每个操作\n   `Object.getOwnPropertyNames(counter2)`\n\
    \   `Object.getOwnPropertyNames(counter)`\n   返回什么。从目前的内容来看答案并不显而易见，所以请尝试一下。\n\
    \n### 答案\n\n通过这种方式创建 `counter2`：\n\n```javascript\nvar counter2 = Object.create(counter);\n\
    counter2.decr = function() { this.val -= 1 }\n```\n\n`counter` 的自身属性显然是\n\n```\n\
    > Object.getOwnPropertyNames(counter)\n['val', 'incr']\n```\n\n然而，你看到的顺序将取决于 Javascript\
    \ 引擎的实现。\n\n如果你对 `counter2` 的自身属性没有两个不同的答案，那么你漏掉了什么。当你执行 `incr` 或 `decr` 时，情况会发生变化。\n\
    \n"
- fmt: "\n### Upon creation\n\n```\nObject.getOwnPropertyNames(counter2)\n['decr']\n\
    ```\n\nbut after either of `counter2.incr` or `counter2.decr` has executed, you\
    \ will get\n\n```javascript\nObject.getOwnPropertyNames(counter2)\n['decr', 'val']\n\
    ```\n\nThe reason is that `counter2` can fetch data values from `counter` through\
    \ inheritance but it cannot alter them. When alteration is necessary a new property\
    \ in `counter2` is made. After that, fetching from `counter2` will be of `counter2`'s\
    \ property not its original in `counter`.\n\nThis means that `counter` can be\
    \ used to give an initial value to any object for which it is a `[[Prototype]]`.\n\
    \n### II. Functions\n\nFunctions are callable objects which means:\n\n- they are\
    \ objects containing the function body (probably in compiled form).\n- their inheritance\
    \ chains have access to methods which can execute this function body.\n\nThe reason\
    \ function objects can have access to methods which execute their code is that\
    \ their inheritance chains have `Function.prototype` inserted in them. There are\
    \ two methods in `Function.prototype` which can execute a function, namely `apply`\
    \ and `call`.\n\nThe following short interactive session shows the inheritance\
    \ chain of a function.\n\n#### Clarifying `Function.prototype`\n\n```javascript\n\
    var getP = Object.getPrototypeOf;\nfunction f() {}\ngetP(f)===Function.prototype\n\
    true\ngetP(Function.prototype)===Object.prototype\ntrue\n```\n\nBoth `apply` and\
    \ `call` require an argument which specifies which object `this` will refer to\
    \ when the function is executing. In addition both these functions accept a list\
    \ of normal arguments. They differ only in the way the arguments list is specified.\
    \ You can see the difference in the following example.\n\n#### Difference between\
    \ `call` and `apply`\n\nAssume this definition\n\n```javascript\nfunction f(x,y)\
    \ { return x+y }\n```\n\nThen this\n\n```javascript\nf.call({},2,3)\n```\n\nand\
    \ this\n\n```javascript\nf.apply({},[2,3])\n```\n\nwill both return 5. In both\
    \ cases `this` refers to an empty object.\n\nA more informative example involves\
    \ this function\n\n```javascript\nfunction f(x) { return x+this.y }\n```\n\nwhich\
    \ expects to be executed in the context of a `this` object that contains `y`.\
    \ Execute it this way\n\n```javascript\nf(2)\n```\n\nand `this` will refer to\
    \ the global object. Execution will fail unless `y` has been assigned a value\
    \ globally.\n\nAnother way to execute `f` is\n\n```javascript\nvar obj = {f:f,\
    \ y:3}\nobj.f(2)\n5\n```\n\nThis works because `obj` contains both `y` and `f`.\
    \ If `f` is missing from the object then it won't work.\n\n```javascript\nvar\
    \ obj = {y:3}\nobj.f(2) // nope\n```\n\nWhat `call` and `apply` do is allow `this`\
    \ to refer to a different object than `f` is executed from. For example we can\
    \ execute `f` from the global object with `this.y` taken from a different object\
    \ this way\n\n```javascript\nObject.apply({y:3},f)\n5\n```\n\nTo summarize: functions\
    \ are callable objects, methods are functions, and `this` is determined by the\
    \ context in which a function is executed. You can mess with that context by using\
    \ `call` or `apply`.\n\nYou can read more about `this` in the next section.\n\n\
    #### Question\n\nWhen a function `f` executes, the object pointed to by `this`\
    \ is determined by the context in which it executes. What if that is not wanted?\
    \ Suppose I want the `this` in a function definition to point to the same thing\
    \ regardless of context. That can be accomplished with either `call` or `apply`\
    \ but these functions are unpleasant to use.\n\nThis is a problem you can fix.\
    \ Create a factory method `fixThis` such that\n\n```javascript\nf.fixThis(obj);\n\
    ```\n\nwill return a function just like `f` except that its `this` pointer will\
    \ always reference `obj`. For example\n\n```javascript\nfunction f(z) { return\
    \ z + this.x }\nvar x = '?'\nf('hi')\n'hi?'\nvar obj = {x: '!'}\nvar g = f.fixThis(obj)\n\
    g('hi')\n'hi!'\n```\n\nYou may know that `Function.prototype` already contains\
    \ a function `bind` which behaves like `fixThis`. Using that function would be\
    \ to miss the point of this exercise.\n\n#### Answer\n\nYou probably figured out\
    \ that the definition needs to start this way\n\n```javascript\nFunction.prototype.fixThis\
    \ = function(obj) {\n    ...\n}\n```\n\nand that you need to define a function\
    \ for `fixThis` to return. That function must execute `f` with `apply` or `call`.\
    \ At that point you may have gotten stuck because you were not sure to refer to\
    \ `f`. To get that right you needed to remember two things: `f` is the object\
    \ that `this` will refer to in `fixThis` but that `f` is not the object `this`\
    \ will refer to in the function that `fixThis` returns. If need be, try again\
    \ with this insight in mind.\n\nImplementation of `fixThis`\n\n```javascript\n\
    Function.prototype.fixThis = function(obj) {\n    var that = this;\n    return\
    \ function() {\n        return that.apply(obj,arguments);\n    }\n}\n```\n\nAs\
    \ probably know, `arguments` is pseudo array containing whatever arguments have\
    \ been passed to the function it is contained.\n\n### III. Centering Two Lines\
    \ of Text\n\nJavascript normally runs in a browser and is initiated from an HTML\
    \ page. I have chosen to use basically the same web page for my examples. This\
    \ web page displays two lines of text centered vertically and horizontally. Taking\
    \ a break from the subject of this ebook, I show how centering can be done.\n\n\
    To begin with, I create a separate `div` for each line this way\n\n```html\n<div\
    \ id='upper' class=\"upper_center\"></div>\n<div id='lower' class=\"lower_center\"\
    ></div>\n```\n\nAssuming each `div` will get one line of text I can center them\
    \ horizontally with CSS's `text-align` and vertically by absolutely positioning\
    \ `upper` so that its bottom margin is 50% of the page and `lower` so that its\
    \ top margin is 50% of the page. The next page shows a template for the web pages\
    \ you will be asked to create in the exercises.\n\nTemplate for centering two\
    \ lines\n\n```html\n<!DOCTYPE html>\n<html>\n<header>\n<title>Display from Objects,\
    \ Functions, and Event Loops</title>\n<style>\n.lower_center {\n    position:absolute;\n\
    \    width:100%;\n    text-align:center;\n    top:50%;\n}\n.upper_center {\n \
    \   position:absolute;\n    width:100%;\n    text-align:center;\n    bottom:50%;\n\
    }\n</style>\nSCRIPTS_HERE\n</header>\n<body>\n<div id='upper' class=\"upper_center\"\
    >upper</div>\n<div id='lower' class=\"lower_center\">lower</div>\n<script type=\"\
    text/javascript\">\nINCLUDE_SCRIPT_HERE\n</script>\n</body>\n</html>\n```\n\n\
    If your browser is rather recent you can place text in the `div`s with the `innerText`\
    \ property as in\n\n```javascript\ndocument\n  .getElementById('upper')\n  .innerText\
    \ = \"Hi there!\";\n```\n\nBut I don't care how you do it. Use jQuery if you like.\n\
    \n#### Question\n\nFill in `SCRIPTS_HERE` and `INCLUDE_SCRIPT_HERE` such that\
    \ these two lines\n\n```\nLine one.\nLine two.\n```\n\nare written with `writeMessage(\"\
    Line One\",\"Line Two\")`.\n\n#### Answer\n\n`SCRIPTS_HERE` remove `INCLUDE_SCRIPT_HERE`\n\
    \n```javascript\nfunction writeMessage(line1,line2) {\n    document.getElementById('upper').innerText\
    \ = line1;\n    document.getElementById('lower').innerText = line2;\n}\n\nwriteMessage(\"\
    Line One\",\"Line Two\")\n```\n\nThis complete HTML is available at [Display1.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display1.html).\n\
    \n### IV. Event Loops\n\nYou have probably had some experience with event listeners.\
    \ What this section can do is fill in some details about how things work. It will\
    \ also establish language for use in subsequent sections.\n\nThe first linguistic\
    \ issue is the difference between \"listener\" and \"event handler\". It is minuscule.\
    \ Either can be a function defined by programmers to handle some kind of outside\
    \ event. \"Listener\" emphasizes the source of the event and \"event handler\"\
    \ emphasizes what will be done when the event has happened. I will use the terms\
    \ almost interchangeably.\n\nAssuming this function\n\n```javascript\nfunction\
    \ f(x,y) { return x+y }\n```\n"
