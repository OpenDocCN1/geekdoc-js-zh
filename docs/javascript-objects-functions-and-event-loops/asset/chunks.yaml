    \nA `then/catch` chain\n\n> `p `\n\n> ` .then(f1)    // p1`\n\n> ` .catch(f2)   // p2`\n\
    \n> ` .then(f3)    // p3`\n\n> ` .catch(f4)   // p4`\n\nThe p[i]'s refer to the\
    \ promises created by the various `then`'s and `catch`'s. You can see that the\
    \ first `catch` method belongs to p1 and produces p2, the second `then` belongs\
    \ to p2 and produces p3, and so on.\n\nThe promises generated this way are all\
    \ in a state known as `pending`. In general promises have three states: pending\
    \ (waiting for something to happen), fulfilled (no error), and rejected (error).\
    \ Fulfilled and rejected promises are said to be settled and they have promise\
    \ values.\n\nHow `p` becomes settled is discussed in [Section X](#index_split_049.html_filepos91680).\
    \ When `p` does become settled, a task capable of settling p1 will be enqueued,\
    \ when p1 becomes settled a task capable of settling p2 will be enqueued, and\
