    \ on the sequencing of the `f`[`i`]'s. How promises are created will come up later\
    \ in [Section X](#index_split_049.html_filepos91680) and [Section XI](#index_split_056.html_filepos106371).\n\
    \nAlthough specified differently, sequencing is similar to event queuing, the\
    \ underlying mechanism will cause each `f`[`i`] to be wrapped and queued after\
    \ `f`[`i-1`] has finished.\n\nHowever unlike event queuing, each `f`[`i`] passes\
    \ a value to the next by simply returning that value.\n\nAnother difference is\
    \ that the queuing is not done on the event queue. An additional queue exists\
    \ for use by promises. Because tasks on this additional queue have priority over\
    \ tasks on the event queue, I call it the me-first queue. The real name however\
    \ is the microtask queue.\n\nHere is an example of resequencing the `f`[`i`]'s\n\
    \n> `p.then(f1) `\n\n> ` .then(f3) `\n\nand here is another\n\n> `p.then(f1) `\n\
    \n> ` .then(f2) `\n\n> ` .then(f2a) `\n\n> ` .then(f3) `\n\nOf course not all\
    \ functions can be resequenced in these ways. Those which can include functions\
    \ that act independently of each other and functions that act as filters for each\
    \ other.\n\nA final significant difference with event queuing is that promises\
    \ give better control over error handling. Error handling is supported with a\
    \ `catch` method; `catch` is similar to `then` but responds to error situations.\
