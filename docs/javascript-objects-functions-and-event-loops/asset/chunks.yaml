    click\",`\n\n> `   function aHandler (event) {`\n\n> `      console.log(`\n\n\
    > `          event.pageX,`\n\n> `          event.pageY`\n\n> `      )`\n\n> `   }`\n\
    \n> ` )`\n\nAfter this, whenever a click event happens the run-time system creates\
    \ an event object `E` and wraps `aHandler` with it this way\n\n> `function() { aHandler(E) }`\n\
    \nThe task is then enqueued.\n\nFor a mouse click, `E`'s content will include\
    \ the screen coordinates `pageX` and `pageY` of the place where the mouse was\
    \ when the click happened.\n\nThe queue where such tasks wait for execution is\
    \ usually called an event queue. But event queues may contain tasks that do not\
    \ handle actual events. In an acknowledgement of this, Javascript documentation\
    \ writes “macrotask queue” instead of “event queue”.\n\nNote:\n\n> For those who\
    \ would look this up know that, for silly trademark reasons, official Javascript\
    \ documentation describes “ECMAScript” not “Javascript”.\n\nQuestion\n\nFrom [Section\
    \ III](#index_split_014.html_filepos24867), fill in\n\n> LOAD SCRIPTS HERE\n\n\
    and\n\n> INCLUDE SCRIPT HERE\n\nsuch that, when there is a mouse click over the\
    \ screen, the display lines will be:\n\n> `X coordinate: ``the X coordinate where\
    \ the mouse clicked`\n\n> `Y coordinate: ``the Y coordinate where the mouse clicked`\n\
    \nUse `writeMessage` from [Section III](#index_split_014.html_filepos24867) to\
    \ create the splash page (i.e. the initial screen) with\n\n> `writeMessage('Click','someplace');`\n\
    \nAnswer\n\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE SCRIPT HERE\n\n> `function writeMessage(line1,line2) {`\n\
    \n> `   document.getElementById('upper').innerText = line1;`\n\n> `   document.getElementById('lower').innerText = line2;`\n\
    \n> `}`\n\n> \n\n> `document`\n\n> ` .addEventListener(`\n\n> `   \"click\",`\n\
    \n> `   function aHandler (event) {`\n\n> `     writeMessage(`\n\n> `         'X coord: ' + event.pageX,`\n\
    \n> `         'Y coord: ' + event.pageY`\n\n> `     )`\n\n> `   }`\n\n> ` )`\n\
    \n> \n\n> `writeMessage('Click','someplace');`\n\nThe complete HTML is available\
    \ at [Display2.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display2.html)\n\
    \nV. Multitasking with an Event Loop\n\nIn Javascript when you want to put your\
    \ own task on the event queue, you use the `setTimeout` function. Essentially\
    \ what you are doing is enqueuing a handler for a timing event. For example, to\
    \ cause a function `f` to be applied to arguments `\"one\"` and `\"two\"` after\
    \ 5 seconds have elapsed you would write\n\n> `setTimeout(`\n\n> `    function () { f(\"\
    one \",\"two \") },`\n\n> `    5000`\n\n> `)`\n\nThis creates an anonymous task\
    \ that goes on the event queue after 5000 milliseconds have elapsed.\n\nNote:\n\
    \n> Replace 5000 with 0 if you want the task to go on the queue immediately but\
    \ remember that being placed immediately on the event queue is not the same thing\
    \ as immediately executing.\n\nThe following page shows what you could write to\
    \ repeat a task `t` every half second.\n\nUsing the event queue for repetition.\n\
    \n> `function t() {`\n\n> `   …`\n\n> `   setTimeout( `\n\n> `      function() { t() },`\n\
    \n> `      500`\n\n> `   )`\n\n> `}`\n\nThis looks recursive but it is not. Recursive\
    \ functions call themselves as they would any other function and they remain ready\
    \ to continue executing when the called function returns. The kind of repetition\
    \ `t` shows is different. Instead of calling itself, `t` finishes executing after\
    \ having arranged for the Javascript engine to do the calling. Each execution\
    \ of `t()` returns to the same place in the event loop where another task will\
    \ be chosen for execution.\n\nBefore asking this section's question I want to\
    \ provide you with some data. The next page shows three messages attributed to\
    \ Mark Twain and an array of color declarations. You will use them in your answer.\n\
    \nMessages and Colors\n\n> `var messages = [`\n\n> `     \"Politicians and diapers \"\
     +`\n\n> `        \"should be changed frequently\",`\n\n> `     \"and for the same reason.\"\
    ,`\n\n> `     \"Actions speak louder than words\",`\n\n> `     \"but not nearly as often.\"\
    ,`\n\n> `     \"Don't let schooling interfere\",`\n\n> `      \"with your education\"\
     `\n\n> `    ],`\n\n> `    colors = [\"BBFFFF\", \"FFBBFF\", \"FFFFBB\"];`\n\n\
    Question\n\nFill in\n\n> LOAD SCRIPTS HERE\n\nand\n\n> INCLUDE SCRIPT HERE\n\n\
    such that the display rotates through the three two-line messages in `messages`\
    \ and the background color through the three choices in `colors`. These rotations\
    \ should be independent of each other with the message changing approximately\
    \ each 1500 milliseconds and the background color changing approximately each\
    \ 850 milliseconds.\n\nAnswer\n\nLOAD SCRIPTS HERE\n\nremove\n\nINCLUDE SCRIPT\
    \ HERE\n\n> `var messages = [`\n\n> `   \"Politicians and diapers should be changed frequently\"\
    ,`\n\n> `   \"and for the same reason.\",`\n\n> `   \"Actions speak louder than words\"\
    ,`\n\n> `   \"but not nearly as often.\",`\n\n> `   \"Don't let schooling interfere\"\
    ,`\n\n> `    \"with your education\"`\n\n> `];`\n\n> `var colors = [ \"BBFFFF\"\
    , \"FFBBFF\", \"FFFFBB\" ];`\n\n> \n\n> `function writeMessage(which) {`\n\n>\
    \ `   document.getElementById('upper').innerText = messages[2*which];`\n\n> `   document.getElementById('lower').innerText = messages[2*which+1];`\n\
    \n> `   setTimeout(`\n\n> `       function () { `\n\n> `          writeMessage( (which+1)%3 )`\n\
    \n> `       },`\n\n> `       1500`\n\n> `   )`\n\n> `}`\n\n> \n\n> `function setColor(which) {`\n\
    \n> `   document.bgColor = colors[which];`\n\n> `   setTimeout(`\n\n> `       function () {`\n\
    \n> `          setColor( (which+1)%3 )`\n\n> `       },`\n\n> `       850`\n\n\
    > `   )`\n\n> `}`\n\n> \n\n> `writeMessage(0);`\n\n> `setColor(0);`\n\nThe complete\
    \ HTML is available at [Display3.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display3.html)\n\
    \nVI. Multitasking with Event Queuing\n\nEvent queuing is a name I give to a technique\
    \ that simplifies writing the kind of script you wrote in the previous section's\
    \ exercise. Event queuing replaces `setTimeout` with single-purpose function that\
    \ can wrap and queue other functions. Suppose this\n\n> `function f(x,y) { return x+y }`\n\
    \nwere the function to be wrapped. Instead of doing it this way\n\n> `setTimeout(`\n\
    \n> `   function() { f(2,2) },`\n\n> `   0`\n\n> `);`\n\nevent queuing does it\
    \ this way\n\n> `f.que(2,2)`\n\nThe syntax is pleasingly similar to\n\n> `f(2,2)`\n\
    \nbut the effect is the same as with `setTimeout`."
