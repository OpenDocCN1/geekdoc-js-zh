  trans: "\n\n可以使用你已经见过的技术来实现 `que`：`setTimeout` 将安排实际的入队，而 `apply` 将执行实际的调用。这样 `que`\
    \ 将对任何 `f` 可用，它将存在 `Function.prototype` 中。\n\n下一页展示了我实现 `que` 的首次（不完善的）尝试。\n\n\
    ### 不完善的 `que` 函数\n\n```javascript\nfunction.prototype.que = function() {\n  var\
    \ that = this;\n  setTimeout(\n    function() {\n        that.apply({},arguments)\n\
    \    },\n    0\n  );\n}\n```\n\n这个对 `que` 的定义可以工作，但我对其有三个原因感到不满意：\n\n1. `que`\
    \ 这个名字可能并不总是合适的。\n2. 在不提供对已执行操作通知的情况下，不应该修改 `Function.prototype`。\n3. 需要一种方法来选择\
    \ 0 毫秒以外的延迟。\n\n如果我不是直接定义 `que`，而是定义一个创建 `que` 的工厂函数，那么这三个更改都是可能的。我可以将所需的名称和微秒延迟传递给工厂函数。这些选择将被构建到\
    \ `que` 中，其名称可以是任何值。这是一个示例：\n\n```javascript\ninstallQer('queue',3000)\n'queue'\
    \ has been added to Function.prototype.\n```\n\n这在 `Function.prototype` 中安装了一个方法\
    \ `queue` 并向控制台发送了一条关于安装的消息。对于任何 `f`，该安装允许此语句\n\n```javascript\nf.queue(2,2)\n\
    ```\n\n导致此任务\n\n```javascript\nfunction() { f(2,2) }\n```\n\n在经过 3 秒后入队。\n\n在我实现\
    \ `installQer` 之前，我有一个需要考虑的问题。它关乎被安装方法的可见性。例如，这个循环 \n\n```javascript\nfor(o in\
    \ Function.prototype) console.log(o)\n```\n\n应该显示什么？Javascript 的设计者选择不显示像 `apply`\
    \ 和 `call` 这样的内置函数。你可以随意意意，但我认为通过 `installQer` 安装的方法是类似的，因此也应该是类似的不可见。\n\n这种可见性是由被称为“属性描述符”（property\
    \ descriptor）的东西决定的。Javascript 并不总是描述符，并不是所有属性都有，但许多属性是有的。描述符类似于对象，因为它们有自己的属性，但这些描述符属性仅用于提供有关它们所描述的属性的信息。当然，一条信息是赋值给描述属性的值。该值被放在\
    \ `value` 描述符属性中。另一个描述符属性是 `enumerable`，它决定了被描述属性的可见性。\n\n`Object.defineProperty`\
    \ 用于创建一个带有描述符的属性。如果 `installQer` 的安装要具有与内置函数相同的限制性可见性，我必须使用它。这里是通用的模式：\n\n```javascript\n\
    Object.defineProperty(\nobject,\nproperty name,\ncomplete or partial descriptor\
    \ object\n);\n```\n\n当使用部分描述符对象时，Javascript 会填充默认值。\n\n下一页展示了我对 `installQer` 的实现。\n\
    \n### `installQer`\n\n```javascript\nfunction installQer(desired_name,delay) {\n\
    \  delay = delay || 0;\n  Object.defineProperty(\n    Function.prototype,\n  \
    \  desired_name,\n    { enumerable: false,\n      value: function() {\n      \
    \  var that = this;\n        setTimeout(\n          ()=>that.apply({},arguments),\n\
    \          delay\n        )\n      }\n  );\n  console.log(\n    desired_name +\n\
    \    'has been added to Function.prototype'\n  )\n}\n```\n\n这个脚本包含了你可能没有注意到的 Javascript\
    \ 特性，即 `=>` 的使用。知道 `()=>that.apply({},args)` 代表\n\n```javascript\nfunction(){return\
    \ that.apply({},args)}\n```\n\n一个更多的用法可能是 `(x)=>x+1`。因为事件队列非常有用，我将 `installQer`\
    \ 放在一个名为 [JavascriptLoopTools.js](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndLoops/master/JavascriptLoopTools.js)\
    \ 的脚本中。如果你将 `JavascriptLoopTools.js` 放在包含 HTML 页面的文件夹中，可以通过添加以下代码来让其函数可用\n\n```html\n\
    <script type=\"text/javascript\" src=\"JavascriptLoopTools.js\"></script>\n```\n\
    \n到你的头部文件中。注意：如果这是一场讲座，教室后面会有人告诉我：“你并没有真正移除 `setTimeout`。” 这些围绕着“真正”等词汇语义的反对意见似乎是来自教室后方的。我确实从我们写的脚本中移除了\
    \ `setTimeout`。通过这样做，我让那些脚本变得易读且美观。当然，`setTimeout` 隐藏在 `installQer` 中，所以从某种意义上说，它并没有被移除。\n\
    \n#### 问题\n\n填写并使得显示效果与上一节的练习相同，但可以通过按下 ESC 键停止消息和颜色的循环。实现应该扩展此处理器\n\n```javascript\n\
    document\n.addEventListener(\n  'keydown',\n  function (e) {\n    if(e.code=='Escape')\
    \ {\n      …\n    }\n  }\n)\n```\n\n并使用 `installQer` 代替 `setTimeout`。\n\n####\
    \ 答案\n\n```html\n<script type=\"text/javascript\" src=\"JavascriptLoopTools.js\"\
    ></script>\nvar messages = [\n  \"Politicians and diapers should be changed frequently\"\
    ,\n  \"and for the same reason.\",\n  \"Actions speak louder than words\",\n \
    \ \"but not nearly as often.\",\n  \"Don't let schooling interfere\",\n  \"with\
    \ your education\"\n];\nvar colors = [\"BBFFFF\", \"FFBBFF\", \"FFFFBB\"];\nvar\
    \ running = true;\n\ninstallQer('q1500',1500);\ninstallQer('q850',850);\n\nfunction\
    \ writeMessage(which) {\n  if (!running) return;\n  document.getElementById('upper').innerText\
    \ = messages[2*which];\n  document.getElementById('lower').innerText = messages[2*which+1];\n\
    \  writeMessage.q1500((which+1)%3)\n}\n\nfunction setColor(which) {\n  if (!running)\
    \ return;\n  document.bgColor = colors[which];\n  setColor.q850((which+1)%3)\n\
    }\n\ndocument\n.addEventListener(\n  'keydown',\n  function (e) {\n    if(e.code=='Escape')\
    \ running = false;\n  }\n)\n\nwriteMessage(0);\nsetColor(0);\n```\n\n完整的 HTML\
    \ 可在 [Display4.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndLoops/master/Display4.html)\
    \ 获取。\n\n### 七. 对象函数\n\n由于函数是对象，我们可以赋予它们状态记住从一次执行到下一次所做的事情。以下展示了如何为 `writeMessage`\
    \ 添加状态。\n\n#### 带有状态的 `writeMessage`\n\n```javascript\nfunction writeMessage()\
    \ {\n  if (!running) return;\n  var ms = writeMessage.messages,\n  i = 2*writeMessage.which;\n\
    \  writeMessage.which = (writeMessage.which+1)%3;\n  document.getElementById('upper').innerText\
    \ = ms[i];\n  document.getElementById('lower').innerText = ms[i+1];\n  writeMessage.q1500()\n\
    }\n\nwriteMessage.messages = [\n  \"Politics and diapers should be changed frequently\"\
    ,\n  \"and for the same reason.\",\n  \"Actions speak louder than words\",\n \
    \ \"but not nearly as often.\",\n  \"Don't let schooling interfere\",\n  \"with\
    \ your education\"\n];\nwriteMessage.which = 0;\n```\n\n你可以看到这个状态不仅跟踪了下一个要写的消息，而且遵循了通用规则：“不要在全局命名空间中填充不需要的名称。”\n\
    \n"
- fmt: "\n```html\n<script src=\"JavascriptEventLoopTools.js\"></script>\n```\n\n\
    INCLUDE SCRIPT HERE\n\n```javascript\nvar running = true;\n\ninstallQer('q1500',1500);\n\
    installQer('q850',850);\n\n// Stateful writeMessage\nfunction writeMessage() {\n\
    \  if(!running) return;\n  var ms = writeMessage.messages,\n      i = 2*writeMessage.which;\n\
    \  writeMessage.which = (writeMessage.which+1)%3;\n  document.getElementById('upper').innerText\
    \ = ms[i];\n  document.getElementById('lower').innerText = ms[i+1];\n  writeMessage.q1500()\
    \   // repeating\n}\nwriteMessage.messages = [\n    \"Politicians and diapers\
    \ should be changed frequently\",\n    \"and for the same reason.\",\n    \"Actions\
    \ speak louder than words\",\n    \"but not nearly as often.\",\n    \"Don't let\
    \ schooling interfere\",\n    \"with your education\"\n];\nwriteMessage.which\
    \ = 0;\n\n// Stateful setColor\nfunction setColor() {\n  if(!running) return;\n\
    \  var cs = setColor.colors,\n      i = setColor.which;\n  setColor.which = (setColor.which+1)%3;\n\
    \  document.bgColor = cs[i];\n  setColor.q850()   // repeating\n}\nsetColor.colors\
    \ = [ \"BBFFFF\", \"FFBBFF\", \"FFFFBB\" ];\nsetColor.which=0;\n\n// Keystroke\
    \ Event Handler\ndocument\n  .addEventListener(\n    'keydown',\n    function\
    \ (e) {\n      if(e.code=='Escape') running = false;\n    } \n  );\n\n// Start\n\
    writeMessage();\nsetColor();\n```\n\nThe complete HTML is available at [Display5.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/Display5.html)\n\
    \n## VIII. Promises\n\nSuppose you have three functions `f1`, `f2`, and `f3`.\
    \ Suppose further you want `f2` to execute after `f1` has finished, but not necessarily\
    \ immediately after. Instead you want already queued tasks to have their turn.\
    \ Suppose further that you want `f3` to execute after `f2` in the same way. With\
    \ the event queuing technique you would do something like the following.\n\nUsing\
    \ `f1.que`, `f2.que`, and `f3.que` sequentially\n\n```javascript\nfunction f1(`<f1\
    \ arg>`) {\n  ...\n  f2.que(...)\n}\nfunction f2(`<f2 arg>`) {\n  ...\n  f3.que(...)\n\
    }\nfunction f3(`<f3 arg>`) {\n  ...\n}\n\nf1.que(`<f1 arg>`)\n```\n\nThe `que`\
    \ method wraps each `f[i]` in a task with an argument of your choice and places\
    \ the task on the event queue.\n\nNotice that the functions `f1`, `f2`, and `f3`\
    \ are not independent of each other: `f2` is mentioned in `f1` and `f3` in `f2`.\
    \ This can make it hard to reuse these functions for other purposes. For example,\
    \ it will be hard to use `f1` in any setting where it is not followed by `f2`.\n\
    \nPromises allow `f1`, `f2`, and `f3` to be decoupled from each other. The next\
    \ page shows how the decoupling works. `f1`, `f2`, and `f3` with a promise\n\n\
    ```javascript\nfunction f1(`f1 arg`) {\n  ...\n  return `<f1 val>`;\n}\nfunction\
    \ f2(`f2 arg`) {\n  ...\n  return `<f2 val>`;\n}\nfunction f3(`f3 arg`) {\n  ...\n\
    \  return `<f3 val>`;\n}\np.then(f1)\n  .then(f2)\n  .then(f3)\n```\n\nHere `p`\
    \ is a promise that starts things. All promises have a `then` method which creates\
    \ another promise. There is much more to say about `p` and how `<f1 arg>` comes\
    \ the picture, but for now I'll focus on the sequencing of `f[i]`. How promises\
    \ are created will come up later in [Section X](#index_split_049.html_filepos9680)\
    \ and [Section XI](#index_split_056.html_filepos106371).\n\nAlthough specified\
    \ differently, sequencing is similar to event queuing, the underlying mechanism\
    \ will cause each `f[i]` to be wrapped and queued after `f[i-1]` has finished.\
    \ Unlike event queuing, each `f[i]` passes a value to the next by simply returning\
    \ that value.\n\nAnother difference is that the queuing is not done on the event\
    \ queue. An additional queue exists for use by promises. Because tasks on this\
    \ additional queue have priority over the event queue, I call it the me-first\
    \ queue. The real name however is microtask queue.\n\nHere is an example of resequencing\
    \ the `f[i]`:\n\n```javascript\np.then(f1)\n  .then(f3)\n```\n\nand here is another\n\
    \n```javascript\np.then(f1)\n  .then(f2)\n  .then(f2a)\n  .then(f3)\n```\n\nOf\
    \ course not all functions can be resequenced in these ways. Those which can include\
    \ functions that act independently of each other and functions that act as filters\
    \ for each other.\n\nA final significant difference with event queuing is that\
    \ promises give better control over error handling. Error handling is supported\
    \ with a `catch` method; `catch` is similar to `then` but responds to error situations.\
    \ The next page shows how `catch` methods might be interleaved with `then` methods.\n\
    \nA `then/catch` chain\n\n```javascript\np\n  .then(f1) // p1\n  .catch(f2) //\
    \ p2\n  .then(f3) // p3\n  .catch(f4) // p4\n```\n\nThe `p[i]`s refer to the promises\
    \ created by the various `then`s and `catch`s. You can see that the first `catch`\
    \ method belongs to `p1` and produces `p2`, the second `then` belongs to `p2`\
    \ and produces `p3`, and so on.\n\nThe promises generated this way are all in\
    \ a state known as `pending`. In general promises have three states: pending (waiting\
    \ for something to happen), fulfilled (no error), and rejected (error). Fulfilled\
    \ and rejected promises are said to be settled and they have promise values.\n\
    \nHow `p` becomes settled is discussed in [Section X](#index_split_049.html_filepos9680).\
    \ When `p` does become settled, a task capable of settling `p1` will be enqueued,\
    \ when `p1` becomes settled a task capable of settling `p2` will be enqueued,\
    \ and so on.\n\nUnlike event queuing, promises have a mechanism for transferring\
    \ data from one step to the next. This mechanism passes the promise value of a\
    \ settled promise to the next `f[i]`.\n\nThe way any `p[i]` will be settled depends\
    \ on whether it was generated with `then` or `catch` and on whether the previous\
