    ['decr', 'val']\n```\n\n原因是因为 `counter2` 可以通过继承从 `counter` 获取数据值，但它无法修改它们。当需要修改时，会在\
    \ `counter2` 中创建一个新属性。此后，从 `counter2` 获取的属性将是 `counter2` 自身的属性，而不是它在 `counter`\
    \ 中原始的属性。\n\n这意味着 `counter` 可以用于为任何作为其 `[[Prototype]]` 的对象提供初始值。\n\n### II. 函数\n\
    \n函数是可调用的对象，这意味着：\n\n- 它们是包含函数主体（很可能是编译后的形式）的对象。\n- 它们的继承链可以访问到执行该函数主体的方法。\n\n\
    函数对象之所以可以访问执行其代码的方法，是因为它们的继承链中被插入了 `Function.prototype`。在 `Function.prototype`\
    \ 中有两个可以执行函数的方法，即 `apply` 和 `call`。\n\n下面的简短交互过程展示了函数的继承链。\n\n#### 澄清 `Function.prototype`\n\
    \n```javascript\nvar getP = Object.getPrototypeOf;\nfunction f() {}\ngetP(f)===Function.prototype\n\
    true\ngetP(Function.prototype)===Object.prototype\ntrue\n```\n\n`apply` 和 `call`\
    \ 都需要一个参数，用于指定在函数执行时 `this` 指向哪个对象。此外，这两个函数都接受普通参数列表。它们唯一的区别在于参数列表的指定方式。你可以在下面的示例中看到这种区别。\n\
    \n#### `call` 和 `apply` 的区别\n\n假设有如下定义\n\n```javascript\nfunction f(x,y) { return\
    \ x+y }\n```\n\n那么这个\n\n```javascript\nf.call({},2,3)\n```\n\n以及这个\n\n```javascript\n\
    f.apply({},[2,3])\n```\n\n都将返回 5。在两种情况下，`this` 都指向一个空对象。\n\n一个更具信息量的示例涉及这个函数\n\
    \n```javascript\nfunction f(x) { return x+this.y }\n```\n\n它期望在一个包含 `y` 的 `this`\
    \ 对象上下文中执行。以这种方式执行它\n\n```javascript\nf(2)\n```\n\n此时 `this` 将指向全局对象。除非全局已赋值了\
    \ `y`，否则执行将失败。\n\n另一种执行 `f` 的方法是\n\n```javascript\nvar obj = {f:f, y:3}\nobj.f(2)\n\
