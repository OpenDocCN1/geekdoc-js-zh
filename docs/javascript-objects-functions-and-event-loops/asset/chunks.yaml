    \ number of microseconds before resolving with\n  // the given promise value --\
    \ allows tasks\n  // on the event queue to execute before the\n  // effects of\
    \ settling happen\n  micros = micros || 0;\n  … \n);\n}\n```\n\nFinish the implementation.\
    \ You can test your answer by replacing:\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"JavascriptLoopTools.js\"></script>\n```\n\nin Display6.html with:\n\n\
    ```html\n<script type=\"text/javascript\">\nyour definition of hesitating\n</script>\n\
    ```\n\n### Answer\n\nThis answer also appears in the `JavascriptLoopTools.js`\
    \ file.\n\n```javascript\nfunction hesitating(\n  micros,    // number of microseconds\
