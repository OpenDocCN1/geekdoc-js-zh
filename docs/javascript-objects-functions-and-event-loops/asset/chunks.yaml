    \ on the outcome from executing `f`[`i`]. Its promise value arises from the value\
    \ `f`[`i`] returns.\n\nPrevious promise fulfilled, p[i] from `catch`:\n\nIn this\
    \ case `f`[`i`] will not be executed; p[i] will be fulfilled and its promise value\
    \ will be the same as the previous promise value.\n\nPrevious promise rejected,\
    \ p[i] from `then`:\n\nIn this case `f`[`i`] will not be executed; p[i] will be\
