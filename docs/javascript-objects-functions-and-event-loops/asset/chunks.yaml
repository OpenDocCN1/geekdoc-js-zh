  trans: "\n\n如果 `p1` 或 `p2` 都没有被拒绝，则 `f3` 将跳过，`f4` 将接收 `f2` 返回的值。\n\n只有当被拒绝的 promise\
    \ 传播到它时，最后的 `catch` 才会执行 `f5`。\n\n## Note\n\n1.  你可能会好奇事件队列相比 Promise 有什么优势。最显而易见的优势是事件队列更容易理解。\n\
    2.  不那么明显但很重要的是，事件队列与事件处理器配合得很好。由于 Promise 的状态改变（settling）是通过放在微任务队列（me-first\
    \ queue）上的任务完成的，Promise 程序员必须小心不要创建一个会导致事件队列任务饥饿的 `then/catch` 链。那会导致脚本对用户输入无响应。\n\
    3.  我相信 Promise 响应器的执行顺序灵活性会促进工具函数的开发，就像 Unix 管道的灵活性一样。\n\n## Question\n\n假设有两个已就绪的\
    \ promise `p` 和 `q`，其中 `p` 被以值为 `'good'` 解决，而 `q` 被以值为 `'bad'` 拒绝。同样假设我们有这样一个函数\n\
    \n```javascript\nfunction s(x) {\n    console.log(x); return x+x;\n}\n```\n\n\
    这个问题包含两个部分，a 和 b。\n\n### Question: Part a\n\n如果执行以下代码，控制台会打印什么，`p1`、`p2` 和 `p3`\
    \ 会发生什么变化？\n\n```javascript\np                  // p1\n  .catch(s)          //\
    \ p2\n  .then(s);          // p3\nconsole.log(\"That's All Folks!\")\n```\n\n\
    ### Answer: Part a\n\n在 `p1`、`p2` 和 `p3` 创建期间，控制台上没有任何显示。第一个出现的将“That's All Folks!!”\n\
    \n稍后，promise `p2` 将以值为 `'good'` 解决。`.catch(s)` 中的 `s` 不执行。\n\n但稍后，`.then(s)` 中的\
    \ `s` 将执行，导致打印出“good”。promise `p3` 将以值为 `'goodgood'` 解决。\n\n所以你在屏幕上看到的是：\n\n```text\n\
    That's All Folks!\ngood\n```\n\n### Question: Part b\n\n如果执行以下代码，控制台会打印什么，`p1`、`p2`\
    \ 和 `p3` 会发生什么变化？\n\n```javascript\nq                  // p1\n  .catch(s)    \
    \      // p2\n  .catch(s)          // p3\n  .then( () => q )   // p4\n  .catch(s)\
    \          // p5\nconsole.log(\"That's All Folks!\")\n```\n\n### Answer: Part\
    \ b\n\n同样，“That's All Folks!”将第一个出现在控制台上。\n\n第一个 `.catch(s)` 中的 `s` 将执行，导致控制台上打印出“bad”。promise\
    \ `p2` 将以值为“badbad” 解决。\n\n第二个 `.catch(s)` 中的 `s` 不执行。promise `p3` 将以值为“badbad”\
    \ 解决。\n\n`()=>q` 将执行。promise `p4` 将以值为“bad”被拒绝（与 `q` 的 promise 值相同）。\n\n第三个 `.catch(s)`\
    \ 中的 `s` 将执行，导致屏幕上打印出 `bad`。promise `p5` 将以值为 `badbad` 解决。\n\n```text\nThat's\
    \ All Folks!\nbad\nbad\n```\n\n## IX. 使用 Promises 的多任务示例\n\n这一部分主要是一个练习，要求你用 promises\
    \ 重写 第 VII 节 中的多任务练习。然而，在你完成之前，你需要一种生成初始 promise 的方法。`hesitating` 工厂方法可以做到这一点。它可以在\
    \ [JavascriptEventLoopTools.js](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/blob/master/JavascriptEventLoopTools.js)\
    \ 中找到。你之前在 第 VI 节 中用过这个文件。\n\n这条语句\n\n```javascript\nvar p = hesitating(`<microseconds>`)\n\
    ```\n\n将创建一个 promise，它将等待指定的微秒数，然后以 `undefined` 作为 promise 值解决。在等待期间，事件队列上的任务可以执行。使用\
    \ `hesitating` 是进行下一个练习最简单的方法。\n\n### Question\n\n重做 第 VII 节 中的多任务练习。填充\n\n```text\n\
    LOAD SCRIPTS HERE\n```\n\n以及\n\n```text\nINCLUDE SCRIPT HERE\n```\n\n使得事件队列方法论被\
    \ promises 替代。\n\n### Answer\n\n这里不需要在 `Function.prototype` 中安装任何东西。相反，`hesitating`\
    \ 在 `writeMessage` 和 `setColor` 中都被使用了。\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"JavascriptEventLoopTools.js\"></script>\n```\n\n```javascript\nvar running\
    \ = true;\n\n// 有状态的 writeMessage\n\nfunction writeMessage() {\n    if( !running\
    \ ) return;\n    var ms = writeMessage.messages,\n    i = writeMessage.which;\n\
    \    writeMessage.which = (i+1)%3;\n    document.getElementById('upper').innerText\
    \ = ms[i];\n    document.getElementById('lower').innerText = ms[i+1];\n    hesitating(1500).then(writeMessage);\n\
    }\n\nwriteMessage.messages = [\n\"Politicians should be changed frequently\",\n\
    \"and not as often\",\n\"Actions speak louder than words\",\n\"for the reason\"\
    ,\n\"Don't let interfere with your education\"\n];\nwriteMessage.which = 0;\n\n\
    // 有状态的 setColor\n\nfunction setColor() {\n    if( !running ) return;\n    var\
    \ cs = setColor.messages,\n    i = setColor.which;\n    setColor.which = (i+1)%3;\n\
    \    document.getElementById('upper').innerText = cs[i];\n    document.getElementById('lower').innerText\
    \ = cs[i+1];\n    hesitating(850).then(setColor);\n}\n\nsetColor.messages = [\n\
    \"FFFF\",\n\"BB\",\n\"FFFF\"\n];\nsetColor.which = 0;\n\n// 按键事件\n\ndocument.addEventListener('keydown',\
    \ function (e) {\n    if(e.code=='Escape') {\n        running = false;\n    }\n\
    });\n\n// 开始\n\nwriteMessage();\nsetColor();\n```\n\n"
- fmt: "\nThe second example also requires you to have an operational web server capable\
    \ of serving `Sample.txt`. In theory you could just fetch `Sample.txt` from Github\
    \ but cross origin security restrictions prohibit that. The easiest way to do\
    \ the `$.ajax` exercise is to have `Sample.txt` and your HTML page in the same\
    \ folder on your computer and set up your own web server. You can easily arrange\
    \ for this through Node.js's `http-server` module. Install `http-server` with\
    \ Node.js's `npm` and then run it from a folder containing `Sample.txt`. Be sure\
    \ nothing you want to keep private is accessible through that folder.\n\nNote:\n\
    > If you don't want to install these things, you can always answer this section's\
    \ question with a paper and pencil effort. This is the only section in which you\
    \ need these installations.\n\n## Reading a File\n\nIn Node.js you can read a\
    \ file asynchronously this way:\n\n```javascript\nvar fs = require('fs');\nfs.readFile('Sample.txt','utf8',callback)\n\
    ```\n\nwhere `callback` has been defined to handle both failed and successful\
    \ reads like this:\n\n```javascript\nfunction callback(err,data) {\n  if(err)\
    \    \"handle error with\" err\n  then        \"handle success with\" data\n}\n\
    ```\n\nYour operating system is an outside force that a script using `readFile`\
    \ must wait on. The script could block until the read operation is finished (which\
    \ would be the case with `readFileSync`) or it could make use of a callback as\
    \ shown above with `readFile`. Using `readFile` is exactly the kind of situation\
    \ that fits into a promise's executor. The next page shows how that might be done.\n\
    \n### Reading with a promise.\n\n```javascript\nvar p = new Promise(\n    function\
    \ (resolve,reject) {\n      function callback(err,txt) {\n        if(err)    reject(err)\n\
    \        then        resolve(txt)\n      }\n      fs.readFile(\n        'Sample.txt',\n\
    \        'utf8',\n        callback\n      )\n    }\n)\n```\n\nNotice I have not\
    \ tried to process the text or the error message in the callback. I am letting\
    \ the promise decouple that processing from this request. Given these functions\
    \ for displaying errors and file contents:\n\n```javascript\nfunction showError(e)\
    \ {\n  console.log(\n      \"ERROR:\\n\" + e\n  )\n}\n\nfunction showText(t) {\n\
    \  console.log(t)\n}\n```\n\nhere is one way the processing might be done:\n\n\
    ```javascript\np.then(showText).catch(showError);\n```\n\nand here is another:\n\
    \n```javascript\np.catch(showError).then(showText);\n```\n\nThe difference is\
    \ that with the second way any error that happened to be thrown writing the text\
    \ to the console wouldn't be handled.\n\nNote:\n> You would think that `showText`\
    \ would not be needed as it could be replaced with `console.log`. It is one of\
    \ Node.js's quirks that this does not always work.\n\n## Ajax\n\nSimple requests\
    \ for information over the world wide web can be made with JQuery's `ajax` method\
    \ as shown in the following.\n\n### An ajax request\n\n```javascript\n$.ajax({\n\
    \  url: \"Sample.txt\", \n  success: \"function to process text\"\n  error: \"\
    function to process error object\"\n});\n```\n\nI am going to put this in a web\
    \ page that requests the file `Sample.txt` when the user clicks on a button. Two\
    \ tweaks are needed to the template shown in [Section III](#index_split_014.html_filepos24867):\n\
    \n1. A button is needed. Insert this `<button id='aButton'>Explain Things</button>`\
    \ into the `upper` `div`.\n2. The fetched text may require more room than can\
    \ fit in half the page. Shift things upward by changing the bottom margin of `upper`\
    \ to %80% and the top margin of `lower` to 22%.\n\nThe 2% gap gives the button\
    \ some room before the text starts.\n\n## Question\n\nFill in\n\n```html\nLOAD\
    \ SCRIPTS HERE\n```\n\nand\n\n```html\nINCLUDE SCRIPT HERE\n```\n\nsuch that the\
    \ web page will fetch (through `$.ajax`) and display `Sample.txt` when the user\
    \ clicks on the button.\n\nKnow that it is the `'click'` event you want your `aButton`\
    \ listener to respond to. Your response should create an appropriate promise with\
    \ `then/catch` chain. If an error is reported, you can extract an error message\
    \ from the `statusText` property of the error event.\n\nYou can write whatever\
    \ you like on the page before the user clicks on the button. This is a exercise,\
    \ not an attempt to define production code. I am ignoring important things like\
    \ how to let the user specify the file name and what to do if the network request\
    \ times out I am keeping `Sample.txt` hard-coded into the script. Rename the file\
    \ if you want to test the error.\n\n### Answer\n\nAssuming the HTML display in\
    \ [Section III](#index_split_04.html_filepos2867) has been tweaked as above the\
    \ answer is:\n\n```html\nLOAD SCRIPTS\n<script type=\"text/javascript\" src=\"\
    JavascriptLoopTools.js\"></script>\nINCLUDE SCRIPT HERE\n```\n\n```javascript\n\
    function writeMessage(txt) {\n  document.getElementById('lower').innerText = txt;\n\
    }\n\ndocument.getElementById('aButton').addEventListener('click', function() {\n\
    \  var p = new Promise(\n    function(resolve,reject) {\n      $.ajax({\n    \
    \    url: \"Sample.txt\", \n        success: resolve,\n        error: reject \n\
    \      })\n    }\n  );\n  p.then(writeMessage).catch(err => writeMessage(err.statusText))\n\
    })\n```\n\nThe complete answer is available as [Display7.html](https://github.com/J-Adrian-Zimmer/JavascriptObjectsAndEventLoops/master/Display7.html).\n\
    \n## XI. Implementing hesitating\n\nThe `hesitating` factory method, described\
