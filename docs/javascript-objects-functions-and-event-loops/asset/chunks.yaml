    \ construction, common variation\n\n```javascript\nfunction Calc(x,y) {\n    this.x\
    \ = x;\n    this.y = y;\n}\nCalc.prototype.add = function() {\n    return this.x+this.y;\n\
    };\nCalc.prototype.double = function () {\n    this.x = 2*this.x;\n    this.y\
