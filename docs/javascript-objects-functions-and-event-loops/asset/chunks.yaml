    \nPrevious promise rejected, p[i] from `catch`:\n\nIn this case `f`[`i`] will\
    \ be wrapped for execution; its argument will be the previous promise value; p[i]\
    \ will be fulfilled or rejected depending on the outcome from `f`[`i`]. Its promise\
    \ value arises from the value `f`[`i`] returns.\n\nNote:\n\n> When `f`[`i`] is\
    \ executed, the outcome can be a thrown error, a non-promise return value or a\
    \ returned promise. If a thrown error, p[i] is rejected with the error object\
    \ as its value. If a non-promise return value `rv`, p[i] is fulfilled with promise\
    \ value `rv`. If the return value `rp` is a promise, p[i] is given the same state\
    \ as `rp`.\n\nThe slightly more complex `then/catch` chain on the next page illustrates\
    \ how error handling can work. Take the time to think about the ensuing explanation.\n\
    \nA `then/catch` chain\n\n> `p             // assume fulfilled `\n\n> ` .then(f1)    // p1`\n\
    \n> ` .then(f2)    // p2`\n\n> ` .catch(f3)   // p3`\n\n> ` .then(f4)    // p4`\n\
    \n> ` .catch(f5)   // p5`\n\nIf `f1` throws an error, `f2` will be skipped and\
    \ `f3` will have a chance to repair the problem. If `f3` executes and simply returns\
    \ a value, then that value will be assumed to be fulfilled and processing will\
    \ continue with `f4`."
