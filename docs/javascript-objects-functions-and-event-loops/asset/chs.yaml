  \ `counter2` 中创建一个新属性。此后，从 `counter2` 获取的属性将是 `counter2` 自身的属性，而不是它在 `counter` 中原始的属性。\n\
  \n这意味着 `counter` 可以用于为任何作为其 `[[Prototype]]` 的对象提供初始值。\n\n## II. 函数\n\n函数是可调用的对象，这意味着：\n\
  \n- 它们是包含函数主体（很可能是编译后的形式）的对象。\n- 它们的继承链可以访问到执行该函数主体的方法。\n\n函数对象之所以可以访问执行其代码的方法，是因为它们的继承链中被插入了\
