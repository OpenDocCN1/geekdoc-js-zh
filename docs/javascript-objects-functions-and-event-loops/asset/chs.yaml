  \ `apply` 的作用是允许 `this` 指向与执行 `f` 时不同的对象。例如，我们可以从全局对象执行 `f`，并通过这种方式从另一个对象获取 `this.y`\n\
  \n```javascript\nObject.apply({y:3},f)\n5\n```\n\n总结：函数是可调用的对象，方法是函数，而 `this` 由函数执行时的上下文决定。你可以通过使用\
  \ `call` 或 `apply` 来处理该上下文。\n\n你可以在下一节中阅读更多关于 `this` 的内容。\n\n### 问题\n\n当函数 `f` 执行时，`this`\
  \ 指向的对象由其执行时的上下文决定。但如果我不希望这样呢？假设我想让函数定义中的 `this` 无论上下文如何都指向相同的内容。这可以通过 `call` 或\
  \ `apply` 实现，但这些函数用起来并不好用。\n\n这是一个你可以解决的问题。创建一个工厂方法 `fixThis`，使得\n\n```javascript\n\
  f.fixThis(obj);\n```\n\n它会返回一个与 `f` 相似的函数，不同之处在于它的 `this` 指针将始终引用 `obj`。例如\n\n```javascript\n\
