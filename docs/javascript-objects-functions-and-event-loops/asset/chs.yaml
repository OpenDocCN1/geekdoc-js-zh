- "# Javascript：对象、函数与事件循环\n\n\n\n![](img/calibre_cover.jpg)\n\n\n\n\n\n\n版权所有 2017\
  \ J Adrian Zimmer\n\n保留所有权利。允许购买者出于个人目的进行复制，前提是购买者采取合理措施防止他人进一步复制。\n\n版本：1.0\n\n\
  本书有两个目录。一个是章节的注释列表；另一个列出了每个主要代码段的列表。\n\n\n## 前言\n\n《Javascript：对象、函数与事件循环》并不是一本入门书籍，也没有涉及过多的细节。相反，它深入探讨了几个其\
  \ Javascript 变让许多程序员感到困惑的概念，即对象、函数、承诺、事件循环编程以及 Javascript 伪造类的方式。其目的是为继续构建对 Javascript\
  \ 的理解提供一个坚实的基础。为此，每个章节都包含一个练习题，你应该在翻页查看答案之前尝试完成。即使你没有完成练习题，尝试的过程也会让答案更有意义，并让后续章节更易理解。\n\
  \n本书假设你已经了解了一些 Javascript，并熟悉如 Java 和 Python 等语言中基于类的面向对象。\n\n本电子书有一个 [Github 仓库](https://github.com/J-Adrian-Zimmer/JavascriptObjectsFunctionsAndEventLoops/)，可以在那里找到练习答案的可下载副本。它还包含了两个实用的工厂方法。\n\
  \n请注意，本电子书中脚本和交互会话的格式并不是为了作为范。相反，它的目的是产生短行，以便在小屏幕上更容易阅读脚本。\n\n你可以通过开头为 `>` 的代码行来识别交互会话。它们转录自\
  \ [Node.js](https://nodejs.org/) 解释器，但转录中删除了许多 `undefined`。例如\n\n```\n> var x =\
  \ 'hi'\n> undefined\n> > console.log(x)\n> hi\n> undefined\n```\n\n仅转录为：\n\n```\n\
  > var x = 'hi'\n> > console.log(x)\n> hi\n```\n\n`var` 和 `console.log` 实际上都会返回 `undefined`，但在转录中看到这一点很困惑，因为我们并不认为它们会返回任何内容。\n\
  \n## I. 对象继承\n\nJavascript 中的一个计数对象可以这样定义：\n\n```javascript\nvar counter = {\n \
  \ val: 0,\n  incr: function() {\n    this.val += 1;\n  }\n}\n```\n\n不要将其与类混淆。它是一个对象。正如你将看到的，`prototype`\
  \ 成为其他对象的 [[Prototype]]。许多对象都有一个名为 `prototype` 的属性。正如你将看到的，`prototype` 成为其他对象的 [[Prototype]]。它们并不是它们所所属对象的\
  \ [[Prototype]]。\n\n例如，`Object.prototype` 成为大多数其他对象继承链中的最后一个对象。因此，大多数对象都可以访问 `toString`\
  \ 方法，因为 `toString` 存在于 `Object.prototype` 中。\n\n`getPrototypeOf` 方法返回其参数在继承链中的直接前驱。你可以将其构想为“父类”（super）对象。它通常被称为对象的\
  \ [[Prototype]]。\n\n获取“自身”（own）属性名称意味着获取对象本身所拥有的属性，而不是从其他对象继承而来的属性。\n\nJavascript\
  \ 有一个内置对象 `Object`，其方法帮助操作对象。两个示例方法是 `getOwnPropertyNames` 和 `getPrototypeOf`。当应用于\
  \ `counter` 时，它们产生结果：\n\n```\n> Object.getOwnPropertyNames(counter)\n['val', 'incr']\n\
  ```\n\n以及\n\n```\n> var getP = Object.getPrototypeOf;\n> getP(counter) === Object.prototype\n\
  true\n```\n\n`Object` 中还有其他实用的函数。其中一个我将使用 `Object.create`，它可以创建一个具有指定 [[Prototype]]\
  \ 的空对象。特别是这个表达式\n\n```\nObject.create(obj)\n```\n\n会创建一个 [[Prototype]] 为 `obj` 的新空对象。\n\
  \n### 问题\n\n按上述实现 `counter`，然后\n\n1. 创建 `counter2`，它继承自 `counter` 并添加一个 `decr` 方法，使\
  \ `val` 减 1。\n2. 检查以下每个操作\n   `Object.getOwnPropertyNames(counter2)`\n   `Object.getOwnPropertyNames(counter)`\n\
  \   返回什么。从目前的内容来看答案并不显而易见，所以请尝试一下。\n\n### 答案\n\n通过这种方式创建 `counter2`：\n\n```javascript\n\
  var counter2 = Object.create(counter);\ncounter2.decr = function() { this.val -=\
  \ 1 }\n```\n\n`counter` 的自身属性显然是\n\n```\n> Object.getOwnPropertyNames(counter)\n\
  ['val', 'incr']\n```\n\n然而，你看到的顺序将取决于 Javascript 引擎的实现。\n\n如果你对 `counter2` 的自身属性没有两个不同的答案，那么你漏掉了什么。当你执行\
  \ `incr` 或 `decr` 时，情况会发生变化。\n\n\n\n\n\n### 创建时\n\n```\nObject.getOwnPropertyNames(counter2)\n\
  ['decr']\n```\n\n但在执行了 `counter2.incr` 或 `counter2.decr` 之一后，你将得到\n\n```javascript\n\
  Object.getOwnPropertyNames(counter2)\n['decr', 'val']\n```\n\n原因是因为 `counter2` 可以通过继承从\
  \ `counter` 获取数据值，但它无法修改它们。当需要修改时，会在 `counter2` 中创建一个新属性。此后，从 `counter2` 获取的属性将是\
  \ `counter2` 自身的属性，而不是它在 `counter` 中原始的属性。\n\n这意味着 `counter` 可以用于为任何作为其 `[[Prototype]]`\
  \ 的对象提供初始值。\n\n## II. 函数\n\n函数是可调用的对象，这意味着：\n\n- 它们是包含函数主体（很可能是编译后的形式）的对象。\n- 它们的继承链可以访问到执行该函数主体的方法。\n\
  \n函数对象之所以可以访问执行其代码的方法，是因为它们的继承链中被插入了 `Function.prototype`。在 `Function.prototype`\
  \ 中有两个可以执行函数的方法，即 `apply` 和 `call`。\n\n下面的简短交互过程展示了函数的继承链。\n\n### 澄清 `Function.prototype`\n\
  \n```javascript\nvar getP = Object.getPrototypeOf;\nfunction f() {}\ngetP(f)===Function.prototype\n\
  true\ngetP(Function.prototype)===Object.prototype\ntrue\n```\n\n`apply` 和 `call`\
  \ 都需要一个参数，用于指定在函数执行时 `this` 指向哪个对象。此外，这两个函数都接受普通参数列表。它们唯一的区别在于参数列表的指定方式。你可以在下面的示例中看到这种区别。\n\
  \n### `call` 和 `apply` 的区别\n\n假设有如下定义\n\n```javascript\nfunction f(x,y) { return\
  \ x+y }\n```\n\n那么这个\n\n```javascript\nf.call({},2,3)\n```\n\n以及这个\n\n```javascript\n\
  f.apply({},[2,3])\n```\n\n都将返回 5。在两种情况下，`this` 都指向一个空对象。\n\n一个更具信息量的示例涉及这个函数\n\n\
  ```javascript\nfunction f(x) { return x+this.y }\n```\n\n它期望在一个包含 `y` 的 `this` 对象上下文中执行。以这种方式执行它\n\
  \n```javascript\nf(2)\n```\n\n此时 `this` 将指向全局对象。除非全局已赋值了 `y`，否则执行将失败。\n\n另一种执行 `f`\
  \ 的方法是\n\n```javascript\nvar obj = {f:f, y:3}\nobj.f(2)\n5\n```\n\n这之所以有效是因为 `obj`\
  \ 同时包含了 `y` 和 `f`。如果对象中缺少 `f`，则无法工作。\n\n```javascript\nvar obj = {y:3}\nobj.f(2)\
  \ // 不行\n```\n\n`call` 和 `apply` 的作用是允许 `this` 指向与执行 `f` 时不同的对象。例如，我们可以从全局对象执行 `f`，并通过这种方式从另一个对象获取\
  \ `this.y`\n\n```javascript\nObject.apply({y:3},f)\n5\n```\n\n总结：函数是可调用的对象，方法是函数，而\
  \ `this` 由函数执行时的上下文决定。你可以通过使用 `call` 或 `apply` 来处理该上下文。\n\n你可以在下一节中阅读更多关于 `this`\
  \ 的内容。\n\n### 问题\n\n当函数 `f` 执行时，`this` 指向的对象由其执行时的上下文决定。但如果我不希望这样呢？假设我想让函数定义中的 `this`\
  \ 无论上下文如何都指向相同的内容。这可以通过 `call` 或 `apply` 实现，但这些函数用起来并不好用。\n\n这是一个你可以解决的问题。创建一个工厂方法\
  \ `fixThis`，使得\n\n```javascript\nf.fixThis(obj);\n```\n\n它会返回一个与 `f` 相似的函数，不同之处在于它的\
  \ `this` 指针将始终引用 `obj`。例如\n\n```javascript\nfunction f(z) { return z + this.x }\n\
  var x = '?'\nf('hi')\n'hi?'\nvar obj = {x: '!'}\nvar g = f.fixThis(obj)\ng('hi')\n\
  'hi!'\n```\n\n你可能知道 `Function.prototype` 已经包含一个行为与 `fixThis` 相似的函数 `bind`。使用该函数将就忽略了本次练习的意图。\n\
  \n### 答案\n\n你可能已经发现定义需要这样开头\n\n```javascript\nFunction.prototype.fixThis = function(obj)\
  \ {\n    ...\n}\n```\n\n并且你需要定义一个供 `fixThis` 返回的函数。该函数必须使用 `apply` 或 `call` 执行 `f`。在这一点上，你可能会卡住，因为你不确定如何引用\
  \ `f`。要正确实现，你需要记住两件事：`f` 是 `fixThis` 内部 `this` 指向的对象，但 `f` 并不是 `fixThis` 返回的函数中\
  \ `this` 指向的对象。如果需要，请带着这个见解再次尝试。\n\n`fixThis` 的实现\n\n```javascript\nFunction.prototype.fixThis\
  \ = function(obj) {\n    var that = this;\n    return function() {\n        return\
  \ that.apply(obj,arguments);\n    }\n}\n```\n\n正如大家所知的，`arguments` 是一个伪数组，包含了传递给其所属函数的任何参数。\n\
