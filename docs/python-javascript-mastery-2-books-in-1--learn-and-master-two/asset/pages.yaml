    CSV files are commonly used for storing tabular data, such as data from spreadsheets,
    databases, or other sources. They are also used for storing data that can be easily
    represented in a table, such as sales data, customer data, or financial data.


    JSON files are commonly used for storing data that is intended to be used in web
    applications or other applications that use JavaScript. JSON files can be used
    to store data in a flexible and hierarchical way, making them well-suited for
    storing data that is intended to be used in web APIs or other data-driven applications.


