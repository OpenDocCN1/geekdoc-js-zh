    # # Prototypal Inheritance


    Prototypal inheritance is a way for objects to inherit properties and methods
    from other objects. Unlike class-based inheritance, where a class inherits its
    from a parent class, objects inherit directly from other objects in JavaScript.


    JavaScript utilizes a prototype chain, wherein each object has a prototype property
    that points to another object, and so on. Whenever a property or function is called
    upon an object, JavaScript looks for it first within the object''s properties,
    and if it''s not discovered, it will then look through the object''s prototype.
    This permits an object to obtain properties'
