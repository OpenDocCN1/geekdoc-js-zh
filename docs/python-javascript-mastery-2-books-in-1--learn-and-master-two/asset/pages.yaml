    \ from the target element to the top.\n\nBy default, event listeners are attached\
    \ in the bubbling phase. Still, you can also attach event listeners in the capturing\
    \ phase by passing 'true' as the third argument to the 'addEventListener' method.\n\
    \n# Program code:\n\n```\nvar container = document.getElementById(\"container\"\
