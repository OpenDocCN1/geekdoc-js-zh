    \n再次感谢你下载这本书，希望你喜欢它！\n\n## 第1章：什么是SEO，为什么它对你的网站很重要？\n\n互联网是一个信息的海洋。它是一个由全球互联的计算机组成的网络。它使我们能够访问来自半个地球之外的计算机上的信息。\n\
    \n然而，互联网本身是一个大杂烩。它充满了满足数十亿个人需求的网页。早期，工程师们一直在寻找一种工具，可以组织网络上的所有信息，并帮助人们在最短的时间内找到他们想要的东西。\n\
    \n搜索引擎就是那个工具。\n\n这就是搜索引擎的功能。它们通过让人工智能访问网页并收集信息，“爬取”尽可能多的网页。它们将爬取页面的信息添加到索引中。当一个人输入搜索查询时，搜索引擎会遍历所有爬取过的页面，并返回一个符合查询的页面列表。然后，它根据这些页面与用户查询的相关性进行组织。\n\
    \n每月有数十亿人使用搜索引擎。其中一些人可能对你的网站感兴趣。为了将流量引入你的网站，你希望你的网页在目标访客的搜索结果中排名靠前。\n\n### 什么是搜索查询？\n\
    \n搜索查询是来自搜索引擎用户的问题。他们使用搜索引擎来寻找答案。以下是人们向搜索引擎提出的三种类型的问题：\n\n### 我在哪里/如何找到[某物名称]？\n\
    \n有些人使用查询来寻找特定的现实世界物品或地点。一个人可能在纽约附近寻找一辆二手车。他通过输入以下内容让搜索引擎查找所有关于二手车的分类广告：\n\n“纽约市二手车分类广告”\n\
    \n他发现结果太多，于是将搜索范围缩小为：\n\n“曼哈顿craigslist二手雷克萨斯”\n\n### 什么、何时和哪里的问题\n\n然而，大多数时候，人们使用搜索引擎来寻找信息。例如，有些人使用搜索引擎来查找他们学校作业的答案。许多人也去搜索引擎查找与他们相关的时事新闻。人们不再寻找电话簿，而是觉得通过互联网查找企业的地址和联系方式更快。\n\
    \n### [公司名称]的网站是什么？\n\n最后，人们使用搜索引擎前往网络上的特定区域。例如，有些人想去当地报纸的网站。他们不知道确切的网站地址，所以请谷歌引导他们前往那里。\n\
    \n在发达国家，搜索引擎已成为大多数人获取答案的主要来源。大多数像Google这样的搜索引擎的用户信任算法编译的搜索结果。大多数人期望在结果的前几位找到他们查询的答案。如果前五个结果似乎没有他们问题的答案，人们往往会认为他们使用的查询词一定有问题。就像那个在纽约寻找二手雷克萨斯的人一样，大多数人会改进他们的搜索。\n\
    \n### 这对你的网站有什么影响？\n"
