    \ in either electronic means or in printed format. Recording of this publication\
    \ is strictly prohibited and any storage of this document is not allowed unless\
    \ with written permission from the publisher. All rights reserved.\n\nThe information\
    \ provided herein is stated to be truthful and consistent, in that any liability,\
    \ in terms of inattention or otherwise, by any usage or abuse of any policies,\
    \ processes, or directions contained within is the solitary and utter responsibility\
    \ of the recipient reader. Under no circumstances will any legal responsibility\
    \ or blame be held against the publisher for any reparation, damages, or monetary\
    \ loss due to the information herein, either directly or indirectly.\n\nRespective\
    \ authors own all copyrights not held by the publisher.\n\nThe information herein\
    \ is offered for informational purposes solely, and is universal as so. The presentation\
    \ of the information is without contract or any type of guarantee assurance.\n\
    \nThe trademarks that are used are without any consent, and the publication of\
    \ the trademark is without permission or backing by the trademark owner. All trademarks\
    \ and brands within this book are for clarifying purposes only and are the owned\
    \ by the owners themselves, not affiliated with this document.\n\n## Week 1\n\n\
    ### Chapter 1: A Brief History of HTML\n\nOn the first week of the lesson, it's\
    \ best that you first get to know what HTML is really about.\n\nHTML stands for\
    \ Hyper Text Markup Language, which consists of a set of markup tags, and are\
    \ described by HTML tags.\n\nMarkup tags make up the foundation of HTML where\
    \ the use of nesting lines, such as `<HTML>` or `</HTML>` are prevalent. This\
    \ makes it a cornerstone technology, together with *JavaScript* and *CSS*. This\
    \ makes it easy for what's on the web to also be shown on mobile devices—which\
    \ is important these days because everyone's mostly on their phones or tablets,\
    \ and that is why you have to make sure that the websites you create are optimized\
    \ for mobile devices.\n\nThe development of HTML is widely attributed to Tim Berners-Lee,\
    \ also known as the creator of the World Wide Web (www). Back in 1989, he was\
    \ still a contractor at CERN, and while working there, he wrote a memorandum proposing\
    \ for a hypertext system that will be based on the internet.\n\nHe then began\
    \ to write server and browser software based on HTML back in the 1990s, and also\
    \ created an encyclopedia based on it that CERN used as the foundation for the\
    \ websites they created.\n\nBerners-Lee was also the first one to use the term\
    \ HTML Tags as the first available description of HTML. It was composed of 18\
    \ essential elements that made up the relative HTML design, and 11 of these elements\
    \ are still used up to this day and age.\n\nHTML was also defined for a time as\
    \ one of the main applications of SGML, or Standardized Generalized Markup Language.\
    \ It stayed that way up until 1993 when the first HTML Draft for the internet\
    \ came into fruition. However, it just had to take 6 months before the said draft\
    \ expired.\n\nIn 1994, the HTML Working Group was created and in turn, HTML 2.0\
    \ was finally completed in 1995, and in 1996, specifications for HTML started\
    \ to be maintained. In 1999, HTML 4.1 was published, and in 2004, HTML 5 began\
    \ to be developed—proving how innovative the said language is.\n\nInteractive\
    \ forms, objects, and images are then easily embedded to websites with the help\
    \ of HTML. Then, with the help of structural semantics, quotes, links, lists,\
    \ and paragraphs are all embedded, as well. HTML also works with *JavaScript*\
    \ and CSS in such a way that browsers would be able to have scripts embedded in\
    \ them.\n\nEver since 1997, programmers were encouraged to use HTML instead of\
    \ CSS or Cascading Style Sheets for websites.\n\n### Chapter 2: Framework and\
    \ Tags Cheat Sheet\n\nThe framework of HTML is made up of the following:\n\n1.\
    \  The document type is described with the DOCTYPE declaration.\n2.  Document\
    \ information is provided in the text between `<HEAD>` and `</HEAD>`.\n3.  An\
    \ HTML document is described in the text between `<HTML>` and `</HTML>`.\n4. \
    \ The document’s title is provided in the text between `<TITLE>` and `</TITLE>`.\n\
    5.  The text between `<H1>` and `</H1>` are known as headings. It could also go\
    \ for H2, H3, H4, and so on.\n6.  The content of the document—or what you’d read\
    \ onscreen—goes on the text between `<BODY>` and `</BODY>`.\n7.  And, a paragraph\
    \ could then be created in the text between `<p>` and `</p>`.\n\n### Tags Cheat\
    \ Sheet\n\nNow, when it comes to tags, you have to keep in mind that they usually\
    \ come in pairs, as you have seen in the framework above. What’s on the left side\
    \ is the beginning of the tag (also known as start tag), and the end tag looks\
    \ almost the same—but only with a slash (/) in the beginning.\n\nHere are the\
    \ tags that you’re mostly going to use:\n\n`<DOCTYPE...>`\n\n-   NAME – this pertains\
    \ to a section on the page\n-   HREF – this is used for hyperlinking, or for adding\
    \ the name of the URL that you are referring to\n-   onCLICK – this is the script\
    \ that runs so that the user will be able to click on the anchor (i.e., for things\
    \ such as [google.com](http://google.com), this script has to run so that the\
    \ user would really be directed to a link after clicking)\n\n`<A>` Anchor\n\n\
    -   TITLE – this is the title of the document that is being opened"
  mdcn: "\n# HTML 精通训练营\n\n![](img/edde2f38fefa2da4a5b5a879e12218fe_0_0.png)\n\n学习\
    \ HTML 编程基础知识\n\n## 大卫·麦克斯韦\n\n# HTML\n\n两周内掌握 HTML 编程基础！\n\n更多免费及特价书籍请访问 [KindleBookSpot.com](http://KindleBookSpot.com)\n\
    \n## 目录\n\nHTML\n*两周内掌握 HTML 编程基础！*\n\n-   引言\n-   第一周\n    -   第一章：HTML 简史\n\
    \    -   第二章：框架与标签速查表\n    -   第三章：使用 HTML 编辑器\n    -   第四章：关键的 HTML 页面\n    \
