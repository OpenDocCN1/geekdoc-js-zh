    1.  普通模式 – 在此模式下，您将使用内置解释器运行已编写完成的Python文件。

    2.  交互模式 – 这是一个命令行程序，可以对您的每条语句给出即时反馈。此模式在执行存储在计算机内存中的先前语句时提供反馈。从技术上讲，交互模式在评估新输入到Python解释器的语句时，会同时进行单独评估和整体评估。


    本章将重点介绍交互模式。要激活它，只需输入“python”而无需添加任何参数。这是学习编程语言的绝佳方式：您将尝试各种语句和语法变体。输入“python”后，屏幕将显示类似以下的信息：


