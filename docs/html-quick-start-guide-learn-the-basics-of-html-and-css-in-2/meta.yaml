    \n## Introduction\n\n**Bonus**: As a thank you I’d like to offer you a gift. I’ve\
    \ included a few bonus books. Check out the very bottom to find out how to get\
    \ these!\n\nI want to thank you and congratulate you for downloading the book,\
    \ “*HTML: Learn the Basics of HTML Programming in 2 Weeks!*”\n\nThese days, using\
    \ the internet is more than just a luxury: it’s a necessity. Sometimes, work cannot\
    \ be done without doing research on the internet, but as someone who’s interested\
    \ in programming, have you ever wondered how those websites work and what goes\
    \ on in them?\n\nFor starters, every website you see works because of a programming\
    \ language called HTML, or Hyper Text Markup Language. Without HTML, websites\
    \ would not work as fast as they could, and would not provide you with images,\
    \ videos, or even audio. In short, those websites won’t be as easy to navigate\
    \ and easy on the eyes as they could be.\n\nBut, with the help of this book, you’ll\
    \ learn the basics of HTML programming in just a matter of 2 weeks—so you can\
    \ start to make your own webpages, and in time, a full website, too!\n\nRead this\
    \ book now to find out how.\n\nThanks again for downloading this book, I hope\
    \ you enjoy it!\n\nCopyright 2014 by ________________________ - All rights reserved.\n\
