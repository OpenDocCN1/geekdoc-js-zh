- md: '# Chapter 3: Your Target Users: The Beginning of your Search Marketing Strategy


    When developing a search marketing strategy for a website, you need to start thinking
    about the group of people who may find value in the information found in your
    website. They are the types of people who are most likely to click on your webpage
    when they see it in the search result page. Search engines bridge the gap between
    your website content and people who need them.


    Profiling your target search engine users


    Internet users make billions of searches every month. Not all of these searches
    however, are valuable to your website. The number of people looking for the types
    of information in your website depends on the popularity of the industry or niche
    of your website. The more popular the niche, the more searchers it will have.
    Popular niches however, also have a lot of competition.


    To get ahead of your competition, you need to get to know your ideal visitors.
    You can do this by creating a profile of the ideal visitor for your website. If
    you already have a website that has been running for a while, you may be able
    to gather some information about the types of people who are visiting your website
    through the analytics software that you use. Here are some types of the information
    about your visitors that you will need:


    - Age

    - Gender

    - Language

    - Location

    - Common interest


    By obtaining these types of information, you will be able to guess the words that
    people are most likely to use when using search engines. You may also need some
    additional information depending on the type of website that you have.


    # Your goals for your visitors


    After creating a profile of your ideal visitors, you need to decide on what you
    want these people to do when they arrive at your website. If you are selling something
    on your website, you may need to tweak the design to make sure that the users
    can start making a purchase from your indexed pages.


    Other websites want their visitors to fill up forms, answer surveys, or sign up
    for membership.


    Having a goal also allows you to refine the types of keywords that you are targeting.
    If you are selling something for example, you may need to target purchase-related
    phrases. Some marketers only target phrases used by people who are in the late
    stages of the purchasing process.


    # Activity for Days 5 and 6: Identify your Target Users


    The next activity is to identify the characteristics of the ideal visitors for
    your website. Ideal visitors refer to the people who are most likely to do what
    you want accomplished. You should state what these people have in common. Aside
    from the information stated in chapter 3, you should also research on other websites
    that also cater to the needs of the same target market. You should check out their
    designs and the types of content that they offer.


    # Chapter 4: Choosing Keywords to Rank


    Now that you know who your target visitors are, you need to choose the right keywords
    that they will use when they search for information that you are offering.


    To know the keywords that your target users are using, you need to put yourself
    in your target users’ shoes. You need to use the information that you have in
    the profile that you have created to guess the right types of language that you
    should use.


    You also need to remind yourself of the limitations that the search engine technology
    have. You need to make sure that your keywords represent the types of content
    that you are showing in your page as well as the intent of your prospect visitors.
    Your ultimate goal is to provide what the prospect visitors need and then convert
    them into buyers, subscribers, members or, at the very least, return visitors.


    Most beginner webmasters think that they should choose just one strong keyword
    and use that in all the pages of their website. To search engines, this strategy
    will look a lot like keyword stuffing.


    If you want to make your website as the primary source of information for your
    topic, you need to aim to rank well on multiple keywords that are related to your
    website’s topic. If your website is about a TV show for example, you may want
    to target its title in your website’s home page. You should then create posts
    or pages related to the show like a page about the character. In this page, you
    may use this example “[TV show title] characters” as your main keyword.


    There are free and paid tools that will help you find the most used keywords for
    certain topics. One of the most popular among them is Google Adwords Keyword Planner.


    When planning your keywords, you should also consider the following factors:


    - The name of the products or services that you are offering


    This includes the generic name of the service and the brand. Some people who are
    thinking of purchasing something usually know the brand that they want to purchase
    so you should have website content that directly addresses the questions about
    these brands. These types of content will help your website be found through search.


    - Related topics regarding your products or services


    You should also provide content for topics related to your product or service.
    Many company websites for instance, include company updates. This shows activity
    in your website. One of the most important ranking factor is frequency of updates.


    - Seasonal popular keywords


    You should also prepare search-marketing campaigns for seasons when high volume
    of sales and traffic is to be expected. For retail websites for example, Christmas,
    Valentines and Thanksgiving seasons are big events. In this season, people tend
    to look for ideas online for offline purchases. You should take advantage of people’s
    habit to splurge during these seasons.


    Using Keywords when constructing your webpages


    Every time you create a blog post or a new webpage, you need to consider the target
    keywords that you will use. You should target one main keyword for each page or
    post you create. Your keywords should be in line with the activity that you want
    your visitors to perform. If you want your visitors to purchase something, your
    goal is to build a webpage targeting keywords used by searchers with an intent
    to buy. You could also make webpages with keywords used by searchers who are researching
    about specific products.


    When you know the keywords to rank for, your next goal is to put them strategically
    in your webpage. When placing your keywords in these locations, you must make
    sure that they appear naturally. Your primary goal is for your content to be understood
    by human visitors. User experience is always more important than any SEO strategy.
    With that in mind, you should place your keyword in the following parts of your
    website:


    - URL extension


    It helps if your domain name already contains the keyword that you want to rank
    for. Most of the time however, you will need to insert the keywords at the later
    parts of the URL to make sure that it is included in the URL bar.


    - Title Tag


    The title tag gives the crawlers an idea of what your page is about. Generally,
    you need to add your keywords as early as possible in the title tag. The challenge
    with this strategy is when you have a creative title planned. Sometimes, putting
    the keywords in the early part of the title tag makes it sound awkward. You should
    prioritize user experience if this is the case.


    - Near the top of the page


    You should also include the keywords in the first paragraph of your content. Lengthy
    types of contents are not entirely scanned by crawlers. Aside from the title tag,
    crawlers also try to figure out what your content is about from the first paragraphs.
    This is why you need to include your keywords in these areas.


    - Text content of the page


    Aside from the first paragraph, you should also add the keywords 3-4 times in
    various parts of the content. In this case, you may need to make variations of
    the main keywords to make it sound natural and to avoid redundancy for the readers.


    - Alt-attribute of images


    You should also add sentences or descriptions of your pictures in the image’s
    alt-attribute.'
