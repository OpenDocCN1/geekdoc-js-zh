    \ CSS）\n        -   CSS 字体\n-   结语\n    -   你的免费赠品................................................................................................................4\n\
    \n## 引言\n\n**赠品**：为表感谢，我想赠送您一份礼物。我附上了一些额外的书籍。请查看书末了解如何获取！\n\n感谢您下载本书，\"*HTML：两周内掌握\
    \ HTML 编程基础！*\"\n\n如今，使用互联网已不仅仅是奢侈，而是必需品。有时，不进行网络研究就无法完成工作，但作为对编程感兴趣的人，你是否曾好奇这些网站是如何运作的？它们内部发生了什么？\n\
    \n首先，你看到的每个网站之所以能运行，都归功于一种名为 HTML（超文本标记语言）的编程语言。没有 HTML，网站将无法像现在这样高效运行，也无法为你提供图片、视频甚至音频。简而言之，这些网站就不会像现在这样易于浏览和赏心悦目。\n\
    \n但是，在本书的帮助下，你只需两周时间就能掌握 HTML 编程的基础知识——这样你就可以开始制作自己的网页，并最终制作出一个完整的网站！\n\n现在就阅读本书，了解如何做到。\n\
    \n再次感谢你下载本书，希望你喜欢它！\n\n版权 2014 由 ________________________ 所有 - 保留所有权利。\n\n本文档旨在提供有关所涵盖主题和问题的准确可靠信息。出版时考虑到了出版商无需提供会计、官方许可或其他合格服务。如有需要，法律或专业建议，应咨询相关领域的专业人士。\n\
    \n> - 引自美国律师协会委员会和出版商协会委员会共同接受和批准的原则宣言。\n\n以电子方式或印刷格式复制、复制或传输本文档的任何部分均属非法。严禁录制本出版物，未经出版商书面许可，不得存储本文档。保留所有权利。\n\
    \n本文提供的信息据称是真实且一致的，对于因使用或滥用本文包含的任何政策、流程或方向而导致的任何疏忽或其他责任，均由接收读者独自承担全部责任。在任何情况下，出版商均不对因本文信息直接或间接造成的任何赔偿、损害或金钱损失承担任何法律责任或指责。\n\
    \n相应作者拥有出版商未持有的所有版权。\n\n本文信息仅供参考，具有普遍性。信息的呈现不附带任何合同或任何形式的保证。\n\n所使用的商标未经任何同意，商标的出版未经商标所有者许可或支持。本书中的所有商标和品牌仅用于澄清目的，归各自所有者所有，与本文档无关。\n\
    \n## 第一周\n\n### 第一章：HTML 简史\n\n在课程的第一周，最好先了解 HTML 到底是什么。\n\nHTML 代表超文本标记语言，它由一组标记标签组成，并通过\
    \ HTML 标签来描述。\n\n标记标签构成了 HTML 的基础，其中嵌套行（如 `<HTML>` 或 `</HTML>`）的使用非常普遍。这使其成为基石技术，与\
    \ *JavaScript* 和 *CSS* 一起。这使得网页上的内容也能轻松地在移动设备上显示——这一点在当今尤为重要，因为大多数人主要使用手机或平板电脑，因此你必须确保你创建的网站针对移动设备进行了优化。\n\
    \nHTML 的发展广泛归功于蒂姆·伯纳斯-李，他也被称为万维网（www）的创造者。早在 1989 年，他还是欧洲核子研究中心（CERN）的承包商，在那里工作期间，他撰写了一份备忘录，提议建立一个基于互联网的超文本系统。\n\
    \n然后，他在 1990 年代开始编写基于 HTML 的服务器和浏览器软件，并基于此创建了一个百科全书，欧洲核子研究中心将其用作其创建网站的基础。\n\n\
    伯纳斯-李也是第一个使用术语“HTML 标签”作为 HTML 的首个可用描述的人。它由 18 个构成相对 HTML 设计的基本元素组成，其中 11 个元素至今仍在使用。\n\
    \nHTML 也曾一度被定义为 SGML（标准通用标记语言）的主要应用之一。这种情况一直持续到 1993 年，互联网的第一个 HTML 草案得以实现。然而，该草案仅过了\
    \ 6 个月就过期了。\n\n1994 年，HTML 工作组成立，随之，HTML 2.0 最终于 1995 年完成，1996 年，HTML 的规范开始得到维护。1999\
    \ 年，HTML 4.1 发布，2004 年，HTML 5 开始开发——证明了该语言的创新性。\n\n在 HTML 的帮助下，交互式表单、对象和图片可以轻松嵌入网站。然后，在结构语义的帮助下，引用、链接、列表和段落也都被嵌入。HTML\
    \ 还与 *JavaScript* 和 CSS 协同工作，使浏览器能够嵌入脚本。\n\n自 1997 年以来，程序员被鼓励为网站使用 HTML 而不是 CSS（层叠样式表）。\n\
    \n### 第二章：框架与标签速查表\n\nHTML 的框架由以下部分组成：\n\n1.  文档类型由 DOCTYPE 声明描述。\n2.  文档信息在 `<HEAD>`\
    \ 和 `</HEAD>` 之间的文本中提供。\n3.  HTML 文档在 `<HTML>` 和 `</HTML>` 之间的文本中描述。\n4.  文档标题在\
    \ `<TITLE>` 和 `</TITLE>` 之间的文本中提供。\n5.  `<H1>` 和 `</H1>` 之间的文本称为标题。它也可以用于 H2、H3、H4\
    \ 等。\n6.  文档的内容——即你在屏幕上阅读的内容——放在 `<BODY>` 和 `</BODY>` 之间的文本中。\n7.  然后可以在 `<p>`\
    \ 和 `</p>` 之间的文本中创建段落。\n\n### 标签速查表\n\n现在，说到标签，你必须记住它们通常是成对出现的，正如你在上面的框架中看到的那样。左边的是标签的开始（也称为开始标签），结束标签看起来几乎一样——只是在开头多了一个斜杠（/）。\n\
    \n以下是你将主要使用的标签：\n\n`<DOCTYPE...>`\n\n-   NAME – 这指的是页面上的一个部分\n-   HREF – 用于超链接，或用于添加你所引用的\
    \ URL 的名称\n-   onCLICK – 这是运行的脚本，以便用户能够点击锚点（即，对于像 [google.com](http://google.com)\
    \ 这样的东西，必须运行此脚本，这样用户在点击后才会真正被引导到链接）\n\n`<A>` 锚点\n\n-   TITLE – 这是正在打开的文档的标题\n"
