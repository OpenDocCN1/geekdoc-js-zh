  md: '# # Week 1


    # ## Chapter 1: A Brief History of HTML


    On the first week of the lesson, it''s best that you first get to know what HTML
    is really about.


    HTML stands for Hyper Text Markup Language, which consists of a set of markup
    tags, and are described by HTML tags.


    Markup tags make up the foundation of HTML where the use of nesting lines, such
    as <HTML> or </HTML> are prevalent. This makes it a cornerstone technology, together
    with *JavaScript* and *CSS*. This makes it easy for what''s on the web to also
    be shown on mobile devices—which is important these days because everyone''s mostly
    on their phones or tablets, and that is why you have to make sure that the websites
    you create are optimized for mobile devices.


    The development of HTML is widely attributed to Tim Berners-Lee, also known as
    the creator of the World Wide Web (www). Back in 1989, he was still a contractor
    as CERN, and while working there, he wrote a memorandum proposing for a hypertext
    system that will be based on the internet.


    He then began to write server and browser software based on HTML back in the 1990s,
    and also created an encyclopedia based on it that CERN used as the foundation
    for the websites they created.


    Berners-Lee was also the first one to use the term HTML Tags as the first available
    description of HTML. It was composed of 18 essential elements that made up the
    relative HTML design, and 11 of these elements are still used up to this day and
    age.


    HTML was also defined for a time as one of the main applications of SGML, or Standardized
    Generalized Markup Language. It stayed that way up until 1993 when the first HTML
    Draft for the internet came into fruition. However, it just had to take 6 months
    before the said draft expired.


    In 1994, the HTML Working Group was created and in turn, HTML 2.0 was finally
    completed in 1995, and in 1996, specifications for HTML started to be maintained.
    In 1999, HTML 4.1 was published, and in 2004, HTML 5 began to be developed—proving
    how innovative the said language is.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Interactive forms, objects, and images are then easily embedded to websites
    with the help of HTML. Then, with the help of structural semantics. Quotes, links,
