  md: '# Chapter 4: Sequences


    Sequences, one of the basic structures in programming, allow you to save values
    easily and efficiently. Python supports three types of sequences, namely: lists,
    tuples, and strings. Let''s discuss each sequence in detail:


    # *Lists*


    As their name suggests, lists are collections of values that follow a certain
    arrangement. You can use square brackets to create a list. For instance, you can
    use the statement below to initialize an empty list:


    ```

    spam = []

    ```


    You should use commas to separate values. Here''s a sample list:


    ```

    spam = ["bacon", "eggs", 42]

    ```


    You can place different kinds of values inside the same list. For instance, the
    list above holds numbers and letters.


    Similar to characters within a string, you can access listed items using indices
    that start at zero. Accessing a listed item is easy. You just have to specify
    the name of the list where that item belongs. Then, indicate the number of the
    item inside the list. Enclose the number using square brackets. Here''s an example:


    ```

    >>> spam

    [''bacon'', ''eggs'', 42]

    >>> spam[0]

    ''bacon''

    >>> spam[1]

    ''eggs''

    >>> spam[2]

    42

    ```'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Python also allows you to enter negative integers. These numbers are counted
    backwards, starting from the last item in the list.


    ```

    >>> spam[-1]

    42

    >>> spam[-2]

    ''eggs''

    >>> spam[-3]

    ''bacon''

    ```


    You may use len() to determine the quantity of items inside a list. Check the
    image below:


    ```

    >>> len(spam)

    3

    ```


    Lists are similar to typical variables in one aspect: they allow you to change
    the items inside them. Analyze the following example:


    ```

    >>> spam = ["bacon", "eggs", 42]

    >>> spam

    [''bacon'', ''eggs'', 42]

    >>> spam[1]

    ''eggs''

    >>> spam[1] = "ketchup"

    >>> spam

    [''bacon'', ''ketchup'', 42]

    ```


    You can also slice strings:


    ```

    >>> spam[1:]

    [''eggs'', 42]

    >>> spam[:-1]

    [''bacon'', ''eggs'']

    ```


    Python offers different methods of adding items to any list. However, the easiest
    method is this:


    ```

    >>> spam.append(10)

    >>> spam

    [''bacon'', ''eggs'', 42, 10]

    ```'
