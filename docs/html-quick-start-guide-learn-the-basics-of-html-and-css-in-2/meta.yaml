    This is important if you want to prevent errors or unpredictable system behaviors.
    If you won''t restrict the effect of your codes on other codes, the entire system
    might get confused.


    You can control the “scope” of your codes by assigning specific name groups to
    each programmer. For instance, one programmer will use the names of countries
    while another one uses names of animals. This'
