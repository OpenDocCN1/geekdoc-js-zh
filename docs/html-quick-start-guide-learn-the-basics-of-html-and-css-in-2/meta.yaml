    ## Build links slowly over time


    Search engines may also think that you are using such methods if your website
    is new but you already have hundreds of links. To avoid this from happening, you
    should make sure that the SEO companies or professionals you hire will not build
    links that point to your website indiscriminately.


    ## A link’s value decreases over time


    Amateur marketers also think that the quality of the links they have remain the
    same as long as it is live. Google however, has taken freshness of content as
    an important factor when ranking. As the websites that link to you become less
    popular, your ranking also goes down. To prevent this from happening, you should
    produce content regularly that will contribute to your link profile.


    ## Activity for days 11 - 13:


    You will need a lot of time in building your website’s link profile but taking
    these steps will help you in starting the process. Your first task is to find
    people who also have websites similar to yours. They should not offer spam content
    and they should be managed by reputable companies or online marketers.


    Your next step is to collect contact information about the owners of these websites
    and start communicating with them. One of the best ways to do this is to offer
    to do a guest post on their website. Most webmasters will welcome an opportunity
