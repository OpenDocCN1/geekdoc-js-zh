  md: '# # 第六章 计算机辅助设计


    计算机辅助设计（Computer-Aided Design，简称 CAD）是指利用计算机软件来创建、修改、分析或优化设计的过程。它广泛应用于机械工程、建筑、电子和土木工程等领域。


    ## 6.1 CAD 的发展历史


    +   - 1960年代：最早期的 CAD 系统诞生。

    - 1980年代：PC 上的 CAD 软件开始普及。

    - 2000年代至今：向三维建模和云协作发展。


    ## 6.2 核心功能


    | 功能 | 说明 |

    |------|------|

    | 草图绘制 | 创建 2D 几何形状 |

    | 建模 | 生成 3D 实体或曲面 |

    | 装配 | 将多个零件组合成装配体 |

    | 出图 | 生成标准的工程图纸 |'
