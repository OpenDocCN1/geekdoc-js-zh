  mdcn: "\n## 外部样式（外部CSS）\n\n外部CSS主要是为网站中的多个页面定义样式——而不仅仅是单个页面。借助一个文件，你就能改变整个网站的外观，这确实让事情变得简单许多。\n\
    \n然后，你只需在页面的`<head>`部分添加一个指向外部CSS文件的链接即可。为此，你可以参考下面的示例：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
    <body>\n\n<h1>阅读此标题 </h1>\n<p>阅读此段落。</p>\n\n</body>\n</html>\n```\n\n## CSS字体\n\
