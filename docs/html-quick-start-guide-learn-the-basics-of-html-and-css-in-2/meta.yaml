    ## 第1章：什么是Python？


    Python是一种高级且结构化的编程语言。您可以使用它来完成各种编程任务。此外，Python是一种开源语言：全球成千上万的计算机专家每天都在使用和改进它。一位名叫Guido
    Van Rossum的荷兰程序员在90年代初期创建了Python。他以一部名为“蒙提·派森的飞行马戏团”的喜剧节目来命名它。


    计算机专家认为Python是一种强大的编程语言。系统管理员正在使用它来开发各种类型的计算机软件。实际上，Python极大地帮助改进了Linux系统。Linux的大部分主要组件都是使用Python编写的。IT教授也使用这种语言来教授基础编程。这意味着Python用途广泛、功能强大且易于学习。


    在执行之前，这种编程语言会自动编译成字节码。系统会将字节码保存到硬盘上。这意味着除非对源代码进行了修改，否则用户无需执行编译。此外，Python是一种动态类型编程语言，允许（但不要求）面向对象的构造和特性。


    与其他编程语言不同，Python将空白字符视为其代码的重要组成部分。事实上，空白字符的重要性是Python最显著的特征。Python使用缩进来指示代码块的起始点和结束点，而不是使用C编程语言所采用的块分隔符。


    Python的另一个酷炫之处在于它适用于所有平台。您可以轻松地在Linux、Macintosh和Windows计算机上安装和使用Python。这意味着使用这种语言编写的计算机程序具有极高的可移植性：您可以在任何可用平台上使用它们。


    ## 第2章：Python的交互模式


