    # Chapter 5: The Different Types of Data


    Basically, data types define an object’s capabilities. In other languages, the
    effectiveness of an operation is tested by ensuring that the object cannot be
    stored where the operation is going to be performed. This system is known as static
    typing.


    However, Python uses a different approach. This programming language allows you
    to store the object’s data type inside that object. Python also checks the validity
    of each operation as soon as you run them. Programmers refer to this system as
    dynamic typing.


    This chapter focuses on the different kinds of data that you can use with Python.


    **The Standard Types**


    Python has a set of standard data types. These types are pre-installed into this
    programming language. Let’s divide these types into small groups. This section
    will use the hierarchy system used in Python’s official documentation:


    *The Numeric Types*


    +   - int – This stands for integers. For Python 2.x, “int” is identical to C
    longs.

    - long – It stands for long integers whose length is non-limited. You’ll find
    this type in systems that use Python 2.x.

    - float – This stands for floating-point numbers. Float is the equivalent'
  - '[PAGE 131]


    of doubles in C.


    +   - complex – This type is composed of complex numbers.


    # The Sequences


    +   - list

    - tuple

    - byte – This is a sequence of numbers within the 0-255 range. You’ll find bytes
    in systems that use Python 3.x.

    - byte array – This is the mutable version of bytes.

    - str – This stands for “String.” Python 2.x systems represent strings as sequences
    of 8-bit items. Python 3.x systems, however, represent them as sequences of Unicode
    items.


    # The Sets


    +   - set – This is an unorganized group of distinct objects.

    - frozen set – This type is the immutable version of sets.


    # The Mappings


    +   - dict – This stands for Python dictionaries. Computer programmers refer to
    this type as a “hashmap” or “associative array.” In general, each element of a
    dictionary has a corresponding definition.


    # Mutable and Immutable Objects


    In the Python language, data types are categorized based on the mutability of'
  - '[PAGE 132]


    their contents. Keep in mind that immutable data types prevent you from changing
    the objects inside them. That means you’ll succeed in slicing or reassigning the
    objects of mutable data. Immutable ones, however, will give you an error message.


    Here’s an important principle that you should remember: variables are simple references
    to the objects inside a machine’s memory. Let’s assume that you paired an object
    and a variable using the following statement:


    ```

    a = 1

    s = ''abc''

    l = [''a string'', 456, (''a'', ''tuple'', ''inside'', ''a'', ''list'')]

    ```


    With the statement given above, you are making variables (i.e. 1, a, and s) point
    to certain objects. Python stores this relationship between variables and objects
    in the machine’s memory. Thus, you can conveniently access objects whenever you
    want.


    For the next example, let’s say you performed a reassignment using the code below:


    ```

    a = 7

    s = ''xyz''

    l = [''a simpler list'', 99, 10]

    ```


    In this new statement, you linked the variables to other objects. As you’ve learned
    earlier, you can only change mutable objects (1 [0] = 1 is good, but s [0] = “a”
    will give you an error message).


    # **How to Create Objects of a Defined Type**


    +   - *Literal Integers* – You can enter literal integers in three different ways:'
  - "[PAGE 133]\n\n+   - For decimal numbers – You can enter these numbers directly.\n\
    - For hexadecimal numbers – You have to prepend 0X or 0x to enter this kind of\
    \ number.\n- For octal literals – The method of entering these integers depends\
    \ on the Python version you are using:\n  - For Python 2.x – You must prepend\
    \ a zero to enter octals.\n  - For Python 3.x – You should prepend 0O or 0o to\
    \ enter octals.\n\n*Floating Point Integers* – You can enter these numbers directly.\n\
    \n+   - *Long Integers* – You can enter a long integer in two ways:\n  - Directly\
    \ (112233445566778899 is considered as a long integer)\n  - By appending the letter\
    \ \"L\" (1L is considered as a long integer).\n\nIf a computation that involves\
    \ short integers overflows, it is automatically converted into a long integer.\n\
    \n*Complex Numbers* – You can enter this object by adding two numbers (i.e. a\
    \ real number and an imaginary number). Then, enter these numbers by appending\
    \ the letter \"j.\" That means 11+2j and 11j are complex numbers."
  - '[PAGE 134]


    +   - *Strings* – You can enter strings as single- or triple-quoted objects.


    The difference between these two types lies in their delimiters and their potential
    length. Single-quoted strings are restricted to one line only. You can enter single-quoted
    strings using pairs of single quotation or double quotation marks. Check the following
    example:


    ```

    ''foo'' works, and

    "moo" works as well,

    but

    ''bar" does not work, and

    "baz'' does not work either.

    "quux''" is right out.

    ```


    Triple-quoted strings are similar to their single-quoted counterparts, but they
    can cover multiple lines. Obviously, their delimiters (i.e. the quotation marks)
    should be matched. You must enter these strings using 3 single or double quotation
    marks. Here’s an instructive screenshot for you:


    ```

    ''''''foo'''''' works, and

    """moo""" works as well,

    but

    ''''''bar''"" does not work, and

    """baz'''''' does not work either.

    ''''''quux''"" is right out.

    ```


    +   - *Tuples* - You can enter tuples using parentheses. Place commas between
    objects to separate them.


    ```

    (10, ''Mary had a little lamb'')

    ```


    You can enter a single-element tuple by enclosing it in parentheses and adding
    a comma. Here’s an example:'
  - '[PAGE 135]


    ```

    (''this is a stupid tuple'',)

    ```


    +   - Lists - Lists work like tuples, though they require square brackets:


    ```

    [''abc'', 1,2,3]

    ```


    +   - Dictionaries – You can create “Python dicts” by listing some pairs of values
    and separating each pair using a colon. Use commas to separate dictionary entries.
    Then, enclose the statements using curly braces. Check the image below:


    ```

    { ''hello'': ''world'', ''weight'': ''African or European?'' }

    ```


    # **Null Objects**


    Python uses “None” as a null pointer analogue. In this aspect, Python is similar
    to many programming languages. Actually, “None” isn’t a null reference or a null
    pointer in itself – it is an object that only has one instance. You can use “None”
    as a default argument value for functions. In Python, you must compare objects
    against “None” using “is” instead of “==.”'
  - '[PAGE 136]


    # # Chapter 6: The Errors That You Will Encounter


    Python users encounter three kinds of errors: exceptions, logic errors, and syntax
    errors.


    **Exceptions**


    These errors occur when the Python interpreter cannot perform an action, though
    it knows what should be done. A good example would be running a Google search
    while you are offline: the machine knows what to do but it cannot accomplish it.


    **Logic Errors**


    Logic errors are extremely hard to find. Also, they are the most common errors
    that you''ll get. Python programs that are affected by logic errors can still
    run. However, they may crash or produce unexpected results.


    You can use a debugger to find and solve logic errors in your programs.


    **Syntax Errors**


    This is perhaps the most basic kind of error. A syntax error occurs when the Python
    interpreter cannot understand a code. According to programmers, syntax errors
    are fatal most of the time – you cannot execute codes that contain this error.


    Syntax errors are often caused by typos, wrong arguments, or wrong indentation.
    That means you should inspect your codes for these mistakes whenever you encounter
    a syntax error.'
