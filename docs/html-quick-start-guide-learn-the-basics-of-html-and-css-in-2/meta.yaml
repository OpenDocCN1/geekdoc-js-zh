- md: '## Chapter 5: HTML Attributes


    Then, on the second week of the lesson, you can start learning how to code the
    more complicated parts of HTML. For this, you could start with Attributes.


    The most important things you have to remember about Attributes are as follows:


    1. Elements of HTML could have attributes—and attributes help explain the elements
    better.

    2. The Start Tag <> specifies the attributes.

    3. Attributes also come in name/value pairs. They’d look something like this:
    name= “value” (i.e., img src = “1gdtjs.tumblr.com”)


    Now, you can take a look at various types of attributes below:


    ### Title Attribute


    Again, paragraphs are defined by the <p> tag. However, you could also insert the
    title of your topic in the page inside the paragraph. You could try the example
    below:


    ```html

    <p title="Who is Gossip Girl?">

    After 6 years of scheming and failed plans, Gossip Girl finally introduced herself

    —or himself, rather—to the Non-Judging Breakfast Club. People were surprised to

    see that Gossip Girl is actually non other than Dan Humphrey, everyone''s favorite

    guy from Brooklyn. The guy from the outside actually wanted to be in! </p>

    ```


    ### Lang Attribute


    The HTML tag declares the kind of language that’s used in the document. This is
    essential so that applications will be accessible—even in different kinds of gadgets.
    Remember that the first two letters after *html lang* will determine the type
    of language used. If you’re using a dialect, you have to add two more letters.


    For example: en-US (English-US), en-UK (English-UK), etc.


    To make it clearer, just look at the sample below:


    ```html

    <!DOCTYPE html>

    <html lang="en-US">

    <body>


    <h1>Who is Gossip Girl?</h1>

    <p>Does anyone know who Gossip Girl is and where she could be found?</p>


    </body>

    </html>

    ```


    ### Size Attributes


    The <img> tag define the images shown on the HTML Page.


    Src then determines where the file has been sourced from, and the image''s width
    and height are also taken into consideration. You could then specify height and
    width in pixels.


    For example:


    ```html

    <img src="bornthisway.jpg" width="569" height="768">

    ```


    ### Href Attribute


    The <a> tag define the Href Attribute. As you well may know by now, this means
    that there are HTML links around. You have to specify the address in the attribute
    itself.


    For example:


    ```html

    <a href="http://abc1234.com">The World''s Best Website</a>

    ```


    ### Alt Attribute


    To use alternative texts, it’s best to use the Alt Attribute. This is perfect
    for screen readers, which makes it easy for people viewing the website to appreciate
    the website even better.


    For example:


    ```html

    <img src="thebestwebsite.jpg" alt="bestwebsite.com" width="106" height="148"/>

    ```


    ### Other Tips about Attributes


    Here are the other important things you have to keep in mind when it comes to
    attributes:


    1. Double style quotes are prevalent in HTML. However, this does not necessarily
    mean that you could no longer use single style quotes.

    2. Lowercase letters are still best used.

    3. To make things easy for those who are using the website, make use of the Alt
    Attribute.

    4. Make sure to provide adequate information with the help of size attribute.

    5. Keep links easy to go to by using href. Don’t just put the site next to a paragraph.

    6. Titles make your pages easier to find online—make use of them.


    ## Chapter 6: HTML Formatting


    It’s also best that you learn more about formatting and styles as they help you
    bring your webpage to life. With the right kind of styles and formatting, your
    website gets to look different from other sites around. Let’s start with formatting
    first.


    ### Formatting


    When it comes to formatting, you have to understand that special elements with
    special meanings are used, and are then used to display various types of text.
    For example:


    1. Small text

    2. Marked text

    3. Italic text

    4. Bold text

    5. Superscripts

    6. Subscripts

    7. Inserted Text

    8. Deleted Text

    9. Important Text


    So, basically, the following tags have to be used:


    1. `<b>` bold text

    2. `<mark>` this means that the text is marked or in other words, highlighted

    3. `<del>` this means that text is or has been deleted

    4. `<ins>` this means that text has been inserted

    5. `<sup>` superscripted text

    6. `<sub>` subscribed text

    7. `<strong>` this means that the text is important

    8. `<small>` this defines text that is smaller than what’s seen onscreen

    9. `<i>` this defines italicized text

    10. `<em>` this defines emphasized text


    To help you understand these better, you can take a look at the examples below:


    #### Strong Text


    This is used for when you want to indicate that something is of utmost importance—like
    headings or headlines.


    ```html

    <p>look at this normal text</p>


    <p><strong>look at this strong text</strong>.</p>

    ```


    #### Bold Text


    Of course, there are instances when you have to format some of the words you see
    onscreen in bold. It means that the text is important. For example, it could be
    a meaning of a word, a character in a movie, etc. Take a look at the example below:


    ```html

    <p>look at this normal text.</p>

    <p><b>look at this bold text</b>.</p>

    ```


    #### Emphasized Text


    This means that you’re trying to make people read an important part of your post.
    This usually happens for news articles or for clickbaiting. For this, you could
    try the example below:


    ```html

    <p>look at this normal text.</p>


    <p><em>look at this emphasized text</em>.</p>

    ```


    #### Italicized Text


    Just like the subheadings in this book, sometimes, you do have to italicize words
    for them to make more of an impression on the reader. It’s all about semantics.
    Sometimes, it’s also used to denote that other languages are being used in the
    paragraph—which is usual for some novels, or works that are in two languages.


    ```html

    <p>look at this normal text.</p>

    <p><i>look at this italicized text</i>.</p>

    ```'
