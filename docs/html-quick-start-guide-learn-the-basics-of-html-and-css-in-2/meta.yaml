    # # Chapter 6: HTML Formatting


    It’s also best that you learn more about formatting and styles as they help you
    bring your webpage to life. With the right kind of styles and formatting, your
    website gets to look different from other sites around. Let’s start with formatting
    first.'
  - '[PAGE 32]


    # Formatting


    When it comes to formatting, you have to understand that special elements with
    special meanings are used, and are then used to display various types of text.
    For example:


    +   1. Small text

    2. Marked text

    3. Italic text

    4. Bold text

    5. Superscripts

    6. Subscripts

    7. Inserted Text

    8. Deleted Text

    9. Important Text


    So, basically, the following tags have to be used:


    +   1. <b> bold text

    2. <mark> this means that the text is marked or in other words, highlighted

    3. <del> this means that text is or has been deleted

    4. <ins> this means that text has been inserted

    5. <sup> superscripted text

    6. <sub> subscribed text

    7. <strong> this means that the text is important

    8. <small> this defines text that is smaller than what’s seen onscreen

    9. <i> this defines italicized text

    10. <em> this defines emphasized text


    To help you understand these better, you can take a look at the examples below:'
  - '[PAGE 33]


    # **Strong Text**


    This is used for when you want to indicate that something is of utmost importance—like
    headings or headlines.


    ```

    <p>look at this normal text</p>


    <p><strong>look at this strong text</strong>.</p>

    ```'
  - '[PAGE 34]


    # Bold Text


    Of course, there are instances when you have to format some of the words you see
    onscreen in bold. It means that the text is important. For example, it could be
    a meaning of a word, a character in a movie, etc. Take a look at the example below:


    ```

    <p>look at this normal text.</p>

    <p><b>look at this bold text</b>.</p>

    ```'
  - '[PAGE 35]


    # # *Emphasized Text*


    This means that you’re trying to make people read an important part of your post.
    This usually happens for news articles or for clickbaiting. For this, you could
    try the example below:


    ```

    <p>look at this normal text.</p>


    <p><em>look at this emphasized text<em>.</p>

    ```'
  - '[PAGE 36]


    # Italicized Text


    Just like the subheadings in this book, sometimes, you do have to italicize words
    for them to make more of an impression on the reader. It’s all about semantics.
    Sometimes, it’s also used to denote that other languages are being used in the
    paragraph—which is usual for some novels, or works that are in two languages.


    ```

    <p>look at this normal text.</p>

    <p><i>look at this italicized text<i>.</p>

    ```'
- md: '## Marked Formatting


    Marked Formatting means that text has been highlighted. This is usually done to
    spruce up the page, make it eye-catching and friendly.


    Here''s a good example:


    ```

    <h2>HTML <mark>Marked</mark> Formatting</h2>

    ```


    ## Small Formatting


    Small Formatting is basically about putting text with smaller fonts onscreen.
    An example of this would be as follows:


    ```

    <h2>HTML <small>Small</small> Formatting</h2>

    ```


    ## Inserted Formatting


    This formatting means that text has been <u>inserted</u> or added. It’s a good
    way of editing the page, or the website itself. Here’s a good example:


    ```

    <p>My favorite <ins>color</ins> is red.</p>

    ```


    ## Deleted Formatting


    This shows that something has been ~~deleted~~ on the page.


    ```

    <p>My favorite color is ~~blue~~ red.</p>

    ```


    ## Superscript Formatting


    This means that a text is in superscript form. For example:


    ```

    <p>This is <sup>superscripted</sup> text.</p>

    ```


    ## Subscript Formatting


    This means that text is in $_{subscript}$ form. For example:


    ```

    <p>This is <sub>subscripted</sub> text.</p>

    ```


    ## Chapter 7: HTML Styles


    Of course, it’s also important to think about the style of your page. Just like
    formatting, this helps make your page unique—instead of the same as everything
    else online.


    Styles are known to come in this syntax:


    `Style= “property:value;”`


    Both are forms of CSS, where property is the property value, and value is the
    CSS value.


    For Styles, you have to keep the following in mind:


    1. **Text-align.** This should be used for keeping text aligned.

    2. **Font-size.** This helps you determine font sizes.

    3. **Font-family.** This helps you determine text fonts.

    4. **Color.** This helps you define text colors.

    5. **Background Color.** This will help you define what the color of the background
    is.

    6. **Style.** Basically, you have to use this to help the program understand that
    you’re creating styles for the page.


    ## Text Alignment


    To align text, you have to think of the horizontal alignment system. For this,
    you could try the example below:


    ```

    <h1 style="text-align:center;">Centered Heading</h1>

    <p>Read this paragraph</p>

    ```


    ## Text Size


    This will help you choose the right font size for the text you have onscreen.
    After all, it’s just imperative that not everything should be the same font. For
    this, you could try the example below:


    ```

    <h1 style="font-size:100%;">This is a heading</h1>

    <p style="font-size:160%;">This is a paragraph.</p>

    ```


    ## Fonts


    This is all about choosing the kind of font that you’d like the readers of your
    website to see onscreen. This also defines font families, just like what’s shown
    below:


    ```

    <h1 style="font-family:verdana;">This is a heading</h1>

    <p style="font-family:serif;">This is a paragraph.</p>

    ```


    ## Text Color


    If you want to change the color of the text onscreen, of course, it’s best that
    you know the right attribute to use, and this is text color. For this, you could
    try this example:


    ```

    <h1 style="color:pink;">This is a heading</h1>

    <p style="color:black;">This is a paragraph.</p>

    ```


    ## Background Color


    Whether you’d want the background in white, black, pink, or any other color, you
    have to use this style type. Here’s a good example to change background color
    to salmon pink:


    ```

    <body style="background-color:salmonpink;">


    <h1>This is a heading</h1>

    <p>This is a paragraph.</p>


    </body>

    ```


    ## Chapter 8: HTML Quotations


    There are times when you do have to quote certain things on your page. For example,
    if you have something to attribute to another website, it’s best to not twist
    their words so that your readers would get a really valuable read, and know that
    you know how to link to the right sources.


    For this, you have to remember the following:


    1. **<q>.** This means that there’s a short, inline quotation.

    2. **<cite>.** This is attributed to the title of a topic on the page.

    3. **<blockquote>.** This means that you have quoted something from outside sources.

    4. **<bdo>.** This states for text dictation.

    5. **<address>.** This is the contact information quote.

    6. **<abbr>.** Acronym or abbreviation.


    ## Long Quote


    For example, you have created a new website for fostering and taking care of animals,
    and you are affiliated to the WWF (World Wildlife Fund). This means you may have
    to quote from their website. How would you do this?


    Well, you can use the Long Quote Style. This is depicted by <blockquote>, which
    would then indent the passage. So, if you have quoted this way:


    ```

    <p>Here is a quote from WWF’s website:</p>

    <blockquote cite="http://www.worldwildlife.org/who/index.html">

    For 50 years, WWF has been protecting the future of nature.

    The world’s leading conservation organization,

    WWF works in 100 countries and is supported by

    1.2 million members in the United States and

    close to 5 million globally.

    </blockquote>

    ```


    What you’ll see onscreen is something like this:


    > Here is a quote from WWF’s website:


    > For 50 years, WWF has been protecting the future of nature. The world’s leading
    conservation organization, WWF works in 100 countries and is supported by 1.2
    million members in the United States and close to 5 million globally.


    ## Short Quote


    For short quotes, you could try using <q>. For example:


    > <p>ABC123''s Goal is to: <q>Build a future where people know how to code without
    problems, and create the websites they want.</q></p>


    ## Contact Information Quote


    If you’re observant, you’d know that a lot of websites make use of the Contact
    tab where you get to see contact information of the owner of the website. For
    this, you could use the HTML <address> code. This is usually seen in italic with
    line breaks.


    For example:


    ```

    <address>

    Written by Blair Waldorf </br>

    Visit us at:<br>

    blaircornelia.com<br>

    New York, New York<br>

    USA

    </address>

    ```


    ## Abbreviations


    Abbreviations also fall under quotations. For this, you have to use the <abbr>
    tag. This way, it would be easy to get information from search engines, translation
    systems, and other browsers. For this, you could try the example below:


    ```

    <p>The <abbr title="World Wide Web">WWW</abbr> was founded in 1989.</p>

    ```


    ## Chapter 9: HTML CSS


    And finally, it''s also good to learn a thing or two about CSS (Cascading Style
    Sheets). These could spruce up your page, making it aesthetically good, and helping
    make sure that navigation is also easy. It also allows you to add more features
    to the website. There are 3 important CSS elements and they are:


    1. **Internal.** This means that you''re using an element of <style> and you could
    find this in the HTML <head> section.

    2. **Inline.** This depicts HTML style attributes.

    3. **External.** This means that you''re using external CSS Files.


    ## Important Elements


    1. **Style.** Internal Styling

    2. **CSS Margin.** Space outside the border

    3. **CSS Padding.** Space inside the border

    4. **CSS Font-Size.** This determines text sizes

    5. **CSS Font-Family.** This determines where the font came from

    6. **CSS Color.** This determines the color of font being used

    7. **<head>.** This refers to elements of <link> and <style>

    8. **<link>.** A link to external CSS files

    9. **<style>.** The style of internal CSS


    ## Internal Styling (Internal CSS)


    This means that you''re trying to define the style of a single page in your website.
    You can see this in the <head> of your page. It encapsulates the element of <style>.


    For example:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    body {background-color:white;}

    h1  {color:pink;}

    p   {color:violet;}

    </style>

    </head>

    <body>


    <h1>Read this heading</h1>

    <p>Read this paragraph </p>


    </body>

    </html>

    ```


    ## Inline Styling (or Inline CSS)


    Inline CSS means that you have to apply unique styles to single elements in your
    page. This also falls under the HTML Style Attribute. For example, if you want
    to change the color of <h1> heading to pink, you could try:


    ```

    <h1 style="color:pink;">This is a Pink Heading</h1>

    ```'
