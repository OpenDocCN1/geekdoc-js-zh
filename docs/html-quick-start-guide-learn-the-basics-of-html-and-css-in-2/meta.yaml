    Now that’s clear, it’s time to start putting into practice what you have learned!
    Don’t worry because you’ll be guided through it!


    ## Chapter 3: Using HTML Editors


    Before coding HTML, you first have to open the right editors for them. While *Sublime
    Text* and *Microsoft WebMatrix* are popularly used by professionals, as a beginner,
    you can use Notepad.


    For Windows 7 and earlier versions, just click *Start*, followed by *All Programs*
    > *Accessories* > *Notepad*.


    For Windows 8 and other newer versions, click *Start Screen* > *Notepad*.


    Now, try typing this into the Notepad:


    ```

    <!DOCTYPE html>

    <html>

    <body>


    <h1>Welcome to the Web</h1>


    <p>My first page</p>


    </body>

    </html>

    ```


    Then, save the page by selecting *File* > *Save As*, and choose *UTF-8*. However,
    if you''re going to use Western European and US Characters, just choose *ANSI*.


    To view the page that you have made in your browser, just click and watch a page
    open on your browser.


    ## Chapter 4: Vital HTML Page


    Now it’s time to start creating a full basic HTML page just to see how it looks
    like. Again, remember that every HTML page or document should start with <!DOCTYPE
    html>. This means that it has to look something like this:


    ```

    <!DOCTYPE html>

    <html>

    <body>


    <h1>Welcome to the Web</h1>


    <p>My first page</p>


    </body>

    </html>

    ```


    Take note that declarations would differ depending on the HTML type that you’re
    using. This means that you have to do the following:


    1. **XHTML 1.0:** <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    2. **HTML 4.01:** <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
    "http://www.w3.org/TR/html4/loose.dtd">

    3. **HTML 5:** <!DOCTYPE html>


    ## The Headings


    Of course, your pages need headings. These work like subheadings in books or articles
    so you’d know exactly what goes on in a page—what it’s about, in other words.


    Headings range from <H1> to <H6>. Here’s a good example:


    ```

    <h1>Look at my heading</h1>

    <h2>Look at my heading</h2>

    <h3>Look at my heading</h3>

    ```


    ```

    <h4>Look at my heading</h4>

    <h5>Look at my heading</h5>

    <h6>Look at my heading</h6>

    ```


    ## Paragraphs


    Paragraphs are also used in webpages as well as in articles and novels. You’ll
    know that a paragraph is around when the `<p>` tag is in. This also makes it easier
    for you to read what’s on the page.


    Without the use of paragraphs, everything would be cramped in one space along—making
    them extremely hard to read. For this, you could try the following:


    ```

    <p>Read this paragraph.</p>

    <p>Read one more paragraph.</p>

    ```


    ## Images


    Images could also be used to spruce up your website. It makes people want to read
    the website more because images always make things easy on the eyes. This means
    you''d have to use the `<img>` tag for this.


    The attributes of this are as follows:


    1. alt (alternate text)

    2. src (image source)

    3. size (width and height)


    For example:


    ```

    <img src="chanel1.jpg" alt="chanel2" width="104" height="142">

    ```


    ## Links


    And of course, the use of links is also encouraged. These are defined with the
    <a> tag. It makes things easy on the eyes so that everything wouldn''t be on one
    page alone, and readers could be taken to different pages on your website.


    Here''s a good example:


    ```

    <a href="http://thechanels.com">See this link</a>

    ```


    ## Elements


    Various elements are also used in an HTML page. If you could remember, pairs of
    tags are always used in a webpage that’s been coded with HTML.


    It should look something like this:


    ```

    <tagname>tagname</tagname>

    ```


    For example:


    ```

    <h1> Read this heading </h1>

    <p> Have you seen the light? </p>

    <b><p>What is feminism?</b></p>

    ```


    So basically, the whole document is depicted through various <HTML> tags, and
    that’s why start <> and end </> tags have to be used. Without them, words on the
    page would all come together—making them hard to read. The <body> tag then defines
    what the page contains. It also contains headings, paragraphs, and other attributes.


    For example:


    ```

    <html>

    <body>

    <h1>My Sunday</h1>

    <p>Last Sunday was the best Sunday because we went to the park and flew kites.

    </p>

    </body>

    </html>

    ```


    With the help of start and end tags, you get to understand what’s being shown
    onscreen. They give a page a lot of meaning—instead of it being just mumbo-jumbo.


    Other important elements are the headings <h1>, and paragraphs </p> so that headings
    could also be defined. A sample of headings are as follows:


    ```

    <h1> See how awesome this is </h1>

    <h2> Have you seen where she went? </h2>

    <h3> Where will you go next? </h3>

    ```'
