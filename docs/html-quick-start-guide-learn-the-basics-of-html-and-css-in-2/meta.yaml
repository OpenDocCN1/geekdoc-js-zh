    >>> string[:-8]

    ''Hello''

    >>> string[:]

    ''Hello, world!''

    ```


    The statements given above show an important rule:


    > “If you’ll omit a number, Python assumes the missing number as the start or
    end of that particular sequence (depending on the position of the missing number).”


    # **Dictionaries**


    Dictionaries are similar to lists. Unlike tuples, dictionaries allow users to
    modify their content. That means you may add, edit, and delete the elements of
    any dictionary. The main difference between lists and dictionaries is this: dictionaries
    don’t bind their elements to any number.


    A dictionary’s element has two aspects: (1) the key and (2) the value. If you’ll
    call the key of a dictionary, you’ll get the values related to that particular
    key. Computer programmers consider lists as special dictionaries, where numbers
    represent the key of each element.


    # _How to Use a Dictionary_


    You should use curly braces when declaring a dictionary. Also, you should use
    the following format when declaring elements for a dictionary: (1) enter the key
