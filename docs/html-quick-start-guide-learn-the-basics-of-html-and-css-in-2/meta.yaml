    # Chapter 1: What is SEO and Why is it Important to your Website?


    The internet is an ocean of information. It is a network of interconnected computers
    from all around the world. It allows us to access information from computers halfway
    around the world.


    By itself however, the internet is a big mess. It is full of webpages that cater
    to the needs to billions of individuals. Early on, engineers have been looking
    for a tool that can organize all the information in the web and help people find
    what they are looking for in the least amount of time.


    The search engine is that tool.


    This is the function of the search engine. They “crawl” through as many webpages
    as they can by making artificial intelligence visit webpages and collect information.
    They add information about the crawled pages in an index. When a person types
    a search query, the search engine runs through all the crawled pages and brings
    back a list of pages that fits the query. It then organizes these pages according
    to their relevance to the query of the user.


    Billions of people use search engines monthly. Some of them may be interested
    in your website. In order to drive traffic into your website, you want your webpages
    to rank high in the search results of your target visitor.


    # What are search queries?


    Search queries are questions from search engine users. They are using the search
    engine to look for answers. Here are the three types of questions that people
    as search engines:


    # Where/ how can I find [name of thing?'
  - '[PAGE 69]


    Some people use queries to look for specific real world things or locations. A
    person may be looking for a second-hand car around New York. He asks the search
    engine to look for all the posted classified ads about second-hand cars by typing:


    “Second-hand cars in New York City classified ads”


    He finds that there are too many results so he narrows down his search to:


    “Second-hand Lexus in Manhattan craigslist”


    # What, When and Where Questions


    Most of the time however, people use search engines to look for information. Some
    people for example, use search engines to look for answers for their schoolwork.
    Many people also go to search engines to look for news about current events relevant
    to them. Instead of looking for a phonebook, people also find it faster to find
    the address and contact number of a business through the internet.


    # What is the website of [company name]?


    Lastly, people use search engines to go to specific areas on the web. Some people
    for example, want to go to the website of their local newspaper. They do not know
    the exact website address so they ask google to lead them there.


    The search engine has become the primary source of answers for most people in
    developed countries. The majority of users of search engines like Google trust
    the search results compiled by the algorithm. Most people expect to find the answer
    to their query in top result. If the first five results do not seem to have the
    answer to their question, people tend to think that there must be something wrong
    with the phrase they used in the query. Most people refine their search just like
    the guy looking for a second-hand Lexus in New York.


    # How does this affect your website?'
- md: 'If you want to get more traffic into your website, you need to know how search
    engines work and you need to be able to optimize your webpages so that they will
    be crawled, indexed and shown in the top of the search results page.


    Showing up in search is not good enough when it comes to SEO. The top result is
    clicked on more than 18% of the time. The number of clicks your pages get lowers
    as your pages shows up lower on the search engine results page.


    In the advent of smartphones, people thought at first that the popularity of websites
    would begin to decrease. The average person thought that apps would replace search.
    If this will indeed happen, it has not showed up so far. Though the number of
    hours spent in front of desktop computers has decreased, people are still using
    search to find the information that they need and the items that they want. People
    with websites optimized for mobile phone screens will get the bulk of the traffic
    from mobile search.


    ## Activity for Days 1 and 2: Decide on your website’s topic or niche


    It is easier for your website to rank if your website is focused on one subject.
    If you already have a general information website or blog, you can decide on the
    best topic to pursue based on the popular posts or content you already have.


    When thinking of a topic or niche for your website, you should also consider your
    personal goal for building it. The type of content that you create henceforth
    should take you a step closer to reaching your goal.


    ## 第六章 计算机辅助设计


    计算机辅助设计（Computer-Aided Design，简称 CAD）是指利用计算机软件来创建、修改、分析或优化设计的过程。它广泛应用于机械工程、建筑、电子和土木工程等领域。


    ### 6.1 CAD 的发展历史


    - 1960年代：最早期的 CAD 系统诞生。

    - 1980年代：PC 上的 CAD 软件开始普及。

    - 2000年代至今：向三维建模和云协作发展。


    ### 6.2 核心功能


    | 功能 | 说明 |

    |------|------|

    | 草图绘制 | 创建 2D 几何形状 |

    | 建模 | 生成 3D 实体或曲面 |

    | 装配 | 将多个零件组合成装配体 |

    | 出图 | 生成标准的工程图纸 |


    ## Chapter 2: Limitations of the search technology


    The search engine is the most popular tool for looking for information on the
    web. However, even with all the improvements in search algorithm and page crawling
    technology, this tool still has plenty of limitations. For instance, a search
    engine cannot directly tell on its own if a webpage is relevant to users after
    crawling and indexing it. It needs to look for more clues in order to know if
    a certain page should be on the top of the search results for certain keywords.


    Your job as a webmaster and search marketer is to provide search engines with
    the clues they will need to put you on the top result. Search engine experts refer
    to these clues as ranking factors. Ranking factors are the information that search
    engine spiders look for when they arrive at your website. They compile these ranking
    factors during indexing. A webpage’s position in the search results for keywords
    will depend on how well their ranking scores are, based on these factors.


    Even when considering hundreds of ranking factors, search engines still have many
    limitations.


    What are the limitations of search engines?


    - Crawler bots rely on links to get around


    The search engine crawlers’ purpose is to make a virtual map of the entire searchable
    internet, and by that, we mean the parts of the internet that regular people can
    access. To jump from one page to another, they use hyperlinks in the pages that
    they crawl. These digital bridges are an important ranking factor.


    If there are some pages in your website that does not have a link leading to it,
    you should expect that it will not be indexed and not show up in search result
    pages.


    - They cannot crawl to pages protected by online forms


    It is common for websites to ask their visitors to become members. To become one,
    you need to fill up a membership form. Search engines are not equipped with the
    programing to fill up all types of forms. Because of this, they cannot crawl any
    information that webmasters exclusively show to members.


    - They are specialized for text-content


    Search engine crawlers specialize in gathering information from text-based websites.
    Their ability to collect and organize information from non-text content is severely
    limited. A crawler bot for example will not be able to tell on its own, how a
    picture looks. They also face similar challenges with video, audio, image, flash
    and plug-in contents.


    To work around this, search companies ask webmasters to include text information
    with these contents. Without this additional information, certain types of content
    in a webpage will not be given much weight when ranking it.


    - They require keywords to match


    When a user uses the search engine, they generally type in a phrase that describes
    what they are looking for. The search engine algorithm has evolved and they are
    more capable than ever to provide you with relevant webpages 90% of the time.
    Users may run into some issues however if they are not using the right terms.
    Millions of users use uncommon terms when searching for something unfamiliar.


    This limitation is common among people who are new to the English language. When
    they do not know the word for something, they may use adjectives to describe it.
    A native English speaker will know what he may be trying to say but search engines
    do not have the programming to understand what a non-native speaker may be asking
    for.


    This issue also becomes difficult to work with when we are using language subtleties
    that are unfamiliar for the search AI. The difference in spelling of the same
    words among different English speaking countries for example will affect your
    search result ranking. If you use “behaviour” in place of “behavior” consistently
    for example, the search engine may think that your webpage is designed for British
    users. This will affect your ranking among American users.


    Success in search marketing will greatly depend on your knowledge of the language
    that you are working with. If you are targeting a specific minority group as prospect
    visitors for your website for example, you should know the subtle differences
    in their use of language. It also helps if you have knowledge of their searching
    behavior.


    - Proper names vs general names


    Because of the dependence on keywords, search engines also have the challenge
    of reading words in the right context. This challenge becomes more difficult as
    users use keywords that have multiple meanings. For example, popular culture has
    been using the word “black” quite extensively. There are songs, movies, and brands
    that contain that word. People who type them in search may also be referring to
    the color of an item they are looking for. Because of this, search engine users
    tend to make longer phrases when they search to make the results more specific
    to their needs. Because of this search behavior, webmasters started targeting
    long-tail keywords. These are phrases that people usually use when searching.
    They are more than three words long and they refer to very specific needs of the
    searcher.


    The search technology is constantly changing. Engineers are continuing to develop
    new forms of technology so the A.I. can work around these limitations. It is because
    of these limitations that we need to optimize our webpages for both users and
    the search engines.


    ## Activity for Days 3 and 4:


    You should take the time to review the limitations of search engines discussed
    in this chapter and think of the difficulties of your prospective visitors in
    reaching your website through the search engines.


    You should also take the time to check your website’s visibility in search engine
    results page. Use generic keywords and phrases for your industry or niche. If
    you cannot find your website in the first three pages, you need to do a lot of
    work. If you are in the top three pages but you are not in the first page, your
    goal is to climb up the ladder. Regardless of your position, you should use the
    strategies and information in this book to improve your website’s ranking.'
