    >>> math

    <module ''math'' (built-in)>

    ```


    It says that "math" is a module. Thus, it has its own namespace. You can show
    the names inside math''s namespace using the dir() function:


    ```

    >>> dir(math)

    [''__doc__'', ''__name__'', ''acos'', ''asin'', ''atan'', ''atan2'', ''ceil'',
    ''cos'', ''cosh'', ''degrees'', ''e'', ''exp'', ''fabs'', ''floor'', ''fmod'',
    ''frexp'', ''hypot'', ''ldexp'', ''log'', ''log10'', ''modf'', ''pi'', ''pow'',
    ''radians'', ''sin'', ''sinh'', ''sqrt'', ''tan'', ''tanh'']

    >>>

    ```'
  - '[PAGE 123]


    4. Case Sensitivity – Variables are always case-sensitive. That means “SMITH,”
    “Smith,” and “smith” are three different variables.


    5. Tabs and Spaces Don’t Mix – Since whitespaces are important in Python, keep
    in mind that tabs and spaces cannot be mixed. Be consistent while indenting your
    python statements. If you’ll use spaces for indention, stick to that character.
    This is an important concept that many beginners forget about.


    Although tabs and spaces have the same appearance, they give different meanings
    when read by the Python interpreter. That means you’ll experience errors or weird
    results if you’ll mix them in your statements.


    Important Note: If you prefer to use spaces, make sure that you will hit the spacebar
    four times for each indention.'
  - '[PAGE 124]


    # Chapter 4: Sequences


    Sequences, one of the basic structures in programming, allow you to save values
    easily and efficiently. Python supports three types of sequences, namely: lists,
    tuples, and strings. Let''s discuss each sequence in detail:


    # *Lists*


    As their name suggests, lists are collections of values that follow a certain
    arrangement. You can use square brackets to create a list. For instance, you can
    use the statement below to initialize an empty list:


    ```

    spam = []

    ```


    You should use commas to separate values. Here''s a sample list:


    ```

    spam = ["bacon", "eggs", 42]

    ```


    You can place different kinds of values inside the same list. For instance, the
    list above holds numbers and letters.


    Similar to characters within a string, you can access listed items using indices
    that start at zero. Accessing a listed item is easy. You just have to specify
    the name of the list where that item belongs. Then, indicate the number of the
    item inside the list. Enclose the number using square brackets. Here''s an example:


    ```

    >>> spam

    [''bacon'', ''eggs'', 42]

    >>> spam[0]

    ''bacon''

    >>> spam[1]

    ''eggs''

    >>> spam[2]

    42

    ```'
  - '[PAGE 125]


    Python also allows you to enter negative integers. These numbers are counted backwards,
    starting from the last item in the list.


    ```

    >>> spam[-1]

    42

    >>> spam[-2]

    ''eggs''

    >>> spam[-3]

    ''bacon''

    ```


    You may use len() to determine the quantity of items inside a list. Check the
    image below:


    ```

    >>> len(spam)

    3

    ```


    Lists are similar to typical variables in one aspect: they allow you to change
    the items inside them. Analyze the following example:


    ```

    >>> spam = ["bacon", "eggs", 42]

    >>> spam

    [''bacon'', ''eggs'', 42]

    >>> spam[1]

    ''eggs''

    >>> spam[1] = "ketchup"

    >>> spam

    [''bacon'', ''ketchup'', 42]

    ```


    You can also slice strings:


    ```

    >>> spam[1:]

    [''eggs'', 42]

    >>> spam[:-1]

    [''bacon'', ''eggs'']

    ```


    Python offers different methods of adding items to any list. However, the easiest
    method is this:


    ```

    >>> spam.append(10)

    >>> spam

    [''bacon'', ''eggs'', 42, 10]

    ```'
  - '[PAGE 126]


    To remove items, you can apply the “del” statement onto the list.

    Here’s an example:


    ```

    >>> spam

    [''bacon'', ''and'', ''eggs'', 42, 10]

    >>> del spam[1]

    >>> spam

    [''bacon'', ''eggs'', 42, 10]

    >>> spam[0]

    ''bacon''

    >>> spam[1]

    ''eggs''

    >>> spam[2]

    42

    >>> spam[3]

    10

    ```


    Lists automatically “fix” themselves after each item deletion. That means you
    won’t see any gap in the numbering of items.


    # **Tuples**


    Tuples and lists are similar except for one thing: tuples cannot be edited. After
    creating a tuple, you won’t be able to change it in any way. You can’t expand,
    edit, or delete the elements within a tuple. If you’ll ignore this immutability,
    you can say that lists and tuples are identical.


    You should use commas when declaring tuples:


    ```

    unchanging = "rocks", 0, "the universe"

    ```


    Sometimes, you have to differentiate tuples using parentheses. This process is
    similar to performing several assignments using the same line. Here’s a simple
    example:


    ```

    foo, bar = "rocks", 0, "the universe" # 3 elements here

    foo, bar = "rocks", (0, "the universe") # 2 elements here because the second element
    is a tuple

    ```


    # **Strings**'
  - '[PAGE 127]


    You’ve already learned about strings. However, it is important to discuss it again
    as a Python sequence. For other programming languages, you can access the characters
    elements inside strings using square brackets (known as the subscript operator).
    This method is also effective in Python:


    ```

    >>> "Hello, world!"[0]

    ''H''

    >>> "Hello, world!"[1]

    ''e''

    >>> "Hello, world!"[2]

    ''l''

    >>> "Hello, world!"[3]

    ''l''

    >>> "Hello, world!"[4]

    ''o''

    ```


    Python assigns numbers to indices using this formula: 0 – n1 (n represents the
    number of characters in the string). Check the screenshot below:


    ![](img/edde2f38fefa2da4a5b5a879e12218fe_127_0.png)


    Indices work with the characters that come right after them. For negative indices,
    you should count backwards:


    ```

    >>> "Hello, world!"[-2]

    ''d''

    >>> "Hello, world!"[-9]

    ''o''

    >>> "Hello, world!"[-13]

    ''H''

    >>> "Hello, world!"[-1]

    ''!''

    ```


    Unlike other programming languages, Python allows you to place up to 2 numbers
    inside square brackets. You can do this using a colon (i.e. “:”). For sequences
    that concentrate on numeric indices, the combination of brackets and colons returns
    the portion between the indices. This technique is called “slicing.” If you’ll
    slice a string, you will get “substrings.” Analyze the screenshot below:'
  - '[PAGE 128]


    ```

    >>> "Hello, world!"[3:9]

    ''lo, wo''

    >>> string = "Hello, world!"

    >>> string[:5]

    ''Hello''

    >>> string[-6:-1]

    ''world''

    >>> string[-9:]

    ''o, world!''

    >>> string[:-8]

    ''Hello''

    >>> string[:]

    ''Hello, world!''

    ```


    The statements given above show an important rule:


    > “If you’ll omit a number, Python assumes the missing number as the start or
    end of that particular sequence (depending on the position of the missing number).”


    # **Dictionaries**


    Dictionaries are similar to lists. Unlike tuples, dictionaries allow users to
    modify their content. That means you may add, edit, and delete the elements of
    any dictionary. The main difference between lists and dictionaries is this: dictionaries
    don’t bind their elements to any number.


    A dictionary’s element has two aspects: (1) the key and (2) the value. If you’ll
    call the key of a dictionary, you’ll get the values related to that particular
    key. Computer programmers consider lists as special dictionaries, where numbers
    represent the key of each element.


    # _How to Use a Dictionary_


    You should use curly braces when declaring a dictionary. Also, you should use
    the following format when declaring elements for a dictionary: (1) enter the key
    of the element, (2) add a colon, and (3) assign the value. Here’s an example:'
  - '[PAGE 129]


    ```

    >>> definitions = {"guava": "a tropical fruit", "python": "a programming language",
    "the answer": 42}

    >>> definitions

    {''python'': ''a programming language'', ''the answer'': 42, ''guava'': ''a tropical
    fruit''}

    >>> definitions["the answer"]

    42

    >>> definitions["guava"]

    ''a tropical fruit''

    >>> len(definitions)

    3

    ```


    Additionally, adding elements to dictionaries is simple and easy. It’s like adding
    an ordinary variable:


    ```

    >>> definitions["new key"] = "new value"

    >>> definitions

    {''python'': ''a programming language'', ''the answer'': 42, ''guava'': ''a tropical
    fruit'', ''new key'': ''new value''}

    ```'
- md: "## Chapter 5: The Different Types of Data\n\nBasically, data types define an\
    \ object’s capabilities. In other languages, the effectiveness of an operation\
    \ is tested by ensuring that the object cannot be stored where the operation is\
    \ going to be performed. This system is known as static typing.\n\nHowever, Python\
    \ uses a different approach. This programming language allows you to store the\
    \ object’s data type inside that object. Python also checks the validity of each\
    \ operation as soon as you run them. Programmers refer to this system as dynamic\
    \ typing.\n\nThis chapter focuses on the different kinds of data that you can\
    \ use with Python.\n\n**The Standard Types**\n\nPython has a set of standard data\
    \ types. These types are pre-installed into this programming language. Let’s divide\
    \ these types into small groups. This section will use the hierarchy system used\
    \ in Python’s official documentation:\n\n### The Numeric Types\n\n- int – This\
    \ stands for integers. For Python 2.x, “int” is identical to C longs.\n- long\
    \ – It stands for long integers whose length is non-limited. You’ll find this\
    \ type in systems that use Python 2.x.\n- float – This stands for floating-point\
    \ numbers. Float is the equivalent of doubles in C.\n- complex – This type is\
    \ composed of complex numbers.\n\n### The Sequences\n\n- list\n- tuple\n- bytes\
    \ – This is a sequence of numbers within the 0-255 range. You’ll find bytes in\
    \ systems that use Python 3.x.\n- bytearray – This is the mutable version of bytes.\n\
    - str – This stands for “String.” Python 2.x systems represent strings as sequences\
    \ of 8-bit items. Python 3.x systems, however, represent them as sequences of\
    \ Unicode items.\n\n### The Sets\n\n- set – This is an unorganized group of distinct\
    \ objects.\n- frozenset – This type is the immutable version of sets.\n\n### The\
    \ Mappings\n\n- dict – This stands for Python dictionaries. Computer programmers\
    \ refer to this type as a “hashmap” or “associative array.” In general, each element\
    \ of a dictionary has a corresponding definition.\n\n### Mutable and Immutable\
    \ Objects\n\nIn the Python language, data types are categorized based on the mutability\
    \ of their contents. Keep in mind that immutable data types prevent you from changing\
    \ the objects inside them. That means you’ll succeed in slicing or reassigning\
    \ the objects of mutable data. Immutable ones, however, will give you an error\
    \ message.\n\nHere’s an important principle that you should remember: variables\
    \ are simple references to the objects inside a machine’s memory. Let’s assume\
    \ that you paired an object and a variable using the following statement:\n\n\
    ```\na = 1\ns = 'abc'\nl = ['a string', 456, ('a', 'tuple', 'inside', 'a', 'list')]\n\
    ```\n\nWith the statement given above, you are making variables (i.e. 1, a, and\
    \ s) point to certain objects. Python stores this relationship between variables\
    \ and objects in the machine’s memory. Thus, you can conveniently access objects\
    \ whenever you want.\n\nFor the next example, let’s say you performed a reassignment\
    \ using the code below:\n\n```\na = 7\ns = 'xyz'\nl = ['a simpler list', 99, 10]\n\
    ```\n\nIn this new statement, you linked the variables to other objects. As you’ve\
    \ learned earlier, you can only change mutable objects (l[0] = 1 is good, but\
    \ s[0] = \"a\" will give you an error message).\n\n### How to Create Objects of\
    \ a Defined Type\n\n- *Literal Integers* – You can enter literal integers in three\
    \ different ways:\n  - For decimal numbers – You can enter these numbers directly.\n\
    \  - For hexadecimal numbers – You have to prepend 0X or 0x to enter this kind\
    \ of number.\n  - For octal literals – The method of entering these integers depends\
    \ on the Python version you are using:\n    - For Python 2.x – You must prepend\
    \ a zero to enter octals.\n    - For Python 3.x – You should prepend 0O or 0o\
    \ to enter octals.\n- *Floating Point Integers* – You can enter these numbers\
    \ directly.\n- *Long Integers* – You can enter a long integer in two ways:\n \
    \ - Directly (112233445566778899 is considered as a long integer)\n  - By appending\
    \ the letter \"L\" (1L is considered as a long integer).\n\nIf a computation that\
    \ involves short integers overflows, it is automatically converted into a long\
    \ integer.\n\n- *Complex Numbers* – You can enter this object by adding two numbers\
    \ (i.e. a real number and an imaginary number). Then, enter these numbers by appending\
    \ the letter \"j.\" That means 11+2j and 11j are complex numbers.\n- *Strings*\
    \ – You can enter strings as single- or triple-quoted objects.\n\nThe difference\
    \ between these two types lies in their delimiters and their potential length.\
    \ Single-quoted strings are restricted to one line only. You can enter single-quoted\
    \ strings using pairs of single quotation or double quotation marks. Check the\
    \ following example:\n\n```\n'foo' works, and\n\"moo\" works as well,\nbut\n'bar'\
    \ does not work, and\n\"baz' does not work either.\n\"quux'\" is right out.\n\
    ```\n\nTriple-quoted strings are similar to their single-quoted counterparts,\
    \ but they can cover multiple lines. Obviously, their delimiters (i.e. the quotation\
    \ marks) should be matched. You must enter these strings using 3 single or double\
    \ quotation marks. Here’s an instructive screenshot for you:\n\n```\n'''foo'''\
    \ works, and\n\"\"\"moo\"\"\" works as well,\nbut\n'''bar'\"\" does not work,\
    \ and\n\"\"\"baz''' does not work either.\n'''quux'\"\" is right out.\n```\n\n\
    - *Tuples* – You can enter tuples using parentheses. Place commas between objects\
    \ to separate them.\n\n```\n(10, 'Mary had a little lamb')\n```\n\nYou can enter\
    \ a single-element tuple by enclosing it in parentheses and adding a comma. Here’s\
    \ an example:\n\n```\n('this is a stupid tuple',)\n```\n\n- *Lists* – Lists work\
    \ like tuples, though they require square brackets:\n\n```\n['abc', 1, 2, 3]\n\
    ```\n\n- *Dictionaries* – You can create “Python dicts” by listing some pairs\
    \ of values and separating each pair using a colon. Use commas to separate dictionary\
    \ entries. Then, enclose the statements using curly braces. Check the image below:\n\
    \n```\n{'hello': 'world', 'weight': 'African or European?'}\n```\n\n### Null Objects\n\
    \nPython uses “None” as a null pointer analogue. In this aspect, Python is similar\
    \ to many programming languages. Actually, “None” isn’t a null reference or a\
    \ null pointer in itself – it is an object that only has one instance. You can\
    \ use “None” as a default argument value for functions. In Python, you must compare\
    \ objects against “None” using “is” instead of “==.”\n\n## Chapter 6: The Errors\
    \ That You Will Encounter\n\nPython users encounter three kinds of errors: exceptions,\
    \ logic errors, and syntax errors.\n\n**Exceptions**\n\nThese errors occur when\
    \ the Python interpreter cannot perform an action, though it knows what should\
    \ be done. A good example would be running a Google search while you are offline:\
    \ the machine knows what to do but it cannot accomplish it.\n\n**Logic Errors**\n\
    \nLogic errors are extremely hard to find. Also, they are the most common errors\
    \ that you'll get. Python programs that are affected by logic errors can still\
    \ run. However, they may crash or produce unexpected results.\n\nYou can use a\
    \ debugger to find and solve logic errors in your programs.\n\n**Syntax Errors**\n\
    \nThis is perhaps the most basic kind of error. A syntax error occurs when the\
    \ Python interpreter cannot understand a code. According to programmers, syntax\
    \ errors are fatal most of the time – you cannot execute codes that contain this\
    \ error.\n\nSyntax errors are often caused by typos, wrong arguments, or wrong\
    \ indentation. That means you should inspect your codes for these mistakes whenever\
    \ you encounter a syntax error.\n\nI’d like to **thank you** for taking time to\
    \ read my book. As a token of my gratitude I’d like to offer you one of my #1\
    \ Best Seller Books for FREE!\n\nYou will also receive lots of great & free content\
    \ in the future as well!! Simply click the link below and enter your name and\
    \ email address to get your FREE content today!\n\n[Click Here](https://example.com)\
    \ to return to the book!"
  mdcn: "\n## 第五章：不同的数据类型\n\n基本上，数据类型定义了对象的功能。在其他语言中，操作的有效性通过确保对象不能存储在要执行操作的位置来测试。这种系统被称为静态类型。\n\
    \n然而，Python 采用了一种不同的方法。这种编程语言允许你将对象的数据类型存储在该对象内部。Python 还会在你运行每个操作时立即检查其有效性。程序员将此系统称为动态类型。\n\
    \n本章重点介绍你可以与 Python 一起使用的不同类型的数据。\n\n**标准类型**\n\nPython 有一组标准数据类型。这些类型已预装到此编程语言中。让我们将这些类型分成几个小节。本节将使用\
    \ Python 官方文档中使用的层级系统：\n\n### 数值类型\n\n- int – 代表整数。对于 Python 2.x，“int”等同于 C 语言中的长整型。\n\
    - long – 代表长度不受限制的长整数。你会在使用 Python 2.x 的系统中找到此类型。\n- float – 代表浮点数。浮点数等同于 C 语言中的双精度浮点数。\n\
    - complex – 此类型由复数组成。\n\n### 序列\n\n- list\n- tuple\n- bytes – 这是在 0-255 范围内的数字序列。你会在使用\
    \ Python 3.x 的系统中找到 bytes。\n- bytearray – 这是 bytes 的可变版本。\n- str – 代表“字符串”。Python\
    \ 2.x 系统将字符串表示为 8 位项目的序列。而 Python 3.x 系统则将其表示为 Unicode 项目的序列。\n\n### 集合\n\n- set\
    \ – 这是一组无序的不同对象。\n- frozenset – 此类型是集合的不可变版本。\n\n### 映射\n\n- dict – 代表 Python\
    \ 字典。计算机程序员将此类型称为“哈希映射”或“关联数组”。通常，字典的每个元素都有一个对应的定义。\n\n### 可变和不可变对象\n\n在 Python\
    \ 语言中，数据类型根据其内容的可变性进行分类。请记住，不可变数据类型会阻止你更改其内部的对象。这意味着你可以成功地对可变数据进行切片或重新分配对象。但是，不可变类型会给你一个错误消息。\n\
    \n这里有一个你应该记住的重要原则：变量是对机器内存中对象的简单引用。假设你使用以下语句将一个对象与一个变量配对：\n\n```\na = 1\ns = 'abc'\n\
    l = ['a string', 456, ('a', 'tuple', 'inside', 'a', 'list')]\n```\n\n使用上面的语句，你使变量（即\
    \ 1、a 和 s）指向特定的对象。Python 在机器内存中存储这种变量和对象之间的关系。因此，你可以随时方便地访问对象。\n\n对于下一个例子，假设你使用下面的代码执行了重新赋值：\n\
    \n```\na = 7\ns = 'xyz'\nl = ['a simpler list', 99, 10]\n```\n\n在这个新语句中，你将变量链接到其他对象。正如你之前所学，你只能更改可变对象（`l[0]\
    \ = 1` 是可行的，但 `s[0] = \"a\"` 会给你一个错误消息）。\n\n### 如何创建已定义类型的对象\n\n- *字面整数* – 你可以通过三种不同的方式输入字面整数：\n\
    \  - 对于十进制数 – 你可以直接输入这些数字。\n  - 对于十六进制数 – 你必须在前面加上 0X 或 0x 来输入此类数字。\n  - 对于八进制字面量\
    \ – 输入这些整数的方法取决于你使用的 Python 版本：\n    - 对于 Python 2.x – 你必须在前面加上零才能输入八进制数。\n  \
    \  - 对于 Python 3.x – 你应该在前面加上 0O 或 0o 来输入八进制数。\n- *浮点整数* – 你可以直接输入这些数字。\n- *长整数*\
    \ – 你可以通过两种方式输入长整数：\n  - 直接输入（112233445566778899 被视为长整数）\n  - 通过添加字母“L”（1L 被视为长整数）。\n\
    \n如果涉及短整数的计算溢出，它会自动转换为长整数。\n\n- *复数* – 你可以通过添加两个数字（即实数和虚数）来输入此对象。然后，通过添加字母“j”来输入这些数字。这意味着\
    \ `11+2j` 和 `11j` 都是复数。\n- *字符串* – 你可以将字符串输入为单引号或三引号对象。\n\n这两种类型之间的区别在于它们的分隔符和潜在长度。单引号字符串仅限于一行。你可以使用单引号或双引号对来输入单引号字符串。查看以下示例：\n\
    \n```\n'foo' works, and\n\"moo\" works as well,\nbut\n'bar' does not work, and\n\
    \"baz' does not work either.\n\"quux'\" is right out.\n```\n\n三引号字符串类似于它们的单引号对应物，但它们可以跨越多行。显然，它们的分隔符（即引号）应该匹配。你必须使用\
    \ 3 个单引号或双引号来输入这些字符串。这里有一个有指导意义的截图供你参考：\n\n```\n'''foo''' works, and\n\"\"\"moo\"\
    \"\" works as well,\nbut\n'''bar'\"\" does not work, and\n\"\"\"baz''' does not\
    \ work either.\n'''quux'\"\" is right out.\n```\n\n- *元组* – 你可以使用圆括号输入元组。在对象之间放置逗号以分隔它们。\n\
    \n```\n(10, 'Mary had a little lamb')\n```\n\n你可以通过将其括在圆括号中并添加一个逗号来输入单元素元组。这里有一个例子：\n\
    \n```\n('this is a stupid tuple',)\n```\n\n- *列表* – 列表的工作方式类似于元组，尽管它们需要方括号：\n\n\
    ```\n['abc', 1, 2, 3]\n```\n\n- *字典* – 你可以通过列出一些值对并使用冒号分隔每对来创建“Python 字典”。使用逗号分隔字典条目。然后，用大括号括起这些语句。查看下面的图像：\n\
    \n```\n{'hello': 'world', 'weight': 'African or European?'}\n```\n\n### 空对象\n\n\
    Python 使用“None”作为空指针的类似物。在这方面，Python 与许多编程语言相似。实际上，“None”本身并不是一个空引用或空指针——它是一个只有一个实例的对象。你可以使用“None”作为函数的默认参数值。在\
    \ Python 中，你必须使用“is”而不是“==”来将对象与“None”进行比较。\n\n## 第六章：你将遇到的错误\n\nPython 用户会遇到三种类型的错误：异常、逻辑错误和语法错误。\n\
    \n**异常**\n\n当 Python 解释器无法执行某个操作，尽管它知道应该做什么时，就会发生这些错误。一个很好的例子是在你离线时进行 Google 搜索：机器知道该怎么做但无法完成它。\n\
    \n**逻辑错误**\n\n逻辑错误极难发现。此外，它们是你将遇到的最常见的错误。受逻辑错误影响的 Python 程序仍然可以运行。但是，它们可能会崩溃或产生意外的结果。\n\
    \n你可以使用调试器来查找和解决程序中的逻辑错误。\n\n**语法错误**\n\n这可能是最基本的错误类型。当 Python 解释器无法理解一段代码时，就会发生语法错误。根据程序员的说法，语法错误大多数时候是致命的——你无法执行包含此错误的代码。\n\
    \n语法错误通常是由拼写错误、错误的参数或错误的缩进引起的。这意味着每当你遇到语法错误时，你应该检查你的代码是否有这些错误。\n\n我想**感谢**你花时间阅读我的书。作为我感激之情的表示，我想免费赠送你一本我排名第一的畅销书！\n\
