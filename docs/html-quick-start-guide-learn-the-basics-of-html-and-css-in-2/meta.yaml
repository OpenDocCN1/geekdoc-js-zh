    5. Tabs and Spaces Don’t Mix – Since whitespaces are important in Python, keep
    in mind that tabs and spaces cannot be mixed. Be consistent while indenting your
    python statements. If you’ll use spaces for indention, stick to that character.
    This is an important concept that many beginners forget about.


    Although tabs and spaces have the same appearance, they give different meanings
    when read by the Python interpreter. That means you’ll experience errors or weird
    results if you’ll mix them in your statements.


