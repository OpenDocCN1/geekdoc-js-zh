    \ . . . . . . . . . . . . 1355 135\n\nIn this chapter, we will explore how objects\
    \ and properties are typed statically in TypeScript.\n\n## 16.1 Roles played by\
    \ objects\n\nIn JavaScript, objects can play two roles (always at least one of\
    \ them, sometimes mixtures):\n\n- Records have a fixed amount of properties that\
    \ are known at development time. Each property can have a different type.\n\n\
    - Dictionaries have an arbitrary number of properties whose names are not known\
    \ at development time. All property keys (strings and/or symbols) have the same\
    \ type, as have property values.\n\nFirst and foremost, we will explore objects\
    \ as records. We will briefly encounter objects as dictionaries later in this\
    \ chapter.\n\n## 16.2 Types for objects\n\nThere are two general types for objects:\n\
    \n- Object with an uppercase \"O\" is the type of all instances of class Object:\n\
    \  `let obj1: Object;`\n\n- Object with a lowercase \"o\" is the type of all non-primitive\
    \ values:\n  `let obj2: object;`\n\nObjects can also be typed via their properties:\n\
    \n```typescript\n// Object type literal\nlet obj3: {prop: boolean};\n\n// Interface\n\
    interface ObjectType {\n  prop: boolean;\n}\nlet obj4: ObjectType;\n```\n\nIn\
    \ the next sections, we'll examine all these ways of typing objects in more detail.\n\
    \n## 16.3 Object vs. object in TypeScript\n\n### 16.3.1 Plain JavaScript: objects\
    \ vs. instances of Object\n\nIn plain JavaScript, there is an important distinction.\n\
    \nOn one hand, most objects are instances of Object.\n\n```javascript\n> const\
    \ obj1 = {};\n> obj1 instanceof Object\ntrue\n```\n\nThat means:\n\n- Object.prototype\
    \ is in its prototype chains:\n  `> Object.prototype.isPrototypeOf(obj1)` true\n\
    \n- They inherit its properties.\n  `> obj1.toString === Object.prototype.toString`\
    \ true\n\nOn the other hand, we can create objects that don't have Object.prototype\
    \ in their prototype chains. For example, the following object does not have any\
    \ prototype at all:\n\n- `const obj2 = Object.create(null);`\n  `> Object.getPrototype(obj2)`\
    \ null\n\nobj2 is an object that is not an instance of class Object:\n\n- `typeof\
    \ obj2` 'object'\n- `obj2 instanceof Object` false\n\n### 16.3.2 Object (uppercase\
    \ “O”) in TypeScript: instances of class Object\n\nRecall that each class creates\
    \ two entities:\n\n- A constructor function C\n- An interface C describes instances\
    \ of the constructor function.\n\nSimilarly, TypeScript has two built-in interfaces:\n\
    \n- Interface Object specifies the properties of instances of Object, including\
    \ the properties inherited from Object.prototype.\n- Interface ObjectConstructor\
    \ specifies the properties of the class Object.\n\nThese are the interfaces:\n\
    \n```typescript\ninterface Object { // (A)\n  constructor: Function;\n  toString():\
    \ string;\n  toLocale(): string;\n  valueOf(): Object;\n  hasOwnProperty(v: PropertyKey):\
    \ boolean;\n  isPrototypeOf(v: Object): boolean;\n  isEnumerable(v: PropertyKey):\
    \ boolean;\n}\n```\n\n```typescript\ninterface ObjectConstructor {\n  /** Invocation\
    \ via \"new\" */\n  new(value?: any): Object;\n  /** Invocation via function calls\
    \ */\n  (value?: any): any;\n  readonly prototype: Object; // (B)\n  getPrototypeOf(o:\
    \ any): any;\n}\n```\n\n```typescript\n// ...\ndeclare var Object: BasicDBObject;\
    \ // (C)\n```\n\nObservations:\n\n- We have both a variable name is Object (line\
    \ C) and a type whose name is Object (line A).\n- Direct instances of Object have\
    \ no own properties, therefore object.prototype also matches Object (line B).\n\
    \n### 16.3.3 object (lowercase \"o\") in TypeScript: non-primitive values\n\n\
    In TypeScript, object is the type of all non-primitive values (primitive values\
    \ are undefined, null, booleans, bigints, strings). With this type, we can't access\
    \ any properties of a value.\n\n### 16.3.4 Object vs. object: primitive values\n\
    \nInterestingly, type Object matches primitive values:\n\n```typescript\nfunction\
    \ func1(x: Object) {\n  func1('abc'); // OK\n}\n```\n\nWhy is that? Primitive\
    \ values have all the properties required by Object because they inherit Object.prototype.\n\
    \n```javascript\n> 'abc'.hasOwnProperty === Object.prototype.hasOwnProperty\n\
    true\n```\n\nConversely, object does not match primitive values:\n\n```typescript\n\
    function func2(x: object) {\n// @ts-expect-error: Argument of type \"abc\" is\
    \ not assignable to\n// parameter of type 'object'. (2345)\nfunc2('abc');\n}\n\
    ```\n\n### 16.3.5 Object vs. object: incompatible property types\n\nWith Object,\
    \ TypeScript complains if an object has a property whose type conflicts with the\
    \ corresponding property in Object:\n\n```typescript\n// @ts-expect-error: Type\
