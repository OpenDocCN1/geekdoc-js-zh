    \ We'll learn which ones, when we explore the rules for assignability later in\
    \ this chapter.\n\n# 21.2.2 Interfaces with call signatures\n\nWe can also use\
    \ interfaces to define function types:\n\n```\ninterface Repeat {\n  (str: string,\
    \ times: number): string; // (A)\n}\n```\n\nNote:\n\n+   - The interface member\
    \ in line A is a call signature. It looks similar to a method signature, but doesn't\
    \ have a name.\n- The type of result is separated by a colon (not an arrow) and\
    \ can't be omitted.\n\nOn one hand, interfaces match more. On the other hand,\
    \ let us specify properties of functions (which is rare, but does happens):\n\n\
    ```\ninterface Incrementor1 {\n  (x: number): number;\n  increment: number;\n\
    }\n```\n\nWe can also specify properties via an intersection type (&) of a function\
    \ signature type and an object literal:\n\n```\ntype Incrementor2 =\n  (x: number)\
    \ => number\n  & { increment: number };\n```\n\n# 21.2.3 Checking if a callable\
    \ value matches a function type\n\nAs an example, consider this scenario: A library\
    \ exports the following function type.\n\n```\ntype StringPredicate = (str: string)\
    \ => boolean;\n```\n\nWe want to define a function whose type is compatible with\
    \ StringPredicate. And we want to check immediately if that's the case (vs. finding\
    \ out later when we use it for the first time).\n\n# 21.2.3.1 Checking arrow functions\n\
    \nIf we declare a variable const, we can perform the check by a type annotation:\n\
    \n```\nconst pred1: StringPredicate = (str) => str.length > 0;\n```\n\nNote that\
    \ we don't need to specify the type of parameter str because TypeScript can use\
    \ StringPredicate to infer it."
