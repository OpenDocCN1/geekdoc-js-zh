    # Chapter 11


    # What is a type in TypeScript?

    Two perspectives


    | Contents | |

    | 11.1 Three questions for each perspective . . . . . . . | 69 |

    | 11.2 Perspective 1: types are sets of values . . . . . . . . . . | 70 |

    | 11.3 Perspective 2: type compatibility relationships . . . . . . . | 70 |

