    \ function func2(arg: undefined|string) {}\n- Discriminated unions:\n  type Teacher\
    \ = { kind: 'Teacher', teacherId: string };\n  type Student = { kind: 'Student',\
    \ studentId: string };\n  type Attendee = Teacher | Student;\n- Types of optional\
    \ parameters:\n  function func4(arg?: string) {\n    //inferred-type: string |\
    \ undefined\n    arg;\n  }\n"
