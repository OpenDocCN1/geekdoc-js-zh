    \ 'Nein');\nassert.equal(toGerman1(NoYesEnum.Yes), 'Ja');\n```\n\nNoYesStrings\
    \ is the type version of NoYesEnum:\n\n```typescript\ntype NoYesStrings = 'No'\
    \ | 'Yes';\n```\n\n```typescript\nfunction toGerman2(value: NoYesStrings): string\
    \ {\n  switch (value) {\n    case 'No':\n      return 'Nein';\n    case 'Yes':\n\
    \      return 'Ja';\n  }\n}\nassert.equal(toGerman2('No'), 'Nein');\nassert.equal(toGerman2('Yes'),\
    \ 'Ja')\n```\n\nThe type NoYesStrings is the union of the string literals 'No'\
    \ and 'Yes'. The type operator | is related to the set-theoretic union operator\
    \ .\n\n### 14.1.2.1 Unions of string literal types can be checked for exhaustiveness\n\
    \nThe following code demonstrates exhaustiveness checks for unions of string literal\
    \ types:\n\n```typescript\n// @ts-expect-error: Function lacks ending return statement\n\
    // return type does not include 'undefined'. (2366)\nfunction toGerman3(value:\
    \ NoYesStrings): string {\n  switch (value) {\n    case 'Yes':\n      return 'Ja';\n\
    \  }\n}\n```\n\nWe forgot the case for 'No' and TypeScript warns us that the function\
    \ may return values that are not strings.\n\nWe could have checked exhaustiveness\
    \ more explicitly:\n\n```typescript\nclass UnsupportedValueError extends Error\
    \ {\n  constructor(value: never) {\n    super('Unsupported value: ' + value);\n\
    \  }\n}\n```\n\n```typescript\nfunction toGerman4(value: NoYesStrings): string\
    \ {\n  switch (value) {\n    case 'Yes':\n      return 'Ja';\n    default:\n \
    \     // @ts-expect-error: Argument of type \"No\" is not\n      // assignable\
    \ to parameter of type 'never'. (2345)\n      throw new UnsupportedError(value);\n\
    \  }\n}\n```\n\nNow TypeScript warns us that we reach the default case if value\
    \ is 'No'.\n\n## More information on exhaustiveness checking\n\nFor more information\
    \ on this topic, see §13.7.2.2 Protecting against forgetting cases via exhaustiveness\
    \ checks'.\n\n### 14.1.2.2 Downside: unions of string literals are less type-safe\n\
    \nOne downside of string literals is that non-member values can be mistaken for\
    \ members:\n\n```typescript\ntype Spanish = 'no' | 'si';\ntype English = 'no'\
    \ | 'yes';\n\nconst spanishWord: Spanish = 'no';\nconst englishWord: English =\
    \ spanishWord;\n```\n\nThis is logical because the Spanish 'no' and the English\
    \ 'no' are the same value. The actual problem is that there is no way to give\
    \ them different identities.\n\n## 14.1.3 Unions of symbol singleton types\n\n\
    ### 14.1.3.1 Example: LogLevel\n\nInstead of union of string literals, we can\
    \ also use unions of symbol singleton types. Let's start with a different enum\
    \ this time:\n\n```typescript\nenum LogLevel {\n  off = 'off',\n  info = 'info',\n\
    \  warn = 'warn',\n  error = 'error'\n}\n```\n\nTranslated to a union of symbol\
    \ singleton types, it looks as follows:\n\n```typescript\nconst off = Symbol('off');\n\
    const info = Symbol('info');\nconst warn = Symbol('warn');\nconst error = Symbol('error');\n\
    ```\n\n```typescript\n// %inferred-type: unique symbol | unique symbol |\n// unique\
    \ symbol | unique symbol\ntype LogLevel =\n  | typeof off\n  | typeof info\n \
    \ | typeof warn\n  | typeof error;\n```\n\nWhy do we need typeof of here? off,\
    \ etc. are values and can't appear in type equations. The type operator typeof\
    \ fixes this by converting values to types.\n\nLet's consider two variations of\
    \ the previous example.\n\n### 14.1.3.2 Variation #1: inline symbols\n\nCan we\
    \ inline the symbols (instead of referring to separate const declarations)? Alas,\
    \ the operand of the type operator typeof must be an identifier or a “path” of\
    \ identifiers separated by dots. Therefore, this syntax is illegal:\n\n```typescript\n\
    type LogLevel = Symbol('off') | ...\n```\n\n### 14.1.3.3 Variation #2: instead\
    \ of const\n\nCan we use let instead of const to create the variables? (That's\
    \ not necessarily an improvement but such an interesting question.)\n\nWe can't\
    \ because we need the narrower types that TypeScript infers for const-declared\
    \ variables:\n\n```typescript\n// inferred-type: unique symbol\nconst constSymbol\
    \ = Symbol('constSymbol');\n```\n\n```typescript\n// inferred-type: symbol\nlet\
    \ letSymbol = Symbol('letSymbol');\n```\n\nWith let, LogLevel would simply have\
    \ an alias for symbol. const assertions normally solve this kind of problem. But\
    \ they don't work in this case:\n\n```typescript\n// ts-expect-error: A 'const'\
    \ assertions can only be applied to references to enum\n// members, or string,\
    \ number, boolean, array, or object literals. (1355)\nlet letSymbol2 = Symbol('letSymbol2')\
    \ as const;\n```\n\n### 14.1.3.4 Using LogLevel in a function\n\nThe following\
    \ function translates members of LogLevel to strings:\n\n```typescript\nfunction\
    \ getName(loglevel: LogLevel): string {\n  switch (loglevel) {\n    case off:\n\
    \      return 'off';\n    case info:\n      return 'info';\n    case warn:\n \
    \     return 'warn';\n    case error:\n      return 'error';\n  }\n}\n```\n\n\
    ## 14.1.3.5 Unions of symbol types vs. string literals\n\nHow do the two approaches\
    \ differ?\n\n- Using symbols is more verbose.\n- Exhaustiveness checks work for\
    \ both.\n- Using string literals is less verbose.\n- This is an example of using\
    \ string literals:\n- Exhaustiveness checks work for both.\n\n## 14.2 Discriminated\
    \ unions\n\nTo understand how they work, consider the data structure that represents:\
    \ Next steps:\n\n- 1. We'll start by creating an object-oriented class hierarchy.\n\
    - 2. Then we'll transform it into something more functional.\n- 3. And finally,\
    \ we'll end up with discriminated union.\n\n### 14.2.1 Step 1: the syntax tree\
    \ as a class hierarchy\n\nThis is a typical object-oriented implementation of\
    \ a syntax tree:\n\n```typescript\nabstract class SyntaxTree {}\nclass NumberValue\
    \ extends SyntaxTree {\n  constructor(public numberValue: number) {\n    super();\n\
    \  }\n}\nclass Addition extends SyntaxTree {\n  constructor(public operand1: SyntaxTree,\
    \ public operand2: SyntaxTree) {\n    super();\n  }\n}\n```\n\nSyntaxTree is the\
    \ superclass of NumberValue and Addition. The keyword public is syntactic sugar\
    \ for declaring the instance property via the parameter.\n\nThis is an example\
    \ of using SyntaxTree:\n\n```typescript\nconst tree = new Addition(\n  new NumberValue(1),\n\
    \  new Addition(\n    new NumberValue(2),\n    new NumberValue(3), // trailing\
    \ comma\n  ),\n);\n```\n\nNote: trailing commas in argument lists are allowed\
    \ in JavaScript since 2016.\n\n### 14.2.2 Step 2: the syntax tree as a union of\
    \ classes\n\nIf we define the syntax tree as a union type (line A), we don't need\
    \ object-oriented inheritance:\n\n```typescript\nclass NumberValue {\n  constructor(public\
    \ numberValue: number) {}\n}\nclass Addition2 {\n  constructor(public operand1:\
    \ SyntaxTree, public operand2: SyntaxTree) {}\n}\ntype SyntaxTree2 = NumberValue\
    \ | Addition2; // (A)\n```\n\nSince NumberValue and Addition2 don't have a superclass,\
    \ they don't need to invoke super() in their constructors.\n\n### 14.2.3 Step\
    \ 3: the syntax tree as a discriminated union\n\nThese are the type definitions\
    \ for SyntaxTree3:\n\n```typescript\ninterface NumberValue {\n  kind: 'number-value';\n\
    \  numberValue: number;\n}\ninterface Addition3 {\n  kind: 'addition';\n}\n```\n"
  mdcn: "\n\n## 14.1 单例值的联合类型\n\n```typescript\nassert.equal(toGerman1(NoYesEnum.No),\
    \ 'Nein');\nassert.equal(toGerman1(NoYesEnum.Yes), 'Ja');\n```\n\nNoYesStrings\
    \ 是 NoYesEnum 的类型版本：\n\n```typescript\ntype NoYesStrings = 'No' | 'Yes';\n```\n\
    \n```typescript\nfunction toGerman2(value: NoYesStrings): string {\n  switch (value)\
    \ {\n    case 'No':\n      return 'Nein';\n    case 'Yes':\n      return 'Ja';\n\
    \  }\n}\nassert.equal(toGerman2('No'), 'Nein');\nassert.equal(toGerman2('Yes'),\
    \ 'Ja')\n```\n\n类型 NoYesStrings 是字符串字面量 'No' 和 'Yes' 的联合类型。类型运算符 `|` 与集合论中的并运算符\
    \ `∪` 相关。\n\n### 14.1.2.1 字符串字面量类型的联合可以进行穷尽性检查\n\n以下代码演示了字符串字面量类型联合类型的穷尽性检查：\n\
    \n```typescript\n// @ts-expect-error: 函数缺少结束返回语句\n// 返回类型不包含 'undefined'。(2366)\n\
    function toGerman3(value: NoYesStrings): string {\n  switch (value) {\n    case\
    \ 'Yes':\n      return 'Ja';\n  }\n}\n```\n\n我们忘记了 'No' 的情况，TypeScript 警告我们该函数可能返回非字符串的类型。\n\
    \n我们可以更显式地进行穷尽性检查：\n\n```typescript\nclass UnsupportedValueError extends Error\
    \ {\n  constructor(value: never) {\n    super('Unsupported value: ' + value);\n\
    \  }\n}\n```\n\n```typescript\nfunction toGerman4(value: NoYesStrings): string\
    \ {\n  switch (value) {\n    case 'Yes':\n      return 'Ja';\n    default:\n \
    \     // @ts-expect-error: 类型 \"No\" 的参数不能\n      // 赋值给类型 'never' 的参数。(2345)\n\
    \      throw new UnsupportedError(value);\n  }\n}\n```\n\n现在 TypeScript 警告我们，如果\
    \ value 为 'No'，将会进入 default 分支。\n\n## 关于穷尽性检查的更多信息\n\n有关此主题的更多信息，请参阅 §13.7.2.2\
    \ '通过穷尽性检查防止遗漏情况'。\n\n### 14.1.2.2 缺点：字符串字面量联合的类型安全性较低\n\n字符串字面量的一个缺点是，非成员值会被误认为是成员：\n\
    \n```typescript\ntype Spanish = 'no' | 'si';\ntype English = 'no' | 'yes';\n\n\
    const spanishWord: Spanish = 'no';\nconst englishWord: English = spanishWord;\n\
    ```\n\n这是逻辑上的，因为西班牙语的 'no' 和英语的 'no' 是同一个值。实际的问题是没有方法为它们赋予不同的标识。\n\n## 14.1.3\
    \ 符号单例类型的联合类型\n\n### 14.1.3.1 示例：LogLevel\n\n除了字符串字面量的联合，我们也可以使用符号单例类型的联合。这次我们换一个不同的枚举：\n\
    \n```typescript\nenum LogLevel {\n  off = 'off',\n  info = 'info',\n  warn = 'warn',\n\
    \  error = 'error'\n}\n```\n\n转换为符号单例类型的联合后，如下：\n\n```typescript\nconst off =\
    \ Symbol('off');\nconst info = Symbol('info');\nconst warn = Symbol('warn');\n\
    const error = Symbol('error');\n```\n\n```typescript\n// %inferred-type: unique\
    \ symbol | unique symbol |\n// unique symbol | unique symbol\ntype LogLevel =\n\
    \  | typeof off\n  | typeof info\n  | typeof warn\n  | typeof error;\n```\n\n\
    为什么我们这里需要 `typeof`？`off` 等是值，不能出现在类型等式中。类型运算符 `typeof` 通过将值转换为类型来解决这个问题。\n\n让我们考虑之前示例的两个变体。\n\
    \n### 14.1.3.2 变体 #1：内联符号\n\n我们可以内联符号（而不是引用单独的 const 声明）吗？遗憾的是，类型运算符 `typeof`\
    \ 的操作数必须是一个标识符或由点分隔的标识符“路径”。因此，这种语法是违法的：\n\n```typescript\ntype LogLevel = Symbol('off')\
    \ | ...\n```\n\n### 14.1.3.3 变体 #2：使用替 const\n\n我们可以使用 `let` 代替 `const` 来创建变量吗？（这不一定是改进，但这是一个非常有趣的问题。）\n\
    \n我们不能，因为我们需要 TypeScript 为 `const` 声明的变量推断出的更窄类型：\n\n```typescript\n// inferred-type:\
    \ unique symbol\nconst constSymbol = Symbol('constSymbol');\n```\n\n```typescript\n\
    // inferred-type: symbol\nlet letSymbol = Symbol('letSymbol');\n```\n\n如果使用 `let`，LogLevel\
    \ 将仅仅拥有 symbol 的一个别名。`const` 断言通常可以解决这类问题，但它们在此种情况下不起作用：\n\n```typescript\n//\
    \ ts-expect-error: 'const' 断言只能应用于枚举成员的引用，\n// 或字符串、数字、布尔值、数组或对象字面量。(1355)\nlet\
    \ letSymbol2 = Symbol('letSymbol2') as const;\n```\n\n### 14.1.3.4 在函数中使用 LogLevel\n\
    \n以下函数将 LogLevel 的成员转换为字符串：\n\n```typescript\nfunction getName(loglevel: LogLevel):\
    \ string {\n  switch (loglevel) {\n    case off:\n      return 'off';\n    case\
    \ info:\n      return 'info';\n    case warn:\n      return 'warn';\n    case\
    \ error:\n      return 'error';\n  }\n}\n```\n\n## 14.1.3.5 符号类型联合与字符串字面量\n\n\
    这两种方法有什么区别？\n\n- 使用符号更冗长。\n- 穷尽性检查均有效。\n- 使用字符串字面量更简洁。\n- 这是使用字符串字面量的示例：\n- 穷尽性检查均有效。\n\
    \n## 14.2 辨析联合\n\n为了理解它们如何工作，请考虑表示的数据结构。后续步骤：\n\n- 1. 我们首先创建一个面向对象的类层次。\n- 2.\
    \ 然后将其转换为更具函数式的形式。\n- 3. 最后，我们得到辨析联合。\n\n### 14.2.1 步骤 1：作为类层次的语法树\n\n这是语法树典型的面向对象实现：\n\
    \n```typescript\nabstract class SyntaxTree {}\nclass NumberValue extends SyntaxTree\
    \ {\n  constructor(public numberValue: number) {\n    super();\n  }\n}\nclass\
    \ Addition extends SyntaxTree {\n  constructor(public operand1: SyntaxTree, public\
    \ operand2: SyntaxTree) {\n    super();\n  }\n}\n```\n\nSyntaxTree 是 NumberValue\
    \ 和 Addition 的父类。`public` 关键字是通过参数声明实例属性的语法糖。\n\n这是使用 SyntaxTree 的示例：\n\n```typescript\n\
    const tree = new Addition(\n  new NumberValue(1),\n  new Addition(\n    new NumberValue(2),\n\
    \    new NumberValue(3), // 尾逗号\n  ),\n);\n```\n\n注意：JavaScript 从 2016 年开始允许参数列表中存在尾逗号。\n\
    \n### 14.2.2 步骤 2：作为类联合的语法树\n\n如果我们将语法树定义为联合类型（A A），不需要面向对象的继承：\n\n```typescript\n\
    class NumberValue {\n  constructor(public numberValue: number) {}\n}\nclass Addition2\
    \ {\n  constructor(public operand1: SyntaxTree, public operand2: SyntaxTree) {}\n\
    }\ntype SyntaxTree2 = NumberValue | Addition2; // (A)\n```\n\n由于 NumberValue 和\
    \ Addition2 没有父类，它们不需要在构造函数中调用 `super()`。\n\n### 14.2.3 步骤 3：作为辨析联合的语法树\n\n这些是\
    \ SyntaxTree3 的类型定义：\n\n```typescript\ninterface NumberValue {\n  kind: 'number-value';\n\
    \  numberValue: number;\n}\ninterface Addition3 {\n  kind: 'addition';\n}\n```\n\
