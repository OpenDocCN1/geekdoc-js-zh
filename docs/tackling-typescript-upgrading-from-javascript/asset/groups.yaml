    \n132\n\n16 对象的类型\n\n我们将继续两个 TypeScript 不允许多余属性的示例。\n\n16.4.7.5.1 允许多余属性：示例 Incrementor\n\
    \n在这个例子中，我们想要实现 `Incrementor`，但 TypeScript 不允许额外的属性 `counter`：\n\n```typescript\n\
