- md: "\n## 14.4 Enum pattern\n\nThe following example demonstrates a Java-inspired\
    \ enum pattern that works in plain JavaScript and TypeScript:\n\n```typescript\n\
    class Color {\n    static red = new Color();\n    static green = new Color();\n\
