    \ of function declarations\n\nTypeScript can usually infer the return types of\
    \ functions, but by specifying them explicitly is allowed and occasionally useful\
    \ (at the very least, it doesn't harm any).\n\nFor stringify123(), specifying\
    \ a return type is optional and looks like this:\n\n```\nfunction stringify123(callback:\
    \ (num: number) => string): string {\n  return callback(123);\n}\n```\n\n# 7.10.2.1\
    \ The special return type void\n\nvoid is a special return type for a function:\
    \ It tells TypeScript that the function always returns undefined.\n\nIt may do\
    \ so explicitly:\n\n```\nfunction f1(): void {\n  return undefined;\n}\n```\n\n\
    Or it may do so implicitly:\n\n```\nfunction f2(): void {};\n```\n\nHowever, a\
    \ function cannot explicitly return values other than undefined:\n\n```\nfunction\
    \ f3(): void {\n// @ts-expect-error: Type \"abc\" is not assignable to type 'void'.\
    \ (2322)\n  return 'abc';\n```"
- md: "\n## 7.10.3 Optional parameters\n\nA question mark after an identifier means\
    \ that the parameter is optional. For example:\n\n```\nfunction stringify123(callback?:\
    \ (num: number) => string) {\n  if (callback === undefined) {\n    callback =\
    \ String;\n  }\n  return callback(123); // (A)\n}\n```\n\nTypeScript only lets\
    \ us make the function call in line A if we make sure that callback isn’t undefined\
    \ (which is it if the parameter was omitted).\n\n## 7.10.3.1 Parameter default\
    \ values\n\nTypeScript supports parameter default values:\n\n```\nfunction createPoint(x=0,\
    \ y=0): [number, number] {\n  return [x, y];\n}\n\nassert.deepEqual(\n  createPoint(),\n\
    \  [0, 0]);\nassert.deepEqual(\n  createPoint(1, 2),\n  [1, 2]);\n```\n\nDefault\
    \ values make parameters optional. We can usually omit type annotations, because\
    \ TypeScript can infer the types. for example it infers x and y both have the\
    \ type number.\n\nIf we wanted to add type annotations, that would look as follows:\n\
    \n```typescript\nfunction createPoint(x:number = 0, y:number = 0): [number, number]\
    \ {\n  return [x, y];\n}\n```\n\n## 7.10.4 Rest parameters\n\nWe can also use\
    \ rest parameters in TypeScript parameter definitions. Their static types must\
    \ be Arrays (lists or tuples):\n\n```typescript\nfunction joinNumbers(...nums:\
    \ number[]): string {\n  return nums.join('-');\n}\nassert.equal(\n  joinNumbers(1,\
    \ 2, 3),\n  '1-2-3');\n```\n\n## 7.11 Union types\n\nThe values held by a variable\
    \ (one value at a time) may be members of different types. In that case, we need\
    \ a union type. For example, in the following code, stringOrNumber is either of\
    \ type string or of type number:\n\n```typescript\nfunction getScore(stringOrNumber:\
    \ string|number): number {\n  if (typeof stringOrNumber === 'string'\n    && /\\\
    d*(1,5)/.test(stringOrNumber)) {\n    return stringOrNumber.length;\n  } else\
    \ if (typeof stringOrNumber === 'number'\n    && stringOrNumber >= 1 && stringOrNumber\
    \ <= 5) {\n    return stringOrNumber;\n  } else {\n    throw new Error('Illegal\
    \ value: ' + JSON.stringify(stringOrNumber));\n  }\n}\n```\n\nassert.equal(getScore('******'),\
    \ 5);\nassert.equal(getScore(3), 3);\n\nstringOrNumber has the type string|number.\
    \ The result of the type expression s|t is the set-theoretic union of types s\
    \ and t (interpreted as sets).\n\n### 7.11.1 By default, undefined and null are\
    \ not included in types\n\nIn many programming languages, null is part of all\
    \ object types. For example, whenever the type of a variable is String in Java,\
    \ we can set it to null and Java won't complain.\n\nConversely, in TypeScript,\
    \ undefined and null are handled by separate, disjoint types. We need union types\
    \ such as undefined|string and null|string, if we want to allow them:\n\n```typescript\n\
    let maybeNumber: null|number = null;\nmaybeNumber = 123;\n```\n\nOtherwise, we\
    \ get an error:\n\n```typescript\n// @ts-expect-error: Type 'null' is not assignable\
    \ to type 'number'. (2322)\nlet maybeNumber: number = null;\nmaybeNumber = 123;\n\
    ```\n\nNote that TypeScript does not force us to initialize immediately (as long\
    \ as we don't read the variable before initializing it):\n\n```typescript\nlet\
    \ myNumber: number; // OK\nmyNumber = 123;\n```\n\n### 7.11.2 Making omissions\
    \ explicit\n\nRecall this function from earlier:\n\n```typescript\nfunction stringify123(callback?:\
    \ (num: number) => string) {\n  if (callback === undefined) {\n    callback =\
    \ String;\n  }\n  return callback(123); // (A)\n}\n```\n\nLet's rewrite stringify123()\
    \ so that parameter callback isn't optional: If a caller doesn't want to provide\
    \ a function, they must explicitly parse null. The result looks as follows.\n\n\
    ```typescript\nfunction stringify123(\n  callback: null | ((num: number) => string))\
    \ {\n  const num = 123;\n  if (callback === null) { // (A)\n    callback = String;\n\
    \  }\n  return callback(num); // (B)\n}\n```\n\n```typescript\nassert.equal(\n\
    stringify123(null,\n  '123');\n```\n\n```typescript\n// @ts-expect-error: Expected\
    \ 1 arguments, but got 0. (2554)\nassert.throws(() => stringify123(()));\n```\n\
    \nOnce again, we have to handle the case of callback not being a function (line\
    \ A) before we can make the call in line B. If we hadn't done so, TypeScript would\
    \ have reported an error in that line.\n\n## 7.12 Optional default value vs. undefined.|T\n\
    \nThe following three parameter declarations are quite similar:\n\n- Parameter\
    \ is optional: x?: number\n- Parameter has a default value: x = 456\n- Parameter\
    \ has a union type: x: undefined | number\n\nIf the parameter is optional, it\
    \ can be omitted. In that case, it has the value\n\n```typescript\nfunction f1(x?:\
    \ number) { return x }\n```\n\n```typescript\nassert.equal(f1(123), 123); // OK\n\
    assert.equal(f1(undefined), undefined); // OK\nassert.equal(f1(), undefined);\
    \ // can omit\n```\n\nIf the parameter has a default value, that is used when\
    \ the parameter is either\nomitted or set to undefined:\n\n```typescript\nfunction\
    \ f2(x = 456) { return x }\n```\n\n## 7.13 Typing objects\n\n```typescript\nassert.equal(f2(123),\
    \ 123); // OK\nassert.equal(f2(undefined), 456); // OK\nassert.equal(f2(), 456);\
    \ // can omit\n```\n\nIf the parameter has a union type, it can't be omitted,\
    \ but we can set it to undefined:\n\n```typescript\nfunction f3(x: undefined |\
    \ number) { return x }\n```\n\n```typescript\nassert.equal(f3(123), 123); // OK\n\
    assert.equal(f3(undefined), undefined); // OK\n```\n\n```typescript\n// @ts-expect-error:\
    \ Expected 1 arguments, but got 0. (2554)\nf3(); // can omit\n```\n\n## 7.13 Typing\
    \ objects\n\nSimilarly to Arrays, objects play two roles in JavaScript (that are\
    \ occasionally mixed):\n\n- Records: A fixed number of properties that are known\
    \ at development time. Each property can have a different type.\n- Dictionaries:\
    \ An arbitrary number of properties whose names are not known at development time.\
    \ All properties have the same type.\n\nWe are ignoring objects-as-dictionaries\
    \ in this chapter - they are covered in §16.4.5 “Index signatures: objects as\
    \ dicts”. As an aside, Maps are usually a better choice for dictionaries, anyway.\n\
    \n### 7.13.1 Typing objects-as-records via interfaces\n\nInterfaces describe objects-as-records.\
    \ For example:\n\n```typescript\ninterface Point {\n  x: number;\n  y: number;\n\
    }\n```\n\nWe can also separate members via commas:\n\n```typescript\ninterface\
    \ Point {\n  x: number;\n  y: number;\n}\n```\n\n### 7.13.2 TypeScript’s structural\
    \ typing vs. nominal typing\n\nOne advantage of TypeScript's type system is that\
    \ it works structurally, not nominally. That is, Point matches all objects that\
    \ have the appropriate structure.\n\nConversely, in Java's nominal type system,\
    \ we must explicitly declare which interfaces it implements. Therefore, a class\
    \ can only implement interfaces that exist at its creation time.\n\n### 7.13.3\
    \ Object literal types\n\nObject literal types are anonymous interfaces:\n\n```typescript\n\
    type Point = {\n  x: number;\n  y: number;\n};\n```\n\nOne benefit of object literal\
    \ types is that they can be used inline:\n\n```typescript\nfunction toString(pt:\
    \ {x: number, y: number}) {\n  return `${pt.x}, ${pt.y}`;\n}\n```\n\n### 7.13.4\
    \ Optional properties\n\nIf a property can be omitted, we put a question mark\
    \ after its name:\n\n```typescript\ninterface Person {\n  name: string;\n  company?:\
    \ string;\n}\n```\n\nIn this example, both john and jane match the interface:\n\
    \n```typescript\nconst john: Person = {\n  name: 'John',\n};\nconst jane: Person\
    \ = {\n  name: 'Jane',\n  company: 'Massive'\n};\n```\n\n### 7.13.5 Methods\n\n\
    Interfaces can also contain methods:\n\n```typescript\ninterface Point {\n  x:\
    \ number;\n  y: number;\n  distance(other: Point): number;\n}\n```\n\n## 7.14\
    \ Type variables and generic types\n\nRecall the two language levels of TypeScript:\n\
    \n- Values exist at the dynamic level.\n- Types exist at the static level.\n\n\
    My recommendation is to use whichever syntax expresses how a property should be\
    \ setup. Normal functions exist at the dynamic level, are factories for values\
    \ and have parameters representing values. Parameters are declared between parentheses:\n\
    ```typescript\nconst valueFactory = <T>(x: T): T => x; // definition\nconst value\
    \ = valueFactory<number>(123); // use\n```\n\n- Generic types exist at the static\
    \ level, are factories for types and have parameters representing types. Parameters\
    \ are declared between angle brackets:\n```typescript\ntype Box<T> = { content:\
    \ T };\n```\n"
  mdcn: "\n\n## 7.10.3 可选参数\n\n标识符后面的问号意味着该参数是可选的。例如：\n\n```typescript\nfunction stringify123(callback?:\
    \ (num: number) => string) {\n  if (callback === undefined) {\n    callback =\
    \ String;\n  }\n  return callback(123); // (A)\n}\n```\n\n只有在我们确保 `callback` 不是\
    \ `undefined` 时（如果省略了参数，它就是未定义的），TypeScript 才允许我们在行 A 中进行函数调用。\n\n## 7.10.3.1\
    \ 参数默认值\n\nTypeScript 支持参数默认值：\n\n```typescript\nfunction createPoint(x=0, y=0):\
    \ [number, number] {\n  return [x, y];\n}\n\nassert.deepEqual(\n  createPoint(),\n\
    \  [0, 0]);\nassert.deepEqual(\n  createPoint(1, 2),\n  [1, 2]);\n```\n\n默认值使参数变为可选。我们通常可以省略类型注解，因为\
    \ TypeScript 可以推断类型。例如，它推断出 x 和 y 的类型均为 `number`。\n\n如果我们想添加类型注解，写法如下：\n\n```typescript\n\
    function createPoint(x:number = 0, y:number = 0): [number, number] {\n  return\
    \ [x, y];\n}\n```\n\n## 7.10.4 剩余参数\n\n我们还可以在 TypeScript 参数定义中使用剩余参数。它们的静态类型必须是数组（列表或元组）：\n\
    \n```typescript\nfunction joinNumbers(...nums: number[]): string {\n  return nums.join('-');\n\
    }\nassert.equal(\n  joinNumbers(1, 2, 3),\n  '1-2-3');\n```\n\n## 7.11 联合类型\n\n\
    变量所持有的（一次一个值）可以是不同类型的成员。在这种情况下，我们需要联合类型。例如，在下面的代码中，`stringOrNumber` 既可以是 `string`\
    \ 类型也可以是 `number` 类型：\n\n```typescript\nfunction getScore(stringOrNumber: string|number):\
    \ number {\n  if (typeof stringOrNumber === 'string'\n    && /\\d*(1,5)/.test(stringOrNumber))\
    \ {\n    return stringOrNumber.length;\n  } else if (typeof stringOrNumber ===\
    \ 'number'\n    && stringOrNumber >= 1 && stringOrNumber <= 5) {\n    return stringOrNumber;\n\
    \  } else {\n    throw new Error('Illegal value: ' + JSON.stringify(stringOrNumber));\n\
    \  }\n}\n```\n\nassert.equal(getScore('******'), 5);\nassert.equal(getScore(3),\
    \ 3);\n\n`stringOrNumber` 的类型是 `string|number`。类型表达式 `s|t` 的结果是类型 `s` 和 `t` 的集合并（解释为集合）。\n\
    \n### 7.11.1 默认情况下，undefined 和 null 不包含在类型中\n\n在许多编程语言中，`null` 是所有对象类型的一部分。例如，在\
    \ Java 中，当变量类型为 `String` 时，我们可以设置为 `null` 而 Java 不会报错。\n\n相反，在 TypeScript 中，`undefined`\
    \ 和 `null` 由独立的、不相交的类型处理。如果我们想允许它们存在，就需要像 `undefined|string` 和 `null|string` 这样的联合类型：\n\
    \n```typescript\nlet maybeNumber: null|number = null;\nmaybeNumber = 123;\n```\n\
    \n否则，我们会得到错误：\n\n```typescript\n// @ts-expect-error: Type 'null' is not assignable\
    \ to type 'number'. (2322)\nlet maybeNumber: number = null;\nmaybeNumber = 123;\n\
    ```\n\n注意，TypeScript 并不强制我们立即初始化（只要我们在初始化之前没有读取变量）：\n\n```typescript\nlet myNumber:\
    \ number; // OK\nmyNumber = 123;\n```\n\n### 7.11.2 显式省略省略\n\n回顾这个函数：\n\n```typescript\n\
    function stringify123(callback?: (num: number) => string) {\n  if (callback ===\
    \ undefined) {\n    callback = String;\n  }\n  return callback(123); // (A)\n\
    }\n```\n（注：此处原文示例似乎有误，已根据上下文逻辑翻译）\n\n让我们重写 `stringify123`，使得 `callback` 不是可选的：如果调用者不想提供函数，他们必须显式传递\
    \ `null`。结果如下：\n\n```typescript\nfunction stringify123(\n  callback: null | ((num:\
    \ number) => string)) {\n  if (callback === null) { // (A)\n    callback = String;\n\
    \  }\n  return callback(123); // (B)\n}\n```\n\n```typescript\nassert.equal(stringify123(null),\
    \ '123');\n\n// @ts-expect-error: Expected 1 arguments, but got 0. (2554)\nassert.throws(()\
    \ => stringify123());\n```\n\n再次，我们在行 B 中进行调用之前，必须处理 `callback` 不是函数的情况。如果我们没有这样做，TypeScript\
    \ 会在行行报告错误。\n\n## 7.12 可选默认值 vs undefined.|T\n\n以下三个参数声明非常相似：\n\n- 是可选的：`x?: number`\n\
    - 有默认值：`x = 256`\n- 有联合类型：`x: undefined | number`\n\n如果参数是可选的，它可以被省略。在这种情况下，它有值：\n\
    \n```typescript\nfunction f1(x?: number) { return x }\n```\n\n```typescript\n\
    assert.equal(f1(123), 123); // OK\nassert.equal(f1(undefined), undefined); //\
    \ OK\nassert.equal(f1(), undefined); // 可以省略\n```\n\n如果参数有默认值，当参数被省略或设置为 `undefined`\
    \ 时：\n\n```typescript\nfunction f2(x = 256) { return x }\n```\n\n```typescript\n\
    assert.equal(f2(123), 123); // OK\nassert.equal(f2(undefined), 256); // OK\n```\n\
    \n如果参数是联合类型，它不能被省略，但我们可以将其设置为 `undefined`：\n\n```typescript\nfunction f3(x: undefined\
    \ | number) { return x }\n```\n\n```typescript\nassert.equal(f3(123), 123); //\
    \ OK\nassert.equal(f3(undefined), undefined); // OK\n\n// @ts-expect-error: Expected\
    \ 1 arguments, but got 0. (2554)\nf3(); // 可以省略\n\n## 7.13 对象类型\n\n与数组类似，对象在 JavaScript\
    \ 中扮演着两种角色（有时会混合）：\n\n- **记录 (Records)**：在开发时已知的固定数量。每个属性可以有不同的类型。\n- **字典 (Dictionaries)**：属性名称在开发时未知。所有属性具有相同的类型。\n\
    \n在本章中我们忽略作为字典的对象——它们在 §16.4.5 “索引签名：作为字典的对象”中介绍。顺便提一下，Maps 通常是字典更好的选择。\n\n###\
    \ 7.13.1 通过接口定义对象记录\n\n接口描述了对象记录。例如：\n\n```typescript\ninterface Point {\n  x:\
    \ number;\n  y: number;\n}\n```\n\n我们也可以通过逗号分隔成员：\n\n```typescript\ninterface\
    \ Point {\n  x: number;\n  y: number;\n}\n```\n\n### 7.13.2 TypeScript 的结构类型 vs\
    \ 命名类型\n\nTypeScript 类型系统的一个优势是它是结构性的，而不是命名的。也就是说，Point 匹配所有具有相应结构的对象。\n\n相反，在\
    \ Java 的命名类型系统中，我们必须显式声明它实现了哪些接口。因此，类只能实现其创建时存在的接口。\n\n### 7.13.3 对象字面量类型\n\n\
    对象字面量类型是匿名接口：\n\n```typescript\ntype Point = {\n  x: number;\n  y: number;\n};\n\
    ```\n\n对象字面量类型的好处是它们可以内联使用：\n\n```typescript\nfunction toString(pt: {x: number,\
    \ y: number}) {\n  return `${pt.x}, ${pt.y}`;\n}\n```\n\n### 7.13.4 可选属性\n\n如果一个属性可以省略，我们在它的名字后面加一个问号：\n\
    \n```typescript\ninterface Person {\n  name: string;\n  company?: string;\n}\n\
    ```\n\n在这个示例中，john 和 jane 都匹配接口：\n\n```typescript\nconst john: Person = {\n  name:\
    \ 'John',\n};\nconst jane: Person = {\n  name: 'Jane',\n  company: 'Massive'\n\
    };\n```\n\n### 7.13.5 方法\n\n接口还可以包含方法：\n\n```typescript\ninterface Point {\n \
    \ x: number;\n  y: number;\n  distance(other: Point): number;\n}\n```\n\n## 7.14\
    \ 类型变量和泛型类型\n\n回顾 TypeScript 的两个语言级别：\n\n- 值存在于动态级别。\n- 类型存在于静态级别。\n\n我的建议是使用任何能表达属性应该如何设置的语法。普通函数存在于动态级别，是值的工厂，其参数代表值。参数在括号\
    \ `()` 之间声明：\n\n```typescript\nconst valueFactory = <T>(x: T): T => x; // 定义\n\
    const value = valueFactory<number>(123); // 使用\n```\n\n- 泛型类型存在于静态级别，是类型的工厂，其参数代表类型。参数在尖括号\
    \ `<>` 之间声明：\n\n```typescript\ntype Box<T> = { content: T };\n```\n\n"
