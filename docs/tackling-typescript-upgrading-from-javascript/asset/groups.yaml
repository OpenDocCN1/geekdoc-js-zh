    \ . . . . . . . . . . . . . 214\n\nData validation ensures that data we have has\
    \ the desired structure and content.\nWith TypeScript, validation becomes relevant\
    \ when we receive external data such as:\n\n- Data parsed from JSON files\n- Data\
    \ received from web services\n\nIn these cases, we expect the data to fit static\
    \ types we have, but we can’t be sure. Contrast that with data we create ourselves,\
    \ where TypeScript continuously checks that everything is correct.\n\nThis chapter\
    \ explains how to validate external data in TypeScript.\n\n## 24.1 JSON schema\n\
    \nBefore we explore approaches for data validation in TypeScript, we need to take\
    \ a look at JSON schema because several of the approaches are based on it.\n\n\
    The idea behind JSON schema is to express the schema(structure and content, think\
    \ static type) of JSON data in JSON. That is, metadata is expressed in the same\
    \ format as data.\n\nThe use cases for JSON schema:\n\n- Validating JSON data:\
    \ If we have a schema definition for data, we can use tools to check that the\
    \ data is correct. One issue with data can also be fixed automatically: We specify\
    \ default values that can be used to add properties that are missing.\n- Documenting\
    \ JSON data formats: On one hand, the core schema definitions can be considered\
    \ documentation. But JSON schema additionally supports descriptions, deprecation\
    \ notes, comments, and more. These mechanisms are called annotations. They are\
    \ not used for validation, but for documentation.\n- IDE support for editing data:\
    \ For example, Visual Studio supports JSON schema. If there is a schema for a\
    \ JSON file, we gain several editing features: auto-completion, highlighting of\
    \ errors, etc. Notably, VS Code's support for package.json files is completely\
    \ based on a JSON schema.\n\n### 24.1.1 An example JSON schema\n\nThis example\
    \ is taken from the json-schema.org website:\n\n```json\n{\n  \"$id\": \"https://example.com/geographical-location.schema.json\"\
    ,\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"title\": \"\
    Longitude and Latitude Values\",\n  \"description\": \"A geographical coordinate.\"\
    ,\n  \"required\": [ \"latitude\", \"longitude\"],\n  \"type\": \"object\",\n\
    \  \"properties\": {\n    \"latitude\": {\n      \"type\": \"number\",\n     \
    \ \"minimum\": -90,\n      \"maximum\": 90\n    },\n    \"longitude\": {\n   \
    \   \"type\": \"number\",\n      \"minimum\": -180,\n      \"maximum\": 180\n\
    \    }\n  }\n}\n```\n\nThe following JSON data is valid w.r.t. this schema:\n\n\
    ```json\n{\n  \"latitude\": 48.858093,\n  \"longitude\": 2.294694\n}\n```\n\n\
    ## 24.2 Approaches for data validation in TypeScript\n\nThis section provides\
    \ a brief overview of various approaches for validating data in TypeScript. For\
    \ each approach, I list one or more libraries that support the approach. W.r.t.\
    \ libraries, I don't intend to be comprehensive because things change quickly\
    \ in this space.\n\n### 24.2.1 Approaches not using JSON schema\n\n- Approach:\
    \ Invoking builder methods and functions to produce both validation (runtime)\
    \ and static types (compile time). Libraries include:\n    - zod (demonstrated\
    \ later)\n    - runtypes\n    - io-ts\n- Approach: Invoking builder methods and\
    \ only producing validation. Libraries taking this approach often focus on making\
    \ validation as versatile as possible:\n    - joi\n    - yup\n- Approach: Compiling\
    \ TypeScript types to validate code at compile time. Libraries:\n    - superstruct-transformer\n\
    \    - type-check-macro\n\n### 24.2.2 Approaches using JSON schema\n\n- Approach:\
    \ Converting TypeScript types to JSON schema. Libraries:\n    - ts-json-schema-generator\n\
    \    - json-schema-typescript\n- Approach: Converting a JSON schema to TypeScript\
    \ types. Libraries:\n    - json-schema-to-typescript\n    - decoder\n- Approach:\
    \ Validating JSON data via JSON schemas. This functionality is also useful for\
    \ the packages:\n    - ajv\n    - validator\n\n### 24.2.3 Picking a library\n\n\
    Which approach and therefore library to use depends on what we need:\n\n- If we\
    \ are starting with TypeScript types, data (coming from configuration files, etc.)\
    \ fits those types, then builder APIs that support static types are a good choice.\n\
    - If our starting point is JSON schema, then we should consider one of the libraries\
    \ that support JSON schemas.\n- If we are handling data that is messy (e.g., forms),\
    \ we may need a more flexible approach where static types play less of a role.\n\
    \n## 24.3 Example: validating data via the library Zod\n\n### 24.3.1 Defining\
    \ “data” via Zod’s builder API\n\nZod has an API that produces both types and\
    \ validation functions. That API is used as follows:\n\n```typescript\nimport\
    \ * as z from 'zod';\nconst FileInputSchema = z.union([\n  z.string(),\n  z.tuple([z.string(),\
    \ z.string(), z.array(z.string())]),\n  z.object({\n    file: z.string(),\n  \
    \  author: z.string().optional(),\n    tags: z.array(z.string()).optional(),\n\
    \  })\n]);\n```\n\nFor larger schemas, it can make sense to break things up into\
    \ multiple declarations. Zod can produce a static type from FileInputSchema, but\
    \ I decided to (redundantly!) manually maintain the static type:\n\n```typescript\n\
    type FileInput =\n  | string\n  | [string, string, string]\n  | {file: string,\
    \ author?: string, tags?: string[]};\n```\n\nWhy the redundancy?\n\n- It’s easier\
    \ to read.\n- It helps with migrating to a different validation library or approach,\
    \ should I ever have to.\n\nZod’s generated type is still helpful because we can\
    \ check if it's assignable to FileInput. That will warn us about most problems\
    \ related to getting out of sync.\n\n### 24.3.2 Validating data\n\nThe following\
    \ function checks if the parameter conforms to FileInput:\n\n```typescript\nfunction\
    \ validateData(data: unknown): FileInput {\n  return FileInputSchema.parse(data);\
    \ // may throw an exception\n}\n```\n\n```typescript\nvalidateData(['file.txt',\
    \ 'me', ['vacation', 'family']]); // OK\n```\n\n```typescript\nassert.throws(\n\
    \  () => validateData(['file.txt', 'me'])\n);\n```\n\nThe static type of result\
    \ of FileInputSchema.parse() is derived from FileInputSchema. By making FileInput\
    \ the return type of validateData(), we ensure that the former type is assignable\
    \ to the latter.\n\n### 24.3.3 Type guards\n\nFileInputSchema.check() is a type\
    \ guard:\n\n```typescript\nfunction func(data: unknown) {\n  if (FileInputSchema.check(data))\
    \ {\n    // | inferred-type: string\n    // | [string, string, string]\n    //\
    \ | {\n      //   author?: string | undefined;\n      //   tags?: string[] | undefined;\n\
    \      //   file: string;\n    // }\n    data;\n  }\n}\n```\n\nIt can make sense\
    \ to define a custom type guard that supports FileInput instead of what Zod infers.\n\
    \n```typescript\nfunction isValidData(data: unknown) : data is FileInput {\n \
    \ return FileInputSchema.check(data);\n}\n```\n\n### 24.3.4 Deriving a static\
    \ type from a Zod schema\n\nThe generic `z.infer<Schema>` can be used to derive\
    \ a type from a schema:\n\n```typescript\n// inferred-type: string\n// | [string,\
    \ string, string]\n// | {\n//   author?: string | undefined;\n//   tags?: string[]\
    \ | undefined;\n//   file: string;\n// }\ntype FileInputDerived = z.infer<typeof\
    \ FileInputSchema>;\n```\n\n### 24.3.5 External vs. internal representation of\
    \ data\n\nWhen working with external data, it's often useful to distinguish between\
    \ two of types. \n\nOn one hand, there is the type that describes the input data.\
    \ Its structure is optimized for being easy to author:\n"
