    \ 227\n\nIn this chapter, we explore how we can compute with types at compile\
    \ time in TypeScript. Note that the focus of this chapter is learning how to compute\
    \ with types. Therefore, we'll use literal types a lot and the examples are less\
    \ practically relevant.\n\n## 25.1 Types as metavalues\n\nConsider the following\
    \ two levels of TypeScript code:\n\n- Program level: At runtime, we can use values\
    \ and functions.\n- Type level: At compile time, we can use specific types and\
    \ generic types.\n\nThe type level is a metavel of the program level.\n\n| Level\
    \ | Available at | Operands | Operations |\n|---|---|---|---|\n| Program level\
    \ | Runtime | Values | Functions |\n| Type level | Compile time | Specific types\
    \ | Generic types |\n\nWhat does it mean that we can compute with types? The following\
    \ code is an example:\n\n```typescript\ntype ObjectLiterType = {\nfirst: 1,\n\
    second: 2,\n}\n// inferred-type: \"first\" | \"second\"\ntype Result = keyof ObjectLiterType;\
    \ // (A)\n```\n\nIn line A, we are taking the following steps:\n\n- The input\
    \ of our computation is the type ObjectLiterType.\n- We apply the operation keyof\
    \ of the input. It lists the property keys of an object type.\n- We give the output\
    \ of keyof the name Result.\n\nAt the type level we can compute with the following\
    \ “values\":\n\n```typescript\ntype ObjectLiterType = {\nprop1: string,\nprop2:\
    \ number,\n}\n\ninterface InterfaceType {\nprop1: string;\nprop2: number;\n}\n\
    \ntype TupleType = [boolean, bigint];\n// Nullish types and literal types :::\n\
    // Same syntax as values, but they are all types\n\ntype Undefined = undefined;\n\
    type NullType = null;\n\ntype BooleanLiterType = true;\ntype NumberLiteralType\
    \ = 12.34;\ntype BigIntLiteralType = 1234n;\ntype StringLiterType = 'abc';\n```\n\
    \n## 25.2 Generic types: factories for types\n\nGeneric types are functions at\
    \ the metalevel - for example:\n\n## 25.3 Union types and intersection types\n\
    \n```typescript\ntype Wrap<T> = [T];\n```\n\nThe generic type Wrap<> has the parameter\
    \ T. Its result is T, wrapped in a tuple type. This is how we use this metafunction:\n\
    \n```typescript\n// inferred-type: [string]\ntype Wrapped = Wrap<string>;\n```\n\
    \nWe pass the parameter string to Wrap<> and give the result alias Wrapped. The\
    \ result is a tuple type with a single component - the type string.\n\n## 25.3\
    \ Union types and intersection types\n\n### 25.3.1 Union types ()\n\nThe operator\
    \ | is used to create union types:\n\n```typescript\ntype A = 'a' | 'b' | 'c'\n\
    type B = 'b' | 'c' | 'd';\n```\n\n```typescript\n// inferred-type: \"a\" | \"\
    b\" | \"c\" | \"d\"\ntype Union = A | B;\n```\n\nIf we view type A and type B\
    \ as sets, then A | B is the set-theoretic union of these sets. Put differently:\
    \ the members of the result are members at least one of the operands.\n\nSyntactically,\
    \ we can put a | in front of the first component of a union type. That is convenient\
    \ when a type definition spans multiple lines:\n\n```typescript\ntype A =\n| 'a'\n\
    | 'b'\n| 'c'\n;\n```\n\n### 25.3.1.1 Unions as collections of metavalues\n\nTypeScript\
    \ represents collections of metavalues as unions of literal types. We have already\
    \ seen an example of that:\n\n```typescript\ntype Obj = {\nfirst: 1,\nsecond:\
    \ 2,\n};\n```\n\n```typescript\n// inferred-type: \"first\" | \"second\"\ntype\
    \ Result = keyof Obj;\n```\n\nWe will soon see type-level operations for looping\
    \ over such collections.\n\n### 25.3.1.2 Unions of object types\n\nDue to each\
    \ member of a union type being a member of at least one of the component types,\
    \ we can only safely access properties that are shared by all component types\
    \ (line A). To access any other property, we need a type guard (line B):\n\n```typescript\n\
    type ObjectTypeA = {\npropA: bigint,\nsharedProp: string,\n}\ntype ObjectTypeB\
    \ = {\npropB: boolean,\nsharedProp: string,\n}\n```\n\n```typescript\ntype Union\
    \ = ObjectTypeA | ObjectTypeB;\nfunction func(arg: Union) {\n// string\narg.sharedProp;\
    \ // (A) OK\n// @ts-expect-error: Property 'propB' does not exist on type 'Union'\n\
    arg.propB; // error\n}\n```\n\n```typescript\nif ('propB' in arg) { // (B) type\
    \ guard\n// ObjectTypeB\narg;\n\n// boolean\narg.propB;\n}\n```\n\n### 25.3.2\
    \ Intersection types (&)\n\nThe type operator & is used to create intersection\
    \ types:\n\n```typescript\ntype A = 'a' | 'b' | 'c';\ntype B = 'b' | 'c' | 'd';\n\
    ```\n\n```typescript\n// inferred-type: \"b\" | \"c\"\ntype Intersection = A &\
    \ B;\n```\n\nIf we view type A and B as sets, then A & B is the set-theoretic\
    \ intersection of these sets. Put differently: The members of the result are members\
    \ of both operands.\n\n### 25.3.2.1 Intersections of object types\n\nThe intersection\
