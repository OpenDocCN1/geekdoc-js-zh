    \ (color) {\n        case Color.red:\n            return 'rot';\n        case\
    \ Color.green:\n            return 'grün';\n        case Color.blue:\n       \
    \     return 'blau';\n    }\n}\n```\n\n```typescript\nassert.equal(toGerman(Color.blue),\
    \ 'blau');\n```\n\nAlas, TypeScript doesn't perform exhaustiveness checks, which\
    \ is why we get an error in line A.\n\n## 14.5 Summary of enums and enum alternatives\n\
    \nThe following table summarizes the characteristics of enums and their alternatives\
    \ in TypeScript:\n\n| Unique | Namespace. | Iter. | Mem. CT | Mem. RT | Exhaust.\
    \ |\n| --- | :---: | :---: | :---: | :---: | :---: |\n| Number enums | ✓ | ✓ |\
    \ ✓ | | ✓ |\n| String enums | ✓ | ✓ | ✓ | | ✓ |\n| String unions | ✓ | ✓ | ✓ |\
    \ | ✓ |\n| Symbol unions | ✓ | | ✓ | | ✓ |\n| Discrim. unions | | (1) | | | (2)\
    \ | ✓ |\n| Symbol properties | ✓ | | ✓ | | ✓ |\n| String properties | ✓ | | ✓\
    \ | | ✓ |\n| Enum pattern | ✓ | | ✓ | ✓ | ✓ |\n\nTitles of table columns:\n\n\
    - Unique values: No non-enum value can be mistaken for an enum value.\n- Namespace\
    \ for enum keys\n\n14 Alternatives to enums in TypeScript\n\n- * Is it possible\
    \ to iterate over enum values?\n- Membership check for values at compile time:\
    \ Is there a narrow type for the enum values?\n- Membership check for values at\
    \ runtime:\n  - For the enum pattern, the runtime membership test is `instanceof`.\n\
    \  - Note that a membership test can be implemented relatively easily if it is\
    \ possible to iterate over enum values.\n- Exhaustiveness check (statically by\
    \ TypeScript)\n\nFootnotes in table cells:\n\n- 1. Discriminated unions are not\
    \ really unique, but mistaking values for union members is relatively unlikely\
    \ (especially if we use a unique name for discriminant property).\n- 2. If the\
    \ discriminant property has a unique enough name, it can be used to check membership.\n\
    \n## 14.6 Acknowledgement\n\n- * Thanks to Kirill Sukhomlin for his suggestion\
    \ on how to define TColor for an object literal.\n\n# Chapter 15\n\n# Adding special\
    \ values to types\n\n- Contents\n15.1 Adding special values in band . . . . .\
    \ . . . . . . . . . . . . . . . . . . . 111\n15.1.1 Adding null or undefined to\
    \ a type . . . . . . . . . . . . . . . . 112\n15.1.2 Adding a symbol to a type\
    \ . . . . . . . . . . . . . . . . 113\n15.2 Adding special values out of band\
    \ . . . . . . . . . . . . . . . . 113\n15.2.1 Discriminated unions . . . . . .\
    \ . . . . . . . . . . . . . . . . . . 113\n15.2.2 Other kinds of union types .\
    \ . . . . . . . . . . . . . 115\n\nOne way of understanding types is as sets of\
    \ values. Sometimes there are two levels of values:\n\n- Base level: normal values\n\
    - Meta level: special values\n\nIn this chapter, we examine how we can add special\
    \ values to base-level types.\n\n## 15.1 Adding special values in band\n\nOne\
    \ way of adding special values is to create a new type which is a superset of\
    \ the base type where some special values are called sentinels. They exist in\
    \ band (think inside the same channel), as siblings of normal values.\n\nAs an\
    \ example, consider the following interface for readable streams:\n\n```typescript\n\
    interface InputStream {\n    getNextLine(): string;\n}\n```\n\nAt the moment,\
    \ .nextLine() only handles text lines, but not ends of files (EOFs).\nHow could\
    \ we add support for EOF?\n\nPossibilities include:\n\n## 15 Adding special values\
    \ to types\n\n- An additional method .isEof() needs to be called before calling\
    \ .getNextLine().\n- .getNextLine() throws an exception when it reaches an EOF.\n\
    - A sentinel value for EOF.\n\nThe next two subsections describe two ways in which\
    \ we can introduce sentinel values.\n\n## 15.1.1 Adding null or undefined to a\
    \ type\n\nWhen strict TypeScript, no simple object type (defined via interfaces,\
    \ object patterns, classes) includes null. That makes it a good sentinel value\
    \ that we can add to the base type string via a union type:\n\n```typescript\n\
    type StreamValue = null | string;\n\ninterface InputStream {\n  getNextLine():\
    \ StreamValue;\n}\n```\n\nNow, when we are using the value returned by .getNextLine(),\
    \ TypeScript forces us to consider these possible strategies: strings and null\
    \ - for example:\n\n```typescript\nfunction countComments(is: InputStream) {\n\
    \  let commentCount = 0;\n  while (true) {\n    const line = is.getNextLine();\n\
    \    // @ts-expect-error: Object is possibly 'null'.(2531)\n    if (line.startsWith('#'))\
    \ { // (A)\n      commentCount++;\n    }\n    if (line === null) break;\n  }\n\
    \  return commentCount;\n}\n```\n\nIn line A, we can't use the string method .startsWith()\
    \ because line might be null. We can fix this as follows:\n\n```typescript\nfunction\
    \ countComments(is: InputStream) {\n  let commentCount = 0;\n  while (true) {\n\
    \    const line = is.getNextLine();\n    if (line === null) break;\n    if (line.startsWith('#'))\
    \ { // (A)\n      commentCount++;\n    }\n  }\n  return commentCount;\n}\n```\n\
    \nNow, when execution reaches line A, we can be sure that line is not null.\n\n\
    ## 15.1.2 Adding a symbol to a type\n\nWe can also use values other than null\
    \ sentinels. Symbols and objects are best suited for this task because each of\
    \ them has a unique identity and no other value can be mistaken for it.\n\nThis\
    \ is how to use a symbol to represent EOF:\n\n```typescript\nconst EOF = Symbol('EOF');\n\
    type StreamValue = typeof EOF | string;\n```\n\nWhy do we need type and can't\
    \ use EOF directly? That's because EOF is a value, not a type. The type operator\
    \ converts EOF to a type. For more information on the different language levels\
    \ of values and types, see §7.7 \"The language levels: dynamic vs. static\".\n\
    \n## 15.2 Adding special values out of band\n\nWhat do we do if potentially any\
    \ value can be returned by a method? How do we ensure that base values and meta\
    \ values don't get mixed up? This is an example where that might happen:\n\n```typescript\n\
    interface InputStream<T> {\n  getNextValue(): T;\n}\n```\n\nWhatever we pick for\
    \ EOF, there is a risk of someone creating an Input-typeof EOF and adding that\
    \ value to the stream.\n\nThe solution is to keep normal values and special values\
    \ separate, so that they can't be mixed up. Special values existing separately\
    \ is called out of band (think different).\n\n## 15.2.1 Discriminated unions\n\
    \nA discriminated union is a union over several object types that have at least\
    \ one property in common, the so-called discriminant. The discriminant must have\
    \ a different value for each object type – we can think of it as the ID of the\
    \ object type.\n\n### 15.2.1.1 Example: InputStreamValue\n\nIn the following example,\
    \ InputStreamValue<T> is a discriminated union and its discriminant is type.\n\
    \n```typescript\ninterface NormalValue<T> {\n  type: 'normal'; // string literal\
    \ type\n  data: T;\n}\ninterface Eof {\n  type: 'eof'; // string literal type\n\
    }\n```\n\ntype InputStreamValue<T> = Eof | NormalValue<T>;\n\n### 15.2.1.2 Example:\
    \ IteratorResult\n\nWhen deciding how to implement iterators, TC39 did not want\
    \ to use a fixed sentinel value. Otherwise, that value could appear in iterations\
    \ and break code. One solution would have been to pick a sentinel value when starting\
    \ an iteration. TC39 instead opted for a discriminated union with the common property\
    \ .done:\n\n```typescript\ninterface IteratorResult<TYield> {\n  done?: false;\
    \ // boolean literal type\n  value: TYield;\n}\n```\n\n```typescript\ninterface\
    \ IteratorReturn<TReturn> {\n  done: true; // boolean literal type\n  value: TReturn;\n\
    }\n```\n\n```typescript\ntype IteratorResult<TYield, TReturn = any> = IteratorYield<TYield>\
    \ | IteratorReturn<TReturn>;\n```\n"
