    \ 1, y: 2, z: 3 }); // OK\n```\n\n132\n\n16 Typing objects\n\nWe’ll continue with\
    \ two examples where TypeScript not allowing excess properties, is an issue.\n\
    \n### 16.4.7.5.1 Allowing excess properties: example Incrementor\n\nIn this example,\
