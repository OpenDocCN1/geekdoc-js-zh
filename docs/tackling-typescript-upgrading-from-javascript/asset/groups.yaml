    \ 46\n\nThis chapter explains the essentials of TypeScript.\n\n# 7.1 What you’ll\
    \ learn\n\nAfter reading this chapter, you should be able to understand the following\
    \ TypeScript code:\n\n```\ninterface Array<T> {\n  concat(items: Array<T> | T>):\
    \ T[];\n  reduce<(\n    callback: (state: U, element: T, index: number, array:\
    \ T[]) => U,\n    firstState?: U\n  ): U;\n  //...\n}\n```\n\nYou may think this\
    \ is cryptic. And I agree with you! But (as I hope to prove) this syntax is relatively\
    \ easy to learn. And once you understand it, it gives you immediate, precise and\
    \ comprehensive summaries of how code behaves — without having to read long descriptions\
    \ in English.\n\n# 7.2 Specifying the comprehensiveness of type checking\n\nThere\
    \ are many ways in which the TypeScript compiler can be configured. One group\
    \ of options controls how the compiler checks TypeScript code. The maximum setting\
    \ is activated via --strict and I recommend to always use it. It makes programs\
    \ slightly harder to write, but we also gain the full benefits of static type\
    \ checking-\n\n> That's everything about --strict you need to know for now\n\n\
    Read on if you want to know more details.\n\nSetting --strict to true, sets all\
    \ of the following options to true:\n\n+   --noImplicitAny: If TypeScript can't\
    \ infer a type, we must specify it. This mainly applies to parameters of functions\
    \ and methods: With these settings, we must annotate them.\n\n+   --noImplicitThis:\
    \ Complain if the type of this isn't clear.\n\n+   --alwaysStrict: Use JavaScript's\
    \ strict mode whenever possible."
- md: "\n## 7.3 Types in TypeScript\n\n- strictNullChecks: null is not part of any\
    \ type (other than its own type, null) and must be explicitly mentioned if it\
    \ is a acceptable value.\n- strictFunctionTypes: enables stricter checks for function\
    \ types.\n- strictPropertyInitialization: Properties in class definitions must\
    \ be initialized, unless they have the value undefined.\n\nWe will see more compiler\
    \ options later in this book, when we get to creating npm packages and web apps\
    \ with TypeScript. The TypeScript handbook has comprehensive documentation on\
    \ them.\n\n## 7.3 Types in TypeScript\n\nIn this chapter a type is simply a set\
    \ of values. The JavaScript language (not TypeScript!) has only eight types:\n\
    \n1. Undefined: the set with the only element undefined\n2. Null: the set with\
    \ the only element null\n3. Boolean: the set with the two elements false and true\n\
    4. Number: the set of all numbers\n5. Bigint: the set of all arbitrary-precision\
    \ integers\n6. String: the set of all strings\n7. Symbol: the set of all symbols\n\
    8. Object: the set of all objects (which includes functions and arrays)\n\nAll\
    \ of these are dynamic: we can use them at runtime.\n\nTypeScript brings an additional\
    \ layer to JavaScript: static types. These only exist when compiling or type-checking\
    \ source code. Each storage location (variable, property, etc.) has a static type\
    \ that predicts its dynamic value. Type checking ensures that these predictions\
    \ come true.\n\nAnd there is a lot that can be checked statically (without running\
    \ the code). If, example the parameter num of a function to toString(num) has\
    \ the static type number, then the function call to toString('abc') is illegal,\
    \ because the argument 'abc' has the wrong static type.\n\n## 7.4 Type annotations\n\
    \n```\nfunction toString(num: number): string {\n  return String(num);\n}\n```\n\
    \nThere are two type annotations in the previous function declaration:\n\n- Parameter\
    \ num: colon followed by number\n- Result of toString(): colon followed by string\n\
    \nBoth number and string are type expressions that specify the types of storage\
    \ locations.\n\n## 7.5 Type inference\n\nOften, TypeScript can infer a static\
    \ type if there is no type annotation. For example, if we omit the return type\
    \ of f(), TypeScript infers that it is a string:\n\n```typescript\n// inferred-type:\
    \ (num: number) => string\nfunction toString(num: number) {\n  return String(num);\n\
    }\n```\n\nType inference is not guesswork: It follows clear rules (similar to\
    \ arithmetic) for deriving types where they haven't been specified explicitly.\
    \ In this case, the return statement applies a function String() that maps arbitrary\
    \ values to strings, to a value of type number and returns the result. That's\
    \ why the inferred return type is string.\n\nIf the type of a location is neither\
    \ specified nor inferable, TypeScript uses the any type for it. This is the type\
    \ of all values and a wildcard, in that we can do everything if it has a value\
    \ type.\n\nWith --strict, any is only allowed if we use it explicitly. In other\
    \ words: Every location must have an explicit or inferred static type. In the\
    \ following example, parameter num has neither and we get a compile-error:\n\n\
    ```typescript\n// @ts-expect-error: Parameter 'num' implicitly has an 'any' type.\
    \ (7006)\nfunction toString(num) {\n  return String(num);\n}\n```\n\n## 7.6 Specifying\
    \ types via type expressions\n\nThe type expressions after the colons of type\
    \ annotations range from simple to complex and are created as follows.\n\nBasic\
    \ types are valid type expressions:\n\n- Static types for JavaScript's dynamic\
    \ types:\n  - undefined, null\n  - boolean, number, bigint, string\n  - symbol\n\
    \  - object.\n- TypeScript-specific types:\n  - Array (not technically a type\
    \ in JavaScript)\n  - any (the type of all values)\n  - Etc.\n\nThere are many\
    \ ways of combining basic types to produce new, compound types. For example, via\
    \ type operators that combine types similarly to how the set operators union (u)\
    \ and intersection (n) combine sets. We'll see how to do that soon.\n\n## 7.7\
    \ The two language levels: dynamic vs. static\n\nTypeScript has two language levels:\n\
    \n- The dynamic level is managed by JavaScript and consists of code and values,\
    \ at runtime.\n- The static level is managed by TypeScript (excluding JavaScript)\
    \ and consists of static types, at compile time.\n\nWe can see these two levels\
    \ in the syntax:\n\n```javascript\nconst undef = undefined;\n```\n\n- At the dynamic\
    \ level, we use JavaScript to declare a variable undef and initialize it with\
    \ the value undefined.\n- At the static level, we use TypeScript to specify variable\
    \ undef has the static type undefined.\n\nNote that the same syntax, undefined,\
    \ means different things depending on whether it is used at the dynamic level\
    \ or at the static level.\n\n> Try to develop an awareness of the two language\
    \ levels\n> That helps considerably with making sense of TypeScript.\n\n## 7.8\
    \ Type aliases\n\nWith type we can create a new name (alias) for an existing type:\n\
    \n```typescript\ntype Age = number;\nconst age: Age = 82;\n```\n\n## 7.9 Typing\
    \ Arrays\n\nArrays play two roles in JavaScript (either one or both):\n\n- List:\
    \ All elements have the same type.\n- Tuple: The length of the Array is fixed.\
    \ The elements generally don't have the same type.\n\n## 7.9.1 Arrays as lists\n\
    \nThere are two ways to express that the Array is used as a list whose elements\
    \ are all numbers:\n\n```typescript\nlet arr1: number[] = [];\nlet arr2: Array<number>\
    \ = [];\n```\n\nNormally, TypeScript can infer the type of a variable if there\
    \ is an assignment. In this case, we actually have to help it, because with an\
    \ empty Array, it can't determine the type of the elements.\n\nWe'll get back\
    \ to the angle brackets notation (Array<number>) later.\n\n## 7.9.2 Arrays as\
    \ tuples\n\nIf we store a two-dimensional point in an Array, then we are using\
    \ Array as a tuple. That looks as follows:\n\n```typescript\nlet point: [number,\
    \ number] = [7, 5];\n```\n\nThe type annotation is needed for Arrays-as-tuples;\
    \ for Array literals, TypeScript infers list types, not tuple types:\n\n```typescript\n\
    // inferred-type: number[]\nlet point = [7, 5];\n```\n\nAnother example for tuples\
    \ is the Object.entries(obj): an Array with one [key, value] pair for each property\
    \ of obj.\n\n```typescript\n// inferred-type: [string, number[]]\nconst entries\
    \ = Object.entries({ a: 1, b: 2 });\n```\n\n```javascript\nassert.deepEqual(\n\
    \  entries,\n  [['a', 1], ['b', 2]]\n);\n```\n\nThe inferred type is an Array\
    \ of tuples.\n\n## 7.10 Function types\n\nThis is an example of a function type:\n\
    \n```typescript\n(num: number) => string\n```\n\nThis type comprises every function\
    \ that accepts a single parameter of type number and returns a string. Let's use\
    \ this type in an annotation:\n\n```typescript\nconst toString: (num: number)\
    \ => string = // (A)\n(num: number) => String(num); // (B)\n```\n\nNormally, we\
    \ specify parameter types for functions. But in this case, the type of number\
    \ in line B is inferred from the function in line A and we can omit it:\n\n```typescript\n\
    const toString: (num: number) => string =\n(num) => String(num);\n```\n\nIf we\
    \ omit the type annotation for toString, TypeScript infers a type from the arrow\
    \ function:\n\n```typescript\n// inferred-type: (num: number) => string\nconst\
    \ toString = (num: number) => String(num);\n```\n\n## 7.10 Function types\n\n\
    This time, num must have a type annotation.\n\n## 7.10.1 A more complicated example\n\
    \nThe following example is more complicated:\n\n```typescript\nfunction stringify123(callback:\
    \ (num: number) => string) {\n  return callback(123);\n}\n```\n\nWe are using\
    \ a function to describe the parameter callback of stringify123. Due to this annotation,\
    \ TypeScript rejects the function call.\n\n```typescript\n// @ts-expect-error:\
    \ Argument of type 'NumberConstructor' is not\n// assignable to parameter of type\
    \ '(num: number) => string'\n// Type 'number' is not assignable to type 'string'.\
    \ (2345)\nstringify123(Number);\n```\n\nBut it accepts this function call:\n\n\
    ```javascript\nassert.equal(\nstringify123(String), '123');\n```\n\n## 7.10.2\
    \ Return types of function declarations\n\nTypeScript can usually infer the return\
    \ types of functions, but by specifying them explicitly is allowed and occasionally\
    \ useful (at the very least, it doesn't harm any).\n\nFor stringify123(), specifying\
    \ a return type is optional and looks like this:\n\n```typescript\nfunction stringify123(callback:\
    \ (num: number) => string): string {\n  return callback(123);\n}\n```\n\n## 7.10.2.1\
    \ The special return type void\n\nvoid is a special return type for a function:\
    \ It tells TypeScript that the function always returns undefined.\n\nIt may do\
    \ so explicitly:\n\n```typescript\nfunction f1(): void {\n  return undefined;\n\
    }\n```\n\nOr it may do so implicitly:\n\n```typescript\nfunction f2(): void {};\n\
    ```\n\nHowever, a function cannot explicitly return values other than undefined:\n\
    \n```typescript\nfunction f3(): void {\n// @ts-expect-error: Type \"abc\" is not\
    \ assignable to type 'void'. (2322)\n  return 'abc';\n}\n```\n"
  mdcn: "\n\n## 7.3 TypeScript 中的类型\n\n- strictNullChecks: null 不属于任何类型（除其自身的类型 null\
    \ 除外），如果它是可接受的值，则必须显式说明。\n- strictFunctionTypes: 对函数类型启用更严格的检查。\n- strictPropertyInitialization:\
    \ 类定义中的属性必须初始化，除非它们的值为 undefined。\n\n我们将在本书的后后部分看到更多编译器选项，那时我们将学习使用 TypeScript\
    \ 创建 npm 软件包和 Web 应用。TypeScript 手册对这些内容有详尽的文档。\n\n## 7.3 TypeScript 中的类型\n\n在本章中，类型简单来说就是值的集合。JavaScript\
    \ 语言（不是 TypeScript！）只有八种类型：\n\n1. Undefined: 仅包含元素 `undefined` 的集合。\n2. Null:\
    \ 仅包含元素 `null` 的集合。\n3. Boolean: 包含 `false` 和 `true` 两个元素的集合。\n4. Number: 所有数字的集合。\n\
    5. Bigint: 所有任意精度整数的集合。\n6. String: 所有字符串的集合。\n7. Symbol: 所有符号的集合。\n8. Object:\
    \ 所有对象的集合（包括函数和数组）。\n\n所有这些都是动态的：我们可以在运行时使用它们。\n\nTypeScript 为 JavaScript 增加了一层：静态类型。这些类型仅在编译或对源码进行类型检查时存在。每个存储位置（变量、属性等）都有一个静态类型，用于预测其动态值。类型检查确保这些预测能够实现。\n\
    \n有很多内容可以进行静态检查（无需运行代码）。例如，如果函数 `toString(num)` 的参数 `num` 静态类型为 `number`，那么函数调用\
    \ `toString('abc')` 就是非法的，因为参数 'abc' 的静态类型错误。\n\n## 7.4 类型注解\n\n```\nfunction\
    \ toString(num: number): string {\n  return String(num);\n}\n```\n\n在上面的函数声明中，有两个类型注解：\n\
    \n- 参数 num: 冒号后跟 `number`\n- toString() 的结果: 冒号后跟 `string`\n\n`number` 和 `string`\
    \ 都是指定存储位置类型的类型表达式。\n\n## 7.5 类型推断\n\n通常情况下，如果没有类型注解，TypeScript 可以推断出静态类型。例如，如果我们省略函数\
    \ `f()` 的返回类型，TypeScript 会推断它是一个字符串：\n\n```typescript\n// inferred-type: (num:\
    \ number) => string\nfunction toString(num: number) {\n  return String(num);\n\
    }\n```\n\n类型推断不是猜测：它遵循清晰的规则（类似于算术），在未显式指定类型的地方推导出类型。在这种情况下，返回语句应用了一个函数 `String()`，该函数将任意值映射到字符串，并将类型为\
    \ `number` 的值返回。这就是为什么推断出的返回类型是 `string` 的原因。\n\n如果一个位置的类型既未指定也无法推断，TypeScript\
    \ 将对其使用 `any` 类型。它是所有值的类型，也是通配符，因为如果它有值类型，我们可以做任何事情。\n\n使用 `--strict` 时，只有显式使用时才允许\
    \ `any`。换句话说：每个位置都必须有一个显式或推断的静态类型。在下面的示例中，参数 `num` 两者没有，我们得到了一个编译错误：\n\n```typescript\n\
    // @ts-expect-error: Parameter 'num' implicitly has an 'any' type. (7006)\nfunction\
    \ toString(num) {\n  return String(num);\n}\n```\n\n## 7.6 通过类型表达式指定类型\n\n类型注解中冒号后面的类型表达式从简单到复杂，并如下所示创建。\n\
    \n基本类型是有效的类型表达式：\n\n- JavaScript 动态类型的静态类型：\n  - undefined, null\n  - boolean,\
    \ number, bigint, string\n  - symbol\n  - object.\n- TypeScript 特有的类型：\n  - Array（在\
    \ JavaScript 中技术上不属于一种类型）\n  - any（所有值的类型）\n  - 等。\n\n有许多方法组合基本类型以产生新的复合类型。例如，通过类型运算符以类似的方式组合类型，如联合\
    \ (union) 和交集 (intersection) 运算符组合集合。我们将很快看到如何这样做。\n\n## 7.7 两个语言级别：动态 vs 静态\n\
    \nTypeScript 有两个语言级别：\n\n- 动态级别由 JavaScript 管理，在运行时由代码和值组成。\n- 静态级别由 TypeScript\
    \ 管理，在编译时由类型组成。\n\n我们可以在语法中看到这两个级别：\n\n```javascript\nconst undef = undefined;\n\
    ```\n\n- 在动态级别，我们使用 JavaScript 声明变量 `undef` 并用值进行它。\n- 在静态级别，我们使用 TypeScript 指定变量\
    \ `undef` 的静态类型。\n\n注意，相同的语法 `undefined` 不同的含义取决于它是在动态级别还是静态级别使用的。\n\n> 尝试培养对两个级别的意识\n\
    > 这有助于理解 TypeScript。\n\n## 7.8 类型别名\n\n使用 `type` 我们可以为现有类型创建一个新名称（别名）：\n\n```typescript\n\
    type Age = number;\nconst age: Age = 8;\n```\n\n## 7.9 数组\n\n数组在 JavaScript 中扮演着两种角色：\n\
    \n- 列表：所有元素具有相同的类型。\n- 元组：数组长度是固定的。元素没有相同的类型。\n\n## 7.9.1 数组作为列表\n\n有两种方式表示数组被用作元素全是数字的列表：\n\
    \n```typescript\nlet arr1: number[] = [];\nlet arr2: Array<number> = [];\n```\n\
    \n如果有赋值，TypeScript 可以推断变量的类型。在这种情况下，对于空数组，它无法确定元素的类型。\n\n我们将回到角括号符号 (`<number>`)。\n\
    \n## 7.9.2 数组作为元组\n\n如果在数组中存储一个二维 `point`，那么我们正在使用数组作为元组。如下所示：\n\n```typescript\n\
    let point: [number, number] = [7, 5];\n```\n\n对于元组需要类型注解；对于数组字面量，TypeScript 推断出列表类型而不是元组类型：\n\
    \n```typescript\n// inferred-type: number[]\nlet point = [7, 5];\n```\n\n另一个元组示例是\
    \ `Object.entries(obj)`：对于 `obj` 的每个属性都有一个 `[key, value]` 对。\n\n```typescript\n\
    // inferred-type: [string, number][]\nconst entries = Object.entries({ a: 1, b:\
    \ 2 });\n```\n\n```javascript\nassert.deepEqual(\n  entries,\n  [['a', 1], ['b',\
    \ 2]]\n);\n```\n\n推断类型是元组数组。\n\n## 7.10 函数类型\n\n这是一个函数类型的示例：\n\n```typescript\n\
    (num: number) => string\n```\n\n该类型包含每个接受单个 `number` 类型参数并返回 `string` 的函数。让我们在注解中使用这种类型：\n\
    \n```typescript\nconst toString: (num: number) => string = // (A)\n(num: number)\
    \ => String(num); // (B)\n```\n\n通常我们会指定函数的参数类型。在这种情况下，B 行的 `number` 类型是从 A 行的函数推断出来的，我们可以省略它：\n\
    \n```typescript\nconst toString: (num: number) => string =\n(num) => String(num);\n\
    ```\n\n如果我们省略了 `toString` 的类型注解，TypeScript 从箭头函数推断出类型：\n\n```typescript\n// inferred-type:\
    \ (num: number) => string\nconst toString = (num: number) => String(num);\n```\n\
    \n## 7.10 函数类型\n\n这次，`num` 必须有一个类型注解。\n\n## 7.10.1 一个更复杂的示例\n\n下面的示例更复杂：\n\n```typescript\n\
    function stringify123(callback: (num: number) => string) {\n  return callback(123);\n\
    }\n```\n\n我们使用一个函数来描述 `stringify123` 的参数 `callback`。由于这个注解，TypeScript 拒绝了该函数调用。\n\
    \n```typescript\n// @ts-expect-error: Argument of type 'NumberConstructor' is\
    \ not\n// assignable to parameter of type '(num: number) => string'\n// Type 'number'\
    \ is not assignable to type 'string'. (2345)\nstringify123(Number);\n```\n\n但它接受这个函数调用：\n\
    \n```javascript\nassert.equal(\nstringify123(String), '123');\n```\n\n## 7.10.2\
    \ 函数声明的返回类型\n\nTypeScript 通常可以推断函数的返回类型，但显式指定它们是被允许的且有时有用（至少没有害）。\n\n对于 `stringify123()`，指定返回类型是可选的，如下所示：\n\
    \n```typescript\nfunction stringify123(callback: (num: number) => string): string\
    \ {\n  return callback(123);\n}\n```\n\n## 7.10.2.1 特殊返回类型 void\n\n`void` 是函数的特殊返回类型：它告诉\
    \ TypeScript 函数总是返回 `undefined`。\n\n它可以显式地这样做：\n\n```typescript\nfunction f1():\
    \ void {\n  return undefined;\n}\n```\n\n或者它可以隐式地这样做：\n\n```typescript\nfunction\
    \ f2(): void {};\n```\n\n[/content]\n\n然而，函数不能显式返回 `undefined` 之外的值：\n\n```typescript\n\
    function f3(): void {\n// @ts-expect-error: Type \"abc\" is not assignable to\
    \ type 'void'. (2322)\n  return 'abc';\n}\n```\n\n"
