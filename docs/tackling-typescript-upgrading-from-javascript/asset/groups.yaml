    \ subsets of the original type number|string. This way of reducing the size of\
    \ a type is called narrowing. Checking the result of typeof and similar runtime\
    \ operations are called type guards.\n\n### 23.1.2 Narrowing via switch and a\
    \ type guard\n\nNarrowing also works if we use switch instead of:\n\n```typescript\n\
