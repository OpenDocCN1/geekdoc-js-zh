  - "[PAGE 62]\n\n9.10 Using webpack without a loader: webpack-no-loader.config.js\
    \ 61\n\n# 9.9.1 Building in Visual Studio Code\n\nInstead of building from a command\
    \ line, we can also do that from within Visual Studio Code, via a so-called build\
    \ task:\n\n+   * Execute \"Configure Default Build Task...\" from the \"Terminal\"\
    \ menu.\n* Choose \"npm: pwp\".\n* A problem matcher handles the conversion of\
    \ tool output into lists of problems (infos, warning, and errors). The default\
    \ handler works well in this case. If you want to be explicit, you can specify\
    \ a value in .vscode/tasks.json:\n\n```\n\"problemMatcher\": [\"$tsc-watch\"],\n\
    ```\n\nWe can now start webpack via \"Run Build Task...\" from the \"Terminal\"\
    \ menu.\n\n# 9.10 Using webpack without a loader: webpack-no-loader.config.js\n\
    \nInstead of using ts-loader, we can first compile our TypeScript files to JavaScript\
    \ files and bundle them via webpack. How the first of these two steps works, is\
    \ described in the previous chapter.\n\nWe now have to configure ts-loader and\
    \ our webpack configuration file is simpler:\n\n```\nconst path = require('path');\n\
    \nmodule.exports = {\n  entry: \"./dist/src/main.js\",\n  output: {\n    path:\
    \ path.join(__dirname, 'build'),\n    filename: '[name]-bundle.js',\n  },\n  plugins:\
    \ [\n    new CopyWebpackPlugin(\n      {\n        from: './html',\n      }\n \
    \   )\n  ]\n}\n```\n\nNote that entry.main is different. In the other config file,\
    \ it is:\n\n```\n\"./ts/src/main.ts\"\n```\n\nWhy would we want to produce intermediate\
    \ files before bundling them? One benefit is that we can use Node.js to run unit\
    \ tests for some of the TypeScript code."
- md: "\n# Chapter 10\n\n## Strategies for migrating to TypeScript\n\n+ Contents\n\
    - 10.1 Three strategies ................................................................................\
    \ 63\n- 10.2 Strategy: mixed JavaScript/TypeScript code bases ............................................\
    \ 64\n- 10.3 Strategy: adding type information to plain JavaScript files ............................\
    \ 64\n- 10.4 Strategy: migrating large projects by snapshot testing the TypeScript\
    \ errors ................................................................................................................................................\
    \ 65\n- 10.5 Conclusion .......................................................................................................\
    \ 65\n\nThis chapter gives an overview of strategies for migrating code bases\
    \ from JavaScript to TypeScript. It also mentions material for further reading.\n\
    \n## 10.1 Three strategies\n\nThese are three strategies for migrating to TypeScript:\n\
    \n- We can support a mix of JavaScript and TypeScript files for our code base.\
    \ We start with only JavaScript files and then switch more and more to TypeScript.\n\
    - We can keep our current (non-TypeScript) build process and our JavaScript-only\
    \ code base. We add static type information via JSDoc comments and use TypeScript\
    \ as a type checker (not a compiler). Everything is correctly typed, we switch\
    \ to TypeScript for building.\n- For large projects, there may be too many TypeScript\
    \ errors during migration. Snapshot tests can help us find fixed errors and new\
    \ errors.\n\nMore information:\n\n- “Migrating from JavaScript” in the TypeScript\
    \ Handbook\n\n## 10.2 Strategy: mixed JavaScript/TypeScript code bases\n\nThe\
    \ TypeScript compiler supports a mix of JavaScript and TypeScript files if we\
    \ use the compiler option --allowJS:\n\n- TypeScript files are compiled.\n- JavaScript\
    \ files are simply copied over to the output directory (after a few simple type\
    \ checks).\n\nAt first, there are only JavaScript files. Then, one by one, we\
    \ switch files to TypeScript. While we do so, our code base keeps being compiled.\n\
    \nThis is what tsconfig.json looks like:\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    ...\n    \"allowJS\": true\n  }\n}\n```\n\nMore information:\n\n- “Incrementally\
    \ Migrating JavaScript to TypeScript” by Clay Allsopp.\n\n## 10.3 Strategy: adding\
    \ type information to plain JavaScript files\n\nThis approach works as follows:\n\
    \n- We continue using our current build infrastructure.\n- We run the TypeScript\
    \ compiler, but only as a type checker (compiler option --noEmit). In addition\
    \ to the compiler option --allowJS (for allowing and copying JavaScript files),\
    \ we also have to use the compiler option --checkJS (for checking JavaScript files).\n\
    - We add type information via JSDoc comments (see example below) and declaration\
    \ files.\n- Once TypeScript's type checker doesn't complain anymore, we use the\
    \ compiler to build the code base. Switching from .js files to .ts files is not\
    \ urgent now because the whole code base is already statically typed. We can even\
    \ produce type files (file extension .ts) now.\n\nThis is how we specify types\
    \ for plain JavaScript via JSDoc comments:\n\n```javascript\n/**\n * @param {number}\
    \ x - The first operand\n * @param {number} y - The second operand\n * @returns\
    \ {number} The sum of both operands\n */\nfunction add(x, y) {\n  return x + y;\n\
    }\n\n/** @typedef {prop1: string, prop2: string, prop3: number} SpecialType */\n\
    /** @typedef {(data: string, index?: number) => boolean} Predicate */\n```\n\n\
    More information:\n\n- “Using the TypeScript compiler for plain JavaScript files”\n\
    - “How we gradually migrated to TypeScript at Unsplash” by Oliver Joseph Ash\n\
    \n## 10.4 Strategy: migrating large projects by snapshot testing the TypeScript\
    \ errors\n\nIn large JavaScript projects, switching to TypeScript may produce\
    \ too many errors – no matter which approach we choose. Then snapshot-testing\
    \ the TypeScript errors may be an option:\n\n- We run the TypeScript compiler\
    \ on the whole code base for the first time.\n- The errors produced by the compiler\
    \ become our initial snapshot.\n- As we work on the code base, we compare new\
    \ error output with the previous snapshot:\n  - Sometimes existing errors disappear.\
    \ Then we can create a new snapshot.\n  - Sometimes new errors appear. Then we\
    \ either have to fix these errors or create a new snapshot.\n\nMore information:\n\
    \n- “How to Incrementally Migrate 100k Lines of Code to Typescript” by Dylan Vann\n\
    \n## 10.5 Conclusion\n\nWe have taken a quick look at strategies for migrating\
    \ to TypeScript. Two more tips:\n\n- Start your migration with experiments: Play\
    \ with your code base and try out various strategies before committing to one\
    \ of them.\n- Then lay out clear plan for going forward. Talk to your team w.r.t.\
    \ prioritization:\n  - Sometimes finishing the migration fully may take priority.\n\
    \  - Sometimes the code remaining fully functional during the migration may be\
    \ more important.\n  - And so on...\n\n# Part III\n\n# Basic types\n\n# Chapter\
    \ 11\n\n# What is a type in TypeScript?\nTwo perspectives\n\n| Contents | | |\n\
    | :--- | :--- |\n| 11.1 Three questions for each perspective . . . . . . . | 69\
    \ |\n| 11.2 Perspective 1: types are sets of values . . . . . . . . . . | 70 |\n\
    | 11.3 Perspective 2: type compatibility relationships . . . . . . . . | 70 |\n\
    | 11.4 Nominal type systems vs. structural type systems . . . . . . . . | 71 |\n\
    | 11.5 Further reading . . . . . . . . . . . . . . . . . . . | 72 |\n\nWhat are\
    \ types in TypeScript? This chapter describes two perspectives that help with\n\
    understanding them.\n\n## 11.1 Three questions for each perspective\n\nThe following\
    \ three questions are important for understanding how types work and\nto be answered\
    \ from each of the two perspectives.\n\n- 1. What does it mean for myVariable\
    \ to have the type MyType?\n`let myVariable: MyType = /*...*/;`\n- 2. Assignability:\
    \ A SourceType is assignable to a TargetType if each location\nof type SourceType\
    \ can be assigned to any storage location of type TargetType (line A).\n`let source:\
    \ SourceType = /*...*/;`\n`let target: TargetType = source; // (A)`\n- 3. How\
    \ is TypeUnion derived from Type1, Type2, and Type3?\n`type TypeUnion = Type1\
    \ | Type2 | Type3;`\n\n## 11.2 Perspective 1: types are sets of values\n\nFrom\
    \ this perspective, a type is a set of values:\n\n- 1. If myVariable has the type\
    \ MyType, that means all values that can be assigned to myVariable must be elements\
    \ of the set MyType.\n- 2. SourceType is assignable to TargetType if SourceType\
    \ is a subset of TargetType. As a consequence, all values allowed by SourceType\
    \ are also allowed by TargetType.\n- 3. The union of the types Type1, Type2, and\
    \ Type3 is the set-theoretic union of the sets that define them.\n\n## 11.3 Perspective\
    \ 2: type compatibility relationships\n\nFrom this perspective, we are not concerned\
    \ with values and how they flow when code is executed. Instead, we take a more\
    \ static view:\n\n- The source code has locations and each location has a static\
    \ type. In a TypeScript-aware editor, we can see the static type of a location\
    \ if we hover over it with the cursor.\n- When a source location is connected\
    \ to a target location via an assignment, function call, then the type of the\
    \ source location must be compatible with the type of the target location. The\
    \ TypeScript specification defines type compatibility via type relationships.\n\
    - The type relationship assignment compatibility defines what a source type S\
    \ is assignable to a target type T:\n\n  - S and T are identical types.\n  - S\
    \ or T is the any type.\n  - Etc.\n\n- 1. The static type of a variable determines\
    \ what can be assigned to it. That always depends on static types. For example,\
    \ in a function call toString(123), the static type of 123 must be assignable\
    \ to the static type of the parameter of toString().\n- 2. myVariable has type\
    \ MyType if the type of myVariable is assignable to MyType.\n- 3. SourceType is\
    \ assignable to TargetType if they are assignable-compatible.\n- 4. How union\
    \ works is defined via the type relationship apparent members.\n\nAn interesting\
    \ trait of TypeScript's type system is that the same variable can have different-ent\
    \ types at different locations:\n\n```javascript\n// %inferred-type: any[]\nconst\
    \ arr = [];\n\narr.push(123);\n```\n"
  mdcn: "\n\n# 第 10 章\n\n## 迁移到 TypeScript 的策略\n\n+ 内容\n- 10.1 三种策略 ................................................................................\
    \ 63\n- 10.2 策略：混合 JavaScript/TypeScript 代码库 ............................................\
    \ 64\n- 10.3 策略：为纯 JavaScript 文件添加类型信息 ............................................\
    \ 64\n- 10.4 策略：通过快照测试 TypeScript 错误来迁移大型项目 ................................................................................................................................\
    \ 65\n- 10.5 结论 .......................................................................................................\
    \ 65\n\n本章概述了将代码库从 JavaScript 迁移到 TypeScript 的策略。同时也提到了进一步阅读的材料。\n\n## 10.1 三种策略\n\
    \n以下是迁移到 TypeScript 的三种策略：\n\n- 我们可以让代码库支持 JavaScript 和 TypeScript文件的混合。我们从只使用\
    \ JavaScript 文件开始，然后逐渐切换到 TypeScript。\n- 我们可以保留当前的（非 TypeScript）构建过程和仅限 JavaScript\
    \ 代码库。我们通过 JSDoc 注释添加静态类型信息，并将 TypeScript 作为类型检查器（而不是编译器）。当所有内容都正确类型化后，我们切换到 TypeScript\
    \ 进行构建。\n- 对于大型项目，迁移过程中可能会产生过多的 TypeScript 错误。快照测试可以帮助我们找到修复的错误和新错误。\n\n更多信息：\n\
    \n- TypeScript 手册中的“从 JavaScript 迁移”\n\n## 10.2 策略：混合 JavaScript/TypeScript 代码库\n\
    \n如果我们使用编译器选项 `--allowJS`，TypeScript 编译器就支持 JavaScript 和 TypeScript 文件的混合：\n\n\
    - TypeScript 文件会被编译。\n- JavaScript 文件会被简单地复制到输出目录（在经过一些简单的类型检查之后）。\n\n起初只有 JavaScript\
    \ 文件。然后，我们一个接一个将文件切换为 TypeScript。在此过程中，我们的代码库一直保持编译状态。\n\n`tsconfig.json` 如下所示：\n\
    \n```json\n{\n  \"compilerOptions\": {\n    ...\n    \"allowJS\": true\n  }\n\
    }\n```\n\n更多信息：\n\n- Clay Allsopp 写的“增量地将 JavaScript 迁移到 TypeScript”。\n\n## 10.3\
    \ 策略：为纯 JavaScript 文件添加类型信息\n\n这种方法的工作如下：\n\n- 我们继续使用当前的构建基础设施。\n- 我们运行 TypeScript\
    \ 编译器，但仅作为类型检查器（编译器选项 `--noEmit`）。除了编译器选项 `--allowJS`（允许并复制 JavaScript 文件），我们还必须使用编译器选项\
    \ `--checkJS`（用于检查 JavaScript 文件）。\n- 我们通过 JSDoc 注释（见下例）和声明文件添加类型信息。\n- 一旦 TypeScript\
    \ 的类型检查器不再报错，我们就使用编译器来构建代码库。现在从 .js 文件切换到 .ts 文件并不紧迫，因为整个代码库已经是静态类型化的。我们现在甚至可以生成类型文件（扩展名为\
    \ .ts）。\n\n以下是我们如何通过 JSDoc 注释为纯 JavaScript 指定类型：\n\n```javascript\n/**\n * @param\
    \ {number} x - 第一个操作数\n * @param {number} y - 第二个操作数\n * @returns {number} 两个操作数之和\n\
    \ */\nfunction add(x, y) {\n  return x + y;\n}\n\n/** @typedef {prop1: string,\
    \ prop2: string, prop3: number} SpecialType */\n/** @typedef {(data: string, index?:\
    \ number) => boolean} Predicate */\n```\n\n更多信息：\n\n- “为纯 JavaScript 文件使用 TypeScript\
    \ 编译器”\n- Oliver Joseph Ash 写的“我们在 Unsplash 如何逐渐迁移到 TypeScript”\n\n## 10.4 策略：通过快照测试\
    \ TypeScript 错误来迁移大型项目\n\n在大型 JavaScript 项目中，无论我们选择哪种方法，切换到 TypeScript 都可能产生过多的错误。这时，对\
    \ TypeScript 错误进行快照测试可能选项：\n\n- 我们第一次对整个代码库运行 TypeScript 编译器。\n- 编译器产生的错误成为我们的初始快照。\n\
    - 当处理代码库时，我们将新的错误输出与之前的快照进行比较：\n  - 有时现有的错误会消失。这时我们可以创建一个新的快照。\n  - 有时会出现新错误。这时我们要么必须修复这些错误，要么创建一个新的快照。\n\
    \n更多信息：\n\n- Dylan Vann 写的“如何增量地迁移 10 万行代码到 TypeScript”\n\n## 10.5 结论\n\n我们快速查看了迁移到\
    \ TypeScript 的策略。还有两点建议：\n\n- 从实验开始迁移：在决定采用某种策略之前，先玩你的代码库并尝试各种策略。\n- 然后为以后制定清晰的计划。就优先级问题与你的团队讨论：\n\
    \  - 有时完全完成迁移可能是优先事项。\n  - 有时在迁移期间保持代码完全可用可能更重要。\n  - 依此类推……\n\n# 第三部分\n\n# 基础类型\n\
    \n# 第 11 章\n\n# 什么是 TypeScript 中的类型？\n两个视角\n\n| 内容 | | |\n| :--- | :--- | :---\
    \ |\n| 11.1 每个视角的三个问题 . . . . . . . . | 69 |\n| 11.2 视角 1：类型是值的集合 . . . . . .\
    \ . . . . | 70 |\n| 11.3 视角 2：类型兼容性关系 . . . . . . . . . . . . | 70 |\n| 11.4 节点类型系统\
    \ vs. 结构化类型系统 . . . . . . . . | 71 |\n| 11.5 进一步阅读 . . . . . . . . . . . . . .\
    \ . . . . . | 72 |\n\nTypeScript 中的类型是什么？本章描述了有助于理解它们的两个视角。\n\n 11.1 每个视角的三个问题\n\
    \n为了理解类型如何工作，需要从两个视角回答以下三个问题：\n\n- 1. 变量拥有 `MyType` 类型意味着什么？\n`let myVariable:\
    \ MyType = /*...*/`\n- 2. 可赋值性：如果 `SourceType` 可以赋值给 `TargetType`（A）。\n`let source:\
    \ SourceType = /*...*/`\n`let target: TargetType = source; // (A)`\n- 3. 如何从 Type1、Type2\
    \ 和 Type3 推导出 TypeUnion？\n`type TypeUnion = Type1 | Type2 | Type3;`\n\n## 11.2\
    \ 视角 1：类型是值的集合\n\n从这个视角来看，类型是一个值的集合：\n\n- 1. 如果 myVariable 类型为 MyType，这意味着赋值给\
    \ myVariable 的值必须是 MyType 集合的元素。\n- 2. 如果 SourceType 是 TargetType 的子集，则 SourceType\
    \ 可以赋值 TargetType。因此，允许 SourceType 的值也允许 TargetType。\n- 3. 类型 Type1、Type2 和 Type3\
    \ 的并是定义它们的集合的集合论并。\n\n## 11.3 视角 2：类型兼容性关系\n\n从这个视角来看，我们不关心值在代码执行时的流动。相反，我们采取更静态的视角：\n\
    \n- 源码拥有位置，每个位置都有静态类型。在感知 TypeScript 的编辑器中，将光标悬停在位置上可以看到其静态类型。\n- 当源位置通过赋值、函数调用连接到目标位置时，源位置的类型必须与目标位置的类型兼容。TypeScript\
    \ 规范通过类型关系定义兼容性。\n- 赋值类型关系定义了源类型 S 如何适用于目标类型 T：\n\n  - S 和 T 是相同类型。\n  - S 或 T\
    \ 是 any 类型。\n  - 等。\n\n- 1. 变量的静态类型决定了可以给它的什么。这始终取决于静态类型。例如，在函数调用 `toString(123)`\
    \ 中，123 的静态类型必须赋值给 `toString()` 参数的静态类型。\n- 2. 如果 myVariable 的类型可赋值给 MyType，则\
    \ myVariable 拥有 MyType 类型。\n- 3. 如果 SourceType 和 TargetType 之间存在赋值兼容，则 SourceType\
    \ 可赋值给 TargetType。\n- 4. 并集的工作方式是通过其类型关系的可见成员定义的。\n\nTypeScript 类型系统的一个有趣特性是，同一个变量在不同位置可以有不同的类型：\n\
    \n```javascript\n// %inferred-type: any[]\nconst arr = [];\n\narr.push(123);\n\
    ```\n\n"
