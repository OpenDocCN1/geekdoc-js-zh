- md: "\n## 19.3.4 Pitfall: Class<T> does not match abstract classes\n\nWe cannot\
    \ use abstract classes when Class<T> is expected:\n\n```typescript\nabstract class\
    \ Shape {\n}\nclass Circle extends Shape {\n  // ...\n}\n\n// //ts-expect-error:\
    \ Type 'typeof Shape' is not assignable to type\n// 'Class<Shape>'.\n// Cannot\
    \ assign an abstract constructor type to a non-abstract\n// constructor type.\
    \ (2322)\nconst shapeClasses1: Array<Class<Shape>> = [Circle, Shape];\n```\n\n\
    Why is that? The rationale is that constructor type literals and construct signatures\
    \ should only be used for values that can actually be new-invoked (GitHub issue\
    \ with more information).\n\nThis is a workaround:\n\n```typescript\ntype Class2<T>\
    \ = Function & {prototype: T};\n\nconst shapeClasses2: Array<Class2<Shape>> =\
    \ [Circle, Shape];\n```\n\nDownsides of this approach:\n\n- Slightly confusing.\n\
    - Values that have this type can't be used for instanceof checks (as right-hand-side\
    \ operands).\n\n## Chapter 20\n\n## Typing Arrays\n\nContents\n- 20.1 Roles of\
    \ Arrays 167\n- 20.2 Ways of typing Arrays 168\n- 20.2.1 Array role \"list\":\
    \ Array type literals vs. interface type Array 168\n- 20.2.2 Array role \"tuple\"\
    : tuple type literals 168\n- 20.2.3 Objects that are also Array-ish: interfaces\
    \ with index signatures 168\n- 20.3 Pitfall: type inference doesn't always get\
    \ Array types right 169\n- 20.3.1 Inferring types of Arrays is difficult 169\n\
    - 20.3.2 Type inference for non-empty Array literals 169\n- 20.3.3 Type inference\
    \ for empty Array literals 170\n- 20.3.4 const assertions for Arrays and type\
    \ inference 171\n- 20.4 Pitfall: TypeScript assumes indices are never out of the\
    \ 172\n\nIn this chapter, we examine how Arrays can be typed in TypeScript.\n\n\
    ## 20.1 Roles of Arrays\n\nArrays can play the following roles in JavaScript (either\
    \ one or a mix of them):\n\n- Lists: All elements have the same type. The length\
    \ of the Array varies.\n- Tuple: The length of the Array is fixed. The elements\
    \ do not necessarily have the same type.\n\nTypeScript accommodates these two\
    \ roles by offering various ways of typing arrays. We will look at those next.\n\
    \n## 20.2 Ways of typing Arrays\n\n### 20.2.1 Array role \"list\": Array type\
    \ literals vs. interface type Array\n\nAn Array type literal consists of the element\
    \ type followed by []. In the following code, the Array type literal is string[]:\n\
    \n```typescript\n// Each Array element has the type `string`;\nconst myArrayArray:\
    \ string[] = ['fee', 'fi', 'fo', 'fum'];\n```\n\nAn Array type is a shorthand\
    \ for using the global generic interface type Array:\n\n```typescript\nconst myArrayArray:\
    \ Array<string> = ['fee', 'fi', 'fo', 'fum'];\n```\n\nIf the element type is more\
    \ complicated, we need parentheses for Array type literals:\n\n```typescript\n\
    (number|string[])\n(() => boolean[])\n```\n\nThe generic type Array works better\
    \ in this case:\n\n```typescript\nArray<number|string>\nArray<() => boolean>\n\
    ```\n\n### 20.2.2 Array role \"tuple\": tuple type literals\n\nIf the Array has\
    \ a fixed length and each element has a different, fixed type that depends on\
    \ its position, then we can use tuple literals such as [string, string, boolean]:\n\
    \n```typescript\nconst yes: [string, string, boolean] = ['oui', 'si', true];\n\
    ```\n\n### 20.2.3 Objects that are also Array-ish: interfaces with index signature\n\
    \nIf an interface has only an index signature, we can use it for Arrays:\n\n```typescript\n\
    interface StringArray {\n  [index: number]: string;\n}\nconst strArr: StringArray\
    \ = ['Huey', 'Dewey', 'Louie'];\n```\n\nAn interface that has both an index signature\
    \ and property signatures, only works for objects (because indexed elements and\
    \ properties need to be defined at the same time):\n\n```typescript\ninterface\
    \ FirstNamesAndLastName {\n  [index: number]: string;\n  lastName: string;\n}\n\
    \nconst names: FirstNamesAndLastName = {\n  0: 'Huey',\n  1: 'Dewey',\n  2: 'Louie',\n\
    \  lastName: 'Duck'\n};\n```\n\n## 20.3 Pitfall: type inference doesn't always\
    \ get Array types right\n\n### 20.3.1 Inferring type of Arrays is difficult\n\n\
    Due to the two roles of Arrays, it is impossible for TypeScript to always guess\
    \ the right type. As an example, consider the following Array literal that is\
    \ assigned to the variable fields:\n\n```typescript\nconst fields: Fields = [\n\
    \  ['first', 'string', true],\n  ['last', 'string', true],\n  ['age', 'number',\
    \ false],\n];\n```\n\nWhat is the best type for fields? The following are all\
    \ reasonable choices:\n\n```typescript\ntype Fields = Array<string, string, boolean>;\n\
    \ntype Fields = Array<string|'string'|number, boolean>;\n\ntype Fields = Array<Array<string|boolean>>;\n\
    \ntype Fields = [\n  [string, string, boolean],\n  [string, string, boolean],\n\
    \  [string, string, boolean],\n];\n\ntype Fields = [\n  ['string', boolean],\n\
    \  ['string', 'string', boolean],\n  ['string', 'number', boolean],\n];\n\ntype\
    \ Fields = [\n  Array<string|boolean>,\n  Array<string|boolean>,\n  Array<string|boolean>,\n\
    ];\n```\n\n### 20.3.2 Type inference for non-empty Array literals\n\nWhen we use\
    \ non-empty Array literals, TypeScript's default is to infer types (not tuple\
    \ types):\n\n```typescript\n// %inferred-type: (string | number)[]\nconst arr\
    \ = [123, 'abc'];\n```\n\nAs, that's not what we want:\n\n```typescript\nfunction\
    \ func(p: [number, number]) {\n  return p;\n}\n// %inferred-type: number[]\nconst\
    \ pairl = [1, 2];\n\n// @ts-expect-error: Argument of type 'number[]' is not assignable\
    \ to\n// parameter of type '[number, number]'. [...]\nfunc(pairl);\n```\n\nWe\
    \ can fix this by adding a type annotation to the declaration:\n\n```typescript\n\
    const pair2: [number, number] = [1, 2];\nfunc(pair2); // OK\n```\n\n### 20.3.3\
    \ Type inference for empty Array literals\n\nIf we initialize with an empty Array\
    \ literal, TypeScript initially infers the type as `any[]`:\n\n```typescript\n\
    // //inferred-type: any[]\nconst arr = [];\n```\n\nIn contrast, if the Array literal\
    \ has at least one element, then the type is fixed and doesn't change:\n\n```typescript\n\
    // //inferred-type: number[]\nconst arr = [123];\n```\n\n```typescript\n// @ts-expect-error:\
    \ Argument of type \"abc\" is not assignable to\n// parameter of type 'number'.\n\
    arr.push('abc');\n\n\n## 20.3.4 const assertions for Arrays and type inference\n\
    \nWe can suffix an Array literal with a const assertion:\n\n```typescript\n//\
    \ //inferred-type: readonly ['igneous', 'metamorphic', 'sedimentary']\nconst rockCategories\
    \ = ['igneous', 'metamorphic', 'sedimentary'] as const;\n```\n\nWe are declaring\
    \ that rockCategories won't change. That has the following effects:\n\n- The Array\
    \ becomes read-only — we can't use operations that change:\n  // //ts-expect-error:\
    \ Property 'push' does not exist on type\n  // 'readonly ['igneous', 'metamorphic',\
    \ 'sedimentary']'. (2339)\n  rockCategories.push('sand');\n- TypeScript infers\
    \ a tuple:\n  // //inferred-type: string[]\n  const rockCategories2 = ['igneous',\
    \ 'metamorphic', 'sedimentary'];\n- TypeScript infers literal types (like 'igneous')\
    \ instead of generic types. That the inferred tuple is not [string, string, string].\n\
    \nHere are more examples of Array literals with and without assertions:\n\n```typescript\n\
    // //inferred-type: readonly [1, 2, 3, 4]\nconst number1 = [1, 2, 3, 4] as const;\n\
    // //inferred-type: number[]\nconst number2 = [1, 2, 3, 4];\n```\n\n```typescript\n\
    // //inferred-type: readonly [true, 'abc']\nconst booleanAndString = [true, 'abc']\
    \ as const;\n// //inferred-type: string | boolean[]\nconst booleanAndString2 =\
    \ [true, 'abc'];\n```\n\n### 20.3.4.1 Potential pitfalls of const assertions\n\
    \nThere are two potential pitfalls with const assertions.\n\nFirst, the inferred\
    \ type is as narrow as possible. That causes an issue for let-declared variables:\
    \ We cannot assign any tuple other than the one that we used for initialization:\n\
    \n```typescript\nlet arr = [1, 2] as const;\n```\n\n```typescript\narr = [1, 2];\
    \ // OK\n// //ts-expect-error: Type '3' is not assignable to type '2'. (2322)\n\
    arr = [1, 3];\n```\n\nSecond, tuples declared via as const can't be mutated:\n"
  mdcn: "\n\n## 19.3.4 阱：Class<T> 不匹配抽象类\n\n当期望 `Class<T>` 时，我们无法使用抽象类：\n\n```typescript\n\
