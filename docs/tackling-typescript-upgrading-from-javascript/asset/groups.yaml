  mdcn: "\n\n## 11.4 命名类型系统 vs. 结构类型系统\n\n```typescript\n// // %inferred-type: number[]\n\
    arr;\n\narr.push('abc');\n// %inferred-type: (string | number)[]\narr;\n```\n\n\
    静态类型系统的职责之一是确定两个静态类型是否兼容：\n\n- 实际参数的静态类型 `Src`（例如，通过函数调用提供）\n- 对应的形式参数的静态类型 `Trg`（例如，在函数定义中指定）\n\
    \n这通常意味着检查 `Src` 是否是 `Trg` 的子类型。这种检查有两种处理方法（大致如下）：\n\n- 在命名（nominal）或指定（nominative）类型系统中，如果两个静态类型具有相同的标识（“名称”），它们就是相等的。如果类型关系是显式定义的，则一个类型是另一个类型的子类型。\n\
    - 具有命名类型的语言有 C++、Java、C#、Swift 和 Rust。\n- 在结构（structural）类型系统中，如果两个静态类型具有相同的结构（如果它们的各个具有相同的名称和类型），它们就是相等的。如果\
    \ `Sup` 的所有部分（可能还有其他部分）以及 `Sub` 的每个部分都是 `Sup` 对应部分的子类型，则 `Sub` 是 `Sup` 的子类型。\n\
    - 具有结构类型化的语言有 OCaml/ReasonML 和 TypeScript。\n\n以下代码在命名类型系统下会在 A 行产生类型错误，但在 TypeScript\
    \ 的结构类型系统中是合法的，因为类 A 和类 B 具有相同的结构：\n\n```typescript\nclass A {\n  name = 'A';\n\
    }\nclass B {\n  name = 'B';\n}\nconst someVariable:A = new B(); // (A)\n```\n\n\
    TypeScript 的接口也是结构化工作的——它们不需要实现就可以匹配：\n\n```typescript\ninterface Point {\n  x:\
    \ number;\n  y: number;\n}\nconst point: Point = {x: 1, y: 2}; // OK\n```\n\n\
    ## 11.5 扩展阅读\n\n- TypeScript Handbook 中的“类型兼容”（Type Compatibility）章节\n- TypeScript\
    \ 规范中的“类型关系”（Type Relationships）章节\n\n## 第 12 章\n\n### 顶类型 any 和 unknown\n\n|\
    \ 内容 | 页码 |\n| :--- | :--- |\n| 12.1 TypeScript 的两个顶类型 | 73 |\n| 12.2 顶类型 any\
    \ | 73 |\n| 12.2.1 示例：JSON.parse() | 74 |\n| 12.2.2 示例：String() | 74 |\n| 12.3\
    \ 顶类型 unknown | 74 |\n\n在 TypeScript 中，`any` 和 `unknown` 是包含所有值的类型。在本章中，我们将研究它们是什么以及有什么用途。\n\
    \n### 12.1 TypeScript 的两个顶类型\n\n`any` 和 `unknown` 是 TypeScript 中所谓的*顶类型*（top types）。引用维基百科的话：\n\
    \n> 顶类型 [...] 是通用类型，有时被称为*通用超类型*（universal supertype），因为任何给定系统中的所有其他类型都是子类型 [...]。在大多数情况下，它是感兴趣的类型系统中包含每个可能的[值]的类型。\n\
    \n也就是说，当类型视为值的集合时（关于类型的更多信息，请参阅 §11 “什么是 TypeScript 中的类型？两种视角”），`any` 和 `unknown`\
    \ 是包含所有值的集合。顺便提一下，TypeScript 还有*底类型*（bottom type）`never`，它是空集。\n\n### 12.2 顶类型\
    \ any\n\n如果一个值是 `any`，我们可以对它做任何事情：\n\n```typescript\nfunction func(value: any)\
    \ {\n  // 仅允许数字，但它们是 `any` 的子类型\n  5 * value;\n\n  // 通常，value 的类型签名必须包含 .propName\n\
    \  value.propName;\n\n  // 通常只允许数组和具有索引签名的类型\n  value[123];\n}\n```\n\n任何类型都可以赋值给\
    \ `any`：\n\n```typescript\nlet storageLocation: any;\n\nstorageLocation = null;\n\
    storageLocation = true;\nstorageLocation = {};\n```\n\n任何类型都可以被赋值为：\n\n```typescript\n\
    function func(value: any) {\n  const a: null = value;\n  const b: boolean = value;\n\
    \  const c: object = value;\n}\n```\n\nTypeScript 的类型系统通常给了我们这种保护。因此，如果我们无法使用更具体的类型或\
    \ `unknown`，则应将其作为最后的手段。\n\n#### 12.2.1 示例：JSON.parse()\n\n`JSON.parse()` 的结果取决于动态输入，这就是为什么返回类型是\
    \ `any`（在 `unknown` 类型出现之前）。否则，返回类型可能是 `unknown`。\n\n```typescript\nJSON.parse(text:\
    \ string): any;\n```\n\n#### 12.2.2 示例：String()\n\n`String()` 函数将任意值转换为字符串，具有如下签名：\n\
    \n```typescript\ninterface String {\n  (value?: any): string; // 调用\n}\n```\n\n\
    ### 12.3 顶类型 unknown\n\n`unknown` 是 `any` 的类型安全版本。`any` 允许我们做任何事情，而 `unknown`\
    \ 要严格得多。在我们对 `unknown` 类型的值执行操作之前，我们必须通过以下方式缩小它们的类型：\n\n- 类型断言：\n```typescript\n\
    function func(value: unknown) {\n  // @ts-expect-error: Object is of type 'unknown'\n\
    \  value.toFixed(2);\n\n  // 类型断言:\n  (value as number).toFixed(2); // OK\n}\n\
    ```\n- 等于：\n```typescript\nfunction func(value: unknown) {\n  // @ts-expect-error:\
