    \ 149\n\nIn this chapter, we examine how class definitions work in TypeScript:\n\
    \n- First, we take a look at the features of class definitions in plain JavaScript.\n\
    - Then we explore what additions TypeScript brings to the table.\n\n## 17.1 Cheat\
    \ sheet: classes in plain JavaScript\n\nThis section is a cheat sheet for class\
    \ definitions in plain JavaScript.\n\n### 17.1.1 Basic members of classes\n\n\
    ```typescript\nclass OtherClass {}\n\nclass MyClass1 extends OtherClass {\n  publicInstanceField\
    \ = 1;\n\n  constructor() {\n    super();\n  }\n\n  prototypeMethod() {\n    return\
    \ 2;\n  }\n}\n\nconst inst1 = new MyClass1();\nassert.equal(inst1.publicInstanceField,\
    \ 1);\nassert.equal(inst1.prototypeMethod(), 2);\n```\n\nThe next sections are\
    \ about modifiers\nAt the end, there is a table that shows how modifiers can be\
    \ combined.\n\n### 17.1.2 Modifier: static\n\n```typescript\nclass MyClass2 {\n\
    \  static staticPublicField = 1;\n\n  static staticPublicMethod() {\n    return\
    \ 2;\n  }\n}\n\nassert.equal(MyClass2.staticPublicField, 1);\nassert.equal(MyClass2.staticPublicMethod(),\
    \ 2);\n```\n\n### 17.1.3 Modifier-like name prefix: # (private)\n\n```typescript\n\
    class MyClass3 {\n  #privateField = 1;\n\n  #privateMethod() {\n    return 2;\n\
    \  }\n\n  static accessPrivateMembers() {\n    // Private members can only be\
    \ accessed from inside class definitions\n    const inst3 = new MyClass3();\n\
    \    assert.equal(inst3.privateField, 1);\n    assert.equal(inst3.privateMethod(),\
    \ 2);\n  }\n}\n\nMyClass3.accessPrivateMembers();\n```\n\nWarning for JavaScript:\n\
    \n- Support for private methods is currently limited.\n- Private fields have broader,\
    \ but also limited.\n\nTypeScript has been supporting private fields since version\
    \ 3.8 but does not currently support private methods.\n\n### 17.1.4 Modifiers\
    \ for access: get (getter) and set (setter)\n\nRoughly, accessors are methods\
    \ that are invoked by accessing properties. There are two kinds of accessors:\
    \ getters and setters.\n\n```typescript\nclass MyClass5 {\n  #name = 'Rumpelstiltskin';\n\
    \n  /** Prototype getter */\n  get name() {\n    return this.#name;\n  }\n\n \
    \ /** Prototype setter */\n  set name(value) {\n    this.#name = value;\n  }\n\
    }\nconst inst5 = new MyClass5();\nassert.equal(inst5.name, 'Rumpelstiltskin');\
    \ // getter\ninst5.name = 'Queen'; // setter\nassert.equal(inst5.name, 'Queen');\
    \ // getter\n```\n\n### 17.1.5 Modifier for methods: * (generator)\n\n```typescript\n\
    class MyClass6 {\n  * publicPrototypeGeneratorMethod() {\n    yield 'hello';\n\
    \    yield 'world';\n  }\n}\nconst inst6 = new MyClass6();\n```\n\n### 17.1.6\
    \ Modifier for methods: async\n\n```typescript\nclass MyClass7 {\n  async publicPrototypeMethod()\
    \ {\n    const result = await Promise.resolve('abc');\n    return result;\n  }\n\
    }\n```\n\n### 17.1.7 Computed class member names\n\n```typescript\nclass MyClass8\
    \ {\n  [ 'InstanceField'] = 1;\n\n  [ 'prototypeMethod']() {\n    return 2;\n\
    \  }\n}\n```\n\n### 17.1.8 Combinations of modifiers\n\n| Modifier | Accessor\
    \ | Async | Generator | Visibility |\n| :--- | :---: | :---: | :---: | :---: |\n\
    | static | | | | |\n| get | X | | | |\n| set | X | | | |\n| private | | | | |\n\
    \n### 17.1.9 Under the hood\n\nIt's important to keep in mind that with classes,\
    \ there are two chains of prototype objects:\n\n- The instance chain which starts\
    \ with an instance.\n- The static chain which starts with the class of that instance.\n\
    \nConsider the following plain JavaScript example:\n\n```javascript\nclass ClassA\
    \ {\n  static staticMthdA() {}\n}\n```\n"
