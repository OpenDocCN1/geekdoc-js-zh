  - "[PAGE 159]\n\n158\n\n18 Class-related types\n\n```\nclass Color {\n  name: string;\n\
    \  constructor(name: string) {\n    this.name = name;\n  }\n}\nclass Person {\n\
    \  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n\
    }\nconst person: Person = new Person('Jane');\nconst color: Color = person; //\
    \ (A)\n```\n\nWhy doesn't TypeScript complain in line A? That's due to structural\
    \ typing: Instances of Person and Color have the same structure and are therefore\
    \ statically compatible.\n\n# 18.4.1.1 Switching off structural typing\n\nWe can\
    \ make the two groups of objects incompatible by adding private properties:\n\n\
    ```\nclass Color {\n  name: string;\n  private branded = true;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n}\nclass Person {\n  name: string;\n\
    \  private branded = true;\n  constructor(name: string) {\n    this.name = name;\n\
    \  }\n}\n```\n\n```\nconst person: Person = new Person('Jane');\n// @ts-expect-error:\
    \ Type 'Person' is not assignable to type 'Color'.\n// Types have separate declarations\
    \ of a private property\n// 'branded'. (2322)\nconst color: Color = person;\n\
    ```\n\nThe private properties switch off structural typing in this case."
