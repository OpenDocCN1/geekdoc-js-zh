- md: "\n## 18.4 Classes as types\n\n```typescript\n/**\n * Returns the prototype\
    \ of an object.\n * @param o The object that references the prototype.\n */\n\
    getPrototypeOf(o: any): any;\n}\n```\n\nOn the other hand, interface Object is\
    \ for instances of Object:\n\n```typescript\ninterface Object {\n  /** The initial\
    \ value of Object.prototype.constructor is the standard built-in Object */\n \
    \ constructor: Function;\n\n  /** Returns a string representation of an object.\
    \ */\n  toString(): string;\n}\n```\n\nThe name Object is used twice, at two different\
    \ language levels:\n\n- At the dynamic level, for a global variable.\n- At the\
    \ static level, for a type.\n\n## 18.4 Classes as types\n\nConsider the following\
    \ class:\n\n```typescript\nclass Color {\n  name: string;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n}\n```\n\nThis class definition creates\
    \ two things.\n\nFirst, a constructor function named Color (that can be invoked\
    \ via new):\n\n```typescript\nassert.equal(\n  typeof Color, 'function'\n)\n```\n\
    \nSecond, an interface named Color that matches instances of Color:\n\n```typescript\n\
    const green = new Color('green');\n```\n\nHere is proof that Color is really an\
    \ interface:\n\n```typescript\ninterface RbColor extends Color {\n  rgbValue:\
    \ [number, number, number];\n}\n```\n\n## 18.4.1 Pitfall: classes work structurally,\
    \ not nominally\n\nThere is one pitfall, though: Using Color as a static type\
    \ is not a very strict check:\n\n```typescript\nclass Color {\n  name: string;\n\
    \  constructor(name: string) {\n    this.name = name;\n  }\n}\nclass Person {\n\
    \  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n\
    }\nconst person: Person = new Person('Jane');\nconst color: Color = person; //\
    \ (A)\n```\n\nWhy doesn't TypeScript complain in line A? That's due to structural\
    \ typing: Instances of Person and Color have the same structure and are therefore\
    \ statically compatible.\n\n### 18.4.1.1 Switching off structural typing\n\nWe\
    \ can make the two groups of objects incompatible by adding private properties:\n\
    \n```typescript\nclass Color {\n  name: string;\n  private branded = true;\n \
    \ constructor(name: string) {\n    this.name = name;\n  }\n}\nclass Person {\n\
    \  name: string;\n  private branded = true;\n  constructor(name: string) {\n \
    \   this.name = name;\n  }\n}\n```\n\n```typescript\nconst person: Person = new\
    \ Person('Jane');\n// @ts-expect-error: Type 'Person' is not assignable to type\
    \ 'Color'.\n// Types have separate declarations of a private property\n// 'branded'.\
    \ (2322)\nconst color: Color = person;\n```\n\nThe private properties switch off\
    \ structural typing in this case.\n\n## 18.5 Further reading\n\n- Chapter “Prototype\
    \ chains and classes” in “JavaScript for impatient programmers\"\n\n## Chapter\
    \ 19\n\n## Types for classes as values\n\n- Contents\n- 19.1 Types for specific\
    \ classes ...................................................................\
    \ 161\n- 19.2 The type operator typeof ........................................................................\
    \ 162\n- 19.2.1 Constructor type literals ...................................................................\
    \ 162\n- 19.2.2 Object literals casting with construct signatures ................\
