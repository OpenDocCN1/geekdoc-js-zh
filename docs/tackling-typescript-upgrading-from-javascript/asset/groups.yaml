    \ 23.1 When are static types too general?\n\nIn TypeScript, a value can have a\
    \ type that is too general. For example:\n\n```typescript\nconst tsName = 'Jane'\
    \ as (null | string);\n```\n\n```typescript\n// ts-expect-error: Object is possibly\
    \ 'null'.\nttsName.length;\n```\n\n```typescript\nassert.equal(\nttsName.length,\
