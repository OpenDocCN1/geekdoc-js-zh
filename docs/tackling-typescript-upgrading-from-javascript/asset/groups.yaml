    This chapter describes how to use TypeScript to create packages for the package
    manager npm that are based on the CommonJS module format.


    > GitHub repository: ts-demo-npm-cjs


    In this chapter, we are exploring the repository ts-demo-npm-cjs which can be
    downloaded from GitHub. (I deliberately have not published it as a package to
    npm.)


    # 8.1 Required knowledge


    You should be roughly familiar with:'
  - '[PAGE 51]


    +   CommonJS modules – a module format that originated in, and was designed for,
    server-side JavaScript. It was popularized by the server-side JavaScript platform
    Node.js. CommonJS modules preceded JavaScript''s built-in ECMAScript modules and
    are still much used and well supported by tooling (IDEs, built tools, etc.).


    +   TypeScript''s modules – whose syntax is based on ECMAScript modules. However,
    they are often compiled to CommonJS modules.


    +   npm packages – directories with files that are installed via the npm package
    manager. They can contain CommonJS modules, ECMAScript modules, and various other
    files.


    # 8.2 Limitations


    In this chapter, we are using what TypeScript currently supports best:


    +   * All Your TypeScript code is compiled to CommonJS modules with the extension
    .js.

    * All external imports are CommonJS modules, too.


    Especially on Node.js, TypeScript currently doesn''t really support ECMAScript
    modules and filename extensions other than .js.


    # 8.3 The repository ts-demo-npm-cjs


    This is how the repository ts-demo-npm-cjs is structured:


    ```

    ts-demo-npm-cjs/

    .gitignore

    nmodules

    dist/ (created on demand)

    package.json

    ts/

    src/

    index.ts

    test/

    index_test.ts

    tsconfig.json

    ```


    Apart from package.json for the package, the repository contains:


    +   * ts/src/index.ts: the actual code of the package

    * ts/test/index_test.ts: a test for index.ts

    * tsconfig.json: configuration data for the TypeScript compiler


    package.json contains scripts for compiling:


    +   * Input: directory ts/ (TypeScript)

    * Output: directory dist/ (CommonJS modules; the directory doesn''t yet exist
    in the repository)


    This is where the compilation results for the two TypeScript files are put:'
- md: "\n## 8.4 .gitignore\n\nts/src/index.ts --> dist/src/index.js\nts/test/index_test.ts\
    \ --> dist/test/index_test.js\n\n# 8.4 .gitignore\n\nThis file lists the directories\
    \ that we don't want to check into git:\n\n- node_modules/\n- dist/\n\nExplanations:\n\
    \n- node_modules/ is set up via npm install.\n- The files in dist/ are created\
    \ by the TypeScript compiler (more on that later).\n\n## 8.5 .npmignore\n\nWhen\
    \ it comes to which files should and should not be uploaded to the npm registry,\
    \ we have different needs than we did for git. Therefore, in addition to .gitignore,\
    \ we also need the file .npmignore:\n\nts/\n\nThe two differences are:\n\n- We\
    \ want to upload the results of compiling TypeScript to JavaScript (directory\
    \ dist/).\n- We don't want to upload the TypeScript source files (directory ts/).\n\
    \nNote that npmignore ignores the directory node_modules/ by default.\n\n## 8.6\
    \ package.json\n\npackage.json looks like this:\n\n```json\n{\n...\n  \"type\"\
    : \"commonjs\",\n  \"main\": \"./dist/src/index.js\",\n  \"types\": \"./dist/src/index.d.ts\"\
    ,\n  \"scripts\": {\n    \"clean\": \"shx -rf dist*\",\n    \"build\": \"tsc\"\
    ,\n    \"watch\": \"tsc --watch unit\",\n    \"test\": \"mocha --ui unit\",\n\
    \    \"testall\": \"mocha --unit dist/test\",\n    \"prepack\": \"npm run clean\
    \ && npm run build\"\n  },\n  \"devDependencies\": {\n    \"@types/node\": \"\
    Needed for unit test assertions (assert.equal() etc.).\"\n  }\n}\n```\n\n# 8 Creating\
    \ CommonJS-based npm packages via TypeScript\n\n```json\n{\n  \"shx\": \"Needed\
    \ for development-time package.json scripts\",\n  \"devDependencies\": {\n   \
    \ \"@types/lodash\": \"...\",\n    \"@types/mocha\": \"...\",\n    \"@types/node\"\
    : \"...\",\n    \"mocha\": \"...\",\n    \"shx\": \"...\"\n  },\n  \"dependencies\"\
    : {\n    \"lodash\": \"...\"\n  }\n}\n```\n\nLet's take a look at the properties:\n\
    \n- type: The value \"commonjs\" means that .js files are interpreted as CommonJS\
    \ modules.\n- main: If there is a so-called bare import that only mentions the\
    \ name of the current package, then this is the module that will be imported.\n\
    - types points to a declaration file with all the type definitions for the current\
    \ package.\n\nThe next subsections cover the remaining properties.\n\n### 8.6.1\
    \ Scripts\n\nProperty scripts define various commands that can be invoked via\
    \ npm run. For example, the script clean is invoked via npm run clean. The previous\
    \ package.json contains the following scripts:\n\n- clean uses the cross-platform\
    \ package shx to delete the compilation results via its implementation of the\
    \ Unix shell rm. shx supports a variety of shell commands with the benefit of\
    \ not needing a separate package for each command we may want to use.\n- build\
    \ and watch the TypeScript compiler tsc to compile the TypeScript files according\
    \ to tsconfig.json. tsc must be installed globally or locally (inside the current\
    \ package), usually via the npm package types.\n- test and testall use the unit\
    \ test framework Mocha to run one or all tests.\n- prepack: This script is run\
    \ before a tarball is packed (due to npm pack, npm publish, or an installation\
    \ from git).\n\nNote that we are using an IDE, we don't need the scripts build\
    \ and watch because we can let the IDE build the artifacts. They are needed for\
    \ the script prepack.\n\n### 8.6.2 dependencies vs. Dependencies\n\ndependencies\
    \ should only contain the packages that are needed when importing a package. That\
    \ excludes packages that are used for running tests etc.\n\n### 8.7 tsconfig.json\n\
    \nPackages whose names start with @types/ provide TypeScript definitions for packages\
    \ that don't have any. Without the former, we can't use the latter. Are these\
    \ normal dependencies or dev dependencies? It depends:\n\n- If the type definitions\
    \ of our package refer to type definitions in another package, that package is\
    \ a normal dependency.\n- Otherwise, the package is only needed during development\
    \ time and a dev dependency.\n\n### 8.6.3 More information on package.json\n\n\
    - \"Awesome npm scripts\" has tips for writing cross-platform scripts.\n- The\
    \ npm docs for package.json explain various properties of that file.\n- The npm\
    \ docs for scripts explain the package, json property scripts.\n\n## 8.7 tsconfig.json\n\
    \n```json\n{\n  \"compilerOptions\": {\n    \"rootDir\": \"ts\",\n    \"outDir\"\
    : \"dist\",\n    \"target\": \"es2019\",\n    \"lib\": [\n      \"es2019\"\n \
    \   ],\n    \"module\": \"commonjs\",\n    \"esModuleInterop\": true,\n    \"\
    strict\": true,\n    \"declaration\": true,\n    \"sourceMap\": true\n  }\n}\n\
    ```\n\n- rootDir: Where are your TypeScript files located?\n- outDir: Where should\
    \ the compilation results be?\n- target: What is the targeted ECMAScript version?\
    \ If the TypeScript code uses a feature that is not supported by the targeted\
    \ version, then it is considered an equivalent code that only uses supported features.\n\
    - lib: What features should TypeScript be aware of? Possibilities include the\
    \ ECMAScript standard library and the DOM of browsers. The Node.js API is supported\
    \ differently, via the package @types/node.\n- module: Specifies the format of\
    \ the compilation output.\n\nThe remaining options are explained by the official\
    \ documentation for tsconfig.json.\n\n## 8.8 TypeScript code\n\n### 8.8.1 index.ts\n\
    \nThis file provides the actual functionality of the package:\n\n```typescript\n\
    import endsWith from 'lodash/endsWith';\n\nexport function removeSuffix(str: string,\
    \ suffix: string) {\n  if (!endsWith(str, suffix)) {\n    throw new Error(JSON.stringify(suffix))\
    \ + ' is not a suffix of ' + \n      JSON.stringify(str));\n  }\n  return str.slice(0,\
    \ -suffix.length);\n}\n```\n\nIt uses `endsWith()` of the library Lodash. That's\
    \ why Lodash is a normal dependency - it is needed at runtime.\n\n### 8.8.2 index_test.ts\n\
    \nThis file contains a unit test for index.ts:\n\n```typescript\nimport { struct\
    \ as assert } from 'assert';\nimport { removeSuffix } from '../src/index';\n\n\
    test('removeSuffix()', () => {\n  assert.equal(\n    removeSuffix('myfile.txt',\
    \ '.txt'),\n    'myfile'\n  );\n  assert.throws(() => removeSuffix('myfile.txt',\
    \ 'abc'));\n});\n```\n\nWe can run the test like this:\n\n```bash\nnpm t dist/test/index_test.js\n\
    ```\n\n- The npm command t is an abbreviation for the npm command test.\n- The\
    \ npm command test is an abbreviation for run test (which runs the script from\
    \ package.json).\n\nAs you can see, we are running the compiled version of the\
    \ test (in directory dist/), not the TypeScript code.\n\nFor more information\
    \ on the unit test framework Mocha, see its homepage.\n\n# Chapter 9\n\n# Creating\
    \ web apps via TypeScript and webpack\n\n- Contents\n9.1 Required knowledge .................................................................................................................................\
