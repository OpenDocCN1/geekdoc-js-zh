    ### 2.1.5 TypeScript 让重构更安全\n\n重构是许多集成开发环境（IDE）提供的自动化代码转换功能。\n\n重命名方法是重构的一个示例。在原生\
    \ JavaScript 中进行重命名可能是很棘手的，因为相同的名称可能指代不同的方法。TypeScript 拥有更多关于方法和类型之间如何连接的信息，这使得重命名方法变得更加安全。\n\
    \n### 2.1.6 TypeScript 可以将新特性编译为旧版代码\n\nTypeScript 倾向于快速支持 ECMAScript 第 4 阶段的特性（这些特性计划包含在下一个\
    \ ECMAScript 版本中）。当我们编译为 JavaScript 时，编译器选项 `--target` 允许我们指定输出所兼容的 ECMAScript\
    \ 版本。任何不兼容的特性（后来的引入的）都将被编译为等效的兼容代码。\n\n请注意，这种对旧版 ECMAScript 版本的支持并不需要 TypeScript\
    \ 或静态类型：JavaScript 编译器 Babel 也能这样做，但它是将 JavaScript 编译为 JavaScript。\n\n## 2.2 使用\
    \ TypeScript 的缺点\n\n- 它是 JavaScript 之上的又一个层：更多的复杂性、更多需要学习的内容等。\n- 它在编写代码时引入了编译步骤。\n\
