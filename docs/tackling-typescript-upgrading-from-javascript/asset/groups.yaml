    \ . 25\n4.4 Using the TypeScript compiler for plain JavaScript files . . . . .\
    \ . . . 26\n\nThis chapter gives the bird’s eye view of how TypeScript works:\
    \ What is the structure of a typical TypeScript project? What is compiled and\
    \ how? How can we use IDEs to write TypeScript?\n\n# 4.1 The structure of TypeScript\
    \ projects\n\nThis is one possible file structure for TypeScript projects:\n\n\
    ```\ntypescript-project/\ndist/\nts/\nsrc/\nmain.ts\nutil.ts\ntest/\nutil_test.ts\n\
    ttsconfig.json\n```\n\nExplanations:"
  - "[PAGE 25]\n\n4 How does TypeScript work? The bird's eye view\n\n+   - Directory\
    \ ts/ contains the TypeScript files:\n  - Subdirectory ts/src/ contains the actual\
    \ code.\n  - Subdirectory ts/test/ contains tests for the code.\n- Directory dist/\
    \ is the output of the compiler in ts/\n- The TypeScript compiler compiles TypeScript\
    \ files in ts/ to JavaScript files in dist/. For example:\n  - ts/src/main.js\
    \ is compiled to dist/src/main.js (and possibly other files)\n- tsconfig.json\
    \ is used to configure the TypeScript compiler.\n\n# 4.1.1 tsconfig.json\n\nThe\
    \ contents of tsconfig.json look as follows:\n\n```\n{\n  \"compilerOptions\"\
    : {\n    \"rootDir\": \"ts\",\n    \"outDir\": \"dist\",\n    \"module\": \"commonjs\"\
    ,\n    ...\n  }\n}\n```\n\nWe have specified:\n\n+   - The root directory of the\
    \ TypeScript code is ts/.\n- The directory where the TypeScript compiler saves\
    \ its output is dist/.\n- The module format of the output files is CommonJS.\n\
    \n# 4.2 Programming TypeScript via an integrated development environment (IDE)\n\
    \nTwo popular IDEs for JavaScript are:\n\n+   - Visual Studio Code (free)\n- WebStorm\
    \ (for purchase)\n\nThe observations in this section are about Visual Studio Code,\
    \ but may apply to other IDEs, too.\n\nOne important fact to be aware of is Visual\
    \ Studio Code processes TypeScript source in two independent ways:\n\n+   - Checking\
    \ open files for errors: This is done via a so-called language server. Language\
    \ servers exist independently of particular editors and provide Visual Studio\
    \ Code with language-related services: detecting errors, refactoring, completions,\
    \ etc. Communication with servers happens via a protocol that is based on JSON-RPC\
    \ (RPC for remote procedure calls). The independence provided by that protocol\
    \ means that servers can be written in almost any programming language.\n  - Important\
    \ fact to remember: The language server only lists errors for currently open files\
    \ and doesn't compile TypeScript, it only analyzes it statically."
  - "[PAGE 26]\n\n# 4.3 Other files produced by the TypeScript compiler\n\n+   * Building\
    \ (compiling TypeScript files to JavaScript files): Here, we have two choices.\n\
    \  - We can run a build tool via an external command line. For example, the TypeScript\
    \ compiler tsc has a --watch mode that watches input files and compiles them to\
    \ output files whenever they change. As a consequence, whenever we save a TypeScript\
    \ file in the IDE, we immediately get the corresponding output(s).\n  - We can\
    \ run tsc from within Visual Studio Code. In order to do so, it must be installed\
    \ inside every project that we are currently working on or globally (via the npm\
    \ package manager npm). With building, we get a complete list of errors. For more\
    \ information on compiling TypeScript from within Visual Studio Code, see the\
    \ official documentation for that IDE.\n\n# 4.3 Other files produced by the TypeScript\
    \ compiler\n\nGiven a TypeScript file main.ts, the TypeScript compiler can produce\
    \ several kinds of artifacts. The most common ones are:\n\n+   * JavaScript file:\
    \ main.js\n* Declaration file: main.d.ts (contains type information; .ts files\
    \ minus the JavaScript code)\n* Source map file: main.js.map\n\nTypeScript is\
    \ not delivered via .ts files, but via .js files and .ts files:\n\n+   * The JavaScript\
    \ code contains all actual functionality and can be consumed by plain JavaScript.\n\
    * The declaration files help programming editors with auto-completion and similar\
    \ services. This information enables plain JavaScript to be consumed by TypeScript.\
    \ However, we profit from it when we work with plain JavaScript because it gives\
    \ us better auto-completion and more.\n\nA source map specifies for each part\
    \ of the output code in main.js, which part of the input code main.ts produced\
    \ it. Other things, this information enables runtime environments to execute JavaScript\
    \ code, while showing the line numbers of the TypeScript code in error messages.\n\
    \n# 4.3.1 In order to use npm packages from TypeScript, we need type-information\n\
    \nThe npm registry is a huge repository of JavaScript code. If we want to use\
    \ a JavaScript package from TypeScript, we need type information for:\n\n+   *\
    \ The package itself may include .d.ts files or even the complete TypeScript code.\n\
    * If it doesn't, we may still be able to use it: DefinitelyTyped is a repository\
    \ of declaration files that people have written for plain JavaScript packages.\n\
    \nThe declaration files of DefinitelyTyped reside in the @types namespace. Therefore,\
    \ we need a declaration file for a package such as lodash, we have to has install\
    \ the package @types/lodash."
- md: "\n## 4.4 Using the TypeScript compiler for plain JavaScript files\n\nThe TypeScript\
    \ compiler can also process JavaScript files:\n\n- With the option --allowJS,\
    \ the TypeScript compiler copies JavaScript files in the input directory over\
    \ to the output directory. Benefit: migrating from JavaScript to TypeScript, we\
    \ can start with a mix of JavaScript and TypeScript files and slowly convert more\
    \ JavaScript files to TypeScript.\n- With the option --checkJS, the compiler additionally\
    \ adds type-checks JavaScript files (--allowJS must be on for this option to work).\
    \ It does so as well as it can, given the limited information that is available.\
    \ Which files are checked can be configured via comments inside:\n    * Explicit\
    \ excluding: If a JavaScript file contains the // @ts-nocheck, it will not be\
    \ type-checked.\n    * Explicit including: Without --checkJS, the comment // @ts-check\
    \ can be used to type-check individual JavaScript files.\n- The TypeScript compiler\
    \ uses static type information that is specified via JSDoc comments (see below\
    \ for an example). If we are thorough, we can fully statically type plain JavaScript\
    \ files and derive declaration files from them.\n- With the option --noEmit, the\
    \ compiler does not produce any output, it only typechecks files.\n\nThis is an\
    \ example of a JSDoc comment that provides static type information for a function():\n\
    \n```typescript\n/**\n * @param {number} x - The first operand\n * @param {number}\
    \ y - The second operand\n * @returns {number} The sum of both operands\n */\n\
    function add(x, y) {\n  return x + y;\n}\n```\n\nMore information: Type-Checking\
    \ JavaScript Files in the TypeScript Handbook.\n\n## Chapter 5\n\n## Trying out\
    \ TypeScript\n\n| Contents |\n| :--- |\n| 5.1 The TypeScript Playground . . .\
    \ . . . . . . . 27 |\n| 5.2 TS Node . . . . . . . . . . . . . . . . . . 27 |\n\
    \nThis chapter gives tips for quickly trying out TypeScript.\n\n### 5.1 The TypeScript\
    \ Playground\n\nThe TypeScript Playground is an editor for TypeScript code. Features\
    \ include:\n\n- Supports full IDE-style editing: auto-completion, etc.\n\nThe\
    \ Playground is very useful for quick experiments and demos. It can save both-TypeScript\
    \ code snippets and compiler settings into URLs, which is great for sharing snippets\
    \ with others. This is an example of such a URL:\n\nhttps://www.typescript.org/play/#code=MEwdwgzLgBFDuLyBGTBGEGAKHgHmCdCdeW2AsgwD4YCb0BggChXRIQABFA04ymBmHRYA5AEMARsAkUkZIA\n\
    \n### 5.2 TS Node\n\nTS Node is a TypeScript version of Node.js. Its use cases\
    \ are:\n\n- TS Node provides a REPL (command line) for TypeScript:\n\n```bash\n\
    $ ts-node\n> const twice = (x: string) => x + x;\n> twice('abc')\n> 'abc'\n> twice(123)\n\
    Error TS2345: Argument of type '123' is not assignable to parameter of type 'string'.\n\
    ```\n\n- TS Node enables some JavaScript tools to directly execute TypeScript\
    \ code. It automatically compiles TypeScript code to JavaScript code and passes\
    \ it on to the tools, without us having to do anything. The following shell command\
    \ demonstrates how that works with the JavaScript unit test framework Mocha:\n\
    \n```bash\nmocha --require ts-node/register --ui qunit testfile.ts\n```\n\nUse\
    \ npx ts-node to run the REPL without installing it.\n\n## Chapter 6\n\n## Notation\
    \ used in this book\n\n| Contents |\n| :--- |\n| 6.1 Test assertions (dynamic)\
    \ ................................................................... 29 |\n|\
    \ 6.2 Type assertions (static) ........................................................................\
    \ 30 |\n\nThis chapter explains functionality that is used in the code examples,\
    \ but not part of TypeScript proper.\n\n### 6.1 Test assertions (dynamic)\n\n\
    The code examples shown in this book are tested automatically via unit tests.\
    \ Expected results of operations are checked via the following assertion functions\
    \ from the Node.js module assert:\n\n- assert.equal() tests equality ===.\n- assert.deepEqual()\
    \ tests equality by deeply comparing nested objects (incl. Arrays).\n- assert.throws()\
    \ complains if the callback parameter does not throw an exception.\n\nThis is\
    \ an example of using these assertions:\n\n```javascript\nimport strict as assert\
    \ from 'assert';\n\nassert.equal(3 + 'apples', '3 apples');\n\nassert.deepEqual(\n\
    \  ['a', 'b'], \n  ['a', 'b']\n);\n\nassert.throws(\n  () => eval(null.myProperty),\n\
    \  TypeError\n);\n```\n\nThe import statement in the first line makes use of strict\
    \ assertion mode (which uses ===, not ==). It is usually omitted in code examples.\n\
    \n### 6.2 Type assertions (static)\n\nYou'll also see static type assertions.\n\
    \n%inferred-type is just a comment in normal TypeScript and describes the type\
    \ that TypeScript infers for the following line:\n\n```typescript\n// %inferred-type:\
    \ number\nlet num = 123;\n```\n\n@ts-expect-error suppresses static errors in\
    \ TypeScript. In this book, the suppressed error is always mentioned. That is\
    \ neither required in plain TypeScript, nor does it do anything there.\n\n```typescript\n\
    assert.throws(\n  // @ts-expect-error: Object is possibly 'null'. (2531)\n  ()\
    \ => null.myProperty,\n  TypeError);\n```\n\nNote that we previously needed eval()\
    \ in order not to be warned by TypeScript.\n\n## Chapter 7\n\n## The essentials\
    \ of TypeScript\n\n| Contents | |\n| :--- | :--- |\n| 7.1 What you'll learn .\
    \ . . . . . . . . . . . . . . . . . . . . . . . . . | 32 |\n| 7.2 Specifying the\
    \ comprehensiveness of type checking . . . . . . . . . . . | 32 |\n| 7.3 Types\
    \ in TypeScript . . . . . . . . . . . . . . . . . . . . . . . . 33 | 33 |\n| 7.4\
    \ Type annotations . . . . . . . . . . . . . . . . . . . . . . . . . . . | 33\
    \ |\n| 7.5 Type inference . . . . . . . . . . . . . . . . . . . . . . . . . .\
    \ . . . . | 34 |\n| 7.6 Specifying types via type expressions . . . . . . . .\
    \ . . . . . . . | 34 |\n| 7.7 The two language levels: dynamic vs. static . .\
    \ . . . . . . . . . . . . . | 35 |\n| 7.8 Type aliases . . . . . . . . . . . .\
    \ . . . . . . . . . . . . . . . . . | 35 |\n| 7.9 Arrays . . . . . . . . . . .\
    \ . . . . . . . . . . . . . . . . . . . | 35 |\n| 7.9.1 Arrays as lists . . .\
    \ . . . . . . . . . . . . . . . . . . . . . . . . . | 36 |\n| 7.9.2 Arrays as\
    \ tuples . . . . . . . . . . . . . . . . . . . . . . . . . . . . | 36 |\n| 7.10\
    \ Function types . . . . . . . . . . . . . . . . . . . . . . . . . . . . | 36\
    \ |\n| 7.10.1 A more complicated example . . . . . . . . . . . . . . . | 37 |\n\
    | 7.10.2 Return types of function declarations . . . . . . . . . . . | 37 |\n\
    | 7.10.3 Optional parameters . . . . . . . . . . . . . . . . . . . . . . | 38\
    \ |\n| 7.10.4 Rest parameters . . . . . . . . . . . . . . . . . . . . . . | 38\
    \ |\n| 7.11 Union types . . . . . . . . . . . . . . . . . . . . . . . . . . .\
    \ | 39 |\n| 7.11.1 By default, undefined and null are not included in types |\
    \ 39 |\n| 7.11.2 Optional vs. default value . . . . . . . . . . . . . . . . |\
    \ 40 |\n| 7.13 Typing objects . . . . . . . . . . . . . . . . . . . . . . . .\
    \ . . . | 41 |\n| 7.13.1 Typing-as-records via interfaces . . . . . . . . . .\
    \ | 41 |\n| 7.13.2 TypeScript's structural typing vs. nominal typing | 41 |\n\
    | 7.13.3 Object literal types . . . . . . . . . . . . . . . . . . . | 42 |\n|\
    \ 7.13.4 Optional properties . . . . . . . . . . . . . . . . . . . . . . . | 42\
    \ |\n| 7.13.5 Methods . . . . . . . . . . . . . . . . . . . . . . . . . . . .\
    \ | 42 |\n| 7.14 Type variables and generic types . . . . . . . . . . . . . .\
    \ | 43 |\n| 7.14.1 Example: a container for values . . . . . . . . . . . . | 44\
    \ |\n- 7.15 Example: a generic class ................. . . . . . . . . . . . .\
    \ . . . . | 44\n-- 7.15.1 Example: Maps ...................................................................................................\
    \ | 45\n- 7.15.2 Type variables for functions and methods ................................................\
    \ | 45\n- 7.15.3 A more complicated example ................................................\
    \ | 46\n- 7.16 Conclusion: understanding the initial example .......................................\
    \ | 46\n\nThis chapter explains the essentials of TypeScript.\n\n### 7.1 What\
    \ you'll learn\n\nAfter reading this chapter, you should be able to understand\
    \ the following TypeScript code:\n\n```typescript\ninterface Array<T> {\n  concat(items:\
    \ Array<T> | T): T[];\n  reduce<U>(\n    callback: (state: U, element: T, index:\
    \ number, array: T[]) => U,\n    firstState?: U\n  ): U;\n  //...\n}\n```\n\n\
    You may think this is cryptic. And I agree with you! But (as I hope to prove)\
    \ this syntax is relatively easy to learn. And once you understand it, it gives\
    \ you immediate, precise and comprehensive summaries of how code behaves — without\
    \ having to read long descriptions in English.\n\n### 7.2 Specifying the comprehensiveness\
    \ of type checking\n\nThere are many ways in which the TypeScript compiler can\
    \ be configured. One group of options controls how the compiler checks TypeScript\
    \ code. The maximum setting is activated via --strict and I recommend to always\
    \ use it. It makes programs slightly harder to write, but we also gain the full\
    \ benefits of static type checking\n\n> That's everything about --strict you need\
    \ to know for now\n\nRead on if you want to know more details.\n\nSetting --strict\
    \ to true, sets all of the following options to true:\n\n- --noImplicitAny: If\
    \ TypeScript can't infer a type, we must specify it. This mainly applies to parameters\
    \ of functions and methods: With these settings, we must annotate them.\n- --noImplicitThis:\
    \ Complain if the type of this isn't clear.\n- --alwaysStrict: Use JavaScript's\
    \ strict mode whenever possible.\n"
  mdcn: "\n\n## 4.4 使用 TypeScript 编译器处理纯 JavaScript 文件\n\nTypeScript 编译器也可以处理 JavaScript\
    \ 文件：\n\n- 使用 `--allowJS` 选项，TypeScript 编译器会将输入目录中的 JavaScript 文件复制到输出目录。优点是：在从\
    \ JavaScript 迁移到 TypeScript 时，我们可以从混合了 JavaScript 和 TypeScript 文件开始，并逐渐将更多的 JavaScript\
    \ 文件转换为 TypeScript。\n- 使用 `--checkJS` 选项，编译器会额外对 JavaScript 文件进行类型检查（必须开启 `--allowJS`\
    \ 选项此才能生效）。在可用信息有限的情况下，它会尽力完成检查。哪些文件需要被检查可以通过文件内部注释进行配置：\n    * 显式排除：如果 JavaScript\
    \ 文件包含 `// @ts-nocheck`，则将不会对其进行类型检查。\n    * 显式包含：在不使用 `--checkJS` 的情况下，可以使用注释\
    \ `// @ts-check` 对单个 JavaScript 文件进行类型检查。\n- TypeScript 编译器使用通过 JSDoc 注释指定的静态类型信息（见下示例）。如果我们足够严谨，就可以对纯\
    \ JavaScript 文件进行完全静态类型化，并从它们推导出声明文件。\n- 使用 `--noEmit` 选项，编译器不会产生任何输出，仅对文件进行类型检查。\n\
    \n这是一个为 `function()` 提供静态类型信息的 JSDoc 注释示例：\n\n```typescript\n/**\n * @param {number}\
    \ x - 第一个操作数\n * @param {number} y - 第二个操作数\n * @returns {number} 两个操作数的和\n */\n\
