    - 获取静态类型有时是困难的。我在这里的建议是尽可能简单——例如：不要过度使用泛型和类型变量。\n\n## 2.3 TypeScript 的误区\n\n###\
    \ 2.3.1 TypeScript 代码是笨肿的\n\nTypeScript 代码可以非常笨重。但它没得如此。例如，由于类型推断，我们只需要少量的注解即可完成：\n\
