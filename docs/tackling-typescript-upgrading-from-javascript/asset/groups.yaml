    \ 186\n\nThis chapter explores static typing for functions in TypeScript.\n\n\
    > in this chapter, “function” means “function or method or constructor” that are\
    \ said about functions (especially w.r.t. parameter handling), also apply to methods\
    \ and constructors.\n\n## 21.1 Defining statically typed functions\n\n### 21.1.1\
    \ Function declarations\n\nThis is an example of a function declaration in TypeScript:\n\
    \n```typescript\nfunction repeat1(str: string, times: number): string { // (A)\n\
    \  str.repeat(times);\n}\nassert.equal(\n  repeat1('*', 5, '******');\n```\n\n\
    - Parameters: If the compiler option --noImplicitAny is inferred. That is usually\
    \ on, if it is --strict, then the type of each parameter must be either inferrable\
    \ or explicitly specified. (We take a closer look at inference later). In this\
    \ case, no inference is possible, which is why str and times have type annotations.\n\
    - Return value: By default, the return type of function is inferred. That is usually\
    \ good enough. In this case, we opt to explicitly specify that repeat1() has the\
    \ return type string (last type annotation in line A).\n\n### 21.1.2 Arrow functions\n\
    \nThe function version of repeat1() looks as follows:\n\n```typescript\nconst\
    \ repeat2 = (str: string, times: number): string => {\n  str.repeat(times);\n\
    };\n```\n\nIn this case, we can also use an expression body:\n\n```typescript\n\
    const repeat3 = (str: string, times: number): string =>\nstr.repeat(times);\n\
    ```\n\n## 21.2 Types for functions\n\n### 21.2.1 Function type signatures\n\n\
    We can define types for functions via function type signatures:\n\n```typescript\n\
    type Repeat = (str: string, times: number) => string;\n```\n\nThe name of this\
    \ type of function is Repeat. Among others, it matches all functions with:\n\n\
    - (str: string, times: number) => string;\n\n### 21.2.2 Interfaces with call signatures\n\
    \nWe can also use interfaces to define:\n\n```typescript\ninterface Repeat {\n\
    \  (str: string, times: number): string;\n}\n```\n\n### 21.2.3 Checking if a value\
    \ matches a function type\n\n176\n\n### 21.2.3.2 Checking function declarations\
    \ (simple)\n\nChecking function declarations is more complicated:\n\n```typescript\n\
    function pred2(str: string): boolean {\n  return str.length > 0;\n}\n```\n\n//\
    \ Assign the function to a type-annotated variable\nconst pred2ImplementsStringPredicate:\
    \ StringPredicate = pred2;\n\n### 21.2.3.3 Checking function declarations (extravagant)\n\
    \nThe solution is slightly (i.e., don't worry if you don't fully understand it,\
    \ but it demonstrates several features):\n\n```typescript\nfunction pred3([...str]:\
    \ Parameters<StringPredicate>\n  : ReturnType<StringPredicate> {\n  return str.length\
    \ > 0;\n}\n```\n\n- We use Parameters<> to extract a tuple with the parameter\
    \ types. The three dots declare a rest parameter, which collects all parameters\
    \ in a tuple/Array. [str] destructures tuple. (More on rest parameters later in\
    \ this chapter.)\n- Return value: We use ReturnType<> to extract the return type.\n\
    \n## 21.3 Parameters\n\n### 21.3.1 When do parameters have to be type-annotated?\n\
    \nRecap: If --implicitAny is switched on (--strict switches it on), the type of\
    \ each parameter must be inferred or explicitly specified.\n\nIn the following\
    \ example, TypeScript can infer the type of str and we must specify it:\n\n```typescript\n\
    function twice(str: string) {\n  // ...\n}\n```\n\nIn line A, TypeScript can use\
    \ the StringMapFunction to infer the type of str and we don't need a type annotation:\n\
    \n```typescript\ntype StringMapFunction = (str: string) => string;\nconst twice:\
    \ StringMapFunction = (str) => str + str; // (A)\n```\n\nHere, TypeScript can\
    \ use the type of .map() to infer the type of str:\n\n```typescript\nassert.deepEqual(\n\
    \  ['a', 'b', 'c'].map((str) => str + str),\n  ['aa', 'bb', 'cc']);\n```\n"
