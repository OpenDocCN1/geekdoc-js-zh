    \nNote that the following check would not have worked:\n\n```\nfunction func(firstOrSecond:\
    \ FirstOrSecond) {\n  // @ts-expect-error: 'second' does not exist on\n  // type\
    \ 'FirstOrSecond'....\n  if (firstOrSecond.second !== undefined) {\n```"
  - "[PAGE 199]\n\n# 23 Type guards and assertion functions\n\n```\n// // ...\n}\n\
    }\n```\n\nThe problem in this case is that, without narrowing, we can't access\
    \ property .second of a value whose type is FirstOrSecond.\n\n# 23.2.3.1 The operator\
    \ in doesn't narrow non-union types\n\nAlas, in only helps us with union types:\n\
    \n```\nfunction func(obj: object) {\n  if ('name' in obj) {\n    // inferred-type:\
    \ object\n    obj;\n\n    // //ts-expect-error: Property 'name' does not exist\
    \ on type 'object'\n    obj.name;\n  }\n}\n```\n\n# 23.2.4 Checking the value\
    \ of a shared property (discriminated unions)\n\nIn a discriminated union, the\
    \ components of a union have one or more properties in common whose values are\
    \ different for each component. Such properties are called discriminants.\n\n\
    Checking the value of a discriminant is a type guard:\n\n```\ntype Teacher = {\
    \ kind: 'Teacher', teacherID: string };\ntype Student = { kind: 'Student', studentID:\
    \ string };\ntype Attendee = Teacher | Student;\n\nfunction getId(attendee: Attendee)\
    \ {\n  switch (attendee.kind) {\n    case 'Teacher':\n      // inferred-type:\
    \ kind: \"Teacher\"; teacherID: string;\n      attendee;\n      return attendee.teacherID;\n\
    \    case 'Student':\n      // inferred-type: kind: \"Student\"; studentID: string;\n\
    \      attendee;\n      return attendee.studentID;\n    default:\n      throw\
    \ new Error();\n  }\n}\n```\n\nIn the previous example, .kind is a discriminant:\
    \ Each components of the union Attendee has this property, with a unique value."
  - "[PAGE 200]\n\n# 23.2 Narrowing via built-in type guards\n\nAn if statement and\
    \ equality checks work similarly to a switch statement:\n\n```\nfunction getID(attendee:\
    \ Attendee) {\n  if (attendee.kind === 'Teacher') {\n    // inferred-type: { kind:\
    \ \"Teacher\"; teacherID: string; }\n    attendee;\n    return attendee.teacherID;\n\
    \  } else if (attendee.kind === 'Student') {\n    // inferred-type: { kind: \"\
    Student\"; studentID: string; }\n    attendee;\n    return attendee.studentID;\n\
    \  } else {\n    throw new Error();\n  }\n}\n```\n\n# 23.2.5 Narrowing dotted\
    \ names\n\nWe can also narrow the types of properties (even of nested ones that)\
    \ we access via chains of property names:\n\n```\ntype MyType = {\n  prop?: number\
    \ | string;\n};\nfunction func(arg: MyType) {\n  if (typeof arg.prop === 'string')\
    \ {\n    // inferred-type: string\n    arg.prop; // (A)\n  }\n\n  ].forEach((x)\
    \ => {\n    // inferred-type: string | number | undefined\n    arg.prop; // (B)\n\
    \  });\n\n  // inferred-type: string\n  arg.prop;\n\n  arg = {};\n\n  // inferred-type:\
    \ string | number | undefined\n  arg.prop; // (C)\n}\n```\n\nLet's look at a few\
    \ locations in the previous code:\n\n+   - Line A: We narrowed the type of arg.prop\
    \ via a type guard.\n- Line B: Callbacks may be executed much later (think of\
    \ asynchronous code), which is why TypeScript undoes narrowing inside callbacks.\n\
    - Line C: The preceding assignment also undid narrowing."
  - "[PAGE 201]\n\n# 23.2.6 Narrowing Array element types\n\n# 23.2.6.1 The Array\
    \ method .every() does not narrow\n\nIf we use .every() to check that all Array\
    \ elements are non-nullish, TypeScript does not narrow the type of mixedValues\
    \ (line A):\n\n```\nconst mixedValues: ReadonlyArray<undefined|number> =\n[1,\
    \ undefined, 2, null];\n```\n\n```\nif (mixedValues.every(isNotNull)) {\n  //\
    \ inferred-type: readonly (null | undefined)[]\n  mixedValues; // (A)\n}\n```\n\
    \nNote that mixedValues has to be read-only. If it weren't, another reference\
    \ to it would statically allow us push null into mixedValues inside the statement.\
    \ But then the narrowed type of mixedValues incorrect.\n\nThe previous code uses\
    \ user-defined type guard (more on what that is soon):\n\n```\nfunction isNotNull<T>(value:\
    \ T): value is NonNullable<T> { // (A)\n  return value !== undefined && value\
    \ !== null;\n}\n```\n\nNullable<Union> (line A) is a utility type that removes\
    \ the undefined and null from union type.\n\n# 23.2.6.2 The Array method .filter()\
    \ produces Arrays with narrower types\n\n.filter() produces Arrays that have narrower\
    \ types (i.e., it doesn't really narrow existing types):\n\n```\n// inferred-type:\
    \ (number | null | undefined)\nconst mixedValues = [1, undefined, 2, null];\n\
    ```\n\n```\n// inferred-type: number[]\nconst numbers = mixedValues.filter(isNotNull);\n\
    ```\n\n```\nfunction isNotNull<T>(value: T): value is NonNullable<T> { // (A)\n\
    \  return value !== undefined && value !== null;\n}\n```\n\nAs well we use a type\
    \ guard function – an arrow function with a type guard that is not enough:\n\n\
    ```\n// inferred-type: (number | null | undefined)\nconst stillMixed1 = mixedValues.filter(\n\
    \  x => x !== undefined && x !== null);\n```\n\n```\n// inferred-type: (number\
    \ | null | undefined)\nconst stillMixed2 = mixedValues.filter(\n  x => typeof\
    \ x === 'number');\n```"
  - "[PAGE 202]\n\n# 23.3 User-defined type guards\n\nTypeScript lets us define our\
    \ own type guards – for example:\n\n```\nfunction isFunction(value: unknown):\
    \ value is Function {\n  return typeof value === 'function';\n}\n```\n\nThe return\
    \ value of Function is a type predicate. It is part of the type signature of isFunction():\n\
    \n```\n// inferred-type: (value: unknown) => value is Function\nisFunction();\n\
    ```\n\nA user-defined type guard must always return booleans. If isFunction(x)\
    \ returns true, TypeScript narrows the type of the actual argument x to Function:\n\
    \n```\nfunction func(arg: unknown) {\n  if (isFunction(arg)) {\n    // inferred-type:\
    \ Function\n    arg; // type is narrowed\n  }\n}\n```\n\nNote that TypeScript\
    \ doesn't know how we compute the result of a user-defined guard. It gives us\
    \ a lot of freedom w.t. the checks we use. For example, we could implement isFunction()\
    \ as follows:\n\n```\nfunction isFunction(value: any): value is Function {\n \
    \ try {\n    value(); // (A)\n    return true;\n  } catch {\n    return false;\n\
    \  }\n}\n```\n\nAs, we have to use any for the parameter value because the type\
    \ unknown does not let us make the function call in line A.\n\n# 23.3.1 Example\
    \ of a user-defined type guard: isArrayWithInstanceof()\n\n+   * This type guard\
    \ for Arrays works similarly to 'Array.isArray()\n* but also checks if all Array\
    \ elements are instances of 'T'.\n* As a consequence, the type of 'arr' is narrowed\
    \ to 'Array<T>'\n* if this function returns 'true'.\n* Warning: This type guard\
    \ can make code unsafe – for example:\n* We could use another reference to 'arr'\
    \ to add an element whose\n* type is not 'T'. Then 'arr' doesn't have the type\
    \ 'Array<T>'"
- md: "\n202\n\n23 Type guards and assertion functions\n\n- * anymore.\n\n```typescript\n\
    function isArrayWithInstancesOf<T>(\n  arr: any, Class: new (...args: any[])=>T\n\
    \  ): arr is Array<T>\n{\n  if (!Array.isArray(arr)) {\n    return false;\n  }\n\
    \  if (arr.every(elem => elem instanceof Class)) {\n    return false;\n  }\n\n\
    // //inferred-type: any[]\narr; // (A)\n\nreturn true;\n}\n```\n\nIn line A, we\
    \ can see that the inferred type of arr is not Array<T>, but our checks ensured\
    \ it is current. That is why we can return true. TypeScript trusts us and narrows\
    \ to Array<T> when we use isArrayWithInstancesOf():\n\n```typescript\nconst value:\
    \ unknown = {};\nif (isArrayWithInstancesOf(value, RegExp)) {\n  // //inferred-type:\
    \ RegExp[]\n  value;\n}\n```\n\n## 23.2 Example of a user-defined type guard:\
    \ isTypeOf()\n\n### 23.2.1 A first attempt\n\nThis is a first attempt to implement\
    \ typeof in TypeScript:\n\n```typescript\n/**\n* An implementation of the `typeof`\
    \ operator.\n */\nfunction isTypeOf<T>(value: unknown, prim: T): value is T {\n\
    \  if (prim === null) {\n    return value === null;\n  }\n  return value !== null\
    \ && (typeof prim) === (typeof value);\n}\n```\n\nIdeally, we'd be able to specify\
    \ the expected type of value via a string (i.e., one of the results of typeof).\
    \ But then we would have to derive the type T from string and it's not immediately\
    \ obvious how to do that (there is a way, as we see soon). As a workaround, we\
    \ specify T via a member prim of T:\n\n```typescript\nconst value: unknown = {};\n\
    ```\n\n## 23.3 User-defined type guards\n\n```typescript\nif (isTypeof(value,\
    \ 123)) {\n  // %inferred-type: number\n  value;\n}\n```\n\n### 23.3.2.2 Using\
    \ overloading\n\nA better solution is to use overloading (several cases are omitted):\n\
    \n```typescript\n/**\n * A partial implementation of the `typeof` operator.\n\
    \ */\nfunction isTypeof(value: any, typeString: 'boolean'): value is boolean;\n\
    function isTypeof(value: any, typeString: 'number'): value is number;\nfunction\
    \ isTypeof(value: any, typeString: 'string'): value is string;\nfunction isTypeof(value:\
    \ any, typeString: string): boolean {\n  return typeof value === typeString;\n\
    }\n```\n\n```typescript\nconst value = unknown {};\nif (isTypeof(value, 'boolean'))\
    \ {\n  // %inferred-type: boolean\n  value;\n}\n```\n\n(This approach is an idea\
    \ by Nick Fisher).\n\n### 23.3.2.3 Using an interface as a map to type map\n\n\
    An alternative is to use an interface as a map from strings to types (several\
    \ cases are omitted):\n\n```typescript\ninterface TypeMap {\n  boolean: boolean;\n\
    \  number: number;\n  string: string;\n}\n```\n\n```typescript\n/**\n * A partial\
    \ implementation of the `typeof` operator.\n */\nfunction isTypeof<T extends keyof\
    \ TypeMap>(value: any, typeString: T) : value is TypeMap[T] {\n  return typeof\
    \ value === typeString;\n}\n```\n\n```typescript\nconst value = unknown {};\n\
    if (isTypeof(value, 'string')) {\n  // %inferred-type: string\n}\n\nvalue;\n```\n\
    \n(This approach is an idea by Ran Lottem.)\n\n## 23.4 Assertion functions\n\n\
    An assertion function checks if its parameter fulfills certain criteria and throws\
    \ an exception if it doesn't. For example, one assertion function supported by\
    \ many languages, assert(cond) throws an exception if the boolean condition cond\
    \ is false.\n\nNode.js, assert is supported by the built-in module assert. The\
    \ following code uses it in line A:\n\n```typescript\nimport assert from 'assert';\n\
    function removeFilename(filename: string) {\n  const dotIndex = filename.lastIndexOf('.');\n\
    \  assert(dotIndex >= 0); // A\n  return filename.slice(0, dotIndex);\n}\n```\n\
    \n### 23.4.1 TypeScript's support for assertion functions\n\nTypeScript's type\
    \ inference provides special support for assertion functions, if we mark such\
    \ functions with assertion signatures as return types. W.r.t. how and what we\
    \ can return from a function, an assertion signature is equivalent to void. However,\
    \ it triggers narrowing.\n\nThere are two kinds of assertion signatures:\n\n-\
    \ Asserting a boolean argument: asserts «cond» \n- Asserting the type of an argument:\
    \ asserts «arg» is «type»\n\n### 23.4.2 Asserting a boolean argument: asserts\
    \ «cond»\n\nIn the following example, the assertion signature condition states\
    \ that the parameter condition must be true. Otherwise, an exception is thrown.\n\
    \n```typescript\nfunction assertTrue(condition: boolean): asserts condition {\n\
    \  if (!condition) {\n    throw new Error();\n  }\n}\n```\n\nThis is how assertTrue()\
    \ causes narrowing:\n\n```typescript\nfunction func(value: unknown) {\n  assertTrue(value\
    \ instanceof Set);\n\n  // %inferred-type: Set<any>\n  value;\n}\n```\n\n## 23.5\
    \ Quick reference: user-defined type guards\n\nWe are using the assertion function\
    \ similarly to a type guard, but instead of a conditional statement, it triggers\
    \ an exception.\n\n### 23.5.1 Asserting the type of an argument: asserts «arg»\
    \ is «type»\n\nIn the following example, the assertion signature states that the\
    \ parameter value must have the type. Otherwise, an exception is thrown.\n\n```typescript\n\
    function isTypeof(value: any, typeString: string): value is boolean {\n  return\
    \ typeof value === typeString;\n}\n```\n\n```typescript\nconst value = unknown\
    \ {};\nif (isTypeof(value, 'string')) {\n  // %inferred-type: string\n  value;\n\
    }\n```\n\n### 23.5.2 Asserting a boolean argument: asserts «cond»\n\nIn the following\
    \ example, the assertion signature condition states that the parameter condition\
    \ must be true. Otherwise, an exception is thrown.\n\n```typescript\nfunction\
    \ assertTrue(condition: boolean): asserts condition {\n  if (!condition) {\n \
    \   throw new Error();\n  }\n}\n```\n\n## 23.6 Alternatives to assertion functions\n\
    \nAn assertion function narrows the type of its argument, but instead of a conditional,\
    \ it narrows the type.\n\n### 23.6.1 Technique: forced conversion\n\nA forced\
    \ conversion function returns an existing value with a new type – for example:\n\
    \n```typescript\nfunction forceNumber(value: unknown): number {\n  if (typeof\
    \ value !== 'number') {\n    throw new TypeError();\n  }\n  return value;\n}\n\
    ```\n\n```typescript\nconst valuea: unknown = 123;\n// %ferred-type: number\n\
    const valueb = forceNumber(valuea);\n\nconst value2: unknown = 'abc';\nassert.throws(()\
    \ => forceNumber(value2));\n```\n\nThe corresponding assertion function looks\
    \ as follows:\n\n```typescript\nfunction assertNumber(value: unknown): asserts\
    \ value is number {\n  if (typeof value != 'number') {\n    throw new TypeError();\n\
    \  }\n}\n```\n\n```typescript\nconst value1: unknown = 123;\nassertNumber(value1);\n\
    // inferred-type: number\nvalue1;\n```\n\n```typescript\nconst value2: unknown\
    \ = 'abc';\nassert.throws(() => assertNumber(value2));\n```\n\nForced conversion\
    \ is a versatile technique with uses beyond those of assertion functions. For\
    \ example, we can convert:\n\n- From an input format (think JSON schema) is easy\
    \ to write\n- From an output format that is easy to work with code.\n\nFor more\
    \ information, see [24.3.5 “External vs. internal representation of data”](24.3.5).\n\
    \n### 23.6.2 Technique: on throwing an exception\n\nConsider the following code:\n\
    \n```typescript\nfunction getLengthValueOf(strMap: Map<string, string>, key: string)\
    \ : number {\n  if (strMap.has(key)) {\n    const value = strMap.get(key);\n\n\
    \    // inferred-type: string | undefined\n    value; // before type check\n\n\
    \    // We know value can't be `undefined'\n    if (value === undefined) { //\
    \ (A)\n      throw new Error();\n    }\n\n    // inferred-type: string\n    value;\
    \ // after type check\n\n    return value.length;\n  }\n}\n```\n\nInstead of the\
    \ if statement that starts in line A, we also could have used an assertion function:\n\
    \n```typescript\nassertNotUndefined(value);\n```\n"
  mdcn: "\n202\n\n23 类型守卫与断言函数\n\n- *  anymore。\n\n```typescript\nfunction isArrayWithInstancesOf<T>(\n\
    \  arr: any, Class: new (...args: any[])=>T\n  ): arr is Array<T>\n{\n  if (!Array.isArray(arr))\
    \ {\n    return false;\n  }\n  if (arr.every(elem => elem instanceof Class)) {\n\
    \    return false;\n  }\n\n// //inferred-type: any[]\narr; // (A)\n\nreturn true;\n\
    }\n```\n\n在行 A 中，我们可以看到 arr 的推断类型不是 `Array<T>`，但我们的检查确保了它是当前的。这就是为什么我们可以返回 `true`。TypeScript\
    \ 信任我们，并在我们使用 `isArrayWithInstancesOf()` 时将类型收窄为 `Array<T>`：\n\n```typescript\n\
    const value: unknown = {};\nif (isArrayWithInstancesOf(value, RegExp)) {\n  //\
    \ //inferred-type: RegExp[]\n  value;\n}\n```\n\n## 23.2 用户定义类型守卫的示例：isTypeOf()\n\
    \n### 23.2.1 第一次尝试\n\n这是在 TypeScript 中实现 `typeof` 的第一次尝试：\n\n```typescript\n/**\n\
    * `typeof` 运算符的实现。\n */\nfunction isTypeOf<T>(value: unknown, prim: T): value\
    \ is T {\n  if (prim === null) {\n    return value === null;\n  }\n  return value\
    \ !== null && (typeof prim) === (typeof value);\n}\n```\n\n理想情况下，我们能够通过字符串指定 value\
    \ 的预期类型（即 `typeof` 的结果之一）。但这样我们就必须从字符串中推导出类型 T，而这并不直观如何如何做到（我们很快就会有一种方法）。作为一种替代方案，我们通过\
    \ T 的一个成员 `prim` 来指定 T：\n\n```typescript\nconst value: unknown = {};\n```\n\n\
    ## 23.3 用户定义类型守卫\n\n```typescript\nif (isTypeof(value, 123)) {\n  // %inferred-type:\
    \ number\n  value;\n}\n```\n\n### 23.3.2.2 使用函数重载\n\n更好的解决方案是使用重载（省略了若干情况）：\n\n\
    ```typescript\n/**\n * `typeof` 运算符的部分实现。\n */\nfunction isTypeof(value: any,\
    \ typeString: 'boolean'): value is boolean;\nfunction isTypeof(value: any, typeString:\
    \ 'number'): value is number;\nfunction isTypeof(value: any, typeString: 'string'):\
    \ value is string;\nfunction isTypeof(value: any, typeString: string): boolean\
    \ {\n  return typeof value === typeString;\n}\n```\n\n```typescript\nconst value\
    \ = unknown {};\nif (isTypeof(value, 'boolean')) {\n  // %inferred-type: boolean\n\
    \  value;\n}\n```\n\n（这种方法是 Nick Fisher 的想法）。\n\n### 23.3.2.3 使用接口作为类型映射的映射\n\n\
    另一种方案是使用接口作为从字符串到类型的映射（省略了若干情况）：\n\n```typescript\ninterface TypeMap {\n  boolean:\
    \ boolean;\n  number: number;\n  string: string;\n}\n```\n\n```typescript\n/**\n\
    \ * `typeof` 运算符的部分实现。\n */\nfunction isTypeof<T extends keyof TypeMap>(value:\
    \ any, typeString: T) : value is TypeMap[T] {\n  return typeof value === typeString;\n\
    }\n```\n\n```typescript\nconst value = unknown {};\nif (isTypeof(value, 'string'))\
    \ {\n  // %inferred-type: string\n}\n\nvalue;\n```\n\n（这种方法是 Ran Lottem 的想法。）\n\
    \n## 23.4 断言函数\n\n断言函数检查其参数是否符合某些标准，如果不符合则抛出异常。例如，许多语言支持的一种断言函数 `assert(cond)`\
    \ 在布尔条件 `cond` 为假时会抛出异常。\n\nNode.js 通过内置的 `assert` 模块支持 `assert`。以下代码在行 A 中使用了它：\n\
    \n```typescript\nimport assert from 'assert';\nfunction removeFilename(filename:\
    \ string) {\n  const dotIndex = filename.lastIndexOf('.');\n  assert(dotIndex\
    \ >= 0); // A\n  return filename.slice(0, dotIndex);\n}\n```\n\n### 23.4.1 TypeScript\
    \ 对断言函数的支持\n\nTypeScript 的类型推断为断言函数提供了特殊支持，如果我们将此类函数的返回类型标记为断言签名。关于我们如何从函数返回以及返回什么，断言签名等同于\
    \ `void`。然而，它会触发类型收窄。\n\n有两种断言签名：\n\n- 断言布尔参数：`asserts «cond»`\n- 断言参数类型：`asserts\
    \ «arg» is «type»`\n\n### 23.4.2 断言布尔参数：asserts «cond»\n\n在下面的示例中，断言签名条件规定参数条件必须为真。否则，将抛出异常。\n\
    \n```typescript\nfunction assertTrue(condition: boolean): asserts condition {\n\
    \  if (!condition) {\n    throw new Error();\n  }\n}\n```\n\n这是 `assertTrue()`\
    \ 导致类型收窄的方式：\n\n```typescript\nfunction func(value: unknown) {\n  assertTrue(value\
    \ instanceof Set);\n\n  // %inferred-type: Set<any>\n  value;\n}\n```\n\n## 23.5\
    \ 快速参考：用户定义类型守卫\n\n我们使用断言函数的方式类似于类型守卫，但不是使用条件语句，而是触发异常。\n\n### 23.5.1 断言参数类型：asserts\
    \ «arg» is «type»\n\n在下面的示例中，断言签名规定参数必须具有该类型。否则，将抛出异常。\n\n```typescript\nfunction\
    \ isTypeof(value: any, typeString: string): value is boolean {\n  return typeof\
    \ value === typeString;\n}\n```\n\n```typescript\nconst value = unknown {};\n\
    if (isTypeof(value, 'string')) {\n  // %inferred-type: string\n  value;\n}\n```\n\
    \n### 23.5.2 断言布尔参数：asserts «cond»\n\n在下面的示例中，断言签名规定布尔条件必须为真。否则，将抛出异常。\n\n```typescript\n\
    function assertTrue(condition: boolean): asserts condition {\n  if (!condition)\
    \ {\n    throw new Error();\n  }\n}\n```\n\n## 23.6 断言函数的替代方案\n\n断言函数收窄参数的类型，但不是通过条件语句，而是通过触发异常。\n\
    \n### 23.6.1 技术：强制转换\n\n强制转换返回一个具有新类型的现有值——例如：\n\n```typescript\nfunction forceNumber(value:\
    \ unknown): number {\n  if (typeof value !== 'number') {\n    throw new TypeError();\n\
    \  }\n  return value;\n}\n```\n\n```typescript\nconst valuea: unknown = 123;\n\
    // %ferred-type: number\nconst valueb = forceNumber(valuea);\n\nconst value2:\
    \ unknown = 'abc';\nassert.throws(() => forceNumber(value2));\n```\n\n对应的断言函数如下：\n\
    \n```typescript\nfunction assertNumber(value: unknown): asserts value is number\
    \ {\n  if (typeof value != 'number') {\n    throw new TypeError();\n  }\n}\n```\n\
    \n```typescript\nconst value1: unknown = 123;\nassertNumber(value1);\n// inferred-type:\
    \ number\nvalue1;\n```\n\n```typescript\nconst value2: unknown = 'abc';\nassert.throws(()\
    \ => assertNumber(value2));\n```\n\n强制转换是一种多功能技术，用途超过了断言函数。例如，我们可以转换：\n\n- 从输入格式（如\
    \ JSON schema）易于编写\n- 从易于代码处理的输出格式\n\n更多信息，请参阅 [24.3.5 “数据的外部与内部表示”](24.3.5)。\n\
    \n### 23.6.2 技术：在抛出异常\n\n考虑以下代码：\n\n```typescript\nfunction getLengthValueOf(strMap:\
    \ Map<string, string>, key: string) : number {\n  if (strMap.has(key)) {\n   \
    \ const value = strMap.get(key);\n\n    // inferred-type: string | undefined\n\
    \    value; // 类型检查之前\n\n    // 我们知道 value 不可能为 `undefined`\n    if (value ===\
    \ undefined) { // (A)\n      throw new Error();\n    }\n\n    // inferred-type:\
    \ string\n    value; // 类型检查之后\n\n    return value.length;\n  }\n}\n```\n\n与其从行\
    \ A 开始的 if 语句，我们也可以使用断言函数：\n\n```typescript\nassertNotUndefined(value);\n```\n"
