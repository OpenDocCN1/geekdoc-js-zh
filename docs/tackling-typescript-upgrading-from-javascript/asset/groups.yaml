  - "[PAGE 18]\n\n# 2.2 The downsides of using TypeScript\n\nalso check for consistency\
    \ and generate type definitions. For more information, see chapter “Type Checking\
    \ JavaScript Files” in the TypeScript handbook.\n\n# 2.1.5 TypeScript makes refactorings\
    \ safer\n\nRefactorings are automated code transformations that many integrated\
    \ development environments offer.\n\nRenaming methods is an example of a refactoring.\
    \ Doing so in plain JavaScript can be tricky because the same name might refer\
    \ to different methods. TypeScript has more information on how methods and types\
    \ are connected, which renaming methods safer.\n\n# 2.1.6 TypeScript can compile\
    \ new features to older code\n\nTypeScript tends to quickly support ECMAScript\
    \ stage 4 features (such features are scheduled to be included in the next ECMAScript\
    \ version). When we compile to JavaScript, the compiler option --target lets us\
    \ specify the ECMAScript version that the output is compatible with. Any incompatible\
    \ feature (that was introduced later) will be compiled to equivalent, compatible\
    \ code.\n\nNote that this kind of support for older ECMAScript versions does not\
    \ require TypeScript or static typing: The JavaScript compiler Babel does it,\
    \ too, but it compiles JavaScript to JavaScript.\n\n# 2.2 The downsides of using\
    \ TypeScript\n\n+   * It is an added layer on top of JavaScript: more complexity,\
    \ more things to learn, etc.\n* It introduces a compilation step when writing\
    \ code.\n* npm packages can only be used if they have static type definitions.\n\
    \  * These days, many packages either come with type definitions or there are\
    \ type definitions available for them DefinitelyTyped. However, especially the\
    \ latter can be slightly wrong, which leads to issues that you don’t have static\
    \ typing.\n* Getting static types is occasionally difficult. My recommendation\
    \ here is to keep things as simple as possible – for example: Don’t overdo generics\
    \ and type variables.\n\n# 2.3 TypeScript myths\n\n# 2.3.1 TypeScript code is\
    \ heavyweight\n\nTypeScript code can be very heavyweight. But it doesn’t have\
    \ to be. For example, due to type inference, we can get away with a few annotations:\n\
    \n```\nfunction selectionSort(arr: number[]) { // (A)\nfor (let i=0; i<arr.length;\
    \ i++) {\n  const minIndex = findIndex(arr, i);\n```"
