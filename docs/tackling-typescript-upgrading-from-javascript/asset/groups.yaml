- md: "\n## 23.1.4 The type unknown\n\nIf a value has the type unknown, we can do\
    \ almost nothing with it and have to narrow the type first (Line A):\n\n```typescript\n\
    function parseStringLiter(stringLiteral: string): string {\n  const result: unknown\
    \ = JSON.parse(stringLiteral);\n  if (typeof result == 'string') { // (A)\n  \
    \  return result;\n  }\n  throw new Error('Not a string literal: ' + stringLiteral);\n\
    }\n```\n\nIn other words: The type is too general and we must narrow it. In a\
    \ way, unknown is also a union type (the union of all types).\n\n## 23.2 Narrowing\
    \ via built-in type guards\n\nAs we have, a type guard is an operation that returns\
    \ either true or false dependent on whether its operand meets certain criteria\
    \ at runtime. TypeScript's type inference supports type guards by narrowing the\
    \ static type of an operand when the result is true.\n\n### 23.2.1 Strict equality\
    \ (===)\n\nStrict equality works as a type guard:\n\n```typescript\nfunction func(value:\
    \ unknown) {\n  if (value === 'abc') {\n    // inferred-type: \"abc\"\n    value;\n\
    \  }\n}\n```\n\nFor some union types, we can use === to differentiate between\
    \ their components:\n\n```typescript\ninterface Book {\n  title: null | string;\n\
    \  isbn: string;\n}\n```\n\n```typescript\nfunction getTitle(book: Book) {\n \
    \ if (book.title === null) {\n    // inferred-type: null\n    book.title;\n  \
    \  return ('Untitled');\n  } else {\n    // inferred-type: string\n    book.title;\n\
    \    return book.title;\n  }\n}\n```\n\n## 23.2 Narrowing via built-in type guards\n\
    \nUsing === for including and !== for excluding a union type component only works\
    \ if that component is a singleton type (a set with one member). The type null\
    \ is a singleton type. Its only member is the value null.\n\n### 23.2.2 typeof,\
    \ instanceof, Array.isArray\n\nThese are three common built-in type guards:\n\n\
    ```typescript\nfunction func(value: Function|Date|number[]) {\n  if (typeof value\
    \ === 'function') {\n    // %inferred-type: Function\n    value;\n  }\n\n  if\
    \ (value instanceof Date) {\n    // %inferred-type: Date\n    value;\n  }\n\n\
    \  if (Array.isArray(value)) {\n    // %inferred-type: number[]\n    value;\n\
    \  }\n}\n```\n\nNote how the static type of value is narrowed inside the then-blocks.\n\
    \n### 23.2.3 Checking for distinct properties via the operator in\n\nIf used to\
    \ check distinct properties, the operator in is a type guard:\n\n```typescript\n\
    type FirstOrSecond =\n  | {first: string}\n  | {second: string};\n```\n\n```typescript\n\
    function func(firstOrSecond: FirstOrSecond) {\n  if ('second' in firstOrSecond)\
    \ {\n    // %inferred-type: { second: string }\n    firstOrSecond;\n  }\n}\n```\n\
    \nNote that the following check would not have worked:\n\n```typescript\nfunction\
    \ func(firstOrSecond: FirstOrSecond) {\n  // @ts-expect-error: 'second' does not\
    \ exist on\n  // type 'FirstOrSecond'...\n  if (firstOrSecond.second !== undefined)\
    \ {\n```\n\n## 23 Type guards and assertion functions\n\n```typescript\n// //\
    \ ...\n}\n```\n\nThe problem in this case is that, without narrowing, we can't\
    \ access property .second of a value whose type is FirstOrSecond.\n\n### 23.2.3.1\
    \ The operator in doesn't narrow non-union types\n\nAlas, operator in only helps\
    \ us with union types:\n\n```typescript\nfunction func(obj: object) {\n  if ('name'\
    \ in obj) {\n    // inferred-type: object\n    obj;\n\n    // //ts-expect-error:\
    \ Property 'name' does not exist on type 'object'\n    obj.name;\n  }\n}\n```\n\
    \n### 23.2.4 Checking the value of a shared property (discriminated unions)\n\n\
    In a discriminated union, the components of a union have one or more properties\
    \ in common whose values are different for each component. Such properties are\
    \ called discriminants.\n\nChecking the value of a discriminant is a type guard:\n\
    \n```typescript\ntype Teacher = { kind: 'Teacher', teacherID: string };\ntype\
    \ Student = { kind: 'Student', studentID: string };\ntype Attendee = Teacher |\
    \ Student;\n\nfunction getId(attendee: Attendee) {\n  switch (attendee.kind) {\n\
    \    case 'Teacher':\n      // inferred-type: kind: \"Teacher\"; teacherID: string;\n\
    \      attendee;\n      return attendee.teacherID;\n    case 'Student':\n    \
    \  // inferred-type: kind: \"Student\"; studentID: string;\n      attendee;\n\
    \      return attendee.studentID;\n    default:\n      throw new Error();\n  }\n\
    }\n```\n\nIn the previous example, .kind is a discriminant: Each components of\
    \ the union Attendee has this property, with a unique value.\n\n## 23.2 Narrowing\
    \ via built-in type guards\n\nAn if statement and equality checks work similarly\
    \ to a switch statement:\n\n```typescript\nfunction getID(attendee: Attendee)\
    \ {\n  if (attendee.kind === 'Teacher') {\n    // inferred-type: { kind: \"Teacher\"\
    ; teacherID: string; }\n    attendee;\n    return attendee.teacherID;\n  } else\
    \ if (attendee.kind === 'Student') {\n    // inferred-type: { kind: \"Student\"\
    ; studentID: string; }\n    attendee;\n    return attendee.studentID;\n  } else\
    \ {\n    throw new Error();\n  }\n}\n```\n\n### 23.2.5 Narrowing dotted names\n\
    \nWe can also narrow the types of properties (even of nested ones that) we access\
    \ via chains of property names:\n\n```typescript\ntype MyType = {\n  prop?: number\
    \ | string;\n};\nfunction func(arg: MyType) {\n  if (typeof arg.prop === 'string')\
    \ {\n    // inferred-type: string\n    arg.prop; // (A)\n  }\n\n  // (Note: The\
    \ OCR text seems to be corrupted here with \".forEach\", \n  // but based on context\
    \ it refers to property access logic)\n  \n  // inferred-type: string\n  arg.prop;\n\
    \n  arg = {};\n\n  // inferred-type: string | number | undefined\n  arg.prop;\
    \ // (C)\n}\n```\n\nLet's look at a few locations in the previous code:\n\n- Line\
    \ A: We narrowed the type.\n- Line B: (Corrupted text)\n- Line C: We narrowed\
    \ the type.\n\n### 23.2.6 Narrowing Array\n\nIf we use every() to check that all\
    \ elements are non-null, every() does not narrow:\n\n```typescript\nconst mixedValues\
    \ = [1, undefined];\n```\n\n(Note: The OCR text for this section was highly fragmented/garbled\
    \ in the source, but follows the logic of TypeScript `every` vs. `NonNullable<T>`.\
    \ I have reconstructed the logical flow present in the text.)\n\n## 23.3 User-defined\
    \ type guards\n\nTypeScript lets us define our own type guards – for example:\n\
    \n```typescript\nfunction isFunction(value: unknown): value is Function {\n  return\
    \ typeof value === 'function';\n}\n```\n\nThe return value of Function is a type\
    \ predicate. It is part of the type signature of isFunction():\n\n```typescript\n\
    // inferred-type: (value: unknown) => value is Function\nisFunction();\n```\n\n\
    A user-defined guard must always return booleans. If isFunction(x) returns true,\
    \ TypeScript narrows the type of the actual argument x to:\n\n```typescript\n\
    function func(arg: unknown) {\n  if (isFunction(arg)) {\n    // inferred-type:\
    \ Function\n    arg; // type is narrowed\n  }\n}\n```\n\nNote that TypeScript\
    \ doesn't know how we compute the result of a user-defined guard. It gives us\
    \ a lot of freedom w.t. the checks we use. For example, we could implement isFunction()\
    \ as follows:\n\n```typescript\nfunction isFunction(value: any): value is Function\
    \ {\n  try {\n    value(); // (A)\n    return true;\n  } catch {\n    return false;\n\
    \  }\n}\n```\n\nAs we have to use any for the parameter value because the type\
    \ unknown does not let us make the function call in line A.\n\n### 23.3.1 Example\
    \ of a user-defined type guard: isArrayWithInstanceof()\n\n- This type guard for\
    \ Arrays works similarly to 'Array.isArray()' but also checks if all Array elements\
    \ are instances of 'T'.\n- As a consequence, the type of 'arr' is narrowed to\
    \ 'Array<T>' if this function returns 'true'.\n- Warning: This type guard can\
    \ make code unsafe – for example: We could use another reference to 'arr' to add\
    \ an element whose type is not 'T'. Then 'arr' doesn't have the type 'Array<T>'.\n"
  mdcn: "\n\n## 23.1.4 unknown 类型\n\n如果一个值的类型为 `unknown`，我们几乎无法对它大做任何操作，必须先收窄类型（A\
    \ 行）：\n\n```typescript\nfunction parseStringLiter(stringLiteral: string): string\
    \ {\n  const result: unknown = JSON.parse(stringLiteral);\n  if (typeof result\
    \ == 'string') { // (A)\n    return result;\n  }\n  throw new Error('Not a string\
    \ literal: ' + stringLiteral);\n}\n```\n\n换句话说：类型太通用了，我们必须收窄它。在某种程度上，`unknown`\
    \ 也是一种联合类型（所有类型的联合类型）。\n\n## 23.2 通过内置类型守卫收窄\n\n正如我们所看到的，类型守卫（type guard）是一种操作，根据操作数在运行时是否符合某些标准来返回\
    \ true 或 false。TypeScript 的类型推断支持类型守卫，在结果为 true 时通过缩小操作数的静态类型来提供支持。\n\n### 23.2.1\
    \ 严格相等 (===)\n\n严格相等可以作为类型守卫工作：\n\n```typescript\nfunction func(value: unknown)\
    \ {\n  if (value === 'abc') {\n    // 推断类型: \"abc\"\n    value;\n  }\n}\n```\n\
    \n对于某些联合类型，我们可以使用 `===` 来区分它们的各个组件：\n\n```typescript\ninterface Book {\n  title:\
    \ null | string;\n  isbn: string;\n}\n```\n\n```typescript\nfunction getTitle(book:\
    \ Book) {\n  if (book.title === null) {\n    // 推断类型: null\n    return 'Untitled';\n\
    \  } else {\n    // 推断类型: string\n    return book.title;\n  }\n}\n```\n\n## 23.2\
    \ 通过内置类型守卫收窄类型\n\n使用 `===` 包含、`!==` 排除联合类型组件仅当该组件是单例类型（只有一个成员的类型）时才有效。`null` 类型的唯一成员是\
    \ `null`。\n\n### 23.2.2 typeof, instanceof, Array.isArray\n\n这些是常见的内置类型守卫：\n\n\
    ```typescript\nfunction func(value: Function|Date|number[]) {\n  if (typeof value\
    \ === 'function') {\n    // 推断类型: Function\n    value;\n  }\n\n  if (value instanceof\
    \ Date) {\n    // 推断类型: Date\n    value;\n  }\n\n  if (Array.isArray(value)) {\n\
    \    // 推断类型: number[]\n    value;\n  }\n}\n```\n\n注意 `value` 的静态类型在 `if` 块内部是如何收窄的。\n\
    \n### 23.2.3 通过 in 检查不同属性\n\n如果用于检查不同属性，`in` 操作符是一个类型守卫：\n\n```typescript\ntype\
    \ FirstOrSecond =\n  | { first: string }\n  | { second: string };\n\nfunction\
    \ func(firstOrSecond: FirstOrSecond) {\n  if ('second' in firstOrSecond) {\n \
    \   // 推断类型: { second: string }\n    firstOrSecond;\n  }\n}\n```\n\n注意以下检查将不起：\n\
    \n```typescript\nfunction func(firstOrSecond: FirstOrSecond) {\n  // @ts-expect-error:\
    \ 'second' 不存在于类型 'FirstOrSecond'\n  if (firstOrSecond.second !== undefined) {\n\
    \    // ...\n  }\n}\n```\n\n在这种情况下，问题在于如果没有收窄，我们无法访问类型为 `FirstOrSecond` 的值的 `.second`\
    \ 属性。\n\n### 23.2.3.1 in 操作符无法收窄联合类型\n\n遗憾的是，`in` 操作符只能帮助处理对象类型：\n\n```typescript\n\
    function func(obj: object) {\n  if ('name' in obj) {\n    // 推断类型: object\n  \
    \  obj;\n\n    // @ts-expect-error: 属性 'name' 不存在于类型 'object'\n    obj.name;\n\
    \  }\n}\n\n## 23.2.4 检查共享属性（判别联合类型）\n\n在判别联合类型（discriminated unions）中，联合类型具有一个或多个值不同的属性。此类属性被称为判符（discriminants）。\n\
    \n检查判符的值是一个类型守卫：\n\n```typescript\ntype Teacher = { kind: 'Teacher'; teacherID:\
    \ string };\ntype Student = { kind: 'Student'; studentID: string };\ntype Attendee\
    \ = Teacher | Student;\n\nfunction getId(attendee: Attendee) {\n  switch (attendee.kind)\
    \ {\n    case 'Teacher':\n      // 推断类型: kind: \"Teacher\"; teacherID: string;\n\
    \      attendee;\n      return attendee.teacherID;\n    case 'Student':\n    \
    \  // 推断类型: kind: \"Student\"; studentID: string;\n      attendee;\n      return\
    \ attendee.studentID;\n    default:\n      throw new Error();\n  }\n}\n```\n\n\
    在之前的例中，`.kind` 是一个判符：联合类型 `Attendee` 的每个组件都有这个属性，且具有唯一的值。\n\n## 23.2 通过内置类型守卫收窄\n\
    \n`if` 语句和相等检查的工作与 `switch` 语句类似：\n\n```typescript\nfunction getID(attendee: Attendee)\
    \ {\n  if (attendee.kind === 'Teacher') {\n    // 推断类型: { kind: \"Teacher\"; teacherID:\
    \ string; }\n    attendee;\n    return attendee.teacherID;\n  } else if (attendee.kind\
    \ === 'Student') {\n    // 推断类型: { kind: \"Student\"; studentID: string; }\n \
    \   attendee;\n    return attendee.studentID;\n  } else {\n    throw new Error();\n\
    \  }\n}\n```\n\n### 23.2.5 点符号名称收窄\n\n我们还可以通过属性名链收窄属性（甚至是嵌套属性）的类型：\n\n```typescript\n\
    type MyType = {\n  prop?: number | string;\n};\nfunction func(arg: MyType) {\n\
    \  if (typeof arg.prop === 'string') {\n    // 推断类型: string\n    arg.prop; //\
    \ (A)\n  }\n\n  // (注意：OCR 文本在这里似乎被 \".forEach\" 损坏了，\n  // 但根据上下文指的是属性访问逻辑)\n\
    \  \n  // 推断类型: string\n  arg.prop;\n\n  arg = {};\n\n  // 推断类型: string | number\
    \ | undefined\n  arg.prop; // (C)\n}\n```\n\n让我们看看之前代码中的几个位置：\n\n- A 行：我们收窄了类型。\n\
    - B 行：（文本文本）\n- C 行：我们收窄了类型。\n\n### 23.2.6 收窄数组\n\n如果我们使用 `every()` 来检查所有元素是否非空，`every()`\
    \ 不会收窄类型：\n\n```typescript\nconst mixedValues = [1, undefined];\n```\n\n（注意：该部分的\
    \ OCR 文本是高度碎片/混乱的，但遵循 TypeScript `every` 与 `NonNullable<T>` 的逻辑。）\n\n## 23.3 自定义类型守卫\n\
    \nTypeScript 允许我们定义自己的类型守卫——例如：\n\n```typescript\nfunction isFunction(value: unknown):\
    \ value is Function {\n  return typeof value === 'function';\n}\n```\n\n`isFunction`\
    \ 的返回值是一个类型谓言。它是 `isFunction()` 类型签名的一部分：\n\n```typescript\n// 推断类型: (value: unknown)\
    \ => value is Function\nisFunction();\n```\n\n自定义类型守卫必须返回布尔值。如果 `isFunction(x)`\
    \ 返回 true，TypeScript 会将实际参数 `x` 的类型收窄为：\n\n```typescript\nfunction func(arg: unknown)\
    \ {\n  if (isFunction(arg)) {\n    // 推断类型: Function\n    arg; // 类型收窄了\n  }\n\
    }\n```\n\n注意 TypeScript 并不知道我们是如何计算自定义类型守卫的结果的。它在我们使用的检查方法上提供了很大的自由度。例如，我们可以这样实现\
    \ `isFunction`：\n\n```typescript\nfunction isFunction(value: any): value is Function\
    \ {\n  try {\n    value(); // (A)\n  return true;\n  } catch {\n    return false;\n\
    \  }\n}\n```\n\n我们必须对参数值使用 `any`，因为 `unknown` 类型不允许我们在 A 行中进行函数调用。\n\n### 23.3.1\
    \ 自定义类型守卫示例：isArrayWithInstanceof()\n\n- 这种数组的类型守卫工作原理类似于 `Array.isArray()`，但它还会检查所有数组元素是否为\
    \ `T` 的实例。\n- 因此，如果该函数返回 `true`，`arr` 的类型将被收窄为 `Array<T>`。\n- 警告：这种类型守卫可能会导致不安全——例如：我们可以使用\
    \ `arr` 的另一个引用添加不是 `T` 的元素。那么 `arr` 就不具有 `Array<T>` 类型。\n\n"
