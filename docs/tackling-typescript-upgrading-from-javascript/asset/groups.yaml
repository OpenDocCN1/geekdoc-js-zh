    \n```typescript\ntype Class2<T> = Function & {prototype: T};\n\nconst shapeClasses2:\
    \ Array<Class2<Shape>> = [Circle, Shape];\n```\n\n这种方法的缺点：\n\n- 稍微稍显困惑。\n- 具有此类型的值不能用于\
    \ `instanceof` 检查（作为右侧操作数）。\n\n## 第 20 章\n\n## 数组类型化\n\n目录\n- 20.1 数组的角色 167\n\
