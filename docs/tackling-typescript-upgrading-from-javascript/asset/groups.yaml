    ### 2.1.5 TypeScript makes refactorings safer\n\nRefactorings are automated code\
    \ transformations that many integrated development environments offer.\n\nRenaming\
    \ methods is an example of a refactoring. Doing so in plain JavaScript can be\
    \ tricky because the same name might refer to different methods. TypeScript has\
    \ more information on how methods and types are connected, which renaming methods\
    \ safer.\n\n### 2.1.6 TypeScript can compile new features to older code\n\nTypeScript\
    \ tends to quickly support ECMAScript stage 4 features (such features are scheduled\
    \ to be included in the next ECMAScript version). When we compile to JavaScript,\
    \ the compiler option --target lets us specify the ECMAScript version that the\
    \ output is compatible with. Any incompatible feature (that was introduced later)\
    \ will be compiled to equivalent, compatible code.\n\nNote that this kind of support\
    \ for older ECMAScript versions does not require TypeScript or static typing:\
    \ The JavaScript compiler Babel does it, too, but it compiles JavaScript to JavaScript.\n\
    \n## 2.2 The downsides of using TypeScript\n\n- It is an added layer on top of\
    \ JavaScript: more complexity, more things to learn, etc.\n- It introduces a compilation\
    \ step when writing code.\n- npm packages can only be used if they have static\
    \ type definitions.\n- These days, many packages either come with type definitions\
    \ or there are type definitions available for them DefinitelyTyped. However, especially\
    \ the latter can be slightly wrong, which leads to issues that you don’t have\
    \ static typing.\n- Getting static types is occasionally difficult. My recommendation\
    \ here is to keep things as simple as possible – for example: Don’t overdo generics\
    \ and type variables.\n\n## 2.3 TypeScript myths\n\n### 2.3.1 TypeScript code\
    \ is heavyweight\n\nTypeScript code can be very heavyweight. But it doesn’t have\
    \ to be. For example, due to type inference, we can get away with a few annotations:\n\
    \n```\nfunction selectionSort(arr: number[]) { // (A)\nfor (let i=0; i<arr.length;\
    \ i++) {\n  const minIndex = findIndex(arr, i);\n  [arr[i], arr[minIndex]] = [arr[minIndex],\
    \ arr[i]]; // swap\n}\n```\n\n```\nfunction findMinIndex(arr: number[], startIndex:\
    \ number) { // (B)\nlet minValue = arr[startIndex];\nlet minIndex = startIndex;\n\
    for (let i=startIndex+1; i < arr.length; i++) {\n  const currentValue = arr[i];\n\
    \  if (currentValue < minValue) {\n    minValue = currentValue;\n    minIndex\
    \ = i;\n  }\n}\nreturn minIndex;\n}\n\nconst arr = [4, 2, 6, 3, 1, 5];\nselectionSort(arr);\n\
    asert.deepEqual(arr, [1, 2, 3, 4, 5, 6]);\n```\n\nThe only locations where TypeScript\
    \ code is different from JavaScript code, are line A and line B.\n\nThere are\
    \ a variety of styles in which TypeScript is written:\n\n- In an object-oriented\
    \ programming (OOP) style with classes and OOP patterns\n- In a functional programming\
    \ (FP) style with functional patterns\n- In a mix of OOP and FP\n- And so on\n\
    \n### 2.3.2 TypeScript is an attempt to replace JavaScript with C# or Java\n\n\
    Initially, TypeScript invented a few language constructs of its own (e.g. enums).\
    \ But since ECMAScript 6, it mostly stuck with being a strict superset of JavaScript.\n\
    \nMy impression is that the TypeScript team likes JavaScript and doesn't want\
    \ to replace it with something “better” (which is the goal of, e.g., Dart). They\
    \ do want to make possible to statically type as much JavaScript code as possible.\
    \ Many new TypeScript features are driven by that desire.\n\n## Chapter 3\n\n\
    ## Free resources on TypeScript\n\nBook on JavaScript:\n\n- If you see a JavaScript\
    \ feature in this book that you don't understand, you can look it up in my book\
    \ \"JavaScript for impatient programmers\" which is free to read online. Some\
    \ of the \"Further reading\" sections at the ends of chapters refer to this book.\n\
    \nBooks on TypeScript:\n\n- \"TypeScript Handbook\" is a good reference for the\
    \ language. I see \"Tackling TypeScript\" as complementary to that book.\n- \"\
    TypeScript Deep Dive\" by Basarat Ali Syed\n\nMore material:\n\n- \"TypeScript\
    \ Language Specification\" explains the lower levels of the language.\n- Marius\
    \ Schulz publishes blog posts on TypeScript and the email newsletter \"TypeScript\
    \ Weekly\".\n- The TypeScript repository has type definitions for the complete\
    \ ECMAScript standard library. Reading them is an easy way of practicing TypeScript's\
    \ type notation.\n\n## Part II\n\n## Getting started with TypeScript\n\n## Chapter\
    \ 4\n\n## How does TypeScript work? The bird’s eye view\n\n- Contents\n4.1 The\
    \ structure of TypeScript projects . . . . . . . . . . 23\n4.1.1 tsconfig.json\
    \ . . . . . . . . . . . . . . . . . . . 24\n4.2 Programming TypeScript via an\
    \ integrated development environment (IDE) . . . . . . . . . . . . . . . . 24\n\
    4.3 Other files produced by the TypeScript compiler . . . . . . . . . . . . .\
    \ . 25\n4.3.1 In order to use npm packages from TypeScript, we need type information\
    \ . . . . . . . . . . . . . . . . . . . . . . . . . . 25\n4.4 Using the TypeScript\
    \ compiler for plain JavaScript files . . . . . . . 26\n\nThis chapter gives the\
    \ bird’s eye view of how TypeScript works: What is the structure of a typical\
    \ TypeScript project? What is compiled and how? How can we use IDEs to write TypeScript?\n\
    \n### 4.1 The structure of TypeScript projects\n\nThis is one possible file structure\
    \ for TypeScript projects:\n\n```\ntypescript-project/\ndist/\nts/\nsrc/\nmain.ts\n\
    util.ts\ntest/\nutil_test.ts\ntsconfigconfig.json\n```\n\nExplanations:\n\n- Directory\
    \ ts/ contains the TypeScript files:\n- Subdirectory ts/src/ contains the actual\
    \ code.\n- Subdirectory ts/test/ contains tests for the code.\n- Directory dist/\
    \ is the output of the compiler in ts/\n- The TypeScript compiler compiles TypeScript\
    \ files in ts/ to JavaScript files in dist/. For example:\n- ts/src/main.js is\
    \ compiled to dist/src/main.js (and possibly other files)\n- tsconfig.json is\
    \ used to configure the TypeScript compiler.\n\n### 4.1.1 tsconfig.json\n\nThe\
    \ contents of tsconfig.json look as follows:\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    \"rootDir\": \"ts\",\n    \"outDir\": \"dist\",\n    \"module\": \"commonjs\"\
    ,\n    ...\n  }\n}\n```\n\nWe have specified:\n\n- The root directory of the TypeScript\
    \ code is ts/.\n- The directory where the TypeScript compiler saves its output\
    \ is dist/.\n- The module format of the output files is CommonJS.\n\n### 4.2 Programming\
    \ TypeScript via an integrated development environment (IDE)\n\nTwo popular IDEs\
    \ for JavaScript are:\n\n- Visual Studio Code (free)\n- WebStorm (for purchase)\n\
    \nThe observations in this section are about Visual Studio Code, but may apply\
    \ to other IDEs, too.\n\nOne important fact to be aware of is Visual Studio Code\
    \ processes TypeScript source in two independent ways:\n\n- Checking open files\
    \ for errors: This is done via so-called language server. Language servers exist\
    \ independently of particular editors and provide Studio Code with language-related\
    \ services: refactoring, completions, etc. Communication with servers happens\
    \ via a protocol that is based on JSON-RPC (RPC for remote procedure calls). The\
    \ independence provided by that protocol means servers can be written in almost\
    \ any language.\n- Important fact to remember: The language server only analyzes\
    \ TypeScript, it doesn't compile.\n\n### 4.3 Other files produced by the TypeScript\
    \ compiler\n\n- Building (compiling TypeScript files to JavaScript files): Here,\
    \ we have two choices.\n  - We can run a build tool via external command line.\
    \ For example, the TypeScript compiler tsc has a watch mode that watches input\
    \ files and compiles them to output files. As a consequence, whenever we save\
    \ a TypeScript file in the IDE, we immediately get the corresponding output(s).\n\
    \  - We can run tsc from within Studio Code. In order to do so, it must be installed\
    \ inside every project that we are working on or globally (via npm manager). For\
    \ more information on compiling TypeScript from within Studio Code, see the official\
    \ documentation for that IDE.\n\nGiven a TypeScript file main.ts, the TypeScript\
    \ compiler can produce several kinds of artifacts. The most common ones are:\n\
    \n- JavaScript file: main.js\n- Declaration file: main.d.ts (contains type information;\
    \ .ts files minus the JavaScript code)\n- Source map file: main.js.map\n\nA source\
    \ map specifies for each part of the output code in main.js, which part of the\
    \ input code main.ts produced it. Other things, this information enables runtime\
    \ environments to execute JavaScript code, while showing the line numbers of the\
    \ TypeScript code in error messages.\n\n### 4.3.1 In order to use npm packages\
    \ from TypeScript, we need type-information\n\nThe npm registry is a huge repository\
    \ of JavaScript code. If we want to use a JavaScript package from TypeScript,\
    \ we need type information for:\n\n- The package itself may include .d.ts files\
    \ or even the complete TypeScript code.\n- If it doesn't, we may still be able\
    \ to use it: DefinitelyTyped is a repository of declaration files that people\
    \ have written for plain JavaScript packages.\n\nThe declaration files of DefinitelyTyped\
    \ reside in the @types namespace. Therefore, we need a declaration file for a\
    \ package such as lodash, we have to install the package @types/lodash.\n"
