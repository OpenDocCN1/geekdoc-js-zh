    \ WithoutProperties = {}; // OK\n```\n\n### 16.4.7.5 Allowing excess properties\
    \ in object literals\n\nIf we want to allow excess properties in object literals?\
    \ As an example, consider interface Point and function computeDistance1():\n\n\
