    \n```typescript\n// @ts-error: Argument of type '{ x: number; y: number; z: number;\
    \ }\n is not assignable to parameter of type 'Point'.\n// 对象字面量只能指定已知属性，且 'z'\n\
    // 不在类型 'Point' 中。(2345)\ncomputeDistance({ x: 1, y: 2, z: 3 }); // error\n```\n\
