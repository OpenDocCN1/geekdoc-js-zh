    \ : T;\n\n// %inferred-type: \"a\" | \"b\"\ntype Result1 = Exclude<1 | 'a' | 2\
    \ | 'b', number>;\n\n// %inferred-type: 1 | 2\ntype Result2 = Exclude<1 | 'a'\
    \ | 2 | 'b', 1 | 'c'>;\n```\n\n```typescript\n/** Extract from T those types that\
    \ are assignable to U */\ntype Extract<T, U> = T extends U ? T : never;\n\n//\
    \ %inferred-type: 1 | 2\ntype Result1 = Extract<1 | 'a' | 2 | 'b', number>\n\n\
    // %inferred-type: 1 | \"b\"\ntype Result2 = Extract<1 | 'a' | 2 | 'b', 1 | 'c'>;\n\
    ```\n\n```typescript\ntype LiteralName<T> =\n  T extends undefined ? \"undefined\"\
    \ :\n  T extends null ? \"null\" :\n  T extends boolean ? \"boolean\" :\n  T extends\
    \ number ? \"number\" :\n  T extends bigint ? \"bigint\" :\n  T extends string\
    \ ? \"string\" :\n  never;\n\n// %inferred-type: \"bigint\"\ntype Result1 = LiteralName<123n>;\n\
    // %inferred-type: \"string\" | \"number\" | \"boolean\"\ntype Result2 = LiteralName<true\
    \ | 'a'>;\n```\n\n```typescript\n// %inferred-type: { a: number; b: number; c:\
    \ number }\ntype Result = {\n  [K in 'a' | 'b' | 'c']: number;\n};\n```\n\n```typescript\n\
    /** From T, pick a set of properties whose keys are in the union */\ntype Pick<T,\
    \ K> = {\n  [P in K]: T[P]\n};\n```\n\n```typescript\n/** Construct a type with\
    \ the properties of T except for those in K */\ntype Omit<T, K> = {\n  [P in Exclude<keyof\
    \ T, K>]?: any;\n};\n```\n"
  mdcn: "\n\n# 25 带类型的计算概述\n\n```\ntype Wrap<T> = T extends { length: number } ? [T]\
    \ : T;\n```\n\n```typescript\n// %inferred-type: [string]\ntype A = Wrap<string>;\n\
    ```\n\n```typescript\n// %inferred-type: RegExp\ntype B = Wrap<RegExp>;\n```\n\
    \n## 25.4.1.2 示例：检查可赋值性\n\n我们可以使用条件类型来实现可赋值性检查：\n\n```\ntype IsAssignableTo<A,\
    \ B> = A extends B ? true : false;\n```\n\n```typescript\n// 类型 `123` 可赋值给类型 `number`\n\
    // %inferred-type: true\ntype Result1 = IsAssignableTo<123, number>;\n```\n\n\
    ```typescript\n// 类型 `number` 不可给类型 `123`\n// %inferred-type: false\ntype Result2\
    \ = IsAssignableTo<number, 123>;\n```\n\n关于类型关系可赋值性的信息，请参阅 §11 “什么是 TypeScript\
    \ 中的类型？两个视角”。\n\n## 25.4.1.3 条件类型是分发的\n\n条件类型是分发式的：将条件类型 C 应用于联合类型 U，等同于将 C 应用于\
    \ U 的每一个组件。以下是该示例：\n\n```\ntype Wrap<T> = T extends { length: number } ? [T] :\
    \ T;\n```\n\n```typescript\n// %inferred-type: [boolean] | [number[]]\ntype C1\
    \ = Wrap<boolean | string | number>;\n```\n\n```typescript\n// 等同于：\ntype C2 =\
    \ Wrap<boolean> | Wrap<string> | Wrap<number>;\n```\n\n换句话说，分发性允许我们“遍历”联合类型的各个组件。这是分发性的另一个例子：\n\
    \n```\ntype AlwaysWrap<T> = T extends any ? [T] : [T];\n```\n\n```typescript\n\
    // %inferred-type: [\"a\"] | [\"d\"] | [{ a: 1 } & { b: 2 }]\ntype Result = AlwaysWrap<'a'\
    \ | { a: 1 } & { b: 2 } | 'd'>;\n```\n\n## 25.4.1.4 在分发式条件类型中，我们使用 never 来忽略某些内容\n\
    \n如果视为集合，类型 `never` 是空的。因此，如果它出现在联合类型中，它会被忽略：\n\n```typescript\n// %inferred-type:\
    \ \"a\" | \"b\"\ntype Result = 'a' | 'b' | never;\n```\n\n我们可以使用 `never` 来忽略联合类型的组件：\n\
    \n```typescript\ntype DropNumbers<T> = T extends number ? never : T;\n\n// %inferred-type:\
    \ \"a\" | \"b\"\ntype Result1 = DropNumbers<1 | 'a' | 2 | 'b'>;\n```\n\n当使用 then\
    \ 分支和 else 分支的表达式时，会发生这种情况：\n\n```\ntype KeepNumbers<T> = T extends number ? T\
    \ : never;\n\n// %inferred-type: 1 | 2\ntype Result2 = KeepNumbers<1 | 'a' | 2\
    \ | 'b'>;\n```\n\n## 25.4.1.5 内置工具类型：Exclude<T, U>\n\n从联合类型中排除项是一个非常常见的操作，因此 TypeScript\
    \ 提供了内置的工具类型 `Exclude<T, U>`：\n\n```typescript\n/** 从 T 中排除所有可赋值给 U 的类型 */\ntype\
    \ Exclude<T, U> = T extends U ? never : T;\n\n// %inferred-type: \"a\" | \"b\"\
    \ntype Result1 = Exclude<1 | 'a' | 2 | 'b', number>;\n\n// %inferred-type: 1 |\
    \ 2\ntype Result2 = Exclude<1 | 'a' | 2 | 'b', 1 | 'c'>;\n```\n\n## 25.4.1.6 内置工具类型：Extract<T,\
    \ U>\n\n`Exclude<T>` 的反操作：\n\n```typescript\n/** 从 T 中提取所有可赋值给 U 的类型 */\ntype\
    \ Extract<T, U> = T extends U ? T : never;\n\n// %inferred-type: 1 | 2\ntype Result1\
    \ = Extract<1 | 'a' | 2 | 'b', number>\n\n// %inferred-type: 1 | \"b\"\ntype Result2\
    \ = Extract<1 | 'a' | 2 | 'b', 1 | 'c'>;\n```\n\n## 25.4.1.7 链式条件类型\n\n类似于 JavaScript\
    \ 的三元运算符，我们也可以链用 TypeScript 的条件类型运算符：\n\n```\ntype LiteralName<T> =\n  T extends\
    \ undefined ? \"undefined\" :\n  T extends null ? \"null\" :\n  T extends boolean\
    \ ? \"boolean\" :\n  T extends number ? \"number\" :\n  T extends bigint ? \"\
    bigint\" :\n  T extends string ? \"string\" :\n  never;\n\n// %inferred-type:\
    \ \"bigint\"\ntype Result1 = LiteralName<123n>;\n// %inferred-type: \"string\"\
    \ | \"number\" | \"boolean\"\ntype Result2 = LiteralName<true | 'a'>;\n```\n\n\
    ## 25.4.2 映射类型\n\n*映射类型*（mapped type）通过遍历键的集合来生成对象——例如：\n\n```typescript\n// %inferred-type:\
    \ { a: number; b: number; c: number }\ntype Result = {\n  [K in 'a' | 'b' | 'c']:\
    \ number;\n};\n```\n\n该运算符是映射类型的关键部分：它指定了字面量对象的键。\n\n## 25.4.2.1 内置工具类型：Pick<T,\
    \ K>\n\n以下内置工具类型通过指定现有对象的某些属性来创建一个新对象：\n\n```typescript\n/** 从 T 中选取键在联合类型 K 中的属性集\
    \ */\ntype Pick<T, K> = {\n  [P in K]: T[P]\n};\n```\n\n它的用法如下：\n\n```typescript\n\
    ObjectLiteral = {\n  a: 1,\n  b: 2,\n  c: 3,\n  d: 4,\n};\n```\n\n## 25.4.2.2\
    \ 内置工具类型：Omit<T, K>\n\n内置工具类型通过指定现有对象的某些属性来创建一个新对象：\n\n```typescript\n/** 构造一个类型\
    \ T，除了 K 中的属性 */\ntype Omit<T, K> = {\n  [P in Exclude<keyof T, K>]?: any;\n};\n\
    ```\n\n解释：\n- `K extends keyof T` 意味着 K 是 T 所有键的子类型。\n- `Exclude<T, K>` 意味着：取\
    \ T 的键并移除 K 中提到的键。\n\n## 25.5.1 索引运算符\n\n我们已经遇到过 `keyof` 运算符。它列出了对象类型的键：\n\n```typescript\n\
    type Obj = {\n  a: number;\n  b: number;\n  c: number;\n  d: number;\n}\n```\n\
    \n将 `keyof` 应用于元组类型的结果可能令人意外：KeysOfObj 包含类型 `number`，因为在 JavaScript 中键是字符串集合。元组也支持索引访问：\n\
    \n```typescript\ntype Tuple = ['a', 'b', 'c', 'd'];\n```\n\n```typescript\n//\
    \ %inferred-type: \"a\" | \"b\"\ntype Elements = Tuple[0 | 1];\n```\n\n括号运算符也是分发的：\n\
    \n```typescript\ntype MyType = { prop: 1 } | { prop: 2 } | { prop: 3 };\n```\n\
    \n```typescript\n// %inferred-type: 1 | 2 | 3\ntype Result1 = MyType['prop'];\n\
    ```\n\n```typescript\n// 等同于：\ntype Result2 = {\n{ prop: 1 }['prop'] |\n{ prop:\
    \ 2 }['prop'] |\n{ prop: 3 }['prop']\n};\n```\n\n## 25.5.2 索引访问运算符 T[K]\n\n索引访问运算符\
    \ `T[K]` 返回 T 中所有键属于 K 的属性类型。`T[K]` 也称为查找类型（lookup type）。这些是运算符使用的示例：\n\n```typescript\n\
    type Obj = {\n  0: 'a',\n  1: 'b',\n  prop0: 'c',\n  prop1: 'd'\n};\n```\n\n```typescript\n\
    // %inferred-type: \"a\" | \"b\"\ntype Result1 = Obj[0 | 1];\n```\n\n```typescript\n\
    // %inferred-type: \"c\" | \"d\"\ntype Result2 = Obj['prop0' | 'prop1'];\n```\n\
    \n## 25.5 其他运算符\n\n```typescript\n// %inferred-type: \"a\" | \"b\" | \"c\" | \"\
    d\"\ntype Result3 = Obj[keyof Obj];\n```\n\n括号中的类型必须可赋值给所有属性键（keyof）。这就是为什么 `Obj[number]`\
    \ 和 `Obj[string]` 是不允许的。然而，如果索引类型具有索引签名（A 行），我们可以使用 `number` 和 `string` 索引类型：\n\
    \n```typescript\ntype Obj = {\n  [key: string]: RegExp, // (A)\n};\n```\n\n```typescript\n\
    // %inferred-type: string | number\ntype KeysOfObj = keyof Obj;\n```\n\n```typescript\n\
    // %inferred-type: RegExp\ntype ValuesOfObj = Obj[string];\n```\n\nKeysOfObj 包含类型\
    \ `number`，因为在 JavaScript 中键是字符串集合。元组也支持索引访问：\n\n```typescript\ntype Tuple = ['a',\
    \ 'b', 'c', 'd'];\n```\n\n```typescript\n// %inferred-type: \"a\" | \"b\"\ntype\
    \ Elements = Tuple[0 | 1];\n```\n\n括号运算符也是分发的：\n\n```typescript\ntype MyType =\
    \ { prop: 1 } | { prop: 2 } | { prop: 3 };\n```\n\n```typescript\n// %inferred-type:\
    \ 1 | 2 | 3\ntype Result1 = MyType['prop'];\n```\n\n```typescript\n// 等同于：\ntype\
    \ Result2 = {\n{ prop: 1 }['prop'] |\n{ prop: 2 }['prop'] |\n{ prop: 3 }['prop']\n\
    };\n```\n\n如果我们记住 A & B 拥有 A 和 B 的所有属性，这是合理的。A & B 拥有 B 的属性。\n\n## 25.5.3 typeof\
    \ 运算符\n\n我们已经遇到了 `keyof` 运算符。`typeof` 将 JavaScript 值转换为 TypeScript 类型：\n\n```typescript\n\
    const str = \"abc\";\n```\n\n```typescript\n// %inferred-type: string\ntype Result\
    \ = typeof str;\n```\n\n"
