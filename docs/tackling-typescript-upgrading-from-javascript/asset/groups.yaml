  - "[PAGE 27]\n\n# 4.4 Using the TypeScript compiler for plain JavaScript files\n\
    \nThe TypeScript compiler can also process JavaScript files:\n\n+   * With the\
    \ option --allowJS,the TypeScript compiler copies JavaScript files in the input\
    \ directory over to the output directory. Benefit: migrating from JavaScript to\
    \ TypeScript, we can start with a mix of JavaScript and TypeScript files and slowly\
    \ convert more JavaScript files to TypeScript.\n* With the option --checkJS, the\
    \ compiler additionally adds type-checks JavaScript files (--allowJS must be on\
    \ for this option to work). It does so as well as it can, given the limited information\
    \ that is available. Which files are checked can be configured via comments inside:\n\
    \    * Explicit excluding: If a JavaScript file contains the // @ts-nocheck, it\
    \ will not be type-checked.\n    * Explicit including: Without --checkJS, the\
    \ comment // @ts-check can be used to type-check individual JavaScript files.\n\
    * The TypeScript compiler uses static type information that is specified via JSDoc\
    \ comments (see below for an example). If we are thorough, we can fully statically\
    \ type plain JavaScript files and derive declaration files from them.\n* With\
    \ the option --noEmit, the compiler does not produce any output, it only typechecks\
    \ files.\n\nThis is an example of a JSDoc comment that provides static type information\
    \ for a function():\n\n```\n/**\n * @param {number} x - The first operand\n *\
    \ @param {number} y - The second operand\n * @returns {number} The sum of both\
    \ operands\n */\nfunction add(x, y) {\n  return x + y;\nn\n```\n\nMore information:\
    \ Type-Checking JavaScript Files in the TypeScript Handbook."
