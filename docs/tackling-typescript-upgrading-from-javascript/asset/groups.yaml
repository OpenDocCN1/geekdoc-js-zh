    \ > b.dateStr) {\n    return -1;\n  } else {\n    return 0;\n  }\n}\n```\n\n原则上，我们需要使用前一种。TypeScript\
    \ 为通过各种方式创建的对象：\n\n```typescript\n// 16.5 类型推断\n\n这些是 TypeScript 为通过以下创建的对象推断的类型：\n\
    ```typescript\n// 16.5 类型推断\n\nconst obj1 = { a: 1, b: 2 };\n```\n\n原则上，我们需要使用前一种。TypeScript\
    \ 为通过各种方式创建的对象：\n\n```typescript\n// 16.5 类型推断\n\nconst obj1 = { a: 1, b: 2 };\n\
    ```\n\n原则上，我们需要使用前一种。TypeScript 为通过各种方式创建的对象：\n```typescript\n// 16.5 类型推断\n\n\
    const obj1 = { a: 1, b: 2 };\n```\n\n134\n\n16 对象的类型\n\n## 16.6 的其他特性\n\n### 16.6.1\
    \ 可选属性\n\n如果在属性名称后加上一个问号（?），该属性就是可选的。在以下示例中，`middle` 是可选的：\n\n```typescript\n\
    interface Name {\n  first: string;\n  middle?: string;\n  last: string;\n}\n```\n\
    \n因此，省略该属性是允许的（A）：\n\n```typescript\nconst john: Name = {first: 'Doe', last: 'Doe'};\
    \ // (A)\n```\n\n135\n\n134\n\n16 对象的类型\n\n### 16.6.1 可选属性 vs. undefined|string\n\
    \n可选属性和 `undefined|string` 有什么区别？\n\n```typescript\ninterface Inter {\n  prop1?:\
    \ string;\n  prop2: undefined | string;\n}\n```\n\n可选属性可以做到 `undefined|string`\
    \ 能做的一切。我们甚至可以使用前者的值：\n\n```typescript\nconst obj1: Inter = { prop1: undefined,\
    \ prop2: undefined };\n```\n\n然而，`prop1` 可以省略：\n\n```typescript\nconst obj2: Inter\
