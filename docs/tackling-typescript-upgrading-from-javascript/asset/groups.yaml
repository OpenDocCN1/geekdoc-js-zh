    const b: Empty = {myProp: 1, anotherProp: 2}; // OK\n```\n\n## 16.4 Object literals\
    \ and interfaces\n\n### 16.4.7.4 Matching objects without properties\n\nIf we\
    \ want to enforce that an object has no properties, we can use the following trick\
    \ (credit: Geoff Goodman):\n\n```typescript\ninterface WithoutProperties {\n \
