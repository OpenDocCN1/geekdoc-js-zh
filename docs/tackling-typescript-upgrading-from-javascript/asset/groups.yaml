    \ obj1 = { a: 1, b: 2 };\n```\n\nIn principle, we need to use the former. TypeScript\
    \ infers for objects that are created via:\n```typescript\n// 16.5 Type inference\n\
    \nconst obj1 = { a: 1, b: 2 };\n```\n\n134\n\n16 Typing objects\n\n## 16.6 Other\
