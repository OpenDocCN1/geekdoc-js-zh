    This chapter explains functionality that is used in the code examples, but not
    part of TypeScript proper.


    # 6.1 Test assertions (dynamic)


    The code examples shown in this book are tested automatically via unit tests.
    Expected results of operations are checked via the following assertion functions
    from the Node.js module assert:


    +   * assert.equal() tests equality ===

    * assert.deepEqual() tests equality by deeply comparing nested objects (incl.
    Arrays).

    * assert.throws() complains if the callback parameter does not throw an exception.


    This is an example of using these assertions:


    ```

    import strict as assert from ''assert'';


    asert.equal(3 + ''apples'', ''3 apples'');


    asert.deepEqual(

    [''a'', ''b''], ...[''c'', ''d'']],

    [''a'', ''b'', ''c'', ''d'']

    );

    asert.throws(

    () => eval(null.myProperty),

    TypeError);

    ```'
