- md: "\n# 25 An overview of computing with types\n\n```\ntype Wrap<T> = T extends\
    \ { length: number } ? [T] : T;\n```\n\n```typescript\n// %inferred-type: [string]\n\
    type A = Wrap<string>;\n```\n\n```typescript\n// %inferred-type: RegExp\ntype\
    \ B = Wrap<RegExp>;\n```\n\n## 25.4.1.2 Example: checking assignability\n\nWe\
    \ can use a conditional type to implement an assignability check:\n\n```\ntype\
    \ IsAssignableTo<A, B> = A extends B ? true : false;\n```\n\n```typescript\n//\
    \ Type `123` is assignable to type `number`\n// %inferred-type: true\ntype Result1\
    \ = IsAssignableTo<123, number>;\n```\n\n```typescript\n// Type `number` is not\
    \ assignable to type `123`\n// %inferred-type: false\ntype Result2 = IsAssignableTo<number,\
    \ 123>;\n```\n\nFor information on the type relationship assignability, see §11\
    \ “What is a type in TypeScript? Two perspectives”.\n\n## 25.4.1.3 Conditional\
    \ types are distributive\n\nConditional types are distributive: Applying a conditional\
    \ type C to a union U is the same as of applying C to each component of U. This\
    \ is example:\n\n```\ntype Wrap<T> = T extends { length: number } ? [T] : T;\n\
    ```\n\n```typescript\n// %inferred-type: [boolean] | [number[]]\ntype C1 = Wrap<boolean\
    \ | string | number>;\n```\n\n```typescript\n// Equivalent:\ntype C2 = Wrap<boolean>\
    \ | Wrap<string> | Wrap<number>;\n```\n\nIn other words, distributivity enables\
    \ us to “loop” over the components of a union. This is another example of distributivity:\n\
    \n```\ntype AlwaysWrap<T> = T extends any ? [T] : [T];\n```\n\n```typescript\n\
    // %inferred-type: [\"a\"] | [\"d\"] | [{ a: 1 } & { b: 2 }]\ntype Result = AlwaysWrap<'a'\
    \ | { a: 1 } & { b: 2 } | 'd'>;\n```\n\n## 25.4.1.4 With distributive conditional\
    \ types, we use never to ignore things\n\nInterpreted as a set, type never is\
    \ empty. Therefore, if it appears in a union type, it is ignored:\n\n```typescript\n\
    // %inferred-type: \"a\" | \"b\"\ntype Result = 'a' | 'b' | never;\n```\n\nThat\
    \ we can use never to ignore components of a union type:\n\n```\ntype DropNumbers<T>\
    \ = T extends number ? never : T;\n\n// %inferred-type: \"a\" | \"b\"\ntype Result1\
    \ = DropNumbers<1 | 'a' | 2 | 'b'>;\n```\n\nThis is what happens if we use the\
    \ expressions of the then-branch and the else-branch:\n\n```\ntype KeepNumbers<T>\
    \ = T extends number ? T : never;\n\n// %inferred-type: 1 | 2\ntype Result2 =\
    \ KeepNumbers<1 | 'a' | 2 | 'b'>;\n```\n\n## 25.4.1.5 Built-in utility type: Exclude<T,\
    \ U>\n\nExcluding from a union is such a common operation that TypeScript provides\
    \ the built-in utility type Exclude<T, U>:\n\n```typescript\n/** Exclude from\
    \ T those types that are assignable to U */\ntype Exclude<T, U> = T extends U\
    \ ? never : T;\n\n// %inferred-type: \"a\" | \"b\"\ntype Result1 = Exclude<1 |\
    \ 'a' | 2 | 'b', number>;\n\n// %inferred-type: 1 | 2\ntype Result2 = Exclude<1\
    \ | 'a' | 2 | 'b', 1 | 'c'>;\n```\n\n## 25.4.1.6 Built-in utility type: Extract<T,\
    \ U>\n\nThe inverse of Exclude<T:\n\n```typescript\n/** Extract from T those types\
    \ that are assignable to U */\ntype Extract<T, U> = T extends U ? T : never;\n\
    \n// %inferred-type: 1 | 2\ntype Result1 = Extract<1 | 'a' | 2 | 'b', number>\n\
    \n// %inferred-type: 1 | \"b\"\ntype Result2 = Extract<1 | 'a' | 2 | 'b', 1 |\
    \ 'c'>;\n```\n\n## 25.4.1.7 Chaining conditional types\n\nSimilarly to JavaScript's\
    \ ternary operator, we can also chain TypeScript's conditional type operator:\n\
    \n```\ntype LiteralName<T> =\n  T extends undefined ? \"undefined\" :\n  T extends\
    \ null ? \"null\" :\n  T extends boolean ? \"boolean\" :\n  T extends number ?\
