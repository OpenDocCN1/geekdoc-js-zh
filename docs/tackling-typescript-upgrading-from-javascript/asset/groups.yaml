    \ a static type can be too general, consider the following:\n\n```typescript\n\
    function getScore(value: number|string): number {\n  if (typeof value === 'number')\
    \ { // (A)\n    //inferred-type: number\n    return value;\n  }\n  if (typeof\
    \ value === 'string') { // (B)\n    //inferred-type: string\n    return value.length;\n\
    \  }\n  throw new Error('Unsupported value: ' + value);\n}\n```\n\nIn this chapter,\
    \ we interpret types as sets of values. (For more information on this interpretation\
    \ and another one, see §11 “What is a type?”).\n\n**What is narrowing of types\
