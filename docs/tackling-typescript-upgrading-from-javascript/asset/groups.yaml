    \ an object.\n * @param o The object that references the prototype.\n */\ngetPrototypeOf(o:\
    \ any): any;\n}\n```\n\nOn the other hand, interface Object is for instances of\
    \ Object:\n\n```\ninterface Object {\n  /** The initial value of Object.prototype.constructor\
    \ is the standard built-in Object\n  constructor: Function;\n\n  /** Returns a\
    \ string representation of an object. */\n  toString(): string;\n}\n```\n\nThe\
    \ name Object is used twice, at two different language levels:\n\n+   * At the\
    \ dynamic level, for a global variable.\n* At the static level, for a type.\n\n\
    # 18.4 Classes as types\n\nConsider the following class:\n\n```\nclass Color {\n\
    \  name: string;\n  constructor(name: string) {\n    this.name = name;\n  }\n\
    }\n```\n\nThis class definition creates two things.\n\nFirst, a constructor function\
    \ named Color (that can be invoked via new):\n\n```\nassert.equal(\n  typeof Color,\
    \ 'function'\n)\n```\n\nSecond, an interface named Color that matches instances\
    \ of Color:\n\n```\nconst green = new Color('green');\n```\n\nHere is proof that\
    \ Color is really an interface:\n\n```\ninterface RbColor extends Color {\n  rgbValue:\
    \ [number, number, number];\n}\n```\n\n# 18.4.1 Pitfall: classes work structurally,\
    \ not nominally\n\nThere is one pitfall, though: Using Color as a static type\
