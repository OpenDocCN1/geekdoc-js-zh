    \ 'Jane', middle: 'Cecily', last: 'Doe'});\n```\n\n16.4.7.2 为什么当对象来自其他地方时允许多余属性？\n\
    \n想法是，如果对象来自其他地方，我们可以假设它已经经过审核且不会有类型问题。如果类型不是问题，我们可以做得那么小心。我们的目标应该是最大化灵活性。考虑以下函数：\n\
    \n```typescript\ninterface HasYear {\n  year: number;\n}\n```\n\n```typescript\n\
    function getAge(obj: HasYear) {\n  const yearNow = new Date().getFullYear();\n\
    \  return yearNow - obj.year;\n}\n```\n\n如果不允许传递给 `getAge()` 的多余属性，这个函数的用处将有限。16.4.7.3\
    \ 空接口允许多余属性\n\n如果接口是空的，多余属性总是允许的：\n\n```typescript\ninterface Empty {}\ninterface\
    \ OneProp {\n  myProp: number;\n}\n```\n\n```typescript\n// @ts-expect-error:\
    \ Type '{ myProp: number; anotherProp: number; }'\n// is assignable to type 'OneProp'.\n\
    // Object literal may only specify known properties, and\n// 'anotherProp' does\
