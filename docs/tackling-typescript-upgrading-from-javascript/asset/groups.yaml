    \ (simple)\n\nChecking function declarations is more complicated:\n\n```\nfunction\
    \ pred2(str: string): boolean {\n  return str.length > 0;\n}\n```\n\n// Assign\
    \ the function to a type-annotated variable\nconst pred2ImplementsStringPredicate:\
    \ StringPredicate = pred2;\n\n# 21.2.3.3 Checking function declarations (extravagant)\n\
    \nThe solution is slightly over the type (i.e., don't worry if you don't fully\
    \ understand it, but it demonstrates several advanced features:\n\n```\nfunction\
    \ pred3([...str]: Parameters<StringPredicate>\n  : ReturnType<StringPredicate>\
    \ {\n  return str.length > 0;\n}\n```\n\n+   - We use Parameters<> to extract\
    \ a tuple with the parameter types. The three dots declare a rest parameter, which\
    \ collects all parameters in a tuple/Array. [str] destructures tuple. (More on\
    \ rest parameters later in this chapter.)\n- Return value: We use ReturnType<>\
    \ to extract the return type.\n\n# 21.3 Parameters\n\n# 21.3.1 When do parameters\
    \ have to be type-annotated?\n\nRecap: If --implicitAny is switched on (--strict\
    \ switches it on), the type of each parameter must be inferred or explicitly specified.\n\
    \nIn the following example, TypeScript can infer the type of str and we must specify\
    \ it:\n\n```\nfunction twice(str: string) {\n  return str + str;\n}\n```\n\nIn\
    \ line A, TypeScript can use the StringMapFunction to infer the type of str and\
    \ we don't need a type annotation:\n\n```\ntype StringMapFunction = (str: string)\
    \ => string;\nconst twice: StringMapFunction = (str) => str + str; // (A)\n```\n\
    \nHere, TypeScript can use the type of .map() to infer the type of str:\n\n```\n\
    assert.deepEqual(\n  ['a', 'b', 'c'].map((str) => str + str),\n  ['aa', 'bb',\
    \ 'cc']);\n```\n\nThis is the type of .map():"
- md: "\n## 21.3 Parameters\n\n```typescript\ninterface Array<T> {\n  map<U>(\n  \
    \  callback(value: T, index: number, array: T[]) => U,\n    thisArg?: any\n  ):\
    \ U[];\n  // ...\n}\n```\n\n### 21.3.2 Optional parameters\n\nIn this section,\
    \ we look at several ways in which we can allow parameters to be omitted.\n\n\
    ### 21.3.2.1 Optional parameter: str?: string\n\nIf we put a question mark after\
    \ the name of a parameter, that parameter becomes optional and can be omitted\
    \ when calling the function:\n\n```typescript\nfunction trim(str?: string): string\
    \ {\n  // Internal type of str;\n  // %inferred-type: string | undefined\n  str;\n\
    \n  if (str === undefined) {\n    return '';\n  }\n  return str.trim();\n}\n```\n\
    \n```typescript\n// External type of trim:\n// %inferred-type: (str?: string |\
    \ undefined) => string\ntrim;\n```\n\nThis is how trim() can be invoked:\n\n```typescript\n\
    assert.equal(\n  trim('\\n abc \\t'), 'abc');\n\nassert.equal(\n  trim(), '');\n\
    \n  // `undefined` is equivalent to omitting the parameter\nassert.equal(\n  trim(undefined),\
    \ '');\n```\n\n### 21.3.2.2 Union type: str: undefined|string\n\nExternally, parameter\
    \ str of trim1() has the type string|undefined. Therefore, trim(1) is mostly equivalent\
    \ to the following function.\n\n```typescript\nfunction trim2(str: undefined|string):\
    \ string {\n  // Internal type of str;\n// %inferred-type: string | undefined\n\
    str;\n\n  if (str === undefined) {\n    return '';\n  }\nreturn str.trim();\n\
    }\n```\n\n```typescript\n // External type of trim2:\n// %inferred-type: (str:\
    \ string | undefined) => string\ntrim2;\n```\n\nThe only way in which trim2()\
    \ is different from trim1() is that the parameter can't be omitted in function\
    \ calls (line A). In other words: We must be explicit when omitting a parameter\
    \ type which is undefined|T.\n\n```typescript\nassert.equal(\ntrim2('\\n\\ abc\
    \ \\t'), 'abc');\n```\n\n```typescript\n// @ts-expect-error: Expected 1 arguments,\
    \ but got 0. (2554)\ntrim2(); // (A)\n```\n\n```typescript\nassert.equal(\ntrim2(undefined),\
    \ ''); // OK!\n```\n\n### 21.3.3 Parameter default value: str = \n\nIf we provide\
    \ a default value for str, we don't need to provide a type annotation because\
    \ TypeScript can infer the type:\n\n```typescript\nfunction trim3(str = ''): string\
    \ {\n// Internal type of str:\n// %inferred-type: string\nstr;\n\n  return str.trim();\n\
    }\n```\n\n```typescript\n // External type of trim2:\n// %inferred-type: (str?:\
    \ string) => string\ntrim3;\n```\n\nNote that the internal type of str is string\
    \ because the default value ensures that it is never undefined.\n\nLet's invoke\
    \ trim3():\n\n```typescript\nassert.equal(\ntrim3('\\n\\ abc \\t'), 'abc');\n\
    ```\n\n```typescript\n// Omitting the parameter triggers the parameter default\
    \ value:\nassert.equal(\ntrim3(), '');\n```\n\n```typescript\n// `undefined` is\
    \ allowed and triggers the parameter default value:\nassert.equal(\ntrim3(undefined),\
    \ '');\n```\n\n### 21.3.2.4 Parameter default value plus type annotation\n\nWe\
    \ can also specify both a type and a default value:\n\n```typescript\nfunction\
    \ trim4(str: string = ''): string {\n  return str.trim();\n}\n```\n\n### 21.3.3\
    \ Rest parameters\n\n### 21.3.3.1 Rest parameters with Array types\n\nA rest parameter\
    \ collects all remaining parameters in an Array. Therefore, its static type is\
    \ usually an Array. In the following example, parts is a rest parameter:\n\n```typescript\n\
    function join(separator: string,...parts: string[]) {\n  return parts.join(separator);\n\
    }\n```\n\n```typescript\nassert.equal(\njoin('-', 'state', 'of', 'the', 'art'),\n\
    \  'state-of-the-art');\n```\n\n### 21.3.3.2 Rest parameters with tuple types\n\
    \nThe next example demonstrates two features:\n\n- We can use tuple types such\
    \ as [string, number] for rest parameters.\n- We can destruct rest parameters\
    \ (not just normal parameters).\n\n```typescript\nfunction repeat1(...[times:\
    \ number]): string {\n  return str.repeat(times);\n}\n```\n\nrepeat1() equals\
    \ to the following function:\n\n```typescript\nfunction repeat2(str: string, times:\
    \ number): string {\n  return str.repeat(times);\n}\n```\n\n### 21.3.4 Named parameters\n\
    \nNamed parameters are a popular pattern in JavaScript where an object literal\
    \ is used to give each parameter a name. That looks as follows:\n\n```typescript\n\
    assert.equal(\n  padStart({str: '7', len: 3, fillStr: '0'}),\n  '007');\n```\n\
    \nIn JavaScript, functions can destructure to access named parameter values. Alas,\
    \ in TypeScript, we additionally have to specify a type for the object literal\
    \ that leads to redundancies:\n\n```typescript\nfunction padStart({ str, len,\
    \ fillStr = ' ' } // (A)\n  { str: string, len: number, fillStr?: string }) //\
    \ (B)\n{\n  return str.padStart(len, fillStr);\n}\n```\n\nNote that destructuring\
    \ (incl. the default value for fillStr) happens in line A, while line B is exclusively\
    \ about TypeScript. It is possible to define a separate type for the object literal\
    \ that you used in line B. However, in most cases, I prefer not to do that because\
    \ it fights against the nature of parameters which are local variables.\n\n###\
    \ 21.3.5 this as a parameter (advanced)\n\nEach ordinary function has an implicit\
    \ this which enables it to be used as a method. Sometimes we need to specify a\
    \ type for this parameter which only exists at compile time and disappears at\
    \ runtime. As an example, consider the following interface for DOM (a simplified\
    \ version):\n\n```typescript\ninterface EventSource {\n  addEventListener(\n \
    \   type: string,\n    listener: () => void,\n    options?: boolean\n  ): void;\n\
    }\n```\n\nThe next example demonstrates that TypeScript uses the type information\
    \ provided by this parameter to check the first argument (line A and line B):\n\
    \n```typescript\nfunction toString(this: Date): string {\n  return this.toString();\n\
    }\n```\n\n```typescript\n// @ts-expect-error: Argument of type \"abc\" is not\
    \ assignable to type 'Date'.\nassert.throws(() => toString.call('abc')); // (A)\n\
    ```\n\n```typescript\ntoString.call(new Date()); // (B) OK\n```\n\n### 21.4 Overloading\
    \ (advanced)\n\nAdditionally, we can't invoke toString() as a method of an object\
    \ because its receiver isn't an instance of Date:\n\n```typescript\nconst obj\
    \ = {\n  toString(this: Date): string {\n    return \"hello\";\n  }\n};\n// @ts-expect-error:\
    \ The 'this' context of type '{}' is not assignable to method's 'this' of type\
    \ 'Date'.\nassert.throws(() => obj.toString()); // (A)\n```\n\nSometimes a type\
    \ signature does not adequately describe how a function works.\n\n### 21.4.1 Overloading\
    \ function declarations\n\nConsider function getFullName() which we are calling\
    \ in the following example (line A and B):\n\n```typescript\ninterface Customer\
    \ {\n  id: string;\n  fullName: string;\n}\nconst jane = {id: '1234', fullName:\
    \ 'Jane Bond'};\nconst lars = {id: '5678', fullName: 'Lars Croft'};\nconst dtoToCustomer\
    \ = new Map<string, Customer>([\n  ['1234', jane],\n  ['5678', lars],\n]);\n```\n\
    \n```typescript\nassert.equal(\n  getFullName(dtoToCustomer, '1234'), 'Jane Bond');\
    \ // (A)\n\nassert.equal(\n  getFullName(lars), 'Lars Croft'); // (B)\n```\n\n\
    How would we implement getFullName()? The following implementation works for the\
    \ two function calls in the previous example:\n\n```typescript\nfunction getFullName(customerOrMap:\
    \ Customer | Map<string, Customer>, id?: string) {\n  if (customerOrMap instanceof\
    \ Map) {\n    if (id === undefined) throw new Error();\n    const customer = customerOrMap.get(id);\n\
    \    if (customer === undefined) {\n      throw new Error('Unknown ID: ' + id);\n\
    \    }\n    return customer.fullName;\n  } else {\n    if (id !== undefined) throw\
    \ new Error();\n    return customerOrMap.fullName;\n  }\n}\n```\n\nWith this type\
    \ signature, functions are legal at compile time that produce runtime errors:\n\
    \n```typescript\nassert.throws(() => getFullName(dtoToCustomer)); // missing ID\n\
    assert.throws(() => getFullName(lars, '5678')); // ID allowed\n```\n\nThe following\
    \ code has issues:\n\n```typescript\nfunction getFullName(customerOrMap: Customer):\
    \ string; // (A)\nfunction getFullName(\n  customerOrMap: Map<string, Customer>,\
    \ id: string\n): string; // (B)\nfunction getFullName(\n  customerOrMap: Customer\
    \ | Map<string, Customer>,\n  id?: string\n) { // (C)\n  // ...\n}\n```\n\n```typescript\n\
    // @ts-expect-error: Argument of type 'Map<string, Customer>' is not assignable\
    \ to parameter of type 'Customer'.\ngetFullName(dtoToCustomer); \n```\n\n```typescript\n\
    // @ts-expect-error: Argument of type '{id: string; fullName: string;}'\n// is\
    \ not assignable to parameter of type 'Map<string, Customer>'.\ngetFullName(lars,\
    \ '5678'); \n```\n\nWhat is going on here? The type signature of getFullName()\
    \ is overloaded:\n\n- The actual implementation starts in line C. It is the same\
    \ as the previous example.\n- In line A and B there are the two type signatures\
    \ (heads without bodies) that can be used for getFullName(). The type signature\
    \ of the actual implementation cannot be used!\n\nMy advice is to only use overloading\
    \ when it can’t be avoided. One alternative is to split an overloaded function\
    \ into multiple functions with different names – for example:\n\n- getFullName()\n\
    - getFullNameViaMap()\n"
  mdcn: "\n\n## 21.3 参数\n\n```typescript\ninterface Array<T> {\n  map<U>(\n    callback(value:\
    \ T, index: number, array: T[]) => U,\n    thisArg?: any\n  ): U[];\n  // ...\n\
    }\n```\n\n### 21.3.2 可选参数\n\n在本节中，我们将查看允许参数被省略的几种方法。\n\n### 21.3.2.1 可选参数：str?:\
    \ string\n\n如果在参数名称后面加上一个问号，该参数就变成了可选的，在调用函数时可以省略：\n\n```typescript\nfunction\
    \ trim(str?: string): string {\n  // str 的内部类型;\n  // %inferred-type: string |\
    \ undefined\n  str;\n\n  if (str === undefined) {\n    return '';\n  }\n  return\
    \ str.trim();\n}\n```\n\n```typescript\n// trim 的外部类型:\n// %inferred-type: (str?:\
    \ string | undefined) => string\ntrim;\n```\n\n这是 trim() 的调用方式：\n\n```typescript\n\
    assert.equal(\n  trim('\\n abc \\t'), 'abc');\n\nassert.equal(\n  trim(), '');\n\
    \n  // `undefined` 等同于省略参数\nassert.equal(\n  trim(undefined), '');\n```\n\n###\
    \ 21.3.2.2 联合类型：str: undefined|string\n\n从外部看，`trim1()` 的参数 str 的类型为 `string|undefined`。因此，`trim(1)`\
    \ 大多等同于以下函数。\n\n```typescript\nfunction trim2(str: undefined|string): string {\n\
    \  // str 的内部类型;\n// %inferred-type: string | undefined\nstr;\n\n  if (str ===\
    \ undefined) {\n    return '';\n  }\nreturn str.trim();\n}\n```\n\n```typescript\n\
    \ // trim2 的外部类型:\n// %inferred-type: (str: string | undefined) => string\ntrim2;\n\
    ```\n\n`trim2()` 与 `trim1()` 的唯一不同在于在函数调用中不能省略参数（A 行）。换说：当我们省略类型为 `undefined|T`\
    \ 的参数时，必须是显式的。\n\n```typescript\nassert.equal(\ntrim2('\\n\\ abc \\t'), 'abc');\n\
    ```\n\n```typescript\n// @ts-expect-error: 预期 1 个参数，但得到了 0 个。(2554)\ntrim2();\
    \ // (A)\n```\n\n```typescript\nassert.equal(\ntrim2(undefined), ''); // OK!\n\
    ```\n\n### 21.3.3 参数默认值：str = \n\n如果我们为 str 提供一个默认值，就不需要提供类型注解，因为 TypeScript 可以推断出类型：\n\
    \n```typescript\nfunction trim3(str = ''): string {\n// str 的内部类型:\n// %inferred-type:\
    \ string\nstr;\n\n  return str.trim();\n}\n```\n\n```typescript\n // trim3 的外部类型:\n\
    // %inferred-type: (str?: string) => string\ntrim3;\n```\n\n注意，str 的内部类型是 `string`，因为默认值确保了它永远不会是\
    \ `undefined`。\n\n让我们调用 trim3()：\n\n```typescript\nassert.equal(\ntrim3('\\n\\\
    \ abc \\t'), 'abc');\n```\n\n```typescript\n// 省略参数会触发参数默认值:\nassert.equal(\n\
    trim3(), '');\n```\n\n```typescript\n// `undefined` 是允许的并触发参数默认值:\nassert.equal(\n\
    trim3(undefined), '');\n```\n\n### 21.3.2.4 参数默认值加类型注解\n\n我们也可以同时指定类型和默认值：\n\n\
    ```typescript\nfunction trim4(str: string = ''): string {\n  return str.trim();\n\
    }\n```\n\n### 21.3.3 剩余参数\n\n### 21.3.3.1 使用 Array 类型的剩余参数\n\n剩余参数将所有剩余参数收集到一个数组中。因此，它的静态类型通常是一个\
    \ `Array`。在接下来的示例中，`parts` 是一个剩余参数：\n\n```typescript\nfunction join(separator:\
    \ string,...parts: string[]) {\n  return parts.join(separator);\n}\n```\n\n```typescript\n\
    assert.equal(\njoin('-', 'state', 'of', 'the', 'art'),\n  'state-of-the-art');\n\
    ```\n\n### 21.3.3.2 使用 tuple 类型的剩余参数\n\n下一个示例演示了特性：\n\n- 我们可以对剩余参数使用元组类型，例如 `[string,\
    \ number]`。\n- 我们可以解构剩余参数（而不只是普通参数）。\n\n```typescript\nfunction repeat1(...[times:\
    \ number]): string {\n  return str.repeat(times);\n}\n```\n\nrepeat1() 等于以下函数：\n\
    \n```typescript\nfunction repeat2(str: string, times: number): string {\n  return\
    \ str.repeat(times);\n}\n```\n\n### 21.3.4 命名参数\n\n命名参数是 JavaScript 中一种流行的模式，使用对象字面量来给每个参数命名。它的样子如下：\n\
    \n```typescript\nassert.equal(\n  padStart({str: '7', len: 3, fillStr: '0'}),\n\
    \  '007');\n```\n\n在 JavaScript 中，函数可以解构来访问命名参数的值。然而，在 TypeScript 中，我们必须额外为对象字面量指定类型，这导致了冗余：\n\
    \n```typescript\nfunction padStart({ str, len, fillStr = ' ' } // (A)\n  { str:\
    \ string, len: number, fillStr?: string }) // (B)\n```\n\n"
