    \ {first: 'Jane', middle: 'Cecily', last: 'Doe'};\n\n### 16.6.1 Optional vs. undefined|string\n\
    \nWhat is the difference between .prop and .prop2?\n\n```typescript\ninterface\
    \ Inter {\n  prop1?: string;\n  prop2: undefined | string;\n}\n```\n\nAn optional\
