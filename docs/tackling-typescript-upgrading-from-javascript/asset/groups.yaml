    \ is not assignable to 'string'. (2322)\nconst obj1: Object = { toString() { return\
    \ 123 }; };\n```\n\n### 16.4 Object type literals and interfaces\n\nWith type\
    \ object, TypeScript does not complain (because object does not specify any properties\
    \ and there can't be any conflicts):\n\n```typescript\nconst obj2: object = {\
    \ toString() { return 123 } };\n```\n\n## 16.4 Object type literals and interfaces\n\
    \nTypeScript has two ways of defining object types that are very similar:\n\n\
    ```typescript\n// Object type literal\ntype ObjType1 = {\n  a: boolean,\n  b:\
    \ number,\n  c: string;\n};\n```\n\n```typescript\n// Interface\ninterface ObjType2\
    \ {\n  a: boolean,\n  b: number;\n  c: string;\n}\n```\n\nWe can use semicolons\
    \ or commas as separators. Trailing separators are allowed and optional.\n\n###\
    \ 16.4.1 Differences between object type literals and interfaces\n\nIn this section,\
    \ we take a look at the most important differences between object type literals\
    \ and interfaces.\n\n### 16.4.1.1 Inlining\n\nObject type literals can be inlined,\
    \ while interfaces can't:\n\n```typescript\n// Inlined object type literal\nfunction\
    \ f1(x:{prop: number}) {\n```\n\n```typescript\n// Referenced interface:\nfunction\
    \ f2(x: ObjectInterface) {\ninterface ObjectInterface {\n  prop: number;\n}\n\
    ```\n\n### 16.4.1.2 Duplicate names\n\nType aliases with duplicate names are illegal:\n\
    \n```typescript\n// @ts-explain-error: Duplicate identifier 'PersonAlias'. (2300)\n\
    type PersonAlias = {first: string};\n```\n"
