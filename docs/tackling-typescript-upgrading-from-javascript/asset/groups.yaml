    \nRead on for information about the second use case.\n\n# 14.1.2 Unions of string\
    \ literal types\n\nWe'll start with an enum and convert it to a union of string\
    \ literal types.\n\n```\nenum NoYesEnum {\n  No = 'No',\n  Yes = 'Yes',\n}\nfunction\
    \ toGerman(value: NoYesEnum): string {\n  switch (value) {\n    case NoYesEnum.No:\n\
    \      return 'Nein';\n    case NoYesEnum.Yes:\n      return 'Ja';\n  }\n}\n```"
