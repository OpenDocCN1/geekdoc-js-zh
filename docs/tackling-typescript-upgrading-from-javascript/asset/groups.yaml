- md: "\n# 13 TypeScript units: How do they work? What can they be used for?\n\n-\
    \ 13.7 Enums at compile time . . . . . . . . . . . . . . . . . . 91\n- 13.7.1\
    \ Enums are objects . . . . . . . . . . . . . . . . . . . . . 91\n- 13.7.2 Safety\
    \ checks for literal enums . . . . . . . . . . . . . . . . . . 91\n- 13.7.3 keyof\
    \ and enums . . . . . . . . . . . . . . . . . . . . . . 94\n- 13.8 Acknowledgment\
    \ . . . . . . . . . . . 94\n\nThis chapter answers the following questions:\n\n\
    - How do TypeScript's enums work?\n- What can they be used for?\n\nIn the next\
    \ chapter, we take a look at alternatives to enums.\n\n## 13.1 The basics\n\n\
    boolean is a type with a finite amount of values: false and true. With enums,\
    \ TypeScript lets us define similar types ourselves.\n\n### 13.1.1 Numeric enums\n\
    \nThis is a numeric NoYes:\n\n```typescript\nenum NoYes {\n  No = 0,\n  Yes =\
    \ 1, // trailing comma\n}\n```\n\n```typescript\nassert.equal(NoYes.No, 0);\n\
    assert.equal(NoYes.Yes, 1);\n```\n\nExplanations:\n\n- The entries No and Yes\
    \ are called the members of the enum NoYes.\n- Each enum member has a name and\
    \ a value. For example, the first member has the name No and the value 0.\n- The\
    \ part of a member definition starts with an equals sign and specifies a value\
    \ is called an initializer.\n- As object literals, trailing commas are allowed\
    \ and ignored.\n\nWe can use members as if they were literals, true, 123, or 'abc'\
    \ – for example:\n\n```typescript\nfunction toGerman(value: NoYes) {\n  switch\
    \ (value) {\n    case NoYes.No:\n      return 'Nein';\n    case NoYes.Yes:\n \
    \     return 'Ja';\n  }\n}\n```\n\n```typescript\nassert.equal(toGerman(NoYes.No),\
    \ 'Nein');\nassert.equal(toGerman(NoYes.Yes), 'Ja');\n```\n\n### 13.1.2 String-based\
    \ enums\n\nInstead of numbers, we can also use strings as enum member values:\n\
    \n```typescript\nenum NoYes {\n  No = 'No',\n  Yes = 'Yes',\n}\n\nassert.equal(NoYes.No,\
    \ 'No');\nassert.equal(NoYes.Yes, 'Yes');\n```\n\n### 13.1.3 Heterogeneous enums\n\
    \nThe last kind of enums is called heterogeneous. The member values of a heterogeneous\
    \ enum are a mix of numbers and strings:\n\n```typescript\nenum Enum {\n  One\
    \ = 'One',\n  Two = 'Two',\n  Three = 3,\n  Four = 4,\n}\nassert.deepEqual(\n\
    \  [Enum.One, Enum.Two, Enum.Three, Enum.Four],\n  ['One', 'Two', 3, 4]\n);\n\
    ```\n\nHeterogeneous enums are not often used because they have few applications.\n\
    Alas, TypeScript only supports numbers and strings as enum member values. Other\
    \ values, such as symbols, are not allowed.\n\n### 13.1.4 Omitting initializers\n\
    \nWe can omit initializers in two cases:\n\n- We can omit the initializer of the\
    \ first member. Then that member has the value 0 (zero).\n- We can omit the initializer\
    \ of a member if the previous member has a number value. Then the current member\
    \ has that value plus one.\n\nThis is a numeric enum without any initializers:\n\
    \n```typescript\nenum NoYes {\n  No,\n  Yes,\n}\nassert.equal(NoYes.No, 0);\n\
    assert.equal(NoYes.Yes, 1);\n```\n\nThis is a heterogeneous enum where some initializers\
    \ are omitted:\n\n```typescript\nenum Enum {\n  A,\n  B,\n  C = 'C',\n  D = 'D',\n\
    \  E = 8, // (A)\n  F,\n}\nassert.deepEqual(\n  [Enum.A, Enum.B, Enum.C, Enum.D,\
    \ Enum.E, Enum.F],\n  [0, 1, 'C', 'D', 8, 9]\n);\n```\n\nNote that we didn't omit\
    \ the initializer in line A because the value of the preceding member is not a\
    \ number.\n\n### 13.1.5 Casting of enum member names\n\nThere are several precedents\
    \ for naming constants (in enums or elsewhere):\n\n- Traditionally, JavaScript\
    \ has used all-caps names, which is a convention inherited from Java and C:\n\
    \  - Number.MAX_VALUE\n  - Math.SQRT2\n- Well-known symbols are camel-cased and\
    \ start with lowercase letters because they are related to property names:\n \
    \ - Symbol.asyncIterator\n- The TypeScript manual uses camel-cased names that\
    \ start with uppercase letters. This is the standard TypeScript style and we used\
    \ it for the NoYes enum.\n\n### 13.1.6 Quoting enum member names\n\nSimilar to\
    \ JavaScript objects, we can quote the names of enum members:\n\n```typescript\n\
    enum HttpIntegerField {\n  'Accept',\n  'Accept-Charset',\n  'Accept-Datetime',\n\
    \  'Accept-Encoding',\n  'Accept-Language'\n}\nassert.equal(HttpIntegerField['Accept-Charset'],\
    \ 1);\n```\n\nThere is no way to compute the names of enum members. Object literals\
    \ support computed keys via brackets.\n\n## 13.2 Specifying enum values (advanced)\n\
    \nTypeScript distinguishes three kinds of enum members, by how they are initialized:\n\
    \n- Literal enum member:\n  - either has no initializer\n  - or is initialized\
    \ via a number literal\n  - via a string literal.\n\n- Constant enum member:\n\
    \  - its value is computed at compile time. Therefore, we can either specify its\
    \ value implicitly (that is, we let TypeScript specify it for us). Or we can specify\
    \ it explicitly and are allowed to use the following syntax:\n    - Number literals\
    \ or string literals\n    - A reference to a previously defined constant enum\
    \ (in the current enum or in a previous enum)\n    - The unary operators +, ~\n\
    \    - The binary operators +, *, %, <<, >>>, ^\n\nThis is an example of an enum\
    \ whose members are all constant (we'll see later how it is used):\n\n```typescript\n\
    enum Perm {\n  UserRead = 1 << 8,\n  UserWrite = 1 << 7,\n  UserExecute = 1 <<\
    \ 6,\n  GroupRead = 1 << 5,\n  GroupWrite = 1 << 4,\n  GroupExecute = 1 << 3,\n\
    \  AllRead = 1 << 2,\n  AllWrite = 1 << 1,\n  AllExecute = 1 << 0\n}\n```\n\n\
    In general, constant members can't be used as types. However, exhaustiveness checks\
    \ are still performed.\n\n### 13.2.3 Computed enum members\n\nThe values of computed\
    \ enum members can be specified via arbitrary expressions. For example:\n\n```typescript\n\
    enum NoYesNum {\n  No = 123,\n  Yes = Math.random(), // OK\n}\n```\n\nThis was\
    \ a numeric enum. String-based enums and heterogeneous enums are more limited.\
    \ For example, we cannot use method invocations to specify member values:\n\n\
    ```typescript\nenum NoYesStr {\n  No = 'No',\n  // @ts-expect-error: Computed\
    \ values are not permitted in\n  // an enum with string-valued members.\n  Yes\
    \ = ['Y', 'e', 's'].join('')\n}\n```\n\nTypeScript does not do exhaustiveness\
    \ checks for computed enum members.\n\n## 13.3 Downsides of numeric enums\n\n\
    ### 13.3.1 Downside: logging\n\nWhen logging members of numeric enums, we only\
    \ see numbers:\n\n```typescript\nenum NoYes { No, Yes }\n\nconsole.log(NoYes.No);\n\
    console.log(NoYes.Yes);\n\n// Output:\n// 0\n// 1\n```\n\n### 13.3.2 Downside:\
    \ loose type-checking\n\nWhen using the enum as a type, the values that are allowed\
    \ statically are not just those of the enum members - any number is accepted:\n\
    \n```typescript\nenum NoYes { No, Yes }\nfunction func(no: NoYes) {}\nfunc(33);\
    \ // no error!\n```\n\nWhy aren't there static checks? Daniel Rosenberg explains:\n\
    \n> The behavior is motivated by bitwise operations. There are times when SomeFlag.Foo\
    \ | SomeFlag.Bar is intended to produce another SomeFlag. Instead you use it with\
    \ number, and you don't have to cast back to SomeFlag.\n\nI think if we used TypeScript\
    \ over again and still had enums, we'd have made a separate construct for bit\
    \ flags.\n\nHow enums are used for bit patterns is demonstrated soon in more detail.\n\
    \n### 13.3.3 Recommendation: prefer string-based enums\n\nMy recommendation is\
    \ to prefer string-based enums (for brevity's sake, this chapter doesn't allow\
    \ this recommendation):\n\n```typescript\nenum NoYes { No='No', Yes='Yes' }\n\
    ```\n\nOn one hand, logging output is more useful for humans:\n\n```typescript\n\
    console.log(NoYes.No);\nconsole.log(NoYes.Yes);\n\n// Output:\n// 'No'\n// 'Yes'\n\
    ```\n\nOn the other hand, we get stricter type checking:\n"
  mdcn: "\n\n# 13 TypeScript 举：它们是如何工作的？可以有什么用途？\n\n- 13.7 编译时的枚举 . . . . . . . .\
    \ . . . . . . . . . . 91\n- 13.7.1 枚举是对象 . . . . . . . . . . . . . . . . . . .\
    \ . . 91\n- 13.7.2 字面量枚举的安全检查 . . . . . . . . . . . . . . . . . . . 91\n- 13.7.3\
    \ keyof 与枚举 . . . . . . . . . . . . . . . . . . . . . . 94\n- 13.8 鸣谢 . . . .\
    \ . . . . . . 94\n\n本章回答了以下问题：\n\n- TypeScript 的枚举是如何工作的？\n- 它们可以用于什么场景？\n\n在下一章中，我们将看看枚举的替代方案。\n\
    \n## 13.1 基础\n\n`boolean` 是一个具有有限值的类型：`false` 和 `true`。通过枚举，TypeScript 允许我们自己定义类似的类型。\n\
    \n### 13.1.1 数字枚举\n\n这是一个数字型的 NoYes：\n\n```typescript\nenum NoYes {\n  No = 0,\n\
    \  Yes = 1, // 尾随逗号\n}\n```\n\n```typescript\nassert.equal(NoYes.No, 0);\nassert.equal(NoYes.Yes,\
    \ 1);\n```\n\n解释：\n\n- 条目 `No` 和 `Yes` 被称为枚举 `NoYes` 的成员（members）。\n- 每个枚举成员都有一个名称和一个值。例如，第一个成员的名称为\
    \ `No`，值为 `0`。\n- 成员定义中以等号开头并指定值的称为初始化器（initializer）。\n- 与对象字面量一样，允许使用尾随逗号且会被忽略。\n\
    \n我们可以像使用字面量（`true`、`123` 或 `'abc'`）一样使用这些成员——例如：\n\n```typescript\nfunction toGerman(value:\
    \ NoYes) {\n  switch (value) {\n    case NoYes.No:\n      return 'Nein';\n   \
    \ case NoYes.Yes:\n      return 'Ja';\n  }\n}\n```\n\n```typescript\nassert.equal(toGerman(NoYes.No),\
    \ 'Nein');\nassert.equal(toGerman(NoYes.Yes), 'Ja');\n```\n\n### 13.1.2 基于字符串的枚举\n\
    \n除了数字，我们还可以使用字符串作为枚举成员的值：\n\n```typescript\nenum NoYes {\n  No = 'No',\n  Yes\
    \ = 'Yes',\n}\n\nassert.equal(NoYes.No, 'No');\nassert.equal(NoYes.Yes, 'Yes');\n\
    ```\n\n### 13.1.3 异构枚举\n\n最后一种枚举被称为异构枚举（heterogeneous）。异构枚举的成员值是数字和字符串的混合：\n\n\
    ```typescript\nenum Enum {\n  One = 'One',\n  Two = 'Two',\n  Three = 3,\n  Four\
    \ = 4,\n}\nassert.deepEqual(\n  [Enum.One, Enum.Two, Enum.Three, Enum.Four],\n\
    \  ['One', 'Two', 3, 4]\n);\n```\n\n异构枚举并不经常使用，因为它们的应用场景很少。\n遗憾的是，TypeScript 仅支持数字和字符串作为枚举成员的值。其他值（如\
    \ `symbol`）是不允许的。\n\n### 13.1.4 省略初始化器\n\n我们可以在两种情况下省略初始化器：\n\n- 可以省略第一个成员的初始化器。那么该成员的值为\
    \ `0`（零）。\n- 如果上一个成员具有数字值，可以省略当前成员的初始化器。那么当前成员的值为该值加一。\n\n这是一个没有任何初始化器的数字枚举：\n\
    \n```typescript\nenum NoYes {\n  No,\n  Yes,\n}\nassert.equal(NoYes.No, 0);\n\
    assert.equal(NoYes.Yes, 1);\n```\n\n这是一个省略了部分初始化器的异构枚举：\n\n```typescript\nenum\
    \ Enum {\n  A,\n  B,\n  C = 'C',\n  D = 'D',\n  E = 8, // (A)\n  F,\n}\nassert.deepEqual(\n\
    \  [Enum.A, Enum.B, Enum.C, Enum.D, Enum.E, Enum.F],\n  [0, 1, 'C', 'D', 8, 9]\n\
    );\n```\n\n注意，`A` 行没有省略初始化器，是因为前一个成员的值不是数字。\n\n### 13.1.5 枚举成员的命名\n\n枚举成员命名有几种先例：\n\
    \n- 传统上，JavaScript 使用全大写命名，继承自 Java 和 C：\n  - `Number.MAX_VALUE`\n  - `Math.SQRT2`\n\
    - 著名的符号使用驼峰命名，因为它们与属性相关：\n  - `Symbol.asyncIterator`\n- TypeScript 手档使用以大字母开头的驼峰命名。这用于\
    \ `NoYes` 枚举。\n\n### 13.1.6 举成员名称\n\n类似于 JavaScript 对象，我们可以为枚举成员加引号：\n\n```typescript\n\
    enum HttpIntegerField {\n  'Accept',\n  'Accept-Charset',\n  'Accept-Datetime',\n\
    \  'Accept-Encoding',\n  'Accept-Language'\n}\nassert.equal(HttpIntegerField['Accept-Charset'],\
    \ 1);\n```\n\n没有计算枚举名称的方法。对象字面量通过括号支持计算键。\n\n## 13.2 指定枚举值（高级）\n\nTypeScript 通过初始化方式区分了三种枚举成员：\n\
    \n- 字面量枚举成员：\n  - 可能没有初始化器\n  - 或者通过数字字面量初始化\n  - 通过字符串字面量初始化\n\n- 常量枚举成员：\n \
    \ - 它的值在编译时计算。因此，我们可以隐式地指定它（即让 TypeScript 为我们指定）。我们可以显式指定并允许以下语法：\n    - 数字字面量或字符串字面量\n\
    \    - 对之前定义的枚举的引用（在当前枚举或之前的枚举中）\n    - 一元运算符 `+`、`~`\n    - 二进制运算符 `*`、`%`、`<<`、`>>>`\n\
    \n这是一个成员均为常量枚举示例（稍后我们将看到如何用法）：\n\n```typescript\nenum Perm {\n  UserRead = 1 <<\
    \ 8,\n  UserWrite = 1 << 7,\n  UserExecute = 1 << 6,\n  GroupRead = 1 << 5,\n\
    \  GroupWrite = 1 << 4,\n  GroupExecute = 1 << 3,\n  AllRead = 1 << 2,\n  AllWrite\
    \ = 1 << 1,\n  AllExecute = 1 << 0\n}\n```\n\n通常，常量成员不能用作类型。然而，仍然会进行完尽性检查。\n\n\
    ### 13.2.3 计算枚举成员\n\n计算成员的值可以通过任意表达式指定。例如：\n\n```typescript\nenum NoYesNum {\n\
    \  No = 123,\n  Yes = Math.random(), // OK\n}\n```\n\n这是一个数字枚举。字符串枚举和异构枚举的限制更多。例如，我们不能使用方法调用来指定成员值：\n\
    \n```typescript\nenum NoYesStr {\n  No = 'No',\n  // @ts-expect-error: 字符串值成员的枚举不允许计算值。\n\
    \  Yes = ['Y', 'e', 's'].join('')\n}\n```\n\nTypeScript 不对计算成员进行完尽性检查。\n\n## 13.3\
    \ 数字枚举的缺点\n\n### 13.3.1 缺点：日志\n\n当记录数字枚举成员时，我们只能看到数字：\n\n```typescript\nenum NoYes\
    \ { No, Yes }\n\nconsole.log(NoYes.No);\nconsole.log(NoYes.Yes);\n\n// 输出：\n//\
    \ 0\n// 1\n```\n\n### 13.3.2 缺点：类型检查宽松\n\n当用枚举作为类型时，静态允许的值不仅是枚举成员的值——任何数字都被接受：\n\
    \n```typescript\nenum NoYes { No, Yes }\nfunction func(no: NoYes) {}\nfunc(33);\
    \ // 无错误！\n```\n\n为什么没有静态检查？Daniel Rosenberg 解释道：\n\n> 这种行为的动机是位运算。某些情况下，`SomeFlag.Foo\
    \ | SomeFlag.Bar` 旨在产生另一个 `SomeFlag`。相反，你将其与数字配合，而不需要转换回 `SomeFlag`。\n\n我想如果我们再次使用\
    \ TypeScript 并且仍然有枚举，我们会为位标志（bit flags）创建一个单独结构。\n\n枚举如何用于位模式很快就会详细演示。\n\n###\
    \ 13.3.3 建议：倾向于基于字符串的枚举\n\n我的建议是倾向于基于字符串的枚举（为了简洁起见，本章不允许此建议）：\n\n```typescript\n\
    enum NoYes { No='No', Yes='Yes' }\n```\n\n一方面，日志输出对人类更有用：\n\n```typescript\nconsole.log(NoYes.No);\n\
    console.log(NoYes.Yes);\n\n// 输出：\n// 'No'\n// 'Yes'\n```\n\n另一方面，我们得到了更严格的类型检查：\n\
    \n"
