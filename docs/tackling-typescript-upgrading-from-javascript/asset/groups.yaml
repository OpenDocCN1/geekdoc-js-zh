    ```typescript\nfunction getAge(obj: HasYear) {\n  const yearNow = new Date().getFullYear();\n\
    \  return yearNow - obj.year;\n}\n```\n\nWithout allowing excess properties for\
    \ most values that are passed to getAge(), the usefulness of this function would\
    \ be quite limited.\n\n## 16.4.7.3 Empty interfaces allow excess properties\n\n\
    If an interface is empty (or the object literal is used), excess properties are\
