    # 25.3 Union types and intersection types


    # 25.3.1 Union types ()


    The operator | is used to create union types:


    ```

    type A = ''a'' | ''b'' | ''c''

    type B = ''b'' | ''c'' | ''d'';

    ```


    ```

    // %inferred-type: "a" | "b" | "c" | "d"

    type Union = A | B;

    ```


    If we view type A and type B as sets, then A | B is the set-theoretic union of
    these sets. Put differently: the members of the result are members at least one
    of the operands.


    Syntactically, we can put a | in front of the first component of a union type.
    That is convenient when a type definition spans multiple lines:


    ```

    type A =

    | ''a''

    | ''b''

    | ''c''

    ;

    ```


    # 25.3.1.1 Unions as collections of metavalues


    TypeScript represents collections of metavalues as unions of literal types. We
    have already seen an example of that:


    ```

    type Obj = {

    first: 1,

    second: 2,

    };

    ```


    ```

    // %inferred-type: "first" | "second"

    type Result = keyof Obj;

    ```


    We will soon see type-level operations for looping over such collections.'
