    \ 227\n\nIn this chapter, we explore how we can compute with types at compile\
    \ time in TypeScript. Note that the focus of this chapter is learning how to compute\
    \ with types. Therefore, we'll use literal types a lot and the examples are less\
    \ practically relevant.\n\n# 25.1 Types as metavalues\n\nConsider the following\
    \ two levels of TypeScript code:\n\n+   - Program level: At runtime, we can use\
    \ values and functions.\n- Type level: At compile time, we can use specific types\
    \ and generic types.\n\nThe type level is a metavel of the program level."
