    asert.deepEqual(arr, [1, 2, 3, 4, 5, 6]);\n```\n\nTypeScript 代码与 JavaScript 代码不同的地方只有\
    \ A 行和 B 行。\n\nTypeScript 的编写有多种风格：\n\n- 带有（classes）和 OOP 模式的面向对象编程（OOP）风格\n-\
    \ 带有函数式模式的函数式编程（FP）风格\n- OOP 和 FP 的混合\n- 以及此类推\n\n### 2.3.2 TypeScript 试图用 C#\
    \ 或 Java 替换 JavaScript\n\n最初，TypeScript 发明了一些它自己的语言结构（例如枚举 enums）。但从 ECMAScript\
