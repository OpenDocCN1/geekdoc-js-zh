    What are types in TypeScript? This chapter describes two perspectives that help
    with

    understanding them.


    # 11.1 Three questions for each perspective


    The following three questions are important for understanding how types work and

    to be answered from each of the two perspectives.


    +   1. What does it mean for myVariable to have the type MyType?

    let myVariable: MyType = /*...*/;

    2. Assignability: A SourceType is assignable to a TargetType if each location

    of type SourceType can be assigned to any storage location of type TargetType

    (line A).

    let source: SourceType = /*...*/;

    let target: TargetType = source; // (A)

    3. How is TypeUnion derived from Type1, Type2, and Type3?

    type TypeUnion = Type1 | Type2 | Type3;'
  - '[PAGE 71]


    # 11.2 Perspective 1: types are sets of values


    From this perspective, a type is a set of values:


    +   1. If myVariable has the type MyType, that means all values that can be assigned
    to myVariable must be elements of the set MyType.

    2. SourceType is assignable to TargetType if SourceType is a subset of TargetType.
    As a consequence, all values allowed by SourceType are also allowed by Target-Type.

    3. The union of the types Type1, Type2, and Type3 is the set-theoretic union of
    the sets that define them.


    # 11.3 Perspective 2: type compatibility relationships


    From this perspective, we are not concerned with values and how they flow when
    code is executed. Instead, we take a more static view:


    +   * The source code has locations and each location has a static type. In a
    TypeScript-aware editor, we can see the static type of a location if we hover
    over it with the cursor.

    * When a source location is connected to a target location via an assignment,
    function call, then the type of the source location must be compatible with the
    type of the target location. The TypeScript specification defines type compatibility
    via type relationships.

    * The type relationship assignment compatibility defines what a source type S
    is assignable to a target type T:


    +   - S and T are identical types.

    - S or T is the any type.

    - Etc.


    +   1. The static type of a variable determines what can be assigned to it. That
    always depends on static types. For example, in a function call toString(123),
    the static type of 123 must be assignable to the static type of the parameter
    of toString().

    2. myVariable has type MyType if the type of myVariable is assignable to MyType.

    3. SourceType is assignable to TargetType if they are assignable-compatible.

    4. How union works is defined via the type relationship apparent members.


    An interesting trait of TypeScript''s type system is that the same variable can
    have different-ent types at different locations:


    ```

    // %inferred-type: any[]nconst arr = [];


    arr.push(123);

    ```'
- md: "\n## 11.4 Nominal type systems vs. structural type systems\n\n```typescript\n\
    // // %inferred-type: number[]\narr;\n\narr.push('abc');\n// %inferred-type: (string\
    \ | number)[]\narr;\n```\n\nOne of the responsibilities of a static type system\
    \ is to determine if two static types are compatible:\n\n- The static type Src\
    \ of an actual parameter (e.g., provided via a function call)\n- The static type\
    \ Trg of the corresponding formal parameter (e.g., specified as part of a function\
    \ definition)\n\nThis often means checking if Src is a subtype of Trg. Two approaches\
    \ for this check are (roughly):\n\n- In a nominal or nominative type system, two\
    \ static types are equal if they have the same identity (\"name\"). One type is\
    \ a subtype of another if their subtype relation is defined explicitly.\n- Languages\
    \ with nominal typing are C++, Java, C#, Swift, and Rust.\n- In a structural type\
    \ system, two static types are equal if they have the same structure (if their\
    \ parts have the same names and types). One type Sub is a subtype of Sup if all\
    \ parts of Sup (and possibly others) and each part of Sub is a subtype of the\
    \ corresponding part of Sup.\n- Languages with structural typing are OCaml/ReasonML\
    \ and TypeScript.\n\nThe following code produces a type error in line A with nominal\
    \ type systems, but is legal with TypeScript's structural type system because\
    \ class A and class B have the same structure:\n\n```typescript\nclass A {\n \
    \ name = 'A';\n}\nclass B {\n  name = 'B';\n}\nconst someVariable:A = new B();\
    \ // (A)\n```\n\nTypeScript's interfaces also work structurally – they don't have\
    \ to be implemented in order to match:\n\n```typescript\ninterface Point {\n \
    \ x: number;\n  y: number;\n}\nconst point: Point = {x: 1, y: 2}; // OK\n```\n\
    \n## 11.5 Further reading\n\n- Chapter “Type Compatibility” in the TypeScript\
    \ Handbook\n- Section “Type Relationships” in the TypeScript Specification\n\n\
    ## Chapter 12\n\n### The top types any and unknown\n\n| Contents | Page |\n| :---\
    \ | :--- |\n| 12.1 TypeScript's two top types | 73 |\n| 12.2 The top type any\
    \ | 73 |\n| 12.2.1 Example: JSON.parse() | 74 |\n| 12.2.2 Example: String() |\
    \ 74 |\n| 12.3 The top type unknown | 74 |\n\nIn TypeScript, any and unknown are\
    \ types that contain all values. In this chapter, we examine what they are and\
    \ what they can be used for.\n\n### 12.1 TypeScript's two top types\n\nany and\
    \ unknown are so-called *top types* in TypeScript. Quoting Wikipedia:\n\n> The\
    \ top type [...] is the universal type, sometimes called the *universal supertype*\
    \ as all other types in any given system are subtypes [...]. In most cases it\
    \ is the type which contains every possible [value] in the type system of interest.\n\
    \nThat is, when viewing types as sets of values (for more information on what\
    \ types are, see §11 \"What is a type in TypeScript? Two perspectives\"), any\
    \ and unknown are sets that contain all values. As an aside, TypeScript also has\
    \ the *bottom type* never, which is the empty set.\n\n### 12.2 The top type any\n\
    \nIf a value type any, we can do everything with it:\n\n```typescript\nfunction\
    \ func(value: any) {\n  // Only allowed for numbers, but they are a subtype of\
    \ `any`\n  5 * value;\n}\n\n// Normally the type signature of `value` must contain\
    \ .propName\nvalue.propName;\n\n// Normally only allowed for Arrays and types\
    \ with index signatures\nvalue[123];\n}\n\nEvery type is assignable to any:\n\n\
    ```typescript\nlet storageLocation: any;\n\nstorageLocation = null;\nstorageLocation\
    \ = true;\nstorageLocation = {};\n```\n\nType is assignable to every type:\n\n\
    ```typescript\nfunction func(value: any) {\n  const a: null = value;\n  const\
    \ b: boolean = value;\n  const c: object = value;\n}\n```\n\nWith any we protection\
    \ that is normally given to us by TypeScript's static type system. Therefore,\
    \ it should only be used as a last resort, if we can't use more specific types\
    \ or unknown.\n\n#### 12.2.1 Example: JSON.parse()\n\nThe result of JSON.parse()\
    \ depends on dynamic input, which is why the return type is (I have omitted the\
    \ parameter reviver from the signature):\n\n```typescript\nJSON.parse(text: string):\
    \ any;\n```\n\nJSON.parse() was added to TypeScript before the type unknown existed.\
    \ Otherwise, the return type would probably be unknown.\n\n#### 12.2.2 Example:\
    \ String()\n\nThe function String(), which converts arbitrary values to strings,\
    \ has the following type signature:\n\n```typescript\ninterface StringConstructor\
    \ {\n  (value?: string): string; // call signature\n  ...\n}\n```\n\n### 12.3\
    \ The top type unknown\n\nThe type unknown is a type-safe version of the type\
    \ any. Whenever you are thinking of using any, try using unknown first.\n\nWhere\
    \ any allows us to do anything, unknown is much more restrictive.\n\nBefore we\
    \ can perform any operation on values of type unknown, we must first narrow their\
    \ types via:\n\n- Type assertions:\n```typescript\nfunction func(value: unknown)\
    \ {\n  // @ts-expect-error: Object is of type 'unknown'\n  value.toFixed(2);\n\
    \n  // Type assertion:\n  (value as number).toFixed(2); // OK\n}\n```\n\n- Equality:\n\
    ```typescript\nfunction func(value: unknown) {\n  // @ts-expect-error: Object\
    \ is of type 'unknown'\n  value * 5;\n\nif (value === 123) { // equality\n  //\
    \ .inferred-type: 123\n  value;\n\n  value * 5; // OK\n}\n}\n```\n\n- Type guards:\n\
    ```typescript\nfunction func(value: unknown) {\n  // @ts-expect-error: Object\
    \ is of type 'unknown'\n  value.length;\n\nif (typeof value === 'string') { //\
    \ type guard\n  // .inferred-type: string\n  value;\n\n  value.length; // OK\n\
    }\n}\n```\n\n- Assertion functions:\n```typescript\nfunction func(value: unknown)\
    \ {\n  // @ts-expect-error: Object is of type 'unknown'\n  value.test('abc');\n\
    }\n\nassertIsRegExp(value);\n\n// .inferred-type: RegExp\n\nvalue;\n\nvalue.test('abc');\
    \ // OK\n}\n\n/** An assertion function */\nfunction assertIsRegExp(arg: unknown):\
    \ asserts is RegExp {\n  if (! (arg instanceof RegExp)) {\n    throw new TypeError('Not\
