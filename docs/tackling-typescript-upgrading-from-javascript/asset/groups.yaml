    \ 类型推断\n\n### 16.4.7.5.2 允许多余属性：示例 .dateStr\n\n以下比较函数可以用于对具有 `.dateStr` 属性的对象排序：\n\
    \n```typescript\nfunction compareDateStrings(\n  a: {dateStr: string}, b: {dateStr:\
