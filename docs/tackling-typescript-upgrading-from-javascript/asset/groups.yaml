- md: "\n## 21.4 Overloading (advanced)\n\n### 21.4.2 Overloading via interfaces\n\
    \nIn interfaces, we can have multiple, different call signatures. That enables\
    \ us to use the interface GetFullName for overloading in the following example:\n\
    \n```typescript\ninterface GetFullName {\n  (customerOrMap: Customer): string;\n\
    \  (customerOrMap: Map<string, Customer>, id: string): string;\n}\n```\n\n```typescript\n\
    const GetFullName: GetFullName = (customerOrMap: Customer | Map<string, Customer>,\
    \ id?: string) => {\n  if (id === undefined) {\n    const customer = customerOrMap\
    \ as Map<string, Customer>.get(id);\n    if (customer === undefined) {\n     \
    \ throw new Error('Unknown ID: ' + id);\n    }\n    return customer.fullName;\n\
    \  } else {\n    if (id !== undefined) throw new Error();\n    return (customerOrMap\
    \ as Customer).fullName;\n  }\n};\n```\n\n### 21.4.3 Overloading on string parameters\
    \ (event handling etc.)\n\nIn the next example, we overload and use string types\
    \ (such as 'click'). That allows us to change the type of parameter listener depending\
    \ on the value of parameter type:\n\n```typescript\nfunction addEventListener(elem:\
    \ HTMLElement, type: 'click',\n  listener: (event: MouseEvent) => void): void;\n\
    function addEventListener(elem: HTMLElement, type: 'keypress',\n  listener: (event:\
    \ KeyboardEvent) => void): void;\nfunction addEventListener(elem: HTMLElement,\
    \ type: string, // (A)\n  listener: (event: any) => void): void {\n  elem.addEventListener(type,\
    \ listener); // (B)\n}\n```\n\nIn this case, it is relatively difficult to get\
    \ the types of the implementation (starting in line A) so that the statement in\
    \ the body (line B) works. As a last resort, we can always use the type any.\n\
    \n## 21.4.4 Overloading methods\n\n#### 21.4.4.1 Overloading concrete methods\n\
    \nThe next example demonstrates overloading of methods: Method .add() is overloaded.\n\
    \n```typescript\nclass StringBuilder {\n  #data = '';\n\n  add(num: number): this;\n\
    \  add(bool: boolean): this;\n  add(str: string): this;\n  add(value: any): this\
    \ {\n    this.#data += String(value);\n    return this;\n  }\n\n  toString() {\n\
    \    return this.#data;\n  }\n}\n```\n\n```typescript\nconst sb = new StringBuilder();\n\
    sb.add('I can see ')\n  .add(3)\n  .add(' monkeys!');\nassert.equal(\n  sb.toString(),\
    \ 'I can see 3 monkeys!'\n);\n```\n\n#### 21.4.2 Overloading interface methods\n\
    \nThe type definition for Array.from() is an example of an overloaded interface\
    \ method:\n\n```typescript\ninterface ArrayConstructor {\n  from<T>(arrayLike:\
    \ ArrayLike<T>): T[];\n  from<T, U>(\n    arrayLike: ArrayLike<T>,\n    mapfn:\
    \ (v: T, k: number) => U,\n    thisArg?: any\n  ): U[];\n}\n```\n\n- In the first\
    \ signature, the returned Array has the same element type as the parameter.\n\
    - In the second signature, the elements of the returned Array have the same type\
    \ as the result of mapfn. This version of Array.from() is similar to Array.prototype.map().\n\
    \n## 21.5 Assignability (advanced)\n\nIn this section we look at the type compatibility\
    \ rules for assignability: Can functions of type Src be transferred to storage\
    \ locations (variables, object properties, parameters, etc.) of type Trg?\n\n\
    Understanding assignability helps us answer questions such as:\n\n- Given the\
    \ function type signature of a formal parameter, which functions can be passed\
    \ as actual parameters in function calls?\n- Given the function type signature\
    \ of a property, which functions can be assigned to it?\n\n### 21.5.1 The rules\
    \ for assignability\n\nIn this subsection, we examine general rules for assignability\
    \ (including the rules for functions). In this subsection, we explore what those\
    \ rules mean for functions.\n\nA Src is assignable to a type Trg if any of the\
    \ following conditions is true:\n\n- Src and Trg are identical types.\n- Src or\
    \ Trg is any type.\n- Src is a string literal and Trg is the primitive String.\n\
    - Src is a union type and each constituent of Src is assignable to Trg.\n- Src\
    \ and Trg are function types:\n  - Trg has a rest parameter or the number of required\
    \ parameters of Src is less than or equal to the total number of parameters of\
    \ Trg.\n  - For parameters that are present in both signatures, each parameter\
    \ type in Trg is assignable to the corresponding parameter type in Src.\n  - The\
    \ return type of Trg is void or the return type of Src is assignable to the return\
    \ type of Trg.\n- (Remaining cases omitted.)\n\n### 21.5.2 Consequences of the\
    \ assignment rules for functions\n\nIn this subsection, we look at what the assignment\
    \ rules mean for the following two functions targetFunc and sourceFunc:\n\n```typescript\n\
    const targetFunc: Trg = sourceFunc;\n```\n\n#### 21.5.2.1 Types of parameters\
    \ and results\n\n- Target parameter types must be assignable to corresponding\
    \ source parameter types.\n  - Anything that the target accepts must also be accepted\
    \ by the source.\n- The source return type must be assignable to target return\
    \ type.\n  - Anything that the source returns must be compatible with expectations\
    \ set by the target.\n\nExample:\n```typescript\nconst trg1: (x: RegExp) => Object\
    \ = (x: Object) => abc;\n```\n\nThe following example demonstrates that if the\
    \ return type is void, then the source return type doesn't matter. Why?\n```typescript\n\
    const trg2: () => void = () => new Date();\n```\n\n#### 21.5.2.2 Numbers of parameters\
    \ than the target\n\nThe source must not have more parameters than the target:\n\
    \n```typescript\n// @ts-expect-error: Type '(x: string) => string' is not assignable\
    \ to type () => 'string'.\nconst trg3: () => string = (x: string) => abc;\n```\n\
    \nThe source can have fewer parameters than the target:\n```typescript\nconst\
    \ trg4: () => string = (x: string) => abc;\n```\nWhy is that? The target specifies\
    \ expectations for the source: it must accept the parameter (but it ignores it).\
    \ This permissiveness enables:\n```typescript\n['a', 'b'].map(x => x + x)\n```\n\
    The callback for .map() has only one of the three parameters mentioned in the\
    \ type signature of .map():\n```typescript\nmap<(\n  value: T, index: number,\
    \ array: T[]) => U,\n  thisArg?: any\n): U[];\n```\n\n## 21.6 Further reading\
    \ and sources\n\n- TypeScript Handbook\n- TypeScript Language Specification\n\
    - “Callable values” in “JavaScript for impatient”\n\n## 22 Type assertions (related\
    \ to casting)\n\nThis chapter is about type assertions in TypeScript, which are\
    \ related to type casts in other languages and performed via the operator.\n\n\
    ### 22.1 Type assertions\n\nType assertion lets us override a static type that\
    \ TypeScript has computed for a value. That is useful for working around limitations\
    \ of the type system. Type assertions are related to type casts in other languages,\
    \ but they don't throw exceptions and don't do runtime (they do a few checks statically).\n\
    \n```typescript\nconst data: object = ['a', 'b', 'c']; // (A)\n\n// @ts-expect-error:\
    \ Property 'length' does not exist on type 'object'\ndata.length; // (B)\n\nassert.equal(\n\
    \  (data as Array<string>).length, 3); // (C)\n```\n\n- In line A, we widen the\
    \ type of the Array to object.\n- In line B, we see that this type doesn't let\
    \ us access properties (details).\n- In line C, we use a type assertion (the operator\
    \ as) to tell TypeScript data is an Array. We can access property .length.\n\n\
    Type assertions are a last resort and should be avoided as much as possible. They\
    \ (temporarily) remove the safety that the static type system gives us.\n\nNote\
    \ that, in line A, we override TypeScript's static type. But we did it via a type\
    \ annotation. Overriding is much safer than type assertions because we are much\
    \ more constrained: TypeScript's type must be assignable to the type of the annotation.\n\
    \n#### 22.1.1 Alternative syntax for type assertions\n\nTypeScript has an alternative\
    \ “angle-bracket” syntax for type assertions:\n\n```typescript\n<Array<string>>data\n\
    ```\n\nI recommend avoiding this syntax. It has grown out of style and is not\
    \ compatible with React JSX code (in .ts files).\n\n#### 22.1.2 Example: asserting\
    \ an interface\n\nIn order to access property .name of an arbitrary object obj,\
    \ we temporarily change the static type of obj to Named (line A and line B).\n\
    \n```typescript\ninterface Named {\n  name: string;\n}\nfunction getName(obj:\
    \ object): string {\n  if ((obj as Named).name === 'string') { // (A)\n    return\
    \ (obj as Named).name; // (B)\n  }\n  return ('Unnamed');\n}\n```\n\n#### 22.1.3\
    \ Example: asserting an index signature\n\nIn the following code (line A), we\
    \ use the type assertion as Dict, so that we can access the properties of a value\
    \ whose type is object. That is, we are overriding the static type obj with the\
    \ static type Dict.\n\n```typescript\ntype Dict = {[k:string]: any};\n```\n\n\
    ```typescript\nfunction getPropertyValue(dict: unknown, key: string): any {\n\
    \  if (typeof dict === 'object' && dict != null && key in dict) {\n    // inferred-type:\
    \ object\n    dict;\n  }\n}\n// @ts-expect-error: Element implicitly has an 'any'\
    \ type because\n```"
  mdcn: "\n\n## 21.4 重载（进阶）\n\n### 21.4.2 通过接口重载\n\n在接口中，我们可以拥有多个不同的调用签名。这使得我们能够在能够在下面的示例中使用\
    \ `GetFullName` 接口进行重载：\n\n```typescript\ninterface GetFullName {\n  (customerOrMap:\
    \ Customer): string;\n  (customerOrMap: Map<string, Customer>, id: string): string;\n\
    }\n```\n\n```typescript\nconst GetFullName: GetFullName = (customerOrMap: Customer\
    \ | Map<string, Customer>, id?: string) => {\n  if (id === undefined) {\n    const\
    \ customer = customerOrMap as Map<string, Customer>.get(id);\n    if (customer\
    \ === undefined) {\n      throw new Error('Unknown ID: ' + id);\n    }\n    return\
    \ customer.fullName;\n  } else {\n    if (id !== undefined) throw new Error();\n\
    \    return (customerOrMap as Customer).fullName;\n  }\n};\n```\n\n### 21.4.3\
    \ 字符串参数重载（事件处理等）\n\n在下一个示例中，我们重载并使用了字符串类型（如 'click'）。这允许我们根据参数类型的值更改参数监听器的类型：\n\
    \n```typescript\nfunction addEventListener(elem: HTMLElement, type: 'click',\n\
    \  listener: (event: MouseEvent) => void): void;\nfunction addEventListener(elem:\
    \ HTMLElement, type: 'keypress',\n  listener: (event: KeyboardEvent) => void):\
    \ void;\nfunction addEventListener(elem: HTMLElement, type: string, // (A)\n \
    \ listener: (event: any) => void): void {\n  elem.addEventListener(type, listener);\
    \ // (B)\n}\n```\n\n在这种情况下，要获取实现部分的类型（从 A 行开始）以便正体中的语句（B 行）正常工作是比较困难的。作为最后手段，我们始终可以使用\
    \ `any` 类型。\n\n## 21.4.4 重载方法\n\n#### 21.4.4.1 重载具体方法\n\n下一个示例演示了方法的重载：方法 `.add()`\
    \ 被重载了。\n\n```typescript\nclass StringBuilder {\n  #data = '';\n\n  add(num: number):\
    \ this;\n  add(bool: boolean): this;\n  add(str: string): this;\n  add(value:\
    \ any): this {\n    this.#data += String(value);\n    return this;\n  }\n\n  toString()\
    \ {\n    return this.#data;\n  }\n}\n```\n\n```typescript\nconst sb = new StringBuilder();\n\
    sb.add('I can see ')\n  .add(3)\n  .add(' monkeys!');\nassert.equal(\n  sb.toString(),\
    \ 'I can see 3 monkeys!'\n);\n```\n\n#### 21.4.2 重载接口方法\n\n`Array.from()` 的类型定义是一个重载接口方法的示例：\n\
    \n```typescript\ninterface ArrayConstructor {\n  from<T>(arrayLike: ArrayLike<T>):\
    \ T[];\n  from<T, U>(\n    arrayLike: ArrayLike<T>,\n    mapfn: (v: T, k: number)\
    \ => U,\n    thisArg?: any\n  ): U[];\n}\n```\n\n- 在第一个签名中，返回的 Array 的元素类型与参数相同。\n\
    - 在第二个签名中，返回的 Array 的元素类型与 `mapfn` 的结果相同。此版本的 `Array.from()` 与 `Array.prototype.map()`\
    \ 类似。\n\n## 21.5 可赋值性（进阶）\n\n在本节中，我们查看赋值性的类型兼容规则：类型为 `Src` 的函数是否可以转换为类型为 `Trg`\
    \ 的存储位置（变量、对象属性、参数等）？\n\n理解赋值性有助于我们回答诸等问题：\n\n- 给定形式参数的函数类型签名，哪些函数可以作为实际参数传递函数调用？\n\
    - 给定属性的函数类型签名，哪些函数可以赋值给它？\n\n### 21.5.1 可赋值性规则\n\n在本小节中，我们检查可赋值性的通用规则（包括函数的规则）。在本小节中，我们探索这些规则对函数意味着什么。\n\
    \n如果满足以下任何条件，则 `Src` 可赋值给类型 `Trg`：\n\n- `Src` 和 `Trg` 是完全相同的类型。\n- `Src` 或 `Trg`\
    \ 是 `any` 类型。\n- `Src` 是字符串字面量且 `Trg` 是原始类型 `String`。\n- `Src` 是联合类型且 `Src` 的每个组成部分都可赋值给\
    \ `Trg`。\n- `Src` 和 `Trg` 是函数类型：\n  - `Trg` 具有剩余参数，或者 `Src` 的必需参数数量小于或等于 `Trg`\
    \ 的参数总数。\n  - 对于在两个签名中都存在的参数，`Trg` 中的每个参数类型都可赋值给 `Src` 中对应的参数类型。\n  - `Trg` 的返回类型为\
    \ `void` 或者 `Src` 的返回类型可赋值给 `Trg` 的返回类型。\n- （其余情况省略。）\n\n### 21.5.2 函数赋值规则的后果\n\
    \n在本小节中，我们查看赋值规则对以下两个函数 `targetFunc` 和 `sourceFunc` 意味着什么：\n\n```typescript\n\
    const targetFunc: Trg = sourceFunc;\n```\n\n#### 21.5.2.1 参数和结果的类型\n\n- 目标参数类型必须赋值给对应的源参数类型。\n\
    \  - 目标接受的任何内容源也必须接受。\n- 源返回类型必须赋值给目标返回类型。\n  - 源返回的任何内容必须与目标设定的预期兼容。\n\n示例：\n\
    ```typescript\nconst trg1: (x: string) => any = (x: number) => x;\n```\n\n（注：原文此处似乎存在截断或错乱，已按原文结构翻译）\n\
    \n"
