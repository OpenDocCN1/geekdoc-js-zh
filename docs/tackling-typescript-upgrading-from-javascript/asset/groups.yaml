    \ 149\n\n在本章中，我们将研究 TypeScript 中类定义是如何工作的：\n\n- 首先，我们查看原生 JavaScript 中类定义的特性。\n\
    - 然后，我们探索 TypeScript 为此带来的额外功能。\n\n## 17.1 快速查表：原生 JavaScript 中的类\n\n本节是原生 JavaScript\
    \ 中类定义的快速查表。\n\n### 17.1.1 类的基本成员\n\n```typescript\nclass OtherClass {}\n\nclass\
    \ MyClass1 extends OtherClass {\n  publicInstanceField = 1;\n\n  constructor()\
    \ {\n    super();\n  }\n\n  prototypeMethod() {\n    return 2;\n  }\n}\n\nconst\
    \ inst1 = new MyClass1();\nassert.equal(inst1.publicInstanceField, 1);\nassert.equal(inst1.prototypeMethod(),\
    \ 2);\n```\n\n接下来的章节将关于修饰符。\n最后，有一个表格显示了修饰符如何组合。\n\n### 17.1.2 修饰符：static\n\n\
    ```typescript\nclass MyClass2 {\n  static staticPublicField = 1;\n\n  static staticPublicMethod()\
    \ {\n    return 2;\n  }\n}\n\nassert.equal(MyClass2.staticPublicField, 1);\nassert.equal(MyClass2.staticPublicMethod(),\
    \ 2);\n```\n\n### 17.1.3 类似修饰符名前缀：# (private)\n\n```typescript\nclass MyClass3\
    \ {\n  #privateField = 1;\n\n  #privateMethod() {\n    return 2;\n  }\n\n  static\
    \ accessPrivateMembers() {\n    // 私有成员只能在类定义内部访问\n    const inst3 = new MyClass3();\n\
    \    assert.equal(inst3.privateField, 1);\n    assert.equal(inst3.privateMethod(),\
    \ 2);\n  }\n}\n\nMyClass3.accessPrivateMembers();\n```\n\n针对 JavaScript 的警告：\n\
    \n- 目前对私有方法的支持有限。\n- 私有字段的范围更广，但也存在局限。\n\nTypeScript 从 3.8 版本开始一直支持私有字段，但目前不支持私有方法。\n\
    \n### 17.1.4 访问修饰符：get (getter) 和 set (setter)\n\n粗来说，访问器是通过访问属性时调用的方法。访问器有两种类型：getter\
    \ 和 setter。\n\n```typescript\nclass MyClass5 {\n  #name = 'Rumpelstiltskin';\n\
    \n  /** 原型 getter */\n  get name() {\n    return this.#name;\n  }\n\n  /** 原型\
    \ setter */\n  set name(value) {\n    this.#name = value;\n  }\n}\nconst inst5\
    \ = new MyClass5();\nassert.equal(inst5.name, 'Rumpelstiltskin'); // getter\n\
    inst5.name = 'Queen'; // setter\nassert.equal(inst5.name, 'Queen'); // getter\n\
    ```\n\n### 17.1.5 方法修饰符：* (generator)\n\n```typescript\nclass MyClass6 {\n  *\
    \ publicPrototypeGeneratorMethod() {\n    yield 'hello';\n    yield 'world';\n\
    \  }\n}\nconst inst6 = new MyClass6();\n```\n\n### 17.1.6 方法修饰符：async\n\n```typescript\n\
    class MyClass7 {\n  async publicPrototypeMethod() {\n    const result = await\
    \ Promise.resolve('abc');\n    return result;\n  }\n}\n```\n\n### 17.1.7 计算类成员名\n\
    \n```typescript\nclass MyClass8 {\n  [ 'InstanceField'] = 1;\n\n  [ 'prototypeMethod']()\
    \ {\n    return 2;\n  }\n}\n```\n\n### 17.1.8 修饰符的组合\n\n| 修饰符 | 访问器 | Async |\
    \ 生成器 | 可见性 |\n| :--- | :---: | :---: | :---: | :---: |\n| static | | | | |\n\
    | get | X | | | |\n| set | X | | | |\n| private | | | | |\n\n### 17.1.9 底层原理\n\
    \n需要记住在使用类时，有两个原型链：\n\n- 实例链：从实例开始。\n- 静态链：从该实例的类开始。\n\n考虑以下原生 JavaScript 示例：\n\
    \n```javascript\nclass ClassA {\n  static staticMthdA() {}\n}\n```\n\n"
