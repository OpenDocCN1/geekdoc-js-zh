    This chapter gives tips for quickly trying out TypeScript.


    # ## 5.1 The TypeScript Playground


    The TypeScript Playground is an editor for TypeScript code. Features include:


    +   * Supports full IDE-style editing: auto-completion, etc.


    The Playground is very useful for quick experiments and demos. It can save both-TypeScript
    code snippets and compiler settings into URLs, which is great for sharing snippets
    with others. This is an example of such a URL:


    https://www.typescript.org/play/#code=MEwdwgzLgBFDuLyBGTBGEGAKHgHmCdCdeW2AsgwD4YCb0BggChXRIQABFA04ymBmHRYA5AEMARsAkUkZIA


    # ## 5.2 TS Node


    TS Node is a TypeScript version of Node.js. Its use cases are:


    +   * TS Node provides a REPL (command line) for TypeScript:


    ```

    $ ts-node

    > const twice = (x: string) => x + x;

    > twice(''abc'')

    > ''abc''

    ```'
