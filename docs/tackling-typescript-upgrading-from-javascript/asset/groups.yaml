    \ The top type unknown | 74 |\n\nIn TypeScript, any and unknown are types that\
    \ contain all values. In this chapter, we examine what they are and what they\
    \ can be used for.\n\n# ## 12.1 TypeScript's two top types\n\nany and unknown\
    \ are so-called *top types* in TypeScript. Quoting Wikipedia:\n\n> The top type\
    \ [...] is the universal type, sometimes called the *universal supertype* as all\
    \ other types in any given system are subtypes [...]. In most cases it is the\
    \ type which contains every possible [value] in the type system of interest.\n\
    \nThat is, when viewing types as sets of values (for more information on what\
    \ types are, see §11 \"What is a type in TypeScript? Two perspectives\"), any\
    \ and unknown are sets that contain all values. As an aside, TypeScript also has\
    \ the *bottom type* never, which is the empty set.\n\n\n# ## 12.2 The top type\
    \ any\n\nIf a value type any, we can do everything with it:\n\n```\nfunction func(value:\
    \ any) {\n  // Only allowed for numbers, but they are a subtype of `any`\n  5\
    \ * value;\n}\n```"
