    \    value;\n  }\n\n  if (Array.isArray(value)) {\n    // %inferred-type: number[]\n\
    \    value;\n  }\n}\n```\n\nNote how the static type of value is narrowed inside\
    \ the then-blocks.\n\n# 23.2.3 Checking for distinct properties via the operator\
