    \ 数组的 `const` 断言与类型推断 171\n- 20.4 阱：TypeScript 假设索引永远不会越界 172\n\n在本章中，我们将研究在 TypeScript\
    \ 中如何对数组进行类型化。\n\n## 20.1 数组的角色\n\n数组在 JavaScript 中可以扮演以下角色（其一或混合）：\n\n- 列表（Lists）：所有元素具有相同类型。数组的长度可变。\n\
    - 元组（Tuple）：数组的长度固定。元素不一定具有相同类型。\n\nTypeScript 通过提供多种数组类型化的方式来适应这两个角色。接下来我们将查看。\n\
    \n## 20.2 数组类型化的方式\n\n### 20.2.1 数组角色“列表”：数组类型字面量 vs 接口类型 Array\n\n数组类型字面量由元素类型后\
    \ `[]` 组成。在下面的代码中，数组类型字面量是 `string[]`：\n\n```typescript\n// 每个数组元素类型为 `string`;\n\
    const myArrayArray: string[] = ['fee', 'fi', 'fo', 'fum'];\n```\n\n数组类型是全局泛型接口类型\
    \ `Array` 的简写：\n\n```typescript\nconst myArrayArray: Array<string> = ['fee', 'fi',\
    \ 'fo', 'fum'];\n```\n\n如果元素类型更复杂，我们需要为数组类型字面量加上括号：\n\n```typescript\n(number|string[])\n\
    (() => boolean[])\n```\n\n泛型类型 `Array` 在这种情况下效果更好：\n\n```typescript\nArray<number|string>\n\
    Array<() => boolean>\n```\n\n### 20.2.2 数组角色“元组”：元组类型字面量\n\n如果数组具有固定长度，且每个元素都有取决于其位置的不同固定类型，那么我们可以使用元组字面量，例如\
    \ `[string, string, boolean]`：\n\n```typescript\nconst yes: [string, string, boolean]\
    \ = ['oui', 'si', true];\n```\n\n### 20.2.3 同样是类数组的对象：带有索引签名的接口\n\n如果一个接口只有一个索引签名，我们可以将其用于数组：\n\
    \n```typescript\ninterface StringArray {\n  [index: number]: string;\n}\nconst\
    \ strArr: StringArray = ['Huey', 'Dewey', 'Louie'];\n```\n\n同时具有索引签名和属性签名的接口仅适用于对象（因为索引元素和属性需要同时定义）：\n\
    \n```typescript\ninterface FirstNamesAndLastName {\n  [index: number]: string;\n\
    \  lastName: string;\n}\n\nconst names: FirstNamesAndLastName = {\n  0: 'Huey',\n\
    \  1: 'Dewey',\n  2: 'Louie',\n  lastName: 'Duck'\n};\n```\n\n## 20.3 阱：类型推断并不总是能正确获取数组类型\n\
    \n### 20.3.1 推断数组的类型很困难\n\n由于数组的两个角色，TypeScript 无法总是猜出正确的类型。例如，考虑以下赋值给变量 `fields`\
    \ 的数组字面量：\n\n```typescript\nconst fields: Fields = [\n  ['first', 'string', true],\n\
    \  ['last', 'string', true],\n  ['age', 'number', false],\n];\n```\n\n`fields`\
    \ 的最佳类型是什么？以下都是合理的选择：\n\n```typescript\ntype Fields = Array<string, string, boolean>;\n\
    \ntype Fields = Array<string|'string'|number, boolean>;\n\ntype Fields = Array<Array<string|boolean>>;\n\
    \ntype Fields = [\n  [string, string, boolean],\n  [string, string, boolean],\n\
    \  [string, string, boolean],\n];\n\ntype Fields = Array<string|boolean>;\n\n\
    type Fields = Array<string|boolean>;\n```\n\n### 20.3.2 非空数组字面量的类型推断\n\n当我们使用非空数组字面量时，TypeScript\
    \ 默认推断为元组（而不是数组）：\n\n```typescript\n// //inferred-type: [number, number]\nconst\
    \ arr = [1, 2];\n```\n\n这不是我们想要的，赋值给变量时会报错：\n\n```typescript\nfunction func(p:\
    \ [number, number]) {\n  return p;\n}\n// //inferred-type: number[]\nconst pairl\
    \ = [1, 2];\n\nfunc(pairl); // 错误：类型不匹配\n```\n```\n\n我们可以通过为声明添加类型注解来修复此：\n\n\
    ```typescript\nconst pair2: [number, number] = [1, 2]; // OK\n```\n\n### 20.3.3\
    \ 空数组字面量的类型推断\n\n如果我们用空数组字面量初始化，TypeScript 最初推断类型为 `any[]`：\n\n```typescript\n\
    // //inferred-type: any[]\nconst arr = [];\n```\n\n相反，如果数组字面量至少有一个元素，那么类型是固定的且不会改变：\n\
    \n```typescript\n// //inferred-type: number[]\nconst arr = [123];\n```\n\n###\
    \ 20.3.4 数组的 `const` 断言与类型推断\n\n我们可以可以在数组字面量后加上 `const` 断言：\n\n```typescript\n\
    // //inferred-type: readonly ['igneous', 'metamorphic', 'sedimentary']\nconst\
    \ rockCategories = ['igneous', 'metamorphic', 'sedimentary'] as const;\n```\n\n\
    我们声明 `rockCategories` 不改变。这产生了以下影响：\n\n- 数组变为只读——我们无法使用更改的操作：\n  // //ts-expect-error:\
    \ Property 'push' does not exist on\n  // 'readonly ['igneous', 'metamorphic',\
    \ 'sedimentary']'. (2339)\n  rockCategories.push('sand');\n- TypeScript 推断出一个元组：\n\
    \  // //inferred-type: string[]\n  const rockCategories2 = ['igneous', 'metamorphic',\
    \ 'sedimentary'];\n- TypeScript 推断字面量类型（如 `'igneous'`）而不是泛型类型。导致推断的元组不是 `[string,\
    \ string, string]`。\n\n这里有更多带断言的数组字面量示例：\n\n```typescript\n// //inferred-type:\
    \ readonly [1, 2, 3, 4]\nconst number1 = [1, 2, 3, 4] as const;\n// //inferred-type:\
    \ number[]\nconst number2 = [1, 2, 3, 4];\n```\n\n```typescript\n// //inferred-type:\
    \ readonly [true, 'abc']\nconst booleanAndString = [true, 'abc'] as const;\n//\
    \ //inferred-type: string | boolean[]\nconst booleanAndString2 = [true, 'abc'];\n\
    ```\n\n### 20.3.4.1 `const` 断言的潜在陷阱\n\n`const` 断言有两个潜在的陷阱。\n\n首先，推断类型尽可能窄。这为 `let`\
    \ 声明的变量带来了问题：我们无法赋值除初始化时使用的其他元组：\n\n```typescript\nlet arr = [1, 2] as const;\n\
    ```\n\n```typescript\narr = [1, 2]; // OK\n// //ts-expect-error: Type '3' is not\
    \ assignable to type '2'. (2322)\narr = [1, 3];\n```\n\n其次，通过 `as const` 声明的元组不能被变异：\n\
    \n"
