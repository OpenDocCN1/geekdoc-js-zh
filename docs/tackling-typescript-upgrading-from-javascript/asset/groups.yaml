  - "[PAGE 72]\n\n11.4 Nominal type systems vs. structural type systems\n\n```\n//\
    \ // %inferred-type: number[]\narr;\n\narr.push('abc');\n// %inferred-type: (string\
    \ | number)[]\narr;\n```\n\n# 11.4 Nominal type systems vs. structural type systems\n\
    \nOne of the responsibilities of a static type system is to determine if two static\
    \ types are compatible:\n\n+   - The static type Src of an actual parameter (e.g.,\
    \ provided via a function call)\n- The static type Trg of the corresponding formal\
    \ parameter (e.g., specified as part of a function definition)\n\nThis often means\
    \ checking if Src is a subtype of Trg. Two approaches for this check are (roughly):\n\
    \n+   - In a nominal or nominative type system, two static types are equal if\
    \ they have the same identity (\"name\"). One type is a subtype of another if\
    \ their subtype relation is defined explicitly.\n- Languages with nominal typing\
    \ are C++, Java, C#, Swift, and Rust.\n- In a structural type system, two static\
    \ types are equal if they have the same structure (if their parts have the same\
    \ names and types). One type Sub is a subtype of Sup if all parts of Sup (and\
    \ possibly others) and each part of Sub is a subtype of the corresponding part\
    \ of Sup.\n- Languages with structural typing are OCaml/ReasonML and TypeScript.\n\
    \nThe following code produces a type error in line A with nominal type systems,\
    \ but is legal with TypeScript's structural type system because class A and class\
    \ B have the same structure:\n\n```\nclass A {\n  name = 'A';\n}\nclass B {\n\
    \  name = 'B';\n}\nconst someVariable:A = new B(); // (A)\n```\n\nTypeScript's\
    \ interfaces also work structurally – they don't have to be implemented in order\
    \ to match:\n\n```\ninterface Point {\n  x: number;\n  y: number;\n}\nconst point:\
    \ Point = {x: 1, y: 2}; // OK\n```"
