    \  translate(dict, 'maybe'),\n  'tal vez');\n```\n\n## 16.4.5.1 索引签名\n\n索引签名键必须是字符串或数字：\n\
    \n- 不允许符号（Symbols）。\n- 不允许联合类型（例如：number）。\n\n## 16.4.5.2 字符串键\n\n就像 JavaScript\
