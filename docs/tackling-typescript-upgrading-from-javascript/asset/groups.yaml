  - "[PAGE 195]\n\n23 Type guards and assertion functions\n\n# 23.7 @hgoss/guards:\
    \ library with type guards\n\nIn TypeScript, a value can have a type that is too\
    \ general for some operations – for example, a union type. This chapter answers\
    \ the following questions:\n\n+   - **What is narrowing of types?**\n  - Spoiler:\
    \ Narrowing means changing the static type T of a storage location (such as a\
    \ value or a property) For example, it is often useful to narrow the type null|string\
    \ to the type string.\n- **What are type guards and assertion functions and how\
    \ can we use them to narrow types?**\n  - Spoiler: typeof and instanceof are type\
    \ guards.\n\n# 23.1 When are static types too general?\n\nTo see how a static\
    \ type can be too general, consider the following function getScore:\n\n```\n\
    assert.equal(\n  getScore('******'), 5);\nassert.equal(\n  getScore(3), 3);\n\
    ```\n\nThe skeleton of getScore() looks as follows:\n\n```\nfunction getScore(value:\
    \ number|string): number {\n  // ...\n}\n```\n\nInside the body of getScore(),\
    \ we don't know the type of the value number or string. Before we do, we can't\
    \ really work with value.\n\n# 23.1.1 Narrowing if value and type guards\n\nThe\
    \ solution is to check the type of value at runtime, via typeof (line A and line\
    \ B):\n\n```\nfunction getScore(value: number|string): number {\n  if (typeof\
    \ value === 'number') { // (A)\n    // inferred-type: number\n    value:\n   \
    \ return value;\n  }\n  if (typeof value === 'string') { // (B)\n    // inferred-type:\
    \ string\n    value:\n    return value.length;\n  }\n  throw new Error('Unsupported\
    \ value: ' + value);\n}\n```\n\nIn this chapter, we interpret types as sets of\
    \ values. (For more information on this interpretation and another one, see §11\
    \ “What is a type in TypeScript? Two perspectives\\)."
  - "[PAGE 196]\n\n# 23.1 When are static types too general?\n\nInside the then-blocks\
    \ starting in line A and line B, the static type of value changes, due to the\
