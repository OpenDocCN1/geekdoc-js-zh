    \ | 'a'>;\n```\n\n## 25.4.2 Mapped types\n\nA *mapped type* produces an object\
    \ by looping over a collection of keys – for example:\n\n```typescript\n// %inferred-type:\
    \ { a: number; b: number; c: number }\ntype Result = {\n  [K in 'a' | 'b' | 'c']:\
    \ number;\n};\n```\n\nThe operator is a crucial part of mapped type: It specifies\
    \ the keys for the object literal from.\n\n## 25.4.2.1 Built-in utility type:\
    \ Pick<T, K>\n\nThe following built-in utility type lets us create a new object\
    \ by specifying which properties of an existing object we want to keep:\n\n```typescript\n\
    /** From T, pick a set of properties whose keys are in the union */\ntype Pick<T,\
    \ K> = {\n  [P in K]: T[P]\n};\n```\n\nIt is used as follows:\n\n```typescript\n\
    ObjectLiteral = {\n  a: 1,\n  b: 2,\n  c: 3,\n  d: 4,\n};\n```\n\n## 25.4.2.2\
    \ Built-in utility type: Omit<T, K>\n\nThe built-in utility type creates a new\
    \ object by specifying which properties of an existing object we want to omit:\n\
    \n```typescript\n/** Construct a type with the properties of T except for those\
    \ in K */\ntype Omit<T, K> = {\n  [P in Exclude<keyof T, K>]?:;\n};\n```\n\nExplanations:\n\
    - `K extends keyof T` means that K is a subtype of the type of all keys.\n- `Exclude<T,\
    \ K>` means: takes the keys of T and remove all values mentioned in K.\n\n## 25.5.1\
    \ The index operator\n\nWe have already encountered the keyof operator. It lists\
    \ the property keys of an object type:\n\n```typescript\ntype Obj = {\n  a: number;\n\
    \  b: number;\n  c: number;\n  d: number;\n}\n}\n```\n\nApplying keyof to a tuple\
    \ type has a result that may be unexpected:\n\n```typescript\n// %inferred-type:\
    \ 0 | 1 | 2\ntype Result = keyof ['a', 'b', 'c'];\n```\n\nThe results:\n- \"a\"\
    \ | \"b\" | \"c\" | \"d\" - The property keys of an object literal.\n- The indices\
    \ of the tuple elements, strings.\n- The name of the special property `length`.\n\
    \nKeysOfObj includes the type number because keys are a set of string keys in\
    \ JavaScript. Tuples also support indexed access:\n\n```typescript\ntype Tuple\
    \ = ['a', 'b', 'c', 'd'];\n```\n\n```typescript\n// %inferred-type: \"a\" | \"\
    b\"\ntype Elements = Tuple[0 | 1];\n```\n\nThe bracket operator is also distributive:\n\
    \n```typescript\ntype MyType = { prop: 1 } | { prop: 2 } | { prop: 3 };\n```\n\
    \n```typescript\n// %inferred-type: 1 | 2 | 3\ntype Result1 = MyType['prop'];\n\
    ```\n\n```typescript\n// Equivalent:\ntype Result2 = {\n|{ prop: 1 }['prop'] |\n\
    |{ prop: 2 }['prop'] |\n|{ prop: 3 }['prop']\n};\n```\n\n## 25.5.2 The indexed\
    \ access operator T[K]\n\nThe indexed access operator T[K] returns the type of\
    \ all properties of T whose keys are assignable to K. T[K] is also called a lookup\
    \ type. These are examples of the operator used:\n\n```typescript\ntype Obj =\
    \ {\n  0: 'a',\n  1: 'b',\n  prop0: 'c',\n  prop1: 'd'\n};\n```\n\n```typescript\n\
    // %inferred-type: \"a\" | \"b\"\ntype Result1 = Obj[0 | 1];\n```\n\n```typescript\n\
    // %inferred-type: \"c\" | \"d\"\ntype Result2 = Obj['prop0' | 'prop1'];\n```\n\
    \n## 25.5 Other operators\n\n```typescript\n// %inferred-type: \"a\" | \"b\" |\
    \ \"c\" | \"d\"\ntype Result3 = Obj[keyof Obj];\n```\n\nThe types in brackets\
    \ must be assignable to the type of all property keys (keyof). That's why Obj[number]\
    \ and 'Obj[string]' are not allowed. However, we can use number and string index\
    \ types if the indexed type has an index signature (line A):\n\n```typescript\n\
    type Obj = {\n  [key: string]: RegExp, // (A)\n};\n```\n\n```typescript\n// %inferred-type:\
    \ string | number\ntype KeysOfObj = keyof Obj;\n```\n\n```typescript\n// %inferred-type:\
    \ RegExp\ntype ValuesOfObj = Obj[string];\n```\n\nKeysOfObj includes the type\
    \ number because keys are a set of string keys in JavaScript. Tuples also support\
    \ indexed access:\n\n```typescript\ntype Tuple = ['a', 'b', 'c', 'd'];\n```\n\n\
    ```typescript\n// %inferred-type: \"a\" | \"b\"\ntype Elements = Tuple[0 | 1];\n\
    ```\n\nThe bracket operator is also distributive:\n\n```typescript\ntype MyType\
    \ = { prop: 1 } | { prop: 2 } | { prop: 3 };\n```\n\n```typescript\n// %inferred-type:\
    \ 1 | 2 | 3\ntype Result1 = MyType['prop'];\n```\n\n```typescript\n// Equivalent:\n\
    type Result2 = {\n|{ prop: 1 }['prop'] |\n|{ prop: 2 }['prop'] |\n|{ prop: 3 }['prop']\n\
    };\n```\n\nThis makes sense if we remember that A & B have the properties of both\
    \ A and B. A and B have only property in common, which explains Result2.\n\n##\
    \ 25.5.3 The type query operator typeof\n\nThe type typeof converts a (JavaScript)\
    \ value to its (TypeScript) type. Its operand must be an identifier or a sequence\
    \ of dot-separated identifiers:\n\n```typescript\nconst str = 'abc';\n```\n\n\
    ```typescript\n// %inferred-type: \"abc\"\ntype Result = typeof str;\n```\n\n\
