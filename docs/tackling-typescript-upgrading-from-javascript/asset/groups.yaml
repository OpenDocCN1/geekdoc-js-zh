    (This approach is an idea by Ran Lottem.)\n\n# 23.4 Assertion functions\n\nAn\
    \ assertion function checks if its parameter fulfills certain criteria and throws\
    \ an exception if it doesn't. For example, one assertion function supported by\
    \ many languages, assert(cond) throws an exception if the boolean condition cond\
    \ is false.\n\nNode.js, assert is supported by the built-in module assert. The\
    \ following code uses it in line A:\n\n```\nimport assert from 'assert';\nfunction\
    \ removeFilename(filename: string) {\n  const dotIndex = filename.lastIndexOf('.');\n\
    \  assert(dotIndex >= 0); // A\n  return filename.slice(0, dotIndex);\n}\n```\n\
    \n# 23.4.1 TypeScript's support for assertion functions\n\nTypeScript's type inference\
    \ provides special support for assertion functions, if we mark such functions\
    \ with assertion signatures as return types. W.r.t. how and what we can return\
    \ from a function, an assertion signature is equivalent to void. However, it triggers\
    \ narrowing.\n\nThere are two kinds of assertion signatures:\n\n+   * Asserting\
    \ a boolean argument: asserts «cond»\n* Asserting the type of an argument: asserts\
    \ «arg» is «type»\n\n# 23.4.2 Asserting a boolean argument: asserts «cond»\n\n\
    In the following example, the assertion signature condition states that the parameter\
    \ condition must be true. Otherwise, an exception is thrown.\n\n```\nfunction\
    \ assertTrue(condition: boolean): asserts condition {\n  if (!condition) {\n \
    \   throw new Error();\n  }\n}\n```\n\nThis is how assertTrue() causes narrowing:\n\
    \n```\nfunction func(value: unknown) {\n  assertTrue(value instanceof Set);\n\n\
    \  // %inferred-type: Set<any>\n  value;\n}\n```"
