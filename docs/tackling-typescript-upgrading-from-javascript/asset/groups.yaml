    \ obj3: Inter = {};\n```\n\n`undefined|string` 和 `null|string` 类型对于想要显式省略的情况有用。当人们看到这种显式省略时，他们知道它是关闭的。\n\
    \n### 16.6.2 只读属性\n\n在以下示例中，`prop` 是只读的：\n\n```typescript\ninterface MyInterface\
    \ {\n  readonly prop: number;\n}\n```\n\n作为结果，我们可以读取它，但不能更改它：\n\n```typescript\n\
    const obj: MyInterface = {\n  prop: 1,\n};\n```\n\n```typescript\nconsole.log(obj.prop);\
    \ // OK\n```\n\n```typescript\n// @ts-expect-error: Cannot assign to 'prop' because\
    \ it is a read-only\n// property. (2540)\nobj.prop = 2;\n```\n\n136\n\n## 16.7\
    \ JavaScript 的原型链与 TypeScript 的类型\n\nTypeScript 不区分拥有属性和继承属性。它们都被简单视为属性。\n\n```typescript\n\
    interface MyInterface {\n  toString(): string; // 继承属性\n  prop: number; // 有属性\n\
    }\nconst obj: MyInterface = { // OK\n  prop: 123,\n};\n```\n\nobj 从 `Object.prototype`\
    \ 继承了 `toString()`。\n这种方法的缺点是 JavaScript 中的某些现象无法通过 TypeScript 类型系统来描述。优点是类型系统更简单。\n\
    \n## 16.8 本章的来源\n\n*   *TypeScript Handbook*\n*   *TypeScript Language Specification*\n\
