    \ inference\n\nThese are the types that TypeScript infers for objects that are\
    \ created via:\n```typescript\n// 16.5 Type inference\n\nconst obj1 = { a: 1,\
    \ b: 2 };\n```\n\nIn principle, we need to use the former. TypeScript infers for\
