    \ may only specify known properties, and 'z'\n// does not exist in type 'Point'.\
    \ (2345)\ncomputeDistance1({ x: 1, y: 2, z: 3 });\n\n\n一种方法是将对象字面量赋值给中间变量：\n\n\
    ```typescript\nconst obj = { x: 1, y: 2, z: 3 };\ncomputeDistance1(obj);\n```\n\
    \n第二种方法是使用断言：\n\n```typescript\ncomputeDistance1({ x: 1, y: 2, z: 3 } as Point);\
    \ // OK\n```\n\n第三种方法是重写 `computeDistance()` 使其使用类型参数：\n\n```typescript\nfunction\
    \ computeDistance2<P extends Point>(point: P) { /*...*/ };\ncomputeDistance2({\
    \ x: 1, y: 2, z: 3 }); // OK\n```\n\n第四种方法是扩展接口 `Point` 以便允许多余属性：\n\n```typescript\n\
