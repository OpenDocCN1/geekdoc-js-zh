    # 25.5 Various operators


    ```

    // %inferred-type: "a" | "b" | "c" | "d"

    type Result3 = Obj[keyof Obj];

    ```


    The types in brackets must be assignable to the type of all property keys (keyof).
    That''s why Obj[number] and ''Obj[string]'' are not allowed. However, we can use
    number and string index types if the indexed type has an index signature (line
    A):


    ```

    type Obj = {

    [key: string]: RegExp, // (A)

    };

    ```


    ```

    // %inferred-type: string | number

    type KeysOfO0j = keyof Obj;

    ```


    ```

    // %inferred-type: RegExp

    type ValuesOfO0bj = Obj[string];

    ```


    KeysOfObj includes the type number because keys are a set of string keys in JavaScript.
    Tuples also support indexed access:


    ```

    type Tuple = [''a'', ''b'', ''c'', ''d''];

    ```


    ```

    // %inferred-type: "a" | "b"

    type Elements = Tuple[0 | 1];

    ```


    The bracket operator is also distributive:


    ```

    type MyType = { prop: 1 } | { prop: 2 } | { prop: 3 };

    ```


    ```

    // %inferred-type: 1 | 2 | 3

    type Result1 = MyType[''prop''];

    ```


    ```

    // Equivalent:

    type Result2 = {

    | { prop: 1 }[''prop'']

    | { prop: 2 }[''prop'']

    | { prop: 3 }[''prop'']

    };

    ```


    # 25.5.3 The type query operator typeof


    The type typeof converts a (JavaScript) value to its (TypeScript) type. Its operand
    must be an identifier or a sequence of dot-separated identifiers:


    ```

    const str = ''abc'';

    ```


    ```

    // %inferred-type: "abc"

    type Result = typeof str;

    ```'
