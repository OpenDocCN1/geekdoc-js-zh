  - "[PAGE 61]\n\n# 9.8 main.ts\n\nThis is the TypeScript code of the web app:\n\n\
    ```\nimport template from 'lodash/template';\n\nconst outputElement = document.getElementById('output');\n\
    if (outputElement) {\n  const compiled = template(`\n<h1>%- heading %></h1>\n\
    \  Current date and time: <%- dateTime %>\n  `).`).trim();\n  outputElement.innerHTML\
    \ = compiled({\n    heading: 'ts-demo-webpack',\n    dateTime: new Date().toISOString(),\n\
    \  });\n}\n```\n\n+   Step 1: We use Lodash's function template() to turn a string\
    \ with custom template syntax into a function compiled() that maps data to HTML.\
    \ The string defines blanks to be filled in data:\n  - <%- heading %>\n  - <%-\
    \ dateTime %>\nStep 2: Apply compiled() to the data (an object with two properties)\
    \ to generate HTML.\n\n# 9.9 Installing, building and running the web app\n\n\
    First we need to install all npm packages that our web app depends on:\n\n```\n\
    npm install\n```\n\nThen we need to run webpack (which was installed during the\
    \ previous step) via a script in package.json:\n\n```\nnpm run wpw\n```\n\nFrom\
    \ now, webpack watches the files in the repository for changes and rebuilds the\
    \ web app whenever it detects any.\n\nIn a different command line, we can now\
    \ start a web server that serves the contents of the build/ on localhost:\n\n\
    ```\nnpm run serve\n```\n\nIf we go to the URL printed out by the web server,\
    \ we can see the web app in action.\n\nNote that simple reloading may not be enough\
    \ to see the results after changes – due to caching. You may have to force-reload\
