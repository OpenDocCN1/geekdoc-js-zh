    \ 163\n- 19.3.2 Example: casting with runtime checks ...................................\
    \ 163\n- 19.3.3 Example: Maps that are type-safe at runtime ............................\
    \ 164\n- 19.3.4 Pitfall: Class<T> does not match abstract classes ................\
    \ 165\n\nIn this chapter, we explore classes as:\n\n- What types should we use\
    \ for such values?\n- What are the use cases for these types?\n\n## 19.1 Types\
    \ for specific classes\n\nConsider the following class:\n\n```typescript\nclass\
    \ Point {\n  x: number;\n  y: number;\n  constructor(x: number, y: number) {\n\
    \    this.x = x;\n    this.y = y;\n  }\n}\n```\n\nThis function accepts a class\
    \ and creates an instance of it:\n\n```typescript\nfunction createPoint(PointClass:\
    \ ???, x: number, y: number) {\n  return new PointClass(x, y);\n}\n```\n\nWhat\
    \ type should we use for the parameter PointClass if we want it to be Point or\
    \ a subclass?\n\n## 19.2 The type operator typeof\n\nIn §7.7 “The two language\
    \ levels: dynamic vs. static\", we explored the two language levels of TypeScript:\n\
    \n- Dynamic level: JavaScript (code and values)\n- Static level: TypeScript (static\
    \ types)\n\nThe class Point creates two things:\n\n- The constructor function\
    \ Point\n- The interface Point for instances of Point\n\nDepending on where we\
    \ mention Point, it means different things. That's why we can't use the type Point\
    \ for PointClass: It matches instances of class, not class Point itself.\n\nInstead,\
    \ we need to use the operator typeof (another bit of TypeScript syntax that also\
    \ exists in JavaScript). typeof v stands for the type of dynamic(!) v.\n\n```typescript\n\
    function createPoint(PointClass: typeof Point, x: number, y: number) // (A)\n\
    \  return new PointClass(x, y);\n```\n\n```typescript\n// inferred-type: Point\n\
    const point = createPoint(Point, 3, 6);\nassert.ok(point instanceof Point);\n\
    ```\n\n### 19.2.1 Constructor type literals\n\nA constructor type literal is a\
    \ function literal with a prefixed new (line A). The prefix indicates that PointClass\
    \ is a function that can be invoked via new.\n\n```typescript\nfunction createPoint(\n\
    \  PointClass: new (x: number, y: number) => Point, // (A)\n  x: number, y: number\n\
    ) {\n  return new PointClass(x, y);\n}\n```\n\n### 19.2.2 Object type literals\
    \ with construct signatures\n\nRecall that members of interfaces and object literal\
    \ types (OLTs) include method signatures and call signatures. Call signatures\
    \ enable interfaces and OLTs to describe functions.\n\n## 19.3 A generic type\
    \ for classes: Class<T>\n\nSimilarly, construct signatures enable interfaces and\
    \ OLTs to describe functions. In the next example, PointClass has a construct\
    \ signature:\n\n```typescript\nfunction createPoint(\n  PointClass: { new (x:\
    \ number, y: number): Point },\n  x: number, y: number\n): Point {\n  return new\
    \ PointClass(x, y);\n}\n```\n\nWith the knowledge we have acquired, we can create\
    \ a generic type introducing type parameter T:\n\n```typescript\ntype Class<T>\
    \ = new (...args: any[]) => T;\n```\n\nInstead of a type alias, we can also use\
    \ interface:\n\n```typescript\ninterface Class<T> {\n  new (...args: any[]): T;\n\
    }\n```\n\nClass<T> is a type for classes. That determines the static type of the\
    \ entry's value and is also used for checks at runtime.\n\n### 19.3.1 Example:\
    \ creating instances\n\nClass<T> enables us to write a generic version of createPoint:\n\
    \n```typescript\nclass Person {\n  constructor(public name: string) {}\n}\n\n\
    function createInstance<T>(cls: Class<T>, ...args: any): T {\n  return new cls(...args);\n\
    }\n```\n\ncreateInstance() is used as follows:\n\n```typescript\nconst jane =\
    \ createInstance(Person, 'Jane');\n// inferred-type: Person\n```\n\n### 19.3.2\
    \ Example: casting with runtime checks\n\nWe can use cast to implement casting:\n\
    \n```typescript\nfunction cast<T>(AnyClass: Class<T>, obj: any): T {\n  if (!(obj\
    \ instanceof AnyClass)) {\n    throw new Error(`Not an instance of ${AnyClass.name}:\
    \ ${obj}`);\n  }\n  return obj;\n}\n```\n\nWith cast(), we can change the type\
    \ of a value to something specific. This is also safe at runtime, because we statically\
    \ change the type and perform a dynamic check. The following code provides an\
    \ example:\n\n```typescript\nfunction parseObject(jsonObjectStr: string): Object\
    \ {\n  // inferred-type: any\n  const parsed = JSON.parse(jsonObjectStr);\n  return\
    \ cast(Object, parsed);\n}\n```\n\n### 19.3.3 Example: Maps that are type-safe\
    \ at runtime\n\nOne case for Class<T> and cast() is type-safe Maps:\n\n```typescript\n\
    class TypeSafeMap {\n  #data = new Map<any, any>();\n  get<T>(key: Class<T>) {\n\
    \    const value = this.#data.get(key);\n    return cast(key, value);\n  }\n \
    \ set<T>(key: Class<T>, value: T): this {\n    cast(key, value); // runtime check\n\
    \    this.#data.set(key, value);\n    return this;\n  }\n  has(key: any) {\n \
    \   return this.#data.has(key);\n  }\n}\n```\n\nThe key of each in a TypeSafeMap\
    \ is a class. That determines the static type of the entry's value and is also\
    \ used for checks at runtime.\n\nThis is TypeSafeMap in action:\n\n```typescript\n\
    const map = new TypeSafeMap();\n\nmap.set(RegExp, /abc/);\n\n// inferred-type:\
    \ RegExp\nconst re = map.get(RegExp);\n\n// Static and dynamic error!\nassert.throws(\n\
    \  // ts-expect-error: Argument of type \"abc\" is not assignable\n  // to parameter\
    \ of type 'Date'.\n  () => map.set(Date, 'abc');\n);\n```\n"
  mdcn: "\n\n## 18.4 作为类型的类\n\n```typescript\n/**\n * 返回对象的原型形。\n * @param o 引用原型的对象。\n\
    \ */\ngetPrototypeOf(o: any): any;\n}\n```\n\n另一方面，接口 `Object` 是用于 `Object` 实例的：\n\
    \n```typescript\ninterface Object {\n  /** Object.prototype.constructor 的初始值是标准的内置\
    \ Object */\n  constructor: Function;\n\n  /** 返回对象的字符串表示。 */\n  toString(): string;\n\
    }\n```\n\n`Object` 名字被使用了两次，分别处于两个语言层级：\n\n- 在动态层面，用于全局变量。\n- 在静态层面，用于类型。\n\n\
    ## 18.4 作为类型的类\n\n考虑以下类：\n\n```typescript\nclass Color {\n  name: string;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n}\n```\n\n这个类的定义创建了两个东西。\n\n首先，是一个名为\
    \ `Color` 的构造器函数（可以通过 `new` 调用）：\n\n```typescript\nassert.equal(\n  typeof Color,\
    \ 'function'\n)\n```\n\n其次，是一个名为 `Color` 的接口，它匹配 `Color` 的实例：\n\n```typescript\n\
    const green = new Color('green');\n```\n\n这里是 `Color` 确实是一个接口的证明：\n\n```typescript\n\
    interface RbColor extends Color {\n  rgbValue: [number, number, number];\n}\n\
    ```\n\n## 18.4.1 陷阱：类是结构性的，而不是命名的\n\n尽管如此有一个陷阱：将 `Color` 作为静态类型并不是非常严格的检查：\n\n\
    ```typescript\nclass Color {\n  name: string;\n  constructor(name: string) {\n\
    \    this.name = name;\n  }\n}\nclass Person {\n  name: string;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n}\nconst person: Person = new Person('Jane');\n\
    const color: Color = person; // (A)\n```\n\n为什么 TypeScript 在行 A 没有报错？那是由于结构化类型系统：`Person`\
    \ 和 `Color` 的实例具有相同的结构，因此在静态上是兼容的。\n\n### 18.4.1.1 关闭结构化类型\n\n我们可以通过添加私有属性让这两组对象变得兼容：\n\
    \n```typescript\nclass Color {\n  name: string;\n  private branded = true;\n \
    \ constructor(name: string) {\n    this.name = name;\n  }\n}\nclass Person {\n\
    \  name: string;\n  private branded = true;\n  constructor(name: string) {\n \
    \   this.name = name;\n  }\n}\n```\n\n```typescript\nconst person: Person = new\
    \ Person('Jane');\n// @ts-expect-error: 类型 'Person' 不可分配类型 'Color'。\n// 类型对私有属性\n\
    // 'branded' 有独立的声明。(2322)\nconst color: Color = person;\n```\n\n在这种情况下，私有属性关闭了结构化类型系统。\n\
    \n## 18.5 进阶阅读\n\n- 《给急迫程序员的 JavaScript》中的“原型链与类”章节。\n\n## 第 19 章\n\n## 作为值的类的类型\n\
    \n- 目录\n- 19.1 特定类的类的类型 ...................................................................\
    \ 161\n- 19.2 typeof 类型运算符 ........................................................................\
    \ 162\n- 19.2.1 构造器类型字面量 ................................................... 162\n\
    - 19.2.2 使用带有构造签名的对象字面量转换 ................ 162\n- 19.3 类的泛型类型：Class<T> ............................................\
    \ 163\n- 19.3.1 示例：创建实例 ......................................................\
    \ 163\n- 19.3.2 示例：带有运行时检查的类型转换 ................................... 163\n- 19.3.3\
    \ 示例：运行时安全的 Map ............................ 164\n- 19.3.4 陷阱：Class<T> 不匹配抽象类\
    \ ................ 165\n\n在本章中，我们探索了作为值的类：\n\n- 对于此类值，我们应该使用什么类型？\n- 这些类型的用例是什么？\n\
    \n## 19.1 特定类的类的类型\n\n考虑以下类：\n\n```typescript\nclass Point {\n  x: number;\n \
    \ y: number;\n  constructor(x: number, y: number) {\n    this.x = x;\n    this.y\
    \ = y;\n  }\n}\n```\n\n这个函数接受一个类并创建它的实例：\n\n```typescript\nfunction createPoint(PointClass:\
    \ ???, x: number, y: number) {\n  return new PointClass(x, y);\n}\n```\n\n如果我们想让参数\
    \ `PointClass` 是 `Point` 或其子类，我们应该使用什么类型呢？\n\n## 19.2 typeof 类型运算符\n\n在 §7.7 “两个语言层级：动态与静态”中，我们探索了\
    \ TypeScript 的两个语言层级：\n\n- 动态层面：JavaScript（代码和值）\n- 静态层面：TypeScript（静态类型）\n\n\
    类 `Point` 创建了两个东西：\n\n- 构造器函数 `Point`\n- 用于 `Point` 实例的接口 `Point`\n\n取决于我们提到 `Point`\
    \ 的地方，它的含义不同。这就是为什么我们不能将 `Point` 类型用于 `PointClass`：它匹配类的实例，而不是 `Point` 类本身。\n\n\
    相反，我们需要使用 `typeof` 运算符（另一个在 JavaScript 中也存在的 TypeScript 语法）。`typeof v` 代表动态(!)\
    \ `v` 的类型。\n\n```typescript\nfunction createPoint(PointClass: typeof Point, x:\
    \ number, y: number) // (A)\n  return new PointClass(x, y);\n```\n\n```typescript\n\
    // 推断类型: Point\nconst point = createPoint(Point, 3, 6);\nassert.ok(point instanceof\
    \ Point);\n```\n\n### 19.2.1 构造器类型字面量\n\n构造器类型字面量是一个带有前缀 `new` 的函数字面量（行 A）。前缀表示\
    \ `PointClass` 是一个可以通过 `new` 用的函数。\n\n```typescript\nfunction createPoint(\n \
    \ PointClass: new (x: number, y: number) => Point, // (A)\n  x: number, y: number\n\
    ) {\n  return new PointClass(x, y);\n}\n```\n\n### 19.2.2 带有构造签名的对象类型字面量\n\n记得接口和对象字面量类型（OLTs）的成员包括方法签名和调用签名。调用签名允许接口和\
    \ CLT描述函数。\n\n## 19.3 类的泛型类型：Class<T>\n\n同样，构造签名允许接口和 CLT 描述函数。在下一个示例中，`PointClass`\
    \ 具有构造签名：\n\n```typescript\nfunction createPoint(\n  PointClass: { new (x: number,\
    \ y: number): Point },\n  x: number, y: number\n): Point {\n  return new PointClass(x,\
    \ y);\n}\n```\n\n通过我们获取的知识，我们可以创建一个泛型类型引入参数 `T`：\n\n```typescript\ntype Class<T>\
    \ = new (...args: any[]) => T;\n```\n\n除了类型别名，我们也可以使用接口：\n\n```typescript\ninterface\
    \ Class<T> {\n  new (...args: any[]): T;\n}\n```\n\n`Class<T>` 是类的类型。它决定了条目的静态类型，并用于运行时检查。\n\
    \n### 19.3.1 示例：创建实例\n\n`Class<T>` 允许我们编写 `createPoint` 的泛型版本：\n\n```typescript\n\
    class Person {\n  constructor(public name: string) {}\n}\n\nfunction createInstance<T>(cls:\
    \ Class<T>, ...args: any): T {\n  return new cls(...args);\n}\n```\n\n`createInstance()`\
    \ 的用法如下：\n\n```typescript\nconst jane = createInstance(Person, 'Jane'); // 推断类型:\
    \ Person\n```\n\n### 19.3.2 示例：带有运行时检查的类型转换\n\n可以使用 `cast` 实现转换：\n\n```typescript\n\
    function cast<T>(AnyClass: Class<T>, obj: any): T {\n  if (!(obj instanceof AnyClass))\
    \ {\n    throw new Error(`Not an instance of ${AnyClass.name}: ${obj}`);\n  }\n\
    \  return obj;\n}\n```\n\n通过 `cast()`，我们可以将值转换为特定的类型。这在运行时也是安全的，因为我们在静态更改类型的同时进行了检查。以下代码提供了一个示例：\n\
    \n```typescript\nfunction parseObject(jsonObjectStr: string): Object {\n  // 推断类型:\
    \ any\n  const parsed = JSON.parse(jsonObjectStr);\n  return cast(Object, parsed);\n\
    }\n```\n\n### 19.3.3 示例：运行时安全的 Map\n\n`Class<T>` 和 `cast()` 的一个用例是安全的 Map：\n\n\
    ```typescript\nclass TypeSafeMap {\n  #data = new Map<any, any>();\n  get<T>(key:\
    \ Class<T>) {\n    const value = this.#data.get(key);\n    return cast(key, value);\n\
    \  }\n  set<T>(key: Class<T>, value: T): this {\n    cast(key, value); // 运行时检查\n\
    \    this.#data.set(key, value);\n    return this;\n  }\n  has(key: any) {\n \
    \   return this.#data.has(key);\n  }\n}\n```\n\n这是 `TypeSafeMap` 的运行示例：\n\n```typescript\n\
    const map = new TypeSafeMap();\n\nmap.set(RegExp, /abc/);\n\n// 推断类型: RegExp\n\
    const re = map.get(RegExp);\n\n// 静态和动态错误！\nassert.throws(\n  // ts-expect-error:\
    \ 参数类型 \"abc\" 不可分配\n  // 给参数类型 'Date'。\n  () => map.set(Date, 'abc');\n);\n```\n\
    \n"
