    # 13.3 Downsides of numeric enums


    # 13.3.1 Downside: logging


    When logging members of numeric enums, we only see numbers:


    ```

    enum NoYes { No, Yes }


    console.log(NoYes.No);

    console.log(NoYes.Yes);


    // Output:

    // 0

    // 1

    ```


    # 13.3.2 Downside: loose type-checking


    When using the enum as a type, the values that are allowed statically are not
    just those of the enum members - any number is accepted:


    ```

    enum NoYes { No, Yes }

    function func(noNoYes) {}

    func(33); // no error!

    ```


    Why aren''t there static checks? Daniel Rosenwainer explains:


    > The behavior is motivated by bitwise operations. There are times when SomeFlag.Foo
    | SomeFlag.Bar is intended to produce another SomeFlag. Instead you use it with
    number, and you don''t have to cast back to SomeFlag.


    I think if we used TypeScript over again and still had enums, we''d have made
    a separate construct for bit flags.


    How enums are used for bit patterns is demonstrated soon in more detail.


    # 13.3.3 Recommendation: prefer string-based enums


    My recommendation is to prefer string-based enums (for brevity''s sake, this chapter
    doesn''t allow this recommendation):


    ```

    enum NoYes { No=''No'', Yes=''Yes'' }

    ```


    On one hand, logging output is more useful for humans:


    ```

    console.log(NoYes.No);

    console.log(NoYes.Yes);


    // Output:

    // ''No''

    // ''Yes''

    ```


    On the other hand, we get stricter type checking:'
- md: "\n## 13 TypeScript enums: How do they work? What can they be used for?\n\n\
    ```typescript\nfunction func(noYes: NoYes) {}\n```\n\n```typescript\n// @ts-expect-error:\
    \ Argument of type \"abc\" is not assignable\n// to parameter of type 'NoYes'.\n\
    func('abc');\n\n// @ts-expect-error: Argument of type \"Yes\" is not assignable\n\
    // to parameter of type 'NoYes'.\nfunc('Yes'); // (A)\n```\n\nNot even strings\
    \ that are equal to values of members are allowed (line A).\n\n## 13.4 Use cases\
    \ for enums\n\n### 13.4.1 Use case: file system module\n\nIn the Node.js file\
    \ system module, several functions have the parameter mode. It specifies file\
    \ permissions by a numeric encoding that is a holdover from Unix:\n\n- Permissions\
    \ are permitted for three categories of users:\n  - User: the owner of the file\n\
    \  - Group: the members of the group associated with the file\n  - All: everyone\n\
    \n- Per category, the following permissions can be granted:\n  - r (read): the\
    \ users in the category are allowed to read the file\n  - w (write): the users\
    \ in the category are allowed to change the file\n  - x (execute): the users in\
    \ the category are allowed to run the file\n\nThat means permissions can be represented\
    \ by 9 bits (3 categories with 3 permissions each):\n\n| User | Group | All |\n\
    | :--- | :--- | :--- |\n| Permissions r, w, x | r, w, x | r, w, x |\n| Bit 8,\
    \ 7, 6 | 5, 4, 3 | 2, 1, 0 |\n\nNode.js doesn't do this, but we can use an enum\
    \ to work with these flags:\n\n```typescript\nenum Perm {\n  UserRead = 1 << 8,\
    \ // bit 8\n  UserWrite = 1 << 7,\n  UserExecute = 1 << 6,\n  GroupRead = 1 <<\
    \ 5,\n  GroupWrite = 1 << 4,\n  GroupExecute = 1 << 3,\n  AllRead = 1 << 2,\n\
    \  AllWrite = 1 << 1,\n  AllExecute = 1 << 0,\n}\n```\n\nBit patterns are combined\
    \ via bitwise Or:\n\n```typescript\n// User can change, read and execute.\n//\
    \ Everyone can only read and execute.\nassert.equal(\n  Perm.UserRead | Perm.UserWrite\
    \ | Perm.UserExecute |\n  Perm.GroupRead | Perm.GroupExecute |\n  Perm.AllRead\
    \ | Perm.AllExecute,\n  00755\n);\n\n// User can read and write.\n// Group members\
    \ can read.\n// Everyone can't access at all.\nassert.equal(\n  Perm.UserRead\
    \ | Perm.UserWrite | Perm.GroupRead,\n  00640\n);\n```\n\n### 13.4.1.1 An alternative\
    \ to bit patterns\n\nThe main idea behind bit patterns is that there is a set\
    \ of flags and that any subset of flags can be chosen.\n\nTherefore, using real\
    \ sets to choose subsets is a more straightforward way of performing the same\
    \ task:\n\n```typescript\nenum Perm {\n  UserRead = 'UserRead',\n  UserWrite =\
    \ 'UserWrite',\n  UserExecute = 'UserExecute',\n  GroupRead = 'GroupRead',\n \
    \ GroupWrite = 'GroupWrite',\n  GroupExecute = 'GroupExecute',\n  AllRead = 'AllRead',\n\
    \  AllWrite = 'AllWrite',\n  AllExecute = 'AllExecute'\n}\nfunction writeFileSync(\n\
    \  thePath: string, permissions: Set<Perm>, content: string) {\n  // ...\n}\n\n\
    writeFileSync(\n  '/tmp/hello.txt',\n  new Set([Perm.UserRead, Perm.UserWrite,\
    \ Perm.GroupRead]),\n  'Hello!'\n);\n```\n\n### 13.4.2 Use case: multiple constants\n\
    \nSometimes, we have sets of constants that belong together:\n\n```typescript\n\
    const off = Symbol('off');\nconst info = Symbol('info');\nconst warn = Symbol('warn');\n\
    const error = Symbol('error');\n```\n\nThis is a good case for enum:\n\n```typescript\n\
    enum LogLevel {\n    off = 'off',\n    info = 'info',\n    warn = 'warn',\n  \
    \  error = 'error'\n}\n```\n\nOne of the enum is that the constant names are grouped\
    \ and nested inside the namespace LogLevel.\nAnother is one that we automatically\
    \ get the type LogLevel for them. If we want such a type for the constants, we\
    \ need more work:\n\n```typescript\ntype LogLevel =\n    | typeof off\n    | typeof\
    \ info\n    | typeof warn\n    | typeof error\n```\n\nFor more information on\
    \ this approach, see §14.1.3 “Unions of symbol singleton types”.\n\n### 13.4.3\
    \ Use case: more self-descriptive than booleans\n\nWhen booleans are used to represent\
    \ alternatives, enums are usually more self-descriptive.\n\n### 13.4.3.1 Boolean-ish\
    \ example: ordered vs. unordered lists\n\nFor example, to represent whether a\
    \ list is ordered or not, we can use a boolean:\n\n```typescript\nclass List1\
    \ {\n    isSelected: boolean;\n    // ...\n}\n```\n\nHowever, an enum is more\
    \ self-descriptive and the additional benefit that we can add more alternatives\
    \ if we need to.\n\n```typescript\nenum ListKind {\n    ordered, unordered\n}\n\
    class List2 {\n    listKind: ListKind;\n    // ...\n}\n```\n\n### 13.4.3.2 Boolean-ish\
    \ example: error handling modes\n\nSimilarly, we can specify how to handle errors\
    \ via a boolean value:\n\n```typescript\nfunction convertToHtml(markdown: string,\
    \ throwOnError: boolean) {\n  // ...\n}\n```\n\nOr we can do so via an enum value:\n\
    \n```typescript\nenum ErrorHandling {\n  throwOnError = 'throwOnError',\n  showErrorsInContent\
    \ = 'showErrorsInContent'\n}\nfunction convertToHtml2(markdown: string, errorHandling:\
    \ ErrorHandling) {\n  // ...\n}\n```\n\n### 13.4.4 Use case: better string constants\n\
    \nConsider the following function that creates regular expressions:\n\n```typescript\n\
    const GLOBAL = 'g';\nconst NOT_GLOBAL = '';\ntype Globalness = typeof GLOBAL |\
    \ typeof NOT_GLOBAL;\n```\n\n```typescript\nfunction RegExp(source: string,\n\
    \  globalness: Globalness = NOT_GLOBAL) {\n  return new RegExp(source, 'u' + globalness);\n\
    }\n```\n\n```typescript\nassert.deepEqual(\n  createRegExp('abc', GLOBAL),\n \
    \ /abc/ug\n);\n```\n\n```typescript\nassert.deepEqual(\n  createRegExp('abc',\
    \ 'g'), // OK\n  /abc/ug\n);\n```\n\nInstead of the string constants, we can use\
    \ an enum:\n\n```typescript\nenum Globalness {\n  Global = 'g',\n  notGlobal =\
    \ '',\n}\n```\n\n```typescript\nfunction createRegExp(source: string, globalness\
    \ = Globalness.notGlobal) {\n  return new RegExp(source, 'u' + globalness);\n\
    }\n```\n\n```typescript\nassert.deepEqual(\n  createRegExp('abc', Globalness.Global),\n\
    \  /abc/ug\n);\n```\n\n```typescript\nassert.deepEqual(\n  // ts-expect-error:\
    \ Argument of type \"g\" is not assignable to parameter of type 'Global'\n  createRegExp('abc',\
    \ 'g'), // error\n  /abc/ug\n);\n```\n\nWhat are the benefits of this approach?\n\
    \n- It is more concise.\n- It is slightly safer.\n\n### 13.5 Enums at runtime\n\
    \nGiven a numeric enum, take the following:\n\n```typescript\nenum NoYes {\n \
    \ No,\n  Yes\n}\n```\n\nTypeScript compiles this to:\n\n```javascript\nvar NoYes;\n\
    (function (NoYes) {\n  NoYes[0] = \"No\";\n  NoYes[1] = \"Yes\";\n})(NoYes ||\
    \ {});\n```\n\nNumeric enums also support reverse mapping from member names to\
    \ values:\n\n```typescript\nfunction getQualifiedName(value: NoYes) {\n  return\
    \ 'NoYes.' + value;\n}\nassert.equal(getQualifiedName(NoYes.Yes), 'NoYes.1');\n\
    ```\n\nDynamic lookup:\n\n```typescript\nassert.equal(NoYes[1], 'Yes');\n```\n\
    \n### 13.5 String-based enums at runtime\n\nConsider the following enum:\n\n```typescript\n\
    enum NoYes {\n  No = 'NO!',\n  Yes = 'YES!'\n}\n```\n\nIt is compiled to this\
    \ code:\n\n```javascript\nvar NoYes;\n(function (NoYes) {\n  NoYes['No'] = \"\
    NO!\";\n  NoYes['Yes'] = \"YES!\";\n})((NoYes = {});\n```\n\nTypeScript does not\
    \ support reverse mappings for string-based enums.\n\n### 13.6 const enums\n\n\
    If an enum is prefixed with the keyword `const`, it doesn't have a representation\
    \ at runtime. Instead, the values of its members are used directly.\n\n### 13.6.1\
    \ Compiling non-const enums\n\nTo observe this effect, let us examine the following\
    \ non-const enums:\n\n```typescript\nenum NoYes {\n  No = 'No',\n  Yes = 'Yes',\n\
    }\n```\n\n```typescript\nfunction toGerman(value: NoYes) {\n  switch (value) {\n\
    \    case NoYes.No:\n      return 'Nein';\n    case NoYes.Yes:\n      return 'Ja';\n\
    \  }\n}\n```\n\nTypeScript strict compiles this code to:\n\n```javascript\n\"\
    use strict\";\nvar NoYes;\n(function (NoYes) {\n  NoYes[\"No\"] = \"No\";\n  NoYes[\"\
    Yes\"] = \"Yes\";\n})(NoYes || (NoYes = {}));\n```\n\n```typescript\nfunction\
    \ toGerman(value) {\n  switch (value) {\n    case NoYes.No:\n      return 'Nein';\n\
    \    case NoYes.Yes:\n      return 'Ja';\n  }\n}\n```\n\n### 13.6.2 Compiling\
