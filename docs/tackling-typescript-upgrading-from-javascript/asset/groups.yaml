- md: "\n## 17.2 Non-public data slots in TypeScript\n\n### 17.1.10 More information\
    \ on class definitions in plain JavaScript\n\n- Public fields, private fields,\
    \ private methods/getters/setters (blog post)\n- All remaining JavaScript class\
    \ features (chapter in \"JavaScript features for impatient programming\")\n\n\
    ## 17.2 Non-public data slots in TypeScript\n\nBy default, all data slots in TypeScript\
    \ are public properties. There are two ways of keeping data:\n\n- Private properties\n\
    - Private fields\n\nWe'll look at both next.\n\nNote that TypeScript does not\
    \ currently support private methods.\n\n### 17.2.1 Private properties\n\nPrivate\
    \ properties are a TypeScript-only (static) feature. Any property can be made\
    \ private by prefixing it with the keyword private (line A):\n\n```typescript\n\
    class PersonPrivate {\n  private name: string; // (A)\n  constructor(name: string)\
    \ {\n    this.name = name;\n  }\n\n  sayHello() {\n    return `Hello ${this.name}!`;\n\
    \  }\n}\n```\n\nWe now get compile-time errors if we access that property in the\
    \ wrong scope (line A):\n\n```typescript\nconst john = new PersonPrivateProperty('John');\n\
    \nassert.equal(\n  john.sayHello(), 'Hello John!'\n);\n\n// @ts-expect-error:\
    \ Property 'name' is private and only accessible\n// within class 'PersonPrivateProperty'.\
    \ (2341)\njohn.name; // (A)\n```\n\nHowever, private does not change anything\
    \ at runtime. There, property .name is indistinguishable from a public property:\n\
    \n```javascript\nassert.deepEqual(\n  Object.keys(john),\n  ['name']);\n```\n\n\
    ## 17 Class definitions in TypeScript\n\nWe can also see that private properties\
    \ aren’t protected at runtime when we look at the JavaScript code that the class\
    \ is compiled to:\n\n```javascript\nclass PersonPrivateProperty {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n  sayHello() {\n    return `Hello ${this.name}!`;\n\
    \  }\n}\n```\n\n### 17.2.2 Private fields\n\nPrivate fields are a new JavaScript\
    \ feature that TypeScript has supported since version 3.8:\n\n```typescript\n\
    class PersonPrivateField {\n  #name: string;\n  constructor(name: string) {\n\
    \    this.#name = name;\n  }\n  sayHello() {\n    return `Hello ${this.#name}!`;\n\
    \  }\n}\n```\n\nThis version of Person is mostly used the same way as the private\
    \ property version:\n\n```typescript\nconst john = new PersonPrivateField('John');\n\
    ```\n\n```typescript\nassert.equal(\njohn.sayHello(), 'Hello John!');\n```\n\n\
    However, the data is completely encapsulated. Using the private field syntax outside\
    \ classes is a JavaScript syntax error. That’s why we have to use eval() in line\
    \ A that we can execute this code:\n\n```javascript\nassert.throws(\n  () => eval('john.#name'),\
    \ // (A)\n{\n  name: 'SyntaxError',\n  message: 'Private field #name must be declared\
    \ in \"\n  + \"enclosing class\",\n});\n```\n\n```javascript\nassert.deepEqual(\n\
    Object.keys(john),\n[]);\n```\n\nThe compilation result is much more complicated\
    \ now (slightly simplified):\n\n## 17.2 Non-public data slots in TypeScript\n\n\
    ```javascript\nvar _classPrivateFieldSet = function (receiver, privateMap, value)\
    \ {\n  if (!privateMap.has(receiver)) {\n    throw new TypeError(\n      'attempted\
    \ to set private field on non-instance'\n    );\n  }\n  privateMap.set(receiver,\
    \ value);\n  return value;\n};\n\n// Omitted: __classMapField\n\n```javascript\n\
    var name = new WeakMap();\nclass Person {\n  constructor(name) {\n    // Add an\
    \ entry for this instance to _name\n    _name.set(this, void 0);\n\n    // Now\
    \ we can use the helper function:\n    __classPrivateFieldSet(this, _name, name);\n\
    \  }\n  ....\n}\n```\n\nThis code uses a common technique for keeping instance\
    \ data private:\n\n- Each WeakMap implements private field.\n- It associates each\
    \ instance with one piece of private data.\n\nMore information on this topic:\
    \ see \"JavaScript for impatient programmers\".\n\n### 17.2.3 Private properties\
    \ vs. private fields\n\n- Downsides of private properties:\n  - We can't reuse\
    \ names of private properties in subclasses (because the properties aren't private\
    \ at runtime).\n  - No encapsulation at runtime.\n- Upside of private properties:\n\
    \  - Clients can circumvent the encapsulation and access private properties. This\
    \ can be useful if someone needs to work around a bug. In other words: Data being\
    \ completely encapsulated has pros and cons.\n\n### 17.2.4 Protected properties\n\
    \nPrivate fields and private properties can't be accessed in subclasses (line\
    \ A):\n\n```typescript\nclass PrivatePerson {\n  private name: string;\n  constructor(name:\
    \ string) {\n    this.name = name;\n  }\n}\n```\n\n```typescript\nsayHello() {\n\
    \  return `Hello ${this.name}!`;\n}\n```\n\n```typescript\nclass PrivateEmployee\
    \ extends PrivatePerson {\n  private company: string;\n  constructor(name: string,\
    \ company: string) {\n    super(name);\n    this.company = company;\n  }\n```\n\
    \n```typescript\nsayHello() {\n  // @ts-expect-error: Property 'name' is private\
    \ and only\n  // accessible within class 'PrivatePerson'. (2341)\n  return `Hello\
    \ ${this.name} from ${this.company}!`; // (A)\n}\n```\n\nWe can fix this example\
    \ by switching from private to protected in line A (we also switch in line B,\
    \ for consistency's sake):\n\n```typescript\nclass ProtectedPerson {\n  protected\
    \ name: string; // (A)\n  constructor(name: string) {\n    this.name = name;\n\
    \  }\n```\n\n```typescript\nsayHello() {\n  return `Hello ${this.name}!`;\n}\n\
    ```\n\n```typescript\nclass ProtectedEmployee extends ProtectedPerson {\n  protected\
    \ company: string; // (B)\n  constructor(name: string, company: string) {\n  \
    \  super(name);\n    this.company = company;\n  }\n```\n\n```typescript\nsayHello()\
    \ {\n  return `Hello ${this.name} from ${this.company}!`; // OK\n}\n```\n\n##\
    \ 17.3 Private constructors\n\nConstructors can be private. That is useful when\
    \ we have static factory methods and want clients to always use those methods,\
    \ never the constructor directly. Static methods can access private members. In\
    \ the following code, there is one static method DataContainer.create(). It sets\
    \ up instances via asynchronously.\n\n## 17.4 Initializing properties\n\nThe private\
    \ constructor prevents DataContainer from being subclassed. If we want to allow\
    \ subclasses, we have to make it protected.\n\n```typescript\nclass DataContainer\
    \ {\n  #data: string;\n  static async create() {\n    const data = await Promise.resolve('downloaded');\
    \ // (A)\n    return new DataContainer(data);\n  }\n  private constructor(data:\
    \ string) {\n    this.#data = data;\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n\
    \  }\n}\nDataContainer.create()\n  .then(dc => assert.equal(\n    dc.getData(),\
    \ 'DATA: downloaded');\n  ));\n```\n\nIf the compiler flag --strictPropertyInitialization\
    \ is switched on (which is the case if we use --strict), then TypeScript checks\
    \ if all declared instance properties are correctly initialized:\n\n- Either assignments\
    \ in the constructor:\n\n```typescript\nclass Point {\n  x: number;\n  y: number;\n\
    \  constructor(x: number, y: number) {\n    this.x = x;\n    this.y = y;\n  }\n\
    }\n```\n\n- Or initializers for the property declarations:\n\n```typescript\n\
    class Point {\n  x = 0;\n  y = 0;\n}\n```\n\nNo constructor needed\n\nHowever,\
    \ sometimes we initialize properties in a manner that TypeScript doesn't recognize.\
    \ Then we can use exclamation marks (definite assignment assertions) to switch\
    \ off TypeScript's warnings (line A and line B):\n\n```typescript\nclass Point\
    \ {\n  x!: number; // (A)\n  y!: number; // (B)\n  constructor() {\n    this.initProperties();\n\
    \  }\n  initProperties() {\n    this.x = 0;\n    this.y = 0;\n  }\n}\n```\n\n\
    ### 17.4.1.1 Example: setting instance properties via objects\n\nIn the following\
    \ example, we also need define assignment assertions. Here, we set up instance\
    \ properties via the constructor parameter props:\n\n```typescript\nclass CompilerError\
    \ implements CompilerErrorProps { // (A)\n  line!: number;\n  description!: string;\n\
    \  constructor(props: CompilerErrorProps) {\n    Object.assign(this, props); //\
    \ (B)\n  }\n}\n```\n\n```typescript\n// Helper interface for the parameter properties\n\
    interface CompilerErrorProps {\n  line: number,\n  description: string;\n}\n```\n\
    \n// Using the class:\n\n```typescript\nconst err = new CompilerError({\n  line:\
    \ 123,\n  description: 'Unexpected token',\n});\n```\n"
  mdcn: "\n\n## 17.2 TypeScript 中的非公开数据槽位\n\n### 17.1.10 关于原生 JavaScript 中类定义的更多信息\n\
    \n- 公有字段、私有字段、私有方法/getters/setter（博客文章）\n- 剩余的所有 JavaScript 类特性（《给急躁的程序员准备的 JavaScript\
    \ 特性》中的章节）\n\n## 17.2 TypeScript 中的非公开数据槽位\n\n默认情况下，TypeScript 中的所有数据槽位都是公共属性。保留数据有两种方式：\n\
    \n- 私有属性（Private properties）\n- 私有字段（Private fields）\n\n接下来我们将查看这两种。\n\n请注意，TypeScript\
    \ 目前不支持私有方法。\n\n### 17.2.1 私有属性\n\n私有属性是 TypeScript 特有的（静态）功能。任何属性都可以通过在它的前面加上\
    \ `private` 关键字来变为私有（A 行）：\n\n```typescript\nclass PersonPrivate {\n  private\
    \ name: string; // (A)\n  constructor(name: string) {\n    this.name = name;\n\
    \  }\n\n  sayHello() {\n    return `Hello ${this.name}!`;\n  }\n}\n```\n\n现在，如果在错误的作用域内（A\
    \ 行）访问该属性，我们将得到编译错误：\n\n```typescript\nconst john = new PersonPrivateProperty('John');\n\
    \nassert.equal(\n  john.sayHello(), 'Hello John!'\n);\n\n// @ts-expect-error:\
    \ 属性 'name' 是私有的，只能在类 'PersonPrivateProperty' 内部访问。(2341)\njohn.name; // (A)\n\
    ```\n\n然而，`private` 在运行时并不会改变任何东西。在运行时，属性 `.name` 与公共属性没有区别：\n\n```javascript\n\
    assert.deepEqual(\n  Object.keys(john),\n  ['name']);\n```\n\n## 17 TypeScript\
    \ 中的类定义\n\n当我们查看类被编译后的 JavaScript 代码时，也可以看到私有属性在运行时并不受受保护的：\n\n```javascript\n\
    class PersonPrivateProperty {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n  sayHello() {\n    return `Hello ${this.name}!`;\n  }\n}\n```\n\n### 17.2.2\
    \ 私有字段\n\n私有字段是 JavaScript 的一项新特性，TypeScript 从 3.8 版本开始支持它：\n\n```typescript\n\
    class PersonPrivateField {\n  #name: string;\n  constructor(name: string) {\n\
    \    this.#name = name;\n  }\n  sayHello() {\n    return `Hello ${this.#name}!`;\n\
    \  }\n}\n```\n\n这个版本的 `Person` 使用方式大部分与私有属性版本相同：\n\n```typescript\nconst john\
    \ = new PersonPrivateField('John');\n```\n\n```typescript\nassert.equal(\njohn.sayHello(),\
    \ 'Hello John!');\n```\n\n然而，数据被完全封装了。在类外部使用私有字段语法会导致 JavaScript 语法错误。这就是为什么我们在\
    \ A 行使用 `eval()` 来执行这段代码：\n\n```javascript\nassert.throws(\n  () => eval('john.#name'),\
    \ // (A)\n{\n  name: 'SyntaxError',\n  message: '私有字段 #name 必须在 \"\n  + \"闭包类中声明\"\
    ',\n});\n```\n\n```javascript\nassert.deepEqual(\nObject.keys(john),\n[]);\n```\n\
    \n现在的编译结果要复杂得多（经过了稍微简化）：\n\n## 17.2 TypeScript 中的非公开数据槽位\n\n```javascript\nvar\
    \ _classPrivateFieldSet = function (receiver, privateMap, value) {\n  if (!privateMap.has(receiver))\
    \ {\n    throw new TypeError(\n      '尝试在非实例上设置私有字段'\n    );\n  }\n  privateMap.set(receiver,\
    \ value);\n  return value;\n};\n\n// 省略: __classMapField\n\n```\n\n```javascript\n\
    var name = new WeakMap();\nclass Person {\n  constructor(name) {\n    // 为此实例向\
    \ _name 添加条目\n    _name.set(this, void 0);\n\n    // 现在我们可以使用辅助函数了：\n    __classPrivateFieldSet(this,\
    \ _name, name);\n  }\n  ....\n}\n```\n\n这段代码使用了一种保持实例数据私有的常用技术：\n\n- 每个 `WeakMap`\
    \ 实现私有字段。\n- 它将每个实例与一个私有数据关联。\n\n关于此主题的更多信息：请参见《给急躁的程序员准备的 JavaScript》。\n\n###\
    \ 17.2.3 私有属性 vs 私有字段\n\n- 私有属性的缺点：\n  - 我们无法在子类中重用私有属性的名称（因为属性在运行时并不是私有的）。\n\
    \  - 运行时没有封装。\n- 私有属性的优点：\n  - 客户端可以绕过封装并访问私有属性。当有人需要绕过 bug 时，这可能很有用。换句话说：数据的完全封装有利也有弊。\n\
    \n### 17.2.4 保护属性\n\n私有字段和私有属性无法在子类中访问（A 行）：\n\n```typescript\nclass PrivatePerson\
    \ {\n  private name: string;\n  constructor(name: string) {\n    this.name = name;\n\
    \  }\n}\n```\n\n```typescript\nsayHello() {\n  return `Hello ${this.name}!`;\n\
    }\n```\n\n```typescript\nclass PrivateEmployee extends PrivatePerson {\n  private\
    \ company: string;\n  constructor(name: string, company: string) {\n    super(name);\n\
    \    this.company = company;\n  }\n```\n\n```typescript\nsayHello() {\n  // @ts-expect-error:\
    \ 属性 'name' 是私有的，只能\n  // 在类 'PrivatePerson' 内部访问。(2341)\n  return `Hello ${this.name}!`;\n\
    }\n```\n\n(注：此处原文文本似乎存在格式错乱，已根据上下文逻辑进行翻译)\n\n### 17.4 初始化属性\n\n然而，有时我们以 TypeScript\
    \ 无法识别的方式初始化属性。这时可以使用感叹号（确定赋值断言）来关闭 TypeScript 的警告（A 行和 B 行）：\n\n```typescript\n\
    class Point {\n  x!: number; // (A)\n  y!: number; // (B)\n  constructor() {\n\
    \    this.initProperties();\n  }\n  initProperties() {\n    this.x = 0;\n    this.y\
    \ = 0;\n  }\n}\n```\n\n### 17.4.1.1 示例：通过对象设置实例属性\n\n在下面的示例中，我们也需要定义赋值断言。在这里，我们通过构造函数参数\
    \ props 设置实例属性：\n\n```typescript\nclass CompilerError implements CompilerErrorProps\
    \ { // (A)\n  line!: number;\n  description!: string;\n  constructor(props: CompilerErrorProps)\
    \ {\n    Object.assign(this, props); // (B)\n  }\n}\n```\n\n```typescript\n//\
    \ 用于参数属性的辅助接口\ninterface CompilerErrorProps {\n  line: number,\n  description:\
    \ string;\n}\n```\n\n// 使用该类：\n\n```typescript\nconst err = new CompilerError({\n\
    \  line: 123,\n  description: 'Unexpected token',\n});\n```\n\n(注：由于提供的原文在中间部分存在多处重复和逻辑混乱（如\
    \ PersonPrivateProperty 和 PrivateEmployee 的代码片段交叉），翻译时已根据技术逻辑进行了对齐处理，以确保输出通顺。)\n\
    \n"
