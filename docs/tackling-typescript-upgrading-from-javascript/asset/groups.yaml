    \ which functions can be assigned to it?\n\n# 21.5.1 The rules for assignability\n\
    \nIn this subsection, we examine general rules for assignability (including the\
    \ rules for functions). In this subsection, we explore what those rules mean for\
    \ functions.\n\nA Src is assignable to a type Trg if any- one of the following\
    \ conditions is true:\n\n+   - Src and Trg are identical types.\n- Src or Trg\
    \ is any type.\n- Src is a string literal and Trg is the primitive String.\n-\
    \ Src is a union type and each constituent of Src is assignable to Trg.\n- Src\
    \ and Trg are function types:\n  - Trg has a rest parameter or the number of required\
    \ parameters of Src is less than or equal to the total number of parameters of\
    \ Trg.\n  - For parameters that are present in both signatures, each parameter\
    \ type in Trg is assignable to the corresponding parameter type in Src.\n  - The\
    \ return type of Trg is void or the return type of Src is assignable to the return\
    \ type of Trg.\n- (Remaining cases omitted.)\n\n# 21.5.2 Consequences of the assignment\
    \ rules for functions\n\nIn this subsection, we look at what the assignment rules\
    \ mean for the following two functions targetFunc and sourceFunc:\n\n```\nconst\
    \ targetFunc: Trg = sourceFunc;\n```\n\n# 21.5.2.1 Types of parameters and results\n\
    \n+   - Target parameter types must be assignable to corresponding source parameter\
    \ types.\n  - Why Anything that the target accepts must also be accepted by the\
    \ source.\n- The source return type must be assignable to target return type.\n\
    \  - Why Anything that the source returns must be compatible with the expectations\
    \ set by the target.\n\nExample:\n\n```\nconst trg1: (x: RegExp) => Object = (x:\
    \ Object) => /abc;\n```\n\nThe following example demonstrates that if the return\
    \ type is void, then the source return type doesn't matter. Why is that? void\
    \ values are always ignored in TypeScript.\n\n```\nconst trg2: () => void = ()\
    \ => new Date();\n```"
