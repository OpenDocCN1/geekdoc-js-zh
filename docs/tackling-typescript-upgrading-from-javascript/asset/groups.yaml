    \n```typescript\nconst enum NoYes {\n  No,\n  Yes,\n}\n```\n\n```typescript\n\
    function toGerman(value: NoYes) {\n  switch (value) {\n    case NoYes.No:\n  \
    \    return 'Nein';\n    case NoYes.Yes:\n      return 'Ja';\n  }\n}\n```\n\n\
    Now the representation of the enum as a construct disappears and only the values\
    \ of its members remain:\n\n```typescript\nfunction toGerman(value) {\n  switch\
    \ (value) {\n```\n"
  mdcn: "\n\n## 13 TypeScript 枚举（enums）：它们是如何工作的？可以有什么用途？\n\n```typescript\nfunction\
    \ func(noYes: NoYes) {}\n```\n\n```typescript\n// @ts-expect-error: Argument of\
    \ type \"abc\" is not assignable\n// to parameter of type 'NoYes'.\nfunc('abc');\n\
    \n// @ts-expect-error: Argument of type \"Yes\" is not assignable\n// to parameter\
    \ of type 'NoYes'.\nfunc('Yes'); // (A)\n```\n\n即使是与成员值相同的字符串也不允许（行 A）。\n\n##\
    \ 13.4 枚举的用例\n\n### 13.4.1 用例：文件系统模块\n\n在 Node.js 的文件系统模块中，有几个函数带有 `mode` 参数。它通过数值编码来指定文件权限，这是\
    \ Unix 的遗留：\n\n- 权限允许适用于三类用户：\n  - 用户（User）：文件的所有者\n  - 组（Group）：与文件关联的组的成员\n\
    \  - 所有（All）：所有人\n\n- 对于每个类别，可以授予以下权限：\n  - r（读）：允许该类用户读取文件\n  - w（写）：允许该类用户修改文件\n\
    \  - x（执行）：允许该类用户运行文件\n\n这意味着权限可以用 9 位表示（3 类用户，每类 3 种权限）：\n\n| 用户 | 组 | 所有 |\n\
    | :--- | :--- | :--- |\n| 权限 r, w, x | r, w, x | r, w, x |\n| 位 8, 7, 6 | 5, 4,\
    \ 3 | 2, 1, 0 |\n\nNode.js 并没有这样做，但我们可以使用枚举来处理这些标记：\n\n```typescript\nenum Perm\
    \ {\n  UserRead = 1 << 8, //第 8 位\n  UserWrite = 1 << 7,\n  UserExecute = 1 <<\
    \ 6,\n  GroupRead = 1 << 5,\n  GroupWrite = 1 << 4,\n  GroupExecute = 1 << 3,\n\
    \  AllRead = 1 << 2,\n  AllWrite = 1 << 1,\n  AllExecute = 1 << 0,\n}\n```\n\n\
    位模式通过按位或（Or）组合：\n\n```typescript\n// 用户可以修改、读取和执行。\n// 所有人只能读取和执行。\nassert.equal(\n\
    \  Perm.UserRead | Perm.UserWrite | Perm.UserExecute |\n  Perm.GroupRead | Perm.GroupExecute\
    \ |\n  Perm.AllRead | Perm.AllExecute,\n  00755\n);\n\n// 用户可以读取和写入。\n// 组成员可以读取。\n\
    // 所有人完全无法访问。\nassert.equal(\n  Perm.UserRead | Perm.UserWrite | Perm.GroupRead,\n\
    \  00640\n);\n```\n\n### 13.4.1.1 位模式的替代方案\n\n位模式背后的核心思想是一组标记，并且可以选择标记的任何子集。\n\
    \n因此，使用集合（sets）来选择子集是执行相同任务更直接的方法：\n\n```typescript\nenum Perm {\n  UserRead =\
    \ 'UserRead',\n  UserWrite = 'UserWrite',\n  UserExecute = 'UserExecute',\n  GroupRead\
    \ = 'GroupRead',\n  GroupWrite = 'GroupWrite',\n  GroupExecute = 'GroupExecute',\n\
    \  AllRead = 'AllRead',\n  AllWrite = 'AllWrite',\n  AllExecute = 'AllExecute'\n\
    }\nfunction writeFileSync(\n  thePath: string, permissions: Set<Perm>, content:\
    \ string) {\n  // ...\n}\n\nwriteFileSync(\n  '/tmp/hello.txt',\n  new Set([Perm.UserRead,\
    \ Perm.UserWrite, Perm.GroupRead]),\n  'Hello!'\n);\n```\n\n### 13.4.2 用例：多个常量\n\
    \n有时我们有一组在一起的常量：\n\n```typescript\nconst off = 'off';\nconst info = 'info';\n\
    const warn = 'warn';\nconst error = 'error';\n```\n\n这是一个使用枚举的好用例：\n\n```typescript\n\
    enum LogLevel {\n    off = 'off',\n    info = 'info',\n    warn = 'warn',\n  \
    \  error = 'error'\n}\n```\n\n枚举的一个优点是常量名被分组在 `LogLevel` 命名空间内。另一个优点是自动为它们获取 `LogLevel`\
    \ 类型。如果我们想为这些常量获取这种类型，还需要更多工作：\n\n```typescript\ntype LogLevel =\n    | typeof\
    \ off\n    | typeof info\n    | typeof warn\n    | typeof error\n```\n\n关于这种方法的更多信息，请参阅\
    \ §14.1.3 “单例联合类型”。\n\n### 13.4.3 用例：比布尔值更具自描述性\n\n#### 13.4.3.1 布尔值示例：有序 vs 无序\n\
    \n例如，为了表示列表是否是有序的，我们可以使用布尔值：\n\n```typescript\nclass List1 {\n    isSelected:\
    \ boolean;\n    // ...\n}\n```\n\n然而，枚举通常更具自描述性，并且如果需要，我们可以添加更多选项。\n\n```typescript\n\
    enum ListKind {\n    ordered, unordered\n}\nclass List2 {\n    listKind: ListKind;\n\
    \    // ...\n}\n```\n\n#### 13.4.3.2 布尔值示例：错误处理\n\n同样，我们可以通过布尔值指定如何处理错误：\n\n```typescript\n\
    function convertToHtml(markdown: string, throwOnError: boolean) {\n  // ...\n\
    }\n```\n\n或者我们可以通过枚举值来实现：\n\n```typescript\nenum ErrorHandling {\n  throwOnError\
    \ = 'throwOnError',\n  showErrorsInContent = 'showErrorsInContent'\n}\nfunction\
    \ convertToHtml2(markdown: string, errorHandling: ErrorHandling) {\n  // ...\n\
    }\n```\n\n### 13.4.4 用例：更好的字符串常量\n\n考虑以下创建正则表达式的函数：\n\n```typescript\nconst GLOBAL\
    \ = 'g';\nconst NOT_GLOBAL = '';\ntype Globalness = typeof GLOBAL | typeof NOT_GLOBAL;\n\
    ```\n\n```typescript\nfunction createRegExp(source: string,\n  globalness: Globalness\
    \ = NOT_GLOBAL) {\n  return new RegExp(source, 'u' + globalness);\n}\n```\n\n\
    ```typescript\nassert.deepEqual(\n  createRegExp('abc', GLOBAL),\n  /abc/ug\n\
    );\n```\n\n```typescript\nassert.deepEqual(\n  createRegExp('abc', 'g'), // OK\n\
    \  /abc/ug\n);\n```\n\n我们可以使用枚举代替字符串常量：\n\n```typescript\nenum Globalness {\n\
    \  Global = 'g',\n  notGlobal = '',\n}\n```\n\n```typescript\nfunction createRegExp(source:\
    \ string, globalness = Globalness.notGlobal) {\n  return new RegExp(source, 'u'\
    \ + globalness);\n}\n```\n\n```typescript\nassert.deepEqual(\n  createRegExp('abc',\
    \ Globalness.Global),\n  /abc/ug\n);\n```\n\n```typescript\nassert.deepEqual(\n\
    \  // ts-expect-error: Argument of type \"g\" is not assignable to parameter of\
    \ type 'Global'\n  createRegExp('abc', 'g'), // \n  /abc/ug\n);\n```\n\n这种方法有什么好处？\n\
    \n- 它更简洁。\n- 它稍微安全。\n\n### 13.5 运行时的枚举\n\n给定一个数值枚举，如下：\n\n```typescript\nenum\
    \ NoYes {\n  No,\n  Yes\n}\n```\n\nTypeScript 将其编译为：\n\n```javascript\nvar NoYes;\n\
    (function (NoYes) {\n  NoYes[0] = \"No\";\n  NoYes[1] = \"Yes\";\n})(NoYes ||\
    \ {});\n```\n\n数值枚举还支持从成员名到值的反向映射：\n\n```typescript\nfunction getQualifiedName(value:\
    \ NoYes) {\n  return 'NoYes.' + value;\n}\nassert.equal(getQualifiedName(NoYes.Yes),\
    \ 'NoYes.1');\n```\n\n动态查找：\n\n```typescript\nassert.equal(NoYes[1], 'Yes');\n\
    ```\n\n### 13.5 运行时的字符串基枚举\n\n考虑以下枚举：\n\n```typescript\nenum NoYes {\n  No = 'NO!',\n\
    \  Yes = 'YES!'\n}\n```\n\n它被编译为这段代码：\n\n```javascript\nvar NoYes;\n(function\
    \ (NoYes) {\n  NoYes['No'] = \"NO!\";\n  NoYes['Yes'] = \"YES!\";\n})((NoYes =\
    \ {}));\n```\n\nTypeScript 不支持字符串基枚举的反向映射。\n\n### 13.6 const 枚举\n\n如果枚举以关键字 `const`开头，它在运行时没有表示。相反，其成员的值会被直接使用。\n\
    \n### 13.6.1 编译非 const 枚举\n\n为了观察这种效果，让我们检查以下非 const 枚举：\n\n```typescript\nenum\
    \ NoYes {\n  No = 'No',\n  Yes = 'Yes',\n}\n```\n\n```typescript\nfunction toGerman(value:\
    \ NoYes) {\n  switch (value) {\n    case NoYes.No:\n      return 'Nein';\n   \
    \ case NoYes.Yes:\n      return 'Ja';\n  }\n}\n```\n\nTypeScript 严格将此代码编译为：\n\n\
    ```javascript\n\"use strict\";\nvar NoYes;\n(function (NoYes) {\n  NoYes[\"No\"\
    ] = \"No\";\n  NoYes[\"Yes\"] = \"Yes\";\n})(NoYes || (NoYes = {}));\n```\n\n\
    ```typescript\nfunction toGerman(value) {\n  switch (value) {\n    case NoYes.No:\n\
    \      return 'Nein';\n    case NoYes.Yes:\n      return 'Ja';\n  }\n}\n```\n\n\
    ### 13.6.2 编译 const enum\n\n这与之前的代码相同，但现在枚举是 const：\n\n```typescript\nconst enum\
    \ NoYes {\n  No,\n  Yes,\n}\n```\n\n```typescript\nfunction toGerman(value: NoYes)\
    \ {\n  switch (value) {\n    case NoYes.No:\n      return 'Nein';\n    case NoYes.Yes:\n\
    \      return 'Ja';\n  }\n}\n```\n\n现在枚举作为构造的消失了，只剩下其成员的值：\n\n```typescript\n\
    function toGerman(value) {\n  switch (value) {\n```\n\n"
