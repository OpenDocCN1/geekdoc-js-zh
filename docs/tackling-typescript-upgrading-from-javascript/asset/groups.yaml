- md: "\n17.5 Abstract classes\n\n## 17.4.2 Making constructor parameters public,\
    \ private, or protected\n\nIf we use the keyword public for a constructor parameter,\
    \ then TypeScript does two things for us:\n\n- It declares a public instance property\
    \ with the same name.\n- It assigns the parameter to that instance property.\n\
    \nTherefore, the two classes are equivalent:\n\n```typescript\nclass Point1 {\n\
    \  constructor(public x: number, public y: number) {\n  }\n}\n```\n\n```typescript\n\
    class Point2 {\n  x: number;\n  y: number;\n  constructor(x: number, y: number)\
    \ {\n    this.x = x;\n    this.y = y;\n  }\n}\n```\n\nIf we use private or protected\
    \ instead of public, then the corresponding instance properties are private or\
    \ protected (not public).\n\n## Abstract classes\n\nTwo constructs can be abstract\
    \ in TypeScript: Only its subclasses can – if they are not abstract, themselves.\n\
    \n- An abstract class can't be instantiated. An abstract method has no implementation,\
    \ only a type signature. Each concrete subclass must have a concrete method with\
    \ the same name and a compatible type signature.\n- If a class has abstract methods,\
    \ it must be abstract, too.\n\nThe following code demonstrates abstract classes\
    \ and methods.\n\nOn one hand, there is the superclass Printable and its helper\
    \ class StringBuilder:\n\n```typescript\nclass StringBuilder {\n  string = '';\n\
    \  add(str: string) {\n    this.string += str;\n  }\n}\n```\n\n```typescript\n\
    abstract class Printable {\n  toString() {\n    const out = new StringBuilder();\n\
    \    this.print(out);\n    return out.string;\n  }\n  abstract print(out: StringBuilder):\
    \ void;\n}\n```\n\nOn the other hand, there are the concrete subclasses Entries\
    \ and Entry:\n\n```typescript\nclass Entries extends Printable {\n  entries: Entry[];\n\
    \  constructor(entries: Entry[]) {\n    super();\n    this.entries = entries;\n\
    \  }\n  print(out: StringBuilder): void {\n    for (const entry of this.entries)\
    \ {\n      entry.print(out);\n    }\n  }\n}\nclass Entry extends Printable {\n\
    \  key: string;\n  value: string;\n  constructor(key: string, value: string) {\n\
    \    super();\n    this.key = key;\n    this.value = value;\n  }\n  print(out:\
    \ StringBuilder): void {\n    out.add(this.key);\n    out.add(': ');\n    out.add(this.value);\n\
    \    out.add('\\n');\n  }\n}\n```\n\nAnd finally, this is using Entries and Entry:\n\
    \n```typescript\nconst entries = new Entries([\n  new Entry('accept-ranges', 'bytes'),\n\
    \  new Entry('content-length', '6518'),\n]);\nassert.equal(\n  entries.toString(),\n\
    \  'accept-ranges: bytes\\ncontent-length: 6518\\n'\n);\n```\n\nNotes about abstract\
    \ classes:\n\n- An abstract class can be seen as an interface where some members\
    \ already have implementations.\n- While a class can implement multiple interfaces,\
    \ it can only extend at most one abstract class.\n- “Abstractness” only exists\
    \ at compile time. At runtime, abstract classes are normal classes and abstract\
    \ methods don’t exist (due to them only providing compile-time information).\n\
    - Abstract classes can be seen as templates where each abstract method is a blank\
    \ that has to be filled in (implemented) by subclasses.\n\n## Chapter 18\n\n##\
    \ Class-related types\n\n| Contents |\n| :--- | :--- |\n| 18.1 The prototype chains\
    \ of classes | 153 |\n| 18.2 Interfaces for instances of classes | 154 |\n| 18.3\
    \ Interfaces for classes | 155 |\n| 18.3.1 Example: converting from and to JSON\
    \ | 155 |\n| 18.3.2 Example: TypeScript's built-in interfaces for the class Object\
    \ and for its instances | 156 |\n| 18.4 Classes as types | 157 |\n| 18.4.1 Pitfall:\
    \ classes work structurally, not nominally | 157 |\n| 18.5 Further reading | 159\
    \ |\n\nIn this chapter about TypeScript, we examine types related to classes and\
    \ their instances.\n\n## 18.1 The prototype chains of classes\n\nConsider this\
    \ class:\n\n```typescript\nclass Counter extends Object {\n    static createZero()\
    \ {\n        return new Counter(0);\n    }\n    value: number;\n    constructor(value:\
    \ number) {\n        super();\n        this.value = value;\n    }\n    increment()\
    \ {\n        this.value++;\n    }\n}\n```\n\n```typescript\n// Static method\n\
    const myCounter = Counter.createZero();\nassert.ok(myCounter instanceof Counter);\n\
    assert.equal(myCounter.value, 0);\n```\n\n```typescript\n// Instance method\n\
    myCounter.increment();\nassert.equal(myCounter.value, 1);\n```\n\n## 18.2 Interfaces\
    \ for instances of classes\n\nIn this chapter, we will first explore how to describe\
    \ instances. Interfaces provide services. For example:\n\n```typescript\ninterface\
    \ CountingService {\n  value: number;\n  increment(): void;\n}\n```\n\n## 18.3\
    \ Interfaces for classes\n\nStructural interfaces are convenient: if we know ahead\
    \ of time that an object must implement an interface, it often makes sense to\
    \ check if it does.\n\n```typescript\nclass Counter implements CountingService\
    \ {\n  // ...\n}\n```\n\nComments:\n\n- TypeScript does not distinguish between\
    \ inherited properties and own properties.\n- Static properties are ignored by\
    \ interfaces.\n\nClasses themselves are also objects (functions). Therefore, we\
    \ can use interfaces to identify them. The next section gives an example.\n\n\
    ### 18.3.1 Example: converting from and to JSON\n\nThe following interfaces can\
    \ be used for classes to support their instances being converted from to JSON:\n\
    \n```typescript\n// Converting JSON to instances\ninterface JsonStatic {\n  fromJson(json:\
    \ any): JsonInstance;\n}\n```\n\n```typescript\n// Converting instances to JSON\n\
    interface JsonInstance {\n  toJson(): any;\n}\n```\n\nWe use these interfaces\
    \ in the following code:\n\n```typescript\nclass Person implements JsonInstance\
    \ {\n  static fromJSON(json: any): Person {\n    if (typeof json !== 'string')\
    \ {\n      throw new TypeError(json);\n    }\n    return new Person(json);\n \
    \ }\n  name: string;\n  constructor(name: string) {\n    this.name = name;\n \
    \ }\n  toJson(): any {\n    return this.name;\n  }\n}\n```\n\nThis is how we can\
    \ check right away if class Person (as an object) implements the interface JsonStatic:\n\
    \n```typescript\n// Assign the class to a type-annotated variable\nconst personImplementsJsonStatic:\
    \ JsonStatic = Person;\n```\n\nThe following way of making this check may well\
    \ seem like a good idea:\n\n```typescript\nconst Person: JsonStatic = class implements\
    \ JsonInstance\n// ...\n;\n```\n\nHowever, that doesn't really work:\n\n- We can't\
    \ new Person because JsonStatic does not have a construct signature.\n- If Person\
    \ has static properties beyond .fromJson(), TypeScript won't let us access them.\n\
    \n### 18.3.2 Example: TypeScript's built-in interfaces for the class Object and\
    \ its instances\n\nIt is instructive to take a look at TypeScript's built-in types:\n\
    \nOn one hand, interface ObjectConstructor is for class Object itself:\n\n```typescript\n\
    /**\n * Provides functionality common to all JavaScript objects.\n */\ndeclare\
    \ var Object: ObjectConstructor;\n```\n\n```typescript\ninterface ObjectConstructor\
    \ {\n  new(value?: any): Object;\n  (): any;\n  (value: any): any;\n}\n```\n\n\
    ```typescript\n/** A reference to the prototype for a class of objects. */\nreadonly\
    \ prototype: Object;\n```\n"
  mdcn: "\n\n17.5 抽象类\n\n## 17.4.2 将构造函数参数设置为公共、私有或受保护\n\n如果我们对构造函数参数使用 `public` 关键字，TypeScript\
    \ 会为我们做两件事：\n\n- 它会声明一个同名的公共实例属性。\n- 它会将该参数赋值给该实例属性。\n\n因此，这两个类是等价的：\n\n```typescript\n\
    class Point1 {\n  constructor(public x: number, public y: number) {\n  }\n}\n\
    ```\n\n```typescript\nclass Point2 {\n  x: number;\n  y: number;\n  constructor(x:\
    \ number, y: number) {\n    this.x = x;\n    this.y = y;\n  }\n}\n```\n\n如果我们使用\
    \ `private` 或 `protected` 代替 `public`，那么相应的实例属性将是私有的或受保护的（而不是公的）。\n\n## 抽象类\n\n\
    在 TypeScript 中有两种结构可以是抽象的：只有它们的子类可以是——前提是它们本身不是抽象的。\n\n- 抽象类不能被实例化。抽象方法没有实现，只有类型签名。每个具体的子类必须有一个具有相同名称和兼容类型签具体方法。\n\
    - 如果一个类拥有抽象方法，它也必须是抽象类。\n\n下面的代码演示了抽象类和抽象方法。\n\n一方面，有一个父类 `Printable` 它的辅助类 `StringBuilder`：\n\
    \n```typescript\nclass StringBuilder {\n  string = '';\n  add(str: string) {\n\
    \    this.string += str;\n  }\n}\n```\n\n```typescript\nabstract class Printable\
    \ {\n  toString() {\n    const out = new StringBuilder();\n    this.print(out);\n\
    \    return out.string;\n  }\n  abstract print(out: StringBuilder): void;\n}\n\
    ```\n\n另一方面，还有具体的子类 `Entries` 和 `Entry`：\n\n```typescript\nclass Entries extends\
    \ Printable {\n  entries: Entry[];\n  constructor(entries: Entry[]) {\n    super();\n\
    \    this.entries = entries;\n  }\n  print(out: StringBuilder): void {\n    for\
    \ (const entry of this.entries) {\n      entry.print(out);\n    }\n  }\n}\nclass\
    \ Entry extends Printable {\n  key: string;\n  value: string;\n  constructor(key:\
    \ string, value: string) {\n    super();\n    this.key = key;\n    this.value\
    \ = value;\n  }\n  print(out: StringBuilder): void {\n    out.add(this.key);\n\
    \    out.add(': ');\n    out.add(this.value);\n    out.add('\\n');\n  }\n}\n```\n\
    \n最后，这是对 `Entries` 和 `Entry` 的使用：\n\n```typescript\nconst entries = new Entries([\n\
    \  new Entry('accept-ranges', 'bytes'),\n  new Entry('content-length', '6518'),\n\
    ]);\nassert.equal(\n  entries.toString(),\n  'accept-ranges: bytes\\ncontent-length:\
    \ 6518\\n'\n);\n```\n\n关于抽象类的说明：\n\n- 抽象类可以被视为接口，其中某些成员已经有了实现。\n- 虽然类可以实现多个接口，但它最多只能扩展一个抽象类。\n\
    - “抽象性”只存在于编译时。在运行时，抽象类是普通类，抽象方法不存在（因为它们只提供了编译时信息）。\n- 抽象类可以被视为模板，每个抽象方法都是一个必须由子类填充（实现）的空白。\n\
    \n## 第 18 章\n\n## 类相关的类型\n\n| 内容 | |\n| :--- | :--- |\n| 18.1 类的原型链 | 153 |\n\
    | 18.2 类实例的接口 | 154 |\n| 18.3 类的接口 | 155 |\n| 18.3.1 示例：在 JSON 之间进行转换 | 155 |\n\
    | 18.3.2 示例：TypeScript 为类 Object 及其实例提供的内置接口 | 156 |\n| 18.4 作为类型的类 | 157 |\n\
    | 18.4.1 陷阱：类是结构化工作的，而非命名的 | 157 |\n| 18.5 进阶阅读 | 159 |\n\n在关于 TypeScript 的这一章节中，我们将检查与类及其实例相关的类型。\n\
    \n## 18.1 类的原型链\n\n考虑这个类：\n\n```typescript\nclass Counter extends Object {\n \
    \   static createZero() {\n        return new Counter(0);\n    }\n    value: number;\n\
    \    constructor(value: number) {\n        super();\n        this.value = value;\n\
    \    }\n    increment() {\n        this.value++;\n    }\n}\n```\n\n```typescript\n\
    // 方法\nconst myCounter = Counter.createZero();\nassert.ok(myCounter instanceof\
    \ Counter);\nassert.equal(myCounter.value, 0);\n```\n\n```typescript\n// 实例方法\n\
    myCounter.increment();\nassert.equal(myCounter.value, 1);\n```\n\n## 18.2 类实例的接口\n\
    \n在本章中，我们将首先探索如何描述实例。接口提供了服务。例如：\n\n```typescript\ninterface CountingService {\n\
    \  value: number;\n  increment(): void;\n}\n```\n\n## 18.3 类的接口\n\n结构化接口非常方便：如果预先知道一个对象必须实现某个接口，那么检查它是否实现通常是有意义的。\n\
    \n```typescript\nclass Counter implements CountingService {\n  // ...\n}\n```\n\
    \n注释：\n\n- TypeScript 不区分继承属性和自身的属性。\n- 静态属性被接口忽略。\n\n类本身也是对象（函数）。因此，我们可以使用接口来标识它们。下一节给出一个示例。\n\
    \n### 18.3.1 示例：在 JSON 之间进行转换\n\n以下接口可以用于类支持从 JSON 转换：\n\n```typescript\n// JSON\
    \ 转换为实例\ninterface JsonStatic {\n  fromJson(json: any): JsonInstance;\n}\n```\n\
    \n```typescript\n// 实例转换为 JSON\ninterface JsonInstance {\n  toJson(): any;\n}\n\
    ```\n\n我们在下面的代码中使用这些接口：\n\n```typescript\nclass Person implements JsonInstance\
    \ {\n  static fromJSON(json: any): Person {\n    if (typeof json !== 'string')\
    \ {\n      throw new TypeError(json);\n    }\n    return new Person(json);\n \
    \ }\n  name: string;\n  constructor(name: string) {\n    this.name = name;\n \
    \ }\n  toJson(): any {\n    return this.name;\n  }\n}\n```\n\n这是我们可以立即检查类（作为对象）是否实现了接口\
    \ `JsonStatic` 的方法：\n\n```typescript\n// 将类赋值给类型注解变量\nconst personImplementsJsonStatic:\
    \ JsonStatic = Person;\n```\n\n这种这种检查的方法似乎是个好主意：\n\n```typescript\nconst Person:\
    \ JsonStatic = class implements JsonInstance\n// ...\n;\n```\n\n然而，这并不可行：\n\n\
    - 我们无法 `new Person`，因为 `JsonStatic` 没有构造签名。\n- 如果 `Person` 有 `.fromJson()` 之外的静态属性，TypeScript\
    \ 不允许我们访问它们。\n\n### 18.3.2 示例：TypeScript 为类 Object 及其实例提供的内置接口\n\n查看 TypeScript\
    \ 的内置类型是有启发性的：\n\n一方面，`ObjectConstructor` 是针对 `Object` 类本身的：\n\n```typescript\n\
    /**\n * 为所有 JavaScript 对象提供共同功能。\n */\ndeclare var Object: ObjectConstructor;\n\
    ```\n\n```typescript\ninterface ObjectConstructor {\n  new(value?: any): Object;\n\
    \  (): any;\n  (value: any): any;\n}\n```\n\n```typescript\n/** 指类对象的原型的引用。 */\n\
    readonly prototype: Object;\n```\n\n"
