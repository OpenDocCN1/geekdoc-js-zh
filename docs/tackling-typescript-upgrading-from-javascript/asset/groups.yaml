    \ 186\n\n本章探讨了 TypeScript 中函数的静态类型。\n\n> 在本章中，“函数”指的是关于函数的“函数或方法或构造函数”，这些关于函数（特别是关于参数处理方面）的描述也适用于方法和构造函数。\n\
    \n## 21.1 定义静态类型函数\n\n### 21.1.1 函数声明\n\n这是一个 TypeScript 中函数声明的示例：\n\n```typescript\n\
    function repeat1(str: string, times: number): string { // (A)\n  str.repeat(times);\n\
    }\nassert.equal(\n  repeat1('*', 5, '******');\n```\n\n- 参数：如果编译器选项 `--noImplicitAny`\
    \ 被推断。这通常是开启的，如果是 `--strict`，则每个参数的类型必须是可推断的或显式指定的（我们稍后会详细查看推断）。在这种情况下，无法推断，这就是为什么\
    \ `str` 和 `times` 有类型注解。\n- 返回值：默认情况下，函数的返回类型是推断的。这通常足够了。在这种情况下，我们选择显式指定 `repeat1()`\
    \ 的返回类型为 `string`（行 A 中的最后一个类型注解）。\n\n### 21.1.2 箭头函数\n\n`repeat1()` 的函数版本如下：\n\
    \n```typescript\nconst repeat2 = (str: string, times: number): string => {\n \
    \ str.repeat(times);\n};\n```\n\n在这种情况下，我们也可以使用表达式体：\n\n```typescript\nconst repeat3\
    \ = (str: string, times: number): string =>\nstr.repeat(times);\n```\n\n## 21.2\
    \ 函数类型\n\n### 21.2.1 函数类型签名\n\n我们可以通过函数类型签名为函数定义类型：\n\n```typescript\ntype Repeat\
    \ = (str: string, times: number) => string;\n```\n\n这种函数的类型名为 `Repeat`。其他情况下，它匹配所有如下函数：\n\
    \n- `(str: string, times: number) => string`\n\n### 21.2.2 带有调用签名的接口\n\n我们也可以使用接口来定义：\n\
    \n```typescript\ninterface Repeat {\n  (str: string, times: number): string;\n\
    }\n```\n\n### 21.2.3 检查值是否匹配函数类型\n\n176\n\n### 21.2.3.2 函数声明（简单）\n\n检查函数声明更复杂：\n\
    \n```typescript\nfunction pred2(str: string): boolean {\n  return str.length >\
    \ 0;\n}\n```\n\n// 将函数赋值给带类型注解的变量\nconst pred2ImplementsStringPredicate: StringPredicate\
    \ = pred2;\n\n### 21.2.3.3 函数声明（复杂）\n\n解决方案有点（也就是说，如果你不完全理解没关系，但展示了多种特性）：\n\n\
    ```typescript\nfunction pred3([...str]: Parameters<StringPredicate>\n  : ReturnType<StringPredicate>\
    \ {\n  return str.length > 0;\n}\n```\n\n- 我们使用 `Parameters<>` 提取参数类型的元组。三个点表示剩余参数，它将所有参数收集到一个元组/数组中。`[str]`\
    \ 对元组进行解构。（在本章稍后会介绍剩余参数。）\n- 返回值：我们使用 `ReturnType<>` 提取返回类型。\n\n"
