    \ 227\n\n在本章中，我们将探索如何在 TypeScript 中编译时使用类型进行计算。请注意，本章的重点是学习如何进行类型计算。因此，我们将大量使用字面量类型（literal\
    \ types），示例的实际相关性较低。\n\n## 25.1 类型作为元值\n\n考虑以下两个级别的 TypeScript 代码：\n\n- 程序级：在运行时，我们可以使用值和函数。\n\
    - 类型级：在编译时，我们可以使用特定类型和泛型类型。\n\n类型级是程序级的元级。\n\n| 级别 | 可用时间 | 操作数 | 运算 |\n|---|---|---|---|\n\
    | 程序级 | 运行时 | 值 | 函数 |\n| 类型级 | 编译时 | 特定类型 | 泛型类型 |\n\n使用类型进行计算意味着什么？以下代码是一个示例：\n\
    \n```typescript\ntype ObjectLiterType = {\nfirst: 1,\nsecond: 2,\n}\n// 推断类型:\
    \ \"first\" | \"second\"\ntype Result = keyof ObjectLiterType; // (A)\n```\n\n\
    在 A 行中，我们采取了以下步骤：\n\n- 我们计算的输入是类型 `ObjectLiterType`。\n- 我们对输入应用 `keyof` 操作。它列出了对象类型的属性键。\n\
    - 我们为 `keyof` 的输出命名为 `Result`。\n\n在类型级上，我们可以使用以下“值”进行计算：\n\n```typescript\ntype\
    \ ObjectLiterType = {\nprop1: string,\nprop2: number,\n}\n\ninterface InterfaceType\
    \ {\nprop1: string;\nprop2: number;\n}\n\ntype TupleType = [boolean, bigint];\n\
    // 空值类型和字面量类型 :::\n// 与值的语法相同，但它们都是类型\n\ntype Undefined = undefined;\ntype NullType\
    \ = null;\n\ntype BooleanLiterType = true;\ntype NumberLiteralType = 12.34;\n\
    type BigIntLiteralType = 1234n;\ntype StringLiterType = 'abc';\n```\n\n## 25.2\
    \ 泛型类型：类型的工厂\n\n泛型类型是元级上的函数——例如：\n\n## 25.3 联合类型与交集类型\n\n```typescript\ntype Wrap<T>\
    \ = [T];\n```\n\n泛型类型 `Wrap<>` 拥有参数 `T`。它的结果是 `T`，封装在一个元组类型中。这就是我们如何使用这个元函数：\n\
    \n```typescript\n// 推断类型: [string]\ntype Wrapped = Wrap<string>;\n```\n\n我们将参数\
    \ `string` 传递给 `Wrap<>` 并将结果命名为 `Wrapped`。结果是一个包含单个组件（类型 `string`）的元组类型。\n\n##\
    \ 25.3 联合类型与交集类型\n\n### 25.3.1 联合类型 ()\n\n运算符 `|` 用于创建联合类型：\n\n```typescript\n\
    type A = 'a' | 'b' | 'c'\ntype B = 'b' | 'c' | 'd';\n```\n\n```typescript\n//\
    \ 推断类型: \"a\" | \"b\" | \"c\" | \"d\"\ntype Union = A | B;\n```\n\n如果我们将类型 A 和类型\
    \ `B` 视为集合，那么 `A | B` 就是这些集合的集合论并集。换句话说：结果的成员至少是两个操作数之一的成员。\n\n在语法上，我们可以在联合类型的第一个组件之前放置一个\
    \ `|`。当类型定义跨越多行时，这非常方便：\n\n```typescript\ntype A =\n| 'a'\n| 'b'\n| 'c'\n;\n```\n\
    \n### 25.3.1.1 联合类型作为元值的集合\n\nTypeScript 将元值集合表示为字面量类型的联合。我们已经见过它的示例了：\n\n```typescript\n\
    type Obj = {\nfirst: 1,\nsecond: 2,\n};\n```\n\n```typescript\n// 推断类型: \"first\"\
    \ | \"second\"\ntype Result = keyof Obj;\n```\n\n我们将很快看到对这种集合的运算。\n\n### 25.3.1.2\
    \ 对象的联合类型\n\n由于联合类型的每个成员都是操作数之一的成员，我们只能安全地访问所有操作数都拥有的属性。要访问其他属性，我们需要一个类型守卫（type\
    \ guard）：\n\n```typescript\ntype ObjectTypeA = {\npropA: bigint,\nsharedProp:\
    \ string,\n}\ntype ObjectTypeB = {\npropB: boolean,\nsharedProp: string,\n}\n\n\
    type Union = ObjectTypeA | ObjectTypeB;\n\nfunction func(arg: Union) {\n  // (A)\
    \ OK\n  // @ts-expect-error: 属性 'propB' 不存在于类型 'Union'\n  arg.propB;\n}\n```\n\
    \n```typescript\nif ('propB' in arg) { // (B) 类型守卫\n// ObjectTypeB\narg;\n}\n\
    ```\n\n### 25.3.2 交集类型 (&)\n\n运算符 `&` 用于创建交集类型：\n\n```typescript\ntype A = 'a'\
    \ | 'b' | 'c';\ntype B = 'b' | 'c' | 'd';\n```\n\n```typescript\n// 推断类型: \"b\"\
    \ | \"c\"\ntype Intersection = A & B;\n```\n\n如果我们将类型 A 和 B 视为集合，那么 `A & B` 就是这些集合的集合论交集。换句话说：结果的成员是两个操作数的成员。\n\
    \n### 25.3.2.1 对象的交集类型\n\n两个对象类型的交集拥有所有类型的属性：\n\n```typescript\ntype Obj1 = {\
    \ prop1: boolean };\ntype Obj2 = { prop2: number };\n```\n\n```typescript\ntype\
    \ Both = {\nprop1: boolean,\nprop2: number,\n}\n```\n\n```typescript\n// 类型 Obj1\
    \ & Obj2 可赋值给类型 Both\n// 推断类型: true\ntype IntersectionHasProperties = IsAssignableTo<Obj1\
    \ & Obj2, Both>;\n\n（泛型类型 `AssignableTo<>` 已解释。）\n\n### 25.3.2.2 使用交集类型进行混合\n\n\
    如果我们将对象类型 `Named` 混合到另一个类型 `Obj` 中，我们需要一个交集类型（A 行）：\n\n```typescript\ninterface\
    \ Named {\n  name: string;\n}\nfunction addName<Obj extends object>(obj: Obj,\
    \ name: string)\n  : Obj & Named // (A)\n{\n  const namedObj = obj as (Obj & Named);\n\
    \  namedObj.name = name;\n  return namedObj;\n}\n\nconst obj = {\n  last: 'Doe',\n\
    };\n\n// 推断类型: { last: string; } & Named\nconst namedObj = addName(obj, 'Jane');\n\
    ```\n\n### 25.4 条件类型\n\n条件类型具有以下语法：\n\n```typescript\n«Type2» extends «Type1»\
    \ ? «ThenType> : «ElseType>\n```\n\n如果 `Type2` 可赋值给 `Type1`，则该类型表达式的结果是 `ThenType`。否则，为\
