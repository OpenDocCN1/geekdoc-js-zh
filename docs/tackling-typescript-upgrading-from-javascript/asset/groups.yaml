  - "[PAGE 34]\n\n# 7.3 Types in TypeScript\n\n+   - strictNullChecks: null is not\
    \ part of any type (other than its own type, null)\n- and must be explicitly mentioned\
    \ if it is a acceptable value.\n- strictFunctionTypes: enables stricter checks\
    \ for function types.\n- strictPropertyInitialization: Properties in class definitions\
    \ must be initialized, unless they have the value undefined.\n\nWe will see more\
    \ compiler options later in this book, when we get to creating npm packages and\
    \ web apps with TypeScript. The TypeScript handbook has comprehensive documentation\
    \ on them.\n\n# 7.3 Types in TypeScript\n\nIn this chapter a type is simply a\
    \ set of values. The JavaScript language (not TypeScript!) has only eight types:\n\
    \n+   1. Undefined: the set with the only element undefined\n2. Null: the set\
    \ with the only element null\n3. Boolean: the set with the two elements false\
    \ and true\n4. Number: the set of all numbers\n5. Bigint: the set of all arbitrary-precision\
    \ integers\n6. String: the set of all strings\n7. Symbol: the set of all symbols\n\
    8. Object: the set of all objects (which includes functions and arrays)\n\nAll\
    \ of these are dynamic: we can use them at runtime.\n\nTypeScript brings an additional\
    \ layer to JavaScript: static types. These only exist when compiling or type-checking\
    \ source code. Each storage location (variable, property, etc.) has a static type\
    \ that predicts its dynamic value. Type checking ensures that these predictions\
    \ come true.\n\nAnd there is a lot that can be checked statically (without running\
    \ the code). If, example the parameter num of a function to toString(num) has\
    \ the static type number, then the function call to toString('abc') is illegal,\
    \ because the argument 'abc' has the wrong static type.\n\n# 7.4 Type annotations\n\
    \n```\nfunction toString(num: number): string {\n  return String(num);\n}\n```\n\
    \nThere are two type annotations in the previous function declaration:\n\n+  \
    \ - Parameter num: colon followed by number\n- Result of toString(): colon followed\
    \ by string\n\nBoth number and string are type expressions that specify the types\
    \ of storage locations."
  - "[PAGE 35]\n\n# 7.5 Type inference\n\nOften, TypeScript can infer a static type\
    \ if there is no type annotation. For example, if we omit the return type of f(),\
    \ TypeScript infers that it is a string:\n\n```\n// inferred-type: (num: number)\
    \ => string\nfunction toString(num: number) {\n  return String(num);\n}\n```\n\
    \nType inference is not guesswork: It follows clear rules (similar to arithmetic)\
    \ for deriving types where they haven't been specified explicitly. In this case,\
    \ the return statement applies a function String() that maps arbitrary values\
    \ to strings, to a value of type number and returns the result. That's why the\
    \ inferred return type is string.\n\nIf the type of a location is neither specified\
    \ nor inferable, TypeScript uses the any type for it. This is the type of all\
    \ values and a wildcard, in that we can do everything if it has a value type.\n\
    \nWith --strict, any is only allowed if we use it explicitly. In other words:\
    \ Every location must have an explicit or inferred static type. In the following\
    \ example, parameter num has neither and we get a compile-error:\n\n```\n// @ts-expect-error:\
    \ Parameter 'num' implicitly has an 'any' type. (7006)\nfunction toString(num)\
    \ {\n  return String(num);\n}\n```\n\n# 7.6 Specifying types via type expressions\n\
    \nThe type expressions after the colons of type annotations range from simple\
    \ to complex and are created as follows.\n\nBasic types are valid type expressions:\n\
    \n+   - Static types for JavaScript's dynamic types:\n  - undefined, null\n  -\
    \ boolean, number, bigint, string\n  - symbol\n  - object.\n- TypeScript-specific\
    \ types:\n  - Array (not technically a type in JavaScript)\n  - any (the type\
    \ of all values)\n  - Etc.\n\nThere are many ways of combining basic types to\
