    a\"] | [\"d\"] | [{ a: 1 } & { b: 2 }]\ntype Result = AlwaysWrap<'a' | { a: 1\
    \ } & { b: 2 } | 'd'>;\n```\n\n```typescript\n// %inferred-type: \"a\" | \"b\"\
    \ntype Result = 'a' | 'b' | never;\n```\n\n```typescript\ntype DropNumbers<T>\
    \ = T extends number ? never : T;\n\n// %inferred-type: \"a\" | \"b\"\ntype Result1\
    \ = DropNumbers<1 | 'a' | 2 | 'b'>;\n```\n\n```typescript\ntype KeepNumbers<T>\
    \ = T extends number ? T : never;\n\n// %inferred-type: 1 | 2\ntype Result2 =\
    \ KeepNumbers<1 | 'a' | 2 | 'b'>;\n```\n\n```typescript\n/** Exclude from T those\
