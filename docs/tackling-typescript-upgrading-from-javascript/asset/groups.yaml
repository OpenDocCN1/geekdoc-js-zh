    # 1.1 Where is the homepage of this book?


    The homepage of “Tackling TypeScript” is github.com/tackling-ts


    # 1.2 What is in this book?


    This book consists of two parts:


    - Part 1 is a quick start for TypeScript that teaches you the essentials.

    - Part 2 digs into the language and covers important topics.


    # 1.3 What do I get for my money?


    If you buy this book, you get:


    - PDF file

    - HTML version

    - EPUB file

    - MOBI file


    # 1.4 How can I preview the content?


    On the homepage of this book, there are versions.


    # 1.5 How do I report errors?


    If you find an error, you can report it.


    # 1.6 What do the notes with icons mean?


    The following icons are used throughout the book:


    - **Tip**: A helpful tip.

    - **Warning**: A warning about a potential pitfall.

    - **Details**: A question-related detail.

    - **Example**: An example.

    - **Question**: A question.

    - **Note**: An additional note.


    # 1.7 Acknowledgements


    People who contributed to this book are acknowledged in the chapters.


