- md: "\n# 13.7 Enums at compile time\n\n```typescript\ncase \"No\" /* No * */\n \
    \ return 'Nein';\ncase \"Yes\" /* Yes * */\n  return 'Ja';\n```\n\n## 13.7.1 Enums\
    \ are objects\n\nTypeScript treats (non-const) as if they were objects:\n\n```typescript\n\
    enum NoYes {\n  No = 'No',\n  Yes = 'Yes',\n}\nfunction func(obj: { No: string\
    \ }) {\n  return obj.No;\n}\nassert.equal(\n  func(NoYes), // allowed statically!\n\
    \  'No');\n```\n\n## 13.7.2 Safety checks for literal enums\n\nWhen accept an\
    \ enum member value, we often want to make sure that:\n\n- We don't receive illegal\
    \ values.\n- We don't forget to consider any enum member values. This is especially\
    \ relevant if we add members later.\n\nRead on for more information. We will be\
    \ working with the following enum:\n\n```typescript\nenum NoYes {\n  No = 'No',\n\
    \  Yes = 'Yes',\n}\n```\n\n### 13.7.2.1 Protecting against illegal values\n\n\
    In the following code, we take two measures against illegal values:\n\n```typescript\n\
    function toGerman(value: NoYes) {\n  switch (value) {\n    case NoYes.No:\n  \
    \    return 'Nein';\n    case NoYes.Yes:\n      return 'Ja';\n    default:\n \
    \     throw new TypeError('Unsupported value: ' + JSON.stringify(value));\n  }\n\
    }\n\nassert.throws(\n  // @ts-expect-error: Argument of type 'Maybe' is not assignable\
    \ to\n  // parameter of type 'NoYes'\n  () => toGerman('Maybe'),\n  // TypeError:\
    \ Unsupported value: \"Maybe\"\n);\n);\n```\n\nThe measures are:\n\n- At compile\
    \ time, the NoYes prevents illegal values being passed to the parameter.\n- At\
    \ runtime, the default case is used to throw an exception if there is an unexpected\
    \ value.\n\n### 13.7.2.2 Protecting against forgotten cases via exhaustiveness\
    \ checks\n\nWe can take one more. The following code performs an exhaustiveness\
    \ check: TypeScript will warn us if we forget to consider all members.\n\n```typescript\n\
    class UnsupportedValueError extends Error {\n  constructor(value: never) {\n \
    \   super('Unsupported value: ' + value);\n  }\n}\n```\n\n```typescript\nfunction\
    \ toGerman2(value: NoYes) {\n  switch (value) {\n    case NoYes.No:\n      return\
    \ 'Nein';\n    case NoYes.Yes:\n      return 'Ja';\n    default:\n      throw\
    \ new UnsupportedValueError(value);\n  }\n}\n```\n\nHow does the exhaustiveness\
    \ check work? For every case, TypeScript infers the type of value:\n\n```typescript\n\
