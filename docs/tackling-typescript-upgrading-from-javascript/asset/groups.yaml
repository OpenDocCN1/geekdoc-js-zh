    JSON.parse(text: string): any;\n```\n\nJSON.parse() was added to TypeScript before\
    \ the type unknown existed. Otherwise, the return type would probably be unknown.\n\
    \n# 12.2.2 Example: String()\n\nThe function String(), which converts arbitrary\
