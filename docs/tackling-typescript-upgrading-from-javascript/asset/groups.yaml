    \ (IDE) 编写 TypeScript\n\n两种流行的 IDE 有：\n\n- VS Code（免费）\n- WebStorm（需购买）\n\n本节的观察是关于\
    \ VS Code，但可能适用于其他 IDE。\n\n需要注意的一个重要事实是 VS Code 通过两种独立的方式处理 TypeScript 源：\n\n\
    - 检查文件错误：这是通过所谓的语言服务器实现的。语言服务器独立于特定的编辑器，并为编辑器提供相关服务：重构、补全等。与服务器的通信基于 JSON-RPC。需要记住的重要事实：语言服务器只分析\
    \ TypeScript，不编译。\n\n4.3 TypeScript 编译器产生的其他文件\n\n- 构建（将 TypeScript 文件编译为 JavaScript\
    \ 文件）：在这里有两种选择。\n  - 我们可以通过外部命令行运行构建工具。例如，TypeScript 编译器 tsc 有一个监听模式，可以监听输入文件并编译为输出文件。结果是，每我们在\
    \ IDE 中保存 TypeScript 文件时，都会立即获得相应的输出。\n  - 我们可以在 VS Code 内部运行 tsc。为了做到这一点，它必须安装在我们正在的项目内部或全局（通过\
    \ npm 管理）。有关在 VS Code 内部编译 TypeScript 的更多信息，请参阅该 IDE 的官方文档。\n\n给定一个 TypeScript\
    \ 文件 main.ts，TypeScript 编译器可以产生几种产物。最常见的有：\n\n- JavaScript 文件：main.js\n- 声明文件：main.d.ts（包含类型信息；去掉\
    \ JavaScript 代码）\n- 源映射文件：main.js.map\n\n源映射指定了 main.js 输出代码中的每个部分是由输入代码 main.ts\
    \ 的哪个部分生成的。此外，这些信息允许运行时环境执行 JavaScript 代码，同时在错误消息中显示 TypeScript 代码的行号。\n\n"
