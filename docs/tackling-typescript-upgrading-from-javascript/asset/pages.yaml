    \ is written:\n\n+   - In an object-oriented programming (OOP) style with classes\
    \ and OOP patterns\n- In a functional programming (FP) style with functional patterns\n\
    - In a mix of OOP and FP\n- And so on\n\n# 2.3.2 TypeScript is an attempt to replace\
    \ JavaScript with C# or Java\n\nInitially, TypeScript invented a few language\
    \ constructs of its own (e.g. enums). But since ECMAScript 6, it mostly stuck\
    \ with being a strict superset of JavaScript.\n\nMy impression is that the TypeScript\
    \ team likes JavaScript and doesn't want to replace it with something “better”\
    \ (which is the goal of, e.g., Dart). They do want to make possible to statically\
    \ type as much JavaScript code as possible. Many new TypeScript features are driven\
