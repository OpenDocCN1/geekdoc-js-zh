    ```


    ```

    const objWithArrowFunction: HasMethodDef = {

    simpleMethod: (flag: boolean) => {},

    };\const objWithArrowFunction2: HasFuncProp = objWithArrowFunction;

    ```


    My recommendation is to use whichever syntax expresses how a property should be
    set up.


    # 7.14 Type variables and generic types


    Recall the two language levels of TypeScript:


    +   * Values exist at the dynamic level.

    * Types exist at the static level.


    Similarly:


    +   * Normal functions exist at the dynamic level, are factories for values and
    have parameters representing values. Parameters are declared between parentheses:

    const valueFactory = (x: number) => x; // definition

    const value = valueFactory(123); // use

    * Generic types exist at the static level, are factories for types and have parameters
    representing types. Parameters are declared between angle brackets:'
