  md: "# 17 Class definitions in TypeScript\n\n// No constructor needed\n\nHowever,\
    \ sometimes we initialize properties in a manner that TypeScript doesn't recognize.\
    \ Then we can use exclamation marks (definite assignment assertions) to switch\
    \ off TypeScript's warnings (line A and line B):\n\n```\nclass Point {\n  x!:\
    \ number; // (A)\n  y!: number; // (B)\n  constructor() {\n    this.initProperties();\n\
    \  }\n  initProperties() {\n    this.x = 0;\n    this.y = 0;\n  }\n}\n```\n\n\
    # 17.4.1.1 Example: setting instance properties via objects\n\nIn the following\
    \ example, we also need define assignment assertions. Here, we set up instance\
    \ properties via the constructor parameter props:\n\n```\nclass CompilerError\
    \ implements CompilerErrorProps { // (A)\n  line!: number;\n  description!: string;\n\
    \  constructor(props: CompilerErrorProps) {\n    Object.assign(this, props); //\
    \ (B)\n  }\n}\n```\n\n```\n// Helper interface for the parameter properties\n\
    interface CompilerErrorProps {\n  line: number,\n  description: string;\n}\n```\n\
    \n// Using the class:\n\n```\nconst err = new CompilerError({\n  line: 123,\n\
    \  description: 'Unexpected token',\n});\n```\n\nNotes:\n\n+   - In line B, we\
    \ initialize all properties: We use Object.assign() to copy the properties of\
    \ parameter props into this.\n- In line A, the implements ensures that the class\
    \ declares all properties that are part of interface CompilerErrorProps."
