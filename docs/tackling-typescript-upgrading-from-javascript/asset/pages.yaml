    This chapter gives an overview of strategies for migrating code bases from JavaScript
    to TypeScript. It also mentions material for further reading.


    # ## 10.1 Three strategies


    These are three strategies for migrating to TypeScript:


    +   * We can support a mix of JavaScript and TypeScript files for our code base.
    We start with only JavaScript files and then switch more and more to TypeScript.

    * We can keep our current (non-TypeScript) build process and our JavaScript-only
    code base. We add static type information via JSDoc comments and use TypeScript
    as a type checker (not a compiler). Everything is correctly typed, we switch to
    TypeScript for building.

    * For large projects, there may be too many TypeScript errors during migration.
    Snapshot tests can help us find fixed errors and new errors.


    More information:


    +   * “Migrating from JavaScript” in the TypeScript Handbook'
