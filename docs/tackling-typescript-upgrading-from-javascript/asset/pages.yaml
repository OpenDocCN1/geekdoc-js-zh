    \ (demonstrated later in this chapter)\n    - github.com/peloton/runtypes\n  \
    \  - github.com/gcanti/io-ts\n- Approach: Invoking builder methods and only producing\
    \ validation functions. Libraries taking this approach often focuses on making\
    \ validation as versatile as possible:\n    - github.com/sindreshus/ow\n    -\
    \ github.com/hapijs/joi\n    - github.com/jquery/upy\n- Approach: Compiling TypeScript\
