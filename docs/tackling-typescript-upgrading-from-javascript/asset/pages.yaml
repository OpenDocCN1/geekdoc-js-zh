  md: "# 23.2 Narrowing via built-in type guards\n\nAn if statement and equality checks\
    \ work similarly to a switch statement:\n\n```\nfunction getID(attendee: Attendee)\
    \ {\n  if (attendee.kind === 'Teacher') {\n    // inferred-type: { kind: \"Teacher\"\
    ; teacherID: string; }\n    attendee;\n    return attendee.teacherID;\n  } else\
    \ if (attendee.kind === 'Student') {\n    // inferred-type: { kind: \"Student\"\
    ; studentID: string; }\n    attendee;\n    return attendee.studentID;\n  } else\
    \ {\n    throw new Error();\n  }\n}\n```\n\n# 23.2.5 Narrowing dotted names\n\n\
    We can also narrow the types of properties (even of nested ones that) we access\
    \ via chains of property names:\n\n```\ntype MyType = {\n  prop?: number | string;\n\
    };\nfunction func(arg: MyType) {\n  if (typeof arg.prop === 'string') {\n    //\
    \ inferred-type: string\n    arg.prop; // (A)\n  }\n\n  ].forEach((x) => {\n \
    \   // inferred-type: string | number | undefined\n    arg.prop; // (B)\n  });\n\
    \n  // inferred-type: string\n  arg.prop;\n\n  arg = {};\n\n  // inferred-type:\
    \ string | number | undefined\n  arg.prop; // (C)\n}\n```\n\nLet's look at a few\
    \ locations in the previous code:\n\n+   - Line A: We narrowed the type of arg.prop\
    \ via a type guard.\n- Line B: Callbacks may be executed much later (think of\
    \ asynchronous code), which is why TypeScript undoes narrowing inside callbacks.\n\
    - Line C: The preceding assignment also undid narrowing."
