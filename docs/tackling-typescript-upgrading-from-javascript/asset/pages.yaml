    const message = messages[3]; // (A)

    ```


    Due to this assumption, the type of message is string. And not undefined or undefined]string,
    as we may have expected.


    We get an error if we use a tuple type:


    ```

    const messages: string = [''Hello''];

    ```


    ```

    // @ts-expect-error: Tuple type ''string'' of length ''1'' has no element

    // at index 1. (2493)

    const message = messages[1];

    ```


    as const would have had the same effect because it leads to a tuple type being
