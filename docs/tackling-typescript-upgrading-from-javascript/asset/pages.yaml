    \ the schema(structure and content, think static type) of JSON data in JSON. That\
    \ is, metadata is expressed in the same format as data.\n\nThe use cases for JSON\
    \ schema:\n\n+   - Validating JSON data: If we have a schema definition for data,\
    \ we can use tools to check that the data is correct. One issue with data can\
    \ also be fixed automatically: We specify default values that can be used to add\
    \ properties that are missing.\n- Documenting JSON data formats: On one hand,\
    \ the core schema definitions can be considered documentation. But JSON schema\
    \ additionally supports descriptions, deprecation notes, comments, and more. These\
    \ mechanisms are called annotations. They are not used for validation, but for\
    \ documentation.\n- IDE support for editing data: For example, Visual Studio supports\
    \ JSON schema. If there is a schema for a JSON file, we gain several editing features:\
    \ auto-completion, highlighting of errors, etc. Notably, VS Code's support for\
