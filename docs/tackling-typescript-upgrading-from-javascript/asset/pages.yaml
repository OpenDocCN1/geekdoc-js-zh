    \ the descriptions in English them, too.\n\nIf we use TypeScript's notation to\
    \ document types, we get the added benefit of this information being checked for\
    \ consistency:\n\n```\nfunction toString(num: number): string {\n  return String(num);\n\
    }\n```\n\n# 2.1.3 TypeScript provides an additional layer of documentation\n\n\
    Whenever I migrate JavaScript code to TypeScript, I'm noticing an interesting\
    \ phenomenon: In order to find the appropriate types for parameters for a function\
    \ or method, I have to check where it is invoked. That means static types give\
    \ me information locally that I otherwise have to look up elsewhere.\n\nAnd I\
    \ do not find it easier to understand TypeScript code bases: TypeScript provides\
    \ an additional layer of documentation.\n\nThis additional documentation also\
