    # 20.3.3 Type inference for empty Array literals


    If we initialize with an empty Array literal, TypeScript initially infers the
    type any[] and incrementally updates that type as we make changes:


    ```

    // %inferred-type: any[]

    const arr1 = [];

    ```


    ```

    arr1.push(123);

    // %inferred-type: number[]

    arr1;

    ```


    ```

    arr1.push(''abc'');

    // %inferred-type: (string | number[])

    arr1;

    ```


    Note that the initial inferred type isn''t influenced by what happens later.


    If we use assignment instead of .push(), this works the same:


    ```

    // %inferred-type: any[]

