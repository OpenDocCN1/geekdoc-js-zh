  md: "# 23.3 User-defined type guards\n\nTypeScript lets us define our own type guards\
    \ – for example:\n\n```\nfunction isFunction(value: unknown): value is Function\
    \ {\n  return typeof value === 'function';\n}\n```\n\nThe return value of Function\
    \ is a type predicate. It is part of the type signature of isFunction():\n\n```\n\
    // inferred-type: (value: unknown) => value is Function\nisFunction();\n```\n\n\
    A user-defined type guard must always return booleans. If isFunction(x) returns\
    \ true, TypeScript narrows the type of the actual argument x to Function:\n\n\
    ```\nfunction func(arg: unknown) {\n  if (isFunction(arg)) {\n    // inferred-type:\
    \ Function\n    arg; // type is narrowed\n  }\n}\n```\n\nNote that TypeScript\
    \ doesn't know how we compute the result of a user-defined guard. It gives us\
    \ a lot of freedom w.t. the checks we use. For example, we could implement isFunction()\
    \ as follows:\n\n```\nfunction isFunction(value: any): value is Function {\n \
    \ try {\n    value(); // (A)\n    return true;\n  } catch {\n    return false;\n\
    \  }\n}\n```\n\nAs, we have to use any for the parameter value because the type\
    \ unknown does not let us make the function call in line A.\n\n# 23.3.1 Example\
    \ of a user-defined type guard: isArrayWithInstanceof()\n\n+   * This type guard\
    \ for Arrays works similarly to 'Array.isArray()\n* but also checks if all Array\
    \ elements are instances of 'T'.\n* As a consequence, the type of 'arr' is narrowed\
    \ to 'Array<T>'\n* if this function returns 'true'.\n* Warning: This type guard\
    \ can make code unsafe – for example:\n* We could use another reference to 'arr'\
    \ to add an element whose\n* type is not 'T'. Then 'arr' doesn't have the type\
    \ 'Array<T>'"
