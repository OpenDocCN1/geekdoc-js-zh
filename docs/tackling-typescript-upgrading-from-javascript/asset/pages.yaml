  md: "# 13.2 Specifying enum member values (advanced)\n\n+   - A literal enum member:\n\
    \  - either has no initializer or a literal\n  - or is initialized via a number\
    \ literal or a string literal\n- A constant enum member is initialized via an\
    \ expression whose result is computed at compile time.\n- A computed enum member\
    \ is initialized via an arbitrary expression.\n\nSo far, we have used only literal\
    \ members.\n\nIn the previous lists, members that are mentioned earlier are less\
    \ flexible but support more features. Read on for more information.\n\n# 13.2.1\
    \ Literal enum members\n\nAn enum member is literal if its value is specified:\n\
    \n+   - either implicitly\n- via a number literal (incl. negated number literals)\n\
    - via a string literal.\n\nIf we have only literal members, we can use these members\
    \ as types (similar to how, e.g., number literals can be used as types):\n\n```\n\
    enum NoYes {\n  No = 'No',\n  Yes = 'Yes',\n}\nfunction func(x: NoYes.No) { //\
    \ (A)\n  return x;\n}\n```\n\n```\nfunc(NoYes.No); // OK\n```\n\n```\n// ts-expect-error:\
    \ Argument of type 'No' is not assignable to\n// parameter of type 'NoYes.No'.\n\
    func('No');\n```\n\n```\n// ts-expect-error: Argument of type 'NoYes.Yes' is not\
    \ assignable to\n// parameter of type 'NoYes.No'.\nfunc(NoYes.Yes);\n```\n\nNoYes.No\
    \ in line A is an enum member type.\nAdditionally, literal enums support exhaustiveness\
    \ checks (which we'll look at later).\n\n# 13.2.2 Constant enum members\n\nAn\
    \ enum member is constant if its value can be computed at compile time. Therefore,\
    \ we can either specify its value implicitly (that is, we let TypeScript specify\
    \ it for us). Or we can specify it explicitly and are only allowed to use the\
    \ following syntax:"
