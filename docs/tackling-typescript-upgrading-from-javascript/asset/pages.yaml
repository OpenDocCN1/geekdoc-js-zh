  md: "# 13.7 Enums at compile time\n\n```\ndefault:\n  // %inferred-type: never\n\
    \  value;\n  throw new UnsupportedValueError(value);\n```\n\nIn the default case,\
    \ TypeScript infers the type never for value because we never get there. If we\
    \ add a member .Maybe to NoYes, then the inferred type of value is NoYes.Maybe\
    \ and that is statically incompatible with the type never of the parameter of\
    \ new UnsupportedValueError(). That's why we get the following error message at\
    \ compile time:\n\nArgument of type 'NoYes.Maybe' is not assignable to parameter\
    \ of type 'never'.\n\nConvenient, this kind of exhaustiveness check also works\
    \ with if statements:\n\n```\nfunction toGerman3(value: NoYes) {\n  if (value\
    \ === NoYes.No) {\n    return 'Nein';\n  } else if (value === NoYes.Yes) {\n \
    \   return 'Ja';\n  } else {\n    throw new UnsupportedValueError(value);\n  }\n\
    ```\n\n# 13.7.2.3 An alternative way of checking exhaustiveness\n\nAlternatively,\
    \ we can get an exhaustiveness check if we specify a return type:\n\n```\nfunction\
    \ toGerman4(value: NoYes): string {\n  switch (value) {\n    case NoYes.No:\n\
    \      const x: NoYes.No = value;\n      return 'Nein';\n    case NoYes.Yes:\n\
    \      const y: NoYes.Yes = value;\n      return 'Ja';\n  }\n```\n\nIf we add\
    \ a member to NoYes, then TypeScript complains that toGerman4() may return undefined.\n\
    \n# Downsides of this approach:\n\n+   * This approach does not work with if statements\
    \ (more information).\n* No checks are performed at runtime."
