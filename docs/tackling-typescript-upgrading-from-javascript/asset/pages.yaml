    \ path = require('path');\nconst CopyWebpackPluginPlugin = require('copy-webpack-plugin');\n\
    \nmodule.exports = {\n  entry: {\n    main: \"./ts/src/main.ts\",\n  },\n  output:\
    \ {\n    path: path.resolve(__dirname, 'build'),\n    filename: \"[name]-bundle.js\"\
    ,\n  },\n  resolve: {\n    // Add .ts and .tsx as resolvable extensions.\n   \
    \ extensions: [ \".ts\", \".tsx\", \".js\"],\n  },\n  module: [{\n    // all files\
    \ with a .ts or .tsx extension will be handled by `ts-loader`\n    test:\\.tsx?$/,\
    \ loader: \"ts-loader\"\n  ],\n  plugins: [\n    new CopyWebpackPluginPlugin([\n\
    \      {\n        from: './html',\n      })\n    ])\n};\n```\n\nProperties:\n\n\
    +   - An An entry point is the file where webpack starts collecting the data for\
    \ an output bundle. First it adds the entry point file to the bundle, then the\
    \ imports of the entry point, then the imports of imports, etc. The value of property\
    \ entry is an object whose property keys specify names of entry points and whose\
    \ values paths of entry points.\n- output specifies the path of the output bundle.\
    \ [name] is mainly useful when there are multiple entry points (and therefore\
    \ multiple bundles). It is replaced with the name of the entry point when assembling\
    \ the path.\n- resolve configures how webpack converts specifiers (IDs) of modules\
    \ to locations of files.\n- module configures loaders (plugins that process files)\
    \ and more."
