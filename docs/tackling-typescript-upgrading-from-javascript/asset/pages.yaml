    arr1[1] = ''abc'';

    // %inferred-type: (string | number[])

    arr1;

    ```


    In contrast, if the Array literal has at least one element, then the element type
    is fixed and doesn''t change later:


    ```

    // %inferred-type: number[]

    const arr = [123];

    ```


    ```

