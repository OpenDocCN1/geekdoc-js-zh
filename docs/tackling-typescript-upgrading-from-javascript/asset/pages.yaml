    \ limited.\n\n# 16.4.7.3 Empty interfaces allow excess properties\n\nIf an interface\
    \ is empty (or the object literal is used), excess properties are always allowed:\n\
    \n```\ninterface Empty {}\ninterface OneProp {\n  myProp: number;\n}\n```\n\n\
