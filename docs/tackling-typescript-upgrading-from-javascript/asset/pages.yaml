    # 16.3.3 object (lowercase "o") in TypeScript: non-primitive values


    In TypeScript, object is the type of all non-primitive values (primitive values
    are undefined, null, booleans, bigints, strings). With this type, we can''t access
    any properties of a value.


    # 16.3.4 Object vs. object: primitive values


    Interestingly, type Object matches primitive values:


    ```

    function func1(x: Object) {

    func1(''abc''); // OK

    ```


    Why is that? Primitive values have all the properties required by Object because
    they inherit Object.prototype.


    > > ''abc''.hasOwnProperty === Object.prototype.hasOwnProperty

    true


    Conversely, object does not match primitive values:


    ```

    function func2(x: object) {

    // @ts-expect-error: Argument of type "abc" is not assignable to

    // parameter of type ''object''. (2345)

    func2(''abc'');

    ```


