  md: "# 13 TypeScript units: How do they work? What can they be used for?\n\n+  \
    \ 13.7 Enums at compile time . . . . . . . . . . . . . . . . . . 91\n13.7.1 Enums\
    \ are objects . . . . . . . . . . . . . . . . . . . . . 91\n13.7.2 Safety checks\
    \ for literal enums . . . . . . . . . . . . . . . . . . 91\n13.7.3 keyof and enums\
    \ . . . . . . . . . . . . . . . . . . . . . 94\n13.8 Acknowledgment . . . . .\
    \ . . . . . . . . . . . . . . . . . . . . . 94\n\nThis chapter answers the following\
    \ questions:\n\n+   - How do TypeScript's enums work?\n- What can they be used\
    \ for?\n\nIn the next chapter, we take a look at alternatives to enums.\n\n# 13.1\
    \ The basics\n\nboolean is a type with a finite amount of values: false and true.\
    \ With enums, TypeScript lets us define similar types ourselves.\n\n# 13.1.1 Numeric\
    \ enums\n\nThis is a numeric NoYes\n\n```\nenum NoYes {\nNo = 0,\nYes = 1, //\
    \ trailing comma\n}\n```\n\n```\nassert.equal(NoYes.No, 0);\nassert.equal(NoYes.Yes,\
    \ 1);\n```\n\nExplanations:\n\n+   - The entries NoYes and Yes are called the\
    \ members of the enum NoYes.\n- Each enum member has a name and a value. For example,\
    \ the first member has the name No and the value 0.\n- The part of a member definition\
    \ starts with an equals sign and specifies a value is called an initializer.\n\
    - As object literals, trailing commas are allowed and ignored.\n\nWe can use members\
    \ as if they were literals, true 123, or 'abc' – for example:\n\n```\nfunction\
    \ toGerman(value: NoYes) {\nswitch (value) {\ncase NoYes.No:\n  return 'Nein';\n\
    case NoYes.Yes:\n  return 'Ja';\n}\n}\n```\n\n```\nassert.equal(toGerman(NoYes.No,\
    \ 'Nein');\nassert.equal(toGerman(NoYes.Yes, 'Ja');\n```"
