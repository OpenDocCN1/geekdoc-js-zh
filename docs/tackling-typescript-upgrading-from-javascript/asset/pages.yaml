  md: "# 13.1 The basics\n\n# 13.1.2 String-based enums\n\nInstead of numbers, we\
    \ can also use strings as enum member values:\n\n```\nenum NoYes {\n    No = 'No',\n\
    \    Yes = 'Yes',\n}\n\nassert.equal(NoYes.No, 'No');\nassert.equal(NoYes.Yes,\
    \ 'Yes');\n```\n\n# 13.1.3 Heterogeneous enums\n\nThe last kind of enums is called\
    \ heterogeneous. The member values of a heterogeneous enum are a mix of numbers\
    \ and strings:\n\n```\nenum Enum {\n    One = 'One',\n    Two = 'Two',\n    Three\
    \ = 3,\n    Four = 4,\n}\nassert.deepEqual(\n    [Enum.One, Enum.Two, Enum.Three,\
    \ Enum.Four],\n    ['One', 'Two', 3, 4]\n);\n```\n\nHeterogeneous enums are not\
    \ often used because they have few applications.\nAlas, TypeScript only supports\
    \ numbers and strings as enum member values. Other values, such as symbols, are\
    \ not allowed.\n\n# 13.1.4 Omitting initializers\n\nWe can omit initializers in\
    \ two cases:\n\n+   - We can omit the initializer of the first member. Then that\
    \ member has the value 0 (zero).\n- We can omit the initializer of a member if\
    \ the previous member has a number value. Then the current member has that value\
    \ plus one.\n\nThis is a numeric enum without any initializers:\n\n```\nenum NoYes\
    \ {\n    No,\n    Yes,\n}\nassert.equal(NoYes.No, 0);\nassert.equal(NoYes.Yes,\
    \ 1);\n```\n\nThis is a heterogeneous enum where some initializers are omitted:"
