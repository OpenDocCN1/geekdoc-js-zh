  md: "# 15.2 Adding special values out of band\n\n# 15.1.2 Adding a symbol to a type\n\
    \nWe can also use values other than null sentinels. Symbols and objects are best\
    \ suited for this task because each of them has a unique identity and no other\
    \ value can be mistaken for it.\n\nThis is how to use a symbol to represent EOF:\n\
    \n```\nconst EOF = Symbol('EOF');\ntype StreamValue = typeof EOF | string;\n```\n\
    \nWhy do we need type and can't use EOF directly? That's because EOF is a value,\
    \ not a type. The type operator converts EOF to a type. For more information on\
    \ the different language levels of values and types, see §7.7 \"The language levels:\
    \ dynamic vs. static\".\n\n# 15.2 Adding special values out of band\n\nWhat do\
    \ we do if potentially any value can be returned by a method? How do we ensure\
    \ that base values and meta values don't get mixed up? This is an example where\
    \ that might happen:\n\n```\ninterface InputStream<T> {\n  getNextValue(): T;\n\
    }\n```\n\nWhatever we pick for EOF, there is a risk of someone creating an Input-typeof\
    \ EOF and adding that value to the stream.\n\nThe solution is to keep normal values\
    \ and special values separate, so that they can't be mixed up. Special values\
    \ existing separately is called out of band (think different channel).\n\n# 15.2.1\
    \ Discriminated unions\n\nA discriminated union is a union over several object\
    \ types that have at least one property in common, the so-called discriminant.\
    \ The discriminant must have a different value for each object type – we can think\
    \ of it as the ID of the object type.\n\n# 15.2.1.1 Example: InputStreamValue\n\
    \nIn the following example, InputStreamValue<T> is a discriminated union and its\
    \ discriminant is type.\n\n```\ninterface NormalValue<T> {\n  type: 'normal';\
    \ // string literal type\n  data: T;\n}\ninterface Eof {\n  type: 'eof'; // string\
    \ literal type\n}\n```\n\ntype InputStreamValue<T> = Eof | NormalValue<T>;"
