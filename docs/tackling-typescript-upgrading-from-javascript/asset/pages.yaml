  md: "# 13 TypeScript enums: How do they work? What can they be used for?\n\n+  \
    \ * Number literals or string literals\n* A reference to a previously defined\
    \ constant enum member (in the current enum\nor in a previous enum)\n* The unary\
    \ operators +, -, ~\\n* The binary operators +, -, *, /, %, <<, <<, >>> &, ^\n\
    \nThis is an example of an enum whose members are all constant (we'll see later\
    \ how\nenum is used):\n\n```\nenum Perm {\n  UserRead = 1 << 8, // bit 8\n  UserWrite\
    \ = 1 << 7,\n  UserExecute = 1 << 6,\n  GroupRead = 1 << 5,\n  GroupWrite = 1\
    \ << 4,\n  GroupExecute = 1 << 3,\n  AllRead = 1 << 2,\n  AllWrite = 1 << 1,\n\
    \  AllExecute = 1 << 0\n}\n```\n\nIn general, constant members can't be used as\
    \ types. However, exhaustiveness checks\nare still performed.\n\n# 13.2.3 Computed\
    \ enum members\n\nThe values of computed enum members can be specified via arbitrary\
    \ expressions. For ex-\nample:\n\n```\nenum NoYesNum {\n  No = 123,\n  Yes = Math.random(),\
    \ // OK\n}\n```\n\nThis was a numeric enum. String-based enums and heterogeneous\
    \ enums are more lim-\nited. For example, we cannot use method invocations to\
    \ specify member values:\n\n```\nenum NoYesStr {\n  No = 'No',\n  // @ts-expect-error:\
    \ Computed values are not permitted in\n  // an enum with string valued members.\n\
    \  Yes = ['Y', 'e', 's'].join('')\n}\n```\n\nTypeScript does not do exhaustiveness\
    \ checks for computed enum members."
