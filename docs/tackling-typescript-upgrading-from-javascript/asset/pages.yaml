  md: "# 15.2 Adding special values out of band\n\n# 15.2.2 Other kinds of union types\n\
    \nOther kinds of union types can be as convenient as discriminated unions, as\
    \ long as we have the means to distinguish the member types of the union.\n\n\
    One possibility is to distinguish the member types via unique properties:\n\n\
    ```\ninterface A {\n  one: number;\n  two: number;\n}\ninterface B {\n  three:\
    \ number;\n  four: number;\n}\n```\n\ntype Union = A | B;\n\n```\nfunction func(x:\
    \ Union) {\n  // @ts-expect-error: Property 'two' does not exist on type 'Union'\n\
    \  // Property 'two' does not exist on type 'B'.(2339)\n  console.log(x.two);\
    \ // error\n}\n\nif ('one' in x) { // discriminating check\n  console.log(x.two);\
    \ // OK\n}\n```\n\nAnother possibility is to distinguish the member types via\
    \ and/or instance checks:\n\ntype Union = [string] | number;\n\n```\nfunction\
