    \ The following code provides an example:\n\n```\nfunction parseObject(jsonObjectStr:\
    \ string): Object {\n  // inferred-type: any\n  const parsed = JSON.parse(jsonObjectStr);\n\
    \  return cast(Object, parsed);\n}\n```\n\n# 19.3.3 Example: Maps that are type-safe\
    \ at runtime\n\nOne case for Class<T> and cast() is type-safe Maps:\n\n```\nclass\
    \ TypeSafeMap {\n  #data = new Map<any, any>();\n  get<T>(key: Class<T>) {\n \
    \   const value = this.#data.get(key);\n    return cast(key, value);\n  }\n  set<T>(key:\
    \ Class<T>, value: T): this {\n    cast(key, value); // runtime check\n    this.#data.set(key,\
    \ value);\n    return this;\n  }\n  has(key: any) {\n    return this.#data.has(key);\n\
    \  }\n}\n```\n\nThe key of each in a TypeSafeMap is a class. That determines the\
    \ static type of the entry's value and is also used for checks at runtime.\n\n\
    This is TypeSafeMap in action:\n\n```\nconst map = new TypeSafeMap();\n```\n\n\
    ```\nmap.set(RegExp, /abc/);\n```\n\n```\n// inferred-type: RegExp\nconst re =\
