  md: "# 4.3 Other files produced by the TypeScript compiler\n\n+   * Building (compiling\
    \ TypeScript files to JavaScript files): Here, we have two choices.\n  - We can\
    \ run a build tool via an external command line. For example, the TypeScript compiler\
    \ tsc has a --watch mode that watches input files and compiles them to output\
    \ files whenever they change. As a consequence, whenever we save a TypeScript\
    \ file in the IDE, we immediately get the corresponding output(s).\n  - We can\
    \ run tsc from within Visual Studio Code. In order to do so, it must be installed\
    \ inside every project that we are currently working on or globally (via the npm\
    \ package manager npm). With building, we get a complete list of errors. For more\
    \ information on compiling TypeScript from within Visual Studio Code, see the\
    \ official documentation for that IDE.\n\n# 4.3 Other files produced by the TypeScript\
    \ compiler\n\nGiven a TypeScript file main.ts, the TypeScript compiler can produce\
    \ several kinds of artifacts. The most common ones are:\n\n+   * JavaScript file:\
    \ main.js\n* Declaration file: main.d.ts (contains type information; .ts files\
    \ minus the JavaScript code)\n* Source map file: main.js.map\n\nTypeScript is\
    \ not delivered via .ts files, but via .js files and .ts files:\n\n+   * The JavaScript\
    \ code contains all actual functionality and can be consumed by plain JavaScript.\n\
    * The declaration files help programming editors with auto-completion and similar\
    \ services. This information enables plain JavaScript to be consumed by TypeScript.\
    \ However, we profit from it when we work with plain JavaScript because it gives\
    \ us better auto-completion and more.\n\nA source map specifies for each part\
    \ of the output code in main.js, which part of the input code main.ts produced\
    \ it. Other things, this information enables runtime environments to execute JavaScript\
    \ code, while showing the line numbers of the TypeScript code in error messages.\n\
    \n# 4.3.1 In order to use npm packages from TypeScript, we need type-information\n\
    \nThe npm registry is a huge repository of JavaScript code. If we want to use\
    \ a JavaScript package from TypeScript, we need type information for:\n\n+   *\
    \ The package itself may include .d.ts files or even the complete TypeScript code.\n\
    * If it doesn't, we may still be able to use it: DefinitelyTyped is a repository\
    \ of declaration files that people have written for plain JavaScript packages.\n\
    \nThe declaration files of DefinitelyTyped reside in the @types namespace. Therefore,\
    \ we need a declaration file for a package such as lodash, we have to has install\
    \ the package @types/lodash."
