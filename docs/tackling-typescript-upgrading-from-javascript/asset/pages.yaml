    # 13.4.1 Use case: file system module\n\nIn the Node.js file system module, several\
    \ functions have the parameter mode. It specifies file permissions, by a numeric\
    \ encoding that is a holdover from Unix:\n\n+   - Permissions are permitted for\
    \ three categories of users:\n- User: the owner of the file\n- Group: the members\
    \ of the group associated with the file\n- All: everyone\n\n+   - Per category,\
    \ the following permissions can be granted:\n- r (read): the users in the category\
    \ are allowed to read the file\n- w (write): the users in the category are allowed\
    \ to change the file\n- x (execute): the users in the category are allowed to\
    \ run the file\n\nThat means permissions can be represented by 9 bits (3 categories\
    \ with 3 permissions each):\",\n\n| User Group All |\n| Permissions r, w, x |\
    \ r, w, x | r, w, x |\n| Bit 8, 7, 6 | 5, 4, 3 | 2, 1, 0 |\n\nNode.js doesn't\
    \ do this, but we can use an enum to work with these flags:\n\n```\nenum Perm\
    \ {\n  UserRead = 1 << 8, // bit 8\n  UserWrite = 1 << 7,\n  UserExecute = 1 <<\
    \ 6,\n  GroupRead = 1 << 5,\n  GroupWrite = 1 << 4,\n  GroupExecute = 1 << 3,\n\
    \  AllRead = 1 << 2,\n  AllWrite = 1 << 1,\n  AllExecute = 1 << 0,\n}\n```"
