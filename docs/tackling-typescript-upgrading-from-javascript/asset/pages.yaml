    \ === 123) { // equality\n  // .inferred-type: 123\n  value;\n\n  value * 5; //\
    \ OK\n}\n```\n\n+   Type guards:\n```typescript\nfunction func(value: unknown)\
    \ {\n  // @ts-expect-error: Object is of type 'unknown'\n  value.length;\n\nif\
