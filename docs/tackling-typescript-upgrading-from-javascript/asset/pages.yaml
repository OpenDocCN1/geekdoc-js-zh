  md: "# 23.1.4 The type unknown\n\nIf a value has the type unknown, we can do almost\
    \ nothing with it and have to narrow the type first (Line A):\n\n```\nfunction\
    \ parseStringLiter(stringLiteral: string): string {\n  const result: unknown =\
    \ JSON.parse(stringLiteral);\n  if (typeof result == 'string') { // (A)\n    return\
    \ result;\n  }\n  throw new Error('Not a string literal: ' + stringLiteral);\n\
    }\n```\n\nIn other words: The type is too general and we must narrow it. In a\
    \ way, unknown is also a union type (the union of all types).\n\n# 23.2 Narrowing\
    \ via built-in type guards\n\nAs we have, a type guard is an operation that returns\
    \ either true or false -dependent on whether its operand meets certain criteria\
    \ at runtime. TypeScript's type inference supports type guards by narrowing the\
    \ static type of an operand when the result is true.\n\n# 23.2.1 Strict equality\
    \ (===)\n\nStrict equality works as a type guard:\n\n```\nfunction func(value:\
    \ unknown) {\n  if (value === 'abc') {\n    // inferred-type: \"abc\"\n    value;\n\
    \  }\n}\n```\n\nFor some union types, we can use === to differentiate between\
    \ their components:\n\n```\ninterface Book {\n  title: null | string;\n  isbn:\
    \ string;\n}\n```\n\n```\nfunction getTitle(book: Book) {\n  if (book.title ===\
    \ null) {\n    // inferred-type: null\n    book.title;\n    return ('Untitled');\n\
    \  } else {\n    // inferred-type: string\n    book.title;\n    return book.title;\n\
    }\n```"
