  md: '# 9.2 Limitations


    In this chapter, we stick with what is best supported by TypeScript: CommonJS
    modules, bundled as script files.


    # 9.3 The repository ts-demo-webpack


    This is how the repository ts-demo-webpack is structured:


    ```

    ts-demo-webpack/

    build/ (created on demand)

    html/

    index.html

    package.json

    ts/

    src/

    main.ts

    tscfig.json

    webpack.config.js

    ```


    The web app is built as follows:


    +   - Input:

    - The TypeScript files in ts/

    - All JavaScript code that is installed via npm and imported by the TypeScript
    files

    - The HTML files in html/

    - Output - directory build/ with the complete web app:

    - The TypeScript files are compiled to JavaScript code, combined with the npm-installed
    JavaScript and written to the script file build/main-bundle.js. This process is
    called bundling and main-bundle.js is a bundle file.

    - Each HTML file is copied to build/.


    Both output tasks are handled by webpack:


    +   - Copying the files in html/ to build/ is done via the webpack plugin copy-webpack-plugin.


    +   - This chapter explores two different workflows for bundling:

    - Either webpack directly compiles TypeScript files into the bundle, with the
    help of the ts-loader.

    - Or we copy the TypeScript files ourselves, to JavaScript files in the directory
    dist (like we do in the previous chapter). Then webpack doesn''t need a loader
    and only bundles JavaScript files.


    Most of this chapter is about using webpack with ts-loader. At the end, we briefly
    look at the other workflow.'
