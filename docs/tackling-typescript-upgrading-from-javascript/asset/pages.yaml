    \ unknown, we must first narrow their types via:\n\n+   Type assertions:\n```typescript\n\
    function func(value: unknown) {\n  // @ts-expect-error: Object is of type 'unknown'\n\
    \  value.toFixed(2);\n\n  // Type assertion:\n  (value as number).toFixed(2);\
    \ // OK\n}\n```\n\n+   Equality:\n```typescript\nfunction func(value: unknown)\
