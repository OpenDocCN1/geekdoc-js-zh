    \ middle: 'Cecily', last: 'Doe'});\n```\n\n# 16.4.7.2 Why are excess properties\
    \ allowed if an object comes from somewhere else?\n\nThe idea is that if an object\
    \ comes from somewhere else, we can assume that it has already vetted and will\
    \ not have any types. Then we can afford to be less careful.\n\nIf types are not\
    \ an issue, our goal should be maximizing flexibility. Consider the following-ing\
    \ function:\n\n```\ninterface HasYear {\n  year: number;\n}\n```\n\n```\nfunction\
