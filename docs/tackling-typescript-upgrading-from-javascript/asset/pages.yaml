    \ problem in this case is that, without narrowing, we can't access property .second\
    \ of a value whose type is FirstOrSecond.\n\n# 23.2.3.1 The operator in doesn't\
    \ narrow non-union types\n\nAlas, in only helps us with union types:\n\n```\n\
    function func(obj: object) {\n  if ('name' in obj) {\n    // inferred-type: object\n\
    \    obj;\n\n    // //ts-expect-error: Property 'name' does not exist on type\
    \ 'object'\n    obj.name;\n  }\n}\n```\n\n# 23.2.4 Checking the value of a shared\
    \ property (discriminated unions)\n\nIn a discriminated union, the components\
    \ of a union have one or more properties in common whose values are different\
    \ for each component. Such properties are called discriminants.\n\nChecking the\
    \ value of a discriminant is a type guard:\n\n```\ntype Teacher = { kind: 'Teacher',\
    \ teacherID: string };\ntype Student = { kind: 'Student', studentID: string };\n\
    type Attendee = Teacher | Student;\n\nfunction getId(attendee: Attendee) {\n \
    \ switch (attendee.kind) {\n    case 'Teacher':\n      // inferred-type: kind:\
    \ \"Teacher\"; teacherID: string;\n      attendee;\n      return attendee.teacherID;\n\
    \    case 'Student':\n      // inferred-type: kind: \"Student\"; studentID: string;\n\
    \      attendee;\n      return attendee.studentID;\n    default:\n      throw\
    \ new Error();\n  }\n}\n```\n\nIn the previous example, .kind is a discriminant:\
    \ Each components of the union Attendee has this property, with a unique value."
