    Data validation ensures that data we has the desired structure and content.

    With TypeScript, validation becomes relevant when we receive external data such
    as:


    +   - Data parsed from JSON files

    - Data received from web services


    In these cases, we expect the data to fit static types we have, but we can’t be
    sure. Contrast that with data we create ourselves, where TypeScript continuously
    checks that everything is correct.


    This chapter explains how to validate external data in TypeScript.


    # 24.1 JSON schema


    Before we explore approaches for data validation in TypeScript, we need to take
    a look at JSON schema because several of the approaches are based on it.'
