  md: "# 15 Adding special values to types\n\n+   - An additional method .isEof()\
    \ needs to be called before calling .get-NextLine().\n- .getNextLine() throws\
    \ an exception when it reaches an EOF.\n- A sentinel value for EOF.\n\nThe next\
    \ two subsections describe two ways in which we can introduce sentinel values.\n\
    \n# 15.1.1 Adding null or undefined to a type\n\nWhen strict TypeScript, no simple\
    \ object type (defined via interfaces, object patterns, classes) includes null.\
    \ That makes it a good sentinel value that we can add to the base type string\
    \ via a union type:\n\n```\ntype StreamValue = null | string;\n\ninterface InputStream\
    \ {\n  getNextLine(): StreamValue;\n}\n```\n\nNow, when we are using the value\
    \ returned by .getNextLine(), TypeScript forces us to consider these possible\
    \ strategies: strings and null - for example:\n\n```\nfunction countComments(is:\
    \ InputStream) {\n  let commentCount = 0;\n  while (true) {\n    const line =\
    \ is.getNextLine();\n    // @ts-expect-error: Object is possibly 'null'.(2531)\n\
    \    if (line.startsWith('#')) { // (A)\n      commentCount++;\n    }\n    if\
    \ (line === null) break;\n  }\n  return commentCount;\n}\n```\n\nIn line A, we\
    \ can't use the string method .startsWith() because line might be null. We can\
    \ fix this as follows:\n\n```\nfunction countComments(is: InputStream) {\n  let\
    \ commentCount = 0;\n  while (true) {\n    const line = is.getNextLine();\n  \
    \  if (line === null) break;\n    if (line.startsWith('#')) { // (A)\n      commentCount++;\n\
    \    }\n  }\n  return commentCount;\n}\n```\n\nNow, when execution reaches line\
    \ A, we can be sure that line is not null."
