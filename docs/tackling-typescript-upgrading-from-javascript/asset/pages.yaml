    \ statically!\n  'No');\n```\n\n# 13.7.2 Safety checks for literal enums\n\nWhen\
    \ accept an enum member value, we often want to make sure that:\n\n+   - We don't\
    \ receive illegal values.\n- We don't forget to consider any enum member values.\
    \ This is especially relevant if we add members later.\n\nRead on for more information.\
    \ We will be working with the following enum:\n\n```\nenum NoYes {\n  No = 'No',\n\
