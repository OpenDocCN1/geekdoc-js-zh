  md: "# 19.3.4 Pitfall: Class<T> does not match abstract classes\n\nWe cannot use\
    \ abstract classes when Class<T> is expected:\n\n```\nabstract class Shape {\n\
    }\nclass Circle extends Shape {\n  // ...\n}\n\n// //ts-expect-error: Type 'typeof\
    \ Shape' is not assignable to type\n// 'Class<Shape>'.\n// Cannot assign an abstract\
    \ constructor type to a non-abstract\n// constructor type. (2322)\nconst shapeClasses1:\
    \ Array<Class<Shape>> = [Circle, Shape];\n```\n\nWhy is that? The rationale is\
    \ that constructor type literals and construct signatures should only be used\
    \ for values that can actually be new-invoked (GitHub issue with more information).\n\
    \nThis is a workaround:\n\n```\ntype Class2<T> = Function & {prototype: T};\n\n\
    const shapeClasses2: Array<Class2<Shape>> = [Circle, Shape];\n```\n\nDownsides\
    \ of this approach:\n\n+   - Slightly confusing.\n- Values that have this type\
    \ can't be used for instanceof checks (as right-hand-side operands)."
