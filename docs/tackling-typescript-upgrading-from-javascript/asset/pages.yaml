    # 2.1 The benefits of using TypeScript


    # 2.1.1 More errors are detected statically (without running code)


    While you are editing TypeScript code in an integrated development environment,
    you get warnings if you mistype names, call functions incorrectly, etc. Consider
    the following two lines of code:


    ```

    function func() {

    funccc();

    ```


    For the second line, we get this warning:

    Cannot find name ''funccc''. Did you mean ''func''?'
