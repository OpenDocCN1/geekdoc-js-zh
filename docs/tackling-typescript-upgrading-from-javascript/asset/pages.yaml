  md: "# 7.5 Type inference\n\nOften, TypeScript can infer a static type if there\
    \ is no type annotation. For example, if we omit the return type of f(), TypeScript\
    \ infers that it is a string:\n\n```\n// inferred-type: (num: number) => string\n\
    function toString(num: number) {\n  return String(num);\n}\n```\n\nType inference\
    \ is not guesswork: It follows clear rules (similar to arithmetic) for deriving\
    \ types where they haven't been specified explicitly. In this case, the return\
    \ statement applies a function String() that maps arbitrary values to strings,\
    \ to a value of type number and returns the result. That's why the inferred return\
    \ type is string.\n\nIf the type of a location is neither specified nor inferable,\
    \ TypeScript uses the any type for it. This is the type of all values and a wildcard,\
    \ in that we can do everything if it has a value type.\n\nWith --strict, any is\
    \ only allowed if we use it explicitly. In other words: Every location must have\
    \ an explicit or inferred static type. In the following example, parameter num\
    \ has neither and we get a compile-error:\n\n```\n// @ts-expect-error: Parameter\
    \ 'num' implicitly has an 'any' type. (7006)\nfunction toString(num) {\n  return\
    \ String(num);\n}\n```\n\n# 7.6 Specifying types via type expressions\n\nThe type\
    \ expressions after the colons of type annotations range from simple to complex\
    \ and are created as follows.\n\nBasic types are valid type expressions:\n\n+\
    \   - Static types for JavaScript's dynamic types:\n  - undefined, null\n  - boolean,\
    \ number, bigint, string\n  - symbol\n  - object.\n- TypeScript-specific types:\n\
    \  - Array (not technically a type in JavaScript)\n  - any (the type of all values)\n\
    \  - Etc.\n\nThere are many ways of combining basic types to produce new, compound\
    \ types. For example, via type operators that combine types similarly to how the\
    \ set operators union (u) and intersection (n) combine sets. We'll see how to\
    \ do that soon."
