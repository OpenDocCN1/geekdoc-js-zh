    \ code bases\n\nThe TypeScript compiler supports a mix of JavaScript and TypeScript\
    \ files if we use the compiler option - --allowJS:\n\n+   * TypeScript files are\
    \ compiled.\n* JavaScript files are simply copied over to the output directory\
    \ (after a few simple type checks).\n\nAt first, there are only JavaScript files.\
    \ Then, one by one, we switch files to TypeScript. While we do so, our code base\
    \ keeps being compiled.\n\nThis is what tsconfig.json looks like:\n\n```\n{\n\
    \  \"compilerOptions\": {\n    ...\n    \"allowJS\": true\n  }\n}\n```\n\nMore\
    \ information:\n\n+   * “Incrementally Migrating JavaScript to TypeScript” by\
    \ Clay Allsopp.\n\n# 10.3 Strategy: adding type information to plain JavaScript\
    \ files\n\nThis approach works as follows:\n\n+   * We continue using our current\
    \ build infrastructure.\n* We run the TypeScript compiler, but only as a type\
    \ checker (compiler option - --noEmit). In addition to the compiler option - --allowJS\
    \ (for allowing and copying JavaScript files), we also have to use the compiler\
    \ option - --checkJS (for checking JavaScript files).\n* We add type information\
    \ via JSDoc comments (see example below) and declaration files.\n* Once TypeScript's\
    \ type checker doesn't complain anymore, we use the compiler to build the code\
    \ base. Switching from .js files to .ts files is not urgent now because the whole\
