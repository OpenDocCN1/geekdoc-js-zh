    \ \"o\" is the type of all non-primitive values:\n  let obj2: object;\n\nObjects\
    \ can also be typed via their properties:\n\n```\n// Object type literal\nlet\
    \ obj3: (prop: boolean);\n\n// Interface\ninterface ObjectType {\n  prop: boolean;\n\
    }\nlet obj4: ObjectType;\n```\n\nIn the next sections, we'll examine all these\
    \ ways of typing objects in more detail.\n\n# 16.3 Object vs. object in TypeScript\n\
    \n# 16.3.1 Plain JavaScript: objects vs. instances of Object\n\nIn plain JavaScript,\
