    // Same syntax as values, but they are all types


    type Undefined = undefined;

    type NullType = null;


    type BooleanLiterType = true;

    type NumberLiteralType = 12.34;

    type BigIntLiteralType = 1234n;

    type StringLiterType = ''abc'';

    ```


