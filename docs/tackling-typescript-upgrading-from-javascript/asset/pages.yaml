  md: "# 20.3 Pitfall: type inference doesn't always get Array types right\n\n# 20.3.1\
    \ Inferring type of Arrays is difficult\n\nDue to the two roles of Arrays, it\
    \ is impossible for TypeScript to always guess the right type. As an example,\
    \ consider the following Array literal that is assigned to the variable fields:\n\
    \n```\nconst fields: Fields = [\n  ['first', 'string', true],\n  ['last', 'string',\
    \ true],\n  ['age', 'number', false],\n];\n```\n\nWhat is the best type for fields?\
    \ The following are all reasonable choices:\n\n```\ntype Fields = Array<string,\
    \ string, boolean>;\n\ntype Fields = Array<string|'string'|number, boolean>;\n\
    \ntype Fields = ArrayArray<string|boolean>>;\n\ntype Fields = [\n  [string, string,\
    \ boolean],\n  [string, string, boolean],\n  [string, string, boolean],\n];\n\n\
    type Fields = [\n  ['string', boolean],\n  ['string', 'string', boolean],\n  ['string',\
    \ 'number', boolean],\n];\n\ntype Fields = [\n  Array<string|boolean>,\n  Array<string|boolean>,\n\
    \  Array<string|boolean>,\n];\n```\n\n# 20.3.2 Type inference for non-empty Array\
    \ literals\n\nWhen we use non-empty Array literals, TypeScript's default is to\
    \ infer types (not tuple types):\n\n```\n// %inferred-type: (string | number)[]\n\
    const arr = [123, 'abc'];\n```\n\nAs, that's not what we want:\n\n```\nfunction\
    \ func(p: [number, number]) {\n  return p;\n}\n```"
