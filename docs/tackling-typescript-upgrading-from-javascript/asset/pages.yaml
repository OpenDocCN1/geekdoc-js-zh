    \ whose names are not known at development time. All property keys (strings and/or\
    \ symbols) have the same type, as have property values.\n\nFirst and foremost,\
    \ we will explore objects as records. We will briefly encounter objects as dictionaries\
    \ later in this chapter.\n\n# 16.2 Types for objects\n\nThere are two general\
