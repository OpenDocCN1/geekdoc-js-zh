  md: "# 14.2 Discriminated unions\n\n```\noperand1: SyntaxTree;\noperand2: SyntaxTree;\n\
    }\ntype SyntaxTree = NumberValue3 | Addition;\n```\n\nWe have switched from classes\
    \ to interfaces and therefore from instances of classes to plain objects.\n\n\
    The interfaces of a discriminated union must have at least one property in common\
    \ and that property must have a different value for each of them. That property\
    \ is called the discriminant or tag. The discriminant of SyntaxTree3 is .kind.\
    \ Its types are string literal types.\n\nCompare:\n\n+   - The direct class of\
    \ an instance is determined by its prototype.\n- The type of a member of a discriminated\
    \ union is determined by its discriminant.\n\nThis is an object that matches SyntaxTree3\n\
