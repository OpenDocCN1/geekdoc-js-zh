- img_proc: true
  md: '+   CommonJS modules – a module format that originated in, and was designed
    for, server-side JavaScript. It was popularized by the server-side JavaScript
    platform Node.js. CommonJS modules preceded JavaScript''s built-in ECMAScript
    modules and are still much used and well supported by tooling (IDEs, built tools,
    etc.).


    +   TypeScript''s modules – whose syntax is based on ECMAScript modules. However,
    they are often compiled to CommonJS modules.


    +   npm packages – directories with files that are installed via the npm package
    manager. They can contain CommonJS modules, ECMAScript modules, and various other
    files.


    # 8.2 Limitations


    In this chapter, we are using what TypeScript currently supports best:


    +   * All Your TypeScript code is compiled to CommonJS modules with the extension
    .js.

    * All external imports are CommonJS modules, too.


    Especially on Node.js, TypeScript currently doesn''t really support ECMAScript
    modules and filename extensions other than .js.


    # 8.3 The repository ts-demo-npm-cjs


    This is how the repository ts-demo-npm-cjs is structured:


    ```

    ts-demo-npm-cjs/

    .gitignore

    nmodules

    dist/ (created on demand)

    package.json

    ts/

    src/

    index.ts

    test/

    index_test.ts

    tsconfig.json

    ```


    Apart from package.json for the package, the repository contains:


    +   * ts/src/index.ts: the actual code of the package

    * ts/test/index_test.ts: a test for index.ts

    * tsconfig.json: configuration data for the TypeScript compiler


    package.json contains scripts for compiling:


    +   * Input: directory ts/ (TypeScript)

    * Output: directory dist/ (CommonJS modules; the directory doesn''t yet exist
    in the repository)


    This is where the compilation results for the two TypeScript files are put:'
