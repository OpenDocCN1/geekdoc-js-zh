    # ### 14.1.3.5 Unions of symbol types vs. unions of string literal types\n\nHow\
    \ do the two approaches check for both.\n\n+   - Exhaustiveness checks for both.\n\
    - Using symbols is more verbose.\n- Each symbol ‘literal’ creates a unique symbol\
    \ that can’t be confused with any other symbol. That’s not true for string literals.\n\
    \nRecall this example where the Spanish 'no' was confused with the English 'no':\n\
    \n```\ntype Spanish = 'no' | 'si';\ntype English = 'no' | 'yes';\n```\n\n```\n\
    const spanishWord: Spanish = 'no';\nconst englishWord: English = spanishWord;\n\
    ```\n\nIf we use symbols, we don't have this problem:\n\n```\nconst spanishNo\
    \ = Symbol('no');\nconst spanishSi = Symbol('si');\ntype Spanish = typeof spanishNo\
    \ | typeof spanishSi;\n```\n\n```\nconst englishNo = Symbol('no');\nconst englishYes\
    \ = Symbol('yes');\ntype English = typeof englishNo | typeof englishYes;\n```\n\
    \n```\nconst spanishWord: Spanish = spanishNo;\n// @ts-expect-error: Type 'unique\
    \ symbol' is not assignable to type 'English'. (2322)\nconst english: English\
    \ = spanishNo;\n```\n\n# ### 14.1.4 Conclusion of this section: union types vs.\
    \ enums\n\nUnion types and enums have some common values. However, we do it differently:\n\
    \n+   - We can auto-complete member values.\n  - With enums, we get auto-completion\
    \ after the enum name and a dot.\n  - With union types, we have to explicitly\
    \ trigger auto-completion.\n- Exhaustiveness checks also work for both.\n\nBut\
    \ they also differ. Downsides of symbol singleton types are:\n\n+   - They are\
    \ slightly verbose.\n- There is no namespace for their members."
