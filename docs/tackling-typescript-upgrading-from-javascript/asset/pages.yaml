  md: "17.5 Abstract classes\n\n# 17.4.2 Making constructor parameters public, private,\
    \ or protected\n\nIf we use the keyword public for a constructor parameter, then\
    \ TypeScript does two\nthings for us:\n\n+   * It declares a public instance property\
    \ with the same name.\n* It assigns the parameter to that instance property.\n\
    \nTherefore, the two classes are equivalent:\n\n```\nclass Point1 {\n  constructor(public\
    \ x: number, public y: number) {\n  }\n}\n```\n\n```\nclass Point2 {\n  x: number;\n\
    \  y: number;\n  constructor(x: number, y: number) {\n    this.x = x;\n    this.y\
    \ = y;\n  }\n}\n```\n\nIf we use private or protected instead of public, then\
    \ the corresponding instance prop-perties are private or protected (not public).\n\
    \n# 17.5 Abstract classes\n\nTwo constructs can be abstract in TypeScript: Only\
    \ its subclasses can – if they are not\nabstract, themselves.\n\n+   * An abstract\
    \ class can't be instantiated. An abstract method has no implementation, only\
    \ a type signature. Each concrete subclass must have a concrete method with the\
    \ same name and a compatible type signature.\n* If a class has abstract methods,\
    \ it must be abstract, too.\n\nThe following code demonstrates abstract classes\
    \ and methods.\n\nOn one hand, there is the superclass Printable and its helper\
    \ class String-Builder:\n\n```\nclass StringBuilder {\n  string = '';\n  add(str:\
    \ string) {\n    this.string += str;\n  }\n}\n```\n\n```\nabstract class Printable\
    \ {\n  toString() {\n    const out = new StringBuilder();\n}\n```"
