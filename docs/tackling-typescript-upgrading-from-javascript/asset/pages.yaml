  md: "14.2 Discriminated unions\n\n+   * It's slightly harder to migrate from them\
    \ to different constructs (should be necessary): It's easier to find where enum\
    \ member values are mentioned.\n\nUpsides of unions of symbol singleton types\
    \ are:\n\n+   * They are not a custom TypeScript language construct and therefore\
    \ closer to plain JavaScript.\n* String enums are only type-safe at compile time.\
    \ Unions of symbol singleton types are additionally type-safe at runtime.\n  *\
    \ This matters especially if our compiled TypeScript code interacts with plain\
    \ JavaScript code.\n\n# 14.2 Discriminated unions\n\nDiscriminated unions are\
    \ related to algebraic data types in functional programming languages.\n\nTo understand\
    \ how they work, consider the data structure syntax tree that represents expressions\
    \ such as:\n\n1 + 2 + 3\n\nA syntax tree is either:\n\n+   * A number\n* The addition\
    \ of two syntax trees\n\nNext steps:\n\n+   * 1. We'll start by creating an object-oriented\
    \ class hierarchy for syntax trees.\n* 2. Then we'll transform it into something\
    \ slightly more functional.\n* 3. And finally, we'll end up with a discriminated\
    \ union.\n\n# 14.2.1 Step 1: the syntax tree as a class hierarchy\n\nThis is a\
    \ typical object-oriented implementation of a syntax tree:\n\n```\n// Abstract\
    \ class can't be instantiated via `new`nabstract class SyntaxTree {\n  class NumberValue\
    \ extends SyntaxTree {\n    constructor(public numberValue: number) {\n      super();\n\
    \    }\n  }\n  class Addition extends SyntaxTree {\n    constructor(public operand1:\
    \ SyntaxTree, public operand2: SyntaxTree) {\n      super();\n    }\n  }\n}\n\
    ```\n\nSyntaxTree is the superclass of NumberValue and Addition1. The keyword\
    \ public is syntactic sugar for:"
