    \ to Typescript” by Dylan Vann\n\n# 10.5 Conclusion\n\nWe have taken a quick look\
    \ at strategies for migrating to TypeScript. Two more tips:\n\n+   * Start your\
    \ migration with experiments: Play with your code base and try out various strategies\
    \ before committing to one of them.\n* Then lay out clear plan for going forward.\
