    \ typed functions\n\n# 21.1.1 Function declarations\n\nThis is an example of a\
    \ function declaration in TypeScript:\n\n```\nfunction repeat1(str: string, times:\
    \ number): string { // (A)\n  str.repeat(times);\n}\nassert.equal(\n  repeat1('*',\
    \ 5, '******');\n```\n\n+   - Parameters: If the compiler option --noImplicitAny\
    \ is inferred. That is usually on, if it is --strict, then the type of each parameter\
    \ must be either inferrable or explicitly specified. (We take a closer look at\
    \ inference later). In this case, no inference is possible, which is why str and\
    \ times have type annotations.\n- Return value: By default, the return type of\
    \ function is inferred. That is usually good enough. In this case, we opt to explicitly\
    \ specify that repeat1() has the return type string (last type annotation in line\
    \ A\n\n# 21.1.2 Arrow functions\n\nThe function version of repeat1() looks as\
    \ follows:\n\n```\nconst repeat2 = (str: string, times: number): string => {\n\
    \  str.repeat(times);\n};\n```\n\nIn this case, we can also use an expression\
    \ body:\n\n```\nconst repeat3 = (str: string, times: number): string =>\nstr.repeat(times);\n\
    ```\n\n# 21.2 Types for functions\n\n# 21.2.1 Function type signatures\n\nWe can\
    \ define types for functions via function type signatures:\n\n```\ntype Repeat\
    \ = (str: string, times: number) => string;\n```\n\nThe name of this type of function\
    \ is Repeat. Among others, it matches all functions with:\n\n+   - Two parameters\
    \ whose types are string and number. We need to name parameters in function type\
    \ signatures, but the names are ignored when checking if function types are compatible.\n\
    - The return type string. Note that this time, the type is separated by an arrow\
    \ and can't be omitted."
