  md: "# 16.4 Object literals and interfaces\n\n# 16.4.7.4 Matching objects without\
    \ properties\n\nIf we want to enforce that an object has no properties, we can\
    \ use the following trick (credit: Geoff Goodman):\n\n```\ninterface WithoutProperties\
    \ {\n  [key: string]: never;\n}\n\n// ts-expect-error: Type 'number' is not assignable\
    \ to type 'never'. (2322)\nconst a: WithoutProperties = { prop: 1 };\nconst b:\
    \ WithoutProperties = {}; // OK\n```\n\n# 16.4.7.5 Allowing excess properties\
    \ in object literals\n\nIf we want to allow excess properties in object literals?\
    \ As an example, consider interface Point and function computeDistance1():\n\n\
    ```\ninterface Point {\n  x: number;\n  y: number;\n}\n\nfunction computeDistance1(point:\
    \ Point) { /*...*/ };\n\n// ts-expect-error: Argument of type '{x: number; y:\
    \ number; z: number}' is not assignable to parameter of type 'Point'.\n// Object\
    \ literal may only specify known properties, and 'z' does not exist in type 'Point'.\
    \ (2345)\ncomputeDistance1({ x: 1, y: 2, z: 3 });\n```\n\nOne option is to assign\
    \ the object literal to an intermediate variable:\n\n```\nconst obj = { x: 1,\
    \ y: 2, z: 3 };\ncomputeDistance1(obj);\n```\n\nA second option is to use a assertion:\n\
    \n```\ncomputeDistance1({ x: 1, y: 2, z: 3 } as Point); // OK\n```\n\nA third\
    \ option is to rewrite computeDistance() so that it uses a type parameter:\n\n\
    ```\nfunction computeDistance2<P extends Point>(point: P) { /*...*/ };\ncomputeDistance2({\
    \ x: 1, y: 2, z: 3 }); // OK\n```\n\nA fourth option is to extend interface Point\
    \ so that it allows excess properties:\n\n```\ninterface PointEtc extends Point\
    \ {\n  [key: string]: any;\n}\nfunction computeDistance3(point: PointEtc) { /*...*/\
    \ };\ncomputeDistance3({ x: 1, y: 2, z: 3 }); // OK\n```"
