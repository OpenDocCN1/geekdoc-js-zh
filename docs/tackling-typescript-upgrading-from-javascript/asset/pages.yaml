  md: "# 23.2.6 Narrowing Array element types\n\n# 23.2.6.1 The Array method .every()\
    \ does not narrow\n\nIf we use .every() to check that all Array elements are non-nullish,\
    \ TypeScript does not narrow the type of mixedValues (line A):\n\n```\nconst mixedValues:\
    \ ReadonlyArray<undefined|number> =\n[1, undefined, 2, null];\n```\n\n```\nif\
    \ (mixedValues.every(isNotNull)) {\n  // inferred-type: readonly (null | undefined)[]\n\
    \  mixedValues; // (A)\n}\n```\n\nNote that mixedValues has to be read-only. If\
    \ it weren't, another reference to it would statically allow us push null into\
    \ mixedValues inside the statement. But then the narrowed type of mixedValues\
    \ incorrect.\n\nThe previous code uses user-defined type guard (more on what that\
    \ is soon):\n\n```\nfunction isNotNull<T>(value: T): value is NonNullable<T> {\
    \ // (A)\n  return value !== undefined && value !== null;\n}\n```\n\nNullable<Union>\
    \ (line A) is a utility type that removes the undefined and null from union type.\n\
    \n# 23.2.6.2 The Array method .filter() produces Arrays with narrower types\n\n\
    .filter() produces Arrays that have narrower types (i.e., it doesn't really narrow\
    \ existing types):\n\n```\n// inferred-type: (number | null | undefined)\nconst\
    \ mixedValues = [1, undefined, 2, null];\n```\n\n```\n// inferred-type: number[]\n\
    const numbers = mixedValues.filter(isNotNull);\n```\n\n```\nfunction isNotNull<T>(value:\
    \ T): value is NonNullable<T> { // (A)\n  return value !== undefined && value\
    \ !== null;\n}\n```\n\nAs well we use a type guard function – an arrow function\
    \ with a type guard that is not enough:\n\n```\n// inferred-type: (number | null\
    \ | undefined)\nconst stillMixed1 = mixedValues.filter(\n  x => x !== undefined\
    \ && x !== null);\n```\n\n```\n// inferred-type: (number | null | undefined)\n\
    const stillMixed2 = mixedValues.filter(\n  x => typeof x === 'number');\n```"
