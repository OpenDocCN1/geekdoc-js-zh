    \ ???, x: number, y: number) {\n  return new PointClass(x, y);\n}\n```\n\nWhat\
    \ type should we use for the parameter PointClass if we want it to be Point or\
    \ a subclass?\n\n# 19.2 The type operator typeof\n\nIn §7.7 “The two language\
    \ levels: dynamic vs. static\", we explored the two language levels of TypeScript:\n\
    \n+   - Dynamic level: JavaScript (code and values)\n- Static level: TypeScript\
    \ (static types)\n\nThe class Point creates two things:\n\n+   - The constructor\
    \ function Point\n- The interface Point for instances of Point\n\nDepending on\
    \ where we mention Point, it means different things. That's why we can't use the\
    \ type Point for PointClass: It matches instances of class, not class Point itself.\n\
    \nInstead, we need to use the operator typeof (another bit of TypeScript syntax\
    \ that also exists in JavaScript). typeof v stands for the type of dynamic(!)\
    \ v.\n\n```\nfunction createPoint(PointClass: typeof, x: number, y: number) //\
    \ (A)\n  return new PointClass(x, y);\n```\n\n```\n// inferred-type: Point\nconst\
    \ point = createPoint(Point, 3, 6);\nsert.ok(point instanceof Point);\n```\n\n\
    # 19.2.1 Constructor type literals\n\nA constructor type literal is a function\
    \ literal with a prefixed new (line A). The prefix indicates that PointClass is\
    \ a function that can be invoked via new.\n\n```\nfunction createPoint(\n  PointClass:\
    \ new (x: number, y: number) => Point, // (A)\n  x: number, y: number\n  return\
