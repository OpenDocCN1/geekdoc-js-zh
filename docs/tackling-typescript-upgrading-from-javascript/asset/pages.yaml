    \ NumberValue(2),\n    new NumberValue(3), // trailing comma\n  ),\n);// // trailing\
    \ comma\n\n```\n\nNote: trailing commas in argument lists are allowed in JavaScript\
    \ since ECMAScript 2016.\n\n# 14.2.2 Step 2: the syntax tree as a union type of\
    \ classes\n\nIf we define the syntax tree as a union type (line A), we don't need\
    \ object-oriented inheritance:\n\n```\nclass NumberValue {\n  constructor(public\
    \ numberValue: number) {}\n}\nclass Addition2 {\n  constructor(public operand1:\
    \ SyntaxTree, public operand2: SyntaxTree)\n}\ntype SyntaxTree2 = NumberValue\
    \ | Addition2; // (A)\n\n```\n\nSince NumberValue and Addition2 don't have a superclass,\
    \ they don't need to invoke super() in their constructors.\n\nInterestingly, we\
