  md: "# 14.1.1 Primitive literal types\n\nQuick recap: We can consider types to be\
    \ sets of values.\n\nA singleton type is a type with one element. Primitive literal\
    \ types are singleton types:\n\n```\ntype UndefinedLiteralType = undefined;\n\
    type NullLiteralType = null;\n\ntype BooleanLiteralType = true;\ntype NumericLiteralType\
    \ = 123;\ntype BigIntLiteralType = 123n; // target must be ES2020+\ntype StringLiteralType\
    \ = 'abc';\n```\n\nUndefinedLiteralType is the type with the single element undefined,\
    \ etc.\nIt is important to be aware of the two language levels at play here (we\
    \ have already encountered those levels earlier in this book). Consider the following\
    \ variable declaration:\n\n```\nconst abc = 'abc' = 'abc';\n```\n\n+   - The first\
    \ 'abc' represents a type (a string literal type).\n- The second 'abc' represents\
    \ a value.\n\nTwo use cases for primitive literal types are:\n\n+   - Overloading\
    \ on string parameters which enables the first argument of the following method\
    \ call to determine the type of the second argument:\n  elem.addEventListener('click',\
    \ myEventHandler);\n\n+   - We can use a union of primitive literal types to define\
    \ a type by enumerating its members:\n  type IceCreamFlavor = 'vanilla' | 'chocolate'\
    \ | 'strawberry';\n\nRead on for information about the second use case.\n\n# 14.1.2\
    \ Unions of string literal types\n\nWe'll start with an enum and convert it to\
    \ a union of string literal types.\n\n```\nenum NoYesEnum {\n  No = 'No',\n  Yes\
    \ = 'Yes',\n}\nfunction toGerman(value: NoYesEnum): string {\n  switch (value)\
    \ {\n    case NoYesEnum.No:\n      return 'Nein';\n    case NoYesEnum.Yes:\n \
    \     return 'Ja';\n  }\n}\n```"
