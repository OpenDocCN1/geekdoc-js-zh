  md: "# 23.1 When are static types too general?\n\nInside the then-blocks starting\
    \ in line A and line B, the static type of value changes, due to the checks we\
    \ performed. We are now working with subsets of the original type number|string.\
    \ This way of reducing the size of a type is called narrowing. Checking the result\
    \ of typeof and similar runtime operations are called type guards.\n\nNote that\
    \ narrowing does not change the original type of value, it only makes it more\
    \ specific as we pass more checks.\n\n# 23.1.2 Narrowing via switch and a type\
    \ guard\n\nNarrowing also works if we use switch instead of:\n\n```\nfunction\
    \ getScore(value: number|string): number {\n  switch (typeof value) {\n    case\
    \ 'number':\n      //inferred-type: number\n      value;\n      return value;\n\
    \    case 'string':\n      //inferred-type: string\n      value;\n      return\
    \ value.length;\n    default:\n      throw new Error('Unsupported value: ' + value);\n\
    \  }\n}\n```\n\n# 23.1.3 More cases of types being too general\n\nThese are more\
    \ examples of types being too general:\n\n+   * Nullable types:\n    function\
    \ func1(arg: null|string) {}\n    function func2(arg: undefined|string) {}\n*\
    \ Discriminated unions:\n    type Teacher = { kind: 'Teacher', teacherId: string\
    \ };\n    type Student = { kind: 'Student', studentId: string };\n    type Attendee\
    \ = Teacher | Student;\n* Types of optional parameters:\n    function func4(arg?:\
    \ string) {\n      //inferred-type: string | undefined\n      arg;\n    }"
