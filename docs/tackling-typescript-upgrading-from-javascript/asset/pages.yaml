  md: "# 19.3 A generic type for classes: Class<T>\n\nSimilarly, construct signatures\
    \ enable generic interfaces and OLTs to describe constructor functions. They look\
    \ like call signatures with the added prefix new. In the next example, PointClass\
    \ has an object literal type with a construct signature:\n\n```\nfunction createPoint(\n\
    \  PointClass:{new (x: number, y: number): Point},\n  x: number, y: number\n {\n\
    \  return new PointClass(x, y);\n}\n```\n\n# 19.3 A generic type for classes:\
    \ Class<T>\n\nWith the knowledge we have acquired, we can create a generic type\
    \ for classes as values – introducing a type parameter T:\n\n```\ntype Class<T>\
    \ = new (...args: any[]) => T;\n```\n\nInstead of a type alias, we can also use\
    \ an interface:\n\n```\ninterface Class<T> {\n  new(...args: any[]): T;\n}\n```\n\
    \nClass<T> is a type for classes whose instances match T.\n\n# 19.3.1 Example:\
    \ creating instances\n\nClass<T> enables us to write a generic version of createPoint():\n\
    \n```\nfunction createInstance(AnyClass: Class<T>, ...args: any[])): T {\n  return\
    \ new AnyClass(...args);\n}\n```\n\ncreateInstance() is used as follows:\n\n```\n\
    class Person {\n  constructor(public name: string) {}\n}\n\n// inferred-type:\
    \ Person\nconst jane = createInstance(Person, 'Jane');\n```\n\ncreateInstance()\
    \ is the new operator, implemented via function.\n\n# 19.3.2 Example: casting\
    \ with runtime checks\n\nWe can use cast to implement casting:\n\n```\nfunction\
    \ cast<T>(AnyClass: Class<T>, obj: any): T {\n  if (!(obj instanceof AnyClass)\
    \ {\n    throw new Error('Not an instance of ${AnyClass.name}: ${obj}');\n}\n\
    ```"
