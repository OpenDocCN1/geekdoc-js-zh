  md: "# 20.2 Ways of typing Arrays\n\n# 20.2.1 Array role “list”: Array type literals\
    \ vs. interface type Array\n\nAn Array type literal consists of the element type\
    \ followed by []. In the following code, the Array type literal is string[];\n\
    \n```\n// Each Array element has the type `string`;\nconst myArrayArray: string[]\
    \ = ['fee', 'fi', 'fo', 'fum'];\n```\n\nAn Array type is a shorthand for using\
    \ the global generic interface type Array:\n\n```\nconst myArrayArray: Array<string>\
    \ = ['fee', 'fi', 'fo', 'fum'];\n```\n\nIf the element type is more complicated,\
    \ we need parentheses for Array type literals:\n\n```\n(number|string[])\n(()\
    \ => boolean[])\n```\n\nThe generic type Array works better in this case:\n\n\
    ```\nArray<number|string>\nArray<() => boolean>\n```\n\n# 20.2.2 Array role “tuple”:\
    \ tuple type literals\n\nIf the Array has a fixed length and each element has\
    \ a different, fixed type that depends on its position, then we can use tuple\
    \ literals such as [string, string, boolean]:\n\n```\nconst yes: [string, string,\
    \ boolean] = ['oui', 'si', true];\n```\n\n# 20.2.3 Objects that are also Array-ish:\
    \ interfaces with index signature\n\nIf an interface has only an index signature,\
    \ we can use it for Arrays:\n\n```\ninterface StringArray {\n  [index: number]:\
    \ string;\n}\nconst strArr: StringArray = ['Huey', 'Dewey', 'Louie'];\n```\n\n\
    An interface that has both an index signature and property signatures, only works\
    \ for objects (because indexed elements and properties need to be defined at the\
    \ same time):\n\n```\ninterface FirstNamesAndLastName {\n  [index: number]: string;\n\
    \  lastName: string;\n}\n\nconst: FirstNamesAndLastName = {\n  0: 'Huey',\n  1:\
    \ 'Dewey',\n  2: 'Louie',\n  lastName: 'Duck'\n};\n```"
