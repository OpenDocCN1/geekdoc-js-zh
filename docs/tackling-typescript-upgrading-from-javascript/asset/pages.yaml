  md: "# 16.4 Object type literals and interfaces\n\nSimilarly, {} has a method .toString():\n\
    \n```\nfunction f2(x: {}): { toString(): string {\n  return x;\n}\n```\n\n# 16.4.7\
    \ Excess property checks: When are extra properties allowed?\n\nAs an example,\
    \ consider the following interface:\n\n```\ninterface Person {\n  x: number;\n\
    \  y: number;\n}\n```\n\nThere are two ways (among others) in which this interface\
    \ could be interpreted:\n\n+   - Closed interpretation: It could describe all\
    \ objects that have *exactly* the properties .x and .y with the specified types.\
    \ In other words: These objects must not have *excess properties* (more than the\
    \ required properties).\n- Open interpretation: It could describe all objects\
    \ that have *at least* the properties .x and .y. In other: Excess properties are\
    \ allowed.\n\nTypeScript uses both interpretations. To explore how that works,\
    \ we will use the following function:\n\n```\nfunction computeDistance(point:\
    \ Person) { /*...*/ }\n```\n\nThe default is that excess property .z is allowed:\n\
    \n```\nconst obj = { x: 1, y: 2, z: 3 };\ncomputeDistance(obj); // OK\n```\n\n\
    However, if we use literals directly, then excess properties are forbidden:\n\n\
    ```\n// @ts-error: Argument of type '{ x: number; y: number; z: number; }\n is\
    \ not assignable to parameter of type 'Point'.\n// Object literal may only specify\
    \ known properties, and 'z' does not\n// exist in type 'Point'. (2345)\ncomputeDistance({\
    \ x: 1, y: 2, z: 3 }); // error\n```\n\n# 16.4.7.1 Why are excess properties forbidden\
    \ in object literals?\n\nThe stricter rules for *object literals* provide protection\
    \ against typos in properties. We will use the following interface to demonstrate\
    \ what that means:\n\n```\ninterface Person {\n  first: string;\n  middle?: string;\n\
    \  last: string;\n}\nfunction computeFullName(person: Person) { /*...*/ }\n```"
