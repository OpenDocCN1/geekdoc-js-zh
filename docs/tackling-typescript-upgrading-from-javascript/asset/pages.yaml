  md: '# 7.7 The two language levels: dynamic vs. static


    TypeScript has two language levels:


    +   - The dynamic level is managed by JavaScript and consists of code and values,
    at runtime.

    - The static level is managed by TypeScript (excluding JavaScript) and consists
    of static types, at compile time.


    We can see these two levels in the syntax:


    ```

    const undef = undefined;

    ```


    +   - At the dynamic level, we use JavaScript to declare a variable undef and
    initialize it with the value undefined.

    - At the static level, we use TypeScript to specify variable undef has the static
    type undefined.


    Note that the same syntax, undefined, means different things depending on whether
    it is used at the dynamic level or at the static level.


    > Try to develop an awareness of the two language levels

    That helps considerably with making sense of TypeScript.


    # 7.8 Type aliases


    With type we can create a new name (alias) for an existing type:


    ```

    type Age = number;

    const age: Age = 82;

    ```


    # 7.9 Typing Arrays


    Arrays play two roles in JavaScript (either one or both):


    +   - List: All elements have the same type.

    - Tuple: The length of the Array is fixed. The elements generally don''t have
    the same type.


    # 7.9.1 Arrays as lists


    There are two ways to express that the Array is used as a list whose elements
    are all numbers:


    ```

    let arr1: number[] = [];

    let arr2: Array<number> = [];

    ```'
