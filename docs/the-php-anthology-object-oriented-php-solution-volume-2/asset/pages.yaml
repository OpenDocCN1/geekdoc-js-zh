  md: 'If you have a central script that is included in every page a visitor views,
    you can simply watch for incoming events (e.g. a variable like $_GET[''newPost''])
    and have some code respond by deleting the required cache files. This keeps the
    cache removal mechanism clean and easier to maintain. You might also consider
