    \ fairly friendly interface\nfor creating documents, including the ability to\
    \ add images, links, shapes,\nand more, not to mention encryption, which requires\
    \ the reader to provide\npass in order to view the document. R&OS PDF has everything\
    \ you need\nto render PDF \"on the fly\" with PHP.\n\nThe documentation provided\
