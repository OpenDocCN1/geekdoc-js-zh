  md: "# Chapter 2: XML\n\n```\n<operation name=\"searchRegion\">\n  <input message=\"\
    tns:searchByRegion\"/>\n  <output message=\"tns:searchByRegionResponse\"/>\n</operation>\n\
    </portType>\n```\n\nEnough theory! It's time to put your money where your mouth\
    \ is, and show you how easy it is to create SOAP clients with the help of WSDL\
    \ (as well as PEAR::SOAP and Shane Caraveo, its maintainer). Using the latest\
    \ version of PEAR::SOAP (version 0.75 at time of writing), we can generate a proxy\
    \ class from the above WSDL description like this:\n\n```\n<?php\n// Include the\
    \ PEAR::SOAP client class\nrequire_once 'SOAP/Client.php';\n\n// Instantiate the\
    \ SOAP_WSDL class using the online document\n$wsdl = new SOAP_WSDL(\n  'http://live.capervice.com/wsdl/GlobalWeather.wsdl');\n\
    );\n\n// Get the proxy class for the service\n$proxy = $wsdl->generateProxy('',\
    \ 'StationInfo');\n\n// Display the code\necho '<pre>';\necho htmlspecialchars($proxy);\n\
    echo '</pre>';\n?>\n```\n\nWhat this will display is an outline of a PHP class\
    \ generated as a result of reading the WSDL document. Here's that outline in a\
