    foreach ($customers as $customer) {\n    // Decide which factory class to create\n\
    \    switch ($customer['emailpreferred']) {\n        case 'html':\n          \
    \  // Create the factory\n            $factory = &new HtmlEmailFactory();\n  \
    \          // Call the factory method\n            $body = &&$factory->getBody($htmltext);\n\
    \            break;\n        case 'text':\n            // Create the factory\n\
