  md: "For example, let's say we want to analyze a text document to ascertain how\
    \ many vowels and consonants contains it. We might parse the document, create\
    \ objects to represent the elements of the document in which we're interested.\
    \ We can then go back and analyze these objects to get the statistics we're interested\
    \ in.\n\nTo start, let's put together a class, TextStats, which will parse documents\
    \ using a character by character approach, taking advantage of PHP's ability to\
    \ treat strings as arrays:\n\n```\n/**\n * Class for Analyzing Text\n */\nclass\
    \ TextStats {\n  /**\n   * The document to analyze\n   */\n  var $doc;\n  /**\n\
    \   * An array of Vowel and Consonant objects\n   */\n  var $chars = array();\n\
    \n  function TextStats($doc) {\n    $this->doc = $doc;\n    $this->buildStats();\n\
    \  }\n\n  /**\n   * Calls a factory method to get a Vowel or Consonant\n   */\n\
    \  function buildStats() {\n    $length = strlen($this->doc);\n    for ($i=0;\
    \ $i<$length; $i++) {\n      // Factory method called here\n      if ($char =\
    \ &Factory::getChar($this->doc[$i])) {\n        $this->chars[] = $char;\n    }\n\
    \  }\n}\n```"
