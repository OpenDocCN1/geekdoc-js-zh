    so it''s worth investigating the options to work out which you prefer. The documentation
    syntax by each tool varies; writing documentation for one will, be, only partially
    compatible with another. Of the *actively* developed alternatives, you have:


    **Doxygen: http://www.doxygen.org/**

    Doxygen is a documentation generation tool for multiple languages, including PHP.
    It''s popular in the Linux community and is built by eZ systems to generate the
