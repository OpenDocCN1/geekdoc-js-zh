    author\">by \" . \n    $article->author . \"</td><n</nn</tr>\\n\";\n    $table\
    \ .= \"<tr><td>\" . $article->body . \"</td><n</nn</tr>\\n\";\n}\n```\n\nIf you're\
    \ interested in the rest of the code of this script, you'll find it in the code\
    \ archive for this chapter.\n\n# Security and Authentication in Web Services\n\
    \nOne point you should be aware of when dealing with Web services is that you\
    \ may need to consider the security implications (and their dogs) fetching content\
    \ from your site and displaying it on theirs? You probably want some kind of authentication\
    \ mechanism so only permitted sites can fetch your content. If the content that\
    \ is being sent is confidential, or you're using an authentication system and\
    \ you're worried about a user \"sniffing\" login credentials, you'll need to make\
    \ sure that the conversation is encrypted.\n\nSolving these problems is best handled\
    \ using the mechanisms that are already available with HTTP, namely SSL to encrypt\
    \ conversations, and HTTP authentication (which you saw) to \"wrap up\" a Web\
    \ service in an environment that requires authentication."
