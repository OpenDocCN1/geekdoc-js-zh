    Updating the RSS Feed\n\nThe observer pattern is a powerful but easy-to-use mechanism\
    \ for executing multiple routines without specifically calling them in our code.\
    \ We can add or remove observers easily, without making serious modifications\
    \ to the main logic of the application. More importantly, it's easy to use the\
    \ observers on observables, and add their capabilities to other parts of our site,\
    \ such as a forum."
