  md: "# How do I parse an RSS feed with PHP and SAX?\n\nLast come the handler functions,\
    \ which are more or less the same as you've seen\nbefore, now repurposed as methods:\n\
    \nFile: XML/SaxRssParser.php (in SPLIB) (excerpt)\n\n```\n/**\n * Handles opening\
    \ tags\n * @param resource instance of PHP SAX XML\n * @param string element name\n\
    \ * @param array element attributes\n * @return void\n * @access private\n */\n\
    function open($sax, $element, $attributes) {\n    if ($this->newItem) {\n    \
    \    $this->element = $element;\n    } else if ($element == 'ITEM') {\n      \
    \  $this->newItem = TRUE;\n    }\n}\nn/**\n * Handles character data\n * @param\
    \ resource instance of PHP SAX XML\n * @param string element name\n * @return\
    \ void\n * @access private\n */\nfunction data($sax, $data) {\n    if ($this->newItem)\
    \ {\n        switch ($this->element) {\n            case 'TITLE':\n          \
    \  $this->title .= $data;\n            break;\n            case 'DESCRIPTION':\n\
    \            $this->description .= $data;\n            break;\n            case\
