    Be warned: the degree of integration between the packages within PEAR is rarely
    lively when compared to say, the Java class library. This means, in some cases,
    that you''ll be confronted with decisions on which to use PEAR:HTML_QuickForm''s
    validation function, or PEAR:Validate, or both. It''s a good idea to invest some
    time investigating which fits your development style up-front, than jumping straight
    in and using a PEAR class for a critical part of your application, only to discover
    later that it wasn''t the best fit for the problem.


    One important point to be clear is that referring to "PEAR" can actually mean
    one of two things: the repository as a whole, or the PEAR front end (also known
    as the package manager), which provides tools for installing and upgrading the
    PEAR packages you use.


    Note that it''s not a requirement that you use the PEAR package manager to install
    PEAR packages. If you need to, you can download them directly from the PEAR Website
    and manually extract them to your PHP''s path. Make sure you check the dependencies
    listed on the site (these being other required packages) and be aware that most
    packages implicitly require PEAR "base" package[7] for tasks like error handling.


