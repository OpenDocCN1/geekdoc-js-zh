    \ user details. If you're using a different table structure, you'll need to modify\
    \ this method.\n\nNote that we use both the login and email to identify the row,\
    \ so it's a little more difficult for other people to reset your members' passwords.\
    \ Although there's no risk in individuals stealing the new password (unless they\
