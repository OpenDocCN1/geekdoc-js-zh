  md: "# Putting it Together\n\n```\n$pdfArticle->display();\n```\n\nWith that class\
    \ ready, next, we need to put together a handler class that will use XML_HTMLMSax\
    \ and listen for HTML tags. This class will also use the ArticlePDF class and,\
    \ as it encounters HTML tags, will use the ArticlePDF API to generate the PDF\
    \ document. The handler itself builds up a text buffer of the HTML it has parsed,\
    \ adding any R&OS markup for links, bold, and italic tags as it finds them. The\
    \ text buffer will be committed to the document every time an opening or br tag\
    \ is encountered. HTML header tags (e.g. h5) will be treated as a special case,\
    \ which they are committed to the document immediately.\n\nHere are the key parts\
    \ of this class from the point of view of how we'd use it. The constructor takes\
    \ an instance of the ArticlePDF class as its only parameter. This allows us to\
