    \ We've used the XPath predicate³ in the template's condition to demonstrate an\
    \ interesting capability of stylesheets, rather than to encourage you to take\
    \ this approach.\n\nFile: articles.xsl (excerpt)\n\n```\n<xsl:output method=\"\
    html\" indent=\"yes\" encoding=\"iso-8859-1\" />\n<!-- Strip whitespace from original\
    \ -->\n<xsl:strip-space elements=\"**\" />\n<!-- Match each published article\
    \ -->\n<xsl:template priority=\"1\" match=\"spt:article[spt:id='1']\">\n<tr>\n\
