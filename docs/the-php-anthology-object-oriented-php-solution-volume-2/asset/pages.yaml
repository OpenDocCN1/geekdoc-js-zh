  md: "# Chapter 1: Access Control\n\nNote that the realm value specified in the WWW-Authenticate\
    \ header is displayed in the dialog box. A realm is a \"security space\" or \"\
    zone\" within which a particular set of login details are valid. Upon successful\
    \ authentication, the browser will remember the correct user name and password\
    \ combination and automatically re-send it in any future request to that realm.\
    \ When the user navigates to another realm, the browser displays a prompt once\
    \ again.\n\nIn any case, the user must provide a user name and password to get\
    \ the page. The browser then sends those credentials with a second page request\
    \ like this:\n\n```\nGET /admin/ HTTP/1.1\nHost: www.sitepoint.com\nAuthorization:\
    \ Basic jTSABT766yNOHgjui\n```\n\nThe Authorization header contains the user name\
    \ and password encoded with base64 encoding, which is worth noting, is not secure—but\
    \ at least makes it unreadable for humans.\n\nThe server will check to ensure\
    \ that the credentials are valid. If they are not, the server will send the Authorization\
    \ Required response again, as shown previously. If the credentials are valid,\
    \ the server will send the requested page as normal.\n\n# Not by the Hairs of\
    \ my Chin...\n\nNow that you have a rough idea of how HTTP authentication works,\
    \ how might you secure a PHP page with it? When PHP receives an Authorization\
    \ header from a Web browser, it decodes the user name and password combination\
    \ and stores the values in the variables $_SERVER['PHP_AUTH_USER'] and $_SERVER['PHP_AUTH_PW']\
    \ for the user name and password, respectively. Here's how you could secure a\
    \ simple page:\n\n```\n<?php\n// An array of allowed users and their passwords\n\
    $users = array(\n    'harryf' => 'secret',\n    'littlepig' => 'chinny'\n);\n\n\
    // If there's no Authentication header, exit\nif (!isset($_SERVER['PHP_AUTH_USER']))\
    \ {\n    header('HTTP/1.1 401 Unauthorized');\n    header('WWW-Authenticate: Basic\
    \ realm=\"PHP Secured\"');\n}\n```"
