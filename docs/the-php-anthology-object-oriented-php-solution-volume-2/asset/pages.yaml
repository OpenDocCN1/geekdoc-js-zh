  md: '# The Origin is at the Bottom Left


    The position x = 0, y = 0 is at the bottom left side of the page. Make sure you
    remember that—it can be confusing, as we read from top to bottom.


    Next, we created an object and store it in a variable, $headfont. Objects created
    by the openObject method used to create elements that will repeat throughout the
    document. By calling the openObject method, the class stops adding to the main
    document, and adds content to the object instead. Here, we''ve created an object
    that will display the SitePoint logo at the top right of the page, as well as
    a horizontal line at the top and bottom of each page. The class will continue
    to add to the object until we call the closeObject method, at which point it returns
    to the main document.


    ```

    // Set header and footer as a recurring object

    $headfont = $openObject(); // Create object

    $pdf->saveState(); // Save document state

    $pdf->addJpegFromFile(''sitepoint_logo.jpg'', 430, 813, 70, 20);

    $pdf->setStrokeColor(0, 0.2, 0.4); // Set line color

    $pdf->setStyle(2, ''round''); // Set line style

    $pdf->lineTo(155.28, 811.59, 228, 81.89); // Add top line

    $pdf->lineTo(155.28, 30, 50, 28); // Add bottom line

    $pdf->restoreState(); // Restore document state

    $pdf->closeObject(); // Close the object

    ```


    Note I''ve used the saveState method to allow me to make temporary changes to
    colors, fonts and so on. When I''m done, the restoreState returns me to the original
    style values automatically.


    Next I''ll create another object which is a link which will appear on the bottom
    of every page, showing where the original HTML version can be found. Once created,
    I''ll add both objects to the document with the addObject method.


    ```

    // Set up bottom link object

    $bottomUrl = $openObject(); // Create object

    $pdf->saveState(); // Save document state

    $pdf->selectFont(''rspdf/fonts/Helvetica.afm''); // Select font

    $pdf->addText(155.28, 24, 6, ''Found at: '' .articleUrl);

    $pdf->restoreState(); // Restore document state

    $pdf->closeObject(); // Close the object

    ```


    ```

    // Add the $headfont object to every page (all,odd or even)

    ```'
