  md: "# Chapter 1: Access Control\n\nOnce you've done that, the next step is to override\
    \ php.ini settings with a .htaccess file containing:\n\nFile: mysql_session_handler/.htaccess\n\
    \n```\nphp_value session.save_handler 'user'\nphp_value session.save_path 'php_sessions'\n\
    php_value auto_prepend_file '/path/to/mysql_session_handler.php'\n```\n\nThe first\
    \ line tells PHP that rather than using its default session handling mechanism,\
    \ will let you handle sessions by your own code. The session.save_path refers\
    \ to the name of the table where sessions are stored. The last line tells PHP\
    \ to execute the mysql_session_handler.php file every time any script is executed.\n\
    \nFinally, you need to create a table called php_sessions with the following structure:\n\
    \n```\nCREATE TABLE php_sessions (\n  session_id VARCHAR(40) NOT NULL DEFAULT\
    \ '',\n  last_active INT(11) NOT NULL DEFAULT '0',\n  data TEXT NOT NULL,\n  PRIMARY\
    \ KEY (session_id)\n)\n```\n\nWith the .htaccess file placed in your Web root\
    \ directory, all PHP scripts will store the session data in MySQL rather than\
    \ in files.\n\nThe data stored for sessions has a format that looks like this:\n\
    \n```\nmyVar|s:11\"Hello World\";ip_address|s:9\"127.0.0.1\";\n```\n\nVariables\
    \ are separated by semicolons or {} in the case of arrays, while within each variable,\
    \ the name and value are separated by |. The value itself is stored in a serialized\
    \ format (see the PHP Manual[11] for details).\n\nSo the above example corresponds\
    \ to two variables:\n\n> ^4The PHP configuration setting auto_prepend_file can\
    \ only be set in php.ini or by a .htaccess file. If you can't use .htaccess in\
    \ that way, you'll need to include mysql_session_handler in all your scripts,\
    \ which is best done by adding it to a script that is already included by all\
    \ others, such as that you keep central configuration information. The values\
    \ session.save_handler and session_save_path can both be controlled by the ini_set\
    \ function (see Appendix A for more details). These will also need to be included\
    \ in every script.\n\n> [11] http://www.php.net/serialize\n\n72"
