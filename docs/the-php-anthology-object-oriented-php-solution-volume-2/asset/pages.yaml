  md: '# But What’s the point?


    +   Each layer must be able to exist on a physically independent system and be
    able to communicate over a network. Having said that, the layers do not have to
    be separate systems—they need only be designed in such a way that it is possible.
    Communication between layers on separate systems must be able to be handled over
    a network, with the help of some intermediate technology like SOAP or XML-RPC.
    In other words, this principle is something of a thought experiment for developers:
    “Is this distributable?” By applying this principle, the architecture as a whole
    becomes scalable, for example allowing it to be expanded with load balancing technologies
    as site traffic increases.


    +   Each layer should exchange information only with the layers above and below
    it. For example, the presentation logic may not exchange information directly
    with the data access tier, but must communicate only with the business tier; this
    will act as the interface to the data access tier.


    +   Each layer should be replaceable with other equivalent technologies. At the
    presentation layer, this means that Mozilla or Opera should function just as Internet
    Explorer when viewing a site. For the presentation logic, it should be possible
    to render alternative content types to HTML, such as WML (wireless mark up language)
    or SOAP. Down at the data tier, this might mean able to replace MySQL with PostgreSQL.
    Two further principles from this one:


    +   Each layer should have a clearly defined interface, or API.


    +   Layers should expect nothing of other layers, except that they conform to
    the defined APIs.


    # But What’s the point?


    The concepts behind N-Tier deliver three key benefits.


    First, by designing in accordance with the N-Tier principles, an application will
    have a better chance of coping with future traffic and performance demands, as
    it’s able to scale well within each tier. As traffic increases, for example, you
    may need to run multiple MySQL servers with data replication, or use multiple
    load balanced Web servers to serve content. When this comes, the preservation
    of PHP sessions, for example, becomes a problem, but with a reasonable N-Tier
    design it should be possible to adapt the application to the new requirements
    without any significant code rewriting. Perhaps you simply modify your session
    handling logic so'
