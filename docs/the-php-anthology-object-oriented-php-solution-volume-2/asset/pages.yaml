  md: '# How do I build a SOAP server with PHP?


    Now that you know how to build an XML-RPC service and consume a Web service with
    the help of WSDL, it''s time to look at building a SOAP server using PEAR::SOAP.
    Again, I''ll have to skip the details of the SOAP protocol itself and its supporting
    technology, WSDL, as these subjects potentially could be a complete book in themselves
    (see the section "Further Reading" at the end of this chapter). However, you should
    be able to accomplish a lot without having a detailed understanding of SOAP and
    WSDL; when you construct SOAP clients and servers, the implementation you use
    (in this case, PEAR::SOAP[32]) should handle these issues for you, and allow you
    to concentrate on getting the PHP code correct.


    # NuSOAP


    An alternative to PEAR::SOAP is NuSOAP[33], which, in fact, uses the project PEAR::SOAP
    as a base for it. In comparison, NuSOAP is a lightweight library that is easier
    for those who have trouble with PEAR to install, and is ideally suited to quickly
    building clients and servers based procedural code.


    When constructing services, you can make it easier for those who will use the
    service by providing a downloadable PHP client based on NuSOAP. NuSOAP also has
    the getProxy method, which can be used with WSDL documents to generate a class
    from a service on the fly, but its WSDL support is not as complete as PEAR::SOAP
    at the time of this writing.


    We''ll build the Article Server that you saw in "How do I build an XML-RPC service
    with PHP?”, but this time we''ll use SOAP instead of XML-RPC. Again, we''ll use
    a class to build with Web services, it usually proves a lot easier to write classes
    rather than procedural code, as the following example should make clear.


    To begin, we need to make available the PEAR::SOAP server class and the MySQL
    class created in Volume I, Chapter 3. First, as we defined some state variables:


    ```

    require_once ''SOAP/Server.php'';

    /**

    ```


