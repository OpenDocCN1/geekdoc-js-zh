    \ generate a random string of\ncharacters, but it's important to remember that\
    \ if you make your security systems\nto too unfriendly, you'll legitimate users\
    \ off.\n\nHere, we'll add to the AccountMaintenance class some further methods\
    \ that can\ngenerate passwords, and subsequently modify the password in the database.\n\
    I've used a list of 1370 words, stored in a text file, to build the memorable\
    \ pass-\nwords. Be aware if anyone knows the list of words you're using, cracking\
    \ the\new password will be significantly easier, so you should create your own\
    \ list. First,\nlet's look at the new methods:\n\n```\n/**\n * Given a username\
    \ / email combination, resets the password\n * for that user and returns the new\
    \ password.\n * @param string login name\n * @param string email address\n * @return\
    \ array of user details or FALSE if failed\n * @access public\n */\nfunction resetPassword($login,\
    \ $email) {\n  $login = mysql_escape_string($login);\n  $email = mysql_escape_string($email);\n\
    \  $sql = \"SELECT USER_TABLE_ID, \n          USER_TABLE_LOGIN, \\n          USER_TABLE_FIRST,\
    \ USER_TABLE_LAST \\n          FROM USER_TABLE \\n          WHERE USER_TABLE_LOGIN\
    \ = '\\$login\\' \\n          AND USER_TABLE_EMAIL = '\\$email\\'\";\n  $result\
    \ = $this->db->query($sql);\n  if ($result->size() == 1) {\n    $row = $result->fetch();\n\
    \    if ($password = $this->generatePassword()) {\n      $sql = \"UPDATE USER_TABLE\
    \ \n             SET\",\n    }\n  }\n```"
