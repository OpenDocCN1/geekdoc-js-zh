  md: '# Chapter 3: Alternative Content Types


    With the layering in this application, we were able to take the data delivered
    from the application logic tier and render both HTML and PDF at the presentation
    logic tier. For a more detailed discussion of layering and N-Tier applications,
    see Chapter 6.


    An alternative, and potentially more powerful approach to that presented here
    would be to use XSL Formatting Objects[9] (XSL-FO), an XML standard designed to
    provide page-based formatting for XML documents. By using XMLHTMLSax to convert
    the stored HTML into XML-FO formatting instructions, you could use an XSL-FO processor,
    such as the Apache FOP[10] (Formatting Objects Processor), to render it directly
    to PDF format. You could even get away with an open source project that converts
    XML to XSL-FO, HTML2FO[11], which is written in C++ and is available for most
    platforms. To use Apache FOP in PHP, you can look to PEAR::XML_fopdf[12]. This
    does, however, require use of the PHP extension as well as the Java SDK, which
    offers hosts.


    # How do we render SVG with PHP?


    Scalable Vector Graphics[13] (SVG) is a W3C standard for describing graphics.
    As a technology, it represents an alternative to animated GIFs or Flash Movies.
    Being XML, it is more easily rendered with PHP than binary formats such as Flash.
    To display your SVG creations, a visitor needs a browser plug-in, which today
    means the Adobe SVG Viewer[14]. Adobe is one of the main providers of SVG. Mozilla
    browsers will also have SVG support built right in[15] relatively soon, and the
    Apache Group provides a Java-based SVG viewer known as Batik[16].


    It''s beyond the scope of this book to look at the SVG format in detail, but you''ll
    find an excellent resource listed under the section called “Further Reading” at
    the end of this chapter. A worthwhile, free, tool for drawing simple SVG images
    is Dia[17].


