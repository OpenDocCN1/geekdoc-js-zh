  md: "# Chapter 2: XML\n\n+   * Handles closing tags\n* @param resource instance\
    \ of PHP SAX XML\n* @param string element name\n* @return void\n* @access private\n\
    */\n\n```\nfunction close($sas, $element) {\n    if ($element == 'ITEM') {\n \
    \       $element = new stdClass();\n        $element->title = $this->title;\n\
    \        $element->link = $this->link;\n        $element->description = $this->description;\n\
    \        $this->items[] = $element;\n    }\n\n    $this->title = '';\n    $this->description\
    \ = '';\n    $this->link = '';\n    $this->newItem = false;\n}\n```\n\nThe method\
    \ has a bit of a twist. Instead of dropping a chunk of HTML code into a global\
    \ variable, it creates a new object to represent each item as it is processed.\
    \ The built-in stdClass is used to create an object with no properties or methods;\
    \ then, the title, link, and description properties are added. The objects are\
    \ then dropped into an array for later retrieval with the fetch method.\n\nWith\
