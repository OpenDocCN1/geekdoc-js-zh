    \ become important in the next solution.\n\n# How do I track who is online?\n\n\
    You may have seen applications such as vBulletin and phpBB, which lets visitors\
    \ see many users are online (and sometimes, which users are online) at a given\
    \ moment. Now that we have an authentication system, and a custom session handler\
    \ handles those sessions in MySQL, implementing “Who is Online?” functionality\
    \ is a breeze (well, almost)!\n\nThe first thing we need (is you guessed!) a class\
    \ that we can use to read and interpret stored session data from MySQL.\n\nThe\
    \ constructor for the class simply initializes an array. This is used as a “first\
    \ in out” (FIFO) queue to which raw session data is added, and from which objects\
    \ are returned along with properties that correspond to the variables in a given\
    \ session.\n\n```\n/**\n* Session Analyzer\n* separate serialized session data\
    \ (as it appears on the file\n* system or in a database) and builds objects into\
    \ which it\n* places the data stored in the session\n* <html>\n* $sa = new SessionAnalyzer();\n\
    * $sa->addSession($some_serialized_session_data);\n* $sessionStore = $sa->fetch();\n\
    * \n* @package SPLIB\n* @access public\n */\nclass SessionAnalyzer {\n/**\n* A\
    \ list of sessions, their data held in SessionStore objects\n* @var array\n */\n\
    var $sessions;\n```"
