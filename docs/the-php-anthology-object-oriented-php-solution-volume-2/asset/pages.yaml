  md: '# How do I transform XML with PHP?


    XPath can be an extremely powerful tool. For example, XPath makes it possible
    to base a dynamic, hierarchical menu system (such as that is covered in Volume
    I, Chapter 9) on an XML configuration file, rather than a database table.


    # How do I transform XML with PHP?


    Another offset of the XML specification is Extensible Stylesheet Language Transformations[37]
    (XSLT), a standard that lets you transform XML documents...Into what? you ask.
    transforming one XML document type into another—such as XHTML—is the most common
    application, but with XSLT you can output any text-based file you can turn into.


    XSLT can be useful for solving sorts of problems. You can generate PHP code on
    the fly from an XML configuration file. You can generate different formats—HTML
    and Wireless Markup Language (WML), for instance from a single XML source. The
    possibilities are endless!


    In this solution, I''ll assume that you have some experience with XSLT, so I''ll
    concentrate on the PHP code. If your knowledge of XSLT is lacking, the section
    called "Further Reading" has reference suggestions.


    Using the XSLT extension[38] is similar in some ways to using PHP''s SAX XML functionality.
    Let''s look at an example based on the articles.xml document we saw in the last
    solution. First, we have an XSL document:


    ```

    <xml version="1.0" encoding="iso-8859-1"?>

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    xmlns:spt="http://www.sitepoint.com/"

    -exclude-result-prefixes="spt">

    ```


    File: articles.xsl (excerpt)


    In declaring the root element of the sheets, we''ve specified the SitePoint namespace
    used in articles.xml, and used the exclude-result-prefixes attribute to specify
    that the namespace prefix should not be added to the transformed elements.


    Next, we use a template to match each article element that has a public element
    containing the value 1, and display it. The articles are placed into HTML table


    +   [37] http://www.w3.org/TR/xslt

    [38] http://www.php.net/xslt'
