  md: "# Chapter 1: Access Control\n\n```\n* SessionAnalyzer constructor\n * @param\
    \ object instance of database connection\n * @access public\n */\nfunction SessionAnalyzer()\
    \ {\n    $this->sessions = array();\n}\n```\n\nThe addSession method is used to\
    \ put raw session data in the queue. It calls the privateSession method, which\
    \ is where the analysis of the raw session data actually occurs. The fetchSessions\
    \ method allows us to get objects from the queue, the properties of the object\
    \ being stored in the raw session data. Note that the objects returned are not\
    \ related to the Session class we worked earlier with this chapter. They are simply\
    \ data containers—objects of class SessionStore (below)—and have no methods.\n\
    \nFile: Session/SessionAnalyzer.php (in SPLIB) (excerpt)\n\n```\n/**\n * Gathers\
    \ the sessions into a local array for analysis\n * @param string raw serialized\
    \ session data to parse\n * @return void\n * @access public\n */\nfunction addSession($rawData)\
    \ {\n    $this->sessions[] = $this->parseSession($rawData);\n}\n/**\n * Iteraters\
    \ over the SessionStore array\n * @return SessionStore\n * @access public\n */\n\
    function fetch() {\n    $session = each($this->sessions);\n    if ($session) {\n\
    \        return $session['value'];\n    } else {\n        reset($this->sessions);\n\
    \        return FALSE;\n    }\n}\n```"
