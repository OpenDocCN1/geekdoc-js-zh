  md: '# Chapter 1: Access Control


    This means, for example, that for logged-in users to change their accounts'' passwords,
    they should be asked to provide their old passwords—obviously, hijackers won''t
    know these. Also, be careful with the personal information you make available
    to users (such as credit card details), and if you give users the opportunity
    to make significant changes to their accounts, for instance, changing a shipping
    address, be sure to send a summary notification to their email address (this will
    alert users whose sessions have been hijacked).


    To keep the session completely hidden, you''ll need to use SSL to encrypt the
    conversation. What''s more, you should only use the cookie method of passing the
    session ID. If you pass it in the URL, you may give away the session ID upon visiting
    another site, thanks to the referrer header in the HTTP request.


    The files PHP creates for the purpose of storing session information are, by default,
    stored in the temporary directory of the operating system when PHP is running.
    On Unix systems such as Linux, this will mean that other users on the server can
    read the files'' contents. They may not be able to identify which virtual host
    and PHP script are the owners of the session but, depending on the information
    you place there, they may be able to guess.


    This is a serious cause for concern on shared PHP systems; the most effective
    solution is to store your sessions in a database, rather than the server''s temporary
    directory. In this chapter, but a partial solution is to set the session.save_path
    option to a directory that''s not available to the public. You''ll need to contact
    your hosting company in order to have set the correct permissions for that directory,
    so that the ''nobody'' or ''www'' user with PHP runs has access to read, and write
    files in directory.


    # Session IDs and Cross-Site Scripting


    ![](img/64ba37119ee04e7b8d236c1d7b0d0734_28_0.png)


    One final warning: using a common Web security exploit, cross-site scripting (XSS),
    it''s possible for an attacker to attack JavaScript on your site that will cause
    visitors to give their session ID to a remote Website, allowing their sessions
    to be hijacked. If you allow your visitors to post any HTML make sure you check
    and validate it very carefully (see Appendix C for more on XSS and Volume I, Chapter
    5 for an HTML filtering mechanism).


    Remember the golden rules: never rely on client side technologies (such as JavaScript)
    to handle security and never trust anything you get from a browser.'
