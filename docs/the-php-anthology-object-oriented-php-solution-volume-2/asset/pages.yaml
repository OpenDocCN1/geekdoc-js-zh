  md: "# Chapter 2: XML\n\nrows. A second template catches all other (i.e. unpublished)\
    \ articles and suppresses them.\n\nNote that implementing within the stylesheet\
    \ is probably a bad idea, the logic that controls which articles are and not displayed\
