    The rest happens automatically!\n\n# # The Adapter Pattern\n\nOne of PHP's greatest\
    \ advantages as a language for building Web-based applications is the size and\
    \ strength of its community—in particular, the wealth of open source code available\
    \ as examples, and for use in your own projects. Developers simply need to head\
