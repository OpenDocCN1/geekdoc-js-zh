  md: '# Chapter 5: Caching


    fileLocking


    This is used to switch the file locking mechanisms on or off. The default is TRUE
    (enabled).


    writeControl


    This checks that a cache file has been written correctly immediately after it
    has been created, and throws a PEAR:Error if it finds a problem. Obviously, this
    would allow your code to attempt to rewrite a cache file that was created incorrectly,
    but comes at a cost in terms of performance. The default is TRUE (enabled).


    readControl


    This checks cache files that are being read for corruption. Cache_Lite is able
    to place inside the file value, such as the string length of the file, which can
    be used to confirm that the cache file isn''t corrupted. There are three alternative
    mechanisms for checking that a file is valid, and they are specified using the
    readControlType option. These mechanisms come at the cost of performance, but
    should help guarantee your visitors are not seeing scrambled pages. The default
    is TRUE (enabled).


    readControlType


    This specifies the type of read control mechanism to use. The available mechanisms
    are a cyclic redundancy check (''crc32'', the default value) using PHP''s MD5
    hash using PHP''s md5 function (''md5''), or a simple and fast string length check
    (''strlen''). Note that this mechanism is not intended to provide security against
    tampering with your cache files; it''s just a way to spot corrupt files.


    pearErrorMode


    This tells Cache_Lite how it should return PEAR errors to the calling script.
    The default is CACHE_L_RETURN, which means Cache_Lite will return a PEAR:Error
    object


    memoryCaching


    With memory caching, every time a file is written to the cache, it is stored in
    an array in Cache_Lite. The saveMemoryCachingState and getMemoryCachingState methods
    can be used to store and access the memory cache data between requests. The advantage
    of this is that the complete set of cache files can be stored in a single file,
    reducing the number'
  merge: -1
