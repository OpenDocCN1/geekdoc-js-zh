    We test each of the functions with fifty function calls, iterating over the $Colors
    array using PHP''s each function. The report generated by Xdebug should look like
    Figure 6.1, of course, the absolute times will depend on the speed of your server.


    # Figure 6.1. Most Probably Faster


    | Time Taken | Number of Calls | Name | Location |

    |---|---|---|--|

    | 0.001927025 | 50 | *isBlueslow() | c:/docs/phprecipes/developmenttechnique\1.php:32
    |

    | 0.0008553267 | 50 | *isBlueFast() | c:/docs/phprecipes/developmenttechnique\1.php:43
    |


    As you can see, when tested over fifty iterations, isBlue turned out to take almost
    as long as isBlueFast. Of course, in a real application, the results would be
    unpredictable; it could be on a particular run all the values were ''blue'', which
    would make isBlue slower. By designing the code to reflect the most probable input,
    you can improve the overall performance of the application on average.


    Note that when we called xdebug_dump_function_profile, we passed the constant
    XDEBUG_PROFILE_NC, which tells Xdebug to merge all function calls from the same
    line into a single entry in the output. There are a number of different profiling
    modes Xdebug provide give you different ''views'' of what''s actually happening
    in your PHP script. These modes range from a list of slowest function calls in
    execution time, to averages for each function. See the XDebug documentation for
    further details.


    Although this example may seem trivial, it''s common for applications to have
    many such “probable conditions"; by weighing all code to the most probable outcome,
    the effect for a large application can be a significant increase in performance.


