  md: '# How do I read API documentation?


    If we want to access an alterative data source, such as PostgreSQL, all we should
    need to do is write a PostgreSQL class with the same API as the MySQL class, then
    modify the require_once statement to include the correct file, and modify the
    class name when we instantiate it.


    The same applies to the presentation logic layer. The classes ArticlesView and
    ArticleView are currently geared to rendering HTML. If we write with the same
    API two classes that render WML instead of HTML, again, all we need to do is modify
    the included file names and the names of the classes we instantiate so that it''s
    easy to exchange one presentation logic layer for another. Also, we''re able to
    use the underlying Articles and Article classes, originally created to render
    PDF documents; the presentation logic was very different here, but there was no
    need to reproduce the database queries, thanks to these reusable classes.


    So, where the presentation logic, in particular, is concerned, the benefit of
    using an N-tier approach to application design is clear. With some care, we can
    render all sorts of content types, such as PDF, XHTML, XML, and so on, simply
    by "slotting" in the correct API. Achieving the same result with the correct example,
    with which we would begin potentially involve writing a completely new version,
    reproducing the data access and application logic layers, would probably result
    in many files containing more or less the same code. The moment we modify a column
    name in the table, for example, we have to modify all the files that access the
    table, whereas with our abstracted, N-tier version, we''d only need to change
    one or perhaps two files, making only minor modifications.


    # How do I read API documentation?


    API documentation is a nicely formatted reference to a set of classes, which a
    program has automatically generated based on the source code of these classes.


    If you''re ready to read the excellent PHP manual with its detailed function descriptions,
    understanding API documentation can be confusing—especially if your OOP skills
    are uncertain. Once you grasp the concept, however, reading this documentation
    can help make object oriented programming more accessible to you, and can open
    you up to the wealth of freely available open source PHP classes found in various
    online repositories. No longer will you need to crawl through the source, scratching
    your head...


    The first thing to understand is how API documentation is generated. When writing
    classes, most developers place comments in the code. One of the many tools that
    generates PHP documentation then uses these comments to build the'
