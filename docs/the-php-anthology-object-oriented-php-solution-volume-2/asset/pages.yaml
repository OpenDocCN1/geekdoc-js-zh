  md: '# Mock Objects


    One area of Unit Testing that you may be wondering about is dealing with situations
    where one class uses another. What about classes that make use of data from an
    external source, such as a database? Will surely require you to execute the tests
    in an environment where there''s a database with some sample data we can use,
    right? Well, not necessarily! In fact, one of Unit Testing is that you should
    only test the particular unit in question—not other classes at the same time.
    In particular, the tests should be isolated, as much as possible, from external
    environments like databases. Otherwise, these external environments will reduce
    the scope of the test to a specific case. Testing against databases and other
    external data sources is more part of the integration tests that happen as the
    next step in the test lifecycle.


    To solve this problem, the answer is to use mock objects. Mock objects are objects
    that simulate the behavior of a real object. From the perspective of the API,
    they would be indistinguishable from the real thing as any other objects using
    the mock are concerned. Using mock objects with our test scripts, we can even
    do things like set up data for the mock to return when a particular method is
    called.


    Let''s say, for example, that we have a class designed to fetch articles from
    our database; the class others do the work of connecting to the database and fetching
    the result, as you''ve seen in Volume I, Chapter 3 with the MySQL and MySQLResult
    classes. Let''s imagine we want to test the class created in Chapter 3 without
    making any real database connections. To do so, we''d create mock objects for
    the MySQL and MySQLResult classes, which we then give to the Articles class connecting
    in the same way as the real database objects. The mock objects simulate connecting
    and fetching data from the database without actually doing so. They have exactly
    the same API as the real thing, so the articles class has no idea it''s not getting
    real data back. We can then create tests that focus purely on the Articles class,
    which is now independent of any other class which it would normally rely.


    Mock objects are extremely important for Unit Testing, as they allow you to break
    the dependencies between classes so you can test one object at a time. Without
    mock objects, things can get pretty convoluted. For a fairly complex application,
    the class you''re testing may depend on another class, which, in turn, depends
    on another class, and so on. You''ll be uncertain if you''ve found a bug that''s
    really part of the class you''re testing, or is caused by one of the other units
    on which the class directly or indirectly relies.'
