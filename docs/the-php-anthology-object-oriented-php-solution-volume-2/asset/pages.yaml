    </tr>\n  <td colspan=\"2\">\n    <xsl:value-of select=\"spt:body\" />\n  </td>\n\
    </tr>\n</xsl:template>\n<!-- Match and hide unpublished articles -->\n<xsl:template\
    \ match=\"spt:article\" />\n</xsl:stylesheet>\n```\n\nOK, let us use PHP to perform\
