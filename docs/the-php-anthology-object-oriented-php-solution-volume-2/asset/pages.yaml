    documentation should provide all the information you need to use a class—there’s
    no to worry about what’s happening “behind the scenes” in the source code itself.


    This development experience is much the same as most people’s use of the built-in
    PHP functions; when was the last time you looked at the C source code of the PHP
    function you called? If the code is adequately designed, there’s no need to look
    under the hood.


    The difficult part of dealing with class API documentation is that, if you’re
    uncertain of OOP in PHP, it may feel more confused than enlightened. API documentation
    does assume a general knowledge of the use of classes and objects (so make sure
    you read Volume I, Chapter 2), but you don’t need to be an OOP guru to benefit
    from a class someone has written.


    Once you''ve grasped the basics of OOP, the next step is to understand how classes
    are normally depicted in API documentation. In Figure 6.4 above, for example,
    notice the lines connecting the DoesSomething to the Something class. This represents
    the fact that DoesSomething extends Something (i.e. it’s a subclass of Something).


    Also, the API documentation describes classes similarly to the way functions are
    explained in the PHP manual. The getString method in DoesSomething class would
    be described with a signature like this:


    ```

    string getString(boolean $specialChars = false)

    ```


    The word "string" identifies the type of data that the method returns. The information
    inside the parentheses tells us we can pass a Boolean value (TRUE or FALSE) as
    an argument to this method, but that the argument has a default value of FALSE.


    # Private, Protected and Public


    In programming languages like Java and C++, it’s common to define some methods
    and member variables as private (where Java is concerned). This tells a compiler
    that any code that accesses instances of the class is not allowed to use these
    methods or variables directly. Attempts to do so will generally generate some
    kind of error at compile time. It enforces the notion of encapsulation that’s
    advocated by the object oriented'
