    \ version (1.1) the available options are:\n\n+   * cacheDir: The directory in\
    \ which the cache files will be placed. This defaults to the current script execution\
    \ directory.\n\n+   * caching: This option switches on or off the caching behavior\
    \ of Cache_Lite. If you have numerous Cache_Lite calls in your code and want to\
    \ disable the cache for debugging, for example, this will be important. The default\
    \ value is TRUE (caching enabled).\n\n+   * lifetime: This represents the default\
    \ lifetime (in seconds) of cache files. It can be changed using the setLifetime\
    \ method. The default value is 3600 (one hour).\n\n+   * fileNameProtection: With\
    \ this option activated, Cache_Lite uses an MD5 encryption hash to generate the\
    \ filename for the cache file. This protects you from error when you try to use\
    \ IDs or group names containing characters that aren't valid for filenames; it\
    \ must be turned on you use Cache_Lite_Function. The default is TRUE (enabled)."
