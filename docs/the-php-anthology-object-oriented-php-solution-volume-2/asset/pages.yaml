  md: '# Chapter 2: XML


    Why would we bother with XML-RPC or SOAP around? The answer is a combination of
    preference and practicality. XML-RPC is a lightweight protocol for data exchange,
    which is very easy to understand and well-supported in many languages. It''s great
    for intranet applications and data exchange on the Internet where you''ll be collaborating
    with a small group of like-minded developers. SOAP has a much more complicated
    specification and, as a result, it is more difficult to support correctly and
    reliably. Today, few if any of the SOAP implementations, including commercial
    offerings from the likes of Microsoft and IBM, support all of SOAP to 100% perfection.
    Part of the problem is its reliance on XML Schema[41], which most XML toolkits
    are still struggling to catch up with. Having said, that SOAP has the advantage
    that it comes with supporting technologies as Web Services Description Language[42]
    (WSDL). These make it possible to build SOAP Web services that can be consumed
    by the many, rather than fully. If you''re planning something “big,” such as the
    delivery of commercial Web services, SOAP is probably the right choice for you.


    To implement an XML-RPC based Web service for your site, it''s generally a good
    idea to take advantage of the many PHP XML-RPC libraries available. There''s an
    XML-RPC extension to PHP, although it''s not easy to find a hosting company that''s
    enlightened enough to install it. Here, we''ll be taking advantage of Simon Willow''s
    Incutio XML-RPC library[43], currently at version 1.6. It provides arguably the
    best basis, from the point of code design, for building your own XML-RPC clients
    and servers. The code is well documented and numerous examples are provided to
    make its usage clear. Simon is currently working on a separate HttpClient class,
    which would significantly improve the functionality of the XML-RPC client in the
    near future.


    # The Server


    In this example, we will build an XML-RPC server that provides the contents of
    the MySQL articles we used in Volume I, Chapter 3.


    First of all, we need a class to fetch data from the articles and turn it into
    XML-RPC responses.


    The ArticleServer class extends the IXR_Server class provided by the Incutio library,
    which means that the methods in IXR_Server are also available in the ArticleServer
    class. We can pass the ArticleServer instance of the MySQL


    +   [41] http://www.w3.org/XML/Schema

    [42] http://www.w3.org/TR/wsdl

    [43] http://scripts.incutio.com/xmlrpc/'
