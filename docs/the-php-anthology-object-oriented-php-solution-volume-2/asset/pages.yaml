  md: "# Most Probable First\n\n![](img/64ba37119ee04e7b8d236c1d7b0d0734_289_0.png)\n\
    \nThe Performance Cost of OOP\n\nSome people writing PHP applications will still\
    \ rail against the idea of using classes and objects to build applications. They're\
    \ opposed to this philosophy because of the cost in performance entails, and yes,\
    \ it's true—using an object oriented approach to solve a problem will be a little\
    \ slower than the equivalent procedural code. It is important to remember about\
    \ OOP is that it improves your performance as a developer; if you have infinite\
    \ time to waste, lucky you! For the rest of us, the object oriented paradigm outstrips\
    \ procedural coding in terms of reduced development times\n\n# Most Probable First\n\
    \nA core aspect of any PHP application will typically be some sort of control,\
    \ such as an if-else statement. Often, these are written in a manner that suits\
    \ the way humans think, but this may not produce the most effective code in terms\
    \ of speed and performance. By placing the most probable condition first, you\
    \ can help PHP complete an if-else statement faster.\n\nFor example, let's say\
    \ we have a function, isBlue which checks to see if a variable passed to it has\
    \ the value 'blue'. If, most of the time, the value is given the function 'red',\
    \ rather than 'blue', it would be better to react to that condition first.\n\n\
    The following example serves as a test to prove this:\n\n```\n<?php\n// Check\
    \ Xdebug is installed\nif (!extension_loaded('xdebug')) {\n    die(<a href=\"\
    http://xdebug.derrickethans.nl/\">Xdebug</a> . 'required');\n}\n\n// Start Xdebug\
    \ profiling\nxdebug_start_profiling();\n\n// A array of colors \"weighted\" to\
    \ red\n$colors = array('red', 'red', 'red', 'red', 'red', 'red', 'red', 'blue');\n\
    \n// The slow way\nfunction isBlueSlow($color) \n{\n```\n\n271"
