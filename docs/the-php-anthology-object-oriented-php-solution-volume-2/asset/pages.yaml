    http://www.php.net/\">PHP</a> and\n  <a href=\"http://www.mysql.com/\">MySQL</a>,\
    \ I focus on getting beginners comfortable with typing SQL queries on the command\
    \ line.</p>\n  </body>\n  <spt:author>KevinY</spt:author>\n  <spt:published>101355800</spt:published>\n\
    \  <spt:public>1</spt:public>\n</spt:article>\n<spt:article>\n ...\n</spt:article>\n\
    ```\n\nThe document is not unlike a database query result set. Using XPath, we\
