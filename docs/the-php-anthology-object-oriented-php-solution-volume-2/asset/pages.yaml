    <p align="right"><small><a href="#index">Back</a></small></p>

    Here are some things to buy...

    </card>

    </wml>

    ```


    WML is designed to limit the number of requests a browser has to make, which reflects
    the fact that mobile networks are not high speed, and makes using WMLbased sites
    friendly to the thumb. Hence, a WML document is made up of cards, which are separate
    pages loaded at the same time. The above examples give you a feel for the markup,
    which is very similar to HTML for the most part, though be warned—WML must conform
    to the rules of well formed WML (e.g. tags must be closed).


    “Internal” links can be made between cards using #id_name, which points at the
    id attribute of another card. Links to other WML documents are handled in the
    same way as an HTML link, and there''s even support for forms. An online reference
    is suggested at the end of this chapter.


    Figure 3.7 shows what the front page of our simple example looks like in Opera.'
