    \n```\n<?php\n// Class for building a table using an iterator\nclass HTMLTable\
    \ {\n    var $Collection;\n    var $idPre;\n    var $table;\n    function HTMLTable(&$collection,\
    \ $idPre = '') {\n        $this->collection = &&$collection;\n        $this->idPre\
    \ = $idPre;\n        $this->table = `<table id=\"*\" $idPre . \"Table\">\";\n\
    \    }\n```\n\nThe constructor for the table takes two arguments; first is a collection,\
    \ which can be any object you want—a database query result, an array iterator,\
    \ or a class for reading from a file—as it conforms to the iterator API that HTMLElement\
    \ expects below). The other argument is a prefix for HTML attributes, which helps\
    \ me identify the table elements for formatting through my CSS code.\n\nThe addheadings\
    \ method takes either a string or one dimensional array and uses it to build the\
    \ headers for the columns.\n\n```\nfunction addHeadings($headings) {\n    $this->table\
    \ .= `<tr id=\"*\" $this->idPre\n        \"HeaderRow\">\n\";\n    if (is_array($headings))\
