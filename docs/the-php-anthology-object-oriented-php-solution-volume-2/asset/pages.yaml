  md: '# How do I render WML with PHP?


    Most work editing SVG documents is likely to be done with tools like Adobe''s
    Illustrator or GoLive, but as SVG is, in the end, just, there''s no reason you
    shouldn''t render a complete SVG using PHP. A solid basis for getting started
    is Charlie Killian''s SVG classes[20], which were described in some detail in
    Wix''s Professional PHP 4. The book has a full chapter on SVG, so if you''re interested,
    grab a copy while they can still be found.


    # How do I render WML with PHP?


    Wireless Markup Language (WML) is an XML format designed to allow held devices
    to access content on the Web using Wireless Application Protocol (WAP). As the
    first generations of WAP devices used LCD displays and are usually grayscale,
    developing WML based sites may not seem too exciting but the potential for people
    on the team to go together a WML-based site makes it an interesting technology.


    The first problem to overcome when trying to develop WML-based sites is finding
    a browser that displays WML. Obviously, your mobile network provider would love
    you to the testing with your own phone, but that''s a fast track to a large bill.
    Frankly, Opera (ideal version 7+) comes ripe with WML support and is perfect for
    designing a WML-based site. Not too far behind Mozilla with a WML browser[21]
    that''s currently a work in progress, but should be fairly handy in the not too
    distant future, thanks to the evolving of XUL applications (see the next solution).


    With that solved, it''s time to build a WML page with a little help from PHP:


    File: index.php


    ```

    <?php

    echo ''Content-type: text/vnd.wap.wml'';

    echo ''<?xml version="1.0"?>'';

    <!DOCTYPE WML PUBLIC "-WAPFORUM//DTD WML 1.1//EN"

    "http://www.wapforum.org/DTD/wml_1.1.xml">

    <wml>

    <card id="index" title="PHP and WAP in Action" newcontext="true">

    <big>Menu:</big><br>

    <a href="#news">News</a><br>

    <a href="#products">Products</a><br>

    </wml?>

    ```


    [20] http://www.phpclasses.org/browse.html/package/457.html

    [21] http://wmlbrowser.mozdev.org/


    205'
