  md: '# 7 Design Patterns


    With a grasp of object oriented programming under your belt, thanks to Volume
    I, Chapter 2, I''ll bet you''re wide-eyed and wondering what to do with all this
    great new stuff that''s supposed to help you write well-designed maintainable,
    well-designed PHP applications, right? This is a common problem for developers
    coming to grips with the object oriented paradigm. It takes a long time to do
    anything useful with OOP, many of their early attempts being no more than long
    sections of procedural code wrapped in a few class methods.


    Thankfully, object oriented programming has been around for quite some time and
    is supported by many languages; overcoming such problems is well-trodden territory.
    More importantly, our OOP ancestors were kind enough to put together a catalog
    of best practices, known as design patterns, which worked over and again, and
    could be readily applied to solving problems in a uniform manner. The landmark
    publication was the book, Design Patterns (Addison-Wesley, ISBN: 0-201-63361-2)
    by the “Gang of Four” (Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides),
    which have become a modern classic in IT literature—indeed, such a thing is possible.
    Search Amazon for “Design Patterns,” and you can''t miss it. While you''re browsing
    Amazon, it''s also worth looking at Martin Fowler''s Patterns of Enterprise Application
    Architecture (Addison-Wesley, ISBN: 0-321-12742-0), which provides further patterns,
    many of which relate directly to the problems developers encounter when building
    Web-based applications.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'My own opinion of design patterns is that they provide a shortcut to discovering
    the way you''d probably end up solving a particular problem, provided you had
    enough time to experiment with all the possible ways you might structure your
    code. In other words, they''re down-to-earth descriptions of how a group of programmers
    found could best solve the problems they faced.


    Talking about what design patterns are something I generally prefer to avoid.
    It''s like trying to explain the concept of snow to someone grew up in the Sahara;
    unless you''ve seen it before, it''s not going to make sense. Reading the solutions
    in this chapter, which look at specific examples using real code, is, in my opinion,
    a better way to grasp the concepts.


    But, to give you a rough idea of where this chapter is headed, consider this:
    in your Web building experience, have you ever had a feeling of déjà vu? Have
    you ever said to yourself, ''I''ve done before,'' or ''I''m sure I saw a good
    solution to this problem. Now, where was it?


    What the Gang of Four did with Design Patterns identified three common patterns
    that developers feel déjà vu, providing guidelines for how we could best solve
    each. It has shown that the Gang of Four (GoF) got it; use of these typically
    helps developers write applications that are easy to maintain, yet are are able
    to cope with the special cases that occur in the real world. The adage "design
    is design," often quoted these days in discussions of the visual design of Websites,
    can also be applied to object programming, thanks to design patterns. If you can
    learn to spot the problem in the first place, the solution is just a matter of
    identifying and applying the right pattern.


    A welcome side-effect of studying design patterns is they often help people learn
    to get the most out of the object oriented paradigm. In reading this chapter,
    you may find that object oriented PHP becomes much richer, rather than feeling
    overwhelmed by a whole load of new syntax that you have no idea what to do.


    The GoF laid out a catalog of twenty three patterns, we''ll only cover the five
    that I''ve found to be useful or useful in PHP 4, giving you a taste of what design
    patterns are. A more in depth analysis of object oriented programming is beyond
    the scope of this book. This is not to say that other patterns cannot be effectively
    applied in PHP, but I have included the patterns here to be easily applied to
    any PHP application, and do not suggest some of framework that affects the structure
    of your application.


    > The Model-View-Controller (MVC) pattern, the Command Pattern and the Template
    Method, to name a few.'
