    While this is a big plus for PHP, it comes with a downside. Companies such as\
    \ Sun and Microsoft are able to put together cohesive of classes that integrate\
    \ well, the whole being much greater than the sum of the parts. As it's not backed\
    \ by any large software house, PHP lacks a library of components that compare\
    \ with the likes of the Java or .NET class libraries. Many of freely available\
    \ PHP code was designed by developers working in a vacuum; a class may have been\
    \ designed to work either alone or as part of a small library of classes that\
    \ a particular developer uses. As such, attempting to slot someone else's class\
    \ into your application may well highlight its incompatibility with your existing\
    \ design.\n\n> [3] http://www.phpclasses.org/\n\n342"
