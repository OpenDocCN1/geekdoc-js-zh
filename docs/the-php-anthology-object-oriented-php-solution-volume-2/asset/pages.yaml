    Here, we are basically performing a "round trip" with an instance of StampCollection.
    We create a MockStamp object, using the add method to add it to the StampCollection;
    then, we get a copy back with the fetch method. Finally, we use the assertEqualsSimpleTest
    to compare the values of the MockStamp and the copy we retrieved from StampCollection.
    What happens? Take a look at Figure 6.9.


    # 6.9. Forgery Doesn''t Pay


    # StampCollection


    Fail: testadd->Equal assertion [NULL] fails with [String: Penny Black] by type


    > 1/1 test cases complete 0 passes and 1 fails


    How could such a simple operation have gone wrong? Time to take a close look at
    our StampCollection class. Here''s the problem, in the add method:


    ```

    function add($Stamp)

    {

    $this->collection[] = $stamp;

    }

    ```


    It looks like we''ve mistakenly used the string operator (.= to add the stamp
    to the end of the array. We should have used the assignment operator (=) instead!
    This is a case where a serious logic bug slips through the cracks of PHP''s error
    checking without so much as a warning message, but thanks to SimpleTest, the bug
    could be found and fixed. What''s more, we now have test scripts in place


