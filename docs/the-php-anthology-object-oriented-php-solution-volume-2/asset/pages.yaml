  md: "# Mock Objects\n\nBefore you groan about this meaning yet more work, SimpleTest\
    \ makes the creation of mock objects extremely easy—in fact, they're created automatically!\
    \ Let's turn back to ourStampCollection class, and I'll show you how this works.\
    \ StampCollection expects us to give Stamp objects via the add method. To break\
    \ the dependence of the StampCollection on the Stamp class, we need a mock object\
    \ for Stamp. To give you an idea of how this works, here's an example that uses\
    \ a hack to show you the mock object generated by SimpleTest:\n\nFile: 10.php\n\
    \n```\n<?php\nif (defined('SIMPLE_TEST')) {\n    // Modify this line to point\
    \ to your simplest installation\n    define('SIMPLE_TEST', '../simplestest/');\n\
    }\n\nrequire_once SIMPLE_TEST . 'unit_test.php';\nrequire_once SIMPLE_TEST . 'mock_objects.php';\n\
    require_once SIMPLE_TEST . 'reporter.php';\nrequire_once '8.php';\n\necho '<pre>';\n\
    // Don't try this at home. .createClassCode is private!\necho Mock::createClassCode('Stamp',\
    \ 'MockStamp');\necho '</pre>';\n?>\n```\n\nNote that, in this example, I called\
    \ a private method provided by SimpleTest, namely createClassCode. I can do this\
    \ because I'm a trained PHP stunt man demonstrating how mock objects work! In\
    \ other words, don't try this when writing your own tests—SimpleTest provides\
    \ a public API for creating mock objects we'll see in a moment.\n\nHere's the\
    \ code for the mock class, as will be displayed by the script:\n\n```\nclass MockStamp\
    \ extends SimpleMock {\n    function MockStamp($test, $wildcard = MOCK_WILDCARD)\
    \ {\n        $this->SimpleMock($test, $wildcard);\n        $args = func_get_args();\n\
    \        $this->mockMethod(\"Stamp\", $args);\n    }\n\n    function stamp(&$stamp)\
    \ {\n        $args = func_get_args();\n        return $this->mockMethod(\"stamp\"\
    , $args);\n    }\n}\n```\n\n307"
