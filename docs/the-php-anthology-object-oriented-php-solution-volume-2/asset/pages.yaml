  md: "+   1. Begin by defining the document margins; take note of the corresponding\
    \ X\nand Y coordinates defining the edges of the margins, bearing in mind the\n\
    paper size you're using.\n\n+   2. Create objects for any elements that will repeat\
    \ throughout the document.\nHeaders and footers will generally appear outside\
    \ the margins you've defined.\n\n+   3. If you plan to have a title page, it's\
    \ likely you won't want the headers and\nfooters to appear there. Make sure you\
    \ build the title page, and make\nallowances to start page numbering, for example,\
    \ afterwards.\n\n+   4. Add the page numbering first, then start building the\
    \ body of the document.\n\n# How do I convert HTML to PDF?\n\nBefore we can jump\
    \ into rendering PDF straight from the content in our database,\there's a problem\
    \ we have to overcome. The content we stored contains HTML\nmarkup that we can't\
    \ simply \"drop\" into a PDF document. At the same time,\nthe HTML is there for\
    \ a good reason; it provides useful formatting for the content,\npositioning text\
    \ and images information, so we can link to, and we don't want to\nlose this formatting,\
    \ so we can't strip it out; we need to\nto something to lay out the PDF document.\
    \ For the solution, we\ntoPEAR::XML_HTMLSax[7]. This is a SAX-like parser for\
    \ \"badly formed\" XML\nduments, which will allow us to strip the HTML out of\
    \ the content and at the\nsame take advantage of the formatting information. The\
    \ version\nused here was 2.0.2.\n\n# Parsing HTML with SAX?!\n\nHTML does not\
    \ obey the rules of HTML; by XML standards, most HTML code\nbadly formed. The\
    \ basic specification allows for tags that are not closed and\nattributes that\
    \ have no values. Worse still, Web browsers allow us to get away\n murder, using\
    \ the tag nesting and case sensitivity rules (e.g.\n<I><b>Text</b></B>). Attempt\
    \ to parse HTML with a normal XML parser, and\nit will pass you error messages\
    \ in disgust. In other words, the native SAX\nextension comes with PHP won't do.¹\n\
    \n> [7] http://pear.php.net/XML_HTMLSax\nThe good news is that newer incarnations\
    \ of DOM will be able to parse HTML, but right now that's\nither stable, nor widely\
    \ available on common Web hosts."
