  md: '# Chapter 3: Alternative Content Types


    the class from having to work directly with the R&OS PDF API. As well as making
    it much easier to generate documents to our design, this also helps us should
    we decide we want to switch to FPDF, or one of the native PHP extensions. We can
    use an adapter pattern to deal with the specifics of those libraries, while still
    conforming to the ArticlePDF class''s API, which means that any code using ArticlePDF
    shouldn''t require modification.


    Note in the case of R&OS PDF, the author provides a special markup for constructing
    links which is so tempting to ignore, the principle of building a library-independent
    API for generating PDF document does not quite hold true here. However, with some
    further effort you could, doubt, it may possible to switch libraries, should you
    need to, with minimal requirement for code modifications.


