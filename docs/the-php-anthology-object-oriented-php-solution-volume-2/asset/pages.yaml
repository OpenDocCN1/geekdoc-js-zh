    $host = ''localhost''; // Hostname of MySQL server

    $dbUser = ''harry''; // Username for MySQL

    $dbPass = ''secret''; // Password for user

    $dbName = ''sitepoint''; // Database name


    // (Modify this) Specify the root URL of the

    ```


    [22] http://www.hawhaw.dev/

    [23] http://www.hawhaw.dev/ref/php/

    ²''ve renamed the file from hawhaw.inc to hawhaw.php. Files that Apache doesn''t
    recognize as PHP have a nasty habit of being open to public viewing.'
