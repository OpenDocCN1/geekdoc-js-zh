  md: '# Chapter 4: Stats and Tracking


    application. In addition to basic logging functionality, some of the advanced
    features that phpOpenTracker offers are:


    +   - logging for multiple sites

    - reports are generated as images (with JpGraph[5])

    - click path analysis reports (requires Graphviz[6] to generate the click path
    diagrams)

    - automatic link generation (no need to modify your HTML)

    - tracking the number of users online at a given instant

    - incoming search phrases from search engines


    As it has a solid object oriented design, it''s possible to utilize phpOpenTracker
    in many ways without having to radically your site''s code. We will focus here
    on the basics of phpOpenTracker to get started; covering all the advanced features
    are beyond the scope of this book, but I hope you''ve already got the (accurate)
    impression that phpOpenTracker is a very mature package, and one of the best you
    could build your Web traffic around.


    # Installing phpOpenTracker


    The version of phpOpenTracker used here was 1.0.2.


    To install phpOpenTracker, you can use the PEAR package manager (see Appendix
    X), assuming you have the PEAR directory in your include path, will make phpOpenTracker
    available to any site on your server. You can also install phpOpenTracker manually
    without too much. The main script, phpOpenTracker.php, includes some further files,
    which it expects to reside, by default, in a directory named phpOpenTracker''s
    placed in some other directory in the include path (typically, the PEAR directory).
    You can get around this in code by defining the following constant:


    ```

    define(''POT_INCLUDE_PATH'', ''/home/username/lib/phpOpenTracker/'');

    ```


    [5] http://www.aditus.nu/jpggraph/

    [6] http://www.research.att.com/sw/tools/graphviz/


    228'
