  md: '}

    }


    Each observer provides an update method that''s called by the observable when
    the notifyObservers method is used. Within each update method, the observer decides
    what to do next based on the argument received from the observable. Note that
    the Subscribers class reacts only to the ''published'' argument, because we don''t
    want subscribers notified if an article is deleted. RSSFeed and Cache, however,
    respond to both the ''published'' and ''deleted'' states.


    To clarify, the UML class structure in this example is shown in Figure 7.6.


    # Figure 7.6. Article Observers


    | Observable |

    | -observers array |

    | +notifyObservers(in arg : mixed = NULL) : void |

    | #addObserver(in observer : Observer) : void |


    | Observer |

    | +update(in source : Observable, in arg : mixed) : void |


    | Cache |

    | +update(in source : Observable, in arg : mixed) : void |


    | Subscribers |

    | +update(in source : Observable, in arg : mixed) : void |


    | RSSFeed |

    | +update(in source : Observable, in arg : mixed) : void |


    | Article |

    | +publish() : void |

    | +delete() : void |


    With the classes ready, we instantiate them before adding all three observers
    to the observable object, $article:


