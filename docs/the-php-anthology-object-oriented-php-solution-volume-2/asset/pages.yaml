  md: "```\n/**\n* Add a list of words to generate passwords with\n* @param array\n\
    * @return void\n* @access public\n */\nfunction addWords($words) {\n    $this->words\
    \ = $words;\n}\n/**\n* Generates a random but memorable password\n* @return string\
    \ the password\n* @access private\n */\nfunction generatePassword() {\n    srand((microtime()\
    \ * 10000000);\n    $seperators = range(0,9);\n    $seperators[] = '-';\n    $count\
    \ = count($this->words);\n    if ($count == 0) {\n        return FALSE;\n    }\n\
