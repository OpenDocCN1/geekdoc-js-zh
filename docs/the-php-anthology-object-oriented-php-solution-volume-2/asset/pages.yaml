    only use yourself, but unsuitable for use in code you intend to distribute. Those
    unable to modify php.ini settings with .htaccess files will be unable to use such
    code. The list separator is the same as used for the include_path setting. |

    | auto_append_file (default: not set) | The twin of auto_prepend_file, executed
    after a requested script is executed. |

    | max_execution_time (default: 30) | Specifies the maximum execution time (in
    seconds) for which a PHP script run via a Web server may be allowed to execute.
    Generally, it is best to leave the default and use the set_time_limit function
    to extend the limit on a per-script basis. A value of 0 for either removes any
    limitations on script execution time. |

    | memory_limit (default: 8M) | The amount of memory PHP has available to it at
    runtime. Usually, the default is fine, but when handling large XML documents,
    for example, or dealing with images, you may need to increase it. The bigger this
    value, and the more memory a script actually uses, the less memory is available
    for other applications running on your server. |


