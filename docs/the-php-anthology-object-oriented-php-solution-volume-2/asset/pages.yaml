    $articles = file(''articles.xml'');

    $articles = implode('''', $articles);


    // Instantiate a DOM Document from the file

    $dom = domxml_open_mem($articles);


    // Fetch new XPathContext object

    $ctx = $dom->xpath_new_context();


    // Register the SitePoint namespace

    $ctx->xpath_register_ns(''sp'', ''http://www.sitepoint.com/'');


    // Fetch the titles with an XPath statement into an XPath object

    $titles = &$ctx->xpath_eval(''/sp:title/text()'');


    // Display the data structure

    echo ''<pre>'';

    print_r($titles);

    echo ''</pre>'';

    ?>

    ```


    First, we fetch the XML document and create a new instance of DOMDocument; as
    usual. Next we use xpath_new_context to create a new XPathContextObject; this
    initializes the XPath functionality to perform queries from the root of the document.
    We then have to register the namespace defined by the document, using the xpath_register_ns
    method. If we don''t, the XPathContext object will fail to recognize the prefix,
    and errors will result.


    Using the xpath_eval method, we can execute an XPath expression to fetch an XPathObject
    containing the data we need. Note that we''ve used the & operator to pass the
    nodes by reference so that, should we need to, we can manipulate them with the
    standard DOM methods and have changes reflected in the stored document structure.


    The XPath statement in this example is /sp:title/text(), which should get us the
    text inside every sp:title element in the document. Again, the detailed syntax
    of this expression is beyond the scope of this book, and resources are provided
    in the section called “Further Reading”.


    So that the format of the returned data is clear, we''ll simply print the array
    as, using print_r. Here are the results:'
