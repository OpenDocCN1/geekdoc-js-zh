    # # Room for Improvement


    The basic mechanics of the Auth class are solid, but it''s missing the more involved
    elements that will manage to halt the efforts of any serious intruders.


    It''s a good idea to implement a mechanism to keep an eye on the number of failed
    login attempts from a single client. If your application responds immediately
    to any login attempt, it will be possible for a potential intruder to make large
    numbers of requests in a very short time, trying different user name and password
    combinations. The solution is to build a mechanism that counts the number of failed
    attempts using a session variable. Every time the number of failures is divisible
    by three (i.e. three incorrect passwords are entered), PHP''s sleep function to
    delay the next attempt, by example, ten seconds. You may also decide that, after
    a certain threshold value (for example, fifteen failed attempts), you block all
    further access from that IP address for a given period (such as an hour). Of,
    changing an IP address is much easier than changing a phone number, but you will
    at least stauld be-intruders, and perhaps make their life difficult enough for
    them to go elsewhere.


    Another important ingredient for a good security system is an "event logging"
    mechanism that keeps track of suspicious activity. In Chapter 4, you''ll find
    the basic mechanics of logging visitor information, including how to track IP
    addresses,


    > ³Of course, you must also include the Auth.php file that contains the class
    definition with require_.'
