    # How do I consume SOAP Web services with PHP?


    In the previous solution, you learned to build and use XML-RPC Web services with
    PHP. Most of the publicly-available Web services out, however, use the newer Simple
    Object Access Protocol[45] (SOAP), not XML-RPC. In this solution, I''ll show you
    how to consume SOAP Web services with your PHP scripts.


    # Client-Server or Consume-Deploy?


    The Web services terminology describes the use of a client to access a Web service
    as consuming the act of providing a Web service is typically referred to as deploying
    This is a marked change from the terms client and server, the exact definitions
    of which are blurred by Web services. For instance, your site may act as a server
    to visitors using their browsers, while simultaneously acting as a client to a
    Web service on a remote site.


    There''s really nothing new here. PHP scripts, for example often act as clients
    to database servers, while at the same acting as server to visitors browsing your
    site. If the act of consuming a Web service is hard, just think of it as being
    the same connecting to MySQL and fetching some data.


    As I mentioned in the last chapter, SOAP has a supporting technology called Services
    Description Language[46] (WSDL), which is one of the main reasons SOAP has an
    edge over XML-RPC. WSDL is a specification that allows an XML-based messaging
    protocol like SOAP to be described in a manner that relates directly to the object
    oriented paradigm. In practical terms, all this means that you can generate a
    client to a Web service on the fly if necessary, simply by reading the associated
    WSDL document.


    CapeScience[47] is one of a number of sites that provide free Web services today.
    They have also put together a great set of resources for Web service developers,


    +   [45] http://www.w3.org/TR/SOAP/

    [46] http://www.w3.org/TR/wsdl

    [47] http://www.capescape.com/'
