  md: '4.3, the DOM extension has undergone substantial improvements, but is warned—it
    complies loosely with the official DOM specification and is missing true support
    for some important XML features, such as namespaces[8] and XML Schema[9]. With
    PHP 5, there are plans afloat to rework PHP XML tools, and they''re being discussed
    in the PHP development newsgroup[10]. For now, the DOM extension is useful—but
    not expect miracles.


    It''s also worth being aware that all the XML functionality provided by PHP’s
    extensions could also be implemented using PHP. For example, the eZ xml library[11]
    that contains eZ publish [3|2] is a more complete implementation of the DOM standard
    than that provided by the PHP 4.3 extension. PEAR::XMLHTML[13], meanwhile, provides
    a SAX API for parsing badly formed XML (such as HTML). Search around and you''ll
    find other classes, such as PHP.XPath[14], which is an implementation of the XPath
    specification[15] in pure PHP.


    # XML and PHP Short Tags


    ![](img/64ba37119ee04e7b8d236c1d7b0d0734_99_0.png)


    When you''re dealing with XML—in particular when you''re constructing XML as strings—it''s
    a good idea to use short_open_tag set to Off in php.ini, or to use a .htaccess
    file with this command:


    ```

    php_flag short_open_tag off

    ```


    Otherwise, PHP will confuse XML processing instructions (e.g. <?xml ... ?> with
    short form PHP script tags <?<? ... ?>, which can result in all sorts of parse
    errors. If you do this, you must ensure that all your PHP scripts use full tags
    <?php ?>.


    We''ll begin this chapter by understanding how we can parse documents with SAX
    and DOM and generate XML with Dom. We''ll then look at using XSLT with the Sablotron
    extension[16], and Web services in XML-RPC and SOAP. Note that a few of useful
    XML utilities for PHP can be found at http://phpxclasses.sourceforge.org.


