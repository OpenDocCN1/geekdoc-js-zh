  md: "# The Observer Pattern\n\nThe observer pattern is a useful solution for triggering\
    \ events upon a specified occurrence within your application.\n\nFor example,\
    \ you may have a back end administration tool that allows authorized users to\
    \ add articles to your Website. When an article is published, a number of things\
    \ may need to happen in addition to storing the content in the database; for instance,\
    \ you may need to refresh the site's cached HTML files, which others use to stay\
    \ up-to-date, send an email to subscribers to inform them of the new content,\
    \ and perhaps a static XML document that contains your site's RSS feed, which\
    \ others use to stay up-to-date about the content you publish. The observer pattern\
    \ makes triggering these additional features easy and modular.\n\nThe terminology\
    \ of the observer pattern is that the object doing the work (in this case, perhaps\
    \ it's a class called Article is the observable, while the objects that respond\
    \ to changes in the observable (i.e. the cache-, email-, and RSS-related classes)\
    \ are known as observers. The general process of using the observer pattern is\
    \ to attach the observers to the observable. Then, when changes occur in the observable,\
    \ it notifies the observers, leaving them to take further action.\n\nUnderstanding\
    \ how the observer pattern works in practice can be a little confusing. Let's\
    \ look at the base classes required to implement it, but don't worry if this doesn't\
    \ make sense at first glance; using the observer pattern is a lot easier than\
    \ understanding it!\n\nFirst, let's look at the base Observable class:\n\n```\n\
    <?php\n/**\n * Base Observable class\n * @abstract\n */\nclass Observable {\n\
    /**\n * Array of Observers\n * @access private\n * @var array\n */\nvar $observers;\n\
    \n/**\n```"
  merge: -1
  pgno: 365
- img_proc: true
  md: "```\n/* Constructs the Observable object\n*/\nfunction Observable() {\n   \
    \ $this->observers = array();\n}\n```\n\n```\n/**\n* Calls the update() function\
    \ using the reference to each\n* registered observer, passing an optional argument\
    \ for the\n* event - used by children of Observable\n* @return void\n*/\nfunction\
    \ notifyObservers($arg = NULL) {\n    $keys = array_keys($this->observers);\n\
    \    foreach ($keys as $key) {\n        $this->observers[$key]->update($this,\
    \ $arg);\n    }\n}\n```\n\n```\n/**\n* Attaches an observer to the observable\n\
    * @return void\n*/\nfunction addObserver(&$observer) {\n    $this->observers[]\
    \ = &&$observer;\n}\n```\n\nLet's take a moment to review the methods here. addObserver\
    \ is used to register an observer object with the observable, and add it to the\
    \ internal array of observers. This is used before the observable class does anything,\
    \ and sets the scene for the observers to respond to events.\n\nThe notifyObservers\
    \ method is used by the observable to tell all the observers that something has\
    \ happened. It takes an optional argument, so that, if need, the observable can\
    \ tell observers something about the event efficiently. This method calls the\
    \ update method for each observer, passing a reference to the observer with the\
    \ argument:\n\n```\n$this->observers[$key]->update($this, $arg);\n```"
