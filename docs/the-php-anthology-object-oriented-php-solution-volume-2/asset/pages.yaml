    \n# IP Addresses\n\nEvery computer surfing the Internet must have an IP address\
    \ to be able to communicate. They're often compared to phone numbers, IP addresses\
    \ are easier to come by, and it makes far more difficult to identify exactly who\
    \ the user is (some say this is a very good thing). If you use a dial up Internet\
    \ connection from home, you've probably used at least 100 IP addresses, before\
    \ we even begin to consider the times you suffered from the Internet cafe down\
    \ the street, the local library, and so on. The IP addresses becomes more convoluted\
    \ when you take into account proxy servers, which act as \"middle men\" between\
    \ your browser and a Website, network address translation, and more. One thing\
    \ to be aware of is AOL uses a particularly bizarre mechanism; their members are\
    \ assigned a new IP address upon practically every page request, which basically\
    \ defeats any security mechanism you might care to use (e.g., configuring a user's\
    \ session to a single IP address).\n\n$SERVER['REMOTE_ADDR'] variable tells you\
    \ the nearest IP address to the Web browser (i.t. it will not show the local address\
    \ of the computer if it resides on a private network). What's important to realize\
    \ is that this could be a proxy server; you need to check $SERVER['HTTP_X_FORWARDED_FOR']\
    \ to obtain the client's actual IP address. Of course, life is never simple! Depending\
    \ on the type of proxy server clients, and whether they're using network address\
    \ translation, there are other variables you may need to consider, such as $SERVER['HTTP_CLIENT_IP'],\
    \ which is sometimes used to advertise a client's IP address when a proxy server\
    \ is used, along with $SERVER['HTTP_VIA'], which identifies the type of proxy\
    \ used.\n\nHere's a function that can be used to obtain the IP address nearest\
    \ to the end user, based on the REMOTE_ADDR, HTTP_X_FORWARDED_FOR and HTTP_CLIENT_IP\
    \ values:\n\n```\nfunction getAddress() {\n{\n  if (!empty($_SERVER['HTTP_CLIENT_IP']))\
    \ {\n    $ip_expl = explode('.', $SERVER['HTTP_CLIENT_IP']);\n    $referer = explode('.',\
    \ $SERVER['REMOTE_ADDR']);\n    if ($referer[0] != $ip_expl[0]) {\n    }\n  }\n\
    }\n```\n\n224"
