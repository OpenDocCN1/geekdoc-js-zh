    # Write Secure Scripts with PHP 4.2


    | January 1st 1970 | by Kevin Yank |

    | For the longest time, one of the biggest selling points of PHP as a server-side

    scripting language was that values submitted from a form were automatically

    created as global variables. PHP 4.1, the makers of PHP

    recommended an alternate means of accessing submitted data. In PHP 4.2,

    they switched off the old way of doing things! As I''ll explain in this article,

    these changes have been made in the name of security. There, we''ll

    explore the new features of PHP for handling form submissions and other\ondata,
    and how they can be used to write more secure scripts. |


