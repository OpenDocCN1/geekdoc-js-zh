  md: '# # Preface


    If I had one goal in mind while writing The PHP Anthology, it was to demonstrate
    how easy it is to create intricate and powerful Web applications with an object
    oriented approach. In many cases, the more common procedural approach would result
    in unmanageable and bug-ridden "spaghetti code."


    In The PHP Anthology, Volume I: Foundations, I laid the groundwork by introducing
    that approach and demonstrating its application to some relatively simple issues
    in Web development. With Volume II, I hope to blow your socks off by tackling
    some traditionally complex problems with those same principles—to great effect.


    In examining the solutions, you''ll see how putting together your application
    with well designed classes is much like stacking building blocks, each perfectly
    atop the other. Thanks to the principles of object oriented programming (OOP),
    different "blocks" of code needn''t be concerned with the specifics of the other
    blocks in the structure.


    One particular example in Chapter 3 looks at converting HTML content to Adobe''s
    Portable Document Format (PDF), using no less than eight separate classes in conjunction
    to fetch content from a database, parse the HTML, and finally, output a number
    of steps, but, by breaking it down into manageable components in the form of classes,
    the complexity is reduced to the simple interactions between them.


    Other issues tackled in this volume, either head-on, or as a side-effect of specific
    solutions, include:


    +   - Layered application structure and the principles of N-Tier design


    +   - Providing and consuming Web services using XML-RPC and SOAP


    +   - Professional development techniques, such as API documentation and unit
    testing


    +   - Software design patterns, and how to apply them in PHP


    When dealing with these more advanced subjects, my goal is not to provide all
    the answers (many worthy of books in themselves), but to open doors to new concepts
    for you to explore further on your own.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'My hope is that this book will enrich your understanding of PHP and motivate
    you to raise your development practices to a professional level, allowing you
    to change your job description from “PHP hacker” to “PHP developer.”


    # Who should read this book?


    This book, The PHP Anthology, Volume II: Applications, builds on the first book,
    The PHP Anthology, Volume I: Foundations, to provide practical solutions that
    are commonly required in many of today''s online applications. So, if you build
    Websites and Web applications with PHP, then this book is for you.


    For less experienced PHP developers, reading The PHP Anthology, Volume I: Foundations
    before you start this book is a good idea, as many of the solutions presented
    here build on knowledge introduced in that volume. It should be possible for the
    PHP veteran to gain from this second book, referring to the code to fill in any
    gaps.


    # What’s covered in this book?


    In summary, here''s what you''ll find in each of the chapters in this volume:


    +   Chapter 1: Access Control


    Beginning with basic HTTP authentication, then moving on to application authentication,
    this chapter looks at ways to control access to your site. Later solutions look
    implementing a user registration system and creating a fine-grained access control
    system with users, groups and permissions.


    +   Chapter 2: XML


    With XML rapidly becoming an essential part of almost all Web-based applications,
    this chapter begins by exploring the SAX and DOM APIs to help parse an RSS feed,
    before examining the generation of your RSS feed with DOM. Following that, we
    will see how XPath can be used to reduce the coding effort involved in parsing
    XML, then move on to XML transformations by XSLT. Finally, this chapter shows
    how Web services can be built using PHP, XML-RPC and SOAP.


    +   Chapter 3: Alternative Content Types


    With the wide range of media now on the Internet, there''s often a need to be
    able to use PHP to render content types other than (X)HTML. This chapter begins
    by looking at PDF generation using pure PHP, and how to convert text that contains
    embedded HTML markup into PDF form.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Following that, we''ll look at generating SVG images with PHP, and learn how
    to "WAP enable" a Website quickly and efficiently. Finally, this chapter looks
    at how XUL can be applied to build more powerful administrative interfaces to
    your application, reducing load on your server and speeding up administrative
    tasks.


    # Chapter 4: Stats and Tracking


    Here, we look at the all-important process of gathering statistical information
    about visitors to your site. We''ll experiment with various mechanisms we can
    use to capture data, and help you lay the foundations that can become critical
    in improving the experience you offer sites.


    # Chapter 5: Caching


    This chapter takes the fundamental view that "HTML is fastest,” and shows how
    you can take advantage of caching on both the client and server sides to reduce
    bandwidth usage and dramatically improve performance.


    # Chapter 6: Development Technique


    The goal of this chapter is to examine some of the techniques that have proved
    themselves in helping development projects succeed. The discussion covers common
    optimizations you might apply to your code, a summary of N-Tier application design,
    and how to add API documentation to your work, and how to reduce bugs with unit
    testing.


    # Chapter 7: Design Patterns


    The notion of software Design Patterns has been widely accepted as a useful approach
    to application design. This chapter introduces them as a concept, and illustrates
    their implementation with five common patterns applied to “real” problems in PHP:
    The Factory Method, The Iterator Pattern, The Strategy Pattern, The Adapter Pattern,
    and the Observer Pattern.


    # The Book’s Website


    Located at http://www.sitepoint.com/books/phpbant1/, the Website supporting this
    book will give you access to the following facilities:


    # The Code Archive


    As you progress through this book, you’ll note a number of references to the code
    archive. This is a downloadable ZIP archive that contains complete code for all
    the examples presented in the book.'
  merge: -1
