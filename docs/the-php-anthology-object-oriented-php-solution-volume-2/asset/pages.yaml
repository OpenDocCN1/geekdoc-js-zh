  md: '# Session Security


    Once the session has been established, it will continue until is specifically
    destroyed by PHP (in response to a user clicking "Log out," for example), or the
    session has been inactive for longer than a given period of time (24 minutes by
    default), at which point it becomes flagged for garbage collection and will be
    deleted the next PHP checks for outdated sessions.


    The following HTTP response headers show a server passing a session cookie to
    a browser, as a result of the session_start function in a PHP script:


    ```

    HTTP/1.1 200 OK

    Date: Wed, 26 Feb 2003 02:23:08 GMT

    Server: Apache/1.3.27 (Unix) PHP/4.3.1

    X-Powered-By: PHP/4.3.1

    Set-Cookie: PHPSESSID=ce55b537fb4eae349bbd8c5dcc63; path=/

    Connection: close

    Content-Type: text/html

    ```


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Strict//EN"

    "http://www.w3.org/TR/html1-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    >...

    ```


    Note that I''ve seen sessions are stored on the server as files. It''s possible
    to store sessions using other means, such as a database or shared memory. This
    can be useful for displaying "Who is Online" type information as well as load
    balancing multiple Web servers using a single session repository, allowing visitors
    to (unnowingly) swap servers while maintaining their session.


    # Session Security


    Sessions are very useful, but there are some important security considerations
    you should take into account when using them in your applications:


    +   By default, all browser has to gain control of a session is a valid session
    ID to PHP. In an ideal world, you could store the IP address that registered the
    session, and double check on every new request that the associated session ID.
    Unfortunately, some ISPs, such as AOL, assign a new user IP on almost every page
    request, so this type of security mechanism would soon start throwing valid users
    out of the system. However, it''s important to design your application in a manner
    that assumes that one of your users will eventually have his or her session "hijacked.

    " The user''s account is only exposed as long as the session hasn''t expired,
    so your focus should be on preventing the hijackers from doing serious damage
    while they''re in the system.'
