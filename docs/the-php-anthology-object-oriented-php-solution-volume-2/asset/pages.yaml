    \  /**\n   * Abstract function implemented by children to respond to\n   * to\
    \ changes in Observable subject\n   * @abstract\n   * @return void\n   */\n  function\
    \ update(&$source, $arg) {\n}\n?>\n```\n\nThe update method doesn't do anything\
    \ for the base class, but in subclasses it should be overridden to respond to\
    \ events.\n\nWith the base classes in place, let's see how the pattern works with\
    \ some skeleton classes that would allow articles to be published, and deal with\
