  md: '# Appendix A: PHP Configuration


    This is a quick reference to configuring PHP that covers the most important general
    settings you need to be aware of, either when running applications in a live environment,
    or because they impact security or the way you write code.


    # Configuration Mechanisms


    The primary mechanism for configuring PHP is the php.ini file, as provides you
    with control over all configuration settings. Entries generally take the format:


    ```

    setting = value

    ```


    Be sure to read the comments provided in the file before making changes, though
    there are a few tricks, such as include_path using a colon (:) as a separator
    on Unix, and a semicolon (;) on Windows.


    Most Web hosts will not provide access to your php.ini file unless you have root
    access to the system (which is typically not the case if you''re using a cheap
    virtual hosting service). Your next alternative is to use .htaccess files to configure
    PHP (assuming the Web server is Apache).


    .htaccess file is a text file that you place in a public Web directory to determine
    the behavior of Apache when it comes to serving pages from directory; for instance,
    you may identify which pages allow public access to. Note that the effect of an
    .htaccess file is recursive—it applies to subdirectories as well.


    To configure PHP with .htaccess, your hosting provider must have the Apache setting
    AllowOverride Options or AllowOverride All applied to your Web directory in Apache''s
    main httpd.conf configuration file. Assuming that is done, there are two Apache
    directives you can use to modify PHP''s configuration:


    php_flag used for settings that have boolean values (i.e. on/off or 1/0) such
    as register_globals'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Appendix A: PHP Configuration


    php_value

    used to specify a string value for settings, such as you might have with the

    include_path setting


    Here''s an example .htaccess file:


    ```

    # Switch off register globals

    php_flag register_globals off

    n# Set the include path

    php_value include_path "./home/username/pear/"

    ```


    The mechanism controlling PHP''s configuration is the group of functions

    ini_set and ini_alter, which let you modify configuration settings, as well as

    ini_get, which allows you to check configuration settings, and ini_restore,

    which resets PHP''s configuration to the default value as defined by php.ini and

    ay .htaccess files. Using ini_set, here''s an example which allows us to avoid

    having to define our host, user name and password when connecting to MySQL:


    ```

    ini_set(''mysql.default_host'', ''localhost'');

    ini_set(''mysql.default_user'', ''harry'');

    ini_set(''mysql.default_password'', ''secret'');

    ```


    ```

    if (!mysql_connect()) {

    echo mysql_error();

    } else {

    echo ''Success'';

    }

    ```


    Be aware that PHP provides for some settings, such as error_reporting,nern-

    tive functions that perform effectively the same job as ini_set. Which you

    prefer is a matter of taste.


    Note that certain settings, such as register_globals, can only be easily

    modified by php.ini or .htaccess, because such settings influence PHP''s beha-

    ior before begins executing your scripts.


    Furthermore, some configuration settings can be changed only in php.ini, such

    extension_dir, which tells PHP the directory in which PHP extensions can

    be found. For a complete reference on on controlling settings, refer to the PHP

    Manual[1].


    > [1] http://www.php.net/ini_set'
