  md: "# The Factory Method\n\nwhether the letter is a vowel. The factory method then\
    \ creates an instance of either Vowel or Consonant, and returns it to the caller.\n\
    \nFile: 1.php (excerpt)\n\n```\n/**\n * Factory for creating Vowel and Consonant\
