  md: '# How do I capture server side output for caching?


    It''s time to look at how we can reduce server side delay by caching output. The
    general approach begins by rendering the page as normal, performing database queries
    and so on with PHP. However, before sending it to the browser, we capture and
    store the finished page somewhere, for instance, in a file. The next time the
    page is requested, the PHP script first checks whether a cached version of the
    page exists. If it does, the script sends the cached version to the browser, avoiding
    the delay involved in rebuilding the page.


    # What about Template Caching?


    > Template engines like Smarty[4] often talk about template caching. Usually,
    engines offer an in-built mechanism for storing a compiled version of the template
    (ie the native PHP generated from the template), prevents us having to recompile
    the template every time a page is requested. This should not be confused with
    output caching, which refers to the caching of the rendered HTML (or other output)
    which PHP sends to the browser. You can successfully use both types of caching
    together on the same site.


    Here, we''ll look at PHP''s in-built caching mechanism, the output buffer[5],
    which can be used with whatever page rendering system you prefer (templates or
    no templates). Consider a situation in whether your script displays results using,
    for example, echo or print; rather than sending the data directly to the browser.
    In these cases, you can use PHP''s output control functions to store the data
    in an in-memory buffer, which your PHP script has access to and control over.


    Here''s a simple example:


    ```

    <php

    // Start buffering the output

    ob_start();


    // Echo some text (which is stored in the buffer);

    echo ''1. Place this in the buffer<br />'';

    ```


    +   [4] http://smarty.php.net/

    [5] http://www.php.net/outcontrol'
