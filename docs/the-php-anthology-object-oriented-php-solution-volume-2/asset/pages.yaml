    \ if their password was being reset. Requiring the login name and email of the\
    \ user makes it a little more complex.\n\nOf the next two methods, addWords is\
    \ used to supply the class with an indexed array of words which to build memorable\
    \ passwords, while generatePassword constructs a random password from this list,\
    \ adding \"separators\" that could be any number from 0 to 9, or an underscore\
    \ character. The password itself contain two words chosen at random from the list,\
    \ as well as two random separators. The order in which these elements appear in\
    \ the password is also random. The passwords this system generates like \"7correct9computer\"\
    \ and \"48clothes,\" which are relatively easy for users to remember."
