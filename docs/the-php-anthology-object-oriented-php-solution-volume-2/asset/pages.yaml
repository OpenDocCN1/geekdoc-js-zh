  md: "# Chapter 7: Design Patterns\n\nOf particular interest in the above section\
    \ of code is the buildStats method, which statically calls the factory method,\
    \ getChar, in the CharFactory class. Using this approach, we can leave to the\
    \ factory method the task of working out what to do with the current character;\
    \ this keeps the buildStats method very simple.\n\nTo finish off the TextStats\
    \ class, we add a couple of methods to determine how many vowels and consonants\
    \ the document contains:\n\n```\n/**\n * Find out how many Vowels in document\n\
    \ */\nfunction numVowels() {\n  $vowels = 0;\n  reset($this->chars);\n  foreach\
    \ ($this->chars as $char) {\n    if (is_a($char, 'Vowel')) {\n      $vowels++;\n\
    \    }\n  }\n  return $vowels;\n}\n\n/**\n * Find out how many Consonants in document\n\
    \ */\nfunction numConsonants() {\n  $consonants = 0;\n  reset($this->chars);\n\
    \  foreach ($this->chars as $char) {\n    if (is_a($char, 'Consonant')) {\n  \
    \    $consonants++;\n    }\n  }\n  return $consonants;\n}\n```\n\nNow, let's look\
    \ at the factory method itself. It takes a single character as its argument and\
    \ examines it first with a regular expression. Should it decide that the character\
    \ is a letter of the alphabet, it then performs a second check to see"
