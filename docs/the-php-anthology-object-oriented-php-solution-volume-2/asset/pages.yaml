  md: '# Chapter 3: Alternative Content Types


    # HAWHAW


    Now that we understand the basics, it''s time to meet HAWHAW[22] (the HTML and
    WML hybrid adapted Webserver), a PHP class library that makes serving WML pages
    easy. Using HAWHAW to construct WML pages is much like using the DOM extension
    to create XML, as we saw in Chapter 2. In the HAWHAW document model, the parent
    of all elements is the HAW_deck class, to which other elements are added, as described
    in the online documentation[23].


    HAW doesn''t make use of multiple cards, but instead places all elements within
    a single circle. This is to some extent shortcoming, but helps HAWHAW provide
    support for order wireless formats, including HDMI, as well as other formats such
    MML, which is used by some Japanese devices.


    The code for this chapter includes the HAWHAW library.²


    At the start of this chapter, we looked at rendering PDF files from the articles
    table. Here''s how we could render WML from the same data:


    ```

