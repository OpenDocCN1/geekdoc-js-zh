  md: "# How do I prevent Web browsers caching a page?\n\nservers) from caching pages\
    \ in the first place. The most basic approach to doing\nthis utilizes HTML meta\
    \ tags:\n\n```\n<meta http-equiv=\"Expires\" content=\"Mon, 26 Jul 1997 05:00:00\
    \ GMT\"/>\n<meta http-equiv=\"Pragma\" content=\"no-cache\" />\n```\n\nBy inserting\
    \ a past date into the Expires meta tag, we can tell the browser that\nt cached\
    \ copy of the page is always out of date. This means the browser should\never\
    \ cache the page. The Pragma: no-cache tag is a fairly well-supported\nconvention\
    \ that most Web browsers follow. Upon encountering this tag, they\nusually won't\
    \ cache the page (although there's no guarantee; this is just a conven-\ntion).\n\
    \nIt sounds good, but there are two problems associated with using meta tags:\n\
    \n+   - If a tag wasn't present when the page was first requested by a browser,\
    \ but\n  appears later (for example, you modified the included pageheader.php\
    \ file,\n  which contains the top of every Web page), the browser will remain\
    \ blissfully\n  ignorant and keep its cached copy of the original.\n- Proxy servers\
    \ that cache pages, such as common to ISPs, generally\n  will not examine the\
    \ HTML documents themselves. Instead, they rely on\nout the Web server where the\
    \ documents come, and the HTTP protocol.\nIn other words, a Web browser might\
    \ know that it shouldn't cache the page,\nbut the proxy server between the browser\
    \ and your Web server properly\ndoes't—it will continue to deliver the same out-of-date\
    \ page to the client\n\nA better approach is to use the HTTP protocol itself,\
    \ with the help of PHP's\nheader function, to produce the equivalent of the two\
    \ meta tags above:\n\n```\n<?php\nheader('Expires: Mon, 26 Jul 1997 05:00:00 GMT');\n\
    header('Pragma: no-cache');\n?>\n```\n\nWe can go one step further, using the\
    \ Cache-Control header that's supported\nby HTTP 1.1 browsers:\n\n```\n<?php\n\
    header('Expires: Mon, 26 Jul 1997 05:00:00 GMT');\nheader('Cache-Control: no-store,\
    \ no-cache, must-revalidate');\nheader('Cache-Control: post-check=0, pre-check=0',\
    \ FALSE);\nheader('Pragma: no-cache');\n?>\n```"
  merge: -1
