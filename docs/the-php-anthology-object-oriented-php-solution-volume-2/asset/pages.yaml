    \ 'Observable/Observer.php';\n\nclass Article extends Observable {\n  // To publish\
    \ an article\n  function publish() {\n    echo 'Publishing article.<br />';\n\
    \    // Perform query here that updates the database\n    $this->notifyObservers('published');\n\
    \  }\n\n  // To delete an article\n  function delete() {\n    echo 'Deleting article.<br\
