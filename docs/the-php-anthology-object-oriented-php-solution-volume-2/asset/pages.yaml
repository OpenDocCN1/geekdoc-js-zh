  md: "# How do I perform XPath queries with PHP?\n\nXPath is a syntax for accessing\
    \ nodes within an XML document that's not unlike file naming systems. From an\
    \ XPath expression, PHP's DOM extension can perform an XPath query, a powerful\
    \ mechanism for accessing elements within an XML document. In this solution, I'll\
    \ assume you have some knowledge of XPath; if you don't, see the section \"Further\
    \ Reading\" at the end of this chapter for more information.\n\nLet's say you\
    \ have this XML document:\n\n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"\
    ?>\n<sitepoint xmlns:spt=\"http://www.sitepoint.com/\">\n<spt:article>\n  <spt:article_id>1</spt:article_id>\n\
