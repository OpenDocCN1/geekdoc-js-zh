  md: '# Chapter 3: Alternative Content Types


    If a Web browser can understand HTML, why shouldn''t you be able to parse it with
    PHP? Can PEAR::XML_HTMLSax will let you get away with having a badly formed HTML
    document. As a parser, the XML_HTMLSax class guarantees to parse anything you
    give it without a word of complaint. The downside is that there are no warnings
    something be seriously wrong with the HTML code. This places a greater burden
    on you to make sure the document is valid before you parse it.


    Make sure you use the SAX related solutions in Chapter 2 for a general understanding
    of the principles behind SAX.


    To see XML_HTMLSax in action, let''s begin with a chunk of HTML stored in our
    out


    ```

    <p>If you''ve ever trawled the PHP listings over Hotscripts in search of a content
    management system to save you from writing your own, you <a href="http://developer.io/"">epublish</a>,
    a PHP-based CMS application, and thought <i><b>"Wow!</i></b>> Jubant, you tried
    to install it... to no avail. Desperately, you tried reading the code, only to
    discover it no sense whatsoever. Finally, you skulked away to a quiet corner to
    lick your wounds, resorting to PHP nuke insert.

    ```


    ```

    <p>This series is all about eZ publish and why it deserves the title of "PHP''s
    killer app." We''ll start from the ground up: first, we install eZ publish in
    your development environment.

    ```


    You''ll notice this exhibits two of the classic HTML problems; the p tags are
    not and we have some incorrectly nested tags:


    ```

    <i<i><b>"Wow!</i></b>>

    ```


    Here''s a simple example of how to parse it with XML_HTMLSax. First, as always,
    we need a class to act as the handler for XML_HTMLSax:


    File: XML/ParseHTML.php (in SPLIB (excerpt))


    ```

    /** * ParseHTML class demonstrates simple parsing of HTML using * PEAR::XML_HTMLSax
    * <br />/Defines handlers for HTML elements<br /> Requires PEAR::XML_HTMLSax *
    @package SPLIB * @access public */

    ```


    178'
