    \ (PDFlib[1] and ClipPDF[2]) that make it possible to\nrender PDF documents, but,\
    \ unfortunately, both are commercial and require the\npayment of some kind of\
    \ license fee if you're using them in a commercial applic-\\ation. This means\
    \ that many hosts don't support them, and as a spoilt PHP coder\nwho always wants\
    \ something for nothing, I'm not going to use them, either.\n\nInstead, I'm going\
    \ to work with R&OS PDF Class[3], a PDF rendering class\nwritten purely in PHP.\
    \ R&OS PDF is one of the two respected PDF generating lib-\raries written in pure\
    \ PHP, the other being FPDF[4]. The drawback to using\nier is that it takes a\
    \ long time to render the PDF and you may find better\nmaturity and features in\
    \ one of the extensions. Yet, both PHP libraries are\nvery capable of rendering\
    \ an attractive \"printable version\" of your content,\nand with a little cunning,\
    \ as caching the rendered PDF file, the performance\nimpact can be negated.\n\n\
    # PDF To Go...\n\nThe R&OS PDF library is a truly outstanding piece of open source\
    \ code. It's a\nt credit to the author, Wayne Munro, that he's been so generous\
    \ to allow\nothers to use it for free. The version used here is 0.9 and, although\
    \ it's not yet a\n release, it's very stable and really lacks a few \"nice to\
