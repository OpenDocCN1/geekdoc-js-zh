  md: '# 4

    Stats and Tracking


    Ever since Perl and CGI made their way onto the Internet, Webmasters have suffered
    an insatiable thirst for knowing who''s visiting their site. Over time, gathering
    information about a site''s visitors has become a discipline in itself; today,
    tracking tools offer advanced features such as the analysis of visitors'' click
    paths through your site, and some even attempt to locate a visitor''s geographical
    location based on the details of his or her ISP. This area of Webmastership has
    also gained a reputation for being part of the murkier of the Internet, however,
    with advertising agencies using banner ads to monitor surfers'' movements across
    multiple sites, wherever the agencies'' banners are placed. There''s a fine line
    between gathering data in order to help improve a site for its visitors and spying;
    I leave it up to you to make the value judgments.


    Building a system that tracks visitors and logs their progress through our sites
    can be extremely valuable from the perspectives of both security and improving
    visitors'' experience of the site. A tracking system can also help you determine
    the searches that bring visitors to your site, and identify sites that link to
    you, helping you to place the site where people will find it.


    In this chapter, we will look at the basics of storing visitor information with
    some simple PHP scripts, then defer to phpOpenTracker[1]. This excellent tracking
    tool offers some "state of the art" features that any good tracker should provide,


    > [1] http://www.phpopentracker.de/'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'and uses a very well structured, object oriented design that makes it possible
    to customize the product without breaking a sweat.


    We''ll also be looking at phpSniff[2], a handy tool for the identification of
    Web browsers and their specific capabilities. A fairly complex task, browser sniffing
    is often important if you use some of the more advanced elements of CSS and JavaScript
    on your site, but to be sure that people using older browsers aren''t deterred.


    # What information can I gather about my site''s visitors?


    Assuming you''re using Apache, you have access to a wealth of information about
    visitors—data that is communicated by their browsers to our Web server.


    Here''s a script which demonstrates the point:


    File: 1.php


    ```

    <?php

    echo Nearest IP address: '' . $_SERVER[''REMOTE_ADDR''] . ''<br />'';

    echo Nearest Hostname: ''

    @gethostbyaddr(@$_SERVER[''REMOTE_ADDR'']) . ''<br />'';

    echo ''Useragent: '' . $_SERVER[''HTTP_USER_AGENT''] . ''<br />'';

    echo ''Request: '' . $_SERVER[''REQUEST_URI''] . ''<br />'';

    echo ''Preferred Language: '' . $_SERVER[''HTTP_ACCEPT_LANGUAGE''] . ''<br />'';

    echo ''Referer: '' . $_SERVER[''HTTP_REFERER''] . ''<br />'';


    echo ''<p>Click a '' . $_SERVER[''PHP_SELF] . ''?link=referer>here</a>'';

    ?>

    ```


    The output generates, if you click on the link, is as follows:


    Nearest IP address: 127.0.0.1

    Nearest Hostname: localhost

    Useragent:Mozilla/4.0 (compatible; MSIE 6.0; MSIE 5.5; Windows NT 5.1) Opera 7.0
    [en]

    Request: /sitepoint/StatsTracking/1.php?link=referer

    Preferred Language: en

    Referer: http://localhost/sitepoint/StatsTracking/1.php


    [2] http://phpsniff.sourceforge.net/'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# What information can I gather about my site''s visitors?


    # The Golden Rule


    Remember the golden rule: never trust anything from the browser. There are ways
    to "spoof" almost anything that comes from a browser.


    Be wary of the $_SERVER[''HTTP_REFERER''] value. I''ve seen some people build
    security mechanisms based around this—a very bad idea.


    Also be aware, when dealing with these variables, that they are created by PHP
    so you may need to be careful to check that they exist in your code before you
    do anything with them. In the example used the error suppression operator @ to
    handle this.


    Given the basic information from the above script, we already have a foundation
    for building a stats and tracking system; we can store this information in a data-base,
    then use it to display a report of what is happening on the site.


    The hostname of the visitor, obtained with the gethostbyaddr function(), can tell
    you the domain from which the visitor can come. Running this on my own machine,
    I''m told localhost is the host name, but on a site you''ll get values as ottawa-hse-pp226908.sympatico.ca.
    .ca at the end tells us visitor comes from Canada, so we could build a report
    that tells us countries visitors come from, with the exception of the .com, .net
    andorg domains, which tend to be used internationally.


    $_SERVER[''HTTP_USER_AGENT''] value tells you about the visitor. In the example
    above, you''ll notice this value contains information about both the Web browser
    (Opera 7.01 [en]) and the operating system (Windows NT 5.1, which is Windows XP
    identifies itself). Of course, if you''ve built a site that''s compatible with
    all browsers, you won''t need to worry about this information...


    $_SERVER[''REQUEST_URI''] data can be used to determine exactly which page user
    was viewing. This is important with PHP, where the difference between URLs like
    index.php?view=news and index.php?view=articles can be very significant. This
    is the basis of path analysis.


    $_SERVER[''HTTP_REFERER''] tells you which visitor followed a link to get to the
    current page. Although this information cannot be relied upon, it generally provides
    useful data about sites that are linked to you.


    > Please note that gethostbyaddr is quite slow as you go, it must connect another
    server to perform a reverse DNS lookup. Using this function is one way to quickly
    bog down a speedy server.'
  merge: -1
  pgno: 241
