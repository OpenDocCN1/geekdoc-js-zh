    # Will PHP be available for use from the command line?


    If not, you might alternately require access to Perl or Python, or the ability
    to run shell scripts, if you''re happy with those languages. Usually, running
    a serious Website will require that you have the ability to run batch jobs (with
    cron), for tasks like backups, mailing you the PHP error log, and so on.


    +   Last but not least, throw in one or two questions that will test your hosting
    providers'' knowledge of PHP. Although it may not be their job to write PHP code,
    when you find yourself in the position of knowing a lot more about PHP than your
    host, the end result is depressing. It''s important to have a host that understands
    your needs.'
