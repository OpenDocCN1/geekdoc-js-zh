  md: '# Chapter 3: Alternative Content Types


    The following tag embeds an SVG image in an HTML document:


    ```

    <object data="image.svg" width="100%" height="100%"

    type="image/svg+xml" />

    ```


    # SVG and Netscape 4


    Since Netscape 4 doesn''t support the object tag, you need to use an embed tag
    to display SVG in this antiquated browser:


    ```

    <embed src="image.svg" width="100%" height="100"

    type="image/svg+xml" />

    ```


    Be aware that embed is not standards-compliant HTML, and should be avoided if
    you can spare Netscape 4.


    What makes SVG a potentially powerful tool when combined with PHP is its ability
    to render fully interactive images that not only look good, but also help from
    JavaScript, are to "do" things such as communicate with a Website using simple
    HTTP GET/POST requests, or even take advantage of the Web services protocols XML-RPC
    and SOAP. The implementation of functionality relies on the viewer, and where
    services are concerned, there is still some work to do. Adobe is planning to release
    version 4 of the viewer, while the Batik project is making steady progress and
    will likely reach the same point as Adobe eventually. Mozilla is further ahead,
    providing SOAP and XML-RPC support courtesy of the XPCom library (more on that
    later). Some early adopters having had implementation SOAP and XML-RPC clients
    in JavaScript.


    Where SVG has really taken off, though, is in rendering online. An example that
    shows the potential is the Open SVG Map Server[18], which provides some fascinating
    examples of what SVG and PHP can do together. I''ve also heard of a company using
    PHP and SVG to implement a nationwide IP router routing tool, which does network
    status against an interactive SVG map from a Website. For an interactive map of
    Canada, try http://www.svgmapper.com/example/example3/North_America.htm.


    # SVG Network Clock


    To give a feel for SVG''s potential, here''s an digital clock that gets the time
    from a PHP script:


    > [18] http://www.carto.net/projects/open_svg_mapmapper/'
