  <!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n<title>查找字符串中最长的单词</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
  \ find_longest_word(str)\n{\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n  var\
  \ result = array1[0];\n  for(var x = 1 ; x < array1.length ; x++)\n  {\n    if(result.length\
  \ < array1[x].length)\n    {\n      result = array1[x];\n    }\n  }\n  return result;\n\
  }\nconsole.log(find_longest_word('Web Development Tutorial'));\n```\n\n### 输出\n\
  ```\nDevelopment\n```\n\n\n\n\n\n当字符串与正则表达式进行匹配时，使用 `match()` 方法可以获取匹配结果。\n\n`str.match(/w[a-z]*/gi)`\
  \ 的结果将返回 `[\"Web\", \"Development\", \"Tutorial\"]`。\n\n`for` 循环将每个数组元素的长度与前一个元素进行比较，并返回最长的字符串。\n\
