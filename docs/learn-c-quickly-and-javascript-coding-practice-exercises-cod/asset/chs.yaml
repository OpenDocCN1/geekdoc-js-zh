  \ bits left 448\nValue of Byte variable is 7\n```\n\n## 按位右移(>>)\n\n右移运算符将所有位向右移动一位，即：它简单地将值减半（除以\
  \ 2）。\n\n### 语法:\n`variable >> n`\n- 将变量向右移动 'n' 次。\n- `Variable >> n` 等于 `variable\
  \ = variable / 2 power n`\n\n```csharp\nint var = 128;\nvar >> 1 = 128 / (2 power\
  \ 1) = 64\nvar >> 2 = 128 / (2 power 2) = 32\n```\n\n`Program.cs`\n\n```csharp\n\
  using System ;\n\nclass Program\n{\n    static void Main ( string [] args)\n   \
  \ {\n        int intVar = 128 ;\n        Console.WriteLine(\"Value of int variable\
