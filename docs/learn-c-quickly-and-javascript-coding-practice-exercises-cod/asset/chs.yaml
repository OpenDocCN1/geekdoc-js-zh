  \ 类的摘要。\n\n# C#: if, else : 条件判断语句\n\nC# 提供了用于决策的控制流语句。\n\n## 决策语句\n\n## if 语句\n\
  \n“if”语句在条件求值为真时执行该代码段。\n\n### 语法\n\n```csharp\nif(condition){\n// 如果条件为真则执行\n}\n\
  ```\n\n`Program.cs`\n\n```csharp\nusing System ;\n\nclass Program\n{\n    static\
  \ void Main ( string [] args)\n    {\n        Console.WriteLine(\"Please Enter Your\
