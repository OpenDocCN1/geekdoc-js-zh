  \ (intVar >> 5 ));\n        Console.WriteLine(\"After shifting 6 bits Right \" +\
  \ (intVar >> 6 ));\n        Console.WriteLine(\"After shifting 7 bits Right \" +\
  \ (intVar >> 7 ));\n        Console.WriteLine(\"Value of int variable is \" + intVar);\n\
  \    }\n}\n```\n\n### 输出\n```\nValue of int variable is 128\nAfter shifting 1 bit\
  \ Right 64\nAfter shifting 2 bits Right 32\nAfter shifting 3 bits Right 16\nAfter\
