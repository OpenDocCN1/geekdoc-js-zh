  </body>\n</html>\n```\n\n### JAVCRIPT 代码\n```javascript\nfunction vowel_count(str1)\n\
  {\n  var vowel_list = 'aeiouAEIOU';\n  var vcount = 0;\n  for(var x = 0; x < str1.length\
  \ ; x++)\n  {\n    if (vowel_list.indexOf(str1[x]) !== -1)\n    {\n      vcount\
  \ += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"The quick brown\
  \ fox\"));\n```\n\n### 输出\n5\n\n### 解释\n`indexOf()` 方法返回指定值在调用的 `String` 对象中首次出现的索引，从\
  \ `fromIndex` 开始。如果找不到该值，则返回 `-1`。\n\n### 语法\n`str.indexOf(searchValue[, fromIndex])`\n\
  \n**参数包括：**\n- `searchValue`：表示要查找值的字符串。\n- `fromIndex`（可选）：字符串正向搜索的索引。可以使用任何整数。\n\
  \n如果满足条件 `vowel_list.indexOf(str1[x])!== -1`，则字符串中的字符将被计为元音。\n\n### 流程图\n![](img/Image00007.jpg)\n\
