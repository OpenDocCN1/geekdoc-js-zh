  \ 1001`\n`a^b = 0000 0001`\n\n# C#: 复合赋值运算符\n\n## 复合赋值\n\n### 语法:\n`variable operator=\
  \ value`\n\n### 示例:\n`int a = 10;`\n`a+=10` 求值为 `a=a+10`\n\n| 复合运算符 | 示例 | 描述 |\n\
  | :--- | :--- | :--- |\n| `+=` | `a+=10` | `a=a+10` |\n| `-=` | `a-=10` | `a=a-10`\
  \ |\n| `*=` | `a*=10` | `a=a*10` |\n| `/=` | `a/=10` | `a=a/10` |\n\n`Program.cs`\n\
  \n```csharp\nusing System ;\n\nclass Program\n{\n    static void Main ( string []\
  \ args)\n    {\n        int var1 = 100 ;\n        int sum = 10 , sub = 10 , mul\
  \ = 10 , div = 1000 ;\n        Console.WriteLine(\"sum+var1 is \" + (sum += var1));\n\
  \        Console.WriteLine(\"sub-var1 is \" + (sub -= var1));\n        Console.WriteLine(\"\
  mul*var1 is \" + (mul *= var1));\n        Console.WriteLine(\"div/var1 is \" + (div\
  \ /= var1));\n    }\n}\n```\n\n### 输出\n```\nsum+var1 is 110\nsub-var1 is -90\nmul*var1\
  \ is 1000\ndiv/var1 is 100\n```\n\n# C#: 三元运算符( ?:\n\n根据条件返回两个表达式之一。\n\n### 语法\n\
  `test ? expression1 : expression2`\n如果 `test` 求值为真，则返回 `expression1`，否则返回 `expression2`。\n\
  \n`Program.cs`\n\n```csharp\nusing System ;\n\nclass Program\n{\n    static void\
  \ Main ( string [] args)\n    {\n        int a = 100 ;\n        bool flag = a >\
  \ 10 ? true : false ;\n        Console.WriteLine(\"flag = {0}\", flag);\n    }\n\
  }\n```\n\n### 输出\n```\nflag = True\n```\n\n# C#: 数组\n\n数组是存储在连续内存中的一系列相同类型的元素。使用索引访问数组中的元素。\n\
  \n### 语法\n`datatype[] arrayName = new datatype[sizeOfTheArray];`\n\n### 示例:\n`int[]\
  \ evenNumbers = new int[10];`\n假设你想计算 9 个整数之和，你必须定义 9 个变量：\n`int var1, var2, var3,\
  \ var4, var5, var6, var7, var8, var9;`\n`var1 = 5;`\n`var2 = -10;`\n`var3 = 7;`\n\
  `var4 = 8;`\n`var5 = 11;`\n`var6 = 12;`\n`var7 = 14;`\n`var8 = 21;`\n`var9 = 0;`\n\
  \n通过数组可以声明如下：\n`int[] var = new int[9];`\n`var[0] = 5;\n`var[1] = -10;`\n`var[2]\
  \ = 7;`\n`var[3] = 8;`\n`var[4] = 11;`\n`var[5] = 12;`\n`var[6] = 14;`\n`var[7]\
  \ = 21;`\n`var[8] = 0;`\n可见，数组索引从 0 开始。`var[0]` 代表 5，`var[2]` 代表 7 等。\n\n`Program.cs`\n\
  \n```csharp\nusing System ;\n\nclass Program\n{\n    static void Main ( string []\
  \ args)\n    {\n        int [] var = new int [ 9 ];\n        var[0] = 5 ;\n    \
  \    var[1] = -10 ;\n        var[2] = 7 ;\n        var[3] = 8 ;\n        var[4]\
  \ = 11 ;\n        var[5] = 12 ;\n        var[6] = 14 ;\n        var[7] = 21 ;\n\
  \        var[8] = 0 ;\n        Console.WriteLine(\"var[0] = {0}\", var [0]);\n \
  \       Console.WriteLine(\"var[1] = {0}\", var [1]);\n        Console.WriteLine(\"\
  var[2] = {0}\", var [2]);\n        Console.WriteLine(\"var[3] = {0}\", var [3]);\n\
  \        Console.WriteLine(\"var[4] = {0}\", var [4]);\n        Console.WriteLine(\"\
  var[5] = {0}\", var [5]);\n        Console.WriteLine(\"var[6] = {0}\", var [6]);\n\
  \        Console.WriteLine(\"var[7] = {0}\", var [7]);\n        Console.WriteLine(\"\
  var[8] = {0}\", var [8]);\n    }\n}\n```\n\n### 输出\n```\nvar[0] = 5\nvar[1] = -10\n\
  var[2] = 7\nvar[3] = 8\nvar[4] = 11\nvar[5] = 12\nvar[6] = 14\nvar[7] = 21\nvar[8]\
  \ = 0\n```\n\n\n\n\n\n通过注释，你可以在编写程序时对代码进行记录。注释不会影响程序的执行。注释仅仅是记录你的代码。\n\nC# 支持 3\
  \ 类型的注释\n\n## 单行注释：\n\n单行注释以 `//` 开头\n\n```csharp\n// 这是一个单行注释\n```\n\n## 多行注释\n\
  \n多行注释置于 `/* */` 之间\n\n```csharp\n/* 这是一个多行注释 */\n```\n\n## XML 文档注释\n\nXML 文档注释用于为指定的类、函数、命名空间等提供帮助，\n\
  \n`Program.cs`\n\n```csharp\nusing System ;\n\nclass Program\n{\n    static void\
