- "# 快速学习 C# 与 JavaScript 编程实践指南：初学者编程\n\n\n\n![](img/Image00014.jpg)\n\n\n# C# 简介\n\
  C# 是一种支持多种范式的编程语言。C# 的基本语法与 C、C++ 和 `Java` 相似。因此，如果你熟悉其中任何一种语言，就可以很轻松地学习 C#。\n\n\
  ## 什么是多范式语言？\n支持多一种范式的语言被称为多范式语言。C# 是一种多范式语言，它同时支持命令式和面向对象的范式。C# 也支持某种程度的函数式编程。\n\
  \n# C# 与 .net\nC# 是一种编程语言，而 `.NET` 是一个框架`.`.NET`包含多种语言。C# 是 `.NET` 中的语言之一。\n\n##\
  \ C# 的最新版本是什么？\n在编写本文时，最新版本是 C# 6.0，它于 2015 年发布。\n\n## 使用 C# 的前提\n安装 Visual studio。你可以通过以下链接获取社区版：https://www.visualstudio.com/vs/community/\n\
  \n# C#: Hello World 程序\n希望你已经安装了 Visual studio。以下步骤介绍了如何创建一个“Hello World”应用程序。\n\
  \n第 1 步：打开 Visual studio\n第 2 步：进入文件 (File) -> 新建 (New) -> 项目 (Project)。选择“控制台应用程序\
  \ (Console Application)”，将项目命名为“HelloWorld”。按下确定。它会创建一个名为 `Program.cs` 的文件，包含一些默认数据。按如下更新程序。\n\
  \n```csharp\nusing System;\n\nnamespace HelloWorld\n{\n    class Program\n    {\n\
  \        static void Main (string [] args)\n        {\n            Console.WriteLine(\"\
  Hello World\");\n            Console.WriteLine(\"Welcome To C# Programming...\"\
  );\n        }\n    }\n}\n```\n\n按下 `CTRL + F5`，它将打开命令提示符并显示传递给 `Console.WriteLine`\
  \ 方法的字符串。\n\n## 分析程序\n\n`using System`\n上述语句加载了命名空间 `System`。命名空间用于组织代码。命名空间是类、接口、枚举、结构和委托的集合。\n\
  \n`namespace HelloWorld`\n上述语句为程序提供了命名空间 `HelloWorld`。这是可选的。你甚至可以在没有此语句的情况下运行程序。\n\
  \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main (string []\
  \ args)\n    {\n        Console.WriteLine(\"Hello World\");\n        Console.WriteLine(\"\
  Welcome To C# Programming...\");\n    }\n}\n```\n\n`class Program`\n类（Class）用于将方法和属性封装成单个实体。暂时忽略它，我将在后面的文章中解释。\n\
  \n`static void Main(string[] args)`\n`Main` 方法是你的 C# 应用程序的入口点。应用程序的执行从这里开始。\n\n\
  `Console.WriteLine(\"Hello World\");`\n上述语句将消息 \"Hello World\" 写入控制台。`Console` 是位于命名空间\
  \ `System` 中的类。`WriteLine` 是 `Console` 类的方法。\n\n# C#: 从控制台读取输入\n`Console` 类提供了 `ReadLine`\
  \ 方法从控制台读取输入。`ReadLine` 方法从控制台读取信息并以字符串格式返回输入。\n\n```csharp\nString name = Console.ReadLine();\n\
  ```\n\nProgram.cs\n```csharp\nusing System;\n\nclass Program\n{\n    static void\
  \ Main (string [] args)\n    {\n        Console.WriteLine(\"Welcome to C#, Please\
  \ Enter Information\");\n        Console.WriteLine(\"Enter Your Name\");\n     \
  \   String name = Console.ReadLine();\n        Console.WriteLine(\"Enter Your Age\"\
  );\n        String age = Console.ReadLine();\n        Console.WriteLine(\"Hello\
  \ \" + name + \" You are \" + age + \" years old\");\n    }\n}\n```\n\n输出\n```\n\
  Welcome to C#, Please Enter Information\nEnter Your Name\nJJ TAM\nEnter Your Age\n\
  26\nHello JJ TAM You are 26 years old\n```\n\n## 占位符语法\n在拼接字符串时，占位符语法比使用 `+` 运算符更方便。\n\
  \n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"Hello {0}. You are {1} years old\"\
  , name, age);\n```\n\n上述语句等同于以下语句。\n\n```csharp\nConsole.WriteLine(\"Hello \" +\
  \ name + \" You are \" + age + \" years old\");\n```\n\n\n\n\n```cs\nConsole.WriteLine(\"\
  You are {0} years old\", age);\nConsole.WriteLine(\"Hello {1}. You are {0} years\
  \ old\", name, age);\n}\n}\n```\nOutput\n```\nWelcome to C#, Please Enter Basic\
  \ Informaiton\nEnter Your Name\nJJ TAM\nEnter Your Age\n26\nHello JJ TAM\nYou are\
  \ 26 years old\nHello 26. You are JJ TAM years old\nPress any key to continue .\
  \ . .\n```\n\n# C#: 内置类型\n\nC# 支持几乎所有类型的数据进行操作。所有数据类型都表示为 `System` 命名空间中的类。数据类型可以分为以下类型：\n\
  \na. 布尔型：`bool`\nb. 整数：`byte`, `sbyte`, `int`, `uint`, `short`, `ushort`, `long`,\
  \ `ulong`\nc. 浮点型：`double`, `float`, `decimal`\nd. 字符：`char`\ne. 字符串：`String`\n\n\
  下表总结了所有数据类型：\n\n| 简写 | 类 | 最小值 | 最大值 |\n| :--- | :--- | :--- | :--- |\n| `byte`\
  \ | `Byte` | 0 | 255 |\n| `sbyte` | `SByte` | -128 | 127 |\n| `int` | `Int32` |\
  \ -2,147,483,648 | 2,147,483,647 |\n| `uint` | `UInt32` | 0 | 4294967295 |\n| `short`\
  \ | `Int16` | -32,768 | 32767 |\n| `ushort` | `UInt16` | 0 | 65535 |\n| `long` |\
  \ `Int64` | -9223372036854775808 | 9223372036854775807 |\n| `ulong` | `UInt64` |\
  \ 0 | 18446744073709551615 |\n| `float` | `Single` | -3.402823e38 | 3.402823e38\
  \ |\n| `double` | `Double` | -1.79769313486232e308 | 1.79769313486232e308 |\n| `decimal`\
  \ | `Decimal` | ±1.0 × 10e−28 | ±7.9 × 10e28 |\n| `char` | `Char` | | 表示 Unicode\
  \ 字符。占用 16 位。 |\n| `string` | `String` | | 字符序列 |\n\n## Note\n\na. `Float` 变量后加\
  \ `f` 后缀。\n   例：`float floatVar = 18.18f;`\nb. `Decimal` 变量后加 `m` 后缀。\n   例：`decimal\
  \ decimalVar = 20.20m;`\n\n## Program.cs\n```cs\nusing System ;\n\nclass Program\n\
  {\n    static void Main ( string [] args)\n    {\n        byte byteVar = 10 ;\n\
  \        sbyte sbyteVar = 11 ;\n        int intVar = 12 ;\n        uint uintVar\
  \ = 13 ;\n        short shortVar = 14 ;\n        ushort ushortVar = 15 ;\n     \
  \   long longVar = 16 ;\n        ulong ulongVar = 17 ;\n        float floatVar =\
  \ 18.18f ;\n        double doubleVar = 19.19 ;\n        decimal decimalVar = 20.20\
  \ m;\n        char charVar = 'S';\n        string stringVar = \"Hello World\";\n\
  \        Console.WriteLine(\"byteVar = {0}\", byteVar);\n        Console.WriteLine(\"\
  sbyteVar = {0}\", sbyteVar);\n        Console.WriteLine(\"intVar = {0}\", intVar);\n\
  \        Console.WriteLine(\"uintVar = {0}\", uintVar);\n        Console.WriteLine(\"\
  shortVar = {0}\", shortVar);\n        Console.WriteLine(\"ushortVar = {0}\", ushortVar);\n\
  \        Console.WriteLine(\"longVar = {0}\", longVar);\n        Console.WriteLine(\"\
  ulongVar = {0}\", ulongVar);\n        Console.WriteLine(\"floatVar = {0}\", floatVar);\n\
  \        Console.WriteLine(\"doubleVar = {0}\", doubleVar);\n        Console.WriteLine(\"\
  decimalVar = {0}\", decimalVar);\n        Console.WriteLine(\"charVar = {0}\", charVar);\n\
  \        Console.WriteLine(\"stringVar = {0}\", stringVar);\n    }\n}\n```\n\n#\
  \ C#: 字符串与转义序列\n\n`String` 是字符的集合。字符串用双引号包围。\n例：\n`String firstName = \"JJ TAM\"\
  ;`\n`String lastName = \"Delhi\";`\n\n## Program.cs\n```cs\nusing System ;\n\nclass\
  \ Program\n{\n    static void Main ( string [] args)\n    {\n        String firstName\
  \ = \"JJ TAM\";\n        String lastName = \"Delhi\";\n        Console.WriteLine(\"\
  Hello Mr {0} {1}\", firstName, lastName);\n    }\n}\n```\nOutput\n```\nHello Mr\
  \ JJ TAM Delhi\n```\n\n## 转义序列\n\n程序语言中的转义序列具有特殊含义，例如 `\\n` 在新行中打印字符串，`\\t` 是制表符等。下表总结了\
  \ C# 中的一些转义字符。\n\n| 转义序列 | 说明 |\n| :--- | :--- |\n| `\\a` | 蜂鸣 |\n| `\\b` | 退格 |\n\
  | `\\f` | 换页 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n| `\\t` | 水平制表符 |\n| `\\v` | 垂直制表符\
  \ |\n| `\\'` | 单引号 |\n| `\\\"` | 双引号 |\n| `\\\\` | 反斜杠 |\n| `\\?` | 问号 |\n| `\\\
  ooo` | 八进制格式的 ASCII 字符 |\n| `\\xhh` | 十进制格式的 ASCII 字符 |\n| `\\xhhhh` | 十进制格式的 Unicode\
  \ 字符 |\n\n## Program.cs\n```cs\nusing System ;\n\nclass Program\n{\n    static void\
  \ Main ( string [] args)\n    {\n        String quote = \"Life is an \\\"Open Secret\\\
  \". \\nEverything is avialble, you can't hidden\";\n        Console.WriteLine(quote);\n\
  \    }\n}\n```\nOutput\n```\nLife is an \"Open Secret\".\nEverything is avialble,\
  \ you can't hidden\n```\n\n# C#: 逐字面量 (Verbatim Literal)\n\n逐字面字符串字量由一个 `@` 字符后跟双引号内的字符串组成。逐字面字符串量中的转义序列不会被处理。\n\
  \n## Program.cs\n```cs\nusing System ;\n\nclass Program\n{\n    static void Main\
  \ ( string [] args)\n    {\n        String withVerbatim = @\"1\\n2\\n3\\t4\";\n\
  \        String withoutVerbatim = \"1\\n2\\n3\\t4\";\n        Console.WriteLine(withVerbatim);\n\
  \        Console.WriteLine(\"******************\");\n        Console.WriteLine(withoutVerbatim);\n\
  \    }\n}\n```\nOutput\n```\n1\\n2\\n3\\t4\n******************\n1\n2\n3       4\n\
  ```\n如输出所示，`@` 符号不会解释转义序列 `\\n`, `\\t`。而不带 Verbatim 的字符串会将 `\\n` 解析为换行并将 `\\t` 解析为制表符。\n\
  \n# C#: 运算符\n\n运算符是执行操作的符号。\n\n如果运算符对单个操作数执行操作，称为一元运算符。\n例：\n`int a = 10;`\n`a++;`\n\
  \n如果运算符对两个操作数执行操作，称为二元运算符。\n例：\n`int a=10, b=20;`\n\n如果运算符对三个操作数执行操作，则称为三元运算符。\n\
  例：\n`int a=10, b=20, c = a>b ? a : b;`\n\nC# 中的运算符分为 4 类：\n1. 算术运算符\n2. 条件运算符\n\
  3. 逻辑运算符\n4. 位运算运算符\n\n## 算术运算符\n\n算术运算符用于执行算术运算。\n\n\n\n\n\n```csharp\nConsole.WriteLine(\"\
  var = {0}\", var ++);\nConsole.WriteLine(\"var = {0}\", var );\n```\nOutput\n```\n\
  var = 10\nvar = 11\n```\n\n## 前置减\n\n### 语法\n```text\n--variable\n```\n前置减运算符会立即将变量值减\
  \ 1。\n\n`Program.cs`\n```csharp\nusing System ;\n\nclass Program\n{\n    static\
  \ void Main ( string [] args)\n    {\n        int var = 10 ;\n        Console.WriteLine(\"\
  var = {0}\", -- var );\n    }\n}\n```\nOutput\n```\nvar = 9\n```\n\n## 后置减\n\n###\
  \ 语法\n```text\nvariable--\n```\n后置减运算符在执行完当前语句后，将变量值减 1。\n\n`Program.cs`\n```csharp\n\
  using System ;\n\nclass Program\n{\n    static void Main ( string [] args)\n   \
  \ {\n        int var = 10 ;\n        Console.WriteLine(\"var = {0}\", var --);\n\
  \        Console.WriteLine(\"var = {0}\", var );\n    }\n}\n```\nOutput\n```\nvar\
  \ = 10\nvar = 9\n```\n\n# C#: 条件运算符\n\n条件运算符用于判断一个操作数是否大于、小于、等于或不等于另一个操作数。\n\n![条件运算符](https://4.bp.blogspot.com/-L0p6MK64YEg/W3bnD8IFVLI/AAAAAAAAK7E/mqCH_nXaXWsY-VvmKP-hR-xFUA0zLgwKwCLcBGAs/s400/C%2523%2BConditional%2Boperators.jpg)(Image00003.jpg)](https://4.bp.blogspot.com/-L0p6MK64YEg/W3bnD8IFVLI/AAAAAAAAK7E/mqCH_nXaXWsY-VvmKP-hR-xFUA0zLgwKwCLcBGAs/s1600/C#+Conditional+operators.jpg)\n\
  \n条件运算符接受两个操作数，如果条件为真，则返回 true，否则返回 false。\n\n`Program.cs`\n```csharp\nusing System\
  \ ;\n\nclass Program\n{\n    static void Main ( string [] args)\n    {\n       \
  \ int a = 10 , b = 11 ;\n        Console.WriteLine(\"is a equals to a {0}\", (a\
  \ == a));\n        Console.WriteLine(\"is a equals to b {0}\", (a == b));\n    \
  \    Console.WriteLine(\"is a equals equals a {0}\", (a != a));\n        Console.WriteLine(\"\
  is a not equals to b {0}\", (a != b));\n        Console.WriteLine(\"is a less than\
  \ a {0}\", (a < a));\n        Console.WriteLine(\"is a less than b {0}\", (a < b));\n\
  \        Console.WriteLine(\"is a less or equal to a {0}\", (a <= a));\n       \
  \ Console.WriteLine(\"is a less or equal b {0}\", (a <= b));\n        Console.WriteLine(\"\
  is a greater than a {0}\", (a > a));\n        Console.WriteLine(\"is a greater than\
  \ b {0}\", (a > b));\n        Console.WriteLine(\"is a greater or equal to a {0}\"\
  , (a >= a));\n        Console.WriteLine(\"is a greater or equal b {0}\", (a >= b));\n\
  \    }\n}\n```\nOutput\n```\nis a equals a True\nis a equals b False\nis a not equals\
  \ a False\nis a not equals to b True\nis less than a False\nis less than b True\n\
  is less or equal to a True\nis less or equal b True\nis greater than a False\nis\
  \ greater than b False\nis greater or equal to a True\nis greater or equal b False\n\
  ```\n\n# C#: 逻辑运算符\n\nC# 提供了三种逻辑运算符，分别是 `&&` (与)、`||` (或) 和 `!` (非)。\n`&&` 也称为条件与。\n\
  `||` 也称为条件或。\n`&&` 和 `||` 被称为短路运算符，请查看为什么它们被称为短路运算符。\n\n## 逻辑与运算符\n\n| 操作数 1 | 操作数\
  \ 2 | 结果 |\n| :--- | :--- | :--- |\n| TRUE | TRUE | TRUE |\n| TRUE | FALSE | FALSE\
  \ |\n| FALSE | TRUE | FALSE |\n| FALSE | FALSE | FALSE |\n\n`Program.cs`\n```csharp\n\
  using System ;\n\nclass Program\n{\n    static void Main ( string [] args)\n   \
  \ {\n        bool operand1 = true ;\n        bool operand2 = true ;\n        Console.WriteLine(\"\
  operand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 && operand2 = {0}\", (operand1 && operand2));\n\
  \n        bool operand1 = true ;\n        bool operand2 = false ;\n        Console.WriteLine(\"\
  \\noperand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 && operand2 = {0}\",(operand1 && operand2));\n\
  \n        bool operand1 = false ;\n        bool operand2 = true ;\n        Console.WriteLine(\"\
  \\noperand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 && operand2 = {0}\", (operand1 && operand2));\n\
  \n        bool operand1 = false ;\n        bool operand2 = false ;\n        Console.WriteLine(\"\
  \\noperand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 && operand2 = {0}\", (operand1 && operand2));\n\
  \    }\n}\n```\nOutput\n```\noperand1 = True\noperand2 = True\noperand1 && operand2\
  \ = True\noperand1 = True\noperand2 = False\noperand1 && operand2 = False\noperand1\
  \ = False\noperand2 = True\noperand1 && operand2 = False\noperand1 = False\noperand2\
  \ = False\noperand1 && operand2 = False\n```\n\n### 为什么逻辑与被称为短路运算符？\n因为如果表达式中的第一个语句求值为假，那么\
  \ Java 就不会再评估整个表达式。因此，逻辑与被称为短路与。\n\n`Program.cs`\n```csharp\nusing System ;\n\n\
  class Program\n{\n    static void Main ( string [] args)\n    {\n        int a =\
  \ 10 , b = 21 ;\n        if ((a > b) && (a++ > b))\n        {\n            Console.WriteLine(\"\
  This not evaluated\");\n        }\n        Console.WriteLine(\"a is not incremented\
  \ \" + a);\n        if ((a < b) && (a++ < b))\n        {\n            Console.WriteLine(\"\
  This statement evaluated\");\n        }\n        Console.WriteLine(\"a is incremented\
  \ \" + a);\n    }\n}\n```\nOutput\n```\na is not incremented 10\nThis statement\
  \ evaluated\na is incremented 11\n```\n### 观察\n在表达式 `(a>b) && (a++ > b)` 中，`a>b`\
  \ 为假，所以 `&&` 运算符不会评估第二个语句，因此 `a` 没有自增。\n\n## 逻辑或运算符\n\n| 操作数 1 | 操作数 2 | 结果 |\n\
  | :--- | :--- | :--- |\n| TRUE | TRUE | TRUE |\n| TRUE | FALSE | TRUE |\n| FALSE\
  \ | TRUE | TRUE |\n| FALSE | FALSE | FALSE |\n\n如上表所示，如果任何一个操作数求值为真，则 `||` 运算符返回\
  \ true，否则返回 false。\n\n`Program.cs`\n```csharp\nusing System ;\n\nclass Program\n\
  {\n    static void Main ( string [] args)\n    {\n        bool operand1 = true ;\n\
  \        bool operand2 = true ;\n        Console.WriteLine(\"operand1 = {0}\", operand1);\n\
  \        Console.WriteLine(\"operand2 = {0}\", operand2);\n        Console.WriteLine(\"\
  operand1 || operand2 = {0}\", (operand1 || operand2));\n\n        bool operand1\
  \ = true ;\n        bool operand2 = false ;\n        Console.WriteLine(\"\\noperand1\
  \ = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 || operand2 = {0}\", (operand1 || operand2));\n\
  \n        bool operand1 = false ;\n        bool operand2 = true ;\n        Console.WriteLine(\"\
  \\noperand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 || operand2 = {0}\", (operand1 || operand2));\n\
  \n        bool operand1 = false ;\n        bool operand2 = false ;\n        Console.WriteLine(\"\
  \\noperand1 = {0}\", operand1);\n        Console.WriteLine(\"operand2 = {0}\", operand2);\n\
  \        Console.WriteLine(\"operand1 || operand2 = {0}\", (operand1 || operand2));\n\
  \    }\n}\n```\nOutput\n```\noperand1 = True\noperand2 = True\noperand1 || operand2\
  \ = True\noperand1 = True\noperand2 = False\noperand1 || operand2 = True\noperand1\
  \ = False\noperand2 = True\noperand1 || operand2 = True\noperand1 = False\noperand2\
  \ = False\noperand1 || operand2 = False\n```\n\n### 为什么逻辑或被称为短路运算符？\n因为如果第一个语句求值为真，那么\
  \ Java 就不会评估整个表达式。因此，逻辑或被称为短路或。\n\n\n\n\n\n如果操作数为 `TRUE`，`!` 运算符将其求值为 `FALSE`。\n\
  \n`Program.cs`\n\n```csharp\nusing System ;\n\nclass Program\n{\n    static void\
  \ Main ( string [] args)\n    {\n        bool a = true ;\n        Console.WriteLine(\"\
  a = {0}, !a = {1}\", a, !a);\n        a = false ;\n        Console.WriteLine(\"\
  a = {0}, !a = {1}\", a, !a);\n    }\n}\n```\n\n### 输出\n```\noperand1 = True\noperand2\
  \ = True\noperand1 || operand2 = True\noperand1 = True\noperand2 = False\noperand1\
  \ || operand2 = True\noperand1 = False\noperand2 = True\noperand1 || operand2 =\
  \ True\noperand1 = False\noperand2 = False\noperand1 || operand2 = False\n```\n\n\
  # C#: 移位运算符\n\n## 按位左移(<<)\n\n左移运算符将所有位向左移动一位，即：它简单地将值翻倍。\n\n### 语法:\n`variable\
  \ << n`\n- 将变量向左移动 'n' 次。\n- `Variable << n` 等于 `variable = variable * 2 power n`\n\
  \n```csharp\nint var = 2;\nvar << 1 = 2 * 2 power 1 = 4\nvar << 2 = 2 * 2 power\
  \ 2 = 8\nvar << 9 = 2 * 2 power 9 = 1024\n```\n\n`Program.cs`\n\n```csharp\nusing\
  \ System ;\n\nclass Program\n{\n    static void Main ( string [] args)\n    {\n\
  \        byte byteVar = 7 ;\n        Console.WriteLine(\"Value of Byte variable\
