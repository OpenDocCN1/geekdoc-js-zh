  \ Your Marks\n85\nCongrats, you passed in the Exam\n```\n\n示例输出 2\n```\nPlease Enter\
  \ Your Marks\n20\nYou failed in the Exam. Better luck next time\n```\n\n## if-else\
  \ if-else 阶梯\n\n通过使用 if-else if-else 结构，你可以选择多个备选方案。\n\nif 语句后面可以跟随可选的 else if...else\
