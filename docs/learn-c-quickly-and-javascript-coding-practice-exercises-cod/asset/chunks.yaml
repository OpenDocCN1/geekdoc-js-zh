    # Introduction to C#


    C# is a programming language that supports more than one programming paradigm.
    The basic syntax of C# is similar to that of C, C++ and Java. So if you are familiar
    with any one of these languages, you can learn C# just like that.


    ## What is multi-paradigm programming language?


    A Language that supports more than one programming paradigm is called multi-paradigm
    programming language. C# is a multi-paradigm programming language, it supports
    both imperative and object-oriented paradigms. C# support some level of functional
    programming also.


    ## C# Vs .net


    C# is a programming language, and ‘.NET’ is a framework. ‘.NET’ has various languages
    under it. C# is one of the language in ‘.NET’.


    What is the latest version of C#?


    At the time of writing this article, the most recent version is C# 6.0 which was
    released in 2015.


    Prerequisites to work with C#


    Install Visual studio. You can get the community edition from following link.


    https://www.visualstudio.com/vs/community/


    # C#: Hello World Program


    I hope, you installed Visual studio. Following step-by-step procedure explains
    simple ‘Hello World’ application.


    Step 1:  Open Visual studio


    [![https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7GJAUfU159eHACEwYBhgL/s400/Visual_studion_create_project.png](Image00000.jpg)](https://2.bp.blogspot.com/-k1u5i75B59Q/W3bIOR6l6rI/AAAAAAAAK6E/GQI1hkAGvWIJQvBdar3U7GJAUfU159eHACEwYBhgL/s1600/Visual_studion_create_project.png)


    Step 2:  Go to File -> New -> Project.


    Select “Console Application”, give the project name as “HelloWorld”.


    Press OK.


    It creates a file ‘Program.cs’, with some default data.


    Update the program like below.


    using System ;


    namespace HelloWorld


    {


        class Program


        {


            static void Main ( string [] args)


            {


                Console.WriteLine("Hello World");


                Console.WriteLine("Welcome To C# Programming.........");


            }


        }


    }


    Press ‘CTRL + F5’, it opens command prompt and show the strings that we passed
    to ''Console.WriteLine'' method.


    Let’s analyze the program


    ‘using System’


    Above statement loads a names space ‘System’. Name spaces are used to organize
    the code. A name space is a collection of classes, interfaces, enums, structs
    & delegates.


    namespace HelloWorld


    Above statement gives the name space ‘HelloWorld’ to this program. It is optional.
    You can even run the program without this statement.


    using System ;


    class Program


    {


        static void Main ( string [] args)


        {


            Console.WriteLine("Hello World");


            Console.WriteLine("Welcome To C# Programming.........");


        }


    }


    class Program


    Class is used to encapsulate methods and properties as single entity. Ignore this
    for time being, I will explain about this in later posts.


    static void Main(string[] args)


    Main method is the entry point of your C# application. Application executions
    starts from here.


    Console.WriteLine("Hello World");


    Above statement writes the message "Hello World" to console. Console is the class
    resides in name space System. WriteLine is the method of class Console.


    # C#: Read input from console


    ‘Console’ class provides ‘ReadLine’ method to read input from console. ReadLine
    method reads the information from console and return the input in string format.


    String name = Console.ReadLine();


    Program.cs


    using System ;


    class Program


    {


        static void Main ( string [] args)


        {


            Console.WriteLine("Welcome to C#, Please Enter Basic Informaiton");


            Console.WriteLine("Enter Your Name");


            String name = Console.ReadLine();


            Console.WriteLine("Enter Your Age");


            String age = Console.ReadLine();


            Console.WriteLine("Hello " + name + " You are " + age + " years old");


        }


    }


    Output


    Welcome to C#, Please Enter Basic Informaiton


    Enter Your Name


    JJ TAM


    Enter Your Age


    26


    Hello JJ TAM You are 26 years old


    ## Place Holder Syntax


    While concatenating the strings, place holder syntax is very convenient than using
    ‘+’ operator.


    Following is the example of place holder syntax.


    Console.WriteLine("Hello {0}. You are {1} years old", name, age);


    Above statement is equivalent of following statement.


    Console.WriteLine("Hello " + name + " You are " + age + " years old");


    Program.cs


    using System ;


    class Program


    {


        static void Main ( string [] args)


        {


            Console.WriteLine("Welcome to C#, Please Enter Basic Informaiton");


            Console.WriteLine("Enter Your Name");


            String name = Console.ReadLine();


            Console.WriteLine("Enter Your Age");


            String age = Console.ReadLine();


            Console.WriteLine("Hello {0}", name);'
