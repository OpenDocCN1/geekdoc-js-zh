    console.log(test37(11));\n```\n**输出：**\ntrue\ntrue\nfalse\nfalse\n\n---\n\n# 检查字符串是否以\
    \ 'Java' 开头，否则返回 false\n\n## JAVASCRIPT 代码\n```javascript\nfunction start_spec_str(str)\
    \ {\n  if (str.length < 4) {\n    return false;\n  }\n  front = str.substring(0,\
