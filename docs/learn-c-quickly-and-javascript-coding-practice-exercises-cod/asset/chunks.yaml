    int result1 = obj.sum(10, 5);\nint result2 = obj.sub(10, 5);\nint result3 = obj.mul(10,\
    \ 5);\nint result4 = obj.div(10, 5);\n```\n\n未定义 `static` 关键字的方法是实例方法。实例方法必须通过类的对象来调用。在上面的示例中，`sum`、`sub`、`mul`、`div`、`printEvenNumbers`\
    \ 实例方法。\n\n定义对象：\n```csharp\nProgram obj = new Program();\n```\n\n### 静态方法 (Static\
