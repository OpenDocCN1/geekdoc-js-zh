    false\n\n---\n\n# 检查两个整数是否在 50..99 范围内\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
    \ check_numbers(x, y) {\n  if ((x >= 50 && x <= 99) || (y >= 50 && y <= 99)) {\n\
    \    return true;\n  } else {\n    return false;\n  }\n}\n\nconsole.log(check_numbers(12,\
