            int result3 = obj.mul(10, 5);


            int result4 = obj.div(10, 5);


    Methods defined without ‘static’ keyword are called instance methods. Instance
    methods must be called by defining the object to a class. In the above example,
    sum, sub, mul, div, printEvenNumbers are the instance methods.


    Following statement defines the objects to the class Program.


            Program obj = new Program();


    ## Static Methods


    Methods defined using static keyword are called static methods. These are called
    class level methods. Static methods are called by class name.


    Ex:


        static int sum(int a, int b)


        {


            return a + b;


        }


    You can call above method by using ‘Program.sum(10, 5)’, where Program is the
    class name.


    Program.cs


    using System ;


    class Program


    {


        static void Main ( string [] args)


        {


            Program obj = new Program();


            int result1 = Program.sum( 10 , 5 );


