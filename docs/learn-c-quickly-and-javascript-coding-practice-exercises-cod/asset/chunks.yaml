  trans: "\n\n当字符串与正则表达式进行匹配时，使用 `match()` 方法可以获取匹配结果。\n\n`str.match(/w[a-z]*/gi)`\
    \ 的结果将返回 `[\"Web\", \"Development\", \"Tutorial\"]`。\n\n`for` 循环将每个数组元素的长度与前一个元素进行比较，并返回最长的字符串。\n\
    \n`length` 属性是一个 32 位无符号整数，其数值始终大于数组的最高索引。\n\n### 语法\n`arr.length`\n\n### 流程图\n\
    ![](img/Image00006.jpg)\n\n### JavaScript: 统计字符串中的元音数量\n示例字符串：'The quick brown\
    \ fox'\n预期输出：5\n\n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=utf-8 />\n<title>Counts the number of vowels within a string</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT 代码\n```javascript\nfunction\
    \ vowel_count(str1)\n{\n  var vowel_list = 'aeiouAEIOU';\n  var vcount = 0;\n\
    \  for(var x = 0; x < str1.length ; x++)\n  {\n    if (vowel_list.indexOf(str1[x])\
    \ !== -1)\n    {\n      vcount += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"\
    The quick brown fox\"));\n```\n\n#### 输出\n5\n\n#### 解释\n`indexOf()` 方法返回指定值在调用的\
    \ `String` 对象中首次出现的索引，从 `fromIndex` 开始。如果找不到该值，则返回 `-1`。\n\n### 语法\n`str.indexOf(searchValue[,\
    \ fromIndex])`\n\n**参数包括：**\n- `searchValue`：表示要查找值的字符串。\n- `fromIndex`（可选）：字符串正向搜索的索引。可以使用任何整数。\n\
    \n如果满足条件 `vowel_list.indexOf(str1[x])!== -1`，则字符串中的字符将被计为元音。\n\n### 流程图\n![](img/Image00007.jpg)\n\
    \n### JavaScript: 检查数字是否为质数\n![](img/Image00008.jpg)\n\n#### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n<title>Check a number\
    \ is prime or not</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT\
    \ 代码\n```javascript\nfunction test_prime(n)\n{\n  if (n===1)\n  {\n    return\
    \ false;\n  }\n  else if(n === 2)\n  {\n    return true;\n  }else\n  {\n    for(var\
    \ x = 2; x < n; x++)\n    {\n      if(n % x === 0)\n      {\n        return false;\n\
    \      }\n    }\n    return true; \n  }\n}\nconsole.log(test_prime(37));\n```\n\
    \n#### 输出\nTrue\n\n### 流程图\n![](img/Image00009.jpg)\n\n### JavaScript: 获取数据类型\n\
    我们将创建一个 JavaScript 函数，接收一个参数并返回其类型。\n注意六种可能的值：`object`、`boolean`、`method`、`number`、`string`\
    \ 或 `undefined`。\n\n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=utf-8 />\n<title>Detect JavaScript Data Types</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n#### JAVCRIPT 代码\n```javascript\nfunction detect_data_type(value)\n\
    {\n  var dtypes = [Function, RegExp, Number, String, Boolean, Object], x, len;\n\
    \  if (typeof value === \"object\" || typeof value === \"function\")\n  {\n  \
    \  for (x = 0, len = dtypes.length; x < len; x++)\n      {\n        if (value\
    \ instanceof dtypes[x])\n        {\n          return dtypes[x];\n        }\n \
    \     }\n  }\n  return typeof value;\n}\nconsole.log(detect_data_type(12));\n\
    console.log(detect_data_type('w3resource'));\nconsole.log(detect_data_type(false));\n\
    ```\n\n#### 输出\nnumber\nstring\nBoolean\n\n### JavaScript: 从数组中找到第二小和第二数字\n![](img/Image00010.jpg)\n\
    \n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8\
    \ />\n<title>Find the second lowest and second greatest numbers from an array</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT 代码\n```javascript\nfunction\
    \ Second_Greatest_Lowest(arr_num)\n{\n  arr_num.sort(function(x,y)\n         \
    \ {\n    return x-y;\n          });\n  var uniqa = [arr_num[0]];\n  var result\
    \ = [];\n  for(var j=1; j < arr_num.length; j++)\n  {\n    if(arr_num[j-1] !==\
    \ arr_num[j])\n    {\n      uniqa.push(arr_num[j]);\n    }\n  }\n  result.push(uniqa[1],uniqa[uniqa.length-2]);\n\
    \  return result.join(',');\n}\nconsole.log(Second_Greatest_Lowest([1,2,3,4,5]));\n\
    ```\n\n#### 输出\n2,4\n\n### 流程图\n![](img/Image00011.jpg)\n\n#### JavaScript 基础\n\
    计算两个数字的乘法和除法\n\n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=utf-8 />\n<title>JavaScript program to calculate multiplication and\
    \ division of numbers</title>\n<style>\nbody {margin:30px;}\n</style>\n</head>\n\
    <body>\n<form>\n1st Number : <input type=\"text\" id=\"firstNumber\" />\n2nd Number:\
    \ <input type=\"text\" id=\"secondNumber\" />\n<input type=\"button\" onclick=\"\
    multiplyBy()\"> Multiply />\n<input type=\"button\" onclick=\"divideBy()\"> Divide\
    \ />\n</form>\n<p>Result is : <span id=\"result\"></span></p>\n</body>\n</html>\n\
    ```\n\n#### JAVCRIPT 代码\n```javascript\nfunction multiplyBy()\n{\n  var num1 =\
    \ document.getElementById(\"firstNumber\").value;\n  var num2 = document.getElementById(\"\
    secondNumber\").value;\n  document.getElementById(\"result\").innerHTML = num1\
    \ * num2;\n}\n\nfunction divideBy()\n{\n  var num1 = document.getElementById(\"\
    firstNumber\").value;\n  var num2 = document.getElementById(\"secondNumber\").value;\n\
    \  document.getElementById(\"result\").innerHTML = num1 / num2;\n}\n```\n\n####\
    \ 解释\n可以使用以下公式进行精确转换（华氏度转摄氏）：\n- 华氏转摄氏： (°F − 32) ÷ 1.8\n- 摄氏转华氏： (°C × 1.8) +\
    \ 32\n\n元素的 `innerHTML` 属性用于设置内容。\n\n![](img/Image00012.jpg)\n\n### 温度转换\n从摄氏度到华氏度\n\
    \n#### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8\
    \ />\n<title>JavaScript program to convert temperatures to from celsius</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT 代码\n```javascript\nfunction\
    \ cToF(celsius)\n{\n  var cTemp = celsius;\n  var cFahr = (cTemp - 32) * 9 / 5;\n\
    \  var message = cFahr + '°F';\n}\n\nfunction fToC(fahrenheit)\n{\n  var fTemp\
    \ = fahrenheit;\n  var fCel = (fTemp - 32) * 5 / 9;\n  var message = fCel + '°C';\n\
    }\ncToF(60);\nfToC(45);\n```\n\n#### 输出\n68°F\n7.°C\n\n"
