  trans: "\n\n![](img/Image00014.jpg)\n\n# 快速学习 C# 与 JavaScript 编码练习题\n## 带实战项目的初学者编程指南\n\
    由 J J TAM 编写\n\n## 目录\n- [C# 简介]\n- [C#: Hello World 程序]\n- [C#: 从控制台读取输入]\n-\
    \ [C#: 内置类型]\n- [C#: 字符串与转义序列]\n- [C#: 逐字字面量]\n- [C#: 运算符]\n- 算术运算符\n- 算术运算符：++,\
    \ --\n- 条件运算符\n- 逻辑运算符\n- 移位运算符\n- 位运算符\n- 复合赋值运算符\n- 三元运算符 ( ?: )\n- [C#: 数组]\n\
    - [C#: 注释]\n- [C#: if, else : 条件语句]\n- [C#: Switch 语句]\n- [C#: goto 语句]\n- [C#:\
    \ while 循环]\n- [C#: do-while 循环]\n- [C#: for 循环]\n- [C#: for-each 循环]\n- [C#:\
    \ break 语句]\n- [C#: continue 语句]\n- [C#: 方法]\n- [JavaScript 编码练习]\n- [JavaScript\
    \ 函数 – 练习题]\n- [JavaScript: 查找第一个非重复字符]\n- [JavaScript: 查找字符串中最长单词]\n- [JavaScript:\
    \ 统计字符串中的元音个数]\n- [JavaScript: 检查数字是否为素数]\n- [JavaScript: 获取数据类型]\n- [JavaScript:\
    \ 查找第二小和第二大\n- [JavaScript 基础]\n- 计算乘法和除法\n- 转换温度\n- 寻找最大值\n- 反转给定字符串\n- 替换每个字符\n\
    - 创建新字符串\n- 拼接两个字符串\n- 移动最后三个字符\n- 计算和\n- 两位相加\n- 检查给定年份是否为闰年\n- 检查给定正数\n- 检查\
    \ a 是否以 'Java' 开头\n- 检查两个给定值\n- 查找数值数值 100\n\n# C# 简介\nC# 是一种支持多种范式的编程语言。C# 的基本语法与\
    \ C、C++ 和 `Java` 相似。因此，如果你熟悉其中任何一种语言，就可以很轻松地学习 C#。\n\n## 什么是多范式语言？\n支持多一种范式的语言被称为多范式语言。C#\
    \ 是一种多范式语言，它同时支持命令式和面向对象的范式。C# 也支持某种程度的函数式编程。\n\n# C# 与 .net\nC# 是一种编程语言，而 `.NET`\
    \ 是一个框架`.`.NET`包含多种语言。C# 是 `.NET` 中的语言之一。\n\n## C# 的最新版本是什么？\n在编写本文时，最新版本是 C#\
    \ 6.0，它于 2015 年发布。\n\n## 使用 C# 的前提\n安装 Visual studio。你可以通过以下链接获取社区版：https://www.visualstudio.com/vs/community/\n\
    \n# C#: Hello World 程序\n希望你已经安装了 Visual studio。以下步骤介绍了如何创建一个“Hello World”应用程序。\n\
    \n第 1 步：打开 Visual studio\n第 2 步：进入文件 (File) -> 新建 (New) -> 项目 (Project)。选择“控制台应用程序\
    \ (Console Application)”，将项目命名为“HelloWorld”。按下确定。它会创建一个名为 `Program.cs` 的文件，包含一些默认数据。按如下更新程序。\n\
    \n```csharp\nusing System;\n\nnamespace HelloWorld\n{\n    class Program\n   \
    \ {\n        static void Main (string [] args)\n        {\n            Console.WriteLine(\"\
    Hello World\");\n            Console.WriteLine(\"Welcome To C# Programming...\"\
    );\n        }\n    }\n}\n```\n\n按下 `CTRL + F5`，它将打开命令提示符并显示传递给 `Console.WriteLine`\
    \ 方法的字符串。\n\n### 分析程序\n\n`using System`\n上述语句加载了命名空间 `System`。命名空间用于组织代码。命名空间是类、接口、枚举、结构和委托的集合。\n\
    \n`namespace HelloWorld`\n上述语句为程序提供了命名空间 `HelloWorld`。这是可选的。你甚至可以在没有此语句的情况下运行程序。\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Main (string []\
    \ args)\n    {\n        Console.WriteLine(\"Hello World\");\n        Console.WriteLine(\"\
    Welcome To C# Programming...\");\n    }\n}\n```\n\n`class Program`\n类（Class）用于将方法和属性封装成单个实体。暂时忽略它，我将在后面的文章中解释。\n\
    \n`static void Main(string[] args)`\n`Main` 方法是你的 C# 应用程序的入口点。应用程序的执行从这里开始。\n\n\
    `Console.WriteLine(\"Hello World\");`\n上述语句将消息 \"Hello World\" 写入控制台。`Console`\
    \ 是位于命名空间 `System` 中的类。`WriteLine` 是 `Console` 类的方法。\n\n# C#: 从控制台读取输入\n`Console`\
    \ 类提供了 `ReadLine` 方法从控制台读取输入。`ReadLine` 方法从控制台读取信息并以字符串格式返回输入。\n\n```csharp\n\
    String name = Console.ReadLine();\n```\n\nProgram.cs\n```csharp\nusing System;\n\
    \nclass Program\n{\n    static void Main (string [] args)\n    {\n        Console.WriteLine(\"\
    Welcome to C#, Please Enter Information\");\n        Console.WriteLine(\"Enter\
    \ Your Name\");\n        String name = Console.ReadLine();\n        Console.WriteLine(\"\
    Enter Your Age\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n    }\n}\n```\n\n输出\n\
    ```\nWelcome to C#, Please Enter Information\nEnter Your Name\nJJ TAM\nEnter Your\
    \ Age\n26\nHello JJ TAM You are 26 years old\n```\n\n## 占位符语法\n在拼接字符串时，占位符语法比使用\
    \ `+` 运算符更方便。\n\n以下是占位符语法的示例。\n\n```csharp\nConsole.WriteLine(\"Hello {0}. You\
    \ are {1} years old\", name, age);\n```\n\n上述语句等同于以下语句。\n\n```csharp\nConsole.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n```\n"
- fmt: "\n```cs\nConsole.WriteLine(\"You are {0} years old\", age);\nConsole.WriteLine(\"\
    Hello {1}. You are {0} years old\", name, age);\n}\n}\n```\nOutput\n```\nWelcome\
    \ to C#, Please Enter Basic Informaiton\nEnter Your Name\nJJ TAM\nEnter Your Age\n\
    26\nHello JJ TAM\nYou are 26 years old\nHello 26. You are JJ TAM years old\nPress\
    \ any key to continue . . .\n```\n\n# C#: Built in Types\n\nC# support almost\
    \ all kind of data types to work with. All data types are represented as classes\
    \ in `System` namespace. Data types can be categorized into following types.\n\
    \na. `Boolean`: `bool`\nb. `Integer`: `byte`, `sbyte`, `int`, `uint`, `short`,\
    \ `ushort`, `long`, `ulong`\nc. `Float`: `double`, `float`, `decimal`\nd. `Character`:\
    \ `char`\ne. `String`\n\nFollowing table summarizes all the data types:\n\n| Short\
    \ Name | Class | Min value | Max value |\n| :--- | :--- | :--- | :--- |\n| `byte`\
    \ | `Byte` | 0 | 255 |\n| `sbyte` | `SByte` | -128 | 127 |\n| `int` | `Int32`\
    \ | -2,147,483,648 | 2,147,483,647 |\n| `uint` | `UInt32` | 0 | 4294967295 |\n\
    | `short` | `Int16` | -32,768 | 32767 |\n| `ushort` | `UInt16` | 0 | 65535 |\n\
    | `long` | `Int64` | -9223372036854775808 | 9223372036854775807 |\n| `ulong` |\
    \ `UInt64` | 0 | 18446744073709551615 |\n| `float` | `Single` | -3.402823e38 |\
    \ 3.402823e38 |\n| `double` | `Double` | -1.79769313486232e308 | 1.79769313486232e308\
    \ |\n| `decimal` | `Decimal` | ±1.0 × 10e−28 | ±7.9 × 10e28 |\n| `char` | `Char`\
    \ | | Represent Unicode character. It take 16 bits. |\n| `string` | `String` |\
    \ | Sequence of characters |\n\n### Note\n\na. Suffix `Float` variables by `f`.\n\
    \   Ex: `float floatVar = 18.18f;`\nb. Suffix `Decimal` variables by `m`.\n  \
    \ Ex: `decimal decimalVar = 20.20m;`\n\n### Program.cs\n```cs\nusing System ;\n\
    \nclass Program\n{\n    static void Main ( string [] args)\n    {\n        byte\
    \ byteVar = 10 ;\n        sbyte sbyteVar = 11 ;\n        int intVar = 12 ;\n \
    \       uint uintVar = 13 ;\n        short shortVar = 14 ;\n        ushort ushortVar\
    \ = 15 ;\n        long longVar = 16 ;\n        ulong ulongVar = 17 ;\n       \
    \ float floatVar = 18.18f ;\n        double doubleVar = 19.19 ;\n        decimal\
