    \ sum(int a, int b)\n{\n    return a + b;\n}\n```\n你可以通过 `Program.sum(10, 5)`\
    \ 调用上述方法，其中 `Program` 是类名。\n\n#### `Program.cs`\n```csharp\nusing System ;\n\n\
