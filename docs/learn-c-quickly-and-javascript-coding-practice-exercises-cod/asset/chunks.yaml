  trans: "\n\n# JavaScript 程序：将给定字符串中的每个字符替换为字母表中的下一个字符。\n\n## JAVASCRIPT 代码\n```javascript\n\
    function string_reverse(str)\n\nfunction LetterChanges(text) {\n  //https://goo.gl/R8gn7u\n\
    \  var s = text.split('');\n\n  for (var i = 0; i < s.length; i++) {\n    // 凯撒密码\n\
    \    switch(s[i]) {\n      case ' ':\n        break;\n      case 'z':\n      \
    \  s[i] = 'a';\n        break;\n      case 'Z':\n        s[i] = 'A';\n       \
    \ break;\n      default:\n        s[i] = String.fromCharCode(1 + s[i].charCodeAt(0));\n\
    \    }\n    // 大写元音\n    switch(s[i]) {\n      case 'a': case 'e': case 'i': case\
    \ 'o': case 'u':\n        s[i] = s[i].toUpperCase();\n    }\n  }\n  return s.join('');\n\
    }\n\nconsole.log(LetterChanges(\"PYTHON\"));\nconsole.log(LetterChanges(\"W3R\"\
    ));\nconsole.log(LetterChanges(\"php\"));\n```\n**输出：**\nQZUIPO\nX4S\nqIq\n\n\
    ---\n\n# JavaScript 程序：创建一个去掉第一个和最后一个字符的新字符串。\n\n## JAVASCRIPT 代码\n```javascript\n\
    function without_first_end(str) {\n  return str.substring(1, str.length - 1);\n\
    }\n\nconsole.log(without_first_end('JavaScript'));\nconsole.log(without_first_end('JS'));\n\
    console.log(without_first_end('PHP'));\n```\n**输出：**\navaScrip\nH\n\n---\n\n#\
    \ 拼接两个字符串，除掉它们的第一个字符\n\n## JAVASCRIPT 代码\n```javascript\nfunction concatenate(str1,\
    \ str2) {\n  str1 = str1.substring(1, str1.length);\n  str2 = str2.substring(1,\
    \ str2.length);\n  return str1 + str2;\n}\n\nconsole.log(concatenate(\"PHP\",\"\
    JS\"));\nconsole.log(concatenate(\"A\",\"B\"));\nconsole.log(concatenate(\"AA\"\
    ,\"BB\"));\n```\n**输出：**\nHPS\nAB\n\n---\n\n# 将指定字符串的最后三个字符移动到开头\n\n## JAVASCRIPT\
    \ 代码\n```javascript\nfunction right_three(str) {\n  if (str.length > 1) {\n  \
    \  return str.slice(-3) + str.slice(0, -3);\n  }\n  return str;\n}\n\nconsole.log(right_three(\"\
    Python\"));\nconsole.log(right_three(\"JavaScript\"));\nconsole.log(right_three(\"\
    Hi\"));\n```\n**输出：**\nhonPyt\niptJavaScr\nHi\n\n---\n\n# 计算长度为 3 的给定整数数组中三个元素的和\n\
    \n## JAVASCRIPT 代码\n```javascript\nfunction sum_three(nums) {\n  return nums[0]\
    \ + nums[1] + nums[2];\n}\n\nconsole.log(sum_three([10, 32, 20])); \nconsole.log(sum_three([5,\
    \ 7, 9]));\nconsole.log(sum_three([0, 8, -11]));\n```\n**输出：**\n62\n21\n-3\n\n\
    ---\n\n# 将长度为二的给定正整数两个数字相加\n\n## JAVASCRIPT 代码\n```javascript\nfunction add_two_digits(n)\
    \ {\n  return n % 10 + Math.floor(n / 10);\n}\n\nconsole.log(add_two_digits(25));\n\
    console.log(add_two_digits(50));\n```\n**输出：**\n7\n5\n\n---\n\n# 检查给定年份是否为闰年\n\
    \n## JAVASCRIPT 代码\n```javascript\nfunction leapyear(year) {\n  return (year %\
    \ 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\n\nconsole.log(leapyear(2016));\n\
    console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
    console.log(leapyear(100));\n```\n**输出：**\ntrue\ntrue\nfalse\nfalse\n\n---\n\n\
    # 检查正数是否为 3 或 7 的倍数\n\n## JAVASCRIPT 代码\n```javascript\nfunction test37(x) {\n\
    \  if (x % 3 == 0 || x % 7 == 0) {\n    return true;\n  } else {\n    return false;\n\
