- fmt: "\nWhen a string is matched against a regular expression, the `match()` method\
    \ is used to obtain the matches.\n\nAs a result of `str.match(/w[a-z]*/gi)`, `[\"\
    Web\", \"Development\", \"Tutorial\"]` will be returned.\n\nThe `for` loop compares\
    \ the length of each array element to the previous one and returns the longest\
    \ string.\n\nThe `length` property is a 32-bit unsigned integer that is always\
    \ numerically greater than the array's highest index.\n\n### Syntax\n`arr.length`\n\
    \n### FLOWCHART\n![](Image00006.jpg)\n\n### JavaScript: Counts the number of vowels\
    \ within a string\nExample string: `'The quick brown fox'`\nExpected Output: 5\n\
    \n#### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8\
    \ />\n<title>Counts the number of vowels within a string</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n#### JAVCRIPT CODE\n```javascript\nfunction vowel_count(str1)\n\
    {\n  var vowel_list = 'aeiouAEIOU';\n  var vcount = 0;\n  for(var x = 0; x < str1.length\
    \ ; x++)\n  {\n    if (vowel_list.indexOf(str1[x]) !== -1)\n    {\n      vcount\
    \ += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"The quick\
    \ brown fox\"));\n```\n\n#### OUTPUT\n5\n\n#### EXPLANATION\nThe `indexOf()` method\
    \ returns the index of the first occurrence of the defined value within the calling\
    \ `String` object, starting from `fromIndex`. If the value cannot be found, it\
    \ returns `-1`.\n\n### Syntax\n`str.indexOf(searchValue[, fromIndex])`\n\n**Parameters\
    \ include:**\n- `searchValue`: A string that represents the value to be sought.\n\
    - `fromIndex`(Optional): The index at which the string's forward search should\
    \ begin. Any integer can be used.\n\nIf the condition `vowel_list.indexOf(str1[x])!==\
    \ -1` is met, the character(s) of the string will be counted as vowels.\n\n###\
    \ FLOWCHART\n![](Image00007.jpg)\n\n### JavaScript: Check a number is prime or\
    \ not\n![](Image00008.jpg)\n\n#### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=utf-8 />\n<title>Check a number is prime or not</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT CODE\n```javascript\n\
    function test_prime(n)\n{\n  if (n===1)\n  {\n    return false;\n  }\n  else if(n\
    \ === 2)\n  {\n    return true;\n  }else\n  {\n    for(var x = 2; x < n; x++)\n\
    \    {\n      if(n % x === 0)\n      {\n        return false;\n      }\n    }\n\
    \    return true; \n  }\n}\nconsole.log(test_prime(37));\n```\n\n#### OUTPUT\n\
    True\n\n### FLOWCHART\n![](Image00009.jpg)\n\n### JavaScript: Get the data type\n\
    We are going to create a JavaScript function which takes an argument and returns\
    \ the type.\nNote six possible values: `object`, `boolean`, `method`, `number`,\
    \ `string`, or `undefined`.\n\n#### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=utf-8 />\n<title>Detect JavaScript Data Types</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT CODE\n```javascript\n\
    function detect_data_type(value)\n{\n  var dtypes = [Function, RegExp, Number,\
    \ String, Boolean, Object], x, len;\n  if (typeof value === \"object\" || typeof\
    \ value === \"function\")\n  {\n    for (x = 0, len = dtypes.length; x < len;\
    \ x++)\n      {\n        if (value instanceof dtypes[x])\n        {\n        \
    \  return dtypes[x];\n        }\n      }\n  }\n  return typeof value;\n}\nconsole.log(detect_data_type(12));\n\
    console.log(detect_data_type('w3resource'));\nconsole.log(detect_data_type(false));\n\
    ```\n\n#### OUTPUT\nnumber\nstring\nBoolean\n\n### JavaScript: Find the second\
    \ lowest and second greatest numbers from an array\n![](Image00010.jpg)\n\n####\
    \ HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n\
    <title>Find the second lowest and second greatest numbers from an array</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT CODE\n```javascript\n\
    function Second_Greatest_Lowest(arr_num)\n{\n  arr_num.sort(function(x,y)\n  \
    \        {\n    return x-y;\n          });\n  var uniqa = [arr_num[0]];\n  var\
    \ result = [];\n  for(var j=1; j < arr_num.length; j++)\n  {\n    if(arr_num[j-1]\
    \ !== arr_num[j])\n    {\n      uniqa.push(arr_num[j]);\n    }\n  }\n  result.push(uniqa[1],uniqa[uniqa.length-2]);\n\
    \  return result.join(',');\n}\nconsole.log(Second_Greatest_Lowest([1,2,3,4,5]));\n\
    ```\n\n#### OUTPUT\n2,4\n\n### FLOWCHART\n![](Image00011.jpg)\n\n### JAVCRIPT\
    \ BASICS\nCalculate multiplication and division of two numbers\n\n#### HTML CODE\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n<title>JavaScript\
    \ program to calculate multiplication and division of numbers</title>\n<style>\n\
    body {margin:30px;}\n</style>\n</head>\n<body>\n<form>\n1st Number : <input type=\"\
    text\" id=\"firstNumber\" />\n2nd Number: <input type=\"text\" id=\"secondNumber\"\
    \ />\n<input type=\"button\" onclick=\"multiplyBy()\"> Multiply />\n<input type=\"\
    button\" onclick=\"divideBy()\"> Divide />\n</form>\n<p>Result is : <span id=\"\
    result\"></span></p>\n</body>\n</html>\n```\n\n#### JAVCRIPT CODE\n```javascript\n\
    function multiplyBy()\n{\n  var num1 = document.getElementById(\"firstNumber\"\
    ).value;\n  var num2 = document.getElementById(\"secondNumber\").value;\n  document.getElementById(\"\
    result\").innerHTML = num1 * num2;\n}\n\nfunction divideBy()\n{\n  var num1 =\
    \ document.getElementById(\"firstNumber\").value;\n  var num2 = document.getElementById(\"\
    secondNumber\").value;\n  document.getElementById(\"result\").innerHTML = num1\
    \ / num2;\n}\n```\n\n#### EXPLANATION\nThe following formulas can be used to make\
    \ an exact conversion (Fahrenheit to Celsius):\n- Fahrenheit to Celsius: (°F −\
    \ 32) ÷ 1.8\n- Celsius to Fahrenheit: (°C × 1.8) + 32\n\nThe `innerHTML` property\
    \ of an element sets the content.\n\n![](Image00012.jpg)\n\n### Convert temperatures\n\
    To from celsius, Fahrenheit\n\n#### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=utf-8 />\n<title>JavaScript program to convert temperatures\
    \ to from celsius</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n#### JAVCRIPT\
    \ CODE\n```javascript\nfunction cToF(celsius)\n{\n  var cTemp = celsius;\n  var\
    \ cFahr = (cTemp - 32) * 9 / 5;\n  var message = cFahr + '°F';\n}\n\nfunction\
    \ fToC(fahrenheit)\n{\n  var fTemp = fahrenheit;\n  var fCel = (fTemp - 32) *\
    \ 5 / 9;\n  var message = fCel + '°C';\n}\ncToF(60);\nfToC(45);\n```\n\n#### OUTPUT\n\
    68°F\n7.°C\n"
