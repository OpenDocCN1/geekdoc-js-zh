    \ a value which is nearest to 100\n\n# Introduction to C#\nC# is a programming\
    \ language that supports more than one paradigm. The basic syntax of C# is similar\
    \ to that of C, C++, and `Java`. So if you are familiar with any one these languages,\
    \ you can learn C# just like that.\n\n## What is multi-paradigm language?\nA Language\
    \ that supports more than one paradigm is called multi-paradigm language. C# is\
    \ a multi-paradigm language, it supports both imperative and object-oriented paradigms.\
    \ C# support some level of functional programming also.\n\n## C# Vs .net\nC# is\
    \ a programming language, and `.NET` is a framework. `.NET` has various languages\
    \ under it. C# is one of the language in `.NET`.\n\n## What is the latest version\
    \ of C#?\nAt the time of writing this article, the most recent version is C# 6.0\
    \ which was released in 2015.\n\n## Prerequisites to work with C#\nInstall Visual\
    \ studio. You can get community edition from following link: https://www.visualstudio.com/vs/community/\n\
    \n# C#: Hello World Program\nI hope, installed Visual studio. Following step-by-step\
    \ procedure explains ‘Hello World’ application.\n\nStep 1: Open Visual studio\n\
    Step 2: Go to File -> New -> Project. Select “Console Application”, give the project\
    \ name as “HelloWorld”. Press OK. It creates a file `Program.cs`, with some default\
    \ data. Update the program like below.\n\n```csharp\nusing System;\n\nnamespace\
    \ HelloWorld\n{\n    class Program\n    {\n        static void Main (string []\
    \ args)\n        {\n            Console.WriteLine(\"Hello World\");\n        \
    \    Console.WriteLine(\"Welcome To C# Programming...\");\n        }\n    }\n\
    }\n```\n\nPress `CTRL + F5`, it opens command prompt and show the strings that\
    \ we passed to `Console.WriteLine` method.\n\n### Let’s analyze the program\n\n\
    `using System`\nAbove statement loads a namespace `System`. Name spaces are used\
    \ to organize the code. A namespace is a collection of classes, interfaces, enums,\
    \ structs & delegates.\n\n`namespace HelloWorld`\nAbove statement gives the namespace\
    \ `HelloWorld` to this program. It is optional. You can even run the program without\
    \ this statement.\n\n```csharp\nusing System;\n\nclass Program\n{\n    static\
    \ void Main (string [] args)\n    {\n        Console.WriteLine(\"Hello World\"\
    );\n        Console.WriteLine(\"Welcome To C# Programming...\");\n    }\n}\n```\n\
    \n`class Program`\nClass is used to encapsulate methods and properties as single\
    \ entity. Ignore this for time being, I will explain about this in later posts.\n\
    \n`static void Main(string[] args)`\n`Main` method is the entry point of your\
    \ C# application. Application executions starts from here.\n\n`Console.WriteLine(\"\
    Hello World\");`\nAbove statement writes the message \"Hello World\" to console.\
    \ `Console` is the class resides in namespace `System`. `WriteLine` is the method\
    \ of class `Console`.\n\n# C#: Read input from console\n`Console` class provides\
    \ `ReadLine` method to read input from console. `ReadLine` method reads the information\
    \ from console and return the input in string format.\n\n```csharp\nString name\
    \ = Console.ReadLine();\n```\n\nProgram.cs\n```csharp\nusing System;\n\nclass\
    \ Program\n{\n    static void Main (string [] args)\n    {\n        Console.WriteLine(\"\
    Welcome to C#, Please Enter Information\");\n        Console.WriteLine(\"Enter\
    \ Your Name\");\n        String name = Console.ReadLine();\n        Console.WriteLine(\"\
    Enter Your Age\");\n        String age = Console.ReadLine();\n        Console.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n    }\n}\n```\n\nOutput\n\
    ```\nWelcome to C#, Please Enter Information\nEnter Your Name\nJJ TAM\nEnter Your\
    \ Age\n26\nHello JJ TAM You are 26 years old\n```\n\n## Place Holder Syntax\n\
    While concatenating the strings, place holder syntax is very convenient than using\
    \ `+` operator.\n\nFollowing is the example of place holder syntax.\n\n```csharp\n\
    Console.WriteLine(\"Hello {0}. You are {1} years old\", name, age);\n```\n\nAbove\
    \ statement is equivalent of following statement.\n\n```csharp\nConsole.WriteLine(\"\
    Hello \" + name + \" You are \" + age + \" years old\");\n```\n"
