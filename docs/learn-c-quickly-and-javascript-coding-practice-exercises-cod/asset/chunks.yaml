    # C#: while 循环\n\nwhile 语句执行一组语句，直到特定条件为真\n\n### 语法\n\n```csharp\nwhile (expression)\
    \ {\n    //执行语句\n}\n```\n\nwhile 语句中的表达式必须求值为布尔值，否则编译器会抛出错误。while 语句首先评估表达式，直到表达式求值为真，它会执行\
    \ while 块内部的代码，否则退出 while 循环。\n\n`Program.cs`\n\n```csharp\nusing System ;\n\n\
    class Program\n{\n    static void Main ( string [] args)\n    {\n        int var1\
