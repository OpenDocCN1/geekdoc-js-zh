    \ * b;\n    }\n    int div (int a, int b)\n    {\n        return a/ b;\n    }\n\
    \    void printEvenNumbers ()\n    {\n        Console.WriteLine(\"Even Numbers\
    \ from 0 to 10 are : \");\n        for ( int i= 0 ; i< 10 ; i += 2 )\n       \
    \ {\n            Console.WriteLine(i);\n        }\n    }\n}\n```\n\n#### 输出\n\
    ```\nSum of 10 and 5 is 15\nSubtraction of 10 and 5 is 5\nMultiplication of 10\
