- fmt: "\n* [Protractor Snippets](https://marketplace.visualstudio.com/items?itemName=deerawan.vscode-protractor-snippets):\
    \ end-to-end testing snippets for the Protractor framework. Supports both JavaScript\
    \ and Typescript.\n* [Node TDD](https://marketplace.visualstudio.com/items?itemName=prashaantt.node-tdd):\
    \ provides support for test-driven development for Node and JavaScript projects.\
    \ Can trigger an automatic test build whenever sources are updated.\n\n# Awesome\
    \ Extensions\n\nI’m just putting this next bunch of VS Code extensions into the\
    \ “awesome” category, because that best describes them!\n\n* [Quokka.js](https://marketplace.visualstudio.com/items?itemName=WallabyJs.quokka-vscode):\
    \ an awesome debugging tool that provides a rapid prototyping playground for JavaScript\
    \ code. Comes with [excellent documentation](https://quokkajs.com/docs/).\n* [Paste\
    \ as JSON](https://marketplace.visualstudio.com/items?itemName=quicktype.quicktype):\
    \ quickly convert JSON data into JavaScript code.\n* [Code Metrics](https://marketplace.visualstudio.com/items?itemName=kisstkondoros.vscode-codemetrics):\
    \ this is another awesome extension that calculates complexity in JavaScript and\
    \ TypeScript code.\n\n# Extension Packs\n\nNow that we’ve come to our final category,\
    \ I would just like to let you know that the VS Code marketplace has [a category\
    \ for extension packs](https://marketplace.visualstudio.com/search?term=extension%20packs&target=VSCode&category=All%20categories&sortBy=Relevance).\
    \ Essentially, these are collections of related VS Code extensions bundled into\
    \ one package for easy installation. Here are some of the better ones:\n\n* [Nodejs\
    \ Extension Pack](https://marketplace.visualstudio.com/items?itemName=waderyan.nodejs-extension-pack):\
    \ this pack contains `ESLint`, `npm`, JavaScript (ES6) snippets, Search `node_modules`,\
    \ `NPM` IntelliSense and `Path IntelliSense`.\n* [VS Code for Node.js - Development\
    \ Pack](https://marketplace.visualstudio.com/items?itemName=nodesource.vscode-for-node-js-development-pack):\
    \ this one has `NPM` IntelliSense, `ESLint`, Debugger for Chrome, `Code Metrics`,\
    \ `Docker` and `Import Cost`.\n* [Vue.js Extension Pack](https://marketplace.visualstudio.com/items?itemName=mubaidr.vuejs-extension-pack):\
    \ a collection of Vue and JavaScript extensions. It currently contains about 12\
    \ VS Code extensions, some of which haven’t been mentioned here such as [auto-rename-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-rename-tag)\
    \ and [auto-close-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-close-tag).\n\
    * [Ionic Extension Pack](https://marketplace.visualstudio.com/items?itemName=loiane.ionic-extension-pack):\
    \ this pack contains a number of VS Code extensions for Ionic, Angular, `RxJS`,\
    \ Cordova and HTML development.\n\n# Summary\n\nVS Code’s huge number of quality\
    \ extensions makes it a popular choice for JavaScript developers. It’s never been\
    \ easier to write JavaScript code this efficiently. Extensions such as `ESLint`\
    \ help you avoid common mistakes, while others such as `Debugger for Chrome` help\
    \ you debug your code more easily. Node.js extensions with their IntelliSense\
    \ features help you import modules correctly, and the availability of tools such\
    \ as `Live Server` and `REST client` reduces your reliance on external tools to\
    \ complete your work. All of these tools make your iteration process far much\
    \ easier.\n\nI hope this list has been introduced you to new VS Code extensions\
    \ that can help you in your workflow.\n\n# Chapter 6: Debugging JavaScript Projects\
    \ with VS Code & Chrome Debugger\n\n### by Michael Wanyoike\n\nDebugging JavaScript\
    \ isn't the most fun aspect of JavaScript programming, but it's a vital skill.\
    \ This article covers two tools that will help you debug JavaScript like a pro.\n\
    \nImagine for a moment that the `console.log()` function did not exist in JavaScript.\
    \ I'm pretty sure the first question you'd ask yourself would be “How am I ever\
    \ to confirm my code is working correctly?”\n\nThe answer lies in using debugging\
    \ tools. For a long time, most developers, including myself, have been using `console.log`\
    \ to debug broken code. It’s quick and easy to use. However, things can get finicky\
    \ at times if you don't know where and what is causing the bug. Often you'll find\
    \ yourself laying down `console.log` traps all over your code to see which one\
    \ will reveal the culprit.\n\nTo remedy this, we need to change our habits and\
    \ start using debugging tools. There are a number of tools available for debugging\
    \ JavaScript code, such as the Chrome Dev Tools, [Node Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/),\
    \ `Node Inspect` and others. In fact, every [major browser](https://www.w3schools.com/js/js_debugging.asp)\
    \ provides its own tools.\n\nIn this this article, we'll look at how to use the\
    \ debugging facilities provided by Visual Studio Code. We'll also look at how\
    \ to use the [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ extension that allows VS Code to integrate with Chrome Dev Tools. Once we're\
    \ finished, you'll never want to use a `console.log()` again.\n\n## Prerequisites\n\
    \nFor this tutorial, you only need to have a solid foundation in [modern JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/).\
    \ We’ll also look at how to use the debugging facilities provided by Visual Studio\
    \ Code. We'll also look at how to use the [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ extension that allows VS Code to integrate with Chrome Dev Tools. Once we're\
    \ finished, you'll never want to use a `console.log()` again.\n\n## Debugging\
    \ JavaScript in VS Code\n\nThe first file I’d like you to look at is `src/places.js`.\
    \ You'll need to open the `debug-example` folder in VS Code (*File* > *Open Folder*)\
    \ and select the file from within the editor.\n\n```\nconst places = [];\n\nmodule.exports\
    \ = {\n  places,\n\n  addPlace: (city, country) => {\n    const id = ++places.length;\n\
    \    let numType = 'odd';\n    if (id % 2) {\n      numType = 'even';\n    }\n\
    \    places.push({\n      id, city, country, numType,\n    });\n  },\n};\n```\n\
    \nThe code is pretty simple, and if you have enough experience in coding you notice\
    \ it has a couple of bugs. If you do notice them, please ignore them. Let's add\
    \ a few of lines at the bottom to manually test the code:\n\n```\nmodule.exports.addPlace('Mombasa',\
    \ 'Kenya');\nmodule.exports.addPlace('Kingston', 'Jamaica');\nmodule.exports.addPlace('Cape\
    \ Town', 'South Africa');\n```\n\nNow, I’m sure you’re itching to do a `console.log`\
    \ to output the value of `places`. But let's not do that. Instead, let's add breakpoints.\
    \ Simply add them by left-clicking on the gutter — that is, the blank space next\
    \ to the line numbers:\n\n![Red dots indicating breakpoints](Images/152442833001-breakpoint.png)\n\
    \nSee the red dots on the side? Those are the breakpoints. A breakpoint is simply\
    \ a visual indication telling the debugger tool where to pause execution. Next,\
    \ on the action bar, click the debug button (the icon that says “No Bugs Allowed”).\n\
    \nWait, look at the top section. You'll notice there’s a gear icon with a red\
    \ dot. Simply click on it. A debug configuration file, `launch.json`, will be\
    \ created for you. Update the config like this so that you can run VS Code's debugger\
    \ on `places.js`:\n"
  raw: "*   [Protractor Snippets](https://marketplace.visualstudio.com/items?itemName=deerawan.vscode-protractor-snippets):\
    \ end-to-end testing snippets for the Protractor framework. Supports both JavaScript\
    \ and Typescript.\n\n*   [Node TDD](https://marketplace.visualstudio.com/items?itemName=prashaantt.node-tdd):\
    \ provides support for test-driven development for Node and JavaScript projects.\
    \ Can trigger an automatic test build whenever sources are updated.\n\n## Awesome\
    \ Extensions\n\nI’m just putting this next bunch of VS Code extensions into the\
    \ “awesome” category, because that best describes them!\n\n*   [Quokka.js](https://marketplace.visualstudio.com/items?itemName=WallabyJs.quokka-vscode):\
    \ an awesome debugging tool that provides a rapid prototyping playground for JavaScript\
    \ code. Comes with [excellent documentation](https://quokkajs.com/docs/).\n\n\
    *   [Paste as JSON](https://marketplace.visualstudio.com/items?itemName=quicktype.quicktype):\
    \ quickly convert JSON data into JavaScript code.\n\n*   [Code Metrics](https://marketplace.visualstudio.com/items?itemName=kisstkondoros.vscode-codemetrics):\
    \ this is another awesome extension that calculates complexity in JavaScript and\
    \ TypeScript code.\n\n## Extension Packs\n\nNow that we’ve come to our final category,\
    \ I would just like to let you know that the VS Code marketplace has [a category\
    \ for extension packs](https://marketplace.visualstudio.com/search?term=extension%20packs&target=VSCode&category=All%20categories&sortBy=Relevance).\
    \ Essentially, these are collections of related VS Code extensions bundled into\
    \ one package for easy installation. Here are some of the better ones:\n\n*  \
    \ [Nodejs Extension Pack](https://marketplace.visualstudio.com/items?itemName=waderyan.nodejs-extension-pack):\
    \ this pack contains ESLint, npm, JavaScript (ES6) snippets, Search node_modules,\
    \ NPM IntelliSense and Path IntelliSense.\n\n*   [VS Code for Node.js - Development\
    \ Pack](https://marketplace.visualstudio.com/items?itemName=nodesource.vscode-for-node-js-development-pack):\
    \ this one has NPM IntelliSense, ESLint, Debugger for Chrome, Code Metrics, Docker\
    \ and Import Cost.\n\n*   [Vue.js Extension Pack](https://marketplace.visualstudio.com/items?itemName=mubaidr.vuejs-extension-pack):\
    \ a collection of Vue and JavaScript extensions. It currently contains about 12\
    \ VS Code extensions, some of which haven’t been mentioned here such as [auto-rename-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-rename-tag)\
    \ and [auto-close-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-close-tag).\n\
    \n*   [Ionic Extension Pack](https://marketplace.visualstudio.com/items?itemName=loiane.ionic-extension-pack):\
    \ this pack contains a number of VS Code extensions for Ionic, Angular, RxJS,\
    \ Cordova and HTML development.\n\n## Summary\n\nVS Code’s huge number of quality\
    \ extensions makes it a popular choice for JavaScript developers. It’s never been\
    \ easier to write JavaScript code this efficiently. Extensions such as ESLint\
    \ help you avoid common mistakes, while others such as Debugger for Chrome help\
    \ you debug your code more easily. Node.js extensions with their IntelliSense\
    \ features help you import modules correctly, and the availability of tools such\
    \ as Live Server and REST client reduces your reliance on external tools to complete\
    \ your work. All of these tools make your iteration process far much easier.\n\
    \nI hope this list has been introduced you to new VS Code extensions that can\
    \ help you in your workflow.\n\n# Chapter 6: Debugging JavaScript Projects with\
    \ VS Code & Chrome Debugger\n\n### by Michael Wanyoike\n\n**Debugging JavaScript\
    \ isn't the most fun aspect of JavaScript programming, but it's a vital skill.\
    \ This article covers two tools that will help you debug JavaScript like a pro.**\n\
    \nImagine for a moment that the `console.log()` function did not exist in JavaScript.\
    \ I'm pretty sure the first question you'd ask yourself would be “How am I ever\
    \ going to confirm my code is working correctly?”\n\nThe answer lies in using\
    \ debugging tools. For a long time, most developers, including myself, have been\
    \ using `console.log` to debug broken code. It’s quick and easy to use. However,\
    \ things can get finicky at times if you don't know where and what is causing\
    \ the bug. Often you'll find yourself laying down `console.log` traps all over\
    \ your code to see which one will reveal the culprit.\n\nTo remedy this, we need\
    \ to change our habits and start using debugging tools. There are a number of\
    \ tools available for debugging JavaScript code, such as the Chrome Dev Tools,\
    \ [Node Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/),\
    \ Node Inspect and others. In fact, every [major browser](https://www.w3schools.com/js/js_debugging.asp)\
    \ provides its own tools.\n\nIn this this article, we'll look at how to use the\
    \ debugging facilities provided by Visual Studio Code. We'll also look at how\
    \ to use the [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ extension that allows VS Code to integrate with Chrome Dev Tools. Once we're\
    \ finished, you'll never want to use a `console.log()` again.\n\n## Prerequisites\n\
    \nFor this tutorial, you only need to have a solid foundation in [modern JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/).\
    \ We’ll also look at how we can debug a test written using [Mocha and Chai](https://www.sitepoint.com/unit-test-javascript-mocha-chai/).\
    \ We'll be using a broken project, [debug-example](https://github.com/sitepoint-editors/debug-example),\
    \ to learn how to fix various bugs without using a single `console.log`. You'll\
    \ need the following to follow along:\n\n*   [Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)\n\
    \n*   [Visual Studio Code](https://code.visualstudio.com/)\n\n*   [Chrome Browser](https://www.google.com/chrome/)\n\
    \nStart by cloning the [debug-example](https://github.com/sitepoint-editors/debug-example)\
    \ project to your workspace. Open the project in VS Code and install the dependencies\
    \ via the integrated terminal:\n\n```\n# Install package dependencies\nnpm install\n\
    \n# Install global dependencies\nnpm install -g mocha\n```\n\nNow we're ready\
    \ to learn how to debug a JavaScript project in VS Code.\n\n## Debugging JavaScript\
    \ in VS Code\n\nThe first file I’d like you to look at is `src/places.js`. You'll\
    \ need to open the `debug-project` folder in VS Code (*File* > *Open Folder*)\
    \ and select the file from within the editor.\n\n```\nconst places = [];\n\nmodule.exports\
    \ = {\n  places,\n\n  addPlace: (city, country) => {\n    const id = ++places.length;\n\
    \    let numType = 'odd';\n    if (id % 2) {\n      numType = 'even';\n    }\n\
    \    places.push({\n      id, city, country, numType,\n    });\n  },\n};\n```\n\
    \nThe code is pretty simple, and if you have enough experience in coding you might\
    \ notice it has a couple of bugs. If you do notice them, please ignore them. If\
    \ not, perfect. Let's add a few of lines at the bottom to manually test the code:\n\
    \n```\nmodule.exports.addPlace('Mombasa', 'Kenya');\nmodule.exports.addPlace('Kingston',\
    \ 'Jamaica');\nmodule.exports.addPlace('Cape Town', 'South Africa');\n```\n\n\
    Now, I’m sure you’re itching to do a `console.log` to output the value of `places`.\
    \ But let's not do that. Instead, let's add **breakpoints**. Simply add them by\
    \ left-clicking on the gutter — that is, the blank space next to the line numbers:\n\
    \n![Red dots indicating breakpoints](Images/152442833001-breakpoint.png)\n\nSee\
    \ the red dots on the side? Those are the breakpoints. A breakpoint is simply\
    \ a visual indication telling the debugger tool where to pause execution. Next,\
    \ on the action bar, click the debug button (the icon that says “No Bugs Allowed”).\n\
    \n![The debug panel](Images/152442833202-debug-panel.png)\n\nLook at the top section.\
    \ You'll notice there’s a gear icon with a red dot. Simply click on it. A debug\
    \ configuration file, `launch.json`, will be created for you. Update the config\
    \ like this so that you can run VS Code's debugger on `places.js`:"
