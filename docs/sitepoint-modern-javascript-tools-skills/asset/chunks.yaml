  trans: "\n\n在浏览器中打开 `http://localhost:5000` 并观察发生了什么。初始只获取了 `bundle.js`。当点击按钮时，聊天模块被导入并初始化。\n\
    \n![显示分块懒性加载的网络请求](img/1521906882lazy-loading.png)\n\n只需极少少的努力，我们已经为应用添加了动态代码分割和模块的懒性加载。这是构建高性能\
    \ Web 应用程序的绝佳起点。\n\n## 插件 (Plugins)\n\n`loaders`（加载器）在单个文件上执行转换，而 `plugins`（插件）则在更大的代码块上运行。\n\
    \n既然我们正在打包代码、外部模块和静态资源，我们的构建包将会增长——*非常快*。插件的作用是为了帮助我们以巧妙的方式分割代码，并为生产环境进行优化。\n\n\
    在不经意间，我们已经使用了许多[带有“mode”的默认 Webpack 插件](https://webpack.js.org/concepts/mode/#usage)\n\
    \n### development (开发)\n\n- 提供值为“development”的 `process.env.NODE_ENV`\n- `NamedModulesPlugin`\n\
    \n### production (生产)\n\n- 提供值为“production”的 `process.env.NODE_ENV`\n- `UglifyJsPlugin`\n\
    - `ModuleConcatenationPlugin`\n- `NoEmitOnErrorsPlugin`\n\n#### Production (生产)\n\
    \n在添加额外的插件之前，我们将首先拆分配置，以便能够针对每个环境应用特定的插件。\n\n将 `webpack.config.js` 重命名为 `webpack.common.js`，并为开发和生产环境添加配置文件。\n\
    \n```\n- |- webpack.config.js\n+ |- webpack.common.js\n+ |- webpack.dev.js\n+\
    \ |- webpack.prod.js\n```\n\n我们将使用 `webpack-merge` 将通用配置与特定环境的配置合并：\n\n```\nnpm\
    \ install --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\n```javascript\n\
    const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n#### package.json\n\
    \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
    ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack\
    \ --watch --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
    \n  },\n```\n\n现在我们可以将开发环境特定的插件添加到 `webpack.dev.js`，将生产环境特定的插件添加到 `webpack.prod.js`。\n\
    \n#### Split CSS (分割 CSS)\n\n在使用 [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin)\
    \ 进行生产环境打包时，将 CSS 从 JavaScript 中分离出来被认为最佳实践。\n\n当前的 `.scss` 加载器非常适合开发，因此我们将它们从\
    \ `webpack.common.js` 移动到 `webpack.dev.js`，并仅在 `webpack.prod.js` 中添加 `ExtractTextWebpackPlugin`。\n\
    \n```\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta\n```\n\n\
    #### webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n    ...\n\
    \    module: {\n      rules: [\n-       {\n-         test: /\\.scss$/,\n-    \
    \     use: [\n-           loader: 'style-loader'\n-           }, {\n-        \
    \     loader: 'css-loader'\n-           }, {\n-             loader: 'sass-loader'\n\
    -           ]\n-       }\n        ...\n      ]\n    }\n  }\n```\n\n#### webpack.dev.js\n\
    \n```javascript\n const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development',\n+   module: {\n+ \
    \    rules: [\n+       {\n         test: /\\.scss$/,\n+         use: [\n     \
    \      loader: 'style-loader'\n           }, {\n             loader: 'css-loader'\n\
    \           }, {\n             loader: 'sass-loader'\n           ]\n       }\n\
    \     ]\n   }\n})\n```\n\n#### webpack.prod.js\n\n```javascript\n const merge\
    \ = require('webpack-merge')\n+ const ExtractTextPlugin = require('extract-text-webpack-plugin')\n\
    const common = require('./webpack.common.js')\n\nmodule.exports = merge(common,\
    \ {\n  mode: 'production',\n+   module: {\n+     rules: [\n+       {\n       \
    \  test: /\\.scss$/,\n         use ExtractTextPlugin.extract({\n           fallback:\
    \ 'style-loader',\n           use: ['css-loader', 'sass-loader']\n         })\n\
    +       }\n     ]\n   },\n\n   plugins: [\n+     new ExtractTextPlugin('style.css')\n\
    \   ]\n})\n```\n\n让我们比较一下构建脚本的输出：\n\n```\n> npm run develop\n\nAsset         \
    \  Size      Chunks           Chunk Names\napp.bundle.js   28.5 KiB  app   [emitted]\
    \  app\nchat.bundle.js  1.4 KiB   chat  [emitted]  chat\n```\n\n```\n> npm run\
    \ build\n\nAsset           Size       Chunks        Chunk Names\nchat.bundle.js\
    \  375 bytes  0  [emitted]  chat\napp.bundle.js   1.82 KiB   1  [emitted]  app\n\
    style.css       424 bytes  1  [emitted]  app\n```\n\n现在我们的 CSS 已经从生产环境构建包中提取出来，我们需要在\
    \ HTML 中通过 `<link>` 引用它。\n\n#### dist/index.html\n\n```html\n <!DOCTYPE html>\n\
    \  <<html>\n    <head>\n      <meta charset=\"UTF-8\">\n      <title>Code Splitting</title>\n\
    +     <link href=\"style.css\" rel=\"stylesheet\">\n    </head>\n    <body>\n\
    \      <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n    </body>\n\
    \  </html>\n```\n\n这允许在浏览器中并行下载 CSS 和 JavaScript，因此加载速度会比单个构建包更快。它还允许样式在 JavaScript\
    \ 下载完成之前显示出来。\n\n#### Generating HTML (生成 HTML)\n\n每当我们的输出发生变化时，都必须不断更新 `index.html`\
    \ 以引用新的文件路径。这正是 `html-webpack-plugin` 要完成的工作。\n\n我们可能还需要同时添加 `clean-webpack-plugin`\
    \ 来在每次构建之前清理 `dist` 目录。\n\n```\nnpm install --save-dev html-webpack-plugin clean-webpack-plugin\n\
    ```\n\n#### webpack.common.js\n\n```javascript\n const path = require('path')\n\
    + const CleanWebpackPlugin = require('clean-webpack-plugin');\n+ const HtmlWebpackPlugin\
    \ = require('html-webpack-plugin');\n\n  module.exports = {\n    ...\n   plugins:\
    \ [\n     new CleanWebpackPlugin(['dist']),\n     new HtmlWebpackPlugin({\n  \
    \     title: 'My killer app'\n     })]\n  }\n```\n\n现在每当我们构建时，`dist` 都会被清理。我们现在也能看到\
    \ `index.html` 输出，它包含了正确的路径。\n\n运行 `npm run develop` 输出如下：\n\n```html\n<!DOCTYPE\
    \ html>\n  <html>\n    <head>\n    <meta charset=\"UTF-8\">\n    <title>My killer\
    \ app</title>\n    </head>\n    <body>\n      <script type=\"text/javascript\"\
    \ src=\"app.bundle.js\"></script>\n    </body>\n  </html>\n```\n\n而 `npm run build`\
    \ 输出如下：\n\n```html\n<!DOCTYPE html>\n  <html>\n    <head>\n    <meta charset=\"\
    UTF-8\">\n    <title>My killer app</title>\n    <link href=\"style.css\" rel=\"\
    stylesheet\">\n    </head>\n    <body>\n      <script type=\"text/javascript\"\
    \ src=\"app.bundle.js\"></script>\n    </body>\n  </html>\n```\n\n## Development\
    \ (开发)\n\n`webpack-dev-server` 提供了一个简单的 Web 服务器并提供 `热重载`，因此你不需要刷新刷新即可看到更改。\n\n\
    #### package.json\n\n```json\n {\n    ...\n    \"scripts\": {\n-     \"develop\"\
    : \"webpack --watch --config webpack.dev.js\",\n+     \"develop\": \"webpack-dev-server\
    \ --config webpack.dev.js\",\n    }\n    ...\n  }\n```\n\n```\n> npm run develop\n\
    \nℹ ｢wds｣: 项目运行在 http://localhost:8080/\nℹ ｢wds｣: webpack 输出服务自 /\n```\n\n在浏览器中打开\
    \ `http://localhost:8080/` 并修改 JavaScript 或 CSS 文件之一。你应该看到它自动构建并刷新。\n\n### HotModuleReplacement\
    \ (热替换)\n\n`HotModuleReplacement` 插件比热重载更进一步，它可以在不刷新的情况下运行时交换模块。当配置得当时，这在单页应用的开发过程中可以节省大量时间。当页面上有大量状态时，你可以对组件进行增量更改，只有被更改的模块会被替换和更新。\n\
    \n"
