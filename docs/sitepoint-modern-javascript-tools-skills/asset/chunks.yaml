    \nWeb: www.sitepoint.com\n\nEmail: books@sitepoint.com\n\n## 关于 SitePoint\n\n\
    SitePoint 专门为 Web 行业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 获取我们的博客、书籍、时通讯、文章和社区论坛。你将在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n# 前言\n\n毫无疑问，JavaScript\
    \ 生态系统的变化非常迅速。不仅新工具和框架不断引入和开发，语言本身也随着 ES2015（又名 ES6）的引入发生了巨大变化。可以理解，有许多文章抱怨如今学习现代\
    \ JavaScript 开发有多么。我们的目标是通过这系列关于现代 JavaScript 的书籍来尽量减少这种困惑。\n\n本书概述了每个现代 JavaScript\
    \ 开发者应该掌握的基本工具和技能。\n\n## 谁应该读这本书？\n\n本书适合所有希望提高 JavaScript 技能的前端开发者。您需要熟悉 HTML\
    \ 和 CSS，并对 JavaScript 有合理的理解，才能跟上这些讨论。\n\n## 使用的规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\
    \n```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园散步的好日子。\n 鸟儿在歌唱，孩子们都回学校了。</p> \n```\n\n当需要现有代码来提供上下文而不是重复全部内容时，将显示\
    \ `⋮`：\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\
    \n某些代码行应该在一行内，但由于页面限制，我们不得不对它们进行换行。➥ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```\n URL.open(\"\
    http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\n你会注意到，我们在整本书中使用了一些特定的布局样式来表示不同类型的信息。请关注以下项目。\n\n#### 提示、注释与警告\n\n####\
    \ 嘿，你！\n\n提示（Tips）提供有用的小贴士。\n\n#### 咳，打扰一下……\n\n注释（Notes）是与当前主题相关但并非关重要的补充说明。将它们看作额外的信息片段。\n\
    \n#### 务必始终……\n\n...注意这些重要点。\n\n#### 注意！\n\n警告（Warnings）强调在过程中可能会让你绊倒的任何陷阱。\n\n\
    # 第 1 章：Babel 入门指南\n\n#### 作者：James Kolce\n\n**本文介绍了 [Babel](https://babeljs.io/)，它是一个\
    \ JavaScript 编译器，允许开发者今天就使用下一代 JavaScript。**\n\n在构建 Web 应用程序时编写 JavaScript 可能会令人沮丧。我们必须考虑目标浏览器中可用的功能，以及当某个功能未实现时会发生什么。有些人会建议干脆不要使用它，如果我们正在构建复杂的程序，这在大多数情况下是一种痛苦的经历。\n\
    \n幸运的是，某些工具允许我们停止担心支持情况，只需编写我们能写的最好的代码。它们被称为转译器（transpilers）。`transpiler` 是一种将源代码作为输入并产生新源代码作为输出的工具，具有不同的语法，但在语义上尽可能接近——或等同于原始。\n\
    \nBabel 几乎是将现代 JavaScript (ES2015+) 翻译为可在旧浏览器中运行的兼容实现的标准转译器。如果你只想专注于编写 JavaScript，它是完美的解决方案。\n\
    \n尽管 Babel 的主要目标是将最新的 ECMAScript (ES) 标准翻译给旧的（有时是当前的）浏览器，但它可以做得更多。存在一个预设（presets）和插件（plugins）的生态系统，使得添加非标准功能成为可能。每个插件为你的代码提供了新的功能/转换，而预设只是插件的集合。\n\
    \n## 开始上手\n\n根据你的项目和使用的工具，设置 Babel 有多种方法。本文中，我们将解释如何使用 CLI 设置 Babel，尽管如果你正在使用构建系统或框架，可以查看[官方网站](https://babeljs.io/docs/setup/)上的特定说明。大多数情况下，CLI\
    \ 是最快最简单的方法。如果你是第一次用户，请继续。\n\n在项目上设置 Babel 的第一步是使用 [npm 安装该包](https://babeljs.io/docs/setup/)（此处包）并将其作为开发依赖。假设你已经准备好了\
    \ Node.js 环境，只需在终端中运行以下命令：\n\n```\nmkdir babel-test\ncd babel-test\nnpm init -y\n\
    npm install --save-dev babel\n```\n\n这将创建一个目录(`babel-test`)，进入该目录，初始化 npm 项目（从而创建一个\
    \ `package.json` 文件），然后作为开发依赖安装 `babel-cli`。\n\n如果你对上述内容有任何疑问，请参考我们关于[安装 Node](https://www.sitepoint.com/quick-tip-multiple-versions-nvm/)\
    \ 和[使用 npm](https://www.sitepoint.com/beginners-guide-node-manager/) 的教程。\n\n\
    接下来，我们可以打开 `package.json` 在 npm 脚本中添加 `build` 命令：\n\n```json\n\"scripts\": {\n\
    \  \"build\": \"babel src -d dist\"\n}\n```\n\n这将从 src 目录提取源代码到 dist 目录。然后我们可以执行：\n\
    \n```\nnpm run build\n```\n\n等一下！在运行 Babel 之前，我们必须安装并设置转换代码的插件。此最简单快速的方法是添加 [Env\
    \ 预设](https://babeljs.io/docs/plugins/preset-env/)，它根据你指定的浏览器选择合适的插件。可以使用以下命令安装：\n\
    \n```\nnpm install babel-preset-env --save-dev\n```\n\n然后在项目根目录下创建一个 `.babelrc`\
    \ 文件并添加预设：\n\n```json\n{\n  \"presets\": [\"env\"]\n}\n```\n\n`.babelrc` 文件是你放置所有\
    \ Babel 设置的地方。你将主要使用它来设置预设和插件，但还有更多选项。你可以在 [Babel API 页面](https://babeljs.io/docs/usage/api/#options)\
    \ 查看完整列表。\n\n请注意，取决于你的操作系统，以点开头的文件默认是隐藏的。如果这对你来说有问题（或者你只是更喜欢更少的文件），可以将 Babel 设置放在\
    \ `package.json` 文件中，`babel` 键下，如下：\n\n```json\n{\n  \"name\": \"babel-test\"\
    ,\n  \"version\": \"1.0.0\",\n  \"babel\": {\n    // config\n  }\n}\n```\n\n"
- fmt: "\nFinally, let’s create the directories and files Babel is expecting to find:\n\
    \n```\nmkdir src dist\n```\n\nAnd give it something to transform:\n\n```\nlet\
    \ a = 1;\nlet b = 2;\n[a, b] = [b, a];\nconsole.log(a);\nconsole.log(b);\n```\n\
    \nThis example uses [destructuring assignment](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/)\
    \ to swap the values of two variables.\n\n## Running Babel\n\nNow that you have\
    \ a ready-to-use Babel installation, you can execute the `build` command to run\
    \ the compilation process:\n\n```\nnpm run build\n```\n\nThis will take the code\
    \ from `src/main.js`, transform it to ES5 code and output the transformed code\
    \ to `dist/main.js`.\n\nHere’s what it produced:\n\n```\n\"use strict\";\n\nvar\
    \ a = 1;\nvar b = 2;\nvar _ref = [b, a];\na = _ref[0];\nb = _ref[1];\n\nconsole.log(a);\n\
    console.log(b);\n```\n\nAs you can see, `let` has been replaced by `var` and Babel\
    \ has introduced a temporary variable (denoted by the underscore) to facilitate\
    \ the swap.\n\nAnd that’s it. The code that you write in the `src` directory will\
    \ be translated to previous versions of the language. By default, if you don’t\
    \ add any options to the preset, it will load all the transformations. You can\
    \ also indicate the target browsers as follows:\n\n```jsonjson\n  \"presets\"\
    : [\n    [\"env\", {\n      \"targets\": {\n        \"browsers\": [\"last 2 versions\"\
    , \"safari >= 7\"]\n      }\n    }]\n  ]\n}\n```\n\nThis will load the required\
    \ transformations to support the latest two versions of each browser and Safari\
    \ greater or equal to version 7. You can find the available options for the target\
    \ browsers in the [Browserlist repository](https://github.com/ai/browserslist#queries).\n\
    \n## Babel Ecosystem: A Quick Overview\n\nAs you noticed in the previous section,\
    \ Babel won’t do anything by itself when you install it. We have to install a\
    \ set of plugins to obtain the desired behavior, or we can use presets, which\
    \ are predefined sets of plugins.\n\nUsually, each feature that you want to include\
    \ will be in the form of a plugin. Some examples for ES2015 include:\n\n* [constants](https://babeljs.io/docs/plugins/check-es2015-constants/)\n\
    * [arrow functions](https://babeljs.io/docs/plugins/transform-es2015-arrow-functions/)\n\
    * [block-scoped functions](https://babeljs.io/docs/plugins/transform-es2015-block-scoped-functions/)\n\
    * [classes](https://babeljs.io/docs/plugins/transform-es2015-classes/)\n* [for-of](https://babeljs.io/docs/plugins/transform-es2015-for-of/)\n\
    * [spread](https://babeljs.io/docs/plugins/transform-es2015-spread/)\n* [template\
    \ literals](https://babeljs.io/docs/plugins/transform-es2015-template-literals/)\n\
    \nSee the [Plugins page](https://babeljs.io/docs/plugins/#transform-plugins) in\
    \ the Babel Docs for a complete list.\n\nBut sometimes you don’t want to include\
    \ all the plugins one by one. So there are prebuilt presets that will facilitate\
    \ the process of installing each plugin.\n\nThe three official presets currently\
    \ available are:\n\n* [Env](https://babeljs.io/docs/plugins/preset-env/)\n* [React](https://babeljs.io/docs/plugins/preset-react/)\n\
    * [Flow](https://babeljs.io/docs/plugins/preset-flow/)\n\n`Env` is the most frequently\
    \ used and the one we’ve used here. It automatically loads all the necessary transformations\
    \ to make your code compatible depending on the targeted browsers.\n\nThe `React`\
    \ preset transforms code typically found in React projects, mainly adding compatibility\
    \ with [Flow](https://flow.org/) annotations and [JSX](https://facebook.github.io/jsx/).\n\
    \nAnd finally, the `Flow` preset is used to clean up the code from [Flow](https://flow.org/)\
    \ type annotations (although it doesn’t check whether the types are valid or not.)\n\
    \n### Babel Polyfill\n\nThere are JavaScript features that can’t be transformed\
    \ syntactically, usually because there’s no equivalent functionality implemented\
    \ — for example, Promises and generator functions.\n\nThose kinds of features\
    \ have to be implemented in the browser by a library to be used in your code,\
    \ and that’s the work of a polyfill.\n\nThe Babel polyfill is composed by [core-js](https://github.com/zloirock/core-js)\
    \ and the [Regenerator](https://github.com/facebook/regenerator) runtime. Together,\
    \ they cover all the features in ES2015+.\n\n### Advanced Use\n\nAs mentioned,\
    \ Babel can also be used to transform features that haven’t yet been implemented\
    \ in the language. A good example of this is the class fields proposal (currently\
    \ at [TC39 stage 3: candidate](https://github.com/tc39/proposal-class-fields)).\
    \ This is particularly popular among React devs, as it removes the necessity to\
    \ explicitly bind methods to a particular component, and also means that a component’s\
    \ `state` can be declared as a class.\n"
  raw: "Finally, let’s create the directories and files Babel is expecting to find:\n\
    \n```\nmkdir src dist\n```\n\nAnd give it something to transform:\n\n```\nlet\
    \ a = 1;\nlet b = 2;\n[a, b] = [b, a];\nconsole.log(a);\nconsole.log(b);\n```\n\
    \nThis example uses [destructuring assignment](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/)\
    \ to swap the values of two variables.\n\n## Running Babel\n\nNow that you have\
    \ a ready-to-use Babel installation, you can execute the `build` command to run\
    \ the compilation process:\n\n```\nnpm run build\n```\n\nThis will take the code\
    \ from `src/main.js`, transform it to ES5 code and output the transformed code\
    \ to `dist/main.js`.\n\nHere’s what it produced:\n\n```\n\"use strict\";\n\nvar\
    \ a = 1;\nvar b = 2;\nvar _ref = [b, a];\na = _ref[0];\nb = _ref[1];\n\nconsole.log(a);\n\
    console.log(b);\n```\n\nAs you can see, `let` has been replaced by `var` and Babel\
    \ has introduced a temporary variable (denoted by the underscore) to facilitate\
    \ the swap.\n\nAnd that’s it. The code that you write in the `src` directory will\
    \ be translated to previous versions of the language. By default, if you don’t\
    \ add any options to the preset, it will load all the transformations. You can\
    \ also indicate the target browsers as follows:\n\n```\n{\n  \"presets\": [\n\
    \    [\"env\", {\n      \"targets\": {\n        \"browsers\": [\"last 2 versions\"\
    , \"safari >= 7\"]\n      }\n    }]\n  ]\n}\n```\n\nThis will load the required\
    \ transformations to support the latest two versions of each browser and Safari\
    \ greater or equal to version 7\\. You can find the available options for the\
    \ target browsers in the [Browserlist repository](https://github.com/ai/browserslist#queries).\n\
    \n## Babel Ecosystem: A Quick Overview\n\nAs you noticed in the previous section,\
    \ Babel won’t do anything by itself when you install it. We have to install a\
    \ set of plugins to obtain the desired behavior, or we can use presets, which\
    \ are predefined sets of plugins.\n\nUsually, each feature that you want to include\
    \ will be in the form of a plugin. Some examples for ES2015 include:\n\n*   [constants](https://babeljs.io/docs/plugins/check-es2015-constants/)\n\
    \n*   [arrow functions](https://babeljs.io/docs/plugins/transform-es2015-arrow-functions/)\n\
    \n*   [block-scoped functions](https://babeljs.io/docs/plugins/transform-es2015-block-scoped-functions/)\n\
    \n*   [classes](https://babeljs.io/docs/plugins/transform-es2015-classes/)\n\n\
    *   [for-of](https://babeljs.io/docs/plugins/transform-es2015-for-of/)\n\n*  \
    \ [spread](https://babeljs.io/docs/plugins/transform-es2015-spread/)\n\n*   [template\
    \ literals](https://babeljs.io/docs/plugins/transform-es2015-template-literals/)\n\
    \nSee the [Plugins page](https://babeljs.io/docs/plugins/#transform-plugins) in\
    \ the Babel Docs for a complete list.\n\nBut sometimes you don’t want to include\
    \ all the plugins one by one. So there are prebuilt presets that will facilitate\
    \ the process of installing each plugin.\n\nThe three official presets currently\
    \ available are:\n\n*   [Env](https://babeljs.io/docs/plugins/preset-env/)\n\n\
    *   [React](https://babeljs.io/docs/plugins/preset-react/)\n\n*   [Flow](https://babeljs.io/docs/plugins/preset-flow/)\n\
    \n**Env** is the most frequently used and the one we’ve used here. It automatically\
    \ loads all the necessary transformations to make your code compatible depending\
    \ on the targeted browsers.\n\nThe **React** preset transforms code typically\
    \ found in React projects, mainly adding compatibility with [Flow](https://flow.org/)\
    \ annotations and [JSX](https://facebook.github.io/jsx/).\n\nAnd finally, the\
    \ **Flow** preset is used to clean up the code from [Flow](https://flow.org/)\
    \ type annotations (although it doesn’t check whether the types are valid or not.)\n\
    \n### Babel Polyfill\n\nThere are JavaScript features that can’t be transformed\
    \ syntactically, usually because there’s no equivalent functionality implemented\
    \ — for example, Promises and generator functions.\n\nThose kinds of features\
    \ have to be implemented in the browser by a library to be used in your code,\
    \ and that’s the work of a polyfill.\n\nThe Babel polyfill is composed by [core-js](https://github.com/zloirock/core-js)\
    \ and the [Regenerator](https://github.com/facebook/regenerator) runtime. Together,\
    \ they cover all the features in ES2015+.\n\n### Advanced Use\n\nAs mentioned,\
    \ Babel can also be used to transform features that haven’t yet been implemented\
    \ in the language. A good example of this is the class fields proposal (currently\
    \ at [TC39 stage 3: candidate](https://github.com/tc39/proposal-class-fields)).\
    \ This is particularly popular among React devs, as it removes the necessity to\
    \ explicitly bind methods to a particular component, and also means that a component’s\
    \ `state` can be declared as a class field (potentially eliminating the need for\
    \ a constructor).\n\nFor those of you wanting to use class fields today, you would\
    \ need to add the [babel-plugin-transform-class-properties](https://babeljs.io/docs/plugins/transform-class-properties/)\
    \ as a dev dependency:\n\n```\nnpm install --save-dev babel-plugin-transform-class-properties\n\
    ```\n\nYou’d also update your `.babelrc` file as follows:\n\n```\n{\n  \"presets\"\
    : [\"env\"],\n  \"plugins\": [\"transform-class-properties\"]\n}\n```\n\nNow you\
    \ can write:\n\n```\nclass App extends Component {\n  state = { count: 0 };\n\n\
    \  incCount = () => {\n    this.setState(ps => ({ count: ps.count + 1 }));\n \
    \ };\n\n  render() {\n    return (\n      <div>\n        <p>{ this.state.count\
    \ }</p>\n        <button onClick={this.incCount}>add one</button>\n      </div>\n\
    \    );\n  }\n}\n```\n\nAnd it doesn’t stop there. You can also use Babel to add\
    \ new features of your own to the language, as our tutorial [Understanding ASTs\
    \ by Building Your Own Babel Plugin](https://www.sitepoint.com/understanding-asts-building-babel-plugin/)\
    \ demonstrates.\n\n## Alternatives\n\nWriting modern web applications sometimes\
    \ requires more than the features available in JavaScript. Other languages can\
    \ also be translated to compatible JavaScript but also implement other useful\
    \ features.\n\nThe most popular option is [TypeScript](http://www.typescriptlang.org/),\
    \ which is regular JavaScript that implements modern ES features but also adds\
    \ others, especially regarding type safety.\n\nOn the other extreme, there are\
    \ entirely different languages across different categories, from the functional\
    \ ones like PureScript to the object-oriented like Dart.\n\nFor a deeper overview\
    \ of alternative languages, take a look at [10 Languages that Compile to JavaScript](https://www.sitepoint.com/10-languages-compile-javascript/).\n\
    \n## Conclusion\n\nBabel is a great option for writing modern applications while\
    \ still serving up JavaScript that can be understood by all developers and the\
    \ wide range of browsers the code needs to run in.\n\nBabel is not only useful\
    \ for transforming ES2015+ to previous versions of the language — both in the\
    \ browser and on platforms such as Node.js — but also for adding new features\
    \ that aren’t part of the standard. To see what I mean, just take a look at the\
    \ npm directory to find all the available Babel [plugins](https://www.npmjs.com/search?q=babel-plugin)\
    \ or [presets](https://www.npmjs.com/search?q=babel-preset).\n\nAs JavaScript\
    \ is evolving at such a rapid pace, it’s obvious that browser manufacturers will\
    \ need a while to implement the latest features. Giving Babel a place in your\
    \ toolkit means that you can write cutting-edge JavaScript today, safe in the\
    \ knowledge that you’re not abandoning any of your users. What’s not to love?\n\
    \n# Chapter 2: A Beginner’s Guide to Webpack 4 and Module Bundling\n\n### by Mark\
    \ Brown\n\n**The [Webpack 4 docs](https://github.com/webpack/webpack) state that:**\n\
    \n> Webpack is a module bundler. Its main purpose is to bundle JavaScript files\
    \ for usage in a browser, yet it is also capable of transforming, bundling, or\
    \ packaging just about any resource or asset."
