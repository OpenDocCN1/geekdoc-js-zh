    ```\n\n我们 CSS 中的背景图像也由 `file-loader` 处理。\n\n`src/style.scss`\n\n```scss\n $bluegrey:\
    \ #2b3a42;\n\n  pre {\n    padding: 8px 16px;\n-   background: $bluegrey;\n+ \
    \  background: $bluegrey url(\"code.png\") no-repeat center center / 32px 32px;\n\
    \    color: #e1e6e9;\n    font-family: Menlo, Courier, monospace;\n    font-size:\
    \ 13px;\n    line-height: 1.5;\n    text-shadow: 0 1px 0 rgba(23, 31, 35, 0.5);\n\
    \    border-radius: 3px;\n  }\n```\n\n我们 CSS 中的背景图像也由 `file-loader` 处理。\n\n`src/style.scss`\n\
    \n```scss\n $bluegrey: #2b3a42;\n\n  pre {\n    padding: 8px 16px;\n-   background:\
    \ $bluegrey;\n+   background: $bluegrey url(\"code.png\") no-repeat center center\
    \ / 32px 32px;\n    color: #e1e6e9;\n    font-family: Menlo, Courier, monospace;\n\
    \    font-size: 13px;\n    line-height: 1.5;\n    text-shadow: 0 1px 0 rgba(23,\
    \ 31, 35, 0.5);\n    border-radius: 3px;\n  }\n```\n"
- fmt: "\nOpen `http://localhost:5000` in the browser and see what happens. Only `bundle.js`\
    \ is fetched initially. When the button is clicked, the chat module is imported\
    \ and initialized.\n\n![Network requests showing lazy loading of chunks](Images/1521906882lazy-loading.png)\n\
    \nWith very little effort, we’ve added dynamic code splitting and lazy loading\
    \ of modules to our app. This is a great starting point for building a highly\
    \ performant web app.\n\n## Plugins\n\nWhile `loaders` operate transforms on single\
    \ files, `plugins` operate across larger chunks of code.\n\nNow that we’re bundling\
    \ our code, external modules and static assets, our bundle will grow — *quickly*.\
    \ Plugins are here to help us split our code in clever ways and optimize things\
    \ for production.\n\nWithout knowing it, we’ve actually already used many [default\
    \ Webpack plugins with “mode”](https://webpack.js.org/concepts/mode/#usage)\n\n\
    ### development\n\n- Provides `process.env.NODE_ENV` with value “development”\n\
    - `NamedModulesPlugin`\n\n### production\n\n- Provides `process.env.NODE_ENV`\
    \ with value “production”\n- `UglifyJsPlugin`\n- `ModuleConcatenationPlugin`\n\
    - `NoEmitOnErrorsPlugin`\n\n#### Production\n\nBefore adding additional plugins,\
    \ we’ll first split our config up so that we can apply plugins specific to each\
    \ environment.\n\nRename `webpack.config.js` to `webpack.common.js` and add a\
    \ config file for development and production.\n\n```\n- |- webpack.config.js\n\
    + |- webpack.common.js\n+ |- webpack.dev.js\n+ |- webpack.prod.js\n```\n\nWe’ll\
    \ use `webpack-merge` to combine our common config with the environment-specific\
    \ config:\n\n```\nnpm install --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n#### package.json\n\
    \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
    ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack\
    \ --watch --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
    \n  },\n```\n\nNow we can add plugins specific to development into `webpack.dev.js`\
    \ and plugins specific to production in `webpack.prod.js`.\n\n#### Split CSS\n\
    \nIt’s considered best practice to split your CSS from your JavaScript when bundling\
    \ for production using [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin).\n\
    \nThe current `.scss` loaders are perfect for development, so we’ll move those\
    \ from `webpack.common.js` into `webpack.dev.js` and add `ExtractTextWebpackPlugin`\
    \ to `webpack.prod.js` only.\n\n```\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta\n\
    ```\n\n#### webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n \
    \   ...\n    module: {\n      rules: [\n-       {\n-         test: /\\.scss$/,\n\
    -         use: [\n-           loader: 'style-loader'\n-           }, {\n-    \
    \         loader: 'css-loader'\n-           }, {\n-             loader: 'sass-loader'\n\
    -           ]\n-       }\n        ...\n      ]\n    }\n  }\n```\n\n#### webpack.dev.js\n\
    \n```javascript\n const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development',\n+   module: {\n+ \
    \    rules: [\n+       {\n         test: /\\.scss$/,\n+         use: [\n+    \
    \       loader: 'style-loader'\n+           }, {\n+             loader: 'css-loader'\n\
    +           }, {\n+             loader: 'sass-loader'\n+           ]\n+      \
    \ }\n+     ]\n+   }\n})\n```\n\n#### webpack.prod.js\n\n```javascript\n const\
    \ merge = require('webpack-merge')\n+ const ExtractTextPlugin = require('extract-text-webpack-plugin')\n\
    const common = require('./webpack.common.js')\n\nmodule.exports = merge(common,\
    \ {\n  mode: 'production',\n+   module: {\n+     rules: [\n+       {\n       \
    \  test: /\\.scss$/,\n+         use ExtractTextPlugin.extract({\n           fallback:\
    \ 'style-loader',\n           use: ['css-loader', 'sass-loader']\n         })\n\
    +       }\n+     ]\n+   },\n+   plugins: [\n+     new ExtractTextPlugin('style.css')\n\
    +   ]\n})\n```\n\nLet’s compare the output of our build scripts:\n\n```\n> npm\
    \ run develop\n\nAsset           Size      Chunks           Chunk Names\napp.bundle.js\
    \   28.5 KiB  app   [emitted]  app\nchat.bundle.js  1.4 KiB   chat  [emitted]\
    \  chat\n```\n\n```\n> npm run build\n\nAsset           Size       Chunks    \
    \    Chunk Names\nchat.bundle.js  375 bytes  0  [emitted]  chat\napp.bundle.js\
    \   1.82 KiB   1  [emitted]  app\nstyle.css       424 bytes  1  [emitted]  app\n\
    ```\n\nNow that our CSS is extracted from our JavaScript bundle for production,\
    \ we need to `<link>` to it from our HTML.\n\n#### dist/index.html\n\n```html\n\
    \ <!DOCTYPE html>\n  <html>\n    <head>\n      <meta charset=\"UTF-8\">\n    \
    \  <title>Code Splitting</title>\n+     <link href=\"style.css\" rel=\"stylesheet\"\
    >\n    </head>\n    <body>\n      <script type=\"text/javascript\" src=\"app.bundle.js\"\
    ></script>\n    </body>\n  </html>\n```\n\nThis allows for parallel download of\
    \ the CSS and JavaScript in the browser, so will be faster-loading than a single\
    \ bundle. It also allows the styles to be displayed before the JavaScript finishes\
    \ downloading.\n\n#### Generating HTML\n\nWhenever our outputs have changed, we’ve\
    \ had to keep updating `index.html` to reference the new file paths. This is precisely\
    \ what `html-webpack-plugin` was created to do for us automatically.\n\nWe may\
    \ as well add `clean-webpack-plugin` at the same time to clear out our `/dist`\
    \ directory before each build.\n\n```\nnpm install --save-dev html-webpack-plugin\
    \ clean-webpack-plugin\n```\n\n#### webpack.common.js\n\n```javascript\n const\
    \ path = require('path')\n+ const CleanWebpackPlugin = require('clean-webpack-plugin');\n\
    + const HtmlWebpackPlugin = require('html-webpack-plugin');\n\n  module.exports\
    \ = {\n    ...\n+   plugins: [\n     new CleanWebpackPlugin(['dist']),\n     new\
    \ HtmlWebpackPlugin({\n       title: 'My killer app'\n     })\n   ]\n  }\n```\n\
    \nNow every time we build, `dist` will be cleared out. We’ll now see `index.html`\
    \ output too, with the correct paths to our entry bundles.\n\nRunning `npm run\
    \ develop` produces this:\n\n```html\n<!DOCTYPE html>\n  <html>\n    <head>\n\
    \    <meta charset=\"UTF-8\">\n    <title>My killer app</title>\n  </head>\n \
    \ <body>\n    <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n\
    \  </body>\n  </html>\n```\n\nAnd `npm run build` produces this:\n\n```html\n\
    <!DOCTYPE html>\n  <html>\n    <head>\n    <meta charset=\"UTF-8\">\n    <title>My\
    \ killer app</title>\n    <link href=\"style.css\" rel=\"stylesheet\">\n  </head>\n\
    \  <body>\n    <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n\
    \  </body>\n  </html>\n```\n\n## Development\n\nThe `webpack-dev-server` provides\
    \ you with a simple web server and gives you `live reloading`, so you don’t need\
    \ to manually refresh the page to see changes.\n\n```\nnpm install --save-dev\
    \ webpack-dev-server\n```\n\n#### package.json\n\n```json\n {\n    ...\n    \"\
    scripts\": {\n-     \"develop\": \"webpack --watch --config webpack.dev.js\",\n\
    +     \"develop\": \"webpack-dev-server --config webpack.dev.js\",\n    }\n  \
    \  ...\n  }\n```\n\n```\n> npm run develop\n\nℹ ｢wds｣: Project is running at http://localhost:8080/\n\
    ℹ ｢wds｣: webpack output is served from /\n```\n\nOpen up `http://localhost:8080/`\
    \ in the browser and make a change to one of the JavaScript or CSS files. You\
    \ should see it build and refresh automatically.\n\n### HotModuleReplacement\n\
    \nThe `HotModuleReplacement` plugin goes one step further than Live Reloading\
    \ and swaps out modules at runtime without the refresh. When configured correctly,\
    \ this saves a huge amount of time during development of single page apps. Where\
    \ you have a lot of state in the page, you can make incremental changes to components,\
    \ and only the changed modules are replaced and updated.\n"
