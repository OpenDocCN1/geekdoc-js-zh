    \ => {\n  places.length = 0;\n});\n```\n\n重启调试器并让它停在断点处。现在 `places` 数组有了一个干净的状态。这应该允许我们的测试在不受污染的情况下运行。只需点击*Continue*（继续）让剩下的测试代码执行。\n\
