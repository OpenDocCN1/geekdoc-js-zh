    ```\n\nCoffeeScript 网站有一个实用的 [CoffeeScript 2 快速入门](http://coffeescript.org/v2/#coffeescript-2)\
    \ 资源。\n\n## ClojureScript\n\nClojureScript 是一个将 Clojure 编程语言翻译为 JavaScript 的编译器。它是一种通用的函数式语言，具有动态类型并支持不可变数据结构。\n\
    \n它是列表中唯一属于 Lisp 编程语言家族的，自然而然，它共享了许多特征。例如，代码可以被视为数据，并且提供了宏系统，使得元编程技术成为可能。与其他 Lisps\
    \ 不同，Clojure 支持不可变数据结构，这使得副作用的管理变得更加简单。\n\n由于使用了括号，这种语法对初学者来说可能望而生畏，但这种设计有深层次的原因，从长远来看，你一定会欣赏它的。语法上的极简主义和它的语法抽象能力使得\
    \ Lisp 成为解决需要高层次抽象问题的强大工具。\n\n尽管 Clojure 主要是一门函数式语言，但它并不像 PureScript 或 Elm 那样纯粹。副作用仍然会发生，但其他函数式特征依然存在。\n\
    \nClojureScript 使用 Google Closure 进行代码优化，并且与现有的 JavaScript 库兼容：\n\n```js\n; 提取自\
    \ https://github.com/clojure/clojurescript/blob/master/samples/dom/src/dom/test.cljs\n\
    \n(ns dom.test\n  (:require [clojure.browser.event :as event]\n            [clojure.browser.dom\
    \   :as dom]))\n\n(defn log [& args]\n  (.log js/console (apply pr-str args)))\n\
    \n(defn log-obj [obj]\n  (.log js/console obj))\n\n(defn log-listener-count []\n\
    \  (log \"listener count: \" (event/total-listener-count)))\n\n(def source   \
    \   (dom/get-element \"source\"))\n(def destination (dom/get-element \"destination\"\
    ))\n\n(dom/append source\n            (dom/element \"Testing me \")\n        \
    \    (dom/element \"out!\"))\n\n(def success-count (atom 0))\n\n(log-listener-count)\n\
    \n(event/listen source\n              :click\n              (fn [e]\n        \
    \        (let [i (swap! success-count inc)\n                      e (dom/element\
    \ :li\n                                      {:id \"testing\"\n              \
    \                        :class \"test me out please\"}\n                    \
    \                  \"It worked!\")]\n                  (log-obj e)\n         \
    \         (log i)\n                  (dom/append destination\n               \
    \               e))))\n\n(log-obj (dom/element \"Text node\"))\n(log-obj (dom/element\
    \ :li))\n(log-obj (dom/element :li {:class \"foo\"}))\n(log-obj (dom/element :li\
    \ {:class \"bar\"} \"text node\"))\n(log-obj (dom/element [:ul [:li :li :li]]))\n\
    (log-obj (dom/element :ul [:li :li :li]))\n(log-obj (dom/element :li {} [:ul {}\
    \ [:li :li :li]]))\n(log-obj (dom/element [:li {:class \"baz\"} [:li {:class \"\
    quux\"}]]))\n\n(log-obj source)\n(log-listener-count)\n```\n\n想要了解更多，请访问 ClojureScript\
    \ 网站的 [ClojureScript 快速入门](https://clojurescript.org/guides/quick-start) 资源。\n\
    \n## Scala.js\n\nScala.js 是将 Scala 编程语言翻译为 JavaScript 的编译器。Scala 旨在将面向对象和函数式编程的思想合并到一种语言中，创建一个既强大又易于采用的工具。\n\
    \n作为一种强类型语言，你可以获得带有部分类型推断的灵活类型系统的优势。大多数值可以被推断，但函数参数仍然需要显式的类型注解。\n\n虽然它支持许多常见的面向对象模式（例如，每个值都是对象，操作是方法调用），但你也可以获得函数式特征，如支持一等函数和不可变数据结构。\n\
    \nScala.js 的特殊优势之一是，你可以从熟悉的面向对象方法开始，根据需要并按照自己的速度转向更具函数式的方法，而无需进行大量工作。此外，现有的 JavaScript\
    \ 代码和库与你的 Scala 代码兼容。\n\n初 Scala 开发者会发现这种语言与 JavaScript 没有太大区别。对比以下等效代码：\n\n```javascript\n\
    // JavaScript\nvar xhr = new XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
