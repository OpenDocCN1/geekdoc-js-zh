    \ 页面获取更多信息。\n\n# Nim\n\n`Nim` 是一种静态类型多范式编程语言，语法极简且对空格敏感，它可以编译为 JavaScript 以及 C、C++。\n\
    \n语言本身非常精简，但它的元编程能力使其非常适合自己实现你可能在其他语言中发现内置的功能。实现这些功能的构建块是 `macros`、`templates`\
    \ 和 `generics`，通过它们你可以实现从简单功能到不同范式的各种内容。这使得 `Nim` 了一种极其多功能的语言，可以秉持 `Lisp` 的精神适应你的需求。\n\
    \n`Nim` 的语法抽象特性允许你根据自己的问题调整语言，从而实现真正的 [领域语言 (DSLs)](https://en.wikipedia.org/wiki/Domain-specific_language)。如果你有特殊的任务需要解决，你可以获得更高层次的表达能力：\n\
    \n```nim\n# 反转字符串\nproc reverse(s: string): string =\n  result = \"\"\n  for i\
    \ in countdown(high(s), 0):\n    result.add s[i]\n\nvar str1 = \"Reverse This!\"\
    \necho \"Reversed: \", reverse(str1)\n\n# 使用模板\ntemplate genType(name, fieldname:\
    \ expr, fieldtype: typedesc) =\n  type\n    name = object\n      fieldname: fieldtype\n\
    \ngenType(Test, foo, int)\n\nvar x = Test(foo: 4566)\necho(x.foo) # 4566\n```\n\
    \nNim 网站有一些实用的[入门](https://nim-lang.org/documentation.html) 文档提供更多信息。\n\n# 结论\n\
    \n如果 `JavaScript` 不是你喜欢的语言，你仍然可以创建 Web 应用程序，而无需忍受该技术的缺点。创建这些应用程序的选项涵盖了广泛审美，从像\
    \ `PureScript` 这样的纯函数式语言到像 `Dart` 这样的面向对象语言。如果你想要比一对一语言翻译更多的东西，还有像 `Elm` 这样的选项，它为你提供了虚拟\
    \ DOM 和内置架构等工具。\n\n# 第 5 章：JavaScript 开发者必备的 10 个 VS Code 扩展\n\n# 作者 Michael Wanyoike\n\
    \n在本文中，我将重点介绍一份 JavaScript 开发者必备的 VS Code 扩展列表。\n\n[Visual Studio Code](https://code.visualstudio.com/)\
    \ 无疑是今天最受欢迎的轻量级代码编辑器。它大量借鉴了其他流行的代码编辑器，主要是 `Sublime Text` 和 `Atom`。然而，它的成功主要源于提供更好的性能和稳定性的能力。此外，它还提供了许多所需的功能，如\
    \ `IntelliSense`，这些功能以前只在 `Eclipse` 或 `Visual Studio 2017` 等全功能 IDE 中可用。\n\n`VS\
    \ Code` 的力量无疑来自于[市场](https://marketplace.visualstudio.com/vscode)。得益于优秀的开源社区，该编辑器现在能够支持几乎所有的编程语言、框架和开发技术。对库或框架的支持以多种方式实现，主要包括针对特定技术的代码片段（snippets）、语法高亮、[Emmet](https://emmet.io/)\
    \ 和 `IntelliSense` 功能。\n\n## 按类别划分 VS Code 扩展\n\n对于本文，我将特别关注针对 JavaScript 开发者的\
    \ VS Code 扩展。目前有许多符合这一标准的 VS Code 扩展，这意味着我无法提到所有的扩展。相反，我将重点介绍受欢迎且对 JavaScript\
    \ 开发者不可或缺的 VS Code 扩展。为了简单起见，我将它们分为十类。\n\n## 代码片段类扩展\n\n当你第一次安装 VS Code 时，它带了一些\
    \ `JavaScript` 和 `Typescript` 的代码片段。在你开始编写现代 JavaScript 之前，你需要一些额外的代码片段来帮助快速编写重复的\
    \ ES6/ES7 代码：\n\n*   [VS Code JavaScript (ES6) 代码片段](https://marketplace.visualstudio.com/items?itemName=xabikos.JavaScriptSnippets)：目前最受欢迎，截至目前安装量超过\
    \ 120 万次。该扩展为 `JavaScript`、`TypeScript`、`HTML`、`React` 和 `Vue` 扩展提供了 ES6 语法。\n\
    \n*   [JavaScript Snippet Pack](https://marketplace.visualstudio.com/items?itemName=akamud.vscode-javascript-snippet-pack)：JavaScript\
    \ 有用代码片段集合。\n\n*   [Atom JavaScript Snippet](https://marketplace.visualstudio.com/items?itemName=gluons.vscode-atom-javascript-snippet)：从\
    \ `atom/language-javascript` 扩展移植的 JavaScript 代码片段。\n\n*   [JavaScript Snippets](https://marketplace.visualstudio.com/items?itemName=nathanchapman.JavaScriptSnippets)：ES6\
    \ 代码片段集。该扩展包含 `Mocha`、`Jasmine` 以及其他 BDD 测试框架的代码片段。\n\n## 语法类扩展\n\nVS Code 自带了良好的\
    \ `JavaScript` 代码语法高亮。你可以通过安装主题来更改颜色。然而，如果你需要某种程度的可读性，就需要语法高亮器。这里有几个：\n\n*   [JavaScript\
    \ Atom Grammar](https://marketplace.visualstudio.com/items?itemName=ms-vscode.js-grammar)：该扩展用\
    \ `Atom` 编辑器的 `JavaScript` 语法替换 Visual Code 中的 `JavaScript` 语法。\n\n*   [Babel\
    \ JavaScript](https://marketplace.visualstudio.com/items?itemName=mgmcdermott.vscode-language-babel)：ES21x\
    \ `JavaScript`、`React`、`FlowType` 和 `GraphQL` 的语法高亮。\n\n*   [DotENV](https://marketplace.visualstudio.com/items?itemName=mikestead.dotenv)：`.env`\
    \ 文件的语法高亮。如果你在使用 `Node`，这非常有用。\n\n## Linter 类扩展\n\n以最少麻烦高效编写 JavaScript 代码需要一个\
    \ linter（代码检查工具），为所有团队成员执行特定标准。`ESLint` 是最流行的，因为它支持 `Standard`、`Google` 和 `Airbnb`\
    \ 等多种风格。以下是 Visual Code 中最流行的 linter 插件：\n\n*   [ESLint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)：该扩展将\
    \ [ESLint](https://eslint.org/) 集成到 VS Code 中。它是最流行的 linter 扩展，目前安装量超过 670 万次。规则在\
    \ `.eslintrc.json` 中配置。\n\n*   [JSHint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.jshint)：JSHint](http://jshint.com/about/)\
    \ 代码检查扩展。使用项目根目录下的 `.jshintrc` 文件进行配置。\n\n*   [JavaScript Standard Style](https://marketplace.visualstudio.com/items?itemName=chenxsan.standardjs)：零配置\
    \ linter。执行 [StandardJS 规则](https://github.com/standard/standard)。\n\n*   [JSLint](https://marketplace.visualstudio.com/items?itemName=ajhyndman.jslint)：JSLint](http://jslint.com/help.html)\
    \ linter 扩展。\n\n如果你想了解可用 linter 及其优缺点，请查看我们的 [JavaScript 代码检查工具比较](https://www.sitepoint.com/comparison-javascript-linting-tools/)。\n\
    \n## Node 类扩展\n\n每个 JavaScript 项目都需要至少一个 Node 包，除非你是一个喜欢用困难方式做事的人。这里是一些帮助你更轻松地处理\
    \ Node 模块的 VS Code 扩展。\n\n"
