  trans: "\n最后，让我们创建 Babel 期望找到的目录和文件：\n\n```\nmkdir src dist\n```\n\n并为其提供一些需要转换的内容：\n\
    \n```\nlet a = 1;\nlet b = 2;\n[a, b] = [b, a];\nconsole.log(a);\nconsole.log(b);\n\
    ```\n\n此示例使用了[解构赋值](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/）来交换两个变量的值。\n\
    \n## 运行 Babel\n\n现在你已经有了一个可用的 Babel 安装，可以执行 `build` 命令来运行编译过程：\n\n```\nnpm run\
    \ build\n```\n\n这将会从 `src/main.js` 获取代码，将其转换为 ES5 代码，并将转换后的代码输出到 `dist/main.js`。\n\
    \n以下是生成的内容：\n\n```\n\"use strict\";\n\nvar a = 1;\nvar b = 2;\nvar _ref = [b,\
    \ a];\na = _ref[0];\nb = _ref[1];\n\nconsole.log(a);\nconsole.log(b);\n```\n\n\
    如你所见，`let` 已替换为 `var`，并且 Babel 引入了一个临时变量（用下划线表示）来方便交换。\n\n就是这些。你在 `src` 目录中编写的代码将被翻译为旧版本。默认情况下，如果你不在预设（preset）中添加任何选项，它将加载所有转换。你也可以如下所示指定目标浏览器：\n\
    \n```jsonjson\n  \"presets\": [\n    [\"env\", {\n      \"targets\": {\n     \
    \   \"browsers\": [\"last 2 versions\", \"safari >= 7\"]\n      }\n    }]\n  ]\n\
    }\n```\n\n这将加载支持每个浏览器最后两个版本以及 Safari 7 及以上所需的转换。你可以在 [Browserlist 仓库](https://github.com/ai/browserslist#queries)\
    \ 中找到目标浏览器的可用选项。\n\n## Babel 生态系统：概述\n\n正如你在上一节中注意到的，安装 Babel 后它不会执行任何操作。我们必须安装一组插件来获得所需的行为，或者可以使用预设（presets），它们是预定义的插件集。\n\
    \n通常，你想要包含的每个功能都会以插件的形式存在。ES2015 的一些示例包括：\n\n* [常量](https://babeljs.io/docs/plugins/check-es2015-constants/)\n\
    * [箭头函数](https://babeljs.io/docs/plugins/transform-es2015-arrow-functions/)\n\
    * [块级作用函数](https://babeljs.io/docs/plugins/transform-es2015-block-scoped-functions/)\n\
    * [类](https://babeljs.io/docs/plugins/transform-es2015-classes/)\n* [for-of](https://babeljs.io/docs/plugins/transform-es2015-for-of/)\n\
    * [展开运算符](https://babeljs.io/docs/plugins/transform-es2015-spread/)\n* [模板字量](https://babeljs.io/docs/plugins/transform-es2015-template-literals/)\n\
    \n查看 Babel 文档中的[插件页面](https://babeljs.io/docs/plugins/#transform-plugins) 以获取完整列表。\n\
    \n但有时你不想一个一个地包含所有插件。因此，有预构建的预设可以方便安装每个插件的过程。\n\n目前可用的三个官方预设是：\n\n* [Env](https://babeljs.io/docs/plugins/preset-env/)\n\
    * [React](https://babeljs.io/docs/plugins/preset-react/)\n* [Flow](https://babeljs.io/docs/plugins/preset-flow/)\n\
    \n`Env` 是最常用的，也是我们在这里使用的。它会根据目标浏览器自动加载所有必要的转换，使你的代码兼容。\n\n`React` 预设转换通常在 React\
    \ 项目中常见的代码，主要增加了对 [Flow](https://flow.org/) 注解和 [JSX](https://facebook.github.io/jsx/)\
    \ 的兼容性。\n\n最后，`Flow` 预设用于清理 [Flow](https://flow.org/) 类型注解（尽管它并不检查类型是否有效）。\n\n\
    ### Babel Polyfill（垫片）\n\n有些 JavaScript 特无法在语法上进行转换，通常是因为没有实现等效的功能——例如 Promises\
    \ 和生成器函数（generator functions）。\n\n这类功能必须通过库在浏览器中实现才能在你的代码中使用，这就是 polyfill 的工作。\n\
    \nBabel polyfill 由 [core-js](https://github.com/zloirock/core-js) 和 [Regenerator](https://github.com/facebook/regenerator)\
    \ 运行时组成。它们共同涵盖了 ES2015+ 中的所有功能。\n\n### 高级用法\n\n如所述，Babel 还可以用于转换语言中尚未实现的功能。一个很好的例子是类字段（class\
    \ fields）提案（目前处于 [TC39 stage 3：候选阶段](https://github.com/tc39/proposal-class-fields)）。这在\
    \ React 开发者之间特别流行，因为它消除了显式将方法绑定到特定组件的必要，并且意味着组件的 `state` 可以声明为类。\n"
- fmt: "\n[Webpack](https://webpack.js.org/) has become one of the most important\
    \ tools for modern web development. It’s primarily a module bundler for your JavaScript,\
    \ but it can be taught to transform all of your front-end assets like HTML, CSS,\
    \ even images. It can give you more control over the number of HTTP requests your\
    \ app is making and allows you to use other flavors of those assets (Pug, Sass,\
    \ and ES8, for example). Webpack also allows you to easily consume packages from\
    \ npm.\n\nThis article is aimed at those who are new to Webpack, and will cover\
    \ initial setup and configuration, modules, loaders, plugins, code splitting and\
    \ hot module replacement. If you find video tutorials helpful, I can highly recommend\
    \ Glen Maddern’s [Webpack from First Principles](https://www.youtube.com/watch?v=WQue1AN93YU)\
    \ as a starting point to understand what it is that makes Webpack special. It’s\
    \ a little old now, but the principles are still the same, and it’s a great introduction.\n\
    \n## Example Code\n\nTo follow along at home, you’ll need to have [Node.js installed](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ You can also [download the demo app from GitHub](https://github.com/markbrown4/webpack-demo).\n\
    \n## Setup\n\nLet’s initialize a new project with npm and install `webpack` and\
    \ `webpack-cli`:\n\n```\nmkdir webpack-demo && cd webpack-demo\nnpm init -y\n\
    npm install --save-dev webpack webpack-cli\n```\n\nNext we’ll create the following\
    \ directory structure and contents:\n\n```\n webpack-demo\n  |- package.json\n\
    + |- webpack.config.js\n+ |- /src\n+   |- index.js\n+ |- /dist\n+   |- index.html\n\
    ```\n\n### `dist/index.html`\n\n```\n<!doctype html>\n<html\n  <head>\n    <title>Hello\
    \ Webpack</title>\n  </head>\n  <body>\n    <script src=\"bundle.js\"></script>\n\
    \  </body>\n</html>\n```\n\n### `src/index.js`\n\n```javascript\nconst root =\
    \ document.createElement(\"div\")\nroot.innerHTML = `<p>Hello Webpack.</p>`\n\
    document.body.appendChild(root)\n```\n\n### `webpack.config.js`\n\n```javascript\n\
    const path = require('path')\n\nmodule.exports = {\n  entry: './src/index.js',\n\
    \  output: {\n    filename: 'bundle.js',\n    path: path.resolve(__dirname, 'dist')\n\
    \  }\n}\n```\n\nThis tells Webpack to compile the code in our entry point `src/index.js`\
    \ and output a bundle in `/dist/bundle.js`. Let’s add an [npm script](https://docs.npmjs.com/misc/scripts)\
    \ for running Webpack.\n\n### `package.json`\n\n```json\n {\n    ...\n    \"scripts\"\
    : {\n-     \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n+  \
    \   \"develop\": \"webpack --mode development --watch\",\n+     \"build\": \"\
    webpack --mode production\"\n    },\n    ...\n  }\n```\n\nUsing the `npm run develop`\
    \ command, we can create our first bundle!\n\n```\nAsset      Size      Chunks\
    \           Chunk Names\nbundle.js  2.92 KiB  main  [emitted]  main\n```\n\nYou\
    \ should now be able to load `dist/index.html` in your browser and be greeted\
    \ with “Hello Webpack”.\n\nOpen `dist/bundle.js` to see what Webpack has done.\
    \ At the top is Webpack’s module bootstrapping code, and right at the bottom is\
    \ our module. You may not be colored impressed just yet, but if you’ve come this\
    \ far you can now start using ES Modules, and Webpack will be able to produce\
    \ a bundle for production that will work in all browsers.\n\nRestart the build\
    \ with `Ctrl` + `C` and run `npm run build` to compile our bundle in production\
    \ mode.\n\n```\nAsset      Size       Chunks           Chunk Names\nbundle.js\
    \  647 bytes  main  [emitted]  main\n```\n\nNotice that the bundle size has come\
    \ down from `2.92 KiB` to `647 bytes`.\n\nTake another look at `dist/bundle.js`\
    \ and you’ll see an ugly mess of code. Our bundle has been minified with UglifyJS:\
    \ the code will run exactly the same, but it’s done with the smallest file size\
    \ possible.\n\n*   `--mode development` optimizes for build speed and debugging\n\
    *   `--mode production` optimizes for execution speed at runtime and output file\
    \ size.\n\n## Modules\n\nUsing ES Modules, you can split up your large programs\
    \ into many small, self-contained programs.\n\nOut of the box, Webpack knows how\
    \ to consume ES Modules using `import` and `export` statements. As an example,\
    \ let’s try this out now by installing [lodash-es](https://lodash.com/) and adding\
    \ a second module:\n\n```\nnpm install --save-dev lodash-es\n```\n\n### `src/index.js`\n\
    \n```javascript\nimport { groupBy } from \"lodash-es\"\nimport people from \"\
    ./people\"\n\nconst managerGroups = groupBy(people, \"manager\")\n\nconst root\
    \ = document.createElement(\"div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
    \ null, 2)}</pre>`\ndocument.body.appendChild(root)\n```\n\n### `src/people.js`\n\
    \n```javascript\nconst people = [\n  {\n    manager: \"Jen\",\n    name: \"Bob\"\
    \n  },\n  {\n    manager: \"Jen\",\n    name: \"Sue\"\n  },\n  {\n    manager:\
    \ \"Bob\",\n    name: \"Shirley\"\n  }\n]\n\nexport default people\n```\n\nRun\
    \ `npm run develop` to start Webpack and refresh `index.html`. You should see\
    \ an array of people grouped by manager printed to the screen.\n\n### Imports\
    \ Without a Relative Path\n\nImports without a relative path like `'es-lodash'`\
    \ are modules from npm installed to `/node_modules`. Your own modules will always\
    \ need a relative path like `'./people'`, as this is how you can tell them apart.\n\
    \nNotice in the console that our bundle size has increased to `1.41 MiB`! This\
    \ is worth keeping an eye on, though in this case there’s no cause for concern.\
    \ Using `npm run build` to compile in production mode, all of the unused lodash\
    \ modules from `lodash-es` are removed from bundle. This process of removing unused\
    \ imports is known as tree-shaking, and is something you get for free with Webpack.\n\
    \n```\n> npm run develop\n\nAsset      Size      Chunks           Chunk Names\n\
    bundle.js  1.41 MiB  main  [emitted]  main\n```\n\n```\n> npm run build\n\nAsset\
    \      Size       Chunks           Chunk Names\nbundle.js  16.7 KiB  main  [emitted]\
    \  main\n```\n\n## Loaders\n\nLoaders let you run preprocessors on files. Let’s\
    \ look at what can be done when loading `.js` through [Babel](http://babeljs.io/):\n\
    \n```\nnpm install --save-dev babel-loader @babel/preset-env\n```\n\n### `webpack.config.js`\n\
    \n```javascript\nconst path = require('path')\n\nmodule.exports = {\n  entry:\
    \ './src/index.js',\n  output: {\n    filename: 'bundle.js',\n    path: path.resolve(__dirname,\
    \ 'dist')\n  },\n  module: {\n    rules: [\n      {\n        test: /\\.js$/,\n\
    \        exclude: /(node_modules|bower_components)/,\n        use: {\n       \
    \   loader: 'babel-loader',\n        }\n      }\n    ]\n  }\n}\n```\n\n### `.babelrc`\n\
    \n```json\n{\n  \"presets\": [\n    [\"@babel/env\", {\n      \"modules\": false\n\
    \    }]\n  ],\n  \"plugins\": [\"syntax-dynamic-import\"]\n}\n```\n\nThis config\
    \ prevents Babel from transpiling `import` and `export` statements into ES5, and\
    \ enables dynamic imports — which we’ll look at later in the section on Code Splitting.\
    \ We’re now free to use modern language features, and they’ll be compiled down\
    \ to ES5 that runs in all browsers.\n\n### Sass\n\nLoaders can be chained together\
    \ into a series of transforms. A good way to demonstrate how this works is by\
    \ importing Sass from our JavaScript:\n\n```\nnpm install --save-dev style-loader\
    \ css-loader sass-loader node-sass\n```\n\n### `webpack.config.js`\n\n```javascript\n\
    module.exports = {\n  ...\n  module: {\n    rules: [\n      ...\n      {\n   \
    \     test: /\\.scss$/,\n        use: [{\n          loader: 'style-loader'\n \
    \       }, {\n          loader: 'css-loader'\n        }, {\n          loader:\
    \ 'sass-loader'\n        }]\n      }\n    ]\n  }\n}\n```\n\nThese loaders are\
    \ processed in reverse order:\n\n*   `sass-loader` transforms Sass into CSS.\n\
    *   `css-loader` parses the CSS into JavaScript and resolves any dependencies.\n\
    *   `style-loader` outputs our CSS into a `<style>` tag in the document.\n\nYou\
    \ can think of these as function calls. The output of one loader feeds as input\
    \ into the next:\n\n```\nstyleLoader(cssLoader(sassLoader(\"source\")))\n```\n"
  raw: "[Webpack](https://webpack.js.org/) has become one of the most important tools\
    \ for modern web development. It’s primarily a module bundler for your JavaScript,\
    \ but it can be taught to transform all of your front-end assets like HTML, CSS,\
    \ even images. It can give you more control over the number of HTTP requests your\
    \ app is making and allows you to use other flavors of those assets (Pug, Sass,\
    \ and ES8, for example). Webpack also allows you to easily consume packages from\
    \ npm.\n\nThis article is aimed at those who are new to Webpack, and will cover\
    \ initial setup and configuration, modules, loaders, plugins, code splitting and\
    \ hot module replacement. If you find video tutorials helpful, I can highly recommend\
    \ Glen Maddern’s [Webpack from First Principles](https://www.youtube.com/watch?v=WQue1AN93YU)\
    \ as a starting point to understand what it is that makes Webpack special. It’s\
    \ a little old now, but the principles are still the same, and it’s a great introduction.\n\
    \n#### Example Code\n\nTo follow along at home, you’ll need to have [Node.js installed](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ You can also [download the demo app from GitHub](https://github.com/markbrown4/webpack-demo).\n\
    \n## Setup\n\nLet’s initialize a new project with npm and install `webpack` and\
    \ `webpack-cli`:\n\n```\nmkdir webpack-demo && cd webpack-demo\nnpm init -y\n\
    npm install --save-dev webpack webpack-cli\n```\n\nNext we’ll create the following\
    \ directory structure and contents:\n\n```\n webpack-demo\n  |- package.json\n\
    + |- webpack.config.js\n+ |- /src\n+   |- index.js\n+ |- /dist\n+   |- index.html\n\
    ```\n\n**dist/index.html**\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>Hello\
    \ Webpack</title>\n  </head>\n  <body>\n    <script src=\"bundle.js\"></script>\n\
    \  </body>\n</html>\n```\n\n**src/index.js**\n\n```\nconst root = document.createElement(\"\
    div\")\nroot.innerHTML = `<p>Hello Webpack.</p>`\ndocument.body.appendChild(root)\n\
    ```\n\n**webpack.config.js**\n\n```\nconst path = require('path')\n\nmodule.exports\
    \ = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n \
    \   path: path.resolve(__dirname, 'dist')\n  }\n}\n```\n\nThis tells Webpack to\
    \ compile the code in our entry point `src/index.js` and output a bundle in `/dist/bundle.js`.\
    \ Let’s add an [npm script](https://docs.npmjs.com/misc/scripts) for running Webpack.\n\
    \n**package.json**\n\n```\n {\n    ...\n    \"scripts\": {\n-     \"test\": \"\
    echo \\\"Error: no test specified\\\" && exit 1\"\n+     \"develop\": \"webpack\
    \ --mode development --watch\",\n+     \"build\": \"webpack --mode production\"\
    \n    },\n    ...\n  }\n```\n\nUsing the `npm run develop` command, we can create\
    \ our first bundle!\n\n```\nAsset      Size      Chunks           Chunk Names\n\
    bundle.js  2.92 KiB  main  [emitted]  main\n```\n\nYou should now be able to load\
    \ `dist/index.html` in your browser and be greeted with “Hello Webpack”.\n\nOpen\
    \ up `dist/bundle.js` to see what Webpack has done. At the top is Webpack’s module\
    \ bootstrapping code, and right at the bottom is our module. You may not be colored\
    \ impressed just yet, but if you’ve come this far you can now start using ES Modules,\
    \ and Webpack will be able to produce a bundle for production that will work in\
    \ all browsers.\n\nRestart the build with `Ctrl` + `C` and run `npm run build`\
    \ to compile our bundle in *production mode*.\n\n```\nAsset      Size       Chunks\
    \           Chunk Names\nbundle.js  647 bytes  main  [emitted]  main\n```\n\n\
    Notice that the bundle size has come down from **2.92 KiB** to **647 bytes**.\n\
    \nTake another look at `dist/bundle.js` and you’ll see an ugly mess of code. Our\
    \ bundle has been minified with UglifyJS: the code will run exactly the same,\
    \ but it’s done with the smallest file size possible.\n\n*   `--mode development`\
    \ optimizes for build speed and debugging\n\n*   `--mode production` optimizes\
    \ for execution speed at runtime and output file size.\n\n## Modules\n\nUsing\
    \ ES Modules, you can split up your large programs into many small, self-contained\
    \ programs.\n\nOut of the box, Webpack knows how to consume ES Modules using `import`\
    \ and `export` statements. As an example, let’s try this out now by installing\
    \ [lodash-es](https://lodash.com/) and adding a second module:\n\n```\nnpm install\
    \ --save-dev lodash-es\n```\n\n**src/index.js**\n\n```\nimport { groupBy } from\
    \ \"lodash-es\"\nimport people from \"./people\"\n\nconst managerGroups = groupBy(people,\
    \ \"manager\")\n\nconst root = document.createElement(\"div\")\nroot.innerHTML\
    \ = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\ndocument.body.appendChild(root)\n\
    ```\n\n**src/people.js**\n\n```\nconst people = [\n  {\n    manager: \"Jen\",\n\
    \    name: \"Bob\"\n  },\n  {\n    manager: \"Jen\",\n    name: \"Sue\"\n  },\n\
    \  {\n    manager: \"Bob\",\n    name: \"Shirley\"\n  }\n]\n\nexport default people\n\
    ```\n\nRun `npm run develop` to start Webpack and refresh `index.html`. You should\
    \ see an array of people grouped by manager printed to the screen.\n\n#### Imports\
    \ Without a Relative Patch\n\nImports without a relative path like `'es-lodash'`\
    \ are modules from npm installed to `/node_modules`. Your own modules will always\
    \ need a relative path like `'./people'`, as this is how you can tell them apart.\n\
    \nNotice in the console that our bundle size has increased to **1.41 MiB**! This\
    \ is worth keeping an eye on, though in this case there’s no cause for concern.\
    \ Using `npm run build` to compile in *production* mode, all of the unused lodash\
    \ modules from *lodash-es* are removed from bundle. This process of removing unused\
    \ imports is known as **tree-shaking**, and is something you get for free with\
    \ Webpack.\n\n```\n> npm run develop\n\nAsset      Size      Chunks          \
    \        Chunk Names\nbundle.js  1.41 MiB  main  [emitted]  [big]  main\n```\n\
    \n```\n> npm run build\n\nAsset      Size      Chunks        Chunk Names\nbundle.js\
    \  16.7 KiB  0  [emitted]  main\n```\n\n## Loaders\n\nLoaders let you run preprocessors\
    \ on files as they’re imported. This allows you to bundle static resources *beyond\
    \ JavaScript*, but let’s look at what can be done when loading `.js` modules first.\n\
    \nLet’s keep our code modern by running all `.js` files through the next-generation\
    \ JavaScript transpiler [Babel](http://babeljs.io/):\n\n```\nnpm install --save-dev\
    \ \"babel-loader@^8.0.0-beta\" @babel/core @babel/preset-env\n```\n\n**webpack.config.js**\n\
    \n```\n const path = require('path')\n\n  module.exports = {\n    entry: './src/index.js',\n\
    \    output: {\n      filename: 'bundle.js',\n      path: path.resolve(__dirname,\
    \ 'dist')\n    },\n+   module: {\n+     rules: [\n+       {\n+         test: /\\\
    .js$/,\n+         exclude: /(node_modules|bower_components)/,\n+         use:\
    \ {\n+           loader: 'babel-loader',\n+         }\n+       }\n+     ]\n+ \
    \  }\n  }\n```\n\n**.babelrc**\n\n```\n{\n  \"presets\": [\n    [\"@babel/env\"\
    , {\n      \"modules\": false\n    }]\n  ],\n  \"plugins\": [\"syntax-dynamic-import\"\
    ]\n}\n```\n\nThis config prevents Babel from transpiling `import` and `export`\
    \ statements into ES5, and enables dynamic imports — which we’ll look at later\
    \ in the section on Code Splitting.\n\nWe’re now free to use modern language features,\
    \ and they’ll be compiled down to ES5 that runs in all browsers.\n\n### Sass\n\
    \nLoaders can be chained together into a series of transforms. A good way to demonstrate\
    \ how this works is by importing Sass from our JavaScript:\n\n```\nnpm install\
    \ --save-dev style-loader css-loader sass-loader node-sass\n```\n\n**webpack.config.js**\n\
    \n```\n module.exports = {\n    ...\n    module: {\n      rules: [\n        ...\n\
    +       {\n+         test: /\\.scss$/,\n+         use: [{\n+           loader:\
    \ 'style-loader'\n+         }, {\n+           loader: 'css-loader'\n+        \
    \ }, {\n+           loader: 'sass-loader'\n+         }]\n+       }\n      ]\n\
    \    }\n  }\n```\n\nThese loaders are processed in reverse order:\n\n*   `sass-loader`\
    \ transforms Sass into CSS.\n\n*   `css-loader` parses the CSS into JavaScript\
    \ and resolves any dependencies.\n\n*   `style-loader` outputs our CSS into a\
    \ `<style>` tag in the document.\n\nYou can think of these as function calls.\
    \ The output of one loader feeds as input into the next:\n\n```\nstyleLoader(cssLoader(sassLoader(\"\
    source\")))\n```"
