    \  const common = require('./webpack.common.js')\n\n  module.exports = merge(common,\
    \ {\n    mode: 'development',\n+   devServer: {\n+     hot: true\n   },\n+   plugins:\
    \ [\n+     new webpack.HotModuleReplacementPlugin()\n+   ],\n    ...\n  }\n```\n\
    \nNow we need to `accept` changed modules from our code to re-initialize things.\n\
    \n`src/app.js`\n\n```\n+ if (module.hot) {\n+   module.hot.accept()\n+ }\n\n \
    \ ...\n```\n\n### Hot Module Replacement\n\nWhen Hot Module Replacement is enabled,\
    \ `module.hot` is set to `true` for development and `false` for production, so\
    \ these are stripped out of the bundle.\n\nRestart the build and see what happens\
    \ when we do the following:\n\n*   Click `Open chat`\n*   Add a new person to\
    \ the `people.js` module\n*   Click `Open chat` again.\n\n![Adding people to the\
    \ chat](Images/1521906879hmr.png)\n\nHere’s what’s happening:\n\n1.  When `Open\
    \ chat` is clicked, the `chat.js` module is fetched and initialized\n2.  HMR detects\
    \ when `people.js` is modified\n3.  `module.hot.accept()` in `index.js` causes\
    \ all modules loaded by this entry chunk to be replaced\n4.  When `Open chat`\
    \ is clicked again, `chat.init()` is run with the code from the updated module.\n\
    \n### CSS Replacement\n\nLet’s change the button color to red and see what happens:\n\
    \n`src/app.scss`\n\n```\n button {\n    ...\n-   background: #24b47e;\n+   background:\
    \ red;\n    ...\n  }\n```\n\n![Changing the CSS](Images/1521906881hmr2.png)\n\n\
    Now we get to see instant updates to our styles without losing any state. This\
    \ is a much-improved developer experience! And it feels like the future.\n\n##\
    \ HTTP/2\n\nOne of the primary benefits of using a module bundler like Webpack\
    \ is that it can help you improve performance by giving you control over how the\
    \ assets are `built` and then `fetched` on the client. It has been considered\
    \ [best practice](https://developer.yahoo.com/performance/rules.html) for years\
    \ to concatenate files to reduce the number of requests that need to be made on\
    \ the client. This is still valid, but [HTTP/2 now allows multiple files to be\
    \ delivered in a `single` request](https://www.sitepoint.com/file-bundling-and-http2/),\
    \ so concatenation isn’t a silver bullet anymore. Your app may actually benefit\
    \ from having many small files individually cached. The client could then fetch\
    \ a single changed module rather than having to fetch an entire bundle again with\
    \ `mostly` the same contents.\n\nThe creator of Webpack, [Tobias Koppers](https://twitter.com/wSokra),\
    \ has written an informative post explaining why bundling is still important,\
    \ even in the HTTP/2 era.\n\nRead more about this over at [Webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6).\n\
    \n## Over to You\n\nI hope you’ve found this introduction to Webpack helpful and\
    \ are able to start using it to great effect. It can take a little time to wrap\
    \ your head around Webpack’s configuration, loaders and plugins, but learning\
    \ how this tool works will pay off.\n\nThe documentation for Webpack 4 is currently\
    \ being worked on, but is really well put together. I highly recommend reading\
    \ through the [Concepts](https://webpack.js.org/concepts/) and [Guides](https://webpack.js.org/guides/)\
    \ for more information. Here’s a few other topics you may be interested in:\n\n\
    *   [Source Maps for development](https://webpack.js.org/guides/development/#using-source-maps)\n\
    *   [Source Maps for production](https://webpack.js.org/guides/production/#source-mapping)\n\
    *   [Cache busting with hashed filenames](https://webpack.js.org/guides/caching/)\n\
    *   [Splitting a vendor bundle](https://webpack.js.org/plugins/commons-chunk-plugin/#explicit-vendor-chunk)\n\
    \n# Chapter 3: An Introduction to Gulp.js\n\n### by Craig Buckler\n\nDevelopers\
    \ spend precious little time coding. Even if we ignore irritating meetings, much\
    \ of the job involves basic tasks which can sap your working day:\n\n*   generating\
    \ HTML from templates and content files\n*   compressing new and modified images\n\
    *   compiling Sass to CSS code\n*   removing `console` and `debugger` statements\
    \ from scripts\n*   transpiling ES6 to cross-browser–compatible ES5 code\n*  \
    \ code linting and validation\n*   concatenating and minifying CSS and JavaScript\
    \ files\n*   deploying files to development, staging and production servers.\n\
    \nTasks must be repeated every time you make a change. You may start with good\
    \ intentions, but the most infallible developer will forget to compress an image\
    \ or two. Over time, pre-production tasks become increasingly arduous and time-consuming;\
    \ you'll dread the inevitable content and template changes. It's mind-numbing,\
    \ repetitive work. Wouldn’t it be better to spend your time on more profitable\
    \ jobs?\n\nIf so, you need a `task runner` or `build process`.\n\n## That Sounds\
    \ Scarily Complicated!\n\nCreating a build process will take time. It's more complex\
    \ than performing each task manually, but over the long term, you’ll save hours\
    \ of effort, reduce human error and save your sanity. Adopt a pragmatic approach:\n\
    \n*   Automate the most frustrating tasks first.\n*   Try not to over-complicate\
    \ your build process. An hour or two is more than enough for the initial setup.\n\
    *   Choose task runner software and stick with it for a while. Don't switch to\
    \ another option on a whim.\n\nSome of the tools and concepts may be new to you,\
    \ but take a deep breath and concentrate on one thing at a time.\n\n## Task Runners:\
    \ the Options\n\nBuild tools such as [GNU Make](https://www.gnu.org/software/make/)\
    \ have been available for decades, but web-specific task runners are a relatively\
    \ new phenomenon. The first to achieve critical mass was [Grunt](http://gruntjs.com/)\
    \ — a Node.js task runner which used plugins controlled (originally) by a JSON\
    \ configuration file. Grunt was hugely successful, but there were a number of\
    \ issues:\n\n1.  Grunt required plugins for basic functionality such as file watching.\n\
    2.  Grunt plugins often performed multiple tasks, which made customisation more\
    \ awkward.\n3.  JSON configuration could become unwieldy for all but basic tasks.\n\
    4.  Tasks could run slowly because Grunt saved files between processing step.\n\
    \nMany issues were addressed in later editions, but [Gulp](http://gulpjs.com/)\
    \ had already arrived and offered a number of improvements:\n\n1.  Features such\
    \ as file watching were built in.\n2.  Gulp plugins were `mostly` designed to\
    \ do a single job.\n3.  Gulp used JavaScript configuration code that was less\
    \ verbose, easier to read, simpler to modify, and provided better flexibility.\n\
    4.  Gulp was faster because it uses [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
    \ to pass data through a series of piped plugins. Files were only written at the\
    \ end of the task.\n\nOf course, Gulp itself isn't perfect, and new task runners\
    \ such as [Broccoli.js](http://broccolijs.com/), [Brunch](http://brunch.io/) and\
    \ [webpack](https://webpack.github.io/) have also been competing for developer\
    \ attention. More recently, [npm itself has been touted as a simpler option](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/).\
    \ All have their pros and cons, but [Gulp remains the favorite and is currently\
    \ used by more than 40% of web developers](https://ashleynolan.co.uk/blog/frontend-tooling-survey-2016-results).\n\
    \nGulp requires Node.js, but while some JavaScript knowledge is beneficial, developers\
    \ from all web programming faiths will find it useful.\n\n## What About Gulp 4?\n\
    \nThis tutorial describes how to use Gulp 3 — the most recent release version\
    \ at the time of writing. Gulp 4 has been in development for some time but remains\
    \ a beta product. It's possible to [use or switch to Gulp 4](https://www.joezimjs.com/complete-guide-upgrading-gulp-4/),\
    \ but I recommend sticking with version 3 until the final release.\n\n## Step\
    \ 1: Install Node.js\n"
