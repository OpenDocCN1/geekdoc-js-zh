- fmt: "\nThere are a whole bunch of [additional options](https://github.com/axios/axios#request-config)\
    \ you can pass when making a request, but here are the most common ones:\n\n*\
    \ `baseUrl`: if you specify a base URL, it’ll be prepended to any relative URL\
    \ you use.\n* `headers`: an object of key/value pairs to be sent as headers.\n\
    * `params`: an object of key/value pairs that will be serialized and appended\
    \ to the URL as a query string.\n* `responseType`: if you’re expecting a response\
    \ in a format other than JSON, you can set this property to `arraybuffer`, `blob`,\
    \ `document`, `text`, or `stream`.\n* `auth`: passing an object with `username`\
    \ and `password` fields will use these credentials for HTTP Basic auth on the\
    \ request.\n\n## Convenience methods\n\nAlso like jQuery, there are shortcut methods\
    \ for performing different types of request.\n\nThe `get`, `delete`, `head` and\
    \ `options` methods all take two arguments: a URL, and an optional config object.\n\
    \n```\naxios.get('/products/5');\n```\n\nThe `post`, `put`, and `patch` methods\
    \ take a data object as their second argument, and an optional config object as\
    \ the third:\n\n```\naxios.post(\n  '/products',\n  { name: 'Waffle Iron', price:\
    \ 21.50 },\n  { options }\n);\n```\n\n## Receiving a Response\n\nOnce you make\
    \ a request, Axios returns a promise that will resolve to either a response object\
    \ or an error object.\n\n```\naxios.get('/product/9')\n  .then(response => console.log(response))\n\
    \  .catch(error => console.log(error));\n```\n\n### The response object\n\nWhen\
    \ the request is successful, your `then()` callback will receive a response object\
    \ with the following properties:\n\n* `data`: the payload returned from the server.\
    \ By default, Axios expects JSON and will parse this back into a JavaScript object\
    \ for you.\n* `status`: the HTTP code returned from the server.\n* `statusText`:\
    \ the HTTP status message returned by the server.\n* `headers`: all the headers\
    \ sent back by the server.\n* `config`: the original request configuration.\n\
    * `request`: the actual `XMLHttpRequest` object (when running in a browser).\n\
    \n### The error object\n\nIf there’s a problem with the request, the promise will\
    \ be rejected with an error object containing at least some of the following properties:\n\
    \n* `message`: the error message text.\n* `response`: the response object (if\
    \ received) as described in the previous section.\n* `request`: the actual `XMLHttpRequest`\
    \ object (when running in a browser).\n* `config`: the original request configuration.\n\
    \n## Transforms and Interceptors\n\nAxios provides a couple of neat features inspired\
    \ by [Angular’s $http library](https://docs.angularjs.org/api/ng/service/$http).\
    \ Although they appear similar, they have slightly different use cases.\n\n###\
    \ Transforms\n\nAxios allows you to provide functions to transform the outgoing\
    \ or incoming data, in the form of two configuration options you can set when\
    \ making a request: `transformRequest` and `transformResponse`. Both properties\
    \ are arrays, allowing you to chain multiple functions that the data will be passed\
    \ through.\n\nAny functions passed to `transformRequest` are applied to PUT, POST\
    \ and PATCH requests. They receive the request data, and the headers object as\
    \ arguments and must return a modified data object\n\n```\nconst options = {\n\
    \  transformRequest: [\n    (data, headers) => {\n      // do something with data\n\
    \      return data;\n    }\n  ]\n}\n```\n\nFunctions can be added to `transformResponse`\
    \ in the same way, but are called only with the response data, and before the\
    \ response is passed to any chained `then()` callbacks.\n\nSo what could we use\
    \ transforms for? One potential use case is dealing with an API that expects data\
    \ in a particular format — say XML or even CSV. You could set up a pair of transforms\
    \ to convert outgoing and incoming data to and from the format the API requires.\n\
    \nIt’s worth noting that Axios’ default `transformRequest` and `transformResponse`\
    \ functions transform data to and from JSON, and specifying your own transforms\
    \ will override these.\n\n### Interceptors\n\nWhile transforms let you modify\
    \ outgoing and incoming data, Axios also allows you to add functions called [interceptors](https://github.com/axios/axios#interceptors).\
    \ Like transforms, these functions can be attached to fire when a request is made,\
    \ or when a response is received.\n\n```\n// Add a request interceptor\naxios.interceptors.request.use((config)\
    \ => {\n    // Do something before request is sent\n    return config;\n  }, (error)\
    \ => {\n    // Do something with request error\n    return Promise.reject(error);\n\
    \  });\n\n// Add a response interceptor\naxios.interceptors.response.use((response)\
    \ => {\n    // Do something with response data\n    return response;\n  }, (error)\
    \ => {\n    // Do something with response error\n    return Promise.reject(error);\n\
    \  });\n```\n\nAs you might have noticed from the examples above, interceptors\
    \ have some important differences from transforms. Instead of just receiving the\
    \ data or headers, interceptors receive the full request config or response object.\n\
    \nWhen creating interceptors, you can also choose to provide an error handler\
    \ function that allows you to catch any errors and deal with them appropriately.\n\
    \nRequest interceptors can be used to do things such as [retrieve a token from\
    \ local storage and send with all requests](https://www.npmjs.com/package/axios-token-interceptor),\
    \ while a response interceptor could be used to [catch 401 responses and redirect\
    \ to a login page](https://gist.github.com/yajra/5f5551649b20c8f668aec48549ef5c1f)\
    \ for authorization.\n\n## Third-party Add-ons\n\nBeing a popular library, Axios\
    \ benefits from an ecosystem of third-party libraries that extend its functionality.\
    \ From interceptors to testing adaptors to loggers, there’s quite a variety available.\
    \ Here are a few that I think you may find useful:\n\n* [axios-mock-adaptor](https://github.com/ctimmerm/axios-mock-adapter):\
    \ allows you to easily mock requests to facilitate testing your code.\n* [axios-cache-plugin](https://github.com/jin5354/axios-cache-plugin):\
    \ a wrapper for selectively caching GET requests.\n* [redux-axios-middleware](https://github.com/svrcekmichal/redux-axios-middleware):\
    \ if you’re a Redux user, this middleware provides a neat way to dispatch Ajax\
    \ requests with plain old actions.\n\nA list of more [Axios add-ons and extentions](https://github.com/axios/axios/blob/master/ECOSYSTEM.md)\
    \ is available on the Axios GitHub repo.\n\nIn summary, Axios has a lot to recommend\
    \ it. It has a straightforward API, with helpful shortcut methods that will be\
    \ familiar to anyone who’s used jQuery before. Its popularity, and the availability\
    \ of a variety of third-party add-ons, make it a solid choice for including in\
    \ your apps, whether front end, back end, or both.\n"
