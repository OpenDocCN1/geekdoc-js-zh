    *   **Step over**: execute code line by line, skipping functions\n\n*   **Step\
    \ into**: execute code line by line, going inside functions\n\n*   **Step out**:\
    \ if already inside a function, this command will take you out\n\n*   **Restart**:\
    \ restarts the debugging session\n\n*   **Stop**: stops the debugging session.\n\
    \nRight now, you'll notice that the debug session has paused on your first breakpoint.\
    \ To continue the session, just hit the *Continue* button, which will cause execution\
    \ to continue until it reaches the second breakpoint and pause again. Hitting\
    \ *Continue* again will complete the execution and the debugging session will\
    \ complete.\n\nLet's start the debugging process again by hitting `F5`. Make sure\
    \ the two breakpoints are still in place. When you place a breakpoint, the code\
    \ pauses at the specified line. It doesn’t execute that line unless you hit *Continue*\
    \ (`F5`) or *Step Over* (`F10`). Before you hit anything, let's take a look at\
    \ the sections that make up the debug panel:\n\n*   **Variables**: displays local\
    \ and global variables within the current scope (i.e. at the point of execution)\n\
    \n*   **Watch**: you can manually add expressions of variables you want to monitor\n\
    \n*   **Call Stack**: displays a call stack of the highlighted code\n\n*   **Breakpoints**:\
    \ displays a list of files with breakpoints, along with their line numbers.\n\n\
    To add an expression to the *Watch* section, simply click the *+* sign and add\
    \ any valid JavaScript expression — such as `places.length`. When the debugger\
    \ pauses, if your expression is in scope, the value will be printed out. You can\
    \ also hover over variables that are currently in scope. A popup will appear displaying\
    \ their values.\n\nCurrently the `places` array is empty. Press any navigation\
    \ control to see how debugging works. For example, *Step over* will jump into\
    \ the next line, while *Step into* will navigate to the `addPlace` function. Take\
    \ a bit of time to get familiar with the controls.\n\nAs soon as you’ve done some\
    \ stepping, hover over the `places` variable. A popup will appear. Expand the\
    \ values inside until you have a similar view:\n\n![The places popup](Images/152442833804-places-hover.png)\n\
    \nYou can also inspect all variables that are in scope in the *Variables* section.\n\
    \n![The variables section](Images/152442834005-local-variables.png)\n\nThat's\
    \ pretty awesome compared to what we normally do with `console.log`. The debugger\
    \ allows us to inspect variables at a deeper level. You may have also noticed\
    \ a couple of problems with the `places` array output:\n\n1.  there are multiple\
    \ blanks in the array — that is, `places[0]` and `places[2]` are `undefined`\n\
    \n2.  the `numType` property displays `even` for odd `id` values.\n\nFor now,\
    \ just end the debugging session. We'll fix them in the next section.\n\n## Debugging\
    \ Tests with Mocha\n\nOpen `test/placesTest.js` and review the code that’s been\
    \ written to test the code in `places.test`. If you've never used Mocha before,\
    \ you need to install it globally first in order to run the tests.\n\n```\n# Install\
    \ mocha globally\nnpm install -g mocha\n\n# Run mocha tests\nmocha\n```\n\nYou\
    \ can also run `npm test` to execute the tests. You should get the following output:\n\
    \n![Failing mocha tests](Images/152442834406-failing-mocha-tests.png)\n\nAll the\
    \ tests are failing. To find out the problem, we’re going to run the tests in\
    \ debug mode. To do that, we need a new configuration. Go to the debug panel and\
    \ click the dropdown to access the `Add Configuration` option:\n\n![Add configuration](Images/152442834507-add-configuration.png)\n\
    \nThe `launch.json` file will open for you with a popup listing several configurations\
    \ for you to choose from.\n\n![Add mocha tests](Images/152442834707-mocha-test-configuration.png)\n\
    \nSimply select *Mocha Tests*. The following configuration will be inserted for\
    \ you:\n\n```\n{\n  \"type\": \"node\",\n  \"request\": \"launch\",\n  \"name\"\
    : \"Mocha Tests\",\n  \"program\": \"${workspaceFolder}/node_modules/mocha/bin/_mocha\"\
    ,\n  \"args\": [\n    \"-u\",\n    \"tdd\",\n    \"--timeout\",\n    \"999999\"\
    ,\n    \"--colors\",\n    \"${workspaceFolder}/test\"\n  ],\n  \"internalConsoleOptions\"\
    : \"openOnSessionStart\"\n},\n```\n\nThe default settings are fine. Go back to\
    \ the dropdown and select *Mocha Tests*. You'll need to comment out the last three\
    \ lines you added in `places.js`; otherwise the tests won't run as expected. Go\
    \ back to `placesTest.js` and add a breakpoint on the line just before where the\
    \ first test failure occurs. That should be line seven, where it says:\n\n```\n\
    addPlace('Nairobi', 'Kenya');\n```\n\nMake sure to add a `places.length` expression\
    \ in the watch section. Hit the *Play* button to start the debugging session.\n\
    \n![Mocha test start](Images/152442834908-mocha-test-start.png)\n\nAt the start\
    \ of the test, `places.length` should read zero. If you hit *Step over*, `places.length`\
    \ reads 2, yet only one place has been added. How can that be?\n\nRestart the\
    \ debugging session, and this time use *Step into* to navigate to the `addPlace`\
    \ function. The debugger will navigate you to `places.js`. The value of `places.length`\
    \ is still zero. Click *Step over* to execute the current line.\n\n![Mocha test\
    \ step](Images/152442835209-mocha-test-step.png)\n\nAha! The value of `places.length`\
    \ just incremented by 1, yet we haven't added anything to the array. The problem\
    \ is caused by the `++` operator which is mutating the array's length. To fix\
    \ this, simply replace the line with:\n\n```\nconst id = places.length + 1;\n\
    ```\n\nThis way, we can safely get the value of `id` without changing the value\
    \ of `places.length`. While we’re still in debug mode, let's try to fix another\
    \ problem where the `numType` property is given the value `even` while `id` is\
    \ 1\\. The problem seems to be the modulus expression inside the if statement:\n\
    \n![Mocha if error](Images/152442835410-mocha-if-error.png)\n\nLet's do a quick\
    \ experiment using the debug console. Start typing a proper expression for the\
    \ `if` statement:\n\n![Mocha debug console](Images/152442835511-mocha-debug-console.png)\n\
    \nThe debug console is similar to the browser console. It allows you to perform\
    \ experiments using variables that are currently in scope. By trying out a few\
    \ ideas in the console, you can easily find the solution without ever leaving\
    \ the editor. Let's now fix the failing if statement:\n\n```\nif (id % 2 === 0)\
    \ {\n  numType = 'even';\n}\n```\n\nRestart the debug session and hit *Continue*\
    \ to skip the current breakpoint. The first test, “can add a place”, is now passing.\
    \ But the second test isn't. To fix this, we need another breakpoint. Remove the\
    \ current one and place a new breakpoint on line 16, where it says:\n\n```\naddPlace('Cape\
    \ Town', 'South Africa');\n```\n\nStart a new debugging session:\n\n![Mocha test2\
    \ fail](Images/152442835812-mocha-test2-error.png)"
