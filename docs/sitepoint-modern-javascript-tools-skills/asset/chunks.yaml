  trans: "\n```javascript\n// watch for changes\ngulp.task('watch', function() {\n\
    \n  // image changes\n  gulp.watch(folder.src + 'images/**/*', ['images']);\n\n\
    \  // html changes\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n\n  //\
    \ javascript changes\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n\n  // css\
    \ changes\n  gulp.watch(folder.src + 'scss/**/*', ['css']);\n\n});\n```\n\n与其立即运行\
    \ `gulp watch`，让我们添加一个默认任务：\n\n```javascript\n// default task\ngulp.task('default',\
    \ ['run', 'watch']);\n```\n\n保存 `gulpfile.js` 并在命令行中输入 `gulp`。你的图片、HTML、CSS 和\
    \ JavaScript 都将会被处理，然后 Gulp 将保持活跃状态并在更新并在需要重新运行任务。按下 `Ctrl/Cmd` + `C` 停止监控并返回命令行。\n\
    \n## 第 7 ：大获成功！\n\n你可能觉得这些插件有用：\n\n- [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins)\
    \ ±无需 `require` 声明加载所有 Gulp 插件模块\n- [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess)\
    \ — 一个简单的 HTML 和 JavaScript [预处理器](https://github.com/jsoverson/preprocess)\n\
    - [gulp-less](https://www.npmjs.com/package/gulp-less) — [Less CSS 预处理器](http://lesscss.org/)\
    \ 插件\n- [gulp-stylus](https://www.npmjs.com/package/gulp-stylus) — [Stylus CSS\
    \ 预处理器](http://stylus-lang.com/) 插件\n- [gulp-sequence](https://www.npmjs.com/package/gulp-sequence)\
    \ — 按特定顺序运行一系列 gulp 任务\n- [gulp-plumber](https://www.npmjs.com/package/gulp-plumber)\
    \ — 防止 Gulp 在失败时停止的错误处理\n- [gulp-size](https://www.npmjs.com/package/gulp-size)\
    \ — 显示文件大小和节省的空间\n- [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon)\
    \ — 使用 [nodemon](https://www.npmjs.com/package/nodemon) 在发生变化时自动重启 Node.js 应用。\n\
    - [gulp-util](https://www.npmjs.com/package/gulp-util) — 包括日志和颜色编码的实用函数\n\n`gulp-util`\
    \ 中一个实用的方法是 `.noop()`，它可以直接传递数据而不执行任何操作。这可以用于更干净的开发/生产处理代码。例如：\n\n```javascript\n\
    var gutil = require('gulp-util');\n\n// HTML processing\ngulp.task('html', ['images'],\
    \ function() {\n  var out = folder.src + 'html/**/*';\n\n  return gulp.src(folder.src\
    \ + 'html/**/*')\n    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n\
    \    .pipe(gulp.dest(out));\n\n});\n```\n\nGulp 还可以调用其他 Node.js 模块，它们并不一定需要是插件。例如：\n\
    \n- [browser-sync](https://www.npmjs.com/package/browser-sync) — 发生变化时自动加载资源或刷新你的浏览器\n\
    - [del](https://www.npmjs.com/package/del) — 删除文件和文件夹（也许可以在每次运行开始时清理 `build` 文件夹）。\n\
    \n投入一点时间，Gulp 就能节省许多小时的开发挫败感。优势是：\n\n- [插件非常丰富](https://npmjs.org/browse/keyword/gulpplugin/)\n\
    - 使用管道的配置易读且易于遵循\n- `gulpfile.js` 可以在其他项目中进行适配和复用\n- 你可以减少总页面的权重以提高性能\n- 你可以简化你的部署。\n\
    \n有用链接：\n\n- [Gulp 首页](http://gulpjs.com/)\n- [Gulp 插件](https://npmjs.org/browse/keyword/gulpplugin/)\n\
    - [npm 首页](https://www.npmjs.com/)\n\n将上述流程应用于简单的网站，总权重减少了 50% 以上。你可以使用 [页面权重分析工具](http://sitepoint.com/10-best-webpage-weight-analysis-tools/)\
    \ 或像 [New Relic](http://newrelic.com/?r=phpm) 这样的服务来测试自己的结果，它提供了一系列复杂的应用程序性能监控工具。\n\
    \nGulp 可以彻底改变你的工作流。我你发现这个教程有用，并考虑在生产流程中使用 Gulp。\n\n# 第 4 章：编译为 JavaScript 的 10\
    \ 种语言\n\n### 作者 James Kolce\n\n本章包含了十种可以编译为 JavaScript 的有趣语言，可以在浏览器或 Node.js 等平台上执行。\n\
    \n现代应用程序与简单网站相比有[不同的需求](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)。但浏览器是一个拥有（大部分）固定技术集的平台，JavaScript\
    \ 仍然是 Web 应用程序的核心语言。任何需要在浏览器中运行的应用程序都必须用该语言实现。\n\n我们都知道 JavaScript 并不是所有任务的最佳语言，在处理复杂应用时，它可能会不从心。为了避免这个问题，人们创建了一些新语言以及现有语言的转换器，它们都能生成可以在环境中运行的代码。\n\
    \n## Dart\n\nDart 是一种用于构建快速且美观应用的客户端优化语言。它由 Google 开发，可以编译为 JavaScript。\n\n任何需要在浏览器中运行的应用程序都必须用该语言实现。\n\
    \n我们都知道 JavaScript 并不是所有任务的最佳语言，在处理复杂应用时，它可能会不从心。为了避免这个问题，人们创建了一些新语言以及现有语言的转换器，它们都能生成可以在环境中运行的代码。\n"
- fmt: "\n[TypeScript](https://www.typescriptlang.org/) is a superset of JavaScript.\
    \ A valid JavaScript program is also valid TypeScript, but with static typing\
    \ added. The compiler can also work as a transpiler from ES2015+ to current implementations,\
    \ so you always get the latest features.\n\nUnlike many other languages, TypeScript\
    \ keeps the spirit of JavaScript intact, only adding features to improve the soundness\
    \ of the code. These are type annotations and other type-related functionality\
    \ that makes writing JavaScript more pleasant, thanks to the enabling of specialized\
    \ tools like static analyzers and other tools to aid in the refactoring process.\
    \ Also, the addition of types improve the interfaces between the different components\
    \ of your applications.\n\nType inference is supported, so you don’t have to write\
    \ all the types from the beginning. You can write quick solutions, and then add\
    \ all the types to get confident about your code.\n\nTypeScript also has support\
    \ for advanced types, like intersection types, union types, type aliases, discriminated\
    \ unions and type guards. You can check out all these in the [Advanced Types](https://www.typescriptlang.org/docs/handbook/advanced-types.html)\
    \ page in the [TypeScript Documentation](https://www.typescriptlang.org/docs)\
    \ site.\n\nJSX is also supported by adding the React typings if you use React:\n\
    \n```\nclass Person {\n  private name: string;\n  private age: number;\n  private\
    \ salary: number;\n\n  constructor(name: string, age: number, salary: number)\
    \ {\n    this.name = name;\n    this.age = age;\n    this.salary = salary;\n \
    \ }\n\n  toString(): string {\n    return `${this.name} (${this.age}) (${this.salary})`;\n\
    \  }\n}\n```\n\nFor more on typeScript, check out SitePoint’s [getting started\
    \ with TypeScript](https://www.sitepoint.com/introduction-to-typescript/) article.\n\
    \n## Elm\n\nElm is a purely functional programming language that can compile to\
    \ JavaScript, HTML, and CSS. You can build a complete site with just Elm, making\
    \ it a great alternative to JavaScript frameworks like React. The applications\
    \ that you build with it automatically use a virtual DOM library, making it very\
    \ fast. One big plus is the built-in architecture that makes you forget about\
    \ data-flow and focus on data declaration and logic instead.\n\nIn Elm, all functions\
    \ are pure, which means they’ll always return the same output for a given input.\
    \ They can’t do anything else unless you specify it. For example, to access a\
    \ remote API you’d create `command` functions to communicate with the external\
    \ world, and `subscriptions` to listen for responses. Another point for purity\
    \ is that values are immutable: when you need something, you create new values,\
    \ instead of modifying them.\n\nThe adoption of Elm can be gradual. It’s possible\
    \ to communicate with JavaScript and other libraries using `ports`. Although Elm\
    \ hasn’t reached version 1 yet, it’s being used for complex and large applications,\
    \ making it a feasible solution for complex applications.\n\nOne of the most attractive\
    \ features of Elm is the beginner-friendly compiler, which, instead of producing\
    \ hard-to-read messages, generates code that helps you to fix your code. If you’re\
    \ learning the language, the compiler itself can be of big help.\n\n```\nmodule\
    \ Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain : Program\
    \ Never Model Msg\nmain =\n    Html.program\n        { init = init\n        ,\
    \ update = update\n        , view = view\n        , subscriptions = subscriptions\n\
    \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg\
    \ )\ninit = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
    \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
    \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview\
    \ : Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
    \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\
    \nSitePoint has a handy [getting started with Elm](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
    \ article if you want to find out more.\n\n## PureScript\n\n[PureScript](http://www.purescript.org/)\
    \ is a purely functional and strongly typed programming language, created by Phil\
    \ Freeman. It aims to provide strong compatibility with available JavaScript libraries,\
    \ similar to Haskell in spirit, but keeping JavaScript at its core.\n\nA strong\
    \ point for PureScript is its minimalism. It doesn’t include any libraries for\
    \ functionality that would be considered essential in other languages. For example,\
    \ instead of including generators and promises in the compiler itself, you can\
    \ use specific libraries for the task. You can choose the implementation you want\
    \ for the feature you need, which allows a highly efficient and personalized experience\
    \ when using PureScript, while keeping the generated code as small as possible.\n\
    \nAnother distinctive feature of its compiler is the ability to make clean and\
    \ readable code while maintaining compatibility with JavaScript, both concerning\
    \ libraries and tools.\n\nLike other languages, PureScript has its own [build\
    \ tool called Pulp](https://github.com/purescript-contrib/pulp), which can be\
    \ compared to Gulp, but for projects written in this language.\n\nRegarding the\
    \ type system — unlike Elm, which is the other ML-like language — PureScript has\
    \ support for advanced type features like [higher-kinded types](https://en.wikipedia.org/wiki/Kind_%28type_theory%29)\
    \ and type classes, which are taken from Haskell, allowing the creation of sophisticated\
    \ abstractions:\n\n```\nmodule Main where\n\nimport Prelude\nimport Data.Foldable\
    \ (fold)\nimport TryPureScript\n\nmain =\n    render $ fold\n      [ h1 (text\
    \ \"Try PureScript!\")\n      , p (text \"Try out the examples below, or create\
    \ your own!\")\n      , h2 (text \"Examples\")\n      , list (map fromExample\
    \ examples)\n      ]\n  where\n    fromExample { title, gist } =\n      link (\"\
    ?gist=\" <> gist) (text title)\n\n    examples =\n      [ { title: \"Algebraic\
    \ Data Types\"\n        , gist: \"37c3c97f47a43f20c548\"\n        }\n      , {\
    \ title: \"Loops\"\n        , gist: \"cfdabdcd085d4ac3dc46\"\n        }\n    \
    \  , { title: \"Operators\"\n        , gist: \"3044550f29a7c5d3d0d0\"\n      \
    \  ]\n```\n\nTo take your next step with PureScript, check out the [getting started\
    \ with PureScript](https://github.com/purescript/documentation/blob/master/guides/Getting-Started.md)\
    \ guide on GitHub.\n\n## CoffeeScript\n\nCoffeeScript is a language that aims\
    \ to expose the good parts of JavaScript while providing a cleaner syntax and\
    \ keeping the semantics in place. Although the popularity of the language has\
    \ been waning in recent years, it’s changing direction and recently received a\
    \ new major version providing support for ES2015+ features.\n\nThe code you write\
    \ in CoffeeScript is directly translated to readable JavaScript code and maintains\
    \ compatibility with existing libraries. From version 2, the compiler produces\
    \ code compatible with the latest versions of ECMAScript. For example, every time\
    \ you use a `class`, you get a `class` in JavaScript. Also, if you use React,\
    \ there’s good news: JSX is compatible with CoffeeScript.\n\nA very distinctive\
    \ feature of the compiler is the ability to process code written in the [literate\
    \ style](https://en.wikipedia.org/wiki/Literate_programming), where instead of\
    \ making emphasis in the code and having comments as an extra, you write comments\
    \ in the first place, and the code only occasionally appears. This style of programming\
    \ was introduced by Donald Knuth, making a code file very similar to a technical\
    \ article.\n\nUnlike the other languages, CoffeeScript code can be interpreted\
    \ directly in the browser using a library. So if you want to create a quick test,\
    \ you can write your code in `text/coffeescript` script tags, and include the\
    \ compiler, which will translate the code to JavaScript on the fly:\n"
