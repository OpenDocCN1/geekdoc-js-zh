    \    <body>\n-     <script src=\"bundle.js\"></script>\n+     <script src=\"app.bundle.js\"\
    ></script>\n    </body>\n  </html>\n```\n\nLet’s start up a server from the dist\
    \ directory to see this in action:\n\n```\ncd dist\nnpx serve\n```"
