    \ folder.build + 'images/';\n  return gulp.src(folder.src + 'images/**/*')\n \
    \   .pipe(newer(out))\n    .pipe(imagemin({ optimizationLevel: 5 }))\n    .pipe(gulp.dest(out));\n\
    });\n```\n\nAll tasks are syntactically similar. This code:\n\n1. Creates a new\
    \ task named `images`.\n\n2. Defines a function with a return value which …\n\n\
    3. Defines an `out` folder where build files will be located.\n\n4. Sets the Gulp\
    \ `src` source folder. The `/**/*` ensures that images in sub-folders are also\
    \ processed.\n\n5. Pipes all files to the `gulp-newer` module. Source files that\
    \ are newer than corresponding destination files are passed through. Everything\
    \ else is removed.\n\n6. The remaining new or changed files are piped through\
    \ `gulp-imagemin` which sets an optional `optimizationLevel` argument.\n\n7. The\
    \ compressed images are output to the Gulp `dest` folder set by `out`.\n\nSave\
    \ `gulpfile.js` and place a few images in your project's `src/images` folder before\
    \ running the task from the command line:\n\n```bash\ngulp images\n```\n\nAll\
    \ images are compressed accordingly and you’ll see output such as:\n\n```\nUsing\
    \ file gulpfile.js\nRunning 'imagemin'...\nFinished 'imagemin' in 5.71 ms\ngulp-imagemin:\
    \ image1.png (saved 48.7 kB)\ngulp-imagemin: image2.jpg (saved 36.2 kB)\ngulp-imagemin:\
    \ image3.svg (saved 12.8 kB)\n```\n\nTry running `gulp images` again and nothing\
    \ should happen because no newer images exist.\n\n### HTML Task\n\nWe can now\
    \ create a similar task which copies files from the source HTML folder. We can\
    \ safely minify our HTML code to remove unnecessary whitespace and attributes\
    \ using the [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean) plugin:\n\
    \n```bash\nnpm install gulp-htmlclean --save-dev\n```\n\nThis is then referenced\
    \ at the top of `gulpfile.js`:\n\n```javascript\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n  htmlclean\
    \ = require('gulp-htmlclean'),\n```\n\nWe can now create an `html` task at the\
    \ end of `gulpfile.js`:\n\n```javascript\n// HTML processing\ngulp.task('html',\
    \ ['images'], function() {\n  var\n    out = folder.build + 'html/',\n    page\
    \ = gulp.src(folder.src + 'html/**/*')\n      .pipe(newer(out));\n\n  // minify\
    \ production code\n  if (!devBuild) {\n    page = page.pipe(htmlclean());\n  }\n\
    \n  return page.pipe(gulp.dest(out));\n});\n```\n\nThis reuses `gulp-newer` and\
    \ introduces a couple of concepts:\n\n1. The `[images]` argument states that our\
    \ `images` task must be run before processing the HTML (the HTML is likely to\
    \ reference images). Any number of dependent tasks can be listed in this array\
    \ and all will complete before the task function runs.\n\n2. We only pipe the\
    \ HTML through `gulp-htmlclean` if `NODE_ENV` is set to `production`. Therefore,\
    \ the HTML remains uncompressed during development which may be useful for debugging.\n\
    \nSave `gulpfile.js` and run `gulp html` from the command line. Both the `html`\
    \ and `images` tasks will run.\n\n### JavaScript Task\n\nToo easy for you? Let's\
    \ process all our JavaScript files by building a basic module bundler. It will:\n\
    \n1. Ensure dependencies are loaded first using the [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
    \ plugin. This analyses comments at the top of each script to ensure correct ordering.\
    \ For example, `// requires: defaults.js lib.js`.\n\n2. Concatenate all script\
    \ files into a single `main.js` file using [gulp-concat](https://www.npmjs.com/package/gulp-concat).\n\
    \n3. Remove all `console` and `debugging` statements with [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
    \ and minimize code with [gulp-uglify](https://www.npmjs.com/package/gulp-uglify).\n"
