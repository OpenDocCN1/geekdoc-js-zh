    Mocha snippets in ES6 syntax. The focus of this extension is to keep the code
    dry, leveraging arrow functions and omitting curlies by where possible. Can be
    configured to allow semicolons.

    *   [Jasmine Code Snippets](https://marketplace.visualstudio.com/items?itemName=xabikos.JasmineSnippets):
    code snippets for Jasmine test framework.

