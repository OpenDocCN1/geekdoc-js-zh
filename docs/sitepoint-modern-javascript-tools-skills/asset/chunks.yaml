    \ Both the `html` and `images` tasks will run.\n\n### JavaScript Task\n\nToo easy\
    \ for you? Let's process all our JavaScript files by building a basic module bundler.\
    \ It will:\n\n1.  Ensure dependencies are loaded first using the [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
    \ plugin. This analyses comments at the top of each script to ensure correct ordering.\
    \ For example, `// requires: defaults.js lib.js`.\n\n2.  Concatenate all script\
    \ files into a single `main.js` file using [gulp-concat](https://www.npmjs.com/package/gulp-concat).\n\
    \n3.  Remove all `console` and `debugging` statements with [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
    \ and minimize code with [gulp-uglify](https://www.npmjs.com/package/gulp-uglify).\
    \ This step will only occur when running in production mode.\n\nInstall the plugins:\n\
    \n```\nnpm install gulp-deporder gulp-concat gulp-strip-debug gulp-uglify --save-dev\n\
    ```\n\nReference them at the top of `gulpfile.js`:\n\n```\nvar\n  ...\n  concat\
    \ = require('gulp-concat'),\n  deporder = require('gulp-deporder'),\n  stripdebug\
    \ = require('gulp-strip-debug'),\n  uglify = require('gulp-uglify'),\n```\n\n\
    Then add a new `js` task:\n\n```\n// JavaScript processing\ngulp.task('js', function()\
    \ {\n\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n    .pipe(deporder())\n\
    \    .pipe(concat('main.js'));\n\n  if (!devBuild) {\n    jsbuild = jsbuild\n\
    \      .pipe(stripdebug())\n      .pipe(uglify());\n  }\n\n  return jsbuild.pipe(gulp.dest(folder.build\
    \ + 'js/'));\n\n});\n```\n\nSave then run `gulp js` to watch the magic happen!\n\
    \n### CSS Task\n\nFinally, let’s create a CSS task which compiles Sass `.scss`\
    \ files to a single `.css` file using [gulp-sass](https://www.npmjs.com/package/gulp-sass).\
    \ This is a Gulp plugin for [node-sass](https://www.npmjs.com/package/node-sass)\
    \ which binds to the superfast [LibSass C/C++ port of the Sass engine](http://sass-lang.com/libsass)\
    \ *(you won't need to install Ruby)*. We'll presume your primary Sass file `scss/main.scss`\
    \ is responsible for loading all partials.\n\nOur task will also utilize the fabulous\
    \ [PostCSS](http://postcss.org/) via the [gulp-postcss](https://github.com/postcss/gulp-postcss)\
    \ plugin. PostCSS requires its own set of plugins and we'll install these:\n\n\
    *   [postcss-assets](https://www.npmjs.com/package/postcss-assets) to manage assets.\
    \ This allows us to use properties such as `background: resolve('image.png');`\
    \ to resolve file paths or `background: inline('image.png');` to inline data-encoded\
    \ images.\n\n*   [autoprefixer](https://www.npmjs.com/package/autoprefixer) to\
    \ automatically add vendor prefixes to CSS properties.\n\n*   [css-mqpacker](https://www.npmjs.com/package/css-mqpacker)\
    \ to pack multiple references to the same CSS media query into a single rule.\n\
    \n*   [cssnano](https://www.npmjs.com/package/cssnano) to minify the CSS code\
    \ when running in production mode.\n\nFirst, install all the modules:\n\n```\n\
    npm install gulp-sass gulp-postcss postcss-assets autoprefixer css-mqpacker cssnano\
    \ --save-dev\n```\n\nThen reference them at the top of `gulpfile.js`:\n\n```\n\
    var\n  ...\n  sass = require('gulp-sass'),\n  postcss = require('gulp-postcss'),\n\
    \  assets = require('postcss-assets'),\n  autoprefixer = require('autoprefixer'),\n\
    \  mqpacker = require('css-mqpacker'),\n  cssnano = require('cssnano'),\n```\n\
    \nWe can now create a new `css` task at the end of `gulpfile.js`. Note the `images`\
    \ task is set as a dependency because the `postcss-assets` plugin can reference\
    \ images during the build process. In addition, most plugins can be passed arguments\
    \ (refer to their documentation for more information):\n\n```\n// CSS processing\n\
    gulp.task('css', ['images'], function() {\n\n  var postCssOpts = [\n  assets({\
    \ loadPaths: ['images/'] }),\n  autoprefixer({ browsers: ['last 2 versions', '>\
    \ 2%'] }),\n  mqpacker\n  ];\n\n  if (!devBuild) {\n    postCssOpts.push(cssnano);\n\
    \  }\n\n  return gulp.src(folder.src + 'scss/main.scss')\n    .pipe(sass({\n \
    \     outputStyle: 'nested',\n      imagePath: 'images/',\n      precision: 3,\n\
    \      errLogToConsole: true\n    }))\n    .pipe(postcss(postCssOpts))\n    .pipe(gulp.dest(folder.build\
    \ + 'css/'));\n\n});\n```\n\nSave the file and run the task from the command line:\n\
    \n```\ngulp css\n```\n\n## Step 6: Automate Tasks\n\nWe've been running one task\
    \ at a time. We can run them all in one command by adding a new `run` task to\
    \ `gulpfile.js`:\n\n```\n// run all tasks\ngulp.task('run', ['html', 'css', 'js']);\n\
    ```\n\nSave and enter `gulp run` at the command line to execute all tasks. Note\
    \ that I omitted the `images` task because it's already set as a dependency for\
    \ the `html` and `css` tasks.\n\nIs this still too much hard work? Gulp offers\
    \ another method — `gulp.watch` — which can monitor your source files and run\
    \ an appropriate task whenever a file is changed. The method is passed a folder\
    \ and a list of tasks to execute when a change occurs. Let's create a new `watch`\
    \ task at the end of `gulpfile.js`:"
