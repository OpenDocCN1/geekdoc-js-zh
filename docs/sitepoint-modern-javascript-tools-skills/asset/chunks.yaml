    Hmm … that''s not right. The place is added, but the country is not being displayed.
    The problem obviously isn''t the HTML table code, since the first row has the
    country cell populated, so something must be happening on the JavaScript side.
    Open `app.js` and add a breakpoint on line 58 where it says:


    ```

    addPlace(city, country);

    ```


    Restart the debug session and try to add a new place again. The execution should
    pause at the breakpoint you just set. Start hovering over the relevant variables.
    You can also add expressions to the watch panel, as seen below:


    ![Country bug found](Images/152442838920-country-bug-found.png)


    As you can see, the `country` variable is undefined, but the `city` variable is.
    If you look at the jQuery selector expressions that have been set up in the watch
    panel, you''ll notice that the `#country` selector returns nothing. This means
    it wasn''t present in the DOM. Head over to `index.html` to verify.


    Alas! If you look at line 59 where the country input has been defined, it''s missing
    the ID attribute. You need to add one like this:


    ```

    <input type="text" placeholder="Enter Country" name="country" id="country">

    ```


    Restart the debugging session and try to add a new place.


    ![Country bug fixed](Images/152442839121-country-fixed.png)


    It now works! Great job fixing another bug without `console.log`. Let''s now move
    on to our final bug.


    ## Debugging Client-side Routing


    Click the `Convert` link in the navigation bar. You should be taken to this view
    to perform a quick conversion:


    ![Convert currency](Images/152442839322-convert-currency.png)


    That runs fine. No bugs there.


    Actually there are, and they have nothing to do with the form. To spot them, refresh
    the page.


    As soon as you hit reload, the user is navigated to back to `/`, the root of the
    app. This is clearly a routing problem which the Vanilla Router package is suppose
    to handle. Head back to `app.js` and look for this line:


    ```

    router.navigateTo(window.location.path);

    ```


    This piece of code is supposed to route users to the correct page based on the
    URL provided. But why isn''t it working? Let''s add a breakpoint here, then navigate
    back to the `/convert` URL and try refreshing the page again.


    As soon as you refresh, the editor pauses at the breakpoint. Hover over the express
    `windows.location.path`. A popup appears which says the value is `undefined`.
    Let''s go to the debug console and start typing the expression below:


    ![Navigation error](Images/15244283923-navigation-error.png)


    Hold up! The debug console just gave us the correct expression. It''s supposed
    to read `window.location.pathname`. Correct the line of code, remove the breakpoint
    and restart the debugging session.


    Navigate to the `/convert` URL and refresh. The page should reload the correct
    path. Awesome!


    That''s the last bug we''re going to squash, but I do recommend you keep on experimenting
    within the debug session. Set up a debug session.

