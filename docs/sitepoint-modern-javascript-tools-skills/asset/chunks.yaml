    \ and let it pause on the breakpoint. Now the `places` array has a clean state.\
    \ This should allow our test to run unpolluted. Just click *Continue* to let the\
    \ rest of the test code execute.\n\n![Mocha tests passed](Images/152442836013-mocha-tests-passing.png)\n\
    \nAll tests are now passing. You should feel pretty awesome, since you've learned\
    \ how to debug code without writing a single line of `console.log`. Let's now\
    \ look at how to debug client-side code using the browser.\n\n## Debugging JavaScript\
    \ with Chrome Debugger\n\nNow that you’ve become familiar with the basics of debugging\
    \ JavaScript in VS Code, we’re going to see how to debug a slightly more complex\
    \ project using the [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ extension. Simply open the marketplace panel via the action bar. Search for\
    \ the extension and install it.\n\n![Debugger for Chrome](Images/152442836414-debugger-for-chrome.png)\n\
    \nAfter installation, hit reload to activate the extension. Let's quickly review\
    \ the code that we'll be debugging. The web application is mostly a client-side\
    \ JavaScript project that’s launched by running an Express server:\n\n```\nconst\
    \ express = require('express');\n\nconst app = express();\nconst port = 3000;\n\
    \n// Set public folder as root\napp.use(express.static('public'));\n\n// Provide\
    \ access to node_modules folder\napp.use('/scripts', express.static(`${__dirname}/node_modules/`));\n\
    \n// Redirect all traffic to index.html\napp.use((req, res) => res.sendFile(`${__dirname}/public/index.html`));\n\
    \napp.listen(port, () => {\n  console.info('listening on %d', port);\n});\n```\n\
    \nAll the client-side code is in the `public` folder. The project's dependencies\
    \ include Semantic-UI-CSS, jQuery, Vanilla Router, Axios and Handlebars. This\
    \ is what the project looks like when you run it with `npm start`. You'll have\
    \ to open the URL [localhost:3000](http://localhost:3000) in your browser to view\
    \ the application.\n\n![Places missing table](Images/152442836615-places-missing-table.png)\n\
    \nTry to add a new place. When you do, you'll see that nothing seems to be happening.\
    \ Clearly something’s going wrong, so it's time to look under the hood. We'll\
    \ first review the code before we start our debugging session. Open `public/index.html`.\
    \ Our focus currently is this section:\n\n```\n<!-- TEMPLATES -->\n<!-- Places\
    \ Form Template -->\n<script id=\"places-form-template\" type=\"text/x-handlebars-template\"\
    >\n  <h1 class=\"ui header\">\n    <i class=\"map marker alternate icon\"></i>\n\
    \    <div class=\"content\"> Places</div>\n  </h1>\n  <hr>\n  <br>\n  <form class=\"\
    ui form\">\n    <div class=\"fields\">\n      <div class=\"inline field\">\n \
    \       <label>City</label>\n        <input type=\"text\" placeholder=\"Enter\
    \ city\" id=\"city\" name=\"city\">\n      </div>\n      <div class=\"inline field\"\
    >\n        <label>Country</label>\n        <input type=\"text\" placeholder=\"\
    Enter Country\" name=\"country\">\n      </div>\n      <div class=\"ui submit\
    \ primary button\">Add Place</div>\n    </div>\n  </form>\n  <br>\n  <div id=\"\
    places-table\"></div>\n</script>\n\n<!-- Places Table Template -->\n<script id=\"\
    places-table-template\" type=\"text/x-handlebars-template\">\n  <table class=\"\
    ui celled striped table\">\n    <thead>\n      <tr>\n        <th>Id</th>\n   \
    \     <th>City</th>\n        <th>Country</th>\n        <th>NumType</th>\n    \
    \  </tr>\n    </thead>\n    <tbody>\n      {{#each places}}\n      <tr>\n    \
    \    <td>{{id}}</td>\n        <td>{{city}}</td>\n        <td>{{country}}</td>\n\
    \        <td>{{numType}}</td>\n      </tr>\n      {{/each}}\n    </tbody>\n  </table>\n\
    </script>\n```\n\nIf you take a quick glance, the code will appear to be correct.\
    \ So the problem must be in `app.js`. Open the file and analyze the code there.\
    \ Below are the sections of code you should pay attention to. Take your time to\
    \ read the comments in order to understand the code.\n\n```\n// Load DOM roots\n\
    const el = $('#app');\nconst placesTable = $('#places-table');\n\n// Initialize\
    \ empty places array\nconst places = [];\n\n// Compile Templates\nconst placesFormTemplate\
    \ = Handlebars.compile($('#places-form-template').html());\nconst placesTableTemplate\
    \ = Handlebars.compile($('#places-table-template').html());\n\nconst addPlace\
    \ = (city, country) => {\n  const id = places.length + 1;\n  const numType = (id\
    \ % 2 === 0) ? 'even' : 'odd';\n  places.push({\n    id, city, country, numType,\n\
    \  });\n};\n\n// Populate places array\naddPlace('Nairobi', 'Kenya');\n\n...\n\
    \n// Places View - '/'\nrouter.add('/', () => {\n  // Display Places Form\n  const\
    \ html = placesFormTemplate();\n  el.html(html);\n  // Form Validation Rules\n\
    \  $('.ui.form').form({\n    fields: {\n      city: 'empty',\n      country: 'empty',\n\
    \    },\n  });\n  // Display Places Table\n  const tableHtml = placesTableTemplate({\
    \ places });\n  placesTable.html(tableHtml);\n  $('.submit').on('click', () =>\
    \ {\n    const city = $('#city').val();\n    const country = $('#country').val();\n\
    \    addPlace(city, country);\n    placesTable.html(placesTableTemplate({ places\
    \ }));\n    $('form').form('clear');\n    return false;\n  });\n});\n```\n\nEverything\
    \ seems fine. But what could be the problem? Let's place a breakpoint on line\
    \ 53 where it says:\n\n```\nplacesTable.html(tableHtml);\n```\n\nNext, create\
    \ a *Chrome* configuration via the debug panel. Select the highlighted option:\n\
    \n![Chrome debug config](Images/152442836916-chrome-configuration.png)\n\nThen\
    \ update the Chrome config as follows to match our environment:\n\n```\n{\n  \"\
    type\": \"chrome\",\n  \"request\": \"launch\",\n  \"name\": \"Launch Chrome\"\
    ,\n  \"url\": \"http://localhost:3000\",\n  \"webRoot\": \"${workspaceFolder}/public\"\
    \n},\n```\n\nNext, start the server as normal using `npm start` or `node server`.\
    \ Then select *Launch Chrome* and start the debugging session. A new instance\
    \ of Chrome will be launched in debug mode and execution should pause where you\
    \ set the breakpoint. Now’s a good time to position Visual Studio Code and the\
    \ Chrome instance side by side so you can work efficiently.\n\n![Debugging JavaScript\
    \ with Chrome and VS Code](Images/152442837817-chrome-vscode-debug.png)\n\nMouse\
    \ over the `placesTable` constant. A popup appears, but it seems empty. In the\
    \ watch panel, add the expressions `el` and `placesTable`. Or, alternatively,\
    \ just scroll up to where the constants have been declared.\n\n![Element popup](Images/152442838318-el-popup.png)\n\
    \nNotice that `el` is populated but `placesTable` is empty. This means that jQuery\
    \ was unable to find the element `#places-table`. Let's go back to `public/index.html`\
    \ and find where this `#places-table` is located.\n\nAha! The table div we want\
    \ is located on line 55, right inside the `places-form-template`. This means the\
    \ div `#places-table` can only be found after the template, `places-form-template`,\
    \ has been loaded. To fix this, just go back to `app.js` and move the code to\
    \ line 52, right after the “Display Places Table” comment:\n\n```\nconst placesTable\
    \ = $('#places-table');\n```\n\nSave the file, and restart the debugging session.\
    \ When it reaches the breakpoint, just hit *Continue* and let the code finish\
    \ executing. The table should now be visible:\n\n![Chrome fixed table](Images/152442838118-chrome-fixed-table.png)\n\
    \nYou can now remove the breakpoint. Let's try adding a new place — for example,\
    \ Cape Town, South Africa\n\n![Country missing](Images/152442838619-chrome-country-missing.png)"
