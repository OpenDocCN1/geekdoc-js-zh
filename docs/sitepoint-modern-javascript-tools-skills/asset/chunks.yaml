  trans: "\n\n[Webpack](https://webpack.js.org/) 已经成为现代 Web 开发最重要的工具之一。它主要是一个用于 JavaScript\
    \ 的模块打包器，但你可以教它转换你所有的前端资源，如 HTML、CSS 甚至图像。它可以让你对应用发出的 HTTP 请求数量有更多控制，并允许你使用这些资源的其他格式（例如\
    \ Pug、Sass 和 ES8）。Webpack 还允许你轻松地使用 npm 包。\n\n本文面向 Webpack 的初学者，将涵盖初始设置与配置、模块、加载器（loaders）、插件（plugins）、代码分割和热模块替换。如果你觉得视频教程很有帮助，我强烈推荐将\
    \ Glen Maddern 的[从原理开始 Webpack](https://www.youtube.com/watch?v=WQue1AN93YU) 作为起点，来理解\
    \ Webpack 的特殊之处何在。虽然它现在有点久远了，但原理仍然相同，而且是一个非常棒的介绍。\n\n## 示例代码\n\n为了在家里跟着练习，你需要[安装\
    \ Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以[从\
    \ GitHub 下载演示应用](https://github.com/markbrown4/webpack-demo)。\n\n## 设置\n\n让我们用\
    \ npm 初始化新项目并安装 `webpack` 和 `webpack-cli`：\n\n```\nmkdir webpack-demo && cd webpack-demo\n\
    npm init -y\nnpm install --save-dev webpack webpack-cli\n```\n\n接下来我们将创建以下目录结构和内容：\n\
    \n```\n webpack-demo\n  |- package.json\n+ |- webpack.config.js\n+ |- /src\n+\
    \   |- index.js\n+ |- /dist\n+   |- index.html\n```\n\n### `dist/index.html`\n\
    \n```\n<!doctype html>\n<html\n  <head>\n    <title>Hello Webpack</title>\n  </head>\n\
    \  <body>\n    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n\
    ### `src/index.js`\n\n```javascript\nconst root = document.createElement(\"div\"\
    )\nroot.innerHTML = `<p>Hello Webpack.</p>`\ndocument.body.appendChild(root)\n\
    ```\n\n### `webpack.config.js`\n\n```javascript\nconst path = require('path')\n\
    \nmodule.exports = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n\
    \    path: path.resolve(__dirname, 'dist')\n  }\n}\n```\n\n这告诉 Webpack 编译我们入口点\
    \ `src/index.js` 中的代码，并在 `/dist/bundle.js` 输出包。让我们添加一个用于运行 Webpack 的 [npm 脚本](https://docs.npmjs.com/misc/scripts)。\n\
    \n### `package.json`\n\n```json\n {\n    ...\n    \"scripts\": {\n-     \"test\"\
    : \"echo \\\"Error: no test specified\\\" && exit 1\"\n+     \"develop\": \"webpack\
    \ --mode development --watch\",\n+     \"build\": \"webpack --mode production\"\
    \n    },\n    ...\n  }\n```\n\n使用 `npm run develop` 命令，我们可以创建第一个包！\n\n```\nAsset\
    \      Size      Chunks           Chunk Names\nbundle.js  2.92 KiB  main  [emitted]\
    \  main\n```\n\n你现在应该能够在浏览器中加载 `dist/index.html` 并看到“Hello Webpack”的欢迎了。\n\n打开\
    \ `dist/bundle.js` 查看 Webpack 做了什么。顶部是 Webpack 的模块引导代码，最底部是我们的模块。你可能还没觉得惊艳，但如果你已经走到了这里，现在就可以开始使用\
    \ ES Modules 了，Webpack 将能够创建一个可以在所有浏览器中运行的生产包。\n\n使用 `Ctrl` + `C` 重启构建并运行 `npm\
    \ run build` 以生产模式编译我们的包。\n\n```\nAsset      Size       Chunks           Chunk\
    \ Names\nbundle.js  647 bytes  main  [emitted]  main\n```\n\n注意到包的大小从 `2.92 KiB`\
    \ 降到了 `647 bytes`。\n\n再次查看 `dist/bundle.js`，你会看到一团杂乱的代码。我们的包已经通过 UglifyJS 了压缩：代码运行方式完全相同，但实现了尽可能小的文件大小。\n\
    \n*   `--mode development` 为构建速度和调试进行优化。\n*   `--mode production` 为运行时的执行速度和输出文件大小进行优化。\n\
    \n## 模块\n\n使用 ES Modules，你可以将大型程序分成许多较小的、自独立的程序。\n\n默认情况下，Webpack 知道如何使用 `import`\
    \ 和 `export` 语句消费 ES Modules。例如，让我们现在尝试一下，安装 [lodash-es](https://lodash.com/)\
    \ 并添加第二个模块：\n\n```\nnpm install --save-dev lodash-es\n```\n\n### `src/index.js`\n\
    \n```javascript\nimport { groupBy } from \"lodash-es\"\nimport people from \"\
    ./people\"\n\nconst managerGroups = groupBy(people, \"manager\")\n\nconst root\
    \ = document.createElement(\"div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
    \ null, 2)}</pre>`\ndocument.body.appendChild(root)\n```\n\n### `src/people.js`\n\
    \n```javascript\nconst people = [\n  {\n    manager: \"Jen\",\n    name: \"Bob\"\
    \n  },\n  {\n    manager: \"Jen\",\n    name: \"Sue\"\n  },\n  {\n    manager:\
    \ \"Bob\",\n    name: \"Shirley\"\n  }\n]\n\nexport default people\n```\n\n运行\
    \ `npm run develop` 启动 Webpack 并刷新 `index.html`。你应该能看到屏幕上打印了按经理分组的人数组。\n\n###\
    \ 不带相对路径的导入\n\n不带相对路径的导入（如 `'es-lodash'`）是安装到 `/node_modules` 的 npm 模块。自己的模块始终需要相对路径，如\
    \ `'./people'`，因为这是区分它们的方法。\n\n注意控制台中，我们的包大小增加到了 `1.41 MiB`！这值得关注，尽管在这种情况下不需要担心。使用\
    \ `npm run build` 在生产模式下编译，所有来自 `lodash-es` 的未使用的 lodash 模块都会从包中移除。这种移除未使用导入的过程被称为树摇优化（tree-shaking），是\
    \ Webpack 免费提供的功能。\n\n```\n> npm run develop\n\nAsset      Size      Chunks  \
    \         Chunk Names\nbundle.js  1.41 MiB  main\n```\n\n## 加载器 (loaders) 允许你对文件运行预处理器。让我们通过\
    \ [Babel](https://babeljs.io/) 加载 `.js` 时发生了什么：\n\n```\nnpm install --save-dev\
    \ babel-loader @babel/preset-env\n```\n\n### `webpack.config.js`\n\n```javascript\n\
    const path = require('path')\n\nmodule.exports = {\n  entry: './src/index.js',\n\
    \  output: {\n    filename: 'bundle.js',\n    path: path.resolve(__dirname, 'dist')\n\
    \  },\n  module: {\n    rules: [\n      {\n        test: /\\.js$/,\n        exclude:\
    \ /(node_modules|bower_components)/,\n        use: {\n          loader: 'babel-loader',\n\
    \        }\n      }\n    ]\n  }\n}\n```\n\n### `.babelrc`\n\n```json\n{\n  \"\
    presets\": [\n    [\"@babel/env\", {\n      \"modules\": false\n    }]\n  ],\n\
    \  \"plugins\": [\"syntax-dynamic-import\"]\n}\n```\n\n此配置防止 Babel 将 `import`\
    \ 和 `export` 语句编译为 ES5，并启用动态导入——我们稍将在代码分割章节中讨论。我们现在可以自由使用现代语言特性，并将编译为在所有浏览器中运行的\
    \ ES5。\n\n### Sass\n\n加载器可以链成一系列转换。演示其工作原理的好方法是从我们的 JavaScript 中导入 Sass：\n\n```\n\
    npm install --save-dev style-loader css-loader sass-loader node-sass\n```\n\n\
    ### `webpack.config.js`\n\n```javascript\nmodule.exports = {\n  ...\n  module:\
    \ {\n    rules: [\n      ...\n      {\n        test: /\\.scss$/,\n        use:\
    \ [{\n          loader: 'style-loader'\n        }, {\n          loader: 'css-loader'\n\
    \        }, {\n          loader: 'sass-loader'\n        }]\n      }\n    ]\n \
    \ }\n}\n```\n\n这些加载器按相反顺序处理：\n\n*   `sass-loader` 将 Sass 转换为 CSS。\n*   `css-loader`\
    \ 解析 CSS 为 JavaScript 并解析任何依赖。\n*   `style-loader` 将我们的 CSS 输出到文档的 `<style>` 标签中。你可以将这些看作函数调用。一个加载器的输出作为下一个加载器的输入：\n\
    \n```\nstyleLoader(cssLoader(sassLoader(\"source\")))\n```\n\n"
- fmt: "\nLet’s add a Sass source file and import is a module.\n\n`src/style.scss`\n\
    \n```scss\n$bluegrey: #2b3a42;\n\npre {\n  padding: 8px 16px;\n  background: $bluegrey;\n\
    \  color: #e1e6e9;\n  font-family: Menlo, Courier, monospace;\n  font-size: 13px;\n\
    \  line-height: 1.5;\n  text-shadow: 0 1px 0 rgba(23, 31, 35, 0.5);\n  border-radius:\
    \ 3px;\n}\n```\n\n`src/index.js`\n\n```javascript\n import { groupBy } from 'lodash-es'\n\
    import people from './people'\n\n+ import './style.scss'\n\n  ...\n```\n\nRestart\
    \ the build with `Ctrl` + `C` and `npm run develop`. Refresh `index.html` in the\
    \ browser and you should see some styling.\n\n## CSS in JS\n\nWe just imported\
    \ a Sass file from our JavaScript, as a module.\n\nOpen up `dist/bundle.js` and\
    \ search for `pre {`. Indeed, our Sass has been compiled to a string of CSS and\
    \ saved as a module within our bundle. When we import this module into our JavaScript,\
    \ `style-loader` outputs that string into an embedded `<style>` tag.\n\n### Why\
    \ would you do such a thing?\n\nI won’t delve too far into this topic here, but\
    \ here are a few reasons to consider:\n\n- A JavaScript component you may want\
    \ to include in your project may depend on other assets to function properly (HTML,\
    \ CSS, Images, SVG). If these can all be bundled together, it’s far easier to\
    \ import and use.\n- Dead code elimination: When a JS component is no longer imported\
    \ by your code, the CSS will no longer be imported either. The bundle produced\
    \ will only ever contain code that does something.\n- CSS Modules: The global\
