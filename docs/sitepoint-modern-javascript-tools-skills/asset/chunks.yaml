  trans: "\n\n[TypeScript](https://www.typescriptlang.org/) 是 JavaScript 的超集。一个有效的\
    \ JavaScript 程序也是有效的 TypeScript，但增加了静态类型。编译器还可以用作从 ES2015+ 到当前实现的转译器，因此你始终可以获得最新的的特性。\n\
    \n与许多其他语言不同，TypeScript 保持了 JavaScript 的精髓，只添加了旨在提高代码健壮性的功能。这些是类型注解和其他与类型相关的功能，它们让编写\
    \ JavaScript 变得更加愉快，这得益于静态分析器等专门化工具的启用，这些工具可以为重构过程提供帮助。此外，类型的添加改进了你应用程序中不同组件之间的接口。\n\
    \n该语言支持类型推断，因此你不需要从一开始就编写所有的类型。你可以编写快速解决方案，然后添加所有类型以对你的代码充满信心。\n\nTypeScript 还支持高级类型，例如交叉类型、联合类型、类型别名、判别式联合和类型守卫。你可以在\
    \ [TypeScript 文档](https://www.typescriptlang.org/docs) 网站中的[高级类型](https://www.typescriptlang.org/docs/handbook/advanced-types.html)\
    \ 页面查看所有内容。\n\n如果你使用 React，通过添加 React 类型定义也可以支持 JSX：\n\n```\nclass Person {\n\
    \  private name: string;\n  private age: number;\n  private salary: number;\n\n\
    \  constructor(name: string, age: number, salary: number) {\n    this.name = name;\n\
    \    this.age = age;\n    this.salary = salary;\n  }\n\n  toString(): string {\n\
    \    return `${this.name} (${this.age}) (${this.salary})`;\n  }\n}\n```\n\n有关\
    \ typeScript 的更多信息，请查看 SitePoint 的[TypeScript 入门](https://www.sitepoint.com/introduction-to-typescript/)\
    \ 文章。\n\n## Elm\n\nElm 是一种纯函数编程语言，可以编译为 JavaScript、HTML 和 CSS。你只需要用 Elm 就可以构建完整的网站，使其成为\
    \ React 等 JavaScript 框架的极佳替代方案。用它构建的应用会自动使用虚拟 DOM 库，使其运行非常快。一个很大的优势是内置架构，它让你忘记数据流，转而关注数据声明和逻辑。\n\
    \n在 Elm 中，所有函数都是纯的，这意味着对于给定的输入，它们始终返回相同的输出。除非你指定，否则它们不会执行任何其他操作。例如，要访问远程 API，你需要创建\
    \ `command` 函数与外部世界通信，并使用 `subscriptions` 监听响应。纯性的另一个点是值是不可变的：当你需要某些东西时，你会创建一个新值，而不是修改它们。\n\
    \n对 Elm 的采用可以是渐进的。你可以使用 `ports` 与 JavaScript 和其他库进行通信。尽管 Elm 还没有达到版本 1，但它正被用于复杂的大型应用程序，使其成为复杂应用的可行解决方案。\n\
    \nElm 最具吸引力的特性之一是对初友的编译器，它不会产生难以读懂的信息，而是生成帮助你修复代码的代码。如果你正在学习这种语言，编译器本身可以提供很大帮助。\n\
    \n```\nmodule Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain\
    \ : Program Never Model Msg\nmain =\n    Html.program\n        { init = init\n\
    \        , update = update\n        , view = view\n        , subscriptions = subscriptions\n\
    \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg\
    \ )\ninit = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
    \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
    \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview\
    \ : Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
    \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\
    \n如果你想了解更多信息，SitePoint 有篇实用的[Elm 入门](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
    \ 文章。\n\n## PureScript\n\n[PureScript](http://www.purescript.org/) 是一种由 Phil Freeman\
    \ 创建的纯函数且强类型编程语言。它的目标是与现有的 JavaScript 库提供强兼容性，在精神上类似于 Haskell，但将 JavaScript 保留在核心。\n\
    \nPureScript 的一个优点是它的极简主义。它不包含任何在其他语言中被认为是本质的功能库。例如，与其在编译器本身中包含生成器和承诺（promises），你可以使用特定的库来完成任务。你可以为需要的特性选择你想要的实现，这使得在使用\
    \ PureScript 时能够获得高效且个性化的体验，同时保持生成的代码尽可能小。\n\n其编译器的另一个独特特性是能够在保持库和工具上与 JavaScript\
    \ 兼容的同时，编写整洁且可读的代码。\n\n与其他语言一样，PureScript 有它自己的[名为 Pulp 的构建工具](https://github.com/purescript-contrib/pulp)，它可以与\
    \ Gulp 相比，但是用于用这种语言编写的项目。\n\n关于类型系统——与 Elm（另一种类 ML 语言）不同，PureScript 支持高级类型特性，如[高阶类型](https://en.wikipedia.org/wiki/Kind_%28type_theory%29)\
    \ 和类型类，这些特性取自 Haskell，允许创建复杂的抽象：\n\n```\nmodule Main where\n\nimport Prelude\n\
    import Data.Foldable (fold)\nimport TryPureScript\n\nmain =\n    render $ fold\n\
    \      [ h1 (text \"Try PureScript!\")\n      , p (text \"Try out the examples\
    \ below, or create your!\")\n      , h2 (text \"Examples\")\n      , list (map\
    \ fromExample)\n      ]\n  where\n    fromExample { title, gist } =\n      link\
    \ (\"?=\" <> gist) (text title)\n\n    examples =\n      [ { title: \"Algebraic\
    \ Data Types\"\n        , gist: \"37c3c97f47a43f20c548\"\n        }\n      , {\
    \ title: \"Loops\"\n        , gist: \"cfdabcd085d4ac3dc46\"\n        }\n     \
    \ , { title: \"Operators\"\n        , gist: \"3044550f29a7c5d3d0\"\n        ]\n\
    ```\n\n学习 PureScript，请查看 GitHub 上的[PureScript 入门](https://github.com/purescript/documentation/blob/master/guides/Getting-Started.md)\
    \ 指南。\n\n## CoffeeScript\n\nCoffeeScript 是一种旨在暴露 JavaScript 优点同时提供更简洁语法的语言。尽管该语言的流行程度近年来一直在下降，但它正在改变方向，并最近获得了一个新的主版本以支持\
    \ ES2015+ 特性。\n\n用 CoffeeScript 编写的代码直接转换为可读的 JavaScript 代码，并与现有库兼容。从版本 2 开始，编译器生成的代码与最新版本的\
    \ ECMAScript 兼容。例如，每当你使用 `class` 时，你在 JavaScript 中就会得到一个 `class`。此外，如果你使用 React，有一个好消息：JSX\
    \ 与 CoffeeScript 兼容。\n\n编译器的一个非常独特的特性是能够处理以[文学化风格](https://en.wikipedia.org/wiki/Literate_programming)编写的代码，在这种风格中，不是在代码中强调并将注释作为额外，而是首先编写注释，代码只偶尔出现。这种编程风格由\
    \ Donald Knuth 引入，使得代码文件非常像技术文章。\n\n与其他语言不同，CoffeeScript 代码可以使用库直接在浏览器中进行解释。因此，如果你想创建一个快速测试，你可以在\
    \ `text/coffeescript` 脚本标签中编写代码，并包含编译器，它将实时将代码转换为 JavaScript：\n\n"
- fmt: "\n```\n# Assignment:\nnumber   = 42\nopposite = true\n\n# Conditions:\nnumber\
    \ = -42 if opposite\n\n# Functions:\nsquare = (x) -> x * x\n\n# Arrays:\nlist\
    \ = [1, 2, 3, 4, 5]\n\n# Objects:\nmath =\n  root:   Math.sqrt\n  square: square\n\
    \  cube:   (x) -> x * square x\n\n# Splats:\nrace = (winner, runners...) ->\n\
    \  print winner, runners\n\n# Existence:\nalert \"I knew it!\" if elvis?\n\n#\
    \ Array comprehensions:\ncubes = (math.cube num for num in list)\n```\n\nThe CoffeeScript\
    \ site has a handy [getting started with CoffeeScript 2](http://coffeescript.org/v2/#coffeescript-2)\
    \ resource.\n\n## ClojureScript\n\nClojureScript is a compiler that translates\
    \ the Clojure programming language to JavaScript. It’s a general-purpose, functional\
    \ language with dynamic typing and support for immutable data structures.\n\n\
    It’s the only one from this list that belongs to the Lisp family of programming\
    \ languages and, naturally, it shares a lot of the features. For example, the\
    \ code can be treated as data, and a macro system is available, making metaprogramming\
    \ techniques possible. Unlike other Lisps, Clojure has support for immutable data\
    \ structures, making the management of side effects easier.\n\nThe syntax can\
    \ look intimidating for newcomers because of its use of parentheses, but it has\
    \ profound reasons to be that way, and you’ll certainly appreciate it in the long\
    \ run. That minimalism in the syntax and its syntactic abstraction capabilities\
    \ make Lisp a powerful tool for solving problems that require high levels of abstraction.\n\
    \nAlthough Clojure is mainly a functional language, it isn’t pure like PureScript\
    \ or Elm. Side effects can still happen, but other functional features are still\
    \ present.\n\nClojureScript uses Google Closure for code optimization and also\
    \ has compatibility with existing JavaScript libraries:\n\n```\n; Extracted from\
    \ https://github.com/clojure/clojurescript/blob/master/samples/dom/src/dom/test.cljs\n\
    \n(ns dom.test\n  (:require [clojure.browser.event :as event]\n            [clojure.browser.dom\
    \   :as dom]))\n\n(defn log [& args]\n  (.log js/console (apply pr-str args)))\n\
    \n(defn log-obj [obj]\n  (.log js/console obj))\n\n(defn log-listener-count []\n\
    \  (log \"listener count: \" (event/total-listener-count)))\n\n(def source   \
    \   (dom/get-element \"source\"))\n(def destination (dom/get-element \"destination\"\
    ))\n\n(dom/append source\n            (dom/element \"Testing me \")\n        \
    \    (dom/element \"out!\"))\n\n(def success-count (atom 0))\n\n(log-listener-count)\n\
    \n(event/listen source\n              :click\n              (fn [e]\n        \
    \        (let [i (swap! success-count inc)\n                      e (dom/element\
    \ :li\n                                      {:id \"testing\"\n              \
    \                        :class \"test me out please\"}\n                    \
    \                  \"It worked!\")]\n                  (log-obj e)\n         \
    \         (log i)\n                  (dom/append destination\n               \
    \               e))))\n\n(log-obj (dom/element \"Text node\"))\n(log-obj (dom/element\
    \ :li))\n(log-obj (dom/element :li {:class \"foo\"}))\n(log-obj (dom/element :li\
    \ {:class \"bar\"} \"text node\"))\n(log-obj (dom/element [:ul [:li :li :li]]))\n\
    (log-obj (dom/element :ul [:li :li :li]))\n(log-obj (dom/element :li {} [:ul {}\
    \ [:li :li :li]]))\n(log-obj (dom/element [:li {:class \"baz\"} [:li {:class \"\
    quux\"}]]))\n\n(log-obj source)\n(log-listener-count)\n```\n\nTo lean more, head\
    \ over to the ClojureScript site’s [getting started with ClojureScript](https://clojurescript.org/guides/quick-start)\
    \ resource.\n\n## Scala.js\n\nScala.js is a compiler that translates the Scala\
    \ programming language to JavaScript. Scala is a language that aims to merge the\
    \ ideas from object-oriented and functional programming into one language to create\
    \ a powerful tool that is also easy to adopt.\n\nAs a strongly typed language,\
    \ you get the benefits of a flexible type system with partial type inference.\
    \ Most values can be inferred, but function parameters still require explicit\
    \ type annotations.\n\nAlthough many common object-oriented patterns are supported\
    \ (for example, every value is an object and operations are method calls), you\
    \ also get functional features like support for first-class functions and immutable\
    \ data structures.\n\nOne of the special advantages of Scala.js is that you can\
    \ start with a familiar, object-oriented approach and move to a more functional\
    \ one as you need and at your own speed, without having to do a lot of work. Also,\
    \ existing JavaScript code and libraries are compatible with your Scala code.\n\
    \nBeginner Scala developers will find the language not very different from JavaScript.\
    \ Compare the following equivalent code:\n\n```\n// JavaScript\nvar xhr = new\
    \ XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
    \ +\n  \"tweets.json?q=%23scalajs\"\n);\nxhr.onload = (e) => {\n  if (xhr.status\
    \ === 200) {\n    var r = JSON.parse(xhr.responseText);\n    $(\"#tweets\").html(r);\n\
    \  }\n};\n```\n\n```\n// JavaScript\nvar xhr = new XMLHttpRequest();\n\nxhr.open(\"\
    GET\",\n  \"https://api.twitter.com/1.1/search/\" +\n  \"tweets.json?q=%23scalajs\"\
    \n);\nxhr.onload = (e) => {\n  if (xhr.status === 200) {\n    var r = JSON.parse(xhr.responseText);\n\
    \    $(\"#tweets\").html(r);\n  }\n};\n```\n\n```\n// Scala.js\nval xhr = new\
    \ XMLHttpRequest()\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
    \ +\n  \"tweets.json?q=%23scalajs\"\n)\nxhr.onload = { (e: Event) =>\n  if (xhr.status\
    \ == 200) {\n    val r = JSON.parse(xhr.responseText)\n    $(\"#tweets\").html(r)\n\
    \  }\n}\nxhr.send()\n```\n\nCheck out the Scala.js [getting started with Scala.js](https://www.scala-js.org/tutorial/basic/)\
    \ for more.\n\n## Reason\n\nReason is a language created and maintained by Facebook,\
    \ which offers a new syntax for OCaml, and the code can be translated to both\
    \ JavaScript and native code.\n\nBeing part of the ML family and a functional\
    \ language, it naturally offers a powerful but flexible type system with inference,\
    \ algebraic data types and pattern matching. It also has support for object-oriented\
    \ programming.\n\nThe use of existing JavaScript libraries is possible with [buckcript](https://github.com/BuckleScript/bucklescript)\
    \ bindings. You can also mix in JavaScript alongside your Reason code. The inserted\
    \ JavaScript code won’t be strictly checked, but it works fine for quick fixes\
    \ or prototypes.\n\nIf you’re a React developer, [bindings are available](https://github.com/reasonml/reason-react),\
    \ and the language also has support for JSX:\n\n```\n/* A type variant being matched\
    \ */\n\nlet possiblyValue1 = None;\nlet possiblyValue2 = Some \"Hello@\";\n\n\
    switch possiblyValue2 {\n| None => print_endline \"Nothing to see here.\"\n| Some\
    \ message => print_endline message\n};\n\n/* Parametrized types */\n\ntype universityStudent\
    \ = {gpa: float};\ntype response 'studentType = {status: int, student: 'studentType};\n\
    let result: response universityStudent = fetchData ();\n\n/* A simple typed object\
    \ */\n\ntype payload = Js.t {.\n  name: string,\n  age: int\n};\nlet obj1: payload\
    \ = {\"name\": \"John\", \"age\": 30};\n```\n\nCheck out the Reason site’s [getting\
    \ started with Reason](https://reasonml.github.io/guide/javascript/quickstart)\
    \ guide for more.\n\n## Haxe\n\nHaxe is a multi-paradigm programming language,\
    \ and its compiler can produce both binaries and source code in other languages.\n\
    \nAlthough Haxe provides a strict type system with support for type inference,\
    \ it can also work as a dynamic language if the target language supports it. In\
    \ the same way, it provides support for a variety of programming styles like object-oriented,\
    \ generic, and functional.\n\nWhen you write Haxe code, you can target several\
    \ platforms and languages for compilation without having to make considerable\
    \ changes. Target-specific code blocks are also available.\n\nYou can write both\
    \ back ends and front ends in Haxe with the same code and achieve communication\
    \ using [Haxe Remoting](https://haxe.org/manual/std-remoting-connection.html),\
    \ for both synchronous and asynchronous connections.\n\nAs expected, Haxe code\
    \ is compatible with existing libraries, but it also provides a mature standard\
    \ library:\n"
