    *   [npm](https://marketplace.visualstudio.com/items?itemName=eg2.vscode-npm-script):
    uses `package.json` to validate installed packages. Ensures that the installed
    packages have the correct version numbers, highlights installed packages missing
    from `package.json`, and packages that haven’t been installed.

    *   [Node.js Modules IntelliSense](https://marketplace.visualstudio.com/items?itemName=leizongmin.node-module-intellisense):
    autocomplete for JavaScript and TypeScript modules in import statements.

    *   [Path IntelliSense](https://marketplace.visualstudio.com/items?itemName=christian-kohler.path-intellisense):
    it’s not really Node related, but you definitely need IntelliSense for local files
    and this extension will autocomplete filenames.

    *   [Node exec](https://marketplace.visualstudio.com/items?itemName=miramac.vscode-exec-node):
    allows you to execute the current file or your selected code with Node.js.

    *   [View Node Package](https://marketplace.visualstudio.com/items?itemName=dkundel.vscode-npm-source):
    quickly view a Node package source with this extension, which allows you to open
    a Node package repository/documentation straight from VS Code.

    *   [Node Readme](https://marketplace.visualstudio.com/items?itemName=bengreenier.vscode-node-readme):
    quickly open npm package documentation.

    *   [Search node_modules](https://marketplace.visualstudio.com/items?itemName=jasonnutter.search-node-modules):
    this extension allows you to search the `node_modules` folder, which is usually
    excluded from standard search.

    *   [Import Cost](https://marketplace.visualstudio.com/items?itemName=wix.vscode-import-cost):
    displays size of an imported package.


    ## Formatting Extensions


    Once in a while, you find yourself formatting code that wasn’t written in a preferred
    style. To save time, you can install any of these VS Code extensions to quickly
    format and refactor existing code:

    *   [Beautify](https://marketplace.visualstudio.com/items?itemName=HookyQR.beautify):
    a [jsBeautifier](http://jsbeautifier.org/) extension that supports JavaScript,
    JSON, CSS and HTML. Can be customized via `.jsbeautifyrc` file. Most popular formatter
    with 2.3 million installs to date.

    *   [Prettier Code Formatter](https://marketplace.visualstudio.com/items?itemName=esbenp.prettier-vscode):
    an extension that supports the formatting of JavaScript, TypeScript and CSS using
    [Prettier](https://github.com/prettier/prettier) (an opinionated code formatter).
    Has over 1.5 million installs to date.

    *   [JS Refactor](https://marketplace.visualstudio.com/items?itemName=cmstead.jsrefactor):
    provides a number of utilities and actions for refactoring JavaScript code, such
    as extracting variables/methods, converting existing code to use arrow functions
    or template literals, and exporting functions.

    *   [JavaScript Booster](https://marketplace.visualstudio.com/items?itemName=sburg.vscode-javascript-booster):
    an amazing code refactoring tool. Features several coding actions such as converting
    `var` to `const` or `let`, removing redundant `else` statements, and merging declaration
    and initialization. Largely inspired by [WebStorm](https://www.jetbrains.com/webstorm/).


    ## Browser Extensions


    Unless you’re writing a console program in JavaScript, you’ll most likely be executing
    your JavaScript code inside a browser. This means you’ll need to frequently refresh
    the page to see the effect of each code update you make. Instead of doing this
    manually all the time, here are a few tools that can significantly reduce the
    development time of your iteration process:

    *   [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome):
    debug your JavaScript easily in Chrome (by setting breakpoints inside the editor.

    *   [Live Server](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer):
    local development server with live reload feature for static and dynamic pages.

    *   [Preview on Web Server](https://marketplace.visualstudio.com/items?itemName=yuichinukiyama.vscode-preview-server):
    provides web server and live preview features.

    *   [PHP Server](https://marketplace.visualstudio.com/items?itemName=brapifra.phpserver):
    useful for testing JavaScript code that needs to run client-side only.

    *   [Rest Client](https://marketplace.visualstudio.com/items?itemName=humao.rest-client):
    instead of using a browser or a CURL program to test your REST API endpoints,
    you can install this tool to interactively run HTTP requests right inside the
    editor.


    ## Framework Extensions


    For most projects, you’ll need a suitable framework to structure your code and
    cut down your development time. VS Code has support for most major frameworks
    through extensions. However, there are still a number of established frameworks
    that don’t have a fully developed extension yet. Here are some of the VS Code
    extensions that offer significant functionality.

    *   [Angular 6](https://marketplace.visualstudio.com/items?itemName=Mikael.Angular-BeastCode):
    snippets for Angular 6\. Supports Typescript, HTML, Angular Material ngRx, RxJS
    & Flex Layout. Has 2.2+ million installs and 172 Angular Snippets to date.

    *   [Angular v5 snippets](https://marketplace.visualstudio.com/items?itemName=johnpapa.Angular2):
    provides Angular snippets for TypeScript, RxJS, HTML and Docker files. Has 2.7+
    million installs to date.

    *   [React Native/React/Redux snippets for es6/es7](https://marketplace.visualstudio.com/items?itemName=EQuimper.react-native-react-redux):
    provides snippets in ES6/ES7 syntax for all of these frameworks.

    *   [React Native Tools](https://marketplace.visualstudio.com/items?itemName=vsmobile.vscode-react-native):
    provides IntelliSense, commands and debugging features for the React Native framework.

    *   [Vetur](https://marketplace.visualstudio.com/items?itemName=octref.vetur):
    provides syntax highlighting, snippets, Emmet, linting, formatting, IntelliSense
    and debugging support for the Vue framework. It comes with proper documentation
    published on [GitBook](https://vuejs.github.io/vetur/)

    *   [Ember](https://marketplace.visualstudio.com/items?itemName=felixrieseberg.vsc-ember-cli):
    provides command support and IntelliSense for Ember. After installation, all `ember
    cli` commands are available through Code’s own command list.

    *   [Cordova Tools](https://marketplace.visualstudio.com/items?itemName=vsmobile.cordova-tools):
    support for Cordova plugins and the Ionic framework. Provides IntelliSense, debugging
    and other support features for Cordova-based projects.

    *   [jQuery Code Snippets](https://marketplace.visualstudio.com/items?itemName=donjayamanne.jquerysnippets):
