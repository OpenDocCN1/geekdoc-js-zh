    \ learning the language, the compiler itself can be of big help.\n\n```\nmodule\
    \ Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain : Program\
    \ Never Model Msg\nmain =\n    Html.program\n        { init = init\n        ,\
    \ update = update\n        , view = view\n        , subscriptions = subscriptions\n\
    \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg\
    \ )\ninit = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
    \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
    \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview\
    \ : Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
    \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\
    \nSitePoint has a handy [getting started with Elm](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
    \ article if you want to find out more.\n\n## PureScript\n\n[PureScript](http://www.purescript.org/)\
    \ is a purely functional and strongly typed programming language, created by Phil\
    \ Freeman. It aims to provide strong compatibility with available JavaScript libraries,\
    \ similar to Haskell in spirit, but keeping JavaScript at its core.\n\nA strong\
    \ point for PureScript is its minimalism. It doesn’t include any libraries for\
    \ functionality that would be considered essential in other languages. For example,\
    \ instead of including generators and promises in the compiler itself, you can\
    \ use specific libraries for the task. You can choose the implementation you want\
    \ for the feature you need, which allows a highly efficient and personalized experience\
    \ when using PureScript, while keeping the generated code as small as possible.\n\
    \nAnother distinctive feature of its compiler is the ability to make clean and\
    \ readable code while maintaining compatibility with JavaScript, both concerning\
    \ libraries and tools.\n\nLike other languages, PureScript has its own [build\
    \ tool called Pulp](https://github.com/purescript-contrib/pulp), which can be\
    \ compared to Gulp, but for projects written in this language.\n\nRegarding the\
    \ type system — unlike Elm, which is the other ML-like language — PureScript has\
    \ support for advanced type features like [higher-kinded types](https://en.wikipedia.org/wiki/Kind_%28type_theory%29)\
    \ and type classes, which are taken from Haskell, allowing the creation of sophisticated\
    \ abstractions:\n\n```\nmodule Main where\n\nimport Prelude\nimport Data.Foldable\
    \ (fold)\nimport TryPureScript\n\nmain =\n    render $ fold\n      [ h1 (text\
    \ \"Try PureScript!\")\n      , p (text \"Try out the examples below, or create\
    \ your own!\")\n      , h2 (text \"Examples\")\n      , list (map fromExample\
    \ examples)\n      ]\n  where\n    fromExample { title, gist } =\n      link (\"\
    ?gist=\" <> gist) (text title)\n\n    examples =\n      [ { title: \"Algebraic\
    \ Data Types\"\n        , gist: \"37c3c97f47a43f20c548\"\n        }\n      , {\
    \ title: \"Loops\"\n        , gist: \"cfdabdcd085d4ac3dc46\"\n        }\n    \
    \  , { title: \"Operators\"\n        , gist: \"3044550f29a7c5d3d0d0\"\n      \
    \  }\n      ]\n```\n\nTo take your next step with PureScript, check out the [getting\
    \ started with PureScript](https://github.com/purescript/documentation/blob/master/guides/Getting-Started.md)\
    \ guide on GitHub.\n\n## CoffeeScript\n\nCoffeeScript is a language that aims\
    \ to expose the good parts of JavaScript while providing a cleaner syntax and\
    \ keeping the semantics in place. Although the popularity of the language has\
    \ been waning in recent years, it’s changing direction and recently received a\
    \ new major version providing support for ES2015+ features.\n\nThe code you write\
    \ in CoffeeScript is directly translated to readable JavaScript code and maintains\
    \ compatibility with existing libraries. From version 2, the compiler produces\
    \ code compatible with the latest versions of ECMAScript. For example, every time\
    \ you use a `class`, you get a `class` in JavaScript. Also, if you use React,\
    \ there’s good news: JSX is compatible with CoffeeScript.\n\nA very distinctive\
    \ feature of the compiler is the ability to process code written in the [literate\
    \ style](https://en.wikipedia.org/wiki/Literate_programming), where instead of\
    \ making emphasis in the code and having comments as an extra, you write comments\
    \ in the first place, and the code only occasionally appears. This style of programming\
    \ was introduced by Donald Knuth, making a code file very similar to a technical\
    \ article.\n\nUnlike the other languages, CoffeeScript code can be interpreted\
    \ directly in the browser using a library. So if you want to create a quick test,\
    \ you can write your code in `text/coffeescript` script tags, and include the\
    \ compiler, which will translate the code to JavaScript on the fly:"
