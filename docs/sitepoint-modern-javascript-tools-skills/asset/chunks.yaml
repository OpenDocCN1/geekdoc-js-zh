  trans: "\n\n- [Protractor Snippets](https://marketplace.visualstudio.com/items?itemName=deerawan.vscode-protractor-snippets):\
    \ 用于 Protractor 框架的端到端测试片段。支持 JavaScript 和 TypeScript。\n- [Node TDD](https://marketplace.visualstudio.com/items?itemName=prashaantt.node-tdd):\
    \ 为 Node 和 JavaScript 项目提供测试驱动开发支持。每当源代码更新时，可触发自动测试构建。\n\n# 优秀的扩展\n\n我只是把这下一批\
    \ VS Code 扩展放入了“优秀（awesome）”类别，因为这个词最能描述它们！\n\n- [Quokka.js](https://marketplace.visualstudio.com/items?itemName=WallabyJs.quokka-vscode):\
    \ 一个极其强大的调试工具，为 JavaScript 代码提供了一个快速原型的实验场。带有[卓越的文档](https://quokkajs.com/docs/)。\n\
    - [Paste as JSON](https://marketplace.visualstudio.com/items?itemName=quicktype.quicktype):\
    \ 快速将 JSON 数据转换为 JavaScript 代码。\n- [Code Metrics](https://marketplace.visualstudio.com/items?itemName=kisstkondoros.vscode-codemetrics):\
    \ 这是另一个优秀的扩展，用于计算 JavaScript 和 TypeScript 代码的复杂性。\n\n# 扩展包\n\n现在我们来到了最后一个类别，我想告诉大家，VS\
    \ Code 市场有一个[扩展扩展包类别](https://marketplace.visualstudio.com/search?term=extension%20packs&target=VSCode&category=All%20categories&sortBy=Relevance)。本质上，这些是将相关的\
    \ VS Code 扩展打包成一个包的集合，方便安装。以下是一些比较好的扩展包：\n\n- [Nodejs Extension Pack](https://marketplace.visualstudio.com/items?itemName=waderyan.nodejs-extension-pack):\
    \ 此包包含 `ESLint`、`npm`、JavaScript (ES6) 代码段、`node_modules` 搜索、`NPM` IntelliSense\
    \ 和 `Path IntelliSense`。\n- [VS Code for Node.js - Development Pack](https://marketplace.visualstudio.com/items?itemName=nodesource.vscode-for-node-js-development-pack):\
    \ 这个包含 `NPM` IntelliSense、`ESLint`、Chrome 调试器、`Code Metrics`、`Docker` 和 `Import\
    \ Cost`。\n- [Vue.js Extension Pack](https://marketplace.visualstudio.com/items?itemName=mubaidr.vuejs-extension-pack):\
    \ Vue 和 JavaScript 扩展的集合。目前包含大约 12 个 VS Code 扩展，其中一些在这里没有提到，例如 [auto-rename-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-rename-tag)\
    \ 和 [auto-close-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-close-tag)。\n\
    - [Ionic Extension Pack](https://marketplace.visualstudio.com/items?itemName=loiane.ionic-extension-pack):\
    \ 此包包含许多用于 Ionic、Angular、`RxJS`、Cordova 和 HTML 开发的 VS Code 扩展。\n\n# 总结\n\nVS Code\
    \ 大量的高质量扩展使其成为 JavaScript 开发者的热门选择。编写如此高效的 JavaScript 代码从未如此简单。像 `ESLint` 这样的扩展可以帮助你避免常见错误，而像\
    \ `Debugger for Chrome` 这样的扩展可以帮助你更容易地调试代码。Node.js 扩展及其 IntelliSense 功能可以帮助你正确导入模块，而\
    \ `Live Server` 和 `REST client` 等工具的可用减少了你对外部工具完成工作的依赖。所有这些工具都让你的迭代过程变得简单得多。\n\
    \n希望这个列表向你介绍了可以帮助你工作流的新型 VS Code 扩展。\n\n# 第 6 章：使用 VS Code 和 Chrome 调试器调试 JavaScript\
    \ 项目\n\n### 作者：Michael Wanyoike\n\n调试 JavaScript 并不是 JavaScript 编程中最有趣的方面，但是一项至关重要的技能。本文介绍了两个可以帮助你像专家一样调试\
    \ JavaScript 的工具。\n\n想象一下，如果 JavaScript 中不存在 `console.log()` 函数。我敢肯定你问问自己的第一个问题是：“我该如何确认我的代码运行正常呢？”\n\
    \n答案在于使用调试工具。长期以来，大多数开发者（包括我在内）一直都在使用 `console.log` 来调试故障代码。它快速且易于使用。然而，如果你不知道\
    \ bug 发生在哪里以及是由什么引起的，有时情况会变得棘手。通常你会发现自己在整个代码中到处布下 `console.log` 陷阱，看看哪一个能揭示罪魁祸首。\n\
    \n为了解决这个问题，我们需要改变习惯并开始使用调试工具。有许多工具可调试 JavaScript 代码，例如 Chrome Dev Tools、[Node\
    \ Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/)、`Node\
    \ Inspect` 等。事实上，每种[主流浏览器](https://www.w3schools.com/js/js_debugging.asp)都提供了自己的工具。\n\
    \n在本文中我们将我们将如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ 扩展，该扩展允许 VS Code 与 Chrome Dev Tools 集成。一旦我们完成，你将再也不想用 `console.log()` 了。\n\n\
    ## 前提条件\n\n对于本教程，你只需要对[现代 JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)\
    \ 有坚实的基础。我们还将查看如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ 扩展，该扩展允许 VS Code 与 Chrome Dev Tools 集成。一旦我们完成，你将再也不想用 `console.log()` 了。\n\n\
    ## 在 VS Code 中调试 JavaScript\n\n我想让你看到的第一个文件是 `src/places.js`。你需要在 VS Code 中打开\
    \ `debug-example` 文件夹（*文件* > *打开文件夹*），并在编辑器中选择该文件。\n\n```\nconst places = [];\n\
    \nmodule.exports = {\n  places,\n\n  addPlace: (city, country) => {\n    const\
    \ id = ++places.length;\n    let numType = 'odd';\n    if (id % 2) {\n      numType\
    \ = 'even';\n    }\n    places.push({\n      id, city, country, numType,\n   \
    \ });\n  },\n};\n```\n\n代码非常简单，如果你有足够的经验，你会发现它几个 bug。如果你发现了它们，请忽略它们。让我们在底部添加几行代码来手动测试：\n\
    \n```javascript\nmodule.exports.addPlace('Mombasa', 'Kenya');\nmodule.exports.addPlace('Kingston',\
    \ 'Jamaica');\nmodule.exports.addPlace('Cape Town', 'South Africa');\n```\n\n\
    现在，我确信你正急于用 `console.log` 来输出 `places` 的值。但让我们不要这样做。相反，让我们添加断点。只需点击左侧行槽——即行号旁边的空白处即可添加：\n\
    \n![指示断点的红点](img/152442833001-breakpoint.png)\n\n看到侧侧的红点了吗？那些就是断点。断点只是一个视觉指示，告诉调试工具在何处暂停。下一步，在操作栏上，点击调试按钮（显示“不允许\
    \ Bug”的图标）。\n\n等等，看顶部区域。你会注意到有一个带点的齿轮图标。只需点击它。系统会为你创建一个调试配置文件 `launch.json`。按如下所示配置，你就可以让\
    \ VS Code 调试器运行 `places.js` 了：\n\n"
- fmt: "\n```json\n\"configurations\": [\n  {\n    \"type\": \"node\",\n    \"request\"\
    : \"launch\",\n    \"name\": \"Launch Places\",\n    \"program\": \"${workspaceFolder}\\\
    \\src\\\\places.js\"\n  }\n]\n```\n\n### Backslashes\n\nDepending on your operating\
    \ system, you might have to replace the double backslash (`\\\\`) with a single\
    \ forward slash (`/`).\n\nAfter you’ve saved the file, you'll notice that the\
    \ debug panel has a new dropdown, `Launch Places`. To run it, you can:\n\n* hit\
    \ the Green Play button on the debug panel\n* press `F5`\n* click `Debug` > `Start\
    \ Debugging` on the menu bar.\n\nUse whatever method you like and observe the\
    \ debug process in action:\n\n![Debug running](Images/152442833503-debug-node-running.png)\n\
    \nA number of things happen in quick succession once you hit the debug button.\
    \ First, there's a toolbar that appears at the top of the editor. It has the following\
    \ controls:\n\n* `Drag Dots anchor**: for moving the toolbar to somewhere it’s\
    \ not blocking anything\n* `Continue`: continue the debugging session\n* `Step\
    \ over`: execute code line by line, skipping functions\n* `Step into`: execute\
    \ code line by line, going inside functions\n* `Step out`: if already inside a\
    \ function, this command will take you out\n* `Restart`: restarts the debugging\
    \ session\n* `Stop`: stops the debugging session.\n\nRight now, you'll notice\
    \ that the debug session has paused on your first breakpoint. To continue the\
    \ session, just hit the `Continue` button, which will cause execution to continue\
    \ until it reaches the second breakpoint and pause again. Hitting `Continue` again\
    \ will complete the execution and the debugging session will complete.\n\nLet's\
    \ start the debugging process again by hitting `F5`. Make sure the two breakpoints\
    \ are still in place. When you place a breakpoint, the code pauses at the specified\
    \ line. It doesn’t execute that line unless you hit `Continue` (`F5`) or `Step\
    \ Over` (`F10`). Before you hit anything, let's take a look at the sections that\
    \ make up the debug panel:\n\n* `Variables`: displays local and global variables\
    \ within the current scope (i.e., at the point of execution)\n* `Watch`: you can\
    \ manually add expressions of variables you want to monitor\n* `Call Stack`: displays\
    \ a call stack of the highlighted code\n* `Breakpoints`: displays a list of files\
    \ with breakpoints, along with their line numbers.\n\nTo add an expression to\
    \ the `Watch` section, simply click the `+` sign and add any valid JavaScript\
    \ expression — such as `places.length`. When the debugger pauses, if your expression\
    \ is in scope, the value will be printed out. You can also hover over variables\
    \ that are currently in scope. A popup will appear displaying their values.\n\n\
    Currently the `places` array is empty. Press any navigation control to see how\
    \ debugging works. For example, `Step over` will jump into the next line, while\
    \ `Step into` will navigate to the `addPlace` function. Take a bit of time to\
    \ get familiar with the controls.\n\nAs soon as you’ve done some stepping, hover\
    \ over the `places` variable. A popup will appear. Expand the values inside until\
    \ you have a similar view:\n\n![The places popup](Images/152442833804-places-hover.png)\n\
    \nYou can also inspect all variables that are in scope. The `Variables` section:\n\
    \n![The variables section](Images/152442834005-local-variables.png)\n\nThat's\
    \ pretty awesome compared to what we normally do with `console.log`. The debugger\
    \ allows us to inspect variables at a deeper level. You may have also noticed\
    \ couple of problems with the `places` array output:\n\n1. there are multiple\
    \ blanks in the array — that is `places[0]` and `places[2]` are `undefined`\n\
    2. the `numType` property displays `even` for odd `id` values.\n\nFor now, just\
    \ end the debugging session. We'll fix them in the next section.\n\n### Debugging\
    \ Tests with Mocha\n\nOpen `test/placesTest.js` and review the code that’s been\
    \ written to test the code in `places`. If you've never used Mocha, you need to\
    \ install it globally in order to run the tests.\n\n```bash\n# Install mocha\n\
    npm install -g mocha\n\n# Run mocha tests\nmocha\n```\n\nYou can also run `npm\
    \ test` to execute the tests. You should get the following output:\n\n![Failing\
    \ mocha tests](Images/152442834406-failing-mocha-tests.png)\n\nAll the tests are\
    \ failing. To find out the problem, we’re going to run the tests in debug mode.\
    \ To do that, we need a new configuration. Go to the debug panel and click the\
    \ dropdown to access the `Add Configuration` option:\n\n![Add configuration](Images/152442834507-add-configuration.png)\n\
    \nThe `launch.json` file will open for you with a popup listing several configurations\
    \ for you to choose.\n\n![Add mocha tests](Images/152442834707-mocha-test-configuration.png)\n\
    \nSimply select `Mocha Tests`. The following configuration will be inserted for\
    \ you:\n\n```json\n{\n  \"type\": \"node\",\n  \"request\": \"launch\",\n  \"\
    name\": \"Mocha Tests\",\n  \"program\": \"${workspaceFolder}/node_modules/bin/_mocha\"\
    ,\n  \"args\": [\n    \"-u\",\n    \"tdd\",\n    \"--timeout\",\n    \"99999\"\
    ,\n    \"--colors\",\n    \"${workspaceFolder}/test\"\n  ],\n  \"internalConsoleOptions\"\
    : \"openSessionStart\"\n}\n```\n\nThe default settings are fine. Go back to the\
    \ dropdown and select `Mocha Tests`. You'll need to comment out the last three\
    \ lines you added in `places.js`; otherwise the tests won't run as expected. Go\
    \ back to `placesTest.js` and add a breakpoint on the line before where the first\
    \ failure occurs. That should be line seven, where it says:\n\n```javascript\n\
    addPlace('Nairobi', 'Kenya');\n```\n\nMake sure to add a `places.length` expression\
    \ in the watch section. Hit the `Play` button to start the debugging session.\n\
    \n![Mocha test start](Images/152442834908-mocha-test-start.png)\n\nAt the start\
    \ of the test, `places.length` should read zero. If you hit `Step over`, `places.length`\
    \ reads 2, yet only one place has been added. How can that?\n\nRestart the debugging\
    \ session, and this time use `Step into` to navigate to the `addPlace` function.\
    \ The debugger will navigate you to `places.js`. The value of `places.length`\
    \ is still zero. Click `Step over` to execute the current line.\n\n![Mocha test\
    \ step](Images/152442835209-mocha-test-step.png)\n\nAha! The value of `places.length`\
    \ just incremented by 1, yet we haven't added anything to the array. The problem\
    \ is caused by the `++` operator which is mutating the array's length. To fix\
    \ this, simply replace the line with:\n\n```javascript\nconst id = places.length\
    \ + 1;\n```\n\nThis way, we can safely get the value of `id` without changing\
    \ the value of `places.length`. While we’re still in debug mode, let's try to\
    \ fix another problem where the `numType` property is given the value `even` while\
    \ `id` is 1. The problem seems to be the modulus expression inside the `if` statement:\n\
    \n![Mocha if error](Images/152442835410-mocha-if-error.png)\n\nLet's do a quick\
    \ experiment using the debug console. Start typing a proper expression for the\
    \ `if` statement:\n\n![Mocha debug console](Images/152442835511-mocha-debug-console.png)\n\
    \nThe debug console is similar to the browser console. It allows you to perform\
    \ experiments using variables that are currently in scope. By trying out a few\
    \ ideas in the console, you can easily find the solution without ever leaving\
    \ the editor. Let's now fix the failing `if` statement:\n\n```javascript\nif (id\
    \ % 2 === 0) {\n  numType = 'even';\n}\n```\n\nRestart the debug session and hit\
    \ `Continue` to skip the current breakpoint. The first test, “can add a place”,\
    \ is now passing. But the second test isn't. To fix this, we need another breakpoint.\
    \ Remove the current one and place a new breakpoint on line 16, where it says:\n\
