    \ [HTTP/2 现在允许在一次 `single`（单个）请求中交付多个文件](https://www.sitepoint.com/file-bundling-and-http2/)，因此合并不再是万灵药了。你的应用程序实际上可能从许多小文件的单独缓存中获益。这样客户端就可以获取单个更改的模块，而无需再次获取内容\
    \ `mostly`（大部分）相同的整个包。\n\nWebpack 的创建者 [Tobias Koppers](https://twitter.com/wSokra)\
    \ 编写了一篇信息量丰富的文章，解释了为什么即使在 HTTP/2 时代，打包仍然重要。\n\n可以在 [Webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6)\
    \ 了解更多信息。\n\n## 轮到你了\n\n我希望你发现这个关于 Webpack 的介绍有所帮助，并能够开始有效地使用它。理解 Webpack 的配置、加载器（loaders）和插件需要一些时间，但学习这个工具如何工作将是值得的。\n\
    \nWebpack 4 的文档目前正在编写中，但组织得非常好。我强烈建议阅读 [Concepts](https://webpack.js.org/concepts/)\
    \ 和 [Guides](https://webpack.js.org/guides/) 以获取更多信息。这里是你可能感兴趣的其他主题：\n\n*   [开发环境的\
    \ Source Maps](https://webpack.js.org/guides/development/#using-source-maps)\n\
    *   [生产环境的 Source Maps](https://webpack.js.org/guides/production/#source-mapping)\n\
    *   [使用哈希文件名进行缓存失效](https://webpack.js.org/guides/caching/)\n*   [拆分 vendor 包](https://webpack.js.org/plugins/commons-chunk-plugin/#explicit-vendor-chunk)\n\
    \n# 第 3 章：Gulp.js 简介\n\n### 作者：Craig Buckler\n\n开发者编写代码的时间非常宝贵。即使我们忽略那些烦人的会议，工作中的很大一部分也涉及消耗你工作日的基础任务：\n\
    \n*   从模板和内容文件生成 HTML\n*   压缩新的和修改的图像\n*   将 Sass 编译为 CSS 代码\n*   从脚本中移除 `console`\
    \ 和 `debugger` 语句\n*   将 ES6 转换为跨浏览器兼容的 ES5 代码\n*   代码检查和验证\n*   合并并压缩化 CSS 和\
    \ JavaScript 文件\n*   将文件部署到开发、测试和生产环境服务器。\n\n每当你做出更改时，都必须重复这些任务。你可能初衷良好，但即使是最万无一失的开发者也会忘记压缩一两个图像。随着时间的推移，生产前任务变得越来越艰巨且耗时；你将畏惧那些不可避免的内容和模板变化。这是一项令人枯燥、重复的工作。把时间花在更有价值的任务上不是更好吗？\n\
    \n如果是这样，你需要一个 `task runner`（任务运行器）或 `build process`（构建流程）。\n\n## 这听起来吓人复杂！\n\n\
    创建一个构建流程需要时间。它比手动执行每个任务要复杂，但从长远来看，它可以为你节省大量的精力并减少人为错误。采取务实的方法：\n\n*   自动化最令人痛苦的任务。\n\
    *   选择任务运行器软件并坚持一段时间。\n*   不要心血来复杂化你的构建流程。\n\n某些工具和概念对你来说可能是新的，但深呼吸，专注于一件事。\n\n\
    ## 任务运行器：选项\n\n像 [GNU Make](https://www.gnu.org/software/make/) 这样的工具已经存在了几十年，但\
    \ Web 任务运行器是一个相对新的现象。第一个是 [Grunt](http://gruntjs.com/) —— 一种由 JSON 配置控制的 Node.js\
    \ 任务运行器。Grunt 取得了成功，但也存在一些问题：\n\n1.  Grunt 需要插件来实现文件监听功能。\n2.  Grunt 插件通常执行多个任务，这使得自定义变得很别扭。\n\
    3.  JSON 配置可能会变得臃肿。\n4.  任务运行速度缓慢，因为 Grunt 在处理步骤之间保存文件。\n\n许多问题在后续版本中得到了解决，但 [Gulp](http://gulpjs.com/)\
    \ 已经并并许多改进：\n\n1.  内置了文件监听功能。\n2.  Gulp 插件 `mostly` 设计为执行单一工作。\n3.  Gulp 使用的 JavaScript\
    \ 配置更简洁、易读、易修改，并提供了更好的灵活性。\n4.  Gulp 运行更快，因为它使用 [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
    \ 在一系列管道插件之间传递数据。文件只在任务结束时写入。\n\n当然，Gulp 本身并不完美，新的任务运行器如 [Broccoli.js](http://broccolijs.com/)、[Brunch](http://brunch.io/)\
    \ 和 [webpack](https://webpack.github.io/) 也在竞争开发者的关注。最近，[npm 本身也被推为更简单的选项](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/)。所有工具都有优缺点，但\
    \ [Gulp 仍然是首选，目前被超过 40% 的 Web 开发者使用](https://ashleynolan.co.uk/blog/frontend-tooling-survey-2016-results)。\n\
    \nGulp 需要 Node.js，虽然一些 JavaScript 知识会有帮助，但所有 Web 背景的开发者都能受益。\n\n## 关于 Gulp 4\n\
    \n本教程描述了如何使用 Gulp 3 —— 这是编写时的最新发布版本。Gulp 4 已经开发了一段时间，但仍然是一个测试产品。你可以[使用或切换到 Gulp\
    \ 4](https://www.joezimjs.com/complete-guide-upgrading-gulp-4/)，但我建议在正式发布之前坚持使用版本\
    \ 3。\n\n## 第一步：安装 Node.js\n\n"
- fmt: "\nNode.js can be downloaded for Windows, macOS and Linux from [nodejs.org/download/](https://nodejs.org/download/).\
    \ There are various options for installing from binaries, package managers and\
    \ docker images, and full instructions are available.\n\n## Windows Users\n\n\
    Node.js and `Gulp` run on Windows, but some plugins may not install or run if\
    \ they depend on native Linux binaries such as image compression libraries. One\
    \ option for Windows 10 users is the new [bash command-line](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide),\
    \ which solves many issues.\n\nOnce installed, open a command prompt and enter:\n\
    \n```\nnode -v\n```\n\nThis reveals the version number. You're about to make heavy\
    \ use of `npm` — the Node.js package manager which is used to install modules.\
    \ Examine its version number:\n\n```\nnpm -v\n```\n\n## For Linux Users\n\nNode.js\
    \ modules can be installed globally so they’re available throughout your system.\
    \ However, most users will not have permission to write to the global directories\
    \ unless `npm` commands are prefixed with `sudo`. There are a number of [options\
    \ to fix npm permissions](https://docs.npmjs.com/getting-started/fixing-npm-permissions)\
    \ and tools such as [nvm can help](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/),\
    \ but I often change the default directory. For example, on Ubuntu/Debian-based\
    \ platforms:\n\n```\ncd ~\nmkdir .node_modules_global\nnpm config set prefix=$HOME/.node_modules_global\n\
    npm install npm -g \n```\n\nThen add the following line to the end of `~/.bashrc`:\n\
    \n```\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\" \n```\n\nFinally,\
    \ update with this:\n\n```\nsource ~/.bashrc \n```\n\n## Step 2: Install Gulp\
    \ Globally\n\nInstall Gulp command-line interface globally so the `gulp` command\
    \ can be run from any project folder:\n\n```\nnpm install gulp-cli -g\n```\n\n\
    Verify `Gulp` has installed with this:\n\n```\ngulp -v\n```\n\n## Step 3: Configure\
    \ Your Project\n\n### For Node.js Projects\n\nYou can skip this step if you already\
    \ have a `package.json` configuration file.\n\nPresume you have a new or pre-existing\
    \ project in the folder `project1`. Navigate to this folder and initialize it\
    \ with `npm`:\n\n```\ncd project1\nnpm init\n```\n\nYou’ll be asked a series of\
    \ questions. Enter a value or hit `Return` to accept defaults. A `package.json`\
    \ file will be created on completion which stores your `npm` configuration settings.\n\
    \n### For Git Users\n\nNode.js installs modules to a `node_modules` folder. You\
    \ should add this to your `.gitignore` file to ensure they’re not committed to\
    \ your repository. When deploying the project to another PC, you can run `npm\
    \ install` to restore them.\n\nFor the remainder of this article, we'll presume\
    \ your project folder contains the following sub-folders:\n\n**`src` folder: preprocessed\
    \ source files**\n\nThis contains further sub-folders:\n\n*   `html` - HTML source\
    \ files and templates\n*   `images` — the original uncompressed images\n*   `js`\
    \ — multiple preprocessed script files\n*   `scss` — multiple preprocessed Sass\
    \ `.scss` files\n\n**`build` folder: compiled/processed files**\n\nGulp will create\
    \ files and create sub-folders as necessary:\n\n*   `html` — compiled static HTML\
    \ files\n*   `images` — compressed images\n*   `js` — a single concatenated and\
    \ minified JavaScript file\n*   `css` — a single compiled and minified CSS file\n\
    \nYour project will almost certainly be different but this structure is used for\
    \ the examples below.\n\n### Following Along on Unix\n\nIf you're on a Unix-based\
    \ system and you just want to follow along with the tutorial, you can recreate\
    \ the folder structure with the following command:\n\n```\nmkdir -p src/{html,images,js,scss}\
    \ build/{html,images,js,css} \n```\n\n## Step 4: Install Gulp Locally\n\nYou can\
    \ now install Gulp in your project folder using the command:\n\n```\nnpm install\
    \ gulp --save-dev\n```\n\nThis installs Gulp as a development dependency and the\
    \ `\"devDependencies\"` section of `package.json` is updated accordingly. We’ll\
    \ presume Gulp and all plugins are development dependencies for the remainder\
    \ of this tutorial.\n\n### Alternative Deployment Options\n\nDevelopment dependencies\
    \ are not installed when the `NODE_ENV` environment variable is set to `production`\
    \ on your operating system. You would normally do this on your live server with\
    \ the Mac/Linux command:\n\n```\nexport NODE_ENV=production\n```\n\nOr on Windows:\n\
    \n```\nset NODE_ENV=production\n```\n\nThis tutorial assumes your assets will\
    \ be compiled to the `build` folder and committed to your Git repository or uploaded\
    \ directly to the server. However, it may be preferable to build assets on the\
    \ live server if you want to change the way they are created. For example, HTML,\
    \ CSS and JavaScript files are minified on production but not development environments.\
    \ In that case, use the `--save` option for Gulp and all plugins, i.e.\n\n```\n\
    npm install gulp --save\n```\n\nThis sets Gulp as an application dependency in\
    \ the `\"dependencies\"` section of `package.json`. It will be installed when\
    \ you enter `npm install` and can be run wherever the project is deployed. You\
    \ can remove the `build` folder from your repository since the files can be created\
    \ on any platform when required.\n\n## Step 4: Create a Gulp Configuration File\n\
    \nCreate a new `gulpfile.js` configuration file in the root. Add some basic code\
    \ to get started:\n\n```javascript\n// Gulp.js configuration\n\nvar\n  // modules\n\
    \  gulp = require('gulp'),\n\n  // development mode\n  devBuild = (process.env.NODE_ENV\
    \ !== 'production'),\n\n  // folders\n  folder = {\n    src: 'src/',\n    build:\
    \ 'build/'\n  };\n```\n\nThis references `gulp`, sets `devBuild` to `true` when\
    \ running in development (non-production) and defines the source and build locations.\n\
    \n### ES6\n\nES6 features are supported in Node 6 and above so feel free to use\
    \ arrow functions, `let`, `const` if you're using a recent version. `gulpfile.js`\
    \ won't do anything yet because you need to\n\n## Step 5: Create Gulp Tasks\n\n\
    On its own, Gulp does nothing. You must:\n\n1.  install Gulp plugins, and\n2.\
    \  write tasks which utilize those plugins to do something useful.\n\nIt's possible\
    \ to write your own plugins but, since almost 3,000 are available, it's unlikely\
    \ you'll ever need to. You can search using Gulp's own directory at [gulpjs.com/plugins/](http://gulpjs.com/plugins/),\
    \ on [npmjs.com](https://www.npmjs.com/), or search \"gulp *something*\" to harness\
    \ the mighty power of Google.\n\nGulp provides three primary task methods:\n\n\
    *   `gulp.task` — defines a new task with a name, optional array of dependencies\
    \ and a function.\n*   `gulp.src` — sets the folder where source files are located.\n\
    *   `gulp.dest` — sets the destination folder where build files will be placed.\n\
    \nAny number of plugin calls are set with `pipe` between the `.src` and `.dest`.\n\
    \n### Image Task\n\nThis is best demonstrated with an example, so let's create\
    \ a basic task which compresses images and copies them to the appropriate `build`\
    \ folder. Since this process could take time, we'll only compress new and modified\
    \ files. Two plugins can help us: [gulp-newer](https://www.npmjs.com/package/gulp-newer)\
    \ and [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin). Install them\
    \ from the command-line:\n\n```\nnpm install gulp-newer gulp-imagemin --save-dev\n\
    ```\n\nWe can now reference both modules the top of `gulpfile.js`:\n\n```javascript\n\
    // Gulp.js configuration\n\nvar\n  // modules\n  gulp = require('gulp'),\n  newer\
    \ = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n```\n\nWe\
    \ can now define the image processing task itself as a function at the end of\
    \ `gulpfile.js`:\n"
