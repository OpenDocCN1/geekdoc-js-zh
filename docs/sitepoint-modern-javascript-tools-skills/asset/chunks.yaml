  trans: "\n\n在发送请求时，你可以传递许多[额外选项](https://github.com/axios/axios#request-config)，但这里是最常用的几个：\n\
    \n* `baseUrl`：如果你指定了基础 URL，它将会被附加到你使用的任何相对 URL 之前。\n* `headers`：一个键/值对的对象，将作为请求头（headers）发送。\n\
    * `params`：一个键/值对的对象，该对象将被序列化并作为查询字符串附加到 URL 中。\n* `responseType`：如果你期望的响应格式不是于\
    \ JSON，可以将此属性设置为 `arraybuffer`、`blob`、`document`、`text` 或 `stream`。\n* `auth`：传递一个包含\
    \ `username` 和 `password` 字段的对象将使用这些凭据对请求进行 HTTP Basic 认证。\n\n## 便捷方法\n\n就像 jQuery\
    \ 一样，这里也提供了快捷方法来执行不同类型的请求。\n\n`get`、`delete`、`head` 和 `options` 方法接受两个参数：一个 URL\
    \ 和一个可选的配置对象。\n\n```\naxios.get('/products/5');\n```\n\n`post`、`put` 和 `patch`\
    \ 方法接受数据对象作为第二个参数，并将可选的配置对象作为第三个参数：\n\n```\naxios.post(\n  '/products',\n  { name:\
    \ 'Waffle Iron', price: 21.50 },\n  { options }\n);\n```\n\n## 接收响应\n\n一旦发送了请求，Axios\
    \ 会返回一个 promise，该 promise 将解析为响应对象或错误对象。\n\n```\naxios.get('/product/9')\n  .then(response\
    \ => console.log(response))\n  .catch(error => console.log(error));\n```\n\n###\
    \ 响应对象\n\n当请求成功时，你的 `then()` 回调将接收一个包含以下属性的响应对象：\n\n* `data`：服务器返回的负载。默认情况下，Axios\
    \ 期望返回 JSON 并将其为你解析为 JavaScript 对象。\n* `status`：服务器返回的 HTTP 状态码。\n* `statusText`：服务器返回的\
    \ HTTP 状态消息。\n* `headers`：服务器返回的所有头。\n* `config`：原始请求配置。\n* `request`：实际的 `XMLHttpRequest`\
    \ 对象（在浏览器中运行时）。\n\n### 错误对象\n\n如果请求出现问题，promise 将被拒绝，并返回一个包含至少某些属性的错误对象：\n\n*\
    \ `message`：错误消息文本。\n* `response`：响应对象（如果已接收），如前一节所述。\n* `request`：实际的 `XMLHttpRequest`\
    \ 对象（在浏览器中运行时）。\n* `config`：原始请求配置。\n\n## 转换器与拦截器\n\nAxios 提供了灵感来自 [Angular 的\
    \ $http 库](https://docs.angularjs.org/api/ng/service/$http) 的一些巧妙功能。尽管它们看起来相似，但用途略有不同。\n\
    \n### 转换器\n\nAxios 允许你提供函数来转换传出或传入的数据，形式为发送请求时可以设置的两个配置选项：`transformRequest` 和\
    \ `transformResponse`。这两个属性都是数组，允许你链式调用多个数据通过的函数。\n\n任何传递给 `transformRequest`\
    \ 的函数都适用于 PUT、POST 和 PATCH 请求。它们接收请求数据和 headers 对象作为参数，并必须返回一个修改后的数据对象。\n\n```\n\
    const options = {\n  transformRequest: [\n    (data, headers) => {\n      // 对数据进行操作\n\
    \      return data;\n    }\n  ]\n}\n```\n\n函数可以以相同的方式添加到 `transformResponse` 中，但它们仅用响应数据进行调用，并在响应传递给任何链式\
    \ `then()` 回调之前执行。\n\n那么，我们可以用转换器做什么呢？一个潜在的用例是处理期望特定格式数据（例如 XML 甚至 CSV）的 API。你可以设置一对转换器，将传出的数据与\
    \ API 需要的格式之间进行转换。\n\n值得注意的是，Axios 默认的 `transformRequest` 和 `transformResponse`\
    \ 函数会在数据与 JSON 之间进行转换，而指定你自己的转换器将覆盖这些设置。\n\n### 拦截器\n\n虽然转换器允许你修改传出和传入的数据，但 Axios\
    \ 也还允许你添加称为[拦截器](https://github.com/axios/axios#interceptors) 的函数。与转换器一样，这些函数可以绑定在发送请求时或接收到响应时触发。\n\
    \n```\n// 添加请求拦截器\naxios.interceptors.request.use((config) => {\n    // 在发送请求前做一些事情\n\
    \    return config;\n  }, (error) => {\n    // 对请求错误做一些事情\n    return Promise.reject(error);\n\
    \  });\n\n// 添加响应拦截器\naxios.interceptors.response.use((response) => {\n    //\
    \ 对响应数据做一些事情\n    return response;\n  }, (error) => {\n    // 对响应错误做一些事情\n   \
    \ return Promise.reject(error);\n  });\n```\n\n正如你可能从上面的示例中注意到的那样，拦截器与转换器有一些重要的区别。拦截器不仅仅接收数据或头，而是接收完整的请求配置或响应对象。\n\
    \n在创建拦截器时，你还可以选择提供一个错误处理函数，允许你捕获任何错误并进行妥善处理。\n\n请求拦截器可用于此类操作，如[从本地存储中检索令牌并随所有请求发送](https://www.npmjs.com/package/axios-token-interceptor)，而响应拦截器可以用于[捕获\
    \ 401 响应并重定向到登录页面](https://gist.github.com/yajra/5f5551649b20c8f66aec48549ef5c1f)\
    \ 进行身份验证。\n\n"
