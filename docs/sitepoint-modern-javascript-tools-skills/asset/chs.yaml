  \ TypeScript、RxJS、HTML 和 Docker 文件的 Angular 代码片段。截至目前安装量超过 270 万。\n*   [React Native/React/Redux\
  \ snippets for es6/es7](https://marketplace.visualstudio.com/items?itemName=EQuimper.react-native-react-redux):为所有这些框架提供\
  \ ES6/ES7 语法的代码片段。\n*   [React Native Tools](https://marketplace.visualstudio.com/items?itemName=vsmobile.vscode-react-native):为\
  \ React Native 框架提供 IntelliSense、命令和调试功能。\n*   [Vetur](https://marketplace.visualstudio.com/items?itemName=octref.vetur):为\
  \ Vue 框架提供语法高亮、代码片段、Emmet、代码检查、格式化、IntelliSense 和调试支持。它在 [GitBook](https://vuejs.github.io/vetur/)\
  \ 上发布了相应的文档。\n*   [Ember](https://marketplace.visualstudio.com/items?itemName=felixrieseberg.vsc-ember-cli):为\
  \ Ember 提供命令支持和 IntelliSense。安装后，所有的 `ember cli` 命令都可以通过 Code 自己的命令列表可用。\n*   [Cordova\
  \ Tools](https://marketplace.visualstudio.com/items?itemName=vsmobile.cordova-tools):对\
  \ Cordova 插件和 Ionic 框架的支持。为基于 Cordova 项目提供 IntelliSense、调试和其他功能。\n*   [jQuery Code\
  \ Snippets](https://marketplace.visualstudio.com/items?itemName=donjayamanne.jquerysnippets):提供超过\
  \ 130 个 jQuery 代码片段。通过前缀 `jq` 激活。\n\n## 测试扩展\n\n测试是软件开发中的关键部分，特别是对于生产阶段的项目。你可以获取\
  \ JavaScript 测试的概览，并在我们的指南中了解更多你可以运行的测试类型——[JavaScript 测试：单元 vs 功能 vs 集成](https://www.sitepoint.com/javascript-testing-unit-functional-integration/)。以下是一些流行的测试扩展：\n\
  *   [Mocha sidebar](https://marketplace.visualstudio.com/items?itemName=maty.vscode-mocha-sidebar):支持使用\
  \ Mocha 库进行测试。此扩展帮助你直接在代码上运行测试并显示错误。\n*   [ES6 Mocha Snippets](https://marketplace.visualstudio.com/items?itemName=spoonscen.es6-mocha-snippets):ES6\
  \ 语法的 Mocha 代码片段。此扩展的重点是保持代码简洁，利用箭头函数并尽可能省略大括号。可以配置为允许分号。\n*   [Jasmine Code Snippets](https://marketplace.visualstudio.com/items?itemName=xabikos.JasmineSnippets):用于\
  \ Jasmine 测试框架的代码片段。\n\n\n\n\n\n- [Protractor Snippets](https://marketplace.visualstudio.com/items?itemName=deerawan.vscode-protractor-snippets):\
  \ 用于 Protractor 框架的端到端测试片段。支持 JavaScript 和 TypeScript。\n- [Node TDD](https://marketplace.visualstudio.com/items?itemName=prashaantt.node-tdd):\
  \ 为 Node 和 JavaScript 项目提供测试驱动开发支持。每当源代码更新时，可触发自动测试构建。\n\n## 优秀的扩展\n\n我只是把这下一批 VS\
  \ Code 扩展放入了“优秀（awesome）”类别，因为这个词最能描述它们！\n\n- [Quokka.js](https://marketplace.visualstudio.com/items?itemName=WallabyJs.quokka-vscode):\
  \ 一个极其强大的调试工具，为 JavaScript 代码提供了一个快速原型的实验场。带有[卓越的文档](https://quokkajs.com/docs/)。\n\
  - [Paste as JSON](https://marketplace.visualstudio.com/items?itemName=quicktype.quicktype):\
  \ 快速将 JSON 数据转换为 JavaScript 代码。\n- [Code Metrics](https://marketplace.visualstudio.com/items?itemName=kisstkondoros.vscode-codemetrics):\
  \ 这是另一个优秀的扩展，用于计算 JavaScript 和 TypeScript 代码的复杂性。\n\n## 扩展包\n\n现在我们来到了最后一个类别，我想告诉大家，VS\
  \ Code 市场有一个[扩展扩展包类别](https://marketplace.visualstudio.com/search?term=extension%20packs&target=VSCode&category=All%20categories&sortBy=Relevance)。本质上，这些是将相关的\
  \ VS Code 扩展打包成一个包的集合，方便安装。以下是一些比较好的扩展包：\n\n- [Nodejs Extension Pack](https://marketplace.visualstudio.com/items?itemName=waderyan.nodejs-extension-pack):\
  \ 此包包含 `ESLint`、`npm`、JavaScript (ES6) 代码段、`node_modules` 搜索、`NPM` IntelliSense\
  \ 和 `Path IntelliSense`。\n- [VS Code for Node.js - Development Pack](https://marketplace.visualstudio.com/items?itemName=nodesource.vscode-for-node-js-development-pack):\
  \ 这个包含 `NPM` IntelliSense、`ESLint`、Chrome 调试器、`Code Metrics`、`Docker` 和 `Import\
  \ Cost`。\n- [Vue.js Extension Pack](https://marketplace.visualstudio.com/items?itemName=mubaidr.vuejs-extension-pack):\
  \ Vue 和 JavaScript 扩展的集合。目前包含大约 12 个 VS Code 扩展，其中一些在这里没有提到，例如 [auto-rename-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-rename-tag)\
  \ 和 [auto-close-tag](https://marketplace.visualstudio.com/items?itemName=formulahendry.auto-close-tag)。\n\
  - [Ionic Extension Pack](https://marketplace.visualstudio.com/items?itemName=loiane.ionic-extension-pack):\
  \ 此包包含许多用于 Ionic、Angular、`RxJS`、Cordova 和 HTML 开发的 VS Code 扩展。\n\n## 总结\n\nVS Code\
  \ 大量的高质量扩展使其成为 JavaScript 开发者的热门选择。编写如此高效的 JavaScript 代码从未如此简单。像 `ESLint` 这样的扩展可以帮助你避免常见错误，而像\
  \ `Debugger for Chrome` 这样的扩展可以帮助你更容易地调试代码。Node.js 扩展及其 IntelliSense 功能可以帮助你正确导入模块，而\
  \ `Live Server` 和 `REST client` 等工具的可用减少了你对外部工具完成工作的依赖。所有这些工具都让你的迭代过程变得简单得多。\n\n\
  希望这个列表向你介绍了可以帮助你工作流的新型 VS Code 扩展。\n\n# 第 6 章：使用 VS Code 和 Chrome 调试器调试 JavaScript\
  \ 项目\n\n### 作者：Michael Wanyoike\n\n调试 JavaScript 并不是 JavaScript 编程中最有趣的方面，但是一项至关重要的技能。本文介绍了两个可以帮助你像专家一样调试\
  \ JavaScript 的工具。\n\n想象一下，如果 JavaScript 中不存在 `console.log()` 函数。我敢肯定你问问自己的第一个问题是：“我该如何确认我的代码运行正常呢？”\n\
  \n答案在于使用调试工具。长期以来，大多数开发者（包括我在内）一直都在使用 `console.log` 来调试故障代码。它快速且易于使用。然而，如果你不知道 bug\
  \ 发生在哪里以及是由什么引起的，有时情况会变得棘手。通常你会发现自己在整个代码中到处布下 `console.log` 陷阱，看看哪一个能揭示罪魁祸首。\n\n\
  为了解决这个问题，我们需要改变习惯并开始使用调试工具。有许多工具可调试 JavaScript 代码，例如 Chrome Dev Tools、[Node Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/)、`Node\
  \ Inspect` 等。事实上，每种[主流浏览器](https://www.w3schools.com/js/js_debugging.asp)都提供了自己的工具。\n\
  \n在本文中我们将我们将如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展，该扩展允许 VS Code 与 Chrome Dev Tools 集成。一旦我们完成，你将再也不想用 `console.log()` 了。\n\n##\
  \ 前提条件\n\n对于本教程，你只需要对[现代 JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)\
  \ 有坚实的基础。我们还将查看如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展，该扩展允许 VS Code 与 Chrome Dev Tools 集成。一旦我们完成，你将再也不想用 `console.log()` 了。\n\n##\
  \ 在 VS Code 中调试 JavaScript\n\n我想让你看到的第一个文件是 `src/places.js`。你需要在 VS Code 中打开 `debug-example`\
  \ 文件夹（*文件* > *打开文件夹*），并在编辑器中选择该文件。\n\n```\nconst places = [];\n\nmodule.exports\
  \ = {\n  places,\n\n  addPlace: (city, country) => {\n    const id = ++places.length;\n\
  \    let numType = 'odd';\n    if (id % 2) {\n      numType = 'even';\n    }\n \
  \   places.push({\n      id, city, country, numType,\n    });\n  },\n};\n```\n\n\
  代码非常简单，如果你有足够的经验，你会发现它几个 bug。如果你发现了它们，请忽略它们。让我们在底部添加几行代码来手动测试：\n\n```javascript\n\
  module.exports.addPlace('Mombasa', 'Kenya');\nmodule.exports.addPlace('Kingston',\
  \ 'Jamaica');\nmodule.exports.addPlace('Cape Town', 'South Africa');\n```\n\n现在，我确信你正急于用\
  \ `console.log` 来输出 `places` 的值。但让我们不要这样做。相反，让我们添加断点。只需点击左侧行槽——即行号旁边的空白处即可添加：\n\n\
  ![指示断点的红点](img/152442833001-breakpoint.png)\n\n看到侧侧的红点了吗？那些就是断点。断点只是一个视觉指示，告诉调试工具在何处暂停。下一步，在操作栏上，点击调试按钮（显示“不允许\
  \ Bug”的图标）。\n\n等等，看顶部区域。你会注意到有一个带点的齿轮图标。只需点击它。系统会为你创建一个调试配置文件 `launch.json`。按如下所示配置，你就可以让\
  \ VS Code 调试器运行 `places.js` 了：\n\n\n\n\n\n```json\n\"configurations\": [\n  {\n\
  \    \"type\": \"node\",\n    \"request\": \"launch\",\n    \"name\": \"Launch Places\"\
  ,\n    \"program\": \"${workspaceFolder}\\\\src\\\\places.js\"\n  }\n]\n```\n\n\
  ### 反斜杠\n\n根据你的操作系统，你可能需要将双反斜杠（`\\\\`）替换为单正斜杠（`/`）。\n\n保存文件后，你会发现调试面板有了一个新的下拉菜单，`Launch\
  \ Places`。要运行它，你可以：\n\n* 点击调试面板上的绿色播放按钮\n* 按 `F5`\n* 在菜单栏上点击 `Debug` > `Start Debugging`。\n\
  \n使用你喜欢的任何方法，并观察调试过程的运行：\n\n![调试正在运行](img/152442833503-debug-node-running.png)\n\
  \n一旦点击调试按钮，就会接连发生很多事情。首先，编辑器顶部会出现一个工具栏。它包含以下控制按钮：\n\n* **拖动点锚**：用于将工具栏移动到不会遮挡任何内容的地方\n\
  * `Continue`：继续调试会话\n* `Step over`：逐行执行代码，跳过函数\n* `Step into`：逐行执行代码，进入函数内部\n* `Step\
  \ out`：如果已经在函数内部，此命令将带你退出\n* `Restart`：重启调试会话\n* `Stop`：停止调试会话。\n\n现在，你会发现调试会话暂停在你的第一个断点处。要继续会话，只需点击\
  \ `Continue` 按钮，这将导致执行继续直到到达第二个断点并再次暂停。再次点击 `Continue` 将完成执行，调试会话也将结束。\n\n让我们通过\
  \ `F5` 重新开始调试。确保两个断点仍然有效。当你放置断点时，代码会暂停在指定的行。除非你点击 `Continue`（`F5`）或 `Step Over`（`F10`），否则不会执行该行。在点击任何操作之前，让我们看看组成调试面板的各个：\n\
  \n* `Variables`：显示当前作用域内（即执行点处）的局部和全局变量\n* `Watch`：你可以手动添加想要监控的变量表达式\n* `Call Stack`：显示高亮代码的调用栈\n\
  * `Breakpoints`：显示带有断点的文件列表及其行号。\n\n要向 `Watch` 部分添加表达式，只需点击 `+` 号并添加任何有效的 JavaScript\
  \ 表达式——例如 `places.length`。当调试器暂停时，如果你的表达式在作用域内，该值将被打印出来。你也可以悬停在当前作用域内的变量上，会出现一个显示其值的弹出窗口。\n\
  \n目前 `places` 数组是空的。按任何导航控制键查看调试是如何工作的。例如，`Step over` 将跳转到下一行，而 `Step into` 将导航到\
  \ `addPlace` 函数。花一点时间熟悉这些控件。\n\n一旦你完成了一些单步操作，悬停在 `places` 变量上。会出现弹出窗口。展开内部的值，直到你看到类似的视图：\n\
  \n![places 弹出窗口](img/152442833804-places-hover.png)\n\n你还可以检查所有作用域内的变量。`Variables`\
  \ 部分：\n\n![变量部分](img/152442834005-local-variables.png)\n\n与我们通常使用的 `console.log`\
  \ 相比，这简直太棒了。调试器允许我们在更深层次上检查变量。你可能已经注意到 `places` 数组输出中的几个问题：\n\n1. 数组中有多个空白——即 `places[0]`\
  \ 和 `places[2]` 是 `undefined`\n2. `numType` 属性对奇数 `id` 值显示为 `even`。\n\n目前，只需结束调试会话。我们将在下一节中修复它们。\n\
  \n### 使用 Mocha 进行测试\n\n打开 `test/placesTest.js` 并检查编写用于测试 `places` 中代码的代码。如果你从未用过\
  \ Mocha，你需要全局安装它以运行测试。\n\n```bash\n#### 安装 mocha\nnpm install -g mocha\n\n#### 运行\
  \ mocha 测试\nmocha\n```\n\n你也可以运行 `npm test` 来执行测试。你应该会得到如下输出：\n\n![失败的 mocha 测试](img/152442834406-failing-mocha-tests.png)\n\
  \n所有测试都失败了。为了找到问题所在，我们将以调试模式运行测试。为此，我们需要一个新的配置。转到调试面板并点击下拉菜单访问 `Add Configuration`\
  \ 选项：\n\n![添加配置](img/152442834507-add-configuration.png)\n\n`launch.json` 文件将打开，并弹出一个列出若干供你选择的配置。\n\
  \n![添加 mocha 测试](img/152442834707-mocha-test-configuration.png)\n\n只需选择 `Mocha Tests`。将为你插入以下配置：\n\
  \n```json\n{\n  \"type\": \"node\",\n  \"request\": \"launch\",\n  \"name\": \"\
  Mocha Tests\",\n  \"program\": \"${workspaceFolder}/node_modules/bin/_mocha\",\n\
  \  \"args\": [\n    \"-u\",\n    \"tdd\",\n    \"--timeout\",\n    \"99999\"\n \
  \ ],\n  \"internalConsole\": \"openSession\"\n}\n```\n\n默认设置是正确的。转到调试面板并选择 `Mocha\
  \ Tests`。你需要注释掉 `places.js` 中的最后三行；否则测试将无法预期运行。回到 `placesTest.js` 在发生故障的行之前添加断点。\n\
  \n```javascript\naddPlace('Nairobi', 'Kenya');\n```\n\n在 `Watch` 部分添加 `places.length`\
  \ 表达式。点击 `Play` 按钮启动调试会话。\n\n![测试开始](img/152442834908-test-start.png)\n\n在测试开始时，`places.length`\
  \ 应该是 0。如果你点击 `Step over`，`places.length` 读取为 2，但我们还没有添加内容。重启调试会话，这次使用 `Step into`\
  \ 进入 `addPlace` 函数。调试器将带你进入 `places.js`。`places.length` 仍然是 0。点击 `Step over` 执行当前行。\n\
  \n![测试单步](img/152442835209-test-step.png)\n\n啊！`places.length` 的值增加了 1，尽管我们还没有向数组添加任何内容。问题出在\
  \ `++` 运算符上，它改变了数组的长度。修复此问题，只需将其替换为：\n\n```javascript\nconst id = places.length\
  \ + 1;\n```\n\n我们可以安全地获取 `id` 的值而不改变 `places.length` 的值。当我们仍处于调试模式时，让我们尝试修复另一个问题：`numType`\
  \ 属性在 `id` 为 1 时被赋值 `even`。问题似乎是 `if` 语句内部的模表达式：\n\n![if 错误](img/152442835410-if-error.png)\n\
  \n让我们使用调试控制台进行快速实验。为 `if` 语句开始输入正确的表达式：\n\n![调试控制台](img/152442835511-debug-console.png)\n\
  \n```javascript\nid % 2 === 0\n```\n\n调试控制台与浏览器控制台类似。它允许你使用当前作用域内的变量进行实验。通过在控制台中尝试一些想法，你可以在不离开编辑器的情况下轻松找到解决方案。现在让我们修复失败的\
  \ `if` 语句：\n\n```javascript\nif (id % 2 === 0) {\n  numType = 'even';\n}\n```\n\n\
  重启调试会话并点击 `Continue` 跳过当前断点。第一个测试“can add a place”现在通过了。但第二个测试没有。为了修复这个问题，我们需要另一个断点。移除当前的断点，并在第\
  \ 16 行放置一个新的断点，该行为显示：\n\n```javascript\naddPlace('Cape Town', 'South Africa');\n\
  ```\n\n启动一个新的调试会话：\n\n![测试 2 失败](img/152442835812-test2-error.png)\n\n\n\n\n搞定！看一眼\
  \ `Variables` 部分。即使在第二个测试开始之前，我们也发现 `places` 数组已经包含了由第一个测试创建现有数据。这显然污染了我们当前的测试。为了修复这个问题，我们需要实现某种类型的\
  \ `setup` 函数，为每个测试重置 `places` 数组。在 Mocha 中实现这一点，只需在测试之前添加以下代码：\n\n```\nbeforeEach(()\
  \ => {\n  places.length = 0;\n});\n```\n\n重启调试器并让它停在断点处。现在 `places` 数组有了一个干净的状态。这应该允许我们的测试在不受污染的情况下运行。只需点击*Continue*（继续）让剩下的测试代码执行。\n\
  \n![Mocha 测试通过](img/152442836013-mocha-tests-passing.png)\n\n现在测试都通过了。你应该感觉棒极了，因为你学会了如何在不写任何一行\
  \ `console.log` 的情况下调试代码。现在让我们来看看如何使用浏览器来调试客户端代码。\n\n## 使用 Chrome 调试器调试 JavaScript\n\
  \n现在你已经熟悉了在 VS Code 中调试 JavaScript 的基础知识，我们将学习如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展调试一个稍微复杂的项目。通过操作栏打开市场面板。搜索该扩展并安装它。\n\n![Debugger for Chrome](img/152442836414-debugger-for-chrome.png)\n\
  \n安装后，点击重载以激活扩展。让我们快速回顾一下即将调试的代码。该 Web 应用程序主要是一个客户端 JavaScript 项目，通过运行 Express 服务器启动：\n\
  \n```\nconst express = require('express');\n\nconst app = express();\nconst port\
  \ = 3000;\n\n// Set public folder as root\napp.use(express.static('public'));\n\n\
  // Provide access to node_modules folder\napp.use('/scripts', express.static(`${__dirname}/node_modules/`));\n\
  \n// Redirect all traffic to index.html\napp.use((req, res) => res.sendFile(`${__dirname}/public/index.html`));\n\
  \napp.listen(port, () => {\n  console.info('listening on %d', port);\n});\n```\n\
  \n所有的客户端代码都在 `public` 文件夹中。项目的依赖项包括 Semantic-UI-CSS、jQuery、Vanilla Router、Axios\
  \ 和 Handlebars。这就是当你使用 `npm start` 运行项目时。你需要在浏览器中打开 URL [localhost:3000](http://localhost:3000)\
  \ 来查看应用程序。\n\n![缺失地点表格](img/152442836615-places-missing-table.png)\n\n尝试添加一个新的地点。当你这样做时，你会发现似乎什么都没有发生。显然出问题了，是时候查看内部原理了。在开始调试会之前，我们先回顾代码。打开\
  \ `public/index.html`。我们目前的关注点是部分：\n\n```\n<!-- TEMPLATES -->\n<!-- Places Form\
  \ Template -->\n<script id=\"places-form-template\" type=\"text/x-handlebars-template\"\
  >\n  <h1 class=\"ui header\">\n    <i class=\"map marker alternate icon\"></i>\n\
  \    <div class=\"content\"> Places</div\n  </h1>\n  <hr>\n  <br>\n  <form class=\"\
  ui form\">\n    <div class=\"fields\">\n      <div class=\"inline field\">\n   \
  \     <label>City</label>\n        <input type=\"text\" placeholder=\"Enter city\"\
  \ id=\"city\" name=\"city\">\n      </</div>\n      <div class=\"inline field\"\
  >\n        <label>Country</label>\n        <input type=\"text\" placeholder=\"Enter\
  \ Country\" name=\"country\">\n      </</div>\n      <div class=\"ui submit primary\
  \ button\">Add Place</div></div>\n    </div>\n  </form>\n  <br>\n  <div id=\"places-table\"\
  ></div>\n</script>\n\n<!-- Places Table Template -->\n<script id=\"places-table-template\"\
  \ type=\"text/x-handlebars-template\">\n  <table class=\"ui celled striped table\"\
  >\n    <thead>\n      <tr>\n        <th>Id</th>\n        <th>City</th>\n       \
  \ <th>Country</th>\n        <th>NumType</th>\n      </tr>\n    </thead>\n    <tbody>\n\
  \      {{#each places}}\n      <tr>\n        <td>{{id}}</td>\n        <td>{{city}}</td>\n\
  \        <td>{{country}}</td>\n        <td>{{numType}}</td>\n      </tr>\n     \
  \ {{/each}}\n    </tbody>\n  </table>\n</script>\n```\n\n如果你快速扫一眼，代码看起来是正确的。因此，问题一定出在\
  \ `app.js` 中。打开该文件并分析那里的代码。下面是你应该注意的代码段。花时间阅读注释以理解代码。\n\n```\n// Load DOM roots\n\
  const el = $('#app');\nconst placesTable = $('#places-table');\n\n// Initialize\
  \ empty places array\nconst places = [];\n\n// Compile Templates\nconst placesFormTemplate\
  \ = Handlebars.compile($('#places-form-template').html());\nconst placesTableTemplate\
  \ = Handlebars.compile($('#places-table-template').html());\n\nconst addPlace =\
  \ (city, country) => {\n  const id = places.length + 1;\n  const numType = (id %\
  \ 2 === 0) ? 'even' : 'odd';\n  places.push({\n    id, city, country, numType,\n\
  \  });\n};\n\n// Populate places array\naddPlace('Nairobi', 'Kenya');\n\n...\n\n\
  // Places View - '/'\nrouter.add('/', () => {\n  // Display Places Form\n  const\
  \ html = placesFormTemplate();\n  el.html(html);\n  // Form Validation Rules\n \
  \ $('.ui.form').form({\n    fields: {\n      city: 'empty',\n      country: 'empty',\n\
  \    },\n  });\n  // Display Places Table\n  const tableHtml = placesTableTemplate({\
  \ places });\n  placesTable.html(tableHtml);\n  $('.submit').on('click', () => {\n\
  \    const city = $('#city').val();\n    const country = $('#country').val();\n\
  \    addPlace(city, country);\n    placesTable.html(tableHtml);\n  });\n});\n```\n\
  \n\n\n嗯……这不对。地点已经添加了，但国家没有显示。问题显然不在 HTML 表格代码，因为第一行已经填充了国家单元格，所以 JavaScript 端一定发生了什么。打开\
  \ `app.js`，在第 58 行添加断点，该行代码为：\n\n```\naddPlace(city, country);\n```\n\n重启调试会并再次尝试添加新地点。执行应该会在你设置的断点处暂停。开始将鼠标悬停在相关变量上。你也可以在监视（watch）面板中添加表达式，如下所示：\n\
  \n![发现国家 Bug](img/152442838920-country-bug-found.png)\n\n如你所示，`country` 变量是 `undefined`，但\
  \ `city` 变量是有值的。如果你查看在监视面板中设置的 jQuery 选择器表达式，你会发现 `#country` 选择器返回空结果。这意味着它不在 DOM\
  \ 中。回到 `index.html` 进行验证。\n\n唉！如果你查看定义国家输入的第 59 行，会发现它缺少 `id` 属性。你需要像这样添加一个：\n\n\
  ```\n<input type=\"text\" placeholder=\"Enter Country\" name=\"country\" id=\"country\"\
  >\n```\n\n重启调试会话并尝试添加新地点。\n\n![修复国家 Bug](img/152442839121-country-fixed.png)\n\n\
  现在可以工作了！做得好，没有没有 `console.log` 的情况下修复了另一个 Bug。现在让我们处理最后一个 Bug。\n\n### 调试客户端路由\n\n\
  点击导航栏中的 `Convert` 链接。你应该会被带到此视图进行快速转换：\n\n![转换货币](img/152442839322-convert-currency.png)\n\
  \n该部分运行正常。那里没有 Bug。\n\n实际上有的，而且它们与表单无关。要发现它们，请刷新页面。\n\n一旦你点击重新加载，用户就会导航回 `/`，即应用的根目录。这显然是一个路由问题，Vanilla\
  \ Router 包本应该处理它。回到 `app.js` 寻找这一行：\n\n```\nrouter.navigateTo(window.location.path);\n\
  ```\n\n这段代码的作用是根据提供的 URL 将用户路由到正确的页面。但为什么不起作用呢？让我们在这里添加一个断点，然后导航回 `/convert` URL\
  \ 并再次尝试刷新页面。\n\n一旦你刷新，编辑器会在断点处暂停。将鼠标悬停在表达式 `windows.location.path` 上。弹出的窗口显示值为 `undefined`。让我们去调试控制台并输入下面的表达式：\n\
  \n![导航错误](img/15244283923-navigation-error.png)\n\n等一下！调试控制台刚刚给了我们正确的表达式。它应该是读取\
  \ `window.location.pathname`。修正该行代码，删除断点并重启调试会话。\n\n导航到 `/convert` URL 并刷新。页面应该加载正确的路径。太棒了！\n\
  \n这是我们要解决的最后一个 Bug 了，但我确实建议你在调试会话中继续实验。设置一个调试会话吧。\n\n\n\n\n在发送请求时，你可以传递许多[额外选项](https://github.com/axios/axios#request-config)，但这里是最常用的几个：\n\
  \n* `baseUrl`：如果你指定了基础 URL，它将会被附加到你使用的任何相对 URL 之前。\n* `headers`：一个键/值对的对象，将作为请求头（headers）发送。\n\
  * `params`：一个键/值对的对象，该对象将被序列化并作为查询字符串附加到 URL 中。\n* `responseType`：如果你期望的响应格式不是于\
  \ JSON，可以将此属性设置为 `arraybuffer`、`blob`、`document`、`text` 或 `stream`。\n* `auth`：传递一个包含\
  \ `username` 和 `password` 字段的对象将使用这些凭据对请求进行 HTTP Basic 认证。\n\n### 便捷方法\n\n就像 jQuery\
  \ 一样，这里也提供了快捷方法来执行不同类型的请求。\n\n`get`、`delete`、`head` 和 `options` 方法接受两个参数：一个 URL\
  \ 和一个可选的配置对象。\n\n```\naxios.get('/products/5');\n```\n\n`post`、`put` 和 `patch` 方法接受数据对象作为第二个参数，并将可选的配置对象作为第三个参数：\n\
  \n```\naxios.post(\n  '/products',\n  { name: 'Waffle Iron', price: 21.50 },\n \
  \ { options }\n);\n```\n\n### 接收响应\n\n一旦发送了请求，Axios 会返回一个 promise，该 promise 将解析为响应对象或错误对象。\n\
  \n```\naxios.get('/product/9')\n  .then(response => console.log(response))\n  .catch(error\
  \ => console.log(error));\n```\n\n#### 响应对象\n\n当请求成功时，你的 `then()` 回调将接收一个包含以下属性的响应对象：\n\
  \n* `data`：服务器返回的负载。默认情况下，Axios 期望返回 JSON 并将其为你解析为 JavaScript 对象。\n* `status`：服务器返回的\
  \ HTTP 状态码。\n* `statusText`：服务器返回的 HTTP 状态消息。\n* `headers`：服务器返回的所有头。\n* `config`：原始请求配置。\n\
  * `request`：实际的 `XMLHttpRequest` 对象（在浏览器中运行时）。\n\n#### 错误对象\n\n如果请求出现问题，promise\
  \ 将被拒绝，并返回一个包含至少某些属性的错误对象：\n\n* `message`：错误消息文本。\n* `response`：响应对象（如果已接收），如前一节所述。\n\
  * `request`：实际的 `XMLHttpRequest` 对象（在浏览器中运行时）。\n* `config`：原始请求配置。\n\n### 转换器与拦截器\n\
  \nAxios 提供了灵感来自 [Angular 的 $http 库](https://docs.angularjs.org/api/ng/service/$http)\
  \ 的一些巧妙功能。尽管它们看起来相似，但用途略有不同。\n\n#### 转换器\n\nAxios 允许你提供函数来转换传出或传入的数据，形式为发送请求时可以设置的两个配置选项：`transformRequest`\
  \ 和 `transformResponse`。这两个属性都是数组，允许你链式调用多个数据通过的函数。\n\n任何传递给 `transformRequest`\
  \ 的函数都适用于 PUT、POST 和 PATCH 请求。它们接收请求数据和 headers 对象作为参数，并必须返回一个修改后的数据对象。\n\n```\n\
  const options = {\n  transformRequest: [\n    (data, headers) => {\n      // 对数据进行操作\n\
  \      return data;\n    }\n  ]\n}\n```\n\n函数可以以相同的方式添加到 `transformResponse` 中，但它们仅用响应数据进行调用，并在响应传递给任何链式\
  \ `then()` 回调之前执行。\n\n那么，我们可以用转换器做什么呢？一个潜在的用例是处理期望特定格式数据（例如 XML 甚至 CSV）的 API。你可以设置一对转换器，将传出的数据与\
  \ API 需要的格式之间进行转换。\n\n值得注意的是，Axios 默认的 `transformRequest` 和 `transformResponse`\
  \ 函数会在数据与 JSON 之间进行转换，而指定你自己的转换器将覆盖这些设置。\n\n#### 拦截器\n\n虽然转换器允许你修改传出和传入的数据，但 Axios\
  \ 也还允许你添加称为[拦截器](https://github.com/axios/axios#interceptors) 的函数。与转换器一样，这些函数可以绑定在发送请求时或接收到响应时触发。\n\
  \n```\n// 添加请求拦截器\naxios.interceptors.request.use((config) => {\n    // 在发送请求前做一些事情\n\
  \    return config;\n  }, (error) => {\n    // 对请求错误做一些事情\n    return Promise.reject(error);\n\
  \  });\n\n// 添加响应拦截器\naxios.interceptors.response.use((response) => {\n    // 对响应数据做一些事情\n\
  \    return response;\n  }, (error) => {\n    // 对响应错误做一些事情\n    return Promise.reject(error);\n\
  \  });\n```\n\n正如你可能从上面的示例中注意到的那样，拦截器与转换器有一些重要的区别。拦截器不仅仅接收数据或头，而是接收完整的请求配置或响应对象。\n\
  \n在创建拦截器时，你还可以选择提供一个错误处理函数，允许你捕获任何错误并进行妥善处理。\n\n请求拦截器可用于此类操作，如[从本地存储中检索令牌并随所有请求发送](https://www.npmjs.com/package/axios-token-interceptor)，而响应拦截器可以用于[捕获\
  \ 401 响应并重定向到登录页面](https://gist.github.com/yajra/5f5551649b20c8f66aec48549ef5c1f)\
  \ 进行身份验证。\n\n"
