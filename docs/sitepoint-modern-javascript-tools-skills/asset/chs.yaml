- "# SitePoint：现代 JavaScript 工具与技能\n\n# 前言\n\n毫无疑问，JavaScript 生态系统的变化非常迅速。不仅新工具和框架不断引入和开发，语言本身也随着\
  \ ES2015（又名 ES6）的引入发生了巨大变化。可以理解，有许多文章抱怨如今学习现代 JavaScript 开发有多么。我们的目标是通过这系列关于现代 JavaScript\
  \ 的书籍来尽量减少这种困惑。\n\n本书概述了每个现代 JavaScript 开发者应该掌握的基本工具和技能。\n\n## 谁应该读这本书？\n\n本书适合所有希望提高\
  \ JavaScript 技能的前端开发者。您需要熟悉 HTML 和 CSS，并对 JavaScript 有合理的理解，才能跟上这些讨论。\n\n## 使用的规范\n\
  \n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园散步的好日子。\n 鸟儿在歌唱，孩子们都回学校了。</p>\
  \ \n```\n\n当需要现有代码来提供上下文而不是重复全部内容时，将显示 `⋮`：\n\n```\n function animate() {\n    ⋮\n\
  new_variable = \"Hello\";\n}\n```\n\n某些代码行应该在一行内，但由于页面限制，我们不得不对它们进行换行。➥ 表示仅出于格式目的而存在的换行，应该被忽略：\n\
  \n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
  );\n```\n\n你会注意到，我们在整本书中使用了一些特定的布局样式来表示不同类型的信息。请关注以下项目。\n\n#### 提示、注释与警告\n\n####\
  \ 嘿，你！\n\n提示（Tips）提供有用的小贴士。\n\n#### 咳，打扰一下……\n\n注释（Notes）是与当前主题相关但并非关重要的补充说明。将它们看作额外的信息片段。\n\
  \n#### 务必始终……\n\n...注意这些重要点。\n\n#### 注意！\n\n警告（Warnings）强调在过程中可能会让你绊倒的任何陷阱。\n\n\
  # 第 1 章：Babel 入门指南\n\n### 作者：James Kolce\n\n**本文介绍了 [Babel](https://babeljs.io/)，它是一个\
  \ JavaScript 编译器，允许开发者今天就使用下一代 JavaScript。**\n\n在构建 Web 应用程序时编写 JavaScript 可能会令人沮丧。我们必须考虑目标浏览器中可用的功能，以及当某个功能未实现时会发生什么。有些人会建议干脆不要使用它，如果我们正在构建复杂的程序，这在大多数情况下是一种痛苦的经历。\n\
  \n幸运的是，某些工具允许我们停止担心支持情况，只需编写我们能写的最好的代码。它们被称为转译器（transpilers）。`transpiler` 是一种将源代码作为输入并产生新源代码作为输出的工具，具有不同的语法，但在语义上尽可能接近——或等同于原始。\n\
  \nBabel 几乎是将现代 JavaScript (ES2015+) 翻译为可在旧浏览器中运行的兼容实现的标准转译器。如果你只想专注于编写 JavaScript，它是完美的解决方案。\n\
  \n尽管 Babel 的主要目标是将最新的 ECMAScript (ES) 标准翻译给旧的（有时是当前的）浏览器，但它可以做得更多。存在一个预设（presets）和插件（plugins）的生态系统，使得添加非标准功能成为可能。每个插件为你的代码提供了新的功能/转换，而预设只是插件的集合。\n\
  \n## 开始上手\n\n根据你的项目和使用的工具，设置 Babel 有多种方法。本文中，我们将解释如何使用 CLI 设置 Babel，尽管如果你正在使用构建系统或框架，可以查看[官方网站](https://babeljs.io/docs/setup/)上的特定说明。大多数情况下，CLI\
  \ 是最快最简单的方法。如果你是第一次用户，请继续。\n\n在项目上设置 Babel 的第一步是使用 [npm 安装该包](https://babeljs.io/docs/setup/)（此处包）并将其作为开发依赖。假设你已经准备好了\
  \ Node.js 环境，只需在终端中运行以下命令：\n\n```\nmkdir babel-test\ncd babel-test\nnpm init -y\n\
  npm install --save-dev babel\n```\n\n这将创建一个目录(`babel-test`)，进入该目录，初始化 npm 项目（从而创建一个\
  \ `package.json` 文件），然后作为开发依赖安装 `babel-cli`。\n\n如果你对上述内容有任何疑问，请参考我们关于[安装 Node](https://www.sitepoint.com/quick-tip-multiple-versions-nvm/)\
  \ 和[使用 npm](https://www.sitepoint.com/beginners-guide-node-manager/) 的教程。\n\n接下来，我们可以打开\
  \ `package.json` 在 npm 脚本中添加 `build` 命令：\n\n```json\n\"scripts\": {\n  \"build\"\
  : \"babel src -d dist\"\n}\n```\n\n这将从 src 目录提取源代码到 dist 目录。然后我们可以执行：\n\n```\nnpm\
  \ run build\n```\n\n等一下！在运行 Babel 之前，我们必须安装并设置转换代码的插件。此最简单快速的方法是添加 [Env 预设](https://babeljs.io/docs/plugins/preset-env/)，它根据你指定的浏览器选择合适的插件。可以使用以下命令安装：\n\
  \n```\nnpm install babel-preset-env --save-dev\n```\n\n然后在项目根目录下创建一个 `.babelrc`\
  \ 文件并添加预设：\n\n```json\n{\n  \"presets\": [\"env\"]\n}\n```\n\n`.babelrc` 文件是你放置所有\
  \ Babel 设置的地方。你将主要使用它来设置预设和插件，但还有更多选项。你可以在 [Babel API 页面](https://babeljs.io/docs/usage/api/#options)\
  \ 查看完整列表。\n\n请注意，取决于你的操作系统，以点开头的文件默认是隐藏的。如果这对你来说有问题（或者你只是更喜欢更少的文件），可以将 Babel 设置放在\
  \ `package.json` 文件中，`babel` 键下，如下：\n\n```json\n{\n  \"name\": \"babel-test\",\n\
  \  \"version\": \"1.0.0\",\n  \"babel\": {\n    // config\n  }\n}\n```\n\n\n\n\n\
  最后，让我们创建 Babel 期望找到的目录和文件：\n\n```\nmkdir src dist\n```\n\n并为其提供一些需要转换的内容：\n\n```\n\
  let a = 1;\nlet b = 2;\n[a, b] = [b, a];\nconsole.log(a);\nconsole.log(b);\n```\n\
  \n此示例使用了[解构赋值](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/）来交换两个变量的值。\n\
  \n## 运行 Babel\n\n现在你已经有了一个可用的 Babel 安装，可以执行 `build` 命令来运行编译过程：\n\n```\nnpm run build\n\
  ```\n\n这将会从 `src/main.js` 获取代码，将其转换为 ES5 代码，并将转换后的代码输出到 `dist/main.js`。\n\n以下是生成的内容：\n\
  \n```\n\"use strict\";\n\nvar a = 1;\nvar b = 2;\nvar _ref = [b, a];\na = _ref[0];\n\
  b = _ref[1];\n\nconsole.log(a);\nconsole.log(b);\n```\n\n如你所见，`let` 已替换为 `var`，并且\
  \ Babel 引入了一个临时变量（用下划线表示）来方便交换。\n\n就是这些。你在 `src` 目录中编写的代码将被翻译为旧版本。默认情况下，如果你不在预设（preset）中添加任何选项，它将加载所有转换。你也可以如下所示指定目标浏览器：\n\
  \n```jsonjson\n  \"presets\": [\n    [\"env\", {\n      \"targets\": {\n       \
  \ \"browsers\": [\"last 2 versions\", \"safari >= 7\"]\n      }\n    }]\n  ]\n}\n\
  ```\n\n这将加载支持每个浏览器最后两个版本以及 Safari 7 及以上所需的转换。你可以在 [Browserlist 仓库](https://github.com/ai/browserslist#queries)\
  \ 中找到目标浏览器的可用选项。\n\n## Babel 生态系统：概述\n\n正如你在上一节中注意到的，安装 Babel 后它不会执行任何操作。我们必须安装一组插件来获得所需的行为，或者可以使用预设（presets），它们是预定义的插件集。\n\
  \n通常，你想要包含的每个功能都会以插件的形式存在。ES2015 的一些示例包括：\n\n* [常量](https://babeljs.io/docs/plugins/check-es2015-constants/)\n\
  * [箭头函数](https://babeljs.io/docs/plugins/transform-es2015-arrow-functions/)\n* [块级作用函数](https://babeljs.io/docs/plugins/transform-es2015-block-scoped-functions/)\n\
  * [类](https://babeljs.io/docs/plugins/transform-es2015-classes/)\n* [for-of](https://babeljs.io/docs/plugins/transform-es2015-for-of/)\n\
  * [展开运算符](https://babeljs.io/docs/plugins/transform-es2015-spread/)\n* [模板字量](https://babeljs.io/docs/plugins/transform-es2015-template-literals/)\n\
  \n查看 Babel 文档中的[插件页面](https://babeljs.io/docs/plugins/#transform-plugins) 以获取完整列表。\n\
  \n但有时你不想一个一个地包含所有插件。因此，有预构建的预设可以方便安装每个插件的过程。\n\n目前可用的三个官方预设是：\n\n* [Env](https://babeljs.io/docs/plugins/preset-env/)\n\
  * [React](https://babeljs.io/docs/plugins/preset-react/)\n* [Flow](https://babeljs.io/docs/plugins/preset-flow/)\n\
  \n`Env` 是最常用的，也是我们在这里使用的。它会根据目标浏览器自动加载所有必要的转换，使你的代码兼容。\n\n`React` 预设转换通常在 React\
  \ 项目中常见的代码，主要增加了对 [Flow](https://flow.org/) 注解和 [JSX](https://facebook.github.io/jsx/)\
  \ 的兼容性。\n\n最后，`Flow` 预设用于清理 [Flow](https://flow.org/) 类型注解（尽管它并不检查类型是否有效）。\n\n###\
  \ Babel Polyfill（垫片）\n\n有些 JavaScript 特无法在语法上进行转换，通常是因为没有实现等效的功能——例如 Promises 和生成器函数（generator\
  \ functions）。\n\n这类功能必须通过库在浏览器中实现才能在你的代码中使用，这就是 polyfill 的工作。\n\nBabel polyfill\
  \ 由 [core-js](https://github.com/zloirock/core-js) 和 [Regenerator](https://github.com/facebook/regenerator)\
  \ 运行时组成。它们共同涵盖了 ES2015+ 中的所有功能。\n\n### 高级用法\n\n如所述，Babel 还可以用于转换语言中尚未实现的功能。一个很好的例子是类字段（class\
  \ fields）提案（目前处于 [TC39 stage 3：候选阶段](https://github.com/tc39/proposal-class-fields)）。这在\
  \ React 开发者之间特别流行，因为它消除了显式将方法绑定到特定组件的必要，并且意味着组件的 `state` 可以声明为类。\n\n\n\n\n[Webpack](https://webpack.js.org/)\
  \ 已经成为现代 Web 开发最重要的工具之一。它主要是一个用于 JavaScript 的模块打包器，但你可以教它转换你所有的前端资源，如 HTML、CSS 甚至图像。它可以让你对应用发出的\
  \ HTTP 请求数量有更多控制，并允许你使用这些资源的其他格式（例如 Pug、Sass 和 ES8）。Webpack 还允许你轻松地使用 npm 包。\n\n\
  本文面向 Webpack 的初学者，将涵盖初始设置与配置、模块、加载器（loaders）、插件（plugins）、代码分割和热模块替换。如果你觉得视频教程很有帮助，我强烈推荐将\
  \ Glen Maddern 的[从原理开始 Webpack](https://www.youtube.com/watch?v=WQue1AN93YU) 作为起点，来理解\
  \ Webpack 的特殊之处何在。虽然它现在有点久远了，但原理仍然相同，而且是一个非常棒的介绍。\n\n## 示例代码\n\n为了在家里跟着练习，你需要[安装\
  \ Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以[从\
  \ GitHub 下载演示应用](https://github.com/markbrown4/webpack-demo)。\n\n## 设置\n\n让我们用 npm\
  \ 初始化新项目并安装 `webpack` 和 `webpack-cli`：\n\n```\nmkdir webpack-demo && cd webpack-demo\n\
  npm init -y\nnpm install --save-dev webpack webpack-cli\n```\n\n接下来我们将创建以下目录结构和内容：\n\
  \n```\n webpack-demo\n  |- package.json\n+ |- webpack.config.js\n+ |- /src\n+  \
  \ |- index.js\n+ |- /dist\n+   |- index.html\n```\n\n### `dist/index.html`\n\n```\n\
  <!doctype html>\n<html\n  <head>\n    <title>Hello Webpack</title>\n  </head>\n\
  \  <body>\n    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n\
  ### `src/index.js`\n\n```javascript\nconst root = document.createElement(\"div\"\
  )\nroot.innerHTML = `<p>Hello Webpack.</p>`\ndocument.body.appendChild(root)\n```\n\
  \n### `webpack.config.js`\n\n```javascript\nconst path = require('path')\n\nmodule.exports\
  \ = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n   \
  \ path: path.resolve(__dirname, 'dist')\n  }\n}\n```\n\n这告诉 Webpack 编译我们入口点 `src/index.js`\
  \ 中的代码，并在 `/dist/bundle.js` 输出包。让我们添加一个用于运行 Webpack 的 [npm 脚本](https://docs.npmjs.com/misc/scripts)。\n\
  \n### `package.json`\n\n```json\n {\n    ...\n    \"scripts\": {\n-     \"test\"\
  : \"echo \\\"Error: no test specified\\\" && exit 1\"\n+     \"develop\": \"webpack\
  \ --mode development --watch\",\n+     \"build\": \"webpack --mode production\"\n\
  \    },\n    ...\n  }\n```\n\n使用 `npm run develop` 命令，我们可以创建第一个包！\n\n```\nAsset\
  \      Size      Chunks           Chunk Names\nbundle.js  2.92 KiB  main  [emitted]\
  \  main\n```\n\n你现在应该能够在浏览器中加载 `dist/index.html` 并看到“Hello Webpack”的欢迎了。\n\n打开 `dist/bundle.js`\
  \ 查看 Webpack 做了什么。顶部是 Webpack 的模块引导代码，最底部是我们的模块。你可能还没觉得惊艳，但如果你已经走到了这里，现在就可以开始使用\
  \ ES Modules 了，Webpack 将能够创建一个可以在所有浏览器中运行的生产包。\n\n使用 `Ctrl` + `C` 重启构建并运行 `npm run\
  \ build` 以生产模式编译我们的包。\n\n```\nAsset      Size       Chunks           Chunk Names\n\
  bundle.js  647 bytes  main  [emitted]  main\n```\n\n注意到包的大小从 `2.92 KiB` 降到了 `647\
  \ bytes`。\n\n再次查看 `dist/bundle.js`，你会看到一团杂乱的代码。我们的包已经通过 UglifyJS 了压缩：代码运行方式完全相同，但实现了尽可能小的文件大小。\n\
  \n*   `--mode development` 为构建速度和调试进行优化。\n*   `--mode production` 为运行时的执行速度和输出文件大小进行优化。\n\
  \n## 模块\n\n使用 ES Modules，你可以将大型程序分成许多较小的、自独立的程序。\n\n默认情况下，Webpack 知道如何使用 `import`\
  \ 和 `export` 语句消费 ES Modules。例如，让我们现在尝试一下，安装 [lodash-es](https://lodash.com/) 并添加第二个模块：\n\
  \n```\nnpm install --save-dev lodash-es\n```\n\n### `src/index.js`\n\n```javascript\n\
  import { groupBy } from \"lodash-es\"\nimport people from \"./people\"\n\nconst\
  \ managerGroups = groupBy(people, \"manager\")\n\nconst root = document.createElement(\"\
  div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\n\
  document.body.appendChild(root)\n```\n\n### `src/people.js`\n\n```javascript\nconst\
  \ people = [\n  {\n    manager: \"Jen\",\n    name: \"Bob\"\n  },\n  {\n    manager:\
  \ \"Jen\",\n    name: \"Sue\"\n  },\n  {\n    manager: \"Bob\",\n    name: \"Shirley\"\
  \n  }\n]\n\nexport default people\n```\n\n运行 `npm run develop` 启动 Webpack 并刷新 `index.html`。你应该能看到屏幕上打印了按经理分组的人数组。\n\
  \n### 不带相对路径的导入\n\n不带相对路径的导入（如 `'es-lodash'`）是安装到 `/node_modules` 的 npm 模块。自己的模块始终需要相对路径，如\
  \ `'./people'`，因为这是区分它们的方法。\n\n注意控制台中，我们的包大小增加到了 `1.41 MiB`！这值得关注，尽管在这种情况下不需要担心。使用\
  \ `npm run build` 在生产模式下编译，所有来自 `lodash-es` 的未使用的 lodash 模块都会从包中移除。这种移除未使用导入的过程被称为树摇优化（tree-shaking），是\
  \ Webpack 免费提供的功能。\n\n```\n> npm run develop\n\nAsset      Size      Chunks    \
  \       Chunk Names\nbundle.js  1.41 MiB  main\n```\n\n## 加载器 (loaders) 允许你对文件运行预处理器。让我们通过\
  \ [Babel](https://babeljs.io/) 加载 `.js` 时发生了什么：\n\n```\nnpm install --save-dev babel-loader\
  \ @babel/preset-env\n```\n\n### `webpack.config.js`\n\n```javascript\nconst path\
  \ = require('path')\n\nmodule.exports = {\n  entry: './src/index.js',\n  output:\
  \ {\n    filename: 'bundle.js',\n    path: path.resolve(__dirname, 'dist')\n  },\n\
  \  module: {\n    rules: [\n      {\n        test: /\\.js$/,\n        exclude: /(node_modules|bower_components)/,\n\
  \        use: {\n          loader: 'babel-loader',\n        }\n      }\n    ]\n\
  \  }\n}\n```\n\n### `.babelrc`\n\n```json\n{\n  \"presets\": [\n    [\"@babel/env\"\
  , {\n      \"modules\": false\n    }]\n  ],\n  \"plugins\": [\"syntax-dynamic-import\"\
  ]\n}\n```\n\n此配置防止 Babel 将 `import` 和 `export` 语句编译为 ES5，并启用动态导入——我们稍将在代码分割章节中讨论。我们现在可以自由使用现代语言特性，并将编译为在所有浏览器中运行的\
  \ ES5。\n\n### Sass\n\n加载器可以链成一系列转换。演示其工作原理的好方法是从我们的 JavaScript 中导入 Sass：\n\n```\n\
  npm install --save-dev style-loader css-loader sass-loader node-sass\n```\n\n###\
  \ `webpack.config.js`\n\n```javascript\nmodule.exports = {\n  ...\n  module: {\n\
  \    rules: [\n      ...\n      {\n        test: /\\.scss$/,\n        use: [{\n\
  \          loader: 'style-loader'\n        }, {\n          loader: 'css-loader'\n\
  \        }, {\n          loader: 'sass-loader'\n        }]\n      }\n    ]\n  }\n\
  }\n```\n\n这些加载器按相反顺序处理：\n\n*   `sass-loader` 将 Sass 转换为 CSS。\n*   `css-loader` 解析\
  \ CSS 为 JavaScript 并解析任何依赖。\n*   `style-loader` 将我们的 CSS 输出到文档的 `<style>` 标签中。你可以将这些看作函数调用。一个加载器的输出作为下一个加载器的输入：\n\
  \n```\nstyleLoader(cssLoader(sassLoader(\"source\")))\n```\n\n\n\n\n让我们添加一个 Sass\
  \ 源文件并将其作为模块。\n\n`src/style.scss`\n\n```scss\n$bluegrey: #2b3a42;\n\npre {\n  padding:\
  \ 8px 16px;\n  background: $bluegrey;\n  color: #e1e6e9;\n  font-family: Menlo,\
  \ Courier, monospace;\n  font-size: 13px;\n  line-height: 1.5;\n  text-shadow: 0\
  \ 1px 0 rgba(23, 31, 35, 0.5);\n  border-radius: 3px;\n}\n```\n\n`src/index.js`\n\
  \n```javascript\n import { groupBy } from 'lodash-es'\nimport people from './people'\n\
  \n+ import './style.scss'\n\n  ...\n```\n\n使用 `Ctrl` + `C` 和 `npm run develop` 重新构建。在浏览器中刷新\
  \ `index.html`，你应该能看到一些样式。\n\n## JS 中的 CSS\n\n我们刚刚以模块的形式从 JavaScript 中导入了一个 Sass\
  \ 文件。\n\n打开 `dist/bundle.js` 并搜索 `pre {`。确实，我们的 Sass 已经编译成了一个 CSS 字符串并作为模块保存在我们的包中。当我们将此模块导入到\
  \ JavaScript 时，`style-loader` 会将该字符串输出到嵌入的 `<style>` 标签中。\n\n### 为什么要这么做？\n\n我在这里不会深入探讨这个话题，但有几个值得考虑的理由：\n\
  \n-   你可能想要包含在项目中的 JavaScript 组件依赖于其他资源才能正常运行（HTML、CSS、图像、SVG）。如果这些内容都能打包在一起，那么导入和使用将要容易得多。\n\
  -   死代码消除：当一个 JS 组件不再被你的代码导入时，CSS 也不会再被导入。生成的包将只包含有作用的代码。\n-   CSS Modules：CSS 的全局命名空间使得我们很难确定对\
  \ CSS 的修改不会产生任何副作用。[CSS 模块](https://github.com/css-modules/css-modules) 通过让 CSS\
  \ 默认变为局部化，并暴露可以在 JavaScript 中引用的唯一类名来改变这一点。\n-   通过巧妙的打包/拆分代码来减少 HTTP 请求的数量。\n\n\
  ## 图像\n\n我们将看到的最后一个 loader 示例是使用 `file-loader` 对图像的处理。\n\n在标准的 HTML 文档中，当浏览器遇到 `img`\
  \ 标签或具有 `background-image` 属性的元素时会获取图像。使用 Webpack，对于小图像，可以将图像源作为字符串存储在 JavaScript\
  \ 内部进行优化。通过这样做，我们预加载了它们，浏览器以后无需通过单独的请求来获取它们：\n\n```bash\nnpm install --save-dev\
  \ file-loader\n```\n\n`webpack.config.js`\n\n```javascript\n module.exports = {\n\
  \    ...\n    module: {\n      rules: [\n        ...\n+       {\n+         test:\
  \ /\\.(png|svg|jpg|gif)$/,\n+         use: [\n+           {\n+             loader:\
  \ 'file-loader'\n+           }\n+         ]\n+       }\n      ]\n    }\n  }\n```\n\
  \n使用此命令下载[测试图像](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)：\n\
  \n```bash\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
  \ --output src/code.png\n```\n\n使用 `Ctrl` + `C` 和 `npm run develop` 重新构建，你现在可以导入图像作为模块了！\n\
  \n`src/index.js`\n\n```javascript\n import { groupBy } from 'lodash-es'\nimport\
  \ people from './people'\n\n  import './style.scss'\n+ import './image-example'\n\
  \n  ...\n```\n\n`src/image-example.js`\n\n```javascript\nimport codeURL from \"\
  ./code.png\"\n\nconst img = document.createElement(\"img\")\nimg.src = codeURL\n\
  img.style = \"background: #2B3A42; padding: 20px\"\nimg.width = 32\ndocument.body.appendChild(img)\n\
  ```\n\n这将包含一个图像，其中 `src` 属性包含了图像自身的 [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)：\n\
  \n```html\n<img src=\"data:image/png;base64,iVBO...\" style=\"background: #2B3A42;\
  \ padding: 20px\" width=\"32\">\n```\n\n我们 CSS 中的背景图像也由 `file-loader` 处理。\n\n`src/style.scss`\n\
  \n```scss\n $bluegrey: #2b3a42;\n\n  pre {\n    padding: 8px 16px;\n-   background:\
  \ $bluegrey;\n+   background: $bluegrey url(\"code.png\") no-repeat center center\
  \ / 32px 32px;\n    color: #e1e6e9;\n    font-family: Menlo, Courier, monospace;\n\
  \    font-size: 13px;\n    line-height: 1.5;\n    text-shadow: 0 1px 0 rgba(23,\
  \ 31, 35, 0.5);\n    border-radius: 3px;\n  }\n```\n\n我们 CSS 中的背景图像也由 `file-loader`\
  \ 处理。\n\n`src/style.scss`\n\n```scss\n $bluegrey: #2b3a42;\n\n  pre {\n    padding:\
  \ 8px 16px;\n-   background: $bluegrey;\n+   background: $bluegrey url(\"code.png\"\
  ) no-repeat center center / 32px 32px;\n    color: #e1e6e9;\n    font-family: Menlo,\
  \ Courier, monospace;\n    font-size: 13px;\n    line-height: 1.5;\n    text-shadow:\
  \ 0 1px 0 rgba(23, 31, 35, 0.5);\n    border-radius: 3px;\n  }\n```\n\n我们 CSS 中的背景图像也由\
  \ `file-loader` 处理。\n\n`src/style.scss`\n\n```scss\n $bluegrey: #2b3a42;\n\n  pre\
  \ {\n    padding: 8px 16px;\n-   background: $bluegrey;\n+   background: $bluegrey\
  \ url(\"code.png\") no-repeat center center / 32px 32px;\n    color: #e1e6e9;\n\
  \    font-family: Menlo, Courier, monospace;\n    font-size: 13px;\n    line-height:\
  \ 1.5;\n    text-shadow: 0 1px 0 rgba(23, 31, 35, 0.5);\n    border-radius: 3px;\n\
  \  }\n```\n\n\n\n\n在浏览器中打开 `http://localhost:5000` 并观察发生了什么。初始只获取了 `bundle.js`。当点击按钮时，聊天模块被导入并初始化。\n\
  \n![显示分块懒性加载的网络请求](img/1521906882lazy-loading.png)\n\n只需极少少的努力，我们已经为应用添加了动态代码分割和模块的懒性加载。这是构建高性能\
  \ Web 应用程序的绝佳起点。\n\n## 插件 (Plugins)\n\n`loaders`（加载器）在单个文件上执行转换，而 `plugins`（插件）则在更大的代码块上运行。\n\
  \n既然我们正在打包代码、外部模块和静态资源，我们的构建包将会增长——*非常快*。插件的作用是为了帮助我们以巧妙的方式分割代码，并为生产环境进行优化。\n\n\
  在不经意间，我们已经使用了许多[带有“mode”的默认 Webpack 插件](https://webpack.js.org/concepts/mode/#usage)\n\
  \n### development (开发)\n\n- 提供值为“development”的 `process.env.NODE_ENV`\n- `NamedModulesPlugin`\n\
  \n### production (生产)\n\n- 提供值为“production”的 `process.env.NODE_ENV`\n- `UglifyJsPlugin`\n\
  - `ModuleConcatenationPlugin`\n- `NoEmitOnErrorsPlugin`\n\n#### Production (生产)\n\
  \n在添加额外的插件之前，我们将首先拆分配置，以便能够针对每个环境应用特定的插件。\n\n将 `webpack.config.js` 重命名为 `webpack.common.js`，并为开发和生产环境添加配置文件。\n\
  \n```\n- |- webpack.config.js\n+ |- webpack.common.js\n+ |- webpack.dev.js\n+ |-\
  \ webpack.prod.js\n```\n\n我们将使用 `webpack-merge` 将通用配置与特定环境的配置合并：\n\n```\nnpm install\
  \ --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\n```javascript\nconst merge\
  \ = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\n\
  module.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
  \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
  \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n### package.json\n\
  \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
  ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack --watch\
  \ --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
  \n  },\n```\n\n现在我们可以将开发环境特定的插件添加到 `webpack.dev.js`，将生产环境特定的插件添加到 `webpack.prod.js`。\n\
  \n#### Split CSS (分割 CSS)\n\n在使用 [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin)\
  \ 进行生产环境打包时，将 CSS 从 JavaScript 中分离出来被认为最佳实践。\n\n当前的 `.scss` 加载器非常适合开发，因此我们将它们从 `webpack.common.js`\
  \ 移动到 `webpack.dev.js`，并仅在 `webpack.prod.js` 中添加 `ExtractTextWebpackPlugin`。\n\n\
  ```\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta\n```\n\n####\
  \ webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n    ...\n    module:\
  \ {\n      rules: [\n-       {\n-         test: /\\.scss$/,\n-         use: [\n\
  -           loader: 'style-loader'\n-           }, {\n-             loader: 'css-loader'\n\
  -           }, {\n-             loader: 'sass-loader'\n-           ]\n-       }\n\
  \        ...\n      ]\n    }\n  }\n```\n\n#### webpack.dev.js\n\n```javascript\n\
  \ const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
  \nmodule.exports = merge(common, {\n  mode: 'development',\n+   module: {\n+   \
  \  rules: [\n+       {\n         test: /\\.scss$/,\n+         use: [\n         \
  \  loader: 'style-loader'\n           }, {\n             loader: 'css-loader'\n\
  \           }, {\n             loader: 'sass-loader'\n           ]\n       }\n \
  \    ]\n   }\n})\n```\n\n#### webpack.prod.js\n\n```javascript\n const merge = require('webpack-merge')\n\
  + const ExtractTextPlugin = require('extract-text-webpack-plugin')\nconst common\
  \ = require('./webpack.common.js')\n\nmodule.exports = merge(common, {\n  mode:\
  \ 'production',\n+   module: {\n+     rules: [\n+       {\n         test: /\\.scss$/,\n\
  \         use ExtractTextPlugin.extract({\n           fallback: 'style-loader',\n\
  \           use: ['css-loader', 'sass-loader']\n         })\n+       }\n     ]\n\
  \   },\n\n   plugins: [\n+     new ExtractTextPlugin('style.css')\n   ]\n})\n```\n\
  \n让我们比较一下构建脚本的输出：\n\n```\n> npm run develop\n\nAsset           Size      Chunks\
  \           Chunk Names\napp.bundle.js   28.5 KiB  app   [emitted]  app\nchat.bundle.js\
  \  1.4 KiB   chat  [emitted]  chat\n```\n\n```\n> npm run build\n\nAsset       \
  \    Size       Chunks        Chunk Names\nchat.bundle.js  375 bytes  0  [emitted]\
  \  chat\napp.bundle.js   1.82 KiB   1  [emitted]  app\nstyle.css       424 bytes\
  \  1  [emitted]  app\n```\n\n现在我们的 CSS 已经从生产环境构建包中提取出来，我们需要在 HTML 中通过 `<link>` 引用它。\n\
  \n#### dist/index.html\n\n```html\n <!DOCTYPE html>\n  <<html>\n    <head>\n   \
  \   <meta charset=\"UTF-8\">\n      <title>Code Splitting</title>\n+     <link href=\"\
  style.css\" rel=\"stylesheet\">\n    </head>\n    <body>\n      <script type=\"\
  text/javascript\" src=\"app.bundle.js\"></script>\n    </body>\n  </html>\n```\n\
  \n这允许在浏览器中并行下载 CSS 和 JavaScript，因此加载速度会比单个构建包更快。它还允许样式在 JavaScript 下载完成之前显示出来。\n\
  \n#### Generating HTML (生成 HTML)\n\n每当我们的输出发生变化时，都必须不断更新 `index.html` 以引用新的文件路径。这正是\
  \ `html-webpack-plugin` 要完成的工作。\n\n我们可能还需要同时添加 `clean-webpack-plugin` 来在每次构建之前清理\
  \ `dist` 目录。\n\n```\nnpm install --save-dev html-webpack-plugin clean-webpack-plugin\n\
  ```\n\n#### webpack.common.js\n\n```javascript\n const path = require('path')\n\
  + const CleanWebpackPlugin = require('clean-webpack-plugin');\n+ const HtmlWebpackPlugin\
  \ = require('html-webpack-plugin');\n\n  module.exports = {\n    ...\n   plugins:\
  \ [\n     new CleanWebpackPlugin(['dist']),\n     new HtmlWebpackPlugin({\n    \
  \   title: 'My killer app'\n     })]\n  }\n```\n\n现在每当我们构建时，`dist` 都会被清理。我们现在也能看到\
  \ `index.html` 输出，它包含了正确的路径。\n\n运行 `npm run develop` 输出如下：\n\n```html\n<!DOCTYPE\
  \ html>\n  <html>\n    <head>\n    <meta charset=\"UTF-8\">\n    <title>My killer\
  \ app</title>\n    </head>\n    <body>\n      <script type=\"text/javascript\" src=\"\
  app.bundle.js\"></script>\n    </body>\n  </html>\n```\n\n而 `npm run build` 输出如下：\n\
  \n```html\n<!DOCTYPE html>\n  <html>\n    <head>\n    <meta charset=\"UTF-8\">\n\
  \    <title>My killer app</title>\n    <link href=\"style.css\" rel=\"stylesheet\"\
  >\n    </head>\n    <body>\n      <script type=\"text/javascript\" src=\"app.bundle.js\"\
  ></script>\n    </body>\n  </html>\n```\n\n## Development (开发)\n\n`webpack-dev-server`\
  \ 提供了一个简单的 Web 服务器并提供 `热重载`，因此你不需要刷新刷新即可看到更改。\n\n### package.json\n\n```json\n {\n\
  \    ...\n    \"scripts\": {\n-     \"develop\": \"webpack --watch --config webpack.dev.js\"\
  ,\n+     \"develop\": \"webpack-dev-server --config webpack.dev.js\",\n    }\n \
  \   ...\n  }\n```\n\n```\n> npm run develop\n\nℹ ｢wds｣: 项目运行在 http://localhost:8080/\n\
  ℹ ｢wds｣: webpack 输出服务自 /\n```\n\n在浏览器中打开 `http://localhost:8080/` 并修改 JavaScript\
  \ 或 CSS 文件之一。你应该看到它自动构建并刷新。\n\n### HotModuleReplacement (热替换)\n\n`HotModuleReplacement`\
  \ 插件比热重载更进一步，它可以在不刷新的情况下运行时交换模块。当配置得当时，这在单页应用的开发过程中可以节省大量时间。当页面上有大量状态时，你可以对组件进行增量更改，只有被更改的模块会被替换和更新。\n\
  \n\n\n\n\n```\n+ const webpack = require('webpack')\n  const merge = require('webpack-merge')\n\
  \  const common = require('./webpack.common.js')\n\n  module.exports = merge(common,\
  \ {\n    mode: 'development',\n+   devServer: {\n+     hot: true\n   },\n+   plugins:\
  \ [\n+     new webpack.HotModuleReplacementPlugin()\n+   ],\n    ...\n  }\n```\n\
  \n现在我们需要从代码中 `accept` 变化的模块以重新初始化内容。\n\n`src/app.js`\n\n```\n+ if (module.hot) {\n\
  +   module.hot.accept()\n+ }\n\n  ...\n```\n\n### 热模块替换 (Hot Module Replacement)\n\
  \n当启用热模块替换时，`module.hot` 在开发环境下会被设置为 `true`，在生产环境中设置为 `false`，因此这些代码会被从包中移除。\n\n\
  重新构建并执行以下操作看看会发生什么：\n\n*   点击 `Open chat`（打开聊天）\n*   在 `people.js` 模块中添加一个新人员\n\
  *   再次点击 `Open chat`\n\n![向聊天中添加人员](img/1521906879hmr.png)\n\n以下是发生的过程：\n\n1.  当点击\
  \ `Open chat` 时，获取并初始化 `chat.js` 模块\n2.  HMR 监测到 `people.js` 发生了修改\n3.  `index.js`\
  \ 中的 `module.hot.accept()` 导致由该入口块加载的所有模块被替换\n4.  当再次点击 `Open chat` 时，将使用更新后模块的代码运行\
  \ `chat.init()`。\n\n### CSS 替换\n\n让我们将按钮颜色改为红色看看会发生什么：\n\n`src/app.scss`\n\n```\n\
  \ button {\n    ...\n-   background: #24b47e;\n+   background: red;\n    ...\n \
  \ }\n```\n\n![更改 CSS](img/1521906881hmr2.png)\n\n现在我们可以看到样式即时更新，而不会丢失任何状态。这极大地提升了开发者体验！而且感觉就像未来。\n\
  \n## HTTP/2\n\n使用像 Webpack 这样的模块打包器的主要优势之一是，它通过让你你控制资产如何 `built`（构建）以及如何在客户端被 `fetched`（获取），来帮助提高性能。多年来，合并文件被认为是[最佳实践](https://developer.yahoo.com/performance/rules.html)，以减少客户端需要进行的请求次数。这仍然有效，但\
  \ [HTTP/2 现在允许在一次 `single`（单个）请求中交付多个文件](https://www.sitepoint.com/file-bundling-and-http2/)，因此合并不再是万灵药了。你的应用程序实际上可能从许多小文件的单独缓存中获益。这样客户端就可以获取单个更改的模块，而无需再次获取内容\
  \ `mostly`（大部分）相同的整个包。\n\nWebpack 的创建者 [Tobias Koppers](https://twitter.com/wSokra)\
  \ 编写了一篇信息量丰富的文章，解释了为什么即使在 HTTP/2 时代，打包仍然重要。\n\n可以在 [Webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6)\
  \ 了解更多信息。\n\n## 轮到你了\n\n我希望你发现这个关于 Webpack 的介绍有所帮助，并能够开始有效地使用它。理解 Webpack 的配置、加载器（loaders）和插件需要一些时间，但学习这个工具如何工作将是值得的。\n\
  \nWebpack 4 的文档目前正在编写中，但组织得非常好。我强烈建议阅读 [Concepts](https://webpack.js.org/concepts/)\
  \ 和 [Guides](https://webpack.js.org/guides/) 以获取更多信息。这里是你可能感兴趣的其他主题：\n\n*   [开发环境的\
  \ Source Maps](https://webpack.js.org/guides/development/#using-source-maps)\n*\
  \   [生产环境的 Source Maps](https://webpack.js.org/guides/production/#source-mapping)\n\
  *   [使用哈希文件名进行缓存失效](https://webpack.js.org/guides/caching/)\n*   [拆分 vendor 包](https://webpack.js.org/plugins/commons-chunk-plugin/#explicit-vendor-chunk)\n\
  \n# 第 3 章：Gulp.js 简介\n\n### 作者：Craig Buckler\n\n开发者编写代码的时间非常宝贵。即使我们忽略那些烦人的会议，工作中的很大一部分也涉及消耗你工作日的基础任务：\n\
  \n*   从模板和内容文件生成 HTML\n*   压缩新的和修改的图像\n*   将 Sass 编译为 CSS 代码\n*   从脚本中移除 `console`\
  \ 和 `debugger` 语句\n*   将 ES6 转换为跨浏览器兼容的 ES5 代码\n*   代码检查和验证\n*   合并并压缩化 CSS 和 JavaScript\
  \ 文件\n*   将文件部署到开发、测试和生产环境服务器。\n\n每当你做出更改时，都必须重复这些任务。你可能初衷良好，但即使是最万无一失的开发者也会忘记压缩一两个图像。随着时间的推移，生产前任务变得越来越艰巨且耗时；你将畏惧那些不可避免的内容和模板变化。这是一项令人枯燥、重复的工作。把时间花在更有价值的任务上不是更好吗？\n\
  \n如果是这样，你需要一个 `task runner`（任务运行器）或 `build process`（构建流程）。\n\n## 这听起来吓人复杂！\n\n创建一个构建流程需要时间。它比手动执行每个任务要复杂，但从长远来看，它可以为你节省大量的精力并减少人为错误。采取务实的方法：\n\
  \n*   自动化最令人痛苦的任务。\n*   选择任务运行器软件并坚持一段时间。\n*   不要心血来复杂化你的构建流程。\n\n某些工具和概念对你来说可能是新的，但深呼吸，专注于一件事。\n\
  \n## 任务运行器：选项\n\n像 [GNU Make](https://www.gnu.org/software/make/) 这样的工具已经存在了几十年，但\
  \ Web 任务运行器是一个相对新的现象。第一个是 [Grunt](http://gruntjs.com/) —— 一种由 JSON 配置控制的 Node.js\
  \ 任务运行器。Grunt 取得了成功，但也存在一些问题：\n\n1.  Grunt 需要插件来实现文件监听功能。\n2.  Grunt 插件通常执行多个任务，这使得自定义变得很别扭。\n\
  3.  JSON 配置可能会变得臃肿。\n4.  任务运行速度缓慢，因为 Grunt 在处理步骤之间保存文件。\n\n许多问题在后续版本中得到了解决，但 [Gulp](http://gulpjs.com/)\
  \ 已经并并许多改进：\n\n1.  内置了文件监听功能。\n2.  Gulp 插件 `mostly` 设计为执行单一工作。\n3.  Gulp 使用的 JavaScript\
  \ 配置更简洁、易读、易修改，并提供了更好的灵活性。\n4.  Gulp 运行更快，因为它使用 [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
  \ 在一系列管道插件之间传递数据。文件只在任务结束时写入。\n\n当然，Gulp 本身并不完美，新的任务运行器如 [Broccoli.js](http://broccolijs.com/)、[Brunch](http://brunch.io/)\
  \ 和 [webpack](https://webpack.github.io/) 也在竞争开发者的关注。最近，[npm 本身也被推为更简单的选项](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/)。所有工具都有优缺点，但\
  \ [Gulp 仍然是首选，目前被超过 40% 的 Web 开发者使用](https://ashleynolan.co.uk/blog/frontend-tooling-survey-2016-results)。\n\
  \nGulp 需要 Node.js，虽然一些 JavaScript 知识会有帮助，但所有 Web 背景的开发者都能受益。\n\n## 关于 Gulp 4\n\n\
  本教程描述了如何使用 Gulp 3 —— 这是编写时的最新发布版本。Gulp 4 已经开发了一段时间，但仍然是一个测试产品。你可以[使用或切换到 Gulp 4](https://www.joezimjs.com/complete-guide-upgrading-gulp-4/)，但我建议在正式发布之前坚持使用版本\
  \ 3。\n\n## 第一步：安装 Node.js\n\n\n\n\n你可以从 [nodejs.org/download/](https://nodejs.org/download/)\
  \ 下载适用于 Windows、macOS 和 Linux 的 Node.js。提供了从二进制文件、包管理器和 Docker 镜像安装的选项，以及完整的说明。\n\
  \n## Windows 用户\n\nNode.js 和 `Gulp` 可以在 Windows 上运行，但如果某些插件依赖于原生 Linux 二进制文件（如图像压缩库），可能无法安装或运行。Windows\
  \ 10 用户的一个选择是使用新的 [bash 命令行](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide)，它可以解决许多问题。\n\
  \n安装完成后，打开命令提示符并输入：\n\n```\nnode -v\n```\n\n这会显示版本号。你即将将大量使用 `npm` —— 这是用于安装模块的\
  \ Node.js 包管理器。检查它的版本号：\n\n```\nnpm -v\n```\n\n## 对于 Linux 用户\n\nNode.js 模块可以全局安装，这样它们在整个系统中都是可用的。然而，除非在\
  \ `npm` 命令前加上 `sudo`，否则大多数用户没有权限写入全局目录。有许多[修复 npm 权限的选项](https://docs.npmjs.com/getting-started/fixing-npm-permissions)和像\
  \ [nvm 可以提供帮助](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)这样的工具，但我经常更改默认目录。例如，在基于\
  \ Ubuntu/Debian 的平台上：\n\n```\ncd ~\nmkdir .node_modules_global\nnpm config set prefix=$HOME/.node_modules_global\n\
  npm install npm -g \n```\n\n然后，将以下行添加到 `~/.bashrc` 的末尾：\n\n```\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\
  \ \n```\n\n最后，使用此命令更新：\n\n```\nsource ~/.bashrc \n```\n\n## 第 2 步：全局安装 Gulp\n\n\
  全局安装 Gulp 命令行界面，以便可以在任何项目文件夹中运行 `gulp` 命令：\n\n```\nnpm install gulp-cli -g\n```\n\
  \n使用此命令验证 `Gulp` 是否已安装：\n\n```\ngulp -v\n```\n\n## 第 3 步：配置你的项目\n\n### 对于 Node.js\
  \ 项目\n\n如果你已经有了 `package.json` 配置文件，可以跳过此步。\n\n假设你在 `project1` 文件夹中有一个新或现有的项目。导航到该文件夹并使用\
  \ `npm` 初始化它：\n\n```\ncd project1\nnpm init\n```\n\n会被向你提出一系列问题。输入值或按 `Return` 键以接受默认值。完成后将创建一个\
  \ `package.json` 文件，它存储了你的 `npm` 配置设置。\n\n### 对于 Git 用户\n\nNode.js 将模块安装在 `node_modules`\
  \ 文件夹中。你应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，你可以运行 `npm install`\
  \ 来恢复它们。\n\n在本文的剩余部分，我们假设你的项目文件夹包含以下子文件夹：\n\n**`src` 文件夹：预处理过的源文件**\n\n它包含以下子文件夹：\n\
  \n*   `html` - HTML 源文件和模板\n*   `images` — 原始未压缩图像\n*   `js` — 多个预处理过的脚本文件\n*  \
  \ `scss` — 多个预处理过的 Sass `.scss` 文件\n\n**`build` 文件夹：编译/处理后的文件**\n\nGulp 将根据需要创建文件和子文件夹：\n\
  \n*   `html` — 编译后的静态 HTML 文件\n*   `images` — 压缩后的图像\n*   `js` — 单个合并并压缩的 JavaScript\
  \ 文件\n*   `css` — 单个编译并压缩的 CSS 文件\n\n你的项目几乎肯定会有不同，但下面的示例使用了此结构。\n\n### 在 Unix 上跟随操作\n\
  \n如果你使用的是基于 Unix 的系统，并且只想跟随教程操作，可以使用以下命令重建文件夹结构：\n\n```\nmkdir -p src/{html,images,js,scss}\
  \ build/{html,images,js,css} \n```\n\n## 第 4 步：本地安装 Gulp\n\n你现在可以使用以下命令在项目文件夹中安装\
  \ Gulp：\n\n```\nnpm install gulp --save-dev\n```\n\n这会将 Gulp 安装为开发依赖项，并且 `package.json`\
  \ 中的 `\"devDependencies\"` 部分会随之更新。在教程的剩余部分中，我们假定 Gulp 和所有插件都是开发依赖项。\n\n### 替代部署选项\n\
  \n当你的操作系统上的 `NODE_ENV` 环境变量设置为 `production` 时，不会安装开发依赖项。你通常会在上线服务器上通过 Mac/Linux\
  \ 命令执行此操作：\n\n```\nexport NODE_ENV=production\n```\n\n或者 Windows 上：\n\n```\nset\
  \ NODE_ENV=production\n```\n\n本教程假设你的资产将编译到 `build` 文件夹，并提交到你的 Git 仓库或直接上传到服务器。然而，如果你想更改它们的生成方式，在上线服务器上构建资产可能更合适。例如，HTML、CSS\
  \ 和 JavaScript 文件在生产环境中经过了压缩，但在开发环境中没有。在这种情况下，请对 Gulp 和所有插件使用 `--save` 选项，即：\n\n\
  ```\nnpm install gulp --save\n```\n\n这会将 Gulp 设置为 `package.json` 中 `\"dependencies\"\
  ` 部分的应用程序依赖。它会在你输入 `npm install` 时被安装，并在项目部署的任何地方运行。你可以从仓库中移除 `build` 文件夹，因为在需要时可以在任何平台上创建这些文件。\n\
  \n## 第 4 步：创建 Gulp 配置文件\n\n在根目录下创建一个新的 `gulpfile.js` 配置文件。添加一些基础代码开始开始：\n\n```javascript\n\
  // Gulp.js 配置\n\nvar\n  // 模块\n  gulp = require('gulp'),\n\n  // 开发模式\n  devBuild\
  \ = (process.env.NODE_ENV !== 'production'),\n\n  // 文件夹\n  folder = {\n    src:\
  \ 'src/',\n    build: 'build/'\n  };\n```\n\n这引用了 gulp，并在开发模式下设置 devBuild。\n\n###\
  \ ES6\n\n6 及以上版本支持 ES6，所以你可以使用箭头函数、`let`、`const`。`gulpfile.js` 还没有任何操作，因为你需要\n\n\
  ## 第 5 步：创建 Gulp 任务\n\nGulp 本身什么不做。你必须：\n\n1.  安装 Gulp 插件，\n2.  编写利用这些插件执行有用操作的任务。\n\
  \n编写自己的插件是可能的，但由于已有 3000 多个插件，你可能永远不需要。你可以通过 Gulp 自己的目录 [gulpjs.com/plugins/](http://gulpjs.com/plugins/)、[npmjs.com](https://www.npmjs.com/)\
  \ 或搜索 \"gulp *something*\" 来利用它们。\n\nGulp 提供了三个主要的任务方法：\n\n*   `gulp.task` — 定义一个带有名称、可选依赖项和函数的新任务。\n\
  *   `gulp.src` — 设置源文件所在的文件夹。\n*   `gulp.dest` — 设置构建文件存放的目标文件夹。\n\n任何数量的插件调用都可以在\
  \ `.src` 和 `.dest` 之间通过 `pipe` 设置。\n\n### 图像任务\n\n通过示例演示最好，所以让我们创建一个基础任务，压缩图像并将它们复制到相应的\
  \ `build` 文件夹。由于此过程可能耗时，我们只压缩新的和修改过的文件。有两个插件可以帮助我们：[gulp-newer](https://www.npmjs.com/package/gulp-newer)\
  \ 和 [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin)。从从命令行安装它们：\n\n\
  ```\nnpm install gulp-newer gulp-imagemin --save-dev\n```\n\n现在我们可以在 `gulpfile.js`\
  \ 顶部引用这两个模块：\n\n```javascript\n// Gulp.js 配置\n\nvar\n  // 模块\n  gulp = require('gulp'),\n\
  \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n```\n\
  \n现在我们可以在 `gulpfile.js` 的末尾以函数的形式定义图像处理任务本身：\n\n\n\n\n```\n// image processing\n\
  gulp.task('images', function() {\n  var out = folder.build + 'images/';\n  return\
  \ gulp.src(folder.src + 'images/**/*')\n    .pipe(newer(out))\n    .pipe(imagemin({\
  \ optimizationLevel: 5 }))\n    .pipe(gulp.dest(out));\n});\n```\n\n所有任务在语法上都是相似的。这段代码：\n\
  \n1. 创建了一个名为 `images` 的新任务。\n\n2. 定义了一个带有返回值的函数，该函数……\n\n3. 定义了一个 `out` 文件夹，构建文件将位于其中。\n\
  \n4. 设置 Gulp 的 `src` 源文件夹。`/**/*` 确保子文件夹中的图像也会被处理。\n\n5. 将所有文件管道到 `gulp-newer` 模块。比对应目标文件新的源文件将通过。其他所有文件将被移除。\n\
  \n6. 剩余的新或已更改的文件被管道到 `gulp-imagemin`，该插件设置了一个可选的 `optimizationLevel` 参数。\n\n7. 压缩后的图像输出到由\
  \ `out` 设置的 Gulp `dest` 文件夹。\n\n保存 `gulpfile.js` 并在从命令行运行任务之前，在项目的 `src/images`\
  \ 文件夹中放置一些图像：\n\n```bash\ngulp images\n```\n\n所有图像都将相应进行压缩，你会看到如下输出：\n\n```\nUsing\
  \ file gulpfile.js\nRunning 'imagemin'...\nFinished 'imagemin' in 5.71 ms\ngulp-imagemin:\
  \ image1.png (saved 48.7 kB)\ngulp-imagemin: image2.jpg (saved 36.2 kB)\ngulp-imagemin:\
  \ image3.svg (saved 12.8 kB)\n```\n\n尝试再次运行 `gulp images`，不会发生任何变化，因为不存在更新的图像。\n\
  \n### HTML 任务\n\n我们现在可以创建一个类似的任务，从源 HTML 文件夹复制文件。我们可以使用 [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean)\
  \ 插件安全地压缩我们的 HTML 代码，以移除不必要的空格和属性：\n\n```bash\nnpm install gulp-htmlclean --save-dev\n\
  ```\n\n随后在 `gulpfile.js` 顶部引用它：\n\n```javascript\nvar\n  // modules\n  gulp = require('gulp'),\n\
  \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n  htmlclean\
  \ = require('gulp-htmlclean'),\n```\n\n我们现在可以在 `gulpfile.js` 的末尾创建一个 `html` 任务：\n\
  \n```javascript\n// HTML processing\ngulp.task('html', ['images'], function() {\n\
  \  var\n    out = folder.build + 'html/',\n    page = gulp.src(folder.src + 'html/**/*')\n\
  \      .pipe(newer(out));\n\n  // minify production code\n  if (!devBuild) {\n \
  \   page = page.pipe(htmlclean());\n  }\n\n  return page.pipe(gulp.dest(out));\n\
  });\n```\n\n此操作复用了 `gulp-newer` 并引入了几个概念：\n\n1. `[images]` 参数表示我们的 `images` 任务在处理\
  \ HTML 之前运行（HTML 可能会引用图像）。此数组中可以列出任意数量的依赖任务，所有任务将在任务函数运行之前完成。\n\n2. 只有当 `NODE_ENV`\
  \ 设置为 `production` 时，我们才将 HTML 管道到 `gulp-htmlclean`。因此，HTML 在开发期间保持未压缩状态，这可能有助于调试。\n\
  \n保存 `gulpfile.js` 并从命令行运行 `gulp html`。`html` 和 `images` 任务都将运行。\n\n### JavaScript\
  \ 任务\n\n对你来说太简单了？让我们通过构建一个基础模块打包器来处理所有的 JavaScript 文件。它将：\n\n1. 使用 [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
  \ 插件确保首先加载依赖。它通过分析每个脚本顶部的注释来确保正确的顺序。例如，`// requires: defaults.js lib.js`。\n\n2.\
  \ 使用 [gulp-concat](https://www.npmjs.com/package/gulp-concat) 将所有脚本文件合并为单个 `main.js`\
  \ 文件。\n\n3. 使用 [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
  \ 移除所有的 `console` 和 `debugging` ，并使用 [gulp-uglify](https://www.npmjs.com/package/gulp-uglify)\
  \ 压缩代码。\n\n\n\n\n```javascript\n// watch for changes\ngulp.task('watch', function()\
  \ {\n\n  // image changes\n  gulp.watch(folder.src + 'images/**/*', ['images']);\n\
  \n  // html changes\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n\n  // javascript\
  \ changes\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n\n  // css changes\n \
  \ gulp.watch(folder.src + 'scss/**/*', ['css']);\n\n});\n```\n\n与其立即运行 `gulp watch`，让我们添加一个默认任务：\n\
  \n```javascript\n// default task\ngulp.task('default', ['run', 'watch']);\n```\n\
  \n保存 `gulpfile.js` 并在命令行中输入 `gulp`。你的图片、HTML、CSS 和 JavaScript 都将会被处理，然后 Gulp 将保持活跃状态并在更新并在需要重新运行任务。按下\
  \ `Ctrl/Cmd` + `C` 停止监控并返回命令行。\n\n## 第 7 ：大获成功！\n\n你可能觉得这些插件有用：\n\n- [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins)\
  \ ±无需 `require` 声明加载所有 Gulp 插件模块\n- [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess)\
  \ — 一个简单的 HTML 和 JavaScript [预处理器](https://github.com/jsoverson/preprocess)\n- [gulp-less](https://www.npmjs.com/package/gulp-less)\
  \ — [Less CSS 预处理器](http://lesscss.org/) 插件\n- [gulp-stylus](https://www.npmjs.com/package/gulp-stylus)\
  \ — [Stylus CSS 预处理器](http://stylus-lang.com/) 插件\n- [gulp-sequence](https://www.npmjs.com/package/gulp-sequence)\
  \ — 按特定顺序运行一系列 gulp 任务\n- [gulp-plumber](https://www.npmjs.com/package/gulp-plumber)\
  \ — 防止 Gulp 在失败时停止的错误处理\n- [gulp-size](https://www.npmjs.com/package/gulp-size)\
  \ — 显示文件大小和节省的空间\n- [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon) —\
  \ 使用 [nodemon](https://www.npmjs.com/package/nodemon) 在发生变化时自动重启 Node.js 应用。\n-\
  \ [gulp-util](https://www.npmjs.com/package/gulp-util) — 包括日志和颜色编码的实用函数\n\n`gulp-util`\
  \ 中一个实用的方法是 `.noop()`，它可以直接传递数据而不执行任何操作。这可以用于更干净的开发/生产处理代码。例如：\n\n```javascript\n\
  var gutil = require('gulp-util');\n\n// HTML processing\ngulp.task('html', ['images'],\
  \ function() {\n  var out = folder.src + 'html/**/*';\n\n  return gulp.src(folder.src\
  \ + 'html/**/*')\n    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n\
  \    .pipe(gulp.dest(out));\n\n});\n```\n\nGulp 还可以调用其他 Node.js 模块，它们并不一定需要是插件。例如：\n\
  \n- [browser-sync](https://www.npmjs.com/package/browser-sync) — 发生变化时自动加载资源或刷新你的浏览器\n\
  - [del](https://www.npmjs.com/package/del) — 删除文件和文件夹（也许可以在每次运行开始时清理 `build` 文件夹）。\n\
  \n投入一点时间，Gulp 就能节省许多小时的开发挫败感。优势是：\n\n- [插件非常丰富](https://npmjs.org/browse/keyword/gulpplugin/)\n\
  - 使用管道的配置易读且易于遵循\n- `gulpfile.js` 可以在其他项目中进行适配和复用\n- 你可以减少总页面的权重以提高性能\n- 你可以简化你的部署。\n\
  \n有用链接：\n\n- [Gulp 首页](http://gulpjs.com/)\n- [Gulp 插件](https://npmjs.org/browse/keyword/gulpplugin/)\n\
  - [npm 首页](https://www.npmjs.com/)\n\n将上述流程应用于简单的网站，总权重减少了 50% 以上。你可以使用 [页面权重分析工具](http://sitepoint.com/10-best-webpage-weight-analysis-tools/)\
  \ 或像 [New Relic](http://newrelic.com/?r=phpm) 这样的服务来测试自己的结果，它提供了一系列复杂的应用程序性能监控工具。\n\
  \nGulp 可以彻底改变你的工作流。我你发现这个教程有用，并考虑在生产流程中使用 Gulp。\n\n# 第 4 章：编译为 JavaScript 的 10 种语言\n\
  \n### 作者 James Kolce\n\n本章包含了十种可以编译为 JavaScript 的有趣语言，可以在浏览器或 Node.js 等平台上执行。\n\n\
  现代应用程序与简单网站相比有[不同的需求](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)。但浏览器是一个拥有（大部分）固定技术集的平台，JavaScript\
  \ 仍然是 Web 应用程序的核心语言。任何需要在浏览器中运行的应用程序都必须用该语言实现。\n\n我们都知道 JavaScript 并不是所有任务的最佳语言，在处理复杂应用时，它可能会不从心。为了避免这个问题，人们创建了一些新语言以及现有语言的转换器，它们都能生成可以在环境中运行的代码。\n\
  \n## Dart\n\nDart 是一种用于构建快速且美观应用的客户端优化语言。它由 Google 开发，可以编译为 JavaScript。\n\n任何需要在浏览器中运行的应用程序都必须用该语言实现。\n\
  \n我们都知道 JavaScript 并不是所有任务的最佳语言，在处理复杂应用时，它可能会不从心。为了避免这个问题，人们创建了一些新语言以及现有语言的转换器，它们都能生成可以在环境中运行的代码。\n\
  \n\n\n\n[TypeScript](https://www.typescriptlang.org/) 是 JavaScript 的超集。一个有效的 JavaScript\
  \ 程序也是有效的 TypeScript，但增加了静态类型。编译器还可以用作从 ES2015+ 到当前实现的转译器，因此你始终可以获得最新的的特性。\n\n与许多其他语言不同，TypeScript\
  \ 保持了 JavaScript 的精髓，只添加了旨在提高代码健壮性的功能。这些是类型注解和其他与类型相关的功能，它们让编写 JavaScript 变得更加愉快，这得益于静态分析器等专门化工具的启用，这些工具可以为重构过程提供帮助。此外，类型的添加改进了你应用程序中不同组件之间的接口。\n\
  \n该语言支持类型推断，因此你不需要从一开始就编写所有的类型。你可以编写快速解决方案，然后添加所有类型以对你的代码充满信心。\n\nTypeScript 还支持高级类型，例如交叉类型、联合类型、类型别名、判别式联合和类型守卫。你可以在\
  \ [TypeScript 文档](https://www.typescriptlang.org/docs) 网站中的[高级类型](https://www.typescriptlang.org/docs/handbook/advanced-types.html)\
  \ 页面查看所有内容。\n\n如果你使用 React，通过添加 React 类型定义也可以支持 JSX：\n\n```\nclass Person {\n  private\
  \ name: string;\n  private age: number;\n  private salary: number;\n\n  constructor(name:\
  \ string, age: number, salary: number) {\n    this.name = name;\n    this.age =\
  \ age;\n    this.salary = salary;\n  }\n\n  toString(): string {\n    return `${this.name}\
  \ (${this.age}) (${this.salary})`;\n  }\n}\n```\n\n有关 typeScript 的更多信息，请查看 SitePoint\
  \ 的[TypeScript 入门](https://www.sitepoint.com/introduction-to-typescript/) 文章。\n\n\
  ## Elm\n\nElm 是一种纯函数编程语言，可以编译为 JavaScript、HTML 和 CSS。你只需要用 Elm 就可以构建完整的网站，使其成为 React\
  \ 等 JavaScript 框架的极佳替代方案。用它构建的应用会自动使用虚拟 DOM 库，使其运行非常快。一个很大的优势是内置架构，它让你忘记数据流，转而关注数据声明和逻辑。\n\
  \n在 Elm 中，所有函数都是纯的，这意味着对于给定的输入，它们始终返回相同的输出。除非你指定，否则它们不会执行任何其他操作。例如，要访问远程 API，你需要创建\
  \ `command` 函数与外部世界通信，并使用 `subscriptions` 监听响应。纯性的另一个点是值是不可变的：当你需要某些东西时，你会创建一个新值，而不是修改它们。\n\
  \n对 Elm 的采用可以是渐进的。你可以使用 `ports` 与 JavaScript 和其他库进行通信。尽管 Elm 还没有达到版本 1，但它正被用于复杂的大型应用程序，使其成为复杂应用的可行解决方案。\n\
  \nElm 最具吸引力的特性之一是对初友的编译器，它不会产生难以读懂的信息，而是生成帮助你修复代码的代码。如果你正在学习这种语言，编译器本身可以提供很大帮助。\n\
  \n```\nmodule Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain\
  \ : Program Never Model Msg\nmain =\n    Html.program\n        { init = init\n \
  \       , update = update\n        , view = view\n        , subscriptions = subscriptions\n\
  \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg )\n\
  init = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
  \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
  \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview :\
  \ Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
  \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\n\
  如果你想了解更多信息，SitePoint 有篇实用的[Elm 入门](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
  \ 文章。\n\n## PureScript\n\n[PureScript](http://www.purescript.org/) 是一种由 Phil Freeman\
  \ 创建的纯函数且强类型编程语言。它的目标是与现有的 JavaScript 库提供强兼容性，在精神上类似于 Haskell，但将 JavaScript 保留在核心。\n\
  \nPureScript 的一个优点是它的极简主义。它不包含任何在其他语言中被认为是本质的功能库。例如，与其在编译器本身中包含生成器和承诺（promises），你可以使用特定的库来完成任务。你可以为需要的特性选择你想要的实现，这使得在使用\
  \ PureScript 时能够获得高效且个性化的体验，同时保持生成的代码尽可能小。\n\n其编译器的另一个独特特性是能够在保持库和工具上与 JavaScript\
  \ 兼容的同时，编写整洁且可读的代码。\n\n与其他语言一样，PureScript 有它自己的[名为 Pulp 的构建工具](https://github.com/purescript-contrib/pulp)，它可以与\
  \ Gulp 相比，但是用于用这种语言编写的项目。\n\n关于类型系统——与 Elm（另一种类 ML 语言）不同，PureScript 支持高级类型特性，如[高阶类型](https://en.wikipedia.org/wiki/Kind_%28type_theory%29)\
  \ 和类型类，这些特性取自 Haskell，允许创建复杂的抽象：\n\n```\nmodule Main where\n\nimport Prelude\nimport\
  \ Data.Foldable (fold)\nimport TryPureScript\n\nmain =\n    render $ fold\n    \
  \  [ h1 (text \"Try PureScript!\")\n      , p (text \"Try out the examples below,\
  \ or create your!\")\n      , h2 (text \"Examples\")\n      , list (map fromExample)\n\
  \      ]\n  where\n    fromExample { title, gist } =\n      link (\"?=\" <> gist)\
  \ (text title)\n\n    examples =\n      [ { title: \"Algebraic Data Types\"\n  \
  \      , gist: \"37c3c97f47a43f20c548\"\n        }\n      , { title: \"Loops\"\n\
  \        , gist: \"cfdabcd085d4ac3dc46\"\n        }\n      , { title: \"Operators\"\
  \n        , gist: \"3044550f29a7c5d3d0\"\n        ]\n```\n\n学习 PureScript，请查看 GitHub\
  \ 上的[PureScript 入门](https://github.com/purescript/documentation/blob/master/guides/Getting-Started.md)\
  \ 指南。\n\n## CoffeeScript\n\nCoffeeScript 是一种旨在暴露 JavaScript 优点同时提供更简洁语法的语言。尽管该语言的流行程度近年来一直在下降，但它正在改变方向，并最近获得了一个新的主版本以支持\
  \ ES2015+ 特性。\n\n用 CoffeeScript 编写的代码直接转换为可读的 JavaScript 代码，并与现有库兼容。从版本 2 开始，编译器生成的代码与最新版本的\
  \ ECMAScript 兼容。例如，每当你使用 `class` 时，你在 JavaScript 中就会得到一个 `class`。此外，如果你使用 React，有一个好消息：JSX\
  \ 与 CoffeeScript 兼容。\n\n编译器的一个非常独特的特性是能够处理以[文学化风格](https://en.wikipedia.org/wiki/Literate_programming)编写的代码，在这种风格中，不是在代码中强调并将注释作为额外，而是首先编写注释，代码只偶尔出现。这种编程风格由\
  \ Donald Knuth 引入，使得代码文件非常像技术文章。\n\n与其他语言不同，CoffeeScript 代码可以使用库直接在浏览器中进行解释。因此，如果你想创建一个快速测试，你可以在\
  \ `text/coffeescript` 脚本标签中编写代码，并包含编译器，它将实时将代码转换为 JavaScript：\n\n\n\n\n\n```\n#\
  \ 赋值:\nnumber   = 42\nopposite = true\n\n# 条件:\nnumber = -42 if opposite\n\n# 函数:\n\
  square = (x) -> x * x\n\n# 数组:\nlist = [1, 2, 3, 4, 5]\n\n# 对象:\nmath =\n  root:\
  \   Math.sqrt\n  square: square\n  cube:   (x) -> x * square x\n\n# 散参数:\nrace =\
  \ (winner, runners...) ->\n  print winner, runners\n\n# 存在性:\nalert \"I knew it!\"\
  \ if elvis?\n\n# 数组推导:\ncubes = (math.cube num for num in list)\n```\n\nCoffeeScript\
  \ 网站有一个实用的 [CoffeeScript 2 快速入门](http://coffeescript.org/v2/#coffeescript-2) 资源。\n\
  \n## ClojureScript\n\nClojureScript 是一个将 Clojure 编程语言翻译为 JavaScript 的编译器。它是一种通用的函数式语言，具有动态类型并支持不可变数据结构。\n\
  \n它是列表中唯一属于 Lisp 编程语言家族的，自然而然，它共享了许多特征。例如，代码可以被视为数据，并且提供了宏系统，使得元编程技术成为可能。与其他 Lisps\
  \ 不同，Clojure 支持不可变数据结构，这使得副作用的管理变得更加简单。\n\n由于使用了括号，这种语法对初学者来说可能望而生畏，但这种设计有深层次的原因，从长远来看，你一定会欣赏它的。语法上的极简主义和它的语法抽象能力使得\
  \ Lisp 成为解决需要高层次抽象问题的强大工具。\n\n尽管 Clojure 主要是一门函数式语言，但它并不像 PureScript 或 Elm 那样纯粹。副作用仍然会发生，但其他函数式特征依然存在。\n\
  \nClojureScript 使用 Google Closure 进行代码优化，并且与现有的 JavaScript 库兼容：\n\n```js\n; 提取自\
  \ https://github.com/clojure/clojurescript/blob/master/samples/dom/src/dom/test.cljs\n\
  \n(ns dom.test\n  (:require [clojure.browser.event :as event]\n            [clojure.browser.dom\
  \   :as dom]))\n\n(defn log [& args]\n  (.log js/console (apply pr-str args)))\n\
  \n(defn log-obj [obj]\n  (.log js/console obj))\n\n(defn log-listener-count []\n\
  \  (log \"listener count: \" (event/total-listener-count)))\n\n(def source     \
  \ (dom/get-element \"source\"))\n(def destination (dom/get-element \"destination\"\
  ))\n\n(dom/append source\n            (dom/element \"Testing me \")\n          \
  \  (dom/element \"out!\"))\n\n(def success-count (atom 0))\n\n(log-listener-count)\n\
  \n(event/listen source\n              :click\n              (fn [e]\n          \
  \      (let [i (swap! success-count inc)\n                      e (dom/element :li\n\
  \                                      {:id \"testing\"\n                      \
  \                :class \"test me out please\"}\n                              \
  \        \"It worked!\")]\n                  (log-obj e)\n                  (log\
  \ i)\n                  (dom/append destination\n                              e))))\n\
  \n(log-obj (dom/element \"Text node\"))\n(log-obj (dom/element :li))\n(log-obj (dom/element\
  \ :li {:class \"foo\"}))\n(log-obj (dom/element :li {:class \"bar\"} \"text node\"\
  ))\n(log-obj (dom/element [:ul [:li :li :li]]))\n(log-obj (dom/element :ul [:li\
  \ :li :li]))\n(log-obj (dom/element :li {} [:ul {} [:li :li :li]]))\n(log-obj (dom/element\
  \ [:li {:class \"baz\"} [:li {:class \"quux\"}]]))\n\n(log-obj source)\n(log-listener-count)\n\
  ```\n\n想要了解更多，请访问 ClojureScript 网站的 [ClojureScript 快速入门](https://clojurescript.org/guides/quick-start)\
  \ 资源。\n\n## Scala.js\n\nScala.js 是将 Scala 编程语言翻译为 JavaScript 的编译器。Scala 旨在将面向对象和函数式编程的思想合并到一种语言中，创建一个既强大又易于采用的工具。\n\
  \n作为一种强类型语言，你可以获得带有部分类型推断的灵活类型系统的优势。大多数值可以被推断，但函数参数仍然需要显式的类型注解。\n\n虽然它支持许多常见的面向对象模式（例如，每个值都是对象，操作是方法调用），但你也可以获得函数式特征，如支持一等函数和不可变数据结构。\n\
  \nScala.js 的特殊优势之一是，你可以从熟悉的面向对象方法开始，根据需要并按照自己的速度转向更具函数式的方法，而无需进行大量工作。此外，现有的 JavaScript\
  \ 代码和库与你的 Scala 代码兼容。\n\n初 Scala 开发者会发现这种语言与 JavaScript 没有太大区别。对比以下等效代码：\n\n```javascript\n\
  // JavaScript\nvar xhr = new XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
  \ +\n  \"tweets.json?q=%23scalajs\"\n);\nxhr.onload = (e) => {\n  if (xhr.status\
  \ === 200) {\n    var r = JSON.parse(xhr.responseText);\n    $(\"#tweets\").html(r);\n\
  \  }\n};\n```\n\n```javascript\n// JavaScript\nvar xhr = new XMLHttpRequest();\n\
  \nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\" +\n  \"tweets.json?q=%23scalajs\"\
  \n);\nxhr.onload = (e) => {\n  if (xhr.status === 200) {\n    var r = JSON.parse(xhr.responseText);\n\
  \    $(\"#tweets\").html(r);\n  }\n};\n```\n\n```javascript\n// JavaScript\nvar\
  \ xhr = new XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
  \ +\n  \"tweets.json?q=%23scalajs\"\n);\nxhr.onload = (e) => {\n  if (xhr.status\
  \ === 200) {\n    var r = JSON.parse(xhr.responseText);\n    $(\"#tweets\").html(r);\n\
  \  }\n};\n```\n\n```scala\n// Scala.js\nval xhr = new XMLHttpRequest()\n\nxhr.open(\"\
  GET\",\n  \"https://api.twitter.com/1.1/search/\" +\n  \"tweets.json?q=%23scalajs\"\
  \n)\nxhr.onload = { (e: Event) =>\n  if (xhr.status == 200) {\n    val r = JSON.parse(xhr.responseText)\n\
  \    $(\"#tweets\").html(r)\n  }\n}\nxhr.send()\n```\n\n```javascript\n// JavaScript\n\
  var xhr = new XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
  \ +\n  \"tweets.json?q=%23scalajs\"\n);\nxhr.onload = (e) => {\n  if (xhr.status\
  \ === 200) {\n    var r = JSON.parse(xhr.responseText);\n    $(\"#tweets\").html(r);\n\
  \  }\n};\n```\n\n```javascript\n// JavaScript\nvar xhr = new XMLHttpRequest();\n\
  \nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\" +\n  \"tweets.json?q=%23scalajs\"\
  \n);\nxhr.onload = (e) => {\n  if (xhr.status === 200) {\n    var r = JSON.parse(xhr.responseText);\n\
  \    $(\"#tweets\").html(r);\n  }\n};\n```\n\n```javascript\n// JavaScript\nvar\
  \ xhr = new XMLHttpRequest();\n\nxhr.open(\"GET\",\n  \"https://api.twitter.com/1.1/search/\"\
  \ +\n  \"tweets.json?q=%23scalajs\"\n);\nxhr.onload = (e) => {\n  if (xhr.status\
  \ === 200) {\n    var r = JSON.parse(xhr.responseText);\n    $(\"#tweets\").html(r);\n\
  \  }\n};\n```\n\n请查看 [Scala.js 快速入门](https://www.scala-js.org/tutorial/basic/) 以了解更多。\n\
  \n## Reason\n\nReason 是由 Facebook 创建并维护的语言，它为 OCaml 提供了新的语法，并且可以翻译为 JavaScript 和原生代码。\n\
  \n作为 ML 家族的一员和函数式语言，它提供了强大但灵活的类型系统、代数类型和模式匹配。它还支持面向对象编程。\n\n可以通过 [buckscript](https://github.com/BuckleScript/buckcript)\
  \ 使用现有的 JavaScript 库。你也可以在 Reason 代码中混合 JavaScript。\n\n如果你是 React 开发者，可以使用[绑定](https://github.com/reasonml/reason-react)，并且该语言支持\
  \ JSX：\n\n```ocaml\n/* 匹配变体类型 */\n\nlet possiblyValue1 = None\nlet possiblyValue2\
  \ = Some \"Hello@\"\n\nmatch possiblyValue2 with\n| None => print_endline \"Nothing\
  \ to see here.\"\n| Some message => print_endline message\n\n/* 参数化类型 */\n\ntype\
  \ universityStudent = {gpa: float};\ntype response 'studentType = {status: int,\
  \ student: 'studentType};\nlet result: response universityStudent = fetchData ();\n\
  \n/* 一个简单的简单的类型对象 */\n\ntype payload = Js.t {.\n  name: string,\n  age: int\n};\n\
  let obj1: payload = {\"name\": \"John\", \"age\": 30};\n```\n\n查看 [Reason 快速入门](https://reasonml.github.io/guide/javascript/quickstart)\
  \ 以了解更多。\n\n## Haxe\n\nHaxe 是一种多范式编程语言，它的编译器可以生成二进制文件和其他源代码。\n\n尽管 Haxe 提供了支持类型推断的严格类型系统，但如果目标语言支持，它也可以作为动态语言工作。同样，它支持多种编程风格，如面向对象、泛型和函数式。\n\
  \n当你编写 Haxe 代码时，你可以针对多个平台和语言进行编译，而无需进行大量的修改。还可以针对特定目标的代码块。\n\n你可以用 Haxe 编写后端和前端，并使用\
  \ [Haxe Remoting](https://haxe.org/manual/std-remoting-connection.html) 进行通信，支持同步和异步连接。\n\
  \n\n\n\n\n```javascript\n// Example extracted from http://code.haxe.org\n\nextern\
  \ class Database {\n  function new();\n  function getProperty<T>(property:Property<T>):T;\n\
  \  function setProperty<T>(property:Property<T>, value:T):Void;\n}\n\nabstract Property<T>(String)\
  \ {\n  public inline function new(name) {\n    this = name;\n  }\n}\n\nclass Main\
  \ {\n  static inline var PLAYER_NAME = new Property<String>(\"playerName\");\n \
  \ static inline var PLAYER_LEVEL = new Property<Int>(\"playerLevel\");\n\n  static\
  \ function main() {\n    var db = new Database();\n\n    var playerName = db.getProperty(PLAYER_NAME);\n\
  \    trace(playerName.toUpperCase());\n\n    db.setProperty(PLAYER_LEVEL, 1);\n\
  \  }\n}\n```\n\n访问 Haxe 网站的 [Haxe 入门](https://haxe.org/documentation/introduction/language-introduction.html)\
  \ 页面获取更多信息。\n\n## Nim\n\n`Nim` 是一种静态类型多范式编程语言，语法极简且对空格敏感，它可以编译为 JavaScript 以及 C、C++。\n\
  \n语言本身非常精简，但它的元编程能力使其非常适合自己实现你可能在其他语言中发现内置的功能。实现这些功能的构建块是 `macros`、`templates` 和\
  \ `generics`，通过它们你可以实现从简单功能到不同范式的各种内容。这使得 `Nim` 了一种极其多功能的语言，可以秉持 `Lisp` 的精神适应你的需求。\n\
  \n`Nim` 的语法抽象特性允许你根据自己的问题调整语言，从而实现真正的 [领域语言 (DSLs)](https://en.wikipedia.org/wiki/Domain-specific_language)。如果你有特殊的任务需要解决，你可以获得更高层次的表达能力：\n\
  \n```nim\n## 反转字符串\nproc reverse(s: string): string =\n  result = \"\"\n  for i\
  \ in countdown(high(s), 0):\n    result.add s[i]\n\nvar str1 = \"Reverse This!\"\
  \necho \"Reversed: \", reverse(str1)\n\n## 使用模板\ntemplate genType(name, fieldname:\
  \ expr, fieldtype: typedesc) =\n  type\n    name = object\n      fieldname: fieldtype\n\
  \ngenType(Test, foo, int)\n\nvar x = Test(foo: 4566)\necho(x.foo) # 4566\n```\n\n\
  Nim 网站有一些实用的[入门](https://nim-lang.org/documentation.html) 文档提供更多信息。\n\n## 结论\n\n\
  如果 `JavaScript` 不是你喜欢的语言，你仍然可以创建 Web 应用程序，而无需忍受该技术的缺点。创建这些应用程序的选项涵盖了广泛审美，从像 `PureScript`\
  \ 这样的纯函数式语言到像 `Dart` 这样的面向对象语言。如果你想要比一对一语言翻译更多的东西，还有像 `Elm` 这样的选项，它为你提供了虚拟 DOM 和内置架构等工具。\n\
  \n# 第 5 章：JavaScript 开发者必备的 10 个 VS Code 扩展\n\n### 作者 Michael Wanyoike\n\n在本文中，我将重点介绍一份\
  \ JavaScript 开发者必备的 VS Code 扩展列表。\n\n[Visual Studio Code](https://code.visualstudio.com/)\
  \ 无疑是今天最受欢迎的轻量级代码编辑器。它大量借鉴了其他流行的代码编辑器，主要是 `Sublime Text` 和 `Atom`。然而，它的成功主要源于提供更好的性能和稳定性的能力。此外，它还提供了许多所需的功能，如\
  \ `IntelliSense`，这些功能以前只在 `Eclipse` 或 `Visual Studio 2017` 等全功能 IDE 中可用。\n\n`VS\
  \ Code` 的力量无疑来自于[市场](https://marketplace.visualstudio.com/vscode)。得益于优秀的开源社区，该编辑器现在能够支持几乎所有的编程语言、框架和开发技术。对库或框架的支持以多种方式实现，主要包括针对特定技术的代码片段（snippets）、语法高亮、[Emmet](https://emmet.io/)\
  \ 和 `IntelliSense` 功能。\n\n## 按类别划分 VS Code 扩展\n\n对于本文，我将特别关注针对 JavaScript 开发者的 VS\
  \ Code 扩展。目前有许多符合这一标准的 VS Code 扩展，这意味着我无法提到所有的扩展。相反，我将重点介绍受欢迎且对 JavaScript 开发者不可或缺的\
  \ VS Code 扩展。为了简单起见，我将它们分为十类。\n\n## 代码片段类扩展\n\n当你第一次安装 VS Code 时，它带了一些 `JavaScript`\
  \ 和 `Typescript` 的代码片段。在你开始编写现代 JavaScript 之前，你需要一些额外的代码片段来帮助快速编写重复的 ES6/ES7 代码：\n\
  \n*   [VS Code JavaScript (ES6) 代码片段](https://marketplace.visualstudio.com/items?itemName=xabikos.JavaScriptSnippets)：目前最受欢迎，截至目前安装量超过\
  \ 120 万次。该扩展为 `JavaScript`、`TypeScript`、`HTML`、`React` 和 `Vue` 扩展提供了 ES6 语法。\n\n\
  *   [JavaScript Snippet Pack](https://marketplace.visualstudio.com/items?itemName=akamud.vscode-javascript-snippet-pack)：JavaScript\
  \ 有用代码片段集合。\n\n*   [Atom JavaScript Snippet](https://marketplace.visualstudio.com/items?itemName=gluons.vscode-atom-javascript-snippet)：从\
  \ `atom/language-javascript` 扩展移植的 JavaScript 代码片段。\n\n*   [JavaScript Snippets](https://marketplace.visualstudio.com/items?itemName=nathanchapman.JavaScriptSnippets)：ES6\
  \ 代码片段集。该扩展包含 `Mocha`、`Jasmine` 以及其他 BDD 测试框架的代码片段。\n\n## 语法类扩展\n\nVS Code 自带了良好的\
  \ `JavaScript` 代码语法高亮。你可以通过安装主题来更改颜色。然而，如果你需要某种程度的可读性，就需要语法高亮器。这里有几个：\n\n*   [JavaScript\
  \ Atom Grammar](https://marketplace.visualstudio.com/items?itemName=ms-vscode.js-grammar)：该扩展用\
  \ `Atom` 编辑器的 `JavaScript` 语法替换 Visual Code 中的 `JavaScript` 语法。\n\n*   [Babel JavaScript](https://marketplace.visualstudio.com/items?itemName=mgmcdermott.vscode-language-babel)：ES21x\
  \ `JavaScript`、`React`、`FlowType` 和 `GraphQL` 的语法高亮。\n\n*   [DotENV](https://marketplace.visualstudio.com/items?itemName=mikestead.dotenv)：`.env`\
  \ 文件的语法高亮。如果你在使用 `Node`，这非常有用。\n\n## Linter 类扩展\n\n以最少麻烦高效编写 JavaScript 代码需要一个 linter（代码检查工具），为所有团队成员执行特定标准。`ESLint`\
  \ 是最流行的，因为它支持 `Standard`、`Google` 和 `Airbnb` 等多种风格。以下是 Visual Code 中最流行的 linter\
  \ 插件：\n\n*   [ESLint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)：该扩展将\
  \ [ESLint](https://eslint.org/) 集成到 VS Code 中。它是最流行的 linter 扩展，目前安装量超过 670 万次。规则在\
  \ `.eslintrc.json` 中配置。\n\n*   [JSHint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.jshint)：JSHint](http://jshint.com/about/)\
  \ 代码检查扩展。使用项目根目录下的 `.jshintrc` 文件进行配置。\n\n*   [JavaScript Standard Style](https://marketplace.visualstudio.com/items?itemName=chenxsan.standardjs)：零配置\
  \ linter。执行 [StandardJS 规则](https://github.com/standard/standard)。\n\n*   [JSLint](https://marketplace.visualstudio.com/items?itemName=ajhyndman.jslint)：JSLint](http://jslint.com/help.html)\
  \ linter 扩展。\n\n如果你想了解可用 linter 及其优缺点，请查看我们的 [JavaScript 代码检查工具比较](https://www.sitepoint.com/comparison-javascript-linting-tools/)。\n\
  \n## Node 类扩展\n\n每个 JavaScript 项目都需要至少一个 Node 包，除非你是一个喜欢用困难方式做事的人。这里是一些帮助你更轻松地处理\
  \ Node 模块的 VS Code 扩展。\n\n\n\n\n\n*   [npm](https://marketplace.visualstudio.com/items?itemName=eg2.vscode-npm-script):\
  \ 使用 `package.json` 验证已安装的包。确保安装的包具有正确的版本号，高亮显示 `package.json` 中缺失的已安装包以及尚未安装的包。\n\
  *   [Node.js Modules IntelliSense](https://marketplace.visualstudio.com/items?itemName=leizongmin.node-module-intellisense):\
  \ 为 import 语句中的 JavaScript 和 TypeScript 模块提供自动补全。\n*   [Path IntelliSense](https://marketplace.visualstudio.com/items?itemName=christian-kohler.path-intellisense):\
  \ 它并不真的与 Node 有关，但你确实需要本地文件的 IntelliSense，此扩展将自动补全文件名。\n*   [Node exec](https://marketplace.visualstudio.com/items?itemName=miramac.vscode-exec-node):\
  \ 允许你使用 Node.js 执行当前文件或选定的代码。\n*   [View Node Package](https://marketplace.visualstudio.com/items?itemName=dkundel.vscode-npm-source):\
  \ 通过此扩展快速查看 Node 包源码，允许你直接从 VS Code 打开 Node 包存储库/文档。\n*   [Node Readme](https://marketplace.visualstudio.com/items?itemName=bengreenier.vscode-node-readme):\
  \ 快速打开 npm 包文档。\n*   [Search node_modules](https://marketplace.visualstudio.com/items?itemName=jasonnutter.search-node-modules):\
  \ 此扩展允许你搜索 `node_modules` 文件夹，该文件夹通常在标准搜索之外。\n*   [Import Cost](https://marketplace.visualstudio.com/items?itemName=wix.vscode-import-cost):\
  \ 显示导入包的大小。\n\n## 格式化扩展\n\n偶尔，你会发现自己正在格式化并非偏风格编写的代码。为了节省时间，你可以安装这些 VS Code 扩展之一来快速格式化和重构现有代码：\n\
  *   [Beautify](https://marketplace.visualstudio.com/items?itemName=HookyQR.beautify):\
  \ 一个 [jsBeautifier](http://jsbeautifier.org/) 扩展，支持 JavaScript、JSON、CSS 和 HTML。可以通过\
  \ `.jsbeautifyrc` 文件进行自定义。截至目前安装量超过 230 万的最流行的格式化器。\n*   [Prettier Code Formatter](https://marketplace.visualstudio.com/items?itemName=esbenp.prettier-vscode):\
  \ 一个支持使用 [Prettier](https://github.com/prettier/prettier)（一种客观的代码格式化器）格式 JavaScript、TypeScript\
  \ 和 CSS 的扩展。截至目前安装量超过 150 万。\n*   [JS Refactor](https://marketplace.visualstudio.com/items?itemName=cmstead.jsrefactor):\
  \ 为重构 JavaScript 代码提供许多工具和操作，例如提取变量/方法、将现有代码转换为使用箭头函数或模板字面量以及导出函数。\n*   [JavaScript\
  \ Booster](https://marketplace.visualstudio.com/items?itemName=sburg.vscode-javascript-booster):\
  \ 一个强大的代码重构工具。具有多种编码操作，如将 `var` 转换为 `const` 或 `let`、删除冗余的 `else` 语句以及合并声明与初始化。很大程度上源自\
  \ [WebStorm](https://www.jetbrains.com/webstorm/) 的启发。\n\n## 浏览器扩展\n\n除非你在用 JavaScript\
  \ 写控制台程序，否则你极可能是在浏览器内部运行 JavaScript 代码。这意味着你需要频繁刷新页面以查看每次对代码进行更新的效果。与其一直手动这样做，这里有几个可以显著缩短迭代过程开发时间的工具：\n\
  *   [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome):\
  \ 在 Chrome 中轻松调试你的 JavaScript（通过在编辑器内部设置断点）。\n*   [Live Server](https://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer):\
  \ 实时重载功能的静态和动态页面本地开发服务器。\n*   [Preview on Web Server](https://marketplace.visualstudio.com/items?itemName=yuichinukiyama.vscode-preview-server):\
  \ 提供 Web 服务器和实时预览功能。\n*   [PHP Server](https://marketplace.visualstudio.com/items?itemName=brapifra.phpserver):\
  \ 适用于测试仅需要在客户端运行的 JavaScript 代码。\n*   [Rest Client](https://marketplace.visualstudio.com/items?itemName=humao.rest-client):\
  \ 无需使用浏览器或 CURL 程序来测试你的 REST API 端点，你可以安装此工具直接在编辑器内部交互式地运行 HTTP 请求。\n\n## 框架扩展\n\
  \n对于大多数项目，你需要一个合适的框架来组织代码并缩短开发时间。VS Code 通过扩展支持大多数主流框架。然而，仍然有一些成熟的框架还没有完全开发的扩展程序。\n\
  *   [Angular 6](https://marketplace.visualstudio.com/items?itemName=Mikael.Angular-BeastCode):\
  \ Angular 6 的代码片段。支持 TypeScript、HTML、Angular Material ngRx、RxJS & Flex Layout。截至目前安装量超过\
