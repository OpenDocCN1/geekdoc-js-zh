    **<html>**


    **<head>**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_13_0.png)


    **<title> Topalian JavaScript Robot AI </title>**


    **<link rel=''stylesheet'' href=''css/style001.css''>**


    **<script src=''js/utility.js''></script>**


    **<script src=''data/responses.js''></script>**


    **<script src=''data/randomResponses.js''></script>**


    **<script>**


    **function calculate(input)**

    **{**

    **try**

    **{**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_14_0.png)


    **return eval(input);**


    **}**

    **catch(error)**

    **{**


    **return null;**


    **}**

    **}


    **function createRobot()**

    **{**

    **let context=null;**

    **let mainDiv=ce(''div'');**

    **mainDiv.id= ''mainDiv'';**

    **mainDiv.className= ''mainDiv'';**

    **document.body.append(mainDiv);**

    **//-//**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_15_0.png)


    **let chatBox=ce(''div'');**

    **chatBox.id= ''chatBox'';**

    **chatBox.innerHTML= '''';**

    **chatBox.className= ''chatBox'';**

    **mainDiv.append(chatBox);**

    **//-//**

    **let lineBreakOutput=ce(''hr'');**

    **mainDiv.append(lineBreakOutput);**

    **//-//**

    **let userInput=ce(''input'');**

    **userInput.id= ''userInput'';**

    **userInput.className= ''userInput'';**

    **userInput.style.type= ''text'';**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_16_0.png)


    **userInput.style.placeholder=''Type Words Here'';**

    **mainDiv.append(userInput);**

    **//-//**

    **let sendButton=ce(''button'');**

    **sendButton.innerHTML= ''Send'';**

    **sendButton.id= ''sendButton'';**

    **sendButton.className= ''sendButton'';**

    **mainDiv.append(sendButton);**

    **//-//**

    **// Enter activates a click on send button**

    **userInput.onkeydown=function(event)**

    **{**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_17_0.png)


    **if (event.key === ''Enter'')**

    **{**


    **// prevent Enter key**

    **event.preventDefault();**

    **// trigger a click on the send button**

    **sendButton.click();**

    **// color button border aqua**

    **sendButton.style.borderColor= ''rgb(0,255,255)'';**

    **// color button font color aqua**

    **sendButton.style.color= ''rgb(0,255,255)'';**

    **// after 275 milliseconds**

    **setTimeout(function()**

    **{**


    **// default border of send button**

    **sendButton.style.borderColor= ''rgb(255,255,255)'';**

    **// default color of send button**

    **sendButton.style.color= ''rgb(255,255,255)'';**

    **},275);**

    **}**

    **};**


    **sendButton.onclick=function()**

    **{**


    **// display what person typed in chatBox**


    **chatBox.innerHTML+=`<span style=''color: rgb(255,255,255);''>${userInput.value}</span><br>`;

    **let userQuestion=userInput.value.trim();**

    **if (userQuestion)**

    **{**

    **let responseObj=responses.find(function(obj)**

    **{**

    **return obj.keywords.some(function(keyword)**

    **{**


    **// lowercase and remove punctuation**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_20_0.png)


    **let cleanInput=userQuestion.toLowerCase().replace(/[^\w\s\]/g,'''');**

    **let cleanKeyword=keyword.toLowerCase();**

    **// check for exact match of cleaned input and cleaned keyword**

    **return cleanInput === cleanKeyword;**

    **});**

    **});;**

    **if (responseObj)**

    **{**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_21_0.png)


    **let randomIndex=Math.floor(Math.random() * responseObj.responses.length);**

    **chatBox.innerHTML+=`<span style=''color: aqua;''>${responseObj.responses[randomIndex]}</span><br>`;

    **if (responseObj.keywords.indexOf(''bye'') !== -1)**

    **{**

    **context=null;**

    **chatBox.scrollTop=chatBox.scrollHeight;**

    **}**

    **else**


    ![](img/3e986e3c8d5087a94f9df94cc12e8768_22_0.png)


    **{**

    **context=responseObj.keywords;**

    **chatBox.scrollTop=chatBox.scrollHeight;**

    **}**

    **}**

    **else**

    **{**

    **let result=calculate(userQuestion);**

    **if (result !== null)**

    **{**

    **chatBox.innerHTML+=`<span style=''color: aqua;''>${result}</span><br>`;

    **}**

    }**

