  \ York.\n\n### 8. 结合 Arduino\n\nArduino 是一个具有多种用途的独立微控制器单元。Processing 是一个用于视觉艺术的软件平台。它起源于\
  \ 2001 年，从那时起一直在可视化。\n\n* 它支持 2D、3D 以及便携文档格式 (PDF) 的交互式编程。\n* 它支持 Linux、Windows、MacOS\
  \ X 甚至安卓。\n* 它有庞大的库支持。\n* 它兼容多种语言。\n\n### 8.1 Processing 语言概述\n\nProcessing 是一门视觉艺术语言。Processing\
  \ 的基础语言是 Java。虽然 Java 具有一些语法特征，但它也包含了用于可视化的 PostScript 和 OpenGL。许多语言从根本上与 Processing\
  \ 相关，如 Arduino、wiring 框架、C++、Java 和 Android。此外，通过 processing.js 还整合了对 JavaScript\
  \ 和 HTML5 的支持。\n\n很多人每天都使用 processing。随着时间的推移，对 processing 的社区支持日益增加并变得强大。Processing\
  \ 对各类人群都有用。视觉艺术家、平面设计师、动画师，以及想要实时以图形形式可视化传感器数据或可能想要传感器数据设计视觉效果的人都可以使用 processing。\n\
  \n#### 8.1.2 Processing 软件\n\n软件本身是开源的，可以在 [`processing.org/`](http://processing.org/)\
  \ 获取。适用于 Windows、Linux 和 MacOS X 的稳定版本。此外，Play Store 中也有适用于安卓的 IDE。在安卓版本中，可以在不更改或部分更改代码的情况下创建壁纸和不同的虚拟现实应用程序。我们无需担心安装软件开发包\
  \ (SDK) 或编辑布局。安卓版的 Processing 还允许安卓应用程序接口 (API) 读取传感器数据，甚至将草稿导出为准备上传到 Google Play\
  \ Store 的签名包。\n\n\n\n\n\n其他支持的处理平台包括 Windows 64 位、Linux 64 位和 Linux ARMv6hf。旧版本也可以从源码构建。处理窗口如图图\
  \ 8.1\n\n**图 8.1**\n\nProcessing 窗口显示基础动画。\n\n![Images](img/008x002.jpg)\n\n**图\
  \ 8.2**\n\nProcessing 中的不同模式。\n\n要开始 processing 开发，首先从 `.zip` 或 `.exe` 源码安装 processing\
  \ IDE 并打开 processing 窗口。当我们打开窗口时，在右上角可以看到模式选项。默认情况下，模式是 Java 模式。我们可以将模式从 Java 更改为\
  \ Python 模式。\n\n在安装了 Python 模式后，你可以通过输入以下代码检查基础草图（sketch）：\n\n```\ndef setup():\n\
  \    size(600, 600)\n    colorMode(HSB)\n    noStroke()\n\ndef draw():\n    fill(0x11000000)\n\
  \    rect(0, 0, width, height)\n    fill(frameCount % 255, 255, 255)\n    ellipse(mouseX,\
  \ mouseY, 20, 20)\n```\n\n它会根据提供的颜色创建一些矩形和椭圆的基本形状。\n\nPython 模式基本上基于 Java 工程设计，旨在与现有的生态系统和\
  \ processing 库兼容。processing 中使用的一些重要库包括与外部硬件设备（USB、RS232）进行串口通信的 `Serial` 库、处理音频以合成和效果的\
  \ `Sound` 库、播放视频文件并创建电影的 `Video` 库，以及在客户端-服务器模式下在网络中发送接收数据的 `Network` 库。`DFX` 输出库创建\
  \ DFX 文件以保存几何形状加载到第三方应用程序中。它包含了多边形、框、球体和其他三角形基础对象。`PDF` 输出库使得导出 pdf 成为。`Hardware\
  \ I/O` 库与树莓派或其他基于 Linux 的系统硬件进行交互。关于库的更多信息将在 8.3 节中进一步讨论。\n\n![Images](img/line.jpg)\n\
  \n### 8.2 代码结构\n\n### 8.2.1 Processing 代码\n\n在我们电脑上安装 processing 环境时，我们的任务是编写一些程序。在\
  \ Windows 环境下，我们可以通过双击图标打开 IDE。如果包是 `.zip` 扩展，我们只需将其解压到任何目录并运行可执行文件。在 Linux 中，要执行它，必须编写\
  \ `./processing`（因为它是一个带有 `.sh` 扩展名的脚本）。在此之前，我们必须将 processing 可执行文件的模式更改为可执行模式。我们必须执行命令\
  \ `chmod 777 processing` 来。一旦成功，它将打开 IDE。\n\nprocessing 的基本代码结构基本上与 Arduino 语言相似，因为它由\
  \ `void setup()` 函数组成，并且没有 `void loop`，而是有一个 `void draw()` 函数。`void draw()` 函数的作用是在给定的图像区域内绘制像素。在我们的第一个程序中，我们将简单地在固定帧区域内绘制一些圆。代码所示：\n\
  \n```\nvoid setup() {\nsize(500, 520);\nsmooth();\n}\nvoid draw() {\nif (mousePressed)\
  \ {\nfill(1);\n} else {\nfill(252);\n}\nellipse(mouseX, mouseY, 70, 70);\n}\n```\n\
  \n代码的输出将显示 500, 520 给定帧区域内的一组圆，随着我们将鼠标指针移动到该区域，将生成更多的圆。\n\nprocessing 应用的主要优点之一是，你可以直接将代码导出为可执行的应用程序软件。在这种情况下，你必须点击导出按钮。它将根据你的要求立即应用程序。默认情况下，它将创建\
  \ Windows 32/64 位、Linux 32/64 位和 MAC OSX 。\n\n### 8.2.2 绘制对象\n\nprocessing 包含运行应用程序两个两个函数。第一个是\
  \ `void setup()`，主要用于初始化变量和对象。它还初始化窗口显示帧的大小。下一个方法是 `draw()`。此方法的运行类似于 applet 的生命周期，这意味着此方法中的代码实际上以循环方式执行，直到通过点击关闭按钮停止显示窗口。\n\
  \n要开始 processing 开发，首先从 .zip 或 .exe 源码安装 processing IDE 并打开 processing 窗口。当我们打开窗口时，在右上角可以看到模式选项。默认情况下，模式是\
  \ Java 模式。我们可以将模式从 Java 更改为 Python 模式。\n\n在安装了 Python 模式后，你可以通过输入以下代码检查基础草图：\n\n\
  ```\ndef setup():\n    size(600, 600)\n    colorMode(HSB)\n    noStroke()\n\ndef\
  \ draw():\n    fill(0x11000000)\n    rect(0, 0, width, height)\n```\n\n它会根据提供的颜色创建一些矩形和椭圆的基本形状。\n\
  \nPython 模式基本上基于 Java 工程设计，旨在与现有的生态系统和 processing 库兼容。processing 中使用的一些重要库包括与外部硬件设备（USB、RS232）进行串口通信的\
  \ `Serial` 库、处理音频以合成和效果的 `Sound` 库、播放视频文件并创建电影的 `Video` 库，以及在客户端-服务器模式下在网络中发送接收数据的\
  \ `Network` 库。`DFX` 输出库创建 DFX 文件以保存几何形状加载到第三方应用程序中。它包含了多边形、框、球体和其他三角形基础对象。`PDF`\
  \ 输出库使得导出 pdf 成为。`Hardware I/O` 库与树莓派或其他基于 Linux 的系统硬件进行交互。关于库的更多信息将在 8.3 节中进一步讨论。\n\
  \n![Images](img/line.jpg)\n\n### 8.3 库与函数\n\n处理环境中包含了各种库。将讨论最有效的库。\n\n#### 8.3.1\
  \ Serial 库\n\nSerial 库是流行的库之一，可以通过串口（如 5`：此函数返回整数形式的字节数，显示在该时刻有多少字节可用。\n\n- `read()`：此函数用于从读取缓冲区中读取数据字节。读取应该以\
  \ 0–255 值的形式进行。如果没有可用数据，它将返回 -1。可以使用其他 `read()` 函数的形式，例如 `readChar()`、`readByte()`、`readByteUntil()`、`readString()`\
  \ 和 `readStringUntil()`。\n\n- `buffer()`：此函数主要用于创建存储的临时缓冲区内存。在这种情况下我们必须传递缓冲区的大小。语法看起来如\
  \ `Serial.buffer(size)`。还有一个 `bufferUntil()` 函数与 `buffer()` 相关，确保在调用串口事件之前保持缓冲区位置。\n\
  \n- `Last()`：此方法返回缓冲区中最后一个用的字节。如果不可用，它将立即返回 -1。\n\n\n\n\n\n- 还有一些输入-输出函数可用。这些函数包括\
  \ `write()`、`clear()`、`stop()` 等。`write()` 函数用于向串口写入数据，`clear()` 函数用于清除端口本身，而 `stop()`\
  \ 函数用于停止该端口的进一步通信。另一个名为 `list()` 的函数。\n- **硬件 I/O**：它主要用于访问树莓派或其他基于 Linux 的计算机系统。这本质上是一个外围设备接口库。其功能与\
  \ Arduino 平台类似。\n\n该库中一个非常有用的类是 `General Purpose Input/Output`-`GPIO` 类。该库包含以下各种功能：\n\
  \n- **网络**：它使用简单的客户端-服务器方法通过网络发送数据。\n- **音效**：它执行音频文件的播放并产生合成声音和效果。\n- **视频**：它从摄像头读取电影并播放视频。\n\
  - **DFX 导出**：它能够创建 `DFX` 文件并保存几何图形，供其他应用程序使用。\n- **PDF 导出**：它还能创建并导出带有高分辨率矢量图形的\
  \ `PDF` 文件。\n\n![Images](img/line.jpg)\n\n### 8.4 LDR 输出的可视化\n\nLDR 是一种光检测传感器。它本质上是一个光敏电阻。电阻值随着光强的变化而改变。我们可以通过从设备的串口获取光强数据来使光强的可视化。然后，处理平台可以获取这些数据以生成图形化可视化结果。在这种情况下，我们可以使用\
  \ `Arduino DUE` 并配合光传感器接口分压器电路。获取 LDR 数据的 Arduino 代码所示：\n\n```cpp\n //Arduino Code\n\
  \nint apin =A0;\nvoid setup() {\n  // 在此处编写你的设置代码，运行一次：\n\n  pinMode(apin,INPUT);\n\
  \  Serial.begin(9600);\n}\n\nvoid loop() {\n  // 在此处编写你的主代码，循环运行：\n\n  int d = analogRead(apin);\n\
  \n  Serial.println(d,DEC);\n\n}\n```\n\n接下来的代码表示了圆圈移动的处理示例，这取决于光强的变化。图 8.4 显示了光强的可视化。\n\
  \n```processing\n // Processing code\n\nimport processing.serial.*;\nSerial port;\n\
  float br=0;\n\nvoid setup(){\n\n  size(800,600);\n  port = new Serial(this,\"COM6\"\
  ,9600);\n  port.bufferUntil('\\n');\n}\n\nvoid draw(){\n\n  background(br-88,br-44,br);\n\
  \n  fill(255,255,0);\n\n  ellipse(100,100,br,br);\n  fill(020,200,  77);\n  ellipse(br+250,br+250,200,200);\n\
  \  println(br);\n}\nvoid serialEvent(Serial port){\n  br = float(port.readStringUntil('\\\
  n'));\n}\n```\n\n![Images](img/008x004.jpg)\n\n**图 8.4**\n\n光强的可视化。\n\n![Images](img/line.jpg)\n\
  \n### 8.5 与 Arduino 和 Firmata 的交互\n\nArduino 和 processing 之间存在很强的兼容性。我们通常直接与 processing\
  \ 和 Arduino 交互。有时，交互由 Firmata 控制协议进行控制。\n\nArduino 与 processing 通信的一个基础示例是传感器数据可视化。接下来的示例演示了\
  \ Arduino 和 processing 如何协同工作。\n\n在这个示例中，我们正尝试将超声波传感器的数据可视化。数据已由超声波传感器获取，距离使用 Arduino\
  \ 计算；此外，距离值将发送到 processing 应用程序，它将数据可视化化为一个类似雷达的范围测距器。系统图如图 8.5 所示。\n\n![Images](img/008x005.jpg)\n\
  \n**图 8.5**\n\n基于 Arduino 的雷达系统连接图。\n\n接下来的代码分别演示了 Arduino 和 processing 的实现：\n\n\
  ```cpp\n Arduino Code\n\n// 包含 Servo 库\n#include <Servo.h>.\n// 定义超声波传感器的 Trig 和\
  \ Echo 引\nconst int trigPin = 3;//橙色\nconst int echoPin = 2;//红色白色 - vcc 灰色 -g 地\n\
  // 用于持续时间和距离的变量\nlong duration;\nint distance;\nServo myServo; // 创建一个 servo 对象来控制舵机\n\
  void setup() {\n  pinMode(trigPin, OUTPUT); // 将 trigPin 设置为输出\n  pinMode(echoPin,\
  \ INPUT); // 将 echoPin 设置为输入\n  pinMode(4,OUTPUT);//黄色\n  pinMode(1,OUTPUT);\n \
  \ Serial.begin(9600);\n  myServo.attach(9); // 定义舵机连接的紫色引脚 9\n}\nvoid loop() {\n\
  \  // 将舵机从 5 度旋转到 165 度\n  for(int i=0;i<=180;i++){\n    myServo.write(i);\n   \
  \ delay(30);\n    distance = calculateDistance();// 调用函数通过超声波计算每个角度的距离\n    Serial.print(i);\
  \ // 将当前角度发送到串口\n    Serial.print(\",\"); // 发送上一个值后面的字符，后续 Processing IDE 需要索引\n\
  \    Serial.print(distance); // 将距离值发送到串口\n    Serial.print(\".\"); // 发送字符\n  }\n\
  \  // 从 165 度到 5 度旋转舵机\n  for(int i=180;i>0;i--){\n    myServo.write(i);\n    delay(30);\n\
  \    distance = calculateDistance();\n    Serial.print(i);\n    Serial.print(\"\
  ,\");\n    Serial.print(distance);\n    Serial.print(\".\");\n  }\n}\n// 通过超声波计算距离的函数\n\
  int calculateDistance(){\n  digitalWrite(trigPin, LOW);\n  delayMicroseconds(2);\
  \ // 将 trigPin 设置为高电 10 微秒\n  digitalWrite(trigPin, HIGH);\n  delayMicroseconds(10);\n\
  \  digitalWrite(trigPin, LOW);\n  duration = pulseIn(echoPin, HIGH); // 读取 echoPin，返回声波传输时间（微秒）\n\
  \  distance=duration*0.34/2;\n  if (distance < 40) {\n    digitalWrite(4,HIGH);\n\
  \    digitalWrite(11,HIGH);\n  }\n  else {\n    digitalWrite(4,LOW);\n    digitalWrite(11,LOW);\n\
  \  }\n  return distance;\n}\n```\n\nArduino 获取安装在舵机上的超声波传感器数据。`#include<Servo.h>`\
  \ 实际上添加了控制舵机的功能。在这里，我们需要定义 `trigPin` 和 `echoPin` 为常量变量。\n\n现在在 Arduino 的 `setup()`\
  \ 函数中，将 `trigPin` 设置为输出，`echoPin` 设置为输入。舵机将连接在 9 号。\n\n在 `loop()` 函数中，首先通过一个 `for`\
  \ 循环让舵机从 15 度旋转到 165 度。在这里，`myServo.write(i)` 函数执行舵机的移动，延迟为 30 毫秒。在移动过程中，调用 `calculateDistance()`\
  \ 函数获取超声波传感器的数据并发送到串口，包括舵机的角度。第二个 `for` 循环是为了相同的目的，但是反向执行。\n\n\n\n\n\n```java\n\
  import processing.serial.*; // 导入串口通信库\nimport java.awt.event.KeyEvent; // 导入用于从串口口读取数据的库\n\
  import java.io.IOException;\nSerial myPort; // 定义 Serial 对象\n// 定义变量\nString angle=\"\
  \";\nString distance=\"\";\nString data=\"\";\nString noObject;\nfloat pixsDistance;\n\
  int iAngle, iDistance;\nint index1=0;\nint index2=0;\nPFont orcFont;\n\nvoid setup()\
  \ {\n  size (1200, 700);\n  smooth();\n  myPort = new Serial(this,\"COM3\", 9600);\
  \ // 开始串口通信\n  myPort.bufferUntil('.'); // 从串口读取数据直到遇到字符 '.' 为止。\n  // 所以实际上它读取的是：角度,距离。\n\
  }\n\nvoid draw() {\n  fill(98,245,31);\n  // 模拟移动线条的运动模糊和缓慢消失\n  noStroke();\n \
  \ fill(0,4);\n  rect(0, 0, width, height-height*0.065);\n\n  fill(98,245,31); //\
  \ 绿色\n  // 调用绘制雷达的函数\n  drawRadar();\n  drawLine();\n  drawObject();\n  drawText();\n\
  }\n\nvoid serialEvent (Serial myPort) { // 开始从串口读取数据\n  // 从串口读取数据直到字符 '.' 为止，并将其放入字符串变量\
  \ \"data\" 中\n  data = myPort.readStringUntil('.');\n  data = data.substring(0,data.length()-1);\n\
  \n  index1 = data.indexOf(\",\"); // 找到字符 ',' 并将其存入变量 \"index1\"\n  angle= data.substring(0,\
  \ index1); // 读取从位置 \"0\" 到变量 index1 位置的数据，即 Arduino 板发送到串口的角度值\n  distance= data.substring(index1+1,\
  \ data.length()); // 读取从位置 \"index1\" 到数据末尾的数据，即距离值\n\n  // 将字符串变量转换为整数\n  iAngle\
  \ = int(angle);\n  iDistance = int(distance);\n}\n\nvoid drawRadar() {\n  pushMatrix();\n\
  \  translate(width/2,height-height*0.074); // 将起始坐标移动到新位置\n  noFill();\n  strokeWeight(2);\n\
  \  stroke(98,245,31);\n  // 绘制弧线\n  arc(0,0,(width-width*0.0625),(width-width*0.0625),PI,TWO_PI);\n\
  \  arc(0,0,(width-width*0.27),(width-width*0.27),PI,TWO_PI);\n  arc(0,0,(width-width*0.479),(width-width*0.479),PI,TWO_PI;\n\
  \  arc(0,0,(width-width*0.687),(width-width*0.687),PI,TWO_PI; // 绘制角度线\n  line(-width/2,0,width/2);\n\
  \  line(0,0,(-width/2)*cos(radians(30)),(-width/2)*sin(radians(30)));\n  line(0,0,(-width/2)*cos(radians(60)),(-width/2)*sin(radians(60)));\n\
  \  line(0,0,(-width/2)*cos(radians(90)),(-width/2)*sin(radians(90)));\n  line(0,0,(-width/2)*cos(radians(120)),(-width/2)*sin(radians(120)));\n\
  \  line(0,0,(-width/2)*cos(radians(150)),(-width/2)*sin(radians(150)));\n  line((-width/2)*cos(30),0,width/2);\n\
  \  popMatrix();\n}\n\nvoid drawObject() {\n  pushMatrix();\n  translate(width/2,height-height*0.074);\
  \ // 将起始坐标移动到新位置\n  strokeWeight(9);\n  stroke(255,10,10); // 红色\n  pixsDistance\
  \ = iDistance*((height-height*0.1666)*0.025); // 将传感器的距离（厘米）转换为像素\n  // 将范围限制在 40\
  \ 厘米内\n  if(iDistance<40){\n    // 根据角度和距离绘制物体\n    line(pixsDistance*cos(radians(iAngle)),-pixsDistance*sin(radians(iAngle)),(width-width*0.505)*cos(radians(iAngle)),-(width-width*0.505)*sin(radians(iAngle)));\n\
  \  }\n  popMatrix();\n}\n\nvoid drawLine() {\n  pushMatrix();\n  strokeWeight(9);\n\
  \  stroke(30,250,60);\n  translate(width/2,height-height*0.074); // 将起始坐标移动到新位置\n\
  \  line(0,0,(height-height*0.12)*cos(radians(iAngle)),-(height-height*0.12)*sin(radians(iAngle)));\
  \ // 根据角度绘制线条\n  popMatrix();\n}\n\nvoid drawText() { // 在屏幕上绘制文字\n  pushMatrix();\n\
  \  if(iDistance>40) {\n    noObject = \"超出范围\";\n  } else {\n    noObject = \"在范围内\"\
  ;\n  }\n  fill(0,0);\n  noStroke();\n  rect(0, height-height*0.0648, width, height);\n\
  \  fill(98,245,31);\n  textSize(25);\n  text(\"10cm\",width-width*0.3854,height-height*0.0833);\n\
  \  text(\"20cm\",width-width*0.281,height-height*0.0833);\n  text(\"30cm\",width-width*0.177,height-height*0.0833);\n\
  \  text(\"40cm\",width-width*0.0729,height-height*0.0833);\n  textSize(40);\n  text(\"\
  Akshay676\", width-width*0.875,height-height*0.0277);\n  text(\"角度: \" + iAngle\
  \ + \" °\", width-width*0.48,height-height*0.0277);\n  text(\"距离: \", width-width*0.26,\
  \ height-height*0.0277);\n  if(iDistance<40) {\n    text(\"\" + iDistance + \" cm\"\
  , width-width*0.225,height-height*0.0277);\n  }\n  textSize(25);\n  fill(98,245,60);\n\
  \  translate((width-width*0.4994)+width/2*cos(radians(30)),height-height*0.0907);\n\
  \  rotate(-60);\n  text(\"30°\",0,0);\n  resetMatrix();\n  translate((width-width*0.503)+width/2*cos(radians(60)),height-height*0.0888);\n\
  \  rotate(-30);\n  text(\"60°\",0,0);\n  resetMatrix();\n  translate((width-width*0.507)+width/2*cos(radians(90)),height-height*0.0833);\n\
  \  rotate(0);\n  text(\"90°\",0,0);\n  resetMatrix();\n  translate(width-width*0.53+width/2*cos(radians(120)),height-height*0.0729);\n\
  \  rotate(30);\n  text(\"120°\",0,0);\n  resetMatrix();\n  translate((width-width*0.5104)+width/2*cos(radians(150)),height-height*0.0574);\n\
  \  rotate(60);\n  text(\"150°\",0,0);\n  popMatrix();\n}\n```\n\n上述代码创建了类似于雷达扫描的视觉效果（图\
  \ 8.6）。为了获得该视觉效果，屏幕尺寸设置为 $1200 \\times 700$。然后，通过调用 `myPort = new Serial(this, \"\
  COM3\", 9600)` 打开串口对象。端口也可以通过另一个调用 `Serial.list()[0]` 来调用。在这种情况下，`Serial.list()`\
  \ 返回端口名称。默认为 `COM1`。可以通过增加 `Serial.list()[0]` 的索引来更改。然后调用 `myPort.bufferUntil('.')`，它会从串口读取数据直到字符\
  \ `.`。因此，它实际上读取的是角度和距离。\n\n![images/008x006.jpg]\n**图 8.6** Processing 雷达屏幕。\n\n\
  ![line.jpg]\n\n### 8.6 Processing 中的鼠标处理\n\n在 Processing 中，我们可以像图 8.7 所示处理鼠标活动。这是\
  \ Processing 中一种简化的事件处理机制。许多与鼠标编程相关的函数可以高效地控制鼠标活动。由于 Processing 基于 Java，鼠标的基础活动完全由后端的\
  \ Java 事件处理工具和接口控制，由于 Processing 产生了一层抽象，Processing 定义的函数（方法）通常会调用后端的 Java。接下来的节我们将讨论\
  \ Processing 的一些主要鼠标处理方法。\n\n![images/008x007.jpg]\n**图 8.7** 鼠标活动控制。\n\n1. `mouseClicked()`：此函数主要在鼠标按钮按下释放后调用。通常，鼠标或键盘事件与\
  \ `draw()` 函数关联。如果我们不在 `draw()` 下使用它，它只会被调用一次并停止监听事件。通常使用重载函数语法：第一个是无参数的 `mouseClicked()`，另一个是带有程序生成的事件对象的\
  \ `mouseClicked(event)`。\n\n示例所示：\n\n```java\nint val=0;\n\npublic void draw() {\n\
  \  fill(val);\n  rect(20, 20, 60, 60);\n}\n\nvoid mouseClicked() {\n  if (val ==\
  \ 0) {\n    val = 255;\n  } else {\n    val = 0;\n  }\n}\n```\n\n\n\n\n\n## 2. `mouseX`:\
  \ `mouseX` 是一个由鼠标 X 轴坐标组成的系统变量。如果鼠标在当前窗口内，Processing 就可以跟踪鼠标的位置。默认情况下，该值为 0。当鼠标指针悬停在绘图窗口上时，它在离开时保持值\
  \ 0，然后继续报告更新后的位置。\n\n以下代码展示了该用处：\n\n```java\npublic void draw() {\n  background(225);\n\
  \  line(mouseX, 24, mouseX, 70);\n}\n```\n\n## 3. `MouseY`: 该系统变量存储鼠标移动的垂直位置。该变量的其他属性与\
  \ `mouseX` 系统变量相似。\n\n## 4. `pmouseX`: 它是一个存储当前帧位置上一帧位置的系统变量。当在 `mousePressed()`、`mouseMoved()`\
  \ 和 `draw()` 等事件内部引用它时，我们可以找到 `pmouseX` 和 `pmouseY` 的不同值。在 `draw()` 中，`pmouseX`\
  \ 和 `pmouseY` 变量每帧只更新一次。在鼠标事件中，它们通常会在每次调用事件时更新。如果值没有立即更新，可能会观察到一些延迟，导致交互卡顿和延迟。如果这些变量每帧更新多次，由于在调用\
  \ `line` 之间值发生了多次变化，会导致产生很大的间隙。\n\n以下简单程序打印了鼠标的位置差：\n\n```java\nvoid draw() {\n\
  \  background(205);\n  line(mouseX, 30, pmouseX, 70);\n  println(mouseX + \" : \"\
  \ + pmouseX);\n}\n```\n\n## 5. `pmouseY`: 它是一个由鼠标当前位置上一帧的 Y 方向（或垂直方向）组成的系统变量。所有其他功能都与\
  \ `pmouseX` 系统变量相似。\n\n## 6. `mousePressed()`: 此函数与 `mouseClick()` 某些方面相似，在每次按下鼠标后仅响应一次。与此关联的鼠标按钮变量通常用于跟踪按下了哪个按钮。\n\
  \n## 7. `mouseButton`: 它是一个存储已按下鼠标按钮的系统变量。通常，它根据鼠标上按下的左键、右键和中间键获取 `LEFT`、`RIGHT`\
  \ 和 `CENTER` 值。如果没有找到按钮事件，它将显示值为 0。出于此原因，应该先调用 `mousePressed()` 函数检查按下状态，然后检查系统变量的值。以下代码是该示例：\n\
  \n```java\nvoid draw() {\n  rect(20, 20, 40, 40); // 绘制矩形\n}\n\nvoid mousePressed()\
  \ {\n  if (mouseButton == LEFT) { // 检查并执行操作\n    fill(3);\n  } else if (mouseButton\
  \ == RIGHT) {\n    fill(252);\n  } else if (mouseButton == CENTER) {\n    fill(116);\n\
  \  }\n  else {\n    fill(178);\n  }\n}\n```\n\n## 8. `mouseReleased()`: 此函数每次释放鼠标按钮时被调用。因此，`mouseReleased()`\
  \ 函数生成的事件可以用于执行不同的操作，如绘制或填充颜色。在操作上，它实际上与 `mouseClicked()` 和 `mousePressed()` 函数相似。\n\
  \n## 9. `mouseMoved()` 和 `mouseDragged()`：当鼠标按钮未按下但鼠标物理移动时，调用 `mouseMoved()` 函数。另一方面，`mouseDragged()`\
  \ 函数在鼠标被拖动时做出响应。我们可以在这些函数下执行任何特定操作。\n\n```java\nint mv = 0;\n\nvoid draw() {\n \
  \ fill(mv);\n  rect(20, 20, 45, 45);\n}\n\nvoid mouseMoved() { // 跨图像改变 mv 值\n \
  \ mv += 4;\n  if (mv > 255) {\n    mv = 0;\n  }\n}\n```\n\n## 10. `mouseWheel()`:\
  \ 此函数是一个鼠标轮控制函数，当鼠标轮向下滚动时返回正值，向上时返回负值。在此函数中，我们必须将事件作为参数传递。我们通常使用 `MouseEvent` 事件对象来控制事件功能。\n\
