  \ digitalRead() Function\n\n`digitalRead()` 函数的主要任务是读取两种状态下的数据。它可能是 `HIGH`（高电）或\
  \ `LOW`（低电），对应 1 和 0。我们将引脚编号作为数字读取函数的参数传入。它主要用于读取向微控制器发送数字 PWM 信号的传感器。它也可以被调用来读取切换开关或按按钮的状态。大多数情况下，`digitalRead()`\
  \ 函数与 `loop()` 函数相关联，因为大部分时间这个函数必须在 `loop()` 函数中调用，以便反复读取传感器数据。\n\n```cpp\n int\
  \ pBtn = 10;\n\n// setup 函数只执行一次\n\nvoid setup() {\n\n// 以 9600 波特率启动串口通信。\n  Serial.begin(9600);\n\
  \  // 将按按钮分配为输入设备\n  pinMode(pBtn, INPUT);\n}\n\n// loop 函数将无限循环\nvoid loop() {\n\
  \  // 读取输入引脚的状态\n  int b_state = digitalRead(pBtn);\n  // 打印按按钮的状态\n  Serial.println(b_state);\n\
  \  delay(1); // 延迟毫秒以提高读取的稳定性\n}\n```\n\n在上述示例中，我们正在接口一个连接到数字输入引脚 10 的按按钮。在这种情况下，`void\
  \ setup()` 例程被用于声明引脚的模式（在本例中为输入模式），并且串口通信也在此例程中启动。通常，我们选择 9,600 波特率进行串口通信。接下来，在\
  \ `loop()` 函数中，我们通过调用 `digitalRead()` 函数来获取输入状态。在获取按钮状态（0 或 1）后，我们现在使用 `Serial.println()`\
  \ 函数将该数据发送到串口。\n\n![Images](img/line.jpg)\n\n### 6.4 analogRead() Function\n\n用于从外部世界读取模拟信号的主要函数是\
  \ `analogRead()` 函数。模拟信号无上是一个连续的时域信号。存在多种来源可以产生模拟信号。一些常见的模拟设备包括电位器、模拟传感器（如简单的光敏电阻）、LM35\
  \ 温度传感器、土壤湿度探针等。\n\n在 Arduino UNO 中，有六个模拟引脚可用：`A0–A5`。在 Arduino Mega 中，总共有 16 个引脚，即\
  \ `A0–A15`。`analogRead()` 函数读取模拟信息并以数值数字的形式返回。数据类型是整数类型。Arduino 拥有 10 位 A/D 转换器，会将输入电压水平量化为五个不同的电压状态。由此产生的整数值在\
  \ 0 到 1,023 之间，这意味着总共有 1,024 个值。因此，A/D 转换器的分辨率为每单位 0.0049 V。可以使用 `analogReference()`\
  \ 函数更改分辨率和输入范围。图 6.2 显示了模拟传感器的输入模式。\n\n![Images](img/006x002.jpg)\n\n**图 6.2**\n\
  \n模拟输入模式。\n\n![Images](img/line.jpg)\n\n### 6.5 Inputs for Firmata Library\n\nFirmata\
  \ 通常使用 USB 通信通道与计算机系统通信。像 Processing 的应用程序通过串口库与其通信。串口通信基本上是面向字符的，一旦设置妥当，它就是良好且可靠的通信介质。\n\
  \nFirmata 是基于 MIDI 的，长度为 3 字节。有多种可用的通信输入和输出函数。要设置数字输出，我们必须从每个位的参数值中构建数据。读取数字输入涉及三个基本步骤：引脚必须设置为数字模式，端口必须设置为输入模式，并且必须进行解码。当端口读取模式启用时，Arduino\
  \ 开始向相应的引脚发送值。该协议的一个特性是，它会在数据发生变化时发送或重新发送数据。如果消息与上一个消息相同，则永远不会发送。该任务使用解析方法来完成。\n\
  \n以下显示了一些提到的消息发送和接收函数：\n\n`sendAnalog(byte pin, int value)` 向特定引脚发送模拟消息或模拟信号。`sendDigitalPort(byte\
  \ portNumber, intportData)` 将单个数字信号发送到 8 位端口。第二种方法是 `sendString(const char* string)`。该方法专门将字符串发送到主机计算机。接下来，`sendString(byte\
  \ command, byte bytec, byte *bytev)` 基本用于带有特定自定义命令向主机计算机发送字符串。另一个名为 `sendSysex(byte\
  \ command, byte bytec, byte* bytev)` 的方法发送带有任意字节集的命令。最后，`write(byte c)` 通常用于向流写入字节字节数据。\n\
  \n被认为执行输入操作的几个输入函数如下：\n\n* `available()` 用于检查输入缓冲区中是否收到了任何传入的消息。\n* 另一方面，`processInput()`\
  \ 函数处理从缓冲区获取的传入消息。它还将数据发送到任何注册的回调方法。\n* 包含的另外两个常用函数是 `attach(byte command, callbackFunction\
  \ Function1)` 和 `detach(byte command)`，它们主要用于将函数与传入的消息类型绑定，以及从消息中分离函数。\n\n\n\n\n\
  众所周知，Arduino 引脚的默认性质是输入，因此不需要将其声明为输入。配置为输入的引脚通常处于高阻态状态 [3]。它对电路的需求非常低，实际上等于在输入端前有一个\
  \ 100 Ω 的串联电阻。这些输入引脚从一个状态转换到另一个状态所需的电流非常小。操作内容包括读取光二极管、电容式触摸传感器以及如 LM35 温度模块之类的模拟传感器。\n\
  \n尽管在逻辑上，`pinMode(pin, INPUT)` 产生的是未连接状态，但有时由于相邻电路的电噪声干扰或与附近引脚的电容耦合，会报告引脚状态发生突变。\n\
  \n通常，如果输入引脚是悬空的，我们会将引脚引导到已知状态。这可以通过上拉电阻或下拉电阻来实现。上拉电阻连接到 +5 V，而下拉电阻应接地到 0V。10 K 欧电阻是上拉或下拉电阻的良好示例。\n\
  \nATmega 芯片的内部上拉电阻值为 20 kΩ。它只能通过软件访问。这可以通过将 `pinMode()` 设置为 `INPUT_PULLUP` 来 [4]。这基本上反转了模式，即\
  \ HIGH 会产生 OFF 状态，LOW 会产生 ON 状态。\n\n上拉值随微控制器的变化而变化。大多数基于 AVR 的微控制器上拉值在 20 到 50 kΩ\
  \ 之间。有些在 50 到 150 kΩ 之间。\n\n上拉寄存器产生的电流足以驱动 LED 完美发光。\n\n有时，尝试运行大电流设备会损坏并破坏输出晶体管引脚或\
  \ ATmega 芯片。这会导致尽管整个微控制器处于功能模式，ATmega 芯片上的某个引脚失效。发送清除消息反映了数据块是空的。由于每条消息都有唯一的状态码，很容易识别出持有特定路由的消息。\n\
