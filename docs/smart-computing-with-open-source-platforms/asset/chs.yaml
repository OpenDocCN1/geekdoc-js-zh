  \nlcd.setCursor(6, 1);\nlcd.write(byte(5));\nlcd.setCursor(7, 1);\nlcd.write(byte(6));\n\
  lcd.setCursor(8, 1);\nlcd.write(byte(7));\nlcd.setCursor(9, 1);\nlcd.write(byte(8));\n\
  \nwhile(analogRead(dat_1)<100);\n\nlcd.clear();\n}\n}\n\nlcd.clear();\nlcd.setCursor(0,\
