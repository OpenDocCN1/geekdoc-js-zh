  \ 和开源原型开发。考虑了与 Arduino 相关的各种软件和硬件工具。此外，我们还考虑了最流行的编程语言 Python 及其应用开发环境。最后，重点强调了一些最有趣的人工智能和机器学习工具。本书为探索最新的机器学习、深度学习技术以及开源原型平台提供了方向指引。\n\
  \n那么，让我们来创造一些智能设备吧。\n\n![Images](img/line1.jpg)\n\n## 常见问题 (FAQ)\n\n![Images](img/line2.jpg)\n\
  \n1. 如果我没有任何编程和硬件方面的经验怎么办？\n   `Arduino` 和 `Python` 等平台非常容易学习。它们的设计使其能够支持自学平台。`Python`\
  \ 和 `Arduino` 社区都拥有强大的资源和支持文档，因此我们可以以较快的速度学习它们。\n\n2. `Arduino` 可以在任何操作系统 (OS) 上运行吗？\n\
  \   `Arduino` 支持不同操作系统平台，如 `Windows`、`Linux` 32 位和 64 位以及 `MAC OSX Lion`。此外，它还兼容基于\
  \ `ARM` 的 `Linux`，这意味着它也可以在 `Raspberry Pi`（树莓派）平台上运行。\n\n3. `Python` 是面向对象编程 (OOP)\
  \ 吗？\n   `Python` 从早期就被认为是一种面向对象的语言。由于它支持类 (class)、多态 (polymorphism)、继承 (inheritance)\
  \ 和方法重写 (method overriding) 等功能，它被认为是一种面向对象程序 (`OOP`)。它可能既包含 `OOP` 的核心特征，也包含面向过程语言特征。\n\
  \n4. `Ubuntu Linux` 需要 `Arduino` 驱动吗？\n   对于 `Linux` 发行版，广泛使用了推荐的 `.tar.bz` 版本的\
  \ `Arduino`。通常情况下，当打开 `Arduino IDE` 硬件连接到 USB 时，USB 设备会自动识别为 `/dev/ttyACM0` 或 `/dev/ttyUSB0`。连接\
  \ `Arduino` 后，它会找到并列出所有连接到 `Arduino` 的可能 USB 端口。如果匹配到 `产品 + 厂商 ID`，开发板将以串口端口菜单项的形式出现。\n\
  \n5. 我们在 `Arduino` 中使用了哪些传感器？\n   `Arduino` 支持各种模拟和数字传感器，从简单的 `LDR`（光敏电阻）到 `LM35`\
  \ 以及温湿度传感器等许多传感器。其中，运动传感器 (motion sensor)、超声波传感器 (ultrasonic sensor) 和气体传感器 (gas\
  \ sensor) 等数字传感器非常流行。它们还支持 `MEMS` 设备，如陀螺仪 (gyroscope)、加速度计 (accelerometer)、磁指南 (magnetic\
  \ compass) 和气压计 (barometer)。\n\n6. 为什么要使用 `Processing`？\n   `Processing` 是一个用于实时数据可视化的实用编程环境。它支持广泛的颜色和效果，不仅对可视化非常有用，对于创建独特的视觉效果也有帮助。核心应用程序简化了基础的多媒体支持，如\
  \ `OpenGL`、`PDF` 和相机捕捉。`Processing` 使用可扩展的库支持和代码结构来创建复杂的 3D 几何形状。\n\n7. `Arduino`\
  \ 在什么电压下烧毁（工作电压）？\n   `Arduino` 的电压范围在 5 到 20 V 之间。如果给 `Arduino` 的电压太低，板载的活动将变得非常不稳定。在这种情况下，开发板将无法为其外围设备（如输入传感器或输出执行器）提供足够的功率。电压超过\
  \ 12 V 会影响 `Arduino` 内部电压调节器的功能。在 18–19 V 范围内，调节器开始烧毁，`Arduino` 板会受到损坏。\n\n8. 什么时候应该使用\
  \ `Python` 的 `for loops`？\n   最好使用 `for loop` 来遍历数字序列。`for loop` 取出序列中的每个元素并将其存储在`迭代变量`中。`Python`\
  \ 中 `for loop` 的另一个用途是遍历 `list`（列表）结构。\n\n9. `Python` 程序需要缩进吗？\n   `Python` 最独特的特性之一就是它的缩进。在\
  \ `Python` 中，代码块可以通过其缩进被唯一标识。与 `C` 或 `Java` 语言不同，代码块是通过大括号标识的。在这种情况下，代码的缩进不是强制的。由于这一点以及有时由于糟糕的编程习惯，阅读\
  \ `C` 和 `Java` 的程序块变得相当困难。`Python` 将其变为强制性，从而提高了程序代码的可读性。\n\n10. 推荐使用哪个 `pip` 安装\
  \ Python 包？\n    这取决于 `Python` 版本。`Python 2.7` 预装了 `pip`。但如果我们使用的是 `Python 3` 版本，建议使用\
  \ `pip3`。在安装之前，我们可以通过命令 `pip version` 检查版本。如果没有安装，我们可以使用命令 `python -m ensurepip–default\
  \ -pip` 从标准库进行引导。然后根据需要进行安装。\n\n11. 在 `Linux` 中，`Python` 包是通过 `Synaptic Package\
  \ Manager` 安装的吗？\n    `Synaptic Package Manager` 适合安装标准的 `Python` 包。但它的主要缺点是依赖于特定版本。在低版本的\
  \ `synaptic` 中，很难获取最新版本的包。Ubuntu 软件中心也可能出现相同的问题。安装最新 `Python` 包的最佳方法是通过 `pip` 安装器。\n\
  \n12. 在机器学习代码开发中，有必要使用 `NumPy` 和 `SciPy` 包吗？\n    基础机器学习方法用于更复杂的数学计算。`NumPy` 为我们提供了大量的数值计算。`SciPy`\
  \ 提供了复杂的数学计算，如积分和微分。此外，`pandas` 和 `scikit-learn` 是基础机器学习的重要元素。\n\n13. `Java` 和 `Python`\
  \ 命令行参数有什么区别？\n    主要区别在于处理命令行参数的方法。在 `Java` Case 中，命令行参数通过 `public static void\
  \ main(String args[])` 方法传递。在这种情况下，`String args[]` 是字符串类型的命令行参数。在 `Python` 中使用命令行参数，我们需要导入\
  \ `sys` 包。然后就可以从 `sys` 包的 `argv` 列表中找到参数。在这里，我们应该写 `x = sys.argv[0]`（注：此处原文即为示例）。\n\
  \n14. 是否可以在并行模式下运行两个 `Arduino`？\n    两个 `Arduino` 可以以主从模式耦合。为了实现这一点，我们可以在两个 `Arduino`\
  \ 之间建立集成电路接口 (I²C) 通信接口。这通常在我们想要分担单个 `Arduino` 工作负载时完成。在这种情况下，两个 `Arduino` 必须连接串行数据\
  \ (SDA) 和串行时钟 (SCL)。如今，得助于支持 `Arduino` 的多任务实时操作系统 (RTOS)，可以同时在 `Arduino` 上并行运行多个代码。现在已提供免费的多任务\
  \ RTOS，让你能够并行核心程序。\n\n15. 是否可以在 `Raspberry Pi` 上运行 `Tensor Flow` 或其他深度学习工具？\n\n\n\
  \n\n如 `Tensor Flow`、`PyTorch` 和 `Keras` 等深度学习工具处理高度复杂的卷积神经网络 (`CNN`) 和循环神经网络。这些模型占用巨大的计算空间。例如，由于神经连接的权重，一个神经网络有时会使用\
  \ 200 MB 的浮点格式空间。网络中数数百万计这样的连接。权重可能以 32 位浮点格式存储。我们可以通过量化来缩小文件大小，并为每层设置最大值。通过这种方式，可能实现权值的压缩，这可能适用于内存容量较低的机器上运行复杂的\
  \ `CNN`。\n\n# 16. 是否有适用于 TensorFlow 和深度学习的独立硬件？\n\n有几种适用于 TensorFlow 机器学习的专用硬件可用。其中流行的是\
  \ Lambda Deep Learning Dev Box，它由 `Ubuntu 18.04 bionic` 操作系统、`4xNVIDIA Gforce GTX\
  \ 1080 Ti`、带有 `64 GB DDR` 和 `2GB SATA SSD` 的 `Intel XEON` 处理器以及 `4 GB` 的 `HDD` 组成。它预装了\
  \ `Keras`、`Theano`、`Tensor Flow` 和 `Pytorch`。`Google Edge TPU` 是另一项为 `Raspberry\
  \ Pi` 等低功耗计算设备提供高功率机器学习工作的发明。借助此类 `TPU`，我们可以在便携设备层级创建轻量级 AI 平台。它的 CPU 是 `NXP i.MX\
  \ 8M SoC`（四核 `Cortex-A53`、`M4F`）。它的 GPU 是集成的 `GC7000 Lite`。它包含 `1GB RAM` 和 `8GB\
  \ flash`。支持的操作系统有 `Debian Linux` 和 `Android Things`。支持 `Tensor Flow Lite` 框架。`Edge\
  \ TPU Accelerator` 是另一个可以通过作为 USB 设备引入来增强应用程序 `Tensor Flow` 处理能力的平台。规格与前一个相同。\n\n\
