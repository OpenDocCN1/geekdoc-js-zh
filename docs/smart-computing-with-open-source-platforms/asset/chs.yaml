  \n## 14.3 使用 MongoDB\n\nMongoDB 是一个免费的开源、跨平台数据库系统 [3]。它是一个分类为 NoSQL 的数据库程序。它作为服务提供。在这种情况下，它拥有\
  \ `n` 个数据文件。MongoDB 的重要优势是它支持文档型设计；因此数据以 JSON 对象的形式存储。MongoDB 的 Python API 也称为 PyMongo。数据库与脚本通过\
  \ `pymongo` 的交互所示图 14.3。\n\n![Images](img/014x003.jpg)\n\n**图 14.3**\n\nPymongo\
  \ API。\n\n我们可以直接从以下链接下载 MongoDB：[`www.mongodb.org/dl/32/i386`](https://www.mongodb.org)。此链接包含了多个版本的\
  \ 32 位 MongoDB 安装器文件。目前 MongoDB 也有云版本。在安装 MongoDB 之前，我们必须检查与系统兼容的正确版本。我们可以通过以下命令检查：\n\
  \n```bash\nC:\\>wmic os get osarchitecture\n32-bit own```我们可以直接从合适的 `.MSI` 或 `.exe`\
  \ 文件安装 MongoDB。\n\n要在 Python 中访问 MongoDB，我们需要使用 `pymongo` API。你可以使用以下命令安装 `pymongo`\
  \ API：\n\n```bash\npython -m install pymongo\n```\n\n我们可以通过应用升级参数更新现有的。\n\n```bash\n\
  python -m install --upgrade pymongo\n```\n\n有时，我们倾向于从源码安装。在这种情况下，优选从 GitHub 安装。\n\
  \n```bash\ngit clone git://github.com/mongodb/mongo-python-driver.git pymongo\n\
  $ cd pymongo/\n$ python setup.py install\n```\n\nMongoDB 实例通过给出 `$mongod` 或 `sudo\
  \ service mongod start` 命令启动。\n\n第一步是 `MongoClient` 与 `mongod` 实例建立连接。它默认连接主机和端口。\n\
  \n```python\n>>> from pymongo import MongoClient\n>>> client = MongoClient()\n```\n\
  \n我们也可以通过显式提供主机名和端口来连接：\n\n```python\n>>> client = MongoClient('localhost', 27017)\n\
  >>> client = MongoClient('mongodb://localhost:27017/')\n```\n\n\n\n单个 mongo 实例可以通过属性风格访问或字典风格的访问来支持多个数据库，如下所示：\n\
  \n```\n >>> coll = db.test_coll\n>>> coll = db['test-coll']\n```\n\nMongoDB 中的数据类似于\
  \ JSON 脚本。`Pymongo` API 实际上使用类似字典的结构来表示数据。一个示例数据可以用如下方式表示：\n\n```\n >>> import datetime\n\
  >>> ins = {\"author\": \"Amu Neel\",\n...      \"text\": \"A Test Database!\",\n\
  ...      \"tags\": [\"mongodb\", \"python\", \"pymongo\", \"API\"],\n...      \"\
  date\": datetime.datetime.utcnow()}\n```\n\n要向 MongoDB 集合中插入日期元素，通常可以使用 `insert_one()`\
  \ 方法。当创建一个文档时，默认会创建一个默认键 `_id`。`_id` 的值是跨整个集合的唯一键。当我们使用 `insert_one()` 插入一个实例时，它会立即返回一个\
  \ `InsertOneResult` 实例。\n\n```\n >>> posts = db.posts\n>>> post_id = posts.insert_one(ins).inserted_id\n\
  >>> post_id\nObjectId('...')\n```\n\n要检索数据，必须实现的最基础查询是 `find_one()`。该方法返回单个文档，当匹配的文档数量只有一个时，它非常有用。\n\
  \n```\n >>> import pprint\n>>> pprint.pprint(posts.find_one())\n{u'_id': ObjectId('...'),\n\
  \ u'author': u'Amu Neel',\n u'date': datetime.datetime(...),\n u'tags': [u'mongodb',\
  \ u'python', u'pymongo',u'API'],\n u'text': u'a Database!'}\n```\n\n## 14.4 MongoDB\
