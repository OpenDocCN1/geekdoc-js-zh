  \n## Arduino 输出系统\n\n![Images](img/line2.jpg)\n\nArduino 微控制器系统支持多种输出机制。各种组件作为输出设备连接到\
  \ Arduino，有时直接连接，有时使用某些外部扩展板。在本章中，我们将通过一些标准库以及一些常见的输出设备及其接口机制，查看并演示 Arduino 可能的输出机制。\n\
  \n![Images](img/line.jpg)\n\n### 7.1 digitalWrite() 函数\n\nArduino 输出最实用的函数之一是 `digitalWrite()`\
  \ [1]。它向数字引脚写入 HIGH 或 LOW 值。引脚的输出性质由 `pinMode()` 函数决定。这根据易用性将引脚配置为输入引脚或输出引脚。当引脚变为输出引脚时，+5 V（某些特定\
  \ 3.3V 板为 +3.3 V）将 HIGH 信号输出，0V 为 LOW 信号输出。如果 `pinMode()` 为输入，`digitalWrite()` 将激活或禁用输入上拉。\n\
  \n\n\n\n图 7.1 展示了 `analogWrite()` 脉冲的频率。脉冲值范围从 0 到 255。`analogWrite(255)` 代表 100%\
  \ 的占空比，而 `analogWrite(127)` 代表 50% 的占空比，依此类推。\n\n在调用 `digitalWrite()` 或 `analogWrite()`\
  \ 的标准过程中，我们对 PWM 脉冲的占空比具有完全控制。然而，缺点是任何应用于处理器的中断都会影响时间，从而导致宽度干扰。当处理器忙于其他工作时，输出引脚无法处理任务。此外，要确定特定占空比以及频率的常量也是极其困难的。在这种情况下，手动计数是唯一的方法。\n\
  \n![Images](img/007x001.jpg)\n\n**图 7.1**\n\n`analogWrite()` 的 PWM 信号占空比。\n\n###\
  \ 7.2.3 ATmega PWM 访问\n\n通过控制 PWM 输出，与 `analogWrite()` 函数相比，我们可以获得更多 PWM 的权限。实际上，ATmega168/328\
  \ 有三个内置定时器：`Timer0`、`Timer1` 和 `Timer2`。每个定时器有两个比较寄存器和两个输出。比较寄存器控制 PWM 信号的宽度。当比较寄存器达到定时值时，输出将立即翻转。定时器的两个输出基本上频率相同，尽管定时器的占空比不同。\n\
  \n每个定时器包含一个分频器，它通过除以分频因子产生定时器时钟脉冲。定时器还会针对比较寄存器产生中断或匹配。定时器包含不同的 PWM 模式。定时器值的范围从 0\
  \ 到 255 不等。\n\n*   **快速 PWM 模式**是最简单的模式，定时器值从 0 快速计数到 255。当定时器值为 0 时输出开启，当定时器与比较寄存器匹配时输出关闭\
  \ [[3]](#ch07.xhtml_ref7_3)。\n\n*   **相位校 PWM 模式**是一种独特的模式，定时器从 0 计数到 255，然后减小到\
  \ 0。输出在碰到并匹配比较寄存器时关闭。这种输出更加对称。与快速 PWM 模式相比，其输出频率只有的一半。\n\n*   **基于 `OCRA` 的快速 PWM**是另一类\
  \ PWM，从根本上基于输出控制寄存器。基于 `Timer2` 的 PWM 在引脚 3–11 上。这里使用名为波形生成模式的特殊模式，初始设置为 111。在 `ORCA2`\
  \ 的情况下，上限被任意分配为 180。\n\n*   **具有可变时间上限的快速 PWM** 是一种定时器从 0 计数到 `ORCA`（输出比较寄存器的值）的方法。在此之后，定时器将从\
  \ 0 计数到 255，并对输出频率提供显著控制。\n\n图 7.2 显示 ATmega328 PWM 引脚配置。\n\n考虑一种通过对 LED 实施开启和关闭使其闪烁的场景。如果是这样，ATmega\
  \ 将创建一个方波，在一段时间内，信号为高电平（HIGH）；之后，它应该变为低电平（LOW）。在这种情况下，如果开启值除以关闭值，然后乘以 100%，我们就得到了占空比的实际结果（`DC[t]`）。因此，可以写为：\n\
  \n```\nDC[t] = {On[t]/(On[t] + Off[t])} × 100%\n```\n这里，`On[t]` 是开启时间，`Off[t]` 是关闭时间。因此，如果控制器的开启\
  \ 1 ms 并关闭 2 ms，那么我们就可以实现 33.3% 的占空比。因此，输出电压通过以下方程计算：\n\n![Images](img/007x002.jpg)\n\
  \n**图 7.2** ATmega328 PWM 配置。\n\n```\nV[o] = DC[t] × V[i]\n```\n这里，`V[o]` 是输出电压，`V[i]`\
  \ 是输入电压。\n\n从上述方程可以清楚，如果我们有 +5V 输入且 PWM 占空比为 25%，那么输出模拟电压为 1.25V。由于分频器充当计数器，它允许设备以不同的频率运行。这种方式有助于那些对变化的\
  \ PWM 速度敏感的设备。例如，无刷电机在非常高的 PWM 速率下产生热量，如果 PWM 太慢，电机将会抖动。在我们讨论不同的 PWM 模式时，让我们讨论一下它们的不同数学模型。\n\
  \n快速 PWM 模式是一种标准模式，PWM 作为普通计数器工作。当控制器接收到信号时，它设置寄存器 `TCINTn`。如果检测到匹配，`OCFnx` 标志将被设置，然后信号发送到波形生成器。然而，PWM\
  \ 波的频率 `F[t]` 可以计算为：\n\n```\nF[t] = Clock/{PS[v] × (1 − T[v])}\n```\n这里 `PS[v]`\
  \ 是分频器，`T[v]` 是上限，`Clock` 是时钟速度。\n\n\n\n\n\n```cpp\n // code curtsy https://howtomechatronics.com/\n\
  const int tPin = 9;\nconst int ePin = 10;\n    // defines variables\n    long dur;\n\
  \    int dist;\n    void setup() {\n    pinMode(tPin, OUTPUT);\n    pinMode(ePin,\
  \ INPUT);\n    Serial.begin(9600);\n    }\n    void loop() {\n    digitalWrite(tPin,\
  \ LOW);\n    delayMicroseconds(2);\n    digitalWrite(tPin, HIGH);\n    delay(10);\n\
  \    digitalWrite(tPin, LOW);\n    duration = pulseIn(ePin, HIGH);\n    dist= dur*0.034/2;\n\
  \    Serial.println(dist);\n}\n```\n\n![Images](img/007x003.jpg)\n\n### 图 7.3\n\n\
  连接了超声波传感器的 Arduino。\n\n在上述代码中，串口数据将由 `Serial.print(dist)` 函数提供。第二个代码段被设计为使用 Python\
  \ 串口接口获取串口数据。`serial.Serial(port,baud)` 函数接收串口数据，其中端口名和 `baud` 作为参数提供。当我们获取数据后，必须打开工作簿并激活活动工作表。在这种情况下，我们通常从串口输入获取\
