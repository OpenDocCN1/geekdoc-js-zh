  \n## 4 函数\n\n![Images](img/line.jpg)\n\n### Arduino 中的函数\n\n![Images](img/line2.jpg)\n\
  \n面向函数的编程方法是 Arduino 的核心支柱。固件设计中的每个模块都可以被视为一组函数。像 C 或 C++ 等其他语言一样 1，可以在单个文件中定义一组函数，也可以将它们写在单独的头文件中并使用\
  \ `include` 指令附加。在这里，函数也被视为模块。与其他编程语言不同，Arduino 的函数结构不于 `main()` 函数。从根本上，我们可以根据内存限制定义各种函数。当函数被创建并编译时，它将成为存储在\
  \ Arduino 程序内存（通常为 SRAM）中的代码段 2。Arduino 使用各种库来进行各种操作。所有的库主要包含了许多用于不同应用程序的函数。Arduino\
  \ 编程语言中函数的巨大优势列如下：\n\n*   函数是一种便于概念化程序的工具，程序看起来更有组织。\n*   它减少了大型程序段可能出现的错误，从而增强了编程的健壮性。\n\
  *   它增加了代码的可用性，并使代码段尺寸更小。\n\n### 4.1 setup() 和 loop() 函数\n\n`setup()` 和 `loop()`\
  \ 是 Arduino 中的基础函数 3。`setup()` 函数的语法编写如下：\n\n```\n public void setup(){\n//正文\n\
  }\n```\n\n\n\n\n它初始化环境。整个初始化任务都必须写在这个函数中。`setup()` 函数可以写成 `public void`，有时也可以写成\
  \ `void`。`public` 是访问修饰符，表示该函数是公开可用的。`void` 是返回类型，表示函数默认不返回任何内容。由于 `setup()` 函数是一个初始化器，我们通常在这里进行变量初始化、串口初始化和引脚模式设置，或者开始使用任何库。当\
  \ sketch（程序）开始运行时，`setup()` 函数会在系统初始化的最开始阶段执行一次。\n\n```\n int ledpin;\nVoid setup()\
  \ {\n    Ledpin = 12; // 引脚初始化\n    pinMode(ledpin,OUTPUT); // 分配模式\n    Serial.begin(9600);\
  \ // 初始化串口通信波特率\n}\n```\n\n`public void loop()` 是另一个重要的函数，主要用于执行重复性任务。这里的返回类型也是\
  \ `void`。`loop()` 函数默认循环迭代，使得循环内部的代码将以无限序列运行。这对于嵌入式计算机系统非常有用，可以按照顺序迭代从传感器获取数据，或者可能在\
  \ LCD 或 LED 屏幕上打印系列值。我们无法控制 `loop` 函数的执行；但是，可以使用循环内部的 `sleep` 调用来降低速度。`loop()` 函数的结构所示：\n\
  \n```\n public void loop(){\n// 重复可执行的代码\n}\n```\n\n我们也可以在 `loop()` 函数中包含循环。这样做将产生一种类似于嵌套循环的情况。这种操作对于控制机器人系统的执行器非常有用。以下是详细的代码实现：\n\
  \n```\n void loop(){\n    digitalWrite(ledpin,HIGH); // 对所述引脚执行写电操作\n    input =\
  \ analogRead(A0); // 从模拟引脚 A0 读取模拟数据并存储到 input 中\n    Serial.println(input,DEC);\n\
  }\n```\n\n![Images](img/line.jpg)\n\n### 4.2 用户定义函数\n\n在 Arduino 编程环境中，我们也可以包含一些用户定义函数。用户定义函数也可以被视为库，可以作为头文件与主源代码一起附加。可以在\
  \ `setup()` 和 `loop()` 中调用该函数。下面的示例显示了一个用户定义函数：\n\n```\n void setup(){\n    Serial.begin(9600);\n\
  \    printstar();\n    Serial.println(\"* Entry menu *\");\n    printstar();\n}\n\
  void loop(){\n    // 什么都不做\n}\nvoid printstar(){\n    int max=20;\n    for(int i=0;i<20;i++)\n\
  \    Serial.print(\"*\");   // 打印 20 次 *\n    Serial.println(\" \"); // 换行\n}\n\
  ```\n\n上述程序展示了如何使用用户定义函数。在这种情况下，`printstar()` 函数基本上用于打印 20 个 `*` 符号。程序段显示了代码的结构。我们可以在程序的任何地方创建用户定义函数，即\
  \ `setup()` 之前、`loop()` 之后，或者在 `setup()` 和 `loop()` 之间。在这种情况下，它通常被写在 `loop()` 函数之后。`printstar()`\
  \ 函数通过应用一个从 0 到 19 的循环来执行 20 个 `*` 符号的打印，之后将执行 `Serial.println()` 调用以便移动到下一行。重要的观察是，这里\
  \ `printstar()` 函数是从 `void setup()` 函数中调用的；因此，该函数将根据在该函数调用次数进行调用。总的来说，进行了两次调用，所以打印了两次\
  \ 20 个星星。在这里，`loop()` 函数是一个什么都不做的函数。\n\n![Images](img/line.jpg)\n\n### 4.3 递归函数\n\
  \n递归函数是一个可以调用自己的函数。像其他语言一样，Arduino 支持它。如下示例所示：\n\n```\n void setup(){\n    Serial.begin(9600);\n\
  \    callr(20);\n}\nvoid loop(){\n}\nvoid callr(int n){\n    if (n > 0){\n     \
  \   Serial.println(n);\n        callr(n-1);\n    }\n}\n```\n\n上述程序展示了我们如何使用递归函数。在这种情况下，`callr()`\
  \ 函数基本上用于递归地打印数字。程序段显示了代码的结构。我们可以在程序的任何地方创建递归函数，即 `setup()` 之前、`loop()` 之后，或者在 `setup()`\
  \ 和 `loop()` 之间。在这种情况下，它通常被写在 `loop()` 函数之后。`callr()` 函数通过不断调用自己执行打印，直到 `n` 达到 0。重要的观察是，这里\
  \ `callr()` 函数是从 `void setup()` 函数中调用的；因此，该函数将根据在该函数调用次数进行调用。\n\n![Images](img/line.jpg)\n\
  \n\n\n\n\n# Arduino 支持多种库来扩展环境的功能。在处理数据和操作数据时，需要各种硬件库。默认的 Arduino IDE 内置了几个库函数。为了支持任何第三方设备或不同的扩展板（shield），我们通常使用与该硬件兼容的库。下文描述了\
  \ Arduino 内置的库列表。在 Arduino IDE 中，转到“Sketch”（项目），然后选择“Import Library”（导入库）。你将看到 Arduino\
  \ 中提供的许多预定义库（图 4.2）。\n\n![Images](img/004x002.jpg)\n**图 4.2**\n带有库标签页的 IDE。\n\n\
  ### 4.4.1 EEPROM 库\n\nArduino 包含基于 AVR 的微控制器，其中包含一个小型的 EEPROM。这种内存本质上是一种非易失性内存，即使在掉电也能存储数据位。微控制器板根据其配置具有不同大小的\
  \ EEPROM，例如，`ATmega328` 拥有 1,024 字节的 EEPROM，`ATmega168` 和 `ATmega8` 拥有 512 字节，而\
  \ `ATmega1280` 和 `ATmega2560` 拥有 4 kB 内存。\n\n下文描述了集成到 EEPROM 库中的基本函数。\n\n### 4.4.1.1\
  \ read()\n\n`read()` 函数从 EEPROM 读取字节。语法为 `EEPROM.read(address)`。其中 `address` 是整数形式提供的的位置，它返回存储在该位置的字节数据。若要使用\
  \ EEPROM 库的功能，我们必须使用头文件 `EEPROM.h`。以下程序展示了 EEPROM `read()` 函数的操作。\n\n```cpp\n #include\
  \ <EEPROM.h>\n\nint adr = 0;\nint val;\n\nvoid setup()\n{\n  Serial.begin(9600);\n\
  }\n\nvoid loop()\n{\n  val = EEPROM.read(adr);\n\n  Serial.print(adr);\n  Serial.print(\"\
  \ >> \");\n  Serial.print(val);\n  Serial.println();\n\n  adr++;\n\n  if (adr ==\
  \ 512)\n    adr = 0;\n\n  delay(1000);\n}\n```\n\n上述程序读取位置 0–512 并打印其中的数据。当地址到达\
  \ 512 时，它将再次重置为 0。\n\n### 4.4.1.2 write()\n\n`write()` 函数在 EEPROM 上执行数据字节写入。语法与\
  \ `read()` 函数相似，即 `EEPROM.write(address,data)`。我们可以在 EEPROM 中写入的最大值为 255。向 EEPROM\
  \ 写入通常需要 3.3 ms。EEPROM 内存可以重写高达 100,000 次写入/擦除循环。以下显示了写入 EEPROM 的示例代码：\n\n```cpp\n\
  \ #include <EEPROM.h>\n\nvoid setup()\n{\n  for (int k = 0; k < 255; k++)\n    EEPROM.write(k,\
  \ k);\n}\nvoid loop()\n{\n// do nothing\n}\n```\n\n### 4.4.1.3 put()\n\n`put()`\
  \ 函数主要用于向 EEPROM 写入数据类型或对象。语法为 `EEPROM.put(address,data)`。该函数使用 `EEPROM.update()`\
  \ 函数来执行 `write()` 操作，并且不会重写值。以下示例展示了如何使用 `put()` 在 EEPROM 中存储 `float` 和用户自定义的数据类型。\n\
  \n```cpp\n #include <EEPROM.h>\n\nstruct Obj1 {\n  float f1;\n  byte f2;\n  char\
  \ name[5];\n};\n\nvoid setup() {\n\n  Serial.begin(9600);\n\n  float f = 123.456f;\n\
  \  int eeAdr = 0; // 数据的位置。\n\n  EEPROM.put(eeAdr, f);\n  Serial.println(\"float\
  \ data has been written!\");\n\n  /* 使用 put 存储自定义数据类型 */\n\n  Obj1 var = {\n   \
  \ 3.14f,\n    65,\n    \"Work\"\n  };\n\n  eeAdr += sizeof(float); // 地址移动到 float\
  \ 之后的下一个字节位置。\n\n  EEPROM.put(eeAdr, var);\n  Serial.print(\"user defined data type\
  \ written!\\neeprom_get to see how you can retrieve the data!\");\n}\n\nvoid loop()\
  \ {\n  // do nothing!\n}\n```\n\n### 4.4.1.4 get()\n\n即使掉电，Arduino 板也可以保存数据。若要获取永久存储在\
  \ Arduino 板上的数据，我们通常使用 `get()` 函数。\n\n```cpp\n #include <EEPROM.h>\n\nvoid setup()\
  \ {\n\n  float f1 = 0.00f;\n  int eeAddr = 0;\n\n  Serial.begin(9600);\n  while\
  \ (!Serial) {\n    // 等待串口连接\n  }\n  Serial.print(\"Read data from EEPROM: \");\n\
  \n  EEPROM.get(eeAddr, f1);\n  Serial.println(f1, 3);//以防数据格式不匹配，可能会打印 'ovf or nan'\n\
  }\n\nvoid loop() {}\n```\n\n### 4.4.1.5 update()\n\n`update()` 函数仅在写入 ROM 中的数据位与之前的数据不同时执行。该函数的参数是地址和数据值。更新操作同样需要\
  \ 3.3 ms。格式如下：\n\n```cpp\n EEPROM.update(addr,data);\n```\n\n### 4.4.2 Firmata 库\n\
  \nFirmata 是一种通信协议，允许微控制器与计算机系统、智能手机、平板电脑等进行通信。它可以实现为任何架构微控制器的固件，也可以是任何系统平台的软件包。\n\
  \nFirmata 的基本格式称为 MIDI 消息格式。在这种情况下，命令由 8 位组成，数据由 7 位组成。命令 MIDI 通道 `0XD` 是一个 2 字节命令，用于启用数字端口的报告。\n\
  \nFirmata 目前的协议版本为 `Firmata2.6.0`。该协议的意图是允许通过主机计算机控制尽可能多的微控制器。该协议从根本上为微控制器设备与主机计算机系统上的软件对象之间的直接通信而设计。在这种情况下，主机软件对象必须提供一个适用于该环境的用户界面。\n\
  \n该协议使用 MIDI 消息格式，但并非整个协议都使用它。这里的大多数命令映射在 MIDI 控制器的上下文中无法直接使用。它们可以通过标准的音乐数字接口（MIDI）解析器解析。此外，某些消息数据以不同的方式使用。表\
  \ 4.1 显示了不同的命令及其解释。\n\n![Images](img/Table_4.1.jpg)\n**表 4.1**\nFirmata2.6.0 命令与解释\n\
  \n步骤如下：\n\n* 首先，我们必须将 Arduino 设置为从模式。\n* 在 Arduino 上上传标准 Firmata。\n* 在处理环境中导入 Firmata\
  \ 库。\n* 稍后讨论标准 Firmata 代码。\n\n有几个函数与标准 Firmata 代码相关。其中一些如下：\n\n`readAndReportData(byte,int,byte)`\
  \ 函数允许 I²C 请求，因为某些设备只需要中断引脚来指示新数据可用。\n\n`checkDigitalInput(void)` 函数检查所有活动数字输入引脚并监控其状态变化。它还使用\
  \ `Serial.print()` 添加任何串口输出序列。\n\n`setPinModeCallback(byte pin, int mode)` 函数设置引脚状态，并在跟踪\
  \ PWM 和数字 I/O 状态的状态中设置相关位。\n\n在处理端，你需要完成以下任务：\n\n* 从 [arduino.cc/playground/uploads/Interfacing/processing-Arduino-0017.zip](http://arduino.cc/playground/uploads/Interfacing/processing-Arduino-0017.zip)\
  \ 下载 Arduino 的处理程序库。\n* 现在解压并将 Arduino 文件夹复制到 processing sketch 文件夹中。\n* 在 processing\
  \ 中运行以下代码。\n\n\n\n\n\n```\nimport processing.serial.*;\nimport cc.arduino.*;\nArduino\
  \ arduino;\nint ledPin = 13;\n\nvoid setup()\n{\n//println(Arduino.list());\narduino\
  \ = new Arduino(this, Arduino.list()[0], 57600);\narduino.pinMode(ledPin, Arduino.OUTPUT);\n\
  }\n\nvoid draw()\n{\narduino.digitalWrite(ledPin, Arduino.HIGH);\ndelay(500);\n\
  arduino.digitalWrite(ledPin, Arduino.LOW);\ndelay(1000);\n}\n```\n\n在这里，`cc.arduino`\
  \ 是用于 Firmata 的标准 Arduino 包。在 `setup()` 函数中，我们必须创建一个 `Arduino` 类的对象，并传递列表向量中的第 `0`\
  \ 个元素，该元素表示 Arduino 通过 PC 连接的默认端口。波特率应传递为 `57,600`。\n\n现在为了初始化引脚，我们可以调用 `Arduino`\
  \ 的 `pinMode()` 函数。\n\n在 `draw()` 函数中，为了使用 Firmata 闪烁 LED，我们使用 `Arduino.digitalWrite()`\
  \ 方法，并传入 `pin` 和 `LOW`/`HIGH` 参数。\n\n![Images](img/line.jpg)\n\n### 4.5 本章涵盖的概念](#ch00_fm04_toc.xhtml_rsec4_5)\n\
