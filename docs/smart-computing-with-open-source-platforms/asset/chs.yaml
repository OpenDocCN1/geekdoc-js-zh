  \ (2016).\n\n## 21\n\n![Images](img/line.jpg)\n\n## 更多关于机器学习 API\n\n![Images](img/line2.jpg)\n\
  \nPython 的 `scikit-learn` 为基于机器学习的智能计算提供了极佳的工具。此外，如今还引入了大量的深度学习算法。在本章中，我们的主要重点是\
  \ Python 支持的不同机器学习模型，例如监督学习和无监督学习，包括一些著名的算法类。本章还包含了深度学习工具的用途，如 TensorFlow、卷积神经网络（CNN）和循环神经网络（RNN）。\n\
  \n![Images](img/line.jpg)\n\n### 21.1 scikit-learn 深度解析\n\n在我们深入研究 `scikit-learn`\
  \ 包之前，我们必须了解机器学习的基础知识。\n\n机器学习的根本属性涉及到对“n”个样本数据的考虑，这些数据主要用于训练数据。因此，机器学习……\n\n（注：原文包含重复句子；此处已保持其核心逻辑流。）\n\
  \n学习的另一种形式是无监督学习，其中训练数据集包含输入向量 `x`，但没有定义目标值 `y`。聚类是无监督学习的示例。有时，目标是在给定的输入维度下确定数据。在这种情况下，高维数据被合成到三维空间，有时被称为密度估计。在聚类中，我们关注数据点的分组。人群分组的一个例子是电子商务网站。另一方面，关联规则发现的是描述大部分数据的规则。一些良好的例子是\
  \ K-means 聚类和用于规则学习的关联规则算法。\n\n半监督学习是另一种学习类别。该类别介于无监督和监督学习之间。在这种情况下，对于大型数据集 `x`，部分元素有标记，而其他部分没有标记。大多数实际案例都属于这一类。在实际案例中，标记大量数据是非常困难的，因为它耗时耗力，并且需要领域专家。另一方面，未标记数据的成本较低且易于获取。在监督学习的情况下，我们使用未标记数据作为训练数据并将其拟合函数以训练模型。然后，我们从该模型对未见数据生成预测。\n\
  \n`scikit-learn` 包包含一个标准的鸢花数据集作为测试集。因此，我们可以使用 Python 语句创建并显示该数据集：\n\n```\nfrom sklearn\
  \ import datasets\ni = datasets.load_iris()\nd = datasets.load_digits()\nprint(i.data)\n\
  print(d.data)\n```\n\n\n\n数据集是一个字典结构。整个数据集存储了数据以及一些关于数据的元数据。`Dataset` 以样本特征数组的形式数据存储在\
  \ `.data` 成员中。如之前的代码所示，`i.data` 包含鸢花（iris）数据集的数据成员，而 `d.data` 包含数字数据集的数据成员。\n\n\
  学习和预测是监督学习机器学习模型的核心目标。在 `scikit-learn` 中，用于分类的估计器基本上是一个实现了两个主要方法 `fit(predictor,\
  \ target_value)` 和 `predict(test_dataset)` 的 Python 对象。`fit()` 方法主要用于拟合估计器。估计器是根据单个观测数据计算某数量的规则。`predict()`\
  \ 方法则根据训练数据和未知测试数据执行预测工作。\n\n在 `scikit-learn` 中，估计器的一个很好的例子是 `sklearn.svm.SVC`，它实现了支持向量分类。\n\
  \n## 21.1.2 支持向量分类器\n\n支持向量机（SVM）是最流行的监督学习算法，适用于分类和回归任务。在这种方法论中，我们将数据点绘制到 n 维空间中。然后，我们的任务是找到一个能够有效方式分离不同类别的超平面（图\
  \ 21.1）。\n\nSVM 的工作原理根本上基于识别超平面。图 21.2 显示了超平面的选择机制。\n\n![Images](img/021x001.jpg)\n\
  \n**图 21.1**\n\n分类案例 2：(a) 分类类型 1 和 (b) 分类类型 2。\n\n![Images](img/021x002.jpg)\n\n\
  **图 21.2**\n\n分类案例 1：(a) 不同方向的超平面和 (b) 平行超平面。\n\n在图 21.2a 中，有三个超平面。我们需要决定选择哪一个平面。这里的经验法是选择能更好地分离两个不同类别的超平面。在图\
  \ 21.2a 中，平面 B 更好地隔离了这两个类别。在图 21.2b 的情况下，超平面 B 最合适，因为平面 B 到两个类别最近数据点的距离最大。\n\n在第二种情况下（图\
  \ 21.3a），我们看到一组中的一个数据点与该相同数据点组并不足够近；因此，可以认为有两个不同的平面。与 B 相比，超平面 A 有更高的边界。然而，我们应该选择平面\
  \ B，因为与超平面 A 相比，超平面 B 实现了更准确的分类。在图 21.3b 中，我们无法用直线区分不同类的两个数据点。在这种情况下，SVM 忽略离群值。\n\
  \n![Images](img/021x003.jpg)\n\n**图 21.3**\n\n分类案例 3：(a) x,y 平面；(b) x,z 平面。\n\n\
  在一种情况下，两个类别之间不存在直线超平面。虽然我们为所有情况创建了线性超平面，但在这种特殊情况下，超平面不是线性的。为了解决这个问题，必须实现 SVM 的一个新特征，支持一个额外的平面\
  \ z，其中 `z = x² + y²`。因此，数据图现在沿着 z 轴和 x 轴绘制。图 21.4a 和 b 显示了 z, x 平面上两个不同类别的分类。在图中，`z`\
  \ 始终为正值，因为它是 x 和 y 的平方和。SVM 有一种称为核技巧的机制，它会自动添加特征以获得新的线性超平面。\n\n![Images](img/021x004.jpg)\n\
  \n**图 21.4**\n\n三层 ANN 可视化。\n\n## 21.1.3 在 Python 中实现 SVM\n\nPython 在 `scikit-learn`\
  \ 包中内置了一个名为 `SVC` 的 SVM 分类器。使用 SVM 创建预测的步骤包括导入正确的库、创建对象、拟合有效模型以及最后预测值。\n\n```\n\
  from sklearn import svm\nmy_model = svm.svc(kernel='linear', c=1000, gamma=0.02)\n\
  my_model.fit(A,b) # 其中 A 是预测器，b 是训练集的目标，\n                  # a_test 是预测器的预测\nmy_model.score(A,b)\n\
  ```\n\n## 21.1.4 SVM 的优点与缺点\n\n- SVM 在点的分离上起作用。\n- 它对于高维空间非常有用。\n- 在决策函数中，它只使用部分内存。\n\
  - 当维度大于样本数量时，它的工作效果会更好。\n- 对于大型数据集，SVC 的性能会受到影响。\n- 对于目标类别存在严重问题的噪声数据集。\n\n### 21.1.5\
  \ 人工神经网络\n\n人工神经网络（ANN）是机器学习中一个非常重要的组件。它主要模拟人类神经元的操作。ANN 的主要组件包括输入层、隐藏层和输出层。ANN\
  \ 的标准图如图 21.5 所示。就像原子是神经网络（NN）的基础一样，感知机是所有神经网络的骨干。\n\n感知机可以被认为是任何接受多个数字输入并给出单个值输出的实体。图\
  \ 21.6 所示的结构接受三个输入并产生一个输出。\n\n感知机输入输出之间的定义关系是一个关键点。一种方法是对输入进行直接组合并求和，然后设置阈值为 0。如果超过了阈值，则输出为\
  \ 1；否则为 0。例如，假设 `a=1, b=1, c=0` 应该是超过阈值的 1，因此在这种情况下输出值必须为 1。\n\n\n\n在下一个案例中，我们在加权输入值之和的基础上添加了一个偏置（bias）值。感知元的偏置反映了感知器的灵活性。它在某种程度上类似于函数\
  \ `y = mx+c`。因此，我们只需要在方程 `w1 × x+w2 × y+w3 × z + 1 × b> threshold` 中添加一个偏置值。\n\n\
  ### 21.1.6 激活函数\n\n到目前，感知器仅使用线性函数。然而，感知器的非线性变换是一个主要问题。使用非线性变换的神经元基本上使用的是激活函数。\n\n\
  激活函数基本上将加权输入的和作为参数，并返回神经元本身。\n\n因此，激活函数可以写如下：\n\n$\\begin{array}{l} {\\text{y} =\
  \ \\text{F}\\left( {\\sum{\\text{w}_{\\text{i}} \\cdot \\text{X}_{i}}} \\right)}\
  \ \\\\ {\\text{i} = 0\\,\\text{to}\\,\\text{N}} \\end{array}$\n\n激活函数的主要目标是执行非线性变换以拟合非线性假设或估计复杂的非线性函数。在这种情况下使用了多种激活函数，其中一些是\
  \ ReLu 和 sigmoid。\n\n### 21.1.7 使用 Python API 实现 ANN\n\n我们可以使用 Python API 开发 ANN\
  \ 模型 [5]。在此背景下最流行的 API 之一是 Keras [6, 7]]。它基本上是高效神经网络库（如 TensorFlow 和 Theano）的封装。\n\
  \n实现神经网络涉及几个步骤：加载数据集、定义模型、编译模型、拟合模型，最后评估模型并将整个过程整合在一起。运行 ANN 的核心要求是安装 `numpy`、`scipy`\
  \ 和 `keras` 模块。所有模块都应该经过适当的配置。\n\n有一个法则：运行机器学习算法从随机过程开始，而这无非随机种子。这种技术对于重复运行相同的代码非常有效，因此将获得相同的结果，这对于具有相似随机性的结果进行分析和比较有用。\n\
  \n```\nfrom keras.models import Seq\nfrom keras.layers import Den\nimport numpy\
  \ as np\nnp.random.seed(7)\n```\n\n我们的第二个任务是加载数据集并将其分为两个不同的部分，即输入变量 `X` 和输出变量 `Y`。数据集可以是任何\
  \ `.csv` 格式或 XML 格式。\n\n```\ndataset = np.loadtxt(\"data_set.csv\", delimiter=\"\
  ,\")\nX = dataset[:,0:8]\nY = dataset[:,8]\n```\n\n然后，我们必须定义模型。Keras 中的模型由若干层组成。我们可以添加层直到拓扑结构满意。我们必须确保输入层有输入层。\n\
  \n```\nm = Sequential()\nm.add(Dense(10, activation='relu', input_dim=6)) \nm.add(Dense(8,\
  \ activation='relu'))\nm.add(Dense(1, activation='sigmoid'))\n```\n\n在这里，`Dense`\
  \ 类用于全连接。`input_dim` 参数指定特征的数量。`activation` 参数指定激活函数。`compile` 方法用于定义损失函数、优化器和指标。\n\
  \n```\nm.compile(loss='binary_crossentropy', optimizer='adam', metrics=['accuracy'])\n\
  ```\n\n`fit` 方法用于训练模型。使用了 `epochs` 和 `batch_size` 参数。\n\n```\nm.fit(X, Y, epochs=150,\
  \ batch_size=10)\n```\n\n`evaluate` 方法用于查看模型的性能。\n\n```\ns = m.evaluate(X, Y)\n\
  print(\"\\naccuracy: %.2f%%\"%s[1])\n```\n\n![Images](img/line.jpg)\n\n### 21.2\
  \ 深度学习工具\n\n深度学习是机器学习的一种特殊形式，在其中机器学习像人类一样学习自然行为 [8, 9, 10, 11]，例如火箭单元和无人驾驶汽车。它也是语音控制等语音设备的关键组件。深度学习系统从根本上基于深度神经网络。我们可以说一个非常简单的深度学习例子是预测分析。\n\
  \n#### 21.2.1 卷积神经网络和循环神经网络\n\n### 21.2.1.1 卷积神经网络\n\n如上一节（第 21.2 节）所述，卷积神经网络（CNN;\
  \ [12]）类似于带有权重和偏置的传统 ANN [13, 14, 15, 和 16]。\n\n\n\n\n普通的神经网络（NN）仅接收常规输入并将其通过隐藏层，该隐藏层由与前层全连接的神经元组成。在输出层，分类值由分类评分表示。普通的人工神经网络（ANN）从不缩放全幅图像，但卷积神经网络（CNN）的优势之一是它利用了神经网络的三维模型。这种架构使得它能够将图像作为输入并以更灵敏的方式进行处理。与普通的\
  \ ANN 不同，CNN 系统以高度、宽度和深度的形式接收图像数据。\n\n例如，CIFAR-10 中的输入图像是一个激活值卷，该激活卷的维度为 32 × 32\
  \ × 3（分别为宽度、高度和深度）。某层中的神经元只会连接到其前一层的一个小区域，而不是以全连接的方式连接到前层的所有神经元。然而，CIFAR-10 的最终输出层维度为\
  \ 1 × 1 × 10，这是因为在卷积网络（CNN）架构结束时，整个图像被还原为一个沿深度维度排列的单一类别评分向量。可视化结果所示图 21.6。\n\n![Images](img/021x007.jpg)\n\
  \n**图 21.7**\n\n一个 RNN。\n\n简单的卷积网络是一系列层。CNN 的每一层都使用可微函数将一个激活卷转换为另一个。构建卷积网络涉及三个主要层：卷积层、池化层和全连接层。一个处理\
  \ CIFAR-10 的示例序列，CNN 应该通过以下分层架构构建：\n\n*   INPUT（输入）：此层持有图像的输入像素值（32 × 32 × 3），具有三个颜色通道（RGB）。\n\
  *   CONV（卷积）：此层计算局部神经元的输出。在这里，每个神经元计算其权重之间的点积。\n*   RELU：此层是一个高效的逐元素激活函数。当它在 0 处阈值时，原始卷的大小将保持不变。\n\
  *   POOL（池化）：此层执行下采样操作。\n*   FC（全连接）：这是一个全连接层，主要是外层，将计算类别的评分。每个神经元都与其前层全连接。\n\n\
  ### 21.2.1.2 循环神经网络\n\n循环神经网络（RNN）是一种具有多样化应用的神经网络。它专门处理各种输入和输出类型。RNN 的重要用途之一是情感分类。因此，它经常用于将推文内容流分类为正面和负面情感。这种神经网络模型也用于语言翻译操作。\n\
  \n可以设定一个简单的示例，假设给出了单词“hello”和输入，只有前四个字母 h, e, l, l，而网络应该预测字母 o。这是 RNN 的实际用途之一。\n\
  \n递归公式的工作原理如下：假设一个模型想要预测字母 o，那么它将获取当前字母 l 和前一个字母（也是 l）；因此，对于某一时刻 t，可以通过以下递归公式获得新状态：\n\
  \n```\nH[t + 1] = f(H[t],ↆX[t] + 1])\n```\n\n其中 `H[t+1]` 是新状态，`H[t]` 是前一个状态，而 `X[t+1]`\
  \ 是当前输入。因此，如果我们为相同创建激活函数，它将写为\n\n```\nH[t] + 1] = tanhↆ(W[hh]H[t] + 1,] +ↆW[xh]\n\
  ```\n\n\n\n\n\n*   PyTorch 支持动态计算平台。当我们开始使用 PyTorch 框架时，它会构建计算图，且该图在运行时可以动态更改。\n\
  \n它具有支持多 GPU 的良好优点。由于该框架开发于 2016 年，数据科学家可能会利用这一点。使用 PyTorch 最适合在利用强大的 GPU 的情况下替代\
  \ NumPy。它还构建了一个提供最大速度和灵活性的深度学习研究平台。PyTorch 提供了一种运行在 GPU、CPU 或两者之上的张量（tensor）。有各种张量例程可以加速增强科学计算的张量例程。数学、线性代数、索引和切片的执行速度更快（见\
  \ 图 21.8]）。\n\n![Images](img/021x008.jpg)\n\n**图 21.8**\n\nPyTorch 执行环境。（来源：[pytorch.org](http://pytorch.org)。）\n\
  \n磁带记录方法（tape recorder approach）被用于创建和构建动态神经网络（NN）。PyTorch 的优点之一是它的反向自动微分，这允许网络以最小的延迟和开销改变其行为，这在\
  \ TensorFlow 和 Theano 中是无法实现的。PyTorch 深度集成到 Python 中。它可以像使用 NumPy、SciPy 和 scikit-learn\
  \ 一样自然地使用。PyTorch API 的设计思维是线性的且易用的。对于大型神经网络，PyTorch 运行速度非常快。系统还提高了内存效率。\n\n###\
  \ 21.2.4 PyTorch 安装\n\n要在 Windows 中安装 PyTorch API，我们可以使用开源安装程序 conda。要获取 conda 安装器，我们必须在系统中下载\
