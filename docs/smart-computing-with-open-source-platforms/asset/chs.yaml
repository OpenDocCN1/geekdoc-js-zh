  \ 2015-2017 年间印度计算机科学领域发表和引用量最高的学者之一。\n\n![Images](img/line1.jpg)\n\n## 引言\n\n![Images](img/line2.jpg)\n\
  \n![Images](img/line.jpg)\n\n### 智能计算方法论\n\n\n\n\n\n我们生活在一个智能设备时代，现实世界中的机器正变得越来越智能。在这个背景下，重大事件之一是智能手机、智能小设备以及物联网（IoT）设备的引入。因此，数据驱动的智能系统是智能系统（可能是如今的智能环境）的骨干。`Android`等智能操作系统的引入使得设计和部署智能应用变得高度灵活且多功能。此外，嵌入式硬件的丰富以及如`Arduino`和`Raspberry\
  \ Pi`等开源快速原型平台的出现，让智能系统开发者的生活变得更加轻松。在早期，实时智能系统是高度分类的，被用于任务关键型应用，例如导弹跟踪与发射、航天任务、无人机控制与监控以及军事用途的许多其他领域。目前，智能计算的应用无处不在，从数据科学、数据分析、预测和预报到智能城市和智能家用电器。基于物联网的服务与舒适度管理以及许多其他社会和商业应用领域确实是一项急需的技术增强实践。\n\
  \n![Images](img/line.jpg)\n\n## 智能计算平台\n\n对于智能计算平台而言，它可能是最具挑战性的平台，因为它接收输入问题、进行分析并做出决策，从而得出某种程度的解决方案。在这种背景下，可以考虑智能计算平台的多个智能侧面。因此，计算环境的主要重点是决策。计算平台可能是一个纯软件平台。有时，它是独立的硬件，但在大多数情况下，它是软件和硬件的结合，以协作的方式执行任务。\n\
  \n例如，以前当我们离开家去远旅行时，在出门之前，我们必须检查空调、冰箱以及所有其他家用电器是否已正确关闭。如果我们没有仔细检查，电器极可能会损坏，并且在月底会产生一笔巨额的电单。如今，随着智能计算和物联网环境的引入，这个问题有了简单的解决方案。因为所有的家用电器都连接到一个中央网关。系统会监控房间内的活动。如果发现房间内没有活动，它将立即向用户发送警报信息，并同时关闭家用电器。在另一种场景下，由于电力分布不均且缺乏需求侧负载预测机制，以前防止特定区域的限电是非常具有挑战性的。但现在，得益于智能负载预测和预报，机器学习算法使得预测未来的电力需求变得容易得多。\n\
  \n从微级小型嵌入式设备到低端微机、高端图形处理器（`GPU`）和张量处理单元（`TPU`）（来源：[`developers.googleblog.com/2018/07/new-any-edge-tpu-boards.html`](https://developers.googleblog.com/2018/07/new-any-edge-tpu-boards.html)）以及当然还有云服务，应该是智能和智能计算生态系统中最流行的平台。某些开源平台在设计、构建和构造智能应用方面具有巨大的优势。一个名为`GPUOpen`的倡议提供了免费的视觉效果、生产力工具以及各种其他内容的全面集合。这里的代码易于分享和下载。`MIAOW\
  \ GPU`是威斯康星大学麦迪逊分校开发的另一项研究成果。GPU 的根本目标是通过免费开源的代码包获得高性能计算。\n\n开放计算语言（`OpenCL`）是另一种免费且跨平台的计算环境。该环境基于智能手机、个人电脑、服务器和其他手持设备中各种处理器的并行编程构建的。`OpenCL`显著提升了图像处理、计算机视觉和游戏应用的性能。\n\
  \nKhronos 集团宣布发布了`Vulkan 1.1`，这是`OpenGL`平台的新伴侣，以及`SPIR-V 1.3`的规范。1.1 版本通过大量开发者请求的功能（如子组操作）扩展了`Vulkan`的核心功能，同时整合了来自`Vulkan\
  \ 1.0`的广泛已验证扩展。Khronos 还将把完整的`Vulkan 1.1`一致性测试开源，AMD、Arm、Imagination、Intel 公司、NVIDIA\
  \ 和高通已经实现了兼容的`Vulkan 1.1`驱动。\n\n![Images](img/line.jpg)\n\n## 嵌入式系统与机器人的智能计算\n\n\
  嵌入式计算和自动化机器人可能是伴随智能计算的最新兴技术。大多数复杂的嵌入式平台使用某种程度的智能处理方法，例如先进医疗系统、疾病检测与预测系统以及建筑结构中的故障检测。现代\
  \ 3D X 射线和 MRI 需要大量的智能信号处理算法。智能嵌入式系统在汽车制造领域还有广泛应用，在汽车中放置了嵌入式智能标签，可以监控组件健康、发动机和座舱温度，并收集和记录发动机振动，用于进一步诊断不仅是当前汽车，而且未来制造的汽车的故障。\n\
  \n在机器人领域，可以实现大量的智能应用，例如物体和障碍物检测与规避、飞行器的精确起降，以及无人机机系统和导弹系统的自主导航。在医学领域，机器人手术非常流行，这是智能机器人系统的相关示例。在航天任务中，宇航员使用机器人设备在零重力区精确移动设备。另一个智能机器人系统的大例子是社交机器人。在这个背景下，流行的机器人之一是`Sophia`。`Sophia`的智能计算算法设计使得它们能够跟随脸部、保持眼神交流并识别个人。机器人复杂的神经网络可以处理语音。它是基于名为`ELIZA`的聊天机器人的哲学开发的。\n\
  \n![Images](img/line.jpg)\n\n### 本书的目标\n\n本书主要强调智能计算方法论的理论应用及其使用的工具。它讨论了计算设备和服务的的设计、编码、实现以及部署场景。针对与智能系统开发相关的软件和应用程序接口（`API`）进行了详细讨论。\n\
  \n\n\n\n本书的主要动力是在边学边做。交互式特性是本书的核心特征。书中讨论了各种智能 API，用于在嵌入式系统和人工智能领域开发智能型应用。此外，本书还为学习\
  \ `Python`、`Arduino` 和 `Processing` 等编程语言提供了全面的指南。仅通过这本书，开源开发的力量就得到了提升。\n\n![Images](img/line.jpg)\n\
  \n## 如何使用本书\n\n本书是一本关于开源硬件和软件概念的入门指南。与基于理论的学习方法不同，本书主要侧重于基于实现的交互式学习。由于本书的核心关注点是\
  \ `Python` 和 `Arduino`，因此对于那些希望以更简单、并行的方式学习 `Python` 和 `Arduino` 以开发基于物联网的项目以及机器学习的硬件实现的人来说，它将非常有帮助。书中讨论的内容在学习后必须经过实现，才能获得技术的精髓。\n\
  \n本书的结构如下：第 1 章、第 2 章、第 3 章、第 4 章、第 5 章、第 6 章以及第 7 章 详细介绍了 Arduino 编程环境和语言。第 8 章\
  \ 讨论了处理语言的基础实现，用于开发基于 Arduino 的智能应用。第 9 章 涵盖了各种基础 Arduino 项目。第 10 章、第 11 章、第 12\
  \ 章、第 13 章、第 14 章、第 15 章、第 16 章、第 17 章以及第 18 章 以交互的方式描述了 `Python` 语言的核心概念。第 19 章\
  \ 涉及 `Python` 中的图形用户界面实现。第 20 章和第 21 章 描述了与智能框架相关的 API。这些章节还讨论了基础和高级的机器学习及深度学习 API。\n\
  \n## 1\n\n![Images](img/line.jpg)\n\n## 开源硬件简介](#ch00_fm04_toc.xhtml_rchapter1)\n\
  \n![Images](img/line2.jpg)\n\n![Images](img/line.jpg)\n\n### 1.1 开源硬件概念](#ch00_fm04_toc.xhtml_rsec1_1)\n\
  \n“开源硬件” [[1]](#ch01.xhtml_ref1_1) 这个术语在今天非常常见。开源硬件，也称为开放硬件，基本上被概念化为某些设计信息构建的电子硬件或计算机组件，这些组件可以在不受严格版权法限制的情况下进行版权保护和许可\
  \ [[2]](#ch01.xhtml_ref1_2)。原理图、使用的组件、文档和逻辑设计都是开源硬件设计的组成部分。与开源软件一样，开源硬件可能提供用于硬件设计的源代码；在这种情况下，源代码是蓝图或设计文件，该文件有时可能是计算机辅助设计\
  \ (`CAD) 文件。\n\n开源硬件的许可涉及设计和文档的重新分发、修改以及任何修改内容的发布。它也从不阻止他人赠送或出售项目及其文档。开源硬件和软件设计也受版权法约束，但硬件使用了一些有助于其重新分发和公开的法律\
  \ [[3]](#ch01.xhtml_ref1_3)。免费许可是开源硬件最常见的特征。最常见的许可之一是知识共享署名许可协议（Creative Common\
  \ Attribution License）。开源硬件必须连同设计文件和源代码一起进行记录。此外，许可机构必须允许修改或更改设计文件并重新分发它们，以便任何人都能访问修改后的设计文件。开源硬件的根本目标是尽可能容易地制作、混合该对象并复制它。然而，闭源硬件使用严格的版权法和专利法，这使得这些对象的生产非常困难。\n\
  \n![Images](img/line.jpg)\n\n### 1.2 Arduino 生态系统及其类型](#ch00_fm04_toc.xhtml_rsec1_2)\n\
  \n欢迎来到 Arduino 世界。在我们思考 Arduino 如何工作之前，让我们先考虑一些实际场景。假设你正坐在办公室里，突然想起你忘记关闭家里的空调了。由于家离办公室很远，需要很长时间才能到达。在这种情况下，显然你会考虑一种可以从你所在地关闭空调的系统或服务。如果你能自己设计该服务或设备，而不需要花费大量资金从第三方供应商处购买，那也是一个很酷的主意。因此，考虑到此类需求，Arduino\
  \ 等设备的概念就运而生了。Arduino 的设计旨在让任何具有最小电子工程知识和编程技能的人都能处理它。Arduino 的基础生态系统由硬件和软件套件组成。硬件是运行引导程序和固件的底层。在大多数情况下，固件与第二层的第三方库相关联。第三层存在通信协议。该层的主要工作是连接其他设备。通信可以是无线的或有线的。对于有线通信，我们需要在层中添加额外的通信设备和相应的库。\n\
  \n### 1.3 Arduino 硬件特性](#ch00_fm04_toc.xhtml_rsec1_3)\n\n根据易用性，Arduino 板板可以分为若干类型\
  \ [[4]](#ch01.xhtml_ref1_4)。分类是基于微控制器版本以及输入输出引脚数量、微控制器类型、中央处理器时钟频率、USB 和通用异步收发器\
  \ (`UART`) 接口的数量和类型、电可擦除可编程只读存储器 (`EEPROM`)、静态随机存储器 (`SRAM`) 以及闪存的大小。市场上有多种类型的 Arduino。最流行的\
  \ Arduino 板板是 Arduino UNO。图 1.2 展示了不同的 版本。不同类型 Arduino 板板的对比研究列在表 1.1](#ch01.xhtml_tab1_1)\
  \ 中。\n\n![Images](img/line.jpg)\n\n### 1.4 Arduino 软件特性](#ch00_fm04_toc.xhtml_rsec1_4)\n\
  \nArduino 软件包是一个工具集，主要包含集成开发环境 (`IDE`) 和许多标准库。由 Java 开发的 IDE 需要 Java 来运行整个过程。Java\
  \ 运行时环境默认随套件提供。\n\n软件的主要组件如下：\n\n\n\n\n\n![Images](img/001x002.jpg)\n\n**图 1.2**\n\
  \n不同类型的 Arduino 板板。\n\n![Images](img/Table_1.1.jpg)\n\n**表 1.1**\n\n不同 Arduino 版本的比较\n\
  \n*   IDE\n*   核心 API\n*   核心库\n*   Sketches（程序）\n*   各种板载的驱动支持\n\n在 `IDE` 中编写的\
  \ Arduino 代码被称为 sketch [[5]](#ch01.xhtml_ref1_5)。sketch 文件最初的扩展名为 `.pde`，这是 Arduino\
  \ 和 Processing 共同的扩展名。后来，在 Arduino 的新版本中，扩展名已相应更改；现在 `.ino` 和 `.pde` 都是支持的扩展名。附带的（通信端口）`COM`/Serial`\
  \ 端口显示在 Arduino `IDE` 的底部状态栏中。它还包含了代码行号。Arduino `IDE`——偏好面板——是高效配置 Arduino 环境的好工具。在这里，我们不仅可以更改首选语言（推荐使用系统默认）和字体大小，还可以配置编译和上传代码时的详细输出。更多的额外偏好可以设置在一个名为\
  \ `preference.txt` 的文件中。\n\n每当我们开始在 Arduino 中编写任何 sketch 时，环境本身提供了对某些核心库的访问。它不需要添加外部库。例如，可以通过隐式可用的库\
  \ `Arduino.h` 直接访问 `Serial` 对象。因为 `Arduino.h` 是默认库且是隐式附加的。只有当我们想要创建一个新的库文件时，才能直接编写代码。在这种情况下，我们需要显式地添加\
  \ `Arduino.h`。所有的库实际上都是用 C++ 编写的。\n\n还整合了一些 API 更新。`pinMode` 已经更新以支持 `INPUT_PULLUP`，以便为默认为高电平的按钮和开关添加特定的纯拉拉支持。因此，与其编写\
  \ `pinMode(5,INPUT)`，我们现在可以写成 `pinMode(5,INPUT_PULLUP)`。这对于设置默认值是有益的。通用整数或 `uint_8`（跨平台应用开发的标准\
  \ 8 位整数）现在被大多数函数支持。\n\nArduino 核心 API 从根本上构建在 `Arduino.h` 头文件之上。如果你正在开发库，有必要了解已经包含在\
  \ `Arduino.h` 中的库，以避免重复包含。Arduino 的各种头文件列如下：\n\n```cpp\n #include <avr/interrupt.h>\n\
  #include <avr/pgmspace.h>\n#include <avr/io.h>\n#include <math.h>\n\n#include <stdlib.h>\n\
  #include <string.h>\n#include \"binary.h\"\n\n#include \"WCharacter.h\"\n#include\
  \ \"pins_arduin.h\"\n#include \"HardwareSerial.h\"\n#include \"WString.h\"\n```\n\
  \nArduino 的主程序是 `main.cpp`。该文件始终包含 `Arduino.h.`，它调用了 `void setup()` 和 `void loop()`\
  \ 函数。\n\n`main.cpp` 的默认实现所示：\n\n```cpp\n #include <Arduino.h>\nint main(void){\n\
  \n  init();\n#if defined(USBCON)\n             USBDevice.attach();\n#endif\n  setup();\n\
  \n  for(;;)\n{\n  loop();\n if(SerialEventRun) SerialEventRun();\n}\nreturn 0;\n\
  }\n```\n\n在 Arduino 软件的新版本中，创建了一个新的 `Printable` 类，并修改了 `Print` 类。这将直接影响 `Stream`\
  \ 和 `Client` 类。`Print` 类中增加了新函数以提供更多功能。得益于更新的字符串库，在闪存中存储字符串要简单得多。我们也可以使用 `F()` 命令来实现这一点。\n\
  \n![Images](img/line.jpg)\n\n### 1.5 如何设置\n\n要设置 Arduino，第一步是从互联网下载包并安装它。在 Arduino\
  \ 网站 ([`www.arduino.cc/`](https://www.arduino.cc)) 上，提供以下版本：\n\n*   32 位 Windows\n\
  *   32 位和 64 位 Linux\n*   MAC OSX\n*   Linux ARM 版本\n\n我们可以下载 Windows 的安装程序或 `.zip`\
  \ 文件，以及 Linux 的 `tar.xz` 格式文件。对于 Windows 安装，你必须安装像 `Arduino` 这样的驱动文件。如果你先安装 Arduino\
  \ `IDE` 然后再连接 Arduino 板，由于驱动问题，它将永远无法检测到。因此，在将 Arduino 板连接到 Arduino `IDE` 之前，必须安装驱动程序。\n\
  \n为了这样做，我们需要遵循以下步骤（图 1.3）。\n\n我们首先将 Arduino 板连接到电脑并进入电脑的设备管理器。当它检测到 Arduino 时，会立即显示带有问题的\
  \ `USB` 端口（图 1.4）。\n\n右键点击 `USB` 端口。它会立即显示更新驱动程序的选项。如果你点击它，将打开驱动管理窗口（图 1.5）。\n\n\
  在驱动管理窗口中，选择“浏览我的电脑以查找驱动程序”，这将打开驱动路径对话框。然后，选择 Arduino 软件包中的驱动位置并点击下一步。现在它将显示更新驱动程序（带有某些强制升级选项，只需点击是）。在驱动安装后，`USB`\
  \ 端口将显示 `COM` 端口。\n\n![Images](img/001x003.jpg)\n\n**图 1.3**\n\nWindows 设备管理器。\n\
  \n![Images](img/001x004.jpg)\n\n**图 1.4**\n\n设备驱动安装。\n\n![Images](img/001x005.jpg)\n\
  \n**图 1.5**\n\n驱动程序浏览器。\n\n![Images](img/001x006.jpg)\n\n**图 1.6**\n\n设备驱动的安装。\n\
  \n对于 Linux，通常情况下，它会自动检测 `/dev/ttyACM` 端口或 `/dev/ttyUSB` 端口。这是 Linux 环境中默认可用的 `USB`\
  \ 端口（图 1.6）。\n\n安装驱动程序后，我们可以编写代码并将程序上传到板上。在第一次连接期间，系统现在已准备好进行交互。\n\n![Images](img/line.jpg)\n\
  \n### 1.6 Arduino 环境\n\nArduino DUE 是一种特殊类型的微控制器板。该板使用的处理器是基于高级 RISC 的 Atmel SAMX8E\
  \ ARM Cortex-M3。\n\n该 板可能是第一个使用 32 位 ARM CPU 的 Arduino。为了运行 Arduino DUE，我们应该使用 Arduino\
  \ `IDE` 或网页编辑器。将此板连接到电脑，我们应该使用靠近 9V 电源接口的 `USB` 端口。连接板到电脑后，我们应该打开 `IDE`。通常，`IDE`\
  \ 最初不会在板类型菜单中显示 Arduino DUE。因此，我们需要在板上安装库。为此，我们需要打开板管理器并安装 Arduino SAM Board Essentials，以便\
  \ `IDE` 开始支持基于 ARM 的 Arduino，如 Arduino DUE。安装 Arduino DUE 的库和工具需要几分钟。安装完成后，`IDE`\
  \ 现在准备好运行 DUE 板。\n\n![Images](img/001x007.jpg)\n\n**图 1.7**\n\n通过板管理器安装 Arduino\
  \ DUE。\n\n\n\n\n\n1. 1. Acosta, Roberto. “开源硬件。” *博士论文*，马萨诸塞理工学院，剑桥，马州，2009 年。\n\
  2. 2. Bonvoisin, Jeremy, Robert Mies, Jean-Francois Boujut 和 Rainer Stark. 开源硬件的“源”是什么？获取自\
  \ [`openhardware.metajnl.com/articles/10.5334/joh.7/`](https://openhardware.metajnl.com),\
  \ 2017。\n3. 3. Viseur, Robert. 从开源软件到开源硬件。获取自 [`link.springer.com/chapter/10.1007/978-3-642-33442-9_23`](https://link.springer.com),\
  \ 2012。\n4. 4. Dey, Nilanjan 和 Amartya Mukherjee. *基于开源工具的嵌入式系统与机器人*。CRC Press，佛罗里达州\
  \ Boca Raton，2016。\n5. 5. Badamasi, Yusuf A. “Arduino 的工作原理。” 载于 *电子、计算机与计算（ICECCO），2014\
  \ 年第 11 届国际会议*，第 1–4 页。IEEE，2014 年。\n\n## 2\n\n![Images](img/line.jpg)\n\n## Arduino\
  \ 硬件](#ch00_fm04_toc.xhtml_rchapter2)\n\n![Images](img/line2.jpg)\n\nArduino 以其开源特性而闻名。Arduino\
  \ 开发板主要包含微控制器和一个输入/输出系统。市场上上有多种版本的 Arduino。通常，最流行的 Arduino 版本是 `Arduino UNO` 和 `Arduino\
  \ Mega`。其他版本如 `Arduino Nano`（2.X 版本和 3 版本）、`Arduino MINI v.04` 和 `Lilypad Arduino`\
  \ 在市场上也非常受欢迎。一些最新的可用型号包括 `Arduino Leonardo` 和 `Arduino Duo`。\n\n这种基于单片机的计算设备是各级学校大学学生、研究人员和爱好者的最佳选择。通过\
  \ Arduino 可以以最简单的方式完成接口电路、开关、电机控制以及各种输出设备。`Arduino UNO` 是一种基于 8 位微控制器系统的板，该控制器名为\
  \ `ATmega328`，工作电压为 5V [[1]](#ch02.xhtml_ref2_1)。微控制器本身具有 2 kB 的随机访问存储器和 32 kB 的内部闪存器。\n\
  \n![Images](img/line.jpg)\n\n### 2.1 系统架构](#ch00_fm04_toc.xhtml_rsec2_1)\n\n`Arduino\
  \ UNO` 的打印电路板 (PCB) 设计 [[2]](#ch02.xhtml_ref2_2) 使用表面贴装元件 (SMD) [[3]](#ch02.xhtml_ref2_3)。每个集成电路均采用标准封装。。大部分部件是通用的并具有不同的功能。例如，`SOT223`\
  \ 组件由晶体管或电压调节器组成。以下列表描述了 Arduino 硬件的基础组件：\n\n![Images](img/C002_UNTBL_1.jpg)\n\n\
  由于 `Arduino UNO` 可以通过 USB 编程，且由于微控制器不支持 USB 收发器，因此硬件需要在串口接口 [通用异步收发传输器 (UART)] 与微控制器数据线之间建立桥接，以便成功上传数据。`ATmega16U2`\
  \ 就是一个具有 USB 收发器和 `UART` 接口的桥器。\n\n![Images](img/line.jpg)\n\n### 2.2 微控制器](#ch00_fm04_toc.xhtml_rsec2_2)\n\
  \n由 Alf 和 Vegard 设计 RISC (AVR) 处理器微控制器是 Arduino 的大脑。这是一种支持减少指令集 (RISC) 架构的 8 位微控制器。微控制器的独特性和多功能性使其与\
  \ 8051 等其他控制器区分开来 [[4]](#ch02.xhtml_ref2_4)。哈佛架构的一个标准特性实际上包含在该系统中，该系统由独立的代码和程序内存组成，这优于程序和数据存储在单一公共内存中的冯·诺依曼架构。AVR\
  \ 系列微控制器首次引入了用于存储程序的外部闪存器。除了 EPROM 和 EEPROM（电可擦除可编程读存储器）之外，闪存的优势在于我们可以多次地从闪存器中存储和擦除数据。大多数\
  \ AVR 控制器的 EEPROM 容量极小。CPU 核心如图 2.1](#ch02.xhtml_fig2_1) 所示。\n\n内部，它包含一个 AVR CPU\
  \ [[5]](#ch02.xhtml_ref2_5)、定时器、串口接口和模拟/数字转换器。RISC 机器支持 131 条指令和 32 个 8 位通用寄存器。支持的时钟频率为\
  \ 20 MHz，每秒百万指令 (MIPS) 率为 20 MIPS。所有外设都由控制寄存器控制。它们还配置控制寄存器的功能。可用多种 AVR 微控制器。AVR\
  \ 控制器的设计师必须为特定的微控制器选择合适的部件，这在不同类别之间可能不同。\n\n`ATmega328p` 是一种 8 位 AVR 系列微控制器。这意味着它将具有\
  \ 8 位数据线，且内部寄存器可以并行处理 8 位数据。闪存器的大小为 32 kB，用于存储应用程序。由于其本质是非易失性的，即使拔掉微控制器，应用程序依然存在。`ATmega`\
  \ 具有 2 kB 的 SRAM，可以存储运行时应用程序使用的变量。它还有 1 kB 的 EEPROM，用于永久存储数据。AVR 微控制器的框图如图 2.2](#ch02.xhtml_fig2_2)\
  \ 所示。\n\n该封装为 DIP-28 配置，包含 28 个工作引脚，包括电源和输入/输出引脚。大多数引脚是多功能的，其优势是可以根据配置将同一引脚用于不同用途，从而不可避免地减少设备的引脚数量。另一个流行的封装是\
  \ TQFP-32SMD，这是一种具有 32 个引脚的表面贴装封装。\n\n![Images](img/002x001.jpg)\n\n**图 2.1**\n\n\
  AVR CPU 核心。\n\n流行的 microcontroller `ATmega324` 的常见特性描述如下：\n\n系统中带有片上程序，通常称为引导加载程序\
  \ (bootloader)。有一个 8 位定时器/计数器用于比较和分频。此外还有两个 16 位定时器/计数器用于分频、比较和捕获模式。它包含一个 16 位分辨率的\
  \ 8 位脉宽调制 (PWM) 通道。它具有 11 位分辨率的高速 PWM 通道。12 通道 10 位模拟数字转换器 (ADC)。设备的 `USART` 具有发送/清除发送\
  \ (RTS/CTS) 握手功能。片上可用主/从外设接口 (SPI)。提供了兼容 Philips 的双线 I²C 接口。它还包含一个可编程看门定时器、模拟比较器和片上温度传感器。\n\
  \n![Images](img/002x002.jpg)\n\n**图 2.2**\n\nAVR 微控制器内部架构。\n\n\n\n\n\nMCU 在 `PORTC`\
  \ 引脚 0–5 上具有一个六通道 ADC [[7]](#ch02.xhtml_ref2_7)。A/D 转换器具有 10 位分辨率，这意味着使用十种不同的信号电平来表示数字数据。这些引脚直接连接到\
  \ Arduino 模拟输入排针上。模拟输入并不是微控制器的专用引脚。然而，它们可以作为数字 I/O 或数模转换器使用。\n\n## 2.2.4 Arduino\
  \ 中的外设(#ch00_fm04_toc.xhtml_rsec2_2_4)\n\n`UART` 是一种串口接口，对于异步数据传输非常有用。UNO 只有一个 `UART`\
  \ 接口 [[8]](#ch02.xhtml_ref2_8)。\n\n`SPI` 是另一个进行串行传输的接口。`ATmega328` 拥有一个 `SPI` 模块。Arduino\
  \ UNO 板上位于 MCU 旁排针上或数字排针上的 `SPI` 引脚被标记为 `MOSI`（引脚 11，主出从入）、`MISO`（引脚 12，主入从出）和 `SCK`（引脚\
  \ 13，串口时钟）。`MOSI` 是向从设备外设发送数据的输出输出线，而 `MISO` 是向主设备发送数据的从线。`SCK` 用于产生时钟脉冲，以同步由主设备产生的数据传输。\n\
  \n为了实现 `SPI` 设备的最大速度，应该更改 `SPI` 库中 `SPI` 设置的第一个参数。\n\n`I2C` 或双线接口是 Arduino 中的另一种通信介质，其中包含两根线：串行数据\
  \ (`SDA`) 和串行时钟 (`SCL`)。Arduino 数字排针的最后两个引脚以及模拟排针的引脚 4 和 5 可以作为 `I2C` 通信线\n\n在早期的\
  \ Arduino 模型中有一个额外的 `USB` 接口芯片，这在 Arduino Leonardo 中是不提供的。由于 Leonardo、Esplora 和\
  \ micro 使用 `ATmega32U4`，因此不需要额外的 `USB` 接口，因为它内置了 `USB` 接口。带有 `USB` 的旧型号使用了未来科技设备国际\
  \ (`FTDI`) 芯片，如 `FT232RL`。在这种情况下没有 `USB` 的板子是通过外部编程器接口进行编程的。\n\n## 2.2.5 详细板级配置(#ch00_fm04_toc.xhtml_rsec2_2_5)\n\
  \n之前讨论的微控制器是 `ATmega328-PU`。Arduino 中使用的排针是 `IOL` 和 `IOH` 排针。它们从引脚 0 到引脚 13，包括地、参考\
  \ (`AREF`)、`SDA` 和 `SCL`。来自 `USB` 的 `RX` 和 `TX` 引脚连接到 Arduino 的 0 和 1 引脚。16-MHz\
  \ 陶瓷振器通过 `XTAL1` 和 `XTAL2` 端连接到 MCU。提供了一个复位引脚以防止在噪声环境中意外复位。该引脚与一个 10 K 上拉电阻连接。引脚本身具有内部上拉电阻；然而\
  \ AVR 硬件设计范表明，对于噪声环境，内部上拉电阻是不够的，会导致设备意外复位。复位指令可能来自用户端（通过按钮）或通过 `USB` 桥接。对于高压编程、电气短路或静电\
  \ (`ESD`) 保护，Arduino 未提供保护，但建议从 `V[cc]` 到 `RESET` 添加一个 `ESD` 保护二极管。两个 100 nF 电容连接在电源上以过滤噪声电源。这些电容具有自然特性，即电容的阻抗随频率\
  \ `X[C] = 1/2πfC` 减小。\n\n![Images](img/line.jpg)\n\n## 2.3 Arduino 中断(#ch00_fm04_toc.xhtml_rsec2_3)\n\
  \n中断是一种向处理器发送消息的过程，用于立即停止当前操作并处理高优先级进程。可以使用中断处理程序强制产生中断以启动新函数（服务）。中断处理程序是一组指令或可以在中断发生点调用的函数。当函数结束时，处理器再次以正常方式开始运行。\n\
  \n中断可以从多个源产生，例如来自 Arduino 定器的中断、由于某个外部引脚状态变化而产生的外部中断（如果一组引脚的状态发生变化，也会发生中断）。\n\n\
  Arduino 有三个中断定时器：`Timer0`、`Timer1` 和 `Timer2`。`Timer0` 已经配置为产生毫秒中断，以更新 `millis()`\
  \ 函数报告的毫秒计数器。\n\n定时器基本上是简单的计数器，以从 16-MHz 系统时钟派生的频率进行计数。时钟是可重新配置的，人们可以在不同的计数模式下更改频率。`Timer0`\
  \ 是一个 8 位定时器，从 0 计数到 255，每当溢出时就会产生中断。它默认使用 64 的分频器，为我们提供 976.5625 Hz 的中断频率（对于我们的目的来说，足够接近\
  \ 1 kHz）。我们不会动 `Timer0` 的频率，因为那会破坏 `millis()`。\n\n### 2.3.1 比较寄存器(#ch00_fm04_toc.xhtml_rsec2_3_1)\n\
  \nArduino 定时器有许多配置寄存器。可以在 Arduino 集成开发环境 (`IDE`) 中读取或写入这些特殊符号，来设置 `Timer0` 的比较寄存器（如\
  \ `OCR0A`），当计数器与比较寄存器相等时产生中断。\n\n![Images](img/line.jpg)\n\n## 2.4 外设设备接口(#ch00_fm04_toc.xhtml_rsec2_4)\n\
  \n有多种设备可以与 Arduino 接口。键盘和触摸屏等输入设备是可以直接接收人类输入的设备。其他如数字和模拟传感器也可以作为输入设备接口。\n\n`UART`\
  \ 是一种串口接口，广泛用于外设接口。`ATmega328` 只有一个 `UART` 模块。`UART` 的引脚 (`RX`, `TX`) 通常连接到 `USB`转`UART`\
  \ 转换电路。它也连接到数字排针的引脚 0 和 1。如果已通过 `USB` 传输数据，通常可以避免使用 `UART`。\n\n为了连接键盘，我们使用矩阵键盘。`Keypad`\
  \ 库从 v3.0 开始支持多键按下。`keypad` 库基本上基于硬件抽象库。该库基本上是 Arduino `API` 的封装，以增强代码的可读性。库的关键部分之一是\
  \ `Button`，该模块主要用于按钮控制和接口。有很多与之相关的函数和对象。`Button button = Button(12,PULLUP);` 创建了一个对应于引脚\
  \ 12 带有上拉配置的按钮对象。\n\n`Void pullup()` 将按钮模式改为上拉，`Void pulldown()` 将按钮模式改为下拉。\n\n\
  `boolean isPressed()` 检查按钮是否被按下，如果是则返回真。`boolean wasPressed()` 检查按钮在上一次调用 `isPressed()`\
  \ 时是否被按下，如果是则返回真。\n\n`boolean stateChanged()` 检查按钮状态是否发生了变化，例如从按下到释放或从释放到按下。如果自上次调用\
  \ `isPressed()` 以来状态发生了变化，则返回真。\n\n`boolean uniquePress()` 检查按钮状态是否变化且按钮被按下。这只会在按钮第一次被按下时返回真（与\
  \ `isPressed()` 不同，只要按钮被按下，它就会返回真）。\n\n### 2.4.1 Arduino TFT 接口(#ch00_fm04_toc.xhtml_rsec2_4_1)\n\
  \nArduino 中的薄膜晶体 (`TFT`) 接口包含了 `TFT` 库。这有助于 Arduino 以高效的方式接口 `TFT` 屏幕。它简化了在屏幕上表示不同形状、线条、图像和文本的图形系统过程。\n\
  \n\n\n\n`Arduino TFT` 库扩展了 `Adafruit GFX` 的属性，而 `Adafruit ST7735` 是主要的构建模块。图形 (`GFX`)\
  \ 库仅专门负责执行绘图任务，而 `ST7735` 库则专门用于 `Arduino TFT` 上的屏幕。`Arduino` 特有的扩展设计得尽可能与 `processing`\
  \ API 相似。\n\n板载的屏幕有时可能有一个 SD 卡槽，可以通过 `SD` 库进行使用。\n\n`TFT` 库同样依赖 `SPI` 库与屏幕以及 SD\
  \ 卡进行通信，并且需要在所有的程序（sketches）中包含。\n\n### 2.4.2 使用库\n\n屏幕有两种不同的配置使用方法。一种是使用 Arduino\
  \ 的硬件 `SPI`。另一种方法是手动逐一声明引脚。这两种方法在屏幕功能上没有区别，但使用硬件 `SPI` 方法的速度要快得多。\n\n如果有人计划使用 `TFT`\
  \ 模块上的 SD 卡，他们需要硬件 `SPI`。整个示例库都是为硬件 `SPI` 使用而编写的。\n\n如果在 `Uno` 上使用硬件 `SPI`，你只需要声明\
  \ `CS`、`DC` 和 `RESET` 引脚，因为 `MOSI`（引脚 11）和串行时钟 (`SCLK`)（引脚 13）已经定义过了。\n\n```\n #define\
  \ CS   10\n#define DC   9\n#define RESET  8\n\nTFT myScreen = TFT(CS, DC, RESET);\n\
  ```\n\n要在 `Leonardo` 上使用硬件 `SPI`，你按照如下声明引脚：\n\n```\n #define CS   7\n#define DC\
  \   0\n#define RESET  1\n\nTFT myScreen = TFT(CS, DC, RESET);\n```\n\n不使用硬件 `SPI`\
  \ 时，你可以使用任何可用引脚，但 `CD`、`DC` 和 `RESET` 之外，你必须声明 `MOSI` 和 `SCLK` 引脚。\n\n```\n #define\
  \ SCLK 4\n#define MOSI 5\n#define CS   6\n#define DC   7\n#define RESET 8\n\nTFT\
  \ myScreen = TFT(CS, DC, MOSI, SCLK, RESET);\n```\n\n### 2.4.3 使用 Arduino Esplora\
  \ 和 TFT 库\n\n`Arduino Esplora` 是 `Arduino` 项目的一个全新新增。它内置了许多传感器和功能。它的价格约为 54 美元，看起来像一个视频游戏控制器，但实际上远于此。它具有通过模拟多路复用器运行的温度、光和声音传感器。它还有一个三轴加速度计。这基本上基于\
  \ `Arduino Leonardo`。\n\n`Arduino Esplora` 有一个专为 `TFT` 设计的接口，用于屏幕的引脚是固定的。当针对该板编写程序时，会创建一个仅\
  \ `Esplora` 对象。你可以通过 `EsploraTFT` 引用连接到 `Esplora` 的屏幕。\n\n### 2.4.4 与 Processing\
  \ 的相似之处\n\n`Processing` 是一个设计师、艺术家和学生使用的开源软件环境。Processing 的主要输出是计算机或浏览器上的图形窗口。`Arduino\
  \ TFT` 库在屏幕上绘制原始图形和文本的调用尽可能“类 Processing 化”的，以确保两个环境之间的平滑过渡。\n\n![Images](img/line.jpg)\n\
