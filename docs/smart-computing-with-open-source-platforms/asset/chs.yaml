  \ Embedded and Communication Systems (ICIIECS), 2015 International Conference on*,\
  \ pp. 1–3. IEEE.\n4. Orr, Genevieve. “Computational thinking through programming\
  \ and algorithmic art.” In *SIGGRAPH 2009: Talks*, p. 31. ACM, 2009.\n\n## 15 结构的实现\n\
  \n数据结构主要强调作为数据存储和数据检索的基础数据组织。它以系统形式定义了数据元素在系统形式中的有效存储机制。在编程语言中，数据结构可以通过其固有属性实现，也可以通过使用第三方\
  \ API 实现。数据结构可以根据易用性进行分类。在 C 和其他语言中，处理的基础数据结构是 `array`。我们也可以从 `array` 推导出各种其他数据结构。某些数据结构可以使用动态内存分配来实现。在\
  \ Python 中，已经预定义了一些高效的数据结构。在本章中，我们将讨论 Python 中的一些基础数据结构。\n\n### 15.1 Python 中的列表\n\
  \nList（列表）是 Python 中基础的基础顺序数据结构。每个元素由某些数据成员分配。该结构可以通过其 `index` 访问。列表的基础索引应从 0 开始，每个元素递增\
  \ 1。\n\n我们可以在列表或序列类型的数据结构上执行某些操作。可以执行的主要操作包括切片、索引、加法、乘法和成员检查。\n\nList 是 Python 中最常见的数据结构类型。它由一组相同或不同类型的数据成员序列组成。它也被称为数据的有序集合。默认情况下，列表是动态结构，这意味着我们可以添加或删除成员。它是可变的，这意味着它可以动态更改存储在列表中数据对象的类型和大小。列表的数据成员从\
  \ 0 开始，到总大小减 1 结束。\n\n```\n l1 = ['honda', 'bmw', 2005, 2010]\nl2 = [9, 8, 7, 6,\
  \ 5, 4, 3, 2, 1]\nprint(\"list1[2]:\", l1[2])\nprint(\"list2[1:5]:\", l2[1:5])\n\
  ```\n\n在上述示例中，我们使用了列表 1，其元素为字符串和数字类型。列表 1 包含了多种类型。`l1[2]` 将打印索引 2 的数据，即 2005。在 `l2[1:5]`\
  \ 的情况下，将打印数据成员序列。在这种情况下，执行了切片操作，它与索引相似但不那么灵活。这里 `l2[1:5]` 基本上是一个从索引 1 开始到第五个元素的子列表。\n\
  \n#### 15.1.1 更新和删除列表元素\n\n更新和删除操作可以在列表中直接进行。要此操作，我们只需根据值的索引位置将列表元素的值赋值给变量。如下所示：\n\
  \n```\nlist = ['aaa', 'bbb', 15, 20]\nprint(\"索引 2 处的值 :)\")\nprint(list[2])\n\n\
  list[2] = 25\nprint(\"索引 2 处的新值 :)\")\nprint(list[2])\n```\n\n这段代码将立即将索引位置 2 的值（15）更改为新值（25）。\n\
  \n要从列表中删除元素，我们必须使用 `del` 关键字。作为结果，该值被删除。\n\n\n\n\n\n```python\nlist = ['aaa', 'bbb',\
  \ 15, 20];\nprint \"Value available at index 2 : \"\nprint list[2]\n\ndel list[2];\n\
  print \"New value available at index 2 : \"\nprint list[2]\n```\n\n它将动态地删除索引位置 2\
  \ 对应的元素和内存空间。删除数据元素的另一种方法是使用列表对象的 `remove()` 或 `pop()` 函数。该函数将执行类似的操作。在 `remove()`\
  \ 函数中，我们必须提供元素本身来移除或删除数据。在 `pop()` 的情况下，我们需要应用索引位置。\n\n```python\nlist = ['aaa',\
  \ 'bbb', 15, 20];\nlist.remove('bbb');\nprint list[0:]\nlist.pop(2);\nprint list[0:]\n\
  ```\n\n输出将是：\n\n```\n ['aaa', 15, 20]\n['aaa', 15]\n```\n\n`remove()` 函数删除了字符串“bbb”，列表的大小减少了\
  \ 3。`pop()` 函数运行并删除了值 20（索引 2）。最后，它将变成一个包含两个元素的列表。\n\n### 15.1.2 基础列表操作\n\n列表可以执行各种操作。列表的特征在某些方面类似于字符串；因此，使用\
  \ `+` 运算符用于列表的拼接。`*` 运算符适用于列表，可以将一个元素重复 *n* 次。[表 15.1] 显示了在列表中可以执行的一些操作。\n\n![Images](img/line.jpg)\n\
  \n### 15.2 Python 中的元组\n\n在 Python 中，元组是不可变对象的序列。元组的基本属性是元组中的值是不能被更改的。\n\n若要声明并创建一个元组，我们通常使用圆括号。值之间用逗号分隔。有时，它们可以在双引号内声明。元组的一些标准声明显示如下：\n\
  \n![Images](img/Table_15.1.jpg)\n\n**表 15.1 列表操作**\n\n```\n Tpl = ('abc','def',1,2)\n\
  \ntpl2 = \"a\",\"b\",\"cc\",\"DD\"\n\ntpl3 = ()\n\ntpl4 = (5,)\n```\n\n第三个示例 (`tpl3`)\
  \ 显示了一个没有数据的元组。`tpl4` 是仅包含一个元素的元组。在元组的单个变量后我们必须使用逗号。\n\n我们可以类似于访问列表数据的方式访问元组数据。\n\
  \n```python\n Tpl = ('abc','def',1,2)\n\nprint \"value of Tpl[0] is\",Tpl[0]\n```\n\
  \n我们不能更新元组的元素。因此，以下声明会导致运行时错误并停止执行：\n\n```python\nTpl[1] = 'xyz' # 错误\n```\n\n我们可以使用\
  \ `del` 命令删除元组的元素。因此，以下代码删除了元组中的一个元素：\n\n```python\n del Tup[1]\n```\n\n所有其他适用于列表的操作也适用于元组。\n\
  \n![Images](img/line.jpg)\n\n### 15.3 字典结构\n\n字典是对象的无序集合。与仅包含值的普通对象不同，字典必须具有一些键值对。它是一种优化的结构，用于根据某些已知键元素检索值。字典结构的基础声明显示如下：\n\
  \n```python\n dict = {'name': 'piu','age':32, 'grade':80}\n\nprint \"Name is \"\
  ,dict['name']\nprint \"Age is \",dict['age']\n```\n\n我们可以更新字典中的新属性；在这种情况下，新属性将简单地添加到现有的字典条目中。以下代码所示：\n\
  \n```python\n dict['school'] = “Saradamani school”\n```\n\n我们可以删除字典的单个元素也可以删除整个字典。\n\
  \n```python\n dict = {'name': 'piu','age':32, 'grade':80}\n\ndel dict['age']\n\n\
  dict.clear()\n\ndel dict\n```\n\n第一条语句删除属性 `age`。第二条语句 `dict.clear()` 清空字典的所有属性。`del\
  \ dict` 操作简单地删除整个字典结构。\n\n所有其他适用于列表的操作也适用于字典。\n\n![Images](img/line.jpg)\n\n###\
  \ 15.4 数据结构的排序\n\n数据结构中数据元素的排序起着重要作用。排序将数据元素按升序或降序排列。在本节中，我们将讨论不同数据结构的数据元素排序。`sort()`\
  \ 方法实际上在大多数数据结构中定义，用于对数据排序。另一种排序数据元素的方法是调用 `sorted()` 函数。列表的排序技术显示如下：\n\n```python\n\
  \ List1 = [ 'abc','def',123,'wrg']\nList1.sort()\nprint 'sorted list', List1\n```\n\
  \n这将对整个列表进行排序。首先将打印数值，然后按字母顺序对字符串的值进行排序。\n\n我们还可以通过将 `reverse` 参数设置为 `True` 来对相同的数据结构进行反序排序。因此，代码看起来如下：\n\
  \n```python\n List1 = [ 'abc','def',123,'wrg']\nList1.sort(reverse = True)\nprint\
  \ 'sorted list', List1\n```\n\n它执行降序的数据元素排序。\n\n我们还可以对列表执行自定义排序。例如，列表可能包含两个值，如果我们对列表进行排序，则必须执行操作：\n\
  \n```python\n # 排序示例\ndef takeSecond(elem):\n    return elem[1]\ndata = [(2, 2),\
  \ (3, 4), (4, 1), (1, 3)]\ndata.sort(key=takeSecond)\nprint('Sorted list:', data)\n\
  ```\n\n这里，`data` 根据第二个元素排序。第一个元素是第一个元素。字典的排序是一个主要问题。字典可以根据其键或值进行排序。以下代码显示了逻辑：\n\n\
  ```python\n dict = {'piu':32,'Nilanjan':34,'rishi':24,'mom':37}\n\ndef sortbykey():\n\
  \    dict1 = sorted(dict.items(), key=lambda t: t[0])\n    print dict1\n\ndef sortbyval():\n\
  \    dict1 = sorted(dict.items(), key=lambda t: t[1])\n    print dict1\n```\n\n\
  要排序字典，我们必须检查是否根据键或值进行排序。根据键排序，我们应该传递零索引元素，即 `t[0]`。根据值排序，我们应该传递第一个索引元素 `t[1]`。\n\
  \n### 15.5 Python 中的日期和时间\n\n在 Python 中，我们可以使用多种技术处理时间和间隔。Python 核心模块可以与原生计算机系统日期和时间交互。在\
  \ Python 中，时间间隔是自 1970 年 1 月 1 日凌晨 12:00 开始的秒的基本单位。Python 提供了一个高效的时间模块，用于表示和转换不同的时间表达式。`time.time()`\
  \ 方法始终返回从 1970 年 1 月 1 日凌晨 12:00 开始的纪元系统时间。\n\n\n\n\n\n在此之前的日期无法通过这种表示法表示 [3]。未来的日期也无法通过这种格式表示。UNIX\
  \ 和 Windows 支持的日期截止点是 2038 年。时间元组（time tuple）在日期处理中具有重要意义。大多数 Python 时间函数以九个元组的形式表示时间。时间元组的属性在表\
  \ 15.2 中给出。\n\n从表 15.2 来看，参数 5 处理秒以及一些闰秒值，用于调整协调世界时间（UTC）。通常情况下，当 UTC 与世界时间的时间差大于\
  \ 0.9 秒时，会增加一秒的闰秒。参数 8 定义了夏令时值，根据不同地理位置的纬度调整白天的时间。\n\n![Images](img/Table_15.2.jpg)\n\
  \n**表 15.2**\n\n时间结构的属性\n\n要获取当前时间，我们可以调用 `localtime()` 方法并传递 `time.time()` 值。以下代码表示系统显示的时间：\n\
  \n```python\n#!/usr/bin/python\nimport time;\n\nltime = time.localtime(time.time())\n\
  print \"Current Local time :\", ltime\n```\n\n输出将是未格式化的时间形式，但我们可以从这种表示中获取格式化时间。我们可以使用\
  \ `asctime()` 函数进行任何类型的格式化。\n\n```python\nimport time;\n\nlltime = time.asctime(\
  \ time.localtime(time.time()) )\nprint \"Local current time :\", lltime\n```\n\n\
  我们可以使用 `calendar` 模块获取日历。通过各种日历方法，我们可以执行若干日历操作。\n\n```python\nimport calendar\n\n\
