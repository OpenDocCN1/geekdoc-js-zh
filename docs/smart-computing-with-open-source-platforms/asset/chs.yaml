  BPM\");\nt_mp=0;\nwhile(1);\n}\n```\n![Images](img/line.jpg)\n\n### 9.3 基于 Arduino\
  \ 的 LPG 泄漏检测器\n\nLPG 是家用、工业和汽车用途中最重要的组件之一。然而，LPG 的泄漏会导致灾难性的后果。不过，对 LPG 泄漏进行警报可以最大限地减少事故发生。在这个项目中，我们将开发一个可以使用家庭或工业的\
  \ LPG 检测系统。该系统的设计使得一旦检测到任何泄漏，就会触发报警。系统的电路包含以下组件：\n\n*   Arduino\n*   LPG 气体模块\n\
  *   电阻\n*   LCD 显示器\n*   BC547 三极管\n*   电池组\n*   跳线导\n*   蜂器\n\n#### 9.3.1 工作原理\n\
  \n使用气体检测模块来检测 LPG。当传感器检测到泄漏时，它会向输出引脚产生一个 `HIGH` 脉冲。当 Arduino 接收到高脉冲时，它会发送一条消息。\n\
  \n\n\n\nPython 是一种开源语言，在当今系统和软件开发中被广泛使用。它在智能计算领域非常流行。尽管 Python 的基础结构某些方面与 `FORTRAN`\
  \ 相似，但它比更为强大 [[1]](#ch10.xhtml_ref10_1)。大多数现代计算包括大数据、机器学习、物联网（IoT）、计算机视觉都是 Python\
  \ 应用的最常见示例。Python 被称为解释型语言而非编译语言。Python 也被称为动态类型语言，这意味着如果创建一个变量，不需要显式声明。Python 语言中融入了许多现代的卓越特性。Python\
  \ 的一些最独特且吸引人的特性如下：\n\n1. 它非常简洁。\n2. 可以不使用大括号缩进创建块。\n3. 提供了丰富的集合类型，如 `List`、`Tuple`、`Dictionary`（通常称为\
  \ Maps）和 `Sets`。\n4. 像 `Java` 一样存在 `List` 迭代器。\n5. 提供了简化的面向对象支持。\n6. 存在异常处理。\n7.\
  \ 对于脚本非常强大。\n8. 提供了多种序列类型，如 `Strings` 和 `List`。\n\nPython 的最优秀特性之一是它是一种免费的开源软件。我们可以自由复制\
  \ Python 代码的任何模块并对其进行修改。我们还可以学习 Python 的源代码并根据我们的需求进行修改。\n\n![Images](img/line.jpg)\n\
  \n### 10.2 Python 版本\n\n如今广泛使用的非常流行的 Python 版本是 Python `2.7.x` 和 `3.x` 版本。`2.7.x`\
  \ 版本的某些关键特性在 Python `3.x` 版本中发生了变化 [2,3]。\n\n1. 主要变化之一是 `print` 语句 [[4]](#ch10.xhtml_ref10_4)。在\
  \ Python `2.7.x` 中，我们通常将 `print` 用作语句，而在 Python `3.x` 中，它不再是语句，而是直接变成了一个 `print()`\
  \ 函数。如果我们不在括号内编写语句，Python `3` 将遇到错误信息。因此，以下语句在 Python `2.7` 中运行正常，但在 Python `3`\
  \ 中会报错：\n\n```python\nprint 'Hello World!'\n```\n因此在 python `3.x` 中，我们应该写成\n```python\n\
  print('Hello World!')\n```\n我们可以通过调用 `python_version()` 函数来检查并打印 Python 的当前版本。\n\
  \n2. 第二个变化是在当你从低版本迁移代码时有时相当危险的，因为这段代码永远不会报错，但会计算出错误的值。\n\nPython `2.7.x` 版本中的以下代码与\
  \ Python `3.x` 版本产生的结果不同：\n\n```python\nprint '5 / 2 = ', 5 / 2\nprint '5 // 2 =\
  \ ', 5 // 2\nprint '5 / 2.0 = ', 5 / 2.0\nprint '5 // 2.0 = ', 5 // 2.0\n5 / 2 =\
  \ 2\n5 // 2 = 2\n5 / 2.0 = 2.5\n5 // 2.0 = 2.0\n```\n\nPython `3.x` 将产生如下输出：\n\n\
  ```python\nprint ('5 / 2 = ', 5 / 2)\nprint ('5 // 2 = ', 5 // 2)\nprint ('5 / 2.0\
  \ = ', 5 / 2.0)\nprint ('5 // 2.0 = ', 5 // 2.0)\n5 / 2 = 2.5\n5 // 2 = 2\n5 / 2.0\
  \ = 2.5\n5 // 2.0 = 2.0\n```\n\n3. 在 Python `2.x` 版本中，有两种类型的字符串：一种类型是 ASCII `str()`，另一种类型是\
  \ `Unicode()`。该版本不可用字节（Byte）类型。但在 Python `3` 中，可以使用 UTF-8 类型的 `Unicode` 字符串。此外，它还支持两种字节类型：`byte`\
  \ 和 `byte array`。\n\n```python\nprint type(\"Hello this is test\") statement produces\
  \ the following output in Python 2.7\n<type 'str'>\n\nprint(' test\", type(b' hello\
  \ this is test\")) statement produces following output in Python 3.x\n<class 'bytes'>\n\
  ```\n\n4. 在 Python `2.x` 版本中，可以使用 `range` 函数。.............\n\n\n\n\n图 10.4 显示了在\
