  ```\n\n标准的 JSON 文件使用 `.json` 扩展。一个从 [json.org](http://json.org) 取的 JSON 示例如下：\n\n\
  ```json\n {\n  \"widget\": {\n    \"debug\": \"on\",\n    \"window\": {\n      \"\
