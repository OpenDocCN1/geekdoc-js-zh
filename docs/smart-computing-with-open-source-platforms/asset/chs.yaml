  ```bash\nconda list\n```\n\n### 21.2.5 PyTorch 张量实现\n\nNumPy 是机器学习的终极框架，但它不使用 GPU\
  \ 来加速高端数值计算 [18]。在现代海量数据以及图像或视频的深度学习计算时代，GPU 提供的加速速度高达 50 倍或更多。\n\n由于 NumPy 无法利用这一特性，最基本的\
  \ PyTorch 概念以张量（tensor）的形式引入。张量在概念上与 NumPy 数组相同。PyTorch 提供了许多用于操作此类张量的函数。张量还会跟踪梯度和计算图。这些也许是科学计算中最智能的工具。由于\
  \ PyTorch 支持 GPU，我们只需要在 GPU 引导的环境中转换一个运行张量的新数据类型。以下代码示例讨论了使用 PyTorch 的双层张量：\n\n\
  ```python\n# code courtesy pytorch.org\nimport torch\ndt = torch.float\ndev = torch.device(\"\
  cpu\")\n# device = torch.device(\"cuda:0\")  # 取消此注释以便在 GPU 上运行\n\n# N 是批大小；D_in\
  \ 是输入维度；\n# H 是隐藏维度；D_out 是输出维度。\nN, D_in, H, D_out = 64, 1000, 100, 10\n\n# 创建随机输入和输出数据\n\
  x = torch.randn(N, D_in, device=dev, dtype=dt)\ny = torch.randn(N, D_out, device=dev,\
  \ dtype=dt)\n\n# 随机初始化权重\nw1 = torch.randn(D_in, H, device=dev, dtype=dt)\nw2 =\
  \ torch.randn(H, D_out, device=dev, dtype=dt)\n\nlrning_rate = 1e-6\nfor t in range(500):\n\
  \    # 前向传播：计算预测的 y\n    h = x.mm(w1)\n    h_relu = h.clamp(min=0)\n    y_pred =\
  \ h_relu.mm(w2)\n\n    # 计算并打印损失\n    loss = (y_pred - y).pow(2).sum()\n    print(t,\
  \ loss)\n    # 反向传播计算 w1 和 w2 对应损失的梯度\n    grd_y_pred = 2.0 * (y_pred - y)\n   \
  \ grd_w2 = h_relu.t().mm(grd_y_pred)\n    grd_h_relu = grd_y_pred.mm(w2.t())\n \
  \   grd_h = grd_h_relu.clone()\n    grd_h[h < 0] = 0\n    grd_w1 = x.t().mm(grd_h)\n\
  \n    # 使用梯度下降更新权重\n    w1 = w1 - lrning_rate * grd_w1\n    w2 = w2 - lrning_rate\
  \ * grd_w2\n```\n\n首先，我们必须选择设备。默认情况下，代码将在 CPU 上运行。如果我们想在 GPU 上运行，只需将 `torch.device()`\
  \ 参数指定特定的 GPU。我们必须提供批大小、输入维度、隐藏维度和输出维度。然后，我们必须提供随机输入和输出数据并初始化权重。权重初始化后，计算损失和 `y`\
  \ 的预测值。最后，我们应用反向传播计算相对于损失的梯度 `w1` 和 `w2` 并更新权重。\n\n![Images](img/line.jpg)\n\n###\
