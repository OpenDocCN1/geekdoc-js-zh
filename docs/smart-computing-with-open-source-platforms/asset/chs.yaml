  ## Python 中的面向对象编程\n\n![Images](img/line.jpg)\n\nPython 的最大特点之一是它支持多范式方法。面向对象的特性是\
  \ Python 中最强大的方法之一，它能够以语言的形式舒适地映射现实生活场景 [1]。面向对象编程的根本构建块是对象。对象可以是代表任何现实事物的任何东西。Python\
  \ 还支持多态和继承等其他重要特性。面向对象范式的主要目标是实现某种重用性，有时被称为 DRY（不要重复）。\n\n![Images](img/line.jpg)\n\
  \n### 16.1 Python 中的类\n\n从广义上说，类是面向对象编程的基本单元 [2,3]。类有时认为是现实事物的蓝图。类包含作为变量的属性和方法，方法是在这些变量上执行的操作。以下示例说明了类的创建以及类的实例化（图\
  \ 16.1）。\n\n```python\nclass OS:\n  # 类属性\n  fs = \"ext\"\n  # 实例属性\n  def __init__(self,\
  \ name, ver):\n    self.name = name\n    self.ver = ver\n```\n\n![Images](img/16x1.jpg)\n\
  \n**图 16.1**\n\nOS 类的输出：\n\n```python\n# 实例化类\nr = OS(\"redhat\", 7)\nu = OS(\"\
  ubuntu\", 16)\n\n# 访问类属性\nprint(\"redhat is a {}\".format(r.__class__.fs))\nprint(\"\
  ubuntu is also a {}\".format(u.__class__.fs))\n\n# 访问实例属性\nprint(\"{} is {} version\"\
  .format(r.name, r.ver))\nprint(\"{} is {} version\".format(u.name, u.ver))\n```\n\
  \n在之前的代码中，创建了一个具有类属性 `fs` 以及两个实例属性 `name` 和 `ver` 的 `OS` 类。使用 `r.__class__.fs` 打印类属性。`__init__()`\
  \ 是初始化方法，通常称为构造函数。\n\n![Images](img/line.jpg)\n\n### 16.2 构造函数\n\n构造函数是一个通过语法 `__init__()`\
  \ 的特殊方法。构造函数的主要工作是初始化实例属性。我们可以使用带参数和无参数的构造函数。构造函数用于通过自定义值初始化属性。\n\n```python\nclass\
  \ Person:\n  # 无参数\n  def __init__(self):\n    print(\"无参数构造函数示例\")\n  def show(self,name):\n\
  \    print(\"Hello\",name)\n\np = Person()\np.show(\"Eshita\")\n```\n\n在之前的代码中，制作了一个无参数构造函数。在下一种情况下，讨论了带参数的构造函数。\n\
  \n```python\nclass Person:\n  # 带参数构造函数\n  def __init__(self, name):\n    print(\"\
  带参数构造函数\")\n    self.name = name\n  def show(self):\n    print(\"Hello\",self.name)\n\
  \np = Person(\"Eshita\")\np.show()\n```\n\n![Images](img/line.jpg)\n\n### 16.3 类中方法的创建\n\
  \n方法是类的重要组成部分。它用于执行特定任务。它还用于定义对象的行为 [4]。方法有一个、两个或多个参数。有时没有可以构建无参数方法。在以下代码中，构造函数初始化了\
  \ `name` 和 `ver` 属性，然后调用了带有两个参数的 `GUI()` 方法和带有一个参数的 `Audio()` 方法。\n\n```python\n\
  class OS:\n  def __init__(self, name, ver):\n    self.name = name\n    self.ver\
  \ = ver\n  def GUI(self, width, height):\n    print(\"GUI size: {}x{}\".format(width,\
  \ height))\n  def Audio(self, file):\n    print(\"Playing: {}\".format(file))\n\n\
  r = OS(\"redhat\", 7)\nr.GUI(800, 600)\nr.Audio(\"beep.wav\")\n```\n\n\n\n\n\n```python\n\
  \ class Linux:\n  # instance attributes\n    def __init__(self, name, ver):\n  \
  \      self.name = name\n        self.ver = ver\n\n    # instance method\n    def\
  \ GUI(self, graphics):\n        return \"{} graphics {}\".format(self.name, graphics)\n\
  \n    def Audio(self):\n        return \"{} the name \".format(self.name)\n\n# instantiate\
  \ the object\nu = Linux(\"ubuntu\", 16)\n# call our instance methods\nprint(u.GUI(\"\
  \ HD \"))\nprint(u.Audio())\n```\n\n![Images](img/line.jpg)\n\n### 16.4 Python 中的多态\n\
  \n多态是面向对象编程中最基础的属性 [5]。Python 以方法重载的形式支持多态。下面的代码示例简单地反映了两个不同类中具有相同方法的多态性（图 16.2）。\n\
  \n![Images](img/016x002.jpg)\n\n**图 16.2**\n\n类中的方法多态。\n\n```python\n class Linux:\n\
  \    def virus(self):\n        print(\"no virus attack !!\")\n    def ui(self):\n\
  \        print(\"User interface may be completed !!\")\nclass Windows:\n    def\
  \ virus(self):\n        print(\"  Use antivirus !!\")\n\n    def ui(self):\n   \
  \     print(\"User interface is easy !!\")\n\n# a common interface\ndef os_test(os):\n\
  \    os.virus()\n    os.ui()\n# instantiate objects\nL = Linux()\nW = Windows()\n\
  # passing the object\nos_test(L)\nos_test(W)\n```\n\n在前面的代码中，有两个不同的类：`Linux` 类和\
  \ `Windows` 类。它们具有相同的 `virus()` 和 `ui()` 方法。一个公共接口是 `os_test()`，这两个类的对象都通过它传递并最终调用该方法。由于这种情况下的多态属性，会根据传递的对象调用不同版本的方法。这展示了\
  \ `os_test()` 接口多态操作的简单演示。\n\n多态可以通过运算符重载在 Python 中实现。在 Python 中，`+` 运算符已经被重载了。该运算符同时适用于\
  \ `int` 类和字符串类的实例。我们甚至可以为某些特定目的和特定类的实例重载运算符。要从自定义对象中重载 `+` 运算符，我们必须使用 `__add__`\
  \ 方法。\n\n```python\nimport math\nclass Circle:\n    def __init__(self, rad):\n \
  \       self.__rad = rad\n    def getRad(self):\n        return self.__rad\n   \
  \ def area(self):\n        return math.pi * self.__rad ** 2\n    def __add__(self,\
  \ a_circle):\n        return Circle( self.__rad + a_circle.__rad )\nc1 = Circle(4)\n\
  v1 = c1.getRad()\nv2 = c1.area()\nprint 'radius of c1 > ', v1\nprint 'area of c1',v2\n\
  c2 = Circle(5)\nv3 = c2.getRad()\nv4 = c2.area()\nprint 'radius of c2',v3\nprint\
  \ 'area of c2',v4\nc3 = c1 + c2 # This became possible because we have overloaded\
  \ + operator by adding a method named __add__\nv5 = c3.getRad()\nprint'radius of\
  \ c3',v5\nprint'area of c3',c3.area()\n```\n\n代码的输出如下：\n\n```\nroot@amartya-Aspire-4736:/home/amartya/Desktop/pythonload.py\n\
  radius of c1 >  4\narea of c1 50.26548245\nradius of c2 5\narea of c2 78.53981633\n\
  radius of c3 9\narea of c3 254.4690041\n```\n\n![Images](img/line.jpg)\n\n### 16.5\
  \ 继承概念 (#ch00_fm04_toc.xhtml_sec16_5)\n\n继承是面向对象编程中最重要的现象 [6]。这一特性确保了程序代码从一个模块到另一个模块的可重用性。为了实现这一事实，我们必须设计类层次结构，其中一个类以不同的方式扩展另一个类的属性。在这种情况下存在多种类型的继承。单继承确保了在单级上从一个类到另一个类的属性扩展。此级别可以进一步扩展以实现多级继承。两种常见的继承类型是层次继承和多级继承。在层次继承中，多个子类继承一个基类，而在多重继承中，一个子类继承\
  \ `n` 个基类。\n\n\n\n\n\n1. 1. [learnpython.org](http://learnpython.org). 检索自 [`www.learnpython.org/`](https://www.learnpython.org)。\n\
