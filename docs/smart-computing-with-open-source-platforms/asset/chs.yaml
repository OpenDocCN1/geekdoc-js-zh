  \ cChar8);\n\npinMode(dat_1,INPUT);\npinMode(start,INPUT_PULLUP);\n}\n\nvoid loop()\n\
  {\nlcd.setCursor(0, 0);\nlcd.print(\"Place finger here\");\nlcd.setCursor(0, 1);\n\
  lcd.print(\"Now Start !!! ....\");\n\nwhile(digitalRead(stat)>0);\n\nlcd.clear();\n\
  t_mp=millis();\n\nwhile(millis()<(t_mp+10000))\n{\nif(analogRead(dat_1)<100)\n{\n\
  co+=1;\n\nlcd.setCursor(6, 0);\nlcd.write(byte(1));\nlcd.setCursor(7, 0);\nlcd.write(byte(2));\n\
