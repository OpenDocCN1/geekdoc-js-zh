  图 14.5：用于 MongoDB 的 NoSQLBooster。\n\n### 14.5 本章涵盖的概念\n\n* 一些可用且重要的 API\n* 访问数据\n\
  * 解析 JSON\n* 使用 MongoDB 进行工作\n\n### 参考文献\n\n1. Hellmann, Doug. *The Python Standard\
