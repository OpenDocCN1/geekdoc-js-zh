  \ 中使用的主要的逻辑运算符有“and”（与）、“or”（或）和“not”（非）。对于任意任意两个给定的布尔值，`and` 运算符会在两个数据之间产生“与”操作。对应的语句如下：\n\
  \n```\n x=true\ny=false\nprint(x and y)\n结果为 false\n```\n\n![Images](img/Table_11.1.jpg)\n\
  \n**表 11.1**\n\n不同的运算符及其功能\n\n逻辑运算符也适用于数值类型的值，但在那种情况下，评估取决于数据成员的出现。在 `or` 运算符的情况下，结果值等于第一个成员。输出显示了如下内容：\n\
  \n```\n >>>  z= x or y\n>>> print(z)\n10\n```\n\n对于 `and` 操作，成员应该是第二个操作数。\n\n```\n\
  \ >>>  z=x and y\n>>> print(z)\n3\n```\n\n对于像“not”这样的一元运算符，评估是基于该值是否等于零进行的。如果该值为\
  \ 0，则返回 true；否则，返回 false。\n\n```\n >>>  print (not x)\nFalse\n>>> a=0\n>>> print(\
  \  not a)\nTrue\n```\n\n### 11.1.4 位运算符\n\n这些运算符从根本上对位进行操作，它们既是一元也是也是二元类型的运算符。运算符首先获取任何整数数据的二进制形式，然后直接对其应用操作。以下语句是位与操作的演示，其结果为\
  \ 0：\n\n```\n >>>  x=2\n>>>  y=5\n>>> print (x&y)\n0\n```\n\n在 `x|y` 的情况下，它按位对数据值执行“或”操作；因此，下述语句产生输出\
  \ 7，因为 `5|7` 意味着 (010)|(101) 等于 111（十进制中的 7）。\n\n```\n >>>  x=2\n>>>  y=5\n>>> print\
  \ (x|y)\n7\n```\n\n位非（NOT）运算符是一个一元运算符，执行值的取反。在操作上，它们与 C 或 C++ 语言相同。它的符号为 `~`。Python\
  \ 中另一个经常使用的重要运算符是位异或（XOR）运算符，符号为 `^`。它执行与异或门完全相同的操作，并在操作上与其他语言相似。\n\n位移运算符是另一类运算符，主要用于对位值进行左移和右移操作。语法所示：\n\
  \n`X=x>>2` 表示 `x` 的位模式向右移动了两个有效位，因此最终值再次存储在 `x` 中。相同的情况也适用于左移操作，如下：\n\n`X=x<<2`\
  \ 表示 `x` 的位模式向左移动了两个有效数字。通常，可以观察到向左移动一个有效位会导致数据值等于之前的数据乘以 2。对于右移，每向右移动一个有效位，该值就会被除以\
  \ 2。\n\n### 11.1.5 Python 中的身份标识运算符\n\nPython 中提供了两个被称为身份标识运算符的特殊运算符。语法为“is”和“is\
  \ not”。它们都根据运算符的身份标识性返回布尔值（True 或 False）。如果两个操作数相同，则“is”运算符返回 True。对于任何对象，如果两个操作数代表同一个对象，则返回\
  \ true，否则返回 False。以下代码描述了 `is` 和 `is not` 的操作：\n\n```\n >>>  x=7\n>>>  y=7\n>>>\
  \ print(x is y)\nTrue\n\n>>>  print(x is not y)\nFalse\n>>>\n```\n\n如果值是字符串，那么它也会通过观察大小写来检查相等性。因此，如果两个字符串的大小写不同，则\
  \ `is` 运算符返回 false。\n\n对于列表类型，该概念基于相同引用的对象。因此，接下来的代码段将产生输出 false：\n\n```\n >>> \
  \ x=[1,2,3]\n>>>  y=[1,2,3]\n>>> print (x is y)\nFalse\n```\n\n由于 `x` 和 `y` 列表具有相同的值，但由于它们属于两个不同的列表对象，在这种情况下结果将为\
  \ false。\n\n### 11.1.6 成员运算符\n\n成员运算符检查值是否存在于特定的字符串、元组、列表、集合或字典中。\n\n```\n >>> \
  \ x='test'\n>>> 't' in x\nTrue\n>>> 'T' in x\nFalse\n >>> 'test' not in x\nFalse\n\
  ```\n\n\n\n\n\n![Images](img/line.jpg)\n\n### 12.1 if 语句\n\n`if` 语句通常用于评估条件和条件检查的主语句\
  \ [2]。图 12.1 显示了 `if` 语句的运行行为。\n\n`if` 语句的语法所示：\n\n```\n a=20\n b=30\nif a<b : print(\"\
  \ a is smaller \")\n```\n\n`if` 语句可以使用 `and` 和 `or` 操作符同时包含多个条件。`if` 语句后面总是跟着 `:`。\n\
  \n```\n if a<5 and a>1: print(value is \")\n```\n\n`if` 语句经常跟着 `else:` 语句，以便 `if`\
  \ 语句进行分支。在这里，`if` 条件根据 `var2` 的值进行测试。由于 `var2` 的值是非零，它将生成一个真值。在这种情况下将执行 `if` 部分。\n\
  \n```\n var2 = 10\nif var2:\n    print \"1 - Got a true value\"\nelse:\n    print\
  \ \"1 - Got a false value\"\n    print var2\n```\n\n![Images](img/012x001.jpg)\n\
  \n**图 12.1** `if` 条件语句。\n\n![Images](img/line.jpg)\n\n# 12.2 If-elif-else 阶梯\n\n\
  ## 12.2.1 表示\n\n在某些情况下，我们使用 `if-elif-else` 语句来生成 `if-elif-else` 阶梯形式。在这种情况下，会检查\
  \ `if` 条件；如果语句返回假，将检查紧接的 `elif` 语句。如果 `elif` 语句返回假，进入下一个 `elif` 语句，以此此类推。\n\n```\n\
  \ var = 100\nif var == 200:\n    print \"1 - Got a true value\"\n    print var\n\
  elif var == 150:\n    print \"2 - Got a true value\"\n    print var\nelif var ==\
  \ 100:\n    print \"3 - Got a true value\"\n    print var\nelse:\n    print \"4\
  \ - Got a false value\"\n    print var\n\nprint \"Good bye!\"\n```\n\n三个数中最大值的另一个示例在下面的代码段中：\n\
  \n```\n x = input(\"enter x\")\ny = input(\"enter y\")\nz = input(\"enter z\")\n\
  \nif(x>y):\n    if(x>z):\n      print \"highest is:\",x\n    else:\n      print\
  \ \"highest is:\",z\nelse:\n    if(y>z):\n      print \"highest is:\",y\n    else:\n\
  \      print \"highest is:\",z\n```\n\n## 12.2.2 三元运算符\n\n三元运算符是有用的运算符，类似于 `if-else`\
  \ 语句。它也被称为 `if-then-else` 运算符。三元运算符的语法所示：\n\n```\n a=5\nb=6\nvar = a if (a>b) else\
  \ b\n```\n\n如果 `a` 的值大于 `b`，左侧的数据存储在 `var` 中；如果为假，右侧的数据将存储在 `var` 中。三个整数最大值的更常见示例也可以用三元运算符进行评估：\n\
  \n```\n a = input(\"enter a\")\nb = input(\"enter b\")\nc = input(\"enter c\")\n\
  g = (a if (a>c) else c) if (a>b) else c;\n\nprint \"highest is\", g\n```\n\n![Images](img/line.jpg)\n\
  \n# 12.3 Python 中的循环\n\n循环是编程语言中的组成部分。它们是根据循环提供的边界值顺序执行重复任务的代码段。循环边界是定义循环结束的条件。在\
  \ Python 中，我们通常使用 `while`、`for` 和循环 循环（图 12.2）。\n\n### 12.3.1 while 循环\n\n与其他语言一样，`while`\
  \ 循环由边界条件表达式跟着 `:`。循环块将根据边界值执行，计数器放在循环内部。\n\n![Images](img/012x001.jpg)\n\n**图 12.2**\
  \ Python 中的循环结构。\n\n```\n count=0\nwhile (count < 9):\n    print'count value is:',\
  \ count\n    count = count + 1\n\nprint \"completed\"\n```\n\n在这种情况下，`while()` 根据非零或真值评估结果。如果条件的值是非零或真的，循环将迭代；如果为零或假，它将终止。Python\
  \ 中的以下行将创建无限循环：\n\n```\n var=1\nwhile(var):\n    print \"hi\"\n```\n\n```\n var=True\n\
  while(var)\n    print \"hii\"\n```\n\n有时，我们使用 `while` 循环作为奇循环。这样做，我们可以在运行时定义循环的边界。下面的代码接收字符输入作为循环的边界，并在每次迭代中检查\
  \ `while` 循环的值。如果值匹配循环，它将继续；否则它将终止。\n\n```\n count='a'\nwhile (count!='n'):\n  \
  \  print'The count is:', count\n    count = input(\"enter count\")\n\nprint \"loop\
  \ end\"\n```\n\n输出将是：\n\n```\n count is: a\nenter count\ncount is: e\nenter count\n\
  loop\n```\n\nPython 还支持与 `else` 关联的循环语句。我们可以在循环中使用 `else` 语句。当循环耗尽时，`else` 语句将执行。在\
  \ `for` 循环的情况下，`else` 语句将执行。当 `while` 语句返回假时，`else` 语句将执行。以下代码显示了 `while` 语句的 `else`\
  \ 条件语句：\n\n```\n c=0\nwhile c < 10:\n    print,\"value is\", c\n    c = c + 1\n\
  else:\n    print \"condition false\"\n```\n\n`do-while` 循环在 Python 中是不允许的，但可以使用\
  \ `while` 循环模拟 `do-while` 特性。以下使用 `while` 循环显示 `do-while` 的表示：\n\n```\n i=1\n\n\
  while True:\n    print(i)\n    i = i + 1\n    if(i > 4):\n        break\n```\n\n\
  ### 12.3.2 for 循环\n\n`for` 循环主要用于迭代列表的值。它对于遍历列表、元组和字典非常有用。如果序列包含任何列表，首先会将项赋值给迭代变量。接下来，执行语句块。迭代将直到列表耗尽。以下代码段是\
  \ `for` 语句的示例：\n\n```\n for l in 'MyPython': # 示例 1\n    print 'Current Letter:',\
  \ l\ncar = ['ford', 'audi', 'bmw']\nfor c in car: # 示例 2\n    print 'Current car:',\
  \ c\n```\n\n使用 `for` 循环打印列表的另一种方法是通过应用循环中每个元素的索引。在这种情况下，索引从 0 开始到大小-1 结束。\n\n```\n\
  \ car = ['audi', 'bmw', 'ford']\nfor i in range(len(car)):\n    print 'Current car:',\
  \ car[i], i\n```\n\n输出将是：\n\n```\n Current car: audi 0\nCurrent car: bmw 1\nCurrent\
  \ car: ford 2\n```\n\n以下是质数示例：\n\n```\n for num in range(lower,upper + 1):\n   \
  \ for i in range(2,num):\n        if (num % i) == 0:\n            break\n    else:\n\
  \        print('%d is a prime number \\n' %(num),\n\n### 12.3.3 嵌套循环\n\n各种程序中，我们经常使用嵌套循环。这是循环放入另一个循环的属性\
  \ [3]。一次可以放置一个或多个循环。嵌套在循环中的循环数量决定了循环的嵌套深度。以下程序显示了 2 到 100 之间的可用质数：\n\n```\n i =\
  \ 2\nwhile(i < 100):\n    j = 2\n    while(j <= (i/j)):\n        if not(i%j): break\n\
  \        j = j + 1\n    if (j > i/j) : print i, \" is prime\"\n    i = i + 1\n```\n\
  \n### 12.3.4 奇循环\n\n\n\n\n不定循环（Odd loops）是一种循环结构，其循环边界条件是在循环迭代过程中提供的。因此，我们可能无法确定循环确切的何时结束。这完全取决于用户何时何时想要退出指定的循环。不定循环的结构如下：\n\
  \n```python\n ch = 'y'\nwhile (ch <> n):\n    print \" the value of ch = \", ch\n\
  \    ch = raw_input('enter ch')\n```\n\n#### 12.3.5 break 和 continue 语句\n\n`break`\
  \ 语句主要用于中断当前循环的执行，在这种情况下，控制流将跳转到下一条指令。它通常用于 `while` 和 `for` 循环。如果我们在内层循环中使用 `break`，则内层循环会被终止。\n\
  \n```python\n l=\"MyPython\"\nfor l in 'MyPython':\n   if l == 'h':\n        break\n\
  \   print 'Current Letter:', l\n```\n\n另一方面，`continue` 语句会通过跳过 `continue` 之后的所有语句，立即继续循环的下一次迭代。该语句也可以用于\
  \ `for` 和 `while` 循环。\n\n```python\n for l in 'MyPython':\n   if l == 'h':\n   \
  \     continue\n   print 'Current Letter:', l\n```\n\n在这种情况下，字母 `h` 将被循环跳过，其余字母将正常打印。\n\
  \n![Images](img/line.jpg)\n\n### 12.4 本章涵盖的概念\n\n- 决策\n- 三元运算符\n- 循环\n- 不定循环\n-\
  \ 循环语句\n\n![Images](img/line.jpg)\n\n### 参考文献\n\n1. [1]. Ellis, Margaret A., and\
  \ Bjarne Stroustrup. *The Annotated C++ Reference Manual*. Addison-Wesley, Boston,\
  \ MA, 1990.\n2. [2]. Chun, Wesley. *Core Python Programming*. Vol. 1\\. Prentice\
  \ Hall Professional, Upper Saddle River, NJ, 2001.\n3. [3]. Zelle, John M. *Python\
  \ Programming: An Introduction to Computer Science*. Beedle & Associates, Inc.,\
  \ Franklin, TN, 2004.\n\n## 13\n\n![Images](img/line.jpg)\n\n## Python 中的函数\n\n\
  ![Images](img/line2.jpg)\n\n函数和模块是编程语言的重要组成部分。函数由一段代码定义，这段代码可以在单个程序或多个应用程序中重复使用。函数确保了程序代码的可重用性和模块化。通过使用函数，长段代码通常会被细分成相对较小的模块片段，使得程序段落易于阅读。某些函数是用户定义的，而另一些是库函数。在\
  \ Python 语言中，函数的声明和定义机制有一些特定的技巧。在本章中，我们将讨论 Python 中函数的不同方面和有效性。\n\n![Images](img/line.jpg)\n\
  \n### 13.1 定义的标准规则\n\n在定义函数时，我们需要维护一些标准规范 [[1], [2]]。函数定义应以 `def` 关键字开头，后跟一个名称以及左右括号\
  \ `(name ())`。括号内可以包含任意数量的输入参数。特定函数的代码块应以 `:`（冒号）符号开头。函数可以包含返回语句，并且它可以返回一个或多个语句（凭借列表的属性）。函数没有返回类型，类似于返回\
  \ 0。接下来展示了一个函数定义的示例模板。由于函数参数支持位置顺序，你必须按照它们定义时的相同顺序来出它们。\n\n```python\n def function_name(\
  \ function_parameters ):\n   \"function_docstring\"\n   与函数相关的代码\n\n   return [expression]\n\
  ```\n\n这里有趣的地方在于，在函数定义中，我们应该只传递参数的名称而不是类型。下面的简单代码描述了一个打印字符串消息的函数：\n\n```python\n\
  \ def print_msg(str):\n    print str\n    return\n```\n\n有时，我们可以在函数代码的开头添加描述或文档字符串。以下代码段反映了这一点：\n\
  \n```python\n def print_msg(str):\n   \"printing a string\"\n   print str\nreturn\n\
  ```\n\n![Images](img/line.jpg)\n\n### 13.2 函数调用\n\n### 13.2.1 调用方法\n\n定义函数后，我们需要调用它。函数的调用涉及几种类型。我们可以直接在函数外部调用函数，有时也可以从另一个函数调用函数。以下代码段说明了：\n\
  \n```python\n # 函数定义\ndef print_test(a,b):\n   \"这打印两个数字之和\"\n   print \"value is\"\
  ,a+b;\n   return;\n\n# 调用函数\nprint_test(5,6)\n```\n\n在 Python 中，函数中的参数传递使用引用传递（pass\
  \ by reference）。这意味着函数对值的所更改会影响原始值。在 Python 中没有指针的概念，因此地址操作是隐式完成的。\n\n```python\n\
  \ def change_list(list1):\n    \"这更改了传递到此函数的列表\";\n    list1.append([10,20,30,40]);\n\
  \    print \"Values inside the function: \", list1;\n   return;\n\n# 调用 list1\n\
  List1=[1, 2, 3];\nchange_list( list1 );\nprint \"Values outside the function: \"\
  , list1\n```\n\n在这种情况下，列表对象是通过引用传递的，并且在函数内部列表的内容被修改了。\n\n#### 13.2.2 参数传递机制\n\n\
  在 Python 中，可能的参数传递类型：值传递和引用传递 [[3]]。在值传递的概念下，传递的是值的副本。所有基本类型支持值传递。另一方面，对象类型始终支持引用传递。如果我们想传递列表、元组、字典和字符串，它们总是遵循引用传递机制。以下程序提供了值传递和引用传递机制的概念：\n\
  \n```python\n#!/usr/bin/python\n\ndef swap(a,b):\n   t=a\n   a=b\n   b=t\n   print\
  \ \"values of a,b are\",a,b;\n   return\n\na1 = int(input(\"Enter a>\"))\nb1 = int(input(\"\
  Enter b>\"))\n\nswap(a1,b1)\n\nprint \"values a,b\",a1,b1;\n```\n\n输出为：\n\n```\n\
  \ Enter a>5\n Enter b>6\nvalues a,b are 6 5\nvalues a,b 5 6\n```\n\n在这种情况下，`a1`\
  \ 和 `b1` 的值被传递给 `swap()` 函数并被名为 `a` 和 `b` 的形式参数接收。然后，使用第三个变量进行交换。结果我们得到了交换后的值。但当我们尝试从函数外部打印时，值保持不变。这证明了值传递传递的是变量值的副本。\n\
  \n在引用传递机制的情况下，数据对象的地址或引用传递如下：\n\n```python\n#!/usr/bin/python\n\nlist1=[10,20,30]\n\
  \ndef pbr(list2):\n   list2[1]=50\n   print \"list values\", list2\n   return;\n\
  \npbr(list1)\n\nprint \"list after passing\", list1\n```\n\n输出为：\n\n```\n list values\
  \ [10, 50, 30]\nlist after passing [10, 50, 30]\n```\n\n在这里，列表是一个对象，因此通过函数传递的是列表的引用，而不是列表本身的副本。因此，对列表实际值的任何更改都会影响原始列表对象，且该更改在整个程序中都是有效的。\n\
  \n### 13.3 关键字参数概念\n\n\n\n\n\n这是一个 Python 中非常强大的概念。如果函数参数列表中的参数顺序混乱，我们使用某些关键字通过它们的名称来识别它们。因此，如果参数顺序不匹配，解释器将通过它们的名称识别数据对象。以下代码展示了关键字参数的使用。示例显示在函数调用部分，整数值是参数\
  \ 1，字符串是参数 2。但在定义部分，顺序是反过来的。一旦给函数指定了关键字，解释器就会接收它并生成一个正确的函数调用。\n\n```\n def printfn(\
  \ name, age ):\n   \"This function uses keyword argument\"\n   print \"Name is:\
  \ \", name;\n   print \"Age is \", age;\n   return;\n#call to printfn\nprintfn(\
  \ age=32, name=\"piu\" )\n```\n\n默认参数是另一个概念，即我们在调用函数时不提供参数。如果我们在形式参数中对某个参数进行了显式声明，那么该参数在调用时将作为默认取值。例如，我们为同一个函数使用了两个不同的调用，其中一个调用带有一个参数，而第二个调用有两个参数。在定义部分，我们放置了两个显式初始化的参数。\n\
  \n```\n ##!/usr/bin/python\n\ndef info( name, age = 20 ):\n   print \"Name is: \"\
  , name;\n   print \"Age \", age;\n   return;\n\n# two different call of info\ninfo(\
  \ age=32, name=\"piu\" )\ninfo( name=\"piu\" )\n```\n\n在第二种情况下，`info()` 函数取 `age`\
  \ 的默认值 20。\n\n![Images](img/line.jpg)\n\n### 13.4 Lambda 函数\n\n在 Python 中，`lambda`\
  \ 关键字主要用于构建匿名函数，通常称为 lambda 函数。这种函数本质上没有定义的名称。这种机制适用于创建自适应函数，因此非常适合事件处理。\n\nlambda\
  \ 函数的 기본语法如下：\n\n```\n fn1 = lambda i: i**2\nprint(fn1(5))\n```\n\n在这里，lambda 函数对目标输入数据\
  \ `i` 执行幂运算 (x^y)。lambda 函数也可以接受多个数据作为输入。\n\n```\n fn2 = lambda a,b: a+b\nprint(fn2(3,6))\n\
  ```\n\nlambda 函数的另一个良好用处是，如果我们想在运行时生成匿名函数，可以调用它。在运行时这样做，`lambda` 会返回函数的地址。\n\n```\n\
  \ def fn3(n):\n  return lambda i: i*n\ndbl = fn3(2) \n  tri = fn3(3)\n  val = 10\n\
  \  print(\"Doubled value is: \" + str(dbl(val)) + \". Tripled value is: \" + str(tri(val)))\n\
  ```\n\n![Images](img/line.jpg)\n\n### 13.5 Python 中的模块\n\nPython 中的模块是一个逻辑概念，用于对代码进行逻辑组织。使用这种方法，我们可以相关的代码分组在同一个伞下。它由任意的名称-值属性组成。在\
  \ Python 中，简单的模块可以通过 Python 文件名本身创建并调用。模块由函数、类和不同的变量组成。\n\n```\n #Test.py\ndef print_val(\
  \ var ):\n   print \"Hiii : \", var\n   return;\n```\n\n上述代码段基本上充当了模块，因为它被另一个文件导入。`Import`\
  \ 语句将任何源文件添加到另一个文件中。当我们导入任何文件时，解释器会在当前目录的路径中搜索该文件的可用性。如果未找到，将在 `PYTHONPATH` 环境中写入的路径进行搜索。`filesys.path`\
  \ 存储 `PYTHONPATH`，在 UNIX 中为 `/usr/local/lib/python`，在 Windows 中为 `C:\\python22\\\
  lib`\n\n```\n #importing the test module\nImport Test\nTest.print_val(5);\n```\n\
  \n### 13.5.1 from 语句\n\n`from` 语句专门从一个 Python 模块导入某些属性。在这种情况下，整个模块不会加载，只会加载选择性的属性。可以通过保持逗号\
  \ (,) 来导入多个属性。\n\n```\n from math import pi\nfrom math import *\n```\n\n也可以将模块中的所有属性导入到当前命名空间。这提供了一种从模块导入所有项目的简单技术。当我们将任何模块附加到源码上时，Python\
  \ 解释器首先在当前目录搜索模块的位置，然后搜索由 `PYTHONPATH` 维护的目录。如果在这里失败，它将搜索默认的 Python 库。在 Linux 中，它是\
  \ `/usr/local/lib/python/`。\n\n#### 13.5.2 dir() 函数\n\n内置函数 `dir()` 返回可用模块定义的属性列表。这有助于我们以排序的形式识别对应特定模块所需的属性。\n\
  \n```\n import math\nval = dir(math)\nprint val\n```\n\n输出所示（属性以列表形式呈现的序列）：\n\n\
  ```\n ['__doc__', '__name__', '__package__', 'acos', 'acosh', 'asin', 'asinh', 'atan',\
  \ 'atan2', 'ceil', 'cos', 'cosh', 'degrees', 'e', 'erf', 'erfc', 'exp', 'expm',\
  \ 'fabs', 'factorial', 'floor', 'gamma', 'hypot', 'isinf', 'isnan', 'ldexp', 'log',\
  \ 'log10', 'log1p', 'modf', 'pi', 'pow', 'radians', 'sin', 'sinh', 'sqrt', 'tan',\
  \ 'tanh', 'trunc']\n```\n\n\n\n\n\n面向函数的编程语言特性为程序代码的分段化、模块化和实现重用性提供了强大支持。在现实应用场景中，我们大多数时候关注软件设计的模块化方法。模块在编程中的有效性在于它们极大地减少了查找错误的工作量。因此，得得从心的应用设计显而易见。由于程序被切分成几个组件，搜索和查找错误变得更加容易。接续第\
  \ 13 章，我们将描述、设计并使用众多的函数模块和 API，以说明代码的有效性。\n\n![Images](img/line.jpg)\n\n## 14.1\
  \ 访问 CSV 文件\n\nCSV 代表逗号分隔值。CSV 文件通常是包含大量数据的大文件，通常被称为数据对象 [1,2]。它们是无模式数据的简化形式。与 JavaScript\
  \ 对象表示 (JSON) 相比，CSV 比严格遵循脚本现象的 JSON 更具可读性。\n\nCSV 内部的数据由行组成，用逗号（`,`）分隔的元素反映列。CSV\
  \ 文件中的每一行都是电子表格中的行，而逗号用于定义和分隔电子表格中的单元格。\n\n`csv` 模块包含一些内置函数，如下：\n\n* `csv.reader`\n\
  * `csv.writer`\n* `csv.register_dialect`\n* `csv.unregister_dialect`\n* `csv.get_dialect`\n\
  * `csv.list_dialects`\n* `csv.field_size_limit`\n\n### 14.1.1 读取 CSV 数据\n\n为了获取\
  \ CSV 数据，我们必须使用生成读取器对象的 `reader()` 函数。`reader()` 函数读取文件的每一行并创建所有列的列表。然后，可以选择要显示的列。下面的示例说明了使用读取器对象的读取技术：\n\
  \n```python\nimport csv\nimport sys\n\nf = open(sys.argv[1], 'rb')\nread = csv.reader(f)\n\
  for row in read:\n    print row\n\nf.close()\n```\n\n在前面的代码中，我们导入了 `csv` 和 `sys`\
  \ 包。`csv` 包是访问 CSV 文件的标准包。`sys` 是标准系统包。`sys.argv` 是在运行时传递的命令行参数。在这种情况下，文件名将是 `argv\
  \ 1`，因为 `argv 0` 是 Python 文件本身的名字。在此此之后，我们使用 `open` 函数打开文件对象。然后，使用 `csv.reader(f)`\
  \ 创建读取器对象。`for` 循环遍历包含行的读取器对象，这些行会被输出。最后，我们应该关闭 CSV 文件读取器对象。\n\n### 14.1.2 使用 Pandas\
  \ 加载 CSV\n\nPandas（用于数据分析的 Python）是一个强大的数据分析工具。它构建在 `NumPy` 之上，`NumPy` 是另一个创建和可视化多维数据的强大应用程序。Pandas\
  \ 的基本目标是创建多维数据帧（data frames）。\n\n我们实际上可以在不同的格式数据（如 CSV、JSON 和 Python 字典）中创建数据帧。一旦加载了数据帧，你就可以将数据处理成几个用于数据分析的有价值信息。\n\
  \n在这种情况下，我们必须导入 Pandas 为 `pd` 并导入 `NumPy`。然后，我们必须带有 `.csv` 文件名的参数调用 `read_csv()`\
  \ 函数。要查看 CSV 文件中的可用信息，我们可以调用 `msft` 对象的 `head()` 方法。图 14.1 和 14.2 分别说明了代码和输出。\n\n\
  代码的输出所示图 14.2。\n\n![Images](img/line.jpg)\n\n## 14.2 解析 JSON 数据\n\nJSON 代表 JavaScript\
  \ 对象表示。它在开发者中非常流行数据序列化。它用于大多数 Web 应用程序接口 (web API) 以及程序之间的数据传递。在访问和解析 JSON 数据文件之前，我们必须在程序中导入\
