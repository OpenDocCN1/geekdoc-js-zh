  \n---[content]\n`Arduino TFT` 库扩展了 `Adafruit GFX` 的属性，而 `Adafruit ST7735` 是主要的构建模块。图形\
  \ (`GFX`) 库仅专门负责执行绘图任务，而 `ST7735` 库则专门用于 `Arduino TFT` 上的屏幕。`Arduino` 特有的扩展设计得尽可能与\
  \ `processing` API 相似。\n\n板载的屏幕有时可能有一个 SD 卡槽，可以通过 `SD` 库进行使用。\n\n`TFT` 库同样依赖 `SPI`\
  \ 库与屏幕以及 SD 卡进行通信，并且需要在所有的程序（sketches）中包含。\n\n### 2.4.2 使用库\n\n屏幕有两种不同的配置使用方法。一种是使用\
  \ Arduino 的硬件 `SPI`。另一种方法是手动逐一声明引脚。这两种方法在屏幕功能上没有区别，但使用硬件 `SPI` 方法的速度要快得多。\n\n如果有人计划使用\
  \ `TFT` 模块上的 SD 卡，他们需要硬件 `SPI`。整个示例库都是为硬件 `SPI` 使用而编写的。\n\n如果在 `Uno` 上使用硬件 `SPI`，你只需要声明\
  \ `CS`、`DC` 和 `RESET` 引脚，因为 `MOSI`（引脚 11）和串行时钟 (`SCLK`)（引脚 13）已经定义过了。\n\n```\n #define\
  \ CS   10\n#define DC   9\n#define RESET  8\n\nTFT myScreen = TFT(CS, DC, RESET);\n\
  ```\n\n要在 `Leonardo` 上使用硬件 `SPI`，你按照如下声明引脚：\n\n```\n #define CS   7\n#define DC\
  \   0\n#define RESET  1\n\nTFT myScreen = TFT(CS, DC, RESET);\n```\n\n不使用硬件 `SPI`\
  \ 时，你可以使用任何可用引脚，但 `CD`、`DC` 和 `RESET` 之外，你必须声明 `MOSI` 和 `SCLK` 引脚。\n\n```\n #define\
  \ SCLK 4\n#define MOSI 5\n#define CS   6\n#define DC   7\n#define RESET 8\n\nTFT\
  \ myScreen = TFT(CS, DC, MOSI, SCLK, RESET);\n```\n\n### 2.4.3 使用 Arduino Esplora\
  \ 和 TFT 库\n\n`Arduino Esplora` 是 `Arduino` 项目的一个全新新增。它内置了许多传感器和功能。它的价格约为 54 美元，看起来像一个视频游戏控制器，但实际上远于此。它具有通过模拟多路复用器运行的温度、光和声音传感器。它还有一个三轴加速度计。这基本上基于\
  \ `Arduino Leonardo`。\n\n`Arduino Esplora` 有一个专为 `TFT` 设计的接口，用于屏幕的引脚是固定的。当针对该板编写程序时，会创建一个仅\
  \ `Esplora` 对象。你可以通过 `EsploraTFT` 引用连接到 `Esplora` 的屏幕。\n\n### 2.4.4 与 Processing\
  \ 的相似之处\n\n`Processing` 是一个设计师、艺术家和学生使用的开源软件环境。Processing 的主要输出是计算机或浏览器上的图形窗口。`Arduino\
  \ TFT` 库在屏幕上绘制原始图形和文本的调用尽可能“类 Processing 化”的，以确保两个环境之间的平滑过渡。\n\n![Images](img/line.jpg)\n\
  \n### 2.5 本章涵盖的概念\n\n* Arduino 硬件架构\n* AVR 微控制器\n* I/O 机制\n* I/O 中断\n* 外设接口模块\n\
  * 针对外设的库支持\n\n\n\n\n\n`int16_t`（有时也称为 `unit16_t`）是 Arduino 中使用的另一种特殊形式的数据类型声明；它完美地指定了整数的大小为\
  \ 16 位，且不取决于任何平台（如 Arduino Due）。这确保了数据的可移植性，因为在 Arduino 中，相同的代码很有可能运行在不同的机器上。因此，在这方面可移植性应该受到高度关注。\n\
  \n### 3.1.4 整数常量\n\nArduino Sketch 中允许使用各种形式的整数常量。这些常量看起来就像是某种特定格式的普通整数数据。我们可以直接使用十进制数，也可以应用二进制、八进制或十六进制数作为常量。表\
  \ 3.1 显示了常数的一些示例。\n\n### 3.1.5 字符\n\n字符是 Arduino 中的基本数据类型。某些传感器也通过字符格式提供输入数据。字符也用于输出显示。大多数项目可能以发光二极管显示器（LED）或液晶显示器（LCD）作为\
  \ Arduino 的输出设备，因此字符类型在 Arduino Sketch 中起着重要作用。\n\n![图像](img/Table_3.1.jpg)\n\n\
  **表 3.1**\n\nArduino Sketch 中整数常量的格式\n\n实际上，字符使用 1 字节内存进行存储，并可以以 0–255 十进制数的形式解码，通常称为\
  \ ASCII（美国信息交换标准代码）序列。这一约定适用于 `unsigned char`。有符号的 `char` 可以存储 −128 到 +127 之间的整数值。\n\
  \n### 3.1.6 浮点数据\n\n有两种标准数据类型用于存储浮点数据：`float` 和 `double`。`float` 和 `double` 数据的大小相同均为\
  \ 4 字节（32 位）。`float` 数据类型存储具有 6-7 位精度的小数。为了获得更高的精度，我们可以使用 `double` 数据类型。在 `double`\
  \ 数据类型中，通常存储多达 15 位精度的小数。与整数相比，浮点数据元素的计算通常需要更多的时间；因此，我们应该对变量的声明额外小心。通常，整数和浮点表达式的混合会产生一个所有小数位均为\
  \ 0 的浮点结果，这等同于一个整数值。因此，为了获得实际值，我们有时会进行类型转换。\n\n```\nint a =5; float b=2.5;\nfloat\
  \ c= (float) (a/b);\n```\n\n`double` 精度数据类型在 Arduino UNO 和其他基于 ATmega 的系统中仅占用 32\
  \ 位，而 Arduino Due 则占用 8 字节内存。\n\n### 3.1.7 Arduino 中的数组和字符串\n\n与其他编程环境一样，Arduino\
  \ 也支持数组的实现。其通用语法如下：\n\n```\ndata type array [size];\n```\n\n数组可以是任何数据类型，包括一些用户定义的数据类型。通常，数组对于存储传感器数据序列、键盘映射或\
  \ I/O 引脚序列非常有用。\n\n可以设计一维数组或二维数组。数组通常维护一种基于 0 的索引寻址机制，这意味着起始元素从索引 0 开始，最后一个元素的索引为元素总数减\
  \ 1。\n\n可以使用循环来访问数组，例如 `for`、`while` 或 `do-while`（后文将讨论）。它们的语法如下：\n\n```\nint sensorData[100];\n\
  int SIZE =100;\nfor (int i=0 ;i<SIZE ; ++i)\nsensorData[i]= Serial.read(); // 存储串口中可用的数据。\n\
  ```\n\n数组还可以存储一组字符，称为字符数组。可以按照以下方式声明：\n\n```\nchar dataStream[200];\n```\n\nArduino\
  \ 中也可以创建二维数组。它主要用于创建键盘的输入映射或输出显示数据网格。此外，它还用于实现传感器网络的传感器映射。\n\n二维数组的定义所示：\n\n```\n\
  int Map[100][100];\n```\n\n数组的访问机制与 C 语言相似。二维数组的访问机制如下：\n\n```\nint keymap[10][10];\
  \ int k =1;\nfor( int i=0;j<10;i++){\n  for(int j=0;j<10;j++){\n    keymap[i][j]\
  \ = k;\n    k++;\n  }\n}\n```\n\n### 3.1.8 字符串\n\n与 Arduino 中的其他语言一样，字符串无非一组以空字符\
  \ (\\0) 终止的字符集。这个 ASCII 值 0 告诉 `Serial.print()` 函数结束字符串。否则，可能会读取内存中不属于字符串的后续字节。\n\
  \n如果字符串尺寸太大且超过了两个行，可以通过应用开头和结尾的双引号（\"\"）对长字符串进行折行。\n\n```\nchar string[]= \"hello\"\
  \"this is\" \"test\";\n```\n\n在这里，编译器获取字符串的字符并相应地合并，直到遇到终止符（；）。在实践中，大多数情况下，我们使用文本消息显示在屏幕上。在这种情况下，我们经常使用字符串数组，它在物理上是一个二维数组，每行后面跟着一个空字符。在这种情况下，我们可以这样声明：\n\
  \n```\nchar string[]={\"string1\",\"string2\",\"string3\",\"4\"};\nvoid setup(){\n\
  \  Serial.begin(960);\n}\nvoid loop(){\n  for (int i=0;i<4;i++){\n    Serial.println(string[i]);\n\
  }\n```\n\n在许多 Arduino 项目中，我们经常使用字符串从一个设备传输到另一个设备。例如，如果我们想通过 433-MHz RF（射频）模块传输字符串，最好使用名为\
  \ `sprintf()` 的函数。该函数将任何类型的数据元素打印到缓冲区中，然后通过无线设备发送。\n\n`sprintf()` 函数的示例所示：\n\n```\n\
  unsigned int i = 0;\nvoid setup() {\n  Serial.begin(960);\n}\nvoid loop() {\n  char\
  \ buffer[50];\n  int a = 10, b=20, c;\n  c = a + b;\n  sprintf(buffer, \"Sum of\
  \ %d and %d is %d\", a, b, c);\n  Serial.println(buffer);\n}\n```\n\n在这种情况下，字符串“Sum\
  \ of 10 and 20 is 30”将存储在缓冲区中。此外，它将打印到串口监器或通过任何通信介质发送。\n\n![图像](img/line.jpg)\n\n\
  ### 3.2 用户定义数据类型\n\nArduino 语言支持用户定义数据类型。最流行的是结构类型和 Enum 类型。\n\n结构类型涉及将所有其他原始数据类型结合。Enum\
  \ 是另一种包含一组类型，变量的值应该在该常量范围内。\n\n结构可以定义为原始数据类型的组。它应该以 `struct` 开头，后跟结构体的名称。\n\n```\n\
  struct RGBcolor{\n  byte R; // 成员\n  byte G;\n  byte B;\n};\n```\n\n我们可以按照以下方式在\
  \ `setup()` 函数中初始化数据成员：\n\n```\nvoid setup(){\n  struct RGBcolor color;\n  color.R\
  \ = 0;\n  color.G = 0;\n  color.B = 255;\n  if ( color.R == 0 && color.G==0 && color.B=255){\n\
  \    Serial.print(\"code matches BLUE\");\n  }\n}\n```\n\n在这种情况下，点（.）运算符主要用于访问结构的成员。\n\
  \n\n\n\n\n在这种情况下，我们使用 `enum` 关键字来创建一个枚举数据类型。枚举数据类型的声明结构如下所示：\n\n```\n enum ternary\
  \ { unknown, true, false };\n\n    ternary variable = unknown;\n\n    if (variable==unknown){\n\
  \        //执行代码\n        variable = (condition ? true : false);\n    }\n```\n\n\
  ![Images](img/line.jpg)\n\n### 3.3 变量声明\n\nArduino 中的变量声明非常直观。我们通常使用以下格式来声明变量：\n\
  \n```\n 数据类型 变量名;\n```\n\n这种声明被称为静态声明。内将在编译期间分配。我们可以使用动态内存分配对内存进行动态声明。我们可以使用 `malloc()`\
  \ 函数来实现这一点。\n\n```\n uint8_t x = (uint8_t)malloc(sizeof(x));\n```\n\n在这里，`malloc()`\
  \ 根据数据类型的大小分配内存。在 Arduino 中，除了 `malloc` 之外我们还可以使用 `free()` 函数。该函数用于释放由 `malloc`\
  \ 创建的内存。在 Arduino 中，我们必须小心动态内存分配，因为内存空间非常有限。\n\n声明变量时可以应用的一个经验法则则是减少过大变量的使用。根据你的需求使用变量。不要使用任何过大的变量。例如，`int`\
  \ 占用 2 字节，但有时我们可以在 `int` 变量中存储 1 字节的数据。在这种情况下，使用占用 1 字节内存的 `uint8_t` 更好。对于较大的值，使用\
  \ `int`、`word` 或 `uint16_t` 更好。对于更大的数据，可以使用 4 字节的数据类型如 `long` 和 `uint32_t`。当变量声明时，它会占用\
  \ SRAM 中的内存。在并行系统中，栈和堆也会被分配。全局变量直接占用 SRAM 内存，它们会将堆推向栈。结果会导致内存溢出。\n\n![Images](img/line.jpg)\n\
  \n### 3.4 运算符\n\n在 Arduino 中，使用的许多运算符与 C 和 C++ 语言非常相似。在各种应用设计中，常用的运算符包括算术运算符、逻辑运算符以及位运算符和移位运算符。\n\
  \n运算符如 `+`、`-`、`*`、`/` 和 `%` 本质上用于算术运算。`+` 运算符不能用于拼接。逻辑运算符如 `&&`、`||` 和 `==` 用于逻辑比较。通常用于取反的\
  \ `!` 运算符是一个元运算符。部分示例所示：\n\n```\n int a=0,b=7,c;\n\n c= a&&b; // 因为 a 和 b 中其中一个值为零，所以\
  \ c 将为 0。\n c = a|| b;  // 因为其中一个值非零，所以产生 c =1。\n```\n\n`==` 运算符检查两个或多个变量之间的相等性。\n\
  \n位运算符用于对位模式执行位运算。以下讨论了一些位运算符：\n\n*   位与 (`&`)：在运算符左侧和右侧提供的数据位模式之间执行与运算。\n\n*  \
  \ 位或 (`|`)：在运算符左侧和右侧提供的两个数字之间执行位或运算。\n\n*   位运算符如位异或 (`^`) 和位取反 (`~`) 分别用于执行异或和取反。\n\
  \n示例所示：\n\n```\n byte a = 2,b=3,c;\nc= a&b;    // 执行 00000010&00000011 结果为 00000010\n\
  c=a|b;      // 执行 00000010 | 00000011 结果为 00000011\nc=a^b;    // 执行 00000010⁰⁰⁰⁰⁰⁰¹¹\
  \ 结果为 00000001\n```\n\nArduino 中有两个常用的移位运算符：右移 `>>` 和左移 `<<`。左移和右移的操作步骤与 C++ 类似。\n\
  \n相同格式所示：\n\n```\n value = data >> shift;\nvalue = data << shift;\n```\n\n![Images](img/line.jpg)\n\
  \n### 3.5 优先级和结合性\n\n优先级是编译器用来判断操作优先级的规则。通常情况下，乘法和除法运算符的优先级高于加法和减法。当遇到两个或多个具有相同优先级的运算符时，运算符的结合性才适用。在这种情况下，表达式可以从右到左也可以从左到右求值。\n\
  \n表 3.2 显示了运算符的优先级和结合性。\n\n![Images](img/line.jpg)\n\n**3.2**\n\n![Images](img/line.jpg)\n\
