  \n![Images](img/line.jpg)\n\n### 9.1 自动道闸控制\n\n我们可以使用 Arduino 和一些接近传感器 [1,2] 设计一个简单的道闸控制系统。该系统设计为：当火车进入距离平交道口一定范围内时，报警蜂鸣器开始响器，道闸关闭。当火车通过并移动到一定距离后，区域变得清晰，因此道闸打开，蜂鸣器停止。制作此项目所需的设备列如下：\n\
  \n1. Arduino UNO, mega\n2. 一个红外接近传感器\n3. 一个 12V 直流减速电机\n4. 一个蜂鸣器\n5. L293D 电机驱动集成电路\
  \ (IC) 或 Arduino 电机扩展板\n6. 底纸板和一个木杆\n\n#### 9.1.1 操作步骤\n\n要制作原型项目，首先应该制作一条轨道，并在其上一定距离安装传感器\
  \ [3, 4, 和 5]。这可以通过热熔胶或螺丝完成。电机应通过橡胶或胶水安装在轨道的一侧。现在将一根木杆或塑料杆连接到电机的轴上，以便作为道闸使用。接下来，将红外传感器固定在轨道的两侧，它们与电机的距离应该相等，其中一个用于感知火车的到达，并相应地关闭道闸；第二个传感器的任务是在火车通过第二个传感器时打开道闸。图\
  \ 9.1 显示了轨道的示意图。为了让传感器正常工作，请移除传感器的 LED，仅将其固定在传感器模块中连接的光电晶体管对面。\n\n![Images](img/009x001.jpg)\n\
  \n**图 9.1**\n\n道闸控制器系统图。\n\n#### 9.1.2 电路图\n\n电路包含以下组件：(1) 应连接在 Arduino 的 Vcc 和\
  \ GND 引脚之间的红外传感器，(2) 分别连接到引脚 2 和 3 的 Arduino 输出引脚。电机驱动器 (L293D) 应连接到 Arduino 引脚\
  \ 4 和 5。连接到电机驱动器的电机所示图 9.2。可选情况下，我们可以在电机旁边添加蜂鸣器，以制作平交道口报警系统。\n\n道闸控制的源码如下：\n\n```cpp\n\
  \ int so_1=2;\nint so_2=3;\nint mo_1=4;\nint mo_2=5;\nvoid setup(){\npinMode(so_1,INPUT);\n\
  pinMode(so_2,INPUT);\npinMode(mo_1,OUTPUT);\npinMode(mo_2,OUTPUT);\n}\nvoid loop(){\n\
  Zp:\nif(so_1==LOW){\ndigitalWrite(mo_1,HIGH);\ndigitalWrite(mo_2,LOW);\ndelay(600);\n\
  digitalWrite(mo_1,HIGH);\ndigitalWrite(mo_2,HIGH);\nXp:\nif(so_2==LOW){\ndigitalWrite(mo_1,LOW);\n\
  digitalWrite(mo_2,HIGH);\ndelay(600);\ndigitalWrite(mo_1,HIGH);\ndigitalWrite(mo_2,HIGH);\n\
  delay(1100);\ngoto Zp;\n}goto Xp;\nif(so_2==LOW){\ndigitalWrite(mo_1,HIGH);\ndigitalWrite(mo_2,LOW);\n\
  delay(600);\ndigitalWrite(mo_1,HIGH);\ndigitalWrite(mo_2,HIGH);\n}\n```\n\n![Images](img/009x002.jpg)\n\
  \n**图 9.2**\n\n电路图。\n\n![Images](img/line.jpg)\n\n### 9.2 基于 Arduino 的心率系统\n\n心率监测的基本原理是光电脉搏波记录法。根据这一原理，通过器官的光强度变化等同于该器官内血液体积的变化\
  \ [6]。心率监测传感器主要是 LED 或红外 LED 以及一个检测光强的光电晶体管或光电阻 (LDR)。这种光源和传感器布局有两种不同的实现方式：透射式传感器和反射式传感器。\n\
  \n透射式传感器的情况下，光源和检测器必须面对面，人的手指必须放在发射器和接收器之间。\n\n另一方面，反射式传感器的光源和检测器相邻，人的手指必须放在传感器前方。心率传感器由一个\
  \ LED 或红外 LED 和光二极管组成。信号由光电传感器进一步接收，并通过放大电路进行放大。随后，信号发送到微控制器进行处理。\n\n该项目使用的主要组件如下：\n\
  \n* Arduino UNO\n* ×2 LCD 显示器\n* K 电位器\n* Ω 电阻\n* 按钮\n* 心率传感器模块\n* 实验板和连接线\n\n带有\
  \ Arduino 的电路设计见图 9.3。\n\n![Images](img/009x003.jpg)\n\n**图 9.3**\n\n心率接口电路设计。\n\
  \n#### 9.2.1 工作原理\n\n电路图显示传感器有三个引脚：Vcc、GND 和信号引脚。信号将连接到模拟引脚 A0。原始数据经过校准后，计算出最终的\
  \ BPM 值。\n\n然后将值打印在 16 ×2 LCD 屏幕上。系统启动时，指示按下按钮开始采集心率。启动后，它获取手指脉冲以计算并显示每分钟心率 (BPM)。\n\
  \n输出将连接到数字 PWM 引脚 0, 1, 2, 3, 5 和 6。在引脚 7 上我们将连接按钮。我们需要将 10K 电位器连接到 LCD 屏幕以控制屏幕亮度。\n\
