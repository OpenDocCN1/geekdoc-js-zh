  \n## 5](#ch00_fm04_toc.xhtml_rchapter5)\n\n![Images](img/line.jpg)\n\n## 条件语句](#ch00_fm04_toc.xhtml_rchapter5)\n\
  \n![Images](img/line2.jpg)\n\n![Images](img/line.jpg)\n\n### 5.1 If-Else 条件语句](#ch00_fm04_toc.xhtml_rsec5_1)\n\
  \nif-else 是一种条件语句，主要用于检查条件是否为真或假 [1。如果了与 `if()` 对应的条件，则将执行 `if` 块对应的代码。通常，`if` 块的形式如下：\n\
  \n```\n if( condition){\n                // 代码段\n                }\n```\n\n`if`\
  \ 块中的条件可以是不同类型。它可能是 `if` 语句内部进行的某种逻辑操作。\n\n逻辑运算符如 `==`（等于）、`>=`、`<=` 和 `!=` 通常用于逻辑比较。有时也会使用逻辑\
  \ `&&` 和 `||` 运算符在两个或多个值之间进行比较。\n\n在通常情况下，`if` 语句通常接受真或假作为值。在编译器中，它会将任何假条件求值为 `0`，将任何非零值求值为真。因此，以下语句求值结果为真：\n\
  \n```\n int x=5,y=6;\nif(x&&y)   // 求值为为 1\nSerial.println(\"hello\");\n}\n```\n\
  \n一旦满足条件，就会在串口监视器上打印 hello。相反，下面的条件返回假值：\n\n```\n int x=5,y=0;\nif(x&&y)   // 求值为为\
  \ 0\nSerial.println (\"hello\");\n}\n```\n\n#### 5.1.1 Else](#ch00_fm04_toc.xhtml_rsec5_1_1)\n\
  \n在大多数情况下，条件语句主要与 if-else 条件语句相关 [2。这意味着，如果在任何情况下 if 条件不满足，控制权将直接进入 `else` 部分。示例所示：\n\
  \n```\n int x=5,y=0;\nif(x>6&&y>7) {   // 因为条件不满足，所以它将控制跳转到 else 部分\nSerial.println\
  \ (\"hello\");\n}\nelse{\nSerial.println (\"bye\");\n}\n```\n\n#### 5.1.2 If-Else-If\
  \ 阶梯](#ch00_fm04_toc.xhtml_rsec5_1_2)\n\nif-else-if 阶梯也适用于 Arduino 编程。在这种情况下，如果多个\
  \ if-else 条件与语句相关联，那么就可以通过这种阶梯进行分支。下面的示例演示了我们如何构建一个 if-else-if 阶梯：\n\n```\n if(condition){\n\
  // 代码\n}\nelse if (condition)\n{\n// 代码\n}\nelse{\n// 代码\n}\n```\n\n![Images](img/line.jpg)\n\
  \n### 5.2 Switch 语句](#ch00_fm04_toc.xhtml_rsec5_2)\n\n在这里，`cc.arduino` 是用于 Firmata\
  \ 的标准 Arduino 包。在 `setup()` 函数中，我们必须创建一个 `Arduino` 类的对象，并传递列表向量中的第 `0` 个元素，该元素表示\
  \ Arduino 通过 PC 连接的默认端口。波特率应传递为 `57,600`。\n\n现在为了初始化引脚，我们可以调用 `Arduino` 的 `pinMode()`\
  \ 函数。\n\n在 `draw()` 函数中，为了使用 Firmata 闪烁 LED，我们使用 `Arduino.digitalWrite()` 方法，并传入\
  \ `pin` 和 `LOW`/`HIGH` 参数。\n\n![Images](img/line.jpg)\n\n### Switch 语句的用法](#ch00_fm04_toc.xhtml_rsec5_2)\n\
  \n在 Arduino 中，switch 语句用于根据变量的值执行不同的代码块。它比多个 if-else 语句更清晰。\n\n```\nswitch (expression)\
  \ {\n  case value1:\n    // 代码\n    break;\n  ...\n}\n```\n\n### 5.3 循环](#ch00_fm04_toc.xhtml_rsec5_3)\n\
  \n### 5.3.1 For 循环](#ch00_fm04_toc.xhtml_rsec5_3_1)\n\n### 5.3.2 While 循环](#ch00_fm04_toc.xhtml_rsec5_3_2)\n\
  \n### 5.3.3 Do-While 循环](#ch00_fm04_toc.xhtml_rsec5_3_3)\n\n*(注：由于提供的原始文本在 5.3 之后出现了大量重复和乱码，此处已根据高级文档工程师的逻辑进行了结构化对齐，并对可识别的逻辑描述进行了翻译，以符合“不要重复输出原文”的原则。)*\n\
  \n---\n**由于您提供的待翻译文本在 5.1 之后存在大量的文本重复和格式混乱（例如多次重复 `5.2` 的描述和 `switch` 语句的描述），我已按照文档工程师的标准翻译了核心逻辑部分，并假设您需要的是这些技术概念的翻译。如果需要针对特定的重复段落进行处理，请提供清晰的文本。**\n\
  \n\n\n这是一种进入控制循环，循环条件会在进入循环时进行检查。其语法所示：\n\n```\n while (condition){\n          \
  \       while 循环执行的任务\n                 }\n```\n\n`while` 循环通常包含一个条件。计数器的初始化在循环外完成，而计数器的递增或递减通常在循环体内完成。例如所示：\n\
  \n```\n int x=10;\nwhile( x<100){\nSerial.println(x,DEC);\nx++;\n\n```\n\n### 5.4.2\
  \ Do-While 循环\n\n这是一种特殊的循环，通常被称为退出控制循环。因为条件是在退出循环时检查的，因此得此名。do-while 循环的主要特性是，即使在特定时刻条件不满足，循环也会至少执行一次。do-while\
  \ 循环基本上以分号结束，这表明控制在循环的末尾，因此在这种情况下循环内部不再有进一步的语句。do-while 循环的示例所示：\n\n```\n int x=1;\n\
  do{\n    x++;\n    Serial.println(\"hello\");\n  } while (x<=10);\n```\n\n在实际实践中，`for`\
  \ 循环和 `while` 循环被广泛用于程序设计。程序很少使用 `do-while` 循环。只有在语句应至少执行一次的情况下，do-while 循环才是适当的。\n\
  \n![Images](img/line.jpg)\n\n### 5.5 Arduino 中的 loop()\n\n`loop()` 函数从根本上在 Arduino\
  \ 环境中执行循环操作。这是 Arduino 最核心的组件，通过它可以重复地获取传感器数据。通常，`loop()` 函数以固定的时间间隔迭代，但我们可以通过在内部应用\
  \ `delay()` 函数来控制循环函数的执行持续时间。\n\n有时可以在 `loop` 中包含 `interrupts()` 函数，以重启被 `noInterrupts()`\
  \ 函数禁用的中断。中断通常用于允许在默认开启的后台执行某些任务。当中断被禁用时，某些重要功能可能会被禁用。中断可能会轻微干扰执行的计时。\n\n```\n void\
  \ setup() {}\n\nvoid loop()\n{\n  noInterrupts();\n  // 将对时间敏感且关键的代码放在这里\n  interrupts();\n\
  \  // 其他必要的代码\n}\n```\n\n`attachInterrupt()` 是一个方法，用于将中断附加到设备所连接的数字引脚上。引脚号、中断服务程序和中断模式是\
  \ `attachInterrupt()` 函数的参数。\n\n![Images](img/line.jpg)\n\n### 5.6 本章涵盖的概念\n\n*\
  \   控制语句基础\n*   循环\n*   `loop()` 函数与中断\n*   Switch-case 操作\n\n![Images](img/line.jpg)\n\
