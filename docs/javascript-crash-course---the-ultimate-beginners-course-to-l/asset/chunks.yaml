  trans: "\n此调用会查找 id 为“text1”的元素。然后我们把该元素的 `innerHTML` 设置为“Hello World!”。这会将该内容写入屏幕。\n\
    \n`createElement` 函数也相当有用。它根据一个字符串创建元素，该字符串定义了要创建的元素类型。然后它返回该元素供你的代码使用。此函数也是 `document`\
    \ 对象的一部分。\n\n```\nvar x = document.createElement(“button”);\n```\n\n另一个实用的函数是\
    \ `appendChild` 函数。它可以在任何 `DOM` 对象上调用。此函数将设置第一个参数的值（该参数应该是一个 `DOM` 对象），将其设置为调用该函数的\
    \ `DOM` 对象的子元素。必须使用此函数才能将元素放到屏幕上。`createElement` 函数创建了元素，但没有将其附加到 `document` 上。而此函数可以。我们可以从\
    \ `document` 对象轻松访问 `document` 的 `body`。\n\n```\nvar x = document.body.appendChild(document.createElement(“button”));\n\
    ```\n\n`Math` 对象包含了许多实用的函数。这包括诸如 `pow` 函数，用于计算幂；`sqrt` 函数，用于计算数字的平方根；`abs` 函数，用于获取数字的绝对值；`ceil`\
    \ 函数，将小数向上舍入到整数；`floor` 函数，将小数向下舍入到整数；以及 `round` 函数，它按照数学课教你的方式对小数进行四舍五入：.5 及以上进位，小于则舍入。\n\
    \n```\nvar x = Math.pow(5, 4); // x = 625\nvar y = Math.sqrt(x); // y = 25\nvar\
    \ z = Math.abs(-7); // z = 7\nvar i = Math.ceil(3.2); // i = 4\nvar j = Math.floor(3.2);\
    \ // j = 3\nvar k = Math.round(3.2); // k = 3\n```\n\n另一个实用的函数是 `setInterval`\
    \ 函数。此函数允许你每 x 毫秒调用一次函数。它接收两个参数：要调用的函数以及调用之间等待的毫秒数。它还返回一个数字，即间隔器 ID，可以用它来停止间隔。\n\
    \n```\nvar x = setInterval(function(){console.log(“Groundhog Day!”);}, 1000);\n\
    ```\n\n此示例将每秒打印一次 Groundhog Day!另一个实用的函数是 `clearInterval` 函数。它通过 ID 停止间隔。它接受一个参数，即间隔器的\
    \ ID。\n\n```\nclearInterval(x);\nconsole.log(“Groundhog day is over!”);\n```\n\
    \n# 第 9 章\n\n# DOM 元素\n\nDOM 元素是显示在你 HTML 文档上的内容。`DOM` 代表文档对象模型（Document Object\
    \ Model）。`DOM` 元素包含类型（由创建它的标签定义）、属性（使元素更具唯一性）以及 `innerHTML`（定义其中包含哪些文本或元素）。让我们来看一个示例元素。这将放在你的\
    \ HTML 文件中。\n\n```html\n<div id=’x’ style=’border: black 1px solid’>\n  This is\
    \ part of the innerHTML.\n  <button>Click Me!</button>\n</div\n```\n\n我们可以看到这个元素的类型是由标签定义的“div”。这个“div”元素还设置了两个属性。首先是\
    \ `id` 属性，它让我们能够通过代码找到这个元素。其次是它的 `style` 属性，它更改了元素在屏幕上的显示方式。我们还可以看到这个元素的 `innerHTML`\
    \ 被填充了内容，其中包含一些文本，甚至是另一个元素——一个按钮。使用这些元素，我们可以完成许多事情，如获取用户输入并为用户读取输出消息。\n\n有几种不同类型的元素。有“div”元素，将页面分为若干区域；“input”元素，允许用户向你的代码提供输入；“a”元素，指向网站的链接；“li”元素，显示项目列表；“canvas”元素，允许开发者通过代码在屏幕上绘制图形；以及更多。\n\
    \n# 第 10 章\n\n# AJAX\n\nAJAX 代表异步 JavaScript 和 XML（Asynchronous Javascript And\
    \ XML）。这是一种从服务器异步检索数据的方法，通常是某种 XML 文件，也像 HTML 文件一样。AJAX 可用于动态加载网页的部分内容，特别是那些需要在服务器端计算并发送到客户端的内容。例如，在\
    \ YouTube 上，你可以打开“我的订阅”页面，服务器将根据你的订阅计算你需要查看哪些视频，并加载这些视频的数据，包括名称、链接、图像、描述等。AJAX\
    \ 的实现非常简单。第一步是确定你可以进行何种类型的请求。这是因为旧浏览器使用“ActiveXObject”，而现代浏览器使用“XMLHttpRequest”。\n\
    \n```javascript\nvar requestType;\nif (window.XMLHttpRequest) {\n  requestType\
    \ = XMLHttpRequest;\n} else {\n  requestType = ActiveXObject;\n}\n```\n\n现在你可以在整个代码中使用适当的请求，而无需每次都检查使用哪种请求。我们本质上是将\
    \ `requestType` 设置为这两个函数之一的值。现在让我们配置我们的请求。首先，我们创建对象。\n\n```javascriptvar request\
    \ = new requestType(\"Microsoft.XMLHTTP\");\n```\n\n在这里，我们使用之前定义的 `requestType`\
    \ 创建请求，参数为“Microsoft.XMLHTTP”。我们使用 `requestType` 创建了我们的请求。参数为“Microsoft.XMLHTTP”。这有点复杂，因为\
    \ `XMLHttpRequest` 默认没有参数。而 `ActiveXObject` 则有一个单个参数。这就是我们如何处理请求。下一步是定义当请求完成后应该做什么。要做到这一点，我们设置请求的\
    \ `onreadystatechange` 并将其设置为一个函数。\n\n```javascript\nrequest.onreadystatechange\
    \ = function() {\n  if(request.readyState == 4 && request.status == 200) {\n \
    \   document.write(request.responseText);\n  }\n}\n```\n\n在这个函数中，我们首先检查两个值：`readyState`\
    \ 和 `status`。`readyState` 检查请求处于什么状态，4 表示完成。`status` 检查服务器返回的代码，200 表示“成功”。`Status`\
    \ 也可以其他值，如 404，意味着“未找到文件”。如果请求完成且状态为 200，我们就运行任何想要的代码，在此例中只是写入文本。AJAX 的最后一步是实际发送请求。这是该部分的代码。\n\
    \n```\nrequest.open(“GET”, “目标文件的本地 url”, true);\nrequest.send();\n```\n"
- fmt: "\n# Introduction to NodeJS\n\nNodeJS is a replacement for regular Apache servers.\
    \ NodeJS offers real-time server management (as opposed to Apache servers, which\
    \ runs PHP code only when it is requested by a client) and allows server-side\
    \ programming in Javascript. With NodeJS, you can completely customize the manner\
    \ in which your server responds to server requests. This can be useful for example\
    \ if you want to respond with a random file / set of data every time a client\
    \ sends a certain request to the server. On top of this, you can also have your\
    \ server do a number of real-time tasks, like responding to sockets and interacting\
    \ between sockets even. This can be used to do a number of things, but we will\
    \ be using it in terms of games.\n\n## Setup the Project\n\nThe first step is\
    \ to download NodeJS and install it. Now let’s setup our project. You may want\
    \ to make a new folder to keep your area clean. In this folder, create a new file\
    \ called `package.json`. You may need to open your text editor of choice and “save\
    \ as” `package.json`. In this file you will write the following:\n\n```json\n\
    {\n  \"name\": \"write the name of your project here without spaces, but surrounded\
    \ by double quotes\",\n  \"version\": \"version number of your project\",\n  \"\
    description\": \"A description of your project\",\n  \"dependencies\": {\n   \
    \ \"mime\": \"^1.2.11\",\n    \"socket.io\": \"^1.1.0\"\n  }\n}\n```\n\nThe dependencies\
    \ tell us which NodeJS modules we will be using. There are 2: Mime and SocketIO.\
    \ `Mime` is for returning the proper type of files being sent. `SocketIO` allows\
    \ us to connect to users and be able to dynamically send data to the user, which\
    \ could modify the user’s session and show them new data. This is kind of similar\
    \ to AJAX, except with the difference that sockets work in real-time. With AJAX,\
    \ you have to wait to send a request, for the server to respond and then finally\
    \ you can get your data. With sockets, you do not even need to send a request\
    \ to get data. You may need to connect to the server, but after that, the server\
    \ can send you data, even when you haven’t asked for it. This is very important\
    \ in games, because let’s say a user on another computer moves. There is no way\
    \ your computer could tell that that user moved. The server has to send that data\
    \ to you and it is much easier to simply have the server send data when it needs\
    \ to update you, rather than having the client keep sending requests, which can\
    \ waste more bandwidth.\n\n## Simple Server Example\n\nOnce you have the `package.json`\
    \ configured, navigate to the directory of your project where `package.json` resides.\
    \ Then type `npm install`. This will install Mime and SocketIO to your project.\
    \ The next step is to create a new file, call it whatever you like, with an extension\
    \ of `.js`. This will be your main Node server code, so you may want to name it\
    \ something along those lines. So let’s see some server code. Here is a simple\
    \ example.\n\n```javascript\nvar http = require('http')\nvar server = http.createServer(handler);\n\
    \nserver.listen(80, \"127.0.0.1\");\n\nfunction handler(req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.write('Hello World\\n');\n  res.end();\n\
    }\n```\n\nThis code is simple. First, we load the `http` module, using the `require`\
    \ method. The `require` method can be used to load modules, including custom ones.\
    \ Then we create a server, and supply it with a `handler` function. This `handler`\
    \ function has two parameters: `req`—requests; and `res`—response. `Request` tells\
    \ us all sorts of data about the user’s request, which can include the `url`,\
    \ POST data or whatever else. `Response` allows us as the programmers to respond\
    \ to the user’s request with whatever data we want, whether that be related to\
    \ the user’s request or not.\n\nIn this example, we ignore whatever request they\
    \ made and simply respond with a status code of `200` (meaning “good”) and a content\
    \ type of `text/plain” (meaning that we are sending plain text to the user). This\
    \ is the `writeHead` function—we are writing the header of our response. Our body\
    \ on the other hand, we need to use the `write` function. This simply writes text\
    \ to our response, in this case we simply respond with “Hello World”. Finally\
    \ we call the `end` function, which ends our response, and sends it off to the\
    \ user. So that’s our `handler` function. Finally, once we create our server,\
    \ we tell it to listen on port `80` at the `127.0.0.1` ip. This is our very simple\
    \ server.\n\n## Complex Handler Example\n\nLet’s make our `handler` more complex\
    \ now. First, let’s try and duplicate an Apache server. Here’s a Node server that\
    \ does just that.\n\n```javascript\nvar http = require('http');\nvar fs = require('fs');\n\
    var mime = require('mime');\nvar server = http.createServer(handler);\n\nserver.listen(80,\
    \ \"127.0.0.1\");\n\nfunction handler(req, res) {\n  fs.lstat(\"public\" + req.url,\
    \ function(err, stats) {\n    if(err) {\n      res.writeHead(400, {'Content-Type':\
    \ 'text/plain'});\n      res.write(\"An error attempting to retrieve the file.\"\
    );\n      res.end();\n      return;\n    }\n    if(stats.isDirectory()) {\n  \
    \    fs.readFile(\"public\" + req.url + \"/index.html\", \"utf8\", function(err,\
    \ data) {\n        if(err) {\n          res.writeHead(400, {'Content-Type' : 'text/html'});\n\
    \          res.write(\"An error attempting to retrieve the file.\");\n       \
    \   res.end();\n          return;\n        }\n        res.writeHead(0, {'Content-Type'\
    \ : 'text/html'});\n        res.write(data);\n        res.end();\n      });\n\
    \    } else {\n      fs.readFile(\"public\" + req.url, \"utf8\", function(err,\
    \ data) {\n        if(err) {\n          res.writeHead(400, {'Content-Type' : 'text/html'});\n\
    \          res.write(\"An error attempting to retrieve the file.\");\n       \
    \   res.end();\n          return;\n        }\n        res.writeHead(0, {'Content-Type'\
    \ : mime.lookup(req.url)});\n        res.write(data);\n        res.end();\n  \
    \    });\n    }\n  });\n}\n```\n"
