    \n# Introduction\n## Welcome to Your New Programming Language\nSo, you've decided\
    \ to learn JavaScript Programming? Well, congratulations and welcome to your new\
    \ Programming Language! You're going to love it!\n\nIn Eprogramy we believe that\
    \ the foundation of a good education is to provide the tools able to open the\
    \ doors of the future. It is indisputable that the world has entered an era in\
    \ which all have everything at the fingertips. Social needs have changed. Thus,\
    \ today communication has changed. Communication opens doors, so it is our challenge\
    \ to learn how to communicate. In Eprogramy we want you to learn how to communicate\
    \ with a new language: The programming language. This language allows us to use\
    \ our PC or notebook to create.\n\nMaybe the road is difficult and hard, but we\
    \ will give the reader the tools to make learning enjoyable and fruitful. We'll\
    \ show all aspects necessary to learn how to program. From the ABC´s to the solution\
    \ of the most common programming problems and much, much more. Always with the\
    \ help of numerous examples that will contribute to a better understanding.\n\n\
    We know what we do and believe that you are fully capable of incorporating our\
    \ teachings.\n\nThe doors of the future are here. Let's go step by step together.\n\
    \nLet´s get started!\nEprogramy Team\n\n# Chapter 1: JavaScript Programing Language\n\
    ## History of JavaScript\nSince the inception of the World Wide Web, websites\
    \ contained static pages. Upon entering different web pages, what was being viewed\
    \ was in the most basic form allowed in its time (early 1990s). The interaction\
    \ of a page was not possible, but now it finally is, with the programming language\
    \ you will be learning in this guide, `Javascript`.\n\nThrough the use of `Javascript`,\
    \ you will be able to interact with page components like buttons, text fields,\
    \ lists, tables and much more by having an infrastructure set up to listen for\
    \ interaction of user mouse clicks or keyboard strokes and to respond accordingly\
    \ depending on what is programmed for it to do. The whole idea of `Javascript`\
    \ is to be able to give instructions to your web page to react to different things\
    \ or do things in certain orders depending on time, actions, and various other\
    \ elements that can be used to trigger javascript events.\n\nThe two popular browsers,\
    \ the program you use to access web pages on the World Wide Web, were the `Netscape\
    \ Navigator` and `Internet Explorer`. The `Netscape` browser was the first to\
    \ come out with a programming language to give the ability for users to make their\
    \ web pages interactive. This was named `Livescript` in its time but soon changed\
    \ to `Javascript` when another programming language with the name of `Java` came\
    \ out and they found a good opportunity to use its name as a way to make their\
    \ language more reputable.\n\nAlthough, in 1996, the `Javascript` programming\
    \ language was handed to an international standards body with the name of `EMCA`\
    \ who handled the language from then on.\n\n## What is JavaScript?\nLet’s clear\
    \ a few misconceptions about `Javascript` - it is not `Java`. Many people tend\
    \ to get the two mixed up and don’t entirely understand the difference. The two\
    \ languages are different not only in concept, but design and should be viewed\
    \ as two completely different programming languages.\n"
