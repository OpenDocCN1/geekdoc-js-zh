    \ 编程的终极入门课程\n\n作者：Eprogramy\n© Copyright 2015\n保留所有权利。未经出版者许可，不得以机械、电子或任何其他方式（包括复印）复制本书的任何部分。\n\
    \n### 免责声明\n书中提供的信息旨在为讨论的话题提供有用信息。作者的书籍仅旨在为读者提供 JavaScript 编程的基础知识，对于学生是否能够吸收并应用所提供的所有信息，不作任何保证。尽管作者将尽最大努力分享其见解，但本书或作者的任何其他书籍均不构成读者将在特定时间内学会\
    \ JavaScript 编程的承诺。插图仅供参考。\n\n# 目录\n- 引言\n- 第 1 章\n    - [JavaScript 的历史]\n  \
    \  - [什么是 JavaScript?]\n- 第 2 章\n    - [HTML]\n    - [标签]\n    - [输出]\n    - [CSS]\n\
    \    - [外部 CSS]\n- 第 3 章\n- 第 4 章\n- 第 5 章\n    - [算术运算符]\n    - [加法]\n    - [减法]\n\
    \    - [乘法]\n    - [除法]\n    - [模块]\n    - [后自增]\n    - [前自增]\n    - [后自减]\n \
    \   - [前自减]\n    - [赋值运算符]\n- 第 6 章\n    - [if 语句]\n    - [关系运算符]\n    - [逻辑运算符:]\n\
    \    - [组合运算符]\n    - [赋值]\n    - [答案与解释:]\n- 第 7 章\n    - [循环]\n    - [for 循环]\n\
    \    - [while 循环]\n    - [continue 关键字]\n    - [break 关键字]\n    - [数组]\n    -\
    \ [多维数组]\n- 第 8 章\n- 第 9 章\n- 第 10 章\n- 第 11 章\n- 第 12 章\n- 第 13 章\n- 第 14 章\n\
    - 第 15 章\n- 第 16 章\n- 第 17 章\n- 第 18 章\n- [JAVA 速成预览 - 在 12 小时内学习 Java 编程的终极入门课程]\n\
    - [关于作者]\n\n# 引言\n## 欢迎来到你的新编程语言\n所以，你决定学习 JavaScript 编程了吗？很好，祝贺你，欢迎来到你的新编程语言！你会喜欢它的！\n\
    \n在 Eprogramy，我们相信良好教育的基础是提供能够开启未来之门的工具。毫无疑问，世界已经进入了一个一切触手可及的时代。社会需求发生了变化。因此，今天的沟通方式也发生了变化。沟通开启了大门，所以学习如何沟通是我们的挑战。在\
    \ Eprogramy，我们希望你学会用一种新语言交流：编程语言。这种语言允许我们使用电脑或笔记本电脑进行创作。\n\n也许道路是困难艰难的，但我们将为读者提供工具，让学习变得愉快且富有成效。我们将展示学习编程所需的所有方面。从基础知识到解决最常见的编程问题，以及更多更多。我们将始终通过大量的示例提供帮助，这将有助于更好地理解。\n\
    \n我们知道自己在做什么，并相信你完全有能力吸收我们的教学。\n\n未来的大门已经开启。让我们一起一步步来。\n\n让我们开始吧！\nEprogramy 团队\n\
    \n# 第 1 章：JavaScript 编程语言\n## JavaScript 的历史\n自从万维网诞生以来，网站包含静态页面。进入不同的网页时，你看到的是那个时代允许的最基本形式（20\
    \ 世纪 90 年代初）。页面交互是不可能的，但现在终于可以了，通过你将在本指南中学习的编程语言——`Javascript`。\n\n通过使用 `Javascript`，你能够与按钮、文本字段、列表、表格等许多组件进行交互，因为你建立了一个基础设施来监听用户鼠标点击或键盘击键的交互，并根据对其编写的程序做出相应响应。`Javascript`\
    \ 的核心思想是能够向你的网页发出指令，使其对不同的情况做出反应，或根据时间、动作以及用于触发 javascript 事件的各种其他元素按顺序执行操作。\n\
    \n两个流行的浏览器（即你用于访问万维网网页的程序）是 `Netscape Navigator` 和 `Internet Explorer`。`Netscape`\
    \ 浏览器第一个推出编程语言的，使用户能够创建交互式网页。这在当时被命名为 `Livescript`，但当另一个名为 `Java` 的编程语言出现时，很快改名为\
    \ `Javascript`，因为他们发现了一个很好的机会，利用它的名字来增加自己语言的声誉。\n\n尽管如此，在 1996 年，`Javascript`\
    \ 编程语言交给了一个名为 `EMCA` 的国际标准组织，从那时起由他们处理该语言。\n\n## 什么是 JavaScript?\n让我们清除对 `Javascript`的一些误解——它不是\
    \ `Java`。许多人倾向于将两者混淆，并不完全理解其中的区别。这两种语言不仅在概念上不同，在设计上也不同，应该被视为两种完全不同的编程语言。\n\n"
- fmt: "\nJavascript is a programming language most commonly used in website interaction.\
    \ It can be used to make web pages dynamic and interactable, to the point where\
    \ even games can be made from Javascript and HTML5! Javascript code is either\
    \ placed inside an HTML document (HTML is the format all web pages are written\
    \ in, or at least the format web pages are translated as by your browser) or it\
    \ is referenced from an HTML document. If you want more understanding of this,\
    \ go find an HTML tutorial.\n\nThe way Javascript is executed is not through any\
    \ special third party program, like through a compiler, if you’ve ever studied\
    \ an application level based programming language - but rather using the Javascript\
    \ built-in support from major web browsers like Chrome, Firefox, Internet Explorer,\
    \ and more. Therefore, you simply have to embed Javascript code within the HTML\
    \ language, which is a standard language for browsers to interpret web-page content\
    \ like text and appearance (with the help of CSS).\n\nThe tools needed to be able\
    \ to write Javascript code can be as simple as a notepad to getting started. For\
    \ this guide, we will be using Sublime Text, which is a great text-editor tool\
    \ for web-development languages like HTML/CSS and Javascript. Another alternative\
    \ text-editor if you don’t like Sublime Text, is Notepad++ which is also another\
    \ great tool for writing code pertaining to web-development.\n\n# Chapter 2\n\n\
    # Important Things to Understand Basics of HTML and CSS\n\n## HTML\n\nIn order\
    \ to understand how we can implement the Javascript language and work with it,\
    \ we must understand the fundamentals of how a web page in its most basic form\
    \ works. HTML stands for HyperText Markup Language. It is the standard markup\
    \ language used to create static web pages. That is why, with the help of Javascript,\
    \ we can make these web pages more dynamic and responsive.\n\n### Tags\n\nIn HTML,\
    \ there is a standard convention to starting a statement, and ending one. In English,\
    \ we must start our sentences with a capital letter and end them with a period\
    \ to maintain a standard flow of writing which is easy to interpret. Well, HTML\
    \ uses the idea of “Tags” to be able to understand what exactly you are writing.\
    \ There are a few vital tags you must remember in HTML, and understand what they\
    \ are used for.\n\nIn any HTML file, there is a standard structure that must be\
    \ followed. Here is sample code showing an example of it:\n\n```html\n<html>\n\
    <head>\n    <title> This the webpage title </title>\n</head>\n<body>\n    This\
    \ is the content of the webpage.\n</body>\n</html>\n```\n\nWhen you are making\
    \ a tag, you must start it with a “<” symbol and then indicate the name of the\
    \ tag, and then end it off with “>” symbol. Then, the “inner” portion of the tag,\
    \ or within the tag, goes the rest of the code. To end the tag, you do the same\
    \ convention as starting the tag, except end it with a “/”. This is why you see\
    \ the top of document as: `<html>` and the end of the document as: `</html>`.\n\
    \nVisual demonstration:\n\n```html\n<tagname> content within tag </tagname>\n\
    ```\n\nNow let’s analyze the sample code down:\n\n`<html>`\nThis is the tag that\
    \ indicates when the HTML portion of the site will be, so it must be presented\
    \ in every HTML document. The tag is then closed at the end of the document. Therefore,\
    \ the `<html>` tag is the parent of all the tags within it, the children.\n\n\
    `<head>`\nThis is the tag that would hold all the header information when loading\
    \ a web-page. Everything within this tag will not be shown to the user, and is\
    \ mostly used to initialize scripts to ready them for use. An example would be\
    \ to set a `script` tag in the head section to prepare for use for the rest of\
    \ the HTML document. We will have to do this when learning about the jQuery library.\n\
    \n`<title>`\nThe contents of this tag will hold the title of the webpage.\n\n\
    `<body>`\nThis is the whole content part of the website. Just line in any essay,\
    \ you have your thesis, body and conclusion. This is the same idea in the form\
    \ of tags.\n\nThere are many other tags in HTML that you could look up online.\
    \ Let’s look at a variety of examples and identify some helpful tags.\n\n```html\n\
    <html>\n    <head>\n        <title> Example of “<p>” tag </title>\n    </head>\n\
    \    <body>\n        <p> This is a paragraph. </p>\n    </body>\n</html>\n```\n\
    \nThe bolded tag in the above example essentially describes a paragraph and formats\
    \ it in such a way where it has proper padding/spacing without you having to.\n\
    \n```html\n<html>\n    <head>\n        <title> Example of “<p>” tag </title>\n\
    \    </head>\n    <body>\n        <p> This is a paragraph. </p>\n    </body>\n\
    </html>\n```\n\nThe bolded tag in the above example essentially describes a paragraph\
    \ and formats it in such a way where it has proper padding/spacing without you\
    \ having to.\n\n![Output](https://lh.googleusercontent.com/vnQxDcrM4I9w1I1I1I1I1I1I1I1I1I1I1I1I6Ube763FLzZ6I1I1I1I1I1I1I1/00000.jpg)\n\
    \n### Output\n\nFinally, let’s go over the idea of commenting in HTML. Sometimes\
    \ you might want to code something but not exactly print it to the screen, but\
    \ just want to adding a reminder in the code. You can comment by starting with\
    \ `<!--` and ending with `-->`.\n\nTherefore, if I wanted to comment a certain\
    \ line, I would do the following:\n\n```html\n<p> This is paragraph </p>\n<!--\
    \ This line prints out a paragraph that says “This is paragraph” -->\n```\n\n\
    There are tags, and then there are attributes, which contain values which are\
    \ then used to determine how the tag’s contents are displayed or are interpreted\
    \ by CSS. Two important attributes to note when going in Javascript and CSS are:\
    \ `id` and `class`.\n\nYou can use these on any tag like the `<p>` tag within\
    \ the `<body>` tag.\n\nThe format of how an attribute works is like the following:\n\
    \n```html\n<p id=\"content\"> This is the content of the webpage. </p>\n```\n\n\
    As shown in the example, in order to declare an attribute, you must make space\
    \ within the first tag which is `<p>` and then name the known attribute, so `id`\
    \ for example. Then to give it a value, you must have an equal sign and then two\
    \ quotation marks and the value within the quotation marks. In this case, this\
    \ paragraph contains the attribute `id` which is the value of “content” – this\
    \ can be used as a reference for languages like CSS and Javascript through the\
    \ use of selectors which you will be learning about.\n\nThere are still many tags\
    \ that you can learn about in HTML but these are the basic tags that you need\
    \ to know to start writing. Also, you should now understand the basic structure\
    \ of an HTML document.\n\nLet’s review:\n\n- The `<html>` and `</html>` defines\
    \ the HTML document, and the tag itself simply defines the content within it as\
    \ HTML type so the browser is able to interpret it.\n- The `<head>` and `</head>`\
    \ provide information about the document and initialize any external scripts or\
    \ styling sheets.\n- The `<title>` and `</title>` simply give information to the\
    \ browser to display a title of the HTML document.\n"
  raw: 'Javascript is a programming language most commonly used in website interaction.
    It can be used to make web pages dynamic and interactable, to the point where
    even games can be made from Javascript and HTML5! Javascript code is either placed
    inside an HTML document (HTML is the format all web pages are written in, or at
    least the format web pages are translated as by your browser) or it is referenced
    from an HTML document. If you want more understanding of this, go find an HTML
    tutorial.


    The way Javascript is executed is not through any special third party program,
    like through a compiler, if you’ve ever studied an application level based programming
    language - but rather using the Javascript built in support from major web browsers
    like Chrome, Firefox, Internet Explorer, and more. Therefore, you simply have
    to embed Javascript code within the HTML language, which is a standard language
    for browsers to interpret web-page content like text and appearance (with the
    help of CSS).


    The tools needed to be able to write Javascript code can be as simple as a notepad
    to getting started. For this guide, we will be using Sublime Text, which is a
    great text-editor tool for web-development languages like HTML/CSS and Javascript.
    Another alternative text-editor if you don’t like Sublime Text, is Notepad++ which
    is also another great tool for writing code pertaining to web-development.


    # Chapter 2


    # Important Things to Understand Basics of HTML and CSS


    ## HTML


    In order to understand how we can implement the Javascript language and work with
    it, we must understand the fundamentals of how a web page in its most basic form
    works. HTML stands for HyperText Markup Language. It is the standard mark up language
    used to create static web pages. That is why, with the help of Javascript, we
    can make these web pages more dynamic and responsive.


    ### Tags


    In HTML, there is a standard convention to starting a statement, and ending one.
    In English, we must start our sentences with a capital letter and end them with
    a period to maintain a standard flow of writing which is easy to interpret. Well,
    HTML uses the idea of “Tags” to be able to understand what exactly you are writing.
    There are a few vital tags you must remember in HTML, and understand what they
    are used for.


    In any HTML file, there is a standard structure that must be followed. Here is
    sample code showing an example of it:


    <html>


    <head>


                  <title> This the webpage title </title>


    </head>


    <body>


                  This is the content of the webpage.


    </body>


    </html>


    When you are making a tag, you must start it with a “<” symbol and then indicate
    the name of the tag, and then end it off with “>” symbol. Then, the “inner” portion
    of the tag, or within the tag, goes the rest of the code. To end the tag, you
    do the same convention as starting the tag, except end it with a “/”. This is
    why you see the top of document as: <html> and the end of the document as </html>.


    Visual demonstration:


    <tagname> content within tag </tagname>


    Now let’s analyze the sample code down:


    <html>


    This is the tag that indicates when the HTML portion of the site will be, so it
    must be presented in every HTML document. The tag is then closed at the end of
    the document. Therefore, the <html> tag is the parent of all the tags within it,
    the children.


    <head>


    This is the tag that would hold all the header information when loading a web-page.
    Everything within this tag will not be shown to the user, and is mostly used to
    initialize scripts to ready them for use. An example would be to set a script
    tag in the head section to prepare for use for the rest of the HTML document.
    We will have to do this when learning about the jQuery library.


    <title>


    The contents of this tag will hold the title of the webpage.


    <body>


    This is the whole content part of the website. Just line in any essay, you have
    your thesis, body and conclusion. This is the same idea in the form of tags.


    There are many other tags in HTML that you could look up online. Let’s look at
    a variety of examples and identify some helpful tags.


    <html>


                  <head>


                                <title> Example of “<p>” tag </title>


                  </head>


                  <body>


                                <p> This is a paragraph. </p>


                  </body>


    </html>


    The bolded tag in the above example essentially describes a paragraph and formats
    it in such a way where it has proper padding/spacing without you having to format
    it yourself through the use of CSS (ability to style HTML elements).


    <html>


                  <head>


                                <title> Example of “<p>” tag </title>


                  </head>


                  <body>


                                <h1> This is a heading. </h1>


                  </body>


    </html>


    This <h1> tag used in the above example simply bolds the text in between it and
    enlarges it. All properties of tags that you will be using are editable through
    CSS which we will be going through soon.


    Here is an example using both tags that we have learned and showing the output.
    Note that once you have created a file with HTML in it, you must save the file
    with a .html extension. You can then open the file and test it out by opening
    with a browser of your choice.


    <html>


                  <head>


                                <title> Example of “<p>” tag </title>


                  </head>


                  <body>


                                <h1> This is a heading. </h1>


                  </body>


    </html>


    ### Output


    ![https://lh4.googleusercontent.com/VNQxDcrXmEWh9xtMPONP15Kin9EwzHCIOuLVJnwN5qPMwfwl3srEFNUzO8WgBBmOsD7ejN1WUfBG6UPE763FLlZghEOFEG58K-eepDLp1VE-T6tbZZRaV631EeavzkJiIrbJCn4](Image00000.jpg)


    Finally, let’s go over the idea of commenting in HTML. Sometimes you might want
    to code something but not exactly print it to the screen, but just want to explain
    a statement that you are doing or adding a reminder in the code without having
    it translate visually on the web browser so that it won’t be able to see it.


    You can comment by starting your comment with <!-- and ending it with →


    Therefore, if I wanted to comment a certain line, I would do the following with
    a functioning paragraph:


    <p> This is paragraph text </p>


    <!-- This line prints out a paragraph that says “This is a paragraph text” -->


    There are tags, and then there are attributes, which contain values which are
    then used to determine how the tag’s contents are displayed or are interpreted
    by CSS or Javascript. Two important attributes to note when going in to Javascript
    and CSS are: id and class.


    You can use these on any appropriate tag like the <p> tag within the <body> tag.


    The format of how an attribute works is like the following:


    <p id = "content"> This is the content of the webpage. </p>


    As shown in the example, in order to declare an attribute, you must make space
    within the first tag which is <p> and then name the known attribute, so id for
    example. Then to give it a value, you must have an equal sign and then two quotation
    marks and the value within the quotation marks. In this case, this paragraph,
    contains the attribute id which is the value of “content” - this can be used as
    a reference for languages like CSS and Javascript through the use of selectors
    which you will be learning about.


    There are still many tags that you can learn about in HTML but these are the basic
    tags that you need to know to start writing javascript. Also, you should now understand
    the basic structure of an HTML document.


    Let’s review:


    The tag <html> and </html> defines the HTML document, and the tag itself simply
    defines the content within it as HTML type so the browser is able to interpret
    it.


    The tag <head> and </head> provide information about the document and initialize
    any external scripts or styling sheets.


    The tag <title> and </title> simply give information to the browser to display
    a title of the HTML document.'
