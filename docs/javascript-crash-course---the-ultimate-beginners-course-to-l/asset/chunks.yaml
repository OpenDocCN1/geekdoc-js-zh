    现在让我们来回顾一些关于通用编程的常识。代码中的间距对于程序的运行与否完全没有影响，但保持适当的间距是符合惯例且高效的，这样其他程序员才能阅读你的代码，你自己在编写代码时也能读懂自己的代码。随着你不断地编程和实践，你将开始掌握如何理解标准的间距规范以及何时需要使用它们。最好的方法就是继续阅读本指南，并留意何时留有间距。


    在编程中，你可能会看到一个名称，后面紧跟着大括号，如 `{"` 或 `"}"` —— 这些符号的作用仅仅是相互通信。你可以把 HTML 文档中的标签想象成
    `<tag>`，当它结束时，会写成 `</tag>`，标签之间的所有内容都将根据标签的功能进行处理。在编程中，函数的情况也是如此的（我们稍后会学习更多内容）——第一个大括号
    `{"` 用于引入代码块的开始，结束大括号 `"}` 则用于封口代码块。这现在可能听起来没意义，但当你学习函数和类时，你很快就会发现这一切都是有意义的。


    编程中另一个需要理解的基础性知识是括号的使用 —— 它们用于接收参数或变量，这些变量将在函数内部被处理。例如，如果你还记得高中中学学过的函数，你会记得这意味着什么：


    ```

    f(x) = 5x + 10

    ```


    当 `x` 值被替换为像 `2` 的输入时，它会变成：


    ```

    f(2) = 5(2) + 10

    f(2) = 20

    ```


    现在如果我们对编程中的函数应用同样的思想，我们可以看到，它所做的只是为函数提供接收值进行处理的能力。再次强调，这可能还难以理解，但我只是在为之后学习类、函数以及它们的结构如何工作做准备。


    我们已经学习了 HTML 和 CSS 中的注释，而且令人惊讶的是—— Javascript 中也有注释！记住，注释是不会被执行的，浏览器会忽略这些行。在双斜杠
    `//` 之后编写任何内容仅仅都是单行注释。


    例如：


    ```

    // This is a comment

    ```


    现在，另一种注释方法是使用 `/*` 和 `*/`，注释被放在这两个符号之间，`/*` 是开头，`*/` 是结尾。这被认为是多行注释。


    例如：


    ```

    /* This is a multi-line

    comment. */

    ```


    就像写英文句子一样，要理解在结束一个语句时你会使用句号 —— 实际上，编程中也适用同样的惯例。记住在 Javascript 中创建的任何语句后面都要加一个分号
    `;`。这里有少数例外，例如当你创建一个函数或类时，但这将在指南稍后部分讨论。


    Javascript 语言结构中最后一个要涵盖的话题是**大小写敏感**。Javascript 中的所有内容对大小写都敏感，这意味着如果你创建一个变量（你将在下一节学习这一内容）或函数，它们的名称必须与编写时的格式完全一致，不能区分大写或小写字母。


    # 第 4 章


    # JavaScript 变量


    变量本质上是一个存储特定类型数据的存储单元。它由程序员命名，并用于识别它存储的数据。变量通常可以在任何时间访问或更改。你可以向它写入信息，从它提取信息，甚至可以复制信息并添加到另一个变量中。在每种编程语言中，变量都持有特定的数据类型，无论是字符串（文本）、整数（integer）还是小数（float/double），这些都是编程时需要考虑的。有很多不同的数据类型，如数字、字符串、数组、对象等。


    为了声明一个变量，你必须使用关键字 `var`，然后在后面加上变量名（你可以给它起任何喜欢的名字）。记住，Javascript 中的所有内容对大小写都是敏感。使用变量是为了存储一个值，以便在代码的后续被使用或处理。让我们来看几个变量声明的示例：


    ```javascript

    var numberOfDogs = 16;

    var nameOfDog = "Copper";

    var hasDog = true;

    var cars = ["First", "Second"];

    var anObject = {myName:"Something"};

    ```


    你可能还没有完全理解这些语句中是如何运作（比如数组或对象），但列出它们是为了说明它们是 Javascript 中四种主要数据类型中的两种。


    # 第 5 章


    # JavaScript 运算符


    就像在数学课上，你学习了加法、减法、乘法、除法等。这些都是算术运算符，用于编程中接收数字、对其进行处理并进行相应的计算。让我们来看看编程中的这些运算符，因为它们是最重要的理解内容之一，也是最容易掌握的内容之一。

