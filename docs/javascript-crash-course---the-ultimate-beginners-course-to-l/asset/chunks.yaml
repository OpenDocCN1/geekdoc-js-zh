    ## 赋值运算符


    赋值运算符是在给变量赋值时使用的运算符，最常用的运算符是 (=)。这里是一些示例：


    ### 等号：`=`


    ```

    var x = 5;

    ```


    在上面的示例中，如果你打印 x，其值将是 5，因为你将变量 x 赋值为 5。


    ### 加等等号：`+=`


    ```

    var x = 5;

    x += 5;

    ```

