    当你在浏览器中打开 HTML 文件时，你应该会看到一个黑色页面。大多数浏览器都应该某种形式的控制台，通常通过 `F12` 键激活。这在我们学习编程时非常有用。所以，让我们开始吧！首先，始终将你的代码放在
    `script` 标签之间。接下来，`console.log()` 函数允许你查看括号内任何表达式或对象的值。目前，你只需要知道如何使用它，但稍后我会解释它的实际含义。这里有一些示例代码：


    ```

    console.log(7);

    ```


    这将在控制台中打印出 "7"。注意分号。它很重要。不要忘记它。


    我将编程分为 4 个大类：表达式、语句、关键字和块。我将从表达式开始。表达式是计算机执行以创建一个单个数值的数学步骤。本质上，它们的工作方式与数学课上完全一样，尽管你需要了解某些特定内容的字符。在
    Javascript 中，有 5 种运算：加法（`+`）、减法（`-`）、乘法（`*`，顺便说一下是星号）、除法（`/`，是斜杠）和取模（`%`，是百分号）。这些大部分你应该是熟悉的，尽管取模并不广为人知。取模意味着获取除法的余数。这里是一些示例：


    ```

    6 % 3 = 0      7 % 3 = 1

    8 % 3 = 2      9 % 3 = 0

    ```


    这对于判断一个数字是否为偶数非常有用。只需对 `2` 取模，如果结果为 `0`，则数字为偶数，否则为奇数。这在尝试查找分钟（例如时钟）时也有用。只需将分钟除以
    `60`（一小时 60 分钟），结果将是时钟的分钟计数。注意，当使用取模时，你只能得到从 `0` 到任何小于你运算符的数字（运算符也可以是小数）。


    其他数学运算符如指数、根号、四舍五入等并不是默认操作，实际上是我们稍后将讨论的函数。请注意，表达式遵循 BEDMAS（或 PEMDAS，取决于你学的是哪种）。无论如何，这里是一些表达式及其对应的值：


    ```

    7 * (3 % 2) = 7

    (8 - 1 + 3) * 6 - 8 / (0 - 4) = 62

    ```


    如果你想让计算机执行这些，你可以使用 `console.log` 打印它们，如下所示：


    ```

    console.log(7 * (3 % 2));

    ```


    数字 `7` 将出现在控制台中。这就是表达式。还有对象表达式，但将在稍后讨论。


    关键字是编程的下一个分类。关键字有很多，我们会在学习编程的不同部分时遇到它们。一些常见的关键字有 `"var"`、`"for"`、`"while"`、`"return"`、`"function"`
    和 `"break"`。计算机寻找这些特殊单词在你的代码中执行特定操作。这是一个非常通泛的描述，但它们的范围非常广。当你不打算使用某个词时，要小心不要写下它们。如果使用不当，不仅会导致代码执行错误，还可能因为语法错误导致你的代码根本无法运行。


