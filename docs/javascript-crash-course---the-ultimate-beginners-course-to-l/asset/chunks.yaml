  trans: "\n在上面的示例中，我们正在检查 `x` 是否等于 `5`，如果是的话，我们做的就是跳出循环，这意味着该循环的输出变为：\n\nCurrent\
    \ Number: 0\n\nCurrent Number: 1\n\nCurrent Number: 2\n\nCurrent Number: 3\n\n\
    Current Number: 4\n\n如上面的输出所示，循环在达到第五次迭代时跳出，这意味着本质上停止了循环继续运行。\n\n如果我们把对循环和数组的理解结合起来，我们编写复杂的代码——这就是为什么我们在查看可能用到的这些实际应用之前，会先学习数组，这样你就能更好地理解为什么循环和数组是有帮助的。即使现在看起来并不如此，但在编程时你会经常使用循环和数组。\n\
    \n## 数组 (Arrays)\n\n编程中的数组非常有用，因为它们允许你创建字符串/数字/对象或你所想到的任何数据类型的列表。再次，这起初可能并不明显，但当你开始编程并意识到在某些情况下可能需要使用数组时，它就会显而易见。因此，数组基本上是一个包含多个可以单独访问的值的单个变量。让我们来看一下数组声明的语法。\n\
    \n为了声明一个变量，你必须执行以下操作：\n\n```\nvar names = [\"John”, “Bob”, “Tom\"];\n```\n\n在上面的示例中，我们正在声明一个名为\
    \ `names` 的变量，然后给它赋值一个字符串类型的值列表。因此，为了给数组赋值，我们添加了方括号，这只是简单地为数组设置了边界。然后，我们通过给每个元素加上引号并在每个元素之间添加逗号，了数组的类型为字符串，逗号用于指示它是数组中不同的元素。\n\
    \n为了从数组中访问特定的元素值，我们使用以下语法：\n\n```\nalert(names[0]);\n```\n\n在上面的示例中，我们正在弹出数组索引为\
    \ `0` 的位置的值。在数组中，我们通过索引值来引用数组的值——索引值从 `0` 开始。因此，“John”是索引 `0`，“Bob”是索引 `1`，“Tom”是索引\
    \ `2`。数组本身的长度是 `3`。为了获取数组的长度，我们使用以下属性：\n\n```\nalert(names.length);\n```\n\n由于数组通来说是对象（objects）（你稍后会学习这意味着什么），它们拥有变量和函数，`length`\
    \ 是数组的属性，因此可以通过 `names` 变量访问它，因为它是一个数组类型的变量。这段代码的输出将是 `3`，因为它会将数组的第一个元素计算为 `1`，然后是\
    \ `2`，以此此类推。\n\n现在假设我们声明一个数组，但在代码之后不给它分配任何值。那么你可以这样做：\n\n```\nvar names = []\n\
    names[0] = “John”;\nnames[1] = “ Bob”;\nnames[2] = “Tom”;\n```\n\n在上面的示例中，我们正在声明一个空数组并准备向其中添加元素，我们通过引用一个尚不存在的索引并赋予一个特定的值来实现。现在我们可以引用\
    \ `names` 数组的索引并检索分配给它的相应值。\n\n```\nalert(names[0]);\n```\n\n上面的示例现在返回“John”，因为它被赋值了字符串\
    \ John。需要注意的是，你可以通过简单地对想要覆盖的特定索引使用赋值运算符，然后给它分配其他值。\n\n声明 JavaScript 数组的另一种方法是执行以下操作：\n\
    \n```\nvar anArray = new Array(30);\n```\n\n上面的代码的作用与之前声明变量的方法相同，实际上实际上优于这种方法，但告知你这种方法是为了防你出于某种原因想要使用它。在这个示例中，`anArray`\
    \ 变量中有 `30` 个未定义的元素，并且可以像以前一样赋值。\n\n```\nvar anArray = new Array(10, 20);\n```\n\
    \n在上面的示例中，`anArray` 变量在它的数组中声明了两个元素：`10` 和 `20`——实际上创建变量的最佳方法且标准方法是我们在介绍 `new\
    \ Array()` 之前教的方法，但无论如何都教了，只是为了让你知道还有第二种方法。\n\n现在这确实很棒，拥有数组并能够存储姓名、社会安全号等大型数据库——但想象一下通过手动指向数组索引并检索值来手动打印所有这些值。嗯，让我们想想，如果我想从数组的多个不同的索引值打印出多个值，那么我必须弹出数组的所有不同索引，因此我可以得出，可以使用循环来影响索引变量，从而弹出并检索数组变量的值。\n\
    \n例如：\n\n```\nvar names = [\"John”, “Bob”, “Tom\"];\nfor (i = 0; i < names.length;\
    \ i++) {\n    alert(names[i]);\n}\n```\n\n在上面的示例中，`names` 被声明为“John”、“Bob”和“Tom”——一旦数组设置完成。代码的输出将是：\n\
    \nJohn\n\nBob\n\nTom\n\n利用我们对循环和数组的理解，我们成功地输出了。结合循环和数组只是你可以使用的方法之一。这种想法来自于跳出框架决定如何操作。\n\
    \n## 多维数组 (Multidimensional Arrays)\n\n多维数组是编程中的重要部分。它们允许我们在单个变量中定义大量的点。创建多维数组并不容易，但绝对可行。要创建多维数组，只需创建一个给定大小的数组，然后对每个维度如此操作。\n\
    \n```\nvar dim1 = 10;\nvar dim2 = 20;\nvar dim3 = 30;\nvar arr = new Array(dim1);\n\
    for(var x = 0; x < dim1; x++) {\n    arr[x] = new Array(dim2);\n    for(var y\
    \ = 0; y < dim2; y++) {\n        arr[x][y] = new Array(dim3);\n        for(var\
    \ z = 0; z < dim3; z++) {\n            arr[x][y][z] = Math.floor(Math.random()*10);\n\
    \        }\n    }\n}\n```\n\n与其总是搜索这些常用函数，不如记住它们会让编写你需要的变得容易。\n\n# 第 8 章\n\n#\
    \ JavaScript 中的实用函数\n\n有些 JavaScript 函数应该记在心里。让我们从一个基础函数开始。`getElementById`。它让我们从文档中获取\
    \ HTML 元素，访问并修改它们。要使用此函数，你必须访问 `document` 对象，后面跟着点，然后是 `getElementById`。此函数返回一个\
    \ DOM 对象，我们稍后会详细讨论它。此函数取决于是否存在一个 `id` 属性设置为第一个参数值的 HTML 元素。\n\n```javascript\n\
    var x = document.getElementById(‘text1’);\nx.innerHTML = “Hello World!”;\n```\n"
- fmt: "\nThis call looks for an element with the id of “text1”. We then set this\
    \ element’s `innerHTML` to “Hello World!”. This will make it write that to the\
    \ screen.\n\nThe `createElement` function is also rather useful. It creates elements\
    \ from a string that defines what type of element to create. It then returns this\
    \ element for use in your code. This function is also part of the `document` object.\n\
    \n```\nvar x = document.createElement(“button”);\n```\n\nAnother useful function\
    \ is the `appendChild` function. It can be called on any `DOM` object. This function\
    \ will set the value of the first parameter, which should be a `DOM` object, to\
    \ be placed as a child of the `DOM` object that the function is being called on.\
    \ This function must be used in order to actually put elements onto the screen.\
    \ The `createElement` function creates the element, but does not attach it to\
    \ the `document`. This function can. We can easily access the `body` of the `document`\
    \ from the `document` object.\n\n```\nvar x = document.body.appendChild(document.createElement(“button”));\n\
    ```\n\nThe `Math` object is full of useful functions. This includes things like\
    \ the `pow` function, which calculates powers; the `sqrt` function, which calculates\
    \ the square root of a number; the `abs` function, which gets the absolute value\
    \ of a number; the `ceil` function, which rounds a decimal number up to a whole\
    \ number; the `floor` function, which rounds a decimal number down to a whole\
    \ number; and the `round` function, which rounds a decimal number the way math\
    \ class has taught you: .5 and above rounds up, lower rounds down.\n\n```\nvar\
    \ x = Math.pow(5, 4); // x = 625\nvar y = Math.sqrt(x); // y = 25\nvar z = Math.abs(-7);\
    \ // z = 7\nvar i = Math.ceil(3.2); // i = 4\nvar j = Math.floor(3.2); // j =\
    \ 3\nvar k = Math.round(3.2); // k = 3\n```\n\nAnother useful function is the\
    \ `setInterval` function. This function allows you to make a function be called\
    \ every x milliseconds. This function takes in 2 parameters: a function to be\
    \ called, and a number of milliseconds to wait between calls. It also returns\
    \ a number which is the interval id, which can be used to stop the interval.\n\
    \n```\nvar x = setInterval(function(){console.log(“Groundhog Day!”);}, 1000);\n\
    ```\n\nThis example will print Groundhog Day! every second. Another useful function\
    \ is the `clearInterval` function. It stops an interval by its id. It takes one\
    \ parameter, which is the interval’s id.\n\n```\nclearInterval(x);\nconsole.log(“Groundhog\
    \ day is over!”);\n```\n\n# Chapter 9\n\n# DOM Elements\n\nDOM elements are what\
    \ get shown on your HTML document. `DOM` stands for Document Object Model. `DOM`\
    \ elements contain a type, which are defined by the tags that create it; attributes,\
    \ which make the element more unique; and `innerHTML`, which defines what text\
    \ or elements are contained in it. Let’s see an example element. This would go\
    \ inside your HTML file.\n\n```html\n<div id=’x’ style=’border: black 1px solid’>\n\
    \  This is part of the innerHTML.\n  <button>Click Me!</button>\n</div>\n```\n\
    \nWe can see that this element has the type of “div” as defined by tags. This\
    \ “div” element has two attributes set as well. First, the `id` attribute, which\
    \ let’s us find this element using code. Second, it’s `style` attribute, which\
    \ changes how the element is displayed on the screen. We can also see that this\
    \ element has it’s `innerHTML` filled in, with some text and even another element,\
    \ which is a button. Using these elements, we can do a variety of things like\
    \ get user input and output messages for the user to read.\n\nThere are several\
    \ different types of elements. There are “div” elements, which divide the page\
    \ into sections; “input” elements, which allow users to give input to your code;\
    \ “a” elements, which are links to websites; “li” elements, which displays a list\
    \ of items; “canvas” elements, which allow us as developers to draw graphics to\
    \ the screen through code; and many more.\n\n# Chapter 10\n\n# AJAX\n\nAJAX stands\
    \ for Asynchronous Javascript And XML. This is the method of asynchronously retrieving\
    \ data from a server, usually some sort of XML file, like an HTML file. AJAX can\
    \ be used to dynamically load parts of your web page, specifically things that\
    \ need to be calculated server-side and sent to the client, for example, on YouTube,\
    \ you could open your “My Subscriptions” page and the server would calculate which\
    \ videos you need to see based on your subscriptions and load the data for these\
    \ videos, including name, link, image, description and so on. AJAX is rather simple\
    \ to accomplish. The first step is to figure out which type of request you can\
    \ make. This is because older browsers use the “ActiveXObject”, while modern browsers\
    \ use the “XMLHttpRequest”.\n\n```javascript\nvar requestType;\nif (window.XMLHttpRequest)\
    \ {\n  requestType = XMLHttpRequest;\n} else {\n  requestType = ActiveXObject;\n\
    }\n```\n\nThis now lets you use the proper request throughout your code without\
    \ needing to check each time which request to use. We are essentially setting\
    \ `requestType` to have the value of either of these functions. Now let’s configure\
    \ our request. First, we make our object.\n\n```javascriptvar request = new requestType(\"\
    Microsoft.XMLHTTP\");\n```\n\nHere we create our request using the `requestType`\
    \ we defined before. We also use the parameter of “Microsoft.XMLHTTP”. This is\
    \ kind of tricky. The `XMLHttpRequest` object has no parameters by default. This\
    \ means that if `requestType` is an `XMLHttpRequest`, the parameter will be ignored.\
    \ The `ActiveXObject`, on the other hand, does have a single parameter, which\
    \ in this case will be “Microsoft.XMLHTTP”. So that is how we our request. The\
    \ next step is to define what should be done when our request is done. To do this,\
    \ we set the request’s `onreadystatechange` and set it to a function.\n\n```javascript\n\
    request.onreadystatechange = function() {\n  if(request.readyState == 4 && request.status\
    \ == 200) {\n    document.write(request.responseText);\n  }\n}\n```\n\nIn this\
    \ function, we first check two things: `readyState` and `status`. `readyState`\
    \ checks which state the request is in, where 4 is finished. `status` checks what\
    \ code the server returned, where 200 is “good”. `Status` can also be other values,\
    \ like 404, which means “file not found”. If the request is finished and has the\
    \ status of 200, we run whatever code we want, which in this case is simply to\
    \ write the text. The final step in AJAX is to actually send the request. Here\
    \ is the code for that.\n\n```javascript\nrequest.open(“GET”, “local url of target\
    \ file”, true);\nrequest.send();\n```\n\nSo first we call the `open` method, with\
    \ 3 parameters. First, the method, which can be GET or POST. I will not go into\
    \ too much detail, but essentially, GET sends extra data through the url, while\
    \ POST sends extra data in a more hidden and secure manner. Second, the file.\
    \ This is local to the website address, so if your address is “ [www.123random.com](http://www.123random.com)\
    \ ”, and for your file parameter you put “myfile.php”, AJAX will go to “ [www.123random.com/myfile.php](http://www.123random.com/myfile.php)\
    \ ”. Third, asynchronous or not. Generally, you will want to make this asynchronous,\
    \ because if you don’t the whole website will freeze until the request is finished,\
    \ which if the file is not able to be sent, could take a while. So unless you\
    \ know what you’re doing, keep the third parameter “true”. Finally, we call the\
    \ `send` method, which does exactly what is says—sends the request. Be aware,\
    \ that if you are using the POST method, to place a string as a parameter for\
    \ the `send` method, but before using POST learn how to properly use it and if\
    \ you actually need it or not.\n\nOur example code is very simple in that we do\
    \ nothing special with the response. One thing you can do is, rather than using\
    \ `responseText`, you can use `responseXML`. Using this, you can call `getElementsByTagName`\
    \ functions and access all sorts of different data very easily.\n\n# Chapter 11\n\
    \n# NodeJS\n"
