    by making its position fixed. We also disable its margin and padding to make our
    body right up against the top left. Finally, we set the body’s onload event to
    call our script’s init function, which we will get to in a minute. We also define
    the canvas where we will be drawing our scenery. We give it an id of canvas, a
    width of 1600 and a height of 900\. We also set its style to have a black border
    with a width of 1 pixel.


    In our script, we create a Main object. This simply makes it cleaner if we ever
    want to add other features like input or pathfinding or whatever else. It is cleaner
    to have objects that separate things than have all of your functions randomly
    grouped together. It also adds the element of scope, so you can have two variables
    with the same name in separate objects that do different things. In this Main
    object, we “define” several variables. We set each of these variables to undefined,
    which sounds like an oxymoron—we defined the variable as undefined—but this will
    allow us to remember which values we will have defined later. We have 6 variables:
    heights, which tells us the heights of the current map; nextHeights, which tells
    us the heights of the map we will be scrolling to; starMap, which tells us the
    stars of the current map; nextStarMap, which tells us the stars of the map we
    will be scrolling to; canvas, which stores a reference to the canvas DOM element;
    and c, which stores the 2d context of the canvas. We also define offset, which
    will act as our scrolling factor.


    In our init function, we set up our heights and nextHeights to the returned value
    of our generateHeights function. This function starts by creating an array with
    a single element set to 0\. This array holds all the heights in our terrain as
    a 1d array, where the value is the height at that point. We assume that the start
    and end of the heightmap must be at a height of 0\. Our array holds the end height
    of 0, but omits the start height. This is to make the array always powers of 2\.
    Next, we make a loop that does 10 iterations. This loop will increase the array’s
    size by a factor of two each iteration. In this loop, we create another array.
    We then start another loop that runs for twice the length of the original array.
    We then check if this inner loop is an odd number. If it is, then that means we
    take the element at that index halved from the original array and add it to the
    new array. If the inner loop index is not an odd number, we check to see if the
    index is 0\. If it is 0, than we get the average between the first element in
    the original heightmap and 0\. This means we get the middle point between the
    starting point, and the first point. We then add a random offset to this point,
    which goes between 1 and -1 and divide it by 2 to the power of the number of iterations.
    This makes it so that as the terrain divides, it gets more unique due to the random
    offset. Because we divide by 2 to the power of the number of iterations, this
    means that as the number of heights increases, the random offset gets smaller.
    This is so that the terrain does not go all over the place. Now if the loop index
    is not 0, we do the same thing, except get the average between the height to the
    left, and the height to the right of the selected height. Basically, we are putting
    a new, slightly-different height between the old two heights. Finally, once we
    have made the new heights array, we replace the old heights array with the new
    one, so that the next iteration will make this new array more unique than itself.
    Finally, once we have completed our iterations, we return this heightmap. The
    next thing we do in our init function is we set our starMap and nextStarMap to
    the returned value of the generateStarMap function.


    This function creates an array and starts a loop for 1000 times. In this loop,
    we add a star object to the array, which contains an x position, and a y position,
    which are both generated randomly between the canvas’ width and height. Finally
    it returns this array. Our init function also gets the canvas element, and gets
    its context. Finally, it sets an interval to run the update function every 25
    milliseconds. In our update function, we check to see if our offset is equal to
    the canvas width (because we are scrolling to the right), and if so, we change
    the offset to start at the left again, move the nextHeights to be the heights,
    as we have scrolled to the right enough to no longer have the old heights in view,
    and we generate a new nextHeights. We do the same thing with the starMap and nextStarMap.


    If the offset is not equal to the canvas width, we simply add 5 (an arbitrary
    speed for the camera). Finally, no matter what, we draw the scene using our drawHeights
    function. In this function, we draw a gradient which will act as our sunset, because
    sunsets are pretty. We set the fillStyle of the canvas’ context to the grid and
    we fill the entire canvas with this background. After that, we set the fillStyle
    to be white, as we are about to draw the starMap. To do this, we loop through
    the starMap, and then for each we fill a 1 x 1 rectangle at the position of the
    star, except shifted over left by the offset amount. This is so that as the offset
    increases, the entire map will shift over left. This means that it will start
    completely in frame, and move left until it is completely off frame (because offset
    will max out at the width of the canvas). This excludes the background sunset,
    because the background sunset will be the same no matter what our offset will
    be. We also draw the nextStarMap, the same way as the normal starMap, except we
    also shift it right with an amount of the canvas width. This means that it will
    start completely off frame to the right and then as offset increases, it will
    move further left, until it is completely in frame, and then we would generate
    a new star map.'
