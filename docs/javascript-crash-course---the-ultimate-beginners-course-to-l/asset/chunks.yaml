    # JAVA 速成班——在 12 小时内学习 Java 编程的终极学者课程预览


    ## 引言


    ### 欢迎学习你的新编程语言


    所以，你决定学习 Java 编程？很好，祝贺你并欢迎来到新编程语言！你会喜欢它的！


    在 Eprogramy，我们相信良好教育的基础是提供能够开启未来之门的工具。不可否认，世界已经进入了一个一切触手可及的时代。社会需求发生了变化。因此，今天的沟通也发生了变化。沟通开启了大门，所以学习沟通是我们的挑战。在
    Eprogramy，我们希望你学会用一种新语言进行交流：编程语言。这种语言允许我们使用电脑或笔记本进行创作。


    也许道路是艰难的，但我们将为读者提供让学习变得有趣且富有成果的工具。我们将展示学习编程所需的所有方面。从软件安装到最常见编程问题的解决方案，以及更多更多。始终会有大量的示例，这将有助于更好地理解。


    我们知道自己在做什么，并相信你完全有能力吸收我们的教学。


    未来之门已经开启。让我们一起一步步前进。


    让我们开始吧！


    Tim Markus

    Eprogramy 团队


    # 第 1 章：Java 编程语言


    ### Java 的历史


    Java 是一种编程语言，首次于 1995 年发布，由 Sun Microsystems (Sun) 的 James Gosling 于 1991 年创建。Sun
    Microsystems 后被 Oracle 收购，现在是负责该编程语言命运的公司。Java 随后在 GNU 通用公共许可证 (GPL) 下开源。


    该语言的大部分语法源自 `C` 和 `C++`，但并没有它们那么强大，因为它对用户的要求更少。像垃圾回收（减少程序使用的内存的过程）这样的功能在 Java
    中是自动化的。它最初设计用于交互式电视，但超越了当时数字电视行业的技术和设计。创建 Java 语言时使用了五个原则：


    1. 它必须是“简单、面向对象且熟悉的”

    2. 它必须是“健壮且安全的”

    3. 它必须是“体系无关且可移植的”

    4. 它必须以“高性能”执行

    5. 它必须是“解释的、线程的且动态的”


    另一个重要的设计目标是可移植性，这是 Java 迅速流行的关键因素。


    ## 什么是 Java？


    Java 是一种具有多平台能力的编程语言，这意味着你可以为任何类型的设备编写 Java 程序，无论是安卓 手机、Windows 电脑还是苹果产品。由于 Java
    的灵活性，它已成为全球许多程序员使用的最流行编程语言之一。Java 可用于创建 Web 应用程序、游戏、Windows 应用程序、数据库系统、Android
    应用等。


    Java 因其简单性和强大而与其他编程语言不同。这种结合使得 Java 编程语言非常好用。Java 是一种简单的编程语言，因为它在内存管理或处理相互继承的极其复杂的类层次方面对用户的要求并不多。

