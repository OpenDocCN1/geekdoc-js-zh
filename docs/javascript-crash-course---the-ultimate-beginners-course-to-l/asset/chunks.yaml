    will print out 7 times. You can have as many parameters as you want (although
    the fewer the better). Just separate each variable name with a comma.


    function printSomething(times, whatToPrint)


    {


                  for(var i = 0; i < times; i++)


                  {


                                console.log(whatToPrint);


    }


    }


    This function will print out whatever whatToPrint is set to for however many times
    is set. So how do we use this code? To make this code run, simply type the function
    name, followed by brackets, which contain values, separated by commas, which should
    relate to what the function is using it for. For example, for our function, our
    first parameter is the times variable, so we should only be putting a number as
    the value for our first parameter, specifically a whole number (although in this
    case, whether the number is whole or not is not important). As well, for the second
    parameter, we should put what we want to print. This is called "calling" a function.


    printSomething(7, "I like to move it, move it!");


    We can call our function as many times as we want, whenever we want. Something
    interesting about functions is that you can use functions as values when setting
    variables, and then call them from these variables. The difference between calling
    a function, and using it as a value, is that when calling a function, you use
    brackets with parameters in them, while when using a function as a value, you
    do not place brackets.


    var aFunction = printSomething;


    aFunction(3, "Strike!");


    console.log("You''re out!");


    An important feature of functions is the fact that you can “return” values. This
    means that the function will act as the returned value when called. To return
    a value, simply use the return keyword, followed by a value. Here is an example.
    To use the returned value, simply imagine the function call as being the returned
    value.


    function calculateHalfCircumference(radius)


    {


                  return Math.PI*radius;


    }


    var circumference = 2*calculateHalfCircumference(7);


    console.log(circumference);


    In this example, we create a function, and return half of the circumference (why
    you would want to do this, I do not know, but for the sake of an example, that
    is what we will do). Outside the function, we create a variable, and set it to
    twice the returned value of our function, which we know will be half the circumference
    of our circle. If we are taking half of the circumference and multiplying it by
    2, that means we are getting the total circumference, which we print out. Returning
    also has a secondary function. It stops execution of a function. This means that
    say you have a loop in your function that runs for a long time, but you want it
    to stop after an if-statement runs. Just use the return keyword and it will stop
    the rest of the loop from running. The return keyword does not need a value to
    be returned either. You can use the return keyword on its own to end execution
    of your function where it may be.


    function kindaUseless(number)


    {


                  var i = 0;


                  while(true)


                  {


                                i++;


                                if(number == i)


                                {


                                              console.log(i);


                                              console.log(“That wasn’t the best way
    to do that”);


                                              return;


    }


    }


    }


    This is not a very useful example, but it shows the syntax of it. This loop will
    run as long as true...is true. This loops will run forever. We also have a variable
    called i that we simply make count up. In each iteration, we check if the number
    we are looking for is equal to our i variable. If it is, we print out i and also
    just print something about this function in general. Finally, we return the function.
    Since the function stops execution after it’s returned, the infinite loop is escaped,
    and our program can continue. This is extremely useful, especially in situations
    where you want to limit the number of iterations. For example, if you are searching
    for something in an array, and you find it, you may want to just return right
    there, to avoid wasting more iterations on looking for a duplicate or something.'
