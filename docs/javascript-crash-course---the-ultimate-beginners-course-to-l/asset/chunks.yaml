  trans: "\n\n# NodeJS 简介\n\nNodeJS 是常规 Apache 服务器的替代品。NodeJS 提供了实时服务器管理（而 Apache\
    \ 服务器仅在客户端请求 PHP 代码时才运行 PHP 代码），并允许使用 Javascript 进行服务器端编程。通过 NodeJS，你可以完全自定义服务器响应请求的方式。这非常有用，例如，如果你希望每当客户端向服务器发送特定请求时，都返回一个随机的文件或一组数据。此外，你还可以让服务器执行许多实时任务，比如响应套字（sockets），甚至是套字之间的交互。这可以用于很多事情，但我们将从游戏的角度来它。\n\
    \n## 设置项目\n\n第一步是下载并安装 NodeJS。现在让我们来设置项目。你可能想创建一个新文件夹来保持环境整洁。在这个文件夹中，创建一个名为 `package.json`\
    \ 的新文件。你可能需要打开你选择的文本编辑器并“另存为” `package.json`。在该文件中，你编写以下内容：\n\n```json\n{\n  \"\
    name\": \"在此处输入项目名称，不要有空格，但要用双引号括起来\",\n  \"version\": \"项目版本号\",\n  \"description\"\
    : \"项目的描述\",\n  \"dependencies\": {\n    \"mime\": \"¹.2.11\",\n    \"socket.io\"\
    : \"¹.1.0\"\n  }\n}\n```\n\n依赖项告诉我们将使用哪些 NodeJS 模块。这里有两个：Mime 和 SocketIO。`Mime`\
    \ 用于返回正在发送的文件正确类型。`SocketIO` 允许我们连接用户并能够动态地向用户发送数据，这可以修改用户的会话并向他们显示新数据。这有点类似于\
    \ AJAX，区别在于套字是实时的。在 AJAX 中，你必须等待发送请求、服务器响应，最后才能获取数据。而在套字中，你甚至不需要发送请求即可获取数据。你可能需要连接到服务器，但在之后，即使你没有请求，服务器也可以向你发送数据。这在游戏中非常重要，假设另一台电脑上的用户移动了，你的电脑无法得知该用户移动了。服务器必须将该数据发送给你，让服务器在需要更新你时直接发送数据比让客户端不断发送请求简单得多，后者会浪费更多带宽。\n\
    \n## 简单服务器示例\n\n一旦配置好 `package.json`，进入 `package.json` 所在的项目目录。然后输入 `npm install`。这将把\
    \ Mime 和 SocketIO 安装到你的项目中。下一步是创建一个新文件，随你意愿命名，扩展名为 `.js`。这将是你的主 Node 服务器代码，所以你可能想给它起一个类似的名字。让我们来看一些服务器代码。这是一个简单的示例。\n\
    \n```javascript\nvar http = require('http')\nvar server = http.createServer(handler);\n\
    \nserver.listen(80, \"127.0.0.1\");\n\nfunction handler(req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.write('Hello World\\n');\n  res.end();\n\
    }\n```\n\n这段代码非常简单。首先，我们使用 `require` 方法加载 `http` 模块。`require` 方法可以用于加载模块，包括自定义模块。然后我们创建一个服务器，并为它提供一个\
    \ `handler` 函数。这个 `handler` 函数有两个参数：`req`——请求（requests）；和 `res`——响应（response）。`Request`\
    \ 告诉我们关于用户请求的各种数据，包括 `url`、POST 数据或任何其他内容。`Response` 允许我们程序员用任何想要的数据响应用户的请求，无论这些数据是否与用户的请求有关。\n\
    \n在这个示例中，我们忽略了他们提出的任何请求，简单地返回状态码 `200`（意味着“良好”）和内容类型 `text/plain`（意味着我们正在向用户发送纯文本）。这是\
    \ `writeHead` 函数——我们正在写入响应的头部。另一方面，我们的正文需要使用 `write` 函数。这只是向我们的响应中写入文本，在本例中，我们简单地响应“Hello\
    \ World”。最后我们调用 `end` 函数，结束我们的响应并发送给用户。这就是我们的 `handler` 函数。最后，一旦我们创建了服务器，我们就告诉它监听\
    \ `127.0.0.1` IP 的 `80` 端口。这就是我们非常简单的服务器。\n\n## 复杂处理函数示例\n\n现在让我们让 `handler` 变得复杂一些。首先，尝试复制一个\
    \ Apache 服务器。这里有一个实现此功能的 Node 服务器。\n\n```javascript\nvar http = require('http');\n\
    var fs = require('fs');\nvar mime = require('mime');\nvar server = http.createServer(handler);\n\
    \nserver.listen(80, \"127.0.0.1\");\n\nfunction handler(req, res) {\n  fs.lstat(\"\
    public\" + req.url, function(err, stats) {\n    if(err) {\n      res.writeHead(400,\
    \ {'Content-Type': 'text/plain'});\n      res.write(\"An error attempting to retrieve\
    \ the file.\");\n      res.end();\n      return;\n    }\n    if(stats.isDirectory())\
    \ {\n      fs.readFile(\"public\" + req.url + \"/index.html\", \"utf8\", function(err,\
    \ data) {\n        if(err) {\n          res.writeHead(400, {'Content-Type' : 'text/html'});\n\
    \          res.write(\"An error attempting to retrieve the file.\");\n       \
    \   res.end();\n          return;\n        }\n        res.writeHead(0, {'Content-Type'\
    \ : 'text/html'});\n        res.write(data);\n        res.end();\n      });\n\
    \    } else {\n      fs.readFile(\"public\" + req.url, \"utf8\", function(err,\
    \ data) {\n        if(err) {\n          res.writeHead(400, {'Content-Type' : 'text/html'});\n\
    \          res.write(\"An error attempting to retrieve the file.\");\n       \
    \   res.end();\n          return;\n        }\n        res.writeHead(0, {'Content-Type'\
    \ : mime.lookup(req.url)});\n        res.write(data);\n        res.end();\n  \
    \    });\n    }\n  });\n}\n```\n\n"
- fmt: "\nSo what in the world is going on here? First, we have loaded two new modules:\
    \ `fs` (file system) and `mime` (detects the type of a file). In our handler,\
    \ we do a variety of things. First we get the stats on our `url`, but with “public”\
    \ appended to it. This means that no matter what, the handler will only look through\
    \ files in a “public” folder that must be in your project (right next to your\
    \ server’s `.js` file). This is to prevent people from seeing anything other than\
    \ what is public. It would not be very good if people could see your server’s\
    \ code, because then they may be able to find exploits easier and use them. We\
    \ also give this `lstat` method a callback. This is what makes the method asynchronous.\
    \ It is very important this stuff is asynchronous, because otherwise, your entire\
    \ server would freeze when it is checking for file data. This is bad because this\
    \ would mean your server would stop responding to users until the file stuff is\
    \ finished doing it’s thing.\n\nIn the callback, the first thing we do is check\
    \ if an error exists, and if it does, respond to the user with a very generic\
    \ error message (if you wanted to make this better, you could change this error\
    \ message based on what error you are getting, but this is supposed to be simple)\
    \ and do not proceed to the rest of the method. If there is no error, we check\
    \ if the file we are looking at is a directory. If it is, then we try and get\
    \ the default file, the `index.html` file. We do this by simply appending `/index.html`\
    \ and trying to read this file. The `readFile` also has a callback, meaning it\
    \ is also asynchronous. In this callback, we again check if we have an error,\
    \ and return a generic error message if so. Otherwise, we use the data and send\
    \ it to the client.\n\nNotice that we are assuming that the index file can only\
    \ be an html file. This may not always be the case, but most of the time, you\
    \ could have an html file that simply loads other dynamic data using AJAX. Now,\
    \ if the original request was not a directory, meaning it is a file, we simply\
    \ try and load that file, check if there is an error, and respond if we can. Notice\
    \ that for the “Content-Type”, we use `mime.lookup(req.url)`. This method finds\
    \ the appropriate content type for the file we are requesting. This is simply\
    \ to avoid confusing the browser, or whatever else is requesting from the server.\
    \ Now, this is nowhere close to the most complex handler you could make. You could\
    \ have it load and run php files potentially, and you could make the error handling\
    \ more robust, but as a simple Apache server, this will do just fine.\n\nThe next\
    \ thing we will learn is SocketIO. As stated above, sockets allow for real-time\
    \ data to be transmitted between the clients and the server. SocketIO is rather\
    \ easy to use, and we will not go into some of the complexities, but you could\
    \ do quite fancy stuff with what you will learn. So let’s learn it! The first\
    \ step is to load the module in your server.\n\n```javascript\nvar socketIOModule\
    \ = require‘socket.io’);\n```\n\nThe next step is to create a socketIO object.\
    \ Simply use `socketIOModule` as a function and use the `server` from our previous\
    \ example as the first parameter.\n\n```javascript\nvar socketIO = socketIOModule(server);\n\
    ```\n\nFinally, we will create a handler for the SocketIO ‘connection’ event.\
    \ This means that whenever a user connects through SocketIO, this handler will\
    \ fire.\n\n```javascript\nsocketIO.on(‘connection’, socketConnect)\n\nfunction\
    \ socketConnect(socket)\n{\n\n}\n```\n\nThe `socketIO` object means that globally,\
    \ all of SocketIO will call the `socketConnect` callback, whenever a connection\
    \ event is raised. Our callback, has the parameter of `socket`, which can be set\
    \ to respond to events in the same way the `socketIO` object is set to respond\
    \ to events—using the `on` method. The first parameter in this method is the event\
    \ name. You can make custom event names, you just type in the event name in this\
    \ first parameter, and whenever the server gets this event (from this socket),\
    \ it will call the second parameter—the callback. The callback’s parameters are\
    \ dependent on the type of event, but all custom events will only have a “data”\
