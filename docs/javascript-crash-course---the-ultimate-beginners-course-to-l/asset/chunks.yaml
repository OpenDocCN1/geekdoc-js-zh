    Java 程序通过 Java 虚拟机（`JVM`）运行，它本质上是一个操作系统的软件实现，用于执行 Java 程序。编译器（将代码转换为计算机可读指令的过程）分析
    Java 代码并将其转换为字节码（byte code），使计算机能够理解程序员发出的指令并相应地执行。


    在下载和安装 Java 时，该平台的发行方式有两种：Java 运行环境（`JRE`）和 Java 开发工具包（`JDK`）。`JRE` 本质上是 Java
    程序运行的 Java 虚拟机（`JVM`）。另一方面，`JDK` 是一个功能全的 Java 开发工具包，包含了 `JRE`、编译器、工具等。


    想要在自己的机器上运行 Java 程序的普通用户只需要安装 `JRE`，因为它包含了如前所述允许执行 Java 程序的 `JVM`。而与此相反，Java 程序员
    mutut 必须下载 `JDK` 才能实际编写 Java 程序。


    # 第 2 章：Java 的安装


    为了在机器上安装 Java，你必须下载以下内容：


    1. 适用于 Java 开发者的 IDE

    2. Java `JDK`


    下载这两个工具将开启你通往 Java 程序员的之路。IDE（集成开发环境）是程序员使用的一个软件包程序，因为它包含了处理和执行代码所需的工具。IDE 包含一个代码编辑器、一个编译器、调试器和一个图形用户界面（`GUI`）。有许多类型的
    IDE，但最常用的是：


    1. Netbeans

    2. Eclipse


    在本指南中，由于其简单易用的特性推荐使用 `Eclipse`。要下载 `Eclipse`，请使用以下链接：


    [`eclipse.org/downloads/`](https://eclipse.org/downloads/)


    进入该链接后，你将找到这个：


    ![`lh5.googleusercontent.com/L1DhiS0lHF2Wt52-NpfmrM1VQ_f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g`](img/Image00002.jpg)


    然后，根据你拥有的操作系统/处理器类型，选择 Windows 32 位操作系统或 Windows 64 位。


    一旦安装好 IDE，我们将开始下载并安装 `JDK`，这将允许我们与代码编辑器交互以便执行和创建 Java 代码。


    要下载 `JDK`，请访问以下链接：


    [`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)


    进入该链接后，找到这张图：


    ![e319d84467.png](img/Image00003.jpg)


    一旦安装了 `JDK`，你就可以相应启动 `Eclipse`。


    从 `Eclipse` 下载包中解出的文件夹将包含一个可以启动的 `eclipse.exe`。启动后，你将看到以下图片：


    ![`lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf_NCgjhG604yFXhZCBsy3GfC1y_wg6v4gEp4uFNT80`](img/Image00004.jpg)


    此提示只是要求你设置输出目录，用于保存你编写的所有代码。在相应选择该目录后，点击“OK”继续。


    你现在应该处于这个屏幕（或类似的屏幕）：


    ![`lh4.googleusercontent.com/VGvC-jry3vINgfeT3wHIxCNknMZ42pgBwnuoQoVyeW2QyyeIcbrRPvsLebgE8ED5nQvKz4adYyc3smu1QDvifZxfKuu9kxPvBmbA3KOIx8oK5nfz7U5En8o0j_ZRrxpagxUV1cE`](img/Image00005.jpg)


    操作步骤：


    1. 点击 `File`（文件）

    2. 点击 `New`（新建）→ `Java Project`（Java 项目）


    ![`lh3.googleusercontent.com/Uul4AHUr2ZURDElR9Y503X0iTSRDnAT0yK1j5R489G0kjKa8knxzkCrbXTZOkZPVBJ57VzYFAv2MCDPQ98GergtcUD9efhjBn8WoeWPLAZ9c-p1Jofiju6tB-mtiEMfP4v4Ia08`](img/Image00006.jpg)


    3. 在“Project name:”（项目名称：）字段中输入项目名称

    4. 点击“Finish”（完成）

    5. 现在右键点击 `src` → `New`（新建）→ `Class`（类）


    ![`lh3.googleusercontent.com/c1DJ75yt6_Bp0f-XdRKqu2Z7WY_Q3PbDSjkXq-iWmI-NTzRdaUrqLpIzKBx6nnvTPiwAR19HRF8giYlstqw8LeRR4uWDrdXuPTP-OE`](img/Image00007.jpg)


    6. 在 name 字段中填写任何包含字母且不包含特殊字符的内容。例如：`ThisIsAClass`

    7. 点击 Finish（完成）

    8. 你现在将看到显示以下内容的屏幕：


    ```

    public class ThisIsAClass {


    }

    ```


    你已成功完成 Java 的安装！


