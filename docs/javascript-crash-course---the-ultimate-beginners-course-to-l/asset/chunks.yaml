    \ same for the `nextHeights` array. After the loops are finished, we call `generateStarMap`\
    \ to fill the `starMap` and `nextStarMap` arrays. Finally, we call `drawHeights`.\n\
    \nThe `generateStarMap` function creates an array and starts a loop for `1000`\
    \ times. In this loop, it adds a star object to the array, which contains an `x`\
