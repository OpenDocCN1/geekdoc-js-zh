    divide the page into sections; “input” elements, which allow users to give input
    to your code; “a” elements, which are links to websites; “li” elements, which
    displays a list of items; “canvas” elements, which allow us as developers to draw
    graphics to the screen through code; and many more.


    # Chapter 10


    # AJAX


    AJAX stands for Asynchronous Javascript And XML. This is the method of asynchronously
    retrieving data from a server, usually some sort of XML file, like an HTML file.
    AJAX can be used to dynamically load parts of your web page, specifically things
    that need to be calculated server-side and sent to the client, for example, on
    YouTube, you could open your “My Subscriptions” page and the server would calculate
    which videos you need to see based on your subscriptions and load the data for
