  trans: "\n这里到底发生了什么？首先，我们加载了两个新模块：`fs`（文件系统）和 `mime`（检测文件类型）。在我们的处理器（handler）中，我们做了很多操作。首先，我们获取\
    \ `url` 的统计信息，但在其后面附加了“public”。这意味着无论如何，处理器都只会查找名为“public”文件夹中的文件，而该文件夹必须存在于你的项目中（紧邻你服务器的\
    \ `.js` 文件）。这样做是为了防止人们看到公共内容以外的任何东西。如果人们能看到你的服务器代码，将非常不妙，因为他们可能更容易找到漏洞并利用它们。我们还为这个\
    \ `lstat` 方法提供了一个回调函数。这使得该方法是异步的。这些内容是异步的非常重要，否则你的整个服务器在检查文件数据时将会冻结。这是糟糕的，因为这意味着你的服务器在文件处理完成之前，将停止响应用户的请求。\n\
    \n在回调函数中，我们做的第一件事是检查是否存在错误，如果存在，向用户返回一个非常通用的错误消息（如果你想让它更好，可以根据收到的错误类型更改此错误消息，但这里应该保持简单），并且不再继续执行方法的其余部分。如果没有错误，我们检查正在查看的文件是否为目录。如果是目录，我们就尝试获取默认文件，即\
    \ `index.html` 文件。我们通过简单地追加 `/index.html` 并尝试读取该文件来实现。`readFile` 也有一个回调函数，意味着它也是异步的。在这个回调函数中，我们再次检查是否有错误，如果是，则返回一个通用错误消息。否则，我们使用数据并将其发送给客户端。\n\
    \n注意，我们假设索引文件只能是 html 文件。情况可能并不总是如此，但在大多数情况下，你可以有一个 html 文件，它只需通过 AJAX 加载其他动态数据。现在，如果原始请求不是目录（意味着它是一个文件），我们只需尝试加载该文件，检查是否有错误，并在可以的情况下进行响应。注意，对于“Content-Type”，我们使用了\
    \ `mime.lookup(req.url)`。该方法会为我们请求的文件找到适当的内容类型。这仅仅是为了避免混淆浏览器或任何其他向服务器请求的实体。现在，这离你能够制作的最复杂的处理器还差得远。你可以让它可能加载并运行\
    \ php 文件，还可以让错误处理变得更健壮，但作为一个简单的 Apache 服务器，这已经足够了。\n\n我们将学习的下一步是 SocketIO。如上所述，套字（sockets）允许客户端和服务器之间传输实时数据。SocketIO\
    \ 相当易用，我们不会深入探讨某些复杂性，但你可以利用所学的知识做很多非常花哨的东西。所以，让我们学习它吧！第一步是在你的服务器中加载该模块。\n\n```javascript\n\
    var socketIOModule = require‘socket.io’);\n```\n\n下一步是创建一个 socketIO 对象。只需将 `socketIOModule`\
    \ 当作一个函数调用，并使用我们上一个示例中的 `server` 作为第一个参数即可。\n\n```javascript\nvar socketIO = socketIOModule(server);\n\
    ```\n\n最后，我们将为 SocketIO 的‘connection’（连接）事件创建一个处理器。这意味着每当用户通过 SocketIO 连接时，此处理器就会触发。\n\
    \n```javascript\nsocketIO.on(‘connection’, socketConnect)\n\nfunction socketConnect(socket)\n\
    {\n\n}\n```\n\n`socketIO` 对象意味着全局范围内，每当触发连接事件时，所有的 SocketIO 都会调用 `socketConnect`\
    \ 回调。我们的回调有一个参数 `socket`，它可以被设置为以与 `socketIO` 对象响应事件相同的方式来响应事件——即使用 `on` 方法。该方法的第一个参数是事件名称。你可以创建自定义事件名称，只需在第一个参数中输入事件名称即可，每当服务器收到此事件（来自此\
    \ socket）时，它就会调用第二个参数——即回调函数。回调的参数取决于事件的类型，但所有自定义事件将只有一个“data”参数，它可以是任何对象。`Socket.emit`\
    \ 是交换的另一侧。它实际上是向 socket 另一端的客户端或服务器发送一个事件。第一个参数是以字符串形式发送的要发送的事件。第二个参数是待发送的对象。\n\
    \n```javascript\nsocketIO.on(‘connection’, socketConnect)\n\nfunction socketConnect(socket)\n\
    {\n    socket.emit(‘greetClient’, {});\n    socket.on(‘greetServer’, function(data){\n\
    \        if(data.playerName == “Spykill”)\n        {\n            socket.emit(‘greetClient’,\
    \ {});\n        }\n    });\n}\n```\n\n在这个系统中，当用户连接时，服务器会发送一个“greetClient”事件。在客户端，我们将处理它，并可能会发送一个带有等级数据的“greetServer”事件。现在让我们来看代码。\n\
    \n```html\n<!DOCTYPE html>\n<<html>\n<head>\n    <title></title>\n    <script\
    \ src=\"https://cdn.socket.io/socket.io-2.0.js\"></script>\n    <script type=\"\
    text/javascript\">\n        var socket = io();\n        socket.on('greetClient',\
    \ function(data){\n            socket.emit('greetServer', {rank: ‘admin’});\n\
    \        });\n        socket.on(‘changeRank’, function(data){\n            if(data.rank\
    \ == ‘admin’)\n            {\n                document.write(“You are admin!”);\n\
    \            }\n        });\n    </script>\n</head>\n<body>\n\n</body>\n</html>\n\
    ```\n\n我们需要做的第一件独特的事情，是从 socket.io 网站加载 `socket.io.js` 文件。你也可以从你的服务器加载它，但这并不重要。接下来，我们编写脚本。通过调用\
    \ `io()` 连接到我们的 SocketIO 服务器。然后，我们告诉该连接在收到 `greetClient` 事件时运行回调函数。在这个回调函数中，我们简单地发射（即发送）一个名为\
    \ `greetServer` 的返回事件，并将 `playerName` 设置为 “Spykill”，你回想起服务器将响应并发射 `changeRank`\
    \ 事件。\n\n### Canvas\n\n使用 canvas 的第一步是创建元素。在 html 文件的主体中，任何你希望 canvas 出现的地方，只需使用\
    \ `<canvas>` 标签即可。\n\n```html\n<body>\n    <canvas></canvas>\n</body>\n```\n\n\
    接下来我们需要为 canvas 设置一些尺寸。在第一个 canvas 标签中，添加 `width` 和 `height` 属性，并将它们设置为所需的值。你还应该设置\
    \ `id` 属性作为一个标识符，以便找到该元素。\n\n```html\n<canvas id=’ourCanvas’ width=’800’ height=’600’></canvas>\n\
    ```\n"
- fmt: "\nYou may also want to add a border of some sort to distinguish the background\
    \ from the canvas. This is getting into CSS territory, so I will keep this short.\
    \ Just set the style attribute to “border:black 1px solid”. This will make a black\
    \ border with a width of 1 pixel around your canvas.\n\n```html\n<canvas id=’ourCanvas’\
    \ width=’800’ height=’600’ style=’border:black 1px solid’></canvas>\n```\n\nNow\
    \ that we have our canvas set up, we have to use it. We need to make a function\
    \ that will run after the canvas has loaded. The first thing it must do is find\
    \ the canvas, using its id. Then it must get a 2d context for the canvas, which\
    \ will be used to draw to the canvas.\n\n```javascript\nfunction doCanvasStuff()\n\
    {\n    var canvas = document.getElementById('ourCanvas');\n    var context = canvas.getContext('2d');\n\
    }\n```\n\nBefore we continue, there is one final thing we must do to our canvas\
    \ element before continuing. We must set its `onload` attribute to execute our\
    \ `doCanvasStuff` function, so that once the canvas has loaded, it will run our\
    \ canvas code.\n\n```html\n<canvas id=’ourCanvas’ width=’800’ height=’600’ style=’border:black\
    \ 1px solid’ onload=’doCanvasStuff()’></canvas>\n```\n\nNext, we need to use our\
    \ context to draw some stuff. First let’s talk about the styles. Styles describe\
    \ how the computer will draw to the canvas. This can mean that the style is a\
    \ solid colour, or maybe it’s a gradient. There are a variety of things you can\
    \ do with styles, but we will focus on solid colours for most of this. There are\
    \ two styles that you can set: the `fill style` and the `stroke style`. The `fill\
    \ style` does exactly what it sounds like—it fills shapes. The `stroke style`\
    \ basically follows the line of the shape. You can use the stroke to outline your\
    \ shape. To set a style to a solid colour, simply set the context’s `strokeStyle`\
    \ or `fillStyle` to an html colour value. Whether this colour value is hexadecimal\
    \ or it is the value of an `rgb` function is not important. Here is an example\
    \ of both.\n\n```javascript\ncontext.strokeStyle = ‘#88888’;\ncontext.fillStyle\
    \ = ‘rgb(200, 45, 130)’\n```\n\nHere we set the stroke style to a hexadecimal\
    \ value (notice that we have a pound sign, #, in front of our hex value), which\
    \ evaluates to grey, and we set our fill style to the value of the `rgb` function\
    \ (notice that this function is in quotes, as this is not a JavaScript function,\
    \ but either an HTML function or a CSS function) with the red value set to 200,\
    \ the green to 45, and the blue to 130, which ends up looking like a pink colour.\
    \ Now whenever we call a fill function, or a stroke function, these colours will\
    \ be used. So how do we actually draw things? Let’s start with a rectangle. There\
    \ are multiple methods to make a rectangle. The first is to use the `fillRect`\
    \ function (or the `strokeRect` function, as this will allow you to just outline\
    \ a rectangle). It takes four parameters, which you could probably guess: x position,\
    \ y position, width, and height. Be aware that the x and y positions start at\
    \ an origin at the top-left. You can have negative x and y values, just part of\
    \ the rectangle will be cut off. All of these values are measured in pixels.\n\
    \n```javascript\ncontext.fillRect(100, 100, 200, 200);\n```\n\nThis rectangle\
    \ will go from a position of (100, 100) to a position of (300, 300). Another way\
    \ to make a rectangle (and is actually more flexible, so you could modify it to\
    \ make other shapes) is to use paths. Paths simply define a shape, and have a\
    \ variety of uses. To create a path, simply call the `beginPath` function. It\
    \ takes no parameters. Next, we need to start our shape. We do this by calling\
    \ the `moveTo` function with the parameters of an x and y position.\n\n```javascript\n\
    context.beginPath();\ncontext.moveTo(100, 100);\n```\n\nNext we define the lines\
    \ of our rectangle using the `lineTo` function, with the parameters of an x and\
    \ y position. This will make a line from our current position, which we last set\
    \ using the `moveTo` function, to the position defined by the parameters. Be aware\
    \ that after using the `lineTo` function, the current position is set to the position\
    \ defined by the parameters.\n\n```javascript\ncontext.beginPath();\ncontext.moveTo(100,\
    \ 100);\ncontext.lineTo(300, 100);\ncontext.lineTo(300, 300);\ncontext.lineTo(100,\
    \ 300);\ncontext.lineTo(100, 100);\n```\n\nThe last `lineTo` call depends on whether\
    \ you wish to stroke your rectangle or not. If you do not add this last `lineTo`,\
    \ there will not actually be a line on that side of the rectangle, meaning the\
    \ stroke will not draw a line there. Fill on the other hand, will fill that area\
    \ no matter what, because to make a solid shape, it must connect the last point\
    \ with the first if a line does not exist there.\n\nThe final thing we need to\
    \ do is tell the computer to actually draw the shape in some way. Here we will\
    \ do both a stroke and a fill. Be careful with the order. You generally want to\
    \ stroke and fill. The final thing we need to do is tell the computer to actually\
    \ draw the shape in some way. Here we will do both a stroke and a fill. Be careful\
    \ with the order. You generally want to stroke and fill. The final thing we need\
    \ to do is to tell the computer to actually draw the shape in some way. Here we\
    \ will do both a stroke and a fill. Be careful with the order. You generally want\
    \ to stroke and fill. The final thing we need to do is to tell the computer to\
    \ actually draw the shape in some way. Here we will do both a stroke and a fill.\
    \ Be careful with the order. You generally want to stroke and fill.\n"
