    After drawing the star maps, we begin a path, and start it at the left side of
    the map, meaning the offset value going left and at half the canvas height, as
    we start at 0. Then we loop through the `heights` array, and in each iteration,
    we draw a line to each height value, where the `x` value is the percentage through
    the `heights` array we are looking at, multiplied by the width of the canvas,
    meaning that the `heights` will be evenly spaced along the width of the canvas.
    The height is half the canvas multiplied by the height, so if the `height` is
    -1, it will be at the lowest height, and if the `height` is 1, it will be at the
    highest height. We do the same thing with the `nextHeights`, except we shift it
    over just as we shift the `nextStarMap`. Finally, we finish our terrain by drawing
    lines to the bottom right of the canvas and the bottom left of the canvas. We
    then fill it with the colour black. This makes a rather pretty, infinitely-scrolling,
    randomly generated terrain.


