  trans: "\nJavascript 是一种最常用于网站交互的编程语言。它可以用于让网页变得动态且可交互，甚至可以用 Javascript 和 HTML5\
    \ 制作出游戏！Javascript 代码要么被放置在 HTML 文档中（HTML 是所有网页编写的格式，或者至少是你的浏览器翻译网页时使用的格式），要么是从\
    \ HTML 文档中引用的。如果你想更深入地了解这一点，请去寻找一个 HTML 教程。\n\nJavascript 的执行方式不是通过任何特殊的第三方程序（比如编译器，如果你曾经学习过基于应用程序的编程语言），而是使用像\
    \ Chrome、Firefox、Internet Explorer 等主流网络浏览器对 Javascript 的内置支持。因此，你只需要将 Javascript\
    \ 代码嵌入到 HTML 语言中，HTML 是浏览器用于解释网页内容（如文本和外观，在 CSS 的帮助下）的标准语言。\n\n编写 Javascript 代码所需的工具非常简单，可以从最基础的记事本开始。对于本指南来说，我们将使用\
    \ Sublime Text，它是一款适用于 HTML/CSS 和 Javascript 等网络开发语言的优秀文本编辑器。如果你不喜欢 Sublime Text，另一个可选的文本编辑器是\
    \ Notepad++，它也是另一个编写与网络开发相关代码的优秀工具。\n\n# 第 2 章\n\n# 理解 HTML 和 CSS 基础的重要事项\n\n\
    ## HTML\n\n为了理解我们如何实现并使用 Javascript 语言，我们必须理解网页最基本形式的形式是如何运作的。HTML 全称为超文本标记语言（HyperText\
    \ Markup Language）。它是用于创建静态网页的标准标记语言。这就是为什么在 Javascript 的帮助下，我们可以让这些网页变得更加动态和响应迅速。\n\
    \n### 标签 (Tags)\n\n在 HTML 中，有一个标准的约定来开始和结束一个语句。在英语中，我们必须以大写字母开头句子并以句号结尾，以保持易于理解的标准写作流。那么，HTML\
    \ 使用“标签”（Tags）的概念来理解你具体在写什么。在 HTML 中，你必须记住几个关键标签，并理解它们的用途。\n\n在任何 HTML 文件中，都必须遵循一个标准的结构。这里有一个显示该示例的样本代码：\n\
    \n```html\n<html>\n<head>\n    <title> 这是网页的标题 </title>\n</head>\n<body>\n   \
    \ 这是网页的内容。\n</body>\n</html>\n```\n\n当你创建一个标签时，必须以“<”符号开头，然后标明标签名称，最后用“>”符号结束。然后，标签的“内部”部分或标签内将放置其余的代码。要结束标签，你采用与开始标签相同的约定，但以“/”结尾。这就是为什么你看到文档顶部是：`<html>`，而文档结尾是：`</html>`。\n\
    \n视觉演示：\n\n```html\n<tagname> 标签内的内容 </tagname>\n```\n\n现在让我们分析下下面的样本代码：\n\n`<html>`\n\
    这个标签指示网站的 HTML 部分何时开始，因此它必须出现在每个 HTML 文档中。该标签在文档结束处关闭。因此，`<html>` 标签是内部所有标签（子标签）的父标签。\n\
    \n`<head>`\n此标签在加载网页时包含所有的头部信息。此标签内的所有内容都不会显示给用户，主要用于初始化脚本以准备使用。例如，在头部部分设置一个 `script`\
    \ 标签，为整个 HTML 文档的其余部分使用做准备。我们在学习 jQuery 库时将需要这样做。\n\n`<title>`\n此标签的内容将包含网页的标题。\n\
    \n`<body>`\n这是网站的整个内容部分。就像任何文章一样，你有论点、正文和结论。这在标签形式上的这种理念是相同的。\n\nHTML 中还有许多其他标签你可以在网上查询。让我们来看各种示例并识别一些有用的标签。\n\
    \n```html\n<html>\n    <head>\n        <title> “<p>”标签的示例 </title>\n    </head>\n\
    \    <body>\n        <p> 这是一个段落。 </p>\n    </body>\n</html>\n```\n\n上述示例中加粗的标签本质上描述了一个段落，并对其进行了格式化，使其具有正确的内边距/间距，而无需你操作。\n\
    \n```html\n<html>\n    <head>\n        <title> “<p>”标签的示例 </title>\n    </head>\n\
    \    <body>\n        <p> 这是一个段落。 </p>\n    </body>\n</html>\n```\n\n上述示例中加粗的标签本质上描述了一个段落，并对其进行了格式化，使其具有正确的内边距/间距，而无需你操作。\n\
    \n![输出](https://lh.googleusercontent.com/vnQxDcrM4I9w1I1I1I1I1I1I1I1I1I1I1I1I6Ube763FLzZ6I1I1I1I1I1I1I1/00000.jpg)\n\
    \n### 输出 (Output)\n\n最后，让我们来看一下 HTML 中的注释概念。有时你可能编写某些代码但并不实际将其打印到屏幕上，只是想在代码中添加提醒。你可以通过以\
    \ `<!--` 开头并以 `-->` 结束来进行注释。\n\n因此，如果我对某一行进行注释，我会这样做：\n\n```html\n<p> 这是段落 </p>\n\
    <!-- 这一行输出一个“这是段落” -->\n```\n\nHTML 中有很多标签，还有属性，属性包含的值用于确定标签内容如何显示或被 CSS 解释。在学习\
    \ Javascript 和 CSS 时需要注意两个属性是：`id` 和 `class`。\n\n你可以将这些用于任何标签，例如 `<body>` 标签内的\
    \ `<p>` 标签。\n\n属性的工作格式如下：\n\n```html\n<p id=\"content\"> 这是网页的内容。 </p>\n```\n\n\
    如示例所示，为了声明属性，你必须在第一个标签 `<p>` 内留空，然后标明已知属性，例如 `id`。然后为了给它赋值，你必须有一个等号，然后是两个引号以及引号内的值。在这种情况下，这个段落包含属性\
    \ `id`，其值为“content”——这可以通过你将要学习的选择器作为 CSS 和 Javascript 等语言的引用。\n\nHTML 中仍有许多标签可以供你学习，但这些是你开始编写时需要的基础标签。此外，你现在应该理解\
    \ HTML 文档的基本结构了。\n\n让我们回顾一下：\n\n- `<html>` 和 `</html>` 定义 HTML 文档，标签本身仅仅是将其内部内容定义为\
    \ HTML 类型，以便浏览器能够解释。\n- `<head>` 和 `</head>` 为文档提供信息并初始化任何外部脚本或样式表。\n- `<title>`\
    \ 和 `</title>` 仅为浏览器提供信息以显示 HTML 文档的标题。\n\n"
- fmt: "\nThe tag `<body>` and `</body>` holds all the content of the document which\
    \ includes the paragraphs, navigation bars, tables, images, etc.\n\nThe tag `<h1>`\
    \ and `</h1>` simply formats text in between it as a header or a title to a paragraph.\n\
    \nThe tag `<p>` and `</p>` formats text in between it as a paragraph accordingly.\n\
    \n## CSS \n\nCSS stands for “Cascading Style Sheets” and essentially styles how\
    \ HTML elements are displayed on the web browser.\n\nNow, before we move on, let’s\
    \ quickly go over how commenting works in CSS. Just like in HTML, commenting is\
    \ useful, and can also be done in CSS, but it has different syntax for it. In\
    \ order to comment in CSS, you must use the following notation:\n\n```css\n/*\
    \ This is a comment */\n```\n\nThe text in between the slash and symbol is not\
    \ processed and is simply there for human reading. So to begin a comment you must\
    \ do `/*` and to end a comment you must do `*/`.\n\nLet’s scan through the idea\
    \ of how to write CSS code.\n\n### Example:\n\n```css\np {\n    color: red;\n\
    \    font-size: 14px;\n}\n```\n\nIn the above example, there are a few critical\
    \ things to note of the format in the above CSS code.\n\nThe element we must specify\
    \ when writing CSS code is the tag name or the selector.\n\n```css\np {\n    color:\
    \ red;\n    font-size: 14px;\n}\n```\n\nThe bolded text indicates the selector,\
    \ which is the `<p>` tag, which handles the paragraphs of the document. If you\
    \ place any text in between `<p>` in the `<body>`, you will now see the text being\
    \ red, and the font size being 14 pixels. Let’s move on to analyzing this code\
    \ further.\n\n```css\np {\n    color : red;\n    font-size : 14px;\n}\n```\n\n\
    The bolded text indicates the property in the above example. In every selected\
    \ tag, you must indicate properties of that tag, like the color of the text, the\
    \ size of the text, the style of the text, the font-weight and much more. You\
    \ can always look for any property that you’re wanting on the internet. There\
    \ are many properties and we won’t be going over them in this guide. There are\
    \ different properties that are applied to different tags. For the “p” tag in\
    \ this instance, we can reference the `color` property and the `font-size` property.\
    \ Upon referencing them within curly braces (which simply indicates the block\
    \ of properties that applies to the selector which is `p`) and then assigning\
    \ it to a certain value.\n\n```css\np {\n    color: red ;\n    font-size: 14px\
    \ ;\n}\n```\n\nTo assign a certain value to the property of `color`, you must\
    \ make a colon symbol which simply separates the property and the value, and then\
    \ type out a value accordingly. Once you have written out the property and the\
    \ value, use the semi-colon as a way to let the browser know you have ended that\
    \ statement so it can read the next.\n\nWhen working with colors, instead of using\
    \ the standard red, blue, yellow, etc - you can reference more specific colors\
    \ depending on `RGB` values (Red, Green, Blue) which can be obtained using an\
    \ HTML selector. This is a link of a site that can give you HTML codes for use\
    \ in your CSS: http://html-color-codes.info/\n\nTo review CSS syntax let’s look\
    \ at it in the following:\n\n1. `p`\n2. `{`\n3. `color:`\n4. `red;`\n5. `}`\n\n\
    The code above takes the color of the paragraph and changes the color to red.\
    \ Each line has been numbered, but wouldn’t be included in the code. It is numbered\
    \ so we can scan through each line and go how it works:\n\n1. Selector/Tag\n2.\
    \ Indicating the start of the properties\n3. Property/Attribute with a colon to\
    \ indicate the value\n4. Value of the Property/Attribute and then semi-colon to\
    \ indicate the end of statement\n5. Indicating the end of the properties for the\
    \ certain selector which was `p`\n\nRemember, you can do this as many times, remember\
    \ to separate the selector blocks so the browser doesn’t confused. Well, let’s\
    \ first go how you can actually start coding in your HTML document. To begin,\
    \ you must go between your `<head>` tags and input the following:\n\n```html\n\
    <html>\n<head>\n    <title>This webpage title</title>\n    <style type=\"text/css\"\
    >\n        p {\n            color: red;\n            font-size: 14px;\n      \
    \  }\n    </style>\n</head>\n<body>\n    <h1>This is Header text</h1>\n    <p\
    \ id=\"content\">This is the content of the webpage.</p>\n</body>\n</html>\n```\n\
    \nIn order to start coding CSS in an HTML document, you must use the `style` tag\
    \ with the help of the `type` attribute which references to the standard convention\
    \ `text/css` which you must use every time you want to write CSS in your HTML\
    \ document. Within this style tag, is your CSS code which references successfully\
    \ to all `p` tags in the HTML document.\n\nWell, what if you’d like to only reference\
    \ a specific paragraph? Now the reason I like to call `p` instead of a tag is\
    \ because term selector is a general term and what can be put in position of `p`\
    \ is also general. Instead of putting an actual tag being referenced in the HTML\
    \ document, you are able to reference an id using a hashtag and then the id name:\n\
    \n```css\n#idname {\n    color: red;\n    font-size: 12px;\n}\n```\n\nYou can\
    \ also use the selector to reference a tag with a `class` attribute with a certain\
    \ name:\n\n```css\n.classname {\n    color: red;\n    font-size: 12px;\n}\n```\n\
    \nNow you must be wondering `id` or `class` could ever helpful. Let me enlighten\
    \ you with the following sample code:\n\n```html\n<html>\n<head>\n    <title>This\
    \ webpage title</title>\n    <style type=\"text/css\">\n        #content {\n \
    \           color: red;\n            font-size: 14px;\n        }\n    </style>\n\
    </head>\n<body>\n    <h1>This is Header text</h1>\n    <p id=\"content\">This\
    \ is the content of the webpage.</p>\n</body>\n</html>\n```\n\nIn the above example,\
    \ you can see that we listed a specific paragraph to be affected by the change\
    \ we listed in the CSS within the `<head>` tag. This is one way that you can use\
    \ the id selector. To use the class selector (not really a big difference, just\
    \ two preferences) is to do the following:\n\n```html\n<html>\n<head>\n    <title>This\
    \ the webpage title</title>\n    <style type=\"text/css\">\n        .content {\n\
    \            color: red;\n            font-size: 14px;\n        }\n    </style>\n\
    </head>\n<body>\n    <h1>This is Header text</h1>\n    <p class=\"content\">This\
    \ is the content of the webpage.</p>\n</body>\n</html>\n```\n"
