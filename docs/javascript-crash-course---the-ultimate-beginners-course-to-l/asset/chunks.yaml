    5*4 = 20


    var x = 5;


    var y = 4;


    var total = 0;


    total= x * y;


    In the example above, a variable of total is taking the multiplication of two
    variables (x and y) and multiplying them together to produce the value of 20.


    ### Division


    20/5 = 4


    var x = 20;


    var y = 5;


    var total = 0;


    total= x / y;


    In the example above, a variable of total is taking the division of two variables
    (x and y) and dividing them together to produce the value of 20.


    ### Modules


    7 % 2 = 1


    var x = 7;


    var y = 2;


    var total = 0;


    total= x % y;


    In the example above, a variable of total is taking the remainder of two variables
    (x and y) and by finding how many times 2 multiplies in to 7 evenly before it
    can’t, and the remainder is the output. For example:


    How many times does 2 get in to 7?


    3 times.


    2 * 3 = 6


    7 - 6 = 1


    Therefore, 7 modules 2 is equal to 1 because that is the remainder.


    ### Post-Incrementation


    5 + 1 = 6


    var x = 5;


    x++;


    var y = 0;


    y = x++;


    In the example above, a variable of x is being incremented by the value of 1\.
    Therefore, the value of x must now be 6 because x + 1 = 6 as x = 5\. If you were
    to print out the value of x, the output would be 6\. You can do x++ again and
    the value would then become 7\. The value of y on the other hand is still 6 because
    it is post incrementing meaning that the value of x has changed by an increment
    of 1 (to 7), but the value of y has yet to be changed until it is called again
    (y = x++) which in the case would be y = 7.


    ### Pre-Incrementation


    5 + 1 = 6


    var x = 5;


    ++x;


    var y = 0;


    y = ++x;


    In the example above, a variable of x is being incremented just like it was when
    it was post-incrementing as a variable by itself. The value of y on the other
    hand changes directly to 6 because it is pre-incrementing meaning that the value
    of x has changed by an increment of 1, and the value of y changes, meaning that
    y = 7.


    ### Post-Decrementing


    5 - 1 = 4


    var x = 5;


    x--;


    var y = 0;


    y = x--;


    In the example above, a variable of x is being decremented by the value of 1\.
    Therefore, the value of x must now be 4 because x - 1 = 4 as before x = 5\. If
    you were to print out the value of x, the output would be 4\. You can do x-- again
    and the value would then become 3\. The value of y on the other hand is still
    4 because it is post decrementing meaning that the value of x has changed by a
    decrement of 1, but the value of y has yet to be changed until it is called again
    (y = x--) which in the case would be y = 3.


    ### Pre-Decrementing


    5 - 1 = 4


    var x = 5;


    --x;


    var y = 0;


    y = --x;


    In the example above, a variable of x is being decremented by the value of 1\.
    Therefore, the value of x must now be 4 because x - 1 = 4 as before x = 5\. If
    you were to print out the value of x, the output would be 4\. You can do --x again
    and the value would then become 3\. The value of y on the other hand is 3 because
    it is pre decrementing meaning that the value of x has changed by a decrement
    of 1, and the value of  y has changed.


