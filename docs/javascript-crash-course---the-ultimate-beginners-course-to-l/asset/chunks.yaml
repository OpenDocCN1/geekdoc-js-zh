  raw: 'In the above example, we are checking if x is equal to 5, if it is then what
    we do is break out of the loop, meaning the output of this loop then becomes:


    Current Number: 0


    Current Number: 1


    Current Number: 2


    Current Number: 3


    Current Number: 4


    As seen in the output above, the loop breaks out once it reaches the fifth iteration
    meaning, to essentially stop the loop from continuing on any further.


    If we combine the conceptual understanding of loops and arrays, we can come up
    with complex code - that is why we will be learning arrays, before we look at
    a real-world application where this may be useful to use so you can gain a better
    understanding of why loops and arrays are helpful. You will be using loops and
    arrays a lot when programming even if it doesn’t seem like it right now.


    ## Arrays


    Arrays in programming are helpful because it allows you to create lists of strings/numbers/objects
    or whatever data type you can think of. Again, this might not be apparent at first
    but will be when you start to program and realize that you may need to use arrays
    in certain instances. So an array is basically a single variable that holds multiple
    values that can be accessed individually. Let’s go over the syntax of how an array
    declaration would work.


    In order to declare a variable, you must do the following:


                  var names = [“John”, “Bob”, “Tom”];


    In the example above, what we are doing is declaring a variable with the name
    of names, and then we are assigning it a list of values, which are of string type.
    So in order to assign values to the array, we added square brackets which simply
    set the boundaries for the array. Then, we noted that the array type is string
    by surrounding each element by quotation marks and then adding a comma in between
    each element to indicate that it is a different element in the array.


    In order to access specific element values from the array, we use the following
    syntax:


    alert(names[0]);


    In the above example, what we are doing is alerting the value of the array’s index
    of 0\. In arrays, we refer to the values of the array through the index value
    - and the index value starts at 0\. Therefore, “John” is index of 0, “Bob” is
    index of 1 and “Tom” is the index of 2\. The length of the array itself is 3\.
    In order to get the length of the array we use the following property:


                  alert(names.length);


    Since arrays in general are objects (you will learn what this means later) they
    have variables and functions, and length is a property of arrays, and therefore
    can be accessed by the names variable since it is a variable of array type. The
    output of this piece of code would be 3 since it would count the first element
    of the array as 1 and then 2 and so forth.


    Now let’s say that we want to declare an array but not assign it any values until
    later in the code. Then you would do the following:


    var names = []


    names[0] = “John”;


    names[1] = “ Bob”;


    names[2] = “Tom”;


    In the above example, we are declaring an empty array that we preparing to add
    elements to, and we do so by referring to an index that doesn’t yet exist and
    give it a certain value. Now we can refer to the names array’s index and retrieve
    the appropriate value that was assigned to it.


    alert(names[0);


    The above example now returns “John” as it was assigned the string John. One thing
    to note is that you’re able to overwrite index values by simply using the assignment
    operator for the certain index that you would like to overwrite and then assign
    it something else.


    The other way of declaring a Javascript array is by doing the following:


                  var anArray = new Array(30);


    The above code simply does the same thing as the former way of declaring a variable,
    and is actually preferred over this way, but this way is being informed to you
    incase you ever wanted to use it for whatever reason. In this example, there are
    30 undefined elements in the anArray variable and can be assigned like they were
    before.


                  var anArray = new Array(10, 20);


    In the above example, the anArray variable is declaring two elements in its array
    of 10 and 20 - the best way to actually create a variable and the conventional
    and standard way is the way it was taught before we went over new Array() but
    was taught regardless just so you know that there is a way to do it a second way.


    Now this is great and all, having arrays, and being able to hold big databases
    of names, or social security numbers, etc - but imagine trying to print all these
    values out manually by pointing out the index of the array and retrieving the
    value. Well, let’s think about it, if I want to print out multiple values from
    an array from multiple different index values, then I must alert all the different
    indexes of the array, therefore I can conclude that I could use a loop to affect
    the variable of the index to alert and retrieve the values of the array variable.


    For example:


                  var names = [“John”, “Bob”, “Tom”]


                  for (i = 0; i < names.length; i++) {


                                alert(names[i]);


    }


    In the above example, a variable of name “names” is being declared with three
    values of “John”, “Bob” and “Tom” - once the array variable has been set. We are
    looping the i variable until it reaches right before the length of the array (number
    of elements held in the array) in order to print them out. Then, we alert the
    array’s index values out by placing the i in the brackets next to the array’s
    name in order to refer to the specific index, which then prints out the names
    accordingly. So the output of this code would be:


    John


    Bob


    Tom


    Using our understanding from arrays and loops, we have managed to combine their
    use to output all the elements from the array. The idea of this concept of combining
    loops and arrays to work together is just one way you can use loops or arrays
    to do what you want. The whole idea of programming comes from thinking outside
    of the box by deciding how you are able to manipulate numbers and strings and
    functionality of the language in order to compute the targeted algorithm that
    you’re aiming to accomplish (algorithm: set of steps to complete to accomplish
    a certain goal).


    ## Multidimensional Arrays


    Multi-dimensional arrays are an important part of programming. They allow us to
    define a large series of points in a single variable. This can be used to define
    images by their pixels, height map data, and whatever you can think of. Creating
    multi-dimensional array is not too easy, but it’s definitely possible, and extremely
    useful. To create a multidimensional array, simply create an array with a given
    size, and then set each of its elements to an array of a given size, usually with
    a loop, and so on for each dimension.


    var dim1 = 10;


    var dim2 = 20;


    var dim3 = 30;


    var arr = new Array(dim1);


    for(var x = 0; x < dim1; x++)


    {


                  arr[x] = new Array(dim2);


                  for(var y = 0; y < dim2; y++)


                  {


                                arr[x][y] = new Array(dim3);


                                for(var z = 0; z < dim3; z++)


                                {


                  arr[x][y][z] = Math.floor(Math.random()*10);


    }


    }


    }


    # Chapter 8


    # Useful Functions in JavaScript


    Some functions in Javascript should be committed to memory. Rather than always
    searching up these common functions, just memorizing them makes it easy to code
    what you need.


    Let’s start with a basic one. The getElementById function. This lets us get HTML
    elements from the document, access and modify them. To use this function, you
    must access the document object, followed by a dot, followed by “getElementById”.
    This function returns a DOM object, which we will discuss in more detail later.
    This function depends on there being an HTML element with the id attribute set
    to the value of the first parameter.


    var x = document.getElementById(‘text1’);


    x.innerHTML = “Hello World!”;'
