  trans: "\n函数极其有用，特别是当你的代码变得异常冗长时。与其在代码中到处写相似的代码，你不如使用函数，让代码只编写一次，并在需要运行的地方调用。函数还允许我们像注释一样让代码更清晰，只不过是以函数名的形式呈现的。例如，假设你有一些难以阅读或令人困惑的代码来打印你代码的输出。你可以创建一个名为\
    \ `printOutput` 的函数。这使得代码变得更容易读，因为你面对不再是一块代码，而是单行代码，直接告诉它在做什么：打印输出。\n\n# 第 15\
    \ 章\n\n## 调试\n\n有时在编程时，你的代码可能会输出错误的结果。这被称为逻辑错误。你的浏览器不会告诉你有任何错误，因为从技术上讲，你的代码遵循\
    \ Javascript 的规则。这就像用任何语言写作一样。你可能遵循了语言的规则（如语法、结构等），但你的段落并不一定合逻辑。最常用的调试方法就是简单的使用\
    \ `console.log` 并打印变量，以找到值从哪里开始不再合理。然后你就可以找到导致错误的行并对其进行调试。\n\n优化可能被或不被视为调试。一旦你写完代码，你可能想直接放过它并继续其他任务，但这可能并不是你想要做的。如果你的程序得到了预期的结果，但花费了很长时间，那么它就是不好。话虽如此，并没有单一的策略来使代码优化。有时你的逻辑可能是执行某事的冗长方法，有时它可能实现了该功能。要小心创建未使用的变量，因为它们会占用处理时间。这是因为有一种被称为\
    \ `garbage collection`（垃圾回收）的系统。它遍历所有变量并移除不再有效的变量。例如，如果你创建了一个 `for loop`，在该变量之后不再有效，因此它应该被删除以节省内存。这会占用大量的处理时间。\n\
    \n这是一个示例。假设你想找到从一个点到另一个点的距离。`Math` 告诉我们使用勾哥拉斯定理。但这很慢。首先，计算机必须平方两边（这在性能上是非常昂贵的），然后将它们相加，最后开根。这计算出了两点之间的准确距离。然而，另一种解决方案可能是使用\
    \ `Manhattan distance`（曼哈顿距离）。这不能给你准确的距离，但在精确值不重要而速度更快的情况下，它是很有用的。要计算曼哈顿距离，只需对\
    \ `x` 和 `y` 分量取 `absolute`（这意味着使值变为正数，所以 `-7` 变成 `7`），然后将它们相加。这给你一个不准确的距离，但比对应的方法快得多。这在你猜测路线时特别好用。与其不断计算距离，曼哈顿距离是一种廉价的替代方案，并且能给你足够接近的距离。\n\
    \n# 第 16 章\n\n## 异常处理\n\n异常是在实际运行代码时产生的错误。这与语法错误（syntax error）不同。语法错误会停止你的代码运行，因为你的代码不符合逻辑。异常不同。异常停止你的代码运行是因为某些值破坏了你的代码。\n\
    \n另一个示例是你正在处理文件操作时，尝试读取不存在的目录中的文件。编译器此时会返回诸如 `FileNotFoundException` 的异常——有许多异常，但这种异常在许多语言的文件处理中经常被发现。\n\
    \n为了在你的代码中管理异常，你可以使用 `try-catch` 语句。这些语句的作用是检查代码块是否返回了异常，如果返回了，它不会停止整个程序的运行，而是捕获异常并尝试修复它，或者根据程序员编写的代码执行其他备选方案。以下是\
    \ `try-catch` 语句的使用：\n\n```javascript\ntry {\n    alert(\"Welcome guest!\");\n\
    } catch (err) {\n    alert(\"Error!\")\n}\n```\n\n`try` 语句不需要参数，但 `catch` 异常需要一个\
    \ `Exception` 对象的参数，当异常发生时，类型为 `Exception` 的变量 `err` 会获得数据，可以操作 `err` 变量来打印错误或执行其他操作。在上面的示例中，`alert`\
    \ 不是一个真实的函数，因此会返回异常。现在有一个 `finally` 语句，无论 `try` 和 `catch` 的情况如何都会执行。\n\n例如：\n\n\
    ```javascript\ntry {\n    alert(\"Welcome guest!\");\n} catch (err) {\n    alert(\"\
    Error!\")\n} finally {\n    alert(\"Finished!\")\n}\n```\n\n# 第 17 章\n\n## 示例\n\
    \n我们将以 `Pathfinding` 对象的形式展示 A* 路径算法。该对象有一个名为 `findPath` 的方法，它接收三个对象。第一个对象定义路径的起点，包含\
    \ `x` 和 `y` 变量。第二个对象定义路径的终点，包含 `x` 和 `y` 变量。第三个对象定义我们将进行路径寻的地图，这是一个二维数组，其中 `1`\
    \ 是实体，`0` 是空闲。\n\n```javascript\nvar Pathfinding = {\n    findPath: function(start,\
    \ end, map) {\n        var time = new Date().getTime();\n        var openList\
    \ = new Array();\n        var closedList = new Array();\n        openList.push({x:\
    \ start.x, y: start.y, g: 0, h: Math.abs(end.x-start.x) + Math.abs(end.y-start.y)});\n\
    \        closedList.push({x: start.x, y: start.y, g: 0, h: Math.abs(end.x-start.x)\
    \ + Math.abs(end.y-start.y)});\n        // ... (后续代码逻辑保持原样)\n    }\n};\n```\n"
