    ## 算术运算符


    ### 加法


    `5+5 = 10`


    ```

    var x = 5;

    var y = 5;

    var sum = 0;

    sum = x + y;

    ```


    在上面的示例中，一个名为 `sum` 的变量正在对两个变量（`x` 和 `y`）进行加法运算，并将它们相加以产生数值为 `10` 的结果。


    ### 减法


    `10-5 = 5`


    ```

    var x = 10;

    var y = 5;

    var total = 0;

    total= x - y;

    ```


    在上面的示例中，一个名为 `total` 的变量正在对两个变量（`x` 和 `y`）进行减法运算，并将它们相减以产生数值为 `5` 的结果。


    ### 乘法


    `5*4 = 20`


    ```

    var x = 5;

    var y = 4;

    var total = 0;

    total= x * y;

    ```


    在上面的示例中，一个名为 `total` 的变量正在对两个变量（`x` 和 `y`）进行乘法运算，并将它们相乘以产生数值为 `20` 的结果。


    ### 除法


    `20/5 = 4`


    ```

    var x = 20;

    var y = 5;

    var total = 0;

    total= x / y;

    ```


    在上面的示例中，一个名为 `total` 的变量正在对两个变量（`x` 和 `y`）进行除法运算，并将它们相以以产生数值为 `4` 的结果。


    ### 取模


    `6 % 3 = 0      7 % 3 = 1`

    `8 % 3 = 2      9 % 3 = 0`


    这对于判断一个数字是否为偶数非常有用。只需对 `2` 取模，如果结果为 `0`，则数字为偶数，否则为奇数。这在尝试查找分钟（例如时钟）时也有用。只需将分钟除以
    `60`（一小时 60 分钟），结果将是时钟的分钟计数。注意，当使用取模时，你只能得到从 `0` 到任何小于你运算符的数字（运算符也可以是小数）。


    其他数学运算符如指数、根号、四舍五入等并不是默认操作，实际上是我们稍后将讨论的函数。请注意，表达式遵循 BEDMAS（或 PEMDAS，取决于你学的是哪种）。无论如何，这里是一些表达式及其对应的值：


    ```

    7 * (3 % 2) = 7

    (8 - 1 + 3) * 6 - 8 / (0 - 4) = 62

    ```


    如果你想让计算机执行这些，你可以使用 `console.log` 打印它们，如下所示：


    ```

    console.log(7 * (3 % 2));

    ```


    数字 `7` 将出现在控制台中。这就是表达式。还有对象表达式，但将在稍后讨论。


