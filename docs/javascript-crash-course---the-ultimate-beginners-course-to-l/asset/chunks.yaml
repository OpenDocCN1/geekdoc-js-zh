    Now let’s go over a few conventional things to understand about programming in
    general. The spacing in code doesn’t matter at all in terms of it working or not,
    but it is conventional and efficient to have properly spaced code so other programmers
    can read your code and so that you can read your code yourself when you’re coding.
    As you continue to program and practice, you’ll start to get the hang of understanding
    the standard spacing conventions and when you need to do it. The best way to do
    it is to simply continue reading this guide and notice when there is spacing.


    In programming, you might see a name and then curly braces like `{"` or `"}"`
    - all these do is communicate with one another. Think of a tag in an HTML document
    like `<tag>` and then when it ends, it would do `</tag>` and everything in between
    the tag would be the content that would be processed according to the function
    of the tag. Well the same applies to functions in programming (we’ll learn more
    about this later) - The first curly brace `{"` would be used to introduce the
    beginning of the block of code and the ending curly brace `"}` would be used to
    enclose the block of code. This might not make sense right now but you will soon
    realize how this all makes sense when you’re learning about functions and classes.


    Another fundamental thing to understand in programming is the use of parentheses
    - which are used to intake arguments or variables, which would then be used within
    the function to work with. For example, if you remember functions in high school,
    you will remember what this would mean:


    ```

    f(x) = 5x + 10

    ```


    When the `x` value is replaced with an input like `2`, it would then become:


    ```

    f(2) = 5(2) + 10

    f(2) = 20

    ```


    Now if we applied the same idea with functions in programming, we can see that
    all it is doing is providing the function the capability to intake values to work
    with. Again, this may not make sense, but I’m just preparing you for when we go
    over classes and functions and how their structure will work.


    We have went over commenting in HTML and CSS, and surprise - it’s also in Javascript!
    Remember, comments are not executed and the browser would ignore those lines.
    Writing anything after double slashes would simply be a one line comment.


    For example:


    ```

    // This is a comment

    ```


    Now the next way to comment is to use `/*` and `*/` in which the comment would
    be placed in between those two symbols, the `/*` being the first and `*/` being
    the last. This would be considered a multi-line comment.


    For example:


    ```

    /* This is a multi-line

    comment. */

    ```


    Just like writing a sentence in English, understand that when ending a statement,
    you use a period - well the same convention applies in programming. Remember to
    place a semi-colon after any statement you create in Javascript. There are a few
    exceptions, like when you are creating a function or a class, but this will be
    discussed later in the guide.


    The final topic to cover in the Javascript language structure is case sensitivity.
    Everything in Javascript is case sensitive meaning if you create a variable (you
    will be learning about this in the next section) or a function, the names will
    have to be addressed in the exact format they were written in, not a capital letter
    or lowercase letter different.


    # Chapter 4


    # JavaScript Variables


    A variable is essentially a storage unit that holds a certain type of data. It
    is named by the programmer, and is used to identify the data it stores. A variable
    can usually accessed or changed at any time. You can write information to it,
    take information from it, and even copy the information and add it to another
    variable. In every programming language, variables hold a specific data type,
    whether that be a string (text) or a whole number (integer) or a decimal number
    (float/double), these are things to consider when you are programming. There are
    many different data types like numbers, strings, arrays, objects, and more.


    In order to declare a variable, you must use the keyword `var` and then the name
    of the variable afterward (you can name this anything you want). Remember that
    everything in Javascript is case sensitive. The use of variables is to hold a
    value so it can be used for later use or manipulation in the code. Let’s go over
    a few examples of variable declarations:


    ```javascript

    var numberOfDogs = 16;

    var nameOfDog = "Copper";

    var hasDog = true;

    var cars = ["First", "Second"];

    var anObject = {myName:"Something"};

    ```


    You might not totally understand what is going on these statements like the array
    or object, but were listed just to note that they are two of the four main data
    types that are used in Javascript.


    # Chapter 5


    # JavaScript Operators


    Just like in Math class, you learned about addition, subtraction, multiplication,
    division and more. These are all arithmetic operators, that are used within programming
    to intake numbers, process them, and calculate them accordingly. Let’s go over
    these operators in programming, as they are one of the most important things to
    understand and also one of the easiest to grasp.

    '
