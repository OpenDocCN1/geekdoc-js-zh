  trans: "\n你也可以通过简单的赋值为对象添加新变量。你不需要编写 `var` 关键字。\n\n```javascript\nx.j.k = “new variable!”;\n\
    ```\n\n创建对象的另一种方法是使用函数。要做到这一点，只需取任何函数，并在其前面加上“new”来调用它。这个函数被称为构造函数。\n\n```javascript\n\
    function Person()\n{\n\n}\n\nvar david = new Person();\n```\n\n在构造函数内部，我们可以使用\
    \ `this` 关键字。`this` 关键字指向正在运行该函数的对象。在构造函数的情况下，它指的是它正在创建的对象。通过使用 `this`，我们可以在对象创建时创建值。记住，构造函数仍然是一个函数，因此它可以拥有参数；同时记住对象仍然是一个对象，因此对象的所有特性（包括随时创建变量的能力）仍然有效。\n\
    \n```javascript\nfunction Person(personName)\n{\n    this.name = personName;\n\
    }\n\nvar david = new Person(“David”);\ndavid.age = 23;\nconsole.log(david.name\
    \ + “, ” + david.age);\n```\n\n我们还可以在这个对象中创建函数，并并在它们中使用 `this` 关键字。\n\n```javascript\n\
    function Person(personName, personAge)\n{\n    this.name = personName;\n    this.age\
    \ = personAge;\n    this.birthDay = function()\n    {\n        this.age++;\n \
    \   };\n\n    this.talkAbout = function()\n    {\n        console.log(this.name\
    \ + “ is currently ” + this.age + “ year(s) old”);\n    };\n}\n\nvar david = new\
    \ Person(“David”, 23);\ndavid.talkAbout(); // David is currently 23\ndavid.birthDay();\n\
    david.talkAbout(); // David is currently 24\n```\n\n在这里我们从对象内部更改了 `age` 的值。对象对于传输相关数据非常有用。但在尝试访问变量时要小心，因为如果变量未定义，它的“值”将是“undefined”，这可能会破坏你的代码。\n\
    \n对象的一个简洁特性是，当它们作为函数的参数传递时，是通过引用传递的，而不是通过值。这意味着如果你更改了对象中的值，原始对象也会发生改变。\n\n```javascript\n\
    function modify(obj, val)\n{\n    obj.y = val;\n}\n\nvar x = { y:9 };\nmodify(x,\
    \ 4);\nconsole.log(x.y); // 4\n```\n\n# 第 14 章\n\n# JavaScript 函数\n\n函数是一个代码块，可以通过单行代码在程序的中的任何一点运行，并且可以根据需要多次使用它。这允许你只编写一次代码块，然后在整个代码中尽可能多次使用它。要创建一个函数，只需编写“function”、一个变量名，然后是括号，后面是大括号，大括号中包含着你的代码。\n\
    \n```javascript\nfunction printSomething()\n{\n    console.log(“Something I guess?\
    \ I don’t know...”);\n}\n```\n\n这是一个非常简单的函数。在普通括号之间，你可以放置变量名。这些被称为参数。这些参数允许你为代码赋值，从而可能给你不同的输出。\n\
    \n```javascript\nfunction printSomething(times)\n{\n    for(var i = 0; i < times;\
    \ i++)\n    {\n        console.log(“Mum!”);\n    }\n}\n```\n\n这个函数使用了一个名为 `times`\
    \ 的变量，运行相应次数的循环，并在每次循环中打印“Mum!”。所以，如果你用值 7 运行这段代码，“Mum!”将打印 7 次。你可以拥有任意数量的参数（尽管越少越好）。只需用逗号分隔每个变量名即可。\n\
    \n```javascript\nfunction printSomething(times, whatToPrint)\n{\n    for(var i\
    \ = 0; i < times; i++)\n    {\n        console.log(whatToPrint);\n    }\n}\n```\n\
    \n这个函数将根据设置的次数打印 `whatToPrint` 的值。那么，我们如何使用这段代码呢？要让它运行，只需输入函数名，后跟括号，括号内包含用逗号隔开的值，这些值应该与函数使用的内容相关。例如，对于我们的函数，第一个参数是\
    \ `times`，所以我们应该只为第一个参数提供一个数字值（尽管在这种情况下，数字是否为整数是重要的）。同样，对于第二个参数，我们应该放入我们想要打印的内容。这被称为“调用”函数。\n\
    \n```javascript\nprintSomething(7, \"I like to move it, move it!\");\n```\n\n\
    我们可以在任何的时候、根据需要多次调用我们的函数。函数的一个特点是，你可以将函数作为值设置给变量，然后从这些变量调用它们。调用函数与将其作为值使用的区别在于，调用函数时在它们中使用括号，而将函数作为值使用时，你不放置括号。\n\
    \n```javascript\nvar aFunction = printSomething;\naFunction(3, \"Strike!\");\n\
    ```\n\n函数的一个重要特性是你可以“返回”值。这意味着函数在被调用时将作为返回的值表现。要返回一个值，只需使用 `return` 关键字，后跟一个值。这是一个示例。要使用返回值，只需想象函数调用即为返回的值即可。\n\
    \n```javascript\nfunction calculateCircumference(radius)\n{\n    return Math.PI*radius;\n\
    }\n\nvar circumference = 2*calculateCircumference(7);\nconsole.log(circumference);\n\
    ```\n\n在这个例子中，我们创建了一个函数，并返回了周长的一半（为什么要这样做我不知道，但为了示例，我们将这样做）。在函数外部，我们创建了一个变量，并将其设置为函数返回值的两倍，我们知道这是周长。返回还有一个次要功能是停止函数。这意味着假设你的函数中有一个运行很长的循环，但你希望在执行某个\
    \ if 语句后停止它。只需使用 `return` 关键字，它就会停止循环的运行。`return` 关键字也不需要返回值。你可以单独使用 `return`\
    \ 关键字来结束函数的执行。\n\n```javascript\nfunction kindaUess(number)\n{\n    var i = 0;\n\
    \    while(true)\n    {\n        i++;\n        if(number == i)\n        {\n  \
    \          console.log(i);\n            console.log(“That wasn’t the best way\
    \ to do that”);\n            return;\n        }\n    }\n}\n```\n\n这不是一个非常有用的示例，但它展示了语法。这个循环只要\
    \ true 为真就会一直运行。这种循环将无限运行。我们还有一个名为 `i` 的变量，它是我们定义的。在每次迭代中，我们检查要查找的数字是否等于我们的变量\
    \ `i`。如果是，我们就打印 `i`，并打印一些关于该函数的通用信息。最后，我们返回函数。由于函数在返回后停止执行，无限循环被跳出，我们的程序可以继续运行。这非常有用，特别是在你想限制迭代次数的情况下。例如，如果你在数组中搜索某个内容并找到了它，你可能想直接返回，以避免浪费更多迭代去寻找重复内容或其他内容。\n"
- fmt: "\nFunctions are incredibly useful, especially when your code becomes exceedingly\
    \ lengthy. Rather than have similar code all throughout your code, you could use\
    \ a function to only have the code written out once, and called where it needs\
    \ to run. Functions also allow us to make code clearer just as comments do, but\
    \ in the form of the function name. For example, say you have some hard-to-read\
    \ or confusing code that prints the output of your code. You could make a function\
    \ called `printOutput`. This makes it easier to read code, because instead a block\
    \ of code, you have a single line that just tells you what it's doing: printing\
    \ the output.\n\n# Chapter 15\n\n## Debugging\n\nSometimes when programming, your\
    \ code may give wrong outputs. This is called a logic error. Your browser will\
    \ not tell you anything is wrong, because technically your code follows the rules\
    \ of Javascript. It’s like writing in any language. You may follow the rules of\
    \ the language, like grammar, structure, etc, but your paragraphs don’t necessarily\
    \ have to sense. The most common method of debugging is simply `console.log` and\
    \ printing out variables to find where values stop sense. Then you can find the\
    \ lines that are causing the error and debug that.\n\nOne thing that may or not\
    \ be considered debugging is optimization. Once’ve written your code, it may be\
    \ tempting to just leave it and continue on other tasks, but this may not be what\
    \ you want to do. If your program gets the desired results, but takes a long amount\
    \ of time, then it is not good. That said, there is no single strategy to make\
    \ code optimized. Sometimes your logic could be a long method of doing something,\
    \ and sometimes it could implement that. Be wary of creating unused variables,\
    \ as they can take up processing time. This is because of a system called `garbage\
    \ collection`. It goes through all the variables and removes any that no longer\
    \ valid. For example, if you make a `for loop`, after that variable is not valid,\
    \ so it should be deleted to save on memory. This takes up amounts of processing\
    \ time.\n\nHere is an example. Say you want to find distance from one point to\
    \ another. `Math` tells us to use Pythagorean theorem. But this is slow. First\
    \ the computer must square both sides (which is quite expensive—performance-wise),\
    \ then add them, then square root. This calculates the accurate distance between\
    \ two points. Another solution though, could be to use `Manhattan distance`. This\
    \ will not get you accurate distances, but it could be good in situations where\
    \ the exact value is not important, and speed is more. To do Manhattan distance,\
    \ simply `absolute` (which means to make a value positive, so `-7` becomes `7`)\
    \ both the `x` and `y` components then add them. This gives you an inaccurate\
    \ distance, but it is much faster than its counterpart. This is particularly good\
    \ when you are guessing the route. Rather than constantly calculating the distance,\
    \ Manhattan distance is a cheap alternative and will get you near enough distance.\n\
    \n# Chapter 16\n\n## Exception Handling\n\nAn exception is an error that comes\
    \ from actually running your code. This is different from a syntax error. A syntax\
    \ error will stop your code from running because your code doesn’t make sense.\
    \ Exceptions are different. Exceptions will stop your code from running because\
    \ certain values are breaking your code.\n\nAnother example would be when you’re\
    \ working with file handling, and you’re trying to read a file in a directory\
    \ that doesn’t exist. The compiler would then return an exception such as `FileNotFoundException`—there\
    \ are different exceptions but this type of exception is regularly found in File\
    \ Handling in many languages.\n\nIn order to regulate exceptions in your code,\
    \ you can use `try-catch` statements. What these statements do is check if a block\
    \ of code returns an exception, and if it does, instead of halting the whole operation\
    \ of the program, it will catch the exception and try to either fix it or do something\
    \ alternatively depending on what the programmer codes. Here is a use of a `try-catch`\
    \ statement:\n\n```javascript\ntry {\n    alert(\"Welcome guest!\");\n} catch\
    \ (err) {\n    alert(\"Error!\")\n}\n```\n\nThe `try` statement does not require\
    \ parameters but the `catch` exception requires the parameter of an `Exception`\
    \ object, and when an exception does occur, the variable `err` of type `Exception`\
    \ is given data, and the `err` variable can be manipulated to either print out\
    \ the error or do other things. In the above example, `alert` isn’t a real function\
    \ and therefore will return an exception. Now there is a `finally` statement that\
    \ is executed regardless of the situation in `try` and `catch`.\n\nFor example:\n\
    \n```javascript\ntry {\n    alert(\"Welcome guest!\");\n} catch (err) {\n    alert(\"\
    Error!\")\n} finally {\n    alert(\"Finished!\")\n}\n```\n\n# Chapter 17\n\n##\
    \ Examples\n\nHere we will be showing off an A* pathfinding algorithm in the form\
    \ of a `Pathfinding` object. This object has a method called `findPath`, which\
    \ takes in three objects. The first object defines the start of the path, and\
    \ contains an `x` and `y` variable. The second object defines the end of the path,\
    \ and contains an `x` and `y` variable. The third object defines the map that\
    \ we will be pathfinding around, as a 2d array where a `1` is solid and a `0`\
    \ is free.\n\n```javascript\nvar Pathfinding = {\n    findPath: function(start,\
    \ end, map) {\n        var time = new Date().getTime();\n        var openList\
    \ = new Array();\n        var closedList = new Array();\n        openList.push({x:\
    \ start.x, y: start.y, g: 0, h: Math.abs(end.x-start.x) + Math.abs(end.y-start.y)});\n\
    \        closedList.push({x: start.x, y: start.y, g: 0, h: Math.abs(end.x-start.x)\
    \ + Math.abs(end.y-start.y)});\n        var reachedTarget = { value: false };\n\
    \        var pathTile = {x: -1, y: -1, g: 0, h: Math.abs(end.x-start.x) + Math.abs(end.y-start.y)};\n\
    \        var width = map.length;\n        var height = map[0].length;\n      \
    \  while(!reachedTarget.value) {\n            openList.sort(function(a, b){ return\
    \ (a.g+a.h)-(b.g+b.h); });\n            Pathfinding.addAdjTilesToOpenList(openList[0],\
    \ map, openList, closedList, end, reachedTarget, pathTile, width, height);\n \
    \           closedList.push(openList[0]);\n            openList.splice(0, 1);\n\
    \            if(openList.length == 0) {\n                // logic for no path\n\
    \            }\n            // logic for reached target omitted for brevity\n\
    \            }\n        var path = Pathfinding.getPathFromTile(pathTile);\n  \
    \      return path;\n    }\n};\n```\n"
  raw: 'Functions are incredibly useful, especially when your code becomes exceedingly
    lengthy. Rather than have similar code all throughout your code, you could use
    a function to only have the code written out once, and called where it needs to
    run. Functions also allow us to make code clearer just as comments do, but in
    the form of the function name. For example, say you have some hard-to-read or
    confusing code that prints the output of your code. You could make a function
    called "printOutput". This makes it easier to read code, because instead a block
    of code, you have a single line that just tells you what it''s doing: printing
    the output.


    # Chapter 15


    # Debugging


    Sometimes when programming, your code may give wrong outputs. This is called a
    logic error. Your browser will not tell you anything is wrong, because technically
    your code follows the rules of Javascript. It’s like writing in any language.
    You may follow the rules of the language, like grammar, structure, etc, but your
    paragraphs don’t necessarily have to make sense. The most common method of debugging
    is simply using console.log and printing out variables to find where values stop
    making sense. Then you can find the lines that are causing the error and debug
    that.


    One thing that may or may not be considered debugging is optimization. Once you’ve
    written your code, it may be tempting to just leave it and continue on with other
    tasks, but this may not be what you want to do. If your program gets the desired
    results eventually, but it takes a long amount of time, then it is not very good.
    That said, there is no single strategy to make code more optimized. Sometimes
    your logic could simply be a long method of doing something, and sometimes it
    could be how you implement that logic. Be wary of creating unused variables, as
    they can take up processing time and memory. This is because of a system called
    “garbage collection”. It goes through all the variables in your code and removes
    any ones that are no longer valid. For example, if you make a for loop, after
    the for loop, that variable is not valid, so it should be deleted to save on memory.
    This takes up (small) amounts of processing time.


    Here is an optimization example. Say you want to find the distance from one point
    to another. Math class tells us to use Pythagorean theorem. But this is rather
    slow. First the computer must square both sides (which is quite expensive—performance-wise),
    then add them, then square root them. This calculates the accurate distance between
    two points. Another solution though, could be to use “Manhattan distance”. This
    will not get you accurate distances, but it could be good in situations where
    the exact value is not important, and speed is more important. To do Manhattan
    distance, simply absolute (which means to make a value positive, so -7 becomes
    7 and 8 remains 8) both the x and y components and then add them. This gives you
    an inaccurate distance, but it is much faster than its more accurate counterpart.
    This is particularly good when you are guessing the fastest route. Rather than
    constantly calculating the distance accurately, Manhattan distance is a cheap
    alternative and will get you a near enough distance.


    # Chapter 16


    # Exception Handling


    An exception is an error that comes from actually running your code. This is different
    from a syntax error. A syntax error will stop your code from running because your
    code doesn’t make sense. Exceptions are different. Exceptions will stop your code
    from running because certain values are breaking your code.


    Another example would be when you’re working with file handling, and you’re trying
    to read a file in a directory that doesn’t exist. The compiler would then again
    return an exception such as “FileNotFoundException” - there are different exceptions
    but this type of exception is regularly found in File Handling in many programming
    languages.


    In order to regulate exceptions in your code, you can use the try-catch statements.
    What these statements do is check if a block of code returns an exception, and
    if it does, instead of halting the whole operation of the program, it will catch
    the exception and try to either fix it or do something alternatively depending
    on what the programmer codes. Here is a use of a try-catch statement:


    try {


                  adddlert("Welcome guest!");


    } catch (err) {


                  alert(“Error!”)


    }


    The try statement does not require parameters but the catch exception requires
    the parameter of an Exception object, and when an exception does occur, the variable
    “err” of type Exception is given data, and the “err” variable can be manipulated
    to either print out the error or do various other things. In the above example,
    adddlert isn’t a real function and therefore will return an exception. Now there
    is a finally statement that is executed regardless of the situation in try and
    catch.


    For example:


    try {


                  adddlert("Welcome guest!");


    } catch (err) {


                  alert(“Error!”)


    } finally {


                  alert(“Finished!”)


    }


    # Chapter 17


    # Examples


    Here we will be showing off an A* pathfinding algorithm in the form of a Pathfinding
    object. This object has a method called findPath, which takes in three objects.
    The first object defines the start of the path, and contains an x and y variable.
    The second object defines the end of the path, and contains an x and y variable.
    The third object defines the map that we will be pathfinding around, as a 2d array
    where a 1 is solid and a 0 is free.


    var Pathfinding =


    {


                  findPath: function(start, end, map)


                  {


                                var time = new Date().getTime();


                                var openList = new Array();


                                var closedList = new Array();


                                openList.push({x: start.x, y: start.y, g: 0, h: Math.abs(end.x-start.x)
    + Math.abs(end.y-start.y)});


                                closedList.push({x: start.x, y: start.y, g: 0, h:
    Math.abs(end.x-start.x) + Math.abs(end.y-start.y)});


                                var reachedTarget = { value: false };


                                var pathTile = {x: -1, y: -1, g: 0, h: Math.abs(end.x-start.x)
    + Math.abs(end.y-start.y)};


                                var width = map.length;


                                var height = map[0].length;


                                while(!reachedTarget.value)


                                {


                                              openList.sort(function(a, b){ return
    (a.g+a.h)-(b.g+b.h); });


                                              Pathfinding.addAdjTilesToOpenList(openList[0],
    map, openList, closedList, end, reachedTarget, pathTile, width, height);


                                              closedList.push(openList[0]);


                                              openList.splice(0, 1);


                                              if(openList.length == 0)


                                              {


                                                            closedList.sort(function(a,
    b){ return a.h - b.h; });


                                                            return Pathfinding.getPathFromLastTile(closedList[0]);


                                              }


                                }


                                var path = Pathfinding.getPathFromLastTile(pathTile);


                                return path;


                  }


                  , addAdjTilesToOpenList: function(tile, map, openList, closedList,
    end, reachedTarget, pathTile, width, height)


                  {


                                var i = tile.x;


                                var j = tile.y;


                                if(i-1 >= 0 && (map[i-1][j] != 1 || (i-1 == end.x
    && j == end.y))) { Pathfinding.tryPush(Pathfinding.calcTile(i-1, j, tile, false,
    end, reachedTarget, pathTile, openList, closedList), openList); }'
