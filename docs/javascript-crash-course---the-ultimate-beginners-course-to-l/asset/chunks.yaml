  trans: "\n\nJavascript 支持 6 种不同的关系运算符，用于比较变量的值。它们如下：\n\n### 关系运算符\n\n`==`  此运算符检查两个整数的值是否相等。如果它们相等，运算符返回\
    \ `true`。如果不相等，则返回 `false`。\n\n示例：\n```javascript\nvar a = 10;\nvar b = 10;\n\
    if (a == b) {\n    alert(\"they are the same\");\n}\n```\n这段代码检查 `a` 的值是否等于 `b`\
    \ 的值。由于 `a` 的值等于 `b` 的值，括号内的值将为 `true`。这导致上述代码打印出语句“they are the same”。\n\n`!=`\
    \ 此运算符检查两个值是否**不相等**。如果两个值**不相等**，那么它将返回 `true`。如果它们**相等**，它将返回 `false`。\n\n示例：\n\
    ```javascript\nvar a = 10;\nvar b = 20;\nif (a != b) {\n    alert(\"they are not\
    \ the same\");\n}\n```\n这段代码将检查 `a` 是否等于 `b`。由于 `a` 不等于 `b`，程序将在控制台中打印“they are\
    \ not the same”。\n\n`>` 此运算符检查一个值是否**大于**另一个值。如果它前面的变量的值大于后面变量的值，它将返回 `true`。如果前面变量的值小于后面变量的值，它将返回\
    \ `false`。\n\n示例：\n```javascript\nvar a = 10;\nvar b = 20;\nif (a > b) {\n   \
    \ alert(\"a is larger than b\");\n} else {\n    alert(\"a is not larger than b\"\
    );\n}\n```\n这个示例检查 `a` 是否大于 `b`。由于 `a` 不大于 `b`，这个 `if` 语句将返回 `false`。相反，它将打印“a\
    \ is not larger than b”，因为代码通过了失败的 `if` 语句并调用了 `else` 语句。\n\n`<` 此运算符检查一个值是否**小于**另一个值。如果运算符前的变量的值小于变量变量的值，则代码将返回\
    \ `true`；否则，它将返回 `false`。\n\n示例：\n```javascript\nvar a = 10;\nvar b = 20;\nif\
    \ (a < b) {\n    alert(\"a is larger than b\");\n} else {\n    alert(\"a is not\
    \ larger than b\");\n}\n```\n这个示例与上一个相似，但运算符从“大于”变成了“小于”。因此，这次 `if` 语句返回 `true`。由于\
    \ `a` 的值小于 `b` 的值，程序将在控制台中打印“a is larger than b”。\n\n`>=` 此运算符检查一个值是否**大于或等于**另一个值。如果它前面的变量的值大于或等于后面的变量，那么它将返回\
    \ `true`。如果后面的变量大于但不等于前面的变量，它将返回 `false`。\n\n示例：\n```javascript\nvar a = 20;\n\
    var b = 20;\nif (a >= b) {\n    alert(\"a is larger or equal to b\");\n} else\
    \ {\n    alert(\"a is not larger or equal to b\");\n}\n```\n在这个示例中，`a` 和 `b` 的值均为\
    \ 20。虽然 `a` 不大于 `b`，但它**等于** `b`，因此该语句返回 `true`，代码最终打印出“a is larger or equal to\
    \ b”。\n\n`<=` 此运算符检查一个值是否**小于或等于**另一个值。如果它前面的变量的值小于或等于后面的变量，那么它将返回 `true`。如果后面的变量小于但不等于前面的变量，它将返回\
    \ `false`。\n\n示例：\n```javascript\nvar a = 20;\nvar b = 20;\nif (a <= b) {\n  \
    \  alert(\"a is larger than b\");\n} else {\n    alert(\"a is not larger than\
    \ b\");\n}\n```\n这个示例与上一个相同，只是运算符从 `>=` 改变为了 `<=`。虽然运算符变了，但结果是相同的。由于 `a` 等于 `b`，这段代码将返回\
    \ `true`，打印“a is larger than b”。\n\n### 逻辑运算符\n\nJavascript 支持 3 种用于逻辑判断的逻辑运算符，它们通常与关系运算符配合使用。\n\
    \n`&&` 这被称为逻辑**与**（AND）运算符。如果该运算符前后的操作数都返回 `true`，则条件返回 `true`。如果两个操作数均为 `false`，或其中一个操作数为\
    \ `false`，则条件将返回 `false`。**两个**操作数都必须为 `true`，条件才会返回 `true`。\n\n示例：\n```javascript\n\
    var a = 20;\nvar b = 20;\nif (a == 20 && a == b) {\n    alert(\"a is equal to\
    \ 20 and b\");\n} else {\n    alert(\"a is not equal to 20 or is not equal to\
    \ b\");\n}\n```\n在这个示例中，我们检查 `a` 是否等于 20，**且** `a` 是否等于 `b`。这两个条件被称为操作数。由于 `a`\
    \ 等于 20 且等于 `b`，语句返回 `true`，我们在控制台中打印“a is larger than b”。\n\n示例 2：\n```javascript\n\
    var a = 20;\nvar b = 30;\nif (a == 20 && a == b) {\n    alert(\"a is equal to\
    \ 20 and b\");\n} else {\n    alert(\"a is not equal to 20 or is not equal to\
    \ b\");\n}\n```\n在下一个示例中，我们检查与第一个示例完全相同的内容。然而这次的区别在于，我们将 `b` 的值从 20 改变为了 30。这意味着当我们运行这段代码时，`if`\
    \ 语句将返回 `false`，因为虽然 `a` 等于 20，但它不等于 `b`。因此我们打印“a is not equal to 20 or is b”。\n\
    \n`||` 此运算符被称为逻辑**或**（OR）运算符。如果第一个操作数或第二个操作数返回 `true`，则语句将返回 `true`。这意味着如果第一个操作数返回\
    \ `false` 而第二个返回 `true`，语句将会返回 `true`，反之亦然。如果两个操作数均为 `true`，语句也会返回 `true`。本质上，使用或运算符时，至少有一个操作数必须返回\
    \ `true`。\n\n示例：\n```javascript\nvar a = 20;\nvar b = 30;\nif (a == 20 || a ==\
    \ b) {\n    alert(\"a is equal to 20 or b\");\n} else {\n    alert(\"a is not\
    \ larger than b\");\n}\n```\n在这个示例中，我们检查 `a` 是否等于 20，**或者** `a` 是否等于 `b`。在这种情况下，`a`\
    \ 等于 20 而不等于 `b`。由于这些操作数中只要有一个为 `true`，整个语句将返回 `true`。因此程序将在控制台中打印“a is equal\
    \ to 20 or b”。\n\n示例 2：\n```javascript\nvar a = 20;\nvar b = 20;\nif (a == 20\
    \ || a == b) {\n    alert(\"a is equal to 20 and b\");\n} else {\n    alert(\"\
    a is not equal to 20 or b\");\n}\n```\n在这个示例中，我将上一个示例中 `b` 的值从 30 改为 20。这意味着 `a`\
    \ 等于 20 且 `a` 等于 `b`。两个操作数都返回 `true`，因此语句返回 `true`。这是因为或运算符要求一个或多个运算符为 `true`。该程序向控制台输出“a\
    \ is equal to 20 and b”。\n\n`!` 此运算符被称为逻辑**非**（NOT）运算符。它用于反转操作数的逻辑状态。该操作数可以与其他任何操作数一起以反转其输出。如果操作数返回\
    \ `true`，在应用逻辑非运算符后，操作数将返回 `false`。\n\n示例：\n```javascript\nvar a = 21;\nvar b\
    \ = 20;\nif (!(a == 20) && a > b) {\n    alert(\"a is not equal to 20, and a is\
    \ greater than b\");\n} else {\n    alert(\"a is equal to 20, and a is not greater\
    \ than b\");\n}\n```\n\n"
- fmt: "\nIn this example, we check to see if the value of `a` does not equal to 20,\
    \ and we check if `a` is greater than `b`. Since `a` is both not equal to 20,\
    \ and greater than `b`, we can print out to the console “a is not equal to 20,\
    \ and a is greater than b”.\n\n### Example 2\n\n```javascript\nvar a = 21;\nvar\
    \ b = 20;\nif ( !(a == 20 && a > b) ) {\n    alert(\"a is not equal to 20, and\
    \ a is greater than b \");\n}\nelse {\n    alert(\"a is equal to 20, and a is\
    \ not greater than b \");\n}\n```\n\nIn this example, I changed the position of\
    \ the bracket from the NOT operator to extend to both operands. Now for the statement\
    \ to be true, `a` has to NOT equal to 20, AND `a` must NOT be greater than `b`.\
    \ In this situation the statement will return false, because `a` is greater than\
    \ `b`. Due to the operand it needs to be less than `b` for the statement to return\
    \ true. Therefore this program will return “a is equal to 20, and a is not greater\
    \ than b” to the console.\n\n## Combining Operators\n\nIn Javascript, it is possible\
    \ to use as many operators as you require per statement.\n\n### Example\n\n```javascript\n\
    var a = 21;\nvar b = 20;\nif ( (a == 20 && a > b) || (a != 20 && a < b)) {\n \
    \   alert(\"correct\");\n}\nelse {\n    alert(\"wrong\");\n}\n```\n\nWith this\
    \ example, we can see how we can achieve much more complicated statements. Here,\
    \ we apply an OR operator with two operands, however, each operand also incorporates\
    \ an AND operator. Therefore, for this statement to return true, `a` must be equal\
    \ to 20 and be greater than `b` OR `a` must not be equal to 20 AND `a` must be\
    \ less than `b`. Note that we use brackets to make the code more easy to understand,\
    \ and to prevent the code from misreading our logic.\n\n### Example 2\n\n```javascript\n\
    var a = 21;\nvar b = 20;\nif ( a == 20 && (a > b || a != 20) && a < b) {\n   \
    \ alert(\"correct\");\n}\nelse {\n    alert(\"wrong\");\n}\n```\n\nIn the above\
    \ example, we have significantly changed the logic of the program, by only switching\
    \ the position of a bracket. Notice how now the brackets surround the two inner\
    \ operands, instead of two pairs of brackets surrounding each pair of outer operands.\
    \ For this statement to return true now, 3 different conditions must return true.\
    \ Variable `a` must be equal to 20, AND, either `a` must be greater than `b` OR\
    \ it must not be equal to 20; AND `a` must be less than `b`. With this new logic,\
    \ the first operand must be true, on top of EITHER the second or third having\
    \ to return true. Also on top of that, `a` must be less than `b`. This statement\
    \ will return false. It will fail the first condition, because `a` does not equal\
    \ 20. It will pass the second condition, because it is greater than `b`, and it\
    \ will fail the last condition because `a` is not less than `b`. Since this would\
    \ have required three correct conditions, and only had one, the statement returns\
    \ false and prints “wrong”.\n\n### Assignment\n\nWe are now going to go through\
    \ another assignment to make sure we understand everything about operators. We\
    \ have 3 friends who want to know how much money they have compared to the others.\
    \ We will make a program that will output who is richer than who. We will have\
    \ three integers named `bob`, `john`, and `tom`. We will give each one of them\
    \ a different value, and the program must output who is richer. It must also tell\
    \ us if someone has the same amount of money as someone else.\n\nFor example:\n\
    If `bob = 20`, `tom = 10`, and `john = 5`, the output must be: “bob is richer\
    \ than tom, who is richer than john”\nBut if `bob = 20`, `tom = 20`, and `john\
    \ = 5`, the output must be: “bob is as rich as tom, both are richer than john”\n\
    \nThe program needs to work for each outcome. I highly encourage you to try this\
    \ program by yourself and struggle through it as much as you can before you look\
    \ at the answer. A big part of programming is problem solving and understanding\
    \ code, so I recommend you to figure it out by yourself first.\n\n### Answer and\
    \ explanation\n\nNote that the program will be explained through the code.\n\n\
    ```javascript\n// free to change these values\nvar tom = 0; // amount money tom\
    \ has\nvar bob = 20; // amount money bob has\nvar john = 10; // amount money john\
    \ has\n\n// We first check if everyone has the same amount of money\n// how I\
    \ never check if tom is equal to john, because if\n// tom is equal to bob and\
    \ bob is equal to john, then obviously\n// tom is equal to john\nif (tom == bob\
    \ && bob == john) {\n    alert(\"Everyone has the same amount of money\");\n}\n\
    \n// If the first statement returns false\n// I next check the unique case where\
    \ tom and bob have the same amount\n// but john does not\nelse if (tom == bob\
    \ && bob != john) {\n    // I now check if bob is greater or less than john\n\
    \    // and then output the correct answer\n    if (bob > john) {\n        alert(\"\
    tom is just as rich as bob, both are richer than john\");\n    }\n    else if\
    \ (bob < john) {\n        alert(\"tom is just as rich as bob, both are more poor\
    \ than john\");\n    }\n}\n\n// repeat the same process as the previous statement\
    \ with different people\nelse if (tom == john && john != bob) {\n    if (john\
    \ > bob) {\n        alert(\"tom is just as rich as john, both are richer than\
    \ bob\");\n    }\n    else if (john < bob) {\n        alert(\"tom is just as rich\
    \ as john, both are more poor than bob\");\n    }\n}\n\n// The last possible combination\
    \ of names,\n// same check as previous statement\nelse if (john == bob && bob\
    \ != tom) {\n    if (bob > tom) {\n        alert(\"bob is just as rich as john,\
    \ both are richer than tom\");\n    }\n    else if (bob < tom) {\n        alert(\"\
    bob is just as rich as john, both are more poor than tom\");\n    }\n}\n\n// Now\
    \ I check the last possible combinations where each person has different amounts\
    \ of money\n// the next 6 statements cover each possible outcome\nelse if (tom\
    \ > bob && bob > john) {\n    alert(\"tom is richest, followed by bob, followed\
    \ by john\");\n}\nelse if (tom > john && john > bob) {\n    alert(\"tom is richest,\
    \ followed by john, followed by bob\");\n}\nelse if (bob > tom && tom > john)\
    \ {\n    alert(\"bob is richest, followed by tom, followed by john\");\n}\nelse\
    \ if (bob > john && john > tom) {\n    alert(\"bob is richest, followed by john,\
    \ followed by tom\");\n}\n```\n"
