    \ see if “a” is equal to “b”. If that is true, we simply print “a is equal to\
    \ b” and ignore the rest of the code. If “a” does not equal “b”, then it goes\
    \ down and calls the else if. The else is due to the first if returning false.\
    \ The if part of else if is checking its own parameters, which happen to be whether\
    \ “a” is greater than “b”. If “a” is greater than b, then we would have printed\
    \ “a is greater than b”. However, since “a” is less than “b”, we go further down\
    \ and simply call else . The else runs if all the above parameters return false.\
    \ It does not require its own parameter to be true. Note That each if statement\
    \ can have an infinite amount of else if statements which follow it, but only\
    \ one else statement. Also Note that you cannot have code between an if statement\
    \ and an else statement, because the code would not be able to find the else .\
    \ As well, an else statement requires there to be an if statement before it, since\
    \ for an else statement to be called, an if statement HAS to equal false immediately\
    \ before it. It is also important to know that it is possible to have an if statement\
    \ INSIDE of another if statement. This is called a NESTED if statement\n\n                    \
    \ Example:\n\n                     var a = 20;\n\nvar b = 30;\n\nif (a == 20)\
    \ {             \n\nif (a < b) {\n\nalert(\"a is less than b and it is equal to\
    \ 20\");\n\n}\n\n}\n\nIn this example, we first check to see if the value of “a”\
    \ is equal to the value of “b”. If it is, we then check to see if the value of\
    \ “a” is less than the value of “b”. If this statement also returns true, we can\
    \ print to the console “a is less than b and it is equal to 20”. This can work\
    \ with as many if statements as you would like. This can be useful if completely\
    \ necessary to check the parameters separately, or if you want to add additional\
    \ logic between each check.\n\nYou will understand fully the way an if statement\
    \ works by the end of this section.\n\n## \n\nThe Relational Operators"
