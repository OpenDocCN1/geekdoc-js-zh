    \ tom\");\n}\nelse if (john > tom && tom > bob) {\n    alert(\"john is richest,\
    \ followed by tom, followed by bob\");\n}\n```\n\n在编写代码时，对你的所有逻辑进行注释是非常重要的，这样没有写过代码的人就能轻松地理解并编辑它。我建议在编写代码时，根据你认为所需的程度进行尽可能多的注释。我也鼓励你尝试找到更好的方法来解决这个问题。也许有某种方法可以用四分之一的长度来编写它；在编程中，答案永远不止一个。\n\
    \n# 第 7 章\n\n# 循环与数组\n\n本指南的这一部分非常重要，因为涵盖了编程中最重要的概念之一。循环正如其名所示——它们仅仅是某些函数，允许你根据你的要求，对特定的代码块进行一定次数的循环执行。尽管这现在看起来可能没什么用，但当你开始将知识应用于真实的编程应用程序时，你会发现它们的用处。在介绍数组之前，让我们先回顾一下循环是如何工作的。\n\
    \n## 循环\n\nJavascript 中的循环与许多其他编程语言相似。其语法也相当直观。在每个循环中，都有一个设置好的条件供循环检查该条件是否为真，直到情况相反，循环本身就会退出。例如，如果你创建一个循环并说我想让它在停止之前运行\
    \ 10 次某个代码块，有几种方法可以实现这一点，因为有不同类型的循环。循环的大致思路如下：\n\n```javascript\nloop (condition)\
    \ {\n    // 代码块\n}\n```\n\n为了在 Javascript 中创建循环——我们必须理解不同类型的循环以及它们何时有用。让我们来看看这些循环类型，然后我将在讲解过程中解释它们每一种是如何工作的，到最后，你应该对循环如何工作有一个良好的理解。\n\
    \n## For 循环\n\n```javascript\nfor (x = 0; x < 10; x++) {\n    alert(\"Hi \" +\
    \ x);\n}\n```\n\n上面的示例中发生了很多事情，所以让我们逐行分析。第一行写道：\n\n`for (x = 0; x < 10; x++)`\n\
    \n在上述语句中，这是 `for` 循环的习惯标准。我们必须首先声明变量，所以从声明变量 `x` 开始，让它成为从 0 开始的整数。接下来，让我们添加一个分号，通过添加条件来将\
    \ for 循环的特定部分隔离开。这就是为什么我写了 `x < 10`，它简单表示只要 `x` 小于 10，就运行大括号（`{` 和 `}`）下面的代码块。该语句现在由另一个分号隔开，以便进入\
    \ for 循环的最后一个元素。这部分是你告诉你声明的特定变量执行某种特定的算术操作。在这种情况下，我们告诉 `x` 在每次循环通过时递增。\n\n让我们用伪代码的方法（英语可读）来过一遍：\n\
    \n```javascript\nfor (声明变量; 为变量创建条件; 影响变量) {\n    // 执行此代码块\n}\n```\n\n一旦运行了代码块，它将返回第一语句并检查条件是否仍然满足。它将跳过变量声明，因为它会注意到变量已经声明过了。然后它将跳到影响变量的操作，在检查条件是否满足之前。\n\
    \n这里有一个 for 循环或任何循环可以遵循的蓝图：\n\n声明变量 → 检查条件 → 运行代码块 → 影响变量 → 检查条件 → 运行代码块 → 影响变量\
    \ → 检查条件 → 运行代码块 → 重复\n\n现在让我们回看我们稍作修改创建的代码：\n\n```javascript\nfor (x = 0; x <\
    \ 10; x++) {\n    alert(\"Current Number: \" + x);\n}\n```\n\n我们可以看到这个循环将 `x`\
    \ 从 0 递增到 9，所以技术上是 10 次迭代，因为 0 是包含在。因此，循环会弹出以下内容：\n\nCurrent Number: 0\nCurrent\
    \ Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent\
    \ Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent\
    \ Number: 9\n\n记得我说的 for 循环的最后一个语句是变量的算术操作吗——变量也可以以你任何想要的方式受到影响。现在我们知道了 `for`\
    \ 循环是如何工作的，那么理解 `while` 循环和 `do-while` 循环是如何工作的就会变得更容易。\n\n## While 循环\n\n`while`\
    \ 循环与 `for` 循环唯一的区别在于它只带有循环的条件，而不包含变量。因此，你实际上必须在循环外部声明变量，然后在循环内部影响它，以执行某些条件。\n\
    \n```javascript\nvar x = 0;\nwhile (x < 10) {\n    alert(\"Current number: \"\
    \ + x);\n    x++;\n}\n```\n\n在上面的示例中，可以看到，`while` 循环只需检查一个条件，当条件满足时，运行代码块，然后影响变量\
    \ `x`，这样在代码块执行完成后它就会返回检查条件，并一直这样做直到 `x` 不再小于 10。输出与 `for` 循环相同：\n\nCurrent Number:\
    \ 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number:\
    \ 4\nCurrent Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number:\
    \ 8\nCurrent Number: 9\n\n这种 `while` 循环可能会出现问题，比如意外创建无限循环。\n\n```javascript\n\
    var x = 0;\nwhile (x < 10) {\n    alert(\"Current number: \" + x);\n}\n```\n\n\
    在上面的示例中，它执行了之前循环所做的一切，只是由于变量 `x` 从未被影响，输出（显示某些文本）将无限显示。\n\n我们将涵盖的最后一种循环是 `do-while`\
    \ 循环。这种循环执行 `while` 循环执行的一切，只是它在考虑条件之前，无论条件如何至少执行一次。\n\n```javascript\nvar x =\
    \ 0;\ndo {\n    alert(\"Current number: \" + x);\n    x++;\n} while (x < 10)\n\
    ```\n\n上面的示例在实际测试给出的条件之前，无论条件如何至少运行一次代码块的迭代。如果你希望循环在检查条件之前至少执行一次操作，这将非常有用。\n\n\
    ## Continue 关键字\n\n`continue` 关键字用于你想跳过循环的某次迭代。\n\n```javascript\nvar x = 0;\n\
    while (x < 10) {\n    if (x == 5) {\n        continue;\n    }\n    alert(x);\n\
    }\n```\n\n在上面的示例中，我们正在检查 `x` 是否等于 5，如果是，我们做的就是跳过循环的迭代，这意味着这个循环的输出变为：\n\nCurrent\
    \ Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent\
    \ Number: 4\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent\
    \ Number: 9\n\n如上面的输出所示，循环跳过了 5，因为它在有机会机会弹出数字之前就被告知要跳过那次迭代。\n\n## Break 关键字\n\n\
    `break` 关键字用于你想退出循环。\n\n```javascript\nvar x = 0;\nwhile (x < 10) {\n    if (x\
    \ == 5) {\n        break;\n    }\n    alert(x);\n}\n```\n\n"
