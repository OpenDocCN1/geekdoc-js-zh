    simple to accomplish. The first step is to figure out which type of request you
    can make. This is because older browsers use the “ActiveXObject”, while modern
    browsers use the “XMLHttpRequest”. So here is the code.


    var requestType;


    if (window.XMLHttpRequest)


    {


    requestType = XMLHttpRequest;


    }


    else


    {


