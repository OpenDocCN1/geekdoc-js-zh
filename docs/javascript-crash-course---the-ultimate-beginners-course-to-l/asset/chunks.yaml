    So what just happened? The first thing we do is we get the time. This is simply
    for debugging purposes. It will tell us how long it took to find a path to the
    end. The next thing we do is we create two lists, one as our open list and the
    other as our closed list. Our open list will hold all the tiles that are in queue
    to be tested, while our closed list will hold all the tiles that have already
    been tested. To both of these arrays, we add the starting tile. A tile is defined
    by having an x and y position; a “g” value, which tells how costly (time wise),
    it is to take the route to that tile; an “h” value, which is a ‘heuristic’ value,
    meaning that it is guessing the distance to the end point; and finally a parent,
    which will be another tile object that is the tile that allowed this path to exist.
    This starting tile does not have a parent defined. This is because the starting
    tile does not need a parent. This will make more sense later.


    After that, we define a reachedTarget object with a single variable, a true or
    false value. This is so that we can change the value of this object later from
    inside functions, due to the fact that objects are passed in by reference. We
    also create a pathTile variable. We will set this to the last tile in our completed
    path. We also get the width and height of our 2d map. Finally, we get into the
    meat of this function. We start a while loop that continues to run until reachedTarget
    is set to true, so it will continue to run as long as we haven’t reached the target.
    In this loop, we first sort the tiles in our open list based on their perceived
    value, in ascending order. Their perceived value is calculated by the current
    cost of their route plus the estimated distance to the target. Obviously this
    sorting will not get us the actual valuable tiles, the ones in our path, but it
    will get us what we think is the most valuable tile as far as the system knows
    so far.'
