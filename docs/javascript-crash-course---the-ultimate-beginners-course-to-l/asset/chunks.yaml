    \nA boolean is a variable that holds the value of either true or false - and these\
    \ variables can be manipulated to logically breakdown conditions to come up with\
    \ a decision.\n\n## If Statements\n\nAn if statement, simply put, checks to see\
    \ IF something is true, or false. To create an if statement, you simply write\
    \ the word if followed by two rounded brackets. Within an if statement is the\
    \ block of code that will execute if the condition of the if statement is met.\
    \ if statements can also include else if statements, and else statements. An else\
    \ if statement will run if the if statement returns false. However, it also contains\
    \ its own parameter that must return true. An else statement also is called if\
    \ the if statement returns false, the difference between an else statement, and\
    \ an else if statement, is that no parameters need to be true for an else statement\
    \ to run.\n\n                     Example:\n\nvar a = 10;\n\nvar b = 20;\n\nif\
    \ (a == b) {\n\nalert(\"a is equal to b \");\n\n}\n\nelse if (a > b) {             \n\
    \nalert(\"a is greater than b \");\n\n}\n\nelse {             \n\nalert(\"a is\
