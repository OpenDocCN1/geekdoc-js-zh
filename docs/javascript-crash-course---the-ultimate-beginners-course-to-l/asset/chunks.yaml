  trans: "\n在这个示例中，如果你打印 `x`，其值将是 10，因为你正在将 5 的值加到 `x` 的值上。这句话等同于 `x = x + 5` → `x\
    \ += 5`。\n\n### 减法赋值符号：`-=`\n\n```javascript\nvar x = 5;\nx -= 5;\n```\n\n在这个示例中，如果你打印\
    \ `x`，其值将是 0，因为你正在从 `x` 的值中减去 5 的值。这条语句等同于 `x = x - 5` → `x -= 5`。\n\n### 乘法赋值符号：`*=`\n\
    \n```javascript\nvar x = 5;\nx *= 5;\n```\n\n在这个示例中，如果你打印 `x`，其值将是 25，因为你正在将 5\
    \ 的值乘以 `x` 的值。这条语句等同于 `x = x * 5` → `x *= 5`。\n\n### 除法赋值符号：`/=`\n\n```javascript\n\
    var x = 5;\nx /= 5;\n```\n\n在这个示例中，如果你打印 `x`，其值将是 1，因为你正在将 `x` 的值除以 5 的值。这条语句等同于\
    \ `x = x / 5` → `x /= 5`。\n\n### 取模赋值符号：`%=%`\n\n```javascript\nvar x = 5;\nx\
    \ %= 5;\n```\n\n在这个示例中，如果你打印 `x`，其值将是 0，因为你正在寻找 `(5/5)` 的余数。这条语句等同于 `x = x % 5`\
    \ → `x %= 5`。\n\n在 Javascript 中处理数字时，另一个重要的点是，你如何声明数字很重要。如果你使用小数值声明，在进行除法时，如果不能整除，它将输出小数；而如果你声明的是整数（全数字），那么如果不能整除，它将进行除法并向下取整。\n\
    \n例如：\n\n```javascript\nvar numberWithDecimal = 5.5;\nvar wholeNumber = 5;\n```\n\
    \n现在我们已经学习了所有可以用于变量的运算符，让我们来看一些变量的特殊情况。首先，如果你想将两个字符串拼接在一起，方法就是将它们连接（join）在一起，操作方法就是简单地使用\
    \ `+` 运算符。\n\n例如：\n\n```javascript\nvar x = \"Hello\";\nvar y = \"World\";\nvar\
    \ line = x + y;\n```\n\n在这种情况下，`line` 的值将是 `\"Hello World\"`（不带引号）。\n\n下一个特殊情况是尝试将字符串和数字相加。例如：\n\
    \n```javascript\nvar line = 15 + \"test\";\n```\n\n变量 `line` 现在将持有值 `\"15test\"\
    `（不带引号），因为因为它无法理解你为什么要尝试将一个数字加到字符串上，所以它在后台会自动将其处理为如下形式：\n\n```javascript\nvar\
    \ line = \"15\" + \"test\";\n```\n\n另一个需要考虑的因素是，Javascript 从左到右评估表达式，这意味着变量的顺序很重要。如果你执行以下操作：\n\
    \n```javascript\nvar line = 15 + 10 + \"test\";\n```\n\n这一行将产生 `\"25test\"`（不带引号），因为它会从左到右评估表达式。需要考虑的一点是，由于此示例中的两个变量是数字，它会将它们相加，但由于第三个变量是字符串，它会将评估后的数字视为字符串。请记住，运算规则将相应遵循\
    \ `BEDMAS` 或 `PEMDAS`，所以你可以使用括号。\n\n下一个特殊情况是如果你执行以下操作：\n\n```javascript\nvar line\
    \ = \"test\" + 15 + 10;\n```\n\n在这个特定的示例中，输出将是 `\"test1510\"`（不带引号），因为因为它一看到第一个变量是字符串数据类型，就会将\
    \ `line` 评估为字符串类型，然后相应地将其之后的所有内容评估为字符串。\n\n记住在 Javascript 中，你可以动态更新变量，例如：\n\n\
    ```javascript\nvar x; // undefined\nvar x = 10; // x 是一个数字\nvar x = \"This is\
    \ text\"; // x 现在是一个字符串\n```\n\n在整个指南中，你会看到我使用双引号表示字符串——这其实并不重要——你也可以使用单引号来声明字符串变量。单引号和双引号使用的陷阱在于，如果你在字符串变量外部使用双引号，并想在内部使用它，Javascript\
    \ 会感到困惑，所以为了不让它困惑，你需要在让 Javascript 字符串变量困惑的双引号之前放置一个转义字符：`\\\"`，这会在输出字符串时直接跳过该双引号并忽略\
    \ `\\`。另一种方法是直接用单引号包裹你的字符串变量，从而可以在字符串变量内部使用双引号而不会混淆 Javascript——反之亦然。\n\n示例：\n\
    \n```javascript\nvar text = \"It’s great to learn!\" ;\n```\n\n## 布尔逻辑\n布尔值（boolean）是一个持有真（true）或假（false）的变量。\n\
    \n## If 语句\n`if` 语句允许你仅在条件为真时执行代码块。如果条件为假，块中的代码将不会运行。\n\n### Else If\n`else if`\
    \ 语句允许在第一个 `if` 条件为假时检查另一个条件。你可以根据需要拥有尽可能多个 `else if` 语句。\n\n### Else\n`else`\
    \ 语句在所有先前的 `if` 和 `else if` 条件都为假时执行。每个 `if` 块只能有一个 `else` 语句。\n\n```javascript\n\
    var a = 10;\nvar b = 20;\n\nif (a == b) {\n    alert(\"a is equal to b\");\n}\
    \ else if (a > b) {\n    alert(\"a is greater than b\");\n} else {\n    alert(\"\
    a is not equal or greater than b\");\n}\n```\n\n此示例中使用的操作数（`==` 和 `>`）在下方解释：\n\
    - `==`: 检查两个值是否相等。\n- `>`: 检查左侧的值是否大于右侧。\n\n## 嵌套 If 语句\n知道另一个 `if` 语句内部包含一个 `if`\
    \ 语句也是重要的。这被称为嵌套 `if` 语句。\n\n```javascript\nvar a = 20;\nvar b = 30;\n\nif (a\
    \ == 20) {\n    if (a < b) {\n        alert(\"a is less than b and it is equal\
    \ to 20\");\n    }\n}\n```\n\n在这个示例中，我们首先检查 `a` 是否等于 `b`。如果是，我们再检查 `a` 是否小于 `b`。如果该语句也返回真，我们就可以向控制台打印\
    \ `\"a is less than b and it is equal to 20\"`。\n"
- fmt: "\nJavascript supports 6 different types of relational operators, which can\
    \ be used to compare the value of variables. They are the following:\n\n### Relational\
    \ Operators\n\n`==`  This operator checks to see if the value of two integers\
    \ are equal to each other. If they are the equal, the operator returns `true`.\
    \ If they are not, it returns `false`.\n\nExample:\n```javascript\nvar a = 10;\n\
    var b = 10;\nif (a == b) {\n    alert(\"they are the same\");\n}\n```\nThis code\
    \ checks to see IF the value of `a` is equal to the value of `b`. Since the value\
    \ of `a` is equal to the value of `b`, the value within the brackets will be `true`.\
    \ This ends up causing the above code to print out the statement “they are the\
    \ same”.\n\n`!=` This operator checks to see if the value of two things DO NOT\
    \ equal the same thing. If two things DO NOT equal the same thing, then it will\
    \ return `true`. If they DO equal the same thing, it will return `false`.\n\n\
    Example:\n```javascript\nvar a = 10;\nvar b = 20;\nif (a != b) {\n    alert(\"\
    they are not the same\");\n}\n```\nThis code will check if `a` does not equal\
    \ `b`. Since `a` does not equal to `b`, the program will print “they are not the\
    \ same” in the console.\n\n`>` This operator checks to see if something is Greater\
    \ than something else. If the value of the variable in front of it is greater\
    \ than the value of the variable after it, it will return `true`. If the value\
    \ of the variable in front of it is less than the value of the variable after\
    \ it, it will return `false`.\n\nExample:\n```javascript\nvar a = 10;\nvar b =\
    \ 20;\nif (a > b) {\n    alert(\"a is larger than b\");\n} else {\n    alert(\"\
    a is not larger than b\");\n}\n```\nThis example checks to see if `a` is larger\
    \ than `b`. Since `a` is not larger than `b`, this `if` statement will return\
    \ `false`. Instead, it will print “a is not larger than b”, because the code passes\
    \ the failed `if` statement and calls the `else` statement.\n\n`<` This operator\
    \ checks to see if something is less than something else. If the value of the\
    \ variable before the operator is less than the value of the operator after the\
    \ variable, then the code will return `true`; else, it will return `false`.\n\n\
    Example:\n```javascript\nvar a = 10;\nvar b = 20;\nif (a < b) {\n    alert(\"\
    a is larger than b\");\n} else {\n    alert(\"a is not larger than b\");\n}\n\
    ```\nThis example is just like the one before it, however, the operator changed\
    \ from greater than, to less than. Therefore the `if` statement will return `true`\
    \ this time. Since the value of `a` is less than the value of `b`, and the program\
    \ will print to the console “a is larger than b”.\n\n`>=` This operator checks\
    \ to see if something is greater than Or Equal to something else. If the value\
    \ of the variable before it is greater than Or Equal to the variable after it,\
    \ then it will return `true`. If the variable after it is greater but not equal\
    \ to the variable before it, it will return `false`.\n\nExample:\n```javascript\n\
    var a = 20;\nvar b = 20;\nif (a >= b) {\n    alert(\"a is larger or equal to b\"\
    );\n} else {\n    alert(\"a is not larger or equal to b\");\n}\n```\nIn this example,\
    \ `a` and `b` both have a value of 20. Although `a` is not greater than `b`, it\
    \ is EQUAL to `b`, therefore the statement returns `true`, and the code ends up\
    \ printing “a is larger or equal to b”.\n\n`<=` This operator checks to see if\
    \ something is less than Or Equal to something else. If the value of the variable\
    \ before it is less than Or Equal to the variable after it, then it will return\
    \ `true`. If the variable after it is less but not equal to the variable before\
    \ it, it will return `false`.\n\nExample:\n```javascript\nvar a = 20;\nvar b =\
    \ 20;\nif (a <= b) {\n    alert(\"a is larger than b\");\n} else {\n    alert(\"\
    a is not larger than b\");\n}\n```\nThis example is identical to the one before\
    \ it the operator was changed from `>=` to `<=`. Although the operator has changed,\
    \ the result is the same. Since `a` is equal to `b`, this code will return `true`,\
    \ printing “a is larger than b”.\n\n### Logical Operators\n\nJavascript supports\
    \ 3 Logical Operators that can be used in logic, which will often be used with\
    \ Relational Operators.\n\n`&&` This is known as the logical AND operator. If\
    \ the operands before and after this operator both return `true`, the condition\
    \ returns `true`. If both of the operands are false, or one operand is false,\
    \ the condition will return `false`. BOTH operands MUST be true for the condition\
    \ to return `true`.\n\nExample:\n```javascript\nvar a = 20;\nvar b = 20;\nif (a\
    \ == 20 && a == b) {\n    alert(\"a is equal to 20 and b\");\n} else {\n    alert(\"\
    a is not equal to 20 or is not equal to b\");\n}\n```\nIn this Example, we check\
    \ to see if `a` is equal to 20, AND if `a` is equal to `b`. These two conditions\
    \ will be referred as operands. Since `a` is equal to 20, and equal to `b`, the\
    \ statement returns `true`, and we print to the console “a is larger than b”.\n\
    \nExample 2:\n```javascript\nvar a = 20;\nvar b = 30;\nif (a == 20 && a == b)\
    \ {\n    alert(\"a is equal to 20 and b\");\n} else {\n    alert(\"a is not equal\
    \ to 20 or is not equal to b\");\n}\n```\nIn this next example, we check the exact\
    \ same thing as the first example. The difference this time, however, is that\
    \ we changed the value of `b` from 20 to 30. This means that when we run this\
    \ code, the `if` statement will return `false` because although `a` is equal to\
    \ 20, it is not equal to `b`. Therefore we print out “a is not equal to 20 or\
    \ is not equal to b”. Take note that the order does not matter. If the first operand\
    \ was false instead of the second, we would have the same result.\n\n`||` This\
    \ Operator is known as the logical OR operator. If the first operand OR the second\
    \ operand is true, the statement will return `true`. This means that if the first\
    \ operand returns false and the second is true, the statement will still return\
    \ `true`, and vice versa. The statement will also return `true` if both operands\
    \ are true. Essentially, when using an OR operator, at least one operand must\
    \ return `true`.\n\nExample:\n```javascript\nvar a = 20;\nvar b = 30;\nif (a ==\
    \ 20 || a == b) {\n    alert(\"a is equal to 20 or b\");\n} else {\n    alert(\"\
    a is not larger than b\");\n}\n```\nIn this example, we check to see if `a` is\
    \ equal to 20, OR if `a` is equal to `b`. In this case, `a` is equal to 20 and\
    \ is not equal to `b`. Since only one of these operands need to be true, the statement\
    \ as a whole will return `true`. Therefore the program will print “a is equal\
    \ to 20 or b” in the console.\n\nExample 2:\n```javascript\nvar a = 20;\nvar b\
    \ = 20;\nif (a == 20 || a == b) {\n    alert(\"a is equal to 20 and b\");\n} else\
    \ {\n    alert(\"a is not equal to 20 or b\");\n}\n```\nIn this example, I have\
    \ changed the value of `b` from the previous example from 30 to 20. This means\
    \ that `a` is equal to 20 and `a` is equal to `b`. Both operands return true,\
    \ therefore the statement returns `true`. This is due to the fact that an OR operator\
    \ requires 1 or more of the operators to be true. This program will output “a\
    \ is equal to 20 and b” to the console.\n\n`!` This operator is known as the logical\
    \ NOT operator. It is used to reverse the logical state of its operand. This operand\
    \ can be used with any other operand to reverse its output. If an operand was\
    \ returning true, after applying the logical NOT operator, the operand will return\
    \ `false`.\n\nExample:\n```javascript\nvar a = 21;\nvar b = 20;\nif (!(a == 20)\
    \ && a > b) {\n    alert(\"a is not equal to 20, and a is greater than b\");\n\
    } else {\n    alert(\"a is equal to 20, and a is not greater than b\");\n}\n```\n"
