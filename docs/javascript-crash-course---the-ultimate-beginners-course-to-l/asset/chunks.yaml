    让我们从 HTML 部分开始。我们创建了 HTML 标签以及 `head`，并将脚本放置在其中。在 `head` 之后，我们创建了 `body`。我们设置了样式，通过\
    \ `overflow` 属性防止出现滚动条等情况，并通过将其位置设置为 `fixed` 来防止滚动。我们还禁用了外边距（margin）和内边距（padding），以便让\
    \ `body` 紧贴左上角。最后，我们将 `body` 的 `onload` 事件设置为调用脚本的 `init` 函数，我们稍后会介绍这个函数。我们还定义了用于绘制风景的\
    \ `canvas`。我们给它分配了 `id=\"canvas\"`，宽度为 `1600`，高度为 `900`。我们还设置了它的样式，使其具有 `1` 像素的黑色边框。\n\
    \n在我们的脚本中，我们创建了一个 `Main` 对象。如果我们以后想添加输入、路径规划或任何其他功能，这会让代码更加整洁。使用对象来分离不同功能，比将所有函数随机地组合在一起要整洁得多。它还增加了作用域元素，因此你可以在不同的对象中拥有同名但执行不同任务的变量。在这个\
    \ `Main` 对象中，我们“定义”了几个变量。我们将这些每个变量都设置为 `undefined`，这听起来像是一个自矛盾的——我们将变量定义为 `undefined`——但这允许我们记住稍后将要定义哪些值。我们有\
    \ 6 个变量：`heights`，表示高度；`nextHeights`，表示下一个高度；`starMap`，表示星星；`nextStarMap`，表示下一组星星；`canvas`，存储画布；以及\
    \ `c`，存储上下文（context）。\n\n在我们的 `init` 函数中，我们设置了 `heights` 和 `nextHeights`。该函数通过创建一个数组和一个循环开始。在每次迭代中，它生成一个随机高度并将其添加到\
    \ `heights` 数组中。然后它对 `nextHeights` 数组执行相同的操作。循环完成后，我们调用 `generateStarMap` 来填充\
    \ `starMap` 和 `nextStarMap` 数组。最后，我们调用 `drawHeights`。\n\n`generateStarMap` 函数创建一个数组并循环\
    \ `1000` 次。在循环中，它向数组中添加一个星星对象，该对象包含 `x` 位置和 `y` 位置，这两个位置都是在 `canvas` 的宽度和高度之间随机生成的。最后，它返回这个数组。我们的\
    \ `init` 函数还获取了 `canvas` 元素及其上下文。最后，它设置了一个定时器，每 `25` 毫秒运行一次 `update` 函数。\n\n在我们的\
    \ `update` 函数中，我们检查 `offset` 是否等于画布宽度（因为我们正在向右滚动），如果是，我们就改变 `offset` 重新从左侧开始，将\
    \ `nextHeights` 移动到 `heights`（因为我们已经向右滚动，导致旧的高度不再显示在视野内），并生成一组新的高度。\n\n如果 `offset`\
    \ 不等于画布宽度，我们简单地将其加上 `5`（这是摄像机的任意速度）。最后，无论情况如何，我们都使用 `drawHeights` 函数绘制场景。\n\n\
    在这个 `drawHeights` 函数中，我们绘制了一个渐变层作为我们的日落，因为日落很美。我们将 `canvas` 上下文的 `fillStyle` 设置为渐变，并用这个背景填充整个画布。之后，我们将\
    \ `fillStyle` 设置为 `white`，因为我们准备绘制 `starMap`。为了实现这一点，我们遍历 `starMap`，然后对于每一个星星，在它所在的位置填充一个\
    \ `1` x `1` 的矩形，但向左偏移了 `offset` 的量。这样做是为了随着 `offset` 的增加，整个地图都会向左移动。我们还绘制了 `nextStarMap`，方法与普通的\
    \ `starMap` 相同，只是我们额外将其向右偏移了画布宽度的距离。\n\n"
