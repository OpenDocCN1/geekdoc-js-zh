  trans: "\n\n你可能还想添加某种边框来将背景与画布区分开来。这涉及到 CSS 领域，所以我将简要带过。只需将 style 属性设置为“border:black\
    \ 1px solid”即可。这会在你的画布周围创建一个宽度为 1 像素的黑色边框。\n\n```html\n<canvas id=’ourCanvas’\
    \ width=’800’ height=’600’ style=’border:black 1px solid’></canvas>\n```\n\n现在我们已经设置好了画布，必须使用它。我们需要创建一个在画布加载后运行的函数。该函数要的第一件事是使用\
    \ id 找到画布。然后，它必须获取画布的 2d 上，用于在画布上进行绘制。\n\n```javascript\nfunction doCanvasStuff()\n\
    {\n    var canvas = document.getElementById('ourCanvas');\n    var context = canvas.getContext('2d');\n\
    }\n```\n\n在继续之前，我们必须对画布元素做最后的一件事才能继续操作。我们必须设置它的 `onload` 属性来执行我们的 `doCanvasStuff`\
    \ 函数，这样一旦画布加载，它就会运行我们的画布代码。\n\n```html\n<canvas id=’ourCanvas’ width=’800’ height=’600’\
    \ style=’border:black 1px solid’ onload=’doCanvasStuff()’></canvas>\n```\n\n接下来，我们需要使用上下文（context）来绘制一些东西。首先让我们谈谈样式（Styles）。样式描述了计算机如何在画布上绘制。这可能意味着样式是实色，也可能是渐变。你可以使用样式做很多事情，但在此后的内容中，我们将重点关注实色。你可以设置两种样式：`fill\
    \ style`（填充样式）和 `stroke style`（描边样式）。`fill style` 的作用顾如其名——填充形状。`stroke style`\
    \ 基本上遵循形状的线条。你可以使用描边来勾勒形状的轮廓。要将样式设置为实色，只需将上下文的 `strokeStyle` 或 `fillStyle` 设置为\
    \ HTML 颜色值即可。该颜色值是十六进制的还是 `rgb` 函数的值并不重要。以下是两者的示例。\n\n```javascript\ncontext.strokeStyle\
    \ = ‘#88888’;\ncontext.fillStyle = ‘rgb(200, 45, 130)’\n```\n\n在这里，我们将描边样式设置为十六进制值（注意我们在十六进制值前面有一个井号\
    \ #），它的求值结果为灰色；我们将填充样式设置为 `rgb` 函数的值（注意这个函数带有引号，因为这不是一个 JavaScript 函数，而是 HTML\
    \ 函数或 CSS 函数），其中红色值设置为 200，绿色设置为 45，蓝色设置为 130，最终看起来像粉粉色。现在，每当我们调用填充函数或描边函数时，这些颜色就会被使用。那么，我们到底是如何绘制图形的呢？让我们从矩形开始。创建矩形有多种方法。第一种是使用\
    \ `fillRect` 函数（或者 `strokeRect` 函数，允许你仅勾勒矩形的轮廓）。它接受四个参数，你可能已经猜到了：x 位置、y 位置、宽度和高度。请注意，x\
    \ 和 y 位置是从左角的原点开始的。你可以使用负的 x 和 y 值，只是矩形的一部分会被切掉。所有这些值都以像素为单位。\n\n```javascript\n\
    context.fillRect(100, 100, 200, 200);\n```\n\n这个矩形将从位置 (100, 100) 延伸到位置 (300,\
    \ 300)。创建矩形的另一种方法（实际上更灵活，所以你可以修改它来创建其他形状）是使用路径（paths）。路径简单定义了一个形状，并有多种用途。要创建路径，只需调用\
    \ `beginPath` 函数。它不接受任何参数。接下来，我们需要开始形状。我们通过调用 `moveTo` 函数并传递 x 和 y 位置参数来实现。\n\n\
    ```javascript\ncontext.beginPath();\ncontext.moveTo(100, 100);\n```\n\n接下来，我们使用\
    \ `lineTo` 函数定义矩形的边，参数为 x 和 y 位置。这将从我们当前的位置（即上次使用 `moveTo` 函数设置的位置）画一条线到参数定义的位置。请注意，在使用\
    \ `lineTo` 函数后，当前位置将被设置为参数定义的位置。\n\n```javascript\ncontext.beginPath();\ncontext.moveTo(100,\
    \ 100);\ncontext.lineTo(300, 100);\ncontext.lineTo(300, 300);\ncontext.lineTo(100,\
    \ 300);\ncontext.lineTo(100, 100);\n```\n\n最后一个 `lineTo` 调用取决于你是否想对矩形进行描边。如果你不添加最后这个\
    \ `lineTo`，那么矩形的那侧实际上将没有一条线，这意味着描边不会在在那里画线。另一方面，填充无论如何都会填充该区域，因为为了创建一个实心形状，如果该处不存在线条，它必须将最后一点与第一点连接起来。\n\
    \n我们需要做的最后一件事是告诉计算机以某种方式实际绘制该形状。在这里，我们将同时进行描边和填充。注意顺序。你通常希望先描边后填充。\n\n"
- fmt: "\nYou can also add new variables to an object by simply setting it. You do\
    \ not need to write the `var` keyword.\n\n```javascript\nx.j.k = “new variable!”;\n\
    ```\n\nThe other way of making an object is to use a function. To do this simply\
    \ take any function, and call it with the “new” written in front. This function\
    \ is called the constructor.\n\n```javascript\nfunction Person()\n{\n\n}\n\nvar\
    \ david = new Person();\n```\n\nInside the constructor, we can use the `this`\
    \ keyword. The `this` keyword refers to the object containing the function being\
    \ run. In the case of the constructor, this refers to the object it is creating.\
    \ Using `this`, we can create values when the object is created. Remember that\
    \ the constructor is still a function, so it can have parameters, and remember\
    \ that the object is still an object, so all the features of an object, including\
    \ being able to create variables at any time, are still valid.\n\n```javascript\n\
    function Person(personName)\n{\n    this.name = personName;\n}\n\nvar david =\
    \ new Person(“David”);\ndavid.age = 23;\nconsole.log(david.name + “, ” + david.age);\n\
    ```\n\nWe can also create functions in this object, and we can use the `this`\
    \ keyword in them as well.\n\n```javascript\nfunction Person(personName, personAge)\n\
    {\n    this.name = personName;\n    this.age = personAge;\n    this.birthDay =\
    \ function()\n    {\n        this.age++;\n    };\n\n    this.talkAbout = function()\n\
    \    {\n        console.log(this.name + “ is currently ” + this.age + “ year(s)\
    \ old”);\n    };\n}\n\nvar david = new Person(“David”, 23);\ndavid.talkAbout();\
    \ // David is currently 23\ndavid.birthDay();\ndavid.talkAbout(); // David is\
    \ currently 24\n```\n\nHere we change the value of `age` from within the object\
    \ itself. Objects are incredibly useful for transferring related data. Be careful\
    \ when attempting to access variables, though, as if the variable has not been\
    \ defined, it will have a “value” of “undefined”, which may break your code.\n\
    \nA neat feature of objects is that when they are being passed in as a parameter\
    \ for a function, they are passed by reference, not by value. This means that\
    \ if you change the values in an object, the original object will be changed as\
    \ well.\n\n```javascript\nfunction modify(obj, val)\n{\n    obj.y = val;\n}\n\n\
    var x = { y:9 };\nmodify(x, 4);\nconsole.log(x.y); // 4\n```\n\n# Chapter 14\n\
    \n# JavaScript Functions\n\nA function is a block of code that can be run at any\
    \ point in your program with a single line of code, and it can be used as many\
    \ times as you’d like. This allows you to write a block of code once, and then\
    \ be able to use it as many times as you’d like throughout your code. To create\
    \ a function, simply write “function”, a variable name, and then brackets, followed\
    \ by squigly brackets, which hold your code.\n\n```javascript\nfunction printSomething()\n\
    {\n    console.log(“Something I guess? I don’t know...”);\n}\n```\n\nThis is a\
    \ very simple function. Between the normal brackets, you can place variable names.\
    \ These are called parameters. These parameters will allow you to give values\
    \ to the code, which could give you a different output.\n\n```javascript\nfunction\
    \ printSomething(times)\n{\n    for(var i = 0; i < times; i++)\n    {\n      \
    \  console.log(“Mum!”);\n    }\n}\n```\n\nThis function uses a variable called\
    \ `times`, runs a loop for that number of times, and in each loop prints “Mum!”.\
    \ So if you run this code with a value of 7, “Mum!” will print out 7 times. You\
    \ can have as many parameters as you want (although the fewer the better). Just\
    \ separate each variable name with a comma.\n\n```javascript\nfunction printSomething(times,\
    \ whatToPrint)\n{\n    for(var i = 0; i < times; i++)\n    {\n        console.log(whatToPrint);\n\
    \    }\n}\n```\n\nThis function will print out `whatToPrint` is set to however\
    \ many times is set. So how do we use this code? To make this run, simply type\
    \ the function name, followed by brackets, which contain values, separated by\
    \ commas, which should relate to what the function is using it. For example, for\
    \ our function, our first parameter is the `times`, so we should only be putting\
    \ a number as the value for our first parameter (although in this case, whether\
    \ the number is whole or not is important). As well, for the second parameter,\
    \ we should put what we want to print. This is called \"calling\" a function.\n\
    \n```javascript\nprintSomething(7, \"I like to move it, move it!\");\n```\n\n\
    We can call our function as many times as we want, whenever we want. Something\
    \ about functions is that you can use functions as values setting variables, and\
    \ then call them from these variables. The difference between calling a function,\
    \ and using it as a value, is that when calling a function, you use brackets in\
    \ them, while using a function as a value, you do not place brackets.\n\n```javascript\n\
    var aFunction = printSomething;\naFunction(3, \"Strike!\");An important feature\
    \ of functions is the fact that you can “return” values. This means that the function\
    \ will act as the returned value when called. To return a value, simply use the\
    \ `return` keyword, followed by a value. Here is an example. To use the returned\
    \ value, simply imagine the function call as being the returned value.\n\n```javascript\n\
    function calculateCircumference(radius)\n{\n    return Math.PI*radius;\n}\n\n\
    var circumference = 2*calculateCircumference(7);\nconsole.log(circumference);\n\
    ```\n\nIn this example, we create a function, and return half of the circumference\
    \ (why you would want to do this, I do not know, but for the sake of an example,\
    \ that is what we will do). Outside the function, we create a variable, and set\
    \ it to twice the returned value of our function, which we know will be the circumference\
    \ of our circle. If we are taking half of the circumference and multiplying it\
    \ by 2, that means we are getting the total circumference, which we print out.\
    \ Returning also has a secondary function stops a function. This means that say\
    \ you have a loop in your function that runs for a long time, but you want it\
    \ to stop after an if-statement runs. Just use the `return` keyword and it will\
    \ stop the rest of the loop from running. The return keyword keyword does not\
    \ need a value to be returned either. You can use the `return` keyword on its\
    \ own to end execution of your function where it may be.\n\n```javascript\nfunction\
    \ kindaUess(number)\n{\n    var i = 0;\n    while(true)\n    {\n        i++;\n\
    \        if(number == i)\n        {\n            console.log(i);\n           \
    \ console.log(“That wasn’t the best way to do that”);\n            return;\n \
    \       }\n    }\n}\n```\n\nThis is not a very useful example, but it shows the\
    \ syntax of it. This loop will run as long as true...is true. This loops will\
    \ run forever. We also have a variable called `i` that we simply make up. In each\
    \ iteration, we check if the number we are looking for is equal to our `i` variable.\
    \ If it is, we print out `i` and also just print something about this function\
    \ in general. Finally, we return the function. Since the function stops execution\
    \ after it’s returned, the infinite loop is escaped, and our program can continue.\
    \ This is extremely useful, especially in situations where you want to limit the\
    \ number of iterations. For example, if you are searching for something in an\
    \ array, and you find it, you may want to just return right there, to avoid wasting\
    \ more iterations on looking for a duplicate or something.\n"
