    Since the value of “a” is less than the value of “b”, and the program will print
    to the console “a is larger than b”.


    >=                   This operator checks to see if something is greater than
    Or Equal to something else. If the value of the variable before it is greater
    than Or Equal to the variable after it, then it will return true. If the variable
    after it is greater but not equal to the variable before it, it will return false.


                         Example:


    var a = 20;


    var b = 20;


    if (a >= b) {             


    alert("a is larger or equal to b");


    }


    else {             


    alert("a is not larger or equal to b");


    }


    In this example, “a” and “b” both have a value of 20\. Although “a” is not greater
    than “b”, it is EQUAL to “b”, therefore the statement returns true, and the code
    ends up printing “a is larger or equal to b”.


    <=                          This operator checks to see if something is less than
    Or Equal to something else. If the value of the variable before it is less than
    Or Equal to the variable after it, then it will return true.  If the variable
    after it is less but not equal to the variable before it, it will return false.


                         Example:


    var a = 20;


    var b = 20;


    if (a <= b) {             


    alert("a is larger than b");


    }


    else


    alert("a is not larger than b");


    }


    This example is identical to the one before it except the operator was changed
    from >= to <=. Although the operator has changed, the result is the same. Since
    “a” is equal to “b”, this code will return true, printing “a is larger than b”
    to the console.


    ## The Logical Operators:


    Javascript supports 3 Logical Operators that can be used in your logic, which
