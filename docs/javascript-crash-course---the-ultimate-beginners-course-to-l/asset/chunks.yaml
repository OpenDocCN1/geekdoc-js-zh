  raw: 'Since our sorting goes in ascending order, than the first element in the open
    list will have the lowest perceived cost, meaning it has the highest value, so
    we will use this tile for this iteration. We call a function that tries to add
    all the adjacent tiles to the open list. In this function, we check each adjacent
    coordinate to see if it’s within the bounds of the map and if it is empty or if
    it is the end tile, because if the end tile is blocked, we want our system to
    go to that tile anyway. If these conditions are valid, we try to calculate all
    the values for the tile. In the calcTile function, we check if the tile we are
    trying to calculate is in either our open or closed lists. If not, we check if
    the tile is the end tile, and if so, we set the reachedTarget value to true, and
    set the pathTile’s values to that of this ending tile. Otherwise, we calculate
    the values for the tile and return the new tile object. If the tile is in either
    the open or closed list, we return undefined. So we take the returned value of
    the calcTile function and we try to push it into our open list. If the tile is
    undefined, meaning it was not calculated, we do not push it into the array.


    Back to our main loop, after we add all adjacent tiles to the open list, we move
    the tile we are using to the closed list, and remove it from the open list, since
    now it has been calculated. Finally, we check to see if the open list is empty,
    meaning that we have checked all possible routes, and if so we sort the closed
    list by it’s heuristic value, meaning its distance to the target, in ascending
    order. This means if we can’t find any path to the target, move to the closest
    tile that we have found. We also return the path to the tile with the lowest distance
    to the target. We achieve this with our getPathFromLastTile function. It takes
    in the parameter of a tile. Since each tile has a parent, excluding the starting
    tile, we can loop through each tile until there is no parent, meaning that we
    have hit the starting tile. How do we do this? Well the first step is to create
    an array that will hold the path. We put the last tile in the path to start. Since
    we will be starting from the last tile and going towards the start, this array
    will need to be reversed. Now we have a while loop that checks if the parent of
    the most recent tile in the path (meaning the tile currently closest to the start
    based on the path) is undefined. Essentially this checks if the last tile added
    to the list is the start tile. So while we haven’t found the start tile, we add
    the parent of the most recent tile to the list. This means that basically, it
    will cascade upwards until it finds the tile that has no parent. Finally we return
    the reversed array, so that the starting tile is at index 0 and the ending tile
    is at the last index.


    So back to our main function, if the while loop breaks, meaning that we have reached
    the target, we get the path to the pathTile, which is the path we set to the solution
    of the find.


    This is called the A* pathfinding algorithm. It is not a perfect algorithm, it
    may not get you the perfect path all the time, but for a quick solution, it can
    work most of the time. This implementation of the algorithm does not check for
    impossible targets, so you may wish to check if it ever exceeds a certain time
    limit, to avoid checking the entire map for a solution that does not exist.


