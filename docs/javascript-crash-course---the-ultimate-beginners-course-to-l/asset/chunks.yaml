  trans: "\n\n`<body>` 和 `</body>` 标签包含了文档的所有内容，包括段落、导航栏、表格、图像等。\n\n`<h1>` 和 `</h1>`\
    \ 标签简单地将其之间的文本格式化为标题或段落的标题。\n\n`<p>` 和 `</p>` 标签则相应地将其之间的文本格式化为段落。\n\n## CSS \n\
    \nCSS 代表“Cascading Style Sheets”（级联样式表），它本质上定义了 HTML 元素在网页浏览器中的显示方式。\n\n现在，在我们继续之前，让我们快速回顾一下\
    \ CSS 中注释的工作原理。与 HTML 类似，注释是非常用的，也可以在 CSS 中实现，但它的语法不同。要在 CSS 中编写注释，你必须使用以下符号：\n\
    \n```css\n/* 这是一个注释 */\n```\n\n斜杠和符号之间的文本不会被处理，仅供人类阅读。因此，开始注释必须使用 `/*`，结束注释必须使用\
    \ `*/`。\n\n让我们来浏览一下关于如何编写 CSS 代码的概念。\n\n### 示例：\n\n```css\np {\n    color: red;\n\
    \    font-size: 14px;\n}\n```\n\n在上面的示例中，关于上述 CSS 代码的格式，有几点关键内容需要注意。\n\n编写 CSS\
    \ 代码时必须指定的元素是标签名或选择器。\n\n```css\np {\n    color: red;\n    font-size: 14px;\n\
    }\n```\n\n**粗体文本**表示选择器，即 `<p>` 标签，它处理文档的段落。如果你在 `<body>` 中的 `<p>` 之间放置任何文本，你现在将看到文本变为红色，字体变为\
    \ 14 像素。让我们继续分析这段代码。\n\n```css\np {\n    color : red;\n    font-size : 14px;\n\
    }\n```\n\n上述示例中的**粗体文本**表示属性。在每个选定的标签中，你必须指定该标签的属性，例如文本颜色、字体大小、字体样式、字体粗细等。你可以在互联网上查找任何你需要的属性。有许多属性，我们不会在本指南中介绍它们。不同的属性应用于不同的标签。对于本例中的“p”标签，我们可以引用\
    \ `color` 属性和 `font-size` 属性。在花括号内引用它们（这仅表示适用于选择器 `p` 的属性块），然后将其分配给特定值。\n\n```css\n\
    p {\n    color: red ;\n    font-size: 14px ;\n}\n```\n\n要给 `color` 属性分配特定值，你必须使用冒号符号（它仅用于分隔属性和值），然后输入相应的值。一旦你写完属性和值，请使用分号告诉浏览器你已经结束了该语句，以便它可以读取下一条。\n\
    \n在处理颜色时，与其使用标准的红色、蓝色、黄色等——你可以根据 `RGB` 值（红、绿、蓝）引用更具体的颜色，这些值可以通过 HTML 选择器获得。这是一个可以提供用于\
    \ CSS 的 HTML 代码的网站链接：http://html-color-codes.info/\n\n为了回顾 CSS 语法，让我们查看以下：\n\n\
    1. `p`\n2. `{`\n3. `color:`\n4. `red;`\n5. `}`\n\n上面的代码获取段落的颜色并将其更改为红色。每行都经过编号，但不会包含在代码中。编号是为了让我们扫描每一行并了解它的工作原理：\n\
    \n1. 选择器/标签\n2. 表示属性的开始\n3. 带有冒号的属性/特征以指示值\n4. 属性/特征的值，然后用分号表示语句结束\n5. 表示特定选择器（即\
    \ `p`）的属性结束\n\n记住，你可以多次这样做，记住分隔选择器块，以防浏览器产生混淆。好了，让我们先看看你如何在 HTML 文档中实际开始编码。首先，你必须进入\
    \ `<head>` 标签之间并输入以下内容：\n\n```html\n<html>\n<head>\n    <title>此网页标题</title>\n\
    \    <style type=\"text/css\">\n        p {\n            color: red;\n       \
    \     font-size: 14px;\n        }\n    </style>\n</head>\n<body>\n    <h1>这是标题文本</h1>\n\
    \    <p id=\"content\">这是网页的 own。</p>\n</body>\n</html>\n```\n\n为了在 HTML 文档中开始编写\
    \ CSS，你必须使用 `style` 标签，并借助 `type` 属性的帮助，`type` 属性引用了标准规范 `text/css`，每当你想在 HTML\
    \ 文档中编写 CSS 时都必须使用它。在这个 `style` 标签内，是你的 CSS 代码，它成功引用了 HTML 文档中所有的 `p` 标签。\n\n\
    那么，如果你只想引用特定的段落呢？现在我喜欢称为 `p` 而不是标签的原因是因为“选择器”是一个通用术语，而放置在 `p` 位置的内容也是通用的。与其在 HTML\
    \ 文档中引用一个实际的标签，你能够使用井号加上 id 名称来引用 id：\n\n```css\n#idname {\n    color: red;\n\
    \    font-size: 12px;\n}\n```\n\n你也可以使用选择器引用带有特定名称 `class` 属性标签：\n\n```css\n.classname\
    \ {\n    color: red;\n    font-size: 12px;\n}\n```\n\n现在你可能怀疑 `id` 或 `class` 是否会有帮助。让我通过以下示例代码为你解疑：\n\
    \n```html\n<html>\n<head>\n    <title>此网页标题</title>\n    <style type=\"text/css\"\
    >\n        #content {\n            color: red;\n            font-size: 14px;\n\
    \        }\n    </style>\n</head>\n<body>\n    <h1>这是标题文本</h1>\n    <p id=\"content\"\
    >这是网页的内容。</p>\n</body>\n</html>\n```\n\n在上面的示例中，你可以看到我们列出了特定的段落，受我们在 `<head>`\
    \ 标签内 CSS 中列出的更改的影响。这是你使用 id 选择器的一种方法。使用 class 选择器（并没有太大区别，只是偏好不同）则是执行以下操作：\n\n\
    ```html\n<html>\n<head>\n    <title>此网页标题</title>\n    <style type=\"text/css\"\
    >\n        .content {\n            color: red;\n            font-size: 14px;\n\
    \        }\n    </style>\n</head>\n<body>\n    <h1>这是标题文本</h1>\n    <p class=\"\
    content\">这是网页的内容。</p>\n</body>\n</html>\n```\n\n"
- fmt: "\nIn the code above, instead of using a hashtag symbol to select a specific\
    \ attribute with a specified id name, but rather a class name this time. Using\
    \ this knowledge of selectors, we can reference specific HTML elements using `Javascript`\
    \ and use that to manipulate the tags, by adding attributes or changing the content\
    \ within the tags and making them dynamic to user interaction.\n\nIn CSS, there\
    \ are different ways to actually implement the styling language into the HTML.\
    \ I have already showed you one way, which is to have it in the `head` tag with\
    \ a `style` tag. Well, there are three main different types of ways to implement\
    \ CSS, one way is inline, other way is internal, which is the way we did it and\
    \ the other way is to do it externally. The way we did it directly in the `head`,\
    \ internally. To make it external, instead of having the CSS code within the tags,\
    \ we have the `style` tag reference a file that contains all the CSS code.\n\n\
    Let’s simply look at examples of how each way works. Remember, if you reference\
    \ a certain file, like a CSS one in this instance, if you don’t list the direct\
    \ directory path (e.g. `C:\\Program Files (x86)\\Crazybump`) and just the name,\
    \ then it will resort to looking at the root directory your HTML file which is\
    \ referencing is in.\n\n### External CSS\n\nFilename: `Learn.html`\n\n```html\n\
    <html>\n    <head>\n        <title> This the webpage title </title>\n        <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"pageStyle.css\">\n        <!-- This\
    \ is the conventional line used in the head tags to reference an external CSS\
    \ file. The href attribute is used to reference the specific file and is the only\
    \ one you will change from this line for your CSS file. -->\n    </head>\n   \
    \ <body>\n        <h1> This is Header text </h1>\n        <p id = \"content\"\
    > This is the content of the webpage. </p>\n    </body>\n</html>\n```\n\nFilename:\
    \ `pageStyle.css`\n\n```css\n#content {\n    color: red;\n    font-size: 14px;\n\
    }\n```\n\nNow, since we’ve already seen how internal CSS and external CSS referencing\
    \ works, we can look at the cheapest way to do CSS: Inline. This way is not recommended\
    \ just because it isn’t neat or organized to look at. Although it is useful when\
    \ testing a few things with a specific tag. In order to do inline, for any tag\
    \ you want to style, you must add the attribute `style` with an equal sign and\
    \ then quotation marks for all the properties. Then for each property, you must\
    \ have the value separated by a colon and when you are done writing down all your\
    \ properties, you must end it off with a semi colon. Here is an example:\n\n```html\n\
    <p style = \"color: red; font-size: 14px\" id = \"content\"> This is the content\
    \ of the webpage. <p>\n```\n\nThis above is an example of inline coding. Here\
    \ is the full source code:\n\n```html\n<html>\n    <head>\n        <title> This\
    \ the webpage title </title>\n    </head>\n    <body>\n        <h1> This is Header\
    \ text </h1>\n        <p style = \"color: red; font-size: 14px\" id = \"content\"\
    > is the content of the webpage. </p>\n    </body>\n</html>\n```\n\nWe have finally\
    \ went over the fundamentals of HTML and CSS and can finally get started on understanding\
    \ how to implement `Javascript`!\n\n# Chapter 3 JavaScript Structure\n\nThe way\
    \ `Javascript` works is that it can be placed in the `body` and the `head` sections\
    \ of an HTML document. This can be done either externally or internally depending\
    \ on your situation. In order to insert javascript code into the HTML document,\
    \ you must use the `script` tag.\n\nExample:\n\n```html\n<script>\n    alert(\"\
    Javascript\");\n</script>\n```\n\nAnother way to do this is to specify the script\
    \ type:\n\n```html\n<script type = \"text/javascript\">\n    alert(\"Javascript\"\
    );\n</script>\n```\n\nTo go over what exactly is happening, we simply start with\
    \ a `script` tag, and within it, code the Javascript. In this case, we are using\
    \ the build called `alert` and it simply prints what is written within the quotation\
    \ marks. One thing to note is that in programming in general, whenever you’re\
    \ working with text (strings), you must use quotation marks to indicate that it\
    \ is indeed text and not else or else the interpreter would get confused when\
    \ processing the `JS` code.\n\nThe way the `script` tag can be used is in the\
    \ following ways:\n\n```html\n<html>\n    <head>\n        <title> This the webpage\
    \ title </title>\n        <script type = \"text/javascript\">\n            alert(\"\
    Javascript\");\n        </script>\n    </head>\n    <body>\n        <h1> This\
    \ is Header text </h1>\n        <p style = \"color: red; font-size: 14px\" id\
    \ = \"content\"> This is the content of the webpage. </p>\n    </body>\n</html>\n\
    ```\n\nOR\n\n```html\n<html>\n    <head>\n        <title> This the webpage title\
    \ </title>\n    </head>\n    <body>\n        <h1> This is Header text </h1>\n\
    \        <p style = \"color: red; font-size: 14px\" id = \"content\"> is the content\
    \ of the webpage. </p>\n        <script type = \"text/javascript\">\n        \
    \    alert(\"Javascript\");\n        </script>\n    </body>\n</html>\n```\n\n\
    As seen in both cases, you can choose to use it in the `head` or `body`. Now,\
    \ in order to do it externally, you must use the `script` tag except this case,\
    \ the `script` tag has the `src` attribute which simply would hold the directory.\
    \ In this case, no directory was supplied. In order to actually create `test.js`,\
    \ all you would do is write the raw and then save the file with a extension.\n\
    \n```html\n<html>\n    <head>\n        <title> This the webpage title </title>\n\
    \        <script src = \"test.js\"></script>\n    </head>\n    <body>\n      \
    \  <h1> This is Header text </h1>\n        <p style = \"color: red; font-size:\
    \ 14px\" id = \"content\"> is the content of the webpage. </p>\n    </body>\n\
    </html>\n```\n\nThe advantages to having external javascript code is that cached\
    \ Javascript files are able to load up faster and thus increase page-loading speeds.\
    \ Another great thing about using external Javascript files is that it is easier\
    \ to maintain, especially for large projects.\n"
