    Now, before we move on, let’s quickly go over how commenting works in CSS. Just
    like in HTML, commenting is useful, and can also be done in CSS, but it has different
    syntax for it. In order to comment in CSS, you must use the following notation:


    /* This is a comment */


    The text in between the slash and symbol is not processed and is simply there
    for human reading. So to begin a comment you must do /* and to end a comment you
    must do */.


    Let’s scan through the idea of how to write CSS code.


    Example:


                  p {


                                color: red;


                                font-size: 14px;


                  }


    In the above example, there are a few critical things to note of the format in
    the above CSS code.


    The element we must specify when writing CSS code is the tag name or the selector.


                  p {


                                color: red;


                                font-size: 14px;


                  }


    The bolded text indicates the selector, which is the <p> tag, which handles the
    paragraphs of the document. If you place any text in between <p> in the body,
    you will now see the text being red, and the font size being 14 pixels. Let’s
    move on to analyzing this code further.


                  p {


                                color : red;


                                font-size : 14px;


                  }


    The bolded text indicates the property in the above example. In every selected
    tag, you must indicate properties of that tag, like the color of the text, the
    size of the text, the style of the text, the font-weight and much more. You can
    always look for any property that you’re wanting on the internet. There are many
    properties and we won’t be going over them in this guide. There are different
    properties that are applied to different tags. For the “p” tag in this instance,
    we can reference the color property and the font-size property. Upon referencing
    them within curly braces (which simply indicates the block of properties that
    applies to the selector which is p) and then assigning it to a certain value.


                  p {


                                color: red ;


                                font-size: 14px ;


                  }


    To assign a certain value to the property of color, you must make a colon symbol
    which simply separates the property and the value, and then type out a value accordingly.
    Once you have written out the property and the value, use the semi-colon as a
    way to let the browser know that you have ended that statement so it can read
    the next statement.


    When working with colors, instead of using the standard red, blue, white, yellow,
    etc - You can reference more specific colors depending on the RGB values (Red,
    Green, Blue) which can be obtained using an HTML color selector. This is a link
    of a site that can give you HTML color codes for use in your CSS.


    Link: [http://html-color-codes.info/](http://html-color-codes.info/)


    To review CSS syntax let’s look at it in the following approach:


    1.  p


    2.  {


    3.  color:


    4.  red;


    5.  }


    The code above takes the color of the paragraph and changes the color to red.
    Each line has been numbered, but wouldn’t be included in the code. It is numbered
    so we can scan through each line and go over how it works.


    1\. Selector/Tag


    2\. Indicating the start of the selector properties


    3\. Property/Attribute name with a colon to prepare to indicate the value


    4\. Value of the Property/Attribute and then a semi-colon to indicate the end
    of statement


    5\. Indicating the end of the selector properties for the certain selector which
    was p


    Remember, you can do this as many times, just remember to separate the selector
    blocks so the browser doesn’t get confused. Well, let’s first go over how you
    can actually start coding in your HTML document with CSS. To begin, you must go
    in between your <head> </head> tags and input the following:


    <html>


                  <head>


                                <title> This the webpage title </title>


                                <style type = "text/css">


                                              p {


                                                            color: red;


                                                            font-size: 14px;


                                              }


                                </style>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p id = "content"> This is the content of the webpage.
    </p>


                  </body>


    </html>


    In order to start coding CSS in an HTML document, you must use the “style” tag
    with the help of the “type” attribute which references to the standard convention
    “text/css” which you must use every time you want to write CSS in your HTML document.
    Within this style tag, is your CSS code which references successfully to all p
    tags in the HTML document. Well, what if you’d like to only reference a specific
    paragraph?


    Now the reason I like to call p as a selector instead of a tag is because the
    term selector is a general term and what can be put in the position of p is also
    general. Instead of putting an actual tag that is being referenced in the HTML
    document, you are able to reference an id by using a hashtag and then the id name
    accordingly:


    #idname {


                  color: red;


                  font-size: 12px;


    }


    You can also use the selector to reference a tag with a “class” attribute with
    a certain name. For example:


    .classname {


                  color: red;


                  font-size: 12px;


    }


    Now you must be wondering why id or class could ever become helpful. Let me enlighten
    you with the following sample code:


    <html>


                  <head>


                                <title> This the webpage title </title>


                                <style type = "text/css">


                                              #content {


                                                            color: red;


                                                            font-size: 14px;


                                              }


                                </style>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p id = "content"> This is the content of the webpage.
    </p>


                  </body>


    </html>


    In the above example, you can see that we listed a specific paragraph to be affected
    by the change we listed in the CSS within the head tag. This is one way that you
    can use the id selector. To use the class selector (not really a big difference,
    just two preferences) is to do the following:


    <html>


                  <head>


                                <title> This the webpage title </title>


                                <style type = "text/css">


                                              .content {


                                                            color: red;


                                                            font-size: 14px;


                                              }


                                </style>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p class = "content"> This is the content of the webpage.
    </p>


                  </body>


    </html>'
