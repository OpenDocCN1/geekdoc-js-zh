  trans: "\n\n在上面的代码中，我们没有使用井号符号来选择具有特定 id 名称的属性，而是这次使用了类名。利用这些选择器的知识，我们可以使用 `Javascript`\
    \ 引用特定的 HTML 元素，并通过添加属性或更改标签内的内容使其对用户交互产生动态，从而操作这些标签。\n\n在 CSS 中，有不同的方法可以将样式语言实际实现到\
    \ HTML 中。我已经向你展示了一种方法，即在 `head` 标签中使用 `style` 标签。事实上，实现 CSS 的方法主要有三种类型：一种是内联（inline），另一种是内部（internal），也就是我们之前采用的方法；另一种是外部（external）。我们之前是直接在\
    \ `head` 中内部编写的。要实现外部引用，我们不再在标签内编写 CSS 代码，而是让 `style` 标签引用一个包含所有 CSS 代码的文件。\n\n\
    让我们简单看下每种方式的工作示例。请记住，如果你引用了某个文件（在此例中为 CSS 文件），如果你没有列出直接目录路径（例如 `C:\\Program Files\
    \ (x86)\\Crazybump`）而只写名称，那么它将退而求其次，在你引用的 HTML 文件所在的根目录中查找。\n\n### 外部 CSS\n\n\
    文件名：`Learn.html`\n\n```html\n<html>\n    <head>\n        <title> 这是网页标题 </title>\n\
    \        <link rel=\"stylesheet\" type=\"text/css\" href=\"pageStyle.css\">\n\
    \        <!-- 这是在 head 标签中用于引用外部 CSS 文件的标准行。href 属性用于引用特定文件，它是你为 CSS 文件修改时唯一需要更改的内容。\
    \ -->\n    </head>\n    <body>\n        <h1> 这是标题文本 </h1>\n        <p id = \"\
    content\"> 这是网页的内容。 </p>\n    </body>\n</</html>\n```\n\n文件名：`pageStyle.css`\n\
    \n```css\n#content {\n    color: red;\n    font-size: 14px;\n}\n```\n\n现在，既然我们已经看到了内部\
    \ CSS 和外部 CSS 引用的工作方式，我们可以查看最“廉价”的 CSS 方法：内联（Inline）。这种方法不被推荐，仅仅因为它看起来不整洁或不组织。尽管在对特定标签进行某些测试时，它是很有用的。为了实现内联，对于任何想要样式的标签，你必须添加\
    \ `style` 属性，并带有等号和引号来编写所有属性。然后对于每个属性，你必须用冒号分隔值，当你写完所有属性后，必须用分号结束。这里有一个示例：\n\n\
    ```html\n<p style = \"color: red; font-size: 14px\" id = \"content\"> 这是网页的内容。\
    \ <p>\n```\n\n上面是内联编码的示例。这里是完整的源代码：\n\n```html\n<html>\n    <head>\n        <title>\
    \ 这是网页标题 </title>\n    </head>\n    <body>\n        <h1> 这是标题文本 </h1>\n      \
    \  <p style = \"color: red; font-size: 14px\" id = \"content\"> 是网页的内容。 </p>\n\
    \    </body>\n</</html>\n```\n\n我们终于涵盖了 HTML 和 CSS 的基础知识，终于开始学习如何实现 `Javascript`\
    \ 了！\n\n# 第 3 章 JavaScript 结构\n\n`Javascript`的工作原理是它可以放在 HTML 文档的 `body` 和 `head`\
    \ 部分。根据你的情况，可以通过外部或内部方式完成。为了在 HTML 文档中插入 javascript 代码，你必须使用 `script` 标签。\n\n\
    示例：\n\n```html\n<script>\n    alert(\"Javascript\");\n</script>\n```\n\n另一种这种方法是指定脚本类型：\n\
    \n```html\n<script type = \"text/javascript\">\n    alert(\"Javascript\");\n</script>\n\
    ```\n\n为了回顾具体发生了什么，我们只需要从一个 `script` 标签开始，并在其中编写 Javascript。在这种情况下，我们正在使用名为 `alert`\
    \ 的构建，它只是简单地打印引号内的内容。需要注意的是，在通用的编程中，每当你处理文本（字符串）时，必须使用引号来指示它确实文本而不是其他，否则解释器在处理\
    \ `JS` 代码时会困惑。\n\n`script` 标签的使用方式如下：\n\n```html\n<html>\n    <head>\n       \
    \ <title> 这是网页标题 </title>\n        <script type = \"text/javascript\">\n     \
    \       alert(\"Javascript\");\n        </script>\n    </head>\n    <body>\n \
    \       <h1> 这是标题文本 </h1>\n        <p style = \"color: red; font-size: 14px\"\
    \ id = \"content\"> 这是网页的内容。 </p>\n    </body>\n</</html>\n```\n\n或者\n\n```html\n\
    <html>\n    <head>\n        <title> 这是网页标题 </title>\n    </head>\n    <body>\n\
    \        <h1> 这是标题文本 </h1>\n        <p style = \"color: red; font-size: 14px\"\
    \ id = \"content\"> 是网页的内容。 </p>\n        <script type = \"text/javascript\">\n\
    \            alert(\"Javascript\");\n        </script>\n    </body>\n</</html>\n\
    ```\n\n如两种情况所示，你可以选择在 `head` 或 `body` 中使用。现在，为了从外部实现，你必须使用 `script` 标签，但在此情况下，`script`\
    \ 标签具有 `src` 属性，它仅包含目录。在这种情况下，没有提供目录。为了实际创建 `test.js`，你只需编写原始代码并带扩展名保存文件。\n\n\
    ```html\n<html>\n    <head>\n        <title> 这是网页标题 </title>\n        <script\
    \ src = \"test.js\"></script>\n    </head>\n    <body>\n        <h1> 这是标题文本 </h1>\n\
    \        <p style = \"color: red; font-size: 14px\" id = \"content\"> 是网页的内容。\
    \ </p>\n    </body>\n</</html>\n```\n\n拥有外部 javascript 代码的优点是缓存的 Javascript 文件能够加载更快，从而提高页面加载速度。使用外部\
    \ Javascript 文件的另一个大优点是它更容易维护，特别是对于大型项目。\n\n"
