    than “b”, this if statement will return false. Instead, it will print “a is not
    larger than b”, because the code passes the failed if statement and calls the
    else statement.


    <                                       This operator checks to see if something
    is less than something else. If the value of the variable before the operator
    is less than the value of the operator after the variable, then the code will
    return true; else, it will return false.


                         Example:


    var a = 10;


    var b = 20;


