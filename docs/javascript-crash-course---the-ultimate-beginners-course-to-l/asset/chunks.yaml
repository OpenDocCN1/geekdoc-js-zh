  trans: "\n\n# A* 路径规划算法实现\n\n由于我们的排序是升序的，因此开放列表（open list）中的第一个元素将感知成本最低，意味着它的值最高，因此我们将在本次迭代中使用该瓦格。我们调用一个函数，尝试将所有相邻的瓦格添加到开放列表中。在这个函数中，我们检查每个相邻坐标，以确定它是否在地图范围内，以及它是否为空或者是终点瓦格，因为即使终点瓦格被阻塞，我们也希望系统能够到达该瓦格。如果这些条件有效，我们就尝试计算该瓦格的所有值。\n\
    \n在 `calcTile` 函数中，我们检查正在尝试计算的瓦格是否在我们的开放列表或关闭列表（closed lists）中。如果不在，我们检查该瓦格是否为终点瓦格，如果是，我们将\
    \ `reachedTarget` 值设置为 `true`，并将 `pathTile` 的值设置为该终点瓦格的值。否则，我们计算该瓦格的值并返回新的瓦格对象。如果该瓦格已在开放列表或关闭列表中，我们返回\
    \ `undefined`。因此，我们获取 `calcTile` 函数的返回值并尝试将其推入开放列表。如果瓦格是 `undefined`（意味着它未被计算），我们就不将其推入数组。\n\
    \n回到主循环，在将所有相邻瓦格添加到开放列表后，我们将正在使用的瓦格移动到关闭列表，并从开放列表中移除，因为它现在已经过计算过了。最后，我们检查开放列表是否为空，这意味着我们已经检查了所有可能的路线，如果是，我们就根据其启发式值（即它到目标的距离）对关闭列表进行升序排序。这意味着如果我们无法找到通往目标的路径，就移动到我们找到的距离目标最近的瓦格。我们还会返回距离目标最近的瓦格路径。我们通过\
    \ `getPathFromLastTile` 函数实现了这一点。该函数接收一个瓦格作为参数。由于起始瓦格外，每个瓦格都有一个父节点，我们可以遍历每个瓦格，直到没有父节点，这意味着我们到达了起始瓦格。\n\
    \n我们如何做到这一点呢？嗯，第一步是创建一个存储路径的数组。我们首先将最后一个瓦格放入路径中。由于我们将从最后一个瓦格开始向起点移动，因此数组需要被反转。现在我们有一个\
    \ `while` 循环，检查路径中最新瓦格（即根据路径当前距离起点最近的瓦格）的父节点是否为 `undefined`。本质上，这检查了添加到列表的最后一个瓦格是否是起始瓦格。因此，在我们找到起始瓦格之前，我们将最新瓦格的父节点添加到列表中。这意味着基本上，它会向上级联，直到找到没有父节点的瓦格为止。最后，我们返回反转后的数组，使得起始瓦格位于索引\
    \ 0，终点瓦格位于最后一个索引。\n\n回到我们的主函数，如果 `while` 循环中断（意味着我们已经到达目标），我们就获取到 `pathTile` 的路径，这就是我们设为\
    \ `find` 结果的路径。\n\n这被称为 A* 路径规划算法。它并不是一个完美的算法，它可能不能一直为你提供完美的路径，但对于快速解决方案来说，它在大多数情况下都能运行。该算法的实现没有检查不可能的目标，因此你可能希望检查它是否超过了某个时间限制，以避免检查整个地图来寻找一个不存在的解决方案。\n\
