    # Chapter 4


    # JavaScript Variables


    A variable is essentially a storage unit that holds a certain type of data. It
    is named by the programmer, and is used to identify the data it stores. A variable
    can usually accessed or changed at any time. You can write information to it,
    take information from it, and even copy the information and add it to another
    variable. In every programming language, variables hold a specific data type,
    whether that be a string (text) or a whole number (integer) or a decimal number
    (float/double), these are things to consider when you are programming. There are
    many different data types like numbers, strings, arrays, objects, and more.


    In order to declare a variable, you must use the keyword “var” and then the name
    of the variable afterward (you can name this anything you want). Remember that
    everything in Javascript is case sensitive. The use of variables is to hold a
    value so it can be used for later use or manipulation in the code. Let’s go over
    a few examples of variable declarations:


    var numberOfDogs = 16;                                                           
    // number


    var nameOfDog = “Copper”;                                              // string


    var hasDog = true;                                                                     
    // boolean


    var cars = [“First”, “Second”];                  // array


    var anObject = {myName:”Something”};                 // object


    You might not totally understand what is going on in these statements like the
    array or object, but it is easy to grasp the number and string variable declaration.
    For the numberOfDogs variable, we are declaring a variable by using the “var”
    keyword and then typing out the name of the variable. In this case, the variable
    name is “numberOfDogs” which is then assigned to the value of 16\. This is done
    by the use of an equal sign which essentially signifies what it’s meant to signify
    - it is the assignment operator which assigns values to the array.


    The next variable is “nameOfDog” which is equal to Copper - although the dog’s
    name is surrounded by quotation marks - this is used to tell the browser that
    it is a piece of text and not anything else. If Javascript detects a number based
    on the fact that it doesn’t have any quotation marks around it, then writing text
    with a number in it, would make sense for quotation marks to be added to implicitly
    tell the interpreter that it is indeed text that we’re trying to assign and not
    a name and a number like “Copper9” - this is why strings are surrounded with quotation
    marks to signify that it is indeed text that should not be viewed as anything
    else.


    The next variable is important because you will be seeing this used a lot in programming.
    A boolean is simple a data type for variables that will only hold a value of true
    and false. This is used a lot in programming as you can have your program compute
    algorithms that decide on things, and then declare a certain variable true or
    false depending on the current situation and adapt accordingly. Long story short,
    booleans are a big deal in programming and there is a whole logical backend that
    must be explained for it, which will be the case later on in this guide.


    The next two variables look confusing and will be explained on a later part of
    this guide which covers arrays and objects, but were listed just to note that
    they are two of the four main data types that are used in Javascript. Do note
    that there are more than just these four data types, but these are the ones you
    will encounter most of the time or work with. Now let’s go over important variable
    operators so we can see how working with variables works in terms of manipulation
    in arithmetic before we continue on with variables.


