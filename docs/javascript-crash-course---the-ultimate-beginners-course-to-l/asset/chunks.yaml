                                <title> This the webpage title </title>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p style = "color: red; font-size: 14px" id = "content">
    This is the content of the webpage. </p>


                  </body>


    </html>


    We have finally went over the fundamentals of HTML and CSS and can finally get
    started on understanding how to implement Javascript!


    # Chapter 3


    # JavaScript Language Structure


    The way Javascript works is that it can be placed in the <body> and the <head>
    sections of an HTML document. This can be done either externally or internally
    depending on your preference in the situation. In order to insert javascript code
    internally into the HTML document, you must use the <script> tag.


    Example:


    <script>


                  alert(“Javascript test”);


    </script>


    Another way to do this is to specify the script type:


    <script type = “text/javascript”>


                  alert(“Javascript test”);


    <script>


    To go over what exactly is happening, we simply start with a script tag, and within
    it, code the Javascript code. In this case, we are using the build in javascript
    function called “alert” and it simply prints out what is written within the quotation
    marks. One thing to note is that in programming in general, whenever you’re working
    with text (or strings), you must use quotation marks to indicate that it is indeed
    text and not anything else or else the interpreter would get confused when processing
    the JS code.


    The way the script tag can be used is in the following ways:


    <html>


                  <head>


                                <title> This the webpage title </title>


                                              <script type = "text/javascript">


                                                            alert("Javascript test");


                                              </script>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p style = "color: red; font-size: 14px" id = "content">
    This is the content of the webpage. </p>


                  </body>


    </html>


                  OR


    <html>


                  <head>


                                <title> This the webpage title </title>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <script type = "text/javascript">


                                              alert("Javascript test");


                                </script>


                                <p style = "color: red; font-size: 14px" id = "content">
    This is the content of the webpage. </p>


                  </body>


    </html>


    As seen in both cases, you can either choose to use it in the head tag or the
    body tag. Another thing to note is the fact that you can place any number of scripts
    in an HTML document. Now as we know, there is an internal way of adding javascript
    and there is also an external way of doing it.


    In order to do it externally, you must use the script tag except in this case,
    the script tag is fed the “src” attribute which simply would hold the value of
    the directory path to the js file that you are referring to.


    For example:


                  <script src = “test.js”></script>


    In this certain case, the script will refer to a js file of name “test” within
    the root folder since no directory was supplied. In order to actually create test.js
    - all you would do is write the raw Javascript code and then save the file with
    a js extension.


    Here is a full example with the HTML document:


    Declaration within <head></head>:


    <html>


                  <head>


                                <title> This the webpage title </title>


    <script src = “test.js”></script>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


                                <p style = "color: red; font-size: 14px" id = "content">
    This is the content of the webpage. </p>


                  </body>


    </html>


    OR


    Declaration within <body></body>:


    <html>


                  <head>


                                <title> This the webpage title </title>


                  </head>


                  <body>


                                <h1> This is Header text </h1>


    <script src = “test.js”></script>


                                <p style = "color: red; font-size: 14px" id = "content">
    This is the content of the webpage. </p>


                  </body>


    </html>


    The advantages to having external javascript code is that cached Javascript files
    are able to load up faster and thus increase page-loading speeds. Another great
    thing about using external Javascript files is that it is easier to maintain,
    especially for large projects.'
