    \ way to solve this problem. Maybe there is a way you can write this in a quarter\
    \ of the length; with programming, there is never only one answer.\n\n# Chapter\
    \ 7\n\n# Loops and Arrays\n\nThis section of the guide is important because it\
    \ covers one of the most important concepts in programming. Loops are what it\
    \ says they are - they are simply functions that allow you to loop a certain block\
    \ of code for a certain amount of iterations depending on what you ask of it.\
    \ Although this may not seem useful right now, when you start to apply your knowledge\
    \ to real programming applications, you will find use of them. Before we cover\
    \ arrays, let’s go over how loops work.\n\n## Loops\n\nLoops in Javascript are\
    \ relatively the same as many other programming languages. The syntax for it is\
    \ also pretty straight forward. In every loop, there is a condition that is set\
    \ forth for the loop to check whether or not it is true and until the case is\
    \ the opposite, is when the loop itself would break out itself. For example, if\
    \ you were to create a loop and say that I want it to run a certain block of code\
    \ 10 times before stopping, there are a few ways to do this because there are\
    \ a different type of loops. A general idea of a loop is the following:\n\n```javascript\n\
    loop (condition) {\n    // block of code\n}\n```\n\nIn order to create a loop\
    \ in Javascript - we must understand the different type of loops and when they\
    \ are useful. Let’s go over these types of loops and then I’ll explain how each\
    \ of them work as we go through and by the end, you should have gained a good\
    \ understanding of how loops work.\n\n## For Loops\n\n```javascript\nfor (x =\
    \ 0; x < 10; x++) {\n    alert(\"Hi \" + x);\n}\n```\n\nThere are quite a few\
    \ things that are going on in the above example so let’s go over it line by line.\
    \ The first line says:\n\n`for (x = 0; x < 10; x++)`\n\nIn the above statement,\
    \ it is a conventional standard for the `for` loop. We must first declare the\
    \ variable, so let’s start by declaring the `x` variable and make it an int starting\
    \ at 0. Next, let’s add a semicolon to separate that specific component of the\
    \ for loop by adding a condition. That is why I did `x < 10` which simply says\
    \ that for however long that `x` is less than 10, run the block of code that is\
    \ under my curly braces (`{` and `}`). This statement is now separated by another\
    \ semi-colon to let the final element of the for loop to be entered. This is the\
    \ part where you tell the specific variable that you declared, to do a certain\
    \ arithmetic operation. In this case, we are telling `x` to increment each time\
    \ the loop passes.\n\nLet’s go over this in a pseudocode approach (english-readable):\n\
    \n```javascript\nfor (declare variable; create condition for variable; affect\
    \ variable) {\n    // Run this block of code\n}\n```\n\nOnce it runs the block\
    \ of code, it will go back to the first statement and check whether or not the\
    \ condition is still met. It will skip declaring the variable since it will notice\
    \ it has already been declared. It will then skip to affecting the variable before\
    \ checking if the condition is met.\n\nHere’s a blueprint to follow for the for\
    \ loop or any loop:\n\nDeclares Variable → Checks Condition → Runs block of code\
    \ → Affects Variable → Checks Condition → Runs block of code → Affects Variable\
    \ → Checks Condition → Runs block of code → Repeat\n\nNow if we look back at the\
    \ code we created with a little modification:\n\n```javascript\nfor (x = 0; x\
    \ < 10; x++) {\n    alert(\"Current Number: \" + x);\n}\n```\n\nWe can see that\
    \ this loop is incrementing `x` from 0 to 9, so technically 10 iterations since\
    \ 0 is inclusive. Therefore, the loop alerts the following:\n\nCurrent Number:\
    \ 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number:\
    \ 4\nCurrent Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number:\
    \ 8\nCurrent Number: 9\n\nRemember how I said a for loop’s last statement is the\
    \ arithmetic operation for the variable - well the variable can be affected in\
    \ any way you wanted as well. Now that we know how a `for` loop works, it will\
    \ be easier to understand how a `while` loop and `do-while` loop work.\n\n## While\
    \ Loop\n\nThe only difference with `while` loop compared to a `for` loop is that\
    \ it only carries the condition of the loop, not the variable. Therefore, you\
    \ must actually declare the variable outside of the loop before affecting it in\
    \ the loop to carry out a certain condition.\n\n```javascript\nvar x = 0;\nwhile\
    \ (x < 10) {\n    alert(\"Current number: \" + x);\n    x++;\n}\n```\n\nIn the\
    \ example above, seen, a `while` loop simply checks for a condition and when it\
    \ has been met, runs the block of code, and then affects the variable `x` so it\
    \ goes back to checking the condition when the block of code is done, and simply\
    \ continues to do it until `x` is not less than 10. The output for this is the\
    \ same as the `for` loop:\n\nCurrent Number: 0\nCurrent Number: 1\nCurrent Number:\
    \ 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent Number: 5\nCurrent Number:\
    \ 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number: 9\n\nThere are things\
    \ that can go wrong with this `while` loop like the accidental creation of an\
    \ infinite loop.\n\n```javascript\nvar x = 0;\nwhile (x < 10) {\n    alert(\"\
    Current number: \" + x);\n}\n```\n\nIn the above example, it is doing exactly\
    \ everything the previous loop was doing except the output (which is to alert\
    \ a certain text) would be infinitely displaying because the variable `x` is never\
    \ being affected.\n\nThe final type of loop we will be covering is the `do-while`\
    \ loop. This loop does everything the `while` loop does, except it does something\
    \ at least once regardless of the condition before resorting on the condition.\n\
    \n```javascript\nvar x = 0;\ndo {\n    alert(\"Current number: \" + x);\n    x++;\n\
    } while (x < 10)\n```\n\nThe above example simply runs the iteration of the block\
    \ of code at least once regardless of the condition that is given at the end before\
    \ actually testing the condition. This can be useful if you ever wanted a loop\
    \ to do something, at least do it once before checking the condition.\n\n## Continue\
    \ keyword\n\nThe `continue` keyword is used when you want to skip an iteration\
    \ of a loop.\n\n```javascript\nvar x = 0;\nwhile (x < 10) {\n    if (x == 5) {\n\
    \        continue;\n    }\n    alert(x);\n}\n```\n\nIn the above example, we are\
    \ checking if `x` is equal to 5, if it is then what we do is skip the iteration\
    \ of the loop, meaning the output of this loop becomes:\n\nCurrent Number: 0\n\
    Current Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent\
    \ Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number: 9\n\nAs seen\
    \ in the output above, the loop skips 5 because it was told to skip that iteration\
    \ of the loop before it even had the chance to alert the number.\n\n## Break keyword\n\
    \nThe `break` keyword is used when you want to break out of the loop.\n\n```javascript\n\
    var x = 0;\nwhile (x < 10) {\n    if (x == 5) {\n        break;\n    }\n    alert(x);\n\
    }\n```\n"
