    to check each time which request to use. We are essentially setting requestType
    to have the value of either of these functions. Now let’s configure our request.
    First, we make our object.


    var request = new requestType("Microsoft.XMLHTTP");


    Here we create our request using the requestType we defined before. We also use
    the parameter of “Microsoft.XMLHTTP”. This is kind of tricky. The XMLHttpRequest
    object has no parameters by default. This means that if requestType is an XMLHttpRequest,
    the parameter will be ignored. The ActiveXObject, on the other hand, does have
    a single parameter, which in this case will always be “Microsoft.XMLHTTP”. This
    means that if requestType is an ActiveXObject, it will use this parameter. So
    that is how we create our request. The next step is to define what should be done
    when our request is done. To do this, we set the request’s onreadystatechange
    variable and set it to a function.


    request.onreadystatechange = function()


    {


    if(request.readyState == 4 && request.status == 200)


    {


                  document.write(request.responseText);


    }


    }


    In this function, we first check two things: readyState and status. ReadyState
    checks which state the request is in, where 4 is finished. Status checks what
    code the server returned, where 200 is “good”. Status can also be other values,
    like 404, which means “file not found”. If the request is finished and has the
    status code of 200, we run whatever code we want, which in this case is simply
    to write out the text to the document. The final step in AJAX is to actually send
    the request. Here is the code for that.


    request.open(“GET”, “local url of target file”, true);


    request.send();


    So first we call the open method, with 3 parameters. First, the method, which
    can either be GET or POST. I will not go into too much detail, but essentially,
    GET sends extra data through the url, while POST sends extra data in a more hidden
    and secure manner. Second, the file. This is local to the website address, so
    if your address is “ [www.123random.com](http://www.123random.com) ”, and for
    your file parameter you put “myfile.php”, AJAX will go to “ [www.123random.com/myfile.php](http://www.123random.com/myfile.php)
    ”. Third, asynchronous or not. Generally, you will want to make this asynchronous,
    because if you don’t the whole website will freeze until the request is finished,
    which if the file is not able to be sent, could take a while. So unless you know
    what you’re doing, keep the third parameter “true”. Finally, we call the send
    method, which does exactly what is says—sends the request. Be aware, that if you
    are using the POST method, to place a string as a parameter for the send method,
    but before using POST learn how to properly use it and if you actually need it
    or not.


    Our example code is very simple in that we do nothing special with the response.
    One thing you can do is, rather than using responseText, you can use responseXML.
    Using this, you can call “getElementsByTagName” functions and access all sorts
    of different data very easily.


