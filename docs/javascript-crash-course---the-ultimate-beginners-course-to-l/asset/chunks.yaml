    \ an `id` of `canvas`, a width of `1600` and a height of `900`. We also set its\
    \ style to have a black border with a width of `1` pixel.\n\nIn our script, we\
    \ create a `Main` object. This simply makes it cleaner if we ever want to add\
    \ other features like input or pathfinding or whatever else. It is cleaner to\
    \ have objects that separate things than have all of your functions randomly grouped\
    \ together. It also adds the element of scope, so you can have two variables with\
    \ the same name in separate objects that do different things. In this `Main` object,\
    \ we “define” several variables. We set each of these variables to `undefined`,\
    \ which sounds like an oxymoron—we defined the variable as `undefined`—but this\
    \ will allow us to remember which values we will have defined later. We have 6\
    \ variables: `heights`, which tells us the heights; `nextHeights`, which tells\
    \ us the next heights; `starMap`, which tells us the stars; `nextStarMap`, which\
    \ tells us the next stars; `canvas`, which stores the canvas; and `c`, which stores\
    \ the context.\n\nIn our `init` function, we set up the `heights` and `nextHeights`.\
    \ This function starts by creating an array and a loop. In each iteration, it\
