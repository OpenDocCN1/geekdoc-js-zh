    context.fillStyle = ‘rgb(200, 45, 130)’;


    Here we set the stroke style to a hexadecimal value (notice that we have a pound
    sign, #, in front of our hex value), which evaluates to grey, and we set our fill
    style to the value of the rgb function (notice that this function is in quotes,
    as this is not a JavaScript function, but either an HTML function or a CSS function)
    with the red value set to 200, the green to 45, and the blue to 130, which ends
    up looking like a pink colour. Now whenever we call a fill function, or a stroke
    function, these colours will be used. So how do we actually draw things? Let’s
    start with a rectangle. There are multiple methods to make a rectangle. The first
    is to use the fillRect function (or the strokeRect function, as this will allow
    you to just outline a rectangle). It takes four parameters, which you could probably
    guess: x position, y position, width, and height. Be aware that the x and y positions
    start at an origin at the top-left. You can have negative x and y values, just
    part of the rectangle will be cut off. All of these values are measured in pixels.


    context.fillRect(100, 100, 200, 200);


    This rectangle will go from a position of (100, 100) to a position of (300, 300).
    Another way to make a rectangle (and is actually more flexible, so you could modify
    it to make other shapes) is to use paths. Paths simply define a shape, and have
    a variety of uses. To create a path, simply call the beginPath function. It takes
    no parameters. Next, we need to start our shape. We do this by calling the moveTo
    function with the parameters of an x and y position.


    context.beginPath();


    context.moveTo(100, 100);


    Next we define the lines of our rectangle using the lineTo function, with the
    parameters of an x and y position. This will make a line from our current position,
    which we last set using the moveTo function, to the position defined by the parameters.
    Be aware that after using the lineTo function, the current position is set to
    the position defined by the parameters.


    context.beginPath();


    context.moveTo(100, 100);


    context.lineTo(300, 100);


    context.lineTo(300, 300);


    context.lineTo(100, 300);


    context.lineTo(100, 100);


    The last lineTo call depends on whether you wish to stroke your rectangle or not.
    If you do not add this last lineTo, there will not actually be a line on that
    side of the rectangle, meaning the stroke will not draw a line there. Fill on
    the other hand, will fill that area no matter what, because to make a solid shape,
    it must connect the last point with the first if a line does not exist there.


    The final thing we need to do is tell the computer to actually draw the shape
    in some way. Here we will do both a stroke and a fill. Be careful with the order.
    You generally want to fill before you stroke, because you want the outline to
    be over top the filled in shape. To do either of these functions, use the fill
    function and the stroke function, each empty of parameters.


    context.beginPath();


    context.moveTo(100, 100);


    context.lineTo(300, 100);


    context.lineTo(300, 300);


    context.lineTo(100, 300);


    context.lineTo(100, 100);


    context.fill();


    context.stroke();


    With this second method, we can do more fancy things than a rectangle. For example,
    if we change our second lineTo’s x parameter to something like 500, our shape
    will appear to be half a trapezoid. You could do other interesting things as well.
    For example, if you make a for loop, that runs for a random number of loops, where
    in each iteration, you make it lineTo a random coordinate in the range of the
    canvas, you could make a jumble of lines. Not too useful, but when you combine
    loops and lineTo’s you can do very interesting things. Here is the code for that
    jumble of lines.


    context.beginPath();


    context.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);


    for(var i = 0; i < 300; i++)


    {


    context.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);


    }


    context.stroke();


    # Chapter 13


    # JavaScript Objects


    In Javascript, objects are rather fluid. They are not defined like other languages.
    They store values given a variable name, and that is all. These variables can
    be anything you want, from numbers, to other objects, to functions. There are
    two ways to make objects. Here is the first.


    var x = { y : 17, z : “Yo wat up?”, i : function(){ console.log(“Hello friend!”);
    }, j : { j : “This j can be inside of the other j because they are within each
    other” } };


    We start with curly brackets to define our object. Inside, we put a variable name,
    followed by a colon, followed by a value. Notice that in our j object in our x
    object, we have a j variable. This is because the j variable in the j object is
    contained within the j object, and ignores the x object. That was kind of confusing.
    Look at it this way. When we are setting our j object, we are creating a new object.
    In this object we have a variable called j, with some value. The x object just
    knows that it has a variable called j, while we know that this j is an object.
    Now how do we access these values? Simply type the object, followed by a dot,
    followed by the variable name. Then treat them like whatever value you set them
    as.


    console.log(x.y);


    console.log(x.z);


    x.i();


    console.log(x.j.j);


    We treat x.i as a function, as seen by using the parameter brackets. We also treat
    x.j as an object, by using the dot to access it’s j variable. Changing these object
    values is also possible. To do this, simply treat the value as a normal variable.
    Just write out its location (within the object, for example, x.j.j), followed
    by an equals sign, followed by a value. Be careful which value you are placing
    inside a variable, as there are no restrictions when setting variables in objects.
    You may create x.y to be a string, but then accidentally set it to a number. This
    may be desirable or not depending on your situation.


    x.y = 42;


    x.j.j = “I made a new string!”;'
