  raw: 'So what in the world is going on here? First, we have loaded two new modules:
    fs (file system) and mime (detects the type of a file). In our handler, we do
    a variety of things. First we get the stats on our url, but with “public” appended
    to it. This means that no matter what, the handler will only look through files
    in a “public” folder that must be in your project (right next to your server’s
    .js file). This is to prevent people from seeing anything other than what is public.
    It would not be very good if people could see your server’s code, because then
    they may be able to find exploits easier and use them. We also give this lstat
    method a callback. This is what makes the method asynchronous. It is very important
    this stuff is asynchronous, because otherwise, your entire server would freeze
    when it is checking for file data. This is bad because this would mean your server
    would stop responding to users until the file stuff is finished doing it’s thing.


    In the callback, the first thing we do is check if an error exists, and if it
    does, respond to the user with a very generic error message (if you wanted to
    make this better, you could change this error message based on what error you
    are getting, but this is supposed to be simple) and do not proceed to the rest
    of the method. If there is no error, we check if the file we are looking at is
    a directory. If it is, then we try and get the default file, the index.html file.
    We do this by simply appending ‘/index.html’ and trying to read this file. The
    readFile also has a callback, meaning it is also asynchronous. In this callback,
    we again check if we have an error, and return a generic error message if so.
    Otherwise, we use the data and send it to the client.


    Notice that we are assuming that the index file can only be an html file. This
    may not always be the case, but most of the time, you could have an html file
    that simply loads other dynamic data using AJAX. Now, if the original request
    was not a directory, meaning it is a file, we simply try and load that file, check
    if there is an error, and respond if we can. Notice that for the “Content-Type”,
    we use “mime.lookup(req.url)”. This method finds the appropriate content type
    for the file we are requesting. This is simply to avoid confusing the browser,
    or whatever else is requesting from the server. Now, this is nowhere close to
    the most complex handler you could make. You could have it load and run php files
    potentially, and you could make the error handling more robust, but as a simple
    Apache server, this will do just fine.


    The next thing we will learn is SocketIO. As stated above, sockets allow for real-time
    data to be transmitted between the clients and the server. SocketIO is rather
    easy to use, and we will not go into some of the complexities, but you could do
    quite fancy stuff with what you will learn. So let’s learn it! The first step
    is to load the module in your server.


    var socketIOModule = require(‘socket.io’);


    The next step is to create a socketIO object. Simply use socketIOModule as a function
    and use the server from our previous example as the first parameter.


    var socketIO = socketIOModule(server);


    Finally, we will create a handler for the SocketIO ‘connection’ event. This means
    that whenever a user connects through SocketIO, this handler will fire.


    socketIO.on(‘connection’, socketConnect)


    function socketConnect(socket)


    {


    }


    The socketIO object means that globally, all of SocketIO will call the socketConnect
    callback, whenever a connection event is raised. Our callback, has the parameter
    of socket, which can be set to respond to events in the same way the socketIO
    object is set to respond to events—using the “on” method. The first parameter
    in this method is the event name. You can make custom event names, you just type
    in the event name in this first parameter, and whenever the server gets this event
    (from this socket), it will call the second parameter—the callback. The callback’s
    parameters are dependent on the type of event, but all custom events will only
    have a “data” parameter, which is any object. Socket.emit is the other side of
    the exchange. This actually sends an event to the client or server on the other
    side of the socket. The first parameter is the event to send in the form of a
    string. The second parameter is the object to send.


    socketIO.on(‘connection’, socketConnect)


    function socketConnect(socket)


    {


                  socket.emit(‘greetClient’, {});


                  socket.on(‘greetServer’, function(data){


                                if(data.playerName == “Spykill”)


                                {


                                              socket.emit(‘changeRank’, {rank: ‘admin’});


    }


    });


    }


    In this system, when a user connects, the server automatically sends a “greetClient”
    event. On the client-side, we would handle this event, and probably send a “greetServer”
    event, where we might send some data like the playerName. We check the playerName,
    and if it is someone important, we send a “changeRank” event to the client, with
    some data telling which rank the player should be. Now let’s look at some client-side
    code.


    <!DOCTYPE html>


    <html>


    <head>


                  <title></title>


                  <script src="https://cdn.socket.io/socket.io-1.2.0.js"></script>


                  <script type="text/javascript">


                  var socket = io();


                  socket.on(''greetClient'', function(data)


                  {


                                socket.emit(''greetServer'', {playerName: “Spykill”});


                  });


                  socket.on(‘changeRank’, function(data)


    {


                  if(data.rank == ‘admin’)


    {


                  document.write(“You are an admin!”);


    }


    });


                  </script>


    </head>


    <body>


    </body>


    </html>


    The first thing we need to do that is unique, is to load the socket.io.js file
    from the socket.io website. You could also make it load socket.io from your server,
    but it doesn’t matter much. Next, we write a script. We connect to our SocketIO
    server by calling io(). We then tell this connection to run a callback method,
    whenever it gets the ‘greetClient’ event. In this callback, we simply emit—meaning
    send—a return event called ‘greetServer’ with the playerName set to “Spykill”,
    which if you recall will be responded by the server to emit a ‘changeRank’ event.
    We also tell our socket to call another callback when we receive the ‘changeRank’
    event, that will simply write out whether we are an admin or not. This is a very
    simple client server relationship. In reality, you would want to do things like
    check if the user has valid login credentials, and you would send users more data.


    NodeJS allows a ton of customization. It has a large collection of modules which
    you can find and implement into your project. This makes it easy to develop custom
    applications and servers for your project, whatever it may be.


    # Chapter 12


    # Canvas


    The canvas is a new element in HTML5. It allows programmers to draw to the screen
    using JavaScript, and can handle both 2d and 3d applications. We will avoid the
    3d side, as this goes into WebGL territory, and that is very difficult to accomplish
    and understand, and there is a lot of code involved. So, let’s talk about the
    canvas in 2d. The first step in using a canvas is creating the element. In the
    body of your html file, wherever you wish the canvas to appear, simply use the
    <canvas> tag.


    <body>


                  <canvas></canvas>


    </body>


    Next we need to give our canvas some dimensions. In the first canvas tag, add
    the ‘width’ and ‘height’ attribute, and set them to the desired value. You should
    also set the ‘id’ attribute to an identifier to use to find this element.


    <canvas id=’ourCanvas’ width=’800’ height=’600’></canvas>'
