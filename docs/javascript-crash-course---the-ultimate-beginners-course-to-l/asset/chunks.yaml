  trans: "\n\n在这个示例中，我们检查 `a` 的值是否不等于 20，并检查 `a` 是否大于 `b`。由于 `a` 既不等于 20 又大于 `b`，我们可以向控制台输出“a\
    \ 不等于 20, 且 a 大于 b”。\n\n### 示例 2\n\n```javascript\nvar a = 21;\nvar b = 20;\n\
    if ( !(a == 20 && a > b) ) {\n    alert(\"a is not equal to 20, and a is greater\
    \ than b \");\n}\nelse {\n    alert(\"a is equal to 20, and a is not greater than\
    \ b \");\n}\n```\n\n在这个示例中，我改变了非逻辑运算符括号的位置，将其扩展到两个操作数。现在，要使该语句为真，`a` 必须不不等于 20，且\
    \ `a` 必须不不大于 `b`。在这种情况下，该语句将返回 false，因为 `a` 大于 `b`。根据操作数的要求，它必须小于 `b` 语句才会返回 true。因此，此程序将向控制台返回“a\
    \ is equal to 20, and a is not greater than b”。\n\n## 组合运算符\n\n在 Javascript 中，你可以在每个语句中使用任意数量的运算符。\n\
    \n### 示例\n\n```javascript\nvar a = 21;\nvar b = 20;\nif ( (a == 20 && a > b) ||\
    \ (a != 20 && a < b)) {\n    alert(\"correct\");\n}\nelse {\n    alert(\"wrong\"\
    );\n}\n```\n\n通过这个示例，我们可以看到如何实现更复杂的语句。在这里，我们应用了一个带有两个操作数的 OR（或）运算符，然而每个操作数也都包含了一个\
    \ AND（与）运算符。因此，要使该语句返回 true，`a` 必须等于 20 且大于 `b`，或者 `a` 不等于 20 且 `a` 必须小于 `b`。注意我们使用括号是为了使代码更易理解，并防止代码误读我们的逻辑。\n\
    \n### 示例 2\n\n```javascript\nvar a = 21;\nvar b = 20;\nif ( a == 20 && (a > b\
    \ || a != 20) && a < b) {\n    alert(\"correct\");\n}\nelse {\n    alert(\"wrong\"\
    );\n}\n```\n\n在上面的示例中，我们仅通过切换一个括号的位置就显著改变了程序的逻辑。注意现在括号包围了两个内部操作数，而不是用两对括号包围每对外部操作数。要使该语句现在返回\
    \ true，必须有 3 个不同的条件返回真。变量 `a` 必须等于 20，并且，要么 `a` 必须大于 `b` 或者它不等于 20；并且 `a` 必须小于\
    \ `b`。根据这个新逻辑，第一个操作数必须为真，此外，第二个或第三个条件之一必须返回真。而且，`a` 必须小于 `b`。该语句将返回 false。它会失败第一个条件，因为\
    \ `a` 不等于 20。它会通过第二个条件，因为它大于 `b`，但它会失败最后一个条件，因为 `a` 不小于 `b`。由于这需要三个正确的条件，而现在只有一个，所以语句返回\
    \ false 并打印“wrong”。\n\n### 赋值题\n\n我们现在将完成另一个赋值题，以确保我们理解了运算符的所有内容。我们有 3 个朋友想知道他们的钱与其他人相比如何。我们将编写一个程序，输出谁比谁富。我们将三个名为\
    \ `bob`、`john` 和 `tom` 的整数。我们将给他们每个人分配一个不同的值，程序必须输出谁更富。它还必须告诉我们是否有人的钱数一样。\n\n\
    例如：\n如果 `bob = 20`, `tom = 10`, 且 `john = 5`，输出必须是：“bob is richer than tom, who\
    \ is richer than john”\n但如果 `bob = 20`, `tom = 20`, 和 `john = 5`，输出必须是：“bob is\
    \ as rich as tom, both are richer than john”\n\n程序需要适用于每种结果。我强烈建议你自己尝试这个程序，并在查看答案之前尽可能地努力思考。编程的很大一部分是解决问题和理解代码，所以我建议你先自己想出来。\n\
    \n### 答案与解释\n\n注意程序将通过代码进行解释。\n\n```javascript\n// 可以随意更改这些值\nvar tom = 0; //\
    \ tom 拥有的钱数\nvar bob = 20; // bob 拥有的钱数\nvar john = 10; // john 拥有的钱数\n\n// 我们首先检查每个人的钱数是否一样\n\
    // 我为什么没有检查 tom 是否等于 john，因为如果\n// tom 等于 bob 且 bob 等于 john，那么显然\n// tom 等于 john\n\
    if (tom == bob && bob == john) {\n    alert(\"Everyone has the same amount of\
    \ money\");\n}\n\n// 如果第一个语句返回 false\n// 我接下来检查 tom 和 bob 钱数相同但 john 不相等的特殊情况\n\
    else if (tom == bob && bob != john) {\n    // 我现在检查 bob 是大于还是小于 john\n    // 然后输出正确的答案\n\
    \    if (bob > john) {\n        alert(\"tom is as rich as bob, both are richer\
    \ than john\");\n    }\n    else if (bob < john) {\n        alert(\"tom is as\
    \ rich as bob, both are more poor than john\");\n    }\n}\n\n// 针对不同的人重复上语句的过程\n\
    else if (tom == john && john != bob) {\n    if (john > bob) {\n        alert(\"\
    tom is as rich as john, both are richer than bob\");\n    }\n    else if (john\
    \ < bob) {\n        alert(\"tom is as rich as john, both are more poor than bob\"\
    );\n    }\n}\n\n// 最后一种可能的名字组合，\n// 与上语句相同的检查\nelse if (john == bob && bob !=\
    \ tom) {\n    if (bob > tom) {\n        alert(\"bob is as rich as john, both are\
    \ richer than tom\");\n    }\n    else if (bob < tom) {\n        alert(\"bob is\
    \ as rich as john, both are more poor than tom\");\n    }\n}\n\n// 现在我们检查每个人钱数都不同的最后可能的组合\n\
    // 接下来的 6 个语句涵盖了所有可能的结果\nelse if (tom > bob && bob > john) {\n    alert(\"tom\
    \ is richest, followed by bob, followed by john\");\n}\nelse if (tom > john &&\
    \ john > bob) {\n    alert(\"tom is richest, followed by john, followed by bob\"\
    );\n}\nelse if (bob > tom && tom > john) {\n    alert(\"bob is richest, followed\
    \ by tom, followed by john\");\n}\nelse if (bob > john && john > tom) {\n    alert(\"\
    bob is richest, followed by john, followed by tom\");\n}\n```\n\n"
