    # Chapter 1


    # Java Programing Language


    ## History of Java


    Java is a programming language that was first publicly available in 1995, created
    by James Gosling from Sun Microsystems (Sun) in 1991\. Sun Microsystems was then
    inherited by Oracle, and is the corporation in charge of the programming language’s
    faith. Java then became open source available under the GNU General Public License
    (GPL).


    The language gets much of its syntax from C and C++ but isn’t as powerful because
    it requires less for the user to do (less customization but more simple). Something
    like garbage collection, the process of reducing memory being used from the program,
    is automated in Java.


    It was originally designed for interactive television but surpassed the technology
    and design of the digital cable television industry at the time. There were five
    principles that were used in the creation of the Java programming language:


    1.  It must be "simple, object-oriented and familiar"


    2.  It must be "robust and secure"


    3.  It must be "architecture-neutral and portable"


    4.  It must execute with "high performance"


    5.  It must be "interpreted, threaded, and dynamic"


    Another important design goal to note is portability, which is was a key factor
    in Java’s sudden popularity. The portability in this context means that the code
    written in the Java platform can be executed in any combination of hardware and
    operating system.


    Unfortunately, Java has a reputation for being a slower programming language (requiring
    more memory) than other languages like C++ but as time went, Java 1.1 was introduced
    and program execution times were significantly improved.


    Java was built exclusively as an object-oriented programming language, which doesn’t
    mean much right now, but it will later in the guide. Object-Oriented programming
    allows for efficient, organized and powerful code to be created and will be seen
    throughout this guide.


    ## What is Java?


    Java is a programming language that has multi-platform capability, meaning that
    you can program Java for any type of device, whether it is an Android phone, a
    Windows computer or an Apple product. Due to the flexibility of Java, it has made
    it one of the most popular programming languages used through the globe by many
    programmers. Java can be used to create web applications, games, windows applications,
    database systems, Android apps and much more.


    Java is different from other programming languages because of its simplicity and
    powerful nature. That combination makes the Java programming language great to
    use. Java is a simple programming language because it doesn’t expect too much
    from the user in terms of memory management or dealing with a vast and complex
    hive of intricate classes extending from each other. Although this doesn’t make
    much sense right now, it will make sense when reaching the point of learning inheritance
    in Java.'
