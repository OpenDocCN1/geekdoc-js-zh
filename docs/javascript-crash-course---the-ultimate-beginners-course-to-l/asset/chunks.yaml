    绘制完星图后，我们开始一条路径，并从地图的左侧开始，这意味着偏移值向左移动到画布高度的一半，因为我们从 0 开始。然后，我们遍历 `heights` 数组，在每次迭代中，我们向每个
    `height` 值绘制一条线，其中 `x` 值是我们正在查看的 `heights` 数组所占的百分比乘以画布宽度，这意味着 `heights` 将沿画布宽度均匀分布。高度是画布的一半乘以
    `height`，所以如果 `height` 为 -1，它将处于最低高度；如果 `height` 为 1，它将处于最高高度。我们对 `nextHeights`
    执行相同的操作，只是像位移 `nextStarMap` 那样对它进行位移。最后，我们通过绘制连接到画布右下角和左下角的线来完成地形绘制。然后我们用黑色填充它。这形成了一个非常漂亮、无限滚动且随机生成的地形。


    # 第 18 章：结语


    这是你作为 Javascript 程序员旅程的起点。通过本指南，你仅仅触及皮毛，因为学习一门语言的语法和约定只是开始。编程中最重要的部分是它的逻辑方面。当然，你可能知道如何遍历一个变量数组（如购物列表），但如果有人要求你利用你的编程知识来处理图像，并在
    API 的帮助和一些思考下，你就能弄清楚如何反转图像颜色、翻转、旋转、缩放等。


    真正的编程来自于大脑的逻辑部分。这与你学习任何其他语言相似，例如学习英语。你可能理解语法规则和约定（如在句末加句号），但能够写出清晰、逻辑、深思熟虑且结构化的文章才是真技能所在。这一概念同样适用于编程，编写代码的人必须知道如何应用他对所用语言（如
    `Javascript`）规则的知识，并利用它为自己的优势，编写出整洁的程序。


    编程的知识和理解真的是伟大的，因为它是最接近拥有一种的力量。你可以字面上地从一个空白记事本从零开始某些东西，并让它运行你想要实现的功能。无论是创建一个分析股票市场并做出预测的机器人，还是创建一个游戏。选择权在于你。


    在本指南中，你学习了 `Javascript` 的基础知识。你还没有学习该语言可以使用的所有方法，但那并不是重点。本指南的重点是带你开启一段旅程去发现你所需的对象和方法，以帮助你创建你想要的程序。你已经获得了理解阅读
    API 的最佳知识，并能够理解它所表达的内容并添加到你的代码中。


    祝你，新出生的 Javascript 程序员好运！


    Eprogramy


    附：还有一件事。在 Eprogramy，我们想送你一份礼物。如果你像我们一样喜欢 `JavaScript`，那么你可能也会喜欢 Java。因此，在接下来的章节中，你将看到我们的“JAVA
    速成班——在 12 小时内学习 Java 编程的终极学者课程”的预览。


    我知道你会喜欢的！


