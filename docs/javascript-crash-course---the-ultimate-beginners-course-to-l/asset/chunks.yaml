    Filename: pageStyle.css


    #content {


                  color: red;


                  font-size: 14px;


    }


    Now, since we’ve already seen how internal CSS and external CSS referencing works,
    we can look at the cheapest way to do CSS: Inline. This way is not recommended
    just because it isn’t neat or organized to look at. Although it is useful when
    testing a few things with a specific tag. In order to do inline, for any tag you
    want to style, you must add the attribute “style” with an equal sign and then
    quotation marks for all the properties. Then for each property, you must have
    the value separated by a colon and when you are done writing down all your properties,
