- fmt: "\nIn this example, if you were to print out `x`, the value would be 10 because\
    \ you are adding the value of 5 on to the value of `x`. This statement is the\
    \ same thing as saying `x = x + 5` → `x += 5`.\n\n### Subtract-Equal Sign: `-=`\n\
    \n```javascript\nvar x = 5;\nx -= 5;\n```\n\nIn this example, if you were to print\
    \ out `x`, the value would be 0 because you are subtracting the value of 5 from\
    \ the value of `x`. This statement is the same thing as saying `x = x - 5` → `x\
    \ -= 5`.\n\n### Multiplication-Equal Sign: `*=`\n\n```javascript\nvar x = 5;\n\
    x *= 5;\n```\n\nIn this example, if you were to print out `x`, the value would\
    \ be 25 because you are multiplying the value of 5 on to the value of `x`. This\
    \ statement is the same thing as saying `x = x * 5` → `x *= 5`.\n\n### Division-Equal\
    \ Sign: `/=`\n\n```javascript\nvar x = 5;\nx /= 5;\n```\n\nIn this example, if\
    \ you were to print out `x`, the value would be 1 because you are dividing the\
    \ value of 5 on to the value of `x`. This statement is the same thing as saying\
    \ `x = x / 5` → `x /= 5`.\n\n### Modules-Equal Sign: `%=`\n\n```javascript\nvar\
    \ x = 5;\nx %= 5;\n```\n\nIn this example, if you were to print out `x`, the value\
    \ would be 0 because you are finding the remainder in `(5/5)`. This statement\
    \ is the same thing as saying `x = x % 5` → `x %= 5`.\n\nAnother important thing\
    \ to understand when working with numbers in Javascript is that it matters how\
    \ you declare your number. If you declare it with a decimal value, when you divide\
    \ it, it will output as a decimal number if it doesn’t divide by two evenly, while\
    \ if you declare it with an integer value (whole number) it will divide by two\
    \ and round down if it divides unevenly.\n\nFor example:\n\n```javascript\nvar\
    \ numberWithDecimal = 5.5;\nvar wholeNumber = 5;\n```\n\nNow that we have went\
    \ over all the operators that we can use to work with variables, let’s go over\
    \ some special cases with variables. First of all, if you would like to join two\
    \ strings together, the way to do that is to concatenate them together (join them\
    \ together) and to do that is to simply use the `+` operator.\n\nFor example:\n\
    \n```javascript\nvar x = \"Hello\";\nvar y = \"World\";\nvar line = x + y;\n```\n\
    \nThe value of `line` in the case would be `\"Hello World\"` without the quotation\
    \ marks.\n\nThe next special case is when trying to add a string and a number\
    \ together. So for example:\n\n```javascript\nvar line = 15 + \"test\";\n```\n\
    \nThe variable of `line` will now hold the value of `\"15test\"` without quotation\
    \ marks, as it won’t understand why you’re trying to add a number to a string,\
    \ so it will automatically treat it as the following in the backend:\n\n```javascript\n\
    var line = \"15\" + \"test\";\n```\n\nNow another thing to consider is that Javascript\
    \ evaluates an expression from left to right meaning that the order of your variables\
    \ matter. If you were to do the following:\n\n```javascript\nvar line = 15 + 10\
    \ + \"test\";\n```\n\nThis line would produce: `\"25test\"` without quotation\
    \ marks as it would evaluate the expression from left to right. One thing to consider\
    \ is that since the two variables in this example are numbers, it will add them,\
    \ but since the third variable is a string, it will treat the number that was\
    \ evaluated as a string. Remember, that the rules of operation will follow accordingly\
    \ with `BEDMAS` or `PEMDAS` so you are able to use brackets.\n\nThe next special\
    \ case is if you were to do the following:\n\n```javascript\nvar line = \"test\"\
    \ + 15 + 10;\n```\n\nIn this certain example, the output would be `\"test1510\"\
    ` without the quotation marks, because it would evaluate the `line` as a string\
    \ type as soon as it sees the first variable being of string data type and then\
    \ it would evaluate everything after it as string accordingly.\n\nRemember that\
    \ in Javascript, you can update variables dynamically, so for example:\n\n```javascript\n\
    var x; // undefined\nvar x = 10; // x is a number\nvar x = \"This is text\"; //\
    \ x is now a string\n```\n\nThroughout this guide, you’ve been seeing me use double\
    \ quotation marks for strings - it actually doesn’t matter - you’re able to use\
    \ single quotes to declare string variables as well. The catch with single quotes\
    \ and double quotes usage is that if you’re using double quotation marks outside\
    \ your string variable, and want to use it inside, Javascript will get confused,\
    \ so in order to make it unconfused, you are to place an escape character: `\\\
    \"` right before the double quotation mark that is confusing the Javascript string\
    \ variable which will simply bypass that double quotation mark and ignore the\
    \ `\\` when outputting the string. Another way is to simply surround your string\
    \ variable with single quotes and be able to use double quotation marks within\
    \ your string variable without confusing Javascript - or vice versa.\n\nExamples:\n\
    \n```javascript\nvar text = \"It’s great to learn!\" ;\n```\n\n## Boolean Logic\n\
    A boolean is a variable that holds either true or false.\n\n## If Statements\n\
    An `if` statement allows you to execute a block of code only if a condition is\
    \ true. If the condition is false, the code inside the block will not run.\n\n\
    ### Else If\nThe `else if` statement allows you to check another condition if\
    \ the first `if` condition was false. You can have as many `else if` statements\
    \ as you like.\n\n### Else\nThe `else` statement executes if all the preceding\
    \ `if` and `else if` conditions are false. You can only have one `else` statement\
    \ per `if` block.\n\n```javascript\nvar a = 10;\nvar b = 20;\n\nif (a == b) {\n\
    \    alert(\"a is equal to b\");\n} else if (a > b) {\n    alert(\"a is greater\
    \ than b\");\n} else {\n    alert(\"a is not equal or greater than b\");\n}\n\
    ```\n\nThe operands used in this example (`==` and `>`) are explained below:\n\
    - `==`: Checks if two values are equal.\n- `>`: Checks if the left value is greater\
    \ than the right value.\n\n## Nested If Statements\nIt is also important to know\
    \ that it is possible to have an `if` statement inside another `if` statement.\
    \ This is called a NESTED `if` statement.\n\n```javascript\nvar a = 20;\nvar b\
    \ = 30;\n\nif (a == 20) {\n    if (a < b) {\n        alert(\"a is less than b\
    \ and it is equal to 20\");\n    }\n}\n```\n\nIn this example, we first check\
    \ to see if `a` is equal to `b`. If it is, we then check to see if `a` is less\
    \ than `b`. If this statement also returns true, we can print to the console `\"\
    a is less than b and it is equal to 20\"`.\n"
