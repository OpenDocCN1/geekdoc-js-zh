    used to compare the value of variables. They are the following:


    ==                   This operator checks to see if the value of two integers
    are equal to each other. If they are the equal, the operator returns true. If
    they are not, it returns false.


    Example:


    var a = 10;


    var b = 10;


    if (a == b) {             


    alert("they are the same");


    }


    This code checks to see IF the value of “a” is equal to the value of “b”. Since
    the value of “a” is equal to the value of “b”, the value within the brackets will
    be true. This ends up causing the above code to print out the statement “they
    are the same”.


    !=                    This operator checks to see if the value of two things DO
    NOT equal the same thing. If two things DO NOT equal the same thing, then it will
    return true. If they DO equal the same thing, it will return false.


                         Example:


    var a = 10;


    var b = 20;


    if (a != b) {             


    alert("they are not the same");


    }


    This code will check if “a” does not equal “b”. Since “a” does not equal to “b”,
    the program will print “they are not the same” in the console.


    >                              This operator Checks to see if something is Greater
    than something else. If the value of the variable in front of it is greater than
    the value of the variable after it, it will return true. If the value of the variable
    in front of it is less than the value of the variable after it, it will return
    false.


                         Example:


