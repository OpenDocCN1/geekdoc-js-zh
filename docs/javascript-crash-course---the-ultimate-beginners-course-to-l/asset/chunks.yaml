    # Chapter 9


    # DOM Elements


    DOM elements are what get shown on your HTML document. DOM stands for Document
    Object Model. DOM elements contain a type, which are defined by the tags that
    create it; attributes, which make the element more unique; and innerHTML, which
    defines what text or elements are contained in it. Let’s see an example element.
    This would go inside your HTML file.


    <div id=’x’ style=’border: black 1px solid’>


