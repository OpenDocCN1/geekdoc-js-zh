  md: '# Sort statement


    The sort statement sorts the content of a document-type variable or fragment based
    on key expressions and places the result in another variable.


    Code sample that sorts tickets by on created date and customer:


    ```

    <sort inputvariable="TroubleTickets"

    sortxkey="xs:date(created)

    descending, customer ascending"

    outputvariable="TroubleTickets"/>

    ```


    # Groupby statement


    groupby provides the ability to group and aggregate data sets. Standard XPath
    aggregation operations can be used when there is an extension mechanism for adding
    user-defined functions. Grouping of hierarchical data sets is also supported.
    There is a Having clause to filter groups.


    Code sample that groups books by genre and counts total copies for each group:


    ```

    <group by="Scatalog/book/genre"

    outputvariable="$GroupResult"

    <res:name="$Group_key">

    copiesold="sum(copiesold)"/>

    ```


    # Merge statement


    merge provides ability to combine various data sources including RSS/ATOM formats.
    The merge feature is SQL UNION functionality but merges hierarchical document
    structures.


    Code sample that merges Yahoo! News, Financial News, and returns feeds:


    ```

    <merge inputvariable="$YahooRSS,$FinancialNews,$ReutersRSS"

    outputvariable="$NewsAggregate"/>

    ```


