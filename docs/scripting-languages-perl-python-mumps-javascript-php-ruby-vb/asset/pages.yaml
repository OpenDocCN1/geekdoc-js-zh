  md: '# MUMPS


    MUMPS (Massachusetts General Hospital Multi-Processing System), was shortly adapted
    to a DEC programming language created in the late 1960s, originally in healthcare.
    It was designed for the production of multi-user data-driven applications. It
    is currently of other popular languages in current usage, and has different syntax
    and terminology.


    It was largely adopted during the 1970s and 1980s in healthcare and financial
    information systems/databases, and continues to be used by many of the same clients
    today. It is used in electronic health record systems as well as many banking
    systems and online trading/investment services.


    MUMPS was shortly adapted to a PDP-15, where it lived for some time. MUMPS was
    developed with the support of a government research grant, and was also released
    to the public (no longer a requirement) and for a number of other systems including
    the popular PDP-8, the Data General Nova and DEC PDP-11 and the ANSI PC2012 computer.


    After MUMPS spread, it was widely adopted by the medical community, and by the
    early 1970s it was widely used, being modified for their own needs.


    By the early 1970s, there were many versions and implementations of MUMPS on hardware
    platforms. The most widespread MUMPS was on the PDP-11, and MitschS. In 1972,
    MUMPS users attended a conference which standardized the function-language, and
    created the ANSI MUMPS Development Committee.


    # History


    MUMPS was developed by Neil Paulbarargo and colleagues. By Dr. Charles Barnett''s
    animal lab at Massachusetts General Hospital (MGH) it was built in 1966 and 1967.
    The original MUMPS system was like Unix, a few years later, but built on a bare
    DEC-7.


    Otto Barnett and Neil Pappargo were also involved in MGH''s information system,
    obtained a backward compatible PDP-9, and by 1989 used MUMPS in admissions and
