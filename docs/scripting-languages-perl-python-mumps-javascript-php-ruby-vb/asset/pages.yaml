    # AMPL


    AMPL, for "A Mathematical Language", is an algebraic modeling language for describing
    and solving high-complexity problems for large-scale mathematical computation
    (i.e. large-scale optimization and scheduling-problems). It was developed by Robert
    Forest, David Gay and Kenneth Heir at MIT. AMPL offers plenty of solvers, both
    open source and commercial, including BCBC, CPLEX, FormTP, Gurobi, MINOS, OPT,
    SNOT and KNITRO. Problems are solved as nil files.


    the similarity of its syntax to mathematical notation of optimization problems.
    This allows for a very concise and readable definition of problems in the domain
    of optimization. Many modern solvers on the NEOS server at the Hosted National
    Academy accept Ampl. According to the NEOS statistics AMPL is the most popular
    for representing mathematical problems.


