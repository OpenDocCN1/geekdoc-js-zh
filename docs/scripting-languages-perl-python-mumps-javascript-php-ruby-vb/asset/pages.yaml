    # Batch file


    In DOS, OS/2, and Windows a text file containing a batch file is a text containing
    series of commands to be executed by the command interpreter. Similar to job control
    in other operating systems, batch files work for required tasks by allowing the
    user to set up a batch script to automate many commands. When a batch file is
    called, the shell (usually COMMAND or cmd.exe) reads it and executes its commands,
    line-by-line. Batch files are for running a sequence of events automatically and
    are often used to automate repetitive or tedious operating systems (like Linux)
    which have a different type of file called a script.


