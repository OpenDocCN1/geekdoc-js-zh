    ```


    Displays the first and third fields of the record, separated by a comma (the $
    symbol indicates variables in particular), may refer to the fields of the record.
    A special case, $0, refers to the entire record. In fact, the command "print"
    and print $0 are identical in functionality.


    The print command can also display the results of calculations and/ function calls:


    ```

