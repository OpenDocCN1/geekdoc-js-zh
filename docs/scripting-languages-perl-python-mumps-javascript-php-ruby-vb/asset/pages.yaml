    # Internals


    Lua programs are not interpreted directly from the Lua file, but are compiled
    into bytecode which is then run on the Lua virtual machine. The compilation process
    is totally transparent to the user and can be performed in order to increase performance,
    and reduce the memory footprint of the environment by using compiled code.


    Like C++, and unlike virtual machines (which are stack-based), the Lua VM is register-based,
    and more resembles an actual hardware design. The register architecture avoids
    costly copying of values and reduces the total number of instructions per function.
    The virtual machine of Lua 5 is the first register-based VM that has a wide use.
    Perl and Android are two other known register-based VMs.


    # Stack


    The Lua API is stack-based. It provides functions to push and pop data types (integers,
    strings, etc.) and from the stack, as well as for manipulating tables. The Lua
    stack is somewhat different from traditional implementation; the stack can be
    indexed directly. Negative indices indicate offsets from the top of the stack
    (e.g., -1 is the last element), while positive indices indicate offsets from the
    bottom.


