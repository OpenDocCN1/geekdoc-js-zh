    # Result documents


    A template processor (also known as a template engine, template parser or language)
    is a software component that is designed to combine one or more templates to produce
    data or more result documents. For purposes of this article, a result is any kind
    of formatted output, including documents, web pages, source code, or either whole
    or fragments.


    These consist of an entire document or a document fragment.


    # Uses


    Template processing is used in various contexts for different purposes. The specific
    purpose is arguably contingent upon the application or template engine in use.
    However the flexibility of template systems often enables unconventional use for
    purposes not intended by the original designers.


    # System elements


    +   All template systems consist of at least these primary elements:

    * an associated data;

    * one or more source templates;

    * a processor or template engine;

    * generated output in the form of result documents.


