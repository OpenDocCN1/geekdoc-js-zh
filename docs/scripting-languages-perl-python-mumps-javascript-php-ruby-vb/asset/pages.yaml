    # Z shell


    The Z shell (zsh) is a Unix shell that can be used as an interactive and login
    shell and a powerful command interface for scripting. Zsh was thought of as an
    Bourne shell with a large number of objects, including features of bash, ksh,
    and zoot.


    The first version of zsh was created by Paul Falstad in 1990 when he was a student
    at Princeton University.


    # Origin


    The name zsh derives from Yale-prof


    # Etymology


    or Z Zhang, a teaching assistant at Princeton University. Paul Falstad showed
    that Zhang''s name "zsh", was a good name for a shell.


    # Features


    Features of note include:


    +   -Programmable command line completion can help the user both options and arguments
    for used commands, with out-of-the-box support for several commands


    +   -Sharing of command history among all shells


    +   -Extended file globbing features needing to run an external program such as


    +   -Improved variable/array handling of multi-line commands in a single buffer


    +   -Spelling correction


    +   -Various completion modes, e.g. zsh can be a Bourne shell when run


    +   -Printable prompts, the ability to put prompt information on the right side
    of the screen and auto-hide when typing a long command'
