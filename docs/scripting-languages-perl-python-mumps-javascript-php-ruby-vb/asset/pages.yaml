  md: '# Autolt


    Autolt (pronounced aw-towit) is a freep automation language for Microsoft Windows.
    In its earliest release, the software was primitive to create automation scripts
    (sometimes called macros) for Microsoft Windows programs but has grown to include
    enhancements in both programming language and overall functionality.


    With the release of Version 3, the syntax of Autolt has been restructured to be
    more like the BASIC family of languages. It is a third-generation programming
    language using a classical data model, that can store several types of data, including
    arrays. It is compatible with Windows 95, 98, me, NT4, 2000, XP, 2003 and Vista
    (however, support for operating systems older than Windows 2000 was discontinued
    with the release of v3.3.0).


    An Autolt script can be compiled into a standalone executable which can run on
    computers that do not have the Autolt interpreter installed. A wide range of function
    libraries (known as UDFs) are also included as standard or are available from
    the website to add specialized functionality. Autolt is also distributed with
    an IDE based on the free SciTE editor. The compiler and help text are fully integrated
    and provide a de facto standard environment for developers using Autolt.


