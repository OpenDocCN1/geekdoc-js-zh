    # ActionScript


    ActionScript is an object-oriented language developed by Macromedia Inc. (now
    owned by Adobe Systems). It is a derivative of ECMScript (meaning it has the same
    syntax and semantics of the more widely known JavaScript) and used for the development
    of websites and targeting the Adobe Flash platform. The language is open source
    so that its specification is free of charge and both open source virtual machine
    (Mozilla Timeline) are available.

    ActionScript initially designed for controlling simple 2D vector animations made
    in Flash (formerly Macromedia Flash). Initially focused on animation, versions
    of Flash offered few interactive features and had very limited scripting ability.
    Later versions allowing for the creation of Web-based games and internet interactivity
    with media (such as video and audio). Today, ActionScript is suitable for use
    in desktop applications, in robotics, such as the Movie Kit Controller.

    Flash MX 2004 introduced ActionScript 2.0, a programming language suited to the
    development of applications. It is now possible to save time by scripting something
    rather than animating it, which usually enables a higher level of flexibility
    when editing.


    Since the arrival of the Flash 9 alpha (a newer version of ActionScript has been
    released, ActionScript 3.0 is an object-oriented language allowing more free control
    and readability when building complex applications. This version is intended to
    run on a version of the ActionScript Virtual Machine that has been completely
    re-written from scratch (up doubled AV). Because of this, code written in ActionScript
    3.0 is greatly faster for Flash 9 and higher will not work in previous versions.
    At the same time, ActionScript 3.0 executes up to 10 times faster than Flash.

    Flash can be used with the XML properties of the browser to render rich content
    in the. This technology is known as Asynchronous Flash and XML, like AJAX. Adobe
    offers its Flash product to meet the demand for Rich Internet Applications built
    on Flash, with behaviors and programming in ActionScript. ActionScript 3.0 forms
    the foundation of the Flash 2 API.


    # History


    ActionScript started as a Object-oriented language for Macromedia''s flourishing
    tool, now developed by Adobe Systems as Flash. The first three versions of the
    Flash authoring tool limited interactivity features. Early Flash developers could
    attach a simple command, an "action," to


    button or a frame. The set of actions were basic navigation controls, commands
    such as "play," "stop", "getURL," and "gotoAndPlay".

    With the release of Flash 4 in 1999, this set of actions became a small scripting
    language. New capabilities introduced for Flash 4 included variables, expressions,
    operations, and loops. Although referred to as "ActionScript," the Flash 4 user
    manual and marketing documents continued to use this set of commands.


    # Timeline by version release


    +   - Flash 2: The first version with scripting implementation including gotoPlay,
    gotoStop, nextFrame and nextScene for timeline control.

    - Flash 3: Expanded scripting support with the ability to load external SWFs (loadMovie).

    - Flash 4: First version with full scripting implementation (ActionsScript). The
    language was Flash based syntax and continued support for layers, variables and
    other basic language constructs.

    - Flash 5: Included the first version of ActionScript. Prototype-based programming
    based on ECMScript, and allowed full procedural and object-oriented programming.

    - Flash 6: Added an event handling model, accessibility controls and support for
    web.'
