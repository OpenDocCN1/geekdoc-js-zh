  md: '# Babel Middleware


    Babel is an open source system serving the scientific computing community. As
    language interoperability tool, Babel enables easy mixing of software libraries
    in C/C++, Python, Java, and as distributed computing. Babel provides a language-neutral
    Remote Method Invocation (RMI) scheme similar to Java RMI that allows third-party-plugin
    integration and network protocols.


    and Unix variants, including Linux, Mac OS X, AIX, IRIX, Solaris, Tru64, Cray
    XTA, IBM''s Blue Gene, and many commodity clusters. Babel does not require special
    compiler or linker technology to work with GNU, IBM, PathScale, PGL, and many
    other compilers. Babel is distributed under a GPL license.


    project on software components at Livermore National Laboratory in 1999. The first
    public (alpha) release of Babel was in 2001 it secured funding from SciDAC (Scientific
    Discovery Through Computing) with its collaborators in the CCA (Common Component
    Architecture).


    # Community


    Babel development and maintenance is currently funded by United States Department
    of Energy, but heavily on an open source community. Contributors hail from San
    National Laboratories, Oak Ridge National Laboratory, Tech-X Corp, MIT, Utah,
