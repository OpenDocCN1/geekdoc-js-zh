    Notice the use of Javascript like syntax and the use of Google Web Toolkit widgets.


    +   - Based on Javascript like syntax. Easier to learn.


    +   - Under the hood, Google Apps Script uses the Google Web Toolkit (GWT) to
    create and display user interface elements. GWT is easy to learn, and completely
    abstracts the complexity of AJAX/HTML from the developer.


