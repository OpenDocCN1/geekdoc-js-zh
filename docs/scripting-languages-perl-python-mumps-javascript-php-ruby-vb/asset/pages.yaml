  md: "# Mirah (programming language) - page 133\n\n```\nmirah a = [1, 2, 3, 4, 5]\n\
    local t = { x = 5, y = 10 }\nlocal s = \"hello\"\n```\n\n```\nfunction(x:array)\
    \ = x(0)\nwriteln(first(1, 2, 3)) // prints\nwriteln(first(\"hello\")) // prints\
    \ h\nwriteln(first(45)) // error invalid\nparameter type 'int'\n```\n\n```\nforeach(i,\
    \ v)\nwriteln(\"a[%i] = {}\", i, v)\nfunction countDown(val: int)\n  coroutine()\n\
    \  while(val > 0)\n    yield(null, val) // this is like\nyielding an index and\
    \ a value\n  --\n```\n\n```\nwriteln()\nforeach(i, t)\nwriteln(\"t[%i] = {}\"\
    , i, v)\n```\n\nThis shows a simple use of parameter type constraints, a way of\
    \ putting runtime checks on parameters to restrict their allowed types. The 'first'\
    \ function allows only arrays and strings for its parameter 'x'. The first two\
    \ statements throw an error if integers are not allowed for 'x'.\n\n```\nwriteln()\n\
    foreach(i, s)\nwriteln(\"s[%i] = {}\", i, v)\n```\n\n```\nforeach(v:countDown(5))\n\
    writeln(v)\n```\n\nThis example shows the 'foreach' loop, which can be used to\
    \ iterate over arrays, tables, and strings as shown here,\n\nThis example uses\
    \ the 'foreach' loop to iterate over a coroutine. In Mirah, coroutines can be\
    \ used as generators.\n\nSource (edited): http://en.wikipedia.org/wiki/Mirah\n\
    \n# Mirah (programming language)\n\nMirah (formerly known as Dubai) is a programming\
    \ language based on Ruby syntax, interface hybrid static/dynamic type system,\
    \ and a pluggable compiler. Mirah was created by Charles Oliver Nutt to make a\
    \ 'Ruby-like' language, probably a subset of Ruby, which [could] be used for fast,\
    \ idiomatic bytecode.\n\nevolved into a fully-fledged JVM language, with several\
    \ users and real-world applications using it for core purposes.\n\nships no standard\
    \ library. The intent is that Mirah users will choose what libraries they want\
    \ to use, perhaps using plugins for the Mirah compiler to support, and develop\
    \ the rest. This is an explicit design, avoiding a requirement for a new external\
    \ library. The standard library for Mirah, here, is the standard library for the\
    \ current version and is placed on compiler plugins rather than libraries to extend\
    \ and enhance the language.\n\n# Design\n\nMirah is just a powerful compiler tool.\
    \ The primary elements of this toolchain are:\n\n+   - A parser based on Ruby's,\
    \ which produces a Ruby AST\n- A transformer that converts the Ruby AST into a\
    \ Mirah AST\n- A back code generator that creates the Mirah AST with appropriate\
    \ information for the target backend\n\nOf these phases, only the last two require\
    \ knowledge of the eventual target platform. This makes Mirah suitable for many\
    \ backends, and makes it possible to write language plugins that support all supported\
    \ backends.\n\nFor simple pieces of code and the JVM bytecode, the Mirah compiler\
    \ will produce the same instructions as javac compilers.\n\n# Type system\n\n\
    # History\n\nIn order to further participate in the Ruby project community members,\
    \ Nutt began to explore the possibility of presenting Ruby syntax, but with a\
    \ static type model and direct-native compilation. In this context, 'native' meant\
    \ the primary VM, which Mirah has been designed around the possibility of having\
    \ alternative-oriented objects for other languages like theCLR. The language needs\
    \ to look and feel like Ruby, but without introducing new dependencies into Ruby\
    \ (which would affect other gems) and without suffering a performance penalty\
    \ (which meant writing Ruby in Ruby itself).\n\nMirah does not impose a specific\
    \ type system on users, instead relying on the target backend. On the JVM, the\
    \ type system is Java's type system, and refers to JVM classes, primitives, and\
    \ interfaces.\nMirah is primarily statically-typed, but\n\nEarly versions of Mirah\
    \ (then Dubai) focused mostly on performance, where dynamic languages often had\
    \ a high performance cost. Since then it has\n\n# No runtime\n\nBecause Mirah\
    \ is a compiler, it is\n\nlanguage, but support is in development to allow dynamic\
    \ typing as well. The mechanism is similar to that provided in C# 4, with a 'dynamic'\
    \ type dictating that variable's value could be dynamic. Dynamic type support\
    \ is currently planned for Java 7 and higher, using the new invokedynamic bytecode."
