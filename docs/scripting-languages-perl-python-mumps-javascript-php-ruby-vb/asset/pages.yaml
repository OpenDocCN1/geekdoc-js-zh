  md: '# ARExx


    third-party software that we implement "ARExx port". Any Amiga application can
    define a set of commands and functions for ARExx to address, making the capabilities
    of the software available to be written in ARExx


    the TxdEditor, and was set in Using AmigaTex. This is a 100% Amiga product.


    library is also easy to add other libraries or individual functions. ARExx scripts
    can also be invoked from other ARExx scripts. Any Amiga program has an ARExx port
    in its chain to share functions with ARExx.


    # Characteristics


    ARExx is a language that can communicate with other applications. Using ARExx,
    for example one could request data from a database and send to a spreadsheet application.
    To support this, an application must be "ARExx compatible" being able to receive
    commands from ARExx and execute them. A base program might have commands to search,
    retrieve, and save - the MicroFile data as as a native ARExx command. A text editor
    might have commands corresponding to its editing commands and can be used with
    Jorth to provide an integrated multivision environment. The AmigaVision multimedia
    presentation program also has ARExx port built and can control other programs
    using ARExx.


    ARExx can direct commands to versions of the same script, offering the option
    to output and match functions between the different programs. For example, an
    ARExx script could extract data from a database, insert the data into a perform
    calculations on it, and return results into a word processor.


    # Examples of ARExx solutions to common problems


    Implementing new features and capabilities via scripts


    If user is using a script that builds animations by joining bitmap image files
    but lacks processing capabilities, he could write an ARExx script that performs
    these tasks:


    +   - ARExx locates the image files in their directories

    - ARExx loads first image

    - ARExx loads paint program

    - The image is loaded into program which performs modifications to it

    - The modified image is stored in another directory

    - ARExx repeats on image in the directory

    - The paint program is closed and the animation program

    - The animation is built

    - The animation is saved in its directory

    - The animation program is closed


    # History


    ARExx was first created in 1987, developed by the Amiga Simon S. Harvey. It is
    the language described by Mike Cowlish in the book REXX: A Practical Approach
    to Programming. ARExx was included in AmigaOS 2.0 (1990). This version of ARExx
    follows the original logic; James Harvey was involved in drafting the ANSI standard
    for ARExx


    ARExx is written in 68000, and cannot function at full speed without PPC CPUs,
    as ARExx has not been rewritten for them and is still missing in MorphOS 2.0.
    James Harvey was not involved in development of Amiga programs because of quarrels
    with the most competent of the ARExx, and no other Amiga-related firm is making
    new versions of ARExx


    From the ARExx manual: ARExx was developed on an Amiga 1000 with 512 bytes of
    memory and two floppy disks. The language prototype was developed in C Listing,
    and the production version was written in assembly-language using the Metacomco
    assembler. The documentation was created with


    ARExx can increase the capabilities of various programs. Because of the power
    of a stand-alone ARExx package, it is included with Release 2.0 of AmigaOS.


    Like REXX implementations, ARExx usesless data representation. Other programs
    make distinctions between integers, floating point numbers, strings, vectors,
    et c. In contrast, ARExx treats all data as strings of characters, markers and
    expressions. As is the case in well-scanned languages, variables are not declared
    before using them, they come free from their first use.


    ARExx scripts benefit from a handling system which monitors and repeats calls.
    The program can choose to resume the execution of the program as needed.


    # Avoiding repetitive procedures


    FilesRExx is a well known example of a simple ARExx script written to automate
    a repetitive and boring procedure. This script uses the AlexaCompare program to
    compare files, and then finds all duplicates in a set of files and returns output
    highlighting any differences in a different color.


    # Expand AmigaOS capabilities


    One of the main features of ARExx is that it can expand the capabilities of the
    AmigaOS by adding some features the OS lacked. For a simple ARExx program could
    be written to print a warning message on the screen of the monitor, or play an
    Amiga program'
