    Flags are boolean variables used for conditions that may be set or cleared with
    commands. If the #command is called a given flag will be evaluated; if it is true,
    the message listed after it will be sent, causing the script to jump to that point.


    Instructions prefixed with # specify commands, which control interactions with
    the environment, whether it be showing, setting a flag, sending a message or processing
    a conditional. There are dozens of primitive Zoot-oop commands:


