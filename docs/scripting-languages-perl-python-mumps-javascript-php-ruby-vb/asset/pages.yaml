    # AS/400 Control Language


    The AS/400 Control Language (CL) is a scripting language for the IBM AS/400 platform
    bearing a resemblance to the Job Control Language and consisting of an expand-ing
    set of commands (*CMD) used to invoke traditional AS/400 programs and get help
    on how these programs do. CL can also be used to create CL programs (group scripts)
    where there are additional commands that provide function-ality (GOTO, ELSE, variable
    de-claration, file input, etc.).


    The multiplicity of AS/400 com-mands introduced by IBM to perform system level
    tasks like compiling programs, backing up data, changing system configurations,
    displaying object details, or delet-ing commands. They are limited to certain
    system levels and can be de-fined for user applications.


    ```

    ARG event

    IF event = 0 EXIT

    IF event = 1 SAY "Program

    has executed unexpectedly"

    IF event = 2 SAY "Program

    has finished its job"

    IF event = 3 THEN SAY "Cannot

