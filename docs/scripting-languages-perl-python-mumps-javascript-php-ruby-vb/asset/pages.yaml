    # Creating new commands


    # Command grouping menus


    from this, aside with the PGM parameter, that default is *SAME, meaning that cannot
    change it.


    New commands can be created to call non-system programs and they will work exactly
    like the AS/400. The Command Definition Language is described in the CL Programmer
    Guide.


    The VERB and SUBJECT menus are part of what are called Grouping Menus. Every three
    (or four) letter is a menu that starts with the letters CMD. So are all CHG would
    execute the command CMDCHG. For programs it would be named CMDPG.


    It''s a good idea to create screens for new commands and their. All screens use
    Panel Group objects (*PLNGRP) and can be created using the UI language of the
    IBM AS/400 Application Specification.


    # Prompting


    All AS/400 commands can be prompted directly from the command line or with CL
    program by typing the command and pressing the F4 key. AS/400 can also be prompted
    by typing * before the command. (This is in an interactive interface which shows
    a command string, having already filled in some.)


    There are other menus besides the Grouping Menus. The starting point for the mentioning
    system can be accessed by pressing F4 on an empty command line.


    # Command selection


    In Version 3 of the system new, much simpler method of creating was helped: run
    the command


    If one knows only part of a command or third party is used where the commands
    don''t conform to the AS/400 standard deviation you would then part of the command
    that is known, attach an asterisk (to make it generic), and press. The system
    will display a list of commands in your library''s list that matches the generic
    names you need. One can then page through the list for the command and then select
    using arrow keys.


    The system will present you with the set of parameters that the command accepts/(required
    parameters are highlighted).


    ```

    GENMCMD(CMD/LIB/MYTYOD)(QYS/LIB/MYLIB/PNRNRC.SRC)GENOPT(*)

    ```


    Required parameters are listed, and parameters with system-default values are
    listed last of all. Use F10 if one chooses further values, those that can be changed
    by answering prompts.


    A UI panel will be used to automatically generate all the parameters described
    by the command. The result can be edited (sed, wdsi, rid), then created using
    CRNPLGRP, and finally associated with the command CHOCLD MIPLGRP.


    Prompting is further enhanced to the low factor to which values are valid for
    each command. During the prompt the user would use the cursor to move to the field
    question and press F4. The system would then display a screen showing the type
    of input and available list of values.


    # Finding the right command


    There are 2,611 commands in IBM commands but finding them is not that all have
    good designs of the system to make life easy. These saving devices are: Standardized
    Abbreviations, Command Grouping, and Command Selection.


    To enter a name, or the list to enter extra values, a plus sign could be used
    instead. (When listing names of objects to be saved or restored.)


    # Sample code


    The following is a sample of CL programming. The program converts dates from month
    and day vice versa. There are 24 versions of them. It takes two parameters: the
    &IN parameter is the date to be converted. It should be a string in the format
    YYYYmm where year is month and day. A MDYY must be in the format mmDD. The second
    parameter is &TYP which is the type of date to be converted. It must be ''J''
    (Julian) or ''M'' (my). For example: the command PGM(ICVTDATC) PARM(''01480 ''M'')
    will convert the Julian date 01480 (June 28, 2004).


    # Standardized Abbreviations


    The AS/400 standardized the abbreviations used to create commands. Verbs are always
    changed as CHG, display as DSP, work as CREATE, etc. Subjects are always PGM,
    user as USER, MOD as MOD, etc. You can see every verb and subject used on the
    AS/400 in the VERB and SUBJECT menus, then enters the commands GO VERB OR GO SUBJECT.


    # Command help


    Cursor help can also be prompted on AS/400 commands that are not required. If
    help has provided one you can view for help by moving the cursor to the desired
    field and pressing F1. To help for the entire command (itself and any of its parameters)
    you would press F1 on the prompt and press F2 (extended).'
