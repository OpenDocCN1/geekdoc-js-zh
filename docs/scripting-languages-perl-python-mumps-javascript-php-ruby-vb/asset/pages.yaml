    # Client-side scripting


    Client-side scripting generally refers to the class of programs on the web that
    are executed client-side, by the user''s web browser, or server-side (the server).
    This type of computer programming is an important part of the Dynamic (HTML) web
    pages to be scripted; that is, have different and changing content depending on
    input, environmental conditions (such as the time of day), or other variables.


