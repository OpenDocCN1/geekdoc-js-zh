  md: '# AutoLISP


    AutoLISP is a dialect of Lisp programming language built specifically for the
    full version of AutoCAD and its derivatives, which include AutoCAD Map 3D, AutoCAD
    Architecture and AutoCAD Mechanical. Neither the interpreter to execute AutoLISP
    are included in the AutoCAD product line.


    ; AutoLisp function definition, callable from other AutoLISP functions:


    ```

    (defun hello ()

    (alert "Hello World!")

    ```


    : A function can also be invoked at command-line as a regular AutoCAD command:


    ```

    (defun c_hello ()

    (alert "Hello World!")

    (princ)

    ```


    # Features


    AutoLISP is a small, dynamically scaled, typically typed LISP dialect with garbage
    collection, immutable symbols, and marking in regular LISP features as record
    facilities, arrays with variable number of arguments or lists. From the core logic,
    the most powerful functions are for geometry, accessing AutoCAD''s internal DWG
    database, and manipulation of graphical entities in AutoCAD. The properties revealed
    to AutoLISP as association lists in values are paired with AutoCAD "group" codes
    that identify properties points, radii, colors, layers, etc. AutoCAD loads AutoLISP
    code from files.


    : Example of AutoLISP''s conditional:


    ```

    (cond (a = b)

    (princ "n(a) and b are equal")

    (and (= type a) ''INT)

    (= type b) ''INT)

    (strcat "n(a)+b" itoa

    (and (= type a) ''STR)

    (= type b) ''STR)

    (strcat "n(a)+b" a))

    (and (list a (= type b) ''SUB)

    (mapcar function (lambda x)

    (print b x)) a))

    ```


    version of XLISP, which was created by David Betz. The language was introduced
    in AutoCAD 2.18 in January 1986, and came to be released in successive releases
    up to Release 13 in 1995. After that, its development by Autodesk for more fashionable
    development environments like VBA, NET and ObjectARX. However, it remained AutoCAD''s
    primary user customization language.


    VisualLISP, a considerably enhanced version of AutoLISP including an IDE, debugger
    and compiler, was supported and developed by third party Basis Software. VisualLISP
    was the version of AutoLISP that added VBA-like commands to access the AutoCAD
    objects (event handling of AutoCAD objects), support and other general LISP functions.
    Autodesk requested this as an add-on to AutoCAD 14 released in May 1997. It was
    incorporated into AutoCAD 2000 in March 1999, as a replacement for AutoLISP. Since
    then AutoCAD chose to halt major enhancements to VisualLISP in favor of favoring
    VBA and NET.


    AutoLISP can interact with the AutoCAD graphical editor by use of primitive functions
    that allow user to pick points, choose objects on screen, input numbers and other
    data. AutoLISP also has a built-in GUI language, for creating modal dialog boxes
    with automated layout, within AutoCAD.


    VisualLISP has such a strong following that other AutoCAD versions add it to their
    other products. FlexisCAD, Bricsoft, IntelliCAD and other AutoLISP functionality,
    so that LISP users can use it as an alternative to AutoCAD. Most development involving
    AutoLISP since VisualLISP since the original AutoCAD 2000 is actually performed
    within VisualLISP replaced the VisualLISP engine. There are thousands of units
    and applications that have been developed using AutoLISP or VisualLISP (distributed
    as LISP, FAS and VLX files).


