    The items above in -name follow low AS/400 object naming conventions, which generally
    means names that start with a letter and can be up to ten characters in length
    (CL com-mands are also case-insensitive).


    At most basic command the user uses a single program to call when they prompts
    or command presses the Enter key. The command takes all of the parameters used
    by the user, and not by them, and builds a parameter list that passes to the program
    when it''s called.


    A good example of a typical CL-the Change Program (CHPGM) command:

    CHPGM MYPG

    OPTIMIZE(FULL)

    RMVBS(BLOCK) *PRCORD

    TEXT(MY program).


    # Syntax


    The BNF for a simplified CL command syntax would be defined as follows:


    ```

    <CL-command> ::= command=

    <positional-parameter-list> ::= <named-parameter-list>",

    ```


    ```

    <positional-parameter-list> ::=

    <positional-parameter> ::= <positional-parameter>",

    ```


    ```

    <named-parameter-list> ::=

    <named-name>("\<parameter-element-list> ")::=

    <named-parameter-list>",

    ```


    ```

    <parameter-element-list> ::=

    <parameter-value> ::= <parameter-element>",

    ```


    ```

    <parameter-value> ::= CL =

    qualified-name("\special-value

    ggeneric-name ::="\alphanumeric")",

    ```


    The above command is four parameters to the program that do Change Processing
    and they are:


    +   * MYGM: A positional parameter (PGM), and the only required. In this case
    it is the program being changed. Positional parameters are always first. Once
    a named appears all parameters that the list must need parameters.

    * OPTIMIZE(FULL): A named parameter specifying which element is special. In this
    case it will change the program to be fully optimized.

    * RMVBS(BLOCK; *PRCORD): A named parameter (Remote Observability) specifying special
    values. In this case telling to remove two fields of data from the program.

    * TEXT(My program): Another named parameter specifying a alphanumeric value. In
    this case it changes the text of the program.


