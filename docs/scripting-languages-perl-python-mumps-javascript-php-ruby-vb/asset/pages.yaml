  md: "# 134 - Mobile application development\n\nOutside of these differences, Mirah\
    \ code generally looks like Ruby code:\n\n# Frameworks\n\nThe syntax of Mirah\
    \ is largely the same as the syntax of Ruby, but with few modifications to static\
    \ typing:\n\n# Dubious\n\n+   - Method parameters usually need to have their types\
    \ declared:\n\n```\ndef fib(a:int)\n  if a < 2\n    return a\n  else\n    return\
    \ fib(a-1) + fib(a-2)\n```\n\nDubious is a project for running Mirah on Google\
    \ App Engine. Dubious provides a way to build apps in Mirah, with conventions\
    \ familiar to Rails and Sinatra. Since everything is compiled-of-time Mirah apps\
    \ have none of the initialization costs associated with JRuby. Dubious supports\
    \ erb and has a simple datastore adapter that uses a syntax similar to DataMapper.\
    \ Source (edited): \"http://en.wikipedia.org/wiki/Mirah(programming_language)\"\
    \n\n```\ndef foo(String, b)\n```\n\n+   - Because several transformations in the\
    \ Mirah toolchain, strings that are identifiers in Ruby are treated as keywords\
    \ in Mirah, which the \"interface\" used to specify a JVM-style interface.\n\n\
    Status\nCurrently Mirah is under development, but there are developers using Mirah\
    \ for production applications on a limited scope.\n\n# Mobile application development\n\
    \nMobile application development is the process by which software application\
    \ is developed for small low-power hardware devices such as personal devices,\
    \ enterprise systems and mobile phones. Applications are often pre-installed on\
    \ phones during manufacturing, or downloaded by customers from various software\
    \ distribution platforms.\n\nwebOS and iOS offer free SDKs and integrated development\
    \ environments. Mobile execution offers considerable performance advantages over\
    \ Java.\n\nMost famous is Apple App Store, where only approved applications are\
