    # Built-in variables


    AWK''s built-in variables include the fields: $1, $2, $3, and so on ($0) represents
    the entire record. They hold the text or values in the individual fields in records.


    Other variables:


    +   NR: counts a count of the number of input records.

    NF: counts a count of fields in the input record. The last field in the record
    is designated by NF


    +   FILENAME: Contains the name of the current input-file.

    FS: Contains the "field separator" character used to divide fields on the input
    record. The default, "white space", includes any space and tab characters. FS
    can be reassigned to another character to change the field separator.

    RS: Stores the "record separator" character. Since, by default, the input line
    is record, the record separator is a "newline".

    OFS: Stores the "output field separator", which separates fields when AWK prints
    them. The default is a "space".

    ORS: Stores the "record separator" which separates the records when AWK prints
    them. The default is a "newline".

    OFMT: Stores the format for numeric output. The default format is "%6g".


