  md: "# 132 - MiniD\n\nMiniD began in June 2006 as an idea for a statically-typed\
    \ language, like a stripped-down version of the D programming language. The reason\
    \ is for the \"Mini\". After work on the compiler, Garrett Billings, realized\
    \ just how large a project was becoming, and decided to recast the language into\
    \ something much simpler.\n\nThe result was a Lua language with a C-style syntax.\
    \ Over the next few months, MiniD acquired features from various languages, a\
    \ D-like module and Lua-like multiprocessing. On August 1, 2007, after three months\
    \ of planning and programming, version 1.0 of the reference implementation was\
    \ released. The 1.0 language specification is frozen.\n\nAs of June 2009, version\
    \ 2 of MiniD has undergone a major reimplementation of the library to support\
    \ its own garbage collector rather than relying on the D garbage collector, for\
    \ better behavior in realtime applications.\n\nchecks are still present at runtime\
    \ unlike in static languages, but their syntax and negligible performance impact\
    \ make them more powerful and easy-to-use than similar in dynamic languages. They\
    \ can help in catching bugs that cause functions to malfunction or corrupt data\
    \ structures. A small example is given below.\n\nbers of \"this\" must be accessed\
    \ explicitly.\n\nThe class has one method, 'toString', which is all called when\
    \ the object needs to convert to a string. The unusual syntax used here is inspired\
    \ by many functional languages and is shorthand for the following:\n\n```\nfunctionString()\n\
    \  return(\"x = {y}\"; x, y)\n\n```\n\nFinally, the class is instantiated by making\
    \ it like a function, simply. When the instance is printed using \"out\", the\
    \ 'toString' method is called, and so the program outputs \"x=3 y=4\".\n\n# Features\n\
    \nMiniD provides a small but flexible set of data types, similar to that of Lua\
    \ or''s. Unlike Lua, MiniD provides explicit support for object-oriented programming\
    \ with classes. MiniD also provides a module system as core language features,\
    \ like Lua. MiniD is garbage-collected, with support for first-class functions,\
    \ closures, and tail recursion.\n\nMiniD also tries to be more robust than dynamic\
    \ languages, making it easier to catch bugs. For example, it does not implement\
    \ implicit declarations and globals that do not exist an error of giving a default\
    \ value (as in Lua). Another helpful feature is \"parameter type constraints\"\
    , which are a way of specifying types that functions may accept. These\n\n# Example\
    \ code\n\nThe following example is for MiniD 2. (Due to technical limitations,\
    \ some keywords are not available here, as Wikipedia does not have a source for\
    \ MiniD).\n\nHere is the Hello program in MiniD\n\n```\nmodule test\n```\n\n```\n\
    println(\"Hello, World!\")\n```\n\nEvery MiniD source file needs a module declaration.\
    \ For simplicity, the module declaration is omitted in the rest of the files.\n\
    \n```\nclass Test {\n  x = 0\n}\n```\n\n```\nthis(x,y) {\n  x = x\n  y = y\n}\n\
    ```\n\n```\nfunction toString(format(x = y)) {\n  return x, y\n}\n```\n\n```\n\
    local t = Test(3, 4)\nprintln(t)\n```\n\nThis example shows a simple class with\
    \ two fields, x and y, which are initialized to default. The class, declared with\
    \ the 'this' keyword, takes two parameters and assigns them to the instance's\
    \ fields. The syntax \"x:x\" is shorthand for \"this:x\", where \"this\" is the\
    \ object which method was called. Just like Lua or Python, mem\n\n```\nlocal a\
    \ = range(1, 11)\nlocal b = a.map(x -> x * x)\nprintln(b)\n```\n\nThis example\
    \ demonstrates some MiniD array manipulation abilities. Unlike Lua, MiniD has\
    \ a separate array type. In this example, an array is created that holds the values\
    \ 1 through 10 using the 'range' function. The 'map' method of array is implemented\
    \ 'a', and it takes a literal to return the squares of the parameters. The literal\
    \ syntax is inspired by functional languages (like Haskell) and is shorthand for\
    \ the following:\n\n```\n[x * x for x in 1 .. 11]\n```\n\nThis shows a way of\
    \ achieving the same result using MiniD's list comprehensions. The syntax is very\
    \ close to Python's.\n\n```\nlocal b.map(function(x) { return x * x }\n```\n\n\
    When it's printed, the first ten squares, are [1, 4, 9, 16, 25, 36, 49, 64, 81,\
    \ 100]."
