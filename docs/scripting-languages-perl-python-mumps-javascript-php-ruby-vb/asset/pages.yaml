    # Features


    # Message-oriented


    Message-oriented programming indirect calls to one or more listeners when a message
    is broadcast. The contents of the message array can include any language, but
    not limited to classes from which create instances, functions or sequences. Listeners
    can either receive the message and participate in building a message in ordered
    messages. Messages can be broadcast and require an immediate reply or be left
    in the event to be received and processed by later communications (terms asserted
    in Falcon).


    # List comprehensions


    Along with multiple paradigms, Falcon presents a variety of different features
    for programmers.


    Base classes exposing the sequence interface to the internal engine offer a "comp"
    method which offers all functionality of a list comprehension. The comp method
    takes a mandatory "source" parameter, which can be another sequence, an item range
    or generator to return one item at a time, and a filter and modifier.


    A question (in a general item) can be provided as second option parameter and
    acts as a filter and modifier.


    Associative pairs (as i.e. dictionaries) are well supported.


    Message oriented programming has a direct interface to the Virtual Machine, on
    which native modules and embeddings can interact. For example, a multithreaded
    application may throw through the virtual machine message queue between threads,
    for serializing processing at script level and broadcast of processed solutions
    directly from within the scripts.


    Following is a simple example using a list comprehension; the result is an array
    of even numbers 2..10.


    ```

    even_array=[comp(2:11:2)]

    ```


    This generates a random list numbers in the range 1..9; the list terminates when
    the random number is 10 (that is, each item as 1/10 probability to be the last).


    The "comp" method returns the same object it operates on. So, it is possible to
    apply it along any extension to add more data to it.


    Similarly, the "mfcomp" method allows to create comprehensions using more input
    sets, as in the following


    ```

    sums=[mfcomp(x,y) -> x+y), [1,2], [3,4]]

    ```


    The resulting array in "sums" contains the values obtained each element in the
    first set (x) with each element of the second set (y).


    # Template documents


    Falcon allows to part of text documents, with the preprocessor <?. Directive files
    are treated as text documents and simply ended until one of those processes is
    encountered. Inbound scripts are executed as the following


    You can call this script with <? args.len()>?1)?


    FTD documents are used with Normal Falcon scripts to apply-'
