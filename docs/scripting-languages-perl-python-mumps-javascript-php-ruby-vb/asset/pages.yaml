  md: '# 14 - ActionScript


    ese data types are similar to Java data types. ActionScript a complete rewrite
    of ActionScript 2, the data types and their inheritances have changed.


    # ActionScript 2 top level data types


    +   - String - A list of characters such as "Hello World"

    - Number - Any Numeric value

    - Boolean - A simple binary storage that can only be "true" or "false"

    - Object - The only data type that contains in data. It allows for the grouping
    of methods, functions, parameters, and other objects


    # ActionScript 2 complex data types


    There are more "complex" data types. These are more memory intensive and conscious
    of simple types. For AS2, some of these are fixed-length, and are bounds-checked
    during retrieval. Retrievers are not just more purpose than Arrays but also dynamic.


    +   - MovieClip - An ActionScript creation that allows easy use of visible objects.

    - TextField - A simple dynamic or input field. Inherits the MovieClip type.

    - Button - A simple button with 4 frames (states): Up, Over, Down and Inherits
    the MovieClip object.

    - Date - Allows access to information about a specific point in time.

    - Array - Allows linear data storage

    - XML - An XML object

    - Node - An Node object

    - Loads - A Loads object allows for the storing and use of HTTP POST and GET variables


    +   - Null - The data type contains only one value, null. this is the default
    value for the String data type and all classes that define data types, including
    the Object class

    - Number - The data type can represent integers, unsigned, and floating-point
    numbers. The data types use the 64-bit precision format as specified in the IEEE
    Standard for Floating-Point Arithmetic (IEEE-754) between -9,007,199,254,740,992
    and +9,007,199,254,740,992 can be stored.

