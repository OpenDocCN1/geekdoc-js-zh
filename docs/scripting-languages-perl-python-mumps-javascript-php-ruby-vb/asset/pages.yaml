    In contrast, server-side scripts written in languages like Perl, PHP, JavaScript,
    and server-side VBS are not executed by the web browser. They produce output in
    a format understandable by browsers (usually HTML), which is then sent to the
    user. The user cannot see the script source (unless the author publishes the code
    separately), and may not even be aware that a script was executed. Documents produced
    by server-side scripts may contain client-side scripts.


    Due to security restrictions, client-side scripts may not be allowed to access
    the user''s browser web application. Techniques like ActiveX controls be used
    to debug client-side scripting.


    Client-side scripting is inherently unsafe. Users are encouraged to keep their
    web browsers up-to-date to protect against common attacks and vulnerabilities
    that are discovered.


    Web authors write client-side scripts in languages such as JavaScript (Client-side)
    and VBS.


    The latest group of web pages tend to easily handle client-side scripting, accounting
    for an improper user experience in which the user does not experience the "refreshing"
    of the web page, but instead sees an animated GIF file that is being loaded. This
    is also an advantage to client-side languages, allowing web browsers to communicate
    with the web server without requiring a complete version of the page to be rendered.
    Leads to a much improved user experience in general.


    # Method


    Client-side scripts are often embedded within an HTML document (hence an "embedded"
    script), but they may also be in a separate file, which is referenced by the document
    (documents) that it uses (hence an "external" script). Upon request, the files
    are sent to the user''s browser by the web server (or servers) on which they reside.
    The user''s browser executes the script, then displays the document, including
    any output from the script. Client-side scripts may also contain information in
    response to other events (like clicking a button). These instructions can be followed
    without further communication with the server.


    Client-side scripts have greater access to the information and functions available
    on the user''s browser, whereas server-side scripts have greater access to information
    and functions available on the server. Server-side scripts require that the user''s
    interpreter be installed on the server, and produce the same output regardless
    of the client''s operating system, or other details. Client-side scripts do not
    require additional software on the server (making them popular with users who
    lack access to install software), they do require that the user''s browser understands
    the script language they are written. It is therefore impractical for an author
    to write scripts in a language that is not supported by web browsers.


    By viewing the file that contains the script, users may be able to see its source
    code. Many web authors learn


    Unfortunately, even languages that are supported by a wide variety of browsers
