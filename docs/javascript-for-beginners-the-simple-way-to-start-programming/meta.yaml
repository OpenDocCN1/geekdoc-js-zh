    2. Notice that we''re using RegExp JavaScript object. This object provides us
    with a "test" method to determine if the value passes our regular expression rules.


    # Exact match search


    The RegExp above allows any value that contains MAR-16-1981. Next let''s expand
    on our regular expression to only allow values that equal MAR-16-1981 exactly.
    There are two things we need to add to our regular expression. The first is a
    caret ^ at the beginning of the regular expression. The second is a dollar sign
    $ at the end of the expression. The caret ^ requires that the value we''re testing
    cannot have any characters preceding the MAR-16-1981 value. The dollar sign $
    requires that the value cannot have any trailing characters after the MAR-16-1981
    value. Here''s how our regular expression looks with these new rules. This ensures
    that the value entered must be exactly MAR-16-1981.


    ```

    /^MAR-16-1981$/

    ```


    # Character matching'
