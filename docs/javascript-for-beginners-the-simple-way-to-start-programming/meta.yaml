    ajax 发起异步请求。几年前当 Flash 还不流行时，JavaScript 被广泛用于为网页添加精美效果，现在仍被用于同样的目的。让我们来看看该语言的一些特性。


    - 1. 浏览器支持：要访问 Flash 内容，您需要在浏览器中安装 Flash 插件。但要使用 JavaScript，您完全不需要任何插件。这是因为所有浏览器都接受
    JavaScript 作为脚本语言并为其提供集成支持。您需要做的就是妥善处理某些依赖于客户端浏览器 DOM（文档对象模型）的任务。


    - 2. 既可用于客户端也可用于服务器端：由于 JavaScript 可以访问浏览器的文档对象模型，您实际上可以在运行时更改网页的结构。由于此，JavaScript
    可用于为网页添加不同的效果。另一方面，JavaScript 也可以在服务器端使用。例如，在流行的开源企业内容管理系统 Alfresco 中，JavaScript
    用于创建网络脚本（webscripts）。这使得为 Alfresco 添加自定义任务变得非常简单。


