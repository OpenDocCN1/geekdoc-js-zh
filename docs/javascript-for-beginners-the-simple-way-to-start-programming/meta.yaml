  md: '# CHAPTER SIX


    # JAVASCRIPT ERRORS


    For most computer users javascript is strange PC lingo. Most people except PC
    professionals programmers know little about it. Essentially, JavaScript is a web
    development language that is most commonly used on websites. Popular among non-programmers
    for its user-friendly nature, JavaScript also allows scripting access to objects
    in other applications.


    However, JavaScript errors are fairly common too, largely because so many amateurs
    write web development programs using it. But the terrible thing is that it can
    also be used to write adware and spyware, which make their way into your computer,
    often without you realizing it, and thereby clog the registry. This, in turn,
    slows down your computer and may even cause it to crash, and we all know what
    a big headache that means.


    The common JavaScript errors are the following:


    +   - JavaScript is not enabled in the browser.


    +   - The web page contains a JavaScript programming error.


    +   - The browser does not support JavaScript technology.


    What can we do to deal with these problems? Of course, you could choose to inform
    the Webmaster about the problem and supply all details of the javascript error
    message that you have been receiving, but you have an easier alternative to that.
    Simply clean your windows registry and watch the problem vanish.'
