    # ENABLE OR DISABLE JAVASCRIPT IN INTERNET EXPLORER


    Internet Explorer has a nice functionality that makes it simple to make changes
    to your settings, and this includes JavaScript options.


    - 1. In your window of IE9, click on the Settings menu that appears to be the
