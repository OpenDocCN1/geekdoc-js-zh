    ## 第七章


    ## 必须掌握的核心编程语言


    我们经常从希望进入 IT 行业的人那里听到的最常见的问题之一：“我需要了解哪些编程语言？”显然，这是一个复杂的问题，答案取决于你想要进入哪个领域。然而，已经在
    IT 行业的人知道，你所拥有的最大技能就是成为一个**全才****。得益于对多种编程语言的广泛了解，准备充分的员工只需经过极少的培训就能在不同的计算机编程工作之间切换。


    正因如此，这个问题的快速答案是：“学会的语言越多越好。”当然，如果我们花时间去学习每一种编程语言，我们实际上永远无法获得收入！这份列表涵盖了试图进入 IT
    行业的人应该掌握的最核心的计算机编程语言。


    ### 1. HTML、CSS 和 JavaScript


    这三种不同的语言被列在一起，是因为它们构成了绝大多数网站代码。由于互联网现在已成为全球通信的主要手段，网页设计和开发领域将永远存在。HTML、CSS 和 JavaScript
    在许多方面都是相似的，但它们在改进网站功能方面各自侧重。


    HTML 代表超文本标记语言（Hyper Text Markup Language），是网站的基础语言。HTML 用于在网页上插入图像、链接、基础格式和内容。它是最容易学习的编程语言之一，通常也是职业
    IT 人士学习的第一门语言。


    CSS 是 HTML 的自然扩展，为网站引入了更多功能。CSS，级联样式表（Cascading Style Sheets），通过让单个网页调用独立的代码来确定页面上的元素，允许创建具有固定格式的复杂网站。这使得代码更加简洁，并实现了布局与内容的分。


    JavaScript 允许网页进行客户端交互，并被设计为与 HTML 和 CSS 无缝融合。文本框、按钮和弹出窗口都是 JavaScript 的功能。


    ### 2. Java


    Java 在许多方面与 JavaScript 相似，但实际上它们之间没有关系。它是一种面向对象的语言，有许多用途，设计得既直观又稳定。Java 的通用性和广泛应用使其对开发者非常有用，几乎找不到一个对它了如指掌的成功程序员。


    Java 常见于网络 Applet，在那里它可以运行比 JavaScript 更高级的 GUI。许多在线游戏通过 Java 运行。它并不是特别快速或强大的语言，但它几乎可以完成任何事情，并且在不同的机器和操作系统之间几乎通用。因此，它是每位
    IT 工作者都应该知道的编程语言。


    ### 3. C 和 C++


    这两种语言是今天仍被广泛使用的经典。C 语言于 20 世纪 70 年开发，用于系统编程。然而，由于其高效性和通用性，它很快在消费级软件中也流行起来。


    C++ 设计于 1983 年作为 C 语言的扩展。它现在是最流行的编程语言之一，可以用于几乎所有的应用程序。作为在使用的开发最完善、最强大的编程语言之一，了解它对
    IT 工作者来说是关重要的。如果你只能学习一种语言，请学习 C++。


    ### 4. PHP


    PHP 是一种服务器端语言，允许创建交互式网页。它被设计为使用标签，因此与网页的基础 HTML 集成。这听起来与 JavaScript 相似，但关键区别在于
    JavaScript 仅在客户端运行。在许多情况下，通过服务器进行交互是理想的，而这正是 PHP 发放异彩的地方。PHP 与 Java 配合良好，使得在代码中调用
    Java 方法变得更容易。


    结合与许多类型数据库的兼容性，很容易看出为什么 PHP 应该出现在每个程序员的武器库中。


    ## 第八章


    ## 如何学习编程语言


    上述语言通常足够在 IT 行业起步，但你可能还会遇到其他几种语言。Ruby、Perl 和 Python 都在高级项目中被广泛使用，所以如果你有时间，它们非常值得研究。而且，特定的任务可能需要现有的众多编程语言中的任何一种。


    一名专业 IT 工作者需要掌握的语言数量可能会让人望而生畏。并不是每个人都有时间或金钱接受正规教育，而网络上的免费资源往往难以遵循、不准确或不完整。不要让自己在这个竞争激烈的行业中落后。今天就开始温习你的编程语言吧！


    ## 结论


    JavaScript 基本上是由网景（Netscape）公司创建的一种编程语言。这种语言在最近几个月获得了相当大的关注，因为它允许 Web 开发人员修改浏览器行为以及网站内容，而这是使用传统的
    HTML 工具甚至 CSS 无法实现的。在页面上使用 JavaScript 使开发者能够控制页面对用户特定操作的反应和行为、检查文档元素、在提交之前验证表单选项、为页面添加日期和时间，甚至嵌入简单的微游戏。一旦你掌握了
    OOP（面向对象编程）概念的基础知识，这门语言就很容易学习和理解了。

    '
