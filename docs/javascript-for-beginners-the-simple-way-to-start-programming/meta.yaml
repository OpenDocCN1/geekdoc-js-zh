    JavaScript 仅用于某些对数据安全不是重要考虑的特定应用程序，而 Ajax 技术的应用范围是无限的。


    # 集成 JAVASCRIPT 和 ORACLE FOR


    任何在 JavaScript 中编写的代码都将与你的网页以及在用户浏览器中运行的脚本一起交付，而不是直接运行在提供网页的服务器上。因此，整个用户体验将变得更加流畅和快速。


    这种编程语言通常用于创建网站与访问者之间的交互，并开发一种不仅限于访问网站的参与度。JS 也用于嵌入式硬件控制和服务器。


    这就是为什么这种语言被认为是强大的原因。JavaScript 被认为是一种丰富且实用的基于器的脚本，因为它不需要安装；它直接内置在网络浏览器中！


    你可能经常看到“JavaScript”和“网络浏览器”一起使用，但“JavaScript”和“Oracle Forms”又是什么？


    ## Oracle Forms 应用


    让我们简单聊聊 Oracle Forms。


    Forms 是一个强大的开发和运行环境，已用于为组织构建关键任务应用程序。


    企业通过将 Oracle Forms 以及其他遗留应用程序与 JavaScript 集成可以受益匪浅。这种集成有助于企业和组织将各种应用程序统一到一个桌面应用中，通过简化业务流程、消除冗余数据输入和降低维护成本来提高准确性和效率。


    想象将 Forms 操作简化为自动化的任务序列！


    当 Oracle 引入 Java 导入器以及 Java 6i 版本时，它使得调用 Java 中的类成为可能，并允许 Forms 调用 Web 服务。


    毫无疑问，技术的这些改进帮助 Oracle Forms 摆脱了相对隔离的状态。在引入 itg 之前，Forms 无法运行任何功能，除非用户的操作触发了它们。


    # JavaScript 和 Oracle Forms


    但通过 JavaScript 和 Oracle Forms 的集成，一套新的功能减轻了 Forms 开发人员的压力。Oracle Forms 现在处于即使在没有用户触发的情况下也能反应的位置。它们现在不仅与客户端
    JavaScript 交互；还可以根据高级队列（Advanced Queuing）消息进行交互。


    运行所有应用程序的表 applet 现在可以通过 JavaScript 与周围的其他网站通信。Web 开发人员现在可以将他们的表单嵌入 HTML 页面中。你的
    Forms 应用程序现在可以通过 JavaScript 集成与 Google Maps、电子商务平台等现代 API 进行交互。


    由于新的市场压力，让更多遗留应用使用 JavaScript 已已成为必要。JavaScript 能够增强遗留应用程序前端提供的交互性，这有助于提高用户友好性和有效性，同时帮助企业跟上最新的以
    Web 为核心的市场趋势。


    # 第三章


    # JAVASCRIPT 中的核心工具


    作为一种简单且多功能的客户端脚本语言，JavaScript 让 Web 程序员更容易让网站和互联网应用程序更加用户友好和具有交互性。JavaScript 代码在用户的计算机上执行。因此，开发者可以使用
    JavaScript 为网站访问者提供更好的用户体验，而不会给 Web 服务器带来任何额外压力。然而，Web 开发人员仍然需要使用各种 JavaScript
    工具来优化网站性能，而无需编写长长的代码。


    2015 年 Web 开发人员必须使用的七种**核心 JAVASCRIPT 工具**


    - 1. Meteor


    Meteor 让 Web 开发人员更容易在超简单的环境中创建现代网站和互联网应用。该框架的设计特性使 Web 应用程序开发变得简单、方便和快速。目前，Meteor
    支持 Linux 和 Mac OS X。然而，Meteor 社区已提供多种选项，让 Windows 用户可以使用该框架。社区提供的插件也让程序员更容易在不编写额外代码的情况下优化网站的功能和性能。


    - 2. Epoch


    如今，互联网应用程序广泛使用图表以一种令人印象深刻且引人注目的方式向用户展示信息。Epoch 让 Web 开发人员更容易在他们的应用程序中扩展和采用各种图表。目前，Epoch
    有五种实时图表，如面积图、折线图、饼图、柱状图和散点图。这些漂亮且高性能的图表可以使用 CSS 查询引擎进一步自定义。


    - 3. Hitch


    Hitch 是一个小型 JavaScript polyfill 引擎，可以轻松包含在任何网页中。Web 开发人员可以使用 HTML 和 CSS 的扩展。它通过使
    CSS 选择器更具表达力，让程序员保持 HTML 代码清洁。Hitch 让程序员更容易决定所需的功能，而无需担心最终用户使用的网络浏览器。


    - 4. Radio app


    Radi 帮助 Web 程序员为现代网站和互联网应用创建视频、动画和实时图形。它带有功能，允许开发者使用 HTML5 特性创建各种内容。HTML5。


    - 5. JSHint


    Web 开发人员仍然需要使用各种 JavaScript 工具来优化网站性能，而无需编写长长的代码。


    - 6. 交互地图


    为了提供本地化体验，现在大多数网站都使用动画。


    - 7. JavaScript 响应式扩展 (RxJS)


    现代网站需要高度。


    # 如何在你的浏览器中启用（和禁用）JAVASCRIPT


