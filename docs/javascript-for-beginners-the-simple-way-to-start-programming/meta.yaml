    # 引言


    Javascript 是一种客户端编程语言，其处理引擎嵌入在 Internet Explorer、Netscape、Firefox 等浏览器中。这使得处理引擎在浏览时能够读取和解释包含
    javascript 代码的网页。


    Javascript 首次出现于 1995 年，尽管当时它被称为 Livescript。这个名字后来被改为 javascript。


    Javascript 的发明是为了为 HTML 页面添加更多令人兴奋的功能。HTML 本身是非常枯燥的，除了显示网页之外什么也做。相反，Javascript
    编程可以提供许多令人兴奋的功能，如执行计算、允许用户与网页交互、执行表单验证、操作网页上的元素、提供出色的视觉效果、实现动态功能等。


    所有这些功能都为网站用户提供了增强的体验。因为 javascript 是一种客户端语言，所有这些功能都可以在无需频繁引用服务器的情况下实时可用。这防止了时间延迟并增加了用户的满意度。


    让我们仔细看看使用 javascript 编程可以做的伟大的事情：


    ### 执行计算


    Javascript 可用于从简单到高级的数学计算。如果您希望用户通过输入某些需要某种计算的信息并根据结果显示相关内容来与您的网站交互，这将特别有用。例如，如果用户在网站上输入所需的贷款金额，javascript
    可以计算还款并显示相应的结果。此外，javascript 还可以告知日期和时间、记录活动时间并执行复杂的日期时间计算。


    ### 用户交互


    网页上的 javascript 可以通过事件接收用户的交互并执行特定功能。一些最流行的事件包括：


    - onblur

    - onchange

    - onclick

    - ondblclick

    - onfocus

    - onkeydown

    - onkeypress

    - onkeyup

    - onload

    - onmousedown

    - onmousemove

    - onmouseout

    - onmouseover

    - onmouseup

    - onselect

    - onsubmit


    ### 执行表单验证


    Javascript 可以验证和检查用户输入，以确定其是否符合某些要求。例如，您可以检查某个字段是否为空、电子邮件地址格式是否正确、邮政编码格式是否正确等。


    在大多数情况下，如果您的网站访问者犯了错误，警框可以向其显示适当的错误信息。


    ### 操作网页上的元素


    Javascript 允许用户通过上述事件在与用户交互时更改网页的内容或样式。例如，悬停在某些文本上可以使图像出现，提交按钮上的文本可以在提交时发生变化等。


    ### 提供视觉效果


    Javascript 有许多方法为网页提供视觉效果，这是其他服务器端编程语言无法提供的。这一个典型的例子是一些华丽的图像悬停按钮。


    ### 实现动态功能


    Javascript 配合 AJAX（异步 JavaScript 和 XML）可以用于创建动态应用程序。其中一个示例是在不刷新页的情况下向网页上加载动态内容。


    # 第一章


    # 什么是 JavaScript？


    我们中的许多人经常看到屏幕上弹出一个窗口，说我们需要运行 Java 或更新 JavaScript。大多数人对这两者之间感到困惑，并好奇 Java 和 JavaScript
    之间的区别。


    ### JavaScript 的目的是什么？


    JavaScript 通常用于创建交互式网页。JavaScript 将运行在访问者的系统上，您不需要在所访问的网站上持续下载它。因此，整个用户体验将更快、更流畅。如果您是网站的访问者，您会注意到
    JavaScript 通常用于创建测验和投票以及其他鼓励交互的内容。使用该程序的主要目的是在网站和访问者之间创建交互，这种交互不仅限于访问网站。


    ### JavaScript 与 Java 有什么区别？


    Java 是一种用于创建需要在虚拟机或浏览器中运行的应用程序的计算机语言。它允许程序员使用英语而不是常用的数字代码。JavaScript 是一种面向对象的编程语言代码，可以在浏览器中运行。


    ### 运行 JavaScript 需要什么？


    如果您使用 IE、Firefox 或 Chrome 等主流浏览器，您不需要特殊工具即可运行 JavaScript。所有这些浏览器都内置了该支持。但是，只有当您的用户拥有支持
    JavaScript 并启用了 JavaScript 的浏览器时才能工作。如果是这样，当有人访问网站时，JavaScript 就会自动运行。


    人们不需要接受任何培训来运行 JavaScript。这些代码是预先写好的，并作为插件轻松可用。如果用户的浏览器支持 JavaScript 并启用了它，JavaScript
    就会自动运行。


    ### 编写 JavaScript 需要什么？


    编写 JavaScript 不需要特殊的代码。因为它是解释型语言。可以使用记事本或任何类似的纯文本编辑器创建该语言。


    ### 设计师可以使用 HTML 替代 JavaScript 吗？


    HTML 不能替代 JavaScript。这两种编程语言完全不同，具有不同的功能、特性和能力。HTML 是一种标记语言，旨在创建静态网页内容，而 JavaScript
    是一种可以执行动态任务的编程语言。它可以在网站的不同页面上反复使用。这可以通过将其外部化并放在单独的文件中并将 JavaScript 文件链接到 HTML
    代码中来实现。

    '
