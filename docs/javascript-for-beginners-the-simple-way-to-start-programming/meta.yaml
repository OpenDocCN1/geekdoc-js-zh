  md: '# CHAPTER TWO


    # THE DIFFERENCE BETWEEN JAVASCRIPT AND OTHER

    CODING LANGUAGES


    DIFFERENCES BETWEEN JQUERY AND JAVASCRIPT


    As a hugely popular client-side scripting language, JavaScript does not

    eed anymore introduction. In addition to being used as part of web

    browsers, JavaScript also controls the web browsers, effectuates user

    interaction, facilitates asynchronous communication, and delivers

    customized content to users. So most web developers use JavaScript to

    reduce the time ‘and’ effort required for building large or complex

    websites. The web developers also have the option to use several

    JavaScript frameworks to effectuate and speed up web development.


    jQuery is a widely used cross-platform JavaScript library. Despite being

    open source, jQuery is easy to use, fast and concise. The API provide by

    jQuery works seamlessly on major web browsers. Also, the feature-rich

    JavaScript library makes it easier for web developers to manipulate HTML

    documents, handle events, create animations, select DOM elements, and

    build AJAX application. At the same time, jQuery can also be used for

    creating a variety of plug-ins by taking advantages of the JavaScript

    library.


    Thus, the modern web developers have option to use JavaScript and

    jQuery either independently or side by side. However, it is also important

    for the programmers to understand some of the major differences

    bween JavaScript and jQuery.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Four IMPORTANT DIFFERENCES BETWEEN JAVCRIPT AND JQUERY


    # 1. Programming language and library


    As a dynamic programming language, JavaScript supports object-oriented, structured,
    functional and imperative programming styles. The first-class functions and dynamic
    typing also make JavaScript categorized as a prototype-based scripting language.
    On the other hand, jQuery is a JavaScript library.


    The framework makes it easier for developers to accomplish a number of common
    tasks like HTML document manipulation, event handling, animation, DOM element
    selection and AJAX application development.


    # 2. Scripting time


    When a web developer decides to use straight JavaScript, he has to write additional
