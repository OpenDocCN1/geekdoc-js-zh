    JavaScript，只需重新访问选项菜单并再次勾选该框即可。


    ## 在 GOOGLE CHROME 中启用或禁用 JavaScript


    由于 Chrome 是一个极简浏览器，启用或禁用 JavaScript 只需要找到正确的菜单选项并对设置进行快速更改。要为此，您首先需要识别代表菜单的符号。


    - 1. 在 Chrome 窗口的右上角，寻找一个像三条水平线的符号。点击此按钮将出现菜单列表。点击列表底部的“设置 (Settings)”。


    - 2. 打开设置菜单后，滚动到底部并打开“显示高级设置 (Show Advanced Settings)”。寻找名为“隐私 (Privacy)”的类别。在该下方，有一个“内容设置
    (Content Settings)”按钮。点击“内容设置”框将出现一个新窗口。


    - 3. 在出现的窗口中，您将看到可以操作的选项列表。寻找 JavaScript 设置。


    - 4. 一旦找到 JavaScript 设置，您就有两个选择。要在 Chrome 中启用 JavaScript，只需点击显示“允许网站运行 JavaScript
