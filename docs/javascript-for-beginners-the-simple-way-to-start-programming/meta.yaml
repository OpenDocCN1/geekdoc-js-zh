    (Do not allow any sites to run JavaScript)”的选项来禁用它。


    在 Chrome 中无需点击“确定”或“保存”，因为您的选项会自动保存到浏览器中。事实上，您可以通过刷新正在查看的网站来立即测试您的新更改。如果页面丢失所有横幅和功能，则
    JavaScript 可能已被禁用。如果页面运行正常，但在在此之前一直不正常，说明您已重新启用了 JavaScript。


