- img_proc: true
  md: 'We''ve already learned how to validate string values either contain a certain
    substring or are equal to a certain value with a regular expression. However,
    for our HTML form, we probably don''t want to require our customers to enter an
    exact date. It''s more likely that we want them to enter any date, as long as
    it meets certain format restrictions. To start with, let''s look at modifying
    the RegExp so that any three letters can be entered (not just ''MAR''). Let''s
    also require that these letters be entered in uppercase. Here''s how this rule
    looks when added to our regular expression.


    ```

    ^[A-Z]{3}-16-1981$/

    ```


    All we''ve replaced "MAR" with [A-Z]{3} which says that any letter between A and
    Z can be entered 3 times. Let''s look at a few variations of the character matching
    rules to learn about some other ways that we can match patterns of characters.


    The rule above only allows  uppercase characters. What if you wanted to allow
    3 characters that could be uppercase or lowercase (i.e. case-sensitive)? Here''s
    how that rule would look in a regular expression.


    ```

    ^[A-Za-z]{3}-16-1981$/

    ```


    Next, let''s modify our rule to allow 3 or more characters. The {3} quantifier
    says that exactly 3 characters must be entered for the month. We can allow 3 or
    more characters by changing this quantifier to {3,}.


    ```

    ^[A-Za-z]{3,}-16-1981$/

    ```


    We want to allow one or more characters, we can simply use the plus+ quantifier.


    ```

    ^[A-Za-z]+-16-1981$/

    ```


    changes'
