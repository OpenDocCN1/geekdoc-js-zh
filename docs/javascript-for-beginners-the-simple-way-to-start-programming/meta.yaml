- img_proc: true
  md: 'For those who don''t know, the windows registry is a vast database in which
    all programs that you use on your system, including Windows itself, store a huge
    volume of data. So whenever you make change to the Control Panel settings, file
    associations, system policies, or install new software, the changes reflect in
    the registry. So the registry actually monitors how your system behaves, and unless
    you keep windows registry clean by using Registry Cleaner tool regularly, you
    will not get away from JavaScript error messages.


    # DIFFERENT TYPES OF JAVASCRIPT ERRORS


