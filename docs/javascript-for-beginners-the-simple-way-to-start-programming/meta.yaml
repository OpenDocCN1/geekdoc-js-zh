  md: '# CHAPTER ONE


    # WHAT IS JAVASCRIPT?


    Many of us have often seen a pop up come on our screen which says we need to run
    Java or update JavaScript. Most of the people get confused between these two and
    wonder what the difference between Java and JavaScript is.


    What is the purpose of JavaScript?


    JavaScript is normally used to create interactive web pages. JavaScript will run
    on your visitor''s system and you will not be required to download it continuously
    on the website you are visiting. As a result, the entire user experience will
    be faster and smoother. If you are a visitor to a site, you will notice that JavaScript
    is normally used to create quizzes and polls and anything else that will encourage
    visitor interaction. The main aim of using this program is to create an interaction
    between the site and the visitor and create an engagement that is not limited
    to just visiting the site.


    How is JavaScript different from Java?


    Java is a computer programming language that is used to create applications that
    need to be run in a virtual machine or browser. It allows programmers to write
    computer instructions in English instead of the numeric code that is normally
    used. JavaScript is just an object-oriented programming language code which can
    only be run on a web browser.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# What is required to run JavaScript?


    If you use one of the major browsers like IE, Firefox or Chrome, you will not
    need anything special to run JavaScript. All these browsers will have the support
    built into them. However, this will work only if your user has a browser that
    supports JavaScript and it has JavaScript enabled. If it is, then the JavaScript
    will run automatically when someone visits the site.


    One may not have to take up any kind of training to run JavaScript. This code
    is prewritten and will be easily available as a plugin. The JavaScript will run
    automatically if the user''s browser has JavaScript support and it is enabled.


    # What are the requirements to write JavaScript?


    There are no special codes to create JavaScript. This is because it is an interpreted
    language. Notepad or any other similar plain text editor can be used to create
    the language.


    # Can designers use HTML instead of JavaScript?


    HTML may not be used instead of JavaScript. Both these programming languages are
    completely different and have different functions, features, and capabilities.
    While HTML is a markup language and is designed to create static web page content,
    JavaScript is a programming language that can perform dynamic tasks. It can be
    used again and again on different pages of a site. This can be done by externalizing
    and placing it in separate files and linking a JavaScript file to the HTML code
    of the'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'particular page. Hence, JavaScript can be added to many pages by adding the
    correct tags on each of the pages.


    # Static v Dynamic


    JavaScript can do more than HTML because HTML is static, but JavaScript is dynamic,
    which means that it can react to viewer actions, such as clicking or rolling the
    mouse over an object. Javascript are often called "behaviors." A behavior is made
    up of a viewer "event" and a response or "action" by the programming. You can
    program a behavior to happen when a viewer clicks, or you can program it to happen
    when the viewer double clicks - that is the "event." When the "event" happens,
    the programming responds by showing something, like a drop-down menu, or by doing
    something, like playing a sound. With JavaScript, your site is "dynamic" because
    it responds to your viewer regular hyperlinks!


    # Client-side programming v Server-side programming


    JavaScript is a "client-side" programming language. Client-side means that the
    program code is sent to your computer with the rest of the web page code (usually
    HTML); then, your browser reads the code and does what it says. That that on many
    sites with JavaScript, you can look at the programming code right along with the
    HTML by going to Edit -> View Source in your browser. You can usually tell if
    the code has JavaScript in it because the head tag will have a like that says
    script language="JavaScript". That is a good way to look at some working scripts.
    (Some websites hide their JavaScript coding.)


    # JavaScript and Browsers'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'JavaScript is frequently used to do simple programming tasks because web viewers
    can turn JavaScript off on their computer, which means that all your hard programming
    work doesn''t function when they view your site. JavaScript may be turned off
    for security, and there have been browsers that have JavaScript disabled as a
    default setting. Instead, we use JavaScript to enhance the functionality of a
    web page. For example, if you completely rely on JavaScript to validate your online
    forms, you have a security hole. If a viewer''s JavaScript is turned off, it will
    by-pass your validation. So, you may also use a "server-side" programming language
    to double check the input.


    Newer browsers generally have newer versions of JavaScript, which means there
    are more programming options. Some old browsers can''t read JavaScript, or they
    can only read limited amounts of JavaScript. A browser that is JavaScript enabled
    can read some version of JavaScript.


    # ADVANTAGES AND DISADVANTAGES OF JAVASCRIPT


    This part discusses the good and the bad points of using JavaScript in your website
    designs. It points out the areas where JavaScript excels as a web-based programming
    language and also describes situations where its use can actually detract from
    the performance of a website.


    First of all, JavaScript is a browser-based programming language that actually
    runs client side. This means that any code that you write in JavaScript is delivered
    along with your web pages and the scripts that you write actually run from within
    the users'' browser rather than directly on the server that is serving the web
    page. There are situations where JavaScript is an excellent solution for implementing
    neat features in a web design but there are also situations where using JavaScript
    can hurt the performance of your website.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# JavaScript for Web Design - The Advantages


    JavaScript is an excellent solution to implement validating input forms on the
    client side. This means that if a user forgets to enter his name in a form, for
    instance a JavaScript validation function can popup a message to let him know
    about the omission. This is a far better solution than having a server-side validation
    routine handle the error because the server does not have to do any additional
    processing. An asp or php routine could be written to achieve the same task but
    the JavaScript would not allow the form to be submitted unless it was completed
    properly in the first place, a much more robust solution!


    Another area where JavaScript excels is the creation of dynamic effects such as
    rollover images and scripted slideshows, where its use has become commonplace.
    Because JavaScript runs inside the client''s browser it can be used to change
    the appearance of the user''s screen after the page has been sent by the server.
    This allows it to create some very impressive dynamic image effects.


    # JavaScript for Web Design - The Disadvantages


    One of the major drawbacks to using JavaScript is that it tends to severely bloat
    web pages. JavaScript code can quickly add up to hundreds or thousands of lines
    of code if you are it to anything remotely interesting. That said the problem
    of large chunks of JavaScript code is easily solved by storing the JavaScript
    code off into separate JavaScript source files that have a .js extension. This
    cleans up your web page code because the JavaScript code is stored separately
    to the HTML page itself, leaving a much cleaner and more readable web page.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Because of JavaScript''s tendency to bloat web pages, it can be very detrimental
    to the search engine friendliness of your website. This is because when a search
    engine arrives at your site looking for quality content and keywords to determine
    what your page is all about, the last thing it wants to see is hundreds of lines
    of JavaScript code. Again, this problem is easily solved by neatly storing JavaScript
    code away in script files with a .js extension and linking to the script file
    in your HTML documents.


    JavaScript is a feature rich and useful browser-based script if used properly
    can achieve some great effects and improve the experience for the end user. There
    are drawbacks to its use in that it tends to bloat web pages. The key thing to
    remember is to get the best of both worlds by using JavaScript code in external
    script files. That way the code is separated from your content so you get all
    the benefit of JavaScript functionality but without the adverse effects of the
    associated code bloating.


    # THE BENEFITS OF JAVASCRIPT


    For the beginner, the words JavaScript and HTML are just terms that he/she has
    probably heard of. So, prescribing that some of these beginners are reading this
    part, let''s start with the definition of these words. HTML stands for HyperTextMarkup
    Language which is, "the tags used to structure web pages so that a browser can
    display it in a way that is also influenced by the browser''s design and the user''s
    preferences for font, style, etc."


    Meanwhile, JavaScript is "a scripting programming language most commonly used
    to add interactive features and webpages."'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Basically, HTML tags create what you put into your page and JavaScript allows
    you to manipulate what you put into your web page. Just imagine a web page that
    has only HTML on it. It would just look like a plain written document. You wouldn''t
    even be able to go to the next page. But if you use JavaScript on your web page,
    you would be able to move things around.


    So, what are the benefits of using JavaScript in HTML code?


    +   1. JavaScript will improve visual displays. As mentioned earlier, if a web
    page will be plain HTML only, it would just be a page full of text. You would
    not be able to move around, and you won''t even be able to go to the next page.


    +   2. JavaScript will allow many page effects Some page effects that JavaScript
    allows are:


    +   - User''s time on page

    - Popups and tooltips

    - Collapsing text

    - Page timeout

    - Color changes and fades

    - Fontsizing and fades

    - Ultimate fader

    - Embedded audio

    - Print page/element

    - Scrolling banners

    - Flying text

    - News scroller

    - Automated popups

    - Image transitions

    - Toggle buttons'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'JavaScript will add user interactivity


    3. The special effects that are added to the web page will make it more interactive.
    The user/visitor of your website will want to keep exploring within the website.


    4. JavaScript will provide seamless integration with user plug-ins


    JavaScript not only provides access to HTML objects, it also gives access to browser
