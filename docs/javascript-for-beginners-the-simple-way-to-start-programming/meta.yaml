    # INTRODUCTION


    Javascript is a client-side programming language whose processing engine is embedded
    in web browsers like Internet Explorer, Netscape, Firefox, etc. This enables the
    processing engine to read and interpret web pages that contain the javascript
    code when browsing.


    Javascript first made an appearance in 1995, although by that time it was known
    as Livescript. This name was later changed to javascript.


    Javascript was invented to add more exciting features to HTML pages. HTML on its
    own on is very dull and it cannot do much besides display a webpage. Javascript
    programming, on the other hand, can provide a host of exciting features like perform
    calculations, allows the user to interact with webpages, perform form validations,
    manipulate elements on a webpage, provide excellent visual effects, enables dynamic
    functions and so much more.


    All of this provides the user to the site with an enhanced user experience. Because
    javascript is a client-side language, all of these features are available in real
    time without the browser having to refer to the server all the time. This prevents
    time delays and increases user satisfaction.


    Let''s take a closer look at the great things you can do with javascript programming:


    ### Perform calculations


    Javascript can be used to perform simple to advanced mathematical calculations.
    This is especially useful if you want your users to interact with your site by
    inputting some information that requires some sort of calculation and displaying
    the relevant content based on result. For example, javascript can calculate a
    loan repayment and display the appropriate result if a user enters a required
    loan amount on the site. Furthermore, javascript can also tell date and time,
    time a certain activity and perform intricate date and time calculations.


    ### User interaction


    The javascript on the webpage can take interaction from a user and perform a certain
    function by way events. Some of the most popular events are:


    - onblur

    - onchange

    - onclick

    - ondblclick

    - onfocus

    - onkeydown

    - onkeypress

    - onkeyup

    - onload

    - onmousedown

    - onmousemove

    - onmouseout

    - onmouseover

    - onmouseup

    - onselect

    - onsubmit


    ### Perform form validations


    Javascript can validate and check user input to determine whether it conforms
    to a certain requirement. For example, you can check if a field is left empty,
    if an email address is in the proper format, if a zip code is in the proper format,
    etc.


    In most cases, if an error is made by your site visitor, an alert can display
    the appropriate error message to him or her.


    ### Manipulate elements on a webpage


    Javascript allows a user to change content or styles of a webpage upon user interaction
    by way of the aforementioned events. For example, hovering over a certain text
    can make an image appear, text on a submit button can change on submit, etc.


    ### Provide visual effects


    Javascript has a host of ways to provide visual effects to a webpage that other
    server-side programming languages cannot. A typical example of this might be some
    fancy image rollover buttons.


    ### Enables dynamic functions


    Javascript, together with AJAX (asynchronous JavaScript and XML), can be used
    to create dynamic applications. One example of this is to load dynamic content
    onto a webpage without refreshing the page.


    # CHAPTER ONE


    # WHAT IS JAVASCRIPT?


    Many of us have often seen a pop up come on our screen which says we need to run
    Java or update JavaScript. Most of the people get confused between these two and
    wonder what the difference between Java and JavaScript is.


    ### What is the purpose of JavaScript?


    JavaScript is normally used to create interactive web pages. JavaScript will run
    on your visitor''s system and you will not be required to download it continuously
    on the website you are visiting. As a result, the entire user experience will
    be faster and smoother. If you are a visitor to a site, you will notice that JavaScript
    is normally used to create quizzes and polls and anything else that will encourage
    interaction. The main aim of using this program is to create an interaction between
    the site and the visitor and create engagement that is not limited to just visiting
    the site.


    ### How is JavaScript different from Java?


    Java is a computer programming language that is used to create applications that
    need to be run in a virtual machine or browser. It allows programmers to write
    computer instructions in English instead of the numeric code that is normally
    used. JavaScript is just an object-oriented programming language code which can
    only be run on a browser.


    ### What is required to run JavaScript?


    If you use one of the major browsers like IE, Firefox or Chrome, you will not
    need anything special to run JavaScript. All these browsers will have the support
    built into them. However, this will work only if your user has a browser that
    supports JavaScript and it has JavaScript enabled. If it is, then the JavaScript
    will run automatically when someone visits the site.


    One may not have to take up any kind of training to run JavaScript. This code
    is prewritten and will be easily available as a plugin. The JavaScript will run
    automatically if the user''s browser has JavaScript support and it is enabled.


    ### What are the requirements to write JavaScript?


    There are no special codes to create JavaScript. This is because it is an interpreted
    language. Notepad or any other similar plain text editor can be used to create
    the language.


    ### Can designers use HTML instead of JavaScript?


    HTML may not be used instead of JavaScript. Both these programming languages are
    completely different and have different functions, features, and capabilities.
    While HTML is a markup language and is designed to create static web page content,
    JavaScript is a programming language that can perform dynamic tasks. It can be
    used again and again on different pages of a site. This can be done by externalizing
    and placing it in separate files and linking a JavaScript file to the HTML code
    of the'
