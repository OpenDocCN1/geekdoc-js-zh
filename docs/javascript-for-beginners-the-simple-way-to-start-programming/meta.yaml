    UI toolkit- Swing - which can be integrated seamlessly into the Android applications.
    Also, a wide variety of plug-ins provided by Eclipse SDK make it easier for developers
    to build robust Android apps without putting extra time and effort. However, NetBeans
    also provides several features and tools to simplify Android development.


    ### Source Code Formatting

    Both Java IDEs have the capability to automatically format the source code of
    an application written in Java. But many programmers find the Java code formatter
    provided by Eclipse to be more efficient than the code formatting options provided
    by NetBeans. While using Eclipse, the programmers can invoke the Java code formatter
    directly by using the shortcut C-S-F. Hence, they can format the Java code in
    a flexible and efficient way.


    On the whole, both NetBeans and Eclipse are open source and cross-platform Java
    IDEs. But Eclipse is supported by IBM, whereas NetBeans is supported by Oracle.
    Each IDE provides several innovative features and tools to simplify and speed
    up Java application development. But the developers must evaluate the pros and
    cons of each IDE according to the specific needs of each project.


    ## JAVASCRIPT AND AJAX


    JavaScript is client-side scripting language. When you open a web page your browser
    first downloads all necessary files from the server to display that page correctly.
    Those necessary files are HTML, CSS, Images, Videos, etc and the JavaScript files.
    After completing download the browser displays that page and any script linked
    with it will run.


    Ajax technology, user inputs and other data are sent to the server through JavaScript.
    JavaScript creates XMLHttpRequest to connect with the server, submit data to it,
    and to request a response from the server. When response comes, a JavaScript event
    fires and the function associated with that event is then executed. So in Ajax
    technology, JavaScript is only used to transfer data between client side and the
    server while the main program, i.e. data processing is executed at the server
    end, in PHP or any server-side language.


    As JavaScript runs from the client computer its execution time is very short,
    almost instantaneous. Viewers can run JavaScript without being connected with
    the server as well. But in Ajax, viewers must be connected to the server. Here
    execution time is much longer which depends on their internet connection speed,
    server hardware and number of bytes to be transferred between client side and
    server side.


    In terms of server security, JavaScript is absolutely safe since it doesn''t transfer
    any user input from client side to the server. But in Ajax, you have to take special
    care to prevent any malicious data from the bad users.


    In JavaScript, you can''t hide your source code. Users can easily read your source
    code from source view which is running on their computer. But in Ajax data processing
    takes place at the server end and so user can''t see the program source code.


    In Ajax, you can support your program with your server database.


    For a long program, if you use JavaScript to implement it, the size of your web
    page will be larger. So it will take longer time to download which is a bad SEO
    feature. But in Ajax you can run long program, processing several thousands of
    data from a database, still, your page size keeps small.


    Since all browsers do not strictly follow any particular standard so it is not
    easy to write a browser-independent JavaScript program.'
