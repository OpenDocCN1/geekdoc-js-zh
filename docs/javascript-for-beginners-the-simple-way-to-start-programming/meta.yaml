    surfing. So why do we get errors in the first place JavaScript is what makes up
    a website so when we get JavaScript errors maybe be a problem with the JavaScript
    codes in a certain web page.


    So there are two types of JavaScript errors that you have to be familiar with:


    +   1. Syntax error. Means there is a typo or perhaps a character missing in the
    code which is why the error occurred. This error appears while the page is loading.


    +   2. Runtime error. This occurs when a specified object is not found or when
    the script is not able to complete the instructions. This error appears when the
    affected code is running.


    The error message appears in the form of a small icon which you can click to further
    check the error message. So how do you fix the JavaScript error?'
