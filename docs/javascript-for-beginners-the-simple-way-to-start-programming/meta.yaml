    特定的页面。因此，通过在每个页面上添加正确的标签，可以将 JavaScript 添加到许多页面中。


    ## 静态与动态


    JavaScript 的功能比 HTML 更强大，因为 HTML 是静态的，而 JavaScript 是动态的，这意味着它可以对查看者的操作做出反应，例如点击或在对象上滚动鼠标。JavaScript
    通常被称为“行为”（behaviors）。一个行为由观众的“事件”（event）和程序的响应或“动作”（action）组成。你可以编写程序在观众点击时触发某种行为，也可以编写程序在观众双击时触发——这就是所谓的“事件”。当“事件”发生时，程序会通过显示某些内容（如下拉菜单）或执行某些操作（如播放声音）来做出响应。通过
    JavaScript，你的网站是“动态的”，因为它能对观众点击的普通超链接做出响应！


    ## 客户端编程对比 服务端编程


    JavaScript 是一种“客户端”编程语言。客户端意味着程序代码会与网页的其他代码（通常是 HTML）一起发送到你的计算机；然后，你的浏览器会读取代码并执行其指令。在许多带有
    JavaScript 的网站上，你可以通过进入浏览器的“编辑 -> 查看源代码”直接与 HTML 一起查看编程代码。你通常可以判断代码中是否包含 JavaScript，因为
    `head` 标签中会有一个显示 `language="JavaScript"` 的标签。这是查看某些运行脚本的好方法。（有些网站会隐藏它们的 JavaScript
    代码。）


    ## JavaScript 与浏览器


    JavaScript 经常用于执行简单的编程任务，因为网页查看者可以在电脑上关闭 JavaScript，这意味着当他们查看你的网站时，你所有复杂的编程工作都无法运行。出于安全考虑，可能会关闭
    JavaScript，有些浏览器的默认设置禁用了 JavaScript。相反，我们使用 JavaScript 来增强网页的功能。例如，如果你完全依赖 JavaScript
    来验证在线表单，就会留有安全漏洞。如果观众的 JavaScript 被关闭，它将绕过你的验证。因此，你可能还会使用“服务端”编程语言来双检输入。


    较新的浏览器通常拥有较版本的 JavaScript，这意味着有更多的编程选项。一些旧浏览器无法读取 JavaScript，或者只能读取有限数量的 JavaScript。启用
    JavaScript 的浏览器可以读取某些版本的 JavaScript。


    ## JavaScript 在网页设计中的优缺点


    这部分讨论了在网站设计中使用 JavaScript 的优点和缺点。它指出了 JavaScript 作为基于 Web 的编程语言的领域，同时也描述了使用它实际上可能会损害网站性能的情况。


    首先，JavaScript 是一种基于浏览器的编程语言，它实际上在客户端运行。这意味着你用 JavaScript 编写的任何代码都会随你的网页一起交付，而你编写的脚本实际上运行在用户的浏览器内部，而不是直接运行在提供网页的服务器上。在某些情况下，JavaScript
    是实现网页设计整洁功能的极佳解决方案，但在某些情况下，使用 JavaScript 可能会损害你网站的性能。


    ## 网页设计中的 JavaScript - 优点


    JavaScript 是在客户端实现表单验证的极佳解决方案。这意味着如果用户忘记在表单中输入姓名（例如），JavaScript 验证函数可以弹出一个消息让他们知道漏掉了内容。这比使用服务端验证程序来处理错误要好得多，因为服务器不需要进行任何额外的处理。可以编写一个
    asp 或 php 程序来实现相同的任务，但 JavaScript 会在表单从一开始没有正确完成之前就不允许其提交，这是一种要稳健得多的解决方案！


    JavaScript 另一个表现优色的领域是创建动态效果，例如滚鼠标悬停图像和脚本幻灯片，这些功能的使用已变得非常普遍。因为 JavaScript 运行在客户端浏览器内部，它可以用于在服务器发送页面后更改屏幕的外观。这允许它创建一些非常令人印象深刻的动态图像效果。


    ## 网页设计中的 JavaScript - 缺点


    使用 JavaScript 的主要缺点之一是它倾向于使网页严重臃肿。如果你将其用于任何稍微有趣的功能，JavaScript 代码可能会迅速累积到数百或数千行代码。尽管如此，大段
    JavaScript 代码的问题可以通过将 JavaScript 代码存储在具有 `.js` 扩展的单独 JavaScript 源文件中来轻松解决。这清理了你的网页代码，因为
    JavaScript 代码与 HTML 页面本身分开存储，留下了更整洁、更易读的网页。


    由于 JavaScript 有网页臃肿的倾向，它对你网站的搜索引擎友好性可能非常不利。这是因为当搜索引擎访问你的网站并寻找优质内容和关键词以确定你页面的主题时，它最不想看到的就是几百行
    JavaScript 代码。同样，这个问题可以通过将 JavaScript 代码整齐地存储在带有 `.js` 扩展的脚本文件中，并在 HTML 文档中链接到该文件来轻松解决。


    JavaScript 是一种功能丰富且实用的浏览器脚本，如果使用得当，可以实现一些很棒的效果并提高用户的体验。它的使用也有缺点，即它倾向于使网页臃肿。要记住的关键点是在外部脚本文件中使用
    JavaScript 代码来兼顾两者。这样，代码就与你的内容分离，你就可以获得 JavaScript 功能的所有好处，而不会产生相关代码臃肿的负面影响。


    ## JavaScript 的好处


    对于初学者来说，JavaScript 和 HTML 这些词只是他/她可能听过的术语。假设这些初学者正在阅读这一部分，让我们从这些词的定义开始吧。HTML 代表超文本标记语言（HyperText
    Markup Language），它是“用于结构化网页的标签，以便浏览器可以显示它”。


    同时，JavaScript 是“一种常用于为网页添加交互脚本语言”。


    基本上，HTML 标签创建你放入页面中的内容，而 JavaScript 允许你操作这些内容。


    那么，在 HTML 代码中使用 JavaScript 有什么好处？


    1. JavaScript 将改进视觉显示。正如前面提到的，如果网页只有纯 HTML，它将只是一页文本。你将无法移动物体，也无法进入下一页。


    2. JavaScript 将允许许多页面效果 JavaScript 允许的一些效果：


    - 页面停留时间

    - 弹出窗口和提示

    - 折叠文本

    - 页面超时

    - 颜色变化和淡变

    - 字体大小变化和淡变

    - 终极淡变

    - 嵌入音频

    - 打印页面/元素

    - 滚动横幅

    - 飞行文字

    - 新闻滚动

    - 自动弹出

    - 图像切换

    - 切换按钮


    3. JavaScript 将增加用户交互性 添加的特殊效果将网页更具交互性。你网站的用户会想要在网站内继续探索。


    4. JavaScript 将提供用户插件的无缝集成 JavaScript 不仅提供了 HTML 对象的访问，还提供了对浏览器和平台特定对象（如浏览器插件
    Adobe Acrobat、Media Player）的访问。

    '
