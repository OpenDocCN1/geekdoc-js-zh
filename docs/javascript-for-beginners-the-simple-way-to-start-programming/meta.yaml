- md: "## CHAPTER TWO\n\n## THE DIFFERENCE BETWEEN JAVASCRIPT AND OTHER CODING LANGUAGES\n\
    \n## DIFFERENCES BETWEEN JQUERY AND JAVASCRIPT\n\nAs a hugely popular client-side\
    \ scripting language, JavaScript does not need anymore introduction. In addition\
    \ to being used as part of web browsers, JavaScript also controls the web browsers,\
    \ effectuates user interaction, facilitates asynchronous communication, and delivers\
    \ customized content to users. So most web developers use JavaScript to reduce\
    \ the time and effort required for building large or complex websites. The web\
    \ developers also have the option to use several JavaScript frameworks to effectuate\
    \ and speed up web development.\n\njQuery is a widely used cross-platform JavaScript\
    \ library. Despite being open source, jQuery is easy to use, fast and concise.\
    \ The API provide by jQuery works seamlessly on major web browsers. Also, the\
    \ feature-rich JavaScript library makes it easier for web developers to manipulate\
    \ HTML documents, handle events, create animations, select DOM elements, and build\
    \ AJAX application. At the same time, jQuery can also be used for creating a variety\
    \ of plug-ins by taking advantages of the JavaScript library.\n\nThus, the modern\
    \ web developers have option to use JavaScript and jQuery either independently\
    \ or side by side. However, it is also important for the programmers to understand\
    \ some of the major differences between JavaScript and jQuery.\n\n## Four IMPORTANT\
    \ DIFFERENCES BETWEEN JAVASCRIPT AND JQUERY\n\n### 1. Programming language and\
    \ library\n\nAs a dynamic programming language, JavaScript supports object-oriented,\
    \ structured, functional and imperative programming styles. The first-class functions\
    \ and dynamic typing also make JavaScript categorized as a prototype-based scripting\
    \ language. On the other hand, jQuery is a JavaScript library.\n\nThe framework\
    \ makes it easier for developers to accomplish a number of common tasks like HTML\
    \ document manipulation, event handling, animation, DOM element selection and\
    \ AJAX application development.\n\n### 2. Scripting time\n\nWhen a web developer\
    \ decides to use straight JavaScript, he has to write additional code to accomplish\
    \ several tasks. He further to put extra time and effort for debugging and fixing\
    \ browser compatibility issues. But jQuery allows developers to take advantage\
    \ of existing scripting. So they can use the scripting existing in jQuery to accomplish\
    \ a number of tasks without writing long lines of code. Thus, jQuery makes it\
    \ easier for web programmers to save the time and efforts required for building\
    \ modern websites and internet applications.\n\n### 3. Simplification of client-side\
    \ scripting\n\nAs a client-side scripting language, JavaScript makes it easier\
    \ for developers to effectuate user interaction and deliver customized content\
    \ to users. But the developers have to write long lines of code to write a web\
    \ application in straight JavaScript. So web developers often use JavaScript development\
    \ frameworks to accomplish the scripting functions easily and quickly. As a cross-platform\
    \ JavaScript library, jQuery comes with features to perform the common scripting\
    \ functionalities. So developers can use the library to simplify the client-side\
    \ scripting of HTML. The plug-ins, widgets, and UIs provided by the framework\
    \ help web programmers to drastically reduce development time.\n\n### 4. Performance\n\
    \nBoth JavaScript and jQuery run quite faster on the latest web browsers and computers.\
    \ But the speed of both JavaScript and jQuery is impacted by use of older web\
    \ browsers. As JavaScript can access the DOM faster than jQuery, the programmers\
    \ can easily curtail the overheads associated with the library. However, jQuery\
    \ makes it easier for developers to build high-performing websites and internet\
    \ application by availed functionality independent of web browsers.\n\nOn the\
    \ whole, JavaScript is a dynamic and feature-rich programming language, whereas\
    \ jQuery is a library of JavaScript code.\n\nThe proficient JavaScript developers\
    \ can easily use jQuery to accomplish a variety of tasks without writing long\
    \ lines of code. However, they can still use jQuery without being proficient in\
    \ the popular client-side scripting language. That is why; the developers need\
    \ to choose JavaScript or jQuery according to specific needs of the project.\n\
    \n## WHAT IS HYPERTEXT MARKUP LANGUAGE (HTML)?\n\nHTML is a formatting language\
    \ used by web browsers to dynamically format webpages. Originally evolving from\
    \ the Standard Generalized Markup Language (SGML) it follows many of the markup\
    \ conventions used in the publishing industry. HTML is not a programming language\
    \ as such, but rather a markup language; it was never intended to control all\
    \ aspects of document layout, more to format the content of a page. The syntax\
    \ it uses is to wrap tags identified by keywords in angle brackets each end like\
    \ <title> which can then be combined to control the way page appears in a browser\
    \ window. An early snag was that in the 1990s different browsers interpreted this\
    \ code in different ways. The worldwide web consortium (W3C) was formed in an\
    \ attempt to introduce a degree of standardization.\n\n## W3C\n\nThe W3C produces\
    \ \"recommendations\" for web designers to adhere to, and its Web Accessibility\
    \ Initiative provides guidelines for making web pages accessible to everyone,\
    \ not just those using graphical browsers. It recommends several conventions to\
    \ ensure an easy migration between HTML and XHTML.\n\n## XHTML\n\nOne of the problems\
    \ with the World Wide Web is that it is sometimes difficult to find what you're\
    \ looking for, so the W3C introduced XML as a partial solution. XHTML is a separate\
    \ language that began as a combination of HTML 4 and extensible markup language\
    \ (XML). The syntax of HTML allows many shortcuts that XHTML does not, and one\
    \ of the most noticeable differences is that in XHTML all tags must be closed.\n\
    \n## Browsers\n\nA development that has occurred in the last few years is the\
    \ separation of content and layout by the use of cascading stylesheets (CSS).\
    \ Different browsers still display content differently which can be infuriating\
    \ when by fixing one anomaly you end another. Full browser compliance is still\
    \ a pipe dream, although the gap between browser variations has narrowed considerably.\
    \ Emerging technologies browser such as Apple's iPad present new frustrations;\
    \ it does not support Flash, but Apple's Safari browser (adapted by Google to\
    \ become their Chrome browser) is one of the first to fully support the HTML5\
    \ video standard. Unfortunately, just as different browsers update their rendering\
    \ engines at different speeds, browser users update their software even less predictably,\
    \ and some don't update at all.\n\n CSS\n\nThe W3C has developed style languages\
