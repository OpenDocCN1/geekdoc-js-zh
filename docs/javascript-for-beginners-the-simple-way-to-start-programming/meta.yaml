    ## 第二章


    ## JAVASCRIPT 与其他编码语言的区别


    ## JQUERY 与 JAVASCRIPT 的区别


    作为一种极其受欢迎的客户端脚本语言，JavaScript 不再需要额外介绍。除了作为网页浏览器的一部分外，JavaScript 还可以控制网页浏览器、实现用户交互、促进异步通信，并向用户交付定制化内容。因此，大多数
    Web 开发者使用 JavaScript 来减少构建大型或复杂网站所需的时间精力。Web 开发者还可以选择使用几个 JavaScript 框架来实现并加速
    Web 开发。


    jQuery 是一个广泛使用的跨平台 JavaScript 库。尽管是开源的，但 jQuery 非常易用、快速且简洁。jQuery 提供的 API 在主流网页浏览器中无缝运行。此外，功能丰富的
    JavaScript 库让 Web 开发者更容易操作 HTML 文档、处理事件、创建动画、选择 DOM 元素以及构建 AJAX 应用。同时，jQuery 还可以利用
    JavaScript 库的优势创建各种插件。


    因此，现代 Web 开发者可以选择独立或并行使用 JavaScript 和 jQuery。然而，对于程序员来说，理解 JavaScript 和 jQuery
    之间的一些主要区别也很重要。


    ## JAVASCRIPT 与 JQUERY 的四个重要区别


    ### 1. 编程语言与库


    作为一种动态编程语言，JavaScript 支持面向对象、结构化、函数式和命令式编程风格。一类函数和动态类型也使 JavaScript 被基于基于原型的脚本语言。另一方面，jQuery
    是一个 JavaScript 库。


    框架让开发者更容易完成许多常见任务，如 HTML 文档操作、事件处理、动画、DOM 元素选择和 AJAX 应用开发。


    ### 2. 脚本时间


    当 Web 开发者决定使用原生 JavaScript 时，他必须编写额外的代码来完成若干任务。他还需要在调试和修复浏览器兼容性问题上花费额外的时间和精力。但
    jQuery 允许开发者利用现有的脚本。因此，他们可以使用 jQuery 中现有的脚本完成许多任务，而无需编写长行代码。因此，jQuery 让 Web 程序员更容易节省构建现代网站和互联网应用程序所需的时间精力。


    ### 3. 客户端脚本的简化


    作为一种客户端脚本语言，JavaScript 让开发者更容易实现用户交互并向用户交付定制化内容。但开发者必须编写长行代码才能用原生 JavaScript 写
    Web 应用。因此，Web 开发者经常使用 JavaScript 开发框架来简单快速地完成脚本功能。作为一个跨平台的 JavaScript 库，jQuery
    带有执行常用脚本功能的特性。因此，开发者可以使用该库来简化 HTML 的客户端脚本。框架提供的插件、组件和 UI 帮助 Web 程序员大幅缩短开发时间。


    ### 4. 性能


    JavaScript 和 jQuery 在最新的网页浏览器和计算机上运行都相当快。但 JavaScript 和 jQuery 的速度都会受到旧版网页器的的影响。由于
    JavaScript 访问 DOM 比 jQuery 快，程序员可以轻松地减少与库相关的开销。然而，jQuery 通过独立于网页浏览器的功能，让开发者更容易构建高性能的网站和互联网应用程序。


    总而言之，JavaScript 是一种动态且功能丰富的编程语言，而 jQuery 是一个 JavaScript 代码库。


    精通 JavaScript 的开发者可以轻松地使用 jQuery 完成各种任务，而无需编写长行代码。然而，即使不精通这种流行的客户端脚本语言，他们仍然可以使用
    jQuery。这就是为什么；开发者需要根据项目的特定需求选择 JavaScript 或 jQuery。


    ## 什么是超文本标记语言 (HTML)？


    HTML 是网页浏览器用于动态格式化网页的格式化语言。它最初演变自标准通用标记语言 (SGML)，遵循了出版行业使用的许多标记规范。HTML 本身并不是一种编程语言，而是一种标记语言；它的初衷从未为了控制文档布局的所有方面，而是为了格式化页面内容。它使用的语法是使用尖括号包裹由关键词标识的标签，例如
    `<title>`，这些标签可以组合起来来控制页面在浏览器窗口中的显示方式。早期的一个障碍是 20 世纪 90 代的不同浏览器以不同的方式解释这些代码。万维网联盟
    (W3C) 的形成是为了引入某种程度的标准。


    ## W3C


    W3C 为网页设计师制作了需要遵循的“建议”，其 Web 可访问性倡议（Web Accessibility Initiative）为让所有人（而不只是使用图形浏览器的人）访问网页提供了指南。它推荐了多种规范以确保
    HTML 和 XHTML 之间易于迁移。


    ## XHTML


    万维网的问题之一是有时很难找到你要的内容，因此 W3C 引入了 XML 作为部分解决方案。XHTML 是一种独立的语言，它是 HTML 4 和可扩展标记语言
    (XML) 的结合。HTML 的语法允许许多 XHTML 不具备快捷方法，最明显的区别之一是在 XHTML 中所有标签必须闭合。


    ## 浏览器


    过去几年发生的一个进展是通过使用层叠样式表 (CSS) 实现内容与布局的分离。不同的浏览器显示内容的方式仍然不同，当你在修复一个异常却遇到另一个异常时，这可能是令人恼火的。完全符合标准仍然是一个梦想，尽管浏览器差异之间的差距已大幅缩小。新兴技术的浏览器（如
    Apple 的 iPad）带来了新的挫败；它不支持 Flash，但 Apple 的 Safari 浏览器（被 Google 适配为他们的 Chrome 浏览器）是第一个完全支持
    HTML5 视频标准的浏览器之一。遗憾的是，不同浏览器更新渲染引擎的速度不同，浏览器用户更新软件的速度更不可预测，有些根本不更新。


    ## CSS


    W3C 开发了如 CSS 和 XSL 等样式语言来帮助标准化呈现。层叠样式表 (CSS) 为 HTML 页面提供了一种简单的方法，允许设计师控制视觉和听觉特征；例如字体、边距、行间距、边框、颜色、层等。启发性的设计师
    Shea 和 Holzschlag 创建了 CSS Zen Garden —— 一个致力于展示功能性、实用 CSS 的网站，而不是只有 2% 浏览用户可见的尖端技巧。


    ## JAVA IDE 比较：NETBEANS 与 ECLIPSE


