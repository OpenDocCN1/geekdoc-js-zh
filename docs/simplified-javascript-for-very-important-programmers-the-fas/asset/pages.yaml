    title


    h1


    8


    |


    |


    9


    textNode


    textNode


    In this tree representation, the Document is the root node, and it has


    two children: the html node and the doctype node. The html node


    is the container for all the other elements on the web page, and it


    has two children: the head and the body. The head node contains


    the title element, which in turn has a text node child with the


    text “My Simple Web Page”. The body node has one child: the h1


    element. The h1 element contains a text node child with the text


    “This is awesome!”'
