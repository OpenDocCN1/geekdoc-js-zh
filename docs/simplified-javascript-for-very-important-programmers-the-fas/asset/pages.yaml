    3


    *// code to be executed if expression matches value1*


    4


    **break**


    5


    **case** value2:


    6


    *// code to be executed if expression matches value2*


    7


    **break**


    8


    **default**:


    9


    *// code to be executed if expression does not match*


    10


    *// any of the cases*


    11


    }


    In the above syntax,


    • The expression is the value that will be compared against the


    cases.


    • value1 and value2 are the possible values the expression can


    match.


    • The break keyword is used to stop the execution of the switch


    statement after the code inside a case is executed. If there’s no


    break keyword in a case, the switch statement will continue


    to run until it reaches a break keyword or until it reaches the


    end.


    • The default case is executed if the expression does not match


    any case.'
