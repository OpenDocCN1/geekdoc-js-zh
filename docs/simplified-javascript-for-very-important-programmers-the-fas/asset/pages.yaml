    4


    *// Thu Dec 25 2025 00:00:00 GMT+0100*


    The month is specified as a number, where 0 is January, 1 is


    February, and so on. The day is specified as a number, where 1 is the


    first day of the month. The hour, minute, second, and millisecond


    are specified as numbers, where 0 is the first hour, minute, second,


    or millisecond of the day.


    **Getting the Date and Time**


    **Components**


    Once we have the Date object, we can extract several components


    of the date and time using its properties and methods. The Date


    object has the following properties:


    • getFullYear() - returns the year as a four-digit number


    • getMonth() - returns the month as a number


    • getDate() - returns the day of the month as a number


    • getDay() - returns the day of the week as a number


    • getHours() - returns the hour as a number


    • getMinutes() - returns the minutes as a number


    • getSeconds() - returns the seconds as a number


    • getMilliseconds() - returns the milliseconds as a number


    • getTime() - returns the number of milliseconds since January


    1, 1970\. January 1, 1970 is used as the reference point for


    the Date object in JavaScript because it was the starting


    point of the Unix epoch, which is a standardized system for


    representing dates and times in computer systems.


    Let’s try an example with the Date object we created earlier:'
