    **The Switch statement**


    The switch statement is a way to simplify the process of writing


    multiple if-else statements. It’s a type of conditional statement that


    allows you to compare a value against multiple cases. The switch


    statement compares an expression to a list of possible values, and


    if the expression matches one of the values, the code inside its


    corresponding case will be executed. Here’s what the syntax looks


    like:


    1


