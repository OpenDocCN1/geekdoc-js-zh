  md: 'How to include JavaScript in an HTML file


    156


    **The** **async** **attribute**


    The async attribute tells the browser to load the JavaScript file asyn-


    chronously, which means that the browser can continue loading the


    HTML file while the JavaScript file is loading. This can be useful


    for large JavaScript files that take a long time to load. However,


    it can also cause problems if the JavaScript code depends on the


    HTML content being loaded first because, once the JavaScript file


    is loaded, the browser will execute the JavaScript code even if the


    HTML content hasn’t finished loading yet. Here’s how we would


    use the async attribute in a <script> element:


    1


    <**script** src="./js-in-html.js" async></**script**>


    **The** **defer** **attribute**


    The defer attribute tells the browser to load the JavaScript file


    asynchronously, but to execute the JavaScript code after the HTML


    file has been loaded. Unlike the async attribute, the defer attribute


    ensures that the JavaScript code is executed after the HTML content


    is loaded, avoiding any potential problems with the JavaScript code


    depending on the HTML content being loaded first. Here’s how we


    would use the defer attribute:


    1


    <**script** src="./js-in-html.js" defer></**script**>


    It’s important to note that the async and defer attributes are not


    supported by all browsers, particularly older ones. However, they


    are a good option for controlling how your JavaScript code is loaded


    and executed.'
