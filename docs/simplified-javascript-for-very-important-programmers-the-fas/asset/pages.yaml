    9


    alert(''Hey everyone!'')


    10


    </**script**>


    11


    </**body**>


    12


    </**html**>


    In the example above, we’ve added an alert() method call to


    the HTML file. When the page loads, the browser will run the


    JavaScript code and display the alert box with the message “Hey


    everyone!”. You can see this in action by opening the HTML file in


    your browser.


    While inline JavaScript can be a quick solution for small projects


    or adding simple functionality, it’s not the best option for larger


    projects. If we want to include a lot of JavaScript code in our HTML


    file, it can become difficult to read and maintain. It’s also not very


    efficient, as the browser will have to parse the JavaScript code every


    time the page loads. For these reasons, it’s usually better to create


    a separate JavaScript file and link to it in the HTML file.


    **Creating a separate JavaScript file**


    **(external JavaScript)**


    The most common way to include JavaScript in an HTML file is


    by creating a separate JavaScript file with the .js extension and


    linking to it in the HTML file. Let’s look at an example. In the'
