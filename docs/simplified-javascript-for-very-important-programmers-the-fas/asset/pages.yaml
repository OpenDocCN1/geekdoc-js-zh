    216


    **Setting the Date and Time**


    **Components**


    Once we have extracted the date and time components from a Date


    object, we can manipulate the components to get a new Date object


    representing a different date and time. One way to do this is to set


    the individual components of the date and time using the methods


    and properties of the Date object. The Date object has the following


    methods for setting the date and time components:


    • setFullYear(year) - sets the year


    • setMonth(month) - sets the month


    • setDate(date) - sets the day of the month


    • setHours(hours) - sets the hour


    • setMinutes(minutes) - sets the minutes


    • setSeconds(seconds) - sets the seconds


    • setMilliseconds(milliseconds) - sets the milliseconds


    Let’s try an example with the christmas Date object:


    1


    **let** christmas = **new** Date(


    2


    ''December 25, 2025 23:15:30 GMT-0500''


    3


    )


    4


    5


    christmas.setFullYear(2026)


    6


    7


    console.log(christmas)


    8


    *// output: Sat Dec 26 2026 05:15:30 GMT+0100*


    **Formatting Dates and Times**


    The Date object has several methods for formatting the date and


    time into a string, including:'
