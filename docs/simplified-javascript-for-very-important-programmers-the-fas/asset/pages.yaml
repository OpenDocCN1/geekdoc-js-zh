  md: '**Working with Date and**


    **Time**


    JavaScript provides several ways to work with dates and times,


    allowing us to create, manipulate, and format them. The built-


    in Date constructor is the most common way to achieve this. It


    provides a way to create a date object, get and set the date and


    time components, and format the date and time into a string.


    **Creating a Date Object**


    We can create a new Date object by calling the Date constructor


    with no arguments:


    1


    **let** currentDate = **new** Date()


    2


    3


    console.log(currentDate)


    4


    *// output: Sat May 19 2025 08:59:03 GMT+0100*


    To create a Date object with a specific date and time, we can pass a


    string to the Date constructor:


    1


    **let** christmas = **new** Date(''December 25, 2025'')


    2


    3


    console.log(christmas)


    4


    *// output: Thu Dec 25 2025 00:00:00 GMT+0100*


    The Date constructor accepts several formats for the date and time


    string, including the following:'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'Working with Date and Time


    213


    • December 25, 2025


    • December 25 2025


    • Dec 25 2025


    • 12/25/2025


    • 12-25-2025


    • 2025-12-25


    • 2025/12/25


    • 2025.12.25


    • 2025 12 25


    • 2025 Dec 25


    • 2025 December 25


    We can specify the time in the string as well:


    1


    **let** christmas = **new** Date(''December 25, 2025 23:15:30'')


    2


    3


    console.log(christmas)


    4


    *// Thu Dec 25 2025 23:15:30 GMT+0100*


    If the time is not specified, it will default to midnight. The time


    format is hours:minutes:seconds, and the hours are specified in a


    24-hour clock. We can also add a time zone to the string:


    1


    **let** christmas = **new** Date(


    2


    ''December 25, 2025 23:15:30 GMT-0500''


    3


    )


    4


    5


    console.log(christmas)


    6


    *// Fri Dec 26 2025 05:15:30 GMT+0100 (West Africa Standar\*


    7


    d Time)


    The Date constructor can also accept multiple arguments, which


    represent the year, month, day, hour, minute, second, and millisec-


    ond, respectively:'
  merge: -1
