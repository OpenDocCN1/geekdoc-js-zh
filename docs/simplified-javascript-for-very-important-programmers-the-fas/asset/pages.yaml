  md: '**How to include**


    **JavaScript in an HTML file**


    So far, we’ve practiced JavaScript by running it in the console. But


    as we begin to work with web pages and the DOM, we’ll need to


    include JavaScript in our HTML files. We can do this by using the


    <script> tag to write our JavaScript code directly in the HTML file,


    or by creating a separate JavaScript file with the .js extension and


    linking to it in the HTML file. Let’s look at both of these options.


    **Writing JavaScript in the HTML file**


    **(inline JavaScript)**


    The simplest way to include JavaScript in an HTML file is by adding


    the code directly to the HTML document using the <script> tag.


    This is usually referred to as inline JavaScript. We can include the


    JavaScript code in the head or body section of the document, but it’s


    usually best to put it in the body section so that the HTML content is


    loaded before the JavaScript code. Let’s look at an example. Create


    a new HTML file called js-in-html.html and add the following


    code:'
  merge: -1
