    \ DOM 中添加和删除元素、在 LocalStorage 中存储数据以及使用事件监听器响应用户操作方面获得了实战经验。这为构建更复杂的 Web 应用奠定了良好的基础。为了测试你的知识，请尝试再次构建这个应用，但这次要靠自己独立完成。你还可以为应用添加更多功能，例如清除所有任务的按钮，或者将所有任务标记为已完成的按钮。如果你遇到困难，可以随时查阅这本指南。\n\
    \n## 异步 JavaScript\n\n### 什么是异步 JavaScript？\n\n异步 JavaScript 是现代 Web 开发中的一个核心概念。在传统的\
    \ JavaScript 中，代码是同步方式执行的，这意味着每行代码都按顺序线性执行（从上到下）。这对于简单的程序来说没有问题，但在处理耗时任务（如发送网络请求、执行复杂计算或访问数据库或文件系统）时就会出现问题。如果你同步执行这些任务，负责渲染用户界面和处理用户交互的主线程将被阻塞，在任务完成之前无法进行任何其他操作，导致程序看起来像死机或对用户无响应。\n\
    \n这就是异步 JavaScript 的用场，它允许你在不阻塞主 UI（用户界面）线程的情况下执行耗时任务，这样你的应用程序就可以继续运行并响应用户输入。“异步”一词指的是一种允许同时执行多个任务互不阻塞的编程模式。这对于现代\
    \ Web 应用是必要的，因为它们通常需要同时执行多个任务，例如发送网络请求、在后台加载数据以及播放音频或视频。\n\n### Promises（承诺）\n\
    \n在 JavaScript 中管理异步代码的一种方法是使用 Promise。Promise 是代表异步操作最终完成或失败的对象。你可以将其想象成未来某个可用值的的占位符。Promise\
    \ 处于三种可能的状态之一：\n\n- **pending**（等待中）：Promise 的初始状态，表示值尚不可用。\n- **fulfilled**（已履行）：Promise\
    \ 的表示操作成功的状态，意味着值已变为可用。\n- **rejected**（已拒绝）：Promise 的表示操作失败的状态，意味着发生了错误。\n\n\
    Promise 是使用 `Promise` 构造函数创建的，该构造函数接受一个函数作为参数。这个函数被称为 **executor function**（执行器函数），负责启动异步操作。执行器函数接收两个函数作为参数：`resolve`\
    \ 和 `reject`。当异步操作成功时调用 `resolve` 函数，当操作失败时调用 `reject` 函数。`resolve` 和 `reject`\
    \ 函数用于改变 Promise 的状态，并可以带有一个值传递给注册到该 Promise 的处理器。这是一个在延迟 5 秒后解析字符串值“Data retrieved\
    \ successfully”的 Promise 示例：\n\n```javascript\nlet myPromise = new Promise((resolve,\
    \ reject) => {\n  setTimeout(() => {\n    resolve('Data retrieved successfully')\n\
    \  }, 5000)\n})\n```\n\n当你运行这段代码时，`myPromise` 变量将被赋值一个 `pending` 状态的 Promise 对象。在执行器函数调用\
    \ `resolve` 函数之前，Promise 将一直保持 `pending` 状态，该调用将把 Promise 的状态改为 `fulfilled`，并将字符串值传递给注册到该\
    \ Promise 的任何处理器。在这种情况下，Promise 将在5秒后变为履行。如果你在 Promise 履行之前向控制台打印 `myPromise`\
    \ 变量，你会发现它仍然处于 `pending` 状态：\n\n```javascript\nconsole.log(myPromise)\n// 输出:\
    \ Promise { <pending> }\n```\n\n如果你想处理 Promise 的结果，可以使用它的 `then` 方法注册处理器。`then`\
    \ 方法接受一个函数作为参数，该函数在 Promise 履行时被调用。该函数将可以传递给 `resolve` 函数的值。以下是如何为 Promise 注册处理器的示例：\n\
    \n```javascript\nmyPromise.then((value) => {\n  console.log(value)\n})\n```\n\n\
    这应该在5秒后向控制台输出字符串值“Data retrieved successfully”。注意，Promise 在 `pending` 状态下不会停止其他任务的执行。所以如果我们在创建\
    \ Promise 后向控制台打印其他内容，它将立即打印，而无需等待 Promise 履行；当 Promise 履行后，它的值将打印到控制台。要尝试这一点，请运行以下代码：\n\
    \n```javascript\nlet myPromise = new Promise((resolve, reject) => {\n  setTimeout(()\
    \ => {\n    resolve('Data retrieved successfully')\n  }, 5000)\n})\n\nmyPromise.then((value)\
    \ => {\n  console.log(value)\n})\n\nconsole.log('Hey there!')\n```\n\n输出结果：\n\
    Hey there!\nData retrieved successfully\n\n如果在 Promise 中不是调用 `resolve` 函数而是调用\
    \ `reject` 函数，那么 Promise 将被拒绝，注册到 Promise 的任何错误处理器将接收错误值。我们可以使用 `catch` 方法注册错误处理器。`catch`\
    \ 方法接受一个函数作为参数，该函数在 Promise 被拒绝时被调用。该函数将可以访问传递给 `reject` 函数的值。处理 Promise 时，同时处理履行和拒绝状态是非常重要的，这样当发生错误时你可以做出恰当响应。这是一个在\
    \ 5 秒后被拒绝的 Promise 示例，以及一个将错误记录到控制台的错误处理器：\n\n"
