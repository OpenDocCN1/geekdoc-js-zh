    switch statement checks if the value of month is ‘January’, and if it is, it logs
    the string ‘Today is a weekday in January!’ to the console and uses the break
    statement to exit the switch statement. If the value of month is not ‘January’,
    it logs the string ‘Today is a weekday!’ to the console.


