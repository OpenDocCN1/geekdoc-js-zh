    ## Basic JavaScript operators


    29


    In the third example, we used double quotes (“ “) to enclose the string. This
    is because the string (I’ll) contains a single quote which will cause an error
    if we also use single quotes (’ ’) to it.


    ### Assignment operators


    We use assignment operators to assign a value to a variable. You’ve already seen
    the assignment operator (=) in action. There are also compound assignment operators
    in JavaScript, which include: +=, -=, *=, /=, and %=. These compound operators
    perform an operation with a variable and an operand and then assign the result
    to the variable. For example, if you have a variable named “age” with a value
    of 10, and you want to increment it by 5, you can use the += operator like this:


    ```javascript

    let age = 10

    age += 5; // Output: 15

    ```


    Using the += operator is the same as writing `age = age + 5`, which reassigns
    the age variable to 10 + 5. Let’s try some more examples with the other compound
    assignment operators:


    ```javascript

    age = 10

    age *= 5; // Output: 50

    age /= 5; // Output: 10

    age -= 5; // Output: 5

    age %= 5; // Output: 0

    ```


    Compound assignment operators are a great way to make your code less repetitive.


    ### Comparison operators


    We use comparison operators to compare two values and return a boolean value (true
    or false) based on the comparison result. Here are the comparison operators and
    their meanings:


    - == : equal to

    - != : not equal to

    - > : greater than

    - < : less than

    - >= : greater than or equal to

    - <= : less than or equal to

    - === : strict equal to (compares both the value and the type of the operands)

    - !== : strict not equal to (compares both the value and the type of the operands)


    Let’s try some examples:


    ```javascript

    console.log(10 == 10); // Output: true

    console.log(10 == 5); // Output: false

    console.log(10 != 5); // Output: true

    console.log(10 > 5); // Output: true

    console.log(10 < 5); // Output: false

    console.log(10 >= 10); // Output: true

    console.log(10 >= 11); // false: 10 is neither greater than nor equal to 11

    console.log(10 <= 10); // true: 10 is equal to 10

    console.log(10 <= 9); // false: 10 is neither less than nor equal to 9

    console.log(10 === 10); // true: 10 is equal to 10 and they are both numbers

    console.log(10 === ''10''); // false: number 10 is not the same as string 10

    console.log(10 !== 9); // true: 10 is not equal to 9

    console.log(10 !== ''10''); // true: number 10 is not the same as string 10

    ```


    ### Logical operators


    In JavaScript, we use logical operators to perform logical operations like AND
    (&&), OR (||), and NOT (!). Here are some examples:


    ```javascript

    console.log(true && true); // Output: true

    console.log(true && false); // Output: false

    console.log(false && true); // Output: false

    console.log(false && false); // Output: false

    console.log(true || true); // Output: true

    console.log(true || false); // Output: true

    console.log(false || true); // Output: true

    console.log(false || false); // Output: false

    console.log(!true); // Output: false

    console.log(!false); // Output: true

    ```


    The AND operator returns true if both operands are true, and false if either operand
    is false. So if you run `console.log(10 > 5 && 7 < 10)` on your console, you’ll
    get true as the output because 10 is greater than 5, and 7 is less than 10. But
    if you run `console.log(10 > 5 && 7 > 10)` on your console, you’ll get false as
    the output because 10 is greater than 5, but 7 is not less than 10. When using
    the OR operator, it returns true if at least one operand is true, and false if
    both operands are false. So if you run `console.log(10 > 5 || 7 > 10)` on your
    console, you’ll get true as the output because 10 is greater than 5. The NOT operator
    inverts the boolean value of its operand. So if you run `console.log(!(10 > 5))`
    on your console, you’ll get false as the output because 10 is greater than 5.

    '
