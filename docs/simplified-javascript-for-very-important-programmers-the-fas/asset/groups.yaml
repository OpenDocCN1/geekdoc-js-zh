- md: "\n## Higher Order Functions (HOFs) and Callbacks\n\ntwo arguments: the function\
    \ to be executed and the number of milliseconds to wait before executing the function.\
    \ Let’s display a message after 5 seconds:\n\n```javascript\nconst displayMessage\
    \ = () => {\n  console.log('Hello, world!')\n}\n\nsetTimeout(displayMessage, 5000)\n\
    // Output: 2 (Wait, the original text says \"Output: 2\" and \"Output: Hello world!\"\
    )\n// Output: Hello world!\n```\n\n1 second is a thousand milliseconds and 5 seconds\
    \ is 5000 milliseconds. The setTimeout() method will wait for 5 seconds before\
    \ executing the displayMessage() function. The setTimeout() method also returns\
    \ a number that represents the ID of the timer immediately after it is called.\
    \ We can use this ID to cancel the timer.\n\nFirst, let’s assign the setTimeout\
    \ method to a variable:\n\n```javascript\nconst displayMessage = () => {\n  console.log('Hello,\
    \ world!')\n}\n\nconst timerId = setTimeout(displayMessage, 5000)\n\nconsole.log(timerId)\n\
    // Output: 4 (can be any number)\n// Output: Hello world!\n```\n\nThis will still\
    \ display the message after 5 seconds, but now we have the ID of the timer in\
    \ the timerId variable. Let’s use it to cancel the timer before it executes the\
    \ displayMessage() function. We’ll use the clearTimeout() method to do so. The\
    \ clearTimeout() method takes the ID of the timer as an argument and cancels the\
    \ timer:\n\n```javascript\nconst displayMessage = () => {\n  console.log('Hello,\
    \ world!')\n}\n\nconst timerId = setTimeout(displayMessage, 5000)\n\nclearTimeout(timerId)\n\
    ```\n\nThe clearTimeout() method will cancel the timer before it executes the\
    \ displayMessage() function. So when you run this code, the displayMessage() function\
    \ will not be executed.\n\n### setInterval()\n\nThe setInterval() method allows\
    \ us to schedule the execution of a function at regular intervals. For example,\
    \ if we want to display our message every 5 seconds, we can use the setInterval()\
    \ method to do so. The setInterval() method takes two arguments: the function\
    \ to be executed and the number of milliseconds to wait before executing the function\
    \ again. We can directly call the method or assign it to a variable. Like the\
    \ setTimeout() method, the setInterval() method also returns a number that represents\
    \ the ID of the timer. Let’s use the setInterval() method to run the displayMessage()\
    \ function every 1 second:\n\n```javascript\nconst displayMessage = () => {\n\
    \  console.log('Hello, world!')\n}\n\nconst interVal = setInterval(displayMessage,\
    \ 1000)\n```\n\nThis will display the message “Hello world!” every 1 second. We\
    \ can use the clearInterval() method to cancel the timer. The clearInterval()\
    \ method takes the ID of the timer as an argument and cancels the timer:\n\n```javascript\n\
    clearInterval(interVal)\n```\n\nRunning the clearInterval() method will stop the\
    \ displayMessage() function from being executed every second.\n\n## JavaScript\
    \ Objects\n\nImagine you have a car and want to keep track of its color, make,\
    \ model and mileage. You could create a variable for each of these properties:\n\
    \n```javascript\nconst carColor = 'red'\nconst carMake = 'Tesla'\nconst carModel\
    \ = 'Cybertruck'\nconst carMileage = 30\n```\n\nBut what if you had 10 cars? You\
    \ would have to create 4 variables for each car, giving you 40 variables in total.\
    \ And what if you wanted to add a new property? Like the type of fuel the car\
    \ uses? You would have to create ten new variables. As you keep creating variables,\
    \ it’ll become harder to know which ones are related to each other or which cars\
    \ they belong to.\n\nWith JavaScript objects, you can group related data in a\
    \ single variable. So instead of creating four different variables for your first\
    \ car, you can create one that stores all four properties. And if you want to\
    \ add a new property, you can do so without creating a new variable. Here’s what\
    \ using an object to store your car’s data would look like:\n\n```javascript\n\
    const myCar = {\n  color: 'red',\n  make: 'Tesla',\n  model: 'Cybertruck',\n \
    \ mileage: 30,\n}\n```\n\nIn the example above, we created a variable named myCar\
    \ and assigned it an object. You’ll recognize objects by the curly braces surrounding\
    \ them, followed by a list of key-value pairs. Each key-value pair is a property\
    \ of the object. In our example, the first property is the color of the car. Its\
    \ key is color and value, \"red\". Unlike a variable declaration, the key and\
    \ value are separated by a colon, and a comma separates each property.\n\nTo access\
    \ a property of an object, you can use dot notation or bracket notation. Dot notation\
    \ is the most common way to access properties; first, you type the name of the\
    \ object, followed by a period, and then the name of the property. Here’s how\
    \ you would use dot notation to access the value of the color property:\n\n```javascript\n\
    console.log(myCar.color)\n// output: \"red\"\n```\n\nAnd here’s how you would\
    \ use bracket notation:\n\n```javascript\nconsole.log(myCar['color'])\n```\n\n\
    Bracket notation is useful when you want to access a property whose name is stored\
    \ in a variable. For example, let’s create a variable named propertyName and assign\
    \ it the string \"color\":\n\n```javascript\nconst propertyName = 'color'\n\n\
    console.log(myCar[propertyName])\n// output: \"red\"\n```\n\n### Rules and Guidelines\
    \ for creating objects\n\nWhen creating objects, there are a few things to keep\
    \ in mind:\n\n- **Property names of an object must be unique**\nMultiple properties\
    \ can have the same value, but if you try to create a property with the same name\
    \ as an existing property, the new property will override the old one. Also, if\
    \ an object has multiple properties with the same name, only the last one will\
    \ be used.\n\n```javascript\nconst myFavoriteBook = {\n  title: 'The Hobbit',\n\
    \  title: 'The Lord of the Rings',\n}\n\nconsole.log(myFavoriteBook.title)\n//\
    \ Output: \"The Lord of the Rings\"\n```\n\n- **Property names must be strings**\n\
    When you use a non-string as a property name, it will be converted to a string.\
    \ For example, the following code will create a property named \"1\":\n\n```javascript\n\
    const myFavoriteDress = {\n  1: \"green\"\n}\n\nconsole.log(myFavoriteDress.1)\n\
    // Output: SyntaxError\n```\n\nTrying to access the key 1 using dot notation will\
    \ result in a syntax error because the number 1 is not a valid key, and has been\
    \ converted to the string \"1\". In this case, you can use bracket notation to\
    \ access it:\n\n```javascript\nconsole.log(myFavoriteDress['1'])\n// Output: \"\
    value1\"\n```\n\n- **invalid JavaScript identifiers must be enclosed in quotes**\n\
    Object keys can be any string, including an empty string. However, if the key\
    \ is a string that is not a valid JavaScript identifier, it must be enclosed in\
    \ quotes. For example, adding spaces to a key will result in a syntax error:\n\
    \n```javascript\nconst myFavoriteMeal = {\n  plate type: \"ceramic\"\n}\n// Output:\
    \ SyntaxError\n```\n\nBut enclosing the key in quotes will make it a valid property\
    \ name:\n\n```javascript\nconst myFavoriteMeal = {\n  \"plate type\": \"ceramic\"\
    ,\n  \"\": \"valid but not recommended\"\n}\n\nconsole.log(myFavoriteMeal[\"plate\
    \ type\"])\n// Output: \"ceramic\"\n\nconsole.log(myFavoriteMeal[\"\"])\n// Output:\
    \ \"valid but not recommended\"\n```\n\nNotice that we used bracket notation to\
    \ access the property. You can’t use the dot notation when the key contains spaces\
    \ or other invalid characters:\n\n```javascript\nconst myFavoriteCar = {\n  'engine*type':\
    \ 'electric',\n}\n\nconsole.log(myFavoriteCar.engine * type)\n// Output: NaN\n\
    \nconsole.log(myFavoriteCar['engine*type'])\n// Output: \"electric\"\n```\n\n\
    - **Property names are case-sensitive**\nRemember that JavaScript is a case-sensitive\
    \ language. This also applies to object properties. For example, the following\
    \ code will create two properties, one named \"title\" and one named \"Title\"\
    :\n\n```javascript\nconst myFavoriteMovie = {\n  title: 'Titanic',\n  Title: 'The\
    \ Lion King',\n}\n\nconsole.log(myFavoriteMovie.title)\n// Output: \"Titanic\"\
    \n\nconsole.log(myFavoriteMovie.Title)\n// Output: \"The Lion King\"\n```\n\n\
    Like with variables, it’s a good practice to use camelCase for property names\
    \ to make your code style consistent and easy to read.\n"
  mdcn: "\n\n## 高阶函数 (HOFs) 和回调函数\n\n两个参数：要执行的函数以及在执行该函数之前等待的毫秒数。让我们在5秒后显示一条消息：\n\n\
    ```javascript\nconst displayMessage = () => {\n  console.log('Hello, world!')\n\
    }\n\nsetTimeout(displayMessage, 5000)\n// 输出: 2 (等待，原文写的是 \"Output: 2\" 和 \"Output:\
    \ Hello world!\")\n// 输出: Hello world!\n```\n\n1 秒是 1000 毫秒，5 秒是 5000 毫秒。`setTimeout()`\
    \ 方法将在等待 5 秒后执行 `displayMessage()` 函数。`setTimeout()` 方法在调用后还会立即返回一个表示定时器 ID 的数字。我们可以使用这个\
    \ ID 来取消定时器。\n\n首先，我们将 `setTimeout` 方法赋值给变量：\n\n```javascript\nconst displayMessage\
    \ = () => {\n  console.log('Hello, world!')\n}\n\nconst timerId = setTimeout(displayMessage,\
    \ 5000)\n\nconsole.log(timerId)\n// 输出: 4 (可以是任意数字)\n// 输出: Hello world!\n```\n\
    \n这仍然会在 5 秒后显示消息，但现在我们在 `timerId` 变量中拥有了定时器的 ID。让我们在执行 `displayMessage()` 函数之前使用它取消定时器。我们将使用\
    \ `clearTimeout()` 方法来实现。`clearTimeout()` 方法接收定时器的 ID 作为参数并取消定时器：\n\n```javascript\n\
    const displayMessage = () => {\n  console.log('Hello, world!')\n}\n\nconst timerId\
    \ = setTimeout(displayMessage, 5000)\n\nclearTimeout(timerId)\n```\n\n`clearTimeout()`\
    \ 方法将在 `displayMessage()` 函数执行之前取消定时器。因此，当你运行这段代码时，`displayMessage()` 函数将不会执行。\n\
    \n### setInterval()\n\n`setInterval()` 方法允许我们按固定间隔调度函数的执行。例如，如果我们想每 5 秒显示一次消息，可以使用\
    \ `setInterval()` 方法。`setInterval()` 方法接收两个参数：要执行的函数以及在再次执行该函数之前等待的毫秒数。我们可以直接调用该方法，也可以将其赋值给变量。与\
    \ `setTimeout()` 方法一样，`setInterval()` 方法也会返回一个表示定时器 ID 的数字。让我们使用 `setInterval()`\
    \ 方法每 1 秒运行一次 `displayMessage()` 函数：\n\n```javascript\nconst displayMessage =\
    \ () => {\n  console.log('Hello, world!')\n}\n\nconst interVal = setInterval(displayMessage,\
    \ 1000)\n```\n\n这将每隔 1 秒显示一次“Hello world!”。我们可以使用 `clearInterval()` 方法来取消定时器。`clearInterval()`\
    \ 方法接收定时器的 ID 作为参数并取消定时器：\n\n```javascript\nclearInterval(interVal)\n```\n\n运行\
    \ `clearInterval()` 方法将停止 `displayMessage()` 函数每秒执行一次。\n\n## JavaScript 对象\n\n\
    假设你有一辆汽车，想要跟踪它的颜色、品牌、型号和里程数。你可以为这些属性各创建一个变量：\n\n```javascript\nconst carColor\
    \ = 'red'\nconst carMake = 'Tesla'\nconst carModel = 'Cybertruck'\nconst carMileage\
    \ = 30\n```\n\n但如果你有 10 辆车呢？你必须为每辆车创建 4 个变量，总共 40 个变量。如果你想添加一个新属性呢？比如汽车使用的燃料类型？你必须创建\
    \ 10 个新变量。随着你不断创建变量，将知道哪些变量是相互相关的或者它们属于哪辆车将变得越来越困难。\n\n通过 JavaScript 对象，你可以将相关数据分组在单个变量中。因此，与其为第一辆车创建四个不同的变量，不如创建一个存储所有四个属性的变量。如果你想添加新属性，可以在不创建新变量的情况下完成。这里使用对象存储汽车数据看起来像是所示：\n\
    \n```javascript\nconst myCar = {\n  color: 'red',\n  make: 'Tesla',\n  model:\
    \ 'Cybertruck',\n  mileage: 30,\n}\n```\n\n在上面的示例中，我们创建了一个名为 `myCar` 的变量并给它赋值了一个对象。你可以通过包裹在周围的大括号来识别对象，后面跟着一个键值对列表。每个键值对都是对象的一个属性。在我们的示例中，第一个属性是汽车的颜色。它的键是\
    \ `color`，值为 \"red\"。与变量声明不同，键和值之间用冒号隔开，每个属性之间用逗号分隔。\n\n要访问对象的属性，可以使用点符号法（dot\
    \ notation）或括号符号法（bracket notation）。点符号法是访问属性的最常用方法；首先，输入对象的名称，后跟一个点，然后是属性的名称。以下是使用点符号法访问\
    \ `color` 属性值的方法：\n\n```javascript\nconsole.log(myCar.color)\n// 输出: \"red\"\n\
    ```\n\n这里是使用括号符号法的方法：\n\n```javascript\nconsole.log(myCar['color'])\n```\n\n当你想要访问一个名称存储在变量中的属性时，括号符号法非常有用。例如，让我们创建一个名为\
    \ `propertyName` 的变量并赋值字符串 \"color\"：\n\n```javascript\nconst propertyName = 'color'\n\
    \nconsole.log(myCar[propertyName])\n// 输出: \"red\"\n```\n\n### 创建对象的规则和指南\n\n\
    在创建对象时，有几点需要注意：\n\n- **对象的属性名必须是唯一的**\n  多个属性可以具有相同的值，但如果你尝试创建一个与现有属性同名的属性，新属性将覆盖旧属性。此外，如果一个对象有多个同名的属性，则只使用最后一个一个。\n\
    \n```javascript\nconst myFavoriteBook = {\n  title: 'The Hobbit',\n  title: 'The\
    \ Lord of the Rings',\n}\n\nconsole.log(myFavoriteBook.title)\n// 输出: \"The Lord\
    \ of the Rings\"\n```\n\n- **属性名必须是字符串**\n  当使用非字符串作为属性名时，它会被转换为字符串。例如，以下代码会创建一个名为\
    \ \"1\" 的属性：\n\n```javascript\nconst myFavoriteDress = {\n  1: \"green\"\n}\n\n\
    console.log(myFavoriteDress.1) // 语法错误\n```\n\n尝试使用点符号法访问键 1 将导致语法错误，因为数字 1 不是合法的键。在这种情况下，你可以使用括号符号法访问它：\n\
    \n```javascript\n// 1: \"green\"\n```\n\n- **无效的 JavaScript 标识符必须包含在引号中**\n对象的键可以是任何字符串，包括空字符串。但是，如果键不是有效的\
    \ JavaScript 标识符，则必须包含在引号中。例如，在键中添加空格会导致语法错误：\n\n```javascript\nconst myFavoriteMeal\
    \ = {\n  plate type: \"ceramic\"\n} // 语法错误\n```\n\n但将键包含在引号中使其成为合法的属性名：\n\n```javascript\n\
    const myFavoriteMeal = {\n  \"plate type\": \"ceramic\",\n  \"\": \"valid but\
    \ not recommended\"\n}\n\nconsole.log(myFavoriteMeal[\"plate type\"]) // 输出: \"\
    ceramic\"\n\nconsole.log(myFavoriteMeal[\"\"]) // 输出: \"valid but not recommended\"\
    \n```\n\n注意到我们使用了括号符号法来访问属性。当键包含空格或其他无效字符时，不能使用点符号法：\n\n```javascript\nconst myFavoriteCar\
    \ = {\n  'engine*type': 'electric',\n}\n\nconsole.log(myFavoriteCar.engine * type)\
    \ // 输出: NaN\n\nconsole.log(myFavoriteCar['engine*type']) // 输出: \"electric\"\n\
    ```\n\n- **属性名大小敏感**\n记住 JavaScript 是一种大小敏感的语言。这同样适用于属性。例如，以下代码会创建两个属性，一个名为 \"\
    title\"，另一个名为 \"Title\"：\n\n```javascript\nconst myFavoriteMovie = {\n  title:\
    \ 'Titanic',\n  Title: 'The Lion King',\n}\n\nconsole.log(myFavoriteMovie.title)\
    \ // 输出: \"Titanic\"\n\nconsole.log(myFavoriteMovie.Title) // 输出: \"The Lion King\"\
    \n```\n\n就像变量一样，在属性名上使用驼峰命名法（camelCase）是一个良好的习惯，可以使你的代码风格保持一致且易于阅读。\n\n"
