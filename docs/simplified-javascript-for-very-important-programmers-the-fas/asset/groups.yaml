    \ `alert()` 方法。\n页面加载时，浏览器将运行 JavaScript 代码并显示带有\n“大家好！”消息的提示框。你可以通过在浏览器中打开\n\
    HTML 文件来查看效果。\n\n虽然内联 JavaScript 可以作为小型项目或添加简单功能的\n解决方案，但它并不是大型项目的最佳选择。如果在 HTML\
