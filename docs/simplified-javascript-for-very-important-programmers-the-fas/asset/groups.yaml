    To resize your browser window, you can open your browser’s


    developer tools and drag the right edge of the page to the left or


    right. You should see the value of the window.innerWidth property


    logged to the console as you resize the window. You can also log


    the value of the window.innerHeight property to the console to see


    the height of the browser window:


