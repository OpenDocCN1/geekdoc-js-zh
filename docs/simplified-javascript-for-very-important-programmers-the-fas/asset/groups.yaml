    When a user loads the page, we want to render any tasks that


    were saved in the browser’s LocalStorage. We’ll start by creating


    a variable named storedTasks that will hold the tasks we’ll get


    from LocalStorage. Since the tasks are stored as a JSON string, we’ll


    use the JSON.parse() method to convert it to a JavaScript object.


    If there are no tasks in LocalStorage, we’ll set the storedTasks


