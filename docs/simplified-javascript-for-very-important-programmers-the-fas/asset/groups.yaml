- md: "\n## Higher Order Functions (HOFs) and Callbacks\n\n```javascript\nconst numbers\
    \ = [1, 2, 3, 4, 5]\n\nconst squaredNumbers = numbers.map(\n  (number) => number\
    \ * number\n)\n\nconsole.log(squaredNumbers)\n// Output: [1, 4, 9, 16, 25]\n```\n\
    \nIn this example, the anonymous function `(number) => number * number)` is passed\
    \ as an argument to the map() function. In the callback function, the number parameter\
    \ represents each element in the numbers array. This can be any name we want,\
    \ but it’s common to use the singular form of the array name.\n\nThe map() function\
    \ applies the callback function to each element in the array and returns a new\
    \ array named squaredNumbers with the square of each element in the original array.\n\
    \nLet’s try another example using the map() function to capitalize each element\
    \ in an array of strings:\n\n```javascript\nconst words = ['this', 'is', 'such',\
    \ 'a', 'great', 'day']\nconst capitalizedWords = words.map((word) =>\n  word.toUpperCase()\n\
    )\n\nconsole.log(capitalizedWords)\n// Output: ['THIS', 'IS', 'SUCH', 'A', 'GREAT',\
    \ 'DAY']\n```\n\nIn this example, we use the map() function to capitalize each\
    \ element in the words array. The map() function does not modify the original\
    \ array, so we have to assign its return value to a new array named capitalizedWords.\n\
    \n## Creating Higher-order functions\n\nWe can create our higher-order functions\
    \ ourselves. All we need to do is add a function parameter or return another function\
    \ when it is called. Here’s an example of a higher-order function that takes a\
    \ callback function as an argument:\n\n```javascript\nconst higherOrderFunction\
    \ = (callback) => {\n  const string = 'HOFs are really cool!'\n  callback(string)\n\
    }\n\nhigherOrderFunction(console.log)\n// Output: 'HOFs are really cool!'\n```\n\
    \nSee that our higherOrderFunction() takes a callback function as an argument,\
    \ then calls that function with the string ‘HOFs are really cool!’. In this case,\
    \ supplying console.log() as an argument to the higherOrderFunction() logs the\
    \ string to the console.\n\nWe can also return a function from another function.\
    \ Here’s an example of a higher-order function that returns a callback function:\n\
    \n```javascript\nconst callMeTwice = () => console.log\n\ncallMeTwice()('Hey,\
    \ this works!')\n// Output: 'Hey, this works!'\n```\n\nIn this example, the callMeTwice()\
    \ function returns the console.log() function. So, when we call callMeTwice(),\
    \ what we get is the console.log() function. So, we’ll have to call the result\
    \ of callMeTwice() to use the console.log() function.\n\nChaining function calls\
    \ like this is known as **currying**. In currying, each function call returns\
    \ another function that can be called again with a different argument. The main\
    \ goal is to simplify the process of passing arguments to a function by breaking\
    \ it down into a series of function calls, each taking a single argument.\n\n\
    ## Built-in HOFs and Array Methods\n\nLet’s explore other built-in higher-order\
    \ functions you can use to manipulate arrays.\n\n### forEach()\n\nThe forEach()\
    \ function is an array method that executes a callback function on each of its\
    \ elements. Unlike the map() function, the forEach() function does not return\
    \ a new array and does not modify the original array either. Instead, it iterates\
    \ through the elements of an array and performs an operation on each of them.\
    \ **To iterate** means to repeat a specific action or set of actions a number\
    \ of times or until a condition is met.\n\nWe can use the forEach() function to\
    \ log each element in an array to the console or perform an action with each of\
    \ them and push the results to a new array. Let’s use the forEach() function to\
    \ log each element in an array to the console:\n\n```javascript\nconst namesOfPeople\
    \ = ['oluchi', 'jude', 'kanye', 'tiwa']\n\nnamesOfPeople.forEach((name) => console.log(name))\n\
    ```\n\nThis will output:\n1. oluchi\n2. jude\n3. kanye\n4. tiwa\n\nNotice that\
    \ the names of people in our array start with lowercase letters. Here’s how we\
    \ can title-case each element in the array and push the results to a new array.\
    \ Title-casing means capitalizing the first letter of each word in a string:\n\
    \n```javascript\nconst titleCasedNames = []\n\nnamesOfPeople.forEach((name) =>\
    \ {\n  const titleCasedName = name[0].toUpperCase() + name.slice(1)\n  titleCasedNames.push(titleCasedName)\n\
    })\n\nconsole.log(titleCasedNames)\n// Output: ['Oluchi', 'Jude', 'Kanye', 'Tiwa']\n\
    ```\n\nIn this example, we use the forEach() function to iterate through the namesOfPeople\
    \ array. For each string in the array, we capitalize its first letter using the\
    \ square bracket notation and the toUpperCase() method. *When working with strings,\
    \ we can access each character in the string using the square bracket notation\
    \ and the index of the character.* The slice() method returns a new string with\
    \ the characters from the index we specify to the end of the string. We then push\
    \ the title-cased name to the titleCasedNames array.\n\n### filter()\n\nThe filter()\
    \ function is another array method we can use to filter out elements that meet\
    \ a condition. For example, if we have an array of countries, we can use the filter()\
    \ function to filter out countries that start with the letter ‘N’:\n\n```javascript\n\
    const countries = [\n  'Nigeria',\n  'UK',\n  'Netherlands',\n  'Canada',\n  'USA',\n\
    \  'Norway',\n]\n\nconst countriesThatStartWithN = countries.filter(\n  (country)\
    \ => country.startsWith('N')\n)\n\nconsole.log(countriesThatStartWithN)\n// Output:\
    \ ['Nigeria', 'Netherlands', 'Norway']\n```\n\nIn JavaScript, every string has\
    \ a startsWith() method that returns true if the string starts with the character\
    \ we specify. In our example, the filter method takes a callback function with\
    \ a parameter named country representing each element in the countries array.\
    \ The callback function returns true if the country starts with the letter ‘N’,\
    \ and the filter() function returns a new array with the elements that meet the\
    \ condition.\n\nWe can also use the square bracket notation or the charAt() method\
    \ to check if a string starts with a character. The charAt() method returns the\
    \ character at the specified index in a string:\n\n```javascript\nconst countriesThatWithU\
    \ = countries.filter(\n  (country) => country.charAt(0) === 'U'\n)\n\nconsole.log(countriesThatWithU)\n\
    // Output: ['UK', 'USA']\n```\n\nWe can use the filter() function to filter out\
    \ elements that don’t meet a condition. Let’s filter out countries that don’t\
    \ start with the letter ‘N’:\n\n```javascript\nconst countriesDontStartWithN =\
    \ countries.filter(\n  (country) => !country.startsWith('N')\n)\n\nconsole.log(countriesDontStartWithN)\n\
    // Output: ['UK', 'Canada', 'USA']\n```\n\nIn this example, we use the logical\
    \ NOT operator (!) to negate the condition so that the filter() function returns\
    \ a new array with elements that don’t meet the condition. When using the filter\
    \ method, it is important to remember that the callback function should return\
    \ a boolean value.\n\n### sort()\n\nThe sort() method is used to sort the elements\
    \ of an array. The sort() method modifies the original array and returns the sorted\
    \ array. For example, if we want to sort an array of numbers, we can use the sort()\
    \ method. By default, the sort() method sorts the elements of an array in ascending\
    \ order:\n\n```javascript\nconst numbers = [7, 4, 3, 1, 5, 2, 8, 6]\n\nnumbers.sort()\n\
    \nconsole.log(numbers)\n// Output: [1, 2, 3, 4, 5, 6, 7, 8]\n```\n\nWe can also\
    \ sort an array of strings:\n\n```javascript\nconst favoriteColors = [\n  'red',\n\
    \  'blue',\n  'green',\n  'yellow',\n  'orange',\n]\n\nfavoriteColors.sort()\n\
    \nconsole.log(favoriteColors)\n// Output: ['blue', 'green', 'orange', 'red', 'yellow']\n\
    ```\n\nSee that blue comes first because it starts with the letter ‘b’ which comes\
