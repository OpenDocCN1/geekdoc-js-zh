    When adding a task to the list, we’ll also add it to the storedTasks


    array, and then use the JSON.stringify() method to convert the


    array back to a JSON string before storing it in LocalStorage


    with the key tasks. This is necessary because LocalStorage only


    supports storing strings. The OR operator (||) will return the


    value of the first operand if it’s truthy, otherwise, it’ll return


    the value of the second operand. In this case, if the value of


    localStorage.getItem(''tasks'') is null, the OR operator will re-


    turn an empty array.


    Next, let’s create a function named renderTasks() that will render


    the tasks we have in LocalStorage to the browser. We’ll use the


