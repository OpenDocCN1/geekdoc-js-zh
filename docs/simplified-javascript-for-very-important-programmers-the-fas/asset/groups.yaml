    element has the same class attribute as the p elements”.


    **Creating DOM Elements**


    The document object has a createElement method that we can use

    to create new elements. The method takes one argument, which is

    the tag name of the element to be created, such as p or div. Let’s

    create a new p element as an example:


    142

    ```javascript

    document.createElement(''p'')

    // Output: <p></p>

    ```


    7. The createElement method returns a new element with the spec-specified tag
    name but does not add it to the DOM. We can use the

    appendChild method to add elements to the DOM. The appendChild

    method takes an element as its argument and adds it as a child of

    the element on which it was called. The new element will be added

    as the last child of the parent element.


    8. Before we add the p element to the DOM, let’s add some text to it.

    We can use the textContent or innerText property to add text to

    an element. We’ll have to assign the new element to a variable so

    that we can easily update its properties:


    ```javascript

