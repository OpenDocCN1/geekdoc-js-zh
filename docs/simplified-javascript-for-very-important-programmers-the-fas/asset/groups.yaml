    \ there is no way to call it elsewhere in our codebase. When this is the case,\
    \ the function is usually an **IIFE (Immediately Invoked Function Expression)**,\
    \ which means that it’ll be invoked immediately after is declared. To achieve\
    \ this, we’ll wrap the function in parenthesis and immediately call it with another\
    \ open-close parenthesis after its declaration:\n\n```javascript\n(function()\
    \ {\n  return \"I'm a function, and I'm anonymous!\";\n})()\n```\n\n### Function\
    \ expression\n\nTo reuse an anonymous function, we have to assign it to a **variable**.\
    \ This way, we can reference it by that name. A way to do this is through **Function\
    \ expression**. Let’s assign our anonymous function to a variable:\n\n```javascript\n\
    const alertUser = function() {\n  return \"I'm anonymous, but with a name!\";\n\
    }\n```\n\nNow, we can invoke (or call) our function the same way we invoked multiplyTwo().\
    \ Since our function has no **parameter**, there’ll be no need to supply an **argument**.\n\
    \n```javascript\nalertUser()\n```\n\n### Multi-line return statements\n\nWhen\
    \ returning an expression in a function, don’t add a new line between return and\
    \ the value. You might be tempted to separate your expression from the return\
    \ statement like this:\n\n```javascript\nfunction multiplyFive(value) {\n  return\n\
    \  value * 5\n}\nCalling the above multiplyFive function will return undefined,\
    \ and this is because our compiler ends the statement after the return keyword,\
    \ making it an empty return. If you want to wrap the return statement across multiple\
    \ lines, you should start your expression on the same line as the return keyword\
    \ or have an opening parenthesis on the same line as the return keyword:\n\n```javascript\n\
    function multiplyFive(value) {\n  return (value * 5)\n}\nconsole.log(multiplyFive(10))\n\
    // output: 50\n```\n\n### Arrow Functions\n\nJavaScript arrow functions, also\
    \ known as “**fat arrow**” or “**lambda**” functions, are a shorthand way to write\
    \ function expressions in JavaScript. They were introduced in **ES6** (the 6th\
    \ major version of JavaScript) and have become popular in modern JavaScript development.\n\
    \nAn arrow function is defined using the “fat arrow” syntax, which is a equals\
    \ sign followed by a greater sign (=>). For example, let’s use the function declaration\
    \ syntax you know to write a function that returns the square of a number, that\
    \ is, the number multiplied by itself:\n\n```javascript\nconst squareNumber =\
    \ function (value) {\n  return value * value\n}\nconsole.log(squareNumber(5))\n\
    // Output: 25\n```\n\nThe equivalent arrow function would look like this:\n\n\
    ```javascript\nconst squareOfNumber = (value) => value * value\n```\n\nSee that\
    \ this is a lot shorter than the function declaration syntax. First, we define\
    \ a variable named squareNumber, then we write our arrow function as its value.\
    \ The arrow function takes a parameter named value and returns its square. Since\
    \ the function body is a single expression, we don’t need to use curly braces.\
    \ We can also omit the return keyword, and when we do so, the function will return\
    \ the value of the expression.\n\nIf an arrow function has only one parameter,\
    \ you can omit the parentheses around the parameter list:\n\n```javascript\nconst\
    \ squareOfNumber = value => value * value\n```\n\nYou can also write arrow functions\
    \ with curly braces, but in this case, you must use the return keyword:\n\n```javascript\n\
    const squareOfNumber = (value) => {\n  return value * value\n}\n```\n\nOne of\
    \ the main benefits of using arrow functions is their conciseness. They are especially\
    \ useful when you need to write a function that takes another function as a parameter.\
    \ When a function is used as a parameter to another function, it is called a **callback\
    \ function**. And the parent function that takes the callback function as a parameter\
    \ is called a **higher order function**. We’ll learn more about these concepts\
    \ as we progress.\n\n### Functions best practices\n\nThe name of a function should\
    \ be descriptive, straight to the point and timeless.\n\nNotice how we named our\
    \ first function multiplyByTwo. This is because its job is to multiply a number\
    \ by two. Doing this will help anyone know what our function does by looking at\
    \ its name.\n\n**Function naming** is an essential part of **function definition**,\
    \ and choosing to disregard this will make your code **non-readable**, **non-maintainable**\
    \ and lead to **reduced efficiency**.\n\nWhen naming your functions, it is essential\
    \ not to use slangs that only a few people would understand or trends that people\
    \ can only relate to at a given time.\n\n*Let your function names be descriptive\
    \ enough, straight to the point and timeless.*\n\n---\n\nA function should have\
    \ only one responsibility.\n\nWhen you define your function, let it have one responsibility\
    \ and do only what its name suggests. This means that from our examples, choosing\
    \ to reverse a word and multiply a number in the same function would not be a\
    \ good idea. Like we did, splitting the two actions into separate functions is\
    \ better. By doing so, you would not only make your code more readable, but you’ll\
    \ also make it easier to test and debug.\n\n**Things to note**\n\n- A **function**\
    \ is a set of statements designed to perform a particular task.\n- During a function\
    \ definition, the names representing the values we intend to supply to the function\
    \ are called parameters.\n- During a function call, the actual values we provide\
    \ to the function are called arguments.\n- We can use up to 255 parameters in\
    \ a function definition.\n- An anonymous function is a function that does not\
    \ have a name, and to reuse an anonymous function, we have to assign it to a variable.\n\
    - An IIFE (Immediately Invoked Function Expression) is a function that is invoked\
    \ immediately after it is declared.\n- A function should have only one responsibility.\n\
    - Function names should be descriptive, straight to the point and timeless.\n"
  mdcn: "\n\n## Functions\n\n让我们尝试给函数提供一个非数字的内容：\n\n```javascript\nconsole.log(multiplyByTwo('this\
    \ is a string'))\n// output: Value must be a number\n```\n\n### 函数参数 (Parameters)\
    \ 与 实参 (Arguments)\n\n当我们调用函数时，我们提供的用来替换其参数的值被称为实参（arguments）。\n\n因此在我们的案例中，数字\
    \ **35** 和字符串 **“this is a string”** 就是我们的函数实参。\n\n- 在函数定义期间，代表我们打算提供给函数的名称称为参数（parameters）。\n\
    - 在函数调用期间，我们提供给函数的实际值被称为实参（arguments）。\n- 我们可以在函数定义中使用最多 255 个参数。\n\n### 关于 return\
    \ 语句（return statement）的更多信息\n\n如果不使用 `return` 语句来告诉函数返回什么，它的默认值将是 `undefined`。\n\
    \n让我们通过创建一个没有 `return` 语句的函数并调用它来测试：\n\n```javascript\nfunction multiplyByTwo(value)\
    \ {\n  const result = value * 2;\n}\nconsole.log(multiplyByTwo(35))\n// output:\
    \ undefined\n```\n\n当我们提供 `return` 关键字但不提供值时，函数默认也会返回 `undefined`。这使得它成为了**空返回（empty\
    \ return）：\n\n```javascript\nfunction multiplyByTwo() {\n  const result = value\
    \ * 2;\n}\nconsole.log(multiplyByTwo(35))\n// output: undefined\n```\n\n### 匿名函数\
    \ (Anonymous functions)\n\n你已经见过如何使用函数声明来定义命名函数。你也可以使用函数声明来定义**匿名函数（anonymous\
    \ functions）**和**立即执行函数表达式（IIFE）**。\n\n**匿名函数**是没有名称的函数；因此被称为“匿名”。由于我们无法通过名称引用上述函数，因此无法在我们的代码库的其他地方调用它。在这种情况下，该函数通常是一个\
    \ **IIFE（立即执行函数表达式）**，这意味着它将在声明后后立即被调用。为了实现这一点，我们将函数封装在括号中，并在其声明后紧跟另一一对括号来立即调用它：\n\
    \n```javascript\n(function() {\n  return \"I'm a function, and I'm anonymous!\"\
    ;\n})()\n```\n\n### 函数表达式 (Function expression)\n\n为了重用匿名函数，我们必须将其赋值给**变量（variable）**。这样我们就可以通过该名称引用它。实现这一方法是通过**函数表达式（Function\
    \ expression）**。让我们将匿名函数赋值给一个变量：\n\n```javascript\nconst alertUser = function()\
    \ {\n  return \"I'm anonymous, but with a name!\"\n}\n```\n\n现在，我们可以像调用 `multiplyTwo()`\
    \ 一样调用（或执行）我们的函数。由于我们的函数没有**参数（parameter）**，因此不需要提供**实参（argument）**。\n\n```javascript\n\
    alertUser()\n```\n\n### 多行 return 语句 (Multi-line return statements)\n\n在函数中返回表达式时，不要在\
    \ `return` 和值之间换行。你可能忍不住将表达式与 `return` 语句分开：\n\n```javascript\nfunction multiplyFive(value)\
    \ {\n  return\n  value * 5\n}\n```\n调用上面的 `multiplyFive` 函数将返回 `undefined`，这是因为我们的编译器在\
    \ `return` 关键字之后结束了语句，使其成为空返回。如果你想让 `return` 语句跨多行，你应该在 `return` 关键字的同一行开始你的表达式，或者在\
    \ `return` 关键字的同一行有一个左左括号：\n\n```javascript\nfunction multiplyFive(value) {\n\
    \  return (value * 5)\n}\nconsole.log(multiplyFive(10))\n// output: 50\n```\n\n\
    ### 箭头函数 (Arrow Functions)\n\nJavaScript 箭头函数，也称为“**胖箭头（fat arrow）**”或“**lambda**”函数，是在\
    \ JavaScript 中编写函数表达式的简写方式。它们是在 **ES6**（JavaScript 的第六个主要版本）中引入的，并已经在现代 JavaScript\
    \ 开发中变得流行。\n\n箭头函数使用“胖箭头”语法定义，即一个等号后跟着一个大于号 (=>)。例如，让我们使用你已知的函数声明语法来编写一个返回数字平方的函数，即该数字乘以其本身：\n\
    \n```javascript\nconst squareNumber = function (value) {\n  return value * value\n\
    }\nconsole.log(squareNumber(5))\n// Output: 25\n```\n\n等价的箭头函数如下：\n\n```javascript\n\
    const squareOfNumber = (value) => value * value\n```\n\n看，这比函数声明语法短得多。首先，我们定义了一个名为\
    \ `squareNumber` 的变量，然后将我们的箭头函数作为它的值。箭头函数接受一个名为 `value` 的参数并返回它的平方。由于函数体是一个单一表达式，我们不需要使用大括号。我们也可以省略\
    \ `return` 关键字，当我们省略它时，函数将返回表达式的值。\n\n如果箭头函数只有一个参数，你可以省略参数列表周围的括号：\n\n```javascript\n\
    const squareOfNumber = value => value * value\n```\n\n你也可以使用大括号编写箭头函数，但在这种情况下，你必须使用\
    \ `return` 关键字：\n\n```javascript\nconst squareOfNumber = (value) => {\n  return\
    \ value * value\n}\n```\n\n使用箭头函数的主要优点之一是它们的简洁性。当你需要编写一个接受另一个函数作为参数的函数时，它们特别有用。当一个函数被作另一个函数的参数时，它被称为**回调函数（callback\
    \ function）**。而接受回调函数作为参数的父函数被称为**高阶函数（higher order function）**。随着学习的进行，我们将学习更多这些概念。\n\
    \n### 函数最佳实践 (Functions best practices)\n\n函数的命名应该是描述性的、直击当的且持久的。\n\n注意我们如何命名第一个函数\
    \ `multiplyByTwo`。这是因为它的工作是将数字乘以 2。这样做有助于任何人通过名称知道我们的函数在做什么。\n\n**函数命名**是**函数定义**中至关重要的部分，忽视这一点会导致你的代码**不可读**、**不可维护**，并导致**效率降低**。\n\
    \n在命名函数时，务必不要使用只有少数人理解的俚语或人们只能在特定时间内相关的趋势。\n\n*让你的函数名具有描述性、直击重点且持久性。*\n\n---\n\
    \n**注意事项**\n\n- **函数（Function）**是一组旨在执行特定任务的语句集合。\n- 在函数定义期间，代表我们打算提供给函数的名称称为参数（parameters）。\n\
    - 在函数调用期间，我们提供给函数的实际值被称为实参（arguments）。\n- 我们可以在函数定义中使用最多 255 个参数。\n- 匿名函数是不带名称的函数，为了重用匿名函数，我们必须将其赋值给变量。\n\
    - IIFE（立即执行函数表达式）是一种在声明后立即被调用的函数。\n- 函数应该只有单一职责。\n- 函数名应该是描述性的、直击重点且持久的。\n\n"
