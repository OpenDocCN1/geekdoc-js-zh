    ## Working with Date and Time


    JavaScript provides several ways to work with dates and times, allowing us to
    create, manipulate, and format them. The built-in Date constructor is the most
    common way to achieve this. It provides a way to create a date object, get and
    set the date and time components, and format the date and time into a string.


    ### Creating a Date Object


    We can create a new Date object by calling the Date constructor with no arguments:


    ```javascript

    let currentDate = new Date()

    console.log(currentDate)

    // output: Sat May 19 2025 08:59:03 GMT+0100

    ```


    To create a Date object with a specific date and time, we can pass a string to
    the Date constructor:


    ```javascript

    let christmas = new Date(''December 25, 2025'')

    console.log(christmas)

    // output: Thu Dec 25 2025 00:00:00 GMT+0100

    ```


    The Date constructor accepts several formats for the date and time string, including
    the following:


    - December 25, 2025

    - December 25 2025

    - Dec 25 2025

    - 12/25/2025

    - 12-25-2025

    - 2025-12-25

    - 2025/12/25

    - 2025.12.25

    - 2025 12 25

    - 2025 Dec 25

    - 2025 December 25


    We can specify the time in the string as well:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30'')

    console.log(christmas)

    // output: Thu Dec 25 2025 23:15:30 GMT+0100

    ```


    If the time is not specified, it will default to midnight. The time format is
    hours:minutes:seconds, and the hours are specified in a 24-hour clock. We can
    also add a time zone to the string:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30 GMT-0500'')

    console.log(christmas)

    // output: Fri Dec 26 2025 05:15:30 GMT+0100 (West Africa Standard Time)

    ```


    The Date constructor can also accept multiple arguments, which represent the year,
    month, day, hour, minute, second, and millisecond, respectively:


    ```javascript

    let christmas = new Date(2025, 11, 25)

    console.log(christmas)

    // output: Thu Dec 25 2025 00:00:00 GMT+0100

    ```


    The month is specified as a number, where 0 is January, 1 is February, and so
    on. The day is specified as a number, where 1 is the first day of the month. The
    hour, minute, second, and millisecond are specified as numbers, where 0 is the
    first hour, minute, second, or millisecond of the day.


    ### Getting the Date and Time Components


    Once we have the Date object, we can extract several components of the date and
    time using its properties and methods. The Date object has the following properties:


    - getFullYear() - returns the year as a four-digit number

    - getMonth() - returns the month as a number

    - getDate() - returns the day of the month as a number

    - getDay() - returns the day of the week as a number

    - getHours() - returns the hour as a number

    - getMinutes() - returns the minutes as a number

    - getSeconds() - returns the seconds as a number

    - getMilliseconds() - returns the milliseconds as a number

    - getTime() - returns the number of milliseconds since January 1, 1970. January
    1, 1970 is used as the reference point for the Date object in JavaScript because
    it was the starting point of the Unix epoch, which is a standardized system for
    representing dates and times in computer systems.


    Let’s try an example with the Date object we created:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30 GMT-0500'')

    console.log(christmas.getFullYear()) // output: 2025

    console.log(christmas.getMonth()) // output: 11

    console.log(christmas.getDate()) // output: 25

    console.log(christmas.getDay()) // output: 5

    console.log(christmas.getHours()) // output: 5

    ```


    The getMonth() method returns the month in the range of 0-11, with 0 representing
    January and 11 representing December. Similarly, the getDay() method returns the
    day of the week in the range of 0-6, with 0 representing Sunday and 6 representing
    Saturday. We can also use the toString() method to convert the Date object to
    a string:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30 GMT-0500'')

    console.log(christmas.toString()) // output: ''Fri Dec 26 2025 05:15:30 GMT+0100''

    ```


    ### Setting the Date and Time Components


    Once we have extracted the date and time components from a Date object, we can
    manipulate the components to get a new Date object representing a different date
    and time. One way to do this is to set the individual components of the date and
    time using the methods and properties of the Date object. The Date object has
    the following methods for setting the date and time components:


    - setFullYear(year) - sets the year

    - setMonth(month) - sets the month

    - setDate(date) - sets the day of the month

    - setHours(hours) - sets the hour

    - setMinutes(minutes) - sets the minutes

    - setSeconds(seconds) - sets the seconds

    - setMilliseconds(milliseconds) - sets the milliseconds


    Let’s try an example with the Date object:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30 GMT-0500'')

    christmas.setFullYear(2026)

    console.log(christmas) // output: Sat Dec 26 2026 05:15:30 GMT+0100

    ```


    ### Formatting Dates and Times


    The Date object has several methods for formatting the date and time into a string,
    including:


    - toDateString() - returns the date portion of the Date object as a string

    - toTimeString() - returns the time portion of the Date object as a string

    - toLocaleString() - returns the date portion of the Date object as a string,
    formatted according to the locale

    - toLocaleTimeString() - returns the time portion of the Date object as a string,
    formatted according to the locale

    - toUTCString() - returns the date and time portion of the object as a string,
    formatted according to the UTC time zone


    Let’s try another example with the Date object:


    ```javascript

    let christmas = new Date(''December 25, 2025 23:15:30 GMT-0500'')

    console.log(christmas.toDateString()) // output: Fri Dec 26 2025

    console.log(christmas.toTimeString()) // output: 05:15:30 GMT+0100

    console.log(christmas.toLocaleDateString()) // output: 26/12/2025

    console.log(christmas.toLocaleTimeString()) // output: 5:15:30

    console.log(christmas.toUTCString()) // output: Fri, 26 Dec 2025 04:15:30 GMT

    ```


    There are other methods available in the Date object to a string, including toISO(),
    toJSON(), and toGMTString(). You can find more information about these methods
    in the MDN documentation. Understanding how to create Date objects, manipulate
    them, and handle time zones is essential for creating accurate and user-friendly
    web applications. For example, you might need to display the current date and
    time on a web page, or the date of a specific entry in a Todo list. Working with
    the Date object can be a bit tricky, but with practice, you will be able to do
    so with ease.


    *https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date*

