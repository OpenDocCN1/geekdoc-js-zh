    **insertAdjacentElement**


    The insertElement method is similar to the insertHTML method. The only difference
    is that the insertElement method takes an element as its second argument instead
    of HTML content. Let’s add a new p element with the text “The DOM is really cool!”
    after the #dom-example element:


    ```javascript

    let newParagraph = document.createElement(''p'')

    newParagraph.textContent = ''The DOM is really cool!''

    document.querySelector(''#dom-example'').insertAdjacentElement(''afterend'', newParagraph)

    ```


