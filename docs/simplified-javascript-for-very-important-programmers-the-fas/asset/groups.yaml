    ### 基础条件语句

    ### (If-else)


    在 JavaScript 中，你可以使用条件语句根据条件是否满足来运行不同的代码块。*代码块是一组包含在花括号中的语句。*


    条件语句是编程中至关重要的方面，因为它们允许你控制程序的执行流，并让程序在各种情况下表现出不同的行为。


    JavaScript 中有两种主要的条件语句：if 语句和 switch 语句。在本节中，你将学习 if 语句，稍后将学习 switch 语句。


    ### If 语句


    if 语句允许你在特定条件为真（true）时运行代码块。以下是 if 语句的基础语法：


    ```javascript

    1 if (condition) {

    2 // 如果条件为真则执行的代码

    3 }

    ```


    条件是一个布尔表达式，其结果为真（true）或假（false）。表达式是值和运算符的组合，求值为单个值。例如 `10 > 5` 是一个求值为真的表达式，而
    `10 < 5` 是一个求值为假的的表达式。表达式也可以是一个单一值，如数字、字符串或布尔值。


    如果条件求值为真，则执行**if 语句**内部的代码块。如果条件求值为假，则跳过该代码块。代码块包含在花括号 {} 中，被称为 **if 体（if body）**。


    例如，运行以下代码应返回字符串“7 is greater than 5”：


    ```javascript

    1 if (7 > 5) {

    2 console.log(''7 is greater than 5'')

    3 }

    ```


    由于 7 大于 5，花括号中的 console.log() 语句将执行。同样，运行以下代码不会在控制台中返回任何内容：


    ```javascript

    1 if (7 < 5) {

    2 console.log(''7 is less than 5'')

    3 }

    ```


    注意我们将比较符号从 `>`（大于）改为 `<`（小于）。由于 7 并不小于 5，计算机不会执行 `console.log()` 语句。


    你还会发现花括号内部的代码块前面有两个空格。这被称为**缩进（indentation）**，它让代码更容易阅读和理解。我们对代码进行缩进是为了显示它位于块内部。如果我们不对
    if 语句内部的代码进行缩进，就很难判断它是 if 语句的一部分，还是一个完全独立的语句。JavaScript 运行不需要缩进，但对于编写可读性的代码和避免错误是必要的。你可以使用任何数量的空格进行缩进，但通常使用两个空格。你会发现一些开发者使用四个空格或制表符（tabs），但最好与你或你的团队选择的任何风格保持一致。


    ### Else 子句


    你可以为 if 语句添加一个 **else 子句（else clause）**，这允许你在条件为假时指定一个要运行的代码块。以下是 if-else 语句的基础语法：


    ```javascript

    1 if (condition) {

    2 // 如果条件为真则执行的代码

    3 } else {

    4 // 如果条件为假则执行的代码

    5 }

    ```


    为我们的条件语句添加一个 else 子句：


    ```javascript

    1 if (7 < 5) {

    2 console.log(''7 is less than 5'')

    3 } else {

    4 console.log(''The condition is false'')

    5 }

    ```


    由于 7 并不小于 5，运行上述代码应返回字符串“The condition is false”。


    条件语句是创建能够适应不同情况并根据接收到的数据做出决策程序的本质工具。随着学习的，我们将介绍更复杂的条件语句以及编写它们的其他方式。


    ## JavaScript 中的变量


    ### 简介


    在不使用变量的情况下编写 JavaScript 代码并不容易。到目前为止，我们一直很好地避开了它们，但现在是时候你学习编程中最重要的概念之一了。


    **变量（variable）**是计算机内存中用于存储数据的命命名位置。简单来说，它是一个容器，我们可以在其中存储各种数据，如数字、文本、代码段，甚至是其他变量。所以，把变量想象成一个带有标签的盒子。标签是变量名，盒子的内容是变量值。


    以下是 JavaScript 变量的示例：


    ```javascript

    1 let myName = ''Ebenezer Don''

    ```


    在这个示例中，我们创建了一个名为“myName”的变量并在其中存储了字符串值“Ebenezer Don”。这被称为**变量声明（variable declaration）**。变量声明由四个部分组成：声明关键字、变量名、赋值符号
    (=) 和变量值。


    ### 声明关键字


    `let` 关键字是你在 JavaScript 中声明变量的方法之一。还有其他声明变量的方法，但 `let` 是最常用的。随着学习的，你将学习其他的变量声明关键字。*在
    JavaScript 中，关键字是具有特定用途的保留字。*


    ### 变量名


    此示例中的变量名是 `myName`。为变量使用描述性名称是一个良好的习惯，因为当变量名代表了它的值时，你的代码会更容易理解。


    ### 赋值符号 (=)


    赋值符号 (`=`) 用于给变量赋值。它也被称为赋值运算符，JavaScript 中还有其他运算符，如加法运算符 (`+`)、减法运算符 (`-`)、乘法运算符
    (`*`) 和除法运算符 (`/`)。


    ### 变量值


    在我们的示例中，变量值是字符串“Ebenezer”。变量的值可以是任何类型，包括数字、字符串、布尔值或其他变量。


    我们可以使用 console.log() 将变量值打印到控制台。


    ```javascript

    1 console.log(myName)

    ```


    如果我们想通过赋值运算符将变量的值改为“Jane Butters”，可以写这行代码：


    ```javascript

    1 myName = ''Jane Butters''

    ```


    现在，如果你运行 console.log 语句，它会打印出“Jane Butters”。


    ### 变量声明与赋值


    JavaScript 中有多种声明变量的方法，每种都有其用途。


    ### let 关键字


    `let` 关键字是 JavaScript 中声明声明变量的方法。它用于创建局部变量，即只能在代码块内访问的变量。以下是使用 `let` 关键字创建局部变量的示例：


    ```javascript

    1 if (true) {

    2 let message = ''JavaScript is awesome!''

    3 }

    4 console.log(message)

    ```


    在这个示例中，message 变量是局部的，仅在花括号代码块内访问。如果你在这个块之外尝试访问，将会报错。


    **全局变量（Global variables）**是可以在代码中任何地方访问的变量。如果你想用 `let` 关键字创建一个全局变量，可以在代码块之外声明。以下是使用
    `let` 关键字创建全局变量的示例：


    ```javascript

    1 let name = ''Jane''

    2 3 if (true) {

    4 console.log(name)

    5 }

    ```


    运行这段代码将向控制台返回字符串值“Jane”。这是因为 name 变量是全局的，可以在代码的任何地方访问。


    ### var 关键字


    `var` 关键字是 JavaScript 中声明变量的最旧方法，用于创建全局变量。所以，如果我们在第一个示例中使用 `var` 关键字来声明 message
    变量，我们就不会报错。以下是使用 `var` 关键字创建全局变量的示例：


    ```javascript

    1 if (true) {

    2 var message = ''JavaScript is awesome!''

    3 }

    4 console.log(message)

    ```


    上述代码不会返回任何错误，因为 message 变量是全局的。这意味着它可以在代码的任何地方访问，包括声明它的代码块之外。


    在使用全局变量时必须小心。由于它们可以在代码的任何地方访问，全局变量可能会导致问题。例如，如果你在代码中声明了一个与局部变量同名的全局变量，全局变量将覆盖局部变量；这会导致代码中出现意想不到的结果和困惑。


