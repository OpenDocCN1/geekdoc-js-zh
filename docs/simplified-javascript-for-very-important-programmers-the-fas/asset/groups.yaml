    \ 方法接受两个参数：我们想要插入 HTML 代码的位置，以及 HTML 代码本身。在这种情况下，我们使用 `beforeend` 位置，它将把 HTML\
    \ 代码添加到无序列表的末尾。接下来，我们将在页面加载时调用 `renderTasks()` 函数。每当页面加载时，它都会将我们在 LocalStorage\
    \ 中存储的任务渲染到浏览器中：\n\n```javascript\nwindow.onload = renderTasks\n```\n\n我们的 `todoApp.js`\
    \ 文件现在看起来应该是这样：\n\n```javascript\nconst taskInput = document.querySelector('#taskInput')\n\
    const taskList = document.querySelector('#taskList')\nconst addTaskForm = document.querySelector('#addTaskForm')\n\
    \ntaskList.style = `\n  list-style: none;\n  margin-top: 1rem;\n  font-size: 1.5rem;\n\
    `\n\nconst createTaskItem = (task) => `\n  <li>\n    <input type=\"checkbox\"\
    \ name=\"task\" value=\"${task}\">\n    <label for=\"task\">${task}</label>\n\
    \    <button type=\"button\">X</button>\n  </li>\n`\n\nconst storedTasks = JSON.parse(localStorage.getItem('tasks'))\
    \ || []\n\nconst renderTasks = () => {\n  storedTasks.forEach((task) => {\n  \
    \  taskList.insertAdjacentHTML(\n      'beforeend',\n      createTaskItem(task)\n\
    \    )\n  })\nwindow.onload = renderTasks\n```\n\n### 将任务添加到列表\n\n现在，让我们创建一个点击提交按钮时将任务添加到列表的。我们将使用\
    \ `addEventListener()` 方法监听表单的提交事件。当事件触发时，我们将阻止表单的默认行为（即刷新页面）。然后我们将获取输入字段的值，使用\
    \ `createTaskItem()` 函数创建一个列表项，并将其添加到页面 `ul` 元素中。我们还将任务添加到 `storedTasks` 数组中，并将其存储在\
    \ LocalStorage 的 `tasks` 键中，最后通过 `reset()` 方法清除输入字段：\n\n```javascript\nconst addTask\
    \ = (event) => {\n  event.preventDefault()\n\n  const task = taskInput.value\n\
    \  const taskItem = createTaskItem(task)\n  taskList.insertAdjacentHTML('beforeend',\
    \ taskItem)\n\n  storedTasks.push(task)\n  localStorage.setItem('tasks', JSON.stringify(storedTasks))\n\
    \n  addTaskForm.reset()\n}\n```\n\n接下来，我们将为表单添加事件监听器，在表单提交时调用 `addTask()` 函数：\n\
    \n```javascript\naddTaskForm.addEventListener('submit', addTask)\n```\n\n我们也可以在\
    \ `todoApp.html` 文件的表单元素上使用 `onsubmit` 属性添加事件监听器：\n\n```html\n<form id=\"addTaskForm\"\
    \ onsubmit=\"addTask(event)\">\n```\n\n这将实现 `addEventListener()` 方法，以便将所有的 JavaScript\
    \ 代码保留在 `todoApp.js` 文件中。\n\n为了测试目前的进展，请在浏览器中打开 `todoApp.html` 文件。你应该看到表单和无序列表。在输入字段中输入任务并点击提交按钮。你应该看到任务已添加到列表中。即使刷新页面，任务仍然在那里。\n\
    \n### 标记任务为完成\n\n现在，让我们添加标记任务为完成的功能。当用户勾选任务的复选框时，我们将使用 `textDecoration` 样式将其划线；如果他们取消勾选复选框，我们将取消划线。首先创建一个名为\
    \ `toggleTaskCompletion()` 的函数。我们的函数接受事件对象作为参数，使用事件对象的 `target` 属性获取被点击的复选框。然后我们使用\
    \ `parentElement` 属性获取包含复选框的列表项。接下来，我们将使用 `querySelector()` 方法获取列表项内部的 label 元素。如果复选框被选中，我们将\
    \ `textDecoration` 样式设置为 `line-through`，否则设置为 `none`：\n\n```javascript\nconst\
    \ toggleTaskCompletion = (event) => {\n  const taskItem = event.target.parentElement\n\
    \  const label = taskItem.querySelector('label')\n  if (event.target.checked)\
    \ {\n    label.style.textDecoration = 'line-through'\n  } else {\n    label.style.textDecoration\
    \ = 'none'\n  }\n}\n```\n\n接下来，我们将在 `createTaskItem()` 函数中为复选框添加事件监听器。将你的函数更新为：\n\
    \n```javascript\nconst createTaskItem = (task) => `\n  <li>\n    <input type=\"\
    checkbox\" name=\"task\" value=\"${task}\" onchange=\"toggleTaskCompletion(event)\"\
    >\n    <label for=\"task\">${task}</label>\n    <button type=\"button\">X</button>\n\
    \  </li>\n`\n```\n\n### 移除任务\n\n接下来，我们将添加从列表中移除任务的功能。当用户点击 X 按钮时，我们将从页面、从 `storedTasks`\
    \ 数组中移除任务，并更新 LocalStorage，这样刷新页面时任务就不会回来了。我们首先创建一个名为 `removeTask()` 的函数：\n\n\
    ```javascript\nconst removeTask = (event) => {\n  const taskItem = event.target.parentElement\n\
    \  const task = taskItem.querySelector('label').innerText\n  const index = storedTasks.indexOf(task)\n\
    \n  storedTasks.splice(index, 1)\n  localStorage.setItem('tasks', JSON.stringify(storedTasks))\n\
    \n  taskItem.remove()\n}\n```\n\n最后，我们将在 `createTaskItem()` 函数的按钮上添加一个 `onClick`\
    \ 事件监听器。将你的函数更新为：\n\n```javascript\nconst createTaskItem = (task) => `\n  <li>\n\
    \    <input type=\"checkbox\" name=\"task\" value=\"${task}\" onchange=\"toggleTaskCompletion(event)\"\
    >\n    <label for=\"task\">${task}</label>\n    <button type=\"button\" onclick=\"\
    removeTask(event)\">X</button>\n  </li>\n`\n```\n\n现在你可以可以通过点击 X 按钮从列表中移除任务了。\n\
    \n"
