    ## How to write and run JavaScript code


    “JavaScript is awesome!” to the console. Good job! I’ll explain every part of
    the code you just wrote later on.


    ### Using an online code editor


    Another way to write and run JavaScript code is by using an online code editor
    or online Integrated Development Environment (IDE). There are many online code
    editors and IDEs available that allow you to write and run JavaScript code from
    your web browser. Some popular options include CodePen, JSFiddle, and JS Bin.


    You need an internet connection to use an online code editor, but it has several
    advantages too. First, it allows you to write and run code from anywhere. Second,
    you can easily share your code with others through links. Third, many online code
    editors and IDEs have built-in features that can ease the process of writing code
    and checking for errors.


    ### Using an offline code editor


    There are also several offline code editors and IDEs you can use to write and
    run JavaScript code. Some popular options include Eclipse, NetBeans, Visual Studio
    and Visual Studio Code (with the help of extensions). These IDEs need to be installed
    on your local computer and typically have more features and functionality than
    online code editors. They are often used for more complex projects, and even if
    you don’t start with them, you’ll eventually need one as you progress.


    The easiest to get started with is your browser console, so I recommend writing
    and running your first JavaScript code on it, and when you do, take a screenshot
    and save it where you can access it a year from now. I’m sure you’ll be proud
    of your progress.


    ## JavaScript syntax and Data types


    JavaScript syntax and data types are fundamental concepts that you should understand
    as you learn JavaScript. The syntax of a programming language includes its rules
    for writing and structuring code, while data types represent the classification
    of values that you can store and manipulate in your code.


    ### Syntax


    Here are some basic rules for writing and structuring JavaScript code:


    - JavaScript is case-sensitive, which means that the case of the characters and
    keywords you use matters. So if you write a word like ‘name’ in your code, JavaScript
    will see it as different from ‘Name’ or ‘nAme’. This is a common confusion for
    beginners when writing code, so pay close attention to the cases you use.

    - Use spaces, tabs, and newlines to make your code readable, but make sure to
    stay consistent. This is also known as **indentation** and you’ll see examples
    as we progress.

    - You can choose to write a semicolon (;) at the end of each statement. *A statement
    is any line of code that instructs the computer to perform a specific task.* Terminating
    statements with semicolons used to be a requirement for JavaScript code to run
    properly but that isn’t the case anymore. So you’ll see some codebases with semicolons
    and some without it.


    It’s important to keep your code style consistent as this will ease readability
    and understanding, so if you choose to use semicolons, use them for every statement
    in your code, and if you choose to do without semicolons, don’t use them at all.
    There are some more rules that won’t be easy for you to understand now, so I’ll
    show them to you as we progress.


    ### Data Types


    In JavaScript, there are several data types that are used to represent different
    types of information, like numbers, text, or true/false values. The most basic
    data types are numbers, strings, and Booleans. A collection of multiple values
    with the same or different data types is called a data structure.


    JavaScript is a dynamically-typed language, which means that the type of a value
    is determined while the program is running and can change during the program.
    This is different from other programming languages where you have to set the type
    of a value when creating, and can’t change it later. These other languages are
    called “statically-typed”.


    There are several basic data types in JavaScript, including:


    #### Numbers


    Numbers in JavaScript can be integers or floating-point values. Integers are whole
    numbers like 1, 2, or 3, and floating-point values are numbers with decimal points
    like 7.8 or 0.05.


    You’ve already used console.log() to display your name in the browser console.
    console.log() is also a **method**, which we’ll explain in detail later on. For
    now, you can recognize methods with the parenthesis() after them. They represent
    a set of instructions for the computer.


    Let’s introduce another method, typeof(). We’ll use this to find out the type
    of any value we create in JavaScript. On your browser console, writing the following
    code and hitting the Enter key should display the text “number”:


    `typeof(10)`


    It’s important that you practice everything you learn to make understanding and
    remembering it easier. Try using the typeof() method to find out the type of **-10**.


    Notice that you still get the response, ‘number’. This is because there is no
    difference between positive and negative numbers. Positive numbers are numbers
    greater than zero, and negative numbers are less than zero. You can represent
    both positive and negative numbers with the same syntax in JavaScript.


    #### Strings


    In JavaScript, a string is a group of characters that is used to store text. Strings
    are commonly used to store words and sentences. To write a string, you have to
    wrap it in either single quotes (‘This is a string’) or double quotes (“This is
    also a string”). Both types of quotes can be used to write strings, as long as
    they are used consistently. So, if you start writing a string with single quotes,
    you must end it with single quotes.


    A string can be a single word, sentence or multiple paragraphs, and it can contain
    any combination of letters, numbers and spaces. The text “My name is Ebenezer
    Don” in the console.log() statement we used earlier is also a string. Remember
    to always use your name wherever you see “Ebenezer Don”.


    Let’s print the string “Hello World” to the console, using both single quotes
    and double quotes:


    `console.log(''This is really cool!'')`

    `console.log("This is really cool!")`


    Now, try using the typeof() method to find out the type of “Hello World”. Remember
    to pay close attention to the casing of keywords. For example, there’s no uppercase
    letter in the typeof() method. The string is an important data type in JavaScript.
    You can use it to represent text-based data like names, messages.


    #### Booleans


    Booleans represent true or false values. They are often used to make comparisons
    and determine whether a set of instructions should be executed. When you run the
    code typeof(true) in your browser console, you should get the response, ‘boolean’.


    To make value comparisons in JavaScript, you can use the symbols > (greater than),
    < (less than), or === (is the same as). Now, let’s see if the strings “Hey” and
    ‘hey’ are the same in JavaScript. Run the following line of code in your console:


    `''hey'' === ''HEY''`


    Running the above code should return **false**, and that’s because strings are
    case-sensitive in JavaScript. Booleans are an important data type in JavaScript,
    as they allow you to represent logical values, make comparisons and run code conditionally.


    ## Comments in JavaScript


    In JavaScript, comments are pieces of text within the code that are ignored when
    the code is executed. They are useful for adding notes to your code, or for temporarily
    disabling a piece of code without having to delete it. There are two ways to write
    comments in JavaScript: Single-line comments and Multi-line comments.


    ### Single-line comments


    Single-line comments start with two slashes (//) and continue until the end of
    the line. For example:


    `// This is a single-line comment`


    ### Multi-line comments


    Multi-line comments start with a forward slash and an asterisk (/*) and end with
    an asterisk and a forward slash (*/). They can span multiple lines and can be
    used to disable blocks of code or to add longer notes and explanations to your
    code. Here’s an example of a multi-line comment:


    ```/*

    This is a

    multi-line comment

    */

    ```'
