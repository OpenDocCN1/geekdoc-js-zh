    When checking for multiple cases of a value or variable, the switch statement
    is usually more efficient than the if-else statement because it requires fewer
    lines of code and is easier to read. However, this is not always the case. If
    you’re working with multiple conditions, the switch statement might become difficult
    to manage. For example, if you want to check if the day is a weekday in January
    using two variables, day and month, you can write a nested switch statement like
