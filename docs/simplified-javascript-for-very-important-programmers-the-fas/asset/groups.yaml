    You rolled a 3\n```\n如果第一次就是 6，循环运行一次。如果需要 10 次，循环就会运行 10 次。`while` 循环只要条件成立就会继续运行。在这种情况下，条件是\
    \ `dieRoll` 不等于 6。在 `while` 循环中，在运行之前检查条件。如果在声明时给 `dieRoll` 赋值为 6，循环将不会运行，因为条件从开始就是假的：\n\
    \n```javascript\nlet dieRoll = 6\n\nwhile (dieRoll !== 6) {\n  dieRoll = Math.ceil(Math.random()\
    \ * 6)\n  console.log(`You rolled a ${dieRoll}`)\n}\n```\n在 `while` 循环中，我们必须确保条件最终会被满足。否则，循环将无限运行。看到我们在每次迭代中是如何更新\
    \ `dieRoll` 的。如果不这样做，第一个示例中的 `dieRoll` 将始终为 0，条件 `dieRoll !== 6` 将始终为真，导致循环无限运行。循环无限运行时，被称为**死循环**。\n\
    \n让我们尝试移除更新 `dieRoll` 的行。运行这样的死循环会导致浏览器冻结，请将光标靠近 X 按钮（关闭标签页）以便防止浏览器崩溃：\n\n```javascript\n\
    let dieRoll = 0\n\nwhile (dieRoll !== 6) {\n  console.log(`You rolled a ${dieRoll}`)\n\
    }\n```\n\n### **do...while 循环**\n\n`do...while` 循环类似于 `while` 循环，但与 `while` 循环不同，它是在运行之后检查条件。这意味着循环至少运行一次。因此，在我们骰子游戏的第二个示例中，即使声明时给\
