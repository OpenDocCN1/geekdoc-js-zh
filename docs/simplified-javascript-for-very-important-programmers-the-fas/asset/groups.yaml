    **insertAdjacentHTML**


    The insertHTML method inserts HTML content at a specified position relative to
    the element on which it is called. The method takes two arguments: the position
    and the HTML content. The position can be one of:


    - beforebegin: Before the element itself.

    - afterbegin: Just inside the element, before its first child.

    - beforeend: Just inside the element, after its last child.

    - afterend: After the element itself.


    Let’s add a new p element with the text “The DOM is awesome!”

    before the #dom-example element:


    ```javascript

    document.querySelector(''#dom-example'').insertAdjacentHTML(''beforebegin'', ''<p>The
    DOM is awesome!</p>'')

    ```


