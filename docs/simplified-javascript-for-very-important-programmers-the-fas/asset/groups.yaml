- md: "\n## Browser Events\n\n162\n\n### **type**\nThe type property returns the type\
    \ of event that occurred, such as click or submit:\n\n```javascript\nbutton.addEventListener('click',\
    \ (event) => {\n  console.log(event.type)\n})\n```\n\n### **currentTarget and\
    \ Event Bubbling**\nThe currentTarget property returns the element that the event\
    \ listener is attached to, not necessarily the element that the event occurs on.\
    \ The difference between target and currentTarget is that target returns the element\
    \ that was clicked on, while currentTarget returns the element that the event\
    \ listener is attached to. For example, if we remove the click event listener\
    \ from the button and add it to the body element instead, the currentTarget property\
    \ will return the body element, even if we click on the button. This is called\
    \ **event bubbling**. *Event bubbling is a mechanism that allows an event to propagate\
    \ or “bubble” up to its parent elements.* Since the body element is the parent\
    \ of the button element, the click event will bubble up to the body element where\
    \ the event listener is attached. Replace the code in your browserEvents.js file\
    \ with the following:\n\n```javascript\ndocument.body.addEventListener('click',\
    \ (event) => {\n  console.log(event.currentTarget)\n})\n```\n\n### **stopPropagation()**\n\
    The stopPropagation() method prevents the event from bubbling up to parent elements.\
    \ For example, if we want to prevent the click event from bubbling up to the body\
    \ element when we click on the button, we can add an event listener to the button\
    \ and call the event object’s stopPropagation() method in the event handler function.\
    \ Along with the body event listener from the previous example, add the following\
    \ code to your browserEvents.js file and reload the page:\n\n```javascript\nconst\
    \ button = document.querySelector('#click-me-btn')\n\nbutton.addEventListener('click',\
    \ (event) => {\n  event.stopPropagation()\n})\n```\n\nNow, when you click on the\
    \ button, the click event will not bubble up to the body element and the body\
    \ event listener will not be executed. You can also add code to the button’s event\
    \ handler function that will run when the button is clicked:\n\n```javascript\n\
    button.addEventListener('click', (event) => {\n  event.stopPropagation()\n  alert('You\
    \ clicked me!')\n})\n```\n\nWithout the stopPropagation() method, both the body\
    \ event listener and the button’s event listener would be executed when the button\
    \ is clicked.\n\n### **key**\nThe key property returns the value of the key that\
    \ was pressed or released when a keyboard event occurs. For example, if we want\
    \ to log the value of the key that was pressed to the console, we can edit the\
    \ body event handler function in the browserEvents.js file to the following:\n\
    \n```javascript\ndocument.body.addEventListener('keydown', (event) => {\n  console.log(event.key)\n\
    })\n```\n\nReloading your page and pressing a key on your keyboard should log\
    \ the value of that key to the console.\n\n### **preventDefault()**\nThe preventDefault()\
    \ method prevents the default behavior of an event from being executed. For example,\
    \ the default behavior of a form’s submit button is to reload the page when it\
    \ is clicked. If we want to prevent this behavior, we can call the preventDefault()\
    \ method on the event object in the submit event handler function. Let’s add a\
    \ form to our browserEvents.html file. Add the following code under the button\
    \ element:\n\n```html\n<form id=\"name-form\">\n  <label for=\"name\">Name:</label>\n\
    \  <input type=\"text\" id=\"name\">\n  <input type=\"submit\" value=\"Submit\"\
    >\n</form>\n```\n\nWhen you click on the submit button in your browser, notice\
    \ that the page reloads. Let’s add an event listener to the form’s submit button\
    \ to prevent this behavior. Replace the code in your browserEvents.js file with\
    \ the following:\n\n```javascript\nconst form = document.querySelector('#name-form')\n\
    \nform.addEventListener('submit', (event) => {\n  event.preventDefault()\n})\n\
    ```\n\nNow, clicking on the submit button should not reload the page. We can also\
    \ add some code to the event handler function to log the value of the input field\
    \ to the console:\n\n```javascript\nform.addEventListener('submit', (event) =>\
    \ {\n  event.preventDefault()\n  console.log(event.target.name.value)\n})\n```\n\
    \nReloading your page and submitting the form should log the value of the input\
    \ field to the console. The event.target property returns the form element, the\
    \ name property returns the input element, and the value property returns the\
    \ value of the input field.\n\n### **Browser Event types and listeners**\nLet’s\
    \ explore the different types of browser events and how we can use listeners to\
    \ respond to them.\n\n#### **Mouse Events**\nMouse events are actions that occur\
    \ when a user interacts with the mouse, such as moving it or clicking on an element.\
    \ The following are some of the most common mouse events:\n\n- click - occurs\
    \ when a user clicks on an element\n- dblclick - occurs when a user double-clicks\
    \ on an element\n- mousedown - occurs when a user presses down on a mouse button\
    \ while over an element\n- mouseup - occurs when a user releases a mouse button\
    \ while over an element\n- mouseover - occurs when a user moves over an element\n\
    - mouseout - occurs when a user moves off an element\n- mousemove - occurs when\
    \ a user moves the mouse\n- wheel - occurs when a user scrolls over an element\n\
    \n#### **Keyboard Events**\nKeyboard events are triggered by actions performed\
    \ with the keyboard, such as typing and pressing keys. Some common events include:\n\
    \n- keydown - occurs when a key is pressed\n- keyup - occurs when a key is released\n\
    - keypress - occurs when a key is pressed\n\n#### **Form Events**\nForm events\
    \ are triggered when a user interacts with the form, such as submitting it. Some\
    \ common events include:\n\n- submit - occurs when the form is submitted\n- reset\
    \ - occurs when the form is reset\n\n#### **Window Events**\nWindow events are\
    \ triggered when a user interacts with the browser window, such as resizing or\
    \ scrolling through a page. Some common events include:\n\n- load - occurs when\
    \ the page is loaded\n- unload - occurs when the page is unloaded\n- resize -\
    \ occurs when the browser window is resized\n- scroll - occurs when the user scrolls\
    \ through the page\n"
  mdcn: "\n\n## 浏览器事件\n\n162\n\n### **type**\ntype 属性返回发生事件的类型，例如 click（点击）或 submit（提交）：\n\
    \n```javascript\nbutton.addEventListener('click', (event) => {\n  console.log(event.type)\n\
    })\n```\n\n### **currentTarget 和事件冒泡**\ncurrentTarget 属性返回绑定事件监听器的元素，而不一定是事件发生的元素。target\
    \ 和 currentTarget 之间的区别在于：target 返回被点击的元素，而 currentTarget 返回事件监听器所绑定的元素。例如，如果我们从按钮上移除点击事件监听器，并将其添加到\
    \ body 元素上，那么即使我们点击了按钮，currentTarget 属性也会返回 body 元素。这被称为**事件冒泡**。*事件冒泡允许事件向其父元素传播或“冒泡”向的机制。*由于\
    \ body 元素是按钮元素的父元素，因此点击事件将冒泡到绑定了事件监听器的 body 元素。将你 browserEvents.js 文件中的代码替换为以下内容：\n\
    \n```javascript\ndocument.body.addEventListener('click', (event) => {\n  console.log(event.currentTarget)\n\
    })\n```\n\n### **stopPropagation()**\nstopPropagation() 方法阻止事件冒泡到父元素。例如，如果我们想在点击按钮时防止点击事件冒泡到\
    \ body 元素，我们可以在按钮上添加一个事件监听器，并在事件处理函数中调用事件对象的 stopPropagation() 方法。同上一个示例中的 body\
    \ 事件监听器一起，将以下代码添加到你的 browserEvents.js 文件中并刷新页面：\n\n```javascript\nconst button\
    \ = document.querySelector('#click-me-btn')\n\nbutton.addEventListener('click',\
    \ (event) => {\n  event.stopPropagation()\n})\n```\n\n现在，当你点击按钮时，点击事件将不再冒泡到 body\
    \ 元素，body 事件监听器也不会被执行。你也可以在按钮的事件处理函数中添加代码，这些代码会在按钮被点击时运行：\n\n```javascript\nbutton.addEventListener('click',\
    \ (event) => {\n  event.stopPropagation()\n  alert('You clicked me!')\n})\n```\n\
    \n如果没有 stopPropagation() 方法，点击按钮时，body 事件监听器和按钮的监听器都将被执行。\n\n### **key**\nkey\
    \ 属性返回发生键盘事件时按下或释放的按键值。例如，如果我们想将按下按键的值打印到控制台，可以修改 browserEvents.js 文件中的 body 事件处理函数为如下内容：\n\
    \n```javascript\ndocument.body.addEventListener('keydown', (event) => {\n  console.log(event.key)\n\
    })\n```\n\n刷新页面并按下键盘上的任意键，应该会将该按键的值打印到控制台。\n\n### **preventDefault()**\npreventDefault()\
    \ 方法阻止事件的默认行为被执行。例如，表单提交按钮的默认行为是在点击时重新加载页面。如果我们想阻止这种行为，可以在提交事件处理函数中对事件对象调用 preventDefault()\
    \ 方法。让我们在 browserEvents.html 文件中添加一个表单。在元素下方添加以下代码：\n\n```html\n<form id=\"name-form\"\
    >\n  <label for=\"name\">Name:</label>\n  <input type=\"text\" id=\"name\">\n\
    \  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n当你点击浏览器中的提交按钮时，注意看页面刷新了。让我们为表单的提交按钮添加事件监听器来防止这种行为。将你\
    \ browserEvents.js 文件中的代码替换为以下内容：\n\n```javascript\nconst form = document.querySelector('#name-form')\n\
    \nform.addEventListener('submit', (event) => {\n  event.preventDefault()\n})\n\
    ```\n\n现在，点击提交按钮不应再刷新页面。我们也可以在事件处理函数中添加代码，将输入字段的值打印到控制台：\n\n```javascript\nform.addEventListener('submit',\
    \ (event) => {\n  event.preventDefault()\n  console.log(event.target.name.value)\n\
    })\n```\n\n刷新页面并提交表单，应该会将输入字段的值打印到控制台。event.target 属性返回表单元素，name 属性返回输入元素，而 value\
    \ 属性返回输入字段的值。\n\n### **浏览器事件类型和监听器**\n让我们探索不同的浏览器事件类型，以及我们如何使用监听器来响应它们。\n\n####\
    \ **鼠标事件**\n鼠标事件是用户与鼠标交互时发生的动作，例如移动鼠标或点击元素。以下是一些最常见的鼠标事件：\n\n- click - 当用户点击元素时发生\n\
    - dblclick - 当用户双击元素时发生\n- mousedown - 当用户在元素上按下鼠标键时发生\n- mouseup - 当用户在元素上释放鼠标键时发生\n\
    - mouseover - 当用户鼠标悬过元素时发生\n- mouseout - 当用户移出元素时发生\n- mousemove - 当用户移动鼠标时发生\n\
    - wheel - 当用户在元素上滚动滚轮时发生\n\n#### **键盘事件**\n键盘事件由键盘执行的操作触发，如打字和按键。一些常见事件包括：\n\n\
    - keydown - 当按键按下时发生\n- keyup - 当按键释放时发生\n- keypress - 当按键按下时发生\n\n#### **表单事件**\n\
    表单事件在用户与表单交互时触发，例如提交表单。一些常见事件包括：\n\n- submit - 当表单提交时发生\n- reset - 当表单重置时发生\n\n\
    #### **窗口事件**\n窗口事件在用户与浏览器窗口交互时触发，例如调整大小或滚动页面。一些常见事件包括：\n\n- load - 当页面加载时发生\n\
    - unload - 当页面卸载时发生\n- resize - 当浏览器窗口大小发生变化时发生\n- scroll - 当用户滚动页面时发生\n\n"
