- md: "\n## JavaScript Objects\n\n81\n\n**Property values can be any valid JavaScript\
    \ expression**\n\nThe value of a property can be any valid JavaScript expression,\
    \ including a function. When a function is used as a property value, it’s called\
    \ a method, which is why we’ve been using the term “method” when referring to\
    \ inbuilt JavaScript functions like console.log().\n\nLet’s create an object with\
    \ a method named sayHello:\n\n```javascript\nconst person = {\n  fullName: 'Victor\
    \ Otedola',\n  sayHello: function () {\n    console.log('Hello! My name is ' +\
    \ this.name)\n  },\n}\n\nperson.sayHello()\n// Output: Hello! My name is Victor\
    \ Otedola\n```\n\nIn the example above, we created an object named person with\
    \ a fullName property and a method named sayHello. The sayHello method uses the\
    \ **this keyword** to access the name property of the object. When you use the\
    \ this keyword inside a method, it refers to the object on which the method is\
    \ being called. In this case, this refers to the person object.\n\nYou can also\
    \ use an arrow function as a method, but the this keyword will not work the same\
    \ way, instead, its value will be determined by the context in which the method\
    \ is called:\n\n```javascript\nconst person2 = {\n  fullName: 'Linda Chima',\n\
    \  sayHello: () => {\n    console.log('Hello! My name is ' + this.name)\n  },\n\
    }\n\nperson2.sayHello()\n// Output: Hello! My name is undefined\n```\n\nThe this\
    \ keyword doesn’t work the same way as the first example because it is used in\
    \ an arrow function. In this case, this refers to the global object, which doesn’t\
    \ have a name property. This can get confusing, so it’s best to avoid using this\
    \ in arrow functions.\n\n### Adding, modifying and Removing Properties\n\nYou\
    \ can add new properties to an object using dot or bracket notation. Let’s create\
    \ a new object named student and add a new property, gender:\n\n```javascript\n\
    const student = {\n  name: 'Kachi',\n  age: 17,\n}\n\nstudent.gender = 'Male'\n\
    console.log(student)\n// Output: { name: \"Kachi\", age: 17, gender: \"Male\"\
    \ }\n\n```\n\nHere’s how to use bracket notation to add a new property:\n\n```javascript\n\
    student['grade'] = 12\nconsole.log(student)\n// Output: { name: \"Kachi\", age:\
    \ 17, gender: \"Male\", grade: 12 }\n```\n\nYou can also use the dot and bracket\
    \ notation to modify an existing property:\n\n```javascript\nstudent.age = 18\n\
    student['grade'] = 13\nconsole.log(student.age) // Output: 18\nconsole.log(student.grade)\
    \ // Output: 13\n```\n\nJavaScript has an Object.defineProperty() method for adding\
    \ a new property to an object. The Object.defineProperty() method is a way to\
    \ define or modify a property on an object. It is used to control the behavior\
    \ of a property and make it read-only (cannot be modified), non-enumerable (cannot\
    \ be iterated over), or non-configurable (cannot be deleted or modified). Here’s\
    \ how to use it to add a new property to an object:\n\n```javascript\nObject.defineProperty(student,\
    \ 'school', {\n  value: 'University of Lagos',\n  writable: false,\n  enumerable:\
    \ true,\n  configurable: true,\n})\n\nconsole.log(student)\n```\nOutput:\n```json\n\
    {\n  name: \"Kachi\",\n  age: 18,\n  gender: \"Male\",\n  grade: 13,\n  school:\
    \ \"University of Lagos\"\n}\n```\n\nThe first argument is the object on which\
    \ to add the property. The second argument is the name of the property. The third\
    \ argument is an object that contains the property’s attributes. The value attribute\
    \ is required, and it specifies the value of the property. The writable, enumerable,\
    \ and configurable attributes are optional. They will default to false if you\
    \ don’t specify them. Notice that we set the writable attribute of the school\
    \ property to false, so changing its value won’t work:\n\n```javascript\nstudent.school\
    \ = 'Havard University'\nconsole.log(student.school)\n// Output: \"University\
    \ of Lagos\"\n```\n\nTo remove a property, you can use the delete keyword:\n\n\
    ```javascript\ndelete student.school\nconsole.log(student.school)\n// Output:\
    \ undefined\n```\n\nLet’s try using Object.defineProperty() to add a new property\
    \ to the student object that can’t be deleted:\n\n```javascript\nObject.defineProperty(student,\
    \ 'language', {\n  value: 'English',\n  writable: true,\n  enumerable: true,\n\
    \  configurable: false,\n})\n\nconsole.log(student.language)\n// Output: \"English\"\
    \n\ndelete student.language\nconsole.log(student.language)\n// Output: \"English\"\
    \n```\n\nThe configurable attribute is set to false, so the language property\
    \ can’t be deleted.\n\n### Object.prototype\n\nIn JavaScript, every object has\
    \ a prototype. When you create an object, it inherits a prototype, which is an\
    \ object that contains other built-in properties and methods you can use on the\
    \ main object. For example, every object has a toString() method that returns\
    \ a string representation of the object, even though you don’t add it yourself:\n\
    \n```javascript\nconst computerInfo = {\n  brand: 'Apple',\n  model: 'MacBook\
    \ Pro',\n  color: 'Silver',\n}\n\nconsole.log(computerInfo.toString())\n// Output:\
    \ [object Object]\n```\n\nThe default string representation of an object is [object\
    \ Object]. If you want to get a string representation of an object that contains\
    \ the object’s properties, you can use the built-in JSON.stringify() method:\n\
    \n```javascript\nJSON.stringify(computerInfo)\n// Output: '{\"brand\":\"Apple\"\
    ,\"model\":\"MacBook Pro\",\"color\":\"Silver\"}'\n```\n\nTo access all the properties\
    \ and methods of an object’s prototype, you can use the built-in Object.getPrototypeOf()\
    \ method:\n\n```javascript\nObject.getPrototypeOf(computerInfo)\n// Output: {propertyIsEnumerable:\
    \ f, toString: f, ...}\n```\n\nThe Object.getPrototypeOf() method returns an object\
    \ that contains all the properties and methods of the object’s prototype. You\
    \ can also use it to add new properties and methods to an object’s prototype:\n\
    \n```javascript\nObject.getPrototypeOf(computerInfo).isExpensive = true\nconsole.log(computerInfo.isExpensive)\n\
    // Output: true\n```\n\n### Object methods\n\nThere are other methods available\
    \ on the Object object that you can use to add, modify and retrieve data from\
    \ any object. You’ve already seen the Object.defineProperty() method. Let’s explore\
    \ some other methods.\n\n**Object.keys()**\nThe Object.keys() method returns an\
    \ array of a given object’s enumerable property names. Let’s get the keys of computerInfo:\n\
    \n```javascript\nObject.keys(computerInfo)\n// Output: [\"brand\", \"model\",\
    \ \"color\"]\n```\n\n**Object.values()**\nThe Object.values() method returns an\
    \ array of a given object’s enumerable property values. Let’s get the values of\
    \ computerInfo:\n\n```javascript\nObject.values(computerInfo)\n// Output: [\"\
    Apple\", \"MacBook Pro\", \"Silver\"]\n```\n\n**Object.entries()**\nThe Object.entries()\
    \ method returns an array of a given object’s enumerable property [key, value]\
    \ pairs. In the return value, each element is an array containing the property\
    \ name and value.\n\n```javascript\nObject.entries(computerInfo)\n// Output: [[\"\
    brand\", \"Apple\"], [\"model\", \"MacBook Pro\"], [\"color\", \"Silver\"]]\n\
    ```\n\n**Object.assign()**\nThe Object.assign() method copies all enumerable own\
    \ properties from one or more source objects to a target object. It returns the\
    \ modified target object. Let’s create a new object named newComputerInfo and\
    \ copy the properties of computerInfo to it:\n\n```javascript\nconst newComputerInfo\
    \ = Object.assign({}, computerInfo)\nconsole.log(newComputerInfo)\n// Output:\
    \ {brand: \"Apple\", model: \"MacBook Pro\", color: \"Silver\"}\n```\n\n**Object.freeze()**\n\
    The Object.freeze() method freezes an object so it can’t be modified. Let’s freeze\
    \ the computerInfo object and try to modify it:\n\n```javascript\nObject.freeze(computerInfo)\n\
    computerInfo.brand = 'Dell'\nconsole.log(computerInfo.brand)\n// Output: \"Apple\"\
    \n```\n\n**Object.seal()**\nThe Object.seal() method seals an object, preventing\
    \ new properties from being added to it and marking all existing properties as\
    \ non-configurable. Let’s seal the computerInfo object and try to add a new property\
    \ to it:\n\n```javascript\nObject.seal(computerInfo)\ncomputerInfo.price = 200000\n\
    console.log(computerInfo.price)\n// Output: undefined\n```\n\nThese are the most\
    \ common methods in the Object object, but you can find more in the MDN documentation*.\n\
    \nUnderstanding how to use these methods is essential for mastering objects in\
    \ JavaScript. So, make sure you keep practicing until you’re comfortable with\
    \ them.\n\nYou’ll find yourself using objects a lot. They are an important part\
    \ of JavaScript, and it’s almost impossible to build applications without grouping\
    \ related data in objects. They help make your code organized, easy to read, and\
    \ maintainable.\n\n*https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object\n"
