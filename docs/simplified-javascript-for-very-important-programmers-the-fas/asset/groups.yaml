    ## JavaScript syntax and Data types


    15


    ### Basic conditional statements

    ### (If-else)


    In JavaScript, you can use conditional statements to run different blocks of code
    depending on whether or not a condition is met. *A block of code is a group of
    statements enclosed in curly braces.*


    Conditional statements are a crucial aspect of programming, as they allow you
    to control the flow of your program and make it behave differently in various
    situations.


    There are two main types of conditional statements in JavaScript: if statements
    and switch statements. In this section, you’ll learn about if statements, and
    later on, switch statements.


    ### The If Statement


    An if statement enables you to run a block of code if a specific condition is
    true. This is the basic syntax for an if statement:


    ```javascript

    1 if (condition) {

    2 // code to run if condition is true

    3 }

    ```


    The condition is a boolean expression that evaluates to either true or false.
    An expression is a combination of values and operators that evaluates to a single
    value. For example, 10 > 5 is an expression that evaluates to true, and 10 < 5
    is an expression that evaluates to false. An expression can also be a single value,
    like a number, string, or boolean.


    If the condition evaluates to true, the code block inside the **if statement**
    is executed. If the condition evaluates to false, the code block is skipped. The
    code block is enclosed in curly braces {} and is called the **if body**.


    For instance, running the following code should return the string “7 is greater
    than 5”:


    ```javascript

    1 if (7 > 5) {

    2 console.log(''7 is greater than 5'')

    3 }

    ```


    Since 7 is greater than 5, the console.log() statement in the curly braces will
    run. Likewise, running the following code will not return anything on your console:


    ```javascript

    1 if (7 < 5) {

    2 console.log(''7 is less than 5'')

    3 }

    ```


    Notice that we changed the comparison symbol from > (greater than) to < (less
    than). As 7 is not less than 5, the computer will not execute the console.log()
    statement.


    You’ll also notice that the code block inside the curly braces has two spaces
    before it. This is called **indentation**, and it makes code easier to read and
    understand. We indent code to show that it is inside a block. If we didn’t indent
    the code inside the if statement, it would be hard to tell whether it’s part of
    the if statement or whether it’s a separate statement entirely. Indentation is
    not required for JavaScript to run, but it’s necessary for writing readable code
    and avoiding errors. You can use any number of spaces for indentation, but it’s
    common to use two spaces. You’ll find some developers who use four spaces or tabs,
    but it’s best to stay consistent with whichever style you or your team choose.


    ### The Else clause


    You can add an **else clause** to an if statement, which allows you to specify
    a block of code to run if the condition is false. This is the basic syntax for
    an if-else statement:


    ```javascript

    1 if (condition) {

    2 // code to run if condition is true

    3 } else {

    4 // code to run if condition is false

    5 }

    ```


    Let’s add an else clause to our conditional statement:


    ```javascript

    1 if (7 < 5) {

    2 console.log(''7 is less than 5'')

    3 } else {

    4 console.log(''The condition is false'')

    5 }

    ```


    Since 7 is not less than 5, running the above code should return the string “The
    condition is false”.


    Conditional statements are an essential tool for creating programs that can adapt
    to different circumstances and make decisions based on the data they receive.
    We’ll cover more complex conditional statements and other ways we can write them
    as we progress.


    ## Variables in JavaScript


    ### Introduction


    It’s not easy to write JavaScript code without using variables. So far, we’ve
    done an excellent job of avoiding them, but it’s time you learned about one of
    the most important concepts in programming.


    A **variable** is a named location for storing data in the computer’s memory.
    In simple words, it’s a container in which we can store all kinds of data, like
    numbers, text, pieces of code, and even other variables. So, think of a variable
    as a box with a label on it. The label is the variable’s name, and the content
    of the box is the variable’s value.


    Here’s an example of a variable in JavaScript:


    ```javascript

    1 let myName = ''Ebenezer Don''

    ```


    In this example, we created a variable named “myName” and stored the string value
    “Ebenezer Don” inside it. This is called **variable declaration**. The variable
    declaration is made up of four parts: the declaration keyword, the variable name,
    the assignment symbol (=), and the variable value.


    ### The declaration keyword


    The keyword let is one of the ways you can declare a variable in JavaScript. There
    are other ways to declare variables, but let is the most common one. You’ll learn
    about the other variable declaration keywords as we progress. *In JavaScript,
    a keyword is a reserved word with a specific purpose.*


    ### The variable name


    The variable name in this example is myName. It’s a good practice to use descriptive
    names for your variables because when the name of your variable represents its
    value, your code is easier to understand.


    ### The assignment symbol (=)


    The assignment symbol (=) is used to assign a value to a variable. It’s also called
    the assignment operator, and there are other operators in JavaScript, like the
    addition operator (+), the subtraction operator (-), the multiplication operator
    (*), and the division operator (/). You’ll learn about them in the next chapter.


    ### The variable value


    In our example, the variable value is the string “Ebenezer Don.” The value of
    a variable can be of any type, including numbers, strings, booleans, or other
    variables.


    We can use the console.log() function to print the variable’s value to the console.
    In addition to the code above, run the following console.log statement in your
    browser’s console:


    ```javascript

    1 console.log(myName)

    ```


    This will print the value of the variable myName to the console. We can also reassign
    a variable’s value by using the assignment operator (=). So if we want to change
    the value myName to “Jane Butters,” we could do so by writing this line of code:


    ```javascript

    1 myName = ''Jane Butters''

    ```


    Now, if you rerun the console.log statement, you’ll get the string “Jane Butters”
    printed.


    ### Variable declaration and assignment


    There are several ways to declare a variable in JavaScript, each with its use
    case.


    ### The let keyword


    The let keyword is the most common way to declare a variable in JavaScript. It’s
    used to create local variables, which are variables that are accessible only within
    a block of code. Here’s an example of a local variable with the let keyword:


    ```javascript

    1 if (true) {

    2 let message = ''JavaScript is awesome!''

    3 }

    4 console.log(message)

    ```


    In this example, the message variable is local and is only accessible within the
    block of code enclosed in the curly braces. So you’ll get an error if you try
    to access it outside this block.


    **Global variables**, the other hand, are variables that are accessible from anywhere
    in your code. If you want to create a global variable with the let keyword, you
    can do so by declaring it outside your code blocks. Here’s an example of a global
    variable with the let keyword:


    ```javascript

    1 let name = ''Jane''

    2 3 if (true) {

    4 console.log(name)

    5 }

    ```


    Running this code will return the string value “Jane” to the console. This is
    because the name variable is global and is accessible from anywhere in code.


    ### The var keyword


    The var keyword is the oldest way to declare a variable in JavaScript and is used
    to create global variables. So, if we used the var keyword in our first example
    to declare the message variable, we wouldn’t get an error. Here’s an example of
    a global variable with the var keyword:


    ```javascript

    1 if (true) {

    2 var message = ''JavaScript is awesome!''

    3 }

    4  console.log(message)

    ```


    The above code will not return any errors because the message variable is global.
    This means that it is accessible from anywhere in the code, including outside
    the block of code in which it was declared.


    It’s important to be careful when using global variables. Since they can be accessed
    from anywhere in your code, global variables can cause problems. For example,
    if you declare a global variable with the same name as a local variable in your
    code, the global variable will overwrite the local variable; this can lead to
    unexpected results and confusion in your code.

