    are some of the most common mouse events:


    • click - occurs when a user clicks on an element


    • dblclick - occurs when a user double-clicks on an element


    • mousedown - occurs when a user presses down on a mouse


    button while over an element


    • mouseup - occurs when a user releases a mouse button while


    over an element


    • mouseover - occurs when a user moves the mouse over an


    element'
  - '[PAGE 171]


    Browser Events


    166


    • mouseout - occurs when a user moves the mouse off of an


    element


    • mousemove - occurs when a user moves the mouse while over


    an element


    • wheel - occurs when a user scrolls the mouse wheel while over


    an element


    **Keyboard Events**


    Keyboard events are triggered by actions performed with the key-


    board, such as typing and pressing keys. Some common keyboard


    events include:


    • keydown - triggered when a key is pressed down


    • keyup - triggered when a key is released


    • keypress - triggered when a key is pressed and released


    **Form Events**


    Form events are triggered when a user interacts with a form, such


    as submitting it. Some common form events include:


    • submit - triggered when a form is submitted


    • reset - triggered when a form is reset


    **Window Events**


    Window events are triggered when a user interacts with the


    browser window, such as resizing it or scrolling through a page.


    Some common window events include:'
  - '[PAGE 172]


    Browser Events


    167


    • load - triggered when a page is loaded


    • unload - triggered when a page is unloaded


    • resize - triggered when the browser window is resized


    • scroll - triggered when the user scrolls through a page


    To use these events, we can add event listeners to the window object.


    *The* *window* *object represents the browser window and is the global*


    *object in a browser.* The document object, on the other hand, repre-


    sents the HTML document and is a property of the window object.


    So you can access the document object by using window.document or


    just document. The alert() function is also a property of the window


    object, so you can access it by using window.alert() instead of


    just alert(). The window object has other properties and methods


    like the load property and the addEventListener() method. For


    example, if we want to log a message to the console when the


    page is loaded, we can add an event listener to the window object


    that listens for the load event. Add the following code to your


    browserEvents.js file, then reload the page:


    1


    window.addEventListener(''load'', () => {


    2


    window.alert(''The page has loaded!'')


    3


    })


    Now, when you reload the page, you should see an alert message


    that says “The page has loaded!”. Let’s try another example by


    logging the value of the window.innerWidth property to the con-


    sole when the window is resized. The window.innerWidth prop-


    erty returns the width of the browser window in pixels. In your


    browserEvents.js file, add the following code:


    1


    window.addEventListener(''resize'', () => {


    2


    console.log(window.innerWidth)


    3


    })'
  - '[PAGE 173]


