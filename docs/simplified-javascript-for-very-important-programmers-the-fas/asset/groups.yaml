    \  .appendChild(textNode)\n```\n\n你应该能看到新文本被添加到 #dom-example 元素中。\n\n我们在文本之前添加了一个空格，以便将其与\
    \ #dom-example \n元素中的现有文本隔离开来。\n\n### 从 DOM 中移除元素\n\n我们可以使用 `removeChild` 方法从\
