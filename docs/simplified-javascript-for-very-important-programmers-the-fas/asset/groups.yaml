- md: "\n## JavaScript Objects\n\n90\n\n**Object destructuring**\n\nObject destructuring\
    \ is another way to access the properties of an object. With destructuring, we\
    \ can extract values from an object and assign them to variables with the same\
    \ name as the object’s properties. It is done by enclosing the properties in curly\
    \ braces {} on the left-hand side of the assignment operator =. Let’s see an example.\
    \ First, we’ll create an object that stores information about an attendee at a\
    \ conference:\n\n```javascript\nconst attendee = {\n  name: 'Peter Okoye',\n \
    \ age: 30,\n  email: 'peterokoye@nonexistentmail.com',\n  ticketType: 'VIP',\n\
    }\n```\n\nNow, let’s access the properties of the attendee object using destructuring:\n\
    \n```javascript\nconst { name, age, email, ticketType } = attendee;\n\nconsole.log(name)\n\
    // Output: \"Peter Okoye\"\n\nconsole.log(age)\n// Output: 30\n\nconsole.log(email)\n\
    // Output: \"peterokoye@nonexistentmail.com\"\n\nconsole.log(ticketType)\n// Output:\
    \ \"VIP\"\n```\n\nWe don’t have to destructure all the properties of the object\
    \ at once. We can destructure only the properties we need:\n\n```javascript\n\
    const { name } = attendee;\n```\n\nWe can also assign default values to the variables\
    \ in case the object doesn’t have the property:\n\n```javascript\nconst { name,\
    \ isPaid = false } = attendee;\n\nconsole.log(isPaid)\n// Output: false\n```\n\
    \nWe can assign a different name to the variable by using the colon : and the\
    \ new name after the property name. This is useful when we want to avoid naming\
    \ conflicts:\n\n```javascript\nconst { name: attendeeName } = attendee;\n\nconsole.log(attendeeName)\n\
    // Output: \"Peter Okoye\"\n```\n\n**Destructuring arrays**\n\nWe can also similarly\
    \ destructure arrays. Let’s create an array that stores the names of the attendees\
    \ at a conference:\n\n```javascript\nconst attendeeNames = [\n  'Peter Okoye',\n\
    \  'Paul Okoye',\n  'Lynda Okoye',\n  'Rita Okoye',\n]\n```\n\nTo destructure\
    \ the array, we enclose the elements in square brackets [] on the left-hand side\
    \ of the assignment operator =. Since the elements of an array are not named,\
    \ we can only destructure them in the order they appear in the array. So the first\
    \ element of the array will be assigned to the first variable, the second element\
    \ to the second variable, and so on. Let’s destructure the attendeeNames array:\n\
    \n```javascript\nconst [\n  firstAttendee,\n  secondAttendee,\n  thirdAttendee,\n\
    \  fourthAttendee\n] = attendeeNames;\n\nconsole.log(firstAttendee)\n// Output:\
    \ \"Peter Okoye\"\n\nconsole.log(thirdAttendee)\n// Output: \"Lynda Okoye\"\n\
    ```\n\nWe can also destructure only the elements we need by skipping the elements\
    \ we don’t need with commas ,. Let’s skip the second element of the array:\n\n\
    ```javascript\nconst [firstAttendee, , thirdAttendee] = attendeeNames;\n```\n\n\
    Object and array destructuring can make code more readable and concise by simplifying\
    \ the process of extracting values from objects and arrays, and assigning them\
    \ to variables. That being said, whether or not to use object and array destructuring\
    \ depends on the specific use case and personal preference. In some cases, it\
    \ might be unnecessary, but in most cases where you find yourself reusing object\
    \ properties or assigning them to variables, it’s a good idea to consider destructuring.\n\
    \n## Conditional Statements\n\nWe’ve learned about basic conditional statements\
    \ and how to use the if-else statement to execute code based on a condition. Conditional\
    \ statements are used to control the flow of a program, just like you live your\
    \ everyday life. You make decisions based on your circumstances and execute different\
    \ actions accordingly. For example, if you’re cold, you might wear a jacket; if\
    \ it’s raining, you might wear a raincoat instead; and if it’s sunny, you might\
    \ wear a t-shirt. You can use the basic if-else statement to handle the first\
    \ condition (if it’s cold), but when you need to check multiple conditions, you’ll\
    \ need more complex conditional statements like the else-if and switch statements.\n\
    \n### **Else-if statements in JavaScript**\n\nTo check multiple conditions, you\
    \ can use an else-if clause. The else-if clause allows you to chain several conditional\
    \ statements together so that if the first condition is not met, the second condition\
    \ is checked, and so on. Here’s a simple example to illustrate how the else-if\
    \ clause works:\n\n```text\nif it's cold: wear a jacket\nelse if it's raining:\
    \ wear a raincoat\nelse: wear a t-shirt\n```\n\nLet’s see an example in JavaScript.\
    \ We’ll use the console.log() method to display text on the console if a condition\
    \ is met:\n\n```javascript\nif (weather === 'cold') {\n  console.log(\"wear a\
    \ jacket\");\n} else if (weather === 'raining') {\n  console.log(\"wear a raincoat\"\
    );\n} else {\n  console.log(\"wear a t-shirt\");\n}\n```\n\n(Note: The OCR text\
    \ for the example code was fragmented across pages; the logic above follows standard\
    \ JS if-else structure as described in the source.)\n"
  mdcn: "\n\n## JavaScript 对象\n\n90\n\n**对象解构**\n\n对象解构是访问对象属性的另一种方法。通过解构，我们可以从对象中提取值并将它们赋值给与对象属性同名的变量。这是通过在赋值运算符\
    \ `=` 的左侧用大括号 `{}` 包裹属性来实现的。让我们来看一个例子。首先，我们先创建一个存储会议参与者信息的对象：\n\n```javascript\n\
    const attendee = {\n  name: 'Peter Okoye',\n  age: 30,\n  email: 'peterokoye@nonexistentmail.com',\n\
    \  ticketType: 'VIP',\n}\n```\n\n现在，让我们使用解构来访问 `attendee`对象的属性：\n\n```javascript\n\
    const { name, age, email, ticketType } = attendee;\n\nconsole.log(name)\n// 输出:\
    \ \"Peter Okoye\"\n\nconsole.log(age)\n// 输出: 30\n\nconsole.log(email)\n// 输出:\
    \ \"peterokoye@nonexistentmail.com\"\n\nconsole.log(ticketType)\n// 输出: \"VIP\"\
    \n```\n\n我们不需要一次性解构对象的所有属性。我们可以只解构我们需要的属性：\n\n```javascript\nconst { name } =\
    \ attendee;\n```\n\n如果对象没有该属性，我们还可以为变量分配默认值：\n\n```javascript\nconst { name, isPaid\
    \ = false } = attendee;\n\nconsole.log(isPaid)\n// 输出: false\n```\n\n我们可以通过使用冒号\
    \ `:` 在属性名后加上新名称来为变量指定不同的名称。这在我们想要避免命名冲突时非常有用：\n\n```javascript\nconst { name:\
    \ attendeeName } = attendee;\n\nconsole.log(attendeeName)\n// 输出: \"Peter Okoye\"\
    \n```\n\n**数组解构**\n\n我们同样可以类似地解构数组。让我们创建一个存储会议参与者姓名的数组：\n\n```javascript\nconst\
    \ attendeeNames = [\n  'Peter Okoye',\n  'Paul Okoye',\n  'Lynda Okoye',\n  'Rita\
    \ Okoye',\n]\n```\n\n要解构数组，我们需要在赋值运算符 `=` 的左侧用方括号 `[]` 包裹元素。由于数组元素没有名称，我们只能按照它们在数组中出现的顺序进行解构。因此，数组的第一个元素将赋值给第一个变量，第二个元素赋值给第二个变量，依此类推。让我们解构\
    \ `attendeeNames` 数组：\n\n```javascript\nconst [\n  firstAttendee,\n  secondAttendee,\n\
    \  thirdAttendee,\n  fourthAttendee\n] = attendeeNames;\n\nconsole.log(firstAttendee)\n\
    // 输出: \"Peter Okoye\"\n\nconsole.log(thirdAttendee)\n// 输出: \"Lynda Okoye\"\n\
    ```\n\n我们也可以通过用逗号 `,` 跳过不需要的元素来只解构我们需要的元素。让我们跳过数组的第二个元素：\n\n```javascript\nconst\
    \ [firstAttendee, , thirdAttendee] = attendeeNames;\n```\n\n对象和数组解构可以通过简化从对象和数组中提取值并将其赋值给变量的过程，使代码更加简洁简洁。尽管如此，是否使用对象和数组解构取决于具体的用法和个人偏好。在某些情况下，可能是没必要的，但在大多数你发现反复使用对象属性或将其赋值给变量的情况下，考虑解构是一个好主意。\n\
    \n## 条件语句\n\n我们已经学习了基本的条件语句以及如何使用 `if-else` 语句根据条件执行代码。条件语句用于控制程序的流程，就像我们过日常生活一样。你根据自己的情况做决定并相应执行不同的操作。例如，如果你觉得冷，你可能会穿外套；如果在下雨，你可能会穿雨衣；如果天气晴，你可能会穿\
    \ T 恤。你可以使用基础的 `if-else` 语句处理第一个条件（如果冷的话），但当你需要检查多个条件时，你需要更复杂的条件语句，如 `else if`\
    \ 和 `switch` 语句。\n\n### JavaScript 中的 else-if 语句\n\n要检查多个条件，可以使用 `else if` 子句。`else\
    \ if` 子句允许你将多个条件语句链在一起，使得如果第一个条件不满足，就会检查第二个条件，依此类推。这里有一个说明 `else if` 子句如何工作的简单示例：\n\
    \n```text\n如果冷：穿外套\n否则如果在下雨：穿雨衣\n否则：穿 T 恤\n```\n\n让我们来看一个 JavaScript 示例。我们将使用\
    \ `console.log()` 方法在满足条件时在控制台上输出显示文本：\n\n```javascript\nif (weather === 'cold')\
    \ {\n  console.log(\"wear a jacket\");\n} else if (weather === 'raining') {\n\
    \  console.log(\"wear a raincoat\");\n} else {\n  console.log(\"wear a t-shirt\"\
    );\n}\n```\n\n"
