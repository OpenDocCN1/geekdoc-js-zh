    \ a 6\n```\nIf the first roll is a 6, the loop will run only once. If it takes\
    \ 10 rolls, the loop will run 10 times. The while loop will continue to run as\
    \ long as the condition is true. In this case, the condition is that dieRoll is\
    \ not equal to 6. So once the value of dieRoll is 6, the loop will stop running.\
    \ In a while loop, the condition is checked before the loop runs. If we had assigned\
    \ dieRoll a value of 6 when we declared it, the loop would never run because the\
    \ condition would be false from the start:\n\n```javascript\nlet dieRoll = 6\n\
    \nwhile (dieRoll !== 6) {\n  dieRoll = Math.ceil(Math.random() * 6)\n  console.log(`You\
    \ rolled a ${dieRoll}`)\n}\n```\nIn a while loop, we must ensure that the condition\
    \ will eventually be met. Otherwise, the loop will run indefinitely. See how we\
    \ updated dieRoll in every iteration. If we didn’t do that, dieRoll would always\
    \ be 0 in our first example, and the condition dieRoll !== 6 would always be true,\
    \ which would cause the loop to run forever. When a loop runs indefinitely, it’s\
    \ called an **infinite loop**.\n\nLet’s try removing the line that updates dieRoll.\
    \ Running an infinite loop like this will cause your browser to freeze, so keep\
    \ your cursor close to the X button (for closing the tab) so that you can stop\
    \ it from crashing your browser:\n\n```javascript\nlet dieRoll = 0\n\nwhile (dieRoll\
    \ !== 6) {\n  console.log(`You rolled a ${dieRoll}`)\n}\n```\n\n### **The do...while\
    \ Loop**\n\nA do...while loop is similar to a while loop, but unlike the while\
    \ loop, the condition is checked after the loop runs. This means that the loop\
    \ will always run at least once. So in our second example with the dice game,\
    \ where we assigned dieRoll a value of 6 upon declaration, the do...while loop\
    \ would still run once:\n\n```javascript\nlet dieRoll = 6\n\ndo {\n  dieRoll =\
    \ Math.ceil(Math.random() * 6)\n  console.log(`You rolled a ${dieRoll}`)\n} while\
    \ (dieRoll !== 6)\n```\n\n### **number-guessing-game**\n\nThe do...while loop\
