- md: "\n## Functions\n\n### **toUpperCase()**\n\nThe toUpperCase() method is used\
    \ to convert a string to uppercase.\n\nWe can use this method on any string and\
    \ it’ll return a new string\nwith all uppercase characters of the original string.\
    \ Let’s see an example:\n\n```javascript\nlet message = 'Hello World'\nconsole.log(message.toUpperCase())\n\
    // output: HELLO WORLD\n```\n\nThe toUpperCase() method does not change the original\
    \ string.\nInstead, it returns a new string. So the message variable will remain\n\
    the same:\n\n```javascript\nconsole.log(message)\n// output: Hello World\n```\n\
    \n### **toLowerCase()**\n\nThe toLowerCase() method converts a string to lowercase.\
    \ Like the toUpperCase() method, it does not change the original string. Let’s\
    \ try an example with the message variable we created above:\n\n```javascript\n\
    console.log(message.toLowerCase())\n// output: hello world\n```\n\n### **trim()**\n\
    \nThe trim() method removes whitespace from the beginning and end\nof a string:\n\
    \n```javascript\nlet message = ' Hello World '\nconsole.log(message.trim())\n\
    // output: Hello World\n```\n\nOne important concept to understand is that these\
    \ methods are chainable, meaning that you can call one method after another on\
    \ the same string to perform multiple operations in a single line of code. Let’s\
    \ try an example that demonstrates chaining multiple built-in methods to manipulate\
    \ a string:\n\n```javascript\nlet message = ' Hello World '\nconsole.log(message.trim().toUpperCase())\n\
    // output: HELLO WORLD\n```\n\nIn the example above, we first call the trim()\
    \ method on the message variable to remove the whitespace from the beginning and\
    \ end of the string. Then we call the toUpperCase() method on the result of the\
    \ trim() method to convert the string to uppercase.\n\nBuilt-in methods in JavaScript\
    \ provide a lot of functionality for writing readable and concise code. There\
    \ are some other useful string methods that we’ll cover as we progress through\
    \ this book.\nIt’s important to have a good understanding of the methods we’ve\
    \ covered so far, and how you can use them to write efficient code.\n\n### **JS\
    \ Math functions**\n\nJavaScript has a built-in Math object that has properties\
    \ and methods for mathematical constants and operations. Let’s take a look at\
    \ some of the most commonly used methods.\n\n### **Math.round()**\n\nThe Math.round()\
    \ method returns the value of a number rounded to the nearest integer. Let’s see\
    \ an example:\n\n```javascript\nconsole.log(Math.round(4.7))\n// output: 5\n```\n\
    \n### **Math.ceil()**\n\nThe Math.ceil() method returns the value of a number\
    \ rounded up to its nearest integer. If a number is already an integer, the method\
    \ will return the same number:\n\n```javascript\nconsole.log(Math.ceil(4.2))\n\
    // output: 5\nconsole.log(Math.ceil(5))\n// output: 5\n```\n\nThe “ceil” in the\
    \ method name stands for “ceiling”, which is a mathematical term for rounding\
    \ up to the nearest integer.\n\n### **Math.floor()**\n\nThe Math.floor() method\
    \ returns the value of a number rounded down to its nearest integer. Like the\
    \ Math.ceil() method, if a number is already an integer, the method will return\
    \ the same number:\n\n```javascript\nconsole.log(Math.floor(4.7))\n// output:\
    \ 4\nconsole.log(Math.floor(4))\n// output: 4\n```\n\nThe “floor” in the method\
    \ name is the opposite of “ceiling”.\n\n### **Math.random()**\n\nThe Math.random()\
    \ method returns a random number between 0 (inclusive), and 1 (exclusive):\n\n\
    ```javascript\nconsole.log(Math.random())\n// output: 0.3218232744225875\n```\n\
    \nThe generated number will be different every time you run the code and is always\
    \ less than 1. If you want to generate a random number between 0 and 10, you can\
    \ multiply the result of Math.random() by 10:\n\n```javascript\nconsole.log(Math.random()\
    \ * 10)\n// output: 8.688668583064922\n```\n\n### **Math.max()**\n\nThe Math.max()\
    \ method returns the largest value of a set of numbers. The method expects these\
    \ numbers to be passed as individual arguments. Let’s see an example:\n\n```javascript\n\
    console.log(Math.max(1, 2, 3, 4, 5))\n// output: 5\n```\n\nCalling Math.max()\
    \ with no arguments will return -Infinity:\n\n```javascript\nconsole.log(Math.max())\n\
    // output: -Infinity\n```\n\nIf you pass a non-number argument to Math.max(),\
    \ it will return NaN (not a number):\n\n```javascript\nconsole.log(Math.max(1,\
    \ 2, 3, 4, 5, 'a'))\n// output: NaN\n```\n\n### **Math.min()**\n\nThe Math.min()\
    \ method returns the smallest value of a set of numbers:\n\n```javascript\nconsole.log(Math.min(1,\
    \ 2, 3, 4, 5))\n// output: 1\n```\n\nThere are a few other useful methods in the\
    \ Math object but these are the most commonly used ones. We can use these methods\
    \ together to perform complex mathematical operations. For example, since Math.random()\
    \ always returns a decimal number, we can wrap it in the Math.floor() method to\
    \ round it down to the nearest integer so that our generated number is always\
    \ a whole number:\n\n```javascript\nconsole.log(Math.floor(Math.random() * 10))\n\
    // output: 3\n```\n\n## **Arrays**\n\nIn JavaScript, we use arrays to store multiple\
    \ values in a single variable. These values can be of any data type, including\
    \ numbers, strings, and even other arrays. You can also think of an array as a\
    \ data structure that stores a list of items. Arrays are a fundamental building\
    \ block of many JavaScript programs. They are used in various contexts, from simple\
    \ data lists to more complex data structures. Let’s learn how to create, access,\
    \ and manipulate arrays in JavaScript.\n\n### **Declaring and Initializing Arrays**\n\
    \nYou can use the Array constructor or the square bracket [] notation to create\
    \ an empty array. In JavaScript, we use constructors to create data structures\
    \ with a specific set of properties. Let’s create an empty array using the Array\
    \ constructor. To use a constructor, we need the new keyword:\n\n```javascript\n\
    const myArray = new Array()\n```\n\nTo create an empty array using the square\
    \ bracket notation, you can write:\n\n```javascript\nconst myArray = []\n```\n\
    \nBoth statements create an empty array that you can add elements to later.\n\n\
    You can also initialize an array with elements by passing them as arguments to\
    \ the Array constructor or using the square bracket notation and separating the\
    \ elements with commas.\n\n```javascript\nconst favoriteFruits = new Array(\n\
    \  'apple',\n  'banana',\n  'orange'\n)\nor\nconst favoriteFruits = ['apple',\
    \ 'banana', 'orange']\n```\n\n### **Accessing and modifying Array Elements**\n\
    \nTo access elements in an array, you can use the square bracket notation, along\
    \ with the index of the element you want to access. The index of an element is\
    \ its position in an array, and when locating it, we start counting from 0. So,\
    \ the first element of an array has an index of 0, the second element an index\
    \ of 1, the third element an index of 2, and so on. In our favoriteFruits array,\
    \ the first element is ‘apple’ with an index of 0, the second element is ‘banana’\
    \ with an index of 1, and the third element is ‘orange’ with an index of 2. Let’s\
    \ use the square bracket notation to access the first element of the favoriteFruits\
    \ array:\n\n```javascript\nfavoriteFruits[0]\n```\n\nThis will return the string\
    \ ‘apple’ when logged to the console:\n\n```javascript\nconsole.log(favoriteFruits[0])\n\
    // output: apple\n```\n\nIf we want to access the second element, we can write:\n\
    \n```javascript\nfavoriteFruits[1]\n// output: banana\n```\n\nYou can modify the\
    \ elements in an array by reassinging the value of a specific index. Let’s change\
    \ the value of the first element in the favoriteFruits array to ‘strawberry’:\n\
    \n```javascript\nfavoriteFruits[0] = 'strawberry'\n```\n\nNow, if you log the\
    \ first element of the favoriteFruits array to the console, you’ll get ‘strawberry’\
    \ instead of ‘apple’:\n\n```javascript\nfavoriteFruits[0]\n// output: strawberry\n\
    ```\n\nAlso, logging the entire array to the console will show the updated value:\n\
    \n```javascript\nconsole.log(favoriteFruits)\n// output: ['strawberry', 'banana',\
    \ 'orange']\n```\n\n### **Array Length**\n\nThe length property of an array returns\
    \ the number of elements in it. Let’s get the length of the favoriteFruits array:\n\
    \n```javascript\nconsole.log(favoriteFruits.length)\n// output: 3\n```\n\nUnlike\
    \ Array index, the length of an array is not zero-based. So, when counting the\
    \ number of elements in an array, we start from 1. In our favoriteFruits array,\
    \ the length is 3, which means that it has 3 elements.\n"
