- md: "\n## The Document Object Model (DOM)\n\n```javascript\nlet textNode = document.createTextNode(\n\
    \  ' Learning the DOM requires practice'\n)\ndocument.querySelector('#dom-example')\n\
    \  .appendChild(textNode)\n```\n\nYou should see the new text appended to the\
    \ #dom-example element.\n\nWe added a space before the text so that it would be\
    \ separated from\nthe current text in the #dom-example element.\n\n### Removing\
    \ elements from the DOM\n\nWe can use the removeChild method to remove an element\
    \ from the\nDOM. The removeChild method takes one argument, which is the\nelement\
    \ to be removed. Let’s remove the #dom-definition element:\n\n```javascript\n\
    document.body.removeChild(\n  document.querySelector('#dom-definition')\n)\n```\n\
    \nWe can also use the innerHTML property to set the value of an\nelement to an\
    \ empty string. This will remove all of the element’s\nchildren. Let’s remove\
    \ the #dom-example element:\n\n```javascript\ndocument.querySelector('#dom-example').innerHTML\
    \ = ''\n```\n\nRemember that the DOM is a live representation of the web page,\n\
    so any changes you make to it will be reflected in the browser.\nHowever, when\
    \ you refresh the page, the DOM will be reset to its\noriginal state.\n\n### Traversing\
    \ the DOM\n\nTo traverse the DOM means to move through the elements of the\nDOM\
    \ Tree. Let’s make some changes to our index.html file so that\nwe can have some\
    \ more elements to work with. Replace the content\nof your file with the following\
    \ code, then refresh the page in your\nbrowser:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Learning the DOM</title>\n</head>\n<body>\n  <h1>Using\
    \ JavaScript to access the DOM</h1>\n  <div id=\"dom-intro\">\n    <p id=\"dom-definition\"\
    >\n      DOM stands for Document Object Model\n    </p>\n    <p id=\"dom-example\"\
    >\n      We can use the DOM to manipulate the content of a\n      web page\n \
    \   </p>\n  </div>\n</body>\n</html>\n```\n\nIn the new HTML code, we wrapped\
    \ the p elements in a div element\nwith an id of “dom-intro”. Let’s see how we\
    \ can access the DOM\nelements using their relationship to one another.\n\n###\
    \ The parentNode property\n\nThe parentNode property returns the parent node of\
    \ the element\non which it is called. Let’s use the parentNode property of the\n\
    #dom-definition element to access its parent node:\n\n```javascript\ndocument.querySelector('#dom-definition').parentNode\n\
    // Output: <div id=\"dom-intro\">...</div>\n```\n\nWe can also chain the parentNode\
    \ property to access an element’s\ngrandparent node:\n\n```javascript\ndocument.querySelector('#dom-definition').parentNode\n\
    \  .parentNode\n// Output: <body>...</body>\n```\n\n### The childNodes property\n\
    \nThe childNodes property returns a NodeList of all child nodes of an\nelement,\
    \ including element nodes and non-element nodes like text\nnodes.\n\nHere’s an\
    \ example using the childNodes property of the #dom-intro\nelement to access its\
    \ child nodes:\n\n```javascript\ndocument.querySelector('#dom-intro').childNodes\n\
    // Output: NodeList(5) [text, p#dom-definition, text, p#dom-example, text]\n```\n\
    \nThe child nodes include:\n- A text node with the value \"\\n \" (representing\
    \ the linebreak\nbetween the elements on the page.)\n- A <p> element node with\
    \ the id of “dom-definition”\n- A text node with the value \"\\n \"\n- A <p> element\
    \ node with the id of “dom-example”\n- A text node with the value \"\\n \"\n\n\
    ### The children property\n\nThe children property is similar to the childNodes\
    \ property but it\nreturns an HTMLCollection of only the child element nodes:\n\
    \n```javascript\ndocument.querySelector('#dom-intro').children\n// Output: HTMLCollection(2)\
    \ [p#dom-definition, p#dom-example]\n```\n\n### The firstChild and lastChild properties\n\
    \nThe firstChild property returns the first child node of an ele-ment, including\
    \ non-element nodes. The lastChild property re- the last child node of an element,\
    \ also including non-element\nnodes. Let’s use the firstChild and lastChild properties\
    \ of the\n#dom-intro element to access its first and last child nodes:\n\n```javascript\n\
    document.querySelector('#dom-intro').firstChild\n// Output: #text\n\ndocument.querySelector('#dom-intro').lastChild\n\
    // Output: #text\n```\n\n### The firstElementChild and lastElementChild properties\n\
    \nThe firstElementChild and lastElementChild properties return\nthe first and\
    \ last child element nodes of an element respectively.\nUnlike the firstChild\
    \ and lastChild properties, only element\nnodes are returned:\n\n```javascript\n\
    document.querySelector('#dom-intro').firstElementChild\n// Output: <p id=\"dom-definition\"\
    >DOM stands for Document Object Model</p>\n\ndocument.querySelector('#dom-intro').lastElementChild\n\
    // Output: <p id=\"dom-example\">We can use the DOM to manipulate the content\
    \ of a web page</p>\n```\n\n### The nextSibling and previousSibling properties\n\
    \nThe nextSibling property returns the next sibling node of an ele-ment, including\
    \ non-element nodes. The previousSibling property\nreturns the previous sibling\
    \ node of an element, also including\nnon-element nodes. Let’s use the nextSibling\
    \ and previousSibling\nproperties of the #dom-definition element to access its\
    \ next and\nprevious sibling nodes:\n\n```javascript\ndocument.querySelector('#dom-definition').nextSibling\n\
    // Output: #text\n\ndocument.querySelector('#dom-definition').previousSibling\n\
    // Output: #text\n```\n\n### The nextElementSibling and previousElementSibling\
    \ properties\n\nUnlike the nextSibling and previousSibling properties, the\nnextElementSibling\n\
    and previousElementSibling\nproperties return only element nodes:\n\n```javascript\n\
    document.querySelector('#dom-definition')\n  .nextElementSibling\n// Output: <p\
    \ id=\"dom-example\">We can use the DOM to manipulate the content of a web page</p>\n\
    \ndocument.querySelector('#dom-definition')\n  .previousElementSibling\n// Output:\
    \ null\n```\n\n### Conclusion\n\nThe Document Object Model is a powerful tool\
    \ that allows us to\nmake our web pages dynamic and interactive. It’s an essential\
    \ part\nof web development, and it’s important to understand how it works.\nCreate\
    \ some more HTML files and use them to practice accessing\nand modifying the DOM\
    \ with JavaScript. You can also visit your\nfavorite websites and use the browser’s\
    \ developer tools to explore\nthe DOM.\n\n## How to include JavaScript in an HTML\
    \ file\n\nSo far, we’ve practiced JavaScript by running it in the console. But\n\
    as we begin to work with web pages and the DOM, we’ll need to\ninclude JavaScript\
    \ in our HTML files. We can do this by using the\n<script> tag to write our JavaScript\
    \ code directly in the HTML file,\nor by creating a separate JavaScript file with\
    \ the .js extension and\nlinking to it in the HTML file. Let’s look at both of\
    \ these options.\n\n### Writing JavaScript in the HTML file\n\n**(inline JavaScript)**\n\
    \nThe simplest way to include JavaScript in an HTML file is by adding\nthe code\
    \ directly to the HTML document using the <script> tag.\nThis is usually referred\
    \ to as inline JavaScript. We can include the\nJavaScript code in the head or\
    \ body section of the document, but it’s\nusually best to put it in the body section\
    \ so that the HTML content is\nloaded before the JavaScript code. Let’s look at\
    \ an example. Create\na new HTML file called js-in-html.html and add the following\n\
    code:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JS in HTML</title>\n\
    </head>\n<body>\n  <h1>JS in HTML</h1>\n  <script>\n    alert('Hey everyone!')\n\
    \  </script>\n</body>\n</html>\n```\n\nIn the example above, we’ve added an alert()\
    \ method call to\nthe HTML file. When the page loads, the browser will run the\n\
    JavaScript code and display the alert box with the message “Hey\neveryone!”. You\
    \ can see this in action by opening the HTML file in\nyour browser.\n\nWhile inline\
    \ JavaScript can be a quick solution for small projects\nor adding simple functionality,\
    \ it’s not the best option for larger\nprojects. If we want to include a lot of\
    \ JavaScript code in our HTML\nfile, it can become difficult to read and maintain.\
    \ It’s also not very\nefficient, as the browser will have to parse the JavaScript\
    \ code every\ntime the page loads. For these reasons, it’s usually better to create\n\
    a separate JavaScript file and link to it in the HTML file.\n\n### Creating a\
    \ separate JavaScript file\n\n**(external JavaScript)**\n\nThe most common way\
    \ to include JavaScript in an HTML file is\nby creating a separate JavaScript\
    \ file with the .js extension and\nlinking to it in the HTML file. Let’s look\
    \ at an example. In the\n"
  mdcn: "\n\n## 文档对象模型 (DOM)\n\n```javascript\nlet textNode = document.createTextNode(\n\
