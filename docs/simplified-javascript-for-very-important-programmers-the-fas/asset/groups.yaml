    \nThis method is less common but can be useful in some cases. If you find the\
    \ switch statement confusing, it’s okay to use an if-else statement instead.\n\
    \nRemember always to include a break keyword after each case. Otherwise, your\
    \ switch statement will continue to execute the code blocks for the remaining\
    \ cases, even after the first match is found:\n\n```javascript\nconst day = 'Monday'\n\
    \nswitch (day) {\n  case 'Monday':\n    console.log('Today is Monday!')\n  case\
    \ 'Tuesday':\n    console.log('Today is Tuesday!')\n  case 'Wednesday':\n    console.log('Today\
    \ is Wednesday!')\n  case 'Thursday':\n    console.log('Today is Thursday!')\n\
    \  case 'Friday':\n    console.log('Today is Friday!')\n  case 'Saturday':\n \
    \   console.log('Today is Saturday!')\n  case 'Sunday':\n    console.log('Today\
    \ is Sunday!')\n  default:\n    console.log('That is not a day of the week!')\n\
    }\n```\n\n*// output: Today is Monday!*\n*// output: Today is Tuesday!*\n*// output:\
    \ Today is Wednesday!*\n\n106\n\n*// output: Today is Thursday!*\n*// output:\
    \ Today is Friday!*\n*// output: Today is Saturday!*\n*// output: Today is Sunday!*\n\
    *// output: That is not a day of the week!*\n\nThe switch statement is usually\
    \ more structured and easy to read when the cases are simple and well-defined.\
    \ However, whether a switch statement or an if-else statement is more efficient\
    \ can depend on the specific use case.\n\n### The ternary operator\n\nThe ternary\
    \ operator is a shorthand way to write an if-else statement. It’s a conditional\
    \ operator that takes three operands: a condition, an expression to execute if\
    \ the condition is true, and an expression to execute if the condition is false.\
    \ Here’s what the syntax looks like:\n\n```javascript\ncondition ? expression1\
    \ : expression2\n```\n\nTo use a ternary operator, you start by writing a condition\
    \ followed by a question mark (?). Then, you write an expression that will be\
    \ executed if the condition is true. Finally, you write a colon (:) and an expression\
    \ that will be executed if the condition is false. The colon represents the else\
    \ clause and is required in the ternary operator.\n\nLet’s look at an example\
    \ using a variable that stores a person’s age. We want to log a string to the\
    \ console based on the person’s age. If the person is 18 or older, we’ll log “You\
    \ can vote”; if the person is less than 18, we’ll log “You can’t vote”. First,\
    \ we’ll do it using an if-else statement:\n\n107\n\n```javascript\nlet age = 18\n\
    \nif (age >= 18) {\n  console.log('You can vote')\n} else {\n  console.log(\"\
    You can't vote\")\n}\n```\n\n*// output: You can vote*\n\nHere’s how we can do\
    \ it using the ternary operator:\n\n```javascript\nlet age = 18\n\nage >= 18\n\
    \  ? console.log('You can vote')\n  : console.log(\"You can't vote\")\n```\n\n\
    *// output: You can vote*\n\nThe ternary operator is much shorter than the if-else\
    \ statement but can be difficult to read in cases like this. It’s mainly used\
    \ when assigning a value to a variable based on a condition:\n\n```javascript\n\
    let age = 18\nlet canVote = age >= 18 ? true : false\n\nconsole.log(canVote)\n\
    ```\n\n*// output: true*\n\nSee that the ternary operator is much easier to read\
    \ here. It’s a great way to simplify your code when working with simple conditions.\n\
    \nYou can also nest ternary operators:\n\n108\n\n```javascript\nlet score = 80\n\
    \nlet grade = score >= 90 ? 'A' : score >= 70 ? 'B' : 'C'\n\nconsole.log(grade)\n\
    ```\n\n*// output: B*\n\nIn the above example, the ternary operator checks if\
    \ the value of score is greater than or equal to 90. It assigns the string ‘A’\
    \ to the grade variable if it is. If it’s not, it checks if the value of score\
    \ is greater than or equal to 70. If it is, it assigns the string ‘B’ to the grade\
    \ variable, else it assigns the string ‘C’ to the grade variable.\n\nNesting ternary\
    \ operators can make your code difficult to read, so it’s best to avoid doing\
    \ so when possible. If you find yourself nesting ternary operators, you should\
    \ consider using an if-else statement instead:\n\n```javascript\nlet score = 80\n\
    let grade = ''\n\nif (score >= 90) grade = 'A'\nelse if (score >= 70) grade =\
    \ 'B'\nelse grade = 'C'\n```\n\nConditional statements are an important part of\
    \ any programming language. Without them, you wouldn’t be able to build programs\
    \ that can make decisions and perform different actions based on conditions or\
    \ user input.\n\n## Loops\n\nWe’ve seen how to use Array methods like forEach\
    \ and map to iterate over the elements in an array. In programming, we call this\
    \ looping. To loop means to repeat a process until a condition is met. It could\
    \ be until a specified number of times, a specific action is completed, or a value\
    \ is reached. It is a fundamental concept in programming and is used in several\
    \ ways. JavaScript has different types of loops, apart from the array methods\
    \ we’ve seen, which allow for more control over the looping process. These are\
    \ the for loop, the while loop, and the do...while loop. Let’s take a look at\
    \ each of these.\n\n### The for Loop\n\nLet’s say we have an array of numbers,\
    \ [1, 2, 3, 4, 5], and want to multiply each element by 2. We could use the map\
    \ method to do this:\n\n```javascript\nlet numbers = [1, 2, 3, 4, 5]\n\nlet doubled\
    \ = numbers.map((number) => number * 2)\n\nconsole.log(doubled) // [2, 4, 6, 8,\
    \ 10]\n```\n\nEach time we use the map method, the process is the same: we call\
    \ the method on an array, pass in a callback function, and return a new array.\n\
    \nOn the other hand, a for loop allows for more control over the iteration process.\
    \ With the for loop, we can add conditions and directly manipulate elements in\
    \ an array rather than returning a new array. Here’s how we could use a for loop\
    \ to multiply each element in the numbers array by 2:\n\n```javascript\nlet numbers\
    \ = [1, 2, 3, 4, 5]\n\nfor (let i = 0; i < numbers.length; i++) {\n  numbers[i]\
    \ = numbers[i] * 2\n}\n\nconsole.log(numbers) // [2, 4, 6, 8, 10]\n```\n\nThe\
    \ for loop is made up of three parts: the initialization, the condition, and the\
    \ final expression.\n\nThe **initialization** is where we declare a variable and\
    \ set it equal to a starting value. In this case, we set i equal to 0. We use\
    \ this variable to keep track of the index of the array, and we can name it whatever\
    \ we want. i is a common variable name for this purpose. The variable is declared\
    \ with the let keyword because we want to be able to change the value of the variable\
    \ as the loop runs.\n\nThe **condition** is a boolean expression that determines\
    \ the number of times a loop will run and when it will stop. Without it, the loop\
    \ will continue indefinitely. In this case, the loop will continue to run as long\
    \ as i is less than the length of the array.\n\nThe **final expression** is where\
    \ we increment or decrement the variable. In our example, we increment i by 1\
    \ in each iteration. So the first time the loop runs, i is 0. The second time,\
    \ i is 1, and so on. This is how we can access each element in the array. The\
    \ loop will continue to run until the condition is no longer met.\n\nSince the\
    \ for loop gives us more control over the iteration process, we can also keep\
    \ the values of the original array and create a new one with the doubled values\
    \ if we want to. Here’s how we could do that:\n\n111\n\n```javascript\nlet numbers\
    \ = [1, 2, 3, 4, 5]\n\nlet doubled = []\n\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  doubled.push(numbers[i] * 2)\n}\n\nconsole.log(doubled) // [2, 4,\
    \ 6, 8, 10]\n```\n\nHere, we first create an empty array called doubled, then\
    \ we use the for loop to iterate over the numbers array. Inside the loop, we push\
    \ the doubled value of each element into the doubled array. In most cases, when\
    \ iterating over an array, it’s easier to use the map method. However, the for\
    \ loop may be more appropriate if we need more control over how the array is manipulated.\n\
    \n### the continue keyword\n\nThe continue keyword is used to skip the current\
    \ iteration of a loop and continue with the next one. For example, if we want\
    \ to print all the numbers from 1 to 10 except for 5. We can use the continue\
    \ keyword to skip the number 5:\n\n```javascript\nfor (let i = 1; i <= 10; i++)\
    \ {\n  if (i === 5) {\n    continue\n  }\n  console.log(i)\n}\n```\n"
