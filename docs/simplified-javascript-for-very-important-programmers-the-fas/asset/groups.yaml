    ## Accessing elements more specifically with getElementById and getElementsByClassName


    So far, you’ve seen how to access elements with a certain tag by

    using the getElementsByTagName method. However, most of the

    time, you’ll need to access elements more specifically. For example,

    if you have multiple p elements that represent different content on

    your web page, it’ll be difficult to use the getElementsByTagName

    method to identify the p element you want, since it returns an

    HTMLCollection of p tags without any direct information about

    their content. Instead, you can access elements more specifically

    by using the id or class attributes.


    ### The getElementById method


    The getElementById method of the document object is used to access

    an element by its id attribute. Since the HTML id attribute is

    unique, we can use it to directly identify a specific element on a

    web page. Let’s add another p element to our web page, and give

    both p elements an id attribute. Modify your index.html file to look

    like this:


    1


    <!DOCTYPE html>

    2

    <html>

    <head>

    <title>Learning the DOM</title>

    </head>

    <body>

    <h1>Using JavaScript to access the DOM</h1>

    <p id="dom-definition">

    DOM stands for Document Object Model

    </p>

    <p id="dom-example">

    We can use the DOM to manipulate the content of a

    web page

    </p>

    </body>

    </html>


    Now, we can access the p elements by using the getElementById

    method of the document object. This method takes a string argument,

    which is the value of the id attribute of the element we want

    to access. To access the p element with the id attribute of “dom-

    definition”, type the following code in your browser console:


    1


    document.getElementById(''dom-definition'')


    2


    3


    *// Output: <p id="dom-definition">DOM stands for Document*

    * Object Model</p>*


    See that this directly returns the p element with the id attribute of

    “dom-definition”. We can also access its text content by using the

    textContent property:


    1


    document.getElementById(''dom-definition'').textContent


    2


    3


    *// Output: DOM stands for Document Object Model*


    Let’s also get the text content of the p element with id attribute of

    “dom-example”:


    1


    document.getElementById(''dom-example'').textContent


    2


    3


    *// Output: We can use the DOM to manipulate the content*

    * of a web page*


    With the id attribute and the getElementById method, it’s easy to

    access a specific element on a web page. However, if you have

    multiple elements with the same id attribute, the getElementById

    method will only return the first element it finds. To identify multiple-

    elements in the same category, you can use the class attribute

    instead, together with the getElementsByClassName method.


    ### The getElementsByClassName method


    The getElementsByClassName method of the document object is used to

    access elements by their class attribute. The class attribute is

    not unique, so this method returns an HTMLCollection of elements

    with the same class attribute. Let’s give the p elements in our

    index.html file a class attribute of “paragraph”:


    1<p id="dom-definition" class="paragraph">

    DOM stands for Document Object Model

    </p>

    4<p id="dom-example" class="paragraph">

    We can use the DOM to manipulate the content of a

    page

    </p>


    Now, we can access all elements with the class attribute of “para-

    graph” by using the getElementsBy method. This method

    takes a string argument, which is the value of the class attribute

    of the elements we want to access. Run the following code in your

    browser console:


    1


    document.getElementsByClassName(''paragraph'')


    2


    3


    *// Output: HTMLCollection(2) [p#dom-definition.paragraph,*

    * p#dom-example.paragraph]*


    In the output p#dom-definition.paragraph, the p represents the

    tag name, # represents the id attribute, and . represents the class

    attribute. So #dom-definition means that the element has an id attribute of “dom-definition”,
    and .paragraph means that the element

    has a class attribute of “paragraph”.


    ## Accessing elements with querySelector and queryAll methods


    The querySelector and queryAll methods are similar

    to the getElementById and getClassName methods, but

    allow us to access elements more flexibly. With these methods,

    we can access elements using their id, class or any other

    attribute. We can also access elements by their tag name, or by a

    combination of their tag name and attribute. Let’s see how these

    methods work.


    The querySelector method of the document object is used to access

    the first element that matches a specified selector. A selector is

    a string that specifies the element or elements to be selected. For

    example, the selector p will select all p elements on a web page. The

    querySelector method takes the selector as an argument and re-

    turns the first element that matches it. Let’s use the querySelector

    method to select the first p element on our web page:


    1


    document.querySelector(''p'')


    2


    3


    *// Output: <p id="dom-definition" class="paragraph">*

    *// DOM stands for Document Object Model</p>*


    On the other hand, the querySelectorAll method returns a

    **NodeList** of all elements that match the specified selector. A

    NodeList is similar to an HTMLCollection, but is a more general

    list that can contain elements of different node types including

    text nodes, comment nodes, and document nodes. Both a NodeList

    and an HTMLCollection are array-like objects, so we can access

    their elements by index.

