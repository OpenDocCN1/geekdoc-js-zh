    onclick for the click event or onscroll for the scroll event. For


    example, we can also add a click event listener to the button by


    setting its onclick property to an event handler function:


    1


    button.onclick = () => {


    2


    console.log(''You clicked me!'')


    3


    }


    When an event handler function is executed, the browser passes an


    event object as an argument to the function. This object contains


    information about the event that occurred. For example, the event


    object passed into a click event function contains information


    about the element that was clicked on. We can access this informa-


    tion by using the target property of the event object. For example,


    if we wanted to log the element that was clicked on, we could do


    the following:


    1


    button.onclick = (event) => {


    2


    console.log(event.target)


    3


    }


    Let’s work with another HTML file so that you can see how


    event listeners work in practice. Create a new file named


    browserEvents.html and add the following code:'
