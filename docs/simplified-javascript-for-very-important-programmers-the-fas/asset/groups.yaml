    which we can use to access all elements of the webpage. For example, to access
    the title element, we can use the document’s title property. In the browser console,
    type the following code:


    `document.title`


    This will return the text “My Web Page”. The title property of the document object
    is a reference to the title element of the web page. We can also access the head
