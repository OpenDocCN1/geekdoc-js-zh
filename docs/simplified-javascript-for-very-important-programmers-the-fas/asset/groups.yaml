- md: "\n## Browser Storage\n\nWhen building web applications, you’ll often need to\
    \ store data on the browser for various purposes like caching (storing data locally\
    \ to improve performance), storing user preferences, or storing user data for\
    \ easy retrieval. For this reason, modern browsers provide several mechanisms\
    \ for client-side storage, including cookies, LocalStorage, and SessionStorage.\n\
    \n### Cookies\n\nCookies are small pieces of data that are stored on a user’s\
    \ computer by the web browser. They were designed to be a reliable mechanism for\
    \ websites to remember stateful information (such as items added to the shopping\
    \ cart in an online store) or to record the user’s browsing activity and store\
    \ small amounts of data that could be used to persist information between page\
    \ requests.\n\nCookies are typically stored in key-value pairs, and each cookie\
    \ is associated with a specific domain. So a website can only access cookies it\
    \ has set. Cookies are also limited in size, and can only store a maximum of 4KB\
    \ of data. They can be set to expire at a specific time, after which they will\
    \ be deleted by the browser. If a cookie does not have an expiration date, it\
    \ is considered a session cookie and will be deleted when the user closes the\
    \ browser. However, not all browsers automatically delete session cookies when\
    \ the browser is closed, and there may be other factors that influence the behavior\
    \ of cookies in the browser, such as user settings or extensions.\n\nSince cookies\
    \ are associated with a specific domain, you’ll have to run your web page on a\
    \ server to set and retrieve cookies. If you’re working with VS Code or another\
    \ extensive code editor, you can install the **Live Server** extension or something\
    \ similar to run your web page. In VS Code, for example, after installing the\
    \ extension, right-click on any of your HTML files and select **Open with Live\
    \ Server**. If not, you can use any other local server like the Node.js http-server\
    \ package.\n\n### Storing Data in Cookies\n\nWith your web page running on a server,\
    \ let’s learn how to work with cookies by practice. We can set a cookie using\
    \ the document.cookie property. This property is a string that contains all the\
    \ cookies for the current domain. Let’s set a cookie that expires on November\
    \ 23, 2035:\n\n```javascript\ndocument.cookie = 'name=Ada Lovelace; expires=Fri,\
    \ 23 Nov 2035 12:00:00 UTC; path=/';\n```\n\nIn this example, the key-value pair\
    \ name=Ada Lovelace is the actual data stored in the cookie, and the expires and\
    \ path attributes are optional parameters that control the lifetime and accessibility\
    \ of the cookie. The expires attribute specifies the expiration date of the cookie,\
    \ and the path attribute specifies the path for which the cookie is valid. If\
    \ the path attribute is not specified, the cookie will be valid for the entire\
    \ domain.\n\nTo add a new cookie, we can set the document.cookie property again.\
    \ This will append the new cookie to the existing string of cookies. Let’s add\
    \ a new cookie with the key-value pair favorite_language=JavaScript:\n\n```javascript\n\
    document.cookie = 'favorite_language=JavaScript';\nconsole.log(document.cookie)\n\
    // // \"name=Ada Lovelace; favorite_language=JavaScript\"\n```\n\n### Retrieving\
    \ Data from Cookies\n\nWe can retrieve the value of a cookie by using the document.cookie\
    \ property. However, this property returns a string of all the cookies for the\
    \ current domain, so we’ll need to split the string into an array of individual\
    \ cookies using the split() method. The split() method is a string method that\
    \ takes a separator as an argument and returns an array of substrings. The separator\
    \ is used to determine where each substring begins and ends. Since the cookies\
    \ are separated by a semicolon and a space, we’ll use “; ” as the separator:\n\
    \n```javascript\nconst cookies = document.cookie.split('; ');\nconsole.log(cookies)\n\
    // // [\"name=Ada Lovelace\", \"favorite_language=JavaScript\"]\n```\n\nLet’s\
    \ retrieve the value of the name cookie. We can’t always be sure of the order\
    \ in which the cookies are stored, so we’ll need to iterate through the array\
    \ of cookies and check check each one to see if it starts with the string name.\
    \ If it does, we’ll return that cookie. We can use the find() method to do this:\n\
    \n```javascript\nconst nameCookie = cookies.find((cookie) =>\n  cookie.startsWith('name')\n\
    )\n\nconsole.log(nameCookie)\n// // output: \"name=Ada Lovelace\"\n```\n\nRemember\
    \ that cookies have a limited size of 4KB, so they’re not suitable for storing\
    \ large amounts of data. Cookies are also sent to the server with every request,\
    \ so they can slow down the performance of your web application if there are too\
    \ many of them. So when working with cookies, it’s best to store small amounts\
    \ of data that are necessary for the application to function. If you need to store\
    \ a larger amount of data, you can consider using LocalStorage or SessionStorage.\n\
    \n### LocalStorage and SessionStorage\n\nLocalStorage and SessionStorage are more\
    \ recent additions to the browser storage options, and they offer several advantages\
    \ over cookies. Like cookies, they allow web applications to store data on the\
    \ client, but they have a larger storage capacity (typically around 5MB) and they\
    \ don’t send the data to the server with every request like cookies do.\n\nLocalStorage\
    \ and SessionStorage are similar in that they both store data on the client, but\
    \ they differ in how long the data is stored. LocalStorage stores data with no\
    \ expiration date, so the data will persist even after the browser window is closed.\
    \ SessionStorage, on the other hand, stores data for only one session. This means\
    \ that the data is deleted when the user closes the browser window or tab.\n\n\
    Let’s see how we can use LocalStorage and SessionStorage to store data. We’ll\
    \ start with LocalStorage, then we’ll move on to SessionStorage.\n\n### LocalStorage\n\
    \nLocalStorage is a property of the window object, so we can access it using window.localStorage.\
    \ The localStorage property is an object that contains a setItem() method for\
    \ setting data and a getItem() method for retrieving data. Let’s store the username\
    \ for a user in LocalStorage. We’ll use the localStorage.setItem() method for\
    \ this. This method takes two arguments: the key and the value. The key is a string\
    \ that will be used to retrieve the value. The value can be any data type, but\
    \ it will be converted to a string when stored in LocalStorage and can be converted\
    \ back to its original state when retrieved.\n\nLet’s store the username ada_loelace:\n\
    \n```javascript\nlocalStorage.setItem('username', 'ada_loelace')\n```\n\nTo retrieve\
    \ the value of the username key, we can use the localStorage.getItem() method.\
    \ This method takes a key as an argument and returns the value associated with\
    \ that key. Let’s retrieve the value of the username key:\n\n```javascript\nconst\
    \ username = localStorage.getItem('username')\nconsole.log(username)\n// // output:\
    \ \"ada_loelace\"\n```\n\nWe can also log the localStorage object to see all the\
    \ keys stored in LocalStorage:\n\n```javascript\nconsole.log(localStorage)\n//\
    \ // output: Storage {username: \"ada_loelace\"}\n```\n\n### Storing and Retrieving\
    \ Arrays and Objects\n\nArrays are automatically converted to strings when stored\
    \ in LocalStorage, so we can store an array of usernames:\n\n```javascript\nconst\
    \ allUsernames = [\n  'ada_loelace',\n  'grace_hopper',\n  'alan_turing',\n]\n\
    localStorage.setItem('allUsernames', allUsernames)\n\nconst storedUsernames =\
    \ localStorage.getItem('allUsernames')\nconsole.log(storedUsernames)\n// // output:\
    \ \"ada_loelace,grace_hopper,alan_turing\"\n```\n\nTo convert the string back\
    \ to an array, we can use the split() method:\n\n```javascript\nconst usernamesArray\
    \ = storedUsernames.split(',')\nconsole.log(usernamesArray)\n// // [\"ada_loelace\"\
    , \"grace_hopper\", \"alan_turing\"]\n```\n\nObjects on the other hand need to\
    \ be first converted to strings before being stored in LocalStorage. If you try\
    \ to store an object directly, it will be automatically converted to the string\
    \ [object Object] instead of the actual object data. This is because JavaScript’s\
    \ default toString() method returns the string [object Object] when called on\
    \ an object.\n\nTo convert an object to a string, we can use the JSON.stringify()\
    \ method. This method takes an object as an argument and returns a string representation\
    \ of that object.\n"
  mdcn: "\n\n## 浏览器存储\n\n在构建 Web 应用时，你通常需要向浏览器中存储数据，用于各种目的，例如缓存（在本地存储数据以提高性能）、存储用户偏好或存储用户数据以便于检索。由于这些原因，现代浏览器提供了几种客户端存储机制，包括\
    \ Cookies、LocalStorage 和 SessionStorage。\n\n### Cookies\n\nCookies 是由 Web浏览器存储在用户计算机上的小段数据。它们被设计为一种可靠的机制，让网站能够记住状态信息（例如在线商店中添加到购物车的物品），或记录用户的浏览活动并存储少量数据，以便在页面请求之间持久化信息。\n\
    \nCookies 通常以键值对的形式存储，并且每个 Cookie 都与特定的域关联。因此，一个网站只能访问它设置的 Cookies。Cookies 的大小也受到限制，最多只能存储\
    \ 4KB 的数据。它们可以被设置为在特定时间过期，到期后由浏览器删除。如果 Cookie 没有设置过期日期，它将被视为会话 Cookie（session\
    \ cookie），并在用户关闭浏览器时被删除。然而，并非所有浏览器都会在关闭时自动删除会话 Cookie，可能还有其他影响浏览器中 Cookie 行为的因素，例如用户设置或扩展程序。\n\
    \n由于 Cookies 与特定域关联，你必须在服务器上运行你的网页来设置和检索 Cookies。如果你正在使用 VS Code 或其他强大的代码编辑器，可以安装\
    \ **Live Server** 扩展或类似的插件来运行你的网页。例如，在 VS Code 中，安装扩展后，右键点击任何 HTML 文件并选择 **Open\
    \ with Live Server**（用 Live Server 打开）。如果没有，你可以使用任何其他本地服务器，例如 Node.js 的 http-server\
    \ 软件包。\n\n### 在 Cookies 中存储数据\n\n当你的网页在服务器上运行时，让我们通过实践来学习如何操作 Cookies。我们可以使用 `document.cookie`\
    \ 属性来设置 Cookie。该属性是一个包含当前域所有 Cookies 的字符串。让我们设置一个在 2035 年 11 月 23 日期过期的 Cookie：\n\
    \n```javascript\ndocument.cookie = 'name=Ada Lovelace; expires=Fri, 23 Nov 2035\
    \ 12:00:00 UTC; path=/';\n```\n\n在这个示例中，键值对 `name=Ada Lovelace` 是存储在 Cookie 中的实际数据，而\
    \ `expires` 和 `path` 属性是可选参数，用于控制 Cookie 的生存时间和访问范围。`expires` 属性指定 Cookie 的过期日期，`path`\
    \ 属性指定 Cookie 有效的路径。如果没有指定 `path` 属性，则 Cookie 对整个域有效。\n\n要添加新 Cookie，我们可以再次设置\
    \ `document.cookie` 属性。这将新 Cookie 追加到现有的 Cookie 字符串中。让我们添加一个键值对为 `favorite_language=JavaScript`\
    \ 的 Cookie：\n\n```javascript\ndocument.cookie = 'favorite_language=JavaScript';\n\
    console.log(document.cookie)\n// // \"name=Ada Lovelace; favorite_language=JavaScript\"\
    \n```\n\n### 从 Cookies 中检索数据\n\n我们可以通过 `document.cookie` 属性检索 Cookie 的值。然而，该属性返回的是当前域所有\
    \ Cookies 的字符串，因此我们需要使用 `split()` 方法将字符串拆分为单个 Cookie 的数组。`split()` 方法是一个字符串方法，接受一个分隔符作为参数并返回子字符串数组。分隔符用于确定每个子字符串的开始和结束。由于\
    \ Cookie 是用分号和空格分隔的，我们将使用\"; \"` 作为分隔符：\n\n```javascript\nconst cookies = document.cookie.split(';\
    \ ');\nconsole.log(cookies)\n// // [\"name=Ada Lovelace\", \"favorite_language=JavaScript\"\
    ]\n```\n\n让我们检索 `name` Cookie 的值。我们无法总是确定 Cookie 存储的顺序，因此需要遍历 Cookie 数组并检查每个项，看它是否以字符串\
    \ `name` 开。如果是，我们就返回该 Cookie。我们可以使用 `find()` 方法来完成操作：\n\n```javascript\nconst\
    \ nameCookie = cookies.find((cookie) =>\n  cookie.startsWith('name')\n)\n\nconsole.log(nameCookie)\n\
    // // output: \"name=Ada Lovelace\"\n```\n\n记住 Cookies 的大小限制为 4KB，因此它们不适合存储大量数据。Cookies\
    \ 还会随每次请求发送到服务器，因此如果 Cookie 太多，可能会减慢你 Web 应用的性能。所以，在处理 Cookies 时，最好只存储应用程序运行必需的少量数据。如果你需要存储更多数据，可以考虑使用\
    \ LocalStorage 或 SessionStorage。\n\n### LocalStorage 和 SessionStorage\n\nLocalStorage\
    \ 和 SessionStorage 是浏览器存储选项中较新添加的内容，与 Cookies 相比它们具有几个优势。像 Cookies 一样，它们允许 Web\
    \ 应用在客户端存储数据，但它们具有更大的存储容量（通常约为 5MB），并且不会像 Cookies 那样随每个请求将数据发送到服务器。\n\nLocalStorage\
    \ 和 SessionStorage 的相似之处在于它们都在客户端存储数据，但不同之处在于数据存储的时间。LocalStorage 存储的数据没有过期日期，因此在关闭浏览器窗口后数据将依然存在。相反，SessionStorage\
    \ 仅为单个会话存储数据。这意味着当用户关闭浏览器窗口或标签页时，数据会被删除。\n\n让我们看看如何使用 LocalStorage 和 SessionStorage\
    \ 存储数据。我们将从 LocalStorage 开始，然后是 SessionStorage。\n\n### LocalStorage\n\nLocalStorage\
    \ 是 window 对象的的一个属性，我们可以通过 `window.localStorage` 访问它。`localStorage` 是一个包含 `setItem()`\
    \ 方法（设置数据）和 `getItem()` 方法（检索数据）的对象。让我们在 LocalStorage 中存储用户名 ada_loelace：\n\n\
    ```javascript\nlocalStorage.setItem('username', 'Ada Lovelace')\n```\n\n要检索 `username`\
    \ 键的值，我们可以使用 `localStorage.getItem()` 方法。该方法接受一个键作为参数并返回与该键关联的值。让我们检索 `username`\
    \ 的值：\n\n```javascript\nconst username = localStorage.getItem('username')\nconsole.log(username)\n\
    // // output: \"Ada Lovelace\"\n```\n\n我们也可以打印 `localStorage` 对象来查看在 LocalStorage\
    \ 中的所有键：\n\n```javascript\nconsole.log(localStorage)\n// // output: Storage {username:\
    \ \"Ada Lovelace\"}\n```\n\n### 存储和检索数组与对象\n\n数组在存储到 LocalStorage 时会自动转换为字符串，因此我们可以存储一个用户名数组：\n\
    \n```javascript\nconst allUsernames = [\n  'ada_loelace',\n  'grace_hopper',\n\
    \  'alan_turing',\n]\nlocalStorage.setItem('allUsernames', allUsernames)\n\nconst\
    \ storedUsernames = localStorage.getItem('allUsernames')\nconsole.log(storedUsernames)\n\
    // // output: \"ada_loelace,grace_hopper,alan_turing\"\n```\n\n要将字符串转换数组，可以使用\
    \ `split()` 方法：\n\n```javascript\nconst usernamesArray = storedUsernames.split(',')\n\
    console.log(usernamesArray)\n// // [\"ada_loelace\", \"grace_hopper\", \"alan_turing\"\
    ]\n```\n\n而对象在存储到 LocalStorage 之前需要先转换为字符串。如果你尝试直接存储一个对象，它会被自动转换为字符串 `[object\
    \ Object]`，而不是实际的对象数据。这是因为 JavaScript 默认的 `toString()` 方法在对象上调用时会返回字符串 `[object\
    \ Object]`。\n\n要将对象转换为字符串，可以使用 `JSON.stringify()` 方法。该方法接受一个对象作为参数并返回该对象的字符串表示。\n\
    \n### SessionStorage\n\nSessionStorage 与 LocalStorage 非常相似，但它仅在页面会话中有效。这意味着当用户关闭标签页或浏览器时，SessionStorage\
    \ 中的数据会被清除。\n\n我们可以以相同的方式操作数据：\n\n```javascript\nconst user = {\n  name: 'Ada',\n\
    \  role: 'Developer'\n};\nsessionStorage.setItem('user', JSON.stringify(user));\n\
    \nconst retrievedUserString = sessionStorage.getItem('user');\nconst retrievedUser\
    \ = JSON.parse(retrievedUserString);\nconsole.log(retrievedUser.name); // // output:\
    \ \"Ada\"\n```\n\n"
