    \ `a - b`，使得第一个元素在第二个元素之前（即较小的数字在较大的数字之前）：\n\n```javascript\nfamousBirthYears.sort((a,\
    \ b) => a - b)\n\nconsole.log(famousBirthYears)\n// 输出: [1989, 1990, 1993, 2001,\
    \ 2005, 2020, 2023]\n```\n\n### reverse() **\n\n我们可以使用 `reverse()` 方法来反转数组中元素的顺序。`reverse`\
    \ 方法会修改原始数组。让我们来看一个示例：\n\n```javascript\nconst agesOfStudents = [13, 10, 15, 12,\
    \ 11, 14]\n\nagesOfStudents.reverse()\n\nconsole.log(agesOfStudents)\n// 输出: [14,\
    \ 11, 12, 15, 10, 13]\n```\n\n注意，`reverse()` 方法并没有对数组元素进行排序。相反，它反转了从最后一个元素到第一个元素的顺序。\n\
    \n### reduce() **\n\n`reduce()` 方法将数组减少为单个值。它遍历数组，对每个元素执行一个操作，并返回一个单一值。例如，如果我们想累加数字数组中的所有元素，可以使用\
    \ `reduce()` 方法：\n\n```javascript\nconst participantPoints = [10, 20, 30, 40,\
    \ 50]\n\nconst totalPoints = participantPoints.reduce(\n  (a, b) => a + b\n)\n\
    \nconsole.log(totalPoints)\n// 输出: 150\n```\n\n`reduce()` 方法接受一个带有两个参数 `a` 和 `b`\
    \ 的回调函数，这两个参数代表数组中的两个元素。回调函数会从数组的第一个元素开始执行操作。在我们的示例中，我们将第一个元素加上第二个元素，然后将结果加上第三个元素，依此类推，直到我们得到总分。如果我们想减去数组中的元素，我们将返回\
    \ `a - b`：\n\n```javascript\nconst minusedPoints = participantPoints.reduce(\n\
    \  (a, b) => a - b\n)\n\nconsole.log(totalPoints)\n// 输出: -130\n```\n\n我们上面的示例执行了操作：`10\
    \ - 20 - 30 - 40 - 50`。我们可以使用相同的过程来乘以数组中的元素：\n\n```javascript\nconst multipliedPoints\
    \ = participantPoints.reduce(\n  (a, b) => a * b\n)\n\nconsole.log(multipliedPoints)\n\
    // 输出: 12000000\n```\n\n这一次，我们将第一个元素乘以第二个元素，然后将结果乘以第三个元素，依此类推。`reduce()` 方法不会修改原始数组。\n\
    \n我们还可以使用 `reduce()` 方法来拼接字符串数组中的元素：\n\n```javascript\nconst favoriteDishes =\
    \ ['jollof', 'burger', 'yam', 'meatloaf', 'pizza']\n\nconst favoriteDishes = favoriteDishes.reduce(\n\
    \  (a, b) => a + ', ' + b\n)\n\nconsole.log(favoriteDishes)\n// 输出: jollof, burger,\
    \ yam, meatloaf, pizza\n```\n\n"
