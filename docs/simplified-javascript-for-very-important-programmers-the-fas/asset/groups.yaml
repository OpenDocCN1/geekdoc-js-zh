- md: "\n## Asynchronous JavaScript\n\nAsynchronous we can use the Fetch API to make\
    \ a GET request that retrieves the data from the JSON file. In the same directory\
    \ as the data.json file, create an HTML file called fetchExample.html and add\
    \ the following code to it:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\" />\n  <title>Fetch API</title>\n</head>\n<body>\n  <script\
    \ src=\"./fetchExample.js\"></script>\n</body>\n</html>\n```\n\nNext, create a\
    \ JavaScript file in the same directory called fetchExample.js. In our JavaScript\
    \ file, we’ll use the fetch() method to make a GET request to the data.json file.\
    \ The fetch() method takes a URL as its first argument and returns a Promise that\
    \ resolves to a Response object:\n\n```javascript\nlet fetchRequest = fetch('./data.json')\n\
    \nconsole.log(fetchRequest)\n```\n\nWhen you open the fetchExample.html file in\
    \ your browser, you’ll see a CORS error in the console. *CORS stands for Cross-Origin\
    \ Resource Sharing and is a mechanism that allows restricted resources on a web\
    \ page to be requested from another domain outside the domain from which the first\
    \ resource was served.* To avoid this error, we’ll need to run a local server.\
    \ If you’re working with VS Code, you can install the Live Server extension. Once\
    \ you’ve installed the extension, right-click on the fetchExample.html file and\
    \ select “Open with Live Server”. If not, you can use any other local server like\
    \ the Node.js http-server package.\n\nOnce you’ve started the local server, you’ll\
    \ see that the fetchRequest variable contains a Promise object with the status\
    \ “pending”:\n\n```javascript\nPromise {<pending>}\n```\n\nThe returned Promise\
    \ will resolve to a Response object when the request is complete. Let’s use the\
    \ then() method to handle the Promise when it resolves. We’ll log the Response\
    \ object to the console:\n\n```javascript\nfetchRequest.then((response) => {\n\
    \  console.log(response)\n})\n```\n\nThe resolved response should look like this:\n\
    \n```javascript\nResponse {body: ReadableStream, status: 200, type: \"cors\",...}\n\
    ```\n\nThe Response object contains information about the response, including\
    \ the status code, the type of response, and the body of the response. The body\
    \ property contains a ReadableStream object that we can use to read the data that\
    \ was returned from the server. We can use the json() method to convert the response\
    \ data to a JavaScript object. The json() method returns a Promise that resolves\
    \ to a JavaScript object, so we’ll chain another then() method to handle the Promise\
    \ when it resolves:\n\n```javascript\nfetchRequest\n  .then((response) => {\n\
    \    return response.json()\n  })\n  .then((data) => {\n    console.log(data)\n\
    \  })\n```\n\nThe data variable will contain the JavaScript object that was returned\
    \ from the server:\n\n```javascript\n(3) [{...}, {...}, {...}]\n0: {name: \"John\"\
    , age: 30}\n1: {name: \"Sara\", age: 22}\n2: {name: \"Bill\", age: 40}\nlength:\
    \ 3\n__proto__: Array(0)\n```\n\nLet’s use the data variable to display the user\
    \ data on the page. We’ll create a ul element and add a li element for each user.\
    \ Update the fetchExample.js file to look like this:\n\n```javascript\nlet fetchRequest\
    \ = fetch('./data.json')\n\nfetchRequest\n  .then((response) => {\n    return\
    \ response.json()\n  })\n  .then((data) => {\n    let ul = document.createElement('ul')\n\
    \n    data.forEach((user) => {\n      let li = document.createElement('li')\n\
    \      li.textContent = `${user.name} is ${user.age}`\n      ul.appendChild(li)\n\
    \    })\n\n    document.body.appendChild(ul)\n  })\n```\n\nWhen you refresh the\
    \ page, you should see the user data displayed on the page:\n\n- John is 30\n\
    - Sara is 22\n- Bill is 40\n\n## Async/Await\n\nThe async and await keywords were\
    \ introduced in ES2017 to make working with Promises easier. For example, we can\
    \ simplify the Fetch request in the fetchExample.js file by using the async and\
    \ await keywords:\n\n```javascript\nlet fetchUsers = async () => {\n  let response\
    \ = await fetch('./data.json')\n  console.log(response)\n}\n\nfetchUsers()\n//\
    \ Response {body: ReadableStream, status: 200, type: \"cors\",...}\n```\n\nThe\
    \ async keyword is used to define an asynchronous function, while the await keyword\
    \ is used to wait for a Promise to resolve, and can only be used inside an async\
    \ function. In our example, we started by defining an asynchronous arrow function\
    \ called fetchUsers(). We can also use the async keyword with a regular function\
    \ declaration:\n\n```javascript\nasync function fetchUsers() {\n  // ...\n}\n\
    ```\n\nInside the fetchUsers() function, we used the await keyword to wait for\
    \ the fetch() method to resolve. When we use the await keyword in a variable declaration,\
    \ the variable will be assigned the resolved value of the Promise. In our example,\
    \ the response variable will be assigned the resolved value of the fetch() Promise.\
    \ We can then use the await keyword to wait for the json() method to resolve.\
    \ We’ll create a new variable named data and assign it the resolved value of the\
    \ json() Promise. Inside the fetchUsers() function, we’ll log the data variable\
    \ to the console:\n\n```javascript\nlet response = await fetch('./data.json')\n\
    let data = await response.json()\n\nconsole.log(data)\n```\n\nWhen you refresh\
    \ the page, you’ll see the same user data that we saw in the previous example:\n\
    \n```javascript\n(3) [{...}, {...}, {...}]\n0: {name: \"John\", age: 30}\n1: {name:\
    \ \"Sara\", age: 22}\n2: {name: \"Bill\", age: 40}\nlength: 3\n__proto__: Array(0)\n\
    ```\n\nWe can now use the data variable to display the user data on the page:\n\
    \n```javascript\nlet fetchUsers = async () => {\n  let response = await fetch('./data.json')\n\
    \  let data = await response.json()\n\n  let ul = document.createElement('ul')\n\
    \n  data.forEach((user) => {\n    let li = document.createElement('li')\n    li.textContent\
    \ = `${user.name} is ${user.age}`\n    ul.appendChild(li)\n  })\n\n  document.body.appendChild(ul)\n\
    }\n```\n\nWhen you refresh the page, you should see the user data displayed on\
    \ the page:\n\n- John is 30\n- Sara is 22\n- Bill is 40\n\nWe can use the try\
    \ and catch keywords to handle errors in an async function. Let’s update the fetchUsers()\
    \ function to use the try and catch keywords. We’ll wrap the code that we want\
    \ to execute in a try block, and then use the catch keyword to handle any errors\
    \ that occur:\n\n```javascript\nlet fetchUsers = async () => {\n  try {\n    let\
    \ response = await fetch('./data.json')\n    let data = await response.json()\n\
    \  } catch (error) {\n    // Handle the error\n    console.log(error)\n  }\n}\n\
    ```\n\nThis will catch any errors that occur in the try block, including errors\
    \ that occur in the fetch() method and the json() method. The async and await\
    \ keywords help us write asynchronous code that looks more like synchronous code,\
    \ avoiding the need to chain different .then() methods. However, the async and\
    \ await keywords are just syntactic sugar (syntax that is added to make the code\
    \ easier to read) for Promises, and they don’t change the underlying mechanism\
    \ of how Promises work.\n\nWe’ve successfully used the Fetch API to retrieve data\
    \ from our data.json file. We can also make an HTTP request to a server in the\
    \ same way. Let’s update the fetchUsers() function to make an HTTP request to\
    \ the GitHub API. We can get the data for any user with their username. We’ll\
    \ try an example with mine:\n\n```javascript\nlet fetchUsers = async () => {\n\
    \  try {\n    let response = await fetch(\n      'https://api.github.com/users/ebenezerdon'\n\
    \    )\n    let data = await response.json()\n  } catch (error) {\n    // Handle\
    \ the error\n    console.log(error)\n  }\n}\n```\n"
  mdcn: "\n\n## 异步 JavaScript\n\n异步地，我们可以使用 Fetch API 发起 GET 请求，从 JSON 文件中检索数据。在与\
    \ `data.json` 文件相同的目录中，创建一个名为 `fetchExample.html` 的 HTML 文件，并向其中添加以下代码：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Fetch\
    \ API</title>\n</head>\n<body>\n  <script src=\"./fetchExample.js\"></script>\n\
    </body>\n</html>\n```\n\n接下来，在同一级目录下创建一个名为 `fetchExample.js` 的 JavaScript 文件。在我们的\
    \ JavaScript 文件中，我们将使用 `fetch()` 方法对 `data.json` 文件发送 GET 请求。`fetch()` 方法接受 URL\
    \ 作为第一个参数，并返回一个解析为 Response 对象的 Promise：\n\n```javascript\nlet fetchRequest =\
    \ fetch('./data.json')\n\nconsole.log(fetchRequest)\n```\n\n当你在浏览器中打开 `fetchExample.html`\
    \ 文件时，会在控制台中看到 CORS 错误。*CORS 代表跨源资源共享（Cross-Origin Resource Sharing），它是一种允许网页上的受限资源从提供第一个资源的域之外的其他域进行请求的机制。*\
    \ 为了避免此错误，我们需要运行一个本地服务器。如果你正在使用 VS Code，可以安装 Live Server 扩展。一旦安装了扩展，右键点击 `fetchExample.html`\
    \ 文件并选择“Open with Live Server”。否则，你可以使用任何其他本地服务器，例如 Node.js 的 `http-server` 包。\n\
    \n一旦启动了本地服务器，你会发现 `fetchRequest` 变量包含一个状态为“pending”的 Promise 对象：\n\n```javascript\n\
    Promise {<pending>}\n```\n\n当请求完成后，返回的 Promise 将解析为 Response 对象。让我们使用 `then()`\
    \ 方法在 Promise 解析时处理它。我们将 Response 对象打印到控制台：\n\n```javascript\nfetchRequest.then((response)\
    \ => {\n  console.log(response)\n})\n```\n\n解析后的响应看起来应该是这样：\n\n```javascript\n\
    Response {body: ReadableStream, status: 200, type: \"cors\",...}\n```\n\nResponse\
    \ 对象包含了关于响应的信息，包括状态码、响应类型和响应正文。`body` 属性包含一个 `ReadableStream` 对象，我们可以用它来读取从服务器返回的数据。我们可以使用\
    \ `json()` 方法将响应数据转换为 JavaScript 对象。`json()` 方法返回一个解析为 JavaScript 对象的 Promise，因此我们将链式另一个\
    \ `then()` 方法来在 Promise 解析时处理它：\n\n```javascript\nfetchRequest\n  .then((response)\
    \ => {\n    return response.json()\n  })\n  .then((data) => {\n    console.log(data)\n\
    \  })\n```\n\n`data` 变量将包含从服务器返回的 JavaScript 对象：\n\n```javascript\n(3) [{...},\
    \ {...}, {...}]\n0: {name: \"John\", age: 30}\n1: {name: \"Sara\", age: 22}\n\
    2: {name: \"Bill\", age: 40}\nlength: 3\n__proto__: Array(0)\n```\n\n让我们使用 `data`\
    \ 变量在页面上显示用户数据。我们将创建一个 `ul` 元素并为每个用户添加一个 `li` 元素。更新 `fetchExample.js` 文件如下：\n\n\
    ```javascript\nlet fetchRequest = fetch('./data.json')\n\nfetchRequest\n  .then((response)\
    \ => {\n    return response.json()\n  })\n  .then((data) => {\n    let ul = document.createElement('ul')\n\
    \n    data.forEach((user) => {\n      let li = document.createElement('li')\n\
    \      li.textContent = `${user.name} is ${user.age}`\n      ul.appendChild(li)\n\
    \    })\n\n    document.body.appendChild(ul)\n  })\n```\n\n当你刷新页面时，你应该能看到页面上显示的用户数据：\n\
    \n- John is 30\n- Sara is 22\n- Bill is 40\n\n## Async/Await\n\n`async` 和 `await`\
    \ 关键字在 ES2017 中引入，使得处理 Promise 变得简单。例如，我们可以使用 `async` 和 `await` 关键字简化 `fetchExample.js`\
    \ 文件中的 Fetch 请求：\n\n```javascript\nlet fetchUsers = async () => {\n  let response\
    \ = await fetch('./data.json')\n  console.log(response)\n}\n\nfetchUsers()\n//\
    \ Response {body: ReadableStream, status: 200, type: \"cors\",...}\n```\n\n`async`\
    \ 关键字用于定义异步函数，而 `await` 关键字用于等待 Promise 解析，且只能在 `async` 函数内部使用。在我们的示例中，我们首先定义了一个名为\
    \ `fetchUsers()` 的异步箭头函数。我们也可以在普通的函数声明中使用 `async` 关键字：\n\n```javascript\nasync\
    \ function fetchUsers() {\n  // ...\n}\n```\n\n在 `fetchUsers()` 函数内部，我们使用 `await`\
    \ 关键字等待 `fetch()` 方法解析。当我们在变量声明中使用 `await` 关键字时，该变量将被赋值 Promise 的解析值。在我们的示例中，`response`\
    \ 变量将被赋值 `fetch()` Promise 的解析值。然后我们可以使用 `await` 关键字等待 `json()` 方法解析。我们将创建一个名为\
    \ `data` 的新变量，并将其赋值 `json()` Promise 的解析值。在 `fetchUsers()` 函数内部，我们将 `data` 变量打印到控制台：\n\
    \n```javascript\nlet response = await fetch('./data.json')\nlet data = await response.json()\n\
    \nconsole.log(data)\n```\n\n当你刷新页面时，你会看到之前示例中的相同数据：\n\n```javascript\n(3) [{...},\
    \ {...}, {...}]\n0: {name: \"John\", age: 30}\n1: {name: \"Sara\", age: 22}\n\
    2: {name: \"Bill\", age: 40}\nlength: 3\n__proto__: Array(0)\n```\n\n现在我们可以使用\
    \ `data` 变量在页面上显示用户数据：\n\n```javascript\nlet fetchUsers = async () => {\n  let\
    \ response = await fetch('./data.json')\n  let data = await response.json()\n\n\
    \  let ul = document.createElement('ul')\n\n  data.forEach((user) => {\n    let\
    \ li = document.createElement('li')\n    li.textContent = `${user.name} is ${user.age}`\n\
    \    ul.appendChild(li)\n  })\n\n  document.body.appendChild(ul)\n}\n```\n\n当你刷新页面时，你应该看到页面上显示了用户数据：\n\
    \n- John is 30\n- Sara is 22\n- Bill is 40\n\n我们可以使用 `try` 和 `catch` 关键字来处理异步函数中的错误。让我们更新\
    \ `fetchUsers()` 函数使用 `try` 和 `catch` 关键字：\n\n```javascript\nlet fetchUsers =\
    \ async () => {\n  try {\n    let response = await fetch('./data.json')\n    let\
    \ data = await response.json()\n  } catch (error) {\n    // 处理错误\n    console.log(error)\n\
    \  }\n}\n```\n\n这将捕获 `try` 块中发生的任何错误，包括 `fetch()` 方法和 `json()` 方法中发生的错误。`async`\
    \ 和 `await` 关键字帮助我们编写看起来更像同步代码的异步代码，避免了链式调用 `.then()` 方法。然而，`async` 和 `await`\
    \ 只是 Promise 的语法糖（为了使代码更易读而添加的语法），它们并没有改变 Promise 工作的底层机制。\n\n我们已经成功地使用 Fetch\
    \ API 从 `data.json` 文件检索了数据。我们也可以以相同的方式向服务器发送 HTTP 请求。让我们更新 `fetchUsers()` 函数向\
    \ GitHub API 发起 HTTP 请求。我们可以通过用户名获取任何用户的数据。我们将用我的用户名进行一个示例：\n\n```javascript\n\
    let fetchUsers = async () => {\n  try {\n    let response = await fetch(\n   \
    \   'https://api.github.com/users/ebenezerdon'\n    )\n    let data = await response.json()\n\
    \  } catch (error) {\n    // 处理错误\n    console.log(error)\n  }\n}\n```\n\n"
