    ## The Document Object Model (DOM)


    The Document Object Model (DOM) is an object-oriented representation of a web
    page, where each element of the page, such as a button, image or text, is represented
    as an object with its own set of properties and methods. The DOM is a programming
    interface for HTML and XML documents, that allows us to use JavaScript to access
    and update the content, structure, and style of a web page.


    With the DOM, we can listen to events, like a click on a button and respond to
    them. We can also create new elements and attributes, change the content of existing
    elements, or remove elements from the page.


    The DOM represents a document as a tree of nodes. The word “node” refers to a
    single point in a data structure, and in the case of the DOM, it represents an
    element or a piece of text on the web page. Each node is an object representing
    a part of the document. The tree-like structure of the DOM is formed by parent-child
    relationships between the nodes, with each element containing other elements,
    which can be thought of as child nodes.


    For example, in an HTML document, a node would represent an element such as a
    paragraph <p>Hello World</p>, and the text “Hello World” would be a child node
    of the paragraph node. Nodes provide a way to represent the web page in a logical
    and hierarchical way (from the top of the page to the bottom), making it easy
    to navigate and understand the structure of the document.


    Let’s take a look at a simple HTML document:


    | | |

    |---|---|

    | 1 | *<!DOCTYPE html>* |

    | 2 | `<html>` |

    | 3 | `<head>` |

    | 4 | `<title>My Simple Web Page</title>` |

    | 5 | `</head>` |

    | 6 | `<body>` |

    | 7 | `<h1>This is awesome!</h1>` |

    | 8 | `</body>` |

    | 9 | `</html>` |


    The DOM tree for the document above would look like this:


    | | |

    |---|---|

    | 1 | Document |

    | 2 | html |

    | 3 | head |

    | 4 | title |

    | 5 | /head |

    | 6 | body |

    | 7 | h1 |

    | 8 | /body |

    | 9 | /html |

    | 10 | doctype |

    | 11 | html |

    | 12 | head |

    | 13 | title |

    | 14 | body |

    | 15 | h1 |


