    **The Switch statement**


    The switch statement is a way to simplify the process of writing multiple if-else
    statements. It’s a type of conditional statement that allows you to compare a
    value against multiple cases. The switch statement compares an expression to a
    list of possible values, and if the expression matches one of the values, the
    code inside its corresponding case will be executed. Here’s what the syntax looks
    like:


    1 **switch (expression) {

    2 **case value1**:

    3 *// code to be executed if expression matches value1*

    4 **break**

    5 **case value2**:

    6 *// code to be executed if expression matches value2*

    7 **break**

    8 **default**:

    9 *// code to be executed if expression does not match*

    10 *// any of the cases*

    11 }


    In the above syntax,


    - The expression is the value that will be compared against the cases.

    - value1 and value2 are the possible values the expression can match.

    - The break keyword is used to stop the execution of the switch statement after
    the code inside a case is executed. If there’s no break keyword in a case, the
    switch statement will continue to run until it reaches a break keyword or until
    it reaches the end.

    - The default case is executed if the expression does not match any case.


    Conditional Statements 101


    To illustrate how the switch statement works, let’s look at an example. Let’s
    say we have a variable called day that stores the day of the week, and we want
    to log different messages to the console depending on the day of the week. We
