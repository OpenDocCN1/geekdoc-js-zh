    \nThis will return 2 because ‘banana’ is the third element in the favoriteFruits\
    \ array, which means that it has an index of 2. Remember that we start counting\
    \ from 0 when identifying the index of an array element. If the element you’re\
    \ looking for is not in the array, the indexOf() method will return -1:\n\n```javascript\n\
    favoriteFruits.indexOf('watermelon')\n// output: -1\n```\n\n### slice()\n\nThe\
    \ slice() method is used to extract a portion of an array. The method takes two\
    \ arguments: the starting index (inclusive) and the ending index (exclusive) of\
    \ the slice. The element at the starting index will be included in the slice,\
    \ but the element at the ending index will not. The slice() method does not modify\
