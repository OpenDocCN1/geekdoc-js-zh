    )\n```\n\n我们还可以使用 `innerHTML` 属性将元素的值设置为空字符串。\n这将移除该元素的所有子节点。让我们移除 #dom-example\
    \ 元素：\n\n```javascript\ndocument.querySelector('#dom-example').innerHTML = ''\n\
    ```\n\n请记住，DOM 是网页的实时表示，因此你对其进行的任何\n更改都会反映在浏览器中。然而，当你刷新页面时，DOM 将重置为初始初始状态。\n\n\
    ### 遍历 DOM\n\n遍历 DOM 意味着在 DOM 树的元素之间移动。让我们对\nindex.html 文件做一些更改，以便我们有更多元素可以操作。\n\
    用以下代码替换你的文件内容，然后在浏览器中刷新页面：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Learning\
    \ the DOM</title>\n</head>\n<body>\n  <h1>Using JavaScript to access the DOM</h1>\n\
    \  <div id=\"dom-intro\">\n    <p id=\"dom-definition\">\n      DOM stands for\
    \ Document Object Model\n    </p>\n    <p id=\"dom-example\">\n      We can use\
    \ the DOM to manipulate the content of a\n      web page\n    </p>\n  </div>\n\
    </body>\n</html>\n```\n\n在新的 HTML 代码中，我们将 `<p>` 元素包裹在一个 `id` 为\n“dom-intro”的 `<div>`\
    \ 元素中。让我们看看如何利用元素之间\n相互的关系来访问 DOM 元素。\n\n### parentNode 属性\n\n`parentNode` 属性返回调用它的元素的父节点。让我们使用\n\
    #dom-definition 元素的 `parentNode` 属性来访问其父节点：\n\n```javascript\ndocument.querySelector('#dom-definition').parentNode\n\
    // 输出: <div id=\"dom-intro\">...</div>\n```\n\n我们还可以通过链式使用 `parentNode` 属性来访问元素的祖父节点：\n\
    \n```javascript\ndocument.querySelector('#dom-definition').parentNode\n  .parentNode\n\
    // 输出: <body>...</body>\n```\n\n### childNodes 属性\n\n`childNodes` 属性返回一个元素所有子节点的\
    \ `NodeList`，\n包括元素节点和像文本节点这样的非元素节点。\n\n这里是一个使用 #dom-intro 元素的 `childNodes` 属性来访问\n\
    其子节点的示例：\n\n```javascript\ndocument.querySelector('#dom-intro').childNodes\n//\
    \ 输出: NodeList(5) [text, p#dom-definition, text, p#dom-example, text]\n```\n\n\
    子节点包括：\n- 一个值为 `\"\\n \"` 的文本节点（代表页面上元素之间的换行符。）\n- 一个 `id` 为 “dom-definition”的\
    \ `<p>` 元素节点\n- 一个值为 `\"\\n \"` 的文本节点\n- 一个 `id` 为 “dom-example”的 `<p>` 元素节点\n\
    - 一个值为 `\"\\n \"` 的文本节点\n\n### children 属性\n\n`children` 属性与 `childNodes` 属性类似，但它返回的是\n\
    一个仅包含子元素节点的 `HTMLCollection`：\n\n```javascript\ndocument.querySelector('#dom-intro').children\n\
    // 输出: HTMLCollection(2) [p#dom-definition, p#dom-example]\n```\n\n### firstChild\
    \ 和 lastChild 属性\n\n`firstChild` 属性返回元素的第一个子节点，包括非元素\n节点。`lastChild` 属性返回元素的最后一个子节点，也包括\n\
    非元素节点。让我们使用 #dom-intro 元素的\n`firstChild` 和 `lastChild` 属性来访问它的首两个子节点：\n\n```javascript\n\
    document.querySelector('#dom-intro').firstChild\n// 输出: #text\n\ndocument.querySelector('#dom-intro').lastChild\n\
    // 输出: #text\n```\n\n### firstElementChild 和 lastElementChild 属性\n\n`firstElementChild`\
    \ 和 `lastElementChild` 属性分别\n返回元素的第一个和最后一个元素节点。与 `firstChild` 和\n`lastChild` 属性不同，它们只返回元素节点：\n\
    \n```javascript\ndocument.querySelector('#dom-intro').firstElementChild\n// 输出:\
    \ <p id=\"dom-definition\">DOM stands for Document Object Model</p>\n\ndocument.querySelector('#dom-intro').lastElementChild\n\
    // 输出: <p id=\"dom-example\">We can use the DOM to manipulate the content of a\
    \ web page</p>\n```\n\n### nextSibling 和 previousSibling 属性\n\n`nextSibling` 属性返回元素的下一个兄弟节点，包括\n\
    非元素节点。`previousSibling` 属性返回元素的上一个\n兄弟节点，也包括非元素节点。让我们使用 #dom-definition\n元素的 `nextSibling`\
    \ 和 `previousSibling` 属性来访问它的下一个和上一个兄弟节点：\n\n```javascript\ndocument.querySelector('#dom-definition').nextSibling\n\
    // 输出: #text\n\ndocument.querySelector('#dom-definition').previousSibling\n//\
    \ 输出: #text\n```\n\n### nextElementSibling 和 previousElementSibling 属性\n\n与 `nextSibling`\
    \ 和 `previousSibling` 属性不同，\n`nextElementSibling` 和 `previousElementSibling`\n\
    属性只返回元素节点：\n\n```javascript\ndocument.querySelector('#dom-definition')\n  .nextElementSibling\n\
    // 输出: <p id=\"dom-example\">We can use the DOM to manipulate the content of a\
    \ web page</p>\n\ndocument.querySelector('#dom-definition')\n  .previousElementSibling\n\
    // 输出: null\n```\n\n### 结论\n\n文档对象模型是一个强大的工具，允许我们让网页具有\n动态性和交互性。它是 Web 开发中不可或缺的一部分，理解\n\
    它的工作原理至关重要。创建更多的 HTML 文件并使用\n它们练习用 JavaScript 访问和修改 DOM。你也可以访问\n喜爱的网站，并使用浏览器的开发者工具来探索\
    \ DOM。\n\n## 如何在 HTML 文件中引入 JavaScript\n\n到目前为止，我们通过在控制台中运行 JavaScript 来练习\n它。但当我们开始处理网页和\
    \ DOM 时，我们需要在\n的 HTML 文件中包含 JavaScript。我们可以通过使用`<script>`\n标签在 HTML 文件中直接编写代码，或者通过创建一个\n\
    `.js` 扩展名的独立 JavaScript 文件并在 HTML 中引用它。让我们来看这两种方法。\n\n### 在 HTML 文件中编写 JavaScript\n\
    \n（内联 JavaScript）\n\n在 HTML 文件中包含 JavaScript 最简单的方法是使用\n`<script>` 标签将代码直接添加到\
    \ HTML 中。这通常\n内联 JavaScript。我们可以在文档的 `<head>` 或 `<body>` 部分\n包含 JavaScript 代码，但最好将其放在\
    \ `<body>` 部分，这样\n在执行 JavaScript 之前加载 HTML 内容。让我们来看一个示例。创建一个名为 `js-in-html.html`\
    \ 的新 HTML 文件并添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JS\
    \ in HTML</title>\n</head>\n<body>\n  <h1>JS in HTML</h1>\n  <script>\n    alert('Hey\
