    \ 将选择 id 属性为“dom-definition”的 `p` 元素，而选择器 `p.paragraph` 将选择所有 class 属性为“paragraph”的\
    \ `p` 元素。因此，如果存在相同 class 或 id 的另一个元素，`querySelector` 方法只会返回同时标签名和属性的元素。让我们在 `index.html`\
    \ 文件中添加一个 class 属性与 `p` 元素相同的 `div` 元素：\n\n```html\n<body>\n  <h1>Using JavaScript\
    \ to access the DOM</h1>\n  <p id=\"dom-definition\" class=\"paragraph\">\n  \
    \  DOM stands for Document Object Model\n  </p>\n  <p id=\"dom-example\" class=\"\
    paragraph\">\n    We can use the DOM to manipulate the content of a web page\n\
    \  </p>\n  <div class=\"paragraph\">\n    This div element has the same class\
    \ attribute as the p elements\n  </div>\n</body>\n```\n\n现在，让我们使用 `querySelector`\
    \ 方法选择 class 属性为“paragraph”的 `div` 元素。在你的浏览器控制台中运行以下代码：\n\n```javascript\ndocument.querySelector('div.paragraph')\n\
    // Output: <div class=\"paragraph\">This div element has the same class attribute\
    \ as the p elements</div>\n```\n\n`querySelector` 方法只返回同时匹配标签名和属性的元素。让我们使用 `querySelectorAll`\
    \ 方法获取所有 class 属性为“paragraph”的 `p` 元素：\n\n```javascript\ndocument.querySelectorAll('p.paragraph')\n\
    // Output: NodeList(2) [p#dom-definition.paragraph, p#dom-example.paragraph]\n\
    ```\n\n这是一个使用 id 属性的示例。我们将使用选择器 `p#dom-definition` 来获取 id 为“dom-definition”的 `p`\
    \ 元素：\n\n```javascript\ndocument.querySelector('p#dom-definition')\n// Output:\
    \ <p id=\"dom-definition\" class=\"paragraph\">DOM stands for Document Object\
    \ Model</p>\n```\n\n在使用 `querySelector` 和 `querySelectorAll` 方法通过 id 或 class 属性访问元素时，必须在属性值之前包含\
    \ `#` 或 `.` 符号。`#` 代表 id 属性，`.` 代表 class 属性。如果你在属性值之前没有包含它们，这些方法将假设你正尝试通过标签名访问元素。因此，如果我们不使用“#dom-definition”而是使用“dom-definition”，`querySelector`\
    \ 方法将搜索标签名为“dom-definition”的元素并返回 `null`：\n\n```javascript\ndocument.querySelector('dom-definition')\n\
    // Output: null\n```\n\n## 访问元素的属性和属性性\n\n### attributes 属性和 getAttribute 方法\n\
    \n我们可以使用 `getAttribute` 方法和 `attributes` 属性来访问元素的属性。`getAttribute` 方法接受属性名作为参数并返回属性值。`attributes`\
    \ 属性返回一个包含元素所有属性的类数组对象。让我们使用 `getAttribute` 方法获取 id 为“dom-definition”的 `p` 元素的\
    \ id 属性值：\n\n```javascript\ndocument.querySelector('#dom-definition').getAttribute('id')\n\
    // Output: \"dom-definition\"\n```\n\n让我们使用 `attributes` 属性获取 id 为“dom-definition”的\
    \ `p` 元素的所有属性：\n\n```javascript\ndocument.querySelector('#dom-definition').attributes\n\
    // Output: NamedNodeMap(2) [id, class]\n```\n\n`attributes` 属性返回一个包含元素所有属性的 **NamedNodeMap**\
    \ 对象。*NamedNodeMap 代表一个可以通过名称访问的节点集合。*我们可以使用方括号符号和属性索引，或者使用点符号和属性名，来访问 NamedNodeMap\
    \ 对象的属性。让我们使用方括号符号获取 id 为“dom-definition”的 `p` 元素的 id 属性：\n\n```javascript\ndocument.querySelector('#dom-definition').attributes[0]\n\
    // Output: id\n```\n\n这里是使用点符号的相同示例：\n\n```javascript\ndocument.querySelector('#dom-definition').attributes.id\n\
    // Output: id\n```\n\n要访问属性的值，我们可以使用它的 `value` 属性：\n\n```javascript\ndocument.querySelector('#dom-definition').attributes[0].value\n\
    // Output: \"dom-definition\"\n\ndocument.querySelector('#dom-definition').attributes.id.value\n\
    // Output: \"dom-definition\"\n```\n\n### style属性\n\n`style` 属性返回一个包含元素所有样式属性的对象。让我们获取\
    \ `dom-definition` 元素的 `style` 属性：\n\n```javascript\ndocument.querySelector('#dom-definition').style\n\
    // output: CSSStyleDeclaration {accentColor: '', backgroundColor: '', fontSize:\
    \ '', ...}\n```\n\n注意 `style` 属性返回一个 `CSSStyleDeclaration` 对象。`CSSStyleDeclaration`\
    \ 对象代表一个 CSS 声明块。在 JavaScript 对象中，每个样式属性都用驼峰法（camelCase）表示。因此，在 CSS 中是 `background-color`，`style`\
    \ 属性是 `backgroundColor`。由于我们没有对元素设置样式，每个样式属性的值都是一个空字符串。\n\n要直接访问样式属性的值，我们可以使用点符号或方括号符号：\n\
    \n```javascript\ndocument.querySelector('#dom-definition').style.backgroundColor\n\
    // Output: \"\"\n\ndocument.querySelector('#dom-definition').style['backgroundColor']\n\
    // Output: \"\"\n```\n\n我们还可以使用 `getPropertyValue` 方法获取样式属性的值：\n\n```javascript\n\
    document.querySelector('#dom-definition').style.getPropertyValue('background-color')\n\
    // Output: \"\"\n```\n\n## 修改 DOM 元素\n\n在 DOM 中修改元素与修改 JavaScript 对象中的元素相同。我们可以重新赋值\
    \ DOM 元素属性的值，并添加或删除属性。例如，我们可以通过重新赋值 id 属性的值来更改元素的 id 属性值。让我们将 id 为“dom-definition”的\
    \ `p` 元素的 id 属性改为“new-dom-definition”：\n\n```javascript\ndocument.querySelector('#dom-definition').id\
    \ = 'new-dom-definition'\ndocument.querySelector('#new-dom-definition').getAttribute('id')\n\
    // Output: \"new-dom-definition\"\n```\n\nDOM 元素还有一个 `setAttribute` 方法，我们可以用它修改属性值。`setAttribute`\
    \ 方法接受两个参数：属性名和属性值。让我们使用 `setAttribute` 方法将 id 属性改回“dom-definition”：\n\n```javascript\n\
    document.querySelector('#new-dom-definition').setAttribute('id', 'dom-definition')\n\
    document.querySelector('#dom-definition').getAttribute('id')\n// Output: \"dom-definition\"\
    \n```\n\n元素样式也可以通过重新赋值样式属性的值来修改。让我们将 dom-definition 元素的背景颜色改为红色：\n```\n\n"
