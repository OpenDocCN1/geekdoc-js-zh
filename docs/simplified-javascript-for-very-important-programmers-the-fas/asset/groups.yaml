- md: "\n## How to include JavaScript in an HTML file\n\nsame folder as the js-in-html.html\
    \ file, create a new JavaScript file called js-in-html.js and add the alert method\
    \ call to it:\n\n```javascript\nalert('Hey everyone!')\n```\n\nNow, open the js-in-html.html\
    \ file, remove the existing <script> element and add a new one that links to the\
    \ js-in-html.js file:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JS\
    \ in HTML</title>\n</head>\n<body>\n  <h1>JS in HTML</h1>\n  <script src=\"./js-in-html.js\"\
    ></script>\n</body>\n</html>\n```\n\nIn our new example, we’ve added a <script>\
    \ element that links to the js-in-html.js file using its src attribute and path,\
    \ instead of the initial <script> element that contained the JavaScript code.\
    \ When the page loads, the browser will run the JavaScript code in the js-in-html.js\
    \ file and display the alert box with the message “Hey everyone!”.\n\nLinking\
    \ to a separate JavaScript file keeps the HTML and JavaScript code separate, which\
    \ makes it easier to read and maintain. It also makes it easier to reuse the JavaScript\
    \ code in multiple HTML files. For example, if we wanted to add the same alert\
    \ to another HTML file, we could simply link to the same js-in-html.js file.\n\
    \nThe <script> tag has other attributes that we can use to control how the JavaScript\
    \ code is loaded and executed. Let’s look at a few of them.\n\n### The async attribute\n\
    \nThe async attribute tells the browser to load the JavaScript file asynchronously,\
    \ which means that the browser can continue loading the HTML file while the JavaScript\
    \ file is loading. This can be useful for large JavaScript files that take a long\
    \ time to load. However, it can also cause problems if the JavaScript code depends\
    \ on the HTML content being loaded first because, once the JavaScript file is\
    \ loaded, the browser will execute the JavaScript code even if the HTML content\
    \ hasn’t finished loading yet. Here’s how we would use the async attribute in\
    \ a <script> element:\n\n```html\n<script src=\"./js-in-html.js\" async></script>\n\
    ```\n\n### The defer attribute\n\nThe defer attribute tells the browser to load\
    \ the JavaScript file asynchronously, but to execute the JavaScript code after\
    \ the HTML file has been loaded. Unlike the async attribute, the defer attribute\
    \ ensures that the JavaScript code is executed after the HTML content is loaded,\
    \ avoiding any potential problems with the JavaScript code depending on the HTML\
    \ content being loaded first. Here’s how we would use the defer attribute:\n\n\
    ```html\n<script src=\"./js-in-html.js\" defer></script>\n```\n\nIt’s important\
    \ to note that the async and defer attributes are not supported by all browsers,\
    \ particularly older ones. However, they are a good option for controlling how\
    \ your JavaScript code is loaded and executed.\n\n### Conclusion\n\nWe’ve seen\
    \ the different ways to include JavaScript code in an HTML file. Each method has\
    \ its advantages and disadvantages and the choice of which to use depends on various\
    \ factors like the size and complexity of the project, the required level of compatibility\
    \ with different browsers, and the need for optimization.\n\nRegardless of which\
    \ method you use, it’s essential to keep your code organized and maintainable,\
    \ so that you can create reliable web applications that provide an excellent user\
    \ experience.\n\n## Browser Events\n\nBrowser events are actions that occur in\
    \ the browser. These actions are usually initiated by the user, such as clicking\
    \ on a button, scrolling through a web page or submitting a form. By using JavaScript,\
    \ we can respond to these events and create dynamic, interactive web pages.\n\n\
    When a user clicks a button on your webpage, you might want to react to that action\
    \ by displaying a message or navigating to a new page. The browser provides a\
    \ way to listen for these events and respond to them. Through the DOM, we can\
    \ add event listeners to elements in our HTML page so that when a user performs\
    \ a specific action, the browser will execute a JavaScript function in response\
    \ to it. This function is called an event handler. Event handlers are often referred\
    \ to as event listeners, but more specifically, the event listener is what listens\
    \ for the event while the event handler is the function that is executed when\
    \ the event occurs.\n\nDOM elements have an addEventListener() method that allows\
    \ us to add event listeners to them. This method takes two arguments: the name\
    \ of the event and the event handler function. For example, if we wanted to add\
    \ a click event listener to a button, we would call its addEventListener() method\
    \ and pass in the event name and the event handler function as arguments:\n\n\
    ```javascript\nconst button = document.querySelector('button')\n\nbutton.addEventListener('click',\
    \ () => {\n  console.log('You clicked me!')\n})\n```\n\nApart from the addEventListener()\
    \ method, elements also have several event properties that we can set to event\
    \ handler functions. These properties are named after the event they listen for,\
    \ such as onclick for the click event or onscroll for the scroll event. For example,\
    \ we can also add a click event listener to the button by setting its onclick\
    \ property to an event handler function:\n\n```javascript\nbutton.onclick = ()\
    \ => {\n  console.log('You clicked me!')\n}\n```\n\nWhen an event handler function\
    \ is executed, the browser passes an event object as an argument to the function.\
    \ This object contains information about the event that occurred. For example,\
    \ the event object passed into a click event function contains information about\
    \ the element that was clicked on. We can access this information by using the\
    \ target property of the event object. For example, if we wanted to log the element\
    \ that was clicked on, we could do the following:\n\n```javascript\nbutton.onclick\
    \ = (event) => {\n  console.log(event.target)\n}\n```\n\nLet’s work with another\
    \ HTML file so that you can see how event listeners work in practice. Create a\
    \ new file named browserEvents.html and add the following code:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Browser Events</title>\n\
    </head>\n<body>\n  <h1>Working with Browser Events</h1>\n  <p>Click the button\
    \ below to trigger a browser event.</p>\n  <button id=\"click-me-btn\">Click Me!</button>\n\
    </body>\n</html>\n```\n\nNext, create a new file in the same directory named browserEvents.js\
    \ and add the following JavaScript code to it. We’ll start by selecting the button\
    \ element and adding a click event listener to it:\n\n```javascript\nconst button\
    \ = document.querySelector('#click-me-btn')\n\nbutton.addEventListener('click',\
    \ () => {\n  alert('You clicked me!')\n})\n```\n\nIn our JavaScript file, we used\
    \ the querySelector() method to select the button element and store it in a variable\
    \ named button. Then, we added a click event listener to the button by calling\
    \ itsaddEventListener() method and passing in the event name and the event handler\
    \ function as arguments. The event handler function is an anonymous arrow function\
    \ that displays an alert message. Let’s include our JavaScript file in our HTML\
    \ code so that the browser can execute it. Add the following code to the browserEvents.html\
    \ file:\n\n```html\n<script src=\"browserEvents.js\"></script>\n```\n\nYou can\
    \ now open the HTML file in your browser and click on the button. You should see\
    \ an alert message that says “You clicked me!”.\n\n### Event Object Properties\
    \ and Methods\n\nIf we want to get more information about the event that occurred\
    \ or the element that was clicked on, we can pass an event parameter into the\
    \ event handler function. The parameter will represent the event object that the\
    \ browser passes into the function when it is executed, which contains information\
    \ about the event that occurred. Some of the common properties and methods of\
    \ the event object include:\n\n**target**\n\nThe target property returns the element\
    \ that an event occurs on. For example, if we want to log the element that was\
    \ clicked on to the console, we can edit the click event handler function in the\
    \ browserEvents.js file to the following:\n\n```javascript\nbutton.addEventListener('click',\
    \ (event) => {\n  console.log(event.target)\n})\n```\n\nReloading your page and\
    \ clicking on the button should log the button element <button id=\"click-me-btn\"\
    >Click Me!</button> to the console.\n"
  mdcn: "\n\n## 如何在 HTML 文件引入 JavaScript\n\n在 `js-in-html.html` 文件相同的文件夹中，创建一个名为 `js-in-html.js`\
    \ 的新 JavaScript 文件，并为其添加 alert 方法调用：\n\n```javascript\nalert('Hey everyone!')\n\
    ```\n\n现在，打开 `js-in-html.html` 文件，移除现有的 `<script>` 元素并添加一个新的链接到 `js-in-html.js`\
    \ 文件的 `<script>` 元素：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JS\
    \ in HTML</title>\n</head>\n<body>\n  <h1>JS in HTML</h1>\n  <script src=\"./js-in-html.js\"\
    ></script>\n</body>\n</html>\n```\n\n在我们新的示例中，我们添加了一个 `<script>` 元素，通过其 `src`\
    \ 属性和路径链接到 `js-in-html.js` 文件，而不是使用最初包含 JavaScript 代码的那个 `<script>` 元素。当页面加载时，浏览器将运行\
    \ `js-in-html.js` 文件中的 JavaScript 代码，并显示带有消息“Hey everyone!”的 alert 框。\n\n将 JavaScript\
    \ 链接到单独的文件中可以保持 HTML 和 JavaScript 代码分离，这使其更易阅读和维护。它也使得在多个 HTML 文件中复用 JavaScript\
    \ 代码变得更容易。例如，如果我们想在另一个 HTML 文件中添加相同的 alert，只需简单链接到同一个 `js-in-html.js` 文件即可。\n\n\
    `<script>` 标签还有其他属性可以被我们用来控制 JavaScript 代码的加载和执行。让我们来看其中几个。\n\n### async 属性\n\n\
    `async` 属性告诉浏览器异步加载 JavaScript 文件，这意味着浏览器在加载 JavaScript 文件时可以继续加载 HTML 文件。这对于加载耗时较长的大型\
    \ JavaScript 文件非常有用。但是，如果 JavaScript 代码依赖于先加载 HTML 内容，它也可能会导致问题，因为一旦 JavaScript\
    \ 文件加载，即使 HTML 内容尚未加载完成，浏览器也会执行 JavaScript 代码。以下是我们在 `<script>` 元素中使用 `async`\
    \ 属性的方式：\n\n```html\n<script src=\"./js-in-html.js\" async></script>\n```\n\n\
    ### defer 属性\n\n`defer` 属性告诉浏览器异步加载 JavaScript 文件，但在 HTML 文件加载后执行 JavaScript 代码。与\
    \ `async` 属性不同，`defer` 属性确保在 HTML 内容加载后执行 JavaScript 代码，从而避免 JavaScript 代码依赖于先加载\
    \ HTML 内容时可能出现的任何问题。以下是我们使用 `defer` 属性的方式：\n\n```html\n<script src=\"./js-in-html.js\"\
    \ defer></script>\n```\n\n需要注意的是，`async` 和 `defer` 属性并不是所有浏览器都支持，特别是旧版本的浏览器。然而，它们是控制你的\
    \ JavaScript 代码加载和执行的好选择。\n\n### 结论\n\n我们已经了在 HTML 文件中引入 JavaScript 代码的不同方法。每种方法都有其优缺点，选择使用哪种取决于多种因素，如项目的规模和复杂性、对不同浏览器的兼容性要求以及优化的需求。\n\
    \n无论你使用哪种方法，保持代码的组织有序和可维护都是至关重要的，这样你就可以创建提供良好用户体验的可靠 Web 应用。\n\n## 浏览器事件\n\n浏览器事件是浏览器中发生的动作。这些动作通常由用户触发，例如点击按钮、滚动网页或提交表单。通过使用\
    \ JavaScript，我们可以响应这些事件并创建动态、交互式的网页。\n\n当用户点击你网页上的按钮时，你可能想通过显示显示消息或导航到新页面来响应该操作。浏览器提供了一种监听这些事件并对其响应的方法。通过\
    \ DOM，我们可以为 HTML 页面中的元素添加事件监听器，这样当用户执行特定操作时，浏览器将执行一个 JavaScript 函数来作为响应。这个函数被称为事件处理器（event\
    \ handler）。事件处理器通常被称为事件监听器（event listeners），但更具体地说，事件监听器是负责监听事件的，而事件处理器是事件发生时执行的函数。\n\
    \nDOM 元素拥有 `addEventListener()` 方法，允许我们为它们添加事件监听器。该方法接受两个参数：事件的名称和事件处理器函数。例如，如果我们想为按钮添加点击事件监听器，我们将调用它的\
    \ `addEventListener()` 方法并将事件名称和事件处理器函数作为参数传递：\n\n```javascript\nconst button\
    \ = document.querySelector('button')\n\nbutton.addEventListener('click', () =>\
    \ {\n  console.log('You clicked me!')\n})\n```\n\n除了 `addEventListener()` 方法外，元素还有几个事件属性，我们可以将它们设置为事件处理器函数。这些属性以它们监听的事件命名，例如用于点击事件的\
    \ `onclick` 或用于滚动事件的 `onscroll`。例如，我们也可以通过将按钮的 `onclick` 属性设置为事件处理器函数来添加点击事件监听器：\n\
    \n```javascript\nbutton.onclick = () => {\n  console.log('You clicked me!')\n\
    }\n```\n\n当执行事件处理器函数时，浏览器会将一个事件对象作为参数传递给该函数。该对象包含有关发生事件的信息。例如，传递到点击事件函数中的事件对象包含了被点击元素的信息。我们可以通过使用事件对象的\
    \ `target` 属性来访问这些信息。例如，如果我们想记录被点击的元素，可以这样做：\n\n```javascript\nbutton.onclick\
    \ = (event) => {\n  console.log(event.target)\n}\n```\n\n让我们在另一个 HTML 文件上工作，以便你可以看到事件监听器是如何工作的。创建一个名为\
    \ `browserEvents.html` 的新文件并添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\"\n  <title>Browser Events</title>\n</head>\n<body>\n\
    \  <h1>Working with Browser Events</h1>\n  <p>点击下面的按钮触发浏览器事件。</p>\n  <button id=\"\
    click-me-btn\">Click Me!</button>\n</body>\n</html>\n```\n\n在同一目录下创建一个名为 `browserEvents.js`\
    \ 的新文件，并添加以下 JavaScript 代码。我们将首先选择元素并为其添加事件监听器：\n\n```javascript\nconst button\
    \ = document.querySelector('#click-me-btn')\n\nbutton.addEventListener('click',\
    \ () => {\n  alert('You clicked me!')\n})\n```\n\n在我们的 JavaScript 文件中，我们使用 `querySelector()`\
    \ 方法选择元素并将其存储在变量 `button` 中。然后，通过调用 `addEventListener()` 方法并将事件名称和事件处理器函数作为参数，为按钮添加点击事件监听器。事件处理器是一个显示消息框的匿名箭头函数。让我们将\
    \ JavaScript 文件包含在 HTML 代码中，以便浏览器可以执行它。在 `browserEvents.html` 文件中添加以下代码：\n\n```html\n\
    <script src=\"browserEvents.js\"></script>\n```\n\n现在你可以在浏览器中打开 HTML 文件并点击按钮。\n\
    \n###\n\n如果我们想获取有关发生事件或被点击元素的更多信息，我们可以向事件处理器函数传递一个事件参数。该参数将代表浏览器在执行时传递给函数的事件对象，它包含了发生事件的信息。事件对象的一些常用属性和方法包括：\n\
    \n**target**\n\n`target` 属性返回事件发生的元素。例如，如果我们想将被点击的元素记录到控制台，可以将 `browserEvents.js`\
    \ 文件中的点击事件处理器函数修改为：\n\n```javascript\nbutton.addEventListener('click', (event)\
    \ => {\n  console.log(event.target)\n})\n```\n\n刷新页面并点击按钮，控制台应该会出按钮元素 `<button\
    \ id=\"click-me-btn\">Click Me!</button>`。\n\n"
