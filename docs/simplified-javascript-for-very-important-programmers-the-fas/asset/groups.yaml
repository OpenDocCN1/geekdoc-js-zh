    of the initial <script> element that contained the JavaScript code.


    When the page loads, the browser will run the JavaScript code in


    the js-in-html.js file and display the alert box with the message


    “Hey everyone!”.


    Linking to a separate JavaScript file keeps the HTML and JavaScript


    code separate, which makes it easier to read and maintain. It also


    makes it easier to reuse the JavaScript code in multiple HTML files.


    For example, if we wanted to add the same alert to another HTML


    file, we could simply link to the same js-in-html.js file.


    The <script> tag has other attributes that we can use to control


    how the JavaScript code is loaded and executed. Let’s look at a few


    of them.'
  - '[PAGE 161]


    How to include JavaScript in an HTML file


    156


    **The** **async** **attribute**


    The async attribute tells the browser to load the JavaScript file asyn-


    chronously, which means that the browser can continue loading the


    HTML file while the JavaScript file is loading. This can be useful


    for large JavaScript files that take a long time to load. However,


    it can also cause problems if the JavaScript code depends on the


    HTML content being loaded first because, once the JavaScript file


    is loaded, the browser will execute the JavaScript code even if the


    HTML content hasn’t finished loading yet. Here’s how we would


    use the async attribute in a <script> element:


    1


    <**script** src="./js-in-html.js" async></**script**>


    **The** **defer** **attribute**


    The defer attribute tells the browser to load the JavaScript file


    asynchronously, but to execute the JavaScript code after the HTML


    file has been loaded. Unlike the async attribute, the defer attribute


    ensures that the JavaScript code is executed after the HTML content


    is loaded, avoiding any potential problems with the JavaScript code


    depending on the HTML content being loaded first. Here’s how we


    would use the defer attribute:


    1


    <**script** src="./js-in-html.js" defer></**script**>


    It’s important to note that the async and defer attributes are not


    supported by all browsers, particularly older ones. However, they


    are a good option for controlling how your JavaScript code is loaded


    and executed.'
  - '[PAGE 162]


    How to include JavaScript in an HTML file


    157


    **Conclusion**


    We’ve seen the different ways to include JavaScript code in an


    HTML file. Each method has its advantages and disadvantages and


    the choice of which to use depends on various factors like the size


    and complexity of the project, the required level of compatibility


    with different browsers, and the need for optimization.


    Regardless of which method you use, it’s essential to keep your code


    organized and maintainable, so that you can create reliable web


    applications that provide an excellent user experience.'
  - '[PAGE 163]


    **Browser Events**


    Browser events are actions that occur in the browser. These actions


    are usually initiated by the user, such as clicking on a button,


    scrolling through a web page or submitting a form. By using


    JavaScript, we can respond to these events and create dynamic,


    interactive web pages.


    When a user clicks a button on your webpage, you might want to


    react to that action by displaying a message or navigating to a new


    page. The browser provides a way to listen for these events and


    respond to them. Through the DOM, we can add event listeners to


    elements in our HTML page so that when a user performs a specific


    action, the browser will execute a JavaScript function in response


    to it. This function is called an event handler. Event handlers are


    often referred to as event listeners, but more specifically, the event


    listener is what listens for the event while the event handler is the


    function that is executed when the event occurs.


    DOM elements have an addEventListener() method that allows us


    to add event listeners to them. This method takes two arguments:


    the name of the event and the event handler function. For example,


    if we wanted to add a click event listener to a button, we would call


    its addEventListener() method and pass in the event name and the


    event handler function as arguments:


    1


    **const** button = document.querySelector(''button'')


    2


    3


    button.addEventListener(''click'', () => {


    4


    console.log(''You clicked me!'')


    5


    })


    Apart from the addEventListener() method, elements also have


    several event properties that we can set to event handler functions.'
  - '[PAGE 164]


    Browser Events


    159


