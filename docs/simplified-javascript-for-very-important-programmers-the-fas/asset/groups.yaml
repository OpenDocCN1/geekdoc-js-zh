    **Accessing elements with the** **querySelector**


    **and** **querySelectorAll** **methods**


    The querySelector and querySelectorAll methods are similar


    to the getElementById and getElementsByClassName methods, but


    they allow us to access elements more flexibly. With these methods,


    we can access elements using either their id, class or any other


    attribute. We can also access elements by their tag name, or by a


    combination of their tag name and attribute. Let’s see how these


    methods work.


    The querySelector method of the document object is used to access


    the first element that matches a specified selector. A selector is


    a string that specifies the element or elements to be selected. For


    example, the selector p will select all p elements on a web page. The


    querySelector method takes the selector as an argument and re-


    turns the first element that matches it. Let’s use the querySelector


    method to select the first p element on our web page:


    1


    document.querySelector(''p'')


    2


    3


    *// Output: <p id="dom-definition" class="paragraph">*


    4


    *// DOM stands for Document Object Model</p>*


    On the other hand, the querySelectorAll method returns a


    **NodeList** of all elements that match the specified selector. A


    NodeList is similar to an HTMLCollection, but is a more general


    list that can contain elements of different node types including


    text nodes, comment nodes, and document nodes. Both a NodeList


    and an HTMLCollection are array-like objects, so we can access


    their elements by index.'
- md: "\n## The Document Object Model (DOM)\n\n133\n\nLet’s use the querySelectorAll\
    \ method to select all p elements on our web page:\n\n```javascript\ndocument.querySelectorAll('p')\n\
    // Output: NodeList(2) [p#dom-definition.paragraph, p#dom-example.paragraph]\n\
    ```\n\nWe can also use the querySelector and querySelectorAll methods to select\
    \ elements by their id or class attributes. For example, the selector #dom-definition\
    \ will select the element with the id attribute of “dom-definition”, and the selector\
    \ .paragraph will select all elements with the class attribute of “paragraph”.\
    \ Let’s use the querySelector method to select the element with the id attribute\
    \ of “dom-definition”:\n\n```javascript\ndocument.querySelector('#dom-definition')\n\
    // Output: <p id=\"dom-definition\" class=\"paragraph\">DOM stands for Document\
    \ Object Model</p>\n```\n\nAnd let’s use the querySelectorAll method to select\
    \ all elements with the class attribute of “paragraph”:\n\n```javascript\ndocument.querySelectorAll('.paragraph')\n\
    // Output: NodeList(2) [p#dom-definition.paragraph, p#dom-example.paragraph]\n\
    ```\n\nTo access elements even more specifically, we can use a combination of\
    \ their tag name and attribute. For example, the selector p#dom-definition will\
    \ select the p element with the id attribute of “dom-definition” and the selector\
    \ p.paragraph will select all p elements with the class attribute of “paragraph”.\
    \ So if another element with the same class or id exists, the querySelector method\
    \ will only return the element that matches both the tag name and the attribute.\
    \ Let’s add a div element with the same class attribute of “paragraph” as the\
    \ p elements to our index.html file:\n\n```html\n<body>\n  <h1>Using JavaScript\
    \ to access the DOM</h1>\n  <p id=\"dom-definition\" class=\"paragraph\">\n  \
    \  DOM stands for Document Object Model\n  </p>\n  <p id=\"dom-example\" class=\"\
    paragraph\">\n    We can use the DOM to manipulate the content of a web page\n\
    \  </p>\n  <div class=\"paragraph\">\n    This div element has the same class\
    \ attribute as the p elements\n  </div>\n</body>\n```\n\nNow, let’s use the querySelector\
    \ method to select the div element with the class attribute of “paragraph”. Run\
    \ the following code on your browser console:\n\n```javascript\ndocument.querySelector('div.paragraph')\n\
    // Output: <div class=\"paragraph\">This div element has the same class attribute\
    \ as the p elements</div>\n```\n\nThe querySelector method returns only the element\
    \ that matches both the tag name and the attribute. Let’s get all p elements with\
    \ the class attribute of “paragraph” using the querySelectorAll method:\n\n```javascript\n\
    document.querySelectorAll('p.paragraph')\n// Output: NodeList(2) [p#dom-definition.paragraph,\
    \ p#dom-example.paragraph]\n```\n\nHere’s an example with the id attribute. We’ll\
    \ use the selector p#dom-definition to get the p element with id of “dom-definition”:\n\
    \n```javascript\ndocument.querySelector('p#dom-definition')\n// Output: <p id=\"\
    dom-definition\" class=\"paragraph\">DOM stands for Document Object Model</p>\n\
    ```\n\nWhen using the querySelector and querySelectorAll methods to access elements\
    \ by their id or class attributes, you must include the # or . symbol before the\
    \ attribute value. # represents the id attribute and . represents the class attribute.\
    \ If you don’t include them before the attribute value, the methods will assume\
    \ that you’re trying to access an element by its tag name. So if instead of using\
    \ “#dom-definition” we used “dom-definition”, the querySelector method would search\
    \ for an element with the tag name of “dom-definition” and return null:\n\n```javascript\n\
    document.querySelector('dom-definition')\n// Output: null\n```\n\n## Accessing\
    \ element attributes and properties\n\n### The attributes property and the getAttribute\
    \ method\n\nWe can access the attributes of an element using the getAttribute\
    \ method and the attributes property. The getAttribute method takes the name of\
    \ the attribute as an argument and returns the value of the attribute. The attributes\
    \ property returns an array-like object of all the attributes of an element. Let’s\
    \ use the getAttribute method to get the value of the id attribute of the p element\
    \ with the id of “dom-definition”:\n\n```javascript\ndocument.querySelector('#dom-definition').getAttribute('id')\n\
    // Output: \"dom-definition\"\n```\n\nAnd let’s use the attributes property to\
    \ get all the attributes of the p element with the id of “dom-definition”:\n\n\
    ```javascript\ndocument.querySelector('#dom-definition').attributes\n// Output:\
    \ NamedNodeMap(2) [id, class]\n```\n\nThe attributes property returns a **NamedNodeMap**\
    \ object that contains all the attributes of an element. *A NamedNodeMap represents\
    \ a collection of nodes that can be accessed by name.* We can access the attributes\
    \ of a NamedNodeMap object using the square bracket notation and the index of\
    \ the attribute or by using the dot notation and the name of the attribute. Let’s\
    \ use the square bracket notation to get the id attribute of the p element with\
    \ the id of “dom-definition”:\n\n```javascript\ndocument.querySelector('#dom-definition').attributes[0]\n\
    // Output: id\n```\n\nHere’s the same example using the dot notation:\n\n```javascript\n\
    document.querySelector('#dom-definition').attributes.id\n// Output: id\n```\n\n\
    To access the value of an attribute, we can use its value property:\n\n```javascript\n\
    document.querySelector('#dom-definition').attributes[0].value\n// Output: \"dom-definition\"\
    \n\ndocument.querySelector('#dom-definition').attributes.id.value\n// Output:\
    \ \"dom-definition\"\n```\n\n### The style property\n\nThe style property returns\
    \ an object that contains all the style properties of an element. Let’s get the\
    \ style property of our dom-definition element:\n\n```javascript\ndocument.querySelector('#dom-definition').style\n\
    // output: CSSStyleDeclaration {accentColor: '', backgroundColor: '', fontSize:\
    \ '', ...}\n```\n\nNotice that the style property returns a CSSStyleDeclaration\
    \ object. A CSSStyleDeclaration object represents a CSS declaration block. In\
    \ the JavaScript object, each style property is represented in camelCase. So instead\
    \ of background-color like in CSS, the style property is backgroundColor. Since\
    \ we’ve not styled the elements, each style property has an empty string as its\
    \ value.\n\nTo directly access the value of a style property, we can use the dot\
    \ or square bracket notation:\n\n```javascript\ndocument.querySelector('#dom-definition').style.backgroundColor\n\
    // Output: \"\"\n\ndocument.querySelector('#dom-definition').style['backgroundColor']\n\
    // Output: \"\"\n```\n\nWe can also use the getPropertyValue method to get the\
    \ value of a style property:\n\n```javascript\ndocument.querySelector('#dom-definition').style.getPropertyValue('background-color')\n\
    // Output: \"\"\n```\n\n## Modifying DOM Elements\n\nModifying elements in the\
    \ DOM is the same as modifying elements in a JavaScript object. We can reassign\
    \ the value of a DOM element’s properties, and add or remove properties. For example,\
    \ we can change the value of an element’s id attribute by reassigning the value\
    \ of the id property. Let’s change the id attribute of the p element with the\
    \ id of “dom-definition” to “new-dom-definition”:\n\n```javascript\ndocument.querySelector('#dom-definition').id\
    \ = 'new-dom-definition'\ndocument.querySelector('#new-dom-definition').getAttribute('id')\n\
    // Output: \"new-dom-definition\"\n```\n\nDOM elements also have a setAttribute\
    \ method that we can use to modify the value of an attribute. The setAttribute\
    \ method takes two arguments: the name of the attribute and the value of the attribute.\
    \ Let’s change the id attribute back to “dom-definition” using the setAttribute\
    \ method:\n\n```javascript\ndocument.querySelector('#new-dom-definition').setAttribute('id',\
    \ 'dom-definition')\ndocument.querySelector('#dom-definition').getAttribute('id')\n\
    // Output: \"dom-definition\"\n```\n\nElement styles can also be modified by reassigning\
    \ the value of a style property. Let’s change the background color of the dom-definition\
    \ element to red:\n```\n"
