- md: "\n## Higher Order Functions (HOFs) and Callbacks\n\n66\n\n```javascript\nconst\
    \ famousBirthYears = [\n  1990, 2001, 1989, 2023, 2005, 1993, 2020\n]\n\nfamousBirthYears.sort((a,\
    \ b) => b - a)\n\nconsole.log(famousBirthYears)\n// Output: [2023, 2020, 2005,\
    \ 2001, 1993, 1990, 1989]\n```\n\nIn this example, we sort the famousBirthYears\
    \ array in descending order. The callback function takes two parameters, a and\
    \ b, representing two elements in the array. Since we want to sort the array in\
    \ descending order, we return b - a so that the second element comes before the\
    \ first element (i.e., the bigger number comes before the smaller number). If\
    \ we wanted to sort the array in ascending order, we would return a - b so that\
    \ the first element comes before the second element (i.e., the smaller number\
    \ comes before the bigger number):\n\n```javascript\nfamousBirthYears.sort((a,\
    \ b) => a - b)\n\nconsole.log(famousBirthYears)\n// Output: [1989, 1990, 1993,\
    \ 2001, 2005, 2020, 2023]\n```\n\n### reverse() **\n\nWe can use the reverse()\
    \ method to reverse the order of the elements in an array. The reverse method\
    \ modifies the original array. Let’s see an example:\n\n```javascript\nconst agesOfStudents\
    \ = [13, 10, 15, 12, 11, 14]\n\nagesOfStudents.reverse()\n\nconsole.log(agesOfStudents)\n\
    // Output: [14, 11, 12, 15, 10, 13]\n```\n\nNotice that the reverse() method does\
    \ not sort the elements of an array. Instead, it reverses the order of the elements\
    \ from the last to the first.\n\n### reduce() **\n\nThe reduce() method reduces\
    \ an array to a single value. It iterates through an array, performs an action\
    \ on each element, and returns a single value. For example, if we want to add\
    \ all the elements in an array of numbers, we can do so with the reduce() method:\n\
    \n```javascript\nconst participantPoints = [10, 20, 30, 40, 50]\n\nconst totalPoints\
    \ = participantPoints.reduce(\n  (a, b) => a + b\n)\n\nconsole.log(totalPoints)\n\
    // Output: 150\n```\n\nThe reduce() method takes a callback function with two\
    \ parameters, a and b, representing two elements in the array. The callback function\
    \ then performs an action starting from the first element in the array. In our\
    \ example, we add the first element to the second element, then add the result\
    \ to the third element, and so on, until we get the total points. If we want to\
    \ minus the elements in the array, we would return a - b:\n\n```javascript\nconst\
    \ minusedPoints = participantPoints.reduce(\n  (a, b) => a - b\n)\n\nconsole.log(totalPoints)\n\
    // Output: -130\n```\n\nOur example above performs the action; 10 - 20 - 30 -\
    \ 40 - 50. We can use the same process to multiply the elements in the array:\n\
    \n```javascript\nconst multipliedPoints = participantPoints.reduce(\n  (a, b)\
    \ => a * b\n)\n\nconsole.log(multipliedPoints)\n// Output: 12000000\n```\n\nThis\
    \ time, we multiply the first element by the second element, then multiply the\
    \ result by the third element, and so on. The reduce() method does not modify\
    \ the original array.\n\nWe can also use the reduce() method to concatenate the\
    \ elements in an array of strings:\n\n```javascript\nconst favoriteDishes = [\n\
    \  'jollof',\n  'burger',\n  'yam',\n  'meatloaf',\n  'pizza',\n]\n\nconst favoriteDishesString\
    \ = favoriteDishes.reduce(\n  (a, b) => a + ', ' + b\n)\n\nconsole.log(favoriteDishesString)\n\
    // Output: jollof, burger, yam, meatloaf, pizza\n```\n\nWithout adding the comma\
    \ and space, the output would be jollofburgeryammeatloafpizza. Sounds like I just\
    \ invented a new dish. Haha!\n\n### every() **\n\nThe every() method checks if\
    \ all the elements in an array meet a condition. It returns a boolean value. For\
    \ example, if we want to check if all the elements in an array of numbers are\
    \ greater than 5, we can do so with the every() method:\n\n```javascript\nconst\
