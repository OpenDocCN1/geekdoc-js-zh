- md: "\nVariables in JavaScript\n22\n\n## The const keyword\n\nSo far, we’ve seen\
    \ how to create local and global variables which can be reassigned. But most times,\
    \ it’s safer to create variables that can’t be reassigned so that we don’t accidentally\
    \ change their values. The const keyword is used for this purpose.\n\nHere’s an\
    \ example of a constant variable:\n\n```javascript\nconst age = 21\n```\n\nIf\
    \ we attempt to reassign the value of the age variable, we’ll get an error:\n\n\
    ```javascript\nage = 22\n// Uncaught TypeError: Assignment to constant variable.\n\
    ```\n\nThis is because the age variable is a constant variable and can’t be reassigned.\
    \ Using the const keyword is my preferred way of declaring variables that don’t\
    \ need to be reassigned.\n\n## Variable naming rules and conventions\n\nIn programming,\
    \ a **convention** is a set of guidelines you should follow to ensure that your\
    \ code is written in a consistent style and is easy to read and understand. When\
    \ naming your variables, it’s essential to follow the JavaScript variable naming\
    \ conventions to ensure that your code runs properly and to avoid bugs. A **bug**\
    \ is an error in your code that causes it to run incorrectly or not run at all.\
    \ Here are the rules and conventions commonly followed when naming variables in\
    \ JavaScript. We’ll start with the things you should avoid, then move on to what\
    \ you should do when naming your variables.\n\nVariables in JavaScript\n23\n\n\
    ### Avoid using numbers as the first character of a variable name\n\nVariable\
    \ names can’t start with a number, although they can contain numbers. For example,\
    \ the variable name person1 is valid, but if you name your variable 1person, you’ll\
    \ get an error.\n\n### Avoid using special characters in variable names\n\nIn\
    \ JavaScript, special characters are characters that have a specific meaning or\
    \ use in the language and are not letters, numbers, or symbols. These include\
    \ the following: @ ! # $ % ^ & * ( ) _ + - = { } [ ] : ; “ ’ < > , . ? / \\ |\
    \ ‘ ~\n\nVariable names cannot contain special characters, so if you try to name\
    \ your variable name-of-person or #name_of_person, you’ll get an error. The dollar\
    \ symbol is sometimes used as a prefix for variable names, but this is not a requirement\
    \ and is generally not recommended.\n\n### Avoid using spaces in variable names\n\
    \nVariable names cannot contain spaces. So naming your variable my country or\
    \ my age will result in an error.\n\nVariables in JavaScript\n24\n\n### Avoid\
    \ using reserved words in your variable names\n\nJavaScript has a list of reserved\
    \ words that cannot be used as variable names. These include words like var, const,\
    \ and let. Using a reserved word as a variable name will result in an error. You\
    \ can check out the full list of JavaScript reserved words in the Mozilla Developer\
    \ Network (MDN) documentation. (link here)\n\n### Maximum and Minimum length of\
    \ a variable name\n\nThere is no explicit maximum or minimum length for variable\
    \ names in JavaScript. However, some constraints can affect the maximum length\
    \ of your variable name.\n\nOne such constraint is the maximum length of a string\
    \ in JavaScript, which is 2^53 - 1 (approximately 9 quadrillion characters). So\
    \ you can’t have a variable name longer than this, but it’s unlikely that you’ll\
    \ need to use a variable name this long in practice.\n\n### Use camelCase for\
    \ variable names\n\nWhen naming variables, one word might not be enough to describe\
    \ what the variable is storing. Since you cannot use spaces in variable names,\
    \ you can use camelCase to separate the words that make up your variable name.\n\
    \nCamelCase is a naming convention in which the first letter of a variable name\
    \ is in lowercase, and the first letter of each subsequent word is in uppercase.\
    \ For example, if you want to name a variable that stores a student’s age, you\
    \ can write it as studentAge or ageOfStudent.\n\nVariables in JavaScript\n25\n\
    \nIn JavaScript, camelCase is the most commonly used naming convention for variables.\
    \ So, when naming your variables, always start with a lowercase letter and use\
    \ camelCase to separate the words.\n\n### Use meaningful variable names\n\nIt’s\
    \ important to use descriptive and meaningful names for your variables; this will\
    \ make your code easier to write, read and understand. For example, if you’re\
    \ creating a variable to store a student’s name, you should write something like\
    \ nameOfStudent or studentName instead of x or sname. Your variable names should\
    \ always represent the data they store because descriptive variable names make\
    \ it easier to understand the purpose and function of variables. This will help\
    \ you avoid bugs, improve the quality of your code and make it easier to maintain.\n\
    \nHow you name your variables is very important, and by following the recommended\
    \ conventions, you’ll be able to write code that is easy to read, understand and\
    \ maintain.\n\n## Basic JavaScript operators\n\nOperators are symbols that perform\
    \ actions on values. For example, when you write 2+3 on your calculator, you use\
    \ the + operator to add two values. The values 2 and 3 are called operands, while\
    \ the plus symbol (+) is the operator. In this chapter, we’ll explore the different\
    \ types of operators in JavaScript, including:\n\n- Arithmetic operators\n- String\
    \ operators\n- Assignment operators\n- Comparison operators\n- Logical operators\n\
    \n### Arithmetic operators\n\nWe use arithmetic operators to perform mathematical\
    \ calculations like addition (+), subtraction (-), multiplication (*), and division\
    \ (/). Here are examples you can try in the console:\n\n```javascript\nconsole.log(10\
    \ + 2) // Output: 12\nconsole.log(10 - 2) // Output: 8\nconsole.log(10 * 2) //\
    \ Output: 20\nconsole.log(10 / 2) // Output: 5\n```\n\nWe also have the increment\
    \ and decrement operators. The increment operator (++) increases the value of\
    \ a variable by 1, while the decrement operator (--) decreases the value of a\
    \ variable by 1. These operators can be placed before or after the operand.\n\n\
    When placed before the operand, the operators are called prefix operators, which\
    \ means that the operation is applied before the value is returned, giving us\
    \ a new value. Here’s an example:\n\n```javascript\nlet firstValue = 3\nconsole.log(++firstValue)\
    \ // Output: 4\n```\n\nWhen placed after the operand, they are called postfix\
    \ operators; the operation is applied to the variable after the current value\
    \ is returned. Here’s an example:\n\n```javascript\nlet secondValue = 5\nconsole.log(secondValue++)\
    \ // Output: 5\nconsole.log(secondValue) // Output: 6\n```\n\nNotice that we have\
    \ to log the variable separately to get its new value. This is because when you\
    \ use the postfix operator, the value is returned first, and then the operation\
    \ is applied.\n\nIt’s also important to note that the increment and decrement\
    \ operators reassign new values to variables, so you can only do this with variables\
    \ you declare using the let keyword. If you try to use these operators on a variable\
    \ you declare with the const keyword, you’ll get an error. Let’s give it a try.\
    \ Remember always to run these examples yourself to see the results:\n\n```javascript\n\
    const thirdValue = 7\nconsole.log(++value) // Uncaught ReferenceError: value is\
    \ not defined\n```\n\nThere are two other arithmetic operators that you can use\
    \ in JavaScript: **the remainder operator** (%) and **the exponentiation operator**\
    \ (**).\n\nBasic JavaScript operators\n28\n\nThe **remainder operator** returns\
    \ the remaining value when an operand is divided by another. So if you run 5 %\
    \ 2 on your console, you’ll get 1 because 2 will go into 5 twice and leave 1 as\
    \ the remainder.\n\nThe **exponentiation operator** raises the first operand to\
    \ the power of the second operand. So if you run 2 ** 3 on your console, you’ll\
    \ get 8 because 2 to the power of 3 is 8 (that is 2*2*2).\n\n## The Concatenation\
    \ operator\n\nIn JavaScript, we use the concatenation operator to concatenate\
    \ strings. The plus symbol (+) serves as the concatenation operator when one or\
    \ more of the operands are strings. So if you run 'Hello' + 'World' on your console,\
    \ you’ll get “HelloWorld” as the output.\n\nAlso, if you run 'Hello' + 1 on your\
    \ console, you’ll get ‘Hello1’ as the output. When you use the plus operator with\
    \ strings and numbers, the numbers will be converted to their string form and\
    \ then concatenated. Let’s try some more examples:\n\n```javascript\nconsole.log('Hello'\
    \ + ' ' + 'Everyone') // Output: Hello Everyone\nconsole.log('James ' + 'Bond\
    \ ' + 007) // Output: James Bond 007\nconsole.log(\n  10 + 'years from now' +\
    \ \"I'll be a 100 years old\"\n) // Output: 10 years from now I'll be a 100 years\
    \ old\n```\n\nNotice that we used the space character (’ ’) to separate the words\
    \ in the first example. If we didn’t use the space character, we would get ‘HelloEveryone’\
    \ as the output. In the second example, we added the space character in the same\
    \ string as the word ‘James’. This is another way to add spaces between words\
    \ when concatenating strings.\n"
  mdcn: "\nJavaScript 中的变量\n22\n\n## const 关键字\n\n到为止，我们已经学习了如何创建可以重新赋值的局部和全局变量。但大多数情况下，创建不可重新赋值的变量更安全，这样我们就不会意外改变它们的值。`const`\
    \ 关键字就用于此目的。\n\n这是一个常量变量的示例：\n\n```javascript\nconst age = 21\n```\n\n如果我们尝试重新给\
    \ `age` 变量赋值，将会得到一个错误：\n\n```javascript\nage = 22\n// Uncaught TypeError: Assignment\
    \ to constant variable.\n```\n\n这是因为 `age` 变量是一个常量变量，不能重新赋值。使用 `const` 关键字是我声明不需要重新赋值的变量的首选方式。\n\
    \n## 变量命名规则和规范\n\n在编程中，**惯例**（convention）是你应该遵循的一系列指南，以确保你的代码以一致的风格编写，并且易于阅读和理解。在命名变量时，遵循\
    \ JavaScript 变量命名规范至关重要，这可以确保你的代码正常运行并避免错误。**bug**（bug）是你代码中的错误，会导致程序运行异常或完全不运行。以下是在\
    \ JavaScript 中命名变量时通常遵循的规则和规范。我们将从应该避免的事开始，然后介绍在命名变量时应该做什么。\n\nJavaScript 中的变量\n\
    23\n\n### 避免使用数字作为变量名的第一个字符\n\n变量名不能以数字开头，尽管它们包含数字。例如，变量名 `person1` 是有效的，但如果你将变量命名为\
    \ `1person`，就会得到一个错误。\n\n### 避免在变量名中使用特殊字符\n\n在 JavaScript 中，特殊字符是在语言中具有特定含义或用途且不是字母、数字或符号的字符。这些包括：@\
    \ ! # $ % ^ & * ( ) _ + - = { } [ ] : ; “ ’ < > , . ? / \\ | ‘ ~\n\n变量名不能包含特殊字符，因此如果你尝试将变量命名为\
    \ `name-of-person` 或 `#name_of_person`，就会得到一个错误。美元符号 `$` 有时用作变量名前缀，但这并不是要求的，且通常不建议这样做。\n\
    \n### 避免在变量名中使用空格\n\n变量名不能包含空格。因此，将变量命名为 `my country` 或 `my age` 将导致错误。\n\nJavaScript\
    \ 中的变量\n24\n\n### 避免在变量名中使用保留字\n\nJavaScript 有一组不能用作变量名的保留字。这些包括如 `var`、`const`\
    \ 和 `let` 等词。将保留字作为变量名会导致错误。你可以在 Mozilla 开发者网络 (MDN) 文档中查看 JavaScript 保留字的完整列表。（[在这里]）\n\
    \n### 变量名的最大和最小长度\n\nJavaScript 中的变量名没有明确的最大或最小长度限制。然而，某些限制可能会影响变量名的最大长度。\n\n\
    其中一个限制是 JavaScript 中字符串的最大长度，为 $2^{53} - 1$（约 9 万亿个字符）。所以你不能拥有比这更长的变量名，但在实践中，你可能不需要这么长的变量名。\n\
    \n### 使用驼峰命名法命名变量\n\n在命名变量时，一个单词可能不足以描述变量存储的内容。由于你不能在变量名中使用空格，可以使用驼峰命名法（camelCase）来分隔组成变量名的单词。\n\
    \n驼峰命名法是一种命名规范，其中变量名的第一个字母字母小写，每个后续单词的首字母字母大写。例如，如果你想命名一个存储学生年龄的变量，可以写成 `studentAge`\
    \ 或 `ageOfStudent`。\n\nJavaScript 中的变量\n25\n\n在 JavaScript 中，驼峰命名法是变量最常用的命名规范。因此，在命名变量时，始终从小写字母开头并使用驼峰命名法来分隔单词。\n\
    \n### 使用有意义的变量名\n\n为变量使用描述性且有意义的名字是非常重要的；这会让你的代码更易编写、阅读和理解。例如，如果你正在创建一个变量来存储学生姓名，你应该写类似\
    \ `nameOfStudent` 或 `studentName`，而不是 `x` 或 `sname`。你的变量名应该始终代表它们所存储的数据，因为描述性的变量名有助于更好地理解变量的作用和功能。这将帮助你避免\
    \ bug，提高代码质量并使其更易维护。\n\n如何命名变量非常重要，通过遵循建议的规范，你将编写出易于阅读、理解和维护的代码。\n\n## 基础 JavaScript\
    \ 运算符\n\n运算符是可以在值上执行操作的符号。例如，当你在计算器上输入 `2+3` 时，你使用 `+` 运算符来相两个值。值 2 和 3 被称为操作数，而加号符号\
    \ (`+`) 是运算符。在本章中，我们将探索 JavaScript 中不同类型的运算符，包括：\n\n- 算术运算符\n- 字符串运算符\n- 赋值运算符\n\
    - 比较运算符\n- 逻辑运算符\n\n### 算术运算符\n\n我们使用算术运算符执行数学计算，如加法 (+)、减法 (-)、乘法 (*) 和除法 (/)。以下是一些你可以在控制台中尝试的示例：\n\
    \n```javascript\nconsole.log(10 + 2) // 输出: 12\nconsole.log(10 - 2) // 输出: 8\n\
    console.log(10 * 2) // 输出: 20\nconsole.log(10 / 2) // 输出: 5\n```\n\n我们还有递增和递减运算符。递增运算符\
    \ (`++`) 将变量的值加1，而递减运算符 (`--`) 将变量的值减 1。这些运算符可以放在操作数之前或之后。\n\n当放在操作数之前时，这些运算符被称为前置运算符，这意味着操作在返回值之前应用，从而给我们一个新值。这是一个示例：\n\
    \n```javascript\nlet firstValue = 3\nconsole.log(++firstValue) // 输出: 4\n```\n\
    \n当放在操作数之后时，它们被称为后置运算符；操作在返回当前值后应用到变量。这是一个示例：\n\n```javascript\nlet secondValue\
    \ = 5\nconsole.log(secondValue++) // 输出: 5\nconsole.log(secondValue) // 输出: 6\n\
    ```\n\n注意，我们必须单独记录变量以获取它的新值。这是因为当你使用后置运算符时，值先返回，然后应用操作。\n\n同样重要的是，递增和递减运算符会给变量赋新值，因此你只能对使用\
    \ `let` 关键字声明的变量执行此操作。如果你对使用 `const` 关键字声明的变量使用这些运算符，将得到错误。让我们尝试一下。记住始终亲自运行这些示例以查看结果：\n\
    \n```javascript\nconst thirdValue = 7\nconsole.log(++value) // Uncaught ReferenceError:\
    \ value is not defined\n```\n\nJavaScript 中还有两个你可以使用的算术运算符：**取模运算符** (%) 和 **幂运算符**\
    \ (**)。\n\n基础 JavaScript 运算符\n28\n\n**取模运算符**当操作数被另一个操作数除时返回剩余的值。因此，如果你在控制台中运行\
    \ `5 % 2`，你会得到 1，因为 2 除 5 两次余 1。\n\n**幂运算符**将第一个操作数提升为第二个操作数的幂。因此，如果你在控制台中运行 `2\
    \ ** 3`，你会得到 8，因为 2 的三幂是 8（即 2*2*2）。\n\n## 拼接运算符\n\n在 JavaScript 中，我们使用拼接运算符来拼接字符串。当一个或多个操作数是字符串时，加号符号\
    \ (`+`) 用充拼接运算符。因此，如果你在控制台中运行 `'Hello' + 'World'`，你会得到输出 “HelloWorld”。\n\n此外，如果你在控制台中运行\
    \ `'Hello' + 1`，你会得到输出 ‘Hello1’。当你对字符串和数字使用加运算符时，数字将转换为字符串形式然后进行拼接。让我们尝试更多示例：\n\
    \n```javascript\nconsole.log('Hello' + ' ' + 'Everyone') // 输出: Hello Everyone\n\
    console.log('James ' + 'Bond ' + 007) // 输出: James Bond 007\nconsole.log(\n  10\
    \ + 'years from now' + \"I'll be a 100 years old\"\n) // 输出: 10 years from now\
    \ I'll be a 100 years old\n```\n\n注意我们在第一个示例中使用了空格字符 (' ’) 来分隔单词。如果不使用空格字符，我们将得到输出\
    \ ‘HelloEveryone’。在第二个示例中，我们在单词 ‘James’ 的同一个字符串中添加了空格字符。这是在拼接字符串时在单词间添加空格的另一种方法。\n"
