- md: "\n## Building A Todo List App with JavaScript\n\n```javascript\nconst renderTasks\
    \ = () => {\n  storedTasks.forEach((task) => {\n    taskList.insertAdjacentHTML(\n\
    \      'beforeend',\n      createTaskItem(task)\n    )\n  })\n}\n```\n\nThe `insertAdjacentHTML()`\
    \ method takes two arguments: the position where we want to insert the HTML code,\
    \ and the HTML code itself. In this case, we’re using the `beforeend` position,\
    \ which will add the HTML code at the end of the unordered list. Next, we’ll call\
    \ the `renderTasks()` function on page load. This will render the tasks we have\
    \ in LocalStorage to the browser whenever the page loads:\n\n```javascript\nwindow.onload\
    \ = renderTasks\n```\n\nOur `todoApp.js` file should now look like this:\n\n```javascript\n\
    const taskInput = document.querySelector('#taskInput')\nconst taskList = document.querySelector('#taskList')\n\
    const addTaskForm = document.querySelector('#addTaskForm')\n\ntaskList.style =\
    \ `\n  list-style: none;\n  margin-top: 1rem;\n  font-size: 1.5rem;\n`\n\nconst\
    \ createTaskItem = (task) => `\n  <li>\n    <input type=\"checkbox\" name=\"task\"\
    \ value=\"${task}\">\n    <label for=\"task\">${task}</label>\n    <button type=\"\
    button\">X</button>\n  </li>\n`\n\nconst storedTasks = JSON.parse(localStorage.getItem('tasks'))\
    \ || []\n\nconst renderTasks = () => {\n  storedTasks.forEach((task) => {\n  \
    \  taskList.insertAdjacentHTML(\n      'beforeend',\n      createTaskItem(task)\n\
    \    )\n  })\n}\n\nwindow.onload = renderTasks\n```\n\n### Adding tasks to the\
    \ list\n\nNow, let’s create the function that will add a task to the list when\
    \ the user clicks the submit button. We’ll use the `addEventListener()` method\
    \ to listen for the submit event on the form. When the event is triggered, we’ll\
    \ prevent the default behavior of the form, which is to reload the page. We’ll\
    \ then get the value of the input field, create a new list item using the `createTaskItem()`\
    \ function, and add it to the `ul` element on the page. We’ll also add the task\
    \ to the `storedTasks` array and store it in LocalStorage with the key `tasks`,\
    \ then we’ll clear the input field by resetting the form using the `reset()` method\
    \ which is available on all form elements:\n\n```javascript\nconst addTask = (event)\
    \ => {\n  event.preventDefault()\n\n  const task = taskInput.value\n  const taskItem\
    \ = createTaskItem(task)\n  taskList.insertAdjacentHTML('beforeend', taskItem)\n\
    \n  storedTasks.push(task)\n  localStorage.setItem('tasks', JSON.stringify(storedTasks))\n\
    \n  addTaskForm.reset()\n}\n```\n\nNext, we’ll add an event listener to the form\
    \ that will call the `addTask()` function when the form is submitted:\n\n```javascript\n\
    addTaskForm.addEventListener('submit', addTask)\n```\n\nWe can also add the event\
    \ listener using the `onsubmit` attribute on the form element in the `todoApp.html`\
    \ file:\n\n```html\n<form id=\"addTaskForm\" onsubmit=\"addTask(event)\"></form>\n\
    ```\n\nThis will do the same thing as the `addEventListener()` method, but we’ll\
    \ go with the `addEventListener()` method so that we can keep all of our JavaScript\
    \ code in the `todoApp.js` file.\n\nTo test our progress so far, open the `todoApp.html`\
    \ file in your browser. You should see the form and the unordered list. Enter\
    \ a task in the input field and click the submit button. You should see the task\
    \ added to the list. Also, when you refresh the page, the task should still be\
    \ there.\n\n### Marking tasks as complete\n\nNow, let’s add the functionality\
    \ for marking tasks as complete. When a user ticks the checkbox for a task, we’ll\
    \ cross it out using the `textDecoration` style, and if they untick the checkbox,\
    \ we’ll undo the cross-out. Let’s start by creating a function named `toggleTaskCompletion()`.\
    \ Our function will take the event object as an argument, and we’ll use the `target`\
    \ property of the event object to get the checkbox that was clicked. Then we’ll\
    \ use the `parentElement` property to get the list item that contains the checkbox.\
    \ Next, we’ll use the `querySelector()` method to get the label element inside\
    \ the list item. If the checkbox is checked, we’ll set the `textDecoration` style\
    \ to `line-through`, otherwise, we’ll set it to `none`:\n\n```javascript\nconst\
    \ toggleTaskCompletion = (event) => {\n  const taskItem = event.target.parentElement\n\
    \  const label = taskItem.querySelector('label')\n  if (event.target.checked)\
    \ {\n    label.style.textDecoration = 'line-through'\n  } else {\n    label.style.textDecoration\
    \ = 'none'\n  }\n}\n```\n\nNext, we’ll add an event listener to the checkbox in\
    \ the `createTaskItem()` function. Update your function to this:\n\n```javascript\n\
    const createTaskItem = (task) => `\n  <li>\n    <input type=\"checkbox\" name=\"\
    task\" value=\"${task}\" onchange=\"toggleTaskCompletion(event)\">\n    <label\
    \ for=\"task\">${task}</label>\n    <button type=\"button\">X</button>\n  </li>\n\
    `\n```\n\n### Removing tasks\n\nNext, we’ll add the functionality for removing\
    \ tasks from the list. When a user clicks the X button, we’ll remove the task\
    \ from the page, from the `storedTasks` array, and update LocalStorage so that\
    \ refreshing the page won’t bring it back. We’ll start by creating a function\
    \ named `removeTask()`:\n\n```javascript\nconst removeTask = (event) => {\n  const\
    \ taskItem = event.target.parentElement\n  const task = taskItem.querySelector('label').innerText\n\
    \  const index = storedTasks.indexOf(task)\n\n  storedTasks.splice(index, 1)\n\
    \  localStorage.setItem('tasks', JSON.stringify(storedTasks))\n\n  taskItem.remove()\n\
    }\n```\n\nFinally, we’ll add an onClick event listener to the button in the `createTaskItem()`\
    \ function. Update your function to this:\n\n```javascript\nconst createTaskItem\
    \ = (task) => `\n  <li>\n    <input type=\"checkbox\" name=\"task\" value=\"${task}\"\
    \ onchange=\"toggleTaskCompletion(event)\">\n    <label for=\"task\">${task}</label>\n\
    \    <button type=\"button\" onclick=\"removeTask(event)\">X</button>\n  </li>\n\
    `\n```\n\nYou can now remove tasks from the list by clicking the X button.\n"
