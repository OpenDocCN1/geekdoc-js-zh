- md: "\n## Loops\n\nThe if statement checks if the current value of i is equal to\
    \ 5. If it is, the continue statement is executed, which skips the rest of the\
    \ code in the loop and continues with the next iteration.\n\n### **the break keyword**\n\
    \nThe break keyword is used to exit a loop. So if instead, we want to stop the\
    \ loop when i is equal to 5, we can use the break keyword:\n\n```javascript\n\
    for (let i = 1; i <= 10; i++) {\n  if (i === 5) {\n    break\n  }\n  console.log(i)\n\
    }\n```\n\nOutput:\n```\n1\n2\n3\n4\n```\nSince the break statement ends the loop\
    \ when i is equal to 5, the console.log() statement is not executed for that iteration.\
    \ So we only get the numbers from 1 to 4 logged to the console.\n\n### **The for...in\
    \ loop**\n\nThe for...in loop is used to iterate over the enumerable properties\
    \ of an object. If we have an object with a list of properties and we want to\
    \ access each property, we could use a for loop to iterate over the object’s properties\
    \ like this:\n\n```javascript\nlet person = {\n  name: 'Jane',\n  age: 27,\n \
    \ city: 'Kigali',\n}\n\nfor (let i = 0; i < Object.keys(person).length; i++) {\n\
    \  console.log(\n    `${Object.keys(person)[i]}: ${person[Object.keys(person)[i]]}`\n\
    \  )\n}\n```\n\nWhile this works, it’s not easy to read. We can use the for...in\
    \ loop to write the same code in a more concise way. With the for...in loop, we\
    \ can directly access the keys of an object without having to use the Object.keys()\
    \ method:\n\n```javascript\nlet person = {\n  name: 'Jane',\n  age: 27,\n  city:\
    \ 'Kigali',\n}\n\nfor (let key in person) {\n  console.log(`${key}: ${person[key]}`)\n\
    }\n```\n\nOutput:\n```\nname: Jane\nage: 27\ncity: Kigali\n```\nIn the example\
    \ above, we declared a variable named key and assigned it the value of each property\
    \ in the person object using the in operator. We then used the key variable to\
    \ access the value of each property in the person object. **The in operator in\
    \ JavaScript is used to check whether a specified property is in an object.**\
    \ We can also use it outside of a loop:\n\n```javascript\nlet person = {\n  name:\
    \ 'Jane',\n  age: 27,\n  city: 'Kigali',\n}\n\nif ('name' in person) {\n  console.log('The\
    \ person object has a name property.')\n}\n\n// Output: The person object has\
    \ a name property.\n```\n\nWe can also use it to check if an element exists in\
    \ an array:\n\n```javascript\nlet fruits = ['apple', 'banana', 'orange']\n\nif\
    \ ('apple' in fruits) {\n  console.log(\n    'The apple element exists in the\
    \ fruits array.'\n  )\n}\n\n// Output: The apple element exists in the fruits\
    \ array.\n```\n\nSince we can use the in operator on an array, we can also use\
    \ the for...in loop to iterate over the elements of an array:\n\n```javascript\n\
    let names = ['Jane', 'John', 'Ada']\n\nfor (let index in names) {\n  console.log(names[index])\n\
    }\n```\n\nOutput:\n```\nJane\nJohn\nAda\n```\nWhen using the for...in loop to\
    \ iterate over an array, the variable assigned to the in operator will be the\
    \ index of each element in the array. An easier way to iterate over the elements\
    \ of an array is to use the for...of loop.\n\n### **The for...of loop**\n\nThe\
    \ for...of loop is similar to the for...in loop, but it iterates over the values\
    \ of an array instead of the indexes. Let’s rewrite the names loop example using\
    \ the for...of loop:\n\n```javascript\nlet names = ['Jane', 'John', 'Ada']\n\n\
    for (let name of names) {\n  console.log(name)\n}\n```\n\nOutput:\n```\nJane\n\
    John\nAda\n```\nWhen accessing the elements of an array using the for...of loop,\
    \ the variable assigned to the of operator will be the value of each element in\
    \ the array. We can also use the for...of loop to iterate over the characters\
    \ of a string:\n\n```javascript\nlet name = 'Jane'\n\nfor (let character of name)\
    \ {\n  console.log(character)\n}\n```\n\nOutput:\n```\nJ\na\nn\ne\n```\nWhen working\
    \ with arrays, the for...of loop is easier to read and understand than the for...in\
    \ loop. However, we can’t use the for...of loop to directly access the properties\
    \ of an object as we did with the for...in loop.\n\n### **The while Loop**\n\n\
    The while loop is similar to the for loop but doesn’t have a final expression.\
    \ It’s used when we don’t know how many times a loop will run. For example, if\
    \ we have a dice game where we roll a die until we get a 6. We could get a 6 on\
    \ the first roll, or it could take 10 rolls. Since we don’t know how many times,\
    \ we can’t use a for loop. With the while loop, you can keep rolling the die as\
    \ long as the value is not 6. In plain English, writing the while loop would look\
    \ like this:\n\nWhile the value of the die is not 6, roll the die.\n\nLet’s see\
    \ how we could write the while loop in JavaScript. We’ll use the Math.random()\
    \ method to generate a random number from 1 to 6, then the Math.ceil() method\
    \ to round the number up to the nearest integer. First, we’ll create a variable\
    \ named dieRoll, then we’ll use the while loop to update its value until our Math\
    \ methods return a 6:\n\n```javascript\nlet dieRoll = 0\n\nwhile (dieRoll !==\
    \ 6) {\n  dieRoll = Math.ceil(Math.random() * 6)\n  console.log(`You rolled a\
    \ ${dieRoll}`)\n}\n```\n\nDepending on how many rolls it takes to get a 6, the\
    \ code should return something like this (but not exactly since the numbers are\
