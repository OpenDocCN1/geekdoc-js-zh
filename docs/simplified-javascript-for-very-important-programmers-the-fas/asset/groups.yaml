    ## 基础 JavaScript 运算符


    29


    在第三个示例中，我们使用双引号（“ ”）来包裹字符串。这是因为字符串（I’ll）包含一个单引号，如果我们也使用单引号（’ ’）来包裹它，就会导致错误。


    ### 赋值运算符


    我们使用赋值运算符来给变量赋值。你已经见过赋值运算符 (=) 的用法了。JavaScript 中还有复合赋值运算符，包括： +=, -=, *=, /=,
    和 %=。这些复合运算符会对变量和操作数执行操作，然后将结果赋值给该变量。例如，如果你有一个名为“age”且值为 10 的变量，想让它增加 5，可以这样使用
    +=+= 运算符：


    ```javascript

    let age = 10

    age += 5; // 输出: 15

    ```


    使用 `+=` 运算符等同于编写 `age = age + 5`，这会将 `age` 变量重新赋值为 10 + 5。让我们用其他复合赋值运算符尝试一些例子：


    ```javascript

    age = 10

    age *= 5; // Output: 50

    age /= 5; // Output: 10

    age -= 5; // Output: 5

    age %= 5; // Output: 0

    ```


    复合赋值运算符是减少代码重复的一种极佳方法。


    ### 比较运算符


    我们使用比较运算符来比较两个值，并根据比较结果返回布尔值（true 或 false）。以下是比较运算符及其含义：


    - == : 等于

    - != : 不等于

    - > : 大于

    - < : 小于

    - >= : 大于等于

    - <= : 小于等于

    - === : 严格等于（比较操作数的值和类型）

    - !== : 严格不等于（比较操作数的值和类型）


    让我们尝试一些例子：


    ```javascript

    console.log(10 == 10); // 输出: true

    console.log(10 == 5); // 输出: false

    console.log(10 != 5); // 输出: true

    console.log(10 > 5); // 输出: true

    console.log(10 < 5); // 输出: false

    console.log(10 >= 10); // 输出: true

    console.log(10 >= 11); // false: 10 既不大于等于 11

    console.log(10 <= 10); // true: 10 等于 10

    console.log(10 <= 9); // false: 10 既不小于等于 9

    console.log(10 === 10); // true: 10 等于 10 且它们都是数字

    console.log(10 === ''10''); // false: 数字 10 不等于字符串 ''10''

    console.log(10 !== 9); // true: 10 不等于 9

    console.log(10 !== ''10''); // true: 数字 10 不等于字符串 ''10''

    ```


    ### 逻辑运算符


    在 JavaScript 中，我们使用逻辑运算符来执行逻辑操作，如与 (&&)、或 (||) 和非 (!)。以下是一些示例：


    ```javascript

    console.log(true && true); // 输出: true

    console.log(true && false); // 输出: false

    console.log(false && true); // 输出: false

    console.log(false && false); // 输出: false

    console.log(true || true); // 输出: true

    console.log(true || false); // 输出: true

    console.log(false || true); // 输出: true

    console.log(false || false); // 输出: false

    console.log(!true); // 输出: false

    console.log(!false); // 输出: true

    ```


    当两个操作数都为 true 时，与运算符 && 返回 true；如果任一操作数为 false，它则返回 false。所以，如果你在控制台中运行 `console.log(10
    > 5 && 7 < 10)`，你将得到 true 输出，因为 10 大于 5 且 7 小于 10。但如果你在控制台中运行 `console.log(10
    > 5 && 7 > 10)`，你将得到 false 输出，因为 10 大于 5，但 7 并不大于 10。使用或运算符 || 时，如果至少有一个操作数为 true，则返回
    true；如果两个操作数都为 false 则返回 false。所以，如果你在控制台中运行 `console.log(10 > 5 || 7 > 10)`，你将得到
    true 输出，因为 10 大于 5。非运算符 ! 会反转其操作数的布尔值。所以，如果你在控制台中运行 `console.log(!(10 > 5))`，你将得到
    false 输出，因为 10 大于 5。


