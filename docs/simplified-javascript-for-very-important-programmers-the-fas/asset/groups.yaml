    \   break\n  }\n  console.log(i)\n}\n```\n\n输出：\n```\n1\n2\n3\n4\n```\n由于 `break`\
    \ 语句在 `i` 等于 5 时结束了循环，因此在该迭代中不会执行 `console.log()` 语句。所以我们只在控制台中打印了从 1 到 4 的数字。\n\
    \n### **for...in 循环**\n\n`for...in` 循环用于遍历对象的可枚举属性。如果我们有一个包含属性列表的对象，并且想要访问每个属性，可以使用\
    \ `for` 循环来遍历对象的属性，如下所示：\n\n```javascript\nlet person = {\n  name: 'Jane',\n \
    \ age: 27,\n  city: 'Kigali',\n}\n\nfor (let i = 0; i < Object.keys(person).length;\
    \ i++) {\n  console.log(\n    `${Object.keys(person)[i]}: ${person[Object.keys(person)[i]]}`\n\
    \  )\n}\n```\n\n虽然这种方法可行，但并不易读。我们可以使用 `for...in` 循环用更简洁的方式编写相同的代码。通过 `for...in`\
    \ 循环，我们可以直接访问对象的键，而不需要使用 `Object.keys()` 方法：\n\n```javascript\nlet person = {\n\
    \  name: 'Jane',\n  age: 27,\n  city: 'Kigali',\n}\n\nfor (let key in person)\
    \ {\n  console.log(`${key}: ${person[key]}`)\n}\n```\n\n输出：\n```\nname: Jane\n\
    age: 27\ncity: Kigali\n```\n在上面的示例中，我们声明了一个名为 `key` 的变量，并使用 `in` 运算符将其赋值为 `person`\
    \ 对象中每个属性的值。然后我们使用 `key` 变量来访问 `person` 对象中每个属性的值。**JavaScript 中的 `in` 运算符用于检查指定的属性是否存在于对象中。**我们也可以在循环外部使用它：\n\
    \n```javascript\nlet person = {\n  name: 'Jane',\n  age: 27,\n  city: 'Kigali',\n\
    }\n\nif ('name' in person) {\n  console.log('The person object has a name property.')\n\
    }\n\n// 输出: The person object has a name property.\n```\n\n我们也可以用它来检查元素是否存在于数组：\n\
    \n```javascript\nlet fruits = ['apple', 'banana', 'orange']\n\nif ('apple' in\
    \ fruits) {\n  console.log(\n    'The apple element exists in the fruits array.'\n\
    \  )\n}\n\n// 输出: The apple element exists in the fruits array.\n```\n\n由于我们可以在数组上使用\
    \ `in` 运算符，也可以使用 `for...in` 循环来遍历数组的元素：\n\n```javascript\nlet names = ['Jane',\
    \ 'John', 'Ada']\n\nfor (let index in names) {\n  console.log(names[index])\n\
    }\n```\n\n输出：\n```\nJane\nJohn\nAda\n```\n当使用 `for...in` 循环遍历数组时，赋值给 `in` 运算符的变量将是数组每个元素的索引。遍历数组元素的更简单方法是使用\
    \ `for...of` 循环。\n\n### **for...of 循环**\n\n`for...of` 循环与 `for...in` 循环类似，但它遍历数组的值而不是索引。让我们使用\
    \ `for...of` 循环重写 `names` 循环示例：\n\n```javascript\nlet names = ['Jane', 'John',\
    \ 'Ada']\n\nfor (let name of names) {\n  console.log(name)\n}\n```\n\n输出：\n```\n\
    Jane\nJohn\nAda\n```\n在使用 `for...of` 循环访问数组元素时，赋值给 `of` 运算符的变量将是数组每个元素的值。我们还可以使用\
    \ `for...of` 循环来遍历字符串的字符：\n\n```javascript\nlet name = 'Jane'\n\nfor (let character\
    \ of name) {\n  console.log(character)\n}\n```\n\n输出：\n```\nJ\na\nn\ne\n```\n\
    在处理数组时，`for...of` 循环比 `for...in` 循环更易读和理解。然而，我们不能像使用 `for...in` 循环那样用 `for...of`\
    \ 循环直接访问对象的属性。\n\n### **while 循环**\n\n`while` 循环类似于 `for` 循环，但没有没有表达式。它用于我们不知道循环将运行多少次。例如，如果我们有一个骰子游戏，不断掷骰子直到出现\
    \ 6。我们可能在第一次就掷出 6，也可能需要 10 次。由于我们不知道运行多少次，所以不能使用 `for` 循环。使用 `while` 循环，只要值不是\
    \ 6，就可以一直掷骰子。用通白的话说，`while` 循环写法如下：\n\n当骰子的值不为 6 时，一直掷骰子。让我们看看如何编写 `while` 循环。当骰子的值不为\
    \ 6 时，掷骰子。使用 `Math.ceil()` 方法将数字四舍五入到整数。首先创建一个变量 `dieRoll`，然后使用 `while` 循环来更新它的值，直到得到\
