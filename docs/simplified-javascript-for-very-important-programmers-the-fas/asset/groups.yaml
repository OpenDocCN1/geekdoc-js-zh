    document.querySelector(''#dom-definition'').style.fontSize

    // Output: "3em"

    ```


    3. You can see that the browser updates the page whenever we modify

    the DOM. This is because the DOM is a live representation of the

    page and any changes made to the DOM are immediately reflected

    in the browser.


    **The innerHTML property**


    The innerHTML property returns the HTML content of an element

    in string form. For example, running document.body.innerHTML on

    your browser console will return the HTML content of the body

    element:


    141

    ```javascript

    document.body.innerHTML

    // Output: ''<h1>...</h1> <p>...</p>..."

    ```


    4. We can also use the innerHTML property to modify the HTML

    content of an element. Let’s add a p element with the text “The

    DOM is awesome!” to the body element:


    ```javascript

    document.body.innerHTML += ''<p>The DOM is awesome!</p>''

    ```


    5. Notice that we’re appending the new HTML content with the +=

    operator instead of reassigning the value of the innerHTML property.

    If we used the = operator, the new HTML content would replace the

    existing HTML content. Remember that our HTML document has

    a div element with the class of “paragraph” and the text “This div

    element has the same class attribute as the p elements”. Let’s use

    the innerHTML property to replace its content with a button:


    ```javascript

