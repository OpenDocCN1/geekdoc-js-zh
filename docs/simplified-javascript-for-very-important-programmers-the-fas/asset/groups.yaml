- md: "\n## Arrays\n\n51\n\n### Array Methods\n\nArrays have several methods that\
    \ you can use to manipulate and interact with the data stored in them. These methods\
    \ are built-in functions that are available to every JavaScript array. You can\
    \ use them to add, remove, rearrange or search for elements in an array.\n\nSome\
    \ of the most common array methods include:\n\n- push() - adds one or more elements\
    \ to the end of an array\n- pop() - removes the last element from an array\n-\
    \ shift() - removes the first element from an array\n- unshift() - adds one or\
    \ more elements to the beginning of an array\n- indexOf() - returns the index\
    \ of the first occurrence of an element in an array\n- slice() - returns a shallow\
    \ copy of a portion of an array into a new array object\n- splice() - changes\
    \ the contents of an array by removing or replacing existing elements and/or adding\
    \ new elements in place\n- join() - joins all elements of an array into a string\n\
    \nLet’s try some examples.\n\n### push()\n\nThe push() method adds one or more\
    \ elements to the end of an array and returns the new length of the array. Let’s\
    \ add two new fruits to the end of the favoriteFruits array:\n\n```javascript\n\
    favoriteFruits.push('mango', 'pineapple')\n// output: 5\n```\n\nRunning the code\
    \ above will add ‘mango’ and ‘pineapple’ to the end of the favoriteFruits array,\
    \ and return its new length, which is 5. If you log the favoriteFruits array to\
    \ the console, you’ll see the new elements we just added:\n\n```javascript\nconsole.log(favoriteFruits)\n\
    // output: ['strawberry', 'banana', 'orange', 'mango', 'pineapple']\n```\n\n###\
    \ pop()\n\nThe pop() method removes the last element from an array and returns\
    \ that element. Let’s remove the last element from the favoriteFruits array:\n\
    \n```javascript\nfavoriteFruits.pop()\n// output: 'pineapple'\n```\n\nIf you log\
    \ the favoriteFruits array to the console, you’ll see that ‘pineapple’ is no longer\
    \ there:\n\n```javascript\nconsole.log(favoriteFruits)\n// output: ['strawberry',\
    \ 'banana', 'orange', 'mango']\n```\n\n### shift()\n\nThis method removes the\
    \ first element from an array and returns the removed element:\n\n```javascript\n\
    favoriteFruits.shift()\n// output: 'strawberry'\n```\n\n### unshift()\n\nThe unshift()\
    \ method adds one or more elements to the front of an array and returns its new\
    \ length:\n\n```javascript\nfavoriteFruits.unshift('lemon', 'grape')\n// output:\
    \ 5\n```\n\nLogging the favoriteFruits array to the console will show the new\
