    ## 4.5. 局限性


    JStrong 存在一些潜在问题，可能限制其实际应用。首先，JStrong 将真实网站上的 JS 代码作为良性样本，但恶意样本仍来自之前的数据集。尽管这些恶意代码被研究者广泛使用，但随着网络技术的飞速发展，一些旧的恶意代码可能失去作为训练数据的意义。其次，我们未对恶意
    JavaScript 代码进行多标签分类，因此在检测过程中无法确定这些恶意代码的具体类型。最后，在测试真实网站的过程中，仍存在许多误报。


    ## 5. 结论


    本文提出了一种新颖的恶意 JavaScript 检测模型 JStrong，该模型能够在语法和语义层面将源代码抽象为代码图。该图能够充分表示整个原始代码的信息，然后通过图神经网络学习整个图的节点和边特征，最终通过图读出实现代码的图级表示以进行分类。本研究为恶意
    JavaScript 代码的检测提供了新的思路，并在广泛的对比实验中达到了 99.95% 的准确率，优于当前最先进的方法。同时，我们也在真实世界中进行了实验，发现了几个包含恶意
    JavaScript 代码的网站，这些网站的流行度并不低。我们提出的模型在实际应用中仍存在误报等不足。未来的研究方向将是针对野外大规模 JavaScript
    代码的恶意行为检测与分析。


