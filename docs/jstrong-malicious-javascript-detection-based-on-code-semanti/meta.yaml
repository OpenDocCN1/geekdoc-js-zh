    # 4.3. Parameter sensitivity


    To evaluate the sensitivity of some variable parameters to the accuracy of JStrong,
    we configured these parameters differently and conducted experiments. For the
    number of recurrent steps in the gated graph convolution layer, they were configured
    from 1 to 6 by a step of 1. The results are shown in Fig. 5(a), which shows that
    with the increase of steps, a node could receive more higher-order information
    and learn its representation more accurately. However, this situation is reversed
    with continuous increment, and the best effect is achieved when the number of
    steps is 4, and then it begins to decline smoothly. Fig. 5(b) illustrates the
    influence of the number of attention heads in the graph attention layer on the
    accuracy of JStrong. It can be seen that the accuracy is the highest when the
    number of heads is configured as 4 and 6, but the Precision is slightly higher
    than 4 when the number of heads is 6. With regard to graph readout methods, we
    have carried out experiments on four common methods at present, and the results
    are shown in Fig. 6. Obviously, JStrong can take advantage of more information
    in the graph under the mean aggregation method, so as to achieve the best results.


    # 4.4. Case study


    In order to verify the actual effect of JStrong, we deployed it on the real website.
