    incidence matrix. It is not difficult to conclude that


    Y*(W) ≜ argmin<sub>Y</sub> ℓ<sub>Y</sub>(Y) = (I + λL)<sup>−1</sup>f(X; W)  (7)


    where obviously the optimal Y* will be a function of W. This solution represents
