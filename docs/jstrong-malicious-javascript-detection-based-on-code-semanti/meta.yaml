    # JStrong: Malicious JavaScript detection based on code semantic representation
    and graph neural network


    **Yong Fang, Chaoyi Huang, Minchuan Zeng, Zhiying Zhao, Cheng Huang** \*


    *School of Cyber Science and Engineering, Sichuan University, Chengdu, China*


    **ARTICLE INFO**


    *Article history:*

    Received 19 October 2021

    Revised 23 February 2022

    Accepted 1 April 2022

    Available online 6 April 2022


    *Keywords:*

    Malicious JavaScript

    Code representation

    Graph neural network

    Program dependency graph

    Scripts detection


    ## ABSTRACT


    Web development technology has experienced significant progress. The creation
    of JavaScript has highly enriched the interactive ability of the client. However,
    the attacker uses the dynamic characteristics of the JavaScript language to embed
    malicious code into web pages to achieve the purpose of smuggling, redirection,
    and so on. Traditional methods based on static feature detection are therefore
    difficult to detect malicious code after confusion, and the method based on dynamic
    analysis is inefficient. To meet these challenges, this paper proposes a static
    detection model JStrong based on graph neural network. The model first generates
    an abstract syntax tree from the JavaScript source code, and then adds data flow
    and control flow information into the program dependency graph. In addition, we
    embed the nodes and edges of the graph into the feature vector and fully learn
    the features of the whole graph through the graph neural network. We take advantage
    of a real-world dataset collected from the top website and GitHub to evaluate
    JStrong and compare it to the state-of-the-art method. Experimental results show
    that JStrong achieves near-perfect classification performance and is superior
    to the state-of-the-art method.


    © 2022 Elsevier Ltd. All rights reserved.


    ## 1. Introduction


    With the improvement and enrichment of network technology, more and more websites
    begin to provide services in the form of web applications, which lead to multiple
    growths of web-based applications (Eshkevari *et al.*, 2017). As a language with
    complete functions, JavaScript is widely used in the front-end development of
    Web applications (Song *et al.*, 2018). The JavaScript language is cross-platform,
    can be embedded remotely, and can be dynamically executed (Zhou and Evans, 2015).
    Although it brings many conveniences and wonderful interactive experiences to
    users, it also brings many threats and risks to web user terminals (Brown *et
    al.*, 2017; Hedin and Sabelfeld, 2015). Therefore, JavaScript malicious code has
    become the main way of a network attack. Attackers can implement malicious behaviors
    by injecting malicious JavaScript code into web pages, such as spreading the Trojan
    virus, obtaining sensitive information from users, and mining data.


    The detection of JavaScript malicious code is usually realized by the detection
    of JavaScript scripts in Web applications. To avoid detection and defense, increasing
    confusing forms appear in JavaScript malicious code, which makes the code more
    concealed and less detectable. Meanwhile, existing detection methods mainly rely
    on feature matching or code text word embedding. The analysis method based on
    feature matching can only detect known malicious samples. Despite the fact that
    the detection speed of this method is fast, there are still false positives. Feature
    learning based on word embedding of code text cannot represent the actual context
    information of code. If only the syntax unit information of the code is extracted,
    the semantic code information will be lost, which means that the problem of comprehensiveness
    and ambiguity in the code has not been resolved, so the detection effect is not
    good. To date, few studies have investigated the association between malicious
    JavaScript detection and code semantics. In 2019, Fass *et al.* (2019) proposed
    an abstract code representation method for JavaScript, which expanded the existing
    AST-based code representation capability by using data flow and control flow information.
    They extracted N-Gram features and node value features from the code representation
    and used the random forest model for training. This method effectively enhances
    the comprehensive representation of code, but it only trains the text features
    extracted from graph data, and cannot learn the complete information from graph
    structure. The existing research (Zhou *et al.*, 2020, 2019) shows that graph
    neural network has a good learning effect on graph data and abstract code representation.
    Catal *et al.* (2021) proposed a Graph Attention Network (GAN)-based framework
    to detect malware attacks addressing ITS, the results show that graph neural network
    is powerful in the malware detection field.


    * Corresponding author.

    *E-mail address:* opcodesec@gmail.com (C. Huang).


    https://doi.org/10.1016/j.cose.2022.102715

    0167-4048/© 2022 Elsevier Ltd. All rights reserved.


    Aiming at the poor detection effect caused by the inability to fully capture the
    code information in the existing methods, we propose a malicious JavaScript code
    detection model JStrong based on graph neural network to comprehensively learn
    the syntax and semantic features of the code and improve the detection accuracy.
    The main contributions of this paper are as follows:


    -   We propose a new method to detect malicious JavaScript that embeds both grammar
    and semantic features information of code into a comprehensive code representation
    graph, and then learn the features of the whole graph by the improved graph neural
    network to achieve the purpose of classification. To enable the removal of redundant
    content in JavaScript code, we propose a new graph pruning algorithm to extract
    and retain complicated high-level semantic features including data- and control-flows
    of a program.

    -   We study the performance of various code graph representation methods in JavaScript
    and the influence of these representation methods on graph neural network classifier.
    Then we comprehensively discuss the causes of these situations.

    -   We present a novel model named JStrong to detect malicious JavaScript instances.
    Evaluation results show that JStrong outperforms the state-of-the-art method for
    detecting JS malware. JStrong achieves a better prediction of 99.95% accuracy
    under extensive comparison experiments. JStrong also detected malicious JavaScript
    code in several real websites with not low popularity.


    ## 2. Related work


    There are numerous researches on malicious JavaScript code detection in recent
    years. This paper divides it into two categories: static analysis based on code
    statements and structures; dynamic analysis based on the process of program execution.


    ### 2.1. Static analysis


    The traditional method of static analysis is to extract the features of malicious
    code to generate a feature library and then extract the features of the code to
    be detected to see whether it matches the feature library. Gradually, the success
    of deep learning began to inspire researchers to implement it to the automatic
    implementation of static code analysis. The method is usually to extract the semantic
    or grammatical structure in the source code, transform it into vectors, and then
    use machine learning to build the detection model.


    Curtsinger et al. (2011) proposed a low overhead and fast deplorable method, which
    mainly uses the hierarchical features of the JavaScript abstract syntax tree to
    identify syntax elements that are highly predictive of malware. It is not comprehensive
    to represent code only built on the abstract syntax tree yet, so Andreasen and
    Møller (2014) implemented a static data flow analysis method for JavaScript, it
    can dynamically infer and utilize deterministic information. Seshagiri et al.
    (2016) propose a static analysis framework, AMITA Malware Analyzer, which can
    detect the existence of malicious code through static code analysis of web pages
    and can against obfuscated malicious JavaScript code. By comparing the performance
    of nine different classifiers in properly classifying obfuscated and non-obfuscated
    scripts, Tellenbach et al. (2016) found that the boosted decision tree classifier
    worked best. Ndichu et al. (2018) adopted Doc2Vec, a machine-learning approach
    to extract features from JavaScript code, which is a neural network model that
    can learn context information of texts. Fass et al. (2018) propose a low overhead
    method called JAST, that combines the extraction of features from the abstract
    syntax tree with a random forest classifier to detect malicious JavaScript code.


    They also implemented a modular static JavaScript detection system (Fass et al.,
    2019) of leveraging control and data flow information to extend detection capability.
    Fang et al. (2020) proposed a static detection model based on semantic analysis,
    which utilizes FastText algorithm train word vectors from JavaScript source codes.
    Then input word vectors into the Bi-LSTM network with an attention mechanism.
    Huang et al. (2021) got the real contextual representation of code by dynamic
    word embeddings. Then they used TextCNN to extract key features to classify. Although
    prior works on C/C++ and PHP have proposed graph query-based approaches to effectively
    detect vulnerabilities, they are not directly applicable to JavaScript due to
    the language''s extensive use of dynamic features. Li et al. (2022) proposed flow-
    and context-sensitive static analysis with hybrid branch-sensitivity and points-to
    information to generate a novel graph structure, called Object Dependence Graph
    (ODG). They implemented an open-source prototype system to generate ODG for Node.js
    programs and detect vulnerabilities.


    ### 2.2. Dynamic analysis


    Dynamic analysis methods usually extract behavioral characteristics during code
    execution. The main method used is tantamount to executing JavaScript files in
    test environments such as honey pots and sandboxes, then obtaining and analyzing
    the characteristics generated when the code is running for further analysis and
    classification.


    Kim et al. (2012) proposed a framework called JsSandbox that utilizes internal
    function hooks (IFH) to track and analyze the behavior of malicious JavaScript
    code. Kapravelos et al. (2013) presented a method called Revolver, which detects
    malicious JavaScript scripts by identifying similarities between programs, and
    detects evasion by interpreting differences between them. Gorji and Abadi (2014)
    tried to load malicious web pages in real browsers and collect a series of predictive
    function calls. Similar sequences are subsequently grouped into the same cluster
    and behavioral characteristics are generated for each cluster. By matching these
    features, malicious web pages can be detected. Wang et al. (2015) proposed a hybrid
    method for JavaScript malware detection and classification, which used text information,
    program structure and prediction features of dangerous function calls to detect
    malicious JavaScript and classify it according to attack feature vector or dynamic
    execution trajectory. Kim et al. (2017) proposed J-force, a non-crash enforcement
    JavaScript engine, to systematically explore possible execution paths and reveal
    the behavior of malware based on camouflage and obfuscation technology.


    To sum up, the aforementioned static detection methods are all implemented through
    the work of syntax unit or code embedding, they can not comprehensively capture
    the syntax and semantic information of each level in the code. Meanwhile, the
    implementation of the dynamic analysis method is already too complex, the computational
    overhead is also relatively large. In view of the shortcomings of the existing
    detection methods, this paper proposes JStrong, a static detection method that
    focuses on the use of graphic structure to represent code. JStrong can retain
    the syntax, semantics, and logical structure information of the program to a large
    extent, so as to more accurately detect the malicious code.


    ## 3. Methodology


    Representation based on code property graph is proven to be one of the most effective
    approaches to detect code vulnerabilities (Yamaguchi et al., 2014). In the meantime,
    graph neural network has achieved notable success in dealing with graph-based
    data problems. Inspired by this, we designed JStrong, a malicious'
