    JavaScript code detection model which can automatically extract code attribute
    graphs and use graph neural network for feature learning and classification. The
    JStrong architecture is shown in Fig. 1, which consists of four components: 1)
    *Code to graph*, which generates program dependency graph with comprehensive program
    semantics and gets simplified code fragment graph through graph pruning; 2) *Graph
    embedding*, which extracts the node and edge information from the code property
    graph and maps it to the vector space to generate independent features. 3) *Graph-level
    representation* is to use graph convolution to transfer information and update
    features on a graph, and then use the graph readout to aggregate and summarize
    as abundant as possible information of the whole graph. 4) *Classification*, which
    accepts the graph representation of the previous stage and classifies it according
    to different tasks.


    # 3.1. Graph generating based on composite code semantics


    The advantage of static detection technology is that it can analyze program code
    quickly and comprehensively. In the process of program analysis, there are many
    ways to represent text code, such as abstract syntax tree, control flow graph,
    program dependency graph, etc. We can use these abstract representations to capture
    the syntactic and semantic relationships between different tags of source code,
    to identify malicious code with similar or duplicate structures. Pure lexical
    analysis can only process text code one word after another, while abstract syntax
    tree will consider the grammatical relationship between codes; Furthermore, CFG
    will add some control information under specific paths based on AST, so as to
    consider the code logic under different conditions; Finally, PDG will add data
    flow information and statement execution order information to CFG, which is a
    more comprehensive abstract code representation. In the next part, we will briefly
    introduce the code representation and graph generation of each type.


    # 3.1.1. Abstract syntax tree (AST)


    The abstract syntax tree is a tree representation of the ordered syntax structure
    of the source code. It represents the syntax structure of programming language
    in the form of a tree, and each node in the tree represents a structure in the
    source code. It is likewise a key part of semantic analysis, and other code representations
    are based on AST. In this article, we use Esprima to generate the abstract syntax
    tree of JavaScript code. Esprima is an efficient and fast JavaScript parser, which
    can directly generate the corresponding syntax tree for javascript source code
    (Hidayat, 2021). Among them, there are as many as 69 types of nodes in the syntax
    tree, including internal nodes such as expression statement and variable declaration,
    and leaf nodes such as identifier and literal.


    vided by AST only has a simple syntax structure, and does not show the semantic
    association of the code.


    # 3.1.2. Control flow graph (CFG)


    Different from AST, CFG can infer and traverse the possible paths in the process
    of program execution. Each basic block contains a sequence of program instructions
    and has one entry point (the first instruction executed) and one exit point (the
    last instruction executed). Specifically, CFG will select and display different
    paths after conditional statements, and represent various control flow dependencies
    by generating directed edges with control meaning. We make a depth-first traversal
    of AST, label the two conditional statements of *SwitchCase* and *ConditionalExpression*,
    and connect the nodes related to these two statements. Then refer to the practice
    of Fass et al. (2019), we use Boolean tags to mark the edges generated from predicate
    sentences, and use ''e'' tags to mark the edges generated from non-predicate sentences.
    In this way, we can represent different paths when the conditional sentences are
    true or false, so as to associate the semantic information of the code.


    # 3.1.3. Program dependency graph (PDG)


    Since CFG only represents the control flow dependency, we implement PDG (Ferrante
    et al., 1987) to represent the data flow dependency of code through directed edges.
    When a variable, function, or object is defined or modified at the source node
    and used or modified at the destination node, we connect the two statement nodes
    using the data dependency edge. In this process, we also need to consider the
    source node''s reaching definition. As shown in Fig. 2b, the dotted blue arrow
    represents the data flow dependency, which mainly shows the data access or modification
    of variables. Because it is modified on the basis of CFG, PDG contains two kinds
    of dependencies: data flow and control flow. Even if the sequence of unrelated
    statements in the source code is adjusted, the generated graph will be without
    prejudice.


    In order to explore whether PDG has advantages in JavaScript malicious code detection,
    we analyzed PDGs generated from 30,000 sample data. After extracting the node
    (syntax unit) information of all samples, we counted the frequency of each node
    type in benign and malicious samples. As shown in Table 1, we listed the top 10
    node types. It can be seen that the frequency of each node type between benign
    samples and malicious samples is quite different. Literal ranks first among malicious
    samples, but second among benign samples, because there are a large number of
    repeated expressions in malicious samples, which contain various types of literals.
    However, as both benign samples and malicious samples contain confused codes,
    there is not a big difference between them. In addition, because the benign code
    is relatively standard, the object type is typically used in the process of coding,
    so the occurrence frequency of property nodes in object expressions is higher
    in benign samples, and rarely in malicious


