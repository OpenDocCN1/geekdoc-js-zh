    Contents lists available at **ScienceDirect**


    # Computers & Security


    journal homepage: [www.elsevier.com/locate/cose](http://www.elsevier.com/locate/cose)


    ![](img/5da23fadfa08902fc5a0515cda7f0fd2_0_1.png)


    # TC 11 Briefing Papers


    # # JStrong: Malicious JavaScript detection based on code semantic representation
    and graph neural network


    **Yong Fang, Chaoyi Huang, Minchuan Zeng, Zhiying Zhao, Cheng Huang** \*


    *School of Cyber Science and Engineering, Sichuan University, Chengdu, China*


    +   **A R T I C L E &nbsp;&nbsp; I N F O**


    *Article history:*

    Received 19 October 2021

    Revised 23 February 2022

    Accepted 1 April 2022

    Available online 6 April 2022


    *Keywords:*

    Malicious JavaScript

    Code representation

    Graph neural network

    Program dependency graph

    Scripts detection


    ## A B S T R A C T


    Web development technology has experienced significant progress. The creation
    of JavaScript has highly enriched the interactive ability of the client. However,
    the attacker uses the dynamic characteristics of the JavaScript language to embed
    malicious code into web pages to achieve the purpose of smuggling, redirection,
    and so on. Traditional methods based on static feature detection are therefore
    difficult to detect malicious code after confusion, and the method based on dynamic
    analysis is inefficient. To meet these challenges, this paper proposes a static
    detection model JStrong based on graph neural network. The model first generates
    an abstract syntax tree from the JavaScript source code, and then adds data flow
    and control flow information into the program dependency graph. In addition, we
    embed the nodes and edges of the graph into the feature vector and fully learn
    the features of the whole graph through the graph neural network. We take advantage
    of a real-world dataset collected from the top website and GitHub to evaluate
    JStrong and compare it to the state-of-the-art method. Experimental results show
    that JStrong achieves near-perfect classification performance and is superior
    to the state-of-the-art method.


    © 2022 Elsevier Ltd. All rights reserved.


    # ## 1. Introduction


    With the improvement and enrichment of network technology, more and more websites
    begin to provide services in the form of web applications, which lead to multiple
    growths of web-based applications (Eshkevari *et al.*, 2017). As a language with
    complete functions, JavaScript is widely used in the front-end development of
    Web applications (Song *et al.*, 2018). The JavaScript language is cross-platform,
    can be embedded remotely, and can be dynamically executed (Zhou and Evans, 2015).
    Although it brings many conveniences and wonderful interactive experiences to
    users, it also brings many threats and risks to web user terminals (Brown *et
    al.*, 2017; Hedin and Sabelfeld, 2015). Therefore, JavaScript malicious code has
    become the main way of a network attack. Attackers can implement malicious behaviors
    by injecting malicious JavaScript code into web pages, such as spreading the Trojan
    virus, obtaining sensitive information from users, and mining data.


    The detection of JavaScript malicious code is usually realized by the detection
    of JavaScript scripts in Web applications. To avoid detection and defense, increasing
    confusing forms appear in JavaScript malicious code, which makes the code more
    concealed and less detectable. Meanwhile, existing detection methods mainly rely
    on feature matching or code text word embedding. The analysis method based on
    feature matching can only detect known malicious samples. Despite the fact that
    the detection speed of this method is fast, there are still false positives. Feature
    learning based on word embedding of code text cannot represent the actual context
    information of code. If only the syntax unit information of the code is extracted,
    the semantic code information will be lost, which means that the problem of comprehensiveness
    and ambiguity in the code has not been resolved, so the detection effect is not
    good. To date, few studies have investigated the association between malicious
    JavaScript detection and code semantics. In 2019, Fass *et al.* (2019) proposed
    an abstract code representation method for JavaScript, which expanded the existing
    AST-based code representation capability by using data flow and control flow information.
    They extracted N-Gram features and node value features from the code representation
    and used the random forest model for training. This method effectively enhances
    the comprehensive representation of code, but it only trains the text features
    extracted from graph data, and cannot learn the complete information from graph
    structure. The existing research (Zhou *et al.*, 2020, 2019) shows that graph
    neural network has a good learning effect on graph data and abstract code representation.
    Catal *et al.* (2021) proposed a Graph Attention Network (GAN)-based framework
    to detect malware attacks addressing ITS, the results show that graph neural network
    is powerful in the malware detection field.


    * Corresponding author.

    *E-mail address:* opcodesec@gmail.com (C. Huang).


    https://doi.org/10.1016/j.cose.2022.102715

    0167-4048/© 2022 Elsevier Ltd. All rights reserved.'
