    there are still many false positives.


    ## 5. Conclusion


    In this paper, we have presented a novel malicious JavaScript detection model
    JStrong, which can abstract the source code into a code graph at the level of
    syntax and semantics. The graph can fully represent the information of the whole
    original code, and then learn the node and edge features of the whole graph through
    the graph neural network, and finally realize the graph-level representation of
    the code for classification through graph readout. This study provides a new insight
    into the detection of malicious JavaScript code, and achieves the accuracy of
    99.95% under extensive comparison experiments, outperforms the state-of-the-art
    method. At the same time, we also conducted experiments in the real world, and
    found several websites containing malicious JavaScript code, which were not low
    in popularity. There are still shortcomings like false positives in the practical
    application of the model we presented. At the same time, the research direction
    in the future will be large-scale malicious behavior detection and analysis for
    JavaScript code in the wild.


