    features of all neighboring nodes based on attention.


    3.2.3. Readout and classification


    In order to complete the prediction of each graph, all nodes in the graph need
    to aggregate and summarize as much information as possible on a single graph after
    sufficient message passing and feature updating. This type of operation is called
    “readout”. Common aggregation methods include: summing all the features of nodes
    or edges, taking the average value, and finding the maximum or minimum value by
    element. In the mean aggregation method, the aggregate readout formula for the
    average value of all node features of each graph is as follows:


    h<sub>G</sub> = (1/|V|) Σ<sub>v∈V</sub> h<sub>v</sub>  (8)


    Where, h<sub>G</sub> is the representation of graph **G**, V is the set of nodes
