  mdcn: "\nY. 方，C. 黄，M. 曾 等人。\n\n《计算机与安全》118 (2022) 102715\n\n![](img/5da23fadfa08902fc5a0515cda7f0fd2_2_0.png)\n\
    \nJavaScript代码检测模型，能够自动提取代码属性图，并利用图神经网络进行特征学习和分类。JStrong架构如图1所示，包含四个组成部分：1）*代码到图*，生成具有全面程序语义的程序依赖图，并通过图剪枝获得简化的代码片段图；2）*图嵌入*，从代码属性图中提取节点和边信息，并将其映射到向量空间以生成独立特征。3）*图级表示*是利用图卷积在图上传递信息并更新特征，然后利用图读出操作来聚合和总结整个图尽可能丰富的信息。4）*分类*，接收上一阶段的图表示，并根据不同的任务对其进行分类。\n\
    \n## 3.1. 基于复合代码语义的图生成\n\n静态检测技术的优势在于能够快速、全面地分析程序代码。在程序分析过程中，有多种方式表示文本代码，例如抽象语法树、控制流图、程序依赖图等。我们可以利用这些抽象表示来捕获源代码不同标签之间的语法和语义关系，从而识别具有相似或重复结构的恶意代码。纯粹的词法分析只能逐词处理文本代码，而抽象语法树会考虑代码之间的语法关系；此外，控制流图（CFG）会在抽象语法树（AST）的基础上，针对特定路径添加一些控制信息，从而考虑不同条件下的代码逻辑；最后，程序依赖图（PDG）会在控制流图（CFG）的基础上添加数据流信息和语句执行顺序信息，这是一种更全面的抽象代码表示。在下一部分，我们将简要介绍每种类型的代码表示和图生成。\n\
    \n### 3.1.1. 抽象语法树 (AST)\n\n抽象语法树是源代码有序语法结构的树形表示。它以树的形式表示编程语言的语法结构，树中的每个节点代表源代码中的一个结构。它同样是语义分析的关键部分，其他代码表示都基于AST。在本文中，我们使用Esprima生成JavaScript代码的抽象语法树。Esprima是一个高效、快速的JavaScript解析器，可以直接为JavaScript源代码生成相应的语法树（Hidayat,\
    \ 2021）。其中，语法树中有多达69种节点类型，包括表达式语句和变量声明等内部节点，以及标识符和字面量等叶节点。\n\nAST提供的信息仅包含简单的语法结构，不能展示代码的语义关联。\n\
    \n### 3.1.2. 控制流图 (CFG)\n\n与AST不同，CFG可以推断和遍历程序执行过程中可能的路径。每个基本块包含一系列程序指令，并有一个入口点（执行的第一条指令）和一个出口点（执行的最后一条指令）。具体来说，CFG会选择和显示条件语句后的不同路径，并通过生成具有控制含义的有向边来表示各种控制流依赖关系。我们对AST进行深度优先遍历，标记*SwitchCase*和*ConditionalExpression*这两个条件语句，并连接与这些语句相关的节点。然后参考Fass等人的实践（2019），我们用布尔标签标记从谓词语句生成的边，用'e'标签标记从非谓词语句生成的边。这样，我们可以在条件语句为真或假时表示不同的路径，从而关联代码的语义信息。\n\
    \n### 3.1.3. 程序依赖图 (PDG)\n\n由于CFG仅表示控制流依赖关系，我们实现了PDG（Ferrante et al., 1987），通过有向边来表示代码的数据流依赖关系。当一个变量、函数或对象在源节点被定义或修改，并在目标节点被使用或修改时，我们使用数据依赖边连接这两个语句节点。在这个过程中，我们还需要考虑源节点的到达定义。如图2b所示，蓝色虚线箭头表示数据流依赖关系，主要显示变量的数据访问或修改。因为它是在CFG的基础上修改的，所以PDG包含两种依赖关系：数据流和控制流。即使调整源代码中无关语句的顺序，生成的图也不会受到不利影响。\n\
    \n为了探究PDG在JavaScript恶意代码检测中是否具有优势，我们分析了从30,000个样本数据生成的PDG。在提取所有样本的节点（语法单元）信息后，我们统计了良性样本和恶意样本中每种节点类型的频率。如表1所示，我们列出了频率最高的10种节点类型。可以看出，良性样本和恶意样本中每种节点类型的频率差异很大。字面量（Literal）在恶意样本中排名第一，但在良性样本中排名第二，这是因为恶意样本中存在大量重复表达式，包含各种类型的字面量。然而，由于良性样本和恶意样本都包含混淆代码，它们之间的差异并不大。此外，因为良性代码相对标准，对象类型在编码过程中被典型使用，所以属性节点在对象表达式中的出现频率在良性样本中较高，而在恶意样本中则很少出现。这些节点类型的频率差异对于检测JavaScript恶意代码非常重要。\n\
    \n与AST相比，PDG在结合语法和语义信息方面具有更大的优势。如果我们仅依赖AST进行语法分析来检测恶意代码，攻击者可以通过插入恶意代码同时保持语法结构不变来绕过这种检测。如清单1和清单2所示，尽管这两段代码非常相似，但由于函数调用的不同，其中一段具有恶意行为。如果此时仅分析语法结构信息，如图2a所示，两段代码简化的AST是相同的，这很容易被攻击者利用。然而，如果结合语法和语义信息，如图2b和图2c所示，两段代码的PDG显然不同，函数调用和数据流清晰地揭示了良性样本和恶意样本之间的差异。\n\
