    # 3.2. Model architecture


    For each individual JavaScript code, we use the above method to generate a code
    graph to represent its composite semantics and build an automatic graph processing
    model for feature learning and classification. The specific structure of the model
    will be introduced in the following.


    # 3.2.1. Node and edge embedding.


    After getting PDG, we express each graph as G = (V, E), where V is the node set
    and E is the edge set. Now we need to embed the information of nodes and edges
    in the graph into the low dimensional space so that it can be transformed into
    the feature vector that the model can handle. As shown in Fig. 2b, the nodes in
    the code graph only have the type of syntax unit, so we use the pre-training word2vec
    model to encode it. Word2vec is one of the tools for training word vectors (Mikolov
    et al., 2013). It transforms text content processing into vectors in k-dimensional
    vector space and uses the similarity in vector space to express the semantic similarity
    of text. Because similar syntax units of JavaScript have similar prefixes or suffixes,
    for example, all suffixes in syntax units of declaration class are "Declaration"
    or "statement", so word2vec can be used to embed the graph nodes well. We initialize
    the embedding of nodes with the feature vector generated by word2vec, which is
    expressed as h, where D is the embedding dimension. Different from the diversity
    of node syntax unit types, there are only five edge types in the graph: "s", "e",
    "data", "false", and "true", so we only code them simply. After getting the feature
    information of all the nodes and edges in the entire graph, the graph neural network
    can be used to realize the message passing and feature updating in the graph.


    # 3.2.2. Graph learning layer


    The core idea of graph neural network is to use neural network to iteratively
    aggregate the feature information from local graph neighborhoods. In recent years,
    according to different aggregation techniques, there are graph convolution network
    (Kipf and Welling, 2017), GraphSAGE (Hamilton et al., 2017a), graph attention
    network (Velickovic et al., 2018), gated graph neural network (Li et al., 2016)
    and other methods. After comparing these methods, considering the characteristics
    of the data in this paper, we designed an improved graph feature learning model
    which combines gated graph neural network and graph attention network, as shown
    in the Fig. 4.


    Based on GCN, GGNN adds GRU (Gated Recurrent Unit) (Cho et al., 2014), which regards
    the information of neighbor nodes as input and the state of nodes as a hidden
    state. The addition of GRU means not only selectively memorizing the hidden information
    of neighbor nodes, but also selectively memorizing the hidden information in the
    iterative process of nodes. At the same time, it also introduces a learnable parameter
    W for different types of edges, so that we can deal with graphs with different
    types of nodes or edges, which is exactly consistent with our generated code graphs
    with both semantics and graph structures (Hamilton et al., 2017b). Given a graph
    G, we use the gated


