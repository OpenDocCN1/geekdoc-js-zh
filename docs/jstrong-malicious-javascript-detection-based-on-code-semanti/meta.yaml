    \ all the nodes and edges in the entire graph, the graph neural network can be\
    \ used to realize the message passing and feature updating in the graph.\n\n###\
    \ 3.2.2. Graph learning layer\n\nThe core idea of graph neural network is to use\
    \ neural network to iteratively aggregate the feature information from local graph\
    \ neighborhoods. In recent years, according to different aggregation techniques,\
    \ there are graph convolution network (Kipf and Welling, 2017), GraphSAGE (Hamilton\
