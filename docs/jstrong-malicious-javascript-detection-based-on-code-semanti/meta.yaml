    how much information in the past is forgotten to be used to candidate the implied
    state.


    In the sample of real malicious JavaScript script code, there are actually many
    benign code fragments, and the code with malicious intent may only be a small
    part. We think that when judging whether a sample is malicious or not, the contribution
    of different parts of code to the whole sample is different, so we introduce graph
    attention network. At the same time, because the syntax nodes generated by these
    malicious codes may be far away, it is necessary to capture the long-term dependency
    of their syntax sequences and balance local and global information. Therefore,
    we propose an improved GNN method. By anchoring to a principled energy function,
    we can include any number of propagation layers to capture non-local dependencies
    and reduce the risk of over-smoothing.


    Given a graph G = {V, E}, we define the energy function


    ℓ<sub>Y</sub>(Y) ≜ λtr[Y<sup>T</sup>LY] + ‖Y − f(X; W)‖<sub>F</sub><sup>2</sup>  (6)


    where λ is a trade-off parameter and Y ∈ ℝ<sup>|v|×d</sup> represents a candidate
