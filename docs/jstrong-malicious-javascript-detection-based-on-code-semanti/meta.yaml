    All the data used in this paper come from manual crawling and collection. Among
    them, the benign samples were obtained from Tranco top 4000 websites (Le Pochat
    et al., 2019), and we requested to visit the homepage of the website. After the
    page was loaded, we collected and crawled the JavaScript codes embedded in it,
    and got 15,000 independent JavaScript files after cleaning and processing. Have
    regard to the popularity and authority of these websites, we assume that the JavaScript
    used on their homepages is benign. Malicious samples come from the data published
    by Petrak (2021), GeeksOnSecurity (2021) and VirusTotal (2021). Fass et al. (2019),
    Huang et al. (2021) and others have proved their validity and authenticity in
    their research, so we cleaned and selected 15,000 files as malicious data sets.
    In addition, for the original code data set, we also generated its corresponding
    program dependency graph for each file, and the average number of nodes in each
    graph is 815, which is the final input of the model. For the detailed information
    in the data set, as shown in Table 3, we divide the whole data set into three
    parts: 70% of the data is used as the training set of the model, 10% as the verification
    set, and 20% as the test set.


    Table 3: The statistics of the dataset.


    | Data type | Graphs | Nodes | Edges |

    | :--- | :--- | :--- | :--- |

    | Benign | 15,000 | 13,415,893 | 28,125,910 |

    | Malicious | 15,000 | 11,034,580 | 23,580,162 |


    ## 4.2. Parameter Configuration


    In the embedding layer, we train a Word2Vec model to generate node feature vectors
    through syntax units. Word2Vec model parameters include size=100, window=5, and
    min count=1. In the graph learning layer, we use DGL (Wang et al., 2019) to process
    the graph and construct the classification model. In the first layer, we use the
    gated graph convolution layer to learn the features of nodes and edges. Then two
    layers of graph attention layer are added to learn the characteristics of neighbor
    nodes. The number of recurrent steps (n_steps) in the gated graph convolution
    layer and the number of multi-head (num_heads) in the graph attention layer will
    be referred to in the parameter sensitivity subsection. Empirically, we utilize
    the Adam optimizer with a learning rate of 0.001 and batch size 64, and L2 regularization
    to avoid overfitting. We randomly shuffle each dataset and split 70% for the training
    and 10% for validation. We train our model on NVIDIA RTX 2080TI with 200-epoch
    patience for early stopping.


    ## 4.3. Comparison Experiment


    To explore whether the method applied in this paper is optimal, we have implemented
    relevant comparative experiments.


    At first, Abstract Syntax Tree (AST), Control Flow Graph (CFG), Object Dependence
    Graph (ODG), and original Program Dependency Graph (PDG) were used to compare
    with the PDG pruning method we proposed. ODG represents JavaScript objects as
    nodes and their relations with Abstract Syntax Tree (AST) as edges. It should
    be noted that ODG is used to detect JavaScript vulnerabilities rather than malicious
    code. We extracted the graph generation method from their open-source prototype
    system and reproduced it.


    In addition, for the comparison of methods used in our model, we have constructed
    three variants of the basic model, namely JStrong-C, JStrong-G, and JStrong-A.
    The main difference between these variants is that the methods of the graph convolution
    module are different in the process of classification. In the implementation function
    of the graph classification layer of JStrong-C, the main method used is graph
    convolution network, which can effectively extract the features of nodes in the
    graph and learn, while JStrong-G uses the gated graph neural network in the graph
    classification layer, which can deal with graphs with different types of nodes
    or edges, and JStrong-A uses graph attention network, This method identifies the
    importance of neighbor nodes by assigning attention scores.


    Lastly, we also compare the classification performance of the method in this paper
    with existing available methods (Fass et al., 2019, 2018) and the anti-virus engines
    of some security manufacturers. Among them, JaSt mainly uses the method of combining
    feature extraction in abstract syntax tree with random forest classifier to detect
    malicious JavaScript code, while JStap expands the detection ability by using
    control and data flow information. We can fully implement them due to these two
    papers open-source their work. In addition, we also conducted experiments using
    many security detection engines integrated on virus total and selected the best
    three (Rising, Symantec, and FireEye) to compare with our work.


    ## 4.4. Performance Evaluation


    The evaluation metrics we mainly use are accuracy, precision, recall, and F1 score,
    which are defined as follows:


    $$ ACC = \frac{TP + TN}{TP + TN + FP + FN} $$ (11)


    $$ \mathbf{P} = \frac{TP}{TP + FP} $$ (12)


    $$ \mathbf{R} = \frac{TP}{TP + FN} $$ (13)


    $$ \mathbf{F1} = \frac{2 \times P \times R}{P + R} $$ (14)


    Where True Positive (TP) is the number of malicious samples correctly identified,
    True Negative (TN) is the number of benign samples correctly identified, False
    Negative (FN) is the number of malicious samples mistakenly classified as a benign
    sample and False Positive (FP) is the number of benign samples mistakenly classified
    as a malicious sample. Table 4 summarizes all the experiment results.


    First, we analyze the performance of all graph representation methods in the model.
    As shown in the Table 5, AST only contains the syntax information of the program
    code, so the comprehensive representation and learning effect of the code is not
    as good as CFG and PDG. Compared with CFG, PDG has extra data flow information,
    which is more complete in the semantic representation of the program and better
    in detection effect. ODG proposed by Li et al. adds JavaScript object nodes on
    the basis of data flow and control flow, which enriches the call relationship
    in the graph and has a better detection effect than PDG. Surprisingly, after using
    the pruning algorithm for PDG, the detection effect has also been significantly
    improved, slightly better than ODG, which may be due to the removal of more redundant
    information in the graph.


    Of course, for malicious code detection, speed and efficiency are particularly
    important. Table 5 shows the extraction time of nodes/edges in different graph
    representations and the generation time of the whole graph. It can be seen that
    the time cost of ODG in two processing steps is much higher than that of PDG and
    other basic graph representation methods because ODG additionally extracts and
    constructs relationships for objects in JavaScript code. At the same time, to
    query vulnerabilities, ODG uses separate processing methods when extracting nodes
    and edges, which all increase the time cost. At the same time, we can see that
    PDG after pruning not only has the best detection effect but also costs less time,
    which may be due to the faster processing speed of smaller graphs.


    Next, we analyzed the performance of the variant of the JStrong model. It can
    be seen from the Table 4 that compared with JStrong-C, JStrong-G, and JStrong-A,
    JStrong has achieved the best performance in all evaluation metrics, which means
    that compared with using a single graph convolution method, JStrong can fully
    mine the features in JavaScript code graph data to achieve better results. At
    the same time, among the three variants, JStrong-A performs best, JStrong-G performs
    second, and JStrong-C performs worst, which shows that it is critical to discover
    the importance of nodes in graph data through attention mechanism, and it is also
    important to make full use of edge features in graph data.


    Then, we compared the performance of the proposed model with two other similar
    works. For JaSt and JStap, JStrong performed best for all metrics and significantly
    improved. This shows that compared with JaSt only using the features of the abstract
    syntax tree and JStap only using the features of control flow and data flow, the
    method of extracting and utilizing more comprehensive syntax and semantic features
    by JStrong is better, and it also means that using graph neural network to realize
    feature learning and classification is very effective. Compared with JaSt, JStap
    extends the feature content to improve the detection ability, therefore its performance
    is better than JaSt''s. It is worth mentioning that the performance of the three
    variant models of JStrong is basically better than JaSt and JStap, which shows
    that the method proposed in this paper is extraordinarily effective.


    Finally, we compare the performance between the JStrong model and the antivirus
    engines of mature security vendors. As antivirus engines mainly use code feature
    library to detect malicious code, it can be seen from the Table 4 that the false
    alarm rate of these engines is mostly 0, but the performance of Accuracy, Precision,
    and F1 are not as good as that of JStrong. The model proposed in this paper uses
    graph neural network to learn the semantic features of codes, in which there may
    be a few cases where the feature vectors of normal codes are similar to those
