    \ 3. It can be seen that the main function of this JavaScript code is to steal\
    \ the personal data entered by the user on the payment page and then forward the\
    \ data to the server controlled by the attacker. In order to avoid probing, attackers\
    \ specially applied for these names similar to popular vendors such as Google\
    \ as server domain names. Some websites in the Table 6 seem to have discovered\
    \ and dealt with malicious JavaScript after we detected them, so it is normal\
    \ and benign to visit these now, and the previous content can be obtained through\
    \ some snapshot websites (urlscan.io, 2021). From the data in Table 6, we can\
    \ know that the popularity of these websites containing malicious JavaScript code\
    \ is not low, and the highest one is visited by more than 14,000 people every\
    \ month. This shows that even if ranked websites, there are still many malicious\
    \ JavaScript codes, and it also indicates that our model is very effective and\
    \ practical. We promptly informed the owners of these websites that there may\
