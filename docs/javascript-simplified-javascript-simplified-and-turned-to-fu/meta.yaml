    # Introduction to JavaScript


    JavaScript is a programming language used to make interactive webpages.


    JavaScript''s main motto is to “make it move”.


    JavaScript is like Oxygen. It gives life to the web page and hence fascinates
    us with the wonderful interactions.


    JavaScript is responsible for all the cool animations that keeps us engaged on
    the web pages.


    If you''ve ever checked a live score of football match, JavaScript is probably
    running through it.


    JavaScript is everywhere.


    JavaScript is the most universal language in the world.


    The beauty of JavaScript is that you can build anything (not literally) with it.


    Here''s the list of things, we can build with JavaScript...


    +   JavaScript is used to create interactive web pages for both Desktop and Mobile
    applications.


    +   JavaScript is used to create mobile applications which we use every day.


    +   We can also create iOS and Android applications with it.'
  merge: -1
  pgno: 6
- img_proc: true
  md: "+   - JavaScript is also used to create full-fledged Desktop applications.\n\
    \nJavaScript is used by Google, Facebook, Microsoft, Uber and every other company\
    \ you could think of!\nKnowingly or unknowingly we've used their services and\
    \ hence we've utilized JavaScript.\n\n# # What is a computer program?\n\n**Computers**\
    \ are just boxes that blindly **follow instructions** \nBut, unlike humans, they\
    \ follow the **instructions accurately** .\nIf your mother asks you to add 2 onions\
    \ to the grocery list, there's a high possibility of you forgetting to bring the\
    \ onions.\nUnlike us, computers **remember** everything.\n\nAs we discussed, computers\
    \ follow a set of instructions and perform tasks accordingly.\nIf we take the\
    \ previous example, your mother had given you instructions about what all to add\
    \ in the grocery list.\nSo those set of instructions are nothing but computer\
    \ programs.\nComputer program is a set of instructions that a computer follows\
    \ to complete a task.\n\nLet's start by **commanding the computer** to **print**\
    \ \"Hello World\".\nSo can you guess how we will be going about this?\nWe will\
    \ start by providing the required instructions to the computer to print \"Hello\
    \ World\".\nWe are going to write those instructions in a language that the computer\
    \ understands.\n\n# # Printing text\n\nThe **command** to **print** text in **JavaScript**\
    \ is:"
