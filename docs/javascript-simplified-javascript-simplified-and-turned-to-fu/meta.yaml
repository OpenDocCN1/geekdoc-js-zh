  md: '# Getting started with es6


    We have been studying ECMAScript until now.

    **ECMAScript is nothing but the other name of JavaScript..**


    ECMA is a standard organization for information and communication systems.

    The standardized implementation of JavaScript came to be known as ECMAScript.


    In simple terms, we can say that JavaScript is governed by ECMA standards.


    The standardization continued in cycles and the **6th major release of ECMAScript**
    also known as **es6** came out in 2015.


    **ES6** comes with many new **features**.


    Some of which fairly enhance the way we do the most usual things in JavaScript.


    # let and const


    Before ES6, `var` variables were declared using var.

    Variables declared using `var` are **function scoped**.

    In ES6, we can declare variables using **let** and **const**.

    **let** is same as the *var*, except it is **block scoped**, unlike var.


    # What do you mean by block scoped?


    A `function scope` is created for every function.

    Whereas, `block scope` is created when we write conditional statements or loops.


    # let vs var


    When we learnt about scope we saw that a variable declared inside a function using
    `var` isn''t available outside the function.'
  merge: -1
  pgno: 91
- img_proc: true
  md: "But, a variable declared inside a block scope using var is still available\
    \ outside the block.\nFor example:\n\n```\nfor(var count=0; count<5; count++)\
    \ {\n  //some action \n  console.log(count);\n```\n\nThe variable count will be\
    \ available outside the block scope and its value would be logged as 5.\nWe don't\
    \ really need block variable to exist outside the block.\nThis is where let comes\
    \ in picture.\nIf we write,\n\n```\nfor( let count=0; count<5; count++) {\n  //some\
    \ action } console.log(count);\nReference Error**\n```\n\nconst is used to declare\
    \ constant variables.\nIt works exactly like let but the value of the variable\
    \ declared using const remains the same throughout the program.\nBoth let and\
    \ const are used in the same fashion as var .\nLet's see how.\n\n```\nlet variable_name\
    \ = value;\n```\n\nlet is the keyword , variable_name can be any valid variable\
    \ name and value is the variable value."
  merge: -1
  pgno: 92
- img_proc: true
  md: "```\nconst const_name = value;\n```\n\nconst is the keyword, const_name can\
    \ be any valid variable name\\and value is the constant value .\nJust like that.\n\
    It is advised to avoid the use of var and use block scoped let and\nconst.\n\n\
    # Arrow functions\n\nRemember how we write functions in JavaScript?\n\n```\n<!--\
    \ This defines a function --\nfunction nameFunction(){\n  -- This is function\
    \ body --\n}\n```\n\nES6 introduced shorthand and an efficient way to do the same\n\
    thing, which is known as arrow function.\nThe arrow function is written as\n\n\
    ```\n-- This defines an Arrow function\nusing Fat arrow->(parameters) => {\n \
    \ -- This is function body --\n}\n```\n\nWhich is same as writing"
  merge: -1
  pgno: 93
- img_proc: true
  md: "```\n<-- This defines a function with\nParameters -->function (Parameters{\n\
    \  <-- This is function body -->\n}\n```\n\nWe can also ignore the use of curly\
    \ braces if the function body is confined to one statement.\n\n```\n(parameters)\
    \ => statement;\n```\n\nFurther, we can assign the function to a variable, so\
    \ the function reference will be stored in variable.\n\n```\nlet varName = (parameters)\
    \ => {\n  <-- This is function body -->\n}\n```\n\nReplace all your old age function\
    \ definition practices with arrow functions.\n\n# Template strings\n\nLarge strings\
    \ and variable concatenation?\nSeriously, it's a tedious task breaking strings\
    \ using the \"+\" operator to concat variables.\nES6 brings the solution in the\
    \ form of Template Strings .\nTo write template strings we use backticks ( ` )\
    \ instead of single or double quotes."
  merge: -1
