  - '[PAGE 85]


    # Browser Object Model


    BOM stands for Browser Object Model.

    The Browser Object Model enables JavaScript to interact with the browser.

    The Browser object model consists of an object known as window.


    # Window Object


    ![](img/b5063176c50207c6bb66ca7182fd836f_85_0.png)


    The window object represents the browser window; every object is a child of the
    window object.

    Even the document object is a child of the window object.

    Other than the document object, the window object also consists of many other
    objects.

    The screen object which contains the information about the user''s screen.

    The history object which contains the browser''s history.

    The location object which gives us access to the URL.


    The navigator object which gives us the details about visitor''s browser.


    # Exploring the window object'
  - '[PAGE 86]


    The window object stores the information about the window size of the user’s browser.

    We can find out the height and width of the browser window.

    To do so, we use the innerHeight and innerWidth properties of the window object.


    window.innerHeight returns the innerHeight of the browser window.

    window.innerWidth returns the innerWidth of the browser window.

    These values are returned in pixels.


    It excludes the toolbar and scroll bar while calculating. Only the browser’s view
    part is considered.


    # The screen object


    The screen object contains the information about the user’s screen.

    To access the screen object we can write:


    ```

    window.screen or screen

    ```


    The screen object can be written without the window, just like the document object.


    We can get the height


    # The History object


    The history object gives us access to the history of the browser which is pretty
    interesting to play with.'
  - '[PAGE 87]


    We can navigate back and forth using the history object.

    The history object provides two methods - back() and forward()

    Writing history.back() is same as pressing the back button of the browser.

    And, on the same lines, history.forward() will take the navigation forward onto
    the next screen.

    Writing history.back() is same as writing window.history.back().

    Let''s see what we got under the location object.


    # The location object


    Using the location object we can get details about the URL,

    hostname, and protocol.

    Some of the properties which the location object provides are:


    window.location.href - It returns the URL of the current page.

    window.location.hostname - It returns the domain name of the

    website.

    window.location.protocol - It returns the protocol of the website.


    # The Navigator object


    This object is used to detect the browser''s information such as

    appName, appVersion etc.


    +   1. appName - returns the name

    2. appVersion-returns the version

    3. cookieEnabled-returns true if cookie is enabled else returns false

    4. online - returns true if browser is online else returns false.'
- md: "\n# Cookies\n\nCookies in JavaScript enable us to store data in the user’s\
    \ browser.\nCookie is a piece of data that is stored in the user’s browser.\n\
    But why do we need to store data in the browser?\nIt proves useful when we want\
    \ to remember information about the user.\nLike remembering your username for\
    \ a particular website, so when you visit the same website again, you don't need\
    \ to type it again. Or storing session variables - This is used for maintaining\
    \ a login session among different pages.\nJavaScript can read, create, modify\
    \ and delete cookies.\nLet's see how.\n\n# Creating a cookie\n\nA cookie can be\
    \ created by using the cookie property of our very document object.\nTo create\
    \ a cookie the following syntax is used:\n\n```\ndocument.cookie = \"key=value\"\
    ;\n```\n\nWhere the key is the name of the cookie and value is the value of the\
    \ cookie.\n\n# Creating Multiple cookies\n\nWe cannot create multiple cookies\
    \ at once with document.cookie.\nTo write multiple cookies:\n\n```\ndocument.cookie\
    \ = \"key1=value1\";\ndocument.cookie = \"key2=value2\";\n```\n\nWe need to write\
    \ as many key-value pairs as required by using document.cookie repeatedly.\nCookies\
    \ come with an expiry date. Yeah, they aren't permanent.\n\n# Deleting a cookie\n\
    \nBy default:\n\n```\ndocument.cookie = \"key=value; expires=Date\";\n```\n\n\
    The expires takes Date as a value.\n\n# Read the cookies\n\nSince we know how\
    \ to create cookies, let's see how we can read the cookies which are active.\n\
    Writing document.cookie returns the cookies which are already present.\n\n```\n\
    var myCook = document.cookie;\n```\n\nThe above will store a string containing\
    \ all the information about cookies in the variable myCook which will be in the\
    \ same key-value format.\n\n# Change the cookie in JavaScript\n\nWe can change\
    \ the value of the cookie in the same way as we created it:\n\n```\ndocument.cookie\
    \ = \"username=Favour Niflare; expires=Thu, 18 Dec 2013 12:00:00 UTC; path=/\"\
    ;\n```\n\nThe old cookie is replaced with the new one.\n\nWe can also delete the\
    \ existing cookies.\nTo do so, we need to simply write a past date in the expires\
    \ field.\n\n```\ndocument.cookie = \"key=; expires=Past_date;\";\n```\n\nWhere\
    \ key is the name of the cookie which is to be deleted.\nThere is no need to specify\
    \ the value while deleting a cookie.\n\n# Getting started with es6\n\nWe have\
    \ been studying ECMAScript until now.\n**ECMAScript is nothing but the other name\
    \ of JavaScript..**\n\nECMA is a standard organization for information and communication\
    \ systems.\nThe standardized implementation of JavaScript came to be known as\
    \ ECMAScript.\n\nIn simple terms, we can say that JavaScript is governed by ECMA\
    \ standards.\n\nThe standardization continued in cycles and the **6th major release\
    \ of ECMAScript** also known as **es6** came out in 2015.\n\n**ES6** comes with\
    \ many new **features**.\n\nSome of which fairly enhance the way we do the most\
    \ usual things in JavaScript.\n\n# let and const\n\nBefore ES6, `var` variables\
    \ were declared using `var`.\nVariables declared using `var` are **function scoped**.\n\
    In ES6, we can declare variables using **let** and **const**.\n**let** is same\
    \ as the *var*, except it is **block scoped**, unlike var.\n\n# What do you mean\
    \ by block scoped?\n\nA `function scope` is created for every function.\nWhereas,\
    \ `block scope` is created when we write conditional statements or loops.\n\n\
    # let vs var\n\nWhen we learnt about scope we saw that a variable declared inside\
    \ a function using `var` isn't available outside the function.\n\nBut, a variable\
    \ declared inside a block scope using `var` is still available outside the block.\n\
    For example:\n\n```\nfor(var count=0; count<5; count++) {\n  //some action \n\
    \  console.log(count);\n}\n```\n\nThe variable count will be available outside\
    \ the block scope and its value would be logged as 5.\nWe don't really need block\
    \ variable to exist outside the block.\nThis is where let comes in picture.\n\
    If we write,\n\n```\nfor(let count=0; count<5; count++) {\n  //some action \n\
    } \nconsole.log(count);\n// Reference Error**\n```\n\nconst is used to declare\
    \ constant variables.\nIt works exactly like let but the value of the variable\
    \ declared using const remains the same throughout the program.\nBoth let and\
    \ const are used to declare variables.\n"
  mdcn: "\n\n# Cookies\n\nJavaScript 中的 Cookies 允许我们在用户的浏览器中存储数据。\nCookie 是存储在用户浏览器中的一段数据。\n\
    但为什么我们需要在浏览器中存储数据呢？\n当我们想要记住用户信息时，它就非常有用。\n例如记住你在特定网站的用户名，这样当你再次访问同一网站时，就不需要再次输入。或者存储会话变量——用于在不同页面之间维持登录会话。\n\
    JavaScript 可以读取、创建、修改和删除 cookies。\n让我们来看看如何操作。\n\n# 创建 cookie\n\n可以通过文档对象的 `cookie`\
    \ 属性创建 cookie。\n创建 cookie 使用以下语法：\n\n```\ndocument.cookie = \"key=value\";\n```\n\
    \n其中 key 是 cookie 的名称，value 是 cookie 的值。\n\n# 创建多个 cookies\n\n我们无法通过 `document.cookie`\
    \ 一次创建多个 cookie。\n写入多个 cookie：\n\n```\ndocument.cookie = \"key1=value1\";\ndocument.cookie\
    \ = \"key2=value2\";\n```\n\n我们需要反复使用 `document.cookie` 写入所需数量的键值对。\nCookies 带有过期日期。是的，它们不是永久的。\n\
    \n# 删除 cookie\n\n默认情况下：\n\n```document.cookie = \"key=value; expires=Date\";\n\
    ```\n\n`expires` 取 `Date` 作为值。\n\n# 读取 cookies\n\n既然我们已经知道如何创建 cookie，让我们来看看如何读取当前激活的\
    \ cookies。\n写入 `document.cookie` 会返回已经存在的 cookies。\n\n```\nvar myCook = document.cookie;\n\
    ```\n\n上述操作将包含所有 cookie 信息的字符串存储在变量 `myCook` 中，其格式为相同的键值对格式。\n\n# 在 JavaScript\
    \ 中修改 cookie\n\n我们可以以创建 cookie 的方式修改 cookie 的值：\n\n```\ndocument.cookie = \"username=Favour\
    \ Niflare; expires=Thu, 18 Dec 2013 12:00:00 UTC; path=/\";\n```\n\n旧 cookie 将被新\
    \ cookie 替换。\n\n也可以删除现有的 cookies。\n要这样做，我们只需要在 `expires` 字段中写一个过去的日期即可。\n\n```document.cookie\
    \ = \"key=; expires=Past_date;\";\n```\n\n其中 key 是要删除的 cookie 名称。\n删除 cookie 时不需要指定值。\n\
    \n# 开始学习 es6\n\n到为止我们一直在学习 ECMAScript。\n**ECMAScript 不过是 JavaScript 的另一个名字...**\n\
    \nECMA 是一个信息和通信系统的标准组织。\nJavaScript 的标准化实现被称为 ECMAScript。\n\n简单来说，我们可以说 JavaScript\
    \ 是受 ECMA 标准规范的。\n\n标准化以周期形式进行，**ECMAScript 的第六个主要大版本**（也称为 **es6**）于 2015 年发布。\n\
    \n**ES6** 带有许多新**特性**。\n\n其中一些特性在很大程度上增强了我们在 JavaScript 中执行最常见操作的方式。\n\n# let\
    \ and const\n\n在 ES6 之前，`var` 变量使用 `var` 声明。\n使用 `var` 声明的变量是**函数作用域 (function\
    \ scoped)**。\n在 ES6 中，我们可以使用 **let** 和 **const** 来声明变量。\n**let** 与 *var* 相同，但它是**块作用域\
    \ (block scoped)** 的，与 var 不同。\n\n# 什么是块作用域？\n\n每个每个函数都会创建一个`函数作用域 (function scope)`。\n\
    而当我们编写条件语句或循环时，会创建一个`块作用域 (block scope)`。\n\n# let vs var\n\n当我们学习作用域时，看到在函数内部使用\
    \ `var` 声明的变量在函数外部是不可用的。\n\n但是，在块作用域内部使用 `var` 声明的变量在块外部仍然可用。\n例如：\n\n```\nfor(var\
    \ count=0; count<5; count++) {\n  //some action \n  console.log(count);\n}\n```\n\
    \n变量 `count` 在块作用域外部可用，且其值会被记录为 5。\n我们并不真的需要块变量存在块外部。\n这就是 `let` 派上用场的地方。\n如果我们写：\n\
    \n```\nfor(let count=0; count<5; count++) {\n  //some action \n} \nconsole.log(count);\n\
    // Reference Error**\n```\n\n`const` 用于声明常量变量。\n它的工作方式与 `let` 完全相同，但使用 `const`\
    \ 声明的变量值在整个程序运行期间保持不变。\n`let` 和 `const` 都用于声明变量。\n\n"
