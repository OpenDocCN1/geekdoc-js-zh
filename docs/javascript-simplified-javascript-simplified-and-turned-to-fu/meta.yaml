  md: '```

    document.write

    ```


    This command tells the computer to write (print) something on a document i.e.
    a web page.

    But this command is incomplete without few special characters.

    Let''s go ahead and add them.


    Round Brackets ('')'') tells the computer to separate the command from the text
    that is to be printed.

    Let''s add Round Brackets to our command.


    ```

    document.write()

    ```


    Double quotes ("") are added to instruct the computer about which part is to be
    printed.

    Let''s add Double Quotes to our command along with Hello World.


    ```

    document.write("Hello World")

    ```


    Semicolon indicates the end of a command and hence is added after every command.
    This is our command:


    ```

    document.write("Hello World");

    ```'
