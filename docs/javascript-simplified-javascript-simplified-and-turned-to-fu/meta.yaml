  md: "```\ndocument.write(x); \ndocument.write(x);\ndocument.write(x);\n```\n\nWhat\
    \ if the same task could be performed in 3-4 lines of **code**?\nYes! 3-4 lines!\
    \ You read it write!\nThis **procedure** is called **looping**\n**Looping** is\
    \ basically **repeat**ing a sequence of instructions until **condition** is satisfied.\n\
    It's like performing 50 pushups, here 50 is the **maximum limit** and performing\
    \ pushups, is the sequence of **instructions** .\nLet's consider the previous\
