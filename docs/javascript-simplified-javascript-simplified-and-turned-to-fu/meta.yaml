  mdcn: "\n\n上面的类简单地获取学生的姓名和学号并返回它们。我们已经成功声明了第一个类。但如果不去使用它，它只是一个模板。让我们看看如何编写该类的实例并访问类方法。\n\
    \n## 访问类成员\n\n可以通过创建类的实例来访问类的成员。\n对象被用于访问变量并给变量赋值。\n这是通过使用 `new` 关键字来实现的。\n\n\
    ```js\nlet objName = new ClassName();\n```\n\n`new` 关键字用于实例化对象以备使用。\n`ClassName()`\
    \ 是类构造函数的名称。\n让我们写一个 `Student` 类的实例。\n\n```javascript\n<-- 这定义了一个类 -->\nclass\
