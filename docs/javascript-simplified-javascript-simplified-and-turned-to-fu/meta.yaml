    Like the roll numbers, the items in the arrays are assigned a particular number
    depending on the order of the item they''ve been added.

    The items are assigned a number starting from zero. The first item is assigned
    zero followed by the next one and so on.

    Luckily, computers don''t proxy like we do for our friends ;

    Hence when a particular number is called, the item associated with it always responses
    .

    Let''s create an array with names of students from a class'
