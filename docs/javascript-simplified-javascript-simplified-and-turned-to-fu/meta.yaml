    \ = 5;\n-- Declares another variable and assign a template string value -->\n\
    let str1 = `I am 5 years old`.;\n```\n\nstr1 will be I am 5 years old .\nJavaScript\
    \ makes you fall in love.\nThere are many more es6 features waiting for you to\
    \ explore them.\n\n# Classes in ES6\n\nES6 introduced classes to the JavaScript.\n\
    The newly introduced class syntax is a syntax upgraded from the\nexisting purely\
    \ object based JavaScript.\n\nJavaScript didn't have explicit classes, the same\
