- md: "\nOnce we're done defining the function, the next step is to call and use it.\n\
    \nA function can be defined in the following way:\n\n```\nfunction functionname(){\n\
    \  code\n}\n```\n\nWe start defining the function by using the function keyword\
    \ followed by the name of the function which is then followed by open and close\
    \ round brackets. Once we're done with it, we write the reusable code inside the\
    \ curly brackets.\n\n## Function example\n\nLet's create a function which prints\
    \ “I know JavaScript!” We'll start by writing the function keyword followed by\
    \ naming the function and opening and closing the round brackets.\n\n```\nfunction\
    \ print()\n```\n\nWe've named our function as print. Once we're done with it lets\
    \ write the code to print inside curly brackets.\n\n```\nfunction print() {\n\
    \  document.write(\"I know JavaScript!\");\n}\n```\n\nYes, we're done with the\
    \ function definition; let's move on to calling the function.\n\n## Calling a\
    \ function\n\nNow, we've a function named print which prints \"I know JavaScript!\"\
    \ The next step is calling the function. Calling a function is as easy as writing\
    \ the name of the function followed by opening and closing round brackets. So,\
    \ the whole code would look something like:\n\n```\nfunction print() {\n  document.write(\"\
    I know JavaScript!\");\n}\nprint();\n```\n\n## Parameters\n\nWhy do we need an\
    \ outside variable inside a function?\n\nLet's build up on the addition function.\n\
    We'll create a function followed by declaring two variables and then performing\
    \ addition in the third variable and finally printing it out.\nFinally, we will\
    \ call the function.\nAs we had mentioned earlier, the main aim of function was\
    \ to make the code reusable.\nSo how do we put in different values in the function\
    \ so that it will print the result? The solution to that is Parameters!\n\n```\n\
    function functionname(parameter){\n  code\n}\nfunctionname(parameter)\n```\n\n\
    Parameters are passed while calling the functions and later those passed parameter\
    \ can be manipulated inside the functions.\nThat is, let's say we pass 2 and 3\
    \ in our add function while calling it, and then inside the function we can use\
    \ the given parameters i.e. 2 and 3 to perform their addition and hence printing\
    \ it out.\nSimilarly, we can pass 4 and 5 as a parameter to that function and\
    \ hence printing the result.\nThus becoming successful in making our function\
    \ reusable.\nLet's write a program to get a clear picture of the same.\n\n## Example\n\
    \nLet's create a function to add two numbers.\nLet's start by creating a function.\n\
    \n```\nfunction add(){\n}\n```\n\nNow, since we are going to call this function\
    \ using **parameters**, thus we've to mention it while creating the function.\
    \ This is how we do it.\n\n```\nfunction add(num1, num2){\n}\n```\n\nHere, **num1**\
    \ and **num2** are the two numbers we'll get as parameters while the function\
    \ is called.\nNow let's go ahead and create a **variable** which would store the\
    \ value of the end result.\n\n```\nfunction add(num1, num2){\n  var result = num1\
    \ + num2;\n  document.write(result);\n}\n\n```\n\nadd(3,4);\n```\n\nWe're ready\
    \ to call the function!\n\nIn this scenario, we're passing 3 and 4 as parameters\
    \ to the function.\nSo, num1 becomes 3 and num2 becomes 4 and hence the result\
    \ variable **stores** the result and prints it out.\n\n## Scope\n\nHow often and\
    \ in what context do you use the word **scope**?\nIn a normal scenario, if you\
    \ can access something then it falls within your scope or else it falls out of\
    \ your **scope**.\nThe same concept applies to programming.\n\nThe accessibility\
    \ or validity of a **variable** is determined by its **scope**.\nSuppose a variable\
    \ is declared inside a function. And we try to access the variable outside that\
    \ function.\nThen we will encounter an error that the variable we are trying to\
    \ access is undeclared.\n\nIn JavaScript there are two types of Scope:\n\n- Local\
    \ Scope\n- Global Scope\n\nLet's explore each one of them in detail.\n\n## Local\
    \ scope\n\nWhenever a variable is declared inside a function it is said to have\
    \ **local scope**. A variable declared inside a function can only be used inside\
    \ that function. Let's write a function **localFunction** and declare a variable\
    \ **localVar** inside it.\n\n```javascript\n<!-- This will define a function -->\n\
    function localFunction(){\n    <!-- This will create a variable and\n    store\
    \ value 50 -->\n    var localVar = 50;\n}\n```\n\nHere, localVar is a variable\
    \ whose scope is limited to the function localFunction.\nNow, let's try to log\
    \ the value of localVar outside the function.\n\n```javascript\n// This will define\
    \ a function --\nfunction localFunction(){\n  // This will create a variable and\n\
    \  // store value 50 --\n  var localVar = 50;\n}\n// This will print the value\
    \ of variable --\nconsole.log(localVar);\n```\n\nCan you guess the output of the\
    \ above snippet?\nWe will encounter an error, something similar to\nUncaught ReferenceError:\
    \ localVar is not defined\nBecause the scope of that variable is limited to the\
    \ function.\n\n```javascript\n<!-- This will define a function -->\nfunction localFunction()\
    \ {\n  <!-- This will create a variable and\n  store value 50 -->\n  var localVar\
    \ = 50;\n  <!-- This will print the value of\n  variable -->\n  console.log(localVar);\n\
    }\n// This will call the function --\nlocalFunction();\n```\n\nThe output of the\
    \ above snippet will be an error, because the scope of that variable is limited\
    \ to the function.\n\n## Global scope\n\nThe variables which can be accessed everywhere\
    \ are said to have global scope.\nThese variables are not declared inside any\
    \ function.\nLet's see.\n\n```javascript\n<!-- This will create a variable and\n\
    store value 50 -->\nvar globalVar = 50;\n\n// This will define a function --\n\
    function localFunction(){\n    // This will print the value of variable --\n \
    \   console.log(globalVar);\n}\n// This will call the function --\nlocalFunction();\n\
    ```\n\nThe output of the above program will be 50, because globalVar is defined\
    \ outside any function.\n\n## Hoisting\n\nIn JavaScript, all variable declarations\
    \ are moved to the top. This is known as hoisting.\nIt means that a variable can\
    \ be used before it is declared.\n\n```javascript\nvar newVar;\nconsole.log(newVar);\n\
    newVar = 50;\n```\n\n## String\n\nA string is a sequence of characters.\nAll the\
    \ textual data that you see floating on the screen now are strings.\nIn JavaScript\
    \ strings are used to store and manipulate data.\nAnything written inside quotes\
    \ is a string.\n\n```javascript\nvar newStr = \"Hey! I am a string.\";\n```\n\n\
    Here, newStr is of type string containing \"Hey! I am a string.\"\nHere, newStr\
    \ is a variable of type string.\n\"Hey! I am a string\" is the value of that variable\n\
    \nJust like every other variable declaration, strings are declared using the var\
    \ keyword in JavaScript.\n\n```javascript\nvar strName = \"Mike\";\n```\n\nHere,\
    \ var is the keyword,\nstrName is the string variable name,\nMike is the value\
    \ of the variable\nJavaScript accepts both single quotes ('') and double quotes\
    \ (\"\") enclosing strings.\nBe careful, not to mix up the quotes.\nIf you begin\
    \ a string using a single quote, you should end it with a single quote.\nIf you\
    \ begin a string using double quotes then you should end it with double quotes.\n\
    \nAwesome, we know how to declare and initialize strings in JavaScript.\nLet's\
    \ see some of the built-in properties and methods that are used to perform operations\
    \ on the strings.\n\n## Finding the length of the string\n\nTo find the length\
    \ of the string, we use the built in length property. To use this property we\
    \ write\n\n```javascript\nstringName.length;\n```\n\nSo, what should we write\
    \ in order to find the length of the string\n\"HeyString\" ?\n\n```javascript\n\
    <!-- This will create a variable and store a string value\nvar newStr = \"HeyString\"\
    ;\n<!-- This will find the length of defined variable\nand store in another variable\
    \ -->\nvar strLength = newStr.length;\n```\n"
  mdcn: "\n一旦我们定义了函数，下一步就是调用并使用它。\n\n函数可以按照以下方式定义：\n\n```\nfunction functionname(){\n\
    \  code\n}\n```\n\n我们通过使用 `function` 关键字开始定义函数，后面紧跟函数名，然后是一对圆括号。完成后，我们在大括号内部编写可重用的代码。\n\
    \n## 函数示例\n\n让我们创建一个打印“I know JavaScript!”的函数。我们先从编写 `function` 关键字开始，然后为函数命名并加上开启的圆括号。\n\
    \n```\nfunction print()\n```\n\n我们已经将函数命名为 `print`。完成后，让我们在大括号内编写用于打印的代码。\n\n\
    ```\nfunction print() {\n  document.write(\"I know JavaScript!\");\n}\n```\n\n\
    是的，函数定义已经完成；让我们继续调用函数吧。\n\n## 调用函数\n\n现在，我们有一个名为 `print` 的函数，它可以打印“I know JavaScript!”。下一步是调用该函数。调用函数非常简单，只需编写函数名并加上一对圆括号。因此，整个代码看起来像这样：\n\
    \n```\nfunction print() {\n  document.write(\"I know JavaScript!\");\n}\nprint();\n\
    ```\n\n## 参数\n\n我们为什么在函数内部需要外部变量？\n\n让我们在加法函数的基础上继续。\n我们将创建一个函数，接着声明两个变量，然后在第三个变量中执行加法，最后将其打印出来。\n\
    最后，我们将调用该函数。\n正如我们之前提到的，函数的主要目的是让代码可重用。\n那么，我们如何向函数存入不同的值以便它打印结果呢？解决方案就是参数（Parameters）！\n\
    \n```\nfunction functionname(parameter){\n  code\n}\nfunctionname(parameter)\n\
    ```\n\n参数在调用函数时传递，稍后这些传递的参数可以在函数内部进行操作。\n也就是说，假设我们在调用 `add` 函数时传递了 2 和 3，然后在函数内部可以使用可以使用定的参数（即\
    \ 2 和 3）进行相加并将其打印出来。\n同样地，我们可以将 4 和 5 作为参数传递给该函数，并打印结果。\n从而成功地实现了我们函数的可重用。\n让我们写一个程序来清晰地了解这一点。\n\
    \n## 示例\n\n让我们创建一个两个数字之和的函数。\n让我们从创建一个函数开始。\n\n```\nfunction add(){\n}\n```\n\n\
    现在，由于我们将使用**参数**来调用此函数，因此在创建函数时必须提到它。我们是这样做的：\n\n```\nfunction add(num1, num2){\n\
    }\n```\n\n在这里，**num1** 和 **num2** 是我们在调用函数时作为参数获取的两个数字。\n现在，让我们创建一个**变量**来存储最终结果的值。\n\
    \n```\nfunction add(num1, num2){\n  var result = num1 + num2;\n  document.write(result);\n\
    }\n\nadd(3,4);\n```\n\n我们已准备好调用函数了！\n\n在这种情况下，我们将 3 和 4 作为参数传递给函数。\n因此，`num1`\
    \ 变为 3，`num2` 变为 4，结果变量 `result` **存储**了结果并将其打印。\n\n## 作用域\n\n你多久以及在什么情况下使用“作用域”（scope）这个词？\n\
    在通常情况下，如果你可以访问某个东西，它就在你的作用域范围内，否则它就在你的**作用域**之外。同样的概念适用于编程。\n\n**变量**的可访问性或有效性是由其**作用域**决定的。\n\
    假设一个变量声明在函数内部。如果我们尝试在函数外部访问该变量。\n那么我们将遇到一个错误，提示我们尝试访问的变量未定义。\n\n在 JavaScript 中有两种类型的作用域：\n\
    \n- 局部作用域 (Local Scope)\n- 全局作用域 (Global Scope)\n\n让我们详细探索每一个。\n\n## 局部作用域\n\n\
    每当变量在函数内部声明时，被称为具有**局部作用域**。在函数内部声明的变量只能在该函数内部。让我们写一个函数 `localFunction` 并在内部声明一个变量\
    \ `localVar`。\n\n```javascript\n// 这将定义一个函数\nfunction localFunction(){\n    //\
    \ 这将创建一个变量并\n    // 存储值 50\n    var localVar = 50;\n}\n```\n\n在这里，localVar 是一个变量，其作用域局限于函数\
    \ `localFunction`。\n现在，让我们尝试在函数外打印 `localVar` 的值。\n\n```javascript\n// 这将定义一个函数\n\
    function localFunction(){\n  // 这将创建一个变量并\n  // 存储值 50\n  var localVar = 50;\n\
    }\n// 这将打印变量的值\nconsole.log(localVar);\n```\n\n你能猜到上述代码段的输出吗？\n我们将遇到一个错误，类似于\n\
    `Uncaught ReferenceError: localVar is not defined`\n因为该变量的作用域局限于函数。\n\n```javascript\n\
    // 这将定义一个函数\nfunction localFunction() {\n  // 这将创建一个变量并\n  // 存储值 50\n  var localVar\
    \ = 50;\n  // 这将打印变量的值\n  console.log(localVar);\n}\n// 这将调用函数\nlocalFunction();\n\
    ```\n\n上述代码段的输出将是一个错误，因为该变量的作用域局限于函数。\n\n## 全局作用域\n\n随处可以访问的变量具有全局作用域。\n这些变量没有在任何函数内部声明。让我们来看看。\n\
    \n```javascript\n// 创建一个变量并存储值 50\nvar globalVar = 50;\n\n// 这将定义一个函数\nfunction\
    \ localFunction(){\n    // 这将打印变量的值\n    console.log(globalVar);\n}\n```\n\n程序的输出将是\
    \ 50，因为 globalVar 定义在函数外部。\n\n## 变量提升 (Hoisting)\n\n在 JavaScript 中，所有的变量声明都会移动到顶部。这被称为变量提升。\n\
    这意味着变量可以在声明之前使用。\n\n```javascript\nvar newVar;\nconsole.log(newVar);\nnewVar =\
    \ 50;\n```\n\n## 字符串 (String)\n\n字符串是字符序列。\n你在屏幕上看到的所有文本数据都是字符串。在 JavaScript 中，字符串用于存储和处理数据。\n\
    写在引号内部任何字符串。\n\n```javascript\nvar newStr = \"Hey! I am a string.\";\n```\n\n\
    在这里，newStr 的类型为字符串 \"Hey! I am a string.\"\n在这里，newStr 是一个字符串类型的变量。\n\"Hey! I\
    \ am a string\" 是该变量的值\n\n与其他所有变量声明一样，字符串使用 `var` 关键字声明。\n\n```javascript\nvar\
    \ strName = \"Mike\";\n```\n\nJavaScript 接受单引号 ('') 和双引号 (\"\") 包裹字符串。\n注意不要混合使用。\n\
    如果你使用单引号开始字符串，你应该用单引号结束。\n如果你使用双引号开始字符串，你应该用双引号结束。\n\n太好了，我们知道如何在 JavaScript 中声明和初始化字符串。\n\
    让我们看看一些用于对字符串操作的内置属性和方法。\n\n## 查找字符串的长度\n\n要找到字符串的长度，我们使用内置的 `length` 属性。使用该属性时我们写：\n\
    \n```\nstringName.length;\n```\n\n那么，为了找到字符串 \"HeyString\" 的长度应该写什么？\n\n```javascript\n\
    // 创建一个变量并存储字符串值\nvar newStr = \"HeyString\";\n// 查找定义变量的长度\n// 并存储在另一个变量中\nvar\
    \ strLength = newStr.length;\n```\n"
