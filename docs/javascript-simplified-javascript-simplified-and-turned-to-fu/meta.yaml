  md: '# How to create arrays?


    **Arrays** are written just like **variables**, i.e. **var keyword** followed
    by the **array** name:


    ```

    var array_items

    ```


    Once, we''ve the **array''s** name, we **add values** to it. **Values** are written
    in between **square brackets**.


    ```

    var array_items = [];

    ```


    The **values** are **separated** by **commas** (",").


    ```

    var array_items = ["item1", "item2", "item3"];

    ```


    # More about arrays


    But the catch here is, we can only **store** collection of variables of the **same
    type**.


    ```

    var array = ["godiving", 1, 44, "visit Paris"];

    ```'
