    \ website, so when you visit the same website again, you don't need to type it\
    \ again. Or storing session variables - This is used for maintaining a login session\
    \ among different pages.\nJavaScript can read, create, modify and delete cookies.\n\
    Let's see how.\n\n# Creating a cookie\n\nA cookie can be created by using the\
    \ cookie property of our very document object.\nTo create a cookie following syntax\
    \ is used:\n\n```\ndocument.cookie = \"key=value\";\n```\n\nWhere the key is the\
    \ name of the cookie and value is the value of the cookie.\n\n# Creating Multiple\
    \ cookies\n\nWe cannot create multiple cookies at once with document.cookie.\n\
    write multiple cookies\n\n```\ndocument.cookie = \"key1=value1\";\ndocument.cookie\
    \ = \"key2=value2\";\n```"
