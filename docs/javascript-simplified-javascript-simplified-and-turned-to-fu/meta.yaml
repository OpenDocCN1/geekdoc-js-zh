  md: 'We need to write as many key-value pairs as required by using document.cookie
    repeatedly.

    Cookies come with an expiry date. Yeah, they aren''t permanent.


    # Deleting a cookie


    By default


    ```

    document.cookie = "key:value;

    expires:Date";

    ```


    The expires takes Date as a value.


    # Read the cookies


    Since we know how to create cookies, let''s see how we can read the cookies which
    are active.

    Writing document.cookie returns the cookies which are already present.


    ```

    var myCook = document.cookie;

    ```


    The above will store a string containing all the information about cookies in
    the variable myCook which will be in the same key-value format.


