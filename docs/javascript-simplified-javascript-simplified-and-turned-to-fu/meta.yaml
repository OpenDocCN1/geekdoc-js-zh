    \ 9798704820246\n\nCover design by: Niflare\n\n# Table of Content\n\n# Introduction\
    \ to JavaScript\n\n- What is a computer program?\n- Printing text\n\n# Storing\
    \ a value\n\n- Storing a string\n- Storing Boolean Value\n- Storing a number\n\
    \n# Basic math calculation\n\n- Addition and Subtraction\n\n# Comparison\n\n-\
    \ Equal to\n- Not Equal to\n- Deep into comparisons\n\n# Making decision\n\n-\
    \ Conditional Statements\n- if...else\n\n# Array\n\n- How to create arrays?\n\
    - More about arrays\n- Accessing arrays\n\n# Repeating a task\n\n- Loops in JavaScript\n\
    - For Loop\n- Do..While Loop\n\n# Dialog Boxes\n\n- Types of dialog boxes\n- Alert\
    \ Dialog Box\n- Prompt Dialog Box\n- Confirm Dialog Box\n\n# Functions\n\n- What's\
    \ a function?\n- How to create a function?\n- Function example\n- Calling a function\n\
    - Parameters\n- Example\n\n# Scope\n\n- Local scope\n- Global scope\n- Hoisting\n\
    \n# String\n\n- Finding the length of the string\n- Joining two strings\n- Finding\
    \ a substring\n- Converting string to uppercase and lowercase\n\n# Numbers and\
    \ Booleans\n\n- Rounding off the numbers\n- Converting a number into a string\n\
    - Writing numbers up to a precision\n- Boolean\n\n# Objects in JavaScript\n\n\
    - Defining an object\n- Using an object literal\n- Using the new keyword\n- Using\
    \ object properties\n- Using a dot operator\n- Using bracket notation\n\n# Dates\
    \ in JavaScript\n\n- Operations on date\n\n# Document Object Model (DOM)\n\n-\
    \ Accessing Elements in DOM\n- Access using Tag Name\n- Access using Class Name\n\
    - Access using ID\n\n# Accessing HTML Elements using JavaScript\n\n- Using the\
    \ tag name\n- Using Class Name\n- Using Id\n- Accessing HTML Elements by CSS Selectors\n\
    \n# Manipulating HTML elements using JavaScript\n\n- Writing HTML content\n- Changing\
    \ the content of HTML\n- Creating new elements\n- Appending elements\n- Remove\
    \ an element\n- Setting an attribute\n\n# Manipulating CSS Using JavaScript\n\n\
    - Manipulating CSS\n\n# Events in JavaScript\n\n- Types of Events\n- Attaching\
    \ events to HTML elements\n- Removing events from HTML elements\n\n# Browser Object\
    \ Model\n\n- Window Object\n- Exploring the window object\n- The screen object\n\
    - The history object\n- The location object\n- The Navigator object\n\n# Cookies\n\
    \n- Creating a cookie\n- Creating Multiple cookies\n- Deleting a cookie\n- Read\
    \ the cookies\n- Change the cookie in JavaScript\n\n# Getting started with es6\n\
    \n- let and const\n- What do you mean by block scoped?\n- let vs var\n- Arrow\
    \ functions\n- Template strings\n\n# Classes in ES6\n\n- Writing a Class\n- Accessing\
    \ members of the class\n\n# Introduction to JavaScript\n\nJavaScript is a programming\
    \ language used to make interactive webpages.\n\nJavaScript's main motto is to\
    \ “make it move”.\n\nJavaScript is like Oxygen. It gives life to the web page\
    \ and hence fascinates us with the wonderful interactions.\n\nJavaScript is responsible\
    \ for all the cool animations that keeps us engaged on the web pages.\n\nIf you've\
    \ ever checked a live score of football match, JavaScript is probably running\
    \ through it.\n\nJavaScript is everywhere.\n\nJavaScript is the most universal\
    \ language in the world.\n\nThe beauty of JavaScript is that you can build anything\
    \ (not literally) with it.\n\nHere's the list of things, we can build with JavaScript...\n\
    \n- JavaScript is used to create interactive web pages for both Desktop and Mobile\
    \ applications.\n- JavaScript is used to create mobile applications which we use\
    \ every day.\n- We can also create iOS and Android applications with it.\n- JavaScript\
    \ is also used to create full-fledged Desktop applications.\n\nJavaScript is used\
    \ by Google, Facebook, Microsoft, Uber and every other company you could think\
    \ of!\nKnowingly or unknowingly we've used their services and hence we've utilized\
    \ JavaScript.\n\n## What is a computer program?\n\n**Computers** are just boxes\
    \ that blindly **follow instructions** \nBut, unlike humans, they follow the **instructions\
    \ accurately**.\nIf your mother asks you to add 2 onions to the grocery list,\
    \ there's a high possibility of you forgetting to bring the onions.\nUnlike us,\
    \ computers **remember** everything.\n\nAs we discussed, computers follow a set\
    \ of instructions and perform tasks accordingly.\nIf we take the previous example,\
    \ your mother had given you instructions about what all to add in the grocery\
    \ list.\nSo those set of instructions are nothing but computer programs.\nComputer\
    \ program is a set of instructions that a computer follows to complete a task.\n\
    \nLet's start by **commanding the computer** to **print** \"Hello World\".\nSo\
    \ can you guess how we will be going about this?\nWe will start by providing the\
    \ required instructions to the computer to print \"Hello World\".\nWe are going\
    \ to write those instructions in a language that the computer understands.\n\n\
    ## Printing text\n\nThe **command** to **print** text in **JavaScript** is:\n\n\
    ```\ndocument.write\n```\n\nThis command tells the computer to write (print) something\
    \ on a document i.e. a web page.\nBut this command is incomplete without few special\
    \ characters.\nLet's go ahead and add them.\n\nRound Brackets `()` tell the computer\
    \ to separate the command from the text that is to be printed.\nLet's add Round\
    \ Brackets to our command.\n\n```\ndocument.write()\n```\n\nDouble quotes (\"\"\
    ) are added to instruct the computer about which part is to be printed.\nLet's\
    \ add Double Quotes to our command along with Hello World.\n\n```\ndocument.write(\"\
    Hello World\")\n```\n\nSemicolon indicates the end of a command and hence is added\
    \ after every command. This is our command:\n\n```\ndocument.write(\"Hello World\"\
    );\n```\n\nThe result of the above command will be:\nHello World\n\n## Storing\
    \ a value\n\nPreviously, we learned how to command the computer to print something.\n\
    Now, let's dive deeper and learn how to store values in JavaScript.\n\nImagine\
    \ yourself as a scientist in a chemistry lab.\nSo if you look around the lab,\
    \ you'll find several cylinders.\nEach cylinder contains different types of gases,\
    \ starting from Oxygen to Nitrogen.\nBut how do we differentiate which cylinder\
    \ contains gas?\nTo solve that problem, we get it labeled with the name on it.\n\
    Similarly, if we want to store some information, we store it in our memory.\n\
    And we've all the information labeled in order to avoid confusion.\nAnd if someone\
    \ asks us, we don't tell them our grandfather's name.\nDo we? Definitely no!\n\
    In Programming, this storing container is called “Variable”.\nSo, variables are\
    \ containers which store values.\nWe place values in these containers and then\
    \ use those values referring to the container's name.\n\n## Storing a string\n\
    \nLet's say we want to print “Niflare\"\n\n```\ndocument.write(\"Niflare\");\n\
    ```\n\nDon't think that's a lot of writing??\nInstead let's use a variable to\
    \ save our energy.\nIn JavaScript, creating a variable is called “declaring” a\
    \ variable.\n\nEvery programming language has their set of reserved names which\
    \ are called keywords.\n\nVariables are declared with the 'var ' keyword followed\
    \ by an equal to (= and the value.\nLet’s go ahead and save the word “Niflare”\
    \ in a variable x.\n\n```javascript\nvar x = \"Niflare\";\n```\n\nDon’t forget\
    \ to close the statement with a semicolon \";\nNow, if we want to print the word\
    \ twice, we can do it in the following manner:\n\n```javascript\nvar x = \"Niflare\"\
    ;\ndocument.write(x);\ndocument.write(x);\n```\n\nPs: There’s a better way to\
    \ write less code to perform the same task, which we’ll learn soon.\n\nSo, words\
    \ are called Strings in programming language. Hope you remember it, we will use\
    \ this name a lot.\nStrings are sequences of alphanumeric characters.\nString\
    \ values are always written with quotations (\"\").\n\n# Storing Boolean Value\n\
    \nIn life, we’ve to make several decisions.\n"
