- img_proc: true
  md: '# Storing a value


    Previously, we learned how to command the computer to print something.

    Now, let''s dive deeper and learn how to **store values** in JavaScript.


    Imagine yourself as a scientist in a chemistry lab.

    So if you look around the lab, you''ll find several cylinders.

    Each cylinder contains different types of gases, starting from Oxygen to Nitrogen.

    But how do we differentiate which cylinder contains which gas?

    To solve that problem, we get it **labeled** with the gas **name** on it.

    Similarly, if we want to store some information, we **store** it in our memory.

    And we''ve all the information labeled in order to avoid confusion.

    And if someone asks us, we don''t tell them our grandfather''s name.

    Do we? Definitely no!

    In Programming, this storing **container** is called **“Variable”**.

    So, variables are containers which store values.

    We place values in these containers and then use those values referring to the
    container''s name.


    # Storing a string


    Let''s say we want to print “Niflare"


    ```

    document.write("Niflare");

    ```


    Don''t think that''s a lot of writing??

    Instead let''s use a variable to save our energy.

    In JavaScript, **creating a variable** is called **“declaring”** a variable.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Every programming language has their set of **reserved names** which are called
    **keywords**.


    **Variables** are declared with the ''var '' keyword followed by an **equal to**
    ("=") and the **value**.

    Let’s go ahead and save the word “Niflare” in a variable x.


    ```

    var x = "Niflare";

    ```


    Don’t forget to close the statement with a **semicolon** ";

    Now, if we want to print the word twice, we can do it in the following manner:


    ```

    var x = "Niflare"

    document.write(x);

    document.write(x);

    ```


    Ps: There’s a better way to write less code to perform the same task, which we’ll
    learn soon.


    So, **words** are called Strings in programming language. Hope you remember it,
    we will use this name a lot.

    Strings are sequences of **alphanumeric** characters.

    **String values** are always written **with quotations** ("").


    # Storing Boolean Value


    In life, we’ve to make several decisions.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'But all of that comes down to two options, i.e. "yes" or "no", which in programming
    terms is referred to as **true** or **false**.

    This true or false is called **Boolean values**.

    A **Boolean** value is declared in the following way:


    ```

    var JS_sucks = false;

    ```


    Few points to keep in mind while creating a variable with a Boolean value:

    Boolean represents either **true** or **false**.

    Boolean is always defined **without quotations**.


    ```

    var JS_Rocks = true \boolean

    var JS_rocks = "true"&#92;&#92;\not a boolean

    ```


    If you remember, **double quotations** are used to declare *Strings*. Hence we
    don''t use double quotations while creating a variable with Boolean values.


    # Storing a number


    Let''s say want to store our age in a **variable** and print it.

    We would do this by first storing the age in a variable followed by printing it
    out.

    Let''s start by **creating a variable**.

    var age = 22 ;

    Mind you, **age** and **Age** will be two different variables because **JavaScript**
    is a **case-sensitive** language.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Few points to keep in mind while creating variable with number as a value:

    Numbers can be written with or without decimal.


    ```

    var without_decimal = 10

    var with_decimal = 11.07

    ```


    Numbers are always numeric values written without quotations ("") as we already
    know, only strings are written with quotations.


    # Basic math calculation


    Mathematics is such a subject which most of us have come across at least once
    in our life.

    Some of us hate; some of us have fallen for it.

    For those who hate it, don''t worry we''re not going to learn anything complex,
    instead we will focus on basics.


    # Addition and Subtraction


    Let''s say, if we want to increase the value of a variable by 1, we would do it
    the following way:


    ```

    var pizza = 1;

    pizza = pizza + 1;

    ```


    What If I tell you that there''s an easy way to perform the same thing plus it
    will save your energy on typing so much.

    This is where the concept of incrementation comes into play.

    Incrementation is nothing but increasing the value of a variable by 1.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The syntax for incrementation is the name of the variable and "++" followed
    by a semi-colon (;).

    Let’s rewrite the above program:


    ```

    var pizza = 1 ;

    pizzza++;

    ```


    Yes, that''s it!

    That''s how you increment a variable’s value by one.

    Similarly if we''ve to decrease a value of a variable by 1, we will do it the
    following way:


    ```

    var pizza = 2 ;

    pizzza--;

    ```


    Yes, you got it right!

    The syntax for decrementation is the name of the variable and "--" followed by
    a semi-colon.


    # Comparison


    We as human beings love to compare.

    Even in our daily life, we do lots of comparisons like

    “Is Blackberry better than Samsung?” and the list goes on.

    We also perform comparisons in programming.


    # Equal to'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'We use "==" to check if two values are equal or not, if the values are equal
    then the condition becomes true.

    Remember, there’s a difference between "=" and "==".

    "=" is used to declare variables like,


    ```

    var x = 2;

    var y = 4;

    ```


    Whereas,="=" is used to check the equality of the two values.


    ```

    x == y //false

    ```


    # Not Equal to


    And "!=" is to check if two values are unequal or not. If the values are not equal
    then the condition becomes true else it becomes false.


    ```

    x != y //true

    ```


    In a nutshell, the end result of all the comparisons, as we can see in the image
    comes down to either true or false.


    # Deep into into comparisons


    Let’s say, you want to buy a new mobile phone and for that you’ve two main requirements,

    One, the phone’s megapixel should be more than 10mp and phone’s memory should
    be more than 16 GB.

    Let’s write a program for the same using the concept of comparisons we learned
    just now.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '```

    var mp = 5 ;

    var gb = 16;

    ```


    Let mp be phone''s megapixels and gb be phone''s memory.

    So the condition would be:


    ```

    mp > 5 and gb >16

    ```


    Now these two conditions are independent of each other.

    What if we want an answer as yes or no when both the values are equal?

    I.e. how do we write "and " condition in programming?

    It''s really simple!

    The syntax is "&&".


    Let''s rewrite the above program:


    ```

    mp > 5 &&g b >16

    ```


    So, "&&" is added when there''s a situation where two or more conditions are meant
    to be true.

    Similarly, if we modify our needs to: phone''s megapixel should be more than 10mp
    or memory should be more than 16gb.


    ```

    mp > 5 || gb >16

    ```'
  merge: -1
  pgno: 16
- img_proc: true
  md: '“||” also known as "or". It is used when only one condition out of the many
    is to be true in order to proceed.


    Now that we know how to perform comparisons,

    Let’s go ahead and learn how to implement them in JavaScript.'
