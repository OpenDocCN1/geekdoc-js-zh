    # Numbers and Booleans


    Unlike other programming languages, JavaScript does not have different data types
    for integers and floating points.

    Numbers are categorized into **only one data type** which is **number**.

    Thus, **5** and **5.62** both have same type **number**.

    Just like every other **variable declaration**, numbers are also declared using
    the var keyword.

    For example:


    ```

    var height=5.62;

    var age=19;

    ```


    Here, var is the keyword, Height and age are the variable names, 5.62 and 19 are
    the respective values of the variables

    Both the variables height and age are of type **number**.

    Awesome, we know how to declare numbers in JavaScript.

    Let''s jump to the operations that can be carried out on these numbers.

    JavaScript has many built-in methods to do so. Let''s explore few of them.


    # Rounding off the numbers


