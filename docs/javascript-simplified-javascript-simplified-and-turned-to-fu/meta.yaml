  md: '# Making decision


    The importance of decision making in an individual''s daily life is massive.

    It requires making a definite choice between two or more alternative courses of
    actions that are available.


    You actively made the decision to learn JavaScript even after having so many other
    programming languages.

    Similarly, a computer has to perform different tasks based on different conditions.
    And guess what?

    We are the one who has the control over which task the computer should perform
    and on the basis of which conditions.

    Are you excited to help the computer in making decisions?

    Let''s check it out...


    # Conditional Statements


    In programming, conditional statements are used to perform different tasks based
    on different conditions.

    For example, “if it doesn''t rain, we''ll go for a drive and if it does, then
    we won''t” is a conditional statement.

    The conditional statement consists of if..else .


