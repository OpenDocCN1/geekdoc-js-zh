  md: '# Document Object Model (DOM)


    Can you draw your family tree on a paper?

    Starting from your forefather''s generation, then your grandfather''s generation,
    then your parents and you.

    Similarly, browser also creates a tree, but this tree consists of HTML elements,
    attributes, values, content and more.


    DOM or Document Object Model is the soul of web applications.

    It is a tree structure of objects created by the browser.

    This tree consists of elements, attributes, values, and content, basically everything
    that we have written in HTML.


    Thus HTML DOM outlines a standard using which we can add, delete, get or change
    the elements of HTML. Now we know that DOM enables us to manipulate the content
    or the HTML using JavaScript.


    Let''s see how this DOM actually looks like.

    Consider a basic HTML webpage with the following markup.


    ```

    <html>

    <head>

    </head>

    <body>

    <p>

    </p>

    </body>

    </html>

    ```'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'This is a simple HTML markup containing nothing but a sequence of elements.


    DOM is created when such a file is opened in the web browser.

    The outer nodes are the parent nodes and the enclosed ones are the children nodes.

    <html> is at the root, then <head> and <body> are its children.

    <p> becomes the child of <body>


    The topmost or root node is always the document node and it represents the web
    page.

    As the markup grows the DOM also grows and becomes more complex adding all the
    elements, attributes, values, content, etc.

    Before we can learn how to manipulate the web page using JavaScript or how to
    make changes in DOM, we should first find how to access the objects of the DOM.


    # Accessing Elements in DOM


    We learned that document is the root node.

    Thus to access any of the below nodes we first need to access the document node,
    always.

    There are three ways by which we can access the nodes.

    Let''s have a look at them


    There are three identifiers by which these nodes can be identified.


    +   1. Tag name - The name of the tag

    2. Class - The classes attached to the nodes/elements

    3. Id - The id assigned to the nodes/elements.


    So, we can access the elements:


    +   * by their name

    * by the classes attached to them

    * by the id assigned to them.


    There are certain methods which can be used to access the elements via the above
    identifiers.


    +   1. getTagName() - To find the elements using the tag name.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   2. getElementsByClassName() - To find the elements using the class assigned
