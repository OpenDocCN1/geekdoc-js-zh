    the browser creates a tree structure of objects which is known by the name of
    DOM or Document Object Model? To make changes in HTML, we have to make changes
    to the DOM and the changes made to the DOM are reflected on our webpage. All of
    that happens at a flick of a wand.


    But before we can learn **how to change the contents of HTML** , we should know
    **how to access the HTML** of our website through JavaScript.


    There are many ways to access the content of the HTML using JavaScript.


    # ## Using the tag name


    The **document** object which is nothing but our DOM provides a method to access
    the elements using their tag name.


