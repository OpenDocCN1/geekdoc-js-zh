  \n[content]\n我们的列表表现得就像每个项目都有自己的处理器一样！这很棒，但之前提到的“陷阱”是什么呢？事件委托之所以有效是因为事件冒泡（我们在第 5\
  \ 章的“事件传播”章节中查看过）——事件会一直向上冒泡，直到我们的父处理器捕获它们。如果某个处理器在父处理器之前捕获了事件并停止了事件传播（使用 `e.stopPropagation`\
  \ 或 `\"return false\"`），问题就会出现。如果事件在向上过程中被停止，事件委托就会失效！这就是为什么了解事件在底层是如何处理的至关重要——在处理那些原本难以理解的\
  \ bug 时，它将为你省去很多麻烦。\n\n我们已经用单个处理器处理了所有的点击事件，但现在我们需要进一步了解元素所在的位置。具体来说，我们如何找到元素属于哪个分类呢？是这样：\n\
  \n*(节录)*\n\n```\n$('#picker').click(function(e) {\n  var celebrity = $(e.target).text();\n\
  \  var category = $(e.target)\n    .closest('.category')\n    .find('.title')\n\
  \    .text();\n  $('#current').text(category + \" > \" + celebrity);\n});\n```\n\
  \n我们要求 `closest` 方法找到带有 `category` 类的最近元素。如果元素本身没有该 `class`，`closest` 将检查它的父元素……依此类推，直到找到匹配的元素。这使我们避免了编写一长串的\
  \ `parent().parent().parent()`，也让我们在构建 HTML 结构时更加灵活。\n\n## 表格\n\n如果 HTML 列表是新 Web\
  \ 的无名英雄，那么表格就是那个最终改邪良的“坏孩子”。表格本身从没有错——多年来，我们滥用并误用了它们，将其作为一种黑科技，以便以合理的跨浏览器方式布局我们的网页设计。但那是\
  \ CSS 的职责，而不是那些可怜的老旧表格。现在 CSS 已经成熟，我们终于可以回到仅将表格用于原始用途：显示表格数据。\n\nStarTrackr! 有大量数据要显示。多到它已经快失控了：表格变得过于巨大且不可读，信息没有分页或排序机制，无法轻松地编辑信息。我们在第\
  \ 2 章中看到为表格添加斑马纹和行高亮是多么简单；这会为我们带来一些快速的进展，但要解决更严重的表格问题，我们需要来自 jQuery 的额外帮助。\n\n###\
  \ 固定表头\n\n表格的表头行至关重要：没有它，你将面对行毫无意义的数据。但如果你正在处理大量的行，你会发现表头变得越来越没用，因为它们会滚出视线并被遗忘。数据分页通常可以解决这个问题——但如果你需要在一个页面上同时显示所有数据，你就必须考虑其他方案。\n\
  \n将表头行固定在表格顶部是跟踪列内容的有效方法，而且看起来非常酷！当用户滚动表格以显示新数据时，表头随之移动。你可以在图 8.5 中看到实际效果。\n\n![Fixed\
  \ header row](img/fig_lists_fixed_header.png)\n\n图 8.5. 固定表头行\n\n如果表格是页面上唯一的元素，可以使用\
  \ `position: fixed` 将 `thead` 元素固定在位置。然而，`position: fixed` 只能相对于视口定位元素，而不是它的容器元素。这意味着对于包含在其他元素中的表格（这几乎是必然的），我们需要求助于\
  \ jQuery。\n\n让我们看看如何实现这种效果。我们的标记与我们在第 2 章中添加过斑马纹的 celebrities 表相同：\n\n*chapter_08/06_fixed_table_headers/index.html\
  \ (节录)*\n\n```\n<table id=\"celebs\">\n  <thead>\n    <tr>\n      <th>Id</th>\n\
  \      <th>Name</th>\n      <th>Occupation</th>\n      <th>Approx. Location</th>\n\
  \      <th>Price</th>\n    </tr>\n  </thead>\n  <tbody>\n    …\n  </tbody>\n</table>\n\
  ```\n\n移动 `thead` 是很棘手的。有些浏览器允许你肆无顾忌地移动它，而在另一些浏览器中，它对样式的抵抗力异常地顽强。因此，我们将使用一个技巧：以无序列表的形式复制\
  \ `thead` 的内容，并将其样式设置为看起来与 `thead` 完全一致。然后给它设置 `position: absolute;`，并在用户滚动时在屏幕上移动它。\n\
  \n我们首先创建一个 `TABLE` 插件来存放我们的代码，并带有一个 `fixHeader` 方法，用于我们的固定表头效果。该方法期望接收一个指向页面上表格的选择器字符串。我们首先将几个选择存储在变量和\
  \ `data` 中，以加速后续代码执行：\n\n*chapter_08/06_fixed_table_headers/script.js (节录)*\n\n\
  ```\nvar TABLE = {};\n\nTABLE.fixHeader = function(table) {\n  // ... (此处代码截断)\n\
  ```\n（注：由于原文 JS 截断，此处仅翻译可见文本）\n\n我们通过 `each` 遍历它们，并存储 `table` 本身（`$table`）、`thead`（`$thead`）以及它包含的\
  \ `th` 集合（`$ths`）。最后我们存储 `$thead` 的左、顶部偏移，以及表格的底部位置（为了避免 header 移动）。\n\n\n\n现在我们的\
  \ `thead` 模拟元素已经就绪了，我们需要对滚动事件做出响应并对其进行适当定位：\n\n`chapter_08/06_fixed_table_headers/script.js\
  \ (excerpt)`\n\n```javascript\n$(window).scroll(function() {\n  setTimeout(function()\
  \ {\n    if ($table.data('top') < $(document).scrollTop() && \n    $(document).scrollTop()\
  \ < $table.data('bottom')) {\n      $list\n        .show()\n        .stop()\n  \
  \      .animate({\n          top: $(document).scrollTop(),\n          opacity: 1\n\
  \        });\n    } else {\n      $list.fadeOut(function() {\n        $(this).css({top:\
  \ $table.data('top')});\n      });\n    }\n  }, 100);\n}); \n```\n\n我们在 `scroll`\
  \ 事件触发后设置了 100 毫秒的超时；这个时间非常短，但足以确保我们在用户滚动时避免持续的动画执行。我们检查 `thead` 是否已经滚出了视口，但尚未超出表格底部；如果是这样，我们就显示模拟元素并将其动画到正确位置。如果我们滚回得足够高，使得原始\
  \ `thead` 可见，或者向下滚过了表格底部，我们就淡出伪造列表（并将其放回顶部，以便在它再次出现时从正确的位置开始动画）。\n\n大功告成了！我们现在可以调用\
  \ `TABLE.fixHeader(\"#celebs\")` 并滚动页面，新的“thead”就会随之移动，保持标识标签始终可见。\n\n### 重复表头\n\
  \n解决表头行消失问题的另一种方法是简单地每隔一段时间重复表头。如果目的是为了打印数据，那么这种方法特别好用——尽管我们的动画表格表头看起来很酷，但如果你需要对几十页打印出来的表格进行排序，它将毫无用处！目标是获取表格的第一行，并每隔（比如十行）复制一次。\n\
  \n结果如图图 8.6 所示。\n\n![Repeating 表头](img/fig_lists_repeat_header.png)\n\n图 8.6. 重复表头\n\
  \n复制表头行并将其放在其他地方对你来说现在应该是老练的了。但我们具体如何每隔十行添加一次表头呢？我们需要遍历每一行并检查其索引吗？嗯，我们可以这样做……但 jQuery\
  \ 再次凭借一个强大的内置过滤器为我们解了围：\n\n`chapter_08/07_repeating_table_header/script.js (excerpt)`\n\
  \n```javascript\n$('#celebs')\n  .find('tr:first')\n  .clone()\n  .insertAfter('#celebs\
  \ tr:nth-child(10n)');\n```\n\n这个解决方案初看起来非常简单——获取表格的第一行，然后使用 `clone` 方法对其进行克隆。接着是巧妙之处：`nth-child`\
  \ 选择器非常适合在我们想要的地方添加行。不过，你可能会对我们使用它的方式感到困惑，因为它的语法与我们见过的其他过滤器略有不同。在最基础，如果你给它一个简单的整数，它将选择该索引。例如，如果你选择\
  \ `:nth-child(2)`，你将得到第三个子元素。\n\n但 `:nth-child` 选择器也接受其他值，这使得它可以同时选择多行。如果你传入文本值\
  \ `even`（偶数）或 `odd`（奇数），将选择所有的偶数或奇数子元素。最酷的是，你可以给它一个方程来计算应该选择哪些子元素！\n\n你可以使用字母“n”表示重复；例如，`:nth-child(10n)`\
  \ 将选择每十行中的行。你可以通过加号或减号来偏移所选择的行。例如，如果你想选择第三行，然后之后每隔十行选择一个，可以使用 `:nth-child(10n+3)`。最后，如果你喜欢反向思考，可以使用\
  \ `:nth-child(10n-7)` 相同的结果。\n\n这些操作都运行得良好，但它确实存在一个 bug：如果表格的最后一行符合我们的方程，表头行将作为最后一行重复——这看起来有点奇怪。此外，我们还想将重复表头应用到几个表格上，并避免复制/粘贴代码。在下一章中，我们将学习如何通过插件使代码具有复用性——但现在，我们将保持简单，并坚持使用可靠的\
  \ widget 对象：\n\n`chapter_08/07_repeating_table_header/script.js (excerpt)`\n\n```javascript\n\
  var TABLE = {};\n\nTABLE.repeatHeader = function(table, every) {\n  $(table).each(function()\
  \ {\n    var $this = $(this);\n    var rowsLen = $this.find('tr:not(:first)').length;\n\
  \n    $(this).find('tr:first')\n      .clone()\n      .insertAfter($this.find('tr:nth-child('\
  \ + every + 'n)'));\n\n    if ((rowsLen) % every === 0) {\n      $this.find('tr:last').remove();\n\
  \    }\n  });\n}\n```\n\n我们创建了一个函数，它接受表格的选择器字符串，以及一个代表每次重复表头之间留出行数的数字。然后，我们遍历选择器找到的每个元素（这样我们的函数就可以应用于同一页面上的多个表格）。对于每个项目，我们设置了指向\
  \ `$(this)` 元素的快捷方式，并获取表格中的行数。预先存储行数是重要的，因为当我们重复表格表头时，行数将会发生变化！\n\n接下来是核心工作：我们复制第一行（像之前那样），并在每隔“n”行插入一次。这需要使用\
  \ `find` 操作进行稍微重写，以便它可以在选择器匹配的多个表格中的任何一个运行——但在其他方面与第一次尝试完全相同。代码的最后部分进行了一个小的数学计算，以判断我们是否将表头作为表格的最后一行；如果总行数能被重复器数字整除，我们需要删除最后一行。\n\
  \n### 数据网格\n\n“管理部分的这些更改太棒了，”我们的客户以一种‘大订单来临了’的语气说道，“但如果我们能替换掉营销经理使用的旧桌面应用程序就更太好了。它连接到同一个数据库，但允许她对数据进行排序、移动并编辑不同的单元格——所有都在一个页面上完成！但我想这不可能，对吧？”\n\
  \n当然，他对我们使用了老一套反向心理学，但这一招百百灵灵。“当然是可能的！”你笑着，看着他演示的那个过时的 Windows 应用程序，“事实上，我甚至做得更好——只需……”\n\
  \n“太棒了！”客户拍了拍你的背说，“等我们可以看它时告诉我。”他走走了——去参加他的另一个“业务会议”了。回想那个应用程序，你意识到，是的，你确实可以做得更好。你需要做的是我们将简单的表格转换为数据网格。\n\
  \n对于什么是数据网格并没有固定定义，但一些常见功能包括排序、过滤、搜索、分页、列缩放和行编辑。让我们来尝试一些分页和内联编辑。\n\n#### 分页\n\n\n\
  \n\n\n*chapter_08/08_pagination/index.html (excerpt)*\n\n```html\n<div class=\"\
  table-wrapper\">\n  <div class=\"wrapper-paging\">\n    <ul>\n      <li><a class=\"\
  paging-back\">&lt;</a></li>\n      <li><a class=\"paging-this\"><b>0</b> of <span>x</span></a></li>\n\
  \      <li><a class=\"paging-next\">&gt;</a></li>\n    </ul>\n  </div>\n  <div class=\"\
  wrapper-panel\">\n    <table id=\"celebs\">\n    …\n    </table>\n  </div>\n</div>\n\
  ```\n\n### Note：动态添加控制控件\n\n另一种方案是完全在 `jQuery` 中构建导航控制控件。这意味着你可以轻松地将其应用到任何 `table`\
  \ 中，并且 `controls`将能够`自动`添加。这种方法通常受到插件作者的青睐。\n\n你可以根据需要对控制控件进行样式化处理——但在 `CSS` 中隐藏控制控件容器，然后在页面加载时用\
  \ `jQuery` 将其显示，这是一个好主意。这样任何没有启用 JavaScript 的用户就可以避免看到冗余的控制控件。\n\n我们的组件骨架看起来如下：\n\
  \n*chapter_08/08_pagination/index.html (excerpt)*\n\n```javascript\nvar TABLE =\
  \ {};\nTABLE.paginate = function(table, pageLength) {\n  // 1\\. 设置分页信息\n  // 2\\\
  . 设置导航控件\n  // 3\\. 显示初始行\n  pagination = function (direction) {\n    reveal = function\
  \ (current) {\n      // 5\\. 显示正确的行\n    };\n    // 4\\. 移动上一页和下一页\n  }\n};\n```\n\
  \n看起来有很多内容要涵盖——但请放心，这些是你已经熟悉的知识。首先，我们获取想要分页的表格和行，并进行一些计算来确定将会有多少页：\n\n*chapter_08/08_pagination/script.js\
  \ (excerpt)*\n\n```javascript\n// 1\\. 设置分页信息\nvar $table = $(table);\nvar $rows\
  \ = $table.find('tbody > tr');\nvar numPages = Math.ceil($rows.length / pageLength)\
  \ - 1;\nvar current = 0;\n```\n\n现在我们必须配置导航控件。在这里我们的结构变得非常重要，因为我们从表格选择器向上爬到 DOM\
  \ 包装器 `div`，然后再向下找到导航部分。这种方法允许你将相同的代码应用到任何结构良好的表格上：\n\n*chapter_08/08_pagination/script.js\
  \ (excerpt)*\n\n```javascript\n// 2\\. 设置导航控件\nvar $nav = $table\n  .parents('.table-wrapper')\n\
  \  .find('.wrapper-paging ul');\nvar $back = $nav.find('li:first-child a');\nvar\
  \ $next = $nav.find('li:last-child a');\n```\n\n然后我们为显示当前页和总长度的显示框设置文本（加 1，因为我们的计数器是从\
  \ 0 开始的）。接下来，我们为“上一页/下一页”按钮绑定事件处理程序。当这些按钮被点击时，我们根据想要移动的 `direction` 调用 `pagination`\
  \ 函数：\n\n*chapter_08/08_pagination/script.js (excerpt)*\n\n```javascript\n$nav.find('a.paging-this\
  \ b').text(current + 1);\n$nav.find('a.paging-this span').text(numPages + 1);\n\
  $back\n  .addClass('paging-disabled')\n  .click(function() {\n    pagination('<');\n\
  \  });\n$next.click(function() {\n  pagination('>');\n});\n```\n\n设置的最后部分是限制用户初始看到的行数。实现此最简单的方法是隐藏所有表格行，并只显示我们感兴趣范围内的行。但我们如何用\
  \ `jQuery` 选择范围内的元素呢？我们可以使用 `:lt()` 和 `:gt()` 过滤器——但当需要显示（例如第 10 到第 20 行）时，选择器会变得有点混乱。幸运的是，我们有\
  \ `slice` 动作，它接受起始索引和结束索引作为参数，并只返回该范围内的对象：\n\n*chapter_08/08_pagination/script.js\
  \ (excerpt)*\n\n```javascript\n// 3\\. 显示初始行\n$rows\n  .hide()\n  .slice(0, pageLength)\n\
  \  .show();\n```\n\n现在一切看起来都正常：我们的导航控件显示了正确的页码和总数，第一页数据也显示正常。但我们的分页按钮目前还没有功能。我们将添加一些逻辑来移动当前页，并计算是否应该禁用按钮（如果我们在表格的末端）：\n\
  \n*chapter_08/08_pagination/script.js (excerpt)*\n\n```javascript\n// 4\\. 移动上一页和下一页\n\
  if (direction == \"<\") { // 上一页\n  if (current > 1) {\n    reveal(current -= 1);\n\
  \  }\n  else if (current == 1) {\n    reveal(current -= 1);\n    $back.addClass(\"\
  paging-disabled\");\n  }\n} else { // 下一页\n  if (current < numPages - 1) {\n   \
  \ reveal(current += 1);\n  }\n  else if (current == numPages - 1) {\n    reveal(current\
  \ += 1);\n  }\n}\n```\n我们通过调用 `reveal` 函数来更新 `current` 变量，而不是表格本身。我们通过调用 `reveal`\
  \ 函数来更新 `current` 变量，而不是表格本身。例如：\n\n*chapter_08/08_pagination/script.js (excerpt)*\n\
  \n```javascript\n// 5\\. 显示正确的行\nvar reveal = function (current) {\n  // ...\n}\n\
  ```\n\n### 嵌套函数\n\n我们在这里使用的结构有点奇怪——但想一想，我们在一个函数内部嵌套了另一个函数。为什么这是一个好主意？因为限制了 `scope`（作用域），所以它只能在父函数内部被调用。\n\
  \n#### 编辑行\n\n我们已经处理了单行的内联编辑，但如果你想让整个表格变得可编辑呢？我们将逐步添加编辑功能——这样可以让你的访问者更满意并再次回来！还有另一个收获：通过不在表格的\
  \ HTML 中不包含任何编辑控件，我们可以轻松地向其添加任意数量的行，依靠 `jQuery` 来完成繁重工作。\n\n我们将从一个设置方法开始，初始化表格并添加所需的按钮：\n\
  \n*chapter_08/09_editable_table_cells/script.js (excerpt)*\n\n```javascript\nTABLE.formwork\
  \ = function(table) {\n  var $tables = $(table);\n\n  $tables.each(function () {\n\
  \    var _table = $(this);\n    _table\n      .find('thead tr')\n      .append($('<th\
  \ class=\"edit\">&nbsp;</th>'));\n    _table\n      .find('tbody tr')\n      .append($('<td\
  \ class=\"edit\"><input type=\"button\" \n↵value=\"Edit\"/></td>'))\n  });\n\n \
  \ $tables.find('.edit :button').live('click', function(e) {\n    TABLE.editable(this);\n\
  \    e.preventDefault();\n  });\n}\n```\n\n看起来很正常，对吧？它应该是这样的，因为所有的编辑功能将逐步添加。让我们来看看如何使用它：\n\
  \n*chapter_08/09_editable_table_cells/index.html (excerpt)*\n\n```html\n<form action=\"\
  null\" method=\"post\">     \n  <table id=\"celebs\">\n    <thead>\n      <tr>\n\
  \        <th>ID</th>\n        <th>名称</th>\n        <th>职业</th>\n        <th>近似位置</th>\n\
  \        <th>价格</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n     \
  \   <td>203A</td>\n        <td>Johny Stardust</td>\n        <td>Front-man</td>\n\
  \        <td>Los Angeles</td>\n        <td>$39.95</td>\n      </tr>\n      …\n \
  \   </tbody>\n  </table>\n</form>\n```\n\n\n\n\n我们的 `TABLE.formwork` 方法会查找我们传入的选择器，然后查找\
  \ `thead` 和 `tbody` 中的行，并为每行添加一个额外的 `edit` 单元格。`thead` 单元格是空的，但它的目的是保留表格的列结构，而 `tbody`\
  \ 中添加的内容则包含一个将行切换到编辑模式的按钮。尽管我们在绑定 `click` 事件之前就已经知道按钮已经存在了，但通过 `live` 进行事件委托是未来的趋势。这就是为什么我们要使用它，以确保无论我们如何移动、删除或重新启用按钮，`click`\
  \ 处理器都能保持原位。\n\n这里需要记住的另一个点是，我们在 `each` 循环之外应用了 `live` 方法。通过在循环外部对 `$tables` 应用它，而不是在循环内部对\
  \ `_table` 应用它，我们确保了事件监听器只被添加一次。我们实现了完整的效果，但代码运行得更快。而且忍者们最爱快速代码！\n\n现在到了精彩部分。我们希望按钮在两种状态下工作——编辑模式和保存模式，并且我们希望除了包含按钮的单元格之外，所有单元格都变得可编辑。这是我们将采取的方法：\n\
  \n*chapter_08/09_editable_table_cells/script.js (excerpt)*\n\n```\nTABLE.editable\
  \ = function (button) {\n  var $button = $(button);\n  var $row = $button.parents('tbody\
  \ tr');\n  var $cells = $row.children('td').not('.edit');\n\n  if ($row.data('flag'))\
  \ { // 在编辑模式下，返回表格\n    // cell methods\n\n    $row.data('flag', false);\n    $button.text('Edit');\n\
  \  }\n  else { // 在表格模式下，进入编辑模式\n    // cell methods\n\n    $row.data('flag', true);\n\
  \    $button.text('Save');\n  }\n};\n```\n\n来自 `TABLE.formwork` 的实时 `click` 事件会传入我们想要编辑的某行的按钮，因此我们将用它来缓存对父行以及该行包含的其他单元格的引用。我们在\
  \ `$button` 对象上使用 `parents` 来找到行，并在 `$row` 上使用 `children`（通过 `not` 排除掉编辑单元格）来找到所有其他单元格。\n\
  \n在 `if` 语句中，我们设置了一个 `data` 标记来告诉我们行处于编辑模式，并更改按钮文本以反映这一点。剩下的就是切换单元格的内容。\n\n我们将按照反序查看代码，以便先展示简单的代码。我们需要做的事情中最简单部分是*退出*编辑模式：\n\
  \n*chapter_08/09_editable_table_cells/script.js (excerpt)*\n\n```\n$cells.each(function\
  \ () {\n  var _cell = $(this);        \n  _cell.html(_cell.find('input').val());\n\
  });\n```\n\n为了跳出编辑模式，我们获取 `_cell` 中 `input` 的 `val` 值，并将其作为 `_cell` 的 `html` 添加。由于我们需要多次引用该单元格（即使只有两次！），我们先将其保存在变量中以提高性能。\n\
  \n现在来看关于*进入*编辑模式所需的代码：\n\n*chapter_08/09_editable_table_cells/script.js (excerpt)*\n\
  \n```\n$cells.each(function () {\n  var _cell = $(this);        \n  _cell.data('text',_cell.html())\n\
  \    .html('');\n\n  var $input = $('<input type=\"text\" />')\n    .val(_cell.data('text'))\n\
  \    .width(_cell.width() - 16);\n\n  _cell.append($input);\n});\n```\n\n让单元格变得可编辑稍微复杂一点点。在添加\
  \ `input` 之前，我们需要清空当前单元格的内容，否则会破坏布局。不过，在清空每个单元格之前，我们将当前内容存储在 `data` 中，以便稍后使用。\n\n\
  我们将 `append` 一个创建的 `input`，正如我们所见，在将任何我们创建的内容添加到 DOM *之前*对其进行操作是非常重要的。`input` 的宽度设置得比单元格宽度窄，以避免任何布局损坏，并获取我们刚刚保存的数据作为输入元素的默认值。\n\
  \n尝试一下，你会对它运行得如此流畅感到印象深刻。打赌你现在开始觉得自己像个忍者了！\n\n### DataTables 插件\n\n我们已经开启了创建复用数据网格之路。从这里开始有无限的方法；表格可以按列排序，或者可以搜索——我们可以给它加上各种想象到的疯狂功能。但如果你时间紧迫，需要快速获得很多功能，你会想要研究现有的插件选项，例如\
  \ [DataTables 插件](http://www.datatables.net/index)。\n\nDataTables 是一个非常令人深刻的插件，可以将你的\
  \ HTML 表格转换为功能完备的数据网格，带有分页、列排序、搜索、ThemeRoller 支持、Ajax 加载等。一如既往，决定使用插件还是构建自定义功能取决于你有多少时间、需要多少功能，以及你愿意为访问者提供多大的文件。哦，还取决于你认为自己开发这些功能有多趣！\n\
  \n目前，我们能够添加所有这些功能。\n\n\n\n\n```\n$('#celebs ' + chkSelector).click(function(e) {\n\
  \  var $table = $(this).parents('table');\n  var lastRow = $table.data('lastRow');\n\
  \  var thisRow = $(this).parents('tr').index();\n\n  if (lastRow !== undefined &&\
  \ e.shiftKey) {\n    var numChecked = 0;\n    var start = lastRow < thisRow ? lastRow\
  \ : thisRow;\n    var end = lastRow > thisRow ? lastRow : thisRow;\n    $table\n\
  \      .find(chkSelector)\n      .slice(start, end)\n      .attr('checked', true);\n\
  \  }\n  $table.data('lastRow', thisRow);\n});\n```\n\n只有当存在 `lastRow` 值时（在第一次执行时它为\
  \ `undefined`，因为此时我们还没有在 `table` 上存储点击值），并且用户同时按住 `Shift` 键时，我们才会采取行动\n\n在获取了源行和目标行后，我们需要确定哪一行在表格中更靠下，以便确保起点在终点之前。然后，我们使用\
  \ jQuery 的 `slice` 方法来截取复选框选取。拿到新截取的 jQuery 选择集后，我们可以通过勾选选取中的所有剩余复选框来完成操作。现在，你可以用非常直观的方式轻松选择范围内的行了！\n\
  \n## 我们进入了顶级名单！\n\n我们彻底改造了 StarTrackr 的管理部分！从一个格式糟糕、数据混乱的团糟变成了一个可用的桌面风格应用程序——在此过程中，我们将原始数据转化为有用的信息。jQuery\
  \ 让我们能够轻松将标准 HTML 元素塑造成强大的应用程序级控件，这意味着响应式、震撼且易于访问的富互联网应用程序的圣杯已触手可及。\n\n在这个阶段真正值得注意的是，在核心\
  \ jQuery 库方面，我们用到的几乎所有函数在之前的阶段都遇到过。这无疑意味着我们对这个强大的工具有了深入的理解！现在你只需要开始尝试自己的想法了——自动寻找插件的时代应该已经过去了。尝试自己实现一个快速的概念验证，你会惊讶地发现获得所需的结果是简单。不久之后，你会发现你的代码和插件仓库中找到的代码一样好（甚至更好！）！\n\
  \n提到插件仓库——那是我们 jQuery 旅程的最后阶段之一。在下一章中，你将学习如何将构建的这些奇妙功能以插件的形式提供给全世界。我们还将涵盖其他几个高级主题，以完美完善你的\
  \ jQuery 忍者训练！\n\n# 第 9 章：插件、主题与高级主题\n\njQuery 就像国际象棋或任何版本的俄罗斯方块一样，易学但难精通。得益于它与文档对象模型（DOM）的无缝集成，jQuery\
  \ 感觉既自然又易于使用。但 jQuery 是一个低调的实干家：它不喜欢炫耀，但在底层隐藏着一个可扩展的架构、强大的事件处理系统和一个稳健的插件框架。\n\n\
  ## 插件\n\n“嘿，既然一切都准备就绪了——你能不能回过头把第三阶段的菜单放到管理部分？再顺便你把上一个阶段做的那些酷炫列表添加到前端的那些列表里——再加上你做的那个滚动效果……你只需要复制粘贴代码就行，对吧？”\n\
  \n啊，复制/粘贴：我们的好朋友也是头号敌人。当然，这看起来可能是让某个功能运行起来的快速方法——但我们都清楚，这种代码复用很容易演变成我们最糟糕的 JavaScript\
  \ 噩梦。我们不能让这种事情发生在我们美丽的 jQuery 创作上。\n\n你已经在整书中看到了 jQuery 插件架构是多么极其有用。我们已经利用了各种第三方作品——从可自定义样式的滚动条到随机图片库，再到表单字段的自动完成。好消息是，将你的代码打包成插件以便在其他项目中复用极其简单——而且，如果你的代码非常特别，也可以在其他开发者的项目中使用！\n\
  \n### 创建插件\n\n在你开始编写 jQuery 的生活不久后，你就会产生将某些代码转换为插件的冲动。没有什么比看到你自己的代码在 jQuery 链的中间被调用要更棒的事了！最棒的部分是，将现有的\
  \ jQuery 转换为插件的过程非常简单，你可以根据意愿进行任意程度的自定义。\n\n#### 设置\n\n在我们开始之前，我们需要为插件想一个想法。不久前，客户提到他想高亮页面上所有的文本段落，这样当用户把鼠标移过段落时，文本就会取消高亮，以表示已读。虽然你同意这并非最佳的用户界面主意，但它足够简单，可以演示如何制作插件，而无需集中在效果代码本身上。\n\
  \n为了让插件像普通的 jQuery 操作一样可以调用，我们只需要将函数附加到 jQuery 的 `prototype` 上。在 JavaScript 中，任何对象或内置数据类型的\
  \ `prototype` 属性都可以用于扩展新的方法或属性。对于我们的插件，我们将使用核心 `jQuery` 对象本身的 `prototype` 属性向其添加我们的新方法。\n\
  \n实现此操作最安全（唯一！）的方法为 `jQuery` 函数创建一个私有作用域。这个 JavaScript 技巧确保你的插件能够正常工作，即使在有人将 `$`\
  \ 函数用于非 jQuery 用途的页面上：\n\n```\n(function($) {\n  // 插件代码外壳\n})(jQuery);\n```\n\n\
  这段代码可以放在脚本的任何位置，但标准做法将其放在一个名为 `jquery.pluginname.js` 的独立 JavaScript 文件中并像包含任何插件一样包含它。现在你有了一个独立的文件，可以在未来的项目中轻松使用它，或与世界分享！\n\
  \n在这个保护外壳内部，我们可以无顾忌地使用 `$` 别名。准备工作仅此此——是时候开始编写插件了。首先我们需要给它命名为 `highlightOnce`，并将其附加到\
  \ jQuery 插件钩子 `$.fn` 上：\n\n*chapter_09/01_plugins/jquery.highlightonce.js (节选)*\n\
  \n```\n(function($) {\n  // 插件代码外壳\n  $.fn.highlightOnce = function() {\n    //\
  \ 插件代码\n  }\n})(jQuery);\n```\n\n在内部，`$.fn` 是 JavaScript 属性 `jQuery.prototype` 的快捷——它是放置插件的完美位置。这是\
  \ jQuery 放置其操作的地方，现在我们已经添加了自定义操作，就可以像调用内置于 jQuery 的方法一样调用它。\n\n到此时，我们的代码看起来像一个 jQuery\
  \ 插件，但它的行为并不像——还有一个最后一个任务要完成。如果我们现在在插件代码中执行某些操作，我们实际上是一次对整个选取集进行操作；例如，如果我们运行 `$('p').highlightOnce()`，我们将对每个段落元素作为一个单一选取集进行操作。我们需要的是一个一个地处理每个元素，并返回该元素，以便\
  \ jQuery 链继续执行。这是一个相当标准的插件结构：\n\n*chapter_09/01_plugins/jquery.highlightonce.js\
  \ (节选)*\n\n```\n// 插件代码\nreturn this.each(function() {\n  // 对每个项目执行某些操作\n});\n\
  ```\n\n所以你现在有了一个创建简单插件的良好骨架。保存这个大纲，这样你就可以随心创建新插件了！\n\n#### 添加插件功能\n\n我们的 `highlightOnce`\
  \ 插件已准备就绪，让我们给它安排一个任务吧。到目前为止添加的所有结构都只是脚手架——现在是时候盖房子了！我们在插件内部运行的代码类型与我们习惯编写的代码完全相同；我们可以使用\
  \ `$(this)` 结构访问当前对象，并执行任何需要的 jQuery 或 JavaScript 代码。\n\n\n\n\n\n我们的插件需要实现的第一个功能是高亮每个选中的元素，因此我们只需将背景设置为亮黄色。接下来，我们需要处理用户将鼠标悬停在元素上的情况，以便移除高亮。我们只希望此操作发生一次，即在元素淡出到原始颜色时触发（不要忘记，我们需要\
  \ jQuery UI Effects 组件来实现这一点）：\n\n`chapter_09/01_plugins/jquery.highlightonce.js`\
  \ (节录)\n\n```\n// Do something to each item\n$(this)\n  .data('original-color',\
  \ $(this).css('background-color'))\n  .css('background-color', '#fff47f')\n  .one('mouseenter',\
  \ function() {\n    $(this).animate({\n      'background-color': $(this).data('original-color')\n\
  \    }, 'fast');\n  });\n```\n\n恰好有一个 jQuery 动作完全符合我们的需求：`one` 动作。从功能上讲，`one` 动作与我们之前看到的\
  \ `bind` 动作相同，它们都允许我们为元素挂载事件处理器。`one` 的区别在于，该事件只会运行*一次*，之后就会自动取消解绑。\n\n对于我们的代码，我们将当前背景颜色保存在元素的\
  \ `data` 存储中，然后将 `mouseover` 事件绑定到选中的 DOM 元素上。当用户鼠标悬停在元素上时，我们的代码就会运行，背景颜色会动画回到原始颜色。这样，我们的插件就可以使用了：\n\
  \n`chapter_09/01_plugins/script.js` (节录)\n\n```\n$('p')\n  .hide()\n  .highlightOnce()\n\
  \  .slideDown();\n```\n\n这非常令人兴奋：我们的功能被封装在一个可链式、可复用的插件中，而我们将其嵌套在 `hide` 和 `slideDown`\
  \ 动作之间。看到只需要 11 行代码就能完成工作（而且其中 6 行是标准的插件脚手架！），你就会发现将任何你想要重用的功能封装成插件都是值得的！\n\n##\
  \ 添加选项\n\njQuery 插件是产生可复用代码的极佳方法，但为了真正有用，我们的插件需要在创建它们的上下文之外也适用：它们需要是*可定制的*。我们可以为插件添加用户指定的选项，这些选项随后可以在在使用插件时用于修改插件的行为。\n\
  \n我们从插件用户的角度对选项的工作原理非常熟悉，因为在本书中我们几乎为用过的每个插件传递了选项。选项让我们能够以细微或更显式的方式修改插件的功能，使其能够适用于我们想象的各种广泛情况。\n\
  \n插件选项有两种类型：简单值和对象字面量。让我们从较简单的开始开始，看看它是如何工作的。对于我们的 `highlightOnce` 插件来说，硬编码颜色似乎有很大的局限性。我们希望让开发者选择他们喜欢的任何颜色来高亮元素。让我们将其\
  \ true 一个选项：\n\n`chapter_09/02_plugin_options/jquery.highlightonce.js` (节录)\n\n\
  ```\n$.fn.highlightOnce = function(color) {  \n  …\n  $(this).css('background-color',\
  \ color  || '#fff47f')\n  …\n};\n```\n\n调用插件时可以带上颜色，也可以不带参数调用——在这种情况下，将使用默认值（得益于\
  \ JavaScript 的 `||` 运算符）。让我们用绿色高亮我们的段落：\n\n`chapter_09/02_plugin_options/script.js`\
  \ (节录)\n\n```\n$('p')\n  .hide()\n  .highlightOnce('green')\n  .slideDown();\n```\n\
  \n如果你有一两个两个始终需要的简单选项，那么这种方法是可以的。但当你的插件开始变得复杂时，你最终将会有大量的设置，你的用户会想要覆盖某些设置并对其他设置保留默认值。这时我们就转向更复杂的对象字面量表示法。\n\
  \n这并不可怕——你已经知道如何定义这种类型的设置对象了。我们已经在 `animate`、`css` 和大多数 jQuery UI 组件中用过它们。键值对象的优势处是只需要定义一个参数，用户可以在参数中指定多个设置。我们的第一步是为每个选项设置默认值：\n\
  \n`chapter_09/03_plugin_options_with_defaults/jquery.highlightonce.js` (节录)\n\n\
  ```\n$.fn.highlightOnce.defaults = {\n  color : '#fff47f',\n  duration : 'fast'\n\
  }; \n```\n\n我们现在拥有了对象形式的默认值，所以我们需要利用 jQuery 的 `$.extend` 函数。这个方便的函数有多种用途，但对于我们的目的，我们将用它通过添加另一个对象中的所有属性来扩展一个对象。这样，我们可以将用户传递的选项用我们的默认设置进行扩展：插件将为每个选项都有指定的值，如果用户指定了其中一个，默认值将被覆盖。完美！让我们看看代码：\n\
  \n`chapter_09/03_plugin_options_with_defaults/jquery.highlightonce.js` (节录)\n\n\
  ```\n$.fn.highlightOnce = function(options) {  \n  options = $.extend($.fn.highlightOnce.defaults,\
  \ options);\n\n  return this.each( … );\n};\n```\n\n我们的 `options` 变量内部包含了正确的设置——无论它们是由用户定义的，还是由默认对象定义的。现在我们可以在代码中使用这些设置：\n\
  \n`chapter_09/03_plugin_options_with_defaults/jquery.highlightonce.js` (节录)\n\n\
  ```\n$(this)\n  .data('original-color', $(this).css('background-color'))\n  .css('background-color',\
  \ options.color)\n  .one('mouseenter', function() {\n    $(this).animate({\n   \
  \   'background-color': $(this).data('original-color')\n    }, options.duration);\n\
  \  });\n```\n\n作为插件用户，我们可以指定高亮的颜色或持续时间——或者接受默认值。在下面的示例中，我们将接受默认颜色，但将持续时间覆盖为 2000\
  \ 毫秒而不是“fast”：\n\n`chapter_09/03_plugin_options_with_defaults/script.js` (节录)\n\n\
  ```\n$('p')\n  .hide()\n  .highlightOnce({color: '#C0FFEE', duration: 2000})\n \
  \ .slideDown();\n```\n\n## 添加回调\n\n你已经看到回调函数和事件可以非常有用。书中的许多效果和控制都依赖于它们——而且我们使用的许多插件都允许我们访问回调以自定义其功能。回调是一种机制，可以为你的插件用户提供一个地方，让他们根据插件内部发生的事件运行他们自己的代码。通常情况下，你对想要向用户暴露哪些事件会有相当大概的了解。例如，对于我们的\
  \ `highlightOnce` 插件，我们可能希望在设置效果时、效果结束时以及可能在淡出开始时运行额外的代码。\n\n为了演示，让我们尝试暴露一个 `setup`\
  \ 事件（在挂载 `mouseover` 处理器后运行）和一个 `complete` 事件（在最后一个 `animate` 动作结束后运行）：\n\n`chapter_09/04_plugin_callbacks/jquery.highlightonce.js`\
  \ (节录)\n\n```\n$.fn.highlightOnce.defaults = {\n  color : '#fff47f',\n  duration\
  \ : 'fast',\n  setup : null,\n  complete: null\n};\n```\n\n回调函数默认不应执行任何操作，所以我们将它们设置为\
  \ `null`。当需要运行回调时，有几种可能的方法。如果我们的回调需要在 jQuery 回调的地方运行，我们只需将用户传递的函数提供给 jQuery 动作。否则，我们需要在适当的位置手动调用该函数：\n\
  \n`chapter_09/04_plugin_callbacks/jquery.highlightonce.js` (节录)\n\n```\n$(this)\n\
  \  .data('original-color', $(this).css('background-color'))\n  .css('background-color',\
  \ options.color)\n  .one('mouseenter', function() {\n    $(this).animate(\n    \
  \  {'background-color': $(this).data('original-color')}, \n      options.duration,\n\
  \      options.complete \n    );\n  });\n\n  // Fire the setUp callback\n  $.isFunction(options.setup)\
  \ && options.setup.call(this);\n```\n\n\n\n\n\n上面我们看到了两种类型的回调函数。`complete` 回调处理器非常简单：当\
  \ `animate` 动作完成时，效果就会完成，由于 `animate` 动作本身接受一个回调函数，我们只需要将该函数传递过去。然而，`setup` 处理器就没那么幸运了——我们必须手动触发它。我们求助于\
  \ jQuery 和一些高级 JavaScript 来执行代码。首先，我们使用方便的 `$.isFunction` jQuery 动作来检查回调是否为函数，它会返回一个布尔值：如果回调是函数则返回\
  \ `true`，如果不是则返回 `false`。如果是后者（这很有可能是因为用户保留了默认值，在这种情况下它仍然是 `null`），那么尝试执行它就没有意义了！\n\
  \n### 提示：更多实用函数\n\n除了 `$.isFunction`，jQuery 还提供了以下函数：`$.isArray`（用于测试变量是否为数组）、`$.isPlainObject`（用于简单的\
  \ JavaScript 对象）以及 `$.isEmptyObject`（用于没有属性的对象）。这些函数为你提供了多种方法来确定 JavaScript 构造性质和属性。\n\
  \n如果回调*已经*被定义，我们需要运行它。运行 JavaScript 函数有多种方法，最简单的方法就是直接调用它：`options.setup()`。这将正常运行，但问题是它是在\
  \ `default` 对象的作用范围内调用的，而不是在事件目标元素的作用范围内（正如我们习惯的那样）。因此，回调函数将无法确定它正在处理哪个 DOM 元素。为了解决这个问题，我们使用\
  \ JavaScript 方法 `call`。传递给 `call` 的第一个参数将覆盖你调用方法中的 `this`。在我们的示例中，我们传递了 `this`，这就是我们需要的\
  \ DOM 元素。\n\n修正作用范围后，我们可以在 `complete` 事件处理器中使用 `$(this)`，在效果完成后让元素向上滑动：\n\n*chapter_09/04_plugin_callbacks/script.js\
  \ (节选)*\n\n```\n$('p')\n  .hide()\n  .highlightOnce({ \n    color: '#FFA86F',\n\
  \    complete: function() {\n      $(this).slideUp();\n    }\n  })\n  .slideDown();\n\
  ```\n\n### jQuery 风格的回调\n\n你可能注意到，jQuery 的回调似乎比我们插件的命名事件集成得更好。例如，在 `hide` 动作中，你可以将回调函数指定为第一个（也是唯一的）参数，或者你可以包含速度参数然后跟上回调函数。没有必要像我们上面那样包含一个键/值对。秘密是什么？事实证明这是一个小小的\
  \ JavaScript 技巧。如果你检测到第一个参数是函数而不是对象，你就可以假设只指定了回调，因此我们将参数向前移动。\n\n这是一个来自 jQuery 核心库的（截断）示例，属于\
  \ Ajax `load` 动作的一部分。`params` 参数是可选的，所以如果未提供它，则第二个参数被假设为回调：\n\n```\nload: function(\
  \ url, params, callback ){\n  // 如果第二个参数是函数\n  if ( jQuery.isFunction( params )\
  \ ){\n    // 我们假设它是回调\n    callback = params;\n    params = null;\n```\n\n`params`\
  \ 参数本应该是一个包含各种设置的对象。但如果我们检测到它实际上是一个函数，我们就把该函数赋值给 `callback` 变量并清空 `params` 变量。这是一个很的技巧，也是让你的插件感觉更像\
  \ jQuery 的好方法。\n\n让我们修改 `highlightOnce` 插件来使用这个回调检测技巧：\n\n*chapter_09/05_jquery_style_callbacks/jquery.highlightonce.js\
  \ (节选)*\n\n```\n$.fn.highlightOnce = function(options, callback) {\n  if ($.isFunction(options))\
  \ {\n    callback = options;\n    options = null;\n  }\n  options = $.extend($.fn.highlightOnce.defaults,options);\n\
  \n  return this.each(function() {\n    // 对每个项目执行某些操作\n    $(this)\n      .data('original-color',\
  \ $(this).css('background-color'))\n      .css('background-color', options.color)\n\
  \      .one('mouseenter', function() {\n        $(this).css('background-color',\
  \ '');\n        $.isFunction(callback) && callback();\n      });\n  });\n};\n```\n\
  \n## 高级主题\n\n最终，创建插件的兴奋感会消失一点，你开始好奇 jQuery 内部是否还隐藏着其他瑰宝。你的怀疑是正确的。除了我们刚刚探索的 fantastic\
  \ 插件架构外，jQuery 还提供了一种扩展和覆盖其核心功能的机制，以及一个灵活的事件系统，用于定义和微调你的组件如何响应用户以及其他组件。\n\n### 扩展\
  \ jQuery\n\n插件并不是 jQuery 代码复用和扩展的唯一机制；你还可以使用一个系统来添加插件式功能，并即时自定义和覆盖 jQuery 核心系统的元素。如果你有一段想要以原生\
  \ jQuery 方式执行的代码，你可以直接从脚本内部通过新功能来扩展 jQuery，而无需创建插件。通过这种方式，你可以微调代码以更符合 jQuery 的风格，并微调\
  \ jQuery 以适应你的精确需求。\n\n### 为 jQuery 添加方法\n\n有时，你编写的代码某些部分对你的应用程序是如此至关重要，以至于你发现自己在反复使用它们。当这种情况发生时，你可能发现了一个扩展\
  \ jQuery 的候选对象。`extend` 方法隐藏在 jQuery 核心库的插件部分，通常是插件开发者的领地。但不要让这阻止你！\n\n`jQuery.fn.extend()`\
  \ 或 `$.fn.extend()` 接受一个对象，允许我们提供一组新方法来*扩展* jQuery ——添加可以在 jQuery 选择器集上执行的新新动作。这与\
  \ `jQuery.extend()` 紧密相关，后者扩展的是 jQuery 对象本身。其最终结果与我们之前编写的插件完全相同。通常，当你有一组想要添加的小型相关方法，或者当你想要覆盖某些现有功能时（我们很快会看到这一点），你会使用\
  \ `extend` 方法。\n\n让我们看看我们已经创建的一些代码，看看它是如何使用 `extend` 演变的。在第 8 章 中，我们查看了列表排序：\n\n\
  ```\nvar SORTER = {};\nSORTER.sort = function(which) {\n  // 排序选定的列表 \n}\n```\n\n\
  像这样调用我们的小组件缺乏那种 jQuery 风格。因此，我们将使用 `extend` 将 `reverse` 方法转换以与 jQuery 更紧密地集成：\n\n\
  *chapter_09/06_extending_jquery/script.js (节选)*\n\n```\n$.fn.extend({\n  sorter:\
  \ function() {\n    return this.each(function() {\n      var sorted = $(this).children('li').sort(function(a,b)\
  \ {\n        // 找到列表项并对它们排序\n        return $(a).text().toLowerCase() > \n↵$(b).text().toLowerCase()\
  \ ? 1 : -1;\n      });\n      $(this).append(sorted);\n    });\n  }\n});\n```\n\n\
  在新的 `sorter` 和 `reverser` 方法内部，我们返回了针对原始示例中调用动作的选择集中的每个成员运行函数的结果。这种返回结构允许我们在链式中使用该动作：\n\
  \n*chapter_09/06_extending_jquery/script.js (节选)*\n\n```\n$('#ascending').click(function()\
  \ {\n  $('ul.sortable')\n  .hide()\n  .sorter()\n  .slideDown();    \n});\n```\n\
  \n与我们原始的 `SORTER` 组件最大的区别是，一旦 `extend` 就位，我们不再需要调用函数并传递参数；相反，我们将其视为普通的 jQuery 动作，就像我们把它封装成插件一样。当然，你可以获取这段代码并将其变成插件！像这样临时处理只是你可用的另一种选择。\n\
  \n### $. 前缀函数\n\n\n\n\n\n在书的开头，我们赞扬 `jQuery` 是一个非常一致的库：每当我们调用它时，都有一个选择器、一个动作，可能还有几个参数。一旦你学会了这个基本模式，基本上就是你需要记忆的所有内容了。然而，仅仅几段落之后，我们就悄悄插入了一些完全没有使用选择器的代码！从那时起，我们看到了几种这类动作：`$.ajax`、`$.map`、`$.slice`、`$.trim`\
  \ 等。\n\n带有 `$.` 前缀的函数并不作用于选择集；它们是通用的工具命令，可以出现在 jQuery 命令链之外的任何。例如，`$.map` 可以用于映射任何任意数组——但也可以用于修改\
  \ jQuery 选择集。\n\n客户很喜欢我们在 第 6 章 中开发的 Ajax Twitter 搜索组件，但希望为推文显示一个更符合人类阅读习惯的时间：例如，他不希望显示“56\
  \ 秒前”，而是希望它显示“大约 1 分钟前”。这看起来是添加到 jQuery 对象的一个很好的候选者，因为这种功能是你希望在选择集之外也能使用的。每当我们需要一个友好的时间段时，我们希望能够调用\
  \ `$.lapsed(time)` 并获得一个漂亮的字符串。\n\n为了开始工作，我们先跳过实际逻辑，看看函数的结构。它的骨架看起来与我们创建的插件非常相似——将\
  \ jQuery 对象传递给封装的函数——因此即使 `$` 别名被重新定义，我们的代码也能工作：\n\n*chapter_09/07_$_prefixed_functions/script.js\
  \ (节)*\n\n```\n(function($) {\n  $.lapsed = function(time) {\n    var then = new\
  \ Date(Date.parse(time));\n    var now = new Date();\n    var minutes = Math.round((now-then)\
  \ / 60000);\n    var lapsed;\n\n    // Determine pretty time\n    …    \n  };\n\
  })(jQuery);\n```\n\n现在，我们只需要将函数挂载到 jQuery 对象本身。由于我们正在扩展 jQuery，你必须小心，避免无意中覆盖任何内置函数名。我们用于确定“漂亮”时间的代码仅仅是一系列\
  \ `if`/`else` 结构。为了保持示例简单，我们的辅助函数只处理到“1 分钟前”——但你会想要扩展它以考虑更长跨度：\n\n*chapter_09/07_$_prefixed_functions/script.js\
  \ (节)*\n\n```\n// Determine pretty time\nif (minutes == 0) {\n  var seconds = Math.round((now\
  \ - then) / 1000);\n  if (seconds < 10) {\n    lapsed = \"less than 10 seconds ago\"\
  ;\n  } \n  else if (seconds < 20) {\n    lapsed = \"less than 20 seconds ago\";\n\
  \  }\n  else {\n    lapsed = \"half a minute ago\";\n  }\n}\nelse if (minutes ==\
  \ 1) {\n  var seconds = Math.round((now-then) / 1000); \n  if (seconds == 30) {\n\
  \    lapsed = \"half a minute ago\";\n  } else if (seconds < 60) {\n    lapsed =\
  \ \"less than a minute ago\";\n  } else {\n    lapsed = \"1 minute ago\";\n  }\n\
  } else {\n  lapsed = \"more than a minute ago\";\n}\nreturn lapsed;\n```\n\n要在我们的\
  \ jQuery 代码中使用此扩展，我们将一个时间戳传递给新的 `lapsed` 函数，并在我们需要的地方添加结果。我们的功能被整齐地封装起来，并准备好用于任何数量未来的项目：\n\
  \n*chapter_09/07_$_prefixed_functions/script.js (节)*\n\n```\n.append('<span class=\"\
  time\">' + $.lapsed(this.created_at) + \n↵'</span>')\n```\n\n### 覆盖现有功能\n\n通过 `$.fn.myPlugin`\
  \ 而不是通过 `$.extend({ myPlugin : … })` 添加插件的主要区别之一是，`extend` 机制是**增强**你正在扩展的元素，而不是完全替换它。这使得使用附加功能扩展\
  \ jQuery 本身（或现有插件）成为可能。除了像我们上面那样向 jQuery 添加新方法外，我们还可以扩展现有方法的功能！\n\n作为一个简单的例子，我们将扩展\
  \ `$.trim` 方法的功能。`$.trim` 接收字符串并移除任何开头或结尾的空格。我们将为该方法添加一个额外参数，如果该参数设置为 `true`，它将移除给定字符串中的所有空格：\n\
  \n*chapter_09/08_overwriting_existing_function/script.js (节)*\n\n```\n(function($)\
  \ {\n  var _trim = $.trim;\n  $.extend({\n    trim:function(text, clear) {\n   \
  \   if (clear) {\n        return text.replace(/\\s+/g,'');\n      }\n      return\
  \  _trim.call(this, text);\n    }\n  });\n})(jQuery);\n```\n\n首先，一如既往，我们为那些不想使用\
  \ `$` 作为 jQuery 的人保持礼貌（参见名为“插件` 的小节]）。接下来，我们将原始的 `trim` 函数存储在变量中，以便稍后访问它。最后，我们触及关键部分：扩展\
  \ `trim` 函数。我们版本的 `trim` 将接受一个额外的布尔值参数。如果设置了它，我们就运行自定义的正则表达式来移除所有空白字符；如果没有设置，我们就调用原始的\
  \ jQuery `trim` 函数。\n\n这样扩展代码在处理更复杂的对象时特别有用；例如，如果你需要修改 `$.ajax` 方法以对每个请求进行一些额外的处理。在情况下，你只想修改代码所需的特定部分，而留其他所有部分不变。通过存储原始函数并在需要时引用它，这变成了一项简单的任务。\n\
  \n### 创建你自己的选择器\n\n十个基础过滤器、四个内容过滤器、两个可见性过滤器、六个属性过滤器、四个子元素过滤器以及 14 个表单相关的过滤器。这不仅仅是一首糟糕的圣诞歌的素材：jQuery\
  \ 的内置过滤器允许你轻松选择页面上的几乎任何内容！但当我们想要页面上所有的广告单元，或者所有点击离开页面的链接，或者所有折线以下的突破项目时，我们该怎么办？\n\
  \n#### 注意：折线 (The Fold)\n\n在网页设计术语中，“折线以上（Above the fold）”指的是页面加载时无需滚动即可可见的区域。因此，“折线以下（below\
  \ the fold）”指的是下方的总区域，如果不滚动这些是不可见的。\n\n该术语源于报纸，报纸通常对对折以显示。因此，让标题或广告出现在折线以上被认为是是有利的，这样任何路过的人都能看到。特别是重要的报道会放置在这里，以吸引注意力并诱使人们购买报纸。\n\
  \n这些请求确实很奇怪，但让我们利用这个机会详细检查自定义过滤器；此外，在某些情况下，它们确实可以对你有利。\n\n与其寻找折线以下的元素，让我们转向更有用的目的：检测元素在页面加载时何时可见或是否在折线以上。如果元素在折线以上，我们可以直接通过\
  \ Ajax 加载其内容。如果不是，我们可以延迟 Ajax 请求到以后，从而节省带宽和页面加载时间：\n\n*chapter_09/09_custom_selectors/script.js\
  \ (节)*\n\n```\n$.extend($.expr[':'], {\n  abovethefold: function(el) { \n    return\
  \ $(el).offset().top < $(window).scrollTop() + \n↵$(window).height(); \n  }\n});\n\
  ```\n\n我们已经看过了几次 `$.extend` 了，所以访问选择器引擎应该非常熟悉。`$.expr[:]` 对象就是我们需要扩展的对象，以便添加我们的自定义过滤器。我们传递一个键/值对，其中键是我们的过滤器的名称，值是一个接收元素引用的函数。该函数应该返回\
  \ `true` 或 `false`。如果它返回 `true`，测试的元素 (`el`）将被添加到选择器中。否则，它将被过滤掉：\n\n*chapter_09/09_custom_selectors/script.js\
  \ (节)*\n\n```\n$('p:abovethefold').css('color', 'red');\n```\n\n如果我们在页面加载后测试我们新的\
  \ `:abovethefold` 过滤器，我们将看到只有无需滚动可见的段落将变为红色。\n\n\n\n\n\n选择器引擎的扩展性是 `jQuery` 中一个鲜为人知的特性，也是区分新手与大师的分水岭！\n\
  \n## 事件\n\n`jQuery` 的事件系统非常强大。它的主要目的是将所有浏览器事件规范化以匹配 W3C 标准，从而允许我们相对轻松地进行跨浏览器事件处理——但这仅仅是冰山一角。核心库中的内部事件系统投入了大量心血，这些功能也暴露给了那些希望不仅仅是对简单事件做出反应的开发者。\n\
  \n### 事件属性\n\n当你手里拿着一个标准化的事件时，你可以依靠标准所列出的特性。这到底意味着什么？`jQuery` 事件包装器提供了许多属性和事件供你玩耍，尽管这里太多，无法在此列出（完整列表请参见附录\
  \ A 中的“Events”章节]）。你已经在整书中看过了许多常用功能——`pageX` 和 `pageY` 属性，以及 `stopPropagation` 和\
  \ `preventDefault` 方法。但你分配的那些事件究竟存在于何处呢？一个卑道的 `<p>` 标签是如何知道在被点击时做出反应的？`jQuery` 为你提供了一种查看特定元素设置了做什么的方法，它通过使用键\
  \ `'events'` 下的 `data` 操作来存储事件。\n\n为了演示这一操作，我们设置了一个 `<p>` 标签并为其挂载了三个事件：两个独立的 `click`\
  \ 事件和一个 `mouseover` 事件。我们为这些函数命名了名称，以便在调试器中轻松地识别它们：\n\n*chapter_09/10_event_properties/script.js\
  \ (excerpt)*\n\n```\n$('p:first').click(function firstClick() { \n  // 第一次点击处理器\n\
  }) \n.click(function secondClick() {\n  // 第二次点击处理器 \n})\n.mouseover(function firstMouse()\
  \ { \n  // 第一次鼠标悬停处理器\n});\n```\n\n如果你在代码稍后的部分访问这些事件处理器的细节，只需在你的段落上调用 `.data('events')`\
  \ 即可：\n\n*chapter_09/10_event_properties/script.js (excerpt)*\n\n```javascript\n\
  var events = $('p:first').data('events');\nconsole.log(events);\n```\n\n`data('events')`\
  \ 调用返回返回一个对象，其中包含所有挂载到该段的事件引用。你可以在 Firebug 控制台中看到事件数据的输出（参见第 4 章中的“Troubleshooting\
  \ with console.log”章节]），位于图 9.1]。\n\n![在 Firebug 中检查 data('events’)](img/fig_plugins_event_console.png)\n\
  \n图 9.1. 在 Firebug 中检查 `data('events’)`\n\n事件数据包含了事件类型和事件处理器本身，嵌套在对象内部。\n\n### 自定义事件\n\
  \n我们之前看到 `bind` 和 `trigger` 为我们触发的事件执行了所有的实际工作；它们位于 `click`、`mouseover`、`toggle`……每一个事件的背后！简写操作使得代码更短、更易读，而扩展的\
  \ `bind` 和 `trigger` 语法提供了完全相同的功能。那么为什么要用 `bind` 和 `trigger` 呢？事实证明，它们比我们目前看到的要通用和强大得多。首先，我们可以摆脱浏览器指定的事件，开始创建我们自己的事件！\n\
  \n创建自己的事件有助于让代码更清晰；例如，一个埋在 `click` 处理器中的函数需要经过分析来确定其目的，而一个带有特定名称的事件可能一眼就更容易理解。让我们来看创建一个自定义的\
  \ `do-toggle` 事件。为了实现这一点，我们将回到在第 2 章]中看到的免责声明消息示例：\n\n*chapter_09/11_custom_events/index.html\
  \ (excerpt)*\n\n```html\n<p id=\"disclaimer\">\n  免责声明！此服务并非意图用于……\n</p>\n<input\
  \ type=\"button\" id=\"toggleButton\" value=\"toggle\" />\n```\n\n这一次，不再由按钮负责切换免责声明，而是由免责声明自己负责切换它自己：\n\
  \n*chapter_09/11_custom_events/script.js (excerpt)*\n\n```javascript\n$('#disclaimer').bind('do-toggle',\
  \ function() {\n  $(this).toggle('slow');\n});\n```\n\n我们将自定义的 `do-toggle` 事件绑定到了免责声明元素上。当\
  \ `do-toggle` 事件触发时，该函数将运行，免责声明将隐藏或显示自己。但我们如何触发 `do-toggle` 事件呢？通过 `trigger` 方法：\n\
  \n*chapter_09/11_custom_events/script.js (excerpt)*\n\n```javascript\n$('#toggleButton').click(function()\
  \ {\n  $('#disclaimer').trigger('do-toggle');\n})\n```\n\n当按钮被点击时，免责声明就会被切换。与仅仅使用切换按钮进行隐藏和显示相比，这似乎绕了远路，但现在我们完成了两个重要任务：我们将代码责任转移到了元素本身，并赋予了自己从任何其他地方触发事件的能力。无论我们想通过切换按钮切换免责声明，还是通过屏幕顶部的的小图标切换，都不需要复制代码——我们只需要在任何喜欢的地方触发\
  \ `do-toggle` 事件即可。\n\n但等，还有更多！`bind`/`trigger` 系统还允许你在触发事件时附加参数。每个触发元素都可以传递不同的数据，因此事件处理器可以自定义其响应。这使得自定义事件非常强大；你现在可以创建可以被页面上多个其他元素优雅控制的小部件，这样就可以干净地分离和隔离页面行为，并让你的代码更具重用性。\n\
  \n例如，我们将为[第 3 章中的“Bouncy Content Panes”章节]中的动画内容面板提供一种替代触发机制。在这个示例中，我们制作了看起来酷的内容面板，显示名人传记，它们在点击标题时会弹开和关闭。为了清晰起见，在这里省略了弹性效果，因此当用户点击传记标题时，面板将立即切换。\n\
  \n然而，面板上方还有一个 `select` 框。当列表中选择一个名人时，传记将以相同的方式进行切换；同一个事件处理器会被触发，这一次我们将有一个滑动效果。我们的\
  \ `select` 框触发器包含用户可以查看的传记列表。稍后，我们将为它挂载一个 `change` 事件处理器来触发滑动效果：\n\n*chapter_09/12_custom_events_with_params/index.html\
  \ (excerpt)*\n\n```html\n<select id=\"chooser\">\n  <option>Beau Dandy</option>\n\
  \  <option>Johny Startdust</option>\n  <option>Glendatronix</option>\n</select>\n\
  ```\n\n这里是重要部分。我们将自定义的 `reveal` 事件绑定到所有传记标题上。代码将接受一个额外的参数，我们将用它来决定如何显示传记。如果 `effect`\
  \ 参数设置为 `ease`，我们将执行 `slideToggle`，否则用户将看到标准的非滑动切换：\n\n*chapter_09/12_custom_events_with_params/script.js\
  \ (excerpt)*\n\n```javascript\n$('#bio h3').bind('reveal', function(e, effect) {\n\
  \  if (effect == 'ease') {\n    $(this).next().slideToggle();\n  } else {\n    $(this).next().toggle();\n\
  \  }\n})\n.click(function() {\n  // 触发 1：普通切换\n  $(this).trigger('reveal');\n});\n\
  ```\n\n由于我们的第一个触发不需要任何效果，我们不在 `trigger` 调用中添加任何参数。当 `bind` 代码运行时，它没有找到 `effect`\
  \ 参数，因此执行常规切换：\n\n*chapter_09/12_custom_events_with_params/script.js (excerpt)*\n\
  \n```javascript\n$('#chooser')\n  .change(function() {\n    // 触发 2：滑动切换\n    $('#bio\
  \ h3:contains(' + $(this).val() + ')')\n      .trigger('reveal', 'ease');\n  });\n\
  ```\n\n\n\n\n\n当用户更改 `select` 列表中的当前选择时，我们会找到正确的内容面板并再次触发 `reveal` 事件。但这次我们添加了 `'ease'`\
  \ 参数，这样用户就能体验到华丽的滑动效果。\n\n向自定义事件中添加数据是封装组件代码的一种极佳方法，并暴露一个让其他开发者可以使用来自定义你功能的接口。若要向\
  \ `bind` 函数传递多个项目项，你需要将 `trigger` 的参数封装在一个数组中：\n\n`chapter_09/12_custom_events_with_params/script.js`\
  \ (节)\n\n```\n$('#bio h3:contains(' + $(this).val() + ')')\n  .trigger('reveal',\
  \ ['ease',2000]);\n```\n\n## 解绑与命名空间 (Unbinding and Namespacing)\n\njQuery 只需少量操作就能创建出惊人的效果：我们的大多数控件使用的操作不超过几个，而且\
  \ JavaScript 代码也非常少。当你开始扩展你的控件和效果——将它们转换为插件，并结合使用多个控件来制作更大、更酷的控件时——你会发现你的事件开始变得有些难以管理。处理器被绑定后从不移除，即使在效果结束后也是如此，这可能会与你之后尝试添加任何新行为发生冲突。我们并不能一直依赖目前为止使用的“设置后忽略”的方法。\n\
  \njQuery 库为我们提供了两种处理此问题的机制：`事件解绑 (event unbinding)` 和 `事件命名空间 (event namespacing)`。事件解绑允许我们从对象中移除事件处理器，而事件命名空间提供了一种方法，将事件处理器划分为逻辑组，可以在不影响其他事件的情况下解绑。这在我们开发插件时特别有用。\n\
  \n事件解绑非常简单：我们使用 `bind` 操作向对象添加事件，因此我们使用 `unbind` 操作来移除它们！我们有三种方式使用 `unbind`：从选择集中移除对象的所有事件、从选择集中移除特定类型的所有事件，或者移除一个特定的事件处理器。这里是第一种形式：\n\
  \n```\n$('p').unbind();\n```\n\n这将移除与页面上所有段落关联的所有事件处理器。这有点极端——更常见的情况下，我们只想移除特定类型的事件。例如，要移除所有的\
  \ `mouseover` 事件，我们将事件类型传递到 `unbind` 操作中：\n\n```\n$('p').unbind('mouseover');\n\
  ```\n\n最后，为了解绑单个事件处理器，我们传递想要 `unbind` 的函数。这稍微要复杂一点，因为我们需要在绑定时为该函数命名。在我们的示例中，我们为\
  \ `click` 事件 `bind` 了两个函数。然后我们 `unbind` 其中一个事件：\n\n`chapter_09/13_event_unbinding/script.js`\
  \ (节)\n\n```\nvar doToggle = function() { $(this).toggle(); };\nvar doSlide = function()\
  \ { $(this).slideToggle(); };\n\n$('p')\n  .click(doToggle)\n  .click(doSlide);\n\
  \n$('p').unbind('click', doToggle);\n```\n\n得益于我们的 `unbind` 调用，后续对段落标签的任何点击仍会触发\
  \ `doSlide` 方法，但不再会触发 `doToggle` 方法。\n\n### 注意：简写解绑？\n\n你也可以使用简写的 `click` 和 `mouseover`\
  \ 方法来绑定事件，那么是否存在对应的 `unclick` 和 `unmouseover` 简写方法呢？没有。这些方法在很久以前的 jQuery 中存在过，但它们被删除了，因为它们让核心\
  \ API 变得庞大很多，而且极少需要。\n\n尽管所有解绑选项看起来很详尽，但它们无法涵盖所有情况。当你进行大量的绑定和解绑时，很容易忘记当前发生了什么——因此\
  \ jQuery 提供了一种种通过事件命名空间将相关事件组合在一起的方法。命名空间事件可以独立于同类型的其他事件被触发，并且同一命名空间中的所有事件可以通过一个命令解绑。\n\
  \n要定义命名空间，你可以在要绑定处理器的事件后附加一个点（`.`）和你的命名空间名称。在不进行任何进一步操作的情况下，该事件将像普通的非命名空间事件一样工作；但你现在有了一个句柄，可以更精确地指定哪些事件被触发，而无需维护每个事件函数的引用（正如我们上面所的那样）：\n\
  \n`chapter_09/14_event_namespacing/script.js` (节)\n\n```\n$('p').bind('mouseover.colorize',\
  \ function() {\n  $(this).css('background-color', 'lemonchiffon') \n})\n.bind('mouseout.colorize',\
  \ function() { \n  $(this).css('background-color', '');\n}) \n.click(function()\
  \ {\n  $(this)\n    .trigger('mouseout.colorize')\n    .unbind('.colorize');\n});\n\
  ```\n\n在这个示例中，我们为页面上的每个段落绑定了普通的 `mouseover` 和 `mouseout` 事件处理器。这在用户鼠标移动过元素时创建了一个简单且令人信服的高亮效果。但这个高亮还有一个额外的技巧：当用户点击元素时，高亮将被移除。\n\
  \n当 `click` 发生时，用户正悬停在元素上；如果我们移除了处理器，`mouseout` 代码将永远不会运行，元素将保持高亮。为了解决这个问题，我们手动触发\
  \ `mouseout`。因为我们对事件进行了命名，所以我们可以指定只运行与我们的效果相关的 `mouseout` 代码。任何其他 `mouseout` 处理器将保持休眠。\n\
  \n当元素取消高亮，我们可以通过一个 `unbind` 命令移除效果命名空间中的所有事件处理器。我们通过仅传递 `'.colorize'` 作为参数来定位命名空间。\n\
  \n在创建插件时，命名空间特别有用。你现在有一种简单的方法来控制插件添加到 DOM 中的所有事件，而无需担心用户（或其他插件）可能也绑定了什么。当需要拆卸一切时，你可以通过简单的\
  \ `unbind` 进行清理。\n\n如果你只想触发非命名空间的事件，可以在 `trigger` 参数末尾添加一个感叹号（`!`）。如果我们想运行我们（或任何其他）命名空间之外的\
  \ `mouseover` 事件，我们将执行：`$('p').trigger('mouseout!')`。\n\n### 提示：多个命名空间\n\n你不局限于玩单个命名空间：如果你需要在语句中针对多个命名空间，只需用点将它们连接起来。\n\
  \n#### 绑定 iPhone：非标准事件\n\n仿佛 jQuery 事件系统还没有证明自己已经非常出色似的，它还有另一个杀手锏：它可以响应它本不应该感知的事件！随着我们开始不再将\
  \ PC 作为访问 Web 的主要工具，这种能力将变得更加重要。未来，人们查看你页面的设备数量和类型将爆炸式增长：iPhone、其他手机手机、PSP、Chumbys、“下一个大器物”等等。虽然它们中的大多数都会尊重\
  \ DOM，但它们都会尝试添加自己的东西来改进人机交互。\n\n这意味着我们有新的硬件触发的事件要处理。iPhone 的触摸界面就是一个很好的例子。尽管 iPhone\
  \ 可以响应 `mousedown` 和 `mouseup` 事件，但还有其他更优的事件可以使用。有一系列特定的事件用于处理与触摸屏的交互，这些事件在大多数其他设备上并没有意义。虽然\
  \ jQuery 没有直接访问这些事件（如果它必须支持每个设备的事件，它将成为一个巨大的库！），但 `bind` 方法足够通用，可以捕捉任何触发的事件：\n\n\
  ```\n$(document).bind('touchstart', function(e) {\n  var original = e.originalEvent;\n\
  \n  var x = original.changedTouches[0].pageX;\n  var y = original.changedTouches[0].pageY;\n\
  \n  $('#block').css({top: y, left: x});\n});\n```\n\n\n\n\n触摸事件是由第三方定义的，但只要我们能够获取这些事件的文档（或者可以使用\
  \ `Firebug` 或其他调试工具收集自己的数据），我们就可以轻松地捕捉并响应。在我们的示例中，我们正在捕获当用户触摸屏幕时触发的 `touchstart`\
  \ 事件。\n\n由于 `jQuery` 并不认识 `touchstart`，因此我们需要从传递给回调函数的 jQuery 事件对象中访问 `originalEvent`。`originalEvent`\
  \ 让我们能够访问未经过封装的 JavaScript 事件，它不包含 jQuery 的任何添加或扩展。现在我们可以完全按照文档描述的方式来使用该事件了。我们正在获取屏幕触摸的\
  \ X 和 Y 坐标，并在触摸位置更新一个绝对定位的块级元素。\n\n### 提示：禁用 `mousedown` 和 `mouseup`\n\n如果你正在为 iPhone\
  \ 编写处理器，你可能需要禁用 `mousedown` 和 `mouseup` 的默认操作。你可以通过在 `$(document)` 上捕获它们，并使用 `event.preventDefault`\
  \ 操作来实现这一点。否则，你将面临运行两次代码的风险，因为你会同时触发触摸事件和鼠标事件。\n\n### `special` 事件\n\n创建自己的自定义事件无疑是非常高级的操作——但\
  \ jQuery 的 `special` 事件构造简直就像“忍者”一样。如果你觉得被旧的普通 DOM 事件所束缚，那么这正是为你准备的！使用 `special`\
  \ 是创建你自己的类原生事件，或者覆盖并增强现有事件的一种方法。你可以在每次绑定处理器时执行一些自定义代码处理，也可以在移除事件时（发生在 `beforeUnload`\
  \ 阶段）执行处理。`special` 事件是 jQuery 的一个一等公民。\n\n`click` 事件在用户点击某些内容时触发，`load` 事件在元素加载完成时触发……现在我们将创建一个在用户多次鼠标悬停（hover）在一个元素上时触发的事件。默认情况下，当一个元素接收到三次鼠标悬停（mouseover）时，绑定的事件处理器就会运行，但我们将看到如何针对每个元素进行此类定制。与普通事件一样，在事件处理器中执行什么代码由你来指定。\n\
  \n要创建一个特殊事件，你需要将一个 JavaScript 对象挂载到 `$.event.special` 命名空间。事件系统提供了四个钩子（hooks）让你定义事件的工作方式。`setup`\
  \ 函数在事件首次绑定时运行，`add` 函数在每次绑定时运行，`remove` 函数在取消绑定时运行，而 `teardown` 函数在最后一个事件取消绑定时运行（即当不再有此类类型的事件绑定到处理器上时）。\n\
  \n让我们查看 `multihover` 事件的骨架：\n\n*chapter_09/15_special_event/script.js (excerpt)*\n\
  \n```\njQuery.event.special.multihover = {\n  setup: function(data, namespaces)\
  \ {\n    // 在第一次绑定事件时执行\n  },\n  add: function(handler, data, namespaces) {\n  \
  \  // 每次绑定另一个事件时执行\n  },\n  remove: function(namespaces) {\n    // 在取消绑定事件时执行\n\
  \  },\n  teardown: function(namespaces) {\n    // 在最后一个事件取消绑定时执行\n  },\n  handler:\
  \ function(e) {\n    // 执行你的逻辑\n  }\n}\n```\n\n一旦你创建了该事件，就可以就可以像绑定任何事件一样来绑定它。显然，没有绑定自定义事件的快捷方法，因此你必须使用\
  \ `bind` 方法将其挂载到页面元素上：\n\n*chapter_09/15_special_event/script.js (excerpt)*\n\n\
  ```\n$('p').bind('multihover', {times: 4}, function() {\n  $(this).css('background-color',\
  \ 'lemonchiffon');\n});\n```\n\n我们将新的 `multihover` 事件绑定到了页面上所有的段落上，并指定了在事件触发之前我们希望在元素上悬停的次数。我们在“自定义事件”章节]中看到过，你可以通过\
  \ `trigger` 方法向事件传递数据，但现在我们学到，在绑定事件时也可以指定要传递给事件的数据！\n\n我们的 `special` 事件将不会使用 `add`\
  \ 或 `remove` 钩子，因为我们只允许每个元素挂载一个 `multihover` 事件。在 `setup` 钩子，我们将使用 `data` 操作在元素本身上存储所需的悬停次数。在用户未指定值的情况下，我们将默认设为\
  \ `3`。接下来，我们将自定义事件处理器（我们称之为 `jQuery.event.special.handler`）绑定到 `mouseover` 事件，因为我们需要在那里执行逻辑来判断第三次悬停何时发生：\n\
  \n*chapter_09/15_special_event/script.js (excerpt)*\n\n```\nsetup: function(data,\
  \ namespaces) {\n  $(this)\n    .data('times', data && data.times || 3)\n    .bind('mouseover',\
  \ jQuery.event.special.multihover.handler);\n},\n…\nteardown: function(namespaces)\
  \ {\n  $(this)\n    .removeData('times')\n    .unbind('mouseover', jQuery.event.special.multihover.handler);\n\
  ```\n\n### 提示：`data` 参数\n\n`bind` 方法上的 `data` 参数并不特定于 `special` 事件。它在你的任何事件上工作原理完全相同，所以请利用它！\n\
  \n我们还在相应的 `teardown` 处理器中撤销所有这些设置。在这里，我们移除了添加的 `data` 项，并 `unbind` 了 `mouseover`\
  \ 绑定。这清理了一切。现在我们有一个新事件，每当发生 `mouseover` 事件时都会调用我们的自定义处理器，所以让我们来实现 `multihover` 逻辑吧：\n\
  \n*chapter_09/15_special_event/script.js (excerpt)*\n\n```\nhandler: function(e)\
  \ {\n  // 执行你的逻辑\n  var times = $(this).data('times') || 0;\n  times--;\n  $(this).data('times',\
  \ times);\n\n  if (times <= 0) {\n    e.type = 'multihover';\n    jQuery.event.handle.apply(this,arguments);\n\
  \n    $(this).unbind('multihover');\n  }\n}\n```\n\n这是该功能的核心。我们将其分离成单独函数是为了保持清晰——我们完全可以用匿名函数来处理它。\n\
  \n`multihover` 逻辑首先从 `times` 数据项中减 1。当它达到 0 时（意味着所有悬停都已完成），我们修改事件属性 `type` 并将其设置为\
  \ `multihover`，然后调用内部的 `handle` 函数。这将导致用户指定的任何已绑定回调被执行，就像原生事件一样。\n\n`special` 事件是封装自定义事件的美妙方式，可以在你的整个项目中复用。除了创建新功能（如我们的\
  \ `multihover` 事件）之外，你还可以重新定义现有事件；例如，你可以通过向 `$.event.special.click` 提供适当的钩子来覆盖内部的\
  \ `click` 事件。创建 `special` 事件是一个相对少见的需求——但当你确实需要它们时，你会发现它们是 jQuery 的杀手级高级功能。\n\n\
  ## jQuery 忍者的杂谈\n\n即使我们已经探索了 jQuery 中提供的完整系统和框架，库中仍然散布着无数宝藏供你利用。其中一些是文档完备的函数，可能非常具体；另一些是更晦涩的高级主题。\n\
  \n### 避免冲突\n\n正如我们提到的，我们在编写代码时使用的 `$` 和 `jQuery` 对象及方法都是命名空间，就像我们自己创建的那些一样。`jQuery`\
  \ 作为命名空间，在唯一性和清晰度方面得分很高，而且也很短。\n\n虽然美元符号在简短性上确实得了分，但在唯一性方面却大失分。如果另一个开发者覆盖了我们假设为\
  \ `$` 的内容，这种缺乏唯一性的情况可能会引起关注。例如，Prototype.js 使用 `$()` 作为 JavaScript 的 `getElementById`\
  \ 方法的简写，如果我们不粗心，这种命名空间冲突可能是灾难性的。为了应对这种情况发生，jQuery 给了我们访问 `noConflict` 的权限：\n\n```\n\
  jQuery.noConflict();\n```\n\n在最基本的情况下，这意味着 jQuery 将放弃对 `$` 命名空间的任何权利，但仍然响应 `jQuery`\
  \ 命名空间。\n\n\n\n\n```\njQuery.noConflict();\n// 使用 jQuery 执行某些操作\njQuery(\"div p\"\
  ).hide();\n// 使用另一个库的 $() 执行操作\n$(\"content\").style.display = 'none';\n```\n\n\
  这意味着你必须移除代码中任何对 `$` 的引用，将其替换为 `jQuery`，坦率地说，这可能是不可行的。但有一种方法可以减轻这一工作量：\n\n```javascript\n\
  jQuery.noConflict();\n(function($) { \n  $(function() {\n    // 使用 $ 作为 jQuery 的别名的更多的代码\n\
  \  });\n})(jQuery);\n// 使用 $ 作为另一个库的别名的其他代码\n```\n\n通过将所有的 jQuery 命令封装在一个匿名函数中，并传入\
  \ `jQuery` 和 `$` 的引用，我们创建了一个保护内部 jQuery 方法和属性的壳。我们还有另一个选项可供选择：我们可以采用的进阶技巧是将 `noConflict`\
  \ 的返回值赋值给一个变量，并使用该变量来代替 `jQuery` 或 `$`。在这种情况下，我们选择使用 `trkr` 作为 jQuery 的别名：\n\n```javascript\n\
  var trkr = jQuery.noConflict();\n// 使用 jQuery 执行某些操作\ntrkr (\"div p\").hide();\n\
  // 使用另一个库的 $() 执行操作\n$(\"content\").style.display = 'none';\n```\n\n我们还有另外一个可以使用的过程，那就是将\
  \ `noConflict` 赋值一个新的命名空间：\n\n```javascript\nvar trkr = {};\ntrkr.$ = jQuery.noConflict(true);\n\
  ```\n\n在所有这些选项中，你一定能找到适合你需求的解决方案！\n\n### 动画的入队与出队 (Queuing and Dequeuing Animations)\n\
  \n尽管你有大量的动画选项，但有时它们无法满足你的需求；你可能希望动画暂停，或者可能在动画到达某个特定点时让动画之外的元素做出反应。动画序列中有很多有趣的时刻，如果能够利用它们就太棒了。通过\
  \ `queue` 你可以做到！\n\n通常情况下，我们在选择集上链式的操作是异步的，它们或或少地同时发生：\n\n`chapter_09/16_queue_dequeue_animations/script.js`\
  \ (片段)\n\n```javascript\n$('#button1').click(function() {\n  $(this).animate({\n\
  \    height: 200,\n    width: 200\n  }, 'slow').text(\"rollin'\");\n});\n```\n\n\
  当你点击该按钮时，它会缓慢增长到 200x200 像素，但文本会几乎立即更新。当我们使用 `animate` 操作时，它会为元素添加一个 `fx` 栈，我们添加的任何动画都将进入该栈。然而，`text`\
  \ 操作由于专注于动画，会忽略 `fx` 栈，而 `queue` 则遵循该栈：\n\n`chapter_09/16_queue_dequeue_animations/script.js`\
  \ (片段)\n\n```javascript\n$('#button2').click(function() {\n  $(this).animate({\n\
  \    height: 200,\n    width: 200\n  }, 'slow').queue(function() {\n    $(this).text('rolled!');\n\
  \  }).text(\"rollin'\");\n});\n```\n\n现在 `animate` 和 `text` 操作同时发生，但 `queue` 也会在动画结束后更改文本。而且它并不会于此……或者更准确地说，它确实停止了！如果我们在链中再添加另一个\
  \ `animate` 操作，`queue` 将持有 `fx` 栈并阻止链式操作继续进行：\n\n`chapter_09/16_queue_dequeue_animations/script.js`\
  \ (片段)\n\n```javascript\n$('#button3').click(function() {\n  $(this).animate({\n\
  \    height: 200,\n    width: 200\n  }, 'slow').queue(function() {\n    $(this).text('rolled!');\n\
  \  }).text(\"rollin'\").animate({ // 这个 animate 将不会触发\n    height: 100,\n    width:\
  \ 100\n  }, 'slow');\n});\n```\n\n`queue` 操作现在需要一些帮助来再次释放栈。就像 `live` 有 `die`，`animate`\
  \ 有 `stop` 一样，`queue` 也有它的反方法：`dequeue`。\n\n`dequeue` 方法有点特殊；它不是链接到 jQuery 链中的，而是从\
  \ `queue` 的回调函数内部调用的：\n\n`chapter_09/16_queue_dequeue_animations/script.js` (片段)\n\
  \n```javascript\n$('#button4').click(function() {\n  $(this).animate({\n    height:\
  \ 200,\n    width: 200\n  }, 'slow').queue(function() {\n    $(this).text('rolled!');\n\
  \    $(this).dequeue();\n  }).text(\"rollin'\").animate({ // 这个 animate 将不会触发\n\
  \    height: 100,\n    width: 100\n  }, 'slow');\n}); \n``` \n\n现在当我们点击按钮时，它的文本将变为“rollin’”，它会增长到\
  \ 200x200；然后它的文本将变为“rolled”，最后它将缩小到 100x100。这可能不是一个改变你世界的动画，但 `queue` 可能会改变你看待动画的方式。\n\
  \n### 将 JavaScript 对象视为 jQuery 对象\n\njQuery 的工作原理是选择 DOM 元素并对其进行操作。但一个鲜为人知的秘密是，jQuery\
  \ 不仅可以作用于 DOM；它也可以被应用于普通的 JavaScript 对象。与其说这是一个刻意设计的功能，倒不如说是库内部设计的结果。尽管初看上看它可能有点奇怪（你为什么要对一个\
  \ JavaScript 对象执行 `slideUp` 呢？），但它确实有一些潜在有趣的意义。\n\n首先，当然，`slideUp` 一个 JavaScript\
  \ 对象是不可能的——毕竟它缺乏 `height` 属性，或者说缺乏任何可见属性。但尽管如此，你仍然可以像选择 DOM 元素一样选择它：\n\n```javascript\n\
  $(myobj);\n```\n\n有很多 jQuery 操作与视觉属性无关，但我们可以想象在通用对象上使用它们。例如，极其实用的 `data` 操作用于在所选元素上存储任意数据。我们可以用它来为代码中的任何对象添加元数据。例如，我们可以在两个\
  \ JavaScript 对象之间建立一个双向链接。在下例示例中，我们想在地图上存储额外信息。地图持有有名人位置的定位图钉，我们想在定位器上附加额外信息，并在点击图钉时检索这些信息：\n\
  \n```javascript\n// 我们地图图钉位置的元数据\nvar locationData = {\n  name : \"Bourgeois Burger\
  \ Cafe\",\n  celebCount : 3,\n  lat : latitude,\n  lon : longitude,\n}\n// 从我们虚构的地图服务获取定位器\n\
  var locator = Map.getLocator(latitude, longitude);\n```\n\n我们有两个对象：第三方 `locator`\
  \ 图钉对象，以及包含与图钉相关数据的 `locationData` 对象。如果我们用 jQuery 选择 `locator`，就可以应用 `data` 操作并附加\
  \ `locationData` 对象。jQuery 在内部会将该关系存储在数据存储中——因此两个对象实际上都没有被修改：\n\n```javascript\n\
  // 将我们的数据对象附加到 JavaScript 图钉对象\n$(locator).data('pin_data', locationData);\n```\n\
  \n现在在未来的某个时刻，当用户点击地图且定位器的点击处理程序触发时，我们将访问 `locationData` 对象：\n\n```javascript\n//\
  \ 稍后，当点击某个位置时……\nvar currentData = $(clickedLocation).data('pin_data');\n\n// 检索存储在对象上的元数据！\n\
  alert(\"你选择了该位置：\" + currentData.name);\n}); \n```\n\n\n\n\n\n对于 jQuery UI 组件来说，这不是问题；我们有很多主题库可供选择——而且选择或自定义一个新的酷炫的设计非常简单，这得益于\
  \ [ThemeRoller Web 应用程序。](http://jqueryui.com/themeroller/) ThemeRoller 允许你微调、设计并下载\
  \ jQuery UI 主题。此外，如果你在创建自己的控件时遵循一些简单的约定，你就可以轻松利用现有和自定义的主题，确保你创建的每一个东西看起来都和运行起来一样出色。\n\
  \n### 使用画库主题\n\n我们在 jQuery UI 探险之旅中多次提到过主题——这是我们在下载库时必须指定的选项之一。默认情况下，你收到的是 UI Light（轻量）主题，但我们也使用过\
  \ Sunny（阳光）主题，也许你在此过程中也看过其他几个。要查看可以使用哪些默认主题，请访问 ThemeRoller 网站。\n\n现在点击左侧边栏中的 Gallery（画库）选项卡。在这里，你可以查看各种预设计的主题并找到适合你需求的主题。然后，如果你点击下载按钮，你将进入熟悉的\
  \ jQuery UI 构建界面。如果你需要整个库，请自定义你需要的组件。你选择的主题将在主题下拉框中被预选。\n\n另一方面，如果你只需要主题，不用担心选择了哪些组件，直接下载库即可。捆包的文件将包含你的主题，只需将\
  \ `css` 文件夹从下载内容提取并复制到你的项目中。然后更新你页面中样式表 `link` 中的主题名称，这样你的组件就会寻找正确的 CSS 文件。就这么简单。\n\
  \n### 制作你自己的主题\n\n很有可能，默认主题会被证明不适合你的网站。幸运的是，ThemeRoller 工具让自定义可用主题变得轻而易举。ThemeRoller\
  \ 是一个 Web 应用程序，提供了一个简单的界面来修改 jQuery UI 主题的各个方面。当你在侧边栏更新属性时，更改会立即反映在预览区域，如图 9.2 所示。\n\
  \n![jQuery UI ThemeRoller](img/fig_plugins_themeroller.jpg)\n\n图 9.2. jQuery UI\
  \ ThemeRoller\n\n一旦你将主题调整到完美，就可以点击 Download theme 按钮来下载它。更改将传递给 jQuery UI 下载构建器，就像普通的画库主题一样——只不过主题下拉框现在会显示“Custom\
  \ Theme（自定义主题）”。如果你现在下载包，你的主题将被命名为 `custom-theme`（因此你的 CSS 文件将存储在 `custom-theme`\
  \ 文件夹中）。如果你觉得你的作品需要更合适的标题，展开 Advanced Theme Settings（高级主题设置）面板并更新 Theme Folder Name\
  \ 输入框。\n\n### 注意：对 IE6 的有限支持\n\n尽管 ThemeRoller 主题看起来非常漂亮且易于使用，但有一个限制。jQuery UI 团队对支持\
  \ Internet Explorer 6 的关注程度不如 jQuery 核心库的同事，因此这些主题使用了一些 CSS3 样式和半透明 PNG，这些在 IE6\
  \ 中看起来会非常丑。它建议你使用 PNG 支持库来获得良好的图标——而且你必须找到一种非 CSS 的方案来解决你的圆角难题！\n\n### 让你的组件支持主题化\n\
  \nThemeRoller 的名字听起来很酷，你从中获得的成果也可能令人印象深刻——但它所做的只是生成一组 CSS 类块，这些类可以用于样式化任何一组 DOM\
  \ 元素。如果你按照 jQuery UI 的标记和命名约定来构建自己的自定义 UI 组件，它们也将是可换肤的。\n\n在图 9.3 中，我们对来自第 3 章的弹性内容面板应用了适当的\
  \ CSS 类，所以现在我们有一个非常像 jQuery UI 的组件。默认主题（或我们自定义的 ThemeRoller 主题）可以放在页面顶部，我们的变色龙组件将立即具有新的外观和感受（图中显示了\
  \ UI lightness、Dot Luv 和 Eggplant 预设计主题的应用效果）。\n\n![主题化的内容面板](img/fig_plugins_themed_panes.jpg)\n\
  \n图 9.3. 主题化的内容面板\n\n如果你习惯于构建语义正确的结构，你可能只需要在各处添加一个 `class` 就可以访问 ThemeRoller 的所有优秀特性。主题假设你的组件至少包含一个可以作为样式化基础的容器元素。我们用于简介面板的原始\
  \ HTML 如下所示：\n\n```\n<div id=\"bio\">\n  <h3>Beau Dandy</h3>\n  <div>\n    <img\
  \ class=\"pic\" src=\"glendatronix.png\" />\n    <span>Glendatronix is the queen\
  \ of … </span>\n  </div>\n  <h3>Mr Speaker</h3>\n  <div>\n    <img class=\"pic\"\
  \ src=\"mrspeaker.png\" />\n    <span>After smashing into the limelight … </span>\n\
  \  </div>\n  …\n</div>\n```\n\n首先，我们通过应用 `ui-widget` `class` 将 `#bio` `div` 指定为容器。然后，我们通过添加\
  \ `ui-helper-reset` 来重置我们可能已经应用过的、且可能弄乱组件样式的任何样式：\n\n*chapter_09/17_themable_components/index.html\
  \ (节选)*\n\n```\n<div id=\"bio\" class=\"ui-widget ui-helper-reset\">\n```\n\n这已经给了我们很多东西：当前主题的字体和颜色。接下来，我们可以开始在组件中引入额外的类，以样式化标题和内容区域：\n\
  \n*chapter_09/17_themable_components/index.html (节选)*\n\n```\n<h3 class=\"ui-widget-header\
  \ ui-corner-all\">Johnny Stardust</h3>\n<div class=\"ui-widget-content\">\n  <img\
  \ src=\"johnnystartdust.png\" />\n  <span>After smashing into the limelight … </span>\n\
  </div>\n```\n\n`ui-widget-header` 为我们提供了闪闪的工具栏外观，而 `ui-corner-all` 将让组件变得非常圆润（当然，在支持的情况下）。你可以指定\
  \ `ui-corner-all` 或更具体的用于样式化单个边缘的类——例如用于左上边缘的 `ui-corner-tl` 或用于两个底部边缘的 `ui-corner-bottom`，以便在大多数元素上圆角。\n\
  \n我们还使用一些显示警告和图标的额外类，在面板中添加了戏剧性的“SOLD OUT!已售罄）”消息：\n\n*chapter_09/17_themable_components/index.html\
  \ (节选)*\n\n```\n<div class=\"ui-state-error\">\n  <span class=\"ui-icon ui-icon-alert\"\
  ></span>SOLD OUT!\n</div>\n```\n\n`ui-state-error` `class` 提供了强烈的错误视觉信息，而 `ui-icon-alert`\
  \ 在 `span` 中添加了一个小图标。\n\n正如你从完整运行 jQuery UI 库中所预期的那样，有更多选项可以通过 ThemeRoller 主题控制你代码的样式。有类用于定义按钮交互状态、禁用的表单元素、组件阴影，以及一些用于\
  \ `z-index` 修复（针对 Internet Explorer 6）的棒辅助类，以及用于无访问性的快捷链接。[文档](http://jqueryui.com/docs/Theming/API)\
  \ 非常详细，将为你的大多数组件提供良好的基础。\n\n要理解所有可用内容的最佳方法是仔细阅读文档，在 ThemeRoller 工具中查看哪些元素受到了影响，并检查\
  \ jQuery UI 库中应用到元素上的类。此外，记住，当你制作具有强大 UI 关注的插件时，可以通过 jQuery 在插件代码中轻松添加 ThemeRoller\
  \ 类；这将让你的用户以极小的精力获得完全可换肤的组件。\n\n\n\n\n\n“今天我们站在这里，是这个世界上最臭名昭著的追星网站的创造者！”客户对着坐满员工和股东的房间大声宣布。项目的最后阶段已经上线，你的工作也即将结束了。自从客户要求我们美化网站的免责声明以来，这确实是一段漫长的旅程——这段旅程带我们经历了淡入淡出、平滑移动、滚动、增强和\
  \ Ajax 化。换句话说，这段旅程让我们从新手蜕变了忍者。\n\n“但是有一个让这一切成为可能，”客户继续说道，“我们这一切都要感谢那一个人……”他转身面对你，但你之前占据的空间现在是空了。你执行了最后一次\
  \ `$(\"#ninja\").hide()`——然后神秘地无影无迹地消失了。\n\n你不需要客户和同事的感谢和赞美；你的回报是良好的 Web 开发实践已被植入了另一个项目中。此外，还有你收到的丰厚报酬。实际上，这两者兼有。\n\
  \n# 附录 A. 参考资料\n\njQuery 的核心在于灵活，并尽可能适用于尽可能多的场景。核心库和插件架构都鼓励这种哲学。最常用的使用场景通常都是开箱即用的，因此\
  \ jQuery 的灵活性在于能够覆盖这些默认设置。这导致了大量的选项！不过，不需要记住所有的它们——只需手头有一份好的参考，并随时查看 jQuery 的[在线文档。](http://api.jquery.com/)\
  \ 即可。不要害怕深入 jQuery 或插件的源代码来寻找文档中可能遗漏的任何内容。\n\n## `$.ajax` Options\n\njQuery 中强大的\
  \ Ajax 函数数组由一个单一方法支持：`$.ajax`。该方法接受大量的选项，使其具有在无数情况下使用的灵活性。我们在全书中检查了一些选项，但像 jQuery\
  \ 一往常一样，还有更多！\n\n### Flags（标记）\n\n“可标记的”选项接受一个布尔值——`true` 或 `false`——用于启用或禁用指定的功能。大多数情况下，默认值是可以满意的，但你可以很容易覆盖它们来定制你的请求。\n\
  \n### `async`\n\n`async` 选项默认为 `true`，但如果你需要执行同步请求（你应该尽量减少这样做——因为它会在工作时锁定浏览器！），你可以将其设置为\
  \ `false`。\n\n### `cache`\n\n在执行 Ajax 请求时，数据缓存可能会成为一个问题；如果用户的浏览器存储了旧请求，它可能无法获取最新数据。要禁用缓存，你可以将\
  \ `cache` 选项设置为 `false`。`Script` 和 `JSONP` 请求默认是不缓存的。\n\n### `global`\n\n我们看到可以使用全局事件处理器来处理来自任何\
  \ Ajax 请求的事件。你也可以通过为 `global` 参数指定 `false`，选择停止全局事件处理器处理特定的事件。\n\n### `ifModified`\n\
  \n通过设置 `ifModified` 标记，你可以强制请求*仅*在文档自上次请求以来被修改过时才被视为“成功”（即触发 `success` 处理器）。如果你只想在有新数据需要显示时执行某些处理，这就会非常有用。\n\
  \n### `processData`\n\n当你有数据要随请求发送时，jQuery 将处理它并将其转换为适当的查询字符串值。如果这不符合需求（例如，如果你需要传递\
  \ DOM 文档或其他形式的结构），你可以将 `processData` 标记设置为 `false`。\n\n### Settings（设置）\n\n许多 Ajax\
  \ 选项允许你指定的不仅仅是一个简单的开/关值；它们通常接受字符串或对象，以定制和定义你的 Ajax 请求。\n\n### `contentType`\n\n\
  `contentType` 设置允许你为请求设置内容类型。默认是 `application/x-www-form-urlencoded`，这对于大多数情况都是可以的。\n\
  \n### `context`\n\n当 Ajax 回调执行时，它们的上下文是 `window` 对象，这通常没有太大用。你设置 `context` 选项是为了让回调中的\
  \ `this` 属性指向某些方便的东西，比如自定义的 JavaScript 对象或 jQuery 元素。\n\n### `data`\n\n要将数据传递到服务器，你为\
  \ `data` 设置指定字符串、JavaScript 数组或对象。如果你传递了数组或对象（且你没有禁用 `processData` 标记），数据将使用 `jQuery.params`\
  \ 通用函数进行序列化。该函数获取输入并将其转换为查询字符串格式（非常有用！）！如果是 `GET` 请求，该字符串将附加到 URL 之后。\n\n### `dataType`\n\
  \n如果说 `contentType` 设置的是你发送到服务器的数据的内容类型，那么 `dataType` 参数设置的就是你期望从服务器*接收*的数据类型。默认类型是“所有”（`*/*`），但你可以指定\
  \ `xml`、`html`、`script`、`json` 或 `text`——在这种情况下，jQuery 将使用适当的内容类型字符串。\n\n### `jsonp`\n\
  \n当你进行 JSONP 调用时（允许跨域请求），预期的回调函数名称将是 `callback`。如果你使用的服务需要不同的名称，你可以通过 `jsonp` 设置定义它。\n\
  \n### `password`\n\n身份验证请求需要用户名和密码。你可以在 `password` 设置中指定密码。\n\n### `scriptCharset`\n\
  \n`scriptCharset` 属性允许你指定由 `script` 或 `jsonp` Ajax 调用注入的 `script` 标签的字符集。\n\n###\
  \ `timeout`\n\n`timeout` 参数荣幸成为唯一接受数字的 `ajax` 设置：它定义了在终止 Ajax 请求之前需要流逝多少毫秒。\n\n\
  ### `type`\n\nAjax 请求最重要的设置之一，`type` 属性定义了 HTTP 请求类型：`GET`、`POST`、`PUT` 或 `DELETE`。\n\
  \n### `url`\n\n与 `type` 同样重要的设置 `url` 字符串定义了你想调用的位置地址。\n\n### `username`\n\n最后但同样重要的，`username`\
  \ 选项指定了随任何验证请求发送的用户名。\n\n### Callbacks and Functions（回调与函数）\n\n最后，还有许多你可以定义的回调和函数，用于微调你的请求并处理在请求生命周期期间发生的事件。\n\
  \n事件处理器已经在第 6 章 中涵盖过了。`complete` 处理器会在每次 `$.ajax` 调用完成时触发——无论成功失败——所以它是清理任何遗留工作的好地方。`error`\
  \ 处理器在调用失败时被调用，而 `success` 处理器在调用正确完成时触发。\n\n除了事件回调外，还有几个以钩的形式存在的函数；这些允许你根据每次调用修改请求的各个部分。`beforeSend`\
  \ 函数在发送消息执行之前触发，并在你需要时为你提供了一个修改请求的地方。你的处理器将接收到请求对象和当前的 jQuery 对象。这是需要时修改请求标头的常用位置。此外，这也是你阻止任何事情发生的最后机会：如果你从此函数返回\
  \ `false`，请求将被中止。\n\n在最底层，Ajax 的魔力源于浏览器对 `XMLHTTPRequest`（简写为 XHR）对象的实现。这就是让我们能够从客户端与服务器通信的家伙。默认情况下，jQuery\
  \ 会寻找相应的 XHR 对象并将其用于任何 Ajax 调用。如果你想增强或替换它，可以通过指定自己的 `xhr` 函数来修改它。该函数需要返回应该被使用的对象。\n\
  \n\n\n\n\n最后一个可用的钩子（hook）是 `dataFilter` 函数。它在请求成功返回后被调用，是你用来确保响应数据正常的场所。如果你需要进行任何数据清洗，这里就是用武之地。`dataFilter`\
  \ 函数会接收原始响应数据和类型；在你处理完数据后，你应该返回数据，以便请求周期继续。\n\n## `$.support` 选项\n\n在过去，我们通常使用浏览器嗅探（browser\
  \ sniffing）来确定正在使用哪个版本的哪个浏览器，并调整代码来规避已知的 Bug。今天，这种方法是不被鼓励的——因为它太不稳定了。在可能的情况下，我们应该使用特性检测（feature\
  \ detection）来检查浏览器是否支持特定的功能，并在需要时提供替代方案或回退机制（fallback）。\n\n如果你使用纯 jQuery，这些问题中的大部分已经在内部得到了处理，但如果你在直接处理一些原生\
  \ JavaScript，则可以通过 `support` 操作获得一个非常实用的特性检测机制。我们在第 6 章”中讨论过这一点，但只是简要地提到了可选的选项。选项非常多。它们都会返回一个\
  \ `true` 或 `false` 值来表示是否被支持，随后可以在 `if`/`then`/`else` 块中使用这两种情况提供支持。例如：\n\n```javascript\n\
  var domObject = document.getElementById('content');\nif ($.support.cssFloat) {\n\
  \  domObject.style.cssFloat = \"left\";\n} else {\n  domObject.style.styleFloat\
  \ = \"left\";\n}\n```\n\n以下是可用的属性：\n\n### `boxModel`\n`boxModel` 属性（初始设置为 `null`，在文档加载后更改为\
  \ `true` 或 `false`）如果浏览器按照 W3C 盒模型进行渲染，则将为 `true`。\n\n### `changeBubbles`\n检测与事件相关的浏览器特性是一项棘手的工作——这曾是进行浏览器嗅探非常常见的原因。坦率地说，一些聪明的人已经搞清楚了，所以现在如果你想知道是否可以（可靠地）响应\
  \ `change` 事件，可以检查 `changeBubbles` 属性。\n\n### `cssFloat`\n我们在上面的示例中看到了 `cssFloat`\
  \ 的用法。它检测浏览器是否使用 `cssFloat` 标签在 JavaScript 中处理浮动样式。（无法直接使用 `float`，因为那是 JavaScript\
  \ 中指代浮点数的关键字）。Internet Explorer 使用 `styleFloat` 而不是 `cssFloat`。\n\n### `hrefNormalized`\n\
  某些浏览器会对它们认为构建有错误的链接进行处理——如果这出乎你的意料，那就是一个问题！如果浏览器修改了链接，`hrefNormalized` 属性将返回 `true`。\n\
  \n### `htmlSerialize`\n如果你需要在使用 `innerHTML` 时确保链接元素（如 `link` 和 `script` 标签）被正确序列化，可以使用\
  \ `htmlSerialize` 属性。Internet Explorer 在这方面存在问题——如果你想让它正常工作，你需要将冲突的标签封装在你自己的包装元素中。\n\
  \n### `leadingWhitespace`\n`leadingWhitespace` 选项可以让你知道浏览器是否将 DOM 子元素的第一个节点留作空白。当使用\
  \ `innerHTML` 时，Internet Explorer 会剥离第一个子节点（如果是空白文本节点）；如果你依赖于固定数量的节点这可能会搞乱你的 jQuery\
  \ 代码。\n\n### `noCloneEvent`\n当你克隆 DOM 节点时，某些浏览器会克隆绑定在其上的事件处理器，而另一些则不会。如果事件没有克隆，`noCloneEvent`\
  \ 属性将为 `true`。\n\n### `opacity`\n我们都是透明度（opacity）的大粉丝：它让网站看起来很有未来感。遗憾，某些浏览器无法通过\
  \ JavaScript 操作透明度（当然，如果你使用 jQuery 则是安全的）。`opacity` 属性测试渲染引擎是否理解透明度——否则你将不得不使用浏览器的过滤器（filters）。\n\
  \n### `scriptEval`\n浏览器在处理注入的 `script` 标签执行脚本方面的行为也不同。`scriptEval` 属性会让你知道通过 `appendChild`\
  \ 注入是否安全，或者你是否应该使用 `script.text` 属性。\n\n### `style`\n要找到当前应用到元素上的样式，在某些浏览器中可以使用\
  \ `getAttribute` 方法并请求 `style`。要测试在用户的浏览器上 `getAttribute(\"style\")` 是否有效，你可以检查\
  \ `style` 属性。\n\n### `submitBubbles`\n另一个你可以检查的事件是通过 `submitBubbles` 属性进行检查的 `submit`\
  \ 事件。在内部，它使用了与 `changeBubbles` 相同的特性检测技巧。\n\n### `tbody`\n最后，在某些浏览器中，`tbody` 元素会自动插入到空的\
  \ `table` 中——这可能会搞乱你的 DOM 操作。为了检查你是否需要留意这一点，有一个 `tbody` 属性。如果你可以拥有不需要自动插入 `tbody`\
  \ 元素的表格，它会（令人困惑地）返回 `true`。\n\n`support` 操作最棒的地方在于，它迫使你准确理解你正在规避哪些 Bug。通过浏览器嗅探很容易变得自满，并开始在条件块中放入比必要的更多的代码。通过使用\
  \ `support`，你只针对非常特定的方面，确保你的用户无论厂商如何修改浏览器代码，都能享受一致（或至少是可接受的）体验。\n\n## 事件\n\n我们花了大量时间研究事件，正如我们在某些场合提到的，jQuery\
  \ 通过规范事件以符合 W3C 标准来简化跨浏览器事件处理。标准化的事件对象有一些非常有用的属性和方法。我们在书中中使用了一些它们，现在我们来看看那些漏掉的！你可以在[jQuery\
  \ 文档](http://docs.jquery.com/Events)找到完整的属性列表。\n\n### 事件属性\n我们在第 9 章中简要地见过这个：`type`\
  \ 属性将给你触发的事件名称（即使是自定义事件也是如此）。\n\n当事件处理器被调用时，你可以通过 `target` 属性获取事件源 DOM 元素。这也可以封装在\
  \ jQuery 选择器中以逃离恼人的 DOM 回到快乐 jQuery 世界。此外，如果事件是鼠标移动，你可以通过 `relatedTarget` 属性找到之前的目标（鼠标之前的位置）。而且如果事件在层级结构中移动——当你处理冒泡事件时——`currentTarget`\
  \ 会告知你当前冒泡阶段的目标。\n\n最后一个极具价值的属性是事件的 `timeStamp`。它提供了事件发生的精确时间，最常用于实现基于时间的效果。例如，如果你想在页面上创建一个特殊的连击事件，你可以查看事件的时间戳来检查是否在给定时间间隔内发生了三次点击。\n\
  \n### 事件方法\n我们已经见过很多可以使用事件方法，如 `preventDefault` 和 `stopPropagation`，它们允许我们控制事件如何冒泡以及被浏览器处理。不过还有几个额外的方法。另一个类似的方法是\
  \ `stopImmediatePropagation` 方法，它比 `stopPropagation` 更强硬一些。`stopPropagation` 防止父级处理器运行，而\
  \ `stopImmediatePropagation` 则停止任何后续的事件处理器运行——即使是在同一个元素上。\n\n其余的方法仅用于报告其他方法是否被调用。`isDefaultPrevented`、`isPropagationStopped`\
  \ 和 `isImmediatePropagationStopped` 方法返回一个布尔值，除非相应的命令已被发布，否则将为 `false`。\n\n### DIY\
  \ 事件对象\n\n\n\n\n\n当我们谈论事件时，还有一个你可能想了解的最后一个方面：你可以创建自己的事件对象并将它们直接传递给处理器。查看下这段代码：\n\
  \n```\n// Regular event binding\n$('p').bind('click', function(e) {\n  $(this).text(e.pageX);\n\
  });\n// Home-made event object!\nvar e = $.Event('click');\ne.pageX = 100;\ne.pageY\
  \ = 100;\n$('p').trigger(e);\n```\n\n我们创建了一个人工点击事件，并手动设置了它的 `pageX` 和 `pageY` 属性。这让你对触发事件处理器的事件细节拥有终极控制。\n\
  \n# 附录 B. JavaScript 小知识\n\n我们怎么强调都不为过：jQuery 只是 JavaScript——所以提高你 jQuery 技能的最佳方法就是复习你的\
  \ JavaScript 知识！现在我们来看看书中贯用到的一些 JavaScript 方面，你可能对此感到好奇。\n\n### 注意：了解更多 JavaScript\
  \ 知识\n\n如果你想让你的 JavaScript 水平更上一楼，我们强烈推荐 Douglas Crockford 的著作《JavaScript: The Good\
  \ Parts》（Sebastopol: O’Reilly, 2008）。它并不是特别轻松的读物，但它对 JavaScript 将如何以及为什么如此出色给出了简洁且务实的解释！\n\
  \n## 类型强制转换\n\nJavaScript 是所谓的弱类型语言。某些语言（如 `Java`）是强类型的：这意味着变量的类型在声明变量时就必须设置。相反，JavaScript\
  \ 允许变量进行类型转换。也就是说，它们的类型可以我们对它们的要求而改变：\n\n```\nvar a = 2;\nvar b = \"two\";\nvar\
  \ c = \"2\";\nalert(typeof a);// alerts \"number\"\nalert(typeof b);// alerts \"\
  string\"\nalert(typeof c);// alerts \"string\"\n```\n\n这并不无奇——变量的行为符合我们的预期。然而，当我们要求\
  \ JavaScript 尽力猜测我们*想要*变量变成什么类型时，情况看起来就不同了：\n\n```\nalert(a * a);// alerts 4\nalert(a\
  \ + b);// alerts 2two\nalert(a * c);// alerts 4\nalert(typeof (a * a));// alerts\
  \ \"number\"\nalert(typeof (a + b));// alerts \"string\"\nalert(typeof (a * c));//\
  \ alerts \"number\"\n```\n\n当我们使用 `+` 运算符“相加”字符串和数字时，JavaScript 假设我们尝试拼接两者，因此它创建一个新的字符串。这似乎将数字的变量类型改为\
  \ `string`。但当我们使用乘法运算符（`*`）时，JavaScript 假设我们希望这两个变量视为数字。\n\n变量本身始终保持不变，只是处理方式不同。我们可以始终显式地告诉\
  \ JavaScript 我们打算如何处理一个变量，但如果不这样做，我们需要理解 JavaScript 正在为我们做什么。这是另一个例子：\n\n```\nalert(a\
  \ + c);// alerts 22 \nalert(a + parseInt(c));// alerts 4\n```\n\n## 相等运算符\n\n等号（`=`）及其相关运算符也可能为初学者带来陷阱。在它曾经只是有点奇怪的地方，在\
  \ JavaScript 1.3 中变得更加诡异。第一个技巧是，等号的含义与你在学校数学课上记忆的完全不同：\n\n```\nvar a = 2;\nvar b\
  \ = \"2\";\n```\n\n单个等号是赋值运算符，用于给变量赋值。我们都知道它的作用，但现在我们知道它怎么称呼了：\n\n```\nvar c = (a\
  \ == b);\n```\n\n两个等号组合在一起 `==` 被称为相等运算符，它会建立一个布尔值。在我们的示例中，变量 `c` 的值将为 `true`，因为\
  \ JavaScript 比较运算符前后的值，并认为它们是相等的。使用相等运算符时，JavaScript 不忽略变量的类型，并尝试强制转换值以进行评估。\n\n\
  将第一个等号替换为感叹号，你就得到了一个不等于运算符（`!=`）。如果变量相等，该运算符将返回 `false`；如果不相等则返回 `true`：\n\n```\n\
  var d = (a != b);\n```\n\n变量 `d` 现在将拥有值 `false`，因为 `a` 和 `b` 是相等的。这可能有点复杂，但至少是一致的。\n\
  \n在 JavaScript 1.3 中，情况变得更加不简单，引入了另一个运算符：严格相等运算符，显示为 `===`。\n\n```\nvar e = (a ===\
  \ b);\n```\n\n严格相等运算符与相等运算符的区别在于，它在分配其布尔值时不仅关注值，还严格地关注*类型*。在上面的例子中，`d` 被设置为 `false`：虽然\
  \ `a` 和 `b` 的值都是 2，但它们的类型不同。\n\n正如你可能猜到的那样，当不等于运算符与相等运算符配对时，严格相等运算符也有对应的严格不等于运算符：\n\
  \n```\nvar f = (a !== b);\n```\n\n在这种情况下，变量 `f` 将返回 `true`，因为我们知道被比较的两个变量类型不同，尽管值相似。\n\
  \n足以说明，某些等号比其他等号更相等！\n\n## 真值与假值\n\nJavaScript 的布尔类型有两个值：`true` 和 `false`。但在值在布尔上下文中被用（例如在\
  \ `if` 语句或循环中）时，JavaScript 会执行转换。评估为 `true` 的值称为*真值*（truthy），评估为 `false` 的值称为*假值*（falsy）。\n\
  \n大多数值都是真值。以下值是假值：\n\n- `false`\n- `0`（数字 0）\n- `\"\"`（空字符串）\n- `null`\n- `undefined`\n\
  - `NaN`（不是数字）\n\n所有其他值都是真值，包括：\n- `true`\n- 任何非零数字（如 `1` 或 `-1`）\n- 任何非空字符串（甚至是\
  \ `\"0\"` 或 `\"false\"`）\n- 任何对象（包括 `[]` 和 `{}`）\n\n这是一个关于在实践中如何运作的示例：\n\n```javascript\n\
  if (1) {\n  console.log(\"This will run\");\n}\nif (0) {\n  console.log(\"This will\
  \ not run\");\n}\nif (\"Hello\") {\n  console.log(\"This will also run\");\n}\n\
  if (\"\") {\n  console.log(\"This will not run\");\n}\n```\n\n理解这个概念是编写地道 JavaScript\
  \ 的关键。例如，与其通过长度检查数组为空，你可以简单地写：\n\n```javascript\nvar myArray = [];\nif (!myArray.length)\
  \ {\n  console.log(\"The array is empty\");\n}\n```\n\n\n\n\n你可能认为 jQuery 选择器的可选第二个参数（称为\
  \ `context`）就是你通过 `context` 属性可以获得的内容——但情况比这要复杂一些。事实上，如果你提供字符串形式的 `context`，它在内部会被转换为一个普通的\
  \ jQuery 语句，这实际上会影响 `selector` 属性：\n\n```javascript\nvar selector = $('p:first',\
  \ '#content').selector\nvar context = $('p:first', '#content').context\n```\n\n\
  在上面的示例中，`selector` 解析为 `\"#content p:first\"`，而 `context` 解析为 `Document`（你所有选择器默认指向的上下文）。只有当你传入一个真实的\
  \ DOM 节点对其时，`context` 属性才会被修改：\n\n```javascript\nvar domContext = $('#content')[0];\
  \ // Get the DOM element\nvar selector = $('p:first', domContext).selector;\nvar\
  \ context = $('p:first', domContext).context;\n```\n\n在这种情况下，`selector` 将报告为 `\"\
  p:first\"`，而 `context` 将是 DOM 元素本身（在本例中，它是 `<div id=\"content\">` 元素）。\n\n指定 DOM\
  \ 节点并不能保证你的查询运行更快；内部，jQuery 的选择器引擎只会在你指定的上下文内搜索，即使 `context` 属性报告为 `Document`。\n\
  \n## jQuery 堆栈\n\n为了让我们的插件与 jQuery 良好地工作，我们了解到应该从代码中返回每个 jQuery 元素，这样在插件执行后就可以继续链式调用。通常，我们在将元素传回之前修改选择中的元素，但有时我们想要更改返回的项目——例如移除某些元素，或添加一些新元素。实现这一点的最佳方法是通过\
  \ `pushStack` 操作。这是一种创建包含在链中的 jQuery 选择的方便方法。\n\n例如，我们将设置一个小插件，用于获取被选中元素周围的元素。使用场景可能是高亮元素列表上一个和下一个项目。如果选中的项目是列表中的第一个或最后一个，我们的插件还会循环处理：\n\
  \n```javascript\njQuery.fn.surrounds = function() {\n  var prev = this.index() ==\
  \ 0 ? \n    this.siblings(':last') : \n    this.prev();\n  var next = this.index()\
  \ == this.siblings().length ? \n    this.siblings(':first') : \n    this.next();\n\
  \n  var newStack = prev.add(next);\n  return this.pushStack(newStack, 'surrounds',\
  \ '');\n};\n```\n\n该插件获取上一个和下一个元素，并通过 `add` 操作将它们合并为一个选择集。这个新集合通过 `pushStack` 返回，它接受集合、一个名称以及一个选择器字符串的名称。这两个名称参数可以通过我们上面查看的\
  \ `selector` 属性读取。要使用此插件，我们可能会将其应用到名为 `categories` 的无序列表，如下所示：\n\n```javascript\n\
  $('#categories li:first')\n  .surrounds()\n  .css('color', 'red')\n  .end()\n  .css('color',\
  \ 'blue'); \n```\n\n这将选中第一个列表项周围的两个元素，然后将它们涂成红色。由于我们使用了 `pushStack`，jQuery 链保持完好；然后可以使用\
  \ `end` 命令回到原始选择（第一个列表项），并将其涂成蓝色。你可以在任何想要这样操作链的时候使用 `pushStack`。\n\n关于 jQuery 内部链，我们将查看的最后一个技巧是访问链中其他步骤的能力。正如你可能记得，`end`\
  \ 操作会将你带回上一层，回到上一个修改 jQuery 选择的命令。如果你查看 jQuery 核心，你会发现 `end` 是使用 `prevObject` 属性实现的。在插件内部，你可以通过\
  \ `this.prevObject` 获取上一个 jQuery 对象。如果上一个对象也有一个上一个对象，你也可以访问它！\n\n## 压缩\n\n你知道 jQuery、jQuery\
  \ UI 以及许多 jQuery 插件有两个版本：未压缩版本和压缩版本（minified version）。为什么要这样呢？\n\n无论你选择哪一个，当你将它们添加到页面时，你都可以使用\
  \ jQuery（或相关插件）的所有功能。区别在于，`.min` 版本的文件尺寸明显更小。jQuery 1.3.2 的大小约为 118KB，而压缩版本为 55.9KB，你可以在带宽上节省超过一半的文件大小。\n\
  \n如果文件缩小了一半，传输速度就会快一倍。更快的下载意味着更快的页面加载，所以你可能想知道如何在自己的脚本文件以及更重要的是，在你的插件中也享受压缩文件的益处。\n\
  \n你有许多工具可以压缩你的文件，我们将介绍其中几个最常用的。\n\nDouglas Crockford 的 [JSMin](http://www.crockford.com/javascript/jsmin.html)\
