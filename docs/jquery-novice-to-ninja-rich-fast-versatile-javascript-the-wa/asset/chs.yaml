  \ 始终会发布有关已知排版错误和代码错误的最新信息。\n\n## SitePoint 讯通讯\n\n除了像这样的书籍外，SitePoint 还发布免费的电子邮件通讯，例如\
  \ `SitePoint Tech Times`、`SitePoint Tribune` 和 `SitePoint Design View` 等。在这些通讯中，你将读到\
  \ Web 开发各个领域的最新新闻、产品发布、趋势、技巧和技术。可以在 [`www.sitepoint.com/newsletter/`](http://www.sitepoint.com/newsletter/)\
  \ 订阅一个或多个 SitePoint 通讯。\n\n## SitePoint 播客\n\n加入 SitePoint 播客团队，获取面向 开发者和设计师的新闻、采访、观点和新鲜思维。我们讨论最新的网络行业话题，介绍客座嘉宾，并采访行业内最顶尖的人才。你可以在\
  \ [`www.sitepoint.com/podcast/`](http://www.sitepoint.com/podcast/) 获取最新及之前的播客，或通过\
  \ iTunes 订阅。\n\n## 你的反馈\n\n如果你无法通过论坛找到答案，或者出于其他原因想与我们联系，最好的联系方式是 `books@sitepoint.com`](mailto:books@sitepoint.com)。我们建立了一套配置完善的邮件支持系统来跟踪你的查询，如果我们的支持团队成员无法回答你的问题，他们会将问题直接发送给我们。我们非常欢迎改进建议，以及你可能发现的任何错误通知。\n\
