  \n## 本书使用的规范\n\n你会注意到，我们在书中使用了某些特定的排版和布局样式来表示不同类型的信息。请关注以下项目。\n\n### 代码示例\n\n书中的代码将使用等宽字体显示，例如：\n\
  \n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the\
  \ park. The birds \nwere singing and the kids were all back at school.</p>\n```\n\
  \n如果代码位于书籍的代码存档中，文件名将出现在程序列表的顶部，如下：\n\n`example.css`\n\n```\n.footer {\n  background-color:\
  \ #CCC;\n  border-top: 1px solid #333;\n}\n```\n\n如果只显示文件的部分内容，用单词 `excerpt`（节选）表示：\n\
  \n`example.css (excerpt)`\n\n```\n border-top: 1px solid #333;\n```\n\n如果要在现有示例中插入额外的代码，新代码将以**粗体**显示：\n\
  \n```\nfunction animate() {\n  new_variable = \"Hello\";\n}\n```\n\n此外，当需要现有代码作为上下文而不是重复所有代码时，将显示为\
  \ ……：\n\n```\nfunction animate() {\n  …\n  return new_variable;\n}\n```\n\n某些代码行打算在一行输入，但由于页面限制，我们不得不对其进行换行。`↵`\
  \ 表示仅出于格式目的而存在的换行，应当忽略：\n\n```\nURL.open(\"http://www.sitepoint.com/blogs/2007/05/28/user-style-he\n\
  ↵ets-come-of-age/\");\n```\n\n### 提示、注释与警告\n\n#### 提示：嘿，你！\n\n提示将为你提供有用的小技巧。\n\n\
  #### 注释：咳，打扰一下……\n\n注释是与当前主题相关但不至关重要的补充说明。将它们看作额外的信息碎片。\n\n#### 重要：确保你始终\n\n####\
  \ 警告：小心！\n\n警告将突出显示任何可能让你掉坑的陷阱。\n\n# 第一章：爱上 jQuery\n\n现在你已经具备了编写简洁、语义化 HTML 的技巧——并可以用精湛的\
  \ CSS 来支持，将你的设计理念转化为精美的网站。但现在你意识到，当你试图创建下一个 Facebook 或 Twitter 时，富有灵感的设计和无缺的 HTML\
  \ 是不够的。那么，前端缺失的拼图是什么？\n\n是 JavaScript。这门顽皮的脚本语言，多年来一直被视为 Web 开发家族中的害群之子。JavaScript\
  \ 是你如何为网站添加复杂行为、复杂的交互和额外的点缀的方式。要征服 JavaScript 这个沉睡巨人，你只需要下下心在接下来的几年里学习编程语言：函数、类、设计模式、原型、闭包……\n\
  \n或者，有一个 Web 上一些大牌人物（如 Google、Digg、WordPress 和 Amazon）可能并不介意我们与你分享的秘密：“用 jQuery\
  \ 就好了！”\n\n## jQuery 到底好在哪里？\n\n你读过 jQuery 让你可以轻松操作 DOM、添加效果并执行 Ajax 请求，但它与例如编写你自己的库或使用现有的其他（同样出色的）JavaScript\
  \ 库相比，它的优势在哪里？\n\n首先，我们提到过 jQuery 让操作 DOM、添加效果和执行 Ajax 请求变得简单吗？事实上，它让这一切变得如此简单，以至于是纯粹的极客乐趣——你经常需要从自己刚刚创造的疯狂想法中抽离，戴上你的网页设计师帽子，并进行一点克制（啊，如果审美不是障碍，我们可以创造出多么酷的事物！\n\
  \n跨浏览器兼容性\n\n\n\n\n\n除了使用起来方便之外，jQuery 的最大优点之一是它能为你处理许多令人恼狂的跨浏览器问题。任何过去写过严谨 JavaScript\
  \ 的人都能证明，跨浏览器的不一致性会让你发疯。例如，一个在 Mozilla Firefox 和 Internet Explorer 8 中渲染得完美的设计，在\
  \ Internet Explorer 7 中就会崩溃；或者一个你花费了几天时间手工打造的界面组件，在除 Linux 版 Opera 之外的所有主流浏览器中都能运行良好，而客户恰好就在\
  \ Linux 上使用 Opera。这类问题永远难以难以排查，要完全消除它们更难。\n\n即使当跨浏览器问题相对容易处理时，你仍然需要在脑中维护一个关于这些问题的知识库。当重大项目发布前一晚的晚上\
  \ 11:00，你只能希望自己记得为什么在一个你忘记测试的浏览器上会出现一个诡异的 padding（内边距） Bug！\n\njQuery 团队敏锐地关注跨浏览器问题，更重要的是他们理解这些问题发生的*原因*。他们已将这些知识写入了库中——因此\
  \ jQuery 会为你规避这些局限。你编写的大部分代码在所有主流浏览器上的运行方式都完全相同，包括每个人最喜欢的小麻烦制造：Internet Explorer\
  \ 6。\n\n单单这一个功能就能让普通开发者省去一辈烦恼。当然，你应该始终关注行业内的最新进展和最佳实践——但将寻找晦涩浏览器 Bug 的任务交给 jQuery\
  \ 团队（他们随着每个新版本的更新修复了越来越多的问题），可以让你有更多时间来实现你的想法。\n\n### CSS3 选择器\n\n让如今的技术具备跨浏览器兼容性固然很好，但\
  \ jQuery 还完全支持即将到来的 CSS3 选择器规范。是的，即使在 Internet Explorer 6.0 中也是！你可以通过现在在生产代码中学习并使用\
  \ CSS3 选择器来抢占未来的先机。选择想要更改的元素是 jQuery 力量的核心，而 CSS3 选择器为你提供了更多可用的工具。\n\n### 有用的工具函数\n\
  \n库中还包含了一系列工具函数，它们实现了编写 jQuery 有用的常用功能（或者是 JavaScript 所欠缺的功能！）：如字符串修剪、轻松扩展对象的能力等。这些函数本身特别好用，但它们促进了\
  \ jQuery 和 JavaScript 之间的无缝集成，从而使代码更容易编写和维护。\n\n一个值得注意的工具函数是 `supports` 函数，它可以测试并找到某些功能是否在当前用户的浏览器上可用。传统上，开发者不得不采用浏览器嗅探（browser\
  \ sniffing）——根据浏览器本身提供的信息判断终端用户在使用哪种网络浏览器——来绕过已知问题。这一直是一种令人不满且容易出错的做法。使用 jQuery\
  \ 的 `supports` 工具函数，你可以测试用户是否可以使用某功能，并轻松构建在旧版浏览器或不符合标准的浏览器上能够优雅降级的应用程序。\n\n### jQuery\
  \ UI\n\njQuery 已经被用于制作一些令人印象深刻的组件和效果，其中一些非常有用，足以将其包含在 jQuery 核心库中。然而，jQuery 团队明智地决定，为了保持核心库的专注，他们会将高级构造结构分离出来，并将它们封装成一个位于\
  \ jQuery 之上的整洁的库。\n\n该库被称为 `jQuery User Interface`（通常缩写为 `jQuery UI`），它由一系列实用的效果和高级组件组成，通过主题的使用可以访问并进行高度自定义。其中一些功能在图\
  \ 1.1 中有所说明。\n\n![几个 jQuery UI 组件](img/fig_falling_in_love_jquery_ui.png)\n\n图 1.1.\
  \ 几个 jQuery UI 组件\n\n手风琴、滑块、对话框、日期选择器等——所有这些现在就可以使用！你可以花费大量时间在 jQuery 中自己创建它们（尽管已经有人这么做了），但\
  \ jQuery UI 控件足够配置且足够复杂，你的时间最好花在其他地方——即实现你独特的项目需求，而不是确保你自定义的日期选择器在不同浏览器中都能正确显示！\n\
  \n在阅读本书的过程中，我们肯定会使用大量的 jQuery UI 功能。我们还会整合一些可用的酷炫主题，并学习如何使用 jQuery UI ThemeRoller\
  \ 工具创建我们自己的主题。\n\n## 插件\n\njQuery 团队在提高 jQuery 库的可扩展性方面付出了巨大努力。通过只包含一组核心功能同时提供一个扩展库的框架，他们让创建插件变得简单，你可以在所有的\
  \ jQuery 项目中复用它们，并与其他开发者共享。许多常见功能已从 jQuery 核心库中省略，并被归到插件领域。别担心，这是一个特性而非缺陷。任何所需的额外功能都可以按页面轻松地包含，以将带宽和代码膨胀降至最低。\n\
  \n幸运的是，许多人都利用了 jQuery 的可扩展性，因此 jQuery 插件仓库中已经有数百个优秀的、下载的插件，并且新插件不断加入。部分内容可以在图 1.2\
  \ 中看到。\n\n![jQuery 插件仓库](img/fig_falling_in_love_plugins.png)\n\n图 1.2. jQuery 插件仓库\n\
  \n当你面对任何任务或问题时，值得先检查是否有可能你你的插件。这是因为你可能需要的任何功能可能已经变成了插件，并已准备好让你开始使用。即使事实是你需要自己做一些工作，插件仓库通常也是引导你正确方向的最佳地方。\n\
  \n### 保持标记整洁\n\n将脚本行为与页面呈现分离是 Web 开发中的最佳实践——尽管这确实带来了不少挑战。得益于其能够轻松挂钩页面上的元素并以自然的类\
  \ CSS 方式将代码附加到其上，jQuery 让彻底清除标记中的内联脚本变得简单。jQuery 缺乏添加内联代码的机制，因此这种关注点的分离导致了更精简、更干净且更易维护的代码。因此，用正确的方法做事情变得很容易，而用错误的方法做几乎是不可能的！\n\
  \n### 广泛采用\n\n如果你愿意把你能想到的每一个 JavaScript 库都放入[Google Trends，](http://www.google.com/trends/)\
  \ 中，你将见证 jQuery 指数级地成为超级巨星。在库领域，处于热门圈是一件好事，因为流行程度等同于更活跃的代码开发和大量有趣的第三方奖励。\n\n\n\n\
  \n\n无数 Web 巨头都在加入 jQuery 的行列：IBM、Netflix、Google（它们既使用又托管了 jQuery 库），甚至还有微软，微软现在将\
  \ jQuery 包含在它的 MVC 框架中。有如此大量的大型公司站台，可以肯定，jQuery 在未来很一段时间内都会一直存在——所以，你在学习它上投入的时间和精力将是非常值得的！\n\
  \njQuery 的流行还产生了一个庞大且慷慨的社区，而且非常乐助。无论你的技能水平如何，你都会发现其他开发者非常有耐心，愿意帮助你解决你遇到的任何问题。这种关怀和分享的精神已扩展到更整个互联网，绽变成了一个由高质量教程、博客文章和文档组成的百科全书。\n\
  \n## 有什么缺点吗？\n\n几乎没有缺点！反对使用任何 JavaScript 库的主要论点一直是速度和大小：有些人认为使用库会给页面增加过多的下载负担，而另一些人则声称库的性能不如更精简的自定义代码。虽然这些观点值得考虑，但它们的相关性正在迅速消失。\n\
  \n首先，从大小来说，jQuery 是轻量级的。核心 `jQuery` 库的占用一直很小——基础部分约 19KB，比一张普通的 JPG 图片还要小。你的项目需要的任何额外内容（例如\
  \ `jQuery UI` 库的插件或组件）都可以以模块化的添加——这样你可以轻松计算自己的带宽消耗。\n\n速度（和大小一样）随着计算机硬件规格的提高和浏览器\
  \ JavaScript 引擎增长越来越快，正变成一个不再令人担心的问题。当然，这并不意味着 jQuery 慢——`jQuery` 团队似乎对速度非常痴迷！每一个新版本都比上一个版本快，因此你自己编写\
  \ JavaScript 可能获得的任何优势每天都在缩减。\n\n谈到竞争性的 JavaScript 库（市面上有很多此类库），`jQuery` 在做 `jQuery`\
  \ 擅长的事情方面是最好的：操作 `DOM`、添加效果和发送 Ajax 请求。尽管如此，市上的许多库的质量也非常优秀，并且在其他领域（例如复杂的类编程）表现出色。查看替代方案总是值得的，但如果我们列出的这些理由吸引了你，那么\
  \ `jQuery` 可能是你的首选。\n\n话就足够了：现在是 `jQuery` 展示其实力的时候了！\n\n## 下载和引入 jQuery\n\n在爱上 `jQuery`\
  \ 之前（或者至少亲自判断它之前），你需要获取最新版本的代码并将其添加到你的网页中。有几种方法可以实现，每种方法都有几个选项。无论你选择哪种，都需要在 HTML\
  \ 页面中引入 `jQuery`，就像引入任何其他 JavaScript 源文件一样。\n\n### 提示：它只是 JavaScript！\n\n永远不要忘记\
  \ `jQuery` 只是 JavaScript！它在表面上看起来和运行起来可能不同——但底层是用 JavaScript 编写的，因此它无法完成任何纯 JavaScript\
  \ 做不到的事情。这意味着我们将像对待其他 JavaScript 文件一样，将它包含在页面中。\n\n### 下载 jQuery\n\n这是获取 `jQuery`\
  \ 库最常见的方法——直接下载它！你始终可以从 [jQuery 官网](http://jquery.com/) 获取最新版本。那个显眼的巨大下载按钮将引导我们进入\
  \ Google 代码库，我们可以在那里获取最新的“生产级压缩水平”版本。\n\n点击下载链接并将 JavaScript 文件保存到新的工作文件夹中，准备好玩它。你需要把它放在\
  \ HTML 文件可以看到的地方：通常放在网站文档根目录下的 `scripts` 或 `javascript` 目录中。对于接下来的示例，我们将保持非常简单，将库放在与\
  \ HTML 文件相同的目录中。\n\n为了让这一切运行起来，我们需要告诉 HTML 文件引入 `jQuery` 库。这是通过在 HTML 文档的 `head`\
  \ 区域使用 `script` 标签来实现的。包含 `jQuery` 的非常基础 HTML 文件的 `head` 元素如下：\n\n```\n<head>\n\
  \  <title>Hello jQuery world!</title>\n  <script type='text/javascript' src='jquery-1.4-min.js'></script>\n\
  \  <script type='text/javascript' src='script.js'></script>\n</head>\n```\n\n页面上的第一个\
  \ `script` 标签加载 `jQuery` 库，第二个 `script` 标签指向 `script.js` 文件，我们将在那里运行自己的 `jQuery`\
  \ 代码。就是这样：你已经准备好开始使用 `jQuery` 了。\n\n我们之前说下载 `jQuery` 文件是最常见的方法——但还有其他几个选项供你选择，所以在在继续之前，让我们快速看看它们。如果你只想开始玩玩\
  \ `jQuery`，可以安全地跳过本部分的其余内容。\n\n### Google CDN\n\n另一种值得考虑的引入 `jQuery` 库的方法是通过 Google\
  \ `内容分发网络 (CDN)`。`CDN` 是一个计算机网络，专门设计用于以快速且可扩展的方式向用户提供内容。这些服务器通常在地理上分布，每个请求都由网络中最近的服务器提供服务。\n\
  \nGoogle 在其 CDN 上托管了几个流行的开源库，包括 `jQuery`（以及 `jQuery UI`——我们稍后会介绍）。因此，与其像我们上面那样将\
  \ `jQuery` 文件托管在你自己的 Web 服务器上，你完全可以选择让 Google 承担部分带宽费用。你将受益于 Google 庞大基础设施的速度和可靠性，并额外获得了始终使用最新版本\
  \ `jQuery` 的优处。\n\n使用 Google `CDN` 的另一个好处是，许多用户在访问另一个网站时已经从 Google 下载过 `jQuery`。结果是，当他们访问你的网站时，它将从缓存中加载（因为\
  \ JavaScript 文件的 URL 是相同的）。你也可以通过相同的方法引入巨大的 jQuery UI 库，这使得 Google CDN 对你的项目来说非常值得。\n\
  \n从 Google `CDN` 引入 `jQuery` 有几种不同方法。我们将使用较简单（尽管灵活性较低）基于路径的方法：\n\n```\n<head>\n\
  \  <title>Hello jQuery world!</title>\n  <script type=\"text/javascript\" src=\"\
  http://ajax.googleapis.com/ajax/libs/jquery/1.4.0/jquery.min.js\"></script>\n  <script\
  \ type='text/javascript' src='script.js'></script>\n</head>\n```\n\n它看起来和我们的原始示例非常相似——但\
  \ `script` 标签指向的不是 `jQuery` 的本地副本，而是指向 Google 的服务器之一。\n\n### 提示：通过 Google CDN 获取最新版本\n\
  \n仔细观察指向 Google 服务器的 URL，你会发现 `jQuery` 的版本是由路径元素之一指定的（我们示例中的 `1.4.0`）。然而，如果你喜欢使用最新的，可以从版本字符串末尾删除一个数字（例如\
  \ `1.4`），它将返回 1.4 系列中发布的最新版本（1.4.1、1.4.2 等）。你甚至可以取整数（1），在这种，即使 jQuery `1.5` 及更高版本发布时，Google\
  \ 也会给你最新版本！\n\n但要注意：当新版本的 `jQuery` 发布时，不需要更新你的 HTML 文件，但有必要留意可能影响你现有功能的任何库更改。\n\n\
  如果你想检查稍微复杂的“Google 加载器”方法来引入库，可以在其[网站](http://code.google.com/apis/ajaxlibs/documentation/)上找到大量关于\
  \ Google `CDN` 的阅读。\n\n### 每日版本与 Subversion\n\n\n\n\n\n获取 jQuery 的更多高级选项列在[官方下载\
  \ jQuery 文档页面](http://docs.jquery.com/Downloading_jQuery)上。这些选项中的第一个是每日构建版本（nightly\
  \ builds）。`Nightlies` 是 jQuery 库的自动化构建版本，包含了当天添加或修改的所有新代码。每天晚上，最新的开发版本都会供下载，并可以像常规稳定库一样的方式包含在其中。\n\
  \n如果你觉得每晚更新一次对你来说*仍然*太频繁了，你可以使用 Subversion 仓库来获取实时的源代码。`Subversion` 是 jQuery 团队使用的开源版本控制系统。每当开发者向\
  \ jQuery 提交更改时，你都可以立即下载。\n\n但是，请注意：每日构建和 Subversion 版本的 jQuery 库通常未经充分测试。它们可能（并且将会）包含错误，并且经常发生变化。除非你打算参与\
  \ jQuery 库本身的工作，否则最好跳过这些选项。\n\n### 未压缩版还是压缩版？\n\n如果你在 jQuery 下载页面上逛了一圈，你可能还会发现几种不同的下载格式选项：压缩的（也称为\
  \ `minified`）和未压缩的（也称为“development”）。\n\n通常情况下，你会在生产代码中使用压缩版本，其中 jQuery 源代码经过压缩：删除了空格和换行符，并缩短了变量名。结果是完全相同的\
  \ jQuery 库，但包含在一个比原始文件小得多的 JavaScript 文件中。这对于减少你的带宽成本以及加快终端用户的页面请求速度非常有帮助。\n\n压缩文件的缺点是可读性差。如果你在文本编辑器中查看压缩后的\
  \ jQuery 文件（尽管去试吧！），你会发现它几乎是不可读的：单行且看起来像乱码的 JavaScript。在大多数情况下，库的可读性并不重要，但如果你对 jQuery\
  \ 实际上是如何工作的感兴趣，那么未压缩的开发版本就是一个带注释、可读且相当优美的 JavaScript 示例。\n\n## jQuery 脚本剖析\n\n现在我们已经将\
  \ jQuery 引入到网页中，让我们来看看这个小家伙能做什么。jQuery 的语法在你第一次看到时可能看起来有点奇怪，但它实际上非常直观，最棒的是，它是高度一致的。在写完前几个命令后，这种风格和语法就会刻在你的脑海中，让你想要写更多。\n\
  \n### jQuery 别名\n\n在页面中引入 jQuery 让你可以使用一个名为（很奇的是）`jQuery` 的单一魔法函数。只有一个函数？正是通过这一个函数，jQuery\
  \ 暴露了数百个强大的工具，帮助为你的网页添加另一个维度。\n\n由于单个函数充当通往整个 jQuery 库的网关，库函数名与其他库或你自己的 JavaScript\
  \ 代码冲突的概率很小。否则，可能会发生这种情况：假设 jQuery 定义了一个名为 `hide` 的函数（它确实定义了），而你自己的代码中也有一个名为 `hide`\
  \ 的函数，那么其中一个函数会被覆盖，导致无法预测的事件和错误。\n\n我们说 jQuery 库包含在 jQuery *命名空间*（namespace）中。命名空间是与页面上其他代码良好处的处的方法，但我们要使用大量的\
  \ jQuery（我们确实会用），那么每个使用的命令都要输入完整的 jQuery 函数名将非常困恼。为了解决这个问题，jQuery 提供了一个访问库的简短别名。简单来说，就是\
  \ `$`。\n\n美元符号是一个简短、有效且看起来酷的 JavaScript 变量名。这看起来可能有点懒（毕竟，使用别名只节省了五次击键），但整页的 jQuery\
  \ 将包含大量的库调用，使用别名会让代码更具可读性和可维护性。\n\n### 重要：使用多个库\n\n你可能更想使用完整的 `jQuery` 调用而不是别名，主要原因是同页页面上有多个\
  \ JavaScript 库，它们都在争夺美元符号函数名的控制权。美元符号是几个库中常见的函数名，通常用于选择元素。如果你在使用多个库时遇到问题，请查看附录 A：处理冲突。\n\
  \n### 剖析 jQuery 语句\n\n我们知道 jQuery 命令以调用 `jQuery` 函数或其别名开始。现在让我们拿出手术刀，检查 jQuery 语句的其余组成部分。图\
  \ 1.3 显示了同一个 jQuery 语句的两种变体（使用完整函数名或 `$` 别名）。\n\n![典型的 jQuery 语句](img/fig_falling_in_love_statement.png)\n\
  \n图 1.3 典型的 jQuery 语句\n\n每个命令由四个部分组成：jQuery 函数（或其别名）、选择器（selectors）、动作（actions）和参数（parameters）。我们已经了解了\
  \ jQuery 函数，所以让我们顺序查看其他元素。首先，我们使用选择器来选择网页上的一个或多个元素。接着，我们选择一个应用到每个所选元素的动作。随着我们在书中实现各种效果，我们将看到越来越多的动作。最后，我们指定一些参数来告诉\
  \ jQuery 我们确切想要如何应用所选的动作。每当你看到 jQuery 代码时，尝试将它拆解为这些组成部分。当你刚开始学习，这会让理解变得容易得多。\n\n\
  在上面的示例中，我们要求选择器选择页面上所有的段落标签（HTML `<p>` 标签）。接着，我们选择了 jQuery 的 `css` 动作，它用于修改段落元素的\
  \ CSS 属性。最后，我们传递了一些参数将 CSS `color` 属性设置为 `blue`。结果是什么？我们所有的段落现在都是蓝色的！我们将在第 2 章中深入探讨选择器和\
  \ `css` 动作。\n\n## HTML 片——又称 DOM\n\njQuery 的设计旨在与 HTML 和 CSS 无缝集成。如果你精通 CSS 选择器并知道（例如\
  \ `div#heading` 指的是 id 为 `heading` 的 `div` 元素），你可能想跳过这一节。否则，有必要对 CSS 选择器和文档对象模型（DOM）进行一次简短的课程。\n\
  \nDOM 并不专门属于 jQuery；它是 HTML 中表示对象的标准方式，所有浏览器厂商都同意遵循这一标准。良好的 DOM 知识将确保你顺畅过渡到“jQuery\
  \ 忍者”境界。\n\n当你和饮水机旁的朋友们聊天时，你所说的渲染后的 HTML 片段称为 DOM。它是你的 HTML 标记的分级表示——其中每个元素（如 `div`\
  \ 或 `p`）都有一个**父**元素（它的“容器”），也可以拥有一个或多个嵌套的**子**元素。每个元素可以有一个 `id` 和/或可以有一个或多个 `class`\
  \ 属性——这些属性通常在你的 HTML 源文件中分配。当浏览器读取 HTML 页面并构建 DOM 时，它会将其显示为一个由对象组成的网页，这些对象可以静静地在那里好看（作为静态页面），或者更有趣地被我们的代码所操纵。\n\
  \n\n\n\n\n一个 DOM 片段示例如图 1.4 所示。如你所见，`body` 有两个子元素：一个 `h1` 和一个 `p`。这两个元素由于包含在同一个父元素中，因此被称为`兄弟节点`（siblings）。\n\
  \n![DOM 片段示例](img/fig_dom_tree.png)\n\n图 1.4. DOM 片段示例\n\n元素的 `id` 唯一标识页面上的该元素：\n\
  \n```\n<div id=\"footer\">Come back and visit us soon!</div>\n```\n\n该 `div` 元素被分配了名为\
  \ `footer` 的 `id`。它使用 `id` 是因为它是唯一的：页面上应该有且只有一个 `footer`。DOM 还允许我们通过 `class` 属性为多个页面元素分配相同的名称。这通常在具有共同特征的元素上进行：\n\
  \n```\n<p class=\"warning\">Sorry, this field must be filled in!</p>\n<span class=\"\
  warning\">Please try again</span>\n```\n\n在这个示例中，同一页面上的多个元素被分类为“警告”。应用到 `warning`\
  \ `class` 的任何 CSS 都将应用于这两个元素上。同一个元素上的多个 `class` 属性（当需要时）用空格分隔。\n\n当你编写 CSS 时，可以使用井号\
  \ `#` 通过 `id` 选取元素，或者通过点 `.` 通过 `class` 选取元素：\n\n```\n#footer { border: 2px solid\
  \ black }\n.warning { color: red }\n```\n\n这些 CSS 规则将为 `id` 为 `footer` 的元素添加黑色边框，并确保所有\
  \ `class` 为 `warning` 的元素都以红色文本显示。\n\n当开始编写 jQuery 时，你会发现了解 CSS 选择器和 DOM 是重要的：jQuery\
  \ 使用与 CSS 相同的语法来选择页面上的元素以进行操作。一旦你掌握了选择，其他部分就变得简单了——多亏了 jQuery！\n\n## 如果你接受……\n\n\
  jQuery 是一个稳定且成熟的产品，已准备好用于任何规模的网站，一些互联网真正的巨头对其的采用已经证明了这一点。尽管如此，它仍然是一个处于不断开发和改进中的动态项目，每个新版本都提供了性能提升和巧妙的额外功能。现在没有比现在更好的开始学习和使用\
  \ jQuery 了！\n\n在我们学习这本书的过程中，你会发现 jQuery 的格言“写得少，做得多”是有道理的。这是一个简单而有趣的库，学习曲线平缓，让你能用极少的代码完成很多酷炫的事情。当你向\
  \ jQuery 忍者的道路迈进时，我们希望你也能对 JavaScript 本身产生一点尊重和理解。\n\n在第 2 章 中，我们将深入研究 jQuery 并开始使用它为我们客户的网站增添光彩。提到我们的客户，是时候见见他了…………\n\
  \n# 第 2 章：选择、装饰和增强\n\n“在第二阶段，我们想要利用社交并启用基于 Web 2.0 社区的、众包的、Ajax，呃，交互，”我们的新客户说，“但目前，我们只需要对网站进行一些基础事项的修改。”\n\
  \n我们的客户正在启动一家名为 StarTrackr! 的初创公司！它利用 GPS 和 RFID 技术追踪人气名人的精确物理位置——然后将这些信息出售给粉丝。在朋友的当地商店里运营一直非常顺利，但现在他们正将业务搬到线上。\n\
  \n“你能行吗？这里有一份列表，需要在周五下班前上线。”\n\n你审视了列表。由于惊人的巧合的是，你注意到所有的请求都可以使用 jQuery 实现。你看了看日历。今天是周五上午。让我们开始吧！\n\
  \n列表上的第一个任务是在现有网站加载时添加一个简单的 JavaScript 警报。这是为了让访问者知道 StarTrackr! 目前没有因侵犯隐私而被起诉（最近一家当地报纸暗示了这一点）。\n\
  \n当然，我们可以使用原生的 JavaScript 来完成，但我们知道使用 jQuery 将让我们的生活变得轻松得多——而且我们可以在此过程中学习新技术！我们已经在第\
  \ 1 章 中看过了 jQuery 语句的结构了；现在让我们看看执行 jQuery 所需的步骤：我们等待页面就绪，选择我们的目标，然后对其进行更改。\n\n你可能已经猜到\
  \ jQuery 比这更复杂——但只有一点！即使是高级特效也会依赖这个基本公式，对最后两步进行多次迭代，并且可能需要一些 JavaScript 技巧。现在，让我们轻松地开始。\n\
  \n## 确保页面已就绪\n\n在我们与页面上的 HTML 元素交互之前，这些元素必须已经加载：只有当它们已经存在时，我们才能更改它们。在 JavaScript\
  \ 的过去，执行此操作唯一可靠的方法是等待整个页面（包括图像）加载完成后我们再运行任何脚本。\n\n幸运的是，jQuery 有一个非常酷的内置事件，可以尽快执行我们的魔法。正因如此，我们的页面和应用程序对终端用户来说加载快得多：\n\
  \n`chapter_02/01_document_ready/script.js`\n\n```\n$(document).ready(function()\
  \ {\n  alert('Welcome to StarTrackr!'); \n});\n```\n\n这里的重点部分（加粗处）的意思是：“当文档就绪时，运行我们的函数。”这是你最常见的\
  \ jQuery 代码段之一。\n\n### 重要：你会频繁看到 `$(document).ready()`\n\n在另有说明的情况下，你所做的几乎所有操作都需要文档就绪*之后*执行——所以我们会一直使用它。不过，在每个页面你只需要声明一次。\n\
  \n事实上，`document-ready` 惯用法是如此常见，以至于它有一个简写版本：\n\n```\n$(function() { alert('Ready\
  \ to do your bidding!'); });\n```\n\n如果你想使用简写方法，尽管去吧！扩展版本认为是一个更好的自文档代码示例；它更容易一眼看出发生了——特别是当它被埋在其他开发者的页面中时。\n\
  \n## 选择：jQuery 的核心\n\n时间紧迫，截止日期不等待任何人。客户注意到人们一直在引用网站上的名人 ID。这是因为名人的名字都列在一个大表格中，用户很难将名人与正确的引用\
  \ ID 对齐。我们的客户告诉我们，他希望每隔一行就变成浅灰色，这样用户就能轻松找到他们喜爱的名人。\n\n我们有 jQuery 准备为我们效命——它只需要我们为它选择一个目标。选择你想修改的元素实际上是\
  \ jQuery 的艺术。新手和忍者之间最大的区别之一就是你获取想要玩的元素所花费的时间！\n\n你可能在我们的结构课程中记得，我们所有的选择器都封装在 `jQuery`\
  \ 函数中：\n\n```\njQuery(<selectors go here>)\n```\n\n或者别名：\n\n```\n$(<selectors go\
  \ here>)\n```\n\n\n\n\n在本书的剩余部分，我们将一直使用快捷别名——这要方便得多。正如我们之前提到的，除非你与其他库存在冲突问题，否则没有真正的理由使用\
  \ jQuery 的全称（参参见第 9 章中的“避免冲突”章节）。\n\n## 简单选择\n\n我们的任务是选择名人表格中的奇偶行。我们如何做到这一点呢？在使用\
  \ jQuery 进行选择时，你的目标应该是只根据需要保持特定的性：你希望找到最简洁的选择器，以精确返回你想要更改的内容。让我们先看看名人表格的标记结构，如图\
  \ 2.1 所示。\n\n![HTML 页面中的 class 和 id 属性](img/fig_selecting_celebs_table.png)\n\n\
  图 2.1. HTML 页面中的 `class` 和 `id` 属性\n\n我们可以从选择页面上的所有表格行元素开始。要按元素类型选择，你只需将元素的 HTML\
  \ 名称作为字符串参数传递给 `$` 函数。要选择所有表格行元素（用 `<tr>` 标签标记），你只需写道：\n\n```\n$('tr')\n```\n\n\
  ### 重要：什么都没有发生！\n\n如果你运行此命令，页面上什么都不会发生。这是预料之中的——毕竟，我们只是在选择元素。但没必要担心；很快我们就会以各种奇妙而精彩的方式修改我们的选择了。\n\
  \n同样，如果我们想选择页面上的每个段落、`div` 元素、`h1` 标题或 `input` 框，我们将相应使用这些选择器：\n\n```\n$('p')\n\
  $('div')\n$('h1')\n$('input')\n```\n\n但我们不想更改名人页面上的*每行*表格行：只需要表格中包含名人数据的行。我们需要更具体一些，首先选择包含名人列表的容器元素。如果你查看\
  \ HTML 以及图 2.1，你可以看到包含我们名人 `table` 的 `div` 有一个 `id` 为 `celebs`，而 `table` 本身的 `class`\
  \ 为 `data`。我们可以使用其中任何一个来选择该 `table`。\n\njQuery 借用了 CSS 中引用 `id` 和 `class` 名称的约定。要按\
  \ `id` 选择，使用哈希符号（`#`）跟随元素的 `id`，并将其作为字符串传递给 jQuery 函数：\n\n```\n$('#celebs')\n```\n\
  \n你应该注意，我们传递给 jQuery 函数的字符串格式与 CSS `id` 选择器的格式完全相同。由于 `id` 应该是唯一的，我们预计这只会返回一个元素。jQuery\
  \ 现在持有了该元素的引用。\n\n同样，我们可以使用 CSS `class` 选择器来按 `class` 选择。我们将一个由点（`.`）后跟元素的 `class`\
  \ 名称构成的字符串传递给 jQuery 函数：\n\n```\n$('.data')\n```\n\n这两条语句都会选择该表格，但正如我们之前在讨论 DOM\
  \ 时提到的，一个 `class` 可以被多个元素共享——而 jQuery 会乐意地选择我们指向的尽可能多个元素。如果有多个表格（或其他任何元素）也具有 `class`\
  \ `data`，它们都将被选中。由于这个原因，这一次我们坚持使用 `id`！\n\n### 提示：你可以更具体吗？\n\n就像在 CSS 中一样，我们可以选择\
  \ `$('.data')` 或更具体的 `$('table.data')`。通过在 `class` 之外指定元素类型，选择器将只返回具有类名 `data` 的\
  \ `table` 元素——而不是*所有*具有类 `data` 的元素。此外，像 CSS 一样，你可以添加父容器选择器来进一步缩小选择范围。\n\n## 缩小我们的选择\n\
  \n我们成功地选择了表格，尽管表格本身对我们没有意义——我们想要它内部的*每一个其他行*。我们已经选择了容器元素，并从该容器元素中挑选出所有作为表格行的后代元素：也就是说，我们想指定容器\
  \ `table` *内部*的所有表格行。要做到这一点，我们在祖先和后代元素之间放置一个空格：\n\n```\n$('#celebs tr')\n```\n\n\
  你可以使用这种结构深入到你正在寻找的元素，但为了清晰起见，尽量保持你的选择器简洁。\n\n让我们把这个想法更进一步。假设我们想选择 `p` 元素内部的所有 `span`\
  \ 元素，而这些 `p` 元素又在 `div` 元素内部——但前提是这些 `div` 恰好具有类名 `fancy`。我们将使用选择器：\n\n```\n$('div.fancy\
  \ p span')\n```\n\n如果你能理解这一点，你就准备好选择几乎任何内容了！\n\n## 测试我们的选择\n\n好了，回到我们手头的任务。感觉我们正越来越接近，但目前为止我们只是盲目地选择，没有办法知道自己是否处于正确的道路上。我们需要一种方法来确认我们正在选择正确的元素。实现这一点的一种简单方法是利用\
  \ `length` 属性。`length` 返回选择器匹配的元素数量。\n\n*chapter02/02_selecting/script.js*\n```\n\
  $(document).ready(function() {\n  alert($('#celebs tr').length + ' elements!');\n\
  });\n```\n这将提示 7 个元素——`table` 表头也是一个 `tr`。如果你查看 HTML，就会发现问题所在。一个快速修复的方法是将我们的选择器缩小为只包含位于\
  \ `tbody` 内部的表格行：\n\n*chapter02/03_narrowing_selection/script.js*\n```\n$(document).ready(function()\
  \ {\n  alert($('#celebs tbody tr').length + ' elements!');\n});\n```\n这将提示正确的长度\
  \ 6——jQuery 对象现在持有六个元素。如果提示显示为 0，你就知道你的选择器中有错误。解决此类问题的一种好方法是将你的选择器简化为最小、最简单的一个。在我们的示例中，我们可以简单地写\
  \ `$('#celebs')`，它将选择表格元素并提示长度为 1。从这里开始，你可以让你的选择器更具体，并在过程中检查你是否选择了正确数量的元素。\n\n###\
  \ 过滤器\n\n在已知我们已成功选取了所有表格行的行的背景下，将我们的选择缩小到每一个其他行就很简单了——因为 jQuery 有一个过滤器（filter）可以做到。过滤器会移除某些项，只保留我们想要的项。随着我们处理更多示例，你将对哪些可以被过滤产生感觉，但现在我们直接跳转到我们为斑马纹所需的过滤器上：\n\
  \n*chapter02/04_filters/script.js*\n```\n$(document).ready(function() {\n  alert($('#celebs\
  \ tbody tr:even').length + ' elements!');\n});\n```\n过滤器附加到你想过滤的项（在本例中为表格行）上，并由冒号定义，后面跟着过滤器名称。这里使用的\
  \ `:even` 过滤器保留选择中的每个索引为偶数的元素并移除其余部分，这正是我们想要的。当我们现在提示选择长度时，我们看到 3，正如预期的那样。我们所有的奇数行都已从选择中被过滤掉了。我们有大量的\
  \ jQuery 选择器过滤器可用：`:odd`（正如你可能预期的那样）、`:first`、`:last`、`:eq()`（用于选择，例如第三个元素）以及等。我们将在书中需要时更详细地查看每一个过滤器。\n\
  \n\n\n\n\n基础选择的最后一个技巧是能够在单条语句中选择多个元素的能力。这非常有用，因为我们经常需要对页面上不相关部分的多个元素应用相同的操作。通过用逗号分隔选择器字符串就可以实现这一点。例如，如果我们想选择页面上的每个段落、`div`\
  \ 元素、`h1` 标题和 `input` 框，我们将使用这个选择器：\n\n```\n$('p,div,h1,input')\n```\n\n学习如何结合使用所有这些不同的选择器来精确访问你想要的页面元素，是掌握\
  \ jQuery 的重要部分。这在使用 jQuery 最令人感叹的部分之一，因为你可以将一些相当复杂的选择逻辑封装在短短的一行代码中！\n\n## 成为一名出色的选择器\n\
  \n选择元素看起来非常简单，在某种程度上也确实如此。但我们目前为止涵盖的内容仅仅触及选择的皮毛。在大多数情况下，基础知识就足够了：如果你只是简单地尝试定位一个元素或一组相关元素，元素名称、`id`\
  \ 和 `class` 是实现这一目标最高效且最简单的方法。\n\n当从给定元素在 DOM 中移动时，情况就会变得稍微复杂一些。jQuery 提供了无数选择器和动作来遍历\
  \ DOM。`Traversing`（遍历）意味着在页面层次结构上下移动，通过父元素和子元素。你可以在过程中添加和删除元素，并在每一步应用不同的操作——这让你能够在单条\
  \ jQuery 语句中执行某些难以思议的复杂操作！\n\n如果你是 CSS 高手，你已经熟悉很多语句了；它们大部分是直接借用自 CSS 规范的。但可能有几个是你不熟悉的，特别是如果你还没有花大量时间学习\
  \ CSS3 选择器的话。当然，我们在示例和演示中实现高级选择技术时，我们将涵盖并学习这些技术。出于如此，每当你想了解更多关于所有可用的 jQuery 选择器时，只需前往\
  \ [在线文档](http://api.jquery.com/category/selectors/) 浏览即可！\n\n## 装饰：使用 jQuery 处理\
  \ CSS\n\n在 jQuery 中，选择元素是最困难的部分。其他一切都既简单又有趣。在选择目标之后，我们能够操纵它们来构建效果或界面。在本节中，我们将涵盖一系列与\
  \ CSS 相关的 jQuery 动作：添加和删除样式、类等。我们执行的动作将单独应用到我们选择的每个元素上，让我们随心所欲地改变页面！\n\n### 读取 CSS\
  \ 属性\n\n在我们尝试更改 CSS 属性之前，让我们看看如何简单地访问它们。jQuery 让我们可以通过 `css` 函数来实现。尝试一下：\n\n`chapter_02/05_reading_css_properties/script.js`\n\
  \n```\n$(document).ready(function() {\n  var fontSize = $('#celebs tbody tr:first').css('font-size');\n\
  \  alert(fontSize);\n});\n```\n\n这段代码将弹出选择器匹配的元素的字体大小（正如你可能猜的那样，`:first` 过滤器将返回选择器匹配项中的第一个元素）。\n\
  \n### 提示：多个元素的 CSS 属性\n\n你*可以*在选择多个元素后请求 CSS 属性，但这几乎是一个坏主意：一个函数只能返回单个结果，因此你仍然只能获得第一个匹配元素的属性。\n\
  \n使用这种方法获取 CSS 属性的巧妙之处在于，jQuery 给了你元素的*计算后*样式（calculated style）。这意味着你收到的是用户浏览器中渲染的值，而不是\
  \ CSS 定义中输入的值。因此，如果你在 CSS 文件中为一个 `div` 设置了例如 200 像素的高度，但其内部内容将高度推过了 200 像素，jQuery\
  \ 将为你提供元素的实际高度，而不是你指定的 200 像素。\n\n当我们稍后来实现一些奇的技巧时，就会看到为什么这真的非常重要。\n\n### 设置 CSS\
  \ 属性\n\n到目前为止，我们还没有看到 jQuery 实际上*做*过什么，现在是时候改进了。我们知道页面已准备就绪（因为我们弹出了警告框），并且非常确定已经选择了感兴趣的元素。让我们检查一下是否真的对了：\n\
  \n`chapter_02/06_zebra_striping/script.js`\n\n```\n$(document).ready(function()\
  \ {\n  $('#celebs tbody tr:even').css('background-color','#dddddd');\n});\n```\n\
  \n你可能预料到了这一点！这是我们用来读取 CSS 属性时使用的同一个 `css` 函数，但现在它传递了一个额外的参数：我们想要为该属性设置的值。我们使用该动作将\
  \ `background-color` 设置为值 `#dddddd`（浅灰色）。在浏览器中打开代码归档中的文件并测试它是否运行正常。你可以在图 2.2 中查看结果。\n\
  \n![使用 jQuery 实现的斑纹](img/fig_selecting_zebra_striping.png)\n\n图 2.2 使用 jQuery 实现的斑纹\n\
  \n### 重要：你准备好了？\n\n正如之前提到的，此命令必须在我们的 `document-ready` 函数内部发布。如果在 DOM 准备就绪之前运行命令，选择器将去寻找\
  \ `#celebs` 元素，但找不到任何匹配项。此时它将放弃；它甚至不会寻找 `tr` 元素，更不用改变背景样式了。\n\n对于接后的所有示例都是如此，请记住将你的代码封装在\
  \ `document-ready` 函数中。\n\n看起来不错！但也许我们应该再加一点东西——毕竟，多即是好！用浅一点的字体颜色来真正定义我们的条纹如何？有几种方法可以添加第二个\
  \ CSS 属性。最简单的方法是用我们的新值重复整个 jQuery 语句：\n\n`chapter_02/07_multiple_properties_1/script.js\
  \ (excerpt)`\n\n```\n$('#celebs tbody tr:even').css('background-color','#dddddd');\n\
  $('#celebs tbody tr:even').css('color', '#666666');\n```\n\n这些行是按顺序执行的。虽然结果是正确的，但如果我们必须更改大量属性，就会变得非常混乱且低效。坦率，jQuery\
  \ 为我们提供了一种同时设置多个属性的好方法，即使用`对象字面量`（object literal）。对象字面量是 JavaScript 的概念，超出了本书的范围，但对于我们的目的，你只需要知道它们提供了一种易于分组键/值对的方法。对于\
  \ CSS，对象字面量允许我们以整洁的方式将 CSS 属性（键）与对应的 CSS 值（值）匹配起来：\n\n`chapter_02/08_multiple_properties_2/script.js\
  \ (excerpt)`\n\n```\n$('#celebs tbody tr:even').css( \n  {'background-color': '#dddddd',\
  \ 'color': '#666666'}\n);\n```\n\n对象字面量被包裹在大括号中，每个键与其对应的值之间用冒号分隔，每个键/值对之间用逗号分隔。它作为单个参数传递给\
  \ `css` 函数。使用这种方法，你可以指定任意数量的键/值对——只需用逗号分隔即可。以易读的方式布局你的键/值对是一个好主意，这样当你以后回到代码时就能很容易地看到发生了什么。当你需要设置更多属性时，这特别有帮助。例如：\n\
  \n`chapter_02/09_multiple_properties_3/script.js (excerpt)`\n\n```\n$('#celebs tbody\
  \ tr:even').css({\n  'background-color': '#dddddd', \n  'color': '#666666',\n  'font-size':\
  \ '11pt',\n  'line-height': '2.5em' \n});\n```\n\n### 注意：是否加引号\n\n通常情况下，在处理 JavaScript\
  \ 对象时，键不需要加引号。但是，为了让 jQuery 正常工作，任何包含连字符的键（如我们的 `background-color` 和 `font-size`\
  \ 示例所示）必须放在引号中，或者使用驼峰命名法（如 `backgroundColor`）。\n\n\n\n\n此外，任何已经是 JavaScript 语言中关键字的键（例如\
  \ `float` 和 `class`）也必须用引号括起来。\n\n记住哪些键需要引号而哪些不需要可能会让人很困惑，因此建议你每次都为所有对象键加上引号。\n\n\
  ## 类 (Classes)\n\n太棒了！我们已经从客户清单上删除了两个任务，而且正在进行一些酷炫的 jQuery 操作。但如果你停下来看一眼我们上一个解决方案，可能会发现一些小不对劲。如果你在如\
  \ Firebug 等开发工具中检查斑纹行，你会发现 CSS 属性已经以内联（`inline`）的形式添加到了段落中，如图图 2.3 所示。\n\n![使用 Firebug\
  \ 查看内联样式](img/fig_selecting_inline_styles_firebug.png)\n\n图 2.3. 使用 Firebug 查看内联样式\n\
  \n### 贴士：Firebug\n\nFirebug 是一个检查浏览器 DOM 特别用的工具，还可以用于监控和编辑 CSS、HTML 和 JavaScript（包括\
  \ jQuery）。它是 Web 开发的调试器瑞士军刀，通过帮助你准确看到浏览器认为正在发生什么，从而为你节省数小时的时间。它可以作为 Mozilla Firefox\
  \ 扩展可用，也可以作为一个独立的 JavaScript 文件，在你使用其他浏览器进行开发时将其包含在项目中。\n\n在 HTML/CSS 最佳实践中，内联样式是一个大忌，对吧？确实如此，这在\
  \ jQuery 中也是如此：为了保持代码清晰可维护，将所有的样式信息放在同一个地方（即 CSS 文件中）更有意义。然后，正如我们很快看到的，你只需通过给 HTML\
  \ 标签添加或移除 `class` 属性来轻松切换这些样式。\n\n有些时候，像我们刚刚看到那样使用 jQuery 的 `css` 方法确实是一个好主意。最常见的应用是快速调试代码：如果你只是想用红色勾勒一个元素以确保你正确选中了它，切换到\
  \ CSS 文件来添加新规则似乎是在浪费时间。\n\n### 添加和删除类\n\n如果我们需要从内联样式规则中移除 CSS，应该把它们放在哪里呢？当然放在单独的样式表中！我们可以在\
  \ CSS 中编写一个针对特定 `class` 的规则，放入我们需要的样式，并使用 jQuery 从 HTML 中的目标元素中添加或删除该类。意不意外的是，jQuery\
  \ 提供了一些操作 DOM 元素 `class` 属性的方便方法。我们将使用这些中最常用的 `addClass`，将斑纹样式移动到它们所属的 CSS 文件中。\n\
  \n`addClass` 函数接受一个包含 `class` 名称的字符串作为参数。你也可以通过用空格分隔 `class` 名称来同时添加多个 `class`，就像你在写\
  \ HTML 时做的那样：\n\n```\n$('div').addClass('class_name');\n$('div').addClass('class_name1\
  \ class_name2 class_name3');\n```\n\n我们只想添加一个 `class` 名称，称之为 `zebra`。首先，我们将规则添加到新的\
  \ CSS 文件中（并在 HTML 页面中通过 `link` 标签引入它）：\n\n`chapter_02/10_adding_classes/zebra.css`\n\
  \n```\n.zebra { \n  background-color: #dddddd;\n  color: #666666;\n}\n```\n\n然后，回到我们的\
  \ JavaScript 文件，修改选择器以使用 jQuery 的 `addClass` 方法而不是 `css`：\n\n`chapter_02/10_adding_classes/script.js`\n\
  \n```\n$('#celebs tr:even').addClass('zebra');\n```\n\n结果完全相同，但现在当我们在 Firebug 中检查表格时，我们会发现内联样式消失了——被我们新的类定义取代了。这如图图\
  \ 2.4 所示。\n\n![为表格行添加类](img/fig_selecting_classes_firebug.png)\n\n图 2.4. 为表格行添加类\n\
  \n这样好多了。现在，如果我们将来想改变斑纹条的外观，只需修改 CSS 文件即可；这将节省我们从 jQuery 代码中（可能在多个位置）来查找并更改值的时间。\n\
  \n有时我们还想要从元素中移除类名（我们很快就会看到一个这种情况的示例）。移除类的操作被方便地称为 `removeClass`。该函数的用法与 `addClass`\
  \ 完全相同；我们只需要将（不）希望的类名作为参数传递即可：\n\n```\n$('#celebs tr.zebra').removeClass('zebra');\n\
  ```\n\n使用 jQuery 的 `attr` 方法也可以操作 `id` 属性或任何其他属性。我们将在书的后部分详细介绍该方法。\n\n## 增强：使用 jQuery\
  \ 添加效果\n\n现在你已经到达了一个重要的里程碑。你已经学习了 jQuery 语句的组成部分：选择器、动作和参数。你学习了使用该语句的步骤：确保文档就绪、选择元素并更改它们。\n\
  \n在接下来的章节中，我们将应用这些课程来实现一些酷炫实用的效果。\n\n### 隐藏和显示元素\n\n此示例中让元素真正消失的部分是 `hide`。所以，你可能会问，围绕它的其他代码是什么？它们被称为事件处理器——理解这一点对于成为一名忍者至关重要。\n\
  \n### 事件处理器\n\n事件处理器根据其处理事件的功能命名。事件是发生在网页上的动作和用户交互。当某个事件发生时，我们说它被触发了（fired）。当我们编写代码来处理该事件时，我们说捕获了（caught）该事件。\n\
  \n网页上一直有数以千的事件被触发：当用户移动鼠标、点击按钮、调整窗口大小或滚动条移动时。我们可以捕获并处理这些事件中的任何一个。你在书中接触到的第一个事件是文档就绪事件（document-ready）。是的，那是一个事件处理器：当文档说“我已就绪”时，它触发了一个事件，我们的\
  \ jQuery 语句捕获了它。\n\n我们使用 `click` 事件处理器来告诉 jQuery 在点击按钮时隐藏免责声明：\n\n```\n$('#hideButton').click(function()\
  \ {\n  $('#disclaimer').hide();\n});\n```\n\n### `this`\n\n当事件被触发时，我们通常想要引用触发它的元素。例如，我们可能想修改用户刚刚点击的按钮。在我们的事件处理器代码中，可以通过\
  \ JavaScript 关键字 `this` 获得这种引用。为了将 JavaScript 对象转换为 jQuery 对象，我们将其封装在 jQuery 选择器中：\n\
  \n`chapter_02/12_this/script.js`\n\n```\n$('#hideButton').click(function() {\n \
  \ $(this).hide(); // 一个神奇的消失按钮。\n});\n```\n\n\n\n当你刚开始学习时，这可能会让你有些困惑，因为 jQuery 语句中的“动作”（action）组件似乎有多个用途：我们见过它被用于运行动画、获取值，现在又用于处理事件！确实如此——它的功能非常强大！通常，动作的名称可以为它的用途提供很好的提示，但如果你迷失了方向，最好去查阅索引。一段时间后，你就能把处理程序、动画和工具函数区分开了。\n\
  \n## 显示隐藏的元素\n\n继续我们的任务！客户还规定，如果用户不小心关闭了免责声明，他们需要能够重新。因此，让我们在 HTML 中添加另一个按钮，这次的\
  \ `id` 设置为 `showButton`：\n\n`chapter_02/13_revealing/index.html (节选)*`\n\n```\n\
  <input type=\"button\" id=\"showButton\" value=\"show\" />\n```\n\n我们还会在脚本文件中添加另一个\
  \ jQuery 语句，用于处理点击显示按钮时显示免责声明：\n\n`chapter_02/13_revealing/script.js (节选)`\n\n```\n\
  $('#showButton').click(function() {\n  $('#disclaimer').show();\n});\n```\n\n##\
  \ 切换元素\n\n为隐藏和显示免责声明设置单独按钮似乎浪费了宝贵的屏幕空间。更好的做法是使用一个执行两项任务的按钮——在免责声明可见时隐藏它，在隐藏时显示它。我们可以实现此点的方法一种是检查元素是否可见，然后根据情况显示或隐藏。我们将移除旧按钮，并添加这个很棒的新按钮：\n\
  \n`chapter_02/14_toggle_1/index.html (节选)*`\n\n```\n<input type=\"button\" id=\"\
  toggleButton\" value=\"toggle\" />\n```\n\n当点击它时，我们检查是否应该显示还是隐藏免责声明：\n\n`chapter_02/14_toggle_1/script.js\
  \ (节选)*`\n\n```\n$('#toggleButton').click(function() {\n  if ($('#disclaimer').is(':visible'))\
  \ {\n    $('#disclaimer').hide();\n  } else {\n    $('#disclaimer').show();\n  }\n\
  });\n```\n\n这里引入了 `is` 动作。`is` 接受与我们通常传递给 jQuery 函数相同的任何选择器，并检查它们是否与它被调用的元素匹配。在这种情况下，我们正在检查选中的\
  \ `#disclaimer` 是否也被伪选择器 `:visible` 选中。它也可以用于检查其他属性：选择结果是否为 `form` 或 `div`，或者是否已启用。\n\
  \n### 重要：`if` 语句\n\n如果你是编程完全的新手（也就是说，如果你只接触过 HTML 和 CSS），那么整块代码可能让你非常困惑！别担心，它其实非常简单：\n\
  \n```\nif (condition) {\n  // 如果条件为真，执行这部分\n} else {\n  // 如果条件为假，执行这部分\n}\n```\n\
  \n条件可以是任何 JavaScript 会评估为 `true` 或 `false` 的内容。这种结构在任何类型的编程中都极其常见，我们在书的剩余部分将经常使用它。如果你对它不熟悉，最好的学习方法就是多尝试：尝试使用\
  \ jQuery 的 `is` 动作编写像上面写那样的不同的 `if` / `else` 块。你很快就能学会的！\n\n`is` 将根据元素是否匹配选择器返回\
  \ `true` 或 `false`。对于我们的目的，如果元素是隐藏的，我们就显示它；如果它是可见的，我们就隐藏它。这种逻辑——在两个状态之间翻转——被称为“切换”（toggle），是一种非常有用的结构。\n\
  \n在两个状态之间切换元素是非常常见的，以至于许多 jQuery 函数都有一个允许切换的版本。`show`/`hide` 的切换版本简单称为 `toggle`，其工作方式如下：\n\
  \n`chapter_02/15_toggle_2/script.js (节选)*`\n\n```\n$('#toggleButton').click(function()\
  \ {\n  $('#disclaimer').toggle();\n});\n```\n\n每当你点击按钮时，元素就会可见和隐藏之间切换。\n\n然而，如果按钮的标签用比“toggle”更有用的词（这对我们的用户可能会产生困惑）就更好。如果你还想同时切换按钮的文本怎么办？正如处理\
  \ jQuery 时经常的情况，我们有几种方法可以解决这个问题。这里是其中一种：\n\n`chapter_02/16_toggle_text/script.js\
  \ (节选)*`\n\n```\n$('#toggleButton').click(function() {\n  $('#disclaimer').toggle();\n\
  \n  if ($('#disclaimer').is(':visible')) {\n    $(this).val('Hide');\n  } else {\n\
  \    $(this).val('Show');\n  }\n});\n```\n\n这段代码中有很多对你来说是新的内容。我们将大部分细节留到以后，但请看一眼看看你自己能不能想出来。（提示：记住选择器\
  \ `$(this)` 指向触发事件的元素——在这种情况下，就是按钮。）\n\n## 渐进式增强\n\n我们的免责声明功能运行完美——客户无疑会对它印象深刻。然而，我们的解决方案中有一个我们应该注意的微妙之处：如果用户使用不支持\
  \ JavaScript 的浏览器访问我们的网站，他们将无法看到免责声明。\n\n不使用 JavaScript 的可能比你想象的要多：比如手机；需要屏幕阅读器的视障人士；以及那些担心\
  \ JavaScript 是安全风险的人。解决方案是为这些用户提供可以接受的体验——并为其他人增强体验。对于我们的免责声明功能，我们可以采取这种折中方案：我们希望免责声明对所有人可见，因此我们将其放在\
  \ HTML 中。然后，我们添加为具有 JavaScript 的用户隐藏它的功能。尽管如此，我们更不想向那些无法使用按钮的用户显示按钮。我们真正想做的是通过 jQuery\
  \ 将按钮添加到页面上；这样只有使用 JavaScript 的用户才能看到按钮。\n\n### 添加新元素\n\n到目前为止我们看到了 jQuery 函数用于选择，但它确实有另一个同样重要的功能：创建新元素。事实上，你放在\
  \ jQuery 函数内部的任何有效 HTML 字符串都会被创建并准备好供你粘贴到页面上。以下是我们如何创建一个简单的段落元素：\n\n```\n$('<p>A\
  \ new paragraph!</p>')\n```\n\n当你编写这段代码时，jQuery 会执行几个实用的动作：它将 HTML 解析为 DOM 片段并选择它——就像普通的\
  \ jQuery 选择器一样。这意味着它已立即准备好进行进一步的 jQuery 处理。例如，为我们新创建的元素添加一个 `class`，我们只需写：\n\n```\n\
  $('<p>A new paragraph!</p>').addClass('new');\n```\n\n新段落现在将被赋予类 `new`。使用这种方法你可以通过\
  \ jQuery 本身创建所需的任何新元素，而不是在你的 HTML 标记中定义它们。\n\n### 提示：`innerHTML`\n\n在内部，HTML 字符串是通过创建一个一个简单的元素（如\
  \ `div`）并把该 `div` 的 `innerHTML` 属性设置为你提供的标记来解析的。你传递的一些内容无法那么容易地转换——所以尽可能保持 HTML\
  \ 片段简单是最好的。\n\n\n\n\n一旦我们创建了新元素，我们需要一种方法将它们插入到页面中想要的位置。jQuery 有几个函数可以实现此目的。我们首先来看的是\
  \ `insertAfter` 函数。`insertAfter` 会获取我们当前的 jQuery 选择结果（在本例中为我们新创建的元素），并将其插入到另一个选中元素之后，我们将该元素作为参数传递给函数。\n\
  \n一个示例是展示其工作原理最简单的方法。以下是我们使用 jQuery 创建切换按钮的方法：\n\n`chapter_02/17_insert_after/script.js`\
  \ (节选)\n\n```\n$('<input type=\"button\" value=\"toggle\" id=\"toggleButton\">')\n\
  \  .insertAfter('#disclaimer');\n$('#toggleButton').click(function() {\n  $('#disclaimer').toggle();\n\
  });\n```\n\n如图 2.5 所示，按钮被插入到页面中免责声明之后，就像我们直接在 HTML 文件中将其放在那里一样。\n\n![用 jQuery 创建并插入的按钮](img/fig_selecting_toggle_button.png)\n\
  \n图 2.5. 用 jQuery 创建并插入的按钮\n\n`insertAfter` 函数将新元素作为紧跟在免责声明元素之后的兄弟节点。如果你希望按钮出现在免责声明元素*之前*，你可以定位到免责声明之前的元素并使用\
  \ `insertAfter`，或者更符合逻辑地使用 `insertBefore` 方法。`insertBefore` 也会将新元素作为现有元素的兄弟节点放置，但它会紧接在该元素之前：\n\
  \n`chapter_02/18_insert_before/script.js` (节选)\n\n```\n$('<input type=\"button\"\
  \ value=\"toggle\" id=\"toggleButton\">')\n  .insertBefore('#disclaimer');\n```\n\
  \n快速复习：当我们谈论 DOM 时，*兄弟节点*（siblings）指的是同一层级的元素。如果你有一个包含两个 `span` 元素的 `div`，那么这两个\
  \ `span` 元素就是兄弟节点。\n\n如果你想将新元素作为现有元素的*子元素*（即，如果你希望新元素出现在现有元素*内部*），那么你可以使用 `prependTo`\
  \ 或 `appendTo` 函数：\n\n`chapter_02/19_prepend_append/script.js` (节选)\n\n```javascript\n\
  $('<strong>START!</strong>').prependTo('#disclaimer');\n$('<strong>END!</strong>').appendTo('#disclaimer');\n\
  ```\n\n如图 2.6 所示，我们的新元素已添加到实际 `div` 的开头和结尾，而不是它的之前或之后。还有更多插入和移除元素的动作，但由于本轮不需要，我们将在稍后介绍它们。\n\
  \n![prependTo 和 appendTo 的动作](img/fig_selecting_toggle_button.png)\n\n图 2.6. prependTo\
  \ 和 appendTo 动作\n\n### 插入多个元素\n\n对于每个与选择器匹配的元素，都会插入一个新项。例如，如果你的选择器匹配每个段落标签，那么 `insertAfter`\
  \ 动作将添加新元素。这使其成为一个非常强大的函数！\n\n### 移除现有元素\n\n我们告知客户，可能有高达 10% 的用户缺乏 JavaScript 能力，因此会错过一些高级功能。这些信息对使用\
  \ JavaScript 的用户应该是隐藏的。这似乎是一个学习如何使用 jQuery 从页面移除 HTML 元素的绝佳机会。我们将信息放在 HTML 中并用 jQuery\
  \ 将其移除；这样，只有没有 JavaScript 的访问才能看到它。\n\n`chapter_02/20_removing_elements/index.html`\
  \ (节选)\n\n```html\n<p id=\"no-script\">\n  我们建议您启用 JavaScript！\n</p>\n```\n\n现在我们需要运行代码从页面中移除该元素。如果用户禁用了\
  \ JavaScript，我们的 jQuery 语句将失败，信息将留在屏幕上。要在 jQuery 中移除元素，你首先用选择器（像往常一样）选中它们，然后调用 `remove`\
  \ 方法：\n\n`chapter_02/20_removing_elements/script.js` (节选)\n\n```javascript\n$('#no-script').remove();\n\
  ```\n\n`remove` 动作将从 DOM 中移除所有选中元素，并移除绑定到这些元素上的事件处理程序或数据。`remove` 动作不需要任何参数，尽管你指定一个表达式来精炼选择。\n\
  \n`chapter_02/21_removing_with_selector/script.js` (节选)\n\n```javascript\n$('#celebs\
  \ tr').remove(':contains(\"Singer\")');\n```\n\n此代码并不是移除 `#celebs` `div` 中的所有 `tr`，而是只移除包含文本“Singer”的行。当我们在下一章查看一些高级效果时，这将会非常有用。\n\
  \n得益于这些更改，我们的页面对于 10% 没有 JavaScript 的用户来说运行良好，对于剩下的 90% 的用户来说效果更好！这是一个渐进增强的非常简单的例子，但它让你对基本思想有了良好的理解：不要将\
  \ jQuery 作为你 UI 的底层基础，而是用它来为已经运行良好的体验添加一些“糖分”。这样，你就知道没有被遗漏。\n\n为了保持示例代码短小且集中，我们不会进一步深入探讨该主题。但请自己去研究它——这是那种让你成为更优秀的\
  \ Web 开发者的最佳实践。\n\n### 修改内容\n\n现在我们几乎可以对元素进行任何操作了：显示它们、隐藏它们、添加新的、移除旧的、按我们喜欢的方式对其设置样式……如果我们想更改元素的实际内容呢？再次，jQuery\
  \ 为此特定目的提供了两个方法：`text` 和 `html`。\n\n`text` 和 `html` 动作非常相似，因为它们都为我们选中的元素设置内容。我们只需向任一函数传递字符串即可：\n\
  \n`chapter_02/22_modifying_content/script.js` (节选)\n\n```javascript\n$('p').html('good\
  \ bye, cruel paragraphs!');\n$('h2').text('All your titles are belong to us');\n\
  ```\n\n在这两个例子中，匹配的元素的内容将变为我们提供的字符串：页面上的每个段落和 `h2` 标签都将被我们的新内容覆盖。`text` 和 `html`\
  \ 之间的区别可以在尝试向内容字符串添加一些 HTML 时看出：\n\n`chapter_02/23_text_vs_html/script.js` (节选)\n\
  \n```javascript\n$('p').html('<strong>Warning!</strong> Text has been replaced …\
  \ ');\n$('h2').text('<strong>Warning!</strong> Title elements can be …');\n```\n\
  \n在这种情况下，我们的段落将包含粗体文本，但我们的 `h2` 标签将包含整个内容字符串，包括 `<strong>` 标签。修改内容的动作取决于你的需求：纯文本使用\
  \ `text`，HTML 使用 `html`。\n\n你可能会问：“这些新动作只能设置内容吗？”在现阶段，你不应该感到意外，我们也可以使用相同的动作从选择中获取内容：\n\
  \n`chapter_02/24_get_content/script.js` (节选)\n\n```javascript\nalert($('h2:first').text());\n\
  ```\n\n### 基础动画：带有技巧的隐藏和显示\n\n所有这些显示和隐藏操作很有用，但在视觉上并不十分引人。是时候转向一些更有……怎么说呢，动画感*的 jQuery\
  \ 技术了。\n\njQuery 核心库包含了一些基础效果，我们可以它们来装点我们的页面。一旦你用了这些效果，可以去 jQuery 插件库看看，那里你可以发现数百种更疯狂的效果。\n\
  \n\n\n\n### 提示：保持理智\n\n在处理 Web 上的效果和动画时，开启你的审美传感器可能是一个明智的主意。记住，曾经几何时 `<blink>` 标签被认为是完全理性的！\n\
  \n#### 淡入和淡出\n\njQuery 中最常见（且永不过）的效果之一是内置的淡入效果。要使用最简单形式的淡入，只需将 `show` 替换为 `fadeIn`，或将\
  \ `hide` 替换为 `fadeOut`：\n\n*chapter_02/25_fade_in_out/script.js (excerpt)*`\n\n\
  ```javascript\n$('#hideButton').click(function() {\n  $('#disclaimer').fadeOut();\n\
  });\n```\n\n我们还可以使用几个可选参数来修改效果，其中第一个用于控制淡入完成所需的时间。许多 jQuery 效果和动画都接受 `time` 参数——它可以以字符串或整数传递。\n\
  \n我们可以使用以下预定义单词之一将时间范围指定为字符串：`slow`、`fast` 或 `normal`。例如：`fadeIn('fast')`。如果你对动画持续时间有更细粒度的控制，也可以以毫秒为单位指定时间，例如：`fadeIn(1000)`。\n\
  \n#### 切换效果和动画\n\n虽然 jQuery 没有专门用于使用淡入进行切换的动作，但这里有一个小秘密：我们原始的 `toggle` 动作拥有的技巧比我们想象的得多。如果我们向它传递一个时间范围参数，就会发现\
  \ `toggle` 具有动画能力：\n\n*chapter_02/26_toggle_fade/script.js (excerpt)*`\n\n```javascript\n\
  $('#toggleButton').click(function() {\n  $('#disclaimer').toggle('slow');\n});\n\
  ```\n\n你可以看到整个元素的宽度、高度和透明度都经过了动画处理。如果这对你来说有点太复杂了，还有另一个核心 jQuery 动画效果*确实*包含了内置的切换动作：滑动。\n\
  \n滑动（Sliding）让元素滑入和滑出视野，就像它从一个隐藏的层中滑出来一样。它的实现方式与淡入效果相同，但使用了 `slideDown`、`slideUp`\
  \ 和 `slideToggle` 动作。与淡入效果一样，我们也可以指定时间范围：\n\n*chapter_02/27_slide_toggle/script.js\
  \ (excerpt)*`\n\n```javascript\n$('#toggleButton').click(function() {\n  $('#disclaimer').slideToggle('slow');\n\
  });\n```\n\n### 回调函数\n\n许多效果（包括我们的滑动和淡入效果）都接受一个称为 `callback function`（回调函数）的特殊参数。回调指定了在效果完成其需要做的事情后需要运行的代码。在我们的案例中，当滑动完成后，它将运行我们的回调代码：\n\
  \n*chapter_02/28_callback_functions/script.js (excerpt)*`\n\n```javascript\n$('#disclaimer').slideToggle('slow',\
  \ function() {\n  alert('The slide has finished sliding!')\n});\n```\n\n回调函数只是作为匿名函数作为第二个参数传递给效果动作，就像我们向事件处理程序提供函数作为参数的方式一样。\n\
  \n### 重要：匿名函数\n\n在 JavaScript 中，内联定义的函数（例如我们的回调和事件处理程序）被称为 `anonymous functions`（匿名函数）。它们之所以被称为“匿名”，仅仅是因为它们没有名字！当你只需要该函数从某一个特定位置运行时，就会使用匿名函数。\n\
  \n在任何我们使用匿名函数的情况下，也可以传递一个函数名并在其他地方定义该函数。当同一个函数需要在几个不同的地方被调用时，这样做是最好的。在像我们的示例这样的简单情况下，这可能会让代码变得稍微难以理解，所以我们目前将坚持使用匿名函数。\n\
  \n让我们把回调函数投入实践中吧。如果我们想在免责声明滑出视野后隐藏我们的按钮：\n\n*chapter_02/29_callback_functions_2/script.js\
  \ (excerpt)*`\n\n```javascript\n$('#disclaimer').slideUp('slow', function() {\n\
  \  $('#hideButton').fadeOut();\n});\n```\n\n免责声明将向上滑动，只有当该动画完成后，按钮才会从视图中淡出。\n\n\
  ## 一些小技巧\n\n现在我们已经处理了客户待办列表中的几个高优先级请求，让我们更显眼技一点，为网站添加一些额外的火花。我们将基于目前所所学的知识添加一些效果和视觉亮点。这将引入一些新的结构和动作，所以如果这是你第一次涉足\
  \ jQuery 世界，那么研究它们是值得的。\n\n### 鼠标悬停时高亮\n\n客户对斑马纹（zebra-striping）的可用性问题非常感兴趣。他要求除了更改行颜色外，当用户将鼠标悬在\
  \ `table` 上时，还应该有一个额外的高亮。\n\n我们可以通过向 `table` 添加处理处理 `mouseover` 和 `mouseout` 事件的事件处理程序来实现这种效果。然后我们可以添加或移除一个包含特定背景色的\
  \ CSS `class`，用于鼠标悬停的元素。这与我们在原生 JavaScript 中的做法非常相似：\n\n*chapter_02/30_hover_highlight/script.css\
  \ (excerpt)*`\n\n```css\n$('#celebs tr').mouseover(function() {\n  $(this).addClass('zebraHover');\n\
  });\n$('#celebs tr').mouseout(function() {\n  $(this).removeClass('zebraHover');\n\
  });\n```\n\n记住 `$(this)` 指的是被选中的对象。在浏览器中尝试一下，看看它是如何工作的。现在我们只需要为 CSS 添加一个样式规则：\n\n\
  *chapter_02/30_hover_highlight/zebra.css (excerpt)*`\n\n```css\ntr.zebraHover {\n\
  \  background-color: #FFFACD;\n}\n```\n\n然而事实有一个更简单的方法可以实现结果：jQuery 包含一个 `hover`\
  \ 动作，将 `mouseover` 和 `mouseout` 合并为一个：\n\n*chapter_02/31_hover_action/script.js\
  \ (excerpt)*`\n\n```javascript\n$('#celebs tr').hover(function() {\n  $(this).addClass('zebraHover');\n\
  }, function() {\n  $(this).removeClass('zebraHover');\n});\n```\n\n注意到 `hover` 事件处理程序的奇之处了吗？它要求的不是一个，而是两个函数：一个处理\
  \ `mouseover` 事件，另一个处理 `mouseout` 事件。\n\n### 注意：多少回调\n\n某些事件处理程序需要不同数量的函数。例如，`toggle`\
  \ 事件处理程序接受任意数量的函数；它每次触发时循环执行每个回调。\n\n我们越来越擅长添加和移除 `class` 属性，所以现在可能是指出另一个类类动作的好时机：`toggleClass`。你可以猜猜它的作用。这是一个非常有用的动作，如果元素还没有该\
  \ `class`，则添加它；如果已经有了，则移除。\n\n例如，假设我们希望用户能够从表中选择多行。点击一次表格行将高亮它，再次点击将移除高亮。使用我们新的\
  \ jQuery 技能可以轻松实现这一点：\n\n*chapter_02/32_toggle_class/script.js (excerpt)*`\n\n```javascript\n\
  $('#celebs tbody tr').click(function() {\n  $(this).toggleClass('zebraHover');\n\
  });\n```\n\n### 剧透揭示器\n\nStarTrackr! 网站的最新新闻板块提供了关于人气明星的最新八卦。新闻是该网站一个真正的磁石——大多数用户每天都回来查看最新更新。客户希望在它已经产生的热度基础上进一步发展并增加兴奋感，因此他请求了我们的帮助。我们建议了一个剧透揭示器：用户可以尝试猜测新闻是关于哪位名人的，然后点击查看答案。\n\
  \n\n\n\n\n为了设置我们的剧透内容显示器，我们需要在网站的新闻部分添加一个新元素。任何默认应该隐藏的“秘密”都将被封装在一个带有 `class` `spoiler`\
  \ 的 `span` 元素中：\n\n`chapter_02/33_spoiler_revealer/index.html` (节录)\n\n```\n今天是谁失去了他们的录音合同？\
  \ \n<span class='spoiler'>The Zaxntines!</span>\n```\n\n让我们分解一下脚本需要执行的操作：首先，我们需要隐藏答案，并添加一个新元素，以便用户在需要时能够显示这些答案。当该元素被点击时，我们需要显示答案。隐藏？添加？处理点击？我们知道如何完成所有这些操作：\n\
  \n`chapter_02/33_spoiler_revealer/script.js` (节录)\n\n```javascript\n$('.spoiler').hide();\n\
  $('<span class=\"revealer\">Tell me!</span>')\n  .insertBefore('.spoiler');\n$('.revealer').click(function()\
  \ {\n  $(this).hide();\n  $(this).next().fadeIn();\n});\n```\n\n这里涉及的内容很多，其中一些是新的，但如果你逐行阅读，你就能理解它的逻辑了。首先，我们立即隐藏了所有的剧透元素，并使用\
  \ `insertBefore` 操作在每个元素之前添加了一个新按钮。此时，页面将显示新的“**告诉我**”按钮，而原始的剧透 `span` 将被隐藏。\n\n\
  接下来，我们选取了刚刚添加的新按钮，并为它们挂载了 `click` 事件处理器。当其中一个按钮被点击时，我们会移除新的显示器元素（我们通过 `$(this)`\
  \ 找到它），并淡入紧邻它的剧透元素。`next` 是一个我们尚未涵盖的操作。它用于遍历 DOM，而且意所当然地，它让我们能够访问元素的下一个兄弟节点（即同一个容器内的下一个元素）。\n\
  \n如果我们查看在图 2.7 中显示的修改后的 DOM，可以看到剧透 `span` 是显示器按钮之后的下一个元素。`next` 操作简单地将我们的选择移动到该元素。jQuery\
  \ 还为我们提供了 `previous` 操作，可以将选择移动到当前选中元素之前的元素。\n\n![修改后的 DOM](img/fig_selecting_modified_DOM.png)\n\
  \n图 2.7. 修改后的 DOM\n\n事实上，jQuery 有大约十种不同的操作操作可以在 DOM 之间移动；`previous` 和 `next` 只是两个特别实用的。随着书籍的深入，我们将发现更多，你可以参考[jQuery\
  \ API 文档](http://docs.jquery.com/Traversing) 查看所有操作。\n\n现在隐藏的剧透元素受 jQuery 的控制，我们可以简单地调用\
  \ `fadeIn` 来平滑过渡并显示剧透。\n\n## 在继续之前\n\n我们在初始章节中涵盖了这么多内容，你现在应该对 jQuery 的结构和力量有了直观的。如果运气的话，你可能已经在计划如何在目前的项目中使用它。请务必这样做！无论你是用它来解决棘手的问题，还是仅仅为了在这里锦上添花，亲自动手操作无疑是巩固知识的最佳方法。\n\
  \n一个小小的警告——记住那句老话：“当你手里的唯一工具是锤子时，一切看起来都像钉子。” jQuery 是一个很棒的工具，但在某些情况下可能并不合适。如果一个问题通过简单修改\
  \ CSS 或 HTML 就能更好地解决，那就应该这样做。当然，在学习期间，你可以尽管用 jQuery 完成所有事情；只需记住，当要把技能付诸实践时，你应该始终最适合任务的工具。\n\
  \n在接下来的章节中，我们将在这里学习的简单 jQuery 模块，并用它们构建一些非常酷的组件、效果和用户交互，你可以立即开始使用它们。\n\n# 第 3 章：动画、滚动和调整大小\n\
  \n客户对我们快速且富有感的首轮修改非常满意，并希望更进一步。他的公司经营娱乐业，他认为网站应该反映出他所感知的业务固有的兴奋且动态的本质。此外，他认为网站应该反映出他所感知的业务固有的兴奋且动态的本质。\n\
  \n## 动画\n\n我们在初始章节中涵盖了这么多内容，你现在应该对 jQuery 的结构和力量有了直观的。如果运气的话，你可能已经在计划如何在目前的项目中使用它。请务必这样做！无论你是用它来解决棘手的问题，还是仅仅为了在这里锦上添花，亲自动手操作无疑是巩固知识的最佳方法。\n\
  \n时间跨的工作方式与我们在第 2 章 中看到的简单动画完全相同：你可以传递一个毫秒数，或者 `slow`、`fast` 或 `normal` 字符串之一。CSS\
  \ 属性的值可以设置为像素、ems、百分比或磅值。\n\n更重要的是，你定义的值可以相对于元素的当前值：你只需要在值的前面指定 `+=` 或 `-=`，该值就会加到或从元素的当前属性中减去。让我们利用这种能力，在使用\
  \ `hover` 函数将鼠标悬过菜单项时，让我们的导航菜单动起来：\n\n`chapter_03/02_relative_css_animation/script.js`\
  \ (节录)\n\n```javascript\n$('#navigation li').hover(function() {\n  $(this).animate({paddingLeft:\
  \ '+=15px'}, 200);\n}, function() {\n  $(this).animate({paddingLeft: '-=15px'},\
  \ 200);\n});\n```\n\n你也可以使用 `animate` 对我们在第 2 章 中看到的显示、隐藏和切换函数进行精细的控制。我们只需要将属性的动画值指定为\
  \ `show`、`hide` 或 `toggle`，而不是数值大小。\n\n`chapter_03/03_animate_show_hide` (节录)\n\n\
  ```javascript\n$('#disclaimer').animate({ \n  opacity: 'hide',\n  height: 'hide'\n\
  }, 'slow');\n```\n\n### 动画 CSS 属性\n\n我们在初始章节中涵盖了这么多内容，你现在应该对 jQuery 的结构和力量有了直观的。如果运气的话，你可能已经在计划如何在目前的项目中使用它。\n\
  \n有一个你需要记住的注意事项：为了被 `animate` 使用，属性名必须使用驼峰命名法；也就是说，你需要写 `marginLeft` 而不是 `margin-left`，写\
  \ `backgroundColor` 而不是 `background-color`。\n\n### 颜色动画\n\n\n\n\n一旦你意识到 `animate`\
  \ 函数有多么酷，你可能就会想对元素的颜色进行动画处理。然而，对颜色进行动画有点棘手，因为起始颜色和结束颜色“之间”的颜色值需要以特殊的方式进行计算。高度或宽度值是以简单的线性方式从一个值移动到另一个值不同，jQuery\
  \ 需要一些额外的数学计算来确定例如，浅蓝色和橙色之间四分之三处的颜色是什么。\n\n这种计算颜色的功能从核心库中删除了。从这个角度考虑，这是合理的：大多数项目并不需要此功能，因此\
  \ jQuery 可以保持核心库的大小最小化。如果你想对颜色进行动画，你需要下载 [Color Animations 插件](http://plugins.jquery.com/project/color)。\n\
  \n## 重要提示：使用插件\n\n[官方 jQuery 插件库](http://plugins.jquery.com/) 包含了不断增加的插件——其中某些插件比其他的更有用。你可以通过名称、类别（例如效果或工具类）或\
  \ jQuery 社区收到的评分来搜索插件。\n\n一旦你找到了感兴趣的插件，将其下载到项目中的合适位置（很可能与你的 jQuery 源文件在同一个地方）。在使用插件之前，仔细阅读\
  \ readme 文件或相关文档是一个好习惯，但通常你只需要将它包含在 HTML 文件中，就像我们包含自定义的 JavaScript 文件一样。\n\n你如何使用新发现的功能因插件而异，因此你必须咨询每个插件的文档以充分利用它。\n\
  \n在下载并包含 Color Animations 插件后，你现在可以在 jQuery 动画代码中对颜色属性动画，就像处理其他 CSS 属性一样。让我们在页面加载时在两秒内逐渐突出我们的免责声明消息，确保没有人错过它：\n\
  \n*chapter_03/04_color_animation (节选)*\n\n```\n$('#disclaimer').animate({'backgroundColor':'#ff9f5f'},\
  \ 2000);\n```\n\n看到对免责声明制作动画让它变得如此显著？\n\n## 缓动 (Easing)\n\n`Easing` 指的是动画过程中发生的加速和减速，使其具有更自然的感觉。缓动通过应用数学算法在动画进行时改变其速度。坦率说，我们使用的是\
  \ jQuery，所以你可以放心地把你的高中数学技能封存起来。\n\njQuery 提供了两种缓动类型可以使用：`linear`（线性）和 `swing`（缓动）。每当你使用\
  \ jQuery 中的动画函数时，都可以指定其中一个参数来控制动画的缓动。它们之间的区别可以在 图 3.1 中看到，该图显示了根据你选择的缓动选项，属性在动画期间是如何调整的。\n\
  \n![jQuery 的缓动选项](img/fig_animation_easing_options.png)\n\n图 3.1. jQuery 的缓动选项\n\
  \n`swing` 缓动开始时缓慢，然后加速，在动画结束时再次减速，非常平稳。从视觉上看，swing 缓动看起来比线性缓动自然得多，如果没有指定缓动参数，jQuery\
  \ 默认使用它。\n\n线性缓动方法没有加速或减速：动画以恒定速率发生。在大多数情况下，它看起来相当无聊且有些生硬，但值得尝试一下——它可能刚好适合你的。\n\n\
  作为一个例子，我们将对第一个段落标签制作动画，使其在被点击时增长和收缩；我们在它增长时使用线性缓动，在收缩时使用 swing 缓动。这种区别非常微妙，但如果你重复几次动画，你应该能够区分出它们；收缩动画感觉更自然一点：\n\
  \n*chapter_03/05_easing/script.js (节选)*\n\n```\n$('p:first').toggle(function() {\n\
  \  $(this).animate({'height':'+=150px'}, 1000, 'linear');\n}, function() {\n  $(this).animate({'height':'-=150px'},\
  \ 1000, 'swing');\n});\n```\n\n这个语句中包含了大量的 jQuery 内容，所以现在可能是停下来确保你理解这里发生的一切的好时机：\n\
  \n*   我们使用带有选择器的过滤器来只获取第一个段落标签。\n*   在段落上挂载了一个 `toggle` 事件处理程序（在连续点击时执行每个传递的函数）。\n\
  *   在处理程序内部，我们选取了 `this`，它指的是触发事件的元素（在我们的示例中，它是段落本身）。\n*   第一个处理程序使用 `+=` 格式将段落的高度增加\
  \ 300 像素，使用 `linear` 缓动函数。\n*   第二个处理程序使用 `-=` 格式将段落的高度缩小 300 像素，使用 `swing` 缓动函数。\n\
  \n如果你能跟上并理解这些每一步，为自己拍拍掌吧！你真的在掌握 jQuery 的精髓了！\n\n## 高级缓动\n\n如所述，swing 缓动提供了视觉上更愉悦的过渡，对于大多数任务来说可能已经足够了。但\
  \ swing 和线性缓动只是冰山一角。jQuery 核心库中还包含了除了这两种基本类型之外的大量缓动选项。这些中的大部分可以在 [easing 插件](http://plugins.jquery.com/project/Easing)\
  \ 中可用，可从 jQuery 插件库获取。\n\n## 提示：jQuery UI 包含多个插件\n\n缓动库也包含在 jQuery UI 库的效果部分，我们很快就会访问它。如果你开始对插件感到疲劳，你可能想跳到“jQuery\
  \ UI Library”章节——该库包含了几个常用插件，包括颜色动画、类过渡和缓动。通过包含 jQuery UI 库，你将避免在页面中单独包含每个插件。\n\n\
  只需将插件的 JavaScript 文件下载并包含在你的 HTML 页面中，位于 jQuery 库之后的任何位置即可。与其提供新函数，easing 插件只是为你提供了\
  \ 30 多种新的缓动选项。解释所有这些缓动函数将测试即使最有想象力的作家，因此我们将直接引导你注意图 3.2，你可以在那里看到以图形表示的一些算法。\n\n\
  你会注意到某些算法移出了图形区域；当动画元素到达过渡的这部分时，它们会越过目的地最后返回并停在那里。这种效果就像连接在弹性带上，它柔和地将一切拉回原位。\n\n\
  ![高级缓动选项](img/fig_animation_other_easing_options.png)\n\n图 3.2. 高级缓动选项\n\n要其中一种算法，我们只需要将其名称传递给\
  \ `animate` 函数。有很多选择，所以我们不妨直接进入并尝试几种不同的：\n\n*chapter_03/06_other_easing_options/script.js\
  \ (节选)*\n\n```\n$('p:first').animate({height: '+=300px'}, 2000, 'easeOutBounce');\n\
  $('p:first').animate({height: '-=300px'}, 2000, 'easeInOutExpo');\n$('p:first').animate({height:\
  \ 'hide'}, 2000, 'easeOutCirc');\n$('p:first').animate({height: 'show'}, 2000, 'easeOutElastic');\n\
  ```\n\n看那个段落动起来！你可能想知道这些缓动选项名称从哪里来——或者在哪里可以查看完整列表。这些算法源于 Robert Penner 的缓动方程，在[他的网站上有详细描述。](http://www.robertpenner.com/easing/)。\n\
  \n\n\n\n查看所有可用方程（函数）的最佳方法是查看插件的源代码。如果你使用文本编辑器打开下载的文件，你将看到一个在 jQuery 动画中可以使用的函数列表。\n\
  \n### 提示：开始尝试一下\n\n休息一下，测试该插件提供的所有缓动函数（easing functions）。你可能永远不需要用到所有的函数，但熟悉它们将让你能够选择正确的一项，为你的界面提供你所追求的精确感。此外，玩一玩\
  \ `animate` 函数将巩固你对它的理解：它是 jQuery 高手兵器库中至关重要的一部分！\n\n### 弹动内容面板\n\n现在我们已经学习了一些关于\
  \ `animate` 函数如何工作的知识，让我们来看看客户的最新轮请求。今天的待办事项包括添加一个至关重要的页面组件：StarTrackr！每日“当前谁最火？”列表（简称为\
  \ `SDWHRNL`）。该列表由最新受青宠或失去青宠的明星组成，并附有照片和简短介绍。我们将应用刚刚学到的动画和缓动技术，将该列表实现为可以独立打开和关闭的面板。\n\
  \n小部件在页面上的外观所示图 3.3。\n\n![简介面板](img/fig_animation_biography_panes.png)\n\n图 3.3.\
  \ 简介面板\n\n在我们的 HTML 中，我们将使用一个包含所有明星的 `div` 元素来实现该部分。每个明星的面板将标记为 `h3`，随后是另一个包含图像和简短段落的\
  \ `div`：\n\n*chapter_03/07_bouncy_content_panes/index.html (节录)*\n\n```\n<div id=\"\
  bio\">\n  <h2>Who’s Hot Right Now?</h2>\n\n  <h3>Beau Dandy</h3>\n  <div>\n    <img\
  \ src=\"../images/beau_100.jpg\" width=\"100\" \n      height=\"100\" alt=\"Beau\
  \ Dandy\"/>\n    <p>Content about Beau Dandy</p>\n  </div>\n\n  <h3>Johnny Stardust</h3>\n\
  \  <div>\n    <img src=\"../images/johnny_100.jpg\" width=\"100\" \n      height=\"\
  100\" alt=\"Johny Stardust\"/>\n    <p>Content about Johny Stardust</p>\n  </div>\n\
  \n  <h3>Glendatronix</h3>\n  <div>\n    <img src=\"../images/glenda_100.jpg\" width=\"\
  100\" \n      height=\"100\" alt=\"Glendatronix\"/>\n    <p>Content about Glendatronix</p>\n\
  \  </div>\n</div>\n```\n\n当用户点击其中一个标题时，我们希望关联的内容面板能够切换打开和关闭。你可以根据需要对面板进行样式处理，但具有不同颜色背景的块级元素作为标题是一种常用技术：它为用户提供了清晰的点击号召。\n\
  \n### 提示：“跳动”动画？\n\n需要注意的一个特殊情况是，对紧邻标题标签的元素进行动画有时看起来会“跳动”——尤其是当元素隐藏时。这是由于标题的外边距（margin）导致的，外边距会随后续元素的隐藏而折叠。一种简单的解决方法（我们在这里使用的这种）是完全移除标题标签的外边距。\n\
  \n*chapter_03/07_bouncy_content_panes/script.js (节录)*\n\n```\n$('#bio > div').hide();\n\
  ```\n\n我们希望在页面加载时避免显示任何内容，因此第一要工作是隐藏所有内容容器：\n\n相反，如果你希望默认打开一个面板，可以在这里指定它。这可以帮助用户更明显地感知到面板中“隐藏”了内容，并且他们应该点击标题来显示它。在\
  \ jQuery 中实现这一点非常简单：我们只需应用 `:first` 过滤器并调用 `show` 动作来只显示第一个面板：\n\n```\n$('#bio >\
  \ div:first').show();\n```\n\n### 重要：子选择器\n\n在这些示例中包含了一个我们尚未涵盖的新选择器功能。它是子选择器（child\
  \ selector），用大于符号（`>`）表示。子选择器会选择所有匹配选择器的直接子元素。如果我们省略了子选择器，我们的代码将选择内容 `div` 元素下的所有\
  \ `div` 元素，即使它们嵌套在其他元素内部。关于使用此选择器的更多细节和代码示例，请随时在[jQuery API 文档](http://docs.jquery.com/Selectors/child)中查找。\n\
  \n现在我们的内容已经按照我们想要的方式标记好了，我们只需要为它添加一些 jQuery 交互魔法。为了显示我们的秘密内容，我们将采用熟悉的方法：捕获 `click`\
  \ 事件，找到下一个元素（包含我们的内容），并显示它——就像我们在第 2 章中所做的那样。但这一次，我们将运用一点“弹动”，对内容的高度进行缓动：\n\n*chapter_03/07_bouncy_content_panes/script.js\
  \ (节录)*\n\n```\n$('#bio h3').click(function() {\n  $(this).next().animate({\n  \
  \  height: '200px'\n  }, 500, 'easeBounce');\n});\n```\n\n\n\n\n你可以链式调用任意数量的操作。不过要小心：链式调用会让人迅速上瘾！除了可以基于初始选择器链式操作外，你还可以在过程中遍历\
  \ DOM、移动、添加和删除元素——这可能会导致一些非常复杂的语句。\n\n为了清晰起见，通常将操作分行列出是很好的做法。这会占用更多的空间，但更易阅读和维护。我们之前的示例可以重写为如下：\n\
  \n```javascript\n$('p:first')\n  .hide()\n  .slideDown('slow')\n  .fadeOut();\n\
  ```\n\n重要的是，要意识到 jQuery 选择器包含了在执行下一个操作之前运行的每个操作的修改后的结果。这意味着我们可以在执行过程中添加和删除元素，并且仅对当前选择的结果应用操作。\n\
  \n如果你回顾我们之前的几个示例，你可能会在代码中发现隐藏的几个链式操作——例如，当我们写下：`$(this).next().toggle()` 时。`next`\
  \ 操作将我们的选择移动到下一个 DOM 元素，然后 `toggle` 操作会切换它的状态，而不会影响原始元素。\n\n从现在起，你会有很多机会玩转链式调用；这本书的其余部分将充斥它。它是\
  \ jQuery 最有趣的部分！\n\n### 暂停链式（Pausing the Chain）\n\n如果你想在 jQuery 链的中间短暂暂停，可以使用 `delay`\
  \ 操作。只需给它一个数字，它就会让链保持指定的毫秒数，然后继续。回到之前的示例，我们可以这样写：\n\n```javascript\n$('p:first')\n\
  \  .hide()\n  .slideDown('slow')\n  .delay(2000)\n  .fadeOut();\n```\n\n这段代码会让段落滑下，然后等待两秒再让它淡出。这是更精确地控制动画的极佳方法。\n\
  \n### 动画导航（Animated Navigation）\n\n客户在这个问题上坚持自己的己见：他希望顶层导航是一个 Flash ，当用户与其交互时，它会晃动并缩放。他解释说，Flash\
  \ 看起来更好。你向他保证你的 Flash 技术是无与伦比的，并且立即为他编写一个概念验证。\n\n好了。现在，客户离开了房间，让我们运用新发现的 jQuery\
  \ 力量来创建一个类似 Flash 的导航栏。它将有一个背景“色块”（blob），该色块会晃动以突出用户悬停的菜单选项。我们将使用所有免费的标准技术来实现它：HTML、CSS\
  \ 和 JavaScript。Flash？我们才不需要什么该死的 Flash！\n\n我们将保持使用非常基础的动画，这样步骤更容易理解。首先，我们修改了与导航菜单相关的\
  \ CSS，使其呈水平布局而不是垂直布局。作为复习，这里是导航的 HTML 结构：\n\n*chapter_03/09_animated_navigation/index.html\
  \ (excerpt)*\n\n```html\n<ul id=\"navigation\">\n  <li><a href=\"#\">Home</a></li>\n\
  \  <li><a href=\"#\">About Us</a></li>\n  <li><a href=\"#\">Buy!</a></li>\n  <li><a\
  \ href=\"#\">Gift Ideas</a></li>\n</ul>\n```\n\n我们的背景颜色色块将是一个空的 `div` 元素，位于用户用户鼠标悬停的任何导航链接后面（注：此处原文为\
  \ `</ul>` 应为 `</ul>`）。因此，我们的第一个任务是创建该元素并将其附加到文档中：\n\n*chapter_03/09_animated_navigation/script.js\
  \ (excerpt)*\n\n```javascript\n$('<div id=\"navigation_blob\"></div>').css({ \n\
  \  width: $('#navigation li:first a').width() + 10, \n  height: $('#navigation li:first\
  \ a').height() + 10\n}).appendTo('#navigation');\n```\n\n注意，我们在对象字面量*内部*选择导航链接来为宽度和高度提供值。对于编程初学者来说，这可能看起来很奇怪，但不要被它吓到——通常情况下，你可以在任何放置静态值的地方使用函数返回（或计算出）的值。我们还给这两个值都加了\
  \ 10，这样色块会比它背后的锚点标签大一点。\n\n色块就位后，我们需要设置一个触发器来让它动起来。这应该在用户悬停在导航链接上时发生，因此我们将使用 `hover`\
  \ 操作。\n\n*chapter_03/09_animated_navigation/script.js (excerpt)*\n\n```javascript\n\
  $('#navigation a').hover(function() {\n  // 鼠标移入\n}, function() {\n  // 鼠标移出\n});\n\
  ```\n\n\n\n\n![Bouncy animated menu](img/fig_animation_menu_2.png)\n\n图 3.4. 弹性动画菜单\n\
  \n这种效果的设置非常简单。它是一个普通的无序列表，被配置为水平菜单——但我们在通常可见的区域下方隐藏了一个秘密图标。这只需要设置列表项的高度，使得在默认情况下只能看到链接文本，但当我们动画高度时，图标就会弹动到视野中。\n\
  \n我们先从 CSS 开始：我们将菜单移动并绝对定位在容器 `div` 的右上角，那里有足够的空间让图标扩展。我们为图标设置了背景颜色作为衬底，并使用了一个巧妙的技巧让背景图像保持在视线之外；注意，列表项的高度为\
  \ 20px，但背景从顶部开始偏移了 30px。因此，在我们扩展列表项高度之前，它们是不可见的。\n\n我们还会为每个链接设置不同的图标背景图像：\n\n`chapter_03/10_animated_navigation_2/navigation.css\
  \ (excerpt)`\n\n```\n#container {\n  position: relative;\n}\n\n#navigation {\n \
  \ position:absolute;\n  width: inherit;\n  top: 0; \n  right: 0;\n  margin: 0;\n\
  }\n\n#navigation li {\n  height:20px;\n  float:left;\n  list-style-type: none;\n\
  \  width:70px;\n  padding:3px;\n  border-right:1px solid #3687AF;\n  background-color:\
  \ #015287;\n  background-repeat: no-repeat;\n  background-position: center 30px;\n\
  }\n\n#navigation li a {\n  color: #FFFFFF;\n}\n\n#navigation #home{\n  background-image:url('icon_home.png');\n\
  }\n\n…\n```\n\n该效果代码中唯一的新点是我们使用 `stop` 动作来清除鼠标悬入（mouseover）事件和鼠标移出（mouseout）事件的队列。然后，我们只需动画高度来显示隐藏的图标，并在悬停结束时将其缩回正常。通过精心挑选的持续时间和缓动（easing）设置，我们得到了追求的酷炫弹动效果。请确保你尝试这些设置，以匹配你网站的风格：\n\
  \n`chapter_03/10_animated_navigation_2/script.js (excerpt)`\n\n```\n$('#nav_stretch\
  \ li').hover(\n  function() {\n    $(this)\n      .stop(true)\n      .animate(\n\
  \        {height: '60px'},\n        {duration: 500, easing: 'easeOutBounce'}\n \
  \     )\n  },\n  function() {\n    $(this)\n      .stop(true)\n      .animate(\n\
  \        {height:'20px'},\n        {duration: 500, easing: 'easeOutCirc'}\n    \
  \  )\n  }\n);\n```\n\n现在我们不仅有一个，而是有两个酷炫的动画导航示例要给客户展示了！\n\n### jQuery 用户界面库\n\n如\
  \ 第 1 章 所述，jQuery UI 库是一系列高级 jQuery 挂组件（widgets）、效果和交互作用的集合——例如日期选择器、手风琴组件（accordions）和拖放功能——它们广泛应用于\
  \ Web 开发。但在我们开始有趣的内容之前，是时候查看下载和包含 jQuery UI 库了——这个过程的设置比我们目前为止使用的核心库和插件要稍微复杂一点。这是因为完整的\
  \ jQuery UI 库大小接近 500KB（压缩后为 300KB）！那是大量的代码！幸运的是，任何项目通常只需要 jQuery UI 中包含的一小部分功能，而\
  \ jQuery 网站为我们提供了一个方便的工具来创建自定义的 jQuery UI 版本，只包含我们需要的，没有任何多余。\n\n第一次访问下载构建页面时，选项看起来可能有些无从，你可以通过点击\
  \ [jQuery UI 首页](http://jqueryui.com/) 上的自定义下载链接到达那里。\n\n下载构建器分为几个部分：核心（Core）、交互（Interaction）、组件（Widgets）、效果（Effects）和主题（Themes）。核心是主要的\
  \ jQuery UI 库——组件和交互部分都依赖于它。处理构建器的好方法是取消全选，然后只添加你需要的。如果某个组件依赖另一个组件才能工作，它将自动为你选中。\n\
  \n在开发过程中，获取完整库是安全的。这样如果我们需要，所有内容供我们使用。一旦你对网站上的功能满意了，可以随时返回下载构建器并创建一个自定义库，省略任何未使用的内容。完整库与自定义版本之间的文件大小差异可能很大，如图\
  \ 3.5 所示。\n\n![Full jQuery UI library versus customized download](img/fig_animation_ui_before_after.png)\n\
  \n图 3.5. 完整 jQuery UI 库与自定义下载\n\n影响组件和交互视觉输出的一个选项是 `theme`（主题）。你可以使用下拉框选择多个主题。在\
  \ 第 9 章 中，我们将深入研究主题，包括制作自己的主题。但为了继续进行更有趣的内容，我们将使用默认主题。\n\njQuery UI 包含一个 Effects\
  \ 包，允许我们实现一些效果。它还包含了用于动画的有用方法。多亏于颜色动画和缓动插件，我们已经见过这些功能。这些包含在 Effects 包中，所以如果你打算使用\
  \ jQuery UI，就不再需要包含它们了。\n\n在继续之前，让我们快速查看几个可用效果。我们将让对齐的第一个段落元素抖动一下，用黄色高亮它，然后让它爆炸碎片：\n\
  \n`chapter_03/11_jquery_ui_effects/script.js (excerpt)`\n\n```\n$('p:first')\n \
  \ .effect('shake', {times:3}, 300)\n  .effect('highlight', {}, 3000)\n  .hide('explode',\
  \ {}, 1000);\n```\n\n看它动起来！当然，这只是可用效果的一个微小样本。其中一些只能通过 `effect` 动作这种方式使用，而另一些既可以这样使用，也可以替代\
  \ `hide`、`show` 或 `toggle` 参数。后者的示例包括 `blind`、`clip`、`puff`、`fold` 和 `slide`。\n\n\
  我们在这里不再详细介绍所有效果——你最好花下午时间去探索它们。不过，并不是所有效果纯属装饰，许多在常见的用户交互场景中非常有用，例如 `highlight`，它是向用户指示新消息的标准方式。\n\
  \n测试每个函数是一个好主意，这样在合适的时候你就能记得它们。如果 jQuery UI 的效果系列仍然不能满足你，没关系——插件库中还有数百个可用效果！\n\n\
  ### 动起来！\n\n你现在理解了用 jQuery 动画的所有基础知识：选择器、事件处理器、回调、链式调用以及关重要的 `animate` 函数。你还简要熟悉了丰富的\
  \ jQuery UI 库。然而，真正掌握这些技能的最佳方法是将它们付诸实践。去动画化你能得到的一切东西吧！尝试尝试页面上每个元素的每个属性，直到你觉得真的可以随心所欲地操控它们。\n\
  \n\n\n\n\n在我们从动画转向你将掌握的下一个 jQuery 技能集之前，我们将注意力转向滚动和调整大小：这些主题可能没有动画那么华丽，但它们对许多用户界面组件来说是至关重要的。它们还将帮助巩固你对\
  \ jQuery 选择器、动作和链式调用的理解。那么我们还在等什么呢？\n\n## 滚动\n\n在某种程度上，滚动与动画相似，因为元素都在页面上移动。但与动画不同的是，控制权在用户手中！尽管如此，仍有许多种方法可以自定义这些交互。在本节中，我们将查看在用户滚动时保持位置的菜单、自定义主题的滚动条，甚至学习我们如何使用刚刚学到的动画技术并应用于文档滚动。\n\
  \n### `scroll` 事件\n\n在改进用户的滚动体验之前，我们得知道他们何时以及在滚动什么内容。事实证明，有一个名为 `scroll` 的事件，当用户更新元素（例如窗口或可滚的\
  \ `div`）的滚动位置时，该事件就会触发。因此，每当你的用户与你网站上的滚动条交互时，都会触发一个你可以捕获并响应的事件。\n\n为了捕获 `scroll`\
  \ 事件，我们将事件处理器附加到带有滚动条的元素上——通常是窗口元素。窗口本身是一个 JavaScript 对象，所以我们只需要在 jQuery 函数中封装它以进行选择即可。\n\
  \n当然，为了看到 `scroll` 事件的实际效果，我们必须设置一个带有滚动条的区域！我们有几个想向客户提出的滚动效果想法，但为了学习 `scroll` 事件的工作原理，让我们先通过在页面上的其中一个\
  \ `div` 上设置 `overflow: scroll;` 来模拟一个滚动环境：\n\n`chapter_03/12_scroll_event/scroll.css`\
  \ (节选)\n\n```\n#news {\n  height: 100px;\n  width: 300px;\n  overflow: scroll;\n\
  }\n```\n\n这将我们的新闻区域变成页面内的一个较小的滚动面板。现在，让我们捕获 `scroll` 事件，并在每次 `scroll` 事件触发时向页面添加一些任意文本：\n\
  \n`chapter_03/12_scroll_event/script.js` (节选)\n\n```\n$('#news').scroll(function()\
  \ {\n  $('#header')\n    .append('<span class=\"scrolled\">You scrolled!</span>');\n\
  });\n```\n\n现在，每当你滚动新闻区域时，文本“You Scrolled!”就会出现在页面顶部的红色背景上。这非常烦人，但你明白意思了。尝试不同的滚动方式：拖动滚动条、使用鼠标滚轮，以及点击可滚动区域内部使用箭头键。在上述所有情况下，`scroll`\
  \ 事件都会触发。\n\n### 悬浮导航\n\n我们现在知道用户何时滚动了，那么我们如何利用这些信息来改进我们的网站呢？嗯，页面对用户滚动做出反应的一个相当常见的例子是悬浮导航面板。这是指主导航元素始终出现在屏幕可见部分的顶部，无论滚动位置如何；就好像导航菜单随着用户向下滚动页面而跟随他们一样。使用\
  \ `scroll` 事件实现这一点非常简单：我们只需要找到自己在页面上的位置，然后将导航移动到该点即可。\n\n我们的第一个任务是设置 CSS 为动画导航做准备。我们将在导航元素上添加\
  \ `position: relative;` 声明，这样我们就可以通过调整其 `top` 属性轻松地在页面上上下移动它。为了练习的目的，我们对内容应用了非常大的\
  \ `height` 属性，以强制它产生滚动条（除非你有一个巨大的显示器！）：\n\n`chapter_03/13_floating_nav_1/scroll.css`\
  \ (节选)\n\n```\n#navigation {\n  position: relative;\n}\n\n#content {\n  height:\
  \ 2000px;\n}\n```\n\n现在我们可以尝试实现我们的悬浮面板了。初看起来看起来没有比这更简单了——只需通过更新导航块的 `top` 位置来响应主窗口的\
  \ `scroll` 事件：\n\n`chapter_03/13_floating_nav_1/script.js` (节选)\n\n```\n$(window).scroll(function()\
  \ { \n  $('#navigation').css('top', $(document).scrollTop()); \n});\n```\n\n在浏览器中测试一下，你会发现我们已经实现了目标：当你向下滚动页面时，导航框会跟随你移动。它是如何知道顶部在哪里的？我们通过\
  \ `scrollTop` 动作请求屏幕顶部。`scrollTop` 返回匹配元素的顶部偏移量——在示例中，我们请求了整个文档的顶部位置：`$(document).scrollTop()`。这始终是屏幕的最顶端。\n\
  \n它确实有效，但非常跳动，这使得它看起来不太观。如果你在我们首次介绍 `scroll` 事件时注意的话，这个原因应该是显而易见的：每当用户移动滚动条时，它都会触发许多\
  \ `scroll` 事件。每一个事件都会触发我们的代码来更新导航位置——所以动作看起来抖抖的也不奇怪了。\n\n我们在“动画导航” 章节中见过如何使用 `stop`\
  \ 命令停止动画这样排队。这解决了跳动问题，但我们的效果仍然可以进一步改进。如果用一些动画和一点点弹性缓动（bouncy easing）让它变得更智能如何？以下是我们的做法：\n\
  \n`chapter_03/14_floating_nav_2/script.js` (节选)\n\n```\n$(window).scroll(function()\
  \ {\n  $('#navigation')\n    .stop()\n    .animate({top: $(document).scrollTop()},'slow','easeOutBack');\n\
  }); \n```\n\n对于如此显著的效果，只需要令人满意的极少量代码！\n\n### 文档滚动\n\n当单个 HTML 页面上需要显示关于相关（但各异）主题的长信息列表时，通常会在页面顶部包含一个主题的超链接列表。\n\
  \n这些内部链接将立即跳转到你选择的菜单项所在的位置。在内容之后，通常有一个带你回到屏幕顶部的链接——这样你可以选择另一个菜单项。让我们尝试为我们的页面添加此功能。\n\
  \n第一个任务是向页面页脚添加链接。要跳转到页面顶部，我们只需要将链接的 `href` 属性设置为 `#`。\n\n如果我们想一想，我们想做的只是让页面的滚动位置动画化，这在\
  \ jQuery 中由 `scrollTop` 表示。我们还需要取消默认的链接动作——否则页面会在我们的动画发生之前就发生跳转。如果你是 JavaScript\
  \ 的初学者，有一个简单的方法可以实现这一点：任何处理链接 `click` 事件的函数只需要包含 `return false` 语句即可取消链接的默认行为：\n\
  \n```\n$('a[href=#]').click(function() {\n  $('html').animate({scrollTop: 0},'slow');\
  \ \n  return false; // 返回 false 以取消默认的链接动作\n}\n```\n\n这段代码引入了一种新的选择器：属性选择器。通过在方括号（`[]`）中将属性我们要查找的值括起来，我们可以缩小选择范围，仅包含具有特定属性值的元素。在这种情况下，我们正在寻找那些\
  \ `href` 值为 `#` 的链接。\n\n\n\n\n这段代码可以运行，而且确实清晰简单，但它确实遇到了一个轻微的问题。如果用户的浏览器运行在怪异模式（quirks\
  \ mode）下，`$('html')` 选择将失效。（不确定怪异模式是什么意思？花时间阅读 [SitePoint 关于该主题的 CSS 引用页面](http://reference.sitepoint.com/css/doctypesniffing)\
  \ 以获取详细解释。）虽然你*应该*以触发标准模式的方式来标记页面，但有时你可能正在处理遗留代码，因此没有这种奢侈。为了让上述代码在怪异模式下运行，你需要使用选择器\
  \ `$('body')`。我们也可以针对两者以确保万无一失：`$('html, body')`。这反过来会在某些版本的 Opera 浏览器中引起问题，该浏览器（可能正确地）尝试同时滚动这两个元素。\n\
  \n“但你说过 jQuery 会解决我们所有的跨浏览器问题！”你可能会惊叹道。公平地说，它解决了*大多数*跨浏览器问题。这一个稍微棘手一点，而且在 jQuery\
  \ 核心库中并没有解决。幸运的是，绕过这个问题非常简单。更幸运的是，有人花时间将该解决方案（以及许多其他滚动功能）封装成名为 `ScrollTo` 的插件。\n\
  \n`ScrollTo` 插件可从[插件库](http://plugins.jquery.com/project/ScrollTo) 获取，它是一个用于滚动屏幕和溢出元素的稳定插件。它完全能够处理我们目前为止看到的任何滚动任务。\n\
  \n在下载并引入插件后，你就可以重写顶部链接的功能，并忘记所有对晦涩浏览器 bug 的担忧了：\n\n*chapter_03/15_page_scroll/script.js\
  \ (节选)*\n\n```\n$('a[href=#]').click(function() {\n  $.scrollTo(0,'slow');\n  return\
  \ false;\n});\n```\n\n这种句法对你来说可能有点奇怪，因为我们直接从 jQuery 别名调用了 `scrollTo`。这个插件非常聪明，它知道如果我们这样直接调用它，那么我们是想滚动整个窗口。如果我们想滚动某个特定的溢出元素，我们将使用传统的选择器语法，例如：`$('div#scrolly').scrollTo(0,\
  \ 'slow')`。\n\n`ScrollTo` 插件功能丰富，不仅限于通过整数值进行滚动。你可以传入相对值（如 `+=50px`）、DOM 元素（它将滚动页面以找到该元素）、选择器字符串、包含\
  \ `x` 和 `y` 坐标的哈希值，或者关键字 `max`（它将滚动到文档末尾）。你可以水平滚动也可以垂直滚动，它还有一些很棒的选项来微调你的目标。你可以在[插件主页上](http://flesler.blogspot.com/2007/10/jqueryscrollto.html)学习所有这些选项。\n\
  \n### 自定义滚动条\n\n客户皱着眉走到你的办公桌前，手里拿着一份签过的“绝对最终版”设计稿。“现在，”他开始说，“这里的滚动条看起来不会像这样，对吧？我的意思是，它们都是灰色的，非常突兀。”\n\
  \n## 调整大小\n\n在用户界面方面，“调整大小”有几种不同的含义：首先想到的是调整浏览器窗口的大小（这一事件经常让 Web 人员头疼）。但是，应用程序内部窗口的调整大小，以及图像或其他元素的调整大小也很常见。\n\
  \njQuery 包含了一种收集用户发起的窗口调整大小信息的方法，并且（通过 jQuery UI）了一种让用户对页面上任何元素拥有最终调整大小权限的方法。让我们深入学习吧！\n\
  \n### `resize` 事件\n\n`resize` 事件是一个核心 jQuery 事件，当文档视图被调整大小时就会触发。你有许多理由想要对此事件做出反应。但在查看实际示例之前，让我们确保理解了该事件是如何工作的：\n\
  \n```\n$(window).resize(function() {\n  alert(\"You resized the window!\");\n});\n\
  ```\n\n\n\n\n如果你使用 CSS 有了一段时间，你就会知道关于流式布局或固定宽度布局哪个更好，一直存在着不断的争论。一方面，流式布局可以最大限度地利用用户的屏幕空间；另一方面，固定宽度布局允许你设计出像素级精确的布局，并且你知道当用户在不同视口大小下查看时，它不会崩溃。\n\
  \n对于 StarTrackr！，我们可以兼顾两者的优点：设计两个独立的固定宽度布局，并通过捕获 `resize` 事件在它们之间进行切换。\n\n让我们开始吧！到目前为止我们使用的\
  \ StarTrackr! 网站宽度仅为简单的 650px。我们的第一个任务是编写一些样式让它变宽——我们将宽版本设定为 850px：\n\n`chapter_03/18_layout_switcher/wide.css`\n\
  \n```css\nbody #container {\n  width: 850px;\n}\n\nbody #container p {\n  width:\
  \ 650px;\n}\n\nbody #header {\n  background-image: url('../../css/images/header-corners-wide.png');\n\
  }\n\nbody #celebs table {\n  width: 650px;\n  margin-left: 5px;\n}\n```\n\n注意，我们在每个规则的开头都添加了看似多余的\
  \ `body`。这样做是为了让这些规则优先于基础样式表中任何针对相同元素的规则，因为它们的特定性更强。\n\n下一步是编写 jQuery 代码来添加或移除我们的新样式表。我们需要做的只是测试\
  \ `body` 元素的宽度是否大于 900px，如果是，则将样式表附加到 `head` 元素中；如果不是，则将其移除：\n\n`chapter_03/18_layout_switcher/script.js\
  \ (excerpt)`\n\n```javascript\nif ($('body').width() > 900) {\n  $('<link rel=\"\
  stylesheet\" href=\"wide.css\" type=\"text/css\" />')\n    .appendTo('head');\n\
  } else {\n  $('link[href=wide.css]').remove();\n} \n```\n\n这让我们陷入了小困境。我们需要在两种不同的情况下运行这段代码：一次是在首次加载页面时，另是在每次页面调整大小时运行。你可能会想直接复制并粘贴那段代码就完事了。\n\
  \n抵制这种诱惑！在代码中重复自己几乎总是一个坏主意：想象一种情况，几个月后，你决定 900px 是错误的切分点。你现在认为应该只在 1000px 左右切换样式表。你进入代码，更改值并重新加载页面。但它坏了，因为你忘记在另一个完全相同的代码块中更改相同的值。这种情况在任何类型的软件开发中都非常容易发生，代码越复杂，发生的概率就越高——而且越难追溯。\n\
  \n幸运的是，几乎每种编程语言都有结构来帮助我们处理这类情况，JavaScript（以及 jQuery）也不例外。到目前为止我们一直在使用匿名函数，但现在是时候给它们起个名字了：\n\
  \n`chapter_03/18_layout_switcher/script.js (excerpt)`\n\n```javascript\n$(document).ready(function()\
  \ {\n  stylesheetToggle();\n});\n\n$(window).resize(stylesheetToggle);\n\nfunction\
  \ stylesheetToggle() {\n  if ($('body').width() > 900) {\n    $('<link rel=\"stylesheet\"\
  \ href=\"wide.css\" type=\"text/css\" />')\n      .appendTo('head');\n  } else {\n\
  \    $('link[href=wide.css]').remove();\n  }\n}\n```\n\n## 可调整大小的元素\n\n`Resizable`\
  \ 组件允许用户通过拖动边缘调整元素的大小。默认情况下，它会在元素的四个角添加控制手。你可以使用各种选项来定制其行为。\n\n`Resizable` 有用的一个领域是你需要限制元素的大小时。例如，你可能希望防止用户将元素缩小得太小或将其放大太大。\n\
  \n`chapter_03/19_resizable_elements/script.js (excerpt)`\n\n```javascript\n$('p').resizable();\n\
  ```\n\n这使得所有的 `p` 元素都可调整大小，就像我们对段落元素操作的那样。效果如`图 3.7`所示。然而，我们指定了一些新参数来改进体验，并展示 `Resizable`\
  \ 组件的灵活性。\n\n## 可调整大小的文本域\n\n有时提供好界面可能会与设计冲突。例如，你可能希望防止用户在 `textarea` 中写入过多的文本。为了做到这一点，我们可以使用\
  \ `Resizable` 组件：\n\n`chapter_03/20_resizable_textarea/script.js (excerpt)`\n\n\
  ```javascript\n$('textarea').resizable({\n  grid: [20, 20],\n  minWidth: 153,\n\
  \  minHeight: 30,\n  maxHeight: 220,\n  containment: 'parent'\n});\n```\n\n\n\n\n\
  \n另一个你可能感兴趣的参数是 `handles` 参数。它指定了句柄将附加到元素的哪些侧，并决定了元素可以在哪些方向拉伸。该参数接受以下选项：`n`、`e`、`s`、`w`、`ne`、`se`、`sw`、`nw`\
  \ 和 `all`。你可以通过逗号分隔来指定任意数量的选项。例如，`{ handles : 'n', 'se'}` 为元素的顶部底部添加句柄。\n\n在内容长度变化巨大的输入页面中，看到这种功能非常常见。\n\
  \n### 面板拆分器 (Pane Splitter)\n\n尽管我们提供了免责声明消息功能，但客户的法律团队仍然担心由于未能妥善概述公司的条款和条件而可能产生的后果。从设计和可用性的角度来看，问题在于有整整页页的条款和条件被分为许多子章节——但它们又需要在主页上显著显示。也许一个拆分器可以帮到我们。\n\
  \n拆分器是一种 UI 组件，它能够划分页面上的多个区域，并允许用户调整元素的大小；这样，用户就可以决定为每个区域分配多少空间。拆分器在桌面应用程序中随处可见，随着富网络网络应用程序（RIA）的爆发，它们正在进入\
  \ Web 世界。我们可以利用对 `Resizable` 组件的经验，模拟一个简单的拆分器，其中一个面板包含“目录”，另一个面板包含 StarTrackr! 的“条款和条件”内容。该组件的外观见图\
  \ 3.9。\n\n![水平面板拆分器](img/fig_animating_pane_splitter.png)\n\n图 3.9. 水平面板拆分器\n\n\
  目前，我们将仅关注调整大小的功能。动态将每个章节的内容加载到面板中将在第 5 章中详细介绍。\n\n我们的拆分器将由两个 `div` 元素组成（代表每个面板），嵌套在一个具有固定尺寸的容器元素内部。我们将目录封装在一个块级元素中，这样当用户调整面板大时，文本就不会换行并破坏我们的嵌套列表：\n\
  \n*chapter_03/21_horizontal_pane_splitter/index.html (节选)*\n\n```\n<div id=\"splitter\"\
  >\n  <div class=\"pane\" id=\"tocPane\">\n    <div class=\"inner\">\n      …\n \
  \   </div>\n  </div>\n  <div class=\"pane\" id=\"contentPane\">\n    <div class=\"\
  inner\">\n      …\n    </div>\n  </div>\n</div>\n```\n\n现在我们将在新的 `splitter.css`\
  \ 样式表中添加一些简单的样式。你可以看到，我们固定了容器 `div` 的高度，并让每个子元素默认占据宽度的 50%。如果有必要从开始使用一个非 50:50 平分的替代方案，你可以更改此值以指定不同的值。如果你需要使用\
  \ CSS 边框，则必须以像素指定宽度，并确保它们之和等于总量：\n\n*chapter_03/21_horizontal_pane_splitter/splitter.css*\n\
  \n```css\n#splitter { \n  height: 150px;\n  margin-top: 30px;\n  margin-bottom:\
  \ 50px;\n}\n\n#splitter .pane {\n  width: 50%;\n  height: 100%;\n  float: left;\n\
  }\n\n#splitter h2 { \n  margin-bottom: 0; \n  padding-bottom: 0;\n}\n\n#tocPane\
  \ { \n  overflow: hidden;\n  background: #d6dde5 url(../images/handle.png) no-repeat\
  \ \n  right center;\n}\n\n#tocPane .inner { \n  width: 300px; \n}\n\n#contentPane\
  \ {\n  overflow: auto;\n}\n\n#contentPane .inner {\n  padding: 0 5px;\n}\n```\n\n\
  接下来是我们的 jQuery 代码。为了创建一个水平拆分器，我们将第一个元素设为可调整大小，并指定一个向东的句柄——这样只有 `div` 的右边缘是可以调整大小的。\n\
  \n如果你只用一个简单的 `resizable` 语句运行示例，你会发现我们已经快成功了：两个元素的作用*有些*像拆分面板——区别在于，当你拖动句柄时，右侧元素的宽度保持不变，而不是扩展以填充剩余空间。为了解决这个问题，我们需要在可调整大小组件的\
  \ `resize` 函数中进行一些计算。这是一个在组件调整大小时触发的事件处理程序：\n\n*chapter_03/21_horizontal_pane_splitter/script.js\
  \ (节选)*\n\n```javascript\n$('#splitter > div:first').resizable({ \n  handles: 'e',\
  \ \n  minWidth: '100',\n  maxWidth: '400',\n  resize: function() { \n    var remainingSpace\
  \ = $(this).parent().width() - \n    $(this).outerWidth();\n    var divTwo = $(this).next();\n\
  \    var divTwoWidth = remainingSpace - (divTwo.outerWidth() - \n    divTwo.width());\n\
  \    divTwo.css('width', divTwoWidth + 'px');\n  }\n});\n```\n\n### 重要：JavaScript\
  \ 变量\n\n`var remainingSpace = $(this).parent().width() - $(this).outerWidth();`\
  \ 将计算结果赋值给变量 `remainingSpace`。在代码之后以后，每我们需要访问此值时，只需编写 `remainingSpace`。\n\n接下来的行\
  \ `var divTwo = $(this).next();` 执行非常相似，只是这次我们将一个 jQuery 选择器赋值给变量 `divTwo`。此后可以像使用其他选择器一样使用它。\n\
  \n使用这样的变量有助于提高代码的可读性，因为你可以让每一行尽可能简洁。它还能提高代码效率；从变量中获取值比重新计算值快得多。\n\n如果我们想尝试实现一个垂直拆分器，更改并不不大：我们的面板元素堆叠在一起（而不是并排），并且我们的\
  \ `resizable` 调用使用了向南的句柄，而不是向东的。代码也几乎相同——但现在我们关注的是元素的高度，而不是宽度。\n\n*chapter_03/22_vertical_pane_splitter/script.js\
  \ (节选)*\n\n```javascript\n$('#splitter > div:first').resizable({ \n  handles: 's',\
  \ \n  minHeight: '50',\n  maxHeight: '200',\n  resize: function() { \n    var remainingSpace\
  \ = $(this).parent().height() - \n    $(this).outerHeight();\n    var divTwo = $(this).next();\n\
  \    var divTwoHeight = remainingSpace - (divTwo.outerHeight() - \n    divTwo.height());\n\
  \    divTwo.css('height', divTwoHeight + 'px');\n  }\n});\n```\n\n这些简单的拆分器非常实用，需要的代码极少，并且适用于许多目的。但如果你需要复杂的拆分行为，例如多个拆分面板或嵌套面板，请前往插件库并查看\
  \ jQuery Splitter 插件。\n\n\n\n\n多么精彩的章节啊！我们掌握了动画、滚动和缩放，并看到了链式调用（chaining）如何帮助我们以一种易读且自然的方式轻松编写简洁、强大的功能。我们开始应用\
  \ `jQuery` 知识来创建一些酷炫的效果了。然而，在阅读这本书的过程中，重要的重点不是效果本身，而是我们用于实现这些效果的底层概念。\n\n即使是看起来最复杂的效果，往往也是由几个简单的动作巧妙地链在一起而成的。这取决于你是否坐下来想出一些想法并尝试亲手实现它们。\n\
  \n# 第 4 章\n\n## 图片与幻灯片\n\n现在不能再胡闹了。在牢牢掌握了基础知识后，我们已经拥有创造世界级效果的无限潜力。我们的客户简直乐坏了；我们给了他想要的“Web\
  \ 2.0”，现在他那充满争议的创业公司已经受到了几家大型社交网络网站的青睐。他要求我们添加一些非常火的“东西”：“图片画廊、幻灯片、淡入效果——全都要！”为什么不呢？我们既有工具，也有才华！\n\
  \n如果没有图片，互联网将变得相当无聊（至少在视觉上如此）；我们在网络旅行中接收的大部分内容是以图片和设计元素的形式存在的，如边框、图标和渐变，这些元素有助于定义我们与网页的交互。当我们将所有这些元素与适量的\
  \ `jQuery` 结合时，我们开始看到一些生动且惊叹的效果出现。除了我们熟悉并喜欢的标准组件外，`jQuery` 还提供了实现一些不常见、较新的效果的功能的方法，这些功能仅用\
  \ `JavaScript` 是很难实现的。\n\n### 灯箱（Lightboxes）\n\n我们的客户想要 Web 2.0，所以让我们给他一个最典型的 Web\
  \ 2.0 效果：灯箱。`lightbox`——一个借自摄影的术语——用于在模态对话框中显示缩略图的全尺寸版本。通常，整个背景会变暗，以表示它已被禁用。用户必须与图片进行交互（例如点击关闭按钮）才能继续操作页面。\n\
  \n### 自定义灯箱\n\n灯箱现在非常常见，许多灯箱具有非常复杂的功能：动画、过渡，以及显示视频或通过 `Ajax` 加载内容的能力。一如既往，有很多优秀的插件可以完成所有这些，我们将在下一节中访问其中一个——但目前，我们将自己构建灯箱。\n\
  \n为什么要自己构建呢？对于我们的示例，我们只需要一个基础的图片查看器，不需要任何花哨，也不需要那些花哨所带来的字节开销。我们还将机会查看内部原理，看看这种功能是如何实现的。\n\
  \n我们的灯箱将极其简单：任何 `class` 名称为 `lightbox` 的 HTML 链接在点击时，都会弹出该链接指向的图片文件。图片将居于屏幕中央，周围区域将禁用并变暗，作为视觉提示。该效果在图\
  \ 4.1 中所示。\n\n让我们从 HTML 链接开始。它们只是指向带有 `lightbox` `class` 的图片文件的标签，因此我们可以在 `jQuery`\
  \ 中定位它们：\n\n*chapter_04/01_lightbox/index.html (节选)*\n\n```html\n<a href=\"/images/celeb01.jpg\"\
  \ class=\"lightbox\">Pic</a>\n```\n\n当图片显示时，我们希望整个屏幕变暗。我们如何做到这一点？最简单的方法是在页面上添加一个大的\
  \ `div`，其高度和宽度与屏幕本身一样。在 `div` 内部，我们将添加另一个 `div`，并在其中加载图片。\n\n![我们的灯箱效果](img/fig_images_lightbox.png)\n\
  \n图 4.1. 我们的灯箱效果\n\n覆盖层的样式非常简单：100% 的 `height` 和 `width`，以及黑色背景。稍后，我们将淡化元素的 `opacity`\
  \ 透明度，使其产生阴影效果。另一个技巧是在该元素的中心添加一个旋转的加载器图片。当我们开始加载图片时，旋转器将作为背景的一部分显示。当图片加载时它似乎会消失，但实际上它只是隐藏在了图片后面：\n\
  \n*chapter_04/01_lightbox/lightbox.css*\n\n```css\n#lightbox_overlay {\n  position:absolute;\n\
  \  top:0;\n  left:0;\n  height:100%;\n  width:100%;\n  background:black url(loader.gif)\
  \ no-repeat scroll center center;\n}\n\n#lightbox_container {\n  position:absolute;\n\
  }\n```\n\n接下来，我们为灯箱链接添加一个 `click` 处理程序。当它们被点击时，我们将添加深色覆盖元素、图片容器以及图片本身。对于我们的精简示例来说，容器并不是必须的，但当你想要扩展灯箱的功能时（例如添加边框、描述以及上一个和后一个按钮），它是很有用的：\n\
  \n*chapter_04/01_lightbox/script.js (节选)*\n\n```javascript\n$('a.lightbox').click(function(e)\
  \ {\n  // 隐藏滚动条!\n  $('body').css('overflow-y', 'hidden'); \n\n  $('<div id=\"overlay\"\
  ></div>')\n    .css('top', $(document).scrollTop())\n    .css('opacity', '0');\n\
  \n  $('<div id=\"container\"></div>')\n    .hide()\n    .appendTo('body');\n\n \
  \ $('<img />')\n    .attr('src', $(this).attr('href'))\n    .load(function() {\n\
  \      positionLightbox();\n    })\n    .appendTo('#container');\n\n  $('#overlay')\n\
  \    .css('opacity', 0)\n    .fadeIn(500);\n\n  $('#overlay').click(function() {\n\
  \    removeLightbox();\n  });\n\n  $('#container').click(function(e) {\n    e.stopPropagation();\n\
  \  });\n  \n  $('#container img').click(function() {\n    removeLightbox();\n  });\n\
  \n  return false;\n});\n```\n\n### 提示：快速元素构建\n\n创建新元素是非常令人满意的，这也是你必须频繁执行的任务。设置新\
  \ jQuery 对象的另一种方法是将一个对象作为第二个参数传递。该对象包含了你希望新项目拥的所有属性和设置。例如：\n\n```javascript\n$('img\
  \ />', {\n  src: $(this).attr('href'),\n  load: function() {\n    positionLightbox();\n\
  \  },\n  click: function() {\n    removeLightbox();\n  }\n}).appendTo('#container');\n\
  ```\n\njQuery 在响应你设置的属性方面非常智能。如果你给它一个事件，它会将提供的处理程序绑定到该事件（正如我们对 `load` 和 `click`\
  \ 所做）。如果你使用 jQuery 方法名如 `text`、`html` 或 `val`，它将使用 jQuery 方法来设置属性。其他所有内容将被视为属性，正如对\
  \ `src` 属性所做的一样。最终结果与我们之前构建的 jQuery 对象相同，但如果你熟悉 JavaScript 对象表示法，你可能更喜欢这种元素构建方法。\n\
  \n最后，我们添加 `return false;` 以防止 HTML 链接的默认行为发生。否则，用户将离开我们的页面并跳转到图片本身。\n\n现在让我们来看 `positionLightbox`\
  \ 函数：\n\n*chapter_04/01_lightbox/script.js (节选)*\n\n\n\n\n\n```javascript\nfunction\
  \ positionLightboxImage() {\n  var top = ($(window).height() - $('#lightbox').height())\
  \ / 2;\n  var left = ($(window).width() - $('#lightbox').width()) / 2;\n  $('#lightbox')\n\
  \    .css({\n      'top': top + $(document).scrollTop(),\n      'left': left\n \
  \   })\n    .fadeIn();\n}\n```\n\n当图片加载完成后，将调用 `positionLightboxImage` 函数。该函数负责将图片显示在屏幕中央。它通过获取窗口的高度或宽度减去图片的高度或宽度，并将结果除以\
  \ 2 来计算中心点。然后，它执行一个平美的淡入效果来显示图片。\n\n剩下的最后一个任务是在用户点击图片时移除灯箱（lightbox）。我们只需让新的新元素淡出然后将其移除，这样灯箱就可以为下张图片准备好再次触发：\n\
  \n`chapter_04/01_lightbox/script.js` (片段)\n\n```javascript\nfunction removeLightbox()\
  \ {\n  $('#overlay, #lightbox')\n    .fadeOut('slow', function() {\n      $(this).remove();\n\
  \      $('body').css('overflow-y', 'auto'); // 显示滚动条！\n    });\n}\n```\n\n这可能是你能想象到的最基础的灯箱了，但看到它运行起来依然是令人满足的。现在你已经了解了灯箱是如何构建的，就可以提出改进和自定义方案了。尽管插件可能随处可见，但有时自己构建它们会更有成就感！\n\
  \n### 使用 `console.log` 进行故障排除\n\n如果你尝试过扩展或自定义这个简单的灯箱（或者说，自定义我们目前为止见过的任何代码），你无疑遇到过代码运行结果不符合你预期的情况。要确切找出代码在任何给定时刻到底发生了什么可能是令人沮丧的。有时，你需要知道某个函数是否正在被调用，或者某个变量在特定时间点的值是什么。\n\
  \n传统上，这种调试通常通过老而可靠的 `alert` 方法来实现。例如，如果你需要知道代码在 `top` 变量中存储了什么值，你可以输入 `alert(top);`。但这会中断程序的执行流——并迫使你在继续之前关闭\
  \ alert 框。如果你感兴趣的代码位于循环中间，你可能最终不得不关闭大量的 alert 框。\n\n幸运的是，Web 开发工具正在不断进步，如果你使用出色的\
  \ Firefox Firebug 插件（早在第 2 章 中引入），你可以利用内置的调试选项。Firebug 最实用的功能之一就是控制台（console），在里面，你不需要弹出变量的值，而是可以使用命令\
  \ `console.log`：\n\n`chapter_04/01_lightbox/script.js` (片段)\n\n```javascript\nconsole.log(top,left);\n\
  ```\n\n只需打开 Firebug 的 Console 标签页（你可能需要先启用它），你就能看到显示的值。不再有烦烦的 alert 窗口了！你可以通过逗号分隔变量或表达式，在单个语句中指定你想要的任意数量的变量。不同类型的日志语句生成的输出结果如图\
  \ 4.2 所示：两个简单的字符串输出、一个包含两个数字的多变量输出，以及一个 jQuery 选择器。\n\n![Firebug 控制台](img/fig_images_firebug_console.png)\n\
  \n图 4.2. Firebug 控制台\n\n如果变量是一个 JavaScript 对象，你甚至可以在控制台中点击它来检查内容。如果它是一个 DOM 节点或\
  \ jQuery 对象，点击它将在页面上高亮显示，并跳转到 Firebug DOM 树中的对应位置。当你被那些讨厌的 Bug 卡住时，这会拯救你的理智！只需记住在发布代码时从代码移除任何\
  \ `console.log` 行。\n\n### ColorBox: 一个灯箱插件\n\n我们自定义的灯箱对于我们简单的需求是一个很好的解决方案，但你必须承认，在功能方面它是相当有限的。有时你需要更多。很长以来，“更多”的主要竞争者一直是\
  \ Cody Lindley 的 ThickBox。ThickBox 确实经历过许多大仗，但像所有真正的冠军一样，你必须知道什么时候该离开擂台挂拳了。\n\n\
  尽管 ThickBox 不再受到维护，但它仍然是一个强大的插件，并适合许多开发者。它完成了了自己的职责，而且做得很好。正是这种质量水平为新一代灯箱插件树立了高标准。让我们来看看主要的挑战者之一：ColorBox。\n\
  \n[ColorBox](http://colorpowered.com/colorbox/) 是 Jack Moore 的心结晶，具有一系列公共方法和事件钩子——以及惊人的\
  \ 37 个选项供选择——可能即使是经验丰富的用户也无法触及它提供的所有功能。鉴于 ColorBox 关注基于标准的 XHTML、依赖 CSS 进行样式设置以及对内容选项的广泛支持，很容易看出网页上的“轻量级”口号仅是指其微小的\
  \ 9KB 占用空间——而不是其庞大的功能集！\n\n从网站的下载区域获取 ColorBox 并检查其内容。有一个名为 `ColorBox` 的目录，包含了插件代码的压缩版和未压缩版。通常情况下，除非你想理解\
  \ ColorBox 的内部工作原理，否则应使用压缩版。\n\n下载包中还包含了一些示例目录；它们使用相同的标记和 JavaScript 代码，但展示了灯箱可以有完全不同的样式。最好的方法是查看示例，选择你最喜欢的\
  \ CSS 文件（以及图片），然后据此进行开发。\n\n我们从一个目录目录复制了 CSS 文件和文件文件到我们的 HTML 中：\n\n`chapter_04/02_colorbox_plugin/index.html`\
  \ (片段)\n\n```html\n<link rel=\"stylesheet\" href=\"colorbox.css\" type=\"text/css\"\
  >\n<script src=\"jquery.colorbox-min.js\" type=\"text/javascript\">\n</script>\n\
  ```\n\nColorBox 可以像我们在上一节中那样处理单张图片，但它更擅长展示幻灯片式的画廊——允许用户在图片之间移动，如图 4.3 所示。为了利用这一点，我们需要对显示的图片分组，ColorBox\
  \ 期望我们通过链接的 `rel` 属性来实现。\n\n![使用 Colorbox 插件的样式化的](img/fig_images_colorbox.png)\n\
  \n图 4.3. 使用 Colorbox 插件的样式化的\n\n在标记中，我们为分组的所有图片包含了 `rel=\"celeb\"`。现在可以使用 jQuery\
  \ 属性选择器找到这些图片：`a[rel=\"celeb\"]`。在选择上调用 `colorbox` 方法将为我们提供一个精美的灯箱：\n\n`chapter_04/02_colorbox_plugin/script.js`\
  \ (片段)\n\n```javascript\n$(document).ready(function() {\n  $('a[rel=celeb]').colorbox();\n\
  });\n```\n\n它默认情况下看起来和运行起来都很出色，但有很多选项可以尝试。在下面的示例中，我们为它提供了淡入过渡，而不是默认的弹性缩放（`speed`\
  \ 选项正如你猜的那样，指定了淡入持续）。为了适应 StarTrackr! 的风格，我们还将自定义灯箱文本的措辞。不过，这只是冰山一角——在 ColorBox\
  \ 网站上探索所有用于自定义灯箱的其他选项和事件吧：\n\n`chapter_04/02_colorbox_plugin/script.js` (片段)\n\n\
  ```javascript\n$('a[rel=celeb]').colorbox({\n  transition: 'fade',\n  speed: 500,\n\
  \  current: \"{current} of {total} celebrity photos\"\n});\n```\n\n\n\n\n\nColorBox\
  \ 的优秀之处在于它是高度的非侵入且可定制的：你可以更改行为设置、添加回调函数并使用事件钩，而无需修改你的 HTML 标记或插件源码。ColorBox 会预加载任何所需的图像——甚至可以开始预加载你的画廊图像——因此它在你的页面上始终显得非常敏捷。最后，也是同样重要的一点是，ColorBox\
  \ 是宽松的 [MIT 许可证](http://creativecommons.org/licenses/MIT/) 发布的——因此你可以根据需要将其用于你的商业项目。\n\
  \n## 使用 Jcrop 裁剪图像\n\n在我们查看成熟且优秀的插件和灯箱效果时，如果跳过了用于定义图像区域的 [Jcrop 插件](http://deepliquid.com/content/Jcrop.html)，我们将是失职的。该插件在图像上添加了一个类似灯箱式的叠加层，并允许用户拖动矩形来选择图像的所需区域。这种功能在许多大型网站上很常见，它允许用户裁剪上传的图片作为个人头像。\n\
  \n如果你对 Web 上的图像处理略有了解，你可能知道这类图像处理通常发生在服务器端。对吧？是的，没错——Jcrop 插件实际上并没有裁剪图像，它提供了一个直观的界面来定义用户想要裁剪图像的边界边缘。插件返回的结果可以传递给服务器以执行实际的图像处理。你可以在图\
  \ 4.4 中看到使用 Jcrop 裁剪图像的。\n\n![Jcrop 插件的运行](img/fig_images_jcrop.png)\n\n图 4.4. Jcrop\
  \ 插件的运行\n\n使用 Jcrop 插件的典型工作流是对用户显示需要裁剪的图像（无论是存储的图像还是新上传的图像），并叠加 Jcrop 界面。当用户完成选择后，坐标将发送到服务器，在服务器创建并保存结果以供显示或下载。\n\
  \n要应用 Jcrop 交互，你首先需要下载并解压文件。下载包中包含 Jcrop JavaScript 文件、一个很小的 CSS 文件、一个巧妙的动画 GIF（它负责在你选择区域时产生“移动线条”效果）以及一些突出\
  \ Jcrop 所有功能的演示页面。\n\n你需要包含 CSS（在页面顶部）和 JavaScript（在页面底部）文件。Jcrop.gif 图像应该与你的 CSS\
  \ 文件在同一目录下：\n\n*chapter_04/03_jcrop/index.html (节选)*\n\n```\n<link rel=\"stylesheet\"\
  \ href=\"css/jquery.Jcrop.css\" type=\"text/css\">\n<script src=\"jquery.Jcrop.min.js\"\
  \ type=\"text/javascript\"></script>\n```\n\n一旦一切就绪，你只需要向页面添加一张你想要变为可选择的图像。我们为图像分配了一个\
  \ ID，以便使用 jQuery 轻松地选择。如果你想让用户信号他们对自己的选择满意，你也可以添加一个可点击的按钮：\n\n*chapter_04/03_jcrop/index.html\
  \ (节选)*\n\n```\n<div id=\"crop\">\n  <img id=\"mofat\" src=\"../../images/mofat_400.jpg\"\
  \ alt=\"Mo'Fat\"/>\n  <input type=\"button\" value=\"crop\"/>\n</</div>\n```\n\n\
  在最简单的形式下，你只需要将 jQuery 插件应用于图像上。当你重新加载页面时，图像将带有可拖动的柄和叠加层：\n\n```\n$('#mofat').Jcrop();\n\
  ```\n\n插件暴露了几个实用的事件，你可以利用它们来监控用户正在选择什么。它还有许多默认选项，用于自定制选择器的工作方式。你可以限制裁剪区域的宽高比例以及最小和最大选择尺寸，以及背景叠加层的颜色和不透明度：\n\
  \n```\nvar jcrop = $('#mofat).Jcrop({\n  setSelect: [10,10,300,350],\n  minSize:[50,50],\n\
  \  onChange: function(coords) {\n    // 使用坐标\n  },\n  onSelect: function(coords)\
  \ {\n    // 使用坐标\n  }\n});\n```\n\n在这里我们包含了一些默认属性。`setSelect` 允许我们定义默认裁剪区域；我们需要向它传递一个坐标数组，格式为\
  \ `[x1, y1, x2, y2]`。`minSize` 选项是一个包含选择最小宽度高度的数组。我们还演示了如何捕获 `onChange` 和 `onSelect`\
  \ 事件。`onChange` 事件会在用户拖动柄或在图像周围移动选择框时触发多次。另一方面，`onSelect` 事件只在定义了选择时触发；即当用户停止拖动时。\n\
  \n事件处理程序接收一个包含 `x`、`y`、`x2`、`y2`、`w` 和 `h` 属性的坐标对象。因此，在你的处理代码中，你可以编写 `coords.w`\
  \ 来获取当前选择的宽度。\n\n目前为止 Jcrop 插件最常见的用途是在用户完成选择后定义发送到服务器的点。插件触发的事件对于此目的没有用，因为我们想知道用户是否已完成。在缺少此的情况下，我们需要直接从\
  \ `$` 以不同的方式调用 `Jcrop`。当这样调用时，它将返回一个特殊对象，准备链式到更多操作中。然而，为了获取这些内容，我们需要稍微修改我们的原始代码：\n\
  \n*chapter_04/03_jcrop/script.js (节选)*\n\n```\nvar jcrop = $('#mofat).Jcrop({\n\
  \  setSelect: [10,10,300,350],\n  minSize:[50,50]\n});\n\n$('#crop :button').click(function()\
  \ {\n  var selection = jcrop.tellSelect();\n  alert('selected size: ' + selection.w\
  \ + 'x' + selection.h);\n})\n```\n\n## 幻灯片\n\n每晚，StarTrack! 网站的客户使用他们购买的位置信息来寻找并拍摄世界社交精英。许多照片被发布回网站上，客户希望在首页上展示其中一些。我们对\
  \ jQuery 越来越熟练，所以我们告诉客户我们将为他们制作几个幻灯片的原型。首先，我们将查看一些图像交叉淡入的方法；即，在让一张图像淡出的同时让另一张图像淡入。然后，我们将查看几个滚动画廊，最后是一个更复杂的翻书风格画廊。在此过程中，我们将学习许多新的\
  \ jQuery 技巧！\n\n### 交叉淡入幻灯片\n\n如果你在电视行业工作，你会知道除非你是乔治·卢卡斯，否则他们允许使用的唯一过渡效果就是交叉淡入（也称为溶解）。其之所以是因为幻灯片、星芒和旋转过渡几乎总是看起来很俗气。这在电视领域之外也适用；回想一下你看到的最后一次\
  \ PowerPoint 演示文。\n\n在 Web 上进行图像交叉淡入有不同的技术——其优缺点大多归结为简单性与功能性的权衡。我们将涵盖用于交叉淡入项目的一些主要方法，以便你在需要时有选择可选。\n\
  \n#### 悬停淡入器\n\n\n\n\n\n我们将查看的第一个交叉融合器（cross-fader）是一个基础的翻滚器（rollover fader）；它与我们已经看过的悬停效果非常相似，只不过这次我们在两个状态之间执行渐变淡入效果。首先，我们需要解决在哪里以及如何存储悬停图像的问题。\n\
  \n该解决方案的原理是将两个图像都放入一个 `span`（或任何你喜欢的容器）中。悬停图像定位在第一张图像上方，并在用户鼠标悬停在上面之前保持隐藏；然后，隐藏的图像就会淡入。首先，我们设置好翻滚容器：\n\
  \n*chapter_04/04_rollover_fade/index.html (节选)*\n\n```\n<span id=\"fader\">\n  <img\
  \ src=\"../../images/glenda_200.jpg\" alt=\"Glendatronix\"/>\n  <img class=\"to\"\
  \ src=\"../../images/fader_200.jpg\" \n    alt=\"Darth Fader\"/>\n</span>\n```\n\
  \n为了隐藏悬停图像，我们使用了常用的 `position` 和 `display` 属性：\n\n*chapter_04/04_rollover_fade/style.css\
  \ (节选)*\n\n```\n#fader {\n  position: relative;\n}\n\n#fader .to {\n  display: none;\n\
  \  position: absolute;\n  left: 0;\n}\n```\n\n现在我们有了一个可以绑定 `hover` 事件处理程序的有趣对象了。既然知道容器内包含两张图像，我们可以使用\
  \ `:eq` 过滤器来访问它们：图像 0 是我们的可见图像，图像 1 是我们的悬停图像。\n\n### 注意：选择元素的方法不止一种\n\n我们主要使用这种方法是为了为了强调\
  \ `:eq` 选择器属性。我们还有其他几种方法可以访问容器内的两个图像：使用 `:first` 和 `:last` 过滤器、相应的 `.eq`、`.last`\
  \ 或 `.first` 动作、子选择器（`>`），或者简单地使用 `class` 类名。使用 jQuery 完成任务通常有多种方法，而选择通常取决于个人偏好。\n\
  \n这是我们将用于执行翻滚效果的代码：\n\n*chapter_04/04_rollover_fade/script.js (节选)*\n\n```\n$('#fader').hover(function()\
  \ {\n  $(this).find('img:eq(1)').stop(true,true).fadeIn();\n}, function() {\n  $(this).find('img:eq(1)').fadeOut();\n\
  })\n```\n\n这里没有使用新东西——除了我们使用了 `stop` 命令的高级版本（这是我们在第 3 章的“动画导航]部分第一次看到的）。我们为 `clearQueue`\
  \ 和 `gotoEnd` 都指定了 `true`，这样我们的淡入动画将立即停止其他正在排队的动画，并直接跳转到目标位置（在这种情况下，它将直接跳转到完全淡出的状态，这样我们可以让它重新淡入）。这可以防止在快速鼠标移入和移出时动画堆积。\n\
  \n你可能会考虑将此效果用于导航按钮——这是一个好主意！但另一个考虑是在 CSS 中也将悬停图像作为链接的 `:hover` 状态背景图像。这样，对于没有 JavaScript\
  \ 的用户，你的翻滚效果将作为传统的悬停按钮工作。\n\n### JavaScript 计时器\n\nWeb 是事件驱动的环境。元素大部分只是静静地留在页面上，等待用户出现并点击、滚动、选择或提交。当这些操作发生时，我们的代码就可以活跃起来并执行我们的意愿。但有时，我们希望避免等待用户操作，并希望以固定的频率执行任务。在我们接下来要构建的几个幻灯片中就会是这种情况：我们希望自动循环一系列图像，每隔几秒显示一张新的。\n\
  \n与该库的许多其他领域不同，jQuery 无需扩展 JavaScript 的计时器功能；基础的 JavaScript 方法简单、灵活且跨浏览器工作。它们共有两个：`setTimeout`\
  \ 和 `setInterval`。\n\n这两个计时器函数的工作原理都相同：它们在执行我们提供的代码之前会等待特定的时间。调用它们使用的语法也非常相似：\n\n\
  ```\nsetTimeout(<要运行的代码>, <需要等待的毫秒数>);\nsetInterval(<要运行的代码>, <需要等待的毫秒数>);\n```\n\
  \n关键区别在于，`setTimeout` 会等待指定的时期，运行我们给给它的代码，然后停止。相反，`setInterval` 会等待、运行代码——然后再次等待并再次运行代码——无限循环（直到我们告诉它停止为止）。如果我们传递的代码更新了元素的可见属性，并且我们分配的延迟相对较小，我们就可以实现动画的幻觉。事实上，在幕后，当我们使用\
  \ jQuery 的任何动画函数时，这就是 jQuery 正在的事情！\n\n正确使用计时器可能很复杂，很大程度上是因为它们导致了*作用域*问题上的问题，我们将在第\
  \ 6 章的“作用域]中详细讨论。然而，我们想要掌握它们，因为计时器是让我们的页面从用户触发事件的暴政中释放的关键！\n\n#### 设置计时器\n\n这是一个演示计时器工作的小示例：我们只需让一个绿框平滑地穿过屏幕。当然，我们可以依靠\
  \ jQuery 的 `animate` 方法来实现它。\n\n*chapter_04/05_timers/index.html (节选)*\n\n```\n\
  <div id=\"green\"></div>\n<div id=\"red\"></div>\n```\n\n（注：此处示例代码未在原文提供，但根据逻辑下文如下）\n\
  \n*chapter_04/05_timers/script.js (节选)*\n\n```\nsetInterval(function() {\n  // 移动绿框的逻辑\n\
  }, 200);\n```\n\n\n\n\n\n# 渐变幻灯片\n\n两张图片之间的交叉淡入（Cross-fading）非常简单：始终让一张淡入的同时让另一张淡出。如果我们把这个概念扩展到一组图片（例如旋转图片画库），任务就会变得稍微复杂一些。现在我们需要计算下要显示哪一张图片，并确保在显示完最后一张后能够循环。\n\
  \n在 jQuery 图片画库中，你会看到的一种常用技巧是通过隐藏除当前图片以外的所有图片来伪造交叉淡入。当需要进行切换时，你只需要隐藏当前图片，然后淡入下一张图片。由于图片之间没有发生真正的重叠，这并不真正属于交叉淡入；然而，这是一个简单的解决方案，可能正是你所需要的，所以我们先来看这个。我们将看到的下一个示例将是真正的交叉淡入。\n\
  \n我们的基础幻灯片将包含 `div` 内部的一组图片。我们将通过为一张图片分配 `class` `show` 来将其中一张指定为可见图片：\n\n*chapter_04/06_slideshow_fade/index.html\
  \ (节选)*\n\n```html\n<div id=\"photos\">\n  <img alt=\"Glendatronix\" class=\"show\"\
  \ \n    src=\"../../images/glenda_200.jpg\" />\n  <img alt=\"Darth Fader\" src=\"\
  ../../images/fader_200.jpg\" />\n  <img alt=\"Beau Dandy\" src=\"../../images/beau_200.jpg\"\
  \ />\n  <img alt=\"Johnny Stardust\" src=\"../../images/johnny_200.jpg\" />\n  <img\
  \ alt=\"Mo' Fat\" src=\"../../images/mofat_200.jpg\" />\n</div>\n```\n\n我们将默认隐藏所有图片。`show`\
  \ `class` 对于这个幻灯片有两个作用：它允许我们在 CSS 中定位并显示它，而且——同样重要的是——它为我们提供了获取当前图片的句柄。不需要跟踪像 `var\
  \ currentImage = 1` 这样的变量，因为 `class` 名称本身就充当了该变量。\n\n现在我们需要开始运行一个 JavaScript 定器，以便循环我们的图片。我们将编写一个每三秒调用自己一次的函数：\n\
  \n*chapter_04/06_slideshow_fade/script.js (节选)*\n\n```javascript\n$(document).ready(function()\
  \ {\n  slideShow();\n});\n\nfunction slideShow() {\n  var current = $('#photos .show');\n\
  \  var next = current.next().length ? current.next() : \n  current.parent().children(':first');\n\
  \n  current.hide().removeClass('show');\n  next.fadeIn().addClass('show');\n\n \
  \ setTimeout(slideShow, 3000);\n}\n```\n\n我们知道当前图片具有 `class` `show`，所以我们用它来选择。为了找到想要显示的下一张图片，我们使用了一些条件逻辑。如果下一个兄弟元素存在，我们就选择它。如果不存在，我们就选择第一张图片，这样幻灯片就会循环。\n\
  \n## 重要：三元运算符\n\n你可能对我们用于给 `next` 变量赋值的语法感到困惑。在 JavaScript（以及许多其他语言）中，这被称为三元运算符。它是条件设置变量的快捷方式。\n\
  \n语法 `a ? b : c` 意味着如果 `a` 为 `true`，则返回 `b`；否则返回 `c`。你可以将其用于变量赋值（如我们上面所做的那样），根据某些条件为同一个变量分配不同的值。当然，较长的\
  \ `if/else` 语句始终可以胜任，但三元运算符简洁得多，因此非常值得学习。\n\n所以，总结一下，这一行：\n\n```javascript\nvar\
  \ next = current.next().length ? current.next() : \ncurrent.parent().children(':first');\n\
  ```\n\n可以翻译为英文：如果当前元素在同一容器中后面有一个兄弟元素（如果 `next` 方法返回一个非空数组），我们将使用它。另一方面，如果 `next`\
  \ 返回一个空数组（因此 `length` 为 `0`，在计算机术语中为 `false`），我们将导航到当前元素的父元素（`#photos` `div`）并选择它的第一个子元素（这将是第一张照片）。\n\
  \n最后，我们隐藏当前图片并淡入下一张。我们还将 `show` `class` 从旧照片切换到新照片，并为 `slideShow` 方法设置一个超时，以便在三秒后调用它自己。\n\
  \n## 真正的交叉淡入\n\n我们的上一个解决方案看起来很不错——但它只是淡入，而不是交叉淡入。我们希望能够实现真正的交叉淡入：当当前图片淡出时，下一张图片正在淡入。实现\
  \ jQuery 效果有多种方法，我们将采取实现方法如下：\n\n1. 将图片堆叠在一起，使得 `z-index` 最高的图片显示出来。\n2. 淡出顶部图片，使下一张图片看起来在淡入。\n\
  3. 一旦淡入完成，重新排列图片的 `z-index`，使当前图片位于最上方。\n4. 重复步骤 2 和 3。\n\n这种技巧的缺点是我们将图片堆叠在一起，因此它们的大小必须相同。这通常不是一个大问题，因为在\
  \ Web 上被限制在特定区域是非常常见的。还应该注意，很容易将图片替换为 `div`，并能够对它们位置的任何 HTML 进行交叉淡入。\n\n### 注意：z-index\n\
  \n`z-index` 是一个 CSS 属性，用于指定元素的视觉堆叠顺序。`z-index` 值较高的元素将显示在值较低的前面。它可以与绝对定位或相对定位结合使用，将元素堆叠在一起。\n\
  \n回顾我们的大纲，你应该看出步骤 1 和 2 是直观的。让我们从堆叠图片开始：\n\n*chapter_04/07_slideshow_cross_fade/index.html\
  \ (节选)*\n\n```html\n<p id=\"photos\">\n  <img src=\"images/BarronJovi.png\" />\n\
  \  <img src=\"images/TheComputadors.png\" />\n  <img src=\"images/Bosom.png\" />\n\
  </p>\n```\n\n我们需要对图片进行绝对定位并将将其包含在边界框内：\n\n*chapter_04/07_slideshow_cross_fade/style.css\
  \ (节选)*\n\n```css\n#photos img {\n  position: absolute;\n}\n\n#photos {\n  width:\
  \ 180px;\n  height: 180px;\n  overflow: hidden;\n}\n```\n\n现在图片已经堆叠好了，让我们退一步进行计划。为了执行步骤\
  \ 4（重复下一张图片的淡入），我们需要将淡入代码放在某种循环中。由于循环需要跟踪当前照片，我们将代码移到一个命名函数，并在 `$(document).ready`\
  \ 块中调用它：\n\n*chapter_04/07_slideshow_cross_fade/script.js (节选)*\n\n```javascript\n\
  $(document).ready(function() {\n  rotatePics(1);\n})\n```\n\n现在我们将创建 `rotatePics`\
  \ 函数，它将完成所有的核心工作。该方法接受一个数字，应该是当前照片的索引。我们很快就会看到如何使用它，但首先我们将照片的总数存储在变量中。我们这样做是因为我们在代码中多次复用——存储在变量中意味着\
  \ jQuery 无需重复执行相同的计算：\n\n*chapter_04/07_slideshow_cross_fade/script.js (节选)*\n\n\
  ```javascript\nfunction rotatePics(currentPhoto) {\n  var numberOfPhotos = $('#photos\
  \ img').length;\n  currentPhoto = currentPhoto % numberOfPhotos;\n}\n```\n\n第二行代码是一种常用的\
  \ JavaScript 技巧，用于确保值在给定范围内。我们不希望 `currentPhoto` 超过照片总数，因此我们执行一个计算以确保传入的索引是有效的——通过对长度取**模**（modulus）。模在\
  \ JavaScript 中用 `%` 符号表示，它返回除法的*余数*。所以，如果我们总共有五张照片，并传入索引 6，操作结果为 `6 % 5 = 1`。该数字会有效地绕回开头，我们可以确保永远不会尝试显示一张不存在的照片！\n\
  \n\n\n\n我们使用 jQuery 的 `eq` 遍历命令来获取当前图片。`eq` 是“equals”（等于）的缩写——它从一组元素中选择索引等于我们传递的数字的元素。我们将变量\
  \ `currentPhoto` 传递给它来选择当前图片。选中图片后，我们简单地让它淡出，并运行一个回调函数来为下一次淡入做好准备工作：\n\n`chapter_04/07_slideshow_cross_fade/script.js\
  \ (excerpt)*`\n\n```javascript\n$('#photos img').eq(currentPhoto).fadeOut(function()\
  \ {\n  // 重新排序 z-index\n  $('#photos img').each(function(i) {\n    $(this).css(\n\
  \      'zIndex', ((numberOfPhotos - i) + currentPhoto) % \n      numberOfPhotos\n\
  \    );\n  });\n\n  $(this).show(); \n  setTimeout(function() {rotatePics(++currentPhoto);},\
  \ 4000);\n});\n```\n\n这里发生了几件事。首先，我们进行了一些数学计算来重新排列图片。我们将每个图片的索引相对于当前显示的图片索引进行偏移。然后，我们再次使用了新的取模技巧，结果是每张图片的\
  \ `z-index` 都随机移动了 1。要看到实际效果，请打开 Firebug 并在效果运行期间检查图片：你会看到每当有一张新图片显示时，`z-index`\
  \ 属性都会洗牌一次。\n\n一旦我们完成了重新排序，我们刚刚淡出的图片将位于堆的最底部。这意味着我们可以安全地再次显示它，为下一次它出现在顶端做好准备：只需简单的\
  \ `$(this).show()`。\n\n然后调用了定时器函数 `setTimeout`，设置在 4,000 毫秒后再次运行该函数。我们通过编写 `++currentPhoto`\
  \ 将下一张图片的索引传递给它。\n\n### 重要：自增自减\n\n在 JavaScript 中，如果你在数字变量的前后加上 `--` 或 `++`，该变量将分别递减或增加\
  \ 1。这对于我们已经过的 `-=` 和 `+=` 运算符来说是一个非常方便的快捷方式。\n\n`++a` 和 `a++` 之间的区别细微，但非常重要。如果你在代码中使用它们，第一种形式（`++`\
  \ 或 `--` *位于*变量名*之前*）会在返回变量*之前*增加变量。第二种形式将返回未修改的值，*然后*再增加它。\n\n在我们上面的代码中，我们想要用增加后的新值调用函数，因此我们使用\
  \ `++currentPhoto`。\n\n尽管尝试不同的效果类型；除了淡入效果，你还可以尝试使用 `slideUp` 效果，或者 jQuery UI 效果插件之一。\n\
  \n#### 使用插件进行淡入\n\n正如你所想象的，已经有无数 jQuery 插件用于图片之间的切换。如果你有某些高级需求（有时你可能只需要一个星爆式的擦除效果），直接前往插件库可能是个好主意。\n\
  \n### 提示：在使用插件之前\n\n你在网络上找到的许多 jQuery 插件都是很久以前开发的，从那以后就在不同程度上被遗弃了。如果没有持续的开发和改进，它们通常会比较慢且多\
  \ Bug。尝试理解你向网站添加了什么总是一个好主意，而不是盲目地包含六个插件文件。如果代码很重（文件体积）并且包含许多你需求不需要的功能，也许一个更轻量级、定制的解决方案更为合适。\n\
  \n尽管如此，许多插件提供了优秀且文档完备的代码，这将为你节省大量的时间和精力。只需确保充分考虑你的选项即可！\n\n现在我们将查看两个可以来实现幻灯片效果的插件；其中一个极其轻量，而另一个具有更多功能。\n\
  \n### 带有 InnerFade 的新闻滚动条\n\n[InnerFade](http://medienfreunde.com/lab/innerfade/)\
  \ 是一个微型插件，允许你在一系列元素之间切换，就像我们刚刚构建的淡入图片库一样。与我们的代码相比，它确实有几个值得考虑的优点。首先它是一个插件——这意味着可以在任何需要的地方轻松引入。当然，我们也可以轻松地将代码变成插件（只需跳转到\
  \ 第 9 章中名为“Plugins”的章节 来查看它是有多简单）。它还有一些额外的选项，为我们提供了更大的灵活性：以随机顺序显示项目、为活动元素提供 `class`\
  \ 名称以及选择不同的动画类型。\n\n你可能认为，将所有这些功能添加到我们的自定义代码中其实相当容易——毕竟，我们正朝着成为 jQuery 忍者的道路前进！如果你觉得好奇，打开\
  \ InnerFade 插件文件查看这些功能是如何实现的。\n\n你可能会认为，所有这些功能都非常容易添加到我们的自定义代码中——毕竟，我们正朝着成为 jQuery\
  \ 忍者的道路前进！如果你觉得好奇，打开 InnerFade 插件文件查看这些功能是如何实现的。\n\n你可能会认为，所有这些功能都非常容易添加到我们的自定义代码中——毕竟，我们正朝着成为\
  \ jQuery 忍者的道路前进！如果你觉得好奇，打开 InnerFade 插件文件查看这些功能是如何实现的。\n\n你可能会认为，所有这些功能都非常容易添加到我们的自定义代码中——毕竟，我们正朝着成为\
  \ jQuery 忍者的道路前进！如果你觉得好奇，打开 InnerFade 插件文件查看这些功能是如何实现的。\n\n\n\n\n现在你对这些设置应该非常熟悉了：下载插件并将\
  \ JavaScript 文件添加到页面的 head 部分中。下载包中实际上包含了三个不同版本的插件：一个仅包含幻灯切换的基础版本（`jquery.cycle.min.js`，16KB），一个包含多种可用切换效果的全功能版本（`jquery.cycle.all.min.js`，25KB），以及一个仅包含基础选项的精简版本（`jquery.cycle.lite.min.js`，4KB）。为了说明可用选项，我们将使用完整功能版。\n\
  \n我们将从与之前幻灯片示例完全相同的 HTML 标记开始。你可以使用 `Cycle` 插件轻松地实现图片的淡入淡出，但考虑到它提供了许多更华丽的选项，让我们尝试一种并“洗牌”图片：\n\
  \n*chapter_04/09_cycle_plugin/script.js (节选)*\n\n```javascript\n$('#photos').cycle({\n\
  \  fx: 'shuffle'\n});\n```\n\n这种效果在图 4.5 中所示。\n\n![Cycle 插件中包含的洗牌效果](img/fig_images_cycle.png)\n\
  \n图 4.5. Cycle 插件中包含的洗牌效果\n\n插件为我们提供了超过 20 种浏览画廊的方式：首先是 `shuffle`（洗牌）、`fade`（淡入）、`zoom`（缩放）、`wipe`（扫除）、`toss`（抛）、`curtainX`（横帘）、`growY`（垂直增长）……此外，如果你找不到适合需求的效果，还可以自定义插件以包含你自己的切换效果。\n\
  \n`Cycle` 提供的选项数量非常惊人，可能远超你需要的量。让我们尝试一个更复杂的例子：\n\n*chapter_04/10_cycle_plugin_2/script.js\
  \ (节选)*\n\n```javascript\n$('#photos').cycle({\n  fx: 'scrollDown',\n  speedIn:\
  \ 2500,\n  speedOut: 500,\n  timeout: 0,\n  next: '#photos'\n});\n```\n\n`timeout`\
  \ 设置控制切换之间的时间——但值 `0` 代表什么呢？在这种情况下，它意味着“不要动画”。相反，我们使用了 `next` 选项来选择一个元素，点击该元素将进入下一张幻灯片。该选择器就是幻灯片本身——所以要移动到下一张图片，只需点击图片即可。\n\
  \n此外，我们使用了 `speedIn` 和 `speedOut` 选项来指定“入”和“出”动画的持续时间：我们选择*缓慢地*让下一张图片进入视野，同时快速地移除最后一张。可用的选项非常多，你可能需要进行一些深入的尝试才能用尽所有可用效果的可能。\n\
  \n### 滚动幻灯片\n\n正如我们在使用 `Cycle` 插件时看到的，淡入淡出远不是在图片之间切换的唯一方法。在接下来的几个示例中，我们将探索另一种创建交互式幻灯片的技巧。我们将把所有图片放入一个巨大的容器中，并使用包装元素隐藏除一张或几张之外的所有图片。然后，当我们想要显示不同的图片时，只需将元素滚动到所需的位置。\n\
  \n#### 缩略图滚动器\n\n我们对滚动画廊的首次尝试将是一个水平缩略图列表。如果你点击控件，列表将滚动以显示更多图片。\n\n为了构建此控件，我们需要两个元素。包装元素与容器一样大..\
  \ the the..我们 the 我们我们 想要显示不同的图片时，我们只需将元素滚动到所需的位置。这里是 HTML 标记：\n\n*chapter_04/11_thumbnail_scroller/index.html*\n\
  \n```html\n<div id=\"photos\">\n  <div id=\"inner\">\n    <img alt=\"glenda\" src=\"\
  ../../images/glenda.jpg\" />\n    <img alt=\"ender\" src=\"../../images/ender.jpg\"\
  \ />\n    <img alt=\"beau\" src=\"../../images/fader.jpg\" />\n  </div>\n</div>\n\
  ```\n\n外部元素需要处理内容，所以我们需要 `overflow: hidden`。对于我们的滚动器，我们定义宽度为：\n\n*chapter_04/11_thumbnail_scroller/style.css*\n\
  \n```css\n#photos {\n  width: 600px;\n  overflow: hidden;\n}\n\n#inner {\n  width:\
  \ 1200px;\n  position: relative;\n}\n\n#inner img {\n  float: left;\n  width: 200px;\n\
  }\n```\n\n当我们点击控件时，列表将滚动以显示更多图片。这里是 JavaScript 逻辑：\n\n*chapter_04/11_thumbnail_scroller/script.js*\n\
  \n```javascript\n$('#inner').click(function() {\n  var currentPos = parseInt($(this).css('left'));\n\
  \  var totalWidth = $(this).width();\n  var containerWidth = $('#photos').width();\n\
  \  var maxScroll = totalWidth - containerWidth;\n\n  if (currentPos <= 0) {\n  \
  \  $(this).animate({left: -maxScroll}, 500);\n  } else {\n    $(this).animate({left:\
  \ 0}, 500);\n  }\n});\n```\n\n\n\n\n| (5) | 如果剩余空间比我们想要滚动的还要少，我们将更改 `nextScroll`\
  \ 变量，使其只带我们到图像的末尾。 |\n\n| (6) | 最后，我们进行滚动。如果我们还没有到达图像的末尾（如果我们的当前位置小于总可滚动宽度），我们就按照计算出的数值向左滚动。否则（如果已经到达图像的末尾），我们就一直滚回开头。\
  \ |\n\n如果你觉得对于一个相当简单的效果来说，这些代码太太多了，那么你是对的！如果有一种方法不需要进行所有这些计算就能滚动内容就好了……\n\n####\
  \ 使用 scrollTo 实现的滚动画廊\n\n你可能还记得，回当我们在第 3 章 中查看滚动内容时，我们提到一个用于页面滚动的非常有用的插件：`scrollTo`。除了滚动整个页面，`scrollTo`\
  \ 插件在滚动溢出元素（如画廊中的元素）方面也表现出色！在我们第一次尝试制作缩略图画廊时，我们不得不进行大量的计算，来确定滚动区域有多大，以及我们是否处于容器的末尾或开头。\n\
  \n`scrollTo` 插件会自动为我们解决其中的许多问题，因此我们可以专注于添加更复杂的功能。在这个演示中，我们将移除缩略图列表，并用较大的图像替换它们。大图像将包含在一个网格中——但我们每次只显示一张。当用户点击图像时，将在网格中滚动，并停在一个新的随机图片上。\n\
  \n首先，我们需要一个图片列表。为了简单起见，将其设置为 `div` 容器内部的一组 `img` 标签——该容器本身又包含在另一个 `div` 之中。你可能喜欢将其设置为\
  \ `div` 内部的无序列表，这样在语义上更好，但我们最终需要一个与网格一样大宽的块级元素。这需要放在具有 `overflow: hidden`（或 `auto`）的元素内部。这就是我们的意思：\n\
  \n*chapter_04/13_scrolling_gallery/index.html (节选)*\n\n```\n<div id=\"pic_container\"\
  >\n  <div id=\"pic_scroller\">\n    <img alt=\"Glendatronix\" src=\"../../images/glenda_200.jpg\"\
  \ />\n    <img alt=\"Darth Fader\" src=\"../../images/fader_200.jpg\" />\n    …\n\
  \    <img alt=\"Beau Dandy\" src=\"../../images/beau_200.jpg\" />\n  </div>\n</div>\n\
  ```\n\n我们将 `pic_container` `div` 的宽度设置为例如三张图片的宽度，高度设置为四张图片的高度；因此，图片将被限制在 3x4 的网格中。对于这个演示，我们将使用\
  \ 200x200px 的图像，因此我们的容器需要是 800px 宽和 600px 高。然后我们将可见区域设置为单个图像的大小，并隐藏所有其他部分：\n\n*chapter_04/13_scrolling_gallery/style.css\
  \ (节选)*\n\n```\n#pic_container {\n  overflow: hidden;\n  height: 200px;\n  width:\
  \ 200px;\n  margin-bottom: 15px;\n}\n\n#pic_scroller {\n  height: 600px;\n  width:\
  \ 800px;\n  overflow: hidden;\n}\n\n#pic_scroller img {\n  float: left;\n}\n```\n\
  \n现在我们的网格准备就绪，我们可以添加一些随机滚动的魔法粉。我们首先获取所有图像，然后随机选择一张并使用 `scrollTo` 滚动到那里：\n\n*chapter_04/13_scrolling_gallery/script.js\
  \ (节选)*\n\n```\n$('#pic_scroller').click(function() {\n  var numberOfPics = $(this).find('div\
  \ > img').length;\n  var next = Math.floor(Math.random() * numberOfPics);\n  $(this)\n\
  \    .scrollTo(\n      '#photos_inner>img:eq(' + next + ')',\n      {duration: 1000}\n\
  \    );\n});\n```\n\n这比我们上一个例子要简单得多！插件处理了几乎所有复杂的部分。尽管如此，这里有两个新的 jQuery 语法：`find`\
  \ 动作和 `:eq` 过滤器。`find` 函数的作用方式与主 jQuery `$` 选择器本身非常相似，不同在于它只在当前选中的元素内进行搜索，而不是整个文档。\n\
  \n`:eq` 过滤器的工作与我们之前看到的 `eq` 动作完全一样，只是它是一个过滤器，所以你在选择器字符串内部使用它。我们传递它一个 0 到图像总数之间的随机数，以选择一张随机图像。\n\
  \n### 注意：随机数\n\n`Math.random` 会给你返回一个 0 到 1 之间的随机数。但很多时候，你寻找的是给定范围内的随机整数。实现这一点的最简单方法是编写\
  \ `Math.floor(Math.random() * maximum)`。你将分数乘以你想要的最大数，然后向下取整到最近的整数。\n\n`Math.random`\
  \ 会给你返回一个 0 到 1 之间的随机数。但很多时候，你寻找的是给定范围内的随机整数。实现这一点的最简单方法是编写 `Math.floor(Math.random()\
