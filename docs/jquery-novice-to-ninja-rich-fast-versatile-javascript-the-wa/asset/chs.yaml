- "# JQuery 从新手到大师；[丰富、快速、多功能；Javascript 应有的样子]\n\n\n\n![](img/cover.png)\n\n\n![SitePoint®](img/sitepoint-logo.png)\n\
  \n\n* * *\n\n## 关于 Earle Castledine\n\nEarle Castledine（又名 Mr Speaker）拥有信息技术硕士学位，并在\
  \ Web 领域拥有极其丰富的实战经验，他对所有与计算机相关的事物都感兴趣。他在各种 8 位家用电脑的“荒野”中长大，于 20 世纪 90 年代中期进入互联网并一直在那里生活工作。\n\
  \n作为一名高级系统分析师和 JavaScript 漫游者，他既沉迷于 `.NET` 代码的泥沼，也乐于在移动应用和游戏的茂密丛林，以及客户端交互开发的各种云朵中穿梭。\n\
  \n作为客户端端杰作 [TurnTubelist,](http://www.turntubelist.com/) 以及无数次网络实验的共同创造者，Earle 认为互联网并不是社会变革的润滑剂，而是释放各种有趣的\
  \ ECMAScript 小道具和有趣的消遣技术的工具。\n\n## 关于 Craig Sharkie\n\n美术艺术学位是进入编程热忱职业生涯的一个奇特切入点，但这正是\
  \ Craig 的起点。通过右脑思维处理代码和解决问题，使他在 Web 领域的许多知名公司效力，包括 AOL、Microsoft、Yahoo!、Ziff-Davis，以及现在的\
  \ Atlassian。\n\n这种热情以及对牛牛津逗号（serial commas）等符号的热爱，引导他走过了从新闻到开发，再到会议，最后进入出版领域的道路。他在\
  \ 1995 年接触 JavaScript，在 Crockford 创造该术语之前一直是“良好部分”的布道者，现在他将这种敏锐带到了 jQuery 中。\n\n\
  ## 关于技术编辑\n\nLouis Simoneau 于 2009 年加入 SitePoint，在此之前从家乡蒙特利尔到加加、台北，最后来到墨尔本。现在他每天都可以花时间学习酷的\
  \ Web 技术，这项活动以前只能在晚上和周末进行。他喜欢嘻哈、辣食和所有极客事物。\n\n## 关于首席技术官\n\n作为 SitePoint 的首席技术官，Kevin\
  \ Yank 关注网络技术领域所有新颖和令人的事物。他最广为人知的作品是书籍 *Build Your Own Database Driven Web Site\
  \ Using PHP & MySQL*，他还与 Cameron Adams 合著了 *Simply JavaScript*，并与 Rachel Andrew\
  \ 合著了 *Everything You Know About CSS Is Wrong!*。此外，Kevin 主持 *SitePoint Podcast*\
  \ 并共同编写了 *SitePoint Tech Times*，这是一份面向全球超过 240,000 名订阅者的免费电子邮件通讯。\n\nKevin 住在澳大利亚墨尔本，喜欢在会议上演讲以及回加拿大探望亲友。他还热于参加\
  \ Impro Melbourne 即兴喜剧表演（http://www.impromelbourne.com.au/）以及飞行轻飞机。Kevin 的个人博客是\
  \ *Yes, I’m Canadian* (http://yesimcanadian.com/)。\n\n## 关于 SitePoint\n\nSitePoint\
  \ 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
  \ 访问我们的博客、通讯邮件、文章和社区论坛。\n\n* * *\n\n给 Amelia。\n\n我本在这里放一张我头顶手持音响的照片，但他们不让。\n\n你愿意嫁给我吗？\n\
  \n—Earle\n\n给 Jennifer：\n\n那些见过我的人\n\n自从我认识了你\n\n从未理解过\n\n你带给我的\n\n美好\n\n一直\n\n\
  —Craig\n\n# 序言\n\n无论你是哪种忍者——厨师忍者、公司律师忍者，还是真正的*忍者*——精通的关键在于首先掌握行业的基础工具。一旦攻服了它们，就取决于真正的忍者如何以创意和创新的方式应用这些知识了。\n\
  \n最近，jQuery 证明自己是一个简单但强大的工具，用于驯服和转换网页，让即使是最顽固和过时的浏览器也能听从我们的意愿。jQuery 是一个有两个主要目的的库：操纵网页上的元素以及协助\
  \ Ajax 请求。当然，有很多命令可以实现这些功能——但它们都是一致且易于学习的。一旦你链联了前几个操作，你就会沉迷这些构建模块，你的朋友和家人会希望你永远从未发现过它！\n\
  \n在 jQuery 核心库之上是 jQuery UI：一组精美的控件和小部件（如手风琴、标签页和对话框），结合了一系列全功能行为，用于实现你自己的控件。jQuery\
  \ UI 让你能够以很小的努力快速拼凑出极佳的界面，并作为你通过少量知识就能成就的伟大典范。\n\n从核心来说，jQuery 是一个帮助我们提高网站易用性并创造更好用户体验的工具。**易用性**是指对象*感知效率或优雅感*背后原理的研究。jQuery\
  \ 绝仅仅是花哨、潮流的设计，它让我们能够快速且愉快地以既微妙又极端的方式雕刻我们的页面：从精调一个简单的滑动面板，到实现一个你睡梦中发明的全新用户交互。\n\n\
  成为忍者并不是要从头到尾背下一个 API——那只是记忆力好。当你能够应用知识来创造一些非凡的东西时，真正的技能和价值就会产生：一种建立在过去综合见解之上，并比以前任何人做过的都要好一点点的东西。这确实不容易——但多亏了\
  \ jQuery，尝试本身就很有趣。\n\n## 谁应该读这本书\n\n\n\n\n\n如果你是一名希望为自己的网站增添酷炫交互效果的前端网页设计师，而且你听过了所有关于\
  \ jQuery 的热烈讨论并想搞清楚它到底厉害在哪里，那么这本书将带你走上正确的道路。如果你曾接触过 JavaScript，但一直由于许多看似简单的任务的复杂性而感到沮丧，我们将向你展示\
  \ jQuery 如何帮助你。即使你已经熟悉 jQuery 的基础知识，但想将自己的技能提升一个层次，你也会在这里找到大量的优秀编程建议和深度知识。\n\n你应该已经具备中级及以上的\
  \ HTML 和 CSS 技能，因为 jQuery 使用 CSS 样式选择器来定位页面元素。具备一些基础编程知识会有帮助，因为 jQuery 尽管有巧妙的抽象，但它仍然基于\
  \ JavaScript。尽管如此，我们已经尝试在在使用任何 JavaScript 概念时对其进行解释，所以只要你愿意学习，就会表现得没问题。\n\n## 本书内容\n\
  \n读完本书后，你将能够处理静态的 HTML 和 CSS 网页，并用一点 jQuery 魔法让它们活起来。你将学习如何选择页面上的元素、移动它们、完全删除它们、使用\
  \ Ajax 添加新元素、为它们制作动画……简而言之，你将能够随心所欲操控 HTML 和 CSS！我们还涵盖了 jQuery UI 库强大的功能。\n\n本书由以下九章组成。按开头到尾的顺序阅读以获得对主题的完整理解，或者如果你只需要刷新特定主题，也可以跳着读。\n\
  \n### 第 1 章：爱上 jQuery\n\n在我们深入学习 jQuery 的所有细节之前，我们将快速查看为什么你起初想要使用它：为什么它比自己编写 JavaScript\
  \ 好，以及为什么它比市上的其他 JavaScript 库更好。我们将复习一些对理解 jQuery 至关重要的 CSS 概念，并简要介绍调用 jQuery 运行的基本语法。\n\
  \n### 第 2 章：选择、装饰与增强\n\n从表面上看，jQuery 相比原生 JavaScript 最显著的优势在于它让你能够轻松选择页面上的元素进行操作。我们将从本章开始，教你如何使用\
  \ jQuery 选择器来定位目标元素，然后将你如何使用 jQuery 更改这些元素的 CSS 属性。\n\n### 第 3 章：动画、滚动与调整大小\n\n\
  jQuery 在动画方面非常出色：无论你是想轻轻滑开菜单，还是让一个对话框飞过屏幕，jQuery 都能为你提供帮助。在本章中，我们将探索 jQuery 广泛的动画助手，并通过增强一些简单的用户界面组件来将其付诸实践。我们还将快速查看一些用于页面滚动和让元素可调整大小的类似助手。\n\
  \n### 第 4 章：图片、幻灯片与交叉融合\n\n在掌握了基础知识之后，我们将转向构建一些最常见的 jQuery 组件：图片库和幻灯片。我们将学习如何构建灯箱显示、滚动缩略图库、交叉融合淡出图库，甚至尝试制作一个类似\
  \ iPhoto 风格的翻页书。\n\n### 第 5 章：菜单、标签、工具提示与面板\n\n现在我们已经熟练使用 jQuery 构建酷炫的 UI 组件，我们将深入研究一些稍微复杂的控件：下拉菜单和手风琴式菜单、标签页界面、工具提示以及各种类型的内容面板。我们现在正处于良好状态：我们的网站看起来越来越不像\
  \ 90 年代那种手册式的页面，而是越来越像 21 世纪的富交互网络应用（RIA）！\n\n# 第 6 章：构建、Ajax 与交互\n\n这是大家一直期待的：Ajax！为了在\
  \ Web 上制作真正的桌面级应用程序，你需要在服务器之间往传递数据，而不会让任何烦人的刷新清空屏幕上的界面——这正是 Ajax 的核心所在。jQuery 包含了许多方便的方法，可以以简单、跨浏览器的方式处理\
  \ Ajax 请求，让你能带着微笑结束工作。但在我们变得太兴奋之前——我们的代码正变得越来越复杂，所以我们最好看看一些组织代码的最佳实践。所有这些以及更多内容都在第\
  \ 6 章。\n\n### 第 7 章：表单、控件与对话框\n\n表单是每个设计师的噩梦，尽管它们是任何 Web 应用程序的关键基石。在本章中，我们将学习 jQuery\
  \ 在简化表单相关脚本方面能为我们提供什么。我们将学习如何动态验证表单、为用户提供帮助，并轻松操作复选框、单选按钮和选择列表。然后我们将查看一些不常规的方法，让网站用户与之交互：各种高级控件，如日期选择器、滑块和拖放。\n\
  \n### 第 8 章：列表、树形与表格\n\n无论你的应用程序有多像“Web 2.0”，你可能仍然需要依靠普通的列表、单调的树形结构甚至经常被使用的表格来向用户展示信息。这一章展示了\
  \ jQuery 如何让无聊的内容也变得有趣，并将表格转换为数据网格。\n\n# 第 9 章：插件、主题与高级主题\n\njQuery 不仅仅是 DOM 操作、简单的\
  \ Ajax 请求和酷炫的 UI 组件。它拥有许多针对更高级开发者的功能：插件架构、高度可扩展且灵活的核心、可自定义的事件以及更多内容。在本章中，我们还将涵盖\
  \ jQuery UI 主题系统，它让你能够轻松定制 jQuery 组件的外观以适应你的网站，甚至让你自己的插件也能通过主题换肤。\n\n## 在哪里寻找帮助\n\
  \njQuery 正在活跃开发中，因此很有可能在你读到此书时，这些技术中的某些细微细节或其他已经发生了变化。幸运的是，SitePoint 拥有一个活跃的 JavaScript\
  \ 和 jQuery 开发者社区，随时准备在你遇到问题时为你提供帮助。我们还维护了一本书的已知错误列表，你可以查阅以获取最新更新；详情如下。\n\n### SitePoint\
  \ 论坛\n\n[SitePoint 论坛](http://www.sitepoint.com/forums/)是讨论论坛，你可以在那里询问任何 Web 开发的问题。当然，你也可以回答问题。这就是讨论论坛运作的方式——有些人提问，有些人回答，大多数人两者兼顾。分享知识不仅能帮助他人，还能加强社区。它是学习新知识、快速获得答案增加乐趣的好方法。许多有趣且经验丰富的网页设计师和开发者经常在那里聚集。\n\
  \n[JavaScript 论坛](http://www.sitepoint.com/forums/forumdisplay.php?f=15) 是你针对任何关于\
  \ jQuery 问题想要去的地方。\n\n### 书籍网站\n\n位于 [`www.sitepoint.com/books/jquery1/`](http://www.sitepoint.com/books/jquery1/)\
  \ 的支持本书的网站将为你提供以下功能：\n\n\n\n\n\n## 代码存档\n\n在阅读此书的过程中，你会注意到很多处对代码存档的引用。这是一个可以下载的\
  \ ZIP 压缩包，包含了书中打印的每一行示例源代码。如果你想“偷懒”（或者为了免得自己患上手腕隧道综合征），请尽管[下载该存档。](http://www.sitepoint.com/books/jquery1/code.php)\n\
