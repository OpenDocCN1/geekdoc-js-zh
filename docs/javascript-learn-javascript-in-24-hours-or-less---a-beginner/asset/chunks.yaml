    \   console.log(\"I will not waste precious console space\");}; |\n\nso that when\
    \ you can just invoke the consoleMessage() function to perform the hundred-line\
    \ command. Unfortunately, it’s still rather unwieldy to print so many redundant\
    \ lines of code. Since we always want to shorten the code we write whenever possible,\
    \ we opt for a more efficient way to repeat lines of code by using for-loops! \n\
    \n## \n\nFor-Loops\n\nFor loops tell the computer to do a bunch of stuff for a\
    \ specified number of times. The format of the for loop is:\n\n| for (var <variable\
    \ name> = <initial value>; <condition>; <iteration>){    <action to be repeated>}\
    \ |\n\nHere’s what it’d look like if we were to adapt the previous example to\
    \ use the for-loop:\n\n| for (var counter = 1; counter <= 100; counter++){   \
    \ console.log(\"I will not waste precious console space\");} |\n\nInstead of manually\
    \ typing the console.log statement a hundred times, we can use a for loop to do\
    \ it for us. Now, let’s take a closer look at the parts of a for loop:\n\n| var\
    \ counter = 1 |\n\nThis is the first part of the for loop. We’re only creating\
    \ this variable in order to keep track of the number of times the chunk of code\
    \ inside the for-loop has been executed. When the for-loop ends, this variable\
    \ vanishes.\n\n| counter <= 100 |\n\nThis is the condition that needs to be fulfilled\
    \ in order for the code inside the for-loop to be executed. As long as this statement\
    \ is true, the code inside the for-loop will be repeated again and again. Take\
    \ care not to create a condition that’s always true (e.g., 100 == 100) or else\
    \ you’ll have what’s known as an infinite loop!\n\n| counter++ |"
