    \ subtraction\n\n3.  + and - - addition and subtraction are done last.\n\nHere\
    \ are a couple of exercises to help you visualise mathematical precedence:\n\n\
    | 5 * 10 + 3 - 5 / 20 |\n\nThis would produce 52.75 because the multiplication\
    \ and division symbol takes precedence over the subtraction symbol. The story\
    \ changes when you add parenthesis to the procedure:\n\n| 5 * 10 + (3 - 5) / 20\
    \ |\n\nNotice how the result now becomes 49.9 because the parenthesis gave whatever\
    \ operation is inside it precedence over other operations. Here’s another example:\n\
    \n| (5 * 10 + 3 - 5) / 20 |\n\nNow the answer becomes 2.4, as everything inside\
    \ the parenthesis is done first before it’s divided by 20\\. Inside the parenthesis,\
    \ the usual rules of precedence apply, so if you want a lower-precedence operation\
    \ to happen first, you’ll need to enclose it in another set of parenthesis. \n\
    \n## \n\nA new contender: modulo\n\nIn basic math class, there were only four\
    \ mathematical operators. In programming, however, there’s an interesting fifth\
    \ operator called modulo (%). When placed between two numbers, it divides them\
    \ and gives you the remainder. Remember that programming requires conciseness\
    \ and precision; it has no room for extraneous symbols and features, which means\
    \ that there’s a good reason why the modulo operator exists. One interesting application\
    \ of the modulo operator is testing whether a number is even or odd:\n\n| var\
    \ num = prompt('Give me a number: ');if (num % 2 != 0){    alert('The number is\
    \ odd.');}else{    alert('The number is even.');} |\n\nPitfall alert: \n\nOne\
    \ common mistake novice programmers make when trying to test whether a number\
    \ is even or odd is to check if the remainder of two numbers is equal to 1\\.\
    \ At a glance, this might seem logical, as for every POSITIVE number you divide\
    \ by two, the remainder can only be one or zero (e.g., 13 % 2 = 1, and 12 % 2\
    \ = 0). A problem arises, however, when you input a negative number; since the\
    \ remainder is no longer equal to positive 1, then the program starts to act erratically.\
    \ These kinds of mistakes are quite easy to make, so whenever you try out solutions\
    \ to a problem, make sure to test the code thoroughly with a wide range of input\
    \ (in this example, the user would’ve discovered the pitfall quite easily if he\
    \ were to test negative numbers). \n\nNow, try modifying the following code so\
    \ that it displays \"Greetings from planet JavaScript!\"\n\n| if (14 % 2 != 0){ \
    \   console.log(\"Greetings\");}if (15 % 2 != 0){    console.log(\"to\");}if (10\
    \ % 2 != 0){    console.log(\"from\");}if (9 % 2 != 0){    console.log(\"atmosphere\"\
    );}if (5 % 3 != 0){    console.log(\"planet\");}if (20 % 2 != 0){    console.log(\"\
    JavaScript\");} |\n\n## \n\nMessing with strings\n\nSo far, we’ve managed to play\
    \ around with numbers, from performing regular mathematical operations, to comparing\
    \ values, to seeing what the modulo operator can do. Now, we’re going to mess\
    \ around with strings and see what you can do with them. "
