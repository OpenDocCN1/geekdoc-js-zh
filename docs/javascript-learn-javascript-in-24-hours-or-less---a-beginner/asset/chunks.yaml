  trans: '


    ### 编辑器


    1. **Atom** – `Atom` 是 Github 推出的一款较新的文本编辑器。它是免费、开源的，并且有许多自定义选项。基本上，`Atom` 就像一个可编程的文本编辑器；只要有合适的插件，它可以实现你几乎想要的任何功能。它的许多功能中，包括模糊查找（Fuzzy
    finder），它允许你通过简单的 `cmd+t` 命令跳转到不同的文件，以及丰富的主题选择。它支持 Mac OS X、Windows 和 Linux，且完全免费，所以请试用一下看它是否适合你。


    2. **Sublime Text** – `Sublime Text` 的命名非常恰当，由于其直观的命令和美美的界面，它提供了极佳的写作体验。和 `Atom`
    一样，`Sublime Text` 也具有高度可性，并支持 Mac OSX、Windows 和 Linux。它的试用版免费免费，但完整版费用约为 70 美元。


    3. **Notepad++** – 因为其无与伦比的简单和快速，`Notepad++` 一直非常受欢迎。如果你只需要一个简单实用的文本编辑器，让你在不需要复杂的文件结构的情况下就能编辑几个
    `html` 文件，你可以考虑尝试这款编辑器。但请记住，此编辑器仅适用于 Windows 系统。


    4. **Brackets** – `Brackets` 是 Adobe 出品的一款非常独特的文本编辑器，因为它设计用于与 Adobe 的其他产品（特别是
    Photoshop）协同工作。如果你在使用在使用 Photoshop 创建精美的用户界面，`Brackets` 允许你从创建的 `PSDs` 文件中无缝提取信息并将其转换为
    `CSS` 代码。此编辑器支持 Windows、Linux 和 Mac OSX，所以如果你对网页设计感兴趣，你可能想在你的系统中安装它。


    如果你并不打算为系统节省空间，我建议下载这四款文本编辑器并亲自尝试一下，前提是你运行的是兼容的操作系统。书中的练习和代码片段不需要特定的文本编辑器，所以你可以自由地在不同的编辑器之间切换，直到找到适合你需求的某一个。


    ### 选择网页浏览器


    文本编辑器允许你创建和保存 `html` 文件，而网页浏览器允许你查看这些文件。遗憾的是，有时你创建的网页在不同浏览器上查看时显示和行为可能有所不同，因此以下是你需要在系统中安装的浏览器：


    * **Google Chrome** – 因为速度快且简单，`Google Chrome` 是最受欢迎的浏览器之一。通过其内置的开发者工具，你可以对构建的网站进行调试，并动态更改代码片段，这样你就能立即看到想要更改的行代码。

    * **Firefox** – `Firefox` 自带一个名为 Firebug 的插件，其功能某种类似于 `Google Chrome` 的开发者工具。它还带有移动预览模式，基本上允许你看到你的网站在移动设备上查看时的样子。

    * **Internet explorer** – 这不是一个可以在 Linux 或 Mac OSX 上安装的东西，在 Windows 中它是预装的。然而，如果你运行
    Windows，你可能还需要用这个浏览器测试你的 `html` 代码，仅仅因为经常经常搞乱在 `Google Chrome` 或 `Firefox` 中运行正常的配置。

    * **Vivaldi** - 这是一个较新的竞争者，第一个测试版仅于 2015 年发布，第一个稳定版发布于 2016 年。该浏览器之所以出现在这个列表中，是因为它是基于
    `HTML5` 和 `Node.js` 等现代网络技术开发的。它也运行在 Mac、Windows 和 Linux 上，所以如果你正在寻找一个新的、前端的浏览器，可以尝试一下这个。


    ### 什么是 HTML？


    `HTML` 基本上允许你以结构化的方式展示网站的内容。把它想象成一个建筑房屋的蓝图；它告诉你在客厅、浴室、厨房和其他房间将放在何处，以及它们如何和谐地相互连接。


    学习一个 `HTML` 文件的结构非常简单；它的结构几乎像文章一样——你提供一个标题、骨骨结构以及在结构内连贯流动的内容。每当你阅读一篇文章时，标题会告诉你文章在论述什么，而内容是以特定的方式组织的，通常用一句引起你兴趣的话作为开头，随后是轶事、事实和数据、论点以及结论。当你开始编写
    `HTML` 代码时，你会发现它的结构与你阅读或编写的文章是多么相似。


    因此，创建一个 HTML 文件只需将文件保存为 `.html` 后缀名，非常简单。当你使用像 Microsoft Word 这样的文字处理器创建文档时，你会发现当保存文件时，文件名结尾会有
    `.odt`、`.doc`、`.docx` 或类似的后缀。这告诉计算机以非常特定的方式读取和格式化文件内容。这是因为每当你使用文字处理器保存你创建的内容时，你不仅保存了你输入的字，还保存了你使用的字体大小、字体样式和其他格式样式，这样当你打开文件时，计算机就会检查文件扩展名，根据指定的扩展名读取内容，然后向你展示你创建的文件，确保它在保存后看起来完全一样。


    `HTML` 的工作原理基本上相同，但这次你使用标签来告诉计算机如何处理标签包围的数据；这允许你轻松更改字体样式和其他方面。把 `HTML` 看作 Word
    文档的更精确的版本。例如，看下面的文本：


    | 这是一个句子。 |


    如果你将它保存为 Word 文档，它不仅保存了文本，还保存了字体样式、大小和结构。你刚刚保存的文档属性被整齐地存储在文件中，并且仅通过文字处理器菜单访问。然而，如果你想以
    HTML 形式显示同样的句子，该 `HTML` 文件看起来会像这样：


    ```html

    <html><head></head><body><p>这是一个句子。</p></body></html>

    ```


    通过以 `.html` 扩展保存此文件，你得到了一个显示“这是一个句子”的基础网页。注意，它与之前的文本框中的字符串相同，但包含了你可能熟悉或不熟悉的标签。当你的浏览器打开此文件时，它会理解标签并仅显示之前文本框中的内容；它不会向用户显示标签。最基本的标签如代码示例所示：


    * `<html>` 标签 - 包含你网页中的所有内容。它是字面上的开头和结尾；永远不要忘记 `<html>` 标签，否则你的网站将无法正常！

    * `<head>` 标签 - 保留标题以及主体可能使用的其他脚本。例如，如果你想使用一组规定使用字体类型、颜色等的设计协议（通常以 `CSS` 的形式存在），你可以将代码或其引用放在这里。

    * `<body>` 标签 - 这是你的内容所在的地方。从文本、声音、图像到视频，一切都发生在这里。


    ### HTML 基础知识


    现在你已经对 HTML 如何工作有了概览，我们将快速回顾一下基础知识，足以帮助你学习如何将 JavaScript 无缝集成到其中。


    我们已经讨论了 HTML 文件就像带有额外标签的 Word 文档，所以让我们从一行简单的文本开始。在你的文本编辑器中输入以下内容：


    | 你好！ |


