    \ somewhat functions like Google Chrome’s developer tools. It also comes with\
    \ a mobile preview mode, which basically allows you to see how your website would\
    \ look when viewed in a mobile device.\n\n*   Internet explorer – this isn’t something\
    \ you can install on Linux or Mac OSX and in Windows this comes preinstalled,\
    \ however, if you are running Windows you’ll want to test your html code using\
    \ this browser as well, simply because it often messes up configurations that\
    \ worked on Google Chrome or Firefox.\n\n*   Vivaldi - a relatively new contender,\
    \ the first beta was launched only in 2015, with the first stable release launched\
    \ in 2016\\. The reason why this browser made it in this list is because it’s\
    \ made based on modern web technologies such as HTML5 and Node.js among other\
    \ things. It also runs on Mac, Windows, and Linux, so if you’re looking for a\
    \ new, cutting edge browser, give this one a try.\n\n## \n\nWhat is HTML?\n\n\
    HTML basically allows you to present your site’s content in a structured manner.\
    \ Think of it as a blueprint for building a house; it tells you where the living\
    \ room, bathroom, kitchen, and other rooms will be placed and how they harmoniously\
    \ interconnect.\n\nLearning the structure of an HTML file is quite simple; it’s\
    \ structured almost like an essay - you provide a title, a skeletal structure,\
    \ and content that flows coherently within the structure. Whenever you read an\
