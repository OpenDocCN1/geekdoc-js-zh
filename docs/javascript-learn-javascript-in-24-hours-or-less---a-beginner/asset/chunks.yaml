    \nConclusion\n\nCongratulations! You’ve just gotten your first taste of JavaScript!\
    \ It’ll get even more interesting in the next chapter as we talk about what types\
    \ of information you can use and what we can do with them. You’ll also get your\
    \ first glimpse into how you can help your program make decisions, as well as\
    \ what to do if the your program doesn’t behave the way you expect it to. It’ll\
    \ be quite a handful of information to take in one sitting, so take a break and\
    \ come back when you’re ready to dive further into the essentials of JavaScript. \n\
    \n# Chapter 3: JavaScript Essentials\n\nSince this chapter is quite dense, here's\
    \ an overview of what you can expect to learn:\n\n1.  Data types - how JavaScript\
    \ classifies information. This is important because knowing what type of information\
    \ you have will also tell you what you can do with that information (e.g., you\
    \ can’t multiply 5 with apples.)\n\n2.  Comparison Operators - lets you compare\
    \ certain types of information (e.g., is 5 less than 10?). This is useful when\
    \ you want to give the computer instructions that relies on certain conditions\
    \ being met (e.g., allow the user to register only if the age is more than or\
    \ equal to 18)\n\n3.  Console.log() - lets you display the output of a single\
    \ line of code - useful when you want to see how information flows in your program\
    \ per line of code.\n\n4.  Flow Control - if-else statements give the computer\
    \ different instructions to execute depending on which condition is met (e.g.,\
    \ allow the user to enter site if the age is more than 18, otherwise, display\
    \ an error message)\n\n5.  Debugging - when your program behaves erratically (e.g.,\
    \ misspelling the user’s name or forgetting it completely), then you need to find\
    \ which part of your code is messing up your program’s behavior - this process\
    \ is called debugging. This can become rather daunting when the code spans more\
    \ than a thousand lines - knowing where to look will come in handy. \n\nSo far,\
    \ you’ve played with strings and numbers using JavaScript. In the programming\
    \ world, these categories of information are referred to as data types.\n\n##\
    \ \n\nData Types\n\nData types simply tell the computer how your information should\
    \ be read. For instance, if you type the following into the console:\n\n| \"5\"\
    \ + \"5\" |\n\nYou’d get \"55.\" This is because by enclosing 5 using quotation\
    \ marks, you’re telling the interpreter that you want 5 to be treated as a string,\
    \ not a number. The addition operator, then, instead of adding the two numbers,\
    \ combines the two strings. Now try removing the quotation marks and notice how\
    \ the output changes to 10. There are different things you can do with different\
    \ data types, so it’s extremely important to know which one to use:\n\n1.  Strings\
    \ - Anything you enclose in quotation marks will end up being a string. This can\
    \ be a combination of letters, spaces, numbers, punctuation marks, and other symbols.\
    \ Without strings, you wouldn’t be able to get the user’s name, address, email,\
    \ and other important details.\n\n2.  Numbers - Self-explanatory; numbers are\
    \ the ones you can perform addition, subtraction, multiplication, and division\
    \ to, among other mathematical operations. Remember not to put quotation marks\
    \ or you’ll turn them into strings!\n\nSo far, we now have strings and numbers\
    \ at our disposal, but remember the console output when you’ve tried playing with\
    \ confirmation dialogues? Whenever you press OK, the console returns true, and\
    \ whenever you press CANCEL, the console returns false. These outputs aren’t surrounded\
    \ by quotation marks, but they surely aren’t numbers, so what in the world are\
    \ they? \n\n3.  Booleans - booleans are data types that can only be either true\
    \ or false. This is different from a string or a number, because it helps the\
    \ computer make decisions based on whether or not certain conditions are met.\
    \ For example, if you want to prevent minors from registering in your site, you’d\
    \ have to have some sort of code to separate minors from the adults, like:\n\n\
    | var age = 17age >= 18  |\n\nThe console, then, returns false because the age\
    \ is under 18\\. Now try the following mathematical expressions out and see what\
    \ you get:\n\n| 5 > 10 |\n\n| 6 < 12 |\n\nThe first line should return false,\
    \ while the second line should return true.\n\nComparison Operators\n\nSo far,\
    \ we’ve talked about three data types (numbers, strings, and booleans), as well\
    \ as some basic mathematical operators (+, -, *, /). What you’ve just used to\
    \ test out booleans, however, are comparison operators (<, >, =), which are extremely\
    \ important in managing the flow of your program. Here’s the complete list and\
    \ what they can do:\n\n > Greater than\n\n< Less than\n\n>= Greater than or equal\
    \ to\n\n<= Less than or equal to\n\n== Equal to\n\n!= Not equal to\n\nTo test\
    \ out these operators, replace the '@' symbol with the correct operator in the\
    \ following statements in order to make the console output true:\n\n| console.log(5\
    \ @ 1);console.log(1 @ 5);console.log(5 @ 2);console.log(1 @ 6);console.log(5\
    \ @ 5);console.log(10 @ 5); |\n\n## \n\nKnowing what the Interpreter is Thinking\n\
    \nNotice how the JavaScript interpreter only gives you the latest output of the\
    \ commands you type in, so if you’ve typed in three lines of code that should\
    \ have different outputs:\n\n| 5 > 106 < 127 > 14 |\n\nExecuting them all at the\
    \ same time in the console, you’d only get the result of the last line (false). "
