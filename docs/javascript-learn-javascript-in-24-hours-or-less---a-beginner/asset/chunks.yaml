- fmt: "\nWe’ve so far been fiddling with our mini text-search application, but there’s\
    \ actually a neat function that could help us shorten our code - the `search()`\
    \ function. Let’s try it out:\n\n```javascript\nvar text = \"I’ve gone through\
    \ all this trouble and it turns out there’s an easy way out.\";var positionOfText\
    \ = text.search(\"easy way out\");console.log(positionOfText);\n```\n\nThough\
    \ take note that the `search()` function only looks for the location of the first\
    \ occurrence of the query in the text. You can, however, modify the original program\
    \ and use the `search()` function within the `for` loop to make the code shorter.\
    \ This is another important lesson in programming - learning how to find the right\
    \ function for the job so you won’t end up writing one yourself. That being said,\
    \ here’s another way to achieve our mini text-search application using another\
    \ function called `match()`:\n\n```javascript\nvar text = \"This is getting ridiculous.\"\
    ;var results = text.match(\"ridiculous\");console.log(\"Matches: \" + results.length);\n\
    ```\n\nWhat we’ve done before - creating the text-search app with only the basic\
    \ `if-else if-else` and `for`-loops - helps us understand what happens inside\
    \ the functions that we often take for granted. By understanding this, we could\
    \ easily create our own functions in case the available ones don’t fit our needs.\n\
    \n## Conclusion\n\nSo far, you pretty much now have the basic procedural parts\
    \ of JavaScript covered. In the next chapter, you’ll learn more about data structures,\
    \ which is a way of organizing information (remember our lesson about arrays?)\
    \ so that the computer can manage it more efficiently. If in the past few chapters,\
    \ we’ve talked about general procedural programming concepts (`if-else` statements,\
    \ functions, etc.) using JavaScript, the next chapter will help you get a running\
    \ start on object-oriented programming concepts.\n\n# Chapter 7: Managing Data\
    \ More Efficiently\n\nIn this chapter, you’ll learn how to manage data more efficiently\
    \ by learning about data structures. You’ve already actually learned a data structure\
    \ back in Chapter 5 - arrays. In this chapter, we’ll explore arrays more thoroughly,\
    \ as well as give you an introduction to objects, which are pretty much what separate\
    \ object-oriented programming from procedural programming. With that said, let’s\
    \ have a quick review of arrays first:\n\n## Arrays - A Quick Review\n\nHere’s\
    \ a bunch of arrays:\n\n```javascript\nvar fruits = [\"Banana\", \"Apple\", \"\
    Orange\"];var numbers = [1, 2, 3];var fruitSalad = [\"Banana\", \"Apple\", \"\
    Orange\",1, 2, 3];\n```\n\nArrays with two or more types of data are called heterogeneous\
    \ arrays. In the above example, `fruitSalad` is the heterogeneous array. You can\
    \ store any kind of data type in an array and access it using the index of the\
    \ corresponding data:\n\n```javascript\nconsole.log(fruits[0]); //should give\
    \ you Banaconsole.log(fruitSalad[5]); //should give you 3\n```\n\nYou can check\
    \ the length of an array the same way you can with strings:\n\n```javascript\n\
    console.log(fruits.length); //should give you 3console.log(numbers.length); //should\
    \ give you 3console.log(fruitSalad.length); //should give you 6\n```\n\nThere\
    \ are plenty of methods you can use on an array, like the `push()` method:\n\n\
    ```javascript\nfruits.push(\"Tomato\");\n```\n\nYou can find a comprehensive list\
    \ of methods for arrays with a quick online search, as adding them all here would\
    \ make the book too dense. \n\nNow that you’ve gotten a quick review of arrays,\
    \ let’s make things a little more interesting by talking about two-dimensional\
    \ arrays.\n\n## Two-Dimensional Arrays\n\nWhen we’ve discussed arrays being able\
    \ to keep any kind of data, we’re not just talking about strings, numbers, and\
    \ booleans; we can also store arrays in arrays! How is this useful? Well, let’s\
    \ say you were to save personal information in an array:\n\n```javascript\nvar\
    \ personalInfo = [\"John\", 23, \"johnSnow@myCorporation.net\"];\n```\n\nWhat\
    \ happens when you want to add more people, though? Just like what we do when\
    \ we want to create a list of information, we also create a list of arrays:\n\n\
    ```javascript\nvar group = [personalInfo, [\"Jen\", 21, \"jenRose@myCorporation.net\"\
    ], [\"Jake\", 25, \"jakeSullivan@myCorporation.net\"]];\n```\n\nTo recall our\
    \ lesson in `for`-loops, let’s iterate through each entry’s personal information:\n\
    \n```javascript\nfor(var counter = 0; counter < group.length; counter++){\n  \
    \  for(var counter1 = 0; counter1 < group[counter].length; counter1++)\n    {\n\
    \        console.log(group[counter][counter1]);\n    }\n}\n```\n\nTry to play\
    \ around with this code a bit and try to present the data in reverse:\n\n1. Display\
    \ Jake’s information first and John’s information last\n2. Display the email address\
    \ first and the names last\n\nNow that you’ve gotten the hand of two-dimensional\
    \ arrays, it’s time to jump into a higher plane - the plane of objects! \n\n##\
    \ Introduction to Objects\n\nProcedural programming required programmers to spell\
    \ out almost every command to the computer. This can quickly lead to messy code,\
    \ so people thought about keeping certain commands and information inside what\
    \ one can call an \"object.\" For instance, if you wanted to create a database\
    \ of pets, you’d have to do something like:\n\n```javascript\n//First, we create\
    \ arrays with the information we wish save petName = [\"Cat\", \"Fluffy\"];var\
    \ petSpecies = [\"Dog\", \"Fish\", \"Parrot\"];var petAge = [5, 6];var petGender\
    \ = [\"Male\", \"Female\", \"Male\"];var petDetails = [petName, petSpecies, petAge,\
    \ petGender];create a function displayInformation = function(details){ console.log(\"\
    Name: \" + details[0]); console.log(\"Species: \" + details[1]); console.log(\"\
    Age: \" + details[2]); console.log(\"Gender: \" + details[3]); }};displayInformation(petDetails);\n\
    ```\n\nWhile the code does work and provides us with relatively neat list of information,\
    \ the code is rather messy and can get hard to debug when new functions are added.\
    \ That being said, here’s a code that turns the first entry into an object:\n\n\
    ```javascript\nvar pet = {};pet.name = \"Cat\";pet.species = \"Dog\";pet.age =\
    \ 5;pet.gender = \"Male\";pet.showDetails = function(){ console.log(\"Name: \"\
    \ + this.name); console.log(\"Species: \" + this.species); console.log(\"Age:\
    \ \" + this.age); console.log(\"Gender: \" + this.gender); };pet.showDetails();\n\
    ```\n\nThis line:\n\n```javascript\nvar pet = {};\n```\n\nIs what creates an object\
    \ with the name `pet`. There are actually two ways to create an object, and this\
    \ is the first, called the literal notation. We’ve started with an empty object\
    \ and added attributes after the declaration, but we can actually start with a\
    \ filled object:\n\n```javascript\nvar pet = { name: \"Cat\", species: \"Dog\"\
    , age: 5, gender: \"Male\", };pet.showDetails = function(){ console.log(\"Name:\
    \ \" + this.name); console.log(\"Species: \" + this.species); console.log(\"Age:\
    \ \" + this.age); console.log(\"Gender: \" + this.gender); };pet.showDetails();\n\
    ```\n\nTake note of the differences, subtle as they may be! (e.g., using a colon\
    \ (:) instead of an equal sign (`=`))\n\nYou can also use a constructor, turning\
    \ the code snippet into:\n\n```javascript\nvar pet = new Object();pet.name = \"\
    Cat\";pet.species = \"Dog\";pet.age = 5;pet.gender = \"Male\";pet.showDetails\
    \ = function(){ console.log(\"Name: \" + this.name); console.log(\"Species: \"\
    \ + this.species); console.log(\"Age: \" + this.age); console.log(\"Gender: \"\
    \ + this.gender); };pet.showDetails();\n```\n\nBoth ways of creating objects are\
    \ correct, so it really is all up to preference.\n\nNow notice how the object\
    \ is a little bit different from the other data types we’ve used so far. This\
    \ is because objects are modern concepts that serve to represent real world stuff\
    \ by keeping all the relevant details and information in one place. For instance,\
    \ if one is to create a \"phone\" object, then it’d most likely contain attributes\
    \ like screen size, pixel density, number and speed of processors, RAM, etc. If\
    \ we want to create different phones, we’d just simply have to do something like:\n"
