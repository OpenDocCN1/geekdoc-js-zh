  trans: "\n这是一个迭代语句，它将变量 `counter` 加 1。这确保了 `counter` 最终会达到 100，从而导致 `counter <=\
    \ 100` 语句返回 `false`。如果没有这个语句，`counter` 将停留在 1，且 `counter <= 100` 语句将始终返回 `true`！\n\
    \n这三条语句帮助 `for` 循环精确地运行一段代码块。这里有一些额外的技巧，可以帮助你更好地创建 `for` 循环：\n\n1.  如果你愿意，也可以倒序计数，将条件从\
    \ `(<)` 或 `(<=)` 改为 `(>)` 或 `>=`，然后递减 `counter--`。\n\n2.  你还可以编写类似 `counter+=n`\
    \ 或 `counter-=n` 的代码来对任何数字进行加减，其中 `n` 是你想要对 `counter` 加或减去的数字。\n\n3.  小心你设置的条件！如果你创建了一个导致死循环的\
    \ `for` 循环，你的浏览器将会崩溃！\n\n尽管如此，这里有一个会导致死循环并导致浏览器崩溃的代码：\n\n```\nfor (var counter\
    \ = 1; counter <= 10; counter--){\n    console.log(counter);\n}\n```\n\n作为一个练习，修改这个\
    \ `for` 循环，使其最终在控制台中显示数字 1-10。\n\n## 数组 (Arrays)\n\n如果你想记录十个名字，但不使用数组，你将不得不执行类似下面的操作：\n\
    \n```javascript\nvar name1, name2, name3, name4, name5, name6, name7, name8, name9,\
    \ name10;\n```\n\n这仅仅是声明变量！如果你真的需要用这种方法存储用户输入，看看会变得有多乱：\n\n```javascript\nfor\
    \ (var counter = 1; counter <= 10; counter++){\n    if(counter == 1)\n    {\n\
    \        name1 = prompt('Please enter name 1: ');\n    }\n    if(counter == 2)\n\
    \    {\n      name2 = prompt('Please enter name 2: ');\n    }\n    if(counter\
    \ == 3)\n    {\n        name3 = prompt('Please enter name 3: ');\n    }\n    if(counter\
    \ == 4)\n    {\n        name4 = prompt('Please enter name 4: ');\n    }\n    if(counter\
    \ == 5)\n    {\n        name5 = prompt('Please enter name 5: ');\n    }\n    if(counter\
    \ == 6)\n    {\n        name6 = prompt('Please enter name 6: ');\n    }\n    if(counter\
    \ == 7)\n    {\n        name7 = prompt('Please enter name 7: ');\n    }\n    if(counter\
    \ == 8)\n    {\n        name8 = prompt('Please enter name 8: ');\n    }\n    if(counter\
    \ == 9)\n    {\n        name9 = prompt('Please enter name 9: ');\n    }\n    if(counter\
    \ == 10)\n    {\n        name10 = prompt('Please enter name 10: ');\n    }\n}\n\
    ```\n\n现在想象一下如果社交媒体网站使用这种方法来注册用户；程序员将不断重新编写网站以适应更多的用户！幸运的是，我们有数组来帮助。\n\n简而言之，数组可以存储甚至不同数据类型的数据列表。存储的数据具有固定的位置，因此你可以确定每个数据的放置位置，并能可靠地检索它们。以下是数组声明的示例：\n\
    \n```javascript\nvar strings = [\"apple\",\"grapes\",\"tomatoes\"];\nvar numbers\
    \ = [1, 2, 3, 4, 5];\nvar stringsAndNumbers = [\"Oceans\", 11];\n```\n\n你可能已经注意到，数组的声明语句与变量的声明语句非常相似；区别在于数据在大括号内并用逗号分隔。如果你想创建一个空数组，可以留空括号，稍后使用\
    \ `push()` 函数添加项，例如：\n\n```javascript\nvar numbers = [];\nfor (var counter = 1;\
    \ counter <= 10; counter++){\n    numbers.push(counter);\n}\n```\n\n现在我们可以回到之前获取十个名字的尝试。让我们看看数组如何大幅改进我们的代码：\n\
    \n```javascript\nvar names = [];\nfor (var counter = 1; counter <= 10; counter++){\n\
    \    names.push(prompt('Please enter name ' + counter + ':'));\n    console.log('Obtained\
    \ name ' + counter);\n}\n```\n"
- fmt: "\n- You can compare letters to see if they’re equal, e.g., `'E'=='B'` returns\
    \ `false`, and `'A'=='A'` returns `true`.\n\nThe trick is to break the process\
    \ down further into simpler procedures. For instance, here is a sample block of\
    \ text:\n\n```javascript\nvar numberSet = \"One two three four five\";var queryString\
    \ = \"two\";\n```\n\nWhile looking for a string is easy enough for humans, for\
    \ computers, it’s a little more complicated. In this example, we are to locate\
    \ `'two'`, which one easily sees but the computer doesn’t, therefore we have to\
    \ start looking from the beginning of the string to the end. The letter enclosed\
    \ in brackets is the one we’re currently comparing:\n\n`\"[O]ne two three four\
    \ five\"` vs. `\"[t]wo\"`\n\nIn code for, that’d be:\n\n```javascript\nnumberSet[0]\
    \ == queryString[0];\n```\n\nAs you’ve noticed, we don’t immediately compare the\
    \ two words; we get their first letter and check if they’re equal. Since in this\
    \ first scenario, \"O\" isn’t equal to \"t\", we move on to the next letter:\n\
    \n`\"O[n]e two three four five\"` vs. `\"[t]wo\"`\n\nwhich in code, would translate\
    \ to:\n\n```javascript\nnumberSet[1] == queryString[0];\n```\n\nagain, this returns\
    \ `false`, so we move on until we get to a match:\n\n`\"One [t]wo three four five\"\
    ` vs. `\"[t]wo\"`\n\nwhich translates to:\n\n```javascript\nnumberSet[4] == queryString[0];\n\
    ```\n\nNow, we can’t yet make the assumption that we’ve found \"two\" in the `numberSet`;\
    \ we’ve only gotten a match for the first letter. It’s still possible that we’re\
    \ just coming across a number that also starts with ’t’, e.g., three, thirty,\
    \ etc. That being said, we’d have to then compare the second letter of \"two\"\
    \ to the next letter in the `numberSet`:\n\n`\"One t[w]o three four five\"` vs.\
    \ `\"t[w]o\"`\n\nwhich translates to:\n\n```javascript\nnumberSet[5] == queryString[1];\n\
    ```\n\nThe statement remains true, and if you try checking the next letter, it’d\
    \ also return `true`. Since the statement continues to be true until the last\
    \ letter of \"two\", then we can now say that we’ve found 1 instance of \"two\"\
    \ in the `numberSet`. The search, however, still has to continue until the last\
    \ three letters of the `numberSet`:\n\n`\"One two three four f[i]ve\"` vs. `\"\
    [t]wo\"`\n\nwhich translates to:\n\n```javascript\nnumberSet[20] == queryString[0];\n\
    ```\n\nSince this statement will return `false`, there’s no need to go further\
    \ to 'v' or 'e' since the remaining letters are too small to provide a match for\
    \ \"two\".\n\n## Still Confused?\n\nIf you find yourself confused and overwhelmed\
    \ with the process of converting problems from English to JavaScript, it’s a good\
    \ idea to come up with a list of how you want your program to handle the problem.\
    \ For instance, here’s the procedure list for our string-search program:\n\n3)\
    \ Run through the letters of the block of text \n\na) Does the current letter\
    \ match the first letter of our query string?\n\ni) If yes, run through the letters\
    \ of the block of text.\nii. If no, proceed to next.\n\nb) Was there a match?\n\
    \ni) If yes, record it\nii) If no, continue\n\nOf course, there are plenty of\
    \ optimizations you may discover in the future that make this less, but for now,\
    \ you’ve learned.\n\n## Conclusion\n\nCongratulations! You’ve just learned how\
    \ to use `while` loops, `if-statements`, and `for-loops`. You’ve learned how to\
    \ translate human problems into JavaScript.\n\n## Chapter 6: Mastering Flow Control\n\
    \nSo far, you’ve learned about `while` loops, `if-statements`, and `for-loops`.\
    \ In this chapter, we’ll learn how to use `while` loops more effectively.\n\n\
    - how to use `while` loops.\n\n## While Loops\n\nSo far, you’ve learned about\
    \ `while` loops, `if-statements`, and `for-loops`. In this chapter, we’ll learn\
    \ how to use `while` loops more effectively.\n\nThe `while` loop is used for\n\
    1. Initial value\n2. Condition\n3. Iteration\n\nWhat if, however, you need to\
    \ use a `while` loop to repeat something until a condition is met?\n\n```javascript\n\
    while(<condition>){\n  <action>\n}\n```\n\nBasically, the `while` loop is just\
    \ a `for-loop` without the counter. You can put any condition that returns `true`\
    \ or `false`.\n\n```javascript\nvar keepLooping = true;\nwhile (keepLooping){\n\
    \  console.log(\"Just looping!\");\n  keepLooping = false;\n}\n```\n\nThe `counter`\
    \ only exists inside the loop. As for the `while` loop, the counter keeps its\
    \ value as long as the program remains running.\n\nNow let’s use `while` loops\
    \ to optimize our code back in Chapter 3:\n\n```javascript\nvar name = prompt('What’s\
    \ your name?');\nwhile (name.length == 0){\n  name = prompt('You cannot leave\
    \ this empty. What’s your name?');\n}\nalert('Your name is ' + name + '. Got it!');\n\
    var email = prompt('What’s your email?');\nwhile (email.length == 0){\n  email\
    \ = prompt('You cannot leave this empty. What’s your email address?');\n}\nalert('Your\
    \ email is ' + email + '. Got it!');\nvar age = prompt('What’s your age?');\n\
    while (age.length == 0){\n  age = prompt('You cannot leave this empty. What’s\
    \ your age?');\n}\nalert('Your age is ' + age + '. Got it!');\n```\n"
