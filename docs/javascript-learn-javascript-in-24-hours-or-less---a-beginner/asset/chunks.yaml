    # 引言

    自 90 年代初以来，互联网已经取得了巨大的进步。随着成千上万的计算机连接到网络，如何有组织地将数据分配给不同的计算机成了一个难题。带着这一想法，蒂姆·伯纳斯-李（Tim
    Berners-Lee）创建了一个名为超文本传输协议（`HTTP`）的链接框架。除了 `HTTP`，他还创建了一种名为超文本标记语言（`HTML`）。


    在现代浏览器中，大多数时候你不再需要输入 `HTTP` 或 `HTTPS` 来访问网站。你在浏览网页时也不会经常看到 `.html` 扩展名。这样做是为了简化普通用户的网页浏览体验。


    正如你可能注意到的，网页开发者之间有一种趋势，即让网页浏览者尽可能简单。虽然 2000 年初对许多人来说已经足够，但随着闪眼、光亮的文本、按钮以及“点击此处进入”的
    Flash 动画的出现，这些元素并没有准确代表当前极简主义、动态内容的趋势。旧网站要求你在每次点击按钮时加载并重新加载不同的网页，这阻碍了浏览体验，因为你必须不断刷新网页来检查更新的内容，导致很多数据在字段中丢失。简而言之，随着信息变得越来越密集和复杂，我们需要简化访问这些碎片化信息的方式，否则我们最终将淹没在数据的海洋中。


    这本书不是参考指南，也不是一套枯燥的学术讲座；它是一本`JavaScript 编程`的实战教程，建立在当前网络技术构建的核心理念——简化的需要之上。


    在继续之前，请问问自己这些问题：

    - 你是否拥有一台具有功能浏览器和互联网连接的计算机？

    - 你是否想学习如何创建能够智能与用户对话并实时添加新信息的网页？

    - 你是否更倾向于友好的教程，而不是枯燥乏味的参考手册？


    如果你对第 2 和第 3 个问题回答了“是”，那么这本书就适合你。如果你对第 1 个问题回答了“否”，你可能需要考虑下载 `Google Chrome` 或
    `Mozilla Firefox`（两者都是优秀的浏览器）作为开始，否则示例代码可能无法按预期运行。


    **注意：**

    如果你真的希望通过这本书尽可能快地学习，我建议完成章节中所有的练习和活动。抵制那种不亲自尝试就略读示例代码的冲动——运行代码帮助你理解并应用所学知识。快速读完章节只会带给你浅层的知识——足以在晚餐会上让编程新手们印象深刻。


    让我们开始旅程。


    # 第 1 章：HTML 概述

    `HTML`、`CSS` 和 `Javascript` 协同工作，为用户提供无缝的网页体验。许多初级开发者会将这三者搞混。如果你是网页开发领域的完全的新手，本章将带你快速了解
    `HTML`。另一方面，如果你已经了解 `HTML`，可以随时跳过或略读本章。


    ## 选择文本编辑器

    在开始创建交互式网页之前，你需要下载一个好的文本编辑器。虽然 Mac 和 PC 通常内置了可以以 `html` 格式保存文件的文本编辑器，但它们缺乏许多让网页开发变得更简单的实用工具，例如语法高亮和自动补全。尽管如此，以下是一些用于网页开发的最佳文本编辑器：


    '
- fmt: '

    ### Text Editors


    1. **Atom** – `Atom` is a relatively new text editor by Github. It’s free, open
    source, and has plenty of customization options. Basically, `Atom` is like a programmable
    text editor; it can do almost anything you want it to with the right plug-ins.
    Among its many features would be the Fuzzy finder, which allows you to jump to
    different files with a simple `cmd+t` command, and the wide range of available
    themes. It works on Mac OS X, Windows, and Linux and comes at no cost, so try
    it out and see if suits you.


    2. **Sublime Text** – `Sublime Text` is quite aptly named, as it offers a sublime
    writing experience due to its intuitive commands and beautiful interface. Like
    `Atom`, `Sublime Text` is also highly customizable and works on Mac OSX, Windows,
    and Linux. Its trial version is free, but the full version costs about $70.


    3. **Notepad++** – `Notepad++` has been a crowd favorite for quite some time because
    of its unrivaled simplicity and speed. If you just need a no-nonsense text editor
    that’ll let you edit a couple of `html` files without the need for complex file
    structures, you may opt to give this text editor a try. Keep in mind, however,
    that this text editor is only available in Windows.


    4. **Brackets** – `Brackets` is quite a unique text editor from Adobe, as it’s
    designed to work in tandem with Adobe’s other products, specifically Photoshop.
    If you’re interested in creating sleek user interfaces from Photoshop, `Brackets`
    allows you to extract information seamlessly from the `PSDs` you’ve created and
    convert them into `CSS` code. This text editor works with Windows, Linux, and
    Mac OSX, so if you’re interested in web design, you’ll want to have this installed
    in your system.


    If you’re not trying to save space on your system, I recommend downloading these
    four text editors and trying them out for yourself, assuming that you’re running
    a compatible operating system. The exercises and code snippets in this book do
    not require a specific text editor so feel free to jump in and out of different
    text editors until you find one that fits your needs.


    ### Choosing a Web Browser


    Text editors allow you to create and save `html` files while web browsers allow
    you to view them. Unfortunately, sometimes, the web pages you create may look
    and act differently when viewed on different browsers, so here are the browsers
    you’ll want installed on your system:


    * **Google Chrome** – `Google Chrome` is one of the most popular web browsers
    because of its speed and simplicity. With its built-in developer tools you get
    to play around with the web sites you build and change snippets of code on the
    fly so you can immediately see what lines of code you’ll want to change.

    * **Firefox** – `Firefox` comes with a plug-in called Firebug, which somewhat
    functions like `Google Chrome`’s developer tools. It also comes with a mobile
    preview mode, which basically allows you to see how your website would look when
    viewed in a mobile device.

    * **Internet explorer** – this isn’t something you can install on Linux or Mac
    OSX and in Windows this comes preinstalled, however, if you are running Windows
    you’ll want to test your `html` code using this browser as well, simply because
    it often messes up configurations that worked on `Google Chrome` or `Firefox`.

    * **Vivaldi** - a relatively new contender, the first beta was launched only in
    2015, with the first stable release launched in 2016. The reason why this browser
    made it in this list is because it’s made based on modern web technologies such
    as `HTML5` and `Node.js` among other things. It also runs on Mac, Windows, and
    Linux, so if you’re looking for a new, cutting edge browser, give this one a try.


    ### What is HTML?


    `HTML` basically allows you to present your site’s content in a structured manner.
    Think of it as a blueprint for building a house; it tells you where the living
    room, bathroom, kitchen, and other rooms will be placed and how they harmoniously
    interconnect.


    Learning the structure of an `HTML` file is quite simple; it’s structured almost
    like an essay - you provide a title, a skeletal structure, and content that flows
    coherently within the structure. Whenever you read an article, the title tells
    you what the article talks about, and the content is structured in a particular
    way, oftentimes with a sentence that piques your interest, followed by anecdotes,
    facts and figures, arguments, and a conclusion. When you start coding in `HTML`,
    you’ll see how similarly structured it is to articles you read or write.


    Creating an HTML file, then, is as simple as saving your file with a `.html` file
    extension. When you create documents in a word processor like Microsoft Word,
    you’ll notice that when you save your file it has either an `.odt`, `.doc`, `.docx`,
    or something similar at the end of the filename. This tells the computer to read
    and format the contents of the file in a very specific way. This is because whenever
    you save something you’ve created using a word processor you’re not just saving
    a bunch of words you’ve typed; you’re also saving the font size, font styles,
    and other formatting styles you’ve used so that when you open your file, your
    computer will check the file extension, read the contents according to the file
    extension specified, and then present you the file you’ve created, making sure
    that it looks exactly the same way when you’ve saved it.


    `HTML` basically acts the same way, but this time you use tags in order to tell
    the computer what to do with the data enclosed by the tags; this allows you to
    easily change the font styles and other aspects of your web page. Think of `HTML`
    as a more precise version of a Word Document. For example, take a look at the
    text below:


    | This is a sentence. |


    If you save this as a Word Document, it will save not only the text, but also
    its font style, size, and structure. The attributes of the document you''ve just
    saved is tucked neatly inside the file and accessible only through the word processor
    menus. However, if you want to display the same sentence in HTML form, the `HTML`
    file would look like this:


    ```html

    <html><head></head><body><p>This is a sentence.</p></body></html>

    ```


    By saving this file with a `.html` extension, you get a basic webpage that displays
    "This is a sentence." Notice how it has the same string of text as the previous
    text box, but it contains additional tags you may or may not be familiar with.
    When your browser opens this file, it understands the tags and displays only the
    content on the previous text box; it doesn’t actually show the tags to the user.
    The most basic tags are shown in the code example:


    * The `<html>` tag - contains everything in your web page. It’s the alpha and
    the omega, literally; never forget the `<html>` tag or else your site won’t work
    properly!

    * The `<head>` tag - keeps the title and other preliminary scripts that the body
    might use. For instance, if you want to use a set of design protocols (typically
    in the form of `CSS`) that dictate what type of fonts to use, their colors, etc.,
    you can place the code or its reference here.

    * The `<body>` tag - this is where your content goes. From text, to sound, to
    images, to videos, this is where everything happens.


    ### HTML Essentials


    Now that you have a general overview of how HTML works, we’re going to have a
    quick run through the basics, just enough to help you learn how to integrate JavaScript
    seamlessly into it.


    We’ve discussed how HTML files are like Word Documents with additional tags, so
    let’s start with a simple line of text. Type this into your text editor:


    | Hi There! |

