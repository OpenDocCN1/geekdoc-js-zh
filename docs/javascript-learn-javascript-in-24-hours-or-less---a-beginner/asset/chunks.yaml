- fmt: "\n```javascript\nvar computeSum = function (firstNumber, secondNumber){\n\
    \    var result = firstNumber + secondNumber;\n    return result;\n};\n```\n\n\
    With this, you can now treat the `computeSum()` function like a number! Try these\
    \ codes out for yourself:\n\n```javascript\nconsole.log(computeSum(5, 5) + 10)\n\
    console.log(computeSum(7, 8) / 10)\nconsole.log(computeSum(9, 10) - 10)\nconsole.log(computeSum(4,\
    \ 4) * 10)\nconsole.log(computeSum(42, 34) % 2)\n```\n\n# Optimisation: Finding\
    \ the Perfect Balance Between Readability and Conciseness\n\nNow that you’re learning\
    \ more and more complex ways to code, now is the perfect time to discuss code\
    \ readability. One easy way to spot a novice programmer is by looking at how long\
    \ and how readable the code is. For instance, our `computeSum()` function, while\
    \ perfectly readable, could still be shortened to:\n\n```javascript\nvar computeSum\
    \ = function (firstNumber, secondNumber){\n    return firstNumber + secondNumber;\n\
    };\n```\n\nThis shortens the code by one line without looking messy. There are\
    \ times, however, when you have to choose carefully whether choosing to be concise\
    \ can make your code too difficult to understand, for instance, take a look at\
    \ this simple if-else statement:\n\n```javascript\nif (5 > 7){\n    console.log('5\
    \ is greater than 7');\n}else{\n    console.log('7 is greater than 5');\n}\n```\n\
    \nIt’s easy enough to read, but you can actually reduce this to a single line\
    \ using what’s called a ternary expression:\n\n```javascript\n5 > 7 ? console.log('5\
    \ is greater than 7') : console.log('7 is greater than 5');\n```\n\nThe statement\
    \ becomes much more compact now, but it reduces readability as well. The ternary\
    \ expression should really only be used when you’re assigning a value conditionally,\
    \ e.g.,\n\n```javascript\nvar greaterNum = 5 > 7 ? 5 : 7;\n```\n\nThis line assigns\
    \ 5 to `greaterNum` if it is greater than 7, otherwise it assigns 7 to `greaterNum`.\n\
    \nThat being said, remember that there are many ways to make your code more compact\
    \ and easy to read. For compactness, you need to make sure that your optimisations\
    \ are well-warranted and used correctly (as in the case of the ternary operator).\
    \ As for being easy-to-read, it really has a lot to do with using the right names\
    \ for your variables and functions, as well as being consistent with the way you\
    \ type your code.\n\n# Global and Local Variables\n\nWe’ve talked about variables\
    \ not being accessible anywhere else in your code except within the functions\
    \ they were created in. These are called local variables. Global variables are\
    \ the ones declared outside functions and can be accessible anywhere within your\
    \ code. For example:\n\n```javascript\nvar x = 10; // this is a global variable\
    \ because it isn’t declared inside the function\nturnToZero = function(number)\
    \ {\n    number = 0;\n    console.log(\"The value of x is now: \" + x);\n};\n\
    turnToZero(x);\nconsole.log(\"Outside the function the value of x is: \" + x);\n\
    ```\n\nNotice how the variable `x` can still be accessed inside the `turnToZero()`\
    \ function. Here’s where a lot of beginners get confused: when you pass a variable\
    \ to a function, just like what we did when we invoked:\n\n```javascript\nturnToZero(x);\n\
    ```\n\nYou’re just copying the value of `x` into the function, and placing it\
    \ into the temporary variable named `number`. This means that when you do stuff\
    \ to the variable `number`, you’re not really doing anything to `x`. This is why\
    \ the `turnToZero` function is useless; when you pass a variable into it, only\
    \ the value of the temporary variable is changed, not the actual variable.\n\n\
    That being said, you don’t have to pass a global variable to a function in order\
    \ to modify its value. We can simply do the following:\n\n```javascript\nvar x\
    \ = 10; // this is a global variable because it isn’t declared inside the function\n\
    turnToZero = function() {\n    x = 0;\n    console.log(\"The value of x is now:\
    \ \" + x);\n};\nconsole.log(\"Before calling the function, the value of x is:\
    \ \" + x);\nturnToZero();\nconsole.log(\"After calling the function, the value\
    \ of x is now: \" + x);\n```\n\nIn a nutshell, the `var` keyword, apart from telling\
    \ the computer that you’re declaring a variable, also tells the interpreter to\
    \ create a new variable in the current scope, which is why if it’s created inside\
    \ a function, it’ll only exist inside a function, and if it’s created outside\
    \ a function, it’ll exist throughout the whole code. With this in mind, you might\
    \ be wondering why one would even need local variables if global variables are\
    \ much easier to use. The reason for this is that global variables can make it\
    \ harder to read and debug programs. You’ll notice this when you start creating\
    \ more complex JavaScript codes, but for now, it’s best not to try modifying global\
    \ variables inside a function unless you know exactly why you’re doing it.\n\n\
    # Conclusion\n\nWith a better knowledge of functions, variables, and data manipulation,\
    \ you can now create cleaner, more efficient code! In the next chapter, you'll\
    \ learn about how you can store different types of information under one variable\
    \ name (arrays), as well as how you can repeatedly execute code.\n\n# Chapter\
    \ 5: Loops and Arrays\n\nWe’ve talked about functions and how they’re made. Now,\
    \ what if you want to, say, print a hundred lines? Since functions serve to make\
    \ our codes cleaner, we can opt to do this:\n\n```javascript\nvar consoleMessage\
    \ = function(){\n    console.log(\"I will not waste precious space\");\n    //\
    \ ... many lines ...\n    console.log(\"I will not waste precious space\");\n\
    \    // ... assume that there are 96 more of the message here\n    console.log(\"\
    I will not waste precious space\");\n};\n```\n\nso that when you can just invoke\
    \ `consoleMessage()` to perform the hundred-line command. Unfortunately, manually\
    \ typing the `console.log` statement a hundred times is still's rather unwieldy\
    \ to print so many redundant lines of code. Since we always want to shorten the\
    \ code whenever possible, we opt for a more efficient way to repeat lines of code\
    \ by using for-loops!\n\n## For-Loops\n\nFor loops tell the computer to do a bunch\
    \ of stuff for a specified number of times. The format of the for loop is:\n\n\
    ```javascript\nfor (var <variable name> = <initial value>; <condition>; <iteration>){\n\
    \    <action to be repeated>\n}\n```\n\nHere’s what it’d look like if we were\
    \ to adapt the previous example to use the for-loop:\n\n```javascript\nfor (var\
    \ counter = 1; counter <= 100; counter++){\n    console.log(\"I will not waste\
    \ precious space\");\n}\n```\n\nInstead of manually typing the `console.log` statement\
    \ a hundred times, we can use a for loop to do it for us. Now, let’s take a closer\
    \ look at the parts of a for loop:\n\n`var counter = 1`\n\nThis is the first part\
    \ of the for loop. We’re only creating this variable in order to keep track of\
    \ the number of times the chunk of code inside the for-loop has been executed.\
    \ When the for-loop ends, this variable vanishes.\n\n`counter <= 100`\n\nThis\
    \ is the condition that needs to be fulfilled in order for the code inside the\
    \ for-loop to be executed. As long as this statement is true, the code inside\
    \ the for-loop will be repeated again and again. Take care not to create a condition\
    \ that’s always true (e.g., `100 == 100`) or else you’ll have what’s known as\
    \ an infinite loop!\n\n`counter++`\n"
