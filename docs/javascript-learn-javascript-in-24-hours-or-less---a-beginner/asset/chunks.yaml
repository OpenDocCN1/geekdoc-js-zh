    \ articles you read or write.\n\nCreating an HTML file, then, is as simple as\
    \ saving your file with a .html file extension. When you create documents in a\
    \ word processor like Microsoft Word, you’ll notice that when you save your file\
    \ it has either an .odt, .doc, .docx, or something similar at the end of the filename.\
    \ This tells the computer to read and format the contents of the file in a very\
    \ specific way. This is because whenever you save something you’ve created using\
    \ a word processor you’re not just saving a bunch of words you’ve typed; you’re\
    \ also saving the font size, font styles, and other formatting styles you’ve used\
    \ so that when you open your file, your computer will check the file extension,\
    \ read the contents according to the file extension specified, and then present\
    \ you the file you’ve created, making sure that it looks exactly the same way\
    \ when you’ve saved it. \n\nHTML basically acts the same way, but this time you\
    \ use tags in order to tell the computer what to do with the data enclosed by\
    \ the tags; this allows you to easily change the font styles and other aspects\
    \ of your web page. Think of HTML as a more precise version of a Word Document.\
    \ For example, take a look at the text below:\n\n| This is a sentence. |\n\n If\
