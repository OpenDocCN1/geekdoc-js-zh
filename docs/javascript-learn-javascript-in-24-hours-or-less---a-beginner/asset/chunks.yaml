  trans: "\n相反，你可以逐行输入代码，这样你就可以看到每个命令的输出，但在处理较大的代码段时这会变得格外繁琐。当你处理更复杂的内容时，最终会遇到更多的错误和\
    \ Bug。当这种情况发生时，你会希望知道你输入的特定命令发生了什么，以便准确确定位问题所在的地方。\n\n`console.log()` 会接收你放在内部的任何代码将其执行结果打印到控制台。如此，让我们来看看\
    \ `console.log()` 的实际运行：\n\n```\nconsole.log(5 > 10)\nconsole.log(6 < 12)\nconsole.log(7\
    \ > 14)\n```\n\n现在你可以看到每行代码的输出了！\n\n# Flow 控制\n\n你现在已经知道了最基础的数据类型、数学运算符、比较运算符以及一些有趣的控制台技巧。然而，为了让它们发挥作用，我们需要能够控制命令的流。例如，如果你想创建一个询问用户姓名、电子邮件、年龄和密码的用户注册表单，你首先需要声明变量：\n\
    \n```\nvar name;\nvar email;\nvar age;\nvar password;\n```\n\n现在我们需要存储用户的输入。目前我们使用\
    \ `prompt` 函数：\n\n```\nname = prompt('What’s your name?');\nemail = prompt('What’s\
    \ your email?');\nage = prompt('What’s your age?');\npassword = prompt('Please\
    \ enter your desired password: ');\n```\n\n假设你已经在数据字段中输入了正确的信息，`name`、`email`、`age`\
    \ 和 `password` 变量现在有了处理和存储所需的正确数据类型。但是，如果用户留为空，或者在年龄字段输入了字母怎么办？如果某些关键信息字段没有正确类型的数据，我们就不能让程序继续，因此我们使用控制语句。我们将讨论的第一个是\
    \ `if` 语句。\n\n# If Statement\n\n如果你以前写过程序，JavaScript 中 `if` 语句的结构和你熟悉的几乎相同：\n\n\
    ```javascript\nif (<condition>){    <action>}\n```\n\n如果你以前没有写过程序，`if`-语句基本上告诉计算机，如果\
    \ `if` 条件为真，则执行大括号 (`{}`) 内的任何操作。例如，如果我们想防止用户输入空字段，可以采取以下措施：\n\n```javascript\n\
    name = prompt('What’s your name?');\nif (name.length == 0){    name = prompt('You\
    \ cannot leave this empty. What’s your name?');}\nemail = prompt('What’s your\
    \ email?');\nif (email.length == 0){    email = prompt('You cannot leave this\
    \ empty. What’s your email address?');}\nage = prompt('What’s your age?');\nif\
    \ (age.length == 0){    age = prompt('You cannot leave this empty. What’s your\
    \ age?');}\npassword = prompt('Please enter your desired password: ');\nif (password.length\
    \ == 0){    password = prompt('You cannot leave this empty. Please enter your\
    \ desired password:');}\n```\n\n对于初学者来说，这些代码看起来很复杂，但当你仔细阅读每一行时，你会发现它们遵循着非常清晰且逻辑结构：\n\
    \n1) 首先，由于 `prompt()` 函数返回用户输入的任何内容，你将字符串存储在变量中，以便稍后在程序中使用。\n2) `if` 语句通过检查长度是否等于零来检查变量是否为空。\n\
    \    a) 如果长度等于零，它会再次请求输入。\n    b) 如果长度不等于零，它将不再请求输入。\n\n注意，此示例代码仅用于说明 `if` 语句的工作原理。在任何情况下，都不应该一直使用\
    \ `prompt()` 函数向用户询问信息。\n\n现在，如果你在第一个条件不满足时想做其他事情怎么办？例如，如果你想在用户输入有效姓名后说“你的名字是\
    \ <name>。收到了！”，那么我们就添加一个 `else` 条件，后面跟着第二对大括号，用于包裹第二组命令：\n\n```javascript\nname\
    \ = prompt('What’s your name?');\nif (name.length == 0){    name = prompt('You\
    \ cannot leave this empty. What’s your name?');}else{    alert('Your name is '\
    \ + name + '. Got it!');}\nemail = prompt('What’s your email?');\nif (email.length\
    \ == 0){    email = prompt('You cannot leave this empty. What’s your email address?');}else{\
    \    alert('Your email is ' + email + '. Got it!');}\nage = prompt('What’s your\
    \ age?');\nif (age.length == 0){    age = prompt('You cannot leave this empty.\
    \ What’s your age?');}else{    alert('Your age is ' + age + '. Got it!');}\npassword\
    \ = prompt('Please enter your desired password: ');\nif (password.length == 0){\
    \    password = prompt('You cannot leave this empty. Please enter your desired\
    \ password:');}else{    alert('Your password is ' + password + '. Got it!');}\n\
    ```\n\n现在你的代码听起来更具人性化了，因为它对用户输入的响应更好。尝试修改代码，看看解释器如何根据 `if-else` 条件改变输出。\n\n# Debugging\n\
    \n到目前为止，你已经尝试了变量、数据类型、数学运算符、比较运算符、用户提示、对话框，最后是 `if-else` 语句。如果你犯了几个错误，不要担心；计算机本质上是字面意思，不会容忍语法错误。如此，这里有一些没有按预期运行的代码。修改以下代码片段，使其产生正确的输出！\n\
    \n```javascript\nvar name = \"Chris\";\nalert('Hi ' + 'name' + '! It’s nice to\
    \ you.');\n```\n\n在这个代码片段中，输出应该是“Hi name! It’s nice to you.” 现在的输出是什么？你认为代码哪里有问题？注意，当你执行这段代码时，控制台并不会报错抛出错误信息。这种问题被称为“Bug”，因为虽然\
    \ JavaScript 解释器认为代码没有问题，但它并没有按预期工作。\n\n现在尝试修正这个包含 Bug 和错误的代码代码段：\n\n```javascript\n\
    var name;\nvar age;\nname = prompt('What’s your name?');\nif (name.length = 0);{\
    \    name = prompt('You cannot leave this empty. What’s your name?');}else (name.length\
    \ != 0){    alert('Your name is ' + name + '. Got it!');}\nage = prompt('What’s\
    \ your age?');\nif (age.length = 0){    age = prompt('You cannot leave this empty.\
    \ What’s your age?');}else (name.length != 0){    alert('Your age is Got it!');}\n\
    ```\n\n这段代码是之前示例代码的扭曲版本，你可以尝试对比代码并看看为什么它不起。如果你卡住了，可以查看一个名为“linter”的程序，这是一个非常实用的工具，它可以检查代码中的错误并告诉你是哪几行。现在练习调试技巧是很好的锻炼，因为当你创建更复杂的程序时，调试几乎是家常便饭。\n\
    \n## 调试时寻找什么\n\n如果你不知道从哪里寻找，寻找 Bug 和错误可能会让你无所措。以下是程序员在编写代码时常见的几种常见的错误：\n\n1. 使用\
    \ `=` 而不是 `==` 来比较两个值 - 编程中的 `=` 符号用赋值运算符，这意味着如果你用它代替 `==` 符号，你会将等式左侧变量的值替换为等式右侧的值。\n\
    2. 分号位置错误 - 就像句号在英语语言中结束句子一样，分号在 JavaScript 以及 C、Java 等其他编程语言中结束语句。例如，如果你不小心在语句中间放了一个分号，JavaScript\
    \ 就会认为该语句是不完整的并对其产生错误。\n"
- fmt: "\n### 3. Misusing the quotation marks\nquotation marks tell the interpreter\
    \ that you’re using a string, so if you enclose a variable or a number in quotation\
    \ marks, you’re effectively turning them into strings. This’ll lead to anomalies\
    \ when you try to perform numerical operations onto numbers that you’ve accidentally\
    \ enclosed in quotation marks. \n\n### 4. Misspelling functions\nas I’ve mentioned\
    \ before, computers are precise, sometimes to a fault; it can’t understand anything\
    \ you misspell. Fortunately, if you misspell a function or a statement, the interpreter\
    \ will throw you an error telling you that the expression you’re using is undefined.\n\
    \nSo far, these are only the most common mistakes newbies tend to make, but along\
    \ the way you should be able to see bugs and errors quite easily as you get more\
    \ practice making more complex codes. \n\n## Recap\n\nWe’ve covered quite a lot\
    \ of concepts so far, so let’s review what we’ve learned:\n\n### 1. Variables\
    \ and data types \n- **numbers** - can be integers or numbers that contain decimals\
    \ (e.g., `3.14`, `5`, `100`)\n- **strings** - anything you enclose in quotation\
    \ marks (e.g., `\"5\"`, `\"I am a JavaScript master\"`, `\"I love the number 7\"\
    `)\n- **booleans** - true or false \n\nIn order to declare a variable, simply\
    \ type:\n\n```\n| var <variable name> = <value>; |\n```\n\nYou can also just declare\
    \ the variable name without the value if you don’t have one yet:\n\n```\n| var\
    \ <variable name>; |\n```\n\nJavaScript doesn’t care what type of data you put\
    \ in. If you’ve programmed in C or Java, you might have been used to declaring\
    \ the variable’s data type (`int`, `float`, `char`, etc.), but in JavaScript,\
    \ you can put anything in a variable without any problems. \n\n### 2. Pop-up boxes\n\
    - `alert(\"Hi There!\")` - you can pop-up alerts to the user.\n- `confirm(\"Are\
    \ you sure?\")` - you can ask for a confirmation from the user.\n- `prompt(\"\
    Type anything here.\")` - you can ask for input from the user\n\n### 3. Flow-control\
    \ \n- **if-else statement** - in a nutshell, if the first condition is met, then\
    \ do whatever’s in the first bracket enclosure and skip the 'else' part. Otherwise,\
    \ go to the bracket enclosure for the 'else' condition and do whatever’s inside\
    \ it. \n\nCongratulations! You’ve gone through a lot of programming basics through\
    \ JavaScript! If you’ve come this far, then you should be able to finish the next\
    \ few chapters in flying colors. In the next chapter, we’ll get into the nitty-gritty\
    \ details of mathematical operations and substrings. Take a break, and if you’re\
    \ ready to go deeper, go ahead and proceed to Chapter 4.\n\n# Chapter 4: Functions\
    \ and Data Manipulation\n\nBeing another dense chapter, here's a quick overview\
    \ of the things you can expect to learn:\n\n1. **Mathematical Precedence** - learning\
    \ about mathematical precedence helps you make sure that the mathematical operations,\
    \ no matter how complex, are carried out in the correct order (e.g., `5*(5+2)`\
    \ gives you a different output compared to `5*5+2`)\n2. **Modulo Operator** -\
    \ this operator gives you the remainder of a number divided by another number.\
    \ This operation is used often enough to warrant having its own operator symbol\
    \ (`%`)\n3. **String Manipulation** - there are times when you don’t need to use\
    \ the whole string in your code, such as when you want to display previews of\
    \ text that span hundreds of lines if displayed completely.\n4. **Functions**\
    \ - functions allow you to repeat a huge set of instructions that could span hundreds\
    \ or thousands of lines simply by invoking the function name! \n5. **Optimization**\
    \ - everyone prefers shorter code; it takes up much less space, and it’s also\
    \ easier to debug. The trick, however, is finding the balance between how readable\
    \ a code can be through elaboration, and how short and concise a code can be through\
    \ a couple of syntactic 'shortcuts'.\n6. **Global and Local Variables** - some\
    \ variables live only inside the function and don’t exist outside it - these are\
    \ local variables. Variables that live throughout the whole code are called global\
    \ variables. \n\n## Mathematical Precedence\n\nSo far, you’ve dealt with basic\
    \ mathematical operators and performed only single operations. In programming,\
    \ however, one rarely makes programs that have only one mathematical operation\
    \ per line. For instance, if your site wants to find out how old the user is in\
    \ terms of minutes, you’d have to do something like:\n\n```\n| var age = prompt('How\
    \ old are you?');alert('You are ' + age*365*24*60 + ' minutes old'); |\n```\n\n\
    With that in mind, you have to make sure that the operations are done in the correct\
    \ order. To do this, you’ll have to remember the following rules of precedence:\n\
    \n1. `( )` - anything you enclose in parenthesis will be done first\n2. `*` and\
    \ `/` - multiplication and division are done first before addition and subtraction\n\
    3. `+` and `-` - addition and subtraction are done last.\n\nHere are a couple\
    \ of exercises to help you visualise mathematical precedence:\n\n```\n| 5 * 10\
    \ + 3 - 5 / 20 |\n```\n\nThis would produce 52.75 because the multiplication and\
    \ division symbol takes precedence over the subtraction symbol. The story changes\
    \ when you add parenthesis to the procedure:\n\n```\n| 5 * 10 + (3 - 5) / 20 |\n\
    ```\n\nNotice how the result now becomes 49.9 because the parenthesis gave whatever\
    \ operation is inside it precedence over other operations. Here’s another example:\n\
    \n```\n| (5 * 10 + 3 - 5) / 20 |\n```\n\nNow the answer becomes 2.4, as everything\
    \ inside the parenthesis is done before it’s divided by 20. Inside the parenthesis,\
    \ the usual rules of precedence apply, so if you want lower-precedence operation\
    \ to happen first, you’ll need to enclose it in parenthesis. \n\n## A new contender:\
    \ modulo\n\nIn basic math class, there were four mathematical operators. In programming,\
    \ however, there’s an fifth operator called `%`. When placed between numbers,\
    \ it gives you the remainder. Remember that programming requires conciseness and\
    \ precision; it has no room for extraneous symbols and features, which means that\
    \ there’s a good reason why the modulo operator exists. One interesting application\
    \ of the modulo operator is testing whether a number is even or odd:\n\n```\n\
    | var num = prompt('Give me a number: ');if (num % 2 != 0){  alert('The number\
    \ is odd.');}else{  alert('The number is even.'); |\n```\n\n### Pitfall alert:\n\
    \nOne common mistake novice programmers make when trying to test whether a number\
    \ is even or odd is to check if the remainder of two numbers is equal to 1. At\
    \ a glance, this might seem logical, as for every positive number you divide by\
    \ two, the remainder can only be one or zero (e.g., `13 % 2 = 1`, and `12 % 2\
    \ = 0`). A problem arises, however, when you input a negative number; since the\
    \ remainder is no longer equal to 1, then the program starts to act erratically.\
    \ These kinds of mistakes are quite easy to make, so whenever you try out solutions\
    \ to a problem, make sure to test the code thoroughly with a wide range of input\
    \ (in this example, the user would’ve discovered the pitfall quite easily if he\
    \ were to test negative numbers). \n\nNow, try modifying the following code so\
    \ that it displays \"Greetings from planet JavaScript!\":\n\n```\n| if (14 % 2\
    \ != 0){  console.log(\"Greetings\");}if (15 % 2 != 0){  console.log(\"to\");}if\
    \ (10 % 2 != 0){  console.log(\"from\");}if (9 % 2 != 0){  console.log(\"atmosphere\"\
    );}if (5 % 3 != 0){  console.log(\"planet\");}if (20 % 2 != 0){  console.log(\"\
    JavaScript\");} |\n```\n\n## Messing with strings\n\nSo far, we’ve managed to\
    \ play around with numbers, from performing regular mathematical operations, to\
    \ comparing values, to seeing what the modulo operator can do. Now, we’re going\
    \ to mess around with strings and see what you can do with them. \n"
