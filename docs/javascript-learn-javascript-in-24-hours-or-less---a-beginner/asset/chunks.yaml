    \ of your site doesn’t work, you only need to find the function responsible for\
    \ the bug instead of checking your whole code line-by-line. \n\nIn a nutshell,\
    \ a function takes in a bunch of information, does something with the information,\
    \ and then gives you something out of that. Here’s a step-by-step guide on how\
    \ to create a function:\n\n1.  Declare a function using var, and give it a name\
    \ just as you would to any data type. Programmers have agreed to a naming convention\
    \ wherein the name should always start with a lowercase letter and then uppercase\
    \ for each succeeding word that follows. This is called the lower camel case convention\
    \ (e.g., anExampleOfTheCamelCaseConvention).\n\n2.  After giving the name of the\
    \ function, you use the word 'function' to tell the interpreter that you’re making\
    \ a function, not a string, number, or boolean.\n\n3.  Inside the parenthesis\
    \ that comes after 'function' are your function parameters. As you may have noticed\
    \ from our bakeCake function, ingredient1, ingredient2, and ingredient3 were replaced\
    \ by eggs, chocolate, and flour. You can think of the former as variable names,\
    \ and the latter as the values inside the variables, such that by invoking 'bakeCake('eggs',\
    \ 'chocolate', 'flour'),' you’re effectively assigning 'eggs' to ingredient1;\
    \ 'chocolate' to ingredient2; and 'flour' to ingredient3. \n\n4.  Inside the brackets\
    \ would be your function body. This is the place where you do stuff to the parameters\
    \ you’ve asked for (ingredient1, ingredient2, and ingredient3 for this example).\n\
    \nTake note that every line of code inside the brackets should end with a semicolon.\
    \ At the end of the function, just after the closing bracket, you’ll also need\
    \ a semicolon to tell the computer that you’re done creating the function.\n\n\
    ## \n\nReturn Values\n\nSo far, the functions are almost standalone, in a sense\
    \ that all they do is execute a whole bunch of statements. What’s interesting\
    \ about them, however, is that we can also use functions the same way we use numbers,\
    \ strings, and booleans when we add a return value. A return value is any type\
    \ of data given back by a function. Whenever a return statement is invoked, the\
    \ computer typically assumes that the function is done doing what it needs to\
    \ do and therefore throws whatever is in the return statement back to the code\
    \ that called the function. For instance, going back to our computeSum() function:\n\
    \n| var computeSum = function (firstNumber, secondNumber){    var result = firstNumber\
    \ + secondNumber;    console.log(result);}; |\n\nTry accessing the 'result' variable\
    \ outside the function call by moving the console.log(result) command just outside\
    \ the computeSum() function. You should encounter an error saying that the variable\
    \ 'result' is not defined. In programming, when you declare variables inside a\
    \ function, they only exist inside that function. If you want to get the result,\
    \ you’ll have to set it as the return value:"
