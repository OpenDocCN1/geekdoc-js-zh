  trans: "\nRuby 语言的哈希（Hash）和数组（Array）都是对象的集合。它们都包含一组可以通过“键”（key）来访问的对象。哈希允许你使用任何类型的对象作为键。而数组则要求你使用整数作为键。哈希和数组都可以扩展包含更多元素。在访问对象方面，数组提供了极高的效率。然而哈希提供了巨大的灵活性。哈希和数组可以包含不同数据类型的对象。因此，你可以创建一个哈希来存储一个字符串和一个整数。\n\
    \n你应该使用数组字面量（即写在方括号之间的元素集合）来生成数组对象。一旦你有了数组，就可以通过在方括号中输入索引来访问其元素。如下例所示，Ruby 的索引从零开始。\n\
    \n```ruby\nx = [ 5, 'alligator', 9.99 ]    # 包含三个元素的基础数组\n\nputs = “The third\
    \ element of the array is #{x[2]}”\n\n# 修改第一个元素\n\nx[0] = 6\n\nputs “The elements\
    \ of the array are #{x.inspect}”\n```\n\noutput:\nThe third element of the array\
    \ is 9.99\nThe elements of the array are [6, “alligator”, 9.99]\n\n当前的示例涉及一个名为“nil”的特殊值。在大多数计算机语言中，`nil`\
    \ 指的是任何对象的缺失。但在 Ruby 语言中，`nil` 有不同的含义：它是一个不代表任何内容的对象。\n\n创建基于单词的数组可能是困难的，特别是因为逗号和引号。幸运的是，Ruby\
    \ 语言提供了一个快捷方式：“%w”。分析下面的示例：\n\n```ruby\nx = [ 'knight', 'bishop', 'king', 'queen',\
    \ 'pawn' ]\n\nx[2]      # “king”\n\nx[4]      # “pawn”\n\n# 下面提供的代码产生相同的结果：\n\n\
    x = %w{ knight bishop king queen pawn }\n\nx[2]      # “king”\n\nx[4]      # “pawn”\n\
    ```\n\n哈希类似于数组。哈希字面量需要大括号而不是方括号。它的字面量应该为每个项目提供两个对象：值和键。你必须使用“=>”来分隔这些对象。\n\n例如，你可以将歌曲映射到演唱它们的艺术家。下面的哈希将向你展示如何做到：\n\
    \n```ruby\nsongs_artists = {\n'If You Could See Me Now' => 'The Script'\n'Night\
    \ Changes'      => 'One Direction'\n'Love Yourself'      => 'Justin Bieber'\n\
    }\n```\n\n代码左侧的单词作为键。同时，右侧的是值。在 Ruby 中，每个键应该是唯一的——如果你输入两次 'Love Yourself' 将得到错误。\n\
    \n与数组类似，你需要使用方括号对哈希进行索引。对于当前的示例，你应该使用一个名为 `p` 的方法在终端上打印值。该方法类似于 `puts`。唯一的区别是\
    \ `p` 会显式地打印值。\n\n```ruby\np songs_artists[ 'Night Changes' ]\n\np songs_artists[\
    \ 'If You Could See Me Now' ]\n\np songs_artists[ 'Love Yourself' ]\n\np songs_artists[\
    \ 'Like a Virgin' ]\n```\n\noutput:\n“One Direction”\n“The Script”\n“Justin Bieber”\n\
    nil\n\n如你所见，当你输入无效索引时，哈希会返回 `nil`。这在大多数情况下是一个方便的功能，因为如果将在条件表达式中使用，`nil` 等同于 `false`。然而，Ruby\
    \ 允许你更改此功能。例如，如果你想知道每个单词在文件中出现了多少次，你可以设置零（即“o”）作为你的默认值。在这里，你可以将单词设置为键并只需增加对应的值。\n\
    \n## 符号（Symbols）\n\n在编程时，你通常需要为每个重要的对象命名。例如，你可以为每个指南方向设置一个名称。这里有一个例子：\n\n```ruby\n\
    EAST        =  1\nWEST       =  2\nNORTH  =  3\nSOUTH  =  4\n```\n\n你可以在代码的剩余部分使用这些名称。这是一个示例：\n\
    \n```ruby\nwalk(SOUTH)\nlook(WEST)\n```\n\n**注意：** 在大多数情况下，常量的数值值并不重要（它只需要是唯一的）。\n\
    \nRuby 语言提供了一个更简单的替代方案。符号是不需要预先定义的常量名。此外，符号在 100% 的情况下都是唯一的。符号字面量以“:”开头。检查下面的示例：\n\
    \n```ruby\nwalk( :SOUTH )\nlook( :WEST )\n```\n\n你不需要为你的符号设置任何值——Ruby 会替你完成。此外，Ruby\
    \ 确保符号无论在应用程序中的什么位置都会保留其值。下面的代码将说明这一观点：\n\n```ruby\ndef walk(compass_point)\n\
    \  if compass_point == :SOUTH\n  # …\n  end\nend\n```\n\nRuby 程序员经常在哈希中使用符号。你可以使用符号来重写上面的“songs_artists”示例：\n\
    \n```ruby\nsongs_artists {\n'If You Could See Me Now' => 'The Script'\n'Night\
    \ Changes'      => 'One Direction'\n'Love Yourself'      => 'Justin Bieber'\n\
    }\n```\n"
