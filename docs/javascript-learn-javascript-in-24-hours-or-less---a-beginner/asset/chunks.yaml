  trans: "\n现在在你的电脑上创建一个文件夹，用于存储所有创建的 HTML 文件，并将你刚刚输入的内容保存为 `.html` 扩展名（例如，“My First\
    \ Website.html”）。程序员的一个标准做法是创建一个名为“Developer”的文件夹——这是你存储所有与编程相关文件的地方。你可以将其放在用户文件夹中。在\
    \ Developer 文件夹内部，创建一个名为“Web Development”的文件夹，目前将你所有的 HTML 文件都放在这里。如果你使用的是 TextEdit\
    \ 或其他并非专门为 HTML 文件设计的文本编辑器，请务必检查设置并确保选中了“纯文本（Plain text）”格式。\n\n现在，你已经创建了第一个 HTML\
    \ 文件，使用你拥有的任何网络浏览器打开它，并亲眼看到一个简单的文本字符串出现在你眼前吧！但是，请注意，你在文本编辑器中输入的内容（称为“源代码”）看起来和浏览器显示的内容一模一样；它并没有包含\
    \ `<html>` 标签和其他内容。这是为什么呢？\n\n现在，尝试通过添加几个标签来修改你的 HTML 文件。它看起来应该像这样：\n\n```\n|\
    \ <!DOCTYPE html><<html>   <<body>      Hi Here!   </</body>></html> |\n```\n\n\
    现在刷新你的浏览器看看发生了什么。\n\n你的浏览器并没有故障；尽管源代码中添加了标签，但网页看起来几乎一模一样。此时，你可能还没有完全理解为什么要使用标签，但别担心；当你开始更多地学习\
    \ HTML 编程时，你就会知道它们的用途了。\n\n## 结论\n\n你刚刚完成了对 HTML 的首次尝试——虽然并不深入，但足够的基础知识可以帮助你正确地将\
    \ JavaScript 用于 HTML。如果你对学习更多 HTML 感感兴趣，你可能想查看在线教程和参考资料，并看看其他网页开发者是如何编写自己的网站代码的。你可以通过右键点击网站并点击“查看网页源代码”或类似的选项来实现。如果你已经准备好投入\
    \ JavaScript 的怀抱，请前往第 2 章。\n\n# 第 2 章：JavaScript 简介\n\n既然我们已经涵盖了 HTML 的基本要素，现在我们可以介绍以\
    \ JavaScript 为媒介的编程基础。在继续之前，请确保你至少理解 HTML 的骨架，否则请随时返回第 1 章再次快速浏览一遍材料。\n\n## 组合\
    \ HTML 和 JavaScript\n\nJavaScript 可以通过 `script` 标签方便地整合到 HTML 中。`script` 标签既可以包含\
    \ JavaScript 代码，也可以引用包含 JavaScript 代码的 `.js` 文件。在创建长 JavaScript 代码时，建议使用后者，以避免在一个文件中混用不同的编程语言——这就像在写文章时，有些段落用英语，另一些段落用拉丁语！然而，当你测试小的\
    \ JavaScript 代码段时，使用内部 JavaScript 是很有用的。\n\n### a. 内部 JavaScript\n\n如果你想在不创建 `.js`\
    \ 文件的情况下使用 JavaScript，可以直接将 JavaScript 放在 `script` 标签内部，如下所示：\n\n```\n| <script>\
    \    alert(\"Hi There!\");</script> |\n```\n\n将此内容按所示放入你的 HTML 文件中，查看你的第一个 JavaScript\
    \ 代码弹出并向你问候吧！\n\n```\n| <!DOCTYPE html><<html>   <body>      <script>        \
    \  alert(\"Hi There!\");      </script>   </body></html> |\n```\n\n很酷，对吧？虽然这段代码简单易懂，但当你开始编写具有更复杂代码网站时，将不同的编程/脚本语言放在同一个文件中会变得非常难以管理。将\
    \ JavaScript 代码放在单独的文件是有意义的，这样 HTML 代码就能整洁且更容易维护。这正是外部 JavaScript 大显身手的地方。\n\n\
    ### b. 外部 JavaScript\n\n正如你可以从 HTML 文件中引用 CSS 文件以保持代码分离一样，你也可以将 JavaScript 保存在单独的文件中，并从\
    \ HTML 中引用该文件。为了使用保存在另一个文件中 JavaScript 代码，你只需要使用包含 `src` 属性的 `script` 标签，该属性引用你想使用的文件，如下：\n\
    \n```\n| <script src=\"hello.js\"></script> |\n```\n\n这段代码段将找到名为 `hello.js` 的文件并执行其中包含任何\
    \ JavaScript 代码。但是，请确保 JavaScript 文件与 HTML 文件位于相同的文件夹中。\n\n### c. 即时 JavaScript\
    \ \n\n如果你想在不修改原始源代码的情况下测试简短的 JavaScript 语句，可以通过右键点击网页并点击“检查（inspect element）”使用\
    \ Google Chrome 和 Firefox 提供的控制台。在控制台窗口/标签页中，你可以输入任何想要的 JavaScript 语句，按回车即可立即执行。你可以选择这种方法来测试书中的代码段，或者如果你喜欢更传统的方法，可以使用\
    \ `script` 标签编写你的 JavaScript 代码并刷新网页来更新输出。然而，在后续提供的示例和练习中，将使用使用控制台的现代方法。\n\n##\
    \ 认识 JavaScript\n\n为了让你快速上手 JavaScript，你将尝试几行 JavaScript 代码。目前，我们将使用控制台来尝试命令（右键点击任何网页，点击检查，并找到控制台标签页）。在你测试后续代码时，请确保不要被动地将它们复制并粘贴到控制台中。观察这种语言的结构，并在检查之前对输出结果做几个猜测。这将有助于你更容易记住你所学的内容。\n\
    \n```\n\n你刚刚创建了一个字符串，它基本上是字母、数字和其他符号的集合。即使只用一个字符串，我们也可以做很多事情，但现在，让 JavaScript\
    \ 计算你的名字有多少个字母：\n\n```\n\"Chris\".length\n```\n\n你应该得到 5。虽如此，除了处理字符串外，JavaScript\
    \ 还懂得数学运算。尝试将你的姓名的长度相加，例如：\n\n```\n\"Chris\".length + \"Nicholas\".length\n```\n\
    \n这将给你 13。现在去使用实际数字进行尝试，并尝试乘法（`*`）、除法（`/`）和减法（`-`）。注意，虽然你目前为止输入的命令非常直观且容易理解，但与人类语言相比，编程语言需要更高的精度。例如，如果你尝试阅读以下内容：“Tihs\
    \ is a Complx Stenence”，你能破解它的含义，但在编程语言中，即使你只是错放了一个点，最好也会收到一个错误——最坏会产生 bug。例如，尝试输入以下代码：\n\
    \n```\n\"Chris\"l.ength\n```\n\n除了拼写错误和符号位置错误，另一种混淆解释器的方法是使用它不知道的命令，例如，如果你输入：\n\
    \n```\nbacon\n```\n\n解释器会报错并说 `bacon` 未定义。因为你在没有加引号的情况下输入了 `bacon`，解释器认为你试图让它执行\
    \ `bacon` 命令，而这在目前的 JavaScript 库中并不存在。\n\n如果你只想在代码中输入提示和描述怎么办？你可以通过在行开头输入 `//`\
    \ 来告诉解释器忽略这些代码。例如：\n\n```\n//这是一条注释。解释器不在乎我在这里写了什么，即使是有效命令如//2+3//通过移除 '//'，2+3//你应该得到\
    \ 5。\n```\n"
- fmt: "\nNow, you might be wondering why we’re going through strings, mathematical\
    \ operations, and comments with JavaScript when you’ve just wanted to make websites\
    \ come to life, but before you can produce stunning animations, intelligent user-interaction,\
    \ and other dynamic stuff, we have to lay the groundwork first. Now, let’s have\
    \ a little fun by creating your first pop-up dialogue box:\n\n```javascript\n\
    confirm('Hi! You’ve just made your first pop-up dialogue. Congratulations! Click\
    \ OK to go further!');\n```\n\nYou after clicking `OK`, you should see a `'true'`\
    \ printed in the console. This is because JavaScript can also record user input,\
    \ much like `HTML`. What’s interesting with JavaScript, however, is that it doesn’t\
    \ need to refresh the page to ask for user input; it simply pops-up a small, separate\
    \ window to ask you a question, and returns to the web page you were working on.\
    \ This is especially useful when asking users for confirmation after they’ve filled\
    \ up a form or decided to delete something - since no webpage refresh is required,\
    \ the users can go back to whatever they’re doing after clicking `OK` or `CANCEL`.\
    \ \n\nOkay, so far, you’ve managed to write your first string, ask JavaScript\
    \ to compute its length, perform mathematical operations, write comments, and\
    \ create pop-up confirmation dialogues. In order to make a website do really cool\
    \ things, however, it needs to be able to get more than just a `'true'` or a `'false'`\
    \ from a user, otherwise strings and mathematical computations would really be\
    \ useless. \n\nWith this in mind, let’s try making JavaScript ask for your name:\n\
    \n```javascript\nprompt('Hello! What’s your name?');\n```\n\nAfter inputting your\
    \ name, you should see whatever you’ve typed in the console output. Way to go!\
    \ \n\n# Storing Information\n\nEvery programming language needs to be able to\
    \ store information; otherwise there’s no way for it to make calculations and\
    \ other important procedures, which is what computers were built for in the first\
    \ place.\n\nSo far we’ve only been able to ask for the user’s name, without even\
    \ doing anything with it. This is because your name wasn’t stored; it was just\
    \ printed in the console. Let’s use the power of variables so it can greet you\
    \ after it asks for your name. Here’s how:\n\n```javascript\nvar name = prompt('What’s\
    \ your name?');alert('Hi, ' + name + '! It’s nice to meet you.');\n```\n\nNow\
    \ your program becomes more personal and more human, simply by responding to the\
    \ user. Don’t worry too much about the syntax if it overwhelms you; you’ll learn\
    \ more about what the `alert()` and `prompt()` functions do, and how you can make\
    \ your own functions as we dive deeper into JavaScript. \n\n## Conclusion\n\n\
    Congratulations! You’ve just gotten your first taste of JavaScript! It’ll get\
    \ even more interesting in the next chapter as we talk about what types of information\
    \ you can use and what we can do with them. You’ll also get your first glimpse\
    \ into how you can help your program make decisions, as well as what to do if\
    \ the your program doesn’t behave the way you expect it to. It’ll be quite a handful\
    \ of information to take in one sitting, so take a break and come back when you’re\
    \ ready to dive further into the essentials of JavaScript. \n\n# Chapter 3: JavaScript\
    \ Essentials\n\nSince this chapter is quite dense, here's an overview of what\
    \ you can expect to learn:\n\n1. **Data types** - how JavaScript classifies information.\
    \ This is important because knowing what type of information you have will also\
    \ tell you what you can do with that information (e.g., you can’t multiply 5 with\
    \ apples.)\n2. **Comparison Operators** - lets you compare certain types of information\
    \ (e.g., is 5 less than 10?). This is useful when you want to give the computer\
    \ instructions that relies on certain conditions being met (e.g., allow the user\
    \ to register only if the age is more than or equal to 18)\n3. `Console.log()`\
    \ - lets you display the output of a single line of code - useful when you want\
    \ to see how information flows in your program per line of code.\n4. **Flow Control**\
    \ - `if-else` statements give the computer different instructions to execute depending\
    \ on which condition is met (e.g., allow the user to enter site if the age is\
    \ more than 18, otherwise, display an error message)\n5. **Debugging** - when\
    \ your program behaves erratically (e.g., misspelling the user’s name or forgetting\
    \ it completely), then you need to find which part of your code is messing up\
    \ your program’s behavior - this process is called debugging. This can become\
    \ rather daunting when the code spans more than a thousand lines - knowing where\
    \ to look will come in handy. \n\nSo far, you’ve played with strings and numbers\
    \ using JavaScript. In the programming world, these categories of information\
    \ are referred to as data types.\n\n## Data Types\n\nData types simply tell the\
    \ computer how your information should be read. For instance, if you type the\
    \ following into the console:\n\n```javascript\n\"5\" + \"5\"\n```\n\nYou’d get\
    \ `\"55.\"`. This is because by enclosing 5 using quotation marks, you’re telling\
    \ the interpreter that you want 5 to be treated as a string, not a number. The\
    \ addition operator, then, instead of adding the two numbers, combines the two\
    \ strings. Now try removing the quotation marks and notice how the output changes\
    \ to 10. There are different things you can do with different data types, so it’s\
    \ extremely important to know which one to use:\n\n1. **Strings** - Anything you\
    \ enclose in quotation marks will end up being a string. This can be a combination\
    \ of letters, spaces, numbers, punctuation marks, and other symbols.\n2. **Numbers**\
    \ - Self-explanatory; numbers are the ones you can perform addition, subtraction,\
    \ multiplication, and division to, among others. Remember not to put quotation\
    \ marks or you’ll turn them into strings!\n3. **Booleans** - booleans are data\
    \ types that can only be true or false. This is different from a string or a number,\
    \ because it helps the computer make decisions based on whether or not certain\
    \ conditions are met. For example, if you want to prevent minors from registering\
    \ your site, you’d have to have some sort of code to separate minors from the\
    \ adults, like:\n\n```javascript\nvar age = 1718\n```\n\n## Comparison Operators\n\
    \nSo far, we’ve talked about three data types (numbers, strings, and booleans),\
    \ as well as some basic mathematical operators (`+`, `-`, `*`, `/`). What you’ve\
    \ just used to test out booleans, however, are comparison operators (`<`, `>`,\
    \ `=`), which are extremely important in managing the flow of your program. Here’s\
    \ the complete list and what they can do:\n\n- `>` Greater than\n- `<` Less than\n\
    - `>=` Greater than or equal to\n- `<=` Less than or equal to\n- `==` Equal to\n\
    - `!=` Not equal to\n\nTo test out these operators, replace the `@` symbol with\
    \ the correct operator in the following statements in order to make the console\
    \ output true:\n\n```javascript\nconsole.log(5 @ 1);console.log(1 @ 5);console.log(5\
    \ @ 2);console.log(1 @ 6);console.log(5 @ 5);console.log(10 @ 5);\n```\n\n## Knowing\
    \ what the Interpreter is Thinking\n\nNotice how the JavaScript interpreter only\
    \ gives you the latest output of the commands you type in, so if you’ve typed\
    \ in three lines of code that should have different outputs:\n\n```javascript\n\
    5 > 106 < 127 > 14\n```\n\nExecuting them all at the same time in the console,\
    \ you’d only get the result of the last line (false).\n"
