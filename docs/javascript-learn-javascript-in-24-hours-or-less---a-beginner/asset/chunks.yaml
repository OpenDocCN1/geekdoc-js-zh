    \ makes sure that eventually, the counter will reach 100 and will therefore cause\
    \ the 'counter <= 100' statement to return false. Without this statement, the\
    \ counter will stay at 1, and the 'counter <= 100' statement will always return\
    \ true!\n\nThese three statements are what help for-loops run a chunk of code\
    \ for a precise number of times. Here are a bunch of additional tips to help you\
    \ create for-loops better:\n\n1.  You can also count backwards if you want, changing\
    \ the condition from (<) or (<=) to (>) or( >=), and then decrementing (counter--).\n\
    \n2.  You can also increment or decrement with any other number by writing something\
    \ like \"counter+=n\" or \"counter-=n\"where n is the number you want to add or\
    \ subtract to the counter.\n\n3.  Be careful with the conditions you set! If you\
    \ create a for-loop that results in an infinite loop, your browser will crash!\n\
    \nThat being said, here’s a code that’ll result in an infinite loop, and consequently,\
    \ a browser crash:\n\n| for (var counter = 1; counter <= 10; counter--){    console.log(counter);}\
    \ |\n\nAs an exercise, change this for-loop so that it ends up displaying the\
    \ numbers 1-10 in the console.\n\n## \n\nArrays\n\nIf you wanted to, say, record\
    \ ten names, without using arrays, you’d have to do something like:\n\n| var name1,\
    \ name2, name3, name4, name5, name6, name7, name8, name9, name10; |\n\nAnd this\
    \ is only for declaring the variables! Here’s how messy it would be if you actually\
    \ have to store user input using this method:\n\n| for (var counter = 1; counter\
    \ <= 10; counter++){    if(counter == 1)    {        name1 = prompt('Please enter\
    \ name 1: ');    }    if(counter == 2)    {        name2 = prompt('Please enter\
    \ name 2: ');    }    if(counter == 3)    {        name3 = prompt('Please enter\
    \ name 3: ');    }    if(counter == 4)    {        name4 = prompt('Please enter\
    \ name 4: ');    }    if(counter == 5)    {        name5 = prompt('Please enter\
    \ name 5: ');    }    if(counter == 6)    {        name6 = prompt('Please enter\
    \ name 6: ');    }    if(counter == 7)    {        name7 = prompt('Please enter\
    \ name 7: ');    }    if(counter == 8)    {        name8 = prompt('Please enter\
    \ name 8: ');    }    if(counter == 9)    {        name9 = prompt('Please enter\
    \ name 9: ');    }    if(counter == 10)    {        name10 = prompt('Please enter\
    \ name 10: ');    }} |\n\nNow imagine if social media sites used this method to\
    \ register the users; programmers would have to keep recoding the site in order\
    \ to accommodate more users! Fortunately, we have arrays to help us.\n\nArrays,\
    \ in a nutshell, can store lists of data that could even have different data types.\
    \ The data stored have fixed positions, so you’re sure of where each data is placed\
    \ and can therefore retrieve them reliably. Here are examples of array declarations:\n\
    \n| var strings = [\"apple\",\"grapes\",\"tomatoes\"];var numbers = [1, 2, 3,\
    \ 4, 5];var stringsAndNumbers = [\"Oceans\", 11]; |\n\nAs you may have noticed,\
    \ the declaration statements for arrays are pretty similar to the declaration\
    \ statements for regular variables; the only difference is that the data are enclosed\
    \ in braces and separated by commas. If you want to create an empty array, you\
    \ can leave the braces blank and add a couple of items later using the push()\
    \ function, for instance:\n\n| var numbers = [];for (var counter = 1; counter\
    \ <= 10; counter++){    numbers.push(counter);} |\n\nNow we can go back to our\
    \ previous attempt at getting ten names! Let’s see how using arrays drastically\
    \ improves our code:\n\n| var names = [];for (var counter = 1; counter <= 10;\
    \ counter++){    names.push(prompt('Please enter name ' + counter + ':'));   \
    \ console.log('Obtained name ' + counter);} |\n\nOur code just became much more\
    \ efficient and much better to look at! Congratulations! \n\nSo far, you’ve learned\
    \ how to declare arrays and put stuff in them, but how exactly can we access what’s\
    \ inside them? Well, the position of the items we place inside the array stay\
    \ in the same spot, so we only need to know what the name of the array is and\
    \ the numerical position of the item we’ve stored.\n\nOne small caveat though:\
    \ in programming, we always start counting from 0, so if you have 10 items in\
    \ an array, your first item will be in the 0th place while your last item will\
    \ be in the 9th place. That being said, if you want to access the names you’ve\
    \ just collected, simply do something like:\n\n| console.log(names[0]); //for\
    \ the 1st nameconsole.log(names[9]); //for the 10th name |\n\nSometimes, when\
    \ you just keep adding stuff to an array, you may lose track of how big it is.\
    \ Fortunately we can just use the '.length' keyword we normally add to strings\
    \ in order to count the number of characters. For instance, if we were to count\
    \ the number of names stored in our variable 'names', we’d need to just append\
    \ .length to 'names:\n\n| names.length |\n\nGreat job! You’ve now learned how\
    \ to create arrays and how to put stuff inside them. As an exercise, create a\
    \ for-loop that prints out every name from the 'names' array into the console.\
    \ Hint: the 'counter' variable comes in handy when keeping track of the index\
    \ of the array.\n\nNotice how we’re slowly building up your arsenal of programming\
    \ tools:\n\n1.  Variables - allow you to store information so you could do interesting\
    \ stuff with them later\n\n2.  Mathematical Operators - allow you to perform calculations\n\
    \n3.  Comparison Operators - allow you to check how a value is greater, less than,\
    \ equal, or not equal to another value.\n\n4.  if-else statements - allow you\
    \ to give the computer a bunch of stuff to do depending on the circumstance\n\n\
    5.  functions - allow you to keep your code clean and easy to manage\n\n6.  for-loops\
    \ - allow you to make the computer do stuff for a specific number of times\n\n\
    7.  arrays - allow you to store a list of information under one variable name\n\
    \nThese are, at the most basic level, what programming is - giving precise instructions\
    \ to computers in the most efficient manner possible. \n\n## \n\nA Mini Project:\
    \ Text-Searching\n\nNow that you have a basic arsenal of programming tools, let’s\
    \ create a short program that tries to search for a string in a block of text. \n\
    \n| var textBlock = \"I can create a really really long sentence but never mind.\"\
    ;var queryWord = \"really\";var matchCount = 0;//loops through each letter of\
    \ the textBlock variablefor (var counter = 0; counter < textBlock.length; counter++){ \
    \   //The first condition checks if the first letter of the query word is in the\
    \ current index of the textBlock; this would mean that we might get a match. \
    \   //The second condition checks if the remaining text from the textBlock left\
    \ unchecked is at least bigger than the queryWord (You can’t exactly look for\
    \ the word, \"Apple\" from \"Ap\").     if((textBlock[counter] == queryWord[0])\
    \ && (textBlock.length-counter >= queryWord.length))    {        var match = true; \
    \       for(var counter1 = 0; counter1 < queryWord.length; counter1++)       \
    \ {            if(!(textBlock[counter+counter1] == queryWord[counter1]))     \
    \       {                match = false;                break;            }   \
    \     }        if(match==true)        {            matchCount++;        }    }}console.log('Done!\
    \ Total matches: ' + matchCount); |\n\nWhew! That was quite a lot of for-loops\
    \ and if-statements, wasn’t it? If the code seems rather intimidating to you,\
    \ don’t worry; we’ll take you through it step-by-step. First, let’s go over what\
    \ a lot of tutorials gloss over when explaining how these programs work: how can\
    \ you explain the concept of looking for a word in a block of text to a computer\
    \ that only knows how to perform precise instructions? We'd have to convert the\
    \ problem, then, from the english form, \"I want to find a word in a block of\
    \ text\" into a more specific set of commands. Here’s a set of thinking points\
    \ to consider:\n\n*   Blocks of text and words are strings; you can access each\
    \ letter using the string’s index."
