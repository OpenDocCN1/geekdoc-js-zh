    Notice how the program now asks for input again and again until it gets a valid
    input from the user. Take note, however, that a repeated pop-up only serves as
    an example to illustrate the power of the `while-loops` and should not be used
    in actual programs, especially in websites; nobody likes receiving too much intrusive
    pop-ups.


    ## Do-While Loops


    There are times wherein you want to make sure that a set of instructions get executed
    at least ONCE before possibly repeating, no matter what happens. For instance:


    ```javascript

    var bool = false;while (bool){    console.log("I wanna be seen!");}

    ```


    Because the condition already returns `false`, nothing inside the `while` loop
    gets executed. `Do-while` loops, on the other hand, has the following syntax:


    ```javascript

    do{    <something>} while (<condition>);

    ```


    Notice how the `while` statement goes at the end of the block of code, followed
    by a semicolon, because the computer checks for the condition only when the block
    of code inside the `do-while` loop has been executed. Modifying our previous example,
    we now have:


    ```javascript

    var bool = false;do{console.log("I wanna be seen!");} while (bool);

    ```


    As an exercise, rewrite the example that asks for the user’s name, email, age,
    and password to use `do-while` loops. Instead of saying "you cannot leave this
    empty…", you can instead ask the user "What’s your…" again.


    ## If-Else If-Else


    So far, we’ve only made `if-else` statements that only gave us two options to
    choose from - execute the block of code EITHER in the `if` or `else` statement.
    Fortunately, if we need to add more options, we can just add an `else if` block
    between the `if` and `else` blocks. That being said, here’s what the `if-else
    if-else` statement would look like:


    ```javascript

    if ( <condition> ){    <action>}else if ( <condition> ){    <action>}else{    <action>}

    ```


    Here’s an example on how we can apply the `if-else if-else` statement:


    ```javascript

    var input = prompt("Please enter a number: ");if(input.length == 0){    alert("You
    haven’t entered anything!");}else if(isNaN(input)) //isNaN is a function that
    checks if the data in question is a number or not. It actually stands for is-Not-a-Number.{    alert(input+"
    isn’t a number!");}else{    alert("You’ve typed: " + input);}

    ```


    As an exercise, create a loop that will keep asking the user for a number until
    the user provides valid input (strings and empty input aren’t valid). Hint: a
    combination of a `do-while` and an `if-else if-else` code would be useful.


    ## Switch Statement


    `If-else if-else` statements let you give conditional instructions to the computer,
    but sometimes, one just needs the computer to perform specific instructions based
    on specific user input. The analogue of this in real life would be like choosing
    drinks from a vending machine. With set, hardwired choices, it wouldn’t make sense
    to have the user type in his choice. It’d make more sense to have buttons that
    correspond to the preferred drink. With that in mind, here’s what a `switch` statement
    would look like:


    ```javascript

    var drinks = ["[a] Soda", "[b] Juice", "[c] Water", "[d] Milk"];var choice = prompt("Hi
    there! What are you in the mood for? We have: " + drinks + ". Please key in the
    letter of your choice.");switch(choice){    case ''a'':        alert("Dispensing
    one soda. Have a nice day!");        break;    case ''b'':        alert("Dispensing
    one juice. Have a nice day!");        break;    case ''c'':        alert("Dispensing
    one water. Have a nice day!");        break;    case ''d'':        alert("Dispensing
    one milk. Have a nice day!");        break;    case null:        alert("You don’t
    want anything? Alright, have a nice day!");        break;    case '''':        alert("You
    don’t want anything? Alright, have a nice day!");        break;    default:        alert("I’ve
    never heard of this " + choice + ". Here, take this water instead.");}

    ```


    Notice how it’s really quite similar to the `if-else if-else` statement, except
    that you can’t put mathematical expressions in the `cases`; you can only let the
    computer pick the block of code to execute based on the input the user gives.
    The `default` block, much like the `else` block, tells the computer what to do
    in case the user doesn’t pick any of the choices that have corresponding cases
    in the `switch` statement.


    Note: the `break` keyword tells the computer that the code for the specific case
    is finished executing and therefore can exit. If you remove this, the code continues
    to other cases; always remember to place `break` after every case!


    ## Review


    Well done! You’ve just completed your arsenal of flow control tools:


    1. The `if-else` and `if-else if-else` statements

    2. The `for`, `while`, and `do-while` loops

    3. The `switch` statement


    It is by mastering these flow control tools that you can make more efficient programs,
    so it’s important to keep practicing and look at new ways which you can optimize
    your code. For instance, let’s take a look at our text-search application (take
    note of the added lines in red):


    ```javascript

    var textBlock = "And so we’re back to this program.";var queryWord = "so";var
    matchCount = 0;for (var counter = 0; counter < textBlock.length; counter++){console.log("Outer
    for loop processing letter: " + textBlock[counter]);    if((textBlock[counter]
    == queryWord[0]) && (textBlock.length-counter >= queryWord.length))    {    console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);      var
    match = true;      for(var counter1 = 0; counter1 < queryWord.length; counter1++)    {        if(!(textBlock[counter+counter1]
    == queryWord[counter1]))    {            match = false;            break;        }      if(match==true)    {            matchCount++;        }    else    {console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);  }}console.log(''Done!
    Total matches: '' + matchCount);

    ```


    While the program currently works well, the problem is that the outer loop continues
    to run even if the remaining letters left of the huge block of text isn’t big
    enough to match our query. You can see this because both the `for-loop` and the
    `if-else` code still display the console message we’ve added. In programming,
    we make sure our program runs as efficiently as possible, so let’s add a bit of
    code to optimize our program:


    ```javascript

    var textBlock = "And so we’re back to this program.";var queryWord = "back";var
    matchCount = 0;for (var counter = 0; counter < textBlock.length; counter++){console.log("Outer
    for loop processing letter: " + textBlock[counter]);    if((textBlock[counter]
    == queryWord[0]) && (textBlock.length-counter >= queryWord.length))    {    console.log("Code
    inside ''if-else'' statement now processing letter: " + textBlock[counter]);      var
    match = true;      for(var counter1 = 0; counter1 < queryWord.length; counter1++)    {        if(!(textBlock[counter+counter1]
    == queryWord[counter1]))    {            match = false;            break;        }      if(match==true)    {            matchCount++;        }    }else
    if(!(textBlock.length-counter >= queryWord.length))    {        console.log("’"
    +textBlock.substring(counter, textBlock.length) + "’" + " is too small to match
    " + "’" + queryWord + "’");        break;    }else    {console.log("Code inside
    ''if-else'' statement now processing letter: " + textBlock[counter]);  }}console.log(''Done!
    Total matches: '' + matchCount);

    ```

