  trans: "\n\n- 你可以通过比较字母来查看它们是否相等，例如，`'E'=='B'` 返回 `false`，而 `'A'=='A'` 返回 `true`。\n\
    \n这里的诀在于是将该过程进一步拆分为更简单的步骤。例如，这里有一段文本块：\n\n```javascript\nvar numberSet = \"One\
    \ two three four five\";var queryString = \"two\";\n```\n\n对于人类来说，寻找字符串非常容易，但对于计算机来说，这要复杂一些。在这个例子中，我们要定位\
    \ `'two'`，人类一眼就能看到，但计算机不能，因此我们必须从字符串的开始一直查找到结束。括号括的字母是我们当前正在比较的那个：\n\n`\"[O]ne\
    \ two three four five\"` vs. `\"[t]wo\"`\n\n在代码中，它应该是：\n\n```javascript\nnumberSet[0]\
    \ == queryString[0];\n```\n\n正如你所注意到的，我们并没有立即比较这两个单词；而是获取它们的第一个字母并检查它们是否相等。在第一的情况下，\"\
    O\" 不等于 \"t\"，所以我们移动到下一个字母：\n\n`\"O[n]e two three four five\"` vs. `\"[t]wo\"\
    `\n\n这在代码中将翻译为：\n\n```javascript\nnumberSet[1] == queryString[0];\n```\n\n再次，这返回\
    \ `false`，所以我们继续移动，直到找到匹配项：\n\n`\"One [t]wo three four five\"` vs. `\"[t]wo\"\
    `\n\n这翻译为：\n\n```javascript\nnumberSet[4] == queryString[0];\n```\n\n现在，我们还不能假设我们已经在\
    \ `numberSet` 中找到了 \"two\"；我们只得到了第一个字母的匹配。我们可能只是碰到了另一个也以 ’t’ 开头的数字，例如三 (three)、thirty\
    \ 等。尽管如此，我们还必须将 \"two\" 的第二个字母与 `numberSet` 中的下一个字母进行比较：\n\n`\"One t[w]o three\
    \ four five\"` vs. `\"t[w]o\"`\n\n这翻译为：\n\n```javascript\nnumberSet[5] == queryString[1];\n\
    ```\n\n该语句仍然成立，如果你尝试检查下一个字母，它也会返回 `true`。由于该语句在 \"two\" 的最后一个字母之前一直成立，那么我们现在可以说在\
    \ `numberSet` 中找到了 1 处 \"two\"。\n\n然而，搜索仍然必须持续到 `numberSet` 的最后三个字母：\n\n`\"One\
    \ two three four f[i]ve\"` vs. `\"[t]wo\"`\n\n这翻译为：\n\n```javascript\nnumberSet[20]\
    \ == queryString[0];\n```\n\n由于此语句将返回 `false`，因此没有必要继续查看 'v' 或 'e'，因为剩余的字母太少，无法为\
    \ \"two\" 提供匹配。\n\n## 仍然困惑吗？\n\n如果你发现自己对将问题从英语转换为 JavaScript 的感到困惑且无所适从，最好的办法是列出一个你希望程序如何处理该问题的列表。例如，这是我们字符串搜索程序的步骤列表：\n\
    \n3) 遍历文本块中的字母 \n\na) 当前字母是否与我们查询字符串的第一个字母匹配？\n\n   i) 如果是，遍历文本块中的字母。\n   ii.\
    \ 如果否，继续到下一个。\n\nb) 是否存在匹配项？\n\n   i) 如果是，记录它\n   ii) 如果否，继续\n\n当然，你将来可能会发现许多优化方法，让这个过程变得更简单，但现在你已经学会了。\n\
    \n## 结论\n\n恭喜！你刚刚学会了如何使用 `while` 循环、`if-statements` 和 `for-loops`。你学会了如何将人类的问题转换为\
    \ JavaScript。\n\n## 第 6 章：掌握流程控制\n\n到为止，你已经学习了 `while` 循环、`if-statements` 和 `for-loops`。在本章中，我们将学习如何有效地使用\
    \ `while` 循环。\n\n- 如何使用 `while` 循环。\n\n## While 循环\n\n到为止，你已经学习了 `while` 循环、`if-statements`\
    \ 和 `for-loops`。在本章中，我们将学习如何有效地使用 `while` 循环。\n\n`while` 循环用于：\n1. 初始值\n2. 条件\n\
    3. 迭代\n\n但是，如果你需要使用 `while` 循环来重复某些操作直到满足某个条件怎么办？\n\n```javascript\nwhile(<condition>){\n\
    \  <action>\n}\n```\n\n基本上，`while` 循环只是一个没有计数器的 `for-loop`。你可以放置任何返回 `true` 或\
    \ `false` 的条件。\n\n```javascript\nvar keepLooping = true;\nwhile (keepLooping){\n\
    \  console.log(\"Just looping!\");\n  keepLooping = false;\n}\n```\n\n`counter`\
    \ 只存在于循环内部。对于 `while` 循环，只要程序保持运行，计数器就会保持其值。\n\n现在让我们用 `while` 循环优化我们在第 3 章中的代码：\n\
    \n```javascript\nvar name = prompt('What’s your name?');\nwhile (name.length ==\
    \ 0){\n  name = prompt('You cannot leave this empty. What’s your name?');\n}\n\
    alert('Your name is ' + name + '. Got it!');\nvar email = prompt('What’s your\
    \ email?');\nwhile (email.length == 0){\n  email = prompt('You cannot leave this\
    \ empty. What’s your email address?');\n}\nalert('Your email is ' + email + '.\
    \ Got it!');\nvar age = prompt('What’s your age?');\nwhile (age.length == 0){\n\
    \  age = prompt('You cannot leave this empty. What’s your age?');\n}\nalert('Your\
    \ age is ' + age + '. Got it!');\n```\n\n"
