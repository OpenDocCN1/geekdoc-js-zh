    ## 数据验证\n\n在编程中，验证你正在处理的数据始终是非常重要的，尤其是当计算机接收到它没有预料的信息时，它很容易出故障。尽管如此，正如在某些情况下验证你正在处理的对象同样重要，验证你正在使用的方法的存在性也同样重要。\n\
    \n在较小的代码中，这可能不重要，因为在代码中跟踪方法和对象相对容易，但在被要求构建和维护复杂的程序时，某些方法可能会在程序的后续版本中被更新或删除。因此，检查你怀疑未来可能会变化的方法和属性的可用性好主意。这里有一个示例代码可以帮助你判断对象是否存在某个方法或属性：\n\
    \n```javascript\n//示例函数\nfunction Sample(aNumber, aString){\n    this.aNumber\
    \ = aNumber;\n    this.aString = aString;\n    this.aFunction = function() {\n\
    \        console.log(\"This is a function\");\n    };\n}\n// 方法和属性检查\nvar newObject\
    \ = new Sample(0, \"Hello\");\nconsole.log(\"Testing if aFunction exists: \" +\
    \ (typeof newObject.aFunction == 'function'));\nconsole.log(\"Testing if anotherFunction\
    \ exists: \" + (typeof newObject.anotherFunction == 'function'));\nconsole.log(\"\
    Testing if aNumber exists: \" + newObject.hasOwnProperty(\"aNumber\"));\nconsole.log(\"\
    Testing if anotherNumber exists: \" + newObject.hasOwnProperty(\"anotherNumber\"\
    ));\n```\n\n在这段代码中，我们使用了 `typeof` 关键字来检查方法内部是否存在某个特定的函数。如果该方法不存在，语句将返回 `false`，否则返回\
    \ `true`。然后我们引入了一个名为 `hasOwnProperty()` 的新方法来检查对象中是否存在某个属性。作为练习，请对 `aString` 变量进行相同类型的测试。\n\
    \n## 在循环中遍历属性\n\n惊讶的是，JavaScript 中有一种 `for`-循环的变体，你可以用它来遍历方法的所有属性。这种修改过的 `for`\
    \ 循环被称为 `for-in` 循环，它看起来如下：\n\n```javascript\nvar sampleObject = {\n    name:\
    \ \"John Smith\",\n    age: 22,\n    job: \"Software Engineer\",\n};\nfor(var\
    \ property in sampleObject){\n    console.log(property);\n}\n```\n\n这种类型的 `for`\
    \ 循环通常只在面向对象的编程语言中可用，因为它隐藏了代码中的方法和对象。这种类型的 `for` 循环通常只在面向对象的编程语言中可用，因为它隐藏了代码中的方法和对象。面向对象的编程概念包括：\n\
    \n-   **继承 (Inheritance)**：从父类获取多个属性。\n-   **多态 (Polymorphism)**：在不同的情况下使用相同的方法，例如：\n\
    \    ```javascript\n    function Sample(aNumber, aString){\n        this.aNumber\
    \ = aNumber;\n        this.aString = aString;\n        this.aFunction = function()\
    \ {\n            console.log(\"This is a function\");\n        };\n    }\n   \
    \ var functionA = new Sample(5, 10);\n    var functionB = new Sample(5, 10);\n\
    \    // 在这里，我们使用原型修改函数 B\n    functionB.sampleFunction = function(){\n       \
    \ console.log(this.firstNumber + this.secondNumber);\n    };\n    ```\n-   **原型链\
    \ (Prototype Changes)**：修改原型以便所有类都可以使用，例如：\n    ```javascript\n    function Sample(aNumber,\
    \ aString){\n        this.aNumber = aNumber;\n    }\n    var objectFromSample\
    \ = new Sample(15);\n    // 在这里，我们原型添加了属性\n    Sample.prototype.aString = \"Hi\
    \ there!\";\n    console.log(objectFromSample.aString);\n    var anotherObjectFromSample\
    \ = new Sample(25);\n    console.log(anotherObjectFromSample.aString);\n    ```\n\
    \n通过创建多个实例，你可以创建各种应用程序，从依赖多个敌人、武器的游戏到依赖多个数据的 Web 应用程序。通过实践，你会学会如何有效地使用它们。希望本章已经介绍了足够的面向对象概念来让你开始。\n\
    \n## 总结\n\n恭喜你！你现在准备好独立探索 JavaScript 了，你可以查看别人的代码并观察它们是如何工作的，或者搜索更多的 JavaScript\
    \ 方法和其他信息。虽然 JavaScript 被认为是 Web 的交互语言，但越来越多的开发者发现它可以用于其他平台，如 Android 和 iOS。有很多在线资源可以帮助你进行移动开发和\
    \ Web 开发，但希望这本书已经让你在编程概念上领先一步。\n\n记住，你的学习在翻到最后一页时并没有停止；事实上，正当你翻完最后一页后，你才能测试自己的书籍知识并获得经验知识。\n\
    \n祝你好运！\n\nRobert Dwight\n\n# Ruby 语言基础\n\n本章将教你 Ruby 的基础元素。请仔细阅读这些材料——它们包含的内容是其他章节的基础。\n\
    \n## 面向对象编程\n\nRuby 被认为是一种面向对象的计算机语言，就像 C#、PHP5 和 Python 一样。你所做的更改应用于对象。此外，这些更改会产生新对象。\n\
    \n"
- fmt: "\nUsually, you need to create an instance for each class. It's important to\
    \ point out that “object” and “class instance” are considered as synonyms. In\
    \ Ruby, you should use a constructor (i.e. a method linked to a class) to create\
    \ an object. This language uses `new` as its default constructor. Analyze the\
    \ example given below:\n\n```\nmusic1 = Music.new(“Hotel California”)\nmusic2\
    \ = Music.new(“Sweet Child of Mine”)\n```\n\nBoth of these instances came from\
    \ a class named `Music`. However, each instance has distinct properties. For example,\
    \ each object has an identifier (also called “object ID”). Additionally, each\
    \ object can hold one or more instance variables (i.e. variables that contain\
    \ data unique to the instance that holds them). An instance variable holds the\
    \ “state” of an object. In the example above, each song has a unique variable\
    \ that stores the title of the song. \n\nYou may specify instance methods inside\
    \ each class. Methods are sets of functionalities that you may invoke in the class'\
    \ ` context. In turn, these methods can access the state and instance variables\
    \ of an object. For example, the `Music` class may have a method named `play`.\
    \ If a variable points to an object, you may invoke the `play` method of that\
    \ object and listen to a song.\n\nYou can invoke methods by sending messages to\
    \ objects. These messages contain the name of the method, as well as the parameters\
    \ it needs. After receiving a message, an object will check its class and search\
    \ for the right method. If successful, the method will run.\n\nThese messages\
    \ and methods might sound complex. However, they are extremely simple in practice.\
    \ It's time to analyze some method invocations. For this example, you'll use `puts`\
    \ (i.e. a method that prints its argument) and add a newline character before\
    \ the next expression:\n\n```\nputs “Sample”.index(“a”)\nputs “test box.”.length\n\
    puts sam.play(music)\n```\n\nThat code produces:\n\n```\n2\n3\nboom, boom, boom\
    \ ...\n```\n\nThese lines show methods being invoked as arguments for `puts`.\
    \ Each argument has two parts, the “receiver” (i.e. the word at the left-hand\
    \ side of the dot) and the method (i.e. the word after the dot).\n\n## Basic Stuff\n\
    \nSyntax rules can be extremely boring, particularly for inexperienced programmers.\
    \ Because of that, you'll learn about syntax rules later. This part of the book\
    \ will focus on the things you'll use to create Ruby applications.\n\nFor now,\
    \ let's create a basic Ruby application. The method that you'll use here prints\
    \ a greeting on the terminal. In this example, let's call that method several\
    \ times:\n\n```rubydef say_hi(user_name)\n  result = “Hi, ” + user_name\n  return\
    \ result\nend\n\n# Personalized greeting\nputs say_hi(“Mark”)\nputs say_hi(“Mary”)\n\
    ```\n\nAs you can see, the syntax of Ruby is clean and simple. You won't have\
    \ to terminate statements using semicolons if you'll write these statements on\
    \ different lines. To add a comment, you'll just use the `#` symbol. Additionally,\
    \ this language isn't strict when it comes to code layout. Your programs won't\
    \ produce errors even if you won't place any indentation in your code. However,\
    \ indentations are recommended since they ensure code readability.\n\nYou need\
    \ to use the `def` keyword to define a method. After this keyword, you need to\
    \ specify the method's identifier as well as its parameters. You may enclose the\
    \ parameters using parentheses to make your code readable. This language doesn't\
    \ require curly braces when delimiting compound definitions and statements. Rather,\
    \ you just have to use the `end` keyword to terminate your definitions or statements.\n\
    \nIn this example, you defined a method and called it twice. In each of these\
    \ cases, you forwarded the output to the `puts` method. Keep in mind that `puts`\
    \ simply prints its argument on the terminal and adds a newline character (i.e.\
    \ the character you'll get after hitting the Enter key). Here's the output that\
    \ you'll get after running the code given above:\n\n```\nHi, Mark\nHi, Mary\n\
    ```\n\nThe expression `puts say_hi(“Mark”)` has two method invocations. The first\
    \ one calls the `say_hi` method while the second one calls the `puts` method.\n\
    \nIn addition, the current example involves some string objects. The Ruby programming\
    \ language offers different ways to generate string objects. The most popular\
    \ approach, however, involves the utilization of string literals. Basically, a\
    \ string literal is a sequence of characters placed between quotation marks (i.e.\
    \ single quotes or double quotes).\n\nThere's a difference between using single\
    \ quotes and double quotes in your codes. In general, Ruby doesn't alter the characters\
    \ you'll place between single quotation marks. Thus, the value of the string is\
    \ identical to the characters you typed. Double quotes, on the other hand, require\
    \ Ruby to do some work. With double quotation marks, Ruby needs to search for\
    \ substitutions (i.e. character sequences that begin with `\\`) and replace them\
    \ with the right binary values. The most common substitution is `\\n`, which adds\
    \ a new line to the code. Newline characters become line breaks if the string\
    \ that contains them is an output. Here's an example:\n\n```\nputs “This sample\
    \ \\nis awesome.”\n```\n\noutput:\n```\nThis sample\nis awesome.\n```\n\nAs mentioned\
    \ earlier, Ruby replaces strings with binary values. Programmers refer to this\
    \ functionality as “expression interpolation.” Basically, Ruby replaces `#{expression}`\
    \ with the expression's value. You can use this functionality to rewrite the `say_hi`\
    \ method:\n\n```ruby\ndef say_hi(user_name)\n  result = “Hi, #{user_name)”\n \
    \ return result\nend\n\nputs say_hi('Mark')\n```\n\noutput:\n```\nHi, Mark\n```\n\
    \nRuby will search for the value of `user_name` during the creation of the object.\
    \ Then, it will pass the value to the new object. This language allows you to\
    \ place complex expressions in your `#{expression}` construct. For the example\
    \ given below, you will call a method called `capitalize` to print the parameter\
    \ and make sure that the initial letter is in uppercase:\n\n```ruby\ndef say_hi(user_name)\n\
    \  result = “Hi, #{user_name.capitalize}”\n  return result\nend\n\nputs say_hi('Mark')\n\
    ```\n\noutput:\n```\nHi, Mark\n```\n\n**Important Note:** You'll learn about strings\
    \ and other data types later.\n\nLastly, you may further simplify the `say_hi`\
    \ method. Keep in mind that Ruby methods don't return the value of all expressions\
    \ they evaluate. Only the value of the most recent expression will be returned.\
    \ That means you can eliminate the return clause and temporary variable. Here's\
    \ the code:\n\n```ruby\ndef say_hi(user_name)\n  “Hi, #{user_name.capitalize}\n\
    end\n\nputs say_hi('Mark')\n```\n\noutput:\n```\nHi, Mark\n```\n\n## The Naming\
    \ Convention of Ruby\n\nThe Ruby language uses a unique convention for naming\
    \ objects. Basically, it uses the first character of an identifier to determine\
    \ the purpose of that identifier. You should use an underscore or a lowercase\
    \ letter to start the name of a method, a parameter, or a local variable. You\
    \ should type `$` before the name of a global variable. The identifier of an instance\
    \ variable, on the other hand, should start with `@`.\n\nYou should add `@@` before\
    \ the name of a class variable. Lastly, you should use an uppercase letter when\
    \ naming a constant, a module, or a class. The table given below will help you\
    \ understand Ruby's naming:\n\n| Local | Class | Global | Instance | Class and\
    \ Constant |\n| :--- | :--- | :--- | :--- | :--- |\n| sample | @@automobile |\
    \ $design | @laptop | Bowling |\n| _99 | @@aircraft | $plan | @computer | Fruit\
    \ |\n| e_theory | @@food | $trick | @door | Gadget |\n| bar_b_q | @@hobby | $tips\
    \ | @stone | Tree |\n\nAfter the first character, you may combine numbers, letters,\
    \ and underscores to create a unique name. However, you can't place a number right\
    \ after the `@` symbol. You need to divide multiword variables by placing an underscore\
    \ between each word pair. Additionally, you need to capitalize the first letter\
    \ of each word. The name of a method may end with `=`, `!`, or `?`.\n\n## Hashes\
    \ and Arrays\n"
