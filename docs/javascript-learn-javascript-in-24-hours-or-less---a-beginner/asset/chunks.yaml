    \ (email.length == 0){    email = prompt('You cannot leave this empty. What’s\
    \ your email address?');}else{    alert('Your email is ' + email + '. Got it!');}age\
    \ = prompt('What’s your age?');if (age.length == 0){    age = prompt('You cannot\
    \ leave this empty. What’s your age?');}else{    alert('Your age is ' + age +\
    \ '. Got it!');}password = prompt('Please enter your desired password: ');if (password.length\
    \ == 0){    password = prompt('You cannot leave this empty. Please enter your\
    \ desired password:');}else{    alert('Your password is ' + password + '. Got\
    \ it!');} |\n\nNow your code sounds a little more human, as it responds better\
    \ to user input. Try messing around with the code and see how the interpreter\
    \ changes the output depending on the conditions met with the if-else statements. \n\
    \n## \n\nDebugging\n\nSo far, you’ve managed to play around with variables, data\
    \ types, mathematical operators, comparison operators, user prompts, confirmation\
    \ dialogues, and alerts, and lastly, if-else statements. Don’t worry if you make\
    \ a couple of mistakes; computers are intrinsically literal and will not tolerate\
    \ the tiniest syntactical mistakes. That being said, here are a couple of codes\
    \ that don’t seem to work as intended. Change the following code snippets so that\
    \ you can produce the appropriate output!\n\n| var name = \"Chris\";alert('Hi\
    \ ' + 'name' + '! It’s nice to meet you.'); |\n\nIn this code snippet, the output\
    \ is supposed to be \"Hi Chris! It’s nice to meet you.\" What’s the current output\
    \ and what do you think is wrong with the code? Notice that the console doesn’t\
    \ complain and throw you an error message when you execute this code. This kind\
    \ of problem is called a 'bug,' because while the JavaScript interpreter sees\
    \ nothing wrong with this code, it doesn’t work as the creator intended. \n\n\
    Now try to correct this code snippet that contains both bugs and errors:\n\n|\
    \ var name;var age;name = prompt('What’s your name?');if (name.length = 0);{ \
    \   name = prompt('You cannot leave this empty. What’s your name?');}else (name.length\
    \ != 0){    alert('Your name is ' + name + '. Got it!');}age = prompt('What’s\
    \ your age?');if (age.length = 0){    age = prompt('You cannot leave this empty.\
    \ What’s your age?');}else (name.length != 0){    alert('Your age is ' + age +\
    \ '. Got it!');} |\n\nThis code is a distorted version of a previous sample code,\
    \ so you may try to compare the codes and see why this one doesn’t work. If you\
    \ feel stuck, you can check out a program called 'linter,' which is a handy tool\
    \ that checks your code for errors and tells you which lines have them. It’s good\
    \ exercise to practice your debugging skills now, because when you create more\
    \ complex programs, debugging becomes almost routine. \n\n## \n\nWhat to look\
    \ for when debugging:\n\nLooking for bugs and errors can be quite overwhelming\
    \ if you don’t know where to look. Here are some of the most common mistakes programmers\
    \ make when coding:\n\n1.  Using '=' instead of '==' to compare two values - the\
    \ '=' sign in programming is used as an assignment operator, which means that\
    \ if you use this instead of the '==' sign, you end up replacing the value of\
    \ the variable on the left hand side of the equation with the value on the right\
    \ hand side of the equation. \n\n2.  Misplacing the semicolon - just as periods\
    \ end sentences in the English language, semicolons end statements in JavaScript,\
    \ as well as other programming languages like C, Java, etc. If, for instance,\
    \ you’ve accidentally put a semicolon in the middle of a statement, JavaScript\
    \ would see the statement as incomplete and produce an error for it. "
