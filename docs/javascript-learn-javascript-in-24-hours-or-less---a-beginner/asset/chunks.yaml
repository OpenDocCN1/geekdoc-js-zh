  trans: "\n\n### 3. 误用引号\n引号告诉解释器你正在使用一个字符串，因此如果你将变量或数字括在引号中，你实际上是将它们转换成了字符串。当你尝试对这些被不小心括在引号中的数字进行数值运算时，这会导致异常情况。\
    \ \n\n### 4. 函数拼写错误\n正如我之前提到的，计算机是非常精确的，有时精确到近乎死板；它无法理解你任何拼错的内容。幸运的是，如果你拼写错了函数或语句，解释器会向你抛出一个错误，告诉你正在使用的表达式是未定义的（undefined）。\n\
    \n到目前为止，这些只是新手容易犯的最常见错误，但随着你练习编写复杂代码的增加，你应该能够很容易地发现 bug 和错误。 \n\n## 总结\n\n到为止，我们已经涵盖了很多概念，让我们回顾一下学到的内容：\n\
    \n### 1. 变量和数据类型 \n- **数字 (numbers)** - 可以是整数或包含小数的数字（例如，`3.14`、`5`、`100`）\n-\
    \ **字符串 (strings)** - 任何你括在引号中的内容（例如，`\"5\"`、`\"I am a JavaScript master\"`、`\"\
    I love the number 7\"`）\n- **布尔值 (booleans)** - 真或假 \n\n为了声明一个变量，只需输入：\n\n```\n\
    | var <variable name> = <value>; |\n```\n\n如果你还没有值，也可以只声明变量名而不赋值：\n\n```\n| var\
    \ <variable name>; |\n```\n\nJavaScript 并不在乎你放入什么类型的数据。如果你用过 C 或 Java，你可能习惯了声明变量的数据类型（`int`、`float`、`char`\
    \ 等），但在 JavaScript 中，你可以毫无问题地向变量放入任何内容。 \n\n### 2. 弹出框\n- `alert(\"Hi There!\"\
    )` - 你可以向用户弹出警报。\n- `confirm(\"Are you sure?\")` - 你可以向用户请求确认。\n- `prompt(\"Type\
    \ anything here.\")` - 你可以向用户请求输入\n\n### 3. Flow 控制 \n- **if-else 语句** - 简单来说，如果满足第一个条件，则执行第一个括号范围内的所有操作并跳过\
    \ 'else' 部分。否则，进入 'else' 条件的括号范围并执行其中的所有操作。 \n\n恭喜！你通过 JavaScript 学习了大量的编程基础知识！如果你已经走了这一步，那么你应该能够轻松从容地完成接下来的几个章节。在下一章中，我们将深入探讨数学运算和子字符串的细节。休息一下，如果你准备好进一步深造，请继续进入第\
    \ 4 章。\n\n# 第 4 章：函数与数据操作\n\n作为另一个内容密集的章节，这里是你可以预期学习的内容的快速概览：\n\n1. **数学优先级 (Mathematical\
    \ Precedence)** - 学习数学优先级可以帮助你确保数学运算（无论多复杂）都按照正确的顺序执行（例如，`5*(5+2)` 的输出结果与 `5*5+2`\
    \ 不同）。\n2. **取模运算符 (Modulo Operator)** - 该运算符给你一个数字除以另一个数字的余数。这种操作非常频繁，足以让它拥有自己的运算符符号（`%`）。\n\
    3. **字符串操作 (String Manipulation)** - 有时你不需要在代码中使用整个字符串，例如当你想要显示跨越数百行的文本预览时（如果完全显示的话）。\n\
    4. ****函数 (Functions)** - 函数允许你通过简单调用函数名来重复大量可能跨越数百或数千行的指令！\n5. **优化 (Optimization)**\
    \ - 每个人都倾向于更短的代码；它占用的空间更小，也更容易调试。然而，技巧在于通过详尽阐述保持代码的可读性，与通过几个语法“捷径”保持代码的短小简洁之间找到平衡。\n\
    6. **全局和局部变量 (Global and Local Variables)** - 某些变量只存在于函数内部，而在外部不存在——这些是局部变量。贯穿整个代码的变量被称为全局变量。\n\
    \n## 数学优先级\n\n到为止，你处理了基本的数学运算符并只执行了单一操作。但在编程中，很少有人编写每行只有一个数学运算的程序。例如，如果你的网站想计算以分钟为单位的用户的年龄，你需要执行这样的操作：\n\
    \n```\n| var age = prompt('How old are you?');alert('You are ' + age*365*24*60\
    \ + ' minutes old'); |\n```\n\n考虑到这一点，你必须确保操作按照正确的顺序执行。为了做到，你必须记住以下优先级规则：\n\n\
    1. `( )` - 任何括在括号中的内容都会先执行\n2. `*` 和 `/` - 乘法和除法在加法和减法之前执行\n3. `+` 和 `-` - 加法和减法最后执行\n\
    \n这里有几个练习可以帮助你直观理解数学优先级：\n\n```\n| 5 * 10 + 3 - 5 / 20 |\n```\n\n这将产生 52.75，因为乘法和除法符号的优先级高于减法符号。当你过程中添加括号时，情况发生了变化：\n\
    \n```\n| 5 * 10 + (3 - 5) / 20 |\n```\n\n注意结果现在变成了 49.9，因为括号内的操作先执行。这是另一个例子：\n\
    \n```\n| 5 * 10 + 3 - 5 |\n```\n\n现在答案变成了 2.4，因为括号内的内容在除以 20 之前已经完成了。括号内部遵循通常优先级规则，如果你想让低优先级的操作先发生，你需要将其括在括号中。\n\
    \n## 新成员：取模\n\n在基础数学课上，有四个数学运算符。但在编程中，有一个第五个运算符叫做 `%`。当它放在数字之间时，它给你余数。编程需要简洁和精确，没有冗余符号和特征的空间，这意味着取模运算符存在很有理由。取模运算符的一个有趣应用是测试数字的奇偶：\n\
    \n```\n| var num = prompt('Give me a number: ');if (num % 2 != 0){  alert('The\
    \ number is odd.');}\n```\n``` |\n```\n\n### 陷阱警告：\n\n新手程序员在尝试测试数字奇偶时的一个常见错误是检查两个数字的余数是否等于\
    \ 1。乍一看这似乎合理，因为对于每个除以二的正数，余数只能是 1 或 0（例如，`13 % 2 = 1`，`12 % 2 = 0`）。然而，当你输入负数时，问题出现了；由于余数不再等于\
    \ 1，程序开始异常运行。这类错误很容易犯，所以当你测试解决方案时，请确保使用各种输入彻底测试代码（在这个例子中，如果用户测试负数，他很容易发现这个陷阱）。\n\
    \n现在，尝试修改以下代码以显示“Greetings from planet JavaScript!”：\n\n```\n| if (14 % 2 != 0){\
    \  console.log(\"Greetings\");}if (15 % 2 != 0){  console.log(\"to\");}if (10\
    \ % 2 != 0){  console.log(\"from\");}if (9 % 2 != 0){  console.log(\"atmosphere\"\
    );}if (5 % 3 != 0){  console.log(\"planet\");}if (20 % 2 != 0){  console.log(\"\
    JavaScript\");} |\n```\n\n## 玩转字符串\n\n到为止，我们已经处理了数字，从执行常规数学运算到比较值，再到查看取模运算符的功能。现在，我们将玩转字符串并看看你可以对它们做些什么。\n\
    \n"
- fmt: "\nThe first thing we’re going to do is to explore substrings, which are basically\
    \ just parts of a whole string. Substrings were created because sometimes, people\
    \ just need a small preview of a whole text. For instance, when you search for\
    \ anything online, the results page gives you only the first few words from the\
    \ content of the sites listed, allowing you to skim through multiple sites quickly\
    \ and efficiently. The keyword here is 'preview' - you don’t want to overwhelm\
    \ users with information, so if you have large sets of information, you’re most\
    \ likely going to need substrings. \n\nHere’s how the code works:\n\n```\n\"I\
    \ am a sentence\".substring(2, 7)\n```\n\nThe output should be \"am a \". As an\
    \ exercise, try changing the numbers inside the parenthesis and see which letters\
    \ you get.\n\nThe function, `substring()` requires two numbers - one to tell the\
    \ interpreter where to start cutting the string and one to tell the interpreter\
    \ where to stop. In programming, however, we always start with the number `0`,\
    \ which is why if you want to cut-off only the last few parts of a string, you’d\
    \ need to do something like:\n\n```\n\"I am a sentence\".substring(0, 7)\n```\n\
    \nThe output should now be \"I am a \". \n\nIf, on the other hand, you’d like\
    \ to cut-off only the first few parts of a string, you can try something like:\n\
    \n```\nvar sentence = \"I am a sentence\";sentence.substring(4, sentence.length)\n\
    ```\n\nThe reason why we use `sentence.length` instead of manually inputting `15`\
    \ (the length of the `sentence` variable) is because in programming, we want to\
    \ make sure that tiny changes in code won’t break a program. Imagine if we’ve\
    \ used a fixed length to get the last few characters of a variable that gets updated\
    \ every now and then, for instance:\n\n```\nsentence = \"I am now a longer sentence\
    \ and I can stretch as far as I can\";sentence.substring(4, 15)\n```\n\nThis’d\
    \ give you a different output, and depending on how your webpage works, this might\
    \ wreak havoc on your data. That being said, always be careful with the parameters\
    \ of the `substring` function!\n\nNow that you have more tools at your disposal\
    \ when dealing with strings and numbers, we can now proceed to what we can consider\
    \ the pinnacle of modularity in the world of programming: functions. \n\n## Functions\n\
    \nFunctions let you build a program almost like a robot - with every part serving\
    \ a specific purpose, like hands for grasping objects and feet for walking or\
    \ running. Apart from this, the concept of functions is also founded on a philosophy\
    \ that every programmer will eventually learn and live by: ruthless simplicity\
    \ and minimalism in coding.\n\nIn programming, people always want to find ways\
    \ to make the computer do more while typing fewer lines of code. Functions allow\
    \ programmers to repeat a set of instructions without having to retype the same\
    \ set of lines. Its analogue to real life would be like teaching someone how to\
    \ bake a cake - at first, you give them precise instructions, like how to preheat\
    \ the oven, how to mix the ingredients, etc. In the future, however, you should\
    \ no longer need to give a new set of instructions; while different cakes may\
    \ need different ingredients, the general instructions are almost always the same.\
    \ No baker wants to be told again and again how to bake a cake; once they’re taught\
    \ how to bake a cake, you’d only have to give them a list of ingredients and the\
    \ cake you want, and the cook would know what to do. Functions are like that;\
    \ you only have to create them once, and you can call them again in your code\
    \ in case you need to do the same set of instructions, but with different input\
    \ and output. \n\nHere’s what a function looks like:\n\n```\nvar computeSum =\
    \ function (firstNumber, secondNumber){    var result = firstNumber + secondNumber;\
    \    console.log(result);};\n```\n\nIn the first line, you declare the name of\
    \ the function (in this example, it’s `computeSum`), and the data you want to\
    \ pass inside it (in this example, we have `firstNumber` and `secondNumber`).\
    \ \n\nInside the function, enclosed by brackets (`{ }`), you see two lines that\
    \ first add the two variables indicated in the first line, and then log the result\
    \ to the console. \n\nGoing back to our example of baking, the code inside the\
    \ brackets would be the precise set of instructions that you only give once, and\
    \ the function name is what you invoke whenever you need to tell the baker to\
    \ bake a new cake, together with the ingredients.. It’d look roughly like this\
    \ when you put it into code:\n\n```\nvar bakeCake = function (ingredient1, ingredient2,\
    \ ingredient3){   var ovenTemperature = 300;  var mixedIngredients = ingredient1\
    \ + ingredient2 + ingredient3;   var finishedCake = mixedIngredients * ovenTemperature;\
    \   alert('Finished making a delicious cake with ' + ingredient1 + ', ' + ingredient2\
    \ + ', ' + ingredient3 + '!');   console.log(finishedCake);};\n```\n\nWhenever\
    \ you need to bake a cake, then, you’d only need to type this:\n\n```\nbakeCake('eggs',\
    \ 'chocolate', 'flour')\n```\n\nThis becomes really handy should you find yourself\
    \ having to type the same chunk of code. Not only does your code look much neater,\
    \ but it also makes debugging much easier; when a part of your site doesn’t work,\
    \ you only need to find the function responsible for the bug instead of checking\
    \ your whole code line-by-line. \n\nIn a nutshell, a function takes in a bunch\
    \ of information, does something with the information, and then gives you something\
    \ out of that. Here’s a step-by-step guide on how to create a function:\n\n1.\
    \ Declare a function using `var`, and give it a name just as you would to any\
    \ data type. Programmers have agreed to a naming convention where the name should\
    \ always start with a lowercase letter and then uppercase for each word that follows.\
    \ This is called the lower camel case (e.g., `exampleCamelCase`).\n2. After giving\
    \ the name of the function, you use the word `function` to tell the interpreter\
    \ that you’re making a function, not a string, number, or boolean.\n3. Inside\
    \ the parenthesis that comes after `function` are your function parameters. As\
    \ you may have noticed from our `bakeCake` function, `ingredient1`, `ingredient2`,\
    \ and `ingredient3` were replaced by `eggs`, `chocolate`, and `flour`. You can\
    \ think of the former as variable names, and the latter as the values inside the\
    \ variables, such that by invoking `bakeCake('eggs', 'chocolate', 'flour')`, you’re\
    \ assigning `eggs` to `ingredient1`; `chocolate` to `ingredient2`; and `flour`\
    \ to `ingredient3`. \n4. Inside the brackets would be your function body. This\
    \ is the place where you do stuff to the parameters you’ve asked for (`ingredient1`,\
    \ `ingredient2`, and `ingredient3`). Note that every line of code inside the brackets\
    \ should end with a semicolon. At the end of the function, just after the closing\
    \ bracket, you’ll also need a semicolon to tell the computer that you’re done\
    \ creating the function.\n\n## Return Values\n\nSo far, the functions are almost\
    \ standalone, in a sense that all they do is execute a bunch of statements. What’s\
    \ interesting about them, however, is that we can also use functions the same\
    \ way we use numbers, strings, and booleans when we add a return value. A return\
    \ value is any type of data given back by a function. Whenever a `return` statement\
    \ is invoked, the computer typically assumes that the function is done what it\
    \ needs to do and therefore throws whatever is in the `return` statement back\
    \ to the code that called the function. For instance, going back to our `computeSum()`\
    \ function:\n\n```\nvar computeSum = function (firstNumber, secondNumber){   \
    \ var result = firstNumber + secondNumber;    console.log(result);};\n```\n\n\
    Try accessing the `result` variable outside the function call by moving the `console.log(result)`\
    \ command just outside the `computeSum()` function. You should encounter an error\
    \ saying that the variable `result` is not defined. In programming, when you declare\
    \ variables inside a function, they only exist inside that function. If you want\
    \ to get the result, you’ll have to set it as the return value.\n"
