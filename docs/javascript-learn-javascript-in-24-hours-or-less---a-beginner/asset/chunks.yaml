  trans: '

    现在，你可能在疑惑，为什么在你只想让网站活跃起来时，我们却在用 JavaScript 处理字符串、数学运算和注释。但在你制作出惊人的动画、智能用户交互和其他动态功能之前，我们必须先打基础。现在，让我们通过创建你的第一个弹窗对话框来点趣吧：


    ```javascript

    confirm(''Hi! You’ve just made your first pop-up dialogue. Congratulations! Click
    OK to go further!'');

    ```


    在你点击 `OK` 后，你应该会在控制台中看到打印 `''true''`。这是因为 JavaScript 也可以记录用户输入，就像 `HTML` 一样。然而，JavaScript
    的有趣之处在于，它不需要刷新页面就可以请求用户输入；它简单地弹出一个小的独立窗口向你提问，然后回到你正在操作的网页。这在用户填写完表单或决定删除某些内容后请求其确认时特别有用——因为不需要刷新网页，用户在点击
    `OK` 或 `取消` 后可以回到之前的工作界面。


    好了，到为止，你已经学会了编写第一个字符串、让 JavaScript 计算长度、执行数学运算、编写注释以及创建弹窗对话框。为了让网站实现真正酷炫的功能，它需要能够获取不仅仅是
    `''true''` 或 `''false''` 的用户输入。考虑到这一点，让我们尝试让 JavaScript 询问你的名字：


    ```javascript

    prompt(''Hello! What’s your name?'');

    ```


    在输入名字后，你应该会在控制台中看到你输入的内容。做得好！


    # 存储信息


    每种编程语言都需要能够存储信息；否则它就无法进行计算和其他重要的操作，这也是计算机设计的初衷。到为止，我们只能够询问用户的名字，而没有对其进行任何操作。这是因为你的名字没有被存储，只是打印在了控制台中。让我们利用变量的力量，让它在询问名字后问候你：


    ```javascript

    var name = prompt(''What’s your name?'');alert(''Hi, '' + name + ''! It’s nice
    to meet you.'');

    ```


    现在通过响应用户，你的程序变得更加人性化。如果语法让你感到压力，在我们深入学习 JavaScript 时，你会学更多关于 `alert()` 和 `prompt()`
    函数的内容，以及如何编写你自己的函数。


    ## 结


    恭喜你！你刚刚尝到了 JavaScript 的滋味！在下一章节中，我们将讨论你可以使用的信息类型以及如何对它们进行操作，这会变得更有趣。你还将窥见如何帮助程序做出决策，以及当程序没有按照预期方式运行时该怎么办。一次性吸收这么多量很大，所以休息一下，当你准备好深入学习
    JavaScript 基础时回来。


    # 第 3 章：JavaScript 基础


    由于本章内容很多，以下是你可以学习内容的概述：


    1. **数据类型**——JavaScript 如何分类信息。这很重要，因为知道你拥有什么类型的信息将告诉你可以对该信息做什么（例如，你不能用 5 去乘以苹果）。

    2. **比较运算符**——让你比较某些类型的信息（例如，5 小于 10 吗？）。当你想要给计算机依赖某些条件的指令时非常有用（例如，如果年龄大于 18）。

    3. `console.log()`——让你显示单行代码的输出——当你想要信息在程序中如何流动时有用。

    4. **流程控制**——`if-else` 语句根据满足的条件给计算机不同的指令（例如，如果年龄大于 18 允许用户进入站点，否则显示错误消息）。

    5. **调试**——当你的程序运行异常时（例如，拼写错了用户名或完全忘记了它），你需要找到代码的哪部分搞乱了程序的行为——这个过程被称为调试。当代码跨越数行时，这可能会变得令人生畏——知道从哪里查看会有帮助。


    到为止，你已经使用 JavaScript 操作了字符串和数字。在编程世界中，这些信息类别被称为数据类型。


    ## 数据类型


    数据类型简单地告诉计算机应该如何读取你的信息。例如，如果你在控制台中输入以下内容：


    ```javascript

    "5" + "5"

    ```


    你会得到 `"55"`。这是因为通过引号包裹 5，你是在告诉解释器你希望将 5 视为字符串而不是数字。那么，加法运算符不是相加两个数字，而是合并两个字符串。现在尝试删除引号，注意输出是如何变为
    10 的。不同的数据类型可以做不同的事情，所以知道使用哪一个至关重要：


    1. **字符串**——任何封装在引号中的内容最终都会成为字符串。这可以是字母、空格、数字、标点符号和其他符号的组合。

    2. **数字**——自言明明；数字是你可以执行加法、减法、乘法和除法等的操作。记住不要加引号，否则你会把它们变成字符串！

    3. **布尔值**——布尔值只有真（true）或假（false）的数据类型。这与字符串或数字不同，因为它帮助计算机根据是否满足某些条件做出决策。例如，如果你想防止未成年人注册你的站点，你需要某种代码来将未成年人和成人分开，如：


    ```javascript

    var age = 17

    ```


    ## 比较运算符


    到为止，我们讨论了三种数据类型（数字、字符串和布尔值），以及一些基础数学运算符（`+`、`,``*`、`/`）。然而，你刚刚测试布尔值使用的是比较运算符（`<`
    `>`, `=`），它们在管理程序流程中极其重要。以下是完整列表及其功能：


    - `>` 大于

    - `<` 小于

    - `>=` 大于等于

    - `<=` 小于等于

    - `==` 等

    - `!=` 不等于


    要测试这些运算符，请将以下语句中的 `@` 符号替换为正确的运算符，使控制台输出为 true：


    ```javascript

    console.log(5 @ 1);console.log(1 @ 5);console.log(5 @ 2);console.log(1 @ 6);console.log(5
    @ 5);console.log(10 @ 5);

    ```


    ## 了解解释器在想什么


    注意 JavaScript 解释器只会给你输入的命令的最新输出，所以如果你输入了三行应该有不同输出的代码：


    ```javascript

    5 > 106 < 127 > 14

    ```


    在控制台中同时执行这些内容，你只会得到最后一行的结果（false）。


