  trans: "\n\n```javascript\nvar computeSum = function (firstNumber, secondNumber){\n\
    \    var result = firstNumber + secondNumber;\n    return result;\n};\n```\n\n\
    通过这种方式，你现在可以像对待数字一样对待 `computeSum()` 函数了！尝试运行这些代码：\n\n```javascript\nconsole.log(computeSum(5,\
    \ 5) + 10)\nconsole.log(computeSum(7, 8) / 10)\nconsole.log(computeSum(9, 10)\
    \ - 10)\nconsole.log(computeSum(4, 4) * 10)\nconsole.log(computeSum(42, 34) %\
    \ 2)\n```\n\n# 优化：在可读性与简洁性之间寻找完美平衡\n\n既然你正在学习越来越多复杂的编程方法，现在是讨论代码可读性的绝佳时机。识别一个新手程序员的一种简单方法是看代码的长短和可读性。例如，我们的\
    \ `computeSum()` 函数虽然完全易于读，但仍然可以缩短为：\n\n```javascript\nvar computeSum = function\
    \ (firstNumber, secondNumber){\n    return firstNumber + secondNumber;\n};\n```\n\
    \n这让代码少了一行，而且看起来并不凌乱。然而，在某些情况下，你必须仔细考虑选择简洁是否会让你的代码变得太难以理解，例如，看看这个简单的 if-else 语句：\n\
    \n```javascript\nif (5 > 7){\n    console.log('5 is greater than 7');\n}else{\n\
    \    console.log('7 is greater than 5');\n}\n```\n\n它非常易于阅读，但你实际上可以使用所谓的“三元表达式”将其简化为单行：\n\
    \n```javascript\n5 > 7 ? console.log('5 is greater than 7') : console.log('7 is\
    \ greater than 5');\n```\n\n现在语句变得紧凑得多，但同时也降低了可读性。三元表达式真的只应该在你根据条件进行赋值时使用，例如：\n\
    \n```javascript\nvar greaterNum = 5 > 7 ? 5 : 7;\n```\n\n这一行如果 `greaterNum` 大于\
    \ 7，则将 5 赋值给它，否则将 7 赋值给它。\n\n尽管如此，请记住有许多方法可以让你的代码更简洁且易读。为了简洁性，你需要确保你的优化是有理依据且被正确使用的（如三元运算符所示）。至于易读性，这很大程度上取决于你是否为变量和函数使用了正确的名称，以及编写代码的方式是否保持一致。\n\
    \n# 全局变量与局部变量\n\n我们已经讨论过变量在创建它们的函数内部之外无法在代码的任何地方访问。这些被称为局部变量。全局变量是在函数外部声明的，可以在代码的任何地方访问。例如：\n\
    \n```javascript\nvar x = 10; // 这是一个全局变量，因为不是在函数内部声明的\nturnToZero = function(number)\
    \ {\n    number = 0;\n    console.log(\"The value of x is now: \" + x);\n};\n\
    turnToZero(x);\nconsole.log(\"Outside the function the value of x is: \" + x);\n\
    ```\n\n注意变量 `x` 在 `turnToZero()` 函数内部仍然被访问。这就是很多初学者困惑的地方：当你将一个变量传递给函数时，就像我们刚才调用的那样：\n\
    \n```javascript\nturnToZero(x);\n```\n\n你只是将 `x` 的值复制到函数中，并将其放入名为 `number` 的临时变量里。这意味着当你对变量\
    \ `number` 进行操作时，你并没有对 `x` 执行任何操作。这就是为什么 `turnToZero` 函数是没用的；当你将一个变量传递给它时，改变的是临时变量的值，而不是实际变量。\n\
    \n尽管如此，你并不非要把全局变量传递给函数来修改它的值。我们可以简单这样做：\n\n```javascript\nvar x = 10; // 这是一个全局变量，因为不是在函数内部声明的\n\
    turnToZero = function() {\n    x = 0;\n    console.log(\"The value of x is now:\
    \ \" + x);\n};\nconsole.log(\"Before calling the function, the value of x is:\
    \ \" + x);\nturnToZero();\nconsole.log(\"After calling the function, the value\
    \ of x is now: \" + x);\n```\n\n简而言之，`var` 关键字除了告诉计算机你在声明一个变量外，还告诉解释器在当前作用域中创建一个变量，这就是为什么如果它在函数内部创建，它将只存在于函数内部；如果在函数外部创建，它将存在于整个代码中。考虑到此，你可能会奇怪，既然全局变量更容易使用，为什么还需要局部变量？这是因为全局变量会让程序更难阅读和调试。当你开始编写更复杂的\
    \ JavaScript 代码时，你会注意到这一点，但目前，最好不要在函数内部尝试修改全局变量，除非你确切知道为什么。\n\n# 结论\n\n通过对函数、变量和数据处理有更好的了解，你现在可以创建更整洁、更高效的代码！在下一章中，你将学习如何在一个变量名下存储不同类型的信息（数组），以及如何重复执行代码。\n\
    \n# 第 5 章：循环与数组\n\n我们已经讨论了函数以及它们是如何构造的。现在，如果你想打印一百行内容该呢？由于函数可以让我们的代码更整洁，我们可以这样做：\n\
    \n```javascript\nvar consoleMessage = function(){\n    console.log(\"I will not\
    \ waste space\");\n    // ... 很多行 ...\n    console.log(\"I will not waste space\"\
    );\n    // ... 假设这里还有 96 行\n    console.log(\"I will not waste space\");\n};\n\
    ```\n\n这样你只需要调用 `consoleMessage()` 就能执行百行命令。遗憾的是，手动输入百次 `console.log` 语句仍然非常冗余。由于我们总是想要缩短代码，我们选择了一种更高效的方法来重复代码——使用循环！\n\
    \n## For 循环 (For-Loops)\n\n循环告诉计算机在指定的次数内执行一组操作。循环的格式为：\n\n```javascript\nfor\
    \ (var <变量名> = <初始值>; <条件>; <迭代>){\n    <需要重复的操作>\n}\n```\n\n如果我们把之前的示例改为循环，它看起来是这样的：\n\
    \n```javascript\nfor (var counter = 1; counter <= 100; counter++){\n    console.log(\"\
    I will not waste space\");\n}\n```\n\n与其手动输入百次 `console.log` 语句，我们可以使用循环来完成任务。现在，让我们仔细观察循环的各个部分：\n\
    \n`var counter = 1`\n\n这是循环的第一部分。我们创建这个变量是为了跟踪循环内部代码块执行的次数。当循环结束，这个变量就会消失。\n\n\
    `counter <= 100`\n\n这是执行循环内部代码前需要满足的条件。只要这个语句为真，循环内部的代码就会反复执行。请注意不要创建一个永远为真的条件（例如\
    \ `100 == 100`），否则你将陷入所谓的死循环！\n\n`counter++`\n\n"
- fmt: "\nThis is an iteration statement that adds 1 to the variable `counter`. This\
    \ makes sure that eventually, the `counter` will reach 100 and will therefore\
    \ cause the `counter <= 100` statement to return false. Without this statement,\
    \ the `counter` will stay at 1, and the `counter <= 100` statement will always\
    \ return true!\n\nThese three statements are what help for-loops run a chunk of\
    \ code for a precise number of times. Here are a bunch of additional tips to help\
    \ you create for-loops better:\n\n1.  You can also count backwards if you want,\
    \ changing the condition from `(<)` or `(<=)` to `(>)` or `>=` and then decrementing\
    \ `counter--`.\n\n2.  You can also increment or decrement with any other number\
    \ by writing something like `counter+=n` or `counter-=n` where `n` is the number\
    \ you want to add or subtract to the `counter`.\n\n3.  Be careful with the conditions\
    \ you set! If you create a for-loop that results in an infinite loop, your browser\
    \ will crash!\n\nThat being said, here’s a code that’ll result in an infinite\
    \ loop, and consequently, a browser crash:\n\n```\nfor (var counter = 1; counter\
    \ <= 10; counter--){\n    console.log(counter);\n}\n```\n\nAs an exercise, change\
    \ this for-loop so that it ends up displaying the numbers 1-10 in the console.\n\
    \n## Arrays\n\nIf you wanted to, say, record ten names, without using arrays,\
    \ you’d have to do something like:\n\n```javascript\nvar name1, name2, name3,\
    \ name4, name5, name6, name7, name8, name9, name10;\n```\n\nAnd this is only for\
    \ declaring the variables! Here’s how messy it would be if you actually have to\
    \ store user input using this method:\n\n```javascript\nfor (var counter = 1;\
    \ counter <= 10; counter++){\n    if(counter == 1)\n    {\n        name1 = prompt('Please\
    \ enter name 1: ');\n    }\n    if(counter == 2)\n    {\n      name2 = prompt('Please\
    \ enter name 2: ');\n    }\n    if(counter == 3)\n    {\n        name3 = prompt('Please\
    \ enter name 3: ');\n    }\n    if(counter == 4)\n    {\n        name4 = prompt('Please\
    \ enter name 4: ');\n    }\n    if(counter == 5)\n    {\n        name5 = prompt('Please\
    \ enter name 5: ');\n    }\n    if(counter == 6)\n    {\n        name6 = prompt('Please\
    \ enter name 6: ');\n    }\n    if(counter == 7)\n    {\n        name7 = prompt('Please\
    \ enter name 7: ');\n    }\n    if(counter == 8)\n    {\n        name8 = prompt('Please\
    \ enter name 8: ');\n    }\n    if(counter == 9)\n    {\n        name9 = prompt('Please\
    \ enter name 9: ');\n    }\n    if(counter == 10)\n    {\n        name10 = prompt('Please\
    \ enter name 10: ');\n    }\n}\n```\n\nNow imagine if social media sites used\
    \ this method to register the users; programmers would have to keep recoding the\
    \ site in order to accommodate more users! Fortunately, we have arrays to help\
    \ us.\n\nArrays, in a nutshell, can store lists of data that could even have different\
    \ data types. The data stored have fixed positions, so you’re sure of where each\
    \ data is placed and can therefore retrieve them reliably. Here are examples of\
    \ array declarations:\n\n```javascript\nvar strings = [\"apple\",\"grapes\",\"\
    tomatoes\"];\nvar numbers = [1, 2, 3, 4, 5];\nvar stringsAndNumbers = [\"Oceans\"\
    , 11];\n```\n\nAs you may have noticed, the declaration statements for arrays\
    \ are pretty similar to the declaration statements for regular variables; the\
    \ only difference is that the data are enclosed in braces and separated by commas.\
    \ If you want to create an empty array, you can leave the braces blank and add\
    \ a couple of items later using the `push()` function, for instance:\n\n```javascript\n\
    var numbers = [];\nfor (var counter = 1; counter <= 10; counter++){\n    numbers.push(counter);\n\
    }\n```\n\nNow we can go back to our previous attempt at getting ten names! Let’s\
    \ see how using arrays drastically improves our code:\n\n```javascript\nvar names\
    \ = [];\nfor (var counter = 1; counter <= 10; counter++){\n    names.push(prompt('Please\
    \ enter name ' + counter + ':'));\n    console.log('Obtained name ' + counter);\n\
    }\n```\n\nOur code just became much more efficient and much better to:\n\nNow\
